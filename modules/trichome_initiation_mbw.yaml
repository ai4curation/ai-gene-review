id: MODULE:trichome_initiation_mbw
title: Leaf trichome initiation and patterning by the MYB-bHLH-WD40 activator complex and R3 MYB lateral
  inhibitors
description: >-
  Arabidopsis leaf trichomes (unicellular epidermal hairs) are spaced by a cell-autonomous activator
  complex and mobile inhibitors. In the leaf primordium epidermis an MYB-bHLH-WD40 (MBW) activator complex
  forms from the R2R3-MYB GLABRA1 (GL1; MYB23 acts partially redundantly), the redundant bHLH proteins
  GLABRA3 (GL3) and ENHANCER OF GLABRA3 (EGL3), and the WD40-repeat protein TRANSPARENT TESTA GLABRA1
  (TTG1); GL3/EGL3 bridge GL1 and TTG1. The active complex binds and activates the promoters of the
  HD-ZIP IV transcription factor GLABRA2 (GL2), which executes trichome differentiation, and of the
  single-repeat R3 MYB inhibitors CAPRICE (CPC), ENHANCER OF TRY AND CPC1 (ETC1) and TRIPTYCHON (TRY).
  The R3 MYB proteins lack an activation domain; they move into neighbouring epidermal cells, bind GL3/EGL3
  and compete with GL1, so that inactive complexes form there and those cells remain pavement cells
  (lateral inhibition). TRY also represses its own promoter, and TTG1 depletion from cells surrounding a
  trichome by GL3-dependent trapping contributes a second, trapping/depletion patterning mechanism. TRY
  suppresses trichome clustering, CPC mainly sets trichome density, and try cpc double mutants convert all
  cells contacting a trichome into trichomes. Jasmonate (JAZ) and gibberellin (DELLA) repressors bind GL1
  and GL3/EGL3 and modulate the complex; these hormone inputs, the root epidermis WER-GL3/EGL3-TTG1 module
  that specifies non-hair cells, and the seed coat/anthocyanin MBW complexes built on TT8 and TT2/PAP MYBs
  share components with this module but are outside its boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:18766177
    title: A competitive complex formation mechanism underlies trichome patterning on Arabidopsis leaves.
    statement: The GL1-GL3/EGL3-TTG1 complex activates TRY; TRY and CPC move between cells and compete with
      GL1 for GL3/EGL3 binding.
    supporting_text: >-
      These inhibitors can compete with the R2R3 MYB factor for binding to GL3/EGL3 in yeast three-hybrid
      assays
  - source_id: PMID:12356720
    title: TRIPTYCHON and CAPRICE mediate lateral inhibition during trichome and root hair patterning in
      Arabidopsis.
    statement: TRY and CPC act together during lateral inhibition in trichome patterning.
    supporting_text: Both genes are expressed in trichomes and act together during lateral inhibition.
  - source_id: PMID:18434419
    title: The TTG1-bHLH-MYB complex controls trichome cell fate and patterning through direct targeting
      of regulatory loci.
    statement: GL1 occupies the GL2, TTG2, CPC and ETC1 promoters in vivo; TTG1, GL3 and GL1 form a
      complex; CPC but not the activators moves between epidermal cells.
    supporting_text: >-
      Using particle bombardment, we show that TTG1, GL3, GL1 and the homeodomain protein GL2 do not move
      between adjacent epidermal cells, while the R3-MYB, CPC, does move to neighboring cells.
  - source_id: PMID:18547143
    title: 'Two-dimensional patterning by a trapping/depletion mechanism: the role of TTG1 and GL3 in Arabidopsis
      trichome formation.'
    statement: TTG1 moves between cells and is trapped by GL3 in trichome cells, depleting it from neighbours.
    supporting_text: >-
      TTG1-YFP depletion depends on GLABRA3 (GL3), suggesting that the depletion is governed by a trapping
      mechanism.
  - source_id: PMID:38504903
    title: Quantitative analysis of MBW complex formation in the context of trichome patterning.
    statement: R3 MYB inhibitors bind GL3 more weakly than the trichome-promoting MBW proteins in quantitative
      pull-down assays.
    supporting_text: >-
      We find similar binding strength between the trichome promoting genes and weaker binding of the R3MYB
      inhibitors.
notes: >-
  Concrete Arabidopsis module grounded in the gene reviews for GL1, GL3, EGL3, TTG1, GL2, TRY and CPC
  (UniProt accessions from each gene folder's uniprot.txt). Partially redundant members without gene
  reviews (MYB23, ETC1, ETC2, ETC3, TCL1, TCL2, CPL3) are named in the description but not modelled as
  annotons. TT8 is excluded: it is the seed-coat/anthocyanin bHLH and is not required for leaf trichome
  initiation (gl3 egl3 is already glabrous; tt8 adds only the seed and anthocyanin defects). No GO-CAM
  in gocams/index.tsv contains any member gene, so no gocam_associations are given. No PANTHER family ids
  are asserted. The R3 MYB inhibitor molecular function is modelled as GO:0140416 transcription regulator
  inhibitor activity (competitive sequestration of the bHLH partner); whether R3 MYB-containing complexes
  also sit on DNA as inactive complexes remains unresolved.
module:
  id: trichome_initiation_mbw
  label: MBW-dependent leaf trichome initiation and lateral inhibition
  module_type: DEVELOPMENTAL_PROCESS
  description: >-
    Activator-inhibitor network that selects single trichome cells in the leaf epidermis: an MBW activator
    complex induces GL2 and mobile R3 MYB inhibitors, which suppress complex formation in neighbouring cells.
  concepts:
    - preferred_term: trichome patterning
      term:
        id: GO:0048629
        label: trichome patterning
      description: Selection and spacing of trichome cells in the leaf epidermis.
    - preferred_term: trichome differentiation
      term:
        id: GO:0010026
        label: trichome differentiation
      description: Execution of trichome fate in selected cells (via GL2).
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    anatomical_locations:
      - preferred_term: leaf epidermis
        term:
          id: PO:0006016
          label: leaf epidermis
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: MBW activator complex
      node:
        id: mbw_activator_complex
        label: GL1-GL3/EGL3-TTG1 trichome activator complex
        module_type: PROTEIN_COMPLEX
        description: >-
          Cell-autonomous activator complex in which the bHLH protein (GL3 or EGL3) binds both the R2R3-MYB
          GL1 and the WD40 protein TTG1. The complex occupies and activates the GL2, CPC, ETC1 and TRY
          promoters in incipient trichome cells.
        annotons:
          - id: gl1_r2r3_myb_activator
            label: 'GL1: R2R3-MYB DNA-binding activator subunit'
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GL1 (Arabidopsis)
                term:
                  id: UniProtKB:P27900
                  label: Trichome differentiation protein GL1
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:18434419
                  statement: GL1 binds the promoters of GL2, TTG2, CPC and ETC1 in vivo.
                  supporting_text: >-
                    In vivo binding of the R2R3-MYB protein GLABRA1 (GL1) to the promoters of GLABRA2 (GL2),
                    TRANSPARENT TESTA GLABRA2 (TTG2), CAPRICE (CPC) and ENHANCER OF TRIPTYCHON AND CAPRICE1
                    (ETC1) establishes that these genes are major transcriptional targets for the
                    TTG1-bHLH-MYB regulatory complex.
            processes:
              - preferred_term: trichome patterning
                term:
                  id: GO:0048629
                  label: trichome patterning
              - preferred_term: plant epidermal cell fate specification
                term:
                  id: GO:0090628
                  label: plant epidermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Sequence-specific DNA-binding R2R3-MYB subunit; cell autonomous.
          - id: ttg1_wd40_scaffold
            label: 'TTG1: WD40-repeat coregulator subunit'
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TTG1 (Arabidopsis)
                term:
                  id: UniProtKB:Q9XGN1
                  label: Protein TRANSPARENT TESTA GLABRA 1
            function:
              preferred_term: transcription coregulator activity
              term:
                id: GO:0003712
                label: transcription coregulator activity
              evidence:
                - source_id: PMID:11063707
                  statement: GL3 binds GL1, TTG1 and itself, whereas GL1 and TTG1 do not interact directly.
                  supporting_text: >-
                    Yeast two-hybrid assays indicate that GL3 participates in physical interactions with GL1,
                    TTG1, and itself, but that GL1 and TTG1 do not interact.
            processes:
              - preferred_term: trichome differentiation
                term:
                  id: GO:0010026
                  label: trichome differentiation
              - preferred_term: plant epidermal cell fate specification
                term:
                  id: GO:0090628
                  label: plant epidermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              WD40 coregulator recruited through the bHLH subunit; mobile, and trapped in trichome cells by
              GL3 (trapping/depletion contribution to patterning).
            evidence:
              - source_id: PMID:18547143
                statement: TTG1 moves between cells and is depleted from cells around trichomes in a
                  GL3-dependent manner.
                supporting_text: >-
                  TTG1-YFP depletion depends on GLABRA3 (GL3), suggesting that the depletion is governed by a
                  trapping mechanism.
        variant_sets:
          - id: mbw_bhlh_subunit
            label: bHLH subunit of the trichome MBW complex
            axis: partially redundant subgroup IIIf bHLH paralog
            selection: ONE_OR_MORE
            notes: >-
              gl3 single mutants have fewer trichomes, egl3 single mutants are near wild type, and the gl3
              egl3 double mutant is glabrous, so either paralog can supply the bHLH subunit.
            evidence:
              - source_id: PMID:12917293
                statement: EGL3 is required for trichomes only in the absence of GL3.
                supporting_text: When mutated, egl3 gives totally glabrous plants only in the gl3 mutant
                  background.
            variants:
              - id: gl3_bhlh_variant
                label: GL3 bHLH subunit
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: gl3_bhlh_bridge
                    label: 'GL3: bHLH bridging subunit'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GL3 (Arabidopsis)
                        term:
                          id: UniProtKB:Q9FN69
                          label: Transcription factor GLABRA 3
                    function:
                      preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                      term:
                        id: GO:0000981
                        label: DNA-binding transcription factor activity, RNA polymerase II-specific
                      evidence:
                        - source_id: PMID:17885086
                          statement: GL3 binds and activates the GL2, CPC and ETC1 promoters within hours of
                            induction, in a GL1-dependent manner.
                          supporting_text: >-
                            The in vivo binding of GL3 to the promoters of these genes requires the presence of
                            the R2R3-MYB factor GL1
                    processes:
                      - preferred_term: trichome differentiation
                        term:
                          id: GO:0010026
                          label: trichome differentiation
                      - preferred_term: plant epidermal cell fate specification
                        term:
                          id: GO:0090628
                          label: plant epidermal cell fate specification
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Binds GL1 and TTG1; target of competition by R3 MYB inhibitors.
              - id: egl3_bhlh_variant
                label: EGL3 bHLH subunit
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: egl3_bhlh_bridge
                    label: 'EGL3: redundant bHLH bridging subunit'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGL3 (Arabidopsis)
                        term:
                          id: UniProtKB:Q9CAD0
                          label: Transcription factor EGL1
                    function:
                      preferred_term: DNA-binding transcription factor activity
                      term:
                        id: GO:0003700
                        label: DNA-binding transcription factor activity
                      evidence:
                        - source_id: PMID:17885086
                          statement: EGL3 shares direct promoter targets with GL3.
                          supporting_text: we show that EGL3 shares some direct targets with GL3
                    processes:
                      - preferred_term: trichome differentiation
                        term:
                          id: GO:0010026
                          label: trichome differentiation
                      - preferred_term: plant epidermal cell fate specification
                        term:
                          id: GO:0090628
                          label: plant epidermal cell fate specification
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Interacts with TTG1, GL1, CPC and TRY and heterodimerizes with GL3.
                    evidence:
                      - source_id: PMID:12917293
                        statement: EGL3 binds TTG1, GL1, CPC and TRY and heterodimerizes with GL3.
                        supporting_text: >-
                          Yeast two-hybrid and plant overexpression studies show that EGL3, like GL3, interacts
                          with TTG1, the myb proteins GL1, PAP1 and 2, CPC and TRY, and it will form
                          heterodimers with GL3.
    - order: 2
      role: trichome fate execution
      node:
        id: gl2_trichome_fate_execution
        label: GL2-dependent trichome differentiation
        module_type: REGULATORY_STEP
        description: >-
          GL2, a direct MBW target, is an HD-ZIP IV transcription factor expressed in trichome precursors that
          is required for normal trichome morphogenesis and acts downstream of the patterning machinery.
        annotons:
          - id: gl2_hdzip_effector
            label: 'GL2: HD-ZIP IV transcriptional effector of trichome fate'
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GL2 (Arabidopsis)
                term:
                  id: UniProtKB:P46607
                  label: Homeobox-leucine zipper protein GLABRA 2
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:7926739
                  statement: GL2 encodes a homeodomain protein expressed in trichome progenitor cells.
                  supporting_text: >-
                    the gene is expressed in trichome progenitor cells and at stages associated with trichome
                    development
            processes:
              - preferred_term: plant epidermal cell fate specification
                term:
                  id: GO:0090628
                  label: plant epidermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Downstream effector of the MBW complex in incipient trichome cells.
            evidence:
              - source_id: PMID:18766177
                statement: GL2 is a downstream target of the MBW machinery thought to trigger trichome formation.
                supporting_text: >-
                  One downstream target of this machinery is the homeobox transcription factor GLABRA2 (GL2),
                  which is thought to trigger the actual process of trichome formation
    - order: 3
      role: R3 MYB lateral inhibition
      node:
        id: r3myb_lateral_inhibition
        label: Mobile R3 MYB inhibition of MBW complex formation
        module_type: REGULATORY_STEP
        description: >-
          Single-repeat R3 MYB proteins induced by the activator complex move to neighbouring cells, bind
          GL3/EGL3 and compete with GL1, preventing active MBW complex formation (lateral inhibition). TRY
          and CPC are modelled; ETC1, ETC2, ETC3, TCL1, TCL2 and CPL3 act partially redundantly.
        annotons:
          - id: try_r3myb_inhibitor
            label: 'TRY: mobile R3 MYB inhibitor (cluster suppression)'
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TRY (Arabidopsis)
                term:
                  id: UniProtKB:Q8GV05
                  label: Transcription factor TRY
            function:
              preferred_term: transcription regulator inhibitor activity
              term:
                id: GO:0140416
                label: transcription regulator inhibitor activity
              evidence:
                - source_id: PMID:14561633
                  statement: TRY prevents the GL1-GL3 interaction in yeast.
                  supporting_text: TRY has the ability to prevent the GL1 GL3 interaction
            processes:
              - preferred_term: regulation of trichome patterning
                term:
                  id: GO:1900032
                  label: regulation of trichome patterning
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Induced by GL1-GL3, moves to neighbouring cells, binds GL3/EGL3 and competes with GL1;
              loss causes trichome clusters.
            evidence:
              - source_id: PMID:18766177
                statement: TRY is transcriptionally activated by GL1 and GL3, and TRY and CPC move between cells.
                supporting_text: >-
                  We show experimentally that the trichome inhibitor TRIPTYCHON is transcriptionally activated
                  by the known positive regulators GLABRA1 and GLABRA3.
          - id: cpc_r3myb_inhibitor
            label: 'CPC: mobile R3 MYB inhibitor (trichome density)'
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CPC (Arabidopsis)
                term:
                  id: UniProtKB:O22059
                  label: Transcription factor CPC
            function:
              preferred_term: transcription regulator inhibitor activity
              term:
                id: GO:0140416
                label: transcription regulator inhibitor activity
              evidence:
                - source_id: PMID:14627722
                  statement: GL3/EGL3 interact with CPC, which blocks the activator pathway.
                  supporting_text: >-
                    they interact with the incomplete MYB protein CPC in the H position, which blocks the
                    non-hair pathway and leads to the hair cell fate
            processes:
              - preferred_term: regulation of trichome patterning
                term:
                  id: GO:1900032
                  label: regulation of trichome patterning
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              GL1/GL3 target that moves between epidermal cells and competes with the R2R3-MYB activator for
              GL3/EGL3; loss raises trichome density and enhances try clustering.
            evidence:
              - source_id: PMID:12356720
                statement: CPC competes with the GL3 homolog R in trichome formation.
                supporting_text: >-
                  An attractive explanation for this finding is that CPC competes with the R gene homolog GL3 in
                  Arabidopsis
  connections:
    - source: mbw_activator_complex
      target: gl2_trichome_fate_execution
      connection_type: POSITIVELY_REGULATES
      description: The MBW complex binds and activates the GL2 promoter in incipient trichome cells.
      evidence:
        - source_id: PMID:18434419
          statement: GL2 is a direct in vivo target of the TTG1-bHLH-MYB complex.
          supporting_text: >-
            establishes that these genes are major transcriptional targets for the TTG1-bHLH-MYB regulatory
            complex
    - source: mbw_activator_complex
      target: r3myb_lateral_inhibition
      connection_type: POSITIVELY_REGULATES
      description: The MBW complex activates transcription of the R3 MYB inhibitor genes (CPC, ETC1, TRY).
      evidence:
        - source_id: PMID:18644155
          statement: GL1 or WER with GL3 or EGL3 are required and sufficient to activate TRY and CPC transcription.
          supporting_text: >-
            GL1 or WER and GL3 or EGL3 are required and sufficient to activate the transcription of TRY, CPC,
            ETC1 and ETC3
    - source: r3myb_lateral_inhibition
      target: mbw_activator_complex
      connection_type: NEGATIVELY_REGULATES
      description: >-
        R3 MYB inhibitors move to neighbouring cells and compete with GL1 for GL3/EGL3, preventing active
        complex formation there (lateral inhibition feedback loop).
      evidence:
        - source_id: PMID:18766177
          statement: TRY and CPC, but not GL1 and GL3, move between cells.
          supporting_text: TRIPTYCHON and CAPRICE but not GLABRA1 and GLABRA3 can move between cells
