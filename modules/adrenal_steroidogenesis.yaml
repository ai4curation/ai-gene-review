notes: Primary reaction evidence and comparative member reviews govern the family restrictions. Exact
  family labels were read from PANTHER; source-disputed placements are explicit and do not establish evolutionary
  relationships. No unverified PAINT ancestral node is asserted. All eleven native representatives and
  two comparative fish paralogs have completed individual reviews; unresolved claims remain explicit.
  Free-text lyase and terminal 18-oxidase activities require manual conformance review against the proposed
  molecular functions in gene reviews.
