  notes: The two entry steps are shared; optional downstream parts encode alternative branches in a species/tissue-specific
    realization, not dispensability of a reaction within a chosen branch. Display order is not a single
    linear chronology. HSD3B reactions are split by substrate and by dehydrogenase/isomerase activity
    so the graph does not imply an artificial CYP17-HSD3B cycle. CYP17A2 has hydroxylase activity without
    lyase; CYP11C1 is not an aldosterone synthase merely because it shares a named PANTHER subfamily.
    Redox partners (POR, ferredoxin reductase and ferredoxin, with cytochrome b5 modulation) are required
    biochemical context outside the present member boundary. Cortisol/cortisone interconversion, steroid
    sulfation, aromatization, backdoor and downstream 11-oxygenated androgen pathways are outside scope.
    The normal adult mouse/rat corticosterone pattern has a documented fetal mouse CYP17 exception. The
    two additional reviewed zebrafish paralogs cyp11a1.1 and cyp17a1 are comparative evidence, not asserted
    interrenal representatives.
references:
- id: PMID:21051590
  title: The molecular biology, biochemistry, and physiology of human steroidogenesis and its disorders.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected. Mechanistic and human tissue framework; not evidence that the
      human gene complement, expression pattern or steroid output is universal across vertebrates. Older
      exclusive allosteric descriptions of cytochrome b5 require evaluation against later primary electron-transfer
      experiments.
  findings:
  - statement: The review distinguishes StAR-controlled acute cholesterol delivery from CYP11A1-dependent
      pregnenolone formation; the downstream enzyme complement determines steroid output.
    supporting_text: the acute regulation of steroidogenesis is determined by the action of StAR, P450scc
      is the enzymatic rate-limiting step in steroidogenesis.
  - statement: Mitochondrial CYP11 enzymes and microsomal CYP17/CYP21 enzymes use different electron-transfer
      partners. Their reaction nodes must not imply that an isolated P450 supplies its own reducing equivalents.
  - statement: CYP21-mediated 21-hydroxylation supplies both corticosteroid branches, while HSD3B and
      CYP17 perform distinct reactions that can be ordered differently depending on the substrate route.
- id: PMID:26038201
  title: Adrenal steroidogenesis and congenital adrenal hyperplasia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected. Its broad rodent statement is restricted to the normal adult
      mouse/rat comparison in this audit; fetal mouse expression is assessed separately using primary
      evidence.
  findings:
  - statement: The comparative review describes corticosterone rather than cortisol as the dominant rodent
      adrenal glucocorticoid when adrenal CYP17A1 is absent; a human cortisol-centered path cannot be
      treated as universal.
    supporting_text: In rodents and many small animals, the ZF lacks CYP17A1.
  - statement: Human zonal expression separates aldosterone, cortisol and adrenal androgen outputs. A
      family selector must be constrained by the activity and tissue context needed for the particular
      branch.
- id: PMID:27524977
  title: 'Adrenal Mitochondria and Steroidogenesis: From Individual Proteins to Functional Protein Assemblies.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected. Use the mechanistic main text and its cited primary work. Figure
      2B incorrectly calls a terminal cortisol enzyme microsomal CYP11B2; the main text correctly describes
      mitochondrial CYP11B1. The CYP11B3 product wording is also unsuitable as precise chemical evidence.
      TSPO complex proposals are not treated as an obligatory pathway component.
  findings:
  - statement: Cattle and pig CYP11B architectures differ from the two-human-paralog scheme; gene duplication
      and functional partitioning must not be conflated with the presence of individual reactions.
    supporting_text: cattle and pigs possess a single enzyme, CYP11B (66, 67)
  - statement: C18 hydroxylation and terminal C18 oxidation are distinct reactions. CYP11B1 can perform
      some C18 hydroxylation, whereas completion to aldosterone requires the terminal oxidative activity.
- id: PMID:35263051
  title: 'Classic and current concepts in adrenal steroidogenesis: a reappraisal.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected. Its sentence linking lack of 18-oxidase to inability to form
      18-hydroxycorticosterone conflates consecutive chemical steps; use direct enzyme data to distinguish
      hydroxylation from oxidation. The module follows the canonical corticosteroid and DHEA/androstenedione
      branches.
  findings:
  - statement: The aldosterone branch comprises three successive oxidations from deoxycorticosterone,
      so a single corticosterone 18-monooxygenase term cannot stand for the full terminal pathway.
    supporting_text: ZG CYP11B2 catalyzes 3 sequential steps from DOC, generating B, 18OHB and, finally,
      aldosterone.
  - statement: The review discusses additional backdoor and 11-oxygenated androgen routes, which establish
      explicit neighboring scope rather than warranting an unbounded expansion of this canonical module.
- id: PMID:25445914
  title: 'Origin of the response to adrenal and sex steroids: Roles of promiscuity and co-evolution of
    enzymes and steroid receptors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Treat as comparative evolutionary context and not direct
      enzyme assays or proof of complete pathways in every sampled species.
  findings:
  - statement: Comparative genomic analysis places the vertebrate corticosteroid enzymes in a history
      of lineage-specific duplication, including independently derived aldosterone-synthase paralogs;
      family names alone do not establish matching products.
    supporting_text: CYP11B2, aldosterone synthase, evolved from separate gene duplications in at least
      old world monkeys and two suborders of rodents.
  full_text_unavailable: true
