id: MODULE:adrenal_steroidogenesis
title: Adrenal and interrenal steroidogenesis
description: Adrenal and interrenal steroidogenic cells convert cholesterol to pregnenolone and route
  it into corticosteroid or androgen branches. StAR-dependent cholesterol delivery and mitochondrial CYP11A
  cleavage supply the common entry. HSD3B and microsomal CYP17/CYP21 activities determine intermediate
  routes; mitochondrial CYP11 activities produce cortisol, corticosterone or aldosterone according to
  enzyme specificity and tissue expression. Human, mouse and zebrafish implementations share reactions
  but differ in paralog use, expression and terminal products.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:21051590
  title: The molecular biology, biochemistry, and physiology of human steroidogenesis and its disorders.
  statement: Defines the biochemical entry and canonical corticosteroid/androgen branches.
- source_id: PMID:26038201
  title: Adrenal steroidogenesis and congenital adrenal hyperplasia.
  statement: Explains tissue zonation and comparative glucocorticoid output.
- source_id: PMID:25445914
  title: 'Origin of the response to adrenal and sex steroids: Roles of promiscuity and co-evolution of
    enzymes and steroid receptors.'
  statement: Provides comparative enzyme evolution context without asserting universal pathway presence.
