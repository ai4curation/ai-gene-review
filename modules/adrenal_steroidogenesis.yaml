    notes: Vertebrata is a non-universal envelope for a repertoire of adrenal/interrenal reactions, not
      a claim that each vertebrate produces every endpoint. Native exemplars are human, mouse and zebrafish.
      Individual branches require the appropriate enzyme specificity and tissue expression.
