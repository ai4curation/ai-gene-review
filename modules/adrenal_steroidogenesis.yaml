              synthesis, linking transfer to the downstream steroidogenic reaction.
          - source_id: PMID:12530629
            title: The steroidogenic acute regulatory protein, StAR, works only at the outer mitochondrial
              membrane.
            statement: Membrane-targeted StAR constructs identify the outer mitochondrial membrane as
              the site of productive activity.
