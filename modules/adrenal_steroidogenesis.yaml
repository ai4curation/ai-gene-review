            title: Transfer of cholesterol between phospholipid vesicles mediated by the steroidogenic
              acute regulatory protein (StAR).
            statement: Purified StAR transfers cholesterol between artificial membranes, supporting a
              direct transfer activity rather than only a requirement inferred from steroid output.
          - source_id: PMID:7761400
