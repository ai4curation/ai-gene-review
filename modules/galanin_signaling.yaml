id: MODULE:galanin_signaling
title: Galanin-activated signaling pathway module
description: >-
  The galanin-activated signaling pathway (GO:0090663) is initiated when the secreted
  neuropeptide hormones galanin (GAL, PANTHER:PTHR16839:SF1; a 29- to 30-residue peptide
  sharing a strictly conserved N-terminal Trp2-Asn5-Tyr9 pharmacophore) and galanin-like
  peptide (GALP, PANTHER:PTHR20950:SF1; a 60-residue hypothalamic neuropeptide whose residues
  9-21 are identical to galanin residues 1-13) bind and activate the seven-transmembrane G
  protein-coupled galanin receptors GALR1 (PANTHER:PTHR24230:SF31), GALR2
  (PANTHER:PTHR24230:SF13), and GALR3 (PANTHER:PTHR24230:SF17) at the plasma membrane of
  central and peripheral neurons, pituitary cells, and pancreatic islet cells. Agonist-bound
  GALR1 and GALR3 couple primarily to pertussis-toxin-sensitive Gi/o heterotrimeric G proteins
  (exemplified by GNAI1, PANTHER:PTHR10218:SF359) to inhibit adenylate cyclase and open GIRK
  channels, whereas GALR2 couples primarily to Gq/11 proteins (exemplified by GNAQ,
  PANTHER:PTHR10218:SF329) to activate phospholipase C-beta (PLCB1, PANTHER:PTHR10336:SF12),
  mobilize IP3-sensitive intracellular Ca2+ stores, and modulate nociception, feeding,
  neuroendocrine secretion, and neuronal excitability.
status: DRAFT
evidence:
  - source_id: GO:0090663
    title: galanin-activated signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the galanin-activated
      signaling pathway (GO:0090663: the series of molecular signals generated as a consequence
      of a galanin receptor binding to its physiological ligand).
  - source_id: Reactome:R-HSA-375280
    title: Galanin receptors bind galanin
    supporting_text: >-
      There are three mapped and cloned human galanin receptors; GALR1 (Habert-Ortoli et al.
      1994), GALR2 (Fathi et al. 1997) and GALR3 (Smith et al. 1998). These receptors all bind the
      neuropeptide galanin which has effects on numerous physiological processes such as
      nociception, cognition, feeding, and hormone secretion (elliot-Hunt et al. 2007). GALR1 and
      GALR3 signal via the Gi/o pathway whilst GALR2 signals via the Gq/11 pathway (Mitsukawa et
      al. 2008).
    statement: >-
      Establishes that galanin binds and activates GALR1, GALR2, and GALR3, with GALR1/GALR3
      signaling through Gi/o and GALR2 signaling through Gq/11.
  - source_id: PMID:24602615
    title: Activation of galanin receptor 2 stimulates large conductance Ca(2+)-dependent K(+) (BK) channels through the IP3 pathway in human embryonic kidney (HEK293) cells.
    supporting_text: >-
      Moreover, the inositol-1,4,5-triphosphate receptor (IP3R) was identified as the mediator
      responsible for increased intracellular Ca(2+) activating BK channels. Taken together,
      activation of GalR2 leads to elevation of intracellular Ca(2+) is due to Ca(2+) efflux from
      ER through IP3R sequentially opening BK channels.
    statement: >-
      Demonstrates that galanin binding to GALR2 activates the Gq/11-PLC-IP3-Ca2+ signaling
      cascade.
  - source_id: PMID:25691535
    title: Galanin pathogenic mutations in temporal lobe epilepsy.
    supporting_text: >-
      Exome sequencing revealed that both twins carried a novel de novo mutation (p.A39E) in the
      GAL gene. Functional analysis revealed that the p.A39E mutant showed antagonistic activity
      against galanin receptor 1 (GalR1)-mediated response, and decreased binding affinity and
      reduced agonist properties for GalR2.
    statement: >-
      Demonstrates that wild-type human GAL acts as a direct peptide agonist of both GALR1 and
      GALR2.
  - source_id: PMID:10601261
    title: Isolation and cDNA cloning of a novel galanin-like peptide (GALP) from porcine hypothalamus.
    supporting_text: >-
      The amino acid sequence of GALP-(9-21) was completely identical to that of galanin-(1-13).
    statement: >-
      Establishes galanin-like peptide (GALP) as a 60-residue endogenous neuropeptide sharing a
      conserved 13-residue core with galanin (GAL residues 1-13 = GALP residues 9-21) that binds
      and activates galanin receptors (preferentially GALR2 over GALR1).
  - source_id: PANTHER:PTN008359337
    title: PAINT node PTN008359337 for galanin peptides (PTHR16839)
    statement: >-
      Local PAINT IBD node in PTHR16839 with propagated terms C:GO:0005576, C:GO:0030141,
      C:GO:0043025, F:GO:0005184, P:GO:0007189, P:GO:0007218; PAINT date 20260529.
notes: >-
  Curated signaling-pathway module for the galanin-activated signaling pathway (GO:0090663)
  built with PANTHER FAMILY/subfamily selectors across the two endogenous galanin-family
  neuropeptide ligands GAL (PANTHER:PTHR16839:SF1) and GALP (PANTHER:PTHR20950:SF1), their
  cognate GPCRs GALR1 (PANTHER:PTHR24230:SF31), GALR2 (PANTHER:PTHR24230:SF13), and GALR3
  (PANTHER:PTHR24230:SF17), and downstream Gi/o alpha (GNAI1, PANTHER:PTHR10218:SF359), Gq/11
  alpha (GNAQ, PANTHER:PTHR10218:SF329), and phospholipase C-beta (PLCB1,
  PANTHER:PTHR10336:SF12) effectors.
