id: MODULE:dmel_rhg_apoptosome_caspase_activation
title: RHG proteins, Diap1 and the Dark apoptosome in Drosophila caspase activation
description: >-
  In Drosophila cells, the initiator caspase Dronc is kept inactive by the inhibitor of apoptosis
  protein Diap1, an E3 ubiquitin ligase that binds and ubiquitylates Dronc and effector caspases.
  Apoptotic stimuli induce the RHG proteins Reaper (Rpr), Head involution defective (Hid),
  Grim and Sickle (Skl), which share an N-terminal IAP-binding motif. They bind Diap1, displace
  the caspases and promote Diap1 degradation. Freed Dronc is recruited by the adaptor Dark
  into the apoptosome, a wheel-shaped complex in which Dronc is activated and then cleaves
  the effector caspases drICE and Dcp-1. The mitochondrial serine protease HtrA2 (Omi) also
  binds IAPs and can promote cell death.
status: DRAFT
scope: CONCRETE
