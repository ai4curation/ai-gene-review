notes: >-
  Diap1 is not a member of the FlyBase APOP or RHG groups; it is added as a non-member gene
  because the RHG proteins act by antagonizing it. Effector caspases (Drice, Dcp-1) are downstream
  and are covered by apoptosis execution modules, not this one. Prx4 is kept because FlyBase
  places it in the RHG group, but its role as an IAP antagonist is not described here and
  should be checked. The upstream transcriptional induction of rpr, hid and grim (for example
  by p53 or ecdysone) is context. FlyBase groups realized by this module: APOP (FBgg0000129),
  RHG (FBgg0000177). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_rhg_apoptosome_caspase_activation.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
