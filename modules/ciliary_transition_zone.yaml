id: MODULE:ciliary_transition_zone
title: Ciliary transition zone MKS, NPHP and CEP290 modules
description: >-
  The ciliary transition zone (TZ) is the proximal region of the cilium, just
  distal to the basal body, where Y-shaped links connect the axonemal
  microtubules to the ciliary membrane. It acts as a gate that controls which
  proteins enter and leave the cilium. In nematodes and mammals the TZ is built
  from the same set of conserved, ciliopathy-associated protein modules. An
  RPGRIP1L-family assembly hub (MKS-5 in C. elegans) is needed for essentially
  all other TZ proteins to reach the TZ. CEP290 is a large coiled-coil protein
  that binds microtubules and membranes; in C. elegans it is a core component
  of the central cylinder and is needed to localise the MKS module but not the
  NPHP module. The MKS module contains the three B9-domain proteins
  MKS1, B9D1 and B9D2, the C2-domain protein CC2D2A, the Tectonic proteins and
  several transmembrane proteins (TMEM67/meckelin, TMEM216, TMEM107, TMEM231,
  TMEM237, TMEM17, TMEM218). The NPHP module contains the nephrocystins NPHP1
  and NPHP4. The MKS and NPHP modules are partially redundant. Loss of one
  module leaves cilia nearly normal, whereas combined loss of both causes
  severe defects in nematodes and mice: the basal body and TZ fail to attach
  to the membrane, Y-links are lost, axonemes are malformed and non-ciliary
  membrane proteins leak into the cilium. A further CEP290-dependent branch
  containing TMEM138 and CDKL1 belongs to neither module. Mutations in the
  human genes cause Meckel-Gruber syndrome, Joubert syndrome and
  nephronophthisis. In mammals the nephrocystins also act at epithelial
  cell-cell junctions, a role outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:21422230
    title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
    statement: >-
      Eight C. elegans TZ proteins form two functional modules that together
      attach the basal body/TZ to the membrane and establish the ciliary
      gate.
    supporting_text: >-
      MKS/MKSR/NPHP proteins establish basal body/TZ membrane attachments
      before or coinciding with intraflagellar transport-dependent axoneme
      extension and subsequently restrict accumulation of nonciliary
      components within the ciliary compartment
  - source_id: PMID:21422230
    title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
    statement: >-
      Module assignment is based on synthetic genetic interactions:
      mutations within one module do not enhance each other, whereas MKS
      plus NPHP combinations do.
    supporting_text: >-
      Thus, we group MKS-1, MKSR-1, MKSR-2, MKS-3, and MKS-6 into an MKS/MKSR
      module and NPHP-1 and NPHP-4 into an NPHP module
  - source_id: PMID:26982032
    title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
    statement: >-
      MKS-5 is the foundation of two assembly pathways, one for the NPHP
      module and one for the MKS module with CEP-290 at its core.
    supporting_text: >-
      In this model, MKS-5 (Rpgrip1L/Rpgrip1 orthologue) represents the
      foundation of two distinct assembly pathways for the MKS and NPHP
      modules, with the MKS pathway having CEP-290 as its core
  - source_id: PMID:26540106
    title: Conserved Genetic Interactions between Ciliopathy Complexes Cooperatively Support Ciliogenesis and Ciliary Signaling.
    statement: >-
      The MKS-NPHP synthetic interaction found in worms is conserved in mice.
    supporting_text: >-
      These genetic interactions in nematodes predicted mammalian genetic
      interactions, as combining mouse Tctn1 and Nphp4 mutations also resulted
      in synthetic ciliary phenotypes.
  - source_id: PMID:21565611
    title: Mapping the NPHP-JBTS-MKS protein network reveals ciliopathy disease genes and pathways.
    statement: >-
      Mammalian interaction mapping resolves the same proteins into an
      NPHP1-4-8 module, a separate NPHP5-6 (CEP290) module and an MKS module.
    supporting_text: >-
      Our data show that NPHP-JBTS-MKS proteins form an interaction network
      that can be classified into three distinct modules: “NPHP1-4-8”,
      “NPHP5-6”, and “Mks”.
  - source_id: PMID:25150219
    title: NPHP4 controls ciliary trafficking of membrane proteins and large soluble proteins at the transition zone.
    statement: >-
      In Chlamydomonas, NPHP4 and CEP290 occupy separate TZ domains and are
      incorporated independently, as in the animal model.
    supporting_text: >-
      NPHP4 is stably incorporated into the distal part of the flagellar
      transition zone, close to the membrane and distal to CEP290, another
      transition zone protein. Therefore, these two proteins, which are
      incorporated into the transition zone independently of each other,
      define different domains of the transition zone.
  - source_id: file:modules/intraflagellar_transport.yaml
    title: Intraflagellar transport
    statement: >-
      IFT trains pass through the TZ; IFT builds the axoneme after the TZ has
      been assembled and docked, and is modelled separately.
  - source_id: file:modules/bbsome.yaml
    title: BBSome ciliary trafficking complex module
    statement: >-
      The BBSome, which traffics membrane cargo across the TZ, is modelled
      separately and treated as an interface.
  - source_id: file:projects/CAEEL_CILIOPATHY.md
    title: C. elegans Ciliopathy/IFT Pathway Project
    statement: >-
      Project page listing the worm MKS and NPHP transition-zone genes whose
      gene reviews ground the C. elegans representatives of this module.
notes: >-
  Generalisation. This module was first written as a C. elegans-only module
  (c_elegans_ciliary_transition_zone) and was generalised to Bilateria. Each
  role is a FAMILY with the C. elegans protein and, where a gene review exists,
  the human ortholog as representative members. The C. elegans genetics
  (synthetic defects between but not within modules, and the localisation
  hierarchy) still provide most of the evidence for the module boundary. The
  same boundary is supported in mammals by mouse Tctn1;Nphp4 synthetic
  phenotypes (PMID:26540106), by the NPHP1-4-8, NPHP5-6 and MKS interaction
  modules (PMID:21565611) and by the Tctn1-containing MKS complex
  (PMID:21725307).

  Taxon scope. The context is Bilateria because the module structure, not
  just the presence of the genes, has been tested only in nematodes and
  mammals. Many of these proteins are older. In Chlamydomonas NPHP4 sits at
  the distal TZ near the membrane, distal to CEP290, and the two are
  incorporated independently (PMID:25150219), which matches the separation of
  the CEP290 and NPHP roles here. A TMEM17 paper describes TMEM17 as
  conserved across ciliated eukaryotes (PMID:40841990). Whether the MKS-NPHP
  redundancy and the RPGRIP1L-family hub hold outside animals has not been
  tested in the cached evidence, so the broader clade is not asserted.

  Redundancy. The genetic redundancy between the MKS and NPHP modules is the
  defining property of this system. It is recorded in the root description,
  the part descriptions and the evidence rather than as a connection, because
  the connection vocabulary has no relation for redundancy. The
  RPGRIP1L-family hub is the exception to module assignment: mks-5 interacts
  genetically with members of both modules. The human RPGRIP1L review places
  RPGRIP1L (NPHP8) in the NPHP complex, because it binds NPHP4 directly
  (PMID:21565611); it is modelled here as the hub part, consistent with the
  worm assembly data.

  CEP290. CEP290 is modelled as its own part, distinct from the MKS module,
  following the human CEP290 review and the mammalian NPHP5-6 module. In
  C. elegans it behaves genetically like an MKS-module assembly factor and
  is needed to localise MKS-module proteins and TMEM-138/CDKL-1. Whether worm
  CEP-290 needs MKS-5 to reach the TZ is disputed: Li et al. 2016
  (PMID:26982032) report that it does, while Schouteden et al. 2015
  (PMID:26124290) found CCEP-290 recruitment unaffected in mks-5 mutants. The
  hub-to-CEP290 connection is therefore recorded with that caveat. The worm
  gene symbol is ccep-290 (WormBase); the literature also writes CEP-290.

  MKS module layering. Worm TMEM-107 occupies an intermediate layer of the MKS
  module and recruits MKS-1, TMEM-231, JBTS-14/TMEM237 and TMEM-17
  (PMID:26595381). TMEM-17 and TMEM-218 are peripheral members whose loss does
  not disrupt the core. TCTN-1 is assigned to the MKS module on genetic
  grounds (synthetic defects with nphp-1 and nphp-4 but not with MKS-module
  genes); unlike mouse Tctn1 it is not needed to localise the other worm TZ
  proteins tested (PMID:26540106).

  TMEM138 branch. Worm TMEM-138 and CDKL-1 need MKS-5 and CEP-290 for TZ
  localisation but behave as neither MKS nor NPHP module proteins
  (PMID:26982032). TMEM-138 is modelled as an optional part, not as an
  MKS-module member. CDKL-1 has no gene review and is named in text only.

  Not modelled. NPHP-2/inversin (genes/worm/nphp-2) localises to the inversin
  compartment distal to the TZ and is outside this boundary. The mammalian
  NPHP1/NPHP4 roles at epithelial cell-cell junctions are recorded in their
  gene reviews and are outside this boundary. Human TMEM216, TMEM107, TMEM231,
  TMEM237, TMEM17 and TMEM218 have no gene reviews yet, so those roles carry
  only the C. elegans representative.

  Gene names. MKSR-2 and MKSR-1 were earlier named TZA-1 (B9D2) and TZA-2
  (B9D1), and MKS-1 was XBX-7 (PMID:18337471). JBTS-14 is also called
  TMEM-237.

  Molecular functions. MFs follow the gene reviews' core functions. Most TZ
  reviews assert no GO MF, because none fits a structural TZ subunit and
  the generic structural molecule activity term is not used here; those annotons
  carry a preferred_term only. Where the worm and human reviews differ, the
  annoton description says which review asserts the MF.

  PANTHER grounding. Family ids are given only where the worm and human
  representatives share the PANTHER family or subfamily in their UniProt
  records, or where the worm protein's family is named for the protein
  (TMEM107, TMEM237, TMEM138). The ids were checked against
  interpro/panther/panther.obo. CEP290 is left without a family id because the
  worm and human proteins fall in different PANTHER families (PTHR43941 and
  PTHR18879). MKS-2/TMEM216 and TMEM-17 share PTHR13531, whose name does not
  describe either protein, and TMEM-231 is in PTHR14605, so those are also left
  without ids.

  Interfaces. IFT (MODULE:intraflagellar_transport) and the BBSome
  (MODULE:bbsome) act after or alongside the TZ: IFT rates are largely normal
  in worm TZ mutants, and IFT and BBS proteins are not needed to form the TZ or
  to dock it to the membrane (PMID:21422230). NPHP-1 and NPHP-4 do modulate
  ciliary access of IFT components (PMID:18316409).
module:
  id: ciliary_transition_zone
  label: Ciliary transition zone MKS, NPHP and CEP290 modules
  module_type: CELLULAR_COMPONENT
  description: >-
    The RPGRIP1L-family assembly hub, CEP290 and the partially redundant MKS
    and NPHP modules that build the transition zone, dock it to the membrane
    and establish the ciliary gate.
  concepts:
    - preferred_term: ciliary transition zone
      term:
        id: GO:0035869
        label: ciliary transition zone
      description: The structure this module builds and occupies.
    - preferred_term: ciliary transition zone assembly
      term:
        id: GO:1905349
        label: ciliary transition zone assembly
      description: >-
        The process the hub, CEP290 and the two modules carry out together
        during early ciliogenesis.
  context:
    taxa:
      - preferred_term: Bilateria
        term:
          id: NCBITaxon:33213
          label: Bilateria
        description: >-
          The module structure is established by genetics and localisation in
          C. elegans and by genetics and interaction mapping in mouse and human
          cells. Individual members such as NPHP4 and CEP290 also act at the
          TZ in Chlamydomonas (PMID:25150219), but the whole module boundary
          has not been tested outside animals.
    anatomical_locations:
      - preferred_term: ciliated cells, e.g. nematode amphid and phasmid sensory neurons and mammalian ciliated epithelia
        description: >-
          Worm genetic analysis used dye filling and electron microscopy of
          amphid and phasmid channel cilia; mammalian data come from mouse
          embryos, fibroblasts, renal epithelial cells and photoreceptors.
  parts:
    - order: 1
      role: TZ assembly hub required for both modules
      node:
        id: mks5_assembly_hub
        label: RPGRIP1L/MKS-5 transition-zone assembly hub
        module_type: PROTEIN_COMPLEX
        description: >-
          The RPGRIP1L-family protein (MKS-5 in worms) localises to the TZ
          through its coiled-coil region, which is necessary and sufficient
          for TZ targeting in C. elegans. In mks-5 mutants every known
          MKS-module protein fails to reach the TZ and NPHP-1 and NPHP-4 are
          partly mislocalised. mks-5 mutations interact genetically with
          mutations in both modules. In mammals RPGRIP1L (NPHP8) binds NPHP4
          directly.
        annotons:
          - id: mks5_scaffold
            label: RPGRIP1L/MKS-5 TZ scaffold
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RPGRIP1L/MKS-5 family
                term:
                  id: PANTHER:PTHR14240
                  label: RETINITIS PIGMENTOSA GTPASE REGULATOR-INTERACTING PROTEIN
                description: >-
                  The PANTHER family also contains RPGRIP1, the vertebrate
                  paralog; MKS-5 is the single worm member.
                representative_members:
                  - preferred_term: MKS-5 (C. elegans)
                    term:
                      id: UniProtKB:Q09459
                      label: Protein fantom
                  - preferred_term: RPGRIP1L (human)
                    term:
                      id: UniProtKB:Q68CZ1
                      label: Protein fantom
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              description: >-
                Scaffold that recruits and anchors MKS-module proteins and, in
                part, the NPHP module at the TZ. The MF is asserted by the
                mks-5 review; the human RPGRIP1L review asserts no MF.
            processes:
              - preferred_term: protein localization to ciliary transition zone
                term:
                  id: GO:1904491
                  label: protein localization to ciliary transition zone
              - preferred_term: ciliary transition zone assembly
                term:
                  id: GO:1905349
                  label: ciliary transition zone assembly
            locations:
              - preferred_term: ciliary transition zone
                term:
                  id: GO:0035869
                  label: ciliary transition zone
            role_description: >-
              Foundation of TZ assembly; links the MKS and NPHP modules.
            evidence:
              - source_id: PMID:21422230
                title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
                statement: >-
                  mks-5 mutants fail to localise the whole MKS module and
                  partially alter NPHP-module distribution.
                supporting_text: >-
                  mks-5 mutants fail to localize MKS-1, MKSR-1, MKSR-2, MKS-3,
                  and MKS-6 (i.e., the entire known MKS/MKSR module) to the TZ;
                  the mks-5 mutation also partially alters NPHP-1 and NPHP-4
                  distribution at the TZ
              - source_id: PMID:21422230
                title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
                statement: MKS-5 is the exception to module assignment and links the two modules.
                supporting_text: >-
                  Based on our data, we propose that the MKS/MKSR and NPHP
                  modules are functionally linked through MKS-5
              - source_id: PMID:26982032
                title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
                statement: The MKS-5 coiled-coil region targets it to the TZ.
                supporting_text: >-
                  Notably, the coiled coil region is both necessary and
                  sufficient for MKS-5 localisation to the TZ
              - source_id: PMID:26982032
                title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
                statement: MKS-5 is needed to assemble all known worm TZ proteins.
                supporting_text: >-
                  MKS-5 (mammalian Rprgrip1L/Rpgrip1 orthologue) is essential
                  for the assembly of all known TZ proteins (including CEP-290)
              - source_id: PMID:21565611
                title: Mapping the NPHP-JBTS-MKS protein network reveals ciliopathy disease genes and pathways.
                statement: Mammalian NPHP4 binds RPGRIP1L (NPHP8) directly.
                supporting_text: >-
                  We find that NPHP4 directly binds both NPHP1 and NPHP8 in
                  vitro
    - order: 2
      role: CEP290 central TZ scaffold and MKS-branch assembly factor
      node:
        id: cep290_module
        label: CEP290 central TZ module
        module_type: PROTEIN_COMPLEX
        description: >-
          CEP290 is a large coiled-coil protein that binds microtubules
          through a central region and membranes through its N-terminal
          domain. In C. elegans CCEP-290 is a core component of the central
          cylinder, the inner scaffold of the TZ, and is needed for TZ
          localisation of MKS-module proteins and of TMEM-138 and CDKL-1, but
          not of MKS-5 or the NPHP module. In mammals CEP290 (NPHP6) forms a
          separate NPHP5-6 interaction module rather than belonging to the MKS
          module.
        annotons:
          - id: cep290_scaffold
            label: CEP290 microtubule- and membrane-binding TZ scaffold
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CEP290 orthologs
                description: >-
                  No PANTHER family id is asserted: UniProt places worm
                  CCEP-290 in PTHR43941 and human CEP290 in PTHR18879.
                representative_members:
                  - preferred_term: CCEP-290 (C. elegans)
                    term:
                      id: UniProtKB:A2A266
                      label: CEntrosomal Protein
                  - preferred_term: CEP290 (human)
                    term:
                      id: UniProtKB:O15078
                      label: Centrosomal protein of 290 kDa
            function:
              preferred_term: microtubule binding
              term:
                id: GO:0008017
                label: microtubule binding
              description: >-
                Asserted by the human CEP290 review, which also asserts lipid
                binding (GO:0008289) by the N-terminal membrane-binding domain;
                together they are thought to tether the axoneme to the
                membrane. The worm ccep-290 review asserts no MF.
            processes:
              - preferred_term: ciliary transition zone assembly
                term:
                  id: GO:1905349
                  label: ciliary transition zone assembly
              - preferred_term: protein localization to ciliary transition zone
                term:
                  id: GO:1904491
                  label: protein localization to ciliary transition zone
            locations:
              - preferred_term: ciliary transition zone
                term:
                  id: GO:0035869
                  label: ciliary transition zone
              - preferred_term: central cylinder
                term:
                  id: GO:1990805
                  label: central cylinder
                description: Established for worm CCEP-290 (PMID:26124290).
            evidence:
              - source_id: PMID:24051377
                title: Disruption of CEP290 microtubule/membrane-binding domains causes retinal degeneration.
                statement: CEP290 binds both membranes and microtubules.
                supporting_text: >-
                  we have shown that CEP290 is capable of directly binding to
                  both cellular membranes and microtubules, possibly anchoring
                  the two to each other and likely playing a key structural
                  role in the maintenance of the cilium
              - source_id: PMID:26124290
                title: The ciliary transition zone functions in cell adhesion but is dispensable for axoneme assembly in C. elegans.
                statement: Worm CCEP-290 is a core component of the TZ central cylinder.
                supporting_text: >-
                  with CCEP-290 serving as a core component of the central
                  cylinder, which appears to act as an inner scaffold for
                  transition zone assembly
              - source_id: PMID:26982032
                title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
                statement: Worm CEP-290 is an assembly factor specific for MKS-module components.
                supporting_text: >-
                  we reveal Caenorhabditis elegans CEP-290 (mammalian
                  Cep290/Mks4/Nphp6 orthologue) as a central assembly factor
                  that is specific for established MKS module components and
                  depends on the coiled coil region of MKS-5 (Rpgrip1L/Rpgrip1)
                  for TZ localisation
              - source_id: PMID:26982032
                title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
                statement: CEP-290 is needed for a functional TZ gate.
                supporting_text: >-
                  Together, our two complementary TZ functional assays suggest
                  that CEP-290 plays an essential role in maintaining a
                  functional TZ “gate” or membrane diffusion barrier.
    - order: 3
      role: MKS module
      node:
        id: mks_module
        label: MKS module
        module_type: PROTEIN_COMPLEX
        description: >-
          The MKS module comprises the B9-domain trio MKS1, B9D1 and B9D2,
          whose TZ localisation is interdependent, the C2-domain protein
          CC2D2A, the Tectonic proteins and the transmembrane proteins
          TMEM67/meckelin, TMEM216, TMEM107, TMEM231, TMEM237, TMEM17 and
          TMEM218. Its TZ localisation depends on the RPGRIP1L-family hub and,
          in worms, on CEP-290. Within the module, worm TMEM-107 forms an
          intermediate layer that recruits MKS-1, TMEM-231, JBTS-14 and
          TMEM-17. Mutants lacking one or several MKS-module proteins have
          nearly normal cilia; combined with NPHP-module mutations they cause
          severe ciliogenesis defects. In mammals the complex (also called the
          tectonic or B9 complex) acts as a membrane diffusion barrier.
        concepts:
          - preferred_term: MKS complex
            term:
              id: GO:0036038
              label: MKS complex
