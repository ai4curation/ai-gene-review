      title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
      statement: Combining B9 and nephrocystin mutations causes severe cilia defects.
      supporting_text: >-
        In contrast, disrupting any B9 gene together with nphp-1 or nphp-4
        results in severe cilia anomalies
    - source_id: PMID:18337471
      title: Functional redundancy of the B9 proteins and nephrocystins in Caenorhabditis elegans ciliogenesis.
      statement: The B9 proteins act redundantly with the nephrocystins in ciliogenesis.
      supporting_text: >-
        Our data indicate that the B9 proteins function redundantly with the
        nephrocystins to regulate the formation and/or maintenance of cilia
        and dendrites in the amphid and phasmid ciliated sensory neurons.
    - source_id: PMID:26540106
      title: Conserved Genetic Interactions between Ciliopathy Complexes Cooperatively Support Ciliogenesis and Ciliary Signaling.
      statement: Tctn1 interacts synthetically with Nphp1 and Nphp4 in both nematodes and mice.
      supporting_text: >-
        These results reveal that in both nematodes and mice, Tctn1 displays a
        synthetic genetic interaction with both Nphp1 and Nphp4.
knowledge_gaps:
  - gap_statement: >-
      Whether the MKS and NPHP modules physically associate with each other and
      with the RPGRIP1L-family hub at the TZ, and which proteins make up the
      Y-links, is not known.
    boundary: >-
      The worm modules are defined by genetic interaction and localisation
      dependency, and the mammalian modules by interaction mapping. Y-links are
      lost in worm MKS plus NPHP double mutants, and MKS-5 with the NPHP
      module is proposed to nucleate Y-link assembly, but no TZ complex has
      been resolved structurally.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would show whether genetic redundancy reflects two parallel physical
      tethers between microtubules and membrane or two inputs into one
      structure.
    resolution: >-
      Proximity labelling or affinity purification of tagged MKS-5, MKS-2 and
      NPHP-4 from worm ciliated neurons, and cryo-electron tomography of the
      TZ in single and double module mutants.
    provenance:
      - reference_id: PMID:21422230
        supporting_text: >-
          Whether the modules are physically associated together at the TZ
          remains to be examined
      - reference_id: PMID:26982032
        supporting_text: >-
          we speculate that MKS-5 and the NPHP module might help nucleate the
          assembly of Y-links
  - gap_statement: >-
      The molecular mechanism by which the TZ modules exclude non-ciliary
      membrane proteins, whether by a diffusion barrier, selective retrieval
      or both, is unresolved.
    boundary: >-
      TZ mutants accumulate non-ciliary proteins in cilia, but it is not
      known whether these proteins enter abnormally or fail to be removed.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines how the gate controls ciliary membrane composition and thus
      sensory signalling.
    resolution: >-
      Single-molecule tracking and photoconversion of membrane reporters
      across the TZ in wild type and mks/nphp double mutants to separate entry
      from exit rates.
    provenance:
      - reference_id: PMID:21422230
        supporting_text: >-
          Alternatively, these proteins may enter cilia at low levels normally
          and instead require NPHP and MKS proteins for efficient removal from
          the compartment.
  - gap_statement: >-
      Whether CEP-290 depends on MKS-5 to reach the C. elegans TZ is
      unresolved.
    boundary: >-
      Li et al. 2016 lose CEP-290 from the TZ in mks-5 mutants, whereas
      Schouteden et al. 2015 report CCEP-290 recruitment unaffected in mks-5
      mutants. The two studies used different alleles, reporters and imaging.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether CEP290 or the RPGRIP1L-family hub is the most upstream
      TZ assembly factor, which bears on the order of TZ assembly in animals.
    resolution: >-
      Image endogenously tagged CCEP-290 at the TZ in several mks-5 null
      alleles side by side with the reporters of both studies, using
      super-resolution microscopy.
    provenance:
      - reference_id: PMID:26982032
        supporting_text: >-
          In contrast, CEP-290 localisation to the TZ is lost when the core
          assembly factor, MKS-5, is ablated (Fig 4B).
      - reference_id: PMID:26124290
        supporting_text: >-
          CCEP-290 recruitment was unaffected in mutants of MKS-5, MKSR-2, and
          NPHP-4, the most upstream components of the MKS and NPHP assembly
          pathways
