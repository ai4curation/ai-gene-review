                term:
                  id: GO:1905349
                  label: ciliary transition zone assembly
            locations:
              - preferred_term: ciliary transition zone
                term:
                  id: GO:0035869
                  label: ciliary transition zone
            evidence:
              - source_id: PMID:18337471
                title: Functional redundancy of the B9 proteins and nephrocystins in Caenorhabditis elegans ciliogenesis.
                statement: The three worm B9 proteins form a complex at the base of cilia.
                supporting_text: >-
