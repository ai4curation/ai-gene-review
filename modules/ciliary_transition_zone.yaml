    - order: 4
      role: NPHP module
      node:
        id: nphp_module
        label: NPHP module
        module_type: PROTEIN_COMPLEX
        description: >-
          NPHP1 and NPHP4 localise to the TZ; in Chlamydomonas NPHP4 sits at
          the distal TZ close to the membrane. In C. elegans nphp-1;nphp-4
          double mutants lack additive ciliary defects, but loss of either
          nephrocystin causes subtle axonemal ultrastructure defects and
          changes ciliary access of IFT and signalling proteins, and NPHP-4 is
          needed to localise NPHP-1 in worms and mice. Combined with MKS-module
          mutations they cause severe ciliogenesis defects. The NPHP module
          assembles at the ciliary base with MKS-5 even without CEP-290. In
          mammals NPHP1, NPHP4 and RPGRIP1L (NPHP8) form the NPHP1-4-8
          interaction module, which also acts at epithelial cell-cell
          junctions.
