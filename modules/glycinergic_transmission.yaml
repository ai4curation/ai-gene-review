id: MODULE:glycinergic_transmission
title: Human glycinergic transmission through strychnine-sensitive glycine receptors
description: >-
  Fast glycinergic inhibition, mainly in the spinal cord and brainstem. Glycine is loaded into synaptic
  vesicles by VGAT (SLC32A1), the same vesicular carrier used for GABA, and released by calcium-triggered
  exocytosis. Released glycine opens pentameric glycine receptors (GlyRs), which are glycine-gated chloride
  channels. Adult synaptic receptors contain alpha1 and beta subunits; the beta subunit binds gephyrin and
  anchors the receptor at the postsynaptic density. Homomeric alpha2 receptors predominate before the
  postnatal switch to alpha1beta. Two sodium- and chloride-coupled transporters clear glycine. Presynaptic
  GlyT2 (SLC6A5) recaptures glycine into the terminal and is needed to refill vesicles. Glial GlyT1 (SLC6A9)
  sets glycine concentrations at the synapse. Glycine's separate role as an NMDA-receptor co-agonist is
  outside this module, as are gephyrin scaffold assembly and glycine biosynthesis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:15383648
  title: Molecular structure and function of the glycine receptor chloride channel.
  statement: Sets the reception boundary, the subunit inventory and the developmental switch.
  supporting_text: The GlyR is best known for mediating inhibitory neurotransmission in the spinal cord
    and brain stem
- source_id: PMID:16701208
  title: A shared vesicular carrier allows synaptic corelease of GABA and glycine.
  statement: Glycinergic neurons use VGAT, so vesicular loading is shared with the GABAergic module.
  supporting_text: glycinergic neurons do not express a separate vesicular glycine transporter
- source_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
  title: PTHR18945 family review
  statement: In PAINT, glycine-gated chloride channel activity and glycinergic synapse are asserted only
    at the glycine receptor node PTN001055255. The wider anion-channel node PTN001055382 also carries
    invertebrate glutamate-, histamine- and acetylcholine-gated chloride channels. Exact subunits are
    therefore named here.
notes: >-
  GlyR stoichiometry is not asserted: the alpha1beta receptor has been reported both as 2alpha:3beta and
  as 3alpha:2beta (or 4alpha:1beta). The alpha2 homomer is a developmental alternative, not a required
  part of the adult synapse. Alpha3-containing receptors of the spinal dorsal horn are not yet modelled.
  GlyT2 is placed under clearance because it removes glycine from the cleft; its role in supplying glycine
  for vesicle refilling is recorded on the annoton. No GlyR subunit, VGAT, GlyT1 or GlyT2 has a gene review
  in this repository, so status is DRAFT. Module deep research has not been run.
