knowledge_gaps:
- gap_statement: The subunit stoichiometry of the adult alpha1beta glycine receptor is unsettled, with
    2alpha:3beta, 3alpha:2beta and 4alpha:1beta all reported.
  boundary: That the adult synaptic receptor
    contains both alpha1 and beta, and that beta carries the gephyrin-binding loop, is established. The
    number of copies of each is not, and most structural detail comes from homomeric alpha1 receptors.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: The number of beta subunits sets how many gephyrin-binding loops a receptor has, and so
    how strongly it is held at the synapse, as well as the number of agonist sites.
  provenance:
  - reference_id: PMID:15383648
    supporting_text: Most of the information has been obtained from homomeric alpha1 GlyRs, with the roles
      of the other subunits
    reference_section_type: ABSTRACT
references:
- id: PMID:15383648
  title: Molecular structure and function of the glycine receptor chloride channel.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Supports the subunit inventory, the developmental switch and
      the gephyrin-anchoring role of the beta subunit. It also notes that most structural detail comes
      from homomeric alpha1 receptors, which is why stoichiometry is left as a knowledge gap here.
  findings:
  - statement: Glycine receptors mediate inhibitory neurotransmission in spinal cord and brainstem, and
      can also mediate excitatory transmission in embryonic neurons.
    supporting_text: The GlyR is best known for mediating inhibitory neurotransmission in the spinal cord
      and brain stem
    reference_section_type: ABSTRACT
  - statement: A developmental switch replaces alpha2 homomers with alpha1beta receptors, completed around
      postnatal day 20 in rat.
    supporting_text: A developmental switch from alpha2 to alpha1beta is completed by around postnatal
      day 20 in the rat.
    reference_section_type: ABSTRACT
  - statement: The beta subunit anchors the receptor to the subsynaptic cytoskeleton through gephyrin.
    supporting_text: The beta-subunit is responsible for anchoring GlyRs to the subsynaptic cytoskeleton
      via the cytoplasmic protein gephyrin.
    reference_section_type: ABSTRACT
- id: PMID:7546736
  title: Identification of a gephyrin binding motif on the glycine receptor beta subunit.
  findings:
  - statement: The gephyrin-binding site lies in the beta-subunit cytoplasmic loop between TM3 and TM4;
      glycine receptor alpha subunits and GABA-A receptor proteins did not bind gephyrin.
    supporting_text: identified a gephyrin binding site in the cytoplasmic loop between the third and
      fourth transmembrane segments of the beta subunit
    reference_section_type: ABSTRACT
- id: PMID:16701208
  title: A shared vesicular carrier allows synaptic corelease of GABA and glycine.
  findings:
  - statement: Glycinergic neurons use VGAT rather than a separate vesicular glycine transporter, and
      VGAT loss cuts release from both GABAergic and glycinergic neurons.
    supporting_text: glycinergic neurons do not express a separate vesicular glycine transporter
    reference_section_type: ABSTRACT
- id: PMID:14622583
  title: Deletion of the mouse glycine transporter 2 results in a hyperekplexia phenotype and postnatal
    lethality.
  findings:
  - statement: GlyT2 sits in glycinergic axon terminals, and postnatal GlyT2 function is needed to load
      glycine into synaptic vesicles; its loss gives a hyperekplexia-like phenotype.
    supporting_text: postnatal GlyT2 function is crucial for efficient transmitter loading of synaptic
      vesicles in glycinergic nerve terminals
    reference_section_type: ABSTRACT
- id: PMID:14622582
  title: Inactivation of the glycine transporter 1 gene discloses vital role of glial glycine uptake in
    glycinergic inhibition.
  findings:
  - statement: Glial GlyT1 regulates glycine concentrations at inhibitory glycine receptors; its loss is
      lethal and its respiratory phenotype is reversed by the glycine receptor antagonist strychnine.
    supporting_text: during early postnatal life, GlyT1 is essential for regulating glycine concentrations
      at inhibitory GlyRs
    reference_section_type: ABSTRACT
