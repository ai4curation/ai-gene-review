        label: PcaIJ 3-oxoadipate CoA transfer
        module_type: REACTION
        description: >-
          The PcaI- and PcaJ-like subunits form a heteromeric CoA-transferase
          that transfers CoA from succinyl-CoA to 3-oxoadipate.
        annotons:
          - id: pcaij_transferase_complex
            label: PcaIJ 3-oxoadipate CoA-transferase complex
