id: MODULE:beta_ketoadipate_lower_pathway
title: Beta-ketoadipate lower pathway from 3-oxoadipate to central metabolites
description: >-
  Species-neutral bacterial module for the shared lower beta-ketoadipate
  pathway that converts 3-oxoadipate to acetyl-CoA and succinyl-CoA. A
  two-subunit PcaIJ-like CoA-transferase first transfers CoA from succinyl-CoA
  to 3-oxoadipate, producing 3-oxoadipyl-CoA and succinate. A PcaF-like
  thiolase then cleaves 3-oxoadipyl-CoA with CoA to acetyl-CoA and
  succinyl-CoA. The module begins after catechol- and protocatechuate-derived
  upper branches converge at 3-oxoadipate and excludes those branch-specific
  ring-cleavage reactions.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0042952
    title: beta-ketoadipate pathway
    statement: >-
      GO:0042952 provides the process-level context for the shared reactions
      that channel 3-oxoadipate into central metabolism.
  - source_id: UniPathway:UPA00157
    title: beta-ketoadipate pathway
    statement: >-
      UniPathway assigns PSEPK PcaI and PcaJ to step 1 of 2 in the conversion
      of 3-oxoadipate to acetyl-CoA and succinyl-CoA.
  - source_id: KEGG:ppu01220
    title: Pseudomonas putida KT2440 degradation of aromatic compounds
    statement: >-
      The broad PSEPK aromatic-degradation map contains the lower-pathway
      enzymes, but the reusable biochemical boundary is the two-reaction
      sequence beginning at 3-oxoadipate.
  - source_id: PMID:1624453
    title: Characterization of the genes encoding beta-ketoadipate:succinyl-coenzyme A transferase in Pseudomonas putida
    statement: >-
      The pcaI and pcaJ genes encode the two nonidentical subunits of the
      beta-ketoadipate:succinyl-CoA transferase that performs the penultimate
      reaction of the pathway.
  - source_id: file:PSEPK/pcaF/pcaF-ai-review.yaml
    title: Curated PSEPK pcaF-I review
    statement: >-
      The review supports PcaF-I as the 3-oxoadipyl-CoA thiolase that completes
      conversion of the activated intermediate to acetyl-CoA and succinyl-CoA.
notes: >-
  PSEPK exemplars are PcaI/PP_3951/Q88FX5, PcaJ/PP_3952/P0A101, and
  PcaF-I/PP_1377/Q88N39. The PcaIJ reaction is a property of the heteromeric
  enzyme, so each subunit is modeled as contributing to, rather than
  independently enabling, 3-oxoadipate CoA-transferase activity. The
  catechol_ortho_cleavage and protocatechuate_ortho_cleavage modules represent
  separate upstream routes that feed this shared lower pathway.
