      term:
        id: GO:0042952
        label: beta-ketoadipate pathway
      description: >-
        Shared lower-pathway conversion of 3-oxoadipate to acetyl-CoA and
        succinyl-CoA after convergence of aromatic ring-cleavage branches.
  context:
