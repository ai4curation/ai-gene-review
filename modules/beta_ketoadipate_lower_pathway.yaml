              protein_complex:
                preferred_term: bacterial PcaIJ 3-oxoadipate CoA-transferase
                description: >-
                  Heteromeric CoA-transferase assembled from PcaI- and
                  PcaJ-family subunits.
                active_units:
                  - id: pcai_subunit
                    label: PcaI CoA-transferase subunit
                    role: >-
                      Required alpha-like subunit that contributes to the
                      heteromeric CoA-transferase reaction.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PcaI 3-oxoadipate CoA-transferase subunit family
                        term:
