                - preferred_term: succinate
              evidence:
                - source_id: PMID:1624453
                  statement: >-
                    Genetic and sequence analysis established that PcaI and
                    PcaJ are the two nonidentical subunits of the transferase.
                - source_id: PMID:6780551
                  statement: >-
                    The purified Acinetobacter and Pseudomonas transferases are
