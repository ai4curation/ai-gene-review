                      Required beta-like partner subunit that contributes to
                      the heteromeric CoA-transferase reaction.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PcaJ 3-oxoadipate CoA-transferase subunit family
                        term:
                          id: NCBIfam:TIGR02428
                          label: pcaJ_scoB_fam
                        representative_members:
                          - preferred_term: pcaJ (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:P0A101
                              label: 3-oxoadipate CoA-transferase subunit B
                            description: Pseudomonas putida KT2440 pcaJ/PP_3952.
                          - preferred_term: pcaJ / catJ (Acinetobacter baylyi ADP1)
                            term:
                              id: UniProtKB:Q59091
                              label: 3-oxoadipate CoA-transferase subunit B
                            description: >-
                              Acinetobacter baylyi ADP1 pcaJ/ACIAD1705; the
                              catechol-branch catJ/ACIAD1449 locus, which
                              encodes a near-identical isofunctional protein, is
