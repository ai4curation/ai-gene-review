id: MODULE:beta_ketoadipate_lower_pathway
title: Beta-ketoadipate lower pathway from 3-oxoadipate to central metabolites
description: >-
  Species-neutral bacterial module for the shared lower beta-ketoadipate
  pathway that converts 3-oxoadipate and CoA to acetyl-CoA and succinate while
  recycling a succinyl-CoA CoA donor. A
  two-subunit PcaIJ-like CoA-transferase first transfers CoA from succinyl-CoA
  to 3-oxoadipate, producing 3-oxoadipyl-CoA and succinate. A PcaF-like
  thiolase then cleaves 3-oxoadipyl-CoA with CoA to acetyl-CoA and
  succinyl-CoA, regenerating the donor consumed in the first reaction. The
  module begins after catechol- and protocatechuate-derived
  upper branches converge at 3-oxoadipate and excludes those branch-specific
  ring-cleavage reactions. The same two-enzyme organization is conserved
  in aromatic-degrading Gammaproteobacteria of the orders Pseudomonadales and
  Moraxellales, represented here by
  biochemically and genetically characterized members from Pseudomonas putida
  and Acinetobacter baylyi.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0042952
    title: beta-ketoadipate pathway
    statement: >-
      GO:0042952 provides the process-level context for the shared reactions
      that channel 3-oxoadipate into central metabolism.
  - source_id: UniPathway:UPA00157
    title: beta-ketoadipate pathway
    statement: >-
      UniPathway assigns PSEPK PcaI and PcaJ to step 1 of 2 in the conversion
      of 3-oxoadipate to acetyl-CoA and succinyl-CoA.
  - source_id: KEGG:ppu01220
    title: Pseudomonas putida KT2440 degradation of aromatic compounds
    statement: >-
      The broad PSEPK aromatic-degradation map contains the lower-pathway
      enzymes, but the reusable biochemical boundary is the two-reaction
      sequence beginning at 3-oxoadipate.
  - source_id: PMID:1624453
    title: Characterization of the genes encoding beta-ketoadipate:succinyl-coenzyme A transferase in Pseudomonas putida
    statement: >-
      The pcaI and pcaJ genes encode the two nonidentical subunits of the
      beta-ketoadipate:succinyl-CoA transferase that performs the penultimate
      reaction of the pathway.
  - source_id: PMID:6780551
    title: Evolutionarily homologous alpha 2 beta 2 oligomeric structures in beta-ketoadipate succinyl-CoA transferases from Acinetobacter calcoaceticus and Pseudomonas putida.
    statement: >-
      Homogeneous transferase preparations from both Acinetobacter and
      Pseudomonas are alpha2beta2 heteromers of nonidentical subunits,
      establishing that the two-subunit transferase is conserved across these
      gammaproteobacterial orders.
  - source_id: PMID:8063101
    title: Contrasting patterns of evolutionary divergence within the Acinetobacter calcoaceticus pca operon.
    statement: >-
      In Acinetobacter the pcaIJF genes head the single pcaIJFBDKCHG operon
      encoding the six enzymes that convert protocatechuate to succinate and
      acetyl-CoA.
  - source_id: PMID:11741863
    title: 'Degradation of aromatics and chloroaromatics by Pseudomonas sp. strain B13: cloning, characterization, and analysis of sequences encoding 3-oxoadipate:succinyl-coenzyme A (CoA) transferase and 3-oxoadipyl-CoA thiolase.'
    statement: >-
      Expression of catIJ and catF from Pseudomonas sp. B13 demonstrated
      transferase activity requiring both subunits and 3-oxoadipyl-CoA
      thiolase activity, the two lower-pathway reactions.
  - source_id: file:PSEPK/pcaF/pcaF-ai-review.yaml
    title: Curated PSEPK pcaF-I review
    statement: >-
      The review supports PcaF-I as the 3-oxoadipyl-CoA thiolase that completes
      conversion of the activated intermediate to acetyl-CoA and succinyl-CoA.
notes: >-
  Exemplars are Pseudomonas putida KT2440 PcaI/PP_3951/Q88FX5,
  PcaJ/PP_3952/P0A101 and PcaF-I/PP_1377/Q88N39, and Acinetobacter baylyi ADP1
  PcaI/ACIAD1704/Q43973, PcaJ/ACIAD1705/Q59091 and PcaF/ACIAD1706/Q43974. The
  ADP1 proteins were added because the ADP1-lineage transferase was purified
  and shown to be an alpha2beta2 heteromer and all three carry Swiss-Prot
  protein-level evidence; they move the module beyond a single Pseudomonas
  instance without inflating member counts. The module stays scoped to
  Bacteria: fungal and actinobacterial routes to 3-oxoadipate exist but their
  lower-pathway enzymes were not used as exemplars here. Families are grounded
  with NCBIfam TIGR02429 (PcaI), TIGR02428 (PcaJ) and TIGR02430 (PcaF), which
  are specific to the pathway enzymes. The corresponding PANTHER families
  (PTHR13707 ketoacid-CoA transferase, which includes eukaryotic SCOT, and
  PTHR18919 acetyl-CoA C-acyltransferase, which includes all thiolases) are
  much broader and are deliberately not used as family terms. The PcaIJ reaction is a property of the heteromeric
  enzyme, so each subunit is modeled as contributing to, rather than
  independently enabling, 3-oxoadipate CoA-transferase activity. The
  catechol_ortho_cleavage and protocatechuate_ortho_cleavage modules represent
  separate upstream routes that feed this shared lower pathway.
