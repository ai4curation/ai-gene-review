id: MODULE:mitochondrial_d_lactate_oxidation
title: Mitochondrial D-lactate oxidation coupled to cytochrome c
description: >-
  A short electron-transfer route that removes D-lactate in the mitochondria of
  fungi, plants and animals. A flavin-dependent D-lactate dehydrogenase of the
  PCMH/VAO fold oxidises D-lactate to pyruvate and hands the two electrons, one
  at a time, to cytochrome c, which carries them to cytochrome c oxidase. The
  route enters the respiratory chain after complex III, so D-lactate oxidation is
  insensitive to complex I inhibition and contributes a small amount of membrane
  potential. Its physiological purpose is clearance: D-lactate is the end product
  of glutathione-dependent methylglyoxal detoxification and is also absorbed from
  gut bacteria and food, and no other enzyme removes it in animals. The same
  dehydrogenase oxidises other (2R)-2-hydroxy acids with small hydrophobic side
  chains. Loss of the dehydrogenase leaves the rest of the chain intact and
  causes isolated accumulation of D-lactate and related D-2-hydroxy acids.
  D-lactate production (the glyoxalase route), import of D-lactate into
  mitochondria, and the cytochrome c oxidase complex itself are separate modules
  or context.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0004458
    title: D-lactate dehydrogenase (cytochrome) activity
    statement: >-
      Defines the first step: (R)-lactate + 2 ferricytochrome c = pyruvate + 2
      ferrocytochrome c + 2 H+.
  - source_id: PMID:38413804
    title: "PMF-seq: a highly scalable screening strategy for linking genetics to mitochondrial bioenergetics."
    statement: >-
      Purified human LDHD reduces cytochrome c directly with D-lactate, and LDHD
      knockout cells lose D-lactate-driven membrane potential while still
      responding to substrates that feed cytochrome c directly.
  - source_id: PMID:11955284
    title: D-Lactate transport and metabolism in rat liver mitochondria.
    statement: >-
      D-lactate-driven respiration in rat liver mitochondria is insensitive to
      rotenone and inhibited by antimycin A and cyanide.
  - source_id: PMID:30931947
    title: Identification of human D lactate dehydrogenase deficiency.
    statement: >-
      Loss of LDHD in patients and in zebrafish raises D-lactate and leaves
      L-lactate unchanged; human LDHD restores clearance in the fish.
  - source_id: file:human/LDHD/LDHD-ai-review.yaml
    title: LDHD gene review (human)
    statement: >-
      Core functions GO:0140170, GO:0004458 and GO:0140174 at the mitochondrial
      inner membrane, process GO:1903457.
  - source_id: file:human/CYCS/CYCS-ai-review.yaml
    title: CYCS gene review (human)
    statement: >-
      Core function GO:0009055 in the mitochondrial intermembrane space, process
      GO:0006123.
  - source_id: file:yeast/CYC1/CYC1-ai-review.yaml
    title: CYC1 gene review (S. cerevisiae)
    statement: >-
      Core function GO:0009055 in the mitochondrial intermembrane space.
  - source_id: file:interpro/panther/PTHR11748/PTHR11748-review.yaml
    title: PTHR11748 family review
    statement: >-
      GO:0004458 is scoped to subfamily SF111; the PAINT node PTN000202298 is
      sound for the D-LDH lineage and needs pruning for the bacterial
      D-2-hydroxyglutarate dehydrogenases.
module:
  id: mitochondrial_d_lactate_oxidation
  label: Mitochondrial D-lactate oxidation coupled to cytochrome c
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: lactate catabolic process
      term:
        id: GO:1903457
        label: lactate catabolic process
      description: >-
        GO subdivides this term by oxygen (aerobic, anaerobic) but not by
        enantiomer; there is no D-lactate-specific catabolic term (see
        proposed_new_terms).
  context:
    cellular_components:
      - preferred_term: mitochondrial inner membrane
        term:
          id: GO:0005743
          label: mitochondrial inner membrane
        description: The dehydrogenase is a peripheral inner-membrane flavoprotein; cytochrome c works on the intermembrane-space face of the same membrane.
  parts:
    - order: 1
      role: substrate oxidation and electron donation
      node:
        id: d_lactate_dehydrogenase_step
        label: D-lactate dehydrogenase oxidises D-lactate and reduces cytochrome c
        module_type: REACTION
        annotons:
          - id: d_ldh_activity
            label: Cytochrome c-linked FAD-dependent D-lactate dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: mitochondrial FAD-dependent D-lactate dehydrogenase subfamily
                term:
                  id: PANTHER:PTHR11748:SF111
                  label: D-LACTATE DEHYDROGENASE, MITOCHONDRIAL-RELATED
                description: >-
                  Eukaryotic mitochondrial D-lactate dehydrogenases. The subfamily,
                  not the family, is used because PTHR11748 also contains bacterial
                  D-2-hydroxyglutarate dehydrogenases, the GlcE subunit of glycolate
                  oxidase and vanillyl-alcohol oxidase-like enzymes.
                representative_members:
                  - preferred_term: LDHD (human)
                    term:
                      id: UniProtKB:Q86WU2
                      label: D-lactate dehydrogenase, mitochondrial
                    description: Reduces cytochrome c directly with D-lactate and D-2-hydroxybutyrate (PMID:38413804).
                  - preferred_term: DLD1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P32891
                      label: D-lactate dehydrogenase [cytochrome] 1, mitochondrial
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000202298
                    term:
                      id: PANTHER:PTN000202298
                      label: PTN000202298
                    description: >-
                      PAINT IBD node in PTHR11748 for GO:0004458, seeded by yeast DLD1
                      and Arabidopsis D-LDH. The node is at LUCA and also covers
                      bacterial D-2-hydroxyglutarate dehydrogenases, for which the
                      family review requests pruning; the claim made here is for the
                      eukaryotic D-LDH clade only.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000202298 in PTHR11748.
            function:
              preferred_term: D-lactate dehydrogenase (cytochrome) activity
              term:
                id: GO:0004458
                label: D-lactate dehydrogenase (cytochrome) activity
              substrates:
                - preferred_term: (R)-lactate
                  term:
                    id: CHEBI:16004
                    label: (R)-lactate
                - preferred_term: ferricytochrome c
              products:
                - preferred_term: pyruvate
                  term:
                    id: CHEBI:15361
                    label: pyruvate
                - preferred_term: ferrocytochrome c
              evidence:
                - source_id: PMID:38413804
                  statement: Purified human LDHD transfers electrons from D-lactate directly to cytochrome c (kcat 103 per min, KM 112 micromolar).
                - source_id: PMID:37863926
                  statement: Mouse LDHD is a Mn2+-dependent FAD enzyme for D-lactate and other hydrophobic D-2-hydroxy acids; crystal structures define the catalytic residues.
            processes:
              - preferred_term: lactate catabolic process
                term:
                  id: GO:1903457
                  label: lactate catabolic process
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Entry step. FAD takes the hydride from C2 of D-lactate and is
              reoxidised by two molecules of cytochrome c. Loss of this step alone
              causes D-lactate dehydrogenase deficiency.
    - order: 2
      role: mobile one-electron carrier
      node:
        id: cytochrome_c_carrier_step
        label: Cytochrome c carries the electrons to cytochrome c oxidase
        module_type: REACTION
        annotons:
          - id: cytochrome_c_activity
            label: Cytochrome c
            participant:
              selector_type: FAMILY
              family:
                preferred_term: cytochrome c family
                term:
                  id: PANTHER:PTHR11961
                  label: CYTOCHROME C
                representative_members:
                  - preferred_term: CYCS (human)
                    term:
                      id: UniProtKB:P99999
                      label: Cytochrome c
                  - preferred_term: CYC1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P00044
                      label: Cytochrome c isoform 1
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              substrates:
                - preferred_term: reduced flavin of D-lactate dehydrogenase (electron donor)
              products:
                - preferred_term: ferrocytochrome c
              evidence:
                - source_id: file:human/CYCS/CYCS-ai-review.yaml
                  statement: CYCS core function GO:0009055 in the mitochondrial intermembrane space.
                - source_id: PMID:38413804
                  statement: Haem reduction of cytochrome c by LDHD with D-lactate was followed spectroscopically.
            processes:
              - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
                term:
                  id: GO:0006123
                  label: mitochondrial electron transport, cytochrome c to oxygen
            locations:
              - preferred_term: mitochondrial intermembrane space
                term:
                  id: GO:0005758
                  label: mitochondrial intermembrane space
            role_description: >-
              Accepts single electrons from the dehydrogenase and delivers them to
              complex IV. Shared with complex III and with other cytochrome c
              reductases; not specific to this route.
    - order: 3
      role: terminal oxidase (shared, modelled elsewhere)
      node:
        id: complex_iv_sink
        label: Cytochrome c oxidase (see MODULE:mitochondrial_complex_iv)
        module_ref: mitochondrial_complex_iv
  connections:
    - source: d_lactate_dehydrogenase_step
      target: cytochrome_c_carrier_step
      connection_type: PROVIDES_INPUT_FOR
      description: Ferrocytochrome c produced by the dehydrogenase is the reduced carrier of the second step.
    - source: cytochrome_c_carrier_step
      target: complex_iv_sink
      connection_type: PROVIDES_INPUT_FOR
      description: Ferrocytochrome c is reoxidised by cytochrome c oxidase, which reduces oxygen and pumps protons.
  knowledge_gaps:
    - gap_statement: >-
        The side of the inner membrane on which the animal dehydrogenase acts is
        not established. Rat liver fractionation places the activity on the
        matrix side, which would require import of D-lactate and an unexplained
        path of electrons to cytochrome c, whereas direct cytochrome c reduction
        by the purified human enzyme implies an intermembrane-space location.
      gap_kind:
        - BIOLOGY
      boundary: >-
        The module asserts the inner membrane for the dehydrogenase and does not
        include a D-lactate import step.
proposed_new_terms:
  - proposed_name: D-lactate catabolic process
    proposed_definition: >-
      The chemical reactions and pathways resulting in the breakdown of
      D-lactate, the (R) enantiomer of 2-hydroxypropanoate, for example its
      oxidation to pyruvate by a D-lactate dehydrogenase.
    justification: >-
      D-lactate and L-lactate are removed by different enzymes, and loss of the
      D-specific route raises D-lactate alone. GO has enantiomer-specific
      activity terms, but GO:1903457 is subdivided only by oxygen (GO:1990484,
      GO:1990485) and not by enantiomer, so this module
      cannot be given a process concept that distinguishes it from L-lactate
      catabolism. The same request is recorded in the human LDHD gene review.
    proposed_parent:
      id: GO:1903457
      label: lactate catabolic process
    supported_by:
      - reference_id: PMID:30931947
        supporting_text: levels of L-lactate were not significantly altered among the different conditions, establishing that LDHD is stereospecific for D-lactate only (Fig. 4c)
notes: >-
  Created with the human LDHD review (2026-11). The boundary has two modelled
  steps and a reference to the complex IV module; a module containing the
  dehydrogenase alone would be a single reaction. The glutathione-dependent
  methylglyoxal detoxification module ends at D-lactate and names downstream
  D-lactate oxidation as a separate module; this is that module for
  mitochondria. Not modelled: bacterial quinone-linked D-lactate dehydrogenases
  (a different family and acceptor), the yeast L-lactate cytochrome c
  oxidoreductase Cyb2 (a flavocytochrome b2, a parallel route for the other
  enantiomer), and mitochondrial D-lactate carriers, whose molecular identity is
  unknown. No GO-CAM contains LDHD or its yeast, mouse or zebrafish orthologs
  (gocams/index.tsv, 2026-11-26), so there are no gocam_associations. Yeast DLD1
  has no gene review in this repository yet; its place here rests on its
  UniProt record and its role as a PAINT seed for GO:0004458.
