            term:
              id: InterPro:IPR025703
              label: Bifunctional protein PutA
            description: Full fused-PutA family, combined with the required catalytic activity. PRODH
              and GSALDH must occur on the same protein; no RHH regulatory domain, extra C-terminal structural
              domain, or particular oligomeric state is universally required.
            representative_members:
            - preferred_term: PutA (Escherichia coli K-12)
              term:
                id: UniProtKB:P09546
                label: Bifunctional protein PutA
              description: Trifunctional experimental reference with steady-state PRODH kinetics and channeling
                data.
            - preferred_term: PutA (Salmonella typhimurium LT2)
              term:
                id: UniProtKB:P10503
                label: Bifunctional protein PutA
              description: Trifunctional experimental reference; the two-activity enzyme was first purified
                from Salmonella.
            - preferred_term: PutA (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88D80
                label: Bifunctional protein PutA
              description: Trifunctional KT2440 exemplar (N-terminal RHH DNA-binding domain) with pathway
                genetics in KT2442 derivatives.
            - preferred_term: PutA (Bradyrhizobium diazoefficiens USDA110)
              term:
                id: UniProtKB:Q89E26
                label: Bifunctional protein PutA
              description: Class 1A catalytic exemplar, published as B. japonicum; 3HAZ construct is GH
