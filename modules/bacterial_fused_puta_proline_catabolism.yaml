references:
- id: PMID:10613867
  title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put
    genes in the presence of root exudates.'
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Direct P. putida genetics establishes PutA-dependent proline utilization; sequence homology
      supports assignment of both PutA catalytic domains to one polypeptide. KT2442-derived pathway evidence
      relevant to KT2440 for PutP comes from PMID:11097893.
    supporting_text: This suggests that in P. putida, both enzymatic steps for proline conversion to glutamic
      acid are catalyzed by a single polypeptide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: KT2442 genetics; homologous sequence supports fused catalysis, not isolated kinetic
      measurements of every step.
  full_text_unavailable: true
- id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  publication_type: REVIEW
  findings:
  - statement: The PutA review defines the conserved fused PRODH-GSALDH architecture, quinone-linked first
      oxidation, nonenzymatic P5C ring opening, and NAD-dependent second oxidation.
    supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde
      dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
  - statement: The same review places the fused PRODH-GSALDH architecture in a subset of Gram-negative
      bacteria and the third, DNA-binding function in the lineages whose putA and putP genes are divergently
      transcribed.
    supporting_text: Curiously, in certain Gram-negative bacteria, the PRODH and GSALDH activities are
      combined into a single polypeptide, known as proline utilization A (PutA)
  - statement: Type A and type B PutAs, such as Bradyrhizobium japonicum BjPutA, have the two catalytic
      modules but no RHH DNA-binding domain. The module's two-activity core therefore applies to them
      as well.
    supporting_text: Architecture type A PutAs are about 1000 residues long and have a minimal domain
      set consisting of N-terminal PRODH and C-terminal GSALDH modules.
  - statement: Type A and type B PutAs have no RHH domain.
    supporting_text: Obviously, the lack of an RHH domain precludes this mode of dimerization in types
      A and B PutAs.
  - statement: The conserved catalytic core does not require a transcriptional DNA-binding domain.
    supporting_text: Architecture type A PutAs are about 1000 residues long and have a minimal domain
      set consisting of N-terminal PRODH and C-terminal GSALDH modules.
  - statement: P5C ring opening is nonenzymatic; GSALDH oxidizes the resulting aldehyde.
    supporting_text: undergoes non-enzymatic hydrolysis to acyclic L-glutamate-γ-semialdehyde
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review inspected for architecture, catalytic chemistry, channeling and regulatory
      scope. Its predominantly Gram-negative wording is not an exclusion of the characterized Corynebacterium
      class.
