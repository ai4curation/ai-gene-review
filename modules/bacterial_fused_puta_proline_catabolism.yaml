id: MODULE:bacterial_fused_puta_proline_catabolism
title: Bacterial sodium-coupled proline uptake and fused-PutA catabolism
description: >-
  A reusable bacterial module in which a PutP-family sodium/proline symporter
  imports L-proline and a fused PutA protein oxidizes it to L-glutamate in two
  catalytic steps. The FAD-dependent PutA PRODH domain transfers electrons to a
  quinone while forming P5C, and the NAD-dependent GSALDH domain oxidizes the
  ring-opened glutamate 5-semialdehyde intermediate to L-glutamate.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10613867
    title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put genes in the presence of root exudates.'
    statement: >-
      Direct P. putida genetics establishes the adjacent PutP uptake role and
      both PutA catalytic steps in one polypeptide.
    supporting_text: both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide
  - source_id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    statement: >-
      The PutA review defines the conserved fused PRODH-GSALDH architecture,
      quinone-linked first oxidation, nonenzymatic P5C ring opening, and
      NAD-dependent second oxidation.
    supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
  - source_id: PMID:11097893
    title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
    statement: >-
      Direct KT2440 pathway evidence assigns proline uptake to PutP and
      conversion to glutamate to PutA.
    supporting_text: Utilization of this amino acid involves its uptake, which is mediated by the PutP protein, and its conversion into glutamate, mediated by the PutA protein.
  - source_id: UniProtKB:Q88D81
    title: Pseudomonas putida KT2440 PutP exemplar
    statement: Q88D81 is the exact PutP sodium/proline-symporter exemplar and carries RHEA:28967.
  - source_id: UniProtKB:Q88D80
    title: Pseudomonas putida KT2440 PutA exemplar
    statement: Q88D80 is the exact fused PutA exemplar and carries RHEA:23784 and RHEA:30235.
  - source_id: file:PSEPK/putP/putP-ai-review.yaml
    title: Curated PSEPK putP gene review
    statement: The review supports sodium-coupled proline uptake at the plasma membrane.
  - source_id: file:PSEPK/putA/putA-ai-review.yaml
    title: Curated PSEPK putA gene review
    statement: The review supports both catalytic activities and separates regulation from the metabolic module.
notes: >-
  The boundary begins with sodium-coupled proline import and ends with
  L-glutamate. PutA-dependent transcriptional repression, respiratory-chain
  reactions downstream of quinol, and proline biosynthesis are outside the
  module. Full-length PutA orthology is used for both catalytic leaves because
  PTHR42862:SF1 is dominated by stand-alone aldehyde dehydrogenases and is not a
  safe selector for the fused architecture. The same PutA molecule therefore
  appears twice, once for each distinct active site. P5C ring opening to
  glutamate 5-semialdehyde is nonenzymatic and is represented in the connection
  between the two PutA reactions rather than as a protein-catalyzed part.
