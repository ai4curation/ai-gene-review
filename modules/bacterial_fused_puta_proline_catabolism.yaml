id: MODULE:bacterial_fused_puta_proline_catabolism
title: Bacterial sodium-coupled proline uptake and fused-PutA catabolism
description: >-
  A reusable bacterial module in which a PutP-family sodium/proline symporter
  imports L-proline and a fused PutA (proline utilization A) protein oxidizes it
  to L-glutamate in two catalytic steps. The FAD-dependent PutA proline
  dehydrogenase (PRODH) domain transfers electrons to a membrane quinone while
  forming 1-pyrroline-5-carboxylate (P5C), and after nonenzymatic ring opening
  the NAD-dependent glutamate-5-semialdehyde dehydrogenase (GSALDH) domain
  oxidizes glutamate 5-semialdehyde to L-glutamate. Fused PutA proteins occur
  mainly in Gram-negative bacteria. In lineages whose putA and putP genes are
  transcribed divergently, including Escherichia coli, Salmonella and
  Pseudomonas putida, PutA is trifunctional: an N-terminal ribbon-helix-helix
  (RHH) DNA-binding domain lets the same protein repress the put genes until
  proline accumulates. Other PutAs lack the RHH domain and have only the two
  catalytic activities.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:10613867
    title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put genes in the presence of root exudates.'
    statement: >-
      Direct P. putida genetics establishes PutA-dependent proline utilization;
      sequence homology supports assignment of both PutA catalytic domains to
      one polypeptide. Direct KT2440 pathway evidence for PutP comes from
      PMID:11097893.
    supporting_text: This suggests that in P. putida, both enzymatic steps for proline conversion to glutamic acid are catalyzed by a single polypeptide.
  - source_id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    statement: >-
      The PutA review defines the conserved fused PRODH-GSALDH architecture,
      quinone-linked first oxidation, nonenzymatic P5C ring opening, and
      NAD-dependent second oxidation.
    supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
  - source_id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    statement: >-
      The same review places the fused PRODH-GSALDH architecture in a subset of
      Gram-negative bacteria and the third, DNA-binding function in the lineages
      whose putA and putP genes are divergently transcribed.
    supporting_text: Curiously, in certain Gram-negative bacteria, the PRODH and GSALDH activities are combined into a single polypeptide, known as proline utilization A (PutA)
  - source_id: PMID:6270100
    title: Purification of the putA gene product. A bifunctional membrane-bound protein from Salmonella typhimurium responsible for the two-step oxidation of proline to glutamate.
    statement: >-
      The founding biochemical evidence: purified Salmonella PutA carries both
      oxidation steps of proline to glutamate in one polypeptide.
    supporting_text: Both proline oxidase and pyrroline-5-carboxylic acid dehydrogenase activities co-purity throughout our purification.
  - source_id: PMID:1618807
    title: Redesigned purification yields a fully functional PutA protein dimer from Escherichia coli.
    statement: >-
      E. coli genetics and biochemistry establish the PutP plus PutA two-gene
      boundary and show copurifying PRODH and P5C dehydrogenase activities.
    supporting_text: Proline utilization by Escherichia coli and Salmonella typhimurium requires expression of genes putP (encoding a proline transporter) and putA.
  - source_id: PMID:3512540
    title: Solubilization and functional reconstitution of the proline transport system of Escherichia coli.
    statement: Reconstituted E. coli PutP is a sodium-coupled proline symporter.
    supporting_text: The stoichiometry of the co-transport system was approximately one Na+ for one proline.
  - source_id: PMID:11097893
    title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
    statement: >-
      Direct KT2440 pathway evidence assigns proline uptake to PutP and
      conversion to glutamate to PutA.
    supporting_text: Utilization of this amino acid involves its uptake, which is mediated by the PutP protein, and its conversion into glutamate, mediated by the PutA protein.
  - source_id: UniProtKB:Q88D81
    title: Pseudomonas putida KT2440 PutP exemplar
    statement: Q88D81 is a PutP sodium/proline-symporter exemplar and carries RHEA:28967.
  - source_id: UniProtKB:Q88D80
    title: Pseudomonas putida KT2440 PutA exemplar
    statement: >-
      Q88D80 is a trifunctional fused PutA exemplar. It carries RHEA:23784 and
      RHEA:30235 and an N-terminal PutA RHH DNA-binding domain (residues 11-43).
  - source_id: file:PSEPK/putA/putA-uniprot.txt
    title: Pseudomonas putida KT2440 PutA UniProt record
    statement: The KT2440 PutA record carries the PutA RHH DNA-binding-domain signature.
    supporting_text: "DR   InterPro; IPR048798; PutA_RHH."
  - source_id: PMID:18767154
    title: Solution structure of the Pseudomonas putida protein PpPutA45 and its DNA complex.
    statement: >-
      The N-terminal 45 residues of P. putida PutA form an RHH domain that binds
      put control DNA, so P. putida PutA belongs to the trifunctional class.
    supporting_text: PpPutA45 was shown to bind a 14 base-pair DNA oligomer
  - source_id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    statement: >-
      Type A and type B PutAs, such as Bradyrhizobium japonicum BjPutA, have
      the two catalytic modules but no RHH DNA-binding domain. The module's
      two-activity core therefore applies to them as well.
    supporting_text: Architecture type A PutAs are about 1000 residues long and have a minimal domain set consisting of N-terminal PRODH and C-terminal GSALDH modules.
  - source_id: PMID:28712849
    title: Structure, function, and mechanism of proline utilization A (PutA).
    statement: Type A and type B PutAs have no RHH domain.
    supporting_text: Obviously, the lack of an RHH domain precludes this mode of dimerization in types A and B PutAs.
  - source_id: file:ECOLI/putA/putA-ai-review.yaml
    title: Curated ECOLI putA gene review
    statement: The review accepts PRODH, GSALDH and DNA-binding repressor activities for E. coli PutA (P09546).
  - source_id: file:SALTY/putA/putA-ai-review.yaml
    title: Curated SALTY putA gene review
    statement: The review accepts PRODH, GSALDH and DNA-binding repressor activities for Salmonella PutA (P10503).
  - source_id: file:ECOLI/putP/putP-ai-review.yaml
    title: Curated ECOLI putP gene review
    statement: The review accepts proline:sodium symporter activity at the plasma membrane for E. coli PutP (P07117).
  - source_id: file:interpro/panther/PTHR48086/PTHR48086-review.yaml
    title: PTHR48086 sodium:solute symporter family review
    statement: Proline:sodium symport is assessed as SUBFAMILY_ONLY, applicable to SF3 (and OpuE in SF1).
  - source_id: file:interpro/panther/PTHR42862/PTHR42862-review.yaml
    title: PTHR42862 P5C dehydrogenase family review
    statement: >-
      GSALDH activity is family-wide, but PRODH is PutA-only and SF1 mixes PutA
      with monofunctional P5C dehydrogenases, so the family is not a PutA selector.
  - source_id: file:PSEPK/putP/putP-ai-review.yaml
    title: Curated PSEPK putP gene review
    statement: The review supports sodium-coupled proline uptake at the plasma membrane.
  - source_id: file:PSEPK/putA/putA-ai-review.yaml
    title: Curated PSEPK putA gene review
    statement: The review supports both catalytic activities and separates regulation from the metabolic module.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_fused_puta_proline_catabolism__ppu00250-deep-research-openscientist.md
    title: OpenScientist PSEPK module, pathway, and taxon research
    statement: >-
      The taxon-aware report corroborates the two-gene, three-step module and
      distinguishes its proline-catabolic boundary from the broader ppu00250
      screening bucket.
    supporting_text: >-
      The module is **fully satisfiable** in *P. putida* KT2440, but the local
      `ppu00250` candidate bucket is the **wrong container** for it and is
      missing its transporter.
  - source_id: file:modules/bacterial_fused_puta_proline_catabolism-deep-research-openscientist.md
    title: OpenScientist generic fused-PutA module research
    statement: >-
      The generic literature synthesis corroborates the transport plus two
      oxidation-event architecture. Its lineage-specific claims are not used
      for the PSEPK exemplar where direct target-species evidence is available.
    supporting_text: >-
      The system, as scoped here, comprises three obligatory
      chemical/transport events and the molecular machines that carry them out:
notes: >-
  Scope and generalization. The module is the generic bacterial PutP plus fused
  PutA proline-utilization system, not a P. putida-specific pathway. The
  experimental references are Salmonella typhimurium PutA (purification of the
  bifunctional enzyme, membrane association, DNA binding and autoregulation) and
  Escherichia coli PutA and PutP (kinetics, quinone coupling, reconstituted
  sodium/proline symport). P. putida KT2440 is kept as one exemplar because its
  put genes have direct pathway genetics. All three representative PutAs are
  trifunctional: KT2440 PutA also carries the N-terminal RHH DNA-binding domain
  (PMID:18767154) and represses its put genes. Transcriptional repression is
  excluded from the module because it is a separate, non-metabolic activity of
  the same protein, not a step in the proline-to-glutamate conversion. The
  RHH-less type A and type B PutAs (for example Bradyrhizobium japonicum BjPutA,
  PMID:28712849) show that the two catalytic steps occur without it. Taxon context stays at Bacteria because
  fused PutA proteins are also found outside the Gram-negative lineages that
  dominate the characterized set; lineages with separate PRODH and P5C
  dehydrogenase proteins (for example Bacillus PutB/PutC) are not instances of
  this module. The boundary begins with sodium-coupled proline import and ends
  with L-glutamate. PutA-dependent transcriptional repression, respiratory-chain
  reactions downstream of quinol, and proline biosynthesis are outside the
  module; the regulatory activity is recorded as a core function in the E. coli,
  Salmonella and P. putida PutA gene reviews. Grounding. The PutP step uses PANTHER
  PTHR48086:SF3 (SODIUM_PROLINE SYMPORTER), because the family as a whole is
  substrate-heterogeneous (PanF, ActP, DUR31) while SF3 is the PutP clade; both
  representatives are classified at SF3. The PRODH step uses InterPro
  IPR025703 (Bifunct_PutA), the full-length fused-PutA family, because PRODH
  activity lies outside the aldehyde-dehydrogenase domain. The GSALDH step uses
  NCBIfam TIGR01238, the PutA C-terminal-domain branch of P5C dehydrogenases
  (InterPro IPR005933). Both match E. coli, Salmonella and KT2440 PutA but not
  monofunctional B. subtilis RocA or yeast PUT2 (checked against the InterPro
  API). PANTHER is not used: PutA falls in PTHR42862:SF1, which also holds monofunctional fungal
  PUT2 and Firmicute RocA/PutC P5C dehydrogenases that lack the PRODH domain, so
  the PANTHER subfamily cannot select the fused architecture. The same PutA
  molecule appears in two leaves, one per active site. P5C ring opening to
  glutamate 5-semialdehyde is nonenzymatic and is represented in the connection
  between the two PutA reactions rather than as a protein-catalyzed part.
