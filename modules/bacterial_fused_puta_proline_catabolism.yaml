id: MODULE:bacterial_fused_puta_proline_catabolism
title: Bacterial sodium-coupled proline uptake and fused-PutA catabolism
description: A bacterial proline-utilization mechanism combines PutP-family sodium/proline symport with
  two oxidative reactions catalyzed by one fused PutA protein. The FAD-dependent PRODH active site couples
  proline oxidation to quinone reduction. Nonenzymatic opening of the resulting pyrroline-5-carboxylate
  ring supplies glutamate semialdehyde to the NAD-dependent GSALDH active site, producing glutamate. The
  two active sites are connected by a substrate-channeling tunnel. Catalytic PutA architectures occur
  across distinct bacterial lineages, including Corynebacterium; an additional RHH DNA-binding domain
  confers transcriptional repression in type C PutAs but is not required for the two-reaction catalytic
  core.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:10613867
  title: 'Proline catabolism by Pseudomonas putida: cloning, characterization, and expression of the put
    genes in the presence of root exudates.'
  statement: Direct P. putida genetics establishes PutA-dependent proline utilization; sequence homology
    supports assignment of both PutA catalytic domains to one polypeptide. KT2442-derived pathway evidence
    relevant to KT2440 for PutP comes from PMID:11097893.
  supporting_text: This suggests that in P. putida, both enzymatic steps for proline conversion to glutamic
    acid are catalyzed by a single polypeptide.
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: The PutA review defines the conserved fused PRODH-GSALDH architecture, quinone-linked first
    oxidation, nonenzymatic P5C ring opening, and NAD-dependent second oxidation.
  supporting_text: FAD-dependent proline dehydrogenase (PRODH) and NAD+-dependent glutamate semialdehyde
    dehydrogenase (GSALDH) convert proline to glutamate in two sequential oxidative steps.
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: The same review places the fused PRODH-GSALDH architecture in a subset of Gram-negative bacteria
    and the third, DNA-binding function in the lineages whose putA and putP genes are divergently transcribed.
  supporting_text: Curiously, in certain Gram-negative bacteria, the PRODH and GSALDH activities are combined
    into a single polypeptide, known as proline utilization A (PutA)
- source_id: PMID:6270100
  title: Purification of the putA gene product. A bifunctional membrane-bound protein from Salmonella
    typhimurium responsible for the two-step oxidation of proline to glutamate.
  statement: 'The founding biochemical evidence: purified Salmonella PutA carries both oxidation steps
    of proline to glutamate in one polypeptide.'
  supporting_text: Both proline oxidase and pyrroline-5-carboxylic acid dehydrogenase activities co-purity
    throughout our purification.
- source_id: PMID:1618807
  title: Redesigned purification yields a fully functional PutA protein dimer from Escherichia coli.
  statement: E. coli genetics and biochemistry establish the PutP plus PutA two-gene boundary and show
    copurifying PRODH and P5C dehydrogenase activities.
  supporting_text: Proline utilization by Escherichia coli and Salmonella typhimurium requires expression
    of genes putP (encoding a proline transporter) and putA.
- source_id: PMID:3512540
  title: Solubilization and functional reconstitution of the proline transport system of Escherichia coli.
  statement: Reconstituted E. coli PutP is a sodium-coupled proline symporter.
  supporting_text: The stoichiometry of the co-transport system was approximately one Na+ for one proline.
- source_id: PMID:11097893
  title: Control of expression of divergent Pseudomonas putida put promoters for proline catabolism.
  statement: KT2442-derived pathway evidence relevant to KT2440 assigns proline uptake to PutP and conversion
    to glutamate to PutA.
  supporting_text: Utilization of this amino acid involves its uptake, which is mediated by the PutP protein,
    and its conversion into glutamate, mediated by the PutA protein.
- source_id: UniProtKB:Q88D81
  title: Pseudomonas putida KT2440 PutP exemplar
  statement: Q88D81 is a PutP sodium/proline-symporter exemplar and carries RHEA:28967.
- source_id: UniProtKB:Q88D80
  title: Pseudomonas putida KT2440 PutA exemplar
  statement: Q88D80 is a trifunctional fused PutA exemplar. It carries RHEA:23784 and RHEA:30235 and an
    N-terminal PutA RHH DNA-binding domain (residues 11-43).
- source_id: file:PSEPK/putA/putA-uniprot.txt
  title: Pseudomonas putida KT2440 PutA UniProt record
  statement: The KT2440 PutA record carries the PutA RHH DNA-binding-domain signature.
  supporting_text: DR   InterPro; IPR048798; PutA_RHH.
- source_id: PMID:18767154
  title: Solution structure of the Pseudomonas putida protein PpPutA45 and its DNA complex.
  statement: The N-terminal 45 residues of P. putida PutA form an RHH domain that binds put control DNA,
    so P. putida PutA belongs to the trifunctional class.
  supporting_text: PpPutA45 was shown to bind a 14 base-pair DNA oligomer
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: Type A and type B PutAs, such as Bradyrhizobium japonicum BjPutA, have the two catalytic
    modules but no RHH DNA-binding domain. The module's two-activity core therefore applies to them as
    well.
  supporting_text: Architecture type A PutAs are about 1000 residues long and have a minimal domain set
    consisting of N-terminal PRODH and C-terminal GSALDH modules.
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: Type A and type B PutAs have no RHH domain.
  supporting_text: Obviously, the lack of an RHH domain precludes this mode of dimerization in types A
    and B PutAs.
- source_id: file:ECOLI/putA/putA-ai-review.yaml
  title: Curated ECOLI putA gene review
  statement: The review accepts PRODH, GSALDH and DNA-binding repressor activities for E. coli PutA (P09546).
- source_id: file:SALTY/putA/putA-ai-review.yaml
  title: Curated SALTY putA gene review
  statement: The review accepts PRODH, GSALDH and DNA-binding repressor activities for Salmonella PutA
    (P10503).
- source_id: file:ECOLI/putP/putP-ai-review.yaml
  title: Curated ECOLI putP gene review
  statement: The review accepts proline:sodium symporter activity at the plasma membrane for E. coli PutP
    (P07117).
- source_id: file:interpro/panther/PTHR48086/PTHR48086-review.yaml
  title: PTHR48086 sodium:solute symporter family review
  statement: Proline:sodium symport is assessed as SUBFAMILY_ONLY, applicable to SF3 (and OpuE in SF1).
- source_id: file:interpro/panther/PTHR42862/PTHR42862-review.yaml
  title: PTHR42862 P5C dehydrogenase family review
  statement: GSALDH activity is family-wide, but PRODH is PutA-only and SF1 mixes PutA with monofunctional
    P5C dehydrogenases, so the family is not a PutA selector.
- source_id: file:PSEPK/putP/putP-ai-review.yaml
  title: Curated PSEPK putP gene review
  statement: The review supports sodium-coupled proline uptake at the plasma membrane.
- source_id: file:PSEPK/putA/putA-ai-review.yaml
  title: Curated PSEPK putA gene review
  statement: The review supports both catalytic activities and separates regulation from the metabolic
    module.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_fused_puta_proline_catabolism__ppu00250-deep-research-openscientist.md
  title: OpenScientist PSEPK module, pathway, and taxon research
  statement: The taxon-aware report corroborates the two-gene, three-step module and distinguishes its
    proline-catabolic boundary from the broader ppu00250 screening bucket.
  supporting_text: The module is **fully satisfiable** in *P. putida* KT2440, but the local `ppu00250`
    candidate bucket is the **wrong container** for it and is missing its transporter.
- source_id: file:modules/bacterial_fused_puta_proline_catabolism-deep-research-openscientist.md
  title: OpenScientist generic fused-PutA module research
  statement: The generic literature synthesis corroborates the transport plus two oxidation-event architecture.
    Its lineage-specific claims are not used for the PSEPK exemplar where direct target-species evidence
    is available.
  supporting_text: 'The system, as scoped here, comprises three obligatory chemical/transport events and
    the molecular machines that carry them out:'
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: The conserved catalytic core does not require a transcriptional DNA-binding domain.
  supporting_text: Architecture type A PutAs are about 1000 residues long and have a minimal domain set
    consisting of N-terminal PRODH and C-terminal GSALDH modules.
- source_id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  statement: P5C ring opening is nonenzymatic; GSALDH oxidizes the resulting aldehyde.
  supporting_text: undergoes non-enzymatic hydrolysis to acyclic L-glutamate-γ-semialdehyde
- source_id: PMID:28990412
  title: Structural Biology of Proline Catabolic Enzymes.
  statement: The comparative review separates catalytic architecture and phylogenetic branch; representatives
    sample all five established classes.
  supporting_text: 1A, 1B, 1C, 2A, and 3B
- source_id: PMID:28990412
  title: Structural Biology of Proline Catabolic Enzymes.
  statement: Transcriptional repression is an added function of class 1C and is outside this metabolic
    module.
  supporting_text: Class 1C PutAs are unique in that they function as transcriptional repressors as well
    as bifunctional enzymes.
- source_id: PMID:27679491
  title: Structures of Proline Utilization A (PutA) Reveal the Fold and Functions of the Aldehyde Dehydrogenase
    Superfamily Domain of Unknown Function.
  statement: Purified SmPutA couples proline oxidation with quinone reduction and NAD-dependent GSALDH
    chemistry; soluble CoQ1 does not identify its native quinone pool.
  supporting_text: The time dependence of NADH production was monitored in an assay containing proline,
    an electron acceptor for the flavin (ubiquinone-1, CoQ 1 ), and NAD + .
- source_id: PMID:27679491
  title: Structures of Proline Utilization A (PutA) Reveal the Fold and Functions of the Aldehyde Dehydrogenase
    Superfamily Domain of Unknown Function.
  statement: The extra C-terminal ALDH-like domain is structural, not a second NAD-binding catalytic site.
  supporting_text: Electron density maps show that NAD+ does not bind to the DUF Rossmann fold
- source_id: PMID:28420730
  title: 'Structure and characterization of a class 3B proline utilization A: Ligand-induced dimerization
    and importance of the C-terminal domain for catalysis.'
  statement: Class 3B CfPutA establishes fused catalysis beyond the proteobacterial exemplars; the assayed
    recombinant protein does not establish native transport or membrane localization.
  supporting_text: Here, we studied PutA from Corynebacterium freiburgense (CfPutA), which belongs to
    the uncharacterized 3B class of PutAs.
- source_id: PMID:28420730
  title: 'Structure and characterization of a class 3B proline utilization A: Ligand-induced dimerization
    and importance of the C-terminal domain for catalysis.'
  statement: CfPutA coupled assays use a soluble model quinone and NAD+, not a measured native respiratory
    quinone.
  supporting_text: A fixed concentration of enzyme (0.42–0.50 μ m ) was mixed with 0.1 m m menadione bisulfite,
    0.2 m m NAD + , and 40 m m proline.
- source_id: PMID:34506758
  title: Probing the function of a ligand-modulated dynamic tunnel in bifunctional proline utilization
    A (PutA).
  statement: The Geobacter tunnel experiments directly identify the PCA Q746X3 exemplar.
  supporting_text: All experiments were performed on PutA from Geobacter sulfurreducens PCA (GsPutA, 1004
    residues, UniProt Q746X3).
- source_id: PMID:34506758
  title: Probing the function of a ligand-modulated dynamic tunnel in bifunctional proline utilization
    A (PutA).
  statement: Purified GsPutA coupled turnover uses a model quinone and NAD+, with separate dye-coupled
    PRODH assays.
  supporting_text: The assay included 0.5 μM enzyme, 0.1 mM menadione, 0.2 mM NAD+
- source_id: PMID:24358297
  title: The sodium/proline transporter PutP of Helicobacter pylori.
  statement: Helicobacter transport experiments used strain P12; G27 B5Z6C0 is a separately reviewed family-based
    exemplar, not the assayed construct.
  supporting_text: experiment-based information on the molecular mechanism of proline uptake into H. pylori
    P12.
- source_id: PMID:24358297
  title: The sodium/proline transporter PutP of Helicobacter pylori.
  statement: Sodium is a demonstrated coupling ion, but lithium can substitute in reconstitution; sodium-exclusive
    wording in the abstract is too strong.
  supporting_text: Also a lmf proved to be an efficient driving force indicating that Na+ could be substituted
    by Li+.
- source_id: PMID:16452403
  title: Oxygen reactivity of PutA from Helicobacter species and proline-linked oxidative stress.
  statement: The assayed H. pylori PutA was from J99, not G27; its oxidase and dye assays are not direct
    proof of G27 quinone turnover or membrane localization.
  supporting_text: The putA gene from H. pylori was cloned similarly by using H. pylori strain J99 genomic
    DNA
- source_id: PMID:16452403
  title: Oxygen reactivity of PutA from Helicobacter species and proline-linked oxidative stress.
  statement: Helicobacter PutA experiments separate catalytic function from the E. coli DNA-binding regulatory
    role.
  supporting_text: Both PutA(Hh) and PutA(Hp) lack DNA binding activity
- source_id: PMID:40738191
  title: Visualization of covalent intermediates and conformational states of proline utilization A by
    X-ray crystallography and molecular dynamics simulations.
  statement: The 2025 structural study explicitly uses the reviewed SmPutA accession; tags were removed
    during purification.
  supporting_text: recombinant SmPutA (UniProt F7X6I3)
- source_id: PMID:40738191
  title: Visualization of covalent intermediates and conformational states of proline utilization A by
    X-ray crystallography and molecular dynamics simulations.
  statement: Structures visualize the GSALDH covalent intermediate and substrate/product complexes; simulations
    support channeling but do not establish native pathway flux.
  supporting_text: the covalent acyl-enzyme intermediate of the GSALDH reaction
notes: 'The Bacteria context is an envelope for this particular mechanism, not universal bacterial capacity.
  Eight PutA exemplars span class 1C (Escherichia, Salmonella, Pseudomonas), 1A (Bradyrhizobium), 1B (Sinorhizobium),
  2A (Geobacter), 3B (Corynebacterium), and a non-regulatory Helicobacter comparison. Bradyrhizobium USDA110
  is now B. diazoefficiens; the paper calls it B. japonicum. Geobacter belongs to Thermodesulfobacteriota,
  Helicobacter to Campylobacterota, and Corynebacterium to Actinomycetota. Complete uptake-plus-catabolism
  evidence is strongest in E. coli and P. putida; the latter papers use KT2442 derivatives of KT2440,
  with inconsistent strain naming in PMID:11097893. Other PutAs are component exemplars, not proof of
  a matched PutP pathway. G27 PutA and PutP are family-based inferences compared with J99 PutA and P12
  PutP assays; these three strains are not interchangeable. The Corynebacterium structural accession includes
  a GH cloning remnant and does not establish a native strain, membrane face or respiratory quinone. Both
  catalytic leaves require IPR025703 plus their individual activity and the same full-length polypeptide.
  TIGR01238 is absent from current Geobacter, Corynebacterium and Helicobacter records despite fused-PutA
  membership, so it is not a universal GSALDH selector. PTHR42862:SF1 also contains monofunctional RocA
  and fungal PUT2 and is not a fused-PutA selector. PutP uses PTHR48086:SF3 with proline:sodium symport
  evidence; the broader family admits other substrates. Required-domain descriptions and matching-system
  conditions need explicit evidence: a compiler family hit alone cannot establish fusion, activity or
  native pathway flux. Transcriptional repression, downstream respiratory-chain chemistry and proline
  biosynthesis remain outside the boundary. The quinone substrate uses CHEBI:36141 rather than the narrower
  1,4-benzoquinone class; the reduced product is described without an unsupported generic ontology identifier.
  This accommodates model menadione assays without asserting native acceptor identity.'
module:
  id: bacterial_fused_puta_proline_catabolism
  label: Bacterial sodium-coupled proline uptake and fused-PutA catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: L-proline catabolic process
    term:
      id: GO:0006562
      label: L-proline catabolic process
    description: Uptake and two-step oxidation of L-proline to L-glutamate.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: The module describes bacterial systems with a PutP-like sodium symporter and a fused
        PutA protein that carries both catalytic domains.
  parts:
  - order: 1
    role: sodium-coupled proline uptake
    node:
      id: putp_proline_import
      label: PutP sodium/proline symport
      module_type: TRANSPORT_STEP
      annotons:
      - id: putp_activity
        label: PutP sodium/proline symporter activity
        participant:
          selector_type: FAMILY
          required_function:
            preferred_term: proline:sodium symporter activity
            term:
              id: GO:0005298
              label: proline:sodium symporter activity
          family:
            preferred_term: bacterial PutP sodium/proline symporter family
            term:
              id: PANTHER:PTHR48086:SF3
              label: SODIUM_PROLINE SYMPORTER
            description: The PutP clade of the substrate-heterogeneous PTHR48086 sodium:solute symporter
              family; the family id alone would also admit pantothenate, acetate and spermidine transporters.
            representative_members:
            - preferred_term: PutP (Escherichia coli K-12)
              term:
                id: UniProtKB:P07117
                label: Sodium/proline symporter
              description: Experimental reference; purified and reconstituted Na+/proline symporter.
            - preferred_term: PutP (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88D81
                label: Sodium/proline symporter
              description: KT2440 sequence exemplar, compared with pathway genetics in KT2442 derivatives.
            - preferred_term: PutP (Helicobacter pylori G27)
              term:
                id: UniProtKB:B5Z6C0
                label: Sodium/proline symporter
              description: G27 HPG27_50 is assigned by PutP family classification and comparison with
                experimentally studied P12 HPP12_0049. No direct G27 transport assay is claimed.
            evidence:
            - source_id: file:HELPG/putP/putP-uniprot.txt
              statement: G27 PutP belongs to the same substrate-specific PANTHER subfamily as the original
                exemplars.
              supporting_text: DR   PANTHER; PTHR48086:SF3; SODIUM_PROLINE SYMPORTER; 1.
        function:
          preferred_term: proline:sodium symporter activity
          term:
            id: GO:0005298
            label: proline:sodium symporter activity
          substrates:
          - preferred_term: extracellular L-proline
            term:
              id: CHEBI:60039
              label: L-proline zwitterion
          - preferred_term: extracellular sodium ion
            term:
              id: CHEBI:29101
              label: sodium(1+)
          products:
          - preferred_term: cytoplasmic L-proline
            term:
              id: CHEBI:60039
              label: L-proline zwitterion
          - preferred_term: cytoplasmic sodium ion
            term:
              id: CHEBI:29101
              label: sodium(1+)
          evidence:
          - source_id: RHEA:28967
            statement: RHEA:28967 defines reversible coupled L-proline and sodium transport; this module
              displays the physiological uptake direction.
          - source_id: PMID:3512540
            statement: Reconstituted E. coli PutP accumulates proline driven by a sodium gradient with
              about 1:1 stoichiometry.
            supporting_text: More than a 10-fold accumulation was seen with a sodium electrochemical gradient
              while no accumulation was found with proton motive force alone.
          - source_id: PMID:9693004
            statement: Purified E. coli PutP is sufficient for cation-coupled proline accumulation.
            supporting_text: Reconstituted PutP is able to accumulate proline against a concentration
              gradient in the presence of an inwardly directed electrochemical Na+ or Li+ gradient
          - source_id: PMID:11097893
            statement: The KT2442-derived pathway study assigns proline uptake to PutP.
            supporting_text: its uptake, which is mediated by the PutP protein
          - source_id: PMID:24358297
            title: The sodium/proline transporter PutP of Helicobacter pylori.
            statement: Helicobacter transport experiments used strain P12; G27 B5Z6C0 is a separately
              reviewed family-based exemplar, not the assayed construct.
            supporting_text: experiment-based information on the molecular mechanism of proline uptake
              into H. pylori P12.
          - source_id: PMID:24358297
            title: The sodium/proline transporter PutP of Helicobacter pylori.
            statement: Sodium is a demonstrated coupling ion, but lithium can substitute in reconstitution;
              sodium-exclusive wording in the abstract is too strong.
            supporting_text: Also a lmf proved to be an efficient driving force indicating that Na+ could
              be substituted by Li+.
        processes:
        - preferred_term: proline transmembrane transport
          term:
            id: GO:0035524
            label: proline transmembrane transport
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: Imports the substrate consumed by the fused PutA enzyme.
  - order: 2
    role: quinone-linked proline oxidation
    node:
      id: puta_proline_dehydrogenase
      label: PutA proline dehydrogenase reaction
      module_type: REACTION
      annotons:
