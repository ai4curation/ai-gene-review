        The physiological quinone species that accepts electrons from PutA in
        P. putida KT2440 has not been established in the reviewed evidence.
      boundary: >-
        Q88D80 and RHEA:23784 establish a quinone-linked PRODH reaction, so the
        module does not choose ubiquinone, menaquinone, or a growth-condition-specific pool.
