      dark_aspect: RESIDUAL_SUBGAP
      status: OPEN
      significance: The native acceptor determines how proline oxidation couples to respiration.
      resolution: Compare purified Q88D80 turnover with native KT2440 quinones and test quinone-pathway mutants in vivo.
