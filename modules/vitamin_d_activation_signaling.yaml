id: MODULE:vitamin_d_activation_signaling
title: Vitamin D activation and VDR signalling — CYP2R1 25-hydroxylation, CYP27B1 1-alpha-hydroxylation, VDR/RXR genomic action
description: >-
  Vitamin D (cholecalciferol from skin or diet, or ergocalciferol) is a prohormone that must be
  hydroxylated twice before it can act. A microsomal cytochrome P450 25-hydroxylase, principally
  CYP2R1 in the liver, converts vitamin D to 25-hydroxyvitamin D (calcidiol), the abundant
  circulating storage form. The mitochondrial cytochrome P450 CYP27B1, whose renal proximal-tubule
  expression is induced by PTH and suppressed by calcitriol and FGF23, then performs the
  rate-limiting 1-alpha-hydroxylation to 1-alpha,25-dihydroxyvitamin D (calcitriol). Calcitriol binds
  the nuclear vitamin D receptor (VDR), which heterodimerises with RXR on vitamin D response elements
  and recruits coactivators to regulate target genes driving intestinal calcium and phosphate
  absorption, skeletal mineralization and feedback on vitamin D metabolism: liganded VDR represses
  CYP27B1 and induces the 24-hydroxylase CYP24A1, which inactivates both calcidiol and calcitriol.
  Loss of each step causes a vitamin D-dependent rickets: CYP2R1 (VDDR1B, low 25-hydroxyvitamin D),
  CYP27B1 (VDDR1A, low calcitriol) and VDR (VDDR2A, hereditary 1,25-dihydroxyvitamin D-resistant
  rickets with high calcitriol).
status: DRAFT
evidence:
  - source_id: Reactome:R-HSA-196791
    title: Vitamin D (calciferol) metabolism
    statement: >-
      The activation steps follow the human Reactome pathway "Vitamin D (calciferol) metabolism".
  - source_id: Reactome:R-HSA-209845
    title: CYP2R1 25-hydroxylates VD3 to 25(OH)D
    statement: The 25-hydroxylation step is the human Reactome reaction R-HSA-209845.
  - source_id: Reactome:R-HSA-209868
    title: CYP27B1 hydroxylates 25(OH)D to 1,25(OH)2D
    statement: The 1-alpha-hydroxylation step is the human Reactome reaction R-HSA-209868.
  - source_id: file:human/CYP2R1/CYP2R1-ai-review.yaml
    title: CYP2R1 gene review (human)
    statement: >-
      The 25-hydroxylase step (UniProtKB:Q6VVX0, GO:0030343, endoplasmic reticulum membrane)
      matches the completed human CYP2R1 review.
  - source_id: file:human/CYP27B1/CYP27B1-ai-review.yaml
    title: CYP27B1 gene review (human)
    statement: >-
      The 1-alpha-hydroxylase step (UniProtKB:O15528, GO:0004498, mitochondrial inner membrane)
      matches the completed human CYP27B1 review.
  - source_id: file:human/VDR/VDR-ai-review.yaml
    title: VDR gene review (human)
    statement: >-
      The receptor step (UniProtKB:P11473, GO:0004879 nuclear receptor activity, GO:1902098
      calcitriol binding, GO:0070561 vitamin D receptor signaling pathway) matches the completed
      human VDR review.
module:
  id: vitamin_d_activation_signaling
  label: Vitamin D activation and VDR signalling
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: vitamin D3 biosynthetic process
      term:
        id: GO:1901755
        label: vitamin D3 biosynthetic process
      description: >-
        Sequential 25- and 1-alpha-hydroxylation converting vitamin D3 to hormonally active
        calcitriol.
    - preferred_term: vitamin D receptor signaling pathway
      term:
        id: GO:0070561
        label: vitamin D receptor signaling pathway
      description: Calcitriol-activated VDR/RXR regulation of target-gene transcription.
  parts:
    - order: 1
      role: hepatic 25-hydroxylation of vitamin D
      node:
        id: cyp2r1_step
        label: vitamin D3 (calciol) to 25-hydroxyvitamin D3 (calcidiol)
        module_type: REACTION
        annotons:
          - id: cyp2r1_activity
            label: "CYP2R1: microsomal vitamin D 25-hydroxylase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Vitamin D 25-hydroxylase (CYP2R1 subfamily of cytochrome P450 family 2)
                term:
                  id: PANTHER:PTHR24300:SF48
                  label: VITAMIN D 25-HYDROXYLASE
                representative_members:
                  - preferred_term: CYP2R1 (human)
                    term:
                      id: UniProtKB:Q6VVX0
                      label: Vitamin D 25-hydroxylase
            function:
              preferred_term: vitamin D 25-hydroxylase activity
              term:
                id: GO:0030343
                label: vitamin D 25-hydroxylase activity
              substrates:
                - preferred_term: vitamin D3 (calciol) or vitamin D2
                - preferred_term: O2
                - preferred_term: reduced NADPH--hemoprotein reductase
              products:
                - preferred_term: 25-hydroxyvitamin D (calcidiol)
              evidence:
                - source_id: Reactome:R-HSA-209845
                  statement: "CYP2R1 25-hydroxylates VD3 to 25(OH)D (human Reactome reaction)"
                - source_id: file:human/CYP2R1/CYP2R1-ai-review.yaml
                  statement: Microsomal secosteroid-specific 25-hydroxylase; biallelic loss causes VDDR1B
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Principal (but not sole) hepatic vitamin D 25-hydroxylase producing circulating
              25-hydroxyvitamin D; Cyp2r1-null mice retain about half of serum 25(OH)D3, implying
              another 25-hydroxylase. Deficiency = vitamin D-dependent rickets type 1B.
    - order: 2
      role: renal (and extrarenal) 1-alpha-hydroxylation to calcitriol
      node:
        id: cyp27b1_step
        label: 25-hydroxyvitamin D3 (calcidiol) to 1-alpha,25-dihydroxyvitamin D3 (calcitriol)
        module_type: REACTION
        annotons:
          - id: cyp27b1_activity
            label: "CYP27B1: mitochondrial 25-hydroxyvitamin D 1-alpha-hydroxylase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 25-hydroxyvitamin D 1-alpha-hydroxylase (CYP27B1, mitochondrial cytochrome P450)
                term:
                  id: PANTHER:PTHR24279:SF121
                  label: CYTOCHROME P450 FAMILY 27 SUBFAMILY B MEMBER 1
                representative_members:
                  - preferred_term: CYP27B1 (human)
                    term:
                      id: UniProtKB:O15528
                      label: 25-hydroxyvitamin D-1 alpha hydroxylase, mitochondrial
            function:
              preferred_term: calcidiol 1-monooxygenase activity
              term:
                id: GO:0004498
                label: calcidiol 1-monooxygenase activity
              substrates:
                - preferred_term: 25-hydroxyvitamin D3 (calcidiol)
                - preferred_term: O2
                - preferred_term: reduced adrenodoxin
              products:
                - preferred_term: 1-alpha,25-dihydroxyvitamin D3 (calcitriol)
              evidence:
                - source_id: Reactome:R-HSA-209868
                  statement: "CYP27B1 hydroxylates 25(OH)D to 1,25(OH)2D (human Reactome reaction)"
                - source_id: file:human/CYP27B1/CYP27B1-ai-review.yaml
                  statement: Rate-limiting activation step; biallelic loss causes VDDR1A
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Adrenodoxin-dependent mitochondrial P450 of the renal proximal tubule (endocrine
              calcitriol) and of macrophages, keratinocytes and bone cells (local calcitriol).
              Regulated by PTH (up), FGF23 and calcitriol (down). Deficiency = vitamin
              D-dependent rickets type 1A.
    - order: 3
      role: calcitriol-activated nuclear receptor signalling
      node:
        id: vdr_step
        label: calcitriol-VDR-RXR regulation of target genes
        module_type: SIGNALING_PATHWAY
        annotons:
          - id: vdr_activity
            label: "VDR: vitamin D receptor (NR1I1)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Vitamin D receptor (nuclear receptor subfamily 1 group I member 1)
                term:
                  id: PANTHER:PTHR24082:SF38
                  label: VITAMIN D3 RECEPTOR
                representative_members:
                  - preferred_term: VDR (human)
                    term:
                      id: UniProtKB:P11473
                      label: Vitamin D3 receptor
            function:
              preferred_term: nuclear receptor activity
              term:
                id: GO:0004879
                label: nuclear receptor activity
              evidence:
                - source_id: file:human/VDR/VDR-ai-review.yaml
                  statement: >-
                    Calcitriol-binding nuclear receptor; heterodimerises with RXR on vitamin D
                    response elements; biallelic loss causes VDDR2A (HVDRR)
            processes:
              - preferred_term: vitamin D receptor signaling pathway
                term:
                  id: GO:0070561
                  label: vitamin D receptor signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Binds calcitriol (GO:1902098) and, with RXR (RXRA), binds DR3-type vitamin D
              response elements to activate genes for intestinal calcium/phosphate absorption and
              to feed back on vitamin D metabolism (repression of CYP27B1, induction of CYP24A1).
  connections:
    - source: cyp2r1_step
      target: cyp27b1_step
      connection_type: PROVIDES_INPUT_FOR
      description: 25-hydroxyvitamin D made by CYP2R1 is the substrate of CYP27B1.
    - source: cyp27b1_step
      target: vdr_step
      connection_type: PROVIDES_INPUT_FOR
      description: Calcitriol made by CYP27B1 is the activating ligand of VDR.
    - source: vdr_step
      target: cyp27b1_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Liganded VDR-RXR binds vitamin D response elements in the CYP27B1 promoter and represses
        the gene (feedback; PMID:17426122, cited in the VDR review).
  notes: >-
    Grounded to the human gene reviews of CYP2R1 (UniProtKB:Q6VVX0, GO:0030343), CYP27B1
    (O15528, GO:0004498) and VDR (P11473, GO:0004879/GO:1902098). Reactome reaction ids and
    titles were checked against the local reactome cache. Family selectors use the PANTHER
    subfamily recorded in each representative's UniProt cross-reference (PTHR24300:SF48,
    PTHR24279:SF121, PTHR24082:SF38), with labels copied from interpro/panther/panther.obo. Members deliberately not modelled as
    parts because no AIGR gene review exists yet: RXRA (obligate VDR heterodimer partner, P19793),
    CYP24A1 (24-hydroxylase that inactivates calcidiol and calcitriol; loss causes idiopathic
    infantile hypercalcaemia), CYP27A1 (minor mitochondrial 25-hydroxylase), GC (vitamin D-binding
    protein) and the endocytic LRP2/CUBN reuptake of GC-bound 25(OH)D in the proximal tubule.
    HNRNPC (reviewed) is not a pathway member; its overexpression competes with VDR-RXR for
    vitamin D response elements and causes the VDR-normal form of hereditary vitamin D-resistant
    rickets (dismech Vitamin_D-Dependent_Rickets_Type_2B). Upstream regulators of CYP27B1 (PTH,
    FGF23/KL) belong to the phosphate/calcium endocrine modules. Disorders: VDDR1B (CYP2R1),
    VDDR1A (CYP27B1), VDDR2A (VDR), VDDR2B (HNRNPC overexpression), VDDR3 (CYP3A4 gain of
    function, accelerated inactivation).
