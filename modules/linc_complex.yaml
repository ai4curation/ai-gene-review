    - order: 3
      role: torsinA-dependent assembly of LINC complexes into force-bearing TAN lines
      optional: true
      node:
        id: torsin_linc_regulation
        label: TorsinA regulation of LINC assembly
        module_type: REGULATORY_STEP
        description: >-
          The AAA+ ATPase torsinA, which resides in the nuclear envelope lumen
          and is activated by the inner-nuclear-membrane protein LAP1, is
          required to assemble nesprin-2G/SUN2 TAN lines and for
          actin-dependent rearward nuclear movement in migrating fibroblasts.
          It is a context-specific regulator, not a general LINC assembly
          factor: its direct substrates are unknown, and whether it acts
          directly on SUN-KASH pairs is not settled.
        annotons:
          - id: torsin_a_atpase
            label: TorsinA luminal AAA+ ATPase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TOR1A (torsinA)
                term:
                  id: UniProtKB:O14656
                  label: Torsin-1A
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
              description: >-
                ATPase activity depends on the LAP1 (or LULL1) activator.
            locations:
              - preferred_term: nuclear envelope lumen
                term:
                  id: GO:0005641
                  label: nuclear envelope lumen
            evidence:
              - source_id: PMID:28242745
                title: "TorsinA controls TAN line assembly and the retrograde flow of dorsal perinuclear actin cables during rearward nuclear movement."
                supporting_text: >-
                  Both TA and LAP1 contributed to the assembly of transmembrane
                  actin-associated nuclear (TAN) lines, which couple the nucleus
                  to dorsal perinuclear actin cables undergoing retrograde flow.
  connections:
    - source: sun_component
      target: kash_component
      description: >-
        SUN trimers bind KASH peptides in the perinuclear space and are
        required to keep KASH proteins in the outer nuclear membrane.
    - source: torsin_linc_regulation
      target: kash_component
      connection_type: POSITIVELY_REGULATES
      description: >-
        TorsinA with LAP1 promotes assembly of nesprin-2G/SUN2 TAN lines and
        the mobility of nesprin-2G within the nuclear envelope.
