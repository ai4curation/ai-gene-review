              - id: kash5_meiotic
                label: KASH5 with SUN1 (meiotic telomere attachment)
                module_type: PROTEIN_COMPLEX
                description: >-
                  In meiotic prophase I, SUN1 binds telomeres at the inner
                  nuclear membrane and pairs with the germ-cell-specific KASH5
                  (SUN2 can partly substitute). KASH5 is a transmembrane dynein
                  activating adaptor: its N-terminal EF-hands bind the dynein
                  light intermediate chain, and with LIS1 and dynactin it turns
                  dynein into a processive motor. Telomeres are thereby moved
                  along cytoplasmic microtubules to cluster in the bouquet so
                  that homologous chromosomes can pair. On the nucleoplasmic
                  side, SUN1 is recruited to telomeres by the TRF1-TERB1-TERB2-MAJIN
                  attachment plate, an interface rather than part of the
                  complex. Loss of either SUN1 or
                  KASH5 causes meiotic arrest and infertility. The KASH5 tail is
                  divergent from canonical KASH domains but binds SUN in the
                  same way.
