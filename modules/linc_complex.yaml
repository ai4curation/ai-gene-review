                          label: Protein KASH5
                    function:
                      preferred_term: cytoskeletal motor activator activity
                      term:
                        id: GO:0140660
                        label: cytoskeletal motor activator activity
                      description: >-
                        Activates dynein-dynactin processivity (core function in
                        the KASH5 review). KASH5 also binds SUN1 through its
                        KASH-like tail (GO:0140444 in the review). Telomere
                        attachment itself depends on SUN1, not KASH5.
                      targets:
                        - preferred_term: dynein-dynactin (via DYNC1LI1/2)
                        - preferred_term: SUN1
                    processes:
                      - preferred_term: meiotic telomere clustering
                        term:
                          id: GO:0045141
                          label: meiotic telomere clustering
                    locations:
                      - preferred_term: nuclear outer membrane
                        term:
                          id: GO:0005640
                          label: nuclear outer membrane
                    evidence:
                      - source_id: PMID:22826121
                        title: "A conserved KASH domain protein associates with telomeres, SUN1, and dynactin during mammalian meiosis."
                        supporting_text: >-
                          KASH5 possesses hitherto unknown KASH-related sequences
                          that directly interacted with SUN1 and mediated telomere
                          localization.
                      - source_id: PMID:24062341
                        title: "A mammalian KASH domain protein coupling meiotic chromosomes to the cytoskeleton."
                        supporting_text: >-
                          These findings demonstrate that telomere attachment to
                          the NE is insufficient to promote pairing and that
                          telomere attachment sites must be coupled to
                          cytoplasmic dynein and the microtubule system to ensure
                          meiotic progression.
                      - source_id: PMID:35703493
                        title: "The KASH5 protein involved in meiotic chromosomal movements is a novel dynein activating adaptor."
                        supporting_text: >-
                          We show that the meiosis-specific nuclear-envelope
                          protein KASH5 is a dynein activating adaptor: KASH5
                          directly binds dynein using a mechanism conserved among
                          activating adaptors and converts dynein into a
                          processive motor.
                      - source_id: PMID:36946995
                        title: "The meiotic LINC complex component KASH5 is an activating adaptor for cytoplasmic dynein."
                        supporting_text: >-
                          KASH5 interacts with a dynein light intermediate chain
                          (DYNC1LI1 or DYNC1LI2) via a conserved helix in the LIC
                          C-terminal
                      - source_id: PMID:17543860
                        title: "SUN1 is required for telomere attachment to nuclear envelope and gametogenesis in mice."
                        statement: >-
                          SUN1 is the inner-nuclear-membrane partner that binds
                          meiotic telomeres.
                        supporting_text: >-
                          Disruption of Sun1 in mice prevents telomere attachment
                          to the nuclear envelope, efficient homolog pairing, and
                          synapsis formation in meiosis.
