                    label: Calcium/calmodulin-dependent protein kinase type II subunit delta
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The calcium sensor and activator; it binds Ca2+ through its EF hands and then
              binds and activates each CaMKII subunit. Not a substrate of the kinase.
            evidence:
              - source_id: PMID:35568036
                statement: Ca2+-bound calmodulin binds and activates CaMKII.
                supporting_text: >-
                  When bound to Ca2+, CaM adopts an open conformation facilitating its binding
                  to, and activation of, a large number of downstream targets including
                  calmodulin kinase II (CaMKII).
              - source_id: PMID:22717267
                statement: CaMKII is activated by Ca2+/CaM.
                supporting_text: >-
                  The Ca(2+)/Calmodulin(CaM)-dependent protein kinase II (CaMKII) is activated
                  by Ca(2+)/CaM
