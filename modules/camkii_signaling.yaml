evidence:
  - source_id: PW:0001185
    title: calcium/calmodulin dependent kinase 2 signaling pathway
    statement: >-
      The module boundary follows the RGD diagram for this Pathway Ontology term: Ca2+
      associated with Calm1, Calm2 and Calm3; calmodulin activating Camk2a, Camk2b, Camk2d and
      Camk2g; Camk2a and Camk2b associated with Grin2b; Camk2n1 and Camk2n2 and the "Camk2
      phosphatases" acting negatively on the kinase; Camk2a acting on Gria1 and Cacng2 towards
      long-term synaptic potentiation; and Camk2d acting on Cacna1c, Cacnb2, Ryr2, Scn5a, Hdac4
      and Hdac5 towards excitation-contraction and excitation-transcription coupling. Derived
      through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001185.yaml).
  - source_id: GO:0019722
    title: calcium-mediated signaling
    statement: >-
      The only current GO process for this pathway, recorded as a skos:broadMatch for
      PW:0001185 in the project's PW-GO mappings and kept out of matching. GO has no CaMKII
      signaling pathway term (see notes).
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001185 (28 RGD-curated human genes)
  through the RGD_PATHWAY_ONTOLOGY project, where it sits in the no_specific_go_term tier.

  GO term search. The go-basic release used for validation (2026-07-26) was searched for
  every term naming calmodulin-dependent kinase, CaMK or CaM kinase signalling. GO:0099004
  (calmodulin dependent kinase signaling pathway) is obsolete; its only "consider" target,
  GO:0061762 CAMKK-AMPK signaling cascade, is the CaMKK beta-AMPK route of
  modules/ampk_energy_sensing.yaml and is wrong for CaMKII, which CaMKK does not activate.
  No live process term is specific to CaMKII signalling. The live terms that are specific to
  it are a molecular function, GO:0004683 calcium/calmodulin-dependent protein kinase
  activity, which this module uses on the kinase annotons, and a cellular component,
  GO:0005954 calcium- and calmodulin-dependent protein kinase complex (synonym CaMKII),
  used as the concept of the holoenzyme node. The module process concept therefore stays at
  the broad GO:0019722 calcium-mediated signaling, as the project mapping does; a CaMKII
  signaling pathway term is requested in proposed_new_terms.

  Molecular functions come from experimental GOA rows checked in QuickGO: calmodulin
  GO:0043539 protein serine/threonine kinase activator activity (CALM1 IDA, a CALM1 review
  core function); CaMKII GO:0004683 (CAMK2A and CAMK2D IDA, CAMK2B IDA; CAMK2G has only a NAS
  row for the parent activity, so its annoton rests on paralogy and the shared holoenzyme);
  PP2A and PP1 gamma GO:0004722 protein serine/threonine phosphatase activity (PPP2CA IDA,
  PPP1CC IDA/IMP); PPM1F GO:0004722 (IDA); GRIN2B GO:0004972 NMDA glutamate receptor
  activity (IDA). CAMK2N1 and CAMK2N2 have no experimental human GOA rows; their
  GO:0008427 calcium-dependent protein kinase inhibitor activity is authored here from their
  IBA rows and the rat CaM-KIIN study (PMID:9724800), and is not backed by an experimental
  GOA row or a gene review.

  PPM1F carries an IDA row for GO:0033192 calmodulin-dependent protein phosphatase activity.
  That term means a phosphatase that itself requires calmodulin (calcineurin); PPM1F is a
  phosphatase of CaM kinases, a PP2C-family enzyme, so the row looks like a reading of its
  name "Ca2+/calmodulin-dependent protein kinase phosphatase" and is a possible upstream
  error. The module uses GO:0004722 for it instead.

  Calmodulin. CALM1, CALM2 and CALM3 encode an identical protein and are one family
  participant. Calmodulin is the activator, not a substrate: Ca2+-calmodulin binding
  displaces the autoinhibitory segment. The upstream calcium sources (NMDA receptor and
  voltage-gated calcium channel influx, IP3 receptor and ryanodine receptor release; see
  modules/gpcr_plc_calcium_pkc_signaling.yaml calcium_mobilization) are context, not parts.

  Kinase variants. The four CaMKII genes are a ONE_OR_MORE variant set along the axis of
  paralog and tissue: alpha and beta dominate in brain (and form heteromers), delta in heart,
  gamma is broadly expressed. Thr286/287 autophosphorylation (GO:1990443, a CAMK2A review
  core function) is placed on every paralog because the regulatory segment and its three
  phosphosites are invariant (PW:0001185 record text). Inhibitory Thr305/306 phosphorylation
  and its role in long-term depression, and ROS-driven methionine oxidation as a second
  autonomy route (reversed by methionine sulfoxide reductases), are recorded in prose only.

  Substrates are targets, not participants. The RGD substrates (GRIA1, CACNG2 for the
  neuronal paralogs; CACNA1C, CACNB2, RYR2, SCN5A, PLN, HDAC4 and HDAC5 for CaMKII delta) are
  listed as targets of the kinase function, following the substrate-versus-participant rule:
  the kinase performs the step, and the channels and transcriptional repressors are what it
  acts on. Their own activities (channel conduction, deacetylation, MEF2 repression), long-term
  potentiation, excitation-contraction coupling and excitation-transcription coupling are
  downstream outputs and outside the module. PLN is on the RGD human gene list though not
  drawn; it is included as a target because the record text names it as a CaMKII substrate.

  Anchoring. GRIN2B is the one anchoring partner modelled, because RGD draws it and its
  binding both targets the kinase to the synapse and generates autonomous activity
  (PMID:11459059). Its annoton keeps its experimental molecular function, NMDA glutamate
  receptor activity, because no experimental GOA row records the CaMKII-binding activity
  itself; the docking is described in the role description and the connection, not asserted
  as a GO function. GRIN1, the obligatory NMDA receptor partner, and GRIN2A are on the RGD
  human list but not drawn, and are mentioned here only. The other RGD "Camk2 partners"
  (LRRC7/densin-180, DLG1, SYNGAP1) are left out: the record text says their functional role
  is less well established, and SYNGAP1 is itself a CaMKII substrate.

  Regulation. CAMK2N1 and CAMK2N2 inhibit only the activated kinase (PMID:9724800); they are
  an optional regulatory part. Termination is by phosphatases that remove the Thr286
  phosphate: PSD PP1 (PMID:11502252; PPP1CC is the RGD gene), cytosolic PP2A (PMID:16516168),
  and the CaMK phosphatase PPM1F (PMID:11559703). PPM1E (CaMKP-N), also on the RGD list,
  acts mainly on nuclear CaMKI/CaMKIV and is mentioned only. Calcineurin acts only indirectly,
  through inhibitor-1 and PP1, and is not a member.

  GO-CAM grounding. The calmodulin activator and CAMK2A kinase annotons are linked to the
  human model gomodel:62b4ffe300004489, where CALM1 kinase activator activity directly
  positively regulates CAMK2A calcium/calmodulin-dependent protein kinase activity in an
  interferon-gamma context (the seed's best_gocam lead; the activities match even though the
  biological context differs). The GRIN2B annoton is linked to the NMDA receptor model
  gomodel:66c7d41500000672. No cached GO-CAM models CaMKII paralogs beta, gamma or delta,
  CaMKIIN, or CaMKII dephosphorylation. CAMK2B, CAMK2G, CAMK2D, CAMK2N1, CAMK2N2, GRIN2B,
  PPP1CC and PPM1F have no gene review yet; that is curation follow-up for the project plan.
proposed_new_terms:
- proposed_name: CaMKII signaling pathway
  proposed_definition: >-
    A calcium-mediated signaling pathway in which calcium-bound calmodulin binds and activates
    the calcium/calmodulin-dependent protein kinase II (CaMKII) holoenzyme, which
    autophosphorylates (Thr286 in CAMK2A) to become partly calcium-independent and
    phosphorylates downstream targets, ending with the regulation of a downstream cellular
    process.
  justification: >-
    No live GO process term is specific to CaMKII signalling. GO:0061762 CAMKK-AMPK signaling
    cascade is a different route, and the module concept stays at the broad GO:0019722
    calcium-mediated signaling.
  proposed_parent:
    id: GO:0019722
    label: calcium-mediated signaling
  supported_by:
  - reference_id: PMID:22717267
    supporting_text: The Ca(2+)/Calmodulin(CaM)-dependent protein kinase II (CaMKII) is activated by Ca(2+)/CaM
  - reference_id: PMID:22717267
    supporting_text: becomes partially autonomous (Ca(2+)-independent) upon autophosphorylation at T286
