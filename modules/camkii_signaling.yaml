id: MODULE:camkii_signaling
title: CaMKII signaling — calcium/calmodulin activation of the CaMKII holoenzyme, Thr286 autophosphorylation and autonomy, GluN2B docking, CaMKIIN inhibition, and phosphatase termination
description: >-
  Calcium/calmodulin-dependent protein kinase II (CaMKII) is a dodecameric serine/threonine
  kinase assembled from four paralogous subunits (CaMKII alpha, beta, gamma and delta) that
  converts transient rises in cytosolic calcium into sustained phosphorylation of target
  proteins. Calcium-bound calmodulin binds the regulatory segment of each subunit and
  displaces the autoinhibitory region from the kinase domain. Neighbouring subunits in the
  holoenzyme then phosphorylate one another on the regulatory threonine (Thr286 in alpha,
  Thr287 in the other paralogs), which prevents the autoinhibitory region from rebinding and
  gives Ca2+/calmodulin-independent (autonomous) activity that outlasts the calcium signal.
  In neurons the activated kinase translocates to the postsynaptic density, where binding to
  the GluN2B subunit of the NMDA receptor anchors it and itself sustains autonomous activity;
  there CaMKII phosphorylates AMPA receptor subunits and the auxiliary subunit stargazin
  during long-term potentiation. In cardiac myocytes CaMKII delta phosphorylates L-type
  calcium channel subunits, the ryanodine receptor RyR2, phospholamban and the sodium channel
  Nav1.5, and in the nucleus the class IIa histone deacetylase HDAC4. Activity is limited by
  the endogenous inhibitor proteins CaMKIIN alpha and beta, which bind only the activated
  kinase, and is terminated by protein phosphatases (PP1, PP2A and the CaMK phosphatase
  PPM1F) that dephosphorylate Thr286.
status: DRAFT
scope: CONCRETE
