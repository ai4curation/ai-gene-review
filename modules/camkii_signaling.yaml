            statement: Phosphorylated T287 releases a fully active, Ca2+/CaM-independent kinase domain.
            supporting_text: >-
              Once T287 has been phosphorylated, the kinase domain is released fully active and
              independent of Ca2+/CaM, and with its substrate binding site accessible.
