          - id: calmodulin_activator
            label: Calmodulin protein serine/threonine kinase activator activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: calmodulin (CALM1, CALM2, CALM3; identical protein)
                representative_members:
