          selector_type: FAMILY
          family:
            preferred_term: Toc33/Toc34 subfamilies
            family_terms:
            - id: PANTHER:PTHR10903:SF149
              label: TRANSLOCASE OF CHLOROPLAST 33, CHLOROPLASTIC
            - id: PANTHER:PTHR10903:SF172
              label: TRANSLOCASE OF CHLOROPLAST 34, CHLOROPLASTIC
            representative_members:
