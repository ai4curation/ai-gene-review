                id: UniProtKB:Q9SLF3
                label: Translocase of chloroplast 132, chloroplastic
            - preferred_term: TOC90 (Arabidopsis)
              term:
                id: UniProtKB:Q6S5G3
                label: Translocase of chloroplast 90, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000856052
              term:
                id: PANTHER:PTN000856052
                label: PTN000856052
              description: 'PANTHER PAINT ancestral node PTN000856052 in family PTHR10903, placed at taxon:3193;
                IBD seeds from Arabidopsis thaliana and Physcomitrium patens. IBD GO terms at this node:
                C:GO:0009707, P:GO:0045036, P:GO:0045037. PAINT rows dated 20180308-20250902. Arabidopsis
                TOC159 descends from it (its IBA rows in QuickGO cite PTN000856052).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000856052 in PANTHER family PTHR10903.
            - preferred_term: PAINT node PTN008956674
              term:
                id: PANTHER:PTN008956674
                label: PTN008956674
              description: 'PANTHER PAINT ancestral node PTN008956674 in family PTHR10903, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: F:GO:0003924.
                PAINT rows dated 20241211. Arabidopsis TOC159 descends from it (its IBA rows in QuickGO
                cite PTN008956674).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008956674 in PANTHER family PTHR10903.
            description: 'Three subfamilies of PTHR10903: SF120 (TOC159), SF135 (TOC132 and TOC120) and
              SF68 (TOC90). All three descend from PTN000856052, placed at Embryophyta with chloroplast
              outer membrane and protein import terms, so the selector is grounded for land plants. SF135
              also holds Physcomitrium TOC101, TOC108, TOC125 and TOC126 and the 397-residue Chlamydomonas
              TOC34 (A8HYJ1); outside land plants this step could therefore be met by a Toc34-type receptor,
              which is one reason the module is scoped to Embryophyta. Descent is shown by the protein''s
              IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this
              repository.'
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN008956674, as for the Toc34 receptor.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Outer-envelope GTPase receptor with an acidic N-terminal domain that recognises
          transit peptides; the paralogues divide client preproteins between photosynthetic and housekeeping
          import.
        evidence:
        - source_id: GO_REF:0000033
