id: MODULE:plastid_protein_import
title: Plastid protein import through the TOC-TIC translocons
description: Almost all plastid proteins are made in the cytosol with an N-terminal transit peptide and
  enter the organelle through two translocons in series. At the outer envelope, the GTPase receptors Toc34
  and Toc159 recognise the transit peptide and pass the preprotein to the Toc75 beta-barrel channel; at
  the inner envelope the TIC complex receives it, and a stromal ATP-driven motor, of which the Hsp100
  ClpC is the best characterized part, draws it into the stroma, where the transit peptide is removed.
  This module is the green-lineage core of that pathway, written so that it can be evaluated in a plant
  or algal genome.
status: DRAFT
scope: CONCRETE
notes: 'Viridiplantae scope, with Arabidopsis representatives; PAINT places the receptor node at Embryophyta
  (PTN000856052) and the Toc75 location node at Viridiplantae (PTN002292219). Read as a satisfiability
  rule, a genome needs a Toc34-type receptor, a Toc159-family receptor, a Toc75 channel and ClpC; Tic214
  is optional. Selectors are subfamilies, because each parent family (IMAP GTPases, Omp85, Clp ATPases)
  is far wider than plastid import. Every selector lists Arabidopsis members only, or nearly so, so other
  green lineages may fail for want of a selector rather than for want of the protein. Partial rule: Tic20,
  Tic110 and Tic40, and the transit-peptide-cleaving stromal processing peptidase, have no local PANTHER
  entry for the Arabidopsis protein and are not modelled; red algae, glaucophytes and plastids of secondary
  origin, which use related but differently organised import routes, are out of scope.'
module:
  id: plastid_protein_import
  label: Plastid protein import through the TOC-TIC translocons
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein targeting to chloroplast
    term:
      id: GO:0045036
      label: protein targeting to chloroplast
  - preferred_term: protein import into chloroplast stroma
    term:
      id: GO:0045037
      label: protein import into chloroplast stroma
  context:
    taxa:
    - preferred_term: Viridiplantae
      term:
        id: NCBITaxon:33090
        label: Viridiplantae
  parts:
  - order: 1
    role: preprotein recognition
    node:
      id: toc_receptors
      label: TOC GTPase receptors
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: toc34_receptor
        label: Toc34-type GTPase receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Toc33/Toc34 subfamilies
            family_terms:
            - id: PANTHER:PTHR10903:SF149
              label: TRANSLOCASE OF CHLOROPLAST 33, CHLOROPLASTIC
            - id: PANTHER:PTHR10903:SF172
              label: TRANSLOCASE OF CHLOROPLAST 34, CHLOROPLASTIC
            representative_members:
            - preferred_term: TOC33 (Arabidopsis)
              term:
                id: UniProtKB:O23680
                label: Translocase of chloroplast 33, chloroplastic
            - preferred_term: TOC34 (Arabidopsis)
              term:
                id: UniProtKB:Q38906
                label: Translocase of chloroplast 34, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN008956674
              term:
                id: PANTHER:PTN008956674
                label: PTN008956674
              description: 'PANTHER PAINT ancestral node PTN008956674 in family PTHR10903, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: F:GO:0003924.
                PAINT rows dated 20241211. Arabidopsis TOC33 descends from it (its IBA rows in QuickGO
                cite PTN008956674).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008956674 in PANTHER family PTHR10903.
            description: 'Two subfamilies of the IMAP GTPase family PTHR10903: SF149 (Arabidopsis TOC33)
              and SF172 (TOC34). The family as a whole is not used, because it also holds the immune-associated
              GTPases (human GIMAPs, Arabidopsis AIG1 proteins) that have nothing to do with plastids.
              Only Arabidopsis members of these subfamilies are listed locally, so other lineages'' Toc34
              orthologues may need their own selectors. Descent is shown by the protein''s IBA rows in
              QuickGO, which cite the node; no Arabidopsis gene review exists for it in this repository.'
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN008956674, the Eukaryota-level node of the IMAP/AIG1 GTPase family;
            the node carries no import-specific term.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Outer-envelope GTPase receptor that binds the transit peptide of an incoming
          preprotein and, with the Toc159 receptor, hands it to the Toc75 channel.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN008956674 in PTHR10903; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR10903/PTHR10903-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: toc159_receptor
        label: Toc159-family GTPase receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Toc159-family subfamilies
            family_terms:
            - id: PANTHER:PTHR10903:SF120
              label: TRANSLOCASE OF CHLOROPLAST 159, CHLOROPLASTIC
            - id: PANTHER:PTHR10903:SF135
              label: TRANSLOCASE OF CHLOROPLAST 120, CHLOROPLASTIC-RELATED
            - id: PANTHER:PTHR10903:SF68
              label: TRANSLOCASE OF CHLOROPLAST 90, CHLOROPLASTIC
            representative_members:
            - preferred_term: TOC159 (Arabidopsis)
              term:
                id: UniProtKB:O81283
                label: Translocase of chloroplast 159, chloroplastic
            - preferred_term: TOC132 (Arabidopsis)
              term:
                id: UniProtKB:Q9SLF3
                label: Translocase of chloroplast 132, chloroplastic
            - preferred_term: TOC90 (Arabidopsis)
              term:
                id: UniProtKB:Q6S5G3
                label: Translocase of chloroplast 90, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000856052
              term:
                id: PANTHER:PTN000856052
                label: PTN000856052
              description: 'PANTHER PAINT ancestral node PTN000856052 in family PTHR10903, placed at taxon:3193;
                IBD seeds from Arabidopsis thaliana and Physcomitrium patens. IBD GO terms at this node:
                C:GO:0009707, P:GO:0045036, P:GO:0045037. PAINT rows dated 20180308-20250902. Arabidopsis
                TOC159 descends from it (its IBA rows in QuickGO cite PTN000856052).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000856052 in PANTHER family PTHR10903.
            - preferred_term: PAINT node PTN008956674
              term:
                id: PANTHER:PTN008956674
                label: PTN008956674
              description: 'PANTHER PAINT ancestral node PTN008956674 in family PTHR10903, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: F:GO:0003924.
                PAINT rows dated 20241211. Arabidopsis TOC159 descends from it (its IBA rows in QuickGO
                cite PTN008956674).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008956674 in PANTHER family PTHR10903.
            description: 'Three subfamilies of PTHR10903: SF120 (TOC159), SF135 (TOC132 and TOC120) and
              SF68 (TOC90). All three descend from PTN000856052, placed at Embryophyta with chloroplast
              outer membrane and protein import terms, so the selector is grounded for land plants; whether
              green-algal Toc159 proteins fall in these subfamilies has not been checked. Descent is shown
              by the protein''s IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists
              for it in this repository.'
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN008956674, as for the Toc34 receptor.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Outer-envelope GTPase receptor with an acidic N-terminal domain that recognises
          transit peptides; the paralogues divide client preproteins between photosynthetic and housekeeping
          import.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN008956674 in PTHR10903; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR10903/PTHR10903-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 2
    role: outer envelope translocation
    node:
      id: toc_channel
      label: Toc75 channel
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: toc75_channel
        label: Toc75 outer-envelope beta-barrel channel
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Toc75 subfamily
            term:
              id: PANTHER:PTHR12815:SF42
              label: BACTERIAL SURFACE ANTIGEN (D15) DOMAIN-CONTAINING PROTEIN
            representative_members:
            - preferred_term: TOC75-3 (Arabidopsis)
              term:
                id: UniProtKB:Q9STE8
                label: Protein TOC75-3, chloroplastic
            - preferred_term: TOC75-4 (Arabidopsis)
              term:
                id: UniProtKB:Q5IZC8
                label: Protein TOC75-4, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000981426
              term:
                id: PANTHER:PTN000981426
                label: PTN000981426
              description: 'PANTHER PAINT ancestral node PTN000981426 in family PTHR12815, placed at taxon:3193;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: P:GO:0009658, P:GO:0045037.
                PAINT rows dated 20190302. Arabidopsis TOC75-3 descends from it (its IBA rows in QuickGO
                cite PTN000981426).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000981426 in PANTHER family PTHR12815.
            - preferred_term: PAINT node PTN002292219
              term:
                id: PANTHER:PTN002292219
                label: PTN002292219
              description: 'PANTHER PAINT ancestral node PTN002292219 in family PTHR12815, placed at taxon:33090;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: C:GO:0009707. PAINT rows
                dated 20230110. Arabidopsis TOC75-3 descends from it (its IBA rows in QuickGO cite PTN002292219).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN002292219 in PANTHER family PTHR12815.
            description: Subfamily SF42 of the Omp85/SAM50 family PTHR12815, which holds Arabidopsis TOC75-3
              and TOC75-4. The rest of the family (mitochondrial SAM50, the plastid OEP80 paralogue Q9C5J8
              in SF32) is excluded. PTN002292219 places chloroplast outer membrane at Viridiplantae and
              PTN000981426 places protein import into chloroplast stroma at Embryophyta. Neither node
              carries an F IBD, so the step is left untyped rather than given a channel activity from
              memory. Descent is shown by the protein's IBA rows in QuickGO, which cite the node; no Arabidopsis
              gene review exists for it in this repository.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Omp85-type beta-barrel in the outer envelope that forms the protein-conducting
          channel of the TOC complex.
        evidence:
        - source_id: file:interpro/panther/PTHR12815/PTHR12815-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 3
    role: inner envelope translocation
    optional: true
    node:
      id: tic_channel
      label: Tic214 inner-envelope subunit
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: tic214_channel
        label: Tic214 inner-envelope translocon subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Tic214 subfamily
            term:
              id: PANTHER:PTHR33163:SF40
              label: PROTEIN TIC 214
            representative_members:
            - preferred_term: TIC214 (Arabidopsis)
              term:
                id: UniProtKB:P56785
                label: Protein TIC 214
            ancestral_nodes:
            - preferred_term: PAINT node PTN009141308
              term:
                id: PANTHER:PTN009141308
                label: PTN009141308
              description: 'PANTHER PAINT ancestral node PTN009141308 in family PTHR33163, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana. IBD GO terms at this node:
                C:GO:0009706, F:GO:0008320, P:GO:0045037. PAINT rows dated 20251024. Arabidopsis TIC214
                descends from it (its IBA rows in QuickGO cite PTN009141308; it is one of the node''s
                IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN009141308 in PANTHER family PTHR33163.
            description: Subfamily SF40 of PTHR33163. Members listed locally come from dicots, Acorus,
              ferns, Physcomitrium and Marchantia; no grass member is listed, which fits the loss of ycf1
              from grass plastomes. Arabidopsis TIC214 is one of the node's IBD seeds.
        function:
          preferred_term: protein transmembrane transporter activity
          term:
            id: GO:0008320
            label: protein transmembrane transporter activity
        locations:
        - preferred_term: plastid inner membrane
          term:
            id: GO:0009528
            label: plastid inner membrane
        role_description: Plastome-encoded (ycf1) large inner-envelope membrane protein, part of the 1-MDa
          TIC complex.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0008320 at PTN009141308 in PTHR33163; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR33163/PTHR33163-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      description: Optional because Tic214 (ycf1) is absent from grass plastomes and its function in import
        is debated, so a genome lacking it is not evidence against a working import pathway.
  - order: 4
    role: stromal import motor
    node:
      id: stromal_motor
      label: ClpC stromal motor
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: clpc_motor
        label: ClpC stromal import motor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: ClpC subfamily
            term:
              id: PANTHER:PTHR11638:SF155
              label: CHAPERONE PROTEIN CLPC1, CHLOROPLASTIC-LIKE
            representative_members:
            - preferred_term: CLPC1 (Arabidopsis)
              term:
                id: UniProtKB:Q9FI56
                label: Chaperone protein ClpC1, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN002461480
              term:
                id: PANTHER:PTN002461480
                label: PTN002461480
              description: 'PANTHER PAINT ancestral node PTN002461480 in family PTHR11638, given no taxon
                in the source PAINT rows; IBD seeds from Mycobacterium tuberculosis. IBD GO terms at this
                node: F:GO:0044183. PAINT rows dated 20250313. Arabidopsis CLPC1 descends from it (its
                IBA rows in QuickGO cite PTN002461480).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN002461480 in PANTHER family PTHR11638.
            - preferred_term: PAINT node PTN008682785
              term:
                id: PANTHER:PTN008682785
                label: PTN008682785
              description: 'PANTHER PAINT ancestral node PTN008682785 in family PTHR11638, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana. IBD GO terms at this node:
                C:GO:0009941, P:GO:0045037. PAINT rows dated 20250313. Arabidopsis CLPC1 descends from
                it (its IBA rows in QuickGO cite PTN008682785).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008682785 in PANTHER family PTHR11638.
            description: 'Subfamily SF155 of the Clp ATPase family PTHR11638 (plant and red-algal ClpC).
              The family is not used: it also holds bacterial ClpA/ClpB and mitochondrial and cytosolic
              Hsp104/ClpB proteins of yeasts, trypanosomes and human. Descent is shown by the protein''s
              IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this
              repository.'
        function:
          preferred_term: protein folding chaperone
          term:
            id: GO:0044183
            label: protein folding chaperone
          description: The F IBD at PTN002461480. It names chaperone activity, not an import-motor activity;
            the import role is carried by the P IBD at PTN008682785 (protein import into chloroplast stroma).
        locations:
        - preferred_term: plastid stroma
          term:
            id: GO:0009532
            label: plastid stroma
        role_description: Stromal Hsp100 AAA+ ATPase that associates with the TIC complex and pulls preproteins
          into the stroma.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0044183 at PTN002461480 in PTHR11638; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR11638/PTHR11638-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  connections:
  - source: toc_receptors
    target: toc_channel
    connection_type: PROVIDES_INPUT_FOR
    description: Receptor-bound preprotein is inserted into the Toc75 channel.
  - source: toc_channel
    target: tic_channel
    connection_type: PROVIDES_INPUT_FOR
    description: The preprotein crosses the intermembrane space to the TIC complex.
  - source: toc_channel
    target: stromal_motor
    connection_type: PROVIDES_INPUT_FOR
    description: ClpC draws the preprotein through the TIC complex into the stroma.
