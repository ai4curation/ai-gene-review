id: MODULE:plastid_protein_import
title: Plastid protein import through the TOC-TIC translocons
description: Almost all plastid proteins are made in the cytosol with an N-terminal transit peptide and
  enter the organelle through two translocons in series. At the outer envelope, the GTPase receptors Toc34
  and Toc159 recognise the transit peptide and pass the preprotein to the Toc75 beta-barrel channel; at
  the inner envelope the TIC complex receives it, and a stromal ATP-driven motor, of which the Hsp100
  ClpC is the best characterized part, draws it into the stroma, where the transit peptide is removed.
  This module is the land-plant core of that pathway, written so that it can be evaluated in a plant genome.
status: DRAFT
scope: CONCRETE
notes: 'Embryophyta scope, with Arabidopsis representatives. The process-level PAINT nodes, for the Toc159-family
  receptors (PTN000856052) and Toc75 (PTN000981426), are placed at Embryophyta; only the Toc75 location
  node (PTN002292219) is at Viridiplantae. Green algae are excluded because Chlamydomonas TOC34 (A8HYJ1)
  falls in the Toc159-family subfamily SF135, so the two receptor steps would assign it wrongly. Read
  as a satisfiability rule, a genome needs a Toc34-type receptor, a Toc159-family receptor, a Toc75 channel,
  the Tic20 and Tic110 inner-envelope subunits, ClpC and the stromal processing peptidase; Tic214 and
  Tic40 are optional. Selectors are subfamilies, because each parent family (IMAP GTPases, Omp85, Clp
  ATPases) is far wider than plastid import. The Toc75, ClpC and Tic214 selectors list members from several
  land plants (pea, rice, tomato and others); the Tic20, Tic110 and Tic40 selectors list Arabidopsis and
  pea only, and the stromal processing peptidase selector Arabidopsis, pea and rice. The receptor family
  PTHR10903 lists far fewer: its only land-plant members locally are Arabidopsis, pea TOC34 and four Physcomitrium
  Toc159-family proteins. The required Toc34 step (SF149, SF172) is therefore met only by Arabidopsis
  and pea, and Physcomitrium and rice fail the module at that step for want of a selector rather than
  for want of the protein; TOC159 (SF120) and TOC90 (SF68) are listed for Arabidopsis only, but the Toc159-family
  step is met by SF135 in Physcomitrium. Taken together, Arabidopsis is the only genome in the local data
  that meets every required step: pea fails the Toc159-family step; rice fails both receptor steps, Tic20
  and Tic110; and Physcomitrium fails Toc34, Tic20, Tic110 and the stromal processing peptidase. Not modelled:
  the stromal Hsp70 and Hsp90C motor partners, Tic56, Tic100 and the other subunits of the 1-MDa TIC complex,
  and the inner-envelope Tic21 and Tic62 proteins; red algae, glaucophytes and plastids of secondary origin,
  which use related but differently organised import routes, are out of scope.'
module:
  id: plastid_protein_import
  label: Plastid protein import through the TOC-TIC translocons
  module_type: BIOLOGICAL_PROCESS
  concepts:
