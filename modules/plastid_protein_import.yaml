id: MODULE:plastid_protein_import
title: Plastid protein import through the TOC-TIC translocons
description: Almost all plastid proteins are made in the cytosol with an N-terminal transit peptide and
  enter the organelle through two translocons in series. At the outer envelope, the GTPase receptors Toc34
  and Toc159 recognise the transit peptide and pass the preprotein to the Toc75 beta-barrel channel; at
  the inner envelope the TIC complex receives it, and a stromal ATP-driven motor, of which the Hsp100
  ClpC is the best characterized part, draws it into the stroma, where the transit peptide is removed.
  This module is the land-plant core of that pathway, written so that it can be evaluated in a plant genome.
status: DRAFT
scope: CONCRETE
notes: 'Embryophyta scope, with Arabidopsis representatives. The process-level PAINT nodes, for the Toc159-family
  receptors (PTN000856052) and Toc75 (PTN000981426), are placed at Embryophyta; only the Toc75 location
  node (PTN002292219) is at Viridiplantae. Green algae are excluded because Chlamydomonas TOC34 (A8HYJ1)
  falls in the Toc159-family subfamily SF135, so the two receptor steps would assign it wrongly. Read
  as a satisfiability rule, a genome needs a Toc34-type receptor, a Toc159-family receptor, a Toc75 channel,
  the Tic236 linker, the Tic20 and Tic110 inner-envelope subunits, the ClpC and cpHsc70 stromal motor
  and the stromal processing peptidase. Optional: the other 1-MDa TIC subunits (Tic214, Tic56, Tic100),
  Tic40, Hsp90C, FtsHi, and the Tic21, Tic22, Tic62, Tic32 and Tic55 proteins. Three selectors rest on
  PANTHER''s own classification files rather than the local entries table (cpHsc70, Hsp90C, FtsHi), and
  two disagree with them (Tic100, Tic32), as does the existing ClpC selector. Selectors are subfamilies,
  because each parent family (IMAP GTPases, Omp85, Clp ATPases) is far wider than plastid import. The
  Toc75, ClpC and Tic214 selectors list members from several land plants (pea, rice, tomato and others);
  the Tic20, Tic110 and Tic40 selectors list Arabidopsis and pea only, and the stromal processing peptidase
  selector Arabidopsis, pea and rice. The receptor family PTHR10903 lists far fewer: its only land-plant
  members locally are Arabidopsis, pea TOC34 and four Physcomitrium Toc159-family proteins. The required
  Toc34 step (SF149, SF172) is therefore met only by Arabidopsis and pea, and Physcomitrium and rice fail
  the module at that step for want of a selector rather than for want of the protein; TOC159 (SF120) and
  TOC90 (SF68) are listed for Arabidopsis only, but the Toc159-family step is met by SF135 in Physcomitrium.
  Computed from the local entries tables over the required steps other than cpHsc70 (whose family table
  is capped, so it cannot be checked this way), Arabidopsis is the only genome that meets every one: pea
  fails the Toc159-family and Tic236 steps; rice fails both receptor steps, Tic20 and Tic110; Physcomitrium
  fails every step except the Toc159-family one, since its only local entries in these families are its
  four SF135 receptors; and tomato, listed only for ClpC, fails the rest. Not modelled: Ycf2, the plastome-encoded
  partner of FtsHi, and the remaining FtsHi paralogues; red algae, glaucophytes and plastids of secondary
  origin, which use related but differently organised import routes, are out of scope.'
module:
  id: plastid_protein_import
  label: Plastid protein import through the TOC-TIC translocons
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein targeting to chloroplast
    term:
      id: GO:0045036
      label: protein targeting to chloroplast
  - preferred_term: protein import into chloroplast stroma
    term:
      id: GO:0045037
      label: protein import into chloroplast stroma
  context:
    taxa:
    - preferred_term: land plants
      term:
        id: NCBITaxon:3193
        label: Embryophyta
  parts:
  - order: 1
    role: preprotein recognition
    node:
      id: toc_receptors
      label: TOC GTPase receptors
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: toc34_receptor
        label: Toc34-type GTPase receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Toc33/Toc34 subfamilies
            family_terms:
            - id: PANTHER:PTHR10903:SF149
              label: TRANSLOCASE OF CHLOROPLAST 33, CHLOROPLASTIC
            - id: PANTHER:PTHR10903:SF172
              label: TRANSLOCASE OF CHLOROPLAST 34, CHLOROPLASTIC
            representative_members:
            - preferred_term: TOC33 (Arabidopsis)
              term:
                id: UniProtKB:O23680
                label: Translocase of chloroplast 33, chloroplastic
            - preferred_term: TOC34 (Arabidopsis)
              term:
                id: UniProtKB:Q38906
                label: Translocase of chloroplast 34, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN008956674
              term:
                id: PANTHER:PTN008956674
                label: PTN008956674
              description: 'PANTHER PAINT ancestral node PTN008956674 in family PTHR10903, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: F:GO:0003924.
                PAINT rows dated 20241211. Arabidopsis TOC33 descends from it (its IBA rows in QuickGO
                cite PTN008956674).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008956674 in PANTHER family PTHR10903.
            description: 'Two subfamilies of the IMAP GTPase family PTHR10903: SF149 (Arabidopsis TOC33)
              and SF172 (TOC34). The family as a whole is not used, because it also holds the immune-associated
              GTPases (human GIMAPs, Arabidopsis AIG1 proteins) that have nothing to do with plastids.
              Members listed locally are Arabidopsis TOC33 and pea TOC34 (Q41009, SF149) and Arabidopsis
              TOC34 (SF172). Chlamydomonas TOC34 (A8HYJ1) is placed instead in SF135 with the Toc159-family
              receptors, so this step misses chlorophyte Toc34 and the module is scoped to land plants.
              Descent is shown by the protein''s IBA rows in QuickGO, which cite the node; no Arabidopsis
              gene review exists for it in this repository.'
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN008956674, the Eukaryota-level node of the IMAP/AIG1 GTPase family;
            the node carries no import-specific term.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Outer-envelope GTPase receptor that binds the transit peptide of an incoming
          preprotein and, with the Toc159 receptor, hands it to the Toc75 channel.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN008956674 in PTHR10903; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR10903/PTHR10903-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: toc159_receptor
        label: Toc159-family GTPase receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Toc159-family subfamilies
            family_terms:
            - id: PANTHER:PTHR10903:SF120
              label: TRANSLOCASE OF CHLOROPLAST 159, CHLOROPLASTIC
            - id: PANTHER:PTHR10903:SF135
              label: TRANSLOCASE OF CHLOROPLAST 120, CHLOROPLASTIC-RELATED
            - id: PANTHER:PTHR10903:SF68
              label: TRANSLOCASE OF CHLOROPLAST 90, CHLOROPLASTIC
            representative_members:
            - preferred_term: TOC159 (Arabidopsis)
              term:
                id: UniProtKB:O81283
                label: Translocase of chloroplast 159, chloroplastic
            - preferred_term: TOC132 (Arabidopsis)
              term:
                id: UniProtKB:Q9SLF3
                label: Translocase of chloroplast 132, chloroplastic
            - preferred_term: TOC90 (Arabidopsis)
              term:
                id: UniProtKB:Q6S5G3
                label: Translocase of chloroplast 90, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000856052
              term:
                id: PANTHER:PTN000856052
                label: PTN000856052
              description: 'PANTHER PAINT ancestral node PTN000856052 in family PTHR10903, placed at taxon:3193;
                IBD seeds from Arabidopsis thaliana and Physcomitrium patens. IBD GO terms at this node:
                C:GO:0009707, P:GO:0045036, P:GO:0045037. PAINT rows dated 20180308-20250902. Arabidopsis
                TOC159 descends from it (its IBA rows in QuickGO cite PTN000856052).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000856052 in PANTHER family PTHR10903.
            - preferred_term: PAINT node PTN008956674
              term:
                id: PANTHER:PTN008956674
                label: PTN008956674
              description: 'PANTHER PAINT ancestral node PTN008956674 in family PTHR10903, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: F:GO:0003924.
                PAINT rows dated 20241211. Arabidopsis TOC159 descends from it (its IBA rows in QuickGO
                cite PTN008956674).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008956674 in PANTHER family PTHR10903.
            description: 'Three subfamilies of PTHR10903: SF120 (TOC159), SF135 (TOC132 and TOC120) and
              SF68 (TOC90). All three descend from PTN000856052, placed at Embryophyta with chloroplast
              outer membrane and protein import terms, so the selector is grounded for land plants. SF135
              also holds Physcomitrium TOC101, TOC108, TOC125 and TOC126 and the 397-residue Chlamydomonas
              TOC34 (A8HYJ1); outside land plants this step could therefore be met by a Toc34-type receptor,
              which is one reason the module is scoped to Embryophyta. Descent is shown by the protein''s
              IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this
              repository.'
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN008956674, as for the Toc34 receptor.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Outer-envelope GTPase receptor with an acidic N-terminal domain that recognises
          transit peptides; the paralogues divide client preproteins between photosynthetic and housekeeping
          import.
        evidence:
        - source_id: GO_REF:0000033
