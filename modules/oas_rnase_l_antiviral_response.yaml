id: MODULE:oas_rnase_l_antiviral_response
title: OAS/RNase L antiviral response
description: >-
  In the interferon-induced OAS/RNase L antiviral response, OAS1, OAS2 and OAS3
  detect cytosolic or replication-organelle double-stranded RNA and synthesize
  2'-5'-linked oligoadenylates from ATP. 2-5A molecules bind latent RNase L,
  promoting RNase L activation and downstream cleavage of viral and cellular
  RNA to limit viral replication. Human OASL is an OAS-like paralog in the same
  family that retained dsRNA binding but lost 2-5A synthesis, so it enhances
  RIG-I signaling instead of participating in this 2-5A-to-RNase-L module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: Reactome:R-HSA-8983680
  title: OAS1 produces oligoadenylates
  statement: Human Reactome represents OAS1 binding viral dsRNA and producing 2-5A in the cytosol.
  supporting_text: OAS1 catalyzes the polymerization of ATP
- source_id: Reactome:R-HSA-8985104
  title: OAS2 produces oligoadenylates
  statement: Human Reactome represents OAS2 producing 2-5A after dsRNA activation.
  supporting_text: OAS2 polymerizes ATP into 5'-triphosphorylated
- source_id: Reactome:R-HSA-8985091
  title: OAS3 produces oligoadenylates
  statement: Human Reactome represents OAS3 producing 2-5A from ATP after viral dsRNA detection.
  supporting_text: OAS3 is a template-independent nucleotidyl transferase
- source_id: PMID:25275129
  title: The 2'-5'-oligoadenylate synthetase 3 enzyme potently synthesizes the 2'-5'-oligoadenylates required for RNase L activation.
  statement: OAS3 makes 2-5A species long enough to activate RNase L and can activate RNase L intracellularly.
  supporting_text: OAS3 synthesizes considerably longer 2-5As than previously reported, and that OAS3 can activate RNase L intracellularly
