      title: dolichyl monophosphate biosynthetic process (GO:0043048)
      description: >-
        PomBase S. pombe model with the cis-prenyltransferase subunits rer2
        and nus1 (upstream of this module), dfg10 (GO:0160198) and sec59
        (GO:0004168) at the ER membrane. It lacks the polyprenol
        dehydrogenase / dolichal reductase steps.
    - model: gomodel:671ae02600003596
      title: dolichol phosphate mannose biosynthetic process (GO:0180047)
      description: >-
        PomBase S. pombe three-subunit Dol-P-Man synthase: dpm1
        (GO:0004582), dpm2 (GO:0008047, positively regulates dpm1) and dpm3
