        (GO:0008928) and DPM1 (GO:0004582), all in cytosol and part of
        GO:0006013 mannose metabolic process. Disagreements: DPM1 is an
        ER-membrane protein, and PSA1 is the GTP-dependent enzyme
        (GO:0004475) rather than the GDP/phosphate-dependent one.
    - model: gomodel:YeastPathways_PWY3O-1565
      title: 'dolichyl glucosyl phosphate biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
