  notes: >-
    ALIGN (YeastPathways project, 2026-10). Scope widened to the crosswalk
    boundary "GDP-mannose, Dol-P-Man and Dol-P-Glc supply": the cytosolic
    GDP-mannose (PMI40/SEC53/PSA1) and UDP-glucose (PGM1/PGM2/UGP1) branches
    from YeastCyc PWY3O-123 and PWY3O-1565 were added as sub-pathways, the
    module was made eukaryote-wide, and S. cerevisiae and S. pombe exemplars
    were added to every role. The former one-step "polyprenol to dolichol"
    SRD5A3 node was replaced by the three-step detour (DHRSX/TDA5 polyprenol
    dehydrogenase, SRD5A3/DFG10 polyprenal reductase, DHRSX/TDA5 dolichal
    reductase; PMID:38821050, PMID:42201967), which also matches the
    GO:0160198 polyprenal reductase term already used. DHRSX and TDA5 fall in
    different PANTHER families, so that role carries no family id. The
    cis-prenyltransferase (RER2/SRT1 + NUS1; rer2/nus1) and the
    polyprenyl-diphosphate dephosphorylation that produce polyprenol are
    upstream and outside this module, although the PomBase model includes
    rer2 and nus1. Dol-P-Man synthase is now an EXACTLY_ONE variant set:
    single-subunit, C-terminally anchored DPM1 (S. cerevisiae) versus the
    three-subunit DPM1/DPM2/DPM3 complex (human, S. pombe), following
    PMID:9223280 and PMID:10835346. Both catalytic forms share PANTHER
    PTHR43398:SF1, so the anchored class is represented by a concrete gene
    product. MPDU1 is marked optional because neither yeast has a PTHR12226
    member. YeastCyc corrections: the PSA1 reaction should be the
    GTP-dependent EC 2.7.7.13 (GO:0004475), not the GDP/phosphate EC
    2.7.7.22 reaction the SGD GO-CAM encodes (GO:0008928); YHL012W is
    listed beside UGP1 but is uncharacterised. GO-CAM disagreements: both
    YeastPathways models place the ER-membrane enzymes DPM1 and ALG5 in
    cytosol and use broad processes (GO:0006013 mannose metabolic process,
    GO:0016051 carbohydrate biosynthetic process). The cytosolic phosphoglucomutase
    and UDP-glucose pyrophosphorylase steps are shared with glycogen,
    trehalose and galactose metabolism; they are included because they are
    the dedicated route to the Dol-P-Glc donor in the source pathway. This
    module supplies the Dol-P carrier used by ALG7/DPAGT1 in
    n_glycan_llo_assembly_cytoplasmic, GDP-mannose for ALG1/ALG2/ALG11 there,
    and the Dol-P-Man/Dol-P-Glc donors used in n_glycan_llo_assembly_lumenal,
    GPI-anchor synthesis and O-mannosylation. Disorders: PMM2-CDG, MPI-CDG,
    GMPPB dystroglycanopathy, SRD5A3-, DHRSX-, DOLK-, DPM1-, DPM2-, DPM3-,
    MPDU1- and ALG5-CDG.
  knowledge_gaps:
    - gap_statement: >-
        S. cerevisiae cells lacking both TDA5 and DFG10 still make some
        dolichol, so the enzyme(s) of the bypass route from polyprenol to
        dolichol are unknown; ENV9 is a candidate.
      boundary: Only the DHRSX/TDA5-SRD5A3/DFG10 detour is modelled.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        No DHRSX/TDA5-type polyprenol dehydrogenase has been functionally
        identified in Schizosaccharomyces pombe.
      boundary: The polyprenol dehydrogenase and dolichal reductase roles have no S. pombe exemplar.
      gap_kind:
        - BIOLOGY
