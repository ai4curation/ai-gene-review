id: MODULE:dolichol_phosphate_sugar_donor_supply
title: Dolichol phosphate and lipid-linked sugar-donor supply for glycosylation
description: >-
  Assembly of the dolichol-linked oligosaccharide (and of GPI anchors and
  protein O- and C-mannosylation) depends on a dolichyl-phosphate (Dol-P)
  lipid carrier, on the cytosolic nucleotide sugars GDP-mannose and
  UDP-glucose, and on two lipid-linked monosaccharide donors made from them,
  dolichyl-phosphate-mannose (Dol-P-Man) and dolichyl-phosphate-glucose
  (Dol-P-Glc). GDP-mannose is made in the cytosol from fructose 6-phosphate
  by mannose-6-phosphate isomerase, phosphomannomutase and GDP-mannose
  pyrophosphorylase; UDP-glucose is made from glucose 6-phosphate by
  phosphoglucomutase and UDP-glucose pyrophosphorylase. Dol-P is made at the
  endoplasmic-reticulum membrane by a three-step detour from polyprenol: an
  SDR-family polyprenol dehydrogenase oxidises polyprenol to polyprenal, the
  steroid-5-alpha-reductase-like polyprenal reductase saturates the
  alpha-isoprene unit to give dolichal, and the same SDR enzyme reduces
  dolichal to dolichol, which dolichol kinase phosphorylates with CTP. Dol-P
  is then charged with mannose from GDP-mannose by Dol-P-Man synthase and
  with glucose from UDP-glucose by Dol-P-Glc synthase (ALG5). Dol-P-Man
  synthase exists in two architectures: a single-subunit enzyme with its own
  C-terminal membrane anchor (budding yeast, Ustilago, trypanosomes) and a
  soluble catalytic subunit held at the membrane by two small accessory
  subunits (animals, fission yeast). In mammals a utilisation factor
  (MPDU1/Lec35) is additionally required for lumenal use of both
  lipid-linked donors.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-123
    title: dolichyl phosphate D-mannose biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-123
    statement: >-
      YeastCyc lists MANNPISOM-RXN (PMI40), PHOSMANMUT-RXN (SEC53),
      MANNPGUANYLTRANGDP-RXN (PSA1) and 2.4.1.83-RXN (DPM1). The gene
      assignments were retained, but the PSA1 reaction is drawn with GDP and
      phosphate (EC 2.7.7.22); PSA1 is the GTP-dependent mannose-1-phosphate
      guanylyltransferase (EC 2.7.7.13), modelled here with GO:0004475.
  - source_id: YeastPathways:PWY3O-1565
    title: dolichyl glucosyl phosphate biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1565
    statement: >-
      YeastCyc lists PHOSPHOGLUCMUT-RXN (PGM1, PGM2), GLUC1PURIDYLTRANS-RXN
      (UGP1 and the uncharacterised paralog YHL012W) and 2.4.1.117-RXN (ALG5).
      PGM1, PGM2, UGP1 and ALG5 were retained; YHL012W was not used as an
      exemplar because UGP1 is the essential, characterised enzyme.
  - source_id: GO:0006488
    title: dolichol-linked oligosaccharide biosynthetic process
    statement: >-
      The module supplies the dolichyl-phosphate carrier and the Dol-P-Man/Dol-P-Glc donors
      consumed by dolichol-linked oligosaccharide biosynthesis (GO:0006488).
  - source_id: GO:0043048
    title: dolichyl monophosphate biosynthetic process
    statement: Polyprenol dehydrogenase, polyprenal reductase and dolichol kinase produce the Dol-P carrier.
  - source_id: GO:0009298
    title: GDP-mannose biosynthetic process
    statement: Mannose-6-phosphate isomerase, phosphomannomutase and GDP-mannose pyrophosphorylase.
  - source_id: GO:0180047
    title: dolichol phosphate mannose biosynthetic process
    statement: Dol-P-Man synthase (single-subunit or three-subunit).
  - source_id: PMID:9878760
    title: The dolichol pathway of N-linked glycosylation.
    statement: Review of dolichol as lipid carrier and of the biosynthesis of the sugar donors for LLO assembly.
  - source_id: PMID:23751184
    title: N-linked protein glycosylation in the endoplasmic reticulum.
    statement: Review of ER N-glycosylation centred on S. cerevisiae, including the Dol-P-Man and Dol-P-Glc donors.
  - source_id: PMID:1377774
    title: PMI40, an intron-containing gene required for early steps in yeast mannosylation.
    statement: >-
      A thermolabile pmi40 mutant cannot make GDP-mannose or Dol-P-Man; the
      deletion requires mannose for growth.
    supporting_text: Inactivation of PMI at the restrictive temperature of 37 degrees C prevents synthesis of the GDP-mannose and dolichol-phosphate-mannose required for a number of critical mannosyl transfer reactions and results in cell death.
  - source_id: PMID:3288631
    title: The yeast SEC53 gene encodes phosphomannomutase.
    statement: SEC53 encodes the yeast phosphomannomutase needed for ER glycosylation.
  - source_id: PMID:12667607
    title: Overexpression of GDP-mannose pyrophosphorylase in Saccharomyces cerevisiae corrects defects in dolichol-linked saccharide formation and protein glycosylation.
    statement: >-
      MPG1/PSA1 encodes GDP-mannose pyrophosphorylase; raising GDP-mannose
      suppresses dpm1, alg1 and alg2 glycosylation defects.
  - source_id: PMID:7588797
    title: Genetic and biochemical characterization of the UGP1 gene encoding the UDP-glucose pyrophosphorylase from Saccharomyces cerevisiae.
    statement: UGP1 encodes the essential yeast UDP-glucose pyrophosphorylase.
  - source_id: PMID:9252577
    title: Physiological and morphological effects of genetic alterations leading to a reduced synthesis of UDP-glucose in Saccharomyces cerevisiae.
    statement: >-
      Deleting both phosphoglucomutase genes in a UGP1-depleted strain further
      lowers flux to UDP-glucose, showing PGM1/PGM2 feed the UGP1 step.
  - source_id: PMID:38821050
    title: A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis.
    statement: >-
      Dolichol is made from polyprenol in three steps: DHRSX oxidises
      polyprenol to polyprenal (NAD+), SRD5A3 or yeast Dfg10 reduces polyprenal
      to dolichal (NADPH), and DHRSX reduces dolichal to dolichol.
    supporting_text: SRD5A3 and its yeast orthologue Dfg10 produce dolichal from polyprenal (reaction 2), but have undetectable activity on polyprenol
  - source_id: PMID:42201967
    title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    statement: >-
      TDA5 is the S. cerevisiae functional ortholog of DHRSX; tda5 deletion
      accumulates polyprenol and reduces dolichol and is rescued by DHRSX but
      not by DFG10 or SRD5A3. Residual dolichol in tda5 dfg10 cells suggests
      a bypass route.
    supporting_text: These findings show that Tda5 serves the same function as DHRSX in yeast, thereby demonstrating conservation of the three-step detour pathway in yeast and supporting a broader eukaryotic framework for dolichol biosynthesis.
  - source_id: PMID:20637498
    title: SRD5A3 is required for converting polyprenol to dolichol and is mutated in a congenital glycosylation disorder.
    statement: SRD5A3 (yeast DFG10) is required for dolichol formation from polyprenol; SRD5A3-CDG.
  - source_id: PMID:1323123
    title: Saccharomyces cerevisiae sec59 cells are deficient in dolichol kinase activity.
    statement: SEC59 encodes the yeast dolichol kinase that makes Dol-P.
  - source_id: PMID:9223280
    title: Human and Saccharomyces cerevisiae dolichol phosphate mannose synthases represent two classes of the enzyme, but both function in Schizosaccharomyces pombe.
    statement: >-
      Dol-P-Man synthases fall into a C-terminally anchored class (S.
      cerevisiae, Ustilago, Trypanosoma) and an unanchored class (human,
      S. pombe, Caenorhabditis), which are functionally interchangeable in
      S. pombe.
    supporting_text: The two classes of synthase are functionally equivalent, because S. cerevisiae DPM1 and its human counterpart both complement the lethal null mutation in S. pombe dpm1(+).
  - source_id: PMID:10835346
    title: Human dolichol-phosphate-mannose synthase consists of three subunits, DPM1, DPM2 and DPM3.
    statement: >-
      Human DPM synthase has catalytic DPM1, regulatory DPM2 and stabilising
      DPM3; S. pombe has orthologs of all three.
    supporting_text: Schizosaccharomyces pombe has proteins that resemble three  human subunits; S.pombe DPM3 restored biosynthesis of DPM in Lec15 cells,  indicating its orthologous relationship to human DPM3.
  - source_id: PMID:16280320
    title: DPM1, the catalytic subunit of dolichol-phosphate mannose synthase, is tethered to and stabilized on the endoplasmic reticulum membrane by DPM3.
    statement: DPM3 tethers the catalytic DPM1 subunit to the ER membrane and is essential for activity.
  - source_id: PMID:8076653
    title: Isolation of the ALG5 locus encoding the UDP-glucose:dolichyl-phosphate glucosyltransferase from Saccharomyces cerevisiae.
    statement: ALG5 encodes the ER-membrane UDP-glucose:dolichyl-phosphate glucosyltransferase.
  - source_id: Reactome:R-HSA-446199
    title: Synthesis of dolichyl-phosphate
    statement: >-
      The dolichol -> Dol-P segment (SRD5A3 polyprenol reduction, DOLK phosphorylation) follows
      the human Reactome "Synthesis of dolichyl-phosphate" sub-pathway.
  - source_id: Reactome:R-HSA-162699
    title: Synthesis of dolichyl-phosphate mannose
    statement: >-
      The Dol-P-Man branch (DPM1/DPM2/DPM3 complex) follows the human Reactome "Synthesis of
      dolichyl-phosphate mannose" sub-pathway (reaction R-HSA-162721).
  - source_id: file:human/SRD5A3/SRD5A3-ai-review.yaml
    title: SRD5A3 gene review (human)
    statement: >-
      The polyprenal reductase step (UniProtKB:Q9H8P0, GO:0160198) matches the completed human
      SRD5A3 review.
  - source_id: file:human/DOLK/DOLK-ai-review.yaml
    title: DOLK gene review (human)
    statement: >-
      The dolichol -> Dol-P step (UniProtKB:Q9UPQ8, GO:0004168) matches the completed human DOLK review.
  - source_id: file:human/DPM1/DPM1-ai-review.yaml
    title: DPM1 gene review (human)
    statement: >-
      The catalytic Dol-P-Man synthase step (UniProtKB:O60762, GO:0004582) matches the completed
      human DPM1 review.
  - source_id: file:human/DPM2/DPM2-ai-review.yaml
    title: DPM2 gene review (human)
    statement: >-
      The regulatory DPM-synthase subunit (UniProtKB:O94777, GO:0008047) matches the completed
      human DPM2 review.
  - source_id: file:human/DPM3/DPM3-ai-review.yaml
    title: DPM3 gene review (human)
    statement: >-
      The membrane-anchoring DPM-synthase subunit (UniProtKB:Q9P2X0, GO:0043495) matches the
      completed human DPM3 review.
  - source_id: file:human/ALG5/ALG5-ai-review.yaml
    title: ALG5 gene review (human)
    statement: >-
      The Dol-P-Glc synthase step (UniProtKB:Q9Y673, GO:0004581) matches the completed human ALG5 review.
  - source_id: file:human/MPDU1/MPDU1-ai-review.yaml
    title: MPDU1 gene review (human)
    statement: >-
      The Dol-P-Man/Dol-P-Glc utilisation factor (UniProtKB:O75352, GO:0006488) matches the
      completed human MPDU1 review.
  - source_id: file:yeast/PMI40/PMI40-ai-review.yaml
    title: PMI40 gene review (S. cerevisiae)
    statement: >-
      PMI40 core function is mannose-6-phosphate isomerase (GO:0004476) in
      the cytosol, part of GDP-mannose biosynthesis.
  - source_id: file:yeast/PGM2/PGM2-ai-review.yaml
    title: PGM2 gene review (S. cerevisiae)
    statement: PGM2 core function is phosphoglucomutase (GO:0004614) in the cytosol.
