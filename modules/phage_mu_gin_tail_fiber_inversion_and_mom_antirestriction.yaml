    - order: 3
      role: Com-activated translation of Mom and N6-methylcarbamoylation of viral DNA adenines
      node:
        id: com_mom_dna_methylcarbamoylation_antirestriction
        label: Com zinc-finger mRNA stem-loop melting and Mom Fe2+/acetyl-CoA-dependent adenine N6-methylcarbamoylation
        module_type: BIOLOGICAL_PROCESS
        description: Because constitutive Mom expression is toxic to the host cell, the com-mom operon at the extreme right end of the Mu genome is tightly restricted to the late lytic phase by host Dam methylation, host OxyR repression Relief, and viral C-dependent Pmom transcriptional activation. Once transcribed, the mom ribosome-binding site is sequestered in an inhibitory mRNA hairpin; the upstream-encoded zinc-finger protein Com binds the 5' translational operator of com-mom mRNA and melts this stem-loop to activate Mom translation. Mom then uses Fe2+ and acetyl-CoA to convert ~15% of viral DNA adenines at 5'-(C/G)-A-(C/G)-N-(C/T)-3' sites into N6-methylcarbamoyladenine (momylation) just prior to packaging, protecting the phage genome against host restriction-modification systems across the expanded host range enabled by Gin inversion.
        annotons:
          - id: com_translational_activator_activity
            label: Translational activator Com zinc-finger binding to com-mom mRNA and stem-loop destabilization
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: com (Escherichia phage Mu)
                term:
                  id: UniProtKB:Q38621
                  label: Translational activator com
              description: Cys4 zinc-finger RNA-binding translational activator Com that binds the com-mom mRNA leader and melts an inhibitory hairpin to expose the mom translation initiation region.
            function:
              preferred_term: RNA binding
              term:
                id: GO:0003723
                label: RNA binding
            processes:
              - preferred_term: positive regulation of translation
                term:
                  id: GO:0045727
                  label: positive regulation of translation
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/com/com-uniprot.txt
                statement: Translational activator Com binds the 5' region of com-mom mRNA and destabilizes a translation inhibition stem to expose mom translation start signals.
                supporting_text: Trans-acting positive regulator required for mom mRNA     translation. Binds the com-mom mRNA 5' and destabilizes a translation     inhibition stem to expose mom translation start signals.
            role_description: Binds the com-mom mRNA translational operator and unfolds the inhibitory secondary structure blocking ribosome access to the mom start codon.
          - id: mom_dna_adenine_methylcarbamoylase_activity
            label: Methylcarbamoylase Mom Fe2+/acetyl-CoA-dependent N6-methylcarbamoylation of viral DNA adenines
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: mom (Escherichia phage Mu)
                term:
                  id: UniProtKB:P06018
                  label: Methylcarbamoylase mom
              description: GNAT-superfamily Fe2+-binding DNA modification enzyme Mom that converts ~15% of viral DNA adenine residues into N6-methylcarbamoyladenine using acetyl-CoA prior to packaging.
            function:
              preferred_term: transferase activity
              term:
                id: GO:0016740
                label: transferase activity
            processes:
              - preferred_term: symbiont-mediated evasion of host restriction-modification system
                term:
                  id: GO:0099018
                  label: symbiont-mediated evasion of host restriction-modification system
              - preferred_term: DNA modification
                term:
                  id: GO:0006304
                  label: DNA modification
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/mom/mom-uniprot.txt
                statement: Methylcarbamoylase Mom is an iron-binding enzyme that performs N6-methylcarbamoylation of ~15% of viral DNA adenine residues using acetyl-CoA just before packaging, rendering viral DNA resistant to host type I and type II restriction enzymes.
                supporting_text: Iron-binding protein that performs methylcarbamoylation of     adenine using acetyl CoA (PubMed:32369169). This chemical modification     makes the viral DNA resistant to a variety of host type I and type II     restriction enzymes by modifying approximately 15% of DNA adenine     residues (PubMed:32369169).
            role_description: Catalyzes N6-methylcarbamoylation of adenine residues on newly replicated viral DNA prior to headful packaging to prevent cleavage by restriction endonucleases in newly infected enteric hosts.
  connections:
    - source: gin_site_specific_g_segment_inversion
      target: mu_alternate_tail_fiber_assembly_and_receptor_binding
      connection_type: REGULATES
      predicate:
        preferred_term: regulates
        term:
          id: RO:0002211
          label: regulates
      description: Gin-catalyzed inversion of the 3 kb G-segment switches which variable C-terminal tail fiber exon and cognate assembly chaperone (S+U vs. S'/Mup52+U'/Mup51) are fused in-frame to the constant N-terminal tail fiber domain.
  knowledge_gaps:
    - gap_statement: Although Mom was discovered as an N6-methylcarbamoylase that uses acetyl-CoA and Fe2+ to modify DNA adenines (PMID:32369169), the source of the carbamoyl/nitrogen donor and the exact radical or nucleophilic reaction mechanism of the GNAT-fold active site remain incompletely resolved, and Gene Ontology currently lacks a specific molecular function term for DNA adenine N6-methylcarbamoylase activity (resulting in broad GO:0016740 transferase activity / inaccurate GO:0016755 aminoacyltransferase activity IEA mappings).
      boundary: Annotate Mom to GO:0016740 (transferase activity) with GO:0099018 (symbiont-mediated evasion of host restriction-modification system) and GO:0006304 (DNA modification) until a specific N6-methylcarbamoyltransferase GO term is minted.
      gap_kind:
        - BIOLOGY
        - ONTOLOGY
