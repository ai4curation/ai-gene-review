id: MODULE:phage_mu_gin_tail_fiber_inversion_and_mom_antirestriction
title: Escherichia Phage Mu Gin-Catalyzed G-Segment Tail Fiber Phase Variation and Com-Mom DNA Methylcarbamoylation Antirestriction
description: 'A concrete pathway module for Escherichia phage Mu (Muvirus mu, NCBITaxon:2681603) covering the two right-end host-range and host-defense evasion systems located downstream of the tail gene cluster: (1) site-specific DNA inversion of the 3 kb G-segment catalyzed by the serine recombinase Gin (P03015) at flanking 34 bp gix inverted repeats with the assistance of host factor Fis at the sis enhancer, switching expression between two alternative C-terminal receptor-binding tail fiber and assembly chaperone pairs—S + U in the G(+) orientation (Q9T1V0 + Q9T1U9, recognizing Escherichia coli K-12/C lipopolysaccharide) versus S'' (Mup52) + U'' (Mup51) in the G(-) orientation (P0DJY6 + P0DJY5, recognizing Citrobacter freundii, Shigella sonnei, Erwinia, and Enterobacter lipopolysaccharide); and (2) translational activation of the late com-mom mRNA by the zinc-finger RNA-binding protein Com (Q38621), which melts a translational repressor stem-loop to allow synthesis of the Fe2+/acetyl-CoA-dependent DNA adenine N6-methylcarbamoylase Mom (P06018), modifying ~15% of viral adenine residues to N6-methylcarbamoyladenine to protect packaged phage DNA against diverse host type I, II, and III restriction endonucleases.'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:23275567
    title: 'Crystal structure of an intermediate of rotating dimers within the synaptic tetramer of the G-segment invertase.'
    statement: Defines the structural mechanism of the bacteriophage Mu G-segment serine invertase Gin synaptic tetramer that catalyzes site-specific DNA inversion of the tail-fiber region.
    supporting_text: 'The serine family of site-specific DNA recombination enzymes accomplishes strand cleavage, exchange and religation using a synaptic protein tetramer.'
  - source_id: PMID:2525424
    title: 'Translation of the bacteriophage Mu mom gene is positively regulated by the phage com gene product.'
    statement: Demonstrates that translation of the bacteriophage Mu mom DNA-modification gene is positively regulated by the upstream com gene product.
    supporting_text: 'Expression of the bacteriophage Mu mom gene is subject to posttranscriptional regulation by the phage com gene product.'
  - source_id: PMID:27555589
    title: 'Baseplate assembly of phage Mu: Defining the conserved core components of contractile-tailed phages and related bacterial systems.'
    statement: Shows that the phage Mu baseplate complex attaches the tail fibers encoded in the invertible G-segment.
    supporting_text: 'Using this construct, with an N-terminal His 6 -tag encoded on Mup43, we isolated a complex that contained baseplate structures with tail fibers attached as observed by EM ( Fig. 2 A ).'
notes: Curated for Phase 7 of the Bacteriophage Genome & Module Curation project (`projects/PHAGES.md`). Note that in UniProt, the G(-) tail fiber and chaperone genes carry gene symbols `S'` (`P0DJY6`, ordered locus `Mup52`) and `U'` (`P0DJY5`, ordered locus `Mup51`); in this repository they are indexed under their ordered locus symbols `Mup52` and `Mup51` so that paths and participant descriptors remain punctuation-safe.
