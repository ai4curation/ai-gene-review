id: MODULE:dmel_rna_exosome
title: RNA exosome and nuclear exosome targeting complex in Drosophila melanogaster
description: >-
  The RNA exosome is a 3'-5' exoribonuclease complex that processes and degrades many classes
  of RNA in the nucleus and cytoplasm. A catalytically inactive nine-subunit barrel, made
  of a six-subunit ring (including Ski6, Mtr3, Rrp42, Rrp45 and Rrp46) capped by Csl4, Rrp4
  and Rrp40, channels RNA to the processive exonuclease and endonuclease Dis3 (Rrp44). The
  nuclear exosome also contains the distributive exonuclease Rrp6. Nuclear cofactors deliver
  substrates: the nuclear exosome targeting (NEXT) complex, formed by the RNA helicase Mtr4,
  a zinc-knuckle protein (CG4622, ZCCHC8 homolog) and an RRM protein (CG11454, RBM7 homolog),
  targets short-lived non-polyadenylated transcripts for decay.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001939
  title: 'FlyBase gene group RNAEXO: Rna exosome complexes'
  statement: >-
    FlyBase release FB2026_03 groups 10 D. melanogaster genes as rna exosome complexes (RNAEXO);
    this module models that group.
- source_id: FB:FBgg0002165
  title: 'FlyBase gene group NEXT: Nuclear exosome targeting complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as nuclear exosome targeting
    complex (NEXT); this module models that group.
- source_id: GO:0000178
  title: exosome (RNase complex)
  statement: >-
    GO term grounding the module as exosome (RNase complex).
notes: >-
  Boundary. FlyBase groups the nuclear exosome (RNA-EXO, with Rrp6) and the cytoplasmic exosome
  (RNA-EXOC, without Rrp6); both are captured by the shared core and nuclease parts, with
  Rrp6's nuclear restriction noted. The Ski complex, TRAMP and other cytoplasmic and nuclear
  cofactors have no FlyBase group here and are not added. Rrp42 and Rrp45 have no UniProt
  mapping in the source table and are grounded to FlyBase gene ids. FlyBase groups realized
  by this module: RNAEXO (FBgg0001939), NEXT (FBgg0002165). Subgroups folded into it: RNA-EXO,
  RNA-EXOC. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_rna_exosome.yaml;
  none of the member genes has a gene review yet unless noted.
