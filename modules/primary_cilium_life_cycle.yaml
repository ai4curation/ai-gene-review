        title: Centriolar kinesin Kif24 interacts with CP110 to remodel microtubules and regulate ciliogenesis.
        statement: >-
          KIF24 binds CP110 and CEP97 at the mother centriole, depolymerizes microtubules in vitro, and
          restrains cilia assembly in cycling cells.
      - &id003
        source_id: PMID:39882855
        statement: >-
          CEP89 positions myristoylated NCS1 at the distal appendages, where it captures preciliary vesicles
          for ciliary vesicle formation.
