  - order: 6
    role: ciliary membrane composition
    node:
      id: ciliary_membrane_composition
      label: Ciliary membrane identity and protein targeting
      module_type: BIOLOGICAL_PROCESS
      concepts:
      - preferred_term: protein localization to cilium
        term:
          id: GO:0061512
          label: protein localization to cilium
      description: >-
        Mature cilia keep a distinct membrane. ARL13B activates ARL3, a GTP-dependent switch whose GTP-bound
        form releases lipidated cargo from PDE6D (farnesylated/prenylated cargo) and UNC119B (myristoylated
        cargo) inside the cilium; RP2 inactivates ARL3. INPP5E keeps PI(4,5)P2 low in the ciliary membrane,
        and TULP3 couples IFT-A to phosphoinositides to import GPCRs. PDE6D also solubilizes farnesylated
        RAS outside cilia. BBSome-mediated export is modeled in modules/bbsome.yaml.
      evidence:
      - &id016
        source_id: PMID:26551564
        title: >-
          A G-protein activation cascade from Arl13B to Arl3 and implications for ciliary targeting of
          lipidated proteins.
        statement: >-
          ARL13B is the guanine nucleotide exchange factor for ARL3, creating a G-protein cascade that
          releases lipidated cargo from PDE6D and UNC119 inside the cilium.
      - *id015
      - &id019
        source_id: PMID:19668215
        title: >-
          INPP5E mutations cause primary cilium signaling defects, ciliary instability and ciliopathies
          in human and mouse.
        statement: INPP5E localizes to cilia; its loss causes ciliary signaling defects and ciliary instability.
      - &id017
        source_id: PMID:22002721
        statement: >-
          PDE6D is a GDI-like carrier for farnesylated cargo whose release is triggered by ARL2-GTP or
          ARL3-GTP.
