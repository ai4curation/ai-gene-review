      description: >-
        The mother centriole becomes competent to template a cilium. Distal appendages, assembled in the
        order CEP83 then SCLT1 and CEP89 then FBF1 and CEP164, dock the centriole to membrane. CEP164
        recruits TTBK2, which triggers removal of the CP110-CEP97 cap by phosphorylating cap-anchoring
        proteins (MPHOSPH9, CEP83); CP110 itself is not a known TTBK2 substrate. KIF24 recruits the cap
        and depolymerizes centriolar microtubules, restraining ciliogenesis in cycling cells. CEP89 also
        positions NCS1 to capture preciliary vesicles, linking this stage to ciliary vesicle formation.
        FBF1 is not needed for licensing itself (cap removal and TTBK2 recruitment are normal without
        it) but gates IFT and membrane-protein entry at the ciliary base.
