  - order: 5
    role: axoneme extension by IFT
    node:
      id: axoneme_extension_ift
      label: Axoneme extension by intraflagellar transport
      module_type: BIOLOGICAL_PROCESS
      concepts:
      - preferred_term: intraciliary transport
        term:
          id: GO:0042073
