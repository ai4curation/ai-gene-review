      description: >-
        Mature cilia keep a distinct membrane. ARL13B activates ARL3, which releases lipidated cargo from
        PDE6D and UNC119B inside the cilium; RP2 inactivates ARL3. INPP5E keeps PI(4,5)P2 low in the ciliary
        membrane, and TULP3 couples IFT-A to phosphoinositides to import GPCRs. BBSome-mediated export
        is modeled in modules/bbsome.yaml.
