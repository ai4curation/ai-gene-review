          A G-protein activation cascade from Arl13B to Arl3 and implications for ciliary targeting of
          lipidated proteins.
        statement: >-
          ARL13B is the guanine nucleotide exchange factor for ARL3, creating a G-protein cascade that
          releases lipidated cargo from PDE6D and UNC119 inside the cilium.
      - &id014
        source_id: PMID:20889716
        title: >-
          TULP3 bridges the IFT-A complex and membrane phosphoinositides to promote trafficking of G protein-coupled
          receptors into primary cilia.
