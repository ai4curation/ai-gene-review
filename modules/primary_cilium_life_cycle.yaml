id: MODULE:primary_cilium_life_cycle
title: Primary cilium life cycle module
description: >-
  The primary cilium is a microtubule-based sensory organelle templated by the mother centriole. Its life
  cycle runs from licensing of the mother centriole as a basal body, through ciliary vesicle formation,
  transition zone assembly and IFT-driven axoneme extension, to maintenance of a distinct ciliary membrane,
  control of cilium length, and disassembly when the cell re-enters the cell cycle. This module captures
  the ordered stages and the protein roles that carry out each stage, using human proteins as concrete
  members.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:41005307
  title: Intrinsic heterogeneity of primary cilia revealed through spatial proteomics.
  statement: >-
    HPA primary-cilium atlas: antibody-based sub-ciliary localization of 715 proteins in three cell lines.
    Used here as localization evidence for module members; most calls are graded Approved or Uncertain.
- &id001
  source_id: PMID:23348840
  title: Centriole distal appendages promote membrane docking, leading to cilia initiation.
  statement: >-
    Identifies CEP83, CEP89, SCLT1, FBF1 and CEP164 as distal appendage components, defines their assembly
    hierarchy, and shows that undocked centrioles fail to recruit TTBK2 or release CP110.
- &id002
  source_id: PMID:23141541
  title: >-
    The spinocerebellar ataxia-associated gene Tau tubulin kinase 2 controls the initiation of ciliogenesis.
  statement: >-
    TTBK2 acts at the distal end of the basal body, promotes removal of the CP110 cap and recruitment
    of IFT proteins, and is required to initiate ciliogenesis.
- &id005
  source_id: PMID:25686250
  title: Early steps in primary cilium assembly require EHD1/EHD3-dependent ciliary vesicle formation.
  statement: >-
    EHD1 and EHD3 tubulate membranes to fuse distal appendage vesicles into the ciliary vesicle, acting
    with the Rab11-Rab8 cascade; Rab8 is activated only after ciliary vesicle assembly.
- &id008
  source_id: PMID:21725307
  title: A transition zone complex regulates mammalian ciliogenesis and ciliary membrane composition.
  statement: >-
    TCTN1 forms a transition zone complex with MKS1, TMEM216, TMEM67, CEP290, B9D1, TCTN2 and CC2D2A that
    controls ciliogenesis and ciliary membrane composition in a tissue-specific manner.
- &id011
  source_id: PMID:31451806
  title: Structure of the dynein-2 complex and its assembly with intraflagellar transport trains.
  statement: Structure of the dynein-2 complex and its assembly onto IFT trains for retrograde transport.
- &id024
  source_id: PMID:17604723
  title: HEF1-dependent Aurora A activation induces disassembly of the primary cilium.
  statement: >-
    NEDD9/HEF1 activates Aurora A at the basal body, which phosphorylates and activates the tubulin deacetylase
    HDAC6 to drive ciliary disassembly.
- &id025
  source_id: PMID:25660017
  title: >-
    The Microtubule-Depolymerizing Activity of a Mitotic Kinesin Protein KIF2A Drives Primary Cilia Disassembly
    Coupled with Cell Proliferation.
  statement: >-
    PLK1-activated KIF2A depolymerizes microtubules at the basal body to drive primary cilium disassembly.
notes: >-
  Revised 2026-10-03 after gene reviews of all 60 members (genes/human/<GENE>/). Draft built in the HUMAN_PROTEIN_ATLAS
  project. Members and UniProt accessions come from projects/HUMAN_PROTEIN_ATLAS/cilium_life_cycle/candidate_members.tsv
  (UniProt REST). Several roles have no GO molecular-function term (distal appendage scaffold, transition
  zone barrier, IFT adaptor, microtubule depolymerase) and carry preferred_term only. BBSome cargo export
  is a separate module (modules/bbsome.yaml). Motile cilia, centriole duplication and the ciliary pocket
  are outside this boundary.
