  - order: 7
    role: length control
    node:
      id: cilium_length_control
      label: Cilium length control
      module_type: REGULATORY_STEP
      concepts:
      - preferred_term: negative regulation of non-motile cilium assembly
        term:
          id: GO:1902856
          label: negative regulation of non-motile cilium assembly
      description: >-
        Steady-state length reflects the balance of assembly and turnover at the tip. The RCK kinases
        CILK1 and MAK limit length by regulating IFT turnaround; CILK1 is the better-supported length
        kinase in most cells, while MAK evidence comes mainly from the photoreceptor connecting cilium.
        KIF7, a non-motile kinesin-4, binds growing microtubule plus ends and slows their growth at the
        tip. GO has no cilium-length term, so negative regulation of non-motile cilium assembly is used.
      evidence:
      - &id020
        source_id: PMID:24853502
        title: >-
          Intestinal cell kinase, a protein associated with endocrine-cerebro-osteodysplasia syndrome,
          is a key regulator of cilia length and Hedgehog signaling.
        statement: Intestinal cell kinase (CILK1) is a key regulator of cilia length and signaling.
      - &id021
        source_id: PMID:25243405
        title: >-
          Regulation of cilium length and intraflagellar transport by the RCK-kinases ICK and MOK in renal
          epithelial cells.
        statement: >-
          The RCK kinases ICK and MOK regulate cilium length and intraflagellar transport in renal epithelial
          cells.
      - &id022
        source_id: PMID:39293864
        statement: >-
          Ccrk-Mak/Ick signaling regulates ciliary transport and is essential for retinal photoreceptor
          survival.
      - &id023
        source_id: PMID:24952464
        statement: KIF7 organizes the cilium tip compartment by limiting microtubule growth at the tip.
