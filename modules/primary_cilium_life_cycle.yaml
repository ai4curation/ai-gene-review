  - order: 8
    role: cilium disassembly
    node:
      id: cilium_disassembly
      label: Cilium disassembly before cell-cycle re-entry
      module_type: BIOLOGICAL_PROCESS
      concepts:
      - preferred_term: cilium disassembly
        term:
          id: GO:0061523
          label: cilium disassembly
      description: >-
        On cell-cycle re-entry the cilium is resorbed so the centrioles can act at the spindle poles.
        NEDD9 and Pitchfork (CIMAP3) activate Aurora A at the basal body; Aurora A activates the tubulin
        deacetylase HDAC6. PLK1 activates KIF2A, which depolymerizes microtubules at the base and is held
        back by TTBK2 while the cilium grows. Phosphorylated Tctex-1 (DYNLT1) at the transition zone promotes
        resorption independently of dynein. AURKA, PLK1, KIF2A and NEDD9 are pleiotropic: their dominant
        roles are mitotic or adhesion-related, and ciliary disassembly is a secondary function.
      evidence:
      - *id024
      - *id025
      - &id028
        source_id: PMID:20643351
        title: Pitchfork regulates primary cilia disassembly and left-right asymmetry.
        statement: Pitchfork (CIMAP3) activates Aurora A at the basal body to regulate primary cilia disassembly.
      - &id029
        source_id: PMID:21394082
        title: >-
          Ciliary transition zone activation of phosphorylated Tctex-1 controls ciliary resorption, S-phase
          entry and fate of neural progenitors.
        statement: >-
          Phosphorylated Tctex-1 (DYNLT1) at the transition zone controls ciliary resorption before S-phase
          entry.
      - &id027
        source_id: PMID:16184168
        statement: HEF1/NEDD9 activates Aurora A in vitro and is required for its activation at the centrosome.
