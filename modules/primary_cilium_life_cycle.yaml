        NEDD9 and Pitchfork activate Aurora A at the basal body; Aurora A activates the tubulin deacetylase
        HDAC6. PLK1 activates KIF2A, which depolymerizes microtubules at the base. Phosphorylated Tctex-1
        at the transition zone also promotes resorption.
