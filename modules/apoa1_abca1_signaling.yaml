id: MODULE:apoa1_abca1_signaling
title: Apolipoprotein A-I / ABCA1 signaling pathway module
description: >-
  Lipid-poor apolipoprotein A-I (apoA-I), the major protein of plasma HDL, binds
  the cell-surface ABC transporter ABCA1, which acts as an apoA-I receptor. Besides
  loading apoA-I with cellular phospholipid and cholesterol, the apoA-I-ABCA1
  interaction initiates intracellular signaling: JAK2 autophosphorylation and
  STAT3 activation through STAT3 docking sites on ABCA1, and activation of the
  small GTPase Cdc42 and its kinases. In macrophages the STAT3 branch suppresses
  inflammatory cytokine expression independently of lipid efflux.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0038027
    title: apolipoprotein A-I-mediated signaling pathway
    statement: The module is grounded in the GO biological process term whose
      definition begins with apolipoprotein A-I binding to its receptor on the
      surface of a target cell.
  - source_id: PMID:16443932
    title: Apolipoprotein A-I activates Cdc42 signaling through the ABCA1 transporter.
    statement: ApoA-I activates Cdc42, PAK1 and JNK in human fibroblasts only when
      functional ABCA1 is present; ABCA1 complexes with Cdc42 and acts as a full
      apoA-I receptor.
    supporting_text: >-
      We conclude that ABCA1 transduces signals from apoA-I by complexing and
      activating Cdc42 and downstream kinases and, therefore, acts as a full apoA-I
      receptor.
  - source_id: PMID:14668333
    title: Janus kinase 2 modulates the apolipoprotein interactions with ABCA1 required
      for removing cellular cholesterol.
    statement: ApoA-I acutely stimulates JAK2 autophosphorylation in ABCA1-expressing
      cells.
    supporting_text: >-
      Acute incubation of ABCA1-expressing cells with apoA-I had no effect on ABCA1
      phosphorylation but stimulated JAK2 autophosphorylation.
  - source_id: PMID:19783654
    title: The macrophage cholesterol exporter ABCA1 functions as an anti-inflammatory
      receptor.
    statement: The apoA-I/ABCA1/JAK2 pathway activates STAT3 through STAT3 docking
      sites on ABCA1, independently of lipid transport, and suppresses LPS-induced
      cytokines in macrophages.
    supporting_text: >-
      Thus, the apoA-I/ABCA1 pathway in macrophages functions as an anti-inflammatory
      receptor through activation of JAK2/STAT3.
  - source_id: PMID:26989082
    title: Both STAT3 activation and cholesterol efflux contribute to the anti-inflammatory
      effect of apoA-I/ABCA1 interaction in macrophages.
    statement: ABCA1 mutants separate STAT3 activation from cholesterol efflux; STAT3
      activation alone suffices to reduce proinflammatory cytokine expression.
    supporting_text: >-
      We showed that activation of STAT3 by the interaction of apoA-I/ABCA1 without
      cholesterol efflux could significantly decrease proinflammatory cytokine
      expression in macrophages.
  - source_id: PMID:21339300
    title: 'Tristetraprolin-dependent post-transcriptional regulation of inflammatory
      cytokine mRNA expression by apolipoprotein A-I: role of ATP-binding membrane cassette
      transporter A1 and signal transducer and activator of transcription 3.'
    statement: In human THP-1 macrophages apoA-I induces tristetraprolin through JAK2/STAT3,
      and blocking the apoA-I-ABCA1 interaction abolishes the response.
    supporting_text: >-
      When blocking interaction of apoA-I with ATP-binding membrane cassette
      transporter A1 (ABCA1), a major receptor for apoA-I in macrophages, it would
      almost totally abolish the effect of apoA-I on tristetraprolin expression.
  - source_id: file:genes/human/APOA1/APOA1-ai-review.yaml
    statement: Gene review for human APOA1 (UniProtKB:P02647), which adds involved_in
      GO:0038027 as a NEW row and refines the receptor-binding rows to receptor ligand
      activity.
  - source_id: file:genes/human/ABCA1/ABCA1-ai-review.yaml
    statement: Gene review for human ABCA1 (UniProtKB:O95477), which accepts apolipoprotein
      A-I receptor activity (GO:0034188, IDA, PMID:16443932) and keeps GO:0038027 as
      non-core.
notes: >-
  Boundary. The module has two steps: the extracellular ligand apoA-I and the
  receptor ABCA1 on the responding cell (macrophages, fibroblasts). Intracellular
  effectors (JAK2, STAT3, Cdc42, PAK1, JNK, SOCS3, tristetraprolin) are downstream
  and are not modelled as parts. ABCA1-mediated lipid efflux to apoA-I and HDL
  biogenesis are a parallel output of the same ligand-receptor interaction; they
  are a lipid-transport mechanism, not part of this signaling module. Other
  apolipoproteins and amphipathic helical peptides also engage ABCA1
  (PMID:16443932, PMID:16210729), and apoA-I mimetic peptides are used in much of
  the downstream literature; the module names apoA-I as the physiological ligand
  and does not claim the other apolipoproteins as representatives.

  Ligand function term. The ligand step uses GO:0048018 receptor ligand activity,
  following the LIGANDS_IN_SIGNALING decision that a ligand enables receptor ligand
  activity or a child; no more specific child exists for apoA-I. GOA records the
  apoA-I-ABCA1 interaction on APOA1 as GO:0034191 apolipoprotein A-I receptor binding
  and GO:0034190 apolipoprotein receptor binding (IPI), which the APOA1 review
  refines via MODIFY to GO:0048018.

  Participation. ApoA-I is not merely required: the STAT3 branch is separable from
  lipid transport (PMID:19783654, PMID:26989082), so apoA-I's contribution to the
  signal is its binding and activation of ABCA1, the ligand step that GO assigns to
  receptor ligands.

  Families. The ligand step is grounded to the apoA-I subfamily
  PANTHER:PTHR18976:SF11 (APOLIPOPROTEIN A-I) rather than the whole PTHR18976
  family, which also contains apoA-IV, apoA-V and apoE. The receptor step is grounded
  to PANTHER:PTHR19229:SF34 (PHOSPHOLIPID-TRANSPORTING ATPASE ABCA1); the ABCA family
  PTHR19229 contains other transporters (ABCA7 also binds apoA-I but its receptor
  role in this signaling pathway is not established). No PAINT node is cited for the
  receptor step: the PTHR19229 node carrying GO:0034188 (PTN002710138) is seeded by
  ABCA7, not ABCA1.

  Taxon scope. The experimental evidence comes from human, mouse and hamster cells
  with human apoA-I; the module is scoped to Mammalia, where both parts and the
  experimental evidence exist. Whether non-mammalian apoA-I/ABCA1 orthologs signal
  this way has not been examined.

  Annotation state (GOA). ABCA1 carries GO:0038027 only by IEA (GO_REF:0000108,
  inferred from GO:0034188); APOA1 carried no GO:0038027 annotation before the APOA1
  review, which is the category A gap recorded in projects/LIGANDS_IN_SIGNALING.md
  section 3.
