id: MODULE:high_voltage_activated_calcium_channels
title: High-voltage-activated calcium channels — CaV1 (L-type; CACNA1S, CACNA1C, CACNA1D, CACNA1F) and CaV2 (P/Q-, N-, R-type; CACNA1A, CACNA1B, CACNA1E) pore-forming alpha1 subunits assembled with auxiliary CaVbeta (CACNB1-4) and alpha2delta (CACNA2D1-4) subunits for depolarisation-gated calcium entry across the plasma membrane (human)
description: >-
  High-voltage-activated (HVA) calcium channels open when the plasma membrane is strongly
  depolarised and let calcium flow down its steep electrochemical gradient into the cytosol,
  converting electrical activity into calcium signals. Each channel is a complex built around
  one pore-forming alpha1 subunit, a protein of four homologous repeats that each contain a
  voltage-sensing domain and a pore domain, so that the alpha1 subunit alone carries both the
  voltage sensor and the calcium-selective pore. Seven human genes encode HVA alpha1 subunits
  in two subfamilies. The CaV1 (L-type, dihydropyridine-sensitive) channels are CaV1.1
  (CACNA1S) in skeletal muscle, CaV1.2 (CACNA1C) in heart, smooth muscle and neurons, CaV1.3
  (CACNA1D) in sinoatrial node, cochlear hair cells, neurons and endocrine cells, and CaV1.4
  (CACNA1F) in retinal photoreceptors and bipolar cells; they initiate contraction, secretion,
  gene expression and transmitter release at ribbon synapses. The CaV2 channels are P/Q-type
  CaV2.1 (CACNA1A), N-type CaV2.2 (CACNA1B) and R-type CaV2.3 (CACNA1E), which trigger fast
  transmitter release at presynaptic terminals. The alpha1 subunit is assembled with a
  cytosolic CaVbeta subunit (CACNB1-4), a membrane-associated guanylate kinase-like protein
  that binds the alpha-interaction domain in the I-II linker, promotes surface expression and
  tunes activation and inactivation, and with an extracellular, GPI-anchored alpha2delta
  subunit (CACNA2D1-4), whose disulfide-linked alpha2 and delta chains dock on the pore domain
  and raise channel number and current density. In skeletal muscle a gamma1 subunit (CACNG1)
  is a further component. Which alpha1, beta and alpha2delta paralogues combine is tissue-
  dependent, and the auxiliary subunits do not conduct calcium themselves.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes the voltage-operated calcium channels as multi-subunit
      complexes with a pore-forming alpha subunit and ancillary beta, gamma and delta
      subunits, divided into subfamilies by current type. This module models the
      high-voltage-activated (CaV1 and CaV2) channels; the low-voltage-activated CaV3
      channels are the sibling module t_type_calcium_channels, and the record's other
      transport systems are separate modules or unmodelled (see notes). Human genes in scope
      from RGD's list: CACNA1A CACNA1B CACNA1C CACNA1D CACNA1E CACNA1F CACNA1S CACNB1 CACNB2
      CACNB3 CACNB4. CACNA2D1-4 are added on experimental evidence (not on RGD's list).
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text describes the voltage-operated channels as alpha-pore complexes with ancillary subunits.
    supporting_text: >-
      Structurally, they are multi-subunit complexes of which alpha is the pore forming
      subunit and the beta, gamma or delta are ancillary.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text on the roles of voltage-operated calcium entry in muscle, neurons and endocrine cells.
    supporting_text: >-
      In cardiac and muscle cells, calcium entry mediates contraction and also prompts CICR
      from intracellular stores; in neurons and endocrine cells, it initiates synaptic
      transmission and hormone release, respectively.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose process concept is its descendant GO:0061577 calcium ion transmembrane
      transport via high voltage-gated calcium channel (is_a GO:0070588 is_a GO:0006816),
      checked in go-basic 2026-07-26.
  - source_id: GO:0061577
    title: calcium ion transmembrane transport via high voltage-gated calcium channel
    statement: >-
      Module process concept and the process on every alpha1 annoton. Experimental in GOA
      for CACNA1C (IDA PMID:15454078; IMP several); authored for the other alpha1 subunits
      from their experimental HVA channel activity (see notes).
  - source_id: GO:0005891
    title: voltage-gated calcium channel complex
    statement: >-
      Module complex concept. GOA part_of rows by IDA for CACNA1C, CACNA1D, CACNA1F,
      CACNA1S, CACNB2, CACNB3, CACNB4, CACNA2D1 and CACNA2D4.
  - source_id: PMID:21746798
    title: Voltage-gated calcium channels.
    statement: >-
      Review cited by RGD for PW:0001139 (RGD:7204688, Catterall 2011): ten mammalian CaV
      channels in three subfamilies with distinct roles.
    supporting_text: >-
      There are ten members of the voltage-gated Ca(2+) channel family in mammals, and they
      serve distinct roles in cellular signal transduction.
  - source_id: PMID:16382099
    title: International Union of Pharmacology. XLVIII. Nomenclature and structure-function relationships of voltage-gated calcium channels.
    statement: IUPHAR nomenclature review for the CaV1/CaV2/CaV3 naming used here.
    supporting_text: >-
      The family of voltage-gated calcium channels serves as the key transducers of cell
      surface membrane potential changes into local intracellular calcium transients
  - source_id: PMID:11160515
    title: Biophysical properties, pharmacology, and modulation of human, neuronal L-type (alpha(1D), Ca(V)1.3) voltage-dependent calcium currents.
    statement: Subunit composition of HVA channels.
    supporting_text: >-
      Voltage-dependent calcium channels (VDCCs) are multimeric complexes composed of a
      pore-forming alpha(1) subunit together with several accessory subunits, including
      alpha(2)delta, beta, and, in some cases, gamma subunits.
  - source_id: PMID:27580036
    title: Structure of the voltage-gated calcium channel Ca(v)1.1 at 3.6 Å resolution.
    statement: >-
      Cryo-EM structure of the rabbit skeletal muscle Cav1.1 complex, showing the alpha1
      pore with alpha2delta-1 on the extracellular dome and beta1a bound to the I-II linker.
    supporting_text: >-
      The intracellular I-II and III-IV linker helices interact with the β1a-subunit and the
      carboxy-terminal domain of α1, respectively.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139 across
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. Earlier sibling modules from the same record:
  store_operated_calcium_entry, er_calcium_store_cycling, plasma_membrane_calcium_extrusion
  and mitochondrial_calcium_uniporter; this module and t_type_calcium_channels (drafted in
  the same batch) split RGD's voltage-operated channels (VOCs) into the high- and
  low-voltage-activated systems. PW:0001139 is the only PW evidence source_id; its
  sub-pathway PW:0001140 (calcium/calcium-mediated signaling) is mentioned here in prose
  only.


  (1) WHY TWO MODULES FOR RGD'S VOCs. RGD lists CACNA1A-I, CACNA1S and CACNB1-4 together.
  The HVA (CaV1, CaV2) and LVA (CaV3) channels differ in activation range, in GO activity
  term (GO:0008331 versus GO:0008332, sibling children of GO:0005245) and in GO process
  (GO:0061577 versus GO:0090676), and only the HVA channels are obligate complexes with
  CaVbeta and alpha2delta. CACNA1G, CACNA1H and CACNA1I are therefore in
  t_type_calcium_channels.


  (2) STRUCTURE. The module is a complex (root PROTEIN_COMPLEX, concept GO:0005891) with
  three required parts: one alpha1 pore subunit, one CaVbeta and one alpha2delta, all
  required for a native-like HVA current (PMID:1309651, PMID:1321501). The alpha1 choice is a
  REALIZER variant set by CaV subfamily (CaV1 L-type, concept GO:1990454; CaV2 P/Q-, N-,
  R-type), each with a nested REALIZER set of paralogues; selection is ONE_OR_MORE because
  cells express several channel types. CaVbeta and alpha2delta are single annotons with
  FAMILY participants (PANTHER PTHR11824 and PTHR10166, labels checked verbatim in
  interpro/panther/panther.obo; representative members carry the matching PANTHER
  cross-references in UniProt), because any paralogue can pair with any HVA alpha1 and
  pairing is tissue-dependent rather than fixed. Stoichiometry is 1:1:1 in the structures
  and is stated in prose rather than encoded. GO has no CaV2-specific complex term
  (no P/Q-, N- or R-type complex under GO:0005891), so the CaV2 variant carries no concept;
  this is noted but not requested, since the CaV2 types are distinguished by alpha1 alone.


  (3) MOLECULAR FUNCTIONS. From experimental GOA (QuickGO, November 2026) or the gene's
  review core function, checked in go-basic 2026-07-26 (none obsolete). alpha1: GO:0008331
  high voltage-gated calcium channel activity, experimental (IDA/IMP) for CACNA1A, CACNA1B,
  CACNA1C and CACNA1S; for CACNA1D (contributes_to IDA in GOA), CACNA1E and CACNA1F (GOA
  only the parent GO:0005245 by IDA/IMP) it is the core function of each gene's review.
  CaVbeta: GO:0005246 calcium channel regulator activity, IDA for CACNB4 (PMID:11880487),
  IGI for CACNB1 (PMID:21883149), and the core function of the CACNB2 and CACNB3 reviews.
  alpha2delta: GO:0005246 is AUTHORED from the core functions of the CACNA2D1 and CACNA2D4
  reviews; no alpha2delta has an experimental GOA row for it. The auxiliary subunits are
  never given channel activity: they have no pore, and GOA's contributes_to rows (CACNB2,
  CACNB3, CACNB4, CACNA2D1) record their share of the complex activity correctly. Calcium
  substrate and product are grounded to ChEBI calcium(2+) CHEBI:29108 (label as used in
  the sibling calcium modules), labelled extracellular to cytosol. GO:0005515 protein
  binding and the partner-binding rows (calmodulin, syntaxin, alpha-actinin) are not used.
  Processes authored without a matching experimental GOA row: GO:0061577 for all alpha1
  except CACNA1C; GO:1902514 on the alpha2delta and CaVbeta annotons is IGI only for
  CACNA2D1 and CACNB1. Locations authored: plasma membrane for CACNA1B, CACNA1D, CACNA1E
  (Reactome TAS only) and CACNA1F (GOA "membrane"), following each gene review; cytoplasmic
  side of plasma membrane for CaVbeta (CACNB3 review core location).


  (4) CONSISTENCY WITH MODULES THAT USE CaV CHANNELS IN CONTEXT (referenced, not
  duplicated, and not linked by module_ref because each uses one channel inside a larger
  mechanism). beta_cell_glucose_stimulated_insulin_secretion types CACNA1D and CACNA1C with
  GO:0008331 on plasma membrane, as here. er_calcium_store_cycling types CACNA1S with the
  parent GO:0005245 and the T-tubule, because there its role is the voltage sensor that
  opens RYR1 and it requests a calcium channel activator activity term for that coupling;
  this module uses the HVA child GO:0008331 (IDA PMID:9852570) and the same T-tubule
  location for CACNA1S as a calcium-conducting pore, which is compatible. synaptic_vesicle_exocytosis
  types a CaV2 family node (CACNA1A/CACNA1B representatives) with the precomposed SynGO
  term GO:0099626 voltage-gated calcium channel activity involved in regulation of
  presynaptic cytosolic calcium levels at the active zone membrane; that term is a
  descendant of GO:0005245 that bundles the synaptic context, which a generic transport
  module should not carry, so GO:0008331 is used here and the presynaptic role is left to
  that module. hair_cell_mechanotransduction mentions CaV1.3 (CACNA1D) at the ribbon synapse
  in prose only. visual_phototransduction is unrelated (CNG channels). None of these
  conflicts with this module.


  (5) BOUNDARY DECISIONS. Gamma subunits: RGD's text names gamma as an ancillary subunit.
  CACNG1 is a component of the skeletal muscle CaV1.1 complex in structural work, but its
  human GOA has only protein binding, it is not on RGD's list, and the cached evidence
  (the Cav1.1 structure abstract, PMID:27580036) does not name it, so it is not modelled;
  adding it as an optional CaV1.1-specific unit is a follow-up once a citable source is
  cached. CACNG2-CACNG8 are transmembrane AMPA receptor regulatory proteins (TARPs) whose
  association with calcium channels is contested; excluded. Regulators and partners
  (calmodulin, CaBP proteins, G-protein betagamma inhibition of CaV2, RIM/RIM-BP active-zone
  tethering, STAC3 in muscle, the RGK GTPases, alpha1 C-terminal proteolysis) are
  regulation context, not parts. Downstream uses (contraction, excitation-contraction
  coupling through RYR1/RYR2, exocytosis, gene expression) belong to the modules in note 4
  and to er_calcium_store_cycling.


  (6) GO-CAM LINKS. No production pathway GO-CAM in gocams/index.tsv (any species)
  contains CACNA1A-F, CACNA1S, CACNB1-4, CACNA2D1-4 or CACNG1. The only model with a CaV
  subunit is the MGI gene-centric model for mouse Cacna1a (gomodel:MGI_MGI_109482), which
  types Cacna1a with GO:0008331 in many cell-type contexts. It is not pinned: an
  automatically generated per-gene model of a mouse ortholog is not pathway grounding
  for this human module. The seed's best_gocam (gomodel:65d7e4ac00002121, ITPR1-HSPA9-VDAC1
  calcium transfer to mitochondria in apoptosis) is unrelated to this module.


  (7) POSSIBLE UPSTREAM ISSUES (GOA). Several auxiliary subunits carry "enables" rows for
  channel activity that should be contributes_to: CACNB2 enables GO:0005245 (IDA
  PMID:1309651) beside contributes_to GO:0008331 from the same paper; CACNA2D1 enables
  GO:0005245 (IDA PMID:1309651; IGI PMID:21883149) beside contributes_to rows; CACNA2D4
  enables GO:0005245 (IDA PMID:12181424); CACNB1 and CACNB3 enables GO:0005245 (TAS); CACNB2
  enables GO:0005262 calcium channel activity (NAS PMID:9594024). Conversely CACNA1D has
  GO:0008331 only as contributes_to (IDA PMID:1309651), although alpha1D is the pore. Not
  verified against full texts; recorded as observations for the gene reviews.


  (8) OTHER PW:0001139 GENES NOT MODELLED HERE, by symbol. CACNA1G CACNA1H CACNA1I
  (t_type_calcium_channels); STIM1 STIM2 ORAI1 ORAI2 ORAI3 (store_operated_calcium_entry);
  ITPR1-3, RYR1-3, ATP2A1-3 (er_calcium_store_cycling); ATP2B1-4, SLC8A1-3, SLC24A1-5
  (plasma_membrane_calcium_extrusion); MCU and SLC8B1 (mitochondrial_calcium_uniporter);
  unmodelled: CNGA1-4, CNGB1, CNGB3, TRPV5, TRPV6, TPCN1, TPCN2, MCOLN1, ATP2C1, ATP2C2.


  (9) GROUNDING. UniProt accessions from genes/human/<GENE>/<GENE>-uniprot.txt for CACNA1B,
  CACNA1C, CACNA1D, CACNA1E, CACNA1F, CACNB2, CACNB3, CACNA2D1 and CACNA2D4, the rest from
  UniProt REST (reviewed human entries). Gene reviews are missing for CACNA1A, CACNA1S,
  CACNB1, CACNB4, CACNA2D2 and CACNA2D3, which is curation follow-up for the project plan.
  PANTHER family ids only on the two auxiliary FAMILY descriptors (note 2); no PTN ids.
