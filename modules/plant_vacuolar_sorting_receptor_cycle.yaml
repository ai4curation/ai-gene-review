            - preferred_term: RMR1 (rice)
              term:
                id: UniProtKB:Q69U49
                label: Receptor homology region, transmembrane domain- and RING domain-containing protein
                  2
            ancestral_nodes:
            - preferred_term: PAINT node PTN004566093
              term:
                id: PANTHER:PTN004566093
                label: PTN004566093
              description: 'PANTHER PAINT ancestral node PTN004566093 in family PTHR47168, placed at taxon:71275;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: P:GO:0006886. PAINT rows
                dated 20260316. Arabidopsis RMR1 descends from it (its IBA rows in QuickGO cite PTN004566093).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN004566093 in PANTHER family PTHR47168.
            description: Subfamily PTHR47168:SF5 in UniProt and the local entries table, which lists Arabidopsis
              RMR1-6 and two rice RMRs. PANTHER's release-19 Arabidopsis classification file places Arabidopsis
              RMR1 in PTHR22765:SF334 instead; which placement is right has not been checked. PTN004566093
              (taxon:71275, rosids) places intracellular protein transport; the family-level ubiquitin
              ligase node is not cited, so the step is left untyped. Descent is shown by the protein's
              IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this
              repository.
        locations:
        - preferred_term: trans-Golgi network
          term:
            id: GO:0005802
            label: trans-Golgi network
        role_description: RING-domain receptor proposed to sort storage proteins to protein storage vacuoles.
        evidence:
        - source_id: file:interpro/panther/PTHR47168/PTHR47168-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      description: 'Optional: RMRs act on the storage-vacuole route, which not every plant cell or lineage
        uses, and their PAINT grounding is placed at rosids only.'
  - order: 2
    role: receptor recycling
    node:
