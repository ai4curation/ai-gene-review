        - preferred_term: endosome
          term:
            id: GO:0005768
            label: endosome
        role_description: Core retromer subunit that, with Vps26 and Vps29, retrieves sorting receptors
          from prevacuolar compartments for reuse.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0140312 at PTN000120819 in PTHR11099; no gene review for the Arabidopsis
            protein here.
