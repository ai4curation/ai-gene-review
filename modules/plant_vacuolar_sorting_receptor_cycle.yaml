          term:
            id: GO:0140312
            label: cargo adaptor activity
          description: The F IBD at PTN000122547, placed at Eukaryota.
        locations:
        - preferred_term: endosome
          term:
            id: GO:0005768
            label: endosome
        role_description: Retromer subunit that binds Vps35 and its regulators.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0140312 at PTN000122547 in PTHR11124; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR11124/PTHR11124-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  connections:
  - source: vsr
    target: retromer
    connection_type: PROVIDES_INPUT_FOR
    description: After cargo release, retromer retrieves the receptors for reuse.
