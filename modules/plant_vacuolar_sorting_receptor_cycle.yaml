id: MODULE:plant_vacuolar_sorting_receptor_cycle
title: Vacuolar sorting receptor cycle in plants
description: Soluble hydrolases bound for the plant lytic vacuole carry sorting signals that vacuolar
  sorting receptors (VSRs) recognise at the trans-Golgi network and prevacuolar compartment. The receptor-cargo
  complex travels to the prevacuolar compartment, where cargo is released, and the retromer complex of
  Vps35, Vps26 and Vps29 returns the receptors for another round. This module is the green-lineage form
  of that cycle.
status: DRAFT
scope: CONCRETE
notes: 'Viridiplantae scope, with Arabidopsis representatives. Read as a satisfiability rule, a genome
  needs a VSR and the three retromer subunits; RMRs, which act on the storage-vacuole route, are optional.
  The VSR selector lists both UniProt''s and PANTHER''s own placements, because the two disagree (see
  that step). Several selectors come from PANTHER''s release-19 Arabidopsis classification file, because
  the local entries tables list Vps29 without a subfamily. The retromer selectors are not plant-specific
  (Vps35 SF0, the whole Vps26 family and Vps29 SF12), and the VSR step is also met by animal PRADC1, so
  outside plants the module is met by any genome with retromer and a PRADC1 protein, including human;
  the rule is meant for plant genomes only. Not modelled: the sorting nexins and the Rab7 and Rab5 GTPases
  that regulate the cycle (the Rab7 step is in plant_vacuole_fusion), and the receptor-independent routes
  to the vacuole.'
module:
  id: plant_vacuolar_sorting_receptor_cycle
  label: Vacuolar sorting receptor cycle in plants
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein targeting to vacuole
    term:
      id: GO:0006623
      label: protein targeting to vacuole
  - preferred_term: retromer complex
    term:
      id: GO:0030904
      label: retromer complex
  context:
    taxa:
    - preferred_term: Viridiplantae
      term:
        id: NCBITaxon:33090
        label: Viridiplantae
  parts:
  - order: 1
    role: cargo recognition
    node:
      id: vsr
      label: Vacuolar sorting receptor
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: vsr_receptor
        label: Vacuolar sorting receptor (VSR)
        participant:
