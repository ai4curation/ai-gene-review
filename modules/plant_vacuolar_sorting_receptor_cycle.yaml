                id: PANTHER:PTN000122547
                label: PTN000122547
              description: 'PANTHER PAINT ancestral node PTN000122547 in family PTHR11124, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana, Drosophila melanogaster, Homo sapiens,
                Mus musculus, Saccharomyces cerevisiae, Schizosaccharomyces pombe and 1 seed whose species
                is not resolved locally (UniProtKB:Q8IM27). IBD GO terms at this node: C:GO:0005768, C:GO:0030904,
