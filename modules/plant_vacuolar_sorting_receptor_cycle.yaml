                id: UniProtKB:Q9T091
                label: Vacuolar protein sorting-associated protein 26B
            ancestral_nodes:
            - preferred_term: PAINT node PTN000260564
              term:
                id: PANTHER:PTN000260564
                label: PTN000260564
              description: 'PANTHER PAINT ancestral node PTN000260564 in family PTHR12233, placed at taxon:2759
