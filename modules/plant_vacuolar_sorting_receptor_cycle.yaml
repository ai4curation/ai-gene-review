                id: PANTHER:PTN000120819
                label: PTN000120819
              description: 'PANTHER PAINT ancestral node PTN000120819 in family PTHR11099, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana, Drosophila melanogaster, Homo sapiens,
                Mus musculus, Saccharomyces cerevisiae, Schizosaccharomyces pombe and 1 seed whose species
