              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000260564 in PANTHER family PTHR12233.
            description: The whole family PTHR12233. Its plant subfamilies in PANTHER's release-19 Arabidopsis
              classification file (SF20, VPS26A; SF15, VPS26B) hold only Arabidopsis and poplar proteins
              in PANTHER's cached organism files, and every entry in the local entries table, plant or
              not, is listed without a subfamily, so a subfamily selector would fail most plant genomes
              for want of a placement. The family also holds VPS26C, a Commander-complex paralogue, so
              the step matches any Vps26 paralogue. PTN000260564 (Eukaryota) places retromer complex and
              carries no F IBD, so the step is left untyped. Descent is shown by the protein's IBA rows
              in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this repository.
