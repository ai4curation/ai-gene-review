            - preferred_term: VSR3 (Arabidopsis)
              term:
                id: UniProtKB:O80977
                label: Vacuolar-sorting receptor 3
            - preferred_term: VSR5 (Arabidopsis)
              term:
                id: UniProtKB:O64758
                label: Vacuolar-sorting receptor 5
            - preferred_term: VSR6 (Arabidopsis)
              term:
                id: UniProtKB:Q9FYH7
                label: Vacuolar-sorting receptor 6
            - preferred_term: BP80 (pea)
              term:
                id: UniProtKB:P93484
                label: Vacuolar-sorting receptor 1
            ancestral_nodes:
            - preferred_term: PAINT node PTN008602288
              term:
                id: PANTHER:PTN008602288
                label: PTN008602288
              description: 'PANTHER PAINT ancestral node PTN008602288 in family PTHR22702, placed at taxon:33090;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: C:GO:0005768, C:GO:0005802,
                C:GO:0017119, P:GO:0006623. PAINT rows dated 20250618. Arabidopsis VSR1 descends from
                it (its IBA rows in QuickGO cite PTN008602288).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN008602288 in PANTHER family PTHR22702.
            description: 'UniProt and PANTHER''s own files place the VSRs in different families, so the
              selector lists both. UniProt, the local entries table and GO''s PAINT annotations use PTHR22702:
              SF1 (Arabidopsis VSR1-4 and pea BP80) and SF4 (VSR5-7); the cited node PTN008602288 (taxon:33090,
              Viridiplantae) places protein targeting to vacuole. PANTHER''s release-19 Arabidopsis classification
              file instead places VSR1-6 in five plant-only subfamilies of the EGF-domain family PTHR24034
              (SF166, SF199, SF171, SF180, SF181), which are also selected. PTHR24034:SF89 is excluded,
              because PANTHER''s file places VSR7 there with animal CD93, so VSR7 is matched only through
              PTHR22702:SF4. PTHR22702:SF1 also holds the animal PRADC1 proteins in both sources, so outside
              plants this selector matches PRADC1, which is not a sorting receptor. The node carries no
              F IBD, so the step is left untyped. Descent is shown by the protein''s IBA rows in QuickGO,
              which cite the node; no Arabidopsis gene review exists for it in this repository.'
        locations:
        - preferred_term: trans-Golgi network
          term:
            id: GO:0005802
            label: trans-Golgi network
        role_description: Type I membrane receptor that binds vacuolar sorting signals of soluble hydrolases
          at the trans-Golgi network and prevacuolar compartment and carries them toward the vacuole.
        evidence:
        - source_id: file:interpro/panther/PTHR22702/PTHR22702-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 1
