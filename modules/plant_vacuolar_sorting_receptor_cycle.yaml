                VPS35A descends from it (its IBA rows in QuickGO cite PTN000120819).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000120819 in PANTHER family PTHR11099.
            description: Subfamilies PTHR11099:SF0 (VPS35A with the yeast, Dictyostelium and animal Vps35
              proteins), SF6 (VPS35B) and SF5 (VPS35C). Descent is shown by the protein's IBA rows in
              QuickGO, which cite the node; no Arabidopsis gene review exists for it in this repository.
        function:
