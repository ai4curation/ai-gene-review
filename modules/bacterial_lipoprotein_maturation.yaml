id: MODULE:bacterial_lipoprotein_maturation
title: Bacterial lipoprotein maturation
description: 'Bacterial lipoprotein maturation begins with Lgt transfer of a diacylglyceryl group to a
  lipobox cysteine and LspA removal of the signal peptide. The resulting diacylglyceryl lipoprotein may
  remain unmodified at its amino terminus or undergo lineage- and substrate-dependent tailoring: Lnt,
  Lnb or a compatible LnsAB complex adds a third long acyl chain; Lit relocates an existing chain to form
  a two-chain lyso-lipoprotein; LhaT transfers a lipid-carried acetyl group. These are distinct product
  routes, not interchangeable definitions of maturation. The bacterial occurrence envelope includes exemplars
  from Pseudomonadota, Bacillota and Bacteroidota; it does not assert universal enzyme presence or essentiality.
  Precursor export, lipid-donor synthesis, Lol trafficking and client functions are outside the boundary.'
status: COMPLETE
evidence:
- source_id: GO:0042158
  title: lipoprotein biosynthetic process
  statement: Process context for formation of bacterial lipoproteins. Individual terminal reactions carry
    their appropriate biosynthesis or modification process rather than inheriting every process indiscriminately.
- source_id: UniPathway:UPA00664
  title: UniPathway UPA00664
  statement: UPA00664 represents the Lgt diacylglyceryl-transfer substep of bacterial lipoprotein biosynthesis.
- source_id: UniPathway:UPA00665
  title: UniPathway UPA00665
  statement: UPA00665 represents the LspA signal-peptide-cleavage substep of bacterial lipoprotein biosynthesis.
- source_id: UniPathway:UPA00666
  title: UniPathway UPA00666
  statement: UPA00666 represents the Lnt N-acyl-transfer substep of bacterial lipoprotein biosynthesis.
- source_id: file:modules/prolipoprotein_diacylglyceryl_transfer-deep-research-openscientist.md
  title: OpenScientist module research for the Lgt step
  statement: OpenScientist supports UPA00664 as the first committed Lgt step and explicitly separates
    it from downstream LspA cleavage, Lnt N-acylation, and Lol sorting.
- source_id: file:modules/apolipoprotein_n_acyltransferase-deep-research-openscientist.md
  title: OpenScientist module research for the Lnt step
  statement: OpenScientist supports UPA00666 as the terminal Lnt N-acylation step of diderm bacterial
    lipoprotein maturation and separates it from upstream Lgt and LspA reactions.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__prolipoprotein_diacylglyceryl_transfer__upa00664-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00664 satisfiability review
  statement: The species-aware UPA00664 review supports lgt/PP_5142/Q88CN8 as the single high-confidence
    KT2440 Lgt candidate and warns not to count the PP_4236 DsbE/CcmG-like protein as a second Lgt.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__apolipoprotein_n_acyltransferase__upa00666-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00666 satisfiability review
  statement: The species-aware UPA00666 review supports lnt/PP_4790/Q88DN4 as the single high-confidence
    KT2440 Lnt candidate and notes intact neighboring Lgt, LspA, and Lol machinery.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_lipoprotein_maturation__upa00665-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00665 satisfiability review
  statement: The species-aware UPA00665 review supports lspA/PP_0604/Q88Q91 as the KT2440 signal-peptidase-II
    step and treats the lspA-only candidate list as a KEGG-boundary artifact, because the adjacent Lgt
    and Lnt steps are encoded by PP_5142 and PP_4790.
- source_id: file:modules/bacterial_lipoprotein_maturation-deep-research-openscientist.md
  title: OpenScientist module research for bacterial lipoprotein maturation
  statement: Historical retrieval support for the ordered shared maturation boundary. Current primary
    curation below establishes the terminal alternatives and supersedes incomplete historical coverage.
notes: 'The required core is Lgt followed by LspA. Optional terminal routes describe capacity for a specified
  product; absence of one route does not negate the shared core, and presence of one does not establish
  the others. Multiple routes may occur across a repertoire without asserting that they act sequentially
  on the same substrate. Taxonomy and family membership guide investigation but do not prove activity,
  compatible complex assembly, donor identity or essentiality. LnsAB requires a functional A/B pair; the
  S. aureus pair is the explicit module exemplar. S. epidermidis pairing controls are documented separately
  with verified RefSeq/UniParc identities because the corresponding UniProt records are deleted. No PANTHER
  ancestor is invented for Lnb, LnsAB or Lit. LhaT carrier synthesis is the separate bacterial_heptaprenylglyceryl_ether_lipid
  module; the uncharacterized transmembrane carrier-supply mechanism is not filled with a guessed enzyme.
  LspA uses the current signal peptidase activity GO:0009003; its aspartic mechanism remains supported
  in gene/family reviews. Primary evidence corrects older review assumptions about Lnt universality and
  unknown monoderm N-modification. Computational scope: the generic Boolean compiler treats the LnsAB
  complex annoton as one activity atom and does not itself descend active_units. Family- and member-aware
  capacity analysis must additionally enforce both compatible partners, product chemistry and donor availability;
  a bare GO:0016747 match is insufficient. Panel scope: ECOLI and PSEPK have reviewed Lgt/LspA/Lnt panels,
  and BACSU has reviewed Lgt/LspA/LhaT. Bacteroides, S. aureus and B. cereus terminal exemplars characterize
  those reactions without constituting complete native upstream gene panels; B. fragilis rescue in E.
  coli is an engineered context.'
module:
  id: bacterial_lipoprotein_maturation
  label: Bacterial lipoprotein maturation
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: lipoprotein biosynthetic process
    term:
      id: GO:0042158
      label: lipoprotein biosynthetic process
    description: Formation of mature bacterial lipoproteins from prolipoprotein precursors.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: Bacteria is an occurrence envelope for this multiroute mechanism, not a pan-bacterial
        conservation claim. Reviewed representatives sample Pseudomonadota, Bacillota and Bacteroidota;
        exact terminal products require target evidence.
    cellular_components:
    - preferred_term: plasma membrane
      term:
        id: GO:0005886
        label: plasma membrane
      description: Cytoplasmic membrane and its extracytoplasmic interface. The LnsA catalytic subunit
        is externally accessible and membrane-associated; it is not described as a polytopic membrane
        protein.
  parts:
  - order: 1
    role: Diacylglyceryl transfer to prolipoprotein cysteine
    node:
      id: lgt_diacylglyceryl_transfer_step
      label: Lgt diacylglyceryl transfer
      module_type: REACTION
      description: Lgt transfers a diacylglyceryl group from phosphatidylglycerol to the conserved cysteine
        of a lipobox-containing prolipoprotein.
      annotons:
      - id: lgt_diacylglyceryl_transferase
        label: 'Lgt family: prolipoprotein diacylglyceryl transferase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: prolipoprotein diacylglyceryl transferase family
            term:
              id: PANTHER:PTHR30589
              label: PROLIPOPROTEIN DIACYLGLYCERYL TRANSFERASE
            representative_members:
            - preferred_term: lgt (PSEPK exemplar)
              term:
                id: UniProtKB:Q88CN8
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Pseudomonas putida KT2440 UPA00664 exemplar.
            - preferred_term: lgt (ECOLI exemplar)
              term:
                id: UniProtKB:P60955
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Escherichia coli K-12 reviewed Lgt exemplar.
            - preferred_term: lgt (BACSU exemplar)
              term:
                id: UniProtKB:O34752
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Bacillus subtilis 168 monoderm Lgt; loss-of-function abolishes lipomodification
                but is not lethal.
            ancestral_nodes:
            - preferred_term: PAINT node PTN000778741
              term:
                id: PANTHER:PTN000778741
                label: PTN000778741
              description: Family-root PAINT IBD node (Bacteria) supporting GO:0008961, seeded by E. coli
                and Salmonella Lgt.
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN000778741 in PTHR30589.
        function:
          preferred_term: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
          term:
            id: GO:0008961
            label: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
          evidence:
          - source_id: file:PSEPK/lgt/lgt-uniprot.txt
            statement: UniProt assigns Q88CN8 to EC 2.5.1.145 and Rhea:RHEA:56712 for diacylglyceryl transfer
              from phosphatidylglycerol to prolipoprotein cysteine.
          - source_id: file:ECOLI/lgt/lgt-ai-review.yaml
            statement: The E. coli lgt review accepts GO:0008961 with direct biochemical and structural
              evidence for phosphatidylglycerol to prolipoprotein diacylglyceryl transfer.
          - source_id: file:BACSU/lgt/lgt-ai-review.yaml
            statement: The B. subtilis lgt review accepts GO:0008961 on loss-of-function evidence in a
              monoderm.
          - source_id: PMID:42949064
            statement: Section 2.2.3 describes phosphatidylglycerol-derived diacylglyceryl transfer to
              the precursor cysteine, preceding LspA cleavage. This is shared chemistry, not a universal
              essentiality claim.
          - source_id: PMID:42126242
            statement: Comparative Lgt complementation depends on recipient Lpp context. This supports
              retaining native/heterologous boundaries, not assigning universal essentiality or a P. putida-specific
              assay.
        processes:
        - preferred_term: lipoprotein biosynthetic process
          term:
            id: GO:0042158
            label: lipoprotein biosynthetic process
        role_description: Transfers phosphatidylglycerol-derived diacylglyceryl to the cysteine sulfur,
          forming a thioether and the lipidated LspA substrate.
  - order: 2
    role: Signal peptide cleavage from diacylglyceryl-prolipoprotein
    node:
      id: lspa_signal_peptide_cleavage_step
      label: LspA signal peptide cleavage
      module_type: REACTION
      description: LspA/signal peptidase II removes the signal peptide immediately N-terminal to the diacylglyceryl-modified
        lipobox cysteine.
      annotons:
      - id: lspa_signal_peptidase_ii
        label: 'LspA family: signal peptidase II'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: lipoprotein signal peptidase family
            term:
              id: PANTHER:PTHR33695
              label: LIPOPROTEIN SIGNAL PEPTIDASE
            representative_members:
            - preferred_term: lspA (PSEPK exemplar)
              term:
                id: UniProtKB:Q88Q91
                label: Lipoprotein signal peptidase
              description: Pseudomonas putida KT2440 UPA00665 exemplar.
            - preferred_term: lspA (ECOLI exemplar)
              term:
                id: UniProtKB:P00804
                label: Lipoprotein signal peptidase
              description: Escherichia coli K-12 reviewed LspA exemplar.
            - preferred_term: lspA (BACSU exemplar)
              term:
                id: UniProtKB:Q45479
                label: Lipoprotein signal peptidase
              description: Bacillus subtilis 168 monoderm SPase II; catalytic Asp-102/Asp-129 defined
                by mutagenesis.
            ancestral_nodes:
            - preferred_term: PAINT node PTN002134743
              term:
                id: PANTHER:PTN002134743
                label: PTN002134743
              description: Resolved family-root PTN002134743 supports an ancestral endopeptidase activity.
                Target signal-peptide specificity at the annoton is independently grounded; it is not
                a new PAINT assertion at this node.
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN002134743 in PTHR33695.
        function:
          preferred_term: signal peptidase activity
          term:
            id: GO:0009003
            label: signal peptidase activity
          evidence:
          - source_id: PMID:30900542
            statement: The maturation section places signal-peptide removal after lipidation, exposing
              the amino terminus; monoderm product diversity and diderm Lol trafficking are separate dimensions.
          - source_id: file:PSEPK/lspA/lspA-ai-review.yaml
            statement: Current signal peptidase GO:0009003 captures peptide-signal removal; reviewed aspartic
              mechanism and lipoprotein specificity refine the biological claim without claiming this
              genus is lipoprotein-specific.
        processes:
        - preferred_term: lipoprotein biosynthetic process
          term:
            id: GO:0042158
            label: lipoprotein biosynthetic process
        role_description: Cleaves the lipidated precursor to expose the cysteine alpha-amino group. This
          product can remain diacylated or enter a supported terminal tailoring route.
  - order: 3
    role: Optional product-specific N-terminal tailoring
    optional: true
    notes: Shared Lgt/LspA maturation remains satisfiable without a terminal route. Product-specific profiles
      must require the corresponding route; the five alternatives do not produce chemically identical
      endpoints.
    node:
      id: terminal_tailoring
      label: Optional N-terminal product routes
      module_type: BIOLOGICAL_PROCESS
      variant_sets:
      - id: terminal_product_routes
        label: Distinct terminal chemistries
        axis: Product chemistry and compatible enzyme system
        variant_kind: ROUTE
        selection: ONE_OR_MORE
        notes: Optional at the enclosing part. More than one route can be represented across substrates
          or conditions; no ordering or sequential action between alternatives is asserted. The generic
          GO0016747 shared by several routes does not collapse their donor, substrate or assembly constraints.
        variants:
        - id: lnt_n_acylation_step
          label: Lnt N-acylation
          module_type: REACTION
          description: Lnt transfers an acyl chain from a glycerophospholipid donor to the N-terminal
            cysteine amino group of a diacylglyceryl apolipoprotein.
          annotons:
          - id: lnt_n_acyltransferase
            label: 'Lnt family: apolipoprotein N-acyltransferase'
            participant:
              selector_type: FAMILY
              family:
                preferred_term: apolipoprotein N-acyltransferase family
                term:
                  id: PANTHER:PTHR38686
                  label: APOLIPOPROTEIN N-ACYLTRANSFERASE
                representative_members:
                - preferred_term: lnt (PSEPK exemplar)
                  term:
                    id: UniProtKB:Q88DN4
                    label: Apolipoprotein N-acyltransferase
                  description: Pseudomonas putida KT2440 UPA00666 exemplar.
                - preferred_term: lnt (ECOLI exemplar)
                  term:
                    id: UniProtKB:P23930
                    label: Apolipoprotein N-acyltransferase
                  description: Escherichia coli K-12 reviewed Lnt exemplar.
                ancestral_nodes:
                - preferred_term: PAINT node PTN002214718
                  term:
                    id: PANTHER:PTN002214718
                    label: PTN002214718
                  description: PAINT IBD node seeded by E. coli Lnt supporting plasma membrane and lipoprotein
                    biosynthetic process; no molecular-function IBD exists for Lnt.
                  evidence:
                  - source_id: GO_REF:0000033
                    statement: IBD propagation from PAINT node PTN002214718 in PTHR38686.
                description: Verified Lnt family with explicit E. coli and P. putida exemplars. Ppm1 fusion-domain
                  functions are not attributed to an Lnt-only protein. Unresolved PAINT node placements
                  are not resolved by gene-name or donor-count arguments.
            function:
              preferred_term: apolipoprotein N-acyltransferase activity
              term:
                id: GO:0016747
                label: acyltransferase activity, transferring groups other than amino-acyl groups
              evidence:
              - source_id: file:PSEPK/lnt/lnt-uniprot.txt
                statement: UniProt assigns Q88DN4 to EC 2.3.1.269 and Rhea:RHEA:48228 for terminal N-acylation
                  of diacylglyceryl lipoprotein.
              - source_id: file:ECOLI/lnt/lnt-ai-review.yaml
                statement: The E. coli review supports donor-neutral GO:0016747 and describes phospholipid-dependent
                  N-terminal cysteine acylation, not acyl-CoA-dependent lysine acetylation.
              - source_id: PMID:42023066
                statement: Section 2 supports the canonical E. coli Lgt-LspA-Lnt route to triacylated
                  lipoprotein. This statement does not grant Lnt orthology or identical terminal chemistry
                  to all bacteria.
            processes:
            - preferred_term: lipoprotein biosynthetic process
              term:
                id: GO:0042158
                label: lipoprotein biosynthetic process
            role_description: Adds a third acyl chain from a glycerophospholipid donor. Canonical E. coli
              chemistry is distinct from Lnb donor uncertainty and from Lit rearrangement or LhaT acetylation;
              downstream Lol transport is outside this step.
        - id: lnb_n_acylation_step
          label: Lnb third-chain N-acylation
          module_type: REACTION
          description: Bacteroides Lnb generates triacylated lipoproteins. The physiological acyl donor
            and purified enzyme mechanism remain unresolved.
          annotons:
          - id: lnb_n_acyltransferase
            label: Lnb terminal N-acylation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Lnb lipoprotein N-acyltransferase family
                representative_members:
                - preferred_term: BF9343_0945 / Lnb
                  description: Bacteroides fragilis NCTC9343; exact clone rescues Lnt-deficient E. coli
                    and reporter MS establishes N-acylation.
                  term:
                    id: UniProtKB:Q5LGL3
                    label: BF9343_0945 / Lnb
                - preferred_term: BT_4364 / Lnb
                  description: Bacteroides thetaiotaomicron VPI5482-derived native deletion/complementation
                    and reporter products.
                  term:
                    id: UniProtKB:Q89ZL3
                    label: BT_4364 / Lnb
                description: Both proteins carry NCBIfam NF051878 (lpactltferLnb) and the IPR025178/PF13387
                  N-terminal plus IPR057436/PF25221 membrane-domain architecture. No verified PANTHER
                  family is available; neither domain alone is asserted to define an active whole Lnb
                  protein.
            function:
              preferred_term: Lipoprotein N-acylation with unresolved donor
              evidence:
              - source_id: PMID:39495918
                statement: Full cellular complementation and product MS support N-acyl transfer. The purified
                  species was a reporter lipoprotein, not purified Lnb; phospholipid donation is not experimentally
                  assigned.
              term:
                id: GO:0016747
                label: acyltransferase activity, transferring groups other than amino-acyl groups
            processes:
            - preferred_term: lipoprotein biosynthetic process
              term:
                id: GO:0042158
                label: lipoprotein biosynthetic process
            role_description: Adds an N-linked acyl chain to an LspA-cleaved diacylglyceryl lipoprotein.
              C148 is functionally required in the tested B. thetaiotaomicron protein, but the candidate
              His/Asn residues and acyl-enzyme intermediate are not experimentally established.
        - id: lnsab_n_acylation_step
          label: Compatible LnsAB complex third-chain N-acylation
          module_type: REACTION
          description: A compatible LnsA/LnsB complex adds an N-linked acyl chain. Both partners are required
            in purified S. aureus reconstitution; exact complex stoichiometry remains unresolved.
          annotons:
          - id: lnsab_n_acyltransferase
            label: LnsAB lipoprotein N-acylation complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: Compatible LnsA-LnsB lipoprotein N-acylation complex
                description: Compatibility is an experimental constraint. S. aureus A with S. epidermidis
                  B works, while the reciprocal tested pairing fails; a family co-occurrence match alone
                  cannot establish this route.
                active_units:
                - id: lnsa_catalytic_unit
                  label: LnsA catalytic subunit
                  role: Provides the mutation-defined catalytic center; requires the compatible LnsB partner
                    for demonstrated turnover.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: LnsA-like family
                      representative_members:
                      - preferred_term: SAOUHSC_00822 / LnsA
                        description: S. aureus NCTC8325 cloned sequence; named derivative hosts are distinguished
                          in gene notes.
                        term:
                          id: UniProtKB:Q2G006
                          label: SAOUHSC_00822 / LnsA
                      description: NCBIfam NF041769 and family IPR056567 verified. Papain-like fold and
                        automatic viral-protein names are not independent protease or taxonomic evidence.
                      term:
                        id: InterPro:IPR056567
                        label: Lipoprotein N-acylation protein LnsA-like
                - id: lnsb_partner_unit
                  label: LnsB obligatory membrane partner
                  role: Contributes to the complex activity through demonstrated physical and functional
                    association. Independent acyltransferase or protease activity is not asserted.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: LnsB-like family
                      representative_members:
                      - preferred_term: SAOUHSC_02761 / LnsB
                        description: S. aureus NCTC8325 cloned sequence; membrane partner tested with
                          its compatible LnsA.
                        term:
                          id: UniProtKB:Q2FVF3
                          label: SAOUHSC_02761 / LnsB
                      description: NCBIfam NF041768 and family IPR056566 verified. Broad CPBP ancestry
                        does not establish protease activity or compatibility with every LnsA.
                      term:
                        id: InterPro:IPR056566
                        label: CPBP family lipoprotein N-acylation protein LnsB-like
            function:
              preferred_term: Compatible LnsAB lipoprotein N-acylation
              evidence:
              - source_id: PMID:42580408
                statement: Purified S. aureus LnsA32-189 and LnsB from a host lacking Lnt require both
                  partners and prefer PG sn-1 acyl donation. These donor results are not transferred to
                  untested mixed or S. epidermidis pairs.
              - source_id: PMID:32723923
                statement: Native deletion/complementation identifies LnsA and LnsB as the two-component
                  terminal N-acylation machinery; the 2026 reconstitution resolves their joint catalytic
                  requirement.
              term:
                id: GO:0016747
                label: acyltransferase activity, transferring groups other than amino-acyl groups
            processes:
            - preferred_term: lipoprotein biosynthetic process
              term:
                id: GO:0042158
                label: lipoprotein biosynthetic process
            role_description: Produces a triacylated lipoprotein with an additional chain. LnsB contributes
              rather than independently enabling the overall transfer; tested CPBP motif mutants retain
              this complex activity.
        - id: lit_intramolecular_transfer_step
          label: Lit two-chain lyso-lipoprotein formation
          module_type: REACTION
          description: Relocates the sn-2 chain of the existing diacylglyceryl moiety to the free N-terminal
            amino group. Total acyl-chain number remains two.
          annotons:
          - id: lit_intramolecular_acyltransferase
            label: Lit intramolecular O-to-N acyl transfer
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Lit lipoprotein intramolecular transacylase family
                representative_members:
                - preferred_term: BC_1526 / Lit
                  description: Bacillus cereus ATCC14579; exact accession in purified-enzyme Methods and
                    native BC1526 deletion/complementation.
                  term:
                    id: UniProtKB:Q813T3
                    label: BC_1526 / Lit
                description: Verified IPR010178/PF07314 and NF051877 family assignments. Direct target
                  chemistry grounds this exemplar; family membership alone is not a universal substrate-specific
                  activity assertion.
                term:
                  id: InterPro:IPR010178
                  label: Lit
            function:
              preferred_term: Lipoprotein sn-2 O-to-N intramolecular acyl transfer
              evidence:
              - source_id: PMID:34253723
                statement: Purified exact target and product NMR establish sn-2 ester-to-amide relocation.
                  Detailed acid-base steps and a cyclic intermediate remain mechanistic proposals.
              - source_id: PMID:28320885
                statement: Native B. cereus BC1526 deletion/complementation links the exact strain locus
                  to lyso-lipoprotein formation.
              - source_id: PMID:32471867
                statement: Enterococcus ATCC19433 Lit-containing membrane fractions provide independent
                  intramolecular-transfer evidence; these are not purified Bacillus assays.
              term:
                id: GO:0016867
                label: intramolecular acyltransferase activity
            processes:
            - preferred_term: lipoprotein modification
              term:
                id: GO:0042160
                label: lipoprotein modification
            role_description: Makes N-acyl-S-monoacylglyceryl lyso-lipoprotein without an external acyl
              donor or an added third chain.
        - id: lhat_n_acetylation_step
          label: LhaT lipid-carrier-dependent N-acetylation
          module_type: REACTION
          description: Transfers a carrier-loaded acetyl group to the LspA-cleaved amino terminus. Ac-HepG
            synthesis is upstream and separate; the carrier translocation mechanism remains unknown.
          annotons:
          - id: lhat_n_acetyltransferase
            label: LhaT N-terminal acetylation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Activity-qualified LhaT family
                representative_members:
                - preferred_term: ypjA / LhaT
                  description: Bacillus subtilis168; native genetics and recombinant target-containing
                    membrane reactions.
                  term:
                    id: UniProtKB:P54392
                    label: ypjA / LhaT
                description: The P54392 member is active. An experimentally inactive B. anthracis homolog
                  prevents blanket activity assignment to the PTHR40042/DUF1405 family; family presence
                  must be followed by activity qualification.
                term:
                  id: PANTHER:PTHR40042
                  label: HYPOTHETICAL MEMBRANE SPANNING PROTEIN
            function:
              preferred_term: Lipid-carried acetyl transfer to lipoprotein nitrogen
              evidence:
              - source_id: PMID:40626731
                statement: Native genetics plus recombinant LhaT-containing membranes and product MS establish
                  N-acetylation. Reconstitution used a C20 carrier analogue and mixed mono/diacetyl donors,
                  not purified LhaT with defined native C35 regioisomers.
              term:
                id: GO:0008080
                label: N-acetyltransferase activity
            processes:
            - preferred_term: N-terminal protein amino acid acetylation
              term:
                id: GO:0006474
                label: N-terminal protein amino acid acetylation
            role_description: Adds a short acetyl substituent to a two-long-chain substrate, not a third
              long-chain fatty acid. Acetyl-CoA is used upstream in carrier loading, not as the demonstrated
              direct LhaT donor.
  connections:
  - source: lgt_diacylglyceryl_transfer_step
    target: lspa_signal_peptide_cleavage_step
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: Lgt produces the lipidated precursor whose signal peptide is cleaved by LspA; no CoA
      continuity is involved.
  - source: lspa_signal_peptide_cleavage_step
    target: lnt_n_acylation_step
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: The free cysteine alpha-amino group exposed by LspA is the acceptor for this optional
      route. Product chemistry is specified separately for each route.
  - source: lspa_signal_peptide_cleavage_step
    target: lnb_n_acylation_step
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: The free cysteine alpha-amino group exposed by LspA is the acceptor for this optional
      route. Product chemistry is specified separately for each route.
  - source: lspa_signal_peptide_cleavage_step
    target: lnsab_n_acylation_step
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: The free cysteine alpha-amino group exposed by LspA is the acceptor for this optional
      route. Product chemistry is specified separately for each route.
  - source: lspa_signal_peptide_cleavage_step
    target: lit_intramolecular_transfer_step
    connection_type: PRECEDES
