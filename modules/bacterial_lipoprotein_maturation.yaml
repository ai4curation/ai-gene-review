id: MODULE:bacterial_lipoprotein_maturation
title: Bacterial lipoprotein maturation
description: 'A bacterial envelope-biogenesis module for the ordered maturation of lipobox-containing
  prolipoproteins: Lgt diacylglyceryl transfer, LspA (signal peptidase II) cleavage of the signal peptide,
  and, in diderm lineages, Lnt N-acylation to give triacylated lipoproteins. The Lgt and LspA steps are
  pan-bacterial and are grounded here in Escherichia coli K-12, Pseudomonas putida KT2440 and Bacillus
  subtilis 168; the Lnt step is optional and lineage-restricted, grounded in E. coli and P. putida. Lol
  sorting to the outer membrane and substrate-specific lipoprotein functions are downstream and outside
  this module.'
status: COMPLETE
evidence:
- source_id: GO:0042158
  title: lipoprotein biosynthetic process
  statement: GO:0042158 is the biological-process term for formation of mature lipoproteins and covers
    the shared process context for Lgt, LspA, and Lnt.
- source_id: UniPathway:UPA00664
  title: UniPathway UPA00664
  statement: UPA00664 represents the Lgt diacylglyceryl-transfer substep of bacterial lipoprotein biosynthesis.
- source_id: UniPathway:UPA00665
  title: UniPathway UPA00665
  statement: UPA00665 represents the LspA signal-peptide-cleavage substep of bacterial lipoprotein biosynthesis.
- source_id: UniPathway:UPA00666
  title: UniPathway UPA00666
  statement: UPA00666 represents the Lnt N-acyl-transfer substep of bacterial lipoprotein biosynthesis.
- source_id: file:modules/prolipoprotein_diacylglyceryl_transfer-deep-research-openscientist.md
  title: OpenScientist module research for the Lgt step
  statement: OpenScientist supports UPA00664 as the first committed Lgt step and explicitly separates
    it from downstream LspA cleavage, Lnt N-acylation, and Lol sorting.
- source_id: file:modules/apolipoprotein_n_acyltransferase-deep-research-openscientist.md
  title: OpenScientist module research for the Lnt step
  statement: OpenScientist supports UPA00666 as the terminal Lnt N-acylation step of diderm bacterial
    lipoprotein maturation and separates it from upstream Lgt and LspA reactions.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__prolipoprotein_diacylglyceryl_transfer__upa00664-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00664 satisfiability review
  statement: The species-aware UPA00664 review supports lgt/PP_5142/Q88CN8 as the single high-confidence
    KT2440 Lgt candidate and warns not to count the PP_4236 DsbE/CcmG-like protein as a second Lgt.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__apolipoprotein_n_acyltransferase__upa00666-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00666 satisfiability review
  statement: The species-aware UPA00666 review supports lnt/PP_4790/Q88DN4 as the single high-confidence
    KT2440 Lnt candidate and notes intact neighboring Lgt, LspA, and Lol machinery.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_lipoprotein_maturation__upa00665-deep-research-openscientist.md
  title: OpenScientist PSEPK UPA00665 satisfiability review
  statement: The species-aware UPA00665 review supports lspA/PP_0604/Q88Q91 as the KT2440 signal-peptidase-II
    step and treats the lspA-only candidate list as a KEGG-boundary artifact, because the adjacent Lgt
    and Lnt steps are encoded by PP_5142 and PP_4790.
- source_id: file:modules/bacterial_lipoprotein_maturation-deep-research-openscientist.md
  title: OpenScientist module research for bacterial lipoprotein maturation
  statement: OpenScientist supports the reusable boundary as a strictly ordered Lgt-to-LspA-to-terminal-acylation
    maturation module, separates downstream Lol sorting and substrate-specific lipoprotein functions,
    and emphasizes that the terminal N-acylation chemistry is lineage-variable.
- source_id: file:PSEPK/lgt/lgt-ai-review.yaml
  title: Curated lgt review
  statement: The lgt review accepts phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity,
    plasma membrane localization, and lipoprotein biosynthetic process.
- source_id: file:PSEPK/lspA/lspA-ai-review.yaml
  title: Curated lspA review
  statement: The lspA review accepts LspA's aspartic-type endopeptidase activity and plasma membrane localization,
    modifies broad proteolysis to lipoprotein biosynthetic process, and proposes a more specific lipoprotein
    signal peptidase activity term.
- source_id: file:PSEPK/lnt/lnt-ai-review.yaml
  title: Curated lnt review
  statement: The lnt review accepts or refines annotations to N-acyltransferase activity, plasma membrane
    localization, and lipoprotein biosynthetic process.
- source_id: file:ECOLI/lgt/lgt-ai-review.yaml
  title: Curated E. coli lgt review
  statement: The E. coli lgt review accepts phosphatidylglycerol-prolipoprotein diacylglyceryl transferase
    activity, bacterial plasma membrane localization, and direct involvement in lipoprotein biosynthetic
    process.
- source_id: file:ECOLI/lspA/lspA-ai-review.yaml
  title: Curated E. coli lspA review
  statement: The E. coli lspA review accepts LspA's aspartic-type endopeptidase activity and plasma membrane
    localization, and proposes lipoprotein biosynthetic process plus a more specific lipoprotein signal
    peptidase activity term.
- source_id: file:ECOLI/lnt/lnt-ai-review.yaml
  title: Curated E. coli lnt review
  statement: The E. coli lnt review accepts or refines annotations to phospholipid-dependent N-acyltransferase
    activity, plasma membrane localization, and direct involvement in lipoprotein biosynthetic process.
- source_id: file:BACSU/lgt/lgt-ai-review.yaml
  title: Curated B. subtilis lgt review
  statement: The B. subtilis lgt review accepts GO:0008961, plasma membrane and lipoprotein biosynthetic
    process, supported by loss-of-function data showing that lgt is required for lipomodification and
    signal peptide cleavage but is not essential in this monoderm.
- source_id: file:BACSU/lspA/lspA-ai-review.yaml
  title: Curated B. subtilis lspA review
  statement: The B. subtilis lspA review accepts GO:0004190 on the basis of catalytic Asp-102/Asp-129
    mutagenesis and E. coli complementation, and refines generic endopeptidase and proteolysis rows as
    in the E. coli and P. putida reviews.
- source_id: file:interpro/panther/PTHR30589/PTHR30589-review.yaml
  title: PTHR30589 Lgt family review
  statement: The Lgt family is a single coherent bacterial clade; all PAINT assertions sit at family-root
    node PTN000778741 and are sound.
- source_id: file:interpro/panther/PTHR33695/PTHR33695-review.yaml
  title: PTHR33695 LspA family review
  statement: The LspA family is a single coherent bacterial clade; PTN002134743 carries plasma membrane
    and an endopeptidase activity that the gene reviews refine to aspartic-type endopeptidase activity.
- source_id: file:interpro/panther/PTHR38686/PTHR38686-review.yaml
  title: PTHR38686 Lnt family review
  statement: The Lnt family is mostly coherent; PTN002214718 carries plasma membrane and lipoprotein biosynthetic
    process, while rows from fused actinobacterial Ppm1 domains and a nitrilase-family node do not apply
    to Lnt-only members.
notes: 'Reusable boundary: this module models maturation chemistry, not all proteins that later act as
  mature lipoproteins. Lgt and LspA are present in diderm and monoderm bacteria alike (E. coli, P. putida
  and B. subtilis are the representatives), and in each lineage LspA cleaves only after Lgt has lipidated
  the lipobox cysteine. The Lnt step is marked optional: the cached PTHR38686 member inventory has no Firmicutes member, so
  B. subtilis lipoproteins remain diacylated or are N-modified by non-orthologous enzymes that are not
  modelled here; actinobacterial Lnt is fused to a Ppm1 mannosyltransferase domain whose activity is outside
  this module. Essentiality differs between lineages (lgt and lspA are essential in E. coli but not in
  B. subtilis), which reflects downstream outer-membrane sorting requirements, not differences in enzyme
  activity. Curation notes: GO lacks specific lipoprotein signal peptidase and apolipoprotein N-acyltransferase
  activity terms, so the LspA and Lnt steps use GO:0004190 and GO:0016747 and the gene reviews carry proposed
  new terms. The P. putida PP_4236/Q88F63 DsbE/CcmG-like protein, which carries an Lgt-like propagated
  label in the species-aware UPA00664 report, is not counted as an Lgt. The KEGG partition places lspA
  in ppu03060 Protein export, so an automated UPA00665 candidate list shows only lspA; that is a partitioning
  artifact, not a missing step. Downstream Lol trafficking is the separate bacterial_lol_lipoprotein_trafficking
  module.'
module:
  id: bacterial_lipoprotein_maturation
  label: Bacterial lipoprotein maturation
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: lipoprotein biosynthetic process
    term:
      id: GO:0042158
      label: lipoprotein biosynthetic process
    description: Formation of mature bacterial lipoproteins from prolipoprotein precursors.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: Lgt and LspA are pan-bacterial; terminal N-acylation by Lnt is restricted to diderm
        and actinobacterial lineages.
    cellular_components:
    - preferred_term: plasma membrane
      term:
        id: GO:0005886
        label: plasma membrane
      description: 'Cytoplasmic (inner) membrane: all three enzymes are polytopic membrane proteins acting
        on translocated, membrane-anchored prolipoproteins.'
  parts:
  - order: 1
    role: Diacylglyceryl transfer to prolipoprotein cysteine
    node:
      id: lgt_diacylglyceryl_transfer_step
      label: Lgt diacylglyceryl transfer
      module_type: REACTION
      description: Lgt transfers a diacylglyceryl group from phosphatidylglycerol to the conserved cysteine
        of a lipobox-containing prolipoprotein.
      annotons:
      - id: lgt_diacylglyceryl_transferase
        label: 'Lgt family: prolipoprotein diacylglyceryl transferase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: prolipoprotein diacylglyceryl transferase family
            term:
              id: PANTHER:PTHR30589
              label: PROLIPOPROTEIN DIACYLGLYCERYL TRANSFERASE
            representative_members:
            - preferred_term: lgt (PSEPK exemplar)
              term:
                id: UniProtKB:Q88CN8
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Pseudomonas putida KT2440 UPA00664 exemplar.
            - preferred_term: lgt (ECOLI exemplar)
              term:
                id: UniProtKB:P60955
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Escherichia coli K-12 reviewed Lgt exemplar.
            - preferred_term: lgt (BACSU exemplar)
              term:
                id: UniProtKB:O34752
                label: Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase
              description: Bacillus subtilis 168 monoderm Lgt; loss-of-function abolishes lipomodification
                but is not lethal.
            ancestral_nodes:
            - preferred_term: PAINT node PTN000778741
              term:
                id: PANTHER:PTN000778741
                label: PTN000778741
              description: Family-root PAINT IBD node (Bacteria) supporting GO:0008961, seeded by E. coli
                and Salmonella Lgt.
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN000778741 in PTHR30589.
        function:
          preferred_term: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
          term:
            id: GO:0008961
            label: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
          evidence:
          - source_id: file:PSEPK/lgt/lgt-uniprot.txt
            statement: UniProt assigns Q88CN8 to EC 2.5.1.145 and Rhea:RHEA:56712 for diacylglyceryl transfer
              from phosphatidylglycerol to prolipoprotein cysteine.
          - source_id: file:ECOLI/lgt/lgt-ai-review.yaml
            statement: The E. coli lgt review accepts GO:0008961 with direct biochemical and structural
              evidence for phosphatidylglycerol to prolipoprotein diacylglyceryl transfer.
          - source_id: file:BACSU/lgt/lgt-ai-review.yaml
            statement: The B. subtilis lgt review accepts GO:0008961 on loss-of-function evidence in a
              monoderm.
        processes:
        - preferred_term: lipoprotein biosynthetic process
          term:
            id: GO:0042158
            label: lipoprotein biosynthetic process
        role_description: First committed lipidation step; creates the diacylglyceryl prolipoprotein substrate
          required by LspA.
  - order: 2
    role: Signal peptide cleavage from diacylglyceryl-prolipoprotein
    node:
      id: lspa_signal_peptide_cleavage_step
      label: LspA signal peptide cleavage
      module_type: REACTION
      description: LspA/signal peptidase II removes the signal peptide immediately N-terminal to the diacylglyceryl-modified
        lipobox cysteine.
      annotons:
      - id: lspa_signal_peptidase_ii
        label: 'LspA family: signal peptidase II'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: lipoprotein signal peptidase family
            term:
              id: PANTHER:PTHR33695
              label: LIPOPROTEIN SIGNAL PEPTIDASE
            representative_members:
            - preferred_term: lspA (PSEPK exemplar)
              term:
                id: UniProtKB:Q88Q91
                label: Lipoprotein signal peptidase
              description: Pseudomonas putida KT2440 UPA00665 exemplar.
            - preferred_term: lspA (ECOLI exemplar)
              term:
                id: UniProtKB:P00804
                label: Lipoprotein signal peptidase
              description: Escherichia coli K-12 reviewed LspA exemplar.
            - preferred_term: lspA (BACSU exemplar)
              term:
                id: UniProtKB:Q45479
                label: Lipoprotein signal peptidase
              description: Bacillus subtilis 168 monoderm SPase II; catalytic Asp-102/Asp-129 defined
                by mutagenesis.
            ancestral_nodes:
            - preferred_term: PAINT node PTN002134743
              term:
                id: PANTHER:PTN002134743
                label: PTN002134743
              description: Family-root PAINT IBD node (Bacteria) supporting GO:0004175, seeded by E. coli
                and P. aeruginosa LspA; refined to GO:0004190 at the annoton.
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN002134743 in PTHR33695.
        function:
          preferred_term: aspartic-type endopeptidase activity
          term:
            id: GO:0004190
            label: aspartic-type endopeptidase activity
          evidence:
          - source_id: file:PSEPK/lspA/lspA-ai-review.yaml
            statement: The lspA review accepts GO:0004190 as the currently available broad molecular function
              and proposes a more specific lipoprotein signal peptidase activity term.
          - source_id: file:ECOLI/lspA/lspA-ai-review.yaml
            statement: The E. coli lspA review accepts GO:0004190 as the currently available molecular
              function for signal-peptidase-II cleavage and proposes a more specific lipoprotein signal
              peptidase activity term.
          - source_id: file:BACSU/lspA/lspA-ai-review.yaml
            statement: The B. subtilis lspA review accepts GO:0004190 from catalytic-aspartate mutagenesis
              of the monoderm enzyme.
        processes:
        - preferred_term: lipoprotein biosynthetic process
          term:
            id: GO:0042158
            label: lipoprotein biosynthetic process
        role_description: Ordered middle step; acts only after Lgt lipidation and, where present, before
          terminal N-acylation by Lnt.
  - order: 3
    role: Terminal N-acylation of apolipoprotein
    node:
      id: lnt_n_acylation_step
      label: Lnt N-acylation
      module_type: REACTION
      description: Lnt transfers an acyl chain from a glycerophospholipid donor to the N-terminal cysteine
        amino group of a diacylglyceryl apolipoprotein.
      annotons:
      - id: lnt_n_acyltransferase
        label: 'Lnt family: apolipoprotein N-acyltransferase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: apolipoprotein N-acyltransferase family
            term:
              id: PANTHER:PTHR38686
              label: APOLIPOPROTEIN N-ACYLTRANSFERASE
            representative_members:
            - preferred_term: lnt (PSEPK exemplar)
              term:
                id: UniProtKB:Q88DN4
                label: Apolipoprotein N-acyltransferase
              description: Pseudomonas putida KT2440 UPA00666 exemplar.
            - preferred_term: lnt (ECOLI exemplar)
              term:
                id: UniProtKB:P23930
                label: Apolipoprotein N-acyltransferase
              description: Escherichia coli K-12 reviewed Lnt exemplar.
            ancestral_nodes:
            - preferred_term: PAINT node PTN002214718
              term:
                id: PANTHER:PTN002214718
                label: PTN002214718
              description: PAINT IBD node seeded by E. coli Lnt supporting plasma membrane and lipoprotein
                biosynthetic process; no molecular-function IBD exists for Lnt.
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN002214718 in PTHR38686.
        function:
          preferred_term: apolipoprotein N-acyltransferase activity
          term:
            id: GO:0016747
            label: acyltransferase activity, transferring groups other than amino-acyl groups
          evidence:
          - source_id: file:PSEPK/lnt/lnt-uniprot.txt
            statement: UniProt assigns Q88DN4 to EC 2.3.1.269 and Rhea:RHEA:48228 for terminal N-acylation
              of diacylglyceryl lipoprotein.
          - source_id: file:ECOLI/lnt/lnt-ai-review.yaml
            statement: The E. coli lnt review accepts the best current GO acyltransferase parent for EC
              2.3.1.269 and proposes a specific apolipoprotein N-acyltransferase activity term.
        processes:
        - preferred_term: lipoprotein biosynthetic process
          term:
            id: GO:0042158
            label: lipoprotein biosynthetic process
        role_description: Terminal diderm lipoprotein-maturation step; creates the triacylated lipoprotein
          that is handed to the Lol sorting system.
    optional: true
    notes: 'Optional, lineage-restricted step: present in Proteobacteria and other diderms (and fused
      to Ppm1 in actinobacteria), absent from Firmicutes such as B. subtilis, which have no member in the cached PTHR38686
      member inventory.'
  connections:
  - source: lgt_diacylglyceryl_transfer_step
    target: lspa_signal_peptide_cleavage_step
    connection_type: PRECEDES
  - source: lspa_signal_peptide_cleavage_step
    target: lnt_n_acylation_step
    connection_type: PRECEDES
  knowledge_gaps:
  - gap_statement: It is unknown whether P. putida KT2440 Lgt, LspA and Lnt match their E. coli orthologs in kinetics, substrate repertoire and essentiality; their assignments rest on HAMAP rules, conserved catalytic residues and characterized E. coli and B. subtilis orthologs rather than KT2440 experiments.
    boundary: Treat the module as satisfiable in PSEPK, but do not claim KT2440-specific kinetics, essentiality,
      or substrate repertoire without new experiments.
    gap_kind:
    - BIOLOGY
  - gap_statement: In Lnt-less monoderms the extent and enzymology of lipoprotein N-terminal modification
      is incompletely known; whether B. subtilis lipoproteins are N-acylated, and by which enzyme, is
      not established by the evidence used here.
    boundary: Do not force Lnt or an Lnt-family selector onto monoderm instantiations; model any non-orthologous
      N-acylation as a separate variant once characterized.
    gap_kind:
    - BIOLOGY
scope: CONCRETE
