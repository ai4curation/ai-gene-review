  connections:
    - source: nuclear_envelope_motor_coupling
      target: dynein_lis1_nude_motor
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Envelope anchors (nesprin-2, BICD2, CENPF-NDE1/NDEL1) attach dynein to
        the nucleus, so that minus-end motility is converted into nuclear
        translocation.
    - source: perinuclear_microtubule_track
      target: dynein_lis1_nude_motor
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The DCX-stabilized, centrosome-anchored microtubule cage is the track
        along which dynein pulls the nucleus.
    - source: nuclear_envelope_motor_coupling
      target: basal_kinesin_nuclear_transport
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Basal movement also requires the motor to be attached to the nucleus.
        Nesprin-2 binds kinesin as well as dynein, but whether KIF1A itself is
        anchored through the LINC complex has not been established.
    - source: cdk5_nudel_regulation
      target: dynein_lis1_nude_motor
      description: >-
        CDK5/p35 phosphorylates NDEL1 within the LIS1-NDEL1-dynein module;
        direction of effect not asserted.
