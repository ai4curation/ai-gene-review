    - order: 2
      role: minus-end-directed force generation pulling the nucleus toward the centrosome
      node:
        id: dynein_lis1_nude_motor
        label: Dynein-dynactin-LIS1-NDEL1 nuclear motor
        module_type: PROTEIN_COMPLEX
        description: >-
          Cytoplasmic dynein, activated by dynactin and regulated by LIS1 and
          its NudE-family partners NDEL1/NDE1, walks toward microtubule minus
          ends anchored at the centrosome and so pulls the envelope-coupled
          nucleus forward. The same motor drives apical (G2) interkinetic
          nuclear migration in progenitors. LIS1 and dynein also act at the
          leading-process swelling to advance the centrosome, a separable
          centrokinesis role outside this module.
        concepts:
          - preferred_term: cytoplasmic dynein complex
            term:
              id: GO:0005868
              label: cytoplasmic dynein complex
        annotons:
