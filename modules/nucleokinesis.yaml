                        term:
                          id: UniProtKB:Q15078
                          label: Cyclin-dependent kinase 5 activator 1
                    role: kinase activator subunit
                    function:
                      preferred_term: cyclin-dependent protein serine/threonine kinase activator activity
                      term:
                        id: GO:0061575
                        label: cyclin-dependent protein serine/threonine kinase activator activity
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: NDEL1
            evidence:
              - source_id: PMID:11163260
                title: "NUDEL is a novel Cdk5 substrate that associates with LIS1 and cytoplasmic dynein."
                supporting_text: >-
                  Furthermore, NUDEL is a substrate of Cdk5, a kinase known to be
                  critical during neuronal migration.
              - source_id: PMID:11163259
                supporting_text: >-
                  NUDEL is phosphorylated by Cdk5/p35, a complex essential for
