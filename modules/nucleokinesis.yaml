                label: minus-end-directed microtubule motor activity
              description: >-
                Motor activity resides in the dynein heavy chain; dynactin,
                LIS1 and NDEL1/NDE1 regulate it.
            processes:
              - preferred_term: nuclear migration along microtubule
                term:
                  id: GO:0030473
                  label: nuclear migration along microtubule
              - preferred_term: interkinetic nuclear migration
                term:
                  id: GO:0022027
                  label: interkinetic nuclear migration
            locations:
              - preferred_term: perinuclear region of cytoplasm
                term:
                  id: GO:0048471
                  label: perinuclear region of cytoplasm
              - preferred_term: centrosome
                term:
                  id: GO:0005813
                  label: centrosome
            evidence:
              - source_id: PMID:15473966
                title: "Ndel1 operates in a common pathway with LIS1 and cytoplasmic dynein to regulate cortical neuronal positioning."
                supporting_text: >-
                  These results provide strong evidence that Ndel1 interacts with
                  LIS1 to sustain the function of dynein, which in turn impacts
                  microtubule organization, nuclear translocation, and neuronal
                  positioning.
              - source_id: PMID:11163259
                title: "A LIS1/NUDEL/cytoplasmic dynein heavy chain complex in the developing and adult nervous system."
                supporting_text: >-
                  Here, we demonstrate that LIS1 directly interacts with the
                  cytoplasmic dynein heavy chain (CDHC) and NUDEL, a murine
                  homolog of the Aspergillus nidulans nuclear migration mutant
                  NudE.
              - source_id: PMID:21037580
                title: "Kinesin 3 and cytoplasmic dynein mediate interkinetic nuclear migration in neural stem cells."
                supporting_text: >-
                  RNAi directed against cytoplasmic dynein specifically inhibited
                  nuclear movement toward the apical surface.
              - source_id: PMID:16144905
                title: "LIS1 RNA interference blocks neural stem cell division, morphogenesis, and motility at multiple stages."
                supporting_text: >-
                  These results identify multiple distinct and novel roles for
                  LIS1 in nucleokinesis and process dynamics
              - source_id: PMID:20007476
                title: "Distinct dose-dependent cortical neuronal migration and neurite extension defects in Lis1 and Ndel1 mutant mice."
                supporting_text: >-
                  Complete loss of Lis1 or Ndel1 resulted in the total inhibition
                  of nuclear movement in cortical slice assays
              - source_id: PMID:27553190
                title: "Severe NDE1-mediated microcephaly results from neural progenitor cell cycle arrests at multiple specific stages."
                statement: >-
                  NDE1, not NDEL1, is required for apical interkinetic nuclear
                  migration in rat radial glia, while both act in postmitotic
                  neuronal migration.
                supporting_text: >-
                  RNAi against the NDE1 paralogue NDEL1 has no such effects.
                  However, NDEL1 overexpression can functionally compensate for
                  NDE1, except at the G2-to-M transition, revealing a unique NDE1
                  role. In contrast, NDE1 and NDEL1 RNAi have comparable effects
                  on postmitotic neuronal migration.
              - source_id: PMID:38194050
                title: "Novel lissencephaly-associated NDEL1 variant reveals distinct roles of NDE1 and NDEL1 in nucleokinesis and human cortical malformations."
                statement: >-
                  A human lissencephaly NDEL1 variant (p.R105P) that cannot bind
                  LIS1 disrupts nucleus-centrosome coupling.
                supporting_text: >-
                  Remarkably, p.R105P expression alone strongly disrupted neuronal
                  migration, increased the length of the leading process, and
                  impaired nucleus-centrosome coupling, suggesting a failure in
                  nucleokinesis. Mechanistically, p.R105P disrupted NDEL1 binding
                  to the dynein regulator LIS1.
              - source_id: DOI:10.64898/2026.06.09.730088
                statement: >-
                  Preprint: dynein inhibition (ciliobrevin D; tissue-specific
                  dynamitin) blocks nuclear translocation of confined trunk
                  neural crest cells in zebrafish.
                supporting_text: >-
                  Using pharmacological and genetic approaches, we discover that
                  dynein-dependent pulling forces enable nucleus translocation
                  through confinement.
    - order: 3
      role: perinuclear microtubule track linking the nucleus to the centrosome
      node:
        id: perinuclear_microtubule_track
        label: DCX-stabilized perinuclear microtubule cage
        module_type: BIOLOGICAL_PROCESS
        description: >-
          A centrosome-nucleated microtubule array forms a perinuclear cage
          whose minus ends converge on the centrosome ahead of the nucleus. The
          neuronal microtubule-associated protein doublecortin decorates and
          stabilizes these microtubules, keeping the nucleus coupled to the
          advancing centrosome. DCX co-immunoprecipitates with dynein in mouse
          neurons, possibly through LIS1; this is recorded as an association,
          not a direct function.
        concepts:
          - preferred_term: microtubule cytoskeleton organization
            term:
              id: GO:0000226
              label: microtubule cytoskeleton organization
        annotons:
          - id: dcx_perinuclear_microtubule_stabilizer
            label: Doublecortin perinuclear microtubule stabilizer
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DCX (doublecortin)
                term:
                  id: UniProtKB:O43602
                  label: Neuronal migration protein doublecortin
            function:
              preferred_term: microtubule binding
              term:
                id: GO:0008017
                label: microtubule binding
            locations:
              - preferred_term: perinuclear region of cytoplasm
                term:
                  id: GO:0048471
                  label: perinuclear region of cytoplasm
            role_description: >-
              Binds and stabilizes the microtubules running from the
              perinuclear cage to the centrosome; its overexpression rescues
              the nucleus-centrosome coupling defect of Lis1+/- neurons.
            evidence:
              - source_id: PMID:15173193
                supporting_text: >-
                  Dcx outlined microtubules extending from the perinuclear
                  "cage" to the centrosome.
              - source_id: PMID:15173193
                supporting_text: >-
                  These N-C coupling defects were rescued by Dcx overexpression,
                  and Dcx was found to complex with dynein.
        evidence:
          - source_id: DOI:10.64898/2026.06.09.730088
            statement: >-
              Preprint: in confined neural crest cells the microtubule array
              reorganizes into a centrosome-associated bundle ahead of the
              nucleus that pulls on it (shown by laser ablation), a non-neuronal
              instance of the centrosome-anchored track. DCX is neuron-specific
              and was not examined.
            supporting_text: >-
              Under confinement, tNC cells reorganize their microtubules from a
              perinuclear meshwork into a polarized, centrosome-associated bundle
              positioned ahead of the nucleus.
    - order: 4
      role: actomyosin contraction at the rear of the soma assisting forward nuclear movement
      optional: true
      node:
        id: rear_actomyosin_contraction
        label: Rear actomyosin contraction
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Non-muscle myosin II accumulates behind the nucleus and its
          contraction pushes or squeezes the nucleus forward. Its contribution
          is cell-type dependent: it is prominent in tangentially migrating MGE
          interneurons and in zebrafish retinal interkinetic nuclear migration,
          and assists dynein in radially migrating cortical neurons; in
          cerebellar granule neurons myosin II in the leading process has also
          been proposed to pull the centrosome and soma forward. By contrast,
          dynein-driven nucleokinesis of confined trunk neural crest cells
          proceeds without Rho/ROCK/myosin II contractility (preprint
          evidence), consistent with this part being optional. Which paralog
          supplies the force is not resolved: the neuronal evidence comes
          mostly from inhibitors (blebbistatin) that block all non-muscle
          myosin II paralogs. MYH10 (IIB) carries neuron-migration evidence
          from mouse mutants. MYH9 (IIA)-specific nucleokinesis evidence comes
          from migrating dendritic cells rather than neurons.
        annotons:
          - id: nonmuscle_myosin_ii_contraction
            label: Non-muscle myosin II rear contraction
            participant:
              selector_type: FAMILY
              family:
                preferred_term: non-muscle myosin II heavy chains
                term:
                  id: PANTHER:PTHR45615
                  label: MYOSIN HEAVY CHAIN, NON-MUSCLE
                representative_members:
                  - preferred_term: MYH10 (non-muscle myosin IIB)
                    term:
                      id: UniProtKB:P35580
                      label: Myosin-10
                  - preferred_term: MYH9 (non-muscle myosin IIA)
                    term:
                      id: UniProtKB:P35579
                      label: Myosin-9
            function:
              preferred_term: microfilament motor activity
              term:
                id: GO:0000146
                label: microfilament motor activity
            role_description: >-
              Actomyosin contraction at the cell rear; pharmacological myosin II
              inhibition (blebbistatin) blocks forward nuclear translocation.
              The representative members are listed without implying which
              paralog acts in a given neuron.
            evidence:
              - source_id: PMID:15958735
                title: "Nucleokinesis in tangentially migrating neurons comprises two alternating phases: forward migration of the Golgi/centrosome associated with centrosome splitting and myosin contraction at the rear."
                supporting_text: >-
                  Because myosin II accumulates at the rear of migrating MGE
                  cells, actomyosin contraction likely plays a prominent role to
                  drive forward translocations of the nucleus toward the
                  centrosome.
              - source_id: PMID:16174753
                title: "Cytoskeletal coordination during neuronal migration."
                supporting_text: >-
                  Time-lapse imaging and pharmacological perturbation suggest
                  that nucleokinesis requires stepwise or hierarchical
                  interactions between microtubules, myosin II, and cell
                  adhesion.
              - source_id: PMID:19766571
                title: "Actomyosin is the main driver of interkinetic nuclear migration in the retina."
                supporting_text: >-
                  We also show that IKNM is driven largely by actomyosin-dependent
                  forces as it still occurs when the microtubule cytoskeleton is
                  compromised but is blocked when MyosinII activity is inhibited.
              - source_id: PMID:19607793
                title: "Myosin II motors and F-actin dynamics drive the coordinated movement of the centrosome and soma during CNS glial-guided neuronal migration."
                supporting_text: >-
                  Inhibition of Myosin II decreased the speed of centrosome and
                  somal movement, whereas Myosin II activation increased
                  coordinated movement.
              - source_id: DOI:10.64898/2026.06.09.730088
                statement: >-
                  Counter-example (preprint): confined neural crest
                  nucleokinesis does not require ROCK/myosin II.
                supporting_text: >-
                  Strikingly, this process occurs independently of
                  Rho/ROCK/myosin II–mediated contractility
    - order: 5
