    - order: 6
      role: CDK5/p35 phosphorylation of NDEL1 linking migration signaling to the dynein machinery
      optional: true
      node:
        id: cdk5_nudel_regulation
        label: CDK5/p35 regulation of NDEL1
        module_type: REGULATORY_STEP
        description: >-
          The neuron-specific kinase complex CDK5/p35, itself essential for
          neuronal migration, phosphorylates NDEL1 and so modulates the
          LIS1-NDEL1-dynein machinery in postmitotic neurons; NDE1 is also a
          CDK5 substrate relevant to neuronal lamination. This is distinct from
          the CDK1 regulation that times nuclear-pore dynein recruitment in G2
          progenitors (see the nuclear-pore route). The mechanistic consequence
          of NDEL1/NDE1 phosphorylation for dynein force production is not
          settled, so the sign of the regulation is not asserted here.
