                              label: Nuclear distribution protein nudE-like 1
                          - preferred_term: NDE1
                            term:
                              id: UniProtKB:Q9NXR1
                              label: Nuclear distribution protein nudE homolog 1
                    role: >-
                      tethers LIS1 to dynein, sustaining dynein function in
                      nuclear translocation; NDE1 predominates in progenitors
                      (apical interkinetic migration) and NDEL1 in postmitotic
