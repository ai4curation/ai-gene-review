  connections:
    - source: epd_step
      target: pdxB_step
      connection_type: PRECEDES
    - source: pdxB_step
      target: serC_step
      connection_type: PRECEDES
    - source: serC_step
      target: pdxA_step
      connection_type: PRECEDES
    - source: pdxA_step
      target: pdxJ_step
      connection_type: PRECEDES
    - source: pdxJ_step
      target: pdxH_step
      connection_type: PRECEDES
  notes: >-
    The module is defined by reaction chemistry. E. coli K-12, where the
    pathway was worked out biochemically, supplies the characterized exemplar
    for every step, and Pseudomonas putida KT2440 is kept as a second
    gammaproteobacterial instance. The route is lineage-restricted (a subset of
    eubacteria, chiefly Gammaproteobacteria), so no exemplars from other
    domains are added. All molecular functions are on leaf annotons, and no
    generic localization is asserted.

    Epd and SerC are recruited from central metabolism, and PdxH also acts in
    vitamin-B6 salvage. GapA can partly substitute for Epd in E. coli (only
    gapA epd double mutants are pyridoxine auxotrophs), but GapA is not an Epd
    family member and is not modeled as a part. DXP supply is an upstream
    input rather than an extra module part. The DXP-independent PdxS/PdxT
    route and vitamin-B6 salvage are outside this module boundary.

    GO has no molecular-function term for the SerC phosphohydroxythreonine
    transamination (RHEA:16573). The serC step is grounded on the parent
    GO:0008483 transaminase activity rather than on GO:0004648, which defines
    the separate phosphoserine reaction; the SerC gene reviews carry a proposed
    phosphohydroxythreonine aminotransferase term.

    Family notes: Epd and PdxB sit in PANTHER families that mix them with
    GAPDHs (PTHR43148) and formate dehydrogenases (PTHR42938 SF9), and P. putida
    Epd has no PANTHER subfamily assignment, so those two steps use the
    Epd-specific NCBIfam and PdxB-specific InterPro families. SerC, PdxA,
    PdxJ and PdxH use PANTHER subfamilies whose family reviews cover both
    representatives.
