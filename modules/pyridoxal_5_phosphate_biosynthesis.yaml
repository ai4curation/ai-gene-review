            function:
              preferred_term: phosphohydroxythreonine aminotransferase activity
              term:
                id: GO:0008483
                label: transaminase activity
              notes: >-
                GO has no term for the phosphohydroxythreonine reaction
                (RHEA:16573). The parent GO:0008483 is true of it and is used
                instead of misusing GO:0004648, which defines SerC's distinct
                phosphoserine reaction. The exact chemistry is carried by the
                Rhea and EC evidence below.
              substrates:
                - preferred_term: (R)-3-hydroxy-2-oxo-4-phosphooxybutanoate
                - preferred_term: L-glutamate
              products:
