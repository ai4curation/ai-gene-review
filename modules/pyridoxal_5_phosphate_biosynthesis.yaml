id: MODULE:pyridoxal_5_phosphate_biosynthesis
title: DXP-dependent de novo pyridoxal 5'-phosphate biosynthesis
description: >-
  De novo synthesis of pyridoxal 5'-phosphate (PLP, vitamin B6) through the
  DXP-dependent bacterial pathway. One branch converts D-erythrose 4-phosphate
  to 3-amino-2-oxopropyl phosphate through Epd, PdxB, SerC, and PdxA. PdxJ then
  condenses this product with the shared metabolite 1-deoxy-D-xylulose
  5-phosphate (DXP) to form pyridoxine 5'-phosphate, and PdxH performs the
  terminal oxidation to PLP. DXP production is shared with thiamine and
  isoprenoid metabolism and is outside this module boundary. The route is
  restricted to a subset of eubacteria, most prominently the
  Gammaproteobacteria. The alternative DXP-independent PdxS/PdxT pathway and
  vitamin-B6 salvage are separate modules.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0036001
    title: "'de novo' pyridoxal 5'-phosphate biosynthetic process"
    statement: >-
      The module is grounded in the GO biological process for de novo PLP
      biosynthesis.
  - source_id: UniPathway:UPA00244
    title: Pyridoxine 5'-phosphate biosynthesis
    statement: >-
      UniPathway orders the Epd/PdxB/SerC/PdxA/PdxJ branch that forms pyridoxine
      5'-phosphate from D-erythrose 4-phosphate and DXP.
  - source_id: file:modules/pyridoxal_5_phosphate_biosynthesis-deep-research-openscientist.md
    title: OpenScientist review of DXP-dependent de novo PLP biosynthesis
    statement: >-
      Independent retrieval supports the fixed Epd-PdxB-SerC-PdxA-PdxJ-PdxH
      sequence and treats DXP supply, vitamin-B6 salvage, and the non-homologous
      PdxS/PdxT route as separate biological systems.
  - source_id: file:interpro/panther/PTHR43148/PTHR43148-review.yaml
    title: PTHR43148 family review (Epd and type I GAPDH-like enzymes)
    statement: >-
      Epd (SF3) diverged from the GAPDHs of this family; the root GAPDH-activity
      and glucose-metabolism PAINT nodes need pruning for SF3.
  - source_id: file:interpro/panther/PTHR42938/PTHR42938-review.yaml
    title: PTHR42938 family review (D-isomer 2-hydroxyacid dehydrogenases)
    statement: >-
      PdxB sits in the mixed SF9 with eukaryotic formate dehydrogenases, so the
      PdxB-specific InterPro family is used for the module selector.
  - source_id: file:interpro/panther/PTHR43247/PTHR43247-review.yaml
    title: PTHR43247 family review (phosphoserine aminotransferases)
    statement: >-
      SerC/PSAT family; bacterial SerC also carries out the PLP-pathway
      phosphohydroxythreonine transamination.
  - source_id: file:interpro/panther/PTHR30004/PTHR30004-review.yaml
    title: PTHR30004 family review (PdxA and paralogs)
    statement: >-
      PdxA activity is scoped to SF5; SF6 and SF3 mix PdxA with PdxA2, TphB
      and ClxD paralogs.
  - source_id: file:interpro/panther/PTHR30456/PTHR30456-review.yaml
    title: PTHR30456 family review (PdxJ)
    statement: A single coherent PdxJ subfamily with a bacterial-root PAINT node.
  - source_id: file:interpro/panther/PTHR10851/PTHR10851-review.yaml
    title: PTHR10851 family review (PdxH/PNPO)
    statement: >-
      PNP/PMP oxidase activity holds for SF0 apart from three PhzG-type phenazine
      synthases.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The deterministic pathway partition supplies the PSEPK accessions and
      locus tags used for the six pathway-instance exemplars.
module:
