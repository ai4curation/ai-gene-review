  notes: >-
    The reusable module is defined by reaction chemistry and uses reviewed
    cross-species UniProt exemplars. All molecular functions are on leaf
    annotons, and no generic localization is asserted. Epd and SerC are
    shared-metabolism enzymes, PdxH also supports salvage, and DXP supply is an
    upstream input rather than an extra module part. The DXP-independent
    PdxS/PdxT route and vitamin-B6 salvage are outside this module boundary.
