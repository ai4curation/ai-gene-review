  notes: >-
    Arabidopsis exemplars ground each step; field pennycress TFP (G1FNI6) grounds the thiocyanate route.
    Pennycress seed is dominated by allylglucosinolate (sinigrin), which requires one elongation turn
    and a functional AOP2. The domestication work reducing pennycress seed glucosinolate targets the regulators
    MYB28 and MYC3 (PMID:41578087), which are outside this module. Obsolete GO terms avoided: GO:0033506
    (glucosinolate biosynthesis from homomethionine), GO:0103092/GO:0103093 (methylthioalkylmalate isomerase/dehydrogenase),
    GO:0103096 (CYP79F1 dihomomethionine monooxygenase). CYP83A1 and AOP2 have no reaction-specific GO
    term. All Arabidopsis exemplars have completed gene reviews (genes/ARATH/<GENE>/); annoton locations
    follow their core functions. Several exemplars have roles outside this module that are recorded only
    in their reviews: BCAT3 and IMDH1 in leucine biosynthesis, GGP1 in glutathione catabolism and camalexin
    biosynthesis, and TGG1 in stomatal regulation.
  knowledge_gaps:
    - gap_statement: >
        GSTU20 and GSTF11 are implicated in glutathione conjugation of the CYP83A1 product by mutant phenotypes,
        but their activity on the native intermediate has not been shown biochemically. No GO term captures
        the CYP83A1 or AOP2 reactions.
