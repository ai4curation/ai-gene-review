  notes: 'Arabidopsis exemplars ground each step; field pennycress TFP (G1FNI6) grounds the thiocyanate
    route. Pennycress seed is dominated by allylglucosinolate (sinigrin), which requires one elongation
    turn and a functional AOP2. The domestication work reducing pennycress seed glucosinolate targets
    the regulators MYB28 and MYC3 (PMID:41578087), which are outside this module. Obsolete GO terms avoided:
    GO:0033506 (glucosinolate biosynthesis from homomethionine), GO:0103092/GO:0103093 (methylthioalkylmalate
    isomerase/dehydrogenase), GO:0103096 (CYP79F1 dihomomethionine monooxygenase). CYP83A1 and AOP2 have
    no reaction-specific GO term. All Arabidopsis exemplars have completed gene reviews (genes/ARATH/<GENE>/);
    annoton locations follow their core functions. Several exemplars have roles outside this module that
    are recorded only in their reviews: BCAT3 and IMDH1 in leucine biosynthesis, GGP1 in glutathione catabolism
    and camalexin biosynthesis, and TGG1 in stomatal regulation.'
  knowledge_gaps:
  - gap_statement: 'The enzyme(s) that conjugate the CYP83A1 product to glutathione in aliphatic glucosinolate
      biosynthesis are not biochemically established, nor is it known how much of the conjugation is enzymatic.

      '
    boundary: GSTU20 and GSTF11 contribute to aliphatic glucosinolate accumulation; the double mutant
      has a stronger reduction. These phenotypes do not directly measure native CYP83A1-intermediate conjugation
      or establish universal necessity.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Determines whether GSTU20/GSTF11 can be annotated as performing this step rather than
      only being required for it.
    resolution: Assay recombinant GSTU20 and GSTF11 with CYP83A1-generated intermediate and glutathione,
      and test whether gst mutants accumulate the aldoxime or its non-glutathione products.
    provenance:
    - reference_id: PMID:35145536
      supporting_text: have been recently postulated to act in GSL biosynthesis, molecular evidence is
        lacking
  - gap_statement: The native conjugate-processing transition from GGP products to SUR1 substrates remains
      incompletely resolved.
    boundary: GGP produces a cysteinylglycine conjugate. The 2011 study explicitly leaves Cys-Gly versus
      Cys substrates of SUR1 unresolved; later pathway drawings alone do not establish a missing peptidase
      or direct handoff.
    gap_kind:
    - BIOLOGY
    status: OPEN
    provenance:
    - reference_id: PMID:21712415
notes: Taxon and reaction scope are evidence-bounded. Thlaspi members include co-orthologs and incomplete
  models; sequence similarity is not direct target chemistry. Exact specialized MF terms are lacking for
  several steps (CYP83A1, AOP2, IPMDH1, terminal elongated-Met transamination); free-text activities or
  accurate broader terms are used rather than substrate-mismatched GO IDs. GST native conjugation and
  GGP-to-SUR1 conjugate processing remain biological gaps. Family memberships and all 35 individual member
  reviews have been checked, including a direct Brassica MAM exemplar and nine inferred Thlaspi proteins.
  Full repository validation and PR review remain outstanding.
