  - preferred_term: glucosinolate catabolic process
    term:
      id: GO:0019762
      label: glucosinolate catabolic process
    description: Damage-triggered myrosinase hydrolysis and specifier-protein product diversification.
  context:
    taxa:
    - preferred_term: Brassicaceae
      term:
        id: NCBITaxon:3700
        label: Brassicaceae
      description: Evidence envelope for chain-elongated methionine glucosinolates, with characterized
        Arabidopsis and Thlaspi implementations and comparative Brassica evidence. It does not assert
        universal presence of each branch. Reports of chain-elongated methionine glucosinolates outside
        this family remain unconfirmed in the 2025 critical review.
    evidence:
    - source_id: DOI:10.1016/j.bse.2025.105033
      statement: The critical review concludes that chain-elongated methionine glucosinolates are conclusively
        known in Brassicaceae; scattered reports outside the family require independent confirmation.
  parts:
  - order: 1
    role: methionine side-chain elongation
    node:
      id: chain_elongation
      label: Methionine chain-elongation cycle
      module_type: METABOLIC_PATHWAY
      description: A cycle recruited from leucine biosynthesis that adds one methylene group per turn
        to methionine. The deamination is cytosolic; the condensation, isomerization, oxidative decarboxylation
        and terminal transamination run in the chloroplast. The number of turns (set mainly by MAM paralogs)
        determines side-chain length; one turn yields homomethionine, the precursor of C3 (propyl/allyl)
        glucosinolates.
      parts:
      - order: 1
        role: deamination of methionine
        node:
          id: met_deamination
          label: Methionine deamination (BCAT4)
          module_type: REACTION
          annotons:
          - id: bcat4_activity
            label: 'BCAT4: methionine:oxo-acid transaminase'
            participant:
              selector_type: FAMILY
              family:
                preferred_term: BCAT4 methionine aminotransferase subfamily
                term:
                  id: PANTHER:PTHR42825:SF8
                  label: METHIONINE AMINOTRANSFERASE BCAT4
                representative_members:
                - preferred_term: BCAT4 (Arabidopsis)
                  term:
                    id: UniProtKB:Q9LE06
                    label: Methionine aminotransferase BCAT4
                - preferred_term: TAV2_LOCUS10345 (Thlaspi arvense; inferred homolog)
                  term:
                    id: UniProtKB:A0AAU9S298
                    label: Branched-chain-amino-acid transaminase
                  description: Sequence-based pathway exemplar; target function and chloroplast/cytosol
                    localization are inferred from homolog evidence, not directly assayed in Thlaspi.
            function:
              preferred_term: L-methionine:oxo-acid transaminase activity
              term:
                id: GO:0010326
                label: L-methionine:oxo-acid transaminase activity
              substrates:
              - preferred_term: L-methionine
              products:
              - preferred_term: 4-methylthio-2-oxobutanoate
              evidence:
              - source_id: PMID:17056707
                statement: BCAT4 knockout reduces Met-derived glucosinolates by about half; recombinant
                  BCAT4 deaminates Met.
                supporting_text: strongly implicate BCAT4 in catalysis of the initial deamination of Met
                  to 4-methylthio-2-oxobutyrate
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
      - order: 2
        role: condensation with acetyl-CoA
        node:
