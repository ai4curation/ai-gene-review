            node:
              id: s_glucosylation
              label: Thiohydroximate S-glucosyltransferase (UGT74C1/UGT74B1)
              module_type: REACTION
              annotons:
                - id: ugt74_activity
                  label: "UGT74C1: thiohydroximate S-glucosyltransferase (aliphatic)"
