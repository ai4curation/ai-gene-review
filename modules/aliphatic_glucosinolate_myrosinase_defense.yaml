id: MODULE:aliphatic_glucosinolate_myrosinase_defense
title: Aliphatic glucosinolate biosynthesis and myrosinase activation (glucosinolate-myrosinase 
  defense system)
description: >-
  The glucosinolate-myrosinase system is the two-component chemical defense of the Brassicales.
  Methionine-derived (aliphatic) glucosinolates are made in three phases: (1) side-chain elongation, a
  plastidial cycle recruited from leucine biosynthesis in which methionine is deaminated to its 2-oxo
  acid
  (BCAT4), condensed with acetyl-CoA (MAM), isomerized (IPMI), oxidatively decarboxylated (IPMDH1) and
  transaminated back to a chain-elongated methionine homolog (BCAT3), each turn adding one methylene
  group; (2) formation of the core glucosinolate structure, in which CYP79F converts the chain-elongated
  amino acid to an aldoxime, CYP83A1 activates the aldoxime for glutathione conjugation, the conjugate
  is
  trimmed by gamma-glutamyl peptidase (GGP1) and cleaved by the C-S lyase SUR1 to a thiohydroximate,
  which is S-glucosylated (UGT74C1/UGT74B1) and finally sulfated from PAPS by desulfoglucosinolate
  sulfotransferases (SOT16-18); and (3) side-chain modification, in which flavin monooxygenases
  (FMO GS-OX) S-oxygenate methylthioalkyl to methylsulfinylalkyl glucosinolates and the
  2-oxoglutarate-dependent dioxygenase AOP2 converts these to alkenyl glucosinolates such as
  allylglucosinolate (sinigrin). The intact glucosinolate is biologically inert. On tissue damage,
  thioglucosidases (myrosinases, TGG1/TGG2) hydrolyze it to an unstable aglucone that rearranges by
  default to an isothiocyanate; Fe(II)-dependent specifier proteins (ESP, NSPs, TFP) instead redirect
  the aglucone to epithionitriles, simple nitriles or organic thiocyanates. Natural variation at MAM,
  AOP and ESP loci accounts for much of the glucosinolate and breakdown-product diversity between
  accessions and species. Transcriptional regulation (MYB28/MYB29 with MYC2-4), glucosinolate transport
  (GTR1/GTR2), indole and aromatic glucosinolates, and sulfate activation to PAPS are outside this
  module's boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:20303821
    title: Biosynthesis of glucosinolates--gene discovery and beyond.
    statement: The biosynthetic pathway has three phases, chain elongation, core structure and 
      side-chain decoration.
    supporting_text: >-
      Recent progress includes genes in all three phases of the pathway, i.e. side-chain elongation of
      precursor amino acids, formation of the core glucosinolate structure and side-chain decoration.
  - source_id: PMID:19224919
    title: Nitrile-specifier proteins involved in glucosinolate hydrolysis in Arabidopsis thaliana.
    statement: Myrosinase hydrolysis gives isothiocyanates by default; specifier proteins divert the
      products.
    supporting_text: >-
      The degradation of glucosinolates is catalyzed by thioglucosidases called myrosinases and leads
      by
      default to the formation of isothiocyanates.
  - source_id: PMID:21783213
    title: A thiocyanate-forming protein generates multiple products upon allylglucosinolate 
      breakdown in Thlaspi arvense.
    statement: >-
      Allylglucosinolate is the major glucosinolate of field pennycress, whose specifier protein TFP
      yields allylthiocyanate and the corresponding epithionitrile.
    supporting_text: >-
      this protein promotes the formation of allylthiocyanate as well as the corresponding epithionitrile
      upon myrosinase-catalyzed hydrolysis of allylglucosinolate, the major glucosinolate of T. arvense.
  - source_id: file:THLAR/TFP/TFP-ai-review.yaml
    title: TFP gene review (field pennycress)
    statement: The thiocyanate-forming specifier step (UniProtKB:G1FNI6, GO:0016846) matches the 
      completed pennycress TFP review.
module:
  id: aliphatic_glucosinolate_myrosinase_defense
  label: Aliphatic glucosinolate-myrosinase defense system
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glucosinolate biosynthetic process
      term:
        id: GO:0019761
        label: glucosinolate biosynthetic process
      description: Formation of methionine-derived glucosinolates (phases 1-3).
    - preferred_term: glucosinolate catabolic process
      term:
        id: GO:0019762
        label: glucosinolate catabolic process
      description: Damage-triggered myrosinase hydrolysis and specifier-protein product 
        diversification.
  context:
    taxa:
      - preferred_term: Brassicales
        term:
          id: NCBITaxon:3699
          label: Brassicales
        description: Glucosinolates are restricted to the order Brassicales.
  parts:
    - order: 1
      role: methionine side-chain elongation
      node:
        id: chain_elongation
        label: Methionine chain-elongation cycle
        module_type: METABOLIC_PATHWAY
        description: >-
          A cycle recruited from leucine biosynthesis that adds one methylene group per turn to methionine.
          The deamination is cytosolic; the condensation, isomerization, oxidative decarboxylation and
          terminal transamination run in the chloroplast. The number of turns (set mainly by MAM
          paralogs) determines side-chain length; one turn yields homomethionine, the precursor of C3
          (propyl/allyl) glucosinolates.
        parts:
          - order: 1
            role: deamination of methionine
            node:
              id: met_deamination
              label: Methionine deamination (BCAT4)
              module_type: REACTION
              annotons:
                - id: bcat4_activity
                  label: "BCAT4: methionine:oxo-acid transaminase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: BCAT4 methionine aminotransferase subfamily
                      term:
                        id: PANTHER:PTHR42825:SF8
                        label: METHIONINE AMINOTRANSFERASE BCAT4
                      representative_members:
                        - preferred_term: BCAT4 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9LE06
                            label: Methionine aminotransferase BCAT4
                  function:
                    preferred_term: L-methionine:oxo-acid transaminase activity
                    term:
                      id: GO:0010326
                      label: L-methionine:oxo-acid transaminase activity
                    substrates:
                      - preferred_term: L-methionine
                    products:
                      - preferred_term: 4-methylthio-2-oxobutanoate
                    evidence:
                      - source_id: PMID:17056707
                        statement: BCAT4 knockout reduces Met-derived glucosinolates by about half; 
                          recombinant BCAT4 deaminates Met.
                        supporting_text: >-
                          strongly implicate BCAT4 in catalysis of the initial deamination of Met to
                          4-methylthio-2-oxobutyrate
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
          - order: 2
            role: condensation with acetyl-CoA
            node:
              id: mam_condensation
              label: Methylthioalkylmalate synthase (MAM)
              module_type: REACTION
              annotons:
                - id: mam_activity
                  label: "MAM1/MAM3: methylthioalkylmalate synthase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: MAM methylthioalkylmalate synthase subfamily
                      term:
                        id: PANTHER:PTHR10277:SF60
                        label: METHYLTHIOALKYLMALATE SYNTHASE 1, CHLOROPLASTIC-RELATED
                      representative_members:
                        - preferred_term: MAM1 (Arabidopsis; first two elongation cycles)
                          term:
                            id: UniProtKB:Q9FG67
                            label: Methylthioalkylmalate synthase 1, chloroplastic
                        - preferred_term: MAM3 (Arabidopsis; long-chain cycles)
                          term:
                            id: UniProtKB:Q9FN52
                            label: Methylthioalkylmalate synthase 3, chloroplastic
                  function:
                    preferred_term: methylthioalkylmalate synthase activity
                    term:
                      id: GO:0010177
                      label: methylthioalkylmalate synthase activity
                    substrates:
                      - preferred_term: omega-methylthio-2-oxoalkanoate
                      - preferred_term: acetyl-CoA
                    products:
                      - preferred_term: 2-(omega-methylthio)alkylmalate
                      - preferred_term: CoA
                    evidence:
                      - source_id: PMID:14740211
                        statement: MAM condenses an omega-methylthio-2-oxoalkanoic acid with 
                          acetyl-CoA; MAM1 runs the first two cycles.
                        supporting_text: >-
                          The first reaction of the cycle is catalyzed by a methylthioalkylmalate synthase
                          (MAMS), which condenses a omega-methylthio-2-oxoalkanoic acid with acetyl-CoA.
                  locations:
                    - preferred_term: chloroplast
                      term:
                        id: GO:0009507
                        label: chloroplast
          - order: 3
            role: isomerization
            node:
              id: ipmi_isomerization
              label: Isopropylmalate isomerase (IPMI, glucosinolate-type small subunit)
              module_type: REACTION
              annotons:
                - id: ipmi_activity
                  label: "IPMI heterodimer (LSU1 + SSU2/SSU3): 2-(omega-methylthio)alkylmalate dehydratase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: heterodimeric isopropylmalate isomerase (large subunit shared 
                        with Leu biosynthesis; specialized small subunits)
                      representative_members:
                        - preferred_term: IIL1 / LSU1 (Arabidopsis; IPMI large subunit)
                          term:
                            id: UniProtKB:Q94AR8
                            label: 3-isopropylmalate dehydratase large subunit, chloroplastic
                        - preferred_term: SSU3 (Arabidopsis; IPMI small subunit)
                          term:
                            id: UniProtKB:Q9LYT7
                            label: 3-isopropylmalate dehydratase small subunit 3
                  function:
                    preferred_term: 2-(omega-methylthio)alkylmalate dehydratase activity
                    term:
                      id: GO:0120528
                      label: 2-(omega-methylthio)alkylmalate dehydratase activity
                    substrates:
                      - preferred_term: 2-(omega-methylthio)alkylmalate
                    products:
                      - preferred_term: 3-(omega-methylthio)alkylmalate
                    evidence:
                      - source_id: PMID:19597944
                        statement: Large-subunit mutants alter aliphatic glucosinolates; small 
                          subunits specialize the enzyme for Leu or Met chain elongation.
                        supporting_text: >-
                          These results suggest the presence of different heterodimeric IPMIs in Arabidopsis
                          chloroplasts with distinct substrate specificities for Leu or glucosinolate
                          metabolism determined by the nature of the different small subunit.
                  locations:
                    - preferred_term: chloroplast stroma
                      term:
                        id: GO:0009570
                        label: chloroplast stroma
                      evidence:
                        - source_id: file:ARATH/IIL1/IIL1-ai-review.yaml
                          statement: Core-function location in the IIL1 gene review.
                  notes: Activity requires the heterodimeric 3-isopropylmalate dehydratase complex 
                    (GO:0009316); the gene reviews record each subunit as contributes_to this 
                    activity in that complex. LSU1 is shared with leucine biosynthesis (with SSU1); 
                    SSU2/SSU3 specialize the enzyme for methionine chain elongation.
          - order: 4
            role: oxidative decarboxylation
            node:
              id: ipmdh_decarboxylation
              label: Isopropylmalate dehydrogenase (IPMDH1)
              module_type: REACTION
              annotons:
                - id: ipmdh1_activity
                  label: "IPMDH1: 3-(omega-methylthio)alkylmalate dehydrogenase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: IPMDH1 subfamily
                      term:
                        id: PANTHER:PTHR42979:SF5
                        label: 3-ISOPROPYLMALATE DEHYDROGENASE 1, CHLOROPLASTIC-RELATED
                      representative_members:
                        - preferred_term: IPMDH1 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9FMT1
                            label: 3-isopropylmalate dehydrogenase 1, chloroplastic
                  function:
                    preferred_term: 3-isopropylmalate dehydrogenase activity (methylthioalkylmalate 
                      substrate)
                    term:
                      id: GO:0003862
                      label: 3-isopropylmalate dehydrogenase activity
                    substrates:
                      - preferred_term: 3-(omega-methylthio)alkylmalate
                      - preferred_term: NAD+
                    products:
                      - preferred_term: chain-elongated omega-methylthio-2-oxoalkanoate
                      - preferred_term: CO2 + NADH
                    evidence:
                      - source_id: PMID:21697089
                        statement: IPMDH1 is the glucosinolate-pathway paralog; a single active-site
                          residue shifts specificity from 3-isopropylmalate to the 
                          methylthioalkylmalate.
                        supporting_text: >-
                          three 3-isopropylmalate dehydrogenases (AtIPMDHs) play key roles in methionine
                          chain-elongation for the synthesis of aliphatic glucosinolates (e.g. AtIPMDH1)
                  notes: >-
                    GO:0103093 methylthioalkylmalate dehydrogenase activity is obsolete; the parent IPMDH
                    activity term is used.
                  locations:
                    - preferred_term: chloroplast stroma
                      term:
                        id: GO:0009570
                        label: chloroplast stroma
                      evidence:
                        - source_id: file:ARATH/IMDH1/IMDH1-ai-review.yaml
                          statement: Core-function location in the IMDH1 gene review.
          - order: 5
            role: transamination to the chain-elongated amino acid
            node:
              id: bcat3_transamination
              label: Terminal transamination (BCAT3)
              module_type: REACTION
              annotons:
                - id: bcat3_activity
                  label: "BCAT3: transamination of elongated 2-oxo acids"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: BCAT3 plastid branched-chain aminotransferase subfamily
                      term:
                        id: PANTHER:PTHR42825:SF2
                        label: BRANCHED-CHAIN-AMINO-ACID AMINOTRANSFERASE 3, CHLOROPLASTIC-RELATED
                      representative_members:
                        - preferred_term: BCAT3 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9M401
                            label: Branched-chain-amino-acid aminotransferase 3, chloroplastic
                  function:
                    preferred_term: L-methionine:oxo-acid transaminase activity (elongated homologs)
                    term:
                      id: GO:0010326
                      label: L-methionine:oxo-acid transaminase activity
                    substrates:
                      - preferred_term: chain-elongated omega-methylthio-2-oxoalkanoate
                    products:
                      - preferred_term: homomethionine / dihomomethionine
                    evidence:
                      - source_id: PMID:18162591
                        statement: BCAT3 most likely performs the terminal transaminations yielding 
                          homomethionine and dihomomethionine.
                        supporting_text: >-
                          BCAT3 most likely catalyzes the terminal steps in the chain elongation process
                          leading to short-chain glucosinolates
                  locations:
                    - preferred_term: chloroplast
                      term:
                        id: GO:0009507
                        label: chloroplast
        connections:
          - source: met_deamination
            target: mam_condensation
            connection_type: PROVIDES_INPUT_FOR
            description: 4-methylthio-2-oxobutanoate is the MAM acceptor.
          - source: mam_condensation
            target: ipmi_isomerization
            connection_type: PROVIDES_INPUT_FOR
            description: The 2-alkylmalate is isomerized by IPMI.
          - source: ipmi_isomerization
            target: ipmdh_decarboxylation
            connection_type: PROVIDES_INPUT_FOR
            description: The 3-alkylmalate is oxidatively decarboxylated by IPMDH1.
          - source: ipmdh_decarboxylation
            target: mam_condensation
            connection_type: PROVIDES_INPUT_FOR
            description: The elongated 2-oxo acid can re-enter MAM for a further turn.
          - source: ipmdh_decarboxylation
            target: bcat3_transamination
            connection_type: PROVIDES_INPUT_FOR
            description: Or it exits the cycle by transamination to the elongated methionine 
              homolog.
    - order: 2
      role: core glucosinolate structure
      node:
        id: core_structure
        label: Core glucosinolate structure formation
        module_type: METABOLIC_PATHWAY
        description: >
          Conversion of the chain-elongated methionine homolog to a desulfoglucosinolate and then to the
          intact glucosinolate.
        parts:
          - order: 1
            role: aldoxime formation
            node:
              id: aldoxime_formation
              label: CYP79F aldoxime formation
              module_type: REACTION
              annotons:
                - id: cyp79f_activity
                  label: "CYP79F1/F2: homomethionine N-monooxygenase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CYP79F cytochrome P450 subfamily
                      term:
                        id: PANTHER:PTHR24298:SF684
                        label: DIHOMOMETHIONINE N-HYDROXYLASE-RELATED
                      representative_members:
                        - preferred_term: CYP79F1 (Arabidopsis; short- and long-chain)
                          term:
                            id: UniProtKB:Q949U1
                            label: Dihomomethionine N-hydroxylase
                        - preferred_term: CYP79F2 (Arabidopsis; long-chain)
                          term:
                            id: UniProtKB:Q9FUY7
                            label: Hexahomomethionine N-hydroxylase
                  function:
                    preferred_term: homomethionine N-monooxygenase activity
                    term:
                      id: GO:0120526
                      label: homomethionine N-monooxygenase activity
                    substrates:
                      - preferred_term: chain-elongated methionine homolog
                    products:
                      - preferred_term: omega-methylthioalkanaldoxime
                    evidence:
                      - source_id: PMID:11133994
                        statement: Recombinant CYP79F1 converts di- and trihomomethionine to the 
                          aldoximes.
                        supporting_text: >-
                          We report that cytochrome P450 CYP79F1 catalyzes aldoxime formation in the
                          biosynthesis of aliphatic glucosinolates in Arabidopsis thaliana.
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                      evidence:
                        - source_id: file:ARATH/CYP79F1/CYP79F1-ai-review.yaml
                          statement: Core-function location in the CYP79F1 gene review.
          - order: 2
            role: aldoxime activation for glutathione conjugation
            node:
              id: aldoxime_oxidation
              label: CYP83A1 aldoxime oxidation
              module_type: REACTION
              annotons:
                - id: cyp83a1_activity
                  label: "CYP83A1: aliphatic aldoxime oxidation"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CYP83A1 cytochrome P450 subfamily
                      term:
                        id: PANTHER:PTHR47956:SF11
                        label: CYTOCHROME P450 83A1
                      representative_members:
                        - preferred_term: CYP83A1 / REF2 (Arabidopsis)
                          term:
                            id: UniProtKB:P48421
                            label: Cytochrome P450 83A1
                  function:
                    preferred_term: (methylsulfanyl)alkanaldoxime N-monooxygenase activity (proposed
                      new GO term; EC 1.14.14.43); parent shown
                    term:
                      id: GO:0016712
                      label: oxidoreductase activity, acting on paired donors, with incorporation or
                        reduction of molecular oxygen, reduced flavin or flavoprotein as one donor, 
                        and incorporation of one atom of oxygen
                    substrates:
                      - preferred_term: omega-methylthioalkanaldoxime
                    products:
                      - preferred_term: activated aci-nitro compound (conjugated to glutathione)
                    evidence:
                      - source_id: PMID:12509530
                        statement: ref2 (CYP83A1) mutants have reduced levels of all aliphatic 
                          glucosinolates.
                        supporting_text: >-
                          These results show that CYP83A1 is involved in the biosynthesis of both short-chain
                          and long-chain aliphatic glucosinolates
                      - source_id: file:ARATH/CYP83A1/CYP83A1-ai-review.yaml
                        statement: The review proposes a new MF term for this reaction, placed under
                          GO:0016712.
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                      evidence:
                        - source_id: file:ARATH/CYP83A1/CYP83A1-ai-review.yaml
                          statement: Core-function location in the CYP83A1 gene review.
          - order: 3
            role: glutathione conjugation
            node:
              id: gsh_conjugation
              label: Glutathione conjugation (GSTU20/GSTF11)
              module_type: REACTION
              description: >
                The CYP83A1 product (a short-lived aci-nitro or nitrile oxide intermediate) is conjugated
                to glutathione, which supplies the thioglucoside sulfur. Genetic evidence implicates GSTU20
                and GSTF11; catalysis on the native intermediate has not been shown biochemically, and
                some conjugation may be non-enzymatic.
              annotons:
                - id: gst_activity
                  label: 'GSTU20/GSTF11: glutathione transferase (aliphatic glucosinolate route)'
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: plant glutathione S-transferases (tau and phi classes)
                      representative_members:
                        - preferred_term: GSTU20 (Arabidopsis; major contributor)
                          term:
                            id: UniProtKB:Q8L7C9
                            label: Glutathione S-transferase U20
                        - preferred_term: GSTF11 (Arabidopsis)
                          term:
                            id: UniProtKB:Q96324
                            label: Glutathione S-transferase F11
                  function:
                    preferred_term: glutathione transferase activity
                    term:
                      id: GO:0004364
                      label: glutathione transferase activity
                    substrates:
                      - preferred_term: activated aldoxime intermediate (CYP83A1 product)
                      - preferred_term: glutathione
                    products:
                      - preferred_term: S-(alkylacetohydroximoyl)-glutathione
                    evidence:
                      - source_id: PMID:35145536
                        statement: gstu20 and gstf11 mutants lose aliphatic glucosinolates, the 
                          double mutant more so; the roles are partially overlapping and GSTU20 
                          matters more.
                        supporting_text: >
                          we demonstrated that GSTF11 and GSTU20 play non-redundant, although partially
                          overlapping, roles in aliphatic GSL biosynthesis
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                  notes: Both exemplars are reviewed; their reviews do not assign glucosinolate biosynthetic process (GO:0019761) because the evidence is mutant phenotypes, not catalysis of the step.
          - order: 4
            role: removal of the gamma-glutamyl residue
            node:
              id: ggp_cleavage
              label: Gamma-glutamyl peptidase (GGP1)
              module_type: REACTION
              annotons:
                - id: ggp1_activity
                  label: "GGP1: gamma-glutamyl peptidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GGP1 subfamily
                      term:
                        id: PANTHER:PTHR42695:SF14
                        label: GAMMA-GLUTAMYL PEPTIDASE 1
                      representative_members:
                        - preferred_term: GGP1 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9M0A7
                            label: Gamma-glutamyl peptidase 1
                  function:
                    preferred_term: gamma-glutamyl-peptidase activity
                    term:
                      id: GO:0034722
                      label: gamma-glutamyl-peptidase activity
                    substrates:
                      - preferred_term: S-(alkylacetohydroximoyl)-glutathione
                    products:
                      - preferred_term: S-(alkylacetohydroximoyl)-cysteinylglycine
                      - preferred_term: L-glutamate
                    evidence:
                      - source_id: PMID:19483696
                        statement: GGP1 metabolizes the accumulating glutathione conjugate in 
                          engineered glucosinolate production.
                        supporting_text: >-
                          gamma-glutamyl peptidase 1 (GGP1), which substantially increased glucosinolate
                          production by metabolizing an accumulating glutathione conjugate
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                      evidence:
                        - source_id: file:ARATH/GGP1/GGP1-ai-review.yaml
                          statement: Core-function location in the GGP1 gene review.
          - order: 5
            role: C-S cleavage to thiohydroximate
            node:
              id: cs_lyase
              label: C-S lyase (SUR1)
              module_type: REACTION
              annotons:
                - id: sur1_activity
                  label: "SUR1: S-alkylthiohydroximate lyase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: SUR1 subfamily
                      term:
                        id: PANTHER:PTHR45744:SF15
                        label: S-ALKYL-THIOHYDROXIMATE LYASE SUR1
                      representative_members:
                        - preferred_term: SUR1 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9SIV0
                            label: S-alkyl-thiohydroximate lyase SUR1
                  function:
                    preferred_term: S-alkylthiohydroximate lyase activity
                    term:
                      id: GO:0080108
                      label: S-alkylthiohydroximate lyase activity
                    substrates:
                      - preferred_term: S-(alkylacetohydroximoyl)-L-cysteine
                    products:
                      - preferred_term: thiohydroximate
                    evidence:
                      - source_id: PMID:14871316
                        statement: sur1 mutants completely lack aliphatic and indole glucosinolates.
                        supporting_text: >-
                          We report characterization of SUPERROOT1 (SUR1) as the C-S lyase in glucosinolate
                          biosynthesis.
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                      evidence:
                        - source_id: file:ARATH/SUR1/SUR1-ai-review.yaml
                          statement: Core-function location in the SUR1 gene review.
          - order: 6
