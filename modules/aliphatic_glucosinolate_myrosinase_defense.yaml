id: MODULE:aliphatic_glucosinolate_myrosinase_defense
title: Aliphatic glucosinolate biosynthesis and myrosinase activation (glucosinolate-myrosinase defense
  system)
description: "This module describes the chain-elongated methionine glucosinolate pathway and classical\
  \ myrosinase activation in characterized Brassicaceae. It is not a universal pathway for all glucosinolate-producing\
  \ plants. Methionine-derived (aliphatic) glucosinolates are made in three phases: (1) side-chain elongation,\
  \ a cycle recruited from leucine biosynthesis that runs partly in the cytosol and partly in the chloroplast:\
  \ methionine is deaminated to its 2-oxo acid in the cytosol (BCAT4), and after import into the chloroplast\
  \ the 2-oxo acid is condensed with acetyl-CoA (MAM), isomerized (IPMI), oxidatively decarboxylated (IPMDH1)\
  \ and transaminated back to a chain-elongated methionine homolog (BCAT3), each turn adding one methylene\
  \ group; (2) formation of the core glucosinolate structure, in which CYP79F converts the chain-elongated\
  \ amino acid to an aldoxime, CYP83A1 activates the aldoxime for glutathione conjugation, the conjugate\
  \ is trimmed by gamma-glutamyl peptidase (GGP1) and cleaved by the C-S lyase SUR1 to a thiohydroximate,\
  \ which is S-glucosylated (UGT74C1/UGT74B1) and finally sulfated from PAPS by desulfoglucosinolate sulfotransferases\
  \ (SOT16-18); and (3) side-chain modification, in which flavin monooxygenases (FMO GS-OX) S-oxygenate\
  \ methylthioalkyl to methylsulfinylalkyl glucosinolates and the 2-oxoglutarate-dependent dioxygenase\
  \ AOP2 converts these to alkenyl glucosinolates such as allylglucosinolate (sinigrin). The classical\
  \ damage-activated defense chemistry depends on hydrolysis of the stored glucosinolate. On tissue damage,\
  \ thioglucosidases (myrosinases, TGG1/TGG2) hydrolyze it to an unstable aglucone that rearranges by\
  \ default to an isothiocyanate; Fe(II)-dependent specifier proteins (ESP, NSPs, TFP) instead redirect\
  \ the aglucone to epithionitriles, simple nitriles or organic thiocyanates. Natural variation at MAM,\
  \ AOP and ESP loci accounts for much of the glucosinolate and breakdown-product diversity between accessions\
  \ and species. Transcriptional regulation (MYB28/MYB29 with MYC2-4), glucosinolate transport (GTR1/GTR2),\
  \ indole and aromatic glucosinolates, and sulfate activation to PAPS are outside this module's boundary.\n\
  \ BCAT3 is a characterized short-chain exit route rather than the sole exit enzyme for all chain lengths.\
  \ Native transport between compartments is required; transport proteins are outside this module. Decoration\
  \ and specifier branches vary among species, accessions and tissues."
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:20303821
  title: Biosynthesis of glucosinolates--gene discovery and beyond.
  statement: The biosynthetic pathway has three phases, chain elongation, core structure and side-chain
    decoration.
  supporting_text: Recent progress includes genes in all three phases of the pathway, i.e. side-chain
    elongation of precursor amino acids, formation of the core glucosinolate structure and side-chain
    decoration.
- source_id: PMID:19224919
  title: Nitrile-specifier proteins involved in glucosinolate hydrolysis in Arabidopsis thaliana.
  statement: Myrosinase hydrolysis gives isothiocyanates by default; specifier proteins divert the products.
  supporting_text: The degradation of glucosinolates is catalyzed by thioglucosidases called myrosinases
    and leads by default to the formation of isothiocyanates.
- source_id: PMID:21783213
  title: A thiocyanate-forming protein generates multiple products upon allylglucosinolate breakdown in
    Thlaspi arvense.
  statement: Allylglucosinolate is the major glucosinolate of field pennycress, whose specifier protein
    TFP yields allylthiocyanate and the corresponding epithionitrile.
  supporting_text: this protein promotes the formation of allylthiocyanate as well as the corresponding
    epithionitrile upon myrosinase-catalyzed hydrolysis of allylglucosinolate, the major glucosinolate
    of T. arvense.
- source_id: file:projects/THLAR_OILSEED/ortholog_mapping/CALLS.md
  title: Pennycress ortholog calls (THLAR_OILSEED project)
  statement: Sequence-based Thlaspi candidates are mapped with forward and reverse phmmer searches. These
    include MAM1/3 and SSU2/3 co-orthologs and incomplete models; they are inferred exemplars, not direct
    native biochemical assays or uniformly one-to-one orthologs.
- source_id: PMID:20457641
  title: Production of the cancer-preventive glucoraphanin in tobacco.
  statement: Methionine chain elongation is split between the cytosol (BCAT4 deamination) and the chloroplast.
  supporting_text: a chain-elongation pathway that takes place partly in the cytosol and partly in the
    chloroplast
- source_id: DOI:10.1016/j.bse.2025.105033
  statement: Restrict this chain-elongated methionine template to Brassicaceae; glucosinolate occurrence
    alone does not establish the elongation pathway.
module:
