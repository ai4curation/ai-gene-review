id: MODULE:dmel_signal_peptidase_complex
title: Signal peptidase complex in Drosophila melanogaster
description: >-
  The signal peptidase complex in the endoplasmic reticulum membrane cleaves N-terminal signal
  peptides from secretory and membrane proteins as they are translocated. Its catalytic subunit,
  SEC11 (encoded in Drosophila by twr), is a membrane-anchored serine protease whose active
  site faces the ER lumen. The accessory subunits SPCS1, SPCS2 and SPCS3 (Spase12, Spase25
  and Spase22-23) are required for activity and stability of the complex; SPCS3 also helps
  select substrates.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001452
  title: 'FlyBase gene group SPC: Signal peptidase complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as signal peptidase complex (SPC);
    this module models that group.
- source_id: GO:0005787
  title: signal peptidase complex
  statement: >-
    GO term grounding the module as signal peptidase complex.
notes: >-
  Decomposition. The catalytic subunit and the accessory subunits are modelled as two parts.
  The BP term for signal peptide processing is obsolete in GO, so no process term is attached.
  FlyBase groups realized by this module: SPC (FBgg0001452). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_signal_peptidase_complex.yaml; none of the member genes has a gene
  review yet unless noted.
