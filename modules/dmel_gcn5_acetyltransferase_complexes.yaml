id: MODULE:dmel_gcn5_acetyltransferase_complexes
title: Gcn5-containing histone acetyltransferase complexes in Drosophila melanogaster
description: >-
  The histone acetyltransferase Gcn5 acetylates histone H3 as the catalytic subunit of several
  coactivator complexes. Gcn5 always sits in a HAT module with Ada3, Sgf29 and an Ada2 paralog.
  With Ada2b it forms part of SAGA, a large coactivator that also contains a TBP-interacting
  core, the Tra1 homolog Nipped-A, and a deubiquitinase module that removes ubiquitin from
  histone H2B through the protease Nonstop. With Ada2a it forms ATAC, which also contains
  the Atac1-3 subunits. Smaller ADA and CHAT (Chiffon-containing) complexes contain only the
  HAT module, with Chiffon in CHAT.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001748
  title: 'FlyBase gene group GCN5: Gcn5-containing complexes'
  statement: >-
    FlyBase release FB2026_03 groups 32 D. melanogaster genes as gcn5-containing complexes
    (GCN5); this module models that group.
- source_id: GO:0000123
  title: histone acetyltransferase complex
  statement: >-
    GO term grounding the module as histone acetyltransferase complex.
notes: >-
  The four FlyBase subgroups are modelled as alternative complexes, so shared HAT-module subunits
  appear in each. SAGA is decomposed into its HAT, deubiquitinase, core, Tra1 and SF3B parts;
  within the core, assignment of the two Ada1 paralogs and Wda follows their FlyBase membership
  of SAGA and is not meant to resolve finer architecture. ATAC also contains Hcf, Wds, Chrac-14,
  NC2beta and Mocs2B as listed by FlyBase. FlyBase groups realized by this module: GCN5 (FBgg0001748).
  Subgroups folded into it: ATAC, SAGA, ADAC, CHAT. Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_gcn5_acetyltransferase_complexes.yaml. Genes without a UniProtKB
  entry (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member
  genes has a gene review yet unless noted.
