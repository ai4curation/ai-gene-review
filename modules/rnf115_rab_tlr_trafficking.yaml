id: MODULE:rnf115_rab_tlr_trafficking
title: RNF115-gated post-ER Toll-like receptor trafficking
description: >-
  A reusable post-ER checkpoint in which AKT-dependent 14-3-3 binding recruits
  the RNF115 E3 ubiquitin ligase to early secretory membranes, RNF115 adds
  K11-linked ubiquitin to RAB GTPases, and the modified RABs fail to recruit a
  Rab GDP-dissociation inhibitor for the next activation cycle. The human TLR
  GO-CAM realizes this motif with AKT1, a 14-3-3 chaperone, RNF115, GDI1, RAB1A
  for ER-to-Golgi transport, RAB13 for Golgi-to-cell-surface transport, and
  TLR4 as one plasma-membrane Toll-like receptor cargo.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: file:gocams/65692e7e00001822/65692e7e00001822-review.yaml
    title: RNF115 inhibition of TLR transport to cell surface GO-CAM review
    statement: >-
      The reviewed human GO-CAM captures the AKT1/14-3-3/RNF115 branch that
      inhibits GDI-dependent recycling of RAB1A and RAB13, thereby restraining
      post-ER Toll-like receptor delivery to the cell surface.
  - source_id: PMID:35343654
    title: RNF115 Inhibits the Post-ER Trafficking of TLRs and TLRs-Mediated Immune Responses by Catalyzing K11-Linked Ubiquitination of RAB1A and RAB13.
    statement: AKT1 and 14-3-3 chaperones recruit RNF115 to ER and Golgi membranes that carry TLRs.
    supporting_text: >-
      RNF115 is phosphorylated by AKT1 and subsequently associates with the
      14‐3‐3 chaperones that facilitate RNF115 associating with TLRs and
      localizing on the ER and the Golgi apparatus.
  - source_id: PMID:35343654
    title: RNF115 Inhibits the Post-ER Trafficking of TLRs and TLRs-Mediated Immune Responses by Catalyzing K11-Linked Ubiquitination of RAB1A and RAB13.
    statement: RNF115 K11-ubiquitinates RAB1A and RAB13 and inhibits GDI1 recruitment to those RABs.
    supporting_text: >-
      Furthermore, RNF115 catalyzes K11‐linked ubiquitination on the Lys49 and
      Lys61 residues of RAB1A and on the Lys46 and Lys58 residues of RAB13,
      which impairs the recruitment of GDP dissociation inhibitor 1 (GDI1) to
      RAB1A and RAB13, thereby inhibiting the reactivation of the two RABs and
      the post‐ER trafficking of TLRs.
  - source_id: PMID:35343654
    title: RNF115 Inhibits the Post-ER Trafficking of TLRs and TLRs-Mediated Immune Responses by Catalyzing K11-Linked Ubiquitination of RAB1A and RAB13.
    statement: RAB1A and RAB13 drive successive ER-to-Golgi and Golgi-to-surface legs of TLR transport.
    supporting_text: >-
      Specifically, RAB1A promotes the trafficking of TLRs from the ER to the
      Golgi apparatus, whereas RAB13 facilitates the trafficking of a subset of
      TLRs from the Golgi apparatus to the cell surface.
  - source_id: file:interpro/panther/PTHR11787/PTHR11787-entries.csv
    title: PANTHER PTHR11787 member table
    statement: >-
      Human GDI1 is classified in PANTHER subfamily PTHR11787:SF3, Rab GDP
      dissociation inhibitor alpha.
  - source_id: file:interpro/panther/PTHR47977/PTHR47977-paint.tsv
    title: PANTHER PTHR47977 PAINT assertions
    statement: >-
      The broad RAB GTPase PAINT node PTN001292747 has IBD support for GTPase
      activity (GO:0003924) with human RAB1A among the seed proteins.
notes: >-
  The module generalizes the transport-control branch of the human GO-CAM while
  keeping its human activities as concrete exemplar pins. The GO-CAM uses
  YWHAE as the 14-3-3 paralog, but the source paper recovered theta, eta, zeta,
  epsilon, gamma, and beta 14-3-3 proteins as RNF115 interactors, so the module
  models a PTHR18860 14-3-3 family selector and uses YWHAE only as the pinned
  exemplar. The RAB1A and RAB13 steps are left as the GO-CAM's human gene
  products rather than broader RAB-family claims because the paper maps
  RNF115-sensitive lysines in those two RABs and the local PAINT data do not
  establish a narrow ancestral node for the TLR-trafficking roles.
