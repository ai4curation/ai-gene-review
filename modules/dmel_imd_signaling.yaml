id: MODULE:dmel_imd_signaling
title: Imd signaling pathway in Drosophila melanogaster
description: >-
  The immune deficiency (Imd) pathway is the main Drosophila defense against Gram-negative
  bacteria and some Gram-positive bacilli. It is triggered when DAP-type peptidoglycan binds
  the transmembrane receptor PGRP-LC or the intracellular receptor PGRP-LE. The receptors
  recruit the death-domain protein Imd, which assembles a complex with the adaptor Fadd and
  the caspase Dredd. Dredd cleaves Imd, and the E3 ligase Diap2, with the E2 enzymes Bendless
  and Effete and the E2 variant Uev1A, attaches K63-linked ubiquitin chains. These chains
  recruit the Tak1-Tab2 kinase complex, which activates the IKK complex (IKKbeta and Kenny).
  IKK phosphorylates the NF-kappa-B factor Relish, Dredd cleaves it, and the Rel homology
  domain enters the nucleus to induce antimicrobial peptide genes. Tak1 also activates the
  JNK branch (Hemipterous, Basket) that acts through AP-1 (Jra, Kayak).
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001194
  title: 'FlyBase gene group IMD: Imd signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 82 D. melanogaster genes as imd signaling pathway (IMD);
    this module models that group.
- source_id: GO:0061057
  title: peptidoglycan recognition protein signaling pathway
  statement: >-
    GO term grounding the module as peptidoglycan recognition protein signaling pathway.
notes: >-
  Boundary. Core components only (FlyBase IMD-C). IKKbeta and Relish are shared with cGAS-STING
  signaling, and the JNK cascade is shared with JNK signaling. Amidase PGRPs, Pirk, Caspar,
  deubiquitinases and other FlyBase regulators are not parts. Tak1-Tab2 is emitted as a complex
  without a GO complex term. FlyBase groups realized by this module: IMD (FBgg0001194). Subgroups
  folded into it: IMD-C. FlyBase also curates regulator sets for this pathway, which are context
  and not modelled as parts: IMD-N (negative regulators of imd signaling pathway, 45 genes);
  IMD-P (positive regulators of imd signaling pathway, 19 genes). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_imd_signaling.yaml; none of the member genes has a gene review yet
  unless noted.
