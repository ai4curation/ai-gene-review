id: MODULE:dmel_msl_dosage_compensation_complex
title: MSL dosage compensation complex in Drosophila melanogaster
description: >-
  The male-specific lethal (MSL) complex doubles transcription of the single X chromosome
  in males. It contains five proteins, MSL1, MSL2, MSL3, the acetyltransferase MOF and the
  RNA helicase MLE, and one of two long noncoding RNAs, roX1 or roX2, which are redundant.
  MSL2 is made only in males and nucleates assembly; MLE remodels the roX RNAs to incorporate
  them. The complex binds high-affinity sites on the X and spreads to active genes, where
  MOF acetylates histone H4 lysine 16 to raise transcription.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000283
  title: 'FlyBase gene group MSL: Male specific lethal complex'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as male specific lethal complex
    (MSL); this module models that group.
- source_id: GO:0072487
  title: MSL complex
  statement: >-
    GO term grounding the module as MSL complex.
notes: >-
  The roX RNAs have no protein product and are grounded to their FlyBase gene ids. MSL2 ubiquitin
  ligase activity (toward histone H2B and the complex's own subunits) is recorded with the
  general ubiquitin protein ligase term. FlyBase groups realized by this module: MSL (FBgg0000283).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_msl_dosage_compensation_complex.yaml;
  none of the member genes has a gene review yet unless noted.
