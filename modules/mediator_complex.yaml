              The coactivator activity belongs to the complex. Human GOA carries IDA rows for
              transcription coactivator activity or transcription coregulator activity on
              MED1, MED4, MED6, MED12, MED13, MED14, MED16, MED17, MED21, MED24, MED26, MED27
              and MED30 (MED12 and MED13 are CKM subunits), but every one of them comes from assays of purified TRAP/SMCC, CRSP,
              ARC or PC2 complexes (PMID:10198638, PMID:12037571, PMID:12218053,
              PMID:10882111, PMID:9989412, PMID:15989967) or from overexpression of single
              subunits in reporter assays, so in this module each subunit only contributes to
              the complex activity and no subunit carries the coactivator activity itself.
              Two subunits carry their own activator-binding function, assayed on the isolated
              protein: MED1 binds nuclear receptors ligand-dependently through its LxxLL boxes
              (IPI and IDA rows, PMID:9653119), and MED25 binds the retinoic acid receptor
              (IPI, PMID:17641689). MED17 binds the p53 and VP16 activation domains directly
              (PMID:10198638), but its GOA rows from that paper are complex-level, so it is
              left without a function. MED15, MED23 and MED24 bind activators in the
              literature but have no experimental human molecular function in GOA and are
              units without a function. The remaining subunits have no experimental
              molecular function in human GOA (or only bare protein binding).
            evidence:
