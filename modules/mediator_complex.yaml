                statement: CDK8-Mediator also acts positively, recruiting the super elongation complex at hypoxia-induced genes.
                supporting_text: Instead, we demonstrate that HIF1A employs CDK8-Mediator to recruit the Super Elongation Complex (SEC) along with CDK9.
