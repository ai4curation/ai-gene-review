                statement: The CDK8 paralogue CDK11 (now CDK19) and MED13L were identified as Mediator-associated proteins.
                supporting_text: In addition, we identify as Mediator-associated proteins the CDK8-like cyclin-dependent kinase CDK11 and the TRAP240-like KIAA1025 protein (MED13L)
