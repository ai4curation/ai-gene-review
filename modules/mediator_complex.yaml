            role_description: >-
              The one catalytic activity of Mediator. CDK19 carries an IDA row for protein
              serine/threonine kinase activity and cyclin C an IDA row for
              cyclin-dependent protein serine/threonine kinase regulator activity
              (PMID:25344755); CDK8 carries an IMP row for protein kinase activity
              (PMID:30905399, loss of STAT1 Ser727 phosphorylation with patient
              substitutions). CDK8 is given the same serine/threonine kinase term as CDK19
              because its substrates in these papers are serine residues (STAT1 Ser727, the
              CTD, histone H3); the more specific RNA polymerase II CTD heptapeptide repeat
              kinase activity is not used, because the CTD is one of several substrates and
              no human GOA row asserts it. MED12 activates CDK8 (PMID:19047373) but has no
              experimental human molecular function of its own beyond complex-level
              coactivator rows, so it is a unit without a function; MED13 and the paralogues
              MED12L and MED13L likewise. Each CKM contains one member of each paralogue pair
              (CDK8 or CDK19, MED12 or MED12L, MED13 or MED13L); listing all seven units in one
              descriptor is a compression of these alternative assemblies.
