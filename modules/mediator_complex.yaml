      description: >-
        CKM binding to the core Mediator tail through MED13 precludes Pol II recruitment and
        represses initiation and reinitiation; this switch needs MED12 and MED13 but not CDK8
        kinase activity. The kinase-dependent and gene-specific positive roles of the CKM are
        not captured by this edge.
      evidence:
        - source_id: PMID:19240132
          statement: The CDK8 submodule binds the Mediator tail via MED13 and this precludes Pol II recruitment.
          supporting_text: Structural and biochemical studies confirm the CDK8 submodule binds the Mediator leg/tail domain via the Med13 subunit, and this submodule-Mediator association precludes pol II recruitment.
        - source_id: PMID:19240132
          statement: Repression by the CDK8 subcomplex needs MED12 and MED13 but not CDK8 kinase activity.
          supporting_text: Med12 and Med13 are critical for subcomplex-dependent repression, whereas CDK8 kinase activity is not
