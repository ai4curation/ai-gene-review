id: MODULE:mediator_complex
title: Human Mediator complex — the 26-subunit core Mediator (head, middle and tail modules on the MED14 scaffold) as the coactivator bridging DNA-bound activators to RNA polymerase II, and the dissociable CDK8 kinase module (CDK8 or CDK19, cyclin C, MED12 or MED12L, MED13 or MED13L)
description: >-
  Mediator is the large multisubunit coactivator through which DNA-binding transcription
  factors communicate with RNA polymerase II (Pol II). Human core Mediator has 26 subunits
  arranged in head, middle and tail modules held together by the central scaffold subunit
  MED14. Activation domains of transcription factors contact flexibly tethered domains,
  chiefly in the tail (MED15, MED16, MED23, MED24, MED25) and in MED1 of the middle module,
  which carries the LxxLL boxes that bind ligand-activated nuclear receptors. The head and
  middle modules bind Pol II and its C-terminal domain (CTD), stabilise the preinitiation
  complex and present the CTD to the TFIIH kinase CDK7, so that Mediator stimulates both
  basal and activated transcription and CTD phosphorylation. A fourth, dissociable module,
  the CDK8 kinase module (CKM), consists of the kinase CDK8 or its paralogue CDK19, cyclin C,
  MED12 or MED12L and MED13 or MED13L. The CKM binds core Mediator through MED13 and, in
  doing so, precludes Pol II binding, so that CKM association acts as a switch that
  restrains initiation and reinitiation; separately, CDK8 and CDK19, activated by cyclin C
  and MED12, phosphorylate the Pol II CTD, TFIIH, histone H3 and transcription factors such
  as STAT1 and the Notch intracellular domain, and CDK8-Mediator can also promote
  elongation at specific genes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000127
    title: RNA polymerase II transcription pathway
    statement: >-
      RGD curates all 33 human Mediator genes (MED1, MED4, MED6 to MED31 including MED12L
      and MED13L, CDK8, CDK19 and CCNC) directly to this pathway, and its text describes
      Mediator as a coactivator of most protein-coding genes with head, middle, tail and
      kinase modules. This module realises the Mediator part of the pathway under the
      split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000127.yaml
    statement: RGD describes Mediator as a coactivator required for transcription of most protein-coding genes.
    supporting_text: The Mediator complex, a coactivator required for transcription of most protein-coding
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000127.yaml
    statement: RGD attributes the catalytic contribution of Mediator to CDK8 of the kinase module.
    supporting_text: modifies them via the Cdk8 activity of the kinase module
  - source_id: GO:0006366
    title: transcription by RNA polymerase II
    statement: >-
      The GO process mapped to PW:0000127 (skos:relatedMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). Mediator
      regulates this process; the module's own concept is the complex, GO:0016592 mediator
      complex.
  - source_id: PMID:33707221
    title: Structure of the human Mediator-bound transcription preinitiation complex.
    statement: Cryo-EM of the human Mediator-bound PIC shows activator-binding sites tethered to the tail and a CTD-binding site between head and middle.
    supporting_text: Transcription factor binding sites within Mediator are primarily flexibly tethered to the tail module.
  - source_id: PMID:33958484
    title: Structures of the human Mediator and Mediator-bound preinitiation complex.
    statement: Human core Mediator has 26 subunits and stimulates transcription and CDK7-mediated CTD phosphorylation.
    supporting_text: The 26-subunit Mediator stimulates transcription and cyclin-dependent kinase 7 (CDK7)-mediated phosphorylation of the Pol II C-terminal domain (CTD).
  - source_id: PMID:11559591
    title: Novel critical role of a human Mediator complex for basal RNA polymerase II transcription.
    statement: Immunodepletion of Mediator from human extracts abolishes Pol II transcription.
    supporting_text: The removal of human Mediator abolished transcription by RNA polymerase II.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000127 (RNA polymerase II transcription
  pathway) through the RGD_PATHWAY_ONTOLOGY project, as module 2 of the Pol II split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 281 RGD-curated human
  genes). RGD annotates all 33 Mediator genes (the HGNC Mediator group) directly to
  PW:0000127 and none to its initiation, elongation or termination children, so PW:0000127
  is the only PW evidence source; PW:0001274 (initiation) is named here only. The diagram
  draws Mediator as positively affecting Pol II initiation, elongation and termination,
  3'-end processing, splicing and chromatin modification; this module models the complex
  and its coactivator and kinase activities, not each of those downstream effects. All 33
  RGD genes are participants (26 core subunits, 7 CKM subunits); no gene outside the RGD
  list is added. UniProt accessions and recommended names are from UniProt REST (November
  2026); molecular functions are from each protein's experimental human GOA rows in QuickGO
  (November 2026). Only MED13L has a gene review in this repository; its core function
  (transcription coregulator activity within the CKM, PMID:22249253) is consistent with
  treating MED13L as a unit that contributes to the complex. The structure follows
  modules/dmel_mediator_complex.yaml (structure only; no Drosophila evidence is used).

  Boundary and modelling decisions. (1) Coactivator activity on the complex. The
  transcription coactivator activity of core Mediator is placed on the complex annoton and
  not on individual subunits: the IDA coactivator and coregulator rows on thirteen
  subunits all derive from assays of purified Mediator complexes or from single-subunit
  overexpression, so subunits contribute to the activity at most. MED1 (nuclear receptor
  binding) and MED25 (nuclear retinoic acid receptor binding) carry their own
  activator-binding functions because these were assayed on the isolated subunits. These
  are binding terms, not bare protein binding, and are the only subunit-level functions in
  the core. (2) Head, middle and tail are recorded in each unit's role, not as separate
  nodes. GO has no cellular-component terms for the human head, middle or tail modules,
  the coactivator activity is a property of the whole core, and the module assignments of
  the metazoan-specific subunits MED27, MED28, MED29 and MED30 (head or upper tail) and the
  position of MED26 differ between structures, so a single core complex annoton with
  labelled units is used, as in the Drosophila analogue. The assignments follow the human
  Mediator-PIC structures (PMID:33707221, PMID:33958484). (3) The CDK8 kinase module is a
  separate part with the one catalytic annoton: protein serine/threonine kinase activity,
  on the CDK8 and CDK19 units and on the complex, with cyclin C carrying cyclin-dependent
  kinase regulator activity. CDK8 is given protein serine/threonine kinase activity
  although its experimental human GOA row is the parent term protein kinase activity (IMP,
  PMID:30905399); this is a curator-authored refinement from the serine substrates
  reported in PMID:30905399 and PMID:19047373 and from the CDK19 IDA row, and is the only
  function in the module not taken directly from an experimental GOA row. RNA polymerase II
  CTD heptapeptide repeat kinase activity, used for Cdk8 in the Drosophila module, is not
  used: the CTD is one of several CDK8 substrates and no human GOA row asserts it. (4)
  Paralogues. CDK8/CDK19, MED12/MED12L and MED13/MED13L are alternative subunits of
  distinct CKM assemblies (RGD: their roles are not redundant). They are listed together in
  one CKM descriptor with roles stating the alternatives, rather than as three variant
  sets, because the paralogue combinations present in cells are not established for all
  eight possibilities; MED12L has only IBA support for Mediator membership in GOA, and its
  inclusion rests on RGD and HGNC. (5) The CKM-core connection is NEGATIVELY_REGULATES,
  following the MED13-dependent switch that precludes Pol II binding (PMID:19240132). The
  kinase-dependent positive roles (for example CDK8-Mediator recruitment of the super
  elongation complex, PMID:23746844) are recorded in the CKM evidence, not as a second
  edge. (6) Kinase substrates are not participants: the Pol II CTD, TFIIH, histone H3,
  STAT1 and the Notch intracellular domain are acted on by the CKM and belong to their own
  modules. (7) Out of scope, modelled in sibling modules of this tranche: Pol II and the
  general transcription factors including TFIIH and its CDK7 kinase
  (rna_polymerase_ii_core_and_initiation), elongation factors including the super
  elongation complex, P-TEFb and DSIF/NELF (rna_polymerase_ii_elongation_and_termination),
  capping (pre_mrna_capping) and 3'-end processing
  (pre_mrna_3prime_cleavage_polyadenylation). SAGA and ATAC, the other coactivators drawn on
  the RGD diagram, belong to a later histone-modification tranche and are not modelled.
  Activators that bind Mediator (nuclear receptors, p53, VP16, SREBP and others) are
  upstream inputs, not parts. CDK3, which cyclin C also activates (PMID:25344755), is not a
  Mediator subunit and is excluded.

  GO-CAM links. In gocams/index.tsv only gomodel:696022cd00003836 (Regulation of NOTCH1 by
  the Cyclin C-CDK19 pair, Human) contains Mediator subunits: CCNC with
  cyclin-dependent protein serine/threonine kinase regulator activity directly positively
  regulating CDK19 protein serine/threonine kinase activity, which negatively regulates
  NOTCH1 transcription coactivator activity. Both activities are pinned to the CKM kinase
  annoton; their functions match the module's unit functions. No production model contains
  a core Mediator subunit, CDK8, MED12, MED12L, MED13 or MED13L. The seed's best_gocam
  (gomodel:627d95ee00001242, P-TEFb, NELFE and PARP1) contains no Mediator subunit and is
  not linked. PANTHER family ids and PTNs are deliberately not asserted.
