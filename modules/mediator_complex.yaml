                statement: Nuclear receptors bind TRAP220 (MED1) and p53 and VP16 bind TRAP80 (MED17).
                supporting_text: In parallel with ligand-dependent interactions of nuclear receptors with the TRAP220 subunit, p53 and VP16 activation domains interact directly with a newly cloned TRAP80 subunit.
              - source_id: PMID:9653119
                statement: MED1 (TRAP220) binds nuclear receptors directly and ligand-dependently through its LxxLL motifs.
                supporting_text: only TRAP220 shows a direct ligand-dependent interaction with TRalpha, and these interactions are mediated through the C terminus of TRalpha and (at least in part) the LXXLL domains of TRAP220
              - source_id: PMID:17641689
                statement: MED25 binds ligand-bound retinoic acid receptor through its C-terminal LxxLL motif.
                supporting_text: We isolated MED25, which associates with retinoic acid (RA)-bound retinoic acid receptor (RAR) through the C-terminal nuclear hormone receptor (NR) box/LxxLL motif, and increases RAR/RXR-mediated transcription.
              - source_id: PMID:15989967
                statement: MED1 is present in a Pol II-rich subpopulation of Mediator that supports basal and activated transcription.
                supporting_text: this MED1/TRAP220-containing holoenzyme supports both basal- and activator-dependent transcription in an in vitro system lacking additional RNA polymerase II
              - source_id: PMID:33707221
                statement: Mediator binds the Pol II CTD between its head and middle modules, next to the CDK7 active site.
                supporting_text: Two binding sites exist for the Pol II CTD, one between the head and middle modules of Mediator and the other in the active site of CDK7, providing structural evidence for Pol II CTD phosphorylation within the Mediator-bound PIC.
              - source_id: PMID:33707221
                statement: MED14 is the central scaffold of human Mediator.
                supporting_text: Human Mediator is held together by a central scaffold subunit, Med14, which forms two contact sites with MedTail.
