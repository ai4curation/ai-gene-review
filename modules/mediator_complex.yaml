              - source_id: PMID:19047373
                statement: MED12, not MED13, is essential for CDK8 kinase activation.
                supporting_text: we identify Med12--but not Med13--to be essential for activating the CDK8 kinase
              - source_id: PMID:25344755
                statement: Cyclin C activates CDK19 and CDK8, which phosphorylate the Notch1 intracellular domain.
                supporting_text: Cyclin C activates an 'orphan' CDK19 kinase, as well as CDK8 and CDK3. These cyclin-C-CDK complexes phosphorylate the Notch1 intracellular domain (ICN1) and promote ICN1 degradation.
              - source_id: PMID:30905399
                statement: Patient CDK8 substitutions reduce STAT1 Ser727 phosphorylation, the readout of CDK8 kinase activity in CDK8/CDK19 double-knockout cells.
                supporting_text: Finally, all exhibited attenuated kinase activity in a previously validated assay of STAT1-phosphorylation
