id: MODULE:phosphoinositide_biosynthesis
title: Phosphoinositide biosynthesis (PI -> PI3P/PI4P -> PI(3,5)P2/PI(4,5)P2 kinase network)
description: >-
  Phosphatidylinositol (PI) is phosphorylated on the inositol ring by a conserved set of lipid kinases to give
  the phosphoinositides that mark eukaryotic membranes and recruit effector proteins. A class III
  phosphatidylinositol 3-kinase (Vps34), held on membranes by its regulatory protein-kinase subunit, makes
  PI 3-phosphate (PI3P) on endosomes and autophagic membranes. Phosphatidylinositol 4-kinases make PI
  4-phosphate (PI4P) in distinct places: the type III-beta enzyme (Pik1/PI4KB) on the trans-Golgi, the type
  III-alpha enzyme (Stt4/PI4KA), recruited by an Efr3-Ypp1 scaffold, at the plasma membrane, and a type II
  enzyme on plasma and vacuolar/endosomal membranes. Two kinds of PIP kinase add a 5-phosphate: the type I
  PI4P 5-kinase (Mss4/PIP5K1) converts plasma-membrane PI4P to PI(4,5)P2, the precursor of
  inositol-trisphosphate signalling and a regulator of the cortical actin cytoskeleton, and the FYVE-domain
  PI3P 5-kinase (Fab1/PIKfyve), acting in a complex with Vac14 and the Fig4 phosphatase, converts PI3P to
  PI(3,5)P2 on the vacuole/late endosome, where it controls vacuole size and membrane homeostasis. Because
  each kinase acts in its own compartment, the network produces membrane-specific lipid identities rather
  than a linear pathway; lipid phosphatases (Sac1, synaptojanins, Fig4) reverse these steps and are outside
  this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:PWY3O-242
    title: phosphatidylinositol phosphate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Kinases VPS34 (1-PHOSPHATIDYLINOSITOL-3-KINASE-RXN), PIK1/STT4/LSB6 (1-PHOSPHATIDYLINOSITOL-KINASE-RXN),
      MSS4 (2.7.1.68-RXN) and FAB1 (2.7.1.150-RXN) were retained. The phosphatase reactions (FIG4, SAC1, INP51-54,
      YMR1) are outside the module boundary.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-242
  - source_id: GO:0046854
    title: phosphatidylinositol phosphate biosynthetic process
    statement: Module-level process for phosphorylation of PI to its mono- and bisphosphates.
  - source_id: GO:0036092
    title: phosphatidylinositol-3-phosphate biosynthetic process
    statement: Vps34 branch.
  - source_id: GO:1902635
    title: 1-phosphatidyl-1D-myo-inositol 4,5-bisphosphate biosynthetic process
    statement: PI4K followed by PI4P 5-kinase.
  - source_id: GO:1903102
    title: 1-phosphatidyl-1D-myo-inositol 3,5-bisphosphate biosynthetic process
    statement: Vps34 followed by Fab1.
  - source_id: PMID:22345606
    title: Metabolism and regulation of glycerolipids in the yeast Saccharomyces cerevisiae.
    statement: >-
      PI is converted to PI 3-P by VPS34 or to PI 4-P by LSB6, STT4 and PIK1; PI 4-P is phosphorylated to PI
      4,5-P2 by MSS4 and PI 3-P to PI 3,5-P2 by FAB1.
  - source_id: PMID:17382260
    title: Synthesis and function of membrane phosphoinositides in budding yeast, Saccharomyces cerevisiae.
    statement: >-
      Review of the yeast PI kinases: Vps15-Vps34 complexes; Pik1 targeted to the Golgi by Frq1 and also
      shuttling to the nucleus; Stt4 generating the plasma-membrane PI4P pool that Mss4 converts to PI(4,5)P2;
      Fab1 with Vac7/Vac14 making PI(3,5)P2.
  - source_id: PMID:7989323
    title: Vps34p required for yeast vacuolar protein sorting is a multiple specificity kinase that exhibits both protein kinase and phosphatidylinositol-specific PI 3-kinase activities.
    statement: Vps34p phosphorylates PI but not PI(4)P or PI(4,5)P2.
  - source_id: PMID:8387919
    title: A membrane-associated complex containing the Vps15 protein kinase and the Vps34 PI 3-kinase is essential for protein sorting to the yeast lysosome-like vacuole.
    statement: Vps15p associates Vps34p with membranes and its kinase domain is required for Vps34 PI 3-kinase activation.
  - source_id: PMID:8194527
    title: PIK1, an essential phosphatidylinositol 4-kinase associated with the yeast nucleus.
    statement: PIK1 encodes an essential PI 4-kinase.
  - source_id: PMID:8288577
    title: A novel gene, STT4, encodes a phosphatidylinositol 4-kinase in the PKC1 protein kinase pathway of Saccharomyces cerevisiae.
    statement: stt4 deletion extracts lack most PI 4-kinase activity.
  - source_id: PMID:12361950
    title: The Saccharomyces cerevisiae LSB6 gene encodes phosphatidylinositol 4-kinase activity.
    statement: LSB6 encodes a type II PI 4-kinase on plasma and vacuole membranes; lsb6 cells have no phosphoinositide defect in vivo.
  - source_id: PMID:9624178
    title: MSS4, a phosphatidylinositol-4-phosphate 5-kinase required for organization of the actin cytoskeleton in Saccharomyces cerevisiae.
    statement: MSS4 converts PI(4)P to PI(4,5)P2; mss4 cells have about 10% of normal PI(4,5)P2.
  - source_id: PMID:9624177
    title: Phosphatidylinositol-4-phosphate 5-kinase localized on the plasma membrane is essential for yeast cell morphogenesis.
    statement: Mss4p has PI(4)P 5-kinase activity and is localized on the plasma membrane.
  - source_id: PMID:9763421
    title: Fab1p is essential for PtdIns(3)P 5-kinase activity and the maintenance of vacuolar size and membrane homeostasis.
    statement: fab1 mutants lack PI(3,5)P2; PI(3,5)P2 is made in two steps, PI3P by Vps34 then phosphorylation by Fab1.
notes: >-
  NEW (YeastPathways project, 2026-10). Boundary: the four lipid-kinase reactions that make PI3P, PI4P,
  PI(3,5)P2 and PI(4,5)P2 from PI. PI itself is made by PI synthase in cdp_dag_phospholipid_synthesis; PI(4,5)P2
  hydrolysis by phospholipase C begins myo_inositol_and_inositol_phosphate_biosynthesis. The phosphatases that
  YeastCyc includes in PWY3O-242 (SAC1, INP51/52/53/54, FIG4, YMR1) reverse these steps and are excluded, as
  are effectors. Scaffold and regulatory subunits that are required in vivo but have no lipid-kinase activity
  are recorded here rather than as annotons: Vps15 for Vps34 (PMID:8387919), Efr3 and Ypp1 for Stt4 (PomBase
  model 663d668500002178 gives S. pombe efr3 protein-membrane adaptor activity), and Vac14/Vac7 for Fab1
  (PMID:17382260). PI4K is a ONE_OR_MORE variant set because the three PI 4-kinases make separate pools (Golgi
  Pik1, plasma-membrane Stt4, and a minor type II Lsb6 whose loss has no phosphoinositide phenotype,
  PMID:12361950). Human orthologs are added as representatives where they share the PANTHER (sub)family
  (PIK3C3, PI4KB, PI4KA, PIP5K1A). Fab1 and PIKfyve are in different PANTHER families (PTHR45748 and PTHR46715),
  so the PI3P 5-kinase role carries no family id. MSS4 and S. pombe its3 are in PTHR23086:SF8 and human PIP5K1A
  in SF54, so the PIP5K role uses the family PTHR23086. YeastCyc corrections: none for the kinases; STT4 is
  present in YeastCyc. GO-CAM disagreements: (a) YeastPathways_PWY3O-242 places all kinases in cytosol rather
  than on their membranes; (b) the PomBase model 663d668500002178 gives S. pombe its3 the MF GO:0052811
  (1-phosphatidylinositol-3-phosphate 4-kinase activity), whereas UniProt (O13853) names its3 a PI4P 5-kinase
  (EC 2.7.1.68), the activity of its S. cerevisiae ortholog MSS4 (PMID:9624178); this module uses GO:0016308 for
  the role; (c) the PomBase model also includes myo-inositol import (itr2), PI synthase (pis1) and the
  inositol-phosphate kinases plc1/arg82/ipk1/kcs1/asp1, which are modelled in the neighbouring modules, and
  it lacks the Vps34, Pik1 and Fab1 steps.
