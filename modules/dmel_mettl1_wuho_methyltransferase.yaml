id: MODULE:dmel_mettl1_wuho_methyltransferase
title: Mettl1-Wuho tRNA m7G46 methyltransferase in Drosophila melanogaster
description: >-
  The METTL1-WDR4 complex (Trm8-Trm82 in yeast) methylates guanosine 46 in the variable loop
  of many tRNAs at the N7 position, forming m7G46, which stabilizes tRNA structure. METTL1
  is the S-adenosylmethionine-dependent catalytic subunit and the WD40-repeat protein WDR4
  is required for its stability and activity. In Drosophila, the WDR4 ortholog is wuho (wh),
  which binds Mettl1 and is required for male and female germline development.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002114
  title: 'FlyBase gene group METWD: Mettl1-wuho trna (guanine-n(7)-)-methyltransferase complex'
  statement: >-
