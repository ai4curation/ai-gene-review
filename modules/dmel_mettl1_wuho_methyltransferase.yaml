    complex (METWD); this module models that group.
- source_id: GO:0106143
  title: tRNA (m7G46) methyltransferase complex
  statement: >-
    GO term grounding the module as tRNA (m7G46) methyltransferase complex.
notes: >-
  Modelled one part per subunit. The catalytic activity is assigned to Mettl1 by orthology
  to METTL1 and Trm8. FlyBase groups realized by this module: METWD (FBgg0002114). Participants
