notes: >-
  The bacterial 4.5S SRP RNA is an essential molecular component of the first
  role but is not represented by a UniProt protein identifier. It should be
  added as an exact RNA exemplar only after its stable locus/database
  identifier is resolved. SecYEG is the receiving translocon, not a part of the
  SRP targeting module itself. Pseudomonas putida KT2440 Q88MV7 and Q88CR9 are
  exact leaf exemplars, not limits on the reusable bacterial scope.
