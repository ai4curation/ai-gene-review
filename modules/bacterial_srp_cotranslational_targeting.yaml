id: MODULE:bacterial_srp_cotranslational_targeting
title: Bacterial SRP-dependent cotranslational membrane targeting
description: A reusable bacterial module for cotranslational targeting of hydrophobic nascent membrane
  proteins to the cytoplasmic membrane. A signal recognition particle made of the Ffh GTPase and a small
  SRP RNA (4.5S RNA in E. coli and Pseudomonas) binds the signal sequence of a ribosome-nascent-chain
  complex, the peripheral membrane SRP receptor FtsY captures that complex at the membrane, and reciprocal
  GTPase activation in the Ffh-FtsY NG-domain heterodimer promotes handoff to the SecYEG insertion machinery
  and dissociation of Ffh and FtsY. The boundary ends at this handoff; SecYEG-mediated translocation and
  insertion are downstream modules.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0006614
  title: SRP-dependent cotranslational protein targeting to membrane
  statement: GO:0006614 defines the biological-process boundary of the module.
- source_id: GO:0048501
  title: signal recognition particle, plasma membrane targeting
  statement: GO:0048501, the plasma-membrane-targeting child of GO:0048500 signal recognition particle,
    grounds the bacterial Ffh/SRP-RNA ribonucleoprotein.
- source_id: RFAM:RF00169
  title: Bacterial small signal recognition particle RNA
  statement: RF00169 grounds the conserved bacterial 4.5S SRP RNA family used as a required participant
    in nascent-chain recognition.
- source_id: NCBIGene:26969983
  title: Pseudomonas putida KT2440 ffs
  statement: NCBI Gene identifies the KT2440 4.5S SRP RNA as ffs, with aliases PP_RS22200 and PP_mr50,
    on reference chromosome NC_002947.4.
- source_id: UniProtKB:P0AGD7
  title: Escherichia coli K-12 Ffh
  statement: The reviewed E. coli Ffh entry (PTHR11564:SF5) is the experimentally characterized exemplar
    of bacterial Ffh.
- source_id: UniProtKB:P10121
  title: Escherichia coli K-12 FtsY
  statement: The reviewed E. coli FtsY entry (PTHR43134:SF1) is the experimentally characterized exemplar
    of the bacterial SRP receptor.
- source_id: file:ECOLI/ffh/ffh-ai-review.yaml
  title: ECOLI Ffh gene review
  statement: P0AGD7 core functions are signal sequence receptor activity, 7S (4.5S) RNA binding and GTPase
    activity in the plasma-membrane-targeting SRP.
- source_id: file:ECOLI/ftsY/ftsY-ai-review.yaml
  title: ECOLI FtsY gene review
  statement: P10121 core functions are signal recognition particle binding and GTPase activity on the
    cytoplasmic side of the inner membrane.
- source_id: file:interpro/panther/PTHR11564/PTHR11564-review.yaml
  title: PTHR11564 SRP54/Ffh family review
  statement: GTPase and signal sequence receptor activities are family-wide; SRP RNA binding is family-wide
    with a member exception for higher-plant chloroplast SRP54, which lost it.
- source_id: file:interpro/panther/PTHR43134/PTHR43134-review.yaml
  title: PTHR43134 SR alpha/FtsY family review
  statement: SRP binding and SRP-dependent targeting are restricted to subfamily SF1; the FlhF subfamily
    SF3 is a diverged flagellar GTPase.
- source_id: PMID:8107852
  title: Interaction of E. coli Ffh/4.5S ribonucleoprotein and FtsY mimics that of mammalian signal recognition
    particle and its receptor.
  statement: E. coli Ffh/4.5S RNA binds FtsY in a GTP-dependent manner with stimulation of GTP hydrolysis.
- source_id: file:PSEPK/ffh/ffh-ai-review.yaml
  title: PSEPK Ffh gene review
  statement: Q88MV7 is the SRP RNA-binding GTPase component of the bacterial signal recognition particle.
- source_id: file:PSEPK/ftsY/ftsY-ai-review.yaml
  title: PSEPK FtsY gene review
  statement: Q88CR9 is the membrane-associated SRP receptor and partner GTPase.
- source_id: file:projects/P_PUTIDA/batches/ppu03060_bacterial_srp_cotranslational_targeting.tsv
  title: Pseudomonas putida KT2440 SRP-targeting batch
  statement: The focused batch records the exact KT2440 Ffh and FtsY implementations used as leaf exemplars.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_srp_cotranslational_targeting__ppu03060-deep-research-openscientist.md
  title: PSEPK SRP targeting module-pathway-taxon research
  statement: The species-aware retrieval finds the three-part module satisfied by Ffh, the ffs noncoding
    RNA, and FtsY, while separating downstream SecYEG, YidC, signal-peptidase, and parallel Tat components.
