notes: 'Scope is all Bacteria: Ffh, a small SRP RNA and FtsY are near-universal in bacteria, and the two
  reviewed exemplar pairs (E. coli K-12, experimentally characterized; Pseudomonas putida KT2440, the
  originating batch organism) illustrate rather than limit it. The SRP RNA is represented at the conserved-family
  level by RFAM:RF00169 with E. coli and KT2440 ffs loci as exemplars; Gram-positive bacteria such as
  Bacillus subtilis use a longer SRP RNA with an Alu domain, which this family-level grounding covers
  without separate modelling. PANTHER PTHR11564:SF5 (Ffh) is pan-domain and also contains eukaryotic SRP54
  and higher-plant chloroplast SRP54; the latter has lost SRP RNA binding, which the family review records
  as a member exception to a family-wide GO:0008312 scope. PTHR43134 PAINT node PTN000169915 also covers
  the FlhF subfamily (SF3); the SRP-receptor role applies to SF1. SecYEG is the receiving translocon,
  not a part of the SRP targeting module itself.'
