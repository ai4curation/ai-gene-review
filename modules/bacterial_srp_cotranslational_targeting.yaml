id: MODULE:bacterial_srp_cotranslational_targeting
title: Bacterial SRP-dependent cotranslational membrane targeting
description: >-
  A reusable bacterial module for cotranslational targeting of hydrophobic
  nascent membrane proteins to the cytoplasmic membrane. An Ffh/4.5S-RNA signal
  recognition particle binds the ribosome-nascent-chain complex, the SRP
  receptor FtsY captures that complex at the membrane, and reciprocal GTPase
  activation promotes handoff to the SecYEG insertion machinery and dissociation
  of Ffh and FtsY. The boundary ends at this handoff; SecYEG-mediated
  translocation and insertion are downstream modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006614
    title: SRP-dependent cotranslational protein targeting to membrane
    statement: GO:0006614 defines the biological-process boundary of the module.
  - source_id: GO:0048500
    title: signal recognition particle
    statement: GO:0048500 grounds the Ffh/4.5S-RNA ribonucleoprotein particle.
  - source_id: file:PSEPK/ffh/ffh-ai-review.yaml
    title: PSEPK Ffh gene review
    statement: Q88MV7 is the SRP RNA-binding GTPase component of the bacterial signal recognition particle.
  - source_id: file:PSEPK/ftsY/ftsY-ai-review.yaml
    title: PSEPK FtsY gene review
    statement: Q88CR9 is the membrane-associated SRP receptor and partner GTPase.
  - source_id: file:projects/P_PUTIDA/batches/ppu03060_bacterial_srp_cotranslational_targeting.tsv
    title: Pseudomonas putida KT2440 SRP-targeting batch
    statement: The focused batch records the exact KT2440 Ffh and FtsY implementations used as leaf exemplars.
