id: MODULE:lysine_biosynthesis
title: L-lysine biosynthesis by the succinylated diaminopimelate pathway
description: >-
  L-lysine biosynthesis from L-aspartate 4-semialdehyde and pyruvate through the succinylated
  diaminopimelate (DAP) route, the variant used by most Proteobacteria and many other bacteria.
  DapA and DapB form and reduce the tetrahydrodipicolinate intermediate. DapD masks it by
  succinylation, a succinyldiaminopimelate aminotransferase (a dedicated DapC or a bifunctional
  ArgD) introduces the second amino group, and DapE removes the succinyl group. DapF converts
  LL-diaminopimelate to meso-diaminopimelate, and LysA performs the terminal decarboxylation
  to L-lysine. Aspartate kinase and aspartate-semialdehyde dehydrogenase provide a shared
  precursor used by lysine, threonine, and methionine synthesis and are outside the dedicated
  module boundary. The meso-diaminopimelate product also feeds peptidoglycan assembly before
  its conversion to lysine.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0009085
    title: L-lysine biosynthetic process
    statement: The module is grounded in the current GO biological-process term for
      L-lysine biosynthesis.
  - source_id: UniPathway:UPA00034
    title: L-lysine biosynthesis via the diaminopimelate pathway
    statement: >-
      UniPathway grounds the DapA, DapB, DapD, DapC, DapE, DapF, and LysA
      reaction sequence represented here.
  - source_id: KEGG:M00016
    title: Lysine biosynthesis, succinyl-DAP pathway, aspartate => lysine
    statement: >-
      The species-neutral KEGG module independently defines the succinyl-DAP
      route and its DapA-through-LysA reaction sequence.
