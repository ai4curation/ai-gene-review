  notes: >-
    The boundary begins at the first pathway-specific condensation and ends at
    L-lysine formation. Aspartate-semialdehyde supply is shared with other
    aspartate-family amino-acid pathways, while meso-diaminopimelate use in
    peptidoglycan is a downstream branch. The succinylated route is defined by
    the DapD, DapC, and DapE reactions; other taxonomic DAP-pathway variants are
    separate implementations.
