  notes: >-
    The boundary begins at the first pathway-specific condensation and ends at L-lysine formation.
    Aspartate-semialdehyde supply is shared with other aspartate-family amino-acid pathways,
    while meso-diaminopimelate use in peptidoglycan is a downstream branch. The succinylated
    route is defined by the DapD, succinyldiaminopimelate aminotransferase, and DapE reactions;
    the acetylase, dehydrogenase (Ddh) and aminotransferase (DapL) DAP variants and the fungal
    alpha-aminoadipate route (lysine_biosynthesis_aminoadipate) are separate implementations.
    Generalization: the succinylase route is conserved across most Proteobacteria and many
    other bacteria, so the module is species-neutral; E. coli K-12 proteins with direct biochemistry
    are the primary exemplars and P. putida KT2440 orthologs are a second, family-rule-only
    exemplar set. Two reaction steps have alternative enzymes, modelled as parallel annotons:
    DapD exists as type 1 (E. coli; PANTHER PTHR19136 SF52, TIGR00965) and type 2 (Pseudomonas;
    TIGR03536) succinyltransferases, and the transamination is performed by a dedicated DapC
    (TIGR03538) in Pseudomonas but by the bifunctional ArgD (PTHR11986 SF122) and redundant
    aminotransferases in E. coli. Broad or mixed PANTHER families (PTHR12128, PTHR19136, PTHR43808,
    PTHR42832) are reviewed under interpro/panther and are used here only where a subfamily
    or exact PAINT node supports the step.
