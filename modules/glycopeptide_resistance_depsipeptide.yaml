id: MODULE:glycopeptide_resistance_depsipeptide
title: D-Ala-D-Lac glycopeptide resistance
description: >-
  Inducible, high-level resistance to glycopeptide antibiotics achieved by
  re-terminating peptidoglycan precursors. A VanS-VanR two-component system
  induces the resistance operon; VanH reduces pyruvate to D-lactate, a VanA/VanB/VanD-type
  ligase condenses D-alanine with D-lactate to give the depsipeptide D-Ala-D-Lac
  in place of the dipeptide D-Ala-D-Ala, and VanX (with VanY) destroys the
  residual D-Ala-D-Ala pool so that the depsipeptide, not the dipeptide, is the
  substrate offered to the D-Ala-D-Ala adding enzyme. The resulting
  UDP-MurNAc-pentadepsipeptide binds glycopeptides with greatly reduced
  affinity. The module substitutes for, rather than adds to, the Ddl step of
  peptidoglycan precursor biosynthesis, which it includes by reference together
  with the MurF ligation step that consumes its product. A lower-level
  D-Ala-D-Ser route is modeled as an alternative to the depsipeptide route.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0046677
    title: response to antibiotic
    statement: >-
      GO:0046677 is the only GO process term that covers the module as a whole.
      GO has no "glycopeptide resistance" or "response to vancomycin" term, so
      the mechanism is carried by the per-step molecular functions rather than
      by a module-level process term.
  - &id_arthur_review
    source_id: PMID:8852545
    title: Mechanisms of glycopeptide resistance in enterococci.
    statement: >-
      Names the four enzymatic roles of the module and states the mechanism:
      the depsipeptide replaces the dipeptide and the precursors bind
      glycopeptides with reduced affinity.
    supporting_text: >-
      The depsipeptide replaces the dipeptide D-Ala-D-Ala leading to
      production of peptidoglycan precursors which bind glycopeptides with
      reduced affinity.
  - &id_arthur_vanhax
    source_id: PMID:8852545
    title: Mechanisms of glycopeptide resistance in enterococci.
    statement: VanH supplies D-lactate and VanA makes the depsipeptide.
    supporting_text: >-
      Tn1546 encodes the VanH dehydrogenase which reduces pyruvate to D-lactate
      (D-Lac) and the VanA ligase which catalyses synthesis of the depsipeptide
      D-alanyl-D-lactate (D-Ala-D-Lac).
  - &id_arthur_induction
    source_id: PMID:1556077
    title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide peptidoglycan
      precursors in Enterococcus faecium BM4147.
    statement: The resistance enzymes are transcriptionally induced by the VanS-VanR system.
    supporting_text: >-
      Synthesis of these enzymes was regulated at the transcriptional level by
      the VanS-VanR two-component regulatory system encoded by the proximal
      part of the cluster.
  - &id_producers
    source_id: PMID:9736537
    title: Glycopeptide antibiotic resistance genes in glycopeptide-producing organisms.
    statement: >-
      vanH-vanA-vanX clusters with the same gene order are present in
      glycopeptide-producing actinomycetes, which grounds the Actinomycetota
      half of the module's taxon scope.
    supporting_text: >-
      We have cloned three genes encoding homologs of VanH, VanA, and VanX from
      two organisms which produce glycopeptide antibiotics: the A47934 producer
      Streptomyces toyocaensis NRRL 15009 and the vancomycin producer
      Amycolatopsis orientalis C329.2.
module:
  id: glycopeptide_resistance_depsipeptide
  label: D-Ala-D-Lac glycopeptide resistance
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: response to antibiotic
      term:
        id: GO:0046677
        label: response to antibiotic
      description: >-
        The inducible cellular response to a glycopeptide antibiotic that
        re-terminates the peptidoglycan precursor so the drug can no longer bind
        it. This is the broadest available GO process term; GO has no term for
        glycopeptide resistance or for the response to vancomycin specifically.
    - preferred_term: peptidoglycan biosynthetic process
      term:
        id: GO:0009252
        label: peptidoglycan biosynthetic process
      description: >-
        The module is a rerouting of peptidoglycan precursor biosynthesis, not a
        separate pathway: its product enters the normal precursor pool at the
        D-Ala-D-Ala adding (MurF) step.
  context:
    taxa:
      - preferred_term: Bacillota
        term:
          id: NCBITaxon:1239
          label: Bacillota
        description: >-
          The clinically important van clusters (VanA, VanB, VanD, and the
          D-Ala-D-Ser types) are found in enterococci and in staphylococci that
          have acquired Tn1546, both Bacillota.
      - preferred_term: Actinomycetota
        term:
          id: NCBITaxon:201174
          label: Actinomycetota
        description: >-
          Glycopeptide-producing actinomycetes (Amycolatopsis orientalis,
          Streptomyces toyocaensis) and Streptomyces coelicolor carry
          vanHAX-type clusters with the same gene order and a vanRS regulatory
          pair.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
    evidence:
      - *id_producers
    notes: >-
      Curator judgement on scope. The two phyla are named rather than Bacteria
      as a whole because that is where the complete inducible vanRS + vanHAX
      module is documented: Bacillota for the acquired clinical clusters and
      Actinomycetota for the producer and soil clusters, which PMID:9736537
      shows share the gene order. Isolated vanA/vanB/vanX homologs annotated
      across other phyla in UniProt are sequence matches, not demonstrated
      modules, so the scope is deliberately not widened to NCBITaxon:2. Two
      compartments are asserted because the module genuinely spans them: all the
      biosynthetic and hydrolytic steps are cytosolic, while the VanS sensor and
      the VanY carboxypeptidase are membrane proteins.
  parts:
    - order: 1
      role: glycopeptide sensing and operon induction
      node:
        id: vanrs_induction
        label: VanS-VanR induction of the resistance operon
        module_type: REGULATORY_STEP
        description: >-
          A membrane sensor histidine kinase, VanS, controls the phosphorylation
          state of the response regulator VanR, which activates transcription of
          the resistance operon. VanS is bifunctional: its kinase arm
          phosphorylates VanR and its phosphatase arm dephosphorylates
          phospho-VanR, so the resting state is enforced rather than merely
          unstimulated.
        annotons:
          - id: vans_sensor_kinase
            label: VanS sensor histidine kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanS-type glycopeptide-resistance sensor histidine kinases
                description: >-
                  Membrane sensor kinases encoded immediately upstream of a van
                  resistance operon. No PANTHER term is asserted: UniProt places
                  VanS (Q06240) in PANTHER:PTHR45453, whose official name is
                  PHOSPHATE REGULON SENSOR PROTEIN PHOR, a generic sensor-kinase
                  family that is not the VanS role this descriptor means.
                representative_members:
                  - preferred_term: vanS / VanSA (Enterococcus faecium)
                    term:
                      id: UniProtKB:Q06240
                      label: Sensor protein VanS (VanS) (VanSA) (EC 2.7.13.3) (Vancomycin histidine protein
                        kinase) (Vancomycin resistance protein VanS)
            function:
              preferred_term: phosphorelay sensor kinase activity
              term:
                id: GO:0000155
                label: phosphorelay sensor kinase activity
              targets:
                - preferred_term: VanR response regulator
            processes:
              - preferred_term: phosphorelay signal transduction system
                term:
                  id: GO:0000160
                  label: phosphorelay signal transduction system
              - preferred_term: response to antibiotic
                term:
                  id: GO:0046677
                  label: response to antibiotic
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Autophosphorylates on a histidine and transfers the phosphoryl
              group to VanR. The inducing signal is deliberately left
              unspecified: no small-molecule activator is asserted here (see the
              module knowledge gap).
            evidence:
              - &id_wright_kinase
                source_id: PMID:8494882
                title: 'Purification and characterization of VanR and the cytosolic domain of VanS: a
                  two-component regulatory system required for vancomycin resistance in Enterococcus
                  faecium BM4147.'
                statement: VanS autophosphorylates on histidine and phosphorylates VanR.
                supporting_text: >-
                  The MBP-VanS fusion protein displayed an ATP-dependent
                  autophosphorylation on a histidine residue with a rate of 0.17
                  min-1 and a phosphorylation stoichiometry of 10-15%.
              - source_id: PMID:8494882
                title: 'Purification and characterization of VanR and the cytosolic domain of VanS: a
                  two-component regulatory system required for vancomycin resistance in Enterococcus
                  faecium BM4147.'
                statement: Phosphotransfer from phospho-VanS to VanR was demonstrated directly.
                supporting_text: 32P-PhosphoMBP-VanS transferred the phosphoryl group to VanR.
              - &id_vanco_insensitive
                source_id: PMID:30677074
                title: Vancomycin does not affect the enzymatic activities of purified VanSA.
                statement: >-
                  Purified full-length VanSA is insensitive to vancomycin, so
                  vancomycin is not asserted as an activator of this activity.
                supporting_text: >-
                  In both detergent and amphipol solutions, VanSA's enzymatic
                  activities were found to be insensitive to vancomycin, even at
                  levels many times higher than the antibiotic's minimum
                  inhibitory concentration.
              - &id_no_binary_complex
                source_id: PMID:30677074
                title: Vancomycin does not affect the enzymatic activities of purified VanSA.
                statement: Direct activation by a binary antibiotic-kinase complex is argued against.
                supporting_text: >-
                  This result argues against direct activation of VanSA via
                  formation of a binary antibiotic-kinase complex, suggesting
                  instead that either additional factors are required to form a
                  functional signaling complex, or that activation does not
                  require direct interaction with the antibiotic.
            gocam_associations:
              - model: gomodel:671ae02600002832
                activity: gomodel:671ae02600002832/6792e70800000089
                title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
                notes: >-
                  The molecular function, the membrane location and the positive
                  edge onto VanR are taken over unchanged. Two things are not.
                  The model attaches vancomycin as a small-molecule activator
                  (RO:0012001 CHEBI:28001) with direct-assay evidence from
                  PMID:8494882, which assayed only the VanS cytosolic domain and
                  never tested vancomycin; this module asserts no activator. The
                  model also nests GO:0046677 inside GO:0000160; here the
                  phosphorelay is part of the antibiotic response, which is the
                  nesting its own VanR activities use.
          - id: vans_phosphatase
            label: VanS phospho-VanR phosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanS-type glycopeptide-resistance sensor histidine kinases
                description: >-
                  The same protein as vans_sensor_kinase, modeled as a second
                  annoton because the sensor is bifunctional and the two
                  activities act on VanR in opposite directions.
                representative_members:
                  - preferred_term: vanS / VanSA (Enterococcus faecium)
                    term:
                      id: UniProtKB:Q06240
                      label: Sensor protein VanS (VanS) (VanSA) (EC 2.7.13.3) (Vancomycin histidine protein
                        kinase) (Vancomycin resistance protein VanS)
            function:
              preferred_term: phosphoprotein phosphatase activity
              term:
                id: GO:0004721
                label: phosphoprotein phosphatase activity
              targets:
                - preferred_term: phospho-VanR
            processes:
              - preferred_term: phosphorelay signal transduction system
                term:
                  id: GO:0000160
                  label: phosphorelay signal transduction system
              - preferred_term: response to antibiotic
                term:
                  id: GO:0046677
                  label: response to antibiotic
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Dephosphorylates phospho-VanR and so holds the operon off in the
              absence of the inducing signal. GO:0004721 is generic because GO
              has no term for a phosphorelay response-regulator
              (aspartyl-phosphate) phosphatase.
            evidence:
              - &id_vans_phosphatase
                source_id: PMID:30677074
                title: Vancomycin does not affect the enzymatic activities of purified VanSA.
                statement: VanS dephosphorylates VanR to keep it inactive.
                supporting_text: >-
                  In the absence of vancomycin, VanS dephosphorylates VanR,
                  thereby maintaining it in a transcriptionally inactive state.
            gocam_associations:
              - model: gomodel:671ae02600002832
                activity: gomodel:671ae02600002832/6796b94c00000302
                title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
                notes: >-
                  Taken over as correct, except for its target: in the model this
                  edge points at a duplicate VanR node
                  (gomodel:671ae02600002832/6796b94c00000312) that has no
                  outgoing edges, so the inhibitory branch regulates nothing.
                  Here both VanS arms act on the single VanR annoton.
          - id: vanr_activator
            label: VanR transcriptional activator of the van operon
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanR-type glycopeptide-resistance response regulators
                description: >-
                  OmpR-subclass response regulators encoded with a vanS gene
                  upstream of a van resistance operon. No PANTHER term is
                  asserted: UniProt places VanR (Q06239) in PANTHER:PTHR48111
                  REGULATOR OF RPOS, a generic response-regulator family that is
                  not the VanR role meant here.
                representative_members:
                  - preferred_term: vanR / VanRA (Enterococcus faecium)
                    term:
                      id: UniProtKB:Q06239
                      label: Regulatory protein VanR (VanR) (VanRA) (Regulatory protein VanRA)
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
              targets:
                - preferred_term: van resistance operon promoter and its cotranscribed genes (vanH, vanA,
                    vanX and, where present, vanY)
                  description: >-
                    The targets of this activity are the genes of the resistance
                    operon, not their protein products. No gene identifiers are
                    asserted because none was established from a checkable
                    source for this abstract module.
            processes:
              - preferred_term: phosphorelay signal transduction system
                term:
                  id: GO:0000160
                  label: phosphorelay signal transduction system
              - preferred_term: response to antibiotic
                term:
                  id: GO:0046677
                  label: response to antibiotic
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Phosphorylation by VanS raises its affinity for the resistance
              promoter, from which vanH, vanA and vanX are cotranscribed. One
              annoton carries both the activating and the inhibiting input,
              because the phosphorylation state is a state of this activity and
              not a second activity.
            evidence:
              - source_id: PMID:1556077
                title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
                  peptidoglycan precursors in Enterococcus faecium BM4147.
                statement: VanR is an OmpR-subclass transcriptional activator.
                supporting_text: VanR was a transcriptional activator related to response regulators of
                  the OmpR subclass.
              - &id_cotranscription
                source_id: PMID:1556077
                title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
                  peptidoglycan precursors in Enterococcus faecium BM4147.
                statement: The VanR-VanS system activates a promoter for cotranscription of vanH, vanA
                  and vanX.
                supporting_text: >-
                  Analysis of transcriptional fusions with a reporter gene and
                  RNA mapping indicated that the VanR-VanS two-component
                  regulatory system activates a promoter used for
                  cotranscription of the vanH, vanA, and vanX resistance genes.
              - *id_vans_phosphatase
            gocam_associations:
              - model: gomodel:671ae02600002832
                activity: gomodel:671ae02600002832/6792e70800000096
                title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
                notes: >-
                  The model represents VanR twice
                  (gomodel:671ae02600002832/6792e70800000096 and
                  gomodel:671ae02600002832/6796b94c00000312) with the same gene
                  product, function and process, splitting the kinase and
                  phosphatase edges between them; this module has one VanR
                  annoton. The model's has_input is UniProtKB:Q05709, the VanH
                  protein; the targets here are the operon's genes, and vanA and
                  vanX are included as well as vanH. The model gives this
                  activity no location.
        connections:
          - source: vans_sensor_kinase
            target: vanr_activator
            connection_type: POSITIVELY_REGULATES
            description: Phospho-VanS transfers the phosphoryl group to VanR, activating it.
          - source: vans_phosphatase
            target: vanr_activator
            connection_type: NEGATIVELY_REGULATES
            description: VanS dephosphorylates phospho-VanR, returning it to the inactive state.
        evidence:
          - *id_arthur_induction
    - order: 2
      role: D-lactate supply
      node:
        id: d_lactate_supply
        label: VanH reduction of pyruvate to D-lactate
        module_type: REACTION
        description: >-
          A dedicated D-specific 2-keto acid dehydrogenase supplies the
          D-hydroxy acid that the resistance ligase needs, since the normal
          cytoplasmic pool does not contain it at useful concentration.
        annotons:
          - id: vanh_dehydrogenase
            label: VanH D-lactate dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanH-type D-specific 2-keto acid dehydrogenases
                description: >-
                  D-specific 2-hydroxyacid dehydrogenases encoded in van
                  clusters. No PANTHER term is asserted: UniProt places VanH
                  (Q05709) in PANTHER:PTHR43026 2-HYDROXYACID DEHYDROGENASE
                  HOMOLOG 1-RELATED, which is broader than the VanH role.
                representative_members:
                  - preferred_term: vanH (Enterococcus faecium)
                    term:
                      id: UniProtKB:Q05709
                      label: D-specific alpha-keto acid dehydrogenase (EC 1.1.1.272) (EC 1.1.1.345) (D-2-hydroxyacid
                        dehydrogenase) (D-lactate dehydrogenase) (EC 1.1.1.28) (Vancomycin resistance
                        protein VanH)
            function:
              preferred_term: D-lactate dehydrogenase (NAD+) activity
              term:
                id: GO:0008720
                label: D-lactate dehydrogenase (NAD+) activity
              substrates:
                - preferred_term: pyruvate
                - preferred_term: NADH
              products:
                - preferred_term: (R)-lactate
                - preferred_term: NAD+
            processes:
              - preferred_term: response to antibiotic
                term:
                  id: GO:0046677
                  label: response to antibiotic
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Runs in the reduction direction physiologically, giving the
              (R)-lactate consumed by the depsipeptide ligase. Its specificity is
              broader than D-lactate; D-2-hydroxybutyrate is the better ligase
              substrate in vitro, which is why the enzyme is characterized as a
              D-specific 2-keto acid dehydrogenase.
            evidence:
              - source_id: PMID:1931965
                title: 'Molecular basis for vancomycin resistance in Enterococcus faecium BM4147: biosynthesis
                  of a depsipeptide peptidoglycan precursor by vancomycin resistance proteins VanH and
                  VanA.'
                statement: VanH was purified and characterized as a D-specific alpha-keto acid dehydrogenase.
                supporting_text: >-
                  We report purification of VanH to homogeneity,
                  characterization as a D-specific alpha-keto acid
                  dehydrogenase, and comparison with D-lactate dehydrogenases
                  from Leuconostoc mesenteroides and Lactobacillus leichmanii.
              - source_id: PMID:1503450
                title: Evidence for in vivo incorporation of D-lactate into peptidoglycan precursors of
                  vancomycin-resistant enterococci.
                statement: >-
                  Exogenous D-lactate restores resistance to a VanH-deficient
                  strain, showing that this is the step VanH provides.
                supporting_text: >-
                  D-Lactate added to the culture medium restored the vancomycin
                  resistance of a strain that does not produce the VanH
                  dehydrogenase and therefore appears to be a substrate of VanA
                  in vivo.
              - *id_arthur_vanhax
            gocam_associations:
              - model: gomodel:671ae02600002832
                activity: gomodel:671ae02600002832/67369e7600001481
                title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
                notes: >-
                  Taken over as correct. The model gives the activity no
                  location and represents only the (R)-lactate output, not the
                  pyruvate and NADH inputs; both are added here.
    - order: 3
      role: synthesis of the altered dipeptide terminus
      node:
        id: terminal_dipeptide_substitution
        label: Synthesis of the altered D-Ala-X terminus
        module_type: REACTION
        description: >-
          A Ddl-family ligase of altered specificity condenses D-alanine with a
          D-hydroxy acid (D-lactate; the depsipeptide route, high-level
          resistance) or with D-serine (the dipeptide route, low-level
          resistance) in place of the second D-alanine.
        variant_sets:
          - id: altered_terminus_route
            label: Altered precursor terminus
            axis: chemistry of the second residue of the dipeptide terminus
            variant_kind: ROUTE
            selection: EXACTLY_ONE
            notes: >-
              The two routes are alternative chemistries, not redundant
              carriers, and they give different resistance phenotypes: D-Ala-D-Lac
              gives high-level resistance to vancomycin and teicoplanin, while
              D-Ala-D-Ser gives low-level vancomycin resistance with retained
              teicoplanin susceptibility. The D-Ala-D-Ser route also requires a
              serine racemase (VanT) to supply D-serine, which is not modeled
              here.
            variants:
              - id: d_ala_d_lac_route
                label: D-Ala-D-Lac depsipeptide route
                module_type: REACTION
                description: >-
                  An ester bond is formed between D-alanine and D-lactate,
                  giving a depsipeptide that loses one of the five hydrogen
                  bonds the glycopeptide makes with the precursor.
                variant_sets:
                  - id: d_ala_d_lac_ligase
                    label: D-Ala-D-Lac ligase
                    axis: van cluster ligase type
                    variant_kind: REALIZER
                    selection: ONE_OR_MORE
                    notes: >-
                      VanA, VanB and VanD are alternative carriers of the same
                      ligation. They differ in the glycopeptides they cover and
                      in regulation (VanA covers teicoplanin, VanB typically does
                      not, VanD clusters are constitutive and accompanied by a
                      defective host ddl), not in the chemistry of the step. No
                      PANTHER term is asserted on any of them: UniProt places
                      VanA, VanB and VanC alike in PANTHER:PTHR23132
                      D-ALANINE--D-ALANINE LIGASE, which is the family of the
                      normal Ddl enzyme and does not pick out the resistance
                      ligases, let alone the depsipeptide-forming subset.
                    variants:
                      - id: vana_ligase_variant
                        label: VanA-type ligase
                        module_type: REACTION
                        annotons:
                          - id: vana_ligase
                            label: VanA D-alanine-(R)-lactate ligase
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: VanA-type D-alanine-(R)-lactate ligases
                                description: >-
                                  No PANTHER term is asserted for the depsipeptide
                                  ligases (VanA, VanB, VanD): UniProt places P25051 in
                                  the generic D-alanine--D-alanine ligase family
                                  PTHR23132 (subfamily SF25, D-ALANINE--D-ALANINE LIGASE
                                  A), which is the Ddl family the module contrasts them
                                  with, so it does not identify the altered-specificity
                                  role meant here.
                                representative_members:
                                  - preferred_term: vanA (Enterococcus faecium)
                                    term:
                                      id: UniProtKB:P25051
                                      label: Vancomycin/teicoplanin A-type resistance protein VanA (EC
                                        6.1.2.1) (D-alanine--D-lactate ligase) (VanA ligase)
                                  - preferred_term: A0A853B4J9 (Amycolatopsis endophytica D-alanine--(R)-lactate ligase)
                                    term:
                                      id: UniProtKB:A0A853B4J9
                                      label: D-alanine--(R)-lactate ligase (EC 6.1.2.1)
                                    description: >-
                                      Unreviewed actinomycete entry, included as
                                      a second-phylum exemplar of the same
                                      activity; the gene-cluster evidence for
                                      actinomycete vanHAX is PMID:9736537.
                            function:
                              preferred_term: D-alanine-(R)-lactate ligase activity
                              term:
                                id: GO:0160220
                                label: D-alanine-(R)-lactate ligase activity
                              substrates:
                                - preferred_term: D-alanine
                                - preferred_term: (R)-lactate
                                - preferred_term: ATP
                              products:
                                - preferred_term: D-alanyl-(R)-lactate
                                - preferred_term: ADP
                                - preferred_term: phosphate
                            processes:
                              - preferred_term: response to antibiotic
                                term:
                                  id: GO:0046677
                                  label: response to antibiotic
                            locations:
                              - preferred_term: cytosol
                                term:
                                  id: GO:0005829
                                  label: cytosol
                            role_description: >-
                              A D-Ala-D-Ala ligase of altered specificity that
                              makes an ester rather than an amide bond. It acts
                              on the cytoplasmic D-alanine and D-lactate pools
                              and its product feeds the cytoplasmic precursor.
                            evidence:
                              - &id_bugg_ester
                                source_id: PMID:1931965
                                title: 'Molecular basis for vancomycin resistance in Enterococcus faecium
                                  BM4147: biosynthesis of a depsipeptide peptidoglycan precursor by vancomycin
                                  resistance proteins VanH and VanA.'
                                statement: VanA forms an ester bond between D-alanine and the D-hydroxy
                                  acid products of VanH.
                                supporting_text: >-
                                  VanA was found to catalyze ester bond formation
                                  between D-alanine and the D-hydroxy acid
                                  products of VanH, the best substrate being
                                  D-2-hydroxybutyrate (Km = 0.60 mM).
                              - source_id: PMID:2266943
                                title: The VANA glycopeptide resistance protein is related to D-alanyl-D-alanine
                                  ligase cell wall biosynthesis enzymes.
                                statement: >-
                                  Grounds the cytosolic assignment: the paper
                                  that reported a membrane-associated VanA band
                                  concludes VanA is related to the cytoplasmic
                                  D-Ala-D-Ala ligases.
