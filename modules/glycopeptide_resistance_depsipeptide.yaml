    - source: vanrs_induction
      target: dd_carboxypeptidase_trim
      connection_type: POSITIVELY_REGULATES
      description: Where vanY is present in the cluster it is induced with the rest of the operon.
    - source: d_lactate_supply
      target: terminal_dipeptide_substitution
      connection_type: PROVIDES_INPUT_FOR
      description: (R)-lactate made by VanH is a substrate of the depsipeptide ligase.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        The shared intermediate is (R)-lactate, not a CoA thioester, so the CoA
        continuity check does not apply.
    - source: terminal_dipeptide_substitution
      target: murf_incorporation_ref
      connection_type: PROVIDES_INPUT_FOR
      description: The dipeptide analogue is the substrate MurF adds to UDP-MurNAc-tripeptide.
      chaining_status: NOT_APPLICABLE
      chaining_note: No CoA-bearing intermediate links these steps.
    - source: ddl_step_ref
      target: murf_incorporation_ref
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The native route to the same MurF substrate. The two inputs compete, and
        the resistance cluster biases the competition.
      chaining_status: NOT_APPLICABLE
      chaining_note: No CoA-bearing intermediate links these steps.
    - source: d_ala_d_ala_depletion
      target: ddl_step_ref
      connection_type: NEGATIVELY_REGULATES
      description: >-
        VanX hydrolyses the product of the Ddl step, which is how the native
        route is neutralised without Ddl itself being inhibited.
    - source: dd_carboxypeptidase_trim
      target: murf_incorporation_ref
      connection_type: NEGATIVELY_REGULATES
      description: >-
        VanY removes the terminal D-alanine from pentapeptide precursors that
        MurF has already made with D-Ala-D-Ala.
    - source: murf_incorporation_ref
      target: reduced_glycopeptide_affinity
      connection_type: CAUSES
      description: >-
        A precursor carrying the altered terminus binds the glycopeptide with
        greatly reduced affinity.
  gocam_associations:
    - model: gomodel:671ae02600002832
      title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
      notes: >-
        The E. faecium VanA-type instance of this module. All seven activities of
        the cached model map onto annotons here: VanS kinase
        (6792e70800000089), VanS phosphatase (6796b94c00000302), VanR
        (6792e70800000096 and the duplicate 6796b94c00000312), VanH
        (67369e7600001481), VanA (67369e7600000518) and VanX
        (67369e7600001497). Following the GoCamReview
        gocams/671ae02600002832/671ae02600002832-review.yaml, this module differs
        from the model in six places, each deliberate. (1) VanA is cytosolic
        here, not GO:0016020 membrane. (2) VanR is one annoton, not two, and both
        VanS arms act on it. (3) VanR's targets are the operon's genes, not the
        VanH protein, and include vanA and vanX. (4) VanX carries the specific
        GO:0160237 rather than the generic GO:0016805. (5) No small-molecule
        activator is asserted on VanS, because purified full-length VanSA is
        insensitive to vancomycin. (6) The module does not stop at the
        depsipeptide: it continues through MurF by reference and ends at the
        reduced-affinity outcome, and adds VanY. The model is in development
        state, so these are offered as the correct biology rather than as a
        verdict on finished curation.
      evidence:
        - *id_vanco_insensitive
        - *id_no_binary_complex
knowledge_gaps:
  - gap_statement: >-
      The molecular signal that activates VanS is unknown. Purified full-length
      VanSA is insensitive to vancomycin, so the sensor is not a simple
      drug-binding receptor.
    boundary: >-
      Phosphotransfer from VanS to VanR, the phosphatase arm, and the
      transcriptional consequences are all established; only the input to the
      kinase is open.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the module is drawn with the antibiotic as a direct
      ligand of VanS or with an intermediate signal such as a cell-wall
      intermediate, a stalled precursor or an accessory protein. It is the one
      assertion in the subsumed GO-CAM that the literature contradicts.
    resolution: >-
      Test full-length VanS in a defined lipid environment for binding and
      activation by vancomycin-peptidoglycan complexes, by lipid II and
      depsipeptide-containing precursors, and by candidate accessory proteins;
      reconstitute induction in vitro and compare VanS orthologues of VanA-,
      VanB- and producer-type clusters, whose inducer specificities differ.
    provenance:
      - reference_id: PMID:30677074
        supporting_text: >-
          In both detergent and amphipol solutions, VanSA's enzymatic activities
          were found to be insensitive to vancomycin, even at levels many times
          higher than the antibiotic's minimum inhibitory concentration.
      - reference_id: PMID:30677074
        supporting_text: >-
          This result argues against direct activation of VanSA via formation of
          a binary antibiotic-kinase complex, suggesting instead that either
          additional factors are required to form a functional signaling
          complex, or that activation does not require direct interaction with
          the antibiotic.
  - gap_statement: >-
      It is not known how the cell partitions D-alanine between the host Ddl and
      the resistance ligase, nor what sets the fraction of precursors that end
      up depsipeptide-terminated under a given drug exposure.
    boundary: >-
      The individual reactions and VanX's selectivity are quantified in vitro;
      the in vivo flux split is not.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The module's output is a mixture, and the resistance level depends on the
      mixture rather than on the presence of the enzymes alone. This is also why
      the module cannot be read as a simple linear chain.
    resolution: >-
      Measure precursor pools by quantitative mass spectrometry across induction
      levels and in vanX, vanY and ddl mutant backgrounds, and fit a kinetic
      model using the published VanX and ligase constants.
    provenance:
      - reference_id: PMID:7873524
        supporting_text: >-
          The more than 10(5)-fold differential in catalytic efficiency of VanX
          for hydrolysis of D-Ala-D-Ala vs D-Ala-D-lactate leaves D-Ala-D-lactate
          intact for subsequent incorporation into peptidoglycan.
notes: >-
  Created 2026-11-02 as a species-independent module subsuming the development
  GO-CAM gomodel:671ae02600002832.

  Boundary. The module starts at glycopeptide sensing and ends at the
  reduced-affinity precursor. The housekeeping precursor pathway is included by
  reference, not duplicated: ddl_step_ref names the step the Van enzymes
  displace and murf_incorporation_ref the step that consumes their product, both
  pointing into modules/peptidoglycan_precursor_biosynthesis.yaml, which is not
  edited. Transglycosylation, transpeptidation, D-serine supply (VanT) and VanZ
  are outside the boundary.

  Modeling choices worth flagging. VanS appears as two annotons because the
  sensor is genuinely bifunctional and the two activities have opposite signs on
  one VanR annoton; VanR appears once, which is the correction of the GO-CAM's
  duplicated node. The ligase step is a ROUTE set over two chemistries with a
  REALIZER set over VanA/VanB/VanD nested inside the depsipeptide route, so the
  D-Ala-D-Ser types are alternatives to the depsipeptide rather than
  interchangeable carriers of it. VanY is an optional part, grounded on the
  statement that it only slightly increases resistance.

  PANTHER discipline. Terms are asserted only for VanX (PTHR43126) and VanY
  (PTHR34385), where the official PANTHER name matches the descriptor and the
  representative members' UniProt records list that family. No term is asserted
  for the ligases, VanH, VanS or VanR: UniProt does place them in real families
  (PTHR23132, PTHR43026, PTHR45453, PTHR48111), but those families are the
  generic Ddl, 2-hydroxyacid dehydrogenase, PhoR-like sensor and RpoS-regulator
  families, which do not pick out the van-cluster roles these descriptors mean.
  Per the repository rule, no id is better than a misleading one.

  Representative members span two phyla where that could be verified against
  UniProt: VanX has an enterococcal and a Streptomyces coelicolor exemplar, and
  the VanA-type ligase has an enterococcal and an Amycolatopsis one. No gene
  reviews exist for any of the enterococcal Van proteins, so module QC will
  report every grounding as lacking a review; the UniProt accessions were each
  checked through the UniProt REST API on 2026-11-02.
