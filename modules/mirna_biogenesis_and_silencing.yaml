    - order: 5
      role: recruitment of a GW182-family scaffold (TNRC6A/B/C) by the miRNA-loaded Argonaute
      node:
        id: tnrc6_recruitment
        label: TNRC6 (GW182) binding to AGO and recruitment of deadenylases
        module_type: REGULATORY_STEP
        description: >-
          The N-terminal GW-repeat region of TNRC6 proteins contains several tryptophan-containing
          "AGO hooks" that dock into pockets on the Argonaute PIWI domain. The C-terminal silencing
          domain carries a PAM2 motif that binds PABPC1 and tryptophan motifs (CIM-1 and CIM-2) that
          bind CNOT1 and the W-binding pockets of CNOT9, and it binds PAN3. TNRC6 is thus the adaptor
          that converts target recognition by AGO into deadenylation, translational repression and
          decay. The three paralogs are largely redundant.
        concepts:
          - preferred_term: miRNA-mediated gene silencing by mRNA destabilization
            term:
              id: GO:0035279
              label: miRNA-mediated gene silencing by mRNA destabilization
        annotons:
