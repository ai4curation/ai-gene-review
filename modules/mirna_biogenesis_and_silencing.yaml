      connection_type: PROVIDES_INPUT_FOR
      description: The 5'-monophosphate mRNA left by DCP2 is the XRN1 substrate.
      chaining_status: NOT_APPLICABLE
      chaining_note: RNA intermediates, not CoA carriers.
