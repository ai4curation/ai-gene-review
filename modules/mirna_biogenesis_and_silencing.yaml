      chaining_status: NOT_APPLICABLE
      chaining_note: Protein recruitment, not a metabolite chain.
    - source: tnrc6_recruitment
      target: target_deadenylation
      connection_type: POSITIVELY_REGULATES
      description: >-
        TNRC6 recruits CCR4-NOT (through CNOT1 and CNOT9) and PAN2-PAN3 (through PAN3) to the target
        and stimulates processive deadenylation by CCR4-NOT.
    - source: target_deadenylation
      target: target_decapping
      connection_type: PRECEDES
      description: >-
        Decapping follows deadenylation; CNOT1-bound DDX6 links the two steps.
      chaining_status: NOT_APPLICABLE
      chaining_note: Sequential mRNA-decay steps on the same RNA, not a CoA chain.
    - source: target_decapping
