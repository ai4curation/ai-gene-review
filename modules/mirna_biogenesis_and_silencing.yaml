              and carries out dicing, guide-strand selection and AGO2 loading.
            supporting_text: >-
              The reconstituted RLC, containing one copy of each protein, has the dicing, slicing,
              guide-strand selection, and Ago2-loading activities observed for the endogenous RLC.
          - source_id: PMID:15260970
            statement: miRNAs are loaded into AGO1-AGO4 without sequence preference.
            supporting_text: >-
