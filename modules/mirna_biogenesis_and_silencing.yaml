    - order: 6
      role: deadenylation of the target mRNA by the TNRC6-recruited CCR4-NOT and PAN2-PAN3 complexes
      node:
        id: target_deadenylation
        label: Deadenylation of miRNA targets by CCR4-NOT and PAN2-PAN3
        module_type: PROTEIN_COMPLEX
        description: >-
