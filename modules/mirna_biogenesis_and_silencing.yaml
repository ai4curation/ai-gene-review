    - order: 7
      role: removal of the 5' cap from the deadenylated target by DCP2 and its activators
      node:
        id: target_decapping
        label: Decapping of miRNA targets by DCP2-DCP1 with DDX6, PATL1, EDC3 and EDC4
        module_type: PROTEIN_COMPLEX
        description: >-
          DCP2 is the Nudix hydrolase that removes the m7G cap, releasing m7GDP and a 5'-monophosphate
          mRNA. DCP1 (DCP1A or DCP1B) binds and stimulates DCP2; EDC4 is the scaffold that holds DCP1
          and DCP2 together in human cells, and EDC3 binds DCP1 and DDX6. DDX6 (bound to CNOT1) and
          PATL1 link the deadenylated mRNA to the decapping complex and also repress translation.
          The step is general mRNA decay machinery recruited to miRNA targets after deadenylation.
        concepts:
          - preferred_term: deadenylation-dependent decapping of nuclear-transcribed mRNA
            term:
              id: GO:0000290
              label: deadenylation-dependent decapping of nuclear-transcribed mRNA
        evidence:
