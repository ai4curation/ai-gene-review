            statement: In mammalian cells DCP2 decapping follows deadenylation.
            supporting_text: >-
              DCP2-mediated decapping takes place after deadenylation
          - source_id: PMID:24768540
            statement: >-
              CNOT1 binds DDX6, a translational repressor and decapping activator, linking miRNA target
              recognition to deadenylation and decapping.
            supporting_text: >-
