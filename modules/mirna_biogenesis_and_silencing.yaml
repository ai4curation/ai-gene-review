          CNOT7 or CNOT8, and the EEP-type CNOT6 or CNOT6L), the CNOT9 subunit whose tryptophan-binding
          pockets dock TNRC6, a NOT module (CNOT2, CNOT3) and CNOT10-CNOT11. CNOT1 also binds DDX6,
          which links deadenylation to translational repression and decapping (part 7).
