    - order: 4
      role: loading of the miRNA duplex into an Argonaute and guide-strand selection (miRISC assembly)
      node:
        id: ago_loading
        label: Argonaute (AGO1-AGO4) loading and miRISC formation
        module_type: PROTEIN_COMPLEX
        description: >-
          DICER1-TARBP2 hands the duplex to an Argonaute in the RISC-loading complex. The Argonaute keeps
          the strand whose 5' end is less stably paired (the guide), anchoring its 5' phosphate in the
          MID domain and its 3' end in the PAZ domain, and discards the passenger strand. The four
          human Argonautes bind miRNAs without sequence preference and are largely redundant for
          seed-mediated repression; they differ in slicing. AGO2 cleaves perfectly paired targets and
          also cuts the passenger strand of perfectly paired duplexes; AGO1 and AGO4 lack efficient
          slicer activity, and AGO3 slices only with particular guides and targets. The loaded
          Argonaute is the core of miRISC and the hand-off point to the TNRC6 effectors.
