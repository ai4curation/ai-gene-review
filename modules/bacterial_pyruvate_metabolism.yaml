id: MODULE:bacterial_pyruvate_metabolism
title: Bacterial pyruvate oxidation, anaplerosis, and PEP interconversion
description: 'A reusable bacterial central-carbon module centered on three direct fates of pyruvate and
  phosphoenolpyruvate: oxidative conversion of pyruvate to acetyl-CoA by the pyruvate dehydrogenase complex,
  replenishment of oxaloacetate by pyruvate carboxylase or phosphoenolpyruvate carboxylase, and direct
  interconversion between phosphoenolpyruvate and pyruvate. The module excludes complete glycolysis, the
  tricarboxylic acid cycle, lactate and acetate utilization, amino-acid degradation, methylglyoxal detoxification,
  fatty-acid synthesis, and other reactions included on broad pathway maps.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0006090
  title: pyruvate metabolic process
  statement: Defines the shared pyruvate-centered biological-process scope.
- source_id: GO:0006086
  title: pyruvate decarboxylation to acetyl-CoA
  statement: Defines the oxidative pyruvate dehydrogenase branch.
- source_id: RHEA:19189
  title: pyruvate dehydrogenase E1 reaction
  statement: Defines reductive acetylation of the E2 lipoyl arm by pyruvate dehydrogenase E1.
- source_id: RHEA:17017
  title: dihydrolipoyllysine-residue acetyltransferase reaction
  statement: Defines acetyl transfer from the E2 lipoyl arm to coenzyme A.
- source_id: RHEA:15045
  title: dihydrolipoyl dehydrogenase reaction
  statement: Defines NAD-dependent reoxidation of the reduced lipoyl arm.
- source_id: RHEA:20844
  title: pyruvate carboxylase reaction
  statement: Defines ATP-dependent carboxylation of pyruvate to oxaloacetate.
- source_id: RHEA:28370
  title: phosphoenolpyruvate carboxylase reaction
  statement: Defines carboxylation of phosphoenolpyruvate to oxaloacetate.
- source_id: RHEA:18157
  title: pyruvate kinase reaction
  statement: Defines phosphoenolpyruvate conversion to pyruvate with ATP formation.
- source_id: RHEA:11364
  title: phosphoenolpyruvate synthase reaction
  statement: Defines ATP-driven pyruvate conversion to phosphoenolpyruvate.
- source_id: PMID:24157795
  title: Insights into the carboxyltransferase reaction of pyruvate carboxylase from the structures of
    bound product and intermediate analogs
  statement: Establishes transfer of a carboxyl group from carboxybiotin to pyruvate by the pyruvate-carboxylase
    carboxyltransferase domain.
- source_id: file:genes/ECOLI/lpd/lpd-ai-review.yaml
  title: ECOLI lpd gene review
  statement: E. coli LpdA grounds the E3 dihydrolipoyl dehydrogenase role in the pyruvate dehydrogenase
    complex.
- source_id: file:genes/ECOLI/aceE/aceE-ai-review.yaml
  title: ECOLI aceE gene review
  statement: E. coli AceE grounds the PDH E1 role with structural and kinetic evidence.
- source_id: file:genes/ECOLI/aceF/aceF-ai-review.yaml
  title: ECOLI aceF gene review
  statement: E. coli AceF grounds the PDH E2 acetyltransferase core.
- source_id: file:genes/ECOLI/ppc/ppc-ai-review.yaml
  title: ECOLI ppc gene review
  statement: E. coli Ppc grounds PEP carboxylase activity and its anaplerotic role.
- source_id: file:genes/ECOLI/pykF/pykF-ai-review.yaml
  title: ECOLI pykF gene review
  statement: E. coli PykF grounds pyruvate kinase activity.
- source_id: file:genes/ECOLI/ppsA/ppsA-ai-review.yaml
  title: ECOLI ppsA gene review
  statement: E. coli PpsA grounds PEP synthase activity.
- source_id: file:genes/BACSU/pycA/pycA-ai-review.yaml
  title: BACSU pycA gene review
  statement: B. subtilis PycA grounds the single-chain pyruvate carboxylase route.
- source_id: file:genes/PSEPK/pycA/pycA-ai-review.yaml
  title: PSEPK pycA gene review
  statement: KT2440 PycA/PycB ground the two-subunit pyruvate carboxylase route.
- source_id: PMID:27708276
  title: A distinct holoenzyme organization for two-subunit pyruvate carboxylase.
  statement: 'Defines the two-subunit PC architecture: biotin carboxylase alpha subunit and carboxyltransferase
    plus BCCP beta subunit.'
notes: The module is intentionally narrower than a KEGG pyruvate-metabolism map. Cofactor installation,
  upstream pyruvate production by complete glycolytic or Entner-Doudoroff routes, downstream acetyl-CoA
  and oxaloacetate utilization, and substrate-specific routes that merely produce or consume pyruvate
  are cross-module dependencies. An organism may realize one or more anaplerotic routes and one or both
  direct PEP/pyruvate directions. The pyruvate dehydrogenase branch is optional because bacteria may instead
  oxidize pyruvate through enzymes such as pyruvate:ferredoxin oxidoreductase, particularly under anaerobic
  conditions. The module is species-neutral. Each leaf is grounded in an experimentally characterised
  exemplar (E. coli AceE, AceF, LpdA, Ppc, PykF and PpsA; B. subtilis PycA; human PC) and in the P. putida
  KT2440 members, which carry the original instance. The E3 annoton is grounded at the PTHR22912 family
  root because the E3 enzymes of PDH sit in several subfamilies (E. coli LpdA in SF160, KT2440 LpdG in
  SF224); the earlier KT2440 exemplar Lpd (PP_5366, Q88C17) was an LPD-3 paralog and is no longer listed.
  KT2440 LpdG (SF224) is described in its own gene review and in the PTHR22912 family review; it is not
  listed as an E3 representative here because it is not in SF160. Lineages with single-chain pyruvate
  carboxylase, two-subunit pyruvate carboxylase and PEP carboxylase are all represented as anaplerotic
  alternatives.
