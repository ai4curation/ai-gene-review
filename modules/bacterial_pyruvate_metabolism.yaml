    - BIOLOGY
  - gap_statement: Phosphoenolpyruvate is partitioned between pyruvate kinase and phosphoenolpyruvate
      carboxylase, while opposing PpsA activity can create a potentially wasteful PEP-pyruvate cycle.
      The condition-specific flux split and regulatory controls vary among bacteria.
