  knowledge_gaps:
    - gap_statement: >-
        The distribution and physiological weighting of pyruvate carboxylase and
        phosphoenolpyruvate carboxylase vary with bacterial lineage and carbon source.
      boundary: Represent both as ONE_OR_MORE alternatives without asserting universal co-occurrence.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Pyruvate-forming lactate oxidation, malic-enzyme activity, acetate
        conversion, and numerous substrate-specific degradative reactions can
        intersect the pyruvate node without defining this reusable core.
      boundary: Keep those routes outside unless comparative evidence supports a dedicated reusable submodule.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Phosphoenolpyruvate is partitioned between pyruvate kinase and
        phosphoenolpyruvate carboxylase, while opposing PpsA activity can create
        a potentially wasteful PEP-pyruvate cycle. The condition-specific flux
        split and regulatory controls vary among bacteria.
      boundary: >-
        Model the competing reactions without asserting simultaneous net flux
        or a universally active futile cycle.
      gap_kind:
        - BIOLOGY
