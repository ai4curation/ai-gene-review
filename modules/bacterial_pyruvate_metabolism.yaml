id: MODULE:bacterial_pyruvate_metabolism
title: Bacterial pyruvate oxidation, anaplerosis, and PEP interconversion
description: >-
  A reusable bacterial central-carbon module centered on three direct fates of
  pyruvate and phosphoenolpyruvate: oxidative conversion of pyruvate to
  acetyl-CoA by the pyruvate dehydrogenase complex, replenishment of
  oxaloacetate by pyruvate carboxylase or phosphoenolpyruvate carboxylase, and
  direct interconversion between phosphoenolpyruvate and pyruvate. The module
  excludes complete glycolysis, the tricarboxylic acid cycle, lactate and
  acetate utilization, amino-acid degradation, methylglyoxal detoxification,
  fatty-acid synthesis, and other reactions included on broad pathway maps.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006090
    title: pyruvate metabolic process
    statement: Defines the shared pyruvate-centered biological-process scope.
  - source_id: GO:0006086
    title: pyruvate decarboxylation to acetyl-CoA
    statement: Defines the oxidative pyruvate dehydrogenase branch.
  - source_id: RHEA:19189
    title: pyruvate dehydrogenase E1 reaction
    statement: Defines reductive acetylation of the E2 lipoyl arm by pyruvate dehydrogenase E1.
  - source_id: RHEA:17017
    title: dihydrolipoyllysine-residue acetyltransferase reaction
    statement: Defines acetyl transfer from the E2 lipoyl arm to coenzyme A.
  - source_id: RHEA:15045
    title: dihydrolipoyl dehydrogenase reaction
    statement: Defines NAD-dependent reoxidation of the reduced lipoyl arm.
  - source_id: RHEA:20844
    title: pyruvate carboxylase reaction
    statement: Defines ATP-dependent carboxylation of pyruvate to oxaloacetate.
  - source_id: RHEA:28370
    title: phosphoenolpyruvate carboxylase reaction
    statement: Defines carboxylation of phosphoenolpyruvate to oxaloacetate.
  - source_id: RHEA:18157
    title: pyruvate kinase reaction
    statement: Defines phosphoenolpyruvate conversion to pyruvate with ATP formation.
  - source_id: RHEA:11364
    title: phosphoenolpyruvate synthase reaction
    statement: Defines ATP-driven pyruvate conversion to phosphoenolpyruvate.
  - source_id: PMID:24157795
    title: Insights into the carboxyltransferase reaction of pyruvate carboxylase from the structures of bound product and intermediate analogs
    statement: Establishes transfer of a carboxyl group from carboxybiotin to pyruvate by the pyruvate-carboxylase carboxyltransferase domain.
notes: >-
  The module is intentionally narrower than a KEGG pyruvate-metabolism map.
  Cofactor installation, upstream pyruvate production by complete glycolytic or
  Entner-Doudoroff routes, downstream acetyl-CoA and oxaloacetate utilization,
  and substrate-specific routes that merely produce or consume pyruvate are
  cross-module dependencies. An organism may realize one or more anaplerotic
  routes and one or both direct PEP/pyruvate directions. The pyruvate
  dehydrogenase branch is optional because bacteria may instead oxidize
  pyruvate through enzymes such as pyruvate:ferredoxin oxidoreductase,
  particularly under anaerobic conditions.
