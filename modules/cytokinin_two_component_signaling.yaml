id: MODULE:cytokinin_two_component_signaling
title: Cytokinin two-component (His-Asp phosphorelay) signaling in Arabidopsis
description: >-
  The cytokinin signal transduction pathway of Arabidopsis thaliana is a eukaryotic
  multistep His-Asp phosphorelay. Cytokinins bind the extracytosolic CHASE domains of
  three partially redundant hybrid sensor histidine kinase receptors (AHK2, AHK3 and
  CRE1/AHK4), located mainly in the endoplasmic reticulum membrane. Ligand binding
  activates autophosphorylation of a conserved histidine in the transmitter domain;
  the phosphoryl group passes to an aspartate in the receptor's receiver domain and
  then to a conserved histidine of the small, nucleocytosolic histidine phosphotransfer
  proteins (AHP1, AHP2, AHP3, AHP5). AHPs deliver the phosphoryl group to the receiver
  aspartate of nuclear type-B response regulators (principally ARR1, ARR10 and ARR12),
  which are Myb-related (GARP) DNA-binding transcription factors; receiver
  phosphorylation activates them to bind AGAT(T)-containing cis-elements and induce
  cytokinin primary-response genes. Among these targets are the type-A response
  regulators (e.g. ARR5), receiver-only proteins that are themselves phosphorylated
  and stabilized through the relay and attenuate the pathway, closing a negative
  feedback loop. Without ligand, CRE1/AHK4 can reverse the relay and dephosphorylate
  AHPs. The phosphorelay core (receptor -> AHP -> type-B ARR) conforms to the generic
  two-component relay motif; transcriptional output and type-A feedback are this
  pathway's extensions. Cytokinin biosynthesis, transport and degradation, the
  cytokinin-independent histidine kinase CKI1, CRFs, and downstream developmental
  targets are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009736
    title: cytokinin-activated signaling pathway
    statement: The module is grounded in the GO biological process term for cytokinin-activated signaling.
  - source_id: PMID:12068096
    title: Two-component signal transduction pathways in Arabidopsis.
    statement: >-
      The pathway is a four-step multistep phosphorelay - receptor histidine kinases, AHP
      carriers, type-B ARR transcriptional activators and type-A ARR negative feedback.
    supporting_text: >-
      A multistep two-component phosphorelay system with distinct AHK, AHP, and ARR proteins
      plays a central role in cytokinin signal transduction
  - source_id: PMID:11574878
    title: Two-component circuitry in Arabidopsis cytokinin signal transduction.
    statement: >-
      AHPs shuttle between cytoplasm and nucleus, type-B ARRs act as transcriptional
      activators, and type-A ARRs mediate negative feedback.
    supporting_text: >-
      The cytokinin-inducible ARR4, ARR5, ARR6 and ARR7 genes encode transcription repressors
      that mediate a negative feedback loop in cytokinin signalling.
  - source_id: PMID:15166290
    title: In planta functions of the Arabidopsis cytokinin receptor family.
    statement: Loss of all three receptors abolishes cytokinin responses.
    supporting_text: >-
      Plants carrying mutations in all three genes did not show cytokinin responses
  - source_id: PMID:21709172
    title: The cytokinin receptors of Arabidopsis are located mainly to the endoplasmic reticulum.
    statement: The receptors reside mainly in the ER membrane.
    supporting_text: >-
      the large majority of cytokinin receptors are localized to the ER, suggesting a central
      role of this compartment in cytokinin signaling
  - source_id: file:ARATH/AHK2/AHK2-ai-review.yaml
    title: AHK2 gene review
    statement: Receptor annoton function GO:0009885 matches the AHK2 core function.
  - source_id: file:ARATH/AHK3/AHK3-ai-review.yaml
    title: AHK3 gene review
    statement: Receptor annoton function GO:0009885 matches the AHK3 core function.
  - source_id: file:ARATH/AHK4/AHK4-ai-review.yaml
    title: AHK4 gene review
    statement: Receptor annoton function GO:0009885 matches the AHK4 core function.
  - source_id: file:ARATH/AHP1/AHP1-ai-review.yaml
    title: AHP1 gene review
    statement: Phosphotransfer annoton function GO:0009927 matches the AHP1 core function.
  - source_id: file:ARATH/ARR1/ARR1-ai-review.yaml
    title: ARR1 gene review
    statement: Type-B annoton functions GO:0000156 and GO:0001216 match the ARR1 core functions.
  - source_id: file:ARATH/ARR12/ARR12-ai-review.yaml
    title: ARR12 gene review
    statement: Type-B annoton functions GO:0000156 and GO:0001216 match the ARR12 core functions.
  - source_id: file:ARATH/ARR5/ARR5-ai-review.yaml
    title: ARR5 gene review
    statement: Type-A annoton function GO:0000156 with GO:0080037 matches the ARR5 core function.
notes: >-
  Concrete Arabidopsis realization. The phosphorelay core is declared as an inner bundle
  (`ck_phosphorelay`) that conforms to MODULE:two_component_relay (sensor kinase -> Hpt ->
  response regulator); the receptor tier uses the receptor-kinase term GO:0009885
  (transmembrane histidine kinase cytokinin receptor activity), a cytokinin-specific
  realization of the sensor-kinase role (GO:0000155 phosphorelay sensor kinase activity is
  also annotated to all three receptors), hence status WITH_DEVIATIONS. Members are grounded
  with verified UniProtKB accessions (AHK2 Q9C5U2, AHK3 Q9C5U1, AHK4 Q9C5U0, AHP1 Q9ZNV9,
  ARR1 Q940D0, ARR12 P62598, ARR5 Q9SB04). Only the seven reviewed members are listed as
  participants; redundant paralogs (AHP2, AHP3, AHP5; ARR10 and other subfamily-1 type-B
  ARRs; ARR3/4/6/7/8/9/15/16/17 type-A ARRs) perform the same roles and are named in prose
  only. AHP6 (a pseudo-HPt lacking the phospho-accepting histidine) is an inhibitor and
  outside this boundary. GOA IBA rows place the receptor kinase function at PAINT node
  PTN000703785 and the AHP phosphotransfer function at PTN002000688; these are recorded here
  as provenance rather than asserted ancestral nodes. No production GO-CAM in
  gocams/index.tsv contains these genes, so no gocam_associations are declared.
module:
  id: cytokinin_two_component_signaling
  label: Cytokinin two-component signaling (AHK -> AHP -> ARR phosphorelay)
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: cytokinin-activated signaling pathway
      term:
        id: GO:0009736
        label: cytokinin-activated signaling pathway
      description: >-
        Cytokinin perception by CHASE-domain receptor histidine kinases and signal transduction
        through the AHP phosphorelay to type-B ARR transcription factors, with type-A ARR feedback.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: >-
          The receptor/AHP/ARR architecture is conserved across land plants, but the members
          listed here are the Arabidopsis proteins.
  parts:
    - order: 1
      role: multistep phosphorelay core (conforms to two_component_relay)
      node:
        id: ck_phosphorelay
        label: Cytokinin receptor -> AHP -> type-B ARR phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          Cytokinin-activated receptor histidine kinases phosphorylate AHP proteins, which
          transfer the phosphoryl group to the receiver domain of nuclear type-B ARRs.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                tier 1 sensor function is the cytokinin-specific receptor term GO:0009885
                (transmembrane histidine kinase cytokinin receptor activity) rather than the
                template's GO:0000155; the receptors also carry GO:0000155 in their gene reviews.
              - >-
                the sensor is a hybrid histidine kinase with its own receiver domain, so the
                first His->Asp transfer is intramolecular before phosphotransfer to the Hpt tier.
            notes: >-
              AHK2/AHK3/AHK4 (sensor tier; annotated GO:0000155 and the more specific receptor
              term GO:0009885) -> AHP1 (Hpt tier, GO:0009927) -> ARR1/ARR12 (response regulator
              tier, GO:0000156) fills the linear His->Asp->His->Asp relay. Deviations: the
              sensor tier is represented by the cytokinin receptor-kinase term rather than the
              template's GO:0000155, and the sensor is a hybrid kinase with its own receiver
              domain (the first His->Asp step is intramolecular).
        parts:
          - order: 1
            role: cytokinin receptor histidine kinases
            node:
              id: ck_receptors
              label: Cytokinin perception and receptor autophosphorylation
              module_type: REACTION
              description: >-
                Cytokinin binding to the CHASE domain of AHK2, AHK3 or CRE1/AHK4 in the ER
                membrane activates autophosphorylation and intramolecular transfer to the
                receiver domain, from which the phosphoryl group is passed to AHPs. The three
                receptors are partially redundant; AHK3 dominates in leaves and AHK4 in roots.
              annotons:
                - id: ahk2_receptor
                  label: AHK2 cytokinin receptor histidine kinase
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AHK2
                      description: CHASE-domain cytokinin receptor histidine kinase.
                      term:
                        id: UniProtKB:Q9C5U2
                        label: Histidine kinase 2
                  function:
                    preferred_term: transmembrane histidine kinase cytokinin receptor activity
                    term:
                      id: GO:0009885
                      label: transmembrane histidine kinase cytokinin receptor activity
                    targets:
                      - preferred_term: AHP1
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  role_description: Perceives cytokinin and phosphorylates AHPs.
                - id: ahk3_receptor
                  label: AHK3 cytokinin receptor histidine kinase
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AHK3
                      description: CHASE-domain cytokinin receptor histidine kinase (ORE12).
                      term:
                        id: UniProtKB:Q9C5U1
                        label: Histidine kinase 3
                  function:
                    preferred_term: transmembrane histidine kinase cytokinin receptor activity
                    term:
                      id: GO:0009885
                      label: transmembrane histidine kinase cytokinin receptor activity
                    targets:
                      - preferred_term: AHP1
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  role_description: Perceives cytokinin and phosphorylates AHPs; dominant receptor in leaves.
                - id: ahk4_receptor
                  label: CRE1/AHK4 cytokinin receptor histidine kinase
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AHK4
                      description: CHASE-domain cytokinin receptor histidine kinase (CRE1/WOL).
                      term:
                        id: UniProtKB:Q9C5U0
                        label: Histidine kinase 4
                  function:
                    preferred_term: transmembrane histidine kinase cytokinin receptor activity
                    term:
                      id: GO:0009885
                      label: transmembrane histidine kinase cytokinin receptor activity
                    targets:
                      - preferred_term: AHP1
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  role_description: >-
                    Perceives cytokinin and phosphorylates AHPs; without ligand it reverses
                    the relay and dephosphorylates AHPs. Dominant receptor in roots and vasculature.
          - order: 2
            role: histidine phosphotransfer (Hpt) relay
            node:
              id: ck_ahp_relay
              label: AHP histidine phosphotransfer
              module_type: REACTION
              description: >-
                Nucleocytosolic AHPs (AHP1, AHP2, AHP3, AHP5, acting redundantly) accept the
                phosphoryl group from the receptor receiver domain on a conserved histidine and
                transfer it to the receiver aspartate of nuclear response regulators.
              annotons:
                - id: ahp1_phosphotransfer
                  label: AHP1 histidine phosphotransfer
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AHP1
                      description: Histidine-containing phosphotransfer protein (ATHP3).
                      term:
                        id: UniProtKB:Q9ZNV9
                        label: Histidine-containing phosphotransfer protein 1
                  function:
                    preferred_term: histidine phosphotransfer kinase activity
                    term:
                      id: GO:0009927
                      label: histidine phosphotransfer kinase activity
                    targets:
                      - preferred_term: ARR1
                      - preferred_term: ARR12
                      - preferred_term: ARR5
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Relays the phosphoryl group from receptors to type-B and type-A ARRs.
          - order: 3
            role: type-B response regulator receiver phosphorylation
            node:
              id: ck_typeb_receiver
              label: Type-B ARR receiver-domain phosphorylation
              module_type: REACTION
              description: >-
                Phosphotransfer from AHPs to the conserved aspartate of the type-B ARR receiver
                domain relieves its inhibition of the output domain.
              annotons:
                - id: arr1_receiver
                  label: ARR1 phosphorelay response regulator activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: ARR1
                      description: Subfamily-1 type-B response regulator.
                      term:
                        id: UniProtKB:Q940D0
                        label: Two-component response regulator ARR1
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Receives the phosphoryl group from AHPs.
                - id: arr12_receiver
                  label: ARR12 phosphorelay response regulator activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: ARR12
                      description: Subfamily-1 type-B response regulator.
                      term:
                        id: UniProtKB:P62598
                        label: Two-component response regulator ARR12
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Receives the phosphoryl group from AHPs.
        connections:
          - source: ck_receptors
            target: ck_ahp_relay
            connection_type: CAUSES
            description: Activated receptors transfer the phosphoryl group to AHPs.
          - source: ck_ahp_relay
            target: ck_typeb_receiver
            connection_type: CAUSES
            description: AHPs deliver the phosphoryl group to type-B ARR receiver domains.
    - order: 2
      role: type-B ARR transcriptional output
      node:
        id: ck_typeb_transcription
        label: Type-B ARR transcriptional activation of cytokinin primary-response genes
        module_type: REACTION
        description: >-
          Phosphorylated type-B ARRs (ARR1, ARR10, ARR12) bind AGAT(T)-containing promoter
          elements through their GARP/B-motif domain and activate cytokinin primary-response
          genes, including the type-A ARRs.
        annotons:
          - id: arr1_transactivation
            label: ARR1 DNA-binding transcription activator activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ARR1
                term:
                  id: UniProtKB:Q940D0
                  label: Two-component response regulator ARR1
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Activates transcription of cytokinin primary-response genes such as type-A ARRs.
          - id: arr12_transactivation
            label: ARR12 DNA-binding transcription activator activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ARR12
                term:
                  id: UniProtKB:P62598
                  label: Two-component response regulator ARR12
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Activates transcription of cytokinin-responsive genes.
    - order: 3
      role: type-A ARR negative feedback
      node:
        id: ck_typea_feedback
        label: Type-A ARR negative feedback on the phosphorelay
        module_type: REGULATORY_STEP
        description: >-
          Cytokinin-induced type-A ARRs (e.g. ARR5), receiver-only response regulators, are
          phosphorylated via AHPs; phosphorylation is required for their activity and
          stabilizes them. They attenuate cytokinin signaling, probably by competing with
          type-B ARRs for AHP-derived phosphoryl groups and through phosphorylation-dependent
          interactions.
        annotons:
          - id: arr5_feedback
            label: ARR5 phosphorelay response regulator activity (negative feedback)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ARR5
                description: Type-A response regulator (IBC6).
                term:
                  id: UniProtKB:Q9SB04
                  label: Two-component response regulator ARR5
            function:
              preferred_term: phosphorelay response regulator activity
              term:
                id: GO:0000156
                label: phosphorelay response regulator activity
            processes:
              - preferred_term: negative regulation of cytokinin-activated signaling pathway
                term:
                  id: GO:0080037
                  label: negative regulation of cytokinin-activated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Cytokinin-induced, phosphorylation-dependent negative feedback regulator.
  connections:
    - source: ck_phosphorelay
      target: ck_typeb_transcription
      connection_type: CAUSES
      description: Receiver phosphorylation activates type-B ARR DNA binding and transactivation.
    - source: ck_typeb_transcription
      target: ck_typea_feedback
      connection_type: POSITIVELY_REGULATES
      description: Type-B ARRs transcriptionally induce type-A ARR genes such as ARR5.
    - source: ck_typea_feedback
      target: ck_phosphorelay
      connection_type: NEGATIVELY_REGULATES
      description: Type-A ARRs attenuate the phosphorelay output, closing the negative feedback loop.
