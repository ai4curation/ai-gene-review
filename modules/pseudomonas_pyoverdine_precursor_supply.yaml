id: MODULE:pseudomonas_pyoverdine_precursor_supply
title: Pseudomonas pyoverdine non-proteinogenic precursor supply
description: >-
  A reusable Pseudomonas module for reactions that supply unusual amino-acid
  building blocks to the cytoplasmic pyoverdine NRPS assembly line. PvdA
  hydroxylates L-ornithine to produce N5-hydroxy-L-ornithine, and PvdH forms
  L-2,4-diaminobutyrate from L-aspartate 4-semialdehyde by PLP-dependent
  transamination. Hydroxyornithine acylation, NRPS assembly, ferribactin export,
  periplasmic maturation, secretion, ferripyoverdine uptake, and iron release
  are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:8106324
    title: Cloning and nucleotide sequence of the pvdA gene encoding the pyoverdin biosynthetic enzyme L-ornithine N5-oxygenase in Pseudomonas aeruginosa.
    statement: >-
      Establishes PvdA-dependent ornithine N5-hydroxylation as an early
      pyoverdine biosynthetic step.
  - source_id: PMID:15317763
    title: Functional characterization of an aminotransferase required for pyoverdine siderophore biosynthesis in Pseudomonas aeruginosa PAO1.
    statement: >-
      Establishes PvdH-dependent L-2,4-diaminobutyrate formation and its
      requirement for pyoverdine biosynthesis.
  - source_id: PMID:19459056
    title: Siderophore-mediated iron acquisition in the entomopathogenic bacterium Pseudomonas entomophila L48 and its close relative Pseudomonas putida KT2440.
    statement: Establishes that Pseudomonas putida KT2440 produces a characterized pyoverdine.
  - source_id: file:modules/pseudomonas_pyoverdine_precursor_supply-deep-research-openscientist.md
    title: OpenScientist research for Pseudomonas pyoverdine precursor supply
    statement: >-
      Evaluates the PvdA/PvdH two-reaction boundary, reaction chemistry,
      conservation, and distinction from adjacent tailoring and assembly.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__pseudomonas_pyoverdine_precursor_supply__ppu00975-deep-research-openscientist.md
    title: OpenScientist PSEPK satisfiability review for pyoverdine precursor supply
    statement: >-
      Finds both module reactions covered in KT2440 by pvdA/PP_3796 and
      pvdH/PP_4223, while identifying pvdA as a KEGG-bucket omission,
      PP_2800 as paralog spillover, and PvdY as adjacent tailoring.
notes: >-
  The module is limited to precursor-supply chemistry shared across
  pyoverdine-producing Pseudomonas. KT2440 proteins are exemplars, while the
  direct biochemical evidence for PvdA and PvdH comes primarily from
  Pseudomonas aeruginosa homologs. No PANTHER selector is asserted because the
  unreviewed KT2440 accessions are not present in the local PANTHER member
  index. PvdY hydroxyornithine acetylation is adjacent tailoring rather than a
  precursor-forming reaction and remains outside this strict module boundary.
  PP_2800 is outside the module unless evidence distinguishes it from the
  dedicated cluster enzyme PvdH.
