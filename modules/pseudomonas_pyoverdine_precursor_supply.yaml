id: MODULE:pseudomonas_pyoverdine_precursor_supply
title: Pseudomonas pyoverdine non-proteinogenic precursor supply
description: >-
  A reusable Pseudomonas module for reactions that supply unusual amino-acid
  building blocks to the cytoplasmic pyoverdine NRPS assembly line. PvdA
  hydroxylates L-ornithine to produce N5-hydroxy-L-ornithine, and PvdH forms
  L-2,4-diaminobutyrate from L-aspartate 4-semialdehyde by PLP-dependent
  transamination. Hydroxyornithine acylation, NRPS assembly, ferribactin export,
  periplasmic maturation, secretion, ferripyoverdine uptake, and iron release
  are outside this module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:8106324
    title: Cloning and nucleotide sequence of the pvdA gene encoding the pyoverdin biosynthetic enzyme L-ornithine N5-oxygenase in Pseudomonas aeruginosa.
    statement: >-
      Establishes PvdA-dependent ornithine N5-hydroxylation as an early
      pyoverdine biosynthetic step.
  - source_id: PMID:15317763
    title: Functional characterization of an aminotransferase required for pyoverdine siderophore biosynthesis in Pseudomonas aeruginosa PAO1.
    statement: >-
      Establishes PvdH-dependent L-2,4-diaminobutyrate formation and its
      requirement for pyoverdine biosynthesis.
  - source_id: PMID:17015659
    title: Heterologous expression, purification, and characterization of an l-ornithine N(5)-hydroxylase involved in pyoverdine siderophore biosynthesis in Pseudomonas aeruginosa.
    statement: >-
      Direct enzymology of the purified Pseudomonas aeruginosa PAO1 enzyme:
      FAD- and NADPH-dependent N5-hydroxylation of L-ornithine, with measured
      kinetic parameters.
  - source_id: PMID:17900176
    title: Biochemical characterization of a flavin adenine dinucleotide-dependent monooxygenase, ornithine hydroxylase from Pseudomonas aeruginosa, suggests a novel reaction mechanism.
    statement: >-
      Establishes the strict substrate specificity of PvdA: no hydroxylation of
      L-2,4-diaminobutyrate, D-ornithine, 5-aminopentanoate or L-norleucine, and
      uncoupled NADPH oxidation with L-lysine.
  - source_id: PMID:12686626
    title: Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas aeruginosa.
    statement: >-
      Mutational survey of candidate pyoverdine genes in Pseudomonas aeruginosa
      PAO1, the genetic basis for assigning precursor-supply genes to the
      pathway.
  - source_id: file:interpro/panther/PTHR43552/PTHR43552-review.yaml
    title: PANTHER family review for PTHR43552 (diaminobutyrate--2-oxoglutarate aminotransferases)
    statement: >-
      Adjudicates GO:0045303 as family-wide for PTHR43552, which is what lets
      the diaminobutyrate step be grounded on the family rather than on a single
      species member.
  - source_id: file:interpro/panther/PTHR42802/PTHR42802-review.yaml
    title: PANTHER family review for PTHR42802 (siderophore N-hydroxylating flavoprotein monooxygenases)
    statement: >-
      Finds the family coherent for flavin-dependent omega-amino N-hydroxylation
      and iron homeostasis, but leaves the ornithine-specific activity
      unresolved at family level because its single subfamily also holds lysine
      and putrescine N-hydroxylases.
  - source_id: PMID:19459056
    title: Siderophore-mediated iron acquisition in the entomopathogenic bacterium Pseudomonas entomophila L48 and its close relative Pseudomonas putida KT2440.
    statement: Establishes that Pseudomonas putida KT2440 produces a characterized pyoverdine.
  - source_id: file:modules/pseudomonas_pyoverdine_precursor_supply-deep-research-openscientist.md
    title: OpenScientist research for Pseudomonas pyoverdine precursor supply
    statement: >-
      Evaluates the PvdA/PvdH two-reaction boundary, reaction chemistry,
      conservation, and distinction from adjacent tailoring and assembly.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__pseudomonas_pyoverdine_precursor_supply__ppu00975-deep-research-openscientist.md
    title: OpenScientist PSEPK satisfiability review for pyoverdine precursor supply
    statement: >-
      Finds both module reactions covered in KT2440 by pvdA/PP_3796 and
      pvdH/PP_4223, while identifying pvdA as a KEGG-bucket omission,
      PP_2800 as paralog spillover, and PvdY as adjacent tailoring.
notes: >-
  Scope. Pyoverdine is restricted to the fluorescent pseudomonads, so the module
  stays at the Pseudomonas level rather than being generalized to
  siderophore-producing bacteria at large: the two reactions modelled here feed
  the pyoverdine chromophore and peptide specifically, and their homologs
  elsewhere (EctB in ectoine biosynthesis, IucD in aerobactin biosynthesis)
  serve different products. Within Pseudomonas the module uses Pseudomonas
  aeruginosa PAO1 as the experimentally best-characterized exemplar, where both
  enzymes have been purified and assayed and both mutants are
  pyoverdine-negative, alongside Pseudomonas putida KT2440, which produces a
  characterized pyoverdine and whose orthologs are reviewed in this repo. Both
  species are listed as representative members of the same family roles; they
  are exemplars, not a claim that the module is limited to them. The module is
  CONCRETE because it is a taxon-scoped realization whose terminal reactions
  ground to representative proteins.
  Grounding. The diaminobutyrate step is grounded on PANTHER:PTHR43552, adopting
  the family assignment from the maintainer module-grounding branch and verified
  against interpro/panther/panther.obo and the PANTHER member index; the
  accompanying family review adjudicates GO:0045303 as family-wide, since both
  subfamilies perform the same EC 2.6.1.76 transamination and differ only in the
  pathway that consumes L-2,4-diaminobutyrate. The ornithine hydroxylation step
  deliberately asserts no family id. Q51548 (PvdA) does belong to
  PANTHER:PTHR42802 and its subfamily PTHR42802:SF1, as its UniProt
  cross-reference and the family review record, but that family has a single
  subfamily that also contains lysine N6-monooxygenases (IucD, MbtG) and
  putrescine N-hydroxylases (AlcA, PubA, FbsI), and the purified enzymes are
  mutually substrate-specific. Family membership therefore cannot establish the
  ornithine-specific activity this annoton asserts, so the role is grounded on
  its representative members and on their gene reviews instead, per the
  "if you cannot be sure, assert no id" rule.
  Boundary. Hydroxyornithine acylation (PvdY/PP_4245), NRPS assembly, ferribactin
  export, periplasmic maturation, secretion, ferripyoverdine uptake and iron
  release all remain outside the module: it covers only the formation of the two
  non-proteinogenic amino-acid precursors. PvdY acetylation is adjacent tailoring
  whether its acceptor is free or NRPS-bound. PP_2800 of KT2440 shares the broad
  diaminobutyrate-transaminase family assignment with PvdH but lies outside the
  pyoverdine locus and is not used as an exemplar.
module:
  id: pseudomonas_pyoverdine_precursor_supply
  label: Pseudomonas pyoverdine non-proteinogenic precursor supply
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: pyoverdine biosynthetic process
      term:
        id: GO:0002049
        label: pyoverdine biosynthetic process
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: N5-hydroxy-L-ornithine precursor supply
      node:
        id: pvda_ornithine_hydroxylation
        label: PvdA-dependent ornithine N5-hydroxylation
        module_type: REACTION
        annotons:
          - id: pvda_ornithine_n5_monooxygenase
            label: Pyoverdine ornithine N5-monooxygenase PvdA
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Pseudomonas pyoverdine PvdA ornithine N5-monooxygenase family
                description: >-
                  The dedicated ornithine N5-monooxygenase encoded in the
                  pyoverdine locus of fluorescent pseudomonads. No PANTHER
                  family id is asserted: PvdA belongs to PTHR42802, but that
                  family's single subfamily also contains lysine N6- and
                  putrescine N-hydroxylases, so membership does not establish
                  the ornithine-specific activity (see
                  interpro/panther/PTHR42802/PTHR42802-review.yaml).
                representative_members:
                  - preferred_term: PvdA (Pseudomonas aeruginosa PAO1)
                    description: >-
                      Experimentally best-characterized exemplar: purified
                      enzyme, measured kinetics, pyoverdine-negative mutant
                      rescued by N5-hydroxyornithine.
                    term:
                      id: UniProtKB:Q51548
                      label: L-ornithine N(5)-monooxygenase
                  - preferred_term: PvdA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88GC8
                      label: L-ornithine 5-monooxygenase
            function:
              preferred_term: ornithine N5-monooxygenase activity
              term:
                id: GO:0031172
                label: ornithine N5-monooxygenase activity
              substrates:
                - preferred_term: L-ornithine
              products:
                - preferred_term: N5-hydroxy-L-ornithine
            processes:
              - preferred_term: pyoverdine biosynthetic process
                term:
                  id: GO:0002049
                  label: pyoverdine biosynthetic process
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Produces hydroxylated ornithine for subsequent acylation and
              incorporation into the pyoverdine peptide precursor.
    - order: 2
      role: L-2,4-diaminobutyrate precursor supply
      node:
        id: pvdh_diaminobutyrate_formation
        label: PvdH-dependent L-2,4-diaminobutyrate formation
        module_type: REACTION
        annotons:
          - id: pvdh_diaminobutyrate_transaminase
            label: Pyoverdine diaminobutyrate transaminase PvdH
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Pseudomonas pyoverdine PvdH diaminobutyrate transaminase family
                description: >-
                  Class-III PLP aminotransferases that form
                  L-2,4-diaminobutyrate (EC 2.6.1.76). The PANTHER family is
                  grounded here because the activity holds family-wide; what
                  makes a member a pyoverdine enzyme rather than an ectoine
                  enzyme is its position in the pyoverdine locus.
                representative_members:
                  - preferred_term: PvdH (Pseudomonas aeruginosa PAO1)
                    description: >-
                      Purified from PAO1 and assayed; pvdH mutants cannot make
                      pyoverdine without exogenous L-2,4-diaminobutyrate.
                    term:
                      id: UniProtKB:Q9I168
                      label: L-2,4-diaminobutyrate:2-ketoglutarate 4-aminotransferase, PvdH
                  - preferred_term: PvdH (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88F75
                      label: Diaminobutyrate-2-oxoglutarate transaminase
                term:
                  id: PANTHER:PTHR43552
                  label: DIAMINOBUTYRATE--2-OXOGLUTARATE AMINOTRANSFERASE
            function:
              preferred_term: L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity
              term:
                id: GO:0045303
                label: L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity
              substrates:
                - preferred_term: L-aspartate 4-semialdehyde
                - preferred_term: L-glutamate
              products:
                - preferred_term: L-2,4-diaminobutyrate
                - preferred_term: 2-oxoglutarate
            processes:
              - preferred_term: pyoverdine biosynthetic process
                term:
                  id: GO:0002049
                  label: pyoverdine biosynthetic process
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Produces L-2,4-diaminobutyrate for incorporation into the
              strain-specific pyoverdine peptide precursor.
  knowledge_gaps:
    - gap_statement: >-
        Characterized KT2440 pyoverdine contains a cyclic
        N5-hydroxyornithine rather than an identified N5-acylated
        hydroxyornithine residue, so it is unresolved whether any KT2440 product
        depends on PvdY-mediated acetylation. PP_4245 has also not been purified
        and assayed; its acyl donor, hydroxyornithine specificity, and
        free-versus-NRPS-bound acceptor state remain inferred from an ortholog
        and pathway context.
      boundary: >-
        The boundary separates formation of non-proteinogenic amino-acid
        precursors from subsequent acyl tailoring: PvdY remains outside whether
        its acceptor is free or NRPS-bound. Do not treat the Pseudomonas
        aeruginosa experiment as direct enzymology of PP_4245 or generalize it
        to every pyoverdine structural type.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__pseudomonas_pyoverdine_precursor_supply__ppu00975-deep-research-openscientist.md
          supporting_text: >-
            no direct functional characterization of PvdY was retrieved
          reference_section_type: OTHER
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__pseudomonas_pyoverdine_precursor_supply__ppu00975-deep-research-openscientist.md
          supporting_text: >-
            the two annotations (hydroxyproline acetylase vs N6-hydroxylysine
            acetyltransferase) are inconsistent
          reference_section_type: OTHER
    - gap_statement: >-
        Whether a second diaminobutyrate-transaminase paralog contributes to
        pyoverdine precursor supply is unknown. KT2440 PP_2800 carries the same
        broad class-III diaminobutyrate-transaminase family assignment as PvdH
        but lies outside the pyoverdine locus, and no assay has established
        whether it forms L-2,4-diaminobutyrate at all, whether its product
        reaches the pyoverdine NRPS, or whether it can sustain pyoverdine
        synthesis when pvdH is absent. In Pseudomonas aeruginosa PAO1 the pvdH
        mutant is pyoverdine-negative unless L-2,4-diaminobutyrate is supplied,
        which argues against a redundant route there, but the equivalent
        experiment has not been reported for KT2440.
      boundary: >-
        Closing this needs enzymology on the paralog plus a pvdH-deletion
        phenotype in KT2440, not further curation. Until then use the dedicated
        PvdH exemplar for the pyoverdine step and keep PP_2800 outside the
        module rather than treating it as an interchangeable enzyme.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: file:modules/pseudomonas_pyoverdine_precursor_supply-deep-research-openscientist.md
          supporting_text: >-
            Strict PvdH/asd dependence is shown in PAO1 only; alternative routes
            in other pseudomonads are untested.
          reference_section_type: OTHER
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__pseudomonas_pyoverdine_precursor_supply__ppu00975-deep-research-openscientist.md
          supporting_text: >-
            KT2440 encodes only two K00836 DABA-aminotransferases (PP_2800 and
            pvdH/PP_4223)
          reference_section_type: OTHER
