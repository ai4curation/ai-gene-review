  knowledge_gaps:
    - gap_statement: >-
        KT2440 PvdY has not been purified and assayed, so its acyl donor,
        hydroxyornithine specificity, free-versus-NRPS-bound acceptor state, and
        exact modified residue in KT2440 pyoverdine remain unresolved or
        inferred from an ortholog and pathway context.
      boundary: >-
        The boundary separates formation of non-proteinogenic amino-acid
        precursors from subsequent acyl tailoring: PvdY remains outside whether
        its acceptor is free or NRPS-bound. Do not treat the Pseudomonas
        aeruginosa experiment as direct enzymology of PP_4245 or generalize it
        to every pyoverdine structural type.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        PP_2800 shares a broad diaminobutyrate-transaminase family assignment
        with PvdH but lies outside the pyoverdine locus.
      boundary: >-
        Use the dedicated PvdH exemplar for the pyoverdine step and treat
        PP_2800 as a paralog ambiguity rather than an interchangeable enzyme.
      gap_kind:
        - CURATION
