id: MODULE:dmel_ccr4_not_complex
title: CCR4-NOT deadenylase complex in Drosophila melanogaster
description: >-
  CCR4-NOT is the major cytoplasmic mRNA deadenylase in eukaryotes and also acts in transcription
  and translational repression. Its large scaffold subunit Not1 binds two deadenylases, Pop2
  (CAF1) and twin (CCR4), which shorten poly(A) tails, the first step of most mRNA decay.
  Not1 also binds Rcd-1 (CNOT9), Not10 and Not11, and a NOT module of Rga (Not2) and Not3.
  RNA-binding proteins, microRNA silencing complexes and translational repressors recruit
  CCR4-NOT to specific mRNAs; in Drosophila it controls maternal mRNA decay and germline stem
  cell maintenance.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000469
  title: 'FlyBase gene group CCR4-NOT: Ccr4-not complex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as ccr4-not complex (CCR4-NOT);
    this module models that group.
- source_id: GO:0030014
  title: CCR4-NOT complex
  statement: >-
    GO term grounding the module as CCR4-NOT complex.
notes: >-
  Boundary. The deadenylase subunits are modelled as one complex part; the two enzymes are
  distinct catalytic subunits that both sit on Not1. Not3 has no UniProt mapping in the source
  table and is grounded to its FlyBase gene id. Recruiting RNA-binding proteins (for example
  Nanos, Pumilio, Smaug, Bam) are regulators and not parts. FlyBase groups realized by this
  module: CCR4-NOT (FBgg0000469). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_ccr4_not_complex.yaml; none of the member genes has a gene review yet
  unless noted.
