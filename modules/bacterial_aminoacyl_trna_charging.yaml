                    or Glu-tRNA(Gln) in organisms which lack either or both of asparaginyl-tRNA or glutaminyl-
                    tRNA synthetases (PubMed:9789001). The reaction takes place in the presence of glutamine
                    and ATP through an activated phospho-Asp- tRNA(Asn) or phospho-Glu-tRNA(Gln). This
                    subunit catalyzes the hydrolysis of the amido donor Gln, releasing ammonia that is
                    sequestered within a channel in the GatCAB complex and made available to subunit B
                    for downstream aminolysis of Glu-tRNA(Gln); may also be able to use Asn as the amido
                    donor (By similarity). {ECO:0000255|HAMAP- Rule:MF_00120, ECO:0000269|PubMed:9789001,
