id: MODULE:bacterial_aminoacyl_trna_charging
title: Bacterial aminoacyl-tRNA charging
description: >-
  Bacterial production of aminoacyl-tRNAs for translation through direct
  aminoacyl-tRNA synthetase reactions. Asparaginyl-tRNA formation is modeled
  as alternative direct AsnRS or indirect non-discriminating AspRS-GatABC
  routes, and glutaminyl-tRNA formation as alternative direct GlnRS or indirect
  GluRS-GatABC routes. The reusable boundary ends when a correctly charged
  canonical aminoacyl-tRNA is formed.
status: DRAFT
evidence:
  - source_id: GO:0043039
    title: tRNA aminoacylation
    statement: >-
      Grounds the module-level biological process while substrate-specific
      aminoacyl-tRNA ligase activities remain on leaf annotons.
  - source_id: KEGG:ppu00970
    title: Pseudomonas putida KT2440 aminoacyl-tRNA biosynthesis
    statement: >-
      Supplies the concrete PSEPK candidates used to test this reusable module.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_partition.tsv
    title: PSEPK pathway partition
    statement: >-
      Supplies exact PSEPK locus tags and UniProt accessions for KEGG ppu00970.
  - source_id: file:PSEPK/gltX/gltX-uniprot.txt
    title: UniProtKB entry for PSEPK GltX
    statement: >-
      Grounds the exact Q88LF6 exemplar and documents direct Glu-tRNA(Glu)
      formation without asserting tRNA(Gln) recognition.
  - source_id: PMID:14729703
    title: Direct glutaminyl-tRNA biosynthesis and indirect asparaginyl-tRNA biosynthesis in Pseudomonas aeruginosa PAO1
    statement: >-
      Establishes the Pseudomonas indirect Asn-tRNA(Asn) route through
      non-discriminating AspRS and GatABC, while direct GlnRS supplies
      Gln-tRNA(Gln).
  - source_id: file:modules/bacterial_aminoacyl_trna_charging-deep-research-openscientist.md
    title: OpenScientist review of bacterial aminoacyl-tRNA charging
    statement: >-
      Reviews the class I and class II charging systems, multimeric bacterial
      GlyRS and PheRS architectures, and the direct-versus-indirect Asn-tRNA
      and Gln-tRNA route variants used to define the reusable module boundary.
  - source_id: file:modules/experimental/gapmind-mining/cache/gapmind/aa/gln.steps
    title: GapMind curated glutamine biosynthesis step definitions
    statement: >-
      Identifies reviewed Thermosynechococcus Q8DLI5 as a curated Swiss-Prot
      exemplar of non-discriminating glutamyl-tRNA synthetase activity.
