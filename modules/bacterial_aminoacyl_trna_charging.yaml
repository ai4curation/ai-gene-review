notes: All 26 original proteins are retained in the 42-member panel. The historical cross-species THEVB
  GluRS–PSEPK GatCAB chain is replaced by a species-matched Bacillus indirect Gln route. A same-organism
  oracle is required when evaluating the reusable program; the generic Boolean compiler itself does not
  enforce taxonomy. Partial comparator panels cannot establish whole-genome absence of missing activities.
  GO:0006419–GO:0006438 and GO:0070680/GO:0070681 are obsolete in the inspected live ontology. Direct
  ester formation uses GO:0006418, while GatCAB and SepCysS execute charged-tRNA amino-acid modification.
  No GOA row, protein name, provider prose or family label alone is used as biochemical evidence. Archived
  Parcubacteria identities are verified by literal UniSave/UniParc sequence matches to published clone
  accessions; deletion from the current reference-proteome collection is not biological loss.
references:
- id: PMID:14729703
  title: Direct glutaminyl-tRNA biosynthesis and indirect asparaginyl-tRNA biosynthesis in Pseudomonas
    aeruginosa PAO1.
  findings:
  - statement: PAO1 supplies Gln-tRNA directly through GlnRS, whereas purified ND-AspRS and GatCAB support
      indirect Asn-tRNA synthesis. Its GluRS is discriminating; GatCAB Gln-transamidation capacity was
      tested on heterologously prepared substrate and does not establish an active native indirect Gln
      route.
    supporting_text: that AspRS is nondiscriminating, and that its Asp-tRNA Asn product is transamidated
      by AdT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected.
- id: PMID:9342321
  title: 'Glu-tRNAGln amidotransferase: a novel heterotrimeric enzyme required for correct decoding of
    glutamine codons during translation.'
  findings:
  - statement: Bacillus subtilis GatCAB converts Glu-tRNA(Gln) using glutamine and ATP. Operon disruption
      establishes native importance, while recombinant subunit experiments distinguish GatA glutaminase
      and GatB/GatC contributions; no isolated subunit is assigned whole-complex synthetase chemistry.
  - statement: Subunit experiments separate glutamine hydrolysis by GatA from the full heteromeric transamidation
      reaction.
    supporting_text: The holoenzyme and the A subunit (coexpressed A+C) carry out the Gln → Glu conversion;
      ATP is not required for this reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected.
- id: PMID:26804570
  title: The Bacillus subtilis and Bacillus halodurans Aspartyl-tRNA Synthetases Retain Recognition of
    tRNA(Asn).
  findings:
  - statement: The explicit abstract identifies nondiscriminating AspRS in B. subtilis despite the presence
      of AsnRS. Thus direct and indirect Asn routes can coexist; this finding supersedes older assumptions
      that AsnRS presence proves discriminatory AspRS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; findings are limited to explicit abstract results and independently
      curated evidence.
