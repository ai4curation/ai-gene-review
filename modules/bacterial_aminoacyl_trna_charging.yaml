- id: PMID:16876193
  title: Crystal structure of a non-discriminating glutamyl-tRNA synthetase.
  findings:
  - statement: Thermosynechococcus vestitus BP-1 (historical T. elongatus) GluRS charges both tRNA(Glu)
      and tRNA(Gln). Its ND activity is retained as an independently assayed comparator; no unreviewed
      native GatCAB is replaced by KT2440 proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; findings are limited to explicit abstract results and independently
      curated evidence.
knowledge_gaps:
- gap_statement: The in vivo contribution and matched-pair kinetics of the DG_74_2 SepRS/SepCysS system
    remain unmeasured.
  boundary: The bacterial sequences and both catalytic activities are established; the metagenomic bin
    is not a cultured isolate and the published coupled assay used Chloroflexi SepRS.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Distinguishes independently demonstrated steps from a verified native complete route.
  resolution: Reconstitute the sequence-matched pair with its cognate tRNA and identify native sulfur
    donation; investigate physiological activity in an appropriate cultivation or cellular system.
  provenance:
  - reference_id: PMID:28487430
    supporting_text: While conversion was complete in the case of “Ca. Parcubacteria” SepCysS (95 to 99%
      of the total Sep-tRNACys intermediate)
- gap_statement: Native KT2440 flux through the indirect Asn route has not been quantified in the target-specific
    sources examined.
  boundary: Conserved ND-AspRS/GatCAB activities and the PAO1 mechanism support the pathway inference,
    without constituting KT2440 paired-enzyme kinetics.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Defines the experimental limit of the fully sampled reference genome.
