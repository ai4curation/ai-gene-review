notes: >-
  Concrete representative members orient each conserved family role and do not
  restrict the reusable module to their source species. PANTHER subfamily names
  are recorded verbatim even where organellar exemplars dominate the official
  label; member containment confirms each listed PSEPK protein. No PANTHER term
  is used where one subfamily mixes functionally distinct selectors, and no
  ancestral PTN is asserted without target-to-node descendant evidence.
knowledge_gaps:
  - gap_statement: >-
      In bacteria that encode both GlnRS and GatABC, the physiological extent of
      indirect Gln-tRNA formation depends on whether their GluRS recognizes
      tRNA(Gln), and may vary with growth condition or lineage.
    boundary: >-
      Direct GlnRS charging and GatABC transamidation chemistry are established;
      the unresolved step is Glu-tRNA(Gln) precursor supply by a
      non-discriminating GluRS in organisms that also retain GlnRS.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Resolving substrate discrimination distinguishes a merely encoded GatABC
      reaction capacity from an active alternative Gln-tRNA charging route.
    resolution: >-
      Compare aminoacylation kinetics of the relevant GluRS with cognate
      tRNA(Glu) and tRNA(Gln), then quantify route usage in vivo after GlnRS
      perturbation.
    provenance:
      - reference_id: file:PSEPK/gltX/gltX-uniprot.txt
        supporting_text: "Reaction=tRNA(Glu) + L-glutamate + ATP"
