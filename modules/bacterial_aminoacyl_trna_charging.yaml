- id: PMID:28487430
  title: RNA-Dependent Cysteine Biosynthesis in Bacteria and Archaea.
  findings:
  - statement: The DG_74_2 metagenomic-bin SepRS and SepCysS sequences were individually assayed after
      heterologous expression. The coupled SepCysS assay used Chloroflexi SepRS; a matched Parcubacteria
      pair and native isolate physiology were not demonstrated.
    supporting_text: Recombinant “Ca. Parcubacteria” SepRS aminoacylated both tRNACysbac and tRNACysarch,
      albeit at a low level (10%)
  - statement: Parcubacteria SepCysS converts the phosphoseryl-tRNA intermediate in an anaerobic sulfide/PLP-containing
      assay. The reported 95–99% concerns conversion of the available intermediate, not quantitative charging
      of all input tRNA.
    supporting_text: While conversion was complete in the case of “Ca. Parcubacteria” SepCysS (95 to 99%
      of the total Sep-tRNACys intermediate)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected.
- id: PMID:27223819
  title: Aminoacyl-tRNA Synthetases in the Bacterial World.
  findings:
