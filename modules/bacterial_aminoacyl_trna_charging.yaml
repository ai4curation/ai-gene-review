id: MODULE:bacterial_aminoacyl_trna_charging
title: Bacterial aminoacyl-tRNA charging
description: Production of the twenty canonical aminoacyl-tRNAs used in bacterial protein synthesis, through
  direct aminoacyl-tRNA synthetases and species-matched indirect amino-acid conversion on tRNA. The reusable
  program distinguishes class I and class II LysRS, homodimeric and heterotetrameric GlyRS, heteromeric
  PheRS, direct versus GatCAB-dependent Asn/Gln formation, and the rare bacterial SepRS–SepCysS route
  to Cys-tRNA. The boundary ends at a correctly aminoacylated tRNA. It excludes ribosomal elongation,
  initiation-specific formylation, tRNA maturation, selenocysteine/pyrrolysine recoding and off-tRNA amino-acid
  synthesis. Editing improves fidelity but is not modeled as a universally obligatory independent enzyme
  for each output.
status: COMPLETE
scope: CONCRETE
evidence:
- &id015
  source_id: PMID:27223819
  title: Aminoacyl-tRNA Synthetases in the Bacterial World.
  statement: The review establishes bacterial synthetase architecture diversity and why twenty outputs
    do not imply twenty independent synthetase genes. It is a 2016 review despite the later PMC deposit.
  supporting_text: For a long time it was believed that each amino acid has its own aaRS and, consequently,
    that all organisms should contain 20 aaRSs.
- source_id: PMID:38391119
  title: Evolution and variation in amide aminoacyl-tRNA synthesis.
  statement: The 2024 review describes evolutionary variation between direct and indirect amide aminoacyl-tRNA
    synthesis. Only its abstract was available; primary experiments ground the concrete native branches.
  supporting_text: life used two-step indirect pathways to synthesize asparagine and glutamine on their
    cognate tRNAs
- source_id: PMID:35047015
  title: 'Indirect Routes to Aminoacyl-tRNA: The Diversity of Prokaryotic Cysteine Encoding Systems.'
  statement: This comparative survey explicitly includes bacterial indirect Cys-tRNA synthesis, so restricting
    SepRS/SepCysS to Archaea would falsely exclude experimentally demonstrated bacterial chemistry.
  supporting_text: the two-step Cys biosynthesis and encoding pathway is not restricted to methanogenic
    archaea, but occurs in various archaeal as well as some bacterial clades
- &id018
  source_id: PMID:14729703
  title: Direct glutaminyl-tRNA biosynthesis and indirect asparaginyl-tRNA biosynthesis in Pseudomonas
    aeruginosa PAO1.
  statement: PAO1 supplies Gln-tRNA directly through GlnRS, whereas purified ND-AspRS and GatCAB support
    indirect Asn-tRNA synthesis. Its GluRS is discriminating; GatCAB Gln-transamidation capacity was tested
    on heterologously prepared substrate and does not establish an active native indirect Gln route.
  supporting_text: that AspRS is nondiscriminating, and that its Asp-tRNA Asn product is transamidated
    by AdT.
- &id031
  source_id: PMID:28487430
  title: RNA-Dependent Cysteine Biosynthesis in Bacteria and Archaea.
  statement: The DG_74_2 metagenomic-bin SepRS and SepCysS sequences were individually assayed after heterologous
    expression. The coupled SepCysS assay used Chloroflexi SepRS; a matched Parcubacteria pair and native
    isolate physiology were not demonstrated.
  supporting_text: Recombinant “Ca. Parcubacteria” SepRS aminoacylated both tRNACysbac and tRNACysarch,
    albeit at a low level (10%)
module:
  id: bacterial_aminoacyl_trna_charging
  label: Twenty canonical bacterial aminoacyl-tRNA outputs
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: tRNA charging
    term:
      id: GO:0043039
      label: tRNA charging
  context:
    taxa:
    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: A comparative bacterial program. Every concrete evaluation must use one organism context;
        the combined exemplar inventory is not a single proteome.
  description: Each of the twenty output roles is required for the full program; alternatives describe
    distinct chemistries or sampled native implementations. KT2440 supplies the fully sampled reference
    panel. Other taxa contribute partial experimentally informative comparisons and are not asserted to
    have complete sampled programs. Exact selectors prevent functional generalization from a family label;
    their attached classifications document membership only.
