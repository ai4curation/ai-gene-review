id: MODULE:ether_lipid_plasmalogen_biosynthesis
title: Ether lipid / plasmalogen biosynthesis (FAR1/2 -> GNPAT -> AGPS -> PexRAP -> ER assembly -> PEDS1)
description: >-
  Ether phospholipids, and especially the plasmalogens (1-O-alk-1'-enyl-2-acyl glycerophospholipids), are
  major membrane lipids - abundant in brain, heart and immune cells - that serve in membrane structure,
  vesicular trafficking, signalling and as endogenous antioxidants. Unlike ester glycerolipids their synthesis
  begins in the peroxisome. Fatty acyl-CoA reductase (FAR1, the rate-limiting and plasmalogen-feedback-
  regulated isoform; FAR2 a paralog) reduces long-chain fatty acyl-CoA to the fatty alcohol that will form the
  ether-linked sn-1 chain. In parallel, glyceronephosphate O-acyltransferase (GNPAT/DHAPAT) acylates
  dihydroxyacetone phosphate (DHAP) to acyl-DHAP - the first committed step. Alkyldihydroxyacetone-phosphate
  synthase (AGPS), an FAD enzyme that forms a complex with GNPAT, then exchanges the acyl group of acyl-DHAP
  for the FAR-derived fatty alcohol, creating the defining O-alkyl ether bond and yielding alkyl-DHAP. After
  further steps (reduction to alkyl-glycerol-3-phosphate, acylation, and headgroup addition, largely at the
  ER) the resulting plasmanylethanolamine is converted to the vinyl-ether plasmalogen plasmenylethanolamine by
  the ER desaturase PEDS1 (plasmanylethanolamine desaturase, formerly TMEM189), which introduces the
  characteristic 1-O-alk-1'-enyl double bond. Loss-of-function across the peroxisomal steps causes rhizomelic
  chondrodysplasia punctata (PEX7/RCDP1, GNPAT/RCDP2, AGPS/RCDP3, FAR1/RCDP4) and related plasmalogen-
  deficiency disorders.
status: DRAFT
evidence:
  - source_id: GO:0008611
    title: ether lipid biosynthetic process
    statement: FAR1/2, GNPAT, AGPS and PEDS1 build ether phospholipids/plasmalogens (GO:0008611).
  - source_id: GO:1903175
    title: fatty alcohol biosynthetic process
    statement: FAR1/FAR2 make the fatty alcohol donor for the ether bond (GO:1903175).
  - source_id: file:human/FAR1/FAR1-ai-review.yaml
    title: FAR1 gene review (human)
    statement: Fatty acyl-CoA reductase 1 (UniProtKB:Q8WVX9, GO:0102965) matches the completed human FAR1 review.
  - source_id: file:human/FAR2/FAR2-ai-review.yaml
    title: FAR2 gene review (human)
    statement: Fatty acyl-CoA reductase 2 (UniProtKB:Q96K12, GO:0102965) matches the completed human FAR2 review.
  - source_id: file:human/GNPAT/GNPAT-ai-review.yaml
    title: GNPAT gene review (human)
    statement: Glyceronephosphate O-acyltransferase (UniProtKB:O15228, GO:0016287) matches the completed human GNPAT review.
  - source_id: file:human/AGPS/AGPS-ai-review.yaml
    title: AGPS gene review (human)
    statement: Alkylglycerone-phosphate synthase (UniProtKB:O00116, GO:0008609) matches the completed human AGPS review.
  - source_id: file:human/PEDS1/PEDS1-ai-review.yaml
    title: PEDS1 gene review (human)
    statement: Plasmanylethanolamine desaturase (UniProtKB:A5PLL7, GO:0050207) matches the completed human PEDS1 review.
module:
  id: ether_lipid_plasmalogen_biosynthesis
  label: Ether lipid / plasmalogen biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ether lipid biosynthetic process
      term:
        id: GO:0008611
        label: ether lipid biosynthetic process
      description: Synthesis of O-alkyl / O-alk-1-enyl (plasmalogen) glycerophospholipids.
    - preferred_term: fatty alcohol biosynthetic process
      term:
        id: GO:1903175
        label: fatty alcohol biosynthetic process
      description: FAR1/FAR2 produce the fatty alcohol that becomes the ether-linked chain.
    - preferred_term: glycerophospholipid biosynthetic process
      term:
        id: GO:0046474
        label: glycerophospholipid biosynthetic process
      description: The ether phospholipids are a branch of glycerophospholipid synthesis.
  context:
    cellular_components:
      - preferred_term: peroxisomal membrane
        term:
          id: GO:0005778
          label: peroxisomal membrane
        description: FAR1/FAR2 and GNPAT act at the peroxisomal membrane.
      - preferred_term: peroxisomal matrix
        term:
          id: GO:0005782
          label: peroxisomal matrix
        description: AGPS acts in the peroxisomal matrix.
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: PEDS1 introduces the vinyl-ether bond at the ER membrane.
  gocam_associations:
    - model: gomodel:663d668500001089
      title: SELENOI is involved in ether lipid homeostasis and myelination (Human).
      description: >-
        Human model of the ethanolamine head-group branch (ETNK1, PCYT2,
        SELENOI) feeding ether lipid synthesis. It covers the
        plasmanylethanolamine assembly step only.
  parts:
    - order: 1
      role: fatty alcohol synthesis (acyl-CoA -> fatty alcohol)
      node:
        id: fatty_alcohol_synthesis
        label: Fatty acyl-CoA reductase (FAR1 / FAR2)
        module_type: REACTION
        annotons:
          - id: far_activity
            label: "FAR1/FAR2: alcohol-forming fatty acyl-CoA reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FAR / fatty acyl-CoA reductase family
                term:
                  id: PANTHER:PTHR11011
                  label: MALE STERILITY PROTEIN 2-RELATED
                representative_members:
                  - preferred_term: FAR1 (human; rate-limiting)
                    term:
                      id: UniProtKB:Q8WVX9
                      label: Fatty acyl-CoA reductase 1
                  - preferred_term: FAR2 (human; paralog)
                    term:
                      id: UniProtKB:Q96K12
                      label: Fatty acyl-CoA reductase 2
            function:
              preferred_term: alcohol-forming long-chain fatty acyl-CoA reductase activity
              term:
                id: GO:0102965
                label: alcohol-forming long-chain fatty acyl-CoA reductase (NADP+) activity
              substrates:
                - preferred_term: long-chain fatty acyl-CoA (C16/C18)
                - preferred_term: NADPH
              products:
                - preferred_term: long-chain fatty alcohol
                - preferred_term: CoA
              evidence:
                - source_id: file:human/FAR1/FAR1-ai-review.yaml
                  statement: Peroxisomal-membrane NADPH reductase; acyl-CoA -> fatty alcohol; FAR1 rate-limiting and plasmalogen-feedback-regulated; FAR1-RCDP4
            locations:
              - preferred_term: peroxisomal membrane
                term:
                  id: GO:0005778
                  label: peroxisomal membrane
            role_description: Reduce fatty acyl-CoA to the fatty alcohol ether-chain donor.
    - order: 2
      role: DHAP acylation (DHAP -> acyl-DHAP)
      node:
        id: dhap_acylation
        label: Glyceronephosphate O-acyltransferase (GNPAT/DHAPAT)
        module_type: REACTION
        annotons:
          - id: gnpat_activity
            label: "GNPAT: glyceronephosphate O-acyltransferase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GNPAT / glycerone-phosphate O-acyltransferase family
                term:
                  id: PANTHER:PTHR12563
                  label: GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE
                representative_members:
                  - preferred_term: GNPAT (human)
                    term:
                      id: UniProtKB:O15228
                      label: Dihydroxyacetone phosphate acyltransferase
            function:
              preferred_term: glycerone-phosphate O-acyltransferase activity
              term:
                id: GO:0016287
                label: glycerone-phosphate O-acyltransferase activity
              substrates:
                - preferred_term: dihydroxyacetone phosphate (glycerone phosphate, DHAP)
                - preferred_term: long-chain acyl-CoA
              products:
                - preferred_term: acyl-DHAP (acyldihydroxyacetone phosphate)
                - preferred_term: CoA
              evidence:
                - source_id: file:human/GNPAT/GNPAT-ai-review.yaml
                  statement: Peroxisomal first committed step; acylates DHAP -> acyl-DHAP; forms a complex with AGPS; GNPAT-RCDP2
            locations:
              - preferred_term: peroxisomal membrane
                term:
                  id: GO:0005778
                  label: peroxisomal membrane
            role_description: Acylate DHAP to acyl-DHAP.
    - order: 3
      role: ether-bond formation (acyl-DHAP -> alkyl-DHAP)
      node:
        id: ether_bond_formation
        label: Alkyldihydroxyacetone-phosphate synthase (AGPS)
        module_type: REACTION
        annotons:
          - id: agps_activity
            label: "AGPS: alkylglycerone-phosphate synthase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: AGPS / alkyl-DHAP synthase (FAD amine oxidase-type) family
                term:
                  id: PANTHER:PTHR46568
                  label: ALKYLDIHYDROXYACETONEPHOSPHATE SYNTHASE, PEROXISOMAL
                representative_members:
                  - preferred_term: AGPS (human)
                    term:
                      id: UniProtKB:O00116
                      label: Alkyldihydroxyacetonephosphate synthase, peroxisomal
            function:
              preferred_term: alkylglycerone-phosphate synthase activity
              term:
                id: GO:0008609
                label: alkylglycerone-phosphate synthase activity
              substrates:
                - preferred_term: acyl-DHAP
                - preferred_term: long-chain fatty alcohol (from FAR; FAD cofactor)
              products:
                - preferred_term: alkyl-DHAP (alkyldihydroxyacetone phosphate; O-alkyl ether bond)
                - preferred_term: fatty acid (released acyl group)
              evidence:
                - source_id: file:human/AGPS/AGPS-ai-review.yaml
                  statement: FAD-dependent committed ether-bond-forming step; exchanges the acyl of acyl-DHAP for a fatty alcohol -> alkyl-DHAP; AGPS-RCDP3
            locations:
              - preferred_term: peroxisomal matrix
                term:
                  id: GO:0005782
                  label: peroxisomal matrix
            role_description: Form the O-alkyl ether bond, yielding alkyl-DHAP.
    - order: 4
      role: alkyl-DHAP reduction
      node:
        id: alkyl_dhap_reduction_step
        label: 1-O-alkyl-DHAP to 1-O-alkyl-sn-glycerol 3-phosphate
        module_type: REACTION
        annotons:
          - id: pexrap_activity
            label: PexRAP (DHRS7B) acyl/alkyl-DHAP reductase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: acyl/alkyl-glycerone-phosphate reductase activity
                term:
                  id: GO:0000140
                  label: acylglycerone-phosphate reductase (NADP+) activity
              family:
                preferred_term: DHRS7B (PexRAP) subfamily
                term:
                  id: PANTHER:PTHR44196:SF1
                  label: DEHYDROGENASE_REDUCTASE SDR FAMILY MEMBER 7B
                representative_members:
                  - preferred_term: DHRS7B / PexRAP (human)
                    term:
                      id: UniProtKB:Q6IAN0
                      label: Peroxisomal reductase activating PPAR-gamma
                    description: >-
                      Peroxisomal membrane reductase (location by
                      similarity to mouse). No gene review yet.
            function:
              preferred_term: acylglycerone-phosphate reductase (NADP+) activity
              term:
                id: GO:0000140
                label: acylglycerone-phosphate reductase (NADP+) activity
              description: >-
                The GO label names the acyl substrate, but the term covers the
                alkyl reaction used here: GO:0000140 has RHEA:36175
                (1-O-alkyl-DHAP reduction) as a narrow-match cross-reference
                alongside its exact-match acyl-DHAP reaction. GO has no
                separate alkyl-DHAP reductase term.
              substrates:
                - preferred_term: 1-O-alkylglycerone 3-phosphate
                - preferred_term: NADPH
              products:
                - preferred_term: 1-O-alkyl-sn-glycero-3-phosphate
                - preferred_term: NADP(+)
              evidence:
                - source_id: RHEA:36175
                  statement: a 1-O-alkylglycerone 3-phosphate + NADPH + H(+) = a 1-O-alkyl-sn-glycero-3-phosphate + NADP(+)
                  notes: EC 1.1.1.101; narrowMatch of GO:0000140
                - source_id: PMID:22863804
                  title: Inhibiting adipose tissue lipogenesis reprograms thermogenesis and PPARγ activation to decrease diet-induced obesity.
                  statement: >-
                    Mouse DHRS7B was identified as PexRAP by orthology to the
                    yeast acyl/alkyl-DHAP reductase Ayr1p. Its knockdown lowers
                    1-O-alkyl ether phospholipids. The activity is inferred from
                    orthology and the knockdown phenotype; the paper reports no
                    direct enzyme assay.
                  supporting_text: >-
                    we used this sequence to identify DHRS7b, a protein of unknown
                    function, as a mammalian ortholog
                - source_id: PMID:22863804
                  title: Inhibiting adipose tissue lipogenesis reprograms thermogenesis and PPARγ activation to decrease diet-induced obesity.
                  statement: PexRAP knockdown lowers ether phospholipid levels.
                  supporting_text: >-
                    we knocked down PexRAP expression in MEFs (Figure 5F) and found
                    decreased levels of 1-O-alkyl ether phospholipids
            locations:
              - preferred_term: peroxisomal membrane
                term:
                  id: GO:0005778
                  label: peroxisomal membrane
            role_description: >-
              Reduces the C2 ketone of alkyl-DHAP, giving the
              1-O-alkyl-glycerol 3-phosphate exported to the ER.
    - order: 5
      role: plasmanylethanolamine assembly
      node:
        id: plasmanyl_pe_assembly_step
        label: 1-O-alkyl-sn-glycerol 3-phosphate to plasmanylethanolamine
        module_type: METABOLIC_PATHWAY
        description: >-
          ER steps: sn-2 acylation (RHEA:36235), dephosphorylation of
          1-O-alkyl-2-acyl-glycerol 3-phosphate, and transfer of
          phosphoethanolamine from CDP-ethanolamine (RHEA:36187). The
          acyltransferases and phosphatases are shared with diacyl
          glycerolipid synthesis, so no annoton is asserted for them.
          The head-group step is asserted because SELENOI (EPT1) is
          needed for normal plasmenyl-PE levels in human cells.
        annotons:
          - id: selenoi_activity
            label: SELENOI ethanolaminephosphotransferase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: ethanolaminephosphotransferase activity
                term:
                  id: GO:0004307
                  label: ethanolaminephosphotransferase activity
              family:
                preferred_term: EPT1 / SELENOI subfamily
                term:
                  id: PANTHER:PTHR10414:SF47
                  label: ETHANOLAMINEPHOSPHOTRANSFERASE 1
                representative_members:
                  - preferred_term: SELENOI (human)
                    term:
                      id: UniProtKB:Q9C0D9
                      label: Ethanolaminephosphotransferase 1
                    description: ER membrane enzyme; reviewed in genes/human/SELENOI.
            function:
              preferred_term: ethanolaminephosphotransferase activity
              term:
                id: GO:0004307
                label: ethanolaminephosphotransferase activity
              substrates:
                - preferred_term: 1-O-alkyl-2-acyl-sn-glycerol
                - preferred_term: CDP-ethanolamine
              products:
                - preferred_term: 1-O-alkyl-2-acyl-sn-glycero-3-phosphoethanolamine
                - preferred_term: CMP
              evidence:
                - source_id: RHEA:36187
                  statement: 1-O-alkyl-2-acyl-sn-glycerol + CDP-ethanolamine = a 1-O-alkyl-2-acyl-sn-glycero-3-phosphoethanolamine + CMP + H(+)
                - source_id: PMID:29500230
                  title: EPT1 (selenoprotein I) is critical for the neural development and maintenance of plasmalogen in humans.
                  statement: Loss of SELENOI lowers plasmenyl-PE in patient cells.
                  supporting_text: most plasmenyl-PE species were significantly decreased in the patient's cells
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Adds the ethanolamine head group, giving plasmanyl-PE,
              the desaturase substrate.
    - order: 6
      role: plasmalogen vinyl-ether desaturation (plasmanyl-PE -> plasmenyl-PE)
      node:
        id: plasmalogen_desaturation
        label: Plasmanylethanolamine desaturase (PEDS1/TMEM189)
        module_type: REACTION
        annotons:
          - id: peds1_activity
            label: "PEDS1: plasmanylethanolamine desaturase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PEDS1 / plasmanylethanolamine desaturase (fatty-acid-desaturase-like) family
                term:
                  id: PANTHER:PTHR48177
                  label: TRANSMEMBRANE PROTEIN 189
                representative_members:
                  - preferred_term: PEDS1 / TMEM189 (human)
                    term:
                      id: UniProtKB:A5PLL7
                      label: Plasmanylethanolamine desaturase 1
                  - preferred_term: CarF (Myxococcus xanthus)
                    term:
                      id: UniProtKB:Q9AE87
                      label: Plasmanylethanolamine desaturase
                    description: >-
                      Bacterial ortholog in the same PANTHER subfamily
                      (PTHR48177:SF1). Its identification as the desaturase
                      led to the assignment of human TMEM189 (PMID:31604315).
            function:
              preferred_term: plasmanylethanolamine desaturase activity
              term:
                id: GO:0050207
                label: plasmanylethanolamine desaturase activity
              substrates:
                - preferred_term: plasmanylethanolamine (1-O-alkyl-2-acyl-GPE)
                - preferred_term: O2 + reduced cytochrome b5 (di-iron)
              products:
                - preferred_term: plasmenylethanolamine (ethanolamine plasmalogen; 1-O-alk-1'-enyl)
              evidence:
                - source_id: file:human/PEDS1/PEDS1-ai-review.yaml
                  statement: ER-membrane di-iron desaturase introducing the plasmalogen vinyl-ether double bond (final plasmalogen-defining step)
                - source_id: RHEA:22956
                  statement: plasmanyl-PE + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = plasmenyl-PE + 2 Fe(III)-[cytochrome b5] + 2 H2O
                  notes: EC 1.14.19.77
                - source_id: PMID:31604315
                  title: A bacterial light response reveals an orphan desaturase for human plasmalogen synthesis.
                  statement: CarF and its human ortholog are the plasmanylethanolamine desaturase.
                  supporting_text: plasmanylethanolamine desaturase activity that is essential for vinyl ether bond
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: Introduce the 1-O-alk-1'-enyl (vinyl-ether) bond, making the plasmalogen.
  connections:
    - source: fatty_alcohol_synthesis
      target: ether_bond_formation
      connection_type: PROVIDES_INPUT_FOR
      description: FAR-made fatty alcohol is the alkyl donor AGPS uses to form the ether bond.
    - source: dhap_acylation
      target: ether_bond_formation
      connection_type: PROVIDES_INPUT_FOR
      description: GNPAT-made acyl-DHAP is the AGPS substrate whose acyl group is exchanged for the fatty alcohol.
    - source: ether_bond_formation
      target: alkyl_dhap_reduction_step
      connection_type: PROVIDES_INPUT_FOR
      description: AGPS-made alkyl-DHAP is reduced by PexRAP.
    - source: alkyl_dhap_reduction_step
      target: plasmanyl_pe_assembly_step
      connection_type: PROVIDES_INPUT_FOR
      description: 1-O-alkyl-glycerol 3-phosphate is completed to plasmanylethanolamine in the ER.
    - source: plasmanyl_pe_assembly_step
      target: plasmalogen_desaturation
      connection_type: PROVIDES_INPUT_FOR
      description: Plasmanylethanolamine is the PEDS1 substrate.
  notes: >-
    Ether lipid / plasmalogen biosynthesis (GO:0008611), grounded mainly in human gene reviews. The
    peroxisomal ether-bond-forming module plus the ER plasmalogen-defining desaturation: FAR1 (Q8WVX9, rate-
    limiting, plasmalogen-feedback-regulated) / FAR2 (Q96K12, paralog), both PTHR11011, GO:0102965, reduce
    acyl-CoA -> fatty alcohol at the peroxisomal membrane; GNPAT/DHAPAT (O15228 PTHR12563, GO:0016287)
    acylates DHAP -> acyl-DHAP (first committed step); AGPS (O00116 PTHR46568, GO:0008609, FAD) exchanges the
    acyl for the FAR fatty alcohol -> alkyl-DHAP (committed ether-bond step; GNPAT-AGPS complex, peroxisomal
    matrix); PexRAP/DHRS7B (Q6IAN0, GO:0000140) reduces alkyl-DHAP; in the ER the shared sn-2 acyltransferases and phosphatases (described, not asserted) and SELENOI/EPT1 (Q9C0D9, GO:0004307) assemble plasmanylethanolamine; then PEDS1/TMEM189 (A5PLL7 PTHR48177, GO:0050207) introduces the
    vinyl-ether double bond -> plasmenylethanolamine. Curation: FAR1/FAR2 very-long-chain (GO:0080019) MF is a
    chain-length over-annotation (they prefer C16/C18, hence GO:0102965); GNPAT cytosol TAS = transient PTS1
    pre-import cargo (non-core); AGPS mitochondrion HDA = peroxisome co-fractionation contaminant. Diseases:
    rhizomelic chondrodysplasia punctata - PEX7/RCDP1, GNPAT/RCDP2, AGPS/RCDP3, FAR1/RCDP4. GO term ids/labels
    verified against the local go.db; module passes structural + term-label validation.
    The bacterial anaerobic route, which reduces a diacyl phospholipid directly
    (PlsA/PlsAR), is modelled with this module as its eukaryotic alternative in
    plasmalogen_biosynthesis. SELENOI (Q9C0D9) also appears in
    kennedy_pathway_phospholipid_synthesis, for the diacyl
    phosphatidylethanolamine branch. Here it is the ether-lipid head-group step.
