id: MODULE:ygff_glucose_dehydrogenase
title: YgfF NAD-dependent glucose 1-dehydrogenase
description: >-
  A draft single-reaction module for the E. coli SDR63C enzyme YgfF, whose
  DeepECtransformer-predicted glucose 1-dehydrogenase activity was validated in
  vitro. YgfF oxidizes D-glucose to D-glucono-1,5-lactone using NAD+ as the
  electron acceptor. The physiological pathway that uses this activity in vivo
  is not yet established.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0047934
    title: glucose 1-dehydrogenase (NAD+) activity
    statement: Defines the YgfF NAD-dependent oxidation of D-glucose to D-glucono-1,5-lactone.
  - source_id: file:genes/ECOLI/ygfF/ygfF-ai-review.yaml
    title: ECOLI ygfF gene review
    statement: >-
      The completed E. coli ygfF review grounds the in-vitro validated
      glucose 1-dehydrogenase activity while keeping the physiological role open.
  - source_id: PMID:37963869
    title: Functional annotation of enzyme-encoding genes using deep learning with transformer layers.
    statement: >-
      Reports the DeepECtransformer prediction of YgfF glucose
      1-dehydrogenase activity and the confirming purified-enzyme assay.
  - source_id: PMID:40703034
    title: Limitations of current machine learning models in predicting enzymatic functions for uncharacterized proteins.
    statement: >-
      Places YgfF in the SDR63C/glucose 1-dehydrogenase subgroup and flags the
      remaining need for in-vivo context.
notes: >-
  This module intentionally asserts no broader glucose-catabolic process for
  YgfF until genetic or metabolic evidence establishes where this reaction
  contributes in the cell.
