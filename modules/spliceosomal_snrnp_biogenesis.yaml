id: MODULE:spliceosomal_snrnp_biogenesis
title: Human Sm-class spliceosomal snRNP biogenesis — PRMT5-WDR77 methylosome symmetric dimethylation and pICln chaperoning of Sm proteins, SMN-Gemin complex loading of the Sm ring onto snRNA, TGS1 cap hypermethylation, snurportin-importin beta nuclear import, and Cajal body maturation
description: >-
  The U1, U2, U4 and U5 small nuclear ribonucleoproteins (snRNPs) of the major spliceosome,
  and U11, U12 and U4atac of the minor spliceosome, each contain a ring of seven Sm proteins
  (SmB/B', SmD1, SmD2, SmD3, SmE, SmF and SmG) bound to the Sm site of the small nuclear RNA
  (snRNA). In vertebrate cells this ring is not allowed to form spontaneously. After
  transcription by RNA polymerase II, the capped snRNA precursor is exported to the
  cytoplasm. There, newly made Sm proteins are first taken up by the PRMT5 complex
  (methylosome): PRMT5, with its obligate WD-repeat partner WDR77 (MEP50), symmetrically
  dimethylates arginines in the RG-rich C-terminal tails of SmB/B', SmD1 and SmD3, and the
  adaptor pICln (CLNS1A) holds Sm proteins as a 6S ring-like intermediate that cannot bind
  RNA. The SMN complex (SMN, Gemin2 to Gemin8 and STRAP/unrip) then takes over the Sm
  proteins, releases pICln, and, with Gemin5 selecting the snRNA, closes the Sm ring on the
  Sm site in an ATP-dependent reaction that ensures Sm cores form only on correct RNAs. The
  trimethylguanosine synthase TGS1, recruited by SMN, then converts the snRNA
  7-methylguanosine cap to a 2,2,7-trimethylguanosine (m3G) cap with two methyl groups from
  S-adenosyl-L-methionine, and the 3' end is trimmed. The m3G cap and the Sm core together
  form the nuclear import signal: snurportin-1 binds the m3G cap and, through its
  importin-beta-binding domain, docks importin beta, which carries the snRNP core, still
  bound to the SMN complex, through the nuclear pore. In the nucleus the new snRNPs pass
  through Cajal bodies, where small Cajal body-specific RNPs guide 2'-O-methylation and
  pseudouridylation of the snRNA and particle-specific proteins join before the snRNPs
  enter splicing.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001073
    title: spliceosome pathway
    statement: >-
      RGD's spliceosome pathway (id and label checked against .cache/rgd_pw/pw.obo; no PW
      children). Its text describes the Sm ring of seven Sm proteins threaded on the Sm site
      of U1, U2, U4 and U5 snRNAs, which is the structure this module assembles. RGD annotates
      the seven Sm genes (SNRPB, SNRPD1, SNRPD2, SNRPD3, SNRPE, SNRPF, SNRPG) to the pathway
      but none of the assembly factors. This module is item 1 of the spliceosome split plan
      in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md and covers the biogenesis
      of the snRNPs the pathway uses. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001073.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
    statement: RGD describes the Sm ring bound to the Sm site of the U1, U2, U4 and U5 snRNAs.
    supporting_text: The U1, U2, U4 and U5 snRNAs have an Sm site, bound by a group of seven Sm proteins
  - source_id: GO:0000387
    title: spliceosomal snRNP assembly
    statement: >-
      The module's process concept, part_of GO:0000398 mRNA splicing, via spliceosome, the GO
      process mapped to PW:0001073 (skos:narrowMatch in
      projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). Every protein participant except
      coilin, snurportin-1 and importin beta carries an experimental or curated GOA row for
      it.
  - source_id: GO:0000398
    title: mRNA splicing, via spliceosome
    statement: >-
      The GO process mapped to PW:0001073 in the seed. This module supplies the snRNPs that
      the splicing modules use; it does not model splicing itself.
  - source_id: PMID:18984161
    title: An assembly chaperone collaborates with the SMN complex to generate spliceosomal SnRNPs.
    statement: The PRMT5 and SMN complexes together form the Sm core domain in vivo, as a chaperone-catalyst system.
    supporting_text: PRMT5 and SMN complexes mediate the formation of the core domain in vivo.
  - source_id: PMID:12459587
    title: Essential role for the SMN complex in the specificity of snRNP assembly.
    statement: The SMN complex is the assembly machine for Sm cores on U snRNAs.
    supporting_text: the SMN complex is necessary and sufficient to mediate the ATP-dependent assembly of the core of seven Sm proteins on uridine-rich, small nuclear ribonucleic acids (U snRNAs)
  - source_id: PMID:12776181
    title: Interaction between the small-nuclear-RNA cap hypermethylase and the spinal muscular atrophy protein, survival of motor neuron.
    statement: The order of the pathway, cytoplasmic Sm core assembly then cap hypermethylation, both required for import.
    supporting_text: The biogenesis of spliceosomal small nuclear ribonucleoproteins (snRNPs) requires the cytoplasmic assembly of the Sm-core complex, followed by the hypermethylation of the small nuclear RNA (snRNA) 5' cap.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001073 (spliceosome pathway) as item 1
  of the spliceosome split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md;
  seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 114
  RGD-curated human genes). PW:0001073 has no PW children, so it is the only PW evidence
  source. Siblings drafted in the same tranche: major_spliceosome_cycle (the snRNPs and the
  assembly states of the U2-type spliceosome) and splice_site_selection_regulators (SR
  proteins and hnRNPs).

  Gene selection. Of the 114 genes RGD annotates to PW:0001073 (.cache/rgd_pw/homo_genes_pw),
  none is an snRNP assembly factor: the list contains the seven Sm proteins and the seven
  LSm proteins, which are what this pathway assembles, but not PRMT5, WDR77, CLNS1A, SMN1,
  SMN2, the Gemins, STRAP, TGS1, SNUPN, KPNB1 or COIL. Every protein participant of this
  module is therefore added beyond RGD, each with explicit human evidence cited on its
  annoton: the methylosome (PRMT5, WDR77, CLNS1A; PMID:11713266, PMID:11756452,
  PMID:17709427, PMID:18984161), the SMN complex (SMN1/SMN2, GEMIN2, DDX20, GEMIN4 to GEMIN8,
  STRAP; PMID:12459587, PMID:17178713, PMID:16434402, PMID:16159890, PMID:21816274,
  PMID:20513430), TGS1 (PMID:18775984, PMID:12776181), the import receptors SNUPN and KPNB1
  (PMID:9670026, PMID:11815630, PMID:9362492, PMID:16030253) and COIL (PMID:16687569). The
  RGD-listed SMNDC1 (SPF30), a paralogue of SMN, is a spliceosome component rather than an
  assembly factor and belongs to major_spliceosome_cycle. UniProt accessions and names are
  from UniProt REST (November 2026); SMN1 and SMN2 encode the same protein, one UniProt entry.
  Molecular functions are from each protein's experimental human GOA rows in QuickGO
  (November 2026) or the core functions of the GEMIN5 and GEMIN7 gene reviews, the only
  members with reviews here. Functions authored without an exact experimental GOA row: the
  pICln chaperone activity (a proposed new term), SNUPN RNA trimethylguanosine cap binding
  (refined from a TAS row for RNA cap binding), and snRNA import into nucleus as the process
  of the import step (refined from IDA rows for RNA import into nucleus). The structure
  follows modules/dmel_smn_complex.yaml (structure only; no Drosophila evidence is used).

  Boundary decisions. (1) Substrate versus participant. The Sm proteins are what the
  pathway assembles: they are the methylosome's substrates (targets on the methyltransferase
  annoton) and the clients of pICln and the SMN complex, so they are not units here. They are
  modelled once, as snRNP units, in major_spliceosome_cycle. The snRNAs are not gene products
  in this model and appear only in prose and as the cap-bearing substrate of TGS1. (2) Two
  metabolic steps are grounded to Rhea and ChEBI: PRMT5 symmetric arginine dimethylation
  (RHEA:48108, two S-adenosyl-L-methionine per arginine) and TGS1 cap hypermethylation
  (RHEA:78471 then RHEA:78479). (3) Subunits assayed only as complexes get no catalytic
  function: WDR77 and pICln in the methylosome, and SMN, GEMIN2, GEMIN4, GEMIN6, GEMIN8 and
  STRAP in the SMN complex, are units without a function. The SMN complex annoton itself has
  no molecular function because GO has no activity term for Sm core assembly; this is not
  requested as a new term, since the process GO:0000387 already records it. (4) PRMT7 is not
  modelled: its requirement for Sm protein methylation rests on one RNAi study
  (PMID:17709427), and its product on Sm proteins has not been placed in the assembly
  pathway. RIOK1 and COPRS, alternative PRMT5 adaptors that compete with pICln and recruit
  other substrates, are outside the Sm pathway. (5) The upstream steps, snRNA transcription
  by Pol II (rna_polymerase_ii_core_and_initiation), capping (pre_mrna_capping, which notes
  that its enzymes also cap snRNA transcripts) and the PHAX, cap-binding complex and XPO1
  export of the snRNA precursor, are not modelled here; snRNA export differs from mRNA export
  and is not part of mrna_nuclear_export. (6) The snRNP import step is modelled here rather
  than by reference to karyopherin_nuclear_protein_import, because the cargo is an RNP, the
  adaptor recognises an RNA cap, and import needs neither importin alpha nor, in vitro, Ran.
  (7) Cajal body maturation is an optional context part with coilin as a located participant
  only. The scaRNA-guided 2'-O-methylation and pseudouridylation of snRNAs is mentioned but
  its box C/D and H/ACA enzymes (fibrillarin, dyskerin and partners) and the scaRNA
  localisation factor WRAP53 are not modelled; they would belong to a snoRNP-guided RNA
  modification module. (8) U6 snRNP biogenesis is out of scope: U6 is a Pol III transcript
  with a gamma-monomethyl cap and an LSm2-8 ring on its 3' end rather than an Sm ring, it
  does not use the SMN or TGS1 steps, and its LSm proteins (RGD-listed) are units of the U6
  snRNP in major_spliceosome_cycle. (9) Minor (U12-type) snRNPs U11, U12 and U4atac receive
  Sm rings by the same pathway, and GEMIN5 binds U4atac snRNA; no minor-specific assembly
  factor is needed, so the module covers them without separate parts. The U7 snRNP, whose
  ring has LSM10 and LSM11 in place of SmD1 and SmD2 (GO:0034731), is histone mRNA processing
  and out of scope. (10) Later, particle-specific steps (U1-, U2- and U5-specific proteins,
  tri-snRNP assembly by the U4/U6 recycling factors) belong to major_spliceosome_cycle.

  GO-CAM links. No production GO-CAM in gocams/index.tsv models snRNP assembly, and none
  contains SMN1, a Gemin, CLNS1A, WDR77, TGS1, SNUPN or COIL. PRMT5 is in
  gomodel:69d8496c00000667 (methylation of CGAS, negative regulation of cGAS/STING
  signalling), with the same molecular function but a different substrate and process; it is
  not linked. KPNB1 is in five models of NLS-protein import (SREBP, KAT8, AARS1), not linked.
  Mouse Strap is in gomodel:5fce9b7300001742 (Strap in alternative splicing), with U2 snRNP
  binding and mRNA binding for splicing of specific transcripts, not snRNP biogenesis; not
  linked. PANTHER family ids and PTNs are deliberately not asserted.

  Possible upstream issues (queries only, from GOA rows read in QuickGO; full texts not
  read). (a) SNUPN carries only the general GO:0000339 RNA cap binding (TAS, PMID:9670026)
  although the paper shows specific m3G-cap binding, GO:0000341. (b) SNUPN and KPNB1 carry
  GO:0006404 RNA import into nucleus (ComplexPortal, PMID:9670026); the cargo is the snRNP,
  for which GO:0061015 snRNA import into nucleus is the more specific term. (c) PRMT5, WDR77
  and CLNS1A carry GO:0048026 positive regulation of mRNA splicing, via spliceosome (NAS,
  PMID:11756452); the methylosome makes snRNPs rather than regulating splicing, so this may
  be an over-annotation. (d) GO:0035243 lacks a Rhea cross-reference; recorded in
  proposed_ontology_changes. The missing pICln activity term is in proposed_new_terms.
proposed_new_terms:
  - proposed_name: Sm protein complex chaperone activity
    proposed_definition: >-
      Binding to newly synthesised Sm proteins and holding them as a ring-like intermediate
      that cannot associate with RNA, then releasing them to an snRNP assembly machine (in
      metazoa the SMN complex) for loading onto the Sm site of an snRNA.
    justification: >-
      pICln (CLNS1A) is the assembly chaperone of Sm-class snRNP biogenesis: it binds the Sm
      folds, forms 6S complexes with the SmD1-SmD2-SmE-SmF-SmG pentamer and the SmD3-SmB
      dimer, prevents premature RNA binding, and is displaced by the SMN complex. GO has
      chaperone activities for histone complexes (GO:0000510, GO:0000511, under GO:0140713
      histone chaperone activity, itself under GO:0140597 protein carrier activity) but none
      for Sm proteins, and CLNS1A has no experimental molecular-function row other than
      high-throughput RNA binding. The proposed term is modelled on the histone complex
      chaperone terms and used on the pICln annoton of this module.
    proposed_parent:
      id: GO:0140597
      label: protein carrier activity
    supported_by:
      - reference_id: PMID:18984161
        supporting_text: Our data identify pICln as an assembly chaperone and the SMN complex as a catalyst of spliceosomal snRNP formation.
      - reference_id: PMID:18984161
        supporting_text: In this state, the Sm proteins are kinetically trapped, preventing their association with snRNA.
      - reference_id: PMID:11713266
        supporting_text: We further demonstrate the existence of a 6S complex that contains pICln, SmD1, and SmD3 but not JBP1.
proposed_ontology_changes:
  - change_type: OTHER
    ontology: GO
    about_node:
      id: GO:0035243
      label: protein-arginine omega-N symmetric methyltransferase activity
    new_value: RHEA:48112
    change_dsl: add xref RHEA:48112 to GO:0035243
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      GO:0035243 is defined as the addition of a second methyl group to a monomethylated
      arginine to give symmetric dimethylarginine and carries EC:2.1.1.320, but has no Rhea
      cross-reference. RHEA:48112 (N(omega)-methyl-L-arginyl-[protein] +
      S-adenosyl-L-methionine = N(omega),N(omega)'-dimethyl-L-arginyl-[protein] +
      S-adenosyl-L-homocysteine + H(+)) is exactly that step; RHEA:48108 is the overall
      EC 2.1.1.320 reaction from unmodified arginine, which would fit a parent term. A
      mapping request, recorded here so that it is not left in prose.
module:
  id: spliceosomal_snrnp_biogenesis
  label: Human Sm-class spliceosomal snRNP biogenesis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: spliceosomal snRNP assembly
      term:
        id: GO:0000387
        label: spliceosomal snRNP assembly
      description: >-
        The GO process for the whole pathway (Reactome R-HSA-191859 snRNP Assembly is its
        cross-reference); every part is a step of it.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: symmetric arginine dimethylation of Sm proteins and their capture as an RNA-free assembly intermediate
      node:
        id: methylosome_step
        label: PRMT5-WDR77-pICln methylosome dimethylates SmB/B', SmD1 and SmD3 and pICln holds Sm proteins in the 6S complex
        module_type: PROTEIN_COMPLEX
        description: >-
          The 20S methylosome contains PRMT5, WDR77 and pICln. PRMT5 binds the RG-rich tails
          of SmD1 and SmD3 (and SmB/B') and makes symmetric dimethylarginine; pICln binds the
          Sm folds and, after methylation, forms with SmD1-SmD2-SmE-SmF-SmG and SmD3-SmB the
          6S pICln-Sm intermediates that are handed to the SMN complex.
        concepts:
          - preferred_term: methylosome
            term:
              id: GO:0034709
              label: methylosome
          - preferred_term: pICln-Sm protein complex
            term:
              id: GO:0034715
              label: pICln-Sm protein complex
        annotons:
          - id: methylosome_sm_dimethylation
            label: PRMT5, with WDR77, symmetrically dimethylates arginines in the RG tails of SmB/B', SmD1 and SmD3
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: methylosome (PRMT5-WDR77-pICln)
                term:
                  id: GO:0034709
                  label: methylosome
                active_units:
                  - id: prmt5_unit
                    label: PRMT5
                    role: catalytic subunit; type II protein arginine methyltransferase that binds the Sm RG tails and S-adenosyl-L-methionine
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PRMT5
                        term:
                          id: UniProtKB:O14744
                          label: Protein arginine N-methyltransferase 5
                    function:
                      preferred_term: protein-arginine omega-N symmetric methyltransferase activity
                      term:
                        id: GO:0035243
                        label: protein-arginine omega-N symmetric methyltransferase activity
                  - id: wdr77_unit
                    label: WDR77
                    role: obligate WD-repeat partner of PRMT5 (MEP50); needed for methylosome activity and binds a subset of Sm proteins
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WDR77
                        term:
                          id: UniProtKB:Q9BQA1
                          label: Methylosome protein WDR77
                  - id: clns1a_unit
                    label: CLNS1A (pICln)
                    role: substrate adaptor that binds the Sm folds and recruits Sm proteins to PRMT5; its chaperone role is the second annoton of this node
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CLNS1A
                        term:
                          id: UniProtKB:P54105
                          label: Methylosome subunit pICln
            function:
              preferred_term: protein-arginine omega-N symmetric methyltransferase activity
              term:
                id: GO:0035243
                label: protein-arginine omega-N symmetric methyltransferase activity
              substrates:
                - preferred_term: arginine residues in the RG-rich tails of SmB/B', SmD1 and SmD3
                  term:
                    id: CHEBI:29965
                    label: L-argininium residue
                - preferred_term: S-adenosyl-L-methionine (two per arginine)
                  term:
                    id: CHEBI:59789
                    label: S-adenosyl-L-methionine zwitterion
              products:
                - preferred_term: symmetric dimethylarginine residues in the Sm tails
                  term:
                    id: CHEBI:88221
                    label: N(omega),N('omega)-dimethyl-L-arginine(1+) residue
                - preferred_term: S-adenosyl-L-homocysteine
                  term:
                    id: CHEBI:57856
                    label: S-adenosyl-L-homocysteine zwitterion
                - preferred_term: H+
                  term:
                    id: CHEBI:15378
                    label: hydron
              targets:
                - preferred_term: SmB/B' (SNRPB)
                  term:
                    id: UniProtKB:P14678
                    label: Small nuclear ribonucleoprotein-associated proteins B and B'
                - preferred_term: SmD1 (SNRPD1)
                  term:
                    id: UniProtKB:P62314
                    label: Small nuclear ribonucleoprotein Sm D1
                - preferred_term: SmD3 (SNRPD3)
                  term:
                    id: UniProtKB:P62318
                    label: Small nuclear ribonucleoprotein Sm D3
              evidence:
                - source_id: RHEA:48108
                  statement: >-
                    L-arginyl-[protein] + 2 S-adenosyl-L-methionine =
                    N(omega),N(omega)'-dimethyl-L-arginyl-[protein] + 2
                    S-adenosyl-L-homocysteine + 2 H(+); the EC 2.1.1.320 master reaction. The
                    GO:0035243 definition (the second, symmetric methyl transfer) corresponds to
                    RHEA:48112 (N(omega)-methyl-L-arginyl-[protein] + S-adenosyl-L-methionine =
                    N(omega),N(omega)'-dimethyl-L-arginyl-[protein] + S-adenosyl-L-homocysteine
                    + H(+)); PRMT5 makes both methyl transfers, so the overall reaction is
                    given. GO:0035243 carries EC:2.1.1.320 but no Rhea cross-reference (see
                    proposed_ontology_changes). ChEBI participants from Rhea; labels checked in
                    OLS (November 2026).
                  notes: EC:2.1.1.320
            processes:
              - preferred_term: spliceosomal snRNP assembly
                term:
                  id: GO:0000387
                  label: spliceosomal snRNP assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The one metabolic (methyl-transfer) step of the module. PRMT5 carries the
              catalytic activity: its experimental human rows for GO:0035243 include EXP
              (PMID:21081503, PMID:23071334) and IMP (PMID:17709427, loss of Sm protein sDMA on
              PRMT5 knockdown). WDR77 and pICln have no catalytic function of their own: WDR77
              is required for methylosome activity and binds Sm proteins (PMID:11756452), and
              pICln binds the Sm folds and delivers Sm proteins to PRMT5. WDR77 is therefore a
              unit without a function (its experimental GOA rows, transcription coactivator
              activity and methyl-CpG binding, concern other roles), and pICln's function is
              placed on the chaperone annoton below. The Sm proteins are the substrates
              (targets), not participants; they are modelled as snRNP units in the sibling
              module major_spliceosome_cycle. Methylation directs Sm proteins to the SMN
              complex, which binds sDMA-modified RG tails preferentially.
            evidence:
              - source_id: PMID:11713266
                statement: The methylosome contains JBP1 (PRMT5) and pICln; PRMT5 binds the RG tails of SmD1 and SmD3 and pICln their Sm domains.
                supporting_text: JBP1 binds SmD1 and SmD3 via their RG domains, while pICln binds the Sm domains.
              - source_id: PMID:11713266
                statement: PRMT5 produces symmetric dimethylarginine in the Sm proteins.
                supporting_text: JBP1 produces sDMAs in the RG domain-containing Sm proteins.
              - source_id: PMID:11756452
                statement: WDR77 (MEP50) is a methylosome subunit required for its activity and binds PRMT5 and Sm proteins.
                supporting_text: We show that MEP50 is important for methylosome activity and binds to JBP1 and to a subset of Sm proteins.
              - source_id: PMID:17709427
                statement: Sm protein sDMA modification is required for snRNP biogenesis in human cells.
                supporting_text: we provide in vivo evidence demonstrating that Sm protein sDMA modification is required for snRNP biogenesis in human cells
          - id: picln_sm_chaperone
            label: pICln holds Sm proteins in 6S ring-like intermediates that cannot bind RNA until the SMN complex takes them over
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: 6S pICln-Sm protein complex
                term:
                  id: GO:0034715
                  label: pICln-Sm protein complex
                active_units:
                  - id: clns1a_chaperone_unit
                    label: CLNS1A (pICln)
                    role: assembly chaperone; kinetically traps the Sm proteins as a higher-order unit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CLNS1A
                        term:
                          id: UniProtKB:P54105
                          label: Methylosome subunit pICln
                    function:
                      preferred_term: Sm protein complex chaperone activity
                      description: >-
                        Proposed term (top-level proposed_new_terms); GO has no chaperone
                        activity for Sm proteins.
            function:
              preferred_term: Sm protein complex chaperone activity
              description: >-
                Proposed term, see proposed_new_terms. The client Sm proteins are the
                SmD1-SmD2-SmE-SmF-SmG pentamer and the SmD3-SmB dimer, modelled in
                major_spliceosome_cycle.
            processes:
              - preferred_term: spliceosomal snRNP assembly
                term:
                  id: GO:0000387
                  label: spliceosomal snRNP assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Curator-authored function: CLNS1A has no experimental molecular-function row in
              human GOA beyond high-throughput RNA binding, and GO has no term for its activity,
              so a new term is proposed. CLNS1A carries IDA rows for GO:0034715 pICln-Sm
              protein complex and GO:0000387 (both PMID:18984161). The complex term is the
              6S complex of Friesen et al. (PMID:11713266), which lacks PRMT5.
            evidence:
              - source_id: PMID:11713266
                statement: A 6S complex contains pICln, SmD1 and SmD3 but not PRMT5.
                supporting_text: We further demonstrate the existence of a 6S complex that contains pICln, SmD1, and SmD3 but not JBP1.
              - source_id: PMID:18984161
                statement: pICln induces a higher-order Sm unit in which Sm proteins are kinetically trapped and cannot bind snRNA.
                supporting_text: In this state, the Sm proteins are kinetically trapped, preventing their association with snRNA.
              - source_id: PMID:18984161
                statement: The authors identify pICln as an assembly chaperone.
                supporting_text: Our data identify pICln as an assembly chaperone and the SMN complex as a catalyst of spliceosomal snRNP formation.
    - order: 2
      role: ATP-dependent loading of the Sm ring onto the Sm site of the snRNA
      node:
        id: smn_complex_step
        label: SMN-Gemin complex takes over the Sm proteins, releases pICln and closes the Sm ring on the snRNA
        module_type: PROTEIN_COMPLEX
        description: >-
          The SMN complex binds sDMA-modified Sm proteins, displaces pICln from the 6S
          intermediates, receives the snRNA selected by Gemin5, and closes the heptameric Sm
          ring on the Sm site. Only correct snRNA targets receive Sm cores.
        concepts:
          - preferred_term: SMN complex
            term:
              id: GO:0032797
              label: SMN complex
          - preferred_term: SmD-containing SMN-Sm protein complex
            term:
              id: GO:0034730
              label: SmD-containing SMN-Sm protein complex
        annotons:
          - id: smn_complex_sm_core_assembly
            label: The SMN complex assembles the Sm core on U snRNAs
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: SMN complex (SMN, Gemin2-8, STRAP/unrip)
                term:
                  id: GO:0032797
                  label: SMN complex
                active_units:
                  - id: smn_unit
                    label: SMN (SMN1 and SMN2)
                    role: >-
                      oligomeric core scaffold; its Tudor domain binds the sDMA tails of
                      SmD1, SmD3 and SmB/B', and it binds Gemin2 and, with Gemin7 and
                      Gemin8, forms the centre of the complex. One UniProt entry covers the
                      products of both SMN1 and SMN2.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SMN1/SMN2
                        term:
                          id: UniProtKB:Q16637
                          label: Survival motor neuron protein
                  - id: gemin2_unit
                    label: GEMIN2
                    role: wraps the SmD1-SmD2-SmE-SmF-SmG pentamer and blocks its RNA-binding pocket until the snRNA is loaded; bound to SMN
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN2
                        term:
                          id: UniProtKB:O14893
                          label: Gem-associated protein 2
                  - id: ddx20_unit
                    label: DDX20 (Gemin3)
                    role: DEAD-box ATPase subunit; its role in the ATP-dependent assembly reaction is not resolved
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DDX20
                        term:
                          id: UniProtKB:Q9UHI6
                          label: Probable ATP-dependent RNA helicase DDX20
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: gemin4_unit
                    label: GEMIN4
                    role: peripheral subunit bound to Gemin3; no assembly activity of its own established
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN4
                        term:
                          id: UniProtKB:P57678
                          label: Gem-associated protein 4
                  - id: gemin5_unit
                    label: GEMIN5
                    role: snRNA-selecting subunit; recognises the Sm site and adjacent 3' stem-loop of pre-snRNAs and delivers them to the SMN complex
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN5
                        term:
                          id: UniProtKB:Q8TEQ6
                          label: Gem-associated protein 5
                    function:
                      preferred_term: snRNA binding
                      term:
                        id: GO:0017069
                        label: snRNA binding
                  - id: gemin6_unit
                    label: GEMIN6
                    role: Sm-fold subunit; heterodimer with Gemin7
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN6
                        term:
                          id: UniProtKB:Q8WXD5
                          label: Gem-associated protein 6
                  - id: gemin7_unit
                    label: GEMIN7
                    role: Sm-fold subunit; heterodimer with Gemin6, docked onto SMN through Gemin8, and binding site for unrip
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN7
                        term:
                          id: UniProtKB:Q9H840
                          label: Gem-associated protein 7
                    function:
                      preferred_term: protein heterodimerization activity
                      term:
                        id: GO:0046982
                        label: protein heterodimerization activity
                  - id: gemin8_unit
                    label: GEMIN8
                    role: links the Gemin6-Gemin7 heterodimer to SMN; required for efficient snRNP assembly
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GEMIN8
                        term:
                          id: UniProtKB:Q9NWZ8
                          label: Gem-associated protein 8
                  - id: strap_unit
                    label: STRAP (unrip)
                    role: cytoplasm-restricted subunit recruited through Gemin7; influences the intracellular distribution of the SMN complex
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: STRAP
                        term:
                          id: UniProtKB:Q9Y3F4
                          label: Serine-threonine kinase receptor-associated protein
            processes:
              - preferred_term: spliceosomal snRNP assembly
                term:
                  id: GO:0000387
                  label: spliceosomal snRNP assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              No molecular function is placed on the complex: GO has no activity term for
              chaperone-mediated Sm core assembly, and the assembly is recorded as the
              process GO:0000387, which every subunit carries by experimental evidence
              (EXP, PMID:12067652; IDA, PMID:18984161). Unit functions come from experimental
              GOA rows or gene reviews: GEMIN5 snRNA binding (IDA, PMID:16857593; core
              function of the GEMIN5 review), GEMIN7 protein heterodimerization activity
              (core function of the GEMIN7 review), and DDX20 ATP hydrolysis activity (EXP,
              PMID:10383418 and PMID:20510246). The RNA helicase activity of DDX20 rests on a
              TAS row only and is not used. SMN's only experimental molecular-function rows
              are identical protein binding (oligomerisation), so SMN, GEMIN2, GEMIN4, GEMIN6,
              GEMIN8 and STRAP are units without a function; their roles are stated. The
              Sm proteins and the snRNA are what the complex assembles (substrates); the Sm
              proteins are modelled as snRNP units in major_spliceosome_cycle, and snRNAs
              are not gene products in this model.
            evidence:
              - source_id: PMID:12459587
                statement: The SMN complex is necessary and sufficient for ATP-dependent Sm core assembly on U snRNAs and restricts Sm cores to correct RNAs.
                supporting_text: the SMN complex is necessary and sufficient to mediate the ATP-dependent assembly of the core of seven Sm proteins on uridine-rich, small nuclear ribonucleic acids (U snRNAs)
              - source_id: PMID:12459587
                statement: The SMN complex ensures Sm cores assemble only on correct RNA targets.
                supporting_text: the SMN complex is necessary to ensure that Sm cores assemble only on correct RNA targets and prevent their otherwise promiscuous association with other RNAs
              - source_id: PMID:18984161
                statement: The SMN complex binds the pICln-Sm units, dissociates pICln and catalyses ring closure on snRNA.
                supporting_text: The SMN complex subsequently binds to these Sm protein units, dissociates pICln, and catalyzes ring closure on snRNA.
              - source_id: PMID:11713266
                statement: SMN binds the sDMA-modified RG domains of SmD1 and SmD3 directly and preferentially.
                supporting_text: SMN binds preferentially and directly to the symmetrical dimethylarginine (sDMA)-modified arginine- and glycine-rich (RG-rich) domains of SmD1 and SmD3.
              - source_id: PMID:21816274
                statement: Gemin2 binds the Sm pentamer and occupies its RNA-binding pocket.
                supporting_text: Gemin2 reaches into the RNA-binding pocket, preventing RNA binding.
              - source_id: PMID:17178713
                statement: SMN, Gemins 2-8 and unrip are the major components of the human SMN complex, with SMN, Gemin8 and Gemin7 at its centre.
                supporting_text: Our studies reveal a modular composition of the SMN complex with the three proteins SMN, Gemin8, and Gemin7 in its center.
              - source_id: PMID:20513430
                statement: Gemin5 recognises the Sm site and adjacent 3' stem-loop of snRNAs and delivers pre-snRNAs to the SMN complex.
                supporting_text: Gemin5 recognizes a snRNP code comprised of the Sm site [A(U)5-6G] and an adjacent 3′-terminal stem-loop structure in the snRNAs
              - source_id: PMID:16434402
                statement: Gemin8 binds the Gemin6-Gemin7 heterodimer and, with unrip, forms a subunit of the SMN complex; its knockdown impairs snRNP assembly.
                supporting_text: Gemin8 interacts directly with the Gemin6-Gemin7 heterodimer and, together with unrip, these proteins form a heteromeric subunit of the SMN complex.
              - source_id: PMID:16159890
                statement: Unrip (STRAP) joins the SMN complex through Gemin7 and is cytoplasmic.
                supporting_text: unrip is recruited to the active SMN complex via a stable interaction with Gemin7
    - order: 3
      role: hypermethylation of the snRNA cap from m7G to m3G
      node:
        id: cap_hypermethylation_step
        label: TGS1 converts the m7G cap of the Sm-core-bound snRNA to a 2,2,7-trimethylguanosine cap
        module_type: REACTION
        concepts:
          - preferred_term: 7-methylguanosine cap hypermethylation
            term:
              id: GO:0036261
              label: 7-methylguanosine cap hypermethylation
        annotons:
          - id: tgs1_cap_hypermethylation
            label: TGS1 makes two successive guanine-N2 methyl transfers from S-adenosyl-L-methionine to the snRNA m7G cap
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TGS1
                term:
                  id: UniProtKB:Q96RS0
                  label: Trimethylguanosine synthase
            function:
              preferred_term: RNA cap trimethylguanosine synthase activity
              term:
                id: GO:0071164
                label: RNA cap trimethylguanosine synthase activity
              substrates:
                - preferred_term: m7GpppN cap of the snRNA
                  term:
                    id: CHEBI:156461
                    label: 5'-(N(7)-methyl 5'-triphosphoguanosine)-ribonucleoside(2-) residue
                - preferred_term: S-adenosyl-L-methionine (two per cap)
                  term:
                    id: CHEBI:59789
                    label: S-adenosyl-L-methionine zwitterion
              products:
                - preferred_term: m3G (2,2,7-trimethylguanosine) cap of the snRNA
                  term:
                    id: CHEBI:167623
                    label: 5'-end (N(2),N(2),N(7)-trimethyl 5'-triphosphoguanosine)- ribonucleoside(2-) residue
                - preferred_term: S-adenosyl-L-homocysteine
                  term:
                    id: CHEBI:57856
                    label: S-adenosyl-L-homocysteine zwitterion
                - preferred_term: H+
                  term:
                    id: CHEBI:15378
                    label: hydron
              evidence:
                - source_id: RHEA:78471
                  statement: >-
                    First methyl transfer: a 5'-end (N(7)-methyl
                    5'-triphosphoguanosine)-ribonucleoside in snRNA + S-adenosyl-L-methionine
                    = a 5'-end (N(2),N(7)-dimethyl 5'-triphosphoguanosine)-ribonucleoside in
                    snRNA (CHEBI:172880) + S-adenosyl-L-homocysteine + H(+). Cross-referenced
                    from GO:0071164.
                - source_id: RHEA:78479
                  statement: >-
                    Second methyl transfer: a 5'-end (N(2),N(7)-dimethyl
                    5'-triphosphoguanosine)-ribonucleoside in snRNA + S-adenosyl-L-methionine
                    = a 5'-end (N(2),N(2),N(7)-trimethyl 5'-triphosphoguanosine)-ribonucleoside
                    in snRNA + S-adenosyl-L-homocysteine + H(+). Cross-referenced from
                    GO:0071164; the snoRNA reactions RHEA:78475 and RHEA:78507 are the same
                    chemistry on another substrate and are not part of this module. ChEBI
                    participants from Rhea; labels checked in OLS (November 2026).
            processes:
              - preferred_term: 7-methylguanosine cap hypermethylation
                term:
                  id: GO:0036261
                  label: 7-methylguanosine cap hypermethylation
              - preferred_term: spliceosomal snRNP assembly
                term:
                  id: GO:0000387
                  label: spliceosomal snRNP assembly
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              The second metabolic step of the module. TGS1 carries IDA rows for GO:0071164
              and GO:0036261 (PMID:16687569). It is recruited to the snRNA by SMN, so cap
              hypermethylation follows Sm core assembly; both the Sm core and the m3G cap are
              needed for import. TGS1 is also in Cajal bodies and hypermethylates snoRNA and
              telomerase RNA caps there; those substrates are outside this module. The
              location is the cytoplasm, where the Sm snRNA cap is hypermethylated, rather
              than the cytosol, because the localisation evidence does not resolve further.
            evidence:
              - source_id: PMID:18775984
                statement: TGS1 converts m7G caps to the TMG caps of spliceosomal snRNAs; the paper characterises the human guanine-N2 methyltransferase reaction.
                supporting_text: Trimethylguanosine synthase (Tgs1) is the enzyme that converts standard m(7)G caps to the 2,2,7-trimethylguanosine (TMG) caps characteristic of spliceosomal small nuclear RNAs.
              - source_id: PMID:12776181
                statement: Human TGS1 binds SMN directly and shares its cytoplasmic and Cajal body localisation, coupling Sm core assembly to cap hypermethylation.
                supporting_text: the SMN protein also functions in the recruitment of the snRNA cap hypermethylase
              - source_id: PMID:12776181
                statement: Cap hypermethylation follows cytoplasmic Sm core assembly, and both are required for snRNP import.
                supporting_text: Both the Sm-core complex and the snRNA trimethylguanosine cap are required for the efficient nuclear import of snRNPs.
    - order: 4
      role: nuclear import of the m3G-capped Sm core
      node:
        id: snrnp_nuclear_import_step
        label: Snurportin-1 binds the m3G cap and importin beta carries the Sm-class snRNP core into the nucleus
        module_type: TRANSPORT_STEP
        concepts:
          - preferred_term: snRNA import into nucleus
            term:
              id: GO:0061015
              label: snRNA import into nucleus
        annotons:
          - id: snurportin_importin_beta_import
            label: Snurportin-1 adaptor and importin beta receptor import the m3G-capped snRNP core
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: snurportin-1-importin beta snRNP import complex
                active_units:
                  - id: snupn_unit
                    label: SNUPN (snurportin-1)
                    role: import adaptor; its C-terminal domain binds the m3G cap and its N-terminal importin-beta-binding (IBB) domain binds importin beta
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SNUPN
                        term:
                          id: UniProtKB:O95149
                          label: Snurportin-1
                    function:
                      preferred_term: RNA trimethylguanosine cap binding
                      term:
                        id: GO:0000341
                        label: RNA trimethylguanosine cap binding
                  - id: kpnb1_unit
                    label: KPNB1 (importin beta)
                    role: import receptor; binds the snurportin-1 IBB domain and mediates translocation through the nuclear pore
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: KPNB1
                        term:
                          id: UniProtKB:Q14974
                          label: Importin subunit beta-1
                    function:
                      preferred_term: nuclear import signal receptor activity
                      term:
                        id: GO:0061608
                        label: nuclear import signal receptor activity
            function:
              preferred_term: nuclear import signal receptor activity
              term:
                id: GO:0061608
                label: nuclear import signal receptor activity
              cargo:
                - preferred_term: m3G-capped Sm-class snRNP core (U1, U2, U4, U5), still bound to the SMN complex
                  term:
                    id: GO:0097525
                    label: spliceosomal snRNP complex
            processes:
              - preferred_term: snRNA import into nucleus
                term:
                  id: GO:0061015
                  label: snRNA import into nucleus
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The import complex has no GO cellular-component term, so the descriptor carries
              no term. KPNB1 carries IDA rows for GO:0061608 (PMID:14645851, PMID:20818336)
              and, with SNUPN, for GO:0006404 RNA import into nucleus (PMID:9670026);
              GO:0061015 snRNA import into nucleus is its more specific child and is used here
              as a curator refinement, since the cargo is the snRNP. SNUPN's GOA row is the
              general GO:0000339 RNA cap binding (TAS, PMID:9670026); the more specific
              GO:0000341 RNA trimethylguanosine cap binding is curator-authored from the same
              paper, which shows binding to m3G but not m7G caps. Recombinant snurportin-1
              and importin beta suffice for U1 snRNP import into permeabilised HeLa nuclei,
              without Ran or energy; the Sm core signal is recognised separately, through the
              SMN complex that travels with the snRNP. This route is distinct from the
              importin alpha/beta import of NLS proteins modelled in
              karyopherin_nuclear_protein_import, which is therefore not referenced as a
              part. Release of snurportin-1 and its export by XPO1 are not modelled.
            evidence:
              - source_id: PMID:9670026
                statement: Snurportin-1 binds m3G but not m7G caps, enhances m3G-cap-dependent snRNP import, and has an N-terminal IBB domain.
                supporting_text: Here, we describe the isolation and cDNA cloning of a 45 kDa protein, termed snurportin1, which interacts specifically with m3G-cap but not m7G-cap structures.
              - source_id: PMID:11815630
                statement: Recombinant snurportin-1 and importin beta are necessary and sufficient for U1 snRNP import into nuclei of permeabilised HeLa cells.
                supporting_text: recombinant snurportin1 and importin-beta (impbeta) are not only necessary, but also sufficient for U1 snRNP transport to the nuclei of digitonin-permeabilized HeLa cells
              - source_id: PMID:9362492
                statement: U snRNP import requires importin beta but not importin alpha.
                supporting_text: Thus importin beta is required for U snRNP import, and it functions in this process without the NLS-specific importin alpha.
              - source_id: PMID:16030253
                statement: A snurportin-1 IBB mutant that cannot bind importin beta is defective for snRNP import, which purified SMN complexes can rescue.
                supporting_text: Nuclear transport assays showed that this IBB mutant is deficient for snRNP import but that import can be rescued by addition of purified survival of motor neurons (SMN) protein complexes.
    - order: 5
      role: nuclear maturation of newly imported snRNPs in Cajal bodies (context)
      optional: true
      node:
        id: cajal_body_maturation
        label: Newly imported snRNPs concentrate in coilin-scaffolded Cajal bodies, where scaRNPs guide snRNA modification
        module_type: CELLULAR_COMPONENT
        description: >-
          After import, new Sm-class snRNPs accumulate in Cajal bodies, where small Cajal
          body-specific RNPs (scaRNPs) guide 2'-O-methylation and pseudouridylation of the
          snRNAs. Coilin is the scaffold of the Cajal body. The scaRNP enzymes are box C/D
          and H/ACA RNP components shared with snoRNA-guided rRNA modification and are not
          modelled here.
        concepts:
          - preferred_term: Cajal body
            term:
              id: GO:0015030
              label: Cajal body
        annotons:
          - id: coilin_cajal_body_scaffold
            label: Coilin assembles the Cajal body in which new snRNPs condense
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: COIL
                term:
                  id: UniProtKB:P38432
                  label: Coilin
            locations:
              - preferred_term: Cajal body
                term:
                  id: GO:0015030
                  label: Cajal body
            role_description: >-
              Context, not a catalytic step. Coilin carries IDA rows for Cajal body
              localisation (PMID:16687569 and others) but no experimental molecular function
              other than identical protein binding, and no experimental process row for snRNP
              assembly, so it is a located participant without a function or process. Coilin
              depletion prevents U snRNPs from condensing into Cajal bodies, and loss of
              SMN, TGS1 or PHAX disperses Cajal bodies, so the body depends on ongoing snRNP
              biogenesis; whether it is required for snRNP maturation is not established
              here, which is why the part is optional.
            evidence:
              - source_id: PMID:16687569
                statement: Coilin is required for the condensation of U snRNPs into nucleoplasmic foci and canonical Cajal bodies.
                supporting_text: We demonstrate by siRNA-mediated depletion that coilin is required for the condensation of U snRNPs, but not C/D box snoRNP components, into nucleoplasmic foci, and also for merging these factors into canonical CBs.
              - source_id: PMID:16687569
                statement: Cajal body integrity depends on ongoing U snRNP biogenesis.
                supporting_text: This indicates that the integrity of canonical CBs is dependent on ongoing U snRNP biogenesis.
              - source_id: PMID:12032087
                statement: scaRNAs localise to Cajal bodies and guide 2'-O-methylation and pseudouridylation of the Pol II-transcribed spliceosomal snRNAs.
                supporting_text: The small Cajal body-specific RNAs (scaRNAs) are predicted or have already been demonstrated to function as guide RNAs in site-specific synthesis of 2'-O-ribose-methylated nucleotides and pseudouridines in the RNA polymerase II-transcribed U1, U2, U4 and U5 spliceosomal small nuclear RNAs (snRNAs).
  connections:
    - source: methylosome_step
      target: smn_complex_step
      connection_type: PRECEDES
      description: >-
        sDMA-modified Sm proteins held by pICln are transferred to the SMN complex, which
        displaces pICln; methylation directs the Sm proteins to SMN.
    - source: smn_complex_step
      target: cap_hypermethylation_step
      connection_type: PRECEDES
      description: >-
        TGS1 is recruited by SMN and hypermethylates the cap of the Sm-core-bound snRNA; the
        Sm core is formed first.
    - source: cap_hypermethylation_step
      target: snrnp_nuclear_import_step
      connection_type: PRECEDES
      description: The m3G cap made by TGS1 is the signal bound by snurportin-1.
    - source: snrnp_nuclear_import_step
      target: cajal_body_maturation
      connection_type: PRECEDES
      description: Newly imported snRNPs transit Cajal bodies before joining splicing.
