  connections:
    - source: nhej_upstream_signalling
      target: ku_end_binding
      connection_type: POSITIVELY_REGULATES
      description: 53BP1-RIF1 blocks resection, keeping ends double-stranded and available to Ku.
    - source: ku_end_binding
      target: dna_pk_activation
      connection_type: POSITIVELY_REGULATES
      description: Ku recruits DNA-PKcs to the ends (RGD draws Xrcc5 and Xrcc6 --+> Prkdc).
    - source: dna_pk_activation
      target: end_processing
      connection_type: POSITIVELY_REGULATES
      description: DNA-PKcs autophosphorylation releases the ends, and DNA-PKcs phosphorylates and activates Artemis.
    - source: ku_end_binding
      target: gap_filling
      connection_type: POSITIVELY_REGULATES
      description: Ku recruits pol mu and pol lambda through their BRCT domains.
    - source: ku_end_binding
      target: ligation
      connection_type: POSITIVELY_REGULATES
      description: Ku recruits XRCC4-LIG4, XLF and PAXX; PAXX binds Ku directly.
    - source: end_processing
      target: ligation
      connection_type: PROVIDES_INPUT_FOR
      description: Processing produces 5'-phosphate and 3'-hydroxyl termini that LIG4 can seal.
    - source: gap_filling
      target: ligation
      connection_type: PROVIDES_INPUT_FOR
      description: Filled gaps leave ligatable nicks.
knowledge_gaps:
  - gap_statement: >-
      Whether APLF's reported endo- and exonuclease activity operates during
      chromosomal NHEJ, or whether APLF acts only as a poly(ADP-ribose)- and
      Ku-dependent scaffold that retains XRCC4-LIG4 and chaperones histones, is
      unresolved.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      How the DNA-PK long-range synaptic complex transitions to the short-range
      complex in which XRCC4-LIG4, XLF and PAXX align the ends for ligation, and how
      DNA-PKcs autophosphorylation and the partial redundancy of XLF and PAXX
      control this transition and end-processing access in cells, is incompletely
      understood.
    gap_kind:
      - BIOLOGY
