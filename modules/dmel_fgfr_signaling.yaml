id: MODULE:dmel_fgfr_signaling
title: FGFR signaling pathway in Drosophila melanogaster
description: >-
  Drosophila has two FGF receptor tyrosine kinases with distinct ligands. Breathless (Btl)
  is activated by Branchless (Bnl) and guides tracheal branch migration, and Heartless (Htl)
  is activated by Pyramus and Thisbe and directs the spreading and migration of mesoderm and
  glial cells. Both receptors use the FGFR-specific cytoplasmic adaptor Stumps (Downstream
  of FGFR, Dof). Signaling proceeds through Drk, Sos, Ras85D and the Raf-Dsor1-Rolled MAP
  kinase cascade, ending in ETS factor output (Pointed activation, Yan/Aop relief). Pebble,
  a Rho exchange factor, acts in Heartless-dependent mesoderm migration.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000967
  title: 'FlyBase gene group FGFR: Fgfr signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 35 D. melanogaster genes as fgfr signaling pathway (FGFR);
    this module models that group.
- source_id: GO:0008543
  title: fibroblast growth factor receptor signaling pathway
  statement: >-
    GO term grounding the module as fibroblast growth factor receptor signaling pathway.
notes: >-
  Boundary. Core components only (FlyBase FGFR-C). The adaptors, Ras and the MAP kinase cascade
  are shared with EGFR, Sevenless and Torso signaling. Heparan sulfate proteoglycans (Dally,
  Dlp, Trol), Sprouty and other FlyBase regulators are not parts. FlyBase groups realized
  by this module: FGFR (FBgg0000967). Subgroups folded into it: FGFR-C. FlyBase also curates
  regulator sets for this pathway, which are context and not modelled as parts: FGFR-N (negative
  regulators of fgfr signaling pathway, 7 genes); FGFR-P (positive regulators of fgfr signaling
  pathway, 7 genes). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_fgfr_signaling.yaml;
  none of the member genes has a gene review yet unless noted.
