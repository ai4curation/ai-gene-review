id: MODULE:nematode_cuticle_collagen_maturation
title: Nematode cuticle collagen maturation
description: >-
  Nematode cuticle collagens are synthesized as secretory procollagens and are
  matured by a conserved series of processing reactions. In the endoplasmic
  reticulum, prolyl 4-hydroxylase alpha subunits, with protein disulfide
  isomerase as beta subunit, hydroxylate prolines in collagen Gly-Xaa-Pro
  repeats. The furin/kexin-like subtilisin BLI-4 then cleaves the amino
  termini of cuticle collagens in the secretory pathway to allow secretion,
  and the extracellular astacin DPY-31 cleaves carboxyl-terminal propeptides
  to produce mature collagens for cuticle assembly. The module is centered on
  the nematode exoskeleton: the C. elegans proteins define the genetically
  supported pathway, while Brugia malayi and Haemonchus contortus DPY-31
  orthologs anchor parasite representatives of the same astacin C-proteinase
  subfamily.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10805750
    title: >-
      Prolyl 4-hydroxylase is an essential procollagen-modifying enzyme
      required for exoskeleton formation and the maintenance of body shape in
      the nematode Caenorhabditis elegans.
    statement: >-
      C. elegans DPY-18/PHY-1, PHY-2 and PDI-2 are procollagen prolyl
      4-hydroxylase subunits required for collagen modification, cuticle
      formation, embryonic elongation and body-shape maintenance.
  - source_id: PMID:12036960
    title: >-
      The exoskeleton collagens in Caenorhabditis elegans are modified by
      prolyl 4-hydroxylases with unique combinations of subunits.
    statement: >-
      C. elegans cuticle collagens are hydroxylated by ER-localized PHY-1/PDI-2,
      PHY-2/PDI-2 and mixed PHY-1/PHY-2/PDI-2 prolyl 4-hydroxylase tetramers.
  - source_id: PMID:37721936
    title: >-
      The proprotein convertase BLI-4 promotes collagen secretion prior to
      assembly of the Caenorhabditis elegans cuticle.
    statement: >-
      BLI-4 is a proprotein convertase that performs N-terminal processing of
      cuticle collagens before their secretion and cuticle assembly.
  - source_id: PMID:19883650
    title: >-
      Collagen processing and cuticle formation is catalysed by the astacin
      metalloprotease DPY-31 in free-living and parasitic nematodes.
    statement: >-
      DPY-31/NAS-35 is an astacin metalloprotease that cleaves procollagen
      C-termini, with experimentally tested members from C. elegans,
      B. malayi and H. contortus.
  - source_id: file:genes/BRUMA/dpy-31/dpy-31-ai-review.yaml
    title: BRUMA dpy-31 gene review
    statement: >-
      The Brugia malayi dpy-31 review accepts metalloendopeptidase activity in
      extracellular procollagen C-terminal processing as the DPY-31 core
      function.
notes: >-
  Boundary. The module starts with hydroxylation of nascent cuticle collagen
  chains by a prolyl 4-hydroxylase complex, continues through BLI-4-dependent
  N-terminal collagen cleavage before secretion, and ends with DPY-31-family
  C-terminal cleavage in the extracellular/cuticular space. It is not a full
  cuticle-assembly module: collagen transcription, trimer folding, cross-linking,
  the BLI-5 Kunitz-domain cofactor, and extracellular collagen polymerization
  are outside this first boundary until their direct molecular roles and
  ortholog sets are reviewed.

  Grounding. PTHR10869 grounds nematode procollagen proline 4-hydroxylase alpha
  proteins, represented here by the two C. elegans alpha subunits DPY-18/PHY-1
  and PHY-2. PTHR18929 grounds the protein disulfide isomerase family,
  represented by C. elegans PDI-2, the beta subunit of the cuticle collagen
  prolyl 4-hydroxylase complexes. PTHR42884 grounds BLI-4 in the furin/kexin
  proprotein convertase family. PTHR10127:SF813 specifically groups DPY-31/NAS-35
  astacins from B. malayi, H. contortus and C. elegans. BRUMA A8Q2D1 already has
  a gene review; the remaining representatives are intentionally left on
  projects/NEMATODE_PATHOGENS.md for follow-up reviews.
