id: MODULE:nematode_cuticle_collagen_maturation
title: Nematode cuticle collagen maturation
description: >-
  Nematode cuticle collagens are synthesized as secretory procollagens and are
  matured by a conserved series of processing reactions. In the endoplasmic
  reticulum, PHY-1 and PHY-2 prolyl 4-hydroxylase alpha subunits assemble with
  the PDI-2 beta subunit as dimeric or mixed tetrameric enzymes that
  hydroxylate prolines in collagen Gly-Xaa-Pro repeats. The furin/kexin-like
  subtilisin BLI-4 promotes N-terminal processing of cuticle collagens in the
  secretory pathway to allow efficient early secretion, and the extracellular
  astacin DPY-31 cleaves carboxyl-terminal propeptides to produce mature
  collagens for cuticle assembly. The module is centered on the nematode
  exoskeleton: the C. elegans proteins define the genetically supported
  pathway, while Brugia malayi and Haemonchus contortus DPY-31 orthologs
  anchor parasite representatives of the same astacin C-proteinase subfamily.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10805750
    title: >-
      Prolyl 4-hydroxylase is an essential procollagen-modifying enzyme
      required for exoskeleton formation and the maintenance of body shape in
      the nematode Caenorhabditis elegans.
    statement: >-
      C. elegans encodes two procollagen prolyl 4-hydroxylase alpha subunits
      and one PDI beta subunit, and phy-1/dpy-18 loss reduces cuticle-collagen
      hydroxyproline and gives a dumpy body morphology.
    supporting_text: >-
      We identified genes encoding two PHYs and a single associated PDI and
      showed that all three are expressed in collagen-synthesizing ectodermal
      cells at times of maximal collagen synthesis. Disruption of the pdi gene
      via RNA interference resulted in embryonic lethality. Similarly, the
      combined phy genes are required for embryonic development. Interference
      with phy-1 resulted in a morphologically dumpy phenotype, which we
      determined to be identical to the uncharacterized dpy-18 locus. Two
      dpy-18 mutant strains were shown to have null alleles for phy-1 and to
      have a reduced hydroxyproline content in their exoskeleton collagens.
  - source_id: PMID:12036960
    title: >-
      The exoskeleton collagens in Caenorhabditis elegans are modified by
      prolyl 4-hydroxylases with unique combinations of subunits.
    statement: >-
      PHY-1, PHY-2 and PDI-2 assemble in vivo as a PHY-1/PHY-2/(PDI-2)2 mixed
      tetramer and as PHY-1/PDI-2 and PHY-2/PDI-2 dimers, all expressed in
      cuticle-collagen-synthesizing hypodermis.
    supporting_text: >-
      We report here that three unique P4H forms are assembled from these
      polypeptides and the single beta subunit PDI-2, both in a recombinant
      expression system and in vivo, namely a PHY-1/PHY-2/(PDI-2)(2) mixed
      tetramer and PHY-1/PDI-2 and PHY-2/PDI-2 dimers. The mixed tetramer is the
      main P4H form in wild-type C. elegans but phy-2-/- and phy-1-/- (dpy-18)
      mutant nematodes can compensate for its absence by increasing the assembly
      of the PHY-1/PDI-2 and PHY-2/PDI-2 dimers, respectively.
  - source_id: PMID:37721936
    title: >-
      The proprotein convertase BLI-4 promotes collagen secretion prior to
      assembly of the Caenorhabditis elegans cuticle.
    statement: >-
      BLI-4/PCSK is required for efficient early secretion of the cuticle
      collagens SQT-3 and DPY-17, and BLI-4 loss phenocopies mutation of their
      predicted N-terminal consensus furin cleavage sites.
    supporting_text: >-
      Furthermore, this early secretion depends on BLI-4/PCSK; in bli-4 and
      cleavage-site mutants, SQT-3 and DPY-17 are not efficiently secreted and
      instead form large intracellular puncta.
  - source_id: PMID:19883650
    title: >-
      Collagen processing and cuticle formation is catalysed by the astacin
      metalloprotease DPY-31 in free-living and parasitic nematodes.
    statement: >-
      DPY-31/NAS-35 is an astacin metalloprotease that cleaves procollagen
      C-termini, with experimentally tested members from C. elegans,
      B. malayi and H. contortus.
    supporting_text: >-
      In addition, the recombinant DPY-31 enzymes from both H. contortus and B.
      malayi were shown to efficiently process the C. elegans cuticle collagen
      SQT-3 at the correct C-terminal procollagen processing site.
  - source_id: file:genes/BRUMA/dpy-31/dpy-31-ai-review.yaml
    title: BRUMA dpy-31 gene review
    statement: >-
      The Brugia malayi dpy-31 review accepts metalloendopeptidase activity in
      extracellular procollagen C-terminal processing as the DPY-31 core
      function.
notes: >-
  Boundary. The module starts with hydroxylation of nascent cuticle collagen
  chains by prolyl 4-hydroxylase complexes, continues through a BLI-4-dependent
  N-terminal collagen-processing step before efficient early secretion, and ends
  with DPY-31-family C-terminal cleavage in the extracellular/cuticular space.
  It is not a full cuticle-assembly module: collagen transcription, trimer
  folding, cross-linking, the BLI-5 Kunitz-domain cofactor, and extracellular
  collagen polymerization are outside this first boundary until their direct
  molecular roles and ortholog sets are reviewed.

  Grounding. PTHR10869 grounds nematode procollagen proline 4-hydroxylase alpha
  proteins, represented here by the two C. elegans alpha subunits DPY-18/PHY-1
  and PHY-2. PTHR18929 grounds the protein disulfide isomerase family,
  represented by C. elegans PDI-2, the beta subunit of the cuticle collagen
  prolyl 4-hydroxylase complexes. PTHR42884 grounds BLI-4 in the furin/kexin
  proprotein convertase family. PTHR10127:SF813 specifically groups DPY-31/NAS-35
  astacins from B. malayi, H. contortus and C. elegans; those three
  representatives now have matching gene reviews.
module:
