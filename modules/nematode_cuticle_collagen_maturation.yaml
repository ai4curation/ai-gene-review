      description: >-
        GO biological process for formation of the collagenous nematode
        cuticle, the shared output of the processing steps modeled here.
    - preferred_term: molting cycle, collagen and cuticulin-based cuticle
      term:
        id: GO:0018996
        label: molting cycle, collagen and cuticulin-based cuticle
      description: >-
        Periodic replacement of the collagenous cuticle; DPY-31-family
        processing is required for this cycle.
