    - source: acetoacetate_activation
      target: acetoacetyl_coa_thiolysis
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        Both activation variants produce acetoacetyl-CoA, which the downstream
        thiolase cleaves to two acetyl-CoA molecules. The automated GO-to-RHEA
        string check may miss the SCOT branch because that reaction can use the
        generic class 3-oxoacyl-CoA while the thiolase reaction names the
        specific member acetoacetyl-CoA; the class relationship is not visible
        to the string matcher.
  knowledge_gaps:
    - gap_statement: >-
        The physiologically dominant KT2440 enzyme for terminal
        acetoacetyl-CoA thiolysis has not been established among its thiolase
        paralogs.
      boundary: >-
        Keep the terminal participant family-level; BktB is a reaction-capable
        candidate, not an asserted pathway assignment.
      gap_kind:
        - BIOLOGY
        - CURATION
    - gap_statement: >-
        It is unresolved whether KT2440 primarily receives
        D-3-hydroxybutyrate by BhbP-mediated uptake or from an intracellular
        storage-polymer-derived source, and whether HbdH and Aacs dominate the
        corresponding reactions in vivo.
      boundary: >-
        Uptake remains optional and the oxidation and ligation leaves remain
        family selectors with KT2440 candidates rather than species-specific
        assertions.
      gap_kind:
        - BIOLOGY
notes: >-
  Scope is species-neutral: the reaction chain is conserved from bacteria to
  animals, and lineage differences are modelled as variants (two dehydrogenase
  lineages, two activation routes) rather than as separate modules. CONCRETE
  denotes the defined reaction topology; family selectors keep the participants
  reusable. Human BDH1, OXCT1, AACS and ACAT1 are the experimentally
  characterized exemplars. Pseudomonas putida KT2440 supplies a complete
  bacterial instance with the bhbP-hbdH-aacs locus (PP_3074, PP_3073, PP_3071)
  and BktB (PP_3754) as a reaction-capable thiolase; these assignments rest on
  family signatures and on the orthologous, (R)-3-hydroxybutyrate-inducible
  PA2004-bdhA operon of P. aeruginosa, not on assays of the KT2440 proteins.
  Animal AACS is listed as an exemplar of the ligase chemistry, but in animals
  it mainly feeds cytosolic lipogenesis; animal ketolysis uses the SCOT route.
  PANTHER grounding: the uptake, bacterial dehydrogenase and thiolase steps use
  InterPro signatures because their PANTHER families (PTHR30354 Gnt
  transporters, PTHR42879 FabG-type SDRs, PTHR18919 thiolases) are
  substrate-heterogeneous. Family reviews exist for all six PANTHER families of
  the members (PTHR30354, PTHR42879, PTHR43313, PTHR13707, PTHR42921,
  PTHR18919) and record the subfamily-level divergence.
  Storage-polymer-derived D-3-hydroxybutyrate is a possible intracellular entry
  in bacteria that make poly-3-hydroxybutyrate; KT2440 makes mainly
  medium-chain-length PHA, so its substrate source remains unresolved.
