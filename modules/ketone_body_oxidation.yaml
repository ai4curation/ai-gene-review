id: MODULE:ketone_body_oxidation
title: Ketone-body uptake and oxidation
description: >-
  A reusable pathway for use of D-3-hydroxybutyrate and acetoacetate as a carbon
  and energy source. D-3-hydroxybutyrate is oxidized to acetoacetate by an
  NAD+-dependent short-chain dehydrogenase, acetoacetate is activated to
  acetoacetyl-CoA, and a thiolase cleaves acetoacetyl-CoA to two acetyl-CoA.
  The same chemistry is carried by different enzyme lineages: animals use the
  mitochondrial SDR9C dehydrogenase BDH1, whereas bacteria use a separate
  FabG-type SDR, and acetoacetate is activated either by succinyl-CoA-dependent
  CoA transfer (animal SCOT) or by ATP-dependent acetoacetate-CoA ligation
  (bacterial and animal acetoacetyl-CoA synthetases). Substrate import is an
  optional upstream role for cells that consume extracellular
  D-3-hydroxybutyrate; D-3-hydroxybutyrate released inside the cell, for example
  by storage-polymer turnover, enters at the oxidation step.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0046952
    title: ketone body catabolic process
    statement: GO:0046952 provides the biological-process boundary for ketone-body utilization.
  - source_id: file:PSEPK/bhbP/bhbP-uniprot.txt
    title: UniProtKB entry for PSEPK BhbP
    statement: >-
      Q88IC5 is a Gnt-family (IPR003474, PTHR30354:SF7) multi-pass permease
      encoded beside hbdH and aacs.
  - source_id: file:PSEPK/hbdH/hbdH-uniprot.txt
    title: UniProtKB entry for PSEPK HbdH
    statement: >-
      Q88IC6 matches the bacterial 3-hydroxybutyrate dehydrogenase family
      IPR011294 and NCBIfam TIGR01963.
  - source_id: file:PSEPK/aacs/aacs-uniprot.txt
    title: UniProtKB entry for PSEPK Aacs
    statement: >-
      Q88IC8 matches the acetoacetyl-CoA synthetase family (IPR005914,
      TIGR01217, PTHR42921:SF1).
  - source_id: PMID:26311173
    title: The metabolism of (R)-3-hydroxybutyrate is regulated by the enhancer-binding protein PA2005 and the alternative sigma factor RpoN in Pseudomonas aeruginosa PAO1.
    statement: >-
      A Pseudomonas model establishes D-3-hydroxybutyrate oxidation to
      acetoacetate while noting that the genus does not generally produce PHB.
  - source_id: PMID:10735852
    title: Requirement for the enzymes acetoacetyl coenzyme A synthetase and poly-3-hydroxybutyrate (PHB) synthase for growth of Sinorhizobium meliloti on PHB cycle intermediates.
    statement: >-
      Sinorhizobium genetics establish ATP-dependent acetoacetate activation as
      a bacterial alternative to CoA-transferase activation.
  - source_id: PMID:8679568
    title: Wild type and mutant human heart (R)-3-hydroxybutyrate dehydrogenase expressed in insect cells.
    statement: >-
      Recombinant human BDH1 has native-like kinetics for NAD+ and
      (R)-3-hydroxybutyrate and requires phosphatidylcholine, grounding the
      animal oxidation variant.
  - source_id: PMID:7140777
    title: Purification and characterization of acetoacetyl-CoA synthetase from Zoogloea ramigera I-16-M.
    statement: >-
      A purified bacterial acetoacetyl-CoA synthetase activates acetoacetate
      with ATP and CoA, giving acetoacetyl-CoA, AMP and diphosphate.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The local ppu00650 membership includes hbdH and aacs in butanoate
      metabolism, while the adjacent bhbP permease supplies the pathway input.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK gene inventory
    statement: >-
      The exact Q88GH0/PP_3754 record assigns BktB both EC 2.3.1.9 and EC
      2.3.1.16, establishing reaction capability but not which thiolase is used
      physiologically in D-3-hydroxybutyrate catabolism.
