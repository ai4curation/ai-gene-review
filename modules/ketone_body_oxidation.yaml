                      id: UniProtKB:Q88IC5
                      label: D-beta-hydroxybutyrate permease
                    description: Pseudomonas putida KT2440 BhbP/PP_3074.
            function:
              preferred_term: monocarboxylic acid transmembrane transporter activity
              term:
                id: GO:0008028
                label: monocarboxylic acid transmembrane transporter activity
              substrates:
