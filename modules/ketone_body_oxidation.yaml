id: MODULE:ketone_body_oxidation
title: Ketone-body uptake and oxidation
description: >-
  A reusable pathway for use of D-3-hydroxybutyrate as a carbon and energy
  source. D-3-hydroxybutyrate is oxidized to acetoacetate, acetoacetate is
  activated to acetoacetyl-CoA, and a thiolase can cleave acetoacetyl-CoA to
  acetyl-CoA. Organisms differ in the activation reaction: animal ketolysis
  generally uses a succinyl-CoA-dependent CoA transferase, whereas some
  bacteria use an ATP-dependent acetoacetate-CoA ligase. Substrate import is an
  optional upstream role for organisms that consume extracellular ketone
  bodies. Intracellular D-3-hydroxybutyrate released from storage-polymer
  metabolism can enter at the oxidation step. Pseudomonas putida KT2440
  provides candidate exemplars for import, oxidation, and ATP-dependent
  activation; their pathway dominance and the terminal thiolase remain to be
  resolved experimentally.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0046952
    title: ketone body catabolic process
    statement: GO:0046952 provides the biological-process boundary for ketone-body utilization.
  - source_id: file:PSEPK/bhbP/bhbP-uniprot.txt
    title: UniProtKB entry for PSEPK BhbP
    statement: Q88IC5 is assigned as a D-beta-hydroxybutyrate permease.
  - source_id: file:PSEPK/hbdH/hbdH-uniprot.txt
    title: UniProtKB entry for PSEPK HbdH
    statement: Q88IC6 is assigned EC 1.1.1.30 and the 3-hydroxybutyrate dehydrogenase family.
  - source_id: file:PSEPK/aacs/aacs-uniprot.txt
    title: UniProtKB entry for PSEPK Aacs
    statement: Q88IC8 is assigned EC 6.2.1.16 and the acetoacetyl-CoA synthetase family.
  - source_id: PMID:26311173
    title: The metabolism of (R)-3-hydroxybutyrate is regulated by the enhancer-binding protein PA2005 and the alternative sigma factor RpoN in Pseudomonas aeruginosa PAO1.
    statement: >-
      A Pseudomonas model establishes D-3-hydroxybutyrate oxidation to
      acetoacetate while noting that the genus does not generally produce PHB.
  - source_id: PMID:10735852
    title: Requirement for the enzymes acetoacetyl coenzyme A synthetase and poly-3-hydroxybutyrate (PHB) synthase for growth of Sinorhizobium meliloti on PHB cycle intermediates.
    statement: >-
      Sinorhizobium genetics establish ATP-dependent acetoacetate activation as
      a bacterial alternative to CoA-transferase activation.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The local ppu00650 membership includes hbdH and aacs in butanoate
      metabolism, while the adjacent bhbP permease supplies the pathway input.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK gene inventory
    statement: >-
      The exact Q88GH0/PP_3754 record assigns BktB both EC 2.3.1.9 and EC
      2.3.1.16, establishing reaction capability but not which thiolase is used
      physiologically in D-3-hydroxybutyrate catabolism.
