      role: optional uptake of extracellular D-3-hydroxybutyrate
      optional: true
      node:
        id: hydroxybutyrate_import
        label: D-3-hydroxybutyrate import
        module_type: TRANSPORT_STEP
        description: >-
          A membrane permease imports D-3-hydroxybutyrate when the substrate is
          supplied extracellularly; intracellular ketone-body pathways do not
          require this part.
        annotons:
          - id: bhbp_hydroxybutyrate_permease
            label: D-3-hydroxybutyrate permease
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial Gnt-family D-3-hydroxybutyrate permeases
                term:
                  id: InterPro:IPR003474
                  label: Glcn_transporter
                representative_members:
