      term:
        id: GO:0046952
        label: ketone body catabolic process
      description: >-
        The module covers conversion of D-3-hydroxybutyrate through
        acetoacetate and acetoacetyl-CoA toward acetyl-CoA. The GO term is used
        here for this chemical catabolic sequence, not for mammalian hepatic
        ketone-body physiology.
  parts:
