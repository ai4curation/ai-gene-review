notes: >-
  This revision removes the previous mammal-only tissue framing and models the
  conserved chemistry with taxon-dependent acetoacetate-activation variants.
  KT2440 confidently supplies BhbP, HbdH, and Aacs. Several KT2440 thiolases
  can catalyze acetyl-CoA C-acetyltransferase chemistry, but the physiological
  enzyme completing growth on D-3-hydroxybutyrate is a current module gap.
