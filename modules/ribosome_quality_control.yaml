knowledge_gaps:
  - gap_statement: How the ASCC3 helicase converts ATP hydrolysis into separation of the ribosomal
      subunits is not established — the physical substrate it translocates on, and the step at which
      the subunits are driven apart, are undetermined.
    boundary: It is established that the trimeric hRQT complex (ASCC3, ASCC2, TRIP4) disassembles
      the lead ribosome of a collided pair, that ASCC2's CUE domain reads K63-linked ubiquitin on
      uS10, and that this mark is required for dissociation. What ASCC3 grips and pulls is not.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Distinguishes the two dissociation routes mechanistically. ABCE1-driven splitting
      is understood as recycling-factor chemistry; the RQT route has no equivalent account, so the
      reason the cell maintains two routes cannot yet be stated in mechanistic terms.
    provenance:
      - reference_id: PMID:32579943
        reference_section_type: DISCUSSION
        supporting_text: The molecular basis of how ASCC uses its helicase activity to disassemble
          ribosomes remains to be dissected but is now feasible with a defined in vitro system.
  - gap_statement: The mechanism by which VCP/p97 extracts the polyubiquitinated nascent chain from
      the 60S subunit is undetermined, as is the capacity in which TCF25 and NEMF are required for
      that extraction.
    boundary: It is established that p97 engages the 60S-nascent chain complex only after
      LTN1-mediated ubiquitination, that it needs the Npl4-Ufd1 cofactors, and that TCF25/Rqc1 and
      NEMF/Rqc2 are required. How the chain is threaded out of the exit tunnel, and what the two
      RQC subunits contribute to that step, are not.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: This is the last step of the pathway and the one that determines whether an
      incomplete, aggregation-prone polypeptide is cleared. It is also where RQC failure is thought
      to feed into neurodegeneration, so the mechanism bears directly on the disease link.
    provenance:
      - reference_id: PMID:25578875
        reference_section_type: DISCUSSION
        supporting_text: Similarly, the exact role of the Cdc48 complex and the mechanism of
          poly-ubiquitinated nascent chain extraction from 60S is unknown.
  - gap_statement: How TCF25 imposes K48 linkage specificity on LTN1-catalysed ubiquitination, and
      where it sits on the 60S-nascent chain complex, are undetermined.
    boundary: It is established that TCF25 is an RQC complex subunit and that its loss shifts the
      chains LTN1 builds away from the K48 linkage that commits substrates to the proteasome. Its
      position on the ribosome-nascent chain complex and the structural basis of the linkage
      preference are not.
    gap_kind:
      - BIOLOGY
    status: NARROWING
    significance: Linkage choice is what converts ubiquitination into degradation rather than
      signalling, so this is the step at which the RQC complex commits the nascent chain to a fate.
    provenance:
      - reference_id: PMID:30244831
        reference_section_type: INTRODUCTION
        supporting_text: The location of TCF25 on RNCs is unknown, and its function is poorly
          understood.
