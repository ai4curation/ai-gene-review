  connections:
    - source: collision_sensing
      target: ribosome_splitting
      connection_type: PRECEDES
      description: Recognition of the collided or vacant-A-site ribosome precedes its dissociation.
        For the RQT route the dependency is strict, because ASCC2 reads a mark that ZNF598 must
        place first; for the PELO-HBS1L-ABCE1 route the recognition is PELO's own and does not
        require ZNF598.
      chaining_status: NOT_APPLICABLE
      chaining_note: Not a metabolic reaction chain; no small-molecule intermediate is carried
        between these steps.
    - source: znf598_40s_ubiquitination
      target: ascc2_ubiquitin_reader
      connection_type: PROVIDES_INPUT_FOR
      description: The K63-linked polyubiquitin that ZNF598 places on uS10 is the mark the ASCC2 CUE
        domain reads, so this edge is what makes the RQT route ubiquitin-dependent.
      evidence:
        - source_id: PMID:36302773
          title: A distinct mammalian disome collision interface harbors K63-linked polyubiquitination
            of uS10 to trigger hRQT-mediated subunit dissociation.
          statement: hRQT-mediated dissociation requires K63-linked polyubiquitination of uS10.
          supporting_text: The hRQT-mediated subunit dissociation requires the K63-linked
            polyubiquitination of uS10
    - source: collision_sensing
      target: initiation_repression
      connection_type: POSITIVELY_REGULATES
      description: EDF1 and ZNF598, bound at the collided ribosome, recruit the GIGYF2-4EHP module
        to the message, so collision sensing switches on the repression arm.
      evidence:
        - source_id: PMID:32726578
          title: GIGYF2 and 4EHP Inhibit Translation Initiation of Defective Messenger RNAs to
            Assist Ribosome-Associated Quality Control.
          statement: The repression arm is a negative feedback loop triggered by the stalling
            message and implemented by GIGYF2 and 4EHP.
          supporting_text: This negative feedback loop is mediated by two translation inhibitors,
            GIGYF2 and 4EHP.
