id: MODULE:ribosome_quality_control
title: Human ribosome-associated quality control — ZNF598/EDF1 collision sensing, GIGYF2-4EHP
  repression of the defective message, RQT or PELO-HBS1L-ABCE1 subunit dissociation, NEMF-LTN1-TCF25
  nascent-chain ubiquitination and CAT tailing, ANKZF1 peptidyl-tRNA release and VCP extraction
description: >-
  Ribosome-associated quality control (RQC) is the cytosolic surveillance pathway that
  resolves ribosomes which have stalled during elongation. A prolonged stall is struck
  from behind by the next ribosome, and the resulting 40S-40S collision interface — not
  the stall itself — is what the cell reads as the signal of aberrant translation. Two
  factors engage that interface. The E3 ubiquitin ligase ZNF598 recognises the collided
  disome and monoubiquitinates the 40S proteins eS10 and uS10, extending K63-linked chains
  on uS10; EDF1 binds a conserved site on the 40S subunit at the mRNA entry channel next
  to the collision interface. From there the pathway branches. EDF1 and ZNF598 recruit the
  GIGYF2-4EHP (EIF4E2) module to the message, which sequesters the m7G cap and shuts down
  new initiation on the defective mRNA, so that no further ribosomes are loaded onto it.
  In parallel the stalled ribosome itself is taken apart. Two dissociation routes are
  modelled: the RQC-trigger (RQT/ASCC) complex, whose ASCC2 subunit reads the ZNF598-placed
  K63 chains and whose ASCC3 helicase drives subunit separation of the ubiquitinated lead
  ribosome, and the PELO-HBS1L (Dom34-Hbs1) complex with the recycling ATPase ABCE1, which
  acts on ribosomes with a vacant A site such as those stalled at a 3' end and initiates
  no-go and non-stop decay of the message. Either route leaves an obligate 60S subunit
  still carrying the incomplete nascent chain esterified to P-site tRNA. NEMF binds that
  exposed peptidyl-tRNA, recruits and stabilises the RING E3 ligase LTN1 (Listerin), and
  with the accessory subunit TCF25 the resulting RQC complex polyubiquitinates the nascent
  chain with a K48 linkage that commits it to the proteasome. NEMF additionally delivers
  alanyl-tRNA to the A site without mRNA or a 40S subunit, appending non-templated
  C-terminal alanine (CAT) tails that expose buried lysines for LTN1 and generate a
  C-degron read by alternative ligases. ANKZF1 then cleaves the acceptor arm of the
  60S-bound P-site tRNA, severing the chain from the tRNA, and the AAA+ ATPase VCP/p97
  extracts the ubiquitinated polypeptide from the 60S subunit for degradation. The module
  stops at that handover: the proteasome, the exosome- and SKI-dependent decay of the
  message, the ZAKalpha ribotoxic stress response and the integrated stress response are
  downstream outputs, and the upstream causes of stalling are inputs.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0072344
    title: rescue of stalled cytosolic ribosome
    statement: >-
      The module's primary process concept. It is the process term carried by the ZNF598,
      PELO, NEMF, ANKZF1, ABCE1, ASCC2, ASCC3 and VCP reviews and by five of the six
      production GO-CAMs that model parts of this pathway.
  - source_id: GO:1990116
    title: ribosome-associated ubiquitin-dependent protein catabolic process
    statement: >-
      The module's second process concept, covering the nascent-chain arm (LTN1, TCF25,
      ASCC2, ASCC3, VCP) as distinct from the ribosome-rescue arm.
  - source_id: gomodel:63e5937500000591
    title: Activation of the ribosome quality control by ZNF598 in response to ribosome collisions,
      leading to ubiquitination of RPS20/us10 and ribosome dissociation by the RQT complex, composed
      of ASCC2 and ASCC3 (Human)
    statement: >-
      Production GO-CAM grounding the collision-sensing step and the RQT dissociation route.
      It gives ZNF598 both GO:0170011 stalled ribosome sensor activity and GO:0061630 ubiquitin
      protein ligase activity, and ASCC2/ASCC3 their reader and ATPase activities on
      GO:0032790 ribosome disassembly.
  - source_id: gomodel:63e5937500000997
    title: Inhibition of translation initiation of defective mRNAs by GIGYF2 and EIF4E2 to assist
      ribosome-associated quality control. (Human)
    statement: >-
      Production GO-CAM grounding the initiation-repression branch, with ZNF598
      protein-RNA adaptor activity, GIGYF2 molecular adaptor activity and EIF4E2 cap binding
      all on GO:0045947 negative regulation of translational initiation.
  - source_id: gomodel:63e5937500001279
    title: Extraction of mRNA from stalled ribosomes by the SKI complex, leading to recruitment of
      the PELO-HBS1L complex that binds to stalled ribosomes, followed by ribosome dissociation by
      ABCE1 (Human)
    statement: >-
      Production GO-CAM grounding the PELO-HBS1L-ABCE1 dissociation route. The SKI complex
      activity it also models is mRNA decay and sits outside this module's boundary.
  - source_id: gomodel:63f809ec00000512
    title: Activity of the RQC complex via ubiquitination and degradation of incompletely synthesized
      nascent proteins (by NEMF and LTN1) following ribosome dissociation (Human)
    statement: >-
      Production GO-CAM grounding the RQC complex step, with NEMF large-subunit binding and
      alpha-aminoacyl-tRNA binding and LTN1 ubiquitin protein ligase activity.
  - source_id: gomodel:63f809ec00000560
    title: Non-canonical activity of the RQC complex via CAT-tailing by NEMF that promotes degradation
      of incompletely synthesized nascent proteins by the DesCEND pathway (Human)
    statement: >-
      Production GO-CAM grounding the CAT-tailing branch and its C-degron output through
      KLHDC10. The KLHDC10 step is a downstream degradation route and is cited as a boundary,
      not modelled as a part.
  - source_id: gomodel:63f809ec00000701
    title: tRNA repair and recycling by ANKZF1, ELAC1 and TRNT1 following activity of the RQC complex
      in response to stalled ribosomes (Human)
    statement: >-
      Production GO-CAM grounding the ANKZF1 peptidyl-tRNA cleavage step. The ELAC1 and TRNT1
      activities it also models repair the cleaved tRNA for reuse and are downstream of this
      module's boundary.
  - source_id: PMID:30293783
    title: ZNF598 Is a Quality Control Sensor of Collided Ribosomes.
    statement: Ribosome collision, not stalling as such, is the signal that initiates the pathway,
      and ZNF598 is the sensor that reads it.
    supporting_text: ZNF598 Is a Quality Control Sensor of Collided Ribosomes
  - source_id: PMID:32579943
    title: The ASC-1 Complex Disassembles Collided Ribosomes.
    statement: ASCC acts downstream of 40S ubiquitination on the collided ribosome and splits the
      lead ribosome, producing the 60S-peptidyl-tRNA species that the RQC complex then acts on.
    supporting_text: ASCC then acts on the lead ribosome to liberate a 60S-peptidyl-tRNA species
  - source_id: PMID:25578875
    title: Structure and assembly pathway of the ribosome quality control complex.
    statement: The 60S-nascent chain complex left after dissociation is the substrate of the NEMF-LTN1
      RQC complex, in which NEMF is the subunit that recruits the ligase.
    supporting_text: ribosome-bound NEMF recruits and stabilizes Listerin's N-terminal domain
notes: >-
  Built for issue #3952 from the thirteen completed human gene reviews listed on
  projects/RIBOSOME_QUALITY_CONTROL.md, plus EIF4E2, whose review already exists and which the
  GIGYF2 arm needs to be a complete repression step. Every molecular function asserted here is
  taken from the participant's own gene review (core_functions.molecular_function, or
  contributes_to_molecular_function for TCF25), not from GOA directly, so the module and the
  reviews cannot drift apart silently.

  Boundary decisions. (1) The module starts at the collided or vacant-A-site ribosome and stops
  at the handover of the extracted nascent chain; the proteasome, SKI/exosome mRNA decay, the
  ZAKalpha ribotoxic stress response and the integrated stress response are outputs, and the
  causes of stalling are inputs. (2) ASCC1 and TRIP4, the other two subunits of the human RQT
  complex (PMID:32099016), are named in the complex descriptor but carry no annoton, because
  neither has a gene review in this repository yet. (3) The SKI complex, KLHDC10, ELAC1 and TRNT1
  appear in the cited GO-CAMs but are outside this boundary and are recorded only as evidence.
  (4) EDF1's three other core functions (transcription coactivator activity, calmodulin binding,
  TFIID-class transcription factor complex binding) are nuclear and unrelated; only its collided-
  ribosome role is modelled. (5) VCP is a general AAA+ segregase with reviewed core functions in
  ERAD, autophagy, DNA repair and mitophagy; only its RQC core function is modelled, and it is the
  one member whose RQC role has no human production GO-CAM.

  Cross-check of the six production GO-CAMs against the curated gene reviews (the second task in
  #3952). Agreements: ZNF598 GO:0170011 and GO:0061630, ASCC2 GO:0070530, ASCC3 GO:0016887, PELO
  GO:0170011, HBS1L GO:0003924, NEMF GO:0043023 and GO:1904678, LTN1 GO:0061630 and EIF4E2
  GO:0000340 are all core functions in the respective reviews, with matching processes. Three
  divergences are worth reporting upstream, and are recorded here rather than resolved
  unilaterally. (a) All three models that carry ABCE1 (63e5937500001279, 63f809ec00000512,
  63f809ec00000560) type it as GO:0017111 ribonucleoside triphosphate phosphatase activity, whereas
  the ABCE1 review's core function is the more specific child GO:0016887 ATP hydrolysis activity;
  the module follows the review. (b) gomodel:63f809ec00000701 types ANKZF1 as GO:0004521 RNA
  endonuclease activity; the ANKZF1 review carries that exact GOA row with action MODIFY and
  proposes GO:0004549 tRNA-specific ribonuclease activity, on the grounds that the substrate is the
  acceptor arm of a tRNA. The module follows the review, and the same refinement would apply to the
  model. (c) gomodel:63e5937500000997 types ZNF598 as GO:0140517 protein-RNA adaptor activity; the
  ZNF598 review retains that row as KEEP_AS_NON_CORE, secondary to the collision-sensor ligase role.
  The module keeps it, in the repression node where it belongs, and flags it as non-core.

  Coverage gaps in the GO-CAM set, as opposed to disagreements. EDF1 appears in none of the six
  models, although it is a reviewed collision sensor with a cryo-EM-resolved 40S binding site
  (PMID:32744497). TCF25 appears in none of them, although it is a reviewed RQC complex subunit that
  sets the K48 linkage (PMID:30244831). VCP appears in none of the human models, although the
  yeast counterpart gomodel:63f809ec00000635 includes CDC48 in exactly this role. These are
  curation gaps in the models, not biological uncertainty, and so are recorded here rather than as
  knowledge_gaps.
module:
  id: ribosome_quality_control
  label: Ribosome-associated quality control
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: rescue of stalled cytosolic ribosome
      term:
        id: GO:0072344
        label: rescue of stalled cytosolic ribosome
      description: The ribosome-directed arm of the pathway, from collision sensing through
        subunit dissociation to release of the nascent chain from its tRNA.
    - preferred_term: ribosome-associated ubiquitin-dependent protein catabolic process
      term:
        id: GO:1990116
        label: ribosome-associated ubiquitin-dependent protein catabolic process
      description: The nascent-chain-directed arm, from LTN1/TCF25 ubiquitination on the obligate
        60S subunit to VCP-driven extraction.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: The module is written as the concrete human implementation. The pathway is
          deeply conserved — Hel2, Mbf1, Dom34-Hbs1, Rqc2, Ltn1, Rqc1, Vms1 and Cdc48 are the yeast
          counterparts, modelled in gomodel:63f809ec00000635 — but no claim of identical
          composition in other lineages is made here.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: All steps are cytosolic. Individual annotons that act while bound to the
          ribosome carry GO:0022626 cytosolic ribosome as their own location.
  parts:
    - order: 1
      role: Collision sensing and 40S ubiquitination
      node:
        id: collision_sensing
        label: Recognition of the collided ribosome by ZNF598 and EDF1
        module_type: REGULATORY_STEP
        description: >-
          A trailing ribosome running into a stalled one creates a composite 40S-40S interface that
          exists only on collided ribosomes. ZNF598 binds that interface and monoubiquitinates eS10
          and uS10, extending K63-linked chains on uS10; EDF1 binds independently at a conserved 40S
          site near the mRNA entry channel. Both are entry points, not a single ordered relay: EDF1
          recruitment is ZNF598-independent, and EDF1 in turn facilitates ZNF598-mediated
          ubiquitylation as well as recruiting the GIGYF2-4EHP repressors.
        annotons:
          - id: znf598_collision_sensor
            label: ZNF598 collided-disome sensor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNF598
                term:
                  id: UniProtKB:Q86UK7
                  label: ZNF598
            function:
              preferred_term: stalled ribosome sensor activity
              term:
                id: GO:0170011
                label: stalled ribosome sensor activity
            processes:
              - preferred_term: rescue of stalled cytosolic ribosome
                term:
                  id: GO:0072344
                  label: rescue of stalled cytosolic ribosome
            locations:
              - preferred_term: cytosolic ribosome
                term:
                  id: GO:0022626
                  label: cytosolic ribosome
            role_description: Recognises and binds the collided di-ribosome, using the collision
              interface as the proxy for aberrant translation. This is the pathway's entry point.
            gocam_associations:
              - model: gomodel:63e5937500000591
                activity: gomodel:63e5937500000591/63e5937500000592
                title: Activation of the ribosome quality control by ZNF598 in response to ribosome
                  collisions, leading to ubiquitination of RPS20/us10 and ribosome dissociation by
                  the RQT complex, composed of ASCC2 and ASCC3 (Human)
            evidence:
              - source_id: PMID:30293783
                title: ZNF598 Is a Quality Control Sensor of Collided Ribosomes.
                statement: ZNF598 is the sensor of the collided state.
                supporting_text: ZNF598 Is a Quality Control Sensor of Collided Ribosomes
          - id: znf598_40s_ubiquitination
            label: ZNF598 ubiquitination of 40S proteins eS10 and uS10
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNF598
                term:
                  id: UniProtKB:Q86UK7
                  label: ZNF598
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
              targets:
                - preferred_term: 40S ribosomal protein eS10 (RPS10)
                  term:
                    id: UniProtKB:P46783
                    label: RPS10
                - preferred_term: 40S ribosomal protein uS10 (RPS20)
                  term:
                    id: UniProtKB:P60866
                    label: RPS20
            processes:
              - preferred_term: protein K63-linked ubiquitination
                term:
                  id: GO:0070534
                  label: protein K63-linked ubiquitination
            locations:
              - preferred_term: cytosolic ribosome
                term:
                  id: GO:0022626
                  label: cytosolic ribosome
            role_description: RING-type E3 ligase that monoubiquitinates eS10 and adds K63-linked
              chains to uS10 on the collided ribosome. The K63 chains are the mark the RQT complex
              reads, so this activity licenses the ubiquitin-dependent dissociation route.
            gocam_associations:
              - model: gomodel:63e5937500000591
                activity: gomodel:63e5937500000591/63e5937500000599
                title: Activation of the ribosome quality control by ZNF598 in response to ribosome
                  collisions, leading to ubiquitination of RPS20/us10 and ribosome dissociation by
                  the RQT complex, composed of ASCC2 and ASCC3 (Human)
            evidence:
              - source_id: PMID:28065601
                title: Initiation of Quality Control during Poly(A) Translation Requires Site-Specific
                  Ribosome Ubiquitination.
                statement: eS10 is the primary 40S target of ZNF598.
                supporting_text: two sites of mono-ubiquitination on the 40S protein eS10 as the
                  primary ribosomal target of ZNF598
          - id: edf1_collision_sensor
            label: EDF1 binding at the 40S mRNA entry channel of collided ribosomes
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EDF1
                term:
                  id: UniProtKB:O60869
                  label: EDF1
            function:
              preferred_term: ribosomal small subunit binding
              term:
                id: GO:0043024
                label: ribosomal small subunit binding
            processes:
              - preferred_term: protein quality control for misfolded or incompletely synthesized
                  proteins
                term:
                  id: GO:0006515
                  label: protein quality control for misfolded or incompletely synthesized proteins
            locations:
              - preferred_term: cytosolic ribosome
                term:
                  id: GO:0022626
                  label: cytosolic ribosome
            role_description: Binds a conserved 40S site at the mRNA entry channel next to the
              collision interface, contacting rRNA helices h16/h18/h33 and uS3/uS4/eS30. Recruitment
              is ZNF598-independent but RACK1-dependent; EDF1 then recruits GIGYF2-EIF4E2 and
              facilitates ZNF598-mediated eS10/uS10 ubiquitylation.
            evidence:
              - source_id: PMID:32744497
                title: EDF1 coordinates cellular responses to ribosome collisions.
                statement: Cryo-EM places EDF1 at a conserved 40S site at the mRNA entry channel
                  near the collision interface.
                supporting_text: Cryo-electron microscopic analyses of EDF1 and its yeast homolog
                  Mbf1 revealed a conserved 40S ribosomal subunit binding site at the mRNA entry
                  channel near the collision interface.
              - source_id: PMID:39566505
                title: Multiprotein bridging factor 1 is required for robust activation of the
                  integrated stress response on collided ribosomes.
                statement: EDF1 and yeast Mbf1 bind collided ribosomes by similar mechanisms, and
                  EDF1 acts primarily in the cytoplasm.
                supporting_text: Given that Mbf1 and its human homologue EDF1 bind collided
                  ribosomes using similar mechanisms, we hypothesized that EDF1 would also exert
                  its effects primarily in the cytoplasm.
        notes: >-
          No production GO-CAM models EDF1, so its annoton carries literature evidence only. Its
          other reviewed core functions are nuclear and are not part of this module.
    - order: 2
      role: Repression of new initiation on the defective message
      optional: true
      node:
        id: initiation_repression
        label: GIGYF2-4EHP shutdown of initiation on the stalling mRNA
        module_type: REGULATORY_STEP
        description: >-
          A negative-feedback arm that acts on the message rather than the ribosome. EDF1 and ZNF598
          recruit GIGYF2, which bridges the non-canonical cap-binding protein 4EHP (EIF4E2) to the
          stalling mRNA; 4EHP occupies the m7G cap in place of eIF4E and blocks new initiation, so
          no further ribosomes are loaded onto a message that is already causing collisions. The arm
          is marked optional because the ribosome-directed steps proceed without it; it limits how
          much defective product is made rather than resolving the stalled ribosome.
        annotons:
          - id: gigyf2_repressor_adaptor
            label: GIGYF2 adaptor bridging 4EHP to the defective message
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GIGYF2
                term:
                  id: UniProtKB:Q6Y7W6
                  label: GIGYF2
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              targets:
                - preferred_term: EIF4E2 (4EHP)
                  term:
                    id: UniProtKB:O60573
                    label: EIF4E2
            processes:
              - preferred_term: negative regulation of translational initiation
                term:
                  id: GO:0045947
                  label: negative regulation of translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: Binds 4EHP through its N-terminal 4EHP-binding motif and bridges it to
              RNA-associated repressors and to the collided-ribosome sensors, imposing the negative
              feedback loop on ribosome-stalling messages.
            gocam_associations:
              - model: gomodel:63e5937500000997
                activity: gomodel:63e5937500000997/63e5937500001005
                title: Inhibition of translation initiation of defective mRNAs by GIGYF2 and EIF4E2
                  to assist ribosome-associated quality control. (Human)
            evidence:
              - source_id: PMID:32726578
                title: GIGYF2 and 4EHP Inhibit Translation Initiation of Defective Messenger RNAs
                  to Assist Ribosome-Associated Quality Control.
                statement: GIGYF2 and 4EHP are the two inhibitors that implement the feedback loop.
                supporting_text: This negative feedback loop is mediated by two translation
                  inhibitors, GIGYF2 and 4EHP.
          - id: eif4e2_cap_sequestration
            label: 4EHP (EIF4E2) sequestration of the m7G cap
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIF4E2
                term:
                  id: UniProtKB:O60573
                  label: EIF4E2
            function:
              preferred_term: RNA 7-methylguanosine cap binding
              term:
                id: GO:0000340
                label: RNA 7-methylguanosine cap binding
            processes:
              - preferred_term: negative regulation of translational initiation
                term:
                  id: GO:0045947
                  label: negative regulation of translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: Cap-binding core of the 4EHP-GIGYF2 module. Occupying the m7G cap
              without recruiting eIF4G prevents assembly of a new initiation complex on the
              stalling message.
            gocam_associations:
              - model: gomodel:63e5937500000997
                activity: gomodel:63e5937500000997/63e5937500001019
                title: Inhibition of translation initiation of defective mRNAs by GIGYF2 and EIF4E2
                  to assist ribosome-associated quality control. (Human)
            evidence:
              - source_id: PMID:32726578
                title: GIGYF2 and 4EHP Inhibit Translation Initiation of Defective Messenger RNAs
                  to Assist Ribosome-Associated Quality Control.
                statement: 4EHP acts with GIGYF2 to inhibit initiation on defective mRNAs as part
                  of ribosome-associated quality control.
                supporting_text: GIGYF2 and 4EHP Inhibit Translation Initiation of Defective
                  Messenger RNAs to Assist Ribosome-Associated Quality Control.
          - id: znf598_rna_adaptor
            label: ZNF598 adaptor recruitment of the 4EHP-GYF2 complex to mRNA
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNF598
                term:
                  id: UniProtKB:Q86UK7
                  label: ZNF598
            function:
              preferred_term: protein-RNA adaptor activity
              term:
                id: GO:0140517
                label: protein-RNA adaptor activity
            processes:
              - preferred_term: negative regulation of translational initiation
                term:
                  id: GO:0045947
                  label: negative regulation of translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: Second, non-catalytic activity of ZNF598 — recruiting the 4EHP-GYF2
              complex to mRNAs. The ZNF598 review retains this as a real but non-core molecular
              function, secondary to the collision-sensor ligase role, so it is modelled in the
              repression node rather than in the sensing node.
            gocam_associations:
              - model: gomodel:63e5937500000997
                activity: gomodel:63e5937500000997/63e5937500000998
                title: Inhibition of translation initiation of defective mRNAs by GIGYF2 and EIF4E2
                  to assist ribosome-associated quality control. (Human)
    - order: 3
      role: Dissociation of the stalled ribosome into subunits
      node:
        id: ribosome_splitting
        label: Subunit dissociation by RQT or by PELO-HBS1L-ABCE1
        module_type: REGULATORY_STEP
        description: >-
          Two routes split the stalled ribosome, distinguished by what they recognise. The RQT/ASCC
          route is ubiquitin-dependent and acts on the collided ribosome: ASCC2 reads the K63 chains
          that ZNF598 placed on uS10 and the ASCC3 helicase separates the subunits of the lead
          ribosome. The PELO-HBS1L-ABCE1 route is ubiquitin-independent and acts on ribosomes with an
          empty A site, such as those stalled at the 3' end of a truncated or non-stop message, and
          also launches no-go and non-stop mRNA decay. The selection is ONE_OR_MORE rather than
          exclusive: both routes converge on the same 60S-peptidyl-tRNA product, and two of the
          cited GO-CAMs (63f809ec00000512, 63f809ec00000560) place ABCE1 and ASCC3 in a single
          dissociation step upstream of the RQC complex.
        variant_sets:
          - id: dissociation_route
            label: Ubiquitin-dependent RQT route or A-site-vacancy PELO-HBS1L-ABCE1 route
            axis: recognition signal and dissociation machinery
            selection: ONE_OR_MORE
            variants:
              - id: rqt_disassembly
                label: RQT (ASCC) disassembly of the ubiquitinated collided ribosome
                module_type: REGULATORY_STEP
                description: >-
                  The human RQC-trigger complex, composed of ASCC3, ASCC2 and TRIP4, selectively
                  disassembles the lead ribosome of a collided pair, and requires the K63-linked
                  polyubiquitination of uS10 placed by ZNF598.
                annotons:
                  - id: ascc2_ubiquitin_reader
                    label: ASCC2 CUE-domain reader of K63 chains on uS10
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: RQC-trigger (RQT/ASCC) complex
                        term:
                          id: GO:0180022
                          label: RQC-trigger complex
                        description: The human RQT complex is ASCC3, ASCC2 and TRIP4, with ASCC1 as
                          an additional component. Only ASCC2 and ASCC3 are given annotons here;
                          TRIP4 and ASCC1 have no gene review in this repository yet.
                        active_units:
                          - id: rqt_ascc2
                            label: ASCC2 ubiquitin-reader subunit
                            role: Its CUE domain binds the K63-linked polyubiquitin on uS10,
                              targeting the complex to ZNF598-marked collided ribosomes.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: ASCC2
                                term:
                                  id: UniProtKB:Q9H1I8
                                  label: ASCC2
                            function:
                              preferred_term: K63-linked polyubiquitin modification-dependent protein
                                binding
                              term:
                                id: GO:0070530
                                label: K63-linked polyubiquitin modification-dependent protein binding
                          - id: rqt_ascc3
