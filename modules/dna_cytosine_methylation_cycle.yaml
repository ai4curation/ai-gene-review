  connections:
    - source: de_novo_methylation
      target: maintenance_methylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        De novo patterns are copied through replication: hemimethylated CpG is the
        UHRF1/DNMT1 substrate.
    - source: de_novo_methylation
      target: active_demethylation
      connection_type: PROVIDES_INPUT_FOR
      description: 5mC is the TET substrate (RGD edge 5-methylcytosine -> 5-hydroxymethylcytosine).
    - source: maintenance_methylation
      target: active_demethylation
      connection_type: PROVIDES_INPUT_FOR
      description: Maintained 5mC is equally a TET substrate.
    - source: de_novo_methylation
      target: methyl_cpg_reading
      connection_type: PROVIDES_INPUT_FOR
      description: Methylated CpG is the ligand of the readers (RGD edge 5-methylcytosine - MBP proteins).
    - source: maintenance_methylation
      target: methyl_cpg_reading
      connection_type: PROVIDES_INPUT_FOR
      description: Maintained methyl-CpG is read by the same readers.
    - source: active_demethylation
      target: maintenance_methylation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Oxidised cytosines are not maintained, so TET activity also removes methylation
        passively through replication; TDG/BER removes it actively.
knowledge_gaps:
  - gap_statement: >-
      Whether E3 ligases other than UHRF1, notably SMARCA3/HLTF, ubiquitinate H3K23 to
      recruit DNMT1 during maintenance methylation in vivo is not established.
    boundary: >-
      SMARCA3 is shown to be an H3K23 ubiquitin ligase stimulated by H3K9me3 that
      sustains H3K9me3 in colorectal cancer cells; its contribution to DNMT1
      recruitment or to the methylation maintained on the daughter strand has not been
      measured.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      A parallel ligase would explain residual maintenance methylation when UHRF1
      activity is reduced, and would make SMARCA3 loss in cancer a candidate cause of
      hypomethylation.
    provenance:
      - reference_id: PMID:40680746
        supporting_text: While UHRF1-mediated H3 ubiquitination activity is critical for DNMT1 recruitment, recent studies have shown that additional E3 ligases can function in parallel to support this mechanism
  - gap_statement: >-
      Whether mammalian cells also remove 5caC by direct decarboxylation to cytosine,
      without excision and repair, is unresolved; no 5caC decarboxylase has been
      identified.
    boundary: >-
      TDG excision of 5fC and 5caC followed by base excision repair is established and
      explains the 5caC accumulation in TDG-depleted ES cells; a repair-independent
      route is proposed but has no assigned enzyme.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      A decarboxylase would allow demethylation without strand breaks, which matters
      for genome stability during the large-scale demethylation of the zygote and
      primordial germ cells.
    provenance:
      - reference_id: PMID:21778364
        supporting_text: Our study raises the possibility that DNA demethylation may occur through Tet-catalyzed oxidation followed by decarboxylation.
