id: MODULE:dna_cytosine_methylation_cycle
title: DNA cytosine methylation cycle — de novo CpG methylation, UHRF1/DNMT1 maintenance, TET/TDG active demethylation and methyl-CpG readers; DNMT3A/DNMT3B/DNMT3L/UHRF1/DNMT1/TET1-3/TDG/MBD1/MBD2/MECP2/ZBTB33/ZBTB4/ZBTB38/ZFP57
description: >-
  In mammalian genomes most CpG dinucleotides carry 5-methylcytosine (5mC), whereas
  CpG islands at promoters are usually unmethylated. Methylation patterns are written,
  copied, erased and read by distinct sets of proteins that use the same nucleotide as
  their substrate. De novo methylation, which establishes patterns in the germline and
  the early embryo, is carried out by DNMT3A and DNMT3B. These transfer a methyl group
  from S-adenosyl-L-methionine to C5 of cytosine in unmethylated DNA. DNMT3L, which has
  no catalytic activity, binds the DNMT3A catalytic domain, stimulates it, and reads
  histone H3 tails unmethylated at lysine 4; it is needed to set up maternal imprints.
  After replication, CpGs are hemimethylated, carrying 5mC only on the parental strand.
  Maintenance methylation copies the pattern onto the daughter strand. UHRF1 binds
  hemimethylated CpG through its SRA domain and H3K9me3-marked chromatin through its
  tandem Tudor domain. Its RING domain then mono-ubiquitinates histone H3 at lysines 18
  and 23. The replication foci targeting sequence of DNMT1 binds this dual-ubiquitin
  mark, which recruits DNMT1, relieves its autoinhibition and lets it methylate the
  daughter-strand cytosine. Active demethylation begins with the TET dioxygenases
  (TET1, TET2, TET3). These Fe(II)- and 2-oxoglutarate-dependent enzymes oxidise 5mC
  in turn to 5-hydroxymethylcytosine (5hmC), 5-formylcytosine (5fC) and
  5-carboxylcytosine (5caC). Thymine DNA glycosylase (TDG) excises 5fC and 5caC, but
  not 5mC or 5hmC, and base excision repair then restores unmodified cytosine.
  Methylation also passes without repair, because 5hmC is not a substrate for DNMT1
  maintenance. Methylated CpG is read by two structural families of proteins, separate
  from the SRA reader UHRF1. The methyl-CpG-binding-domain proteins are MBD1, MBD2 and
  MeCP2. The C2H2 zinc-finger proteins are Kaiso (ZBTB33), ZBTB4, ZBTB38 and the KRAB
  zinc-finger protein ZFP57. These readers recruit corepressor, histone deacetylase and
  histone methyltransferase complexes to methylated loci, and ZFP57 protects the
  methylation of imprinting control regions in the early embryo.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001340
    title: DNA modification pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its interactive
      diagram. The diagram draws cytosine converted to 5-methylcytosine with
      S-adenosylmethionine as methyl donor (gene nodes Dnmt1, Dnmt3a and Dnmt3b), 5mC
      converted to 5hmC and 5hmC converted to 5fC and 5caC by the "TET proteins" node,
      5mC, 5hmC and 5caC associated with "MBP proteins" (methyl-binding proteins), and
      cytosine associated with "non-methylated CpG readers". It links out to the base
      excision repair, histone modification and chromatin remodeling subpathway
      diagrams. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001340.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001340.yaml
    title: RGD PW:0001340 record text (project snapshot)
    statement: >-
      The RGD record text divides the methyltransferases into maintenance and de novo
      roles, the basis for the two writer parts of this module.
    supporting_text: DNMT1 is considered a maintenance methyltransferase and the other two mostly function as de novo methyltransferases
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001340.yaml
    title: RGD PW:0001340 record text (project snapshot)
    statement: >-
      The RGD record text groups the methyl-binding proteins into three structural
      families, which is the basis for the reader part. UHRF1 is modelled in the
      maintenance part and UHRF2 is left out (see notes).
    supporting_text: Of these, MBD1, 2 and 4 and MeCP2 are members of MBD family, Zbtb33 known as Kaiso, Zbtb4, Zbtb38 and Zfp57 are members of the zinc family and Uhrf1 and 2 are members of SRA family.
  - source_id: GO:0006304
    title: DNA modification
    statement: >-
      The GO mapping recorded for PW:0001340 in the project's module seeds
      (skos:closeMatch). It is the module concept. GO has no current process term for
      cytosine methylation as such: GO:0006306 DNA methylation and its children are
      obsolete because they describe a molecular function. The writing steps are
      therefore grounded on their molecular functions, and the copying and erasing
      steps on GO:0141119 and GO:0141167.
  - source_id: PMID:10555141
    title: DNA methyltransferases Dnmt3a and Dnmt3b are essential for de novo methylation and mammalian development.
    statement: DNMT3A and DNMT3B are the de novo methyltransferases.
    supporting_text: Our results indicate that both Dnmt3a and Dnmt3b function as de novo methyltransferases that play important roles in normal development and disease.
  - source_id: PMID:21817016
    title: Tet-mediated formation of 5-carboxylcytosine and its excision by TDG in mammalian DNA.
    statement: >-
      TET oxidation followed by TDG excision is the active demethylation route modelled
      here.
    supporting_text: These data suggest that oxidation of 5mC by Tet proteins followed by TDG-mediated base excision of 5caC constitutes a pathway for active DNA demethylation.
  - source_id: PMID:10499592
    title: The thymine glycosylase MBD4 can bind to the product of deamination at methylated CpG sites.
    statement: >-
      MBD4 is a CpG mismatch glycosylase that repairs deaminated 5mC; this is why it is
      left to the base excision repair subpathway rather than modelled as a reader or a
      demethylase (see notes).
    supporting_text: Here we show that MBD4, an unrelated mammalian protein that contains a methyl-CpG binding domain, can also efficiently remove thymine or uracil from a mismatches CpG site in vitro.
  - source_id: PMID:21817016
    title: Tet-mediated formation of 5-carboxylcytosine and its excision by TDG in mammalian DNA.
    statement: MBD4 does not excise 5caC, so it is not the demethylation glycosylase.
    supporting_text: MBD4, another DNA glycosylase that removes U or T opposite to G in the CpG sequence context (14), exhibited no activity toward 5caC.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001340 (DNA modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project's diagram->module route; GO mapping
  GO:0006304 DNA modification (closeMatch). RGD curates 28 human genes to PW:0001340,
  but the diagram draws only Dnmt1, Dnmt3a and Dnmt3b as gene nodes. The other members
  sit behind four group nodes ("TET proteins", "TET interacting partners", "MBP
  proteins", "non-methylated CpG readers"). The module models the 5-methylcytosine
  cycle as four parts: de novo methylation, maintenance methylation, active
  demethylation and methyl-CpG reading. Fourteen of the 28 RGD genes are modelled
  (DNMT1, DNMT3A, DNMT3B, TET1, TET2, TET3, UHRF1, MBD1, MBD2, MECP2, ZBTB33, ZBTB4,
  ZBTB38, ZFP57). Two genes not on the RGD list are added:
  DNMT3L and TDG. Boundary decisions follow.
  (1) De novo methylation is a part whose catalytic step is a variant set of DNMT3A
  and DNMT3B (ONE_OR_MORE, as the two enzymes overlap but differ in targets, e.g.
  DNMT3B for centromeric minor satellites). DNMT3L is added as an optional stimulatory
  annoton with enzyme activator activity GO:0008047. This matches its IDA annotation
  and the core function in the DNMT3L gene review. DNMT3L is needed for maternal
  imprints but is restricted to germ cells and the early embryo, which is why it is
  optional. DNMT3C, the rodent-specific de novo enzyme for young retrotransposons, has
  no human orthologue. It is not modelled here; modules/pirna_mediated_germline_silencing.yaml
  covers piRNA-directed methylation and names DNMT3C and DNMT3L in that setting.
  (2) Maintenance methylation follows the human GO-CAM gomodel:6882d2b800000042, the
  project's best-overlap model. UHRF1 reads hemimethylated DNA and H3K9me2/3 and
  ubiquitinates H3K18/H3K23. DNMT1 reads H3K18ub/H3K23ub, and that reading positively
  regulates its methyltransferase activity. Each activity is linked to its GO-CAM
  activity. The DNMT1 methyltransferase is grounded on GO:0051718 (acting on CpG
  substrates), the core function in the DNMT1 gene review. That term is a child of the
  GO-CAM's GO:0003886. The GO-CAM also models SMARCA3/HLTF (Q14527) as a second H3K23
  ubiquitin ligase and H3K9me2/3 reader feeding DNMT1. HLTF is not on the RGD list and
  is not modelled here. Its evidence (PMID:40680746) shows H3K23 ubiquitination and
  H3K9me3 maintenance in colorectal cancer cells. That paper raises a role in DNMT1
  recruitment only in its discussion, as a possibility, so this is recorded as a
  knowledge gap. The GO-CAM's part_of GO:0141119 assertion for the HLTF activities may
  need upstream review. Three further human GO-CAMs model the regulation of UHRF1
  stability and H3K9me3 binding: PKA phosphorylation (gomodel:6882d2b800000403), USP7
  deubiquitination (gomodel:6882d2b800000491) and CDK1 phosphorylation
  (gomodel:6882d2b800000559). They reuse the same UHRF1 and DNMT1 activities. They are
  regulation of the maintenance part and are linked only as secondary associations.
  USP7, PKA and CDK1 are not modelled.
  (3) Active demethylation is a two-step chain. The first step is TET oxidation, a
  variant set of TET1, TET2 and TET3 (ONE_OR_MORE). Each TET carries GO:0070579 DNA
  5-methylcytosine dioxygenase activity, which is IDA or EXP for all three. The three
  Rhea reactions are RHEA:52636 (5mC to 5hmC), RHEA:53828 (5hmC to 5fC) and RHEA:53832
  (5fC to 5caC). TDG excision is the second step. TDG is not on the RGD list, but RGD's
  text says that 5fC/5caC "may be substrates for glycosylases and subsequent targeting
  by the base excision repair (BER) pathway". TDG is that glycosylase (PMID:21817016,
  PMID:21862836), and the GO definition of GO:0141167 names it. TDG is therefore added,
  with GO:0019104 DNA N-glycosylase activity (IDA, IMP). GO has no 5fC- or
  5caC-specific glycosylase term; this is an ontology gap, recorded here and not as a
  knowledge gap. Comparator check: in human GOA, GO:0141167 is
  carried only by TDG (TAS). The TETs carry the sibling regulatory term GO:0044029
  (TET1 and TET2 IDA), not GO:0141167. Because the GO:0141167 definition begins with
  "the enzymatic oxidation of the 5-methylcytosine", and the TETs perform that step,
  GO:0141167 is placed on the TET annotons. The missing TET GO:0141167 annotations are
  a curation gap and are not recorded as a knowledge gap. The downstream BER steps (AP
  site incision by APEX1, gap filling by POLB, ligation) belong to the RGD base
  excision repair subpathway PW:0000129. No base excision repair module exists in
  modules/ yet, so they are described but not modelled. Modelling them here would turn
  a general repair pathway into a part of this module.
  (4) MBD4 is on the RGD list as an MBD-family methyl-binding protein but is not
  modelled. It is a mismatch-specific glycosylase that removes T or U from
  G·T/G·U mispairs at CpG, the product of 5mC deamination (PMID:10499592). It has no
  activity on 5caC (PMID:21817016). Its role is to repair the mutagenic deamination of
  5mC, which belongs to the BER subpathway, not the methylation cycle. Its methyl-CpG
  binding serves that repair role, not chromatin silencing. GO:0141169 (direct
  5-methylcytosine excision) is the plant DME/ROS1 route, and MBD4 is not modelled
  there either.
  (5) Methyl-CpG reading is a part whose variant set is the two reader families
  (ONE_OR_MORE), each with its own nested variant set of proteins. MBD family members
  are MBD1 and MBD2 (GO:0008327 methyl-CpG binding, IDA) and MECP2 (GO:0010385
  double-stranded methylated DNA binding, IMP; MECP2 has no experimental GO:0008327).
  MBD3, which does not bind methylated DNA (PMID:9774669), is not on the RGD list and
  is excluded. The zinc-finger family members are ZBTB33/Kaiso, ZBTB4 and ZBTB38 (each
  GO:0008327, IDA) and ZFP57. ZFP57 is kept as a reader because it binds the
  methylated TGCCGC hexanucleotide in imprinting control regions and recruits
  KAP1/TRIM28, DNMTs and UHRF1 to protect that methylation (PMID:22055183). Its
  function is grounded on GO:0010385, which is IDA for mouse Zfp57 in QuickGO (checked
  2026-10-26). Human ZFP57 has only GO:0003682 chromatin binding as experimental support.
  UHRF2 shares the SRA domain but is not modelled. Its experimental annotations are
  ubiquitin and SUMO ligase activities, and none of the cited literature shows that it
  substitutes for UHRF1 in recruiting DNMT1. The readers' downstream effectors (SIN3A
  and histone deacetylase complexes for MeCP2 and MBD2, SETDB1 for MBD1, KAP1/TRIM28
  for ZFP57) belong to the histone modification subpathway PW:0001338 and are not
  modelled; SIN3A is on the RGD list for this reason.
  (6) Out of scope. Five transcription factors are context or targets, not participants
  in the cycle: EBF1, SPI1/PU.1, NANOG, PPARG and PRDM14. They regulate, or are
  regulated by, methylation at specific loci (TET or DNMT recruitment, pluripotency and
  germline demethylation programmes), and none of them writes, erases or reads 5mC.
  The CXXC-domain unmethylated-CpG readers (CXXC1/CFP1, KDM2A, KDM2B; also the CXXC
  domains of KMT2A, MBD1 and TET1) form RGD's "non-methylated CpG readers" node. They
  are not a part here. Their reading of unmethylated CpG (GO:0045322 unmethylated CpG
  binding) recruits histone H3K4 methylation by SET1/COMPASS (CXXC1, KMT2A, KMT2C) and
  H3K36 demethylation (KDM2A/B) to CpG islands. These are histone-modification outputs
  belonging to PW:0001338, and they do not act on 5mC. OGT (TET-interacting partner;
  O-GlcNAcylation of TET and of histones) and SIN3A (TET1 and MeCP2 corepressor
  partner) are regulators or effectors and are left out under the same rule. Applying
  CLAUDE.md's substrate-versus-participant test, none of these proteins catalyses a
  step of methylation, oxidation or excision. The chromatin remodeling subpathway
  PW:0001339 is also out of scope. S-adenosylmethionine supply by the methionine cycle
  is substrate supply and is out of scope.
  Molecular functions come from each protein's experimental GO annotations in QuickGO
  (checked 2026-10-26). Gene reviews exist for DNMT1, DNMT3A, DNMT3B and DNMT3L, and
  their core functions were used. The other members have no review yet. No GO-CAM in
  gocams/index.tsv covers the TETs, TDG or any methyl-CpG reader (checked 2026-10-26).
  PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: dna_cytosine_methylation_cycle
  label: DNA cytosine methylation cycle
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Cytosine in CpG is methylated de novo by DNMT3A/DNMT3B, copied after replication by
    UHRF1-recruited DNMT1, oxidised by TET enzymes to 5hmC, 5fC and 5caC and restored
    by TDG excision and base excision repair. Methylated CpG is read by MBD-family and
    zinc-finger proteins.
  concepts:
    - preferred_term: DNA modification
      term:
        id: GO:0006304
        label: DNA modification
      description: >-
        The GO term mapped to PW:0001340. It covers both adding and removing the methyl
        mark. Its methylation children are obsolete, so the steps are refined at the
        part level.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Members are grounded on the human proteins; the RGD diagram is drawn for rat
          and the cycle is conserved across mammals.
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
        description: All writers, erasers and readers act on chromosomal DNA in chromatin.
  parts:
    - order: 1
      role: de novo cytosine methylation
      node:
        id: de_novo_methylation
        label: De novo CpG methylation by DNMT3A/DNMT3B with DNMT3L
        module_type: REACTION
        description: >-
          Establishes methylation on unmethylated DNA, mainly in germ cells and the
          early embryo. DNMT3A and DNMT3B transfer the methyl group of SAM to cytosine
          C5; DNMT3L stimulates DNMT3A and targets it to chromatin unmethylated at
          H3K4.
        parts:
          - order: 1
            role: de novo methyltransferase
            node:
              id: dnmt3_catalysis
              label: DNMT3A or DNMT3B DNA (cytosine-5-)-methyltransferase
              module_type: REACTION
              variant_sets:
                - id: dnmt3_enzyme
                  label: De novo methyltransferase
                  axis: enzyme paralog / genomic target
                  selection: ONE_OR_MORE
                  notes: >-
                    The two enzymes overlap but are not redundant; double knockout
                    abolishes de novo methylation in ES cells and embryos.
                  variants:
                    - id: dnmt3a_variant
                      label: DNMT3A
                      module_type: REACTION
                      annotons:
                        - id: dnmt3a_methyltransferase
                          label: DNMT3A DNA (cytosine-5-)-methyltransferase activity
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: DNMT3A
                              term:
                                id: UniProtKB:Q9Y6K1
                                label: DNA (cytosine-5)-methyltransferase 3A
                          function:
                            preferred_term: DNA (cytosine-5-)-methyltransferase activity
                            term:
                              id: GO:0003886
                              label: DNA (cytosine-5-)-methyltransferase activity
                            substrates:
                              - preferred_term: 2'-deoxycytidine in DNA
                                term:
                                  id: CHEBI:85452
                                  label: 2'-deoxycytidine 5'-monophosphate(1-) residue
                              - preferred_term: S-adenosyl-L-methionine
                                term:
                                  id: CHEBI:59789
                                  label: S-adenosyl-L-methionine zwitterion
                            products:
                              - preferred_term: 5-methyl-2'-deoxycytidine in DNA
                                term:
                                  id: CHEBI:85454
                                  label: 5-methyl dCMP(1-) residue
                              - preferred_term: S-adenosyl-L-homocysteine
                                term:
                                  id: CHEBI:57856
                                  label: S-adenosyl-L-homocysteine zwitterion
                            evidence:
                              - source_id: RHEA:13681
                                statement: >-
                                  a 2'-deoxycytidine in DNA + S-adenosyl-L-methionine = a
                                  5-methyl-2'-deoxycytidine in DNA +
                                  S-adenosyl-L-homocysteine + H+; the Rhea reaction in the
                                  reviewed DNMT3A, DNMT3B and DNMT1 UniProt entries.
                          processes:
                            - preferred_term: negative regulation of gene expression via chromosomal CpG island methylation
                              term:
                                id: GO:0044027
                                label: negative regulation of gene expression via chromosomal CpG island methylation
                            - preferred_term: genomic imprinting
                              term:
                                id: GO:0071514
                                label: genomic imprinting
                          locations:
                            - preferred_term: chromatin
                              term:
                                id: GO:0000785
                                label: chromatin
                          role_description: >-
                            Principal de novo enzyme for germline imprints and
                            developmental methylation; its core function in the DNMT3A
                            gene review.
                          evidence:
                            - source_id: PMID:10555141
                              statement: Dnmt3a and Dnmt3b knockout blocks de novo methylation.
                              supporting_text: Inactivation of both genes by gene targeting blocks de novo methylation in ES cells and early embryos, but it has no effect on maintenance of imprinted methylation patterns.
                    - id: dnmt3b_variant
                      label: DNMT3B
                      module_type: REACTION
                      annotons:
                        - id: dnmt3b_methyltransferase
                          label: DNMT3B DNA (cytosine-5-)-methyltransferase activity
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: DNMT3B
                              term:
                                id: UniProtKB:Q9UBC3
                                label: DNA (cytosine-5)-methyltransferase 3B
                          function:
                            preferred_term: DNA (cytosine-5-)-methyltransferase activity
                            term:
                              id: GO:0003886
                              label: DNA (cytosine-5-)-methyltransferase activity
                            substrates:
                              - preferred_term: 2'-deoxycytidine in DNA
                                term:
                                  id: CHEBI:85452
                                  label: 2'-deoxycytidine 5'-monophosphate(1-) residue
                              - preferred_term: S-adenosyl-L-methionine
                                term:
                                  id: CHEBI:59789
                                  label: S-adenosyl-L-methionine zwitterion
                            products:
                              - preferred_term: 5-methyl-2'-deoxycytidine in DNA
                                term:
                                  id: CHEBI:85454
                                  label: 5-methyl dCMP(1-) residue
                            evidence:
                              - source_id: RHEA:13681
                                statement: Same reaction as DNMT3A.
                          locations:
                            - preferred_term: chromatin
                              term:
                                id: GO:0000785
                                label: chromatin
                          role_description: >-
                            Required for methylation of centromeric minor satellite
                            repeats; mutated in ICF syndrome. Its core function in the
                            DNMT3B gene review.
                          evidence:
                            - source_id: PMID:10555141
                              statement: DNMT3B has a specific, nonoverlapping target class.
                              supporting_text: Dnmt3a and Dnmt3b also exhibit nonoverlapping functions in development, with Dnmt3b specifically required for methylation of centromeric minor satellite repeats.
          - order: 2
            role: stimulation and chromatin targeting of DNMT3A by DNMT3L
            optional: true
            node:
              id: dnmt3l_stimulation
              label: DNMT3L stimulation of DNMT3A
              module_type: REGULATORY_STEP
              description: >-
                Catalytically inactive DNMT3L forms a heterotetramer with the DNMT3A
                catalytic domain, stimulating it, and reads unmethylated H3K4 through its
                PHD-like domain. Required for maternal imprint establishment in oocytes;
                optional because it is restricted to germ cells and early embryos.
              annotons:
                - id: dnmt3l_activator
                  label: DNMT3L enzyme activator activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: DNMT3L
                      term:
                        id: UniProtKB:Q9UJW3
                        label: DNA (cytosine-5)-methyltransferase 3-like
                  function:
                    preferred_term: enzyme activator activity
                    term:
                      id: GO:0008047
                      label: enzyme activator activity
                  processes:
                    - preferred_term: genomic imprinting
                      term:
                        id: GO:0071514
                        label: genomic imprinting
                  locations:
                    - preferred_term: chromatin
                      term:
                        id: GO:0000785
                        label: chromatin
                  role_description: >-
                    Activator and chromatin-targeting cofactor of DNMT3A (and DNMT3B);
                    core function in the DNMT3L gene review.
                  evidence:
                    - source_id: PMID:17713477
                      statement: The DNMT3L C-terminal domain binds and activates the DNMT3A catalytic domain.
                      supporting_text: Dnmt3L has dual functions of binding the unmethylated histone tail and activating DNA methyltransferase
                    - source_id: PMID:11934864
                      statement: DNMT3L is required for maternal methylation imprints.
                      supporting_text: Dnmt3L, a protein sharing homology with DNA methyltransferases, Dnmt3a and Dnmt3b, but lacking enzymatic activity, is essential for the establishment of maternal methylation imprints
        connections:
          - source: dnmt3l_stimulation
            target: dnmt3_catalysis
            connection_type: POSITIVELY_REGULATES
            description: DNMT3L stimulates DNMT3A catalysis.
    - order: 2
      role: maintenance methylation after DNA replication
      node:
        id: maintenance_methylation
        label: UHRF1-directed DNMT1 maintenance methylation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          UHRF1 recognises hemimethylated CpG and H3K9me3, ubiquitinates H3K18 and
          H3K23, and the ubiquitin marks recruit and activate DNMT1, which methylates the
          daughter-strand cytosine.
        concepts:
          - preferred_term: chromosomal DNA methylation maintenance following DNA replication
            term:
              id: GO:0141119
              label: chromosomal DNA methylation maintenance following DNA replication
        context:
          cellular_components:
            - preferred_term: replication fork
              term:
                id: GO:0005657
                label: replication fork
              description: >-
                UHRF1 acts at replication forks; the location used for the UHRF1
                activities in gomodel:6882d2b800000042.
        gocam_associations:
          - model: gomodel:6882d2b800000042
            title: UHRF1 and SMARCA3 mediate histone H3 ubiquitination (H3K18ub and H3K23ub), promoting DNMT1 recruitment at hemimethylated DNA (Human).
            description: >-
              Best-overlap GO-CAM for PW:0001340; its UHRF1 and DNMT1 activities are
              linked on the annotons below. Its SMARCA3/HLTF activities are not modelled
              (see notes).
          - model: gomodel:6882d2b800000403
            title: Phosphorylation of UHRF1 by PKA decreased UHRF1 binding to H3K9me3 (Human).
            description: Regulation of the UHRF1 H3K9me3-reading step; same UHRF1/DNMT1 activities.
          - model: gomodel:6882d2b800000491
            title: USP7 mediates deubiquitination of UHRF1, preventing autoubiquitination and degradation of UHRF1 (Human).
            description: Regulation of UHRF1 stability; same UHRF1/DNMT1 activities.
          - model: gomodel:6882d2b800000559
            title: Phosphorylation of UHRF1 by CDK1 prevents UHRF1 deubiquitination by USP7, promoting autoubiquitination and degradation of UHRF1 (Human).
            description: Regulation of UHRF1 stability in mitosis; same UHRF1/DNMT1 activities.
        parts:
          - order: 1
            role: recognition of hemimethylated CpG and H3K9me3 chromatin
            node:
              id: uhrf1_recognition
              label: UHRF1 SRA and tandem Tudor reading
              module_type: MOLECULAR_FUNCTION
