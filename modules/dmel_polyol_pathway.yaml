id: MODULE:dmel_polyol_pathway
title: Polyol pathway in Drosophila melanogaster
description: >-
  The polyol pathway converts glucose to fructose in two steps. An NADPH-dependent aldose
  reductase of the aldo-keto reductase 1B family reduces glucose to sorbitol, and an NAD+-dependent
  sorbitol dehydrogenase oxidises sorbitol to fructose. Drosophila has two aldose reductase
  genes in the FlyBase group (Ar1 and Ar2) and two sorbitol dehydrogenase genes (Sord1 and
  Sord2).
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002051
  title: 'FlyBase gene group FRUCBIO: Fructose biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as fructose biosynthesis (FRUCBIO);
    this module models that group.
- source_id: GO:0046370
  title: fructose biosynthetic process
  statement: >-
    GO term grounding the module as fructose biosynthetic process.
notes: >-
  Ar1 and Ar2 are alternative aldose reductases and Sord1 and Sord2 alternative sorbitol dehydrogenases;
  each gene is a separate annoton. The aldose reductase activity is given to Ar1, which has
  been assayed; Ar2 is assigned to the step by FlyBase and sequence similarity only, so no
  molecular function is given. Ar1 belongs to a family of broad-specificity aldo-keto reductases
  that also reduce other aldehydes, so its physiological substrates are not limited to glucose.
  FlyBase groups realized by this module: FRUCBIO (FBgg0002051). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_polyol_pathway.yaml; none of the member genes has a gene review yet
  unless noted.
