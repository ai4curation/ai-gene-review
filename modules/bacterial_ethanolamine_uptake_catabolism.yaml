id: MODULE:bacterial_ethanolamine_uptake_catabolism
title: Bacterial ethanolamine access, deamination and acetaldehyde disposition
description: Ethanolamine reaches a compatible adenosylcobamide-dependent EutB/EutC complex through condition-dependent
  protein transport or experimentally supported diffusion. The enzyme releases acetaldehyde and ammonium.
  The oxidative pathway routes acetaldehyde to acetyl-CoA through EutE or to acetate through a non-acylating
  NAD-dependent aldehyde dehydrogenase. A parallel EutG branch forms ethanol and can regenerate NAD+.
  Selected implementations couple EutD and acetate kinase to CoA recycling and ATP formation, use EutA
  to replace inactivated cofactor, or organize enzymes in a bacterial microcompartment. The chemical nitrogen-release,
  oxidative and reductive endpoints are distinct from sustained native carbon growth.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: file:PSEPK/eutC/eutC-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK EutC
  statement: Retained provider research context; unsupported proteome-wide absence claims are not used
    as primary evidence.
- source_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
  title: KT2440 bacterial microcompartment shell-protein inventory
  statement: Reproducible UniProt query showing no BMC shell-protein signatures in the KT2440 proteome
    (with an E. coli positive control), supporting a shell-less implementation of the pathway in that
    exemplar.
- source_id: file:projects/P_PUTIDA/data/psepk_pathway_partition.tsv
  title: PSEPK pathway partition
  statement: Provides exact KT2440 accessions and exposes the misleading KEGG ppu00564 placement of eutBC,
    which is treated as a database bucket rather than the pathway boundary.
- source_id: PMID:20234377
  statement: Short eutBC loci occur in multiple bacterial groups; the enterobacterial operon is one realization
    rather than a universal gene checklist.
  supporting_text: Actinobacteria and most Proteobacteria have short eut operons containing eutBC
- source_id: PMID:29463652
  statement: Increasing protonation at acidic pH changes access requirements; EutH/Eat are condition-dependent
    transport implementations.
  supporting_text: the proportion of EA that is protonated increases
- source_id: PMID:34034083
  statement: Ethanolamine microcompartments are a characterized instance of protein-based metabolic compartmentation.
  supporting_text: 'One of the first discovered and characterized

    microcompartments are those involved in ethanolamine degradation.'
- source_id: PMID:35880884
  statement: The Acinetobacter enzyme supported heterologous ethanolamine nitrogen use without imposing
    a universal metabolosome or EutA requirement.
  supporting_text: did not require the metabolosome, the reactivase EutA enzyme
- source_id: PMID:23585538
  statement: EutD and EutG were assigned to CoA and NAD recycling branches.
  supporting_text: These are EutD (acetyl-CoA to acetyl phosphate) and EutG (acetaldehyde to ethanol).
- source_id: PMID:41032589
  statement: EutG is an LT2 compartment cargo.
  supporting_text: The location of another cargo protein, EutG, was not affected in both ΔeutC2–19 and
    ΔeutE2–21
- source_id: PMID:14996820
  statement: The reverse phosphotransacetylase product was chemically verified.
  supporting_text: High-pressure liquid chromatography and mass spectrometry verified that acetyl-coenzyme
    A was the product of the reaction.
- source_id: PMID:26448059
  statement: Coupled assays support forward EutD chemistry.
  supporting_text: used the phosphotransacetylase EutD to generate AcP from AcCoA and ortho-phosphate.
- source_id: PMID:35785499
  statement: LT2 EutA directly associates with its cognate lyase.
  supporting_text: SeEAL and SeEutA interacted and stabilized each other by forming a complex.
- source_id: PMID:15466038
  statement: E. coli EutA restores lyase by cobalamin exchange.
  supporting_text: reactivation and activation occur through the exchange of modified coenzyme for free
    intact adenosylcobalamin.
- source_id: PMID:15466042
  statement: 'conditional substrate access: LT2 conditions; threshold concerns free uncharged substrate
    and growth, not a transporter Km or universal taxon threshold. Full-source provenance is in the delivered
    SALTY EutH source analysis.'
  supporting_text: When a lowered pH and/or ethanolamine concentration reduced the Eth0 concentration
    below 25 microM, EutH was needed to facilitate diffusion.
- source_id: PMID:22267508
  statement: 'non-acylating acetaldehyde oxidation: PAO1 HdhA/PA4022 and PA1984 ExaC recombinant assays,
    NAD+ at pH9. The Q9ZAA1 reference is ATCC17933 and is not the directly assayed PA1984 protein.'
  supporting_text: We found here that purified rHdhA and rExaC both oxidize acetaldehyde.
- source_id: PMID:16291677
  statement: 'conditional EutA/native growth: Abstract-level Salmonella physiology. EutA is not universally
    required even for all Salmonella growth conditions; toxin management/oxygen context matters.'
  supporting_text: 'Neither GSH nor EutA was

    needed during growth on ethanolamine under reduced-oxygen conditions.'
- source_id: PMID:33850044
  statement: 'coexisting oxidative/reductive fates: EGDe anaerobic defined-medium metabolite data.10403S
    was used for gene-disruption/EET tests.2:1 product ratio is incompatible with assuming a universally
    closed1:1 EutE/EutG NAD cycle; additional electron disposal is needed/inferred.'
  supporting_text: 15 mM EA was converted into about 6.6 mM acetate and 3.4 mM ethanol
- source_id: PMID:19762342
  statement: EutB and EutC are the large and small subunits of an alpha6-beta6 enzyme.
  supporting_text: The eutB and eutC genes in the eut operon encoded the large and small subunits of the
    enzyme, respectively. The enzyme existed as the heterododecamer alpha(6)beta(6).
- source_id: PMID:20519496
  statement: Active site in the EutB TIM barrel; cobalamin bound at the alpha/beta interface.
  supporting_text: The active site is in the (beta/alpha)(8) barrel of the alpha-subunit; the beta-subunit
    covers the lower part of the cobalamin that is bound in the interface of the alpha- and beta-subunits.
- source_id: PMID:21803884
  statement: Purified recombinant Salmonella EutE has acetaldehyde dehydrogenase activity of 68.07 umol/min/mg
    and acetyl-CoA reductase activity of 49.23 umol/min/mg, so the enzyme runs the acylating reaction
    in both directions.
  supporting_text: In vitro assays showed that this enzyme had both acetaldehyde dehydrogenase activity
    (68.07 ± 1.63 μmol min(-1) mg(-1)) and the desired acetyl-CoA reductase activity (49.23 ± 2.88 μmol
    min(-1) mg(-1)).
- source_id: PMID:16272400
  statement: Ethanolamine is catabolised to acetyl-CoA, which enters the glyoxylate bypass and the TCA
    cycle to generate energy and central metabolites.
  supporting_text: This report shows that Salmonella enterica catabolizes ethanolamine to acetyl-CoA (Ac-CoA),
    which enters the glyoxylate bypass and tricarboxylic acid cycle for the generation of energy and central
    metabolites.
- source_id: PMID:19783625
  statement: Comparative genomics identifies EutBC as the conserved deamination step, while accessory
    architecture varies.
  supporting_text: Ethanolamine-ammonia lyase, the enzyme that breaks ethanolamine into acetaldehyde and
    ammonia, is encoded by the gene tandem eutBC.
- source_id: PMID:27325678
  statement: PAO1 has a non-acylating ethanolamine pathway; operon evidence complements direct PA4022
    biochemical assays.
  supporting_text: This pathway is encoded by the PA4022-eat-eutBC operon and consists of a transport
    protein (Eat), an ethanolamine-ammonia lyase (EutBC), and an acetaldehyde dehydrogenase (PA4022).
notes: The root retains EutBC plus an oxidative acetaldehyde fate as required chemical roles. Protein
  uptake is conditional, with substrate access and active compatible adenosylated cobamide mandatory environmental
  prerequisites. A separately evaluated EutBC endpoint measures nitrogen liberation; it does not establish
  the complete oxidative module or nitrogen assimilation. Oxidative and reductive branches can coexist.
  Optional parts do not prove diffusion, redox closure, cofactor maintenance or shell assembly. The production
  compiler ignores context, chemicals and complex active-unit expansion, so the scoped evaluator must
  enforce these explicitly and distinguish unsupported evidence from biological impossibility. Bacterial
  scope denotes a reusable mechanism sampled across Pseudomonadota and Bacillota, not universal bacterial
  presence or exclusion from other domains. EutC contributes to the assembled EutBC enzyme; source enables
  qualifiers remain preserved in gene reviews and are interpreted with source-specific cautions. PA4022
  has direct purified native/recombinant biochemical evidence, whereas Q9ZAA1 ExaC is the ATCC17933 comparator
  and is not PAO1 PA1984. EutE/PduP and broad ALDH families mix substrates; EutG and EutQ scopes likewise
  do not license whole-subfamily activity transfers. The LT2 EutQ N-terminal scaffold cannot be generalized
  to shorter Gram-positive homologs. The older outside-compartment EutBC hypothesis is superseded by newer
  localization/encapsulation evidence. Known shell-negative reference-proteome searches support only their
  sampled genome and search sensitivity. No PANTHER ancestral node or exact accession is invented for
  the Acinetobacter physiological comparator.
