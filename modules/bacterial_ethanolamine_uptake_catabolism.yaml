id: MODULE:bacterial_ethanolamine_uptake_catabolism
title: Bacterial ethanolamine uptake and cobalamin-dependent catabolism
description: >-
  A reusable bacterial pathway in which ethanolamine uptake supplies the
  adenosylcobalamin-dependent EutB/EutC ammonia-lyase, producing acetaldehyde
  and ammonium. Acetaldehyde is then oxidized either to acetyl-CoA by an
  acetylating EutE-like enzyme or to acetate by a non-acylating
  NAD-dependent aldehyde dehydrogenase. Transporter family and
  microcompartment encapsulation vary between organisms; shell assembly,
  cobalamin supply, regulation, and downstream assimilation are outside the core boundary.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:19783625
  title: Comparative genomics of ethanolamine utilization.
  statement: >-
    Establishes EutBC as the conserved ethanolamine-to-acetaldehyde-and-ammonia
    step and documents evolutionary variation in auxiliary eut genes and metabolosomes.
- source_id: PMID:19762342
  title: Purification and some properties of wild-type and N-terminal-truncated ethanolamine ammonia-lyase of Escherichia coli.
  statement: Directly establishes EutB/EutC large-small subunit composition and alpha6-beta6 assembly.
- source_id: PMID:20519496
  title: Crystal structures of ethanolamine ammonia-lyase complexed with coenzyme B12 analogs and substrates.
  statement: Resolves the active-site barrel in EutB and the interfacial cobalamin-capping role of EutC.
- source_id: PMID:7868611
  title: 'Ethanolamine utilization in Salmonella typhimurium: nucleotide sequence, protein expression, and mutational analysis of the cchA cchB eutE eutJ eutG eutH gene cluster.'
  statement: Supports transport and acetaldehyde-disposition roles in a characterized shell-encoding eut operon.
- source_id: file:PSEPK/eutC/eutC-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK EutC
  statement: >-
    Corroborates the EutBC chemistry and subunit structure. Its unaccompanied
    proteome-wide Pfam absence claim is not used as curation evidence.
- source_id: PMID:27325678
  title: Ethanolamine Catabolism in Pseudomonas aeruginosa PAO1 Is Regulated by the Enhancer-Binding Protein EatR (PA4021) and the Alternative Sigma Factor RpoN.
  statement: >-
    Defines the shell-less P. aeruginosa pathway encoded by the PA4022-eat-eutBC
    operon (Eat transporter, EutBC lyase, PA4022 acetaldehyde dehydrogenase
    oxidizing acetaldehyde to acetate), the pseudomonad exemplar of the
    non-acylating route.
- source_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
  title: KT2440 bacterial microcompartment shell-protein inventory
  statement: >-
    Reproducible UniProt query showing no BMC shell-protein signatures in the
    KT2440 proteome (with an E. coli positive control), supporting a shell-less
    implementation of the pathway in that exemplar.
- source_id: file:projects/P_PUTIDA/data/psepk_pathway_partition.tsv
  title: PSEPK pathway partition
  statement: >-
    Provides exact KT2440 accessions and exposes the misleading KEGG ppu00564
    placement of eutBC, which is treated as a database bucket rather than the pathway boundary.
notes: >-
  Molecular functions occur only on leaf annotons. EutB and EutC are active
  units of one enzyme-complex annoton. In the member gene reviews EutB, which
  carries the active-site TIM barrel and the PAINT GO:0008851 node
  (PTN002217393), enables the activity, while EutC contributes_to it; the
  UniProt `enables` rows on EutC are recorded as WRONG_QUALIFIER source
  defects. The pathway is conserved across shell-encoding enterobacterial eut
  systems (E. coli K-12 and Salmonella exemplars) and shell-less
  pseudomonad loci (P. putida KT2440 and P. aeruginosa exemplars), so the
  module is bacteria-wide; KT2440 is one exemplar. KT2440 exemplifies an
  APC-family transporter and has an adjacent non-acylating AldB-like
  candidate, not classical EutH or acetylating EutE; its acetaldehyde
  specificity remains unverified. In P. aeruginosa the corresponding operon
  gene is PA4022, a near-identical paralog of ExaC, which grounds the
  non-acylating route alongside ExaC. Microcompartment encapsulation is an
  optional implementation context and is not required by the pathway
  definition: the E. coli reviews keep the ethanolamine-degradation organelle
  as non-core, while the KT2440 reviews remove it because the KT2440 proteome
  has no bacterial microcompartment shell-protein signatures
  (file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md). The APC permease step is
  grounded to InterPro IPR004757 (TIGR00908) rather than a PANTHER family:
  PP_0544 sits in PTHR42770:SF7 ("MEMBRANE PROTEIN"), which mixes
  IPR004757 permeases with unrelated mycobacterial and mycoplasmal
  transporters, and PANTHER's own files place the P. aeruginosa Eat ortholog
  in PTHR43243 instead (see the PTHR42770 family review). The EutE step
  selects PTHR11699:SF68 for membership; the PTHR11699 review leaves
  GO:0008774 UNRESOLVED at subfamily level because SF68 also holds the
  propanal-acylating PduP, and the PTHR43111 review leaves GO:0140087
  UNRESOLVED because its single subfamily mixes aldehyde substrates. The
  resulting FAMILY_FUNCTION_UNREVIEWED validator warnings reflect those
  truthful family-level verdicts; both activities are grounded on the
  representatives' own gene reviews. RHEA:23288 and the RHEA:25294 master
  reaction were verified against Rhea. The GOA source PTN PTN002446609 was
  verified exactly from Q88QF2 GOA but is absent from the cached PAINT slice.
  Canonical local PAINT data instead place GO:0009350 at PTN002217404 in
  PTHR39330, seeded by P19636 and P19265; only canonical nodes are used as
  ancestral-node assertions.
