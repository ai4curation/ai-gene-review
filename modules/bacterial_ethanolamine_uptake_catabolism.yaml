  knowledge_gaps:
  - gap_statement: >-
      No IPR004757 ethanolamine permease (PP_0544, P. aeruginosa Eat) has been
      assayed for transport; direct uptake assays are needed to establish
      substrate range and coupling mechanism, and why shell-less pseudomonad
      eut loci retain the permease.
    gap_kind: [BIOLOGY]
  - gap_statement: Whether EutH is a passive facilitator or is coupled to the proton motive force is unknown.
    gap_kind: [BIOLOGY]
  - gap_statement: KT2440 AldB-I acetaldehyde preference and requirement during ethanolamine growth remain untested.
    gap_kind: [BIOLOGY]
  - gap_statement: >-
      How a shell-less EutB/EutC system such as that of KT2440 limits
      acetaldehyde loss and toxicity without microcompartment encapsulation is
      untested.
    gap_kind: [BIOLOGY]
