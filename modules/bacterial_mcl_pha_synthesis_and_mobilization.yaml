  connections:
  - source: pha_monomer_supply_from_fas
    target: mcl_pha_polymerization
    connection_type: PROVIDES_INPUT_FOR
    description: PhaG-mediated routing can supply the hydroxyacyl-CoA pool consumed by an appropriate
      PhaC; external beta-oxidation-derived supply also satisfies the core input boundary.
    chaining_status: MAPPING_GAP
    chaining_note: Forward transfer is favored by source-specific genetic controls; purified reverse transfer
      is measured. The broad acyltransferase GO genus does not encode this complete reaction mapping.
      Direct native forward kinetics and universal ligase dependence are not asserted.
  - source: mcl_pha_polymerization
    target: mcl_pha_depolymerization
    connection_type: PROVIDES_INPUT_FOR
    description: The compatible intracellular storage polymer made by PhaC is substrate for a source-qualified
      PhaZ realization.
    chaining_status: VERIFIED
    chaining_note: Synthesis and mobilization share the storage-polymer boundary, but composition and
      intracellular access still need evidence. This is not conversion of every PHA or extracellular polyester
      by every listed enzyme.
  knowledge_gaps:
  - gap_statement: Forward PhaG ACP-to-CoA transfer is favored by 2022 heterologous genetic controls,
      but purified forward kinetics and native quantitative flux remain unresolved. Older free-acid/ligase
      observations do not uniquely identify intrinsic PhaG hydrolysis.
    boundary: Keep PhaG optional and distinguish measured reverse chemistry, forward genetic inference
      and native physiology; do not require PP_0763 universally.
    gap_kind:
    - BIOLOGY
  - gap_statement: Class I PhaC medium-chain comonomer acceptance is supported by PMID:10612741 and PMID:35341893,
      while the exact core synthase panels are class II. Pure or predominantly MCL polymer and complete
      native MCL turnover are not established for the class I H16 comparator; its assayed construct sequence
      was not independently verified.
    boundary: Generic family membership cannot supply the substrate gate, and missing class II classification
      does not prove medium-chain chemistry impossible.
    gap_kind:
    - BIOLOGY
  - gap_statement: The relative native contributions and substrate preferences of two PhaCs depend on
      strain and conditions; KCTC1639 or P. putida U results are not automatically KT2440 phenotypes.
    boundary: Either supported synthase can realize polymerization; do not make two synthases sequential
      or universally necessary.
    gap_kind:
    - BIOLOGY
  - gap_statement: KT2442 PhaZ assays are not direct KT2440 assays without an exact identity bridge. Native
      KT2440 fraction detection is corroborative but lacks the source table enrichment marker. GPo1 mobilization
      does not establish precise oligomer products or bilayer localization.
    boundary: Keep exact strains, intrinsic chemistry, localization inference and native flux separate.
    gap_kind:
    - BIOLOGY
  - gap_statement: Phasins, regulation and monomer-supply pathways affect granule organization and polymer
      accumulation. Synthesis alone and the combined synthesis-plus-mobilization profile are different
      capabilities.
    boundary: Keep adjacent factors outside the bounded reaction core without declaring them physiologically
      dispensable.
    gap_kind:
    - BIOLOGY
  - gap_statement: KT2440 and GPo1 PhaZ have different biochemical resolution.
    boundary: KT2442 has product-resolved HO-rich-polymer assays, but a stable donor accession and exact
      sequence bridge to KT2440 are unestablished. GPo1 has native turnover evidence without equivalent
      purified product specificity. Both target realizers retain the proposed broader activity without
      an exact GO:0050527 claim.
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
