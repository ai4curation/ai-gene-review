- id: PMID:35341893
  title: High amounts of medium-chain-length polyhydroxyalkanoates subunits can be accumulated in recombinant
    Cupriavidus necator with wild-type synthase.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ABSTRACT_ONLY; full-text access attempts were unsuccessful. Evidence and sequence limits
      are documented in analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/class-i-consultation/.
      J05003/AAA21975.1 matches current P23608 exactly, but does not prove identity of the assayed construct.
  findings:
  - statement: Cupriavidus necator H16 with its unmodified native synthase accumulates SCL–MCL copolymer
      after engineered precursor routing. Class I membership therefore cannot exclude medium-chain incorporation.
      This engineered substrate-pool result does not establish complete native MCL synthesis and mobilization
      or a matched depolymerase.
