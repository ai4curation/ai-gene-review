id: MODULE:bacterial_mcl_pha_synthesis_and_mobilization
title: Bacterial medium-chain-length PHA synthesis and mobilization
description: >-
  A reusable bacterial module for production and intracellular turnover of
  medium-chain-length poly(3-hydroxyalkanoate) storage polyester. The required
  core begins with an externally supplied (R)-3-hydroxyacyl-CoA pool: class II
  PhaC enzymes polymerize these monomers at PHA granules, and intracellular PhaZ
  depolymerases remobilize stored polymer. PhaG-dependent routing from de novo
  fatty-acid synthesis is an optional upstream submodule whose physiological
  chemistry is not fixed here. Beta-oxidation-derived monomer supply and
  phasin-mediated granule organization are adjacent processes outside the core
  reaction boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:9727022
    title: A new metabolic link between fatty acid de novo synthesis and polyhydroxyalkanoic acid synthesis. The PHAG gene from Pseudomonas putida KT2440 encodes a 3-hydroxyacyl-acyl carrier protein-coenzyme a transferase.
    statement: >-
      Genetic complementation and purified-protein assays establish PhaG as an
      optional link between de novo fatty-acid synthesis and PHA precursor supply.
  - source_id: PMID:17137299
    title: Metabolic engineering and characterization of phaC1 and phaC2 genes from Pseudomonas putida KCTC1639 for overproduction of medium-chain-length polyhydroxyalkanoate.
    statement: >-
      Overexpression experiments give distinct PhaC1 and PhaC2 phenotypes and
      support representing them as nonsequential class II polymerase-family members.
  - source_id: PMID:20937103
    title: Influence of growth stage on activities of polyhydroxyalkanoate (PHA) polymerase and PHA depolymerase in Pseudomonas putida U.
    statement: >-
      Pseudomonas PhaC polymerase and PhaZ depolymerase are granule-associated
      activities that can operate concomitantly during intracellular PHA turnover.
  - source_id: PMID:17170116
    title: 'Biochemical evidence that phaZ gene encodes a specific intracellular medium chain length polyhydroxyalkanoate depolymerase in Pseudomonas putida KT2442: characterization of a paradigmatic enzyme.'
    statement: >-
      Purified PhaZ is an intracellular, PHA-granule-localized depolymerase that
      hydrolyzes medium-chain-length PHA containing aliphatic and aromatic monomers.
  - source_id: file:PSEPK/phaG/phaG-ai-review.yaml
    title: PSEPK phaG gene review
    statement: >-
      The curated O85207 review supports the fatty-acid-synthesis bridge that
      supplies medium-chain (R)-3-hydroxyacyl units for PHA synthesis.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__mcl_pha_monomer_supply_from_fas__upa00212-deep-research-openscientist.md
    title: OpenScientist UPA00212 module, pathway, and PSEPK taxon review
    statement: >-
      Establishes PhaG-dependent routing as a genuine but mechanistically
      unresolved optional route and identifies a possible separate PP_0763
      CoA-activation step under the two-enzyme model.
  - source_id: file:modules/mcl_pha_monomer_supply_from_fas-deep-research-openscientist.md
    title: OpenScientist generic PhaG monomer-supply module review
    statement: >-
      Reviews the competing direct-transacylase and thioesterase-plus-ligase
      models and the alternative beta-oxidation-derived supply route.
  - source_id: file:PSEPK/phaC/phaC-deep-research-openscientist.md
    title: OpenScientist PSEPK PhaC2 review
    statement: Supports class II mcl-PHA synthase assignment while leaving the native PhaC1/PhaC2 division of labor unresolved.
  - source_id: file:PSEPK/phaZ/phaZ-deep-research-openscientist.md
    title: OpenScientist PSEPK PhaZ review
    statement: Supports intracellular granule-associated mcl-PHA depolymerase activity and rejects the generic glycerolipid annotations.
  - source_id: file:PSEPK/phaA/phaA-ai-review.yaml
    title: PSEPK phaC1 gene review
    statement: >-
      The curated Q88D25 review identifies PhaC1 as one of the two class II
      polymerases and places it at the polyhydroxyalkanoate granule.
  - source_id: file:PSEPK/phaC/phaC-ai-review.yaml
    title: PSEPK phaC2 gene review
    statement: >-
      The curated Q88D23 review supports a second class II polymerase that
      contributes under condition-dependent PHA-producing states.
  - source_id: file:PSEPK/phaZ/phaZ-ai-review.yaml
    title: PSEPK phaZ gene review
    statement: >-
      The curated Q88D24 review supports intracellular granule-associated
      depolymerization of medium-chain-length PHA.
notes: >-
  PhaC1 and PhaC2 are represented as members of one class II synthase family,
  not as sequential steps. The core module is complete from an
  (R)-3-hydroxyacyl-CoA input boundary through polymerization and mobilization.
  PhaG is optional upstream context because beta-oxidation and other routes can
  independently provide PhaC substrates; its in vivo chemistry is deliberately
  not asserted as a single direct ACP:CoA reaction. The PhaG annoton therefore
  records a routing role without assigning substrates, products, or a module-level
  catalytic function. A thioesterase-plus-ligase model implicating PP_0763 remains
  plausible but is not promoted to a required step without direct native-context
  resolution. PhaC1 and PhaC2 are co-exemplars of one class II synthase role;
  neither is labeled primary, redundant, or substrate-specialized. PhaF, PhaI, and PhaD affect
  granule architecture or regulation but do not define additional reaction
  steps in this module.
