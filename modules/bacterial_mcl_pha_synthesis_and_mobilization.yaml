id: MODULE:bacterial_mcl_pha_synthesis_and_mobilization
title: Bacterial medium-chain-length PHA synthesis and intracellular mobilization
description: Intracellular storage-polyester synthesis and turnover begin with a supplied pool of medium-chain
  (R)-3-hydroxyacyl-CoA. Substrate-compatible PhaC enzymes polymerize hydroxyacyl units, and intracellular
  PhaZ enzymes mobilize the resulting storage polymer. PhaG-dependent transfer from fatty-acid-synthesis
  intermediates provides an optional upstream supply route. Polymer composition, synthase substrate acceptance
  and depolymerase access depend on the enzyme, substrate pool and native granule context.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:9727022
  title: A new metabolic link between fatty acid de novo synthesis and polyhydroxyalkanoic acid synthesis.
    The PHAG gene from Pseudomonas putida KT2440 encodes a 3-hydroxyacyl-acyl carrier protein-coenzyme
    a transferase.
  statement: Native PhaG-linked routing and heterologous complementation connect fatty-acid synthesis
    to PHA production. Purified-transfer evidence is interpreted with the measured reaction direction;
    the 2022 forward-routing controls qualify the earlier chemistry debate.
- source_id: PMID:17137299
  title: Metabolic engineering and characterization of phaC1 and phaC2 genes from Pseudomonas putida KCTC1639
    for overproduction of medium-chain-length polyhydroxyalkanoate.
  statement: KCTC1639 overexpression supports condition-dependent synthase differences in that strain;
    it does not establish a sequential PhaC1/PhaC2 pathway or the same division of labor in KT2440.
- source_id: PMID:20937103
  title: Influence of growth stage on activities of polyhydroxyalkanoate (PHA) polymerase and PHA depolymerase
    in Pseudomonas putida U.
  statement: P. putida U growth-stage studies support simultaneous polymerization and depolymerization;
    their kinetics are not relabeled as KT2440 or GPo1 measurements.
- source_id: PMID:17170116
  title: 'Biochemical evidence that phaZ gene encodes a specific intracellular medium chain length polyhydroxyalkanoate
    depolymerase in Pseudomonas putida KT2442: characterization of a paradigmatic enzyme.'
  statement: Characterizes intracellular KT2442 PhaZ on medium-chain PHA. Applying intrinsic activity
    to the KT2440 reference is a close-strain inference, not a native KT2440 assay; no complete sequence
    equality is asserted. Weak secondary tributyrin hydrolysis is distinct from native glycerolipid flux.
- source_id: file:PSEPK/phaG/phaG-ai-review.yaml
  title: PSEPK phaG gene review
  statement: The curated O85207 review supports the fatty-acid-synthesis bridge that supplies medium-chain
    (R)-3-hydroxyacyl units for PHA synthesis.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__mcl_pha_monomer_supply_from_fas__upa00212-deep-research-openscientist.md
  title: OpenScientist UPA00212 module, pathway, and PSEPK taxon review
  statement: Historical generated research used for discovery and provenance. Current primary-source assessments
    in this audit determine mechanism and strain scope; this report is not independent experimental evidence.
- source_id: file:modules/mcl_pha_monomer_supply_from_fas-deep-research-openscientist.md
  title: OpenScientist generic PhaG monomer-supply module review
  statement: Historical generated research used for discovery and provenance. Current primary-source assessments
    in this audit determine mechanism and strain scope; this report is not independent experimental evidence.
- source_id: file:PSEPK/phaC/phaC-deep-research-openscientist.md
  title: OpenScientist PSEPK PhaC2 review
  statement: Historical generated research used for discovery and provenance. Current primary-source assessments
    in this audit determine mechanism and strain scope; this report is not independent experimental evidence.
- source_id: file:PSEPK/phaZ/phaZ-deep-research-openscientist.md
  title: OpenScientist PSEPK PhaZ review
  statement: Historical generated research used for discovery and provenance. Current primary-source assessments
    in this audit determine mechanism and strain scope; this report is not independent experimental evidence.
- source_id: file:PSEPK/phaA/phaA-ai-review.yaml
  title: PSEPK phaC1 gene review
  statement: The curated Q88D25 review identifies PhaC1 as one of the two class II polymerases and places
    it at the polyhydroxyalkanoate granule.
- source_id: file:PSEPK/phaC/phaC-ai-review.yaml
  title: PSEPK phaC2 gene review
  statement: The curated Q88D23 review supports a second class II polymerase that contributes under condition-dependent
    PHA-producing states.
- source_id: file:PSEPK/phaZ/phaZ-ai-review.yaml
  title: PSEPK phaZ gene review
  statement: The curated Q88D24 review supports intracellular granule-associated depolymerization of medium-chain-length
    PHA.
- source_id: DOI:10.1007/s10924-024-03474-4
  title: 'Make it or break it: A review on PHA synthase and depolymerase proteins'
  statement: Class II synthases are usual mcl-PHA anchors, but class labels are not absolute substrate
    exclusion rules; the review discusses C. necator class I acceptance of C8/C12 precursors in heterologous
    E. coli. Intracellular native-granule and extracellular denatured-polymer depolymerases are distinct
    roles. Publisher calls this OriginalPaper, but its content is a literature review.
- source_id: PMID:38845815
  title: 'Current trends in medium-chain-length polyhydroxyalkanoates: Microbial production, purification,
    and characterization.'
  statement: The mcl range is C6–C14, distinct from C3–C5 scl-PHA. Wild-type production reports extend
    beyond Pseudomonas, but a polymer-production report does not identify the matching synthase/depolymerase
    pair or license family-only role transfer. Composition depends on feedstock; C8/C10 are frequent,
    not exclusive.
- source_id: PMID:28425176
  title: Polyhydroxyalkanoate-associated phasins as phylogenetically heterogeneous, multipurpose proteins.
  statement: Phasins organize granules and influence accumulation, segregation and enzyme access. These
    are adjacent granule functions, not additional obligatory chemical reactions in the bounded synthase-plus-intracellular-depolymerase
    profile; PHB-specific phasin dependencies cannot automatically be transferred to mcl systems.
- source_id: PMID:35338129
  title: Metabolic engineering strategies to produce medium-chain oleochemicals via acyl-ACP:CoA transacylase
    activity.
  statement: 'KT2440 PhaG expressed in E. coli supports forward ACP-to-CoA routing in genetic product-sink
    comparisons: the product does not depend on FadD reactivation. The paper explicitly lacks direct forward
    acyl-ACP in-vitro kinetics. Endogenous thioesterases offer an alternative explanation for free hydroxyacids
    in older experiments. The main subsequent enzyme optimization uses P. koreensis PhaG and is not KT2440
    native physiology.'
- source_id: PMID:12200450
  title: Biochemical characterization of the Pseudomonas putida 3-hydroxyacyl ACP:CoA transacylase, which
    diverts intermediates of fatty acid de novo biosynthesis.
  statement: 'Purified/refolded P. putida PhaG was measured transferring hydroxyacyl groups from CoA to
    ACP: direct reverse-reaction evidence, not a direct forward-ACP assay. Abstract also reports cytosolic
    localization and substrate-dependent dimerization. Exact target strain/construct requires fuller source
    bridge.'
- source_id: PMID:22101037
  title: Development of a new strategy for production of medium-chain-length polyhydroxyalkanoates by
    recombinant Escherichia coli via inexpensive non-fatty acid feedstocks.
  statement: This study inferred PhaG thioesterase chemistry from heterologous free hydroxyacid accumulation
    and increased PHA when PP0763 was coexpressed. It did not isolate PhaG hydrolysis from endogenous
    CoA-thioester hydrolysis. Preserve the observed phenotype while reassessing that interpretation against
    the 2022 controls; do not make PP0763 universally required for PhaG routing. Native KT2440 polymer
    composition is measured separately from recombinant E. coli output.
- source_id: PMID:1989978
  title: Metabolism of poly(3-hydroxyalkanoates) (PHAs) by Pseudomonas oleovorans. Identification and
    sequences of genes and function of the encoded proteins in the synthesis and degradation of PHA.
  statement: The original GPo1 locus study selected synthase/degradation complementation and sequenced
    the two synthases and intervening depolymerase. M58445 CDS translations exactly match P26494/P26495/P26496.
    It does not establish a mandatory sequential C1/C2 division, and the abstract reports no clear specificity
    difference.
- source_id: PMID:11133449
  title: Polyhydroxyalkanoate degradation is associated with nucleotide accumulation and enhances stress
    resistance and survival of Pseudomonas oleovorans in natural water microcosms.
  statement: Native GPo1 and GPo500 phaZ were compared for polymer mobilization, with genetic complementation.
    The rescuing construct contains phaC1 plus phaZ and their promoter, so it is not purified single-protein
    reconstitution. The mutant is leaky, not absolute zero turnover. ATP/ppGpp and survival are consequences,
    not additional PhaZ catalytic functions. The source describes primarily C8/C6 polymer.
- source_id: PMID:10713430
  title: The Pseudomonas aeruginosa phaG gene product is involved in the synthesis of polyhydroxyalkanoic
    acid consisting of medium-chain-length constituents from non-related carbon sources.
  statement: PAO1 PhaG supports complementation of a P. putida phaG mutant; the resulting polymer contains
    C6/C8/C10/C12. Native P. aeruginosa phaG disruption reduces gluconate-supported PHA to about 40% of
    wild type while fatty-acid-supported accumulation remains at wild-type level. This establishes a useful,
    nonobligatory substrate-routing role, not direct purified target chemistry. AF209711 exactly matches
    Q51553.
- source_id: PMID:10952003
  title: 'In vitro synthesis of poly(3-hydroxydecanoate): purification and enzymatic characterization
    of type II polyhydroxyalkanoate synthases PhaC1 and PhaC2 from Pseudomonas aeruginosa.'
  statement: 'Purified His-tagged P. aeruginosa class II PhaC1/PhaC2 synthesize poly(3-hydroxydecanoate)
    in vitro. Exact modern PAO1 PhaC1 construct identity remains unresolved: historical X66592 C1 is 557
    aa versus current 559 aa. C2 and depolymerase archive sequences match modern entries, but adding a
    full PAO1 panel is unnecessary for the present mechanism comparison.'
- source_id: PMID:41055782
  title: Revealing the essential role of the lid in mclPHA intracellular depolymerase from Pseudomonas
    putida KT2440.
  statement: Despite KT2440 in its title, the assayed pPAZ3/template derives from KT2442 and protein is
    expressed in E. coli. GPo1 supplies radiolabeled polymer, not the enzyme. WT PhaZ acts on mcl polymer
    and pNP ester substrates; commercial polymer is mainly C8 with C6. Do not transfer native KT2440 localization,
    whole-strain phenotypes or variant kinetics from this paper without identity/context qualification.
    Extracellular GK13 comparator is a distinct compartmental role.
- source_id: PMID:10612741
  title: 'Analysis of in vivo substrate specificity of the PHA synthase from Ralstonia eutropha: formation
    of novel copolyesters in recombinant Escherichia coli.'
  statement: The Ralstonia eutropha class I PhaC produces 3HB/3HO and 3HB/3HO/3HDD copolyesters in engineered
    E. coli. This supports medium-chain comonomer acceptance, not pure or predominantly medium-chain polymer
    or complete native intracellular turnover. The primary abstract distinguishes this single-synthase
    result from the separate two-synthase blend control; exact assay-construct sequence equality remains
    unverified.
- source_id: PMID:35341893
  title: High amounts of medium-chain-length polyhydroxyalkanoates subunits can be accumulated in recombinant
    Cupriavidus necator with wild-type synthase.
  statement: Cupriavidus necator H16 with its unmodified native synthase accumulates SCL–MCL copolymer
    after engineered precursor routing. Class I membership therefore cannot exclude medium-chain incorporation.
    This engineered substrate-pool result does not establish complete native MCL synthesis and mobilization
    or a matched depolymerase.
notes: The core boundary starts at externally supplied hydroxyacyl-CoA and includes polymerization plus
  intracellular mobilization; requiring PhaZ for this combined profile does not make it necessary for
  synthesis alone. KT2440 and exact GPo1 references anchor the core; PAO1 PhaG is an optional-route comparator,
  not a complete separately reviewed PAO1 panel. GPo1 taxonomy/nomenclature aliases denote one strain.
  The unverified Q9KJH8 sequence-only PhaG representative is not retained as an equally direct functional
  exemplar. Class II PhaCs are positive anchors rather than a universal exclusion of class I medium-chain
  acceptance. PhaZ family placements 43433 and 43798 remain distinct with source-qualified substrate/function
  evidence. A KT2440 historical direct-localization proposal is retired in place solely for unsupported
  target-direct provenance, while qualified core localization is retained. Provider artifacts remain immutable
  discovery inputs; current primary evidence determines the mechanism. Full validation, capacity closure
  and independent review remain pending. CUPNH/phaC P23608 is reviewed as a class I substrate-range comparator.
  Its supported SCL–MCL copolymer incorporation is distinct from the matched synthase/depolymerase core
  panels.
