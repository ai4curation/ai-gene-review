id: MODULE:nrf_oxidative_stress_response
title: CNC/NRF oxidative and xenobiotic stress response
description: >-
  A cross-species module for the oxidative and xenobiotic stress response
  driven by cap'n'collar (CNC) basic-leucine-zipper transcription factors:
  NRF2 (NFE2L2) in vertebrates, CncC in Drosophila and SKN-1 in
  Caenorhabditis elegans. In unstressed cells the CNC factor is kept scarce
  by constitutive cullin-RING ubiquitin ligase-dependent degradation, and its
  nuclear activity is further restrained by glycogen synthase kinase-3
  (GSK-3) phosphorylation. Two degradation arms are known. In vertebrates and
  insects the BTB-Kelch protein KEAP1 binds the CNC factor and presents it to
  a CUL3-RING ligase, and reactive KEAP1 cysteines act as sensors whose
  modification by oxidants and electrophiles stops degradation. Nematodes
  have no KEAP1; there the WD40 protein WDR-23, the ortholog of human DCAF11,
  restrains SKN-1 together with the CUL-4/DDB-1 (CRL4) ligase, and DCAF11
  also targets human NRF2 for degradation through a separate degron.
  Stress-activated kinases promote nuclear accumulation of the factor; in
  C. elegans the NSY-1/SEK-1/PMK-1 p38 MAPK cascade phosphorylates SKN-1.
  Nuclear CNC factors then induce a phase II detoxification program that
  includes glutamate-cysteine ligase, the rate-limiting enzyme of glutathione
  synthesis, and glutathione S-transferases, and loss of the CNC factor makes
  animals sensitive to oxidative stress. NRF2 binds antioxidant response
  elements as a heterodimer with small MAF proteins, whereas SKN-1 binds DNA
  as a monomer through its Skn domain.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12869585
    title: SKN-1 links C. elegans mesendodermal specification to a conserved oxidative stress response.
    statement: >-
      Postembryonic SKN-1 regulates a phase II detoxification gene and
      accumulates in intestinal nuclei under oxidative stress; skn-1 mutants
      are stress-sensitive and short-lived. The authors place the response as
      conserved with the vertebrate bZIP oxidative stress response.
    supporting_text: >-
      SKN-1 is present in ASI nuclei under normal conditions, and accumulates
      in intestinal nuclei in response to oxidative stress. skn-1 mutants are
      sensitive to oxidative stress and have shortened lifespans.
  - source_id: PMID:12869585
    title: SKN-1 links C. elegans mesendodermal specification to a conserved oxidative stress response.
    statement: >-
      SKN-1 is distantly related to the vertebrate bZIP oxidative stress
      regulators but acts similarly to resist oxidative stress.
    supporting_text: >-
      SKN-1 binds to DNA through a unique mechanism, but is distantly
      related to basic leucine-zipper proteins that orchestrate the major
      oxidative stress response in vertebrates and yeast. Here we show that
      despite its distinct mode of target gene recognition, SKN-1 functions
      similarly to resist oxidative stress in C. elegans.
  - source_id: PMID:18194654
    title: Keap1/Nrf2 signaling regulates oxidative stress tolerance and lifespan in Drosophila.
    statement: >-
      The insect Keap1/CncC pathway is oxidant-activated, induces
      antioxidant and detoxification genes, and confers oxidative stress
      tolerance, establishing the response in an arthropod.
    supporting_text: >-
      We demonstrate that Keap1/Nrf2 signaling in the fruit fly is activated
      by oxidants, induces antioxidant and detoxification responses, and
      confers increased tolerance to oxidative stress.
  - source_id: PMID:19273594
    title: >-
      The WD40 repeat protein WDR-23 functions with the CUL4/DDB1 ubiquitin
      ligase to regulate nuclear abundance and activity of SKN-1 in
      Caenorhabditis elegans.
    statement: >-
      In C. elegans WDR-23 acts downstream of the p38, GSK-3 and insulin-like
      inputs, which places the CUL-4/DDB-1/WDR-23 step as the integration
      point for SKN-1 phosphorylation signals.
    supporting_text: >-
      WDR-23 regulates SKN-1 target genes downstream from p38
      mitogen-activated protein kinase, glycogen synthase kinase 3, and
      insulin-like receptor pathways
  - source_id: PMID:18358814
    title: >-
      Direct inhibition of the longevity-promoting factor SKN-1 by
      insulin-like signaling in C. elegans.
    statement: >-
      Insulin/IGF-1-like signaling kinases phosphorylate and inhibit SKN-1 in
      parallel to DAF-16; recorded as an additional inhibitory input (not
      modeled as a part).
    supporting_text: >-
      The IIS kinases AKT-1, -2, and SGK-1 phosphorylate SKN-1, and reduced
      IIS leads to constitutive SKN-1 nuclear accumulation in the intestine
      and SKN-1 target gene activation.
  - source_id: file:genes/worm/skn-1/skn-1-ai-review.yaml
    title: worm skn-1 gene review
    statement: >-
      Accepts SKN-1 as an RNA polymerase II-specific DNA-binding transcription
      factor for phase II detoxification and oxidative stress genes, with
      separate developmental (EMS specification) and longevity roles.
  - source_id: file:genes/human/NFE2L2/NFE2L2-ai-review.yaml
    title: human NFE2L2 gene review
    statement: >-
      Core functions: RNA polymerase II-specific DNA-binding transcription
      factor activity and ARE sequence-specific DNA binding as a heterodimer
      with small MAF proteins; KEAP1-CUL3-dependent turnover under basal
      conditions.
  - source_id: file:modules/p38_cascade.yaml
    title: p38 stress-activated MAPK cascade module
    statement: >-
      Taxon-neutral p38 MAPK cascade module; the NSY-1/SEK-1/PMK-1 input part
      here is a nematode instance of its MAP3K-MAP2K-p38 core.
  - source_id: file:projects/CAEEL_PROTEOSTASIS.md
    title: C. elegans Proteostasis Network Project
    statement: >-
      Project page whose SKN-1/Nrf oxidative-stress tier this module
      organizes.
notes: >-
  History. This module was first written as a concrete C. elegans SKN-1
  module and was generalized to the CNC/NRF response across bilaterians. All
  nematode evidence is retained; the nematode-specific wiring is kept as one
  variant of the degradation step and as the nematode-characterized p38 input
  part.

  Boundary. The module covers the stress-inducible CNC response: constitutive
  ligase-dependent degradation of the CNC factor, GSK-3 inhibitory
  phosphorylation, stress-activated kinase input, CNC transcription, and two
  representative phase II enzyme outputs. Outside the boundary are the
  developmental role of maternal SKN-1 in EMS blastomere specification, the
  ER-associated NRF1/SKN-1A proteasome-recovery response (a separate CNC
  paralog program), SKN-1B in ASI neurons for dietary-restriction longevity,
  and the KEAP1-sequestering autophagy receptor SQSTM1/p62. The C. elegans
  insulin/IGF-1-like AKT-1/AKT-2/SGK-1 inhibitory input (PMID:18358814) and,
  in mammals, PI3K/AKT inhibition of GSK3B are recorded as context. The GATA
  factor ELT-3 is a SKN-1 co-activator for gst-4 and BRAP-2 restrains the
  p38 input (PMID:28600327); both are context, not members. Small MAF
  partners of NRF2 are not modeled as a part because SKN-1 acts without them.

  Context taxon. Bilateria is used because the stress response with this
  regulatory architecture is documented in nematodes (SKN-1), arthropods
  (Drosophila Keap1/CncC, PMID:18194654) and vertebrates (KEAP1/NRF2). The
  CNC transcription factor itself is older: its PAINT node PTN002399572
  (PTHR24411) is placed at Eumetazoa, so cnidarian CNC proteins exist, but
  their deployment in an oxidative stress response is not established in the
  cached evidence.

  Degradation lineages. KEAP1 is present in vertebrates and insects but
  absent from C. elegans; WDR-23/DCAF11 and CRL4 occupy the nematode
  position. This is an analogy of role, not of sequence; KEAP1 binds the
  Neh2 ETGE/DLG motifs of NRF2, whereas DCAF11 binds the distinct Neh2
  DIDLID sequence (PMID:31586112), so mammals use both arms at once
  (ONE_OR_MORE). No KEAP1-like cysteine-sensor step is known for WDR-23.
  Drosophila Keap1 and CncC have no gene review and are cited only as
  literature evidence. Human CUL4A and CUL4B have no gene review, so the CUL4
  scaffold role is grounded only on worm CUL-4. In mammals GSK3B
  phosphorylation of the NRF2 Neh6 domain creates a degron for the
  beta-TrCP (BTRC)-CUL1 ligase (Reactome R-HSA-9762094, R-HSA-9762093); BTRC
  has no gene review, so this third degradation route is recorded here
  rather than as a variant. In C. elegans the reported GSK-3 readout is
  nuclear exclusion.

  Activating kinases. The NSY-1/SEK-1/PMK-1 cascade is shared with intestinal
  antibacterial immunity, where PMK-1 acts through ATF-7 and other targets.
  The cascade itself is modeled in MODULE:c_elegans_pmk1_intestinal_immunity,
  which is the place for kinase-relay detail, and the taxon-neutral
  MODULE:p38_cascade gives the generic relay. Here the cascade is one
  optional input part, marked as characterized in nematodes, because a
  conserved p38 phosphorylation of vertebrate NRF2 is not established in the
  cached evidence.

  Grounding caveats. The wdr-23 review is filed on S6FN32, a 498-residue
  product that lacks the N termini of the experimentally studied cytoplasmic
  WDR-23A and nuclear WDR-23B isoforms (both from P90794); its review keeps
  the broader molecular adaptor activity (GO:0060090), of which the
  ubiquitin-like ligase-substrate adaptor activity used here for the family
  role (GO:1990756, from the human DCAF11 review) is a descendant. The worm
  ddb-1 review assigns ubiquitin ligase complex scaffold activity
  (GO:0160072), as does the first core function of the human DDB1 review, and
  that term is used for the DDB1 role. Ubiquitination of SKN-1 by
  CUL-4/DDB-1/WDR-23 has not been shown biochemically in the cached
  literature; the 2009 study states it as presumed. The protective role of
  GCS-1 is clearest for arsenite (PMID:16333752).
module:
  id: nrf_oxidative_stress_response
  label: CNC/NRF oxidative and xenobiotic stress response
  module_type: SIGNALING_PATHWAY
  description: >-
    Constitutive cullin-RING degradation (KEAP1-CUL3 and/or DCAF11/WDR-23-
    DDB1-CUL4) and GSK-3 inhibitory phosphorylation restrain a CNC-bZIP
    transcription factor (NRF2, CncC, SKN-1); stress releases it, kinase input
    promotes its nuclear accumulation, and it induces phase II detoxification
    genes such as glutamate-cysteine ligase and glutathione S-transferases.
  concepts:
    - preferred_term: cellular response to oxidative stress
      term:
        id: GO:0034599
        label: cellular response to oxidative stress
    - preferred_term: cellular detoxification
      term:
        id: GO:1990748
        label: cellular detoxification
      description: >-
        Phase II detoxification output of the response.
  context:
    taxa:
      - preferred_term: Bilateria
        term:
          id: NCBITaxon:33213
          label: Bilateria
        description: >-
          CNC-factor oxidative stress responses with ligase-dependent
          restraint are documented in nematodes, insects and vertebrates.
          The CNC transcription-factor PAINT node PTN002399572 is placed at
          Eumetazoa, but a cnidarian stress-response deployment is not
          established in the cached evidence.
    anatomical_locations:
      - preferred_term: intestine (C. elegans) and other detoxifying tissues
        description: >-
          In C. elegans the stress-inducible SKN-1 response is intestinal
          (WBbt:0005772 intestine; the WBbt id is given in text because the
          WBbt prefix is not configured for label validation). Constitutive
          SKN-1 in ASI neurons is outside the module. Vertebrate NRF2 acts
          broadly, prominently in liver and other detoxifying tissues.
    conditions:
      - preferred_term: oxidative stress (e.g. arsenite, peroxide, paraquat) or electrophile/xenobiotic exposure
  parts:
    - order: 1
      role: constitutive cullin-RING ubiquitin-ligase restraint of the CNC factor
      node:
        id: cnc_degradation
        label: Cullin-RING ligase restraint of the CNC transcription factor
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Without stress, a cullin-RING E3 ubiquitin ligase keeps the CNC
          factor scarce and out of the nucleus by targeting it for proteasomal
          degradation. The substrate receptor differs by lineage.
        variant_sets:
          - id: degradation_adaptor_lineage
            label: Degradation adaptor lineage
            axis: taxon / degradation adaptor lineage
            selection: ONE_OR_MORE
            notes: >-
              Nematodes use only the WDR-23 CRL4 arm (no KEAP1). Vertebrates
              use KEAP1-CUL3 and also DCAF11-CRL4, which binds a separate
              NRF2 degron, so a mammalian realization is the union of both
              variants. Insects have Keap1 (PMID:18194654); a DCAF11 role on
              CncC is not established in the cached evidence.
            variants:
              - id: crl4_dcaf11_arm
                label: WDR-23/DCAF11-DDB1-CUL4 (CRL4) arm
                module_type: PROTEIN_COMPLEX
                description: >-
                  The WD40 substrate receptor WDR-23/DCAF11 docks on the DDB1
                  adaptor of a CUL4 ligase. In C. elegans it represses SKN-1
                  protein levels, nuclear accumulation and activity,
                  presumably by proteasomal degradation; the nuclear WDR-23B
                  isoform restrains SKN-1 target genes and loss of WDR-23
                  raises gst-4 mRNA about 40-fold. Human DCAF11 with
                  DDB1-CUL4 binds the DIDLID sequence of the NRF2 Neh2 domain
                  and mediates its degradation.
                concepts:
                  - preferred_term: Cul4-RING E3 ubiquitin ligase complex
                    term:
                      id: GO:0080008
                      label: Cul4-RING E3 ubiquitin ligase complex
                annotons:
                  - id: dcaf11_receptor
                    label: WDR-23/DCAF11 substrate receptor for the CNC factor
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: DCAF11/WDR-23 WD40 substrate receptors
                        term:
                          id: PANTHER:PTHR19847:SF7
                          label: DDB1- AND CUL4-ASSOCIATED FACTOR 11
                        representative_members:
                          - preferred_term: WDR-23 (worm)
                            term:
                              id: UniProtKB:S6FN32
                              label: DDB1- and CUL4-associated factor 11 homolog
                          - preferred_term: DCAF11 (human)
                            term:
                              id: UniProtKB:Q8TEB1
                              label: DDB1- and CUL4-associated factor 11
                    function:
                      preferred_term: ubiquitin-like ligase-substrate adaptor activity
                      term:
                        id: GO:1990756
                        label: ubiquitin-like ligase-substrate adaptor activity
                      description: >-
                        From the human DCAF11 review; the worm wdr-23 review
                        keeps the parent molecular adaptor activity
                        (GO:0060090) because of isoform caveats.
                      targets:
                        - preferred_term: SKN-1 (worm); NRF2 Neh2 DIDLID sequence (human)
                    processes:
                      - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
                        term:
                          id: GO:0043161
                          label: proteasome-mediated ubiquitin-dependent protein catabolic process
                        description: >-
                          Shown for human NRF2; presumed for worm SKN-1, whose
                          ubiquitination by this ligase has not been shown
                          directly.
                    role_description: >-
                      DCAF11-family substrate receptor that recruits the CNC
                      factor to the DDB1-CUL4 ligase and keeps it low in the
                      absence of stress.
                    evidence:
                      - source_id: PMID:19273594
                        title: >-
                          The WD40 repeat protein WDR-23 functions with the
                          CUL4/DDB1 ubiquitin ligase to regulate nuclear
                          abundance and activity of SKN-1 in Caenorhabditis
                          elegans.
                        statement: >-
                          WDR-23 represses SKN-1 levels, nuclear accumulation
                          and activity with CUL-4/DDB-1, presumably by
                          degradation.
                        supporting_text: >-
                          SKN-1 protein levels, nuclear accumulation, and
                          activity are repressed by the WD40 repeat protein
                          WDR-23, which interacts with the CUL-4/DDB-1
                          ubiquitin ligase to presumably target the
                          transcription factor for proteasomal degradation.
                      - source_id: PMID:31409866
                        title: >-
                          Nuclear and cytoplasmic WDR-23 isoforms mediate
                          differential effects on GEN-1 and SKN-1 substrates.
                        statement: >-
                          Loss of WDR-23 strongly derepresses the SKN-1 target
                          gst-4.
                        supporting_text: >-
                          wdr-23(tm1817) showed a significant increase
                          (~40-fold) in gst-4 mRNA levels
                      - source_id: PMID:31586112
                        statement: >-
                          Human DCAF11 with DDB1-CUL4 binds the NRF2 Neh2
                          DIDLID sequence and mediates NRF2 degradation;
                          DCAF11 knockdown raises NRF2 protein.
                        supporting_text: >-
                          DCAF11 and DDB1-Cul4/Roc1 bind to the DIDLID sequence
                          of the Neh2 domain of Nrf2 to mediate its degradation
                      - source_id: file:genes/worm/wdr-23/wdr-23-ai-review.yaml
                        title: worm wdr-23 gene review
                        statement: >-
                          Core function: molecular adaptor activity
                          (GO:0060090), recruiting substrates to CUL-4/DDB-1;
                          isoform caveats recorded.
                      - source_id: file:genes/human/DCAF11/DCAF11-ai-review.yaml
                        title: human DCAF11 gene review
                        statement: >-
                          Core functions: ubiquitin-like ligase-substrate
                          adaptor activity (GO:1990756) in CRL4(DCAF11), with
                          NRF2 and CENP-A as characterized substrates; WDR-23
                          recorded as the C. elegans ortholog acting on SKN-1.
                  - id: ddb1_adaptor
                    label: DDB1 cullin-receptor adaptor
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: DDB1 orthologs
                        description: >-
                          No PANTHER term is asserted: both members are
                          classified only in the broad PTHR10644 CPSF-family
                          root, which also contains CPSF and SF3B subunits.
                        representative_members:
                          - preferred_term: DDB-1 (worm)
                            term:
                              id: UniProtKB:Q21554
                              label: DNA damage-binding protein 1
                          - preferred_term: DDB1 (human)
                            term:
                              id: UniProtKB:Q16531
                              label: DNA damage-binding protein 1
                    function:
                      preferred_term: ubiquitin ligase complex scaffold activity
                      term:
                        id: GO:0160072
                        label: ubiquitin ligase complex scaffold activity
                      description: >-
                        As assigned by the worm ddb-1 review and the first
                        core function of the human DDB1 review.
                    role_description: >-
                      Links the DCAF11/WDR-23 substrate receptor to CUL4.
                    evidence:
                      - source_id: PMID:17145765
                        statement: >-
                          Worm DDB-1 binds CUL-4 specifically among the worm
                          cullins.
                        supporting_text: >-
                          DDB-1 interacts specifically with CUL-4, but not with
                          other cullins, in the yeast two-hybrid assay
                      - source_id: file:genes/worm/ddb-1/ddb-1-ai-review.yaml
                        title: worm ddb-1 gene review
                        statement: >-
                          Core function: ubiquitin ligase complex scaffold
                          activity (GO:0160072) in CRL4 ligases carrying DCAF
                          receptors including WDR-23.
                      - source_id: file:genes/human/DDB1/DDB1-ai-review.yaml
                        title: human DDB1 gene review
                        statement: >-
                          Core functions include ubiquitin ligase complex
                          scaffold activity bridging CUL4A/CUL4B-RBX1 to DCAF
                          receptors.
                  - id: cul4_scaffold
                    label: CUL4 cullin scaffold
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Cullin-4 orthologs
                        description: >-
                          No PANTHER term is asserted: worm CUL-4 is classified
                          only in the PTHR11932 cullin root. Human CUL4A and
                          CUL4B have no gene review and are not listed.
                        representative_members:
                          - preferred_term: CUL-4 (worm)
                            term:
                              id: UniProtKB:Q17392
                              label: Cullin-4
                    function:
                      preferred_term: ubiquitin ligase complex scaffold activity
                      term:
                        id: GO:0160072
                        label: ubiquitin ligase complex scaffold activity
                    role_description: >-
                      Cullin scaffold of the CRL4 ligase that ubiquitinates
                      receptor-bound substrates.
                    evidence:
                      - source_id: file:genes/worm/cul-4/cul-4-ai-review.yaml
                        title: worm cul-4 gene review
                        statement: >-
                          Core function: ubiquitin ligase complex scaffold
                          activity (GO:0160072); the WDR-23-containing CRL4
                          restrains SKN-1 abundance and nuclear accumulation.
                      - source_id: PMID:17145765
                        statement: >-
                          CUL-4/DDB-1 is required for CDT-1 degradation,
                          establishing worm CRL4 ligase activity on a
                          characterized substrate.
                        supporting_text: >-
                          The CUL-4/DDB-1 complex is required for CDT-1
                          degradation during S phase and for restraining DNA
                          rereplication.
              - id: keap1_cul3_arm
                label: KEAP1-CUL3 (CRL3) arm, vertebrates and insects
                module_type: PROTEIN_COMPLEX
                description: >-
                  Homodimeric KEAP1 binds the CNC factor through its Kelch
                  domain and CUL3 through its BTB domain; CUL3-RBX1
                  ubiquitinates NRF2 for proteasomal degradation. Reactive
                  KEAP1 cysteines sense oxidants and electrophiles, and their
                  modification stops degradation. Drosophila Keap1 inhibits
                  CncC in the same way. Absent from C. elegans.
                concepts:
                  - preferred_term: Cul3-RING ubiquitin ligase complex
                    term:
                      id: GO:0031463
                      label: Cul3-RING ubiquitin ligase complex
                annotons:
                  - id: keap1_adaptor
                    label: KEAP1 substrate adaptor and redox sensor
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KEAP1 BTB-Kelch adaptors
                        description: >-
                          Drosophila Keap1 belongs here but has no gene review
                          and is not listed.
                        term:
                          id: PANTHER:PTHR24412:SF162
                          label: KELCH-LIKE ECH-ASSOCIATED PROTEIN 1
                        representative_members:
                          - preferred_term: KEAP1 (human)
                            term:
                              id: UniProtKB:Q14145
                              label: Kelch-like ECH-associated protein 1
                    function:
                      preferred_term: ubiquitin-like ligase-substrate adaptor activity
                      term:
                        id: GO:1990756
                        label: ubiquitin-like ligase-substrate adaptor activity
                      targets:
                        - preferred_term: NRF2 Neh2 ETGE and DLG motifs
                    processes:
                      - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
                        term:
                          id: GO:0043161
                          label: proteasome-mediated ubiquitin-dependent protein catabolic process
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Substrate adaptor of the CUL3 ligase for NRF2 and the
                      cysteine-based sensor that releases NRF2 under stress.
                    evidence:
                      - source_id: PMID:15601839
                        statement: >-
                          KEAP1 binds CUL3 and NRF2 through its BTB and Kelch
                          domains, and KEAP1-CUL3-ROC1 ubiquitinates NRF2.
                        supporting_text: >-
                          Here we report that the human BTB-Kelch protein
                          Keap1, a negative regulator of the antioxidative
                          transcription factor Nrf2, binds to CUL3 and Nrf2 via
                          its BTB and Kelch domains, respectively.
                      - source_id: PMID:18194654
                        statement: >-
                          Drosophila Keap1 inhibits CncC as vertebrate KEAP1
                          inhibits NRF2.
                        supporting_text: >-
                          These data suggest an inhibitory role of Keap1 on
                          CncC, which is reminiscent of the regulatory function
                          of vertebrate Keap1 on Nrf2.
                      - source_id: file:genes/human/KEAP1/KEAP1-ai-review.yaml
                        title: human KEAP1 gene review
                        statement: >-
                          Core functions: ubiquitin-like ligase-substrate
                          adaptor activity (GO:1990756) of CUL3-RBX1-KEAP1 and
                          transcription regulator inhibitor activity on NRF2.
                  - id: cul3_scaffold
                    label: CUL3 cullin scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CUL3 (human)
                        term:
                          id: UniProtKB:Q13618
                          label: Cullin-3
                    function:
                      preferred_term: ubiquitin ligase complex scaffold activity
                      term:
                        id: GO:0160072
                        label: ubiquitin ligase complex scaffold activity
                    role_description: >-
                      Cullin scaffold that binds the KEAP1 BTB domain and RBX1.
                    evidence:
                      - source_id: PMID:15601839
                        statement: >-
                          Knocking down KEAP1 or CUL3 causes NRF2 accumulation.
                        supporting_text: >-
                          knocking down Keap1 or CUL3 by short interfering RNA
                          resulted in NRF2 protein accumulation in vivo
                      - source_id: file:genes/human/CUL3/CUL3-ai-review.yaml
                        title: human CUL3 gene review
                        statement: >-
                          Core function: ubiquitin ligase complex scaffold
                          activity (GO:0160072) with BTB substrate adaptors
                          including KEAP1.
    - order: 1
      role: inhibitory GSK-3 phosphorylation of the CNC factor
      node:
        id: gsk3_inhibition
        label: GSK-3 inhibitory phosphorylation of the CNC factor
        module_type: REGULATORY_STEP
        description: >-
          Without stress, GSK-3 phosphorylates the CNC factor and limits its
          nuclear activity. In C. elegans GSK-3 phosphorylation keeps SKN-1
          out of intestinal nuclei, and the GSK-3 sites are conserved in
          mammalian orthologs; even when GSK-3 inhibition is blocked, basal
          p38 signaling is still needed for SKN-1 function. In mammals GSK3B
          phosphorylates the NRF2 Neh6 domain, creating a degron for the
          beta-TrCP-CUL1 ligase (see notes), and PI3K/AKT inhibition of GSK3B
          relieves this.
        annotons:
          - id: gsk3_kinase
            label: GSK-3 serine/threonine kinase acting on the CNC factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GSK-3 kinases
                term:
                  id: PANTHER:PTHR24057
                  label: GLYCOGEN SYNTHASE KINASE-3 ALPHA
                representative_members:
