id: MODULE:bacterial_twin_arginine_translocation
title: Bacterial twin-arginine protein translocation
description: >-
  A species-neutral bacterial membrane-translocation module for export of
  folded, twin-arginine-signal-bearing proteins by the TatA, TatB, and TatC
  machinery. TatC and TatB form the substrate-receptor complex, after which
  TatA oligomerization supports proton-motive-force-dependent passage across
  the cytoplasmic membrane. Signal-peptide recognition, receptor assembly, and
  translocation are modeled as separate substantive roles.
status: DRAFT
evidence:
  - source_id: GO:0043953
    title: protein transport by the Tat complex
    statement: >-
      GO:0043953 defines the biological process shared by TatA-, TatB-, and
      TatC-family components.
  - source_id: GO:0033281
    title: TAT protein transport complex
    statement: >-
      GO:0033281 identifies the membrane complex formed by the Tat machinery.
  - source_id: PMID:23530902
    title: >-
      The type II secretion system (Xcp) of Pseudomonas putida is active and
      involved in the secretion of phosphatases.
    statement: >-
      Primary research in P. putida KT2440 identifies two Tat gene clusters
      and shows that both complete systems can support transport of UxpB.
      This supports paralogous module satisfiability without assigning a
      distinct substrate repertoire to either locus.
    supporting_text: Both Tat systems appeared to be capable of transporting the UxpB protein.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_twin_arginine_translocation__ppu03070-deep-research-openscientist.md
    title: >-
      OpenScientist module, pathway, and taxon review of bacterial
      twin-arginine translocation in Pseudomonas putida KT2440
    statement: >-
      The commissioned species-aware review found both PSEPK tatABC loci to
      satisfy the three reusable roles and identified their primary KEGG
      assignment as protein export (ppu03060), distinct from downstream Xcp
      type II secretion in ppu03070.
  - source_id: file:interpro/panther/panther-members.tsv
    title: Curated UniProt-to-PANTHER membership index
    statement: >-
      The local index verifies the E. coli K-12 and both PSEPK exemplars in
      PTHR30371:SF0 (TatC), PTHR33162:SF1 (TatB), and PTHR42982:SF1 (TatA).
notes: >-
  The reusable boundary starts with recognition of a folded Tat substrate and
  ends with membrane translocation. Cofactor loading and folding of individual
  substrates are upstream; signal-peptide cleavage and periplasmic destination
  functions are downstream. Some bacteria encode multiple complete tatABC
  loci; their physiological division of labor must not be assumed from sequence
  alone. In P. putida KT2440, PMID:23530902 shows that both complete systems
  can transport UxpB, but does not establish isolated-subunit activities or
  broader locus-specific substrate repertoires. The reusable architecture is
  modeled once here; copy number, operon-specific regulation, and concrete
  PSEPK satisfiability belong in the species batch rather than in this module.
