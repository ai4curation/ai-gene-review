id: MODULE:bacterial_twin_arginine_translocation
title: Bacterial twin-arginine protein translocation
description: A species-neutral bacterial membrane-translocation module for export of folded proteins bearing
  an N-terminal twin-arginine signal peptide by the Tat machinery. TatC and TatB form the substrate receptor
  that binds the signal peptide and the folded precursor; TatA is then recruited in a proton-motive-force-dependent
  manner and oligomerizes to carry out passage across the cytoplasmic membrane without ATP. Signal-peptide
  recognition, receptor organization and translocation are modeled as separate roles.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0043953
  title: protein transport by the Tat complex
  statement: GO:0043953 defines the biological process shared by TatA-, TatB-, and TatC-family components.
- source_id: GO:0033281
  title: TAT protein transport complex
  statement: GO:0033281 identifies the membrane complex formed by the Tat machinery.
- source_id: PMID:23530902
  title: The type II secretion system (Xcp) of Pseudomonas putida is active and involved in the secretion
    of phosphatases.
  statement: Primary research in P. putida KT2440 identifies two Tat gene clusters and shows that both
    complete systems can support transport of UxpB. This supports each complete system without assigning
    a distinct substrate repertoire to either locus.
  supporting_text: Both Tat systems appeared to be capable of transporting the UxpB protein.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_twin_arginine_translocation__ppu03070-deep-research-openscientist.md
  title: OpenScientist module, pathway, and taxon review of bacterial twin-arginine translocation in Pseudomonas
    putida KT2440
  statement: The commissioned species-aware review found both P. putida KT2440 tatABC loci to satisfy
    the three roles and identified their primary KEGG assignment as protein export (ppu03060), distinct
    from downstream Xcp type II secretion in ppu03070.
- source_id: https://data.pantherdb.org/ftp/sequence_classifications/19.0/PANTHER_Sequence_Classification_files/
  title: PANTHER 19.0 sequence classifications
  statement: PANTHER's release-pinned sequence classifications (the source of the member index that module
    validation builds) place the E. coli K-12 and both P. putida KT2440 exemplars in PTHR30371:SF0 (TatC),
    PTHR33162:SF1 (TatB) and PTHR42982:SF1 (TatA).
- source_id: PMID:11350936
  title: Functional reconstitution of bacterial Tat translocation in vitro.
  statement: In vitro reconstitution with E. coli inner-membrane vesicles shows that Tat translocation
    needs TatA, TatB and TatC together and the membrane potential, but not ATP.
  supporting_text: requires TatABC, an intact membrane potential and the twin-arginine targeting motif
- source_id: PMID:19666509
  title: Structural analysis of substrate binding by the TatBC component of the twin-arginine protein
    transport system.
  statement: Substrate binding to the TatBC receptor precedes TatA recruitment, the order modeled by this
    module.
  supporting_text: In Escherichia coli substrate proteins initially bind to the integral membrane TatBC
    complex which then recruits the protein TatA to effect translocation.
- source_id: PMID:29358647
  title: Unanticipated functional diversity among the TatA-type components of the Tat protein translocase.
  statement: Distinct, non-interchangeable roles of TatC (signal-peptide docking), TatB (receptor organization)
    and TatA (translocation) in E. coli.
  supporting_text: Despite their structural homology, TatA and TatB have distinct, non- interchangeable
    functions during Tat-dependent translocation.
notes: 'The boundary starts with recognition of a folded Tat substrate and ends with membrane translocation.
  Cofactor loading and folding of substrates are upstream; signal-peptide cleavage and periplasmic destination
  functions are downstream. The module is species-neutral: the TatA, TatB and TatC families are conserved
  across bacteria and plastids, with E. coli K-12 as the experimentally characterized exemplar and P.
  putida KT2440 (two complete tatABC loci) as a second Gram-negative instance. Firmicutes such as Bacillus
  subtilis use minimal TatAC systems in which a TatA paralog also provides the TatB role; the B. subtilis
  TatA paralogs fall in PTHR42982:SF1 but inherit IBA rows from the TatB-clade PAINT node PTN002109144
  (see the PTHR42982 family review). No B. subtilis exemplar is added because none has a gene review here.
  PTHR33162:SF1 also contains cyanobacterial and plastid TatA proteins, so the TatB receptor function
  is assigned to the TatB exemplars, not to the whole subfamily. GO describes the whole-transporter activity
  (GO:0009977) more readily than the separate TatA, TatB and TatC roles: the receptor annotons carry GO:0005048
  signal sequence receptor activity and the transporter activity sits on the assembled-complex annoton,
  as in the member gene reviews (which record TatB/TatC ''enables GO:0009977'' rows as a qualifier defect).
  In P. putida KT2440, PMID:23530902 shows that both complete systems can transport UxpB but does not
  establish locus-specific substrate repertoires.'
