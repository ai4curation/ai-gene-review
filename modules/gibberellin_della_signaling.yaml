id: MODULE:gibberellin_della_signaling
title: Gibberellin perception and DELLA derepression (GID1-DELLA-SCF(SLY1) module)
description: >-
  Gibberellin (GA) signaling in vascular plants works by de-repression. In the absence of GA, nuclear
  DELLA proteins (GRAS-family transcriptional regulators without a DNA-binding domain) restrain growth
  in part by binding and inactivating growth-promoting transcription factors such as the bHLH
  PHYTOCHROME-INTERACTING FACTORS (PIF3, PIF4). Bioactive GA (mainly GA4 and GA1) binds the soluble
  receptor GID1, a non-catalytic member of the hormone-sensitive-lipase alpha/beta-hydrolase family,
  in a deep pocket that is then capped by the receptor's N-terminal lid. The lid creates a surface
  that captures the N-terminal DELLA domain (DELLA, VHYNP and LExLE motifs), forming a GA-GID1-DELLA
  complex in which the DELLA GRAS domain is also contacted by the receptor. The DELLA GRAS domain in
  this complex is bound with higher affinity by the F-box protein SLEEPY1 (SLY1; GID2 in rice), the
  substrate adaptor of an SCF E3 ubiquitin ligase (SLY1-ASK1/ASK2-CUL1-RBX1). SCF(SLY1)
  polyubiquitinates the DELLA, which is then degraded by the 26S proteasome, releasing PIFs and other
  DELLA-sequestered regulators to drive growth programs such as hypocotyl and stem elongation, seed
  germination and floral development. GA-GID1 binding also inhibits DELLA activity without
  proteolysis, apparently by occluding DELLA surfaces needed for partner binding. In Arabidopsis the
  receptor step is carried out redundantly by GID1A, GID1B and GID1C, and the DELLA step by five
  paralogs (GAI and RGA, which dominate vegetative growth, and RGL1, RGL2 and RGL3, which act mainly in
  germination and flower development). Gibberellin biosynthesis and catabolism, which set the GA level,
  and transcriptional feedback of DELLAs on GA metabolism and receptor genes, are outside this module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0010476
    title: gibberellin mediated signaling pathway
    statement: The module is grounded in the GO biological process term for gibberellin-mediated signaling.
  - source_id: PMID:16709201
    title: Identification and characterization of Arabidopsis gibberellin receptors.
    statement: All three Arabidopsis GID1 proteins bind GA and interact with DELLAs only in the presence of GA.
    supporting_text: >-
      A two-hybrid yeast system only showed in vivo interaction in the presence of GA(4) between each AtGID1
      and the Arabidopsis DELLA proteins (AtDELLAs), negative regulators of GA signaling
  - source_id: PMID:19037309
    title: Gibberellin-induced DELLA recognition by the gibberellin receptor GID1.
    statement: Structural basis of GA perception and DELLA-domain capture by GID1A.
    supporting_text: >-
      GID1A occludes gibberellin in a deep binding pocket covered by its N-terminal helical switch region,
      which in turn interacts with the DELLA domain containing DELLA, VHYNP and LExLE motifs
  - source_id: PMID:17194763
    title: Genetic characterization and functional analysis of the GID1 gibberellin receptors in Arabidopsis.
    statement: GA-GID1 promotes the DELLA-SLY1 interaction that leads to DELLA degradation.
    supporting_text: >-
      the GA-GID1 complex promotes the interaction between RGA and the F-box protein SLY1
  - source_id: PMID:15161962
    title: The Arabidopsis mutant sleepy1gar2-1 protein promotes plant growth by increasing the affinity
      of the SCFSLY1 E3 ubiquitin ligase for DELLA protein substrates.
    statement: SLY1 is the substrate-specificity subunit of an SCF complex containing ASK1/2 and CUL1.
    supporting_text: >-
      SLY1 is a subunit of an Arabidopsis SCF SLY1 E3 ubiquitin ligase complex that contains the highly
      conserved ASK1/2 and AtCUL1 subunits
  - source_id: PMID:40768360
    title: Structural insights into proteolysis-dependent and -independent suppression of the master regulator
      DELLA by the gibberellin receptor.
    statement: Cryo-EM structures of GA3-GID1A-RGA and GA3-GID1A-RGA-SLY1-ASK1 explain SCF recruitment
      and proteolysis-independent DELLA inhibition.
    supporting_text: >-
      GID1 binding to the RGA GRAS domain blocks its interactions with INDETERMINATE DOMAIN (IDD)
      transcription factors
  - source_id: PMID:18216856
    title: Coordinated regulation of Arabidopsis thaliana development by light and gibberellins.
    statement: DELLAs sequester PIF3 from its target promoters; GA-triggered DELLA degradation releases PIF3.
    supporting_text: >-
      In the presence of GA, GID1 proteins (GA receptors) elevate their direct interaction with DELLA proteins
      in the nucleus, trigger DELLA protein's ubiquitination and proteasome-mediated degradation, and thus
      release PIF3 from the negative effect of DELLA proteins
  - source_id: PMID:18827182
    title: Proteolysis-independent downregulation of DELLA repression in Arabidopsis by the gibberellin
      receptor GIBBERELLIN INSENSITIVE DWARF1.
    statement: GA-GID1 can inhibit DELLA without SLY1-dependent proteolysis.
    supporting_text: >-
      GA-bound GID1 can block DELLA repressor activity by direct protein-protein interaction with the DELLA
      domain
  - source_id: PMID:17521411
    title: Multiple loss-of-function of Arabidopsis gibberellin receptor AtGID1s completely shuts down a
      gibberellin signal.
    statement: The three GID1 receptors are jointly required for all GA responses.
    supporting_text: >-
      the triple knockout seedlings completely lost their ability to respond to exogenously applied GA
notes: >-
  Arabidopsis proteins are used as representative members; the GID1-DELLA-SLY1/GID2 module is conserved
  in vascular plants (rice has single GID1 and GID2 genes). Family descriptors for GID1 and DELLA carry no
  PANTHER family id: the GID1 receptors sit in three separate subfamilies of PTHR23024 (named
  ARYLACETAMIDE DEACETYLASE, a mostly catalytic esterase family) and the DELLA PANTHER family PTHR31636
  has an uninformative name, so neither family id faithfully represents the role. PIF3 and PIF4 share
  PTHR46807. The SCF core subunits ASK1/ASK2, CUL1 and RBX1 are shared with many other SCF ligases and
  are described rather than modeled as separate annotons. RGL1, RGL2 and RGL3 are named in the
  description as context; GAI and RGA are the representative DELLAs. No production GO-CAM in
  gocams/index.tsv contains these Arabidopsis proteins (checked 2026-10-05). GO has no "gibberellin
  receptor activity" term; the receptor annoton uses gibberellin binding (GO:0010331), matching the
  GID1A/GID1B/GID1C reviews, which propose the missing term.
module:
  id: gibberellin_della_signaling
  label: Gibberellin perception and DELLA derepression
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: gibberellin mediated signaling pathway
      term:
        id: GO:0010476
        label: gibberellin mediated signaling pathway
      description: GA perception by GID1 and the resulting SCF(SLY1)-dependent and proteolysis-independent
        relief of DELLA repression.
  context:
    taxa:
      - preferred_term: vascular plants
        term:
          id: NCBITaxon:58023
          label: Tracheophyta
        description: Functional GID1-DELLA-SLY1/GID2 signaling is found in vascular plants; Arabidopsis
          thaliana provides the representative members.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: gibberellin perception
      node:
        id: ga_perception
        label: GA binding by GID1 receptors
        module_type: REGULATORY_STEP
        description: >-
          Bioactive GA binds the soluble GID1 receptor; closure of the N-terminal lid over the hormone
          creates the DELLA-binding surface. Arabidopsis has three partially redundant receptors that differ
          in expression and affinity (GID1B has the highest GA4 affinity; GID1C binds RGL2 weakly).
        annotons:
          - id: gid1_gibberellin_receptor
            label: GID1 gibberellin receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GID1 gibberellin receptor family (non-catalytic hormone-sensitive-lipase fold)
                representative_members:
                  - preferred_term: GID1A (Arabidopsis; major receptor)
                    term:
                      id: UniProtKB:Q9MAA7
                      label: Gibberellin receptor GID1A
                  - preferred_term: GID1B (Arabidopsis; high GA4 affinity, GID1b clade)
                    term:
                      id: UniProtKB:Q9LYC1
                      label: Gibberellin receptor GID1B
                  - preferred_term: GID1C (Arabidopsis; GID1ac clade with GID1A)
                    term:
                      id: UniProtKB:Q940G6
                      label: Gibberellin receptor GID1C
            function:
              preferred_term: gibberellin binding
              term:
                id: GO:0010331
                label: gibberellin binding
              evidence:
                - source_id: PMID:16709201
                  statement: Recombinant GID1A, GID1B and GID1C bind GA in vitro.
                  supporting_text: The GA-binding activities of the three recombinant proteins were confirmed
                    by an in vitro assay
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Binds bioactive GA and, as a result, captures the DELLA domain of DELLA proteins.
    - order: 2
      role: GA-GID1-DELLA complex formation
      node:
        id: della_recognition
        label: DELLA capture by GA-GID1
        module_type: REGULATORY_STEP
        description: >-
          The DELLA domain of a DELLA protein binds the lid of GA-bound GID1 and also bridges to the GRAS
          domain, which contacts GID1 directly. Complex formation both primes the DELLA for SCF(SLY1)
          recognition and blocks DELLA interaction with transcription-factor partners
          (proteolysis-independent inhibition).
        annotons:
          - id: della_receiver
            label: DELLA protein (GA-GID1 receiver and SCF substrate)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DELLA subfamily of GRAS transcriptional regulators
                representative_members:
                  - preferred_term: GAI (Arabidopsis)
                    term:
                      id: UniProtKB:Q9LQT8
                      label: DELLA protein GAI
                  - preferred_term: RGA (Arabidopsis)
                    term:
                      id: UniProtKB:Q9SLH3
                      label: DELLA protein RGA
            function:
              preferred_term: transcription coregulator activity
              term:
                id: GO:0003712
                label: transcription coregulator activity
              evidence:
                - source_id: PMID:19037309
                  statement: The DELLA domain is the GA-GID1 recognition element.
                  supporting_text: which in turn interacts with the DELLA domain containing DELLA, VHYNP and
                    LExLE motifs
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Nuclear transcriptional coregulator whose N-terminal DELLA domain is captured by GA-GID1; this
              converts the DELLA into a substrate for SCF(SLY1) and inhibits its coregulator function.
    - order: 3
      role: DELLA ubiquitination and proteasomal degradation
      node:
        id: della_degradation
        label: SCF(SLY1)-mediated DELLA ubiquitination and degradation
        module_type: REGULATORY_STEP
        description: >-
          The F-box protein SLY1 binds the GRAS domain of GID1-bound DELLA and, through ASK1/ASK2, CUL1 and
          RBX1, directs its polyubiquitination; the DELLA is then degraded by the 26S proteasome.
        annotons:
          - id: sly1_scf_substrate_adaptor
            label: SLY1 F-box substrate adaptor of SCF(SLY1)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SLY1 (SLEEPY1; Arabidopsis ortholog of rice GID2)
                term:
                  id: UniProtKB:Q9STX3
                  label: F-box protein GID2
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              evidence:
                - source_id: PMID:15161962
                  statement: SLY1 confers DELLA substrate specificity on SCF(SLY1).
                  supporting_text: SLY1 (the wild-type form) and sly1gar2-1 both confer substrate specificity
                    on this complex via specific binding to the DELLA proteins
            processes:
              - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0031146
                  label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Recruits GA-GID1-bound DELLA proteins to the SCF E3 ubiquitin ligase for
              polyubiquitination and proteasomal degradation.
    - order: 4
      role: release of DELLA-sequestered growth transcription factors
      node:
        id: pif_growth_output
        label: PIF-driven growth transcription
        module_type: REGULATORY_STEP
        description: >-
          DELLAs bind the DNA-binding bHLH domain of PIF3/PIF4 and prevent promoter binding. Removal or
          inhibition of DELLAs frees PIFs to activate growth-promoting genes, integrating GA with light and
          temperature signaling. PIFs are one representative class of DELLA-regulated transcription factors.
        annotons:
          - id: pif_transcription_factor
            label: PIF bHLH transcription factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PIF3/PIF4 bHLH transcription factors
                term:
                  id: PANTHER:PTHR46807
                  label: TRANSCRIPTION FACTOR PIF3
                representative_members:
                  - preferred_term: PIF3 (Arabidopsis)
                    term:
                      id: UniProtKB:O80536
                      label: Transcription factor PIF3
                  - preferred_term: PIF4 (Arabidopsis)
                    term:
                      id: UniProtKB:Q8W2F3
                      label: Transcription factor PIF4
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:18216856
                  statement: DELLAs block PIF3 binding to target promoters until GA triggers their degradation.
                  supporting_text: interact with phytochrome-interacting factor 3 (PIF3, a bHLH-type transcription
                    factor) and prevent PIF3 from binding to its target gene promoters
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Growth-promoting transcription factor whose DNA binding is inhibited by DELLA and
              restored when GA signaling removes DELLA.
  connections:
    - source: ga_perception
      target: della_recognition
      connection_type: CAUSES
      description: GA-bound GID1 captures the DELLA domain, forming the GA-GID1-DELLA complex.
    - source: della_recognition
      target: della_degradation
      connection_type: PROVIDES_INPUT_FOR
      description: The GID1-bound DELLA is the substrate recognized by SLY1 and ubiquitinated by SCF(SLY1).
    - source: della_degradation
      target: pif_growth_output
      connection_type: POSITIVELY_REGULATES
      description: Proteasomal removal of DELLA releases PIFs to bind promoters (derepression).
    - source: della_recognition
      target: pif_growth_output
      connection_type: POSITIVELY_REGULATES
      description: Proteolysis-independent route - GA-GID1 binding occludes DELLA surfaces needed for partner
        binding, relieving DELLA inhibition without degradation.
