  connections:
    - source: spt_step
      target: kdsr_step
      connection_type: PRECEDES
      description: 3-ketodihydrosphingosine from SPT is reduced by KDSR to sphinganine.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Palmitoyl-CoA is consumed by SPT; the intermediate passed on (3-ketosphinganine) is not a
        CoA ester.
    - source: kdsr_step
      target: cers_step
      connection_type: PRECEDES
      description: >-
        Sphinganine from KDSR (or phytosphingosine, after Sur2 hydroxylation in S. cerevisiae) is
        N-acylated by the ceramide synthases.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        The shared intermediate is a free sphingoid base. The acyl-CoA used by CerS comes from
        fatty-acid elongation, not from KDSR.
    - source: cers_step
      target: degs1_step
      connection_type: PRECEDES
      description: >-
        Dihydroceramide from the ceramide synthases is desaturated by DEGS1 to ceramide or
        C4-hydroxylated to phytoceramide.
      chaining_status: NOT_APPLICABLE
      chaining_note: Ceramide intermediates; CoA is released by CerS, not passed on.
    - source: degs1_step
      target: ceramide_acyl_2_hydroxylation_step
      connection_type: PRECEDES
      description: Phytoceramide is alpha-hydroxylated on its acyl chain by Scs7 (fungi).
      chaining_status: NOT_APPLICABLE
      chaining_note: Ceramide intermediates; no CoA carrier.
    - source: ceramide_acyl_2_hydroxylation_step
      target: fungal_ipc_head_group_extension
      connection_type: PRECEDES
      description: >-
        (Alpha-hydroxy) phytoceramide is transported to the Golgi and receives the
        inositol-phosphate head group. Scs7 hydroxylation is not required for IPC synthesis.
      chaining_status: NOT_APPLICABLE
      chaining_note: Ceramide intermediates; no CoA carrier.
  notes: >-
    The module was generalized from a human-only ceramide module to a eukaryotic ceramide core with
    a fungal head-group extension. The human groundings are kept unchanged: the SPT complex (SPTLC1
    O15269 + SPTLC2 O15270, GO:0004758, EC 2.3.1.50; small subunit SPTSSA Q969W0; complex
    GO:0017059), KDSR (Q06136, GO:0047560, EC 1.1.1.102), the ceramide synthases CERS1 (P27544),
    CERS2 (Q96G23) and CERS3 (Q8IU89) (all GO:0050291, EC 2.3.1.24) and DEGS1 (O15121, GO:0042284,
    EC 1.14.19.17). Two steps were restructured into variant sets because fungi and animals use
    different protein architectures: the SPT small subunit (non-homologous ssSPT vs Tsc3) and the
    ceramide synthase (single-subunit CERS vs the Lag1/Lac1-Lip1 complex). The DEGS1 step became
    the C4-modification node with desaturation (DEGS family) and C4-hydroxylation (Sur2,
    sterol-desaturase superfamily) variants. Its id degs1_step was kept for continuity. PANTHER
    membership was checked in the PANTHER 19.0 classification files: LCB1/lcb1 and LCB2/lcb2 are in
    PTHR13693 (SF2/SF3) with SPTLC1/SPTLC2; TSC10 and SPCC1450.15 are in PTHR43550:SF3 with KDSR;
    LAG1, LAC1, lag1 and lac1 are in PTHR12560; dsd1 is in PTHR12879 with DEGS1; SUR2/sur2 are in
    PTHR11863; SCS7/scs7 share PTHR12863:SF1 with human FA2H; AUR1/aur1 and IPT1 are in PTHR31310
    (SF11 and SF8); KEI1/kei1 are in PTHR28077; and SUR1, CSH1 and imt1-3 are in PTHR32385. TSC3
    and CSG2 have no PANTHER classification. Out of scope: the long-chain-base kinase / phosphatase /
    lyase branch (LCB4/LCB5, LCB3/YSR3, DPL1) and the ceramidases (YPC1/YDC1), which belong to
    sphingoid-base turnover (see sphingosine_1_phosphate_rheostat); ORM/ORMDL feedback regulators
    of SPT; VLCFA elongation, which supplies the acyl-CoA; ceramide transport to the Golgi; and
    animal sphingomyelin and glycosphingolipid synthesis (sphingomyelin_cycle and
    glycosphingolipid_biosynthesis modules). Substrate palmitoyl-CoA comes from fatty-acid
    synthesis.
