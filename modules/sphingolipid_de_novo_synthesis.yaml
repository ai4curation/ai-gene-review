                  - preferred_term: LCB2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P40970
                      label: Serine palmitoyltransferase 2
                  - preferred_term: lcb2 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q09925
                      label: Serine palmitoyltransferase 2
            function:
