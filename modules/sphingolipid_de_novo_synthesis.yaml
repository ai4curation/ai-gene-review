id: MODULE:sphingolipid_de_novo_synthesis
title: De novo sphingolipid biosynthesis (ceramide core, with fungal inositol-phosphorylceramide head groups)
description: >-
  De novo sphingolipid synthesis builds ceramide, the hydrophobic backbone of all complex
  sphingolipids, from serine and fatty acyl-CoA on the endoplasmic-reticulum membrane. The
  committed, rate-limiting first step is catalysed by serine palmitoyltransferase (SPT), a
  pyridoxal-5'-phosphate-dependent membrane complex built on a heterodimer of two homologous
  subunits (SPTLC1/LCB1 and SPTLC2/LCB2). A small, lineage-specific activating subunit is also
  required: SPTSSA/B in animals, which sets acyl-CoA specificity, and the unrelated Tsc3 in fungi.
  SPT condenses L-serine with palmitoyl-CoA to 3-ketodihydrosphingosine.
  3-ketodihydrosphingosine reductase (KDSR, yeast Tsc10) then reduces this, using NADPH, to
  dihydrosphingosine (sphinganine). Ceramide synthases of the TLC/Lag1 family N-acylate the
  sphingoid base with a fatty acyl-CoA. Each animal isoform prefers a different acyl chain length:
  CERS1 makes C18 ceramide (brain/muscle), CERS2 very-long-chain C22-C24 ceramide (broadly
  expressed), and CERS3 ultra-long-chain C26+ (acyl)ceramides for the skin barrier. Fungal Lag1
  and Lac1 act with the accessory subunit Lip1 and use C26-CoA. The sphingoid base is then modified
  at C4 by one of two related di-iron enzymes. The dihydroceramide desaturase DEGS1 introduces the
  4,5-trans double bond, an O2- and iron-dependent oxidation that converts dihydroceramide to
  ceramide; this is the predominant route in animals. The sphingoid-base C4-hydroxylase (yeast Sur2)
  instead converts sphinganine or dihydroceramide to the phyto (4-hydroxy) form, which is the
  predominant route in fungi and plants. Fungal ceramides are also hydroxylated at C2 of the very
  long acyl chain (Scs7). Fungi then build their characteristic complex sphingolipids in the
  Golgi. The Aur1-Kei1 inositol phosphorylceramide (IPC) synthase transfers inositol phosphate
  from phosphatidylinositol to ceramide. IPC is mannosylated by Csg1/Csh1-Csg2 complexes to MIPC,
  and in budding yeast Ipt1 adds a second inositol phosphate to make M(IP)2C. Animals instead make
  sphingomyelin and glycosphingolipids, which are covered by separate modules. Inherited defects of
  the human ceramide core include HSAN1 (SPTLC1/SPTLC2), spastic paraplegia (SPTSSA),
  erythrokeratodermia/thrombocytopenia (KDSR), progressive myoclonic epilepsy 8 (CERS1),
  congenital ichthyosis ARCI9 (CERS3) and hypomyelinating leukodystrophy 18 (DEGS1). The fungal IPC
  synthase is the target of the antifungal aureobasidin A.
status: DRAFT
evidence:
  - source_id: GO:0030148
    title: sphingolipid biosynthetic process
    statement: >-
      The module is grounded in sphingolipid biosynthetic process (GO:0030148). It covers de
      novo synthesis of ceramide from serine and acyl-CoA, plus the fungal inositol-phosphate
      head groups.
  - source_id: GO:0046513
    title: ceramide biosynthetic process
    statement: The ceramide core produces ceramide (ceramide biosynthetic process, GO:0046513).
  - source_id: GO:0051999
    title: mannosyl-inositol phosphorylceramide biosynthetic process
    statement: The fungal head-group extension ends in MIPC (and M(IP)2C in budding yeast).
  - source_id: Reactome:R-HSA-1660661
    title: Sphingolipid de novo biosynthesis
    statement: >-
      Step order and intermediates follow the human Reactome "Sphingolipid de novo biosynthesis"
      pathway (reactions R-HSA-428127 SPT, R-HSA-428123 KDSR, R-HSA-428185 CerS, R-HSA-428259 DEGS1).
  - source_id: YeastPathways:SPHINGOLIPID-SYN-PWY-1
    title: sphingolipid biosynthesis (yeast) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists SPT (LCB1, LCB2), TSC10, SUR2 C4-hydroxylation of sphinganine, CerS (LAG1,
      LAC1, LIP1), SCS7 alpha-hydroxylation, AUR1 IPC synthase, the MIPC mannosyltransferase
      (SUR1/CSG1, CSG2) and IPT1. These were all retained. Added: the SPT small subunit TSC3
      (PMID:10713067), the essential IPC-synthase subunit KEI1 (PMID:19726565) and the redundant MIPC
      synthase CSH1 (PMID:12954640). Excluded as the long-chain-base phosphate / degradation branch:
      LCB4/LCB5 kinases, LCB3/YSR3 phosphatases, the DPL1 aldolase and the YPC1/YDC1 ceramidases.
      Compartments were corrected from cytosol to ER membrane for the ceramide core and Golgi
      membrane for the head-group enzymes.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=SPHINGOLIPID-SYN-PWY-1
  - source_id: file:human/SPTLC1/SPTLC1-ai-review.yaml
    title: SPTLC1 gene review (human)
    statement: >-
      The SPT catalytic-subunit step (UniProtKB:O15269, GO:0004758) matches the completed human SPTLC1 review.
  - source_id: file:human/SPTLC2/SPTLC2-ai-review.yaml
    title: SPTLC2 gene review (human)
    statement: >-
      The SPT PLP-binding catalytic-subunit step (UniProtKB:O15270, GO:0004758) matches the completed
      human SPTLC2 review.
  - source_id: file:human/SPTSSA/SPTSSA-ai-review.yaml
    title: SPTSSA gene review (human)
    statement: >-
      The SPT small regulatory subunit (UniProtKB:Q969W0, SPT complex GO:0017059) matches the
      completed human SPTSSA review.
  - source_id: file:human/KDSR/KDSR-ai-review.yaml
    title: KDSR gene review (human)
    statement: >-
      The 3-ketodihydrosphingosine reductase step (UniProtKB:Q06136, GO:0047560) matches the
      completed human KDSR review.
  - source_id: file:human/CERS1/CERS1-ai-review.yaml
    title: CERS1 gene review (human)
    statement: >-
      The C18-specific ceramide-synthase step (UniProtKB:P27544, GO:0050291) matches the completed
      human CERS1 review.
  - source_id: file:human/CERS2/CERS2-ai-review.yaml
    title: CERS2 gene review (human)
    statement: >-
      The very-long-chain ceramide-synthase step (UniProtKB:Q96G23, GO:0050291) matches the
      completed human CERS2 review.
  - source_id: file:human/CERS3/CERS3-ai-review.yaml
    title: CERS3 gene review (human)
    statement: >-
      The ultra-long-chain ceramide-synthase step (UniProtKB:Q8IU89, GO:0050291) matches the
      completed human CERS3 review.
  - source_id: file:human/DEGS1/DEGS1-ai-review.yaml
    title: DEGS1 gene review (human)
    statement: >-
      The dihydroceramide-desaturase step (UniProtKB:O15121, GO:0042284) matches the completed
      human DEGS1 review.
  - source_id: PMID:8058731
    title: >-
      The LCB2 gene of Saccharomyces and the related LCB1 gene encode subunits of serine
      palmitoyltransferase, the initial enzyme in sphingolipid synthesis.
    statement: >-
      Overproducing SPT in S. cerevisiae requires both LCB1 and LCB2, which encode related
      subunits of the enzyme.
  - source_id: PMID:10713067
    title: >-
      Tsc3p is an 80-amino acid protein associated with serine palmitoyltransferase and required
      for optimal enzyme activity.
    statement: >-
      The 80-residue membrane protein Tsc3p co-immunoprecipitates with Lcb1p/Lcb2p. tsc3 cells have
      severely reduced SPT activity.
  - source_id: PMID:19416851
    title: >-
      Identification of small subunits of mammalian serine palmitoyltransferase that confer
      distinct acyl-CoA substrate specificities.
    statement: >-
      Mammalian ssSPTa/ssSPTb share no homology with yeast Tsc3p but likewise enhance SPT activity,
      so the activating small subunit is analogous, not orthologous, between fungi and animals.
  - source_id: PMID:9804843
    title: >-
      The Saccharomyces cerevisiae TSC10/YBR265w gene encoding 3-ketosphinganine reductase is
      identified in a screen for temperature-sensitive suppressors of the Ca2+-sensitive csg2Delta
      mutant.
    statement: >-
      Recombinant Tsc10p, a short-chain dehydrogenase/reductase, is necessary and sufficient for
      NADPH-dependent reduction of 3-ketosphinganine to dihydrosphingosine.
  - source_id: PMID:11387200
    title: C26-CoA-dependent ceramide synthesis of Saccharomyces cerevisiae is operated by Lag1p and Lac1p.
    statement: >-
      lag1 lac1 microsomes lack the activity that transfers C26 fatty acids from C26-CoA onto
      dihydrosphingosine or phytosphingosine.
  - source_id: PMID:15692566
    title: 'Lip1p: a novel subunit of acyl-CoA ceramide synthase.'
    statement: >-
      Purified Lac1p and Lag1p copurify with ceramide synthase activity together with Lip1p, a
      single-span ER membrane subunit required for ceramide synthesis in vivo and in vitro.
  - source_id: PMID:9368039
    title: Hydroxylation of Saccharomyces cerevisiae ceramides requires Sur2p and Scs7p.
    statement: >-
      Sur2p is required for C4-hydroxylation of the sphingoid base and Scs7p for hydroxylation of
      the very-long-chain fatty acid. Neither is essential, and M(IP)2C is still made without them.
  - source_id: PMID:15063729
    title: >-
      Identification of the human sphingolipid C4-hydroxylase, hDES2, and its up-regulation during
      keratinocyte differentiation.
    statement: >-
      Human DES2 (DEGS2), a member of the DEGS family, is a dihydroceramide C4-hydroxylase, which
      shows that phyto-ceramide synthesis also occurs in mammalian tissues.
  - source_id: PMID:9092515
    title: >-
      Sphingolipid synthesis as a target for antifungal drugs. Complementation of the inositol
      phosphorylceramide synthase defect in a mutant strain of Saccharomyces cerevisiae by the AUR1
      gene.
    statement: >-
      AUR1 complements the IPC synthase defect and restores enzyme activity. Aureobasidin A
      inhibits IPC synthase with an IC50 of about 0.2 nM.
  - source_id: PMID:19726565
    title: >-
      Kei1: a novel subunit of inositolphosphorylceramide synthase, essential for its enzyme
      activity and Golgi localization.
    statement: >-
      Kei1 forms a complex with Aur1 in the medial Golgi and is essential for both IPC synthase
      activity and Golgi localization.
  - source_id: PMID:12954640
    title: Csg1p and newly identified Csh1p function in mannosylinositol phosphorylceramide synthesis by interacting with Csg2p.
    statement: >-
      Csg1p and Csh1p are redundant IPC mannosyltransferases, each in a complex with the
      regulatory Csg2p.
  - source_id: PMID:9368028
    title: >-
      Synthesis of mannose-(inositol-P)2-ceramide, the major sphingolipid in Saccharomyces
      cerevisiae, requires the IPT1 (YDR072c) gene.
    statement: >-
      IPT1, an AUR1 homolog, is required for M(IP)2C synthase activity. ipt1 deletion strains
      accumulate MIPC.
  - source_id: PMID:20388730
    title: >-
      Mannosylinositol phosphorylceramide is a major sphingolipid component and is required for
      proper localization of plasma-membrane proteins in Schizosaccharomyces pombe.
    statement: >-
      S. pombe has no Ipt1 equivalent, and MIPC is its terminal complex sphingolipid. The three
      SUR1 homologs imt1, imt2 and imt3 are jointly required for MIPC synthesis and localize to
      the Golgi.
module:
  id: sphingolipid_de_novo_synthesis
  label: De novo sphingolipid biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: sphingolipid biosynthetic process
      term:
        id: GO:0030148
        label: sphingolipid biosynthetic process
      description: >-
        De novo synthesis of ceramide from serine and fatty acyl-CoA on the ER membrane, and in
        fungi its conversion to inositol-phosphorylceramides in the Golgi.
    - preferred_term: ceramide biosynthetic process
      term:
        id: GO:0046513
        label: ceramide biosynthetic process
      description: Formation of ceramide, the backbone of complex sphingolipids.
  context:
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: >-
          The ceramide-core steps (parts 1-5) occur on the endoplasmic-reticulum membrane. The fungal
          head-group extension (part 6) is in the Golgi and carries its own location.
  gocam_associations:
    - model: gomodel:YeastPathways_SPHINGOLIPID-SYN-PWY-1
      title: 'sphingolipid biosynthesis (yeast) - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae. All activities are placed in the cytosol,
        and the only causal edge is CerS -> ceramidase. SCS7 is typed GO:0102772 (sphingolipid
        C4-monooxygenase), the SUR2 reaction, instead of fatty-acyl 2-hydroxylation. IPT1 is typed
        only with the generic GO:0016772, and KEI1, TSC3 and CSH1 are absent. The model also
        includes the LCB-kinase, LCB-phosphatase, DPL1 and ceramidase reactions, which this module
        excludes.
    - model: gomodel:67086be200002266
      title: sphingolipid biosynthetic process (GO:0030148)
      description: >-
        PomBase S. pombe model. It has the SPT complex (lcb1, lcb2, tsc3 and the ORM regulators),
        SPCC1450.15 KDSR, lag1/lac1 CerS, sur2 (as both delta-4 desaturase and C4-monooxygenase),
        dsd1 delta-4 desaturase, scs7, aur1-kei1 and the imt1/imt2/imt3 MIPC mannosyltransferases,
        with ER and Golgi locations. It also contains VLCFA elongation (tsc13, acb1), ceramide
        transfer (svf1, svf2), sgp1, lcb4, css1 and a scramblase, which are outside this module. It
        types scs7 as GO:0102772 and adds pvg2 as a mannosyltransferase; this module does not adopt
        either.
  parts:
    - order: 1
      role: committed step (serine + palmitoyl-CoA condensation)
      node:
        id: spt_step
        label: L-serine + palmitoyl-CoA to 3-ketodihydrosphingosine
        module_type: PROTEIN_COMPLEX
        description: >-
          The SPT heterodimer of two homologous large subunits is conserved across eukaryotes. A
          small activating subunit is required in both animals and fungi, but the two lineages use
          unrelated proteins for it, so it is modelled as a variant set.
        annotons:
          - id: sptlc1_activity
            label: "SPTLC1/LCB1: serine palmitoyltransferase subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Serine palmitoyltransferase subunit 1 subfamily (SPTLC1/LCB1)
                term:
                  id: PANTHER:PTHR13693:SF2
                  label: SERINE PALMITOYLTRANSFERASE 1
                representative_members:
                  - preferred_term: SPTLC1 (human)
                    term:
                      id: UniProtKB:O15269
                      label: Serine palmitoyltransferase 1
                  - preferred_term: LCB1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P25045
                      label: Serine palmitoyltransferase 1
                  - preferred_term: lcb1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O59682
                      label: Serine palmitoyltransferase 1
            function:
              preferred_term: serine C-palmitoyltransferase activity
              term:
                id: GO:0004758
                label: serine C-palmitoyltransferase activity
              substrates:
                - preferred_term: L-serine
                - preferred_term: palmitoyl-CoA
              products:
                - preferred_term: 3-ketodihydrosphingosine (3-ketosphinganine)
                - preferred_term: CoA
                - preferred_term: CO2
              evidence:
                - source_id: EC:2.3.1.50
                  statement: serine palmitoyltransferase (PLP-dependent); committed, rate-limiting first step; SPTLC1 forms the catalytic heterodimer with SPTLC2
                - source_id: Reactome:R-HSA-428127
                  statement: "SPTLC complexes transfer acyl-CoA onto serine (human Reactome reaction)"
                - source_id: PMID:8058731
                  statement: S. cerevisiae LCB1 and LCB2 encode related subunits of SPT.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            gocam_associations:
              - model: gomodel:YeastPathways_SPHINGOLIPID-SYN-PWY-1
                activity: gomodel:SERINE-C-PALMITOYLTRANSFERASE-RXN
                title: 'sphingolipid biosynthesis (yeast) - imported from: Saccharomyces Genome Database'
                description: LCB1 and LCB2 each enable GO:0004758 (shown as cytosolic).
              - model: gomodel:67086be200002266
                activity: gomodel:67086be200002266/67c10cc400002302
                title: sphingolipid biosynthetic process (GO:0030148)
                description: >-
                  The SPT complex (GO:0017059) with lcb1, lcb2, tsc3, orm1 and the sac11/sac12
                  ORM-family subunits enables GO:0004758 in the ER.
            role_description: Catalytic subunit of SPT; deficiency = HSAN1 (toxic 1-deoxysphingolipids).
          - id: sptlc2_activity
