id: MODULE:low_molecular_mass_pbp_peptidoglycan_hydrolysis
title: Low-molecular-mass PBP peptidoglycan hydrolysis
description: >-
  A reusable bacterial module for two distinct hydrolytic reactions performed
  by low-molecular-mass penicillin-binding proteins during peptidoglycan
  maturation. D,D-carboxypeptidases trim terminal D-alanine from uncrosslinked
  pentapeptide stems, whereas D,D-endopeptidases cleave D-Ala-mDAP 4-3
  crosslinks between stems. Individual enzymes may catalyze one or both
  reactions; neither reaction represents protein proteolysis or crosslink
  formation.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:27716106
  title: In vivo functional and molecular characterization of the Penicillin-Binding Protein 4 (DacB) of Pseudomonas aeruginosa.
  statement: >-
    Pseudomonas aeruginosa DacB/PBP4 catalyzes both reactions, with
    D,D-endopeptidase activity predominant.
  supporting_text: >-
    LMM-PBP4 of Pseudomonas aeruginosa is a bifunctional enzyme presenting
    both D,D-carboxypeptidase and D,D-endopeptidase activities; the
    D,D-endopeptidase function is predominant.
- source_id: PMID:2046551
  title: 'Penicillin-binding protein 4 of Escherichia coli: molecular cloning of the dacB gene, controlled overexpression, and alterations in murein composition.'
  statement: >-
    Escherichia coli PBP4 is a D,D-carboxypeptidase and D,D-endopeptidase and is
    not a transpeptidase.
  supporting_text: >-
    PBP4 is not involved in transpeptidation but exclusively catalyses a
    DD-carboxypeptidase and DD-endopeptidase reaction.
- source_id: PMID:25495032
  title: Catalytic spectrum of the penicillin-binding protein 4 of Pseudomonas aeruginosa, a nexus for the induction of β-lactam antibiotic resistance.
  statement: >-
    Purified Pseudomonas aeruginosa PBP4 hydrolyses both pentapeptide stems and
    4,3-crosslinks, but not 3,3-crosslinks.
  supporting_text: >-
    PBP4 also has 4,3-endopeptidase activity but not 3,3-endopeptidase
    activity.
- source_id: PMID:7925376
  title: Penicillin-binding protein 7/8 of Escherichia coli is a DD-endopeptidase.
  statement: >-
    Escherichia coli PBP7 is a periplasmic D,D-endopeptidase acting on
    crosslinks in intact sacculi.
  supporting_text: >-
    Murein meso-diaminopimelate-D-alanine DD-endopeptidase activity was
    demonstrated for both PBP7 and PBP8, which specifically hydrolyse the
    DD-diaminopimelate-alanine bonds in high-molecular-mass murein sacculi
- source_id: PMID:8063800
  title: Specific interaction of penicillin-binding proteins 3 and 7/8 with soluble lytic transglycosylase in Escherichia coli.
  statement: >-
    Escherichia coli PBP7/8 binds and stimulates the lytic transglycosylase
    Slt70, suggesting that PBP7 acts within a multi-enzyme hydrolase complex.
  supporting_text: >-
    PBP7/8 was found not only to stabilize but also to stimulate the enzymatic
    activity of Slt70 by a protein-protein interaction.
