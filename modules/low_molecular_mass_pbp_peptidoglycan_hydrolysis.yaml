notes: >-
  The parts have equal order because stem trimming and crosslink hydrolysis are
  parallel remodeling reactions, not a compulsory linear sequence. DacB/PBP4
  is intentionally represented in both parts because direct Pseudomonas
  experiments establish both activities. PbpG/PBP7 is represented only in the
  endopeptidase variant. GO:0009002 is not used as a proxy for crosslink
  hydrolysis because it names D,D-carboxypeptidase activity; GO:0061785 is
  used for the distinct peptidoglycan endopeptidase reaction.
