notes: >-
  The parts have equal order because stem trimming and crosslink hydrolysis are
  parallel remodeling reactions, not a compulsory linear sequence. DacB/PBP4
  is intentionally represented in both parts because direct experiments on the
  Escherichia coli and Pseudomonas aeruginosa enzymes establish both activities.
  PbpG/PBP7 is represented only in the endopeptidase variant. GO:0009002 is not
  used as a proxy for crosslink hydrolysis because it names D,D-carboxypeptidase
  activity; GO:0061785 is used for the distinct peptidoglycan endopeptidase
  reaction. Scope: the module is species-neutral across Bacteria; exemplars are
  E. coli K-12 (the experimentally defining PBP4 and PBP7), P. aeruginosa PAO1
  (direct PBP4 enzymology) and P. putida KT2440 (orthologs grounded by PANTHER
  subfamily). Family groundings: PANTHER:PTHR30023:SF0 (the only subfamily of the
  S13 PBP4 family) and PANTHER:PTHR21581:SF26 (the PBP7 endopeptidase subfamily
  of the heterogeneous S11 family); both families have reviews under
  interpro/panther/. The PTHR30023 review leaves GO:0061785 UNRESOLVED at family
  level, because endopeptidase activity is shown only for the Gram-negative PBP4
  enzymes and the family also contains Dictyostelium PscA, which has no
  peptidoglycan substrate; the resulting FAMILY_FUNCTION_UNREVIEWED warning on
  the DacB endopeptidase annoton is expected and is satisfied at member level by
  the three reviewed PBP4 exemplars. For the same reason (PscA's substrate is
  unknown and no PANTHER subfamily isolates the bacterial clade) the review
  leaves GO:0009002 UNRESOLVED at family level, giving the matching expected
  warning on the DacB carboxypeptidase annoton; the GO:0009002 activity of the
  three exemplars rests on their own gene reviews. Stem trimming is modelled as a
  variant set (selection ONE_OR_MORE) so that further carboxypeptidase families
  can be added as variants. The S11 DacA/PBP5-type D,D-carboxypeptidases are the
  principal stem trimmers in E. coli but are not yet modelled here; the
  KT2440 dacA review is being curated with the peptidoglycan polymerization
  module and E. coli dacA has no review yet. No module deep-research report was
  generated (no provider credentials available). Follow-up: the gene reviews
  record the InterPro2GO mapping of IPR000667, IPR001967 and IPR018044 to
  GO:0006508 proteolysis as source defects; a matching removal row in
  projects/INTERPRO/interpro2go.sssom.yaml still needs the README's sole-source
  and rule-cover checks and is left for a separate change.
