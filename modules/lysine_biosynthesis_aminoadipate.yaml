      role: committed step (homocitrate synthase)
      node:
        id: homocitrate_synthase_step
        label: 2-oxoglutarate + acetyl-CoA to homocitrate
        module_type: REACTION
        annotons:
          - id: homocitrate_synthase_activity
            label: Homocitrate synthase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: homocitrate synthase activity
                term:
                  id: GO:0004410
                  label: homocitrate synthase activity
              family:
                preferred_term: homocitrate synthase subfamily (DRE-TIM metallolyase)
                term:
                  id: PANTHER:PTHR10277:SF48
                  label: HOMOCITRATE SYNTHASE, CYTOSOLIC ISOZYME-RELATED
                representative_members:
                  - preferred_term: LYS20 (S. cerevisiae)
                    term:
                      id: UniProtKB:P48570
                      label: Homocitrate synthase, cytosolic isozyme
                    description: Major flux-controlling isoform (PMID:21895798).
                  - preferred_term: LYS21 (S. cerevisiae)
