                      id: UniProtKB:Q9Y823
                      label: Homocitrate synthase, mitochondrial
                  - preferred_term: lys20 (Thermus thermophilus HB27)
                    term:
                      id: UniProtKB:O87198
                      label: Homocitrate synthase
                    description: Prokaryotic HCS of the LysW-type pathway (PMID:12095615).
            function:
              preferred_term: homocitrate synthase activity
              term:
                id: GO:0004410
                label: homocitrate synthase activity
              substrates:
                - preferred_term: 2-oxoglutarate
                - preferred_term: acetyl-CoA
                - preferred_term: water
              products:
                - preferred_term: (2R)-homocitrate
