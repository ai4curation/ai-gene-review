id: MODULE:lysine_biosynthesis_aminoadipate
title: L-lysine biosynthesis via alpha-aminoadipate
description: >-
  De novo biosynthesis of L-lysine from 2-oxoglutarate and acetyl-CoA through
  the C6 intermediate L-2-aminoadipate (alpha-aminoadipate, AAA). This route is
  chemically unrelated to the diaminopimelate pathway of most bacteria and
  plants. Its first half extends the carbon chain by one methylene unit through
  reactions homologous to the citrate-to-2-oxoglutarate segment of the
  tricarboxylic acid cycle and to leucine biosynthesis: homocitrate synthase
  condenses acetyl-CoA with 2-oxoglutarate, homocitrate is isomerised to
  homoisocitrate in two aconitase-family steps (homocitrate dehydration to
  cis-homoaconitate, then hydration to homoisocitrate), homoisocitrate
  dehydrogenase oxidatively decarboxylates homoisocitrate to 2-oxoadipate, and
  a transaminase produces L-2-aminoadipate. The second half diverges by
  lineage. In fungi, a large phosphopantetheinylated alpha-aminoadipate
  reductase reduces AAA to its 6-semialdehyde, which is reductively condensed
  with L-glutamate to saccharopine and then cleaved to L-lysine and
  2-oxoglutarate. In Thermus and in Sulfolobus and other archaea, AAA is instead
  ligated to the C-terminal glutamate of the small carrier protein LysW and
  converted to lysine by ArgB/C/D-like enzymes before a hydrolase releases free
  lysine. In fungi the early steps are split between compartments, with
  homocitrate isomerisation and homoisocitrate oxidation in the mitochondrial
  matrix and the final steps in the cytosol and peroxisome.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:LYSINE-AMINOAD-PWY-2
    title: L-lysine biosynthesis IV
    statement: >-
      Source pathway for the S. cerevisiae realisation (eight reactions,
      catalysts LYS20, LYS21, LYS4, LYS12, LYS2, LYS9, LYS1). The pathway
      gene list omits ACO2 (homocitrate dehydratase), ARO8 (2-aminoadipate
      transaminase, present only in the GO-CAM conversion) and LYS5 (the
      phosphopantetheinyl transferase that activates LYS2), and assigns the
      homocitrate dehydration reaction to LYS4.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=LYSINE-AMINOAD-PWY-2
  - source_id: GO:0009085
    title: L-lysine biosynthetic process
    statement: >-
      Module-level process. The route-specific child terms (GO:0019878,
      GO:0051975, GO:0051976) are obsolete, so the generic L-lysine
      biosynthesis term is the most specific current BP term.
  - source_id: PMID:23106124
    title: >-
      The fungal α-aminoadipate pathway for lysine biosynthesis requires two
      enzymes of the aconitase family for the isomerization of homocitrate to
      homoisocitrate.
    statement: >-
      Establishes that homocitrate dehydration is catalysed by an aconitase
      (yeast Aco2p; also a Thermus thermophilus aconitase) while homoaconitase
      (Lys4p) only interconverts cis-homoaconitate and homoisocitrate.
    supporting_text: >-
      these enzymes only catalysed the interconversion between homoaconitate
      and homoisocitrate. In contrast, aconitases from fungi and the
      thermophilic bacterium Thermus thermophilus converted homocitrate to
      homoaconitate
  - source_id: PMID:16943623
    title: The alpha-aminoadipate pathway for lysine biosynthesis in fungi.
    statement: Review of the enzymology of the fungal AAA pathway.
    supporting_text: >-
      This review provides a description of the biochemistry and enzymology of
      the alpha-aminoadipate pathway for lysine biosynthesis in fungi.
  - source_id: PMID:21895798
    title: >-
      The Lys20 homocitrate synthase isoform exerts most of the flux control
      over the lysine synthesis pathway in Saccharomyces cerevisiae.
    statement: Lys20 and Lys21 are the two homocitrate synthase isoforms catalysing the committed step.
    supporting_text: >-
      the first committed step in the lysine (Lys) biosynthetic pathway is
      catalysed by the Lys20 and Lys21 homocitrate synthase (HCS) isoforms
  - source_id: PMID:10103047
    title: >-
      In Saccharomyces cerevisae, feedback inhibition of homocitrate synthase
      isoenzymes by lysine modulates the activation of LYS gene expression by
      Lys14p.
    statement: Lysine feedback inhibition of homocitrate synthase (regulatory context; cited by YeastCyc).
  - source_id: PMID:9099739
    title: Homocitrate synthase is located in the nucleus in the yeast Saccharomyces cerevisiae.
    statement: Lys20/Lys21 localise to the nucleus in S. cerevisiae.
    supporting_text: Cell fractionation studies localize the 47- and 49-kDa proteins to the nucleus.
  - source_id: PMID:11013234
    title: >-
      Identification in Saccharomyces cerevisiae of two isoforms of a novel
      mitochondrial transporter for 2-oxoadipate and 2-oxoglutarate.
    statement: Odc1p/Odc2p export 2-oxoadipate from the mitochondrial matrix for cytosolic lysine synthesis.
    supporting_text: >-
      The main physiological roles of Odc1p and Odc2p are probably to supply
      2-oxoadipate and 2-oxoglutarate from the mitochondrial matrix to the
      cytosol where they are used in the biosynthesis of lysine and glutamate
  - source_id: PMID:9491083
    title: >-
      Characterisation of Saccharomyces cerevisiae ARO8 and ARO9 genes encoding
      aromatic aminotransferases I and II reveals a new aminotransferase
      subfamily.
    statement: Aro8p belongs to an aminotransferase subfamily specialised for aromatic amino acid and alpha-aminoadipate transamination.
    supporting_text: >-
      constitute within the subgroup a new subfamily of enzymes specialised
      for aromatic amino acid and alpha-aminoadipate transamination
  - source_id: PMID:10320345
    title: >-
      Lysine biosynthesis in Saccharomyces cerevisiae: mechanism of
      alpha-aminoadipate reductase (Lys2) involves posttranslational
      phosphopantetheinylation by Lys5.
    statement: Lys5 phosphopantetheinylates the Lys2 carrier domain, activating alpha-aminoadipate reductase.
    supporting_text: >-
      These results identify the Lys5/Lys2 pair as a two-component system in
      which Lys5 covalently primes Lys2
  - source_id: PMID:28928432
    title: Two NAD-linked redox shuttles maintain the peroxisomal redox balance in Saccharomyces cerevisiae.
    statement: The final saccharopine dehydrogenase (Lys1) reaction occurs inside peroxisomes.
    supporting_text: >-
      The ultimate step in lysine biosynthesis, the NAD+-dependent
      dehydrogenation of saccharopine to lysine, is another NAD+-dependent
      reaction performed inside peroxisomes.
  - source_id: PMID:10613839
    title: >-
      A prokaryotic gene cluster involved in synthesis of lysine through the
      amino adipate pathway: a key to the evolution of amino acid
      biosynthesis.
    statement: Defines the Thermus thermophilus AAA-pathway gene cluster (lys20, hacA/lys4A, hacB/lys4B, argC/argB homologues).
  - source_id: PMID:12095615
    title: Characterization of bacterial homocitrate synthase involved in lysine biosynthesis.
    statement: Thermus homocitrate synthase catalyses the first reaction and is lysine-inhibited.
  - source_id: PMID:12427751
    title: >-
      Characterization of homoisocitrate dehydrogenase involved in lysine
      biosynthesis of an extremely thermophilic bacterium, Thermus
      thermophilus HB27, and evolutionary implication of beta-decarboxylating
      dehydrogenase.
    statement: Thermus HICDH is required for AAA-pathway lysine synthesis and also accepts isocitrate.
  - source_id: PMID:15256574
    title: alpha-Aminoadipate aminotransferase from an extremely thermophilic bacterium, Thermus thermophilus.
    statement: LysN is the Thermus 2-oxoadipate/AAA transaminase.
  - source_id: PMID:11489859
    title: >-
      Functional and evolutionary relationship between arginine biosynthesis
      and prokaryotic lysine biosynthesis through alpha-aminoadipate.
    statement: LysJ (ArgD homologue) is essential for Thermus lysine biosynthesis.
  - source_id: PMID:19620981
    title: Discovery of proteinaceous N-modification in lysine biosynthesis of Thermus thermophilus.
    statement: The amino group of AAA is carried on LysW through conversion to lysine.
    supporting_text: >-
      the amino group of AAA is modified by attachment to the gamma-carboxyl
      group of the C-terminal Glu54 of a small protein, LysW
  - source_id: PMID:23434852
    title: Lysine and arginine biosyntheses mediated by a common carrier protein in Sulfolobus.
    statement: In Sulfolobus, LysW-dependent enzymes are shared between lysine and arginine (ornithine) synthesis.
module:
  id: lysine_biosynthesis_aminoadipate
  label: L-lysine biosynthesis via alpha-aminoadipate
  module_type: METABOLIC_PATHWAY
  description: >-
    2-oxoglutarate + acetyl-CoA -> homocitrate -> cis-homoaconitate ->
    homoisocitrate -> 2-oxoadipate -> L-2-aminoadipate -> (lineage-specific
    second half) -> L-lysine.
  concepts:
    - preferred_term: L-lysine biosynthetic process
      term:
        id: GO:0009085
        label: L-lysine biosynthetic process
      description: >-
        Formation of L-lysine via the alpha-aminoadipate route; GO no longer
        has a current route-specific child term.
  context:
    taxa:
      - preferred_term: Fungi
        term:
          id: NCBITaxon:4751
          label: Fungi
        description: Saccharopine-route realisation (exemplars from S. cerevisiae and S. pombe).
      - preferred_term: Thermus thermophilus
        term:
          id: NCBITaxon:274
          label: Thermus thermophilus
        description: LysW-carrier realisation (bacterial exemplar).
      - preferred_term: Sulfolobus acidocaldarius
        term:
          id: NCBITaxon:2285
          label: Sulfolobus acidocaldarius
        description: LysW-carrier realisation shared with ornithine synthesis (archaeal exemplar).
  gocam_associations:
    - model: gomodel:YeastPathways_LYSINE-AMINOAD-PWY-2
      title: "L-lysine biosynthesis IV - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:667dfe8d00001131
      title: "L-lysine biosynthetic process (GO:0009085) (S. pombe)"
  parts:
