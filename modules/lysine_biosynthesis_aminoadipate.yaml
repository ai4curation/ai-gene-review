                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              First half of the homocitrate-to-homoisocitrate isomerisation.
            gocam_associations:
              - model: gomodel:YeastPathways_LYSINE-AMINOAD-PWY-2
                activity: gomodel:RXN3O-1983
