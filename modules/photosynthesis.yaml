id: MODULE:oxygenic_photosynthesis
title: Oxygenic photosynthesis module
description: >-
  A taxon-neutral decomposition of oxygenic photosynthesis as a recursively
  decomposable module. The module separates the thylakoid light reactions
  (light harvesting, water oxidation at photosystem II, the cytochrome b6f
  complex, photosystem I, mobile electron carriers, ferredoxin-NADP+ reductase,
  and the ATP synthase) from carbon fixation by the Calvin-Benson-Bassham
  reductive pentose-phosphate cycle, and adds optional photoprotection/electron
  balancing, the inorganic carbon-concentrating mechanism, and chlorophyll
  supply. It is phrased as functions, complexes, and pathway segments rather
  than a fixed gene list so it can represent cyanobacterial, algal, and plant
  implementations. Anoxygenic photosynthesis (single reaction center, non-water
  electron donors) is explicitly out of scope. The C4 and CAM
  carbon-concentrating shuttles are siblings rather than parts: each includes
  the Calvin-Benson-Bassham module by reference in its own right, C4 operating
  between two cell types and CAM separating the two carboxylations in time
  (MODULE:c4_carbon_shuttle, MODULE:cam_carbon_shuttle).
status: DRAFT
evidence:
  - source_id: file:modules/photosynthesis-deep-research-falcon.md
    title: Photosynthesis module deep research (falcon)
    statement: >-
      Module-targeted falcon deep research (generated from this module's
      outline) used to cross-check component coverage, variants, and
      failure modes. Machine-generated citations are not yet manually adjudicated.
  - source_id: file:terms/photosynthesis/photosynthesis-deep-research-falcon.md
    title: Photosynthesis concept deep research (falcon)
    statement: >-
      Falcon deep-research synthesis used to set module boundaries and the
      module-by-module component breakdown across Arabidopsis, Synechocystis,
      and Chlamydomonas (core vs accessory vs regulatory factors).
  - source_id: file:terms/photosynthesis/photosynthesis-notes.md
    title: Photosynthesis concept notes
    statement: Manually authored, GO- and PubMed-verified concept notes underpinning this module.
  - source_id: GO:0015979
    title: photosynthesis
    statement: The module is grounded in the GO biological-process term for photosynthesis.
  - source_id: PMID:21499260
    title: "Crystal structure of oxygen-evolving photosystem II at a resolution of 1.9 Å."
    statement: >-
      Defines the PSII D1/D2 reaction center, CP43/CP47 inner antennae, and the
      Mn4CaO5 water-oxidation cluster stabilized by the extrinsic OEC proteins.
  - source_id: PMID:11418848
    title: "Three-dimensional structure of cyanobacterial photosystem I at 2.5 A resolution"
    statement: >-
      Defines the PsaA/PsaB reaction-center heterodimer and the terminal Fe-S
      clusters carried by PsaC.
  - source_id: PMID:18294858
    title: Structure and function of Rubisco
    statement: >-
      Supports Rubisco as the major carboxylating enzyme of the CBB cycle and
      its competing oxygenase side-reaction.
  - source_id: PMID:33761918
    title: A new type of flexible CP12 protein in the marine diatom Thalassiosira pseudonana
    statement: >-
      Supports CP12 as a redox-controlled scaffold that forms a PRK-GAPDH-CP12
      ternary complex regulating the CBB cycle.
  - source_id: PMID:37549282
    title: NTRC regulates CP12 to activate Calvin-Benson cycle during cold acclimation
    statement: >-
      Supports redox (NTRC/thioredoxin)-dependent assembly/disassembly of the
      PRK-CP12-GAPDH supracomplex gating CBB-cycle activity.
notes: >-
  Identifiers are grounded only where verified against the local GO term cache,
  GOlr, or UniProt; descriptors without a `term` are deliberate (no confident
  identifier yet) rather than oversights. Representative UniProt members are
  concrete orienting examples, not exhaustive or species-restricting claims.
module:
  id: oxygenic_photosynthesis
  label: Oxygenic photosynthesis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: oxygenic photosynthesis
      term:
        id: GO:0015979
        label: photosynthesis
      description: >-
        Light-driven oxidation of water and reduction of CO2 to organic carbon,
        releasing O2. Comprises coupled light reactions and carbon fixation.
  context:
    taxa:
      - preferred_term: cyanobacteria
        term:
          id: NCBITaxon:1117
          label: Cyanobacteriota
      - preferred_term: eukaryotic algae
      - preferred_term: land plants
        term:
          id: NCBITaxon:3193
          label: Embryophyta
    cellular_components:
      - preferred_term: photosynthetic membrane
        term:
          id: GO:0034357
          label: photosynthetic membrane
  parts:
    - order: 1
      role: light reactions (electron transport and photophosphorylation)
      node:
        id: light_reactions
        label: Thylakoid light reactions
        description: >-
          Included by reference to MODULE:thylakoid_light_reactions, which
          models light harvesting, water oxidation at photosystem II, the
          cytochrome b6f complex, the mobile carriers, photosystem I,
          ferredoxin-NADP+ reductase and the ATP synthase. Extracted from this
          module so each stays small enough to read; the decomposition is
          unchanged.
        module_ref: thylakoid_light_reactions
        concepts:
          - preferred_term: photosynthesis, light reaction
            term:
              id: GO:0019684
              label: photosynthesis, light reaction
          - preferred_term: photosynthetic electron transport chain
            term:
              id: GO:0009767
              label: photosynthetic electron transport chain
    - order: 2
      role: carbon fixation (Calvin-Benson-Bassham cycle)
      node:
        id: carbon_fixation
        label: Calvin-Benson-Bassham reductive pentose-phosphate cycle
        description: >-
          Included by reference to MODULE:calvin_benson_bassham_cycle, which
          models Rubisco carboxylation, the reduction and regeneration phases,
          Rubisco activase and the CP12 redox scaffold. Extracted from this
          module both to keep each small and because the cycle is not specific
          to oxygenic photosynthesis: anoxygenic phototrophs and
          chemoautotrophs run the same cycle.
        module_ref: calvin_benson_bassham_cycle
        concepts:
          - preferred_term: reductive pentose-phosphate cycle
            term:
              id: GO:0019253
              label: reductive pentose-phosphate cycle
          - preferred_term: carbon fixation
            term:
              id: GO:0015977
              label: carbon fixation
    - order: 3
      role: photoprotection and ATP/NADPH balancing
      optional: true
      node:
        id: photoprotection_balancing
        label: Photoprotection and electron/energy balancing
        module_type: REGULATORY_STEP
        description: >-
          Mechanisms that dissipate excess excitation, redistribute antennae,
          and tune the ATP:NADPH ratio under fluctuating light.
        variant_sets:
          - id: balancing_mechanisms
            label: Photoprotection and balancing mechanisms
            axis: regulatory mechanism
            selection: ZERO_OR_MORE
            variants:
              - id: npq_variant
                label: Non-photochemical quenching (qE)
                module_type: REGULATORY_STEP
                annotons:
                  - id: npq_psbs_xanthophyll
                    label: PsbS- and xanthophyll-cycle-dependent quenching
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsbS and xanthophyll-cycle enzymes (VDE/ZEP)
                    function:
                      preferred_term: heat dissipation of excess PSII excitation
                    role_description: Rapid, reversible thermal dissipation protecting PSII under high light.
              - id: state_transitions_variant
                label: State transitions
                module_type: REGULATORY_STEP
                annotons:
                  - id: state_transition_kinase
                    label: STN7/Stt7-dependent LHCII redistribution
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: state-transition kinase (STN7/Stt7) and TAP38/PPH1 phosphatase
                    function:
                      preferred_term: redox-controlled LHCII phosphorylation balancing PSII/PSI
                    role_description: Rebalances excitation between the photosystems via antenna migration.
              - id: cyclic_electron_flow_variant
                label: Cyclic electron flow around PSI
                module_type: REGULATORY_STEP
                annotons:
                  - id: cef_pgr5_ndh
                    label: PGR5/PGRL1- and NDH-dependent cyclic electron flow
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PGR5/PGRL1 and NDH(-1) complex
                    function:
                      preferred_term: cyclic electron transfer generating extra proton-motive force
                    role_description: Raises ATP:NADPH and contributes to photoprotection.
    - order: 4
      role: inorganic carbon-concentrating mechanism (CCM)
      optional: true
      node:
        id: carbon_concentrating_mechanism
        label: Carbon-concentrating mechanism
        module_type: REGULATORY_STEP
        description: >-
          Active inorganic-carbon uptake and CO2 concentration around Rubisco to
          suppress the oxygenase reaction; prominent in cyanobacteria and algae.
        annotons:
          - id: ccm_carbonic_anhydrase
            label: Carbonic anhydrase (CO2/HCO3- interconversion)
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: carbonate dehydratase activity
                term:
                  id: GO:0004089
                  label: carbonate dehydratase activity
            function:
              preferred_term: carbonate dehydratase activity
              term:
                id: GO:0004089
                label: carbonate dehydratase activity
              substrates:
                - preferred_term: bicarbonate
              products:
                - preferred_term: CO2
                - preferred_term: water
        variant_sets:
          - id: ccm_strategy
            label: CCM compartmentation strategy
            axis: lineage / compartment
            selection: EXACTLY_ONE
            variants:
              - id: carboxysome_ccm
                label: Cyanobacterial carboxysome CCM
                module_type: CELLULAR_COMPONENT
                annotons:
                  - id: carboxysome_unit
                    label: Carboxysome microcompartment with encapsulated Rubisco/CA
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: carboxysome shell and cargo (Ccm/Cso)
                    role_description: Bacterial microcompartment concentrating CO2 around Rubisco.
              - id: pyrenoid_ccm
                label: Algal pyrenoid CCM
                module_type: CELLULAR_COMPONENT
                annotons:
                  - id: pyrenoid_unit
                    label: Pyrenoid and bicarbonate transporter network
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: pyrenoid CCM components (HLA3, LCIA, LCI1, LCIB, CAH3, CCM1/CIA5)
                        representative_members:
                          - preferred_term: Chlamydomonas LCI5 (low-CO2-inducible protein)
                            term:
                              id: UniProtKB:Q94ET8
                              label: Low-CO2-inducible protein 5
                    role_description: Eukaryotic algal biophysical CCM organized around the pyrenoid.
    - order: 5
      role: chlorophyll supply (supporting context)
      optional: true
      node:
        id: pigment_biosynthesis
        label: Chlorophyll biosynthesis (supporting)
        module_type: METABOLIC_PATHWAY
        description: Supplies the chlorophyll cofactors required by antennae and reaction centers.
        annotons:
          - id: mg_chelatase
            label: Magnesium chelatase (committed step)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: magnesium chelatase (CHLH/CHLD/CHLI)
            function:
              preferred_term: magnesium chelatase activity
              description: Inserts Mg2+ into protoporphyrin IX; committed step toward chlorophyll. No confident GO MF id asserted here.
          - id: por_reduction
            label: Protochlorophyllide reductase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: protochlorophyllide reductase activity
                term:
                  id: GO:0016630
                  label: protochlorophyllide reductase activity
            function:
              preferred_term: protochlorophyllide reductase activity
              term:
                id: GO:0016630
                label: protochlorophyllide reductase activity
              substrates:
                - preferred_term: protochlorophyllide
              products:
                - preferred_term: chlorophyllide
  connections:
    - source: light_reactions
      target: carbon_fixation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The light reactions supply the ATP and NADPH consumed by the
        Calvin-Benson-Bassham cycle.
    - source: carbon_concentrating_mechanism
      target: carbon_fixation
      connection_type: POSITIVELY_REGULATES
      description: >-
        The CCM raises CO2 around Rubisco, favoring carboxylation over
        oxygenation. It acts specifically on the carboxylation step
        (calvin_benson_bassham_cycle#rubisco_carboxylation); the connection
        names the including node because connection targets are scoped to this
        document.
  notes: >-
    Concrete organism modules can specialize abstract participants with specific
    genes, complexes, compartments, and transporters (e.g. Synechocystis psbA/
    psaA, Chlamydomonas pyrenoid CCM, Arabidopsis PsbS/RbcS) without the generic
    module naming every protein.
