  connections:
    - source: eef1_cycle
      target: eef2_translocation
      connection_type: PRECEDES
      description: >-
        Within each elongation cycle, decoding and peptidyl transfer (catalysed by the ribosome)
        precede eEF2 translocation, which empties the A site for the next eEF1A ternary complex.
    - source: eef2k_regulation
      target: eef2_translocation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        EEF2K phosphorylation of eEF2 on Thr56 prevents eEF2 from binding the ribosome and slows
        elongation.
      evidence:
        - source_id: file:human/EEF2K/EEF2K-ai-review.yaml
          statement: Thr56 phosphorylation inactivates eEF2.
          supporting_text: this phosphorylation prevents eEF2 from binding the ribosome, inactivating it and slowing the rate of peptide-chain elongation
    - source: eef2_translocation
      target: release_factor_complex
      connection_type: PRECEDES
      description: >-
        Elongation continues until translocation brings a stop codon into the A site, which is
        read by eRF1 instead of an aminoacyl-tRNA.
    - source: release_factor_complex
      target: abce1_recycling
      connection_type: PRECEDES
      description: >-
        After peptide release, eRF1 remains on the ribosome and recruits ABCE1, which splits the
        post-termination complex (GO-CAM edge ETF1 directly positively regulates ABCE1 in
        gomodel:63e5937500001319).
      evidence:
        - source_id: PMID:20122402
          statement: ABCE1 dissociates only post-termination complexes made with eRF1.
          supporting_text: ABCE1 dissociates only post-TCs obtained with eRF1/eRF3 (or eRF1 alone), but not post-TCs obtained with puromycin in eRF1's absence.
