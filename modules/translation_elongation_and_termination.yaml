id: MODULE:translation_elongation_and_termination
title: Human cytosolic translation elongation and termination — eEF1A aminoacyl-tRNA delivery recycled by the eEF1B exchange complex, eEF2 translocation (restrained by EEF2K), hypusinated eIF5A at stalling motifs, eRF1-eRF3 peptide release and ABCE1 ribosome recycling
description: >-
  Once initiation has placed an 80S ribosome on the start codon with initiator tRNA in the P
  site, the cytosolic ribosome extends the polypeptide by a repeated three-step cycle and then
  releases it at a stop codon. (1) Decoding: the GTP-bound elongation factor eEF1A (EEF1A1 in
  most tissues, its paralog EEF1A2 in neurons, heart and skeletal muscle) carries aminoacyl-tRNA
  to the A site as a ternary complex; codon-anticodon pairing activates GTP hydrolysis and
  eEF1A-GDP leaves the ribosome. The eEF1B complex, a heterotrimer of eEF1Balpha (EEF1B2), the
  second exchange subunit encoded by EEF1D and the scaffold eEF1Bgamma (EEF1G), exchanges GDP for
  GTP on eEF1A so that it can bind the next aminoacyl-tRNA. (2) Peptidyl transfer is catalysed
  by the large-subunit rRNA of the ribosome itself. (3) Translocation: the GTPase eEF2 moves the
  tRNA-mRNA module from the hybrid pre-translocation state to the post-translocation state,
  vacating the A site for the next codon. eEF2 is inhibited when the calcium/calmodulin-dependent
  alpha-kinase EEF2K phosphorylates it, which couples elongation rate to energy and stress
  signals. At sequences that the ribosome forms peptide bonds on slowly, such as runs of
  prolines and some other tripeptide motifs, the hypusine-modified factor eIF5A binds between
  the E and P sites and stimulates peptide-bond formation. When a stop codon reaches the A site,
  the class I release factor eRF1 (ETF1) recognises it and, through its GGQ motif, induces
  hydrolysis of peptidyl-tRNA; the translational GTPase eRF3 (eRF3a, GSPT1, or eRF3b, GSPT2)
  delivers eRF1 as a GTP-bound complex and its GTP hydrolysis accelerates release. Finally the
  ABC-family ATPase ABCE1 binds the post-termination ribosome together with eRF1 and splits it
  into 60S and 40S subunits, which return to initiation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000101
    title: translation pathway
    statement: >-
      The RGD Pathway Ontology diagram for translation draws the elongation cycle (Eef1a1 with
      aminoacyl-tRNA and GTP, Eef1b2 recycling, Eef2 translocation) and termination (Etf1 with
      Gspt1, peptidyl-tRNA hydrolysis, Abce1 subunit dissociation). This module is item 3 of the
      translation split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md and
      covers the elongation and termination steps of that pathway. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000101.yaml).
  - source_id: PW:0000581
    title: translation elongation pathway
    statement: >-
      RGD's elongation child of PW:0000101 (id and label checked against .cache/rgd_pw/pw.obo).
      RGD annotates three human genes to it, EEF1A1, EEF1B2 and EEF2 (TAS), all of which are
      participants here.
  - source_id: PW:0000582
    title: translation termination pathway
    statement: >-
      RGD's termination child of PW:0000101 (id and label checked against .cache/rgd_pw/pw.obo).
      RGD annotates five human genes to it, ETF1, GSPT1, ABCE1, PELO and HBS1L (TAS). ETF1, GSPT1
      and ABCE1 are participants; PELO and HBS1L, the stalled-ribosome rescue factors, are
      excluded (see notes).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000101.yaml
    statement: RGD's text names the eEF1B exchange step of the elongation cycle.
    supporting_text: Eef1a1 is cycled back to its GTP-form by Eef1b2.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000101.yaml
    statement: RGD's text assigns stop-codon recognition and peptidyl-tRNA hydrolysis to eRF1.
    supporting_text: Etf1 is involved in codon recognition and peptidyl-tRNA hydrolysis;
  - source_id: GO:0006412
    title: translation
    statement: >-
      The GO process mapped to PW:0000101 (skos:closeMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). The module's own
      process concepts are the more specific cytoplasmic translational elongation (GO:0002182)
      and cytoplasmic translational termination (GO:0002184); the PW children map to
      translational elongation (GO:0006414) and translational termination (GO:0006415) in their
      definitions.
  - source_id: PMID:26593721
    title: Functional Dynamics within the Human Ribosome Regulate the Rate of Active Protein Synthesis.
    statement: >-
      Single-molecule imaging of human 80S ribosomes with human factors shows eEF1A-GTP
      delivering aminoacyl-tRNA and eEF2-GTP translocating the pre-translocation complex.
    supporting_text: the evolutionarily conserved GTPases eukaryotic Elongation Factors 1A (eEF1A) and 2 (eEF2) repetitively bind and hydrolyze GTP at the leading edge of the ribosome
  - source_id: PMID:16777602
    title: In vitro reconstitution of eukaryotic translation reveals cooperativity between release factors eRF1 and eRF3.
    statement: >-
      All steps of mammalian translation were reconstituted from purified components; eRF1
      recognises stop codons and induces peptidyl-tRNA hydrolysis, accelerated by eRF3 and GTP.
    supporting_text: Whereas eRF1 recognizes all three termination codons and induces hydrolysis of peptidyl tRNA
  - source_id: PMID:20122402
    title: The role of ABCE1 in eukaryotic posttermination ribosomal recycling.
    statement: ABCE1 splits post-termination ribosomes formed with eRF1 into subunits, using NTP hydrolysis.
    supporting_text: ABCE1 dissociates post-TCs into free 60S subunits and mRNA- and tRNA-bound 40S subunits.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000101 (translation pathway) as item 3 of
  the translation split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed
  in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 180 RGD-curated human
  genes). RGD's children PW:0000581 (translation elongation pathway) and PW:0000582
  (translation termination pathway), whose ids and labels were checked against
  .cache/rgd_pw/pw.obo, are cited as evidence sources because the module covers them. RGD
  annotates eight human genes to the two children (from .cache/rgd_pw/homo_genes_pw): EEF1A1,
  EEF1B2 and EEF2 to elongation, and ETF1, GSPT1, ABCE1, PELO and HBS1L to termination. Six are
  modelled; PELO and HBS1L are excluded (decision 7). Six genes outside the RGD lists are
  added because they do work in the same steps: EEF1A2, EEF1D, EEF1G, EEF2K, EIF5A and GSPT2. UniProt accessions and recommended names are from the gene folders where a review
  exists (EEF1A2, EEF2K, EIF5A, ABCE1) and from UniProt REST otherwise (November 2026).
  Molecular functions are from each protein's experimental human GOA rows in QuickGO (November
  2026) or from the core functions of the existing human gene reviews (EEF1A2, EEF2K, EIF5A,
  ABCE1). Curator-authored functions without an experimental human GOA row: the
  guanyl-nucleotide exchange factor activity of the eEF1B complex and of its EEF1B2 and EEF1D
  units (IBA rows only; literature PMID:26587907, PMID:35971611), and translation elongation
  factor activity for EEF1A2 and EIF5A, which are the core functions of their gene reviews.
  The GTP and ATP hydrolysis participants were grounded from Rhea (RHEA:19669 for GTPase
  activity, whose GO definition states the same equation; RHEA:13065 for ATP hydrolysis
  activity, the reaction cross-referenced from GO:0016887), using the ChEBI ids and names that
  Rhea gives for each participant. The structure of the termination part follows
  modules/dmel_erf1_erf3_termination_complex.yaml (structure only; no Drosophila evidence is
  used).

  Boundary and modelling decisions. (1) The ribosome is not modelled. Peptidyl transfer and
  decoding are performed by the ribosomal RNAs and proteins of the 80S ribosome, which are
  modelled once in the sibling module cytoplasmic_ribosome; no ribosomal protein is listed here.
  Initiation and the 60S joining by eIF5B belong to the sibling translation_initiation; the
  40S subunit released by ABCE1, still bound to mRNA and tRNA, is recycled by initiation
  factors, which belong to that sibling. (2) The translational
  GTPases eEF1A and eEF2 carry translation elongation factor activity, the function of their
  experimental rows, of the GO-CAM activity for EEF1A1 and of the EEF1A2 review; their GTPase
  activity is recorded in the role text as part of the factor cycle rather than as a second
  annoton, so the GTP-hydrolysis participants are grounded only where GTPase activity is the
  annoton function (eRF3), as in the GO-CAM termination model and the Drosophila analogue. (3)
  eEF1A paralogs. EEF1A1 and EEF1A2 have the same translation activity and reciprocal tissue
  expression; they are two annotons in one node rather than a variant set because each is a
  complete implementation of the same step and the axis (tissue) is stated in the node
  description. Their moonlighting functions (actin bundling, PI4KB activation by EEF1A2,
  nuclear export, apoptosis) are outside the module. (4) eEF1B. GO has no term for the
  exchange complex alone; GO:0005853 eukaryotic translation elongation factor 1 complex is
  defined with all four subunits (eEF1A with eEF1B), so it is the concept of the parent node
  that holds the carrier and the exchanger, and the exchange complex is a protein-complex
  descriptor without a GO id. Subunit names are confusing: EEF1B2 encodes eEF1Balpha
  (UniProt "Elongation factor 1-beta"), EEF1D encodes the second exchange subunit (UniProt
  "Elongation factor 1-delta", called eEF1Bbeta in PMID:35971611) and EEF1G encodes the
  scaffold eEF1Bgamma. Both exchange subunits carry the GEF function because each was assayed
  as an isolated protein; EEF1G has none. EEF1E1 (AIMP3), which shares the EEF1 name, is a
  component of the multi-tRNA synthetase complex and is excluded. GO:0005085 is used for the
  exchange activity although its definition says "signaling GTPase"; GO cross-references the
  Reactome eEF1B exchange reaction from the same term, and a definition change is recorded in
  proposed_ontology_changes. (5) EEF2K is included as an optional regulatory part with a
  NEGATIVELY_REGULATES edge to eEF2, because eEF2 is its only established substrate and it
  acts directly on an elongation factor. The upstream signals (calcium-calmodulin, AMPK,
  mTORC1-S6K, RSK) are not modelled; other regulators of elongation are likewise left out.
  (6) eIF5A is included. Despite its name, the human EIF5A review gives translation elongation
  factor activity as its core function, its experimental GOA row is translational elongation
  (IMP, PMID:29712776), and in human cells it is required for translation of ATG3, whose polyproline motif
  stalls the ribosome (PMID:29712776).
  Hypusine synthesis by DHPS and DOHH is a required maturation of eIF5A, not a step of
  elongation, and is left to a hypusine module (a Drosophila analogue,
  dmel_hypusine_biosynthesis, exists; there is no human module yet). EIF5A2 is not modelled
  (protein-binding rows only). eIF5A's reported roles in termination and in mRNA export are not
  modelled. (7) Rescue of stalled ribosomes is excluded. RGD annotates PELO and HBS1L to
  PW:0000582, and its text describes them as the stalled-ribosome counterparts of eRF1 and eRF3
  in no-go and nonstop decay; both have human gene reviews and GO-CAM models
  (gomodel:63e5937500001279). They are rescue factors acting on stalled, not terminating,
  ribosomes, and the split plan leaves no-go and nonstop decay to a later
  ribosome-quality-control module; they are named here by symbol only. ABCE1 splits ribosomes
  in both settings; only its post-termination role is pinned to GO-CAM activities here, and its
  activities in the rescue and RQC models (gomodel:63e5937500001279, gomodel:63f809ec00000512,
  gomodel:63f809ec00000560, gomodel:65f3ae5c00000257) are left for that module. (8) Termination
  is the canonical eRF1-eRF3 route. Stop-codon readthrough, selenocysteine insertion (see
  selenocysteine_biosynthesis_incorporation) and nonsense-mediated decay (sibling
  nonsense_mediated_mrna_decay, PW:0000548, where eRF1-eRF3 at premature stop codons interact
  with UPF1) are outside. The eRF1 glutamine methyltransferase HEMK2-TRMT112 modifies eRF1 and
  is not a participant. (9) Aminoacyl-tRNA biosynthesis (PW:0001159, a diagram link of
  PW:0000101) supplies the substrates of eEF1A and is out of scope; aminoacyl-tRNAs are inputs,
  and the cytosolic aminoacyl-tRNA synthetases and the multi-synthetase complex are not
  modelled here. Mitochondrial elongation and termination (TUFM, TSFM, GFM1 and others) are in
  mitochondrial_translation; co-translational targeting of the nascent chain is in
  er_cotranslational_translocation. (10) Substrate-versus-participant check: the module lists
  only gene products that perform a step (carrying, exchanging, translocating, releasing,
  splitting) or directly regulate one (EEF2K). The aminoacyl-tRNAs, mRNA and nascent chain are
  acted on and are not participants. Ubiquitin ligases that degrade stalled eEF1A or eRF1
  (GCN1, RNF14, RNF25) act on these factors in ribosome-collision responses and are excluded.

  GO-CAM links (gocams/index.tsv). gomodel:63e5937500001319 (Translation termination by the
  eRF1-eRF3 complex, followed by ribosome dissociation by ABCE1, Human; the seed's best_gocam)
  has GSPT1 GTPase activity directly positively regulating ETF1, which directly positively
  regulates ABCE1; all three activities are pinned, and the two edges are the eRF3-eRF1
  connection and the termination-to-recycling connection. Its ETF1 activity uses the parent
  term translation termination factor activity (GO:0008079), and its ABCE1 activity uses
  ribonucleoside triphosphate phosphatase activity (GO:0017111), the parent of the ATP
  hydrolysis activity used here; both are consistent with the module, which uses the more
  specific terms supported by the experimental rows and the ABCE1 review. The ABCE1 activity in
  gomodel:65f3ae5c00000170 (60S recycling after termination) is also pinned. EEF1A1 in
  gomodel:63d320cd00001688 and ETF1 in gomodel:63d320cd00001733 (ribosome-stalling responses
  leading to their degradation) are pinned to their annotons, whose functions match; the
  ligases in those models are not modelled. No production model contains EEF1A2, EEF1B2, EEF1D,
  EEF1G, EEF2, EEF2K, EIF5A or GSPT2. PANTHER family ids and PTNs are deliberately not asserted.
proposed_ontology_changes:
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    old_value: >-
      Stimulates the exchange of GDP to GTP on a signaling GTPase, changing its conformation to
      its active form. Guanine nucleotide exchange factors (GEFs) act by stimulating the release
      of guanosine diphosphate (GDP) to allow binding of guanosine triphosphate (GTP), which is
      more abundant in the cell under normal cellular physiological conditions.
    new_value: >-
      Stimulates the exchange of GDP to GTP on a GTPase, changing its conformation to its active
      form. Guanine nucleotide exchange factors (GEFs) act by stimulating the release of
      guanosine diphosphate (GDP) to allow binding of guanosine triphosphate (GTP), which is more
      abundant in the cell under normal cellular physiological conditions.
    change_dsl: >-
      change definition of GO:0005085 to 'Stimulates the exchange of GDP to GTP on a GTPase,
      changing its conformation to its active form. Guanine nucleotide exchange factors (GEFs)
      act by stimulating the release of guanosine diphosphate (GDP) to allow binding of
      guanosine triphosphate (GTP), which is more abundant in the cell under normal cellular
      physiological conditions.'
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      The first sentence restricts the term to signaling GTPases, but GO uses it for exchange on
      translation-factor GTPases: the term cross-references the Reactome reaction R-HSA-156913
      (Regeneration of eEF1A:GTP by eEF1B activity), and the translation exchange factors eEF1B
      (EEF1B2, EEF1D) (IBA) and the mitochondrial EF-Ts (TSFM, ISS) are annotated to it. eEF1A is a
      translation factor, not a signaling GTPase. Removing "signaling" makes the definition
      cover the annotations the term already carries; GO has no separate term for exchange on
      translation GTPases. Only the word "signaling" changes; the second sentence is kept as is.
    supported_by:
      - reference_id: PMID:26587907
        supporting_text: eEF1Bα functions as a catalyst of guanine nucleotide exchange on translation elongation factor 1A (eEF1A).
      - reference_id: PMID:35971611
        supporting_text: a 'GEF hub' that ensures efficient maintenance of the translationally active GTP-bound conformation of eEF1A in higher eukaryotes.
module:
  id: translation_elongation_and_termination
  label: Cytosolic translation elongation and termination
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Elongation-cycle factors (eEF1A, eEF1B, eEF2, eIF5A) acting on the cytosolic 80S ribosome,
    followed by eRF1-eRF3 peptide release and ABCE1 ribosome splitting.
  concepts:
    - preferred_term: cytoplasmic translational elongation
      term:
        id: GO:0002182
        label: cytoplasmic translational elongation
    - preferred_term: cytoplasmic translational termination
      term:
        id: GO:0002184
        label: cytoplasmic translational termination
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  parts:
    - order: 1
      role: aminoacyl-tRNA delivery to the A site and recycling of the carrier (decoding)
      node:
        id: eef1_cycle
        label: eEF1 complex — eEF1A ternary-complex carrier and eEF1B nucleotide exchange
        module_type: PROTEIN_COMPLEX
        description: >-
          GTP-bound eEF1A brings aminoacyl-tRNA to the ribosome and leaves as eEF1A-GDP; eEF1B
          regenerates eEF1A-GTP. GO's eukaryotic translation elongation factor 1 complex
          includes both the carrier and the exchange subunits.
        concepts:
          - preferred_term: eukaryotic translation elongation factor 1 complex
            term:
              id: GO:0005853
              label: eukaryotic translation elongation factor 1 complex
        parts:
          - order: 1
            role: GTP-dependent aminoacyl-tRNA carrier (tissue paralogs)
            node:
              id: eef1a
              label: eEF1A (EEF1A1 or EEF1A2)
              module_type: BIOLOGICAL_PROCESS
              description: >-
                EEF1A1 and EEF1A2 are alternative carriers with the same translation activity
                and reciprocal expression (EEF1A2 in neurons, heart and skeletal muscle, EEF1A1
                elsewhere); each is one annoton.
              annotons:
                - id: eef1a1_carrier
                  label: "EEF1A1: aminoacyl-tRNA delivery (ubiquitous paralog)"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: EEF1A1
                      term:
                        id: UniProtKB:P68104
                        label: Elongation factor 1-alpha 1
                  function:
                    preferred_term: translation elongation factor activity
                    term:
                      id: GO:0003746
                      label: translation elongation factor activity
                  processes:
                    - preferred_term: cytoplasmic translational elongation
                      term:
                        id: GO:0002182
                        label: cytoplasmic translational elongation
                  locations:
                    - preferred_term: cytosolic ribosome
                      term:
                        id: GO:0022626
                        label: cytosolic ribosome
                  role_description: >-
                    Forms the eEF1A-GTP-aminoacyl-tRNA ternary complex, delivers it to the A
                    site and hydrolyses GTP on cognate codon recognition (GTPase activity is
                    also an IDA row on EEF1A1, PMID:26593721, and is treated here as part of the
                    carrier cycle, not as a separate annoton). Experimental human GOA: translation
                    elongation factor activity and translational elongation, IDA
                    (PMID:26593721, PMID:36638793). Moonlighting roles (actin binding,
                    nuclear export with exportin-5, kinase scaffolding) are outside the module.
                  evidence:
                    - source_id: PMID:26593721
                      statement: Human eEF1A-GTP delivers aminoacyl-tRNA to human 80S ribosomes as a ternary complex.
                      supporting_text: eEF1A chaperones aa-tRNA into the aminoacyl (A) site by forming a ternar
                  gocam_associations:
                    - model: gomodel:63d320cd00001688
                      activity: gomodel:63d320cd00001688/63d320cd00001725
                      title: EEF1A1 translation elongation factor activity (GO:0003746), Response to ribosome stalling by GCN1, RNF14 and RNF25, leading to ubiquitination and degradation of EEF1A1 (Human)
                - id: eef1a2_carrier
                  label: "EEF1A2: aminoacyl-tRNA delivery (neuron and muscle paralog)"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: EEF1A2
                      term:
                        id: UniProtKB:Q05639
                        label: Elongation factor 1-alpha 2
                  function:
                    preferred_term: translation elongation factor activity
                    term:
                      id: GO:0003746
                      label: translation elongation factor activity
                  processes:
                    - preferred_term: cytoplasmic translational elongation
                      term:
                        id: GO:0002182
                        label: cytoplasmic translational elongation
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
                  role_description: >-
                    Tissue-restricted paralog of EEF1A1 with the same aminoacyl-tRNA delivery
                    role. The function is the core function of the human EEF1A2 gene review;
                    EEF1A2 has no experimental human GOA row for translation elongation factor
                    activity, and its PI4KB activator activity is outside the module.
                    Heterozygous variants cause a neurodevelopmental disorder with epilepsy.
                  evidence:
                    - source_id: file:human/EEF1A2/EEF1A2-ai-review.yaml
                      statement: Core function of the human EEF1A2 review is GTP-dependent aminoacyl-tRNA delivery (GO:0003746, GO:0006414).
                      supporting_text: It uses a GTP-dependent cycle to deliver aminoacyl-tRNAs to the ribosomal A site
                    - source_id: PMID:37082266
                      statement: The two eEF1A variants have similar translation activity.
                      supporting_text: The two eEF1A variants have similar translation activity
          - order: 2
            role: guanine-nucleotide exchange on eEF1A-GDP
            node:
              id: eef1b
              label: eEF1B exchange complex (EEF1B2, EEF1D, EEF1G)
              module_type: PROTEIN_COMPLEX
              annotons:
                - id: eef1b_gef
                  label: "eEF1B complex: GDP/GTP exchange on eEF1A"
                  participant:
                    selector_type: PROTEIN_COMPLEX
                    protein_complex:
                      preferred_term: eEF1B complex (eEF1B(alpha beta gamma)3 heterotrimer)
                      active_units:
                        - id: eef1b2_unit
                          label: eEF1Balpha (EEF1B2) catalytic exchange subunit
                          role: >-
                            Its C-terminal domain is the EF-Ts-like exchange domain that is
                            necessary and sufficient for catalysis; its N-terminal domain binds
                            eEF1Bgamma.
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: EEF1B2
                              term:
                                id: UniProtKB:P24534
                                label: Elongation factor 1-beta
                          function:
                            preferred_term: guanyl-nucleotide exchange factor activity
                            term:
                              id: GO:0005085
                              label: guanyl-nucleotide exchange factor activity
                        - id: eef1d_unit
                          label: EEF1D exchange subunit (eEF1Bdelta, called eEF1Bbeta in PMID:35971611)
                          role: >-
                            Second exchange subunit with a structurally conserved GEF domain and
                            exchange activity similar to eEF1Balpha in vitro; metazoan-specific.
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: EEF1D
                              term:
                                id: UniProtKB:P29692
                                label: Elongation factor 1-delta
                          function:
                            preferred_term: guanyl-nucleotide exchange factor activity
                            term:
                              id: GO:0005085
                              label: guanyl-nucleotide exchange factor activity
                        - id: eef1g_unit
                          label: eEF1Bgamma (EEF1G) scaffold subunit
                          role: >-
                            Glutathione S-transferase-like scaffold that binds the N-terminal
                            domains of the exchange subunits and relieves the autoinhibition of
                            eEF1Balpha. No catalytic function is asserted for it.
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: EEF1G
                              term:
                                id: UniProtKB:P26641
                                label: Elongation factor 1-gamma
                  function:
                    preferred_term: guanyl-nucleotide exchange factor activity
                    term:
                      id: GO:0005085
                      label: guanyl-nucleotide exchange factor activity
                    targets:
                      - preferred_term: eEF1A-GDP (EEF1A1 or EEF1A2)
                  processes:
                    - preferred_term: cytoplasmic translational elongation
                      term:
                        id: GO:0002182
                        label: cytoplasmic translational elongation
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
                  role_description: >-
                    Regenerates eEF1A-GTP after each delivery. The exchange activity is
                    curator-authored for the complex and for the EEF1B2 and EEF1D units: no human
                    experimental GOA row asserts it (both units carry only IBA rows for
                    GO:0005085), and it rests on the biochemistry in PMID:26587907 and
                    PMID:35971611. Biallelic loss-of-function variants in EEF1B2 and in EEF1D
                    cause neurodevelopmental disorders.
                  evidence:
                    - source_id: PMID:35971611
                      statement: The human eEF1B GEF complex is an eEF1B(alpha beta gamma)3 heterotrimer with six GEF domains.
                      supporting_text: we report a quaternary organization of the human guanine-nucleotide exchange factor (GEF) complex, eEF1B, comprising α, β and γ subunits that specifically associate into a heterotrimeric form eEF1B(αβγ)3.
                    - source_id: PMID:35971611
                      statement: Both exchange subunits have similar activity in vitro.
                      supporting_text: As both eEF1Bα and eEF1Bβ have similar guanine nucleotide exchange activity in vitro
                    - source_id: PMID:26587907
                      statement: eEF1Balpha catalyses nucleotide exchange on eEF1A through its C-terminal domain.
                      supporting_text: eEF1Bα functions as a catalyst of guanine nucleotide exchange on translation elongation factor 1A (eEF1A). The C-terminal domain of eEF1Bα is necessary and sufficient for its catalytic activity
        connections:
          - source: eef1b
            target: eef1a
