id: MODULE:phage_l5_virion_morphogenesis_and_mycolata_lysis
title: Mycobacteriophage L5 covalently crosslinked capsid, frameshift-chaperoned siphoviral tail assembly, and LysA/Holin/LysB mycolata envelope lysis
description: 'The late morphogenetic, DNA packaging, and three-component mycolata host-envelope lysis module encoded on the
  left arm of Mycobacterium phage L5 (52,297 bp linear dsDNA with 9-nt 3''-cohesive cos ends, 5''-CGGTCGGTT-3''). The module
  comprises three coordinated sub-programs: (1) Cos-site DNA packaging and covalently crosslinked HK97-like capsid assembly,
  in which the putative small terminase subunit gp5 (gene 5) and large terminase subunit gp13 (gene 13) cleave concatemeric
  phage DNA at cos to generate 9-nt 3'' single-stranded extensions and translocate the 52.3-kb genome through the dodecameric
  portal vertex gp14 (gene 14) into procapsids built from scaffolding protein gp16 (gene 16) and the HK97-family major capsid
  subunit gp17 (gene 17), which undergoes autocatalytic covalent cross-linking into high-molecular-weight head complexes during
  maturation; (2) Frameshift-chaperoned long non-contractile siphoviral tail assembly (135 nm length), in which the canonical
  tail assembly chaperone gp24 (gene 24) and its programmed -1 ribosomal frameshift extension gp24-gp25 (gene 25) coat the
  837-residue tape measure protein gp26 (gene 26) to nucleate polymerization of major tail protein gp23 (gene 23) onto a distal
  tail tip/baseplate subcomplex composed of minor tail proteins gp6 (gene 6), gp27 (gene 27), gp28 (gene 28), and gp31 (gene
  31), followed by capping with tail terminator protein gp22 (gene 22) and joining to the packaged head; and (3) Three-component
  mycolata cell-envelope lysis, adapted to breach the bipartite mycobacterial cell wall, in which holin gp11 (gene 11) permeabilizes
  the inner cytoplasmic membrane, Endolysin A (LysA, gp10, gene 10) hydrolyzes the highly cross-linked peptidoglycan sacculus,
  and Endolysin B (LysB, gp12, gene 12) acts as a dedicated mycolylarabinogalactan esterase that cleaves the ester linkage
  tethering the outer mycolic acid layer (mycomembrane) to the arabinogalactan-peptidoglycan complex.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  statement: Defines the left-arm virion morphogenesis and lysis genes of mycobacteriophage L5, N-terminally sequences major
    virion structural proteins (portal gp14, scaffolding gp16, major capsid gp17, major tail gp23, and minor tail proteins
    gp6, gp26, gp27, gp28), and demonstrates covalent cross-linking of major capsid subunit gp17 in mature heads.
- source_id: PMID:1620623
  title: The cohesive ends of mycobacteriophage L5 DNA.
  statement: Determines the 9-nucleotide 3'-extended cohesive end sequence (5'-CGGTCGGTT-3') generated by L5 terminase cleavage
    at cos.
- source_id: PMID:15469818
  title: Conserved translational frameshift in dsDNA bacteriophage tail assembly genes.
  statement: Establishes the conserved programmed -1 translational frameshift between tail assembly chaperone genes 24 and
    25 upstream of tape measure gene 26 in mycobacteriophage L5 and across siphoviruses.
- source_id: PMID:19555454
  title: Mycobacteriophage Lysin B is a novel mycolylarabinogalactan esterase.
  statement: Demonstrates that mycobacteriophage Lysin B (gp12 homolog) is an alpha/beta-hydrolase mycolylarabinogalactan
    esterase that cleaves the ester bond linking mycolic acids to arabinogalactan to disrupt the mycobacterial outer membrane
    during phage lysis.
- source_id: PMID:22470512
  title: 'Mycobacteriophage endolysins: diverse and modular enzymes with multiple catalytic activities.'
  statement: Dissects the modular domain organization and peptidoglycan-hydrolyzing activities of mycobacteriophage Lysin
    A (gp10) endolysins and their coordination with holin (gp11) and Lysin B (gp12).
- source_id: PMID:9636706
  title: 'Genome structure of mycobacteriophage D29: implications for phage evolution.'
  statement: Comparative analysis of the conserved left-arm virion structural and lysis gene organization between mycobacteriophages
    L5 and D29.
notes: 'Exemplar organism: Mycobacterium phage L5 (NCBITaxon:31757, UniProt proteome UP000002402). Serves as the benchmark
  Actinobacteriophage module for HK97-like covalently crosslinked capsid maturation, gp24/gp25 programmed -1 frameshift tail
  chaperones, and the three-component LysA/Holin/LysB lysis cassette required to breach the mycolic acid-rich outer envelope
  of Corynebacteriales hosts.'
