                label: chemokine activity
            processes:
              - preferred_term: chemokine-mediated signaling pathway
                term:
                  id: GO:0070098
                  label: chemokine-mediated signaling pathway
              - preferred_term: B cell chemotaxis
                term:
                  id: GO:0035754
                  label: B cell chemotaxis
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Secreted homeostatic CXC chemokine that binds and activates
              CXCR5, selectively attracting B lymphocytes into lymphoid
              follicles.
            evidence:
