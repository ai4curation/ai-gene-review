            function:
              preferred_term: C-X-C chemokine receptor activity
              term:
                id: GO:0016494
                label: C-X-C chemokine receptor activity
            processes:
              - preferred_term: chemokine-mediated signaling pathway
                term:
                  id: GO:0070098
                  label: chemokine-mediated signaling pathway
              - preferred_term: B cell chemotaxis
                term:
                  id: GO:0035754
                  label: B cell chemotaxis
            locations:
