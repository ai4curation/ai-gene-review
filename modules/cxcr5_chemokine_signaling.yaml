                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Seven-transmembrane CXC chemokine receptor on mature B cells
              that binds CXCL13 and signals calcium mobilization and
              chemotaxis, directing B cells into lymphoid follicles.
            evidence:
