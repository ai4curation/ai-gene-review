id: MODULE:cxcr5_chemokine_signaling
title: CXCL13 / CXCR5 chemokine signaling pathway module
description: >-
  The homeostatic CXC chemokine CXCL13 (B-lymphocyte chemoattractant, BLC;
  B cell-attracting chemokine 1, BCA-1) is secreted by stromal cells of the
  B-cell follicles of secondary lymphoid organs, chiefly follicular dendritic
  cells, and binds the G protein-coupled chemokine receptor CXCR5 (Burkitt's
  lymphoma receptor 1, BLR1) on mature B cells and follicular helper T cells.
  CXCR5 activation induces calcium mobilization and chemotaxis, guiding B
  lymphocytes into lymphoid follicles. CXCL13 also induces B cells to
  up-regulate membrane lymphotoxin alpha1beta2, which promotes follicular
  dendritic cell development and further CXCL13 expression, a positive
  feedback loop that organizes and maintains follicles; CXCL13 and CXCR5 are
  also needed for the development of most lymph nodes and Peyer's patches.
status: DRAFT
evidence:
  - source_id: GO:0070098
    title: chemokine-mediated signaling pathway
    statement: >-
      GO has no ligand- or receptor-specific biological process term for
      CXCL13/CXCR5 signaling (no "chemokine (C-X-C motif) ligand 13 signaling
      pathway" or "CXCR5 signaling pathway" term was found by QuickGO search
      on 2026-11-23; the only CXCL13-named term is GO:0097391 chemokine (C-X-C
      motif) ligand 13 production). The module concept therefore uses the
      parent GO:0070098, and a specific child term is requested in
      proposed_new_terms, by analogy with GO:0038146 chemokine (C-X-C motif)
      ligand 12 signaling pathway (is_a GO:0070098).
  - source_id: PMID:9463416
    title: B cell-attracting chemokine 1, a human CXC chemokine expressed in lymphoid tissues, selectively attracts B lymphocytes via BLR1/CXCR5.
    supporting_text: >-
      In transfected cells, BCA-1 induced chemotaxis and Ca2+ mobilization
      demonstrating that it acts via BLR1. Under the same conditions, no
      activity was obtained with 10 CXC and 19 CC chemokines, lymphotactin,
      neurotactin/fractalkine and several other peptide ligands.
    statement: >-
      Identified human CXCL13 (BCA-1) and showed that it signals through
      BLR1, which the authors renamed CXCR5, in transfected pre-B cells, and
      that it selectively attracts human blood B lymphocytes.
  - source_id: PMID:9486651
    title: A B-cell-homing chemokine made in lymphoid follicles activates Burkitt's lymphoma receptor-1.
    supporting_text: >-
      We show that BLC stimulates calcium influx into, and chemotaxis of,
      cells transfected with BLR-1. Our results indicate that BLC functions as
      a BLR-1 ligand and may guide B lymphocytes to follicles in secondary
      lymphoid organs.
    statement: >-
      Independently identified mouse CXCL13 (BLC), strongly expressed in the
      follicles of Peyer's patches, spleen and lymph nodes, as a B-cell
      selective chemokine and a ligand that activates BLR1/CXCR5.
  - source_id: PMID:8978608
    title: A putative chemokine receptor, BLR1, directs B cell migration to defined lymphoid organs and specific anatomic compartments of the spleen.
    supporting_text: >-
      Our results identify the putative chemokine receptor BLR1 as the first G
      protein-coupled receptor involved in B cell migration and localization
      of these cells within specific anatomic compartments.
    statement: >-
      Blr1 (Cxcr5) knockout mice lack inguinal lymph nodes, have few or
      abnormal Peyer's patches, and show severely impaired lymphocyte
      migration into splenic follicles.
  - source_id: PMID:10917533
    title: A chemokine-driven positive feedback loop organizes lymphoid follicles.
    supporting_text: >-
      Using gene-targeted mice, we establish that B-lymphocyte chemoattractant
      (BLC/BCA1) and its receptor, CXCR5, are needed for B-cell homing to
      follicles in lymph nodes as well as in spleen.
    statement: >-
      Cxcl13- and Cxcr5-deficient mice establish the pair as required for
      B-cell homing to lymph node and splenic follicles, Cxcl13 as required for
      most lymph nodes and Peyer's patches, and a CXCL13-lymphotoxin
      alpha1beta2 positive feedback loop between B cells and follicular
      dendritic cells.
  - source_id: PMID:1425907
    title: Differentiation-specific expression of a novel G protein-coupled receptor from Burkitt's lymphoma.
    supporting_text: >-
      We have identified a complementary DNA clone which encodes a novel
      member of the superfamily of GTP-binding (G) protein-coupled receptors,
      designated BLR1.
    statement: >-
      Original cloning of human BLR1 (CXCR5) as an orphan G protein-coupled
      receptor related to the interleukin-8 receptors, expressed in Burkitt's
      lymphoma and lymphatic tissues.
  - source_id: PMID:11554781
    title: "Human B cell-attracting chemokine 1 (BCA-1; CXCL13) is an agonist for the human CXCR3 receptor."
    supporting_text: >-
      Together these data suggest that human BCA-1 is a specific and
      functional G-protein-linked chemotactic ligand for the human CXCR3
      receptor.
    statement: >-
      Boundary evidence. Reports human CXCL13 as an agonist of CXCR3 in
      transfected cell lines; this alternative receptor is outside the module
      boundary (see notes).
  - source_id: PANTHER:PTN002564680
    title: PAINT node PTN002564680 for CXC chemokines including CXCL13
    statement: >-
      Local PAINT IBD node in PTHR12015 (node taxon NCBITaxon:117571
      Euteleostomi) asserting C:GO:0005576, F:GO:0008009, F:GO:0045236,
      P:GO:0006954, P:GO:0030593, P:GO:0061844 and P:GO:0071222. Human CXCL13
      (UniProtKB:O43927) seeds C:GO:0005576, F:GO:0008009, F:GO:0045236 and
      P:GO:0061844; mouse Cxcl13 (MGI:MGI:1888499) seeds C:GO:0005576,
      F:GO:0008009 and F:GO:0045236. QuickGO lists this node as the WITH/FROM
      of every IBA row on human CXCL13.
  - source_id: PANTHER:PTN001628461
    title: PAINT node PTN001628461 for chemokine receptors including CXCR5
    statement: >-
      Local PAINT IBD node in PTHR10489 (node taxon not recorded in
      paint.tsv) asserting C:GO:0009897, F:GO:0016493, F:GO:0019957,
      P:GO:0006955, P:GO:0007204, P:GO:0019722 and P:GO:0060326. Mouse Cxcr5
      (MGI:MGI:103567) seeds only C:GO:0009897 and P:GO:0060326. QuickGO lists
      this node as the WITH/FROM of every IBA row on human CXCR5, including
      F:GO:0016493 C-C chemokine receptor activity and F:GO:0019957 C-C
      chemokine binding, which do not fit a CXC receptor whose only
      established chemokine ligand is CXCL13.
notes: >-
  Two-step ligand-receptor module for CXCL13 (PTHR12015:SF204) signaling
  through CXCR5 (PTHR10489:SF618), built for the lymph-node follicle case in
  projects/SPATIAL_CELL_COMMUNICATION.md. The ligand annoton uses GO:0008009
  (chemokine activity, an is_a descendant of GO:0048018 receptor ligand
  activity) rather than GO:0031724 (CXCR5 chemokine receptor binding), which
  GOA carries on human and mouse CXCL13 by IDA from PMID:9463416, following
  projects/LIGANDS_IN_SIGNALING.md section 2. The receptor annoton uses
  GO:0016494 (C-X-C chemokine receptor activity), which human and mouse CXCR5
  carry by IEA from InterPro; there is no CXCR5-specific receptor activity
  term. Modules are pan-species; the human and mouse proteins are
  representative members, and the taxon context is set to Mammalia because
  the ligand-receptor and follicle-homing evidence is from human and mouse
  (the PAINT node above CXCL13 sits at Euteleostomi but covers the whole CXC
  chemokine clade, so it does not date the CXCL13-CXCR5 pair itself).
  Cell types (follicular dendritic cell as sender, B cell as receiver) are
  recorded on the two nodes for the two-cell spatial evaluation; CXCL13 is
  also made by other stromal cells (for example marginal reticular cells)
  and CXCR5 is also on follicular helper T cells, which this module does not
  model separately. Pathway term. GO has no CXCL13- or CXCR5-specific
  signaling pathway term, so the module concept is the parent GO:0070098 and
  a child term is requested in proposed_new_terms. Boundary decisions.
  (1) CXCR3 as an alternative CXCL13 receptor (PMID:11554781, a single study
  in transfected cell lines in which CXCL13 did not induce a calcium flux) is
  out of scope; it is not modelled as a receptor variant. (2) Heterotrimeric
  Gi proteins and other downstream effectors of CXCR5 are generic chemokine
  receptor effectors and are covered by MODULE:chemokine_signaling; they are
  not repeated here. (3) The CXCL13-lymphotoxin alpha1beta2 positive feedback
  loop (PMID:10917533) involves the lymphotoxin/LTBR pathway in follicular
  dendritic cells and is described in prose only. (4) GO:0035754 (B cell
  chemotaxis) is attached to the annotons as the cellular outcome and is not
  a module concept, since many other chemokines also drive B cell chemotaxis.
  PAINT. The PAINT node above CXCR5 (PTN001628461) propagates C-C chemokine
  receptor activity (GO:0016493) and C-C chemokine binding (GO:0019957) to
  human CXCR5 by IBA; these look like over-propagation to a CXC receptor and
  should be examined in a PTHR10489 family review (not edited here).
  GO-CAM check (2026-11-23). No production GO-CAM in gocams/index.tsv
  contains CXCL13 or CXCR5: zero rows match gene_product UniProtKB:O43927,
  UniProtKB:P32302, UniProtKB:O55038, UniProtKB:Q04683, MGI:MGI:1888499 or
  MGI:MGI:103567, zero rows have gene_label CXCL13, CXCR5, Cxcl13 or Cxcr5,
  zero rows use GO:0031724 (CXCR5 chemokine receptor binding), GO:0045236
  (CXCR chemokine receptor binding), GO:0016494 (C-X-C chemokine receptor
  activity) or GO:0035754 (B cell chemotaxis), and no cached
  gocams/*/*-src.yaml mentions these accessions. The same queries return the
  positive controls UniProtKB:P10145 (CXCL8) and UniProtKB:P25025 (CXCR2),
  both in model 6246724f00001114 (IL8-mediated signaling pathway, Human), and
  GO:0008009 (chemokine activity, 32 rows) and GO:0070098 (19 rows) occur in
  other chemokine models (for example CXCL12-CXCR4 in 67e5e74400004191). The
  module therefore has no gocam_associations.
proposed_new_terms:
  - proposed_name: chemokine (C-X-C motif) ligand 13 signaling pathway
    proposed_definition: >-
      A chemokine-mediated signaling pathway initiated by C-X-C motif
      chemokine 13 (CXCL13) binding to a cell surface receptor, such as
      CXCR5, and ending with the regulation of a downstream cellular process,
      e.g. transcription.
    justification: >-
      GO has a ligand-specific term for CXCL12 (GO:0038146 chemokine (C-X-C
      motif) ligand 12 signaling pathway, is_a GO:0070098) but none for
      CXCL13, although CXCL13 signaling through CXCR5 is the defining
      chemokine pathway of B-cell follicles and is established by gain- and
      loss-of-function experiments in human cells and mice. Human and mouse
      CXCL13 and CXCR5 currently carry only the general GO:0070098, and this
      module's concept uses that parent.
    proposed_parent:
      id: GO:0070098
      label: chemokine-mediated signaling pathway
    supported_by:
      - reference_id: PMID:9463416
        supporting_text: >-
          In transfected cells, BCA-1 induced chemotaxis and Ca2+ mobilization
          demonstrating that it acts via BLR1.
      - reference_id: PMID:9486651
        supporting_text: >-
          Our results indicate that BLC functions as a BLR-1 ligand and may
          guide B lymphocytes to follicles in secondary lymphoid organs.
module:
