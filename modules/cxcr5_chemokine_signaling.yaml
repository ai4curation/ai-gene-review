        id: GO:0070098
        label: chemokine-mediated signaling pathway
      description: >-
        Series of molecular signals initiated by secreted CXCL13 binding to the
        G protein-coupled receptor CXCR5 on B cells, leading to calcium
        mobilization and chemotaxis into lymphoid follicles. GO has no more
        specific CXCL13 or CXCR5 pathway term (see proposed_new_terms).
