id: MODULE:dmel_irm_myoblast_adhesion
title: IRM adhesion complexes in Drosophila melanogaster
description: >-
  The IRM (Irre cell recognition module) proteins are four immunoglobulin- superfamily adhesion
  receptors that bind each other in trans between neighbouring cells. Kin of irre (Kirre,
  also called Dumbfounded) and Roughest (Rst) form one pair of paralogs, and Sticks and stones
  (Sns) and Hibris (Hbs) the other; each Kirre/Rst protein can bind each Sns/Hbs protein.
  In the embryonic mesoderm, Kirre and Rst on founder cells bind Sns and Hbs on fusion-competent
  myoblasts to attract them and initiate myoblast fusion. The same heterophilic pairs pattern
  the interommatidial cells of the eye and, in nephrocytes, Sns and Kirre form the slit diaphragm.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001980
  title: 'FlyBase gene group IRM-CAM: Irm adhesion complexes'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as irm adhesion complexes (IRM-CAM);
    this module models that group.
- source_id: GO:0007520
  title: myoblast fusion
  statement: >-
    GO term grounding the module as myoblast fusion.
- source_id: GO:0098609
  title: cell-cell adhesion
  statement: >-
    GO term grounding the module as cell-cell adhesion.
notes: >-
  Each pair is formed in trans between a Kirre/Rst protein on one cell and an Sns/Hbs protein
  on the neighbouring cell, so each gene appears in two of the four pairs. Downstream fusion
  machinery (for example the WAVE and WASp Arp2/3 activators and their adaptors) is context
  and not part of this module. The contribution of each pair differs between tissues; in myoblast
  fusion Kirre and Rst act redundantly in founder cells, and Sns has the major role in fusion-competent
  myoblasts. FlyBase groups realized by this module: IRM-CAM (FBgg0001980). Subgroups folded
  into it: HK-CAM, RS-CAM, HR-CAM, SK-CAM. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_irm_myoblast_adhesion.yaml; none of the member genes has a gene review
  yet unless noted.
