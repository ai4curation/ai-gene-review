  - order: 2
    role: conversion of DAHP to EPSP (five central reactions)
    node:
      id: dahp_to_epsp
      label: DAHP to 5-enolpyruvylshikimate 3-phosphate
      module_type: METABOLIC_PATHWAY
      description: >-
        3-dehydroquinate synthase, 3-dehydroquinate dehydratase, shikimate dehydrogenase,
        shikimate kinase and EPSP synthase act in that order. The chemistry is invariant;
        the protein architecture is the main lineage variable and is modelled as an explicit
        variant set.
