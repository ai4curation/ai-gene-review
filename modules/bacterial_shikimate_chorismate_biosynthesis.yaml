          - source_id: PMID:2825635
            statement: The S. cerevisiae ARO1 product is a mosaic of five monofunctional domains.
            supporting_text: >-
              The observed homologies demonstrate that the arom polypeptide is a mosaic of
              functional domains
          - source_id: PMID:14711585
            statement: >-
              Toxoplasma gondii also encodes a pentafunctional AROM, suggesting an ancient
              eukaryotic origin.
            supporting_text: >-
              suggesting that the arom is an ancient supergene present in early eukaryotes
              and subsequently lost or replaced in a number of lineages
