                  term:
                    id: GO:0003856
                    label: 3-dehydroquinate synthase activity
                  substrates:
                  - preferred_term: 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP)
                  products:
                  - preferred_term: 3-dehydroquinate
                  - preferred_term: phosphate
                  evidence:
