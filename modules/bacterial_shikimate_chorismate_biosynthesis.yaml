id: MODULE:bacterial_shikimate_chorismate_biosynthesis
title: Shikimate pathway to chorismate
description: >-
  Seven-step shikimate pathway that converts phosphoenolpyruvate and D-erythrose 4-phosphate
  to chorismate in bacteria, fungi, plants and apicomplexan protists. DAHP synthase condenses
  the two central-carbon precursors and is the main point of feedback control; 3-dehydroquinate
  synthase, 3-dehydroquinate dehydratase, shikimate dehydrogenase, shikimate kinase and EPSP
  synthase then build 5-enolpyruvylshikimate 3-phosphate, and chorismate synthase performs
  a reduced-flavin-dependent elimination to give chorismate. The reaction chain is invariant,
  but its enzyme architecture differs by lineage: bacteria use separate enzymes (with either
  type I or type II dehydroquinases), plants fuse dehydroquinase and shikimate dehydrogenase
  in one polypeptide, and fungi and apicomplexa carry the five central activities on a single
  pentafunctional AROM polypeptide. In plants the pathway is plastidic; in fungi it is cytosolic.
  Chorismate is the branch point for phenylalanine, tyrosine, tryptophan, folate, ubiquinone
  and other aromatic compounds, which are outside this module.
status: DRAFT
