notes: >-
  GENERALIZE from YeastPathways ARO-PWY-1 (2026-10). The slug is kept for link stability even
  though the module is no longer bacterial-only; title, label and taxon context now cover
  bacteria, fungi, plants and apicomplexa. The former four-part bacterial structure was reorganised
  into three parts: DAHP synthase (enzyme-family variant set), the five central reactions
  (an architecture variant set: separate enzymes versus the pentafunctional AROM), and chorismate
  synthase. Steps are linked with PRECEDES. The separate-enzyme variant now has a type I versus
  type II dehydroquinase variant set; the plant bifunctional DHQ-SDH (Q9SQT8) is listed under
  both the type I dehydroquinase and shikimate dehydrogenase annotons. YeastCyc check: the
  seven reactions and the ARO3/ARO4, ARO1 and ARO2 assignments are all correct; no enzymes
  are missing. Compartment: every activity is cytosolic in both yeast GO-CAMs; in plants the
  pathway is plastidic, so the module asserts no compartment. GO-CAM disagreements: the PomBase
  model types aro7 chorismate mutase as part_of GO:0009423 (chorismate biosynthesis); chorismate
  mutase consumes chorismate and is modelled in phenylalanine_tyrosine_biosynthesis. PomBase
  names SPAP8A3.07c aro3 and SPAC24H6.10c aro4, whereas UniProt gives the gene name aro4 to
  SPAP8A3.07c; this module follows PomBase. The YeastPathways model has no causal or input/output
  links between activities. Pseudomonas putida KT2440 exemplars are kept from the earlier
  bacterial version. KT2440 has three DAHP synthases in two unrelated families, three type
  II dehydroquinases, and five PTHR21089 proteins. PP_2608/Q88JP1 (RifI2) is deliberately
  excluded from the shikimate dehydrogenase annoton (PMID:23142411), although the PTHR21089
  family selector does not enforce that exclusion. The PP_2406/PP_2407 and PP_3002/PP_3003
  SDH/dehydroquinase pairs have the gene arrangement typical of quinate/shikimate catabolism
  and are candidate rather than established biosynthetic implementations. AroA/PP_1770 is
  a fusion; only its EPSP synthase activity belongs here.
