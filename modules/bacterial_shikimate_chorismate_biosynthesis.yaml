            A single AROM polypeptide carries all five activities. Its domain order along
            the chain (3-dehydroquinate synthase, EPSP synthase, shikimate kinase, type I
            dehydroquinase, shikimate dehydrogenase) differs from reaction order, which is
            modelled here.
