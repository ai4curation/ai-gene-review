id: MODULE:bacterial_shikimate_chorismate_biosynthesis
title: Bacterial shikimate and chorismate biosynthesis
description: >-
  Reusable bacterial module for conversion of phosphoenolpyruvate and
  erythrose 4-phosphate to chorismate through the seven-step shikimate pathway.
  Chorismate is the branch-point precursor for aromatic amino acids, folate,
  ubiquinone, and other metabolites; those downstream branches are outside this
  module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009423
    title: chorismate biosynthetic process
    statement: >-
      GO:0009423 grounds the conserved pathway from central-carbon precursors
      through shikimate to chorismate.
  - source_id: KEGG:ppu00400
    title: Pseudomonas putida KT2440 phenylalanine, tyrosine and tryptophan biosynthesis
    statement: >-
      KEGG ppu00400 identifies the KT2440 shikimate-pathway enzymes and their
      aromatic-amino-acid branches.
notes: >-
  KT2440 contains three DAHP-synthase-family proteins, three type-II
  dehydroquinases, and four shikimate-dehydrogenase-family proteins. These are
  represented as alternative family members rather than duplicated pathway
  steps. AroA/PP_1770 is a fusion containing EPSP synthase and prephenate
  dehydrogenase regions; only its EPSP-synthase activity belongs to this module.
module:
