  statement: >-
    YeastCyc lists the seven reactions with ARO3 and ARO4 (DAHP synthase), ARO1 (five central
    reactions) and ARO2 (chorismate synthase). All gene assignments were retained; no enzymes
    are missing.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARO-PWY-1
- source_id: KEGG:ppu00400
  title: Pseudomonas putida KT2440 phenylalanine, tyrosine and tryptophan biosynthesis
  statement: Identifies the KT2440 shikimate-pathway enzymes retained as bacterial exemplars.
- source_id: PMID:1943992
  title: >-
    Aromatic amino acid biosynthesis in the yeast Saccharomyces cerevisiae: a model system
    for the regulation of a eukaryotic biosynthetic pathway.
  statement: >-
    Review of the yeast gene-enzyme relationships and regulation; cited by YeastPathways.
  supporting_text: >-
    Most reactions of this branched pathway are common to all organisms which are able to
    synthesize tryptophan, phenylalanine, and tyrosine.
- source_id: PMID:2825635
  title: >-
    The pentafunctional arom enzyme of Saccharomyces cerevisiae is a mosaic of monofunctional
    domains.
  statement: ARO1 encodes the 1588-residue pentafunctional AROM polypeptide.
  supporting_text: >-
    The protein sequence deduced for the pentafunctional arom polypeptide is 1588 amino acids
    in length
- source_id: PMID:2880280
  title: Cloning of the ARO3 gene of Saccharomyces cerevisiae and its regulation.
  statement: >-
    ARO3 and ARO4 encode two DAHP synthase isozymes; ARO3 is the phenylalanine-dependent isozyme.
  supporting_text: Gene ARO3, coding for the phenylalanine-dependent isozyme of DAHP synthase
- source_id: PMID:8971708
  title: Saccharomyces cerevisiae chorismate synthase has a flavin reductase activity.
  statement: Fungal chorismate synthases carry an intrinsic flavin reductase activity.
  supporting_text: it is shown that the protein is also bifunctional
- source_id: PMID:16784230
  title: >-
    Structure of Arabidopsis dehydroquinate dehydratase-shikimate dehydrogenase and implications
    for metabolic channeling in the shikimate pathway.
  statement: >-
    Plants fuse dehydroquinase and shikimate dehydrogenase in one bifunctional DHQ-SDH.
  supporting_text: >-
    The bifunctional enzyme dehydroquinate dehydratase-shikimate dehydrogenase (DHQ-SDH) catalyzes
    the dehydration of dehydroquinate to dehydroshikimate
- source_id: PMID:14711585
  title: >-
    A complete shikimate pathway in Toxoplasma gondii: an ancient eukaryotic innovation.
  statement: Apicomplexa carry a fungal-type pentafunctional AROM.
  supporting_text: >-
    The molecular arrangement and phylogeny of the proteins suggests homology with the eukaryotic
    fungal enzymes, including a pentafunctional AROM.
- source_id: PMID:22554242
  title: The shikimate pathway and aromatic amino Acid biosynthesis in plants.
  statement: Plant shikimate pathway organisation and regulation.
  supporting_text: All three AAAs are derived from the shikimate pathway
- source_id: PMID:23142411
  title: >-
    Insights into the function of RifI2: structural and biochemical investigation of a new
    shikimate dehydrogenase family protein.
  statement: >-
    PP_2608/Q88JP1 (RifI2) is a PTHR21089 member excluded from the AroE annoton: it is kinetically
    distinct from AroE and NAD(+)-preferring.
  supporting_text: >-
    RifI2 exhibits much lower activity using shikimate as a substrate than AroE, and a strong
    preference for NAD(+) instead of NADP(+) as a cofactor.
