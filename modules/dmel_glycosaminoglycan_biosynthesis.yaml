notes: >-
  Boundary. The module joins three FlyBase groups: heparan sulfate proteoglycan biosynthesis
  (GAHSB), chondroitin sulfate proteoglycan biosynthesis (GACSB) and the EXT1-EXT2 complex.
  Core proteins, the PAPS synthesis and transport machinery (Papss, Papst1, Papst2), UDP-sugar
  transporters and the extracellular 6-O-endosulfatase Sulf1 are not parts. Molecular functions
  are assigned where the fly enzyme or its well-studied ortholog has an established activity;
  beta3GalTII, Csgalnact, Chsy, Chpf and C4st and the Ttv-Sotv complex are left without a
  function term (the copolymerase has two activities that no single GO term captures). Hs3st-A
  has no UniProt entry in the FlyBase mapping and is grounded to its FlyBase gene id. FlyBase
  groups realized by this module: EXT1-EXT2 (FBgg0001998), GACSB (FBgg0002060), GAHSB (FBgg0002062).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_glycosaminoglycan_biosynthesis.yaml;
  none of the member genes has a gene review yet unless noted.
