id: MODULE:dmel_glycosaminoglycan_biosynthesis
title: Heparan sulfate and chondroitin sulfate proteoglycan biosynthesis in Drosophila melanogaster
description: >-
  Heparan sulfate and chondroitin sulfate chains are built in the endoplasmic reticulum and
  Golgi on serine residues of core proteins such as the glypicans Dally and Dally-like, Syndecan
  and Perlecan. Both start on a shared tetrasaccharide linker (xylose-galactose-galactose-glucuronic
  acid) made by Oxt, beta4GalT7, beta3GalTII and GlcAT-I. Addition of N-acetylglucosamine
  by Brother of tout-velu (Botv) commits the chain to heparan sulfate; the Tout-velu (Ttv)
  and Sister of tout-velu (Sotv) exostosin complex then polymerizes alternating glucuronic
  acid and N-acetylglucosamine. The chain is modified by the N-deacetylase/N-sulfotransferase
  Sulfateless (Sfl), the C5-epimerase Hsepi and the 2-O-, 6-O- and 3-O-sulfotransferases (Hs2st,
  Hs6st, Hs3st-A, Hs3st-B). Addition of N-acetylgalactosamine by Csgalnact instead starts
  chondroitin chains, which are polymerized by Chsy and Chpf and sulfated by C4st. Heparan
  sulfate made by this pathway is required for Wingless, Hedgehog, Dpp and FGF signaling in
  Drosophila.
status: DRAFT
scope: CONCRETE
