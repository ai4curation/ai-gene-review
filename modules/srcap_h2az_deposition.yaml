id: MODULE:srcap_h2az_deposition
title: Human SRCAP complex — ATP-dependent exchange of nucleosomal H2A-H2B for H2A.Z-H2B by the SRCAP ATPase, the RUVBL1-RUVBL2 ring, the YL1 (VPS72) H2A.Z chaperone with ARP6 and ZNHIT1, and the ACTL6A-actin-DMAP1-GAS41 module; SRCAP/RUVBL1/RUVBL2/VPS72/ACTR6/ZNHIT1/ACTL6A/ACTB/DMAP1/YEATS4
description: >-
  The SRCAP complex is the human SWR1-type chromatin remodeler. It replaces a canonical
  H2A-H2B dimer in a nucleosome with a dimer of the histone variant H2A.Z and H2B, which
  places H2A.Z in the nucleosomes that flank promoters and other regulatory elements.
  The complex has about ten subunits. The SNF2-family ATPase SRCAP is the scaffold and
  motor: its split ATPase domain engages nucleosomal DNA, and the long insertion between
  its two ATPase lobes threads into a hexameric ring of the AAA+ ATPases RUVBL1 and
  RUVBL2. A module of YL1 (VPS72), the actin-related protein ARP6 (ACTR6) and ZNHIT1 binds
  the incoming H2A.Z-H2B dimer: YL1 is an H2A.Z-specific deposition chaperone, and
  ARP6 and ZNHIT1 are needed for complex integrity and nucleosome binding. A second
  module of ACTL6A, actin and the SANT-domain protein DMAP1 binds the helicase-SANT-
  associated helix of SRCAP, together with the YEATS-domain acetyl-histone reader GAS41
  (YEATS4). The complex has no acetyltransferase subunit. The
  same exchange chemistry is performed in a different setting by the p400 (EP400)
  ATPase within the TIP60 complex, which shares the RUVBL1-RUVBL2 ring, YL1, DMAP1, GAS41,
  ACTL6A and actin but lacks ARP6 and ZNHIT1.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001339
    title: chromatin remodeling pathway
    statement: >-
      RGD's chromatin remodeling pathway groups ATP-dependent remodelers into four
      families (SWI/SNF, INO80 (SWR1), ISWI and CHD). This module models the SRCAP
      (SWR1-type) branch of the INO80/SWR1 family. RGD curates SRCAP, ZNHIT1, VPS72,
      YEATS4, DMAP1, ACTR6, RUVBL1, RUVBL2, ACTL6A and ACTB to PW:0001339; all ten are
      modelled. Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001339.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001339.yaml
    statement: RGD's pathway text names the four ATP-dependent remodeler families.
    supporting_text: 'The four families/complexes are: SWI/SNF, INO80(SWRI), ISWI and CHD.'
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      The GO process mapped to PW:0001339 (skos:closeMatch, from the PW definition
      cross-reference and a label match, projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml).
      It is the process of the catalytic annoton. GO obsoleted histone exchange
      (GO:0043486) as a function rather than a process, so there is no more specific
      process term.
  - source_id: GO:0000812
    title: Swr1 complex
    statement: >-
      The GO complex term for the SWR1-type H2A.Z exchange complex; the SRCAP subunits
      carry IDA rows for it in human GOA.
  - source_id: PMID:16634648
    title: Purification of a human SRCAP complex that remodels chromatin by incorporating the histone variant H2A.Z into nucleosomes.
    statement: >-
      Native human SRCAP complex, with a subunit composition similar to yeast SWR-C,
      performs ATP-dependent exchange of H2A.Z-H2B dimers into nucleosomes.
    supporting_text: this SRCAP-containing complex supports ATP-dependent exchange of histone dimers containing H2B and H2A.Z into mononucleosomes reconstituted with recombinant H2A, H2B, H3, and H4
  - source_id: PMID:30337683
    title: Cryo-EM structure of human SRCAP complex.
    statement: Defines the ten-subunit composition and the head, C and N modules used for the parts.
    supporting_text: SRCAP-C is an ~1 MDa complex consisting of 10 components including SRCAP, DMAP1, YL1, RUVBL1, RUVBL2, ACTL6A, ARP6, ACTIN, GAS41 and ZNHIT1
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling pathway)
  through the RGD_PATHWAY_ONTOLOGY project. PW:0001339 has no diagram genes and curates
  74 human genes that span all four SNF2 remodeler families (BAF/PBAF, INO80 and SWR1,
  ISWI, CHD/NuRD), so the project models one human module per complex group rather than
  one module for the pathway. This module is the SRCAP group. The sister module
  tip60_p400_complex models the p400 (EP400) ATPase in the TIP60 complex; the INO80
  complex, BAF/PBAF, ISWI and CHD/NuRD complexes are drafted separately. RGD genes
  modelled here: SRCAP, ZNHIT1, VPS72, YEATS4, DMAP1, ACTR6, RUVBL1, RUVBL2, ACTL6A and
  ACTB. ACTL6A and actin are included because the cryo-EM structure lists both as
  subunits (PMID:30337683). The shared subunits RUVBL1-RUVBL2, VPS72, the ACTL6A-actin-DMAP1
  module and YEATS4 are written identically in this module and in tip60_p400_complex.
  Molecular functions were taken from each subunit's experimental GOA rows in QuickGO
  (November 2026). The SRCAP annoton carries ATP-dependent H2AZ histone chaperone
  activity, a descendant of the ATP-dependent chromatin remodeler activity that SRCAP
  has by IDA (PMID:17617668); the more specific term is authored here from the
  reconstituted exchange reaction (PMID:16634648) and matches the IMP row of yeast Swr1
  for the same term. RUVBL1 and RUVBL2 carry their experimental ATP hydrolysis activity,
  VPS72 its histone chaperone activity (IMP, PMID:26974126) and YEATS4 its H3K27ac reader
  activity (IDA, PMID:30071723). ACTR6, ZNHIT1, ACTL6A, actin and DMAP1 have no
  experimental molecular function in human GOA that describes their role in this
  complex (DMAP1 has a transcription-factor binding row and ZNHIT1 a histone binding
  row, neither informative here), so they are units without a function and their roles
  are given in prose.

  Boundary decisions. (1) H2A.Z is the target, not a part. H2AZ1 and H2AZ2 are the
  cargo of the exchange reaction: the complex binds the free H2A.Z-H2B dimer and leaves
  it in the nucleosome, and H2A.Z performs no step of the exchange. Applying the
  substrate-versus-participant rule of the project guidelines: the entity that performs
  the step is the SRCAP ATPase with the YL1 chaperone; the comparator check shows that
  neither human H2AZ1 and H2AZ2 nor yeast Htz1 is annotated part_of Swr1 complex in GOA
  (all three are part_of nucleosome), while the remodeler subunits are; and the
  co-purification of an endogenous H2A.Z-H2B dimer with the complex (PMID:30337683) is a
  loaded intermediate, not a subunit. H2A.Z therefore appears as the cargo of the SRCAP
  and VPS72 functions. Neither histone is on the RGD list. (2) Transcriptional
  coactivation is context. SRCAP was first described as a CBP-interacting coactivator
  and carries IDA transcription coactivator rows; GO-CAM gomodel:682fbcd000002112 models
  that coactivator role in cAMP/PKA signalling. It is the downstream consequence of
  H2A.Z deposition at promoters, not a part of the exchange machinery, and is not
  linked here. (3) Other SWR1-family subunits. CFDP1 (BCNT, the Swc5 homologue) has only
  IBA rows for Swr1 complex and is not on the RGD list or in the structure's subunit list,
  so it is named but not modelled. ANP32E, a chaperone that removes H2A.Z from
  chromatin (PMID:24463511), acts in the opposite direction and associates with the
  p400/TIP60 complex; it is excluded. (4) INO80 shares RUVBL1, RUVBL2 and ACTL6A with this
  complex and can also exchange histone dimers; it is modelled by another module and not
  here. (5) DNA repair and muscle-gene activation (ZNHIT1 phosphorylation by p38 MAPK,
  PMID:20473270) are biological contexts of H2A.Z deposition and are not modelled as
  parts. (6) Submodule grouping into the ATPase, RUVBL ring, YL1-ARP6-ZNHIT1 module and
  actin module follows the head, C and N modules of PMID:30337683. PANTHER family ids and
  PTNs are deliberately not asserted.

  GO-CAM links. No human GO-CAM in gocams/index.tsv models the SRCAP exchange activity.
  SRCAP appears only in gomodel:682fbcd000002112 as a transcription coactivator (decision
  2). The seed's best_gocam lead, gomodel:617b481400000460 (KAT5 in homologous
  recombination), concerns the TIP60 complex and DNA repair and is not linked here.
module:
  id: srcap_h2az_deposition
  label: Human SRCAP H2A.Z exchange complex
  module_type: PROTEIN_COMPLEX
  description: >-
    SWR1-type complex in which the SRCAP ATPase exchanges nucleosomal H2A-H2B for
    H2A.Z-H2B delivered by the YL1 chaperone.
  concepts:
    - preferred_term: Swr1 complex
      term:
        id: GO:0000812
        label: Swr1 complex
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: SNF2-family ATPase motor and scaffold
      node:
        id: srcap_atpase
        label: SRCAP ATPase
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: srcap_exchange_atpase
            label: SRCAP exchanges H2A-H2B for H2A.Z-H2B
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SRCAP
                term:
                  id: UniProtKB:Q6ZRS2
                  label: Chromatin remodeling protein SRCAP
            function:
              preferred_term: ATP-dependent H2AZ histone chaperone activity
              term:
                id: GO:0140849
                label: ATP-dependent H2AZ histone chaperone activity
              cargo:
                - preferred_term: histone H2A.Z (H2AZ1)-H2B dimer
                  term:
                    id: UniProtKB:P0C0S5
                    label: Histone H2A.Z
                - preferred_term: histone H2A.V (H2AZ2)-H2B dimer
                  term:
                    id: UniProtKB:Q71UI9
                    label: Histone H2A.V
              targets:
                - preferred_term: canonical H2A-containing nucleosome
                  description: The H2A-H2B dimer of the nucleosome is evicted and replaced by H2A.Z-H2B.
            processes:
              - preferred_term: chromatin remodeling
                term:
                  id: GO:0006338
                  label: chromatin remodeling
            role_description: >-
              Scaffold and motor of the complex. The split SNF2 ATPase domain binds
              nucleosomal DNA and drives the exchange; the insertion between its lobes
              (about residues 910-2036) forms a ring that packs against the
              RUVBL1-RUVBL2 hexamer and links it to ARP6. The complex exchanges dimers
              without sliding the nucleosome.
            evidence:
              - source_id: PMID:16634648
                statement: The native SRCAP complex catalyses ATP-dependent exchange of H2A.Z-H2B dimers into nucleosomes.
                supporting_text: this SRCAP-containing complex supports ATP-dependent exchange of histone dimers containing H2B and H2A.Z into mononucleosomes
              - source_id: PMID:17617668
                statement: SRCAP binds promoters and its knockdown reduces H2A.Z deposition there.
                supporting_text: Thus, these studies provide the first evidence that SRCAP is recruited to promoters and is critical for the deposition of H2A.Z.
              - source_id: PMID:30337683
                statement: SRCAP-C incorporates H2A.Z-H2B and evicts H2A-H2B stepwise.
                supporting_text: Swr1-C/SRCAP-C incorporates H2A.Z/H2B dimer into canonical nucleosomes coupled with the eviction of H2A/H2B dimer in a stepwise exchange manner
    - order: 2
      role: AAA+ ATPase ring (head module)
      node:
        id: srcap_ruvbl_ring
        label: RUVBL1-RUVBL2 ring
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: ruvbl1_ruvbl2_hexamer
            label: RUVBL1-RUVBL2 heterohexameric AAA+ ATPase ring
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: RUVBL1-RUVBL2 heterohexamer
                active_units:
                  - id: ruvbl1
                    label: RUVBL1 (TIP49a, pontin)
                    stoichiometry: '3'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL1
                        term:
                          id: UniProtKB:Q9Y265
                          label: RuvB-like 1
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: ruvbl2
                    label: RUVBL2 (TIP49b, reptin)
                    stoichiometry: '3'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL2
                        term:
                          id: UniProtKB:Q9Y230
                          label: RuvB-like 2
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
            role_description: >-
              Three RUVBL1-RUVBL2 heterodimers form the hexameric head of the
              SWR1-type exchange machinery. The insertion between the two lobes of the
              SNF2-family ATPase (SRCAP or EP400) threads into the ring, which anchors
              the H2A.Z-H2B chaperone VPS72 and the ATPase C-lobe. The ring is a
              structural hub in this context; its own ATP hydrolysis is measured in
              vitro, but no step of histone exchange is known to be driven by it. The
              same hexamer is also a subunit of INO80 and of the R2TP chaperone, which
              are outside this module.
            evidence:
              - source_id: PMID:30337683
                statement: In the SRCAP complex the hexameric RUVBL1-RUVBL2 ring forms the head that the SRCAP insert associates with.
                supporting_text: The head consists of a single hexameric ring formed by three copies of RUVBL1-RUVBL2 heterodimer
              - source_id: PMID:39260417
                statement: In TIP60-C the same hexamer forms the core of the SWR1-like part, bound by the EP400 ATPase C-lobe and its insertion.
                supporting_text: The SWR1L subcomplex is dominated by a hetero-hexameric core of the RuvBL1 and RuvBL2 subunits as found in yeast8 (Fig. 1b).
    - order: 3
      role: H2A.Z-H2B binding module (C module)
      node:
        id: srcap_c_module
        label: YL1-ARP6-ZNHIT1 H2A.Z-binding module
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: vps72_h2az_chaperone
            label: VPS72 (YL1) holds the H2A.Z-H2B dimer for deposition
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VPS72 (YL1)
                term:
                  id: UniProtKB:Q15906
                  label: Vacuolar protein sorting-associated protein 72 homolog
            function:
              preferred_term: histone chaperone activity
              term:
                id: GO:0140713
                label: histone chaperone activity
              cargo:
                - preferred_term: histone H2A.Z (H2AZ1)-H2B dimer
                  term:
                    id: UniProtKB:P0C0S5
                    label: Histone H2A.Z
                - preferred_term: histone H2A.V (H2AZ2)-H2B dimer
                  term:
                    id: UniProtKB:Q71UI9
                    label: Histone H2A.V
            role_description: >-
              The Swc2-family subunit shared by SRCAP-C and TIP60-C. Its N-terminal
              domain binds the H2A.Z-H2B dimer specifically, through the extended
              acidic patch and the DNA-binding surface of the dimer, and holds it on
              the complex before it is transferred into the nucleosome. A long
              extended region then intercalates into the RUVBL1-RUVBL2 ring, and in
              TIP60-C a C-terminal domain bridges the SWR1-like and NuA4-like parts by
              binding DMAP1.
            evidence:
              - source_id: PMID:26974126
                statement: YL1 is a specific H2A.Z-deposition chaperone that recognises the H2A.Z-H2B dimer (crystal structure of human YL1-H2A.Z-H2B).
                supporting_text: Here, we identify YL1 as a specific H2A.Z-deposition chaperone.
              - source_id: PMID:39260417
                statement: In TIP60-C the N-terminal domain of YL1/VPS72 holds the H2A.Z-H2B dimer before deposition.
                supporting_text: The N-terminal domain of the YL1/VPS72 subunit holds the H2A.Z–H2B dimer before its deposition into the nucleosome (Fig. 2a).
              - source_id: PMID:15647280
                statement: YL1 was identified as a shared subunit of the TRRAP/TIP60 HAT complex and of the SRCAP complex.
                supporting_text: YL1 is also a component of a novel mammalian multiprotein complex that includes the SNF2-related helicase SRCAP
          - id: arp6_znhit1
            label: ARP6 and ZNHIT1, SRCAP-specific nucleosome-binding subunits
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ARP6-ZNHIT1 (Arp6-Swc6 homologues)
                active_units:
                  - id: actr6
                    label: ARP6 (ACTR6)
                    role: Actin-related protein that binds the SRCAP insertion helices; its basic surface is proposed to contact nucleosomal DNA.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTR6
                        term:
                          id: UniProtKB:Q9GZN1
                          label: Actin-related protein 6
                  - id: znhit1
                    label: ZNHIT1 (p18Hamlet; Swc6 homologue)
                    role: Zinc-finger HIT subunit that binds ARP6 and H2A.Z; needed for complex integrity and H2A.Z accumulation at target promoters.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZNHIT1
                        term:
                          id: UniProtKB:O43257
                          label: Zinc finger HIT domain-containing protein 1
            role_description: >-
              The Arp6-Swc6 pair of yeast SWR1. These two subunits distinguish SRCAP-C
              from TIP60-C, in which the Swc6-Arp6 dimer is absent. Their roles are
              structural (complex integrity and nucleosome binding); neither has an
              informative experimental molecular function in human GOA.
            evidence:
              - source_id: PMID:30337683
                statement: The C module of SRCAP-C contains YL1, ARP6 and ZNHIT1.
                supporting_text: a C module containing YL1, ARP6 and ZNHIT1
              - source_id: PMID:20473270
                statement: ZNHIT1 (p18Hamlet) is a SRCAP subunit, interacts with H2A.Z, and is required for H2A.Z accumulation at the myogenin promoter.
                supporting_text: We also show that p18 Hamlet is required for H2A.Z accumulation into this genomic region and for subsequent muscle gene transcriptional activation.
              - source_id: PMID:39260417
                statement: The Swc6-Arp6 dimer is absent from TIP60-C.
                supporting_text: The Swc6–Arp6 dimer that appears in yeast at the hexamer face opposing the ATPase C-lobe is absent in TIP60-C
    - order: 4
      role: actin module and acetyl-histone reader (N module)
      node:
        id: srcap_n_module
        label: ACTL6A-actin-DMAP1-GAS41 module
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: actin_module_actl6a_actb_dmap1
            label: Actin module (ACTL6A, beta-actin, DMAP1) on the ATPase HSA helix
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ACTL6A-actin-DMAP1 actin module
                active_units:
                  - id: actl6a
                    label: ACTL6A (BAF53A; Arp4 homologue)
                    role: Actin-related protein bound with actin to the HSA helix of the SNF2-family ATPase.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTL6A
                        term:
                          id: UniProtKB:O96019
                          label: Actin-like protein 6A
                  - id: actb
                    label: Beta-actin (nuclear actin)
                    role: Monomeric actin bound with ACTL6A to the HSA helix.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTB
                        term:
                          id: UniProtKB:P60709
                          label: Actin, cytoplasmic 1
                  - id: dmap1
                    label: DMAP1 (Swc4/Eaf2 homologue)
                    role: SANT-domain subunit that envelops the actin module and contacts VPS72.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DMAP1
                        term:
                          id: UniProtKB:Q9NPF5
                          label: DNA methyltransferase 1-associated protein 1
            role_description: >-
              The actin module binds the helicase-SANT-associated (HSA) helix of the
              ATPase (SRCAP or EP400). It is a structural subassembly; none of its
              three subunits has an experimental molecular function in human GOA that
              describes its role here, so the units carry no function. The same
              ACTL6A and actin subunits are also part of BAF/PBAF and INO80, which are
              separate modules. Actin is represented by beta-actin (ACTB), the actin
              that RGD lists; the structures do not distinguish beta- from
              gamma-actin.
            evidence:
              - source_id: PMID:30337683
                statement: SRCAP-C comprises ten subunits, with an N module of ACTL6A, actin, DMAP1 and GAS41.
                supporting_text: an N module containing ACTL6A, ACTIN, DMAP1 and GAS41
              - source_id: PMID:39260417
                statement: In TIP60-C the actin module comprises actin, ACTL6A and DMAP1 on the EP400 HSA helix.
                supporting_text: In TIP60-C, the actin module, which comprises two ARPs (actin and actin-like protein 6A (ACL6A)), the DMAP1 subunit
          - id: yeats4_acetyl_reader
            label: YEATS4 (GAS41) reads acetylated histone H3
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: YEATS4 (GAS41)
                term:
                  id: UniProtKB:O95619
                  label: YEATS domain-containing protein 4
            function:
              preferred_term: histone H3K27ac reader activity
              term:
                id: GO:0140119
                label: histone H3K27ac reader activity
            role_description: >-
              Yaf9-family YEATS-domain subunit shared by SRCAP-C and TIP60-C. Its
              YEATS domain binds acetylated H3K18 and H3K27 (both carry IDA reader rows
              in human GOA; the H3K27ac term is used here), and the coiled-coil dimer
              binds di-acetylated H3 with higher affinity. It is flexibly attached and
              is not resolved in the TIP60-C structure. Reading acetylated chromatin is
              proposed to help target H2A.Z exchange to acetylated promoter
              nucleosomes.
            evidence:
              - source_id: PMID:30071723
                statement: The GAS41 YEATS domain binds acetylated H3 peptides and prefers H3K18ac and H3K27ac.
                supporting_text: the YEATS domain of GAS41 binds acetylated histone peptides with moderate, mid-micromolar affinities, and preferentially recognizes acetylated H3K18 and H3K27
              - source_id: PMID:30337683
                statement: GAS41 is in the N module of SRCAP-C.
                supporting_text: an N module containing ACTL6A, ACTIN, DMAP1 and GAS41
  connections:
    - source: srcap_c_module
      target: srcap_atpase
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        YL1 holds the free H2A.Z-H2B dimer on the complex and hands it to the
        nucleosome engaged by the SRCAP ATPase.
knowledge_gaps:
  - gap_statement: >-
      How the SRCAP ATPase couples DNA translocation to eviction of the H2A-H2B dimer
      without sliding the nucleosome, and which subunits (ARP6, ZNHIT1, the SRCAP
      insertion) prevent sliding, is not resolved; the human structure lacks a bound
      nucleosome.
    gap_kind:
      - BIOLOGY
