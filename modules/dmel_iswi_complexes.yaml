id: MODULE:dmel_iswi_complexes
title: ISWI chromatin remodeling complexes in Drosophila melanogaster
description: >-
  ISWI is an ATP-dependent chromatin remodeler that slides nucleosomes. In Drosophila the
  single ISWI ATPase is the catalytic subunit of several complexes defined by their accessory
  subunits. ACF (with Acf) and CHRAC (Acf plus the histone-fold pair Chrac-14 and Chrac-16)
  assemble and space regularly arrayed nucleosomes. NURF (with the large subunit E(bx)/NURF301,
  Caf1-55 and the pyrophosphatase Nurf-38) helps activate transcription of target genes, for
  example in ecdysone and JAK/STAT signaling. RSF, NORC and TORC (with Toutatis and CtBP)
  are further ISWI complexes; TORC is linked to transcriptional repression.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000314
  title: 'FlyBase gene group ISWI: Iswi complexes'
  statement: >-
    FlyBase release FB2026_03 groups 10 D. melanogaster genes as iswi complexes (ISWI); this
    module models that group.
- source_id: GO:0031010
  title: ISWI-type complex
  statement: >-
    GO term grounding the module as ISWI-type complex.
notes: >-
  The six FlyBase subgroups are modelled as alternative complexes, so Iswi appears in each.
  RSF contains CG8677 (the Drosophila RSF1 homolog per FlyBase). TORC has no specific GO term
  and is grounded to ISWI-type complex. FlyBase groups realized by this module: ISWI (FBgg0000314).
  Subgroups folded into it: NURF, NORC, ACF, CHRAC, TORC, RSF. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_iswi_complexes.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
