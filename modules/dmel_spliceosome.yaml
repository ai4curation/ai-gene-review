id: MODULE:dmel_spliceosome
title: Major (U2-type) spliceosome in Drosophila melanogaster
description: >-
  The major spliceosome removes U2-type introns from nuclear pre-mRNAs. It is assembled stepwise
  on each intron from the U1, U2, U4/U6 and U5 small nuclear ribonucleoprotein particles (snRNPs)
  and many non-snRNP proteins. Each snRNP contains a small nuclear RNA; the U1, U2, U4 and
  U5 snRNAs carry a heptameric ring of Sm proteins, whereas U6 snRNA binds the related LSm
  proteins. U1 snRNP recognizes the 5' splice site, and the U2 snRNP auxiliary factor (U2AF)
  together with SF1 recognizes the 3' splice site region, allowing U2 snRNP to pair with the
  branch site (complex A). Joining of the U4/U6.U5 tri-snRNP forms the precatalytic complex
  B; release of U1 and U4 and recruitment of the Prp19 complex and associated proteins create
  the catalytic spliceosome, which carries out the two transesterification steps (complex
  C) and then releases the spliced mRNA (post-catalytic complex P) with an exon junction complex
  deposited upstream of the exon-exon junction.
status: DRAFT
scope: CONCRETE
