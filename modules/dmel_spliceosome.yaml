    GO term grounding the module as spliceosomal complex.
notes: >-
  Decomposition. FlyBase splits the spliceosome two ways: by snRNP (U1, U2, U4-U6, U5, U4-U6-U5)
  and by assembly stage (SPL-C-A, SPL-C-B, SPL-C-C, SLP-C-P), with the snRNP genes re-listed
  in each stage group. Here the snRNPs, the Sm rings and U2AF are parts, and each stage part
  contains only the non-snRNP proteins first listed at that stage (complex A, then B, then
  C). Complex P adds no protein absent from complex C; it lacks Bin1, CG10466, CG3225, CG8833
  and Prp18. Assignment of the NTC core (Prp19, Cdc5, Tango4 [PLRG1], BCAS2) and EJC core
  (mago, tsu [Y14], CG7483 [eIF4AIII]) follows orthology to the human complexes; other stage
  factors are kept as stage sets without finer sub-structure. Lsm10 and Lsm11 enter through
  FlyBase's Sm protein group (U7-SM) and appear only in the U7 Sm ring variant; the U7 snRNP
  itself (with snRNA:U7) belongs to dmel_histone_mrna_3prime_processing, and the 7SK snRNP,
  a sibling in FlyBase's snRNP group, to dmel_rnapii_elongation_complexes. The minor (U12-type)
  spliceosome and splicing regulators (SR proteins, other hnRNPs) are outside this module
  unless FlyBase lists them in a spliceosome stage. FlyBase groups realized by this module:
  SPL-C (FBgg0000519), U2AF (FBgg0000538), SNURPS (FBgg0000631), SM-ALL (FBgg0000632). Subgroups
  folded into it: SNRNP, U1, U2, U4-U6, U5, U4-U6-U5, SM, SPL-C-A, SPL-C-C, SPL-INT, SPL-C-B,
  SLP-C-P, U7-SM. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_spliceosome.yaml;
  none of the member genes has a gene review yet unless noted.
