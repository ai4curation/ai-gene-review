  connections:
  - source: snrnps
    target: complex_a_factors
    connection_type: PRECEDES
    description: >-
      U1 and U2 snRNPs and U2AF define the intron, forming complex A.
  - source: complex_a_factors
    target: complex_b_factors
    connection_type: PRECEDES
    description: >-
      Tri-snRNP joining converts complex A into complex B, which is activated with NTC recruitment.
  - source: complex_b_factors
    target: complex_c_factors
    connection_type: PRECEDES
    description: >-
      The activated spliceosome carries out branching (complex C) and exon ligation (complex
      P).
