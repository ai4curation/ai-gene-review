  - source: prd1_unique_vertex_dna_packaging
    target: prd1_vertex_spike_and_receptor_binding
    connection_type: PROVIDES_INPUT_FOR
    description: DNA-filled particles carrying the P31-P5-P2-P16 receptor-binding spikes at the remaining
      5-fold vertices are released by P35/P15 lysis and adsorb to the conjugative transfer complex of
      a new host cell.
  - source: prd1_vertex_spike_and_receptor_binding
    target: prd1_membrane_tube_dna_delivery
    connection_type: POSITIVELY_REGULATES
    description: Binding of P2 to the host conjugative receptor triggers uncapping of the vertex and transformation
      of the internal viral membrane vesicle via P11, P18, P32, and P7 into a trans-envelope DNA-delivery
      tube.
