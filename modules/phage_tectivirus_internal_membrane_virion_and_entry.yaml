    target: prd1_holin_endolysin_lysis
    connection_type: PROVIDES_INPUT_FOR
    description: Following intracellular maturation of DNA-packaged PRD1 virions, holin P35 and endolysin
      P15 lyse the Gram-negative host cell envelope to liberate progeny virus.
