id: MODULE:phage_tectivirus_internal_membrane_virion_and_entry
title: Tectivirus internal-membrane icosahedral virion assembly, unique vertex DNA packaging, membrane-tube
  genome delivery, and host lysis
description: A reusable module representing the intracellular assembly, unique-vertex ATP-driven genome
  packaging, conjugative-complex receptor recognition, tail-like internal-membrane tube genome delivery,
  and programmed host cell lysis of internal-membrane double-stranded DNA bacteriophages (family Tectiviridae,
  exemplified by Enterobacteria phage PRD1, BPPRD). Unlike tailed Caudoviricetes phages, PRD1 belongs
  to the Bamfordvirae double-jelly-roll lineage. Non-structural assembly factors P10, P17, and P33 coordinate
  the budding of a host-derived lipoprotein vesicle enriched in viral integral membrane proteins (P11,
  P16, P18, P20, P22, P32, P34, and membrane-anchored transglycosylase P7) together with the outer pseudo-T=25
  icosahedral protein shell built from 240 trimers of major double-barrel capsid protein P3, cemented
  along the icosahedral edges by dimeric tape-measure protein P30, and capped at 11 five-fold vertices
  by the penton protein P31, trimeric spike P5, and monomeric receptor-binding protein P2 (stabilized
  at the membrane by P16). At the twelfth unique vertex, the membrane-spanning heterododecameric ring
  P20/P22 anchors the external P6/P9 portal-ATPase complex, which translocates the linear TP-P8-linked
  dsDNA genome into the internal membrane vesicle using ATP hydrolysis. Upon infection of a Gram-negative
  host carrying an IncP, IncN, or IncW conjugative plasmid, P2 binds the mating-pair formation receptor
  complex and triggers vertex uncapping, remodeling the internal lipid vesicle via membrane proteins P11,
  P18, and P32 and muralytic transglycosylase P7 into a tubular membrane conduit that penetrates the host
  cell envelope to eject the viral genome into the cytoplasm. Progeny virions are released at the end
  of the lytic cycle by holin P35 and muramidase endolysin P15.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0019068
  title: virion assembly
  statement: Ontology grounding for coordinated assembly of the internal viral lipoprotein vesicle and
    pseudo-T=25 icosahedral double-barrel capsid shell.
- source_id: GO:0019073
  title: viral DNA genome packaging
  statement: Ontology grounding for ATP-driven translocation of TP-linked viral dsDNA through the unique
    P20/P22-P6/P9 vertex into the internal membrane vesicle.
- source_id: file:genes/BPPRD/III/III-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P22535 (CAPSD_BPPRD)
  statement: Establishes that PRD1 P3 self-assembles as 240 trimers into the pseudo-T=25 icosahedral capsid
    enclosing the internal membrane with the help of assembly factors P10 and P17.
  supporting_text: Major capsid protein self-assembles to form an icosahedral capsid with a pseudo T=25
    symmetry, about 66 nm in diameter, and consisting of 240 capsid proteins trimers. The capsid encapsulates
    an inner membrane and the genomic dsDNA genome.
- source_id: file:genes/BPPRD/IX/IX-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P27381 (PKG9_BPPRD)
  statement: Establishes that DNA packaging ATPase P9 and packaging efficiency factor P6 form the external
    ring-shaped heterododecameric portal at the unique vertex.
  supporting_text: Together with the packaging efficiency factor P6, forms the external part of the portal
    vertex that is embeded in the capsid and which plays critical roles in genome packaging and genome
    ejection. Both proteins multimerize as a single ring-shaped heterdodecamer arranged around a central
    channel.
- source_id: file:genes/BPPRD/II/II-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P27378 (P2_BPPRD)
  statement: Establishes that adsorption protein P2 associates with penton P31 and trimeric spike P5 at
    the 5-fold vertices to bind the host surface receptor and trigger vertex disassembly, membrane tube
    formation, and DNA injection.
  supporting_text: Adsorption protein. In association with P31 and trimeric P5, forms the spike complexes
    located at the 5-fold vertices of the capsid. Involved in recognition and attachment to the receptor
    on the surface of the host. Likely triggers the processes of vertex disassembly, membrane tube formation,
    and subsequent DNA injection.
- source_id: file:genes/BPPRD/XV/XV-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P13559 (ENLYS_BPPRD)
  statement: Establishes that endolysin P15 digests host peptidoglycan after cytoplasmic membrane permeabilization
    by holin P35 to lyse the host cell and release progeny virions.
  supporting_text: Endolysin involved in host peptidoglycan digestion after permeabilization of the cytoplasmic
    membrane by holin. Involved in host cell lysis and liberation of progeny phages.
module:
  id: phage_tectivirus_internal_membrane_virion_and_entry
  label: Tectivirus internal-membrane virion assembly, unique-vertex packaging, membrane-tube entry, and
    lysis
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: virion assembly
    term:
      id: GO:0019068
      label: virion assembly
    description: Assembly of the internal lipoprotein membrane vesicle and outer pseudo-T=25 double-barrel
      icosahedral capsid shell.
  - preferred_term: viral DNA genome packaging
    term:
      id: GO:0019073
      label: viral DNA genome packaging
    description: ATP-dependent packaging of the TP-linked linear dsDNA genome through the P20/P22-P6/P9
      unique portal vertex.
  - preferred_term: entry receptor-mediated virion attachment to host cell
    term:
      id: GO:0098670
      label: entry receptor-mediated virion attachment to host cell
    description: Recognition of the plasmid-encoded conjugative DNA transfer complex by vertex spike complex
      P31-P5-P2, triggering internal membrane tube transformation and genome delivery.
  - preferred_term: viral release from host cell by cytolysis
    term:
      id: GO:0044659
      label: viral release from host cell by cytolysis
    description: Programmed host cell lysis mediated by inner membrane holin P35 and muramidase endolysin
      P15.
