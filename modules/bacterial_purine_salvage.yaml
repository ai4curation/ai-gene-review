id: MODULE:bacterial_purine_salvage
title: PpnP-linked bacterial purine nucleoside and nucleobase salvage
description: >-
  A reusable PpnP-linked bacterial salvage realization in which purine nucleosides are
  phosphorolyzed to free bases and ribose 1-phosphate, after which adenine,
  hypoxanthine or guanine, and xanthine are returned to the nucleotide pool as
  AMP, IMP or GMP, and XMP. The three phosphoribosyltransferase branches use
  PRPP and release diphosphate.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0043101
    title: purine-containing compound salvage
    statement: >-
      GO:0043101 captures recycling of preformed purine compounds represented
      by the four reactions in this module.
  - source_id: file:PSEPK/ppnP/ppnP-ai-review.yaml
    title: PSEPK ppnP gene review
    statement: >-
      Q88F51 provides broad purine-nucleoside phosphorolysis that releases the
      free bases used by the downstream phosphoribosyltransferase branches.
  - source_id: file:PSEPK/apt/apt-ai-review.yaml
    title: PSEPK apt gene review
    statement: Q88F33 salvages adenine to AMP.
  - source_id: file:PSEPK/PP_0747/PP_0747-ai-review.yaml
    title: PSEPK PP_0747 gene review
    statement: Q88PV1 salvages hypoxanthine and guanine to IMP and GMP.
  - source_id: file:PSEPK/xpt/xpt-ai-review.yaml
    title: PSEPK xpt gene review
    statement: Q88CB6 salvages xanthine to XMP.
  - source_id: file:modules/bacterial_purine_salvage-deep-research-openscientist.md
    title: OpenScientist research on bacterial purine salvage
    statement: >-
      The report supports the two-tier nucleoside-to-base and base-to-nucleotide
      chemistry while distinguishing Cupin-fold PpnP from unrelated DeoD and
      XapA nucleoside-phosphorylase realizations.
  - source_id: PMID:40632566
    title: A conserved editing mechanism for the fidelity of bacterial cell wall biosynthesis
    statement: >-
      Direct bacterial comparison found PgeF/YfiH PNP activity weak and unable
      to compensate for loss of physiological PNP activity in E. coli, so YfiH
      is not used to satisfy this salvage realization.
notes: >-
  This module separates PpnP-linked bacterial salvage from de novo purine synthesis,
  nucleotide interconversion, uptake, and oxidative purine degradation. PpnP
  also acts on pyrimidine nucleosides, but only its purine substrates belong to
  this realization. A species may implement only a subset of the three
  nucleobase branches. DeoD-, XapA-, or nucleoside-kinase-dependent routes are
  alternative realizations rather than implicit PpnP equivalents. YfiH/PgeF is
  excluded: its weak in vitro PNP activity lacks demonstrated physiological
  relevance in bacteria, whereas peptidoglycan precursor editing is its
  established bacterial role.
module:
  id: bacterial_purine_salvage
  label: PpnP-linked bacterial purine nucleoside and nucleobase salvage
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: purine-containing compound salvage
      term:
        id: GO:0043101
        label: purine-containing compound salvage
      description: Recycling of preformed purine nucleosides and bases.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          The realization uses bacterial enzyme families and Pseudomonas
          putida KT2440 representatives.
  parts:
    - order: 1
      role: liberation of purine bases from nucleosides
      node:
        id: purine_nucleoside_phosphorolysis
        label: Purine nucleoside phosphorolysis
        module_type: REACTION
        annotons:
          - id: ppnp_purine_nucleoside_phosphorylase
            label: PpnP purine-nucleoside phosphorylase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PpnP pyrimidine/purine nucleoside phosphorylase family
                term:
                  id: PANTHER:PTHR36540:SF1
                  label: PYRIMIDINE/PURINE NUCLEOSIDE PHOSPHORYLASE
                representative_members:
                  - preferred_term: PpnP (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88F51
                      label: Pyrimidine/purine nucleoside phosphorylase
                  - preferred_term: PpnP (Burkholderia cenocepacia HI2424)
                    term:
                      id: UniProtKB:A0B0V3
                      label: Pyrimidine/purine nucleoside phosphorylase
            function:
              preferred_term: purine-nucleoside phosphorylase activity
              term:
                id: GO:0004731
                label: purine-nucleoside phosphorylase activity
              substrates:
                - preferred_term: purine ribonucleoside
                - preferred_term: phosphate
              products:
                - preferred_term: purine nucleobase
                - preferred_term: alpha-D-ribose 1-phosphate
              evidence:
                - source_id: RHEA:19805
                  title: purine-nucleoside phosphorylase reaction
                  statement: >-
                    Rhea 19805 defines phosphorolysis of a purine
                    D-ribonucleoside to a purine base and ribose 1-phosphate.
                - source_id: file:PSEPK/ppnP/ppnP-ai-review.yaml
                  statement: >-
                    The review identifies this as one of Q88F51's two broad
                    nucleoside-phosphorylase functions.
                - source_id: PANTHER:PTN002443144
                  statement: >-
                    The current PSEPK GOA transfers purine-nucleoside
                    phosphorylase activity from this PAINT node.
            processes:
              - preferred_term: purine-containing compound salvage
                term:
                  id: GO:0043101
                  label: purine-containing compound salvage
            role_description: >-
              Generates adenine, hypoxanthine, guanine, or xanthine that can
              enter the corresponding nucleobase salvage branch.
    - order: 2
      role: adenine salvage
      node:
        id: adenine_to_amp_salvage
        label: Adenine conversion to AMP
        module_type: REACTION
        annotons:
          - id: apt_adenine_phosphoribosyltransferase
            label: Apt adenine phosphoribosyltransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Adenine phosphoribosyltransferase family
                term:
                  id: PANTHER:PTHR11776:SF7
                  label: PHOSPHORIBOSYLTRANSFERASE DOMAIN-CONTAINING PROTEIN
                representative_members:
                  - preferred_term: Apt (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88F33
                      label: Adenine phosphoribosyltransferase
                  - preferred_term: Apt (Paracoccus denitrificans Pd 1222)
                    term:
                      id: UniProtKB:A1B843
                      label: Adenine phosphoribosyltransferase
            function:
              preferred_term: adenine phosphoribosyltransferase activity
              term:
                id: GO:0003999
                label: adenine phosphoribosyltransferase activity
              substrates:
                - preferred_term: adenine
                - preferred_term: 5-phospho-alpha-D-ribose 1-diphosphate
              products:
                - preferred_term: AMP
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:16609
                  title: adenine phosphoribosyltransferase reaction
                  statement: >-
                    Rhea 16609 defines the reversible adenine and PRPP to AMP
                    phosphoribosyl-transfer reaction.
                - source_id: file:PSEPK/apt/apt-ai-review.yaml
                  statement: The review assigns Q88F33 to adenine salvage.
                - source_id: PANTHER:PTN002272750
                  statement: >-
                    The current PSEPK GOA transfers Apt activity from this
                    PAINT node.
            processes:
              - preferred_term: adenine salvage
                term:
                  id: GO:0006168
                  label: adenine salvage
            role_description: Returns adenine to the adenylate pool as AMP.
    - order: 3
      role: hypoxanthine and guanine salvage
      node:
        id: six_oxopurine_to_imp_gmp_salvage
        label: Hypoxanthine and guanine conversion to IMP and GMP
        module_type: REACTION
        annotons:
          - id: hgprt_six_oxopurine_phosphoribosyltransferase
            label: HGPRT hypoxanthine-guanine phosphoribosyltransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hypoxanthine-guanine phosphoribosyltransferase family
                term:
                  id: PANTHER:PTHR43340:SF1
                  label: HYPOXANTHINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: PP_0747 (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PV1
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                  - preferred_term: Hpt (Aquifex aeolicus VF5)
                    term:
                      id: UniProtKB:O66821
                      label: Hypoxanthine-guanine phosphoribosyltransferase
            function:
              preferred_term: hypoxanthine phosphoribosyltransferase activity
              term:
                id: GO:0004422
                label: hypoxanthine phosphoribosyltransferase activity
              substrates:
                - preferred_term: hypoxanthine or guanine
                - preferred_term: 5-phospho-alpha-D-ribose 1-diphosphate
              products:
                - preferred_term: IMP or GMP
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:17975
                  title: physiological IMP-salvage direction
                  statement: Rhea 17975 defines hypoxanthine and PRPP conversion to IMP.
                - source_id: RHEA:25426
                  title: physiological GMP-salvage direction
                  statement: Rhea 25426 defines guanine and PRPP conversion to GMP.
                - source_id: file:PSEPK/PP_0747/PP_0747-ai-review.yaml
                  statement: >-
                    The review assigns Q88PV1 to both hypoxanthine and guanine
                    salvage while noting the lack of direct KT2440 assays.
                - source_id: PANTHER:PTN002458265
                  statement: >-
                    The current PSEPK GOA transfers HGPRT activity and salvage
                    processes from this PAINT node.
            processes:
              - preferred_term: IMP salvage
                term:
                  id: GO:0032264
                  label: IMP salvage
              - preferred_term: GMP salvage
                term:
                  id: GO:0032263
                  label: GMP salvage
            role_description: Returns 6-oxopurine bases to the guanylate nucleotide pool.
    - order: 4
      role: xanthine salvage
      node:
        id: xanthine_to_xmp_salvage
        label: Xanthine conversion to XMP
        module_type: REACTION
        annotons:
          - id: xpt_xanthine_phosphoribosyltransferase
            label: Xpt xanthine phosphoribosyltransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Xanthine phosphoribosyltransferase subfamily
                term:
                  id: PANTHER:PTHR43864:SF1
                  label: XANTHINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: Xpt (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CB6
                      label: Xanthine phosphoribosyltransferase
                  - preferred_term: Xpt (Listeria welshimeri SLCC 5334)
                    term:
                      id: UniProtKB:A0AJZ0
                      label: Xanthine phosphoribosyltransferase
            function:
              preferred_term: xanthine phosphoribosyltransferase activity
              term:
                id: GO:0000310
                label: xanthine phosphoribosyltransferase activity
              substrates:
                - preferred_term: xanthine
                - preferred_term: 5-phospho-alpha-D-ribose 1-diphosphate
              products:
                - preferred_term: XMP
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:10800
                  title: xanthine phosphoribosyltransferase reaction
                  statement: >-
                    Rhea 10800 defines the reversible xanthine and PRPP to XMP
                    phosphoribosyl-transfer reaction.
                - source_id: file:PSEPK/xpt/xpt-ai-review.yaml
                  statement: The review assigns Q88CB6 to XMP salvage.
            processes:
              - preferred_term: XMP salvage
                term:
                  id: GO:0032265
                  label: XMP salvage
            role_description: Returns xanthine to the guanylate nucleotide pool as XMP.
  connections:
    - source: purine_nucleoside_phosphorolysis
      target: adenine_to_amp_salvage
      connection_type: PROVIDES_INPUT_FOR
      description: PpnP can release adenine from adenosine for Apt-dependent salvage.
      chaining_status: VERIFIED
      chaining_note: Q88F51 UniProt lists adenosine as a substrate and Rhea 16609 uses adenine.
    - source: purine_nucleoside_phosphorolysis
      target: six_oxopurine_to_imp_gmp_salvage
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        PpnP can release hypoxanthine or guanine from inosine or guanosine for
        HGPRT-dependent salvage.
      chaining_status: VERIFIED
      chaining_note: >-
        Q88F51 UniProt lists inosine and guanosine as substrates; Rhea 17975
        and 25426 use the corresponding bases.
    - source: purine_nucleoside_phosphorolysis
      target: xanthine_to_xmp_salvage
      connection_type: PROVIDES_INPUT_FOR
      description: PpnP can release xanthine from xanthosine for Xpt-dependent salvage.
      chaining_status: VERIFIED
      chaining_note: Q88F51 UniProt lists xanthosine as a substrate and Rhea 10800 uses xanthine.
  knowledge_gaps:
    - gap_statement: >-
        Q88PV1 is an unreviewed UniProt entry whose dual hypoxanthine/guanine
        specificity is inferred from ARBA reactions and its PANTHER subfamily.
      boundary: >-
        Apply the HGPRT branch only with the PTHR43340:SF1 selector and pathway
        context until the P. putida enzyme is assayed directly.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Purine nucleoside phosphorylases are not represented by one universal
        bacterial family, and PpnP also phosphorolyzes pyrimidine nucleosides.
      boundary: >-
        PTHR36540:SF1 selects the PpnP realization only; alternate bacterial
        DeoD, XapA, and nucleoside-kinase routes require separately modeled
        realizations, and pyrimidine reactions remain outside this module.
      gap_kind:
        - CURATION
