id: MODULE:mitochondrial_upr
title: Mitochondrial unfolded protein response
description: >-
  The mitochondrial unfolded protein response (UPRmt) is a
  mitochondria-to-nucleus signaling pathway that raises the expression of
  nuclear genes encoding mitochondrial chaperones and proteases when
  mitochondrial protein homeostasis is disturbed. Its executing transcription
  factor is a bZIP protein of the ATF4/ATF5 family that is partitioned between
  mitochondria and the nucleus: nematode ATFS-1 and its mammalian functional
  counterpart ATF5 both carry a mitochondrial targeting sequence, are kept in
  mitochondria in unstressed cells, and activate chaperone and protease genes
  when mitochondrial function fails; ATF5 rescues UPRmt signaling in atfs-1
  mutant worms. The induced matrix chaperones, the HSP60 chaperonin and the
  mitochondrial HSP70, are both the classic reporters and the protective output
  of the response. How mitochondrial stress is relayed to the transcription
  factor differs between lineages. In Caenorhabditis elegans, where the
  pathway was defined, the key regulatory point is the import efficiency of
  ATFS-1: misfolded matrix proteins are degraded by the ClpP protease CLPP-1,
  the inner-membrane ABC transporter HAF-1 exports the resulting peptides and
  attenuates protein import under moderate stress, and ATFS-1 that escapes
  import reaches the nucleus. A nematode chromatin arm (DVE-1/UBL-5 together
  with the MET-2/LIN-65 H3K9 methylation machinery and the JMJD-3.1 H3K27
  demethylase) acts alongside ATFS-1. In mammals, mitochondrial stress such as
  depolarization, import defects or iron deficiency activates the inner-membrane
  protease OMA1, which cleaves DELE1; the released DELE1 fragment activates the
  eIF2alpha kinase HRI (EIF2AK1) in the cytosol, and the resulting integrated
  stress response raises translation of ATF4 and ATF5. Mammalian CLPP is not
  required for the UPRmt, so the ClpP peptide signal is not a conserved part of
  the pathway.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:15280428
    title: Compartment-specific perturbation of protein handling activates genes encoding mitochondrial chaperones.
    statement: >-
      Defines the C. elegans UPRmt: hsp-6 and hsp-60 are selectively induced
      by perturbed mitochondrial protein handling, and not by heat shock or ER
      stress.
    supporting_text: >-
      hsp-6 and hsp-60 induction was specific to perturbed mitochondrial
      protein handling, as neither heat-shock nor endoplasmic reticulum stress
      nor manipulations that impair mitochondrial steps in intermediary
      metabolism or ATP synthesis activated the mitochondrial chaperone genes.
  - source_id: PMID:27426517
    title: The Transcription Factor ATF5 Mediates a Mammalian Mitochondrial UPR.
    statement: >-
      ATF5 is regulated like ATFS-1, induces a similar transcriptional
      response, and rescues UPRmt signaling in atfs-1-deficient worms, so UPRmt
      regulation is conserved from worms to mammals.
    supporting_text: >-
      Here, we describe a mammalian transcription factor, ATF5, which is
      regulated similarly to ATFS-1 and induces a similar transcriptional
      response. ATF5 expression can rescue UPR(mt) signaling in
      atfs-1-deficient worms requiring the same UPR(mt) promoter element
      identified in C. elegans.
  - source_id: PMID:20188671
    title: The matrix peptide exporter HAF-1 signals a mitochondrial UPR by activating the transcription factor ZC376.7 in C. elegans.
    statement: >-
      Model of the nematode sensing arm: ClpP generates peptides from
      misfolded matrix proteins, and their HAF-1-dependent export contributes
      to UPRmt signaling.
    supporting_text: >-
      perturbation of the protein-folding environment in the mitochondrial
      matrix promotes ClpP-mediated generation of peptides whose
      haf-1-dependent export from the matrix contributes to UPR(mt) signaling
      across the mitochondrial inner membrane.
  - source_id: PMID:22700657
    title: Mitochondrial import efficiency of ATFS-1 regulates mitochondrial UPR activation.
    statement: >-
      In C. elegans the key regulatory point is the mitochondrial import
      efficiency of ATFS-1.
    supporting_text: >-
      We found that the key point of regulation is the mitochondrial import
      efficiency of ATFS-1.
  - source_id: PMID:32132707
    title: Mitochondrial stress is relayed to the cytosol by an OMA1-DELE1-HRI pathway.
    statement: >-
      In mammalian cells mitochondrial stress is relayed to ATF4 through
      OMA1-dependent DELE1 cleavage and HRI activation.
    supporting_text: >-
      Mitochondrial stress stimulates OMA1-dependent cleavage of DELE1 and
      leads to the accumulation of DELE1 in the cytosol, where it interacts
      with HRI and activates the eIF2α kinase activity of HRI.
  - source_id: PMID:27154400
    title: Loss of CLPP alleviates mitochondrial cardiomyopathy without affecting the mammalian UPRmt.
    statement: >-
      Lineage difference: mammalian CLPP is neither required for nor a
      regulator of the UPRmt, unlike C. elegans CLPP-1.
    supporting_text: >-
      Remarkably, our results clearly show that mammalian CLPP is neither
      required for, nor it regulates the UPR(mt) in mammals.
  - source_id: PMID:22719267
    title: Protective coupling of mitochondrial function and protein synthesis via the eIF2α kinase GCN-2.
    statement: >-
      In C. elegans a GCN-2/eIF2alpha translational arm protects mitochondria
      during stress and is complementary to, not part of, HAF-1/ATFS-1
      chaperone induction.
    supporting_text: >-
      Our data demonstrate that GCN-2-dependent translational control acts in
      a mitochondrial protective signaling pathway complementary to the
      regulation of mitochondrial chaperone gene expression mediated by HAF-1
      and ATFS-1.
  - source_id: file:genes/worm/atfs-1/atfs-1-ai-review.yaml
    title: worm atfs-1 gene review
    statement: >-
      Core functions: RNA polymerase II-specific transcription activator in the
      nucleoplasm for the UPRmt and for defense against Gram-negative bacteria,
      and mitochondrial transcription factor activity in the matrix.
  - source_id: file:genes/human/ATF5/ATF5-ai-review.yaml
    title: human ATF5 gene review
    statement: >-
      Core function: RNA polymerase II-specific DNA-binding transcription
      activator in the nucleus acting in the mitochondrial unfolded protein
      response.
  - source_id: file:genes/human/CLPP/CLPP-ai-review.yaml
    title: human CLPP gene review
    statement: >-
      Core function: serine-type endopeptidase of the matrix ClpXP protease in
      mitochondrial protein catabolism and quality control; the review records
      PMID:27154400 as the caveat against transferring the worm CLPP-1 UPRmt
      signaling role to mammals.
notes: >-
  Boundary. The module covers the conserved UPRmt trunk (stress relay, an
  ATF4/ATF5-family bZIP transcription factor partitioned between mitochondria
  and nucleus, and induced matrix chaperones), with the relay modeled as a
  lineage variant set. It is set at Metazoa (NCBITaxon:33208): the ATFS-1/ATF5
  logic is documented in nematodes and mammals, and the HSP60 and mtHSP70
  outputs are conserved across animals. The two variants are the two
  documented relays, not an exhaustive survey; insect UPRmt wiring is not
  modeled.

  Lineage differences. (a) Nematode: CLPP-1 proteolysis, HAF-1 peptide export
  and ATFS-1 import competition, plus a chromatin arm (DVE-1/UBL-5, LIN-65,
  MET-2, JMJD-3.1) that is described only in C. elegans. HAF-1 is needed under
  moderate stress, not under severe stress that blocks import directly; it is
  thought to dampen import rather than to be part of the import machinery (see
  the haf-1 review). (b) Mammalian: OMA1-DELE1-HRI-eIF2alpha drives the
  integrated stress response, which raises ATF4 and ATF5 translation. DELE1 is
  a messenger for mitochondrial stress in general (depolarization, import
  failure, iron deficiency), not specifically a sensor of misfolded proteins.
  Mammalian CLPP is the same PANTHER subfamily as CLPP-1 (PTHR10381:SF11) but
  is not required for the mammalian UPRmt (PMID:27154400), so it is not given
  the CLPP-1 signaling role and is not a member of the mammalian variant. Its
  ATFS-1-like mitochondrial partitioning is recorded on the ATF5 member of the
  shared transcription factor part. ATF4 is in the same PANTHER family but
  does not rescue atfs-1 worms (PMID:27426517); it is modeled as the ISR
  transcription factor of the mammalian variant.

  Left out. The C. elegans GCN-2/eIF2alpha arm is complementary to and
  independent of ATFS-1 activation (PMID:22719267) and is left to the
  integrated stress response; the gcn-2 review lists it as a core UPRmt
  process, which is recorded here only as context. The neuronal and germline
  signals that switch on the intestinal UPRmt cell-non-autonomously
  (serotonin, the retromer-dependent Wnt EGL-20 signal, PMID:30057120) are
  not modeled. JMJD-1.2 acts with JMJD-3.1 (PMID:27133168) but has no review
  and is only named. ULP-4 and the NuRD/HDA-1 regulators (PMID:30642431,
  PMID:32789178, PMID:32934238) are modulators. The matrix LON protease that
  degrades imported ATFS-1 (and LONP1, which degrades imported DELE1) is not
  modeled. Innate immunity and lifespan extension are outputs of the
  transcriptional program and are not module processes.

  ATFS-1 dual targeting. ATFS-1 appears twice: in the nematode variant as the
  matrix pool that binds mitochondrial DNA (mitochondrial transcription factor
  activity) before degradation, and in the shared part as the nuclear RNA
  polymerase II activator. The import checkpoint negatively regulates the
  nuclear part.

  PANTHER grounding. ATFS-1 (PTHR13044:SF12) and ATF5 (PTHR13044:SF3) are in
  PTHR13044 and both inherit DNA-binding transcription activator activity from
  PAINT node PTN000315883 (Opisthokonta); that node is a generic bZIP activator
  node, not a UPRmt-specific one. HSP-60 and HSPD1 are in PTHR45633:SF17; the family's
  PAINT node PTN000143510 carries the UPRmt process (seeded by worm hsp-60).
  HSP-6 and HSPA9 are in the mitochondrial HSP70 subfamily PTHR19375:SF184
  and both inherit from the mitochondrial HSP70 node PTN000452554.

  Related modules. ATFS-1-dependent transcription of mitophagy genes is
  treated in MODULE:mitophagy, the cytosolic heat shock response in
  MODULE:heat_shock_response and the ER UPR in
  MODULE:er_unfolded_protein_response.
module:
  id: mitochondrial_upr
  label: Mitochondrial unfolded protein response
  module_type: SIGNALING_PATHWAY
  description: >-
    Mitochondria-to-nucleus pathway in which a lineage-specific relay
    (nematode ClpP peptide export and ATFS-1 import competition, or mammalian
    OMA1-DELE1-HRI integrated stress response signaling) activates an
    ATFS-1/ATF5-family bZIP transcription factor that induces mitochondrial
    chaperone genes.
  concepts:
    - preferred_term: mitochondrial unfolded protein response
      term:
        id: GO:0034514
        label: mitochondrial unfolded protein response
  context:
    taxa:
      - preferred_term: Metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        description: >-
          Documented in nematodes and mammals; the ATF4/ATF5-family
          transcription factor node PTN000315883 and the HSP60 UPRmt node
          PTN000143510 are older (Opisthokonta), but the mitochondria-partitioned
          UPRmt factor is described only in animals.
    conditions:
      - preferred_term: >-
          mitochondrial protein-folding or proteostasis stress (e.g. spg-7 or
          hsp-6 RNAi in worms; respiratory chain inhibition, mtDNA depletion,
          misfolded matrix protein expression, depolarization in mammalian
          cells)
  parts:
    - order: 1
      role: relay of mitochondrial stress to the UPRmt transcription factor
      node:
        id: mitochondrial_stress_relay
        label: Mitochondrial stress relay
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Converts loss of mitochondrial proteostasis or import capacity into
          activation of the UPRmt transcription factor. Implemented differently
          in nematodes and mammals.
        variant_sets:
          - id: stress_relay_lineage
            label: Stress relay route
            axis: taxon / sensing mechanism
            selection: EXACTLY_ONE
            notes: >-
              The nematode route reads mitochondrial import capacity directly
              through ATFS-1 import competition, with a ClpP/HAF-1 peptide
              signal under moderate stress. The mammalian route is the
              OMA1-DELE1-HRI branch of the integrated stress response. Neither
              DELE1 nor an OMA1-DELE1 relay is known in C. elegans, and
              mammalian CLPP is dispensable for the UPRmt (PMID:27154400).
            evidence:
              - source_id: PMID:27154400
                title: Loss of CLPP alleviates mitochondrial cardiomyopathy without affecting the mammalian UPRmt.
                statement: >-
                  CLPP plays a central role in worm UPRmt activation, but the
                  assumption that it does the same in mammals does not hold.
                supporting_text: >-
                  The mitochondrial matrix protease CLPP plays a central role
                  in the activation of the mitochondrial unfolded protein
                  response (UPR(mt)) in Caenorhabditis elegans
            variants:
              - id: nematode_atfs1_import_route
                label: Nematode ATFS-1 import-competition route
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  CLPP-1 peptide generation and HAF-1 export attenuate
                  mitochondrial import, so that ATFS-1 escapes import and
                  degradation; a nematode-specific chromatin arm prepares
                  target loci.
                context:
                  taxa:
                    - preferred_term: Caenorhabditis elegans
                      term:
                        id: NCBITaxon:6239
                        label: Caenorhabditis elegans
                parts:
                - order: 1
                  role: matrix stress signal generation and export
                  node:
                    id: matrix_signal_generation
                    label: CLPP-1 proteolysis and HAF-1 peptide export
                    module_type: BIOLOGICAL_PROCESS
                    description: >-
                      Misfolded matrix proteins are degraded by the CLPP-1 protease and the
                      resulting peptides are exported across the inner membrane by HAF-1.
                      Both are genetically required for nuclear accumulation of ATFS-1 and
                      for activation of the hsp-60 and hsp-6 reporters. Peptide efflux from
                      isolated mitochondria is ATP-dependent and needs both HAF-1 and
                      ClpP.
                    context:
                      cellular_components:
