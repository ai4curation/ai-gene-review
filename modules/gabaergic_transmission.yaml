id: MODULE:gabaergic_transmission
title: Human GABAergic transmission through ionotropic GABA-A receptors
description: >-
  Fast GABAergic inhibition in the vertebrate nervous system. GAD1/GAD2 decarboxylate glutamate to GABA
  in the cytosol of the GABAergic terminal, VGAT (SLC32A1) loads GABA into synaptic vesicles, and
  calcium-triggered exocytosis releases it. Released GABA opens pentameric GABA-A receptors, which are
  GABA-gated chloride channels. Two receptor classes are modelled as alternatives. Synaptic gamma2-containing
  receptors, with (alpha1)2(beta2)2gamma2 as the most abundant example, mediate phasic inhibitory
  postsynaptic currents. Extrasynaptic delta-containing alpha4/alpha6 receptors respond to ambient GABA
  and mediate tonic inhibition. The retinal rho1 homopentamer (formerly "GABA-C") is an optional
  comparator. The plasma-membrane GABA transporter GAT-1 (SLC6A1) terminates the signal by sodium- and
  chloride-coupled reuptake. Metabotropic GABA-B signalling, GABA catabolism and gephyrin-dependent
  receptor clustering are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:18790874
  title: 'International Union of Pharmacology. LXX. Subtypes of gamma-aminobutyric acid(A) receptors:
    classification on the basis of subunit composition, pharmacology, and function. Update.'
  statement: The IUPHAR classification sets the module's reception boundary, covering both the phasic
    synaptic and the tonic extrasynaptic modes of GABA-A receptor signalling.
  supporting_text: GABAA-Rs are chloride channels that are gated by GABA and mediate rapid phasic inhibitory
    synaptic transmission and also tonic inhibition by producing current in extrasynaptic and perisynaptic
    locations
- source_id: PMID:2069816
  title: Two genes encode distinct glutamate decarboxylases.
  statement: The two vertebrate GAD isoforms supply the transmitter. The synthesis step is included by
    reference to the GABA shunt module.
  supporting_text: The brain contains two forms of the GABA synthetic enzyme glutamate decarboxylase (GAD)
- source_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
  title: PTHR18945 family review
  statement: The family review shows that GABA-gated chloride channel terms in PAINT belong to the GABA-A
    clades (PTN008360627, PTN008566841), not to the whole neurotransmitter-gated ion channel family. This
    module therefore names exact subunits and does not use a family-wide selector.
notes: >-
  The GABA-A receptor is modelled as specific assembled pentamers, each a complete channel; the subunits
  are not interchangeable. Native stoichiometry is established only for the abundant (alpha1)2(beta2)2gamma2
  receptor; the 2alpha-2beta-1gamma2 arrangement of other gamma2 receptors is assumed by analogy, and the
  delta receptors are given composition without stoichiometry. VGAT loading and exocytosis are included by
  module_ref and shared with glycinergic transmission. GAT-3 (SLC6A11) astrocytic uptake is a recognised
  second clearance route but is not yet grounded here. None of the GABA-A subunits, VGAT or GAT-1 has a
  gene review in this repository, so the functional assertions rest on the cited literature and PAINT,
  and status is DRAFT. Module deep research has not been run.
