knowledge_gaps:
- gap_statement: The subunit stoichiometry and arrangement of most native GABA-A receptor subtypes other
    than (alpha1)2(beta2)2gamma2 are not known.
  boundary: The (alpha1)2(beta2)2gamma2 receptor has
    evidence for both its combination and its stoichiometry, and the 2alpha-2beta-1gamma2 arrangement is
    assumed for other gamma2 receptors. For the delta receptors the subunit combination is established
    but the stoichiometry is not.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: Composition and subunit arrangement decide affinity, benzodiazepine and neurosteroid
    sensitivity, and synaptic versus extrasynaptic location, so they decide which receptors a drug acts on.
  provenance:
  - reference_id: PMID:18790874
    supporting_text: At this time the subunit composition, stoichiometry, and wheel alignment are not known
      for most pharmacological subtypes
    reference_section_type: DISCUSSION
references:
- id: PMID:18790874
  title: 'International Union of Pharmacology. LXX. Subtypes of gamma-aminobutyric acid(A) receptors:
    classification on the basis of subunit composition, pharmacology, and function. Update.'
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. The IUPHAR classification supports the two receptor modes
      and the named subtypes; it explicitly declines to fix stoichiometry for most subtypes, which this
      module records as a knowledge gap rather than asserting.
  findings:
  - statement: GABA-A receptors are GABA-gated chloride channels that mediate both phasic synaptic
      inhibition and tonic inhibition from extrasynaptic and perisynaptic positions.
    supporting_text: GABAA-Rs are chloride channels that are gated by GABA and mediate rapid phasic
      inhibitory synaptic transmission and also tonic inhibition by producing current in extrasynaptic
      and perisynaptic locations
    reference_section_type: INTRODUCTION
  - statement: The gamma2 subunit is what localises a GABA-A receptor to the synapse.
    supporting_text: The γ2 subunit is required for synaptic localization of GABAA-Rs, usually
      associated with the α1, α2, or α3 subunits.
    reference_section_type: RESULTS
  - statement: alpha4beta2delta, alpha4beta3delta, alpha6beta2delta and alpha6beta3delta are accepted as
      conclusively identified native subtypes.
    supporting_text: we add α4β2δ and α4β3δ, α6β2δ and α6β3δ subtypes in category A
    reference_section_type: RESULTS
  - statement: The rho subunits belong to the GABA-A receptor family, so a separate GABA-C class is not
      recommended, and they are expressed mainly in retina.
    supporting_text: the ρ subunits are closely related in sequence, structure, and function to the other
      GABAA-R subunit families designated with other Greek letters and thus qualify for inclusion within
      that family
    reference_section_type: DISCUSSION
- id: PMID:2069816
  title: Two genes encode distinct glutamate decarboxylases.
  findings:
  - statement: Two genes encode the two brain GAD isoforms that synthesise GABA.
    supporting_text: The brain contains two forms of the GABA synthetic enzyme glutamate decarboxylase (GAD)
    reference_section_type: ABSTRACT
- id: PMID:9349821
  title: Identification and characterization of the vesicular GABA transporter.
  findings:
  - statement: VGAT, the rat homologue of C. elegans UNC-47, confers vesicular GABA transport.
    supporting_text: a rat homologue of unc-47 is expressed by central GABA neurons and confers vesicular
      GABA transport in transfected cells
    reference_section_type: ABSTRACT
- id: PMID:33834705
  title: Extrasynaptic δ-subunit containing GABA(A) receptors.
  publication_type: REVIEW
  findings:
  - statement: Delta-subunit-containing GABA-A receptors sit in extrasynaptic or perisynaptic positions
      and carry a slow constant tonic inhibitory current.
    supporting_text: δ-GABAARs mediate a slow constant inhibitory current called tonic inhibition.
    reference_section_type: ABSTRACT
- id: PMID:18248614
  title: GAT-1 regulates both tonic and phasic GABA(A) receptor-mediated inhibition in the cerebral cortex.
  findings:
  - statement: GAT-1 is the most abundant GABA transporter and shapes both tonic and phasic GABA-A
      receptor-mediated inhibition; its loss raises tonic conductance and prolongs evoked IPSCs.
    supporting_text: GAT-1 has a prominent role in both tonic and phasic GABA(A)R-mediated inhibition
    reference_section_type: ABSTRACT
