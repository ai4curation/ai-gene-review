id: MODULE:dmel_fused_smurf_complex
title: Fused-Smurf ubiquitin ligase complex in Drosophila melanogaster
description: >-
  The serine/threonine kinase Fused, best known as a Hedgehog pathway component, also forms
  a complex with the HECT-domain E3 ubiquitin ligase Smurf. In the Drosophila ovary germline
  stem cell niche, the Fused-Smurf complex promotes ubiquitylation and degradation of the
  BMP type I receptor Thickveins in cells displaced from the niche, sharpening the BMP response
  and allowing stem cell daughters to differentiate.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001802
  title: 'FlyBase gene group FUSF: Fused-smurf ubiquitin ligase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as fused-smurf ubiquitin ligase
    complex (FUSF); this module models that group.
- source_id: GO:0000151
  title: ubiquitin ligase complex
  statement: >-
    GO term grounding the module as ubiquitin ligase complex.
notes: >-
  GO has no specific term for the Fused-Smurf complex; the module is grounded to the generic
  ubiquitin ligase complex term. Fused's role in Hedgehog signalling is a separate function
  outside this module. FlyBase groups realized by this module: FUSF (FBgg0001802). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_fused_smurf_complex.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
