id: MODULE:dmel_troponin_complex
title: Troponin complex in Drosophila melanogaster
description: >-
  Troponin is the calcium sensor of the thin filament in striated muscle. It is a complex
  of three subunits bound to tropomyosin: troponin C binds calcium, troponin I inhibits actomyosin
  interaction at rest, and troponin T anchors the complex to tropomyosin. When calcium binds
  troponin C, the inhibition by troponin I is relieved and tropomyosin moves to expose myosin-binding
  sites on actin, allowing contraction. Drosophila has single genes for troponin I (wings
  up A, wupA) and troponin T (upheld, up), each producing many muscle-specific isoforms by
  alternative splicing, and five troponin C genes expressed in different muscles; in the indirect
  flight muscle TpnC4 and TpnC41C are used, with TpnC4 linked to stretch activation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001546
  title: 'FlyBase gene group TPN-C: Troponin complex subunits'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as troponin complex subunits
    (TPN-C); this module models that group.
- source_id: GO:0005861
  title: troponin complex
  statement: >-
    GO term grounding the module as troponin complex.
notes: >-
  Tropomyosins (Tm1, Tm2) and actin are thin filament context and not parts. TpnC paralogs
  are modelled as an EXACTLY_ONE choice per complex; the muscle-specific expression pattern
  of TpnC25D and TpnC47D is not described here. FlyBase groups realized by this module: TPN-C
  (FBgg0001546). Subgroups folded into it: TPNC, TPNI, TPNT. Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_troponin_complex.yaml; none of the member genes has a gene review
  yet unless noted.
