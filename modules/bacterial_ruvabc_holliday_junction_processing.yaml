  connections:
    - source: ruva_junction_recognition
      target: ruvb_branch_migration
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: RuvA opens the junction and recruits the RuvB motor before canonical branch migration.
    - source: ruvb_branch_migration
      target: ruvc_junction_resolution
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: RuvB migration allows RuvC to scan the junction and directly supplies the cleavage substrate.
    - source: recg_branch_migration
      target: ruvc_junction_resolution
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: RecG provides a parallel branch-migration route whose product can be resolved by RuvC.
  knowledge_gaps:
    - gap_statement: The relative use of RuvAB and RecG branch migration has not been measured directly in KT2440.
      boundary: >-
        Treat RecG as a parallel route supported by exact family conservation;
        do not imply equal pathway flux without target-strain experiments.
      gap_kind:
        - BIOLOGY
    - gap_statement: No RusA-type backup resolvase was identified in the KT2440 candidate set.
      boundary: >-
        RuvC alone satisfies the conserved resolution step. Absence of a
        lineage-restricted alternative is not a pathway hole.
      gap_kind:
        - CURATION
