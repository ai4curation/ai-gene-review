                  id: PANTHER:PTHR30194:SF3
                  label: CROSSOVER JUNCTION ENDODEOXYRIBONUCLEASE RUVC
                representative_members:
                  - preferred_term: ruvC (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88NJ2
                      label: Crossover junction endodeoxyribonuclease RuvC
                    description: KT2440 ruvC/PP_1215 in the ruvCAB locus.
