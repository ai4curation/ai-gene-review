id: MODULE:bacterial_ruvabc_holliday_junction_processing
title: Bacterial RuvABC Holliday-junction processing
description: >-
  A reusable bacterial homologous-recombination module in which RuvA recognizes
  and opens a four-way Holliday junction, RuvB uses ATP to drive branch migration,
  and RuvC cleaves the migrated junction to produce duplex recombination products.
  RecG supplies a mechanistically parallel branch-migration route in bacteria that
  encode it. Presynaptic RecFOR and RecBCD processing, RecA strand exchange,
  replication restart, and DNA ligation are neighboring modules.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0000725
    title: recombinational repair
    statement: Defines the homology-directed repair process in which Holliday-junction processing operates.
  - source_id: GO:0000400
    title: four-way junction DNA binding
    statement: Defines the structure-specific junction-recognition activity supplied by RuvA.
  - source_id: GO:0009378
    title: four-way junction helicase activity
    statement: Defines ATP-dependent junction branch migration by the RuvB motor.
  - source_id: GO:0008821
    title: crossover junction DNA endonuclease activity
    statement: Defines the structure-specific cleavage reaction supplied by RuvC.
  - source_id: RHEA:13065
    title: ATP hydrolysis reaction
    statement: Defines the chemistry that powers the RuvB and RecG motors.
  - source_id: PANTHER:PTN000349951
    title: PAINT RuvB-family branch-migration node
    statement: >-
      The local PTHR42848 PAINT table assigns four-way-junction helicase activity,
      Holliday-junction complexes, and recombinational repair to this ancestral node.
  - source_id: PMID:9501105
    title: Functional interactions between the holliday junction resolvase and the branch migration motor of Escherichia coli
    statement: >-
      Primary E. coli biochemistry assigns junction loading to RuvA, branch
      migration to the RuvB motor, and resolution to RuvC.
    supporting_text: branch migration is catalysed by the RuvB protein, a hexameric DNA helicase that is loaded onto the junction by RuvA, whereas resolution is promoted by the RuvC endonuclease
  - source_id: PMID:7923356
    title: 'Atomic structure of the RuvC resolvase: a holliday junction-specific endonuclease from E. coli'
    statement: RuvC structure and mutational analysis establish a dimeric acidic catalytic center positioned to cleave Holliday-junction DNA.
    supporting_text: the catalytic center, comprising four acidic residues, lies at the bottom of a cleft that nicely fits a DNA duplex
  - source_id: PMID:8428576
    title: Dissociation of synthetic Holliday junctions by E. coli RecG protein
    statement: RecG provides a branch-migration activity alternative to RuvAB.
    supporting_text: We suggest that RecG and RuvAB provide alternative activities than can promote branch migration of Holliday junctions in recombination and DNA repair
  - source_id: PMID:18375550
    title: Repair and antirepair DNA helicases in Helicobacter pylori
    statement: >-
      Orthologs of RecG and RuvABC are conserved across prokaryotes and form
      separate branch-migration routes; their repair outcomes and downstream
      resolution are taxon-dependent.
    supporting_text: independent pathways that branch migrate Holliday junctions during recombinational DNA repair
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__ruvabc-holliday-junction-processing__ppu03440-deep-research-openscientist.md
    title: OpenScientist PSEPK RuvABC Holliday-junction-processing synthesis
    statement: >-
      Species-aware retrieval resolves the contiguous KT2440 ruvCAB locus, the
      parallel RecG route, the intact RuvC active site, and the spurious PP_0151
      resolvase name.
notes: >-
  The module is species-neutral: RuvABC and RecG are conserved across bacteria.
  Escherichia coli K-12 supplies the experimentally characterized exemplar for
  every role (RuvA, RuvB, RuvC and RecG biochemistry, structures and mutants),
  and Pseudomonas putida KT2440 (contiguous ruvCAB locus PP_1215-PP_1217 and
  recG/PP_5310) is kept as a homology-grade second exemplar. Other lineages are
  not added as representatives because no further gene reviews are needed to
  orient the roles. RecG is an alternative branch-migration motor, not a RuvABC
  subunit and not a resolvase. Family groundings follow the family reviews:
  RuvB is grounded to PANTHER PTHR42848:SF1 (PTHR42848 itself is unnamed, and SF1
  is the whole family) and RuvC to PTHR30194:SF3 (the whole family). RuvA is
  grounded to InterPro IPR000085 rather than to PANTHER PTHR33796, because
  PTHR33796 classifies only a minority of RuvA proteins and KT2440 RuvA (Q88NJ1)
  has no PANTHER assignment. RecG is grounded to InterPro IPR004609 rather than to
  PANTHER PTHR47964, because PTHR47964:SF1 also holds Mfd
  (transcription-repair coupling factor) by the UniProt/InterPro assignments and
  no PANTHER subfamily separates RecG from Mfd; the RecG-specific PAINT node is
  PTN002773745 (DNA helicase activity). The RuvA four-way junction helicase
  assertion at PAINT node PTN008659601 (PTHR33796) is read as a contribution: RuvA
  confers junction specificity, RuvB is the ATPase. A RusA-type backup resolvase is
  lineage-restricted (present in E. coli as a cryptic prophage gene, not
  identified in the KT2440 candidate set) and is not part of the conserved
  module. The RuvA and RecG steps are grounded to InterPro families, which have
  no structured family review of their own; module QC reports that as an
  informational notice. The PANTHER families those proteins also belong to are
  reviewed (PTHR33796 for RuvA, PTHR47964 for RecG and Mfd), and the
  representatives have complete gene reviews. The RecG step requires
  four-way junction helicase activity (GO:0009378), not only 3'-5' DNA helicase
  activity, so that the selector does not admit other 3'-5' helicases such as
  UvrD, PcrA or Rep.
module:
  id: bacterial_ruvabc_holliday_junction_processing
  label: Bacterial RuvABC Holliday-junction processing
  module_type: BIOLOGICAL_PROCESS
  concepts:
