                term:
                  id: GO:0009378
                  label: four-way junction helicase activity
              family:
                preferred_term: RecG family
                term:
                  id: InterPro:IPR004609
                  label: ATP-dependent DNA helicase RecG
                description: >-
                  RecG helicases with the RecG wedge domain (TIGR00643); excludes Mfd,
                  which shares PANTHER PTHR47964:SF1 by the UniProt assignments.
                representative_members:
                  - preferred_term: recG (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P24230
                      label: ATP-dependent DNA helicase RecG
                    description: Experimentally characterized RecG (b3652); PAINT seed of PTN002773745.
                  - preferred_term: recG (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88C73
                      label: ATP-dependent DNA helicase RecG
                    description: KT2440 recG/PP_5310.
            function:
              preferred_term: four-way junction helicase activity (RecG, 3-prime-to-5-prime)
              term:
                id: GO:0009378
                label: four-way junction helicase activity
              substrates:
                - preferred_term: ATP
                - preferred_term: branched DNA intermediate
              products:
                - preferred_term: ADP
                - preferred_term: phosphate
                - preferred_term: branch-migrated DNA intermediate
              evidence:
                - source_id: RHEA:13065
                  statement: Exact ATP hydrolysis reaction.
            processes:
              - preferred_term: recombinational repair
                term:
                  id: GO:0000725
                  label: recombinational repair
            role_description: Provides an RuvAB-independent route for migrating Holliday junctions and remodeling stalled forks.
            evidence:
              - source_id: PMID:7957087
                title: 'Branch migration of Holliday junctions: identification of RecG protein as a junction specific DNA helicase'
                statement: E. coli RecG is a junction-specific helicase with 3'-5' polarity.
                supporting_text: The unwinding proceeds with a clear 3' to 5' polarity with respect to the single strand bound by RecG
