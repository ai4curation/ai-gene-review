                statement: >-
                  PTHR47964 PAINT places DNA helicase activity and DNA repair at this
                  RecG-only node (seeds B. subtilis, E. coli, M. tuberculosis and
                  P. aeruginosa RecG).
    - order: 3
      role: symmetric cleavage and Holliday-junction resolution
      node:
        id: ruvc_junction_resolution
        label: RuvC cleavage and resolution of the Holliday junction
        module_type: REACTION
        annotons:
          - id: ruvc_nuclease_activity
            label: RuvC crossover-junction endonuclease
            participant:
              selector_type: FAMILY
              required_function:
