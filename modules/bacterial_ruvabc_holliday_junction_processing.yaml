      role: four-way-junction recognition and branch-migration-motor loading
      node:
        id: ruva_junction_recognition
        label: RuvA recognition and opening of the Holliday junction
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: ruva_binding_activity
            label: RuvA four-way-junction binding
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: four-way junction DNA binding
                term:
                  id: GO:0000400
                  label: four-way junction DNA binding
              family:
                preferred_term: RuvA family
                term:
                  id: InterPro:IPR000085
                  label: Holliday junction branch migration complex subunit RuvA
                description: >-
                  RuvA proteins (TIGR00084). PANTHER PTHR33796:SF1 classifies only
                  part of this family and does not include KT2440 RuvA.
                representative_members:
                  - preferred_term: ruvA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A809
                      label: Holliday junction branch migration complex subunit RuvA
                    description: Experimentally characterized RuvA (b1861); PAINT seed of PTN008659601.
                  - preferred_term: ruvA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88NJ1
                      label: Holliday junction branch migration complex subunit RuvA
                    description: KT2440 ruvA/PP_1216 in the ruvCAB locus.
            function:
              preferred_term: four-way junction DNA binding
              term:
                id: GO:0000400
                label: four-way junction DNA binding
              substrates:
                - preferred_term: Holliday-junction DNA
              products:
                - preferred_term: opened RuvA-bound Holliday junction
            processes:
              - preferred_term: recombinational repair
                term:
                  id: GO:0000725
                  label: recombinational repair
            role_description: Recognizes the crossover, opens the junction, and creates the platform on which RuvB rings assemble.
            evidence:
              - source_id: PMID:1617728
                title: ATP-dependent branch migration of Holliday junctions promoted by the RuvA and RuvB proteins of E. coli
                statement: RuvA supplies junction specificity and lowers the RuvB requirement; RuvB is the motor.
                supporting_text: RuvA protein provides specificity by binding to the Holliday junction, thereby reducing the requirement for RuvB by 50-fold
              - source_id: PANTHER:PTN008659601
                statement: >-
                  PTHR33796 PAINT places four-way junction helicase activity at this
                  RuvA node (seeds E. coli and M. tuberculosis RuvA); read as
                  RuvA's contribution to the RuvAB helicase.
    - order: 2
      role: canonical ATP-dependent Holliday-junction branch migration
      node:
        id: ruvb_branch_migration
        label: RuvB-driven Holliday-junction branch migration
        module_type: REACTION
        annotons:
          - id: ruvb_motor_activity
            label: RuvB four-way-junction helicase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: four-way junction helicase activity
                term:
                  id: GO:0009378
                  label: four-way junction helicase activity
              family:
                preferred_term: RuvB family
                term:
                  id: PANTHER:PTHR42848:SF1
                  label: HOLLIDAY JUNCTION BRANCH MIGRATION COMPLEX SUBUNIT RUVB
