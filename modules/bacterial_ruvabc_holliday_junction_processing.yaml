                    term:
                      id: UniProtKB:P0A814
                      label: Crossover junction endodeoxyribonuclease RuvC
                    description: Experimentally characterized RuvC (b1863).
            function:
              preferred_term: crossover junction DNA endonuclease activity
              term:
                id: GO:0008821
                label: crossover junction DNA endonuclease activity
              substrates:
                - preferred_term: branch-migrated Holliday-junction DNA
              products:
                - preferred_term: nicked duplex recombination products with 5-prime phosphate and 3-prime hydroxyl ends
            processes:
              - preferred_term: recombinational repair
                term:
                  id: GO:0000725
                  label: recombinational repair
            role_description: Cleaves opposing junction strands at symmetrical positions to resolve the four-way intermediate.
  connections:
    - source: ruva_junction_recognition
      target: ruvb_branch_migration
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: RuvA opens the junction and recruits the RuvB motor before canonical branch migration.
    - source: ruvb_branch_migration
      target: ruvc_junction_resolution
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: RuvB migration allows RuvC to scan the junction and directly supplies the cleavage substrate.
    - source: recg_branch_migration
      target: ruvc_junction_resolution
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: UNVERIFIED
      chaining_note: >-
        RecG produces branched DNA that requires downstream processing, but a
        direct RecG-to-RuvC handoff is not established for KT2440 and the resolver
        of RecG-generated junctions varies among characterized bacteria.
  knowledge_gaps:
    - gap_statement: >-
        The relative flux of Holliday junctions through RuvAB and RecG branch
        migration has not been measured in most bacteria, including P. putida KT2440.
      boundary: >-
        Treat RecG as a parallel route supported by conserved RecG family membership;
        do not imply equal pathway use without strain-specific experiments.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The nuclease that resolves RecG-generated junctions is not established in
        general: E. coli can use RuvC or RusA, and in Helicobacter pylori the RecG
        route lacks a compatible resolver.
      boundary: >-
        Do not treat RuvC as a verified recipient of every RecG product. Keep the
        RecG-to-RuvC handoff unverified.
      gap_kind:
        - BIOLOGY
