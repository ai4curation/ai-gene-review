id: MODULE:atm_dsb_signaling
title: ATM signaling at DNA double-strand breaks — MRN sensing and ATM activation, gammaH2AX-MDC1 amplification, the RNF8-UBE2N-RNF168 ubiquitin cascade, 53BP1-RIF1 versus BRCA1-A recruitment, and phosphatase/deubiquitinase/HECT-ligase attenuation; ATM/MRE11/RAD50/NBN/KAT5/H2AX/MDC1/RNF8/UBE2N/RNF168/TP53BP1/RIF1/BRCA1
description: >-
  A DNA double-strand break (DSB) in chromatin is detected by the MRE11-RAD50-NBN
  (MRN) complex, which binds and tethers the broken DNA ends and recruits the
  serine/threonine kinase ATM through a conserved C-terminal motif of NBN. Inactive
  ATM dimers dissociate into active monomers that autophosphorylate on Ser1981, and
  acetylation of ATM by the histone acetyltransferase KAT5 (TIP60), which is held
  in a constitutive complex with ATM, is needed for full kinase activity. Active
  ATM phosphorylates hundreds of substrates. At the break it phosphorylates the
  histone variant H2AX on Ser139 over megabase domains of flanking chromatin,
  producing gammaH2AX. The tandem BRCT domain of MDC1 binds the phosphorylated
  H2AX C-terminus, and MDC1 in turn binds ATM and NBN, concentrating more MRN-ATM
  on the flanking chromatin and so spreading H2AX phosphorylation in a positive
  feedback loop. ATM-phosphorylated MDC1 recruits the RING E3 ubiquitin ligase
  RNF8 through its FHA domain. RNF8, working with the E2 enzyme UBE2N (UBC13),
  initiates K63-linked ubiquitin chains on chromatin proteins, which recruit a
  second RING ligase, RNF168. RNF168 monoubiquitylates nucleosomal H2A and H2AX on
  Lys13/Lys15 and extends K63-linked chains, amplifying the ubiquitin signal. These
  marks recruit two antagonistic readers. 53BP1 (TP53BP1) binds nucleosomes that
  carry both H4K20me2 and H2AK15ub; the H4K20me2 sites are first unmasked by
  VCP/p97-driven extraction of L3MBTL1 and by RNF8/RNF168-dependent degradation of
  KDM4A. ATM-phosphorylated 53BP1 recruits RIF1, and together they block DNA end
  resection and favour non-homologous end joining, chiefly in G1. The BRCA1-A
  complex, recruited by the RAP80 (UIMC1) ubiquitin-interaction motifs to K63
  chains, carries BRCA1-BARD1 and the K63-specific deubiquitinase BRCC3 (BRCC36);
  BRCA1 and its partner CtIP displace 53BP1-RIF1 from S phase onward, and KAT5
  acetylation of H2AK15, which blocks its ubiquitylation, further limits 53BP1
  binding, so that resection and homologous recombination are favoured. SUMO
  conjugation by PIAS1 and PIAS4 is needed for productive accumulation of 53BP1,
  BRCA1 and RNF168, and the SUMO-targeted ubiquitin ligase RNF4 turns over
  SUMOylated MDC1. In parallel, ATM-phosphorylated RNF20-RNF40 monoubiquitylates
  H2B to relax chromatin for repair. The phosphorylation state of H2AX Tyr142,
  set by the WSTF (BAZ1B) tyrosine kinase and removed by EYA phosphatases, gates
  MDC1 binding and the choice between repair and apoptosis. The signal is confined
  and switched off by phosphatases that dephosphorylate ATM and gammaH2AX (PP2A,
  PP4, PP6 and WIP1/PPM1D), by deubiquitinases that remove the chromatin ubiquitin
  marks (USP3, USP16, USP44) or inhibit UBE2N without catalysis (OTUB1), and by the
  HECT ligases TRIP12 and UBR5, which keep RNF168 levels limiting. ATM output then
  drives checkpoint arrest through CHK2 and p53, apoptosis or senescence, and the
  repair reactions themselves; those downstream programs are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001361
    title: ataxia telangiectasia-mutated (ATM) signaling pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its diagram. The
      diagram draws Atm associated with the MRN complex and with Mdc1; Kat5, Mdc1 and
      the "ATM/DSB regulators" box positively affecting Atm; Atm positively affecting
      H2afx, MRN, Mdc1, Brca1, Tp53bp1, Rnf20 and Rnf40; Baz1b positively affecting
      H2afx (PY142); H2afx associated with Mdc1; Mdc1 associated with Rnf8;
      Rif1 and Mum1 associated with Tp53bp1; Brca1 associated with Rbbp8 and
      antagonising Tp53bp1; and Tp53bp1 and Brca1 driving the NHEJ and HR
      subpathways. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001361.yaml).
  - source_id: GO:0042770
    title: signal transduction in response to DNA damage
    statement: >-
      Curated skos:broadMatch for PW:0001361 in
      projects/RGD_PATHWAY_ONTOLOGY/data/pw_go_curated.sssom.yaml. GO has no
      DSB-specific or ATM-specific signalling term, so this is the module's process
      concept.
  - source_id: GO:0000077
    title: DNA damage checkpoint signaling
    statement: >-
      Curated skos:narrowMatch for PW:0001361. It covers only the checkpoint arm of
      ATM signalling, and it also covers ATR-dependent checkpoint signalling, so it
      is recorded as a related process on the ATM annoton rather than as the module
      concept.
  - source_id: gomodel:617b481400000460
    title: KAT5 involvement in DNA repair via homologous recombination (Human)
    statement: >-
      The project's best-overlap GO-CAM for PW:0001361 (cached under
      gocams/617b481400000460/). It models RNF168 histone H2AK15 ubiquitin ligase
      activity directly providing input for TP53BP1 ubiquitin-modified histone reader
      and H4K20me2 reader activities, and KAT5 histone H2A acetyltransferase and the
      MBTD1 H4K20me reader acting on the 53BP1 node, plus PIAS4 SUMO ligase activity.
      The pathway-choice part of this module is grounded in it.
  - source_id: gomodel:65a1f4f800000487
    title: Phosphorylation of H2AX by ATM or ATR promotes recruitment of NBN and MRN complex to DNA damage sites (Human).
    statement: >-
      Human GO-CAM in which ATM (and ATR) histone H2AXS139 kinase activity directly
      provides input for H2AX chromatin-protein adaptor activity, which positively
      regulates NBN chromatin-protein adaptor activity. It is the basis for treating
      H2AX as a participant (scaffold) rather than only a substrate.
  - source_id: PMID:15790808
    title: ATM activation by DNA double-strand breaks through the Mre11-Rad50-Nbs1 complex.
    statement: MRN is the DSB sensor that recruits and activates ATM.
    supporting_text: We show that the Mre11-Rad50-Nbs1 (MRN) complex acts as a double-strand break sensor for ATM and recruits ATM to broken DNA molecules.
  - source_id: PMID:16427009
    title: MDC1 maintains genomic stability by participating in the amplification of ATM-dependent DNA damage signals.
    statement: H2AX, MDC1 and ATM form the positive feedback loop at the core of the module.
    supporting_text: At the molecular level, H2AX, MDC1, and ATM form a positive feedback loop, with MDC1 directly mediating the interaction between H2AX and ATM.
  - source_id: PMID:23333306
    title: A cell cycle-dependent regulatory circuit composed of 53BP1-RIF1 and BRCA1-CtIP controls DNA repair pathway choice.
    statement: The module ends at the 53BP1 versus BRCA1 pathway-choice node.
    supporting_text: DNA double-strand break (DSB) repair pathway choice is governed by the opposing activities of 53BP1 and BRCA1.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001361 through the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier candidate; no existing
  module). RGD curates 39 human genes to PW:0001361: ATM BAZ1B BRCA1 BRCC3 EYA1 EYA3
  H2AX KAT5 KDM4A L3MBTL1 MDC1 MRE11 NBN OTUB1 PIAS1 PIAS4 PPM1D PPP2CA PPP4C PPP5C
  PPP6C PSMD14 PWWP3A RAD50 RBBP8 RIF1 RNF168 RNF20 RNF4 RNF40 RNF8 TP53BP1 TRIP12
  UBE2N UBR5 USP16 USP3 USP44 VCP. Thirty-four are modelled as participants (KDM4A and
  L3MBTL1 appear only as targets of the activities that remove them; see decision 4).
  Five gene products not on the RGD list are added as units of the BRCA1-A complex
  (UIMC1/RAP80, ABRAXAS1, BABAM1, BABAM2, BARD1), because the RGD list includes BRCC3
  and BRCA1 but not the subunits that make the complex a ubiquitin reader. Molecular
  functions were taken from each protein's experimental GO annotations in QuickGO
  (October 2026) and, where a gene review exists (ATM, BRCA1, VCP, EYA1, PIAS1,
  PPP2CA, ABRAXAS1, BABAM1, BABAM2, BARD1), from its core functions. Two departures
  from experimental human GOA are deliberate: ATM histone H2AXS139 kinase activity
  (GO:0035979) has only ISS/IEA rows in human (accepted in the ATM review), but it is
  the activity the curated human GO-CAM gomodel:65a1f4f800000487 uses and is
  supported by PMID:11571274; and RIF1 has no experimental MF row, so its annoton
  carries a process but no function.

  Comparator check for H2AX (CLAUDE.md, substrate versus participant). H2AX is
  phosphorylated by ATM, ubiquitylated by RNF8/RNF168 and dephosphorylated by
  PPM1D/PP2A/PP4/PP6, so it is a substrate several times over. It is nevertheless
  modelled as a participant, because it does work that the downstream steps depend
  on: the phosphorylated C-terminal tail is the docking epitope for MDC1, so H2AX is
  the scaffold case (like thyroglobulin in thyroid hormone generation) rather than
  the angiotensinogen case. Curators agree: H2AX carries chromatin-protein adaptor
  activity GO:0140463 (IDA), GO:1990166 protein localization to site of
  double-strand break (IDA) and GO:0000077 DNA damage checkpoint signaling (IDA),
  and the human GO-CAM gomodel:65a1f4f800000487 gives H2AX its own adaptor activity
  that positively regulates NBN. The other human proteins annotated to GO:1990166
  in QuickGO include MDC1, NBN and TP53BP1, the scaffold/reader members of this
  module. By contrast, KDM4A and L3MBTL1 are only objects of the cascade: they are
  H4K20me2 readers that occlude 53BP1 binding sites and are removed by
  RNF8/RNF168-dependent degradation (KDM4A) or VCP-driven extraction (L3MBTL1). Their
  role is inhibitory and passive, so they appear as targets of the RNF168 and VCP
  activities rather than as annotons.

  Boundary decisions. (1) The module stops at the recruitment of the two
  pathway-choice readers. Checkpoint effectors (CHK2, p53, CDC25A), apoptosis and
  senescence, end resection (RBBP8/CtIP, EXO1, DNA2-BLM), homologous recombination
  (BRCA2, PALB2, RAD51) and non-homologous end joining (Ku, DNA-PKcs, XRCC4-LIG4,
  shieldin) are downstream programs. No human module exists for any of them yet
  (modules/ was searched for p53, checkpoint, homologous recombination, NHEJ,
  resection, MRN and ATM): the only related human-scope node is
  g2_m_transition#checkpoint_restraint, an abstract CHK1-centred step that is the
  ATR rather than the ATM arm, so it is not referenced. Other-taxon modules on
  neighbouring biology exist only by name: dmel_mrn_complex,
  dmel_atr_atrip_complex, dmel_9_1_1_checkpoint_clamp,
  bacterial_nonhomologous_end_joining and bacterial_recbcd_end_resection. The PW
  subpathways RGD links from the diagram (PW:0000094 cell cycle checkpoint,
  PW:0000718 p53 signaling, PW:0000009 apoptotic cell death, PW:0000202
  homologous recombination, PW:0000203 non-homologous end joining, PW:0000235
  adaptive immune response via V(D)J and class switch recombination) are therefore
  mentioned here but not listed as evidence sources. (2) RBBP8 (CtIP) is excluded
  as a participant. It is on the RGD list and associated with Brca1 on the
  diagram, but its activity (single-stranded DNA endonuclease, with MRE11 in
  resection) is the first step of the HR reaction, not of the signal; it is named
  in the BRCA1 variant as the partner through which BRCA1 antagonises 53BP1-RIF1
  (PMID:23333306). (3) PWWP3A (MUM1/EXPAND1) is excluded. RGD draws Mum1 associated
  with Tp53bp1 and its only experimental MF in human GOA is nucleosome binding; its
  role as a 53BP1-dependent chromatin decondensation factor rests on a single
  study not cached here, and it is recorded as a candidate to add to the 53BP1 arm.
  (4) KDM4A and L3MBTL1 are targets, not participants (see the comparator
  paragraph). (5) PSMD14 (POH1/RPN11) is excluded. It is the constitutive
  deubiquitinase of the 19S proteasome lid; it opposes RNF8/RNF168 K63 chains and
  restricts 53BP1 accumulation (PMID:22909820), but this is proteasome function
  acting on the DSB ubiquitin marks, and it is better placed in a proteasome module
  than as a dedicated signalling component. (6) PPP5C (PP5) is placed with ATM
  activation, not with attenuation: although RGD groups it with the phosphatases,
  PP5 is required for DNA-damage-induced ATM autophosphorylation and activity
  (PMID:14871926). (7) BAZ1B (WSTF), EYA1 and EYA3 are included as the H2AX Tyr142
  switch, because Y142 dephosphorylation is required for MDC1 binding and so gates
  the main amplification loop; the apoptosis branch that pY142 favours is left
  downstream. BAZ1B's chromatin-remodelling role in the WICH complex is not
  modelled. (8) RNF20-RNF40 H2B monoubiquitylation is included as a parallel,
  H2AX-independent ATM output, as RGD draws it (Atm --+> Rnf20/Rnf40 --+>
  chromatin relaxation). (9) The SUMO arm (PIAS1, PIAS4, RNF4) is included because
  PIAS-dependent SUMOylation is required for productive 53BP1, BRCA1 and RNF168
  accumulation and RNF4 clears SUMO-MDC1; it is in the KAT5 GO-CAM
  (gomodel:617b481400000460, PIAS4) and the MRE11 SUMOylation GO-CAM
  (gomodel:65a1f4f800002665, PIAS1). RNF4 and VCP also act together in the PARP1
  extraction GO-CAM gomodel:627d95ee00001139, a different process not used here.
  (10) Effector checkpoint kinase CHK2 and p53 are not modelled; ATM's process
  annotation to GO:0000077 records the checkpoint output.

  GO-CAM and GOA observations for upstream review. In gomodel:617b481400000460 the
  KAT5 activity at node 617b481400000763 is typed as bare protein binding
  (GO:0005515); the model's own evidence (PMID:27153538) supports KAT5 H2AK15
  acetylation, already captured at node 617b481400000461. In
  gomodel:65a1f4f800000487 H2AX positively regulates NBN directly, without MDC1,
  although MDC1 is the reader of gammaH2AX that recruits NBN (PMID:16427009); the
  companion model gomodel:65a1f4f800000428 includes MDC1. ATM carries
  GO:0035979 only by ISS/IEA in human GOA despite direct in vitro evidence
  (PMID:11571274). RIF1 has no experimental molecular function in human GOA.
  Gene reviews exist for ATM, BRCA1, BARD1, VCP, EYA1, PIAS1, PPP2CA, ABRAXAS1,
  BABAM1 and BABAM2; the other members have none. PANTHER family ids and PTNs are
  deliberately not asserted.
module:
  id: atm_dsb_signaling
  label: ATM signaling at DNA double-strand breaks
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: signal transduction in response to DNA damage
      term:
        id: GO:0042770
        label: signal transduction in response to DNA damage
      description: >-
        The GO process mapped (skos:broadMatch) to PW:0001361. Here restricted to
        the ATM branch initiated by double-strand breaks.
    - preferred_term: protein localization to site of double-strand break
      term:
        id: GO:1990166
        label: protein localization to site of double-strand break
      description: >-
        The assembly of mediator and reader proteins on DSB-flanking chromatin that
        is the cascade's direct output.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: site of double-strand break
        term:
          id: GO:0035861
          label: site of double-strand break
  parts:
    - order: 1
      role: DSB sensing by MRN and ATM activation
      node:
        id: atm_activation
        label: MRN recruitment and activation of ATM, with KAT5 acetylation of ATM
        module_type: REGULATORY_STEP
        description: >-
          MRN binds the DNA ends and recruits ATM through the NBN C-terminus; inactive
          ATM dimers dissociate, ATM autophosphorylates on Ser1981 and is acetylated
          by KAT5 (TIP60), and PP5 activity is required for full activation.
        annotons:
          - id: mrn_atm_activator
            label: MRN complex activates ATM at DNA ends
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: MRE11-RAD50-NBN (MRN) complex
                term:
                  id: GO:0030870
                  label: Mre11 complex
                active_units:
                  - id: mrn_mre11
                    label: MRE11 nuclease subunit
                    role: Binds and processes DNA ends; nuclease core of the complex.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MRE11
                        term:
                          id: UniProtKB:P49959
                          label: Double-strand break repair protein MRE11
                    function:
                      preferred_term: DNA endonuclease activity
                      term:
                        id: GO:0004520
                        label: DNA endonuclease activity
                  - id: mrn_rad50
                    label: RAD50 ATPase subunit
                    role: ATP-dependent DNA end binding and tethering; DNA unwinding by MRN is needed for ATM stimulation.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RAD50
                        term:
                          id: UniProtKB:Q92878
                          label: DNA repair protein RAD50
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: mrn_nbn
                    label: NBN (NBS1) ATM-recruiting subunit
                    role: Its conserved C-terminal motif binds and recruits ATM to the break.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NBN
                        term:
                          id: UniProtKB:O60934
                          label: Nibrin
                    function:
                      preferred_term: protein serine/threonine kinase activator activity
                      term:
                        id: GO:0043539
                        label: protein serine/threonine kinase activator activity
                    evidence:
                      - source_id: PMID:15758953
                        statement: The NBN C-terminal motif is required for ATM recruitment to damage and for ATM signalling.
                        supporting_text: Here we identify related, conserved carboxy-terminal motifs in human Nbs1, ATRIP and Ku80 proteins that are required for their interaction with ATM, ATR and DNA-PKcs, respectively.
            function:
              preferred_term: protein serine/threonine kinase activator activity
              term:
                id: GO:0043539
                label: protein serine/threonine kinase activator activity
              targets:
                - preferred_term: ATM
                  term:
                    id: UniProtKB:Q13315
                    label: Serine-protein kinase ATM
            locations:
              - preferred_term: site of double-strand break
                term:
                  id: GO:0035861
                  label: site of double-strand break
            role_description: >-
              The DSB sensor for ATM. MRN is also an ATM substrate, and hypomorphic NBN
              and MRE11 mutations cause Nijmegen breakage syndrome and A-T-like disease.
            evidence:
              - source_id: PMID:15790808
                statement: MRN monomerises and activates ATM in vitro; DNA unwinding by MRN is essential.
                supporting_text: Inactive ATM dimers were activated in vitro with DNA in the presence of MRN, leading to phosphorylation of the downstream cellular targets p53 and Chk2.
              - source_id: PMID:14532133
                statement: Functional MRN is required for ATM activation in cells.
                supporting_text: Here we show that functional MRN is required for ATM activation, and consequently for timely activation of ATM-mediated pathways.
            gocam_associations:
              - model: gomodel:65a1f4f800002560
                activity: gomodel:65a1f4f800002560/65a1f4f800002570
                title: Mre11 complex protein serine/threonine kinase activator activity (GO:0043539)
              - model: gomodel:65a1f4f800002665
                activity: gomodel:65a1f4f800002665/65a1f4f800002675
                title: Mre11 complex protein serine/threonine kinase activator activity (GO:0043539)
          - id: kat5_atm_acetylation
            label: KAT5 (TIP60) acetylation of ATM
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KAT5 (TIP60)
                term:
                  id: UniProtKB:Q92993
                  label: Histone acetyltransferase KAT5
            function:
              preferred_term: protein-lysine-acetyltransferase activity
              term:
                id: GO:0061733
                label: protein-lysine-acetyltransferase activity
              targets:
                - preferred_term: ATM
                  term:
                    id: UniProtKB:Q13315
                    label: Serine-protein kinase ATM
            locations:
              - preferred_term: site of double-strand break
                term:
                  id: GO:0035861
                  label: site of double-strand break
            role_description: >-
              Forms a stable complex with ATM through the ATM FATC domain; its
              acetyltransferase activity is switched on by DNA damage and is needed for
              ATM kinase activation.
            evidence:
              - source_id: PMID:16141325
                statement: DNA damage induces Tip60-dependent ATM acetylation, and Tip60 loss blocks ATM activation.
                supporting_text: This acetylation depends on the Tip60 histone acetyltransferase (HAT). Suppression of Tip60 blocks the activation of ATM's kinase activity and prevents the ATM-dependent phosphorylation of p53 and chk2.
          - id: ppp5c_atm_activation
            label: PP5 (PPP5C) requirement for ATM activation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PPP5C
                term:
                  id: UniProtKB:P53041
                  label: Serine/threonine-protein phosphatase 5
            function:
              preferred_term: protein serine/threonine phosphatase activity
              term:
                id: GO:0004722
                label: protein serine/threonine phosphatase activity
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Binds ATM in a damage-inducible manner; catalytically inactive PP5 blocks
              ATM Ser1981 autophosphorylation. Its phosphatase substrate in this role is
              not known.
            evidence:
              - source_id: PMID:14871926
                statement: Catalytic activity of PP5 is needed for ATM autophosphorylation and checkpoint signalling.
                supporting_text: Expression of a catalytically inactive PP5 mutant inhibited the phosphorylation of ATM substrates and the autophosphorylation of ATM on Ser 1981, and caused an S-phase checkpoint defect in DNA-damaged cells.
          - id: atm_kinase
            label: ATM serine/threonine kinase activity on DSB-response substrates
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATM
                term:
                  id: UniProtKB:Q13315
                  label: Serine-protein kinase ATM
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: ATM (Ser1981 autophosphorylation)
                  term:
                    id: UniProtKB:Q13315
                    label: Serine-protein kinase ATM
                - preferred_term: NBN
                  term:
                    id: UniProtKB:O60934
                    label: Nibrin
                - preferred_term: MDC1
                  term:
                    id: UniProtKB:Q14676
                    label: Mediator of DNA damage checkpoint protein 1
                - preferred_term: TP53BP1
                  term:
                    id: UniProtKB:Q12888
                    label: TP53-binding protein 1
                - preferred_term: BRCA1
                  term:
                    id: UniProtKB:P38398
                    label: Breast cancer type 1 susceptibility protein
                - preferred_term: RNF20
                  term:
                    id: UniProtKB:Q5VTR2
                    label: E3 ubiquitin-protein ligase BRE1A
            processes:
              - preferred_term: DNA damage checkpoint signaling
                term:
                  id: GO:0000077
                  label: DNA damage checkpoint signaling
            locations:
              - preferred_term: site of double-strand break
                term:
                  id: GO:0035861
                  label: site of double-strand break
            role_description: >-
              The pathway kinase. Activated ATM phosphorylates mediators at the break and
              soluble effectors (CHK2, p53) that carry the checkpoint output, which is
              outside the module.
            evidence:
              - source_id: PMID:12556884
                statement: Intermolecular Ser1981 autophosphorylation dissociates inactive ATM dimers.
                supporting_text: Cellular irradiation induces rapid intermolecular autophosphorylation of serine 1981 that causes dimer dissociation and initiates cellular ATM kinase activity.
            gocam_associations:
              - model: gomodel:65a1f4f800002560
                activity: gomodel:65a1f4f800002560/65a1f4f800002582
                title: ATM protein serine/threonine kinase activity (GO:0004674), Ufmylation of MRE11 promotes ATM activation by MRN (Human)
    - order: 2
      role: H2AX Ser139 phosphorylation and gammaH2AX scaffold
      node:
        id: h2ax_phosphorylation
        label: ATM phosphorylation of H2AX Ser139 (gammaH2AX)
        module_type: REACTION
        description: >-
          ATM phosphorylates H2AX on Ser139 in chromatin flanking the break; the
          phosphorylated tail is the docking platform that organises the rest of the
          cascade. DNA-PK contributes in the absence of ATM.
        annotons:
          - id: atm_h2ax_kinase
            label: ATM histone H2AX Ser139 kinase activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATM
                term:
                  id: UniProtKB:Q13315
                  label: Serine-protein kinase ATM
            function:
              preferred_term: histone H2AXS139 kinase activity
              term:
