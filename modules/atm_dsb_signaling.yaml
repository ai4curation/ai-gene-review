    - order: 9
      role: repair pathway choice at the ubiquitylated chromatin
      node:
        id: pathway_choice
        label: 53BP1-RIF1 versus BRCA1-A recruitment (repair pathway-choice node)
        module_type: REGULATORY_STEP
        description: >-
          The ubiquitylated, H4K20me2-unmasked chromatin recruits two antagonistic
          reader systems. 53BP1-RIF1 blocks resection and favours NHEJ, chiefly in
          G1; BRCA1 (recruited in the BRCA1-A complex, and with CtIP) displaces
          53BP1-RIF1 from S phase onward, and KAT5 acetylation of H2AK15 blocks the
          53BP1-binding ubiquitin mark, together favouring resection and HR.
        evidence:
          - source_id: PMID:23333306
            statement: 53BP1 inhibits BRCA1 accumulation in G1, and RIF1 accumulation is antagonised by BRCA1 and CtIP.
            supporting_text: Remarkably, RIF1 accumulation at DSB sites is strongly antagonized by BRCA1 and its interacting partner CtIP.
        variant_sets:
          - id: dsb_reader_choice
            label: 53BP1 (NHEJ-favouring) versus BRCA1 (HR-favouring) reader systems
            axis: cell-cycle-dependent repair pathway choice
            selection: ONE_OR_MORE
            notes: >-
              Both readers are recruited by the same RNF168-dependent chromatin marks
              and compete; which dominates depends mainly on cell-cycle phase (53BP1-RIF1
              in G1, BRCA1-CtIP from S phase). They can co-occupy foci, with 53BP1 moved
              to the periphery by BRCA1, so ONE_OR_MORE rather than EXACTLY_ONE.
