knowledge_gaps:
  - gap_statement: >-
      How MRN converts DNA end binding into ATM activation is unresolved: whether ATM
      monomerisation depends on MRN-generated single-stranded oligonucleotides, on
      DNA end tethering by RAD50, or on chromatin changes sensed through KAT5 binding
      to H3K9me3, and how these mechanisms are weighted in cells.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      How 53BP1-RIF1 and BRCA1 displace each other at the same ubiquitylated
      chromatin is incompletely understood, including how much depends on BRCA1-BARD1
      ubiquitylation of H2A K125-129, on KAT5 H2AK15 acetylation, on 53BP1
      dephosphorylation, or on CtIP-dependent remodelling, and what molecular
      activity RIF1 itself contributes.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      The relative contributions and substrate selectivity of the many phosphatases
      (PP2A, PP4, PP6, WIP1) and deubiquitinases (USP3, USP16, USP44, BRCC3, OTUB1)
      that attenuate the signal are unclear; single depletions have mild effects,
      suggesting redundancy, and which enzyme terminates the ATM-generated, as opposed
      to the ATR-generated, gammaH2AX in vivo is not known.
    gap_kind:
      - BIOLOGY
