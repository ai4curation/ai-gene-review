            role_description: The major H2AX Ser139 kinase after DSBs.
            evidence:
              - source_id: PMID:11571274
                statement: ATM phosphorylates H2AX in vitro and is required for H2AX phosphorylation and foci in cells.
                supporting_text: Our results clearly establish ATM as the major kinase involved in the phosphorylation of H2AX and suggest that ATM is one of the earliest kinases to be activated in the cellular response to double-strand breaks.
