id: MODULE:dmel_smn_complex
title: Survival motor neuron (SMN) complex in Drosophila melanogaster
description: >-
  The survival motor neuron (SMN) complex assembles the heptameric Sm protein ring onto the
  Sm site of spliceosomal snRNAs in the cytoplasm, the key step of Sm-class snRNP biogenesis.
  SMN oligomerizes and binds Gemin2, which holds a pentamer of Sm proteins; Gemin5 recognizes
  the snRNA, and Gemin3 is a DEAD-box helicase subunit. Drosophila has a reduced set of Gemin
  proteins compared with vertebrates and carries three Gemin4 paralogs (Glos/Gemin4a, Gem4b,
  Gem4c); FlyBase defines SMN complex variants that differ in which Gemin4 paralog they contain.
  Loss of Smn in flies causes defects in snRNP assembly, motor function and viability, modelling
  spinal muscular atrophy.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000470
  title: 'FlyBase gene group GEM: Gemins'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as gemins (GEM); this module
    models that group.
- source_id: FB:FBgg0001830
  title: 'FlyBase gene group SMN-CPX: Survival motor neuron complex variants'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as survival motor neuron complex
    variants (SMN-CPX); this module models that group.
- source_id: GO:0032797
  title: SMN complex
  statement: >-
    GO term grounding the module as SMN complex.
notes: >-
  FlyBase groups the Gemins (GEM) and three SMN complex variants (SMN-C with Gem4a/Glos, SMN-C-4B
  with Gem4b, SMN-C-4C). The FlyBase SMN-C-4C group lists only Smn, Gem2, Gem3 and rig and
  omits Gem4c itself; Gem4c is assigned to the Gemin4c variant here on the basis of the group
  name and its GEM membership. Whether one complex holds exactly one Gemin4 paralog is inferred
  from the FlyBase variant definitions. Sm proteins, the substrate of the complex, are in
  dmel_spliceosome. FlyBase groups realized by this module: GEM (FBgg0000470), SMN-CPX (FBgg0001830).
  Subgroups folded into it: SMN-C, SMN-C-4B, SMN-C-4C. Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_smn_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
