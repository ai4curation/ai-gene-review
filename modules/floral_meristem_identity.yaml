id: MODULE:floral_meristem_identity
title: Specification of floral meristem identity at the Arabidopsis shoot apex
description: >-
  After floral induction the Arabidopsis shoot apical meristem becomes an indeterminate inflorescence
  meristem whose lateral primordia must be assigned floral, rather than shoot, fate. Floral integrators
  supply the input: the florigen FT, a PEBP-family protein made in leaves, reaches the apex and acts as a
  transcriptional coactivator of the bZIP factor FD to activate APETALA1 (AP1) and the MADS-box
  integrators SOC1 and FRUITFULL (FUL); SOC1 (as a heterodimer with AGL24) binds the LEAFY (LFY) promoter
  and activates it, and FUL promotes the reproductive transition partially redundantly with SOC1. LFY,
  a plant-specific DNA-binding transcription factor, directly induces AP1 in the floral anlagen, and AP1
  in turn up-regulates LFY, so the two lock in floral fate through positive feedback. The SQUAMOSA-clade
  MADS factors AP1, CAULIFLOWER (CAL) and FUL act partially redundantly in this step (ap1 cal ful triple
  mutants make no flowers); AP1 also acts as a master repressor in the young flower, directly silencing
  the flowering-time/inflorescence genes SOC1, AGL24 and SVP so that the shoot program does not continue
  in floral meristems. The F-box protein UNUSUAL FLORAL ORGANS (UFO) binds LFY and DNA to form a
  LFY-UFO transcriptional complex that redirects LFY to region-specific targets in the young flower.
  TERMINAL FLOWER1 (TFL1), a PEBP paralog of FT, is expressed in the centre of the inflorescence meristem
  and acts as an FD-dependent corepressor that keeps LFY and AP1 out of the shoot apex, maintaining
  indeterminate inflorescence identity; AP1 and LFY reciprocally repress TFL1 in floral primordia. The
  A-class factor APETALA2 contributes to floral meristem establishment alongside AP1. Floral organ
  identity (the ABCE program activated later by LFY, UFO and AP1 together with SEP proteins), the
  leaf-side photoperiod pathway that produces FT, and the age, vernalization and gibberellin pathways
  converging on the integrators are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10368173
    title: Interactions among APETALA1, LEAFY, and TERMINAL FLOWER1 specify meristem fate.
    statement: >-
      Floral fate of lateral meristems is assigned by LFY, AP1 and CAL; LFY and AP1 activate each other
      and both antagonize TFL1, which bars them from the inflorescence meristem.
    supporting_text: >-
      Therefore, the normally sharp phase transition between the production of leaves with associated
      shoots and formation of the flowers, which occurs upon floral induction, is promoted by positive
      feedback interactions between LFY and AP1, together with negative interactions of these two genes
      with TFL1.
  - source_id: PMID:10648231
    title: Redundant regulation of meristem identity and plant architecture by FRUITFULL, APETALA1 and
      CAULIFLOWER.
    statement: FUL, AP1 and CAL act redundantly; without them LFY is not up-regulated and TFL1 is ectopic.
    supporting_text: >-
      We demonstrate that this phenotype is caused both by the lack of LFY upregulation and by the ectopic
      expression of the TERMINAL FLOWER1 (TFL1) gene.
  - source_id: PMID:17428825
    title: Specification of Arabidopsis floral meristem identity by repression of flowering time genes.
    statement: AP1 directly represses SVP, AGL24 and SOC1 in emerging floral meristems.
    supporting_text: >-
      These findings indicate that once AP1 is activated during the floral transition, it acts partly as
      a master repressor in floral meristems by directly suppressing the expression of flowering time
      genes, thus preventing the continuation of the shoot developmental program.
  - source_id: file:ARATH/AP1/AP1-ai-review.yaml
    title: AP1 gene review
    statement: >-
      The AP1 review proposes a new GO term "floral meristem identity specification" (parent GO:0010228);
      this module uses GO:0010228 as the closest existing process term pending that request.
notes: >-
  Concrete Arabidopsis instance. Every annoton is grounded on the Swiss-Prot accession of a reviewed gene in
  genes/ARATH and its function term is taken from that review's core_functions. GO has no process term for
  floral meristem identity specification as distinct from determinacy; GO:0010228 (vegetative to
  reproductive phase transition of meristem) is used as the module concept, with GO:0010582 (floral
  meristem determinacy) for the floral-fate step, and the AP1 review carries the proposed new term.
  FUL is modelled twice because it has two separable roles in this module: an integrator role at the
  shoot apex (with SOC1) and a redundant floral-fate role with AP1/CAL in primordia; ap1 cal ful plants
  never flower. AGL24 and SVP (SOC1 partners and AP1 repression targets), the 14-3-3 proteins of the
  florigen activation complex, the SPL/miR156 age-pathway inputs and BOP1/BOP2 are referenced in prose
  only. FD is included as the DNA-binding partner of FT; FT production in leaves is covered by the
  photoperiodic_flowering_co_ft module. The ABCE floral organ identity program (AP3/PI/AG/SEP) downstream
  of LFY, UFO and AP1 is covered by floral_organ_identity_abce. No production GO-CAM in gocams/index.tsv
  contains these Arabidopsis gene products, so no gocam_associations are given. PANTHER family ids are not
  asserted; all participants are concrete gene products.
module:
  id: floral_meristem_identity
  label: Floral meristem identity specification
  module_type: DEVELOPMENTAL_PROCESS
  concepts:
    - preferred_term: floral meristem identity specification (closest GO term)
      term:
        id: GO:0010228
        label: vegetative to reproductive phase transition of meristem
      description: >-
        Conversion of shoot-apex output from vegetative/inflorescence shoots to flowers; used as the
        closest existing GO process for assignment of floral identity to lateral meristems.
    - preferred_term: floral meristem determinacy
      term:
        id: GO:0010582
        label: floral meristem determinacy
      description: >-
        Floral meristems produced under LFY/AP1/CAL control are determinate; loss of these factors yields
        reiterating, shoot-like meristems.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: floral integrator input at the shoot apex
      node:
        id: integrator_input
        label: Floral integrators activate meristem identity genes
        module_type: REGULATORY_STEP
        description: >-
          At the shoot apex the FT-FD complex and the MADS-box integrators SOC1 and FUL convert flowering
          signals into transcriptional activation of LFY and AP1.
        annotons:
          - id: ft_coactivator
            label: "FT: florigen, coactivator of FD"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FT (At1g65480)
                term:
                  id: UniProtKB:Q9SXZ2
                  label: Protein FLOWERING LOCUS T
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Mobile florigen that, once at the apex, partners with FD to activate floral identity genes
              such as AP1.
            evidence:
              - source_id: PMID:16099980
                statement: An FT-FD complex activates floral identity genes such as AP1.
                supporting_text: >-
                  A complex of FT and FD proteins in turn can activate floral identity genes such as
                  APETALA1 (AP1).
          - id: fd_bzip_activator
            label: "FD: bZIP DNA-binding partner of FT"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FD (At4g35900)
                term:
                  id: UniProtKB:Q84JK2
                  label: Protein FD
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Apex-expressed bZIP factor that provides the DNA-binding moiety for FT (and TFL1) action.
            evidence:
              - source_id: PMID:16099979
                statement: FD and FT act together at the apex to activate AP1.
                supporting_text: >-
                  FD and FT are interdependent partners through protein interaction and act at the shoot
                  apex to promote floral transition and to initiate floral development through
                  transcriptional activation of a floral meristem identity gene, APETALA1 (AP1).
          - id: soc1_integrator
            label: "SOC1: MADS-box integrator, activator of LFY"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOC1 (At2g45660)
                term:
                  id: UniProtKB:O64645
                  label: MADS-box protein SOC1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: vegetative to reproductive phase transition of meristem
                term:
                  id: GO:0010228
                  label: vegetative to reproductive phase transition of meristem
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Binds the LFY promoter (as a SOC1-AGL24 heterodimer that enters the nucleus) and activates
              LFY expression.
            evidence:
              - source_id: PMID:18466303
                statement: SOC1 binds the LFY promoter directly.
                supporting_text: >-
                  Here, we show that SOC1 directly binds to the distal and proximal region of the LFY
                  promoter where critical cis-elements are located.
          - id: ful_integrator
            label: "FUL: MADS-box integrator at the shoot apex"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FUL (AGL8, At5g60910)
                term:
                  id: UniProtKB:Q38876
                  label: Agamous-like MADS-box protein AGL8
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: vegetative to reproductive phase transition of meristem
                term:
                  id: GO:0010228
                  label: vegetative to reproductive phase transition of meristem
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Rapidly induced at the apex by flowering signals; promotes the meristem identity transition
              partially redundantly with SOC1 (FUL-SVP and FUL-SOC1 heterodimers).
            evidence:
              - source_id: PMID:24465009
                statement: FUL promotes the reproductive transition redundantly with SOC1.
                supporting_text: >-
                  A model is proposed where the sequential formation of FUL-SVP and FUL-SOC1 heterodimers
                  may mediate the vegetative and meristem identity transitions
    - order: 2
      role: LEAFY activation and LFY-UFO complex
      node:
        id: lfy_program
        label: LEAFY floral meristem identity program
        module_type: REGULATORY_STEP
        description: >-
          LFY, expressed throughout young floral primordia, directly activates AP1 at the stage when floral
          fate is assumed; UFO binds LFY and DNA to redirect LFY to additional cis-elements in specific
          regions of the young flower.
        annotons:
          - id: lfy_master_tf
            label: "LFY: floral meristem identity transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LFY (At5g61850)
                term:
                  id: UniProtKB:Q00958
                  label: Protein LEAFY
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: floral meristem determinacy
                term:
                  id: GO:0010582
                  label: floral meristem determinacy
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Directly induces early AP1 expression in floral anlagen; LFY activity levels set the
              threshold for flower initiation.
            evidence:
              - source_id: PMID:10417387
                statement: Early AP1 expression results from direct transcriptional induction by LFY.
                supporting_text: >-
                  Use of steroid-inducible activation of LFY demonstrated that early expression of AP1 is
                  a result of transcriptional induction by LFY.
          - id: ufo_lfy_cofactor
            label: "UFO: F-box transcriptional cofactor of LFY"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UFO (At1g30950)
                term:
                  id: UniProtKB:Q39090
                  label: Protein UNUSUAL FLORAL ORGANS
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            processes:
              - preferred_term: regulation of DNA-templated transcription
                term:
                  id: GO:0006355
                  label: regulation of DNA-templated transcription
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Forms a LFY-UFO-DNA complex that redirects LFY to new cis-elements; required for full
              floral meristem identity and for region-specific LFY targets such as AP3. Its SCF
              (ubiquitin ligase adaptor) association is largely dispensable for this role.
            evidence:
              - source_id: PMID:36732360
                statement: UFO forms an active transcriptional complex with LFY at new regulatory elements.
                supporting_text: >-
                  we establish that UFO instead acts by forming an active transcriptional complex with LFY
                  at newly discovered regulatory elements.
              - source_id: PMID:7780306
                statement: ufo mutants show defects in floral meristem identity.
                supporting_text: >-
                  UFO is required for the proper identity of the floral meristem and acts in three
                  different aspects of the process that distinguishes flowers from shoots.
    - order: 3
      role: AP1/CAL/FUL floral fate and repression of the shoot program
      node:
        id: ap1_floral_fate
        label: AP1/CAL/FUL establish floral fate
        module_type: REGULATORY_STEP
        description: >-
          The SQUAMOSA-clade MADS factors AP1, CAL and FUL act partially redundantly in floral primordia to
          up-regulate LFY and to exclude TFL1; AP1 directly represses SOC1, AGL24 and SVP so that floral
          meristems do not revert to shoot identity. AP2 contributes to establishing the floral meristem.
        annotons:
          - id: ap1_floral_fate_tf
            label: "AP1: floral meristem identity MADS factor and repressor of flowering-time genes"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AP1 (At1g69120)
                term:
                  id: UniProtKB:P35631
                  label: Floral homeotic protein APETALA 1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: floral meristem determinacy
                term:
                  id: GO:0010582
                  label: floral meristem determinacy
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Binds cis-regulatory regions of SVP, AGL24 and SOC1 and represses them in emerging floral
              meristems; up-regulates LFY.
            evidence:
              - source_id: PMID:17428825
                statement: AP1 binds and represses flowering-time genes in floral meristems.
                supporting_text: >-
                  By post-translational activation of an AP1-GR fusion protein and chromatin
                  immunoprecipitation assays, we further demonstrate the repression of these flowering
                  time genes by induced AP1 activity and in vivo AP1 binding to the cis-regulatory
                  regions of these genes.
          - id: cal_redundant_tf
            label: "CAL: AP1 paralog, partially redundant floral meristem identity factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CAL (AGL10, At1g26310)
                term:
                  id: UniProtKB:Q39081
                  label: Transcription factor CAULIFLOWER
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: floral meristem determinacy
                term:
                  id: GO:0010582
                  label: floral meristem determinacy
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Expressed in young flower primordia; ap1 cal double mutants form reiterating inflorescence
              meristems in place of flowers.
            evidence:
              - source_id: PMID:7824951
                statement: CAL and AP1 are partially redundant in floral meristem formation.
                supporting_text: >-
                  Genetic studies demonstrate that two Arabidopsis genes, CAULIFLOWER and APETALA1, encode
                  partially redundant activities involved in the formation of floral meristems, the first
                  step in the development of flowers.
          - id: ful_redundant_tf
            label: "FUL: redundant floral-fate MADS factor with AP1/CAL"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FUL (AGL8, At5g60910)
                term:
                  id: UniProtKB:Q38876
                  label: Agamous-like MADS-box protein AGL8
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Contributes to LFY up-regulation and TFL1 exclusion together with AP1 and CAL; ap1 cal ful
              plants elaborate leafy shoots in place of flowers.
            evidence:
              - source_id: PMID:10648231
                statement: ful ap1 cal triple mutants do not flower.
                supporting_text: >-
                  We have found that mutations in the FRUITFULL (FUL) MADS-box gene, when combined with
                  mutations in AP1 and CAL, lead to a dramatic non-flowering phenotype in which plants
                  continuously elaborate leafy shoots in place of flowers.
          - id: ap2_floral_meristem_establishment
            label: "AP2: AP2/ERF factor contributing to floral meristem establishment"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AP2 (At4g36920)
                term:
                  id: UniProtKB:P47927
                  label: Floral homeotic protein APETALA 2
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: flower development
                term:
                  id: GO:0009908
                  label: flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Accessory contributor; better known for A-class organ identity and AG repression (organ
              identity module).
            notes: Optional/accessory member of this module.
            evidence:
              - source_id: PMID:7919989
                statement: AP2 participates in establishment of the floral meristem.
                supporting_text: >-
                  APETALA2 (AP2) plays a central role in the establishment of the floral meristem, the
                  specification of floral organ identity, and the regulation of floral homeotic gene
                  expression in Arabidopsis.
    - order: 4
      role: maintenance of inflorescence meristem identity
      node:
        id: tfl1_inflorescence_maintenance
        label: TFL1 maintains inflorescence meristem identity
        module_type: REGULATORY_STEP
        description: >-
          TFL1, expressed in the centre of the inflorescence meristem, represses FD-dependent targets and
          keeps LFY and AP1 out of the shoot apex, so the main meristem stays indeterminate.
        annotons:
          - id: tfl1_corepressor
            label: "TFL1: FD-dependent transcriptional corepressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TFL1 (At5g03840)
                term:
                  id: UniProtKB:P93003
                  label: Protein TERMINAL FLOWER 1
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
            processes:
              - preferred_term: maintenance of inflorescence meristem identity
                term:
                  id: GO:0010077
                  label: maintenance of inflorescence meristem identity
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Antagonist of FT; interacts with FD and represses genes that FT activates, preventing
              terminal flower formation.
            evidence:
              - source_id: PMID:21890645
                statement: TFL1 represses FD-dependent transcription of FT-activated genes.
                supporting_text: >-
                  We conclude that TFL1 negatively modulates the FD-dependent transcription of target
                  genes to fine-tune flowering time and the development of the inflorescence meristem.
  connections:
    - source: integrator_input
      target: lfy_program
      connection_type: POSITIVELY_REGULATES
      description: SOC1 (with AGL24) binds and activates the LFY promoter.
      evidence:
        - source_id: PMID:18466303
          statement: SOC1-AGL24 heterodimerization activates LFY.
          supporting_text: >-
            Thus, we propose that heterodimerization of SOC1 and AGL24 is a key mechanism in activating LFY
            expression.
    - source: integrator_input
      target: ap1_floral_fate
      connection_type: POSITIVELY_REGULATES
      description: The FT-FD complex activates AP1 at the shoot apex, independently of LFY.
      evidence:
        - source_id: PMID:16099979
          statement: FD-FT activate AP1 transcription.
          supporting_text: >-
            FD and FT are interdependent partners through protein interaction and act at the shoot apex to
            promote floral transition and to initiate floral development through transcriptional
            activation of a floral meristem identity gene, APETALA1 (AP1).
    - source: lfy_program
      target: ap1_floral_fate
      connection_type: POSITIVELY_REGULATES
      description: LFY directly induces early AP1 expression in floral anlagen.
      evidence:
        - source_id: PMID:10417387
          statement: LFY directly activates AP1.
          supporting_text: >-
            Use of steroid-inducible activation of LFY demonstrated that early expression of AP1 is a
            result of transcriptional induction by LFY.
    - source: ap1_floral_fate
      target: lfy_program
      connection_type: POSITIVELY_REGULATES
      description: >-
        AP1 (with CAL and FUL) up-regulates LFY, closing the LFY-AP1 positive feedback loop that makes the
        switch to floral fate sharp.
      evidence:
        - source_id: PMID:10368173
          statement: AP1 positively regulates LFY.
          supporting_text: >-
            We have found that AP1, in turn, can positively regulate LFY, because LFY is expressed
            prematurely in the converted floral meristems of plants constitutively expressing AP1.
    - source: ap1_floral_fate
      target: integrator_input
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Once induced, AP1 directly represses the integrators SOC1 (and AGL24/SVP) in emerging floral
        meristems, preventing continuation of the shoot program in flowers.
      evidence:
        - source_id: PMID:17428825
          statement: AP1 directly represses SVP, AGL24 and SOC1.
          supporting_text: >-
            We show here that the emerging floral meristems require AP1 to partly specify their floral
            identities by directly repressing a group of flowering time genes, including SHORT
            VEGETATIVE PHASE (SVP), AGAMOUS-LIKE 24 (AGL24) and SUPPRESSOR OF OVEREXPRESSION OF CO1
            (SOC1).
    - source: ap1_floral_fate
      target: tfl1_inflorescence_maintenance
      connection_type: NEGATIVELY_REGULATES
      description: AP1 down-regulates TFL1; AP1/CAL/FUL keep TFL1 out of floral primordia.
      evidence:
        - source_id: PMID:10368173
          statement: Constitutive AP1 down-regulates TFL1.
          supporting_text: >-
            We show here that this negative regulation can be mutual because TFL1 expression is
            downregulated in plants constitutively expressing AP1.
    - source: tfl1_inflorescence_maintenance
      target: lfy_program
      connection_type: NEGATIVELY_REGULATES
      description: TFL1 bars LFY expression from the inflorescence shoot meristem.
      evidence:
        - source_id: PMID:10368173
          statement: TFL1 excludes AP1 and LFY from the inflorescence meristem.
          supporting_text: >-
            Shoot meristems maintain an identity distinct from that of flower meristems, in part through
            the action of genes such as TERMINAL FLOWER1 (TFL1), which bars AP1 and LFY expression from
            the influorescence shoot meristem.
    - source: tfl1_inflorescence_maintenance
      target: ap1_floral_fate
      connection_type: NEGATIVELY_REGULATES
      description: TFL1 bars AP1 expression from the inflorescence shoot meristem.
      evidence:
        - source_id: PMID:10368173
          statement: TFL1 excludes AP1 and LFY from the inflorescence meristem.
          supporting_text: >-
            Shoot meristems maintain an identity distinct from that of flower meristems, in part through
            the action of genes such as TERMINAL FLOWER1 (TFL1), which bars AP1 and LFY expression from
            the influorescence shoot meristem.
