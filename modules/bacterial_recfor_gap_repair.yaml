    - gap_statement: A complete RecFOR gene set does not predict high recombination efficiency in every strain.
      boundary: >-
        Satisfiability records the presence of required machinery; phenotype and
        regulatory competence require separate evidence.
      gap_kind:
        - BIOLOGY
