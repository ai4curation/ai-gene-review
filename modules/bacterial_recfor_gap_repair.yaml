id: MODULE:bacterial_recfor_gap_repair
title: Bacterial RecFOR single-strand-gap repair
description: >-
  A reusable bacterial homologous-recombination module for repairing
  postreplication single-strand gaps. RecQ helicase and RecJ exonuclease enlarge
  the gap, SSB protects the exposed single-stranded DNA, the RecF-RecO-RecR
  mediator system replaces SSB with RecA, and the resulting RecA filament
  catalyzes homology search and DNA strand exchange. RecBCD processing of
  double-strand-break ends, RuvABC Holliday-junction migration and resolution,
  replication restart, translesion synthesis, and SOS transcriptional control
  are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000725
    title: recombinational repair
    statement: Defines repair through homologous DNA pairing and strand exchange.
  - source_id: GO:0000730
    title: DNA recombinase assembly
    statement: Defines RecFOR-mediated construction of the RecA nucleoprotein filament.
  - source_id: PMID:35653392
    title: 'Single strand gap repair: The presynaptic phase plays a pivotal role in modulating lesion tolerance pathways.'
    statement: >-
      E. coli genetics establishes RecJ/RecQ gap extension and RecFOR-dependent
      RecA loading as separable parts of presynaptic single-strand-gap repair.
    supporting_text: >-
      Impairing either the extension of the ssDNA gap (mediated by the nuclease
      RecJ and the helicase RecQ) or the loading of RecA (mediated by RecFOR)
  - source_id: PMID:32297860
    title: Single-molecule observation of ATP-independent SSB displacement by RecO in Deinococcus radiodurans.
    statement: Direct homolog experiments establish RecO binding to ssDNA and ATP-independent SSB displacement during RecA loading.
    supporting_text: efficiently displaces drSSB from ssDNA without consuming ATP.
  - source_id: PMID:29633970
    title: Crystal structure of RecR, a member of the RecFOR DNA-repair pathway, from Pseudomonas aeruginosa PAO1.
    statement: Genus-level structural evidence establishes RecR complexes with RecF and RecO in RecA loading.
    supporting_text: It forms complexes with RecF and RecO that can facilitate the loading of RecA onto ssDNA in the RecFOR pathway.
  - source_id: PANTHER:PTN000344873
    title: PAINT RecQ-family helicase node
    statement: >-
      The local PTHR13710 PAINT table assigns 3-prime-to-5-prime DNA helicase
      activity, DNA repair, and DNA recombination to this ancestral node.
  - source_id: PANTHER:PTN000534381
    title: PAINT RecA-family recombinase node
    statement: >-
      The local PTHR45900 PAINT table assigns DNA strand exchange activity and
      recombinational repair to this ancestral node.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__recfor-recombination__ppu03440-deep-research-openscientist.md
    title: OpenScientist PSEPK RecFOR recombination synthesis
    statement: >-
      Species-aware retrieval resolves the complete KT2440 RecFOR presynaptic
      pathway, recovers RecQ omitted from the KEGG candidate list, and separates
      RecFOR from RecBCD, RuvABC, and replication-map artifacts.
notes: >-
  The module is species-neutral. Pseudomonas putida KT2440 supplies a concrete
  representative for every role, but the strain's documented poor homologous-
  recombination efficiency means gene-set satisfiability should not be interpreted
  as high pathway flux. RecQ and RecJ cooperate in gap enlargement and are shown
  as parallel inputs rather than a strict linear enzyme sequence. SSB, RecA, RecQ,
  and RecJ are shared with other DNA-metabolism contexts.
