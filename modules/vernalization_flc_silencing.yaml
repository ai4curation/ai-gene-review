notes: >-
  Boundary: the autonomous pathway (FCA, FPA, FY, FLD, FVE, LD), which represses FLC independently of
  cold, is a separate module and is not modelled here. Cold also acts on the activation step: it promotes
  FRI nuclear condensates and lowers FRI occupancy at FLC (PMID:34732891, the subject of a Matters Arising
  exchange). This is recorded in prose rather than as a connection because there is no separate cold-sensing
  node. COOLAIR antisense transcription, the FLC nucleation-region cis-element and generational resetting
  of FLC are out of scope. No production GO-CAMs in gocams/index.tsv contain these Arabidopsis proteins.
  Gene reviews for FRI (functional allele P0DH90), VIN3, VRN5/VIL1, VRN2 and VRN1 were written together with
  this module, followed by CLF, SWN (EZA1), FIE and MSI1. LHP1, VAL1 and SVP have their own gene reviews,
  and every UniProt grounding in the module now has a completed review.
