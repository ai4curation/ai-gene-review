id: MODULE:vernalization_flc_silencing
title: FRIGIDA-dependent FLC activation and vernalization-induced Polycomb silencing of FLC
description: >-
  In winter-annual Arabidopsis thaliana accessions, the plant-specific scaffold protein FRIGIDA (FRI)
  assembles the FRI-C transcription activator complex (with SUF4, FLX, FES1 and FRL1) at the FLOWERING
  LOCUS C (FLC) promoter. FRI-C recruits H3K4 and H3K36 methyltransferase and H2A.Z exchange activities
  and the nuclear cap-binding complex, raising expression of the MADS-box floral repressor FLC. FLC, with
  its partner SVP, represses the floral integrators FT (in leaves) and SOC1 (in the meristem), so flowering
  is blocked before winter. Prolonged cold (vernalization) overcomes this block in two mechanistically
  separate phases. (1) Nucleation: the slow, quantitative cold induction of the VEL protein VIN3 is the
  molecular readout of the length of winter. VIN3 heterodimerizes through its VEL domain with the
  constitutively expressed VRN5 (VIL1), which bridges it to a VRN2-containing PRC2 core (SWN/CLF, FIE,
  MSI1). The resulting PHD-PRC2 is targeted to a three-nucleosome nucleation region near the first
  exon-intron boundary of FLC, where the sequence-specific repressor VAL1 also binds. VIN3 VEL-domain
  head-to-tail polymerization builds multivalent assemblies that nucleate H3K27me3, switching individual
  FLC alleles digitally into a metastable silenced state. (2) Spreading and maintenance: after return to
  warmth, H3K27me3 spreads over the whole FLC locus in a step that needs CLF-PRC2 and LHP1, and the
  chromatin-associated, sequence-nonspecific DNA-binding B3 protein VRN1 is needed to keep FLC stably
  silenced through later development. Silencing of FLC de-represses FT and SOC1, so flowering follows in
  spring. The autonomous pathway (FCA, FPA, FLD, FVE, FY, LD), which represses FLC independently of cold,
  COOLAIR antisense transcription, and resetting of FLC in each generation are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:14973192
    title: FRIGIDA-related genes are required for the winter-annual habit in Arabidopsis.
    statement: FRI blocks flowering in winter annuals by up-regulating FLC.
    supporting_text: >-
      In winter-annual accessions of Arabidopsis, FRI activity blocks flowering through the
      up-regulation of the floral inhibitor FLOWERING LOCUS C (FLC).
  - source_id: PMID:11030654
    title: Molecular analysis of FRIGIDA, a major determinant of natural variation in Arabidopsis
      flowering time.
    statement: Rapid-cycling accessions carry loss-of-function FRI alleles.
    supporting_text: >-
      Most of the early-flowering ecotypes analyzed carry FRI alleles containing one of two different
      deletions that disrupt the open reading frame.
  - source_id: PMID:28818969
    title: Distinct phases of Polycomb silencing to hold epigenetic memory of cold in Arabidopsis.
    statement: Silencing proceeds by a cold-dependent nucleation phase and a separate post-cold spreading
      phase.
    supporting_text: >-
      Polycomb silencing at FLC thus has mechanistically distinct phases, which involve specialization of
      distinct Polycomb components to deliver first metastable then long-term epigenetic silencing.
  - source_id: PMID:18854416
    title: A PHD-polycomb repressive complex 2 triggers the epigenetic silencing of FLC during
      vernalization.
    statement: PHD-PRC2 composition and its role in raising H3K27me3 to levels sufficient for stable
      silencing.
    supporting_text: >-
      The PHD-PRC2 activity increases H3K27me3 throughout the locus to levels sufficient for stable
      silencing.
module:
  id: vernalization_flc_silencing
  label: Vernalization control of FLC (FRI activation and Polycomb silencing)
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Concrete Arabidopsis module. FRI-C activation sets FLC high before winter. The VIN3/VRN5 PHD-PRC2
    nucleates H3K27me3 at FLC during cold, and CLF-PRC2, LHP1 and VRN1 spread and maintain silencing
    afterwards. The FLC-SVP repressor output acts on FT and SOC1.
  concepts:
    - preferred_term: vernalization response
      term:
        id: GO:0010048
        label: vernalization response
      description: The developmental response to prolonged cold that this module implements.
    - preferred_term: negative regulation of gene expression, epigenetic
      term:
        id: GO:0045814
        label: negative regulation of gene expression, epigenetic
      description: Polycomb (H3K27me3) silencing of FLC that holds the memory of winter.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: >-
          Concrete instance in Arabidopsis. FRI-dependent FLC activation applies to winter-annual
          accessions carrying functional FRI alleles (e.g. H51, Sf-2); Col-0 and Ler carry fri null
          alleles.
    conditions:
      - preferred_term: prolonged cold exposure (weeks at winter temperatures)
        description: Required for VIN3 induction and PHD-PRC2 nucleation at FLC.
  parts:
    - order: 1
      role: FRI-dependent activation of FLC (winter-annual habit)
      node:
        id: fri_activation
        label: FRI-C activation of FLC transcription
        module_type: REGULATORY_STEP
        description: >-
          FRI has no DNA-binding domain. It scaffolds FRI-C, in which the zinc-finger protein SUF4 binds
          an FLC promoter cis-element and FLX/FES1 supply activation potential. FRI-C recruits COMPASS-like
          (WDR5a) H3K4 methylation, SDG8 H3K36 methylation and SWR1 H2A.Z exchange, and FRI binds the
          cap-binding protein CBP20. In autumn cold, FRI moves into nuclear condensates away from the
          active FLC locus, which lowers FRI occupancy at FLC.
        annotons:
          - id: fri_coactivator
            label: "FRI: scaffold/coactivator of the FRI-C activator complex"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FRI (functional allele, accession H51)
                term:
                  id: UniProtKB:P0DH90
                  label: Protein FRIGIDA
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
              targets:
                - preferred_term: FLC promoter (via SUF4)
              evidence:
                - source_id: PMID:21282526
                  statement: FRI scaffolds FRI-C with FRL1, FES1, SUF4 and FLX.
                  supporting_text: >-
                    Here, we report that FRI acts as a scaffold protein interacting with FRL1, FES1, SUF4,
                    and FLX to form a transcription activator complex (FRI-C).
                - source_id: PMID:21282526
                  statement: SUF4 provides the DNA binding; FLX and FES1 provide activation potential.
                  supporting_text: >-
                    SUF4 binds to a cis-element of the FLC promoter, FLX and FES1 have transcriptional
                    activation potential, and FRL1 and FES1 stabilize the complex.
                - source_id: PMID:19567704
                  statement: FRI recruits a WDR5a COMPASS-like complex to raise H3K4me3 at FLC.
                  supporting_text: >-
                    FRI mediates WDR5a enrichment at the FLC locus, leading to increased H3K4me3 and FLC
                    upregulation.
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
              - preferred_term: nuclear speck
                term:
                  id: GO:0016607
                  label: nuclear speck
                evidence:
                  - source_id: PMID:17138694
                    statement: YFP-FRI forms nuclear speckles.
                    supporting_text: >-
                      YFP:FRI was dispersed throughout the nucleus, and fluorescence was observed as evenly
                      distributed speckles
            notes: >-
              Co-activator partners SUF4 (UniProtKB:Q9C5G0), FLX, FES1 and FRL1 are not separately modelled
              because they have no gene reviews yet. Cold-induced FRI condensation (PMID:34732891) is
              recorded as a regulatory input, not a separate step.
    - order: 2
      role: floral repressor output
      node:
        id: flc_repressor
        label: FLC-SVP floral repressor
        module_type: REGULATORY_STEP
        description: >-
          FLC and its MADS-box partner SVP form a repressive complex that directly represses FT in leaves
          and SOC1 in the shoot apex. FLC is the output that this module turns on (via FRI) and then
          epigenetically silences (via vernalization).
        annotons:
          - id: flc_tf
            label: "FLC: MADS-box DNA-binding transcriptional repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FLC
                term:
                  id: UniProtKB:Q9S7Q7
                  label: MADS-box protein FLOWERING LOCUS C
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              targets:
                - preferred_term: FT
                - preferred_term: SOC1
              evidence:
                - source_id: PMID:19011118
                  statement: FLC and SVP directly repress FT.
                  supporting_text: FLC and SVP directly repress FT expression
            processes:
              - preferred_term: negative regulation of flower development
                term:
                  id: GO:0009910
                  label: negative regulation of flower development
          - id: svp_tf
            label: "SVP: MADS-box partner of FLC in the floral repressor complex"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SVP
                term:
                  id: UniProtKB:Q9FVC1
                  label: MADS-box protein SVP
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:19011118
                  statement: SVP and FLC form a repressive complex on FT.
                  supporting_text: >-
                    prevent SVP and FLC from forming a repressive complex that represses FT expression
            processes:
              - preferred_term: negative regulation of flower development
                term:
                  id: GO:0009910
                  label: negative regulation of flower development
    - order: 3
      role: cold-dependent nucleation of Polycomb silencing (PHD-PRC2)
      node:
        id: phd_prc2_nucleation
        label: VIN3/VRN5 PHD-PRC2 nucleation of H3K27me3 at FLC
        module_type: PROTEIN_COMPLEX
        description: >-
          During prolonged cold, VIN3 accumulates and joins VRN5 and a VRN2-PRC2 core (SWN, FIE, MSI1;
          VEL1 is also present) at the FLC nucleation region. VRN2 is bound across FLC regardless of cold.
          VRN5 binding at the nucleation site needs VIN3, and VIN3 joins PRC2 through VRN5. VEL-domain
          polymerization of VIN3 provides multivalent chromatin association. The output is local H3K27me3
          that holds a metastable silenced state.
        annotons:
          - id: vin3_scaffold
            label: "VIN3: cold-induced VEL-domain polymerizing scaffold"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VIN3
                term:
                  id: UniProtKB:Q9FIE3
                  label: Protein VERNALIZATION INSENSITIVE 3
            function:
              preferred_term: molecular condensate scaffold activity (VEL-domain head-to-tail polymerization)
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
              evidence:
                - source_id: PMID:40858112
                  statement: VIN3 VEL polymerization builds nuclear assemblies that promote H3K27me3
                    nucleation.
                  supporting_text: >-
                    We show that VIN3 VEL polymerization produces higher-order nuclear VIN3 assemblies in
                    vivo, which promote multivalent chromatin association and efficient H3K27me3 nucleation.
                - source_id: PMID:36351412
                  statement: Polymerization-blocking VEL mutations abolish FLC silencing.
                  supporting_text: Mutations blocking polymerization of this VEL domain prevent Polycomb
                    silencing at FLC.
            processes:
              - preferred_term: vernalization response
                term:
                  id: GO:0010048
                  label: vernalization response
            locations:
              - preferred_term: nuclear speck
                term:
                  id: GO:0016607
                  label: nuclear speck
            role_description: >-
              The slow cold induction of VIN3 reads out the length of winter. VIN3 has no H3-reader activity:
              its PHD superdomain binds no histone H3 tails (PMID:36174674).
          - id: vrn5_adaptor
            label: "VRN5/VIL1: adaptor linking VIN3 to the PRC2 core"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VRN5 (VIL1)
                term:
                  id: UniProtKB:Q9LHF5
                  label: VIN3-like protein 1
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              evidence:
                - source_id: PMID:40858112
                  statement: VRN5 physically connects VIN3 with PRC2.
                  supporting_text: it is required to physically connect VIN3 with PRC2
                - source_id: PMID:18854416
                  statement: VRN5 association with the FLC intron 1 nucleation domain depends on VIN3.
                  supporting_text: >-
                    The vernalization-induced silencing is triggered by the cold-dependent association of
                    the PHD finger protein VRN5 to a specific domain in FLC intron 1, and this association
                    is dependent on the cold-induced PHD protein VIN3.
            processes:
              - preferred_term: vernalization response
                term:
                  id: GO:0010048
                  label: vernalization response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
          - id: vrn2_prc2_nucleation
            label: "VRN2-PRC2 core (VRN2, SWN, FIE, MSI1): H3K27 methyltransferase"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: VRN2-PRC2 core of PHD-PRC2
                term:
                  id: GO:0035098
                  label: ESC/E(Z) complex
                active_units:
                  - id: vrn2_unit
                    label: VRN2 (Su(z)12 homolog)
                    role: >-
                      Structural Su(z)12-type core subunit. It binds FLC independently of cold and docks the
                      VEL accessories (via VRN5). It contributes to, but does not itself catalyse, H3K27
                      methylation.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: VRN2
                        term:
                          id: UniProtKB:Q8W5B1
                          label: Polycomb group protein VERNALIZATION 2
                  - id: swn_unit
                    label: SWN (E(z) homolog; catalytic)
                    role: SET-domain H3K27 methyltransferase of the cold-formed PHD-PRC2.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SWN (EZA1)
                        term:
                          id: UniProtKB:Q9ZSM8
                          label: Histone-lysine N-methyltransferase EZA1
                    function:
                      preferred_term: histone H3K27 methyltransferase activity
                      term:
                        id: GO:0046976
                        label: histone H3K27 methyltransferase activity
                  - id: fie_unit
                    label: FIE (ESC homolog)
                    role: WD40 core subunit of PRC2.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FIE
                        term:
                          id: UniProtKB:Q9LT47
                          label: Polycomb group protein FERTILIZATION-INDEPENDENT ENDOSPERM
                  - id: msi1_unit
                    label: MSI1 (p55 homolog)
                    role: Histone-binding WD40 core subunit of PRC2.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MSI1
                        term:
                          id: UniProtKB:O22467
                          label: Histone-binding protein MSI1
                    function:
                      preferred_term: histone binding
                      term:
                        id: GO:0042393
                        label: histone binding
            function:
              preferred_term: histone H3K27 methyltransferase activity (complex)
              term:
                id: GO:0046976
                label: histone H3K27 methyltransferase activity
              evidence:
                - source_id: PMID:18854416
                  statement: PHD-PRC2 composition.
                  supporting_text: >-
                    during prolonged cold a PHD-PRC2 complex forms composed of core PRC2 components (VRN2,
                    SWINGER
                - source_id: PMID:28818969
                  statement: PRC2 factors nucleate H3K27me3 in a small region of FLC.
                  supporting_text: >-
                    a subset of Polycomb repressive complex 2 factors nucleate silencing in a small region
                    within FLC, locally increasing H3K27me3 levels.
            processes:
              - preferred_term: facultative heterochromatin formation
                term:
                  id: GO:0140718
                  label: facultative heterochromatin formation
            notes: >-
              SWN, FIE and MSI1 have gene reviews in this repository. FIE contributes to the complex's
              methyltransferase activity but has no activity asserted on its own. CLF can replace SWN in
              VRN2-PRC2 and is modelled in the spreading step.
          - id: val1_recruiter
            label: "VAL1: sequence-specific recruiter at the nucleation site"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VAL1
                term:
                  id: UniProtKB:Q8W4L5
                  label: B3 domain-containing transcription repressor VAL1
            function:
              preferred_term: sequence-specific DNA binding (FLC nucleation-region element)
              term:
                id: GO:0043565
                label: sequence-specific DNA binding
              evidence:
                - source_id: PMID:27471304
                  statement: VAL1 binds the FLC nucleation region and is needed for PHD-PRC2 nucleation.
                  supporting_text: >-
                    VAL1 localizes to the nucleation region in vivo, promoting histone deacetylation and FLC
                    transcriptional silencing
            role_description: >-
              Recruiter at the nucleation site. A point mutation in its FLC binding site blocks PHD-PRC2
              nucleation. The function matches the core function in the VAL1 gene review.
    - order: 4
      role: post-cold spreading and long-term maintenance of silencing
      node:
        id: spreading_maintenance
        label: H3K27me3 spreading and maintenance (CLF-PRC2, LHP1, VRN1)
        module_type: BIOLOGICAL_PROCESS
        description: >-
          After return to warmth and faster growth, H3K27me3 spreads from the nucleation region over the
          whole FLC gene body. Spreading needs CLF-PRC2 and LHP1 and converts metastable silencing into
          long-term epigenetic memory. VRN2 is needed for FLC to stay low after cold, and the
          chromatin-associated B3 protein VRN1 is likewise needed to maintain repression.
        annotons:
          - id: clf_prc2_spreading
            label: "CLF-PRC2 (CLF, VRN2): H3K27me3 spreading"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: CLF/VRN2-PRC2
                term:
                  id: GO:0035098
                  label: ESC/E(Z) complex
                active_units:
                  - id: clf_unit
                    label: CLF (E(z) homolog; catalytic)
                    role: SET-domain H3K27 methyltransferase needed to spread H3K27me3 over FLC.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CLF
                        term:
                          id: UniProtKB:P93831
                          label: Histone-lysine N-methyltransferase CLF
                    function:
                      preferred_term: histone H3K27 methyltransferase activity
                      term:
                        id: GO:0046976
                        label: histone H3K27 methyltransferase activity
                  - id: vrn2_unit_maint
                    label: VRN2 (Su(z)12 homolog)
                    role: Core subunit needed to keep FLC silenced after cold.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: VRN2
                        term:
                          id: UniProtKB:Q8W5B1
                          label: Polycomb group protein VERNALIZATION 2
            function:
              preferred_term: histone H3K27 methyltransferase activity (complex)
              term:
                id: GO:0046976
                label: histone H3K27 methyltransferase activity
              evidence:
                - source_id: PMID:40858112
                  statement: CLF and LHP1 are required for the stable spread H3K27me3 state.
                  supporting_text: >-
                    can be separated from the stable spread H3K27me3 state in mutants defective in one of
                    the PRC2 methyltransferases genes, CURLY LEAF (CLF) or LIKE HETEROCHROMATIN PROTEIN 1,
                    required to maintain long-term silencing.
                - source_id: PMID:26642436
                  statement: CLF and VRN2 co-occur in VRN2-PRC2 in vivo.
                  supporting_text: >-
                    confirming that CLF occurs in both VRN2-PRC2 and EMF2-PRC2 complexes in vivo.
                - source_id: PMID:11719192
                  statement: VRN2 is needed to keep FLC repressed after cold.
                  supporting_text: >-
                    VRN2 function therefore stably maintains FLC repression after a cold treatment, serving
                    as a mechanism for the cellular memory of vernalization.
            processes:
              - preferred_term: negative regulation of gene expression, epigenetic
                term:
                  id: GO:0045814
                  label: negative regulation of gene expression, epigenetic
          - id: lhp1_maintenance
            label: "LHP1: H3K27me3 reader chromodomain protein needed for spreading/maintenance"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LHP1 (TFL2)
                term:
                  id: UniProtKB:Q946J8
                  label: Chromo domain-containing protein LHP1
            function:
              preferred_term: histone H3K27me3 reader activity
              term:
                id: GO:0061628
                label: histone H3K27me3 reader activity
              evidence:
                - source_id: PMID:23778966
                  statement: LHP1 binds H3K27me3 and is linked to PRC2 by MSI1.
                  supporting_text: >-
                    We found that MSI1 serves to link PRC2 to LIKE HETEROCHROMATIN PROTEIN 1 (LHP1), a protein
                    that binds H3K27me3 in vitro and in vivo and is required for a functional plant PcG system.
            role_description: >-
              Required to maintain the vernalized state. It reads H3K27me3 and, through MSI1, feeds back to
              PRC2, supporting H3K27me3 spreading over FLC. In the LHP1 gene review it is also annotated to
              the plant PRC1-like complex (GO:0035102).
            evidence:
              - source_id: PMID:16682972
                statement: LHP1 is required to maintain FLC repression after cold.
                supporting_text: >-
                  LHP1 is necessary to maintain the epigenetically repressed state of FLC upon return to
                  warm conditions typical of spring.
          - id: vrn1_maintenance
            label: "VRN1: chromatin-associated non-specific DNA-binding B3 protein"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VRN1
                term:
                  id: UniProtKB:Q8L3W1
                  label: B3 domain-containing transcription factor VRN1
            function:
              preferred_term: DNA binding (sequence-nonspecific)
              term:
                id: GO:0003677
                label: DNA binding
              evidence:
                - source_id: PMID:12114624
                  statement: VRN1 binds DNA non-specifically and is needed for stable FLC repression.
                  supporting_text: >-
                    VRN1 encodes a protein that binds DNA in vitro in a non-sequence-specific manner and
                    functions in stable repression of the major target of the vernalization pathway, the
                    floral repressor FLC.
                - source_id: PMID:16549797
                  statement: VRN1 associates with mitotic but not meiotic chromosomes.
                  supporting_text: >-
                    was maintained during mitosis but was lost in meiotic chromosomes, suggesting that VRN1
                    may contribute to chromatin silencing that is not meiotically stable.
            processes:
              - preferred_term: vernalization response
                term:
                  id: GO:0010048
                  label: vernalization response
            locations:
              - preferred_term: chromosome
                term:
                  id: GO:0005694
                  label: chromosome
            role_description: >-
              It is not known how VRN1 is targeted to FLC, which requires vernalization-specific factors.
    - order: 5
      role: de-repressed floral integrators (downstream output)
      node:
        id: floral_integrators
        label: Floral integrators FT and SOC1
        module_type: REGULATORY_STEP
        description: >-
          Targets of the FLC-SVP repressor. Once FLC is silenced, FT (leaf florigen and transcriptional
          coactivator with FD) and SOC1 (meristem MADS-box activator) are free to be induced and to
          promote flowering. These targets are included only as the read-out of this module; photoperiod
          control of FT belongs to other modules.
        annotons:
          - id: ft_florigen
            label: "FT: florigen and transcriptional coactivator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FT
                term:
                  id: UniProtKB:Q9SXZ2
                  label: Protein FLOWERING LOCUS T
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
          - id: soc1_tf
            label: "SOC1: MADS-box floral integrator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOC1
                term:
                  id: UniProtKB:O64645
                  label: MADS-box protein SOC1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:19011118
                  statement: FLC in the meristem directly represses SOC1.
                  supporting_text: >-
                    FLC expression in the meristem impairs the response to the FT signal by directly
                    repressing the expression of SOC1
  connections:
    - source: fri_activation
      target: flc_repressor
      connection_type: POSITIVELY_REGULATES
      description: FRI-C activates FLC transcription, setting the winter-annual vernalization requirement.
      evidence:
        - source_id: PMID:14973192
          supporting_text: FRI activity blocks flowering through the up-regulation of the floral inhibitor
            FLOWERING LOCUS C (FLC).
    - source: phd_prc2_nucleation
      target: flc_repressor
      connection_type: NEGATIVELY_REGULATES
      description: PHD-PRC2 nucleates H3K27me3 at FLC during cold, switching FLC alleles off.
      evidence:
        - source_id: PMID:17174094
          supporting_text: >-
