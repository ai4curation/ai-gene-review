              id: GO:0045259
              label: proton-transporting ATP synthase complex
        annotons:
          - id: photophosphorylation
            label: Proton-motive-force-driven ATP synthesis
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: thylakoid ATP synthase (CF1FO)
                term:
                  id: GO:0045259
                  label: proton-transporting ATP synthase complex
            function:
              preferred_term: "proton-transporting ATP synthase activity, rotational mechanism"
              term:
                id: GO:0046933
                label: "proton-transporting ATP synthase activity, rotational mechanism"
              substrates:
                - preferred_term: ADP
                - preferred_term: phosphate
                - preferred_term: proton (lumen)
              products:
                - preferred_term: ATP
            locations:
              - preferred_term: thylakoid membrane
                term:
                  id: GO:0009535
                  label: chloroplast thylakoid membrane
  connections:
    - source: photosystem_II
      target: cytochrome_b6f
      connection_type: PROVIDES_INPUT_FOR
      description: PSII reduces plastoquinone to plastoquinol, the substrate oxidized by b6f.
    - source: cytochrome_b6f
      target: mobile_carrier_b6f_to_psi
      connection_type: PROVIDES_INPUT_FOR
      description: b6f reduces the mobile lumenal carrier (plastocyanin or cyt c6).
    - source: mobile_carrier_b6f_to_psi
      target: photosystem_I
      connection_type: PROVIDES_INPUT_FOR
      description: The reduced carrier re-reduces photo-oxidized P700 in PSI.
    - source: photosystem_I
      target: fnr_step
      connection_type: PROVIDES_INPUT_FOR
      description: PSI-reduced ferredoxin is the electron donor for FNR.
    - source: fnr_step
      target: atp_synthase
      connection_type: PRECEDES
      description: >-
        Linear electron flow and water oxidation build the proton-motive
        force used by the ATP synthase (coupling, not a metabolite hand-off).
