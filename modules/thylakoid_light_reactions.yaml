id: MODULE:thylakoid_light_reactions
title: Thylakoid light reactions
description: >-
  The light-driven electron transport and photophosphorylation half of oxygenic
  photosynthesis, as a taxon-neutral decomposition: light harvesting by the
  antenna, water oxidation at photosystem II, plastoquinol oxidation and proton
  translocation by the cytochrome b6f complex, the inter-photosystem mobile
  carrier, P700 photo-oxidation and ferredoxin reduction at photosystem I,
  NADPH production by ferredoxin-NADP+ reductase, and ATP synthesis from the
  proton-motive force. Phrased as functions, complexes and pathway segments
  rather than a fixed gene list, so it can represent cyanobacterial, algal and
  plant implementations. Carbon fixation is a separate module
  (MODULE:calvin_benson_bassham_cycle), which consumes the ATP and NADPH this
  module supplies. Photoprotection and cyclic/pseudocyclic electron balancing
  stay with the parent MODULE:oxygenic_photosynthesis, since they regulate the
  ratio between the two halves rather than belonging to either. Anoxygenic
  photosynthesis (single reaction center, non-water electron donors) is out of
  scope.
status: DRAFT
evidence:
  - source_id: file:modules/photosynthesis-deep-research-falcon.md
    title: Photosynthesis module deep research (falcon)
    statement: >-
      Module-targeted falcon deep research, generated for the parent oxygenic
      photosynthesis module from which this module was extracted, used to
      cross-check component coverage, variants, and failure modes.
      Machine-generated citations are not yet manually adjudicated.
  - source_id: file:terms/photosynthesis/photosynthesis-notes.md
    title: Photosynthesis concept notes
    statement: >-
      Concept notes behind the module-by-module component breakdown across
      Arabidopsis, Synechocystis and Chlamydomonas.
notes: >-
  Extracted from MODULE:oxygenic_photosynthesis, which now includes this module
  by reference, so that each module stays small enough to read and can be
  reused on its own. Identifiers are grounded only where verified against the
  local GO term cache, GOlr, or UniProt; descriptors without a `term` are
  deliberate (no confident identifier yet) rather than oversights.
  Representative UniProt members are concrete orienting examples, not
  exhaustive or species-restricting claims.
module:
  id: thylakoid_light_reactions
  label: Thylakoid light reactions
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: photosynthesis, light reaction
      term:
        id: GO:0019684
        label: photosynthesis, light reaction
    - preferred_term: photosynthetic electron transport chain
      term:
        id: GO:0009767
        label: photosynthetic electron transport chain
  parts:
    - order: 1
      role: light harvesting / antenna
      node:
        id: light_harvesting
        label: Light-harvesting antenna
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: antenna_chlorophyll_binding
            label: Antenna chlorophyll/carotenoid light capture
            participant:
              selector_type: FAMILY
              family:
                preferred_term: light-harvesting chlorophyll a/b binding (LHC) family
                description: >-
                  Membrane antenna proteins (LHCII/LHCI in plants and algae;
                  phycobilisomes substitute in most cyanobacteria).
            function:
              preferred_term: chlorophyll binding for excitation energy transfer
              term:
                id: GO:0016168
                label: chlorophyll binding
              cofactors:
                - preferred_term: chlorophyll a
                - preferred_term: chlorophyll b
                - preferred_term: carotenoid
            locations:
              - preferred_term: thylakoid membrane
                term:
                  id: GO:0034357
                  label: photosynthetic membrane
            role_description: >-
              Increases absorption cross-section and funnels excitation to
              the reaction centers; also a site of photoprotective quenching.
    - order: 2
      role: water oxidation (photosystem II)
      node:
        id: photosystem_II
        label: Photosystem II (water:plastoquinone oxidoreductase)
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: photosystem II
            term:
              id: GO:0009523
              label: photosystem II
        annotons:
          - id: psii_water_oxidation
            label: Light-driven water oxidation / oxygen evolution
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: photosystem II complex
                term:
                  id: GO:0009523
                  label: photosystem II
                active_units:
                  - id: psii_d1
                    label: D1 reaction-center subunit (PsbA)
                    role: binds P680 and the Mn4CaO5 cluster; high-turnover repair substrate
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsbA / D1
                  - id: psii_d2
                    label: D2 reaction-center subunit (PsbD)
                    role: reaction-center partner of D1
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsbD / D2
                  - id: psii_cp43_cp47
                    label: Core antennae CP43/CP47 (PsbC/PsbB)
                    role: inner chlorophyll antennae feeding excitation to P680
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsbB/PsbC core antenna
                  - id: psii_oec
                    label: Oxygen-evolving complex extrinsic proteins (PsbO/PsbP/PsbQ)
                    role: stabilize the Mn4CaO5 water-oxidation cluster on the lumenal side
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: oxygen-evolving complex extrinsic proteins
                        representative_members:
                          - preferred_term: spinach PsbO (oxygen-evolving enhancer protein 1)
                            term:
                              id: UniProtKB:P12359
                              label: Oxygen-evolving enhancer protein 1, chloroplastic
            function:
              preferred_term: oxygen evolving activity
              term:
                id: GO:0010242
                label: oxygen evolving activity
              substrates:
                - preferred_term: water
                - preferred_term: plastoquinone
              products:
                - preferred_term: dioxygen
                - preferred_term: plastoquinol
                - preferred_term: proton (lumen)
            locations:
              - preferred_term: thylakoid membrane
                term:
                  id: GO:0042651
                  label: thylakoid membrane
            role_description: >-
              Uses light energy to oxidize water at the Mn4CaO5 cluster,
              reducing plastoquinone and releasing O2 and lumenal protons.
            evidence:
              - source_id: PMID:21499260
                statement: PSII structure defining the reaction center, antennae, and Mn4CaO5 cluster.
    - order: 3
      role: plastoquinol oxidation and proton translocation (cytochrome b6f)
      node:
        id: cytochrome_b6f
        label: Cytochrome b6f complex
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: cytochrome b6f complex
            term:
              id: GO:0009512
              label: cytochrome b6f complex
        annotons:
          - id: b6f_plastoquinol_plastocyanin_reductase
            label: Plastoquinol--plastocyanin reductase (Q-cycle)
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: cytochrome b6f complex
                term:
                  id: GO:0009512
                  label: cytochrome b6f complex
                active_units:
                  - id: b6f_cytf
                    label: Cytochrome f (PetA)
                    role: high-potential heme; reduces plastocyanin/cyt c6
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: cytochrome f (PetA)
                        representative_members:
                          - preferred_term: Synechocystis cytochrome f (petA)
                            term:
                              id: UniProtKB:P26287
                              label: Cytochrome f
                  - id: b6f_cytb6
                    label: Cytochrome b6 (PetB)
                    role: low-potential hemes; Q-cycle electron bifurcation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: cytochrome b6 (PetB)
                  - id: b6f_rieske
                    label: Rieske iron-sulfur protein (PetC)
                    role: 2Fe-2S cluster; oxidizes plastoquinol
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Rieske Fe-S protein (PetC)
                        representative_members:
                          - preferred_term: wheat Rieske Fe-S subunit (petC)
                            term:
                              id: UniProtKB:Q7X9A6
                              label: Cytochrome b6-f complex iron-sulfur subunit, chloroplastic
            function:
              preferred_term: plastoquinol--plastocyanin reductase activity
              term:
                id: GO:0009496
                label: plastoquinol--plastocyanin reductase activity
              substrates:
                - preferred_term: plastoquinol
                - preferred_term: plastocyanin (oxidized)
              products:
                - preferred_term: plastoquinone
                - preferred_term: plastocyanin (reduced)
                - preferred_term: proton (lumen)
            locations:
              - preferred_term: thylakoid membrane
                term:
                  id: GO:0009535
                  label: chloroplast thylakoid membrane
            role_description: >-
              Links PSII to PSI, oxidizing plastoquinol and reducing the
              mobile carrier while translocating protons via the Q-cycle;
              frequently rate-limiting for linear electron transport.
    - order: 4
      role: inter-photosystem mobile electron carrier
      node:
        id: mobile_carrier_b6f_to_psi
        label: Mobile carrier from b6f to PSI
        module_type: MOLECULAR_FUNCTION
        description: >-
          Soluble lumenal carrier shuttling electrons from cytochrome b6f
          to photosystem I; the carrier used is lineage- and
          metal-availability-dependent.
        variant_sets:
          - id: lumenal_carrier_variants
            label: Plastocyanin vs cytochrome c6
            axis: lineage / metal availability
            selection: EXACTLY_ONE
            variants:
              - id: plastocyanin_variant
                label: Plastocyanin (copper carrier)
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: plastocyanin_electron_transfer
                    label: Plastocyanin electron transfer
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: plastocyanin
                    function:
                      preferred_term: electron transfer activity
                      term:
                        id: GO:0009055
                        label: electron transfer activity
                      cofactors:
                        - preferred_term: copper ion
                    locations:
                      - preferred_term: thylakoid lumen
                        term:
                          id: GO:0009543
                          label: chloroplast thylakoid lumen
              - id: cytochrome_c6_variant
                label: Cytochrome c6 (iron carrier)
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: cytc6_electron_transfer
                    label: Cytochrome c6 electron transfer
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: cytochrome c6
                    function:
                      preferred_term: electron transfer activity
                      term:
                        id: GO:0009055
                        label: electron transfer activity
                      cofactors:
                        - preferred_term: heme c
                    locations:
                      - preferred_term: thylakoid lumen
                        term:
                          id: GO:0031977
                          label: thylakoid lumen
            notes: >-
              Many cyanobacteria and algae switch between plastocyanin and
              cytochrome c6 depending on copper/iron availability.
    - order: 5
      role: P700 photo-oxidation and ferredoxin reduction (photosystem I)
      node:
        id: photosystem_I
        label: Photosystem I (plastocyanin:ferredoxin oxidoreductase)
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: photosystem I
            term:
              id: GO:0009522
              label: photosystem I
        annotons:
          - id: psi_ferredoxin_reduction
            label: Light-driven ferredoxin reduction
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: photosystem I complex
                term:
                  id: GO:0009522
                  label: photosystem I
                active_units:
                  - id: psi_psaa_psab
                    label: PsaA/PsaB reaction-center heterodimer
                    role: bind P700 and early electron-transfer cofactors
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsaA/PsaB reaction-center
                  - id: psi_psac
                    label: PsaC terminal Fe-S clusters (FA/FB)
                    role: terminal 4Fe-4S clusters that reduce ferredoxin
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PsaC
                        representative_members:
                          - preferred_term: Chlamydomonas psaC
                            term:
                              id: UniProtKB:Q00914
                              label: Photosystem I iron-sulfur center
            function:
              preferred_term: light-driven plastocyanin:ferredoxin oxidoreduction
              description: >-
                Photo-oxidation of P700 drives electron transfer through
                Fe-S clusters to reduce ferredoxin; no single exact GO MF
                is asserted for the whole complex here.
              substrates:
                - preferred_term: plastocyanin (reduced) or cytochrome c6
                - preferred_term: ferredoxin (oxidized)
              products:
                - preferred_term: ferredoxin (reduced)
            processes:
              - preferred_term: photosynthetic electron transport in photosystem I
                term:
                  id: GO:0009773
                  label: photosynthetic electron transport in photosystem I
            locations:
              - preferred_term: thylakoid membrane
                term:
                  id: GO:0009535
                  label: chloroplast thylakoid membrane
            evidence:
              - source_id: PMID:11418848
                statement: PSI structure defining PsaA/PsaB and terminal Fe-S clusters.
    - order: 6
      role: NADPH production
      node:
        id: fnr_step
        label: Ferredoxin-NADP+ reductase
        module_type: REACTION
        annotons:
          - id: fnr_activity
            label: Ferredoxin-NADP+ reductase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: ferredoxin-NADP+ reductase activity
                term:
                  id: GO:0004324
                  label: ferredoxin-NADP+ reductase activity
