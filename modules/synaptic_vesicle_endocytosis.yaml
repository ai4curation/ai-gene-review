  connections:
    - source: adaptor_and_coat_assembly
      target: membrane_curvature
      connection_type: PROVIDES_INPUT_FOR
      description: The growing coat and its accessory proteins recruit BAR-domain proteins to the pit neck.
    - source: membrane_curvature
      target: dynamin_fission
      connection_type: CAUSES
      description: BAR-protein SH3 domains recruit dynamin to the constricted neck, driving scission.
    - source: dynamin_fission
      target: coat_disassembly
      connection_type: PRECEDES
      description: Fission exposes the coated vesicle to synaptojanin, auxilin and HSC70 for uncoating.
      chaining_status: NOT_APPLICABLE
      chaining_note: Protein assembly steps, not metabolite chaining.
