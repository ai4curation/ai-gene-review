  variant_sets:
    - id: retrieval_route
      label: Membrane retrieval route
      axis: route
      selection: ONE_OR_MORE
      notes: >-
        Both routes reuse the coat, curvature, fission and uncoating parts
        above; they differ in whether the clathrin coat forms directly on the
        plasma membrane or on a synaptic endosome after clathrin-independent
        uptake.
      variants:
        - id: direct_clathrin_mediated_retrieval
          label: Direct clathrin-mediated endocytosis from the plasma membrane
          module_type: BIOLOGICAL_PROCESS
          description: >-
            The classical route: a clathrin-coated pit forms in the presynaptic
            endocytic zone and buds a vesicle directly from the plasma membrane
            over seconds to tens of seconds.
          annotons:
            - id: cme_ap2_route_marker
              label: AP-2-dependent plasma-membrane pit
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: AP-2 mu subunit (AP2M1) subfamily of the AP-mu family
                  term:
                    id: PANTHER:PTHR10529:SF236
                    label: AP-2 COMPLEX SUBUNIT MU
                  representative_members:
                    - preferred_term: AP2M1 (Homo sapiens)
                      term:
                        id: UniProtKB:Q96CW1
                        label: AP-2 complex subunit mu
              function:
                preferred_term: clathrin-cargo adaptor activity
                term:
                  id: GO:0035615
                  label: clathrin-cargo adaptor activity
              processes:
                - preferred_term: clathrin-dependent synaptic vesicle endocytosis
                  term:
                    id: GO:0150007
                    label: clathrin-dependent synaptic vesicle endocytosis
              locations:
                - preferred_term: presynaptic endocytic zone membrane
                  term:
                    id: GO:0098835
                    label: presynaptic endocytic zone membrane
              role_description: The coat forms on the plasma membrane and the budded vesicle is uncoated directly.
        - id: ultrafast_bulk_retrieval
          label: Ultrafast / bulk endocytosis with endosomal regeneration
          module_type: BIOLOGICAL_PROCESS
          description: >-
            Clathrin-independent, dynamin- and actin-dependent invagination at
            the edge of the active zone retrieves membrane within tens of
            milliseconds (ultrafast) or as large cisternae after strong
            stimulation (bulk); synaptic vesicles are then regenerated by
            clathrin-dependent budding from the resulting synaptic endosome.
          annotons:
            - id: ultrafast_dynamin_retrieval
              label: Dynamin-dependent clathrin-independent invagination
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: dynamin (DNM1/2/3) family
                  term:
                    id: PANTHER:PTHR11566
                    label: DYNAMIN
                  representative_members:
                    - preferred_term: DNM1 (Homo sapiens)
                      term:
                        id: UniProtKB:Q05193
                        label: Dynamin-1
              function:
                preferred_term: GTPase activity
                term:
                  id: GO:0003924
                  label: GTPase activity
              processes:
                - preferred_term: bulk synaptic vesicle endocytosis
                  term:
                    id: GO:0150008
                    label: bulk synaptic vesicle endocytosis
              locations:
                - preferred_term: presynaptic endocytic zone membrane
                  term:
                    id: GO:0098835
                    label: presynaptic endocytic zone membrane
              role_description: Severs the clathrin-independent invagination to form a synaptic endosome.
              evidence:
                - source_id: PMID:24305055
                  title: Ultrafast endocytosis at mouse hippocampal synapses.
                  statement: Ultrafast endocytosis is clathrin-independent but dynamin-dependent.
            - id: endosomal_clathrin_regeneration
              label: Clathrin-dependent vesicle regeneration from the synaptic endosome
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: clathrin heavy chain (CLTC/CLTCL1) family
