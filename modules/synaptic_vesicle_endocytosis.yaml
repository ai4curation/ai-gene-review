id: MODULE:synaptic_vesicle_endocytosis
title: Synaptic vesicle endocytosis and vesicle regeneration
description: >-
  The retrieval stage of the synaptic vesicle cycle, in which vesicle membrane
  and resident proteins deposited in the presynaptic plasma membrane by
  exocytosis are recovered and re-formed into release-competent vesicles at the
  presynaptic endocytic zone. In the classical clathrin-mediated route, the AP-2
  adaptor complex, the neuron-specific assembly protein AP180 and the
  synaptotagmin-sorting adaptor stonin-2 recognise vesicle cargo and PI(4,5)P2
  and nucleate a clathrin coat; BAR-domain proteins (endophilin, amphiphysin,
  syndapin) shape the invaginating membrane and recruit the GTPase dynamin,
  which constricts and severs the neck; synaptojanin-1 hydrolyses PI(4,5)P2
  and auxilin recruits HSC70 to strip the clathrin coat, yielding a naked
  vesicle ready for re-acidification and loading. The same coat, curvature,
  fission and uncoating machinery is reused when membrane is first retrieved
  by clathrin-independent ultrafast or bulk endocytosis and vesicles are then
  regenerated by clathrin-dependent budding from a synaptic endosome. The
  module conforms, with stated deviations, to the generic
  MODULE:vesicle_coat_budding motif. Exemplars are human. Grounded in
  GO:0048488 (synaptic vesicle endocytosis).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0048488
    title: synaptic vesicle endocytosis
    statement: The module is grounded in the GO process for synaptic vesicle endocytosis.
  - source_id: GO:0150007
    title: clathrin-dependent synaptic vesicle endocytosis
    statement: The clathrin-mediated route is the elaborated core of the module.
  - source_id: GO:0150008
    title: bulk synaptic vesicle endocytosis
    statement: Clathrin-independent bulk/ultrafast retrieval is modeled as the alternative route variant.
  - source_id: PMID:22763746
    title: Synaptic vesicle endocytosis.
    statement: >-
      Review of the clathrin-mediated synaptic vesicle endocytosis machinery
      (AP-2, AP180, stonin-2, clathrin, endophilin, amphiphysin, dynamin,
      synaptojanin, auxilin/HSC70) and of bulk endocytosis.
  - source_id: PMID:24305055
    title: Ultrafast endocytosis at mouse hippocampal synapses.
    statement: >-
      Establishes clathrin-independent ultrafast endocytosis of membrane at the
      edge of the active zone within tens of milliseconds, with vesicles later
      regenerated from endosomes.
  - source_id: PMID:22099461
    title: Recruitment of endophilin to clathrin-coated pit necks is required for efficient vesicle uncoating after fission.
    statement: >-
      Endophilin couples neck formation to synaptojanin-dependent uncoating at
      synapses.
  - source_id: PANTHER:PTN000242371
    title: PAINT AP-2 mu subunit clathrin-dependent endocytosis node
    statement: Local PAINT IBD node in PTHR10529 seeded by AP2M1 with propagated term P:GO:0072583.
  - source_id: PANTHER:PTN002575694
    title: PAINT stonin synaptic vesicle endocytosis node
    statement: Local PAINT IBD node in PTHR10529 seeded by STON2 with propagated term P:GO:0048488.
  - source_id: PANTHER:PTN000170013
    title: PAINT dynamin GTPase node
    statement: Local PAINT IBD node in PTHR11566 seeded by DNM1 with propagated term F:GO:0003924.
  - source_id: PANTHER:PTN008570389
    title: PAINT HSC70 clathrin coat disassembly node
    statement: Local PAINT IBD node in PTHR19375 seeded by HSPA8 with propagated term P:GO:0072318.
notes: >-
  Human-centric exemplars with family-level descriptors so the module stays
  reusable. The mechanistic parts (coat assembly, curvature, fission,
  uncoating) are shared by both retrieval routes; the root variant set records
  only where the coat forms (plasma membrane vs synaptic endosome). Kiss-and-run
  retrieval is not modeled. Stonin-2 and AP2M1 both belong to the AP-mu PANTHER family
  (PTHR10529) and are grounded on their respective subfamilies so the two
  roles stay distinct. Loading and release stages are in
  MODULE:synaptic_vesicle_neurotransmitter_loading and
  MODULE:synaptic_vesicle_exocytosis; MODULE:synaptic_vesicle_cycle is the
  umbrella.
knowledge_gaps:
  - gap_statement: >-
      The relative contribution of direct clathrin-mediated endocytosis versus
      ultrafast/bulk retrieval followed by endosomal regeneration varies with
      temperature, stimulation strength and synapse type and is still contested.
    boundary: >-
      Both routes are documented; ultrafast endocytosis is clathrin-independent
      and occurs within tens of milliseconds at the edge of the active zone.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines the default selection in the retrieval-route variant set.
    resolution: Flash-and-freeze electron microscopy across synapse types at physiological temperature.
    provenance:
      - reference_id: PMID:24305055
        supporting_text: endocytosis occurs within 50 to 100 ms at sites flanking the active zone
        reference_section_type: ABSTRACT
  - gap_statement: >-
      The actin and formin machinery required for ultrafast endocytosis is not
      modeled here.
    boundary: Actin dependence of ultrafast endocytosis is established in mouse hippocampal neurons.
    gap_kind:
      - CURATION
    status: OPEN
  - gap_statement: >-
      Rab5, Rab35 and other endosomal sorting factors acting during vesicle
      regeneration from the synaptic endosome are not modeled.
    boundary: Clathrin-dependent budding from the synaptic endosome is modeled as the regeneration step.
    gap_kind:
      - CURATION
    status: OPEN
module:
  id: synaptic_vesicle_endocytosis
  label: Coat assembly -> membrane curvature -> dynamin fission -> uncoating
  module_type: BIOLOGICAL_PROCESS
