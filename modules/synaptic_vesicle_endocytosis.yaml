        id: GO:0048488
        label: synaptic vesicle endocytosis
      description: Retrieval of vesicle membrane and proteins from the presynaptic plasma membrane after exocytosis.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
      - preferred_term: presynaptic endocytic zone
        term:
          id: GO:0098833
          label: presynaptic endocytic zone
  conforms_to:
    - template: vesicle_coat_budding
      status: WITH_DEVIATIONS
      deviations:
        - >-
          No GTPase-primed coat recruitment tier: at the presynaptic endocytic
          zone the AP-2 coat is nucleated by PI(4,5)P2 and vesicle cargo, not by
          an Arf/Sar1 switch, so coat recruitment and cargo capture are merged
          into one tier carrying clathrin-cargo adaptor activity (GO:0035615).
        - >-
          An explicit BAR-domain membrane-curvature tier (GO:0005543 phospholipid
          binding) is inserted before scission.
        - >-
          Scission is carried out by the dynamin GTPase (GO:0003924) rather than
          by coat polymerisation alone, and uncoating carries the synaptojanin
          PI(4,5)P2 5-phosphatase activity (GO:0004439).
      notes: >-
        The recruit -> capture -> bud -> uncoat order of the template is
        preserved as coat/cargo -> curvature -> fission -> uncoating.
