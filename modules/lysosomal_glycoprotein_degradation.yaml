id: MODULE:lysosomal_glycoprotein_degradation
title: Lysosomal glycoprotein (N-glycan) degradation; NEU1/GLB1/HEX/MAN2B1/MANBA/FUCA1/AGA/NAGA
description: 'Glycoproteins delivered to the lysosome are proteolysed to glycopeptides whose glycans are
  then dismantled by lumenal exoglycosidases working from both ends. From the non-reducing end, N-glycan
  antennae are trimmed residue by residue: capping sialic acid (NEU1), terminal galactose (GLB1), antennal
  N-acetylglucosamine (beta-hexosaminidase, HEXA/HEXB), alpha-linked mannoses (MAN2B1) and the core beta-mannose
  (MANBA); terminal alpha-N-acetylgalactosamine of blood group A and mucin-type determinants is removed
  by NAGA. From the reducing end, the core alpha1,6-fucose is removed by FUCA1, which is required because
  core fucosylation blocks aspartylglucosaminidase (AGA); AGA then cleaves the N-glycosidic GlcNAc-Asn
  bond, separating the glycan from the asparagine residue. Loss of any step causes a glycoproteinosis
  (oligosaccharidosis) with lysosomal storage and urinary excretion of the corresponding oligosaccharides
  or glycoasparagines: sialidosis, GM1 gangliosidosis, Sandhoff disease, alpha- and beta-mannosidosis,
  fucosidosis, aspartylglucosaminuria and NAGA deficiency.'
status: DRAFT
evidence:
- source_id: GO:0006516
  statement: 'The module is grounded in glycoprotein catabolic process (GO:0006516): lysosomal exoglycosidase
    degradation of glycoprotein-derived N-glycans.'
- source_id: PMID:27491075
  title: A mouse model for fucosidosis recapitulates storage pathology and neurological features of the
    milder form of the human disease.
  statement: Core fucosylation sterically inhibits AGA, so FUCA1 action precedes AGA cleavage of the GlcNAc-Asn
    bond; Fuca1-null mice store core-fucosylated glycoasparagines.
- source_id: file:human/FUCA1/FUCA1-ai-review.yaml
  title: FUCA1 gene review (human)
  statement: The core-defucosylation step (UniProtKB:P04066, GO:0004560) matches the completed human FUCA1
    review.
- source_id: file:human/AGA/AGA-ai-review.yaml
  title: AGA gene review (human)
  statement: The GlcNAc-Asn cleavage step (UniProtKB:P20933, GO:0003948) matches the completed human AGA
    review.
- source_id: file:human/GLB1/GLB1-ai-review.yaml
  title: GLB1 gene review (human)
  statement: The beta-galactosidase step (UniProtKB:P16278, GO:0004565) matches the completed human GLB1
    review.
- source_id: file:human/NAGA/NAGA-ai-review.yaml
  title: NAGA gene review (human)
  statement: The alpha-N-acetylgalactosaminidase step (UniProtKB:P17050, GO:0008456) matches the completed
    human NAGA review.
module:
  id: lysosomal_glycoprotein_degradation
  label: Lysosomal glycoprotein (N-glycan) degradation
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: glycoprotein catabolic process
    term:
      id: GO:0006516
      label: glycoprotein catabolic process
    description: Lysosomal exoglycosidase degradation of glycoprotein-derived glycans and the glycan-asparagine
      linkage.
  context:
    cellular_components:
    - preferred_term: lysosomal lumen
      term:
        id: GO:0043202
        label: lysosomal lumen
      description: All steps are catalysed by soluble lysosomal hydrolases.
  parts:
  - order: 1
    role: terminal sialic acid removal
    node:
      id: neu1_step
      label: hydrolysis of terminal alpha-linked sialic acid from N-glycan antennae
      module_type: REACTION
      annotons:
      - id: neu1_activity
        label: 'NEU1: lysosomal sialidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Sialidase family (NEU1)
            term:
              id: PANTHER:PTHR10628
              label: SIALIDASE
            representative_members:
            - preferred_term: NEU1 (human)
              term:
                id: UniProtKB:Q99519
                label: Sialidase-1
        function:
          preferred_term: exo-alpha-sialidase activity
          term:
            id: GO:0004308
            label: exo-alpha-sialidase activity
          substrates:
          - preferred_term: sialylated glycoprotein-derived oligosaccharide
          products:
          - preferred_term: N-acetylneuraminate
          - preferred_term: desialylated oligosaccharide
          evidence:
          - source_id: EC:3.2.1.18
            statement: lysosomal exo-alpha-sialidase acting in the CTSA/GLB1 multienzyme complex; first
              exolytic step on sialylated antennae
        locations: &id001
        - preferred_term: lysosomal lumen
          term:
            id: GO:0043202
            label: lysosomal lumen
        role_description: Deficiency = sialidosis; secondary NEU1 deficiency in galactosialidosis (CTSA).
  - order: 2
    role: terminal galactose removal
    node:
      id: glb1_step
      label: hydrolysis of terminal beta-galactose from N-glycan antennae
      module_type: REACTION
      annotons:
      - id: glb1_activity
        label: 'GLB1: lysosomal acid beta-galactosidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Glycosyl hydrolase 35 family (GLB1)
            term:
              id: PANTHER:PTHR23421
              label: BETA-GALACTOSIDASE RELATED
            representative_members:
            - preferred_term: GLB1 (human)
              term:
                id: UniProtKB:P16278
                label: Beta-galactosidase
        function:
          preferred_term: beta-galactosidase activity
          term:
            id: GO:0004565
            label: beta-galactosidase activity
          substrates:
          - preferred_term: oligosaccharide with terminal beta-galactose
          products:
          - preferred_term: D-galactose
          - preferred_term: oligosaccharide with terminal GlcNAc
          evidence:
          - source_id: EC:3.2.1.23
            statement: lysosomal acid beta-galactosidase; also degrades GM1 ganglioside and keratan sulfate
              (see sibling modules)
        locations: *id001
        role_description: Deficiency = GM1 gangliosidosis / MPS IVB, with oligosacchariduria.
  - order: 3
    role: terminal N-acetylglucosamine removal
    node:
      id: hex_step
      label: hydrolysis of antennal terminal beta-N-acetylglucosamine
      module_type: REACTION
      annotons:
      - id: hex_activity
        label: 'HEXA/HEXB: lysosomal beta-hexosaminidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Glycosyl hydrolase 20 / beta-hexosaminidase family (HEX)
            term:
              id: PANTHER:PTHR22600
              label: BETA-HEXOSAMINIDASE
            representative_members:
            - preferred_term: HEXB (human)
              term:
                id: UniProtKB:P07686
                label: Beta-hexosaminidase subunit beta
        function:
          preferred_term: beta-N-acetylhexosaminidase activity
          term:
            id: GO:0004563
            label: beta-N-acetylhexosaminidase activity
          substrates:
          - preferred_term: oligosaccharide with terminal beta-GlcNAc
          products:
          - preferred_term: N-acetyl-D-glucosamine
          - preferred_term: oligomannoside
          evidence:
          - source_id: EC:3.2.1.52
            statement: lysosomal beta-hexosaminidase (HexA alpha-beta and HexB beta-beta); Sandhoff disease
              (HEXB) shows urinary storage of GlcNAc-terminated oligosaccharides
        locations: *id001
        role_description: Deficiency of HEXB = Sandhoff disease (also GM2 gangliosidosis).
  - order: 4
    role: alpha-mannose removal
    node:
      id: man2b1_step
      label: hydrolysis of alpha1,2/1,3/1,6-linked mannose of the oligomannose core
      module_type: REACTION
      annotons:
      - id: man2b1_activity
        label: 'MAN2B1: lysosomal alpha-mannosidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Glycosyl hydrolase 38 / alpha-mannosidase family (MAN2B1)
            term:
              id: PANTHER:PTHR11607
              label: ALPHA-MANNOSIDASE
            representative_members:
            - preferred_term: MAN2B1 (human)
              term:
                id: UniProtKB:O00754
                label: Lysosomal alpha-mannosidase
        function:
          preferred_term: alpha-mannosidase activity
          term:
            id: GO:0004559
            label: alpha-mannosidase activity
          substrates:
          - preferred_term: oligomannoside
          products:
          - preferred_term: D-mannose
          - preferred_term: Man(beta1-4)GlcNAc
          evidence:
          - source_id: EC:3.2.1.24
            statement: lysosomal acid alpha-mannosidase
        locations: *id001
        role_description: Deficiency = alpha-mannosidosis.
  - order: 5
    role: beta-mannose removal
    node:
      id: manba_step
      label: hydrolysis of the core beta1,4-linked mannose
      module_type: REACTION
      annotons:
      - id: manba_activity
        label: 'MANBA: lysosomal beta-mannosidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Glycosyl hydrolase 2 / beta-mannosidase family (MANBA)
            term:
              id: PANTHER:PTHR43730
              label: BETA-MANNOSIDASE
            representative_members:
            - preferred_term: MANBA (human)
              term:
                id: UniProtKB:O00462
                label: Beta-mannosidase
        function:
          preferred_term: beta-mannosidase activity
          term:
            id: GO:0004567
            label: beta-mannosidase activity
          substrates:
          - preferred_term: Man(beta1-4)GlcNAc
          products:
          - preferred_term: D-mannose
          - preferred_term: N-acetyl-D-glucosamine
          evidence:
          - source_id: EC:3.2.1.25
            statement: lysosomal beta-mannosidase; last step of non-reducing-end degradation of the N-glycan
              core
        locations: *id001
        role_description: Deficiency = beta-mannosidosis.
  - order: 6
    role: core fucose removal
    node:
      id: fuca1_step
      label: hydrolysis of core alpha1,6-fucose (and antennal alpha-fucose)
      module_type: REACTION
      annotons:
      - id: fuca1_activity
        label: 'FUCA1: tissue alpha-L-fucosidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Tissue alpha-L-fucosidase subfamily (FUCA1)
            term:
              id: PANTHER:PTHR10030:SF2
              label: TISSUE ALPHA-L-FUCOSIDASE
            representative_members:
            - preferred_term: FUCA1 (human)
              term:
                id: UniProtKB:P04066
                label: Tissue alpha-L-fucosidase
        function:
          preferred_term: alpha-L-fucosidase activity
          term:
            id: GO:0004560
            label: alpha-L-fucosidase activity
          substrates:
          - preferred_term: core-fucosylated glycoasparagine (Fuc(alpha1-6)GlcNAc-Asn)
          - preferred_term: fucosylated oligosaccharide
          products:
          - preferred_term: L-fucose
          - preferred_term: non-fucosylated glycoasparagine
          evidence:
          - source_id: file:human/FUCA1/FUCA1-ai-review.yaml
            statement: 'Core function in the completed FUCA1 review: alpha-L-fucosidase activity (GO:0004560)
              in the lysosomal lumen; Fuca1-null mice store Fuc(alpha1,6)-GlcNAc-Asn (PMID:27491075).'
          - source_id: Reactome:R-HSA-5693807
            statement: FUCA1 hydrolyses NGP:1,6-GlcNAc (human Reactome reaction)
        locations: *id001
        role_description: Deficiency = fucosidosis.
  - order: 7
    role: GlcNAc-Asn bond cleavage
    node:
      id: aga_step
      label: hydrolysis of the N-glycosidic GlcNAc-Asn linkage
      module_type: REACTION
      annotons:
      - id: aga_activity
        label: 'AGA: aspartylglucosaminidase (glycosylasparaginase)'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Glycosylasparaginase subfamily (AGA)
            term:
              id: PANTHER:PTHR10188:SF6
              label: N(4)-(BETA-N-ACETYLGLUCOSAMINYL)-L-ASPARAGINASE
            representative_members:
            - preferred_term: AGA (human)
              term:
                id: UniProtKB:P20933
                label: N(4)-(beta-N-acetylglucosaminyl)-L-asparaginase
        function:
          preferred_term: N4-(beta-N-acetylglucosaminyl)-L-asparaginase activity
          term:
            id: GO:0003948
            label: N4-(beta-N-acetylglucosaminyl)-L-asparaginase activity
          substrates:
          - preferred_term: glycoasparagine (GlcNAc-Asn-linked oligosaccharide)
          products:
          - preferred_term: L-aspartate
          - preferred_term: N-glycan with free reducing-end GlcNAc (glycosylamine, hydrolysed to free
              oligosaccharide)
          evidence:
          - source_id: file:human/AGA/AGA-ai-review.yaml
            statement: 'Core function in the completed AGA review: N4-(beta-N-acetylglucosaminyl)-L-asparaginase
              activity (GO:0003948) in the lysosome, in glycoprotein catabolic process and protein deglycosylation.'
          - source_id: EC:3.5.1.26
            statement: Ntn-hydrolase activated by autoproteolysis
        locations: *id001
        role_description: Deficiency = aspartylglucosaminuria.
  - order: 8
    role: terminal alpha-GalNAc removal
    node:
      id: naga_step
      label: hydrolysis of terminal alpha-N-acetylgalactosamine (blood group A and mucin-type determinants)
      module_type: REACTION
      annotons:
      - id: naga_activity
        label: 'NAGA: alpha-N-acetylgalactosaminidase'
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Alpha-N-acetylgalactosaminidase subfamily (NAGA)
            term:
              id: PANTHER:PTHR11452:SF25
              label: ALPHA-N-ACETYLGALACTOSAMINIDASE
            representative_members:
            - preferred_term: NAGA (human)
              term:
                id: UniProtKB:P17050
                label: Alpha-N-acetylgalactosaminidase
        function:
          preferred_term: alpha-N-acetylgalactosaminidase activity
          term:
            id: GO:0008456
            label: alpha-N-acetylgalactosaminidase activity
          substrates:
          - preferred_term: glycopeptide or glycolipid with terminal alpha-GalNAc
          products:
          - preferred_term: N-acetyl-D-galactosamine
          - preferred_term: de-capped glycoconjugate
          evidence:
          - source_id: file:human/NAGA/NAGA-ai-review.yaml
            statement: 'Core function in the completed NAGA review: alpha-N-acetylgalactosaminidase activity
              (GO:0008456) in the lysosomal lumen, in glycoprotein and glycolipid catabolic processes.'
        locations: *id001
        role_description: Deficiency = Schindler/Kanzaki disease (NAGA deficiency).
  connections:
  - source: neu1_step
    target: glb1_step
    connection_type: PROVIDES_INPUT_FOR
    description: Desialylation exposes the penultimate beta-galactose.
  - source: glb1_step
    target: hex_step
    connection_type: PROVIDES_INPUT_FOR
    description: Removal of galactose exposes antennal beta-GlcNAc.
  - source: hex_step
    target: man2b1_step
    connection_type: PROVIDES_INPUT_FOR
    description: Removal of antennal GlcNAc exposes the alpha-mannose branches.
  - source: man2b1_step
    target: manba_step
    connection_type: PROVIDES_INPUT_FOR
    description: Removal of alpha-mannoses leaves Man(beta1-4)GlcNAc for MANBA.
  - source: fuca1_step
    target: aga_step
    connection_type: PROVIDES_INPUT_FOR
    description: Core defucosylation is required before AGA can cleave the GlcNAc-Asn bond.
  notes: Steps 6-7 (FUCA1, AGA) and the GLB1 and NAGA steps are grounded in completed human gene reviews;
    the NEU1, HEXA/HEXB, MAN2B1 and MANBA steps are grounded only in UniProt/EC and await gene reviews
    (NEU1, HEXA and HEXB reviews are INITIALIZED; MAN2B1 and MANBA have none). The reducing-end di-N-acetylchitobiase
    CTBS (UniProtKB:Q01459), which cleaves the chitobiose core after AGA in primates and rodents, is not
    modelled as a part because no GO molecular function term for its activity was identified. The cytosolic
    ENGASE/NGLY1 route for misfolded ER glycoproteins is a separate pathway. GLB1, NEU1 and the hexosaminidases
    are shared with the glycosphingolipid and keratan sulfate degradation modules; sialic acid released
    by NEU1 is exported by SLC17A5 (sialic_acid_metabolism module). The order of the non-reducing-end
    steps is the canonical order for complex N-glycans; for oligomannose glycans steps 1-3 do not apply.
