id: MODULE:il12_family_heterodimer_assembly
title: IL-12 family heterodimer assembly module
description: >-
  Assembly of the IL-12 family cytokines from shared subunits, which is the step
  that decides which cytokine a cell releases. Four cytokines are built from five
  chains: IL12B (p40) pairs with IL12A (p35) to make IL-12 or with IL23A (p19) to
  make IL-23, while EBI3 pairs with IL27 (p28) to make IL-27 or with IL12A to make
  IL-35. No subunit is active alone, and an unpaired subunit does not leave the cell:
  calnexin holds EBI3 in the endoplasmic reticulum until a partner arrives, and
  co-expression of the partner is what permits secretion. So two cells transcribing
  the same chain can release different cytokines, or none, depending on what else
  they transcribe. Receptor engagement and the signalling that follows are separate
  modules.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:11114383
  statement: An IL-12 family subunit has no activity alone; pairing with the shared chain
    creates the cytokine.
  supporting_text: This factor, which we term p19, shows no biological activity by itself; instead,
    it combines with the p40 subunit of IL-12 to form a novel, biologically active, composite cytokine,
    which we term IL-23.
- source_id: Reactome:R-HSA-8950387
  statement: Calnexin retains unpaired EBI3 in the ER, and a partner subunit is what releases it.
  supporting_text: >-
    EBI3 can be released by itself but the association with CANX prevents this, the complex is
    retained in the ER. The co-expression of other interleukin subunits enables the release of EBI3
    in a complex with Interleukin-27 subunit alpha (IL27)
- source_id: PMID:7843232
  statement: IL-12 is a disulfide-bonded heterodimer of p40 and p35.
  supporting_text: Interleukin-12 (IL-12) is a cytokine that has regulatory effects on T and natural
    killer (NK) cells and is composed of two disulfide-bonded subunits, p40 and p35.
notes: >-
  Built for projects/PRODUCTION_TERMS.md, where the curated classification marks
  the IL-12, IL-23, IL-27, IL-35 and IL-30 production terms (5 production, 12
  regulation) as resting on dedicated machinery: an obligate assembly step. This
  is the clearest case in that project of a "production" term naming something
  real that is nevertheless not transcription. GO already models the products, as
  GO:0043514, GO:0070743, GO:0070744 and GO:0070745, so unlike the TGF-beta and
  interferon modules this one needs no new term.
  Boundary: starts with the separately transcribed subunits and ends with a
  secreted heterodimer, or with an unpaired subunit that is retained or released as
  an antagonist. Receptor binding and the JAK-STAT signalling that follows belong
  to modules/jak_stat_signaling.yaml and the cytokine-specific receptor modules.
  Transcription of each subunit gene is upstream and is not modelled here; that is
  what the production terms name.
  Calnexin is given no molecular function on purpose. Its role here is to hold an
  unassembled subunit, and GO's generic terms for that were obsoleted
  (GO:0051082 unfolded protein binding, GO:0003754 chaperone activity) without a
  replacement that fits a holdase; see projects/UNFOLDED_PROTEIN_BINDING.md. An
  omitted function says "not established", which is accurate, where
  GO:0051787 misfolded protein binding would say something false, because an
  unpaired subunit is unassembled rather than misfolded.
  No cached GO-CAM has an activity on subunit assembly: the cached IL-12 and
  IL-23 models all start at the receptor. So there are no pins.
module:
  id: il12_family_heterodimer_assembly
  label: IL-12 family heterodimer assembly
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Retention of the unpaired subunit, then competitive pairing, then secretion of
    whichever heterodimer was formed. The competition is the mechanism: the chains
    are shared, so pairing is zero-sum.
  concepts:
  - preferred_term: protein-containing complex assembly
    term:
      id: GO:0065003
      label: protein-containing complex assembly
  context:
    taxa:
    - preferred_term: mammals
      term:
        id: NCBITaxon:40674
        label: Mammalia
  knowledge_gaps:
  - gap_statement: >-
      Whether a cell controls which pairing it makes, beyond the relative amounts
      of each subunit, is unknown. No chaperone or factor is known to select
      IL12A over IL23A for the shared p40 chain, so it is unclear whether the
      choice between IL-12 and IL-23 is anything more than mass action.
    boundary: >-
      Affects whether the pairing step needs a regulator; the module currently
      models competition with no selecting factor.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      IL-12 and IL-23 drive different T-cell programmes and different diseases, and
      therapeutic antibodies against the shared p40 chain hit both. A factor that
      biases pairing would be a way to separate them.
    resolution: >-
      Co-express the shared chain with both partners at controlled ratios and ask
      whether the secreted ratio departs from what mass action predicts; screen for
      factors that shift it.
    provenance:
    - reference_id: PMID:11114383
      reference_section_type: ABSTRACT
      supporting_text: it combines with the p40 subunit of IL-12 to form a novel, biologically active,
        composite cytokine, which we term IL-23
  - gap_statement: >-
      Whether the free alpha subunits have activity of their own is contested.
      IL23A has none reported, but IL27 (p28) has been described as an antagonist
      when unpaired, and for IL-35 even the subunit composition of the receptor is
      unconventional.
    boundary: Affects whether the unpaired-subunit arm of this module is a dead end or a
      signalling branch in its own right.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      If unpaired subunits signal, then the assembly step is not a gate but a
      switch between two outputs, and measuring one chain tells you less than it
      appears to.
    resolution: Test each free subunit against the candidate receptor chains in a cell
      lacking its partner.
  parts:
  - order: 1
    role: retention of the unpaired subunit
    node:
      id: unpaired_subunit_retention
      label: ER retention of the unpaired subunit
      module_type: TRANSPORT_STEP
      description: >-
        A newly made subunit that has no partner does not reach the outside. For
        EBI3 this is shown directly: calnexin binds it in the endoplasmic reticulum
        and keeps it there, and only co-expression of a partner releases it. The
        step is why transcription of one chain does not predict secretion of any
        cytokine.
      concepts:
      - preferred_term: protein retention in ER lumen
        term:
          id: GO:0006621
          label: protein retention in ER lumen
      annotons:
      - id: canx_subunit_hold
        label: Calnexin retention of unpaired EBI3
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: CANX
            term:
              id: UniProtKB:P27824
              label: Calnexin
        processes:
        - preferred_term: protein retention in ER lumen
          term:
            id: GO:0006621
            label: protein retention in ER lumen
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: >-
          Holds the unassembled subunit in the ER. No molecular function is asserted:
          GO's generic chaperone and unfolded-protein-binding terms are obsolete, and
          an unpaired subunit is unassembled rather than misfolded, so the fitting
          term does not exist (see the module notes).
        evidence:
        - source_id: Reactome:R-HSA-8950387
          statement: Most newly synthesised EBI3 is retained in the ER bound to calnexin.
          supporting_text: >-
            In human cell lines (BL30, BL41, Louckes, BJAB, P3HR1) most newly synthesized EBI3 is
            retained in the endoplasmic reticulum (ER) in an endoglycosidase H-sensitive form
        - source_id: Reactome:R-HSA-8950342
          statement: Co-expression of the partner subunit is what allows secretion.
          supporting_text: >-
            Co expression of IL27 and EBI3 enables formation of IL27:EBI3, allowing secretion
  - order: 2
    role: competitive subunit pairing
    node:
      id: subunit_pairing
      label: Competitive pairing of shared and partner subunits
      module_type: REGULATORY_STEP
      description: >-
        Each shared chain can take either of two partners, and each pairing yields a
        different cytokine with different biology. The alternatives are genuinely
        exclusive for a given molecule of the shared chain, which is what makes this
        a choice rather than an elaboration.
      variant_sets:
      - id: heterodimer_pairing
        label: Subunit pairing
        axis: which partner the shared subunit takes
        variant_kind: ROUTE
        selection: ONE_OR_MORE
        notes: >-
          The two shared chains are IL12B and EBI3; IL12A is itself shared between
          IL-12 and IL-35, so it belongs to both arms. A cell can make more than one
          of these cytokines at once, which is why the selection is ONE_OR_MORE,
          but any single molecule of a shared chain ends up in only one of them.
        evidence:
        - source_id: PMID:11114383
          statement: p19 combines with the p40 subunit of IL-12 to form IL-23, a distinct cytokine.
          supporting_text: it combines with the p40 subunit of IL-12 to form a novel, biologically
            active, composite cytokine, which we term IL-23
        variants:
        - id: il12_pairing
          label: IL12B + IL12A = IL-12
          module_type: REGULATORY_STEP
          annotons:
          - id: il12b_subunit
            label: IL12B shared subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IL12B
                term:
                  id: UniProtKB:P29460
                  label: Interleukin-12 subunit beta
            function: &heterodimerization
              preferred_term: protein heterodimerization activity
              term:
                id: GO:0046982
                label: protein heterodimerization activity
            locations: &er_lumen
            - preferred_term: endoplasmic reticulum lumen
              term:
                id: GO:0005788
                label: endoplasmic reticulum lumen
            role_description: >-
              The chain shared between IL-12 and IL-23, and the target of therapeutic
              antibodies that therefore block both.
            evidence:
            - source_id: PMID:7843232
              statement: IL-12 is composed of two disulfide-bonded subunits, p40 and p35.
              supporting_text: is composed of two disulfide-bonded subunits, p40 and p35
          - id: il12_complex
            label: IL-12 heterodimer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: interleukin-12 complex
                term:
                  id: GO:0043514
                  label: interleukin-12 complex
                active_units:
                - id: il12_p35
                  label: IL12A
                  role: The alpha chain that makes the pair IL-12 rather than IL-23.
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: IL12A
                      term:
                        id: UniProtKB:P29459
                        label: Interleukin-12 subunit alpha
            function: &assembled_cytokine
              preferred_term: cytokine activity
              term:
                id: GO:0005125
                label: cytokine activity
              description: The activity belongs to the assembled heterodimer, not to either
                chain alone.
            locations: &extracellular
            - preferred_term: extracellular region
              term:
                id: GO:0005576
                label: extracellular region
            role_description: One of the module's four possible outputs; drives the Th1
              programme.
            evidence:
            - source_id: PMID:7843232
              statement: IL-12 acts on T and NK cells.
              supporting_text: Interleukin-12 (IL-12) is a cytokine that has regulatory effects on
                T and natural killer (NK) cells
        - id: il23_pairing
          label: IL12B + IL23A = IL-23
          module_type: REGULATORY_STEP
          annotons:
          - id: il23a_subunit
            label: IL23A partner subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IL23A
                term:
                  id: UniProtKB:Q9NPF7
                  label: Interleukin-23 subunit alpha
            function: *heterodimerization
            locations: *er_lumen
            role_description: >-
              Inactive alone; its only known role is to pair with the shared p40 chain
              and so divert it from IL-12 to IL-23.
            evidence:
            - source_id: PMID:11114383
              statement: p19 has no activity by itself and gains it only by combining with p40.
              supporting_text: shows no biological activity by itself; instead, it combines with the
                p40 subunit of IL-12
          - id: il23_complex
            label: IL-23 heterodimer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: interleukin-23 complex
                term:
                  id: GO:0070743
                  label: interleukin-23 complex
            function: *assembled_cytokine
            locations: *extracellular
            role_description: >-
              Drives a different T-cell programme from IL-12 despite sharing a chain
              with it, which is the strongest argument that the assembly step matters.
            evidence:
            - source_id: PMID:11114383
              statement: IL-23 has activities distinct from IL-12, including on memory T cells
                that IL-12 does not affect.
              supporting_text: IL-23 induces strong proliferation of mouse memory (CD4(+)CD45Rb(low))
                T cells, a unique activity of IL-23 as IL-12 has no effect on this cell population.
        - id: il27_pairing
          label: EBI3 + IL27 = IL-27
          module_type: REGULATORY_STEP
          annotons:
          - id: ebi3_subunit
            label: EBI3 shared subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EBI3
                term:
                  id: UniProtKB:Q14213
                  label: Interleukin-27 subunit beta
            function: *heterodimerization
            locations: *er_lumen
            role_description: >-
              The chain shared between IL-27 and IL-35, and the one shown to be held by
              calnexin until a partner arrives.
            evidence:
            - source_id: Reactome:R-HSA-8950387
              statement: Calnexin binds EBI3 and prevents its release.
              supporting_text: Calnexin (CANX or p95 calnexin) binds Interleukin-27 subunit beta (EBI3,
                IL27B).
          - id: il27_complex
            label: IL-27 heterodimer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: interleukin-27 complex
                term:
                  id: GO:0070744
                  label: interleukin-27 complex
                active_units:
                - id: il27_p28
                  label: IL27
                  role: The alpha chain that makes the pair IL-27 rather than IL-35.
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: IL27
                      term:
                        id: UniProtKB:Q8NEV9
                        label: Interleukin-27 subunit alpha
            function: *assembled_cytokine
            locations: *extracellular
            role_description: One of the module's four outputs.
            evidence:
            - source_id: Reactome:R-HSA-8950342
              statement: IL27 binds EBI3 to form the IL-27 heterodimer.
              supporting_text: >-
                Interleukin 27 subunit alpha (IL27, IL-27p28) binds Interleukin 27 subunit beta (EBI3)
                forming the Interleukin 27 heterodimeric complex (IL27:EBI3).
        - id: il35_pairing
          label: EBI3 + IL12A = IL-35
          module_type: REGULATORY_STEP
          annotons:
          - id: il35_complex
            label: IL-35 heterodimer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: interleukin-35 complex
                term:
                  id: GO:0070745
                  label: interleukin-35 complex
                active_units:
                - id: il35_p35
                  label: IL12A
                  role: >-
                    The same chain that makes IL-12 with p40; pairing it with EBI3
                    instead produces a suppressive rather than an inflammatory cytokine.
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: IL12A
                      term:
                        id: UniProtKB:P29459
                        label: Interleukin-12 subunit alpha
            function: *assembled_cytokine
            locations: *extracellular
            role_description: >-
              The sharpest illustration of the module: IL12A in one pairing gives the
              Th1-driving IL-12, and in another the regulatory IL-35.
            evidence:
            - source_id: Reactome:R-HSA-8950362
              statement: IL-35 is a heterodimer of EBI3 and IL12A, and IL12A pairs with EBI3
                differently from the way IL27 does.
              supporting_text: >-
                Site directed mutagenesis of IL12A identified mutations that disrupt formation of
                Interleukin 12 and Interleukin 27 heterodimeric complexes but not Interleukin 35.
  - order: 3
    role: fate of the unpaired shared subunit
    optional: true
    node:
      id: unpaired_subunit_fate
      label: Release of the unpaired shared subunit as an antagonist
      module_type: REGULATORY_STEP
      description: >-
        When the shared p40 chain is made in excess of its partners it can leave as a
        monomer or a disulfide-linked homodimer, and the homodimer competes with
        IL-12 for its receptor. Failed assembly is therefore not silent: it produces
        an inhibitor. Shown in mouse.
      annotons:
      - id: p40_homodimer_antagonist
        label: IL12B homodimer IL-12 antagonist
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: IL12B
            term:
              id: UniProtKB:P29460
              label: Interleukin-12 subunit beta
        function:
          preferred_term: cytokine receptor binding
          term:
            id: GO:0005126
            label: cytokine receptor binding
          description: >-
            The unpaired homodimer binds the IL-12 receptor without activating it,
            which is how it antagonises IL-12.
        locations: *extracellular
        role_description: >-
          Records that the assembly step has two outcomes rather than one, and that
          the amount of the shared chain alone cannot tell you the sign of the
          cell's output.
        evidence:
        - source_id: PMID:7843232
          statement: The mouse p40 homodimer is a far more potent IL-12 antagonist than the
            monomer.
          supporting_text: The (p40)2 was 25- to 50-fold more active than the p40 monomer in causing
            specific, dose-dependent inhibition of IL-12-induced mouse concanavalin A (Con A) blast
            proliferation
  connections:
  - source: unpaired_subunit_retention
    target: subunit_pairing
    connection_type: PRECEDES
    description: The retained subunit is the substrate of pairing; arrival of a partner is
      what ends retention.
    chaining_status: NOT_APPLICABLE
    chaining_note: A complex-assembly chain, not a metabolic one, so the CoA continuity check
      does not apply.
  - source: unpaired_subunit_fate
    target: subunit_pairing
    connection_type: NEGATIVELY_REGULATES
    description: >-
      The homodimer route consumes shared subunit that would otherwise pair, and its
      product antagonises the cytokine that pairing makes.
