id: MODULE:dmel_notch_signaling
title: Notch signaling pathway in Drosophila melanogaster
description: >-
  Notch signaling is a juxtacrine pathway in which the transmembrane ligands Delta and Serrate
  on one cell bind the Notch receptor on a neighbouring cell. Ligand binding, together with
  ligand endocytosis in the signal-sending cell, exposes Notch to cleavage by the ADAM10 metalloprotease
  Kuzbanian (S2 cleavage), after which the gamma-secretase complex (Presenilin, Nicastrin,
  Aph-1 and Pen-2) cleaves within the transmembrane domain (S3 cleavage) and releases the
  Notch intracellular domain. The intracellular domain enters the nucleus and forms a transcriptional
  activation complex with the CSL DNA-binding protein Suppressor of Hairless and the coactivator
  Mastermind, switching Su(H) target genes such as the Enhancer of split complex genes from
  repression to activation. The pathway controls lateral inhibition, boundary formation and
  binary cell-fate decisions throughout development.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001066
  title: 'FlyBase gene group CNM: Csl-notch-mastermind transcription factor complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as csl-notch-mastermind transcription
    factor complex (CNM); this module models that group.
- source_id: FB:FBgg0001068
  title: 'FlyBase gene group NTCH: Notch signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 91 D. melanogaster genes as notch signaling pathway (NTCH);
    this module models that group.
- source_id: GO:0007219
  title: Notch signaling pathway
  statement: >-
    GO term grounding the module as Notch signaling pathway.
notes: >-
  Boundary. The module contains ligands, receptor, the two proteolytic steps and the nuclear
  CSL complex. Notch appears twice, as the receptor and as the intracellular domain within
  the nuclear complex. E3 ligases that drive ligand endocytosis (Neuralized, Mind bomb 1),
  glycosyltransferases that modify Notch (Ofut1, Fringe, Rumi), the corepressor Hairless and
  the Enhancer of split target genes are FlyBase regulators and are not modelled as parts.
  Weary (wry) is included because FlyBase lists it among the core components, but its mechanism
  is not established. FlyBase groups realized by this module: CNM (FBgg0001066), NTCH (FBgg0001068).
  Subgroups folded into it: NTCH-C. FlyBase also curates regulator sets for this pathway,
  which are context and not modelled as parts: NTCH-N (negative regulators of notch signaling
  pathway, 37 genes); NTCH-P (positive regulators of notch signaling pathway, 48 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_notch_signaling.yaml; none of the member genes has a gene review
  yet unless noted.
