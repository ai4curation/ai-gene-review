id: MODULE:nematode_levamisole_sensitive_nachr
title: Nematode levamisole-sensitive nicotinic acetylcholine receptor
description: >-
  Levamisole-sensitive acetylcholine receptors are nematode Cys-loop cation
  channels that mediate excitatory body-wall muscle neurotransmission and are
  selectively activated by the anthelmintic agonist levamisole. In C. elegans,
  the receptor pore contains five distinct subunits: the non-alpha UNC-29 and
  LEV-1 subunits plus the alpha subunits UNC-38, UNC-63 and LEV-8. Functional
  heterologous expression requires three conserved ancillary proteins, RIC-3,
  UNC-50 and UNC-74, that support receptor biogenesis and trafficking before
  the assembled receptor reaches postsynaptic membranes. This first draft is
  grounded in the C. elegans receptor and tracks Brugia malayi, Haemonchus
  contortus, Onchocerca volvulus and Ascaris suum candidates for later
  duplicate-resolution and orthology review.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:19020092
    title: >-
      Eight genes are required for functional reconstitution of the
      Caenorhabditis elegans levamisole-sensitive acetylcholine receptor.
    statement: >-
      Functional Xenopus oocyte reconstitution of the C. elegans L-AChR
      required the five pore subunits UNC-29, LEV-1, UNC-38, UNC-63 and LEV-8
      plus the ancillary proteins RIC-3, UNC-50 and UNC-74.
    supporting_text: >-
      Using Xenopus laevis oocytes, we were able to reconstitute functional
      L-AChRs by coexpressing the 5 distinct receptor subunits and the 3
      ancillary proteins.
  - source_id: PMID:15990870
    title: >-
      Identification and characterization of novel nicotinic
      receptor-associated proteins in Caenorhabditis elegans.
    statement: >-
      Tandem affinity purification of UNC-29-tagged receptor complexes from C.
      elegans recovered all five L-AChR pore subunits, verifying that UNC-29,
      LEV-1, UNC-38, UNC-63 and LEV-8 physically associate in vivo.
    supporting_text: >-
      Multiple peptides of each of the levamisole receptor subunits, UNC-29,
      UNC-38, UNC-63, LEV-8, and LEV-1, were identified in four different
      purifications
  - source_id: file:genes/worm/unc-29/unc-29-ai-review.yaml
    title: C. elegans unc-29 gene review
    statement: >-
      The existing unc-29 review accepts UNC-29 as a non-alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:genes/worm/lev-1/lev-1-ai-review.yaml
    title: C. elegans lev-1 gene review
    statement: >-
      The lev-1 review accepts LEV-1 as a non-alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:genes/worm/unc-38/unc-38-ai-review.yaml
    title: C. elegans unc-38 gene review
    statement: >-
      The unc-38 review accepts UNC-38 as an alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:genes/worm/unc-63/unc-63-ai-review.yaml
    title: C. elegans unc-63 gene review
    statement: >-
      The unc-63 review accepts UNC-63 as an alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:genes/worm/lev-8/lev-8-ai-review.yaml
    title: C. elegans lev-8 gene review
    statement: >-
      The lev-8 review accepts LEV-8 as an alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:genes/worm/ric-3/ric-3-ai-review.yaml
    title: C. elegans ric-3 gene review
    statement: >-
      The ric-3 review models RIC-3 as an ER-membrane factor that promotes
      maturation and functional surface expression of several C. elegans
      nicotinic acetylcholine receptors, including the L-AChR.
  - source_id: file:genes/worm/unc-50/unc-50-ai-review.yaml
    title: C. elegans unc-50 gene review
    statement: >-
      The unc-50 review models UNC-50 as a Golgi-membrane factor that directs
      assembled L-AChRs toward neuromuscular-junction surface expression.
  - source_id: file:genes/worm/unc-74/unc-74-ai-review.yaml
    title: C. elegans unc-74 gene review
    statement: >-
      The unc-74 review models UNC-74 as a predicted single-pass ER-membrane
      TMX3/PDI-family oxidoreductase that is required for efficient L-AChR
      expression.
  - source_id: file:genes/worm/acr-8/acr-8-ai-review.yaml
    title: C. elegans acr-8 gene review
    statement: >-
      The acr-8 review keeps C. elegans ACR-8 outside the canonical
      five-subunit L-AChR while recognizing it as an alpha-type nAChR subunit
      recovered with native UNC-29-containing receptor material.
  - source_id: file:genes/HAECO/acr-8/acr-8-ai-review.yaml
    title: Haemonchus contortus acr-8 gene review
    statement: >-
      The H. contortus acr-8 review models Hco-ACR-8 as an alpha pore subunit
      of the reconstituted, ACR-8-containing Hco-L-AChR1 receptor.
  - source_id: file:interpro/panther/PTHR18945/PTHR18945-entries.csv
    title: Local PANTHER PTHR18945 member table
    statement: >-
      Reviewed local PTHR18945 records include C. elegans UNC-29, LEV-1,
      UNC-38 and UNC-63 in the broad neurotransmitter-gated ion channel family;
      LEV-8 was resolved separately from UniProt as accession Q93329.
notes: >-
  Boundary. This module models the levamisole-sensitive AChR expression system
  reconstituted by Boulin et al.: the five-subunit C. elegans pore plus the
  RIC-3, UNC-50 and UNC-74 ancillary factors needed for robust receptor
  expression. It deliberately excludes the ACR-16 nicotine-sensitive AChR, the
  ACC/DEG-3/DES-2/MPTL nicotinic-like channels, the avermectin-sensitive GluCl
  chloride channels, monepantel targets, and GABA/glycine/EXP-1/MOD-1-like
  Cys-loop channels that also sit in PANTHER PTHR18945. It also leaves
  synaptic clustering by LEV-10, LEV-9, OIG-4, CRLD-1 and later-acting
  postsynaptic scaffolds for later extension or a separate trafficking module.
  The reviewed ACR-8 lane is left outside this first pore realization because
  C. elegans ACR-8 is not an obligate member of the canonical five-subunit
  L-AChR, and the exact UniProt accessions for the non-ACR-8 subunits of the
  reconstituted H. contortus L-AChR still need resolution.

  Ortholog resolution. PTHR18945 is much broader than the L-AChR pore. The
  Brugia malayi A0A1P6C5A7, A0A4E9EUJ4 and A0A4E9FKF9 records are plausible
  UNC-29, UNC-63 and UNC-38 representatives, and live UniProt also exposes
  ACR-8-lane candidates in Brugia, Haemonchus and Ascaris. The H. contortus
  reconstitution and resistance literature establishes ACR-8 as a named
  parasite L-AChR alpha-subunit lane rather than a simple LEV-8 projection, and
  A9XX24 is now the reviewed Hco-ACR-8 accession for that lane. Parasite pore
  compositions must still be resolved against sequence, gene model and
  literature before choosing review folders. O. volvulus P54247 is a reviewed
  non-alpha acetylcholine receptor candidate, but the current O. volvulus
  PTHR18945 slice is also crowded with unnamed records that may include an
  ACR-8 ortholog, plus ACR-16-like, glutamate-gated and GABA-like channel
  records.
module:
  id: nematode_levamisole_sensitive_nachr
  label: Nematode levamisole-sensitive nicotinic acetylcholine receptor
  module_type: BIOLOGICAL_PROCESS
  description: >-
    C. elegans L-AChR receptor-pore subunits and ancillary proteins that allow
    functional expression of the levamisole-sensitive acetylcholine-gated
    cation channel.
  concepts:
    - preferred_term: acetylcholine-gated channel complex
      term:
        id: GO:0005892
        label: acetylcholine-gated channel complex
      description: >-
        The pentameric ion-channel complex assembled by UNC-29, LEV-1, UNC-38,
        UNC-63 and LEV-8 in C. elegans.
    - preferred_term: acetylcholine-gated monoatomic cation-selective channel activity
      term:
        id: GO:0022848
        label: acetylcholine-gated monoatomic cation-selective channel activity
      description: >-
        The pore activity enabled by the assembled levamisole-sensitive
        receptor.
  context:
    taxa:
      - preferred_term: Nematoda
        term:
          id: NCBITaxon:6231
          label: Nematoda
    cellular_components:
      - preferred_term: postsynaptic membrane
        term:
          id: GO:0045211
          label: postsynaptic membrane
  parts:
    - order: 1
      role: levamisole-sensitive acetylcholine receptor pore
      node:
        id: lachr_pore
        label: Five-subunit C. elegans L-AChR pore
        module_type: PROTEIN_COMPLEX
        description: >-
          The C. elegans levamisole-sensitive acetylcholine receptor is a
          heteropentameric Cys-loop cation channel assembled from three alpha
          subunits, UNC-38, UNC-63 and LEV-8, and two non-alpha subunits,
          UNC-29 and LEV-1.
        annotons:
          - id: elegans_lachr
            label: C. elegans levamisole-sensitive AChR
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: C. elegans levamisole-sensitive acetylcholine receptor
                term:
                  id: GO:0005892
                  label: acetylcholine-gated channel complex
                active_units:
                  - id: unc29_non_alpha
                    label: UNC-29 non-alpha subunit
                    role: Non-alpha pore subunit of the L-AChR heteropentamer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: UNC-29
                        term:
                          id: UniProtKB:P48181
                          label: Acetylcholine receptor subunit beta-type unc-29
                  - id: lev1_non_alpha
                    label: LEV-1 non-alpha subunit
                    role: Non-alpha pore subunit of the L-AChR heteropentamer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: LEV-1
                        term:
                          id: UniProtKB:Q27218
                          label: Acetylcholine receptor subunit beta-type lev-1
                  - id: unc38_alpha
                    label: UNC-38 alpha subunit
                    role: Alpha pore subunit of the L-AChR heteropentamer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: UNC-38
                        term:
                          id: UniProtKB:Q23022
                          label: Acetylcholine receptor subunit alpha-type unc-38
                  - id: unc63_alpha
                    label: UNC-63 alpha subunit
                    role: Alpha pore subunit of the L-AChR heteropentamer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: UNC-63
                        term:
                          id: UniProtKB:Q9N587
                          label: Acetylcholine receptor subunit alpha-type unc-63
                  - id: lev8_alpha
                    label: LEV-8 alpha subunit
                    role: Alpha pore subunit of the L-AChR heteropentamer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: LEV-8
                        term:
                          id: UniProtKB:Q93329
                          label: Acetylcholine receptor
            function:
              preferred_term: acetylcholine-gated monoatomic cation-selective channel activity
              term:
                id: GO:0022848
                label: acetylcholine-gated monoatomic cation-selective channel activity
            processes:
              - preferred_term: neuromuscular synaptic transmission
                term:
                  id: GO:0007274
                  label: neuromuscular synaptic transmission
            locations:
              - preferred_term: postsynaptic membrane
                term:
                  id: GO:0045211
                  label: postsynaptic membrane
            role_description: >-
              The five distinct receptor subunits form the L-AChR pore that
              mediates levamisole-sensitive acetylcholine-gated cation currents
              in nematode body-wall muscle.
            evidence:
              - source_id: PMID:19020092
                statement: >-
                  Omitting any pore subunit nearly eliminated heterologous
                  receptor function, consistent with all five pore subunits
                  assembling in the same receptor.
                supporting_text: >-
                  functional receptors were virtually eliminated when 1 or more
                  of the 5 receptor subunits were omitted
              - source_id: PMID:15990870
                statement: >-
                  Native tandem-affinity purifications recovered peptides from
                  each of the five L-AChR pore subunits.
                supporting_text: >-
                  Multiple peptides of each of the levamisole receptor
                  subunits, UNC-29, UNC-38, UNC-63, LEV-8, and LEV-1, were
                  identified in four different purifications
    - order: 2
      role: ancillary expression and trafficking of the L-AChR
      node:
        id: lachr_expression_factors
        label: RIC-3/UNC-50/UNC-74-assisted L-AChR expression
        module_type: REGULATORY_STEP
        description: >-
          RIC-3, UNC-50 and UNC-74 are not pore subunits, but they are required
          for efficient expression of the five-subunit L-AChR in Xenopus
          oocytes and for levamisole-sensitive receptor expression in vivo.
        annotons:
          - id: ric3
            label: RIC-3 ancillary protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RIC-3
                term:
                  id: UniProtKB:Q22472
                  label: Resistance to inhibitors of cholinesterase protein 3
            role_description: >-
              RIC-3 promotes maturation or assembly of C. elegans
              acetylcholine receptors and is needed with UNC-50 and UNC-74 for
              robust L-AChR expression in Xenopus oocytes.
          - id: unc50
            label: UNC-50 ancillary protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UNC-50
                term:
                  id: UniProtKB:Q10045
                  label: Protein unc-50
            role_description: >-
              UNC-50 is a Golgi-membrane ancillary protein that routes
              assembled L-AChRs toward neuromuscular-junction surface
              expression instead of lysosomal degradation.
          - id: unc74
            label: UNC-74 ancillary protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UNC-74
                term:
                  id: UniProtKB:Q9N4L6
                  label: Thioredoxin domain-containing protein
            role_description: >-
              UNC-74 is a predicted ER-membrane TMX3/PDI-family
              oxidoreductase required for efficient expression of functional
              L-AChRs.
        evidence:
          - source_id: PMID:19020092
            statement: >-
              RIC-3, UNC-50 and UNC-74 are ancillary proteins required for
              expression of functional L-AChRs with the five pore subunits.
            supporting_text: >-
              In addition to AChR subunits, genetic screens identified 3
              ancillary proteins, RIC-3, UNC-50, and UNC-74, that are
              absolutely required for the expression of L-AChRs in vivo.
          - source_id: PMID:19899809
            statement: >-
              RIC-3 is an ER-resident family protein that interacts with
              nicotinic acetylcholine receptor subunits during receptor
              maturation.
            supporting_text: >-
              RIC-3 belongs to a conserved family of proteins influencing
              maturation of nicotinic acetylcholine receptors
          - source_id: PMID:17853888
            statement: >-
              C. elegans UNC-50 is a Golgi-localized integral membrane protein
              needed in body-wall muscle to traffic the assembled Lev-AChR to
              the neuromuscular junction and prevent sorting of the receptor
              to lysosomal degradation.
            supporting_text: >-
              In the absence of UNC-50, a subset of AChRs present in
              body-wall muscle are sorted to the lysosomal system and degraded.
          - source_id: PMID:15623505
            statement: >-
              Human TMX3 is an ER-localized PDI-family oxidoreductase with
              thioredoxin-domain and transmembrane features that support the
              inferred TMX3/PDI-family assignment of nematode UNC-74.
            supporting_text: >-
              Here we describe the identification and characterization of a
              novel member of the human PDI family, TMX3
              (thioredoxin-related transmembrane protein 3).
          - source_id: PMID:21486278
            statement: >-
              The cloned H. contortus UNC-74 ortholog has the same
              signal-peptide, thioredoxin-domain and C-terminal membrane
              architecture inferred for nematode UNC-74 expression factors.
            supporting_text: >-
              Hco-UNC-74 contains a predicted signal peptide, a thioredoxin
              domain and a predicted transmembrane region in its C terminal
              part
  connections:
    - source: lachr_expression_factors
      target: lachr_pore
      connection_type: POSITIVELY_REGULATES
      description: >-
        RIC-3, UNC-50 and UNC-74 are required for robust expression of the
        five-subunit levamisole-sensitive receptor.
