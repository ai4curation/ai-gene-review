id: MODULE:nematode_levamisole_sensitive_nachr
title: Nematode levamisole-sensitive nicotinic acetylcholine receptor
description: >-
  Levamisole-sensitive acetylcholine receptors are nematode Cys-loop cation
  channels that mediate excitatory body-wall muscle neurotransmission and are
  selectively activated by the anthelmintic agonist levamisole. In C. elegans,
  the receptor pore contains five distinct subunits: the non-alpha UNC-29 and
  LEV-1 subunits plus the alpha subunits UNC-38, UNC-63 and LEV-8. Functional
  heterologous expression requires three conserved ancillary proteins, RIC-3,
  UNC-50 and UNC-74, that support receptor biogenesis and trafficking before
  the assembled receptor reaches postsynaptic membranes. This first draft is
  grounded in the C. elegans receptor and tracks Brugia malayi, Haemonchus
  contortus, Onchocerca volvulus and Ascaris suum candidates for later
  duplicate-resolution and orthology review.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:19020092
    title: >-
      Eight genes are required for functional reconstitution of the
      Caenorhabditis elegans levamisole-sensitive acetylcholine receptor.
    statement: >-
      Functional Xenopus oocyte reconstitution of the C. elegans L-AChR
      required the five pore subunits UNC-29, LEV-1, UNC-38, UNC-63 and LEV-8
      plus the ancillary proteins RIC-3, UNC-50 and UNC-74.
    supporting_text: >-
      Using Xenopus laevis oocytes, we were able to reconstitute functional
      L-AChRs by coexpressing the 5 distinct receptor subunits and the 3
      ancillary proteins.
  - source_id: PMID:15990870
    title: >-
      Identification and characterization of novel nicotinic
      receptor-associated proteins in Caenorhabditis elegans.
    statement: >-
      Tandem affinity purification of UNC-29-tagged receptor complexes from C.
      elegans recovered all five L-AChR pore subunits, verifying that UNC-29,
      LEV-1, UNC-38, UNC-63 and LEV-8 physically associate in vivo.
    supporting_text: >-
      Multiple peptides of each of the levamisole receptor subunits, UNC-29,
      UNC-38, UNC-63, LEV-8, and LEV-1, were identified in four different
      purifications
  - source_id: file:genes/worm/unc-29/unc-29-ai-review.yaml
    title: C. elegans unc-29 gene review
    statement: >-
      The existing unc-29 review accepts UNC-29 as a non-alpha subunit of the
      heteropentameric L-AChR that contributes to acetylcholine-gated
      monoatomic cation-selective channel activity at postsynaptic membranes.
  - source_id: file:interpro/panther/PTHR18945/PTHR18945-entries.csv
    title: Local PANTHER PTHR18945 member table
    statement: >-
      Reviewed local PTHR18945 records include C. elegans UNC-29, LEV-1,
      UNC-38 and UNC-63 in the broad neurotransmitter-gated ion channel family;
      LEV-8 was resolved separately from UniProt as accession Q93329.
notes: >-
  Boundary. This module models the levamisole-sensitive AChR expression system
  reconstituted by Boulin et al.: the five-subunit C. elegans pore plus the
  RIC-3, UNC-50 and UNC-74 ancillary factors needed for robust receptor
  expression. It deliberately excludes the ACR-16 nicotine-sensitive AChR, the
  ACC/DEG-3/DES-2/MPTL nicotinic-like channels, the avermectin-sensitive GluCl
  chloride channels, monepantel targets, and GABA/glycine/EXP-1/MOD-1-like
  Cys-loop channels that also sit in PANTHER PTHR18945. It also leaves
  synaptic clustering by LEV-10, LEV-9, OIG-4, CRLD-1 and later-acting
  postsynaptic scaffolds for later extension or a separate trafficking module.

  Ortholog resolution. PTHR18945 is much broader than the L-AChR pore. The
  Brugia malayi A0A1P6C5A7, A0A4E9EUJ4 and A0A4E9FKF9 records are plausible
  UNC-29, UNC-63 and UNC-38 representatives, while H. contortus and A. suum
  each have multiple UNC-29/UNC-38/UNC-63-like entries or cloned paralogs that
  must be collapsed by sequence, gene model and literature before choosing
  review folders. O. volvulus P54247 is a reviewed non-alpha acetylcholine
  receptor candidate, but the current O. volvulus PTHR18945 slice is also
  crowded with ACR-16-like, glutamate-gated and GABA-like channel records.
