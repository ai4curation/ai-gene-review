evidence:
- source_id: Reactome:R-HSA-71262
  title: Carnitine synthesis
  statement: Reactome pathway cache for the four-step human carnitine synthesis route.
- source_id: PMID:41075794
  title: SLC25A45 is required for mitochondrial uptake of methylated amino acids and de novo carnitine biosynthesis.
  statement: >-
    SLC25A45 imports trimethyllysine into mitochondria and is required for de novo
    carnitine biosynthesis in BBOX1-expressing cells.
  supporting_text: >-
    Together, these results show that SLC25A45 is required for the de novo biosynthesis
    of carnitine in BBOX1-expressing cells.
- source_id: PMID:38615009
  title: One substrate many enzymes virtual screening uncovers missing genes of carnitine biosynthesis in human and mouse.
  statement: >-
    Human SHMT1 and SHMT2 can catalyze the hydroxytrimethyllysine aldolase step,
    partially compensating for loss of a dedicated HTMLA enzyme.
  supporting_text: >-
    Applying this procedure, we identify the mammalian gene encoding hydroxytrimethyllysine
    aldolase (HTMLA), the second enzyme of carnitine biosynthesis.
notes: >-
  The production GO-CAM gomodel:69169b7400000023 covers the SLC25A45, TMLHE, and
  BBOX1 activities but omits SHMT1/SHMT2 and ALDH9A1. This module keeps those
  middle cytosolic steps as pathway context without editing their gene reviews:
  SHMT1 and SHMT2 already record GO:0120567 as a low-efficiency non-core activity,
  and ALDH9A1 belongs to a different unreviewed PANTHER family outside this PTHR10696
  content PR.
