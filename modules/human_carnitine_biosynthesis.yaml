id: MODULE:human_carnitine_biosynthesis
title: Human endogenous L-carnitine biosynthesis from trimethyllysine
description: >-
  Humans synthesize L-carnitine from trimethyllysine in a compartmentalized pathway.
  SLC25A45 imports trimethyllysine into the mitochondrial matrix, where TMLHE
  hydroxylates it to 3-hydroxy-N-trimethyllysine. Downstream aldolase activity is
  supplied in primates by the inefficient hydroxytrimethyllysine aldolase activities
  of SHMT1 and SHMT2; ALDH9A1 oxidizes the resulting aldehyde to gamma-butyrobetaine;
  and cytosolic BBOX1 hydroxylates gamma-butyrobetaine to L-carnitine.
status: DRAFT
scope: CONCRETE
