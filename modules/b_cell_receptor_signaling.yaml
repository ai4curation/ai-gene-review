references:
- id: PMID:19827951
  title: B cell signaling and fate decision.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract; no claim that full text was inspected.
  findings:
  - statement: Antigen-triggered and antigen-independent developmental signaling require distinct contexts.
      The module will cover proximal antigen-triggered signaling; tonic survival and downstream cell-fate
      programs are interfaces.
    supporting_text: also control a series of antigen-independent checkpoints during B cell development.
  full_text_unavailable: true
- id: PMID:24167721
  title: 'B lymphocyte antigen receptor signaling: initiation, amplification, and regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected; direct edges require the cited target-specific primaries, not
      only this synthesis.
  findings:
  - statement: BLNK is a phosphotyrosine scaffold connecting kinase activity to effector recruitment.
      LYN also has inhibitory roles and CD19/BCAP contributions vary with stimulus; a rigid linear kinase
      chain is insufficient.
    supporting_text: Phospho-Blnk serves as a scaffold for the assembly of the other components
  - statement: Phosphorylated CD79 ITAMs recruit SYK through tandem SH2 recognition.
    supporting_text: Dual phosphorylation of ITAM tyrosines leads to Syk binding via its tandem SH2 domains
  - statement: Phosphorylated BLNK assembles BTK and PLCG2 effectors.
    supporting_text: Phospho-Blnk serves as a scaffold for the assembly of the other components, including
      Bruton’s tyrosine kinase (Btk), Vav 1, and phospholipase C-gamma 2 (PLCγ2)
