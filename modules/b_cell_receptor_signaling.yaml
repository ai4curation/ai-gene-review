- id: PMID:35981043
  title: Cryo-EM structure of the human IgM B cell receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The primary abstract establishes human resting IgM-BCR stoichiometry; static structure
      alone does not establish a universal antigen-triggering mechanism.
