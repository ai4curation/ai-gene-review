id: MODULE:b_cell_receptor_signaling
title: Proximal B cell receptor signaling
description: Antigen-engaged B-cell receptors use CD79 signaling tails, SYK and BLNK to organize tyrosine
  phosphorylation. Class IA PI3K supplies PIP3 for BTK recruitment, and BTK promotes PLCG2-dependent IP3
  and DAG production. CD19, BCAP and LYN modulate this network according to receptor and cellular context.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:19827951
  title: B cell signaling and fate decision.
  statement: Antigen-triggered and antigen-independent developmental signaling require distinct contexts.
    The module will cover proximal antigen-triggered signaling; tonic survival and downstream cell-fate
    programs are interfaces.
  supporting_text: also control a series of antigen-independent checkpoints during B cell development.
- source_id: PMID:24167721
  title: 'B lymphocyte antigen receptor signaling: initiation, amplification, and regulation.'
  statement: BLNK is a phosphotyrosine scaffold connecting kinase activity to effector recruitment. LYN
    also has inhibitory roles and CD19/BCAP contributions vary with stimulus; a rigid linear kinase chain
    is insufficient.
  supporting_text: Phospho-Blnk serves as a scaffold for the assembly of the other components
- source_id: PMID:23551098
  title: 'Rules of engagement: distinct functions for the four class I PI3K catalytic isoforms in immunity.'
  statement: Class IA p85-associated PI3K and class IB p110-gamma are distinct recruitment architectures.
    Antigen-dependent delta signaling must be separated from alpha/delta compensation in tonic signaling.
  supporting_text: p110γ which is bound by a Gβγ-binding p101 or p84 regulatory subunit is preferentially
    activated by G-protein coupled receptors.
- source_id: PMID:39256626
  title: Towards a unifying model for B-cell receptor triggering.
  statement: No single triggering mechanism is established across BCR isotypes and antigen formats. Engaged
    membrane immunoglobulin is an upstream input, rather than a claimed universal conformational activation
    step.
  supporting_text: there is still no unifying molecular mechanism
- source_id: PMID:38203179
  title: 'B-Cell Receptor Signaling and Beyond: The Role of Igα (CD79a)/Igβ (CD79b) in Normal and Malignant
    B Cells.'
  statement: CD79 chains combine receptor assembly, ITAM signaling and non-ITAM recruitment roles. Mouse
    CD79a Y204 is highlighted for BLNK recruitment; do not transpose residue numbering to human.
  supporting_text: mCD79a Y204 phosphorylation is of particular importance for BLNK recruitment.
- source_id: PMID:39917832
  title: Signaling Activation and Modulation in Extrafollicular B Cell Responses.
  statement: PI3K lipid production recruits PH-domain effectors before the BTK/PLCG2 output step. Downstream
    extrafollicular fate decisions integrate other receptors and are outside the proximal module.
  supporting_text: production results in the recruitment of BTK and AKT to the plasma membrane
- source_id: PMID:23454429
  title: 'B cell receptor accessory molecule CD79α: characterisation and expression analysis in a cartilaginous
    fish, the spiny dogfish (Squalus acanthias).'
  statement: Shark CD79-alpha sequence/expression extends evolutionary context but does not establish
    the full mammalian network or even the same physical receptor assembly.
  supporting_text: If an association of shark Ig and CD79α can be proved
notes: The required implementation specifies reviewed human components of an antigen-triggered proximal
  circuit. Tonic/pre-B survival, immunoglobulin repertoire generation, downstream calcium channels, PKC,
  NF-kappaB, MAPK and transcription are interfaces. Human, mouse and chicken enumerate the evidence sample,
  not a claim that these species exhaust BCR biology. Shark CD79 sequence/expression does not prove conservation
  of this entire circuit. Exact gene selectors prevent broad kinase-family or PI3K-isoform substitution.
  Original PAINT nodes are not repeated as blanket pathway ancestors; their family-specific annotation
  provenance remains in individual reviews. All 22 member reviews are complete. Comparative activity evidence
  distinguishes native assays, heterologous constructs, biochemical chemistry and explicit ortholog inference.
  The CD79B contribution descriptors intentionally omit a standalone molecular-function id because the gene
  cores support contribution to receptor activity, whereas CD79A additionally has specific SYK/BLNK
  recruitment evidence for adaptor activity. This does not deny ITAM signaling by CD79B or equate missing
  ids with missing function; it avoids assigning the isolated-chain receptor function to a descriptor
  that cannot encode contributes_to. Full repository validation passed before this focused follow-up;
  external review is being addressed.
