                        (Interleukin-1 beta-converting enzyme) (ICE) (IL-1 beta-converting enzyme) (p45)
                        [Cleaved into: Caspase-1 subunit p20; Caspase-1 subunit p10]'
                ancestral_nodes:
                  - preferred_term: PAINT node PTN008720308 for CASP1
                    term:
                      id: PANTHER:PTN008720308
                      label: PTN008720308
                    description: Local PAINT IBD node in PTHR47901 with propagated terms 
