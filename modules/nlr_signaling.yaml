notes: >-
  Curated compact signaling-pathway module generated from verified UniProt exemplar accessions and local
  PAINT IBD rows. PTN anchors are included only when the exemplar accession appears in an IBD seed row
  in interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar accessions.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level support. Automatically
  extracted open-question headings were intentionally not retained as knowledge_gap entries because they
  were not manually curated. Machine-generated Falcon citations remain curation support and are not manually
  adjudicated here.
  TAK1 step (2026-10-06): the TAK1-TAB complex (MAP3K7 with TAB1 and TAB2/TAB3) was added as the
  NF-kappaB/MAPK kinase step of the NOD1/NOD2-RIPK2 branch, following the MAP3K7 gene review, the
  module's deep research and the NOD1/NOD2 GO-CAMs (641ce4dc00000050, 641ce4dc00000214). The earlier
  "RIPK2 inflammatory signal relay" annoton sat inside the caspase-1 protease output and implied that
  RIPK2 relays a kinase signal to NF-kappaB. It was removed: RIPK2 is already the NOD adaptor in step
  2, and its kinase activity is dispensable for NOD2 signaling (PMID:29452636). Its PAINT anchors
  remain on the step-2 RIPK2 annoton. The module now branches at the adaptor step: RIPK2 leads to
  TAK1-TAB (NF-kappaB/MAPK), and ASC leads to caspase-1. TAB1/TAB2/TAB3 are active units of a
  GO:0097076 complex participant because none has a gene review here. The IKK complex is modeled in
  MODULE:nfkb_canonical_signaling.
module:
  id: nlr_signaling
  label: NLR signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: nucleotide-binding domain, leucine rich repeat containing receptor signaling 
        pathway
      term:
        id: GO:0035872
        label: nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway
      description: Nucleotide-binding leucine-rich-repeat receptors detect intracellular 
        perturbations and assemble RIPK-, ASC-, or caspase-containing signaling platforms for 
        inflammatory and antimicrobial responses.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: nlr sensor activation
      node:
        id: nlr_sensor_activation
        label: NLR sensor activation
        module_type: REGULATORY_STEP
        description: NOD2 and NLRP3 exemplify cytosolic NLR sensors for innate immune signaling.
        annotons:
          - id: nod2_nod2_sensor
            label: NOD2 sensor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NOD2 sensor family/ortholog group
                term:
                  id: PANTHER:PTHR24106
                  label: NACHT, LRR AND CARD DOMAINS-CONTAINING
                representative_members:
                  - preferred_term: NOD2
                    term:
                      id: UniProtKB:Q9HC29
                      label: Nucleotide-binding oligomerization domain-containing protein 2 (Caspase
                        recruitment domain-containing protein 15) (Inflammatory bowel disease 
                        protein 1)
                ancestral_nodes:
                  - preferred_term: PAINT node PTN004670420 for NOD2
                    term:
                      id: PANTHER:PTN004670420
                      label: PTN004670420
                    description: Local PAINT IBD node in PTHR24106 with propagated terms 
                      C:GO:0005829, F:GO:0038187, P:GO:0002221, P:GO:0032495, P:GO:0035556, 
                      P:GO:0042742, P:GO:0043123; PAINT date 20250903.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN004670420 in PTHR24106.
                evidence:
                  - source_id: file:interpro/panther/PTHR24106/PTHR24106-deep-research-falcon.md
                    title: PTHR24106 Falcon family review
                    statement: >-
                      Falcon family-level GO review: The PTHR24106 entry (NOD-like receptor family) currently
                      has no InterPro2GO terms mapped. Based on the comprehensive evidence gathered, this
                      absence is scientifically appropriate and should be maintained. Use this PANTHER
                      family as context with representative members/PTN anchors, not as blanket pathway
                      propagation.
            role_description: Curated exemplar for the nod2 sensor role in nucleotide-binding 
              domain, leucine rich repeat containing receptor signaling pathway.
          - id: nlrp3_nlrp3_inflammasome_sensor
            label: NLRP3 inflammasome sensor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NLRP3
                term:
                  id: UniProtKB:Q96P20
                  label: NACHT, LRR and PYD domains-containing protein 3 (EC 3.6.4.-) 
                    (Angiotensin/vasopressin receptor AII/AVP-like) (Caterpiller protein 1.1) 
                    (CLR1.1) (Cold-induced autoinflammatory syndrome 1 protein) (Cryopyrin) 
                    (PYRIN-containing APAF1-like protein 1)
            role_description: Curated exemplar for the nlrp3 inflammasome sensor role in 
              nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway.
    - order: 2
      role: nlr adaptor assembly
      node:
        id: nlr_adaptor_assembly
        label: NLR adaptor assembly
        module_type: REGULATORY_STEP
        description: >-
          RIPK2 and ASC/PYCARD link activated NLRs to downstream signaling complexes. On the NOD1/NOD2
          branch, RIPK2 is ubiquitinated by XIAP (K63-linked) and LUBAC (linear chains), forming the
          scaffold that recruits TAK1-TAB and IKK. On the NLRP3 branch, ASC nucleates caspase-1
          activation. XIAP and LUBAC are not modeled as parts here.
        annotons:
          - id: ripk2_ripk2_kinase_adaptor
            label: RIPK2 kinase/adaptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RIPK2 kinase/adaptor family/ortholog group
                term:
                  id: PANTHER:PTHR44329
                  label: SERINE/THREONINE-PROTEIN KINASE TNNI3K-RELATED
                representative_members:
                  - preferred_term: RIPK2
                    term:
                      id: UniProtKB:O43353
                      label: Receptor-interacting serine/threonine-protein kinase 2 (EC 2.7.11.1) 
                        (CARD-containing interleukin-1 beta-converting enzyme-associated kinase) 
                        (CARD-containing IL-1 beta ICE-kinase) (RIP-like-interacting CLARP kinase) 
                        (Receptor-interacting protein 2) (RIP-2) (Tyrosine-protein kinase RIPK2) (EC
                        2.7.10.2)
                ancestral_nodes:
                  - preferred_term: PAINT node PTN001908418 for RIPK2
                    term:
                      id: PANTHER:PTN001908418
                      label: PTN001908418
                    description: Local PAINT IBD node in PTHR44329 with propagated terms 
                      P:GO:0007165; PAINT date 20250904.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001908418 in PTHR44329.
                  - preferred_term: PAINT node PTN002892787 for RIPK2
                    term:
                      id: PANTHER:PTN002892787
                      label: PTN002892787
                    description: Local PAINT IBD node in PTHR44329 with propagated terms 
                      C:GO:0005737; PAINT date 20260530.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002892787 in PTHR44329.
                  - preferred_term: PAINT node PTN002892800 for RIPK2
                    term:
                      id: PANTHER:PTN002892800
                      label: PTN002892800
                    description: Local PAINT IBD node in PTHR44329 with propagated terms 
                      P:GO:0043123, P:GO:0045087; PAINT date 20210604.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002892800 in PTHR44329.
                evidence:
                  - source_id: file:interpro/panther/PTHR44329/PTHR44329-deep-research-falcon.md
                    title: PTHR44329 Falcon family review
                    statement: >-
                      Falcon family-level GO review: ACCEPT - The current absence of InterPro2GO terms
                      is correct Use this PANTHER family as context with representative members/PTN anchors,
                      not as blanket pathway propagation.
            role_description: >-
              CARD adaptor recruited by NOD1/NOD2. For NF-kappaB/MAPK output its essential role is
              as a ubiquitinated scaffold that recruits the TAK1-TAB complex. RIPK2 catalytic activity
              is dispensable for NOD2 signaling in the cited studies, so no kinase function is
              asserted for RIPK2 in this module.
            evidence:
              - source_id: PMID:29452636
                statement: RIPK2 kinase activity is dispensable for NOD2 signaling; XIAP binding and
                  ubiquitination of RIPK2 are required.
                supporting_text: We also establish that the kinase activity of RIP2 is dispensable for
                  NOD2 signaling.
              - source_id: PMID:18079694
                statement: RIPK2 K63 polyubiquitination does not require its kinase activity and is
                  essential for IKK activation.
                supporting_text: RICK polyubiquitination did not require the kinase activity of RICK
          - id: pycard_asc_adaptor
            label: ASC adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PYCARD
                term:
                  id: UniProtKB:Q9ULZ3
                  label: Apoptosis-associated speck-like protein containing a CARD (hASC) (Caspase 
                    recruitment domain-containing protein 5) (PYD and CARD domain-containing 
                    protein) (Target of methylation-induced silencing 1)
            role_description: Curated exemplar for the asc adaptor role in nucleotide-binding 
              domain, leucine rich repeat containing receptor signaling pathway.
    - order: 3
      role: tak1 kinase activation
      node:
        id: tak1_tab_kinase_activation
        label: TAK1-TAB kinase complex activation (NOD-RIPK2 branch)
        module_type: REGULATORY_STEP
        description: >-
          On the NOD1/NOD2 branch, RIPK2 carries K63-linked chains added by XIAP and linear chains
          added by LUBAC. These chains recruit the TAK1-TAB complex (TAK1 with TAB1 and the
          ubiquitin-binding subunits TAB2/TAB3), and TAK1 is activated. TAK1 phosphorylates IKKbeta
          (canonical NF-kappaB) and MAP2Ks (p38/JNK). This is the NF-kappaB/MAPK output of the
          module. RIPK2 acts here as a ubiquitinated scaffold; its own kinase activity is not
          required for this output. The step is not on the NLRP3-ASC-caspase-1 inflammasome branch.
        annotons:
          - id: tak1_complex_ikkbeta_kinase
            label: TAK1-TAB complex IKKbeta kinase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: TAK1-TAB kinase complex
                term:
                  id: GO:0097076
                  label: transforming growth factor beta activated kinase 1 complex
                active_units:
                  - id: tak1_catalytic_subunit
                    label: TAK1 catalytic subunit
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: TAK1/MAP3K7 ortholog group
                        term:
                          id: PANTHER:PTHR46716:SF1
                          label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
                        representative_members:
                          - preferred_term: MAP3K7
                            term:
                              id: UniProtKB:O43318
                              label: Mitogen-activated protein kinase kinase kinase 7
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN000723805 for TAK1
                            term:
                              id: PANTHER:PTN000723805
                              label: PTN000723805
                            description: Local PAINT IBD node in PTHR46716 (Bilateria root) seeded by
                              UniProtKB:O43318 with propagated terms F:GO:0004709, P:GO:0007254,
                              P:GO:0043123.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000723805 in PTHR46716.
                        evidence:
                          - source_id: file:interpro/panther/PTHR46716/PTHR46716-review.yaml
                            title: PTHR46716 family review
                            statement: Family review of the bilaterian TAK1 ortholog group used to
                              orient the family-level grounding of the catalytic subunit.
                    role: catalytic serine/threonine kinase subunit
                  - id: tab1_activating_subunit
                    label: TAB1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAB1
                        term:
                          id: UniProtKB:Q15750
                          label: TGF-beta-activated kinase 1 and MAP3K7-binding protein 1
                    role: constitutive TAK1-binding subunit that promotes TAK1 autophosphorylation
                  - id: tab2_tab3_ubiquitin_receptor
                    label: TAB2/TAB3 ubiquitin receptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAB2
                        term:
                          id: UniProtKB:Q9NYJ8
                          label: TGF-beta-activated kinase 1 and MAP3K7-binding protein 2
                      description: TAB2 and its paralog TAB3 (UniProtKB:Q8N5C8) act redundantly in
                        this position.
                    role: Npl4 zinc finger receptor for K63-linked polyubiquitin that couples the
                      ubiquitin scaffold to TAK1 activation
                    function:
                      preferred_term: K63-linked polyubiquitin modification-dependent protein binding
                      term:
                        id: GO:0070530
                        label: K63-linked polyubiquitin modification-dependent protein binding
                    evidence:
                      - source_id: PMID:15327770
                        statement: TAB2 and TAB3 bind K63-linked chains through their zinc finger.
                        supporting_text: TAB2 and TAB3 are receptors that bind preferentially to lysine
                          63-linked polyubiquitin chains through a highly conserved zinc finger (ZnF)
                          domain.
                      - source_id: PMID:14633987
                        statement: TAB2 and TAB3 act redundantly as mediators of TAK1 activation.
                        supporting_text: These results suggest that TAB2 and TAB3 function redundantly
                          as mediators of TAK1 activation in IL-1 and TNF signal transduction.
            function:
              preferred_term: protein serine/threonine kinase activity (IKKbeta activation loop)
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: IKBKB (IKKbeta)
                  term:
                    id: UniProtKB:O14920
                    label: Inhibitor of nuclear factor kappa-B kinase subunit beta
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:641ce4dc00000050
                activity: gomodel:641ce4dc00000050/641ce4dc00000146
                title: NOD2 signaling in response to muramyl dipeptide (MDP) leading to NF-kappa-B and
                  MAPK kinase activation (Human)
              - model: gomodel:641ce4dc00000214
                activity: gomodel:641ce4dc00000214/641ce4dc00000261
                title: NOD1 signaling in response to gamma-D-glutamyl-meso-diaminopimelic acid (iE-DAP)
                  leading to NF-kappa-B and MAP kinase activation (Human)
            role_description: >-
              Ubiquitin-activated TAK1 complex phosphorylates and activates IKKbeta. The IKK
              complex (IKKalpha/IKKbeta/NEMO) is the downstream output, modeled in the canonical
              NF-kappaB module rather than here.
            evidence:
              - source_id: PMID:11460167
                statement: The purified TAK1-TAB1-TAB2 complex phosphorylates and activates IKK.
                supporting_text: We find that the TAK1 kinase complex phosphorylates and activates
                  IKK in a manner that depends on TRAF6 and Ubc13-Uev1A.
              - source_id: PMID:15075345
                statement: TAK1 is required for NOD2-mediated NF-kappaB activation.
                supporting_text: TAK1 interacts with Nod2 and is required for Nod2-mediated NF-kappaB
                  activation.
              - source_id: PMID:18079694
                statement: TAK1 is essential for NOD1 signaling.
                supporting_text: polyubiquitination of RICK was found to mediate the recruitment of TAK1,
                  a kinase that was found to be essential for Nod1-induced signaling.
              - source_id: file:genes/human/MAP3K7/MAP3K7-ai-review.yaml
                title: MAP3K7 gene review
                statement: Core function of MAP3K7 as the ubiquitin-activated IKKbeta kinase (GO:0004674)
                  in the cytosol, as part of the TAK1 complex (GO:0097076).
          - id: tak1_map3k
            label: TAK1 MAP3K for p38/JNK
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TAK1/MAP3K7 ortholog group
                term:
                  id: PANTHER:PTHR46716:SF1
                  label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
                representative_members:
                  - preferred_term: MAP3K7
                    term:
                      id: UniProtKB:O43318
                      label: Mitogen-activated protein kinase kinase kinase 7
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000723805 for TAK1
                    term:
                      id: PANTHER:PTN000723805
                      label: PTN000723805
                    description: Local PAINT IBD node in PTHR46716 (Bilateria root) seeded by
                      UniProtKB:O43318 with propagated terms F:GO:0004709, P:GO:0007254, P:GO:0043123.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000723805 in PTHR46716.
            function:
              preferred_term: MAP kinase kinase kinase activity
              term:
                id: GO:0004709
                label: MAP kinase kinase kinase activity
              targets:
                - preferred_term: MKK3/MKK6 (MAP2K3/MAP2K6) and MKK4/MKK7 (MAP2K4/MAP2K7)
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:641ce4dc00000050
                activity: gomodel:641ce4dc00000050/641ce4dc00000688
                title: NOD2 signaling in response to muramyl dipeptide (MDP) leading to NF-kappa-B and
                  MAPK kinase activation (Human)
              - model: gomodel:641ce4dc00000214
                activity: gomodel:641ce4dc00000214/641ce4dc00000652
                title: NOD1 signaling in response to gamma-D-glutamyl-meso-diaminopimelic acid (iE-DAP)
                  leading to NF-kappa-B and MAP kinase activation (Human)
            role_description: >-
              The same ubiquitin-activated TAK1 phosphorylates MAP2Ks that feed the p38 and JNK
              arms of the NOD inflammatory output.
            evidence:
              - source_id: PMID:11460167
                statement: TAK1 phosphorylation of MKK6 is regulated by K63-linked polyubiquitination.
                supporting_text: the activity of TAK1 to phosphorylate MKK6, which activates the JNK-p38
                  kinase pathway, is directly regulated by K63-linked polyubiquitination
    - order: 4
      role: inflammatory protease output
      node:
        id: inflammatory_protease_output
        label: Inflammatory protease output
        module_type: REGULATORY_STEP
        description: NLR signaling can activate caspase-1 and inflammatory cytokine maturation 
          programs.
        annotons:
          - id: casp1_caspase_1_inflammatory_protease
            label: Caspase-1 inflammatory protease
            participant:
