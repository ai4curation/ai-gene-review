                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN008720308 in PTHR47901.
                  - preferred_term: PAINT node PTN008720309 for CASP1
                    term:
                      id: PANTHER:PTN008720309
                      label: PTN008720309
                    description: Local PAINT IBD node in PTHR47901 with propagated terms 
                      C:GO:0072559, C:GO:0097169; PAINT date 20170228.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN008720309 in PTHR47901.
                  - preferred_term: PAINT node PTN009213768 for CASP1
                    term:
                      id: PANTHER:PTN009213768
                      label: PTN009213768
                    description: Local PAINT IBD node in PTHR47901 with propagated terms 
                      P:GO:0050727; PAINT date 20250522.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN009213768 in PTHR47901.
                evidence:
                  - source_id: file:interpro/panther/PTHR47901/PTHR47901-deep-research-falcon.md
                    title: PTHR47901 Falcon family review
                    statement: >-
                      Falcon family-level GO review: The current state of no InterPro2GO terms for PTHR47901
                      is correct and should be maintained. The absence of mappings accurately reflects
                      the impossibility of assigning any GO term that would be true for all proteins matched
                      by this signature. Use this PANTHER family as context with representative members/PTN
                      anchors, not as blanket pathway propagation.
            role_description: Curated exemplar for the caspase-1 inflammatory protease role in 
              nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway.
  connections:
    - source: nlr_sensor_activation
      target: nlr_adaptor_assembly
      connection_type: CAUSES
      description: The initiating event promotes nlr adaptor assembly.
    - source: nlr_adaptor_assembly
      target: tak1_tab_kinase_activation
      connection_type: CAUSES
      description: >-
        NOD1/NOD2 branch. Polyubiquitinated RIPK2 recruits the TAK1-TAB complex through the
        TAB2/TAB3 ubiquitin receptors, and TAK1 is activated.
      evidence:
        - source_id: PMID:18079694
          statement: RIPK2 K63 polyubiquitination mediates TAK1 recruitment and links TAK1 to IKK.
          supporting_text: Thus, RICK polyubiquitination links TAK1 to IKK complexes, a critical step
            in Nod1/Nod2-mediated NF-kappaB activation.
        - source_id: Reactome:R-HSA-688985
          title: K63 polyubiquitinated RIP2 associates with the TAK1 complex
          statement: Reactome curates recruitment of the TAK1-TAB1-TAB2 complex by K63-polyubiquitinated
            RIPK2.
    - source: nlr_adaptor_assembly
      target: inflammatory_protease_output
      connection_type: CAUSES
      description: >-
        Inflammasome branch. NLRP3 and ASC assembly leads to caspase-1 activation. This branch does
        not pass through TAK1.
