knowledge_gaps:
  - gap_statement: >-
      Does PSEPK PP_5276/Q88CA5 catalyze phosphatidylglycerol-dependent
      cardiolipin synthesis in vivo, and under which conditions relative to
      ClsA and ClsB?
    boundary: >-
      Q88CA5 has two PLD-like domains and a PANTHER ClsC subfamily assignment,
      but its current UniProt record does not assign the specific PE-plus-PG
      reaction. It is retained as a candidate representative, not as a
      biochemically established PSEPK ClsC.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    significance: >-
      Resolves whether PSEPK has the chemically distinct ClsC route in addition
      to the established ClsA and ClsB alternatives.
    resolution: >-
      Identify and coexpress candidate PSEPK YmdB-like accessory proteins with
      Q88CA5, test the combinations with phosphatidylglycerol and
      phosphatidylethanolamine, and compare targeted lipidomics of single and
      combinatorial synthase/accessory-gene deletions across growth phases.
  - gap_statement: >-
      Is PP_0892/Q88PF8 an active ClsB-like cardiolipin synthase despite its
      incomplete catalytic-domain annotation, or a diverged inactive paralog?
    boundary: >-
      PP_0892 has a ClsB-like PANTHER assignment and HKD-like sequence
      features, but current UniProt does not assign a specific reaction. It is
      therefore excluded from the ClsB representative set pending direct
      biochemical support.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    significance: >-
      Prevents propagation of exact cardiolipin synthase activity to a
      potentially divergent PSEPK phospholipase D-family paralog.
    resolution: >-
      Measure PG-dependent cardiolipin formation by purified PP_0892 and test
      complementation and lipid profiles in clsA/clsB-deficient backgrounds.
