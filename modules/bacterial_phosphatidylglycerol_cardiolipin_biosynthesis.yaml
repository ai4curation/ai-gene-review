id: MODULE:bacterial_phosphatidylglycerol_cardiolipin_biosynthesis
title: Bacterial phosphatidylglycerol and cardiolipin biosynthesis
description: >-
  A reusable bacterial membrane-lipid module connecting phosphatidylglycerol
  synthesis from CDP-diacylglycerol to phospholipase-D-family cardiolipin
  synthesis. PgsA forms phosphatidylglycerol phosphate, PgpA removes its
  terminal phosphate to form phosphatidylglycerol, and alternative Cls
  lineages transfer a phosphatidyl group from phosphatidylglycerol or
  phosphatidylethanolamine to phosphatidylglycerol to form cardiolipin.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: RHEA:12593
    title: CDP-diacylglycerol--glycerol-3-phosphate phosphatidyltransferase reaction
    statement: >-
      Rhea 12593 defines phosphatidylglycerol-phosphate formation from
      CDP-diacylglycerol and sn-glycerol 3-phosphate.
  - source_id: RHEA:33751
    title: phosphatidylglycerophosphatase reaction
    statement: >-
      Rhea 33751 defines hydrolysis of phosphatidylglycerol phosphate to
      phosphatidylglycerol and phosphate.
  - source_id: RHEA:31451
    title: phosphatidylglycerol-dependent cardiolipin synthase reaction
    statement: >-
      Rhea 31451 defines transfer between two phosphatidylglycerol molecules
      to form cardiolipin and glycerol.
  - source_id: RHEA:42972
    title: phosphatidylglycerol-phosphatidylethanolamine phosphatidyltransferase reaction
    statement: >-
      Rhea 42972 defines the alternative ClsC reaction that forms cardiolipin
      and ethanolamine from phosphatidylglycerol and phosphatidylethanolamine.
  - source_id: PMID:21895997
    title: >-
      The glycerophospholipid inventory of Pseudomonas putida is conserved
      between strains and enables growth condition-related alterations
    statement: >-
      Lipid profiling directly detected phosphatidylglycerol and cardiolipin in
      KT2440 and reconstructed pgsA, pgpA, cls, and cls-2 in the corresponding
      biosynthetic route.
  - source_id: PMID:22988102
    title: >-
      Discovery of a cardiolipin synthase utilizing phosphatidylethanolamine
      and phosphatidylglycerol as substrates
    statement: >-
      Genetic and biochemical experiments establish a YmdB-ClsC system for
      phosphatidylglycerol-phosphatidylethanolamine cardiolipin synthesis;
      ClsC alone produced little cardiolipin in the tested E. coli system.
  - source_id: file:PSEPK/pgsA/pgsA-uniprot.txt
    title: PSEPK PgsA UniProt record
    statement: >-
      Q88FJ8 is assigned EC 2.7.8.5, RHEA:12593, and the first reaction of
      phosphatidylglycerol biosynthesis from CDP-diacylglycerol.
  - source_id: file:PSEPK/pgpA/pgpA-uniprot.txt
    title: PSEPK PgpA UniProt record
    statement: >-
      Q88QH3 is assigned EC 3.1.3.27, RHEA:33751, and the second reaction of
      phosphatidylglycerol biosynthesis from CDP-diacylglycerol.
  - source_id: file:PSEPK/clsA/clsA-uniprot.txt
    title: PSEPK ClsA UniProt record
    statement: >-
      Reviewed Q88C19 is assigned to the ClsA subfamily and RHEA:31451.
  - source_id: file:PSEPK/clsB/clsB-uniprot.txt
    title: PSEPK ClsB UniProt record
    statement: >-
      Q88HT9 is assigned by HAMAP to the ClsB subfamily and RHEA:31451.
notes: >-
  The root is one connected route with two coherent nested parts rather than
  two unrelated modules. The phosphatidylglycerol part is independently useful
  and can terminate at phosphatidylglycerol, which is both a bulk membrane
  lipid and the substrate for other pathways. The cardiolipin part describes
  the downstream branch when cardiolipin is produced; it does not imply that
  all phosphatidylglycerol is committed to cardiolipin. CDP-diacylglycerol
  synthesis, phosphatidylethanolamine and phosphatidylcholine branches,
  phosphatidylglycerol modification, cardiolipin turnover, and acyl-chain
  remodeling are outside the boundary.
