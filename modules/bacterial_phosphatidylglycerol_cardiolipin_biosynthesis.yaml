id: MODULE:bacterial_phosphatidylglycerol_cardiolipin_biosynthesis
title: Bacterial phosphatidylglycerol and cardiolipin biosynthesis
description: A reusable bacterial membrane-lipid module from CDP-diacylglycerol to phosphatidylglycerol
  and on to phospholipase-D-family cardiolipin. PgsA forms phosphatidylglycerol phosphate,
  PgpA-type phosphatases remove its terminal phosphate to give phosphatidylglycerol, and one
  or more Cls lineages form cardiolipin. ClsA and ClsB transfer a phosphatidyl group between
  two phosphatidylglycerol molecules; ClsC transfers it from phosphatidylethanolamine to phosphatidylglycerol.
  The route is conserved across Proteobacteria and is exemplified here by Escherichia coli
  K-12, where every step is characterized experimentally, and by Pseudomonas putida KT2440.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: RHEA:12593
  title: CDP-diacylglycerol--glycerol-3-phosphate phosphatidyltransferase reaction
  statement: Rhea 12593 defines phosphatidylglycerol-phosphate formation from CDP-diacylglycerol
    and sn-glycerol 3-phosphate.
- source_id: RHEA:33751
  title: phosphatidylglycerophosphatase reaction
  statement: Rhea 33751 defines hydrolysis of phosphatidylglycerol phosphate to phosphatidylglycerol
    and phosphate.
- source_id: RHEA:31451
  title: phosphatidylglycerol-dependent cardiolipin synthase reaction
  statement: Rhea 31451 defines transfer between two phosphatidylglycerol molecules to form
    cardiolipin and glycerol.
- source_id: RHEA:42972
  title: phosphatidylglycerol-phosphatidylethanolamine phosphatidyltransferase reaction
  statement: Rhea 42972 defines the alternative ClsC reaction that forms cardiolipin and ethanolamine
    from phosphatidylglycerol and phosphatidylethanolamine.
- source_id: PMID:3003065
  title: Structure and expression of the gene locus encoding the phosphatidylglycerophosphate
    synthase of Escherichia coli
  statement: Establishes that E. coli pgsA encodes the purified phosphatidylglycerophosphate
    synthase.
- source_id: PMID:21148555
  title: Three phosphatidylglycerol-phosphate phosphatases in the inner membrane of Escherichia
    coli
  statement: PgpA, PgpB and PgpC are redundant inner-membrane PGP phosphatases; the triple
    mutant is inviable and accumulates PGP when depleted.
- source_id: PMID:7918616
  title: The effects of phosphoglycerides on Escherichia coli cardiolipin synthase
  statement: Purified E. coli ClsA converts two phosphatidylglycerol molecules to cardiolipin
    and glycerol.
- source_id: PMID:10634942
  title: A second Escherichia coli protein with CL synthase activity
  statement: The membrane-bound clsB product catalyzes cardiolipin formation.
- source_id: PMID:21895997
  title: The glycerophospholipid inventory of Pseudomonas putida is conserved between strains
    and enables growth condition-related alterations
  statement: Lipid profiling directly detected phosphatidylglycerol and cardiolipin in KT2440
    and reconstructed pgsA, pgpA, cls, and cls-2 in the corresponding biosynthetic route.
- source_id: PMID:22988102
  title: Discovery of a cardiolipin synthase utilizing phosphatidylethanolamine and phosphatidylglycerol
    as substrates
  statement: Deletion of clsA, clsB and clsC abolishes cardiolipin in E. coli; ClsA alone
    acts in logarithmic growth, and a YmdB-ClsC system forms cardiolipin from phosphatidylethanolamine
    and phosphatidylglycerol, with ClsC alone producing little cardiolipin.
- source_id: file:PSEPK/pgsA/pgsA-uniprot.txt
  title: PSEPK PgsA UniProt record
  statement: Q88FJ8 is assigned EC 2.7.8.5, RHEA:12593, and the first reaction of phosphatidylglycerol
    biosynthesis from CDP-diacylglycerol.
- source_id: file:PSEPK/pgpA/pgpA-uniprot.txt
  title: PSEPK PgpA UniProt record
  statement: Q88QH3 is assigned EC 3.1.3.27, RHEA:33751, and the second reaction of phosphatidylglycerol
    biosynthesis from CDP-diacylglycerol.
- source_id: file:PSEPK/clsA/clsA-uniprot.txt
  title: PSEPK ClsA UniProt record
  statement: Reviewed Q88C19 is assigned to the ClsA subfamily and RHEA:31451.
- source_id: file:PSEPK/clsB/clsB-uniprot.txt
  title: PSEPK ClsB UniProt record
  statement: Q88HT9 is assigned by HAMAP to the ClsB subfamily and RHEA:31451.
notes: 'The root is one connected route with two nested parts rather than two unrelated modules.
  The phosphatidylglycerol part is independently useful and can terminate at phosphatidylglycerol,
  a bulk membrane lipid and the substrate for other pathways. The cardiolipin part describes
  the downstream branch; it does not imply that all phosphatidylglycerol is committed to cardiolipin.
  CDP-diacylglycerol synthesis, the phosphatidylethanolamine and phosphatidylcholine branches,
  phosphatidylglycerol modification, cardiolipin turnover and acyl-chain remodeling are outside
  the boundary. Scope and generalization: the module is species-neutral. E. coli K-12 is the
  experimental exemplar for every step and P. putida KT2440 a second, homology-based exemplar.
  The PG-dependent PLD-type cardiolipin synthase also occurs in Firmicutes (B. subtilis ClsA,
  PTHR21248:SF22), but no Firmicute is used as a representative because those genes are not
  yet reviewed here. The eukaryotic CDP-diacylglycerol-dependent cardiolipin synthase (PTHR14269:SF60)
  belongs to the separate cdp_dag_phospholipid_synthesis module. Grounding: each step uses
  the PANTHER subfamily that holds its exemplars, checked against the family reviews. PgsA
  is PTHR14269:SF62, whose PGP synthase activity is scoped to SF62/SF40 with the Streptomyces
  clsA member excepted. PgpA is PTHR36305:SF1, scoped to the PGP phosphatases with the Bacteroides
  inositol-lipid phosphatase BT_1525 excepted. ClsA, ClsB and ClsC are PTHR21248 SF22, SF23
  and SF12. The PANTHER SF22 name (PHOSPHOLIPASE D) is the official label; its members are
  ClsA-type cardiolipin synthases. The route itself is bacteria-wide, but the PgpA grounding
  is proteobacterial: the PTHR36305 review restricts the PGP phosphatase activity to the Pseudomonadota
  PAINT node, so the PgpA node carries its own Pseudomonadota context, and other bacteria
  may use unrelated PGP phosphatases. PgpA is one of three unrelated E. coli PGP phosphatases;
  PgpB (PAP2 family) and PgpC are not modeled as separate variants. E. coli ClsB can also
  make phosphatidylglycerol from phosphatidylethanolamine and glycerol, a PgsA-independent
  side route that is not modeled. The ClsC annoton is grounded to the ClsC subfamily (SF12)
  with E. coli ClsC as its only representative. The PTHR21248 review leaves GO:0090483 UNRESOLVED
  for SF12 as a whole because the other members are uncharacterized, so any family-function
  coverage warning for this annoton reflects that truthful gap. P. putida PP_5276 (SF12) is
  a candidate third KT2440 synthase, recorded under knowledge gaps.'
