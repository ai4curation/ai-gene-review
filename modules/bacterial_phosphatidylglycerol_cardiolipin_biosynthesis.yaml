knowledge_gaps:
- gap_statement: Does P. putida PP_5276 (Q88CA5), a ClsC-subfamily protein, synthesize cardiolipin
    in vivo, and does it use phosphatidylethanolamine or phosphatidylglycerol as the phosphatidyl
    donor?
  boundary: Q88CA5 is in PANTHER PTHR21248:SF12 and keeps both PLD HKD catalytic motifs, so
    its gene review accepts phosphatidyltransferase activity and cardiolipin biosynthesis.
    The donor chemistry and any YmdB-like partner are untested, so it is not a representative
    of the GO:0090483 ClsC annoton.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Resolves whether KT2440 has the chemically distinct ClsC route in addition
    to ClsA and ClsB.
  resolution: Coexpress Q88CA5 with candidate YmdB-like partners, assay with PG and PE, and
    compare targeted lipidomics of single and combined synthase deletions across growth phases.
  provenance:
  - reference_id: file:PSEPK/PP_5276/PP_5276-bioinformatics/RESULTS.md
    supporting_text: They do not show which phosphatidyl donor (PG or PE) the enzyme uses,
      or whether it needs a YmdB-like partner.
    reference_section_type: RESULTS
- gap_statement: Is P. putida PP_0892 (Q88PF8) an active ClsB-like cardiolipin synthase or
    a diverged paralog?
  boundary: PP_0892 is in PANTHER PTHR21248:SF23 with ClsB and keeps two HxK(x4)D motifs in
    its sequence, although PROSITE scores only one PLD domain and UniProt assigns no reaction.
    It is not used as a ClsB representative.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Prevents propagation of exact cardiolipin synthase activity to a possibly
    divergent PLD-family paralog.
  resolution: Measure PG-dependent cardiolipin formation by purified PP_0892 and test complementation
    and lipid profiles in clsA/clsB-deficient backgrounds.
  provenance:
  - reference_id: file:PSEPK/PP_0892/PP_0892-notes.md
    supporting_text: The exact cardiolipin synthase annotation is entirely computational.
    reference_section_type: OTHER
