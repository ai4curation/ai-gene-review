id: MODULE:dmel_cleavage_polyadenylation
title: mRNA 3' end cleavage and polyadenylation machinery in Drosophila melanogaster
description: >-
  Most eukaryotic mRNAs acquire their 3' end by endonucleolytic cleavage of the pre-mRNA followed
  by addition of a poly(A) tail. The cleavage and polyadenylation specificity factor (CPSF)
  recognizes the AAUAAA polyadenylation signal through Cpsf160, Wdr33 and Clp (CPSF30), and
  Fip1 recruits poly(A) polymerase. The cleavage stimulation factor (CstF; CstF50, CstF64
  and Su(f), the CstF77 homolog) binds GU-rich sequences downstream of the cleavage site.
  The core cleavage complex of Cpsf73, Cpsf100 and the scaffold Symplekin (Sym) carries out
  cleavage, with Cpsf73 as the endonuclease. Cpsf73, Cpsf100 and Sym are shared with the histone
  pre-mRNA processing machinery.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000618
  title: 'FlyBase gene group PF: Polyadenylation factors'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as polyadenylation factors (PF);
    this module models that group.
- source_id: FB:FBgg0000621
  title: 'FlyBase gene group CCC: Core cleavage complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as core cleavage complex (CCC);
    this module models that group.
- source_id: GO:0005847
  title: mRNA cleavage and polyadenylation specificity factor complex
  statement: >-
    GO term grounding the module as mRNA cleavage and polyadenylation specificity factor complex.
notes: >-
  Boundary. FlyBase groups the polyadenylation factors (PF: CPSF signal recognition subunits
  plus CstF) separately from the core cleavage complex (CCC); this module splits PF into its
  CPSF and CstF subcomplexes. Poly(A) polymerase, the CFIm and CFIIm factors and poly(A)-binding
  proteins have no FlyBase group in this set and are not added. The histone pre-mRNA processing
  machinery that reuses the core cleavage complex is in dmel_histone_mrna_3prime_processing.
  FlyBase groups realized by this module: PF (FBgg0000618), CCC (FBgg0000621). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cleavage_polyadenylation.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
