  connections:
    - source: hr_upstream_signalling
      target: short_range_resection
      connection_type: POSITIVELY_REGULATES
      description: >-
        BRCA1-CtIP displacement of 53BP1-RIF1 licenses resection; ATM and CDK
        phosphorylation of CtIP activates the MRN-CtIP nuclease.
    - source: short_range_resection
      target: long_range_resection
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: DNA end intermediates, not CoA metabolites.
      description: >-
        MRN-CtIP clipping creates the entry point for EXO1 and BLM-DNA2 (MRE11
        exonuclease directly provides input for EXO1 in gomodel:65a1f4f800000855).
    - source: long_range_resection
      target: rpa_coating
      connection_type: PROVIDES_INPUT_FOR
      description: Resection exposes the 3' single-stranded tails that RPA binds.
    - source: rpa_coating
      target: rad51_loading
      connection_type: PROVIDES_INPUT_FOR
      description: Mediators load RAD51 onto RPA-coated ssDNA and displace RPA.
    - source: rad51_loading
      target: strand_invasion
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: DNA-protein intermediates, not CoA metabolites.
      description: The RAD51-ssDNA presynaptic filament performs homology search and invasion.
    - source: strand_invasion
      target: d_loop_extension
      connection_type: PROVIDES_INPUT_FOR
      description: The invading 3' end in the D-loop is the primer for repair synthesis.
    - source: d_loop_extension
      target: junction_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: DNA joint-molecule intermediates, not CoA metabolites.
      description: Extension and second-end capture generate the double Holliday junction processed in the last step.
knowledge_gaps:
  - gap_statement: >-
      Which polymerase extends the invading strand in human DSB repair is not
      settled: pol delta is required in yeast HR and BIR, pol eta initiates D-loop
      synthesis with PALB2 and BRCA2 in vitro and at blocked forks, and the relative
      contribution of each (and of other polymerases) at two-ended DSBs in human
      cells is not known.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      The molecular mechanism of the RAD51 paralog complexes is unclear: how BCDX2
      promotes RAD51 nucleation (filament capping, remodelling or RPA displacement),
      and whether CX3 acts on RAD51 filaments, on Holliday junctions, or both, in
      human cells.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      Whether CtIP has intrinsic nuclease activity that contributes to resection in
      human cells, or acts only as the phosphorylation-dependent co-factor of the
      MRE11 endonuclease, remains debated.
    gap_kind:
      - BIOLOGY
