id: MODULE:homologous_recombination_dsb_repair
title: Homologous recombination repair of DNA double-strand breaks — MRN-CtIP and EXO1/BLM-DNA2 end resection, RPA coating, BRCA1-PALB2-BRCA2 and RAD51-paralog loading of RAD51, strand invasion with RAD54, D-loop extension, and BTR dissolution versus SLX4-MUS81/GEN1 resolution; MRE11/RAD50/NBN/RBBP8/EXO1/BLM/DNA2/RPA/BRCA1/PALB2/BRCA2/RAD51B/RAD51C/RAD51D/XRCC2/XRCC3/RAD51/RAD54L/RAD54B
description: >-
  Homologous recombination (HR) repairs a DNA double-strand break (DSB) by copying
  the missing information from an intact homologous duplex, normally the sister
  chromatid, and is therefore restricted to the S and G2 phases of the cell cycle.
  Once the upstream ATM signalling cascade has marked the break and BRCA1 has
  displaced 53BP1-RIF1, the DNA ends are resected to expose 3' single-stranded
  tails. Resection begins with short-range processing by the MRE11-RAD50-NBN (MRN)
  complex, whose MRE11 endonuclease, stimulated by phosphorylated CtIP (RBBP8),
  nicks the 5'-terminated strand at a distance from the end and MRE11 3'-5'
  exonuclease then degrades back toward the break. Long-range resection extends the
  tail over kilobases through either of two machineries: the 5'-3' exonuclease
  EXO1, or the RecQ helicase BLM (or WRN) unwinding the duplex while the DNA2
  nuclease degrades the 5' strand. The heterotrimeric single-stranded DNA binding
  protein RPA coats the exposed tails, removing secondary structure and protecting
  them. BRCA1 binds PALB2, which in turn binds BRCA2; BRCA2 delivers RAD51 to the
  RPA-coated DNA and stabilises nascent RAD51 filaments, and the RAD51 paralog
  complexes BCDX2 (RAD51B-RAD51C-RAD51D-XRCC2) and CX3 (RAD51C-XRCC3) assist
  RAD51 nucleation and filament stability. The RAD51-ssDNA presynaptic filament
  searches for homology and invades the donor duplex, forming a displacement loop
  (D-loop); the Swi2/Snf2-family translocases RAD54 (RAD54L) and RAD54B promote
  homologous pairing and remodel the D-loop. The invading 3' end is extended by DNA
  polymerase delta, with polymerase eta able to initiate synthesis on D-loops. The
  D-loop can then be resolved by synthesis-dependent strand annealing, by
  break-induced replication, or by second-end capture to form a double Holliday
  junction. Double Holliday junctions are either dissolved into non-crossover
  products by the BLM-TOP3A-RMI1-RMI2 (BTR) dissolvasome, or cleaved by the
  structure-specific endonucleases SLX1-SLX4, MUS81-EME1 and GEN1, which can give
  crossovers.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000202
    title: homologous recombination pathway of double-strand break repair
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its diagram. The
      diagram draws Brca1 associated with the MRN complex and with Rbbp8 (CtIP), the
      resection components MRN, Rbbp8, Blm, Exo1 and Dna2, the RPA complex coating
      single-stranded DNA, Rad51 associated with the "Rad51 paralogs/mediators" box,
      and Rad54b promoting D-loop formation and DNA synthesis; the ATM signalling
      pathway (PW:0001361) is the upstream diagram link. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000202.yaml).
  - source_id: GO:0000724
    title: double-strand break repair via homologous recombination
    statement: >-
      Mapped to PW:0000202 (skos:relatedMatch, from the PW definition cross-reference)
      in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml; used as the module's
      process concept.
  - source_id: gomodel:65a1f4f800000855
    title: Initiation of double-strand break repair via homologous recombination by the MRN complex (MRE11-RAD50-NBN) (Human).
    statement: >-
      The project's best-overlap GO-CAM for PW:0000202 (cached under
      gocams/65a1f4f800000855/). It models RAD50 ATP hydrolysis directly positively
      regulating MRE11 DNA endonuclease and 3'-5' exonuclease activities, and MRE11
      3'-5' exonuclease activity providing input for EXO1 5'-3' DNA exonuclease
      activity; the resection part of this module is grounded in it. Its ATM and NBN
      activation nodes belong to modules/atm_dsb_signaling.yaml.
  - source_id: PMID:21325134
    title: BLM-DNA2-RPA-MRN and EXO1-BLM-RPA-MRN constitute two DNA end resection machineries for human DNA break repair.
    statement: Long-range resection runs through two reconstituted machineries, which this module treats as a variant set.
    supporting_text: "Resection occurs via two routes. In one, BLM and DNA2 physically and specifically interact to resect DNA in a process that is ATP-dependent and requires BLM helicase and DNA2 nuclease functions."
  - source_id: PMID:20729832
    title: Purified human BRCA2 stimulates RAD51-mediated recombination.
    statement: BRCA2 is the mediator that loads RAD51 onto RPA-coated ssDNA.
    supporting_text: "BRCA2 acts by targeting RAD51 to ssDNA over double-stranded DNA, enabling RAD51 to displace replication protein-A (RPA) from ssDNA and stabilizing RAD51-ssDNA filaments by blocking ATP hydrolysis."
  - source_id: PMID:14685245
    title: The Bloom's syndrome helicase suppresses crossing over during homologous recombination.
    statement: Double Holliday junctions are processed either by BLM-TOP3A dissolution or by classical resolution.
    supporting_text: "The mechanism, which we term double-junction dissolution, is distinct from classical Holliday junction resolution and prevents exchange of flanking sequences."
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000202 through the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier related_module_only;
  related modules atm_dsb_signaling and bacterial_recbcd_end_resection). RGD curates
  16 human genes to PW:0000202: BLM BRCA1 BRCA2 DNA2 EXO1 MRE11 NBN RAD50 RAD51
  RAD51B RAD51C RAD51D RAD54B RBBP8 XRCC2 XRCC3. All sixteen are modelled as
  participants. Fifteen gene products not on the RGD list are added because the
  RGD diagram or description names their role but the gene list omits them: the
  RPA heterotrimer (RPA1, RPA2, RPA3; drawn as the "Rpa complex"), PALB2 (named in
  the RGD text as linking BRCA1 and BRCA2, "not shown"), WRN (second RecQ partner of
  DNA2), RAD54L (the principal RAD54 paralog; RGD lists only RAD54B), the D-loop
  polymerases (POLD1 and POLD3 of pol delta, and POLH; RGD says only that Rad54b
  "promotes DNA synthesis"), and the double Holliday junction processing enzymes
  (TOP3A, RMI1, RMI2, SLX4, SLX1A, MUS81, GEN1; RGD says the HR sub-types are
  "details not shown"). EME1 and POLD2 are named in prose as partners only.
  Molecular functions were taken from each protein's experimental GO annotations in
  QuickGO (November 2026) and, where a gene review exists (BLM, BRCA1, BRCA2, RAD51,
  RAD51B, RAD51C, RAD51D, XRCC2, XRCC3, PALB2, SLX4, POLD2), checked against its core
  functions.

  Boundary decisions. (1) Upstream signalling is not re-modelled. Part 1 is a
  module_ref to atm_dsb_signaling#brca1_a_arm, the BRCA1-A arm of the
  pathway-choice node of the ATM module (PW:0001361, which RGD links from the HR
  diagram and which is mentioned here but not listed as an evidence source). The
  MRN complex appears in both modules in different roles: as the ATM activator
  (GO:0043539) in atm_dsb_signaling and as the resection nuclease here. RBBP8
  (CtIP) was excluded from the ATM module as "the first step of the HR reaction"
  and is a participant here, so the two modules are consistent. The ATM module's
  notes still say that no human HR or NHEJ module exists; that sentence is now out
  of date. The part is optional because resection and RAD51 loading proceed
  without the reader competition when 53BP1 is absent. (2) Long-range resection is
  a ROUTE variant set (EXO1 versus BLM/WRN-DNA2), ONE_OR_MORE, following the
  reconstitution in PMID:21325134. (3) RPA is a participant, not merely a
  substrate-binding bystander: it enforces resection polarity, is required for BLM
  unwinding and is a cofactor of dissolution (PMID:23543748). (4) Mediators. BRCA1
  is given an annoton without a molecular function: its experimental MF rows
  (ubiquitin protein ligase, DNA binding, phosphoprotein binding) belong to other
  roles, and no GO MF fits its PALB2-recruiting role. BARD1 is not modelled here;
  it is in the BRCA1-A complex of the referenced ATM node. BRCA2 carries
  GO:0140619 DNA strand exchange activator activity, the core function of the BRCA2
  gene review, although the cached GO-CAMs (gomodel:69a0c46f00002570,
  gomodel:69a0c46f00002608) type the same activity as protein-macromolecule adaptor
  activity. (5) RAD51 paralogs are modelled as the two in vivo complexes
  (PMID:11751635): BCDX2 with GO:0140619 (mediator activity shown for RAD51B-RAD51C,
  PMID:11751636) and CX3 with four-way junction DNA binding (contributes_to rows in
  GOA; PMID:20207730, PMID:14716019). The RAD51B review proposes a new "DNA
  recombinase loader activity" term that would fit BCDX2 better if created. Both are
  placed in the RAD51-loading part; CX3's later role in junction processing is in
  its role_description rather than as a separate part. (6) RAD54L and RAD54B are both
  annotons in the strand-invasion part, with GO:0008094 as in the GO-CAMs
  (gomodel:680ad14200006156, gomodel:680ad14200007322); RAD54B also has an IDA row
  for DNA translocase activity. (7) The D-loop polymerase is a REALIZER variant set
  (pol delta, pol eta). PCNA and RFC, which load pol delta, are context. (8) Double
  Holliday junction processing is a ROUTE variant set (BTR dissolution versus
  SLX1-SLX4-MUS81-EME1 and GEN1 resolution). Synthesis-dependent strand annealing
  (D-loop disruption by helicases such as RTEL1 and BLM, then annealing) and
  break-induced replication are named in the description but not modelled as
  separate parts; single-strand annealing (RAD52) is a distinct pathway and is
  excluded, as are meiotic recombination (SPO11, DMC1) and the replication-fork
  protection functions of BRCA1/BRCA2/RAD51. (9) No substrate is modelled as a
  participant; every annoton is an enzyme, a DNA-binding scaffold or a mediator, so
  the substrate-versus-participant comparator check is not triggered. (10) The seed's
  best GO-CAM, gomodel:65a1f4f800000855 (MRN initiation of HR), is genuinely on
  topic and is linked; its ATM and NBN adaptor nodes belong to the ATM module.
  modules/bacterial_recbcd_end_resection.yaml is the bacterial analogue of the
  resection steps and is not referenced.

  GO-CAM and GOA observations for upstream review. In gomodel:65a1f4f800000855 (a
  DSB repair model) the EXO1 activity is annotated to GO:0110025 DNA strand
  resection involved in replication fork processing, and the MRE11 and RBBP8
  activities of gomodel:65a1f4f800001380 use the same fork term; GO:0000729 DNA
  double-strand break processing looks like the intended process. In
  gomodel:613aae0000001005 a RAD51 single-stranded DNA binding activity is located in
  "presynaptic intermediate filament cytoskeleton", which looks like a mis-picked
  cellular component. GO:0000730 DNA recombinase assembly is part_of
  double-strand break repair via synthesis-dependent strand annealing in GO, which
  is narrower than its use for RAD51 loading in all HR sub-pathways here. No human
  gene product is annotated to GO:0043150 DNA synthesis involved in double-strand
  break repair via homologous recombination in QuickGO. RMI1 and RMI2 have no
  experimental molecular function rows. PANTHER family ids and PTNs are deliberately
  not asserted.
module:
  id: homologous_recombination_dsb_repair
  label: Homologous recombination repair of DNA double-strand breaks
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: double-strand break repair via homologous recombination
      term:
        id: GO:0000724
        label: double-strand break repair via homologous recombination
      description: >-
        The GO process mapped to PW:0000202. The module covers mitotic HR from end
        resection to junction processing; meiotic recombination is excluded.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: site of double-strand break
        term:
          id: GO:0035861
          label: site of double-strand break
  parts:
    - order: 1
      role: upstream DSB signalling and BRCA1-dependent commitment to resection
      optional: true
      node:
        id: hr_upstream_signalling
        label: ATM signalling and BRCA1 displacement of 53BP1-RIF1 (by reference)
        description: >-
          Included by reference to the HR-favouring BRCA1-A arm of the ATM DSB
          signalling module, whose upstream parts model MRN sensing, ATM activation,
          gammaH2AX-MDC1 amplification and the RNF8/RNF168 ubiquitin cascade. Marked
          optional because the reaction steps below can proceed without the reader
          competition when 53BP1 is absent, and because ATR and DNA-PK partly
          substitute for ATM.
        module_ref: atm_dsb_signaling#brca1_a_arm
        evidence:
          - source_id: PMID:17965729
            statement: CtIP-dependent resection is restricted to S and G2 and is needed for RPA loading and HR.
            supporting_text: "Moreover, we reveal that CtIP is required for DSB resection, and thereby for recruitment of replication protein A (RPA) and the protein kinase ATR to DSBs, and for the ensuing ATR activation."
    - order: 2
      role: short-range end resection by MRN-CtIP
      node:
        id: short_range_resection
        label: MRN-CtIP short-range resection (MRE11 endonuclease and 3'-5' exonuclease)
        module_type: REACTION
        description: >-
          Phosphorylated CtIP stimulates the MRE11 endonuclease within MRN to nick the
          5'-terminated strand internally; MRE11 3'-5' exonuclease then degrades back
          toward the end, removing protein-blocked ends and creating the entry site
          for long-range resection.
        concepts:
          - preferred_term: DNA double-strand break processing
            term:
              id: GO:0000729
              label: DNA double-strand break processing
        annotons:
          - id: mrn_resection_nuclease
            label: MRN complex DNA endonuclease activity at DSB ends
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: MRE11-RAD50-NBN (MRN) complex
                term:
                  id: GO:0030870
                  label: Mre11 complex
                active_units:
                  - id: resection_mre11
                    label: MRE11 nuclease subunit
                    role: Endonuclease and 3'-5' exonuclease that initiates resection.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MRE11
                        term:
                          id: UniProtKB:P49959
                          label: Double-strand break repair protein MRE11
                    function:
                      preferred_term: DNA endonuclease activity
                      term:
                        id: GO:0004520
                        label: DNA endonuclease activity
                  - id: resection_rad50
                    label: RAD50 ATPase subunit
                    role: ATP hydrolysis drives the conformational change that licenses MRE11 nuclease activity.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RAD50
                        term:
                          id: UniProtKB:Q92878
                          label: DNA repair protein RAD50
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: resection_nbn
                    label: NBN subunit
                    role: Required for MRN endonucleolytic processing of protein-blocked ends and for CtIP binding.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NBN
                        term:
                          id: UniProtKB:O60934
                          label: Nibrin
                    function:
                      preferred_term: chromatin-protein adaptor activity
                      term:
                        id: GO:0140463
                        label: chromatin-protein adaptor activity
            function:
              preferred_term: DNA endonuclease activity
              term:
                id: GO:0004520
                label: DNA endonuclease activity
            processes:
              - preferred_term: DNA double-strand break processing
                term:
                  id: GO:0000729
                  label: DNA double-strand break processing
            locations:
              - preferred_term: site of double-strand break
                term:
                  id: GO:0035861
                  label: site of double-strand break
            role_description: >-
              The same MRN complex that activates ATM (modelled in atm_dsb_signaling);
              here its nuclease role. MRE11 3'-5' exonuclease (GO:0008296 in the
              GO-CAMs) completes the short-range step.
            evidence:
              - source_id: PMID:27814491
                statement: Human MRN performs sequential endo- and exonucleolytic processing of blocked ends, stimulated by phosphorylated CtIP.
                supporting_text: "Here we show that hMRN catalyzes sequential endonucleolytic and exonucleolytic activities on both 5' and 3' strands of DNA ends containing protein adducts, and that Nbs1, ATP, and adducts are essential for this function."
            gocam_associations:
              - model: gomodel:65a1f4f800000855
                activity: gomodel:65a1f4f800000855/65a1f4f800000979
                title: MRE11 DNA endonuclease activity (GO:0004520)
              - model: gomodel:65a1f4f800000855
                activity: gomodel:65a1f4f800000855/65a1f4f800000971
                title: MRE11 3'-5'-DNA exonuclease activity (GO:0008296)
              - model: gomodel:65a1f4f800000855
                activity: gomodel:65a1f4f800000855/65a1f4f800000987
                title: RAD50 ATP hydrolysis activity (GO:0016887)
          - id: ctip_resection
            label: CtIP (RBBP8) stimulation of the MRE11 endonuclease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RBBP8 (CtIP)
                term:
                  id: UniProtKB:Q99708
                  label: DNA endonuclease RBBP8
            function:
              preferred_term: single-stranded DNA endonuclease activity
              term:
                id: GO:0000014
                label: single-stranded DNA endonuclease activity
              targets:
                - preferred_term: MRE11
                  term:
                    id: UniProtKB:P49959
                    label: Double-strand break repair protein MRE11
            processes:
              - preferred_term: DNA double-strand break processing
                term:
                  id: GO:0000729
                  label: DNA double-strand break processing
            locations:
              - preferred_term: site of double-strand break
                term:
                  id: GO:0035861
                  label: site of double-strand break
            role_description: >-
              CDK- and ATM/ATR-phosphorylated CtIP binds NBN and BRCA1 and acts as the
              co-factor that switches on MRE11 endonuclease cleavage. Its own nuclease
              activity (the function asserted, following the GO-CAM and GOA IMP rows)
              is less certain than its co-factor role.
            evidence:
              - source_id: PMID:17965729
                statement: CtIP binds the MRE11 complex and both are required for HR.
                supporting_text: "Furthermore, we establish that CtIP physically and functionally interacts with the MRE11 complex, and that both CtIP and MRE11 are required for efficient homologous recombination."
              - source_id: PMID:27814491
                statement: Phosphorylated CtIP stimulates hMRN endonucleolytic cleavage.
                supporting_text: "The hMRN endonucleolytic cleavage events are further stimulated by the phosphorylated form of the human C-terminal binding protein-interacting protein (CtIP) DNA repair enzyme, establishing a role for CtIP in regulating hMRN activity."
            gocam_associations:
              - model: gomodel:65a1f4f800001380
                activity: gomodel:65a1f4f800001380/65a1f4f800001465
                title: RBBP8 single-stranded DNA endonuclease activity (GO:0000014)
    - order: 3
      role: long-range end resection
      node:
        id: long_range_resection
        label: Long-range 5'-3' resection by EXO1 or by RecQ helicase-DNA2
        module_type: REACTION
        description: >-
          From the MRN-CtIP entry site, kilobase-long 3' tails are generated by either
          of two machineries, both stimulated by MRN and RPA.
        concepts:
          - preferred_term: DNA double-strand break processing
            term:
              id: GO:0000729
              label: DNA double-strand break processing
        variant_sets:
          - id: long_range_resection_machinery
            label: EXO1 versus BLM/WRN-DNA2 long-range resection
            axis: resection machinery
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              The two routes act in parallel and are partly redundant in cells; loss of
              both is needed to abolish long-range resection. ONE_OR_MORE because both
              can operate on the same break.
            variants:
              - id: exo1_resection
                label: EXO1 5'-3' exonuclease route
                module_type: REACTION
                annotons:
                  - id: exo1_exonuclease
                    label: EXO1 5'-3' DNA exonuclease activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EXO1
                        term:
                          id: UniProtKB:Q9UQ84
                          label: Exonuclease 1
                    function:
                      preferred_term: 5'-3' DNA exonuclease activity
                      term:
                        id: GO:0035312
                        label: 5'-3' DNA exonuclease activity
                    processes:
                      - preferred_term: DNA double-strand break processing
                        term:
                          id: GO:0000729
                          label: DNA double-strand break processing
                    locations:
                      - preferred_term: site of double-strand break
                        term:
                          id: GO:0035861
                          label: site of double-strand break
                    role_description: >-
                      Degrades the 5'-terminated strand of double-stranded DNA; its
                      processivity is enhanced by MRN and its end affinity by BLM.
                    evidence:
                      - source_id: PMID:10608837
                        statement: Human EXO1 has robust 5'-3' exonuclease activity on double-stranded DNA.
                        supporting_text: "the RAD2 domain of human exonuclease 1 (HEX1-N2) exhibits both a robust 5' to 3' exonuclease activity on single- and double-stranded DNA substrates as well as a flap structure-specific endonuclease activity"
                      - source_id: PMID:21325134
                        statement: EXO1 resection is stimulated by BLM, MRN and RPA.
                        supporting_text: "In the other, EXO1 resects the DNA and is stimulated by BLM, MRN, and RPA."
                    gocam_associations:
                      - model: gomodel:65a1f4f800000855
                        activity: gomodel:65a1f4f800000855/65a1f4f800000992
                        title: EXO1 5'-3' DNA exonuclease activity (GO:0035312)
              - id: recq_dna2_resection
                label: BLM (or WRN) helicase with DNA2 nuclease route
                module_type: REACTION
                annotons:
                  - id: blm_resection_helicase
                    label: BLM 3'-5' DNA helicase unwinding of the break end
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: BLM
                        term:
                          id: UniProtKB:P54132
                          label: RecQ-like DNA helicase BLM
                    function:
                      preferred_term: 3'-5' DNA helicase activity
                      term:
                        id: GO:0043138
                        label: 3'-5' DNA helicase activity
                    processes:
                      - preferred_term: DNA double-strand break processing
                        term:
                          id: GO:0000729
                          label: DNA double-strand break processing
                    locations:
                      - preferred_term: site of double-strand break
                        term:
                          id: GO:0035861
                          label: site of double-strand break
                    role_description: >-
                      Unwinds the duplex end so that DNA2 can degrade the displaced 5'
                      strand; RPA is essential for unwinding and for resection polarity.
                    evidence:
                      - source_id: PMID:21325134
                        statement: RPA is essential for BLM unwinding and DNA2 5'-3' polarity; MRN recruits BLM.
                        supporting_text: "RPA is essential for both DNA unwinding by BLM and enforcing 5' → 3' resection polarity by DNA2. MRN accelerates processing by recruiting BLM to the end."
                  - id: wrn_resection_helicase
                    label: WRN 3'-5' DNA helicase (alternative RecQ partner of DNA2)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WRN
                        term:
                          id: UniProtKB:Q14191
                          label: Bifunctional 3'-5' exonuclease/ATP-dependent helicase WRN
                    function:
                      preferred_term: 3'-5' DNA helicase activity
                      term:
                        id: GO:0043138
                        label: 3'-5' DNA helicase activity
                    processes:
                      - preferred_term: DNA double-strand break processing
                        term:
                          id: GO:0000729
                          label: DNA double-strand break processing
                    locations:
                      - preferred_term: site of double-strand break
                        term:
                          id: GO:0035861
                          label: site of double-strand break
                    role_description: >-
                      Can substitute for BLM as the helicase partner of DNA2. Not on the
                      RGD gene list; added because it is the second human RecQ helicase
                      shown to resect with DNA2, epistatically in cells and with purified
                      proteins.
                    evidence:
                      - source_id: PMID:25122754
                        statement: WRN and DNA2 interact and coordinate RPA-dependent 5'-3' resection; WRN and BLM act epistatically with DNA2 in cells.
                        supporting_text: "Our biochemical experiments show that WRN and DNA2 interact physically and coordinate their enzymatic activities to mediate 5'-3' DNA end resection in a reaction dependent on RPA."
                  - id: dna2_resection_nuclease
                    label: DNA2 nuclease degradation of the displaced 5' strand
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DNA2
                        term:
                          id: UniProtKB:P51530
                          label: DNA replication ATP-dependent helicase/nuclease DNA2
                    function:
                      preferred_term: 5'-flap endonuclease activity
                      term:
                        id: GO:0017108
                        label: 5'-flap endonuclease activity
                    processes:
                      - preferred_term: DNA double-strand break processing
                        term:
                          id: GO:0000729
                          label: DNA double-strand break processing
                    locations:
                      - preferred_term: site of double-strand break
                        term:
                          id: GO:0035861
                          label: site of double-strand break
                    role_description: >-
                      Its nuclease, not its weak helicase, is required; RPA bound to the
                      unwound strands restricts DNA2 cleavage to the 5' strand.
                    evidence:
                      - source_id: PMID:21325134
                        statement: The BLM-DNA2 route requires BLM helicase and DNA2 nuclease functions.
                        supporting_text: "In one, BLM and DNA2 physically and specifically interact to resect DNA in a process that is ATP-dependent and requires BLM helicase and DNA2 nuclease functions."
    - order: 4
      role: RPA coating of the single-stranded 3' tails
      node:
