id: MODULE:c_elegans_cgmp_sensory_transduction
title: cGMP-dependent sensory transduction in Caenorhabditis elegans ciliated neurons
description: >-
  Many Caenorhabditis elegans sensory neurons turn an environmental stimulus
  into an electrical signal through the second messenger cGMP. A guanylyl
  cyclase in or near the sensory cilium makes cGMP. The cGMP then opens a
  cyclic nucleotide-gated (CNG) cation channel made of the pore-forming alpha
  subunit TAX-4 and the modulatory beta subunit TAX-2. The resulting cation and
  Ca2+ influx changes the activity of the neuron. The channel is the same in
  different neurons, but the cyclase differs with the stimulus. In the AWC
  olfactory neurons, the transmembrane guanylyl cyclases ODR-1 and DAF-11 act
  downstream of odorant receptors and are required for responses to
  AWC-sensed odors. In the AFD thermosensory neurons, the receptor guanylyl
  cyclases GCY-8, GCY-18 and GCY-23 together are required for
  temperature-evoked currents, and they set the temperature range of
  isothermal tracking. In the URX and BAG gas-sensing neurons, heme-containing
  soluble guanylyl cyclases act as oxygen sensors: GCY-35/GCY-36 respond to
  rises in O2 and GCY-31/GCY-33 to falls. tax-4 and tax-2 are expressed in the
  thermosensory, gustatory and olfactory neurons. tax-4 mutants fail to
  respond to temperature and to soluble or volatile attractants, and they are
  defective in oxygen responses. A separate set of C. elegans sensory
  neurons, including AWA and ASH, uses OSM-9/OCR-2 TRPV channels instead of
  this cGMP-CNG pathway.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10064800
    title: Functional reconstitution of a heteromeric cyclic nucleotide-gated channel of Caenorhabditis elegans in cultured cells.
    statement: >-
      TAX-4 and TAX-2 form a heteromeric cGMP-selective CNG channel, and cGMP
      is the second messenger of C. elegans sensory transduction.
    supporting_text: >-
      These results suggest that cGMP is used as the second messenger during
      sensory signal transduction in C. elegans
  - source_id: PMID:8893027
    title: Mutations in a cyclic nucleotide-gated channel lead to abnormal thermosensation and chemosensation in C. elegans.
    statement: >-
      tax-4 is needed for thermosensory, gustatory and olfactory behaviors and
      is expressed in the neurons that mediate them.
    supporting_text: >-
      The results suggest that a cyclic nucleotide-gated channel is required
      for thermosensation and chemosensation and that cGMP is an important
      intracellular messenger in C. elegans sensory transduction.
  - source_id: PMID:10790386
    title: A transmembrane guanylyl cyclase (DAF-11) and Hsp90 (DAF-21) regulate a common set of chemosensory behaviors in caenorhabditis elegans.
    statement: >-
      Genetic rescue by a cGMP analogue in daf-11 mutants supports cGMP as the
      chemosensory second messenger.
    supporting_text: >-
      These results demonstrate that cGMP is a prominent second messenger in C.
      elegans chemosensory transduction
  - source_id: PMID:12160748
    title: Combinatorial expression of TRPV channel proteins defines their sensory functions and subcellular localization in C. elegans neurons.
    statement: >-
      OSM-9/OCR-2 TRPV channels carry out sensory transduction in neurons that
      express both. Neurons that express only OSM-9 use it for adaptation. This
      TRPV pathway is separate from cGMP-CNG transduction and is outside this
      module.
    supporting_text: >-
      In neurons that express only OSM-9, tagged OSM-9 protein resides in the
      cell body and acts in sensory adaptation rather than sensory
      transduction.
  - source_id: file:modules/nitric_oxide_cgmp_signaling.yaml
    title: Nitric oxide-cGMP signaling pathway module
    statement: >-
      The taxon-neutral NO-sGC-cGMP module. The worm soluble guanylyl cyclase
      variant here is a contrast to it, because the worm enzymes act as O2
      sensors and are not NO receptors.
notes: >-
  Boundary. This is a concrete C. elegans module for the primary transduction
  step in ciliated sensory neurons that use cGMP. A guanylyl cyclase makes
  cGMP, and cGMP gates the TAX-4/TAX-2 CNG channel. The cyclase step is a
  variant set along the neuron and stimulus axis (AWC odors, AFD temperature,
  URX/BAG oxygen). In this concrete scope these variants coexist in one animal
  and are not alternatives, so the selection is ONE_OR_MORE. The CNG channel is
  a shared required part.

  Left out on purpose. (1) The OSM-9/OCR-2 TRPV branch, used in AWA olfaction
  and ASH nociception. It does not use cGMP and should get its own module.
  OCR-2 has a gene review but is therefore not a member here. OSM-9 does act
  in AWC, but as an adaptation factor and not as the transduction channel
  (PMID:12160748). (2) GPA-12. Its review places it in the epidermal
  antifungal G12/13-PKC-p38 pathway, not in sensory transduction. (3)
  Upstream receptors and G proteins: AWC odorant GPCRs such as STR-2, the Galpha
  ODR-3, and the photoreceptor LITE-1 in ASJ. None has a gene review here. They
  are described in text and not given annotons. (4) Downstream modulators:
  EGL-4/PKG adaptation, TAX-6 calcineurin, the CNG-3 channel subunit and
  cGMP phosphodiesterases. (5) The ASE salt-sensing receptor guanylyl
  cyclases (GCY-22, GCY-5 and others). TAX-4/TAX-2 also act in ASE, but the
  cached primary evidence for ASE rGCs is abstract-only and indirect, so no ASE
  cyclase variant is modeled. (6) ASJ phototransduction, which also uses
  DAF-11, ODR-1 and TAX-2/TAX-4 (PMID:20436480). It is recorded here as
  context, not as a separate variant.

  Grounding. ODR-1, TAX-2 and TAX-4 have completed gene reviews, and their
  annotons use those reviews' core molecular functions. DAF-11, GCY-8, GCY-18,
  GCY-23, GCY-35, GCY-36, GCY-31 and GCY-33 have no gene reviews here. Their
  accessions are Swiss-Prot entries from UniProt (gene_exact query, organism
  6239). Their annotons use guanylate cyclase activity (GO:0004383), which
  matches their EC 4.6.1.2 assignment and the cited genetic evidence. The
  rGCs are written as parallel annotons in each variant. Whether they act as
  obligate heterodimers in vivo is not established for AWC or AFD. The
  direction of the stimulus-evoked cGMP change differs between neurons and is
  not modeled.

  Relation to MODULE:nitric_oxide_cgmp_signaling. That module is the
  vertebrate-style NO-sGC-cGMP-PKG pathway. The worm GCY-35/GCY-36 and
  GCY-31/GCY-33 enzymes are atypical soluble guanylyl cyclases with heme
  H-NOX domains that sense O2. Their output here is the CNG channel, not PKG.
  The GO term nitric oxide-cGMP-mediated signaling (GO:0038060) is therefore
  not used. GO currently has no non-obsolete general "cGMP-mediated
  signaling" process term (GO:0019934 is obsolete), so the root concept uses
  the stimulus-detection process.
module:
  id: c_elegans_cgmp_sensory_transduction
  label: cGMP-dependent sensory transduction in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Guanylyl cyclase-generated cGMP opens the TAX-4/TAX-2 cyclic
    nucleotide-gated channel in ciliated sensory neurons. Neuron-specific
    cyclases are used for odors (AWC), temperature (AFD) and oxygen (URX/BAG).
  concepts:
    - preferred_term: detection of stimulus involved in sensory perception
      term:
        id: GO:0050906
        label: detection of stimulus involved in sensory perception
      description: >-
        Shared process context. The modality-specific detection terms are
        placed on each cyclase variant.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: non-motile cilium
        term:
          id: GO:0097730
          label: non-motile cilium
    anatomical_locations:
      - preferred_term: amphid and other ciliated sensory neurons
        description: >-
          AWC, AWB, AFD, ASE, ASJ, URX and BAG among others. These are the
          neurons that express tax-4/tax-2.
  parts:
    - order: 1
      role: stimulus-regulated cGMP production by a guanylyl cyclase
      node:
        id: cgmp_production
        label: Neuron-specific guanylyl cyclase cGMP production
        module_type: MODULE
        description: >-
          A guanylyl cyclase whose activity is set by the stimulus produces the
          cGMP that gates the CNG channel. Odors in AWC act through odorant
          receptors and the Galpha ODR-3. In AFD and URX/BAG the cyclases are
          the sensors themselves, or sit close to them.
        concepts:
          - preferred_term: cGMP biosynthetic process
            term:
              id: GO:0006182
              label: cGMP biosynthetic process
        variant_sets:
          - id: cyclase_by_neuron
            label: Guanylyl cyclase sets by neuron and modality
            axis: sensory neuron and stimulus modality
            selection: ONE_OR_MORE
            notes: >-
              These cyclase sets coexist in different neurons of the same
              animal. Each one feeds the same TAX-4/TAX-2 channel.
            variants:
              - id: awc_olfactory_rgc
                label: AWC olfactory transmembrane guanylyl cyclases ODR-1 and DAF-11
                module_type: MODULE
                description: >-
                  ODR-1 is needed for responses to all AWC-sensed odorants and
                  acts as a shared component downstream of odorant receptors.
                  DAF-11 also regulates AWC odor responses. DAF-25 is needed for
                  DAF-11 to reach the cilium. Overexpressing ODR-1 disrupts odor
                  discrimination and adaptation, probably because it makes too
                  much cGMP.
                concepts:
                  - preferred_term: detection of chemical stimulus involved in sensory perception of smell
                    term:
                      id: GO:0050911
                      label: detection of chemical stimulus involved in sensory perception of smell
                annotons:
                  - id: odr1_gc
                    label: ODR-1 transmembrane guanylyl cyclase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ODR-1 (GCY-10)
                        term:
                          id: UniProtKB:B1Q257
                          label: Receptor-type guanylate cyclase gcy-10
                    function:
                      preferred_term: guanylate cyclase activity
                      term:
                        id: GO:0004383
                        label: guanylate cyclase activity
                    processes:
                      - preferred_term: cGMP biosynthetic process
                        term:
                          id: GO:0006182
                          label: cGMP biosynthetic process
                    locations:
                      - preferred_term: ciliary membrane
                        term:
                          id: GO:0060170
                          label: ciliary membrane
                    role_description: >-
                      Shared cGMP-producing component downstream of all AWC
                      odorant receptors.
                    evidence:
                      - source_id: PMID:10774726
                        title: Olfaction and odor discrimination are mediated by the C. elegans guanylyl cyclase ODR-1.
                        statement: ODR-1 is needed for all AWC odor responses.
                        supporting_text: >-
                          We demonstrate that the transmembrane guanylyl cyclase
                          ODR-1 is essential for responses to all AWC-sensed
                          odorants.
                  - id: daf11_gc
                    label: DAF-11 transmembrane guanylyl cyclase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DAF-11
                        term:
                          id: UniProtKB:Q8I4N4
                          label: Receptor-type guanylate cyclase daf-11
                    function:
                      preferred_term: guanylate cyclase activity
                      term:
                        id: GO:0004383
                        label: guanylate cyclase activity
                    processes:
                      - preferred_term: cGMP biosynthetic process
                        term:
                          id: GO:0006182
                          label: cGMP biosynthetic process
                    locations:
                      - preferred_term: non-motile cilium
                        term:
                          id: GO:0097730
                          label: non-motile cilium
                    role_description: >-
                      Cilium-localized cyclase needed for AWC odor responses and
                      for several other chemosensory responses. It also acts in
                      ASJ phototransduction and in dauer control.
                    evidence:
                      - source_id: PMID:10790386
                        title: A transmembrane guanylyl cyclase (DAF-11) and Hsp90 (DAF-21) regulate a common set of chemosensory behaviors in caenorhabditis elegans.
                        statement: >-
                          DAF-11 is a transmembrane guanylyl cyclase, and a cGMP
                          analogue rescues the daf-11 sensory defect.
                        supporting_text: >-
                          The cyclic GMP analogue 8-bromo-cGMP rescues a sensory
                          defect in both daf-11 and daf-21 mutants, supporting a
                          role for DAF-11 guanylyl cyclase activity in this
                          process
                      - source_id: PMID:21124868
                        title: Localization of a guanylyl cyclase to chemosensory cilia requires the novel ciliary MYND domain protein DAF-25.
                        statement: DAF-11 acts in AWC odor responses.
                        supporting_text: >-
                          DAF-11 and the cGMP pathway are known to regulate
                          responses to the AWC neuron-mediated odors isoamyl
                          alcohol, trimethyl thiazole and benzaldehyde
              - id: afd_thermosensory_rgc
                label: AFD thermosensory receptor guanylyl cyclases GCY-8, GCY-18 and GCY-23
                module_type: MODULE
                description: >-
                  Three AFD-specific rGCs are together needed for
                  temperature-evoked currents and thermotaxis. GCY-8 is needed
                  for AFD responses to oscillating thermal stimuli during
                  isothermal tracking. GCY-18 and GCY-23 set the temperature
                  range in which tracking happens. AFD also responds to CO2 in a
                  CNG channel-dependent way.
                concepts:
                  - preferred_term: detection of temperature stimulus involved in sensory perception
                    term:
                      id: GO:0050961
                      label: detection of temperature stimulus involved in sensory perception
                evidence:
                  - source_id: PMID:21315599
                    title: Regulation of response properties and operating range of the AFD thermosensory neurons by cGMP signaling.
                    statement: >-
                      gcy-8 gcy-18 gcy-23 triple mutants, like tax-2 and tax-4
                      mutants, are atactic and lack temperature-induced AFD
                      currents.
                    supporting_text: >-
                      Animals mutant for the TAX-2 and TAX-4 cGMP-gated
                      channels, or triply mutant for the GCY-8, GCY-18 and
                      GCY-23 receptor guanylyl cyclases (rGCs) are atactic, and
                      fail to exhibit temperature-induced currents in the AFD
                      neurons
                  - source_id: PMID:21435556
                    title: Temperature, oxygen, and salt-sensing neurons in C. elegans are carbon dioxide sensors that control avoidance behavior.
                    statement: AFD and BAG CO2 responses need cGMP-gated channels.
                    supporting_text: >-
                      CO(2)-evoked Ca(2+) responses in AFD and BAG neurons
                      require cGMP-gated ion channels.
                annotons:
                  - id: gcy8_gc
                    label: GCY-8 receptor guanylyl cyclase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GCY-8
                        term:
                          id: UniProtKB:Q9GYQ4
                          label: Receptor-type guanylate cyclase gcy-8
                    function:
                      preferred_term: guanylate cyclase activity
                      term:
                        id: GO:0004383
                        label: guanylate cyclase activity
                    processes:
                      - preferred_term: detection of temperature stimulus involved in sensory perception
                        term:
                          id: GO:0050961
                          label: detection of temperature stimulus involved in sensory perception
                    role_description: >-
                      Needed for AFD responses to oscillating temperature and
                      for carrying out isothermal tracking.
                    evidence:
                      - source_id: PMID:21315599
                        title: Regulation of response properties and operating range of the AFD thermosensory neurons by cGMP signaling.
                        statement: gcy-8 mutants are defective in isothermal tracking and in AFD oscillation responses.
                        supporting_text: >-
                          mutations in the AFD-expressed gcy-8 receptor guanylyl
                          cyclase (rGC) gene result in defects in the execution
                          of IT behavior
                  - id: gcy18_gc
                    label: GCY-18 receptor guanylyl cyclase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GCY-18
                        term:
                          id: UniProtKB:G5EFQ0
                          label: Receptor-type guanylate cyclase gcy-18
                    function:
                      preferred_term: guanylate cyclase activity
                      term:
                        id: GO:0004383
                        label: guanylate cyclase activity
                    role_description: Sets the temperature range of isothermal tracking.
                    evidence:
                      - source_id: PMID:21315599
                        title: Regulation of response properties and operating range of the AFD thermosensory neurons by cGMP signaling.
                        statement: gcy-18 and gcy-23 mutations shift the temperature range of tracking.
                        supporting_text: >-
                          In contrast, mutations in the gcy-18 or gcy-23 rGCs
                          alter the temperature range in which IT behavior is
                          exhibited.
                  - id: gcy23_gc
                    label: GCY-23 receptor guanylyl cyclase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GCY-23
                        term:
                          id: UniProtKB:G5EEE9
                          label: Receptor-type guanylate cyclase gcy-23
                    function:
                      preferred_term: guanylate cyclase activity
                      term:
                        id: GO:0004383
                        label: guanylate cyclase activity
                    role_description: >-
                      Sets the temperature range of isothermal tracking,
                      together with GCY-18.
              - id: o2_sensing_sgc
                label: URX/BAG oxygen-sensing soluble guanylyl cyclases
                module_type: MODULE
                description: >-
                  Atypical heme-containing soluble guanylyl cyclases act as O2
                  sensors. In URX, GCY-35/GCY-36 are needed for activation by a
                  rise in O2. In BAG, GCY-31/GCY-33 are needed for activation by
                  a fall in O2. Expressing the URX sGCs in BAG is enough to
                  switch the polarity of BAG's O2 response. The cGMP made in
                  response opens the TAX-4 channel.
                concepts:
                  - preferred_term: detection of oxygen
                    term:
                      id: GO:0003032
                      label: detection of oxygen
                evidence:
                  - source_id: PMID:19323996
                    title: Neurons detect increases and decreases in oxygen levels using distinct guanylate cyclases.
                    statement: The sGCs are instructive O2 sensors.
                    supporting_text: >-
                      The sGCs are instructive O2 sensors, as forced expression
                      of URX sGC genes causes BAG neurons to detect O2
                      increases.
                annotons:
                  - id: gcy35_sgc
                    label: GCY-35 soluble guanylyl cyclase (URX, O2 rise)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GCY-35
                        term:
                          id: UniProtKB:O02298
