    - order: 2
      role: cGMP-gated TAX-4/TAX-2 CNG channel
      node:
        id: tax4_tax2_cng
        label: TAX-4/TAX-2 heteromeric cyclic nucleotide-gated channel
        module_type: PROTEIN_COMPLEX
        description: >-
          TAX-4 is the CNGA-type pore-forming subunit and forms a
          cGMP-activated channel on its own. TAX-2 is a CNGB-type subunit that
          cannot form a channel alone. It co-assembles with TAX-4, lowers cGMP
          sensitivity about 25-fold, keeps the channel selective for cGMP over
          cAMP, and changes block by divalent cations. Native channels are
          probably mostly TAX-4/TAX-2 heteromers. In the cryo-EM structure of
          cGMP-bound TAX-4, a C-linker gating ring couples cyclic-nucleotide
          binding to pore opening. Both subunits go to sensory cilia, and they
          depend on each other for this in a cell-specific way.
        concepts:
          - preferred_term: intracellular cyclic nucleotide activated cation channel complex
            term:
              id: GO:0017071
              label: intracellular cyclic nucleotide activated cation channel complex
        annotons:
          - id: tax4_alpha
            label: TAX-4 CNG channel alpha subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TAX-4
                term:
                  id: UniProtKB:Q03611
                  label: Cyclic nucleotide-gated channel
            function:
              preferred_term: intracellularly cGMP-activated cation channel activity
              term:
                id: GO:0005223
                label: intracellularly cGMP-activated cation channel activity
            processes:
              - preferred_term: detection of chemical stimulus involved in sensory perception
                term:
                  id: GO:0050907
                  label: detection of chemical stimulus involved in sensory perception
            locations:
              - preferred_term: non-motile cilium
                term:
                  id: GO:0097730
                  label: non-motile cilium
            role_description: >-
              Pore-forming subunit opened by intracellular cGMP. It is needed for
              thermosensory, gustatory, olfactory and O2 responses.
            evidence:
              - source_id: PMID:8893027
                title: Mutations in a cyclic nucleotide-gated channel lead to abnormal thermosensation and chemosensation in C. elegans.
                statement: TAX-4 works as a cyclic nucleotide-gated channel.
                supporting_text: >-
                  Tax-4 protein expressed in cultured cells functions as a
                  cyclic nucleotide-gated channel.
              - source_id: PMID:28099415
                title: Structure of a eukaryotic cyclic-nucleotide-gated channel.
                statement: The cryo-EM structure of cGMP-bound open TAX-4.
                supporting_text: >-
                  Here we report a 3.5-Å-resolution single-particle electron
                  cryo-microscopy structure of a cyclic-nucleotide-gated channel
                  from Caenorhabditis elegans in the cyclic guanosine
                  monophosphate (cGMP)-bound open state.
          - id: tax2_beta
            label: TAX-2 CNG channel beta subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TAX-2
                term:
                  id: UniProtKB:G5EEE2
                  label: Cyclic nucleotide-binding domain-containing protein
            function:
              preferred_term: monoatomic ion channel activity
              term:
                id: GO:0005216
                label: monoatomic ion channel activity
              description: >-
                Contributes to the heteromeric channel. TAX-2 does not form a
                channel by itself.
            locations:
              - preferred_term: non-motile cilium
                term:
                  id: GO:0097730
                  label: non-motile cilium
            role_description: >-
              Modulatory beta subunit that tunes the cGMP sensitivity and
              permeation of the native channel.
            evidence:
              - source_id: PMID:10064800
                title: Functional reconstitution of a heteromeric cyclic nucleotide-gated channel of Caenorhabditis elegans in cultured cells.
                statement: TAX-2 forms a heteromeric channel only with TAX-4.
                supporting_text: >-
                  Here we show that TAX-4 and TAX-2 form a heteromeric channel
                  when expressed in HEK293 cells, but TAX-2 does not form a
                  channel on its own.
              - source_id: PMID:23886944
                title: Cell- and subunit-specific mechanisms of CNG channel ciliary trafficking and localization in C. elegans.
                statement: TAX-2 and TAX-4 depend on each other for ciliary localization in specific cells.
                supporting_text: >-
                  We demonstrate that ciliary localization of CNG channel
                  subunits is interdependent on different channel subunits in
                  specific cells
  connections:
    - source: cgmp_production
      target: tax4_tax2_cng
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        cGMP from the stimulus-regulated cyclase binds the TAX-4 cyclic
        nucleotide-binding domain and opens the channel.
      evidence:
        - source_id: PMID:19323996
          title: Neurons detect increases and decreases in oxygen levels using distinct guanylate cyclases.
          statement: In BAG, cGMP from GCY-31/GCY-33 opens the TAX-4 channel.
          supporting_text: >-
            We suggest that O2 downshifts increase cGMP production by GCY-31 and
            GCY-33, allowing opening of the cGMP-gated cation channel encoded by
            tax-4 and depolarization of BAG neurons.
knowledge_gaps:
  - gap_statement: >-
      How odorant receptor activation in AWC changes ODR-1 and DAF-11 cyclase
      activity is unknown. It is unclear whether the Galpha ODR-3 acts on the
      cyclases directly, and whether ODR-1 and DAF-11 form an obligate
      heteromer.
    boundary: >-
      ODR-1 and DAF-11 are both genetically needed for AWC responses, and DAF-11
      ciliary localization needs DAF-25. A biochemical link from odorant GPCRs
      or Galpha to the cyclases has not been shown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This is the central mechanistic step that turns odorant receptor
      signaling into a change in cGMP in AWC.
    resolution: >-
      Co-immunoprecipitation and FRET of ODR-1 and DAF-11 in AWC cilia, cyclase
      assays with purified ODR-3, and in vivo cGMP imaging in odr-1 and daf-11
      single mutants.
    provenance:
      - reference_id: PMID:10774726
        supporting_text: >-
          ODR-1 appears to be a shared signaling component downstream of
          odorant receptors.
  - gap_statement: >-
      The molecular basis of temperature sensing by the AFD rGCs is unknown. It
      is not clear whether GCY-8, GCY-18 and GCY-23 are temperature-sensitive
      cyclases, or whether they relay a signal from another thermosensor.
    boundary: >-
      The triple rGC mutant abolishes temperature-induced AFD currents.
      gcy-18 and gcy-23 shift the operating range, and changing cGMP levels
      shifts the AFD threshold.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether the cyclase itself is the thermosensor in AFD, as the
      sGCs are the O2 sensors in URX and BAG.
    resolution: >-
      Measure the temperature dependence of purified or heterologously expressed
      GCY-8/18/23 activity, and test temperature responses after ectopic rGC
      expression in non-thermosensory neurons.
    provenance:
      - reference_id: PMID:21315599
        supporting_text: >-
          Alteration of intracellular cGMP levels via rGC mutations or addition
          of cGMP analogs shift the lower and upper ranges of the temperature
          range of IT
