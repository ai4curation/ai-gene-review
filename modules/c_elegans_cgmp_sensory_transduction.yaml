    - order: 2
      role: cGMP-gated TAX-4/TAX-2 CNG channel
      node:
        id: tax4_tax2_cng
        label: TAX-4/TAX-2 heteromeric cyclic nucleotide-gated channel
        module_type: PROTEIN_COMPLEX
        description: >-
          TAX-4 is the CNGA-type pore-forming subunit and forms a
          cGMP-activated channel on its own. TAX-2 is a CNGB-type subunit that
          cannot form a channel alone. It co-assembles with TAX-4, lowers cGMP
          sensitivity about 25-fold, keeps the channel selective for cGMP over
          cAMP, and changes block by divalent cations. Native channels are
          probably mostly TAX-4/TAX-2 heteromers. In the cryo-EM structure of
          cGMP-bound TAX-4, a C-linker gating ring couples cyclic-nucleotide
          binding to pore opening. Both subunits go to sensory cilia, and they
          depend on each other for this in a cell-specific way.
        concepts:
          - preferred_term: intracellular cyclic nucleotide activated cation channel complex
            term:
              id: GO:0017071
              label: intracellular cyclic nucleotide activated cation channel complex
        annotons:
          - id: tax4_alpha
            label: TAX-4 CNG channel alpha subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TAX-4
                term:
                  id: UniProtKB:Q03611
                  label: Cyclic nucleotide-gated channel
            function:
              preferred_term: intracellularly cGMP-activated cation channel activity
              term:
                id: GO:0005223
                label: intracellularly cGMP-activated cation channel activity
            processes:
              - preferred_term: detection of chemical stimulus involved in sensory perception
                term:
                  id: GO:0050907
                  label: detection of chemical stimulus involved in sensory perception
            locations:
              - preferred_term: non-motile cilium
                term:
                  id: GO:0097730
                  label: non-motile cilium
            role_description: >-
              Pore-forming subunit opened by intracellular cGMP. It is needed for
              thermosensory, gustatory, olfactory and O2 responses.
            evidence:
              - source_id: PMID:8893027
                title: Mutations in a cyclic nucleotide-gated channel lead to abnormal thermosensation and chemosensation in C. elegans.
                statement: TAX-4 works as a cyclic nucleotide-gated channel.
                supporting_text: >-
                  Tax-4 protein expressed in cultured cells functions as a
                  cyclic nucleotide-gated channel.
              - source_id: PMID:28099415
                title: Structure of a eukaryotic cyclic-nucleotide-gated channel.
                statement: The cryo-EM structure of cGMP-bound open TAX-4.
                supporting_text: >-
                  Here we report a 3.5-Å-resolution single-particle electron
                  cryo-microscopy structure of a cyclic-nucleotide-gated channel
                  from Caenorhabditis elegans in the cyclic guanosine
                  monophosphate (cGMP)-bound open state.
          - id: tax2_beta
            label: TAX-2 CNG channel beta subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TAX-2
                term:
                  id: UniProtKB:G5EEE2
                  label: Cyclic nucleotide-binding domain-containing protein
            function:
              preferred_term: monoatomic ion channel activity
              term:
                id: GO:0005216
                label: monoatomic ion channel activity
              description: >-
                Contributes to the heteromeric channel. TAX-2 does not form a
                channel by itself.
            locations:
              - preferred_term: non-motile cilium
                term:
                  id: GO:0097730
                  label: non-motile cilium
            role_description: >-
              Modulatory beta subunit that tunes the cGMP sensitivity and
              permeation of the native channel.
            evidence:
              - source_id: PMID:10064800
                title: Functional reconstitution of a heteromeric cyclic nucleotide-gated channel of Caenorhabditis elegans in cultured cells.
                statement: TAX-2 forms a heteromeric channel only with TAX-4.
                supporting_text: >-
                  Here we show that TAX-4 and TAX-2 form a heteromeric channel
                  when expressed in HEK293 cells, but TAX-2 does not form a
                  channel on its own.
              - source_id: PMID:23886944
                title: Cell- and subunit-specific mechanisms of CNG channel ciliary trafficking and localization in C. elegans.
                statement: TAX-2 and TAX-4 depend on each other for ciliary localization in specific cells.
                supporting_text: >-
