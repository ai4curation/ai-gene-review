                    evidence:
                      - source_id: PMID:10790386
                        title: A transmembrane guanylyl cyclase (DAF-11) and Hsp90 (DAF-21) regulate a common set of chemosensory behaviors in caenorhabditis elegans.
                        statement: >-
                          DAF-11 is a transmembrane guanylyl cyclase, and a cGMP
                          analogue rescues the daf-11 sensory defect.
                        supporting_text: >-
                          The cyclic GMP analogue 8-bromo-cGMP rescues a sensory
                          defect in both daf-11 and daf-21 mutants, supporting a
                          role for DAF-11 guanylyl cyclase activity in this
                          process
                      - source_id: PMID:21124868
                        title: Localization of a guanylyl cyclase to chemosensory cilia requires the novel ciliary MYND domain protein DAF-25.
                        statement: DAF-11 acts in AWC odor responses.
                        supporting_text: >-
                          DAF-11 and the cGMP pathway are known to regulate
                          responses to the AWC neuron-mediated odors isoamyl
                          alcohol, trimethyl thiazole and benzaldehyde
              - id: afd_thermosensory_rgc
                label: AFD thermosensory receptor guanylyl cyclases GCY-8, GCY-18 and GCY-23
                module_type: MODULE
                description: >-
                  Three AFD-specific rGCs, located at the microvilli of the AFD
                  sensory ending, are together needed for temperature-evoked
                  currents and thermotaxis, and any one of them partly rescues
                  the triple mutant. GCY-8 is essential for AFD responses to
                  oscillating thermal stimuli and for carrying out isothermal
                  tracking. GCY-18 is the main AFD cyclase at cultivation
                  temperatures of 20-25 C. GCY-23 is modulatory. GCY-18 and
                  GCY-23 set the temperature range in which tracking happens.
                  AFD also responds to CO2 in a CNG channel-dependent way.
                concepts:
                  - preferred_term: detection of temperature stimulus involved in sensory perception
                    term:
                      id: GO:0050961
                      label: detection of temperature stimulus involved in sensory perception
                evidence:
                  - source_id: PMID:21315599
                    title: Regulation of response properties and operating range of the AFD thermosensory neurons by cGMP signaling.
                    statement: >-
                      gcy-8 gcy-18 gcy-23 triple mutants, like tax-2 and tax-4
                      mutants, are atactic and lack temperature-induced AFD
                      currents.
                    supporting_text: >-
                      Animals mutant for the TAX-2 and TAX-4 cGMP-gated
                      channels, or triply mutant for the GCY-8, GCY-18 and
                      GCY-23 receptor guanylyl cyclases (rGCs) are atactic, and
                      fail to exhibit temperature-induced currents in the AFD
                      neurons
                  - source_id: PMID:21435556
                    title: Temperature, oxygen, and salt-sensing neurons in C. elegans are carbon dioxide sensors that control avoidance behavior.
                    statement: AFD and BAG CO2 responses need cGMP-gated channels.
                    supporting_text: >-
                      CO(2)-evoked Ca(2+) responses in AFD and BAG neurons
                      require cGMP-gated ion channels.
                annotons:
