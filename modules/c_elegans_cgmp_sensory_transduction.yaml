                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GCY-36
                        term:
                          id: UniProtKB:Q6DNF4
                          label: Soluble guanylate cyclase gcy-36
                    function:
                      preferred_term: guanylate cyclase activity
