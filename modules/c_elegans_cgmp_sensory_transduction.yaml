  connections:
    - source: cgmp_production
      target: tax4_tax2_cng
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        cGMP from the stimulus-regulated cyclase binds the TAX-4 cyclic
        nucleotide-binding domain and opens the channel.
      evidence:
        - source_id: PMID:19323996
          title: Neurons detect increases and decreases in oxygen levels using distinct guanylate cyclases.
          statement: In BAG, cGMP from GCY-31/GCY-33 opens the TAX-4 channel.
          supporting_text: >-
            We suggest that O2 downshifts increase cGMP production by GCY-31 and
            GCY-33, allowing opening of the cGMP-gated cation channel encoded by
            tax-4 and depolarization of BAG neurons.
    - source: odr3_galpha
      target: odr1_gc
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        ODR-3 relays odorant receptor activation to the AWC cyclase step.
        Genetics puts it upstream of ODR-1. A direct effect on cyclase activity,
        and its sign, are not established.
      evidence:
        - source_id: PMID:10774726
          title: Olfaction and odor discrimination are mediated by the C. elegans guanylyl cyclase ODR-1.
          statement: ODR-1 is a shared component downstream of odorant receptors.
          supporting_text: >-
            ODR-1 appears to be a shared signaling component downstream of
            odorant receptors.
    - source: odr3_galpha
      target: daf11_gc
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        As for ODR-1, ODR-3 is genetically upstream of the DAF-11 cyclase in
        AWC, and a direct biochemical link is not established.
knowledge_gaps:
  - gap_statement: >-
      How odorant receptor activation in AWC changes ODR-1 and DAF-11 cyclase
      activity is unknown. It is unclear whether the Galpha ODR-3 acts on the
      cyclases directly, and whether ODR-1 and DAF-11 form an obligate
      heteromer.
    boundary: >-
      ODR-3 is the main stimulatory Galpha in AWC, and ODR-1 and DAF-11 are
      both genetically needed for AWC responses. DAF-11 ciliary localization
      needs DAF-25. A biochemical link from odorant GPCRs or ODR-3 to the
      cyclases has not been shown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This is the central mechanistic step that turns odorant receptor
      signaling into a change in cGMP in AWC.
    resolution: >-
      Co-immunoprecipitation and FRET of ODR-1 and DAF-11 in AWC cilia, cyclase
      assays with purified ODR-3, and in vivo cGMP imaging in odr-1 and daf-11
      single mutants.
    provenance:
      - reference_id: PMID:10774726
        supporting_text: >-
          ODR-1 appears to be a shared signaling component downstream of
          odorant receptors.
  - gap_statement: >-
      The molecular basis of temperature sensing by the AFD rGCs is unknown. It
      is not clear whether GCY-8, GCY-18 and GCY-23 are temperature-sensitive
      cyclases, or whether they relay a signal from another thermosensor.
    boundary: >-
      The triple rGC mutant abolishes temperature-induced AFD currents.
      gcy-18 and gcy-23 shift the operating range, and changing cGMP levels
      shifts the AFD threshold.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether the cyclase itself is the thermosensor in AFD, as the
      sGCs are the O2 sensors in URX and BAG.
    resolution: >-
      Measure the temperature dependence of purified or heterologously expressed
      GCY-8/18/23 activity, and test temperature responses after ectopic rGC
      expression in non-thermosensory neurons.
    provenance:
      - reference_id: PMID:21315599
        supporting_text: >-
          Alteration of intracellular cGMP levels via rGC mutations or addition
          of cGMP analogs shift the lower and upper ranges of the temperature
          range of IT
