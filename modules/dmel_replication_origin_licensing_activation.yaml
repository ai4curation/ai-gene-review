id: MODULE:dmel_replication_origin_licensing_activation
title: Replication origin licensing and activation in Drosophila melanogaster
description: >-
  Eukaryotic DNA replication starts in two steps that are separated in the cell cycle. In
  G1, the origin recognition complex (ORC) binds replication origins and, with Cdc6 and Cdt1
  (Double parked in Drosophila), loads the MCM2-7 helicase core as an inactive double hexamer
  around double-stranded DNA; this is origin licensing. In S phase, the Dbf4-dependent kinase
  (Cdc7 with its regulatory subunit Chiffon) and cyclin-dependent kinases trigger the recruitment
  of Cdc45 and the four-subunit GINS complex onto MCM2-7, forming the active CMG (Cdc45-MCM-GINS)
  helicase that unwinds DNA at the replication fork. Restricting licensing to G1 and activation
  to S phase ensures that each origin fires only once per cell cycle.
status: DRAFT
scope: CONCRETE
