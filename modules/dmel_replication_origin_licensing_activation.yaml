notes: >-
  Boundary. The module covers origin recognition, MCM2-7 loading and helicase activation.
  The FlyBase groups CMG, GINS and MCM2-7 overlap; MCM2-7 subunits appear both in the loaded
  MCM2-7 part and in the CMG part, and GINS is represented inside the CMG part rather than
  as a separate part. Cdc6 and dup (Cdt1) are not FlyBase members of these groups and were
  added as textbook licensing factors. Other firing factors (for example Mcm10, Treslin/Sld3
  and TopBP1/Dpb11 homologs) and the replicative polymerases (see dmel_dna_polymerase_complexes)
  are outside the module. FlyBase groups realized by this module: ORC (FBgg0000510), CMG (FBgg0001612),
  GINS (FBgg0001613), MCM2-7 (FBgg0001614), DDK (FBgg0002115). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_replication_origin_licensing_activation.yaml. Genes without a UniProtKB
  entry (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member
  genes has a gene review yet unless noted.
