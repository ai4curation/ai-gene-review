id: MODULE:dmel_mitochondrial_dna_replisome
title: Mitochondrial DNA replisome in Drosophila melanogaster
description: >-
  Mitochondrial DNA is copied by a dedicated replisome in the mitochondrial matrix that is
  separate from the nuclear replication machinery. DNA polymerase gamma, a heterodimer of
  the catalytic subunit PolG1 and the accessory subunit PolG2, synthesizes DNA and proofreads
  it. The mitochondrial replicative helicase (mtDNA-helicase, the ortholog of human Twinkle)
  unwinds the duplex ahead of the polymerase, and the mitochondrial single-stranded DNA-binding
  protein mtSSB coats the displaced strand and stimulates both enzymes. Mutations in these
  genes in Drosophila reduce mtDNA copy number.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001975
  title: 'FlyBase gene group MT-REP: Mitochondrial dna replisome'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as mitochondrial dna replisome
    (MT-REP); this module models that group.
- source_id: GO:0030894
  title: replisome
  statement: >-
    GO term grounding the module as replisome.
notes: >-
  Pol gamma also appears as a part of dmel_dna_polymerase_complexes. The 5'-3' helicase activity
  is assigned to mtDNA-helicase by conservation with human Twinkle. Mitochondrial RNA polymerase
  (primer synthesis), topoisomerases and TFAM are outside the module. FlyBase groups realized
  by this module: MT-REP (FBgg0001975). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_mitochondrial_dna_replisome.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
