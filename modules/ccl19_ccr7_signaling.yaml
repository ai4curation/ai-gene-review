id: MODULE:ccl19_ccr7_signaling
title: CCL19-activated CCR7 signaling pathway module
description: >-
  The homeostatic CC chemokine CCL19 (EBI1-ligand chemokine, ELC), secreted by T-zone stromal
  cells of secondary lymphoid organs and by thymic medullary epithelium, binds the
  Gi-coupled seven-transmembrane receptor CCR7 on naive and central-memory T cells, B cells and
  mature dendritic cells. Ligand binding initiates the CCL19-activated CCR7 signaling pathway
  (GO:0038119): Gi activation, calcium mobilization and chemotaxis that position lymphocytes and
  antigen-bearing dendritic cells in the T-cell zone. CCL19 is a biased CCR7 agonist: it activates
  G proteins with the same potency as the second CCR7 ligand CCL21, but alone drives robust receptor
  phosphorylation, beta-arrestin recruitment, internalization and beta-arrestin-dependent ERK1/2
  activation.
status: DRAFT
evidence:
  - source_id: GO:0038119
    title: CCL19-activated CCR7 signaling pathway
    statement: >-
      Grounded in the most specific GO pathway term for this ligand-receptor pair, a child of
      both GO:0038118 (C-C chemokine receptor CCR7 signaling pathway) and GO:0038115 (chemokine
      (C-C motif) ligand 19 signaling pathway); both parents carry GO comments asking curators to
      use the activated-CCR7 child terms.
  - source_id: PMID:9153236
    title: Molecular cloning of a novel human CC chemokine EBI1-ligand chemokine that is a specific
      functional ligand for EBI1, CCR7.
    supporting_text: ELC-SEAP was found to bind specifically to an orphan receptor EBI1
    statement: >-
      Identifies CCL19 (ELC) as the specific ligand of EBI1, which the authors named CCR7, and
      shows CCL19-induced calcium mobilization and chemotaxis of CCR7-transfected cells.
  - source_id: PMID:9498785
    title: CK beta-11/macrophage inflammatory protein-3 beta/EBI1-ligand chemokine is an efficacious
      chemoattractant for T and B cells.
    supporting_text: chemotaxis was completely blocked by pertussis toxin showing its receptor, most
      likely EBI1/BLR2/CCR7, is coupled to a G(alpha i) protein
    statement: >-
      CCL19 is a Gi-dependent chemoattractant for T and B cells but not granulocytes or monocytes.
  - source_id: PMID:15054093
    title: Differential desensitization, receptor phosphorylation, beta-arrestin recruitment, and
      ERK1/2 activation by the two endogenous ligands for the CC chemokine receptor 7.
    supporting_text: Both CCL19 and CCL21 induce G protein activation and calcium mobilization with
      equal potency
    statement: >-
      Defines CCL19 as a biased CCR7 agonist: equal G protein coupling to CCL21 but selective
      receptor phosphorylation, beta-arrestin recruitment and ERK1/2 activation.
  - source_id: PMID:11070085
    title: Coexpression of the chemokines ELC and SLC by T zone stromal cells and deletion of the
      ELC gene in the plt/plt mouse.
    supporting_text: we show in wild-type mice that ELC is expressed by T zone stromal cells that
      also make SLC
    statement: >-
      Places the ligand source in T-zone stromal cells and shows that Ccl19 is deleted together
      with Ccl21 in the trafficking-deficient plt/plt mouse.
  - source_id: file:genes/human/CCL19/CCL19-ai-review.yaml
    title: Human CCL19 gene review
    statement: >-
      Curates human CCL19 (UniProtKB:Q99731) with core molecular function GO:0008009 (chemokine
      activity), directly involved in GO:0038119; CCR7 chemokine receptor binding and CCR
      chemokine receptor binding rows are modified to chemokine activity.
  - source_id: PANTHER:PTN000245709
    title: PAINT node PTN000245709 for CC chemokines (CCL19)
    statement: >-
      Local PAINT IBD node in PTHR12015 asserting C:GO:0005576, F:GO:0008009, F:GO:0048020,
      P:GO:0006954, P:GO:0030335, P:GO:0060326, P:GO:0061844 and P:GO:0070098; CCL19 inherits these
      as IBA rows.
  - source_id: PANTHER:PTN002573880
    title: PAINT node PTN002573880 for CCR7
    statement: >-
      Local PAINT IBD node in PTHR10489 asserting F:GO:0038117 (C-C motif chemokine 19 receptor
      activity), F:GO:0035757 and F:GO:0035758 (dated 20200312), each seeded by human CCR7
      (UniProtKB:P32248).
  - source_id: PANTHER:PTN001628461
    title: PAINT node PTN001628461 for chemokine receptors (CCR7)
    statement: >-
      Local PAINT IBD node in PTHR10489 asserting C:GO:0009897, F:GO:0016493, F:GO:0019957,
      P:GO:0006955, P:GO:0007204, P:GO:0019722 and P:GO:0060326; human CCR7 seeds F:GO:0016493,
      F:GO:0019957 and P:GO:0060326.
notes: >-
  Two-step ligand-receptor module for CCL19 signaling through CCR7, built ligand step first per
  projects/LIGANDS_IN_SIGNALING.md. Scoping decision: a separate module rather than a branch of
  chemokine_signaling, because GO has a pair-specific pathway term (GO:0038119) and the pair has
  mechanism of its own (biased beta-arrestin signaling and receptor internalization that CCL21
  does not trigger), while the shared Gi, PI3Kgamma and Rho-family effector machinery is already
  modelled generically in chemokine_signaling and is not duplicated here. The ligand step uses
  chemokine activity (GO:0008009, a child of receptor ligand activity GO:0048018), not the
  receptor-specific GO:0031732 CCR7 chemokine receptor binding (campaign decision 1). PAINT node
  PTN000245709 asserts both chemokine activity and GO:0048020 CCR chemokine receptor binding; the
  binding term is the one that should yield to the ligand-activity term (decision 2), which belongs
  in the PTHR12015 family review (not edited in this slice). Boundary decisions. (1) CCL21 is the
  second CCR7 ligand and has its own pathway term (GO:0038120, CCL21-activated CCR7 signaling
  pathway); it is not a representative of this ligand step and should get a sibling module or a
  variant set once its gene review exists. (2) The atypical receptors ACKR4 (CCX-CKR) and CCRL2
  bind CCL19 without classical signaling (scavenging and presentation); they shape CCL19 gradients
  but are not pathway steps. (3) Beta-arrestin (ARRB2) recruitment is described in the receptor
  step's role and evidence but not modelled as its own annoton, because a fitting
  non-binding molecular function for the arrestin step has not been settled. Follow-ups: CCL21 and
  CCR7 gene reviews, then a variant set for the two CCR7 ligands.
