    role: biogenesis and protein supply
    optional: true
    node:
      id: copii_er_export
      label: COPII ER export (see MODULE:dmel_copii_coat)
      module_ref: dmel_copii_coat
      description: Drosophila COPII coat; delivers ER cargo and membrane to the Golgi.
  - order: 2
