id: MODULE:bacterial_choline_to_glycine_betaine_biosynthesis
title: Bacterial choline uptake and glycine betaine biosynthesis
description: >-
  A reusable bacterial module for choline uptake followed by its two-step
  oxidation to the compatible solute glycine betaine. A BetT-family transporter
  imports choline, FAD-dependent BetA oxidizes choline to betaine aldehyde, and
  NAD-dependent BetB oxidizes the aldehyde to glycine betaine.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_choline_to_glycine_betaine_biosynthesis__upa00529-deep-research-openscientist.md
    title: OpenScientist review of the module, UPA00529, and PSEPK
    statement: >-
      The resolved species-aware review marks all three steps covered, recovers
      BetT-I, BetA, and BetB despite their omission from the UniPathway bucket,
      and keeps BetI outside the catalytic module.
  - source_id: GO:0019285
    title: glycine betaine biosynthetic process from choline
    statement: >-
      GO:0019285 captures the consecutive oxidation of choline to glycine
      betaine.
  - source_id: PMID:26913973
    title: >-
      The revisited genome of Pseudomonas putida KT2440 enlightens its value as
      a robust metabolic chassis
    statement: >-
      The KT2440 genome reconstruction assigns choline uptake to BetT-I and the
      two oxidation reactions to the adjacent BetA and BetB enzymes.
  - source_id: PMID:17116241
    title: >-
      Uncoupling of choline-O-sulphate utilization from osmoprotection in
      Pseudomonas putida
    statement: >-
      Direct KT2440 genetic and biochemical evidence shows that betBA is
      required for conversion of choline to glycine betaine and separates this
      route from BetC-dependent choline-O-sulphate utilization.
  - source_id: file:PSEPK/betT-I/betT-I-ai-review.yaml
    title: PSEPK betT-I gene review
    statement: >-
      Q88CW9 is curated as the likely choline-uptake paralog associated with
      the betIBA locus.
  - source_id: file:PSEPK/betA/betA-ai-review.yaml
    title: PSEPK betA gene review
    statement: >-
      Q88CW6 is curated as the FAD-dependent choline dehydrogenase that produces
      betaine aldehyde.
  - source_id: file:PSEPK/betB/betB-ai-review.yaml
    title: PSEPK betB gene review
    statement: >-
      Q88CW7 is curated as the dedicated NAD-dependent betaine-aldehyde
      dehydrogenase.
notes: >-
  The module begins with extracellular choline and ends with intracellular
  glycine betaine. Direct glycine-betaine uptake, downstream demethylation and
  catabolism, osmotic-stress regulation, and alternative choline transporter
  paralogs are outside the boundary. Some BetA-family proteins are described
  as bifunctional choline/betaine-aldehyde oxidoreductases, but the KT2440
  pathway reconstruction assigns the terminal reaction to dedicated BetB.
  The species-aware report cites bifunctionality in Halomonas, not a direct
  assay of KT2440 BetA; organism-specific biochemical evidence should therefore
  be required before adding the BetB reaction to a BetA annoton.
