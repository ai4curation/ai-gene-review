      putida transporters have been reported; no blanket statement about all three paralogs is made.
    boundary: Q88CW9 is a locus-associated comparator, excluded from the positive choline-transporting
      BCCT family selector until source-specific activity is established.
    gap_kind:
    - BIOLOGY
  - gap_statement: Arthrobacter CodA establishes the oxidative segment, but this audit has not established
      a native choline importer for its exact assayed strain.
    boundary: A CodA-only inventory does not close the uptake-plus-oxidation module.
    gap_kind:
    - BIOLOGY
  - gap_statement: The Bacillus GbsB first-step role is supported, but purified-enzyme cofactor preference
      is unresolved in the source evidence inspected.
    boundary: Use the acceptor-unspecified choline dehydrogenase term; do not transfer GMC BetA flavin
      chemistry.
    gap_kind:
    - BIOLOGY
  - gap_statement: The 571-residue Acinetobacter paper-era record differs from the current 552-residue
      sequence by an N-terminal extension; cloning-start evidence is inaccessible.
    boundary: Keep it as a literature comparator rather than assigning the assayed activity to a guessed
      current exemplar. PMS-coupled in-vitro turnover does not establish native BetB dispensability.
    gap_kind:
    - BIOLOGY
    - CURATION
references:
- id: PMID:12007642
  title: 'Bacterial osmoadaptation: the role of osmolytes in bacterial stress and virulence.'
  findings:
  - statement: Comparative osmoadaptation review distinguishes compatible-solute uptake and synthesis
      across bacterial groups; detailed enzyme assignments require primary evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review; cached abstract and publisher treatment inspected. Supports bacterial
      osmoadaptation scope and separation of import from synthesis. Detailed GbsAB/OpuB assignments are
      corroborated by primary studies rather than extrapolated from general stress language.
- id: PMID:33613867
  title: 'Stressed out: Bacterial response to high salinity using compatible solute biosynthesis and uptake
    systems, lessons from Vibrionaceae.'
  findings:
  - statement: The Vibrionaceae review reports lineage-dependent betIBA distribution, including absence
      in the surveyed Cholerae clade, and alternative transporter organization. Bacteria-level scope therefore
      does not imply universal occurrence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full comparative review inspected. The reported Vibrionaceae distribution and
      differing importer organizations establish that a Bacteria envelope is not universal presence or
      a universal BetT implementation. No new genome scan was performed.
- id: PMID:23354714
  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  findings:
  - statement: Choline-derived betaine can be retained for protection or catabolized. The module ends
      at its formation without asserting a universal osmoprotective fate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached minireview abstract supports the branch point between betaine retention and catabolism.
      It does not establish the exact KT2440 transporter or make osmoprotection the necessary fate of
      every synthesized betaine molecule.
- id: PMID:32951822
  title: Choline oxidases.
  findings:
  - statement: Choline oxidase performs both oxidation steps with oxygen as acceptor. A single CodA protein
      carrying both evidenced activities can therefore supply the oxidative segment, while cellular uptake
      is still a separate role.
    supporting_text: 'four-electron, two-step, flavin-mediated oxidation

      of choline to glycine betaine'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract inspected. It describes CodA overall two-step chemistry; GO0033713 alone
      names only its first step. Exact target and separate substrate turnover are supported by primary
      characterization; native uptake remains unassigned.
- id: PMID:8752328
  title: 'Synthesis of the osmoprotectant glycine betaine in Bacillus subtilis: characterization of the
    gbsAB genes.'
  findings:
  - statement: Bacillus genetics and complementation establish GbsB/GbsA-dependent choline-to-betaine
      conversion. GbsB belongs to a type III alcohol-dehydrogenase family, distinct from GMC BetA; these
      data do not establish purified GbsB cofactor kinetics.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article and JH642 sequence mapping inspected in member reviews. Genetics/complementation
      establish GbsAB conversion; GbsB typeIII classification is not purified cofactor-specific kinetics.
- id: PMID:10216873
  title: Two evolutionarily closely related ABC transporters mediate the uptake of choline for synthesis
    of the osmoprotectant glycine betaine in Bacillus subtilis.
  findings:
  - statement: OpuB and OpuC are distinct four-subunit-type ABC importers with direct choline uptake evidence.
      This representative uses OpuB; related-family membership does not identify cargo or permit substitution
      of arbitrary subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected in the Bacillus reviews. Native uptake is an assembled-complex
      measurement in JH642-derived mutants. Related OpuB/OpuC families cannot substitute for each other
      by name; exact reference identities are documented.
- id: PMID:1956285
  title: DNA sequence and analysis of the bet genes encoding the osmoregulatory choline-glycine betaine
    pathway of Escherichia coli.
  findings:
  - statement: Experimentally characterized E. coli BetT performs proton-motive-force-driven high-affinity
      choline uptake.
    supporting_text: betT encoding a proton-motive-force-driven, high-affinity transport system for choline
  - statement: E. coli BetT provides choline to the characterized bet locus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli bet-locus/choline-transport source. Supports the concrete BetT route but does
      not establish substrate specificity of a KT2440 homolog merely from locus position.
- id: PMID:17322201
  title: Membrane topology and mutational analysis of the osmotically activated BetT choline transporter
    of Escherichia coli.
  findings:
  - statement: BetT is the major, osmotically activated choline carrier with 12 membrane-spanning segments.
    supporting_text: The major carrier of choline is the high-affinity, proton-driven, secondary transporter
      BetT, which belongs to the BCCT family of transporters.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli BetT topology and mutagenesis source. Protein topology and choline uptake are
      distinct evidence; no BCCT-wide cargo claim is made.
- id: PMID:39510372
  title: Purification and catalysis of choline dehydrogenase from Escherichia coli.
  findings:
  - statement: Purified E. coli BetA is a peripheral-membrane FAD enzyme that oxidizes choline to betaine
      aldehyde.
    supporting_text: highly pure E. coli CHDH could only oxidize choline to betaine aldehyde
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli BetA study. The first-step result takes precedence over earlier crude-membrane
      attribution for this target, but it is not a universal negative substrate test for all BetA homologs.
- id: PMID:2194570
  title: Purification and characterization of osmoregulatory betaine aldehyde dehydrogenase of Escherichia
    coli.
  findings:
  - statement: Purified E. coli BetB is NAD-dependent and highly specific for betaine aldehyde.
    supporting_text: The dehydrogenase was highly specific for betaine aldehyde.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified E. coli BetB source supports NAD-dependent betaine-aldehyde oxidation. Its
      reported specificity does not license untested negative substrate claims for Bacillus GbsA.
- id: PMID:3512526
  title: Selection, mapping, and characterization of osmoregulatory mutants of Escherichia coli blocked
    in the choline-glycine betaine pathway.
  findings:
  - statement: E. coli genetics establish the sequential choline-to-betaine pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli pathway-mutant source; physiological choline conversion supports pathway participation
      without claiming a physical BetA-BetB complex.
- id: PMID:14678796
  title: 'Cloning, sequence analysis, and purification of choline oxidase from Arthrobacter globiformis:
    a bacterial enzyme involved in osmotic stress tolerance.'
  findings:
  - statement: ATCC 8010 recombinant CodA characterization supports both choline and betaine-aldehyde
      substrate turnover. Exact AAP68832.1-to-Q7X2H8 sequence identity is documented in the CodA review.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary recombinant ATCC 8010 CodA characterization with exact 546/546 AAP68832.1-to-Q7X2H8
      identity. Both catalytic steps are supported; native cellular import and stress protection are separate
      claims.
- id: PMID:9297465
  title: 'Glycine betaine aldehyde dehydrogenase from Bacillus subtilis: characterization of an enzyme
    required for the synthesis of the osmoprotectant glycine betaine.'
  findings:
  - statement: Purified JH642-derived GbsA directly oxidizes betaine aldehyde and prefers NAD+ over NADP+;
      its tested substrate panel must not be expanded into unperformed negative assays.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted GbsA article inspected in its gene review. pJB009 connects the purified
      recombinant protein to JH642; its sequence matches P71016. NAD+ preference does not mean absolute
      NADP+ exclusion.
- id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  findings:
  - statement: KT2440 betBA genetics supports choline-to-betaine synthesis. It does not identify which
      BCCT paralog supplies choline or establish purified KT2440 BetA secondary activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct KT2440 physiology/genetics supports betBA-dependent synthesis; transporter identity
      and enzyme acceptor specificity are not resolved by that phenotype.
- id: PMID:34431198
  title: 'The choline dehydrogenase BetA of Acinetobacter baumannii: a flavoprotein responsible for osmotic
    stress protection.'
  findings:
  - statement: The ATCC19606 BetA preparation reportedly oxidized both substrates in a PMS-coupled assay.
      Oxygen consumption required PMS; this is not evidence that BetA directly reduces oxygen or that
      BetB is dispensable in native cells. The old 571-residue sequence and current 552-residue record
      differ at their N termini, and the cloned start remains unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher article and old/current official protein records inspected. PMS is essential
      to the oxygen-consumption assay; the highly enriched preparation also contained a peptidyl-prolyl
      isomerase. Native BetB dispensability is not demonstrated. The 19-residue N-terminal construct discrepancy
      remains unresolved, so no current exemplar is asserted.
- id: PMID:21658392
  title: The crystal structure of the substrate-binding protein OpuBC from Bacillus subtilis in complex
    with choline.
  findings:
  - statement: OpuBC directly binds choline in the characterized construct; sequence identity and terminal
      modifications are explicit.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: OpuBC choline-binding study. JH642 construct has signal-peptide/lipid-anchor changes
      and maps to Q45462 through PDB 3R6U. Binding supports the extracytoplasmic subunit role, not independent
      membrane transport.
- id: PMID:14690428
  title: Spectroscopic and kinetic properties of recombinant choline oxidase from Arthrobacter globiformis.
  findings:
  - statement: Recombinant CodA uses oxygen as primary electron acceptor, with kinetic observations on
      both choline and betaine aldehyde. The latter substrate-specific activity is required through its independently supported proposed molecular function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract explicitly identifies oxygen as acceptor and kinetic studies with both
      substrates. Recombinant provenance links to the exact ATCC 8010 CodA characterization; this is not
      evidence for its native uptake machinery.
- id: PMID:18156257
  title: Pseudomonas syringae BetT is a low-affinity choline transporter that is responsible for superior
    osmoprotection by choline over glycine betaine.
  findings:
  - statement: Functional Pseudomonas transporters are reported; the local unresolved BetT-I assignment
      must not be generalized into unknown specificity for every KT2440 BCCT paralog.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative transporter evidence is scoped in the BetT-I notes. It does not currently
      provide a checkable positive Q88CW9 assay in this panel. Its existence rules out the blanket assertion
      that all KT2440 paralog specificities are unknown.
