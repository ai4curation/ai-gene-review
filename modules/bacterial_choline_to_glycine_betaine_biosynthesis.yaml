id: MODULE:bacterial_choline_to_glycine_betaine_biosynthesis
title: Bacterial choline uptake and glycine betaine biosynthesis
description: Choline uptake followed by oxidation to glycine betaine in bacteria. Characterized import
  implementations include secondary BCCT transporters and ABC importers. The oxidative segment uses separate
  choline and betaine-aldehyde dehydrogenases, with GMC BetA and type III GbsB as distinct first-step
  implementations, or a CodA oxidase that performs both steps using oxygen. Glycine betaine can be retained
  as a compatible solute or feed downstream metabolism, depending on the organism and conditions.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:12007642
  title: 'Bacterial osmoadaptation: the role of osmolytes in bacterial stress and virulence.'
  statement: Comparative osmoadaptation review distinguishes compatible-solute uptake and synthesis across
    bacterial groups; detailed enzyme assignments require primary evidence.
- source_id: PMID:33613867
  title: 'Stressed out: Bacterial response to high salinity using compatible solute biosynthesis and uptake
    systems, lessons from Vibrionaceae.'
  statement: The Vibrionaceae review reports lineage-dependent betIBA distribution, including absence
    in the surveyed Cholerae clade, and alternative transporter organization. Bacteria-level scope therefore
    does not imply universal occurrence.
- source_id: PMID:23354714
  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  statement: Choline-derived betaine can be retained for protection or catabolized. The module ends at
    its formation without asserting a universal osmoprotective fate.
- &id004
  source_id: PMID:32951822
  title: Choline oxidases.
  statement: Choline oxidase performs both oxidation steps with oxygen as acceptor. A single CodA protein
    carrying both evidenced activities can therefore supply the oxidative segment, while cellular uptake
    is still a separate role.
  supporting_text: 'four-electron, two-step, flavin-mediated oxidation

    of choline to glycine betaine'
- &id002
  source_id: PMID:8752328
  title: 'Synthesis of the osmoprotectant glycine betaine in Bacillus subtilis: characterization of the
    gbsAB genes.'
  statement: Bacillus genetics and complementation establish GbsB/GbsA-dependent choline-to-betaine conversion.
    GbsB belongs to a type III alcohol-dehydrogenase family, distinct from GMC BetA; these data do not
    establish purified GbsB cofactor kinetics.
- &id001
  source_id: PMID:10216873
  title: Two evolutionarily closely related ABC transporters mediate the uptake of choline for synthesis
    of the osmoprotectant glycine betaine in Bacillus subtilis.
  statement: OpuB and OpuC are distinct four-subunit-type ABC importers with direct choline uptake evidence.
    This representative uses OpuB; related-family membership does not identify cargo or permit substitution
    of arbitrary subunits.
notes: 'The boundary retains extracellular choline uptake and ends at glycine betaine. Direct betaine
  uptake, de novo glycine methylation, downstream demethylation, BetI regulation and choline-O-sulfate
  hydrolysis are outside it. Transporter alternatives are representative characterized implementations,
  not an exhaustive inventory of every bacterial importer. OpuC, Cbc and ProU architectures reported in
  comparative literature are not excluded biologically. Missing exact native uptake machinery remains
  an evidence gap. A Boolean route represents role coverage, not cross-species complex assembly or guaranteed
  native expression. A dual-substrate assay of a BetA preparation does not establish native BetB dispensability.
  CodA is represented by two explicit activities: GO:0033713 for choline oxidation and a proposed substrate-specific
  betaine-aldehyde:oxygen oxidoreductase activity for the second oxidation. Neither a family match nor the first activity
  alone establishes both. Capacity evaluation must require independently curated betaine-aldehyde:oxygen
  activity for the second CodA step; a generic aldehyde-oxidase GO annotation and family membership do
  not establish that substrate.'
