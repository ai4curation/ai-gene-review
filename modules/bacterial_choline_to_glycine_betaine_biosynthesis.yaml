id: MODULE:bacterial_choline_to_glycine_betaine_biosynthesis
title: Bacterial choline uptake and glycine betaine biosynthesis
description: >-
  A reusable bacterial module for choline uptake followed by its two-step
  oxidation to the compatible solute glycine betaine. A BCCT-family BetT
  transporter imports choline, the FAD-dependent, membrane-associated
  choline dehydrogenase BetA oxidizes choline to betaine aldehyde using a
  respiratory electron acceptor, and the soluble NAD-dependent
  betaine-aldehyde dehydrogenase BetB oxidizes the aldehyde to glycine
  betaine. The route was defined genetically and biochemically in
  Escherichia coli K-12. It is conserved in Pseudomonas, where P. putida
  KT2440 requires betBA for glycine-betaine synthesis from choline, and in
  other proteobacteria and Gram-positive bacteria that carry betA and betB.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_choline_to_glycine_betaine_biosynthesis__upa00529-deep-research-openscientist.md
    title: OpenScientist review of the module, UPA00529, and PSEPK
    statement: >-
      The resolved species-aware review marks all three steps covered, recovers
      BetT-I, BetA, and BetB despite their omission from the UniPathway bucket,
      and keeps BetI outside the catalytic module.
  - source_id: GO:0031456
    title: glycine betaine biosynthetic process
    statement: >-
      GO:0031456 grounds the module. The route-specific term GO:0019285
      (glycine betaine biosynthetic process from choline) was obsoleted in GO
      release 2026-05-19 with replaced_by GO:0031456; the module structure,
      not the term, records that the route runs through choline oxidation.
  - source_id: PMID:3512526
    title: >-
      Selection, mapping, and characterization of osmoregulatory mutants of
      Escherichia coli blocked in the choline-glycine betaine pathway
    statement: >-
      E. coli defines the two-step route choline to betaine aldehyde to glycine
      betaine; betA mutants cannot use choline for osmoprotection.
    supporting_text: "Osmotically stressed Escherichia coli cells synthesize the osmoprotectant glycine betaine by oxidation of choline through glycine betaine aldehyde"
  - source_id: PMID:1956285
    title: >-
      DNA sequence and analysis of the bet genes encoding the osmoregulatory
      choline-glycine betaine pathway of Escherichia coli
    statement: >-
      Direct E. coli evidence establishes BetT as a proton-motive-force-driven,
      high-affinity choline transport system encoded divergently from betIBA.
    supporting_text: "betT encoding a proton-motive-force-driven, high-affinity transport system for choline"
  - source_id: PMID:39510372
    title: Purification and catalysis of choline dehydrogenase from Escherichia coli
    statement: >-
      Purified E. coli BetA oxidizes choline to betaine aldehyde but not
      betaine aldehyde to glycine betaine, so the second step needs BetB.
    supporting_text: "highly pure E. coli CHDH could only oxidize choline to betaine aldehyde but failed to further oxidize betaine aldehyde to betaine"
  - source_id: PMID:2194570
    title: >-
      Purification and characterization of osmoregulatory betaine aldehyde
      dehydrogenase of Escherichia coli
    statement: >-
      Purified E. coli BetB is an NAD-dependent, betaine-aldehyde-specific,
      salt-tolerant homotetramer.
    supporting_text: "The dehydrogenase was highly specific for betaine aldehyde."
  - source_id: PMID:17116241
    title: >-
      Uncoupling of choline-O-sulphate utilization from osmoprotection in
      Pseudomonas putida
    statement: >-
      Direct KT2440 genetic and biochemical evidence shows that betBA is
      required for conversion of choline to glycine betaine and separates this
      route from BetC-dependent choline-O-sulphate utilization.
    supporting_text: "the betBA genes were required for choline transformation into the highly effective compatible solute glycine betaine"
  - source_id: PMID:26913973
    title: >-
      The revisited genome of Pseudomonas putida KT2440 enlightens its value as
      a robust metabolic chassis
    statement: >-
      The KT2440 genome reconstruction provides pathway and locus context, but
      its cached abstract does not expose a checkable BetT-I substrate
      assignment.
  - source_id: file:ECOLI/betT/betT-ai-review.yaml
    title: ECOLI betT gene review
    statement: >-
      P0ABC9 is accepted as the plasma-membrane choline transmembrane
      transporter (EXP) and is the exemplar for the choline-uptake selector.
  - source_id: file:ECOLI/betA/betA-ai-review.yaml
    title: ECOLI betA gene review
    statement: >-
      P17444 is curated as the peripheral plasma-membrane choline
      dehydrogenase; its NAD+ betaine-aldehyde dehydrogenase IEA is removed and
      recorded as a UniProt/HAMAP source defect.
  - source_id: file:ECOLI/betB/betB-ai-review.yaml
    title: ECOLI betB gene review
    statement: >-
      P17445 is curated as the cytosolic NAD-dependent betaine-aldehyde
      dehydrogenase (IDA) in glycine betaine biosynthesis.
  - source_id: file:PSEPK/betT-I/betT-I-ai-review.yaml
    title: PSEPK betT-I gene review
    statement: >-
      Q88CW9 is curated as a BCCT-family transporter adjacent to betIBA;
      choline uptake remains a candidate substrate rather than a verified
      gene-level annotation.
  - source_id: file:PSEPK/betA/betA-ai-review.yaml
    title: PSEPK betA gene review
    statement: >-
      Q88CW6 is curated as the FAD-dependent choline dehydrogenase that produces
      betaine aldehyde.
  - source_id: file:PSEPK/betB/betB-ai-review.yaml
    title: PSEPK betB gene review
    statement: >-
      Q88CW7 is curated as the dedicated NAD-dependent betaine-aldehyde
      dehydrogenase.
  - source_id: file:interpro/panther/PTHR11552/PTHR11552-review.yaml
    title: PTHR11552 GMC oxidoreductase family review
    statement: >-
      BetA belongs to PTHR11552:SF147, which also holds non-choline GMC
      enzymes, so the BetA step is grounded on NCBIfam TIGR01810 (InterPro IPR011533) instead.
  - source_id: file:interpro/panther/PTHR11699/PTHR11699-review.yaml
    title: PTHR11699 aldehyde dehydrogenase family review
    statement: >-
      E. coli and P. aeruginosa BetB sit in PTHR11699:SF228 together with
      vertebrate ALDH9A1; the BetB clade node PTN000193442 carries GO:0008802.
  - source_id: file:interpro/panther/PTHR30047/PTHR30047-review.yaml
    title: PTHR30047 BCCT family review
    statement: >-
      The BCCT family and its SF7 subfamily carry choline, glycine betaine,
      ectoine and trimethylamine, so choline uptake is selected by orthology to
      E. coli BetT rather than by family membership.
notes: >-
  The module begins with extracellular choline and ends with intracellular
  glycine betaine. Direct glycine-betaine uptake, downstream demethylation
  and catabolism, BetI and ArcA regulation, and alternative choline
  transporters (for example ABC-type CbcXWV) are outside the boundary. The
  two oxidation steps are performed by enzymes from unrelated families (GMC
  oxidoreductase BetA and aldehyde dehydrogenase BetB), so each step has its
  own family selector. Both selectors use the NCBIfam equivalog families
  TIGR01810 (betA; integrated in InterPro IPR011533) and TIGR01804 (BADH;
  IPR011264), which all four representatives carry, rather than PANTHER
  subfamilies. PTHR11552:SF147 also contains ecdysone oxidase, fatty-acid
  photodecarboxylase and other non-choline enzymes, and PTHR11699:SF228
  joins BetB with vertebrate ALDH9A1 while P. putida BetB carries only a
  family-level PANTHER assignment. BetA was once described as bifunctional
  because crude E. coli membranes oxidized both choline and betaine aldehyde
  at similar rates (PMID:3512525). Purified E. coli BetA does not oxidize
  betaine aldehyde (PMID:39510372). Acinetobacter baumannii BetA does
  oxidize it in vitro (PMID:34431198). That paper does not name the
  acceptor; our inference is that it is not NAD+, because BetA is a GMC
  flavoprotein with an FAD site and no NAD-binding site. The NAD-dependent
  step is therefore assigned to BetB only, and the HAMAP-propagated
  GO:0008802 annotations on BetA are removed in the E. coli and P. putida
  gene reviews. Choline uptake uses an ORTHOLOG_OF selector anchored on E.
  coli BetT. P. putida KT2440 BetT-I (Q88CW9), the BCCT paralog next to
  betIBA, is a candidate member, not a grounded one, until its substrate is
  measured.
