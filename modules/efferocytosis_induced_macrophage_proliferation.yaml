      - preferred_term: Mammalia
        term:
          id: NCBITaxon:40674
          label: Mammalia
        notes: Shown in mouse (mechanism) and in human monocyte-derived macrophages (phenotype).
    cell_types:
      - preferred_term: macrophage
        term:
          id: CL:0000235
          label: macrophage
  parts:
    - order: 1
      role: cargo DNA digestion
      node:
        id: cargo_dna_digestion
        label: Digestion of apoptotic-cell DNA in the phagolysosome
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Lysosomal DNase II cuts the engulfed cell's DNA into oligonucleotides.
          This step makes the signal, so the programme needs phagolysosome
          formation as well as DNase II itself.
        concepts:
          - preferred_term: DNA catabolic process
            term:
              id: GO:0006308
              label: DNA catabolic process
        annotons:
          - id: dnase2_cargo_dna
            label: DNase II digests apoptotic-cell DNA
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DNase II alpha
                term:
                  id: PANTHER:PTHR10858:SF9
                  label: DEOXYRIBONUCLEASE-2-ALPHA
                representative_members:
                  - preferred_term: Dnase2 (mouse)
                    term:
                      id: UniProtKB:P56542
                      label: Deoxyribonuclease-2-alpha
                  - preferred_term: DNASE2 (human)
                    term:
                      id: UniProtKB:O00115
                      label: Deoxyribonuclease-2-alpha
            function:
              preferred_term: deoxyribonuclease II activity
              term:
                id: GO:0004531
                label: deoxyribonuclease II activity
            locations:
              - preferred_term: phagolysosome
                term:
                  id: GO:0032010
                  label: phagolysosome
            role_description: >-
              Makes the oligonucleotide signal from engulfed DNA. Its knockdown
              blocks proliferation after efferocytosis but not uptake, and blocks
              the response to DNA-loaded red cells.
            evidence:
              - source_id: PMID:34784501
                title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
                statement: The proliferative signal comes from phagolysosomal hydrolysis of apoptotic-cell DNA.
                supporting_text: We found that nucleotides derived from the phagolysosomal hydrolysis of AC-DNA during efferocytosis triggers a signaling pathway that promotes the proliferation of pro-resolving macrophages.
    - order: 2
      role: oligonucleotide-triggered kinase signalling
      node:
        id: dna_pk_mtorc2_signaling
        label: DNA-PKcs, mTORC2 and AKT signalling
        module_type: SIGNALING_PATHWAY
        description: >-
          Cargo-derived oligonucleotides activate DNA-PKcs, which acts upstream
          of mTORC2. mTORC2 phosphorylates AKT on Ser473, and AKT signalling
          raises MYC. Phosphorylation of DNA-PKcs after efferocytosis depends on
          DNase II.
        concepts:
          - preferred_term: TORC2 signaling
            term:
              id: GO:0038203
              label: TORC2 signaling
        annotons:
          - id: dna_pkcs_sensor
            label: DNA-PKcs activated by cargo oligonucleotides
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DNA-PK catalytic subunit
                term:
                  id: PANTHER:PTHR11139:SF68
                  label: DNA-DEPENDENT PROTEIN KINASE CATALYTIC SUBUNIT
                representative_members:
                  - preferred_term: Prkdc (mouse)
                    term:
                      id: UniProtKB:P97313
                      label: DNA-dependent protein kinase catalytic subunit
                  - preferred_term: PRKDC (human)
                    term:
                      id: UniProtKB:P78527
                      label: DNA-dependent protein kinase catalytic subunit
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000124197
                    term:
                      id: PANTHER:PTN000124197
                      label: PTN000124197
                    description: >-
                      Root PAINT IBD node of PTHR11139 propagating F:GO:0004674
                      protein serine/threonine kinase activity, with PRKDC
                      (P78527) and mouse Prkdc (MGI:MGI:104779) among the seeds.
                      It supports the parent kinase activity, not the
                      DNA-dependent activity asserted here.
