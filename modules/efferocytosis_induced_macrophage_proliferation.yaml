id: MODULE:efferocytosis_induced_macrophage_proliferation
title: Efferocytosis-induced macrophage proliferation
description: >-
  After a macrophage engulfs an apoptotic cell, it can divide. Two signals
  converge to make it do so. Lysosomal DNase II digests the engulfed cell's DNA
  in the phagolysosome, and the resulting oligonucleotides activate DNA-PKcs,
  then mTORC2 and AKT. Separately, GAS6 bound to the apoptotic cell activates
  the MERTK receptor tyrosine kinase and ERK1/2. Both routes raise MYC, which
  induces the transcription factor BHLHE40. BHLHE40 represses the
  anti-proliferative factor c-MAF, and the macrophage enters the cell cycle. The
  daughter cells keep clearing apoptotic cells, so the programme expands the
  pool of pro-resolving macrophages at sites of injury.
status: DRAFT
scope: ABSTRACT
references:
  - id: PMID:34784501
    title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached and read in full. Defines the
        programme and its controls in mouse BMDMs, dexamethasone-treated thymus
        and atherosclerosis regression. The mechanism rests mainly on siRNA,
        with Rictor deletion in bone marrow and nanoparticle siRNA in vivo.
evidence:
  - source_id: PMID:34784501
    title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
    statement: >-
      The programme is triggered by digestion of the engulfed apoptotic cell,
      not by phagocytosis as such. Red cells, which have no DNA, are engulfed
      without effect, while red cells loaded with DNA trigger proliferation.
    supporting_text: However, the macrophages that ingested IgG-RBCs did not show this response even though the uptake was similar to that of ACs
  - source_id: PMID:34784501
    title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
    statement: DNA loaded into red cells is enough to trigger proliferation, and this depends on DNase II.
    supporting_text: The DNA-loaded IgG-RBCs were able to stimulate macrophage EdU incorporation compared with unloaded IgG-RBCs, and this proliferative response was blunted in macrophages treated with siDnase2a
  - source_id: PMID:34784501
    title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
    statement: >-
      Blocking phagolysosomal degradation does not block CSF1-driven
      proliferation, so the effect is specific to the cargo route.
    supporting_text: As an important control, we showed that CSF1-induced macrophage proliferation, which should not involve phagolysosomes, was not blocked by bafilomycin
notes: >-
  Boundary: this module starts with apoptotic-cell DNA in the phagolysosome and
  with GAS6-bound apoptotic cells at the macrophage surface, and ends with
  macrophage proliferation. Engulfment, phagosome maturation and the rest of
  cargo digestion belong to the phagocytosis modules
  (MODULE:phagocytic_engulfment, MODULE:phagosome_maturation). RUBCN and the
  V-ATPase are needed for this programme only because they are needed for
  phagolysosome formation, so they are not participants here.

  GO has no term for this programme. The closest is GO:0061517 macrophage
  proliferation, used as the module concept. The term "efferocytosis-induced
  macrophage proliferation" (is_a GO:0061517, preceded_by GO:0043277) has been
  proposed to the GO editors in go-ontology#32748.

  Taxon scope: the programme is shown in mouse and its proliferative phenotype in
  human monocyte-derived macrophages. DNase II and RICTOR are conserved across
  animals, but DNA-PKcs is absent from some animal lineages, so the
  DNA-sensing route cannot be assumed outside vertebrates (see knowledge gaps).
module:
  id: efferocytosis_induced_macrophage_proliferation
  label: Efferocytosis-induced macrophage proliferation
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: macrophage proliferation
      term:
        id: GO:0061517
        label: macrophage proliferation
      notes: >-
        Output process. A specific term, efferocytosis-induced macrophage
        proliferation, has been proposed to GO (go-ontology#32748).
  context:
