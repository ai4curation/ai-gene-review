knowledge_gaps:
  - gap_statement: >-
      How cargo-derived oligonucleotides from the phagolysosome reach and
      activate DNA-PKcs is unknown.
    boundary: >-
      DNA-PKcs phosphorylation after efferocytosis depends on DNase II, and
      DNA-PKcs knockdown blocks the programme, but direct binding of the
      oligonucleotides and the route out of the phagolysosome were not shown.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: The sensor step is inferred, so the DNA-PKcs annoton rests on a requirement, not a mechanism.
    resolution: >-
      Test binding of labelled cargo oligonucleotides to DNA-PK in efferocytosing
      macrophages, use a kinase-dead DNA-PKcs, and test whether the Ku subunits
      are needed.
    provenance:
      - reference_id: PMID:34784501
        supporting_text: Further, phosphorylation of DNA-PKcs, which is a marker of its activation, was increased in AC+ versus AC− macrophages, and this increase was completely abrogated by siDnase2a
  - gap_statement: >-
      Whether efferocytosis drives phagocyte proliferation outside mammals is
      unknown.
    boundary: >-
      The programme is shown in mouse. DNase II and RICTOR are conserved across
      animals, but DNA-PKcs is missing from some animal lineages, so any
      equivalent programme there would need a different sensor.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: Limits the taxonomic scope of the module.
    resolution: >-
      Map the presence of PRKDC across animals and test for proliferation of
      corpse-engulfing phagocytes in zebrafish and in a lineage without
      DNA-PKcs.
    provenance:
      - reference_id: PMID:34784501
        supporting_text: We found that nucleotides derived from the phagolysosomal hydrolysis of AC-DNA during efferocytosis triggers a signaling pathway that promotes the proliferation of pro-resolving macrophages.
