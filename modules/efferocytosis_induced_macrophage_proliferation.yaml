                      - source_id: GO_REF:0000033
                        statement: IBD propagation of protein serine/threonine kinase activity from PAINT node PTN000124197 in PTHR11139.
            function:
              preferred_term: DNA-dependent protein kinase activity
              term:
                id: GO:0004677
                label: DNA-dependent protein kinase activity
            role_description: >-
              Proposed sensor of the cargo oligonucleotides. Its knockdown
              blocks proliferation and AKT Ser473 phosphorylation. Direct binding
              of the oligonucleotides was not shown.
            evidence:
              - source_id: PMID:34784501
                title: Efferocytosis induces macrophage proliferation to help resolve tissue injury.
                statement: DNA-PKcs is activated after efferocytosis, and this needs DNase II.
                supporting_text: Further, phosphorylation of DNA-PKcs, which is a marker of its activation, was increased in AC+ versus AC− macrophages, and this increase was completely abrogated by siDnase2a
          - id: mtorc2_kinase
