id: MODULE:efp_translation_stall_rescue
title: EF-P translation stall rescue
description: >-
  Species-neutral bacterial module for elongation factor P-dependent rescue of
  cytosolic ribosomes that stall while translating consecutive proline residues.
  EF-P is universal in bacteria and is the ortholog of archaeal aIF5A and
  eukaryotic eIF5A, whose hypusine-activated stall rescue is the same biology in
  another domain of life and is modelled separately. The module has three roles:
  lineage-specific activation of EF-P by post-translational modification of its
  loop-1 tip residue, engagement of the stalled ribosome, and stimulation of
  peptide-bond formation so elongation resumes. The activating chemistry differs
  by lineage and is modelled as a variant set over three characterized routes:
  EpmA/EpmB/EpmC (R)-beta-lysylation and hydroxylation of Lys34 in Escherichia
  coli and Salmonella, EarP rhamnosylation of Arg32 in Pseudomonas and
  Shewanella, and 5-aminopentanolylation of Lys32 in Bacillus subtilis.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:23239623
    title: Translation elongation factor EF-P alleviates ribosome stalling at polyproline stretches.
    statement: >-
      Establishes the module's core biology and its bacteria-wide scope: EF-P is
      present in all bacteria, is orthologous to aIF5A/eIF5A, and relieves
      ribosome stalling at polyproline stretches.
    supporting_text: >-
      EF-P is present in all bacteria and orthologous to archaeal and
      eukaryotic initiation factor 5A
  - source_id: PMID:23239624
    title: EF-P is essential for rapid synthesis of proteins containing consecutive proline residues.
    statement: >-
      Gives the mechanism asserted by the stall-rescue annoton: EF-P acts on the
      peptidyl-transferase centre rather than on the mRNA or the nascent chain.
    supporting_text: >-
      EF-P promotes peptide-bond formation and stabilizes the peptidyl-transfer
      RNA in the catalytic center of the ribosome.
  - source_id: PMID:25686373
    title: Arginine-rhamnosylation as new strategy to activate translation elongation factor P.
    statement: >-
      The basis for modelling activation as a variant set: EF-P rescues stalled
      ribosomes only once post-translationally activated, and the pseudomonad
      route (EarP arginine rhamnosylation) is chemically unrelated to the
      enterobacterial lysine route.
    supporting_text: >-
      In bacteria, translation elongation factor P (EF-P) rescues such stalled
      ribosomes, but only when it is post-translationally activated.
  - source_id: PMID:28787546
    title: Carbonyl reduction by YmfI in Bacillus subtilis prevents accumulation of an inhibitory EF-P modification state.
    statement: >-
      Supports the third activation variant and the decision to make the
      activation part optional: B. subtilis carries a 5-aminopentanol
      modification installed by a third route, and its EF-P retains function
      even unmodified.
    supporting_text: >-
      B. subtilis encodes the first EF-P ortholog that retains function in the
      absence of modification
  - source_id: GO:0072344
    title: rescue of stalled cytosolic ribosome
    statement: >-
      The specific process term for the module's output; EF-P relieves stalls at
      polyproline-containing motifs during cytosolic translation.
  - source_id: PANTHER:PTHR30053
    title: PANTHER elongation factor P family
    statement: >-
      Grounds the EF-P roles as a family-level claim. Canonical EF-P members sit
      in subfamily PTHR30053:SF12, which contains all three of the module's
      reviewed exemplars (P0A6N4, Q88LS0, P49778); the paralogous EfpL/YeiP
      lineage is PTHR30053:SF14 and is outside the module core.
  - source_id: file:interpro/panther/PTHR30053/PTHR30053-review.yaml
    title: Curated PTHR30053 family review
    statement: >-
      Assesses the PAINT node PTN000769376 as SOUND for translation elongation
      factor activity, scopes ribosome binding family-wide, and restricts
      polyproline stall rescue to SF12.
  - source_id: file:interpro/panther/PTHR42918/PTHR42918-review.yaml
    title: Curated PTHR42918 family review
    statement: >-
      Records why the enterobacterial activation variant is not grounded on a
      PANTHER family: PTHR42918 is dominated by canonical lysyl-tRNA
      synthetases, and only subfamily SF6 performs EF-P beta-lysylation.
  - source_id: file:interpro/panther/PTHR30538/PTHR30538-review.yaml
    title: Curated PTHR30538 family review
    statement: >-
      Records why EpmB is grounded as a concrete protein rather than by family:
      the same subfamily holds both the EF-P-dedicated EpmB orthologs and the
      metabolic (3S)-forming KamA aminomutases.
  - source_id: file:interpro/panther/PTHR42879/PTHR42879-review.yaml
    title: Curated PTHR42879 family review
    statement: >-
      Records that YmfI sits in the FabG-dominated SF2 on fold similarity only,
      and that the fatty-acid-elongation PAINT node over-propagates to it.
  - source_id: file:PSEPK/efp/efp-ai-review.yaml
    title: Curated efp review (PSEPK)
    statement: >-
      Accepts translation elongation factor activity, translational elongation,
      cytosolic localization and stalled-ribosome rescue as core for the
      P. putida exemplar, with regulation of translation and peptide
      biosynthetic process retained as non-core context.
  - source_id: file:ECOLI/efp/efp-ai-review.yaml
    title: Curated efp review (ECOLI)
    statement: >-
      The reviewed E. coli exemplar: core translation elongation factor activity
      with translational elongation and stalled-ribosome rescue, and ribosome
      binding retained as non-core.
  - source_id: file:BACSU/efp/efp-ai-review.yaml
    title: Curated efp review (BACSU)
    statement: >-
      The reviewed B. subtilis exemplar, which carries the third activation
      chemistry and is the one EF-P known to retain activity when unmodified.
  - source_id: file:modules/efp_translation_stall_rescue-deep-research-openscientist.md
    title: OpenScientist module research for EF-P translation stall rescue
    statement: >-
      Module-level provider research supporting EF-P as a conserved translation
      factor that rescues polyproline and related elongation stalls, with
      lineage-specific activation chemistry.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__efp_translation_stall_rescue__upa00345-deep-research-openscientist.md
    title: OpenScientist PSEPK UPA00345 pathway satisfiability review
    statement: >-
      The PSEPK-specific report finds the EF-P step satisfied by
      efp/PP_1858/Q88LS0, with no EfpL/YeiP paralog, EpmA/EpmB/EpmC absent from
      KT2440 as expected, and EarP-dependent rhamnosylation as the local
      activation route.
notes: >-
  Boundary and generalization decision (2026-11-02). The reusable module is the
  bacteria-wide EF-P stall-rescue mechanism, not the P. putida instance: the
  earlier draft was written around the local UniPathway UPA00345 bucket and
  named KT2440 in its scope, which made a universal factor look pseudomonad-
  specific. KT2440 efp is now one of three reviewed exemplars (with E. coli
  P0A6N4 and B. subtilis P49778), all in PANTHER subfamily PTHR30053:SF12, and
  the module label, description and context are species-neutral.

  The activating modification was previously declared adjacent context. That was
  the wrong call for a reusable module: activation is what makes EF-P competent
  for the rescue step in most lineages, and the three characterized chemistries
  are alternative implementations of one role, which is exactly what
  `variant_sets` are for. They are modelled as a ROUTE variant set (the
  activities differ: an aminomutase plus a lysyl ligase plus a hydroxylase, a
  rhamnosyltransferase, or a carbonyl reductase), with EXACTLY_ONE selection
  because no organism is known to run two of them. The enclosing part is
  `optional` because B. subtilis EF-P retains function when unmodified and many
  bacteria have no identified EF-P modification system at all, so an organism
  that satisfies the EF-P step without any activation route is a real case, not
  a gap.

  What remains outside the module: dTDP-L-rhamnose supply (rml/rfb) for the EarP
  route, the free-lysine supply for EpmB, the upstream genes that build the
  B. subtilis 5-aminopentanone donor (ynbB, gsaB), and the downstream phenotypes
  that EF-P loss produces (swarming motility, acid resistance, virulence). These
  are substrate supply, separate pathways, or consequences of translating
  individual polyproline proteins, not parts of the rescue mechanism.

  EfpL/YeiP is deliberately outside the module core. It is a real paralog that
  resolves an overlapping but not identical set of arrest motifs, and its own
  loop-tip arginine is unmodified, so it is neither a second copy of the EF-P
  role nor a user of the activation routes modelled here; organisms that encode
  it should have it modelled explicitly.

  EpmB asserts no function and no process. It supplies free (R)-beta-lysine and
  never touches EF-P, so by the participation test in CLAUDE.md it is not
  involved in the modification process; its own gene review marks GO:0043687
  over-annotated for that reason, and asserting the term here would have
  contradicted the review in machine-readable form. The donor-supply role is
  carried by role_description until GO has a term for the reaction.

  Compartment granularity is deliberately mixed. The module context and the
  EF-P, EpmA and EarP annotons use GO:0005829 cytosol, which their gene reviews
  support (E. coli EF-P and EpmA each have a cytosol row with direct evidence).
  The EpmC and YmfI annotons use the parent GO:0005737 cytoplasm, because those
  two reviews add cytoplasm as a curator inference (IC) with no fractionation
  data behind it; claiming cytosol for them would assert more than the evidence
  carries.

  GO:0072344 is the module's central process term and is the term GO and the
  EF-P/eIF5A literature use, but its definition speaks of freeing the ribosome
  from the stalled translation complex, whereas EF-P relieves the stall so that
  the same ribosome resumes elongation. The term is kept because it is the
  established one and no better term exists; the BACSU efp review raises the
  definition mismatch as a question for the ontology, and this module inherits
  that caveat rather than inventing a replacement.

  Member review status. Seven of the eight member reviews are status COMPLETE.
  PSEPK efp is left at DRAFT deliberately: its content meets the bar (all seven
  annotations reviewed, core function present, validation passes), but its only
  outstanding item is that no annotation cites its deep-research file, and that
  file (efp-deep-research-asta.md) is a retrieval artifact whose papers are about
  other subjects entirely, with nothing about EF-P to quote. Citing it to clear
  the warning would be padding, so the warning stands and the status is left for
  whoever re-runs provider research on that gene.

  Grounding choices. The EF-P roles are grounded on PTHR30053:SF12, verified in
  interpro/panther/panther.obo and in the PANTHER member index, with all three
  exemplars classified at exactly that subfamily. The activation enzymes are
  grounded as concrete UniProt gene products instead of by family, because each
  of their PANTHER families (PTHR42918 for EpmA, PTHR30538 for EpmB, PTHR42879
  for YmfI) is dominated by a different activity and would make a false
  family-level claim; all three families nevertheless have full reviews recording
  that judgment, and EpmC has no PANTHER family at all. EpmB's annoton carries no
  GO molecular function because GO has no term for the (R)-beta-lysine-forming
  reaction (RHEA:44148); the epmB gene review proposes one, and the id should be
  filled in here once GO creates it.
module:
  id: efp_translation_stall_rescue
  label: EF-P translation stall rescue
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: rescue of stalled cytosolic ribosome
      term:
        id: GO:0072344
        label: rescue of stalled cytosolic ribosome
      description: >-
        The module's output: relieving cytosolic ribosomes stalled at
        polyproline-containing motifs so elongation resumes.
    - preferred_term: translational elongation
      term:
        id: GO:0006414
        label: translational elongation
      description: The phase of protein biosynthesis in which EF-P acts.
  context:
    taxa:
      - preferred_term: Bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          EF-P is the bacterial member of the family and is present in all
          bacteria. The archaeal aIF5A and eukaryotic eIF5A orthologs perform
          the same stall rescue with hypusine-based activation and belong to a
          different PANTHER family; they are outside this module.
        evidence:
          - source_id: PMID:23239623
            statement: >-
              EF-P is reported as universal in bacteria and orthologous to the
              archaeal/eukaryotic initiation factor 5A.
            supporting_text: >-
              EF-P is present in all bacteria and orthologous to archaeal and
              eukaryotic initiation factor 5A
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          EF-P and its activating enzymes are soluble cytosolic proteins acting
          on cytosolic 70S ribosomes.
  parts:
    - order: 1
      optional: true
      role: >-
        Lineage-specific post-translational activation of EF-P at the loop-1 tip
        residue
      notes: >-
        Optional at the module level: B. subtilis EF-P works when unmodified and
        many bacteria encode no known EF-P modification system, so an organism
        can satisfy the EF-P step with no activation route present. Where a route
        is present, it is required for full activity of that organism's EF-P.
      node:
        id: efp_activation
        label: EF-P activation by post-translational modification
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Covalent modification of the residue at the tip of EF-P domain I
          loop 1, which reaches the peptidyl-transferase centre and is required
          for efficient stall rescue in the lineages that use it. The chemistry
          and the enzymes differ by lineage.
        evidence:
          - source_id: PMID:25686373
            statement: >-
              EF-P rescues stalled ribosomes only once post-translationally
              activated, and the enterobacterial and pseudomonad routes modify
              different residues with unrelated chemistry.
            supporting_text: >-
              In Escherichia coli, activation of EF-P is achieved by
              (R)-β-lysinylation and hydroxylation of a conserved lysine.
        variant_sets:
          - id: efp_activation_chemistry
            label: EF-P activating modification chemistry
            axis: lineage-specific EF-P modification chemistry
            variant_kind: ROUTE
            selection: EXACTLY_ONE
            notes: >-
              Three characterized routes. No organism is known to use more than
              one, and the enzymes are not homologous between routes, so these
              are alternative routes rather than alternative carriers of one
              activity.
            variants:
              - id: efp_beta_lysylation_route
                label: EpmA/EpmB/EpmC (R)-beta-lysylation of EF-P Lys34
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  The enterobacterial route (E. coli, Salmonella and relatives):
                  EpmB isomerizes free L-lysine to (R)-beta-lysine, EpmA ligates
                  it to the epsilon-amino group of EF-P Lys34 in an
                  ATP-dependent reaction, and EpmC hydroxylates the modified
                  residue in a final, smaller-effect step.
                evidence:
                  - source_id: PMID:22706199
                    statement: >-
                      Establishes EpmC/YfcM as the third enzyme of this route,
                      after the EpmB and EpmA steps.
                    supporting_text: >-
                      the currently accepted Escherichia coli EF-P modification
                      pathway is incomplete and lacks a final hydroxylation step
                      mediated by YfcM
                annotons:
                  - id: epmb_beta_lysine_supply
                    label: EpmB (R)-beta-lysine formation
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: epmB (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P39280
                          label: L-lysine 2,3-aminomutase
                        description: >-
                          Radical SAM, pyridoxal 5'-phosphate-dependent
                          aminomutase that makes the (R)-beta-lysine donor.
                    role_description: >-
                      Supplies the (R)-beta-lysine that EpmA transfers, and does
                      nothing else in this step: EpmB acts on free lysine, not on
                      EF-P, so it performs none of the work of modifying the
                      protein. This annoton therefore asserts no process term
                      either, matching the epmB gene review, which marks
                      GO:0043687 over-annotated on exactly those participation
                      grounds. It also asserts no molecular function: GO:0050066
                      names the (3S)-forming clostridial reaction, and the
                      (R)-beta-lysine-forming reaction EpmB catalyses
                      (RHEA:44148) has no GO term, which the epmB gene review
                      records as a proposed new term.
                    evidence:
                      - source_id: PMID:17042480
                        statement: >-
                          The E. coli enzyme makes the (R) enantiomer, which is
                          why the existing lysine 2,3-aminomutase term does not
                          describe it.
                        supporting_text: >-
                          The product of the E. coli enzyme is (R)-beta-lysine,
                          the enantiomer of the clostridial product.
                  - id: epma_beta_lysyl_transfer
                    label: EpmA beta-lysyl transfer to EF-P Lys34
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: epmA (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P0A8N7
                          label: Elongation factor P--(R)-beta-lysine ligase
                        description: >-
                          Truncated lysyl-tRNA synthetase paralog that has lost
                          tRNA recognition and acts on the tRNA-mimic EF-P.
                    function:
                      preferred_term: protein-lysine lysyltransferase activity
                      term:
                        id: GO:0052868
                        label: protein-lysine lysyltransferase activity
                      targets:
                        - preferred_term: EF-P Lys34
                          description: >-
                            The epsilon-amino group of the conserved lysine at
                            the tip of EF-P loop 1.
                      evidence:
                        - source_id: PMID:21841797
                          statement: >-
                            EpmA/PoxA modifies EF-P with (R)-beta-lysine and
                            cannot charge tRNA, so the activity is protein
                            lysylation rather than aminoacylation.
                          supporting_text: PoxA cannot aminoacylate tRNALys
                    processes:
                      - preferred_term: post-translational protein modification
                        term:
                          id: GO:0043687
                          label: post-translational protein modification
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      ATP-dependent ligation of (R)-beta-lysine onto EF-P
                      Lys34; the step that makes enterobacterial EF-P competent
                      for stall rescue.
                  - id: epmc_hydroxylation
                    label: EpmC hydroxylation of beta-lysylated EF-P
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: epmC (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P76938
                          label: Elongation factor P lysine hydroxylase
                        description: >-
                          Non-heme-iron hydroxylase acting on the modified
                          Lys34 of EF-P.
                    function:
                      preferred_term: >-
                        NAD(P)H-dependent monooxygenase hydroxylating modified
                        EF-P Lys34
                      term:
                        id: GO:0016709
                        label: >-
                          oxidoreductase activity, acting on paired donors, with
                          incorporation or reduction of molecular oxygen, NAD(P)H
                          as one donor, and incorporation of one atom of oxygen
                      description: >-
                        The most specific existing GO term for the EpmC
                        reaction (EC 1.14.13.-); no term names the EF-P
                        (beta-lysyl)lysine hydroxylase reaction itself.
                      targets:
                        - preferred_term: beta-lysylated EF-P Lys34
                          description: >-
                            The oxygen is added to Lys34 itself, giving a
                            peptidyl-hydroxylysine, not to the appended
                            beta-lysine.
                    processes:
                      - preferred_term: peptidyl-lysine hydroxylation
                        term:
                          id: GO:0017185
                          label: peptidyl-lysine hydroxylation
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                        description: >-
                          The epmC review infers cytoplasm; no sub-compartment
                          evidence exists for this enzyme.
                    role_description: >-
                      Final hydroxylation of the beta-lysylated residue, a
                      smaller contribution to EF-P activity than the EpmB and
                      EpmA steps.
              - id: efp_arg_rhamnosylation_route
                label: EarP rhamnosylation of EF-P Arg32
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  The pseudomonad and Shewanella route: the glycosyltransferase
                  EarP transfers rhamnose from dTDP-beta-L-rhamnose onto the
                  conserved arginine at the tip of EF-P loop 1. EF-Ps of this
                  type carry Arg32 in place of the enterobacterial Lys34.
                evidence:
                  - source_id: PMID:25686373
                    statement: >-
                      Identifies the arginine-rhamnosylation route and its
                      donor substrate.
                    supporting_text: >-
                      a conserved arginine of EF-P is rhamnosylated by a
                      glycosyltransferase (EarP) using dTDP-L-rhamnose as a
                      substrate
                annotons:
                  - id: earp_arg_rhamnosylation
                    label: EarP protein-arginine rhamnosyltransferase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: earP (Pseudomonas putida KT2440)
                        term:
                          id: UniProtKB:Q88LS1
                          label: Protein-arginine rhamnosyltransferase
                        description: >-
                          KT2440 EarP, encoded next to efp; the reviewed
                          exemplar of this route in this corpus.
                    function:
                      preferred_term: protein-arginine rhamnosyltransferase activity
                      term:
                        id: GO:0106361
                        label: protein-arginine rhamnosyltransferase activity
                      substrates:
                        - preferred_term: dTDP-beta-L-rhamnose
                          description: >-
                            The rhamnosyl donor, supplied by the rml/rfb
                            pathway, which is outside this module.
                      targets:
                        - preferred_term: EF-P Arg32
                          description: >-
                            The conserved arginine at the tip of EF-P loop 1 in
                            Arg-type EF-Ps.
                    processes:
                      - preferred_term: peptidyl-arginine modification
                        term:
                          id: GO:0018195
                          label: peptidyl-arginine modification
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Single-enzyme activation route: rhamnosylation of EF-P
                      Arg32 makes pseudomonad EF-P competent for stall rescue.
              - id: efp_aminopentanol_route
                label: 5-aminopentanolylation of EF-P Lys32 in Bacillus subtilis
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  The B. subtilis route: a 5-aminopentanol moiety is assembled
                  on EF-P Lys32, with the short-chain reductase YmfI reducing
                  the 5-aminopentanone intermediate to the alcohol. Unlike the
                  other two routes, this modification is largely dispensable:
                  unmodified B. subtilis EF-P still relieves polyproline
                  stalls, and the modification mutants have milder defects than
                  the efp deletion.
                evidence:
                  - source_id: PMID:27002156
                    statement: >-
                      Identifies the 5-aminopentanol modification on Lys32 of
                      B. subtilis EF-P.
                    supporting_text: >-
                      We identified a 5-aminopentanol moiety attached to Lys(32)
                      of B. subtilis EF-P that is required for swarming
                      motility.
                annotons:
                  - id: ymfi_carbonyl_reduction
                    label: YmfI reduction of the EF-P 5-aminopentanone intermediate
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ymfI (Bacillus subtilis 168)
                        term:
                          id: UniProtKB:O31767
                          label: Uncharacterized oxidoreductase YmfI
                        description: >-
                          Short-chain dehydrogenase/reductase that reduces the
                          carbonyl of the EF-P-bound 5-aminopentanone. It sits
                          in the FabG-dominated PANTHER subfamily
                          PTHR42879:SF2 on fold similarity only and has no
                          3-oxoacyl-ACP reductase role.
                    function:
                      preferred_term: >-
                        NADPH-dependent reduction of the EF-P-bound
                        5-aminopentanone carbonyl
                      term:
                        id: GO:0016616
                        label: >-
                          oxidoreductase activity, acting on the CH-OH group of
                          donors, NAD or NADP as acceptor
                      description: >-
                        As precise as the ontology allows: neither GO nor Rhea
                        has the EF-P 5-aminopentanone/5-aminopentanol
                        interconversion, which the ymfI review raises as a
                        question rather than a proposed term.
                      targets:
                        - preferred_term: EF-P-bound 5-aminopentanone
                          description: >-
                            The protein-bound ketone intermediate on Lys32,
                            reduced to the 5-aminopentanol end state.
                    processes:
                      - preferred_term: peptidyl-lysine modification
                        term:
                          id: GO:0018205
                          label: peptidyl-lysine modification
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                    role_description: >-
                      Completes the 5-aminopentanol modification by carbonyl
                      reduction. The enzymes that build the 5-aminopentanone
                      donor (ynbB, gsaB) are outside this module.
                    evidence:
                      - source_id: PMID:28787546
                        statement: >-
                          YmfI performs the carbonyl reduction step of the
                          B. subtilis EF-P modification.
                        supporting_text: >-
                          the protein YmfI catalyzes the reduction of EF-P-5
                          aminopentanone to EF-P-5 aminopentanol
    - order: 2
      role: EF-P engagement of a stalled cytosolic ribosome
      node:
        id: efp_stalled_ribosome_engagement
        label: EF-P stalled-ribosome engagement
        module_type: BIOLOGICAL_PROCESS
        description: >-
          EF-P binds a stalled cytosolic ribosome between the P and E sites,
          where domain I loop 1 reaches the P-site peptidyl-tRNA; this is the
          binding event that positions EF-P for the catalytic step.
        annotons:
          - id: efp_ribosome_binding
            label: "EF-P: stalled-ribosome binding"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: elongation factor P subfamily
                term:
                  id: PANTHER:PTHR30053:SF12
                  label: ELONGATION FACTOR P (EF-P) FAMILY PROTEIN
                description: >-
                  Canonical bacterial EF-P orthologs, which bind stalled
                  cytosolic ribosomes during translational elongation.
                representative_members:
                  - preferred_term: efp (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A6N4
                      label: Elongation factor P
                    description: >-
