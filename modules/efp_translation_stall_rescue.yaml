  connections:
    - source: efp_activation
      target: efp_stalled_ribosome_engagement
      connection_type: PRECEDES
      description: >-
        Where an activation route exists, modification of the loop-1 residue
        precedes productive engagement of a stalled ribosome by that organism's
        EF-P.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Protein modification followed by ribosome binding; there is no CoA-linked
        metabolic intermediate for the reaction-chaining check to follow.
    - source: efp_stalled_ribosome_engagement
      target: efp_translation_stall_rescue_step
      connection_type: PRECEDES
      description: >-
        EF-P must be bound between the P and E sites before it can stabilize the
        P-site peptidyl-tRNA and stimulate peptide-bond formation.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Binding followed by catalysis on the ribosome, with no small-molecule
        intermediate to match.
  knowledge_gaps:
    - gap_statement: >-
        Why some EF-Ps require an activating modification and others do not is
        unknown, and how any of the three modifications potentiates the rescue
        activity is unknown. B. subtilis EF-P works unmodified while E. coli
        EF-P is nearly inactive without beta-lysylation, with no structural or
        kinetic account of the difference.
      boundary: >-
        Keep the activation part optional and route-based; do not assert that an
        organism lacking a known modification system has inactive EF-P, and do
        not treat any one chemistry as the canonical form.
      gap_kind:
        - BIOLOGY
      provenance:
        - reference_id: PMID:28787546
          reference_section_type: INTRODUCTION
          supporting_text: >-
            The mechanism by which the various modification groups enhance EF-P
            activity is unknown.
    - gap_statement: >-
        The set of endogenous proline-containing proteins whose synthesis
        actually depends on EF-P is mapped in only a few species and not in
        P. putida KT2440, and the selective pressure that keeps EF-P nearly
        universal is not established.
      boundary: >-
        Keep the module centered on the conserved EF-P mechanism; do not promote
        organism-specific downstream phenotypes (swarming, acid resistance,
        virulence) into the module core, and do not read a phenotype as evidence
        that EF-P participates in that process.
      gap_kind:
        - BIOLOGY
      provenance:
        - reference_id: PMID:31237868
          reference_section_type: INTRODUCTION
          supporting_text: >-
            While EF-P is widely distributed and often required for rapid
            growth, the reason it is highly conserved is unknown
    - gap_statement: >-
        How EF-P physically stimulates peptide-bond formation once bound is
        unresolved: stabilization of the P-site peptidyl-tRNA is established,
        but whether the effect is entropic positioning or something more
        specific is not known, which is also what makes the role of the loop-tip
        modification hard to interpret.
      boundary: >-
        Assert the elongation-factor activity and the stall-rescue process, not
        a mechanism of catalysis; the module's annoton describes positioning of
        the peptidyl-tRNA, which is what the evidence supports.
      gap_kind:
        - BIOLOGY
      provenance:
        - reference_id: PMID:31237868
          reference_section_type: DISCUSSION
          supporting_text: >-
            EF-P structurally resembles a tRNA and while it is thought to
            promote translation entropically, the mechanism is poorly
            understood
