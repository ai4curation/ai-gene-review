id: MODULE:dmel_pirna_nuclear_complexes
title: Nuclear piRNA pathway complexes (RDC and PICTS) in Drosophila melanogaster
description: >-
  Two nuclear complexes act in the Drosophila germline piRNA pathway. The Rhino-Deadlock-Cutoff
  (RDC) complex binds dual-strand piRNA clusters, where the HP1 paralog Rhino recognises H3K9me3,
  and licenses non-canonical transcription of cluster precursors that are processed into piRNAs.
  The Panoramix-induced co-transcriptional silencing complex (PICTS, also called SFiNX), made
  of Panoramix, Nxf2, Nxt1 and dynein light chain Ctp, is recruited by piRNA-guided Piwi to
  nascent transposon transcripts and triggers H3K9 methylation and heterochromatin formation
  over the target.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001774
  title: 'FlyBase gene group RDC: Rhino-deadlock-cutoff complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as rhino-deadlock-cutoff complex
    (RDC); this module models that group.
- source_id: FB:FBgg0001963
  title: 'FlyBase gene group PICTS: Panoramix-induced co-transcriptional silencing complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as panoramix-induced co-transcriptional
    silencing complex (PICTS); this module models that group.
- source_id: GO:0140966
  title: piRNA-mediated heterochromatin formation
  statement: >-
    GO term grounding the module as piRNA-mediated heterochromatin formation.
notes: >-
  The two FlyBase groups act at different steps (piRNA production versus piRNA-guided silencing)
  and are linked only through piRNAs and Piwi, which are not modelled here; no direct connection
  is asserted. Ctp (dynein light chain LC8) also has many cytoplasmic roles; here it is the
  PICTS dimerising subunit. The module concept is the overall nuclear piRNA heterochromatin
  pathway that both complexes serve. FlyBase groups realized by this module: RDC (FBgg0001774),
  PICTS (FBgg0001963). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_pirna_nuclear_complexes.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
