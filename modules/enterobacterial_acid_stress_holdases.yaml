id: MODULE:enterobacterial_acid_stress_holdases
title: E. coli HdeA/HdeB periplasmic acid-stress holdases
description: >-
  A periplasmic acid-stress module in which the ATP-independent chaperones HdeA
  and HdeB bind acid-unfolding client proteins, suppress irreversible
  aggregation, and preserve them for refolding after neutralization. HdeA is
  activated under extreme acid through dimer dissociation and disordering,
  whereas HdeB acts at milder acidic pH through a distinct dynamic folded-dimer
  mechanism. HdeB also supports client refolding after neutralization, but the
  direct release step has not yet been separated from potential downstream
  folding factors. Acid-sensing transcriptional regulation, cytoplasmic pH
  homeostasis, HdeB-specific post-neutralization handoff, and the
  post-neutralization cooperation of DegP and SurA are outside this focused
  in-situ holdase module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:1990451
    title: cellular stress response to acidic pH
    statement: Defines the stress-response process served by HdeA and HdeB.
  - source_id: GO:0050821
    title: protein stabilization
    statement: >-
      Captures HdeA/HdeB prevention of irreversible periplasmic protein
      aggregation during acid stress.
  - source_id: file:genes/ECOLI/HdeA/HdeA-ai-review.yaml
    title: ECOLI HdeA gene review
    statement: >-
      The completed E. coli HdeA review grounds HdeA as a pH-below-3
      acid-activated in-situ holdase and refolding chaperone.
  - source_id: file:genes/ECOLI/HdeB/HdeB-ai-review.yaml
    title: ECOLI HdeB gene review
    statement: >-
      The completed E. coli HdeB review grounds HdeB as a mildly acidic-pH
      in-situ holdase.
  - source_id: PMID:10623550
    title: >-
      HDEA, a periplasmic protein that supports acid resistance in pathogenic
      enteric bacteria.
    statement: >-
      Establishes HdeA acid-stress protection and suppression of aggregation
      by acid-denatured proteins.
  - source_id: PMID:15911614
    title: >-
      Periplasmic protein HdeA exhibits chaperone-like activity exclusively
      within stomach pH range by transforming into disordered conformation.
    statement: >-
      Establishes the low-pH conformational switch that activates HdeA client
      binding.
  - source_id: PMID:20080625
    title: Protein refolding by pH-triggered chaperone binding and release.
    statement: >-
      Establishes that HdeA can facilitate refolding after pH neutralization
      through a slow client-release cycle.
  - source_id: PMID:17085547
    title: Escherichia coli HdeB is an acid stress chaperone.
    statement: >-
      Establishes HdeB as an acid-stress chaperone that prevents
      periplasmic-protein aggregation at acidic pH.
  - source_id: PMID:25391835
    title: HdeB functions as an acid-protective chaperone in bacteria.
    statement: >-
      Refines HdeB as an acid-protective holdase with an activity optimum
      distinct from HdeA and shows that HdeB can support client refolding after
      neutralization.
  - source_id: PMID:26593705
    title: HdeB chaperone activity is coupled to its intrinsic dynamic properties.
    statement: >-
      Establishes that HdeB activation is coupled to intrinsic dynamics rather
      than the HdeA-like global unfolding switch.
  - source_id: file:projects/UNFOLDED_PROTEIN_BINDING.md
    title: Unfolded protein binding annotation review project
    statement: >-
      Records the ontology boundary: GO:0051082 is obsolete, GO:0140309 is
      carrier-specific, and in-situ holdases need a general holdase chaperone
      activity term.
notes: >-
  HdeA and HdeB are modeled as in-situ acid holdases rather than OMP
  carrier-holdases. Their reviewed core functions use a proposed holdase
  chaperone activity because no current GO molecular-function term exactly
  captures local aggregation prevention without escort to a defined acceptor.
