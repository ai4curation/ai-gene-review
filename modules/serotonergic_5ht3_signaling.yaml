id: MODULE:serotonergic_5ht3_signaling
title: Human serotonergic signalling through ionotropic 5-HT3 receptors
description: >-
  The ionotropic arm of serotonergic transmission. Serotonin is synthesised from tryptophan by TPH2 and
  DDC, loaded into vesicles by VMAT2 (SLC18A2) and released by calcium-triggered exocytosis. Released
  serotonin opens 5-HT3 receptors, the only pentameric ligand-gated channels among the serotonin
  receptors; the other 5-HT receptor classes are G-protein-coupled and are outside this module. Two
  receptor forms are modelled as alternatives: the 5-HT3A homopentamer, which is calcium-permeable but
  has a conductance too small to resolve directly, and the 5-HT3A/5-HT3B heteromer, which has a large
  single-channel conductance and low calcium permeability. The signal is terminated by SERT (SLC6A4),
  which recaptures serotonin into the presynaptic terminal. Melatonin synthesis, monoamine oxidase
  degradation and the metabotropic 5-HT receptors are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:9950429
  title: The 5-HT3B subunit is a major determinant of serotonin-receptor function.
  statement: Establishes the two receptor forms used as the variant axis, and the functional differences
    between them.
  supporting_text: Heteromeric assemblies of 5-HT3A and 5-HT3B subunits display a large single-channel
    conductance (16 pS), low permeability to calcium ions, and a current-voltage relationship which
    resembles that of characterized neuronal 5-HT3 channels.
- source_id: PMID:25119048
  title: X-ray structure of the mouse serotonin 5-HT3 receptor.
  statement: The 5-HT3 receptor is a Cys-loop pentamer with an extracellular agonist site and an aqueous
    transmembrane pore, which is the architecture asserted here.
  supporting_text: The extracellular domain reveals the detailed anatomy of the neurotransmitter binding
    site capped by a nanobody. The membrane domain delimits an aqueous pore with a 4.6 Å constriction.
- source_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
  title: PTHR18945 family review
  statement: The family review finds the serotonin-gated activity gain placed too deep in PAINT, at
    PTN004502671, where three IRDs then cancel it for the alpha9, alpha10 and ZAC branches. The 5-HT3
    nodes carry the serotonin-activated channel complex gains. This module therefore names exact subunits
    and takes its receptor claims from the structural and electrophysiological literature rather than
    from the family-level propagation.
notes: >-
  The subunit stoichiometry of the 5-HT3A/5-HT3B heteromer is not asserted; the paper that identified
  5-HT3B did not fix it, and later reports disagree. The homomer is given five copies of 5-HT3A, which
  the structural work supports. HTR3C, HTR3D and HTR3E exist and inherit the serotonin-activated channel
  complex term at PAINT node PTN002707828, but their native assemblies are not established, so they are
  not modelled. TPH1 is the peripheral isoform; the biosynthesis reference covers both. Synthesis,
  vesicular loading and exocytosis are included by module_ref. No 5-HT3 subunit, VMAT2 or SERT has a gene
  review in this repository, although TPH2 and DDC do, so status is DRAFT. Module deep research has not
  been run.
