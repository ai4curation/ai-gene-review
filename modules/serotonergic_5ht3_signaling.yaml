knowledge_gaps:
- gap_statement: The subunit stoichiometry and arrangement of the native 5-HT3A/5-HT3B heteromer are not
    established, and it is not known how 5-HT3B raises conductance given that its pore-lining M2 region
    lacks the residues that do so in related receptors.
  boundary: That the heteromer exists, requires
    5-HT3A for the agonist site, and has a 16 pS conductance with low calcium permeability is established
    by single-channel recording. The number of copies of each subunit, their arrangement, and the
    structural basis of the conductance change are not.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: Conductance and calcium permeability decide whether a 5-HT3 receptor merely depolarises
    its target or also triggers calcium-dependent signalling, so the mechanism matters for predicting what
    a given receptor does and how antiemetic drugs act on it.
  provenance:
  - reference_id: PMID:9950429
    supporting_text: the M2 region of the 5-HT3B subunit lacks any of the structural features that are
      known to promote the conductance of related receptors
    reference_section_type: ABSTRACT
- gap_statement: Whether HTR3C, HTR3D and HTR3E form functional native receptors, and with which partners,
    is unresolved.
  boundary: The three genes exist and are transcribed, and they inherit the
    serotonin-activated channel complex term from PAINT node PTN002707828. Whether the proteins reach the
    surface as part of a functional channel, and with which partners, has not been shown.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: These three subunits inherit the serotonin-activated channel complex term by PAINT
    propagation, but if they do not assemble into native channels the inherited annotation overstates what
    is known, and the module's receptor inventory is incomplete either way.
  provenance:
  - reference_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
    supporting_text: 5-HT3 receptor branch (human recipients HTR3A-E).
    reference_section_type: DATABASE_ENTRY
references:
- id: PMID:9950429
  title: The 5-HT3B subunit is a major determinant of serotonin-receptor function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Establishes both receptor forms and their biophysical
      differences. It states that the 5-HT3B M2 region lacks the features that normally raise
      conductance, so the mechanism is recorded as a knowledge gap rather than asserted.
  findings:
  - statement: Recombinant 5-HT3A alone yields functional receptors, but their conductance is
      sub-picosiemens and cannot be resolved directly.
    supporting_text: Recombinant expression of the only identified receptor subunit (5-HT3A) yields
      functional 5-HT3 receptors.
    reference_section_type: ABSTRACT
  - statement: 5-HT3A/5-HT3B heteromers have a 16 pS conductance and low calcium permeability, matching
      native neuronal 5-HT3 channels.
    supporting_text: Heteromeric assemblies of 5-HT3A and 5-HT3B subunits display a large single-channel
      conductance (16 pS), low permeability to calcium ions, and a current-voltage relationship which
      resembles that of characterized neuronal 5-HT3 channels.
    reference_section_type: ABSTRACT
  - statement: HTR3B transcripts are co-expressed with HTR3A in amygdala, caudate and hippocampus.
    supporting_text: Transcripts of this subunit are co-expressed with the 5-HT3A subunit in the amygdala,
      caudate and hippocampus.
    reference_section_type: ABSTRACT
- id: PMID:25119048
  title: X-ray structure of the mouse serotonin 5-HT3 receptor.
  findings:
  - statement: The mouse 5-HT3 receptor structure shows the Cys-loop pentameric architecture, with an
      extracellular agonist site and a transmembrane aqueous pore constricted to 4.6 Angstrom.
    supporting_text: The extracellular domain reveals the detailed anatomy of the neurotransmitter binding
      site capped by a nanobody. The membrane domain delimits an aqueous pore with a 4.6 Å constriction.
    reference_section_type: ABSTRACT
- id: PMID:15087484
  title: 'Serotonin transporter: gene, genetic disorders, and pharmacogenetics.'
  publication_type: REVIEW
  findings:
  - statement: SERT sets extracellular serotonin concentrations for the serotonergic system and is the
      target of the serotonin reuptake inhibitors.
    supporting_text: The highly evolutionarily conserved serotonin transporter (SERT) regulates the entire
      serotoninergic system and its receptors via modulation of extracellular fluid serotonin
      concentrations.
    reference_section_type: ABSTRACT
- id: PMID:12511643
  title: Synthesis of serotonin by a second tryptophan hydroxylase isoform.
  findings:
  - statement: A second tryptophan hydroxylase isoform, TPH2, synthesises serotonin; it is the neuronal
      isoform, which is why the neuronal branch of the biosynthesis module applies here.
    reference_section_type: TITLE
    full_text_unavailable: true
- id: PMID:9427251
  title: Knockout of the vesicular monoamine transporter 2 gene results in neonatal death and
    supersensitivity to cocaine and amphetamine.
  findings:
  - statement: VMAT2 is the predominant brain vesicular monoamine transporter, and its loss severely
      impairs monoamine storage and vesicular release.
    supporting_text: manifesting severely impaired monoamine storage and vesicular release
    reference_section_type: ABSTRACT
