              Repeated proton-binding rotor subunit that oligomerizes into the
              membrane c ring.
  connections:
    - source: fo_proton_rotor
      target: f1_central_rotor
      connection_type: CAUSES
      description: >-
        Proton-driven c-ring rotation turns the gamma-epsilon central rotor.
    - source: f1_central_rotor
