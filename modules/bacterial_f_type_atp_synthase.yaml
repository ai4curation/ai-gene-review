id: MODULE:bacterial_f_type_atp_synthase
title: Bacterial F-type ATP synthase
description: >-
  Reusable bacterial module for the F1Fo ATP synthase that couples downhill
  proton movement across the plasma membrane to rotary synthesis of ATP. The
  soluble F1 sector contains the alpha/beta catalytic head and gamma/epsilon
  central rotor. The membrane-associated stator holds the catalytic head fixed,
  while the Fo a/c sector conducts protons and rotates the c ring. The module
  models these mechanical parts separately so that whole-complex ATP synthase
  activity is not assigned independently to every subunit.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0045259
    title: proton-transporting ATP synthase complex
    statement: >-
      GO:0045259 grounds the assembled bacterial F1Fo ATP synthase.
  - source_id: GO:0046933
    title: proton-transporting ATP synthase activity, rotational mechanism
    statement: >-
      GO:0046933 captures the coupled rotary activity of the assembled enzyme.
  - source_id: KEGG:ppu00190
    title: Pseudomonas putida KT2440 oxidative phosphorylation
    statement: >-
      The contiguous PP_5412-PP_5419 locus encodes all eight canonical bacterial
      F-type ATP synthase subunit families.
notes: >-
  P. putida KT2440 has a complete atpC-D-G-A-H-F-E-B locus. Gene names follow
  bacterial nomenclature: AtpD is beta, AtpA is alpha, AtpH is delta, and AtpB
  is the Fo a subunit. Individual subunits contribute to GO:0046933; the complete
  rotational ATP-synthesis activity belongs to the assembled complex.
module:
  id: bacterial_f_type_atp_synthase
  label: Bacterial F1Fo ATP synthase
  module_type: PROTEIN_COMPLEX
  concepts:
    - preferred_term: proton-transporting ATP synthase complex
      term:
        id: GO:0045259
        label: proton-transporting ATP synthase complex
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: nucleotide-binding F1 catalytic head
      node:
        id: f1_alpha_beta_head
        label: F1 alpha3-beta3 catalytic head
        module_type: PROTEIN_COMPLEX
        description: >-
          Alternating alpha and beta subunits form the hexameric head. Beta
          subunits contain the catalytic nucleotide sites, while alpha subunits
          provide noncatalytic nucleotide-binding and structural interfaces.
        annotons:
          - id: atpa_alpha_subunit
            label: AtpA alpha subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase alpha-subunit family
                term:
                  id: PANTHER:PTHR48082
                  label: ATP synthase subunit alpha
                representative_members:
                  - preferred_term: PSEPK atpA exemplar
                    term:
                      id: UniProtKB:Q88BX2
                      label: ATP synthase subunit alpha
                    description: Pseudomonas putida KT2440 atpA/PP_5415.
            function:
              preferred_term: ATP binding
              term:
                id: GO:0005524
                label: ATP binding
            role_description: >-
              Noncatalytic nucleotide-binding subunit that alternates with beta
              subunits in the F1 head.
          - id: atpd_beta_subunit
            label: AtpD beta catalytic subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase beta-subunit family
                term:
                  id: PANTHER:PTHR15184
                  label: ATP synthase subunit beta
                representative_members:
                  - preferred_term: PSEPK atpD exemplar
                    term:
                      id: UniProtKB:Q88BX4
                      label: ATP synthase subunit beta
                    description: Pseudomonas putida KT2440 atpD/PP_5413.
            function:
              preferred_term: ATP binding
              term:
                id: GO:0005524
                label: ATP binding
            role_description: >-
              Catalytic nucleotide-binding subunit whose conformational states
              synthesize and release ATP during rotor-driven cycling.
    - order: 2
      role: central rotary shaft and inhibitory coupling unit
      node:
        id: f1_central_rotor
        label: F1 gamma-epsilon central rotor
        module_type: PROTEIN_COMPLEX
        description: >-
          Gamma forms the asymmetric shaft coupling c-ring rotation to the
          alpha3-beta3 head; epsilon couples to the rotor and regulates reverse
          ATP hydrolysis.
        annotons:
          - id: atpg_gamma_subunit
            label: AtpG gamma rotor subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase gamma-subunit family
                term:
                  id: PANTHER:PTHR11693
                  label: ATP synthase gamma chain
                representative_members:
                  - preferred_term: PSEPK atpG exemplar
                    term:
                      id: UniProtKB:Q88BX3
                      label: ATP synthase gamma chain
                    description: Pseudomonas putida KT2440 atpG/PP_5414.
            role_description: >-
              Central shaft that transmits Fo c-ring rotation into cyclic
              conformational changes of the F1 catalytic sites.
          - id: atpc_epsilon_subunit
            label: AtpC epsilon rotor/regulatory subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase epsilon-subunit family
                term:
                  id: PANTHER:PTHR13822
                  label: ATP synthase epsilon chain
                representative_members:
                  - preferred_term: PSEPK atpC exemplar
                    term:
                      id: UniProtKB:Q88BX5
                      label: ATP synthase epsilon chain
                    description: Pseudomonas putida KT2440 atpC/PP_5412.
            role_description: >-
              Rotor-associated coupling and regulatory subunit that can limit
              wasteful reverse ATP hydrolysis.
    - order: 3
      role: peripheral stator holding F1 against rotor torque
      node:
        id: peripheral_stator
        label: AtpF/AtpH peripheral stator
        module_type: PROTEIN_COMPLEX
        description: >-
          The membrane-anchored b subunit and delta cap form the peripheral
          stalk that prevents the alpha3-beta3 head from co-rotating.
        annotons:
          - id: atpf_b_stator
            label: AtpF b stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase b-subunit family
                term:
                  id: PANTHER:PTHR33445
                  label: ATP synthase subunit b
                representative_members:
                  - preferred_term: PSEPK atpF exemplar
                    term:
                      id: UniProtKB:Q88BX0
                      label: ATP synthase subunit b
                    description: Pseudomonas putida KT2440 atpF/PP_5417.
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Membrane-anchored peripheral-stalk subunit that transmits stator
              support from Fo to the F1 head.
          - id: atph_delta_stator
            label: AtpH delta stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase delta-subunit family
                term:
                  id: PANTHER:PTHR11910
                  label: ATP synthase delta subunit
                representative_members:
                  - preferred_term: PSEPK atpH exemplar
                    term:
                      id: UniProtKB:Q88BX1
                      label: ATP synthase subunit delta
                    description: Pseudomonas putida KT2440 atpH/PP_5416.
            role_description: >-
              F1 cap that connects the peripheral stalk to the alpha3-beta3
              catalytic head.
    - order: 4
      role: Fo proton channel and rotary c ring
      node:
        id: fo_proton_rotor
        label: AtpB/AtpE Fo proton-translocating rotor
        module_type: PROTEIN_COMPLEX
        description: >-
          The a subunit supplies offset proton half-channels at the rotating
          c-ring interface. Sequential protonation of conserved c-subunit
          carboxylates drives ring rotation.
        annotons:
          - id: atpb_a_channel
            label: AtpB a-subunit proton half-channel
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial F-type ATP synthase a-subunit family
                term:
