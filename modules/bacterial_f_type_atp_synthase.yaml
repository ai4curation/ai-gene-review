                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Stationary Fo subunit that forms proton half-channels on opposite
              sides of the membrane and contacts the rotating c ring.
          - id: atpe_c_ring
            label: AtpE proton-binding c-ring subunit
            participant:
              selector_type: FAMILY
              family:
