notes: >-
  GO:0015035 is retained in the gene reviews as a non-core, reversible
  protein-disulfide oxidoreductase annotation; its official definition does not
  establish a reductive or oxidative physiological direction. The module uses
  GO:0009055 for DsbB's core quinone-linked electron-transfer role. DsbA's own
  redox states are omitted from its substrate/product list because DsbA is the
  annoton participant; its oxidation state is instead represented by the
  reciprocal connections and part descriptions. KT2440 encodes two DsbB
  paralogs with the same family and GO assignments, but whether they are
  condition-specific or substrate-partitioned remains open.
