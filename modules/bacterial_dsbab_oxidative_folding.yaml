id: MODULE:bacterial_dsbab_oxidative_folding
title: Bacterial DsbA/DsbB oxidative protein folding
description: A bacterial envelope mechanism in which a membrane DsbB-family relay regenerates oxidized
  DsbA-family proteins, which introduce disulfides into exported substrate proteins. Quinone-coupled recycling
  is directly established in selected systems; native acceptor identity and isolated kinetics remain unresolved
  for the Bacillus and Campylobacter comparisons. Catalytic domains act in the Gram-negative periplasm
  or outside the Bacillus cytoplasmic membrane. Initial disulfide insertion does not guarantee the native
  disulfide pattern. DsbC/DsbD repair and DsbA/VKOR oxidation are distinct mechanisms.
status: COMPLETE
scope: CONCRETE
references:
- id: PMID:24576574
  title: 'Disulfide bond formation in prokaryotes: history, diversity and design.'
  findings:
  - statement: The DsbAB mechanism extends beyond Gammaproteobacteria to multiple bacterial lineages;
      bacterial scope does not imply presence in every bacterium or absence from archaea.
    supporting_text: The cysteine counting approach and the identification of DsbA and DsbB homologues
      amongst prokaryotes suggests that protein disulfide bond formation and the DsbAB pathway are found
      in α, β, γ and ε-Proteopacteria, members of the phylum Deinococcus-Thermus, the Euryarchaeal family
      Halobacteriaceae and some Bacillales
  - statement: DsbAB-related operons can have restricted substrates. A family hit cannot establish arbitrary
      DsbA/DsbB partner compatibility or interchangeable substrate repertoires.
    supporting_text: many bacteria contain an operon containing dsbA and dsbB homologues that appear to
      be very specific in their substrates, sometimes promoting disulfide bond formation in only one or
      a few substrates
  - statement: Disulfide insertion can generate incorrect pairings; the endpoint of this module is substrate
      disulfide formation rather than a guarantee of the native disulfide pattern.
    supporting_text: DsbA, since it promotes disulfide bond formation during the translocation of proteins
      into the periplasm, favors joining pairs of cysteines as they appear in order in the amino acid
      sequence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full comparative review read. Distribution combines homology/cysteine-counting with
      characterized examples, not direct assays in every named lineage. Historical statements about one-CXXC
      Campylobacter homologs must not be applied to the distinct characterized 81116 DsbB without checking
      identity. DsbB-dependent oxidation and VKOR-dependent oxidation remain separate mechanisms.
- id: PMID:34504665
  title: Structural bioinformatic analysis of DsbA proteins and their pathogenicity associated substrates.
  findings:
  - statement: The E. coli single-DsbA model is not a universal architecture; paralog number and specialization
      vary across bacteria.
    supporting_text: Genome-wide screening for DSB homologues has revealed that the classical model of
      bacterial oxidative folding from E. coli K-12 is not universally conserved across bacterial species
  - statement: Closely named DsbA paralogs may differ substantially in surface features and redox properties,
      motivating explicit compatible-pair witnesses.
    supporting_text: These Salmonella DsbA paralogues were found to share low sequence identity along
      with significant differences in their surface features and redox properties
  - statement: The DsbC/DsbD repair route is mechanistically separate from initial DsbA/DsbB oxidation.
    supporting_text: DsbC proofreads and re-shuffles non-native disulfide bonds in misfolded substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read, including comparative redox properties and redundancy section. Structural
      class, family membership, biochemical substrate range and physiological substrate assignment are
      distinct evidence levels. Redox potential or a conserved active site alone does not prove cognate
      partner compatibility.
- id: PMID:29463925
  title: Disulfide bond formation in prokaryotes.
  findings:
  - statement: Actinobacterial and cyanobacterial DsbA systems can replace DsbB with VKOR; DsbA presence
      alone is insufficient to infer this DsbB-dependent module.
    supporting_text: 'One variation found amongst Actinobacteria and Cyanobacteria

      is the replacement of DsbB by a homologue of human vitamin K epoxide reductase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only after normal acquisition. Used for the explicit comparative DsbB/VKOR
      distinction in the accessible abstract, not inaccessible assay details.
- id: PMID:20367276
  title: Mechanisms of oxidative protein folding in the bacterial cell envelope.
  findings:
  - statement: Joining cysteines and repairing misoxidized proteins are distinct tasks; the present module
      stops before the repair pathway.
    supporting_text: 'Bacterial cells

      have evolved elaborate systems to promote the joining of two cysteines to form a

      disulfide bond and to repair misoxidized proteins.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Supports the oxidation-versus-repair framing and diversity, not a specific
      taxon or enzyme kinetic claim.
- id: PMID:9342327
  title: Respiratory chain is required to maintain oxidized states of the DsbA-DsbB disulfide bond formation
    system in aerobically growing Escherichia coli cells.
  findings:
  - statement: Native respiratory-chain perturbations support electron transfer downstream of DsbB during
      maintenance of oxidized DsbA.
    supporting_text: 'These results suggest that the respiratory electron transfer

      chain participates in the oxidation of DsbA, by acting primarily on DsbB.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native E. coli respiratory-chain experiments under aerobic conditions. The evidence
      establishes dependence in those conditions; it does not make molecular oxygen a stoichiometric substrate
      of DsbB.
- id: PMID:12853466
  title: Mechanism of the electron transfer catalyst DsbB from Escherichia coli.
  findings:
  - statement: E. coli DsbB directly catalyzes quinone-coupled oxidation of reduced DsbA.
    supporting_text: 'The membrane protein DsbB from Escherichia coli is essential for disulfide bond

      formation and catalyses the oxidation of the periplasmic dithiol oxidase DsbA by

      ubiquinone.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract is available; direct biochemical reaction is explicitly reported there.
      No claim of access to the full experimental methods is made.
- id: PMID:24327342
  title: Dissecting the machinery that introduces disulfide bonds in Pseudomonas aeruginosa.
  findings:
  - statement: PA14 DsbB1 and DsbB2 each reoxidize DsbA1; native deletion and biochemical evidence support
      alternative donors to the same recycling step.
    supporting_text: 'We found that PaDsbA1, the primary donor of disulfide

      bonds to secreted proteins, is maintained oxidized in vivo by both PaDsbB1 and

      PaDsbB2.'
  - statement: Reconstituted PA14 activity links DsbA1 oxidation to quinone reduction; interpretation
      retains the heterologous partially purified preparation limit.
    supporting_text: 'In vitro reconstitution of the pathway confirms that both PaDsbB1 and

      PaDsbB2 shuttle electrons from PaDsbA1 to membrane-bound quinones.'
  - statement: A2 remains a biochemically characterized alternative with unknown native expression conditions,
      not an established interchangeable native route.
    supporting_text: PaDsbA2 was not detected, despite repeated attempts in different culture media, which
      suggests that this protein is expressed only under specific conditions that remain to be determined.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article plus Text S2 inspected. Coding sequences and native experiments
      are PA14, not PAO1 or KT2440. DsbA constructs lack their signal peptides; preparations of DsbB were
      expressed heterologously and partially purified. Native PA14 evidence supports A1 with B1 OR B2.
      A2 biochemical competence does not establish native expression or substitution for A1.
- id: PMID:19535335
  title: Crystal structure and biophysical properties of Bacillus subtilis BdbD. An oxidizing thiol:disulfide
    oxidoreductase containing a novel metal site.
  findings:
  - statement: Bacillus BdbD acts on the external side of the cytoplasmic membrane, so a Gram-negative
      outer-membrane-bounded periplasm term cannot be imposed on the entire module.
    supporting_text: 'BdbD is a thiol:disulfide oxidoreductase (TDOR) from Bacillus subtilis that

      functions to introduce disulfide bonds in substrate proteins/peptides on the

      outside of the cytoplasmic membrane'
  - statement: Purified soluble BdbD transfers its own disulfide to a cysteine-containing substrate peptide.
    supporting_text: These experiments clearly demonstrate that oxidized sBdbD is able to transfer its
      disulfide bond to the apo-cytochrome c550 active site mimic peptide.
  - statement: Calcium modulates BdbD redox potential without being required for the tested folding or
      stability; do not make calcium presence a categorical pathway-capacity gate.
    supporting_text: the occupancy of the metal site by Ca2+ ion is not required for folding/stability
      but leads to a significant increase of the midpoint reduction potential.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article read. Soluble BdbD construct is sequence-bridged to the strain168
      reference in the gene source analysis; native membrane localization and soluble-domain chemistry
      are separate experiments. Calcium affects redox thermodynamics but is not established as an obligatory
      catalytic cofactor. The CXXCH substrate is a peptide, not proof that BdbD participates positively
      in cytochrome maturation.
- id: PMID:11844773
  title: Mutations in the thiol-disulfide oxidoreductases BdbC and BdbD can suppress cytochrome c deficiency
    of CcdA-defective Bacillus subtilis cells.
  findings:
  - statement: Bacillus BdbC and BdbD are an inferred cognate pair, with lower direct-reconstitution confidence
      than the E. coli and PA14 pairs.
    supporting_text: This gene organization and the fact that BdbD and BdbC are apparent orthologs of
      E. coli DsbA and DsbB, respectively, indicate that BdbC and BdbD function as a pair.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary source read. Genetic suppression and protein architecture support a BdbC/BdbD
      relay; they do not constitute purified BdbC quinone kinetics or identify the physiological quinone.
      Suppression of a reductive pathway defect is not positive participation in cytochrome maturation.
- id: PMID:34948248
  title: Interplay between DsbA1, DsbA2 and C8J_1298 Periplasmic Oxidoreductases of Campylobacter jejuni
    and Their Impact on Bacterial Physiology and Pathogenesis.
  findings:
  - statement: The 81116 system contains two DsbL-related monomeric oxidases with a shared DsbB, broadening
      the module beyond the canonical DsbA subfamily.
    supporting_text: The oxidative part of this network consists of two monomeric DsbAs (DsbA1 and DsbA2)
      related to EcDsbL, which cooperate with one DsbB.
  - statement: Native loss of DsbB perturbs both DsbA paralogs, with reduced A1 and markedly diminished
      A2; the readouts are not identical.
    supporting_text: in contrast to CjDsbA1, which in cells lacking its redox partner, was mainly present
      in a reduced form, the lack of CjDsbB led to almost undetectable levels of CjDsbA2.
  - statement: The biochemical DsbB-dependent interpretation has a material control limitation; preserve
      this rather than claiming a fully controlled kinetic reconstitution.
    supporting_text: we decided to exclude the experimental variant without the CjDsbB protein in our
      analysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary source read. Exact81116 DsbA sequences bridge to current CAMJU records,
      while exact DsbB UniProt records are archived/deleted. CjDsbB was partially purified; the reported
      UQ/MK7 AMS endpoint assays omit a no-DsbB condition. Similar one/two-hour endpoints do not establish
      equal affinities or detailed rates; MST did not yield robust quantitative affinities. Native quinone
      identity remains unresolved.
- id: PMID:32203539
  title: C8J_1298, a bifunctional thiol oxidoreductase of Campylobacter jejuni, affects Dsb (disulfide
    bond) network functioning.
  findings:
  - statement: 'The earlier81116 DsbA1 motility phenotype cannot justify a direct motility assignment:
      the follow-up attributes it to background mutations.'
    supporting_text: the previously observed lack of motility of the ΔdsbA1 strain was a consequence of
      background mutation/s
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article read. The later genetic reconstruction explicitly corrects the
      older DsbA1 motility interpretation. C8J_1298 changes redox role with genetic context and remains
      outside the simple required monomeric DsbA/DsbB pair.
- id: PMID:40741763
  title: Disulfide bonds are critical for stabilizing cell division, cell envelope biogenesis, and antibiotic
    resistance proteins in mycobacteria.
  findings:
  - statement: Mycobacterial oxidative protein folding is performed by DsbA and VKOR, validating an alternative
      outside this DsbB-dependent module.
    supporting_text: 'Mycobacteria rely on two

      membrane enzymes, disulfide bond formation protein A (DsbA) and vitamin K

      epoxide reductase (VKOR), for introducing disulfide bonds into exported

      proteins.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary study used as a boundary comparator. Mycobacterial DsbA/VKOR has the same
      broad outcome but a different membrane recycling enzyme; it is not evidence for a DsbB-family node.
- id: PMID:38493438
  title: Development of a sensor for disulfide bond formation in diverse bacteria.
  findings:
  - statement: The broad-host-range reporter is a tool for examining diverse disulfide-forming systems;
      it does not erase partner or strain specificity.
    supporting_text: The use of the BHR plasmid-borne β-Gal dbs disulfide bond biosensor we describe here
      should enable this analysis in a greater diversity of bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full sensor paper read. Reporter behavior is evidence for the assay in its tested host
      and conditions, not identification of every native substrate or proof of arbitrary DsbA/DsbB pair
      compatibility. Reporter oxidation can impair reporter function, illustrating why oxidation alone
      does not guarantee correct folding.
- id: PMID:1429594
  title: In vitro catalysis of oxidative folding of disulfide-bonded proteins by the Escherichia coli
    dsbA (ppfA) gene product.
  findings:
  - statement: Purified E. coli DsbA directly promotes disulfide formation in protein substrates.
    supporting_text: Purified DsbA markedly stimulated disulfide bond formation of E. coli alkaline phosphatase,
      either in vitro synthesized or purified and denatured, as well as of reduced bovine ribonuclease
      A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached abstract explicitly reports purified-protein disulfide formation. Used for
      this direct activity only; historical size-exclusion suggestions are not adopted as current oligomeric
      architecture.
