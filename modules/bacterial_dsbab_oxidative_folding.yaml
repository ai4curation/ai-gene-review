notes: >-
  DsbB is commonly annotated with protein-disulfide reductase activity because
  it reduces its immediate electron acceptor while oxidizing DsbA; the module
  description records the physiological direction explicitly. KT2440 encodes
  two reviewed DsbB paralogs with the same current family and GO assignments.
  The reciprocal connections encode the catalytic cycle rather than imposing a
  false linear order: DsbB supplies oxidized DsbA, and DsbA returns reduced
  DsbA. Whether the two paralogs are condition-specific or substrate-partitioned
  remains open.
