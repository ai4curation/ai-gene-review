notes: 'The direction-neutral GO:0015035 definition includes oxidative protein-thiol chemistry despite
  its reductase label. Canonical DsbB quinone-coupled MF is more specific for its acceptor chemistry,
  but is not treated as an is_a refinement of every protein-disulfide term. Each family selector is representative-backed:
  no blanket catalytic grant is asserted for heterogeneous families and no ancestral node is invented.
  DsbB variants and substrate-oxidase variants are alternatives, not conjunctive requirements for every
  paralog. Production Boolean topology alone cannot establish partner compatibility; the audit retains
  exact pair witnesses with native, biochemical and inference evidence distinguished. Calcium changes
  BdbD redox properties without being established as a categorical capacity requirement. The 81116 DsbB
  current-record gap is bridged by explicitly archived identity, never by substituting another strain
  or inventing raw data. The scoped curation is complete; full-corpus validation, independent PR review,
  CI and actual merge remain required. Experimental and family-scope limits remain explicit.'
