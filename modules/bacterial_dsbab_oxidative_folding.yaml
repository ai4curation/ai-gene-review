notes: >-
  GO:0015035 is the core term for DsbA's protein-disulfide oxidoreductase
  activity; its official definition is direction-neutral despite the primary
  reductase label. The same term is retained in the DsbB gene review as non-core
  because GO:0016672 more specifically describes DsbB's core quinone-linked
  sulfur-group oxidoreductase role. DsbA's own redox states are omitted from its
  substrate/product list because DsbA is the annoton participant; its oxidation
  state is instead represented by the reciprocal connections and part
  descriptions. KT2440 encodes two DsbB paralogs with the same family and GO
  assignments, but whether they are condition-specific or substrate-partitioned
  remains open.
