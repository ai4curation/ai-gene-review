id: MODULE:bacterial_dsbab_oxidative_folding
title: Bacterial DsbA/DsbB oxidative protein folding
description: >-
  A reusable bacterial envelope module for introduction of disulfide bonds
  into exported proteins. Membrane DsbB transfers electrons from reduced DsbA
  into the respiratory quinone pool, regenerating oxidized DsbA. Periplasmic
  DsbA uses that oxidizing equivalent to oxidize cysteine pairs in newly
  exported substrate proteins and becomes reduced again. The
  module ends at substrate disulfide formation; DsbC/DsbD-mediated isomerization
  and repair of incorrect disulfides are a separate pathway. Pseudomonas putida
  KT2440 supplies one DsbA and two closely related DsbB paralogs as exact
  exemplars.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006457
    title: protein folding
    statement: GO:0006457 provides the broad process context for Dsb-dependent oxidative folding.
  - source_id: GO:0015035
    title: protein-disulfide reductase activity
    statement: >-
      The official GO definition is "Catalysis of the reaction: a protein with
      reduced sulfide groups = a protein with oxidized disulfide bonds." The
      reversible equality makes this a compatible non-directional
      oxidoreductase term, not the primary direction-specific DsbB function.
  - source_id: GO:0009055
    title: electron transfer activity
    statement: >-
      GO:0009055 captures the direction-neutral electron relay by which DsbB
      transfers reducing equivalents from DsbA toward respiratory quinone.
  - source_id: GO:0015036
    title: disulfide oxidoreductase activity
    statement: GO:0015036 captures DsbA-catalyzed oxidation of substrate sulfide groups to disulfides.
  - source_id: file:PSEPK/dsbA/dsbA-uniprot.txt
    title: UniProtKB entry for PSEPK DsbA
    statement: Q88RK2 is a periplasmic DsbA-family disulfide oxidoreductase.
  - source_id: file:PSEPK/dsbB1/dsbB1-uniprot.txt
    title: UniProtKB entry for PSEPK DsbB1
    statement: P59345 is a membrane DsbB protein required for periplasmic disulfide formation.
  - source_id: file:PSEPK/dsbB2/dsbB2-uniprot.txt
    title: UniProtKB entry for PSEPK DsbB2
    statement: P59344 is a second membrane DsbB protein required for periplasmic disulfide formation.
  - source_id: PMID:9342327
    title: Respiratory chain is required to maintain oxidized states of the DsbA-DsbB disulfide bond formation system in aerobically growing Escherichia coli cells.
    statement: >-
      Primary in vivo experiments connect DsbB-dependent DsbA reoxidation to
      quinones and the respiratory electron-transfer chain.
    supporting_text: >-
      These results suggest that the respiratory electron transfer chain
      participates in the oxidation of DsbA, by acting primarily on DsbB.
  - source_id: PMID:12853466
    title: Mechanism of the electron transfer catalyst DsbB from Escherichia coli.
    statement: >-
      Purified-system experiments establish direct DsbB-catalyzed oxidation of
      DsbA by ubiquinone.
    supporting_text: >-
      The membrane protein DsbB from Escherichia coli is essential for
      disulfide bond formation and catalyses the oxidation of the periplasmic
      dithiol oxidase DsbA by ubiquinone.
