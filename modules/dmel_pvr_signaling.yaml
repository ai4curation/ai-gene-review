id: MODULE:dmel_pvr_signaling
title: PVR receptor tyrosine kinase signaling in Drosophila melanogaster
description: >-
  PVR is the single Drosophila receptor tyrosine kinase related to vertebrate PDGF and VEGF
  receptors. It is activated by three secreted ligands, Pvf1, Pvf2 and Pvf3. PVR signaling
  guides the migration of border cells in the ovary and of other cells during development,
  and supports the survival, proliferation and migration of embryonic and larval hemocytes,
  and acts in dorsal closure and thorax closure. Downstream of the receptor, signaling runs
  through several branches: the Ras-Raf-MEK-ERK cascade, a Crk-Myoblast city-Ced-12 route
  to the Rac GTPase that drives actin-based migration, a PI3K-Akt-TOR branch that supports
  growth and survival, and JNK and p38 kinase cascades.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000972
  title: 'FlyBase gene group PVR-RTK: Pvr signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 41 D. melanogaster genes as pvr signaling pathway (PVR-RTK);
    this module models that group.
- source_id: GO:0048008
  title: platelet-derived growth factor receptor signaling pathway
  statement: >-
    GO term grounding the module as platelet-derived growth factor receptor signaling pathway.
- source_id: GO:0048010
  title: vascular endothelial growth factor receptor signaling pathway
  statement: >-
    GO term grounding the module as vascular endothelial growth factor receptor signaling
    pathway.
notes: >-
  Boundary. The downstream branches are shared with many other receptor pathways and are modelled
  here only as the FlyBase PVR core components. The branches are drawn as parallel outputs
  of the receptor; which branch is used depends on cell type (Ras-ERK and Rac in migrating
  cells, PI3K-TOR in hemocyte survival and growth). FlyBase groups realized by this module:
  PVR-RTK (FBgg0000972). Subgroups folded into it: PVR-C. FlyBase also curates regulator sets
  for this pathway, which are context and not modelled as parts: PVR-N (negative regulators
  of pvr signaling pathway, 7 genes); PVR-P (positive regulators of pvr signaling pathway,
  1 genes). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_pvr_signaling.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
