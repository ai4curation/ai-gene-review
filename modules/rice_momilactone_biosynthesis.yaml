id: MODULE:rice_momilactone_biosynthesis
title: Rice momilactone A and B biosynthesis
description: 'Biosynthesis of the rice diterpenoids momilactones A and B from geranylgeranyl diphosphate.
  Cyclases construct a syn-pimaradiene scaffold, cytochrome P450 enzymes oxidize it, and short-chain dehydrogenases
  support lactone and ketone formation. The chromosome 4 biosynthetic gene cluster supplies only part
  of this pathway: additional P450 enzymes are encoded on chromosomes 2, 6, and 1. Momilactones participate
  in plant chemical defense and allelopathy.'
status: DRAFT
scope: CONCRETE
references:
- id: PMID:15255861
  title: Functional identification of rice syn-copalyl diphosphate synthase and its role in initiating
    biosynthesis of diterpenoid phytoalexin/allelopathic natural products.
- id: PMID:15299118
  title: Identification of syn-pimara-7,15-diene synthase reveals functional clustering of terpene synthases
    involved in rice phytoalexin/allelochemical biosynthesis.
- id: PMID:17872948
  title: Identification of a biosynthetic gene cluster in rice for momilactones.
- id: PMID:27337377
  title: Investigating inducible short-chain alcohol dehydrogenases/reductases clarifies rice oryzalexin
    biosynthesis.
- id: PMID:33793769
  title: Interdependent evolution of biosynthetic gene clusters for momilactone production in rice.
- id: PMID:33106662
  title: Rerouting plant terpene biosynthesis enables momilactone pathway elucidation.
- id: PMID:39887739
  title: Evolution and diversification of the momilactone biosynthetic gene cluster in the genus Oryza.
evidence:
- source_id: MIBiG:BGC0000671
  title: Momilactone B biosynthetic gene cluster from Oryza sativa Japonica Group
  url: https://mibig.secondarymetabolites.org/repository/BGC0000671.3/index.html
  statement: Records the chromosome 4 cluster. Version 3 reports questionable quality and unknown completeness;
    cluster membership is not evidence of pathway self-sufficiency.
- source_id: PMID:17872948
  title: Identification of a biosynthetic gene cluster in rice for momilactones.
  statement: Initial functional identification of the chromosome 4 cluster and joint genetic evidence
    for CYP99A2/CYP99A3.
- source_id: PMID:33793769
  title: Interdependent evolution of biosynthetic gene clusters for momilactone production in rice.
  statement: Combines rice genetics and enzyme assays to resolve the interleaved chromosome 4/chromosome
    2 route through a hemiacetal intermediate.
- source_id: PMID:33106662
  title: Rerouting plant terpene biosynthesis enables momilactone pathway elucidation.
  statement: Complete heterologous reconstitution establishes a route to momilactones A and B, including
    CYP76M14, while leaving native reaction ordering partly unresolved.
- source_id: PMID:39887739
  title: Evolution and diversification of the momilactone biosynthetic gene cluster in the genus Oryza.
  statement: Comparative Oryza research places CYP76M8, CYP701A8, and CYP76M14 outside the chromosome
    4 cluster and supports limiting the exact arrangement to the specified rice taxon.
- source_id: file:ORYSJ/CPS4/CPS4-ai-review.yaml
  title: Rice CPS4 gene review
  statement: Existing gene review for the upstream syn-copalyl diphosphate synthase.
- source_id: file:modules/rice_momilactone_biosynthesis-notes.md
  title: Rice momilactone primary-source curation notes
  statement: Records pathway boundaries, source checks, protein grounding, and distinctions between established
    chemistry and uncertain native ordering.
- source_id: file:modules/rice_momilactone_biosynthesis-deep-research-manual.md
  title: Manual primary-literature research for rice momilactone biosynthesis
  statement: Manually checked primary studies and database records; the attempted Falcon run timed out
    without producing a report.
notes: The boundary starts with supplied geranylgeranyl diphosphate and ends at momilactone A, with optional
  elaboration to B. General precursor supply, NAD(P)H/flavin-dependent P450 electron delivery, transport,
  secretion, and induction circuitry are outside this module. Native targeting of the early cyclases must
  not be inferred from engineered cytosolic expression in Nicotiana benthamiana. Protein participants
  are specific japonica accessions; no PANTHER ancestral-node or universal plant-family claim is made.
  Precise descriptors without GO identifiers are intentional where retrieved GO definitions name a different
  substrate or oxidation endpoint. The two C3 alternatives express evidence-supported biochemical capabilities,
  not an assertion of their quantitative contributions in native rice. The current protein grounding covers
  one assayed MAS paralog and does not exhaust native SDR alternatives.
module:
  id: rice_momilactone_biosynthesis
  label: Rice momilactone A synthesis with momilactone B elaboration
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: momilactone diterpenoid biosynthesis
    term:
      id: GO:0016102
      label: diterpenoid biosynthetic process
  - preferred_term: chromosome 4 momilactone biosynthetic gene cluster
    term:
      id: MIBiG:BGC0000671
      label: momilactone B biosynthetic gene cluster from Oryza sativa Japonica Group
    description: Association with the genomic cluster; the functional pathway includes additional genes
      outside this interval.
  context:
    taxa:
    - preferred_term: Oryza sativa subsp. japonica
      term:
        id: NCBITaxon:39947
        label: Oryza sativa Japonica Group
  parts:
  - order: 1
    role: diterpene scaffold formation
    node:
      id: scaffold_formation
      label: Cyclization to the syn-pimaradiene scaffold
      module_type: METABOLIC_PATHWAY
      parts:
      - order: 1
        role: syn-copalyl diphosphate formation
        node:
          id: cps4_step
          label: 'CPS4: syn-copalyl diphosphate formation'
          module_type: REACTION
          annotons:
          - id: cps4_step_activity
            label: 'CPS4: syn-copalyl diphosphate formation'
            participant:
              selector_type: GENE
              gene:
                preferred_term: CPS4
                term:
                  id: UniProtKB:Q0JF02
                  label: Syn-copalyl diphosphate synthase, chloroplastic
                description: Os04g0178300 / LOC_Os04g09900; chromosome 4 cluster.
                evidence:
                - source_id: UniProtKB:Q0JF02
                  url: https://rest.uniprot.org/uniprotkb/Q0JF02.json
                  statement: Verified protein accession, organism, and available gene/locus cross-references.
            function:
              preferred_term: syn-copalyl diphosphate synthase activity
              term:
                id: GO:0051498
                label: syn-copalyl diphosphate synthase activity
              substrates:
              - preferred_term: geranylgeranyl diphosphate
              products:
              - preferred_term: syn-copalyl diphosphate
            role_description: syn-copalyl diphosphate synthase activity
            evidence:
            - source_id: PMID:15255861
              title: Functional identification of rice syn-copalyl diphosphate synthase and its role in
                initiating biosynthesis of diterpenoid phytoalexin/allelopathic natural products.
              statement: Biochemical identification of rice syn-copalyl diphosphate synthase.
          notes: CPS4 also supplies other syn-copalyl-diphosphate-derived diterpenoids; this entry step
            is not specific to momilactones.
      - order: 2
        role: committed scaffold formation
        node:
          id: ksl4_step
          label: 'KSL4: committed syn-pimaradiene scaffold formation'
          module_type: REACTION
          annotons:
          - id: ksl4_step_activity
            label: 'KSL4: committed syn-pimaradiene scaffold formation'
            participant:
              selector_type: GENE
              gene:
                preferred_term: KSL4
                term:
                  id: UniProtKB:Q0JEZ8
                  label: 9-beta-pimara-7,15-diene synthase, chloroplastic
                description: Os04g0179700 / LOC_Os04g10060; chromosome 4 cluster.
                evidence:
                - source_id: UniProtKB:Q0JEZ8
                  url: https://rest.uniprot.org/uniprotkb/Q0JEZ8.json
                  statement: Verified protein accession, organism, and available gene/locus cross-references.
            function:
              preferred_term: syn-pimara-7,15-diene synthase activity
              term:
                id: GO:0034279
                label: syn-pimara-7,15-diene synthase activity
              substrates:
              - preferred_term: syn-copalyl diphosphate
              products:
              - preferred_term: syn-pimara-7,15-diene
              - preferred_term: diphosphate
            role_description: syn-pimara-7,15-diene synthase activity
            evidence:
            - source_id: PMID:15299118
              title: Identification of syn-pimara-7,15-diene synthase reveals functional clustering of
                terpene synthases involved in rice phytoalexin/allelochemical biosynthesis.
              statement: Direct identification of the rice syn-pimaradiene-forming enzyme.
      connections:
      - source: cps4_step
        target: ksl4_step
        connection_type: PROVIDES_INPUT_FOR
        description: CPS4 supplies syn-copalyl diphosphate to KSL4.
  - order: 2
    role: lactone ring formation across cluster boundaries
    node:
      id: lactone_formation
      label: C19 and C6 oxidation followed by lactonization
      module_type: METABOLIC_PATHWAY
      parts:
      - order: 1
        role: C19 aldehyde formation
        node:
          id: c19_oxidation
          label: C19 oxidation by CYP99A2 or CYP99A3
          module_type: REACTION
          variant_sets:
          - id: c19_paralogs
            label: Biochemically supported CYP99A alternatives
            axis: enzyme paralog
            selection: ONE_OR_MORE
            variants:
            - id: cyp99a2_c19
              label: 'CYP99A2: C19 aldehyde formation'
              module_type: REACTION
              annotons:
              - id: cyp99a2_c19_activity
                label: 'CYP99A2: C19 aldehyde formation'
                participant:
                  selector_type: GENE
                  gene:
                    preferred_term: CYP99A2
                    term:
                      id: UniProtKB:Q7X7X4
                      label: Cytochrome P450 99A2
                    description: Os04g0180400 / LOC_Os04g10160; chromosome 4 cluster.
                    evidence:
                    - source_id: UniProtKB:Q7X7X4
                      url: https://rest.uniprot.org/uniprotkb/Q7X7X4.json
                      statement: Verified protein accession, organism, and available gene/locus cross-references.
                function:
                  preferred_term: successive C19 oxidations of syn-pimaradiene to syn-pimaradien-19-al
                  substrates:
                  - preferred_term: syn-pimara-7,15-diene
                  products:
                  - preferred_term: syn-pimaradien-19-al
                role_description: successive C19 oxidations of syn-pimaradiene to syn-pimaradien-19-al
                evidence:
                - source_id: PMID:33793769
                  title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                    in rice.
                  statement: Both CYP99A paralogs can supply the aldehyde used by CYP76M8 in the preferred
                    biochemical sequence.
              notes: GO:0036209 describes complete oxidation through the C19 carboxylate. It is deliberately
                not attached to this aldehyde-output role.
            - id: cyp99a3_c19
              label: 'CYP99A3: C19 aldehyde formation'
              module_type: REACTION
              annotons:
              - id: cyp99a3_c19_activity
                label: 'CYP99A3: C19 aldehyde formation'
                participant:
                  selector_type: GENE
                  gene:
                    preferred_term: CYP99A3
                    term:
                      id: UniProtKB:Q0JF01
                      label: 9-beta-pimara-7,15-diene oxidase
                    description: Os04g0178400 / LOC_Os04g09920; chromosome 4 cluster.
                    evidence:
                    - source_id: UniProtKB:Q0JF01
                      url: https://rest.uniprot.org/uniprotkb/Q0JF01.json
                      statement: Verified protein accession, organism, and available gene/locus cross-references.
                function:
                  preferred_term: successive C19 oxidations of syn-pimaradiene to syn-pimaradien-19-al
                  substrates:
                  - preferred_term: syn-pimara-7,15-diene
                  products:
                  - preferred_term: syn-pimaradien-19-al
                role_description: successive C19 oxidations of syn-pimaradiene to syn-pimaradien-19-al
                evidence:
                - source_id: PMID:33793769
                  title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                    in rice.
                  statement: Both CYP99A paralogs can supply the aldehyde used by CYP76M8 in the preferred
                    biochemical sequence.
              notes: GO:0036209 describes complete oxidation through the C19 carboxylate. It is deliberately
                not attached to this aldehyde-output role.
          notes: Alternative catalytic capacity does not establish that either single gene is individually
            dispensable in every native context; the original genetic perturbation targeted both paralogs.
      - order: 2
        role: C6 hydroxylation and nonenzymatic hemiacetal formation
        node:
          id: cyp76m8_step
          label: 'CYP76M8: C6beta hydroxylation before hemiacetal closure'
          module_type: REACTION
          annotons:
          - id: cyp76m8_step_activity
            label: 'CYP76M8: C6beta hydroxylation before hemiacetal closure'
            participant:
              selector_type: GENE
              gene:
                preferred_term: CYP76M8
                term:
                  id: UniProtKB:Q6YTF1
                  label: Oryzalexin D synthase
                description: Os02g0569400 / LOC_Os02g36070; chromosome 2 diterpenoid cluster. Its UniProt
                  name describes another substrate-specific role.
                evidence:
                - source_id: UniProtKB:Q6YTF1
                  url: https://rest.uniprot.org/uniprotkb/Q6YTF1.json
                  statement: Verified protein accession, organism, and available gene/locus cross-references.
            function:
              preferred_term: C6beta hydroxylation of syn-pimaradien-19-al
              substrates:
              - preferred_term: syn-pimaradien-19-al
              products:
              - preferred_term: 6beta-hydroxy-syn-pimaradien-19-al
            role_description: C6beta hydroxylation of syn-pimaradien-19-al
            evidence:
            - source_id: PMID:33793769
              title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                in rice.
              statement: Biochemical ordering and rice genetic evidence place the chromosome 2 enzyme
                between chromosome 4-encoded reactions.
          notes: The hydroxy-aldehyde subsequently forms the 19,6beta-hemiacetal, apparently spontaneously.
            GO:0102612 specifies unoxidized syn-pimaradiene, so it is not used for this aldehyde-substrate
            role.
      - order: 3
        role: hemiacetal oxidation
        node:
          id: osmas_lactone_step
          label: 'OsMAS: oxidation of the hemiacetal to the lactone'
          module_type: REACTION
          annotons:
          - id: osmas_lactone_step_activity
            label: 'OsMAS: oxidation of the hemiacetal to the lactone'
            participant:
              selector_type: GENE
              gene:
                preferred_term: OsMAS
                term:
                  id: UniProtKB:Q7FAE1
                  label: Momilactone A synthase
                description: Os04g0179200 / LOC_Os04g10010; chromosome 4 cluster. Experimentally studied
                  clone AK103462; accession and locus disambiguate inconsistent MS1/MAS1 numbering.
                evidence:
                - source_id: UniProtKB:Q7FAE1
                  url: https://rest.uniprot.org/uniprotkb/Q7FAE1.json
                  statement: Verified protein accession, organism, and available gene/locus cross-references.
            function:
              preferred_term: oxidation of the 19,6beta-hemiacetal to syn-pimaradien-19,6beta-olide
              substrates:
              - preferred_term: syn-pimaradien-19,6beta-hemiacetal
              products:
              - preferred_term: syn-pimaradien-19,6beta-olide
            role_description: oxidation of the 19,6beta-hemiacetal to syn-pimaradien-19,6beta-olide
            evidence:
            - source_id: PMID:33793769
              title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                in rice.
              statement: Assayed clustered SDRs oxidize the hemiacetal to the lactone; the lactone intermediate
                was also detected in rice.
            - source_id: PMID:33106662
              title: Rerouting plant terpene biosynthesis enables momilactone pathway elucidation.
              statement: OsMAS supports lactone formation in the reconstructed plant pathway.
          notes: This reaction is distinct from the C3-alcohol oxidation described by GO:0102960. Lactone
            formation proceeds by hemiacetal oxidation, not simple dehydration of a C19 carboxylic acid
            and a C6 alcohol. Only the fully mapped OsMAS/AK103462 protein Q7FAE1 is represented here.
            The second assayed MAS paralog is an acknowledged alternative whose exact full-length experimental
            sequence-to-UniProt mapping was not established; absence of Q7FAE1 alone must not be interpreted
            as proof of absent native lactonization capacity.
      connections:
      - source: c19_oxidation
        target: cyp76m8_step
        connection_type: PROVIDES_INPUT_FOR
        description: The CYP99A aldehyde product is the preferred CYP76M8 substrate.
      - source: cyp76m8_step
        target: osmas_lactone_step
        connection_type: PROVIDES_INPUT_FOR
        description: The C6-hydroxy C19-aldehyde cyclizes to the hemiacetal substrate of OsMAS; this intervening
          closure appears spontaneous.
  - order: 3
    role: formation of momilactone A
    node:
      id: c3_tailoring
      label: C3 ketone formation yields momilactone A
      module_type: METABOLIC_PATHWAY
      variant_sets:
      - id: c3_enzyme_division
        label: Supported divisions of C3 oxidative labor
        axis: enzyme contribution to terminal C3 oxidation
        selection: ONE_OR_MORE
        variants:
        - id: cyp701a8_direct_route
          label: CYP701A8-supported C3 tailoring to momilactone A
          module_type: REACTION
          annotons:
          - id: cyp701a8_direct_route_activity
            label: CYP701A8-supported C3 tailoring to momilactone A
            participant:
              selector_type: GENE
              gene:
                preferred_term: CYP701A8
                term:
                  id: UniProtKB:Q0DBF4
                  label: Ent-sandaracopimaradiene 3-hydroxylase
                description: Os06g0569500 / LOC_Os06g37300; chromosome 6, outside the chromosome 4 cluster.
                  The UniProt name describes activity on a different diterpene.
                evidence:
                - source_id: UniProtKB:Q0DBF4
                  url: https://rest.uniprot.org/uniprotkb/Q0DBF4.json
                  statement: Verified protein accession, organism, and available gene/locus cross-references.
            function:
              preferred_term: C3 oxidative tailoring of the lactone toward the momilactone A ketone
              substrates:
              - preferred_term: syn-pimaradien-19,6beta-olide
              products:
              - preferred_term: momilactone A
            role_description: C3 oxidative tailoring of the lactone toward the momilactone A ketone
            evidence:
            - source_id: PMID:33793769
              title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                in rice.
              statement: Cell-free CYP701A8 assays with the lactone produced small amounts of momilactone
                A, suggesting sequential C3 hydroxylation and oxidation.
            - source_id: PMID:33106662
              title: Rerouting plant terpene biosynthesis enables momilactone pathway elucidation.
              statement: Addition of CYP701A8 to the reconstructed pathway yielded momilactone A.
          notes: A biochemically supported route, not a claim that CYP701A8 supplies all native C3 oxidation.
            Product reconstruction in a heterologous plant does not exclude assistance from host oxidoreductases.
            No substrate-mismatched GO term is assigned.
        - id: cyp701a8_sdr_route
          label: CYP701A8 hydroxylation followed by SDR oxidation
          module_type: METABOLIC_PATHWAY
          parts:
          - order: 1
            role: C3 hydroxylation
            node:
              id: cyp701a8_hydroxylation_step
              label: 'CYP701A8: C3beta hydroxylation'
              module_type: REACTION
              annotons:
              - id: cyp701a8_hydroxylation_step_activity
                label: 'CYP701A8: C3beta hydroxylation'
                participant:
                  selector_type: GENE
                  gene:
                    preferred_term: CYP701A8
                    term:
                      id: UniProtKB:Q0DBF4
                      label: Ent-sandaracopimaradiene 3-hydroxylase
                    description: Os06g0569500 / LOC_Os06g37300; chromosome 6, outside the chromosome 4
                      cluster. The UniProt name describes activity on a different diterpene.
                    evidence:
                    - source_id: UniProtKB:Q0DBF4
                      url: https://rest.uniprot.org/uniprotkb/Q0DBF4.json
                      statement: Verified protein accession, organism, and available gene/locus cross-references.
                function:
                  preferred_term: C3beta hydroxylation of syn-pimaradien-19,6beta-olide
                  substrates:
                  - preferred_term: syn-pimaradien-19,6beta-olide
                  products:
                  - preferred_term: 3beta-hydroxy-syn-pimaradien-19,6beta-olide
                role_description: C3beta hydroxylation of syn-pimaradien-19,6beta-olide
                evidence:
                - source_id: PMID:33793769
                  title: Interdependent evolution of biosynthetic gene clusters for momilactone production
                    in rice.
                  statement: The proposed SDR-assisted route places CYP701A8-mediated C3 hydroxylation
                    before oxidation of the alcohol to the momilactone A ketone.
              notes: The specific UniProt-linked GO term for ent-sandaracopimaradiene hydroxylation has
                a different substrate and is not used here.
          - order: 2
            role: C3 alcohol oxidation
            node:
              id: osmas_c3_oxidation_step
              label: 'OsMAS: C3 alcohol oxidation to momilactone A'
              module_type: REACTION
              annotons:
              - id: osmas_c3_oxidation_step_activity
                label: 'OsMAS: C3 alcohol oxidation to momilactone A'
                participant:
                  selector_type: GENE
                  gene:
                    preferred_term: OsMAS
                    term:
                      id: UniProtKB:Q7FAE1
                      label: Momilactone A synthase
                    description: Os04g0179200 / LOC_Os04g10010; chromosome 4 cluster. Experimentally studied
                      clone AK103462; accession and locus disambiguate inconsistent MS1/MAS1 numbering.
                    evidence:
                    - source_id: UniProtKB:Q7FAE1
                      url: https://rest.uniprot.org/uniprotkb/Q7FAE1.json
                      statement: Verified protein accession, organism, and available gene/locus cross-references.
                function:
                  preferred_term: momilactone A formation by oxidation of the C3 alcohol
                  term:
                    id: GO:0102960
                    label: momilactone-A synthase [NAD(P)H] activity
                  substrates:
                  - preferred_term: 3beta-hydroxy-syn-pimaradien-19,6beta-olide
                  - preferred_term: NAD+ or NADP+
                  products:
                  - preferred_term: momilactone A
                  - preferred_term: NADH or NADPH
                  - preferred_term: proton
                role_description: momilactone A formation by oxidation of the C3 alcohol
                evidence:
                - source_id: PMID:17872948
                  title: Identification of a biosynthetic gene cluster in rice for momilactones.
                  statement: The clustered OsMAS converts the C3-hydroxy lactone into momilactone A.
                - source_id: PMID:27337377
                  title: Investigating inducible short-chain alcohol dehydrogenases/reductases clarifies
                    rice oryzalexin biosynthesis.
                  statement: The two clustered SDRs have different efficiencies on the C3-hydroxy substrate.
          connections:
          - source: cyp701a8_hydroxylation_step
            target: osmas_c3_oxidation_step
            connection_type: PROVIDES_INPUT_FOR
            description: The hydroxylated lactone supplies the SDR substrate.
      notes: The alternatives represent biochemical capacity; their relative contributions in native rice
        are not established by heterologous reconstruction. OsMAS can participate at both lactone formation
        and C3 oxidation without representing two different proteins.
  - order: 4
    role: additional C20 oxidation and hemiacetal closure for momilactone B
    optional: true
    node:
      id: cyp76m14_step
      label: 'CYP76M14: C20 hydroxylation enabling momilactone B formation'
      module_type: REACTION
      annotons:
      - id: cyp76m14_step_activity
        label: 'CYP76M14: C20 hydroxylation enabling momilactone B formation'
        participant:
          selector_type: GENE
          gene:
            preferred_term: CYP76M14
            term:
              id: UniProtKB:Q8LJD2
              label: Os01g0561600 protein
            description: Os01g0561600; chromosome 1, outside the chromosome 4 cluster. The CYP76M14 symbol
              is verified in RAP-DB; this UniProt entry is unreviewed.
            evidence:
            - source_id: UniProtKB:Q8LJD2
              url: https://rest.uniprot.org/uniprotkb/Q8LJD2.json
              statement: Verified protein accession, organism, and available gene/locus cross-references.
            - source_id: https://rapdb.dna.naro.go.jp/transcript/?name=Os01t0561600-01
              title: RAP-DB Os01t0561600-01
              statement: Curated transcript record assigns CYP76M14 to Os01g0561600, the locus of UniProtKB:Q8LJD2.
        function:
          preferred_term: C20 hydroxylation of the momilactone scaffold
          substrates:
          - preferred_term: syn-pimaradien-19,6beta-olide
          products:
          - preferred_term: 20-hydroxy-syn-pimaradien-19,6beta-olide
        role_description: C20 hydroxylation of the momilactone scaffold
        evidence:
        - source_id: PMID:33106662
          title: Rerouting plant terpene biosynthesis enables momilactone pathway elucidation.
          statement: CYP76M14 supplies C20 oxidation in the complete reconstruction yielding momilactone
            B.
      notes: C20 hydroxylation was demonstrated on the pre-C3 lactone. Together with CYP701A8-dependent
        C3 tailoring, this activity supports production of momilactone B and its additional hemiacetal
        ring. No separate ring-closing enzyme is asserted. The exact native order of C3 and C20 oxidation
        is unresolved; this annoton does not assert that isolated momilactone A was directly assayed as
        the CYP76M14 substrate.
  connections:
  - source: ksl4_step
    target: c19_oxidation
    connection_type: PROVIDES_INPUT_FOR
    description: Syn-pimaradiene enters C19 oxidation.
  - source: osmas_lactone_step
    target: c3_tailoring
    connection_type: PROVIDES_INPUT_FOR
    description: The lactone supplies the C3-tailoring routes.
  - source: osmas_lactone_step
    target: cyp76m14_step
    connection_type: PROVIDES_INPUT_FOR
    description: The pre-C3 lactone is a demonstrated CYP76M14 substrate. This branch combines with the
      shared C3-tailoring capacity to yield momilactone B; the native order of the C3 and C20 reactions
      remains unresolved.
  notes: Required parts describe a route to momilactone A. The optional CYP76M14 part adds the chemistry
    needed for momilactone B; its absence must not be interpreted as loss of A biosynthesis. Display order
    and connections describe supported chemical flow, not physical order of genes along chromosomes. The
    C20 branch is drawn from the lactone substrate demonstrated experimentally, rather than as a directly
    assayed momilactone A-to-B conversion. Module satisfaction alone addresses A capacity; B additionally
    requires CYP76M14 and the shared tailoring machinery.
knowledge_gaps:
