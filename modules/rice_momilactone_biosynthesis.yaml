    versus SDR activity to the C3 ketone, remain unresolved by complete heterologous pathway reconstruction.
  boundary: Complete momilactone A/B production has been reconstructed. Cell-free assays support the preferred
    C19-aldehyde/C6-hydroxylation/hemiacetal/lactone sequence and CYP701A8-dependent C3 oxidation.
