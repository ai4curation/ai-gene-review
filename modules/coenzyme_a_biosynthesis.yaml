id: MODULE:coenzyme_a_biosynthesis
title: Pantoate-derived coenzyme A biosynthesis
description: >-
  Synthesis of coenzyme A (CoA) from pantoate and beta-alanine. The
  pantoate branch transfers a hydroxymethyl group to 3-methyl-2-oxobutanoate,
  reduces 2-dehydropantoate to (R)-pantoate, and reaches
  4'-phosphopantothenate by one of two reaction-order variants. Bacteria and
  eukaryotes generally use PanC to form pantothenate and then one of three
  unrelated pantothenate kinase families. Most archaea instead phosphorylate
  pantoate with PoK before PPS condenses 4-phosphopantoate with beta-alanine,
  so free pantothenate is not an intermediate. Four subsequent reactions add
  and decarboxylate cysteine, adenylylate 4'-phosphopantetheine, and
  phosphorylate dephospho-CoA. CoaB and CoaC may be separate or fused, and the
  final CoaD and CoaE activities may be separate or fused in CoA synthase.
  The phosphopantothenoylcysteine decarboxylase may be a homo-oligomeric
  flavoprotein or, in budding yeast, a heterotrimer in which two paralogous
  subunit types each contribute an essential catalytic residue. Beta-alanine
  is supplied by lineage-specific routes and is modeled as an optional supply
  part with two characterized enzymatic variants: PanD-dependent decarboxylation
  of L-aspartate in bacteria, and the polyamine-oxidation route of
  Saccharomyces-type yeasts, in which a flavin polyamine oxidase cleaves
  spermine to spermidine and 3-aminopropanal and cytosolic aldehyde
  dehydrogenases oxidize 3-aminopropanal to beta-alanine. Pyrimidine
  degradation and uptake are further sources that are not modeled here. CoA
  salvage, phosphopantetheine release from acyl carrier proteins, and
  downstream CoA-dependent metabolism are outside the module boundary.
status: DRAFT
evidence:
  - source_id: GO:0015940
    title: pantothenate biosynthetic process
    statement: >-
      Grounds the canonical PanC branch that forms pantothenate from pantoate
      and beta-alanine before phosphorylation.
  - source_id: GO:0015937
    title: coenzyme A biosynthetic process
    statement: >-
      Grounds conversion of pantoate-derived intermediates to CoA through
      convergence at 4'-phosphopantothenate.
  - source_id: KEGG:ppu00770
    title: Pseudomonas putida KT2440 pantothenate and CoA biosynthesis map
    statement: >-
      Grounds the PSEPK pathway instance and its exact PanB, PanC, PanE-like,
      CoaX, CoaBC, CoaD, and CoaE candidates. Broad map membership is not used
      by itself to promote salvage or pyrimidine-catabolism proteins into this
      reaction chain.
  - source_id: PMID:26913973
    title: The revisited genome of Pseudomonas putida KT2440 enlightens its value as a robust metabolic chassis.
    statement: >-
      The KT2440 genome reannotation supports reductive pyrimidine degradation
      as a source of beta-alanine. This resolves substrate supply without
      inventing a PanD ortholog or making pyrimidine catabolism a core part of
      the reusable module.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      Provides accession and locus mappings used for the PSEPK satisfiability
      check and exposes broad KEGG spillover that requires manual boundary
      review.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__coenzyme_a_biosynthesis__ppu00770-deep-research-openscientist.md
    title: OpenScientist PSEPK module, pathway, and taxon synthesis
    statement: >-
      Species-aware retrieval used to assess paralog candidates, beta-alanine
      supply, and the distinction between biosynthesis and salvage mappings.
  - source_id: file:modules/coenzyme_a_biosynthesis-deep-research-openscientist.md
    title: OpenScientist generic pantoate-derived CoA biosynthesis synthesis
    statement: >-
      Confirms the conserved reaction boundary, enzyme-architecture variants,
      and the archaeal PoK/PPS route that reverses the order of beta-alanine
      condensation and phosphorylation before convergence at
      4'-phosphopantothenate.
  - source_id: YeastPathways:PANTOSYN2-PWY
    title: pantothenate and coenzyme A biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD YeastCyc pathway lists ten reactions from 2-ketoisovalerate and
      spermine to CoA with ECM31, PAN5, PAN6, CAB1, CAB2, CAB3/SIS2/VHS3, CAB4,
      CAB5, FMS1 and ALD2/ALD3 as catalysts. All gene assignments were
      retained; the PPCDC reaction was re-modeled as a Cab3 plus Sis2/Vhs3
      heterotrimer rather than three alternative enzymes.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PANTOSYN2-PWY
  - source_id: YeastPathways:PWY-5760-1
    title: beta-alanine biosynthesis IV (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Two-reaction frame (FMS1 spermine oxidation, ALD2/ALD3 3-aminopropanal
      oxidation) that is folded into the module as the polyamine-derived
      beta-alanine supply variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5760-1
  - source_id: GO:0019483
    title: beta-alanine biosynthetic process
    statement: Grounds the optional beta-alanine supply part.
  - source_id: PMID:11154694
    title: >-
      Saccharomyces cerevisiae is capable of de Novo pantothenic acid
      biosynthesis involving a novel pathway of beta-alanine production from
      spermine.
    statement: >-
      FMS1 is rate-limiting for beta-alanine and pantothenate synthesis, the
      polyamine pathway is required for beta-alanine, and ECM31 and YIL145c
      (PAN6) are required for pantothenate biosynthesis.
  - source_id: PMID:12586697
    title: >-
      Specialization of function among aldehyde dehydrogenases: the ALD2 and
      ALD3 genes are required for beta-alanine biosynthesis in Saccharomyces
      cerevisiae.
    statement: >-
      ALD2 and ALD3 convert 3-aminopropanal to beta-alanine in vivo; the
      mitochondrial Ald5p does not act directly in this conversion.
  - source_id: PMID:19266201
    title: >-
      Genetic analysis of coenzyme A biosynthesis in the yeast Saccharomyces
      cerevisiae: identification of a conditional mutation in the pantothenate
      kinase gene CAB1.
    statement: >-
      ECM31 and PAN6 are required for pantothenate prototrophy, PAN5 loss is
      tolerated, CAB1 encodes pantothenate kinase, and the late CoA genes are
      essential and complemented by bacterial coaBC, coaD and coaE.
  - source_id: PMID:19915539
    title: Moonlighting proteins Hal3 and Vhs3 form a heteromeric PPCDC with Ykl088w in yeast CoA biosynthesis.
    statement: >-
      The S. cerevisiae PPCDC is a heterotrimer of Ykl088w (Cab3) with Hal3
      (Sis2) or Vhs3, whose subunits separately provide two essential
      catalytic residues.
  - source_id: PMID:23789928
    title: >-
      Molecular characterization of the heteromeric coenzyme A-synthesizing
      protein complex (CoA-SPC) in the yeast Saccharomyces cerevisiae.
    statement: >-
      Cab2, Cab3, Cab4 and Cab5 form a CoA-synthesizing protein complex with
      Sis2 and Vhs3; pantothenate kinase Cab1 does not join it.
  - source_id: PMID:23962284
    title: The Schizosaccharomyces pombe fusion gene hal3 encodes three distinct activities.
    statement: >-
      S. pombe Hal3 (SPAC15E1.04) is a monogenic PPCDC whose N-terminal
      Hal3-like domain is fused to a thymidylate synthase domain.
  - source_id: file:yeast/ALD2/ALD2-ai-review.yaml
    title: S. cerevisiae ALD2 gene review
    statement: >-
      The completed ALD2 review assigns GO:0102244 3-aminopropanal
      dehydrogenase (NAD+) activity in beta-alanine biosynthesis as the core
      function.
  - source_id: file:human/PPCS/PPCS-ai-review.yaml
    title: Human PPCS gene review
    statement: Grounds the standalone ATP-preferring phosphopantothenate--cysteine ligase implementation.
  - source_id: file:human/PPCDC/PPCDC-ai-review.yaml
    title: Human PPCDC gene review
    statement: Grounds the standalone phosphopantothenoylcysteine decarboxylase implementation.
  - source_id: file:human/COASY/COASY-ai-review.yaml
    title: Human COASY gene review
    statement: Grounds the fused PPAT and dephospho-CoA kinase implementation.
  - source_id: file:PSEPK/panB/panB-ai-review.yaml
    title: PSEPK PanB gene review
    statement: Grounds the bacterial ketopantoate-hydroxymethyltransferase implementation.
  - source_id: file:PSEPK/panE/panE-ai-review.yaml
    title: PSEPK PanE gene review
    statement: Grounds the canonical bacterial ketopantoate-reductase implementation.
  - source_id: file:PSEPK/panC/panC-ai-review.yaml
    title: PSEPK PanC gene review
    statement: Grounds the bacterial pantothenate-synthetase implementation.
  - source_id: file:PSEPK/coaX/coaX-ai-review.yaml
    title: PSEPK CoaX gene review
    statement: Grounds the bacterial type III pantothenate kinase implementation.
  - source_id: file:PSEPK/dfp/dfp-ai-review.yaml
    title: PSEPK CoaBC gene review
    statement: Grounds the fused bacterial CoaB and CoaC implementation.
  - source_id: file:PSEPK/coaD/coaD-ai-review.yaml
    title: PSEPK CoaD gene review
    statement: Grounds the standalone bacterial phosphopantetheine adenylyltransferase implementation.
  - source_id: file:PSEPK/coaE/coaE-ai-review.yaml
    title: PSEPK CoaE gene review
    statement: Grounds the standalone bacterial dephospho-CoA kinase implementation.
module:
  id: coenzyme_a_biosynthesis
  label: Pantoate-derived coenzyme A biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: pantothenate biosynthetic process
      term:
        id: GO:0015940
        label: pantothenate biosynthetic process
      description: >-
        Formation of pantothenate from pantoate and beta-alanine in the
        canonical PanC/PanK route.
    - preferred_term: coenzyme A biosynthetic process
      term:
        id: GO:0015937
        label: coenzyme A biosynthetic process
      description: >-
        Conversion of pantoate-derived intermediates to coenzyme A after route
        convergence at 4'-phosphopantothenate.
  gocam_associations:
    - model: gomodel:YeastPathways_PANTOSYN2-PWY
      title: 'pantothenate and coenzyme A biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae with thirteen activities
        and no causal edges, all placed in the cytosol and part of
        GO:0015937. FMS1 is typed GO:0052903 N(1)-acetylpolyamine oxidase
        activity rather than spermine oxidase, and ALD2/ALD3 the generic
        GO:0004029 rather than GO:0102244.
    - model: gomodel:YeastPathways_PWY-5760-1
      title: 'beta-alanine biosynthesis IV - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of the FMS1 / ALD2-ALD3 beta-alanine route (cytosol,
        GO:0019483); corresponds to the polyamine-derived beta-alanine
        variant.
    - model: gomodel:678073a900002636
      title: coenzyme A biosynthetic process (GO:0015937) and acetyl-CoA biosynthetic process (GO:0006085)
      description: >-
        PomBase S. pombe model for ptk1, ppc1, hal3, cab4 and cab5 (cytosolic
        CoA synthesis). It also contains a mitochondrial CoA transporter,
        acetyl-CoA synthetase and acetate CoA-transferase that lie outside
        this module, and assigns dephospho-CoA kinase activity to both cab4
        (a 316-residue PPAT-only protein) and cab5.
    - model: gomodel:67b1629100001098
      title: pantothenate biosynthetic process (GO:0015940)
      description: >-
        PomBase S. pombe model with mitochondrial ecm31 and pan5, and
        cytosolic pan6 and ptk1; no causal edges.
  parts:
    - order: 0
      role: beta-alanine supply (optional, lineage-specific)
      optional: true
      node:
        id: beta_alanine_supply
        label: Beta-alanine supply for pantothenate formation
        module_type: METABOLIC_PATHWAY
        description: >-
          Beta-alanine is the amine half of pantothenate. Its supply is
          lineage-specific and can also be met by uptake or by pyrimidine
          degradation, so the part is optional. The two variants here are the
          enzymatic routes with characterized dedicated enzymes.
        concepts:
          - preferred_term: beta-alanine biosynthetic process
            term:
              id: GO:0019483
              label: beta-alanine biosynthetic process
        variant_sets:
          - id: beta_alanine_supply_routes
            label: Beta-alanine supply routes
            axis: lineage-specific precursor route
            selection: ONE_OR_MORE
            variants:
              - id: aspartate_decarboxylation_route
                label: PanD aspartate decarboxylation (bacteria)
                module_type: REACTION
                annotons:
                  - id: panD_activity
                    label: PanD aspartate 1-decarboxylase
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: aspartate 1-decarboxylase activity
                        term:
                          id: GO:0004068
                          label: aspartate 1-decarboxylase activity
                      family:
                        preferred_term: PanD aspartate 1-decarboxylase family
                        term:
                          id: PANTHER:PTHR21012
                          label: ASPARTATE 1-DECARBOXYLASE
                        representative_members:
                          - preferred_term: panD (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0A790
                              label: Aspartate 1-decarboxylase
                            description: >-
                              Self-processing pyruvoyl-dependent decarboxylase
                              (E. coli panD/b0131).
                    function:
                      preferred_term: aspartate 1-decarboxylase activity
                      term:
                        id: GO:0004068
                        label: aspartate 1-decarboxylase activity
                      substrates:
                        - preferred_term: L-aspartate
                      products:
                        - preferred_term: beta-alanine
                        - preferred_term: carbon dioxide
                      evidence:
                        - source_id: EC:4.1.1.11
                          statement: Aspartate 1-decarboxylase.
                    role_description: >-
                      Bacterial one-step beta-alanine supply. Budding yeast
                      instead derives beta-alanine from polyamines
                      (PMID:11154694).
              - id: polyamine_oxidation_route
                label: Polyamine-derived beta-alanine (Saccharomyces-type yeasts)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Spermine made by the polyamine pathway (outside this module;
                  see MODULE:polyamine_metabolism) is oxidized by the flavin
                  polyamine oxidase Fms1 to spermidine and 3-aminopropanal,
                  which cytosolic aldehyde dehydrogenases oxidize to
                  beta-alanine. Loss of FMS1 or of both ALD2 and ALD3 causes
                  beta-alanine or pantothenate auxotrophy.
                parts:
                  - order: 1
                    role: spermine oxidation to 3-aminopropanal
                    node:
                      id: spermine_oxidase_step
                      label: Spermine to spermidine and 3-aminopropanal
                      module_type: REACTION
                      annotons:
                        - id: fms1_spermine_oxidase_activity
                          label: Fms1-type polyamine oxidase
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: spermine oxidase activity
                              term:
                                id: GO:0052901
                                label: spermine oxidase activity
                            family:
                              preferred_term: fungal Fms1-type flavin polyamine oxidase
                              description: >-
                                Fms1 sits in the large PANTHER flavin monoamine
                                oxidase family (PTHR10742) whose subfamily is
                                named for an unrelated lysine demethylase, so no
                                PANTHER term is asserted.
                              representative_members:
                                - preferred_term: FMS1 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P50264
                                    label: Polyamine oxidase FMS1
                                  description: S. cerevisiae FMS1/YMR020W.
                          function:
                            preferred_term: spermine oxidase activity
                            term:
                              id: GO:0052901
                              label: spermine oxidase activity
                            substrates:
                              - preferred_term: spermine
                              - preferred_term: dioxygen
                              - preferred_term: water
                            products:
                              - preferred_term: spermidine
                              - preferred_term: 3-aminopropanal
                              - preferred_term: hydrogen peroxide
                            cofactors:
                              - preferred_term: FAD
                            evidence:
                              - source_id: PMID:11154694
                                statement: >-
                                  a putative amine oxidase, encoded by FMS1, was
                                  found to be rate-limiting for beta-alanine and
                                  pantothenic acid biosynthesis
                          gocam_associations:
                            - model: gomodel:YeastPathways_PANTOSYN2-PWY
                              activity: gomodel:RXN-9015
                              title: 'pantothenate and coenzyme A biosynthesis - imported from: Saccharomyces Genome Database'
                              description: FMS1 typed GO:0052903 N(1)-acetylpolyamine oxidase activity, cytosol.
                            - model: gomodel:YeastPathways_PWY-5760-1
                              activity: gomodel:RXN-9015
                              title: 'beta-alanine biosynthesis IV - imported from: Saccharomyces Genome Database'
                              description: FMS1 typed GO:0052903, cytosol, part of GO:0019483.
                          role_description: >-
                            Produces 3-aminopropanal from spermine; the same
                            enzyme also oxidizes N1-acetylated polyamines in
                            polyamine back-conversion (MODULE:polyamine_metabolism).
                  - order: 2
                    role: 3-aminopropanal oxidation to beta-alanine
                    node:
                      id: aminopropanal_dehydrogenase_step
                      label: 3-Aminopropanal to beta-alanine
                      module_type: REACTION
                      annotons:
                        - id: ald2_ald3_aminopropanal_dehydrogenase_activity
                          label: Cytosolic 3-aminopropanal dehydrogenase (Ald2/Ald3)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 3-aminopropanal dehydrogenase (NAD+) activity
                              term:
                                id: GO:0102244
                                label: 3-aminopropanal dehydrogenase (NAD+) activity
                            family:
                              preferred_term: cytosolic Ald2/Ald3 aldehyde dehydrogenases
                              description: >-
                                Paralogous, tandemly arranged cytosolic aldehyde
                                dehydrogenases; their PANTHER subfamily is named
                                for an unrelated 2-aminomuconate semialdehyde
                                dehydrogenase, so no PANTHER term is asserted.
                              representative_members:
                                - preferred_term: ALD2 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P47771
                                    label: Aldehyde dehydrogenase [NAD(P)+] 1
                                  description: S. cerevisiae ALD2/YMR170C.
                                - preferred_term: ALD3 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P54114
                                    label: Aldehyde dehydrogenase [NAD(P)+] 2
                                  description: S. cerevisiae ALD3/YMR169C.
                          function:
                            preferred_term: 3-aminopropanal dehydrogenase (NAD+) activity
                            term:
                              id: GO:0102244
                              label: 3-aminopropanal dehydrogenase (NAD+) activity
                            substrates:
                              - preferred_term: 3-aminopropanal
                              - preferred_term: NAD+
                              - preferred_term: water
                            products:
                              - preferred_term: beta-alanine
                              - preferred_term: NADH
                            evidence:
                              - source_id: PMID:12586697
                                statement: >-
                                  the closely related aldehyde dehydrogenase genes
                                  ALD2 and ALD3 are required for pantothenic acid
                                  biosynthesis via conversion of 3-aminopropanal to
                                  beta-alanine in vivo
                              - source_id: file:yeast/ALD2/ALD2-ai-review.yaml
                                statement: >-
                                  Core function of ALD2 is GO:0102244 in the
                                  cytosol, part of beta-alanine biosynthesis.
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          gocam_associations:
                            - model: gomodel:YeastPathways_PANTOSYN2-PWY
                              activity: gomodel:3-PROPANAL-DEHYDROGENASE-RXN
                              title: 'pantothenate and coenzyme A biosynthesis - imported from: Saccharomyces Genome Database'
                              description: ALD2 and ALD3 typed with the generic GO:0004029, cytosol.
                            - model: gomodel:YeastPathways_PWY-5760-1
