                connections:
                  - source: spermine_oxidase_step
                    target: aminopropanal_dehydrogenase_step
                    connection_type: PROVIDES_INPUT_FOR
                    description: 3-Aminopropanal released by Fms1 is the dehydrogenase substrate.
    - order: 1
