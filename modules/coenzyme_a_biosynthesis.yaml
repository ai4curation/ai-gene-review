  connections:
    - source: beta_alanine_supply
      target: pantoate_to_phosphopantothenate_routes
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Beta-alanine from either supply route is condensed with pantoate (PanC)
        or 4-phosphopantoate (PPS).
    - source: ketopantoate_hydroxymethyltransferase_step
      target: ketopantoate_reductase_step
      connection_type: PROVIDES_INPUT_FOR
      description: PanB supplies 2-dehydropantoate to the PanE-like reductase.
    - source: ketopantoate_reductase_step
      target: pantoate_to_phosphopantothenate_routes
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The reductase supplies (R)-pantoate to either the PanC/PanK route or
        the archaeal PoK/PPS route.
    - source: pantoate_to_phosphopantothenate_routes
      target: phosphopantothenoylcysteine_ligase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Both route variants converge on 4'-phosphopantothenate, which is then
        conjugated with cysteine.
    - source: phosphopantothenoylcysteine_ligase_step
      target: phosphopantothenoylcysteine_decarboxylase_step
      connection_type: PROVIDES_INPUT_FOR
      description: Phosphopantothenoylcysteine is decarboxylated to phosphopantetheine.
    - source: phosphopantothenoylcysteine_decarboxylase_step
      target: phosphopantetheine_adenylyltransferase_step
      connection_type: PROVIDES_INPUT_FOR
      description: 4'-phosphopantetheine is adenylylated to dephospho-CoA.
    - source: phosphopantetheine_adenylyltransferase_step
      target: dephospho_coa_kinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: Dephospho-CoA is phosphorylated to coenzyme A.
  notes: >-
    The module models eight reaction activities in either complete route and
    keeps molecular functions on leaf annotons. It intentionally has no
    module-level cellular location: bacterial and archaeal enzymes are
    commonly cytosolic, whereas eukaryotic isoforms and fused CoA synthases can
    occupy different compartments. Family selectors identify established
    catalytic implementations, while the required molecular function remains
    the decisive criterion. Related reductase families should not satisfy the
    pantoate step without substrate-specific evidence. Taxon-specific
    precursor sources, paralogs, and pathway-map spillover belong in
    pathway-instance reviews rather than this module. ALIGN with
    YeastPathways (2026-10): the ten PANTOSYN2-PWY reactions map onto the
    module, and the two-reaction PWY-5760-1 frame is folded in as the
    polyamine-derived beta-alanine supply variant (FMS1 then ALD2/ALD3); a
    PanD variant was added alongside it so the optional supply part is
    cross-taxon. The YeastCyc catalyst lists are correct, but YeastCyc lists
    CAB3, SIS2 and VHS3 as alternative PPCDC enzymes; the decarboxylase step
    was re-modeled with an architecture variant set so the budding-yeast
    Cab3-Sis2/Vhs3 heterotrimer (PMID:19915539) is distinct from
    homo-oligomeric PPCDCs, including the S. pombe Hal3-thymidylate synthase
    fusion protein (PMID:23962284). A standalone fungal PPAT (Cab4-type)
    variant was added because yeasts encode the PPAT and dephospho-CoA kinase
    as separate proteins rather than as fused CoA synthase. Compartments:
    both GO-CAMs place the late CoA steps in the cytosol; the PomBase model
    puts ecm31 and pan5 in mitochondria, and the S. cerevisiae ECM31 gene
    review likewise places Ecm31 in mitochondria, whereas YeastPathways places
    it in the cytosol; Cab1 is a separate cytoplasmic, rate-limiting kinase
    outside the CoA-synthesizing protein complex (GO:1990143, Cab2, Cab3,
    Cab4, Cab5 with Sis2/Vhs3), and Cab5 sits on the cytosolic face of the
    mitochondrial outer membrane. Because fungal and bacterial compartments
    differ, these locations are recorded here rather than as module-level
    context. GO-CAM disagreements:
    YeastPathways types FMS1 as N(1)-acetylpolyamine oxidase (GO:0052903)
    instead of spermine oxidase (GO:0052901) and ALD2/ALD3 as generic
    GO:0004029 instead of GO:0102244; PomBase 678073a900002636 assigns
    dephospho-CoA kinase activity to cab4, a PPAT-only protein, and includes
    acetyl-CoA synthesis and mitochondrial CoA transport, which are outside
    the module. PAN5 deletion is tolerated in S. cerevisiae (PMID:19266201),
    so a second ketopantoate reductase may exist in yeast.
