id: MODULE:retromer_endosome_to_tgn_retrieval
title: Retromer (VPS35/VPS26A/VPS29) and SORL1 endosome-to-TGN retrograde sorting — clathrin/AP-2/DNM2 internalization, V-ATPase acidification, retromer cargo selection, and RAB9A/AP-1 TGN delivery vs. ESCRT/RAB7A/CTSD lysosomal proteolysis
description: >-
  Transmembrane sorting receptors — including the neuronal sortilin-related receptor SORL1
  (SorLA/LR11, which binds amyloid precursor protein APP), cation-independent mannose 6-phosphate
  receptors (IGF2R/CI-MPR), and Wntless (WLS) — continuously cycle between the trans-Golgi network
  (TGN), plasma membrane, and endosomes. Cell-surface SORL1-cargo complexes are internalized via
  clathrin-coated pits (AP2M1, CLTC) and dynamin-2 (DNM2) vesicle scission into early sorting
  endosomes acidified by V-ATPase (ATP6V1A). On early and maturing sorting endosome membranes, the
  heterotrimeric retromer cargo-selective complex (CSC), composed of VPS35, VPS26A, and VPS29,
  recognizes the cytoplasmic FANSHY sorting motif of SORL1 (and aromatic/hydrophobic motifs on
  CI-MPR and WLS) to partition receptor-cargo complexes into tubular retrograde carriers, actively
  protecting them from ESCRT-I (TSG101) multivesicular body incorporation and RAB7A-driven lysosomal
  degradation. Downstream delivery and receptor sorting at the trans-Golgi network are mediated by
  the TGN/endosomal clathrin adaptor complex AP-1 (AP1B1, AP1G1; PMID:23415225) together with the
  complementary late-endosome-to-TGN small GTPase RAB9A (which recruits the dynein effector NDE1 to
  transport late-endosomal receptors to the TGN; PMID:8164745, PMID:34793709, PMID:15078902). When
  retromer function (VPS35/VPS26A/VPS29) or SORL1 sorting is impaired — a hallmark pathogenic
  mechanism in Alzheimer disease and Parkinson disease — sorting receptors and their cargo fail to
  return to the TGN, remain in maturing endosomes, and are routed via TSG101 and RAB7A into
  lysosomes for proteolytic cleavage (CTSD).
status: DRAFT
evidence:
  - source_id: GO:0038024
    title: cargo receptor activity
    statement: Recognition and sorting of transmembrane and luminal cargo (including APP) by SORL1.
  - source_id: GO:0042147
    title: retrograde transport, endosome to Golgi
    statement: Retromer (VPS35/VPS26A/VPS29)- and RAB9A-dependent retrieval of sorting receptors from endosomes to the trans-Golgi network.
  - source_id: GO:0006898
    title: receptor-mediated endocytosis
    statement: Clathrin-, AP-2-, and DNM2-dependent internalization of cell-surface sorting receptors into early endosomes.
  - source_id: GO:0048388
    title: endosomal lumen acidification
    statement: V-ATPase-driven proton pumping acidifies early and maturing endosomal compartments.
  - source_id: GO:0008333
    title: endosome to lysosome transport
    statement: ESCRT-I (TSG101) and RAB7A route un-retrieved endosomal receptors and cargo to lysosomes for CTSD proteolysis.
  - source_id: PMID:16174740
    title: Neuronal sorting protein-related receptor sorLA/LR11 regulates processing of the amyloid precursor protein.
    statement: >-
      SORL1 (sorLA/LR11) acts as an intracellular sorting receptor that shuttles cargo between
      endosomes and the Golgi/TGN to prevent amyloidogenic endosomal processing.
    supporting_text: >-
      sorLA acts as a sorting receptor that protects APP from processing into Abeta and thereby
      reduces the burden of amyloidogenic peptide formation
  - source_id: PMID:18193037
    title: Wingless secretion requires endosome-to-Golgi retrieval of Wntless/Evi/Sprinter by the retromer complex.
    statement: >-
      The conserved VPS35-containing retromer complex retrieves internalized sorting receptors from
      endosomes back to the Golgi apparatus, preventing their lysosomal degradation.
    supporting_text: >-
      Following dissociation from Wingless, Wntless is internalized and returns to the Golgi
      apparatus in a retromer-dependent manner.
  - source_id: PMID:18193032
    title: Wingless secretion promotes and requires retromer-dependent cycling of Wntless.
    statement: >-
      Loss of the retromer core subunits Vps35 or Vps26 abolishes endosome-to-Golgi retrieval and
      diverts internalized cargo receptors to lysosomal degradation.
    supporting_text: >-
      In the absence of the retromer components Dvps35 or Dvps26, but in presence of Wg, Wls is
      degraded and Wg secretion impaired.
  - source_id: PMID:32286230
    title: Retromer subunit, VPS29, regulates synaptic transmission and is required for endolysosomal function in the aging brain.
    statement: >-
      Retromer subunit VPS29 opposes Rab7-dependent endolysosomal progression, and VPS29 loss-of-function
      phenotypes are suppressed by reducing Rab7.
    supporting_text: >-
      Vps29 phenotypes are suppressed by reducing Rab7 or overexpressing the GTPase activating
      protein, TBC1D5
  - source_id: PMID:15078902
    title: Cargo-selective endosomal sorting for retrieval to the Golgi requires retromer.
    statement: >-
      Mammalian retromer (VPS26/VPS35/VPS29) localizes to early and maturing multivesicular
      endosomes to mediate endosome-to-Golgi retrieval of CI-MPR and sortilin, acting alongside or
      upstream of AP-1 and Rab9-dependent endosome-to-TGN retrieval pathways.
    supporting_text: >-
      In summary, loss of mVPS26 results in a severe defect in endosome-to-TGN retrieval of the
      CI-MPR. mVPS26 could mediate retrieval of the CI-MPR from both early and late endosomes.
  - source_id: Reactome:R-HSA-8871506
    title: SORL1 transports APP(18-770) from endosome lumen to Golgi lumen
    statement: >-
      Human SORL1 forms a complex with the retromer cargo-selective complex on early endosomes to
      retrieve cargo to the trans-Golgi network.
  - source_id: file:human/SORL1/SORL1-ai-review.yaml
    title: SORL1 gene review (human)
    statement: >-
      Sortilin-related receptor mediating endosome-to-TGN retrograde cargo retrieval in partnership
      with the retromer complex (UniProtKB:Q92673, GO:0038024, GO:0042147).
  - source_id: file:human/VPS35/VPS35-ai-review.yaml
