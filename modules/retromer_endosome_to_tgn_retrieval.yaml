                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Catalyzes GTP-dependent scission of clathrin-coated pits to deliver internalized
              SORL1-cargo complexes to early sorting endosomes.
    - order: 3
      role: V-ATPase early sorting endosome acidification
      node:
        id: early_endosome_acidification
        label: V-ATPase early sorting endosome acidification (pH ~6.0 sorting compartment)
        module_type: TRANSPORT_STEP
        annotons:
          - id: atp6v1a_proton_pump
            label: "ATP6V1A: V-ATPase catalytic subunit A"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: V-type proton ATPase catalytic subunit A
                term:
                  id: PANTHER:PTHR43607:SF9
