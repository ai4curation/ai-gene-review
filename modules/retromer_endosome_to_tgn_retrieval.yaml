  connections:
    - source: sorl1_cargo_recognition
      target: clathrin_ap2_internalization
      connection_type: PROVIDES_INPUT_FOR
      description: Cell-surface SORL1-cargo complexes are captured into clathrin/AP-2 coated pits and internalized via DNM2 vesicle scission.
    - source: clathrin_ap2_internalization
      target: early_endosome_acidification
      connection_type: PROVIDES_INPUT_FOR
      description: Internalized coated vesicles uncoat and fuse with V-ATPase-acidified early sorting endosomes.
    - source: early_endosome_acidification
      target: retromer_csc_cargo_selection
      connection_type: PROVIDES_INPUT_FOR
      description: Internalized SORL1-cargo complexes on acidified sorting endosomes are recognized via the cytoplasmic FANSHY motif by the VPS35/VPS26A/VPS29 retromer core.
    - source: early_endosome_acidification
      target: escrt_rab7_degradative_routing
      connection_type: PROVIDES_INPUT_FOR
      description: Sorting-endosome receptors and cargo not captured into retrograde tubules progress into TSG101/RAB7A maturing late endosomes.
    - source: retromer_csc_cargo_selection
      target: escrt_rab7_degradative_routing
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active retromer (VPS35/VPS26A/VPS29) extracts sorting receptors into retrograde tubules and
        recruits TBC1D5 via VPS29 to restrain RAB7A activity, protecting cargo from late-endosomal
        and lysosomal degradation (PMID:18193032, PMID:32286230).
    - source: retromer_csc_cargo_selection
      target: rab9a_ap1_tgn_delivery
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Retromer-sorted cargo receptors on early and maturing endosomes are delivered to the
        trans-Golgi network via AP-1 (AP1B1/AP1G1) adaptor sorting and complementary/sequential
        RAB9A-mediated late-endosome-to-TGN retrograde transport (PMID:15078902, PMID:23415225,
        PMID:34793709).
    - source: escrt_rab7_degradative_routing
      target: ctsd_lysosomal_proteolysis
      connection_type: PROVIDES_INPUT_FOR
      description: Mature RAB7A-positive late endosomes fuse with lysosomes where CTSD degrades un-retrieved sorting receptors and cargo.
  notes: >-
    Constructed for the DELIVEROME and ABM_TRAFFICKING projects to represent retromer
    (VPS35/VPS26A/VPS29) and SORL1-mediated endosome-to-TGN retrograde retrieval versus lysosomal
    degradation as an executable agent-based model (ABM) derived directly from the module graph.
    All protein participants are grounded to completed AIGR gene reviews (human SORL1, VPS35,
    VPS26A, VPS29, RAB9A, AP1B1, AP1G1, AP2M1, CLTC, DNM2, ATP6V1A, TSG101, RAB7A, CTSD; Drosophila
    Vps35, Vps26, Vps29; S. pombe apl2; C. elegans apb-1, dpy-23; and mouse Rab7) and verified
    PANTHER family/subfamily identifiers.
executable_models:
  - id: retromer_retrograde_sorting_abm
    title: Agent-based model of retromer (VPS35/VPS26A/VPS29) and SORL1 endosome-to-TGN retrograde retrieval vs. RAB7A/CTSD lysosomal degradation
    model_type: AGENT_BASED
    derivation: DERIVED_FROM_MODULE
    description: >-
      Simulates 100 discrete SORL1/sorting-receptor cargo agents traversing the seven stages of
      endocytic internalization and retrograde endosome-to-TGN retrieval under uniform uncalibrated
      default transition rates (base_rate = 0.45, competing_inhibitor_factor = 0.25). Under
      wild-type baseline conditions, active retromer recruitment (retromer_csc_cargo_selection)
      attenuates ESCRT/RAB7A degradative progression (escrt_rab7_degradative_routing), retrieving
      80% of internalized receptor-cargo complexes to the trans-Golgi network
      (rab9a_ap1_tgn_delivery) while only 20% undergoes lysosomal proteolysis
      (ctsd_lysosomal_proteolysis). Inactivating the retromer complex (modeling VPS35/VPS26A/VPS29
      deficiency) abolishes TGN retrieval and diverts 100% of internalized receptors into RAB7A/CTSD
      lysosomal degradation — while simultaneous RAB7A inhibition rescues cargo from lysosomal
      proteolysis, reproducing the genetic suppression of retromer loss by Rab7 reduction
      (PMID:32286230).
    notes: >-
      Deterministic particle-conserving agent-based simulation (N=100 cargo particles, T=24 steps)
      derived from the module's directed flow connections (PROVIDES_INPUT_FOR) and competing-pathway
      inhibitory edges (NEGATIVELY_REGULATES) using uniform uncalibrated default kinetics. Note that
      while mammalian retromer (VPS35/VPS26A/VPS29) and RAB9A localize to largely distinct endosomal
      domains and can act as parallel or sequential endosome-to-TGN retrieval pathways (PMID:15078902),
      this coarse-grained 7-stage ABM condenses downstream TGN carrier delivery and receptor sorting
      (AP-1 and complementary RAB9A pathways) into a single terminal TGN delivery sink node
      (rab9a_ap1_tgn_delivery) downstream of retromer_csc_cargo_selection.
    scenarios:
      - id: wt_retromer_tgn_retrieval
        label: Wild-type retromer retrograde sorting (80% TGN retrieval vs. 20% lysosomal proteolysis)
        description: >-
          With intact SORL1 and retromer (VPS35/VPS26A/VPS29) activity, internalized receptor-cargo
          complexes in acidified sorting endosomes are predominantly extracted into retrograde
          carriers and delivered via RAB9A/AP-1 to the trans-Golgi network (80%), while only a minor
          fraction enters the RAB7A/CTSD lysosomal degradative route (20%).
        expected_active:
          - sorl1_cargo_recognition
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - retromer_csc_cargo_selection
          - rab9a_ap1_tgn_delivery
          - escrt_rab7_degradative_routing
          - ctsd_lysosomal_proteolysis
        expected_outcome_order:
          - rab9a_ap1_tgn_delivery
          - ctsd_lysosomal_proteolysis
        evidence:
          - source_id: PMID:18193037
            title: Wingless secretion requires endosome-to-Golgi retrieval of Wntless/Evi/Sprinter by the retromer complex.
            statement: Internalized sorting receptors return from endosomes to the Golgi apparatus in a retromer-dependent manner.
            supporting_text: >-
              Following dissociation from Wingless, Wntless is internalized and returns to the Golgi
              apparatus in a retromer-dependent manner.
      - id: retromer_vps35_loss_degradation
        label: Retromer loss-of-function (VPS35 / VPS26A / VPS29 deficiency; 100% misrouting to lysosomal degradation)
        description: >-
          Inactivating retromer_csc_cargo_selection (modeling loss of VPS35, VPS26A, or VPS29, or
          pathogenic SORL1 FANSHY-motif mutations) abolishes endosome-to-TGN retrieval (0%) and
          lifts TBC1D5/retromer restraint on RAB7A, routing 100% of internalized sorting receptors
          to CTSD lysosomal proteolysis (100%).
        settings:
          - element: retromer_csc_cargo_selection
            active: false
        expected_active:
          - sorl1_cargo_recognition
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - escrt_rab7_degradative_routing
          - ctsd_lysosomal_proteolysis
        expected_inactive:
          - retromer_csc_cargo_selection
          - rab9a_ap1_tgn_delivery
        expected_outcome_order:
          - ctsd_lysosomal_proteolysis
