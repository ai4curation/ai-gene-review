module:
  id: retromer_endosome_to_tgn_retrieval
  label: Retromer (VPS35/VPS26A/VPS29) and SORL1 endosome-to-TGN retrograde retrieval vs. RAB7A/CTSD lysosomal degradation
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: retrograde transport, endosome to Golgi
      term:
        id: GO:0042147
        label: retrograde transport, endosome to Golgi
      description: Retrieval of transmembrane sorting receptors and bound cargo from endosomes back to the trans-Golgi network.
    - preferred_term: cargo adaptor activity
      term:
        id: GO:0140312
        label: cargo adaptor activity
      description: Recognition of cytoplasmic sorting motifs on transmembrane cargo receptors by the VPS35/VPS26A/VPS29 retromer core.
    - preferred_term: receptor-mediated endocytosis
      term:
        id: GO:0006898
        label: receptor-mediated endocytosis
      description: Clathrin-, AP-2-, and DNM2-dependent internalization of cell-surface SORL1 and sorting receptors.
    - preferred_term: endosome to lysosome transport
      term:
        id: GO:0008333
        label: endosome to lysosome transport
      description: ESCRT-I and RAB7A-mediated routing of un-retrieved endosomal cargo to lysosomes for CTSD proteolysis.
  parts:
    - order: 1
      role: SORL1 (SorLA) transmembrane sorting receptor recognition of cargo (such as APP)
      node:
        id: sorl1_cargo_recognition
        label: SORL1 (SorLA) sorting receptor cargo capture at cell surface / early endocytic entry
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: sorl1_receptor_binding
            label: "SORL1 (SorLA/LR11): VPS10p-domain transmembrane sorting receptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Sortilin-related receptor
                term:
                  id: PANTHER:PTHR12106:SF27
                  label: SORTILIN-RELATED RECEPTOR
                representative_members:
                  - preferred_term: SORL1 (human)
                    term:
                      id: UniProtKB:Q92673
                      label: Sortilin-related receptor
            function:
              preferred_term: cargo receptor activity
              term:
                id: GO:0038024
                label: cargo receptor activity
              substrates:
                - preferred_term: amyloid precursor protein (APP) and endocytic sorting cargo
              evidence:
                - source_id: file:human/SORL1/SORL1-ai-review.yaml
                  statement: Binds APP via its luminal complement-type repeat and VPS10p domains and presents its cytoplasmic FANSHY motif to the retromer complex for endosome-to-TGN retrieval.
                - source_id: PMID:16174740
                  title: Neuronal sorting protein-related receptor sorLA/LR11 regulates processing of the amyloid precursor protein.
                  statement: SORL1 acts as an intracellular sorting receptor that binds APP and protects it from amyloidogenic endosomal cleavage.
                  supporting_text: >-
                    sorLA acts as a sorting receptor that protects APP from processing into Abeta and thereby
                    reduces the burden of amyloidogenic peptide formation
                - source_id: Reactome:R-HSA-8871506
                  title: SORL1 transports APP(18-770) from endosome lumen to Golgi lumen
                  statement: SORL1 binds cargo in endosomes and mediates its retrograde transport to the Golgi lumen.
            processes:
              - preferred_term: retrograde transport, endosome to Golgi
                term:
                  id: GO:0042147
                  label: retrograde transport, endosome to Golgi
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: early endosome membrane
                term:
                  id: GO:0031901
                  label: early endosome membrane
              - preferred_term: trans-Golgi network
                term:
                  id: GO:0005802
                  label: trans-Golgi network
            role_description: >-
              Captures transmembrane cargo (such as APP) and undergoes clathrin/AP-2 endocytosis
              followed by retromer-mediated retrograde retrieval to the trans-Golgi network.
    - order: 2
      role: clathrin/AP-2 coated-pit capture and DNM2 vesicle scission of cell-surface sorting receptors
      node:
        id: clathrin_ap2_internalization
        label: Clathrin/AP-2 coated pit assembly and DNM2 vesicle scission
        module_type: TRANSPORT_STEP
        annotons:
          - id: ap2m1_cargo_selection
            label: "AP2M1 (AP-2 mu2): tyrosine/acidic-cluster cargo adaptor"
