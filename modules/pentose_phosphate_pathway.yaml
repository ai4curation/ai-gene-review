        label: pentose-phosphate shunt
      description: >-
        Core central-carbon route producing NADPH and rearranging pentose
        phosphates with glycolytic sugar phosphates.
  gocam_associations:
    - model: gomodel:YeastPathways_PENTOSE-P-PWY
      title: 'pentose phosphate pathway - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with ZWF1, SOL3, SOL4, GND1, GND2, RKI1, RPE1, TKL1,
        TKL2 and TAL1, all cytosolic and part of GO:0006098.
    - model: gomodel:YeastPathways_OXIDATIVEPENT-PWY
      title: 'pentose phosphate pathway (oxidative branch) I - imported from: Saccharomyces Genome Database'
      description: ZWF1, SOL3/SOL4 and GND1/GND2, part of GO:0009051.
    - model: gomodel:YeastPathways_NONOXIPENT-PWY
      title: 'pentose phosphate pathway (non-oxidative branch) - imported from: Saccharomyces Genome Database'
      description: RKI1, RPE1, TKL1/TKL2 and TAL1, part of GO:0009052.
    - model: gomodel:67b1629100000953
      title: 'pentose-phosphate shunt (GO:0006098) '
      description: >-
        PomBase S. pombe model with zwf1 and SPAC3C7.13c (G6PD), pgl1, gnd1,
        rki1, rpe1, tkt1 and tal1, plus the gcd1-idn1 gluconate shunt and
        adjacent rbk1, tnr3 and pgi1 activities.
