id: MODULE:pentose_phosphate_pathway
title: Pentose phosphate pathway
description: >-
  A reusable central-carbon module for the pentose phosphate pathway, covering
  the oxidative conversion of glucose 6-phosphate to ribulose 5-phosphate, the
  non-oxidative interconversion of pentose phosphates with fructose 6-phosphate
  and glyceraldehyde 3-phosphate, and the activation of ribose 5-phosphate to
  5-phospho-alpha-D-ribose 1-diphosphate (PRPP). The oxidative branch generates
  NADPH through glucose-6-phosphate dehydrogenase and 6-phosphogluconate
  dehydrogenase, with 6-phosphogluconolactonase hydrolyzing the intermediate
  lactone; its first step is irreversible and rate-limiting. The reversible
  non-oxidative branch uses ribose-5-phosphate isomerase, ribulose-phosphate
  3-epimerase, transketolase, and transaldolase to balance ribose 5-phosphate,
  xylulose 5-phosphate, sedoheptulose 7-phosphate, erythrose 4-phosphate,
  fructose 6-phosphate, and glyceraldehyde 3-phosphate according to the
  demand for NADPH, nucleotide precursors and glycolytic intermediates. Ribose
  5-phosphate leaves the pathway mainly through ribose-phosphate
  diphosphokinase, whose product PRPP feeds nucleotide, histidine and
  tryptophan biosynthesis. In eukaryotes the pathway is cytosolic. Yeast and
  bacterial proteins are used as concrete exemplars.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:PENTOSE-P-PWY
    title: pentose phosphate pathway (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists the eight PPP reactions with ZWF1, SOL3/SOL4, RKI1, RPE1,
      TKL1/TKL2 and TAL1, but gives no gene for RXN-9952
      (6-phosphogluconate dehydrogenase); GND1 and GND2 were added. TKL2 is
      listed only for 1TRANSKETO-RXN and not 2TRANSKETO-RXN; it was given both
      transketolase reactions (PMID:7916691). The TAL1 paralog NQM1 was added
      as a minor transaldolase (PMID:25887987, PMID:22579386).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PENTOSE-P-PWY
  - source_id: YeastPathways:OXIDATIVEPENT-PWY
    title: pentose phosphate pathway (oxidative branch) I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Lists GLU6PDEHYDROG-RXN (ZWF1), 6PGLUCONOLACT-RXN (SOL3, SOL4) and
      RXN-9952 without a gene; GND1/GND2 added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=OXIDATIVEPENT-PWY
  - source_id: YeastPathways:NONOXIPENT-PWY
    title: pentose phosphate pathway (non-oxidative branch) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Lists RIB5PISOM-RXN (RKI1), RIBULP3EPIM-RXN (RPE1), 1TRANSKETO-RXN
      (TKL1, TKL2), TRANSALDOL-RXN (TAL1) and 2TRANSKETO-RXN (TKL1 only).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=NONOXIPENT-PWY
  - source_id: YeastPathways:PWY0-662
    title: PRPP biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      PRPPSYN-RXN with PRS1-PRS5; all five retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY0-662
  - source_id: GO:0006098
    title: pentose-phosphate shunt
    statement: >-
      GO:0006098 grounds the overall pathway as the pentose-phosphate shunt,
      spanning oxidative and non-oxidative pentose-phosphate chemistry.
  - source_id: GO:0009051
    title: pentose-phosphate shunt, oxidative branch
    statement: >-
      GO:0009051 grounds the oxidative branch from glucose 6-phosphate to
      ribulose 5-phosphate with NADPH production.
  - source_id: GO:0009052
    title: pentose-phosphate shunt, non-oxidative branch
    statement: >-
      GO:0009052 grounds the non-oxidative branch that rearranges pentose
      phosphates with glycolytic sugar phosphates.
  - source_id: GO:0006015
    title: 5-phosphoribose 1-diphosphate biosynthetic process
    statement: GO:0006015 grounds the PRPP-synthesis exit from ribose 5-phosphate.
  - source_id: PMID:2269430
    title: Isolation and characterization of the ZWF1 gene of Saccharomyces cerevisiae, encoding glucose-6-phosphate dehydrogenase.
    statement: >-
      ZWF1 encodes yeast G6PD, which catalyzes the first, NADPH-generating PPP
      step; zwf1 nulls are sensitive to oxidizing agents.
  - source_id: PMID:8879247
    title: Mutants that show increased sensitivity to hydrogen peroxide reveal an important role for the pentose phosphate pathway in protection of yeast against oxidative stress.
    statement: >-
      Peroxide-sensitive mutants identify ZWF1 and the ribulose-5-phosphate
      epimerase gene, linking PPP NADPH supply to oxidative-stress protection.
  - source_id: PMID:15454531
    title: Division of labor among the yeast Sol proteins implicated in tRNA nuclear export and carbohydrate metabolism.
    statement: >-
      Of the four yeast Sol paralogs, Sol3p and Sol4p affect
      6-phosphogluconolactonase activity, whereas Sol1p and Sol2p lack
      detectable 6Pgl activity and function in tRNA export.
  - source_id: PMID:1328471
    title: Induction of specific enzymes of the oxidative pentose phosphate pathway by glucono-delta-lactone in Saccharomyces cerevisiae.
    statement: >-
      The gnd1 mutation causes an approximately 80% loss of
      6-phosphogluconate dehydrogenase activity, identifying GND1 as the major
      isoenzyme; gnd2 affects a minor activity.
  - source_id: PMID:10099784
    title: Purification and kinetic characterization of 6-phosphogluconate dehydrogenase from Schizosaccharomyces pombe.
    statement: >-
      Purified S. pombe 6-phosphogluconate dehydrogenase obligatorily uses
      NADP+ for oxidative decarboxylation of 6-phosphogluconate.
  - source_id: PMID:28667014
    title: The gluconate shunt is an alternative route for directing glucose into the pentose phosphate pathway in fission yeast.
    statement: >-
      In S. pombe, Gcd1 glucose dehydrogenase and Idn1 gluconate kinase form a
      gluconate shunt that supplies 6-phosphogluconate while bypassing
      hexokinase and G6PD.
  - source_id: PMID:8929392
    title: Cloning and characterization of the first two genes of the non-oxidative part of the Saccharomyces cerevisiae pentose-phosphate pathway.
    statement: >-
      RPE1 encodes D-ribulose-5-phosphate 3-epimerase and RKI1 encodes
      D-ribose-5-phosphate ketol-isomerase; rki1 deletion is lethal in haploids.
  - source_id: PMID:1737042
    title: DNA sequence of the yeast transketolase gene.
    statement: Cloning of the major yeast transketolase gene (TKL1).
  - source_id: PMID:7916691
    title: TKL2, a second transketolase gene of Saccharomyces cerevisiae. Cloning, sequence and deletion analysis of the gene.
    statement: >-
      tkl1 tkl2 double mutants are auxotrophic for aromatic amino acids
      (no erythrose 4-phosphate); TKL2 is functionally expressed.
  - source_id: PMID:2185015
    title: Molecular analysis of the structural gene for yeast transaldolase.
    statement: >-
      TAL1 deletion abolishes detectable transaldolase activity in vitro and
      causes sedoheptulose 7-phosphate accumulation.
  - source_id: PMID:25887987
    title: A haploproficient interaction of the transaldolase paralogue NQM1 with the transcription factor VHR1 affects stationary phase survival and oxidative stress resistance.
    statement: >-
      NQM1 is active on transaldolase substrates in vitro but Tal1p is
      sufficient for PPP activity under normal growth conditions.
  - source_id: PMID:22579386
    title: Characterization of non-oxidative transaldolase and transketolase enzymes in the pentose phosphate pathway with regard to xylose utilization by recombinant Saccharomyces cerevisiae.
    statement: >-
      TAL1 and TKL1 are the major transaldolase and transketolase; NQM1 and
      TKL2 are secondary.
  - source_id: PMID:10212224
    title: Genetic analysis and enzyme activity suggest the existence of more than one minimal functional unit capable of synthesizing phosphoribosyl pyrophosphate in Saccharomyces cerevisiae.
    statement: >-
      The five PRS genes encode PRPP synthetase polypeptides that act as
      multimeric complexes; certain combinations of deletions are lethal.
  - source_id: KEGG:ppu00030
    title: Pseudomonas putida KT2440 pentose phosphate pathway
    statement: >-
      The PSEPK KEGG ppu00030 membership bucket contains core PPP genes plus
      ED, gluconate, glycolysis, and nucleotide-biosynthesis spillovers; this
      module records only the core oxidative and non-oxidative PPP steps.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The local membership table supplies the ppu00030 candidate list that was
      partitioned into core PPP steps and adjacent pathway spillovers.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__pentose_phosphate_pathway__ppu00030-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00030 pathway satisfiability review
    statement: >-
      OpenScientist concluded that canonical PPP steps are satisfiable in
      KT2440 and that the main curation issue is the broad KEGG ppu00030
      boundary, which mixes PPP with ED, peripheral glucose/gluconate
      oxidation, PRPP synthesis, and other spillovers.
  - source_id: file:modules/pentose_phosphate_pathway-deep-research-openscientist.md
    title: OpenScientist module-level review for the pentose phosphate pathway
    statement: >-
      OpenScientist describes the PPP as two coupled biochemical modules: an
      irreversible oxidative branch and a reversible non-oxidative branch,
      while treating Entner-Doudoroff routing and downstream NADPH consumers as
      adjacent biology outside the module boundary.
  - source_id: file:genes/PSEPK/zwfA/zwfA-ai-review.yaml
    title: PSEPK zwfA review
    statement: >-
      zwfA is a KT2440 glucose-6-phosphate dehydrogenase paralog and a primary
      exemplar for the oxidative branch first step.
  - source_id: file:genes/PSEPK/zwfB/zwfB-ai-review.yaml
    title: PSEPK zwfB review
    statement: >-
      zwfB is a KT2440 glucose-6-phosphate dehydrogenase paralog and a primary
      exemplar for the oxidative branch first step.
  - source_id: file:genes/PSEPK/zwf/zwf-ai-review.yaml
    title: PSEPK zwf/zwfC review
    statement: >-
      The curated zwf review supports G6PDH chemistry for PP_5351 but treats it
      as a minor or condition-specific paralog relative to zwfA and zwfB.
  - source_id: file:genes/PSEPK/pgl/pgl-ai-review.yaml
    title: PSEPK pgl review
    statement: >-
      pgl is curated as 6-phosphogluconolactonase, the hydrolysis step after
      glucose-6-phosphate dehydrogenase.
  - source_id: file:genes/PSEPK/gntZ/gntZ-ai-review.yaml
    title: PSEPK gntZ review
    statement: >-
      gntZ is the KT2440 6-phosphogluconate dehydrogenase exemplar for the
      oxidative branch decarboxylation step.
  - source_id: file:genes/PSEPK/rpe/rpe-ai-review.yaml
    title: PSEPK rpe review
    statement: >-
      rpe is the KT2440 ribulose-phosphate 3-epimerase exemplar for xylulose
      5-phosphate supply in the non-oxidative branch.
  - source_id: file:genes/PSEPK/rpiA/rpiA-ai-review.yaml
    title: PSEPK rpiA review
    statement: >-
      rpiA is the KT2440 ribose-5-phosphate isomerase exemplar for ribose
      5-phosphate supply in the non-oxidative branch.
  - source_id: file:genes/PSEPK/tktA/tktA-ai-review.yaml
    title: PSEPK tktA review
    statement: >-
      tktA is the KT2440 transketolase exemplar for both two-carbon transfer
      steps in the non-oxidative branch.
  - source_id: file:genes/PSEPK/tal/tal-ai-review.yaml
    title: PSEPK tal review
    statement: >-
      tal is the KT2440 transaldolase exemplar for the three-carbon transfer
      step in the non-oxidative branch.
notes: >-
  ALIGN (YeastPathways project, 2026-10): the module, first built from P.
  putida KT2440, was generalized to the conserved PPP and given S. cerevisiae
  and S. pombe exemplars for every step, plus the PRPP-synthesis exit
  (YeastCyc PWY0-662), which the crosswalk places in scope. All annotons are
  given a cytosolic location (all yeast and human PPP enzymes are cytosolic).
  The human disease-oriented split modules pentose_phosphate_oxidative_branch
  and pentose_phosphate_nonoxidative_branch are left unchanged; note that
  human TKT sits in PANTHER PTHR43195 whereas yeast, S. pombe and bacterial
  transketolases fall in PTHR43522, so the transketolase role here keeps
  PTHR43522. YeastCyc corrections: GND1/GND2 added to RXN-9952 (no gene in
  YeastCyc; PMID:1328471); TKL2 added to 2TRANSKETO-RXN (the tkl1 tkl2 double
  mutant, not tkl1 alone, lacks erythrose 4-phosphate, PMID:7916691); NQM1
  added as a minor transaldolase. SOL1 and SOL2 are deliberately excluded:
  they are Sol-family paralogs without detectable lactonase activity
  (PMID:15454531). S. pombe has a second G6PD-family protein (SPAC3C7.13c)
  that the PomBase GO-CAM also annotates with GO:0004345, and a Gcd1
  glucose dehydrogenase (also PTHR23429) that, with Idn1 gluconate kinase,
  forms a gluconate shunt into 6-phosphogluconate bypassing G6PD
  (PMID:28667014); both are recorded here as adjacent biology rather than
  modelled, and only zwf1 is used as the S. pombe G6PD exemplar. Boundary
  decision for PSEPK ppu00030: glucose/gluconate oxidation, Entner-Doudoroff
  dehydratase and aldolase, lower glycolysis, and phosphoglucomutase remain
  adjacent modules or exits; the 6-phosphogluconate branch point to ED is
  recorded without pulling ED enzymes into the module. The KT2440 G6PDH family
  has paralogs; zwfA and zwfB are the main bacterial exemplars, while
  PP_5351/zwfC is a condition-specific paralog. The five yeast PRS proteins
  act as heteromeric complexes (PMID:10212224); they are modelled as a family
  role rather than as a complex because subunit stoichiometry is unresolved.
  GO-CAM disagreements: the three YeastPathways models agree with the module
  (they already include GND1/GND2 and SOL3/SOL4) except that the
  PENTOSE-P-PWY and NONOXIPENT-PWY models give TKL2 only the first
  transketolase reaction. The PomBase model 67b1629100000953 also contains
  gcd1, idn1, rbk1 ribokinase, tnr3 thiamine diphosphokinase and pgi1, which
  are outside this module, and has no PRPP-synthase activity.
