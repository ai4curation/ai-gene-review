id: MODULE:dmel_gamma_secretase_complex
title: Gamma-secretase complex in Drosophila melanogaster
description: >-
  Gamma-secretase is an intramembrane aspartyl protease that cleaves type I membrane proteins
  within their transmembrane domains after their ectodomains have been shed. Presenilin (Psn)
  is the catalytic subunit and carries the two catalytic aspartates; nicastrin (Nct), Aph-1
  and Pen-2 are required for assembly, maturation and activity. In Drosophila the complex
  performs the S3 cleavage of Notch that releases the Notch intracellular domain, so loss
  of its subunits causes Notch-like phenotypes.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001062
  title: 'FlyBase gene group GSC: Gamma secretase complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as gamma secretase complex (GSC);
    this module models that group.
- source_id: GO:0070765
  title: gamma-secretase complex
  statement: >-
    GO term grounding the module as gamma-secretase complex.
notes: >-
  Presenilin autoproteolysis into N- and C-terminal fragments, promoted by Pen-2, is part
  of complex maturation. Gamma-secretase substrates other than Notch are not modelled. FlyBase
  groups realized by this module: GSC (FBgg0001062). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_gamma_secretase_complex.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
