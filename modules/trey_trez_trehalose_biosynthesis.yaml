id: MODULE:trey_trez_trehalose_biosynthesis
title: TreY/TreZ trehalose biosynthesis from alpha-glucan
description: >-
  A reusable two-reaction bacterial and archaeal pathway that makes trehalose
  from the reducing ends of alpha-1,4-glucans such as glycogen, starch and
  maltooligosaccharides. TreY (maltooligosyl trehalose synthase) rearranges the
  reducing-end alpha-1,4 glucosidic bond into an alpha,alpha-1,1 bond, giving
  maltooligosyltrehalose; TreZ (malto-oligosyltrehalose trehalohydrolase) then
  hydrolyses the adjacent alpha-1,4 bond to release trehalose and an
  alpha-glucan two glucose units shorter. Alpha-glucan synthesis and
  remodeling, the alternative OtsA/OtsB and TreS trehalose routes, and
  trehalose degradation are outside the boundary.
status: COMPLETE
evidence:
  - source_id: GO:0005992
    title: trehalose biosynthetic process
    statement: GO:0005992 provides the biological-process context.
  - source_id: EC:5.4.99.15
    title: maltooligosyl trehalose synthase reaction
    statement: >-
      EC 5.4.99.15 defines the TreY glucosylmutase reaction that forms the
      trehalose-containing alpha-glucan terminus.
  - source_id: EC:3.2.1.141
    title: malto-oligosyltrehalose trehalohydrolase reaction
    statement: >-
      EC 3.2.1.141 defines TreZ hydrolysis that releases trehalose from
      maltooligosyltrehalose.
  - source_id: PMID:8605217
    title: Cloning and sequencing of trehalose biosynthesis genes from Arthrobacter sp. Q36
    statement: >-
      Sequence analysis identified adjacent Arthrobacter sp. Q36 treY and treZ
      open reading frames encoding maltooligosyl trehalose synthase and
      maltooligosyltrehalose trehalohydrolase, respectively.
  - source_id: PMID:8534970
    title: Formation of trehalose from maltooligosaccharides by a novel enzymatic system
    statement: >-
      This historical report introduced the enzymatic system, but the cached
      publication record lacks an informative abstract. Mechanistic support
      therefore comes from PMID:8605217, PMID:8611744, and PMID:8611745.
  - source_id: PMID:8611744
    title: Purification and properties of a novel enzyme, maltooligosyl trehalose synthase, from Arthrobacter sp. Q36.
    statement: >-
      Purified Arthrobacter sp. Q36 TreY converted maltooligosaccharides to
      maltooligosyl trehalose by intramolecular transglycosylation.
  - source_id: PMID:8611745
    title: Purification and characterization of a novel enzyme, maltooligosyl trehalose trehalohydrolase, from Arthrobacter sp. Q36.
    statement: >-
      Purified Arthrobacter sp. Q36 TreZ specifically hydrolyzed the linkage
      between the maltooligosyl and trehalose moieties of its substrate.
  - source_id: PMID:10658666
    title: Three pathways for trehalose biosynthesis in mycobacteria.
    statement: >-
      Extracts and recombinant enzymes from M. tuberculosis ORFs showed that
      mycobacteria make trehalose from glycogen-like alpha-1,4-glucans through
      TreY-TreZ, alongside the OtsA-OtsB and TreS routes, extending the module
      from Arthrobacter to the Actinobacteria more broadly.
    supporting_text: >-
      from glycogen-like alpha(1-->4)-linked glucose polymers (the TreY-TreZ
      pathway)
  - source_id: file:interpro/panther/PTHR10357/PTHR10357-review.yaml
    title: PTHR10357 family review
    statement: >-
      TreY activity is confined to the SF216 clade rooted at PAINT node
      PTN008498486; the rest of the family comprises other GH13 enzymes.
  - source_id: file:interpro/panther/PTHR43651/PTHR43651-review.yaml
    title: PTHR43651 family review
    statement: >-
      TreZ (SF11) forms a sister clade to the branching enzymes and inherits
      none of their PAINT terms; it has no PAINT node of its own.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__trey_trez_trehalose_biosynthesis__ppu00500-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00500 satisfiability review
    statement: >-
      The species-aware review evaluates the TreY/TreZ route in Pseudomonas
      putida KT2440 against the broader starch-and-sucrose map.
  - source_id: file:PSEPK/treY/treY-ai-review.yaml
    title: PSEPK treY gene review
    statement: Q88FN6 is the homology-supported KT2440 TreY step.
  - source_id: file:PSEPK/treZ/treZ-ai-review.yaml
    title: PSEPK treZ gene review
    statement: Q88FN8 is the homology-supported KT2440 TreZ step.
  - source_id: file:MYCTU/treY/treY-ai-review.yaml
    title: MYCTU treY gene review
    statement: P9WQ21 (Rv1563c) is the experimentally supported M. tuberculosis TreY and the PAINT seed.
  - source_id: file:MYCTU/treZ/treZ-ai-review.yaml
    title: MYCTU treZ gene review
    statement: P9WQ23 (Rv1562c) is the experimentally supported M. tuberculosis TreZ.
  - source_id: file:ARTSQ/treY/treY-ai-review.yaml
    title: Arthrobacter sp. Q36 treY gene review
    statement: Q44315 is the founding purified TreY.
  - source_id: file:ARTSQ/treZ/treZ-ai-review.yaml
    title: Arthrobacter sp. Q36 treZ gene review
    statement: Q44316 is the founding purified TreZ.
module:
  id: trey_trez_trehalose_biosynthesis
  label: TreY/TreZ trehalose biosynthesis from alpha-glucan
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: trehalose biosynthetic process
      term:
        id: GO:0005992
        label: trehalose biosynthetic process
      description: Formation of trehalose from an alpha-glucan through maltooligosyltrehalose.
  parts:
    - order: 1
      role: maltooligosyltrehalose formation
      node:
        id: treY_step
        label: Maltooligosyl trehalose synthase
        module_type: REACTION
        annotons:
          - id: treY_activity
            label: Maltooligosyl trehalose synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TreY maltooligosyl trehalose synthases
                term:
                  id: PANTHER:PTHR10357:SF216
                  label: MALTOOLIGOSYL TREHALOSE SYNTHASE-RELATED
                representative_members:
                  - preferred_term: treY (Arthrobacter sp. Q36)
                    term:
                      id: UniProtKB:Q44315
                      label: Maltooligosyl trehalose synthase
                  - preferred_term: treY (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:P9WQ21
                      label: Putative maltooligosyl trehalose synthase
                  - preferred_term: treY (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FN6
                      label: Maltooligosyl trehalose synthase
                ancestral_nodes:
                  - preferred_term: PAINT node PTN008498486 for TreY glucosylmutase activity
                    term:
                      id: PANTHER:PTN008498486
                      label: PTN008498486
                    description: >-
                      Root of the SF216 TreY clade in PTHR10357 (10
                      reference-proteome leaves, all SF216), asserting
                      F:GO:0047470 and P:GO:0005992 by IBD seeded by
                      M. tuberculosis Rv1563c; PAINT date 20170228.
                      TreeGrafter grafts Q44315 and Q88FN6 inside this clade.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN008498486 in PTHR10357.
            function:
              preferred_term: (1,4)-alpha-D-glucan 1-alpha-D-glucosylmutase activity
              term:
                id: GO:0047470
                label: (1,4)-alpha-D-glucan 1-alpha-D-glucosylmutase activity
              substrates:
                - preferred_term: alpha-1,4-glucan with a reducing-end alpha-1,4 linkage
              products:
                - preferred_term: maltooligosyltrehalose
            role_description: >-
              Rearranges the reducing-end glycosidic bond to create the
              trehalose-containing intermediate.
    - order: 2
      role: trehalose release
      node:
        id: treZ_step
        label: Malto-oligosyltrehalose trehalohydrolase
        module_type: REACTION
        annotons:
          - id: treZ_activity
            label: Malto-oligosyltrehalose trehalohydrolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TreZ malto-oligosyltrehalose trehalohydrolases
                term:
                  id: PANTHER:PTHR43651:SF11
                  label: MALTO-OLIGOSYLTREHALOSE TREHALOHYDROLASE
                representative_members:
                  - preferred_term: treZ (Arthrobacter sp. Q36)
                    term:
                      id: UniProtKB:Q44316
                      label: Malto-oligosyltrehalose trehalohydrolase
                  - preferred_term: treZ (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:P9WQ23
                      label: Malto-oligosyltrehalose trehalohydrolase
                  - preferred_term: treZ (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FN8
                      label: Malto-oligosyltrehalose trehalohydrolase
            function:
              preferred_term: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
              term:
                id: GO:0033942
                label: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
              substrates:
                - preferred_term: maltooligosyltrehalose
                - preferred_term: water
              products:
                - preferred_term: trehalose
                - preferred_term: shortened alpha-1,4-glucan
            role_description: >-
              Hydrolyzes the glucosidic linkage adjacent to the trehalose
              moiety and releases free trehalose.
  connections:
    - source: treY_step
      target: treZ_step
      connection_type: PROVIDES_INPUT_FOR
      description: TreY supplies maltooligosyltrehalose to TreZ.
  notes: >-
    The module is species-neutral: TreY/TreZ occurs in Actinobacteria,
    Deinococcus, Proteobacteria and Sulfolobus-type archaea, and the PANTHER
    TreY clade includes all of these lineages. Three exemplar pairs are
    used. Arthrobacter sp. Q36 Q44315/Q44316 are the founding cloned and
    purified enzymes (PMID:8605217, PMID:8611744, PMID:8611745).
    M. tuberculosis Rv1563c/Rv1562c (P9WQ21/P9WQ23) have experimental support
    from recombinant enzymes (PMID:10658666), and P9WQ21 seeds the PAINT TreY
    node. P. putida KT2440 Q88FN6/Q88FN8 are homology-supported, inferred
    from the TreY- and TreZ-specific family models. The TreY (PTHR10357:SF216)
    and TreZ (PTHR43651:SF11) subfamilies are used instead of their parent
    families: PTHR10357 is a heterogeneous GH13 family and PTHR43651 is
    dominated by branching enzymes, as recorded in their family reviews. The
    TreY step carries PAINT node PTN008498486; PTHR43651 has no PAINT node for
    TreZ, so none is asserted for the second step. No module-level molecular
    function or location is asserted.
