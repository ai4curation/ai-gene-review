id: MODULE:efferocytosis_induced_macrophage_priming
title: Efferocytosis-induced macrophage priming
description: >-
  Engulfing an apoptotic cell changes how a macrophage responds to later
  challenges. In Drosophila embryos, each engulfed corpse triggers a brief rise
  in cytosolic calcium in the macrophage, which activates JNK. JNK signalling
  raises expression of the engulfment receptor Draper. Macrophages primed in this
  way migrate to wounds and take up bacteria; naive macrophages that have never
  met a corpse do neither. Beads of the same size are engulfed without causing
  the calcium rise or priming, so the trigger is the corpse itself. Priming is a
  switch rather than a dial: extra JNK or Draper does not make primed
  macrophages respond more strongly.
status: DRAFT
scope: ABSTRACT
references:
  - id: PMID:27212238
    title: Corpse Engulfment Generates a Molecular Memory that Primes the Macrophage Inflammatory Response.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached and read in full. Drosophila embryonic
        macrophages. Bead controls, calcium imaging and buffering, dominant-negative
        JNK and Draper overexpression define the programme.
evidence:
  - source_id: PMID:27212238
    title: Corpse Engulfment Generates a Molecular Memory that Primes the Macrophage Inflammatory Response.
    statement: The authors' model of the programme.
    supporting_text: Apoptotic corpse uptake triggers rapid intracellular calcium bursts in the macrophage, which, in turn, promotes JNK activity and increases Draper expression.
  - source_id: PMID:27212238
    title: Corpse Engulfment Generates a Molecular Memory that Primes the Macrophage Inflammatory Response.
    statement: Engulfing beads does not prime, so the trigger is the corpse, not phagocytosis as such.
    supporting_text: Bead uptake did not, however, rescue the inflammatory wound recruitment defect of naive H99 macrophages
  - source_id: PMID:27212238
    title: Corpse Engulfment Generates a Molecular Memory that Primes the Macrophage Inflammatory Response.
    statement: Priming is permissive; more JNK or Draper does not increase the response of already-primed cells.
    supporting_text: However, neither constitutive activation of JNK signaling nor Draper overexpression within wild-type macrophages affected wound recruitment (data not shown).
notes: >-
  Boundary: this module starts after an apoptotic corpse has been engulfed and
  ends with a macrophage that can respond to wounds and microbes. Engulfment of
  the corpse belongs to MODULE:phagocytic_engulfment, where Draper also acts as
  an engulfment receptor. The outputs (migration to wounds, uptake of bacteria)
  are downstream processes, not parts of this module.

  GO has no term for this programme. The closest are GO:0042116 macrophage
  activation (used as the module concept) and GO:0090714 innate immunity memory
  response, which covers re-exposure to the same stimulus and so does not fit
  here. "efferocytosis-induced macrophage priming" (is_a GO:0042116,
  preceded_by GO:0043277) has been proposed to the GO editors in
  go-ontology#32748.

  Taxon scope: shown only in Drosophila. Draper belongs to the same receptor
  family as C. elegans CED-1, and JNK is conserved across animals, but whether
  corpse engulfment primes phagocytes this way in other animals is not known.
  In mammals, efferocytosis is usually anti-inflammatory (see
  MODULE:efferocytosis_induced_anti_inflammatory_programme).
module:
