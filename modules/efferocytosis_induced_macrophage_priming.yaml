  concepts:
    - preferred_term: macrophage activation
      term:
        id: GO:0042116
        label: macrophage activation
      notes: >-
        Nearest existing term. A specific term, efferocytosis-induced
        macrophage priming, has been proposed to GO (go-ontology#32748).
  context:
