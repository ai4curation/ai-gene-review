id: MODULE:bacterial_rod_complex_peptidoglycan_transpeptidation
title: Bacterial Rod complex peptidoglycan polymerization and crosslinking
description: >-
  A lateral cell-wall synthesis module for the bacterial Rod complex in which
  the SEDS glycosyltransferase RodA polymerizes lipid II-derived glycan strands
  and the class B penicillin-binding protein MrdA/PBP2 forms 4-3 peptide
  crosslinks. The RodA-MrdA synthase pair is the elongasome counterpart of the
  septal FtsW-FtsI pair and supports rod-shape maintenance. Precursor lipid II
  synthesis, MreB-guided spatial control, class A PBP backup polymerases, and
  turnover/remodeling reactions are outside this focused module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009252
    title: peptidoglycan biosynthetic process
    statement: Defines peptidoglycan synthesis from lipid II.
  - source_id: GO:0008360
    title: regulation of cell shape
    statement: Defines the rod-shape outcome supported by the Rod complex.
  - source_id: file:genes/ECOLI/mrdA/mrdA-ai-review.yaml
    title: ECOLI mrdA gene review
    statement: >-
      The completed E. coli mrdA review grounds MrdA as the PBP2
      D,D-transpeptidase of the lateral-wall Rod complex.
  - source_id: file:genes/ECOLI/mrdB/mrdB-ai-review.yaml
    title: ECOLI mrdB gene review
    statement: >-
      The completed E. coli mrdB review grounds RodA/MrdB as the SEDS-family
      lateral-wall peptidoglycan glycosyltransferase.
  - source_id: PMID:3009484
    title: >-
      Peptidoglycan synthetic activities in membranes of Escherichia coli
      caused by overproduction of penicillin-binding protein 2 and rodA protein.
    statement: Supports the paired requirement for RodA and MrdA/PBP2 in peptidoglycan synthesis.
  - source_id: PMID:27525505
    title: SEDS proteins are a widespread family of bacterial cell wall polymerases.
    statement: Establishes the SEDS protein family as peptidoglycan glycosyltransferases.
  - source_id: PMID:37620344
    title: Structural basis of peptidoglycan synthesis by E. coli RodA-PBP2 complex.
    statement: Establishes the E. coli RodA-PBP2 complex architecture.
notes: >-
  The completed mrdB and mrdA ECOLI reviews cover the lateral-wall SEDS/bPBP
  synthase pair. This module is intentionally separate from the FtsW/FtsI
  septal synthase module because the two SEDS/bPBP pairs have distinct
  cellular roles and are regulated by different morphogenetic systems.
