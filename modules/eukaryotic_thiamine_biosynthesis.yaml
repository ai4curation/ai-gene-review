id: MODULE:eukaryotic_thiamine_biosynthesis
title: Eukaryotic (THI4/THI5-type) de novo thiamine diphosphate biosynthesis
description: >-
  De novo synthesis of thiamine diphosphate (ThDP), the active vitamin B1
  cofactor, by the route used in fungi. The thiazole and pyrimidine halves of
  thiamine are made separately and then joined. Both halves are made by
  single-turnover ("suicide") enzymes that donate part of their own structure
  to the product. The thiazole synthase THI4 builds an adenylated thiazole
  (ADP-5-ethyl-4-methylthiazole-2-carboxylate, ADT) from NAD+ and glycine, using
  the sulfur of one of its own active-site cysteines, which is left as a
  dehydroalanine; THI4 orthologues do the same in plants. The pyrimidine
  synthase THI5 (NMT1 in fission yeast) makes
  4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate (HMP-P) from pyridoxal
  5'-phosphate and the side chain of one of its own histidine residues, in an
  iron-dependent reaction. ADT is converted to the thiazole phosphate by steps
  whose enzymes are still unknown, and HMP-P is phosphorylated to the
  diphosphate (HMP-PP) by HMP-P kinases of the ThiD family, which are fused to a
  TenA-like domain in budding yeast. The bifunctional THI6 protein joins the
  thiazole phosphate and HMP-PP to thiamine monophosphate; its second domain is
  a hydroxyethylthiazole kinase that can bring free thiazole into the pathway.
  Thiamine monophosphate is dephosphorylated to thiamine by a phosphatase that
  has not been identified, and thiamine pyrophosphokinase converts thiamine to
  ThDP. The enzymes are cytosolic. This route differs from the bacterial
  ThiC/ThiG pathway, and plants combine a THI4-type thiazole synthase with a
  bacterial-type ThiC pyrimidine synthase.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-17
    title: thiamine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway. The pathway frame lists THI4, THI13, THI20, THI21, THI6
      and THI80. Changes made here: the other three THI5-family paralogues
      (THI5, THI11, THI12) are added because the four are redundant HMP-P
      synthases; the THI5-family product is HMP-P rather than free HMP, so the
      HMP kinase reaction (OHMETPYRKIN-RXN) is treated as a salvage entry and
      not a required de novo step; the conversion of ADT to thiazole phosphate
      (RXNQT-4301), which YeastCyc assigns to THI4, is left without a gene
      because THI4 makes ADT and the next enzyme is unknown; and THI6 is given
      its second, hydroxyethylthiazole kinase, activity. The thiamine phosphate
      phosphatase reaction (RXNQT-4191) has no gene in YeastCyc and none is
      added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-17
  - source_id: GO:0009228
    title: thiamine biosynthetic process
    statement: Module-level process for de novo formation of thiamine.
  - source_id: GO:0009229
    title: thiamine diphosphate biosynthetic process
    statement: Module-level process for formation of the active cofactor ThDP.
  - source_id: PMID:22031445
    title: Saccharomyces cerevisiae THI4p is a suicide thiamine thiazole synthase.
    statement: >-
      THI4 is a single-turnover thiazole synthase whose Cys205 supplies the
      thiazole sulfur.
    supporting_text: >-
      the demonstration that THI4p is a
      suicide enzyme undergoing only a single turnover
  - source_id: PMID:17309261
    title: 'Biosynthesis of thiamin thiazole in eukaryotes: conversion of NAD to an advanced intermediate.'
    statement: NAD is the substrate of THI4, which makes ADP-thiazole (ADT).
  - source_id: PMID:22568620
    title: 'Thiamin pyrimidine biosynthesis in Candida albicans : a remarkable reaction between histidine and pyridoxal phosphate.'
    statement: >-
      THI5 makes HMP-P from PLP and its own His66 in a single turnover.
    supporting_text: >-
      Our data suggest that His66 of the THI5 protein is the
      histidine source for pyrimidine formation and that the pyrimidine synthase is a
      single-turnover enzyme.
  - source_id: PMID:23048037
    title: 'The last piece in the vitamin B1 biosynthesis puzzle: structural and functional insight into yeast 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate (HMP-P) synthase.'
    statement: >-
      Structure of yeast THI5; PLP is a substrate rather than a cofactor, and
      iron binding is essential for the reaction.
  - source_id: PMID:12777485
    title: 'The THI5 gene family of Saccharomyces cerevisiae: distribution of homologues among the hemiascomycetes and functional redundancy in the aerobic biosynthesis of thiamin from pyridoxine.'
    statement: >-
      THI5, THI11, THI12 and THI13 are functionally redundant for HMP formation
      from the vitamin B6 pathway; a THI5 gene family exists only in
      Saccharomyces sensu stricto yeasts.
  - source_id: PMID:2643995
    title: Incorporation of histidine into the pyrimidine moiety of thiamin in Saccharomyces cerevisiae.
    statement: Labelling shows that three atoms of the thiamine pyrimidine come from histidine.
  - source_id: PMID:14570482
    title: Biosynthesis of vitamin B1 in yeast. Derivation of the pyrimidine unit from pyridoxine and histidine. Intermediacy of urocanic acid.
    statement: >-
      Labelling shows the yeast thiamine pyrimidine is built from a pyridoxine
      C5N fragment and a histidine N-C-N fragment. The proposed urocanate
      intermediate was later questioned; the protein-derived histidine model of
      PMID:22568620 is used here.
  - source_id: PMID:10383756
    title: "Genetic redundancy and gene fusion in the genome of the Baker's yeast Saccharomyces cerevisiae: functional characterization of a three-member gene family involved in the thiamine biosynthetic pathway."
    statement: >-
      Two of the three THI20 family members are isofunctional HMP-P kinases;
      the proteins are fusions of a kinase domain and a C-terminal domain.
    supporting_text: >-
      We demonstrate that two members are isofunctional and encode a
      hydroxymethylpyrimidine phosphate (HMP-P) kinase (EC 2.7.4.7), an activity
      required for the final steps of thiamine biosynthesis
  - source_id: PMID:7982968
    title: Isolation and characterization of the THI6 gene encoding a bifunctional thiamin-phosphate pyrophosphorylase/hydroxyethylthiazole kinase from Saccharomyces cerevisiae.
    statement: THI6 is a bifunctional thiamine-phosphate synthase and hydroxyethylthiazole kinase.
  - source_id: PMID:8394314
    title: 'Copurification of hydroxyethylthiazole kinase and thiamine-phosphate pyrophosphorylase of Saccharomyces cerevisiae: characterization of hydroxyethylthiazole kinase as a bifunctional enzyme in the thiamine biosynthetic pathway.'
    statement: The two THI6 activities copurify as one protein.
  - source_id: PMID:20968298
    title: Domain organization in Candida glabrata THI6, a bifunctional enzyme required for thiamin biosynthesis in eukaryotes.
    statement: >-
      ADT, the THI4 product, is not a substrate for THI6, so another enzyme
      converts ADT to the thiazole phosphate.
    supporting_text: >-
      we have demonstrated that ADT, the product of the S. cerevisiae thiazole synthase, is not a substrate for THI6
  - source_id: PMID:23834287
    title: A cross-kingdom Nudix enzyme that pre-empts damage in thiamin metabolism.
    statement: >-
      The genes for the thiamine monophosphate phosphatase and ADT
      diphosphatase steps in fungi and plants are unknown; the Nudix domain of
      S. pombe Tnr3 and its homologues do not hydrolyse thiamine monophosphate.
    supporting_text: >-
      Genes specifying the thiamin monophosphate phosphatase and adenylated thiazole
      diphosphatase steps in fungal and plant thiamin biosynthesis remain unknown
  - source_id: PMID:8394343
    title: Isolation and characterization of a thiamin pyrophosphokinase gene, THI80, from Saccharomyces cerevisiae.
    statement: THI80 encodes thiamine pyrophosphokinase and is essential.
  - source_id: PMID:12271461
    title: Functional analysis of yeast gene families involved in metabolism of vitamins B1 and B6.
    statement: >-
      The SNZ2/SNZ3 and SNO2/SNO3 PLP synthase copies are induced by thiamine
      limitation, and Snz proteins interact with the Thi5 family.
  - source_id: PMID:18161008
    title: The genes and enzymes involved in the biosynthesis of thiamin and thiamin diphosphate in yeasts.
    statement: Review of yeast thiamine biosynthesis genes and enzymes, cited by YeastPathways.
notes: >-
  Boundary: the module runs from the two suicide synthases to ThDP. Thiamine
  uptake (THI7, THI72, NRT1; S. pombe thi9), mitochondrial ThDP import (TPC1; S.
  pombe SPBC1604.04, included in the PomBase model), the periplasmic thiamine
  phosphatase PHO3, and the THI regulon regulators are outside the module. The
  regulators are the transcription factors THI2 and PDC2 and the ThDP-sensing
  coactivator THI3 in S. cerevisiae (THI3 binds ThDP and is not an enzyme of the
  pathway), and thi1 and thi5 in S. pombe, which appear in the PomBase model as
  positive regulators of nmt1. The human uptake and activation pathway is in
  modules/thiamine_uptake_and_activation.yaml, and the bacterial ThiC/ThiG
  pathway is in modules/thiamine_diphosphate_biosynthesis.yaml. PLP for THI5 is
  consumed as a substrate, so this pathway depends on vitamin B6 supply
  (modules/vitamin_b6_plp_metabolism.yaml); in S. cerevisiae the thiamine-
  induced SNZ2/SNZ3-SNO2/SNO3 PLP synthase copies are linked to this demand
  (PMID:12271461). THI22, the third THI20-family paralogue, has no demonstrated
  HMP-P kinase activity and is dispensable for thiamine synthesis (see
  genes/yeast/THI22), so it is not used as an exemplar of the kinase step. The
  THI20 C-terminal TenA-like domain (thiaminase II) belongs to thiamine salvage
  and degradation, not to this module. Plants share the THI4 step
  (Arabidopsis THI1 is included as a representative) but make the pyrimidine
  with a bacterial-type ThiC and use a TH1 HMP-P kinase/TMP synthase fusion, so
  the plant pathway is not modelled as a full variant here. GO-CAM notes: the
  SGD model (no causal edges) lists THI13 as the only THI5-family enzyme,
  types THI20 and THI21 with both kinase activities, and lacks THI6
  hydroxyethylthiazole kinase, the ADT conversion, and the thiamine phosphate
  phosphatase. The PomBase model includes the THI6 kinase activity and an
  unassigned thiamine phosphate phosphatase.
module:
  id: eukaryotic_thiamine_biosynthesis
  label: Eukaryotic de novo thiamine diphosphate biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: thiamine biosynthetic process
      term:
        id: GO:0009228
        label: thiamine biosynthetic process
      description: De novo formation of thiamine from separately made thiazole and pyrimidine halves.
    - preferred_term: thiamine diphosphate biosynthetic process
      term:
        id: GO:0009229
        label: thiamine diphosphate biosynthetic process
      description: Pyrophosphorylation of thiamine to the active cofactor ThDP.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: The fungal enzymes of the pathway are cytosolic.
    taxa:
      - preferred_term: fungi
        term:
          id: NCBITaxon:4751
          label: Fungi
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-17
      title: 'thiamine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae: THI4, THI13, THI20,
        THI21, THI6 and THI80, all in cytosol, no causal edges.
    - model: gomodel:66c7d41500000963
      title: thiamine-containing compound metabolic process (GO:0042723)
      description: >-
        PomBase S. pombe model with thi2 (THI4), nmt1 (THI5), three HMP/HMP-P
        kinases (thi20, thi201, SPCC18B5.05c), thi4 (THI6, both activities),
        an unassigned thiamine phosphate phosphatase and tnr3 (TPK), plus the
        regulators thi1 and thi5 and the mitochondrial ThDP carrier
        SPBC1604.04, which lie outside this module.
  parts:
    - order: 1
      role: thiazole branch
      node:
        id: thiazole_branch
        label: Thiazole phosphate formation
        module_type: METABOLIC_PATHWAY
        description: >-
          THI4 makes ADP-thiazole from NAD+, glycine and its own cysteine
          sulfur; ADP-thiazole is then converted to the thiazole phosphate used
          by thiamine-phosphate synthase.
        parts:
          - order: 1
            role: suicide thiazole synthase
            node:
              id: thi4_thiazole_synthase_step
              label: NAD+ and glycine to ADP-thiazole (THI4)
              module_type: REACTION
              annotons:
                - id: thi4_thiazole_synthase_activity
                  label: "THI4: cysteine-dependent ADP-thiazole synthase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: THI4/THI1 thiamine thiazole synthase family
                      term:
                        id: PANTHER:PTHR43422
                        label: THIAMINE THIAZOLE SYNTHASE
                      representative_members:
                        - preferred_term: THI4 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P32318
                            label: Thiamine thiazole synthase
                          description: S. cerevisiae THI4/YGR144W (PMID:22031445).
                        - preferred_term: thi2/nmt2 (Schizosaccharomyces pombe)
                          term:
                            id: UniProtKB:P40998
                            label: Thiamine thiazole synthase
                          description: S. pombe thi2/SPBC26H8.01.
                        - preferred_term: THI1 (Arabidopsis thaliana)
                          term:
                            id: UniProtKB:Q38814
                            label: Thiamine thiazole synthase, chloroplastic
                          description: Plant THI4 orthologue (chloroplastic).
                  function:
                    preferred_term: cysteine-dependent adenosine diphosphate thiazole synthase activity
                    term:
                      id: GO:0160205
                      label: cysteine-dependent adenosine diphosphate thiazole synthase activity
                    substrates:
                      - preferred_term: NAD+
                      - preferred_term: glycine
                      - preferred_term: active-site L-cysteine of the enzyme (sulfur donor)
                    products:
                      - preferred_term: ADP-5-ethyl-4-methylthiazole-2-carboxylate (ADT)
                      - preferred_term: nicotinamide
                      - preferred_term: enzyme dehydroalanine residue
                    cofactors:
                      - preferred_term: iron
                    evidence:
                      - source_id: EC:2.4.2.60
                        statement: Cysteine-dependent adenosine diphosphate thiazole synthase.
                      - source_id: PMID:22031445
                        statement: >-
                          Iron-dependent sulfide transfer from Cys205; single
                          turnover.
                  gocam_associations:
                    - model: gomodel:YeastPathways_PWY3O-17
                      activity: gomodel:RXN3O-401
                      title: 'thiamine biosynthesis - imported from: Saccharomyces Genome Database'
                      description: THI4 enables GO:0160205 in cytosol.
                    - model: gomodel:66c7d41500000963
                      activity: gomodel:66c7d41500000963/66c7d41500001022
                      title: thiamine-containing compound metabolic process (GO:0042723)
                      description: S. pombe thi2 enables GO:0160205 in cytosol.
                  role_description: >-
                    Builds the thiazole ring in a single turnover, giving up the
                    sulfur of its own Cys205.
          - order: 2
            role: ADP-thiazole processing
            node:
              id: adt_processing_step
              label: ADP-thiazole to thiazole phosphate
              module_type: REACTION
              description: >-
                ADT must lose its AMP moiety (giving carboxythiazole phosphate)
                and its carboxyl group to give
                4-methyl-5-(2-phosphooxyethyl)thiazole, the THI6 substrate.
                THI6 does not accept ADT, and no enzyme for these steps has
                been identified in fungi or plants.
              annotons:
                - id: adt_processing_activity
                  label: ADP-thiazole diphosphatase / decarboxylation (enzyme unknown)
                  participant:
                    selector_type: ANY_WITH_FUNCTION
                    required_function:
                      preferred_term: ADP-thiazole diphosphatase activity
                    description: >-
                      Unidentified; a Nudix-type hydrolase has been proposed
                      (PMID:20968298). YeastCyc assigns this conversion
                      (RXNQT-4301) to THI4, but THI4 makes ADT and is
                      inactivated after one turnover.
                  function:
                    preferred_term: ADP-thiazole diphosphatase activity
                    description: >-
                      Hydrolysis of ADT to AMP and carboxythiazole phosphate,
                      followed by decarboxylation to the thiazole phosphate.
                      No GO term exists for this activity.
                    substrates:
                      - preferred_term: ADP-5-ethyl-4-methylthiazole-2-carboxylate (ADT)
                      - preferred_term: water
                    products:
                      - preferred_term: 4-methyl-5-(2-phosphooxyethyl)thiazole
                      - preferred_term: AMP
                      - preferred_term: CO2
                    evidence:
                      - source_id: PMID:20968298
                        statement: ADT is not a substrate for THI6, so another enzyme is required.
                      - source_id: PMID:23834287
                        statement: The adenylated thiazole diphosphatase gene is unknown in fungi and plants.
                  role_description: >-
                    Converts the THI4 product to the thiazole phosphate used by
                    thiamine-phosphate synthase.
              knowledge_gaps:
                - gap_statement: >-
                    The enzyme or enzymes that convert ADP-thiazole to the
                    thiazole phosphate in fungi and plants are unknown, and it
                    is not known whether decarboxylation is enzymatic.
                  boundary: >-
                    THI4 makes ADT, and THI6 uses the thiazole phosphate but not
                    ADT (PMID:20968298). The Nudix domain of S. pombe Tnr3 and
                    its S. cerevisiae homologue act on thiamine diphosphate and
                    damaged thiamine diphosphates, not in this step
                    (PMID:23834287).
                  gap_kind:
                    - BIOLOGY
                  status: OPEN
                  significance: >-
                    This is one of the two remaining unassigned steps of
                    eukaryotic thiamine synthesis.
                  resolution: >-
                    Assay yeast extracts and candidate Nudix and other
                    hydrolases for ADT hydrolysis, and screen deletion mutants
                    for thiamine auxotrophy that is rescued by
                    hydroxyethylthiazole but not by HMP.
          - order: 3
            role: thiazole salvage phosphorylation
            optional: true
            node:
              id: het_kinase_step
              label: Hydroxyethylthiazole to thiazole phosphate (THI6 kinase domain)
              module_type: REACTION
              description: >-
                The C-terminal domain of THI6 phosphorylates free
                4-methyl-5-(2-hydroxyethyl)thiazole, so that thiazole taken up
                from outside or released by thiamine breakdown can enter the
                pathway. Whether it is also needed on the de novo route depends
                on how ADT is processed, which is unknown.
              annotons:
                - id: thi6_het_kinase_activity
                  label: "THI6 C-terminal domain: hydroxyethylthiazole kinase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: fungal THI6 bifunctional enzyme subfamily
