id: MODULE:electron_transfer_flavoprotein_system
title: Electron-transfer flavoprotein system
description: >-
  Reusable module for the two-stage electron-transfer flavoprotein (ETF) relay.
  A soluble alpha/beta ETF heterodimer accepts reducing equivalents from partner
  flavin-dependent dehydrogenases. ETF:quinone oxidoreductase then reoxidizes ETF
  and reduces a membrane quinone, linking diverse substrate oxidations to an
  electron-transport chain. Bacterial ETF systems act in the cytoplasm and
  plasma membrane; the homologous eukaryotic system acts in the mitochondrial
  matrix and inner membrane.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0045251
    title: electron transfer flavoprotein complex
    statement: >-
      GO:0045251 grounds the soluble alpha/beta ETF heterodimer.
  - source_id: GO:0004174
    title: electron-transferring-flavoprotein dehydrogenase activity
    statement: >-
      GO:0004174 grounds reoxidation of reduced ETF coupled to quinone
      reduction by ETF:quinone oxidoreductase.
  - source_id: EC:1.5.5.1
    title: electron-transferring-flavoprotein dehydrogenase
    statement: >-
      EC 1.5.5.1 identifies the membrane-associated ETF:quinone oxidoreductase.
  - source_id: Reactome:R-HSA-169270
    title: "ETFDH oxidises ETF (reduced) to ETF, reduces CoQ to CoQH2"
    statement: >-
      In the mitochondrial realization the relay follows the human Reactome
      reactions R-HSA-169260 (acyl-CoA dehydrogenases reduce ETF) and
      R-HSA-169270 (ETFDH reoxidises ETF and reduces ubiquinone), feeding
      respiratory electron transport (R-HSA-611105).
  - source_id: file:human/ETFA/ETFA-ai-review.yaml
    title: ETFA gene review (human)
    statement: >-
      The ETF alpha-subunit grounding (UniProtKB:P13804, GO:0009055 electron
      transfer activity, FAD binding, GO:0045251 complex) matches the completed
      human ETFA review.
  - source_id: file:human/ETFB/ETFB-ai-review.yaml
    title: ETFB gene review (human)
    statement: >-
      The ETF beta-subunit grounding (UniProtKB:P38117, GO:0009055, GO:0045251
      complex) matches the completed human ETFB review, which accepts enables
      GO:0009055 on the beta subunit as its core molecular function.
  - source_id: file:human/ETFDH/ETFDH-ai-review.yaml
    title: ETFDH gene review (human)
    statement: >-
      The ETF-ubiquinone oxidoreductase grounding (UniProtKB:Q16134, GO:0004174
      electron-transferring-flavoprotein dehydrogenase activity, inner membrane)
      matches the completed human ETFDH review.
  - source_id: file:PSEPK/PP_4203/PP_4203-ai-review.yaml
    title: PP_4203 gene review (PSEPK)
    statement: >-
      The bacterial ETF:quinone oxidoreductase grounding (UniProtKB:Q88F95,
      GO:0004174, GO:0050660 FAD binding, GO:0051539 [4Fe-4S] binding,
      GO:0005886 plasma membrane) matches the completed PSEPK PP_4203 review.
notes: >-
  Pseudomonas putida KT2440 contains an etfA-etfB-ETF:quinone oxidoreductase
  locus (PP_4201-PP_4203) and a second adjacent ETF alpha/beta pair
  (PP_0312-PP_0313). Both pairs are valid family exemplars; their exact partner
  dehydrogenase preferences should be established experimentally rather than
  inferred from family membership alone.
module:
  id: electron_transfer_flavoprotein_system
  label: Electron-transfer flavoprotein electron relay
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ETF-dependent electron relay to a membrane quinone pool
      term:
        id: GO:0022900
        label: electron transport chain
      description: >-
        The module as a whole is a process: a series of electron carriers (the
        soluble ETF heterodimer, then ETF:quinone oxidoreductase) operating
        together to move electrons from flavoprotein dehydrogenases to a membrane
        quinone. GO:0022900 rather than its child GO:0022904 respiratory electron
        transport chain, because the module is written to cover bacterial as well
        as mitochondrial realizations and does not assume a respiratory terminal
        acceptor.
  parts:
    - order: 1
      role: acceptance of electrons from partner flavoprotein dehydrogenases
      node:
        id: soluble_etf_heterodimer
        label: Soluble alpha/beta electron-transfer flavoprotein
        module_type: PROTEIN_COMPLEX
        description: >-
          The alpha and beta subunits form the mobile ETF heterodimer. The
          complex accepts electrons from compatible flavin-dependent
          dehydrogenases through its redox-active flavin cofactor.
        concepts:
          - preferred_term: electron transfer flavoprotein complex
            term:
              id: GO:0045251
              label: electron transfer flavoprotein complex
            description: >-
              GO:0045251 is the cellular-component grounding for the assembled
              alpha/beta heterodimer, and belongs on this PROTEIN_COMPLEX node
              rather than on the pathway-level module root.
        annotons:
          - id: etf_alpha_subunit
            label: ETF alpha subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: electron-transfer flavoprotein alpha-subunit family
                term:
                  id: PANTHER:PTHR43153
                  label: ELECTRON TRANSFER FLAVOPROTEIN ALPHA
                representative_members:
                  - preferred_term: PSEPK EtfA exemplar
                    term:
                      id: UniProtKB:Q88F97
                      label: Electron transfer flavoprotein subunit alpha
                    description: Pseudomonas putida KT2440 etfA/PP_4201.
                  - preferred_term: PSEPK PP_0312 exemplar
                    term:
                      id: UniProtKB:Q88R22
                      label: Electron transfer flavoprotein alpha subunit
                    description: >-
                      Pseudomonas putida KT2440 second ETF alpha-family protein,
                      encoded adjacent to PP_0313.
                  - preferred_term: human ETFA exemplar
                    term:
                      id: UniProtKB:P13804
                      label: Electron transfer flavoprotein subunit alpha, mitochondrial
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
            role_description: >-
              FAD-bearing redox subunit that receives electrons from compatible
              partner dehydrogenases.
          - id: etf_beta_subunit
            label: ETF beta subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: electron-transfer flavoprotein beta-subunit family
                term:
                  id: PANTHER:PTHR21294
                  label: ELECTRON TRANSFER FLAVOPROTEIN BETA-SUBUNIT
                representative_members:
                  - preferred_term: PSEPK EtfB exemplar
                    term:
                      id: UniProtKB:Q88F96
                      label: Electron transfer flavoprotein subunit beta
                    description: Pseudomonas putida KT2440 etfB/PP_4202.
                  - preferred_term: PSEPK PP_0313 exemplar
                    term:
                      id: UniProtKB:Q88R21
                      label: Electron transfer flavoprotein beta subunit
                    description: >-
                      Pseudomonas putida KT2440 second ETF beta-family protein,
                      encoded adjacent to PP_0312.
                  - preferred_term: human ETFB exemplar
                    term:
                      id: UniProtKB:P38117
                      label: Electron transfer flavoprotein subunit beta
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              substrates:
                - preferred_term: reduced partner flavoprotein dehydrogenase (electron donor)
              products:
                - preferred_term: reduced electron-transfer flavoprotein
            role_description: >-
              Partner-recognition and structural subunit of the ETF
              heterodimer. The beta subunit carries no flavin of its own, but it
              provides the docking surface for the partner dehydrogenases and is
              an obligate component of the carrier, so it is typed with the
              complex's electron transfer activity and the gene reviews record
              the dependency as contributes_to_molecular_function. The beta
              subunit binds AMP as a structural cofactor in both the human and
              the Pseudomonas putida records.
    - order: 2
      role: transfer of electrons from reduced ETF to a membrane quinone
      node:
        id: etf_quinone_oxidoreductase_step
        label: Reduced ETF oxidation coupled to quinone reduction
        module_type: REACTION
        description: >-
          Membrane-associated ETF:quinone oxidoreductase accepts electrons from
          reduced ETF and reduces a quinone pool, regenerating oxidized ETF.
        annotons:
          - id: etf_quinone_oxidoreductase
            label: ETF:quinone oxidoreductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ETF:quinone oxidoreductase family
                term:
                  id: PANTHER:PTHR10617
                  label: ELECTRON TRANSFER FLAVOPROTEIN-UBIQUINONE OXIDOREDUCTASE
                representative_members:
                  - preferred_term: PSEPK PP_4203 exemplar
                    term:
                      id: UniProtKB:Q88F95
                      label: Electron transfer flavoprotein-ubiquinone oxidoreductase
                    description: Pseudomonas putida KT2440 PP_4203.
                  - preferred_term: human ETFDH exemplar
                    term:
                      id: UniProtKB:Q16134
                      label: Electron transfer flavoprotein-ubiquinone oxidoreductase, mitochondrial
            function:
              preferred_term: electron-transferring-flavoprotein dehydrogenase activity
              term:
                id: GO:0004174
                label: electron-transferring-flavoprotein dehydrogenase activity
              substrates:
                - preferred_term: reduced electron-transfer flavoprotein
                - preferred_term: quinone
              products:
                - preferred_term: oxidized electron-transfer flavoprotein
                - preferred_term: quinol
            role_description: >-
              FAD- and iron-sulfur-dependent membrane enzyme that reoxidizes ETF
              and supplies electrons to a respiratory quinone pool.
  connections:
    - source: soluble_etf_heterodimer
      target: etf_quinone_oxidoreductase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Reduced ETF produced in the first part is the electron donor for the
        membrane ETF:quinone oxidoreductase in the second part.
