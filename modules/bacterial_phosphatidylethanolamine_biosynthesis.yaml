id: MODULE:bacterial_phosphatidylethanolamine_biosynthesis
title: Bacterial phosphatidylethanolamine biosynthesis through phosphatidylserine
description: >-
  A reusable two-reaction module for de novo phosphatidylethanolamine
  biosynthesis from CDP-diacylglycerol in bacteria. Phosphatidylserine
  synthase (PssA) transfers the phosphatidyl group of CDP-diacylglycerol to
  L-serine to form phosphatidylserine, and pyruvoyl-dependent
  phosphatidylserine decarboxylase (Psd) converts phosphatidylserine to
  phosphatidylethanolamine and CO2 at the cytoplasmic membrane. The first step
  is carried out by two unrelated enzyme architectures: a type-I,
  peripheral-membrane PssA of the phospholipase D superfamily, typical of
  gamma- and some beta-proteobacteria such as Escherichia coli, and a type-II,
  integral-membrane CDP-alcohol phosphatidyltransferase PssA, typical of
  Gram-positive bacteria such as Bacillus subtilis. Some genomes, such as
  Pseudomonas putida KT2440, encode both. The decarboxylation step is
  performed by a single conserved Psd family whose proenzyme self-cleaves to
  generate the pyruvoyl prosthetic group.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: file:modules/bacterial_phosphatidylethanolamine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist review of bacterial phosphatidylethanolamine biosynthesis
    statement: >-
      The generic module review evaluates the reusable two-reaction boundary,
      alternative PssA architectures, and Psd-dependent terminal reaction. It
      was used for leads only; each claim retained here is grounded in the
      primary literature or curated records cited below.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_phosphatidylethanolamine_biosynthesis__ppu00564-deep-research-openscientist.md
    title: OpenScientist review of the module, ppu00564, and PSEPK
    statement: >-
      The module/pathway/taxon review for the P. putida KT2440 exemplar finds
      both reactions covered, supports distinct Q88GQ4 and Q88DZ1 PssA
      architectures, and identifies paralog dominance rather than pathway
      satisfiability as the open issue.
  - source_id: GO:0006646
    title: phosphatidylethanolamine biosynthetic process
    statement: >-
      GO:0006646 captures biosynthesis of phosphatidylethanolamine.
  - source_id: RHEA:16913
    title: CDP-diacylglycerol-serine O-phosphatidyltransferase reaction
    statement: >-
      Rhea 16913 defines formation of phosphatidylserine from
      CDP-diacylglycerol and L-serine.
  - source_id: RHEA:20828
    title: phosphatidylserine decarboxylase reaction
    statement: >-
      Rhea 20828 defines decarboxylation of phosphatidylserine to
      phosphatidylethanolamine.
  - source_id: PMID:39693441
    title: >-
      Structural basis for membrane association and catalysis by
      phosphatidylserine synthase in Escherichia coli
    statement: >-
      The E. coli PssA structure study defines PLD-superfamily
      peripheral-membrane PssA as type I and integral-membrane CDP-alcohol
      phosphatidyltransferase PssA as type II, and shows that membrane-bound
      type-I PssA is the active form.
  - source_id: PMID:179992
    title: >-
      Phosphatidylserine synthetase mutants of Escherichia coli. Genetic mapping
      and membrane phospholipid composition.
    statement: >-
      E. coli pss mutants lose phosphatidylethanolamine (66% to 32% of lipid
      phosphorus) while phosphatidylglycerol and cardiolipin rise, placing
      PssA on the PE branch.
  - source_id: PMID:1093166
    title: >-
      Biogenesis of membrane lipids: mutants of Escherichia coli with
      temperature-sensitive phosphatidylserine decarboxylase.
    statement: >-
      Thermolabile psd mutants accumulate phosphatidylserine, showing Psd
      performs the last step leading to phosphatidylethanolamine.
  - source_id: PMID:8002567
    title: >-
      Cloning, sequencing, and expression in Escherichia coli of the Bacillus
      subtilis gene for phosphatidylserine synthase.
    statement: >-
      The hydrophobic, membrane-bound B. subtilis PS synthase complements an
      E. coli pssA mutant, showing that the two unrelated architectures fill
      the same pathway step.
  - source_id: PMID:9422599
    title: >-
      Cloning, sequencing, and disruption of the Bacillus subtilis psd gene
      coding for phosphatidylserine decarboxylase.
    statement: >-
      B. subtilis psd lies just downstream of pss; the psd null mutant has no
      phosphatidylethanolamine and accumulates phosphatidylserine.
  - source_id: PMID:21895997
    title: >-
      The glycerophospholipid inventory of Pseudomonas putida is conserved
      between strains and enables growth condition-related alterations
    statement: >-
      KT2440 lipidomics detects phosphatidylethanolamine as the major membrane
      phospholipid and reconstructs both pssA and pssA-2 candidates upstream of
      psd.
notes: >-
  The module begins with CDP-diacylglycerol and L-serine and ends with
  phosphatidylethanolamine. CDP-diacylglycerol synthesis, phosphatidylglycerol
  and cardiolipin branches (bacterial_phosphatidylglycerol_cardiolipin_biosynthesis),
  lipid acyl-chain remodeling, and alternative phosphatidylethanolamine routes
  such as the Kennedy pathway are outside the boundary. The eukaryotic
  CHO1/PSD1/PSD2 implementation of the same two reactions is modeled in
  cdp_dag_phospholipid_synthesis, because its PS synthase steps are
  ER-localized and its decarboxylases mitochondrial or endomembrane; this
  module is therefore kept bacterial rather than generalized to all
  organisms. Psd autocatalytic maturation is required for activity but is a
  property of the terminal enzyme rather than a separate pathway reaction.
  Bacterial phosphatidylserine synthases occur in mechanistically distinct
  type-I and type-II architectures; these type names follow the PssA
  nomenclature of PMID:39693441. UniProt's CDP-alcohol phosphatidyltransferase
  class-I/class-II family labels describe a different classification axis
  and appear inverted relative to the PssA type names. PANTHER family
  groundings: type-I PssA sits in PTHR12586:SF1, the only subfamily of
  PTHR12586, whose official name refers to mitochondrial PGS1 because the
  subfamily also contains eukaryotic PGP synthases; the PAINT node
  PTN001758495 restricts the annoton to the phosphatidylserine-synthase
  clade. Type-II PssA sits in PTHR14269:SF61 (P. putida PP_4677, also yeast
  CHO1) and PTHR14269:SF59 (B. subtilis PssA). Bacterial Psd sits mainly in
  PTHR10067:SF6 (with eukaryotic PSD1) and partly in SF17. The PTHR12586,
  PTHR14269 and PTHR10067 family reviews adjudicate these scopes.
