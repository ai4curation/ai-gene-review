id: MODULE:fatty_acid_elongation_cycle
title: Microsomal fatty-acid elongation cycle (ELOVL or KCS -> KAR -> HACD -> ECR)
description: >-
  Most fatty acids longer than the C16 palmitate made by cytosolic fatty-acid synthase are produced by
  the
  microsomal elongation system, a four-reaction cycle on the cytosolic face of the endoplasmic-reticulum
  membrane that adds two carbons per turn. Each round begins with the rate-limiting, substrate-selective
  condensation of an acyl-CoA with malonyl-CoA to a 3-oxoacyl-CoA (releasing CO2), catalysed by one of
  seven
  fatty-acid elongases (ELOVL1-7) whose chain-length and saturation preferences define which fatty acids
  a
  cell makes: ELOVL1/3/6 handle saturated and monounsaturated substrates (ELOVL6 the C16->C18 lipogenic
  step,
  ELOVL1 the C22->C26 very-long-chain step for sphingolipids/myelin, ELOVL3 skin/brown-fat lipids), ELOVL2/5
  the C20/C22 polyunsaturated fatty acids en route to DHA, ELOVL7 C18-C20 substrates, and ELOVL4 the unique
  ultra-long-chain (C26-C38) fatty acids of retina, skin and brain. The 3-oxoacyl-CoA is then reduced
  by the
  NADPH-dependent 3-ketoacyl-CoA reductase HSD17B12 (KAR) to (3R)-3-hydroxyacyl-CoA, dehydrated by the
  3-hydroxyacyl-CoA dehydratases HACD1/HACD2 to (2E)-enoyl-CoA, and reduced by the NADPH-dependent
  trans-2-enoyl-CoA reductase TECR to the two-carbon-extended saturated acyl-CoA, which re-enters the
  cycle.
  The reductase/dehydratase/reductase enzymes are shared across all ELOVLs; substrate specificity resides
  in
  the elongase. Inherited defects span the products: ELOVL1 (IKSHD ichthyosis/spastic quadriplegia), ELOVL4
  (Stargardt-like macular dystrophy, SCA34, ichthyosis), HACD1 (congenital myopathy), TECR (intellectual
  disability), reflecting the roles of very-long-chain and ultra-long-chain fatty acids in skin barrier,
  myelin, retina and muscle. Fungi use ELO-family elongases homologous to the
  ELOVLs, whose paralogs divide the chain-length range from medium-chain
  (C12-C14) to C26 substrates, together with orthologous reductase,
  dehydratase and enoyl reductase; the C26 product is the fatty acid of fungal
  sphingolipids. Plants run the same four-step cycle but use an unrelated condensing enzyme,
  the thiolase-fold 3-ketoacyl-CoA synthases (KCS; e.g. FAE1/KCS18 for seed erucic acid, CER6/KCS6 for
  cuticular wax), while the downstream steps are carried out by orthologs of the animal enzymes (KCR1,
  PAS2, ECR/CER10 in Arabidopsis). The condensation step is therefore modelled as alternative enzyme
  families, and the three shared steps list animal and plant exemplars.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-5080-1
    title: very long chain fatty acid biosynthesis I (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5080-1
    statement: >-
      YeastCyc lists the four cycle reactions with ELO2/ELO3 (condensation),
      IFA38 (3-oxoacyl-CoA reduction), PHS1 (dehydration) and TSC13 (enoyl
      reduction). All assignments were retained; ELO1, the C12-C16 elongase,
      was added.
  - source_id: PMID:17719544
    title: A molecular caliper mechanism for determining very long-chain fatty acid length.
    statement: >-
      Proteoliposomes reconstituted from an Elo elongase, a dehydratase and two
      reductases catalysed repeated two-carbon additions; product length was
      dictated by the Elo homologue present and the Elo active site faces the
      cytosol.
  - source_id: PMID:9211877
    title: ELO2 and ELO3, homologues of the Saccharomyces cerevisiae ELO1 gene, function in fatty acid elongation and are required for sphingolipid formation.
    statement: >-
      Elo2p elongates fatty acids up to C24, Elo3p is essential for C24 to C26
      conversion, and both are needed for sphingolipid synthesis.
  - source_id: PMID:8702485
    title: Isolation and characterization of a gene affecting fatty acid elongation in Saccharomyces cerevisiae.
    statement: elo1 mutants fail to elongate C12-C14 fatty acids efficiently; ELO1 encodes a membrane protein.
  - source_id: PMID:12087109
    title: The Saccharomyces cerevisiae YBR159w gene encodes the 3-ketoreductase of the microsomal fatty acid elongase.
    statement: >-
      YBR159w (IFA38) encodes the major 3-ketoreductase of the elongase,
      co-localises and co-immunoprecipitates with Elo3p and Tsc13p; AYR1
      supplies residual activity.
  - source_id: PMID:18272525
    title: Membrane topology and essential amino acid residues of Phs1, a 3-hydroxyacyl-CoA dehydratase involved in very long-chain fatty acid elongation.
    statement: Phs1 is the 3-hydroxyacyl-CoA dehydratase of the VLCFA elongation cycle, a six-transmembrane ER protein.
  - source_id: PMID:11113186
    title: Tsc13p is required for fatty acid elongation and localizes to a novel structure at the nuclear-vacuolar interface in Saccharomyces cerevisiae.
    statement: >-
      TSC13 is required for VLCFA elongation, likely as the enoyl reductase;
      Tsc13p co-immunoprecipitates with Elo2p and Elo3p and localises to the
      ER.
  - source_id: GO:0030497
    title: fatty acid elongation
    statement: ELOVLs, HSD17B12, HACD1/2 and TECR run the microsomal fatty-acid elongation cycle
      (GO:0030497).
  - source_id: GO:0042761
    title: very long-chain fatty acid biosynthetic process
    statement: The cycle produces very-long-chain (and ultra-long-chain) fatty acids (GO:0042761).
  - source_id: file:human/ELOVL1/ELOVL1-ai-review.yaml
    title: ELOVL1 gene review (human)
    statement: The condensation step (UniProtKB:Q9BW60, GO:0009922) matches the completed human
      ELOVL1 review.
  - source_id: file:human/ELOVL2/ELOVL2-ai-review.yaml
    title: ELOVL2 gene review (human)
    statement: The PUFA condensation step (UniProtKB:Q9NXB9, GO:0009922) matches the completed human
      ELOVL2 review.
  - source_id: file:human/ELOVL3/ELOVL3-ai-review.yaml
    title: ELOVL3 gene review (human)
    statement: The condensation step (UniProtKB:Q9HB03, GO:0009922) matches the completed human
      ELOVL3 review.
  - source_id: file:human/ELOVL4/ELOVL4-ai-review.yaml
    title: ELOVL4 gene review (human)
    statement: The ultra-long-chain condensation step (UniProtKB:Q9GZR5, GO:0009922) matches the
      completed human ELOVL4 review.
  - source_id: file:human/ELOVL6/ELOVL6-ai-review.yaml
    title: ELOVL6 gene review (human)
    statement: The C16->C18 condensation step (UniProtKB:Q9H5J4, GO:0009922) matches the completed
      human ELOVL6 review.
  - source_id: file:human/ELOVL7/ELOVL7-ai-review.yaml
    title: ELOVL7 gene review (human)
    statement: The condensation step (UniProtKB:A1L3X0, GO:0009922) matches the completed human
      ELOVL7 review.
  - source_id: file:ARATH/FAE1/FAE1-ai-review.yaml
    title: FAE1 gene review (Arabidopsis)
    statement: The plant KCS condensation variant (UniProtKB:Q38860, GO:0009922) matches the
      completed Arabidopsis FAE1/KCS18 review.
  - source_id: file:THLAR/FAE1/FAE1-ai-review.yaml
    title: FAE1 gene review (field pennycress)
    statement: The plant KCS condensation variant (UniProtKB:V9XY07, GO:0009922) matches the
      pennycress FAE1 review, grounded in CRISPR knockouts that abolish seed erucic acid.
  - source_id: file:human/HSD17B12/HSD17B12-ai-review.yaml
    title: HSD17B12 gene review (human)
    statement: The 3-ketoacyl-CoA reduction step (UniProtKB:Q53GQ0, GO:0141040) matches the
      completed human HSD17B12 review.
  - source_id: file:human/HACD1/HACD1-ai-review.yaml
    title: HACD1 gene review (human)
    statement: The 3-hydroxyacyl-CoA dehydration step (UniProtKB:B0YJ81, GO:0102158) matches the
      completed human HACD1 review.
  - source_id: file:human/HACD2/HACD2-ai-review.yaml
    title: HACD2 gene review (human)
    statement: The 3-hydroxyacyl-CoA dehydration step (UniProtKB:Q6Y1H2, GO:0102158) matches the
      completed human HACD2 review.
  - source_id: file:human/TECR/TECR-ai-review.yaml
    title: TECR gene review (human)
    statement: The trans-2-enoyl-CoA reduction step (UniProtKB:Q9NZ01, GO:0102758) matches the
      completed human TECR review.
  - source_id: file:projects/THLAR_OILSEED/ortholog_mapping/CALLS.md
    title: Pennycress ortholog calls (THLAR_OILSEED project)
    statement: Pennycress representative members are reciprocal-best-hit orthologs of the
      Arabidopsis exemplars (phmmer against UP000836841 and back against UP000006548); only clear
      single-copy calls with full-length gene models and a matching PANTHER family are listed.
module:
  id: fatty_acid_elongation_cycle
  label: Microsomal fatty-acid elongation cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: fatty acid elongation
      term:
        id: GO:0030497
        label: fatty acid elongation
      description: Two-carbon-per-turn ER elongation cycle
        (condensation/reduction/dehydration/reduction).
    - preferred_term: very long-chain fatty acid biosynthetic process
      term:
        id: GO:0042761
        label: very long-chain fatty acid biosynthetic process
      description: Production of VLCFAs (and ultra-long-chain FAs) beyond C16.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-5080-1
      title: 'very long chain fatty acid biosynthesis I - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with ELO2, ELO3, IFA38, PHS1 and TSC13, all placed in
        cytosol (they are ER membrane proteins) and part of GO:0042761; ELO1
        is absent and IFA38/PHS1 carry imprecise MF terms.
    - model: gomodel:678073a900002931
      title: fatty acid biosynthetic process (GO:0006633)
      description: >-
        PomBase S. pombe model whose ER sub-model chains elo1/elo2 -> ifa38 ->
        phs1 -> tsc13, with acb1 acyl-CoA binding upstream; the rest of the
        model covers cytosolic type I FAS and mitochondrial FAS II.
  context:
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: All four cycle enzymes are ER-membrane proteins (fatty acid elongase complex).
  parts:
    - order: 1
      role: condensation (rate-limiting; substrate selectivity)
      node:
        id: condensation
        label: Condensing enzyme (ELOVL or 3-ketoacyl-CoA synthase)
        module_type: REACTION
        description: >-
          The condensation of acyl-CoA with malonyl-CoA is carried out by two unrelated enzyme
          families that converged on the same reaction (GO:0009922): the membrane-embedded ELO/ELOVL
          elongases of animals and fungi, and the thiolase-fold 3-ketoacyl-CoA synthases (KCS/FAE1)
          of plants. The downstream reductase, dehydratase and reductase steps are homologous across
          both lineages.
        variant_sets:
          - id: condensing_enzyme_family
            label: ELO/ELOVL (animals, fungi) vs KCS/FAE1 (plants) condensing enzymes
            axis: enzyme family / taxon
            selection: ONE_OR_MORE
            variants:
              - id: elovl_condensation
                label: ELO/ELOVL fatty-acid elongases (animals, fungi)
                module_type: REACTION
                annotons:
                  - id: elovl_activity
                    label: "ELOVL1/2/3/4/6/7: fatty acid elongase (condensing enzyme)"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ELOVL / ELO fatty-acid elongase family
                        term:
                          id: PANTHER:PTHR11157
                          label: FATTY ACID ACYL TRANSFERASE-RELATED
                        representative_members:
                          - preferred_term: ELOVL1 (human; sat/monounsat C22->C26)
                            term:
                              id: UniProtKB:Q9BW60
                              label: Elongation of very long chain fatty acids protein 1
                          - preferred_term: ELOVL2 (human; C20/C22 PUFA)
                            term:
                              id: UniProtKB:Q9NXB9
                              label: Elongation of very long chain fatty acids protein 2
                          - preferred_term: ELOVL3 (human; sat/monounsat C16-C22)
                            term:
                              id: UniProtKB:Q9HB03
                              label: Elongation of very long chain fatty acids protein 3
                          - preferred_term: ELOVL4 (human; ultra-long-chain C26-C38)
                            term:
                              id: UniProtKB:Q9GZR5
                              label: Elongation of very long chain fatty acids protein 4
                          - preferred_term: ELOVL6 (human; C16->C18)
                            term:
                              id: UniProtKB:Q9H5J4
                              label: Elongation of very long chain fatty acids protein 6
                          - preferred_term: ELOVL7 (human; C18-C20)
                            term:
                              id: UniProtKB:A1L3X0
                              label: Elongation of very long chain fatty acids protein 7
                          - preferred_term: ELO1 (Saccharomyces cerevisiae; C12-C14 -> C16-C18)
                            term:
                              id: UniProtKB:P39540
                              label: Fatty acid elongase 1
                            description: PMID:8702485.
                          - preferred_term: ELO2 (Saccharomyces cerevisiae; up to C24)
                            term:
                              id: UniProtKB:P25358
                              label: Fatty acid elongase 2
                            description: PMID:9211877.
                          - preferred_term: ELO3 (Saccharomyces cerevisiae; C24 -> C26)
                            term:
                              id: UniProtKB:P40319
                              label: Fatty acid elongase 3
                            description: PMID:9211877.
                          - preferred_term: elo1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q7LKX0
                              label: Putative fatty acid elongase 2
                            description: SPAC1639.01c.
                          - preferred_term: elo2 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q9UTF7
                              label: Fatty acid elongase 1
                            description: SPAC1B2.03c.
                    function:
                      preferred_term: fatty acid elongase activity
                      term:
                        id: GO:0009922
                        label: fatty acid elongase activity
                      substrates:
                        - preferred_term: acyl-CoA (chain-length/saturation per ELOVL isoform)
                        - preferred_term: malonyl-CoA
                      products:
                        - preferred_term: 3-oxoacyl-CoA (2 carbons longer)
                        - preferred_term: CO2 + CoA
                      evidence:
                        - source_id: file:human/ELOVL1/ELOVL1-ai-review.yaml
                          statement: Seven ELOVLs catalyse the rate-limiting condensation; substrate
                            specificity defines cell fatty-acid profile (ELOVL6 C16->C18; ELOVL1
                            sat/monounsat VLCFA; ELOVL2/5 PUFA->DHA; ELOVL4 ultra-long-chain)
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY-5080-1
                        activity: gomodel:RXN3O-9811
                        title: 'very long chain fatty acid biosynthesis I - imported from: Saccharomyces Genome Database'
                        description: ELO2 and ELO3 enable GO:0009922 (placed in cytosol).
                      - model: gomodel:678073a900002931
                        activity: gomodel:678073a900002931/6792e70800000042
                        title: fatty acid biosynthetic process (GO:0006633)
                        description: S. pombe elo2 enables GO:0009922 in the ER membrane (elo1 is a parallel activity, 6792e70800000033).
                    role_description: Condense acyl-CoA + malonyl-CoA to 3-oxoacyl-CoA
                      (rate-limiting; sets specificity).
              - id: kcs_condensation
                label: Plant 3-ketoacyl-CoA synthases (KCS / FAE1)
                module_type: REACTION
                annotons:
                  - id: kcs_activity
                    label: "KCS/FAE1: 3-ketoacyl-CoA synthase (plant condensing enzyme)"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: plant 3-ketoacyl-CoA synthase (KCS/FAE1) family
                        term:
                          id: PANTHER:PTHR31561
                          label: 3-KETOACYL-COA SYNTHASE
                        representative_members:
                          - preferred_term: FAE1/KCS18 (Arabidopsis; seed C18->C20/C22)
                            term:
                              id: UniProtKB:Q38860
                              label: 3-ketoacyl-CoA synthase 18
                          - preferred_term: CER6/KCS6 (Arabidopsis; epidermal wax VLCFA)
                            term:
                              id: UniProtKB:Q9XF43
                              label: 3-ketoacyl-CoA synthase 6
                          - preferred_term: FAE1 (field pennycress; seed erucic acid)
                            term:
                              id: UniProtKB:V9XY07
                              label: 3-ketoacyl-CoA synthase
                          - preferred_term: CUT1/KCS6 (field pennycress; TAV2_LOCUS17730, 1:1
                              ortholog)
                            term:
                              id: UniProtKB:A0AAU9SM40
                              label: very-long-chain 3-oxoacyl-CoA synthase
                        ancestral_nodes:
                          - preferred_term: PAINT IBD node PTN000774398 in PTHR31561
                            term:
                              id: PANTHER:PTN000774398
                              label: PTN000774398
                            description: >-
                              Local PAINT IBD node in PTHR31561 propagating F:GO:0009922 (fatty
                              acid elongase activity) and C:GO:0005783 (endoplasmic reticulum);
                              seeds include AT4G34520 (FAE1/KCS18) and AT1G68530 (CER6/KCS6);
                              PAINT date 20260529.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000774398 in
                                  PTHR31561.
                    function:
                      preferred_term: fatty acid elongase activity
                      term:
                        id: GO:0009922
                        label: fatty acid elongase activity
                      substrates:
                        - preferred_term: acyl-CoA (C16-C18 and longer; chain length per KCS
                            paralog)
                        - preferred_term: malonyl-CoA
                      products:
                        - preferred_term: 3-oxoacyl-CoA (2 carbons longer)
                        - preferred_term: CO2 + CoA
                      evidence:
                        - source_id: file:ARATH/FAE1/FAE1-ai-review.yaml
                          statement: FAE1/KCS18 is the seed condensing enzyme elongating C18 to
                            C20/C22 VLCFAs stored in triacylglycerol.
                        - source_id: file:THLAR/FAE1/FAE1-ai-review.yaml
                          statement: Pennycress fae1 CRISPR knockouts abolish erucic (C22:1) and
                            nearly abolish eicosenoic (C20:1) acid in seed oil.
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    role_description: >-
                      Condense acyl-CoA + malonyl-CoA to 3-oxoacyl-CoA; the KCS paralog sets chain length
                      and tissue (seed oil, cuticular wax, suberin).
    - order: 2
      role: 3-ketoacyl-CoA reduction
      node:
        id: ketoreduction
        label: 3-ketoacyl-CoA reductase (HSD17B12 / KAR)
        module_type: REACTION
        annotons:
          - id: hsd17b12_activity
            label: "HSD17B12: very-long-chain 3-oxoacyl-CoA reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: very-long-chain 3-ketoacyl-CoA reductase (KAR; SDR superfamily)
                description: >-
                  No PANTHER id: animal HSD17B12 and plant KCR1 are in PTHR43899,
                  whereas the fungal orthologues IFA38 and S. pombe SPAC4G9.15 are
                  in PTHR43086, so no single family contains all representatives.
                representative_members:
                  - preferred_term: HSD17B12 (human)
                    term:
                      id: UniProtKB:Q53GQ0
                      label: Very-long-chain 3-oxoacyl-CoA reductase
                  - preferred_term: KCR1/GLOSSY8 (Arabidopsis; plant ortholog)
                    term:
                      id: UniProtKB:Q8L9C4
                      label: Very-long-chain 3-oxoacyl-CoA reductase 1
                  - preferred_term: KCR1 (field pennycress; TAV2_LOCUS16128, 1:1 ortholog)
                    term:
                      id: UniProtKB:A0AAU9SJ87
                      label: 3-oxoacyl-[acyl-carrier-protein] reductase
                  - preferred_term: IFA38 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P38286
                      label: Very-long-chain 3-oxoacyl-CoA reductase
                    description: YBR159w; major elongase 3-ketoreductase (PMID:12087109).
                  - preferred_term: SPAC4G9.15 (Schizosaccharomyces pombe; ifa38)
                    term:
                      id: UniProtKB:Q10245
                      label: Very-long-chain 3-oxoacyl-CoA reductase
            function:
              preferred_term: very-long-chain 3-oxoacyl-CoA reductase activity
              term:
                id: GO:0141040
                label: very-long-chain 3-oxoacyl-CoA reductase activity
              substrates:
                - preferred_term: 3-oxoacyl-CoA
                - preferred_term: NADPH
              products:
                - preferred_term: (3R)-3-hydroxyacyl-CoA
                - preferred_term: NADP+
              evidence:
                - source_id: file:human/HSD17B12/HSD17B12-ai-review.yaml
                  statement: NADPH-dependent SDR reducing the 3-oxoacyl-CoA to
                    (3R)-3-hydroxyacyl-CoA (second cycle step; the KAR of VLCFA elongation);
                    historical 17-beta-HSD/estradiol activity is non-core
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-5080-1
                activity: gomodel:RXN3O-9812
                title: 'very long chain fatty acid biosynthesis I - imported from: Saccharomyces Genome Database'
                description: IFA38 typed as GO:0018454 acetoacetyl-CoA reductase activity (placed in cytosol) rather than GO:0141040.
              - model: gomodel:678073a900002931
                activity: gomodel:678073a900002931/6792e70800000051
                title: fatty acid biosynthetic process (GO:0006633)
                description: S. pombe ifa38 enables GO:0141040 in the ER.
            role_description: Reduce 3-oxoacyl-CoA to (3R)-3-hydroxyacyl-CoA (NADPH).
    - order: 3
      role: 3-hydroxyacyl-CoA dehydration
      node:
        id: dehydration
        label: 3-hydroxyacyl-CoA dehydratase (HACD1/HACD2)
        module_type: REACTION
        annotons:
          - id: hacd_activity
            label: "HACD1/HACD2: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: HACD / 3-hydroxyacyl-CoA dehydratase family
                term:
                  id: PANTHER:PTHR11035
                  label: VERY-LONG-CHAIN (3R)-3-HYDROXYACYL-COA DEHYDRATASE
                representative_members:
                  - preferred_term: HACD1 (human; muscle-enriched)
                    term:
                      id: UniProtKB:B0YJ81
                      label: Very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase 1
                  - preferred_term: HACD2 (human; ubiquitous)
                    term:
                      id: UniProtKB:Q6Y1H2
                      label: Very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase 2
                  - preferred_term: PAS2/PASTICCINO2 (Arabidopsis; plant ortholog)
                    term:
                      id: UniProtKB:Q8VZB2
                      label: Very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase PASTICCINO 2
                  - preferred_term: PHS1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P40857
                      label: Very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase
                    description: PMID:18272525.
                  - preferred_term: phs1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O14346
                      label: Probable very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase
                    description: SPBC19C2.15c.
            function:
              preferred_term: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity
              term:
                id: GO:0102158
                label: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity
              substrates:
                - preferred_term: (3R)-3-hydroxyacyl-CoA
              products:
                - preferred_term: (2E)-enoyl-CoA
                - preferred_term: H2O
              evidence:
                - source_id: file:human/HACD1/HACD1-ai-review.yaml
                  statement: Third cycle step, dehydrating (3R)-3-hydroxyacyl-CoA to (2E)-enoyl-CoA;
                    HACD1 muscle-enriched (congenital myopathy), HACD2 ubiquitous
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-5080-1
                activity: gomodel:RXN3O-9813
                title: 'very long chain fatty acid biosynthesis I - imported from: Saccharomyces Genome Database'
                description: PHS1 typed as GO:0004300 enoyl-CoA hydratase activity (placed in cytosol) rather than GO:0102158.
              - model: gomodel:678073a900002931
                activity: gomodel:678073a900002931/6792e70800000060
                title: fatty acid biosynthetic process (GO:0006633)
                description: S. pombe phs1 typed as GO:0018812 3-hydroxyacyl-CoA dehydratase activity in the ER membrane.
            role_description: Dehydrate (3R)-3-hydroxyacyl-CoA to (2E)-enoyl-CoA.
    - order: 4
      role: trans-2-enoyl-CoA reduction (cycle completion)
