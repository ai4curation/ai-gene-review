  notes: >
    Microsomal fatty-acid elongation cycle (GO:0030497 + GO:0042761), grounded to ten completed human
    gene reviews plus Arabidopsis (FAE1, CUT1, KCR1, PAS2, ECR) and field pennycress (FAE1) reviews, with
    pennycress orthologs as additional examples; all ER-membrane enzymes of the fatty acid elongase complex
    (GO:0009923). CONDENSATION (rate-limiting, substrate-selective): six of the seven ELOVLs reviewed
    here (ELOVL1 Q9BW60, ELOVL2 Q9NXB9, ELOVL3 Q9HB03, ELOVL4 Q9GZR5, ELOVL6 Q9H5J4, ELOVL7 A1L3X0) share
    PTHR11157 and all carry GO:0009922 fatty acid elongase activity (the single correct MF — no finer
    chain-length GO term exists; specificity noted per-gene: ELOVL6 C16->C18, ELOVL1 sat/monounsat VLCFA,
    ELOVL2 C20/C22 PUFA->DHA, ELOVL3 skin/brown-fat, ELOVL4 ultra-long-chain C26-C38, ELOVL7 C18-C20;
    ELOVL5 already reviewed earlier). The other three steps are SHARED across all ELOVLs: HSD17B12/KAR
    (Q53GQ0 PTHR43899, GO:0141040 3-oxoacyl-CoA reductase — its legacy 17-beta-HSD/estradiol activity
    is non-core), HACD1 (B0YJ81, muscle) + HACD2 (Q6Y1H2, ubiquitous) sharing PTHR11035 (GO:0102158 (3R)-3-hydroxyacyl-CoA
    dehydratase), and TECR (Q9NZ01 PTHR10556, GO:0102758 trans-2-enoyl-CoA reductase). Recurrent curation
    note: several reviews flag PMID:10970790 (HELO1 = the ELOVL5/ELOVL2 clone) as a WRONG_IDENTIFIER Reactome-EXP
    source though the elongase MF itself is correct. GO term ids/labels verified against the local go.db.
    Products feed sphingolipid/ceramide synthesis (curated modules), membrane phospholipids and skin/myelin/retina
    lipids. Disorders: ELOVL1 IKSHD; ELOVL4 Stargardt-like STGD3 / SCA34 / ISQMR; HACD1 congenital myopathy;
    TECR intellectual disability (MRT14).
    ALIGN (YeastPathways project, 2026-10): S. cerevisiae and S. pombe
    exemplars were added to all four steps. YeastCyc PWY-5080-1 lists ELO2,
    ELO3, IFA38, PHS1 and TSC13, all retained; ELO1 (C12-C14 -> C16-C18,
    PMID:8702485) was added as the third yeast elongase, and the minor
    ketoreductase AYR1 (PMID:12087109) is noted but not listed as a
    representative. All five fungal elongases are in PTHR11157 with the
    ELOVLs. The ketoreductase descriptor lost its PANTHER id (PTHR43899
    "RH59310P") because the fungal orthologues IFA38 and SPAC4G9.15 are in
    PTHR43086. PHS1/phs1 (PTHR11035) and TSC13/tsc13 (PTHR10556) fit the
    existing families. GO-CAM disagreements: YeastPathways_PWY-5080-1 places
    every activity in cytosol rather than ER membrane, types IFA38 as
    GO:0018454 acetoacetyl-CoA reductase and PHS1 as GO:0004300 enoyl-CoA
    hydratase rather than the very-long-chain terms, and omits ELO1; the
    PomBase model uses the broader GO:0018812 and GO:0019166 for phs1 and
    tsc13 but otherwise agrees.
