- id: PMID:37878710
  title: A bacterial spermidine biosynthetic pathway via carboxyaminopropylagmatine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary source and target/construct limits checked against available text and the linked
      member reviews. Cached full text available.
  findings:
  - statement: The agmatine/CAPA pathway shares enzyme families but requires an additional ureohydrolase; a
      family hit alone cannot assign the putrescine route.
    supporting_text: The CAPA pathway starts with reductive condensation of agmatine and l-aspartate-β-semialdehyde
      into CAPA by a previously unknown CAPA dehydrogenase
  - statement: The tested H. pylori upstream dehydrogenase WP_000557673 belongs to the seven
      recombinant orthologs that produced CAPA and preferred agmatine to putrescine/DAP. This is
      evidence against assigning the putrescine route solely from family membership; it is not a
      substrate assay of the downstream HP_0020/O24865 decarboxylase.
    supporting_text: Similar to Synechocystis CAPADH, these enzymes showed much lower activities toward
      putrescine and 1,3-diaminopropane than the activity for agmatine
- id: PMID:37437886
  title: Kinetic and structural characterization of carboxyspermidine dehydrogenase of polyamine biosynthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary source and target/construct limits checked against available text and the linked
      member reviews. Cached full text available.
  findings:
  - statement: Purified Bacteroides fragilis and Clostridium leptum enzymes were compared with both diamines.
      BfCASDH favors putrescine in measured catalytic efficiency; similar Cl efficiencies do not establish
      preference against untested agmatine.
    supporting_text: These data suggest that both enzymes can use putrescine or DAP and thus produce carboxyspermidine
      or carboxynorspermidine.
  - statement: Reported apparent kcat/Km values are 96 versus 17 M−1 s−1 for BfCASDH with putrescine versus
      DAP, and 74 versus 71 for the Clostridium enzyme. Agmatine was not included in that comparison; later
      pathway reconstruction changes its physiological interpretation.
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary source and target/construct limits checked against available text and the linked
      member reviews. Cached full text available. Table S1 calls C. leptum EDO61992 CAPADC, while PMID39887002
      calls that exact accession CASDC. Reconstructed agmatine-route activity and direct structural observations
      are interpreted separately; historical names alone do not establish substrate specificity.
  findings:
  - statement: Reconstructed alphaproteobacterial CASDH/CASDC pairs make spermidine and can extend it to spermine/thermospermine.
      Related agmatine and hybrid routes show that ASA- and dcAdoMet-dependent chemistry are not universally
      mutually exclusive.
    supporting_text: we identified phylogenetically diverse bacterial species that encode functional hybrid
      ASA-, dcAdoMet-dependent pathways, initiating from agmatine, that are specific for Spm biosynthesis.
  - statement: Supplement Table S1 identifies the assayed Agrobacterium and Paracoccus pairs; all four RefSeq
      sequences match the frozen reference accessions exactly. Heterologous reconstruction establishes catalytic
      capability, not the magnitude of native flux.
