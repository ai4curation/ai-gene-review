id: MODULE:bacterial_carboxyspermidine_biosynthesis
title: Bacterial carboxyspermidine route to spermidine
description: A bacterial two-reaction route that converts putrescine and L-aspartate 4-semialdehyde to spermidine.
  NADPH-dependent carboxyspermidine dehydrogenase first forms carboxyspermidine, which a PLP-dependent decarboxylase
  converts to spermidine and carbon dioxide. The route draws its added carbon unit from aspartate metabolism
  rather than decarboxylated S-adenosylmethionine. It occurs across multiple bacterial lineages, but neither
  universal occurrence nor universal exclusion of other polyamine routes is implied. Related family members
  differ in substrate preference and can support norspermidine, tetraamine or agmatine-series chemistry; membership
  alone does not establish this putrescine route. Substrate supply, transport and downstream polyamine effects
  lie outside the two-reaction boundary.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:27268252
  title: Polyamines in Eukaryotes, Bacteria, and Archaea.
  statement: The comparative review identifies the two-enzyme aspartate-semialdehyde route and substrate flexibility;
    substrate supply and downstream physiology are outside the two-reaction boundary.
  supporting_text: a bacteria-specific aspartate β-semialdehyde-dependent pathway ( Fig. 3 ) that uses carboxyspermidine
    dehydrogenase (CASDH) and carboxyspermidine decarboxylase (CASDC)
- source_id: PMID:30254075
  title: Polyamine function in archaea and bacteria.
  statement: Polyamine-dependent growth and surface phenotypes vary across species and are not universal outputs
    of these two catalytic steps.
  supporting_text: the role of polyamines in planktonic growth of different species, ranging from absolutely
    essential to entirely dispensable.
- source_id: PMID:19196710
  title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for biofilm
    formation in Vibrio cholerae.
  statement: Vibrio cholerae C6709 genetics establish the paired route. N16961 accessions are reference homologs;
    the purified decarboxylase substrate assay in this paper used Vibrio vulnificus.
  supporting_text: Deletion of either VC1624 (putative CANSDH) or VC1623 (CANSDC) abolished sym -norspermidine
    and spermidine accumulation
- source_id: PMID:26682642
  title: The Essential Role of Spermidine in Growth of Agrobacterium tumefaciens Is Determined by the 1,3-Diaminopropane
    Moiety.
  statement: 'Native C58 deletions support the two-step route: loss of Atu4170 eliminates spermidine, and loss
    of Atu4169 accumulates carboxyspermidine.'
  supporting_text: the ΔCASDH (Atu4170) strain accumulates putrescine and homospermidine but lacks spermidine
- source_id: PMID:22025614
  title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni and is the
    dominant polyamine pathway in human gut microbiota.
  statement: Campylobacter jejuni 81116 CASDC is required for spermidine formation, but deleting the assigned
    CASDH increases rather than abolishes spermidine; this study does not prove universal native dependence
    on both steps.
  supporting_text: deletion of the C. jejuni CASDH does not abolish spermidine accumulation. Instead, it paradoxically
    produces a very large increase in spermidine accumulation.
- source_id: PMID:27118128
  title: Carboxyspermidine decarboxylase of the prominent intestinal microbiota species Bacteroides thetaiotaomicron
    is required for spermidine biosynthesis and contributes to normal growth.
  statement: Bacteroides thetaiotaomicron CASDC genetics and activity support the second step. The publisher
    figure identifies BT_0674 as CASDC and draws BT_4612 CASDH as a predicted, dotted step.
  supporting_text: These results indicate that carboxyspermidine decarboxylase is essential for synthesizing
    spermidine in B. thetaiotaomicron and contributes to the growth of this species.
- source_id: PMID:37437886
  title: Kinetic and structural characterization of carboxyspermidine dehydrogenase of polyamine biosynthesis.
  statement: Purified Bacteroides fragilis and Clostridium leptum enzymes were compared with both diamines.
    BfCASDH favors putrescine in measured catalytic efficiency; similar Cl efficiencies do not establish preference
    against untested agmatine.
  supporting_text: These data suggest that both enzymes can use putrescine or DAP and thus produce carboxyspermidine
    or carboxynorspermidine.
- source_id: PMID:40074085
  title: New routes for spermine biosynthesis.
  statement: Reconstructed alphaproteobacterial CASDH/CASDC pairs make spermidine and can extend it to spermine/thermospermine.
    Related agmatine and hybrid routes show that ASA- and dcAdoMet-dependent chemistry are not universally
    mutually exclusive.
  supporting_text: we identified phylogenetically diverse bacterial species that encode functional hybrid ASA-,
    dcAdoMet-dependent pathways, initiating from agmatine, that are specific for Spm biosynthesis.
notes: 'This is a concrete, chemically specified two-step pathway with family selectors and grounded representatives,
  not a claim that every bacterial genome realizes it. Bacteria is the shared taxon context; the positive or
  inferred representatives sample Pseudomonadota, Campylobacterota and Bacteroidota. Bacillota Clostridium
  proteins were reviewed as specificity comparators, not presented as a proven native putrescine-route pair.
  Neither adjacency nor essentiality is universal: Campylobacter and Helicobacter candidates are not adjacent,
  and C. jejuni 81116 CASDH deletion increases spermidine. C. jejuni 81116 and NCTC 11168 are separate targets.
  The Helicobacter 26695 CASDH sequence-start discrepancy prevents use as a direct structural exemplar. The
  paired pathway can coexist with other polyamine machinery; inactive H. pylori SpeE is a target-specific negative
  result, not a general exclusion rule. GO:0102143 names carboxynorspermidine dehydrogenase but explicitly
  includes carboxyspermidine oxidation to putrescine; the reductive reaction used here is RHEA:34111. No current
  reaction-specific CASDC GO term was established, so the second leaf names the precise RHEA:34095 activity
  without substituting broad carboxy-lyase as the claimed reaction. Gene reviews propose the missing term.
  PANTHER SF2 and SF1 identities are membership filters, not substrate proofs; Synechocystis and Clostridium
  CAPA chemistry shows why functional restriction is necessary. No PAINT ancestral node is asserted: the dehydrogenase
  family lacks a suitable functional node and the decarboxylase family node concerns LysA. The same-family
  CAPA route needs a third enzyme and remains outside this module; alternative diamine inputs and onward tetraamine
  production are also outside this exact reaction boundary.'
