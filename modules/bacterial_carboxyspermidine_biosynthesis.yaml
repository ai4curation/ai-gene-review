- id: PMID:39887002
  title: Structure of Clostridium leptum carboxyspermidine decarboxylase and comparison to homologs prevalent
    within the human gut microbiome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary source and target/construct limits checked against available text and the linked
      member reviews. Cached full text available. The Methods identify EDO61992.1 as CASDC, whereas PMID40074085
      Table S1 names the same EDO61992 protein CAPADC. This naming discrepancy is explicit: the structure establishes
