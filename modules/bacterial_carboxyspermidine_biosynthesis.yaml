id: MODULE:bacterial_carboxyspermidine_biosynthesis
title: Bacterial carboxyspermidine route to spermidine
description: >-
  A reusable bacterial route in which carboxyspermidine dehydrogenase condenses
  putrescine with L-aspartate 4-semialdehyde using NADPH to form
  carboxyspermidine, followed by decarboxylation of carboxyspermidine to
  spermidine. It replaces the classical S-adenosylmethionine-dependent route, in
  which S-adenosylmethionine decarboxylase and spermidine synthase aminopropylate
  putrescine, and draws its aminopropyl unit from aspartate metabolism instead of
  from methionine. The two enzymes are historically named for their norspermidine
  substrates (CANSDH/CANSDC, NspC) because that activity was described first; the
  same proteins carry out both reactions, and which polyamine is made depends on
  whether putrescine or 1,3-diaminopropane is supplied. Diamine and
  aspartate-semialdehyde supply are pathway inputs rather than parts of this
  two-reaction module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:19196710
    title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for biofilm formation in Vibrio cholerae.
    statement: >-
      Deletion and complementation of the adjacent dehydrogenase and
      decarboxylase genes in Vibrio cholerae establish the two-reaction core and
      show that the pair makes spermidine from putrescine as well as
      norspermidine from 1,3-diaminopropane.
    supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine, which is then converted to spermidine by CANSDC
  - source_id: PMID:22025614
    title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni and is the dominant polyamine pathway in human gut microbiota.
    statement: >-
      In Campylobacter jejuni the decarboxylase orthologue makes spermidine
      rather than norspermidine in vivo, and the route is the dominant spermidine
      pathway of the human gut, stomach and oral microbiomes, so the module is
      genuinely species-general rather than a Vibrio peculiarity.
    supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is responsible for synthesizing spermidine and not sym-norspermidine in vivo
  - source_id: PMID:27118128
    title: Carboxyspermidine decarboxylase of the prominent intestinal microbiota species Bacteroides thetaiotaomicron is required for spermidine biosynthesis and contributes to normal growth.
    statement: >-
      Deletion and complementation of casdc in Bacteroides thetaiotaomicron, a
      Bacteroidetes outside the Proteobacteria, confirm the decarboxylase step in
      a third phylum.
    supporting_text: These results indicate that carboxyspermidine decarboxylase is essential for synthesizing spermidine in B. thetaiotaomicron and contributes to the growth of this species.
  - source_id: PMID:36283333
    title: Structural analysis of carboxyspermidine dehydrogenase from Helicobacter pylori.
    statement: Defines the NADPH-dependent condensation of putrescine with aspartate semialdehyde performed by the first step.
    supporting_text: CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in an NADPH-dependent manner.
  - source_id: PMID:28648602
    title: Helicobacter pylori does not use spermidine synthase to produce spermidine.
    statement: >-
      Helicobacter pylori SpeE lacks substrate-binding residues and is
      enzymatically inactive, so this route, not the classical one, supplies its
      spermidine. Evidence that the module is an alternative to, not an adjunct
      of, the S-adenosylmethionine route.
    supporting_text: "further demonstrates that HpSpeE has no detectable in vitro enzymatic activity"
  - source_id: RHEA:34095
    title: carboxyspermidine decarboxylase reaction
    statement: Defines the conversion of carboxyspermidine to spermidine performed by the second step.
  - source_id: file:interpro/panther/PTHR43796/PTHR43796-review.yaml
    title: Family review of PTHR43796 (carboxynorspermidine synthase)
    statement: >-
      Scopes the dehydrogenase activity across the family and records the
      agmatine-specific Synechocystis member as a member exception.
  - source_id: file:interpro/panther/PTHR43727/PTHR43727-review.yaml
    title: Family review of PTHR43727 (group IV PLP-dependent decarboxylases)
    statement: >-
      Finds the family heterogeneous, restricts diaminopimelate decarboxylase
      activity and lysine biosynthesis to subfamily SF2, and records the PAINT
      node PTN000159906 as needing pruning at the NspC subfamily SF1.
  - source_id: file:projects/NCBIFam/ncbifam2go.candidates.tsv
    title: NCBIFam-to-GO candidate mappings
    statement: >-
      Records NCBIFAM:NF043000 carboxynorspermidine synthase (EC 1.5.1.43)
      as an exact match to GO:0102143, supporting use of the current GO term for
      the putrescine-to-carboxyspermidine direction.
  - source_id: file:modules/bacterial_carboxyspermidine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist bacterial carboxyspermidine module review
    statement: >-
      The species-neutral review identifies CASDH and NspC as the obligatory,
      defining two-reaction core and treats diamine-supply reactions as an
      interchangeable front end.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-carboxyspermidine-biosynthesis__ppu00330-deep-research-openscientist.md
    title: OpenScientist PSEPK carboxyspermidine pathway review
    statement: >-
      The species-aware review infers adjacent PP_2928 and PP_2929 as the
      CASDH-CASDC pair from comparative, family, and synteny evidence; it
      reports no direct KT2440 biochemical or genetic confirmation.
notes: >-
  Boundary and scope. The module is the two-reaction core: condensation of a
  diamine with L-aspartate 4-semialdehyde, then decarboxylation of the
  carboxypolyamine. Putrescine and aspartate-semialdehyde production are
  substrate supply and stay outside, as does polyamine transport. The scope is
  CONCRETE rather than ABSTRACT because both leaves ground to named proteins,
  but the participants are FAMILY selectors and the taxon context is Bacteria,
  so the module is species-general; the exemplars orient the reader and are not
  a membership claim.
  Generalization (2026-11-02). The module previously used Pseudomonas putida
  KT2440 exemplars alone, where the pathway is inferred from family membership
  and nspC adjacency and has never been assayed. Both leaves now lead with the
  Vibrio cholerae pair, which is where the route was characterized genetically:
  deletion of either gene abolishes spermidine and norspermidine, deletion of the
  decarboxylase accumulates the carboxypolyamine intermediate, and
  overexpression of the dehydrogenase redirects flux from putrescine to
  spermidine. The route is not Vibrio-specific: the decarboxylase step is
  established by deletion and complementation in Campylobacter jejuni
  (Epsilonproteobacteria) and Bacteroides thetaiotaomicron (Bacteroidetes), and
  Helicobacter pylori relies on it because its spermidine synthase is inactive.
  KT2440 is retained as one exemplar of the inferred case, marked as such.
  Enzyme naming. The GO label for GO:0102143 is "carboxynorspermidine
  dehydrogenase activity", but its definition covers the carboxyspermidine
  direction too: after writing out the carboxynorspermidine reaction it adds
  "Also converts carboxyspermidine to putrescine." (checked against the GO
  release used for validation and against QuickGO on 2026-11-02; the definition
  states the reaction in the NADP+ direction, so read in the reductive direction
  this is the putrescine-to-carboxyspermidine step this module uses). The term
  also carries both Rhea reactions, RHEA:34111 and RHEA:34115, and
  NCBIFAM:NF043000 maps to it as an exact match for EC 1.5.1.43. The decarboxylase has no GO term of its own: GO:0016831
  carboxy-lyase activity is the most specific available, and both NspC gene
  reviews propose a specific EC 4.1.1.96 term.
  Grounding choices. The dehydrogenase leaf is grounded on PANTHER
  PTHR43796:SF2, verified against panther.obo and the member index, and both
  exemplars are classified at exactly that subfamily. The decarboxylase leaf
  cites PANTHER PTHR43727:SF1 but relies on NCBIfam TIGR01047 (nspC) and
  InterPro IPR005730 for the identification, because the enclosing PANTHER
  family PTHR43727 is heterogeneous: it is named for, and its only PAINT node
  describes, the LysA diaminopimelate decarboxylases of subfamily SF2, and that
  node over-propagates diaminopimelate decarboxylase activity into SF1. No
  ancestral_nodes are declared on either leaf: PTHR43796 has no PAINT node-level
  annotations at all, and the single PTHR43727 node asserts the LysA function,
  which this module's participant does not have.
  Related routes deliberately excluded. Fed 1,3-diaminopropane instead of
  putrescine, the same two enzymes make sym-norspermidine; that is the same
  module with a different input, not a separate pathway, and it is why the
  enzymes carry norspermidine names. The carboxyaminopropylagmatine (CAPA) route
  of Synechocystis is a different module: it starts from agmatine, passes through
  CAPA and aminopropylagmatine, and needs a third enzyme, an aminopropylagmatine
  ureohydrolase, to reach spermidine. Its two enzymes sit in the same PANTHER
  groupings as this module's, so the distinction is recorded in both family
  reviews rather than here.
module:
  id: bacterial_carboxyspermidine_biosynthesis
  label: Bacterial carboxyspermidine route to spermidine
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: spermidine biosynthetic process
      term:
        id: GO:0008295
        label: spermidine biosynthetic process
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: carboxyspermidine formation
      node:
        id: casdh_carboxyspermidine_formation
        label: CASDH-dependent carboxyspermidine formation
        module_type: REACTION
        annotons:
          - id: casdh_dehydrogenase
            label: Carboxyspermidine dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: carboxyspermidine/carboxynorspermidine dehydrogenase family
                term:
                  id: PANTHER:PTHR43796:SF2
                  label: CARBOXYNORSPERMIDINE SYNTHASE
                description: >-
                  Saccharopine dehydrogenase-like NADPH-dependent dehydrogenases
                  that condense L-aspartate 4-semialdehyde with a diamine. The
                  narrower signatures NCBIFAM:NF043000 (carsnrspmd_synth) and
                  InterPro IPR050050 (CANSDH) pick out the same chemistry. Within
                  this subfamily, the Synechocystis member is agmatine-specific
                  and belongs to the CAPA route instead; see the PTHR43796 family
                  review.
                representative_members:
                  - preferred_term: VC_1624 (Vibrio cholerae O1 El Tor N16961)
                    term:
                      id: UniProtKB:Q9KRL3
                      label: Carboxynorspermidine synthase
                    description: >-
                      The experimentally characterized exemplar. Deletion
                      abolishes norspermidine and spermidine; overexpression
                      redirects putrescine into spermidine.
                  - preferred_term: PP_2928 (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88IS1
                      label: Saccharopine dehydrogenase
                    description: >-
                      Inferred exemplar, assigned from PTHR43796:SF2 membership,
                      domain architecture, length and adjacency to nspC; still
                      named saccharopine dehydrogenase in UniProt and not
                      assayed in KT2440.
            function:
              preferred_term: carboxynorspermidine dehydrogenase activity
              term:
                id: GO:0102143
                label: carboxynorspermidine dehydrogenase activity
              description: >-
                GO's label names the norspermidine direction, but the term
                definition also says "Also converts carboxyspermidine to
                putrescine." — the same reaction this module runs reductively,
                from putrescine to carboxyspermidine. Independently of that
                sentence, the term is the EC 1.5.1.43 class and carries both of
                its Rhea reactions, RHEA:34111 (carboxyspermidine) and
                RHEA:34115 (carboxynorspermidine), which are the two reactions
                UniProt curates on the characterized members.
              substrates:
                - preferred_term: putrescine
                - preferred_term: L-aspartate 4-semialdehyde
                - preferred_term: NADPH
              products:
                - preferred_term: carboxyspermidine
                - preferred_term: NADP+
              evidence:
                - source_id: PMID:36283333
                  statement: Defines the NADPH-dependent condensation of putrescine with aspartate semialdehyde.
                  supporting_text: CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in an NADPH-dependent manner.
                - source_id: PMID:19196710
                  statement: Shows the characterized enzyme using putrescine in vivo to feed spermidine synthesis.
                  supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine, which is then converted to spermidine by CANSDC
            processes:
              - preferred_term: spermidine biosynthetic process
                term:
                  id: GO:0008295
                  label: spermidine biosynthetic process
    - order: 2
      role: spermidine formation by decarboxylation
      node:
        id: nspc_spermidine_formation
        label: NspC-dependent spermidine formation
        module_type: REACTION
        annotons:
          - id: nspc_carboxyspermidine_decarboxylase
            label: NspC carboxyspermidine decarboxylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: carboxyspermidine/carboxynorspermidine decarboxylase family
                term:
                  id: PANTHER:PTHR43727:SF1
                  label: CARBOXYNORSPERMIDINE_CARBOXYSPERMIDINE DECARBOXYLASE
                description: >-
                  PLP-dependent group IV decarboxylases specific for carboxylated
                  polyamines (EC 4.1.1.96), identified by NCBIfam TIGR01047
                  (nspC) and InterPro IPR005730. The subfamily sits inside the
                  heterogeneous LysA family PTHR43727, whose PAINT node
                  over-propagates diaminopimelate decarboxylase activity here;
                  see the PTHR43727 family review. The Synechocystis member of
                  this subfamily prefers carboxyaminopropylagmatine and belongs
                  to the CAPA route.
                representative_members:
                  - preferred_term: nspC / VC_1623 (Vibrio cholerae O1 El Tor N16961)
                    term:
                      id: UniProtKB:Q9KRL4
                      label: Carboxynorspermidine/carboxyspermidine decarboxylase
                    description: >-
                      The experimentally characterized exemplar. Deletion
                      abolishes norspermidine and spermidine and accumulates
                      carboxynorspermidine.
                  - preferred_term: nspC (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88IS0
                      label: Carboxynorspermidine/carboxyspermidine decarboxylase
                    description: >-
                      Inferred exemplar, assigned from PTHR43727:SF1 membership
                      and adjacency to the CASDH candidate PP_2928; not assayed
                      in KT2440.
            function:
              preferred_term: carboxy-lyase activity
              term:
                id: GO:0016831
                label: carboxy-lyase activity
              description: >-
                The most specific GO molecular function available. GO has no term
                for EC 4.1.1.96; both NspC gene reviews propose one, so this
                leaf should be re-pointed when it exists.
              substrates:
                - preferred_term: carboxyspermidine
              products:
                - preferred_term: spermidine
                - preferred_term: carbon dioxide
              evidence:
                - source_id: RHEA:34095
                  statement: Rhea 34095 defines carboxyspermidine decarboxylation to spermidine.
                - source_id: PMID:22025614
                  statement: In Campylobacter jejuni the orthologue makes spermidine, not norspermidine, in vivo.
                  supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is responsible for synthesizing spermidine and not sym-norspermidine in vivo
                - source_id: PMID:27118128
                  statement: Deletion and complementation in Bacteroides thetaiotaomicron confirm the step outside the Proteobacteria.
                  supporting_text: These results indicate that carboxyspermidine decarboxylase is essential for synthesizing spermidine in B. thetaiotaomicron and contributes to the growth of this species.
            processes:
              - preferred_term: spermidine biosynthetic process
                term:
                  id: GO:0008295
                  label: spermidine biosynthetic process
  connections:
    - source: casdh_carboxyspermidine_formation
      target: nspc_spermidine_formation
      connection_type: PROVIDES_INPUT_FOR
      description: CASDH-produced carboxyspermidine is decarboxylated by NspC.
      chaining_status: VERIFIED
knowledge_gaps:
  - gap_statement: >-
      What sets the split between carboxyspermidine and carboxynorspermidine, and
      therefore between spermidine and norspermidine, is unresolved. In Vibrio
      cholerae the ratio tracks enzyme level rather than any measured specificity,
      and no kinetic comparison of the two diamines exists for a CASDH that
      operates predominantly in the spermidine direction.
    boundary: >-
      The chemistry of both steps, both substrate pairs and the genetic
      requirement for each enzyme are established in several phyla; the
      quantitative partition is not.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether organisms running this module regulate which polyamine
      they make, or simply make whichever their diamine supply dictates.
    resolution: >-
      Steady-state kinetics of a spermidine-direction CASDH and its partner NspC
      with both diamines and both carboxypolyamines, with polyamine quantitation
      in strains whose putrescine and 1,3-diaminopropane supply is manipulated.
    provenance:
      - reference_id: PMID:19196710
        reference_section_type: RESULTS
        supporting_text: These data suggest that when the CANSDH enzyme is in excess, it increasingly uses putrescine as a substrate
references:
  - id: PMID:19196710
    title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for biofilm formation in Vibrio cholerae.
    findings:
      - statement: >-
          Genetic deletion of either gene of the adjacent pair abolishes norspermidine and spermidine in Vibrio cholerae, and deletion of the decarboxylase accumulates the carboxypolyamine intermediate.
        supporting_text: "Deletion of either VC1624 (putative CANSDH) or VC1623 (CANSDC) abolished sym -norspermidine and spermidine accumulation"
        reference_section_type: RESULTS
  - id: PMID:22025614
    title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni and is the dominant polyamine pathway in human gut microbiota.
    findings:
      - statement: >-
          In Campylobacter jejuni the decarboxylase orthologue makes spermidine rather than norspermidine in vivo, and the route is widespread across bacterial phyla.
        supporting_text: "we found that the carboxynorspermidine decarboxylase orthologue is responsible for synthesizing spermidine and not sym-norspermidine in vivo"
        reference_section_type: ABSTRACT
  - id: PMID:27118128
    title: Carboxyspermidine decarboxylase of the prominent intestinal microbiota species Bacteroides thetaiotaomicron is required for spermidine biosynthesis and contributes to normal growth.
    findings:
      - statement: >-
          Deletion and complementation of casdc in Bacteroides thetaiotaomicron establish the decarboxylase step outside the Proteobacteria.
        supporting_text: "These results indicate that carboxyspermidine decarboxylase is essential for synthesizing spermidine in B. thetaiotaomicron and contributes to the growth of this species."
        reference_section_type: ABSTRACT
  - id: PMID:28648602
    title: Helicobacter pylori does not use spermidine synthase to produce spermidine.
    findings:
      - statement: >-
          Helicobacter pylori spermidine synthase is inactive, so this route rather than the classical one supplies its spermidine.
        supporting_text: "further demonstrates that HpSpeE has no detectable in vitro enzymatic activity"
        reference_section_type: ABSTRACT
  - id: PMID:36283333
    title: Structural analysis of carboxyspermidine dehydrogenase from Helicobacter pylori.
    findings:
      - statement: >-
          Structural work on the Helicobacter pylori enzyme defines the NADPH-dependent condensation of putrescine with aspartate semialdehyde.
        supporting_text: "CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in an NADPH-dependent manner."
        reference_section_type: ABSTRACT
  - id: PMID:37878710
    title: A bacterial spermidine biosynthetic pathway via carboxyaminopropylagmatine.
    findings:
      - statement: >-
          A related but distinct route in Synechocystis condenses agmatine instead of putrescine and needs a third enzyme to reach spermidine; its enzymes fall in the same PANTHER groupings, which is why this module records the distinction.
        supporting_text: "The CAPA pathway starts with reductive condensation of agmatine and l-aspartate-β-semialdehyde into CAPA by a previously unknown CAPA dehydrogenase"
        reference_section_type: ABSTRACT
