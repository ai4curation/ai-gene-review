knowledge_gaps:
- gap_statement: Which substrates dominate native flux in each lineage, given measured putrescine/DAP promiscuity,
    CAPA specialization and onward tetraamine capability?
  boundary: Comparative purified-enzyme kinetics now exist (PMID:37437886); native substrate competition, partner
    specificity and flux remain separate questions.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Prevents assigning a physiological pathway solely from a shared family or a permissive in vitro
    substrate.
  resolution: Compare putrescine, DAP and agmatine on the same enzymes, then measure native metabolite flux
    and genetic rescue.
- gap_statement: What explains the rise in spermidine after C. jejuni 81116 CASDH deletion, and does the NCTC
    11168 candidate perform the same chemistry?
  boundary: CASDC participation is established; native reliance on the assigned upstream dehydrogenase is not.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Identify the proposed bypass and directly assay the accession-matched upstream enzyme.
- gap_statement: Does the short 26695 HP_1507 sequence encode an active protein, and what is the correct sequence
    start relative to the NCTC 11637 structural construct?
  boundary: Close-strain structure and SIFTS mapping do not establish activity of the truncated reference product.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Resolve the coding start and assay the full native 26695 product before treating it as a confirmed
    pathway exemplar.
- gap_statement: Which carboxypolyamine does H. pylori 26695 HP_0020 decarboxylate?
  boundary: PMID:37878710 assays the upstream H. pylori CAPADH WP_000557673, not HP_0020/O24865.
    Agmatine preference of that dehydrogenase challenges a putrescine-route assignment but does not
    establish CAPA decarboxylase specificity for HP_0020. Inactive SpeE does not distinguish these routes.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Compare accession-matched HP_0020 activity on carboxyspermidine, carboxynorspermidine and
    CAPA, and establish the native upstream partner and pathway products.
