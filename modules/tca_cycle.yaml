id: MODULE:tca_cycle
title: Tricarboxylic acid cycle
description: >-
  A taxon-neutral module for the oxidative tricarboxylic acid (TCA) cycle,
  covering acetyl-CoA entry through citrate synthase, citrate/isocitrate
  interconversion by aconitase, oxidative decarboxylation of isocitrate to
  2-oxoglutarate and of 2-oxoglutarate to succinyl-CoA, substrate-level
  phosphorylation by succinyl-CoA ligase, succinate oxidation by respiratory
  complex II, fumarate hydration, and malate oxidation to regenerate
  oxaloacetate. The chemistry is conserved between bacteria, where the cycle
  runs in the cytoplasm and complex II sits in the plasma membrane, and
  eukaryotes, where it runs in the mitochondrial matrix and complex II sits in
  the inner mitochondrial membrane. The enzyme implementations differ at
  several steps: citrate synthase is a hexameric type II enzyme in many
  Gram-negative bacteria and a dimeric type I enzyme in mitochondria; the
  isocitrate step uses NADP-dependent isocitrate dehydrogenases in many
  bacteria but an allosterically regulated NAD-dependent hetero-oligomeric
  isocitrate dehydrogenase in eukaryotic mitochondria; the eukaryotic
  2-oxoglutarate dehydrogenase complex carries an extra adaptor subunit that
  recruits the E3 component; and malate can be oxidized by NAD-dependent
  malate dehydrogenase or by membrane-associated malate:quinone
  oxidoreductases. Paralogous isozymes in other compartments (peroxisomal or
  cytosolic citrate synthase, malate dehydrogenase and NADP-isocitrate
  dehydrogenase) serve the glyoxylate cycle, NADPH supply or redox shuttles
  rather than the oxidative cycle.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006099
    title: tricarboxylic acid cycle
    statement: >-
      GO represents the TCA cycle as the pathway that oxidizes acetyl-CoA to
      CO2 while generating reducing equivalents and regenerating oxaloacetate.
  - source_id: YeastPathways:TCA-EUK-PWY
    title: TCA cycle, aerobic respiration (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists the eight cycle reactions with CIT1/CIT2/CIT3, ACO1/ACO2,
      IDH1/IDH2, KGD1/KGD2/LPD1, LSC1/LSC2, SDH1-4 plus YJL045W, FUM1 and
      MDH1/MDH2/MDH3, and also includes pyruvate carboxylase (PYC1/PYC2).
      After review the oxidative-cycle catalysts retained here are CIT1 and
      CIT3, ACO1, IDH1/IDH2, KGD1/KGD2/LPD1 plus KGD4, LSC1/LSC2, SDH1-4, FUM1
      and MDH1. CIT2 and MDH3 are peroxisomal and MDH2 cytosolic (glyoxylate
      cycle and gluconeogenesis), ACO2 is a homocitrate dehydratase of lysine
      biosynthesis, and pyruvate carboxylase is an anaplerotic input modelled
      in pyruvate_metabolism.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TCA-EUK-PWY
  - source_id: YeastPathways:PWY-5084
    title: 2-oxoglutarate decarboxylation to succinyl-CoA (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc splits the 2-oxoglutarate dehydrogenase complex into its E1
      (KGD1), E2 (KGD2) and E3 (LPD1) half-reactions; this frame is the
      oxoglutarate_dehydrogenase_complex_step submodule here. The E3-recruiting
      subunit KGD4 is not listed by YeastCyc and was added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5084
  - source_id: YeastPathways:PWY3O-94
    title: superpathway of TCA cycle and glyoxylate cycle (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway frame combining the TCA cycle with the isocitrate lyase and
      malate synthase bypass. The TCA reactions are modelled here; the bypass
      is the separate glyoxylate_cycle module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-94
  - source_id: PMID:9140965
    title: The CIT3 gene of Saccharomyces cerevisiae encodes a second mitochondrial isoform of citrate synthase.
    statement: >-
      CIT3 encodes an active, mitochondrially imported citrate synthase that
      contributes to respiratory growth in a cit1 background.
  - source_id: PMID:2181273
    title: Citrate synthase encoded by the CIT2 gene of Saccharomyces cerevisiae is peroxisomal.
    statement: >-
      The major citrate synthase activity is mitochondrial (CIT1), whereas the
      CIT2 enzyme is peroxisomal and participates in the glyoxylate cycle.
  - source_id: PMID:15975908
    title: 'Yeast aconitase in two locations and two metabolic pathways: seeing small amounts is believing.'
    statement: >-
      Yeast Aco1 is distributed between mitochondria, where it functions in
      the TCA cycle, and the cytosol, where it functions in the glyoxylate
      shunt.
  - source_id: PMID:23106124
    title: The fungal α-aminoadipate pathway for lysine biosynthesis requires two enzymes of the aconitase family for the isomerization of homocitrate to homoisocitrate.
    statement: >-
      Yeast Aco1p is essential for the citric acid cycle, while Aco2p
      specifically and exclusively contributes to lysine biosynthesis as a
      homocitrate dehydratase; ACO2 is therefore not a TCA-cycle aconitase.
  - source_id: PMID:1939242
    title: NAD(+)-dependent isocitrate dehydrogenase. Cloning, nucleotide sequence, and disruption of the IDH2 gene from Saccharomyces cerevisiae.
    statement: >-
      IDH2 is essential for NAD-dependent isocitrate dehydrogenase activity
      and its loss abolishes growth on acetate, consistent with an essential
      role in the oxidative citric acid cycle.
  - source_id: PMID:1644826
    title: Cloning and characterization of the gene encoding the IDH1 subunit of NAD(+)-dependent isocitrate dehydrogenase from Saccharomyces cerevisiae.
    statement: >-
      IDH1 is also essential for a functional NAD-dependent isocitrate
      dehydrogenase; both subunits are required.
  - source_id: PMID:8369302
    title: 'Kinetic analysis of NAD(+)-isocitrate dehydrogenase with altered isocitrate binding sites: contribution of IDH1 and IDH2 subunits to regulation and catalysis.'
    statement: >-
      The octameric IDH1/IDH2 enzyme is AMP-activated; IDH1 acts as the
      regulatory subunit and IDH2 as the catalytic subunit.
  - source_id: PMID:8099357
    title: Function and expression of yeast mitochondrial NAD- and NADP-specific isocitrate dehydrogenases.
    statement: >-
      NAD-IDH is required for mitochondrial respiration with citrate, whereas
      the mitochondrial NADP-IDH (IDP1) does not participate in TCA-cycle based
      respiration despite its location.
  - source_id: PMID:15574419
    title: Kinetic properties and metabolic contributions of yeast mitochondrial and cytosolic NADP+-specific isocitrate dehydrogenases.
    statement: >-
      Metabolite measurements in mutants indicate that major cellular
      isocitrate flux is through NAD-IDH in glucose-grown cells, and through
      cytosolic IDP2 on nonfermentable carbon sources, so NADP-IDHs contribute
      2-oxoglutarate outside the mitochondrial cycle.
  - source_id: PMID:2503710
    title: Structure and regulation of KGD1, the structural gene for yeast alpha-ketoglutarate dehydrogenase.
    statement: >-
      KGD1 encodes the E1 component of the yeast 2-oxoglutarate
      dehydrogenase complex; its disruption abolishes complex activity.
  - source_id: PMID:2072900
    title: In vivo assembly of yeast mitochondrial alpha-ketoglutarate dehydrogenase complex.
    statement: >-
      KGD1 (E1), KGD2 (E2 core) and the shared E3 assemble into the
      mitochondrial 2-oxoglutarate dehydrogenase complex.
  - source_id: PMID:25165143
    title: The novel component Kgd4 recruits the E3 subunit to the mitochondrial α-ketoglutarate dehydrogenase.
    statement: >-
      Kgd4 (Ymr31/MRPS36) binds both the E1-E2 core and E3 and acts as a
      conserved molecular adaptor needed for a stable fungal and animal
      2-oxoglutarate dehydrogenase complex.
  - source_id: PMID:9874242
    title: Genes of succinyl-CoA ligase from Saccharomyces cerevisiae.
    statement: >-
      LSC1 (alpha) and LSC2 (beta) are both required for mitochondrial
      succinyl-CoA ligase activity, and the yeast enzyme uses ATP but not GTP.
  - source_id: PMID:11803020
    title: The Saccharomyces cerevisiae mitochondrial succinate:ubiquinone oxidoreductase.
    statement: >-
      Review of the four-subunit yeast complex II (SDH1-SDH4), structurally and
      catalytically similar to other succinate:quinone oxidoreductases.
  - source_id: PMID:11585823
    title: Mitochondrial and cytosolic isoforms of yeast fumarase are derivatives of a single translation product and have identical amino termini.
    statement: >-
      A single FUM1 translation product is distributed between mitochondria
      and cytosol; the mitochondrial pool is the TCA-cycle enzyme.
  - source_id: PMID:1986231
    title: 'Isolation, nucleotide sequence analysis, and disruption of the MDH2 gene from Saccharomyces cerevisiae: evidence for three isozymes of yeast malate dehydrogenase.'
    statement: >-
      Yeast has a mitochondrial (MDH1), a nonmitochondrial (MDH2) and a third
      malate dehydrogenase isozyme; MDH2 is needed for growth on acetate or
      ethanol, i.e. outside the mitochondrial cycle.
  - source_id: file:genes/PSEPK/gltA/gltA-ai-review.yaml
    title: PSEPK gltA gene review
    statement: >-
      PSEPK GltA is a curated citrate synthase and marks acetyl-CoA entry into
      the KT2440 TCA cycle.
  - source_id: file:genes/PSEPK/sdhA/sdhA-ai-review.yaml
    title: PSEPK sdhA gene review
    statement: >-
      PSEPK SdhA is curated as the catalytic flavoprotein subunit of succinate
      dehydrogenase, connecting the TCA cycle to the respiratory quinone pool.
  - source_id: file:genes/ECOLI/sucA/sucA-ai-review.yaml
    title: ECOLI sucA gene review
    statement: >-
      E. coli SucA grounds the 2-oxoglutarate dehydrogenase E1 role in the
      bacterial oxoglutarate dehydrogenase complex.
  - source_id: file:genes/ECOLI/sucB/sucB-ai-review.yaml
    title: ECOLI sucB gene review
    statement: >-
      E. coli SucB grounds the E2 succinyltransferase role in the bacterial
      oxoglutarate dehydrogenase complex.
  - source_id: file:genes/ECOLI/lpd/lpd-ai-review.yaml
    title: ECOLI lpd gene review
    statement: >-
      E. coli LpdA grounds the shared E3 dihydrolipoyl dehydrogenase role used
      by the bacterial oxoglutarate dehydrogenase complex.
  - source_id: file:genes/yeast/IDP1/IDP1-ai-review.yaml
    title: IDP1 gene review (S. cerevisiae)
    statement: >-
      The IDP1 review curates the mitochondrial NADP-IDH as an isocitrate
      metabolism and NADP enzyme distinct from the TCA-cycle NAD-IDH, which is
      why IDP1 is not a member of this module.
  - source_id: file:modules/tca_cycle-deep-research-openscientist.md
    title: OpenScientist module research for the TCA cycle
    statement: >-
      The generic module-level research supports the oxidative TCA-cycle
      boundary, including bacterial variants at fumarase and malate oxidation
      and treating pyruvate carboxylase as an anaplerotic input rather than a
      cyclic reaction.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__tca_cycle__ppu00020-deep-research-openscientist.md
    title: OpenScientist PSEPK/ppu00020 TCA-cycle research
    statement: >-
      The P. putida KT2440 pathway report concludes that the oxidative TCA
      cycle is satisfiable, with quinone-linked MQO as the primary malate
      oxidation branch and with scpC/prpC treated as methylcitrate or
      CoA-transferase boundary cases rather than core SCS/citrate synthase
      replacements.
notes: >-
  Reusable boundary: this module describes the oxidative TCA cycle and its
  immediate bacterial and eukaryotic alternatives, not every KEGG ppu00020 or
  YeastCyc neighbor. Pyruvate dehydrogenase supplies acetyl-CoA upstream and
  pyruvate carboxylase supplies an external anaplerotic oxaloacetate input
  (both in pyruvate_metabolism); the isocitrate lyase/malate synthase bypass is
  glyoxylate_cycle; methylcitrate/propionyl-CoA CoA-transferase proteins are
  adjacent propionate-metabolism context. The PSEPK instantiation is
  satisfiable with gltA/Q88FA4, acnB/Q88KF1 plus acnA-I/Q88L24, icd/Q88FS2
  plus idh/Q88FS1, sucA/Q88FA9-sucB/Q88FB0 with lpdG/Q88FB1 or related E3
  components, sucD/Q88FB3-sucC/Q88FB2, sdhABCD/Q88FA7-Q88FA8-Q88FA5-Q88FA6,
  fumarase paralogs including the class-I enzyme PP_0897/Q88PF3 and the
  class-II enzymes fumC/Q88M20 and fumC-I/Q88PA6, and malate oxidation by
  mqo1/Q88PU7, mqo2/Q88NF9, mqo3/Q88IS4, and/or mdh/Q88Q44.
  ALIGN (YeastPathways project, 2026-10): S. cerevisiae and S. pombe
  mitochondrial exemplars were added at every step, with two lineage variant
  sets (type II bacterial versus type I eukaryotic citrate synthase, which
  fall in different PANTHER families PTHR42871 and PTHR11739; NADP-IDH of
  bacteria versus the NAD-IDH IDH1/IDH2 hetero-octamer of mitochondria), an
  optional eukaryotic Kgd4 adaptor part in the 2-oxoglutarate dehydrogenase
  complex, and both plasma-membrane (bacterial) and inner-mitochondrial-membrane
  (eukaryotic) locations for complex II. PANTHER family ids were added only
  where every representative falls in the same family (verified against the
  UniProt PANTHER cross-references and interpro/panther/panther.obo); the
  aconitase, fumarase, SdhD/Sdh4 and malate dehydrogenase descriptors stay
  without an id because their bacterial and eukaryotic representatives fall in
  different families. YeastCyc corrections: ACO2 is removed from the aconitase
  step because Aco2p is a homocitrate dehydratase used only in lysine
  biosynthesis (PMID:23106124; consistent with lysine_biosynthesis_aminoadipate);
  CIT2 (peroxisomal), MDH2 (cytosolic) and MDH3 (peroxisomal) belong to the
  glyoxylate cycle and gluconeogenesis rather than the mitochondrial cycle;
  KGD4 was added as the E3-recruiting subunit of the 2-oxoglutarate
  dehydrogenase complex; the poorly characterized SDH1 paralog YJL045W
  (SDH1b/SDH9) and the SDH3/SDH4 paralogs SHH3 and SHH4 were not added as
  exemplars. The mitochondrial NADP-IDH IDP1 is not a TCA-cycle member: it
  does not support TCA-based respiration (PMID:8099357), and the major
  isocitrate flux on glucose is through NAD-IDH, while cytosolic IDP2
  carries it on nonfermentable carbon (PMID:15574419). GO-CAM disagreements:
  the YeastPathways TCA-EUK-PWY conversion enables MALATE-DEH-RXN by MAE1
  (malic enzyme) and MDH1 rather than by MDH1 alone, places both aconitase
  activities in the cytosol, enables CITSYN-RXN by CIT2 as well as CIT1/CIT3,
  includes pyruvate carboxylase, and types every activity as part of the
  generic aerobic respiration process; the PWY3O-94 superpathway conversion
  places all activities, including complex II, in the cytosol or plasma
  membrane. The PomBase model 665912ed00000015 types aco2 (Q9P7D4, which
  UniProt annotates as a homocitrate dehydratase-mitoribosomal bL21m fusion)
  as a TCA aconitase, places dld1 in pyruvate decarboxylation rather than the
  2-oxoglutarate dehydrogenase step, types sdh1 with succinate dehydrogenase
  (FAD) activity (GO:0160308) rather than the quinone-reducing complex
  activity, and includes NADP-IDH idp1, isocitrate lyase (SPBC1683.11c),
  glyoxylate reductase, fumarate reductase, oxaloacetate tautomerase,
  lipoylation and thiamine-pyrophosphate transport activities that lie
  outside this module.
module:
  id: tca_cycle
  label: Tricarboxylic acid cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: tricarboxylic acid cycle
      term:
        id: GO:0006099
        label: tricarboxylic acid cycle
      description: >-
        Oxidative central-carbon cycle from acetyl-CoA entry to regeneration of
        oxaloacetate through citrate, isocitrate, 2-oxoglutarate, succinyl-CoA,
        succinate, fumarate, and malate.
  gocam_associations:
    - model: gomodel:YeastPathways_TCA-EUK-PWY
      title: 'TCA cycle, aerobic respiration - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with complex-level enablers for NAD-IDH (CPX-558),
        2-oxoglutarate dehydrogenase (CPX-1293), succinyl-CoA ligase
        (CPX-1379) and complex II (CPX-565). MALATE-DEH-RXN is enabled by MAE1
        as well as MDH1, aconitase is placed in the cytosol, and pyruvate
        carboxylase is included.
    - model: gomodel:YeastPathways_PWY-5084
      title: '2-oxoglutarate decarboxylation to succinyl-CoA - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of the E1 (KGD1), E2 (KGD2) and E3 (LPD1) half-reactions,
        part of cellular respiration; KGD4 is absent.
    - model: gomodel:YeastPathways_PWY3O-94
      title: 'superpathway of TCA cycle and glyoxylate cycle - imported from: Saccharomyces Genome Database'
      description: >-
        SGD superpathway conversion; every activity is placed in the cytosol
        (complex II in the plasma membrane) and typed as part of the generic
        primary metabolic process. The isocitrate lyase and malate synthase
        activities belong to the glyoxylate_cycle module.
    - model: gomodel:665912ed00000015
      title: tricarboxylic acid cycle (GO:0006099)
      description: >-
        PomBase S. pombe model with mitochondrial cit1, aco1, aco2, idh1/idh2,
        kgd1/kgd2/kgd4/dld1, sca1/lsc2, sdh1-sdh4, fum1 and mdh1, plus idp1,
        isocitrate lyase, glyoxylate reductase, fumarate reductase (osm1),
        oxaloacetate tautomerase, lipoylation and transport activities outside
        this module.
  parts:
    - order: 1
      role: acetyl-CoA entry
      node:
        id: citrate_synthase_step
        label: Citrate synthase
        module_type: REACTION
        description: >-
          Acetyl-CoA + oxaloacetate + H2O -> citrate + CoA. Two non-orthologous
          citrate synthase families implement the step.
        variant_sets:
          - id: citrate_synthase_family_variants
            label: Citrate synthase family variants
            axis: enzyme family / lineage
            selection: ONE_OR_MORE
            variants:
              - id: type_ii_citrate_synthase_variant
                label: Type II (hexameric) bacterial citrate synthase
                module_type: REACTION
                annotons:
                  - id: citrate_synthase_activity
                    label: Type II citrate synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial type II citrate synthase family (GltA)
                        term:
                          id: PANTHER:PTHR42871
                          label: CITRATE SYNTHASE
                        representative_members:
                          - preferred_term: gltA (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FA4
                              label: Citrate synthase
                    function:
                      preferred_term: citrate synthase activity
                      term:
                        id: GO:0036440
                        label: citrate synthase activity
                      substrates:
                        - preferred_term: acetyl-CoA
                        - preferred_term: oxaloacetate
                        - preferred_term: H2O
                      products:
                        - preferred_term: citrate
                        - preferred_term: CoA
                    role_description: >-
                      Condenses acetyl-CoA and oxaloacetate to form citrate, the
                      committed entry step of the cycle, in Gram-negative
                      bacteria.
              - id: type_i_mitochondrial_citrate_synthase_variant
                label: Type I (dimeric) mitochondrial citrate synthase
                module_type: REACTION
                annotons:
                  - id: mitochondrial_citrate_synthase_activity
                    label: Mitochondrial citrate synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: eukaryotic type I citrate synthase family
                        term:
                          id: PANTHER:PTHR11739
                          label: CITRATE SYNTHASE
                        representative_members:
                          - preferred_term: CIT1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P00890
                              label: Citrate synthase, mitochondrial
                            description: Major mitochondrial citrate synthase.
                          - preferred_term: CIT3 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P43635
                              label: Citrate synthase 3, mitochondrial
                            description: >-
                              Minor second mitochondrial isoform; supports
                              respiratory growth in a cit1 background
                              (PMID:9140965).
                          - preferred_term: cit1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q10306
                              label: Probable citrate synthase, mitochondrial
                    function:
                      preferred_term: citrate synthase activity
                      term:
                        id: GO:0036440
                        label: citrate synthase activity
                      substrates:
                        - preferred_term: acetyl-CoA
                        - preferred_term: oxaloacetate
                        - preferred_term: H2O
                      products:
                        - preferred_term: citrate
                        - preferred_term: CoA
                    locations:
                      - preferred_term: mitochondrial matrix
                        term:
                          id: GO:0005759
                          label: mitochondrial matrix
                    role_description: >-
                      Mitochondrial matrix citrate synthase that condenses
                      acetyl-CoA from pyruvate dehydrogenase or fatty-acid
                      oxidation with oxaloacetate. The peroxisomal paralog of
                      the same family (yeast CIT2) belongs to the glyoxylate
                      cycle.
                    gocam_associations:
                      - model: gomodel:YeastPathways_TCA-EUK-PWY
                        activity: gomodel:CITSYN-RXN
                        title: 'TCA cycle, aerobic respiration - imported from: Saccharomyces Genome Database'
                        description: >-
                          CIT1, CIT2 and CIT3 each enable GO:0036440 in
                          mitochondrion; CIT2 is peroxisomal and is not a
                          member of this step.
                      - model: gomodel:665912ed00000015
                        activity: gomodel:665912ed00000015/665912ed00000016
                        title: tricarboxylic acid cycle (GO:0006099)
                        description: S. pombe cit1 enables GO:0036440 in the mitochondrial matrix.
    - order: 2
      role: citrate to isocitrate
      node:
        id: aconitate_hydratase_step
        label: Aconitate hydratase
        module_type: REACTION
        annotons:
          - id: aconitate_hydratase_activity
            label: Aconitase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: aconitate hydratase families (AcnA/mitochondrial-type and AcnB-type)
                representative_members:
                  - preferred_term: acnA-I (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88L24
                      label: Aconitate hydratase
                  - preferred_term: acnB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88KF1
                      label: Aconitate hydratase B
                  - preferred_term: ACO1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P19414
                      label: Aconitate hydratase, mitochondrial
                    description: >-
                      Mainly mitochondrial (TCA cycle) with a small cytosolic
                      pool that serves the glyoxylate shunt (PMID:15975908).
                  - preferred_term: aco1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O13966
                      label: Aconitate hydratase, mitochondrial
            function:
              preferred_term: aconitate hydratase activity
              term:
                id: GO:0003994
                label: aconitate hydratase activity
              substrates:
                - preferred_term: citrate
              products:
                - preferred_term: isocitrate
            role_description: >-
              Reversibly isomerizes citrate to isocitrate through
              cis-aconitate. Yeast ACO2 and S. pombe aco2 are aconitase-family
              homocitrate dehydratases of lysine biosynthesis, not TCA-cycle
              aconitases.
            gocam_associations:
              - model: gomodel:YeastPathways_TCA-EUK-PWY
                activity: gomodel:ACONITATEDEHYDR-RXN
                title: 'TCA cycle, aerobic respiration - imported from: Saccharomyces Genome Database'
                description: >-
                  ACO1 and ACO2 enable GO:0003994 (citrate dehydration) in
                  cytosol; ACO2 is excluded here (homocitrate dehydratase).
              - model: gomodel:YeastPathways_TCA-EUK-PWY
                activity: gomodel:ACONITATEHYDR-RXN
                title: 'TCA cycle, aerobic respiration - imported from: Saccharomyces Genome Database'
                description: ACO1 enables GO:0003994 (cis-aconitate hydration) in cytosol.
              - model: gomodel:665912ed00000015
                activity: gomodel:665912ed00000015/665912ed00000025
                title: tricarboxylic acid cycle (GO:0006099)
                description: S. pombe aco1 enables GO:0003994 in the mitochondrial matrix.
    - order: 3
      role: isocitrate oxidation
      node:
        id: isocitrate_dehydrogenase_step
        label: Isocitrate dehydrogenase
        module_type: REACTION
        description: >-
          Oxidative decarboxylation of isocitrate to 2-oxoglutarate, with NADP+
          in many bacteria and with NAD+ in eukaryotic mitochondria.
        variant_sets:
          - id: isocitrate_dehydrogenase_cofactor_variants
            label: Isocitrate dehydrogenase cofactor variants
            axis: cofactor specificity / lineage
            selection: ONE_OR_MORE
            variants:
              - id: nadp_isocitrate_dehydrogenase_variant
                label: Bacterial NADP-dependent isocitrate dehydrogenase
                module_type: REACTION
                annotons:
                  - id: isocitrate_dehydrogenase_nadp_activity
                    label: NADP-dependent isocitrate dehydrogenase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial NADP-dependent isocitrate dehydrogenase families (dimeric Icd and monomeric Idh)
                        representative_members:
                          - preferred_term: icd (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FS2
                              label: Isocitrate dehydrogenase [NADP]
                          - preferred_term: idh (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FS1
                              label: Isocitrate dehydrogenase [NADP]
                    function:
                      preferred_term: isocitrate dehydrogenase (NADP+) activity
                      term:
                        id: GO:0004450
                        label: isocitrate dehydrogenase (NADP+) activity
                      substrates:
                        - preferred_term: isocitrate
                        - preferred_term: NADP+
                      products:
                        - preferred_term: 2-oxoglutarate
                        - preferred_term: CO2
                        - preferred_term: NADPH
                    role_description: >-
                      Oxidatively decarboxylates isocitrate to 2-oxoglutarate
