id: MODULE:fungal_alpha_1_3_glucan_synthesis
title: Fungal cell wall alpha-1,3-glucan synthesis and remodeling
description: >-
  Alpha-1,3-glucan is a major cell wall polysaccharide in many ascomycetes
  and basidiomycetes. It is absent from Saccharomyces cerevisiae, but in
  Schizosaccharomyces pombe it is about a third of the wall glucan and is
  essential. It is made at the plasma membrane by Ags1-family synthases, very
  large multi-pass proteins with two probable catalytic regions. An
  intracellular GT5 (glycogen synthase-like) domain makes a short
  alpha-1,4-glucan primer. An extracellular GH13 (alpha-amylase-like) domain
  is proposed to join or remodel chains. The mature S. pombe polymer is two
  alpha-1,3-glucan chains of about 120 residues each, coupled through short
  alpha-1,4-linked segments. Separate GPI-anchored GH13 enzymes on the cell
  surface (Aah1 and Aah3 in S. pombe) are needed for normal chain assembly. By
  analogy to characterised Aspergillus homologs they are thought to be
  4-alpha-glucanotransferases, not hydrolases. In S. pombe, Ags1 makes
  alpha-glucan at growing tips and in the primary septum, alongside the
  beta-glucan synthase Bgs1, while sporulation-specific paralogs (Mok12,
  Mok13, Mok14) make the spore-envelope alpha-glucans. UDP-glucose supply, the
  Rho2-Pck2 signalling that controls Ags1, synthase trafficking, and
  alpha-glucan degradation (e.g. Agn1 during cell separation) are outside the
  module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0070600
    title: fungal-type cell wall (1->3)-alpha-glucan biosynthetic process
    statement: Module-level process concept.
  - source_id: PMID:9689051
    title: Identification of a putative alpha-glucan synthase essential for cell wall construction and morphogenesis in fission yeast.
    statement: Discovery of ags1 and of its two-catalytic-domain architecture.
    supporting_text: >-
      the predicted
      Ags1 protein consists of two probable catalytic domains for alpha-glucan
      assembly, namely an intracellular domain for alpha-glucan synthesis and an
      extracellular domain speculated to cross-link or remodel alpha-glucan.
  - source_id: PMID:40668835
    title: α-glucan remodeling by GH13-domain enzymes shapes fungal cell wall architecture.
    statement: >-
      Aah1 and Aah3 act redundantly with each other but not with Ags1. Both
      kinds of GH13 activity are needed for alpha-glucan chain assembly.
    supporting_text: >-
      Aah1 and Aah3 enzymes are not functionally redundant with Ags1, and cells require
      both types of GH13 domain enzymes to support α-glucan chain assembly
  - source_id: PMID:22891259
    title: Fission yeast Ags1 confers the essential septum strength needed for safe gradual cell abscission.
    statement: Ags1 alpha-glucan is a structural component of the primary septum, made alongside Bgs1.
    supporting_text: >-
      Ags1 synthesizes an α-glucan of the primary septum that is essential to confer it the
      mechanical strength
