  connections:
    - source: ags1_vegetative_variant
      target: alpha_glucan_chain_remodeling
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Aah1/Aah3 act on Ags1-made alpha-glucan. Aah3 overproduction cannot rescue
        ags1-664, and aah3 deletion interacts negatively with it (PMID:40668835).
  notes: >-
    NEW module (2026-11), built after reviewing S. pombe ags1 and aah3 and a
    consistency pass on aah1. It is the alpha-glucan counterpart of
    fungal_beta_1_3_glucan_synthesis. The two meet at the primary septum, where Ags1
    and Bgs1 co-immunoprecipitate, and the PomBase septum GO-CAM 6918f23700003787
    contains both. Boundary decisions:
    (1) Rho2-Pck2 controls Ags1 (PMID:11102532) but is a signalling input, not a
    holoenzyme subunit like Rho1 for the beta-glucan synthases, so it is outside.
    (2) Only Aah1/Aah3 are modelled for remodeling. aah2 and aah4 add nothing in
    vegetative growth, and the meiotic mde5 was not tested (PMID:40668835).
    (3) Ags1's own extracellular GH13 domain is described in the synthase annoton,
    not as a separate remodeling part, because its activity is unassayed.
    (4) The spore paralogs are a lightly grounded variant with Mok12 as exemplar.
    Mok13 and Mok14 are named but sit in different PANTHER subfamilies. Mok14 is
    smaller (1369 aa) and its exact role should be checked in a gene review.
knowledge_gaps:
  - gap_statement: >-
      None of the enzymes in this module has been assayed in vitro. Ags1 synthase
      activity, the activity of Ags1's extracellular GH13 domain, and the
      transglycosylation proposed for Aah1/Aah3 are all inferred, from mutant wall
      composition and from Aspergillus homologs. How the two alpha-1,3-glucan
      chains of the mature polymer are joined, and by which enzyme, is unknown.
    boundary: >-
      The genetics, the primer-synthesis requirement of the GT5 domain, and the
      solid-state NMR composition are established (PMID:17472966, PMID:40668835).
      Product analysis with purified enzymes is missing.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Decides whether chain coupling is done by the Ags1 GH13 domain, by Aah1/Aah3, or by
      both, which determines the correct molecular functions for all three proteins.
    resolution: Express the Ags1 extracellular GH13 domain and Aah3 (soluble, without the GPI anchor),
      test them on alpha-1,4 and alpha-1,3 oligosaccharides for transglycosylation and hydrolysis, and
      compare the alpha-glucan chain structure of ags1 GH13-domain point mutants with aah1 aah3
      mutants.
