id: MODULE:dmel_scf_slimb_ubiquitin_ligase
title: SCF-Slimb ubiquitin ligase in Drosophila melanogaster
description: >-
  SCF-Slimb is a cullin-RING E3 ubiquitin ligase in which the F-box protein Supernumerary
  limbs (Slimb, the beta-TrCP ortholog) recognizes phosphorylated degron motifs and the Cul1-Roc1a
  core transfers ubiquitin to the bound substrate. SkpA bridges the F-box of Slimb to Cul1.
  Slimb targets include Armadillo in Wingless signalling, Cubitus interruptus in Hedgehog
  signalling, the centriole duplication kinase Plk4 and the clock protein Period, so SCF-Slimb
  restrains several signalling pathways and centriole number.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000894
  title: 'FlyBase gene group SCF-SLMB: Scf-slmb ubiquitin ligase complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as scf-slmb ubiquitin ligase
    complex (SCF-SLMB); this module models that group.
- source_id: GO:0019005
  title: SCF ubiquitin ligase complex
  statement: >-
    GO term grounding the module as SCF ubiquitin ligase complex.
notes: >-
  Cul1, Roc1a and SkpA are shared with other SCF ligases; Slimb defines this module. Substrates
  and the kinases that create phosphodegrons are outside the module. FlyBase groups realized
  by this module: SCF-SLMB (FBgg0000894). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_scf_slimb_ubiquitin_ligase.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
