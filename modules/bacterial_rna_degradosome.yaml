id: MODULE:bacterial_rna_degradosome
title: Bacterial RNase E RNA degradosome
description: >-
  Reusable bacterial RNase E-centered RNA degradosome module. RNase E provides
  the scaffold and initiating endoribonuclease, RhlB unwinds structured RNA,
  and PNPase phosphorolytically degrades exposed RNA. Enolase is represented as
  a conserved structural participant, not as an RNA-processing enzyme.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006402
    title: mRNA catabolic process
    statement: Grounds the RNA-decay process implemented by the degradosome.
  - source_id: KEGG:ppu03018
    title: Pseudomonas putida KT2440 RNA degradation
    statement: Identifies the PSEPK RNase E, RhlB, PNPase, and enolase realization.
notes: >-
  The boundary is the canonical RNase E degradosome core and its coupled RNA
  degradation activities. PAP I, RppH, Hfq, RNase R, cold-shock helicases,
  polyphosphate enzymes, chaperones, RecQ, and Rho are adjacent RNA-metabolism
  or stress proteins and are not degradosome parts merely because they occur in
  KEGG ppu03018. Molecular functions are asserted only on activity leaves.
