id: MODULE:bacterial_rna_degradosome
title: Bacterial RNase E RNA degradosome
description: >-
  Reusable gammaproteobacterial RNase E-centered RNA degradosome module. RNase
  E provides the scaffold and initiating endoribonuclease, a recruited DEAD-box
  helicase can unwind structured RNA, and a 3'-to-5' exoribonuclease degrades
  exposed RNA. RhlB/PNPase and RhlE/RNase R are represented as lineage-variable
  implementations rather than a fixed universal composition.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006402
    title: mRNA catabolic process
    statement: Grounds the RNA-decay process implemented by the degradosome.
  - source_id: KEGG:ppu03018
    title: Pseudomonas putida KT2440 RNA degradation
    statement: Identifies candidate PSEPK RNA-decay proteins; complex membership requires independent evidence.
  - source_id: PMID:16275923
    title: RhlB helicase rather than enolase is the beta-subunit of the Escherichia coli polynucleotide phosphorylase (PNPase)-exoribonucleolytic complex
    statement: >-
      Biochemical and genetic evidence establishes direct RhlB-PNPase coupling
      during degradation of structured RNA and distinguishes that functional
      complex from enolase association.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_rna_degradosome__ppu03018-deep-research-openscientist.md
    title: OpenScientist PSEPK RNase E degradosome pathway review
    statement: >-
      The species-aware report supports RNase E while identifying unresolved
      helicase and exonuclease partner choices in KT2440.
  - source_id: PMID:40096066
    title: Critical functions and key interactions mediated by the RNase E scaffolding domain in Pseudomonas aeruginosa
    statement: Maps Pseudomonas RNase E scaffold interactions with RhlB and PNPase.
  - source_id: PMID:15705581
    title: Exoribonuclease R interacts with endoribonuclease E and an RNA helicase in the psychrotrophic bacterium Pseudomonas syringae Lz4W.
    statement: Establishes a same-genus RNase E-RhlE-RNase R degradosome variant.
notes: >-
  The boundary is an RNase E scaffold plus conditional helicase-assisted and
  exonuclease-mediated RNA decay. Exact partner composition varies across
  Gammaproteobacteria. RhlB and PNPase are candidates in KT2440, but RhlE-family
  helicases and RNase R are plausible alternatives, so the PSEPK realization is
  not asserted as resolved. Enolase is not included because its degradosome
  association has not been demonstrated in PSEPK. PAP I, RppH, Hfq,
  polyphosphate enzymes, chaperones, RecQ, and Rho are adjacent RNA-metabolism
  or stress proteins outside this boundary. Connections describe a conditional
  structured-RNA decay route, not an obligatory sequence for every substrate.
  Molecular functions are asserted only on activity leaves.
