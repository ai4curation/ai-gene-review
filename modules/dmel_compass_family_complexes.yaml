id: MODULE:dmel_compass_family_complexes
title: COMPASS-family histone H3K4 methyltransferase complexes in Drosophila melanogaster
description: >-
  Drosophila has three COMPASS-family complexes, each built around a different SET-domain
  histone H3 lysine 4 methyltransferase. Set1/COMPASS performs most bulk H3K4 di- and trimethylation,
  the Trithorax (Trx) complex maintains expression of Hox and other developmental genes against
  Polycomb silencing, and the Trithorax-related (Trr) complex monomethylates H3K4 at enhancers
  and carries the H3K27 demethylase Utx. All three share the WRAD core (Wds, Rbbp5, Ash2 and
  Dpy-30L1) that stimulates the methyltransferase. Trx is also found in TAC1, a complex with
  the CBP acetyltransferase Nejire and Sbf.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000313
  title: 'FlyBase gene group COMP-C: Compass-type complexes'
  statement: >-
    FlyBase release FB2026_03 groups 16 D. melanogaster genes as compass-type complexes (COMP-C);
    this module models that group.
- source_id: FB:FBgg0000316
  title: 'FlyBase gene group TAC1: Trithorax acetylation complex 1'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as trithorax acetylation complex
    1 (TAC1); this module models that group.
- source_id: GO:0035097
  title: histone methyltransferase complex
  statement: >-
    GO term grounding the module as histone methyltransferase complex.
notes: >-
  The FlyBase COMPASS-type subgroups are modelled as alternative complexes, so the shared
  WRAD subunits (wds, Rbbp5, ash2, Dpy-30L1) and Hcf appear in more than one. The Trx and
  Trr complexes are grounded to the GO terms for their mammalian counterparts (MLL1/2 and
  MLL3/4). TAC1 (a separate FlyBase group) is a distinct part because it shares Trx but not
  the WRAD core. FlyBase groups realized by this module: COMP-C (FBgg0000313), TAC1 (FBgg0000316).
  Subgroups folded into it: TRX-C, COMP, TRR. Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_compass_family_complexes.yaml; none of the member genes has a gene
  review yet unless noted.
