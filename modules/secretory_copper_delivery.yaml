id: MODULE:secretory_copper_delivery
title: Secretory-pathway copper delivery to cuproenzymes
description: >-
  A reusable motif for Cu(I) delivery from outside the cell to a cuproenzyme in
  the secretory pathway. Copper enters through a plasma-membrane copper
  transporter, is captured in the cytosol by an ATOX1-like copper chaperone, is
  handed to a P-type copper ATPase that pumps it across the trans-Golgi-network
  membrane, and becomes available to activate a lumenal or secreted
  copper-dependent enzyme. The human SOD3 GO-CAM is one realization: SLC31A1
  supplies cytosolic copper, ATOX1 delivers it to ATP7A, and ATP7A supports
  copper loading of extracellular SOD3.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: file:gocams/69ea894900001492/69ea894900001492-review.yaml
    title: ATOX1, ATP7A, SLC31A1, and SOD3 GO-CAM review
    statement: >-
      The reviewed GO-CAM places SLC31A1, ATOX1, ATP7A, and SOD3 in a compact
      human secretory-copper delivery chain, with a separate ATOX1
      transcriptional branch left outside this module.
  - source_id: PMID:15761197
    title: Role of antioxidant-1 in extracellular superoxide dismutase function and expression.
    statement: Human SOD3 activity depends on copper content and ATOX1 is required for full SOD3 activity.
    supporting_text: the specific activity of SOD3 directly correlates with its copper content
  - source_id: PMID:12029094
    title: Metallochaperone Atox1 transfers copper to the NH2-terminal domain of the Wilson's disease protein and regulates its catalytic activity.
    statement: ATOX1 transfers copper to ATP7B/WNDP metal-binding domains and stimulates full-length ATP7B.
    supporting_text: Atox1 transfers copper to the purified amino-terminal domain of WNDP
  - source_id: PMID:10419525
    title: Functional analysis of the N-terminal CXXC metal-binding motifs in the human Menkes copper-transporting P-type ATPase expressed in cultured mammalian cells.
    statement: Recombinant human ATP7A has copper-translocating P-type ATPase activity.
    supporting_text: copper-translocating activity of MNK and its copper-induced relocalization to the plasma membrane
  - source_id: PMID:27337370
    title: Multiple di-leucines in the ATP7A copper transporter are required for retrograde trafficking to the trans-Golgi network.
    statement: ATP7A normally cycles through the TGN, where it supplies secretory-pathway cuproenzymes.
    supporting_text: where it delivers copper to copper-dependent enzymes within the secretory pathway
  - source_id: PMID:23658018
    title: Rate and regulation of copper transport by human copper transporter 1 (hCTR1).
    statement: Human CTR1/SLC31A1 transports copper across the plasma membrane.
    supporting_text: estimated the rate of copper transport by the hCTR1 trimer in cultured cells
  - source_id: file:interpro/panther/PTHR46594/PTHR46594-paint.tsv
    title: PANTHER PTHR46594 PAINT assertions
    statement: >-
      PTN000642961 has PAINT IBD support for P-type monovalent copper
      transporter activity (GO:0140581) with human ATP7A and ATP7B among the
      seed proteins.
notes: >-
  The module deliberately models only the copper-trafficking branch of
  gomodel:69ea894900001492. The same GO-CAM also asserts a nuclear ATOX1
  transcriptional-activation activity that positively regulates SOD3 abundance;
  that is an indirect expression branch rather than a step in the cytosolic to
  secretory-pathway metal-delivery chain. SLC31A1 and ATOX1 are absent from the
  local reviewed gene set and from the local PANTHER member tables, so their
  roles are grounded as the concrete human UniProt proteins from the GO-CAM
  instead of generalized to guessed families.
