id: MODULE:dmel_histamine_metabolism
title: Histamine synthesis and recycling in Drosophila melanogaster
description: >-
  Histamine is the neurotransmitter of Drosophila photoreceptors and some central neurons.
  Histidine decarboxylase (Hdc) makes histamine from histidine, and LOVIT, a putative vesicular
  histamine transporter, maintains histamine in photoreceptor synaptic terminals. After release,
  histamine is taken up by surrounding epithelial glia, in part by the histamine-specific
  transporter HisT. In glia, Ebony conjugates histamine with beta-alanine to form carcinine
  (beta-alanyl-histamine), which returns to photoreceptors through the carcinine transporter
  CarT. Tan then hydrolyses carcinine, releasing histamine for reuse. This glia-photoreceptor
  recycling loop sustains visual transmission when de novo synthesis is limiting.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002224
  title: 'FlyBase gene group HISMET: Histamine metabolism'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as histamine metabolism (HISMET);
    this module models that group.
- source_id: GO:0001692
  title: histamine metabolic process
  statement: >-
    GO term grounding the module as histamine metabolic process.
- source_id: PMID:36288320
  title: Drosophila HisT is a specific histamine transporter that contributes to histamine
    recycling in glia.
  statement: >-
    Identifies HisT as a glial histamine-specific transporter that contributes to histamine
    recycling.
  supporting_text: >-
    we identified an epithelial glia-expressing transporter, HisT (Histamine Transporter),
    that specifically transports histamine into cells.
- source_id: PMID:31042461
  title: LOVIT Is a Putative Vesicular Histamine Transporter Required in Drosophila for Vision.
  statement: >-
    Identifies LOVIT on photoreceptor synaptic vesicles and shows it is needed for synaptic
    histamine.
  supporting_text: >-
    LOVIT is prominently expressed in photoreceptor synaptic vesicles and is required for
    Drosophila visual neurotransmission.
notes: >-
  Boundary. The module covers the six FlyBase members. Ebony and Tan also act in cuticle tanning
  (on dopamine rather than histamine) and appear in that module as well. Histamine receptors
  (HisCl1, ort) are downstream of the module. FlyBase groups realized by this module: HISMET
  (FBgg0002224). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_histamine_metabolism.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
