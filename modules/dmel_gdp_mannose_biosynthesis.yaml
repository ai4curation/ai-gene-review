id: MODULE:dmel_gdp_mannose_biosynthesis
title: GDP-mannose biosynthesis in Drosophila melanogaster
description: >-
  GDP-mannose is the mannose donor for N-glycan precursor assembly, GPI anchors and protein
  O-mannosylation (through dolichol-phosphate-mannose), and the precursor of GDP-fucose. It
  is made in the cytosol from hexose 6-phosphates. Hexokinases phosphorylate glucose or mannose;
  glucose 6-phosphate is isomerized to fructose 6-phosphate by glucose-6-phosphate isomerase
  (Pgi), and mannose-6-phosphate isomerase (Mpi) interconverts fructose 6-phosphate and mannose
  6-phosphate. Phosphomannomutase (Pmm2) converts mannose 6-phosphate to mannose 1-phosphate,
  and GDP-mannose pyrophosphorylase, formed by the catalytic subunit Gmppb and the regulatory
  subunit Gmppa, condenses mannose 1-phosphate with GTP to make GDP-mannose.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002055
  title: 'FlyBase gene group MANGPG: Gdp-mannose biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as gdp-mannose biosynthesis (MANGPG);
    this module models that group.
- source_id: GO:0009298
  title: GDP-mannose biosynthetic process
  statement: >-
    GO term grounding the module as GDP-mannose biosynthetic process.
notes: >-
  Boundary. The module covers the seven FlyBase members. Pgi and the hexokinases are shared
  with glycolysis and act in many pathways; they are included because FlyBase places them
  in this group. The Gmppa-Gmppb pyrophosphorylase is modelled as one complex. Hex-C has no
  UniProt entry in the FlyBase mapping and is grounded to its FlyBase gene id. Use of GDP-mannose
  for GDP-fucose synthesis is modelled in the GDP-fucose biosynthesis module. FlyBase groups
  realized by this module: MANGPG (FBgg0002055). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_gdp_mannose_biosynthesis.yaml; none of the member genes has a gene
  review yet unless noted.
