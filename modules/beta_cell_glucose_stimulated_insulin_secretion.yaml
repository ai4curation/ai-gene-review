id: MODULE:beta_cell_glucose_stimulated_insulin_secretion
title: Beta-cell glucose-stimulated insulin secretion (K-ATP triggering pathway)
description: >-
  The triggering pathway by which the pancreatic beta cell converts a rise in blood glucose into
  insulin release. Glucokinase phosphorylates glucose at a rate that tracks the physiological glucose
  range and so sets the threshold of the pathway; glycolytic and mitochondrial oxidation of the
  resulting glucose 6-phosphate raises the cytosolic ATP/ADP ratio; the rise in ATP/ADP closes the
  ATP-sensitive potassium (K-ATP) channel formed by the Kir6.2 pore and the SUR1 regulatory subunit;
  the loss of K+ efflux depolarises the plasma membrane, opening L-type voltage-gated calcium channels;
  and the Ca2+ influx triggers exocytosis of insulin-containing dense-core granules. Glutamate
  dehydrogenase couples amino-acid (leucine/glutamine) oxidation into the same ATP/ADP signal, and
  the mitochondrial enzyme HADH restrains glutamate dehydrogenase; gain of the first and loss of the
  second both produce hyperinsulinism.
status: DRAFT
evidence:
  - source_id: GO:0035773
    title: insulin secretion involved in cellular response to glucose stimulus
    statement: >-
      GO names the composite process this module decomposes: insulin secretion as part of the
      beta-cell response to glucose. This is the module boundary adopted here.
  - source_id: PMID:8132752
    title: Insulin secretory abnormalities in subjects with hyperglycemia due to glucokinase mutations.
    statement: >-
      "support a key role for the enzyme GCK in determining the in vivo glucose/ISR dose-response
      relationships" - human loss-of-function evidence that glucokinase sets the glucose threshold
      of the pathway.
  - source_id: PMID:7502040
    title: 'Reconstitution of IKATP: an inward rectifier subunit plus the sulfonylurea receptor.'
    statement: >-
      "The data indicate that these pancreatic beta cell potassium channels are a complex composed of
      at least two subunits--BIR, a member of the inward rectifier potassium channel family, and SUR,
      a member of the ATP-binding cassette superfamily." - the K-ATP step is a two-subunit channel.
  - source_id: PMID:8923010
    title: Mutation of the pancreatic islet inward rectifier Kir6.2 also leads to familial persistent
      hyperinsulinemic hypoglycemia of infancy.
    statement: >-
      "Closure of ATP-sensitive potassium channels in pancreatic islet beta-cells initiates a cascade
      of events that leads to insulin secretion." - the connection from channel closure to secretion.
  - source_id: PMID:23229155
    title: The human L-type calcium channel Cav1.3 regulates insulin release and polymorphisms in
      CACNA1D associate with type 2 diabetes.
    statement: >-
      "In FACS-enriched human beta cells, CACNA1D mRNA expression exceeded that of CACNA1C (which
      encodes Cav1.2) by approximately 60-fold" and "CACNA1D siRNA reduced glucose-stimulated insulin
      release in INS-1 832/13 cells and exocytosis in human beta cells." - CaV1.3 is the principal
      human beta-cell L-type channel; CaV1.2 is modelled as the alternative isoform.
notes: >-
  Scope: the K-ATP-dependent triggering pathway only. The K-ATP-independent amplifying pathway, incretin
  (GLP-1/GIP) and neural potentiation, insulin biosynthesis and prohormone processing (PCSK1/PCSK2/CPE),
  and the downstream actions of secreted insulin (modules/insulin_receptor_signaling.yaml) are outside
  the boundary.

  Steps described but not modelled as annotons, because no member has a reviewed gene record in this
  repository yet: beta-cell glucose uptake (GLUT2/SLC2A2 in rodents; GLUT1/SLC2A1 is the dominant human
  beta-cell glucose transporter), the glycolytic and mitochondrial machinery that converts glucose
  6-phosphate into ATP (pyruvate carboxylase, the TCA cycle and oxidative phosphorylation), and the
  granule exocytosis machinery (SNAP25, syntaxin-1A, synaptotagmin-7 and VAMP2). These should be
  added as annotons once those genes are reviewed; the mitochondrial ATP step is represented here as
  a connection description rather than a part.

  Grounding: participants are grounded as human UniProt gene products whose ai-gene-review core
  functions supply the molecular-function and location terms. No PANTHER family or PAINT ancestral node
  is asserted: the module is deliberately a concrete human instance, and family ids were not
  established for every member, so they are omitted rather than guessed. The ABCC8 review is COMPLETE
  as of this change; its five Ensembl-projected rows, which are unrelated to the channel function used
  here, are resolved. The CACNA1C review is still DRAFT at the time of writing.

  Disease mapping: loss of K-ATP function (ABCC8, KCNJ11), gain of glucokinase function (GCK),
  gain of glutamate dehydrogenase function (GLUD1) and loss of HADH all cause congenital hyperinsulinism;
  K-ATP gain of function and glucokinase loss of function cause neonatal diabetes and GCK-MODY.

  Other congenital hyperinsulinism genes deliberately not modelled as parts: SLC16A1 (MCT1) and HK1 are
  beta-cell "disallowed" genes, silenced in normal beta cells; their hyperinsulinism is caused by
  ectopic de-repression (a disease state), so neither acts in the normal pathway. HNF4A and HNF1A are
  transcription factors that sustain the beta-cell gene program and act upstream of, not within, the
  triggering pathway. UCP2 restrains glucose-driven mitochondrial ATP generation by exporting C4
  metabolites from the matrix, but its role in human beta-cell secretion is disputed, so it is left out
  until better grounded.
module:
  id: beta_cell_glucose_stimulated_insulin_secretion
  label: Beta-cell glucose-stimulated insulin secretion
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: insulin secretion involved in cellular response to glucose stimulus
      term:
        id: GO:0035773
        label: insulin secretion involved in cellular response to glucose stimulus
      description: >-
        The composite process decomposed into glucose sensing, K-ATP channel closure, calcium entry
        and insulin release.
  context:
    taxa:
      - preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cell_types:
      - preferred_term: pancreatic beta cell
        term:
          id: CL:0000169
          label: type B pancreatic cell
  parts:
    - order: 1
      role: glucose sensing by glucokinase
      node:
        id: glucose_sensing
        label: Glucokinase glucose phosphorylation (glucose sensor)
        module_type: REACTION
        description: >-
          Glucokinase, with its low glucose affinity, cooperative kinetics and lack of product
          inhibition, phosphorylates glucose at a rate proportional to the plasma glucose concentration
          and so controls glycolytic flux and the glucose threshold for secretion.
        concepts:
          - preferred_term: glucokinase activity
            term:
              id: GO:0004340
              label: glucokinase activity
        annotons:
          - id: gck_glucose_sensor
            label: Glucokinase (hexokinase-4)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GCK
                term:
                  id: UniProtKB:P35557
                  label: Hexokinase-4
            function:
              preferred_term: glucokinase activity
              term:
                id: GO:0004340
                label: glucokinase activity
            processes:
              - preferred_term: glycolytic process
                term:
                  id: GO:0006096
                  label: glycolytic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Rate-setting glucose sensor of the beta cell; its activity determines how fast glucose
              carbon reaches the mitochondria and therefore the ATP/ADP ratio.
            evidence:
              - source_id: PMID:8132752
                statement: >-
                  "the dose-response curve relating glucose and ISR obtained during graded intravenous
                  glucose infusions was shifted to the right in the subjects with GCK mutations"
    - order: 2
      role: K-ATP channel closure
      node:
        id: katp_channel_closure
        label: ATP-sensitive potassium channel closure
        module_type: PROTEIN_COMPLEX
        description: >-
          The octameric K-ATP channel (four Kir6.2 pore subunits, four SUR1 regulatory subunits)
          holds the resting beta cell hyperpolarised. ATP binding to Kir6.2 closes the pore, while
          Mg-ADP acting on the SUR1 nucleotide-binding domains opposes closure, so the channel reads
          the cytosolic ATP/ADP ratio.
        concepts:
          - preferred_term: inward rectifying potassium channel
            term:
              id: GO:0008282
              label: inward rectifying potassium channel
        annotons:
          - id: kcnj11_katp_pore
            label: Kir6.2 pore subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KCNJ11
                term:
                  id: UniProtKB:Q14654
                  label: ATP-sensitive inward rectifier potassium channel 11
            function:
              preferred_term: ATP-activated inward rectifier potassium channel activity
              term:
                id: GO:0015272
                label: ATP-activated inward rectifier potassium channel activity
            processes:
              - preferred_term: potassium ion transmembrane transport
                term:
                  id: GO:0071805
                  label: potassium ion transmembrane transport
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: K+-selective pore that is closed by ATP when glucose metabolism rises.
            evidence:
              - source_id: PMID:8923010
                statement: >-
                  "Kir6.2 is necessary, although not sufficient, for normal regulation of insulin
                  release."
          - id: abcc8_katp_regulator
            label: SUR1 regulatory subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ABCC8
                term:
                  id: UniProtKB:Q09428
                  label: ATP-binding cassette sub-family C member 8
            function:
              preferred_term: potassium channel regulator activity
              term:
                id: GO:0015459
                label: potassium channel regulator activity
            processes:
              - preferred_term: regulation of insulin secretion
                term:
                  id: GO:0050796
                  label: regulation of insulin secretion
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Nucleotide-sensing regulatory subunit that confers Mg-ADP activation, sulfonylurea
              inhibition and diazoxide activation on the Kir6.2 pore.
            evidence:
              - source_id: PMID:29286281
                statement: >-
                  "These structures support the role of SUR1 as an ADP sensor and highlight the lasso
                  extension as a key regulatory element in ADP's ability to override ATP inhibition."
    - order: 3
      role: depolarisation-triggered calcium entry
      node:
        id: ltype_calcium_entry
        label: L-type voltage-gated calcium entry
        module_type: TRANSPORT_STEP
        description: >-
          Membrane depolarisation after K-ATP closure opens L-type voltage-gated calcium channels;
          the resulting Ca2+ influx is the trigger for granule exocytosis. In human beta cells CaV1.3
          (CACNA1D) predominates, while CaV1.2 (CACNA1C) is the major isoform in rodent beta cells.
        concepts:
          - preferred_term: calcium ion import across plasma membrane
            term:
              id: GO:0098703
              label: calcium ion import across plasma membrane
        annotons:
          - id: cacna1d_cav13
            label: CaV1.3 alpha-1D pore subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CACNA1D
                term:
                  id: UniProtKB:Q01668
                  label: Voltage-dependent L-type calcium channel subunit alpha-1D
            function:
              preferred_term: high voltage-gated calcium channel activity
              term:
                id: GO:0008331
                label: high voltage-gated calcium channel activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Principal human beta-cell L-type channel mediating depolarisation-evoked
              Ca2+ entry.
            evidence:
              - source_id: PMID:23229155
                statement: >-
                  "CACNA1D siRNA reduced glucose-stimulated insulin release in INS-1 832/13 cells and
                  exocytosis in human beta cells."
          - id: cacna1c_cav12
            label: CaV1.2 alpha-1C pore subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CACNA1C
                term:
                  id: UniProtKB:Q13936
                  label: Voltage-dependent L-type calcium channel subunit alpha-1C
            function:
              preferred_term: high voltage-gated calcium channel activity
              term:
                id: GO:0008331
                label: high voltage-gated calcium channel activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Alternative L-type pore subunit; the dominant beta-cell isoform in rodents and a minor one
              in human beta cells.
            evidence:
              - source_id: PMID:23229155
                statement: >-
                  "In FACS-enriched human beta cells, CACNA1D mRNA expression exceeded that of CACNA1C
                  (which encodes Cav1.2) by approximately 60-fold"
    - order: 4
      role: insulin release
      node:
        id: insulin_release
        label: Insulin release
        module_type: TRANSPORT_STEP
        description: >-
          Ca2+ influx triggers fusion of dense-core secretory granules with the plasma membrane,
          releasing mature insulin into the extracellular space. Only the secreted cargo is modelled;
          the exocytosis machinery is listed in the notes.
        concepts:
          - preferred_term: insulin secretion
            term:
              id: GO:0030073
              label: insulin secretion
        annotons:
          - id: ins_hormone
            label: Insulin
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INS
                term:
                  id: UniProtKB:P01308
                  label: Insulin
            function:
              preferred_term: insulin receptor binding
              term:
                id: GO:0005158
                label: insulin receptor binding
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: Secreted output of the module; acts on the insulin receptor in target
              tissues.
            evidence:
              - source_id: PMID:8923010
                statement: >-
                  "Closure of ATP-sensitive potassium channels in pancreatic islet beta-cells initiates
                  a cascade of events that leads to insulin secretion."
    - order: 5
      role: amino-acid coupling and its brake (modifiers)
      node:
        id: gdh_amino_acid_coupling
        label: Glutamate dehydrogenase coupling of amino-acid oxidation, restrained by HADH
        module_type: REGULATORY_STEP
        description: >-
          Glutamate dehydrogenase converts glutamate to alpha-ketoglutarate in the mitochondrial
          matrix, feeding the TCA cycle and raising ATP; it is allosterically activated by leucine and
          ADP and inhibited by GTP. HADH (SCHAD) binds and inhibits glutamate dehydrogenase in beta
          cells. These are modifiers of the triggering pathway rather than steps of it.
        concepts:
          - preferred_term: regulation of insulin secretion
            term:
              id: GO:0050796
              label: regulation of insulin secretion
        annotons:
          - id: glud1_gdh
            label: Glutamate dehydrogenase 1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GLUD1
                term:
                  id: UniProtKB:P00367
                  label: Glutamate dehydrogenase 1, mitochondrial
            function:
              preferred_term: L-glutamate dehydrogenase [NAD(P)+] activity
              term:
                id: GO:0004353
                label: L-glutamate dehydrogenase [NAD(P)+] activity
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Converts glutamate to alpha-ketoglutarate for oxidation; loss of GTP inhibition makes it
              overactive and causes the hyperinsulinism-hyperammonemia syndrome.
            evidence:
              - source_id: PMID:9571255
                statement: >-
                  "glutamate dehydrogenase, which oxidizes glutamate to alpha-ketoglutarate and which is
                  a potential regulator of insulin secretion in pancreatic beta cells"
          - id: hadh_gdh_brake
            label: HADH (SCHAD) inhibitory regulator of GDH
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HADH
                term:
                  id: UniProtKB:Q16836
                  label: Hydroxyacyl-coenzyme A dehydrogenase, mitochondrial
            function:
              preferred_term: enzyme inhibitor activity
              term:
                id: GO:0004857
                label: enzyme inhibitor activity
            processes:
              - preferred_term: negative regulation of insulin secretion
                term:
                  id: GO:0046676
                  label: negative regulation of insulin secretion
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Binds glutamate dehydrogenase and restrains its activity; HADH loss causes
              protein-sensitive hyperinsulinism independently of its fatty-acid oxidation role.
            evidence:
              - source_id: PMID:20670938
                statement: >-
                  "These studies indicate that SCHAD deficiency causes hyperinsulinism by activation of
                  GDH via loss of inhibitory regulation of GDH by SCHAD."
  connections:
    - source: glucose_sensing
      target: katp_channel_closure
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Glucose 6-phosphate formed by glucokinase is oxidised through glycolysis and mitochondrial
        metabolism (not modelled as parts); the resulting rise in the ATP/ADP ratio closes K-ATP
        channels.
    - source: katp_channel_closure
      target: ltype_calcium_entry
      connection_type: CAUSES
      description: Loss of K+ efflux depolarises the membrane, opening L-type calcium channels.
    - source: ltype_calcium_entry
      target: insulin_release
      connection_type: POSITIVELY_REGULATES
      description: Ca2+ influx triggers insulin granule exocytosis.
    - source: gdh_amino_acid_coupling
      target: katp_channel_closure
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Alpha-ketoglutarate from glutamate oxidation adds to the mitochondrial ATP output, so
        glutamate dehydrogenase activity feeds the same ATP/ADP signal; HADH restrains it.
