                term:
                  id: GO:0000785
                  label: chromatin
            role_description: >-
              The H2A deubiquitinase activity belongs to the complex, with BAP1 as the catalytic
              unit. BAP1 carries histone H2A deubiquitinase activity by IMP (PMID:25451922) and
              as the core function of its gene review, and PR-DUB membership by IDA and IPI
              (PMID:20436459, PMID:25451922); ASXL1 carries PR-DUB membership by IDA
              (PMID:20436459). The ASXL units take deubiquitinase activator activity, the core
              function of each of their gene reviews; human GOA has no experimental
              molecular-function row for this on any ASXL protein. The process term is the
              BAP1 gene review's: the consequence is locus-dependent, and in human isogenic
              lines the complex promotes transcription of developmental genes by opposing PRC1
              rather than acting in Polycomb silencing (PMID:30664650), whereas at FOXK2 targets
