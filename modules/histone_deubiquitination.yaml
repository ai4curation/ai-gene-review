id: MODULE:histone_deubiquitination
title: Human histone deubiquitination — the ATXN7L3-ENY2 deubiquitination modules (SAGA DUBm with USP22 and ATXN7, and the SAGA-independent USP27X and USP51 modules) removing H2BK120ub1, the BAP1-ASXL Polycomb repressive deubiquitinase (PR-DUB) and USP16 removing the PRC1 mark H2AK119ub1, and the further H2A deubiquitinases MYSM1 (2A-DUB) and USP3
description: >-
  Monoubiquitin on histone H2B lysine 120 (H2BK120ub1) and on histone H2A lysine 119
  (H2AK119ub1) are the two abundant histone ubiquitin marks of mammalian chromatin, and each is
  removed by dedicated deubiquitinases. H2BK120ub1, which accompanies transcription, is erased
  mainly by small deubiquitination modules built around two adaptor proteins, ATXN7L3 and
  ENY2. In the SAGA coactivator the ubiquitin-specific protease USP22 is the catalytic subunit
  of the deubiquitination module (DUBm), which ATXN7 anchors to the rest of SAGA; the related
  proteases USP27X and USP51 form equivalent modules with ATXN7L3 and ENY2 outside SAGA and
  compete with USP22 for the adaptors. None of the three proteases is active alone. The
  Polycomb mark H2AK119ub1, deposited by the RING1A/B ligases of PRC1, is removed by the
  Polycomb repressive deubiquitinase (PR-DUB), in which the ubiquitin C-terminal hydrolase BAP1
  is activated by the DEUBAD domain of ASXL1, ASXL2 or ASXL3. PR-DUB is specific for K119 and
  keeps active genes from PRC1-mediated silencing. USP16 (Ubp-M) is a nucleosome-preferring
  H2A deubiquitinase that removes H2AK119ub1 before mitosis, a prerequisite for histone H3
  serine 10 phosphorylation and chromosome segregation, and that also reverses silencing near
  DNA breaks. The JAMM metalloprotease MYSM1 (2A-DUB), with PCAF, removes H2A ubiquitin during
  activation of androgen receptor target genes, and USP3 removes ubiquitin from both H2A and
  H2B during S phase and the DNA damage response.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates nine human deubiquitinase genes to this pathway, all TAS to the review
      PMID:24647359: USP3, USP12, USP16, USP21, USP22, USP44, BAP1, BRCC3 and MYSM1. Its diagram
      draws "Kdeubiquitinases" acting on ubiquitinlysine. This module realises the
      deubiquitinase part of the pathway, the last histone modification set left after the
      split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. Id and label
      checked against .cache/rgd_pw/pw.obo.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD names the histone deubiquitinases as five USPs, BAP1 and the metalloproteases MYSM1 and BRCC36.
    supporting_text: ubiquitin C-terminal hydrolase BAP1 and metalloproteases MYSM1 and BRCC36
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted histone deubiquitination and its
      H2A and H2B children (each "obsoleted because it represents a molecular function"). As in
      the sibling histone_lysine_demethylation, the module process is therefore chromatin
      remodeling, which human GOA attaches to MYSM1 by IMP and IBA and to USP22 and USP16 by
      IEA; the histone- and site-specific chemistry is carried by the deubiquitinase activities
      on the annotons.
  - source_id: PMID:24647359
    title: 'H2A-DUBbing the mammalian epigenome: expanding frontiers for histone H2A deubiquitinating enzymes in cell biology and physiology.'
    statement: RGD's source for the deubiquitinase gene list, a review of mammalian H2A deubiquitinases.
    supporting_text: Histone H2A deubiquitinases (H2A-DUBs) are a group of structurally diverse enzymes that catalyze the removal ubiquitin from histone H2A.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project, as the tranche 15 follow-up that completes the
  histone modification set: the sibling modules histone_acetyltransferase_complexes and
  polycomb_repressive_complexes each named the deubiquitinases as left out (USP22 as the one
  RGD histone gene without a module; BAP1 and USP16 as a candidate H2A deubiquitination
  module; projects/RGD_PATHWAY_ONTOLOGY.md). PW:0001338 is the only PW evidence source: its
  diagram node "Kdeubiquitinases" links only to an RGD web page and it has no PW child for
  deubiquitination. RGD annotates nine human deubiquitinase genes to PW:0001338 (from
  .cache/rgd_pw/homo_genes_pw, all TAS to PMID:24647359). Five are modelled: USP22 (part 1),
  BAP1 (part 2), USP16 (part 3), MYSM1 and USP3 (optional part 4). Four are excluded, for the
  reasons in (6). Added from outside the RGD list, each with cited human evidence: ATXN7L3,
  ENY2 and ATXN7 (SAGA DUBm; PMID:18206972, PMID:15115762, with experimental human GOA SAGA or
  DUBm membership for ATXN7L3 and ENY2), USP27X and USP51 (SAGA-independent modules;
  PMID:27132940), and ASXL1, ASXL2 and ASXL3 (PR-DUB; PMID:20436459, PMID:26739236,
  PMID:26416890; each has a gene review with PR-DUB as its complex). UniProt accessions and
  recommended names are from the repository's UniProt files (ATXN7, BAP1, ASXL1, ASXL2, ASXL3)
  or UniProt REST (November 2026). Molecular functions are from each protein's experimental
  human GOA rows in QuickGO (November 2026) or its gene review core function. Curator-authored
  functions, not backed by an experimental GOA row or a gene review core function: histone H2B
  deubiquitinase activity on the USP27X and USP51 module annotons, and deubiquitinase activator
  activity on ATXN7L3 and ENY2, from PMID:27601583 and the reconstitution in PMID:27132940. The ASXL activator
  function comes from their gene reviews and has no experimental GOA row.

  GO process. GO has obsoleted histone deubiquitination, monoubiquitinated histone
  deubiquitination, monoubiquitinated histone H2A deubiquitination, histone H2B conserved
  C-terminal lysine deubiquitination and histone H2A K63-linked deubiquitination, each because
  it represents a molecular function, and the regulation terms for the process with them. The
  content now lives in the histone deubiquitinase activity terms (histone H2A deubiquitinase
  activity, histone H2B deubiquitinase activity and its K120 child) on the annotons. As in the
  sibling histone_lysine_demethylation, the module process is GO:0006338 chromatin remodeling,
  a neutral choice because H2B deubiquitination accompanies activation while H2A
  deubiquitination can activate or repress according to the locus. No new process term is
  requested.

  Boundary and modelling decisions. (1) Parts by mark and machine. Part 1 removes H2BK120ub1,
  parts 2 to 4 remove H2A ubiquitin. (2) The ATXN7L3-ENY2 modules are one part with three
  variants (ONE_OR_MORE, since they coexist and compete for the adaptors), each a complex
  annoton carrying the H2B deubiquitinase activity with the USP as the catalytic unit, because
  none of the three USPs is active alone (PMID:27132940). ATXN7L3 and ENY2 therefore appear as
  units in all three variants. Only the USP22 module is SAGA's DUBm; ATXN7 is its SAGA anchor
  and is absent from the USP27X and USP51 modules. The SAGA HAT module is modelled in
  histone_acetyltransferase_complexes, and the SAGA structural core, TRRAP and the splicing
  subunits are named there and not here; this module models the DUBm, not SAGA as a whole.
  ENY2 is also in TREX-2 (mRNA export), and the cytoplasmic paralogue ATXN7L3B competes for
  ENY2 (PMID:27601583); these are outside the module.
  (3) PR-DUB is one complex annoton with BAP1 as catalytic unit and ASXL1, ASXL2 and ASXL3 as
  alternative activator units, listed as units with their alternatives in the role text, as in
  mediator_complex and polycomb_repressive_complexes, rather than as a variant set: they bind
  the same BAP1 surface and are mutually exclusive in one complex, but redundant within cells
  (PMID:30664650). (4) BAP1-associated factors are not units. FOXK1, FOXK2, HCFC1, OGT, KDM1B,
  MBD5, MBD6 and YY1 were the optional candidates. In human cells the BAP1-ASXL core
  (BAP1.com) engages FOXK1/2, HCFC1 and KDM1B transiently; size exclusion shows that their
  co-elution with BAP1 does not reflect a stable complex, and KDM1B associates only with
  BAP1-ASXL2 (PMID:30664650). FOXK2 recruits BAP1 to its targets and BAP1 bridges FOXK2 to
  HCF-1 (PMID:25451922); YY1 and HCF-1 form a ternary complex with BAP1 at specific promoters
  (PMID:20805357). These are recruitment and substrate relationships (HCFC1 and OGT are also
  BAP1 substrates), not stable subunits, so they are named here only. (5) USP16 and the
  optional enzymes are gene-product annotons because each was assayed as an isolated enzyme or
  acts without a dedicated stable complex. MYSM1 and USP3 form an optional part: both are on
  the RGD list with experimental human H2A deubiquitinase rows, but each acts in a restricted
  context (androgen receptor target genes; S phase and DNA damage) and neither is shown to be
  a general eraser of the PRC1 mark. (6) Excluded RGD genes. USP12, USP21 and USP44 have no
  experimental human histone deubiquitinase row (their human rows are cysteine-type
  deubiquitinase activity on other substrates), so they are not modelled here. The USP21 gene review gives it no histone function. BRCC3 (BRCC36) is
  excluded because its experimental rows are Lys63-specific deubiquitinase activity in the
  BRCA1-A and BRISC complexes, removing polyubiquitin chains at DNA double-strand breaks
  rather than the H2A or H2B monoubiquitin marks; GO has obsoleted the process it was
  annotated to (histone H2A K63-linked deubiquitination), and it belongs with a DNA damage
  ubiquitin signalling module. (7) Not on the RGD list and not added: USP7 and other proteases
  with occasional histone reports, and USP51's H2AK13/15ub activity beyond its unit function
  (it is part of the DNA damage response, like BRCC3). (8) Writers and connections. The
  H2AK119ub1 writer PRC1 is included by reference as an optional context part, with
  PROVIDES_INPUT_FOR edges to PR-DUB and USP16; NEGATIVELY_REGULATES was considered and not
  used because these enzymes erase PRC1's product rather than inhibit the ligase. The
  H2BK120ub1 writer RNF20-RNF40 has no module in this repository and is not added; the H3K4
  methylation that depends on H2Bub1 is in compass_family_h3k4_methylation. (9) Substrates.
  Histones and nucleosomes are substrates, not participants. No Rhea reaction or ChEBI
  participant is grounded: the deubiquitinase activities have no Rhea cross-reference and are
  protein-protein isopeptide hydrolyses, as for the PRC1 ligase in
  polycomb_repressive_complexes. (10) Out of scope: deubiquitination of non-histone substrates
  by the same enzymes (USP22 on cyclin B1, KPNA2 and others; BAP1 on HCFC1 and ITPR3; USP16 on
  RPS27A; USP27X and USP51 on cytoplasmic and DNA damage proteins), and the regulation of the
  enzymes themselves.

  GO-CAM links. gocams/index.tsv (November 2026) has human production models with three
  members. gomodel:69c59f8a00000219 (CDKN1A induction via PCAF-SAGA, the
  seed's best_gocam) has USP22 as part of the SAGA complex with deubiquitinase activity, but
  its evidence, PMID:21779003, shows USP22 deubiquitinating the transcriptional regulator FBP1
  at the p21 gene, a non-histone substrate; it is therefore not pinned to the H2B annoton,
  and the sibling histone_acetyltransferase_complexes likewise left it unpinned. gomodel:62b4ffe300004589 (USP22 activation of IRF3 via KPNA2 stabilization) and
  gomodel:657ba49f00001888 (CDK1-mediated deubiquitination of CCNB1 by USP22) use USP22 on
  non-histone substrates, and gomodel:65a1f4f800000673 (USP51 in DNA damage response via DGCR8
  deubiquitination) uses USP51 on a non-histone substrate; none is linked. No production model
  contains ATXN7L3, ENY2, ATXN7, USP27X, BAP1, an ASXL protein, USP16, MYSM1 or USP3. PANTHER
  family ids and PTNs are deliberately not asserted.

  Possible upstream issues (queries only). (a) GO has a site-specific term for the PRC1 writer
  (histone H2AK119 ubiquitin ligase activity) and for the H2B eraser (the K120 child of
  histone H2B deubiquitinase activity) but none for the H2AK119 eraser; the request is in
  proposed_new_terms. (b) The GO:0071819 DUBm complex definition names only the S. cerevisiae
  subunits, although human ATXN7L3 and ENY2 carry IDA rows for it; a broader definition naming
  the metazoan subunits would help, but this is not entered as a formal request because the
  definition is not wrong. (c) ATXN7 has no experimental human GOA row for SAGA membership
  although PMID:15115762 shows it is an integral subunit; a curation gap, recorded here only.
proposed_new_terms:
  - proposed_name: histone H2AK119 deubiquitinase activity
    proposed_definition: >-
      A histone H2A deubiquitinase activity that cleaves ubiquitin from the lysine-119 residue of
      a histone H2A protein to which it is conjugated.
    justification: >-
      H2AK119 monoubiquitination by PRC1 has its own GO term (histone H2AK119 ubiquitin ligase
      activity, a child of histone H2A ubiquitin ligase activity), and the H2B mark has a
      site-specific eraser term (histone H2B conserved C-terminal lysine deubiquitinase
      activity), but the eraser of H2AK119ub1 can only be annotated to the general histone H2A
      deubiquitinase activity. The site matters biologically: PR-DUB removes H2AK119ub1 but
      cannot remove the RNF168 DNA damage mark H2AK13/15ub, which USP51 removes, so the general
      term merges two distinct activities. BAP1 (PR-DUB) and USP16 would be the first
      annotations.
    proposed_parent:
      id: GO:0140950
      label: histone H2A deubiquitinase activity
    supported_by:
      - reference_id: PMID:26416890
        supporting_text: BAP1 catalyzes ubiquitin removal from histone H2A Lys-119
      - reference_id: PMID:26739236
        supporting_text: The reaction is specific for Polycomb modifications of H2A as the complex cannot deubiquitinate the DNA damage-dependent ubiquitination at H2A K13/15.
      - reference_id: PMID:27083998
        supporting_text: USP51 is the DUB for H2AK13,15ub
