          BAP1 binds nucleosomes through its C-terminal extension but is unproductive until the
          DEUBAD (ASXM) domain of an ASXL protein binds it, forming a composite ubiquitin-binding
          interface that drives removal of ubiquitin from H2AK119. ASXL1 and ASXL2 form mutually
          exclusive complexes with BAP1, and ASXL3 can substitute. The complex does not act on
          the DNA damage mark H2AK13/15ub. Its genomic role is to keep transcribed genes free of
          PRC1-deposited H2AK119ub1.
