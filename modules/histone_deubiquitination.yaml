        label: USP16 (Ubp-M) histone H2A deubiquitinase
        module_type: MOLECULAR_FUNCTION
        description: >-
          USP16 is a ZnF-UBP ubiquitin-specific protease that prefers nucleosomal substrates and
          removes ubiquitin from H2A but not H2B. H2A deubiquitination by USP16 is required for
          histone H3 serine 10 phosphorylation and chromosome segregation at entry into mitosis,
          and USP16 regulates Hox gene expression; it also reverses ATM-dependent silencing of
          transcription next to DNA double-strand breaks.
