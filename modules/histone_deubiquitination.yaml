              - source_id: PMID:26416890
                statement: BAP1 forms mutually exclusive complexes with ASXL1 and ASXL2, whose ASXM domains are required for ubiquitin binding and H2A deubiquitination.
                supporting_text: BAP1 forms two mutually exclusive complexes with the transcriptional regulators ASXL1 and ASXL2
              - source_id: PMID:30664650
                statement: BAP1 and an ASXL protein form the core complex BAP1.com, which protects active genes from PRC1-mediated silencing.
                supporting_text: the function of BAP1.com is to safeguard transcriptionally active genes against silencing by the Polycomb Repressive Complex 1
              - source_id: PMID:30664650
                statement: FOXK1/2, HCFC1 and KDM1B are transient partners of the BAP1-ASXL core.
                supporting_text: our results suggest that BAP1 and ASXL proteins form a core complex (BAP1.com), which engages in transient interactions with additional partners such as FOXK1/2, HCFC1, or KDM1B
              - source_id: PMID:25451922
                statement: BAP1 antagonises the RING1B-BMI1 H2A ubiquitin ligase at FOXK2 target genes.
                supporting_text: indicating an antagonizing role of BAP1 against Ring1B-Bmi1
    - order: 3
      role: removal of H2AK119 monoubiquitin by USP16, notably before mitosis
      node:
