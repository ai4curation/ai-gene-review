  parts:
    - order: 1
      role: removal of H2BK120 monoubiquitin by the ATXN7L3-ENY2 deubiquitination modules
      node:
        id: h2b_dub_modules
        label: ATXN7L3-ENY2 histone H2B deubiquitination modules (SAGA DUBm, USP27X and USP51 modules)
        module_type: PROTEIN_COMPLEX
        description: >-
          Three ubiquitin-specific proteases with an N-terminal ZnF-UBP domain, USP22, USP27X and
          USP51, each assemble with the adaptors ATXN7L3 and ENY2 into a deubiquitination module
          that removes ubiquitin from H2BK120ub1. None is active in isolation, and the three
          compete for the limiting adaptors, so ATXN7L3 and ENY2 set the total H2B
          deubiquitinase capacity. Only the USP22 module is incorporated into SAGA, through
          ATXN7.
        variant_sets:
          - id: h2b_dub_catalytic_paralog
            label: USP22, USP27X or USP51 with ATXN7L3 and ENY2
            axis: catalytic USP paralogue and incorporation into SAGA
            selection: ONE_OR_MORE
            notes: >-
              The three modules coexist in the same cells and act on the same mark; depletion of
              USP22 alone lowers rather than raises global H2Bub1, whereas depletion of the shared
              adaptors raises it, which is how the SAGA-independent modules were found
              (PMID:27132940).
            evidence:
              - source_id: PMID:27132940
                statement: USP27X and USP51 are H2Bub1 deubiquitinases that act independently of SAGA and compete with USP22 for ATXN7L3 and ENY2.
                supporting_text: These observations led us to discover two H2Bub1 DUBs, USP27X and USP51, which function independently of SAGA and compete with USP22 for ATXN7L3 and ENY2 for activity.
            variants:
              - id: saga_dubm
                label: SAGA deubiquitination module (USP22-ATXN7L3-ENY2-ATXN7)
                annotons:
                  - id: saga_dubm_h2b_deubiquitinase
                    label: The SAGA DUBm removes ubiquitin from histone H2B (K120)
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: SAGA deubiquitination module (DUBm)
                        term:
                          id: GO:0071819
                          label: DUBm complex
                        active_units:
                          - id: unit_usp22
                            label: USP22
                            role: catalytic ubiquitin-specific protease of the module; inactive outside the ATXN7L3-ENY2 module; also removes ubiquitin from H2A in vitro (PMID:18469533)
