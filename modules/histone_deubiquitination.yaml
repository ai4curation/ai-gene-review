                  label: Ubiquitin carboxyl-terminal hydrolase 16
            function:
              preferred_term: histone H2A deubiquitinase activity
              term:
                id: GO:0140950
                label: histone H2A deubiquitinase activity
            processes:
              - preferred_term: chromatin remodeling
                term:
                  id: GO:0006338
                  label: chromatin remodeling
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
              - preferred_term: chromatin
                term:
                  id: GO:0000785
                  label: chromatin
            role_description: >-
              USP16 carries histone H2A deubiquitinase activity by IMP (PMID:20550933),
              cysteine-type deubiquitinase activity by IDA (PMID:17914355) and positive regulation
              of DNA-templated transcription by IMP. It acts as an isolated enzyme, so it is a
              gene-product annoton; it forms homotetramers (GOA IPI rows), which are not
              modelled. The mitotic role is recorded in text rather than as a cell cycle process
              term: the knockdown shows that H2A deubiquitination is a prerequisite for the
              mitotic events, which is necessity rather than USP16 doing a step of mitosis.
              USP16 also deubiquitinates the ribosomal protein RPS27A during 40S maturation
              (PMID:32129764), a non-histone activity outside this module.
            evidence:
              - source_id: PMID:17914355
                statement: USP16 is the major H2A deubiquitinase; it prefers nucleosomes and deubiquitinates H2A but not H2B.
                supporting_text: Ubp-M prefers nucleosomal substrates in vitro, and specifically deubiquitinates histone H2A but not H2B in vitro and in vivo
              - source_id: PMID:17914355
                statement: H2A deubiquitination by USP16 is needed for H3S10 phosphorylation and chromosome segregation at mitotic entry.
                supporting_text: H2A deubiquitination by Ubp-M is a prerequisite for subsequent phosphorylation of Ser 10 of H3 and chromosome segregation when cells enter mitosis
              - source_id: PMID:20550933
                statement: USP16 reverses ATM-dependent transcriptional silencing in cis to DNA double-strand breaks.
                supporting_text: reversal of silencing relies on the uH2A deubiquitylating enzyme USP16
