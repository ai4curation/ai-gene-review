            term:
              id: PANTHER:PTHR30385:SF7
              label: RNA POLYMERASE SIGMA FACTOR FLIA
        role_description: Directs late flagellar gene transcription after assembly reaches the secretion
          checkpoint.
        evidence:
        - source_id: PMID:34859548
          title: Transcriptional organization and regulation of the Pseudomonas putida flagellar system.
          statement: The native P. putida expression hierarchy places FliA on late filament, stator and
            chemotaxis outputs.
          supporting_text: FliA activation of Class III genes enables synthesis of the filament, one stator
            complex and completion of the chemotaxis apparatus.
          notes: Accessible abstract. FleQ/sigma54 upstream control is not replaced by Salmonella FlhDC.
      evidence:
      - source_id: PMID:34859548
        title: Transcriptional organization and regulation of the Pseudomonas putida flagellar system.
        statement: P. putida expression analyses support a FleQ/sigma54-led hierarchy with FliA-dependent
          late outputs; Salmonella FlhDC regulation is not substituted for this hierarchy.
      - source_id: PMID:10972838
        title: Completion of the hook-basal body complex of the Salmonella typhimurium flagellum is coupled
          to FlgM secretion and fliC transcription.
        statement: In induced Salmonella flagellar assembly, late fliC expression coincides with FlgM
          secretion and completion of the hook-basal body; target-specific timing is not transferred to
          PSEPK.
      parts:
      - optional: true
        role: negative checkpoint regulator
        node:
