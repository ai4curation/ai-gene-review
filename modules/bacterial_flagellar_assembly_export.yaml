  - statement: The structural review assigns MS-ring, C-ring, axial junction, filament and cap roles;
      detailed Salmonella stoichiometry is not transferred to KT2440.
    supporting_text: The Salmonella flagellum consists of several ring structures called the MS-ring (FliF),
      the C-ring (FliG, FliM, FliN), the P-ring (FlgI), and the L-ring (FlgH), and an axial structure.
  - statement: FlgK/FlgL join the hook to FliC and FliD caps the filament; FliE and additional envelope
      structures remain real prerequisites outside this represented component set.
    supporting_text: 'The axial structure is divided into 5 parts: the rod (FliE, FlgB, FlgC, FlgF, FlgG),
      the hook (FlgE), the hook–filament junction (FlgK, FlgL), the filament (FliC or FljB) and the filament
      cap (FliD)'
  - statement: Modern structures support five A and two B stator subunits rather than the legacy A4B2
      definition; broad family membership does not determine coupling-ion selectivity.
    supporting_text: Thus, 5 A:2 B is the common stoichiometry in the bacterial flagellar stator complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected for structural roles and taxonomic limits; it synthesizes Salmonella
      architecture and comparative motor diversity.
- id: PMID:25613993
  title: The bacterial flagellar motor and its structural diversity.
  findings:
  - statement: The review distinguishes a conserved MS-ring/C-ring/rod/export core from species-dependent
      accessory structures and sodium- versus proton-driven motors.
    supporting_text: A highly conserved motor structure consists of the MS ring, C ring, rod, and export
      apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports the stated comparative boundary; detailed structural claims are taken
      from accessible sources, not inferred from inaccessible full text.
- id: PMID:24064315
  title: Protein export through the bacterial flagellar type III export pathway.
  findings:
  - statement: The review frames export as coordinated ATPase and ion-motive-force work; specific requirements
      are assay-qualified by the primary reconstitution and bypass studies.
    supporting_text: utilizes both ATP and proton motive force
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-level energy-coupling summary; not a claim that either source is universally
      necessary or sufficient.
- id: PMID:34859548
  title: Transcriptional organization and regulation of the Pseudomonas putida flagellar system.
  findings:
  - statement: P. putida expression analyses support a FleQ/sigma54-led hierarchy with FliA-dependent
      late outputs; Salmonella FlhDC regulation is not substituted for this hierarchy.
    supporting_text: FliA activation of Class III genes enables synthesis of the filament, one stator
      complex and completion of the chemotaxis apparatus.
  - statement: The native P. putida expression hierarchy places FliA on late filament, stator and chemotaxis
      outputs.
    supporting_text: FliA activation of Class III genes enables synthesis of the filament, one stator
      complex and completion of the chemotaxis apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native P. putida transcriptional organization from the accessible abstract; distinguishes
      upstream regulation from the module late checkpoint.
- id: PMID:10972838
  title: Completion of the hook-basal body complex of the Salmonella typhimurium flagellum is coupled
    to FlgM secretion and fliC transcription.
  findings:
  - statement: In induced Salmonella flagellar assembly, late fliC expression coincides with FlgM secretion
      and completion of the hook-basal body; target-specific timing is not transferred to PSEPK.
    supporting_text: Induction of fliC gene expression coincides with the appearance of FlgM anti-sigma
      factor in the growth medium.
  - statement: FlgM inhibits sigma28 until secretion relieves repression at hook-basal-body completion.
    supporting_text: Both FlgM secretion and class 3 gene expression occur upon completion of the hook-basal
      body structure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read for temporal checkpoint evidence; full-source strain and construct
      limits are being captured in the Salmonella FlgM review.
- id: PMID:40833400
  title: A β-cap on the FliPQR protein-export channel acts as the cap for initial flagellar rod assembly.
  findings:
  - statement: The FliPQR channel also templates the initial rod structure; this connects export-gate
      assembly to axial construction.
    supporting_text: It also serves as a template for the assembly of the rod structure
  - statement: The FliPQR protein-conducting channel also templates initial rod assembly.
    supporting_text: Thus, the FliPQR complex also acts as a template for rod assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text supports a Salmonella structural mechanism; no native PSEPK residue
      or oligomer count is asserted.
- id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida.
  findings:
  - statement: 'In KT2440 FliC S267C assays, MotAB and MotCD differ by environment: MotAB loss strongly
      impairs liquid swimming, whereas MotCD loss slows semisolid-agar spreading.'
    supporting_text: when the MotCD stator is missing, cells are indistinguishable from the wild type
      in fluid experiments
  - statement: KT2440 MotAB and MotCD form matched alternative stators with different liquid and semisolid
      performance.
    supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote swimming motility,
      so the movement of ΔmotAB mutant cells in aqueous fluids is strongly impaired.
  - statement: MotCD contributes strongly to dispersal in structured media; its presence alone does not
      establish wild-type-like liquid swimming.
    supporting_text: For both agar concentrations, the ΔmotAB culture spreads almost as quickly as the
      wild type, whereas the ΔmotCD culture spreads considerably more slowly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and methods inspected; FliC S267C background, viscosity and agar context are
      retained. Agar spreading is not equated to flagellar swarming.
- id: PMID:33931760
  title: Molecular structure of the intact bacterial flagellar basal body.
  findings:
  - statement: Salmonella basal-body structures identify FlgB/FlgC/FlgF in the proximal rod and FlgG in
      the distal rod; dedicated families support the corresponding KT2440 assignments.
    supporting_text: The proximal rod is composed of four different proteins, FliE, FlgB, FlgC and FlgF,
      while the distal rod is composed of multiple copies of just one protein, FlgG
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Engineered Salmonella TH25631 basal bodies; not native KT2440 structural measurements.
- id: PMID:34785766
  title: Structure of the bacterial flagellar hook cap provides insights into a hook assembly mechanism.
  findings:
  - statement: FlgD assembles the transient hook cap that scaffolds FlgE polymerization.
    supporting_text: we report the crystal structure of the hook cap composed of five subunits of FlgD
      from Salmonella enterica at 3.3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Salmonella SJW1103-derived protein expressed in E. coli; SJW156 complementation. Do
      not assert native KT2440 stoichiometry.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights into Flagellar Assembly.
  findings:
  - statement: Exported FlgE polymerizes into hooks when FlgD is supplied in the vesicle reconstruction.
    supporting_text: In the presence of FlgD, the transported FlgE monomers assembled into the hook structure
      on the basal body
  - statement: FliI hydrolysis can drive export without bulk proton motive force in the defined membrane-vesicle
      assay.
    supporting_text: ATP hydrolysis by FliI can drive the protein export without PMF.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Salmonella inverted membrane vesicles and purified substrates; reconstitution is distinct
      from intact-cell physiology.
- id: PMID:19732341
  title: Interaction of FliK with the bacterial flagellar hook is required for efficient export specificity
    switching.
  findings:
  - statement: FliK interacts with FlhB to switch export specificity at hook completion.
    supporting_text: FliK-FlhB interaction switches export specificity of the bacterial flagellar protein
      export apparatus to stop hook protein export at an appropriate timing for hook length control.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Salmonella genetic/biochemical context. The matching 2RRL FliK construct is a fragment
      of the LT2 reference, not a full-length ruler.
- id: PMID:21934659
  title: An energy transduction mechanism used in bacterial flagellar type III protein export.
  findings:
  - statement: FliH/FliI assist FliJ engagement with FlhA, activating efficient membrane-potential-driven
      export.
    supporting_text: a specific binding of FliJ with an export gate membrane protein, FlhA, is brought
      about by the FliH-FliI complex, which turns the export gate into a highly efficient, Δψ-driven protein
      export apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Salmonella SJW backgrounds and tagged constructs; transfer to reference LT2 and KT2440
      is identified as inference, not an assay-strain identity claim.
- id: PMID:18216858
  title: Distinct roles of the FliI ATPase and proton motive force in bacterial flagellar protein export.
  findings:
  - statement: A Salmonella fliH fliI double-null mutant retains weak motility, with export improved by
      gate suppressors; absence of these accessory proteins does not establish universal impossibility
      of export.
    supporting_text: A fliH fliI double null mutant was weakly motile.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-level bypass evidence. Distinguish weak or suppressor-assisted export from
      normal efficiency; do not reinterpret a native assisted configuration as a universal minimal requirement.
- id: PMID:26943926
  title: The Bacterial Flagellar Type III Export Gate Complex Is a Dual Fuel Engine That Can Use Both
    H+ and Na+ for Flagellar Protein Export.
  findings:
  - statement: FlhA can conduct H+ and Na+, but conditional sodium-supported export in bypass backgrounds
      is separate from sodium-driven stator torque.
    supporting_text: In wild-type cells, however, neither Na+ nor phenamil affected protein export
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text; sodium dependence is qualified by genotype and assay. No universal
      SMF-driven wild-type export claim.
- id: PMID:29967543
  title: Structure of the core of the type III secretion system export apparatus.
  findings:
  - statement: FliP, FliQ and FliR form a specialized polypeptide channel with noncanonical topology.
    supporting_text: The complex is a P5Q4R1 assembly consistent with the dominant species in our earlier
      nMS data of the flagellar system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary structural result; the measured stoichiometry is not assigned to every taxon.
- id: PMID:18326582
  title: Roles of charged residues in the C-terminal region of PomA, a stator component of the Na+-driven
