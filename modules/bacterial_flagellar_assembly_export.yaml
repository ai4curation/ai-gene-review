- id: PMID:39793043
  title: Structural insight into sodium ion pathway in the bacterial flagellar stator from marine Vibrio.
  findings:
  - statement: Vibrio PomAB structures resolve the sodium pathway and phenamil-sensitive mechanism; sequence-matched
      constructs and native functional assays are distinguished from heterologous purification.
    supporting_text: we determined the structures of the sodium-driven stator of Vibrio, namely PomAB,
      in the presence and absence of sodium ions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 8ZYW PomA matches O06873 and PomB matches O06874 plus His6; recombinant BL21 purification
