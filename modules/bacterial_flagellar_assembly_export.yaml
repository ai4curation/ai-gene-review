id: MODULE:bacterial_flagellar_assembly_export
title: Bacterial flagellar assembly and type III export
description: Gammaproteobacterial flagellar assembly and export mechanisms connecting the MS/C-ring platform,
  protein export, rod/hook construction and length control, late transcription, and filament completion.
  Pseudomonas putida, Escherichia coli and Salmonella exemplars ground the assembly/export roles; P. putida
  MotAB/MotCD and Vibrio alginolyticus PomAB resolve conditional motor function and coupling-ion differences.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0044780
  title: bacterial-type flagellum assembly
  statement: Grounds ordered construction of the bacterial flagellum.
- source_id: KEGG:ppu02040
  title: Pseudomonas putida KT2440 flagellar assembly
  statement: Identifies the PSEPK regulatory, export, structural, and motor realization.
- source_id: file:genes/ECOLI/fliI/fliI-ai-review.yaml
  title: ECOLI fliI gene review
  statement: The completed E. coli fliI review grounds the flagellar export ATPase role at the type III
    export apparatus.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_flagellar_assembly_export__ppu02040-deep-research-openscientist.md
  title: OpenScientist PSEPK flagellar assembly pathway review
  statement: The species-aware report finds all six architectural parts represented, identifies omitted
    export, switch, rod, and junction subunits, and flags KEGG name-collision and regulatory-boundary
    issues.
notes: 'The conserved assembly/export architecture is represented within Gammaproteobacteria, with experimentally
  studied Pseudomonas, enterobacterial and Vibrio realizations. This is not a claim that all members of
  the taxon possess flagella or this regulatory/stator configuration. The selected components do not establish
  de novo whole-flagellum sufficiency: FliE, compatible envelope/LP-ring assembly, substrate supply, chaperones,
  membrane insertion and energy conditions remain explicit external prerequisites. Gram-positive absence
  of the LP ring and outgroup motor structures limit extrapolation rather than expand the declared taxon
  automatically. Chemotactic sensing is handled by its separate module; the switch is the motor output.
  Assembly/export, normal export efficiency, torque production and condition-specific swimming are distinct
  endpoints. The FliA/FlgM regulatory part is conditional on the source of late proteins, and FlgM is
  optional as a negative regulator. Stator pairs are optional for assembly and required for powered rotation.
  The official FliI PANTHER label contains ATP SYNTHASE but does not imply that reaction. FlgD retains
  a named family descriptor with exact members because available verified identifiers describe domains
  or an N-terminal region, not a justified whole-protein family. No PANTHER ID or ancestral placement
  is guessed.'
