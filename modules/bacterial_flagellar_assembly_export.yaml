id: MODULE:bacterial_flagellar_assembly_export
title: Bacterial flagellar assembly and type III export
description: >-
  Reusable bacterial module spanning transcriptional staging, flagellar type III
  export, basal-body and switch construction, rod-hook assembly and length
  control, filament completion, and stator installation. Exact Pseudomonas
  putida representatives ground each architectural part without making the
  module specific to its large flagellar locus.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0044780
    title: bacterial-type flagellum assembly
    statement: Grounds ordered construction of the bacterial flagellum.
  - source_id: KEGG:ppu02040
    title: Pseudomonas putida KT2440 flagellar assembly
    statement: Identifies the PSEPK regulatory, export, structural, and motor realization.
notes: >-
  The module captures representative essential parts rather than repeating all
  rod, ring, junction, chaperone, and export-gate paralogs. Chemotactic control
  of rotation is outside the boundary and is modeled in the bacterial
  chemotaxis signal-transduction module. Molecular functions are not assigned
  to structural subunits merely from complex membership.
module:
  id: bacterial_flagellar_assembly_export
  label: Bacterial flagellar assembly and export
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: bacterial-type flagellum assembly
      term:
        id: GO:0044780
        label: bacterial-type flagellum assembly
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: late flagellar transcription control
      node:
        id: flagellar_late_transcription
        label: FliA and FlgM transcriptional checkpoint
        module_type: REGULATORY_STEP
        annotons:
          - id: flia_sigma_factor
            label: FliA sigma factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: flagellar sigma factor FliA family
                representative_members:
                  - preferred_term: PSEPK FliA exemplar
                    term:
                      id: UniProtKB:Q88EW1
                      label: Flagellar sigma factor FliA
            role_description: Directs late flagellar gene transcription after assembly reaches the secretion checkpoint.
          - id: flgm_antisigma_factor
            label: FlgM anti-sigma factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: flagellar anti-sigma factor FlgM family
                representative_members:
                  - preferred_term: PSEPK FlgM exemplar
                    term:
                      id: UniProtKB:Q88EQ8
                      label: Anti-sigma-28 factor FlgM
            role_description: Restrains FliA until the hook-basal-body export checkpoint is satisfied.
    - order: 2
      role: flagellar type III export
      node:
        id: flagellar_type_iii_export
        label: Membrane export gate and cytosolic ATPase
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: flha_export_gate
            label: FlhA export-gate component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FlhA family
                representative_members:
                  - preferred_term: PSEPK FlhA exemplar
                    term:
                      id: UniProtKB:Q88EV8
                      label: Flagellar biosynthesis protein FlhA
            role_description: Major membrane component coordinating substrate export and assembly state.
          - id: flip_export_gate
            label: FliP export-gate component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliP family
                representative_members:
                  - preferred_term: PSEPK FliP exemplar
                    term:
                      id: UniProtKB:Q88EU8
                      label: Flagellar biosynthetic protein FliP
            role_description: Conserved membrane export-gate component.
          - id: flii_export_atpase
            label: FliI export ATPase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliI flagellar export ATPase family
                representative_members:
                  - preferred_term: PSEPK FliI exemplar
                    term:
                      id: UniProtKB:Q88ET7
                      label: Flagellum-specific ATPase FliI
            role_description: Supplies ATP-dependent substrate handling at the export apparatus.
    - order: 3
      role: basal-body MS ring and switch assembly
      node:
        id: ms_ring_switch_assembly
        label: FliF MS ring and FliG switch
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: flif_ms_ring
            label: FliF MS-ring component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliF family
                representative_members:
                  - preferred_term: PSEPK FliF exemplar
                    term:
                      id: UniProtKB:Q88ET4
                      label: Flagellar M-ring protein FliF
            role_description: Forms the membrane-embedded MS ring that anchors export and switch components.
          - id: flig_switch
            label: FliG switch component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliG family
                term:
                  id: PANTHER:PTHR30534
                  label: FLAGELLAR MOTOR SWITCH PROTEIN FLIG
                representative_members:
                  - preferred_term: PSEPK FliG exemplar
                    term:
                      id: UniProtKB:Q88ET5
                      label: Flagellar motor switch protein FliG
            role_description: Couples the rotor to stator torque and chemotactic switching.
    - order: 4
      role: rod-hook construction and length control
      node:
        id: rod_hook_assembly
        label: Distal rod, hook, and hook-length checkpoint
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: flgg_distal_rod
            label: FlgG distal rod
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FlgG family
                representative_members:
                  - preferred_term: PSEPK FlgG exemplar
                    term:
                      id: UniProtKB:Q88ER8
                      label: Flagellar distal rod protein FlgG
            role_description: Builds the distal rod through the periplasm.
          - id: flge_hook
            label: FlgE hook
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FlgE hook family
                representative_members:
                  - preferred_term: PSEPK FlgE exemplar
                    term:
                      id: UniProtKB:Q88ER5
                      label: Flagellar hook protein FlgE
            role_description: Polymerizes the flexible hook joining rod and filament.
          - id: flik_length_control
            label: FliK hook-length control
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliK family
                representative_members:
                  - preferred_term: PSEPK FliK exemplar
                    term:
                      id: UniProtKB:Q88EU2
                      label: Flagellar hook-length control protein FliK
            role_description: Triggers export-substrate switching when the hook reaches its target length.
    - order: 5
      role: filament junction, polymerization, and capping
      node:
        id: filament_completion
        label: Hook-filament junction, flagellin filament, and cap
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: flgk_junction
            label: FlgK hook-filament junction
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FlgK family
                representative_members:
                  - preferred_term: PSEPK FlgK exemplar
                    term:
                      id: UniProtKB:Q88ES2
                      label: Flagellar hook-associated protein FlgK
            role_description: Forms the proximal hook-filament junction.
          - id: flic_flagellin
            label: FliC flagellin
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial flagellin family
                representative_members:
                  - preferred_term: PSEPK FliC exemplar
                    term:
                      id: UniProtKB:Q88ES5
                      label: Flagellin
            role_description: Polymerizes into the extracellular flagellar filament.
          - id: flid_cap
            label: FliD filament cap
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FliD cap family
                representative_members:
                  - preferred_term: PSEPK FliD exemplar
                    term:
                      id: UniProtKB:Q88ES7
                      label: Flagellar cap protein FliD
            role_description: Caps the distal filament and promotes flagellin incorporation.
    - order: 6
      role: stator installation and torque generation
      node:
        id: motab_stator_installation
        label: MotAB stator complex
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: mota_stator
            label: MotA stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MotA family
                term:
                  id: PANTHER:PTHR30433
                  label: CHEMOTAXIS PROTEIN MOTA
                representative_members:
                  - preferred_term: PSEPK MotA exemplar
                    term:
                      id: UniProtKB:Q88DC2
                      label: Flagellar motor protein MotA
            role_description: Membrane stator subunit contributing to proton-driven torque.
          - id: motb_stator
            label: MotB stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MotB family
                term:
                  id: PANTHER:PTHR30329
                  label: STATOR ELEMENT OF FLAGELLAR MOTOR COMPLEX
                representative_members:
                  - preferred_term: PSEPK MotB exemplar
                    term:
                      id: UniProtKB:Q88DC3
                      label: Flagellar motor protein MotB
            role_description: Anchors the stator to peptidoglycan and contributes to proton-driven torque.
  connections:
    - source: flagellar_late_transcription
      target: flagellar_type_iii_export
      connection_type: POSITIVELY_REGULATES
    - source: flagellar_type_iii_export
      target: ms_ring_switch_assembly
      connection_type: PART_OF
    - source: ms_ring_switch_assembly
      target: rod_hook_assembly
      connection_type: PRECEDES
    - source: rod_hook_assembly
      target: filament_completion
      connection_type: PRECEDES
    - source: ms_ring_switch_assembly
      target: motab_stator_installation
      connection_type: PRECEDES
