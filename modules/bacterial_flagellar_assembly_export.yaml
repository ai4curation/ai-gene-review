id: MODULE:bacterial_flagellar_assembly_export
title: Bacterial flagellar assembly and type III export
description: >-
  Reusable gammaproteobacterial module spanning basal-body and switch
  construction, flagellar type III export, rod-hook assembly and length
  control, late transcriptional staging, filament completion, and proton-
  coupled stator installation. Exact Pseudomonas putida representatives ground
  the architectural parts without making the module specific to its locus.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0044780
    title: bacterial-type flagellum assembly
    statement: Grounds ordered construction of the bacterial flagellum.
  - source_id: KEGG:ppu02040
    title: Pseudomonas putida KT2440 flagellar assembly
    statement: Identifies the PSEPK regulatory, export, structural, and motor realization.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_flagellar_assembly_export__ppu02040-deep-research-openscientist.md
    title: OpenScientist PSEPK flagellar assembly pathway review
    statement: >-
      The species-aware report finds all six architectural parts represented,
      identifies omitted export, switch, rod, and junction subunits, and flags
      KEGG name-collision and regulatory-boundary issues.
notes: >-
  The module captures a representative architectural panel, not a claim that
  every protein required to construct a flagellum has been curated. Additional
  rod, ring, junction, chaperone, and export-gate proteins in ppu02040 remain
  outside this focused review boundary. Chemotactic control of rotation is
  modeled in the bacterial chemotaxis signal-transduction module. Molecular
  functions are not assigned to structural subunits merely from complex
  membership. FliA/FlgM staging and proton-coupled MotAB are scoped to the
  gammaproteobacterial realization rather than asserted as universal bacterial
  requirements.
module:
  id: bacterial_flagellar_assembly_export
  label: Bacterial flagellar assembly and export
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: bacterial-type flagellum assembly
      term:
        id: GO:0044780
        label: bacterial-type flagellum assembly
  context:
    taxa:
      - preferred_term: Gammaproteobacteria
        term:
          id: NCBITaxon:1236
          label: Gammaproteobacteria
  parts:
