  label: Peroxisome lifecycle
  module_type: ORGANELLE_LIFECYCLE
  concepts:
  - preferred_term: peroxisome organization
    term:
      id: GO:0007031
      label: peroxisome organization
    description: Assembly, maintenance, inheritance, and functional organization of peroxisomes.
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
    conditions:
    - preferred_term: conserved eukaryotic organelle lifecycle
      description: Peroxisomes are eukaryotic organelles; individual lineages can retain, elaborate, or
        lose particular route variants.
    - preferred_term: conserved peroxin core with lineage-specific additions
      description: The conserved skeleton centers on PMP targeting, PTS cargo recognition, receptor docking/translocation,
        receptor ubiquitination and extraction, and membrane remodeling; individual lineages add, lose,
        or replace accessory peroxins and regulatory factors.
