  - order: 3
    role: function
    optional: true
    node:
      id: peroxisome_matrix_metabolism
      label: Peroxisomal matrix metabolic operation
      module_type: BIOLOGICAL_PROCESS
      description: Resident peroxisomal metabolism is treated as a module interface rather than a fixed
        universal pathway. Beta-oxidation, reactive oxygen metabolism, ether lipid metabolism, glyoxylate-cycle
        functions, or specialized biosynthetic pathways can be attached as lineage-, tissue-, or environment-specific
        submodules.
      concepts:
      - preferred_term: peroxisomal matrix
        term:
          id: GO:0005782
          label: peroxisomal matrix
      evidence:
      - source_id: DOI:10.1186/s13062-024-00458-1
        statement: Supports tissue-specific expression and functional specialization of peroxisomal metabolism.
      notes: 'Recent expression meta-analysis supports keeping metabolic operation modular rather than
        universal: heart, liver, and other tissues can retain similar biogenesis machinery while emphasizing
        different peroxisomal metabolic programs.'
      parts:
      - order: 1
        role: fatty acid beta-oxidation
        optional: true
        node:
          id: beta_oxidation
          label: Peroxisomal beta-oxidation (see MODULE:peroxisomal_beta_oxidation)
          module_ref: peroxisomal_beta_oxidation
      - order: 2
        role: ether lipid synthesis
        optional: true
        node:
          id: ether_lipid_synthesis
          label: Ether lipid and plasmalogen biosynthesis (see MODULE:ether_lipid_plasmalogen_biosynthesis)
          module_ref: ether_lipid_plasmalogen_biosynthesis
  - order: 4
    role: turnover
    optional: true
    node:
      id: peroxisome_quality_control
      label: Peroxisome quality control and turnover interface
      module_type: ORGANELLE_LIFECYCLE
      description: Pexophagy and ubiquitin-linked peroxisome quality control regulate organelle abundance
        and remove import-defective or damaged peroxisomes. This is an interface to the lifecycle rather
        than part of the core matrix import mechanism.
      concepts:
      - preferred_term: pexophagy
        term:
          id: GO:0030242
          label: autophagy of peroxisome
        description: Selective autophagy of peroxisomes.
      annotons:
      - id: ubiquitin_linked_pexophagy_interface
        label: Ubiquitin-linked pexophagy signaling
        participant:
          selector_type: ANY_PARTICIPANT
          description: ubiquitinated peroxisomal membrane proteins or import-defective peroxisomes
        function:
          preferred_term: selective autophagy signaling for peroxisome turnover
          targets:
          - preferred_term: damaged or import-defective peroxisome
        evidence:
        - source_id: DOI:10.1038/s41467-023-44005-4
          statement: Supports pexophagy as a quality-control route connected to peroxisome import defects
            and cellular autophagy capacity.
  connections:
  - source: peroxisome_proliferation
    target: peroxisomal_import
    connection_type: POSITIVELY_REGULATES
    description: Proliferation and membrane biogenesis are coupled in peroxisome growth and maintenance.
  - source: peroxisomal_import
    target: peroxisome_matrix_metabolism
    connection_type: PROVIDES_INPUT_FOR
    description: Matrix import provides enzymes required for mature peroxisome metabolic function.
  - source: peroxisomal_import
    target: peroxisome_quality_control
    connection_type: NEGATIVELY_REGULATES
    description: Functional matrix import helps maintain organelle identity; import failure or unresolved
      ubiquitin signals can shift peroxisomes toward pexophagy and quality-control routes.
    evidence:
    - source_id: DOI:10.1038/s41467-023-44005-4
      statement: Supports cross-talk between import defects, pexophagy, and selective autophagy capacity.
