id: MODULE:peroxisome_lifecycle
title: Peroxisome lifecycle
description: Peroxisomes grow by importing membrane and matrix proteins, divide, carry out lineage- and
  tissue-specific metabolism, and are removed by pexophagy. This umbrella module composes the modules
  for those stages by reference. Protein import is required in every eukaryote with peroxisomes or peroxisome-derived
  organelles; division, metabolism and turnover vary between lineages or are not yet written as eukaryote-wide
  rules.
status: DRAFT
evidence:
- source_id: file:modules/peroxisomal_protein_import.yaml
  title: Peroxisomal protein import machinery
  statement: Eukaryote-wide import core split out of this module, with per-subunit family selectors.
- source_id: file:modules/peroxisome-lifecycle-deep-research-falcon.md
  title: Peroxisome lifecycle and matrix protein import module deep research
  statement: Falcon deep research synthesis used to refine the module boundaries, importomer/exportomer
    distinction, lineage variants, and 2023-2024 mechanistic updates.
- source_id: DOI:10.1016/j.tcb.2023.08.005
  title: Towards solving the mystery of peroxisomal matrix protein import
  statement: Supports the coupled import-receptor recycling cycle and the current PEX13/YG-repeat meshwork
    model for matrix protein import.
- source_id: DOI:10.1007/s00418-023-02259-5
  title: 'The peroxisome: an update on mysteries 3.0'
  statement: Supports the current conserved peroxin skeleton, lineage-specific peroxin variants, peroxisome
    proliferation/division machinery, and organelle contact-site context.
- source_id: PMID:28765278
  statement: Supports treating the peroxisomal docking/translocation machinery as an importomer module.
- source_id: PMID:35768507
  statement: Supports a distinct ATP-dependent matrix import receptor recycling/extraction module.
notes: Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles follow the shared
  skeleton. Read as a satisfiability rule, only protein import is required. Division is optional because
  its module still requires lineage-specific routes (the metazoan MFF adaptor, and PEX11-FIS1-dynamin
  units not yet grounded per subunit); metabolism is optional because resident peroxisomal pathways vary
  by lineage and tissue; turnover (pexophagy) is an interface not yet modelled as a module. The import
  stages were moved verbatim into MODULE:peroxisomal_protein_import, with the importomer, RING peroxin
  and PEX1/PEX6 complexes broken into per-subunit family annotons.
module:
