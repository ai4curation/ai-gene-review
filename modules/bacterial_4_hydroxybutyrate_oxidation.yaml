id: MODULE:bacterial_4_hydroxybutyrate_oxidation
title: Bacterial 4-hydroxybutyrate oxidation to succinate
description: >-
  A reusable two-reaction bacterial pathway in which 4-hydroxybutyrate
  dehydrogenase oxidizes 4-hydroxybutyrate to succinate semialdehyde and a
  succinate-semialdehyde dehydrogenase oxidizes that intermediate to succinate.
  The second reaction can use NAD+ or NADP+ depending on enzyme family and
  organism. Uptake, upstream 4-hydroxybutyrate production, the GABA shunt, and
  downstream TCA-cycle oxidation are outside the core.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:PSEPK/gbd/gbd-uniprot.txt
    title: UniProtKB entry for PSEPK Gbd
    statement: Q88JJ9 is annotated as 4-hydroxybutyrate dehydrogenase.
  - source_id: file:interpro/panther/PTHR11496/PTHR11496-entries.csv
    title: Local PANTHER PTHR11496 family member table
    statement: Q59104 is a characterized Cupriavidus necator Gbd exemplar in SF102, while the subfamily also contains proteins with other dehydrogenase and reductase names.
  - source_id: file:PSEPK/sad-I/sad-I-uniprot.txt
    title: UniProtKB entry for PSEPK Sad-I
    statement: Q88K05 is a predicted NAD(P)-linked succinate-semialdehyde dehydrogenase candidate with unresolved cofactor preference.
  - source_id: file:PSEPK/sad-II/sad-II-uniprot.txt
    title: UniProtKB entry for PSEPK Sad-II
    statement: Q88I50 is a second predicted NAD(P)-linked succinate-semialdehyde dehydrogenase candidate with unresolved cofactor preference.
  - source_id: file:projects/P_PUTIDA/batches/ppu00650_bacterial_4_hydroxybutyrate_oxidation.tsv
    title: Pseudomonas putida KT2440 4-hydroxybutyrate oxidation batch
    statement: The focused batch records exact KT2440 candidate implementations and their unresolved pathway assignments.
  - source_id: file:modules/bacterial_4_hydroxybutyrate_oxidation-deep-research-openscientist.md
    title: OpenScientist review of bacterial 4-hydroxybutyrate oxidation
    statement: The report supports a two-reaction module and treats Sad/GabD cofactor preference as family-level context requiring target-protein validation.
  - source_id: PMID:32256468
    title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
    statement: KT2440 can route 4-hydroxybutyrate toward succinate, but the responsible dehydrogenase pair is not resolved in this module.
  - source_id: PMID:7851418
    title: Metabolic pathway for biosynthesis of poly(3-hydroxybutyrate-co-4-hydroxybutyrate) from 4-hydroxybutyrate by Alcaligenes eutrophus.
    statement: Enzymic studies support bacterial 4-hydroxybutyrate degradation through succinate semialdehyde and succinate.
notes: >-
  Pseudomonas putida KT2440 supplies a candidate Gbd exemplar but current local
  evidence does not identify whether Sad-I, Sad-II, or another aldehyde
  dehydrogenase is the physiological partner during 4-hydroxybutyrate
  utilization. Their inclusion as candidate exemplars records coverage, not
  proof that only one paralog contributes. PTHR43217 does not reliably resolve
  NAD versus NADP specificity for the KT2440 Sad candidates. Q88EN2/GabD-II was
  excluded after its doe-like ectoine-catabolic locus provided a stronger
  competing substrate hypothesis than the submitted SSADH name. This exclusion
  records the absence of evidence for a physiological 4-hydroxybutyrate role;
  it does not establish that Q88EN2 lacks SSADH side activity.
  The listed KT2440 proteins are a focused product-name/family candidate
  set, not a proof that every relevant aldehyde dehydrogenase paralog has been
  enumerated. No additional gene named gabD-I was found in the simple UniProt
  gene-list query, but the gabD-II suffix should not be interpreted as evidence
  of completeness. PTHR11496:SF102 is also broader than Gbd: its entries include
  proteins named as maleylacetate reductases and propanediol, methanol, or
  threonine dehydrogenases, so membership alone does not establish GO:0047577.
