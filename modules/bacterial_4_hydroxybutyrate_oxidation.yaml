id: MODULE:bacterial_4_hydroxybutyrate_oxidation
title: Bacterial free-acid 4-hydroxybutyrate oxidation to succinate
description: 'Two consecutive non-CoA reactions oxidize 4-hydroxybutyrate to succinate: NAD-dependent
  Gbd forms succinate semialdehyde, and a nonacylating succinate-semialdehyde dehydrogenase forms succinate.
  The experimentally supported implementation is grounded in selected or experimentally expressing Cupriavidus
  necator backgrounds. Pseudomonas putida candidates and a distinct 3-hydroxybutyrate enzyme provide comparative
  context without establishing a complete native free-acid route. Uptake, upstream diol oxidation, GABA
  supply, CoA-dependent beta-oxidation, PHA synthesis and reverse succinate degradation are outside the
  boundary.'
status: COMPLETE
scope: CONCRETE
references:
- id: PMID:7851418
  title: Metabolic pathway for biosynthesis of poly(3-hydroxybutyrate-co-4-hydroxybutyrate) from 4-hydroxybutyrate
    by Alcaligenes eutrophus.
  findings:
  - statement: The free-acid oxidative route was established in selected Cupriavidus strains; parental
      H16/HF39 did not grow on 4HB.
    supporting_text: 'Alcaligenes eutrophus strains H16, HF39, PHB-4 and Pseudomonas denitrificans

      ''Morris'' were not able to grow with 1,4-butanediol or 4-hydroxybutyrate.'
  - statement: Enzymic evidence supports consecutive oxidation through succinate semialdehyde to succinate.
    supporting_text: 'This indicated that degradation

      of 4-hydroxybutyrate occurs via succinate semialdehyde and succinate'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary genetic, enzymic and isotope study; normal cache remains abstract-only after
      provider-chain and publisher recovery attempts. The selected-strain context and stated reaction
      sequence are explicit; detailed Methods are not presumed.
- id: PMID:31981617
  title: Kinetics aspects of Gamma-hydroxybutyrate dehydrogenase.
  findings:
  - statement: The exact Q59104 recombinant fusion directly establishes the first reaction, independently
      of growth phenotype.
    supporting_text: 'gamma-hydroxybutyrate dehydrogenase (GHBDH, UniProt: Q59104), cloned from

      Cupriavidus necator as a fusion protein.'
  - statement: NAD binds in the characterized oxidative reaction; heterologous Nudix activation is biochemical
      regulation rather than a native mandatory pathway step.
    supporting_text: 'This pattern is

      consistent with NAD+ binding first in Mono-Iso Theorell-Chance kinetics.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary target-specific kinetics and mutagenesis. Abstract-only normal cache; do not
      treat the foreign activator proteins as native Cupriavidus components.
- id: PMID:10564790
  title: Biochemical and molecular characterization of a succinate semialdehyde dehydrogenase involved
    in the catabolism of 4-hydroxybutyric acid in Ralstonia eutropha.
  findings:
  - statement: The exact published GabD locus participates in 4HB catabolism, supported by the leaky transposon
      phenotype and cloned-gene study.
    supporting_text: 'A succinate semialdehyde dehydrogenase gene (gabD) was identified to be

      disrupted in a transposon-induced mutant of Ralstonia eutropha exhibiting the

      phenotype 4-hydroxybutyric acid-leaky.'
  - statement: The organism also has a separate NAD-dependent SSADH activity; this is not a second measured
      property automatically attributable to the same clone.
    supporting_text: 'Enzymatic studies indicated the existence of a second NAD(+)-dependent succinate

      semialdehyde dehydrogenase in R. eutropha.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact primary source for Q9RBF6/AAF19796.1 (deposited strain SHF3). Abstract-only; clone-specific
      acceptor assay values are obtained separately from curated BRENDA, not an invented full-text extraction.
- id: PMID:32256468
  title: Unraveling 1,4-Butanediol Metabolism in Pseudomonas putida KT2440.
  findings:
  - statement: PP_2049 is genetically required for growth on 4HB in the tested strains, but is not the
      original submitted gbd locus PP_2650.
    supporting_text: Both the wildtype and the evolved strains were unable to grow on 1,4-butanediol or
      4-hydroxybutyrate when the regulator PP_2046, or the alcohol dehydrogenase PP_2049 were deleted
  - statement: The proposed free-acid oxidation was not demonstrated by the attempted extract assays;
      lack of a signal is not proof of no activity.
    supporting_text: Attempts to obtain direct biochemical evidence for the oxidation hypothesis with
      dehydrogenase assays on whole cell extracts of P. putida KT2440 wildtype, B10.1, and ΔPP_2046 with
      4-hydroxybutyrate as a substrate were unsuccessful
  - statement: The authors leave the competing CoA-dependent route open.
    supporting_text: However, the alternative β-oxidation hypothesis can’t be ruled out, and possibly
      both pathways operate simultaneously.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. Genetic necessity, enzyme chemistry and flux-route discrimination
      are separate conclusions.
- id: PMID:37067433
  title: Integration of ARTP Mutation and Adaptive Laboratory Evolution to Reveal 1,4-Butanediol Degradation
    in Pseudomonas putida KT2440.
  findings:
  - statement: The evolved NB10 study supports a CoA/beta-oxidation and GCL interpretation, preventing
      automatic generalization of the free-acid route to all KT2440 growth.
    supporting_text: BDO degradation pathway was confirmed to be composed of β-oxidation, GCL pathway,
      glyoxylate cycle and gluconeogenesis pathway
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. The authors infer a pathway using transcriptomics and genetic
      engineering; this is not a direct assay of every proposed intermediate or the original Gbd/Sad pair.
- id: PMID:42328986
  title: Degradation pathway of (R)-1,3-butanediol in Pseudomonas putida KT2440 and development of its
    biosensor.
  findings:
  - statement: Direct PP_2049 assays establish R-3HB oxidation to acetoacetate, a distinct substrate/product
      pair from 4HB oxidation to succinate semialdehyde.
    supporting_text: During the activity measurement, equimolar NADH and acetoacetate (AA) were generated
      for both PP_2049 and PP_3073, indicating that these enzymes convert (R)−3-HB to AA with NAD+ as
      cofactor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full June 2026 primary recovered normally by the PSEPK reviewer. Exact locus identity
      and assayed chemistry establish a comparator role; 3HB and 4HB are not interchangeable.
- id: PMID:40970732
  title: 'Microbial plastic degradation: enzymes, pathways, challenges, and perspectives.'
  findings:
  - statement: The review explicitly presents multiple possible downstream 4HB routes, not one proven
      conserved bacterial circuit.
    supporting_text: Three possible bacterial pathways are available for further metabolism of 4-hydroxybutyrate
      in this model organism.
  - statement: CoA-dependent beta-oxidation is a mechanistically distinct boundary alternative.
    supporting_text: The third route involves β-oxidation to form glycolyl-CoA and acetyl-CoA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full 2025 review inspected; its alternatives trace to primary literature. This overview
      does not assign a specific PSEPK paralog to the free-acid reaction.
- id: PMID:34885814
  title: Current Advances towards 4-Hydroxybutyrate Containing Polyhydroxyalkanoates Production for Biomedical
    Applications.
  findings:
  - statement: The review describes reductive SSA-to 4HB chemistry in biosynthetic/anaerobic pathways,
      which cannot establish native oxidative physiology.
    supporting_text: The SSA is reduced to 4HB by 4HB dehydrogenase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full review inspected as directionality and pathway-boundary context. Reverse Clostridium
      chemistry and 4HB-CoA/PHA synthesis are not additional oxidative implementations.
