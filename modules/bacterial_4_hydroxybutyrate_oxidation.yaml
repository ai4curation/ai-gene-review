evidence:
- source_id: PMID:7851418
  title: Metabolic pathway for biosynthesis of poly(3-hydroxybutyrate-co-4-hydroxybutyrate) from 4-hydroxybutyrate
    by Alcaligenes eutrophus.
  statement: Primary support for the paired free-acid pathway and selected-strain boundary.
- source_id: PMID:10564790
  title: Biochemical and molecular characterization of a succinate semialdehyde dehydrogenase involved
    in the catabolism of 4-hydroxybutyric acid in Ralstonia eutropha.
  statement: Clone-level support for the downstream catalytic step.
- source_id: PMID:40970732
  title: 'Microbial plastic degradation: enzymes, pathways, challenges, and perspectives.'
  statement: Multiple competing bacterial pathways prevent a universal pathway assertion.
- source_id: PMID:37067433
  title: Integration of ARTP Mutation and Adaptive Laboratory Evolution to Reveal 1,4-Butanediol Degradation
    in Pseudomonas putida KT2440.
  statement: Newer KT2440 work supports a distinct CoA-dependent interpretation.
notes: One experimentally grounded species-level route is required; optional Pseudomonas comparisons cannot
  complete it, even when mixed with a single Cupriavidus enzyme. Exact selectors preserve all original
  accessions while avoiding a broad family-wide activity claim. Selected-strain expression and actual
  flux are not computed from sequence presence by the Boolean compiler. No claim is made that these proteins
  form a stable complex, that both Cupriavidus enzymes were jointly purified/reconstituted, or that the
  named Sad candidates exhaust all SSA enzymes. GO:0009013 intentionally summarizes the two supported
  cofactor branches for GabD; no fixed combined reaction stoichiometry is asserted.
