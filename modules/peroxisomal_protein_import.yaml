knowledge_gaps:
- gap_statement: GO no longer distinguishes the PTS1, PTS2 and mPTS receptor activities. GO:0005052 (peroxisome
    matrix targeting signal-1 binding), GO:0005053 (signal-2 binding) and GO:0033328 (membrane targeting
    sequence binding) were all obsoleted and redirected to the single term GO:0000268 peroxisome signal
    sequence receptor activity, which has no children.
  boundary: 'matrix_targeting_signal_axis (Pex5 PTS1 vs Pex7 PTS2) and pmp_insertion_route_axis (Pex19
    mPTS): all three annoton function terms.'
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The collapse is factually harmless - GO:0000268 is true of Pex5, Pex7 and Pex19 alike
    - but it erases in the machine-readable field precisely the distinction these variant sets exist to
    express. Pex5, Pex7 and Pex19 recognise different signals on different cargo classes and are not interchangeable,
    yet they now carry an identical molecular function. Downstream reasoning over this module can no longer
    tell the three receptor routes apart from the GO term alone; the distinction survives only in preferred_term,
    the variant labels and the module notes.
  resolution: Reinstate signal-specific receptor terms as children of GO:0000268, or record the recognised
    signal on the annoton via a cargo/substrate descriptor rather than relying on the function term.
  proposed_terms:
  - proposed_name: peroxisome matrix targeting signal-1 receptor activity
    proposed_definition: Binding to a peroxisomal targeting signal 1 (PTS1), the C-terminal tripeptide
      signal (canonically SKL or a conservative variant) that directs a soluble cargo protein to the peroxisomal
      matrix, so as to carry that cargo to the peroxisomal import machinery.
    justification: Offered as the pattern for restoring the granularity lost when GO:0005052, GO:0005053
      and GO:0033328 were merged into GO:0000268; sibling terms for PTS2 and for the membrane targeting
      signal would follow the same form. PTS1 and PTS2 receptors are distinct proteins with distinct cargo
      repertoires and distinct disease consequences, so a single undifferentiated receptor term under-describes
      them.
    proposed_parent:
      id: GO:0000268
      label: peroxisome signal sequence receptor activity
