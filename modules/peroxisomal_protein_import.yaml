id: MODULE:peroxisomal_protein_import
title: Peroxisomal protein import machinery
description: 'Peroxisomal proteins are made in the cytosol and imported post-translationally, membrane
  proteins by the Pex19/Pex3 route and folded matrix proteins by a receptor cycle: the PTS1 receptor Pex5
  carries cargo to the Pex14/Pex13 docking machinery, releases it into the matrix, and is then monoubiquitinated
  by the Pex2/Pex10/Pex12 RING peroxins and extracted for reuse by the Pex1/Pex6 AAA ATPase. This module
  is the eukaryote-wide core of that machinery, written so that it can be evaluated in any genome; lineage-specific
  peroxins are optional parts.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/peroxisome-lifecycle-deep-research-falcon.md
  title: Peroxisome lifecycle and matrix protein import module deep research
  statement: Falcon deep research synthesis used to refine the module boundaries, importomer/exportomer
    distinction, lineage variants, and 2023-2024 mechanistic updates.
- source_id: DOI:10.1016/j.tcb.2023.08.005
  title: Towards solving the mystery of peroxisomal matrix protein import
  statement: Supports the coupled import-receptor recycling cycle and the current PEX13/YG-repeat meshwork
    model for matrix protein import.
- source_id: DOI:10.1007/s00418-023-02259-5
  title: 'The peroxisome: an update on mysteries 3.0'
  statement: Supports the current conserved peroxin skeleton, lineage-specific peroxin variants, peroxisome
    proliferation/division machinery, and organelle contact-site context.
- source_id: PMID:28765278
  statement: Supports treating the peroxisomal docking/translocation machinery as an importomer module.
- source_id: PMID:35768507
  statement: Supports a distinct ATP-dependent matrix import receptor recycling/extraction module.
notes: 'Split out of MODULE:peroxisome_lifecycle, whose curated import content it carries. Eukaryote-wide
  scope: PAINT places the IBD nodes for Pex19, Pex3, Pex5, Pex7, Pex14, Pex13, Pex10, Pex12 and the Pex1
  and Pex6 clades at Eukaryota (taxon:2759); Pex2''s only node is at Amniota, so its step rests on subfamily
  membership spanning animals, fungi, Dictyostelium and Arabidopsis; Pex26 is placed at Eumetazoa and
  is optional. Read as a satisfiability rule, every non-optional part is expected in any eukaryote with
  peroxisomes or peroxisome-derived organelles such as kinetoplastid glycosomes. Optional, as lineage-specific:
  Pex16 (some fungi lack it), the PTS2 receptor Pex7 (some lineages have lost PTS2), the mammalian RNF146-TNKS/2
  input to PEX14, the human RRBP1 route, and the PEX1/PEX6 membrane anchor (PEX26 in animals, Pex15 in
  fungi). These lineage statements come from the curated module and the general literature and have not
  yet been checked against data in this repository. Not yet modelled: the receptor-ubiquitinating E2 (Pex4/Pex22
  in fungi and plants; other E2s in animals) and receptor deubiquitination. This module treats matrix
  import as a coupled import-export cycle. The docking/translocation importomer is modeled separately
  from the receptor ubiquitination and ATP-dependent extraction machinery, even though some literature
  uses "importomer" more broadly. Pexophagy and organelle contact sites are represented as interfaces
  to the lifecycle, not as part of the core matrix import mechanism. GO release 2026-06-15 obsoleted the
  three substrate-specific receptor terms GO:0033328 (mPTS binding, PEX19), GO:0005052 (PTS1 binding,
  PEX5) and GO:0005053 (PTS2 binding, PEX7), each with replaced_by GO:0000268 (peroxisome signal sequence
  receptor activity), so the three receptor annotons now share one molecular-function id. The mPTS/PTS1/PTS2
  distinction is kept in each annoton''s preferred_term and cargo. The three PAINT ancestral-node descriptors
  were re-transcribed from the current PAINT rows, whose F:GO:0000268 IBD assertions are dated 20260828.'
