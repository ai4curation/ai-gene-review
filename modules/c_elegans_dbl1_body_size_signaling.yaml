id: MODULE:c_elegans_dbl1_body_size_signaling
title: DBL-1 BMP-like Sma/Mab signaling in Caenorhabditis elegans body size control
description: >-
  In Caenorhabditis elegans the BMP2/4-related ligand DBL-1 is secreted mainly
  by neurons and acts on the epidermis (hypodermis) to promote postembryonic
  growth and to pattern the male tail. DBL-1 signals through a receptor pair
  of the type I serine/threonine kinase SMA-6 and the type II kinase DAF-4,
  and then through the Smads SMA-2 and SMA-3 together with the co-Smad SMA-4.
  Loss of any of these components gives small (Sma) animals with abnormal male
  tails (Mab), and the DBL-1 dose sets body length, so overexpression makes
  animals longer. SMA-3 is the principal receptor-regulated Smad. Signaling
  is tuned at the cell surface: the glypican LON-2 restrains it, apparently
  through the matricellular protein SMOC-1, which binds both LON-2 and DBL-1,
  rather than by binding DBL-1 directly; and the LRIG-family transmembrane
  protein SMA-10, which binds both receptors and supports SMA-6 endocytic
  trafficking, enhances it. In the nucleus the Schnurri-family zinc finger
  protein SMA-9 acts as a transcriptional cofactor that mainly represses
  targets in body size control. One downstream target is lon-1, which encodes
  a secreted CAP/CRISP-family protein made in the hypodermis. The pathway
  represses lon-1, and LON-1 limits body size, binds sterol in vitro and
  feeds back to dampen pathway output. The same ligand, receptors and SMA-3
  also act in epidermal antifungal defense, lipid storage and other outputs.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12051826
    title: lon-1 regulates Caenorhabditis elegans body size downstream of the dbl-1 TGF beta signaling pathway.
    statement: Core composition of the Sma/Mab pathway.
    supporting_text: >-
      The ligand of the pathway, dbl-1, transmits its signal through two
      receptor serine threonine kinases, daf-4 and sma-6, which in turn
      regulate the activity of the Smads, sma-2, sma-3, and sma-4.
  - source_id: PMID:12397107
    title: The expression of TGFbeta signal transducers in the hypodermis regulates body size in C. elegans.
    statement: >-
      Loss of ligand, receptors or Smads reduces postembryonic growth, and the
      signal is proposed to run from the nervous system to the hypodermis.
    supporting_text: >-
      these results suggest a model in which postembryonic growth of hypodermal
      cells is regulated by TGFbeta-related signaling from the nervous system
      to the hypodermis.
  - source_id: PMID:9847239
    title: Specificity of TGFbeta signaling is conferred by distinct type I receptors and their associated SMAD proteins in Caenorhabditis elegans.
    statement: >-
      DAF-4 is shared with the dauer pathway (with DAF-1). SMA-6 is the type I
      receptor that gives the body-size pathway its specificity.
    supporting_text: >-
      mutations in sma-6, sma-2, sma-3, or sma-4 do not produce constitutive
      dauers, which demonstrates that the unique biological functions of daf-4
      are mediated by distinct type I receptors functioning in parallel
      pathways
  - source_id: PMID:17374156
    title: Regulation of Caenorhabditis elegans body size and male tail development by the novel gene lon-8.
    statement: >-
      LON-8 controls body size independently of the Sma/Mab pathway, so it is
      not a member of this module.
    supporting_text: >-
      Our results suggest that LON-8 regulates body size independently of the
      Sma/Mab pathway.
  - source_id: PMID:29162682
    title: Caenorhabditis elegans DBL-1/BMP Regulates Lipid Accumulation via Interaction with Insulin Signaling.
    statement: >-
      Lipid regulation is a separate DBL-1 output that acts through epidermal
      SMA-3 and upstream of insulin/IGF-1 signaling. It is outside the
      body-size boundary.
    supporting_text: >-
      genetic evidence indicates that DBL-1/BMP functions upstream of
      Insulin/IGF-1 Signaling in lipid metabolism
  - source_id: file:genes/worm/dbl-1/dbl-1-ai-review.yaml
    title: worm dbl-1 gene review
    statement: >-
      The dbl-1 review accepts growth factor activity in the BMP signaling
      pathway and positive regulation of multicellular organism growth as the
      DBL-1 core function.
  - source_id: file:genes/worm/sma-6/sma-6-ai-review.yaml
    title: worm sma-6 gene review
    statement: >-
      The sma-6 review takes BMP receptor activity as the SMA-6 core function,
      as the type I receptor that with DAF-4 transduces DBL-1 signals at the
      basolateral plasma membrane of hypodermal cells.
  - source_id: file:genes/worm/daf-4/daf-4-ai-review.yaml
    title: worm daf-4 gene review
    statement: >-
      The daf-4 review gives DAF-4 two core functions: BMP receptor activity
      with SMA-6 in DBL-1 body-size signaling, and transforming growth factor
      beta receptor activity with DAF-1 in DAF-7 dauer signaling. Only the
      first is inside this module.
  - source_id: file:genes/worm/sma-2/sma-2-ai-review.yaml
    title: worm sma-2 gene review
    statement: >-
      The sma-2 review takes RNA polymerase II-specific DNA-binding
      transcription factor activity in BMP signaling and growth as the SMA-2
      core function.
  - source_id: file:genes/worm/sma-3/sma-3-ai-review.yaml
    title: worm sma-3 gene review
    statement: >-
      The sma-3 review describes SMA-3 as the principal R-Smad of the
      pathway. It also records an epidermal antifungal caenacin branch that
      needs SMA-3 but not SMA-2 or SMA-4.
  - source_id: file:genes/worm/sma-4/sma-4-ai-review.yaml
    title: worm sma-4 gene review
    statement: >-
      The sma-4 review describes SMA-4 as the co-Smad of the pathway, with no
      role in dauer control.
  - source_id: file:genes/worm/sma-9/sma-9-ai-review.yaml
    title: worm sma-9 gene review
    statement: >-
      The sma-9 review takes transcription corepressor activity as the main
      SMA-9 function in body size, with coactivator activity in male tail
      patterning and an antagonistic role toward BMP signaling in the M
      lineage.
  - source_id: file:genes/worm/sma-10/sma-10-ai-review.yaml
    title: worm sma-10 gene review
    statement: >-
      The sma-10 review takes type I and type II TGF-beta receptor binding as
      SMA-10 core functions, in positive regulation of BMP signaling.
  - source_id: file:genes/worm/lon-1/lon-1-ai-review.yaml
    title: worm lon-1 gene review
    statement: >-
      The lon-1 review takes sterol binding (shown in vitro, natural ligand
      unknown) as the LON-1 molecular function, in negative regulation of
      growth and of BMP signaling.
  - source_id: file:genes/worm/lon-2/lon-2-ai-review.yaml
    title: worm lon-2 gene review
    statement: >-
      The lon-2 review asserts no molecular function for LON-2. It finds that
      the LON-2/DBL-1 association in the worm is indirect, through SMOC-1.
  - source_id: file:genes/worm/lon-8/lon-8-ai-review.yaml
    title: worm lon-8 gene review
    statement: >-
      The lon-8 review describes LON-8 as a secreted hypodermal BPTI-like
      protein that acts independently of the Sma/Mab pathway and interacts
      genetically with cuticle collagen-modifying enzymes.
  - source_id: file:modules/bmp_signaling.yaml
    title: BMP signaling pathway module
    statement: >-
      Taxon-neutral BMP module (receptor engagement, receptor Smad
      phosphorylation, transcriptional output) that this nematode module
      instantiates.
  - source_id: file:modules/tgfb_smad_signaling.yaml
    title: TGF-beta receptor-SMAD signaling pathway module
    statement: >-
      Generic ligand, type II/type I receptor and SMAD transcription module
      that provides the shared receptor-Smad logic.
notes: >-
  Boundary. A concrete C. elegans module for the DBL-1 (Sma/Mab) BMP-like
  pathway in body size control. Root parts: the DBL-1 ligand; two cell-surface
  modulators (LON-2 glypican, negative; SMA-10 LRIG, positive); the SMA-6/DAF-4
  receptor pair; the SMA-2/SMA-3/SMA-4 Smads; the SMA-9 cofactor; and the
  repressed body-size target LON-1. Male tail ray patterning uses the same
  core and is recorded in prose only. Other outputs that share the ligand and
  receptors are outside this boundary: epidermal antifungal caenacin
  induction (PMID:19198592, modeled in GO-CAM gomodel:5b91dbd100002241),
  lipid storage via insulin signaling (PMID:29162682), and the SMA-3 branch
  of molting AMP induction noted in MODULE:c_elegans_jak_independent_stat_signaling.
  Other positive regulators of the pathway (the RGM protein DRAG-1, the
  tetraspanins TSP-12/TSP-14 with SUP-17, and UNC-40) are not modeled.

  Excluded member. LON-8 was checked and is excluded. Its gene review and
  the primary paper (PMID:17374156) show that it regulates body size and male
  ray morphology independently of the Sma/Mab pathway, and that its mRNA is
  not changed in dbl-1 or sma-6 mutants, unlike lon-1.

  Relation to generic modules. MODULE:bmp_signaling and
  MODULE:tgfb_smad_signaling describe ligand-receptor engagement, type I
  receptor phosphorylation of receptor Smads, and Smad transcriptional
  output. This worm module follows that trunk. DAF-4 is the type II receptor
  shared with the DAF-7 dauer pathway, and SMA-6 is the type I receptor
  specific to this pathway. Receptor phosphorylation of SMA-2/SMA-3 is
  inferred from the conserved mechanism and is not directly evidenced in the
  sources used here. A Schnurri cofactor (SMA-9) and extracellular modulators
  are added.

  Grounding. DBL-1 G5EEL5 comes from its gene review. The other accessions
  come from UniProt REST (organism 6239): SMA-6 Q09488, DAF-4 P50488, SMA-2
  Q02330, SMA-3 P45896, SMA-4 P45897, SMA-9 Q7JM44, LON-1 Q09566 and SMA-10
  Q965M2 (all Swiss-Prot), and LON-2 Q18530 (TrEMBL; the only lon-2 entry).
  Every grounded protein has a gene review, and each annoton MF follows the
  core_functions of that review. SMA-6 and DAF-4 use BMP receptor activity
  (GO:0098821, a child of GO:0004675). DAF-4 also has transforming growth
  factor beta receptor activity with DAF-1 in the DAF-7 dauer pathway, which
  is outside this module. SMA-2, SMA-3 and SMA-4 use RNA polymerase
  II-specific DNA-binding transcription factor activity. SMA-10 uses type I
  TGF-beta receptor binding; its review also records type II receptor
  binding (GO:0005114, to DAF-4). SMA-9 uses transcription corepressor
  activity, matching its main role in body size; its review also records
  coactivator activity in male tail patterning and an antagonistic,
  opposite-sign role in M-lineage dorsoventral patterning. LON-1 uses sterol
  binding, shown only in vitro. LON-2 is modeled with no MF, following its
  review: an earlier draft gave growth factor binding (GO:0019838) from
  BMP2 binding in vitro, but worm LON-2 did not bind DBL-1 in co-IP, and
  SMOC-1 bridges the two (PMID:37590248). SMOC-1 has no gene review and is
  not modeled as a part.
module:
  id: c_elegans_dbl1_body_size_signaling
  label: DBL-1 Sma/Mab BMP-like body size pathway in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Neuronal DBL-1 acts through hypodermal SMA-6/DAF-4 receptors and the
    SMA-2/SMA-3/SMA-4 Smads, with the cofactor SMA-9, to promote body growth,
    in part by repressing lon-1. LON-2 and SMA-10 tune signaling at the cell
    surface.
  concepts:
    - preferred_term: BMP signaling pathway
      term:
        id: GO:0030509
        label: BMP signaling pathway
    - preferred_term: positive regulation of multicellular organism growth
      term:
        id: GO:0040018
        label: positive regulation of multicellular organism growth
      description: >-
        The body-size output. DBL-1 dose correlates with body length.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    anatomical_locations:
      - preferred_term: hypodermis
        description: >-
          WBbt:0005733 hypodermis. The receiving tissue in which SMA-6 and
          SMA-3 activity are necessary and sufficient for body size. The WBbt
          id is given in text because the WBbt prefix is not configured for
          label validation.
  gocam_associations:
    - model: gomodel:5b91dbd100002241
      title: Antifungal innate immune response in the hypodermis via transforming growth factor beta receptor signaling pathway (C. elegans)
      description: >-
        This GO-CAM models the same DBL-1, SMA-6, DAF-4 and SMA-3 core for the
        antifungal caenacin output, not for body size. It shares activities
        with this module but not the output.
  parts:
    - order: 1
      role: BMP-like ligand
      node:
        id: dbl1_ligand
        label: DBL-1 ligand secretion
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: dbl1_growth_factor
            label: DBL-1 BMP-like growth factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DBL-1
                term:
                  id: UniProtKB:G5EEL5
                  label: Protein dbl-1
            function:
              preferred_term: growth factor activity
              term:
                id: GO:0008083
                label: growth factor activity
            processes:
              - preferred_term: BMP signaling pathway
                term:
                  id: GO:0030509
                  label: BMP signaling pathway
              - preferred_term: positive regulation of multicellular organism growth
                term:
                  id: GO:0040018
                  label: positive regulation of multicellular organism growth
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Dose-dependent, mainly neuronal ligand that signals in a
              paracrine way to the hypodermis.
            gocam_associations:
              - model: gomodel:5b91dbd100002241
                activity: gomodel:5b91dbd100002241/5b91dbd100002246
                title: Antifungal innate immune response in the hypodermis via transforming growth factor beta receptor signaling pathway (C. elegans)
            evidence:
              - source_id: PMID:9847238
                title: A BMP homolog acts as a dose-dependent regulator of body size and male tail patterning in Caenorhabditis elegans.
                statement: DBL-1 is a dose-dependent regulator of body size and male tail patterning.
                supporting_text: >-
                  indicating that DBL-1 acts as a dose-dependent regulator of
                  these processes
              - source_id: PMID:9847238
                title: A BMP homolog acts as a dose-dependent regulator of body size and male tail patterning in Caenorhabditis elegans.
                statement: DBL-1 is the ligand of a Smad pathway.
                supporting_text: >-
                  Evidence from genetic interactions indicates that these
                  effects are mediated by a Smad signaling pathway, for which
                  DBL-1 is a previously unidentified ligand.
    - order: 2
      role: glypican restraint of ligand-receptor signaling
      node:
        id: lon2_glypican
        label: LON-2 glypican negative regulation
        module_type: REGULATORY_STEP
        annotons:
          - id: lon2_binding
            label: LON-2 glypican
            participant:
