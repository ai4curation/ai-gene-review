knowledge_gaps:
  - gap_statement: >-
      How LON-2 lowers DBL-1 receptor signaling is not established. Worm
      LON-2 does not bind DBL-1 directly in co-IP, and whether a
      LON-2/SMOC-1/DBL-1 complex sequesters the ligand in vivo is not shown.
    boundary: >-
      Direct LON-2 binding has been shown only to human BMP2 in vitro, and
      SMOC-1 bridges LON-2 and DBL-1 in vitro. Placement upstream of dbl-1 is
      genetic.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the glypican acts as a ligand sink, a co-receptor
      that diverts DBL-1, or through another mechanism.
    resolution: >-
      Imaging of tagged DBL-1 distribution in lon-2 and smoc-1 mutants, and
      tests of whether SMOC-1 binding is needed for LON-2 to inhibit
      signaling.
    provenance:
      - reference_id: PMID:17240342
        supporting_text: >-
          We propose that LON-2 binding to DBL-1 negatively regulates this
          pathway in C. elegans by attenuating ligand-receptor interactions.
      - reference_id: PMID:37590248
        supporting_text: >-
          We did not detect any association between LON-2/glypican with
          either full-length DBL-1
  - gap_statement: >-
      How the Smad-SMA-9 output controls hypodermal growth is unclear. It is
      not known whether lon-1 is a direct Smad target, and the sterol or other
      ligand that LON-1 binds in vivo, and how that restrains growth, is
      unknown.
    boundary: >-
      lon-1 is placed downstream genetically and its mRNA rises in sma-6
      mutants. Smad or SMA-9 occupancy of the lon-1 locus is not shown in the
      sources used here.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Connects the conserved receptor-Smad trunk to the cellular mechanism of
      body size (hypodermal cell size and ploidy).
    resolution: >-
      SMA-3 and SMA-9 ChIP at the lon-1 locus, and identification of the
      LON-1 ligand in vivo.
    provenance:
      - reference_id: PMID:12051826
        supporting_text: >-
          In general, Smads have been shown to both positively and negatively
          regulate the transcriptional activity of downstream target genes in
          various organisms. In C. elegans, however, target genes have remained
          elusive.
