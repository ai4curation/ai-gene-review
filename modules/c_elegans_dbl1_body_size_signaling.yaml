        id: GO:0030509
        label: BMP signaling pathway
    - preferred_term: positive regulation of multicellular organism growth
      term:
        id: GO:0040018
        label: positive regulation of multicellular organism growth
      description: >-
        The body-size output. DBL-1 dose correlates with body length.
