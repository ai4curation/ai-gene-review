knowledge_gaps:
  - gap_statement: >-
      Whether LON-2 binds DBL-1 in vivo, and how a glypican bound to the ligand
      lowers receptor signaling, is not established.
    boundary: >-
      LON-2 binding has been shown only to human BMP2 in vitro. Placement
      upstream of dbl-1 is genetic.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the glypican acts as a ligand sink, a co-receptor
      that diverts DBL-1, or through another mechanism.
    resolution: >-
      DBL-1-LON-2 binding assays with purified worm proteins, and imaging of
      tagged DBL-1 distribution in lon-2 mutants.
    provenance:
      - reference_id: PMID:17240342
        supporting_text: >-
          We propose that LON-2 binding to DBL-1 negatively regulates this
          pathway in C. elegans by attenuating ligand-receptor interactions.
  - gap_statement: >-
      How the Smad-SMA-9 output controls hypodermal growth is unclear. It is
      not known whether lon-1 is a direct Smad target, and the molecular
      activity of LON-1 is unknown.
    boundary: >-
      lon-1 is placed downstream genetically and its mRNA rises in sma-6
      mutants. Smad or SMA-9 occupancy of the lon-1 locus is not shown in the
      sources used here.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Connects the conserved receptor-Smad trunk to the cellular mechanism of
      body size (hypodermal cell size and ploidy).
    resolution: >-
      SMA-3 and SMA-9 ChIP at the lon-1 locus, and biochemical study of the
      LON-1 CAP/CRISP domain.
    provenance:
      - reference_id: PMID:12051826
        supporting_text: >-
          In general, Smads have been shown to both positively and negatively
          regulate the transcriptional activity of downstream target genes in
          various organisms. In C. elegans, however, target genes have remained
          elusive.
