                  with either full-length DBL-1
              - source_id: PMID:37590248
                title: SMOC-1 interacts with both BMP and glypican to regulate BMP signaling in C. elegans.
                statement: SMOC-1 can bind LON-2 and DBL-1 at the same time.
                supporting_text: >-
                  Moreover, CeSMOC-1 can simultaneously bind LON-2/glypican and
                  DBL-1/BMP.
