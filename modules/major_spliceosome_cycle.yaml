          SNW1 and BUD31 transcription coactivator rows reflect separate roles and are not used. WBP11
          and PQBP1 are placed here on RGD's list and their interaction; their stage is uncertain.
        evidence:
        - source_id: PMID:22246180
          statement: RBM22, like yeast Cwc2, contacts the catalytic RNA elements of the active spliceosome.
          supporting_text: >-
            These interactions are evolutionarily conserved, as shown by studies with Cwc2's human counterpart
            RBM22, indicating that Cwc2/RBM22-RNA contacts are functionally important.
        - source_id: PMID:25599396
          statement: Aquarius enters spliceosomes in a pentameric intron-binding complex.
          supporting_text: >-
            We show that Aquarius is integrated into spliceosomes as part of a pentameric intron-binding
            complex (IBC)
        - source_id: PMID:16595688
          statement: PPIL1 is recruited by SKIP just before step 1.
          supporting_text: >-
            It is recruited by SKIP, another essential component of 45 S activated spliceosome, into spliceosome
            just before the catalytic step 1.
        - source_id: PMID:29361316
          statement: Human Bact differs from yeast by containing Aquarius and peptidyl-prolyl isomerases.
          supporting_text: >-
            important differences include the presence of the RNA helicase aquarius and peptidyl prolyl
            isomerases
      - id: dhx16_bact_to_bstar
        label: DHX16 (PRP2) remodels Bact into the catalytically primed B*
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: DHX16
            term:
              id: UniProtKB:O60231
              label: Pre-mRNA-splicing factor ATP-dependent RNA helicase DHX16
        function:
          preferred_term: RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
        processes:
        - preferred_term: generation of catalytic spliceosome for first transesterification step
          term:
            id: GO:0000349
            label: generation of catalytic spliceosome for first transesterification step
        locations: *id002
        role_description: >-
          Curator-authored function: no experimental human GOA row; RNA helicase activity is supported
          for DHX16 by TAS (PMID:9547260, Reactome) and IBA rows. Its experimental human rows (pattern
          recognition receptor, adaptor, ubiquitin binding; PMID:35263596) concern antiviral RIG-I signalling
          and are not used here.
        evidence:
        - source_id: PMID:29360106
          statement: An ordered flux of components through B-to-Bact and Bact-to-B* primes the active
            site for branching.
          supporting_text: >-
            reveal an ordered flux of components in the B-to-Bact and the Bact-to-B* transitions, which
            ultimately prime the active site for the branching reaction
        - source_id: PMID:29361316
          statement: Bact is activated but blocked before the first catalytic step.
          supporting_text: >-
            In the Bact state, the spliceosome is activated but not catalytically primed, so that it is
            functionally blocked prior to the first catalytic step of splicing.
  - order: 5
    role: 'C: branching'
    node:
      id: complex_c
      label: B* to C (branching)
      module_type: PROTEIN_COMPLEX
      description: >-
        In B* the branch adenosine 2'-OH attacks the 5' splice site, producing the free 5' exon and the
        lariat intermediate (C complex). DHX38 (PRP16) then remodels C into C*, moving the branch helix
        out of the active site to make room for the 3' splice site. The exon junction complex is deposited
        on the 5' exon at this stage.
      concepts:
      - preferred_term: U2-type catalytic step 2 spliceosome
        term:
          id: GO:0071007
          label: U2-type catalytic step 2 spliceosome
      annotons:
      - id: branching_reaction
        label: The spliceosome catalyses branching, with U6 snRNA positioning the catalytic metals
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: Catalytic spliceosome (U2/U6 snRNA active site on the PRPF8 scaffold)
            term:
              id: GO:0071007
              label: U2-type catalytic step 2 spliceosome
        function:
          preferred_term: first spliceosomal transesterification activity
          term:
            id: GO:0000384
            label: first spliceosomal transesterification activity
        processes:
        - *id001
        locations: *id002
        role_description: >-
          The first transesterification is catalysed by RNA: U6 snRNA positions the two catalytic metal
          ions, with U2/U6 forming the active site on the PRPF8 scaffold. The activity is therefore placed
          on the spliceosome as an RNP, not on any protein. The participant is written with the C-complex
          term (the product state of branching); its protein content is the snRNPs and NTC/NTR units modelled
          in the earlier parts. Step 1 factors CCDC49 (CWC25) and CCDC94 (YJU2) are not in RGD's list
          and are not added.
        evidence:
        - source_id: PMID:24196718
          statement: U6 snRNA catalyses both splicing reactions by positioning divalent metals.
          supporting_text: >-
            here we show that the U6 snRNA catalyses both of the two splicing reactions by positioning
            divalent metals that stabilize the leaving groups during each reaction
        - source_id: PMID:24196718
          statement: RNA mediates catalysis within the spliceosome.
          supporting_text: Our results demonstrate that RNA mediates catalysis within the spliceosome.
        - source_id: PMID:29301961
          statement: Branching produces the catalytic step I spliceosome (C complex).
          supporting_text: The branching reaction leads to the formation of the catalytic step I spliceosome
            (C complex).
      - id: dhx38_c_to_cstar
        label: DHX38 (PRP16) remodels C into C*
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: DHX38
            term:
              id: UniProtKB:Q92620
              label: Pre-mRNA-splicing factor ATP-dependent RNA helicase PRP16
        function:
          preferred_term: RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
        processes:
        - preferred_term: generation of catalytic spliceosome for second transesterification step
          term:
            id: GO:0000350
            label: generation of catalytic spliceosome for second transesterification step
        locations: *id002
        role_description: >-
          Curator-authored function: no experimental human GOA row; RNA helicase activity is supported
          for DHX38 by Reactome TAS and IBA (3'-5' RNA helicase) rows.
        evidence:
        - source_id: PMID:28076346
          statement: The human C* structure is of a spliceosome stalled directly after PRP16 action.
          supporting_text: >-
            Here we report a 3D cryo-electron microscopy structure of the human spliceosomal C complex
            stalled directly after PRP16 action (C*).
        - source_id: PMID:28076346
          statement: PRP16 likely facilitates many RNP rearrangements including a large movement of U2
            snRNP.
          supporting_text: >-
            Comparison of the structure of the yeast C and human C* complexes reveals numerous RNP rearrangements
            that are likely to be facilitated by PRP16, including a large-scale movement of the U2 small
            nuclear RNP.
      parts:
      - order: 1
        role: EJC deposition on the 5' exon (modelled in nonsense_mediated_mrna_decay)
        optional: true
        node:
          id: ejc_deposition
          label: Exon junction complex deposition
          description: >-
            The EJC core (EIF4A3, MAGOH or MAGOHB, RBM8A) is loaded upstream of the exon-exon junction
            by the C/C* spliceosome; it is modelled in the nonsense-mediated decay module and referenced
            here.
          module_ref: nonsense_mediated_mrna_decay#ejc_mark
          evidence:
          - source_id: PMID:28502770
            statement: In human C* the EJC binds 5'-exon sequences and associates with CWC22 and SNU114.
            supporting_text: >-
              the quaternary exon junction complex (EJC) recognizes upstream 5'-exon sequences and associates
              with Cwc22 and the GTPase Snu114
  - order: 6
    role: 'C*/P: exon ligation and mRNA release'
    node:
      id: complex_cstar_p
      label: C* to P (exon ligation)
      module_type: PROTEIN_COMPLEX
      description: >-
        In C* the 3' splice site docks in the active site, stabilised by PRPF18, SLU7 and CDC40 (PRP17),
        and the 5' exon 3'-OH attacks it, ligating the exons (P complex). DHX8 (PRP22) then releases the
        spliced mRNA.
      concepts:
      - preferred_term: U2-type post-spliceosomal complex
        term:
          id: GO:0071021
          label: U2-type post-spliceosomal complex
      annotons:
      - id: exon_ligation
        label: The spliceosome catalyses exon ligation
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: C* spliceosome (U2/U6 snRNA active site on the PRPF8 scaffold)
            term:
              id: GO:0071007
              label: U2-type catalytic step 2 spliceosome
        function:
          preferred_term: second spliceosomal transesterification activity
          term:
            id: GO:0000386
            label: second spliceosomal transesterification activity
        processes:
        - *id001
        locations: *id002
        role_description: >-
          The second transesterification is catalysed by the same U6 snRNA metal-ion active site as branching
          and is placed on the C* spliceosome as an RNP. SLU7 carries an IDA row for second spliceosomal
          transesterification activity (PMID:10197984); that paper shows SLU7 is needed for a structural
          change before step 2, not catalysis, so the activity is not given to SLU7 (see notes).
        evidence:
        - source_id: PMID:24196718
          statement: U6 snRNA catalyses both splicing reactions.
          supporting_text: >-
            here we show that the U6 snRNA catalyses both of the two splicing reactions by positioning
            divalent metals that stabilize the leaving groups during each reaction
        - source_id: PMID:30728453
          statement: >-
            In P complex the 3' splice site is recognised by the junction of the 5' splice site and branch
            sequence.
          supporting_text: >-
            In the P complex, the ligated exon remains anchored to loop I of U5 small nuclear RNA, and
            the 3'-splice site is recognized by the junction between the 5'-splice site and the branch
            point sequence.
      - id: step2_factors
        label: Second-step factors position the 3' splice site
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: Second-step factors
            active_units:
            - id: unit_cdc40
              label: CDC40
              role: PRP17; WD40 protein that stabilises the active-site conformation
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: CDC40
                  term:
                    id: UniProtKB:O60508
                    label: Pre-mRNA-processing factor 17
            - id: unit_slu7
              label: SLU7
              role: extended protein bound to PRPF8, poised for 3' splice site selection
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: SLU7
                  term:
                    id: UniProtKB:O95391
                    label: Pre-mRNA-splicing factor SLU7
            - id: unit_prpf18
              label: PRPF18
              role: PRP18; with SLU7 promotes step 2
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: PRPF18
                  term:
                    id: UniProtKB:Q99633
                    label: Pre-mRNA-splicing factor 18
        processes:
        - preferred_term: generation of catalytic spliceosome for second transesterification step
          term:
            id: GO:0000350
            label: generation of catalytic spliceosome for second transesterification step
        locations: *id002
        role_description: >-
          No molecular function is asserted: CDC40 and PRPF18 have only generic RNA binding in human GOA,
          and SLU7's IDA rows (second transesterification, 3'-splice site binding from a stress-relocalisation
          paper) are not used. In the human P structure the 3' splice site docks without PRPF18.
        evidence:
        - source_id: PMID:28502770
          statement: PRP17 stabilises the active site and SLU7 binds PRPF8, poised for 3' splice site
            selection.
          supporting_text: >-
            The splicing factor Prp17 stabilizes the active site conformation. The step II factor Slu7
            adopts an extended conformation, binds Prp8 and Cwc22, and is poised for selection of the
            3'-splice site.
        - source_id: PMID:10197984
          statement: SLU7 is required for a structural change of the spliceosome before step 2 catalysis.
          supporting_text: >-
            indicate that hSlu7 is required for a structural alteration of the spliceosome prior to the
            establishment of the catalytically active spliceosome for step II
        - source_id: PMID:30705154
          statement: In the human P complex the 3' splice site docks through RNA interactions without
            PRP18.
          supporting_text: The 3'SS docks at the active site through conserved RNA interactions in the
            absence of Prp18.
      - id: cstar_p_exon_binding_units
        label: SR-related matrix proteins of the catalytic spliceosomes
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: SRm300 and SRm160
            active_units:
            - id: unit_srrm2
              label: SRRM2
              role: >-
                SRm300; bound to the 5' exon and the PRPF8 Switch loop in C* and P, released at the P-to-ILS
                transition
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: SRRM2
                  term:
                    id: UniProtKB:Q9UQ35
                    label: Serine/arginine repetitive matrix protein 2
            - id: unit_srrm1
              label: SRRM1
              role: SRm160; SRRM2 partner and splicing coactivator in catalytic spliceosomes
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: SRRM1
                  term:
                    id: UniProtKB:Q8IYB3
                    label: Serine/arginine repetitive matrix protein 1
        processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
        locations: *id002
        role_description: >-
          Structural units without a function. SRRM2 has experimental part-of rows for the human Bact,
          C, C* and post-spliceosomal complexes (IDA/IPI, including PMID:28076346 and PMID:30728453) but
          no experimental molecular function beyond generic RNA binding (HDA) and a zinc-finger binding
          row; SRRM1 has part-of rows for the catalytic step 2 spliceosome (IDA, PMID:11991638) and likewise
          only generic RNA binding. They are modelled here, not with the SR-protein regulators, because
          they are structural parts of the catalytic spliceosome.
        evidence:
        - source_id: PMID:30728453
          statement: In the human P complex SRm300 (SRRM2), CWC22 and the EJC bind the 5'-exon upstream
            sequences.
          supporting_text: >-
            In the P complex, the splicing factors SRm300 and Cwc22 and the exon junction complex (EJC)
            are bound to the upstream sequences of the 5′-exon
      - id: dhx8_mrna_release
        label: DHX8 (PRP22) releases the spliced mRNA
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: DHX8
            term:
              id: UniProtKB:Q14562
              label: ATP-dependent RNA helicase DHX8
        function:
          preferred_term: RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
        processes:
        - preferred_term: spliceosomal complex disassembly
          term:
            id: GO:0000390
            label: spliceosomal complex disassembly
        locations: *id002
        role_description: >-
          Curator-authored function: no experimental human GOA row; RNA helicase activity is supported
          for DHX8 by TAS (PMID:7935475), Reactome, IBA and ISS rows.
        evidence:
        - source_id: PMID:30728453
          statement: PRP22 leaves with the ligated exon in the P-to-ILS transition.
          supporting_text: >-
            The ATPase/helicase Prp22, along with the ligated exon and eight other proteins, are dissociated
            in the P-to-ILS transition.
        - source_id: PMID:28076346
          statement: PRP22 sits far from the catalytic centre and probably destabilises the mRNA from
            a distance.
          supporting_text: >-
            RNA helicase PRP22 is located about 100 Å from the catalytic centre, suggesting that it destabilizes
            the spliced mRNA after step two from a distance.
        - source_id: PMID:7935475
          statement: HRH1 (DHX8) is a functional human homologue of yeast Prp22.
          supporting_text: These results strongly suggest that HRH1 is a functional human homolog of the
            yeast Prp22 protein.
  - order: 7
    role: 'ILS: disassembly and snRNP recycling'
    node:
      id: complex_ils
      label: Intron lariat spliceosome and disassembly
      module_type: PROTEIN_COMPLEX
      description: >-
        After mRNA release the intron lariat spliceosome (ILS) is disassembled by DHX15 (PRP43), releasing
        the lariat for debranching and the U2, U5 and U6 snRNPs; SART3 re-anneals U4 and U6 to regenerate
        the di-snRNP for another round.
      concepts:
      - preferred_term: U2-type post-mRNA release spliceosomal complex
        term:
          id: GO:0071008
          label: U2-type post-mRNA release spliceosomal complex
      annotons:
      - id: dhx15_disassembly
        label: DHX15 (PRP43) disassembles the intron lariat spliceosome
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: DHX15
            term:
              id: UniProtKB:O43143
              label: ATP-dependent RNA helicase DHX15
        function:
          preferred_term: RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
        processes:
        - preferred_term: spliceosomal complex disassembly
          term:
            id: GO:0000390
            label: spliceosomal complex disassembly
        locations: *id002
        role_description: >-
          RNA helicase activity is experimental (IDA, PMID:32179686), stimulated by G-patch proteins.
          Its spliceosomal G-patch activator TFIP11 is not in RGD's list and is not added. DHX15 also
          acts in ribosome biogenesis (outside this module).
        evidence:
        - source_id: PMID:30728453
          statement: The human ILS exists with and without PRP43.
          supporting_text: >-
            Intriguingly, the ILS complex exists in two distinct conformations, one with the ATPase/helicase
            Prp43 and one without.
        - source_id: PMID:32179686
          statement: G-patch binding increases the helicase and ATPase activity of DHX15.
          supporting_text: >-
            Concomitantly, RNA affinity, helicase, and ATPase activity of DHX15 are increased when G-patch
            is bound.
      - id: sart3_u4_u6_recycling
        label: SART3 re-anneals U4 and U6 snRNAs for the next cycle
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: SART3
            term:
              id: UniProtKB:Q15020
              label: Spliceosome associated factor 3, U4/U6 recycling protein
        function:
          preferred_term: U6 snRNA binding
          term:
            id: GO:0017070
            label: U6 snRNA binding
        processes:
        - preferred_term: spliceosomal snRNP assembly
          term:
            id: GO:0000387
            label: spliceosomal snRNP assembly
        locations: *id002
        role_description: >-
          SART3 (p110, PRP24 orthologue) binds free U6 snRNA (IDA, PMID:12032085) and reassembles U4/U6;
          it is not a spliceosome component. Placed here as the recycling step that closes the cycle;
          the spliceosomal_snrnp_biogenesis module may reference it.
        evidence:
        - source_id: PMID:12032085
          statement: SART3 (p110) functions in reassembly of the U4/U6 snRNP.
          supporting_text: >-
            Using an in vitro recycling assay, we demonstrate that p110 functions in the reassembly of
            the U4/U6 snRNP.
        - source_id: PMID:12032085
          statement: SART3 associates only transiently with U6 and U4/U6 snRNPs during recycling.
          supporting_text: >-
            associates only transiently with U6 and U4/U6 snRNPs during the recycling phase of the spliceosome
            cycle
  connections:
  - source: complex_e_a
    target: complex_b
    connection_type: PRECEDES
    description: The tri-snRNP joins the prespliceosome.
  - source: complex_b
    target: complex_bact
    connection_type: PRECEDES
    description: BRR2 unwinds U4/U6; U1 and U4 leave and the NTC joins.
  - source: complex_bact
    target: complex_c
    connection_type: PRECEDES
    description: DHX16 releases the branch site from SF3b; branching follows.
  - source: complex_c
    target: complex_cstar_p
    connection_type: PRECEDES
    description: DHX38 converts C into C*; exon ligation follows.
  - source: complex_cstar_p
    target: complex_ils
    connection_type: PRECEDES
    description: DHX8 releases the spliced mRNA.
  - source: snrnps
    target: complex_e_a
    connection_type: PROVIDES_INPUT_FOR
    description: U1 snRNP (5' splice site) and 17S U2 snRNP (branch site) enter at E/A.
  - source: snrnps
    target: complex_b
    connection_type: PROVIDES_INPUT_FOR
    description: The U4/U6.U5 tri-snRNP enters at pre-B.
  - source: complex_ils
    target: snrnps
    connection_type: PROVIDES_INPUT_FOR
    description: Disassembly releases U2, U5 and U6 snRNPs, which are recycled (U4/U6 reannealed by SART3).
