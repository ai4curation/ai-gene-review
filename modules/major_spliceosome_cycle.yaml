        locations: *id002
        role_description: >-
          DDX23 enters as a unit of the human tri-snRNP (tri_snrnp node) and is repeated here as the driver
          of the pre-B to B transition. No helicase function is asserted: its only experimental row is
          NOT helicase activity (PMID:9539711), its RNA helicase rows are TAS/IBA, and its activity in
          human B complex formation has not been assayed biochemically.
        evidence:
