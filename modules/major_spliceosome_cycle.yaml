id: MODULE:major_spliceosome_cycle
title: >-
  Human major (U2-type) spliceosome cycle — snRNPs (Sm and LSm2-8 rings, U1, U2 with SF3a/SF3b, U4/U6,
  U5, tri-snRNP) assembling through the E/A, B, Bact/B*, C, C*/P and ILS states, the NineTeen complex,
  and the DEAD/DEAH-box ATPases that drive each transition, with RNA-catalysed branching and exon ligation
description: >-
  The major spliceosome removes U2-type (GT-AG) introns from pre-mRNA by two transesterification reactions.
  It is not a preformed enzyme but assembles anew on each intron from five small nuclear ribonucleoproteins
  (snRNPs) and many non-snRNP proteins. U1 snRNP recognises the 5' splice site, SF1 and U2AF the branch-point
  sequence and polypyrimidine tract (E complex), and the 17S U2 snRNP, through its SF3a and SF3b subcomplexes
  and the DEAD-box protein DDX46 (PRP5), pairs U2 snRNA with the branch site to form the prespliceosome
  (A complex). The pre-assembled U4/U6.U5 tri-snRNP then joins (pre-B); DDX23 (PRP28) hands the 5' splice
  site from U1 to U6 (B complex), and the U5 helicase BRR2 (SNRNP200) unwinds U4/U6, releasing U1 and
  U4 and letting U6 pair with U2. The NineTeen complex (PRP19/CDC5L) and NTC-related proteins join to
  form the activated Bact complex, which DHX16 (PRP2) converts to the catalytically primed B*. The first
  reaction (branching) forms the lariat intermediate (C complex); DHX38 (PRP16) remodels C into C*, the
  second-step factors position the 3' splice site, and exon ligation produces the post-catalytic P complex.
  DHX8 (PRP22) releases the spliced mRNA, carrying the exon junction complex deposited during catalysis,
  and DHX15 (PRP43) disassembles the intron lariat spliceosome so that the snRNPs can be recycled. Both
  chemical steps are catalysed by RNA: U6 snRNA positions two catalytic metal ions within a U2/U6 active
  site held on the protein scaffold PRPF8.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001073
  title: spliceosome pathway
  statement: >-
    RGD's spliceosome pathway diagram describes the consensus major spliceosome cycle, its snRNPs, the
    Prp19 complex and the DExD/H-box ATPases. RGD curates 153 human genes to it in homo_genes_pw (114
    by the seed's curated count); this module realises the core-cycle part under the split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md
    (item 2), with 90 of the genes as participants.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
  statement: >-
    RGD describes stepwise assembly of discrete complexes ending in the two transesterifications and disassembly.
  supporting_text: It proceeds via a dynamic step-wise assembly of discrete complexes,
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
  statement: RGD names at least eight DExD/H-box ATPases acting in the steps of spliceosome assembly.
  supporting_text: >-
    At least eight DExD/H-type RNA-dependent ATPases/helicases are involved in the various steps of spliceosomal
    assembly.
- source_id: GO:0000398
  title: mRNA splicing, via spliceosome
  statement: >-
    The GO process mapped to PW:0001073 (skos:narrowMatch, curated, from projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml),
    used as the module concept.
- source_id: PMID:24196718
  title: RNA catalyses nuclear pre-mRNA splicing.
  statement: >-
    U6 snRNA catalyses both splicing reactions by positioning catalytic metal ions, so the spliceosome
    is a ribozyme.
  supporting_text: Our results demonstrate that RNA mediates catalysis within the spliceosome.
- source_id: PMID:19239890
  title: 'The spliceosome: design principles of a dynamic RNP machine.'
  statement: >-
    Unlike most RNP enzymes the spliceosome has no preformed active site and is remodelled through assembly,
    activation and catalysis.
  supporting_text: >-
    the spliceosome exhibits exceptional compositional and structural dynamics that are exploited during
    substrate-dependent complex assembly, catalytic activation, and active site remodeling
- source_id: PMID:30728453
  title: Structures of the human spliceosomes before and after release of the ligated exon.
  statement: The human spliceosome passes through eight functional states, each with distinct composition.
  supporting_text: >-
    Pre-mRNA splicing is executed by the spliceosome, which has eight major functional states each with
    distinct composition.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001073 (spliceosome pathway) through the RGD_PATHWAY_ONTOLOGY
  project, as module 2 of the spliceosome split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md;
  seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad). PW:0001073 has no PW children,
  so it is the only PW evidence source; its diagram links (Pol II transcription, microRNA, chromatin modification,
  mRNA export) are not covered here. Sibling modules of this tranche: spliceosomal_snrnp_biogenesis (Sm-ring
  assembly by the SMN complex, snRNP maturation) and splice_site_selection_regulators (SR proteins and
  hnRNPs). The structure follows modules/dmel_spliceosome.yaml (structure only; no Drosophila evidence
  is used). UniProt accessions and recommended names are from UniProt REST (reviewed human entries, November
  2026); molecular functions are from each protein's experimental human GOA rows in QuickGO (November
  2026) unless stated. Only EFTUD2 has a gene review in this repository; its core function (GTP binding
  in U5 snRNP) is used for its unit.

  Shape. Root part 1 holds the snRNP building blocks written once: the Sm ring, the LSm2-8 ring, U1, 17S
  U2 (SF3a and SF3b as units, since GO has no cellular-component term for either), U4/U6, U5 and the tri-snRNP,
  joined by PART_OF connections (the one Sm ring is PART_OF each Sm-class snRNP). Root parts 2-7 are the
  assembly states E/A, B, Bact/B*, C, C*/P and ILS, linked by PRECEDES, each holding the non-snRNP proteins
  that act there and the ATPase that drives the exit from it; snRNPs enter the states by PROVIDES_INPUT_FOR
  connections, and the ILS feeds back to the snRNPs (recycling). The snRNAs (U1, U2, U4, U5, U6) are not
  gene products in this model and appear only in prose. Human Bact and B* share one GO term (U2-type catalytic
  step 1 spliceosome) and are one part; C* and P are one part because exon ligation happens between them.
  GO has no term for E complex other than commitment complex, used with U2-type prespliceosome on the
  E/A part.

  Catalysis. Both transesterifications are RNA-catalysed (U6 snRNA positions the catalytic metals in a
  U2/U6 active site on the PRPF8 scaffold, PMID:24196718). The two catalytic molecular functions, first
  and second spliceosomal transesterification activity, are therefore placed on complex annotons whose
  participant is the spliceosome itself (C and C* complex terms, no active units), not on any protein.
  PRPF8 is a unit without a function. SLU7 carries an IDA row for second spliceosomal transesterification
  activity (PMID:10197984); the paper shows SLU7 is needed for a structural change before step 2, so that
  row probably over-annotates the RNP's activity to one protein and is noted here as a possible upstream
  GOA issue (not asserted on SLU7).

  ATPases. The remodelling ATPases are annotons in the state they drive out of: DDX46 (E/A to A), DDX23
  (pre-B to B), BRR2 (B to Bact), DHX16 (Bact to B*), DHX38 (C to C*), DHX8 (mRNA release) and DHX15 (ILS
  disassembly). BRR2 and DDX23 are snRNP proteins and appear twice, once as units of the U5 snRNP and
  the tri-snRNP and once as transition annotons; this deliberate repetition keeps the snRNPs whole and
  the drivers visible. Experimental human ATPase or helicase rows exist only for BRR2 (IDA/EXP), DHX15
  (IDA/EXP), DDX42 (IDA/EXP) and AQR (IDA, 3'-5' RNA helicase). RNA helicase activity on DDX46, DHX16,
  DHX38 and DHX8 is curator-authored from IBA, ISS and TAS rows (Reactome and the cloning papers) and
  the conserved yeast PRP5/PRP2/PRP16/PRP22 roles; each role_description says so. DDX23 is given no function:
  its one experimental row is NOT helicase activity (PMID:9539711, unwinding in U5 snRNP fractions resided
  in BRR2, not U5-100K). EFTUD2 is given GTP binding (gene review core function), not GTPase activity
  (IBA only). Other functions used: U1 snRNA binding (SNRNP70, SNRPA), U4 snRNA binding (SNU13), U6 snRNA
  3'-end binding (the LSm2-8 ring, from purified-heteromer assays), pre-mRNA binding (SF3B1), pre-mRNA
  3'-splice site binding (U2AF2), U6 snRNA binding (RBM22, SART3), ubiquitin protein ligase activity (PRPF19),
  peptidyl-prolyl isomerase activity (PPIH, PPIL1, PPIE) and pre-mRNA 5'-splice site binding on the U1
  snRNP as a particle (base pairing by U1 snRNA; curator-authored at complex level, no GOA row on the
  complex). Moonlighting rows (CDC5L, SNW1 and BUD31 transcription regulation; DHX16 antiviral sensing;
  USP39 deubiquitinase in DNA-damage and inflammation papers) are not used.

  Membership (90 of RGD's 153 human genes). Included: the 7 Sm and 7 LSm2-8 proteins, U1 (3), U2 (12,
  including PHF5A and SF3B6 of SF3b), U4/U6 (5), U5 (6), tri-snRNP-specific (SART1, USP39, SNRNP27, DDX23),
  E/A factors (SF1, U2AF1, U2AF2, DDX46, DDX42 and a set of U2- or U1-associated proteins), B-specific
  (PRPF38A, PRPF38B, ZMAT2), the NTC (PRPF19, CDC5L, PLRG1, BCAS2, CTNNBL1), NTC-related and intron-binding
  proteins (14), DHX16, DHX38, the second-step factors (CDC40, SLU7, PRPF18), the SR-related matrix proteins
  SRRM2 (SRm300) and SRRM1 (SRm160) as structural units of the C*/P part, DHX8, DHX15, SART3, and AAR2
  as an optional U5 maturation participant (a cytoplasmic PRPF8 placeholder, cited to human structural
  and assembly-intermediate work, PMID:36322420 and PMID:42411410; spliceosomal_snrnp_biogenesis does
  not cover U5-specific maturation). Stage assignments of peripheral factors (RBM25, PRPF40A/B, PUF60,
  CHERP, U2SURP, PRPF38B, CCDC12, WBP11, PQBP1) are provisional and stated in each unit role. No gene
  outside the RGD list is added; missing core proteins are named in role descriptions (HTATSF1, SMU1,
  IK, MFAP1, PRPF4B, UBL5, CCDC49, CCDC94, TFIP11, CWC22, the exon-ligation factors). Excluded, with their
  homes: SR proteins (SRSF1-12, TRA2A, TRA2B) and SR-related SRRM4, hnRNPs (HNRNPA0, A1, A1L2, A2B1, A3,
  AB, C, D, H1, H3, K, L, M, R, U), SYNCRIP, PCBP1, RBMX, RBMXL1, PTBP1, PTBP2, QKI, TIAL1 and MBNL1 go
  to splice_site_selection_regulators (SRRM1 and SRRM2 are modelled here instead, by agreement with that
  sibling, because they are structural parts of the catalytic spliceosome); the EJC core EIF4A3, MAGOH,
  MAGOHB and RBM8A is modelled in nonsense_mediated_mrna_decay and referenced from the C part by module_ref;
  the peripheral EJC/ASAP/PSAP proteins ACIN1, PNN and RNPS1 are kept out of this module and left to nonsense_mediated_mrna_decay,
  which models the EJC (ACIN1 also appears in apoptotic_execution_phase for its apoptotic role); DDX39B
  and THOC1-3 (TREX) are in mrna_nuclear_export; NCBP1 and NCBP2 (cap-binding complex, which aids U1 recruitment)
  are named in pre_mrna_capping; TCERG1 (transcription-splicing coupling) and DDX5 are regulators outside
  the core cycle; HSPA1A, HSPA1B, HSPA1L, HSPA2, HSPA6 and HSPA8 are general chaperones, not spliceosome
  parts; PPIG, PPIL2 and PPIL3 are cyclophilins of the RGD "PPIases" box without an established stage
  or role, and are left out.

  Minor spliceosome (split-plan item 4). RGD's human gene list for PW:0001073 contains no U11/U12-specific
  protein (SNRNP25, SNRNP35, SNRNP48, RNPC3, ZRSR2, PDCD7 and ZCRB1 are all absent), so no minor-spliceosome
  module or variant is made from this pathway and the U12-type spliceosome is out of scope. Shared components
  (Sm, LSm, SNU13, SART3, the U5 snRNP) also act in the minor spliceosome, which is why some carry U4atac
  or U6atac rows.

  GO-CAM links. In gocams/index.tsv three production human models contain members. gomodel:68b0f0d000003584
  (CDK11 regulates pre-mRNA splicing by phosphorylation of SF3B1) has SF3B1 with pre-mRNA binding in spliceosomal
  complex assembly; it is pinned to the U2 snRNP annoton and matches the SF3B1 unit function. gomodel:614fa6f900000500
  (SART3-mediated deubiquitination of TUT1 by USP15) has SART3 as a protein-macromolecule adaptor regulating
  RNA metabolism; it concerns U6 snRNA 3'-end processing by TUT1 rather than U4/U6 reannealing and is
  not pinned. gomodel:63a86a8600001202 (DHX16-mediated viral RNA recognition) is DHX16's antiviral role
  and is not pinned. The seed's best_gocam is the CDK11 model. PANTHER family ids and PTNs are deliberately
  not asserted.
module:
  id: major_spliceosome_cycle
  label: Human major (U2-type) spliceosome cycle
  module_type: PROTEIN_COMPLEX
  description: >-
    snRNPs written once and reused, assembling on each intron through six states (E/A, B, Bact/B*, C,
    C*/P, ILS) linked by PRECEDES; DEAD/DEAH-box ATPases drive the transitions, and the two transesterifications
    are placed on the RNP, not on proteins.
  concepts:
  - preferred_term: U2-type spliceosomal complex
    term:
      id: GO:0005684
      label: U2-type spliceosomal complex
  - &id001
    preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cellular_components: &id002
    - preferred_term: nucleoplasm
      term:
        id: GO:0005654
        label: nucleoplasm
  parts:
  - order: 1
    role: snRNP building blocks written once and reused across assembly states
    node:
      id: snrnps
      label: Spliceosomal snRNPs
      module_type: PROTEIN_COMPLEX
      description: >-
        The Sm and LSm2-8 rings and the U1, U2, U4/U6 and U5 snRNPs, with the tri-snRNP assembled from
        U4/U6 and U5. The snRNAs (U1, U2, U4, U5, U6) are not gene products in this model and are described
        in prose only.
      concepts:
      - preferred_term: spliceosomal snRNP complex
        term:
          id: GO:0097525
          label: spliceosomal snRNP complex
      parts:
      - order: 1
        role: Sm core of the U1, U2, U4 and U5 snRNPs
        node:
          id: sm_ring
          label: Spliceosomal Sm ring
          module_type: PROTEIN_COMPLEX
          description: >-
            The heptameric Sm ring (B/B', D1, D2, D3, E, F, G) threaded by the Sm site of the U1, U2,
            U4 and U5 snRNAs. Written once here and reused by the four Sm-class snRNPs through PART_OF
            connections.
          concepts:
