id: MODULE:ethylene_signaling
title: Ethylene signaling (ETR/ERS receptor-CTR1-EIN2-EBF-EIN3/EIL1 module)
description: >-
  Ethylene signaling in land plants is a double-negative relay from the endoplasmic reticulum to the
  nucleus. Ethylene is perceived by a family of ER-membrane receptors related to bacterial two-component
  histidine kinases (in Arabidopsis ETR1 and ERS1 of subfamily 1 and ETR2, ERS2 and EIN4 of subfamily 2),
  which bind the gas through a copper cofactor in their N-terminal transmembrane domain. In the absence of
  ethylene the receptors keep the associated Raf-like protein kinase CTR1 active; CTR1 phosphorylates the
  cytosolic C-terminal domain of the NRAMP-like ER membrane protein EIN2, preventing its signalling.
  Ethylene binding inactivates the receptors and CTR1, so EIN2 is dephosphorylated and proteolytically
  cleaved; the released C-terminal fragment (EIN2-CEND) moves to the nucleus and also binds the 3' UTRs
  of EBF1 and EBF2 mRNAs, repressing their translation in cytoplasmic P-bodies. EBF1 and EBF2 are F-box
  substrate adaptors of SCF E3 ubiquitin ligases that continuously target the transcription factors EIN3
  and EIL1 for proteasomal degradation; their inhibition, together with ethylene-induced turnover of the
  EBF proteins, stabilizes EIN3/EIL1 in the nucleus. EIN3/EIL1 bind EIN3-binding sites in target
  promoters and activate the ethylene transcriptional cascade (e.g. ERF1), including EBF2 and receptor
  genes as negative feedback. Ethylene biosynthesis (ACC synthase and ACC oxidase), receptor-associated
  regulators such as RTE1, and downstream ERF-family transcription factors are outside this module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009873
    title: ethylene-activated signaling pathway
    statement: The module is grounded in the GO biological process term for ethylene-activated signaling.
  - source_id: PMID:10938361
    title: Ethylene perception by the ERS1 protein in Arabidopsis.
    statement: ERS1, like ETR1, is a membrane-associated disulfide-linked dimer that binds ethylene.
    supporting_text: >-
      In addition, yeast expressing the ERS1 protein contains ethylene-binding sites, indicating ERS1 is
      also an ethylene-binding protein.
  - source_id: PMID:17224067
    title: A strong constitutive ethylene-response phenotype conferred on Arabidopsis plants containing
      null mutations in the ethylene receptors ETR1 and ERS1.
    statement: The receptors are redundant negative regulators, with subfamily 1 predominant.
    supporting_text: >-
      Our results are consistent with the ethylene receptors acting as redundant negative regulators of
      ethylene signaling, but with subfamily 1 receptors playing the predominant role.
  - source_id: PMID:9560288
    title: Association of the Arabidopsis CTR1 Raf-like kinase with the ETR1 and ERS ethylene receptors.
    statement: CTR1 physically associates with the ETR1 and ERS receptors.
    supporting_text: >-
      we detected a specific interaction between the CTR1 amino-terminal domain and the predicted
      histidine kinase domain of ETR1 and ERS
  - source_id: PMID:23132950
    title: CTR1 phosphorylates the central regulator EIN2 to control ethylene hormone signaling from the
      ER membrane to the nucleus in Arabidopsis.
    statement: CTR1 directly phosphorylates the EIN2 C-terminal domain.
    supporting_text: >-
      Here we demonstrate that CTR1 interacts with and directly phosphorylates the cytosolic C-terminal
      domain of EIN2.
  - source_id: PMID:22936567
    title: Processing and subcellular trafficking of ER-tethered EIN2 control response to ethylene gas.
    statement: Ethylene triggers EIN2 dephosphorylation, cleavage and nuclear translocation of EIN2-C'.
    supporting_text: >-
      Ethylene triggers dephosphorylation at several sites and proteolytic cleavage at one of these sites,
      resulting in nuclear translocation of a carboxyl-terminal EIN2 fragment (EIN2-C').
  - source_id: PMID:26496607
    title: EIN2-directed translational regulation of ethylene signaling in Arabidopsis.
    statement: EIN2 represses EBF1/EBF2 translation through their 3' UTRs.
    supporting_text: >-
      whereby EIN2 imposes the translational repression of EBF1 and EBF2 mRNA
  - source_id: PMID:14675532
    title: Plant responses to ethylene gas are mediated by SCF(EBF1/EBF2)-dependent proteolysis of EIN3
      transcription factor.
    statement: EIN3 is degraded through EBF1/EBF2 in the absence of ethylene.
    supporting_text: >-
      In the absence of ethylene, EIN3 is quickly degraded through a ubiquitin/proteasome pathway mediated
      by two F box proteins, EBF1 and EBF2.
  - source_id: PMID:20647342
    title: Ethylene-induced stabilization of ETHYLENE INSENSITIVE3 and EIN3-LIKE1 is mediated by
      proteasomal degradation of EIN3 binding F-box 1 and 2 that requires EIN2 in Arabidopsis.
    statement: Ethylene stabilizes EIN3/EIL1 by promoting EBF1/EBF2 degradation, which requires EIN2.
    supporting_text: >-
      suggesting that ethylene stabilizes EIN3/EIL1 by promoting EBF1 and EBF2 proteasomal degradation
  - source_id: PMID:9851977
    title: 'Nuclear events in ethylene signaling: a transcriptional cascade mediated by ETHYLENE-INSENSITIVE3
      and ETHYLENE-RESPONSE-FACTOR1.'
    statement: EIN3/EIL proteins bind the primary ethylene response element and activate ERF1.
    supporting_text: >-
      EIN3 and EILs comprise a family of novel sequence-specific DNA-binding proteins that regulate gene
      expression by binding directly to a primary ethylene response element (PERE)
notes: >-
  Arabidopsis thaliana proteins are used as representative members; each is grounded with its reviewed
  UniProtKB accession taken from the gene review folders (ETR1 P49333, ERS1 Q38846, CTR1 Q05609, EIN2
  Q9S814, EBF1 Q9SKK0, EBF2 Q708Y0, EIN3 O24606, EIL1 Q9SLH0); every grounded member has a completed
  gene review. Only ETR1 and ERS1 are listed for the receptor family; ETR2, ERS2 and EIN4
  (subfamily 2) are functionally equivalent receptors not reviewed here. The receptor annoton uses
  ethylene receptor activity (GO:0038199), matching the ETR1 and ERS1 reviews; the in vitro histidine
  kinase activity of subfamily 1 is not modeled as the signalling output because ERS1 His
  autophosphorylation is lost in the presence of Mg2+ and kinase activity is largely dispensable for
  receptor output. EIN2 is modeled with two annotons, matching its review: an ER-localized signalling
  adaptor (GO:0035591, CTR1 target, cleaved to release EIN2-CEND) and an mRNA 3'-UTR binding activity
  (GO:0003730) of EIN2-CEND that represses EBF1/EBF2 translation in P-bodies. The EIN2 chromatin/histone
  acetylation role is noted in the EIN2 review but omitted here to keep the relay minimal. The protease
  that cleaves EIN2 is not established, so no annoton is asserted for it. The SCF core subunits
  (ASK1/ASK2, CUL1, RBX1) are shared with other SCF ligases and are described rather than modeled.
  No PANTHER family ids are asserted. No production GO-CAM in gocams/index.tsv contains these Arabidopsis
  proteins (checked 2026-10-06 by AGI locus and accession), so no gocam_associations are given.
module:
  id: ethylene_signaling
  label: Ethylene signaling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: ethylene-activated signaling pathway
      term:
        id: GO:0009873
        label: ethylene-activated signaling pathway
      description: Ethylene perception by ER receptors, inactivation of CTR1, EIN2 processing and signalling,
        relief of SCF(EBF1/EBF2)-mediated EIN3/EIL1 degradation and EIN3/EIL1-driven transcription.
  context:
    taxa:
      - preferred_term: land plants
        term:
          id: NCBITaxon:3193
          label: Embryophyta
        description: The receptor-CTR1-EIN2-EIN3 relay is conserved in land plants; Arabidopsis thaliana
          provides the representative members.
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: ethylene perception by ER-membrane receptors
      node:
        id: ethylene_perception
        label: Ethylene perception by ETR/ERS receptors
        module_type: REGULATORY_STEP
        description: >-
          Ethylene binds the copper-containing transmembrane sensor domain of dimeric ER-membrane receptors.
          Without ethylene the receptors keep CTR1 active (receptor output is "on"); ethylene binding
          switches receptor output off. Receptor genes are redundant, with subfamily 1 (ETR1, ERS1)
          predominant.
        annotons:
          - id: ethylene_receptor
            label: Ethylene receptor (ETR/ERS family)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: plant ethylene receptor family (ETR1, ERS1, ETR2, ERS2, EIN4 in Arabidopsis)
                representative_members:
                  - preferred_term: ETR1 (Arabidopsis)
                    term:
                      id: UniProtKB:P49333
                      label: Ethylene receptor 1
                  - preferred_term: ERS1 (Arabidopsis)
                    term:
                      id: UniProtKB:Q38846
                      label: Ethylene response sensor 1
            function:
              preferred_term: ethylene receptor activity
              term:
                id: GO:0038199
                label: ethylene receptor activity
              evidence:
                - source_id: PMID:10938361
                  statement: ERS1, like ETR1, contains ethylene-binding sites with similar affinity.
                  supporting_text: Yeast expressing ETR1 and ERS1 showed nearly identical sensitivity to
                    1-MCP, suggesting that the ethylene-binding sites of ETR1 and ERS1 have similar affinities
                    for ethylene.
                - source_id: PMID:17224067
                  statement: etr1 ers1 null double mutants show a strong constitutive ethylene response.
                  supporting_text: Double mutants of ers1-3 with etr1-9, as well as with the previously
                    isolated etr1-7, display a constitutive ethylene-response phenotype
            processes:
              - preferred_term: negative regulation of ethylene-activated signaling pathway
                term:
                  id: GO:0010105
                  label: negative regulation of ethylene-activated signaling pathway
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: Binds ethylene; in the unbound state activates CTR1 to repress the pathway.
    - order: 2
      role: CTR1 kinase repression of EIN2
      node:
        id: ctr1_repression
        label: CTR1 phosphorylation of EIN2
        module_type: REGULATORY_STEP
        description: >-
          The Raf-like kinase CTR1 is recruited to the ER receptor complex and, while receptors are
          active, phosphorylates the cytosolic C-terminal domain of EIN2, preventing EIN2 cleavage and
          signalling. Ethylene-mediated receptor inactivation turns CTR1 off.
        annotons:
          - id: ctr1_kinase
            label: CTR1 Raf-like protein kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CTR1 (Arabidopsis)
                term:
                  id: UniProtKB:Q05609
                  label: Serine/threonine-protein kinase CTR1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:23132950
                  statement: CTR1 directly phosphorylates the EIN2 C-terminal domain.
                  supporting_text: Here we demonstrate that CTR1 interacts with and directly phosphorylates
                    the cytosolic C-terminal domain of EIN2.
            processes:
              - preferred_term: negative regulation of ethylene-activated signaling pathway
                term:
                  id: GO:0010105
                  label: negative regulation of ethylene-activated signaling pathway
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: Phosphorylates EIN2 to keep it inactive in the absence of ethylene.
    - order: 3
      role: EIN2 processing and signal transduction
      node:
        id: ein2_signaling
        label: EIN2 cleavage and EIN2-CEND signalling
        module_type: REGULATORY_STEP
        description: >-
          Dephosphorylated EIN2 is cleaved, releasing the C-terminal domain (EIN2-CEND). EIN2-CEND moves to
          the nucleus, where it promotes EIN3-dependent transcription, and binds EBF1/EBF2 mRNA 3' UTRs,
          targeting them to P-bodies for translational repression.
        annotons:
          - id: ein2_signaling_adaptor
            label: EIN2 ER-tethered signal transducer
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIN2 (Arabidopsis)
                term:
                  id: UniProtKB:Q9S814
                  label: Ethylene-insensitive protein 2
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              evidence:
                - source_id: PMID:22936567
                  statement: Ethylene triggers EIN2 cleavage and nuclear movement of EIN2-C'.
                  supporting_text: Ethylene triggers dephosphorylation at several sites and proteolytic
                    cleavage at one of these sites, resulting in nuclear translocation of a carboxyl-terminal
                    EIN2 fragment (EIN2-C').
            processes:
              - preferred_term: ethylene-activated signaling pathway
                term:
                  id: GO:0009873
                  label: ethylene-activated signaling pathway
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Positive transducer linking ER receptor complexes to nuclear EIN3/EIL1 activity.
          - id: ein2_cend_translational_repression
            label: EIN2-CEND repression of EBF1/EBF2 translation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIN2 C-terminal domain (Arabidopsis)
                term:
                  id: UniProtKB:Q9S814
                  label: Ethylene-insensitive protein 2
            function:
              preferred_term: mRNA 3'-UTR binding
              term:
                id: GO:0003730
                label: mRNA 3'-UTR binding
              evidence:
                - source_id: PMID:26496607
                  statement: Ethylene induces EIN2 to bind EBF1/2 3' UTRs and target the mRNAs to P-bodies.
                  supporting_text: we demonstrate that ethylene induces EIN2 to associate with 3' UTRs and
                    target EBF1/2 mRNA to cytoplasmic processing-body (P-body)
            processes:
              - preferred_term: ethylene-activated signaling pathway
                term:
                  id: GO:0009873
                  label: ethylene-activated signaling pathway
            locations:
              - preferred_term: P-body
                term:
                  id: GO:0000932
                  label: P-body
            role_description: Represses translation of EBF1/EBF2 mRNAs, lowering the F-box proteins that
              degrade EIN3/EIL1.
    - order: 4
      role: SCF(EBF1/EBF2)-mediated EIN3/EIL1 degradation
      node:
        id: ebf_degradation
        label: SCF(EBF1/EBF2) turnover of EIN3/EIL1
        module_type: REGULATORY_STEP
        description: >-
          In the absence of ethylene, the LRR F-box proteins EBF1 and EBF2 recruit EIN3 and EIL1 to SCF
          E3 ligases (with ASK1/ASK2, CUL1 and RBX1) for polyubiquitination and 26S proteasome degradation.
          Ethylene decreases EBF1/EBF2 levels, via EIN2-directed translational repression and
          proteasomal turnover of the EBF proteins.
        annotons:
          - id: ebf_fbox_adaptor
            label: EBF1/EBF2 F-box substrate adaptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EIN3-binding F-box proteins (EBF1, EBF2)
                representative_members:
                  - preferred_term: EBF1 (Arabidopsis)
                    term:
                      id: UniProtKB:Q9SKK0
                      label: EIN3-binding F-box protein 1
                  - preferred_term: EBF2 (Arabidopsis)
                    term:
                      id: UniProtKB:Q708Y0
                      label: EIN3-binding F-box protein 2
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              evidence:
                - source_id: PMID:15090654
                  statement: EBF1 and EBF2 work in SCF complexes and bind EIN3 directly.
                  supporting_text: EBF1 and -2 interact directly with ethylene insensitive 3 (EIN3)
                - source_id: PMID:17307926
                  statement: SCF(EBF1) and SCF(EBF2) jointly control EIN3/EIL1 abundance.
                  supporting_text: the SCF EBF1 and SCF EBF2 E3 complexes work in concert to fine-tune the
                    abundance of EIN3/EIL1 in response to ambient hormone levels
            processes:
              - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0031146
                  label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
              - preferred_term: negative regulation of ethylene-activated signaling pathway
                term:
                  id: GO:0010105
                  label: negative regulation of ethylene-activated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Recruits EIN3/EIL1 to the SCF ubiquitin ligase (GO:0019005) for proteasomal
              degradation.
    - order: 5
      role: EIN3/EIL1 transcriptional activation
      node:
        id: ein3_eil1_transcription
        label: EIN3/EIL1-driven ethylene transcription
        module_type: REGULATORY_STEP
        description: >-
          Stabilized EIN3 and EIL1 accumulate in the nucleus, bind EIN3-binding sites (primary ethylene
          response elements) and activate ethylene-responsive genes such as ERF1, as well as EBF2 (negative
          feedback). ein3 eil1 double mutants are almost completely ethylene-insensitive.
        annotons:
          - id: ein3_eil1_activator
            label: EIN3/EIL1 transcription activators
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EIN3/EIL transcription factors (EIN3, EIL1)
                representative_members:
                  - preferred_term: EIN3 (Arabidopsis)
                    term:
                      id: UniProtKB:O24606
                      label: Protein ETHYLENE INSENSITIVE 3
                  - preferred_term: EIL1 (Arabidopsis)
                    term:
                      id: UniProtKB:Q9SLH0
                      label: ETHYLENE INSENSITIVE 3-like 1 protein
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:9851977
                  statement: EIN3/EILs bind the PERE in target promoters including ERF1.
                  supporting_text: EIN3 and EILs comprise a family of novel sequence-specific DNA-binding
                    proteins that regulate gene expression by binding directly to a primary ethylene response
                    element (PERE)
                - source_id: PMID:12606727
                  statement: ein3 eil1 double mutants nearly lack seedling ethylene responses.
                  supporting_text: The simultaneous loss of functional WEI5EIL1 and EIN3 nearly completely
                    abolished the ethylene response in etiolated seedlings
            processes:
              - preferred_term: ethylene-activated signaling pathway
                term:
                  id: GO:0009873
                  label: ethylene-activated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Terminal transcription factors that activate the ethylene transcriptional cascade.
  connections:
    - source: ethylene_perception
      target: ctr1_repression
      connection_type: POSITIVELY_REGULATES
      description: Ethylene-free receptors keep CTR1 active; ethylene binding switches this output off.
    - source: ctr1_repression
      target: ein2_signaling
      connection_type: NEGATIVELY_REGULATES
      description: CTR1 phosphorylation of the EIN2 C-terminus blocks EIN2 cleavage and signalling.
    - source: ein2_signaling
      target: ebf_degradation
      connection_type: NEGATIVELY_REGULATES
      description: EIN2-CEND represses EBF1/EBF2 translation and EIN2 is required for ethylene-induced EBF
        turnover.
    - source: ebf_degradation
      target: ein3_eil1_transcription
      connection_type: NEGATIVELY_REGULATES
      description: SCF(EBF1/EBF2) degrades EIN3 and EIL1.
    - source: ein3_eil1_transcription
      target: ebf_degradation
      connection_type: POSITIVELY_REGULATES
      description: EIN3 induces EBF2 transcription, restoring EIN3/EIL1 turnover (negative feedback).
