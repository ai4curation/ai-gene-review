notes: >-
  Boundary. TFIIB (TfIIB) has no FlyBase group of its own in this set and is not added. FlyBase's
  CAK-XPD group (Cdk7, CycH, Mat1, Xpd) is fully covered by the CAK part plus Xpd in the TFIIH
  core part, so it is not modelled as a separate node. Gas41 and caz are FlyBase TFIID group
  members kept as listed; they are not canonical TAFs. The tTAFs are emitted one annoton per
  gene because the composition of testis TFIID-like complexes is not settled. RNA polymerase
  II itself is in dmel_nuclear_rna_polymerases. FlyBase groups realized by this module: TFIID
  (FBgg0000347), TFIIE (FBgg0000348), TFIIF (FBgg0000349), TFIIH (FBgg0000350), T-TAF (FBgg0000352),
  CAK-XPD (FBgg0000354), TFIIA (FBgg0000355). Subgroups folded into it: CAK, TFIIH-C, TFIIA-S,
  TFIIA-S2. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_rnapii_general_transcription_factors.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
