id: MODULE:dmel_rnapii_general_transcription_factors
title: RNA polymerase II general transcription factors in Drosophila melanogaster
description: >-
  The general transcription factors TFIID, TFIIA, TFIIB, TFIIE, TFIIF and TFIIH assemble with
  RNA polymerase II on core promoters to form the preinitiation complex. TFIID, built from
  the TATA-box binding protein (TBP) and TBP-associated factors (TAFs), recognizes core promoter
  elements; TFIIA stabilizes TBP binding to DNA. TFIIF escorts polymerase into the complex
  and TFIIE recruits TFIIH. TFIIH contains the XPB (hay) translocase that opens promoter DNA,
  the XPD helicase, and the CDK-activating kinase (Cdk7, CycH, Mat1), which phosphorylates
  the polymerase C-terminal domain during initiation; TFIIH also acts in nucleotide excision
  repair. In Drosophila testis, paralogous testis-specific TAFs (tTAFs) and a germline TFIIA
  small subunit variant drive the spermatocyte transcription program.
status: DRAFT
scope: CONCRETE
