id: MODULE:phage_p22_tailspike_lps_hydrolysis_and_ejectosome_entry
title: Phage P22 tailspike O-antigen endorhamnosidase hydrolysis, gp26 needle ejection, gp7-gp16-gp20 trans-envelope ejectosome
  assembly, and prophage superinfection exclusion
description: >-
  A coupled host-adsorption, outer-membrane penetration, trans-envelope DNA-ejectosome assembly, and prophage exclusion
  module in Salmonella phage P22 (Lederbergvirus). Six homotrimeric gp9 tailspikes attached laterally around the gp4-gp10
  tail hub recognize and enzymatically hydrolyze the alpha-1,3-rhamnosyl-galactose O-glycosidic linkage of Salmonella serogroup
  A, B, and D1 lipopolysaccharide (LPS) O-antigen repeats via their central right-handed parallel beta-helix endorhamnosidase
  domains, processively ratcheting the virion through the O-antigen layer down to the outer membrane surface. Contact of the
  240-Angstrom gp26 coiled-coil tail needle tip with the outer membrane lipid bilayer triggers gp26 release into the host
  envelope, opening the gp1-gp4-gp10 portal-hub conduit for sequential ejection of all three internal virion E-proteins (gp7,
  gp16, and gp20) ahead of the viral DNA. In the host cell envelope, gp7 anchors at the outer membrane tail conduit, gp20
  assembles into a periplasmic tubular shaft spanning the peptidoglycan layer, and gp16 partitions into the host inner membrane
  to form a continuous trans-envelope DNA translocation channel (ejectosome). In P22 lysogens, homotypic superinfection through
  this entry pathway is blocked at two distinct layers: at the cell surface by the prophage gtrABC (con) O-antigen glucosyltransferase/flippase
  cassette (which adds alpha-1,6-linked glucose to O-antigen repeats to prevent gp9 tailspike progression), and at the inner
  membrane by the prophage integral membrane protein SieA (which blocks DNA translocation through the gp7-gp16-gp20 ejectosome).
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:9135118
  title: 'Phage P22 tailspike protein: crystal structure of the head-binding domain at 2.3 A, fully refined structure of the
    endorhamnosidase at 1.56-A resolution, and the molecular basis of O-antigen recognition and cleavage.'
  statement: Defines the atomic structure and catalytic mechanism of the homotrimeric P22 gp9 tailspike right-handed parallel
    beta-helix endorhamnosidase in complex with Salmonella O-antigen oligosaccharides.
- source_id: PMID:20817910
  title: Tailspike interactions with lipopolysaccharide effect DNA ejection from phage P22 particles in vitro.
  statement: Demonstrates that LPS O-antigen binding and hydrolysis by the gp9 tailspike position the virion at the outer
    membrane interface to trigger gp26 needle release and genome ejection.
- source_id: PMID:26245366
  title: Bacteriophage P22 ejects all of its internal proteins before its genome.
  statement: Establishes that the internal E-proteins gp7, gp16, and gp20 are quantitatively ejected from the P22 capsid prior
    to viral DNA translocation.
- source_id: PMID:30886360
  title: Structural dynamics of bacteriophage P22 infection initiation revealed by cryo-electron tomography.
  statement: Cryo-electron tomography visualizing gp9-mediated LPS positioning, gp26 needle ejection, and assembly of the
    gp7-gp20-gp16 trans-envelope DNA-ejectosome channel across the Salmonella cell envelope.
- source_id: PMID:37952769
  title: Molecular Architecture of Salmonella Typhimurium Virus P22 Genome Ejection Machinery.
  statement: Resolves the structural organization of the internal E-proteins inside the mature P22 virion and defines the
    gp7-gp20 periplasmic conduit architecture.
- source_id: PMID:38236051
  title: Bacteriophage P22 SieA-mediated superinfection exclusion.
  statement: Demonstrates that the prophage inner membrane protein SieA blocks P22 genome delivery by targeting the gp16/gp20/gp7
    ejection machinery at the host cytoplasmic membrane.
- source_id: GO:0039638
  title: lipopolysaccharide-mediated virion attachment to host cell
  statement: Defines virion adsorption to the host cell surface mediated by binding to lipopolysaccharide O-antigen receptors.
- source_id: GO:0099002
  title: symbiont genome ejection through host cell envelope, short tail mechanism
  statement: Defines delivery of a podovirus genome across the bacterial cell envelope via an extensible internal protein
    ejectosome conduit.
notes: 'Exemplar phage: Salmonella phage P22 (NCBITaxon:10754). Contrasts the Lederbergvirus needle-plugged, LPS-hydrolyzing
  gp7-gp16-gp20 ejectosome mechanism with the T7-type nozzle-gated gp14-gp15-gp16 internal core mechanism (MODULE:phage_podovirus_short_tail_ejection).'
