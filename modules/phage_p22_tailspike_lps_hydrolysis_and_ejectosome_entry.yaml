    chaining_status: VERIFIED
    chaining_note: Processive O-antigen hydrolysis by gp9 brings the gp26 needle tip into contact with the outer membrane,
      triggering gp26 release and immediate ejection of gp7, gp20, and gp16 to assemble the trans-envelope DNA-ejectosome.
  - source: p22_prophage_exclusion_step
    target: p22_tailspike_needle_adsorption_step
    connection_type: NEGATIVELY_REGULATES
    chaining_status: VERIFIED
    chaining_note: Prophage-directed O-antigen glucosylation initiated by GtrB and GtrA modifies the Salmonella LPS O-antigen
      repeat structure, reducing productive gp9 receptor recognition by superinfecting P22 virions.
  - source: p22_prophage_exclusion_step
    target: p22_ejectosome_channel_assembly_step
    connection_type: NEGATIVELY_REGULATES
    chaining_status: VERIFIED
    chaining_note: Prophage-expressed SieA in the host inner membrane blocks functional completion of the gp7-gp20-gp16 trans-envelope
      DNA-ejectosome channel, aborting genome delivery into the cytoplasm.
  knowledge_gaps:
  - gap_statement: The atomic structure of the complete membrane-embedded gp7-gp20-gp16 trans-envelope ejectosome in complex
      with the inhibitory prophage inner-membrane protein SieA has not yet been resolved, and Gene Ontology lacks a specific
      molecular function term for inner-membrane ejectosome-blocking superinfection exclusion proteins such as SieA.
    boundary: Quantitative pre-DNA ejection of gp7, gp16, and gp20, trans-envelope channel formation across the Salmonella
      outer membrane, periplasm, and inner membrane, and SieA-mediated blockade of DNA translocation at the cytoplasmic membrane
      are established experimentally (PMID:26245366, PMID:30886360, PMID:38236051).
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
