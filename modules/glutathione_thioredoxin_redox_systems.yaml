      connection_type: PROVIDES_INPUT_FOR
      description: Reduced thioredoxin regenerates the oxidized thiol peroxidases.
    - source: sod_step
      target: thiol_peroxidase_step
      connection_type: PROVIDES_INPUT_FOR
      description: Hydrogen peroxide made by superoxide dismutase is reduced by thiol peroxidases.
    - source: sod_step
      target: catalase_step
      connection_type: PROVIDES_INPUT_FOR
      description: Hydrogen peroxide made by superoxide dismutase is dismutated by catalase.
    - source: glutathione_glutaredoxin_system
      target: thioredoxin_system
      connection_type: POSITIVELY_REGULATES
      description: >-
        The two relays back each other up (one cytosolic thioredoxin or dithiol
        glutaredoxin is required for viability), but the thioredoxin redox
        state is maintained independently of glutathione (PMID:12612609);
        represented as functional overlap, not electron transfer.
  notes: >-
    NEW (YeastPathways project, 2026-10), built from YeastCyc GLUT-REDOX2-PWY,
    PWY3O-592, THIOREDOX-PWY and DETOX1-PWY. Boundary: the two NADPH-driven
    thiol-disulfide relays (glutathione reductase -> glutathione ->
    dithiol glutaredoxin; thioredoxin reductase -> thioredoxin) plus the
    peroxide and superoxide scavengers that they or no thiol feed (thiol
    peroxidases, superoxide dismutases, catalases). Glutathione synthesis and
    turnover are in glutathione_synthesis_gamma_glutamyl_cycle, which also
    lists glutathione reductase; glutathione S-transferases (GTT1, GTT2) and
    vacuolar GS-X pumps (YCF1) are conjugation/transport and are left out;
    monothiol glutaredoxins (GRX3/4/5) act mainly in iron-sulfur cluster
    and iron-regulation pathways; thioredoxin-reduced biosynthetic enzymes
    (PAPS reductase MET16, ribonucleotide reductase) are consumers in other
    modules. YeastCyc corrections: the frames have no gene for glutaredoxin
    or thioredoxin reactions (GRX1/GRX2, TRX1/TRX2 added); GPX1, GPX2 and
    HYR1 are thioredoxin-dependent cysteine peroxiredoxins, not
    glutathione peroxidases (PMID:16251189, PMID:12437921); the
    "superoxide radicals degradation" frame does list SOD1 and SOD2 in
    addition to the catalases. The peroxiredoxins TSA1, TSA2, AHP1 and DOT5
    are absent from the YeastCyc frames and were added. Mitochondria have
    their own thioredoxin system (TRR2 included under the low-Mr reductase;
    TRX3 is in PANTHER PTHR10438, not PTHR46115, so it is described here
    rather than listed under the cytosolic thioredoxin selector) and a
    1-Cys peroxiredoxin (PRX1) that is not modelled. GO-CAM disagreements:
    all four SGD models place every activity in cytosol (SOD2 and TRR2 are
    mitochondrial, CTA1 peroxisomal), THIOREDOX-PWY is part of the obsolete
    GO:0006125, and GLUT-REDOX2-PWY types the GPx-like enzymes with
    GO:0004602 glutathione peroxidase activity. Thioredoxin reductase is an
    EXACTLY_ONE variant set (low-Mr PTHR48105 in fungi vs high-Mr
    selenoprotein PTHR42737:SF8 in animals). No PomBase GO-CAM is linked for
    this group, but S. pombe exemplars are included where the ortholog is
    clear.
  knowledge_gaps:
    - gap_statement: >-
        In S. cerevisiae cells lacking both thioredoxins, sulfate assimilation
        persists under low-ROS conditions, implying an unidentified alternative
        hydrogen donor for PAPS reductase.
      boundary: Only thioredoxin is modelled as the PAPS reductase electron donor.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The relative contribution of each thiol peroxidase family and of
        catalase to H2O2 removal in each compartment under different growth
        conditions is not quantitatively established.
      boundary: Thiol peroxidase families are modelled as ONE_OR_MORE alternatives without flux weights.
      gap_kind:
        - BIOLOGY
