id: MODULE:glutathione_thioredoxin_redox_systems
title: NADPH-driven glutathione/glutaredoxin and thioredoxin systems with peroxide and superoxide scavenging
description: >-
  Cells keep their thiols reduced and remove reactive oxygen species with two
  parallel NADPH-driven thiol-disulfide relays and a set of thiol-independent
  scavengers. In the glutathione/glutaredoxin system, the FAD enzyme
  glutathione reductase uses NADPH to reduce glutathione disulfide to
  glutathione, and glutathione in turn reduces dithiol glutaredoxins, which
  reduce protein disulfides and glutathione-protein mixed disulfides. In the
  thioredoxin system, thioredoxin reductase uses NADPH to reduce thioredoxin,
  which reduces protein disulfides, supplies electrons to biosynthetic
  reductases such as ribonucleotide reductase and PAPS reductase, and reduces
  the thiol peroxidases. Thioredoxin reductase is a low-molecular-weight
  flavoenzyme in fungi, plants and bacteria and a high-molecular-weight
  selenoprotein related to glutathione reductase in animals. Hydrogen
  peroxide and organic hydroperoxides are reduced by several families of
  thioredoxin-dependent thiol peroxidases (typical 2-Cys peroxiredoxins,
  glutathione-peroxidase-like peroxiredoxins, atypical 2-Cys and BCP-type
  peroxiredoxins). Superoxide dismutases convert superoxide to hydrogen
  peroxide (Cu/Zn enzyme in the cytosol and mitochondrial intermembrane
  space, Mn enzyme in the mitochondrial matrix), and haem catalases
  dismutate hydrogen peroxide to water and oxygen without thiol reductant.
  The two thiol systems overlap: in budding yeast at least one cytosolic
  thioredoxin or dithiol glutaredoxin is required for viability.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:GLUT-REDOX2-PWY
    title: glutathione-glutaredoxin redox reactions (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUT-REDOX2-PWY
    statement: >-
      YeastCyc lists GLUTATHIONE-REDUCT-NADPH-RXN (GLR1), a gene-less
      glutaredoxin reduction, GSHTRAN-RXN (GTT1, GTT2) and
      GLUTATHIONE-PEROXIDASE-RXN (GPX1, GPX2, HYR1). GLR1 was retained; the
      GPX1/GPX2/HYR1 proteins were retained but moved to a
      thioredoxin-dependent peroxiredoxin activity (PMID:16251189,
      PMID:12437921); the glutathione transferases were left out as
      conjugation enzymes rather than redox-relay components.
  - source_id: YeastPathways:PWY3O-592
    title: glutathione-glutaredoxin system (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-592
    statement: >-
      YeastCyc lists GLR1 and gene-less glutaredoxin reactions; GRX1 and
      GRX2 were added as the dithiol glutaredoxins (PMID:9571241).
  - source_id: YeastPathways:THIOREDOX-PWY
    title: thioredoxin pathway (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=THIOREDOX-PWY
    statement: >-
      YeastCyc lists THIOREDOXIN-REDUCT-NADPH-RXN (TRR1, TRR2) and a
      gene-less thioredoxin reaction; TRX1 and TRX2 were added as the
      cytosolic thioredoxins.
  - source_id: YeastPathways:DETOX1-PWY
    title: superoxide radicals degradation (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=DETOX1-PWY
    statement: >-
      YeastCyc lists CATAL-RXN (CTA1, CTT1) and SUPEROX-DISMUT-RXN (SOD1,
      SOD2); all four were retained.
  - source_id: GO:0045454
    title: cell redox homeostasis
    statement: Module-level process for the two NADPH-driven thiol-disulfide relays.
  - source_id: GO:0098869
    title: cellular oxidant detoxification
    statement: Module-level process for peroxide and superoxide removal.
  - source_id: PMID:11169096
    title: Role of the glutathione/glutaredoxin and thioredoxin systems in yeast growth and response to stress conditions.
    statement: Review of the yeast glutathione/glutaredoxin and thioredoxin systems in redox homeostasis.
  - source_id: PMID:2668278
    title: Thioredoxin and glutaredoxin systems.
    statement: Classic review defining the NADPH-thioredoxin reductase-thioredoxin and NADPH-glutathione reductase-glutathione-glutaredoxin systems.
  - source_id: PMID:10844700
    title: A single glutaredoxin or thioredoxin gene is essential for viability in the yeast Saccharomyces cerevisiae.
    statement: >-
      The trx1 trx2 grx1 grx2 quadruple mutant is inviable and any single
      remaining gene suffices; thioredoxins are the main reductants of PAPS
      reductase.
  - source_id: PMID:12612609
    title: Non-reciprocal regulation of the redox state of the glutathione-glutaredoxin and thioredoxin systems.
    statement: >-
      Thioredoxins are kept reduced independently of the glutathione system,
      whereas glutaredoxin redox state follows GSSG/2GSH; Trr1 but not Glr1
      is needed for normal growth.
  - source_id: PMID:15701801
    title: Overlapping roles of the cytoplasmic and mitochondrial redox regulatory systems in the yeast Saccharomyces cerevisiae.
    statement: >-
      S. cerevisiae has a cytoplasmic (TRX1, TRX2, TRR1) and a mitochondrial
      (TRX3, TRR2) thioredoxin system; Glr1 and Trr2 overlap in keeping Trx3
      reduced.
  - source_id: PMID:10037727
    title: Identification and functional characterization of a novel mitochondrial thioredoxin system in Saccharomyces cerevisiae.
    statement: TRX3 and TRR2 form a mitochondrial thioredoxin system; trr2 mutants are H2O2-sensitive.
  - source_id: PMID:8843443
    title: Yeast glutathione reductase is required for protection against oxidative stress and is a target gene for yAP-1 transcriptional regulation.
    statement: glr1 mutants lack glutathione reductase activity, accumulate GSSG and are oxidant-sensitive.
  - source_id: PMID:9571241
    title: The yeast Saccharomyces cerevisiae contains two glutaredoxin genes that are required for protection against reactive oxygen species.
    statement: GRX1 and GRX2 encode glutathione-dependent disulfide oxidoreductases required for oxidant resistance.
  - source_id: PMID:7961686
    title: Thioredoxin-dependent peroxide reductase from yeast.
    statement: >-
      Yeast TSA1 is a dimeric 2-Cys peroxidase that reduces H2O2 and alkyl
      hydroperoxides with electrons from thioredoxin, thioredoxin reductase
      and NADPH.
  - source_id: PMID:10681558
    title: Distinct physiological functions of thiol peroxidase isoenzymes in Saccharomyces cerevisiae.
    statement: >-
      Five yeast thioredoxin-supported thiol peroxidases (TSA1, TSA2, AHP1,
      mitochondrial PRX1 and nuclear DOT5) have distinct localizations.
  - source_id: PMID:16251189
    title: GPX2, encoding a phospholipid hydroperoxide glutathione peroxidase homologue, codes for an atypical 2-Cys peroxiredoxin in Saccharomyces cerevisiae.
    statement: >-
      Gpx2 reduces peroxides with thioredoxin and is far less active with
      glutathione/glutathione reductase.
  - source_id: PMID:12437921
    title: A thiol peroxidase is an H2O2 receptor and redox-transducer in gene activation.
    statement: >-
      The GPx-like Gpx3 (HYR1/Orp1) senses H2O2 and oxidizes Yap1;
      thioredoxin reduces both sensor and regulator.
  - source_id: PMID:10480913
    title: Genetic analysis of glutathione peroxidase in oxidative stress response of Saccharomyces cerevisiae.
    statement: GPX1, GPX2 and GPX3/HYR1 account for cellular GSH peroxidase activity; gpx3 mutants are peroxide-hypersensitive.
  - source_id: PMID:11445588
    title: Saccharomyces cerevisiae expresses three phospholipid hydroperoxide glutathione peroxidases.
    statement: The three yeast GPx homologues are phospholipid-hydroperoxide-type enzymes that protect against lipid peroxidation.
  - source_id: PMID:3290902
    title: 'The copper, zinc-superoxide dismutase gene of Saccharomyces cerevisiae: cloning, sequencing, and biological activity.'
    statement: SOD1 encodes yeast Cu,Zn-superoxide dismutase and corrects dioxygen sensitivity of a Cu,Zn-SOD-deficient strain.
  - source_id: PMID:15851472
    title: Manganese activation of superoxide dismutase 2 in the mitochondria of Saccharomyces cerevisiae.
    statement: SOD2 is the mitochondrial Mn superoxide dismutase.
  - source_id: PMID:8425895
    title: Two independent peroxisomal targeting signals in catalase A of Saccharomyces cerevisiae.
    statement: Catalase A (CTA1) is targeted to peroxisomes by two independent signals.
  - source_id: PMID:14998369
    title: Dual targeting of yeast catalase A to peroxisomes and mitochondria.
    statement: Catalase A is also imported into mitochondria under respiratory conditions.
  - source_id: UniProtKB:P06115
    title: Catalase T (S. cerevisiae CTT1)
    statement: CTT1 encodes the cytosolic catalase T.
  - source_id: file:yeast/TSA1/TSA1-ai-review.yaml
    title: TSA1 gene review (S. cerevisiae)
    statement: Core function GO:0140824 thioredoxin-dependent peroxiredoxin activity in cytosol.
  - source_id: file:yeast/SOD2/SOD2-ai-review.yaml
    title: SOD2 gene review (S. cerevisiae)
    statement: Core function GO:0004784 superoxide dismutase activity in the mitochondrial matrix.
  - source_id: file:human/GSR/GSR-ai-review.yaml
    title: GSR gene review (human)
    statement: Core function GO:0004362 glutathione-disulfide reductase (NADPH) activity.
  - source_id: file:human/TXN/TXN-ai-review.yaml
    title: TXN gene review (human)
    statement: Core function GO:0015035 protein-disulfide reductase activity in cytosol, cell redox homeostasis.
  - source_id: file:human/SOD1/SOD1-ai-review.yaml
    title: SOD1 gene review (human)
    statement: Core function GO:0004784 in cytosol and mitochondrial intermembrane space.
