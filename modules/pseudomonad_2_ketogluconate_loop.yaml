id: MODULE:pseudomonad_2_ketogluconate_loop
title: Pseudomonas 2-ketogluconate loop
description: >-
  A reusable Pseudomonas peripheral glucose-catabolism module. A
  PQQ-dependent inner-membrane Gcd oxidizes periplasmic glucose to
  D-glucono-1,5-lactone, which hydrolyzes to gluconate; a three-subunit Gad
  complex oxidizes gluconate to 2-ketogluconate; KguT imports it; KguK
  phosphorylates it; and KguD reduces the phosphorylated intermediate to
  6-phosphogluconate. PQQ biosynthesis, porin-mediated glucose entry, PtxS
  regulation, the alternative gluconate-kinase route, and the downstream
  Entner-Doudoroff trunk are outside the boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:17483213
    title: "Convergent peripheral pathways catalyze initial glucose catabolism in Pseudomonas putida: genomic and flux analysis."
    statement: Direct KT2440 genetics and flux analysis establish the ordered 2-ketogluconate loop and PP_3376/KguD contribution.
  - source_id: PMID:9352901
    title: Cloning and expression of a gene cluster encoding three subunits of membrane-bound gluconate dehydrogenase from Erwinia cypripedii ATCC 29267 in Escherichia coli.
    statement: Primary biochemical and cloning evidence establishes homologous dehydrogenase, cytochrome c, and third-subunit Gad architecture.
  - source_id: PMID:39770733
    title: Characterization and Transcriptional Regulation of the 2-Ketogluconate Utilization Operon in Pseudomonas plecoglossicida.
    statement: Cross-species genetics supports the four-gene kgu locus while leaving KguE chemistry unresolved.
  - source_id: RHEA:22152
    title: Quinoprotein glucose dehydrogenase reaction
    statement: Defines oxidation of D-glucose to D-glucono-1,5-lactone.
  - source_id: RHEA:12769
    title: Gluconate 2-dehydrogenase reaction
    statement: Defines oxidation of D-gluconate to 2-dehydro-D-gluconate.
  - source_id: RHEA:10788
    title: 2-dehydrogluconokinase reaction
    statement: Defines ATP-dependent phosphorylation of 2-dehydro-D-gluconate.
  - source_id: UniProtKB:Q88HI1
    title: Pseudomonas putida KT2440 PP_3376
    statement: Exact KguD candidate; the legacy ptxD name is not treated as evidence for phosphite oxidation.
  - source_id: UniProtKB:Q88HH6
    title: Pseudomonas putida KT2440 Gad cytochrome c subunit
    statement: Exact PSEPK implementation of the membrane-associated electron-transfer subunit.
  - source_id: UniProtKB:Q88HH5
    title: Pseudomonas putida KT2440 Gad flavoprotein subunit
    statement: Exact PSEPK implementation of the FAD-containing catalytic subunit.
  - source_id: UniProtKB:Q88HH4
    title: Pseudomonas putida KT2440 Gad gamma subunit
    statement: Exact PSEPK implementation of the conserved third subunit.
  - source_id: UniProtKB:O34213
    title: Reviewed Pantoea cypripedii Gad subunit 3
    statement: Reviewed exemplar verified as the third subunit of the three-component enzyme.
  - source_id: UniProtKB:O34214
    title: Reviewed Pantoea cypripedii Gad flavoprotein subunit
    statement: Reviewed exemplar verified as the FAD-containing dehydrogenase subunit.
  - source_id: UniProtKB:O34215
    title: Reviewed Pantoea cypripedii Gad cytochrome c subunit
    statement: Reviewed exemplar verified as the cytochrome c electron-transfer subunit.
  - source_id: file:modules/pseudomonad_2_ketogluconate_loop-exemplar-verification.md
    title: Offline-verifiable UniProt exemplar mapping for the Gad complex
    statement: Exact reviewed UniProt ID and DE lines document the O34213/O34214/O34215 subunit assignments.
notes: >-
  The reusable boundary is restricted to Pseudomonas because the complete
  transport-plus-conversion route is well supported there; it is not asserted
  for all Pseudomonadota. KguE (Q88HH8) is a conserved, module-adjacent
  accessory candidate whose exact reaction is unknown and is therefore not a
  required catalytic step. PtxS is regulatory and excluded. PP_3376/Q88HI1 is
  modeled as KguD from direct KT2440 genetics, locus order, and KEGG K00032;
  phosphite dehydrogenase activity is not claimed. The O34213/O34214/O34215
  assignments were verified against reviewed UniProt records as third,
  flavoprotein, and cytochrome c subunits, respectively; Q88HH4/Q88HH5/Q88HH6
  are the corresponding exact KT2440 implementations.
module:
  id: pseudomonad_2_ketogluconate_loop
  label: Pseudomonas 2-ketogluconate loop
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: non-phosphorylated glucose catabolic process
      term: {id: GO:0019595, label: non-phosphorylated glucose catabolic process}
      description: Peripheral oxidative conversion of glucose to 6-phosphogluconate through 2-ketogluconate.
    - preferred_term: D-gluconate metabolic process
      term: {id: GO:0019521, label: D-gluconate metabolic process}
      description: Intracellular transport and phosphorylative conversion of 2-ketogluconate to 6-phosphogluconate.
  context:
    taxa:
      - preferred_term: Pseudomonas
        term: {id: NCBITaxon:286, label: Pseudomonas}
  parts:
    - order: 1
      role: periplasmic glucose oxidation
      node:
        id: gcd_glucose_oxidation
        label: Gcd glucose oxidation
        module_type: REACTION
        annotons:
          - id: gcd_activity
            label: Quinoprotein glucose dehydrogenase
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: reviewed bacterial Gcd
                term: {id: UniProtKB:P15877, label: Quinoprotein glucose dehydrogenase}
                description: Retain the membrane-bound PQQ enzyme architecture; Q88MX4 is the exact KT2440 implementation.
            function:
              preferred_term: quinoprotein glucose dehydrogenase activity
              term: {id: GO:0008876, label: quinoprotein glucose dehydrogenase activity}
              substrates: [{preferred_term: D-glucose}, {preferred_term: ubiquinone}]
              products: [{preferred_term: "D-glucono-1,5-lactone"}, {preferred_term: ubiquinol}]
    - order: 2
      role: periplasmic gluconate oxidation
      node:
        id: gad_gluconate_oxidation
        label: Three-subunit Gad reaction
        module_type: REACTION
        annotons:
          - id: gad_activity
            label: Gluconate 2-dehydrogenase complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: three-subunit membrane-bound gluconate 2-dehydrogenase
                active_units:
                  - id: gad_cytochrome
                    label: Gad cytochrome c subunit
                    role: Membrane-associated heme electron-transfer subunit.
                    participant:
                      selector_type: ORTHOLOG_OF
                      ortholog_of:
                        preferred_term: reviewed Gad cytochrome subunit
                        term: {id: UniProtKB:O34215, label: Gluconate 2-dehydrogenase cytochrome c subunit}
                        description: O34215 is the reviewed role exemplar; Q88HH6 is the exact KT2440 cytochrome c subunit.
                  - id: gad_flavoprotein
                    label: Gad flavoprotein subunit
                    role: FAD-containing gluconate-oxidizing subunit.
                    participant:
                      selector_type: ORTHOLOG_OF
                      ortholog_of:
                        preferred_term: reviewed Gad flavoprotein subunit
                        term: {id: UniProtKB:O34214, label: Gluconate 2-dehydrogenase flavoprotein subunit}
                        description: O34214 is the reviewed role exemplar; Q88HH5 is the exact KT2440 flavoprotein subunit.
                  - id: gad_gamma
                    label: Gad gamma subunit
                    role: Conserved third subunit with unresolved assembly/export mechanism.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: gluconate 2-dehydrogenase subunit 3 family
                        term: {id: InterPro:IPR027056, label: Gluconate 2-dehydrogenase subunit 3}
                        representative_members:
                          - preferred_term: reviewed Gad third subunit
                            term: {id: UniProtKB:O34213, label: Gluconate 2-dehydrogenase subunit 3}
                          - preferred_term: KT2440 PP_3384
                            term: {id: UniProtKB:Q88HH4, label: Gluconate 2-dehydrogenase gamma subunit}
            function:
              preferred_term: gluconate 2-dehydrogenase (acceptor) activity
              term: {id: GO:0033717, label: gluconate 2-dehydrogenase (acceptor) activity}
              substrates: [{preferred_term: D-gluconate}, {preferred_term: oxidized acceptor}]
              products: [{preferred_term: 2-dehydro-D-gluconate}, {preferred_term: reduced acceptor}]
    - order: 3
      role: 2-ketogluconate import
      node:
        id: kgut_import
        label: KguT import
        module_type: TRANSPORT_STEP
        annotons:
          - id: kgut_activity
            label: KguT transporter
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: KT2440 KguT
                term: {id: UniProtKB:Q88HI0, label: Putative 2-ketogluconate transporter}
                description: Orthology must be restricted by conserved kgu-locus context because broad MFS families are not substrate-specific.
            function:
              preferred_term: transmembrane transporter activity
              term: {id: GO:0022857, label: transmembrane transporter activity}
              substrates: [{preferred_term: periplasmic 2-dehydro-D-gluconate}]
              products: [{preferred_term: cytosolic 2-dehydro-D-gluconate}]
    - order: 4
      role: 2-ketogluconate phosphorylation
      node:
        id: kguk_phosphorylation
        label: KguK phosphorylation
        module_type: REACTION
        annotons:
          - id: kguk_activity
            label: 2-dehydrogluconokinase
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: KT2440 KguK
                term: {id: UniProtKB:Q88HH9, label: 2-ketogluconokinase}
                description: Orthology must retain kgu-locus context; the broad PfkB/PANTHER assignment is not an exact selector.
            function:
              preferred_term: dehydrogluconokinase activity
              term: {id: GO:0047841, label: dehydrogluconokinase activity}
              substrates: [{preferred_term: 2-dehydro-D-gluconate}, {preferred_term: ATP}]
              products: [{preferred_term: 2-dehydro-6-phospho-D-gluconate}, {preferred_term: ADP}]
    - order: 5
      role: reduction to 6-phosphogluconate
      node:
        id: kgud_reduction
        label: KguD reduction
        module_type: REACTION
        annotons:
          - id: kgud_activity
            label: Phosphogluconate 2-dehydrogenase
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: KT2440 PP_3376/KguD candidate
                term: {id: UniProtKB:Q88HI1, label: PP_3376 (legacy symbol ptxD)}
                description: Require conserved kgu-locus context and K00032-like assignment; do not propagate the legacy phosphite-dehydrogenase name.
            function:
              preferred_term: phosphogluconate 2-dehydrogenase activity
              term: {id: GO:0008114, label: phosphogluconate 2-dehydrogenase activity}
              substrates: [{preferred_term: 2-dehydro-6-phospho-D-gluconate}, {preferred_term: NADPH}]
              products: [{preferred_term: 6-phospho-D-gluconate}, {preferred_term: NADP+}]
  connections:
    - source: gcd_glucose_oxidation
      target: gad_gluconate_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: Gcd produces a gluconolactone that hydrolyzes to the D-gluconate consumed by Gad.
      chaining_status: VERIFIED
      chaining_note: The intervening D-glucono-1,5-lactone hydrolysis is spontaneous and is not assigned a protein part.
    - {source: gad_gluconate_oxidation, target: kgut_import, connection_type: PROVIDES_INPUT_FOR, description: Gad supplies periplasmic 2-ketogluconate to KguT.}
    - {source: kgut_import, target: kguk_phosphorylation, connection_type: PROVIDES_INPUT_FOR, description: KguT supplies cytosolic 2-ketogluconate to KguK.}
    - {source: kguk_phosphorylation, target: kgud_reduction, connection_type: PROVIDES_INPUT_FOR, description: KguK supplies 2-dehydro-6-phospho-D-gluconate to KguD.}
  knowledge_gaps:
    - gap_statement: The biochemical reaction of conserved KguE remains unknown.
      boundary: Treat KguE as module-adjacent and optional rather than a required reaction until substrate and product are established.
      gap_kind: [BIOLOGY]
    - gap_statement: Purified Q88HI1 target-protein biochemistry has not directly confirmed the KguD reaction or excluded weak side activities.
      boundary: Use direct KT2440 genetics and locus context for the pathway assignment without claiming phosphite dehydrogenase activity.
      gap_kind: [BIOLOGY, CURATION]
