  notes: >-
    Grounded to the completed human reviews of GNPTAB (UniProtKB:Q3T906, GO:0003976) and LYSET
    (Q8N6I4). PANTHER subfamily ids are those in each representative's UniProt cross-references, with
    labels copied from interpro/panther/panther.obo. This module deliberately covers only the tagging
    (phosphotransferase) stage because the remaining members have no AIGR gene review yet: GNPTG
    (gamma subunit of the phosphotransferase; MLIII gamma), NAGPA (uncovering enzyme in the
    trans-Golgi network that removes the covering GlcNAc to expose M6P), and the M6P receptors M6PR
    (cation-dependent) and IGF2R (cation-independent) that sort tagged hydrolases from the TGN to
    endosomes. When those reviews exist they should be added as an uncovering part and a receptor
    sorting part. Site-1 protease (MBTPS1), which activates the alpha/beta precursor, is upstream
    activation context. Disorders: GNPTAB (mucolipidosis II alpha/beta, mucolipidosis III alpha/beta),
    GNPTG (mucolipidosis III gamma), LYSET (mucolipidosis-like lysosomal storage disorder).
