id: MODULE:mannose_6_phosphate_lysosomal_targeting
title: Mannose 6-phosphate tagging of lysosomal hydrolases — Golgi GlcNAc-1-phosphotransferase (GNPTAB) and its retention factor LYSET
description: >-
  Newly synthesised soluble lysosomal acid hydrolases are sorted away from the secretory pathway by
  a mannose 6-phosphate (M6P) recognition marker on their N-glycans. In the cis-Golgi the
  GlcNAc-1-phosphotransferase complex (alpha2beta2gamma2; catalytic alpha/beta subunits encoded by
  GNPTAB, gamma by GNPTG) recognises a conformational protein determinant shared by lysosomal
  hydrolases and transfers GlcNAc-1-phosphate from UDP-GlcNAc to C6 hydroxyls of mannose residues of
  their high-mannose N-glycans. The Golgi membrane protein LYSET (TMEM251) binds the
  GlcNAc-1-phosphotransferase, stabilising it and supporting its site-1 protease activation and Golgi
  retention, and is required for M6P tagging. In the trans-Golgi network the uncovering enzyme NAGPA
  removes the covering GlcNAc to expose M6P, and the M6P receptors (cation-dependent M6PR and
  cation-independent IGF2R) bind the tagged hydrolases and deliver them to endosomes, from which the
  receptors recycle. Loss of GNPTAB causes mucolipidosis II (I-cell disease) and MLIII alpha/beta,
  GNPTG loss causes MLIII gamma, and LYSET deficiency causes a mucolipidosis-like disorder, all with
  hypersecretion of lysosomal enzymes and lysosomal storage.
status: DRAFT
evidence:
  - source_id: GO:0016256
    title: N-glycan processing to lysosome
    statement: >-
      The module is the GO process N-glycan processing to lysosome (GO:0016256): formation of the
      mannose 6-phosphate marker on lysosomal hydrolase N-glycans.
  - source_id: file:human/GNPTAB/GNPTAB-ai-review.yaml
    title: GNPTAB gene review (human)
    statement: >-
      The phosphotransferase step (UniProtKB:Q3T906, GO:0003976, Golgi membrane) matches the
      completed human GNPTAB review.
  - source_id: file:human/LYSET/LYSET-ai-review.yaml
    title: LYSET gene review (human)
    statement: >-
      The retention/stabilisation step (UniProtKB:Q8N6I4; GO:0050821 protein stabilization,
      GO:0007041 lysosomal transport; Golgi membrane) matches the completed human LYSET review.
