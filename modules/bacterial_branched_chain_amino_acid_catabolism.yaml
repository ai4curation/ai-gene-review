id: MODULE:bacterial_branched_chain_amino_acid_catabolism
title: Bacterial branched-chain amino acid catabolism
description: >-
  A reusable bacterial pathway framework for degradation of L-leucine,
  L-isoleucine, and L-valine. Reversible branched-chain amino-acid
  transamination supplies the corresponding 2-oxo acids, and a
  branched-chain 2-oxoacid dehydrogenase complex converts those intermediates
  to branched-chain acyl-CoA thioesters. Substrate-specific downstream routes
  then produce acetyl-CoA, acetoacetate, and/or propionyl-CoA. The module does
  not impose a cellular compartment and separates conserved entry chemistry
  from downstream branches whose enzyme families and gene assignments vary
  among bacteria.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009083
    title: branched-chain amino acid catabolic process
    statement: >-
      GO:0009083 grounds the shared biological-process boundary for bacterial
      leucine, isoleucine, and valine degradation.
  - source_id: KEGG:ppu00280
    title: Pseudomonas putida KT2440 valine, leucine and isoleucine degradation map
    statement: >-
      The KT2440 map supplies a concrete bacterial satisfiability check and
      exact accessions for shared entry, leucine, and valine reactions; broad
      fatty-acid and acetoacetate-utilization map hits are not treated as
      dedicated BCAA enzymes without additional support.
  - source_id: MODULE:leucine_catabolism
    title: Distal L-leucine catabolism module
    statement: >-
      The existing four-position module defines the ordered leucine-specific
      route from 3-methylbutanoyl-CoA to acetoacetate and acetyl-CoA. This
      module points to that route rather than duplicating its reaction tree.
  - source_id: MODULE:valine_isoleucine_distal_catabolism
    title: Valine and isoleucine distal catabolism module
    statement: >-
      The existing distal chemistry provides a comparative route boundary,
      while its mitochondrial context and human exemplars are not inherited
      by this bacterial module.
  - source_id: file:PSEPK/ilvE/ilvE-ai-review.yaml
    title: PSEPK ilvE gene review
    statement: >-
      Q88H54 grounds reversible branched-chain amino-acid:2-oxoglutarate
      transaminase activity without asserting that catabolism is its dominant
      physiological direction in KT2440.
  - source_id: file:PSEPK/lpdV/lpdV-ai-review.yaml
    title: PSEPK lpdV gene review
    statement: >-
      Q88EP9 grounds the E3 dihydrolipoyl-dehydrogenase activity in the
      PP_4401-PP_4404 BCKDH gene cluster.
  - source_id: file:PSEPK/bkdAA/bkdAA-ai-review.yaml
    title: PSEPK bkdAA gene review
    statement: Q88EQ2 grounds the BCKDH E1 alpha subunit and EC 1.2.4.4 chemistry.
  - source_id: file:PSEPK/bkdAB/bkdAB-ai-review.yaml
    title: PSEPK bkdAB gene review
    statement: Q88EQ1 grounds the BCKDH E1 beta subunit and alpha2-beta2 E1 assembly.
  - source_id: file:PSEPK/bkdB/bkdB-ai-review.yaml
    title: PSEPK bkdB gene review
    statement: >-
      Q88EQ0 grounds the lipoyl-bearing BCKDH E2 role and the replacement of
      generic acetyltransferase annotations by GO:0043754.
  - source_id: file:PSEPK/mmsB/mmsB-ai-review.yaml
    title: PSEPK mmsB gene review
    statement: Q88E02 grounds RHEA:17681 in the distal valine branch.
  - source_id: file:PSEPK/mmsA-II/mmsA-II-ai-review.yaml
    title: PSEPK mmsA-II gene review
    statement: >-
      Q88E01 grounds CoA-acylating methylmalonate-semialdehyde dehydrogenase
      activity at the distal end of the valine branch.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-branched-chain-amino-acid-catabolism__ppu00280-deep-research-openscientist.md
    title: OpenScientist PSEPK module, pathway, and taxon synthesis
    statement: >-
      The species-aware report supports the shared IlvE/BCKDH funnel, the
      mmsB-mmsA-II valine assignment, a propionyl-CoA/acetyl-CoA module
      boundary, and exclusion of generic beta-oxidation hits from dedicated
      roles. Its HMG-CoA-lyase ambiguity is superseded by the landed distal
      leucine curation, and its unassigned isoleucine paralogs remain a
      knowledge gap rather than asserted exemplars.
module:
  id: bacterial_branched_chain_amino_acid_catabolism
  label: Bacterial branched-chain amino acid catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: branched-chain amino acid catabolic process
      term:
        id: GO:0009083
        label: branched-chain amino acid catabolic process
      description: >-
        Degradation of L-leucine, L-isoleucine, and L-valine through shared
        2-oxoacid formation and acyl-CoA production followed by distinct
        downstream routes.
  parts:
    - order: 1
      role: reversible formation of branched-chain 2-oxo acids
      node:
        id: bacterial_bcat_entry
        label: Branched-chain amino-acid transamination
        module_type: REACTION
        description: >-
          A PLP-dependent aminotransferase interconverts each branched-chain
          amino acid and its corresponding 2-oxo acid using the
          2-oxoglutarate/L-glutamate amino-group pair.
        annotons:
          - id: bacterial_bcat_activity
            label: Branched-chain amino-acid aminotransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial branched-chain amino-acid aminotransferases
                term:
                  id: PANTHER:PTHR42825
                  label: AMINO ACID AMINOTRANSFERASE
                representative_members:
                  - preferred_term: PSEPK IlvE
                    term:
                      id: UniProtKB:Q88H54
                      label: Branched-chain-amino-acid aminotransferase
                    description: Pseudomonas putida KT2440 ilvE/PP_3511.
              required_function:
                preferred_term: branched-chain-amino-acid:2-oxoglutarate transaminase activity
                term:
                  id: GO:0004084
                  label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
            function:
              preferred_term: branched-chain-amino-acid:2-oxoglutarate transaminase activity
              term:
                id: GO:0004084
                label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
              substrates:
                - preferred_term: L-leucine, L-isoleucine, or L-valine
                - preferred_term: 2-oxoglutarate
              products:
                - preferred_term: corresponding branched-chain 2-oxo acid
                - preferred_term: L-glutamate
              evidence:
                - source_id: RHEA:18321
                  statement: L-leucine transamination reaction in the Q88H54 UniProt record.
                - source_id: RHEA:24801
                  statement: L-isoleucine transamination reaction in the Q88H54 UniProt record.
                - source_id: RHEA:24813
                  statement: L-valine transamination reaction in the Q88H54 UniProt record.
            role_description: >-
              Supplies all three 2-oxoacid substrates. The reaction is
              reversible and can also serve BCAA biosynthesis.
    - order: 2
      role: oxidative decarboxylation to branched-chain acyl-CoA thioesters
      node:
        id: bacterial_bckdh_step
        label: Bacterial branched-chain 2-oxoacid dehydrogenase complex
        module_type: PROTEIN_COMPLEX
        description: >-
          The E1 alpha/beta heterotetramer decarboxylates a branched-chain
          2-oxo acid and acylates an E2 lipoyl arm; E2 transfers the acyl group
          to CoA, and E3 reoxidizes the reduced lipoyl group with NAD+.
        concepts:
          - preferred_term: branched-chain alpha-keto acid dehydrogenase complex
            term:
              id: GO:0160157
              label: branched-chain alpha-ketoacid dehydrogenase complex
        annotons:
          - id: bacterial_bckdh_e1_activity
            label: BCKDH E1 alpha2-beta2 activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial BCKDH E1 alpha2-beta2 heterotetramer
                active_units:
                  - id: bacterial_bckdh_e1_alpha
                    label: BCKDH E1 alpha subunit
                    role: Provides the thiamine-diphosphate-dependent catalytic subunit.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: BCKDH E1 alpha subunit family
                        term:
                          id: PANTHER:PTHR43380
                          label: 2-OXOISOVALERATE DEHYDROGENASE SUBUNIT ALPHA, MITOCHONDRIAL
                        representative_members:
                          - preferred_term: PSEPK BkdAA
                            term:
                              id: UniProtKB:Q88EQ2
                              label: 2-oxoisovalerate dehydrogenase subunit alpha
                            description: Pseudomonas putida KT2440 bkdAA/PP_4401.
                  - id: bacterial_bckdh_e1_beta
                    label: BCKDH E1 beta subunit
                    role: Completes the alpha2-beta2 E1 active assembly.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: BCKDH E1 beta subunit family
                        term:
                          id: PANTHER:PTHR42980
                          label: 2-OXOISOVALERATE DEHYDROGENASE SUBUNIT BETA-RELATED
                        representative_members:
                          - preferred_term: PSEPK BkdAB
                            term:
                              id: UniProtKB:Q88EQ1
                              label: 2-oxoisovalerate dehydrogenase subunit beta
                            description: Pseudomonas putida KT2440 bkdAB/PP_4402.
            function:
              preferred_term: branched-chain 2-oxo acid dehydrogenase activity
              term:
                id: GO:0003863
                label: branched-chain 2-oxo acid dehydrogenase activity
              substrates:
                - preferred_term: branched-chain 2-oxo acid
                - preferred_term: lipoyl-E2
              products:
                - preferred_term: acyl-dihydrolipoyl-E2
                - preferred_term: carbon dioxide
              evidence:
                - source_id: RHEA:13457
                  statement: >-
                    Verified E1 reaction in the Q88EQ2 and Q88EQ1 UniProt
                    records for 3-methyl-2-oxobutanoate and a protein-bound
                    lipoyl group.
            role_description: >-
              The alpha and beta subunits jointly form the E1 heterotetramer;
              neither subunit is modeled as independently enabling this activity.
          - id: bacterial_bckdh_e2
            label: BCKDH E2 lipoamide acyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: BCKDH E2 lipoamide acyltransferase family
                term:
                  id: PANTHER:PTHR43178:SF5
                  label: LIPOAMIDE ACYLTRANSFERASE COMPONENT OF BRANCHED-CHAIN ALPHA-KETO ACID DEHYDROGENASE COMPLEX, MITOCHONDRIAL
                representative_members:
                  - preferred_term: PSEPK BkdB
                    term:
                      id: UniProtKB:Q88EQ0
                      label: Dihydrolipoamide acyltransferase
                    description: Pseudomonas putida KT2440 bkdB/PP_4403.
              required_function:
                preferred_term: dihydrolipoamide branched chain acyltransferase activity
                term:
                  id: GO:0043754
                  label: dihydrolipoamide branched chain acyltransferase activity
            function:
              preferred_term: dihydrolipoamide branched chain acyltransferase activity
              term:
                id: GO:0043754
                label: dihydrolipoamide branched chain acyltransferase activity
              substrates:
                - preferred_term: acyl-dihydrolipoyl-E2
                - preferred_term: coenzyme A
              products:
                - preferred_term: branched-chain acyl-CoA
                - preferred_term: dihydrolipoyl-E2
            role_description: >-
              Lipoyl-bearing E2 core that transfers the branched-chain acyl
              group to CoA.
          - id: bacterial_bckdh_e3
            label: BCKDH E3 dihydrolipoyl dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: dihydrolipoyl dehydrogenase family
                term:
                  id: PANTHER:PTHR22912:SF160
                  label: DIHYDROLIPOYL DEHYDROGENASE
                representative_members:
                  - preferred_term: PSEPK LpdV
                    term:
                      id: UniProtKB:Q88EP9
                      label: Dihydrolipoyl dehydrogenase
                    description: Pseudomonas putida KT2440 lpdV/PP_4404.
              required_function:
                preferred_term: dihydrolipoyl dehydrogenase (NADH) activity
                term:
                  id: GO:0004148
                  label: dihydrolipoyl dehydrogenase (NADH) activity
            function:
              preferred_term: dihydrolipoyl dehydrogenase (NADH) activity
              term:
                id: GO:0004148
                label: dihydrolipoyl dehydrogenase (NADH) activity
              substrates:
                - preferred_term: dihydrolipoyl-E2
                - preferred_term: NAD+
              products:
                - preferred_term: lipoyl-E2
                - preferred_term: NADH
              evidence:
                - source_id: RHEA:15045
                  statement: Verified dihydrolipoyl dehydrogenase reaction in the Q88EP9 UniProt record.
            role_description: >-
              FAD-dependent E3 that restores oxidized lipoyl-E2. E3 enzymes can
              be shared among multiple 2-oxoacid dehydrogenase systems.
    - order: 3
      role: substrate-specific downstream degradation
      node:
        id: bacterial_bcaa_downstream_partition
        label: Branched-chain acyl-CoA downstream routes
        module_type: METABOLIC_PATHWAY
        description: >-
          The acyl-CoA product determines the downstream route. A concrete
          organism can implement one or more branches according to available
          substrates and enzyme repertoire.
        variant_sets:
          - id: bacterial_bcaa_substrate_branches
            label: Downstream substrate branches
            axis: branched-chain amino-acid substrate
            selection: ONE_OR_MORE
            variants:
              - id: bacterial_leucine_distal_branch
                label: Leucine-derived 3-methylbutanoyl-CoA route
                module_type: METABOLIC_PATHWAY
                description: >-
                  3-Methylbutanoyl-CoA is converted through
                  3-methylcrotonyl-CoA, 3-methylglutaconyl-CoA, and HMG-CoA to
                  acetoacetate and acetyl-CoA. The complete ordered reaction
                  tree is maintained in modules/leucine_catabolism.yaml and is
                  not copied here.
                concepts:
                  - preferred_term: L-leucine catabolic process
                    term:
                      id: GO:0006552
                      label: L-leucine catabolic process
                annotons:
                  - id: bacterial_leucine_gateway_activity
                    label: 3-methylbutanoyl-CoA dehydrogenase branch gateway
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: isovaleryl-CoA dehydrogenase family
                        term:
                          id: PANTHER:PTHR43884:SF12
                          label: ISOVALERYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED
                        representative_members:
                          - preferred_term: PSEPK Ivd
                            term:
                              id: UniProtKB:Q88FM5
                              label: Isovaleryl-CoA dehydrogenase
                            description: Pseudomonas putida KT2440 ivd/PP_4064.
                      required_function:
                        preferred_term: 3-methylbutanoyl-CoA dehydrogenase activity
                        term:
                          id: GO:0008470
                          label: 3-methylbutanoyl-CoA dehydrogenase activity
                    function:
                      preferred_term: 3-methylbutanoyl-CoA dehydrogenase activity
                      term:
                        id: GO:0008470
                        label: 3-methylbutanoyl-CoA dehydrogenase activity
                    processes:
                      - preferred_term: L-leucine catabolic process
                        term:
                          id: GO:0006552
                          label: L-leucine catabolic process
                    role_description: >-
                      Marks the branch entry and grounds the bacterial
                      realization; subsequent reactions are delegated to the
                      distal L-leucine catabolism module.
                evidence:
                  - source_id: MODULE:leucine_catabolism
                    statement: >-
                      Reuses the landed distal pathway boundary and reaction
                      ordering without duplicating its four-step tree.
              - id: bacterial_valine_distal_branch
                label: Valine-derived 2-methylpropanoyl-CoA route
                module_type: METABOLIC_PATHWAY
                description: >-
                  Valine-derived 2-methylpropanoyl-CoA is processed through
                  methacrylyl-CoA and 3-hydroxyisobutyrate to methylmalonate
                  semialdehyde, then to propionyl-CoA. The bacterial enzymes
                  for the early hydration/deacylation positions vary and are
                  not assigned here without specific evidence.
                concepts:
                  - preferred_term: L-valine catabolic process
                    term:
                      id: GO:0006574
                      label: L-valine catabolic process
                parts:
                  - order: 1
                    role: 3-hydroxyisobutyrate oxidation
                    node:
                      id: bacterial_valine_hibadh_step
                      label: 3-hydroxyisobutyrate to methylmalonate semialdehyde
                      module_type: REACTION
                      annotons:
                        - id: bacterial_valine_hibadh_activity
                          label: 3-hydroxyisobutyrate dehydrogenase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: 3-hydroxyisobutyrate dehydrogenase family
                              term:
                                id: PANTHER:PTHR22981:SF7
                                label: 3-HYDROXYISOBUTYRATE DEHYDROGENASE, MITOCHONDRIAL
                              representative_members:
                                - preferred_term: PSEPK MmsB
                                  term:
                                    id: UniProtKB:Q88E02
                                    label: 3-hydroxyisobutyrate dehydrogenase
                                  description: Pseudomonas putida KT2440 mmsB/PP_4666.
                            required_function:
                              preferred_term: 3-hydroxyisobutyrate dehydrogenase activity
                              term:
                                id: GO:0008442
                                label: 3-hydroxyisobutyrate dehydrogenase activity
                          function:
                            preferred_term: 3-hydroxyisobutyrate dehydrogenase activity
                            term:
                              id: GO:0008442
                              label: 3-hydroxyisobutyrate dehydrogenase activity
                            substrates:
                              - preferred_term: 3-hydroxy-2-methylpropanoate
                              - preferred_term: NAD+
                            products:
                              - preferred_term: 2-methyl-3-oxopropanoate
                              - preferred_term: NADH
                            evidence:
                              - source_id: RHEA:17681
                                statement: Verified reaction in the Q88E02 UniProt record.
                          processes:
                            - preferred_term: L-valine catabolic process
                              term:
                                id: GO:0006574
                                label: L-valine catabolic process
                          role_description: Oxidizes 3-hydroxyisobutyrate in the distal valine route.
                  - order: 2
                    role: methylmalonate-semialdehyde oxidative decarboxylation
                    node:
                      id: bacterial_valine_mmsdh_step
                      label: Methylmalonate semialdehyde to propionyl-CoA
                      module_type: REACTION
                      annotons:
                        - id: bacterial_valine_mmsdh_activity
                          label: Methylmalonate-semialdehyde dehydrogenase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: methylmalonate-semialdehyde dehydrogenase family
                              term:
                                id: PANTHER:PTHR43866:SF3
                                label: METHYLMALONATE-SEMIALDEHYDE DEHYDROGENASE [ACYLATING], MITOCHONDRIAL
                              representative_members:
                                - preferred_term: PSEPK MmsA-II
                                  term:
                                    id: UniProtKB:Q88E01
                                    label: Methylmalonate-semialdehyde dehydrogenase (acylating)
                                  description: Pseudomonas putida KT2440 mmsA-II/PP_4667.
                            required_function:
                              preferred_term: methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity
                              term:
                                id: GO:0004491
                                label: methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity
                          function:
                            preferred_term: methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity
                            term:
                              id: GO:0004491
                              label: methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity
                            substrates:
                              - preferred_term: methylmalonate semialdehyde
                              - preferred_term: coenzyme A
                              - preferred_term: NAD+
                            products:
                              - preferred_term: propionyl-CoA
                              - preferred_term: carbon dioxide
                              - preferred_term: NADH
                          processes:
                            - preferred_term: L-valine catabolic process
                              term:
                                id: GO:0006574
                                label: L-valine catabolic process
                          role_description: >-
                            Produces propionyl-CoA at the distal end of the
                            valine route.
                connections:
                  - source: bacterial_valine_hibadh_step
                    target: bacterial_valine_mmsdh_step
                    connection_type: PRECEDES
                    chaining_status: VERIFIED
                    chaining_note: >-
                      The first reaction produces methylmalonate semialdehyde,
                      which is the substrate of the second reaction; this
                      connection does not depend on CoA-carrier continuity.
              - id: bacterial_isoleucine_distal_branch
                label: Isoleucine-derived 2-methylbutanoyl-CoA route
                module_type: METABOLIC_PATHWAY
                description: >-
                  2-Methylbutanoyl-CoA is converted through tiglyl-CoA,
                  2-methyl-3-hydroxybutyryl-CoA, and
                  2-methylacetoacetyl-CoA to propionyl-CoA and acetyl-CoA. The
                  reaction sequence is conserved, but a pathway-specific
                  KT2440 enzyme assignment is not made from the generic
                  acyl-CoA dehydrogenase, enoyl-CoA hydratase, dehydrogenase,
                  and thiolase hits on the broad KEGG map.
                concepts:
                  - preferred_term: L-isoleucine catabolic process
                    term:
                      id: GO:0006550
                      label: L-isoleucine catabolic process
                annotons:
                  - id: bacterial_isoleucine_gateway_activity
                    label: 2-methylbutanoyl-CoA dehydrogenation role
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: short-chain 2-methyl fatty acyl-CoA dehydrogenase activity
                        term:
                          id: GO:0003853
                          label: short-chain 2-methyl fatty acyl-CoA dehydrogenase activity
                      description: >-
                        A pathway-specific bacterial enzyme must be selected
                        from organism-level evidence; no KT2440 representative
                        is asserted here.
                    function:
                      preferred_term: short-chain 2-methyl fatty acyl-CoA dehydrogenase activity
                      term:
                        id: GO:0003853
                        label: short-chain 2-methyl fatty acyl-CoA dehydrogenase activity
                      substrates:
                        - preferred_term: 2-methylbutanoyl-CoA
                      products:
                        - preferred_term: tiglyl-CoA
                    processes:
                      - preferred_term: L-isoleucine catabolic process
                        term:
                          id: GO:0006550
                          label: L-isoleucine catabolic process
                    role_description: >-
                      Defines the isoleucine branch gateway while preserving
                      the unresolved bacterial gene assignment.
                knowledge_gaps:
                  - gap_statement: >-
                      Which KT2440 proteins carry the pathway-specific
                      2-methylbutanoyl-CoA dehydrogenase, hydration,
                      3-hydroxyacyl-CoA dehydrogenase, and terminal thiolase
                      roles during growth on isoleucine?
                    boundary: >-
                      KEGG supplies multiple generic beta-oxidation-family
                      candidates, but the local records do not establish
                      substrate specificity or physiological pathway use.
  connections:
    - source: bacterial_bcat_entry
      target: bacterial_bckdh_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Branched-chain 2-oxo acids produced by transamination are substrates
        for the BCKDH complex.
    - source: bacterial_bckdh_step
      target: bacterial_leucine_distal_branch
      connection_type: PROVIDES_INPUT_FOR
      description: The leucine-derived product is 3-methylbutanoyl-CoA.
    - source: bacterial_bckdh_step
      target: bacterial_valine_distal_branch
      connection_type: PROVIDES_INPUT_FOR
      description: The valine-derived product is 2-methylpropanoyl-CoA.
    - source: bacterial_bckdh_step
      target: bacterial_isoleucine_distal_branch
      connection_type: PROVIDES_INPUT_FOR
      description: The isoleucine-derived product is 2-methylbutanoyl-CoA.
  knowledge_gaps:
    - gap_statement: >-
        Which bacterial lineages use a single broad-specificity BCKDH complex
        for all three branched-chain 2-oxo acids, and which partition flux
        among paralogous 2-oxoacid dehydrogenase complexes?
      boundary: >-
        The shared chemistry is conserved, but paralog specificity must be
        established for each concrete organism.
  notes: >-
    Molecular functions are restricted to leaf annotons. The module has no
    generic cytoplasm or cytosol assertion because bacterial compartment
    evidence varies and no location is required to define the chemistry.
    PSEPK accessions are representative exemplars, not restrictions on the
    reusable module. The leucine branch intentionally delegates its full
    four-reaction topology to modules/leucine_catabolism.yaml. The broad
    human-focused modules/branched_chain_amino_acid_catabolism.yaml is retained
    unchanged.
