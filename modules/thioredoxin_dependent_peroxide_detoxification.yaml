id: MODULE:thioredoxin_dependent_peroxide_detoxification
title: Bcp thioredoxin-dependent peroxide detoxification
description: >-
  A cytosolic peroxide-detoxification reaction centered on the E. coli atypical
  2-Cys peroxiredoxin Bcp. Bcp reduces hydrogen peroxide and organic
  hydroperoxides through a Cys45 sulfenic-acid intermediate and Cys45-Cys50
  intramolecular disulfide, with thioredoxin-family reductants restoring the
  active reduced enzyme.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0140824
    title: thioredoxin-dependent peroxiredoxin activity
    statement: Defines Bcp's primary thioredoxin-dependent peroxiredoxin activity.
  - source_id: GO:0098869
    title: cellular oxidant detoxification
    statement: Defines the peroxide-removal process served by Bcp.
  - source_id: file:genes/ECOLI/bcp/bcp-ai-review.yaml
    title: ECOLI bcp gene review
    statement: >-
      The completed E. coli bcp review grounds Bcp as a versatile atypical
      2-Cys peroxiredoxin.
  - source_id: PMID:10644761
    title: >-
      Thioredoxin-dependent hydroperoxide peroxidase activity of
      bacterioferritin comigratory protein (BCP) as a new member of the
      thiol-specific antioxidant protein (TSA)/Alkyl hydroperoxide peroxidase
      C (AhpC) family.
    statement: Establishes Bcp's thioredoxin-dependent thiol peroxidase activity.
  - source_id: PMID:21910476
    title: >-
      Kinetic and thermodynamic features reveal that Escherichia coli BCP is
      an unusually versatile peroxiredoxin.
    statement: >-
      Establishes Bcp's broad peroxide and reducing-substrate specificity and
      high redox potential.
  - source_id: PMID:19298085
    title: >-
      Interrogating the molecular details of the peroxiredoxin activity of the
      Escherichia coli bacterioferritin comigratory protein using
      high-resolution mass spectrometry.
    statement: Supports the atypical 2-Cys Bcp catalytic mechanism.
notes: >-
  This module uses thioredoxin as the canonical reductant because Bcp is
  curated to the thioredoxin-dependent peroxiredoxin term; Bcp can also accept
  reducing equivalents from Trx2 and glutaredoxins in vitro.
