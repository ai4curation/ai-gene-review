id: MODULE:pyrimidine_degradation
title: Reductive pyrimidine degradation
description: >-
  A reusable three-reaction pathway for reductive degradation of uracil and
  thymine. Dihydropyrimidine dehydrogenase first reduces the pyrimidine ring,
  dihydropyrimidinase opens the saturated ring, and beta-ureidopropionase
  releases beta-alanine or beta-aminoisobutyrate, carbon dioxide, and ammonium.
  The pathway chemistry is conserved, but the first and third enzymes have
  distinct taxonomic implementations.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006208
    title: pyrimidine nucleobase catabolic process
    statement: >-
      GO:0006208 captures degradation of uracil and thymine represented by
      this three-reaction pathway.
  - source_id: file:PSEPK/pydA/pydA-ai-review.yaml
    title: PSEPK pydA gene review
    statement: >-
      Q88FQ0 contributes to the heteromeric PydXA dihydropyrimidine
      dehydrogenase required for uracil and thymine utilization.
  - source_id: file:PSEPK/pydX/pydX-ai-review.yaml
    title: PSEPK pydX gene review
    statement: >-
      Q88FQ1 is the NADH-oxidizing flavin/iron-sulfur partner subunit of the
      same PydXA enzyme; its specific flavin remains unresolved.
  - source_id: file:PSEPK/pydB/pydB-ai-review.yaml
    title: PSEPK pydB gene review
    statement: >-
      A0A140FWK2 is the zinc-dependent dihydropyrimidinase performing the
      second reaction.
  - source_id: file:PSEPK/hyuC/hyuC-ai-review.yaml
    title: PSEPK hyuC gene review
    statement: >-
      Q88FQ3 is a candidate terminal beta-ureidopropionase near the PSEPK pyd
      locus, but beta-ureidopropionate, allantoate, and
      N-carbamoyl-L-amino-acid specificities remain unresolved.
notes: >-
  This revision preserves the previously curated human route while adding the
  bacterial PydXA and HyuC implementations. The module is drawn with the
  uracil-to-beta-alanine branch; thymine follows the same three roles to
  beta-aminoisobutyrate. In PSEPK, Q88FQ3 and PP_0614/Q88Q81 are unresolved
  candidates for the terminal reaction. PTHR32494 membership alone does not
  establish beta-ureidopropionase activity, so the bacterial HyuC variant below
  requires independent function evidence. Pyrimidine nucleotide
  dephosphorylation, base transport, beta-alanine utilization, CoA synthesis,
  and fluoropyrimidine pharmacology are outside the core.
