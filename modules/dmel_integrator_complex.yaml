id: MODULE:dmel_integrator_complex
title: Integrator complex in Drosophila melanogaster
description: >-
  Integrator is a multisubunit complex that binds promoter-proximal RNA polymerase II and
  cleaves nascent transcripts. Its endonuclease module, in which IntS11 is the catalytic subunit
  related to the cleavage and polyadenylation endonuclease Cpsf73, processes the 3' ends of
  snRNAs and terminates transcription of paused or non-productive polymerases at protein-coding
  genes, enhancers and long noncoding RNA loci. Integrator also recruits protein phosphatase
  2A through IntS6 and IntS8, forming the Integrator-PP2A (INTAC) complex that dephosphorylates
  the polymerase C-terminal domain and Spt5 and opposes P-TEFb. In Drosophila, Integrator
  attenuates transcription at many genes and is required for snRNA processing.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002030
  title: 'FlyBase gene group INT: Integrator complex'
  statement: >-
    FlyBase release FB2026_03 groups 15 D. melanogaster genes as integrator complex (INT);
    this module models that group.
- source_id: FB:FBgg0002031
  title: 'FlyBase gene group INTAC: Integrator-pp2a complex'
  statement: >-
    FlyBase release FB2026_03 groups 17 D. melanogaster genes as integrator-pp2a complex (INTAC);
    this module models that group.
- source_id: GO:0032039
  title: integrator complex
  statement: >-
    GO term grounding the module as integrator complex.
- source_id: GO:0160232
  title: INTAC complex
  statement: >-
    GO term grounding the module as INTAC complex.
notes: >-
  Boundary. FlyBase groups the core Integrator (INT) and Integrator-PP2A (INTAC); INTAC adds
  the PP2A catalytic (mts) and scaffolding (Pp2A-29B) subunits, which are general PP2A subunits
  that also act in many other complexes. The four-part decomposition follows the endonuclease,
  backbone/shoulder, IntS10-13-14 and phosphatase modules described for human Integrator;
  IntS3 and IntS12 are placed with the core scaffold for simplicity. FlyBase groups realized
  by this module: INT (FBgg0002030), INTAC (FBgg0002031). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_integrator_complex.yaml; none of the member genes has a gene review
  yet unless noted.
