- source_id: GO:0045197
  title: establishment or maintenance of epithelial cell apical/basal polarity
  statement: >-
    GO term grounding the module as establishment or maintenance of epithelial cell apical/basal
    polarity.
notes: >-
  The Par complex also acts in neuroblast asymmetric division and the Scribble module in neuromuscular
  junction organization; this module describes their shared core composition. Other polarity
  regulators (Cdc42, Yurt, Coracle group, Par-1) are context and not parts. FlyBase groups
  realized by this module: PAR (FBgg0001760), SCRIBC (FBgg0001762), CRBC (FBgg0001763). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_epithelial_polarity_complexes.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
