id: MODULE:dmel_epithelial_polarity_complexes
title: Apical-basal polarity complexes (Par, Crumbs, Scribble) in Drosophila melanogaster
description: >-
  Epithelial cells divide their plasma membrane into apical and basolateral domains using
  three conserved groups of polarity proteins that act on each other. The Par complex, Bazooka
  (Par-3), Par-6 and atypical protein kinase C (aPKC), marks the apical side and the adherens
  junction; aPKC phosphorylates basolateral proteins to exclude them from the apical membrane.
  The Crumbs complex, the transmembrane protein Crumbs with Stardust (PALS1) and Patj, defines
  the apical membrane above the adherens junction. The Scribble module, Scribble, Discs large
  (Dlg1) and Lethal (2) giant larvae (Lgl), acts basolaterally and restricts apical determinants.
  Mutual antagonism between apical and basolateral proteins sets the boundary, and loss of
  the Scribble module causes neoplastic overgrowth.
status: DRAFT
scope: CONCRETE
