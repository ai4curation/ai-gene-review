  notes: 'Boundary: aspartate supply, phosphoserine supply for ThrH, NADPH/ATP/PLP production, methionine
    and lysine branches, isoleucine formation, and threonine catabolism are outside the five transformations
    modeled here. This boundary is not a reason to reject broader GO involvement by an upstream enzyme.
    All five transformations are required; architecture, donor and synthase variants are alternatives.
    One fusion protein can satisfy steps 1 and 3, but never bypasses step 2. Representatives orient known
    implementations and do not prove complete routes in every represented species. No common compartment
    or universal feedback inhibitor is asserted. The represented yeasts use the alpha-aminoadipate lysine
    route; modern fungal DHDPS characterization supports this boundary without extrapolating a historical
    lower-fungi DAP claim. PANTHER membership is checked independently of readable labels: PTHR43070:SF5
    mixes mono- and bifunctional architectures, and PTHR10314 has the surprising official name CYSTATHIONINE
    BETA-SYNTHASE. Independent activity and architecture restrictions therefore accompany these selectors.
    Six GO-CAM sources were normally refreshed; current source assessments above supersede the old absent-edge/reversed-edge
    claims. The retained activity links are verified against current enabled-by/MF records. Broad source
    process labels and AAT1 localization are assessed on biological evidence rather than this module boundary.
    Inferred product-to-substrate order does not assert substrate channeling. Nuclear silencing/repair-associated
    findings for yeast pathway proteins are distinct contexts reviewed at gene level and are not steps
    of this biosynthetic reaction module. Additional architectures discussed in the comparative review,
    including a phosphoglycerate-mutase-like homoserine-phosphorylation alternative, are not equated with
    HAD-like ThrH and are not assigned guessed accessions. The present panel documents the two donor implementations
    supported by its reviewed representatives.'
