      connection_type: PRECEDES
      description: L-homoserine made by the trunk is the substrate of homoserine kinase.
  notes: >-
    Boundary: L-aspartate to L-threonine. Aspartate supply (pyruvate
    carboxylase and aspartate aminotransferase; YeastCyc PYC1, PYC2, AAT1,
    AAT2) belongs to aspartate_asparagine_metabolism. The methionine branch
    from L-homoserine is methionine_biosynthesis. Isoleucine synthesis from
    threonine and threonine catabolism (for example threonine aldolase) are
    downstream and outside the module. The module covers bacteria, fungi and
    plants, so no compartment is asserted: the fungal enzymes are cytosolic
    in both GO-CAMs, whereas the plant enzymes are chloroplastic
    (PMID:8204822, PMID:9636232). YeastCyc assessment: the five reaction
    assignments (HOM3, HOM2, HOM6, THR1, THR4) are correct and no S.
    cerevisiae enzyme is missing. Generalisation caveats: (1) in fungi aspartate
    semialdehyde does not feed lysine synthesis, which uses the
    alpha-aminoadipate pathway (lysine_biosynthesis_aminoadipate), whereas in
    bacteria and plants it also feeds the diaminopimelate pathway; (2) in
    plants O-phospho-L-homoserine, not L-homoserine, is the threonine and
    methionine branch point (PMID:9636232), so homoserine kinase is shared
    there; (3) aspartate kinase and homoserine dehydrogenase are modelled with
    monofunctional and bifunctional AK-HSDH variants. ASADH is one annoton
    because the two PANTHER families are divergent homologues catalysing the
    same reaction, not different architectures. GO-CAM disagreements: (a)
    none of the YeastPathways models has causal edges between the trunk and
    branch activities; (b) THRESYN-PWY, PWY3O-7 and P4-PWY-1 include AAT1 in
    the cytosol, although Aat1 is the mitochondrial isozyme; (c) P4-PWY-1 puts
    every activity under GO:0006566 L-threonine metabolic process rather than
    the specific biosynthetic processes, and its causal edges run
    MET6 -> MET17 -> MET2 -> THR1, the reverse of the biosynthetic order and
    linking the competing MET2 and THR1 branches; (d) PWY3O-7 mixes
    GO:0009090 (HOM3, HOM2) and GO:0009088 (HOM6) part_of assertions for the
    trunk. The PomBase model 678073a900003175 agrees with the module for the
    five steps and adds threonine aldolase, transport and tRNA ligation
    activities that are outside it. Regulation is not modelled: threonine
    inhibits yeast aspartate kinase and homoserine kinase (PMID:1847111,
    PMID:6821505), and HOM3, HOM2 and THR1 are under general amino acid
    control (PMID:1789001).
