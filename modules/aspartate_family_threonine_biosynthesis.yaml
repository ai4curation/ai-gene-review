id: MODULE:aspartate_family_threonine_biosynthesis
title: L-threonine biosynthesis from L-aspartate
description: L-threonine synthesis from L-aspartate through five successive transformations, represented
  by bacterial, fungal and plant enzymes and by two experimentally characterized archaeal steps. Aspartate
  kinase forms 4-phospho-L-aspartate; NADPH-dependent aspartate-semialdehyde dehydrogenase produces L-aspartate
  4-semialdehyde; homoserine dehydrogenase produces L-homoserine; homoserine phosphorylation supplies
  O-phospho-L-homoserine; and PLP-dependent threonine synthase forms L-threonine. Homoserine phosphorylation
  can use ATP through a GHMP kinase or phosphoserine through the distinct Pseudomonas ThrH phosphotransferase,
  which releases serine. In the represented yeasts and E. coli, homoserine is shared with methionine synthesis;
  in plants the shared intermediate is O-phosphohomoserine, so homoserine kinase does not commit flux
  exclusively to threonine. Aspartate kinase and homoserine dehydrogenase may be separate proteins or
  domains of an AK-HSDH fusion. Cofactor preference, feedback sensitivity and oligomeric state are enzyme-specific.
  Arabidopsis TS1 is activated by S-adenosylmethionine, an allosteric effector rather than a consumed
  substrate. The aspartate-semialdehyde branch can supply diaminopimelate-pathway lysine synthesis in
  plants and many prokaryotes; the represented fungi instead use the alpha-aminoadipate lysine pathway.
  This is a reusable reaction module, not a claim that every member of any named taxon has a complete
  pathway.
status: DRAFT
