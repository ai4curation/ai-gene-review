- source_id: YeastPathways:P4-PWY-1
  title: superpathway of threonine and methionine biosynthesis (S. cerevisiae, SGD YeastPathways)
  statement: Combined threonine and methionine superpathway. Its trunk and threonine reactions are modelled
    here; the MET2, MET17, MET6 and MET7 reactions belong to methionine_biosynthesis, and AAT1/AAT2 to
    aspartate supply.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=P4-PWY-1
- source_id: GO:0009088
  title: L-threonine biosynthetic process
  statement: Module-level biological process.
- source_id: GO:0009090
  title: L-homoserine biosynthetic process
  statement: Biological process of the aspartate-to-homoserine trunk submodule.
- source_id: PMID:11352712
  title: The central enzymes of the aspartate family of amino acid biosynthesis.
  statement: Review of aspartate kinase, aspartate-semialdehyde dehydrogenase and homoserine dehydrogenase
    across plants and microorganisms, including their structures and bifunctional fusions.
  supporting_text: The aspartate pathway is responsible for the biosynthesis of lysine, threonine, isoleucine,
    and methionine in most plants and microorganisms.
- source_id: PMID:2892836
  title: Structure of the yeast HOM3 gene which encodes aspartokinase.
  statement: HOM3 is the single-copy structural gene for S. cerevisiae aspartate kinase; hom3 mutants
    require threonine and methionine and lack aspartokinase activity.
  supporting_text: Mutations in HOM3 result in a requirement for threonine and methionine (or homoserine)
    for growth and a lack of detectable aspartokinase activity.
- source_id: PMID:6821505
  title: Genetic and biochemical study of threonine-overproducing mutants of Saccharomyces cerevisiae.
  statement: Yeast aspartokinase is feedback-inhibited by threonine; loss of this inhibition causes threonine
    overproduction.
  supporting_text: The gene HOM3 codes for aspartokinase (aspartate kinase; EC 2.7.2.4), the first enzyme
    of the threonine-methionine biosynthetic route, which is subjected to feedback inhibition by threonine.
- source_id: PMID:1847111
  title: Inhibition by different amino acids of the aspartate kinase and the homoserine kinase of the
    yeast Saccharomyces cerevisiae.
  statement: Of the amino acids tested, only threonine effectively inhibits both yeast aspartate kinase
    and homoserine kinase.
- source_id: PMID:2570346
  title: Structure of the HOM2 gene of Saccharomyces cerevisiae and regulation of its expression.
  statement: HOM2 encodes S. cerevisiae aspartate-semialdehyde dehydrogenase.
  supporting_text: In Saccharomyces cerevisiae the HOM2 gene encodes aspartic semi-aldehyde dehydrogenase
    (ASA DH).
- source_id: PMID:11341914
  title: 'Characterization of yeast homoserine dehydrogenase, an antifungal target: the invariant histidine
    309 is important for enzyme integrity.'
  statement: Purified recombinant S. cerevisiae homoserine dehydrogenase (Hom6) reduces aspartate semialdehyde
    to homoserine with NADH or NADPH.
  supporting_text: HSD efficiently reduces aspartate semialdehyde to homoserine (Hse) using either NADH
    or NADPH
- source_id: PMID:2176637
  title: Saccharomyces cerevisiae homoserine kinase is homologous to prokaryotic homoserine kinases.
  statement: THR1 encodes yeast homoserine kinase; disruption causes threonine auxotrophy and the protein
    is homologous to bacterial ThrB.
  supporting_text: Disruption of the THR1 gene results in threonine auxotrophy in yeast.
- source_id: PMID:8082795
  title: Biochemical evidence that the Saccharomyces cerevisiae THR4 gene encodes threonine synthetase.
  statement: Threonine synthase activity, measured as threonine formed from O-phosphohomoserine, depends
    on a functional THR4 gene.
- source_id: PMID:8204822
  title: Molecular analysis of the aspartate kinase-homoserine dehydrogenase gene from Arabidopsis thaliana.
  statement: The Arabidopsis bifunctional AK-HSDH is homologous to the E. coli thrA and metL bifunctional
    enzymes and carries a chloroplast-targeting sequence.
  supporting_text: The A. thaliana ak-hsdh gene is proposed to be the plant thrA homologue coding for
    the AK isozyme feedback inhibited by threonine.
- source_id: PMID:12602885
  title: Transcriptional and biochemical regulation of a novel Arabidopsis thaliana bifunctional aspartate
    kinase-homoserine dehydrogenase gene isolated by functional complementation of a yeast hom6 mutant.
  statement: Arabidopsis AKHSDH2 (akthr2, At4g19710), not AKHSDH1, complements yeast hom6 and hom3 mutants
    and supplies both activities.
- source_id: PMID:9748328
  title: Allosteric activation of Arabidopsis threonine synthase by S-adenosylmethionine.
  statement: Plant threonine synthase, unlike its bacterial counterpart, is strongly activated by S-adenosylmethionine.
  supporting_text: Plant threonine synthase, in contrast to its bacterial counterpart, is strongly stimulated
    by S-adenosylmethionine via a noncovalent interaction
- source_id: PMID:9636232
  title: The specific features of methionine biosynthesis and metabolism in plants.
  statement: In plant chloroplasts O-phosphohomoserine is the branch point between threonine synthase
    and cystathionine gamma-synthase.
  supporting_text: OPH is therefore a branch point intermediate for methionine and threonine syntheses
    in plants
- source_id: PMID:10220164
  title: ThrH, a homoserine kinase isozyme with in vivo phosphoserine phosphatase activity in Pseudomonas
    aeruginosa.
  statement: Native P. aeruginosa thrB/thrH double disruption produces threonine auxotrophy. This establishes
    substitution in vivo; the later biochemical study PMID:14699121 identifies the phosphate donor and
    distinguishes ThrH from an ATP kinase.
  supporting_text: In P. aeruginosa, threonine auxotrophy is observed only when both thrB and thrH are
    simultaneously inactivated.
- source_id: PMID:1789001
  title: Four major transcriptional responses in the methionine/threonine biosynthetic pathway of Saccharomyces
    cerevisiae.
  statement: HOM3, HOM2 and THR1 are under general amino acid control; cited by YeastPathways for HOMOSERSYN-PWY.
- source_id: PMID:17012784
  title: The initial step in the archaeal aspartate biosynthetic pathway catalyzed by a monofunctional
    aspartokinase.
  statement: Direct MJ0571 biochemistry establishes archaeal ATP-dependent aspartate phosphorylation and
    threonine-sensitive regulation, not a complete archaeal pathway.
  supporting_text: mj AK catalyzes phosphoryl transfer to l -aspartate at 310 K with a turnover of 12
    s −1 .
- source_id: PMID:11812229
  title: Overproduction, purification, and characterization of recombinant aspartate semialdehyde dehydrogenase
    from Arabidopsis thaliana.
  statement: Recombinant Arabidopsis ASAD consumes NADPH and aspartyl phosphate. The locus At1g14810 is
    linked to this primary study by PMID:22303247; the primary abstract itself does not give the locus.
  supporting_text: The plant enzyme exhibited a specific activity of 26 micromol NADPH oxidized min(-1)
    mg(-1) of protein with a K(M) value for NADPH of 92 microM.
- source_id: PMID:16216875
  title: Identification of six novel allosteric effectors of Arabidopsis thaliana aspartate kinase-homoserine
    dehydrogenase isoforms. Physiological context sets the specificity.
  statement: Both Arabidopsis AKHSDH isoforms were assayed directly. Their kinase and dehydrogenase activities
    implement the first and third reactions; their regulation differs.
  supporting_text: These two activities catalyze the first and the third steps toward the synthesis of
    the essential amino acids threonine, isoleucine, and methionine.
- source_id: PMID:10562426
  title: Identification of the gene encoding homoserine kinase from Arabidopsis thaliana and characterization
    of the recombinant enzyme derived from the gene.
  statement: Arabidopsis HSK uses MgATP and supplies the shared plant methionine/threonine intermediate.
    The primary identifies a chromosome II locus, consistent with At2g17265 rather than the erroneous
    chromosome IV locus in PMID:22303247.
  supporting_text: Homoserine kinase (EC 2.7.1.39) catalyzes the formation of O-phospho-l-homoserine,
    a branch point intermediate in the pathways for Met and Thr in plants.
- source_id: PMID:14699121
  title: The thrH gene product of Pseudomonas aeruginosa is a dual activity enzyme with a novel phosphoserine:homoserine
    phosphotransferase activity.
  statement: Direct HPLC assay distinguishes phosphoserine-to-homoserine phosphoryl transfer from ATP-dependent
    kinase activity.
  supporting_text: ThrH is able to further transfer the phosphoryl group to homoserine using phosphoserine
    as the phosphoryl group donor, indicating that ThrH has a novel phosphoserine:homoserine phosphotransferase
    activity.
- source_id: PMID:10429206
  title: Characterization of recombinant Arabidopsis thaliana threonine synthase.
  statement: Arabidopsis TS1 catalyzes the PLP-dependent terminal reaction; the same study compares its
    regulation and assembly with E. coli and yeast enzymes.
  supporting_text: Threonine synthase (TS) catalyses the last step in the biosynthesis of threonine, the
    pyridoxal 5'-phosphate dependent conversion of L-homoserine phosphate (HSerP) into L-threonine and
    inorganic phosphate.
- source_id: PMID:11535056
  title: Structural basis for the catalysis and substrate specificity of homoserine kinase.
  statement: Direct substrate/ATP-analogue structures of archaeal ThrB support the GHMP kinase implementation.
  supporting_text: The high-resolution structures of Methanococcus jannaschii HSK ternary complexes with
    its amino acid substrate and ATP analogues have been determined by X-ray crystallography.
- source_id: PMID:29959064
  title: Dihydrodipicolinate synthase is absent in fungi.
  statement: Functional testing of fungal DHDPS candidates and sequence comparison support the alpha-aminoadipate
    boundary; these experiments are in Coccidioides and Fonsecaea, not direct tests of the two yeast exemplars.
  supporting_text: The candidate with the highest number of identities (6 of 7), KIW77228 from Fonsecaea
    pedrosoi, was shown to have trace DHDPS activity in vitro, partially restored by substitution of the
    seventh critical residue, and to be incapable of complementing DHDPS-deficient E. coli cells.
- source_id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a branched
    network of many biochemical pathways.
  statement: Comparative review supports variable network branches and architecture/regulatory diversity
    across domains; its evolutionary scenarios are not treated as PAINT ancestral-node assertions.
  supporting_text: ThrA is inhibited by threonine, LysC is inhibited by lysine, and the synthesis of MetL
    is repressed by methionine
- source_id: PMID:22303247
  title: Aspartate-Derived Amino Acid Biosynthesis in Arabidopsis thaliana.
  statement: Plant review maps the ASAD primary to At1g14810 and supports the phosphohomoserine branchpoint.
    Its HSK locus At4g35295 is incorrect for the verified target At2g17265; its AK-HSDH paragraph also
    says threonine dehydrogenase where the primary concerns homoserine dehydrogenase.
  supporting_text: In vitro overproduction and analysis of the A. thaliana At1g14810 confirmed the predicted
    aspartate semialdehyde dehydrogenase activity
- source_id: PMID:20019093
  title: Recent progress in deciphering the biosynthesis of aspartate-derived amino acids in plants.
  statement: Review of plant regulation and metabolic context; only the abstract is available here and
    no detailed new mechanistic claim is assigned to it.
- source_id: PMID:19622802
  title: Downy mildew resistance in Arabidopsis by mutation of HOMOSERINE KINASE.
  statement: Direct map-based cloning and target sequencing establish Arabidopsis DMR1/HSK as At2g17265,
    correcting the HSK locus error in the comparative review PMID:22303247.
  supporting_text: Single point mutations in the At2g17265 gene were identified by nucleotide sequencing
    of the dmr1-1 , dmr1-2 , dmr1-3 , and dmr1-4 mutants.
