id: MODULE:aspartate_family_threonine_biosynthesis
title: L-threonine biosynthesis from L-aspartate
description: >-
  De novo biosynthesis of L-threonine from L-aspartate in five reactions, as
  found in bacteria, fungi and plants; animals lack the pathway. The first
  three reactions form the aspartate-family trunk that produces L-homoserine:
  aspartate kinase phosphorylates L-aspartate to 4-phospho-L-aspartate,
  aspartate-semialdehyde dehydrogenase reduces it with NADPH to L-aspartate
  4-semialdehyde, and homoserine dehydrogenase reduces the semialdehyde with
  NAD(P)H to L-homoserine. L-homoserine is a branch point: homoserine kinase
  commits it to threonine as O-phospho-L-homoserine, and threonine synthase, a
  pyridoxal-phosphate enzyme, converts O-phospho-L-homoserine to L-threonine.
  The chemistry is conserved but the enzyme architecture varies. Aspartate
  kinase and homoserine dehydrogenase are separate monofunctional proteins in
  fungi, whereas bacteria such as Escherichia coli and plants also carry
  bifunctional aspartate kinase-homoserine dehydrogenase fusion proteins. The
  threonine synthases of plants are allosterically activated by
  S-adenosylmethionine, whereas the bacterial and fungal enzymes are not. In
  plants O-phospho-L-homoserine is also the substrate of cystathionine
  gamma-synthase, so the methionine branch diverges after the kinase. In
  bacteria and plants L-aspartate 4-semialdehyde also feeds the
  diaminopimelate lysine pathway; fungi make lysine by the unrelated
  alpha-aminoadipate pathway, so in fungi the trunk serves only threonine,
  isoleucine and methionine. Threonine feedback-inhibits the trunk, chiefly at
  aspartate kinase.
status: DRAFT
evidence:
  - source_id: YeastPathways:HOMOSERSYN-PWY
    title: L-homoserine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway for the trunk: ASPARTATEKIN-RXN (HOM3),
      ASPARTATE-SEMIALDEHYDE-DEHYDROGENASE-RXN (HOM2) and HOMOSERDEHYDROG-RXN
      (HOM6). All three gene assignments were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HOMOSERSYN-PWY
  - source_id: YeastPathways:HOMOSER-THRESYN-PWY
    title: L-threonine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway for the threonine branch: HOMOSERKIN-RXN (THR1) and
      THRESYN-RXN (THR4). Both assignments were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HOMOSER-THRESYN-PWY
  - source_id: YeastPathways:THRESYN-PWY
    title: superpathway of L-threonine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway of the five module reactions plus aspartate
      aminotransferase (AAT1, AAT2), which supplies aspartate and is kept
      outside this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=THRESYN-PWY
  - source_id: YeastPathways:PWY3O-7
    title: superpathway of threonine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway from oxaloacetate: adds pyruvate carboxylase (PYC1, PYC2)
      and aspartate aminotransferase (AAT1, AAT2) upstream of the five module
      reactions. Those supply reactions are kept outside this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-7
  - source_id: YeastPathways:P4-PWY-1
    title: superpathway of threonine and methionine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Combined threonine and methionine superpathway. Its trunk and threonine
      reactions are modelled here; the MET2, MET17, MET6 and MET7 reactions
      belong to methionine_biosynthesis, and AAT1/AAT2 to aspartate supply.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=P4-PWY-1
  - source_id: GO:0009088
    title: L-threonine biosynthetic process
    statement: Module-level biological process.
  - source_id: GO:0009090
    title: L-homoserine biosynthetic process
    statement: Biological process of the aspartate-to-homoserine trunk submodule.
  - source_id: PMID:11352712
    title: The central enzymes of the aspartate family of amino acid biosynthesis.
    statement: >-
      Review of aspartate kinase, aspartate-semialdehyde dehydrogenase and
      homoserine dehydrogenase across plants and microorganisms, including
      their structures and bifunctional fusions.
    supporting_text: >-
      The aspartate pathway is responsible for the biosynthesis of lysine,
      threonine, isoleucine, and methionine in most plants and microorganisms.
  - source_id: PMID:2892836
    title: Structure of the yeast HOM3 gene which encodes aspartokinase.
    statement: >-
      HOM3 is the single-copy structural gene for S. cerevisiae aspartate
      kinase; hom3 mutants require threonine and methionine and lack
      aspartokinase activity.
    supporting_text: >-
      Mutations in HOM3 result in a requirement for threonine and methionine
      (or homoserine) for growth and a lack of detectable aspartokinase
      activity.
  - source_id: PMID:6821505
    title: Genetic and biochemical study of threonine-overproducing mutants of Saccharomyces cerevisiae.
    statement: >-
      Yeast aspartokinase is feedback-inhibited by threonine; loss of this
      inhibition causes threonine overproduction.
    supporting_text: >-
      The gene HOM3 codes for aspartokinase (aspartate kinase; EC 2.7.2.4), the
      first enzyme of the threonine-methionine biosynthetic route, which is
      subjected to feedback inhibition by threonine.
  - source_id: PMID:1847111
    title: Inhibition by different amino acids of the aspartate kinase and the homoserine kinase of the yeast Saccharomyces cerevisiae.
    statement: >-
      Of the amino acids tested, only threonine effectively inhibits both yeast
      aspartate kinase and homoserine kinase.
  - source_id: PMID:2570346
    title: Structure of the HOM2 gene of Saccharomyces cerevisiae and regulation of its expression.
    statement: HOM2 encodes S. cerevisiae aspartate-semialdehyde dehydrogenase.
    supporting_text: >-
      In Saccharomyces cerevisiae the HOM2 gene encodes aspartic semi-aldehyde
      dehydrogenase (ASA DH).
  - source_id: PMID:11341914
    title: >-
      Characterization of yeast homoserine dehydrogenase, an antifungal target:
      the invariant histidine 309 is important for enzyme integrity.
    statement: >-
      Purified recombinant S. cerevisiae homoserine dehydrogenase (Hom6)
      reduces aspartate semialdehyde to homoserine with NADH or NADPH.
    supporting_text: >-
      HSD efficiently reduces aspartate semialdehyde to homoserine (Hse) using
      either NADH or NADPH
  - source_id: PMID:14583263
    title: >-
      Simultaneous in vitro assay of the first four enzymes in the fungal
      aspartate pathway identifies a new class of aspartate kinase inhibitor.
    statement: >-
      The fungal aspartate pathway enzymes (aspartate kinase, ASADH,
      homoserine dehydrogenase, homoserine kinase) were reconstituted and
      assayed together in vitro.
  - source_id: PMID:2176637
    title: Saccharomyces cerevisiae homoserine kinase is homologous to prokaryotic homoserine kinases.
    statement: >-
      THR1 encodes yeast homoserine kinase; disruption causes threonine
      auxotrophy and the protein is homologous to bacterial ThrB.
    supporting_text: >-
      Disruption of the THR1 gene results in threonine auxotrophy in yeast.
  - source_id: PMID:8082795
    title: Biochemical evidence that the Saccharomyces cerevisiae THR4 gene encodes threonine synthetase.
    statement: >-
      Threonine synthase activity, measured as threonine formed from
      O-phosphohomoserine, depends on a functional THR4 gene.
  - source_id: PMID:8204822
    title: Molecular analysis of the aspartate kinase-homoserine dehydrogenase gene from Arabidopsis thaliana.
    statement: >-
      The Arabidopsis bifunctional AK-HSDH is homologous to the E. coli thrA and
      metL bifunctional enzymes and carries a chloroplast-targeting sequence.
    supporting_text: >-
      The A. thaliana ak-hsdh gene is proposed to be the plant thrA homologue
      coding for the AK isozyme feedback inhibited by threonine.
  - source_id: PMID:12602885
    title: >-
      Transcriptional and biochemical regulation of a novel Arabidopsis thaliana
      bifunctional aspartate kinase-homoserine dehydrogenase gene isolated by
      functional complementation of a yeast hom6 mutant.
    statement: >-
      A second Arabidopsis AK-HSDH complements both yeast hom6 and hom3
      mutants, showing that one fusion protein replaces the two monofunctional
      fungal enzymes.
  - source_id: PMID:9748328
    title: Allosteric activation of Arabidopsis threonine synthase by S-adenosylmethionine.
    statement: >-
      Plant threonine synthase, unlike its bacterial counterpart, is strongly
      activated by S-adenosylmethionine.
    supporting_text: >-
      Plant threonine synthase, in contrast to its bacterial counterpart, is
      strongly stimulated by S-adenosylmethionine via a noncovalent interaction
  - source_id: PMID:9636232
    title: The specific features of methionine biosynthesis and metabolism in plants.
    statement: >-
      In plant chloroplasts O-phosphohomoserine is the branch point between
      threonine synthase and cystathionine gamma-synthase.
    supporting_text: >-
      OPH is therefore a branch point intermediate for methionine and threonine
      syntheses in plants
  - source_id: PMID:10220164
    title: ThrH, a homoserine kinase isozyme with in vivo phosphoserine phosphatase activity in Pseudomonas aeruginosa.
    statement: >-
      In P. aeruginosa threonine auxotrophy requires loss of both thrB and the
      unrelated SerB-like thrH gene, showing a non-orthologous replacement for
      the homoserine kinase step in some bacteria.
    supporting_text: >-
      In P. aeruginosa, threonine auxotrophy is observed only when both thrB
      and thrH are simultaneously inactivated.
  - source_id: PMID:1789001
    title: Four major transcriptional responses in the methionine/threonine biosynthetic pathway of Saccharomyces cerevisiae.
    statement: >-
      HOM3, HOM2 and THR1 are under general amino acid control; cited by
      YeastPathways for HOMOSERSYN-PWY.
