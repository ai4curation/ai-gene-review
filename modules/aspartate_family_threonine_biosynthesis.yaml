      presence. The Methanocaldococcus jannaschii panel establishes aspartate kinase and homoserine kinase
      individually; it is deliberately insufficient for a complete archaeal-route satisfiability claim.
      Compartments are implementation-specific: the represented yeast biosynthetic activities are cytosolic
      and the plant activities are plastid stromal.'
