id: MODULE:bacterial_periplasmic_phosphate_scavenging
title: PhoA periplasmic phosphate scavenging
description: >-
  A phosphate-starvation module centered on E. coli alkaline phosphatase PhoA,
  a periplasmic homodimeric zinc/magnesium metalloenzyme that hydrolyzes
  organic phosphate monoesters to liberate inorganic phosphate for uptake.
  PhoA export through the Sec pathway and PhoB/PhoR transcriptional induction
  are adjacent processes outside this single-enzyme scavenging reaction.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0004035
    title: alkaline phosphatase activity
    statement: Defines PhoA's phosphate-monoester hydrolase activity.
  - source_id: GO:0016036
    title: cellular response to phosphate starvation
    statement: Defines the phosphate-starvation process in which periplasmic PhoA acts.
  - source_id: file:genes/ECOLI/phoA/phoA-ai-review.yaml
    title: ECOLI phoA gene review
    statement: >-
      The completed E. coli phoA review grounds PhoA as the periplasmic
      alkaline phosphatase used for phosphate scavenging.
  - source_id: PMID:13826559
    title: >-
      A fine-structure genetic and chemical study of the enzyme alkaline
      phosphatase of E. coli. I. Purification and characterization of alkaline
      phosphatase.
    statement: Establishes the foundational purification and characterization of E. coli PhoA.
  - source_id: PMID:14487220
    title: "Alkaline phosphatase of Escherichia coli: a zinc metalloenzyme."
    statement: Establishes PhoA as a zinc metalloenzyme.
notes: >-
  PhoA also oxidizes phosphite slowly in vitro, but phosphate monoester
  hydrolysis is its physiological phosphate-scavenging activity.
