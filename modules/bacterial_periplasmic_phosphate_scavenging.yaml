id: MODULE:bacterial_periplasmic_phosphate_scavenging
title: E. coli periplasmic organophosphate scavenging
description: >-
  A phosphate-starvation effector module in which E. coli periplasmic
  phosphatases liberate inorganic phosphate from extracellular-facing
  organophosphate substrates. PhoA hydrolyzes phosphate monoesters through its
  alkaline phosphatase activity, while AppA contributes a phytase/acid
  phosphatase branch under phosphate limitation. Sec export, PhoB/PhoR
  transcriptional induction, and Pst phosphate import are adjacent processes
  outside this mature periplasmic scavenging boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0016311
    title: dephosphorylation
    statement: Defines phosphate-group removal as the shared process represented by both hydrolase branches.
  - source_id: file:genes/ECOLI/phoA/phoA-ai-review.yaml
    title: ECOLI phoA gene review
    statement: >-
      The completed E. coli phoA review grounds PhoA as the periplasmic
      alkaline phosphatase used for phosphate scavenging.
  - source_id: file:genes/ECOLI/appA/appA-ai-review.yaml
    title: ECOLI appA gene review
    statement: >-
      The completed E. coli appA review grounds AppA as the periplasmic
      histidine acid phosphatase/phytase used for phosphate scavenging, with
      GTPase and nucleotidase rows marked over-annotated and generic
      sugar-phosphatase activity retained as a non-core biochemical capability.
  - source_id: PMID:8387749
    title: Purification and characterization of two phytases from Escherichia coli.
    statement: >-
      Purifies E. coli periplasmic phytases and identifies the P2 phytase with
      the pH 2.5 acid phosphatase described by Dassa and colleagues.
  - source_id: PMID:11035187
    title: >-
      Stereospecificity of myo-inositol hexakisphosphate dephosphorylation by a
      phytate-degrading enzyme of Escherichia coli.
    statement: >-
      Shows that the E. coli P2 phytate-degrading enzyme dephosphorylates
      myo-inositol hexakisphosphate stepwise.
  - source_id: PMID:13826559
    title: >-
      A fine-structure genetic and chemical study of the enzyme alkaline
      phosphatase of E. coli. I. Purification and characterization of alkaline
      phosphatase.
    statement: Establishes the foundational purification and characterization of E. coli PhoA.
  - source_id: PMID:14487220
    title: "Alkaline phosphatase of Escherichia coli: a zinc metalloenzyme."
    statement: Establishes PhoA as a zinc metalloenzyme.
  - source_id: PMID:6282821
    title: >-
      The acid phosphatase with optimum pH of 2.5 of Escherichia coli.
      Physiological and Biochemical study.
    statement: >-
      Establishes AppA as an acid phosphatase and phosphoanhydride phosphatase
      whose synthesis is prematurely fully induced by inorganic phosphate
      starvation.
notes: >-
  PhoA also oxidizes phosphite slowly in vitro, but phosphate monoester
  hydrolysis is its physiological phosphate-scavenging activity. GO:0016036
  cellular response to phosphate starvation is a valid process term for the
  effector genes, but is not listed as a module concept because the term also
  covers PhoB/PhoR transcriptional regulation, which is outside this boundary.
