id: MODULE:protein_o_mannosyltransferase_complex
title: POMT1:POMT2 protein O-mannosyltransferase complex
description: >-
  The human POMT1:POMT2 complex is an endoplasmic-reticulum membrane glycosyltransferase
  module. POMT1 and POMT2 are both required during biogenesis of the active complex, which
  transfers mannose from dolichyl-phosphate mannose to serine and threonine residues on
  alpha-dystroglycan and a small set of additional nascent secretory-pathway proteins.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:14699049
  title: 'Demonstration of mammalian protein O-mannosyltransferase activity: coexpression of POMT1 and POMT2 required for enzymatic activity.'
  statement: >-
    Cotransfection of human POMT1 and POMT2 was required for microsomal Dol-P-Man-dependent
    transferase activity on an alpha-dystroglycan acceptor.
- source_id: PMID:16698797
  title: Physical and functional association of human protein O-mannosyltransferases 1 and 2.
  statement: >-
    Human POMT1 and POMT2 form a physical and functional complex with protein
    O-mannosyltransferase activity.
- source_id: GO:0031502
  title: dolichyl-phosphate-mannose-protein mannosyltransferase complex
  statement: GO term grounding the POMT1:POMT2 complex.
notes: >-
  Boundary. This module is intentionally limited to the two-subunit human POMT complex that
  catalyzes the initiating ER mannose transfer. Dol-P-Man synthesis and the Golgi
  alpha-dystroglycan elaboration enzymes are separate modules. The mouse production GO-CAM
  gomodel:6690711d00001433 covers the longer alpha-dystroglycan core pathway and contains a
  Pomt1/Pomt2 complex activity equivalent to this module.
