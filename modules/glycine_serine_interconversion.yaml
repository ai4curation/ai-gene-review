                    label: Mitochondrial serine hydroxymethyltransferase
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: glycine hydroxymethyltransferase activity
                        term:
                          id: GO:0004372
                          label: glycine hydroxymethyltransferase activity
                      family:
                        preferred_term: serine hydroxymethyltransferases
                        term:
                          id: PANTHER:PTHR11680
                          label: SERINE HYDROXYMETHYLTRANSFERASE
                        representative_members:
                          - preferred_term: SHM1 (Saccharomyces cerevisiae)
