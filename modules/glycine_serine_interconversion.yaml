id: MODULE:glycine_serine_interconversion
title: Glycine formation and glycine-serine interconversion
description: >-
  Routes that supply the cellular glycine pool and interconvert glycine with
  L-serine, as found in fungi, bacteria and animals. Glycine is formed by up
  to three enzymatically unrelated, pyridoxal 5'-phosphate-dependent
  reactions: aldol cleavage of L-threonine to glycine and acetaldehyde by
  threonine aldolase; transamination of glyoxylate with L-alanine by
  alanine:glyoxylate aminotransferase; and the reversible
  tetrahydrofolate-dependent serine hydroxymethyltransferase (SHMT) reaction,
  which converts L-serine and tetrahydrofolate to glycine and
  5,10-methylenetetrahydrofolate. Run in reverse, SHMT turns glycine made by
  the first two reactions into L-serine, giving a serine supply that does not
  depend on the phosphorylated pathway. Eukaryotes commonly have
  compartment-specific SHMT isozymes in the cytosol and in the mitochondrial
  matrix, and the direction of net flux through each depends on nutrient
  supply. In budding yeast, threonine aldolase is the main glycine source
  during growth on glucose, while the glucose-repressed glyoxylate
  transamination route supplies glycine and, through SHMT, serine on
  non-fermentable carbon sources. The relative weight of the routes differs
  between lineages; in mammals SHMT is the main source of glycine. The
  phosphorylated serine pathway, the glycine cleavage system, and downstream
  folate one-carbon reactions are separate modules.
status: DRAFT
evidence:
  - source_id: GO:0006545
    title: glycine biosynthetic process
    statement: Module-level process for glycine formation by the three routes.
  - source_id: YeastPathways:PWY3O-261
    title: superpathway of serine and glycine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The YeastCyc superpathway combines the phosphorylated serine pathway
      (modelled separately as phosphorylated_serine_biosynthesis) with SHMT
      (SHM1, SHM2), threonine aldolase (GLY1) and alanine:glyoxylate
      aminotransferase (AGX1). The three glycine reactions and their
      catalysts are all retained here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-261
  - source_id: YeastPathways:GLYSYN-PWY
    title: glycine biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: Single-reaction frame for SHMT (SHM1, SHM2); folded into the SHMT part.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYSYN-PWY
  - source_id: YeastPathways:GLYSYN-THR-PWY
    title: glycine biosynthesis IV (S. cerevisiae, SGD YeastPathways)
    statement: Single-reaction frame for threonine aldolase (GLY1); folded into the threonine aldolase variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYSYN-THR-PWY
  - source_id: YeastPathways:GLYSYN-ALA-PWY
    title: glycine biosynthesis III (S. cerevisiae, SGD YeastPathways)
    statement: Single-reaction frame for alanine:glyoxylate aminotransferase (AGX1); folded into the glyoxylate variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYSYN-ALA-PWY
  - source_id: YeastPathways:PWY3O-230
    title: serine biosynthesis from glyoxylate (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists only the SHMT reaction (SHM1, SHM2) for this frame,
      although its comment describes the AGX1 step that precedes it. Here it
      is represented by the glyoxylate variant followed by the SHMT part.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-230
  - source_id: PMID:8132653
    title: Cloning and molecular characterization of three genes, including two genes encoding serine hydroxymethyltransferases, whose inactivation is required to render yeast auxotrophic for glycine.
    statement: >-
      SHM1 encodes mitochondrial and SHM2 cytosolic SHMT; loss of SHM1, SHM2
      and GLY1 is needed for complete glycine auxotrophy.
    supporting_text: >-
      Gene disruption studies demonstrated that inactivation of SHM1, SHM2, and
      GLY1 is required to yield yeast that are completely auxotrophic for
      glycine.
  - source_id: PMID:9163906
    title: 'Identification of Saccharomyces cerevisiae GLY1 as a threonine aldolase: a key enzyme in glycine biosynthesis.'
    statement: >-
      GLY1 encodes threonine aldolase and is the main glycine source on
      glucose; on ethanol glycine is made via alanine:glyoxylate
      aminotransferase.
    supporting_text: >-
      On ethanol as carbon source simultaneous disruption of GLY1, SHM1 and
      SHM2 did not lead to glycine auxotrophy because glycine biosynthesis
      proceeds via alanine glyoxylate aminotransferase.
  - source_id: PMID:9151955
    title: The GLY1 gene of Saccharomyces cerevisiae encodes a low-specific L-threonine aldolase that catalyzes cleavage of L-allo-threonine and L-threonine to glycine--expression of the gene in Escherichia coli and purification and characterization of the enzyme.
    statement: Purified Gly1 is a PLP-dependent low-specificity L-threonine aldolase.
    supporting_text: >-
      The enzyme catalyzes the cleavage of not only L-allo-threonine to glycine
      but also L-threonine.
  - source_id: PMID:14745783
    title: 'Alanine : glyoxylate aminotransferase of Saccharomyces cerevisiae-encoding gene AGX1 and metabolic significance.'
    statement: >-
      AGX1 (YFL030W) encodes alanine:glyoxylate aminotransferase; its loss in a
      gly1 shm1 shm2 background gives complete glycine auxotrophy.
    supporting_text: Additional disruption of AGX1 revealed a complete glycine auxotrophy.
  - source_id: PMID:16226833
    title: Crystal structure and confirmation of the alanine:glyoxylate aminotransferase activity of the YFL030w yeast protein.
    statement: Structure and activity confirm Agx1 as a highly specific PLP-dependent alanine:glyoxylate aminotransferase.
    supporting_text: >-
      In this paper we show that YFL030w codes for an alanine:glyoxylate
      aminotransferase, highly specific for its amino donor and acceptor
      substrates.
  - source_id: PMID:3933486
    title: Characteristics of alanine:glyoxylate aminotransferase from Saccharomyces cerevisiae, a regulatory enzyme in the glyoxylate pathway of glycine and serine biosynthesis from tricarboxylic acid-cycle intermediates.
    statement: The yeast enzyme is strongly induced on ethanol or acetate relative to glucose.
    supporting_text: >-
      The transamination of glyoxylate is mainly catalysed by this enzyme in
      ethanol-grown cells.
  - source_id: PMID:9398220
    title: Role of mitochondrial and cytoplasmic serine hydroxymethyltransferase isozymes in de novo purine synthesis in Saccharomyces cerevisiae.
    statement: >-
      The two SHMT isozymes run in different directions depending on
      nutrition: cytosolic SHMT makes glycine from serine, mitochondrial SHMT
      makes serine from glycine.
    supporting_text: >-
      When grown on glycine, the mitochondrial SHMT was the predominant
      isozyme catalyzing the synthesis of serine from glycine and one-carbon
      units.
  - source_id: PMID:1326413
    title: Genetic analysis of serine biosynthesis and glucose repression in yeast.
    statement: >-
      Yeast makes serine and glycine by a glycolytic (3-phosphoglycerate)
      route and a glucose-repressible gluconeogenic (glyoxylate) route.
    supporting_text: >-
      Serine and glycine biosynthesis in yeast proceed by two pathways: a
      "glycolytic" pathway, using 3-phosphoglycerate, and a "gluconeogenic"
      pathway, using glyoxylate.
  - source_id: PMID:15948949
    title: Transcriptional regulation of the one-carbon metabolism regulon in Saccharomyces cerevisiae by Bas1p.
    statement: >-
      Cited by YeastPathways for glycine-responsive, Bas1-dependent regulation
      of SHM2 and other one-carbon genes; regulatory context only.
  - source_id: file:yeast/GLY1/GLY1-ai-review.yaml
    title: GLY1 gene review (S. cerevisiae)
    statement: Core function GO:0004793 in glycine biosynthesis, cytosol.
  - source_id: file:yeast/AGX1/AGX1-ai-review.yaml
    title: AGX1 gene review (S. cerevisiae)
    statement: Core function GO:0008453 in glycine biosynthesis; compartment unresolved.
  - source_id: file:yeast/SHM2/SHM2-ai-review.yaml
    title: SHM2 gene review (S. cerevisiae)
    statement: Core function GO:0004372 in glycine biosynthesis and tetrahydrofolate interconversion, cytosol.
  - source_id: file:yeast/SHM1/SHM1-ai-review.yaml
    title: SHM1 gene review (S. cerevisiae)
    statement: Core function GO:0004372 in tetrahydrofolate interconversion, mitochondrion.
module:
  id: glycine_serine_interconversion
  label: Glycine formation and glycine-serine interconversion
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glycine biosynthetic process
      term:
        id: GO:0006545
        label: glycine biosynthetic process
      description: >-
        Formation of glycine from L-threonine, glyoxylate or L-serine; the
        reversible SHMT step also links the glycine and serine pools.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-261
      title: 'superpathway of serine and glycine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion with eight activities (SER3, SER33, SER1,
        SER2, SHM1, SHM2, GLY1, AGX1), all in cytosol and part of the broad
        GO:0009070, with no causal edges. The four SER activities belong to
        phosphorylated_serine_biosynthesis. SHM1 is placed in cytosol,
        although it is the mitochondrial isozyme.
  parts:
    - order: 1
      role: glycine formation from L-threonine or glyoxylate
      optional: true
      node:
        id: glycine_formation_routes
        label: Serine-independent glycine formation
        module_type: METABOLIC_PATHWAY
        description: >-
          Alternative glycine-forming reactions that do not consume serine.
          Their presence and importance differ between lineages and growth
          conditions; the part is optional because some organisms make
          glycine mainly by SHMT.
