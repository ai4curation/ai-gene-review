                              SHMT activity and main glycine provider on serine
                              (PMID:9398220).
                          - preferred_term: SHMT1 (human)
                            term:
                              id: UniProtKB:P34896
                              label: Serine hydroxymethyltransferase, cytosolic
                          - preferred_term: glyA (Escherichia coli)
                            term:
                              id: UniProtKB:P0A825
                              label: Serine hydroxymethyltransferase
                            description: Single bacterial cytoplasmic SHMT.
                    function:
