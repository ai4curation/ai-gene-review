        label: Serine hydroxymethyltransferase
        module_type: REACTION
        description: >-
          L-serine + tetrahydrofolate <=> glycine + 5,10-methylene-THF + H2O.
          In the forward direction SHMT is a glycine source; in reverse it
          makes serine from glycine formed in part 1. Eukaryotes often have
          separate cytosolic and mitochondrial isozymes; bacteria have one
          cytoplasmic GlyA.
