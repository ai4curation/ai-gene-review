  connections:
    - source: glycine_formation_routes
      target: shmt_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        Glycine made by threonine aldolase or alanine:glyoxylate
        aminotransferase is the substrate of SHMT in the serine-forming
        direction (the glyoxylate route to serine). In the opposite direction
        SHMT works in parallel with these routes as a glycine source.
  notes: >-
    NEW module from five YeastPathways frames (PWY3O-261, GLYSYN-PWY,
    GLYSYN-THR-PWY, GLYSYN-ALA-PWY, PWY3O-230), each of which is a single
    reaction or a combination of the same reactions. They are alternative
    routes into one glycine/serine pool, so they are modelled as an optional
    variant set of serine-independent glycine routes (threonine aldolase,
    glyoxylate transamination) followed by the reversible SHMT step with
    cytosolic and mitochondrial isozyme variants. The phosphorylated serine
    pathway reactions of PWY3O-261 are in phosphorylated_serine_biosynthesis,
    which supplies serine to the SHMT step; the glycine cleavage system
    (glycine_cleavage_system) and the downstream folate one-carbon network
    (folate_one_carbon_interconversion) are separate. The human-specific
    serine_biosynthesis_one_carbon module overlaps the SHMT part. YeastCyc
    corrections: all four catalysts are correct and none is missing. PWY3O-230
    lists only SHMT although its own comment names AGX1 as the first step; this
    module includes it. YeastCyc and its GO-CAM give no compartments; SHM1 is
    mitochondrial (PMID:8132653), SHM2 and GLY1 are cytosolic, and the AGX1
    compartment is unresolved. GO-CAM disagreements: YeastPathways_PWY3O-261
    places SHM1 in cytosol, uses only the broad process GO:0009070 rather than
    GO:0006545 or GO:0006564, and has no causal edges. No PomBase GO-CAM is
    linked, so S. pombe exemplars are not added. No glycine-specific
    regulation (Bas1/Gcn4, glycine induction) is modelled as a part.
