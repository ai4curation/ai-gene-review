    FMN reductases'
  findings:
  - statement: Table 1 measures E. coli wild-type SsuE kcat of 3.0 ± 0.1 s−1 with NADH and 3.7 ± 0.4 s−1
      with NADPH; catalytic efficiencies are 5.2 ± 0.5 and 5 ± 2 ×10^4 M−1 s−1. Similar rates support
      the NAD(P)H activity on this target.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete primary text and Table 1 inspected; this normal URL cache is the provenance
      for the quantitative donor comparison, not the abstract-only PMID cache.
- id: file:publications/url_https___backend.orbit.dtu.dk_ws_files_406857921_PhD_Thesis_-_Garret_William_O_Connell.pdf.md
  title: https://backend.orbit.dtu.dk/ws/files/406857921/PhD_Thesis_-_Garret_William_O_Connell.pdf
  findings:
  - statement: The 2024 O’Connell thesis supplies native KT2440 ΔssuD and joint ΔssuBC sulfur-utilization
      genetics, corroborating the locus without proving isolated B/C transport or individual A/E necessity.
    supporting_text: Due to the genetic placement of the ssuACB enzymes (Fig S5.), only ssuCB (permease
      and cytoplasmic ATPase) were disrupted.
  - statement: Native KT2440 ssuD deletion impairs growth on the listed tested sulfonates.
    supporting_text: Notably, when ssuD was disrupted, growth on ethanesulfonate, bromoethanesulfonate,
      chloroethanesulfonate, trimethylsilipropanesulfonate, 3 -(1-pyridino)-1-propanesulfonate, HEPES,
      MOPS and 3 -chloro-2-hydroxy-1- propanesulfonate was negatively affected
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normally recovered complete thesis, chapter 1 Methods/Results and Fig. 4 inspected;
      Fig. S10 maps PP_0236–PP_0240. Chapter manuscript was in preparation in 2024, so this is primary
      thesis evidence, not a verified peer-reviewed paper. Growth is physiological corroboration, not
      purified enzyme kinetics or direct uptake flux.
- id: PMID:21880344
  title: Mechanism for sulfur acquisition by the alkanesulfonate monooxygenase system.
  findings:
  - statement: The focused mechanistic review places C–S cleavage and reduced-flavin supply at this module
      boundary, with a C4a-(hydro)peroxyflavin oxygenating intermediate.
    supporting_text: A C4a-(hydro)peroxyflavin is the oxygenating intermediate in the mechanism of desulfonation
      by the alkanesulfonate monooxygenase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review abstract inspected. Mechanistic synthesis corroborates direct enzyme studies;
      it does not establish all homologues or native donor identities. Full text unavailable after normal
      attempts.
- id: PMID:10717312
  title: Riding the sulfur cycle--metabolism of sulfonates and sulfate esters in gram-negative bacteria.
  findings:
  - statement: Sulfonate sulfur scavenging need not imply use of the carbon skeleton, and taurine dioxygenase
      and FMNH2-dependent oxygenases are distinct implementations.
    supporting_text: Many microorganisms can use sulfonates and sulfate esters as a source of sulfur for
      growth, even when they are unable to metabolize the carbon skeleton of the compounds.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review abstract inspected; full publisher recovery returned 403. Supports ecological
      boundary and distinct chemistries, not universal transporter composition.
- id: PMID:40987416
  title: 'Microbial transport systems of organic sulfur compounds: Diversity and implications for biocatalysis,
    healthcare, and environmental biotechnology.'
  findings:
  - statement: The recent transport review identifies uptake/efflux characterization as less complete
      than degradation pathways; this motivates separate substrate-spectrum and uptake gaps.
    supporting_text: While degradation pathways of some organic sulfur compounds have been elucidated,
      transport systems involved in their uptake and efflux remain less explored.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 2026 review abstract inspected; publisher full text unavailable. General comparative
      context only, not primary evidence for any exact SsuABC pair.
- id: PMID:41412539
  title: 'Flavin reductases in two-component systems: Mechanistic insights, structural classification,
    and biotechnological advances.'
  findings:
  - statement: The recent reductase review discusses alternative reduced-flavin supply strategies, which
      must be distinguished from demonstrated native substitute enzymes.
    supporting_text: In addition, we explore alternative strategies for supplying reduced flavin to monooxygenase
      partners, including non-enzymatic regeneration methods and the use of nicotinamide analogs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 2026 review abstract inspected. Engineering alternatives do not identify the physiological
      S-313 substitute or establish universal protein interaction requirements.
notes: 'Exact gene-product selectors prevent broad-family substrate transfer and mixed-species SsuABC
  assemblies. Family labels are verified classifications of those proteins. SsuE supplies the required
  reduced-flavin chemistry in each named canonical implementation but is not asserted universally essential:
  experimentally active S-313 without SsuE is explicitly reconciled as an unresolved biological alternative.
  No direct-channeling exclusivity, universal donor equivalence, fixed complex stoichiometry or minimal-genotype
  sufficiency is encoded. Manual source research followed actual provider failures; existing provider
  reports were discovery aids only.'
