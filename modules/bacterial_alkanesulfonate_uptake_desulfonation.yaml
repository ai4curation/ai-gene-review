id: MODULE:bacterial_alkanesulfonate_uptake_desulfonation
title: Bacterial alkanesulfonate uptake and FMN-dependent desulfonation
description: >-
  A reusable bacterial sulfur-scavenging module in which the SsuABC ABC
  transporter imports aliphatic sulfonates, SsuE reduces FMN using NADPH, and
  SsuD uses reduced FMN and oxygen to release sulfite from an alkanesulfonate.
  Sulfite assimilation, substrate-specific transport paralogs, and regulatory
  responses to sulfur limitation are outside the module boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:10781557
    title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313
    statement: >-
      Pseudomonas genetics identifies an SsuABC transporter and SsuED
      reduced-flavin monooxygenase in one organosulfur-utilization locus.
    supporting_text: >-
      an ATP-binding cassette-type transporter (ssuABC), a two-component reduced
      flavin mononucleotide-dependent monooxygenase (ssuED)
  - source_id: PMID:10480865
    title: Characterization of a two-component alkanesulfonate monooxygenase from Escherichia coli
    statement: >-
      Purified SsuE supplies FMNH2 to SsuD, which oxygenolyzes a broad range of
      alkanesulfonates to sulfite and corresponding aldehydes.
    supporting_text: >-
      SsuE is the FMN reducing enzyme providing SsuD with FMNH(2).
  - source_id: PMID:10781534
    title: Deletion analysis of the Escherichia coli taurine and alkanesulfonate transport systems
    statement: >-
      Deletion and complementation distinguish the SsuABC alkanesulfonate
      importer from the parallel TauABC taurine importer.
    supporting_text: >-
      the individual components of the two transport systems were not
      functionally exchangeable
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__taurine_uptake_and_desulfonation__ppu00430-deep-research-openscientist.md
    title: OpenScientist PSEPK taurine-pathway satisfiability review
    statement: >-
      The species-aware neighboring-pathway review identifies the KT2440
      ssuEADCB locus as a parallel alkanesulfonate system and keeps it separate
      from TauABC/TauD taurine uptake and desulfonation.
  - source_id: file:modules/bacterial_alkanesulfonate_uptake_desulfonation-deep-research-openscientist.md
    title: OpenScientist research for bacterial alkanesulfonate uptake and desulfonation
    statement: >-
      The generic review supports the transport-plus-reduced-flavin
      desulfonation boundary and separation from TauD and downstream sulfite
      assimilation. Its universal-SsuE and direct-channeling language was not
      promoted beyond what the primary evidence establishes.
  - source_id: UniProtKB:Q88R96
    title: Pseudomonas putida KT2440 SsuA
    statement: Q88R96 is the exact periplasmic aliphatic-sulfonate-binding exemplar.
  - source_id: UniProtKB:Q88R93
    title: Pseudomonas putida KT2440 SsuB
    statement: Q88R93 is the exact ATPase exemplar for the SsuABC importer.
  - source_id: UniProtKB:Q88R94
    title: Pseudomonas putida KT2440 SsuC
    statement: Q88R94 is the exact membrane permease exemplar for the SsuABC importer.
  - source_id: UniProtKB:Q88R97
    title: Pseudomonas putida KT2440 SsuE
    statement: Q88R97 is the exact NADPH-dependent FMN-reductase exemplar.
  - source_id: UniProtKB:Q88R95
    title: Pseudomonas putida KT2440 SsuD
    statement: Q88R95 is the exact alkanesulfonate-monooxygenase exemplar.
  - source_id: UniProtKB:P75853
    title: Escherichia coli K-12 SsuA
    statement: P75853 is a reviewed SsuA-family binding-protein exemplar.
  - source_id: UniProtKB:P0AAI1
    title: Escherichia coli K-12 SsuB
    statement: P0AAI1 is a reviewed SsuB ATPase exemplar.
  - source_id: UniProtKB:P75851
    title: Escherichia coli K-12 SsuC
    statement: P75851 is a reviewed SsuC permease exemplar.
  - source_id: UniProtKB:P80644
    title: Escherichia coli K-12 SsuE
    statement: P80644 is a biochemically characterized SsuE reductase exemplar.
  - source_id: UniProtKB:P80645
    title: Escherichia coli K-12 SsuD
    statement: P80645 is a biochemically characterized SsuD oxygenase exemplar.
notes: >-
  The broad substrate-binding and permease PANTHER families contain transporters
  with other substrates, so the SsuABC complex is constrained by the exact
  alkanesulfonate transporter function and grounded by verified Pseudomonas and
  E. coli exemplars. SsuE is the canonical reduced-FMN supplier but is optional
  at this reusable boundary because Pseudomonas S-313 genetics demonstrates
  alternative reductase coverage for aliphatic sulfonate growth.
