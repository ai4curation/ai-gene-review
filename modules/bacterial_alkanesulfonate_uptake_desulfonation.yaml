  knowledge_gaps:
  - gap_statement: S-313 remains able to grow on tested aliphatic sulfonates without SsuE, but the physiological
      reduced-FMN supplier or alternative reaction route has not been identified.
    boundary: The canonical named-component route requires its SsuE atom. Independently established activity
      without that atom is an ABDUCTION_TARGET for an unidentified reduced-FMN supplier or alternative
      route, not a prediction that the organism is inactive.
    gap_kind:
    - BIOLOGY
    status: OPEN
    resolution: Identify and perturb the alternative supplier and measure reduced-flavin-dependent sulfur
      flux in the S-313 ssuE-deficient background.
    provenance:
    - reference_id: PMID:10781557
      supporting_text: The flavin reductase SsuE was not required for growth with aliphatic sulfonates
        or methionine but was needed for growth with arylsulfonates
  - gap_statement: Alternative sulfonate uptake and the biochemical function of SsuF remain unresolved
      at this boundary.
    boundary: S-313 SsuA deletion nonauxotrophy and SsuF rescue of an ssuB insertion preclude treating
      the named five components as a proven minimal sufficient growth genotype. SsuF is outside the identified
      reaction chain because its biochemical contribution is unknown.
    gap_kind:
    - BIOLOGY
    status: OPEN
    provenance:
    - reference_id: PMID:10781557
      supporting_text: Deletion of ssuA had no effect on growth with any sulfur source tested
    - reference_id: PMID:10781557
      supporting_text: Strain PW7 also regained the ability to utilize sulfonates as the sulfur source
        when provided with the ssuF gene
  - gap_statement: The substrate spectra and physiological donor preferences of individual unassayed homologues,
      including KT2440 SsuE, are incompletely resolved.
    boundary: Family descriptors classify the exact exemplars; they do not grant every family member all
      measured E. coli or S-313 substrate activities.
    gap_kind:
    - BIOLOGY
    status: OPEN
