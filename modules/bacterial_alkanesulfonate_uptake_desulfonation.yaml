id: MODULE:bacterial_alkanesulfonate_uptake_desulfonation
title: Bacterial alkanesulfonate uptake and FMN-dependent desulfonation
description: SsuABC-mediated alkanesulfonate uptake can supply an aerobic two-component desulfonation
  system in which a flavin reductase provides reduced FMN and SsuD cleaves the carbon–sulfur bond to release
  sulfite and an aldehyde. The sampled native implementations are E. coli K-12 and Pseudomonas putida
  KT2440 and S-313. Their transporter alternatives, substrate ranges and reductase requirements differ.
  Sulfite assimilation, TauD chemistry, regulatory induction and aromatic-sulfonate accessory pathways
  lie outside this boundary.
status: COMPLETE
scope: CONCRETE
module:
  id: bacterial_alkanesulfonate_uptake_desulfonation
  label: Canonical Ssu uptake plus reduced-flavin desulfonation implementations
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: alkanesulfonate catabolic process
    term:
      id: GO:0046306
      label: alkanesulfonate catabolic process
  context:
    taxa:
    - preferred_term: Gammaproteobacteria
      term:
        id: NCBITaxon:1236
        label: Gammaproteobacteria
    conditions:
    - preferred_term: Oxygen, reducing equivalents and an accepted alkanesulfonate are available; the
        selected proteins are expressed and functional
  description: At least one complete species-coherent canonical implementation is required. This is coverage
    of named transport and catalytic capabilities, not an essentiality model or a claim that five proteins
    alone reconstitute sulfur-dependent growth. The taxon envelope bounds sampled implementations and
    does not claim universal presence in Gammaproteobacteria.
