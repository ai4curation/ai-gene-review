  notes: >-
    Exact bacterial and human UniProt exemplars delimit both reaction roles across prokaryotic GshA/GshB and eukaryotic GCLC/GSS families. The narrow subfamilies are used instead of parent families that include ligases with other substrates. The same reviewed GshAB/GshF exemplar appears under both leaf activities because a single bifunctional polypeptide can implement both ordered reactions; it does not collapse the pathway into one biological step. PANTHER classifies the whole GshAB/GshF fusion as PTHR38761:SF1 through its first activity, but that family is deliberately not asserted as a selector for the second leaf because 104 of its 119 members are monofunctional GshA (the PTHR38761 family review leaves GO:0004363 UNRESOLVED for that reason). The second leaf therefore has two annotons: the GshB/GSS families, and a separate GshAB/GshF annoton selected by IPR040657 and supported by PMID:16339152. Mammalian GCLM can modify GCLC kinetics but is not a third catalytic reaction and is therefore not a required module part. Type 2/YbdK-family ligases are candidate alternatives outside the required chain unless organism-specific physiological evidence establishes that they implement the first reaction. PSEPK PP_3253/Q88HV0 maps to PANTHER PTHR36510:SF1. Reviewed E. coli YbdK/P77213, independently verified in the same subfamily, is the source of the weak in-vitro family-level activity; it does not establish a glutathione-biosynthesis role for Q88HV0. No molecular function or location is duplicated at module level. Four PAINT IBD nodes are asserted, each verified in its family review: PTN002215154 (PTHR38761, seeded by E. coli GshA) and PTN000126115 (PTHR11164, as in maintainer PR #5076) for the first step, and PTN000492686 (PTHR21621, seeded by E. coli GshB) and PTN000122964 (PTHR11130) for the second. The module is species-neutral (ABSTRACT): the same two reactions are implemented by unrelated bacterial and eukaryotic enzyme families, with E. coli, P. putida KT2440, P. multocida, human and yeast exemplars that carry experimental or curated evidence. ALIGN (YeastPathways project, 2026-10): S. cerevisiae GSH1/GSH2 and S. pombe gcs1/gsa1 were added as eukaryotic exemplars; each falls in the same PANTHER subfamily as human GCLC (PTHR11164:SF0) or GSS (PTHR11130:SF0). S. pombe also has a GCLM-like modifier (gcs2, O94246, PTHR13295) that the PomBase model links as a positive regulator of gcs1; S. cerevisiae has no GCLM ortholog, so the modifier remains outside the required chain. Both yeast GO-CAMs agree with the two-step order and cytosolic location.
  gocam_associations:
    - model: gomodel:YeastPathways_GLUTATHIONESYN-PWY
      title: 'glutathione biosynthesis - imported from: Saccharomyces Genome Database'
      description: SGD conversion with GSH1 (GO:0004357) and GSH2 (GO:0004363) in cytosol, part of GO:0006750. Agrees with this module.
    - model: gomodel:68b0f0d000008341
