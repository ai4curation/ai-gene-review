  connections:
    - source: glutamate_cysteine_ligase_step
      target: glutathione_synthetase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        GshA/GCLC supplies gamma-L-glutamyl-L-cysteine to GshB/GSS.
  notes: >-
    Exact bacterial and human UniProt exemplars delimit both reaction roles
    across prokaryotic GshA/GshB and eukaryotic GCLC/GSS families. The narrow
    subfamilies are used instead of parent families that include ligases with
    other substrates. The same reviewed GshAB/GshF exemplar appears under both
    leaf activities because a single bifunctional polypeptide can implement
    both ordered reactions; it does not collapse the pathway into one
    biological step. PANTHER classifies the whole GshAB/GshF fusion as
    PTHR38761:SF1 through its first activity, but that family is deliberately
    not asserted as a selector for the second leaf because it also contains
    monofunctional GshA proteins. IPR040657 and direct biochemical evidence
    establish the C-terminal glutathione-synthetase role. Mammalian GCLM can
    modify GCLC kinetics but is not a third
    catalytic reaction and is therefore not a required module part. Type
    2/YbdK-family ligases are candidate alternatives outside the required chain
    unless organism-specific physiological evidence establishes that they
    implement the first reaction. PSEPK PP_3253/Q88HV0 maps to PANTHER
    PTHR36510:SF1. Reviewed E. coli YbdK/P77213, independently verified in the
    same subfamily, is the source of the weak in-vitro family-level activity;
    it does not establish a glutathione-biosynthesis role for Q88HV0. No
    molecular function or location is duplicated at
    module level, and no ancestral PTN node is asserted without verified PAINT
    IBD evidence.
