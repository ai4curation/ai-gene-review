                    label: GLUTATHIONE SYNTHETASE
                  - id: PANTHER:PTHR11130:SF0
                    label: GLUTATHIONE SYNTHETASE
                  - id: InterPro:IPR040657
                    label: GshAB, ATP-grasp-like domain
                representative_members:
