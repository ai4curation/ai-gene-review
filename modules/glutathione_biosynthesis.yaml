  notes: >-
    Exact PSEPK UniProt accessions instantiate the pathway in KT2440, while the
    reviewed E. coli K-12 GshA and GshB proteins provide independently curated
    exemplars and do not restrict the module taxonomically. PTHR38761:SF1 and
    PTHR21621:SF4 are used instead of the broader parent families because the
    latter include mechanistically related proteins with other substrates.
    PSEPK Q88HV0 (PTHR36510:SF1) is tracked separately as a type 2/YbdK-family
    protein whose record states only weak glutamate--cysteine ligase activity;
    it is not treated as an additional pathway step or as the primary KT2440
    step-1 enzyme without physiological evidence. No molecular function or
    cytosolic location is duplicated at module level. The PTN identifiers
    attached to the PSEPK GOA records occur in combined electronic or
    TreeGrafter annotations, so no PAINT ancestral node is asserted without
    locally verified IBD evidence.
