                      label: Glutathione biosynthesis bifunctional protein GshAB
                    description: >-
                      Reviewed bifunctional exemplar whose C-terminal
                      ATP-grasp domain implements this step. PANTHER assigns
                      the whole fusion to PTHR38761:SF1 through its N-terminal
                      glutamate--cysteine ligase region; the second activity is
