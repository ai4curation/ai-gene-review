      description: PomBase S. pombe glutathione metabolism model; gcs1, the GCLM-like regulatory subunit gcs2 and gsa1 implement this module, the remaining activities (ggt1/ggt2, ggg1, oxp1/oxp2, dug1/dug2, pgr1, mtm1, pcs2, cbl1) are in glutathione_synthesis_gamma_glutamyl_cycle or outside.
