      connection_type: PROVIDES_INPUT_FOR
      description: >-
        GshA/GCLC supplies gamma-L-glutamyl-L-cysteine to GshB/GSS.
  notes: >-
    Exact UniProt exemplars delimit both reaction roles without restricting the
    module taxonomically. PTHR38761:SF1 and PTHR21621:SF4 are used instead of
    broader parent families that include mechanistically related proteins with
    other substrates. The same reviewed GshAB/GshF exemplar appears under both
    leaf activities because a single bifunctional polypeptide can implement both
    ordered reactions; it does not collapse the pathway into one biological
    step. Type 2/YbdK-family ligases are not an additional required step unless
    organism-specific physiological evidence establishes that they implement
    the first reaction. No molecular function or location is duplicated at
    module level, and no ancestral PTN node is asserted without verified PAINT
    IBD evidence.
