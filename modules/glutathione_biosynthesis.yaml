id: MODULE:glutathione_biosynthesis
title: Glutathione biosynthesis
description: >-
  A reusable two-reaction pathway that converts L-glutamate, L-cysteine, and
  glycine to glutathione through gamma-L-glutamyl-L-cysteine. The module
  represents the conserved GshA/GCLC and GshB/GSS reaction roles independently
  of genomic arrangement or enzyme regulation. Glutathione reduction,
  conjugation, peroxide detoxification, degradation, and the wider
  gamma-glutamyl cycle are outside the boundary.
status: DRAFT
evidence:
  - source_id: GO:0006750
    title: glutathione biosynthetic process
    statement: GO:0006750 provides the biological-process context.
  - source_id: RHEA:13285
    title: glutamate--cysteine ligase reaction
    statement: >-
      RHEA:13285 defines ATP-dependent formation of
      gamma-L-glutamyl-L-cysteine from L-glutamate and L-cysteine.
  - source_id: RHEA:13557
    title: glutathione synthetase reaction
    statement: >-
      RHEA:13557 defines ATP-dependent addition of glycine to
      gamma-L-glutamyl-L-cysteine to form glutathione.
  - source_id: UniProtKB:Q9CM00
    title: Pasteurella multocida bifunctional glutathione biosynthesis protein GshAB
    statement: >-
      The reviewed GshAB/GshF record contains both glutamate--cysteine ligase
      and glutathione synthetase activities, demonstrating a fused
      implementation of the same two ordered reaction roles.
  - source_id: PMID:16339152
    title: >-
      Characterization of the bifunctional gamma-glutamate-cysteine
      ligase/glutathione synthetase (GshF) of Pasteurella multocida
    statement: >-
      Recombinant characterization establishes the two-domain GshF fusion as
      a bifunctional implementation of both ordered glutathione-biosynthesis
      reactions.
  - source_id: file:human/GCLC/GCLC-ai-review.yaml
    title: Human GCLC gene review
    statement: P48506 provides a eukaryotic exemplar for the first catalytic reaction.
  - source_id: PMID:9895302
    title: >-
      Overexpression of the regulatory subunit of gamma-glutamylcysteine
      synthetase in HeLa cells increases gamma-glutamylcysteine synthetase
      activity and confers drug resistance.
    statement: >-
      Experimental addition and overexpression of the human regulatory subunit
      increased GCL activity, supporting its treatment as an accessory modifier
      rather than a separate catalytic reaction in the pathway.
  - source_id: file:human/GSS/GSS-ai-review.yaml
    title: Human GSS gene review
    statement: P48637 provides a eukaryotic exemplar for the second catalytic reaction.
  - source_id: file:modules/glutathione_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for glutathione biosynthesis
    statement: >-
      The generic review evaluates the two conserved reaction roles, pathway
      boundary, family assignments, and lineage-dependent enzyme forms.
  - source_id: file:PSEPK/gshA/gshA-ai-review.yaml
    title: PSEPK gshA gene review
    statement: Q88R90 supplies the glutamate--cysteine ligase step.
  - source_id: file:PSEPK/gshB/gshB-ai-review.yaml
    title: PSEPK gshB gene review
    statement: Q88D35 supplies the glutathione synthetase step.
  - source_id: PMID:40302248
    title: >-
      High-Throughput Tn-Seq Screens Identify Both Known and Novel Pseudomonas
      putida KT2440 Genes Involved in Metal Tolerance.
    statement: >-
      A P. putida KT2440 Tn-seq study identifies PP_0243 as gshA, describes its
      glutamate--cysteine ligase reaction, and reports reduced mutant fitness
      under copper and cobalt stress; gshB PP_4993 showed a weaker copper
      phenotype that did not pass the study's statistical threshold.
  - source_id: file:PSEPK/PP_3253/PP_3253-ai-review.yaml
    title: PSEPK PP_3253 gene review
    statement: >-
      Q88HV0 is a distinct type-2/YbdK-family ligase candidate with no
      established physiological contribution to KT2440 glutathione synthesis.
  - source_id: PMID:15211520
    title: >-
      YbdK is a carboxylate-amine ligase with a gamma-glutamyl:Cysteine ligase
      activity: crystal structure and enzymatic assays.
    statement: >-
      Purified E. coli YbdK has weak glutamate--cysteine ligase activity in
      vitro, supporting candidate status for this family but not replacement of
      canonical GshA in the reusable pathway.
