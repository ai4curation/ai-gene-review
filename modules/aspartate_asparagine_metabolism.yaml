- source_id: PMID:33397945
  title: Autophagy sustains glutamate and aspartate synthesis in Saccharomyces cerevisiae during nitrogen
    starvation.
  statement: Isotope tracing identifies Aat2 as the major source of newly synthesized aspartate specifically
    during nitrogen starvation in the tested budding-yeast cultures.
  supporting_text: suggesting that Aat2p is the major enzyme for aspartate synthesis under nitrogen starvation
- source_id: PMID:9288922
  title: Cytosolic aspartate aminotransferase encoded by the AAT2 gene is targeted to the peroxisomes
    in oleate-grown Saccharomyces cerevisiae.
  statement: AAT2 encodes the cytosolic aspartate aminotransferase, which is also targeted to peroxisomes
    in oleate-grown cells.
  supporting_text: We demonstrate that the gene AAT2 codes for the cytosolic and peroxisomal AAT activities.
- source_id: PMID:9655342
  title: Crystal structure of Saccharomyces cerevisiae cytosolic aspartate aminotransferase.
  statement: Yeast cytosolic AAT is a PLP-dependent homodimer with the fold and active-site residues of
    bacterial and animal aspartate aminotransferases.
- source_id: PMID:1482685
  title: AAT1, a gene encoding a mitochondrial aspartate aminotransferase in Saccharomyces cerevisiae.
  statement: Sequence analysis identified AAT1 as a likely mitochondrial AspAT; subsequent mitochondrial-enzyme
    work provides stronger compartment/function support.
  supporting_text: which is likely to be the yeast mitochondrial AspAT
- source_id: PMID:22010850
  title: Inactivation of mitochondrial aspartate aminotransferase contributes to the respiratory deficit
    of yeast frataxin-deficient cells.
  statement: Mitochondrial Aat1 participates in the malate-aspartate NADH shuttle; aat1 deletion causes
    respiratory deficiency.
  supporting_text: deletion of the AAT1 gene in a wild-type strain caused respiratory deficiency
- source_id: PMID:35621265
  title: Cytosolic aspartate aminotransferase moonlights as a ribosome-binding modulator of Gcn2 activity
    during oxidative stress.
  statement: Aat2 also binds ribosomes and restrains Gcn2 activation during oxidative stress, independently
    of catalysis; this regulatory role is outside the module.
- source_id: PMID:8951815
  title: 'Cloning of the ASN1 and ASN2 genes encoding asparagine synthetases in Saccharomyces cerevisiae:
    differential regulation by the CCAAT-box-binding factor.'
  statement: ASN1 and ASN2 encode redundant asparagine synthetases; only the double disruption is an asparagine
    auxotroph.
  supporting_text: Simultaneous disruption of both genes leads to a total asparagine auxotrophy, while
    disruption of asn1 or asn2 alone has no effect on growth under tested conditions.
- source_id: PMID:8026756
  title: The ASP1 gene of Saccharomyces cerevisiae, encoding the intracellular isozyme of L-asparaginase.
  statement: S. cerevisiae has an intracellular asparaginase I (ASP1) and a cell-wall asparaginase II
    (ASP3), which are homologous.
  supporting_text: Saccharomyces cerevisiae produces two L-asparaginases (ASPs), intracellular ASP I and
    cell-wall ASP II.
- source_id: PMID:27824095
  title: 'Recombinant L-asparaginase 1 from Saccharomyces cerevisiae: an allosteric enzyme with antineoplastic
    activity.'
  statement: Purified recombinant Asp1 hydrolyses L-asparagine.
  supporting_text: ScASNase1 has specific activity of 196.2 U/mg
- source_id: PMID:3042786
  title: Asparaginase II of Saccharomyces cerevisiae. Characterization of the ASP3 gene.
  statement: ASP3 encodes asparaginase II, which is under nitrogen catabolite repression.
  supporting_text: nitrogen catabolite repression of asparaginase II is achieved by alteration in mRNA
    levels
- source_id: PMID:22776361
  title: The ASP3 locus in Saccharomyces cerevisiae originated by horizontal gene transfer from Wickerhamomyces.
  statement: The 2012 phylogenetic study proposed recent horizontal transfer of ASP3. Its strain-restricted
    distribution remains relevant, but later genome sampling and synteny favor ancestral presence followed
    by losses; recent transfer is not treated as settled.
  supporting_text: is completely absent from the genomes of 128 diverse fungal species
  notes: Evolutionary interpretation challenged by PMID:36040324; the absence count describes the 2012
    sample, not all fungi.
- source_id: PMID:17308034
  title: Effect of 21 different nitrogen sources on global gene expression in the yeast Saccharomyces
    cerevisiae.
  statement: Cited by YeastPathways for asparagine as a nitrogen source (ASPARAGINE-DEG2-PWY).
- source_id: PMID:19396236
  title: ALT1-encoded alanine aminotransferase plays a central role in the metabolism of alanine in Saccharomyces
    cerevisiae.
  statement: Alt1 is the sole route of alanine synthesis and catabolism under respiratory conditions;
    under fermentative conditions alanine is made mainly by an Alt1-independent route.
  supporting_text: under respiratory conditions, Alt1p constitutes the sole pathway for alanine biosynthesis
    and catabolism
- source_id: PMID:23049841
  title: Paralogous ALT1 and ALT2 retention and diversification have generated catalytically active and
    inactive aminotransferases in Saccharomyces cerevisiae.
  statement: The ALT2 paralog encodes a catalytically inactive protein, so only ALT1 is a module participant.
  supporting_text: only Alt1 displays alanine aminotransferase activity; in contrast ALT2 encodes a catalytically
    inert protein
- source_id: PMID:35697072
  title: Evolutionary origin and functional diversification of aminotransferases.
  statement: Comparative review supports PLP-dependent amino/keto-acid exchange and substantial substrate
    diversification. Family membership alone does not establish a physiological substrate or net reaction
    direction.
- source_id: PMID:33624365
  title: 'Structural and functional diversity of asparaginases: Overview and recommendations for a revised
    nomenclature.'
  statement: Asparaginase structural classes cross organismal boundaries; historical bacterial-type and
    plant-type names cannot delimit the module taxon scope.
- source_id: PMID:34258001
  title: 'Structural and biophysical aspects of l-asparaginases: a growing family with amazing diversity.'
  statement: Structural review separates Class 1 asparaginases from Class 2 N-terminal-nucleophile hydrolases
    and discusses potassium-dependent and independent plant enzymes. These labels do not mean bacterial-only
    or plant-only distribution.
- source_id: PMID:31998641
  title: 'Asparagine Synthetase in Cancer: Beyond Acute Lymphoblastic Leukemia.'
  statement: Human ASNS review explains coupling of glutamine hydrolysis to ATP-dependent aspartate amidation.
    Its physiological glutamine requirement is distinguished from free-ammonia activity of purified recombinant
    human enzyme.
- source_id: PMID:24902885
  title: Plastidic aspartate aminotransferases and the biosynthesis of essential amino acids in plants.
  statement: Plant plastids contain conventional AspAT and a distinct bifunctional aspartate/prephenate
    aminotransferase; a cytosol/mitochondrion-only model misses this implementation.
- source_id: PMID:40940428
  title: Mapping multi-substrate specificity of Arabidopsis aminotransferases.
  statement: The 2025 Arabidopsis survey measured many substrate combinations and incorporated them into
    a metabolic model. This supports caution about one-name/one-substrate assumptions; the abstract alone
    does not establish native flux or an activity for a particular exemplar.
- source_id: PMID:36040324
  title: The evolution and role of the periplasmic asparaginase Asp3 in yeast.
  statement: Expanded Saccharomyces sampling and synteny favor ancestral ASP3 with repeated loss over
    recent acquisition. Heterologous ASP3 improves growth on sole asparagine in the tested host, but not
    in apple juice.
  supporting_text: most likely to be an ancestral gene
- source_id: PMID:12068109
  title: Molecular and physiological analysis of Arabidopsis mutants defective in cytosolic or chloroplastic
    aspartate aminotransferase.
  statement: Arabidopsis ASP2 defects reduce aspartate and asparagine pools in specific alleles/tissues.
    ASP5 mutants retain residual activity and do not establish absolute dispensability of plastid aspartate
    formation.
- source_id: PMID:9535706
  title: Recombinant expression, purification, and characterization of three isoenzymes of aspartate aminotransferase
    from Arabidopsis thaliana.
  statement: Purified Arabidopsis ASP1/ASP2/ASP5 enzymes were kinetically characterized with the four
    AspAT substrates. This supports conventional plant AspAT chemistry; the older plastid subtype assignment
    was tentative.
- source_id: PMID:2573597
  title: The N-terminal cysteine of human asparagine synthetase is essential for glutamine-dependent activity.
  statement: Mutating the human ASNS N-terminal cysteine abolishes glutamine-dependent activity while
    retaining ammonia-dependent synthesis in vitro, separating glutamine hydrolysis from the synthetase
    reaction.
- source_id: PMID:2564390
  title: Expression of human asparagine synthetase in Escherichia coli.
  statement: Purified recombinant human ASNS has both glutamine- and ammonia-dependent activity in vitro;
    this does not demonstrate a separate native ammonia-dependent pathway.
- source_id: PMID:39502420
  title: Mitochondrial aspartate aminotransferase ( maa1 ) inactivation causes glutamate-requiring glu1
    mutation in Schizosaccharomyces pombe.
  statement: Fission-yeast maa1 inactivation produces a glutamate requirement; its prevailing biosynthetic
    direction is distinct from caa1-mediated aspartate formation in the tested conditions.
- source_id: PMID:16705405
  title: 'Co-occurrence of both L-asparaginase subtypes in Arabidopsis: At3g16150 encodes a K+-dependent
    L-asparaginase.'
  statement: Purified Arabidopsis ASPGB1 exemplifies potassium-dependent plant Ntn asparaginase chemistry;
    its specificity must be read together with the later beta-aspartyl-peptide study.
- source_id: PMID:22127737
  title: Role of asparaginase variable loop at the carboxyl terminal of the alpha subunit in the determination
    of substrate preference in plants.
  statement: Direct Arabidopsis enzyme comparison establishes that potassium-dependent ASPGB1 can also
    hydrolyse beta-aspartyl-histidine; the asparaginase role does not mean absolute substrate exclusivity.
- source_id: PMID:17319845
  title: Alanine aminotransferase catalyses the breakdown of alanine after hypoxia in Arabidopsis thaliana.
  statement: Arabidopsis ALAAT1 contributes to alanine breakdown during recovery from hypoxia; this is
    physiological evidence for a conditional catabolic direction.
- source_id: PMID:17451745
  title: Crystal structure and allosteric regulation of the cytoplasmic Escherichia coli L-asparaginase
    I.
  statement: E. coli ansA (UniProtKB:P0A962) is a cytosolic Class 1 biochemical comparator for substrate-responsive
    asparaginase behavior; it does not extend the eukaryotic module taxon envelope.
- source_id: PMID:2407723
  title: Analysis of the Escherichia coli gene encoding L-asparaginase II, ansB, and its regulation by
    cyclic AMP receptor and FNR proteins.
  statement: E. coli ansB (UniProtKB:P00805) is a periplasmic Class 1 comparator. Its Gram-negative outer-membrane-bounded
    periplasm differs from the fungal cell-wall-bounded compartment.
- source_id: PMID:20883697
  title: 'Identification of a plant gene encoding glutamate/aspartate-prephenate aminotransferase: the
    last homeless enzyme of aromatic amino acids biosynthesis.'
  statement: Target comparison distinguishes bifunctional Arabidopsis PAT from conventional ASP5, which
    retains AspAT activity without detectable prephenate activity under the reported assay conditions.
- source_id: PMID:28011691
  title: CORRECTION.
  statement: Correction to PMID:25070637 reidentifies mutant labels/plasmids and revises mutant-specific
    activity claims; the remeasured wild-type bifunctional enzyme result remains supported.
