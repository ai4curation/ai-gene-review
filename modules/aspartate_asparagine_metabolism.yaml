    statement: >-
      Source pathway: ASPAMINOTRANS-RXN (AAT1, AAT2) and
      PYRUVATE-CARBOXYLASE-RXN (PYC1, PYC2). The transamination is modelled;
      pyruvate carboxylation is oxaloacetate supply and is kept outside the
      module.
