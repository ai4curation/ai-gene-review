id: MODULE:aspartate_asparagine_metabolism
title: L-aspartate, L-asparagine and L-alanine formation and turnover
description: >-
  Formation and turnover of the amino acids that lie one step from the
  central-carbon 2-oxoacids oxaloacetate and pyruvate, in eukaryotes. Aspartate
  aminotransferase reversibly transaminates oxaloacetate with L-glutamate to
  give L-aspartate and 2-oxoglutarate. Eukaryotes carry a cytosolic and a
  mitochondrial isozyme; in budding yeast the cytosolic enzyme supplies most
  cellular aspartate, whereas the mitochondrial one acts in the matrix. L-aspartate is
  then amidated by glutamine-dependent asparagine synthetase, which uses ATP
  and the glutamine amide nitrogen to form L-asparagine and releases glutamate,
  AMP and diphosphate. Asparaginases hydrolyse L-asparagine back to L-aspartate
  and ammonium, which lets asparagine serve as a nitrogen source; fungi can
  have an intracellular asparaginase and, in some lineages, a cell-wall
  asparaginase regulated by nitrogen availability. The aspartate made by
  transamination feeds the aspartate family (threonine, methionine,
  isoleucine), arginine and pyrimidine synthesis, and the malate-aspartate
  shuttle. In the same way, alanine aminotransferase reversibly transaminates
  pyruvate with L-glutamate to give L-alanine and 2-oxoglutarate, and so serves
  both alanine synthesis and alanine use as a nitrogen source. All of these
  reactions use L-glutamate as amino donor or acceptor and so connect the
  ammonium-assimilation hub to carbon metabolism.
status: DRAFT
