  connections:
  - source: aspartate_transamination_step
    target: asparagine_synthetase_step
    connection_type: PRECEDES
    description: Aspartate made by forward AspAT chemistry supplies glutamine-dependent ASNS. This is
      metabolite continuity, not direct physical channeling; compartment-specific transport can intervene.
    chaining_status: VERIFIED
    chaining_note: The shared metabolite is L-aspartate, not a CoA carrier. Native plant Asp/Asn pool
      coupling and purified ASNS chemistry support the link; cross-compartment transfer is outside the
      catalytic boundary.
    evidence:
    - source_id: PMID:12068109
      title: Molecular and physiological analysis of Arabidopsis mutants defective in cytosolic or chloroplastic
        aspartate aminotransferase.
      statement: Native ASP2 alleles affect both Asp and Asn pools, supporting precursor coupling.
    - source_id: PMID:2573597
      title: The N-terminal cysteine of human asparagine synthetase is essential for glutamine-dependent
        activity.
      statement: Human ASNS directly carries out glutamine-dependent aspartate amidation.
    - source_id: PMID:8951815
      title: 'Cloning of the ASN1 and ASN2 genes encoding asparagine synthetases in Saccharomyces cerevisiae:
        differential regulation by the CCAAT-box-binding factor.'
      statement: Yeast ASNS paralog loss establishes the downstream synthetic requirement.
    - source_id: gomodel:YeastPathways_ASPARAGINE-BIOSYNTHESIS-1
      url: https://live-go-cam.geneontology.io/product/json/low-level/YeastPathways_ASPARAGINE-BIOSYNTHESIS-1.json
      statement: The live model contains four RO:0002413 edges from AAT1/AAT2 activities to ASN1/ASN2
        activities. This independently corroborates the curated precursor relationship, without proving
        physical substrate channeling.
  - source: asparaginase_step
    target: aspartate_transamination_step
    connection_type: PRECEDES
    description: Asparaginase releases aspartate that can enter the reverse AspAT reaction to form oxaloacetate
      and glutamate. Extracellular Asp3 requires substrate import; the connection does not assert obligatory
      flux or a futile synthesis/hydrolysis cycle.
    chaining_status: VERIFIED
    chaining_note: L-aspartate is the hydrolysis product and the substrate of reverse transamination.
      The AspAT leaf displays its forward biosynthetic orientation; this edge explicitly uses the reverse
      direction. Transport is required for the periplasmic implementation.
    evidence:
    - source_id: PMID:36040324
      title: The evolution and role of the periplasmic asparaginase Asp3 in yeast.
      statement: The yeast assimilation scheme distinguishes extracellular hydrolysis, transport and intracellular
        Asp conversion to oxaloacetate/glutamate.
    - source_id: PMID:27824095
      title: 'Recombinant L-asparaginase 1 from Saccharomyces cerevisiae: an allosteric enzyme with antineoplastic
        activity.'
      statement: Purified yeast Asp1 supports the hydrolytic first reaction.
    - source_id: PMID:9535706
      title: Recombinant expression, purification, and characterization of three isoenzymes of aspartate
        aminotransferase from Arabidopsis thaliana.
      statement: Four-substrate kinetics establish reversible plant AspAT chemistry.
  knowledge_gaps:
  - gap_statement: In fermenting S. cerevisiae alanine is made mainly by a route that does not need Alt1,
      and the enzyme responsible is unknown; the catalytically inactive paralogue Alt2 does not supply
      it.
    boundary: The module models only the alanine aminotransferase route. Identifying the fermentative
      alanine-forming activity needs alanine-labelling and auxotrophy screens in alt1 backgrounds on glucose.
    gap_kind:
    - BIOLOGY
    status: OPEN
  notes: 'Boundary: aspartate/asparagine formation and turnover plus parallel alanine transamination.
    Oxaloacetate/pyruvate supply, membrane transport, ammonium assimilation, the complete malate-aspartate
    shuttle and downstream aromatic/aspartate-family amino-acid pathways remain adjacent processes. The
    core requires an AspAT implementation and glutamine-dependent ASNS; hydrolysis and alanine turnover
    are optional branches. No common compartment is imposed. Plant plastid PAT is included only for AspAT
    chemistry; ASP5 is not assigned PAT activity. E. coli ansA/ansB are independently reviewed biochemical
    comparators for Class 1 asparaginases, not eukaryotic participant exemplars: ansB occupies an outer-membrane-bounded
    periplasm, not the fungal cell-wall-bounded compartment. The three cached YeastPathways imports place
    AAT1 and, in the degradation model, ASP3 in cytosol; target evidence governs their compartments here.
    Pyruvate carboxylase is upstream substrate supply at this chosen boundary; its broader GO process
    annotation is not declared erroneous for that reason. PomBase maa1 and caa1 retain reversible AspAT
    chemistry, but their prevalent physiological directions differ in PMID:39502420. Alt1 matrix localization
    is a curated inference, not disproved by transit-peptide length alone. Aat2 ribosome/Gcn2 regulation
    and peroxisomal targeting on oleate remain documented gene-level context outside the cytosolic implementation.
    ASP3 evolution is qualified by the later synteny study, and four identical S288C copies are not four
    independent biochemical experiments.'
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
      description: Comparative formation/turnover module grounded in budding/fission yeast, human and
        Arabidopsis. Bacterial asparaginases are reviewed as biochemical comparators, not as complete-pathway
        exemplars. Neither presence in every eukaryote nor an exhaustive survey of eukaryotic alternatives
        is asserted.
scope: CONCRETE
references:
- id: PMID:35697072
  title: Evolutionary origin and functional diversification of aminotransferases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. The paper distinguishes functional specialization from promiscuity;
      its survey is not an experimental assay of every representative.
  findings:
  - statement: Comparative review supports PLP-dependent amino/keto-acid exchange and substantial substrate
      diversification. Family membership alone does not establish a physiological substrate or net reaction
      direction.
- id: PMID:33624365
  title: 'Structural and functional diversity of asparaginases: Overview and recommendations for a revised
    nomenclature.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available. The classification proposal is used only for its explicit cross-taxon
      conclusion, not detailed residue-level mechanisms.
  findings:
  - statement: Asparaginase structural classes cross organismal boundaries; historical bacterial-type
      and plant-type names cannot delimit the module taxon scope.
- id: PMID:34258001
  title: 'Structural and biophysical aspects of l-asparaginases: a growing family with amazing diversity.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Structure and chemistry support the alternative family boundary; target-specific
      primary work establishes the Arabidopsis exemplar.
  findings:
  - statement: Structural review separates Class 1 asparaginases from Class 2 N-terminal-nucleophile hydrolases
      and discusses potassium-dependent and independent plant enzymes. These labels do not mean bacterial-only
      or plant-only distribution.
- id: PMID:31998641
  title: 'Asparagine Synthetase in Cancer: Beyond Acute Lymphoblastic Leukemia.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Cancer physiology is context, not a module step. The phrase obliged
      ammonia-donating substrate must not be interpreted as an absolute in-vitro exclusion of ammonia;
      PMID:2564390 and PMID:2573597 directly show that alternative.
  findings:
  - statement: Human ASNS review explains coupling of glutamine hydrolysis to ATP-dependent aspartate
      amidation. Its physiological glutamine requirement is distinguished from free-ammonia activity of
      purified recombinant human enzyme.
- id: PMID:24902885
  title: Plastidic aspartate aminotransferases and the biosynthesis of essential amino acids in plants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available. Primary recombinant enzyme and native-plant studies are used for
      specific ASP5/PAT claims.
  findings:
  - statement: Plant plastids contain conventional AspAT and a distinct bifunctional aspartate/prephenate
      aminotransferase; a cytosol/mitochondrion-only model misses this implementation.
- id: PMID:22776361
  title: The ASP3 locus in Saccharomyces cerevisiae originated by horizontal gene transfer from Wickerhamomyces.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The recent-horizontal-transfer interpretation is challenged by the expanded phylogeny
      and synteny in PMID:36040324. The original strain-distribution observations are not discarded.
  findings:
  - statement: The 2012 phylogenetic study proposed recent horizontal transfer of ASP3. Its strain-restricted
      distribution remains relevant, but later genome sampling and synteny favor ancestral presence followed
      by losses; recent transfer is not treated as settled.
notes: Review literature, primary evidence, family placement and source-model assertions were checked
  separately. Detailed reference assessments and explicit uncertainties are recorded in the references
  and module notes; module boundaries do not redefine which broader GO processes a gene may participate
  in.
