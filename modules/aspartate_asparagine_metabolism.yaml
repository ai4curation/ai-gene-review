    - source: aspartate_transamination_step
      target: asparagine_synthetase_step
      connection_type: PRECEDES
      description: L-aspartate made by transamination is amidated by asparagine synthetase.
    - source: asparaginase_step
      target: aspartate_transamination_step
      connection_type: PRECEDES
      description: >-
        In asparagine catabolism the aspartate released by asparaginase is
        transaminated to oxaloacetate, passing its amino group to glutamate.
  knowledge_gaps:
    - gap_statement: >-
        In fermenting S. cerevisiae alanine is made mainly by a route that does
        not need Alt1, and the enzyme responsible is unknown; the catalytically
        inactive paralogue Alt2 does not supply it.
      boundary: >-
        The module models only the alanine aminotransferase route. Identifying
        the fermentative alanine-forming activity needs alanine-labelling and
        auxotrophy screens in alt1 backgrounds on glucose.
      gap_kind:
        - BIOLOGY
      status: OPEN
  notes: >-
    Boundary and scope decision: the crosswalk folded six single-reaction
    YeastCyc frames into this module. Aspartate transamination, asparagine
    synthesis and asparaginase form one connected aspartate/asparagine unit.
    Alanine aminotransferase (ALANINE-SYN2-PWY, ALANINE-DEG3-PWY) is not
    chemically connected to it. It is kept here as a parallel part, as in
    KEGG's grouping of alanine with aspartate metabolism, because it is the
    equivalent glutamate-linked transamination of the other central-carbon
    2-oxoacid (pyruvate). It could be split out if an alanine module is ever
    made. The title therefore names alanine, while the slug stays as assigned.
    Oxaloacetate supply by pyruvate carboxylase (ASPBIO-PWY: PYC1 major, PYC2
    minor) is upstream and outside the module; note that fungal pyruvate
    carboxylases are cytosolic, whereas pyruvate_metabolism models the
    mitochondrial animal enzyme. Aspartate use by the threonine/methionine
    trunk is aspartate_family_threonine_biosynthesis; the mitochondrial
    isozyme's shuttle role is malate_aspartate_shuttle; the ammonium and
    glutamate/glutamine reactions are nitrogen_assimilation_glutamate_glutamine.
    The Aat2 non-catalytic ribosome/Gcn2 regulatory role (PMID:35621265) and
    its peroxisomal localisation on oleate (PMID:9288922) are not modelled.
    YeastCyc assessment: AAT1, AAT2, ASN1, ASN2, ASP1, ASP3-1 to ASP3-4 and
    ALT1 assignments are correct, and no S. cerevisiae catalyst is missing.
    YeastCyc correctly omits the inactive, cytosolic ALT2 (PMID:23049841). Compartments
    YeastCyc does not give are added: AAT1 and ALT1 act in the mitochondrial matrix,
    AAT2, ASN1/ASN2 and ASP1 in the cytosol, and the secreted ASP3 enzymes in the cell
    wall-bounded periplasmic space. The ASP3
    cluster is strain-specific (PMID:22776361), so the cell-wall asparaginase
    is a lineage variant, not a general fungal step. Generalisation caveats:
    bacteria also use an ammonia-dependent asparagine synthetase (AsnA), which
    is not modelled; the human ASNS sits in a different PANTHER subfamily
    (PTHR11772:SF36) from the fungal and E. coli AsnB enzymes (SF2), so the
    family-level id is used. GO-CAM disagreements: (a) all three YeastPathways
    models put AAT1 in the cytosol, although Aat1 is a mitochondrial-matrix
    enzyme, and ASPARAGINE-DEG2-PWY puts the cell-wall ASP3 enzymes in the
    cytosol; (b) ASPBIO-PWY makes PYC1/PYC2 part_of GO:0006532, which is
    supply rather than aspartate synthesis; (c) none of the YeastPathways
    models has causal edges; (d) the alanine frames have no YeastPathways
    GO-CAM, so the alanine part is grounded only in the PomBase model
    67c10cc400000148; (e) PomBase 67c10cc400005826 agrees with the module for
    caa1, maa1 and asn1, and its shuttle carriers, malate dehydrogenases and
    tRNA ligases are outside it.
