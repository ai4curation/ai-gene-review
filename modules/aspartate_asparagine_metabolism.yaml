                        description: >-
                          S. pombe maa1 enables GO:0004069 in the mitochondrial
                          matrix, part_of GO:0006532. This conflicts with
                          PMID:39502420, which assigns maa1 to glutamate synthesis and
                          caa1 to aspartate synthesis.
