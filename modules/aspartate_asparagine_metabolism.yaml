                      selector_type: FAMILY
                      gene:
                        preferred_term: AAT1 / maa1 / GOT2 (mitochondrial AspAT)
                      family:
                        preferred_term: aspartate aminotransferases (mitochondrial isozymes)
                        description: >-
                          Family-level id used because the fungal mitochondrial enzymes are in PTHR11879:SF22 and human GOT2 in SF39 (UniProt
                          PANTHER cross-references), so no single subfamily
                          spans the representatives.
                        family_terms:
                          - id: PANTHER:PTHR11879
                            label: ASPARTATE AMINOTRANSFERASE
                        representative_members:
