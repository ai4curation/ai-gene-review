  - source_id: GO:0042853
    title: L-alanine catabolic process
    statement: Biological process of the alanine transamination part (catabolic direction).
  - source_id: PMID:33397945
    title: Autophagy sustains glutamate and aspartate synthesis in Saccharomyces cerevisiae during nitrogen starvation.
    statement: >-
      13C tracing in aat1 and aat2 mutants shows that cytosolic Aat2 makes
      almost all newly synthesised aspartate; loss of Aat1 has a modest
      effect.
    supporting_text: >-
      suggesting that Aat2p is the major enzyme for aspartate synthesis under
      nitrogen starvation
  - source_id: PMID:9288922
    title: Cytosolic aspartate aminotransferase encoded by the AAT2 gene is targeted to the peroxisomes in oleate-grown Saccharomyces cerevisiae.
    statement: >-
      AAT2 encodes the cytosolic aspartate aminotransferase, which is also
      targeted to peroxisomes in oleate-grown cells.
    supporting_text: >-
      We demonstrate that the gene AAT2 codes for the cytosolic and peroxisomal
      AAT activities.
  - source_id: PMID:9655342
    title: Crystal structure of Saccharomyces cerevisiae cytosolic aspartate aminotransferase.
    statement: >-
      Yeast cytosolic AAT is a PLP-dependent homodimer with the fold and
      active-site residues of bacterial and animal aspartate aminotransferases.
  - source_id: PMID:1482685
    title: AAT1, a gene encoding a mitochondrial aspartate aminotransferase in Saccharomyces cerevisiae.
    statement: AAT1 encodes the mitochondrial aspartate aminotransferase isozyme.
    supporting_text: which is likely to be the yeast mitochondrial AspAT
  - source_id: PMID:22010850
    title: Inactivation of mitochondrial aspartate aminotransferase contributes to the respiratory deficit of yeast frataxin-deficient cells.
    statement: >-
      Mitochondrial Aat1 participates in the malate-aspartate NADH shuttle;
      aat1 deletion causes respiratory deficiency.
    supporting_text: >-
      deletion of the AAT1 gene in a wild-type strain caused respiratory
      deficiency
  - source_id: PMID:35621265
    title: Cytosolic aspartate aminotransferase moonlights as a ribosome-binding modulator of Gcn2 activity during oxidative stress.
    statement: >-
      Aat2 also binds ribosomes and restrains Gcn2 activation during oxidative
      stress, independently of catalysis; this regulatory role is outside the
      module.
  - source_id: PMID:8951815
    title: 'Cloning of the ASN1 and ASN2 genes encoding asparagine synthetases in Saccharomyces cerevisiae: differential regulation by the CCAAT-box-binding factor.'
    statement: >-
      ASN1 and ASN2 encode redundant asparagine synthetases; only the double
      disruption is an asparagine auxotroph.
    supporting_text: >-
      Simultaneous disruption of both genes leads to a total asparagine
      auxotrophy, while disruption of asn1 or asn2 alone has no effect on
      growth under tested conditions.
  - source_id: PMID:8026756
    title: The ASP1 gene of Saccharomyces cerevisiae, encoding the intracellular isozyme of L-asparaginase.
    statement: >-
      S. cerevisiae has an intracellular asparaginase I (ASP1) and a cell-wall
      asparaginase II (ASP3), which are homologous.
    supporting_text: >-
      Saccharomyces cerevisiae produces two L-asparaginases (ASPs),
      intracellular ASP I and cell-wall ASP II.
  - source_id: PMID:27824095
    title: 'Recombinant L-asparaginase 1 from Saccharomyces cerevisiae: an allosteric enzyme with antineoplastic activity.'
    statement: Purified recombinant Asp1 hydrolyses L-asparagine.
    supporting_text: ScASNase1 has specific activity of 196.2 U/mg
  - source_id: PMID:3042786
    title: Asparaginase II of Saccharomyces cerevisiae. Characterization of the ASP3 gene.
    statement: >-
      ASP3 encodes asparaginase II, which is under nitrogen catabolite
      repression.
    supporting_text: >-
      nitrogen catabolite repression of asparaginase II is achieved by
      alteration in mRNA levels
  - source_id: PMID:22776361
    title: The ASP3 locus in Saccharomyces cerevisiae originated by horizontal gene transfer from Wickerhamomyces.
    statement: >-
      The four-copy ASP3 cell-wall asparaginase cluster of S288C was acquired
      by horizontal gene transfer; it is present only in some laboratory and
      industrial S. cerevisiae strains and absent from 128 other fungal
      genomes.
    supporting_text: >-
      is completely absent from the genomes of 128 diverse fungal species
  - source_id: PMID:17308034
    title: Effect of 21 different nitrogen sources on global gene expression in the yeast Saccharomyces cerevisiae.
    statement: Cited by YeastPathways for asparagine as a nitrogen source (ASPARAGINE-DEG2-PWY).
  - source_id: PMID:19396236
    title: ALT1-encoded alanine aminotransferase plays a central role in the metabolism of alanine in Saccharomyces cerevisiae.
    statement: >-
      Alt1 is the sole route of alanine synthesis and catabolism under
      respiratory conditions; under fermentative conditions alanine is made
      mainly by an Alt1-independent route.
    supporting_text: >-
      under respiratory conditions, Alt1p constitutes the sole pathway for
      alanine biosynthesis and catabolism
  - source_id: PMID:23049841
    title: Paralogous ALT1 and ALT2 retention and diversification have generated catalytically active and inactive aminotransferases in Saccharomyces cerevisiae.
    statement: >-
      The ALT2 paralog encodes a catalytically inactive protein, so only ALT1
      is a module participant.
    supporting_text: >-
      only Alt1 displays alanine aminotransferase activity; in contrast ALT2
      encodes a catalytically inert protein
