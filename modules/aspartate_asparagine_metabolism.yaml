                              S. pombe maa1/SPBC725.01. maa1 is the classical glu1 locus:
                              the mutant requires glutamate, and maa1 mainly supplies
                              glutamate by running the reaction in the reverse direction
                              (PMID:39502420; maa1 gene review). The shuttle-export
                              framing below fits budding yeast and animals, not S. pombe.
                          - preferred_term: GOT2 (Homo sapiens)
                            term:
                              id: UniProtKB:P00505
                              label: Aspartate aminotransferase, mitochondrial
                    function:
                      preferred_term: L-aspartate:2-oxoglutarate transaminase activity
                      term:
                        id: GO:0004069
                        label: L-aspartate:2-oxoglutarate transaminase activity
                    locations:
                      - preferred_term: mitochondrial matrix
