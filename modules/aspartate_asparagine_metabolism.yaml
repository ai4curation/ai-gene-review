id: MODULE:aspartate_asparagine_metabolism
title: L-aspartate, L-asparagine and L-alanine formation and turnover
description: Reversible aspartate and alanine transamination connects oxaloacetate and pyruvate to amino-acid
  metabolism in the sampled fungi, animals and plants. Glutamine-dependent asparagine synthetase amidates
  aspartate using ATP and glutamine amide nitrogen, releasing glutamate, AMP and diphosphate. Asparaginases
  instead hydrolyse asparagine to aspartate and ammonium without a glutamate cosubstrate. Cytosolic, mitochondrial
  and plant plastid aminotransferases provide different implementations; their net flux depends on substrates,
  compartment and physiological conditions. Plant plastids include both conventional AspAT and a distinct
  bifunctional aspartate/prephenate aminotransferase. Asparagine hydrolysis is optional at this formation/turnover
  boundary and uses structurally distinct asparaginase families in the demonstrated yeast and plant examples.
  Secreted yeast Asp3 is strain dependent. Alanine transamination is a parallel reaction, not an asserted
  chemical link in the aspartate/asparagine chain. The taxonomic envelope does not imply universal retention,
  identical compartments or simultaneous flux through every branch.
status: DRAFT
