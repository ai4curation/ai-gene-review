    title: L-asparagine biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      ASPAMINOTRANS-RXN (AAT1, AAT2) and ASNSYNB-RXN (ASN1, ASN2); assignments
      retained.
