        ASP1, ASP3-1 to ASP3-4, AAT1 and AAT2 activities, all in cytosol,
        part_of GO:0006530.
    - model: gomodel:67c10cc400005826
      title: malate-aspartate shuttle (GO:0043490), aspartate biosynthetic process (GO:0006532)
      description: >-
        PomBase S. pombe model with mitochondrial maa1 and cytosolic caa1
        aspartate aminotransferases, cytosolic asn1, and malate-aspartate
        shuttle carriers, malate dehydrogenases and aspartyl/asparaginyl-tRNA
        ligases that are outside this module.
  parts:
    - order: 1
      role: aspartate formation by transamination
      node:
        id: aspartate_transamination_step
        label: oxaloacetate + L-glutamate to L-aspartate + 2-oxoglutarate
        module_type: REACTION
        concepts:
          - preferred_term: L-aspartate biosynthetic process
            term:
              id: GO:0006532
              label: L-aspartate biosynthetic process
        variant_sets:
          - id: aspartate_aminotransferase_compartment
            label: Aspartate aminotransferase isozyme by compartment
            axis: compartment
            selection: ONE_OR_MORE
            notes: >-
              Eukaryotes carry both isozymes; they are paralogues in PANTHER
              PTHR11879. In S. cerevisiae the cytosolic isozyme supplies most
              aspartate (PMID:33397945), and the mitochondrial isozyme
              serves the malate-aspartate shuttle (PMID:22010850), which is
              modelled in malate_aspartate_shuttle.
            variants:
              - id: cytosolic_aspartate_aminotransferase
                label: Cytosolic aspartate aminotransferase
                module_type: REACTION
                annotons:
                  - id: cytosolic_aspartate_aminotransferase_activity
                    label: Cytosolic aspartate aminotransferase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: AAT2 / caa1 / GOT1 (cytosolic AspAT)
                      family:
                        preferred_term: aspartate aminotransferases (cytosolic isozymes)
                        description: >-
                          Family-level id used because the fungal cytosolic enzymes are in PTHR11879:SF55 and human GOT1 in SF3 (UniProt
                          PANTHER cross-references), so no single subfamily
                          spans the representatives.
                        family_terms:
                          - id: PANTHER:PTHR11879
                            label: ASPARTATE AMINOTRANSFERASE
                        representative_members:
                          - preferred_term: AAT2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P23542
                              label: Aspartate aminotransferase, cytoplasmic
                            description: >-
                              S. cerevisiae AAT2/YLR027C, the main source of
                              aspartate (PMID:33397945); also peroxisomal on
                              oleate (PMID:9288922).
                          - preferred_term: caa1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:O42652
                              label: Aspartate aminotransferase, cytoplasmic
                            description: S. pombe caa1/SPAC10F6.13c.
                          - preferred_term: GOT1 (Homo sapiens)
                            term:
                              id: UniProtKB:P17174
                              label: Aspartate aminotransferase, cytoplasmic
                    function:
                      preferred_term: L-aspartate:2-oxoglutarate transaminase activity
                      term:
                        id: GO:0004069
                        label: L-aspartate:2-oxoglutarate transaminase activity
                      substrates:
                        - preferred_term: oxaloacetate
                        - preferred_term: L-glutamate
                      products:
                        - preferred_term: L-aspartate
                        - preferred_term: 2-oxoglutarate
                      evidence:
                        - source_id: EC:2.6.1.1
                          statement: aspartate transaminase
                          notes: MetaCyc:ASPAMINOTRANS-RXN (reversible)
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Main biosynthetic source of cytosolic aspartate in
                      yeast; the reverse reaction recovers aspartate nitrogen
                      as glutamate.
                    gocam_associations:
                      - model: gomodel:YeastPathways_ASPBIO-PWY
                        activity: gomodel:ASPAMINOTRANS-RXN
                        title: 'aspartate biosynthesis - imported from: Saccharomyces Genome Database'
                        description: AAT2 (and AAT1) enable GO:0004069 in cytosol.
                      - model: gomodel:YeastPathways_ASPARAGINE-BIOSYNTHESIS-1
                        activity: gomodel:ASPAMINOTRANS-RXN
                        title: 'L-asparagine biosynthesis I - imported from: Saccharomyces Genome Database'
                        description: AAT2 (and AAT1) enable GO:0004069 in cytosol.
                      - model: gomodel:YeastPathways_ASPARAGINE-DEG2-PWY
                        activity: gomodel:ASPAMINOTRANS-RXN
                        title: 'asparagine degradation - imported from: Saccharomyces Genome Database'
                        description: AAT2 (and AAT1) enable GO:0004069 in cytosol.
                      - model: gomodel:67c10cc400005826
                        activity: gomodel:67c10cc400005826/684b6c8100000690
                        title: aspartate biosynthetic process (GO:0006532) (S. pombe)
                        description: >-
                          S. pombe caa1 enables GO:0004069 in cytosol with
                          oxaloacetate and glutamate as inputs and aspartate as
                          output. In the model this activity is part_of the
                          malate-aspartate shuttle (GO:0043490), not aspartate
                          biosynthesis; Kitamura et al. 2024 (PMID:39502420) find caa1
