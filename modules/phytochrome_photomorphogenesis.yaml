            evidence:
              - source_id: PMID:12006496
                statement: PIF4 binds Pfr phyB selectively and acts negatively in phyB signaling.
                supporting_text: >-
                  PIF4 (phytochrome-interacting factor 4), which binds selectively to the biologically
                  active Pfr form of phyB, but has little affinity for phyA
          - id: pif1_cop1_cofactor
            label: PIF1 as a cofactor enhancing COP1 E3 ligase activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PIF1
                term:
                  id: UniProtKB:Q8GZM7
                  label: Transcription factor PIF1 (Basic helix-loop-helix protein 15) (AtbHLH15)
                    (bHLH 15) (Phytochrome-interacting factor 1) (Protein PHYTOCHROME INTERACTING
                    FACTOR 3-LIKE 5) (Transcription factor EN 101) (bHLH transcription factor bHLH015)
            function:
              preferred_term: ubiquitin-protein transferase activator activity
              term:
