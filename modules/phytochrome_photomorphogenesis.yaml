                supporting_text: >-
                  phyA plays a dominant role in regulating the degradation of PIF1 following initial
                  light exposure
    - order: 2
      role: PIF growth-promoting transcription factors and their light-induced removal
      node:
        id: pif_repressors
        label: PIF repressors of photomorphogenesis (degraded in response to phytochrome)
        module_type: REGULATORY_STEP
        description: >-
          PIF bHLH factors bind G-box elements and repress photomorphogenesis (and, for PIF1,
          germination and chlorophyll biosynthesis) in darkness. Binding of Pfr phytochrome
          triggers rapid PIF phosphorylation, ubiquitination and proteasomal degradation.
          For PIF1, SPA1 kinase activity in a phyB-PIF1-SPA1 complex and the CUL4-COP1-SPA
          ligase are required.
        annotons:
          - id: pif1_transcription_factor
            label: PIF1 (PIL5) bHLH transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PIF1
                term:
                  id: UniProtKB:Q8GZM7
                  label: Transcription factor PIF1 (Basic helix-loop-helix protein 15) (AtbHLH15)
                    (bHLH 15) (Phytochrome-interacting factor 1) (Protein PHYTOCHROME INTERACTING
                    FACTOR 3-LIKE 5) (Transcription factor EN 101) (bHLH transcription factor bHLH015)
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: negative regulation of photomorphogenesis
                term:
                  id: GO:0010100
                  label: negative regulation of photomorphogenesis
              - preferred_term: negative regulation of seed germination
                term:
                  id: GO:0010187
                  label: negative regulation of seed germination
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Highest phytochrome-affinity PIF; degraded within minutes in red light;
              direct regulator of germination (GAI, RGA, SOM) and chlorophyll (PORC) genes.
            evidence:
              - source_id: PMID:18539749
                statement: PIF1 is phosphorylated, ubiquitinated and degraded within minutes in red light.
                supporting_text: >-
                  PIF1 is rapidly phosphorylated and ubiquitinated under red and far-red light before
                  being degraded with a half-life of approximately 1 to 2 min under red light
          - id: pif3_transcription_factor
            label: PIF3 bHLH transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PIF3
                term:
                  id: UniProtKB:O80536
                  label: Transcription factor PIF3 (Basic helix-loop-helix protein 8) (AtbHLH8) (bHLH
                    8) (Phytochrome-associated protein 3) (Phytochrome-interacting factor 3)
                    (Transcription factor EN 100) (bHLH transcription factor bHLH008)
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: red or far-red light signaling pathway
                term:
                  id: GO:0010017
                  label: red or far-red light signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Founding PIF; binds Pfr phyA and phyB, is phosphorylated and degraded in
              light, and represses chlorophyll/photosynthesis genes in etiolated seedlings.
            evidence:
              - source_id: PMID:15155879
                statement: Red and far-red light induce rapid phytochrome-controlled degradation of PIF3.
                supporting_text: >-
                  red (R) and far-red light (FR) induce rapid degradation of the PIF3 protein
          - id: pif4_transcription_factor
            label: PIF4 bHLH transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PIF4
                term:
                  id: UniProtKB:Q8W2F3
                  label: Transcription factor PIF4 (Basic helix-loop-helix protein 9) (AtbHLH9) (bHLH
                    9) (Phytochrome-interacting factor 4) (Short under red-light 2) (Transcription factor
                    EN 102) (bHLH transcription factor bHLH009)
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: red or far-red light signaling pathway
                term:
                  id: GO:0010017
                  label: red or far-red light signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Growth-promoting PIF that preferentially binds Pfr phyB and drives
