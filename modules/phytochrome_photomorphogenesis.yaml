              substrate recruitment, autoubiquitylation and HY5 transubiquitylation; this is the
              activity behind the PIF-to-ligase POSITIVELY_REGULATES connection.
            evidence:
              - source_id: PMID:24858936
                statement: PIF1 enhances COP1 substrate recruitment and E3 ligase activity in vitro.
                supporting_text: >-
                  PIF1 forms complexes with COP1, HY5, and SPA1 and enhances the substrate recruitment
                  and autoubiquitylation and transubiquitylation activities of COP1
          - id: spa1_pif1_kinase
            label: SPA1 kinase-like domain phosphorylating PIF1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SPA1
                term:
                  id: UniProtKB:Q9SYX2
                  label: Protein SUPPRESSOR OF PHYA-105 1 (EC 2.7.-.-)
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
            processes:
              - preferred_term: red or far-red light signaling pathway
                term:
                  id: GO:0010017
                  label: red or far-red light signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Reported Ser/Thr kinase activity of the SPA1 N-terminal domain that
              phosphorylates PIF1 in a phyB-enhanced complex, priming CUL4-COP1-SPA-mediated
              ubiquitination (evidence from one research group; see module notes).
            evidence:
              - source_id: PMID:31527679
                statement: SPA1 phosphorylates PIF1; phyB enhances PIF1 recruitment to SPA1.
                supporting_text: >-
                  SPA1 acts as a serine/threonine kinase and directly phosphorylates PIF1 in vitro and
                  in vivo
    - order: 3
      role: COP1-SPA E3 ubiquitin ligase
      node:
        id: cop1_spa_ligase
        label: CUL4-DDB1-COP1-SPA E3 ubiquitin ligase
        module_type: REGULATORY_STEP
        description: >-
          COP1 is a RING E3 ubiquitin ligase. Bound through its coiled-coil to SPA proteins and
          associated with CUL4-DDB1, it ubiquitinates HY5 and other photomorphogenesis-promoting
          factors for proteasomal degradation in darkness. SPA1 stimulates COP1 E3 activity.
          Light-activated phytochromes and cryptochromes bind SPA proteins and disrupt the
          COP1-SPA interaction; light also triggers COP1 nuclear exclusion.
        annotons:
          - id: cop1_e3_ligase
            label: COP1 RING E3 ubiquitin ligase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: COP1
                term:
                  id: UniProtKB:P43254
                  label: E3 ubiquitin-protein ligase COP1 (EC 2.3.2.27) (Constitutive photomorphogenesis
                    protein 1) (RING-type E3 ubiquitin transferase COP1)
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
            processes:
              - preferred_term: negative regulation of photomorphogenesis
                term:
                  id: GO:0010100
                  label: negative regulation of photomorphogenesis
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Catalytic E3 that ubiquitinates HY5 (and HFR1, LAF1) in darkness.
            evidence:
              - source_id: PMID:14597662
                statement: COP1 ubiquitinates HY5 in vitro, and SPA1 alters this activity.
                supporting_text: >-
                  We further demonstrate the E3 ubiquitin ligase activity of COP1 on HY5 in vitro and
                  the alteration of that activity by SPA1
          - id: spa1_cop1_activator
            label: SPA1 COP1-activating subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SPA1
                term:
                  id: UniProtKB:Q9SYX2
                  label: Protein SUPPRESSOR OF PHYA-105 1 (EC 2.7.-.-)
            function:
              preferred_term: ubiquitin-protein transferase activator activity
              term:
                id: GO:0097027
                label: ubiquitin-protein transferase activator activity
            processes:
              - preferred_term: negative regulation of photomorphogenesis
                term:
                  id: GO:0010100
                  label: negative regulation of photomorphogenesis
            locations:
              - preferred_term: nuclear body
                term:
                  id: GO:0016604
                  label: nuclear body
            role_description: Coiled-coil partner of COP1 that stimulates COP1 E3 activity; the target
              through which Pfr phyA/phyB (and CRY1/CRY2) inactivate the ligase.
            evidence:
              - source_id: PMID:12827204
                statement: SPA1 stimulates COP1 E3 activity toward LAF1.
                supporting_text: >-
                  SPA1 stimulates the E3 activity of residual nuclear COP1 to ubiquitinate LAF1
              - source_id: PMID:20061554
                statement: COP1-SPA complexes associate with CUL4-DDB1.
                supporting_text: >-
                  a series of CUL4-DDB1-COP1-SPA E3 ligase complexes may mediate the repression of
                  photomorphogenesis
    - order: 4
      role: photomorphogenic transcriptional output
      node:
        id: hy5_photomorphogenic_output
        label: HY5-driven photomorphogenic gene expression
        module_type: REGULATORY_STEP
        description: >-
          With COP1-SPA inactive, the bZIP transcription factor HY5 accumulates and binds
          light-responsive promoters to promote photomorphogenic gene expression. Together
          with the loss of PIF activity this produces de-etiolation.
        annotons:
          - id: hy5_transcription_factor
            label: HY5 bZIP transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HY5
                term:
                  id: UniProtKB:O24646
                  label: Transcription factor HY5 (Protein LONG HYPOCOTYL 5) (bZIP transcription factor
                    56) (AtbZIP56)
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: photomorphogenesis
                term:
                  id: GO:0009640
                  label: photomorphogenesis
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Positive regulator of photomorphogenesis; COP1-SPA substrate stabilized
              in light and in cop1/spa/pif mutants.
            evidence:
              - source_id: PMID:24858936
                statement: HY5 is stabilized when COP1-SPA or PIFs are lost, and hy5 suppresses pifq.
                supporting_text: >-
                  the hy5 mutant suppresses the constitutive photomorphogenic phenotypes of the pifq
                  mutant in the dark
    - order: 5
      role: converging blue-light cryptochrome input (context)
      node:
        id: cryptochrome_input
        label: Cryptochrome inhibition of COP1-SPA (context)
        module_type: REGULATORY_STEP
        description: >-
          Context only. Photoexcited CRY1 binds SPA1 in blue light and suppresses the
          SPA1-COP1 interaction. This blue-light input converges on the same COP1-SPA node as
          the phytochromes but is not part of the red/far-red core.
        annotons:
          - id: cry1_blue_light_photoreceptor
            label: CRY1 blue light photoreceptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CRY1
                term:
                  id: UniProtKB:Q43125
                  label: Cryptochrome-1 (AtCry) (Atcry1) (Blue light photoreceptor) (Protein BLUE LIGHT
                    UNINHIBITED 1) (Protein ELONGATED HYPOCOTYL 4) (Protein OUT OF PHASE 2) (OOP2)
            function:
              preferred_term: blue light photoreceptor activity
              term:
                id: GO:0009882
                label: blue light photoreceptor activity
            role_description: Blue-light receptor whose interaction with SPA1 suppresses COP1 activity.
            evidence:
              - source_id: PMID:21511871
                statement: CRY1-SPA1 interaction suppresses SPA1-COP1 interaction and HY5 degradation.
                supporting_text: >-
                  the CRY1-SPA1 interaction suppresses the SPA1-COP1 interaction and COP1-dependent
                  degradation of the transcription factor HY5
  connections:
    - source: phytochrome_photoperception
      target: pif_repressors
      connection_type: NEGATIVELY_REGULATES
      description: Pfr phytochromes bind PIFs and induce their phosphorylation and proteasomal
        degradation.
    - source: phytochrome_photoperception
      target: cop1_spa_ligase
      connection_type: NEGATIVELY_REGULATES
      description: Pfr phyA and phyB bind SPA proteins and disrupt COP1-SPA, inactivating the ligase.
    - source: cop1_spa_ligase
      target: hy5_photomorphogenic_output
      connection_type: NEGATIVELY_REGULATES
      description: COP1-SPA ubiquitinates HY5 for degradation in darkness.
    - source: pif_repressors
      target: cop1_spa_ligase
      connection_type: POSITIVELY_REGULATES
      description: In darkness PIF1 enhances COP1 substrate recruitment and E3 activity.
    - source: cop1_spa_ligase
      target: pif_repressors
      connection_type: NEGATIVELY_REGULATES
      description: In light, CUL4-COP1-SPA ubiquitinates phosphorylated PIF1 for degradation, so the
