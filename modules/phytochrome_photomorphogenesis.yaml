          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: phytochrome photoperception
      node:
        id: phytochrome_photoperception
        label: Phytochrome photoperception and nuclear photobody formation
        module_type: REGULATORY_STEP
        description: >-
          Red light converts phyB, and far-red or very low fluence light converts phyA, to the
          active Pfr form. Pfr enters the nucleus (phyA through FHY1/FHL) and accumulates in
          nuclear bodies (photobodies), where it binds PIFs and SPA proteins.
        annotons:
          - id: phyb_red_light_photoreceptor
            label: phyB red light photoreceptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PHYB
                term:
                  id: UniProtKB:P14713
                  label: Phytochrome B (Protein LONG HYPOCOTYL 3) (Protein OUT OF PHASE 1)
            function:
              preferred_term: red or far-red light photoreceptor activity
              term:
                id: GO:0009883
                label: red or far-red light photoreceptor activity
            processes:
              - preferred_term: red or far-red light signaling pathway
                term:
                  id: GO:0010017
                  label: red or far-red light signaling pathway
            locations:
              - preferred_term: nuclear body
                term:
                  id: GO:0016604
                  label: nuclear body
            role_description: Dominant photoreceptor in continuous red light; Pfr phyB binds PIFs
              and SPA1, promoting PIF degradation and COP1-SPA1 dissociation.
            evidence:
              - source_id: PMID:25744387
                statement: Photoactivated phyB represses COP1-SPA1 association via red-light-dependent
                  binding to SPA1.
                supporting_text: >-
                  the photoactivated phyB represses the association of SPA1 with COP1, which is mediated,
                  at least in part, through red-light-dependent interaction of phyB with SPA1
          - id: phya_far_red_light_photoreceptor
            label: phyA far-red light photoreceptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PHYA
                term:
                  id: UniProtKB:P14712
                  label: Phytochrome A (Protein ELONGATED HYPOCOTYL 8) (Protein FAR RED ELONGATED 1)
                    (Protein FAR RED ELONGATED HYPOCOTYL 2)
            function:
              preferred_term: far-red light photoreceptor activity
              term:
                id: GO:0031516
                label: far-red light photoreceptor activity
            processes:
              - preferred_term: far-red light signaling pathway
                term:
                  id: GO:0010018
                  label: far-red light signaling pathway
            locations:
              - preferred_term: nuclear body
                term:
                  id: GO:0016604
                  label: nuclear body
            role_description: Type I photoreceptor for continuous far-red (high-irradiance) and very
              low fluence responses; Pfr phyA binds PIF1/PIF3 and SPA proteins and dominates early
              PIF1 degradation.
            evidence:
              - source_id: PMID:18539749
