id: MODULE:phytochrome_photomorphogenesis
title: Phytochrome control of photomorphogenesis (phyA/phyB - PIF - COP1/SPA - HY5)
description: >-
  Red and far-red light control seedling de-etiolation and growth in Arabidopsis
  thaliana through the phytochrome photoreceptors. In darkness two repressor systems
  keep seedlings etiolated: the PIF bHLH transcription factors (PIF1, PIF3, PIF4 and
  relatives) promote skotomorphogenic growth and repress chlorophyll biosynthesis and
  germination, and the nuclear CUL4-DDB1-COP1-SPA E3 ubiquitin ligase targets
  photomorphogenesis-promoting transcription factors such as HY5 for proteasomal
  degradation. Light converts phytochromes to the active Pfr form, phyB mainly under
  red light and phyA under far-red light. Pfr phytochromes enter the nucleus and form
  photobodies, where they act on both repressor systems. (1) They bind PIFs through APB
  and APA motifs. This triggers rapid PIF phosphorylation, with SPA1 kinase activity
  contributing in a phyB-PIF1-SPA1 complex, followed by ubiquitination and proteasomal
  degradation; PIF1 is turned over through the CUL4-COP1-SPA ligase. (2) They bind SPA
  proteins and disrupt the COP1-SPA interaction, which inactivates the ligase. HY5
  then accumulates and, with the loss of PIF activity, drives photomorphogenic gene
  expression: hypocotyl growth inhibition, cotyledon expansion and greening. In
  darkness PIF1 also enhances COP1 E3 activity, so the two repressor systems act
  synergistically. Blue-light cryptochromes (CRY1) inhibit the same COP1-SPA node and
  are included only as a converging input. UVR8, PIF-independent phyB outputs,
  thermomorphogenesis (PIF4-temperature), photoperiodic flowering (COP1-SPA-CO) and
  hormone crosstalk are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:25744387
    title: Red-light-dependent interaction of phyB with SPA1 promotes COP1-SPA1 dissociation and
      photomorphogenic development in Arabidopsis.
    statement: Phytochromes promote photomorphogenesis through two arms, PIF degradation and
      suppression of COP1.
    supporting_text: >-
      Phytochromes promote photomorphogenic developments upon light irradiation via a signaling
      pathway that involves rapid degradation of PIFs (PHYTOCHROME INTERACTING FACTORS) and
      suppression of COP1 (CONSTITUTIVE PHOTOMORPHOGENIC 1) nuclear accumulation
  - source_id: PMID:25627066
    title: Light-activated phytochrome A and B interact with members of the SPA family to promote
      photomorphogenesis in Arabidopsis by reorganizing the COP1/SPA complex.
    statement: Light-activated phyA and phyB bind SPA proteins in nuclear bodies and disrupt the
      COP1-SPA interaction.
    supporting_text: >-
      light-activated phyA and phyB disrupt the interaction between COP1 and SPAs, resulting in
      reorganization of the COP1/SPA complex in planta
  - source_id: PMID:24858936
    title: PHYTOCHROME INTERACTING FACTOR1 Enhances the E3 Ligase Activity of CONSTITUTIVE
      PHOTOMORPHOGENIC1 to Synergistically Repress Photomorphogenesis in Arabidopsis.
    statement: PIFs and COP1-SPA synergistically repress photomorphogenesis in darkness, with HY5 as
      the shared output.
    supporting_text: >-
      In response to light, the phytochrome family of sensory photoreceptors simultaneously
      inactivates COP1-SPA complexes and induces the rapid degradation of PIFs to promote
      photomorphogenesis
  - source_id: PMID:23708772
    title: Phytochrome-interacting factors have both shared and distinct biological roles.
    statement: Light-activated phytochromes enter the nucleus and promote PIF degradation.
    supporting_text: >-
      Their activities are post-translationally countered by light-activated phytochromes, which
      promote the degradation of PIFs
notes: >-
  Concrete Arabidopsis instance. Gene reviews owned in this curation batch are SPA1, PIF1
  and PHYA; PHYB, PIF3, PIF4, COP1, HY5 and CRY1 reviews were read but not edited.
  Annoton functions follow each gene review's core_functions. SPA1 has two annotons
  because it has two separable roles: COP1 activator in the ligase node and PIF1 kinase
  in the PIF node. PIF1 likewise has two annotons: its DNA-binding transcription factor
  activity and its COP1 cofactor activity (ubiquitin-protein transferase activator,
  PMID:24858936), which carries the PIF-to-ligase POSITIVELY_REGULATES connection. SPA1 kinase activity (PIF1, PMID:31527679; also HY5 Ser36,
  PMID:33686674) comes from one research group, and PMID:27310313 proposes a
  structural role for the kinase-like domain. HY5 phosphorylation by SPA is not
  modelled as a separate connection. CRY1 is included as a converging blue-light input on COP1-SPA and is context
  only. No PANTHER family or PTN ids are asserted, because members are grounded
  directly as UniProt gene products. gocams/index.tsv has no production GO-CAM containing
  these genes. Falcon module deep research was not run; gene-level Falcon reports for
  SPA1 and PIF1 were generated and used as retrieval support.
module:
  id: phytochrome_photomorphogenesis
  label: Phytochrome control of photomorphogenesis
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: red or far-red light signaling pathway
      term:
        id: GO:0010017
        label: red or far-red light signaling pathway
      description: Signaling initiated by red/far-red light absorption by phytochromes and
        transduced through PIF degradation and COP1-SPA inactivation.
    - preferred_term: photomorphogenesis
      term:
        id: GO:0009640
        label: photomorphogenesis
      description: Developmental output of the module (de-etiolation of seedlings).
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    cellular_components:
