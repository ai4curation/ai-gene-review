id: MODULE:dicty_jak_independent_stat_signaling
title: JAK-independent STAT signaling in Dictyostelium discoideum
description: >-
  The social amoeba Dictyostelium discoideum has four STAT-family transcription
  factors (STATa to STATd) but no Janus kinase and no kinases of the
  tyrosine-kinase group. Its STATs are instead tyrosine phosphorylated by
  tyrosine kinase-like (TKL) kinases, and they dimerize, accumulate in the
  nucleus and regulate transcription during multicellular development and
  stress. The two best-studied paralogs are wired to different inputs. STATc
  is activated by the prestalk morphogen DIF-1 and by hyperosmotic and other
  stresses. Its activating Tyr922 is phosphorylated by the TKL kinases Pyk2
  and Pyk3, which bind the STATc SH2 domain through autophosphorylated
  tyrosines. The kinase activity is largely constitutive, so the signal is set
  mainly by the tyrosine phosphatase PTP3: DIF-1 and stress induce serine
  phosphorylation of PTP3 (in part by the TKL kinase Phg2), which inhibits it
  and shifts STATc toward the phosphorylated state. Nuclear STATc activates
  stress-response genes and restricts graded expression of the prestalk gene
  ecmA. STATa is tyrosine phosphorylated on Tyr702 within seconds of
  extracellular cAMP binding the serpentine receptor cAR1, apparently without
  the G-beta subunit. The receptor-like TKL kinase DrkA phosphorylates STATa
  in vitro and is a candidate STATa kinase. STATa stays nuclear in the
  prestalk cells of the slug tip, where it represses the stalk gene ecmB and
  directly activates cudA, a transcription factor needed for culmination.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:16596165
    title: The dictyostelium kinome--analysis of the protein kinases from a simple model organism.
    statement: >-
      The Dictyostelium kinome has no JAK and no tyrosine-kinase-group kinases;
      tyrosine phosphorylation is attributed to the expanded TKL group.
    supporting_text: >-
      Dictyostelium lacks tyrosine kinase group kinases, and most tyrosine
      phosphorylation appears to be mediated by TKL kinases.
  - source_id: PMID:16596165
    title: The dictyostelium kinome--analysis of the protein kinases from a simple model organism.
    statement: Of the human dual-domain kinase families, only GCN2 is present; there is no JAK.
    supporting_text: >-
      The human kinases are in the Jak, RSK, Trio, and GCN2 families, of which
      only GCN2 (IfkA) is found in Dictyostelium.
  - source_id: PMID:16596165
    title: The dictyostelium kinome--analysis of the protein kinases from a simple model organism.
    statement: The genome encodes four STATs among its SH2-domain proteins.
    supporting_text: >-
      Dictyostelium also has 12 phosphotyrosine-binding SH2-domain proteins:
      the Shk1–5 protein kinases in the TKL group, four STATs
  - source_id: PMID:22699506
    title: >-
      Identification of the kinase that activates a nonmetazoan STAT gives
      insights into the evolution of phosphotyrosine-SH2 domain signaling.
    statement: >-
      No orthologs of animal tyrosine kinases exist in Dictyostelium; a TKL
      kinase directly activates a STAT.
    supporting_text: >-
      There are no orthologs of the animal tyrosine kinases, but there are very
      many tyrosine kinase-like kinases (TKLs)
  - source_id: PMID:24058748
    title: Comparative evolutionary genomics of the STAT family of transcription factors.
    statement: The four Dictyostelium STATs form a distinct clade, separate from animal STATs.
    supporting_text: >-
      the Dictyostelium genome encodes four STATs, dstA, dstB, dstC and dstD
  - source_id: PMID:24058787
    title: Evolution of the JAK-STAT pathway.
    statement: >-
      JAK-like proteins first appear in sponges, after the divergence of
      amoebozoa, while STAT domains are older.
    supporting_text: >-
      The first bona fide JAK-like protein is represented in the basal metazoan
      porifera lineage
  - source_id: PMID:21534947
    title: STAT signaling in Dictyostelium development.
    statement: >-
      Review of the four Dictyostelium STATs and their signaling molecules
      during development (abstract only in cache).
    supporting_text: >-
      The cellular slime mould, Dictyostelium discoideum, is the simplest
      multicellular organism using molecules homologous to STATs, Dd-STATa-d.
  - source_id: GO:0097696
    title: cell surface receptor signaling pathway via STAT
    statement: >-
      The GO pathway term for STAT signaling without JAK. Its definition names
      D. discoideum and TKL-mediated STAT activation explicitly.
  - source_id: file:modules/jak_stat_signaling.yaml
    title: Canonical JAK-STAT cytokine signaling pathway module
    statement: >-
      The canonical, taxon-neutral receptor-JAK-STAT module that this module is
      explicitly contrasted with.
  - source_id: file:modules/c_elegans_jak_independent_stat_signaling.yaml
    title: JAK-independent STAT signaling in Caenorhabditis elegans
    statement: >-
      Sister module for the other JAK-less lineage in the repository; same
      structure (paralog variants, each with input and STAT parts).
  - source_id: file:genes/DICDI/statA/statA-ai-review.yaml
    title: statA gene review
    statement: >-
      Completed review. Core functions are GO:0000981 with repression of stalk
      genes, and GO:0097696; the IBA GO:0007259 is modified to GO:0097696.
  - source_id: file:genes/DICDI/statC/statC-ai-review.yaml
    title: statC gene review
    statement: >-
      Completed review. Core functions are GO:0000981 and GO:1990782 protein
      tyrosine kinase binding (Pyk2/Pyk3); the IBA GO:0007259 is modified.
  - source_id: file:interpro/panther/PTHR11801/PTHR11801-review.yaml
    title: STAT family (PTHR11801) review
    statement: >-
      Places STATa/STATb in SF65, STATc in SF50 and STATd in the default SF43.
      Rates the JAK-STAT IBD on PTN000927860 as too deep for Dictyostelium.
  - source_id: file:projects/TAXON_PATHWAY_VARIANCE.md
    title: Taxon Pathway Variance, case study 2
    statement: >-
      Documents STAT signaling without JAK in Dictyostelium and the proposed
      taxon constraint TPV-003 with its GO:0007260 re-parenting prerequisite.
notes: >-
  Boundary. This is a concrete D. discoideum module. Its theme is STAT
  transcription factors activated without JAK kinases. It has two
  paralog-specific pathway variants that coexist in the same organism
  (selection ONE_OR_MORE) but differ in input, cell type and kinase. Each
  variant has an upstream-input part and a STAT transcriptional-control part.
  The STATc variant is the best evidenced. Its kinases (Pyk2, Pyk3) are
  established by null mutants, a double mutant, in vitro phosphorylation of
  Tyr922 and co-immunoprecipitation, and its phosphatase arm (PTP3, Phg2) by
  substrate trapping, overexpression and phosphosite mapping. The STATa
  variant has a well-established receptor input (cAR1) and transcriptional
  output (ecmB repression, cudA activation). Its kinase is less certain: DrkA
  rests on overexpression and in vitro phosphorylation, with no loss-of-function
  test. STATb and STATd are not modeled as variants. STATb is constitutively
  nuclear, has an SH2 domain lacking the phosphotyrosine-binding arginine,
  keeps its behaviour when the predicted phosphotyrosine is mutated, and has
  no known input (PMID:14701681), so it has no input part to model. STATd
  (dstD, UniProtKB:Q86I20, unreviewed) has no functional characterization in
  the cached literature.

  Relation to MODULE:jak_stat_signaling. That module is a taxon-neutral
  receptor-JAK-STAT trunk: cytokine-receptor engagement, JAK
  trans-activation, receptor phosphotyrosine docking sites, STAT recruitment
  and tyrosine phosphorylation by JAK, dimerization and nuclear import, then
  GAS/ISRE transcription, with SOCS, phosphatase and PIAS feedback. Here the
  STAT end of that trunk is conserved: tyrosine phosphorylation of a
  C-terminal tyrosine, SH2-phosphotyrosine dimerization (shown in the STATa
  crystal structure), nuclear accumulation and binding to promoter elements
  (STATa binds a mammalian ISRE). The upstream end is not. There is no JAK and
  no receptor-docked kinase. For STATc the receptor for DIF-1 is unknown and
  stress is sensed through F-actin remodelling. The kinase is a TKL that the
  STAT SH2 domain binds directly through the kinase's own autophosphorylated
  tyrosines, not through a phosphorylated receptor tail. The kinase is largely
  constitutive, and the signal is gated by inhibiting a tyrosine phosphatase
  (PTP3) by serine phosphorylation. In the canonical module phosphatases only
  terminate signaling. Pyk3 does carry a pseudokinase domain N-terminal to its
  kinase domain that inhibits the kinase domain, as JAK JH2 does, which is
  convergent architecture, not JAK homology. For STATa the receptor is a
  G-protein-coupled cAMP receptor, and its signal to STATa does not need the
  G-beta subunit. This module therefore does not conform to the
  jak_stat_signaling template. It is a lineage-specific wiring around a
  conserved STAT core, as in the C. elegans module
  (MODULE:c_elegans_jak_independent_stat_signaling), but the two lineages
  differ: Dictyostelium STATs keep phosphotyrosine-SH2 activation and are
  activated by TKL kinases, whereas STA-2 in the worm has lost the
  phosphotyrosine motif.

  GO terms. The pathway term is GO:0097696 cell surface receptor signaling
  pathway via STAT, whose definition names D. discoideum and TKL kinases.
  GO:0007259 (via JAK-STAT) is deliberately absent; the statA and statC
  reviews modify the inherited IBA to GO:0097696. GO:0007260 tyrosine
  phosphorylation of STAT protein describes the Pyk2/Pyk3 and DrkA step
  exactly, but it is currently part_of GO:0007259. Asserting it here would
  imply JAK-STAT signaling by inference. The kinase annotons therefore carry
  GO:0097696 and give GO:0007260 only in text. The same part_of link is why
  the proposed only_in_taxon Metazoa constraint on GO:0007259 (TPV-003 in
  projects/TAXON_PATHWAY_VARIANCE.md) needs GO:0007260 re-parented under
  GO:0097696 first; Pyk2 phosphorylating STATc on Tyr922 without a JAK
  (PMID:22699506) is the counterexample. The case is written up for GO and
  PAINT curators in the public cross-gene briefing JAK-STAT Without JAK
  (https://claude.ai/artifact/4MLfbbbWWnLchDvspwdPuM).

  Relation to other Dictyostelium modules. MODULE:dicty_dif1_response_prestalk_patterning
  models the DIF-1 response through the bZIP factors DimA and DimB and their
  outputs ecmA and ecmB. STATc is a second, parallel DIF-1 effector. It is not
  included there and is modeled here only. The two modules share an output:
  STATc restricts graded ecmA expression among prestalk cells, while DimA/DimB
  induce it. DIF-1 production is in MODULE:dicty_dif1_biosynthesis.
  MODULE:dicty_extracellular_camp_relay models the cAR1-Galpha2-CRAC-ACA
  aggregation oscillator. cAR1 (UniProtKB:P13773) is reused here as the input
  to STATa, but in a different context: at the mound and slug stage, and
  independently of G-beta, whereas the relay depends on heterotrimeric G
  proteins. ACA is not modeled here. Its tip-restricted expression directs the
  tip-specific nuclear accumulation of STATa (PMID:11356026), so the relay
  supplies the cAMP that the STATa variant reads. The
  dif1_response module explicitly leaves the STATa-CudA culmination circuit
  out; that circuit is the STATa variant here.

  Other modulators kept as context. CblA, a Cbl homologue, promotes
  DIF-1-induced STATc tyrosine phosphorylation by downregulating PTP3
  (PMID:18840649). Cytoskeletal perturbation (latrunculin A, cytochalasin A)
  induces PTP3 S747 phosphorylation and STATc activation (PMID:22365144).
  cGMP (via GbpC) and Ca2+ are proposed parallel second messengers acting on
  the kinase and phosphatase arms, respectively (PMID:20159963). The PIAS
  homologue Dd-PIAS has a genetic and expression-pattern link to STATa
  (PMID:21933174); it is raised as a knowledge gap, not modeled.

  Family context. All four STATs are PANTHER PTHR11801 members. STATa, STATb
  and STATc (dictyBase DDB_G0281381, DDB_G0268638, DDB_G0293532) are seeds of
  the family-root PAINT node PTN000210448 (nucleus, cytoplasm) in
  interpro/panther/PTHR11801/PTHR11801-paint.tsv. Concrete GENE_PRODUCT
  selectors are used instead of family descriptors because the module is
  species-scoped.
module:
  id: dicty_jak_independent_stat_signaling
  label: JAK-independent STAT signaling in D. discoideum
  module_type: SIGNALING_PATHWAY
  description: >-
    Two STAT paralog-specific signaling pathways that operate without JAK
    kinases: a STATc pathway responding to DIF-1 and hyperosmotic stress,
    gated by TKL kinases and the PTP3 phosphatase, and a STATa pathway
    responding to extracellular cAMP through cAR1 in prestalk tip cells.
  concepts:
    - preferred_term: cell surface receptor signaling pathway via STAT
      term:
        id: GO:0097696
        label: cell surface receptor signaling pathway via STAT
      description: >-
        Shared process of both variants: STAT activation by kinases other than
        JAK, dimerization, nuclear accumulation and regulation of target genes.
  context:
    taxa:
      - preferred_term: Dictyostelium discoideum
        term:
          id: NCBITaxon:44689
          label: Dictyostelium discoideum
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
        description: Latent STATs and their activating kinases.
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
        description: Activated STATs.
  variant_sets:
    - id: stat_paralog_pathways
      label: STAT paralog-specific JAK-independent pathways
      axis: STAT paralog, upstream input and activating kinase
      selection: ONE_OR_MORE
      notes: >-
        The two variants coexist in the same organism and are not alternatives
        for one step. They are grouped because each uses a STAT without a JAK.
        They differ in input (DIF-1 and stress vs extracellular cAMP via
        cAR1), kinase (Pyk2/Pyk3 vs candidate DrkA), regulatory logic
        (phosphatase gating vs receptor-triggered phosphorylation) and
        principal cell type (pstO and stressed cells vs the pstA tip).
      variants:
        - id: statc_dif_stress
          label: STATc DIF-1 and hyperosmotic stress pathway
          module_type: SIGNALING_PATHWAY
          description: >-
            STATc is tyrosine phosphorylated on Tyr922 by the TKL kinases Pyk2
            and Pyk3 and dephosphorylated by PTP3. The kinases are largely
            constitutive. DIF-1 and hyperosmotic stress inhibit PTP3 by serine
            phosphorylation (S448 and S747), so phosphorylated STATc builds up,
            dimerizes and accumulates in the nucleus by reduced
            CRM1-dependent export. Nuclear STATc activates stress genes such
            as rtoA and gapA, about 20% of the hyperosmotic transcriptional
            response, and represses ecmA in parts of the prestalk zone.
          concepts:
            - preferred_term: response to differentiation-inducing factor 1
              term:
                id: GO:1903013
                label: response to differentiation-inducing factor 1
            - preferred_term: hyperosmotic response
              term:
                id: GO:0006972
                label: hyperosmotic response
          context:
            conditions:
              - preferred_term: DIF-1 exposure
              - preferred_term: hyperosmotic stress (sorbitol)
                description: Heat shock and oxidative stress also activate STATc (PMID:12771188).
          evidence:
            - source_id: PMID:18305004
              title: >-
                Evidence that DIF-1 and hyper-osmotic stress activate a
                Dictyostelium STAT by inhibiting a specific protein tyrosine
                phosphatase.
              statement: >-
                STATc activation is set by inhibiting its tyrosine phosphatase
                PTP3, not by activating a kinase.
              supporting_text: >-
                These observations suggest a novel mode of STAT activation,
                whereby serine-threonine phosphorylation of a cognate protein
                tyrosine phosphatase results in the inhibition of its activity,
                shifting the phosphorylation-dephosphorylation equilibrium in
                favour of phosphorylation.
            - source_id: PMID:22365144
              title: Perturbations of the actin cytoskeleton activate a Dictyostelium STAT signalling pathway.
              statement: DIF-1 and stress converge on PTP3 S747 phosphorylation.
              supporting_text: >-
                the more highly regulated of the two PTP3 serine residues, S747,
                is also phosphorylated in response to DIF-1, suggesting a common
                activation mechanism
          parts:
            - order: 1
              role: TKL tyrosine kinase input that phosphorylates STATc
              node:
                id: statc_tkl_kinases
                label: Pyk2 and Pyk3 phosphorylate STATc Tyr922
                module_type: REGULATORY_STEP
                description: >-
                  Two tyrosine-specific TKL kinases act redundantly. Each single
                  null mutant is only partly impaired in stress-induced STATc
                  activation, and the double mutant cannot activate STATc. Both
                  autophosphorylate on tyrosine; the STATc SH2 domain binds
                  these sites, and the kinase then phosphorylates STATc Tyr922.
                  This is the step that GO:0007260 tyrosine phosphorylation of
                  STAT protein describes; that term is not asserted because it
                  is currently part_of GO:0007259 (see notes).
                annotons:
                  - id: pyk2_kinase
                    label: Pyk2 STATc tyrosine kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Pyk2
                        term:
                          id: UniProtKB:P18161
                          label: Dual specificity protein kinase splB
                    function:
                      preferred_term: protein tyrosine kinase activity
                      term:
                        id: GO:0004713
                        label: protein tyrosine kinase activity
                      targets:
                        - preferred_term: STATc Tyr922
                    processes:
                      - preferred_term: cell surface receptor signaling pathway via STAT
                        term:
                          id: GO:0097696
                          label: cell surface receptor signaling pathway via STAT
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                        description: Concentrates in cytoplasmic granules with PTP3 after osmotic stress.
                    role_description: >-
                      Constitutively active STATc kinase; required for
                      DIF-1-induced STATc activation and, with Pyk3, for
                      stress-induced activation.
                    evidence:
                      - source_id: PMID:22699506
                        title: >-
                          Identification of the kinase that activates a
                          nonmetazoan STAT gives insights into the evolution of
                          phosphotyrosine-SH2 domain signaling.
                        statement: >-
                          Pyk2 is required for DIF-1-induced STATc activation and
                          phosphorylates STATc Tyr922 in vitro.
                        supporting_text: >-
                          We show that in a null mutant for Pyk2, a
                          tyrosine-specific TKL, exposure to DIF-1 does not
                          activate STATc.
                      - source_id: PMID:22699506
                        title: >-
                          Identification of the kinase that activates a
                          nonmetazoan STAT gives insights into the evolution of
                          phosphotyrosine-SH2 domain signaling.
                        statement: Direct phosphorylation and complex formation.
                        supporting_text: >-
                          Pyk2 phosphorylates STATc on Tyr922 in vitro and
                          complexes with STATc both in vitro and in vivo.
                      - source_id: PMID:22699506
                        title: >-
                          Identification of the kinase that activates a
                          nonmetazoan STAT gives insights into the evolution of
                          phosphotyrosine-SH2 domain signaling.
                        statement: The STATc SH2 domain docks on Pyk2 autophosphorylation sites.
                        supporting_text: >-
                          the STATc-Pyk2 complex is formed constitutively by an
                          interaction between the STATc SH2 domain and
                          phosphotyrosine residues on Pyk2 that are generated by
                          autophosphorylation
                      - source_id: PMID:25143406
                        title: >-
                          Two Dictyostelium tyrosine kinase-like kinases function
                          in parallel, stress-induced STAT activation pathways.
                        statement: Pyk2 relocalizes to cytoplasmic granules with PTP3 under stress.
                        supporting_text: >-
                          Before sorbitol treatment, Pyk2 is localized
                          predominantly in the cytosol, but after treatment, it
                          becomes concentrated in cytoplasmic granules.
                  - id: pyk3_kinase
                    label: Pyk3 STATc tyrosine kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Pyk3
                        term:
                          id: UniProtKB:Q54I36
                          label: Dual specificity protein kinase pyk3
                    function:
                      preferred_term: protein tyrosine kinase activity
                      term:
                        id: GO:0004713
                        label: protein tyrosine kinase activity
                      targets:
                        - preferred_term: STATc Tyr922
                    processes:
                      - preferred_term: cell surface receptor signaling pathway via STAT
                        term:
                          id: GO:0097696
                          label: cell surface receptor signaling pathway via STAT
                    locations:
                      - preferred_term: cell cortex
                        term:
                          id: GO:0005938
                          label: cell cortex
                        description: Moves from the cytosol to the cortex after osmotic stress.
                    role_description: >-
                      Second, partly redundant STATc kinase in the stress
                      response. Its N-terminal pseudokinase domain inhibits its
                      kinase domain, as JAK JH2 does.
                    evidence:
                      - source_id: PMID:25143406
                        title: >-
                          Two Dictyostelium tyrosine kinase-like kinases function
                          in parallel, stress-induced STAT activation pathways.
                        statement: Pyk2 and Pyk3 are redundant STATc kinases under stress.
                        supporting_text: >-
                          for stress-induced STATc activation, single null
                          mutants are only marginally impaired, but the double
                          mutant is nonactivatable
                      - source_id: PMID:25143406
                        title: >-
                          Two Dictyostelium tyrosine kinase-like kinases function
                          in parallel, stress-induced STAT activation pathways.
                        statement: Autophosphorylated sites recruit the STATc SH2 domain.
                        supporting_text: >-
                          The site(s) that are generated bind the SH2 domain of
                          STATc, and then STATc becomes the target of further
                          kinase action.
                      - source_id: PMID:25143406
                        title: >-
                          Two Dictyostelium tyrosine kinase-like kinases function
                          in parallel, stress-induced STAT activation pathways.
                        statement: The Pyk3 pseudokinase domain is a JH2-like negative regulator.
                        supporting_text: >-
                          Pyk3 contains both a TKL domain and a pseudokinase
                          domain. The latter functions, like the JH2 domain of
                          metazoan JAKs, as a negative regulator of the kinase
                          domain.
                      - source_id: PMID:24587195
                        title: >-
                          Identification of the protein kinases Pyk3 and Phg2 as
                          regulators of the STATc-mediated response to
                          hyperosmolarity.
                        statement: Pyk3 loss reduces phospho-STATc and STATc target induction.
                        supporting_text: >-
                          phospho-STATc levels were significantly reduced in
                          pyk3(-) and phg2(-) cells
            - order: 2
              role: tyrosine phosphatase gate that sets STATc activation
              node:
                id: statc_ptp3_gate
                label: PTP3 dephosphorylates STATc and is inhibited by serine phosphorylation
                module_type: REGULATORY_STEP
                description: >-
                  PTP3 binds and dephosphorylates STATc. DIF-1 and stress
                  induce phosphorylation of PTP3 on S448 and S747, which reduces
                  its activity. Phg2 is needed for S747 phosphorylation and
                  binds PTP3; the S448 kinase is unknown. Inhibiting PTP3 is
                  the main regulated step in STATc activation.
                annotons:
                  - id: ptp3_phosphatase
                    label: PTP3 STATc phosphotyrosine phosphatase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PTP3
                        term:
                          id: UniProtKB:P54637
                          label: Tyrosine-protein phosphatase 3
                    function:
                      preferred_term: protein tyrosine phosphatase activity
                      term:
                        id: GO:0004725
                        label: protein tyrosine phosphatase activity
                      targets:
                        - preferred_term: STATc phospho-Tyr922
                    processes:
                      - preferred_term: negative regulation of receptor signaling pathway via STAT
                        term:
                          id: GO:1904893
                          label: negative regulation of receptor signaling pathway via STAT
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Keeps STATc dephosphorylated in unstimulated cells.
                      Inhibition of PTP3 by serine phosphorylation activates
                      STATc.
                    evidence:
                      - source_id: PMID:18305004
                        title: >-
                          Evidence that DIF-1 and hyper-osmotic stress activate
                          a Dictyostelium STAT by inhibiting a specific protein
                          tyrosine phosphatase.
                        statement: >-
                          PTP3 binds STATc directly; overexpressing PTP3 blocks
                          STATc activation, and inhibiting it activates STATc.
                        supporting_text: >-
                          We show that the protein tyrosine phosphatase PTP3
                          interacts directly with STATc and that STATc is
                          refractory to activation in PTP3 overexpressing cells.
                      - source_id: PMID:18305004
                        title: >-
                          Evidence that DIF-1 and hyper-osmotic stress activate
                          a Dictyostelium STAT by inhibiting a specific protein
                          tyrosine phosphatase.
                        statement: A dominant PTP3 inhibitor causes constitutive STATc activation.
                        supporting_text: >-
                          overexpression of a dominant inhibitor of PTP3 leads to
                          constitutive tyrosine phosphorylation and ectopic
                          nuclear localisation of STATc
                      - source_id: PMID:20159963
                        title: Dual regulation of a Dictyostelium STAT by cGMP and Ca2+ signalling.
                        statement: PTP3 S448 and S747 are phosphorylated rapidly after osmotic stress.
                        supporting_text: >-
                          We show that two serine residues in PTP3, S448 and
                          S747, are rapidly phosphorylated after osmotic stress.
                  - id: phg2_ptp3_kinase
                    label: Phg2 inhibitory kinase for PTP3
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Phg2
                        term:
                          id: UniProtKB:Q54QQ1
                          label: Serine/threonine-protein kinase phg2
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                      targets:
                        - preferred_term: PTP3 Ser747
                    processes:
                      - preferred_term: positive regulation of receptor signaling pathway via STAT
                        term:
                          id: GO:1904894
                          label: positive regulation of receptor signaling pathway via STAT
                    role_description: >-
                      Serine/threonine TKL kinase needed for PTP3 S747
                      phosphorylation under hyperosmotic stress. It binds PTP3
                      in pull-downs and is proposed to phosphorylate it
                      directly.
                    evidence:
                      - source_id: PMID:24587195
                        title: >-
                          Identification of the protein kinases Pyk3 and Phg2 as
                          regulators of the STATc-mediated response to
                          hyperosmolarity.
                        statement: Phg2 is needed for PTP3 S747 phosphorylation and binds PTP3.
                        supporting_text: >-
                          In pull-down assays Phg2 and PTP3 interact directly,
