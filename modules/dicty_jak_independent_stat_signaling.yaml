        - id: stata_camp_tip
          label: STATa extracellular cAMP and cAR1 pathway in the prestalk tip
          module_type: SIGNALING_PATHWAY
          description: >-
            From the mound stage onward, extracellular cAMP acting through the
            serpentine receptor cAR1 induces STATa tyrosine phosphorylation on
            Tyr702 within seconds, and STATa enters the nucleus. The response
            does not need the only G-beta subunit. Nuclear STATa is later kept
            only in the prestalk cells of the slug tip (the organizer), where
            the tip-restricted adenylyl cyclase ACA supplies cAMP. GskA
            serine-phosphorylates STATa and promotes its nuclear export. In the
            nucleus STATa represses the stalk gene ecmB and directly activates
            the cudA gene, whose product is needed for culmination.
          concepts:
            - preferred_term: culmination involved in sorocarp development
              term:
                id: GO:0031154
                label: culmination involved in sorocarp development
            - preferred_term: sorocarp stalk cell differentiation
              term:
                id: GO:0031149
                label: sorocarp stalk cell differentiation
              description: STATa regulates commitment to stalk differentiation as a repressor of ecmB.
          context:
            conditions:
              - preferred_term: mound and slug stage of multicellular development
                description: >-
                  STATa is not tyrosine phosphorylated before late aggregation;
                  nuclear STATa is later restricted to prestalk tip cells.
          evidence:
            - source_id: PMID:9670017
              title: >-
                Developmentally and spatially regulated activation of a
                Dictyostelium STAT protein by a serpentine receptor.
              statement: >-
                cAMP through cAR1 induces rapid STATa tyrosine phosphorylation
                and nuclear entry, independently of G-beta.
              supporting_text: >-
                The tyrosine phosphorylation and nuclear localization of Dd-STAT
                are induced very rapidly by extracellular cAMP through the
                serpentine cAMP receptor cAR1
            - source_id: PMID:9670017
              title: >-
                Developmentally and spatially regulated activation of a
                Dictyostelium STAT protein by a serpentine receptor.
              statement: Nuclear STATa is maintained in prestalk tip cells.
              supporting_text: >-
                Nuclear enrichment of Dd-STAT is selectively maintained within
                the sub-population of prestalk cells that form the tip, the
                organizing center of the slug
            - source_id: PMID:11356026
              title: >-
                Adenylyl cyclase A expression is tip-specific in Dictyostelium
                slugs and directs StatA nuclear translocation and CudA gene
