knowledge_gaps:
  - gap_statement: >-
      The receptor for DIF-1 and the stress sensor upstream of STATc are
      unknown, as is how Pyk2 and Pyk3 autophosphorylation increases under
      stress.
    boundary: >-
      DIF-1 and stress converge on PTP3 S747 phosphorylation and F-actin
      remodelling. cGMP (via GbpC) is proposed to act on the kinase arm and
      Ca2+ on the phosphatase arm, from pharmacology and mutants. The S448
      kinase of PTP3 is unidentified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Without a receptor, the STATc variant fits GO:0097696 only through its
      STAT core; whether DIF-1 acts at the cell surface is unresolved.
    resolution: >-
      Identify DIF-1-binding proteins; map the S448 kinase; test Pyk2/Pyk3
      autophosphorylation in gbpC and Ca2+-signalling mutants.
    provenance:
      - reference_id: PMID:20159963
        supporting_text: >-
          We propose that stress-induced cGMP signalling exerts its stimulatory
          effect by potentiating the activity of a semi-constitutive tyrosine
          kinase that phosphorylates STATc
        reference_section_type: ABSTRACT
  - gap_statement: >-
      The sign of Pyk3 action on STATc is disputed: one study reports
      prolonged DIF-1-induced STATc phosphorylation in pyk3 nulls, while later
      studies find reduced activation.
    boundary: >-
      The negative result was in an Ax3 background; the positive results were
      in Ax2, and the authors suggest strain dependence.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether Pyk3 is an activating kinase in all contexts or also a negative regulator in development.
    resolution: Compare pyk3 nulls in matched Ax2 and Ax3 backgrounds during development and after DIF-1.
    provenance:
      - reference_id: PMID:18657170
        supporting_text: >-
          Dictyostelium DPYK3 negatively regulates STATc during development in
          response to DIF-1 signaling.
        reference_section_type: ABSTRACT
      - reference_id: PMID:25143406
        supporting_text: >-
          However, this may be strain dependent because we are not able to
          reproduce the observation in Ax2 cells
        reference_section_type: INTRODUCTION
  - gap_statement: >-
      The STATa kinase is not established, and how cAR1 reaches it without
      G-beta is unknown.
    boundary: >-
      DrkA evidence is overexpression and in vitro phosphorylation; drkA
      overexpression is toxic and no null-mutant STATa phosphorylation data
      are reported.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Without it the STATa variant has no grounded kinase step.
    resolution: Test STATa Tyr702 phosphorylation and nuclear accumulation in drkA null or conditional mutants after cAMP stimulation.
    provenance:
      - reference_id: PMID:31002205
        supporting_text: >-
          Although two tyrosine kinase-like (TKL) proteins, Pyk2 and Pyk3, have
          been definitively identified as STATc kinases, no kinase is known for
          STATa activation.
        reference_section_type: ABSTRACT
  - gap_statement: >-
      The inputs and activation mechanism of STATb and STATd are unknown.
    boundary: >-
      STATb is constitutively nuclear and dimeric even with its predicted
      phosphotyrosine replaced, and has a subtle growth role. STATd (dstD) has
      no characterization in the cached literature.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Two of the four Dictyostelium STATs cannot yet be placed in any pathway.
    resolution: Phenotype dstD nulls; identify STATb partners and targets.
    provenance:
      - reference_id: PMID:14701681
        supporting_text: >-
          These observations suggest a non-canonical mode of activation of
          Dd-STATb that does not rely on orthodox SH2 domain:phosphotyrosine
          interactions.
        reference_section_type: ABSTRACT
  - gap_statement: >-
      Whether Dd-PIAS directly inhibits STATa, as PIAS proteins do metazoan
      STATs, is unknown.
    boundary: >-
      The link is genetic (overexpression phenocopies statA null; STATa target
      genes are up in the pisA null) and expression-pattern based. No binding
      or SUMOylation of STATa is shown in the cached abstract.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Would be a conserved negative-regulation layer of the canonical module retained without JAK.
    resolution: Test Dd-PIAS binding to and SUMOylation of STATa, and STATa DNA binding in pisA mutants.
    provenance:
      - reference_id: PMID:21933174
        supporting_text: >-
          Our results suggest a functional interrelationship between Dd-PIAS
          and Dd-STATa that influences gene expression and development.
        reference_section_type: ABSTRACT
