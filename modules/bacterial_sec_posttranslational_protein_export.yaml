id: MODULE:bacterial_sec_posttranslational_protein_export
title: Bacterial post-translational Sec protein export
description: 'A bacterial protein-export module in which an unfolded secretory precursor carrying an N-terminal
  signal peptide is delivered to the SecA ATPase, SecA drives the precursor through the SecYEG protein-conducting
  channel of the cytoplasmic membrane, an optional SecDF accessory (two proteins in most diderm bacteria,
  one fused protein in many Firmicutes) associated with YajC uses proton motive force to improve late
  translocation, and a type I signal peptidase removes the signal peptide on the trans side. Precursor
  delivery to SecA has two routes: a SecB-dependent route, in which the dedicated holdase SecB keeps precursors
  unfolded and hands them to SecA, and a SecB-independent route, in which SecA recognizes the signal sequence
  and preprotein directly, with generic chaperones such as trigger factor or DnaK keeping the chain translocation-competent.
  SecA, SecY, SecE and the type I signal peptidase are found throughout bacteria, whereas SecB occurs
  mainly in Proteobacteria, so bacteria such as Bacillus subtilis export precursors only by the SecB-independent
  route. Cotranslational SRP targeting, YidC-dependent membrane insertion, Tat export of folded proteins,
  lipoprotein maturation, and outer-membrane secretion are neighboring modules.'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0043952
    title: protein transport by the Sec complex
    statement: Defines the biological process performed by the Sec export apparatus.
  - source_id: GO:0140309
    title: unfolded protein holdase activity
    statement: Defines SecB-mediated carriage of unfolded precursors to the translocon.
  - source_id: GO:0008564
    title: protein-exporting ATPase activity
    statement: Defines the ATP-coupled motor activity supplied independently by SecA.
  - source_id: GO:0008320
    title: protein transmembrane transporter activity
    statement: Defines the channel-level activity supplied by SecYEG with accessory support from SecDF-YajC.
  - source_id: GO:0009977
    title: proton motive force dependent protein transmembrane transporter activity
    statement: Defines the PMF-coupled collective transporter activity contributed by SecD and SecF.
  - source_id: GO:0009003
    title: signal peptidase activity
    statement: Defines the LepB signal-peptide cleavage activity.
  - source_id: GO:0016485
    title: protein processing
    statement: Defines maturation by peptide-bond cleavage, including LepB removal of a type I signal
      peptide.
  - source_id: file:genes/ECOLI/SecB/SecB-ai-review.yaml
    title: ECOLI SecB gene review
    statement: SecB is curated as the ATP-independent cytosolic holdase/carrier that keeps export precursors
      unfolded and hands them to SecA.
  - source_id: file:genes/ECOLI/SecA/SecA-ai-review.yaml
    title: ECOLI SecA gene review
    statement: SecA is curated as both the preprotein-binding receptor and the protein-exporting ATPase
      motor that powers precursor movement into SecYEG.
  - source_id: file:genes/ECOLI/SecY/SecY-ai-review.yaml
    title: ECOLI SecY gene review
    statement: SecY is curated as the pore-forming, signal-sequence-binding subunit that independently
      supplies the SecYEG protein-conducting channel activity.
  - source_id: file:genes/ECOLI/SecE/SecE-ai-review.yaml
    title: ECOLI SecE gene review
    statement: SecE is curated as the essential clamp/stabilizing subunit that contributes to SecYEG transporter
      activity without forming an independent pore.
  - source_id: file:genes/ECOLI/SecG/SecG-ai-review.yaml
    title: ECOLI SecG gene review
    statement: SecG is curated as a small SecYEG accessory subunit that stimulates preprotein translocation
      and is not the ATPase motor.
  - source_id: file:genes/ECOLI/SecD/SecD-ai-review.yaml
    title: ECOLI SecD gene review
    statement: SecD is curated as the large PMF-coupled SecDF subunit that assists late translocation
      through SecYEG rather than hydrolyzing ATP.
  - source_id: file:genes/ECOLI/SecF/SecF-ai-review.yaml
    title: ECOLI SecF gene review
    statement: SecF is curated as a PMF-coupled SecDF accessory subunit and its broad protein-transport
      annotations are narrowed to the Sec-complex process.
  - source_id: file:genes/ECOLI/YajC/YajC-ai-review.yaml
    title: ECOLI YajC gene review
    statement: YajC is curated only to SecDF-YajC complex membership because its individual transporter
      or process contribution remains unresolved.
  - source_id: file:genes/ECOLI/LepB/LepB-ai-review.yaml
    title: ECOLI LepB gene review
    statement: LepB is curated as the inner-membrane type I signal peptidase that cleaves signal peptides
      during protein processing after Sec translocation.
  - source_id: PMID:21562494
    title: Structure and function of a membrane component SecDF that enhances protein export.
    statement: Direct biochemical work establishes the PMF-dependent, ATP-independent late-translocation
      role of SecDF.
    supporting_text: In vitro analyses identified an ATP-independent step of protein translocation that
      requires both SecDF and proton motive force.
  - source_id: PMID:29718185
    title: Structure-based working model of SecDF, a proton-driven bacterial protein translocation factor.
    statement: Structural synthesis supports SecDF as a proton-driven completion motor that can act after
      SecA.
    supporting_text: SecDF can complete protein translocation even if SecA function is inactivated by
      ATP depletion
  - source_id: PMID:24550475
    title: Membrane protein insertion and proton-motive-force-dependent secretion through the bacterial
      holo-translocon SecYEG-SecDF-YajC-YidC.
    statement: Purification of the bacterial holo-translocon grounds association of SecYEG with SecDF-YajC.
    supporting_text: The bacterial version SecYEG interacts with the highly conserved YidC and SecDF-YajC
      subcomplex, which facilitates translocation into and across the membrane.
  - source_id: PMID:7507921
    title: Genetic and molecular characterization of the Escherichia coli secD operon and its products.
    statement: Direct genetics leaves the individual contribution of YajC unresolved and argues against
      treating it as an obligatory Sec factor.
    supporting_text: An analysis of yajC mutations constructed in vitro and recombined onto the chromosome
      indicates that yajC is neither essential nor a sec gene.
  - source_id: PMID:25538690
    title: Multitasking SecB chaperones in bacteria.
    statement: 'Review of SecB distribution: SecB is mainly a proteobacterial chaperone, found only sporadically
      in other lineages, so the SecB-dependent route is lineage-restricted while SecA and SecYEG are not.'
    supporting_text: As stated above, SecB is usually found in proteobacteria.
  - source_id: PMID:25538690
    title: Multitasking SecB chaperones in bacteria.
    statement: In E. coli, precursors also reach SecA without SecB, with trigger factor and DnaK supporting
      post-translational targeting; this is the SecB-independent route.
    supporting_text: These data suggest that ribosome-bound TF could facilitate post-translational targeting
      of precursors
  - source_id: PMID:18022369
    title: Structural basis for signal-sequence recognition by the translocase motor SecA as determined
      by NMR.
    statement: SecA itself binds signal peptides in a dedicated groove, so precursor recognition by SecA
      does not require SecB.
    supporting_text: The same groove is used by SecA to recognize a diverse set of signal sequences.
  - source_id: PMID:10559168
    title: Preprotein translocation by a hybrid translocase composed of Escherichia coli and Bacillus
      subtilis subunits.
    statement: Reconstitution with Bacillus subtilis subunits shows a SecB-free SecA plus SecYEG translocase,
      with the SecG homologue YvaL stimulating ATP-dependent prePhoB translocation.
    supporting_text: Like Escherichia coli SecG, the Bacillus subtilis homologue, YvaL, dramatically stimulated
      the ATP-dependent translocation of precursor PhoB (prePhoB)
  - source_id: PMID:10816431
    title: Interaction of Bacillus subtilis CsaA with SecA and precursor proteins.
    statement: B. subtilis, which lacks SecB, has the SecA-binding chaperone CsaA, but CsaA depletion
      affects export of only a few proteins, so it is not a general SecB equivalent and is not modelled
      as a required part.
    supporting_text: suggests that CsaA acts as a chaperone that promotes the export of a subset of preproteins
      in B. subtilis.
  - source_id: PMID:9694879
    title: SecDF of Bacillus subtilis, a molecular Siamese twin required for the efficient secretion of
      proteins.
    statement: In B. subtilis SecD and SecF are one fused polypeptide that is needed for high secretion
      capacity, which grounds the fused SecDF variant.
    supporting_text: the SecD and SecF equivalents of the Gram-positive bacterium Bacillus subtilis are
      jointly present in one polypeptide, denoted SecDF, that is required to maintain a high capacity
      for protein secretion.
  - source_id: PMID:9694797
    title: 'Functional analysis of the secretory precursor processing machinery of Bacillus subtilis:
      identification of a eubacterial homolog of archaeal and eukaryotic signal peptidases.'
    statement: B. subtilis has five chromosomal type I signal peptidases; SipS and SipT are the major
      ones and cells lacking both are not viable.
    supporting_text: only cells lacking both SipS and SipT were not viable
  - source_id: file:genes/BACSU/secA/secA-ai-review.yaml
    title: BACSU secA gene review
    statement: B. subtilis SecA is curated as the protein-exporting ATPase of a bacterium that has no
      SecB.
  - source_id: file:genes/BACSU/secY/secY-ai-review.yaml
    title: BACSU secY gene review
    statement: B. subtilis SecY is curated as the protein-conducting channel and signal-sequence-binding
      subunit of SecYEG.
  - source_id: file:genes/BACSU/secDF/secDF-ai-review.yaml
    title: BACSU secDF gene review
    statement: B. subtilis SecDF is curated as a single fused protein contributing the PMF-coupled SecDF
      accessory activity.
  - source_id: file:genes/BACSU/sipS/sipS-ai-review.yaml
    title: BACSU sipS gene review
    statement: B. subtilis SipS is curated as a major type I signal peptidase.
  - source_id: PANTHER:PTN000770133
    title: PAINT bacterial SecA transport node
    statement: The local PTHR30612 PAINT table assigns protein transport by the Sec complex to this bacterial
      node.
  - source_id: PANTHER:PTN000097217
    title: PAINT SecY/Sec61 transporter node
    statement: The local PTHR10906 PAINT table assigns protein transmembrane transporter activity to this
      node.
  - source_id: PANTHER:PTN000763987
    title: PAINT SecD/SecF protein-transport node
    statement: The local PTHR30081 PAINT table assigns protein transport to the conserved SecD/SecF node.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_sec_posttranslational_protein_export__ppu03060-deep-research-openscientist.md
    title: OpenScientist module-aware PSEPK protein-export pathway synthesis
    statement: Species-aware retrieval confirms the reusable five-part module against the KT2440 ppu03060
      candidate set and separates the post-translational Sec route from SRP, YidC, Tat, and lipoprotein
      maturation/signal peptidase II.
notes: 'Taxonomic scope. The SecA motor, the SecYEG channel (SecG is absent or replaced in some lineages)
  and type I signal peptidase are found throughout bacteria, so the module is written for Bacteria. Escherichia
  coli K-12 and Bacillus subtilis 168 are the two experimental exemplars, with Pseudomonas putida KT2440
  kept as a further proteobacterial instance; their members carry completed gene reviews. Only the SecB-dependent
  delivery variant and the split SecD plus SecF architecture are lineage-restricted. SecB occurs mainly
  in Proteobacteria (PMID:25538690), and B. subtilis has none. Its precursors reach SecA by the SecB-independent
  route, which also serves SecB-independent substrates in E. coli. B. subtilis CsaA binds SecA and some
  precursors but matters for only a few substrates (PMID:10816431), so it is not modelled as a SecB equivalent.
  Many Firmicutes encode SecD and SecF as one fused SecDF protein (PMID:9694879); the fused and split
  forms are realizer variants of the same accessory activity. B. subtilis has five type I signal peptidases
  (SipS, SipT, SipU, SipV, SipW); SipS is the reviewed representative, and the ER-type SipW is not one,
  because it belongs to a different peptidase family.

  Modeling choices. SecDF-YajC is an optional accessory assembly rather than the ATPase motor; ATP hydrolysis
  belongs to SecA, and YajC is given no individual molecular function because its own contribution is
  unresolved. The SecB-independent delivery variant is represented by SecA''s own preprotein and signal-sequence
  binding (GO:0070678), reviewed as core for E. coli SecA; generic chaperones (trigger factor, DnaK) that
  keep precursors unfolded are context outside the module. B. subtilis SecA is not listed in that variant
  because its gene review does not yet record a direct preprotein-binding assay; it is listed as a motor
  representative. PANTHER subfamily display labels PTHR30612:SF0 (CHLOROPLAST PROTEIN-TRANSPORTING ATPASE)
  and PTHR43390:SF1 (CHLOROPLAST PROCESSING PEPTIDASE) are dominated by plastid members although they
  contain the bacterial proteins, so the SecA and signal-peptidase annotons use the parent families PTHR30612
  and PTHR43390. PTHR10906 members carry no subfamily assignment in the cached inventory, so SecY also
  uses the family id.

  Validator note. The signal-peptidase annoton keeps one intrinsic FAMILY_SCOPE_RESTRICTED warning: the
  PTHR43390 family review makes signal peptidase activity RESIDUE_DETERMINED (Ser-Lys catalytic dyad),
  so a family identifier alone cannot establish it for every member. The representatives (E. coli LepB,
  B. subtilis SipS, P. putida LepB) keep the dyad.

  Boundary. Tat export of folded proteins, YidC-dependent insertion, lipoprotein maturation by signal
  peptidase II, SRP cotranslational targeting and outer-membrane secretion systems are separate modules;
  their absence here is decomposition, not a pathway hole.'
