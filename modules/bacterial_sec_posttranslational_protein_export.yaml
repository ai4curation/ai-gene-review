  connections:
    - source: precursor_delivery_to_seca
      target: seca_atpase_motor
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: 'Either route yields a translocation-competent precursor engaged by SecA: SecB binds
        SecA and hands over its bound precursor, or SecA binds the signal sequence itself.'
    - source: seca_atpase_motor
      target: secyeg_channel
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: SecA engages the precursor at SecYEG and drives it into the protein-conducting channel.
    - source: secdf_yajc_accessory_complex
      target: secyeg_channel
      connection_type: POSITIVELY_REGULATES
      description: SecDF uses proton motive force to improve late-stage translocation through SecYEG;
        this accessory route is not obligatory for every substrate.
    - source: secyeg_channel
      target: lepb_signal_peptide_processing
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: The precursor emerging from SecYEG retains its type I signal peptide until LepB cleavage;
        SecDF assistance is optional.
  knowledge_gaps:
    - gap_statement: In bacteria without SecB, such as Bacillus subtilis, it is not known which factors
        keep most post-translational Sec precursors translocation-competent before SecA engages them;
        CsaA affects only a few substrates, and the substrate split between SecA-direct delivery and SRP-dependent
        cotranslational targeting has not been mapped.
      boundary: This module covers SecA-centred post-translational delivery only. Model Ffh, FtsY and
        4.5S RNA in a sibling SRP-targeting module, and keep generic chaperones such as trigger factor
        and DnaK as context.
      gap_kind:
        - BIOLOGY
    - gap_statement: The individual mechanistic contribution of YajC to SecDF and holo-translocon function
        is unresolved, and how much SecDF assistance each substrate needs is not known.
      boundary: Treat SecDF-YajC as an optional completion and throughput step, not as an independent
        ATPase or an absolute requirement for every translocation event. Do not assign YajC an individual
        MF or BP without direct evidence.
      gap_kind:
        - BIOLOGY
