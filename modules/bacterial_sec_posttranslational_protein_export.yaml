id: MODULE:bacterial_sec_posttranslational_protein_export
title: Gram-negative bacterial post-translational Sec protein export
description: >-
  A reusable bacterial protein-export module in which SecB carries an unfolded
  precursor to the SecA ATPase, SecA drives the precursor into the SecYEG
  protein-conducting channel, optional SecDF associated with YajC uses proton
  motive force to improve late-stage translocation, and signal peptidase I removes
  the N-terminal signal peptide. The module models the canonical post-translational route used by
  Gram-negative bacteria. Cotranslational SRP targeting, YidC-dependent membrane
  insertion, Tat export of folded proteins, lipoprotein maturation, and
  outer-membrane secretion are neighboring modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0043952
    title: protein transport by the Sec complex
    statement: Defines the biological process performed by the Sec export apparatus.
  - source_id: GO:0140309
    title: unfolded protein holdase activity
    statement: Defines SecB-mediated carriage of unfolded precursors to the translocon.
  - source_id: GO:0008564
    title: protein-exporting ATPase activity
    statement: Defines the ATP-coupled motor activity supplied independently by SecA.
  - source_id: GO:0008320
    title: protein transmembrane transporter activity
    statement: Defines the channel-level activity supplied by SecYEG with accessory support from SecDF-YajC.
  - source_id: GO:0009977
    title: proton motive force dependent protein transmembrane transporter activity
    statement: Defines the PMF-coupled collective transporter activity contributed by SecD and SecF.
  - source_id: GO:0009003
    title: signal peptidase activity
    statement: Defines the LepB signal-peptide cleavage activity.
  - source_id: GO:0016485
    title: protein processing
    statement: Defines maturation by peptide-bond cleavage, including LepB removal of a type I signal peptide.
  - source_id: PMID:21562494
    title: Structure and function of a membrane component SecDF that enhances protein export.
    statement: Direct biochemical work establishes the PMF-dependent, ATP-independent late-translocation role of SecDF.
    supporting_text: In vitro analyses identified an ATP-independent step of protein translocation that requires both SecDF and proton motive force.
  - source_id: PMID:29718185
    title: Structure-based working model of SecDF, a proton-driven bacterial protein translocation factor.
    statement: Structural synthesis supports SecDF as a proton-driven completion motor that can act after SecA.
    supporting_text: SecDF can complete protein translocation even if SecA function is inactivated by ATP depletion
  - source_id: PMID:24550475
    title: Membrane protein insertion and proton-motive-force-dependent secretion through the bacterial holo-translocon SecYEG-SecDF-YajC-YidC.
    statement: Purification of the bacterial holo-translocon grounds association of SecYEG with SecDF-YajC.
    supporting_text: The bacterial version SecYEG interacts with the highly conserved YidC and SecDF-YajC subcomplex, which facilitates translocation into and across the membrane.
  - source_id: PMID:7507921
    title: Genetic and molecular characterization of the Escherichia coli secD operon and its products.
    statement: Direct genetics leaves the individual contribution of YajC unresolved and argues against treating it as an obligatory Sec factor.
    supporting_text: An analysis of yajC mutations constructed in vitro and recombined onto the chromosome indicates that yajC is neither essential nor a sec gene.
  - source_id: PANTHER:PTN000770133
    title: PAINT bacterial SecA transport node
    statement: The local PTHR30612 PAINT table assigns protein transport by the Sec complex to this bacterial node.
  - source_id: PANTHER:PTN000097217
    title: PAINT SecY/Sec61 transporter node
    statement: The local PTHR10906 PAINT table assigns protein transmembrane transporter activity to this node.
  - source_id: PANTHER:PTN000763987
    title: PAINT SecD/SecF protein-transport node
    statement: The local PTHR30081 PAINT table assigns protein transport to the conserved SecD/SecF node.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_sec_posttranslational_protein_export__ppu03060-deep-research-openscientist.md
    title: OpenScientist module-aware PSEPK protein-export pathway synthesis
    statement: >-
      Species-aware retrieval confirms the reusable five-part module against the
      KT2440 ppu03060 candidate set and separates the post-translational Sec route
      from SRP, YidC, Tat, and lipoprotein maturation/signal peptidase II.
notes: >-
  The module is not specific to Pseudomonas putida. KT2440 supplies a concrete
  implementation of every role, and reviewed E. coli proteins provide canonical
  Gram-negative exemplars. SecDF-YajC is an optional accessory assembly rather
  than the ATPase motor; ATP hydrolysis belongs to SecA, while the individual
  contribution of YajC remains unresolved. The
  PTHR30612:SF0 and PTHR43390:SF1 display labels are misleadingly
  chloroplast-centered, so this module uses the correctly named parent SecA and
  signal-peptidase I families instead of those subfamily display labels.
