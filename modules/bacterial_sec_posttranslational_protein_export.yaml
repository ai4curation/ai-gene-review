  knowledge_gaps:
    - gap_statement: The substrate-level division between SecB/SecA post-translational targeting and SRP cotranslational targeting has not been mapped comprehensively in KT2440.
      boundary: >-
        This module covers only the SecB/SecA route. Model Ffh, FtsY, and 4.5S RNA
        in a sibling SRP-targeting module rather than adding them as extra parts here.
      gap_kind:
        - BIOLOGY
    - gap_statement: SecDF-YajC is conserved in KT2440, but SecDF assistance may be substrate-dependent and the individual contribution of YajC is unresolved.
      boundary: >-
        Treat the assembly as an optional completion and throughput step, not as
        an independent ATPase or an absolute requirement for every translocation
        event. Do not assign YajC an individual MF or BP without direct evidence.
      gap_kind:
        - CURATION
    - gap_statement: Tat, YidC, lipoprotein maturation, and Xcp type II secretion are fully encoded but outside this module.
      boundary: >-
        Their absence from this document is deliberate modular decomposition, not
        a pathway hole in Pseudomonas putida KT2440.
      gap_kind:
        - CURATION
