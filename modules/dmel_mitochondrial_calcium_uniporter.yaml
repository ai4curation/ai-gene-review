id: MODULE:dmel_mitochondrial_calcium_uniporter
title: Mitochondrial calcium uniporter complex in Drosophila melanogaster
description: >-
  The mitochondrial calcium uniporter carries Ca2+ across the inner mitochondrial membrane,
  driven by the membrane potential. The pore is formed by MCU together with the small single-pass
  protein EMRE, which is required for uniporter activity in animals. On the intermembrane
  space side, the EF-hand proteins of the MICU family act as Ca2+-sensing gatekeepers that
  keep the channel closed at resting Ca2+ and open it when Ca2+ rises. FlyBase defines a complex
  with MICU1 and MICU3 and a variant in which the EF-hand protein CG4704 takes the place of
  MICU1.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001891
  title: 'FlyBase gene group MCU-CPXS: Mitochondrial calcium uniporter complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as mitochondrial calcium uniporter
    complexes (MCU-CPXS); this module models that group.
- source_id: GO:1990246
  title: uniplex complex
  statement: >-
    GO term grounding the module as uniplex complex.
notes: >-
  The two FlyBase uniporter groups share MCU, EMRE and MICU3 and differ in the MICU1-like
  subunit, so they are modelled as one pore part plus a gatekeeper variant set. The FlyBase
  CG4704 variant group is tagged as testis-related (MCUNI-T); its tissue restriction is taken
  from FlyBase. FlyBase groups realized by this module: MCU-CPXS (FBgg0001891). Subgroups
  folded into it: MCUNI, MCUNI-T. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_mitochondrial_calcium_uniporter.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
