id: MODULE:fezf2_cdh22_pv_inhibition
title: Activity-dependent FEZF2-CDH22 control of PV+ perisomatic inhibition onto L5 ET neurons
description: >-
  A postnatal, cell-type-specific gene-regulatory cascade by which neuronal activity sets the number
  of parvalbumin-interneuron (PV+) perisomatic inhibitory synapses onto layer-5 extratelencephalic
  (ET) pyramidal cells. Activity induces the immediate-early transcription factor c-Fos (AP-1), which
  activates the promoter of the ET selector gene Fezf2 (a late-response gene in this context); FEZF2
  in turn transcriptionally upregulates the cell-surface cadherin Cdh22; CDH22 acts locally at the
  perisomatic membrane to promote assembly of PV+ inhibitory synapses. The module captures the
  repurposing of an embryonic identity transcription factor to tune inhibitory connectivity in an
  activity-dependent manner (Kroon et al. 2026).
status: DRAFT
scope: CONCRETE
references:
  - id: DOI:10.1038/s41593-026-02515-6
    title: The identity gene Fezf2 is repurposed postnatally to specify inhibitory input in an activity-dependent manner
evidence:
  - source_id: DOI:10.1038/s41593-026-02515-6
    title: The identity gene Fezf2 is repurposed postnatally to specify inhibitory input in an activity-dependent manner
    statement: >-
      Primary and only source for this module. Demonstrates activity regulation of Fezf2 in L5 ET
      neurons, FEZF2-dependent control of Cdh22 expression, CDH22 localization to PV+ postsynaptic
      sites, and the requirement of both Fezf2 and Cdh22 for PV+ perisomatic inhibition. No PMID at
      time of curation; cached as publications/DOI_10.1038_s41593-026-02515-6.md.
notes: >-
  Grounded on concrete mouse gene products (UniProtKB:P01101 Fos, UniProtKB:Q9ESP5 Fezf2,
  UniProtKB:Q9WTP5 Cdh22); no PANTHER family ids are asserted because the module is a specific
  three-gene cascade rather than a family-level mechanism. The direct versus indirect nature of the
  FEZF2 -> Cdh22 regulatory step is an open question (recorded as a knowledge gap on the FEZF2 node):
  activity promotes FOS binding to intronic regions of the Cdh22 locus, and FEZF2 is necessary and
  sufficient for activity-induced Cdh22, but direct FEZF2 occupancy at Cdh22 has not been shown.
knowledge_gaps:
  - gap_statement: >-
      Whether FEZF2 regulates Cdh22 transcription directly (by binding the Cdh22 locus) or indirectly
      through intermediate factors is undetermined.
    boundary: >-
      FEZF2 is necessary and sufficient for activity-dependent Cdh22 upregulation in L5 ET neurons,
      and FOS binds intronic regions of the Cdh22 locus; direct FEZF2 occupancy at Cdh22 is not shown.
    gap_kind:
      - BIOLOGY
