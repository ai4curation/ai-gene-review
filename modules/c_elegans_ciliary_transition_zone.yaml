knowledge_gaps:
  - gap_statement: >-
      Whether the MKS and NPHP modules physically associate with each other and
      with MKS-5 at the worm TZ, and which proteins make up the Y-links, is not
      known.
    boundary: >-
      The modules are defined by genetic interaction and localisation
      dependency. Y-links are lost in MKS plus NPHP double mutants, and MKS-5
      with the NPHP module is proposed to nucleate Y-link assembly, but no
      worm TZ complex has been purified or resolved structurally.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would show whether genetic redundancy reflects two parallel physical
      tethers between microtubules and membrane or two inputs into one
      structure.
    resolution: >-
      Proximity labelling or affinity purification of tagged MKS-5, MKS-2 and
      NPHP-4 from worm ciliated neurons, and cryo-electron tomography of the
      TZ in single and double module mutants.
    provenance:
      - reference_id: PMID:21422230
        supporting_text: >-
          Whether the modules are physically associated together at the TZ
          remains to be examined
      - reference_id: PMID:26982032
        supporting_text: >-
          we speculate that MKS-5 and the NPHP module might help nucleate the
          assembly of Y-links
  - gap_statement: >-
      The molecular mechanism by which the TZ modules exclude non-ciliary
      membrane proteins, whether by a diffusion barrier, selective retrieval
      or both, is unresolved.
    boundary: >-
      TZ mutants accumulate non-ciliary proteins in cilia, but it is not
      known whether these proteins enter abnormally or fail to be removed.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines how the gate controls ciliary membrane composition and thus
      sensory signalling.
    resolution: >-
      Single-molecule tracking and photoconversion of membrane reporters
      across the TZ in wild type and mks/nphp double mutants to separate entry
      from exit rates.
    provenance:
      - reference_id: PMID:21422230
        supporting_text: >-
          Alternatively, these proteins may enter cilia at low levels normally
          and instead require NPHP and MKS proteins for efficient removal from
          the compartment.
