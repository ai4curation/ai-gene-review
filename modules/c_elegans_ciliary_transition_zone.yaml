id: MODULE:c_elegans_ciliary_transition_zone
title: Ciliary transition zone MKS and NPHP modules in Caenorhabditis elegans
description: >-
  The ciliary transition zone (TZ) is the proximal region of the cilium, just
  distal to the basal body, where Y-shaped links connect the axonemal
  microtubules to the ciliary membrane. It acts as a gate that controls which
  proteins enter and leave the cilium. In Caenorhabditis elegans sensory
  neurons the TZ is built by two genetically defined protein modules. The MKS
  module contains the three B9-domain proteins MKS-1, MKSR-1 and MKSR-2, the
  transmembrane proteins MKS-2/TMEM216 and MKS-3/TMEM67 (meckelin), and the
  C2-domain protein MKS-6/CC2D2A. The NPHP module contains the nephrocystins
  NPHP-1 and NPHP-4. MKS-5, the RPGRIP1L/RPGRIP1 ortholog, is the assembly hub:
  it is needed for all MKS-module proteins to reach the TZ and for normal
  distribution of the NPHP module, and it anchors two separate assembly
  branches, an NPHP branch and a CEP-290-dependent MKS branch. The two modules
  are partially redundant. Single mutants, and even mutants lacking several
  members of the same module, have nearly normal cilia, whereas combining an
  MKS-module mutation with an nphp-1 or nphp-4 mutation causes severe defects:
  the basal body and TZ fail to attach to the membrane, Y-links are lost,
  axonemes are malformed and non-ciliary membrane proteins leak into the
  cilium. Human orthologs of these genes are mutated in Meckel-Gruber
  syndrome, Joubert syndrome and nephronophthisis.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:21422230
    title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
    statement: >-
      Eight C. elegans TZ proteins form two functional modules that together
      attach the basal body/TZ to the membrane and establish the ciliary
      gate.
    supporting_text: >-
      MKS/MKSR/NPHP proteins establish basal body/TZ membrane attachments
      before or coinciding with intraflagellar transport-dependent axoneme
      extension and subsequently restrict accumulation of nonciliary
      components within the ciliary compartment
  - source_id: PMID:21422230
    title: MKS and NPHP modules cooperate to establish basal body/transition zone membrane associations and ciliary gate function during ciliogenesis.
    statement: >-
      Module assignment is based on synthetic genetic interactions:
      mutations within one module do not enhance each other, whereas MKS
      plus NPHP combinations do.
    supporting_text: >-
      Thus, we group MKS-1, MKSR-1, MKSR-2, MKS-3, and MKS-6 into an MKS/MKSR
      module and NPHP-1 and NPHP-4 into an NPHP module
  - source_id: PMID:26982032
    title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
    statement: >-
      MKS-5 is the foundation of two assembly pathways, one for the NPHP
      module and one for the MKS module with CEP-290 at its core.
    supporting_text: >-
      In this model, MKS-5 (Rpgrip1L/Rpgrip1 orthologue) represents the
      foundation of two distinct assembly pathways for the MKS and NPHP
      modules, with the MKS pathway having CEP-290 as its core
  - source_id: file:modules/c_elegans_intraflagellar_transport.yaml
    title: Intraflagellar transport in Caenorhabditis elegans sensory cilia
    statement: >-
      IFT trains pass through the TZ; IFT builds the axoneme after the TZ has
      been assembled and docked, and is modelled separately.
  - source_id: file:modules/bbsome.yaml
    title: BBSome ciliary trafficking complex module
    statement: >-
      The BBSome, which traffics membrane cargo across the TZ, is modelled
      separately and treated as an interface.
  - source_id: file:projects/CAEEL_CILIOPATHY.md
    title: C. elegans Ciliopathy/IFT Pathway Project
    statement: >-
      Project page listing the worm MKS and NPHP transition-zone genes whose
      gene reviews ground the members of this module.
notes: >-
  Boundary. This concrete C. elegans module covers the core MKS and NPHP TZ
  modules and their assembly hub MKS-5. The modules are defined
  genetically, by synthetic ciliogenesis defects between but not within
  modules, and by localisation hierarchy. Whether they form stable
  biochemical complexes in worms is not established. GO:0036038 (MKS
  complex) and GO:1990957 (NPHP complex) are used as concepts for the two
  parts, following the gene reviews.

  Redundancy. The genetic redundancy between the modules is the defining
  property of this system. It is recorded in the root description, the part
  descriptions and the evidence rather than as a connection, because the
  connection vocabulary has no relation for redundancy. MKS-5 is the
  exception to module assignment: mks-5 interacts genetically with members
  of both modules.

  Members not modelled. Further worm TZ proteins are assigned to the MKS
  module or to MKS-5/CEP-290-dependent assembly in PMID:26982032 and related
  work: CEP-290, TMEM-218, TMEM-231, JBTS-14/TMEM237, TMEM-107, TMEM-17,
  TCTN-1, TMEM-138 and CDKL-1. None has a gene review here, so they are named
  in text only. CEP-290 in particular is the core of the MKS assembly branch
  and needs the MKS-5 coiled-coil region to reach the TZ. NPHP-2/inversin is
  reviewed (genes/worm/nphp-2) but localises to the inversin compartment
  distal to the TZ, so it is outside this boundary.

  Gene names. MKSR-2 and MKSR-1 were earlier named TZA-1 (B9D2) and TZA-2
  (B9D1), and MKS-1 was XBX-7 (PMID:18337471).

  Molecular functions. MFs follow the gene reviews' core functions. The
  mks-1 review lists only protein binding, and the mks-6 and nphp-1 reviews
  assert no MF, so those annotons carry a preferred_term only.

  Interfaces. IFT (MODULE:c_elegans_intraflagellar_transport) and the
  BBSome (MODULE:bbsome) act after or alongside the TZ: IFT rates are largely
  normal in TZ mutants, and IFT and BBS proteins are not needed to form the
  TZ or to dock it to the membrane (PMID:21422230). NPHP-1 and NPHP-4 do
  modulate ciliary access of IFT components (PMID:18316409).
