id: MODULE:dmel_salivary_glue_secretion
title: Larval salivary glue proteins and puparial adhesion in Drosophila melanogaster
description: >-
  At the end of the third larval instar, the larval salivary glands make large amounts of
  glue glycoproteins in response to the ecdysone pulse, store them in secretory granules and
  release them into the gland lumen. At pupariation the larva expectorates the glue, which
  spreads over the body and hardens, fixing the puparium to the substrate for metamorphosis.
  The glue is a mixture of unrelated proteins: long, repeat-rich, heavily glycosylated mucin-like
  proteins (Sgs1, Sgs3, Sgs4 and the mucin Eig71Ee/gp150), small cysteine-rich proteins (Sgs7,
  Sgs8) and Sgs5 and Sgs5bis, whose role in the glue is not known.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001189
  title: 'FlyBase gene group GLUE: Glue proteins'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as glue proteins (GLUE); this
    module models that group.
- source_id: GO:0007594
  title: puparial adhesion
  statement: >-
    GO term grounding the module as puparial adhesion.
- source_id: PMID:825230
  title: 'Differentiation in the salivary glands of Drosophila melanogaster: characterization
    of the glue proteins and their developmental appearance.'
  statement: >-
    Identifies the major glue proteins and their developmental timing.
  supporting_text: >-
    These glands synthesize and secrete massive amounts of a glue which attaches the pupae
    to the substrate during metamorphosis.
notes: >-
  Boundary. The module contains the glue proteins themselves. Glue granule biogenesis and
  exocytosis (for example Swip-1, which promotes glue granule exocytosis) and the ecdysone-triggered
  transcriptional program are upstream context, not parts. Most bioadhesive activity annotations
  rest on the 1976 biochemical characterization of the glue (PMID:825230). FlyBase groups
  realized by this module: GLUE (FBgg0001189). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_salivary_glue_secretion.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
