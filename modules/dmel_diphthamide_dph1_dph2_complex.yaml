id: MODULE:dmel_diphthamide_dph1_dph2_complex
title: Dph1-Dph2 diphthamide synthesis complex in Drosophila melanogaster
description: >-
  Diphthamide is a modified histidine residue on translation elongation factor 2 (eEF2) that
  is required for accurate translation and is the target of diphtheria toxin. Its first step,
  transfer of a 3-amino-3-carboxypropyl group from S-adenosylmethionine to the histidine of
  eEF2, is catalysed by a heterodimer of the iron-sulfur radical SAM-like enzymes Dph1 and
  Dph2. Later steps are performed by Dph3, Dph4, Dph5, Dph6 and Dph7, which are not part of
  this complex.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001996
  title: 'FlyBase gene group DPH1-DPH2: Dph1-dph2 complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as dph1-dph2 complex (DPH1-DPH2);
    this module models that group.
- source_id: GO:0120513
  title: 2-(3-amino-3-carboxypropyl)histidine synthase complex
  statement: >-
    GO term grounding the module as 2-(3-amino-3-carboxypropyl)histidine synthase complex.
notes: >-
  Modelled one part per subunit. The activity belongs to the heterodimer and is given to both
  subunits; assignments are by orthology to yeast and human Dph1-Dph2. FlyBase groups realized
  by this module: DPH1-DPH2 (FBgg0001996). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_diphthamide_dph1_dph2_complex.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
