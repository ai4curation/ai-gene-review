  - source_id: PMID:1508149
    title: Structure and regulation of yeast HEM3, the gene for porphobilinogen deaminase.
    statement: HEM3 is the structural gene for porphobilinogen deaminase.
  - source_id: PMID:14559249
    title: Identification of rate-limiting steps in yeast heme biosynthesis.
    statement: Porphobilinogen synthase and deaminase are both rate-limiting in yeast heme synthesis.
  - source_id: PMID:7597845
    title: Isolation of the gene HEM4 encoding uroporphyrinogen III synthase in Saccharomyces cerevisiae.
    statement: hem4 null and cyt mutants lack uroporphyrinogen III synthase activity.
  - source_id: PMID:2180703
    title: >-
      Purification and properties of uroporphyrinogen decarboxylase from
      Saccharomyces cerevisiae. Yeast uroporphyrinogen decarboxylase.
    statement: Yeast uroporphyrinogen decarboxylase is a monomeric enzyme.
  - source_id: PMID:3516695
    title: Purification and properties of coproporphyrinogen oxidase from the yeast Saccharomyces cerevisiae.
    statement: >-
      Yeast coproporphyrinogen oxidase is cytosolic and active only with
      molecular oxygen as electron acceptor.
  - source_id: PMID:2838478
    title: >-
      Isolation, sequence, and regulation by oxygen of the yeast HEM13 gene
      coding for coproporphyrinogen oxidase.
    statement: HEM13 encodes coproporphyrinogen oxidase and is induced under oxygen limitation.
  - source_id: PMID:8621563
    title: >-
      Cloning and characterization of the yeast HEM14 gene coding for
      protoporphyrinogen oxidase, the molecular target of diphenyl ether-type
      herbicides.
    statement: HEM14 encodes an FAD protoporphyrinogen oxidase related to HemY and human PPOX.
  - source_id: PMID:7798202
    title: >-
      Purification and properties of protoporphyrinogen oxidase from the yeast
      Saccharomyces cerevisiae. Mitochondrial location and evidence for a
      precursor form of the protein.
    statement: Yeast protoporphyrinogen oxidase activity is confined to the mitochondrial inner membrane.
  - source_id: PMID:2185242
    title: The ferrochelatase from Saccharomyces cerevisiae. Sequence, disruption, and expression of its structural gene HEM15.
    statement: HEM15 encodes a mitochondrial inner membrane-bound ferrochelatase.
  - source_id: file:modules/heme_biosynthesis-deep-research-openscientist.md
    title: OpenScientist generic heme-biosynthesis module research
    statement: >-
      The final generic report supports the protoporphyrin-dependent boundary,
      shared trunk, and independent entry and late-oxidation axes. Its
      description of HemB-HemE as a six-enzyme trunk, universal entry-route
      exclusivity, oxygen-determined late choices, and generalized membrane
      association or channeling was not used to alter the curated graph.
notes: >-
  Scope is CONCRETE because this document represents a chemically defined,
  leaf-grounded heme B biosynthetic pathway rather than a gene-free abstract
  motif; cross-taxon reuse does not make the pathway abstract. The boundary
  begins with route-specific ALA formation and ends with heme B. HemA/HemL and
  the trunk through uroporphyrinogen III can also supply sibling tetrapyrrole
  pathways, but siroheme-, corrin-, and cobalamin-specific enzymes remain
  outside. GltX supplies glutamyl-tRNA used by both translation and HemA and is
  upstream of the committed C5 entry chemistry. Coproheme synthesis, heme
  uptake, storage, degradation, and conversion of heme B to modified hemes are
  outside the boundary. A concrete organism or compartment may encode one or
  both ALA-entry systems and one or more enzymes on either late-oxidation axis;
  route enumeration describes minimal paths and therefore chooses one branch
  per axis. The catalog of late oxidation families is evidence-based but not a
  claim of universal cross-taxon completeness. ALIGN with YeastPathways
  (2026-10): the HEME-BIOSYNTHESIS-II, PWY3O-50 and heme part of PWY3O-69
  frames map one-to-one onto the C4/Shemin entry, the shared trunk, the
  oxygen-dependent HemF route, the HemY/PPOX route and ferrochelatase. The
  eight YeastCyc catalysts (HEM1, HEM2, HEM3, HEM4, HEM12, HEM13, HEM14,
  HEM15) are correct and none are missing; S. cerevisiae and S. pombe
  orthologs were added as representatives. Fungi use only C4 entry, HemF and
  HemY. The MET1/MET8 siroheme branch of PWY3O-69 belongs to
  MODULE:siroheme_biosynthesis. Compartments in fungi: ALA synthase in the
  mitochondrial matrix, the trunk and coproporphyrinogen oxidase in the
  cytosol (unlike the intermembrane-space CPOX of animals), and
  protoporphyrinogen oxidase and ferrochelatase at the inner membrane.
  GO-CAM disagreements: YeastPathways_PWY3O-50 and _PWY3O-69 place HEM1 in
  the cytosol and PWY3O-69 also places HEM14 and HEM15 there, contradicting
  the mitochondrial localization; PWY3O-69 tags the siroheme activities as
  part of heme biosynthesis. The PomBase model agrees with the module
  chemistry and additionally contains transport, iron supply, heme A
  synthesis and a mitochondrial GSA aminomutase-like protein (SPCC417.11c,
  PANTHER PTHR43713) whose role is not established; fungi lack HemA, so it is
  not treated as C5-route evidence.
module:
  id: heme_biosynthesis
  label: Protoporphyrin-dependent heme B biosynthesis
  module_type: METABOLIC_PATHWAY
  description: >-
    One or more ALA entry chemistries feed a shared trunk and independently
    selected late oxidation chemistry before the common ferrochelatase reaction.
  concepts:
    - preferred_term: heme B biosynthetic process
      term:
        id: GO:0006785
        label: heme B biosynthetic process
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-50
      title: 'tetrapyrrole biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of the HEM1-HEM4 trunk to uroporphyrinogen III; all four
        activities are placed in the cytosol, including the mitochondrial
        HEM1.
    - model: gomodel:YeastPathways_HEME-BIOSYNTHESIS-II
      title: 'heme <i>b</i> biosynthesis I (aerobic) - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of HEM12, HEM13 (cytosol), HEM14 and HEM15
        (mitochondrial inner membrane); no causal edges.
    - model: gomodel:YeastPathways_PWY3O-69
      title: 'superpathway of heme and siroheme biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD superpathway combining the heme route with the MET1/MET8 siroheme
        branch (MODULE:siroheme_biosynthesis). Every activity, including HEM1,
        HEM14 and HEM15, is placed in the cytosol, and the siroheme
        activities are tagged as part of heme biosynthesis.
    - model: gomodel:66c7d41500000841
      title: heme biosynthetic process (GO:0006783)
      description: >-
        PomBase S. pombe model with hem1 (mitochondrial matrix), the cytosolic
        hem2, hem3, hem4, hem12 and hem13, and hem14 and hem15 on the matrix
        side of the inner membrane. It also includes glycine and ALA
        transporters, mitochondrial iron import, an iron chaperone, heme A
        synthesis, the siroheme branch and a mitochondrial GSA
        aminomutase-like protein (SPCC417.11c), all outside this module.
