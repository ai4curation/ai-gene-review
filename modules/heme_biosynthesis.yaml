    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-50
  - source_id: YeastPathways:PWY3O-69
    title: superpathway of heme and siroheme biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway joining the heme route and the MET1/MET8 siroheme branch;
      only the heme reactions belong to this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-69
  - source_id: PMID:6381051
    title: Isolation and properties of 5-aminolevulinate synthase from the yeast Saccharomyces cerevisiae.
    statement: >-
      Yeast mitochondrial ALA synthase is a homodimer that requires pyridoxal
      5'-phosphate.
  - source_id: PMID:3516694
    title: >-
      The nucleotide sequence of the HEM1 gene and evidence for a precursor
      form of the mitochondrial 5-aminolevulinate synthase in Saccharomyces
