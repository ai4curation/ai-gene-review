id: MODULE:autonomous_flowering_pathway
title: Autonomous flowering pathway repressing FLOWERING LOCUS C (Arabidopsis)
description: >-
  The autonomous pathway is the set of photoperiod-independent Arabidopsis flowering promoters
  whose common output is quantitative repression of the MADS-box floral repressor FLOWERING LOCUS C
  (FLC). It couples co-transcriptional RNA 3'-end processing to chromatin silencing. At FLC, the
  nuclear RRM/WW RNA-binding protein FCA binds the nascent antisense COOLAIR transcripts in liquid-like
  nuclear bodies and engages the CPSF subunit FY (WDR33/Pfs2p) through FY's C-terminal PPLPP motifs.
  This directs cleavage and polyadenylation to the promoter-proximal antisense poly(A) site. The
  spen-family RNA-binding protein FPA acts redundantly with FCA on poly(A) site choice. Proximal
  termination is handed over to a chromatin module made up of the LSD1-type H3K4 demethylase FLD,
  LUMINIDEPENDENS (LD, a Ref2/PNUTS-like subunit linked to an APRF1/TOPP4 CPF-like phosphatase
  module) and SDG26, which contacts FY. FLD/LD/SDG26 remove H3K4me1 over the FLC gene body, which
  reduces H3K36me3 and transcription and favours Polycomb (PRC2) H3K27me3. The RbAp48-like histone
  binding protein FVE (MSI4) promotes FLC repression as a shared subunit of HDA5/HDA6-FLD histone
  deacetylase complexes and of a CLF-PRC2. Repressed FLC releases its repression of the floral
  integrators FT and SOC1, so the pathway promotes flowering. FRIGIDA-mediated FLC activation,
  cold-induced vernalization silencing (VIN3/VRN-PRC2), photoperiod signalling and the
  FT/SOC1-triggered meristem identity program are outside this module. Here FLC, FT and SOC1 appear
  only as the regulated output.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:14593187
    title: Regulation of flowering time by histone acetylation in Arabidopsis.
    statement: The autonomous pathway promotes flowering independently of photoperiod and vernalization by repressing FLC.
    supporting_text: >-
      The Arabidopsis autonomous floral-promotion pathway promotes flowering independently of the
      photoperiod and vernalization pathways by repressing FLOWERING LOCUS C (FLC), a MADS-box
      transcription factor that blocks the transition from vegetative to reproductive development.
  - source_id: PMID:19965720
    title: Targeted 3' processing of antisense transcripts triggers Arabidopsis FLC chromatin silencing.
    statement: Proximal polyadenylation of FLC antisense transcripts, directed by an RNA-binding protein, triggers demethylase-dependent silencing.
    supporting_text: >-
      A specific RNA-binding protein directs their activity to a proximal antisense polyadenylation
      site. This targeted processing triggers localized histone demethylase activity and results in
      reduced FLC sense transcription.
  - source_id: PMID:32541063
    title: The 3' processing of antisense RNAs physically links to chromatin-based transcriptional control.
    statement: FLD, LD and SDG26 form a complex, and SDG26-FY contact links antisense 3' processing to H3K4 demethylation.
    supporting_text: >-
      SDG26 interacts with the RNA 3' processing factor FY (WDR33), thus linking activities for
      proximal polyadenylation of the antisense transcripts to FLD/LD/SDG26-associated H3K4
      demethylation.
  - source_id: PMID:35766439
    title: Characterization of an autonomous pathway complex that promotes flowering in Arabidopsis.
    statement: Autonomous pathway chromatin components form a multi-subunit complex (AuPC) whose mutants are late flowering with high FLC.
    supporting_text: >-
      We demonstrate that these components form a multi-subunit autonomous pathway complex (AuPC).
  - source_id: PMID:38851185
    title: A CPF-like phosphatase module links transcription termination to chromatin silencing.
    statement: APRF1 with LD and TOPP4 form a CPF-like phosphatase module linking termination to chromatin silencing at FLC.
    supporting_text: >-
      This work shows how the APRF1/LD-mediated polyadenylation/termination process influences
      subsequent rounds of transcription by changing the local chromatin environment at FLC.
notes: >-
  Concrete Arabidopsis instance. Each annoton is grounded on an owned, reviewed gene in
  genes/ARATH (FCA O04425, FY Q6NLV4, FPA Q8LPQ9, FLD Q9CAE3, FVE/MSI4 O22607, LD Q38796), and its
  function term matches that review's core_functions. FLC, FT and SOC1 are read-only output members
  reviewed elsewhere. FY and LD annotons carry no molecular-function term. FY is modelled as a
  CPSF subunit, because direct poly(A)-signal binding by plant FY has not been shown. LD is a
  Ref2/PNUTS-like scaffold for which no GO MF is established. Other components named in the
  literature are not modelled as annotons here because they are not reviewed in this batch: SDG26,
  APRF1, TOPP4, EFL2/EFL4, the FCA nuclear-body partner FLL2, the CstF64/CstF77 3'-processing factors,
  the FLD paralogs LDL1/LDL2, HDA5/HDA6, CLF and the FPA/FCA-independent autonomous genes FLK and
  REF6. No cached GO-CAM in gocams/index.tsv contains these genes. PANTHER family ids are not
  asserted. Older literature lists FCA, FY, FPA, FLD, FVE and LD (plus FLK) as autonomous pathway
  genes. Vernalization/FRIGIDA biology belongs to a separate module. The COOLAIR node uses
  GO:0110104 mRNA alternative polyadenylation even though COOLAIR is a lncRNA: the node's defining
  event is poly(A)-site choice (proximal vs distal), which the general GO:0031123 RNA 3'-end
  processing does not express, GO has no lncRNA-specific alternative polyadenylation term, and the
  same FCA/FPA/FY machinery acts on mRNAs in this node (FCA autoregulation of its own pre-mRNA,
  FPA genome-wide poly(A)-site choice), matching the reviewed core functions of FCA and FPA.
  The term is a slight over-specification for the antisense transcript; a lncRNA alternative
  polyadenylation term would be the better fit if GO adds one.
module:
  id: autonomous_flowering_pathway
  label: Autonomous flowering pathway (FLC repression)
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: regulation of timing of transition from vegetative to reproductive phase
      term:
        id: GO:0048510
        label: regulation of timing of transition from vegetative to reproductive phase
      description: >-
        The autonomous pathway promotes flowering (shortens time to the floral transition)
        independently of photoperiod by limiting FLC.
    - preferred_term: negative regulation of gene expression, epigenetic
      term:
        id: GO:0045814
        label: negative regulation of gene expression, epigenetic
      description: Chromatin-based (H3K4 demethylation, deacetylation, H3K27me3) silencing of FLC.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: co-transcriptional proximal polyadenylation of FLC antisense (COOLAIR) transcripts
      node:
        id: coolair_proximal_polyadenylation
        label: FCA/FPA-directed proximal 3'-end processing of COOLAIR
        module_type: BIOLOGICAL_PROCESS
        description: >-
          FCA binds nascent COOLAIR in nuclear condensates and, via its WW domain, recruits the CPSF
          subunit FY to the proximal antisense poly(A) site. FPA acts redundantly. FCA also autoregulates
          its own expression through the same proximal-polyadenylation mechanism.
        concepts:
          - preferred_term: mRNA alternative polyadenylation
            term:
              id: GO:0110104
              label: mRNA alternative polyadenylation
        annotons:
          - id: fca_coolair_binding
            label: "FCA: RRM/WW RNA-binding protein that binds COOLAIR and recruits FY"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FCA (At4g16280)
                term:
                  id: UniProtKB:O04425
                  label: Flowering time control protein FCA
            function:
              preferred_term: lncRNA binding
              term:
                id: GO:0106222
                label: lncRNA binding
            processes:
              - preferred_term: mRNA alternative polyadenylation
                term:
                  id: GO:0110104
                  label: mRNA alternative polyadenylation
            locations:
              - preferred_term: nuclear body
                term:
                  id: GO:0016604
                  label: nuclear body
            evidence:
              - source_id: PMID:31032401
                statement: FCA binds nascent COOLAIR transcripts.
                supporting_text: >-
                  We report that the RNA binding protein FCA interacts with the PRC2 subunit CURLY LEAF
                  (CLF) and binds nascent COOLAIR transcripts to allow deposition of H3K27me3 at FLC.
              - source_id: PMID:12809608
                statement: The FCA-FY interaction is needed for proximal poly(A) site selection and FLC downregulation.
                supporting_text: >-
                  The FCA/FY interaction is also required for the downregulation of the floral
                  repressor FLC.
          - id: fpa_poly_a_site_choice
            label: "FPA: spen-family RNA-binding regulator of poly(A) site choice"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FPA (At2g43410)
                term:
                  id: UniProtKB:Q8LPQ9
                  label: Flowering time control protein FPA
            function:
              preferred_term: RNA binding
              term:
                id: GO:0003723
                label: RNA binding
            processes:
              - preferred_term: mRNA alternative polyadenylation
                term:
                  id: GO:0110104
                  label: mRNA alternative polyadenylation
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Acts redundantly with FCA to promote proximal COOLAIR polyadenylation.
            evidence:
              - source_id: PMID:20079695
                statement: FPA is redundant with FCA in controlling alternatively polyadenylated FLC antisense RNAs.
                supporting_text: >-
                  We show that FPA functions redundantly with FCA, another RNA binding protein that
                  controls flowering and RNA silencing, to control the expression of alternatively
                  polyadenylated antisense RNAs at the locus encoding the floral repressor FLC.
          - id: fy_cpsf_subunit
            label: "FY: WDR33/Pfs2p CPSF subunit engaged by FCA"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FY (At5g13480)
                term:
                  id: UniProtKB:Q6NLV4
                  label: Flowering time control protein FY
            processes:
              - preferred_term: mRNA 3'-end processing
                term:
                  id: GO:0031124
                  label: mRNA 3'-end processing
              - preferred_term: mRNA alternative polyadenylation
                term:
                  id: GO:0110104
                  label: mRNA alternative polyadenylation
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Core subunit of the CPSF complex (GO:0005847) whose PPLPP motifs bind the FCA WW domain. It is also contacted by
              SDG26, which bridges 3' processing to the FLD chromatin module. No MF term is asserted
              (see notes).
            evidence:
              - source_id: PMID:19439664
                statement: FY is stably associated with CPSF100/CPSF160; FCA interacts transiently.
                supporting_text: >-
                  AtCPSF100 and AtCPSF160, but not FCA, are stably associated with FY in vivo and form
                  a range of different-sized complexes.
    - order: 2
      role: chromatin-based repression of FLC
      node:
        id: flc_chromatin_repression
        label: FLD/LD H3K4 demethylation and FVE-dependent deacetylation/PRC2 silencing at FLC
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The FLD/LD/SDG26 complex removes H3K4me1 over the FLC gene body after proximal antisense
          termination. FVE (MSI4), a histone-binding subunit shared by HDA5/HDA6-FLD deacetylase
          complexes and a CLF-PRC2, promotes deacetylation and H3K27me3 at FLC.
        concepts:
          - preferred_term: negative regulation of gene expression, epigenetic
            term:
              id: GO:0045814
              label: negative regulation of gene expression, epigenetic
        annotons:
          - id: fld_h3k4_demethylase
            label: "FLD: LSD1-type histone H3K4 demethylase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FLD (At3g10390)
                term:
                  id: UniProtKB:Q9CAE3
                  label: Protein FLOWERING LOCUS D
            function:
              preferred_term: histone H3K4 demethylase activity
              term:
                id: GO:0032453
                label: histone H3K4 demethylase activity
            processes:
              - preferred_term: negative regulation of gene expression, epigenetic
                term:
                  id: GO:0045814
                  label: negative regulation of gene expression, epigenetic
            locations:
              - preferred_term: chromatin
                term:
                  id: GO:0000785
                  label: chromatin
            evidence:
              - source_id: PMID:32541063
                statement: FLD with LD and SDG26 prevents H3K4me1 accumulation over FLC.
                supporting_text: >-
                  Here, we show that FLD tightly associates with LUMINIDEPENDENS (LD) and SET DOMAIN
                  GROUP 26 (SDG26) in vivo, and, together, they prevent accumulation of monomethylated
                  H3K4 (H3K4me1) over the FLC gene body.
              - source_id: PMID:17996704
                statement: FCA requires FLD for FLC downregulation.
                supporting_text: >-
                  Here, we show that FCA requires FLOWERING LOCUS D (FLD), a homolog of the human
                  lysine-specific demethylase 1 (LSD1) for FLC downregulation.
          - id: ld_fld_complex_scaffold
            label: "LD: Ref2/PNUTS-like subunit of the FLD complex"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LUMINIDEPENDENS (At4g02560)
                term:
                  id: UniProtKB:Q38796
                  label: Homeobox protein LUMINIDEPENDENS
            processes:
              - preferred_term: negative regulation of gene expression, epigenetic
                term:
                  id: GO:0045814
                  label: negative regulation of gene expression, epigenetic
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Scaffold subunit that associates with FLD and SDG26 and with the APRF1/TOPP4
              phosphatase module, linking termination at FLC to H3K4me1 removal. No MF term is
              asserted.
            evidence:
              - source_id: PMID:38851185
                statement: LD interacts with APRF1 and is structurally related to Ref2/PNUTS.
                supporting_text: >-
                  APRF1 interacts with TYPE ONE SERINE/THREONINE PROTEIN PHOSPHATASE 4 (TOPP4) (yeast
                  Glc7/human PP1) and LUMINIDEPENDENS (LD), the latter showing structural features
                  found in Ref2/PNUTS, all components of the yeast and human phosphatase module of the
                  CPF 3' end-processing machinery.
          - id: fve_histone_binding_prc2
            label: "FVE (MSI4): RbAp48-like histone-binding subunit of PRC2"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FVE / MSI4 (At2g19520)
                term:
                  id: UniProtKB:O22607
                  label: WD-40 repeat-containing protein MSI4
            function:
              preferred_term: histone binding
              term:
                id: GO:0042393
                label: histone binding
            processes:
              - preferred_term: epigenetic regulation of gene expression
                term:
                  id: GO:0040029
                  label: epigenetic regulation of gene expression
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Histone-binding subunit acting within a CLF-containing PRC2 (ESC/E(Z) complex, GO:0035098).
            evidence:
              - source_id: PMID:21282611
                statement: MSI4/FVE represses FLC through association with CLF-PRC2 and CUL4-DDB1.
                supporting_text: >-
                  Here we report that the MSI4 protein is a DDB1 and CUL4-associated factor that
                  represses FLC expression through its association with a CLF-Polycomb Repressive
                  Complex 2 (PRC2) in Arabidopsis.
          - id: fve_histone_binding_hdac
            label: "FVE (MSI4): histone-binding subunit of HDA5/HDA6-FLD deacetylase complexes"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FVE / MSI4 (At2g19520)
                term:
                  id: UniProtKB:O22607
                  label: WD-40 repeat-containing protein MSI4
            function:
              preferred_term: histone binding
              term:
                id: GO:0042393
                label: histone binding
            processes:
              - preferred_term: negative regulation of gene expression, epigenetic
                term:
                  id: GO:0045814
                  label: negative regulation of gene expression, epigenetic
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Histone-binding subunit of HDA5/HDA6-FLD histone deacetylase complexes (GO:0000118).
            evidence:
              - source_id: PMID:25922987
                statement: HDA5 interacts with FVE, FLD and HDA6 in a flowering-time complex.
                supporting_text: >-
                  Bimolecular fluorescence complementation assays and co-immunoprecipitation assays
                  showed that HDA5 interacts with FVE, FLD and HDA6, indicating that these proteins are
                  present in a protein complex involved in the regulation of flowering time.
              - source_id: PMID:14745447
                statement: FVE represses FLC through histone deacetylation.
                supporting_text: >-
                  We conclude that FVE participates in a protein complex repressing FLC transcription
                  through a histone deacetylation mechanism.
    - order: 3
      role: repressed output - FLC floral repressor
      node:
        id: flc_floral_repressor
        label: FLC floral repressor (regulated output)
        module_type: REGULATORY_STEP
        description: >-
          FLC is a MADS-box transcription factor that represses the floral integrators FT and SOC1.
          Its expression is the quantitative readout of the autonomous pathway.
        annotons:
          - id: flc_repressor
            label: "FLC: MADS-box repressor of floral integrators"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FLOWERING LOCUS C (At5g10140)
                term:
                  id: UniProtKB:Q9S7Q7
                  label: MADS-box protein FLOWERING LOCUS C
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Output target of the module; reviewed in genes/ARATH/FLC (read-only here).
            evidence:
              - source_id: PMID:21282611
                statement: FLC represses floral integrators such as FT.
                supporting_text: >-
                  FLC blocks floral transition by repressing flowering time integrators such as
                  FLOWERING LOCUS T ( FT )
    - order: 4
      role: de-repressed floral integrators
      node:
        id: floral_integrators
        label: Floral integrators FT and SOC1 (downstream output)
        module_type: REGULATORY_STEP
        description: >-
          Lower FLC levels relieve repression of FT (in leaves) and SOC1 (at the apex), which then
          promote the floral transition. Their activation mechanisms belong to other modules.
        annotons:
          - id: ft_florigen
            label: "FT: florigen, transcription coactivator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FLOWERING LOCUS T (At1g65480)
                term:
                  id: UniProtKB:Q9SXZ2
                  label: Protein FLOWERING LOCUS T
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            role_description: Downstream integrator de-repressed when FLC falls; read-only member.
          - id: soc1_integrator
            label: "SOC1: MADS-box floral integrator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOC1 (At2g45660)
                term:
                  id: UniProtKB:O64645
                  label: MADS-box protein SOC1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: vegetative to reproductive phase transition of meristem
                term:
                  id: GO:0010228
                  label: vegetative to reproductive phase transition of meristem
            role_description: Downstream integrator de-repressed when FLC falls; read-only member.
  connections:
    - source: coolair_proximal_polyadenylation
      target: flc_chromatin_repression
      connection_type: POSITIVELY_REGULATES
      description: >-
        Proximal termination of COOLAIR triggers FLD/LD/SDG26 H3K4 demethylation at FLC. FY-SDG26
        contacts and the APRF1/LD phosphatase module link the two steps.
      evidence:
        - source_id: PMID:19965720
          statement: Targeted antisense 3' processing triggers localized histone demethylase activity.
          supporting_text: >-
            This targeted processing triggers localized histone demethylase activity and results in
            reduced FLC sense transcription.
    - source: flc_chromatin_repression
      target: flc_floral_repressor
      connection_type: NEGATIVELY_REGULATES
      description: Chromatin modification silences FLC transcription.
      evidence:
        - source_id: PMID:17996704
          statement: FCA and FLD mediate H3K4 demethylation and transcriptional silencing of FLC.
          supporting_text: >-
            These data support a close association of FCA and FLD in mediating H3K4 demethylation and
            thus transcriptional silencing of FLC
    - source: flc_floral_repressor
      target: floral_integrators
      connection_type: NEGATIVELY_REGULATES
      description: FLC represses FT and SOC1 expression.
      evidence:
        - source_id: PMID:32392578
          statement: FLC negatively regulates the floral integrator FT.
          supporting_text: >-
            FLOWERING LOCUS C (FLC), a negative regulator of the key floral integrator FLOWERING LOCUS
            T (FT)
