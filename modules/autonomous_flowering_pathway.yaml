                  supporting_text: FCA physically binds COOLAIR in vitro and in vivo.
                - source_id: PMID:31043738
                  statement: FLL2 promotes FCA condensate formation and polyadenylation-factor assembly.
                function:
                  preferred_term: lncRNA binding
                  term:
                    id: GO:0106222
                    label: lncRNA binding
                processes:
                - &id003
                  preferred_term: RNA 3'-end processing
                  term:
                    id: GO:0031123
                    label: RNA 3'-end processing
              - id: fy_cpsf_subunit
                label: 'FY: Noncatalytic CPSF partner for FCA and SDG26'
