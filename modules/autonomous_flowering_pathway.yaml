id: MODULE:autonomous_flowering_pathway
title: Arabidopsis autonomous flowering contributions to FLC repression
description: Arabidopsis autonomous flowering regulators promote floral transition through overlapping
  mechanisms that reduce FLOWERING LOCUS C (FLC) expression. FCA and FY couple processing of COOLAIR antisense
  RNA to chromatin-associated and termination machinery involving FLD, LD, SDG26/ASHH1, APRF1 and TOPP4.
  FPA contributes through a distinct RNA-processing route; FLK recognizes modified FLC sense mRNA; FVE/MSI4
  supports chromatin-regulatory associations. These relationships vary with genetic background, dosage
  and locus. Reduced FLC can release repression of FT and SOC1, while FVE also has a distinct direct regulatory
  effect at FT. Conserved proteins in other plants share biochemical features without necessarily sharing
  this native RNA-target and chromatin circuit.
status: COMPLETE
scope: CONCRETE
module:
