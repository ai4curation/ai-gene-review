      label: FLC expression and target-specific repressor output
      module_type: BIOLOGICAL_PROCESS
      description: RNA/chromatin edges decrease FLC expression, thereby reducing availability of its repressor
        activity. This coarse causal node does not claim direct inhibition of FLC protein by RNA-processing
        factors.
      annotons:
      - id: flc_repressor
        label: 'FLC: FLC expression supplies a DNA-binding repressor of FT and SOC1 in the modeled branch'
