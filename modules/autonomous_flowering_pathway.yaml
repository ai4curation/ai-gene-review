  label: Arabidopsis autonomous contributions to FLC repression
  module_type: BIOLOGICAL_PROCESS
  description: FLC-regulatory contributions are selectable overlapping implementations, not universally
    interchangeable complete pathways. At least one nonempty upstream route and the FLC target are required
    to recognize a represented route; FT/SOC1 are optional readouts.
