notes: Native mechanistic envelope is Arabidopsis thaliana. All 13 native sampled gene products have complete
  individual reviews; rice FCA Q6K271 and OsFY Q0R3J2 are reviewed comparative evidence only and are not
  annoton representatives. Family descriptors document verified classification of exact GENE_PRODUCT selections
  and do not transfer FLC-specific function across broad families. COOLAIR is a lncRNA, so its processing
  uses GO:0031123 RNA 3'-end processing rather than an mRNA-specific term. The sampled route is not an
  exhaustive protein complex or a universal knockout-necessity rule. Quantitative feedback and graded
  versus Polycomb ON/OFF regulation are not reduced to an unvalidated kinetic simulation. FRIGIDA, photoperiod,
  cold-triggered vernalization and complete downstream floral identity programs remain outside the boundary.
  No cached GO-CAM index rows matched the 13 native accessions at audit time. Source-access and provider-failure
  details, exact logic scope and comparative evidence are in the companion notes.
evidence:
- source_id: PMID:31740502
  statement: The review describes reciprocal transcription–chromatin feedback that can reinforce the FLC
    repressed state, rather than a purely one-way RNA-processing handoff.
  supporting_text: The transcriptional output feeds back to influence the chromatin environment, reinforcing
    and stabilizing that state.
- source_id: PMID:36035698
  statement: The review proposes an NDX-stabilized R-loop at the COOLAIR-producing FLC 3-prime region
    as one chromatin/RNA interface. This is contextual synthesis; NDX is not added as an unreviewed participant.
  supporting_text: NDX stabilizes the R-loop at the FLC 3′-end
- source_id: PMID:38417841
  statement: The review illustrates species-dependent flowering adaptation through weakened rice photoperiod
    regulators, supporting a distinction between conserved components and a shared native FLC circuit.
  supporting_text: natural mutations in Ghd7 and Ghd8/DTH8 with reduced functions that enable rice to
    be cultivated in temperate regions.
- source_id: PMID:41840059
  statement: The review distinguishes graded FLC expression from ON/OFF control during early development
    and cold, supporting explicit limits on a qualitative signed graph.
  supporting_text: Graded expression and switching to ON/OFF control occur during early development and
    during long-term cold exposure
- source_id: PMID:41654258
  statement: The current review places FLC alternative splicing and m6A regulation alongside epigenetic
    regulation, supporting separate sense-RNA and chromatin routes without proving each edge itself.
  supporting_text: post-transcriptional, including alternative splicing (AS) and m⁶A RNA methylation
knowledge_gaps:
- gap_statement: The physiological substrate of the Arabidopsis APRF1/LD/TOPP4 CPF-like phosphatase module
    at FLC remains unidentified.
  boundary: Native phosphatase-module association and RNA Pol II phosphorylation/processivity effects
    do not distinguish direct Pol II CTD dephosphorylation from an elongation-factor substrate such as
    SPT5. TOPP4 catalytic activity on other substrates does not resolve this target.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines the biochemical connection between termination machinery and chromatin repression.
  resolution: Reconstitute the plant complex with candidate phosphorylated substrates and test substrate-site
    mutants at the endogenous locus.
  provenance:
  - reference_id: PMID:38851185
    supporting_text: Finally, the substrate of the CPF phosphatase module remains to be established.
