                      statement: Native accession and PANTHER DR classification verified against the official
                        PANTHER label.
                  taxon: *id001
                  notes: The exact gene product, not every classified family member, is selected.
                role_description: COOLAIR binding and recruitment of RNA-processing/chromatin partners.
