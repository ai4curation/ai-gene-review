                uses the RNA-level GO term. The later processivity feedback model concerns productive
                transcription and early termination at the locus, rather than an exclusively COOLAIR-specific
                feedback measurement. Constitutive CPSF, CstF64/77 and FLL2 are relevant partners outside
                the sampled gene panel; FCA and FY are not a complete catalytic machine.
              annotons:
              - id: fca_coolair_binding
                label: 'FCA: COOLAIR binding and recruitment of RNA-processing/chromatin partners'
                participant:
