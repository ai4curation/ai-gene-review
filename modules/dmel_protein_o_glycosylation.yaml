id: MODULE:dmel_protein_o_glycosylation
title: Protein O-glycosylation in Drosophila melanogaster
description: >-
  O-glycosylation attaches sugars to the hydroxyl groups of serine, threonine or hydroxylysine.
  Flies use several independent O-glycosylation pathways, each started by a dedicated transferase.
  Mucin-type O-GalNAc glycans are initiated by a family of polypeptide GalNAc transferases
  (Pgant) and extended by core 1 galactosyltransferase (C1GalTA) and glucuronyltransferase.
  EGF repeats of Notch and other receptors carry O-fucose added by Ofut1 and elongated by
  the GlcNAc transferase Fringe, and O-glucose added by Rumi and extended with xylose by Shams
  and Xxylt. Thrombospondin repeats are O-fucosylated by Ofut2. O-mannose glycans are added
  in the ER by the Rotated abdomen-Twisted (POMT1-POMT2) complex and, on cadherins, by the
  TMTC transferases. Nuclear and cytosolic proteins are modified by single O-GlcNAc residues
  by Super sex combs (OGT) and the modification is removed by O-GlcNAcase, while EGF repeats
  receive extracellular O-GlcNAc from Eogt. Collagen hydroxylysines are galactosylated after
  hydroxylation by Plod.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001683
  title: 'FlyBase gene group POMT1-2C: Pomt1-pomt2 complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as pomt1-pomt2 complex (POMT1-2C);
    this module models that group.
- source_id: FB:FBgg0002102
  title: 'FlyBase gene group POGLY: Protein o-glycosylation'
  statement: >-
    FlyBase release FB2026_03 groups 46 D. melanogaster genes as protein o-glycosylation (POGLY);
    this module models that group.
- source_id: GO:0006493
  title: protein O-linked glycosylation
  statement: >-
    GO term grounding the module as protein O-linked glycosylation.
notes: >-
  Boundary. FlyBase's protein O-glycosylation group also contains the chondroitin sulfate
  and heparan sulfate proteoglycan biosynthesis subgroups (GACSB, GAHSB), which are xylose-initiated
  O-glycans; they are modelled in the separate module dmel_glycosaminoglycan_biosynthesis
  and are excluded here. The POMT1-POMT2 complex group is realized as the POMT variant of
  the O-mannosylation part. The O-GalNAc, O-fucose, O-glucose and hydroxylysine branches are
  shown with their elongation steps in order; the different O-glycan classes are independent
  of one another. Super sex combs (sxc, OGT) is grounded to its FlyBase gene id because the
  generator's index has no UniProt accession for it. No molecular function is given to GlcAT-P
  in this branch (its glucuronyltransferase specificity on core 1 has been shown in vitro
  but the GO term for that acceptor is not established for this reaction) or to the TMTC transferases,
  whose O-mannosyltransferase activity in flies is inferred from their human orthologs. Plod
  is listed by FlyBase under O-galactosylation because lysine hydroxylation precedes galactose
  transfer; Plod itself is a hydroxylase. The intracellular O-GlcNAc cycle is a regulatory
  modification of nucleocytoplasmic proteins, distinct from the secretory-pathway glycans.
  FlyBase groups realized by this module: POMT1-2C (FBgg0001683), POGLY (FBgg0002102). Subgroups
  folded into it: POGLCN, POFUC, POMAN, POGLC, POGAL, POGALN. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_protein_o_glycosylation.yaml; none of the member genes has a gene
  review yet unless noted.
