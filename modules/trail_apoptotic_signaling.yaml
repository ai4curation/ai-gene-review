          domain then recruits procaspase-8, forming the TRAIL
          death-inducing signaling complex. Proximity-induced dimerisation
          activates caspase-8, which is released as the active protease.
        concepts:
          - preferred_term: TRAIL death-inducing signaling complex
            term:
              id: GO:0031266
              label: TRAIL death-inducing signaling complex
          - preferred_term: TRAIL death-inducing signaling complex assembly
            term:
              id: GO:1903074
              label: TRAIL death-inducing signaling complex assembly
        annotons:
          - id: fadd_disc_adaptor
            label: FADD adaptor bridging receptor to procaspase-8
            participant:
