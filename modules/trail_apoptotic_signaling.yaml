    - order: 3
      role: caspase-10 recruitment to the TRAIL DISC
      optional: true
      node:
        id: trail_disc_casp10
        label: Caspase-10 at the TRAIL DISC
        module_type: REGULATORY_STEP
        description: >-
          Caspase-10, the second death-effector-domain caspase, is recruited to
          and activated at the native TRAIL DISC in a FADD-dependent manner.
          It is present in human but has no rodent ortholog, and its
          contribution to apoptosis induction is disputed, so it is an optional
          part rather than an alternative initiator.
