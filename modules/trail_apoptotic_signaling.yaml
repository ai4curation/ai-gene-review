                  DISC in a FADD-dependent manner but cannot replace caspase-8.
                supporting_text: >-
                  Here we show that caspase-10 is recruited not only to the
                  native TRAIL DISC but also to the native CD95 DISC, and that
                  FADD is necessary for its recruitment to and activation at
                  these two protein complexes.
    - order: 4
