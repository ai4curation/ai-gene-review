          - id: bfrd1_siderophore_receptor_activity
            label: TonB-dependent outer-membrane ferric-siderophore receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: outer-membrane TonB-dependent ferric-siderophore receptors
                representative_members:
                  - preferred_term: bfrD1 (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M677
                      label: Outer membrane ferric siderophore receptor
                    description: >-
                      Variovorax paradoxus VPARA_25830; 739-residue
                      outer-membrane 22-stranded beta-barrel and plug-domain
