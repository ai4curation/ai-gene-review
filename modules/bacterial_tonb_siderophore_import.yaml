                      immediately downstream of tonB (VPARA_25820).
            function:
              preferred_term: siderophore uptake transmembrane transporter activity
              term:
                id: GO:0015344
                label: siderophore uptake transmembrane transporter activity
              substrates:
                - preferred_term: ferric-siderophore complex (extracellular)
              products:
                - preferred_term: ferric-siderophore complex (periplasmic)
            processes:
              - preferred_term: siderophore-iron import into cell
                term:
                  id: GO:0033214
                  label: siderophore-iron import into cell
            locations:
              - preferred_term: cell outer membrane
                term:
                  id: GO:0009279
                  label: cell outer membrane
            role_description: >-
              Binds extracellular ferric-siderophore complexes at the cell
              surface and, upon TonB engagement at its N-terminal plug-domain
              TonB box, undergoes conformational opening of the 22-stranded
              outer-membrane beta-barrel channel to import the complex into the
              periplasm.
  connections:
    - source: exbb_exbd_proton_motor_step
      target: tonb_energy_transduction_step
      connection_type: CAUSES
      description: >-
        Proton translocation down the cytoplasmic-membrane proton-motive force
        through the pentameric ExbB4 pore and dimeric ExbD5 Asp23 rotor drives
        conformational energization of TonB in the periplasm.
    - source: tonb_energy_transduction_step
      target: tbdt_siderophore_import_step
      connection_type: CAUSES
      description: >-
        TonB transduces the inner-membrane proton-motive force across the
        periplasm and physically engages the N-terminal TonB box of the
        outer-membrane receptor plug domain, driving conformational unplugging
        and ferric-siderophore translocation across the outer membrane.
  notes: >-
    Models the conserved three-part Gram-negative TonB-ExbB-ExbD-energized
    outer-membrane ferric-siderophore uptake mechanism (PMID:20420522;
    PMID:37219427), typed at the top level as BIOLOGICAL_PROCESS because it
    spans three coupled cell-envelope steps (inner-membrane ExbB4-ExbD5 proton
    translocation, periplasmic TonB energy transduction, and outer-membrane
    BfrD1 ferric-siderophore import, the last of which is typed TRANSPORT_STEP).
    Anchored by the complete four-gene Variovorax paradoxus
    exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) locus — ExbD5
    (A0A0H2M1F3), ExbB4 (A0A0H2MHH3), TonB (A0A0H2M2E3), and BfrD1 (A0A0H2M677)
    — together with the reviewed Pseudomonas putida KT2440 TonB exemplar
    (Q88C75, PP_5308). Because the InterPro domain entries on ExbB/ExbD
    (IPR002898, IPR003400), TonB (IPR006260, IPR036942), and TonB-dependent
    receptors (IPR000531, IPR012910, IPR010105) also span TolQ/TolR/MotA/MotB
    motors and receptors for vitamin B12, heme, nickel chelates, and
    carbohydrates, family selectors use descriptive preferred_term labels
    anchored by the curated representative members rather than broad
    superfamily accessions.
