id: MODULE:bacterial_tonb_siderophore_import
title: Bacterial TonB-energized outer-membrane ferric-siderophore import
description: >-
  A conserved Gram-negative bacterial transport module mediating active import
  of ferric-siderophore complexes across the outer membrane into the periplasm.
  Because the outer membrane lacks an electrochemical proton gradient, outer-membrane
  TonB-dependent ferric-siderophore receptors (such as BfrD1) rely on the
  inner-membrane TonB-ExbB-ExbD complex — comprising the pentameric ExbB
  proton-channel stator (ExbB4), the dimeric ExbD proton-coupling subunit
  (ExbD5), and the inner-membrane-anchored, periplasm-spanning energy transducer
  TonB — to harvest and transduce the cytoplasmic-membrane proton-motive force
  across the periplasmic space. Physical contact between the C-terminal domain
  of TonB and the N-terminal TonB box of the receptor plug domain drives
  conformational opening of the 22-stranded outer-membrane beta-barrel channel
  and translocation of the ferric-siderophore complex into the periplasm.
  Siderophore biosynthesis, extracellular siderophore secretion, and subsequent
  periplasmic-to-cytoplasmic ABC transport are outside this module boundary.
status: DRAFT
evidence:
  - source_id: GO:0033214
    title: siderophore-iron import into cell
    statement: >-
      GO:0033214 provides the biological-process context for receptor-mediated
      import of ferric-siderophore complexes into the bacterial cell.
  - source_id: GO:0031992
    title: energy transducer activity
    statement: >-
      GO:0031992 defines the proton-motive-force energy transduction activity of
      TonB that powers active outer-membrane transport.
  - source_id: PMID:20420522
    title: >-
      TonB-dependent transporters: regulation, structure, and function.
    statement: >-
      Establishes the conserved structural and mechanistic model of
      TonB-dependent outer-membrane transporters (22-stranded beta-barrel with
      an N-terminal luminal plug domain and TonB box) energized by the
      inner-membrane TonB-ExbB-ExbD proton-motive-force transducing complex.
    supporting_text: >-
      TonB-dependent transporters (TBDTs) are bacterial outer membrane proteins
      that bind and transport ferric chelates, called siderophores, as well as
      vitamin B(12), nickel complexes, and carbohydrates. The transport process
      requires energy in the form of proton motive force and a complex of three
      inner membrane proteins, TonB-ExbB-ExbD, to transduce this energy to the
      outer membrane.
  - source_id: PMID:37219427
    title: >-
      Energization of Outer Membrane Transport by the ExbB ExbD Molecular Motor.
    statement: >-
      Establishes that ExbB forms a pentameric inner-membrane pore enclosing an
      ExbD dimer that harvests the cytoplasmic-membrane proton-motive force and
      transmits mechanical energy to TonB.
    supporting_text: >-
      ExbB forms a pentamer with a pore inside, in which an ExbD dimer resides.
      This complex harvests the energy of the pmf and transmits it to TonB.
  - source_id: PMID:26412281
    title: >-
      An automated Genomes-to-Natural Products platform (GNP) for the discovery
      of modular natural products.
    statement: >-
      Demonstrates that Variovorax paradoxus S110 and P4B biosynthesize
      vacidobactin A/B and variobactin A/B nonribosomal peptide-polyketide
      siderophore natural products.
    supporting_text: >-
      Isolation of these indicated metabolites provided the novel compounds
      vacidobactin A and B, which are methylmalonate-incorporating acidobactins
      and represent the first natural products isolated from Variovorax
  - source_id: file:VARPD/exbB4/exbB4-ai-review.yaml
    title: Variovorax paradoxus exbB4 gene review
    statement: >-
      A0A0H2MHH3 (VPARA_25810) encodes the 238-residue inner-membrane ExbB4
      proton-channel stator subunit in the exbD5-exbB4-tonB-bfrD1
      (VPARA_25800-VPARA_25830) cluster.
    supporting_text: >-
      Pentameric inner-membrane proton-channel stator subunit of the
      TonB-ExbB-ExbD complex that conducts protons down the cytoplasmic-membrane
      electrochemical gradient to energize TonB-dependent outer-membrane
      ferric-siderophore transport.
  - source_id: file:VARPD/exbD5/exbD5-ai-review.yaml
    title: Variovorax paradoxus exbD5 gene review
    statement: >-
      A0A0H2M1F3 (VPARA_25800) encodes the 137-residue inner-membrane ExbD5
      proton-coupling subunit containing the conserved transmembrane Asp23
      residue in the exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) cluster.
    supporting_text: >-
      Dimeric inner-membrane proton-coupling subunit residing inside the ExbB4
      pentamer pore of the TonB-ExbB-ExbD complex that uses its conserved
      transmembrane Asp23 residue to couple proton translocation to periplasmic
      energization of TonB-dependent ferric-siderophore import.
  - source_id: file:VARPD/tonB/tonB-ai-review.yaml
    title: Variovorax paradoxus tonB gene review
    statement: >-
      A0A0H2M2E3 (VPARA_25820) encodes the 232-residue inner-membrane-anchored,
      periplasm-spanning TonB energy transducer encoded in the
      exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) cluster.
    supporting_text: >-
      Transduction of inner-membrane proton-motive force across the periplasmic
      space to outer-membrane TonB-dependent receptors to drive active
      ferric-siderophore uptake.
  - source_id: file:VARPD/bfrD1/bfrD1-ai-review.yaml
    title: Variovorax paradoxus bfrD1 gene review
    statement: >-
      A0A0H2M677 (VPARA_25830) encodes the 739-residue outer-membrane
      TonB-dependent ferric-siderophore receptor BfrD1 co-localized immediately
      downstream of tonB (VPARA_25820).
    supporting_text: >-
      TonB-dependent active uptake of ferric-siderophore complexes across the
      bacterial cell outer membrane into the periplasmic space.
  - source_id: file:PSEPK/tonB/tonB-ai-review.yaml
    title: Pseudomonas putida KT2440 tonB gene review
    statement: >-
      Q88C75 (PP_5308) encodes the Pseudomonas putida KT2440 TonB energy
      transducer that powers outer-membrane TonB-dependent siderophore
      receptors.
    supporting_text: >-
      Couples the cytoplasmic-membrane proton-motive force to outer-membrane
      TonB-dependent receptors.
