    (exbD5-exbB4-tonB-bfrD1) locus, together with the reviewed Pseudomonas
    putida KT2440 TonB exemplar (Q88C75, PP_5308). Because the InterPro domain
    entries on TonB (IPR006260, IPR036942) and TonB-dependent receptors
    (IPR000531, IPR012910, IPR010105) span receptors for vitamin B12, heme,
    nickel chelates, and carbohydrates in addition to ferric-siderophores,
    family selectors use descriptive preferred_term labels anchored by the
    curated representative members rather than broad superfamily accessions.
