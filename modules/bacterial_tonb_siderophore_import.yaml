  notes: >-
    Models the conserved two-part Gram-negative TonB-energized outer-membrane
    ferric-siderophore uptake mechanism (PMID:20420522), anchored by the
    co-localized Variovorax paradoxus tonB (A0A0H2M2E3, VPARA_25820) and bfrD1
