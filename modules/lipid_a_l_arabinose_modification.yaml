id: MODULE:lipid_a_l_arabinose_modification
title: ArnE/ArnF lipid A L-Ara4N donor flipping
description: >-
  A focused inner-membrane submodule of polymyxin-resistance lipid A
  modification in which ArnF acts with ArnE to move
  undecaprenyl-phosphate-alpha-L-Ara4N from the cytoplasmic leaflet to the
  periplasmic leaflet, positioning the lipid-linked aminoarabinose donor for
  ArnT-dependent transfer to lipid A. BasS/BasR-PmrA/PmrB induction, upstream
  ArnBCAD synthesis of the donor, and the ArnT transfer reaction are outside
  this reviewed ArnF-anchored module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0140303
    title: intramembrane lipid transporter activity
    statement: Defines the intramembrane lipid-flipping activity of ArnE/ArnF.
  - source_id: GO:0009103
    title: lipopolysaccharide biosynthetic process
    statement: >-
      Defines the lipopolysaccharide pathway that receives the ArnE/ArnF-flipped
      L-Ara4N donor.
  - source_id: file:genes/ECOLI/arnF/arnF-ai-review.yaml
    title: ECOLI arnF gene review
    statement: >-
      The completed E. coli arnF review grounds ArnF as a subunit of the
      undecaprenyl-phosphate-alpha-L-Ara4N flippase.
  - source_id: file:genes/ECOLI/arnE/arnE-ai-review.yaml
    title: ECOLI arnE gene review
    statement: >-
      The completed E. coli arnE review grounds ArnE as the partner subunit of
      the undecaprenyl-phosphate-alpha-L-Ara4N flippase.
  - source_id: PMID:17928292
    title: >-
      An undecaprenyl phosphate-aminoarabinose flippase required for polymyxin
      resistance in Escherichia coli.
    statement: >-
      Establishes that ArnE/PmrL and ArnF/PmrM are required for periplasmic
      accessibility of undecaprenyl-phosphate-alpha-L-Ara4N, L-Ara4N-modified
      lipid A, and polymyxin resistance.
notes: >-
  The completed ArnE and ArnF ECOLI reviews both support the focused flippase
  module. GO lacks an exact ATP-independent, substrate-specific intramembrane
  lipid flippase child of GO:0140303, so the module uses the parent GO
  molecular-function term and records the ontology gap.
