id: MODULE:dmel_nurd_complex
title: NuRD nucleosome remodeling and deacetylase complex in Drosophila melanogaster
description: >-
  NuRD couples ATP-dependent nucleosome remodeling by the CHD-family ATPase Mi-2 with histone
  deacetylation by HDAC1 (Rpd3). The deacetylase core also contains the MTA homolog MTA1-like
  and the histone-binding protein Caf1-55 (p55), and the complex further contains MBD-like,
  the GATAD2 homolog Simjang and CDK2AP1. NuRD represses transcription, contributes to Polycomb-dependent
  silencing of Hox genes, and in Drosophila Mi-2 also forms the dMec complex with the zinc-finger
  protein MEP-1.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000275
  title: 'FlyBase gene group NURD: Nucleosome remodeling deacetylase complex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as nucleosome remodeling deacetylase
    complex (NURD); this module models that group.
- source_id: GO:0016581
  title: NuRD complex
  statement: >-
    GO term grounding the module as NuRD complex.
notes: >-
  The split into remodeler, deacetylase core and MBD/GATAD2 module follows the conserved architecture
  of mammalian NuRD. MEP-1 is included because FlyBase lists it in the NuRD group; it is best
  characterised as the partner of Mi-2 in the dMec complex. FlyBase groups realized by this
  module: NURD (FBgg0000275). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_nurd_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
