id: MODULE:scer_saga_hat_module
title: SAGA histone acetyltransferase (HAT) module in Saccharomyces cerevisiae
description: >-
  The histone acetyltransferase (HAT) module is the Gcn5-containing subcomplex that carries out
  histone acetylation for the budding yeast SAGA coactivator, its variant SLIK (also called SALSA),
  and the smaller ADA complex. It has four subunits: the acetyltransferase Gcn5, the adaptor Ada2,
  Ngg1 (also called Ada3) and the reader Sgf29. Recombinant Gcn5 acetylates free histones and
  histone peptides but not nucleosomes. Ada2 binds Gcn5 and raises its activity, in part by
  increasing its affinity for acetyl-CoA, and links Ada3 to Gcn5; Ada2, Ada3 and Gcn5 together form
  a catalytic core that suffices for nucleosomal acetylation and for the expanded set of histone H3
  lysines acetylated by the native complexes. Sgf29 sits at the periphery of that core. Its tandem
  Tudor domain binds histone H3 di- or trimethylated at lysine 4, a mark of active promoters, and
  lets the module acetylate H3K4me3 nucleosomes preferentially and processively; it is needed in
  vivo for normal H3 acetylation but not for activity on peptides. Ada2 tethers the module to the
  rest of SAGA through its SWIRM domain, which is not needed for assembly of the ADA complex. The
  module acetylates histone H3 and H2B tails in promoter chromatin and so contributes to SAGA's
  coactivation of RNA polymerase II transcription.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:26401015
  title: Nucleosome competition reveals processive acetylation by the SAGA HAT module.
  statement: >-
    Defines the boundary: the HAT module is a separable SAGA subcomplex of Gcn5, Sgf29, Ada2 and
    Ada3.
  supporting_text: SAGA contains a separable subcomplex known as the histone acetyltransferase (HAT)
    module that contains the HAT, Gcn5, bound to Sgf29, Ada2, and Ada3.
- source_id: PMID:21734642
  title: Combinatorial depletion analysis to assemble the network architecture of the SAGA and ADA
    chromatin remodeling complexes.
  statement: >-
    The same module, including Sgf29, is present in SAGA, SLIK and ADA.
  supporting_text: the HAT module contains an additional protein, Sgf29, that is present in all Gcn5
    complexes
- source_id: PMID:11773077
  title: Role of the Ada2 and Ada3 transcriptional coactivators in histone acetylation.
  statement: >-
    Ada2, Ada3 and Gcn5 form a catalytic core that is enough for nucleosomal acetylation with the
    lysine specificity of the native complexes.
  supporting_text: We show that yeast Ada2, Ada3, and Gcn5 form a catalytic core of the ADA and
    Spt-Ada-Gcn5-acetyltransferase HAT complexes, which is necessary and sufficient in vitro for
    nucleosomal HAT activity and lysine specificity of the intact HAT complexes.
- source_id: PMID:9224714
  title: 'Yeast Gcn5 functions in two multisubunit complexes to acetylate nucleosomal histones:
    characterization of an Ada complex and the SAGA (Spt/Ada) complex.'
  statement: >-
    Gcn5 alone does not acetylate nucleosomes; the native Gcn5 complexes do.
  supporting_text: Although recombinant yeast Gcn5 efficiently acetylates free histones, it fails to
    acetylate histones contained in nucleosomes, indicating that additional components are required
    for acetylation of chromosomal histones.
- source_id: PMID:36965704
  title: The SAGA HAT module is tethered by its SWIRM domain and modulates activity of the SAGA DUB
    module.
  statement: >-
    Ada2's SWIRM domain anchors the module in SAGA but is not needed for the ADA complex, which
    contains the same four HAT-module proteins.
  supporting_text: the SWIRM domain is required for incorporation of the HAT module into the yeast
    SAGA complex, but not the ADA complex, a distinct six-protein acetyltransferase complex that
    includes the SAGA HAT module proteins
notes: >-
  Boundary. The module contains the four HAT-module subunits: Gcn5 (catalytic), Ada2 (Gcn5
  activator and module anchor), Ngg1/Ada3 and Sgf29 (H3K4me3 reader). Gcn5, Ada2 and Ada3 are
  modelled together as the catalytic core because together they are necessary and sufficient for
  nucleosomal acetylation (PMID:11773077); the core annoton lists each as an active unit. Sgf29 is a
  separate part: it is not needed for activity on peptides or for SAGA integrity, but it targets the
  module to H3K4me3 nucleosomes. The other SAGA modules (the Tra1/Spt activator-binding module, the
  TAF core and the Ubp8 deubiquitination module) and the ADA-specific subunits Ahc1 and Ahc2 are
  not parts; they are the host complexes' own components and belong to SAGA- and ADA-level
  modules. Histones are substrates, not parts.


  Ontology. GO has a term for SAGA's deubiquitination module (GO:0071819 DUBm complex) but none for
  the HAT module, although the GO:0000124 SAGA complex definition lists the module's subunits. The
  module concept therefore carries no GO id and a term is requested under proposed_new_terms. The
  three host complexes are GO:0000124 SAGA complex, GO:0046695 SLIK (SAGA-like) complex and
  GO:0140671 ADA complex, all is_a GO:0070461 SAGA-type complex. GO:0070461 is not the module: it
  names whole complexes, and its definition says they include TAFs, although the ADA complex
  classified under it has neither TAFs nor Spt proteins; that mismatch is recorded under
  proposed_ontology_changes. The gene reviews use GO:0000124 for in_complex because every subunit
  carries it.


  Chromatin. GO:0070461 SAGA-type complex is capable of histone acetyltransferase activity, so a
  reasoner classifies it, its three children and the proposed HAT module term under GO:0000123
  histone acetyltransferase complex, which is part_of GO:0000785 chromatin. For this module that
  inherited location is reasonable: Gcn5 alone cannot acetylate nucleosomes, the module's
  distinguishing activity is acetylation of nucleosomal histones, and Sgf29 reads a mark on
  chromatin. Unlike HAT-B (modules/scer_hat_b_complex.yaml) and Rtt109-Vps75
  (modules/scer_rtt109_vps75_complex.yaml), no activity of this module on non-chromatin histones
  is documented here, so no further change to the GO:0000123 edge is proposed.


  Gene reviews. GCN5, NGG1 and SGF29 have reviews in this repository; ADA2 is being reviewed in
  parallel. The Gcn5 unit uses GO:0010484 histone H3 acetyltransferase activity, the GCN5 core
  function, although the module also acetylates H2B. The Ada3 unit uses GO:0004402 histone
  acetyltransferase activity because the NGG1 review records it as a contribution to that
  activity; Ada3 has no catalytic activity. The Ada2 unit uses GO:0010698 acetyltransferase
  activator activity, supported by Ada2's stimulation of Gcn5 and its effect on acetyl-CoA binding
  (PMID:11773077, PMID:30224453).
