proposed_new_terms:
- proposed_name: SAGA-type HAT module complex
  proposed_definition: >-
    A protein complex that forms the histone acetyltransferase (HAT) module of SAGA-type complexes
    and acetylates nucleosomal histones, mainly H3 and H2B. It consists of the acetyltransferase
    GCN5/KAT2A or PCAF/KAT2B, ADA2, ADA3 and SGF29, or homologues thereof. In Saccharomyces
    cerevisiae the module (Gcn5p, Ada2p, Ngg1p/Ada3p and Sgf29p) is shared by the SAGA, SLIK and
    ADA complexes.
  justification: >-
    The HAT module is a separable, biochemically defined subcomplex: it can be purified as a
    recombinant unit that acetylates nucleosomes, its Ada2-Ada3-Gcn5 core is necessary and
    sufficient for nucleosomal acetylation, and the same four subunits are present in every Gcn5
    complex in yeast. GO already has the parallel term for SAGA's deubiquitination module,
    GO:0071819 DUBm complex, and the GO:0000124 SAGA complex definition enumerates the HAT module's
    subunits, but no term lets a curator annotate a subunit to the module itself, as opposed to
    one of its host complexes. The new term would be part_of GO:0070461 SAGA-type complex. Because
    it is capable of histone acetyltransferase activity it will be classified under GO:0000123
    histone acetyltransferase complex, and so under part_of chromatin; that is appropriate for a
    module whose defining activity is acetylation of nucleosomal histones. Suggested synonyms "HAT
    module" (exact) and "Gcn5-Ada2-Ada3-Sgf29 complex" (narrow, for budding yeast).
  proposed_parent:
    id: GO:0000123
    label: histone acetyltransferase complex
  supported_by:
  - reference_id: PMID:26401015
    supporting_text: SAGA contains a separable subcomplex known as the histone acetyltransferase (HAT)
      module that contains the HAT, Gcn5, bound to Sgf29, Ada2, and Ada3.
  - reference_id: PMID:21734642
    supporting_text: the HAT module contains an additional protein, Sgf29, that is present in all Gcn5
      complexes
  - reference_id: PMID:11773077
    supporting_text: We show that yeast Ada2, Ada3, and Gcn5 form a catalytic core of the ADA and
      Spt-Ada-Gcn5-acetyltransferase HAT complexes, which is necessary and sufficient in vitro for
      nucleosomal HAT activity and lysine specificity of the intact HAT complexes.
proposed_ontology_changes:
- change_type: NODE_TEXT_DEFINITION_CHANGE
  ontology: GO
  about_node:
    id: GO:0070461
    label: SAGA-type complex
  old_value: >-
    A histone acetyltransferase complex that acetylates nucleosomal histones H2B, H3, or H4 and is
    required for the expression of a subset of Pol II-transcribed genes. This complex includes the
    acetyltransferases GCN5/KAT2A or PCAF/KAT2B, several proteins of the ADA, SGF and SPT families,
    and several TBP-associate proteins (TAFs).
  new_value: >-
    A histone acetyltransferase complex that contains a histone acetyltransferase (HAT) module of
    GCN5/KAT2A or PCAF/KAT2B, ADA2, ADA3 and SGF29, or homologues thereof, and acetylates
    nucleosomal histones H2B, H3, or H4. Some SAGA-type complexes, such as SAGA and SLIK, also
    contain ADA1, TRRAP/TRA1 and members of the SPT and TAF protein families; others, such as the
    ADA and ATAC complexes, combine the HAT module with different accessory subunits.
  change_dsl: change definition of GO:0070461 to "A histone acetyltransferase complex that contains
    a histone acetyltransferase (HAT) module of GCN5/KAT2A or PCAF/KAT2B, ADA2, ADA3 and SGF29, or
    homologues thereof, and acetylates nucleosomal histones H2B, H3, or H4. Some SAGA-type
    complexes, such as SAGA and SLIK, also contain ADA1, TRRAP/TRA1 and members of the SPT and TAF
    protein families; others, such as the ADA and ATAC complexes, combine the HAT module with
    different accessory subunits."
  justification: >-
    GO:0140671 ADA complex and GO:0140672 ATAC complex are both asserted is_a GO:0070461, but the
    current definition says a SAGA-type complex includes several TBP-associated factors and
    proteins of the SPT family. The yeast ADA complex contains the HAT module (Gcn5, Ada2, Ada3,
    Sgf29) plus Ahc1 and Ahc2, and no TAFs or Spt proteins; GO's own ATAC definition lists DR1,
    KAT14, MBIP, WDR5, YEATS2 and ZZZ3 beside the HAT module, also without TAFs. What the children
    share is the HAT module, so the definition should rest on it. The change keeps every existing
    child in scope and matches how the ADA and ATAC definitions already describe themselves.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-18'
  supported_by:
  - reference_id: PMID:21734642
    supporting_text: However, our analysis revealed that ADA is actually composed of the additional
      two subunits, Sgf29 (as a member of the HAT/Core) and a previously unidentified polypeptide,
      YCR082W
  - reference_id: PMID:10490601
    supporting_text: The SAGA (Spt-Ada-Gcn5-acetyltransferase) complex contains several subunits which
      also function as part of other protein complexes, including a subset of TATA box binding
      protein-associated factors (TAFIIs) and Tra1.
knowledge_gaps:
- gap_statement: >-
    How the HAT module engages a nucleosome, and which surfaces of Ada3 and Ada2 make Gcn5 active
    on nucleosomal rather than free histones, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Gcn5 alone cannot acetylate nucleosomes, but in cryo-EM of yeast SAGA the HAT module could not
    be resolved, and became more mobile on nucleosome binding. A structure of the module bound to a
    nucleosome, with and without H3K4me3, would show how Ada3 supports nucleosomal activity and how
    the Sgf29 Tudor domain positions Gcn5 for processive acetylation.
  provenance:
  - reference_id: PMID:31969703
    supporting_text: the HAT module was invisible, suggesting it became flexible upon nucleosome
      binding
  - reference_id: PMID:36965704
    supporting_text: the HAT module subunits and molecular details of its interactions with the SAGA
      core could not be resolved
- gap_statement: >-
    Why the same HAT module acetylates different sets of sites in SAGA and in ADA is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    SAGA and ADA share all four HAT-module subunits yet give overlapping but distinct acetylation
    patterns, and ADA's only specific subunits, Ahc1 and Ahc2, have no known activity. Comparing
    the site specificity of the isolated module with SAGA, ADA and ADA lacking Ahc1 or Ahc2 would
    show whether the accessory subunits change the module's specificity or its substrates.
  provenance:
  - reference_id: PMID:10026213
    supporting_text: Ada and SAGA have overlapping, yet distinct, patterns of acetylation, suggesting
      that the association of specific subunits determines site specificity.
