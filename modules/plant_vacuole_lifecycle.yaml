id: MODULE:plant_vacuole_lifecycle
title: Plant vacuole lifecycle
description: The plant lytic vacuole, the largest compartment of most plant cells, is an acidic, hydrolase-filled
  organelle that also stores ions and metabolites and generates turgor. It grows from prevacuolar compartments
  and multivesicular bodies that fuse with the tonoplast, receives its hydrolases through sorting receptors,
  keeps its lumen acidic with the V-ATPase and the vacuolar pyrophosphatase, and in some cells is reorganized
  or dismantled, as in seed protein storage vacuoles and programmed cell death. This umbrella module composes
  the modules for those stages by reference. Intralumenal vesicle formation, hydrolase sorting, fusion
  with the tonoplast, acidification and tonoplast transport are required in the green lineage.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/plant_vacuole_fusion.yaml
  title: Rab7- and HOPS-dependent membrane fusion at the plant vacuole
  statement: Green-lineage Mon1-Ccz1, RabG3, HOPS and SNARE core.
- source_id: file:modules/plant_vacuolar_sorting_receptor_cycle.yaml
  title: Vacuolar sorting receptor cycle in plants
  statement: Green-lineage VSR and retromer core, with RMRs optional.
- source_id: file:modules/plant_tonoplast_transport.yaml
  title: Tonoplast proton pumping and solute transport in plants
  statement: Green-lineage V-PPase, TIP1 and vacuolar NHX core, with TPC1, TPK1, CLC-a and ALMT9 optional.
- source_id: file:modules/vacuolar_atpase_acidification.yaml
  title: V-ATPase acidification of vacuoles and lysosomes
  statement: Eukaryote-wide V-ATPase rule, satisfied by Arabidopsis.
- source_id: file:modules/escrt_iii_intralumenal_vesicle_formation.yaml
  title: ESCRT-III and Vps4 intralumenal vesicle formation
  statement: Eukaryote-wide ESCRT-III and Vps4 rule, satisfied by Arabidopsis.
notes: Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles and order slots
  follow the shared skeleton. Scoped to Viridiplantae because the fusion, sorting and tonoplast-transport
  rules are grounded in Arabidopsis; the ESCRT-III and V-ATPase rules are the eukaryote-wide ones that
  lysosome_lifecycle also requires. Read as a satisfiability rule, the umbrella is satisfied when all
  five referenced rules are. The sorting-receptor and tonoplast-transport rules are plant-only, like the
  fusion rule. Storage-vacuole biogenesis, vacuolar cell death and vacuole quality control are not modelled.
  The fusion part takes the skeleton's fusion slot (order 3), although the fusion modelled is mainly heterotypic
  delivery of prevacuolar compartments to the tonoplast rather than homotypic vacuole fusion. This umbrella
  overlaps lysosome_lifecycle, which covers lytic vacuoles eukaryote-wide and requires the same ESCRT-III
  and V-ATPase rules; it is kept separate because its fusion rule is grounded only in plant selectors,
  and it can fold into lysosome_lifecycle as a Viridiplantae variant once fungal and animal selectors
  exist.
module:
  id: plant_vacuole_lifecycle
  label: Plant vacuole lifecycle
  module_type: ORGANELLE_LIFECYCLE
  concepts:
  - preferred_term: vacuole organization
    term:
      id: GO:0007033
      label: vacuole organization
  - preferred_term: plant-type vacuole
    term:
      id: GO:0000325
      label: plant-type vacuole
  context:
    taxa:
    - preferred_term: Viridiplantae
      term:
        id: NCBITaxon:33090
        label: Viridiplantae
  parts:
  - order: 1
    role: biogenesis and protein supply
    node:
      id: ilv_formation
      label: ESCRT-III intralumenal vesicle formation (see MODULE:escrt_iii_intralumenal_vesicle_formation)
      module_ref: escrt_iii_intralumenal_vesicle_formation
      description: Multivesicular body formation on the route to the vacuole.
  - order: 1
    role: biogenesis and protein supply
    node:
      id: hydrolase_sorting
      label: Vacuolar sorting receptor cycle (see MODULE:plant_vacuolar_sorting_receptor_cycle)
      module_ref: plant_vacuolar_sorting_receptor_cycle
      description: VSR delivery of hydrolases and retromer recycling.
  - order: 3
    role: fusion
    node:
      id: vacuole_fusion
      label: Vacuole membrane fusion (see MODULE:plant_vacuole_fusion)
      module_ref: plant_vacuole_fusion
      description: Mon1-Ccz1, RabG3, HOPS and vacuolar SNAREs.
  - order: 4
    role: function
    node:
      id: acidification
      label: Vacuolar ATPase acidification (see MODULE:vacuolar_atpase_acidification)
      module_ref: vacuolar_atpase_acidification
      description: Eukaryote-wide V-ATPase rule.
  - order: 4
    role: function
    node:
      id: tonoplast_transport
      label: Tonoplast proton pumping and solute transport (see MODULE:plant_tonoplast_transport)
      module_ref: plant_tonoplast_transport
      description: V-PPase, TIP aquaporins, NHX exchangers and channels.
  connections:
  - source: ilv_formation
    target: vacuole_fusion
    connection_type: PROVIDES_INPUT_FOR
    description: Multivesicular bodies fuse with the tonoplast.
  - source: vacuole_fusion
    target: acidification
    connection_type: PROVIDES_INPUT_FOR
    description: Fusion delivers membrane and cargo to the acidified lumen.
  - source: hydrolase_sorting
    target: vacuole_fusion
    connection_type: PROVIDES_INPUT_FOR
    description: Receptor-sorted hydrolases reach the vacuole when prevacuolar compartments fuse with
      it.
  - source: acidification
    target: tonoplast_transport
    connection_type: PROVIDES_INPUT_FOR
    description: The V-ATPase gradient, with that of the V-PPase, drives secondary transport across the
      tonoplast.
