      connection_type: PROVIDES_INPUT_FOR
      description: >-
        QueA produces the epoxyqueuosine-tRNA consumed by QueG or QueH.
      chaining_status: VERIFIED
      chaining_note: Rhea 32155 product matches the Rhea 32159 substrate.
