                          asserted and no empty local slice is retained.
                        representative_members:
                          - preferred_term: QueH (Thermotoga maritima)
                            term:
                              id: UniProtKB:Q9WZJ0
                              label: Epoxyqueuosine reductase QueH
                            description: >-
                              Reviewed and experimentally characterized QueH
                              exemplar; also assigned InterPro IPR003828.
                          - preferred_term: QueH (Acinetobacter baylyi ADP1)
                            term:
                              id: UniProtKB:Q6FAK7
                              label: Epoxyqueuosine reductase QueH
                            description: >-
                              Reviewed exemplar from the organism in which
                              QueG and QueH single- and double-deletion
                              phenotypes established functional redundancy.
                    function:
                      preferred_term: epoxyqueuosine reductase activity
                      term:
                        id: GO:0052693
                        label: epoxyqueuosine reductase activity
                      substrates:
                        - preferred_term: epoxyqueuosine-modified tRNA
                        - preferred_term: reduced electron donor
                      products:
                        - preferred_term: queuosine-modified tRNA
                        - preferred_term: oxidized electron donor
                        - preferred_term: water
                      evidence:
                        - source_id: RHEA:32159
                          title: epoxyqueuosine reductase reaction
                          statement: >-
                            QueH catalyzes the same terminal reaction as QueG.
                        - source_id: PMID:34652139
                          statement: >-
                            Structural and biochemical work identifies QueH as
