                        - source_id: UniProtKB:Q9WZJ0
                          statement: >-
                            The reviewed Thermotoga maritima protein is assigned
                            EC 1.17.99.6 and Rhea 32159.
                    processes:
                      - preferred_term: tRNA queuosine(34) biosynthetic process
                        term:
                          id: GO:0008616
                          label: tRNA queuosine(34) biosynthetic process
                    role_description: >-
                      Completes mature Q34 formation through the
                      cobalamin-independent QueH route.
  connections:
    - source: quef_preq1_formation
      target: tgt_preq1_incorporation
