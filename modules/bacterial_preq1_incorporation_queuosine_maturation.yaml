          both families.
        variant_sets:
          - id: epoxyqueuosine_reductase_family_variants
            label: Epoxyqueuosine reductase family variants
            axis: enzyme family
            selection: ONE_OR_MORE
            variants:
              - id: queg_epoxyqueuosine_reductase_variant
                label: Cobalamin-dependent QueG route
                module_type: REACTION
                annotons:
                  - id: queg_activity
                    label: QueG epoxyqueuosine reductase activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: QueG epoxyqueuosine reductase family
                        term:
                          id: PANTHER:PTHR30002
                          label: EPOXYQUEUOSINE REDUCTASE
                        representative_members:
                          - preferred_term: QueG (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P39288
                              label: Epoxyqueuosine reductase
                            description: >-
                              Knockout accumulates epoxyqueuosine and lacks
                              queuosine; PAINT seed of PTHR30002 node
                              PTN001246364.
                          - preferred_term: QueG (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88DC7
                              label: Epoxyqueuosine reductase
                    function:
                      preferred_term: epoxyqueuosine reductase activity
                      term:
                        id: GO:0052693
                        label: epoxyqueuosine reductase activity
                      substrates:
                        - preferred_term: epoxyqueuosine-modified tRNA
                        - preferred_term: reduced electron donor
                      products:
                        - preferred_term: queuosine-modified tRNA
                        - preferred_term: oxidized electron donor
                        - preferred_term: water
                      evidence:
                        - source_id: RHEA:32159
                          title: epoxyqueuosine reductase reaction
                          statement: >-
                            Rhea 32159 defines reduction of
                            epoxyqueuosine-tRNA to mature queuosine-tRNA.
                        - source_id: file:PSEPK/queG/queG-uniprot.txt
                          statement: >-
                            Q88DC7 carries EC 1.17.99.6, two [4Fe-4S]
                            clusters, and cobalamin.
                        - source_id: file:genes/ECOLI/queG/queG-ai-review.yaml
                          statement: >-
                            The reviewed E. coli exemplar P39288 carries this
                            activity as its core function; its knockout
                            accumulates epoxyqueuosine and lacks queuosine.
                    processes:
                      - preferred_term: tRNA queuosine(34) biosynthetic process
                        term:
