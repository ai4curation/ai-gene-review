id: MODULE:bacterial_preq1_incorporation_queuosine_maturation
title: Bacterial preQ1 incorporation and queuosine maturation
description: >-
  A reusable bacterial pathway that converts preQ0 to the mature queuosine
  modification at wobble position 34 of tRNA(Asp), tRNA(Asn), tRNA(His), and
  tRNA(Tyr). QueF reduces preQ0 to preQ1, Tgt exchanges guanine-34 for preQ1,
  QueA transfers and rearranges the ribose moiety of S-adenosylmethionine to
  form epoxyqueuosine, and either QueG or the nonhomologous QueH family reduces
  epoxyqueuosine to queuosine.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0008616
    title: tRNA queuosine(34) biosynthetic process
    statement: >-
      GO:0008616 captures formation of queuosine at position 34 through the
      four reactions in this module.
  - source_id: UniPathway:UPA00392
    title: tRNA-queuosine biosynthesis
    statement: >-
      The four PSEPK proteins carry UniPathway UPA00392 membership.
  - source_id: file:PSEPK/queF/queF-uniprot.txt
    title: UniProtKB entry for PSEPK QueF
    statement: >-
      Q88KX9 is a reviewed NADPH-dependent preQ1 synthase assigned Rhea 13409.
  - source_id: file:PSEPK/tgt/tgt-uniprot.txt
    title: UniProtKB entry for PSEPK Tgt
    statement: >-
      Q88PL7 is a reviewed tRNA-guanine transglycosylase assigned Rhea 24104.
  - source_id: file:PSEPK/queA/queA-uniprot.txt
    title: UniProtKB entry for PSEPK QueA
    statement: >-
      Q88PL8 is a reviewed S-adenosylmethionine:tRNA
      ribosyltransferase-isomerase assigned Rhea 32155.
  - source_id: file:PSEPK/queG/queG-uniprot.txt
    title: UniProtKB entry for PSEPK QueG
    statement: >-
      Q88DC7 is assigned epoxyqueuosine reductase activity and Rhea 32159.
  - source_id: file:ECOLI/queF/queF-uniprot.txt
    title: UniProtKB entry for ECOLI QueF
    statement: >-
      Q46920 is a reviewed NADPH-dependent preQ1 synthase assigned Rhea 13409
      and EC 1.7.1.13 with experimental evidence, and is highly specific for
      preQ0.
  - source_id: file:ECOLI/tgt/tgt-uniprot.txt
    title: UniProtKB entry for ECOLI Tgt
    statement: >-
      P0A847 is a reviewed zinc-dependent tRNA-guanine transglycosylase
      assigned Rhea 24104 and EC 2.4.2.29 with experimental evidence.
  - source_id: file:ECOLI/queA/queA-uniprot.txt
    title: UniProtKB entry for ECOLI QueA
    statement: >-
      P0A7F9 is a reviewed S-adenosylmethionine:tRNA
      ribosyltransferase-isomerase assigned Rhea 32155 and EC 2.4.99.17 with
      experimental evidence, and follows an ordered bi-ter mechanism.
  - source_id: file:ECOLI/queG/queG-uniprot.txt
    title: UniProtKB entry for ECOLI QueG
    statement: >-
      P39288 is assigned epoxyqueuosine reductase activity, Rhea 32159,
      cob(II)alamin and two [4Fe-4S] clusters, and its deletion accumulates
      epoxyqueuosine while lacking queuosine.
  - source_id: file:modules/bacterial_preq1_incorporation_queuosine_maturation-deep-research-openscientist.md
    title: Reusable-module research for bacterial queuosine maturation
    statement: >-
      The pathway has the ordered core QueF, Tgt, QueA, and a final QueG or
      QueH epoxyqueuosine reductase, while preQ0 synthesis and salvage are
      outside this module boundary.
  - source_id: PMID:8323579
    title: >-
      tRNA-guanine transglycosylase from Escherichia coli. Overexpression,
      purification and quaternary structure.
    statement: >-
      Escherichia coli K-12 is the organism in which the ordered steps of this
      module were established experimentally, so its QueF, Tgt, QueA and QueG
      are carried as reviewed exemplars beside the Pseudomonas putida KT2440
      set.
  - source_id: PMID:34652139
    title: >-
      Epoxyqueuosine Reductase QueH in the Biosynthetic Pathway to tRNA
      Queuosine Is a Unique Metalloenzyme.
    statement: >-
      QueH is a structurally distinct, cobalamin-independent replacement or
      supplement for QueG that catalyzes the terminal epoxyqueuosine-reduction
      step.
  - source_id: PMID:28128549
    title: >-
      Identification of a Novel Epoxyqueuosine Reductase Family by
      Comparative Genomics.
    statement: >-
      Double-deletion and heterologous-complementation experiments establish
      DUF208/QueH as a nonorthologous QueG replacement, while Acinetobacter
      baylyi demonstrates that both families can coexist.
  - source_id: UniProtKB:Q9WZJ0
    title: Reviewed Thermotoga maritima QueH exemplar
    statement: >-
      Q9WZJ0 is a reviewed QueH epoxyqueuosine reductase in InterPro
      IPR003828 and PANTHER PTHR36701.
notes: >-
  This module begins with preQ0 supplied by upstream 7-deazaguanine
  biosynthesis and ends with mature Q34-tRNA. QueF therefore belongs here as
  the committed preQ1-supply reaction, but FolE/QueD/QueE/QueC and GTP supply
  are outside the boundary. The eukaryotic queuine-salvage route is also
  outside this bacterial module. Generic electron-donor regeneration and
  synthesis of the cobalamin and iron-sulfur cofactors used by QueG or the
  iron-sulfur cofactor used by QueH are supporting context, not pathway parts.
  Pseudomonas putida KT2440 implements the terminal step with QueG; QueH is
  retained as a reusable nonhomologous alternative, and Acinetobacter baylyi
  ADP1 encodes both.

  Ontology note: GO:0008479 formally defines free-queuine insertion
  (RHEA:16633), while the GOC-maintained IPR004803 and MF_00168 rules apply it
  to bacterial preQ1-inserting Tgt. The module keeps GO:0008479 as the
  established bacterial mapping, uses a preQ1-specific preferred term and Rhea
  24104 for the exact chemistry, and the Tgt gene reviews carry a proposed
  bacterial preQ1 transglycosylase term.

  Family note: PTHR46499 also contains archaeal tRNA-guanine(15)
  transglycosylases in the same subfamily (SF1) and archaeosine synthases in
  SF2, so its family review scopes GO:0008479 to SF1 rather than family-wide;
  HAMAP MF_00168 and NCBIfam TIGR00430 are the discriminating signatures for
  bacterial Tgt. That restriction is the source of the single remaining
  module_validator warning (FAMILY_SCOPE_RESTRICTED on tgt_activity): the
  family grounding is correct for both Tgt representatives, and the scope is
  narrowed truthfully rather than widened to silence the check. PAINT has no
  node-level annotations for PTHR36701, so the QueH descriptor asserts no
  ancestral node.
module:
  id: bacterial_preq1_incorporation_queuosine_maturation
  label: Bacterial preQ1 incorporation and queuosine maturation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: tRNA queuosine(34) biosynthetic process
      term:
        id: GO:0008616
        label: tRNA queuosine(34) biosynthetic process
      description: Formation of mature queuosine at tRNA wobble position 34.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Bacteria synthesize and insert preQ1 before on-tRNA maturation to
          queuosine.
  parts:
    - order: 1
      role: preQ1 formation
      node:
        id: quef_preq1_formation
        label: QueF-dependent preQ1 formation
        module_type: REACTION
        annotons:
          - id: quef_activity
            label: QueF preQ1 synthase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: QueF preQ1 synthase family
                term:
                  id: PANTHER:PTHR34354
                  label: NADPH-DEPENDENT 7-CYANO-7-DEAZAGUANINE REDUCTASE
                representative_members:
                  - preferred_term: QueF (Escherichia coli K-12)
                    term:
                      id: UniProtKB:Q46920
                      label: NADPH-dependent 7-cyano-7-deazaguanine reductase
                    description: >-
                      Directly assayed preQ0 reductase and the PAINT seed of
                      PTHR34354 node PTN002154489.
                  - preferred_term: QueF (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88KX9
                      label: NADPH-dependent 7-cyano-7-deazaguanine reductase
            function:
              preferred_term: preQ1 synthase activity
              term:
                id: GO:0033739
                label: preQ1 synthase activity
              substrates:
                - preferred_term: 7-cyano-7-carbaguanine (preQ0)
                - preferred_term: NADPH
              products:
                - preferred_term: 7-aminomethyl-7-carbaguanine (preQ1)
                - preferred_term: NADP+
              evidence:
                - source_id: RHEA:13409
                  title: preQ0-preQ1 oxidoreduction
                  statement: >-
                    Rhea 13409 defines the reversible EC 1.7.1.13 reaction;
                    the physiological reductive direction forms preQ1.
                - source_id: file:PSEPK/queF/queF-uniprot.txt
                  statement: Q88KX9 is annotated as the NADPH-dependent preQ1 synthase.
                - source_id: file:genes/ECOLI/queF/queF-ai-review.yaml
                  statement: >-
                    The reviewed E. coli exemplar Q46920 carries preQ1 synthase
                    activity as its core function on direct assay evidence.
            processes:
              - preferred_term: tRNA queuosine(34) biosynthetic process
                term:
                  id: GO:0008616
                  label: tRNA queuosine(34) biosynthetic process
            role_description: Supplies preQ1 for base exchange into target tRNAs.
    - order: 2
      role: preQ1 incorporation at tRNA position 34
      node:
        id: tgt_preq1_incorporation
        label: Tgt-dependent preQ1-tRNA formation
        module_type: REACTION
        annotons:
          - id: tgt_activity
            label: Tgt tRNA-guanine transglycosylase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial Tgt family
                term:
                  id: PANTHER:PTHR46499
                  label: QUEUINE TRNA-RIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: Tgt (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A847
                      label: Queuine tRNA-ribosyltransferase
                    description: >-
                      Purified zinc-dependent preQ1 transglycosylase and the
                      PAINT seed of the bacterial PTHR46499 nodes.
                  - preferred_term: Tgt (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PL7
                      label: Queuine tRNA-ribosyltransferase
            function:
              preferred_term: bacterial tRNA-guanosine(34) preQ1 transglycosylase activity
              term:
                id: GO:0008479
                label: tRNA-guanosine(34) queuine transglycosylase activity
              substrates:
                - preferred_term: preQ1
                - preferred_term: guanosine(34)-containing target tRNA
              products:
                - preferred_term: preQ1-modified tRNA
                - preferred_term: guanine
              evidence:
                - source_id: RHEA:24104
                  title: bacterial preQ1-tRNA base-exchange reaction
                  statement: >-
                    Rhea 24104 defines exchange of guanine-34 for preQ1.
                - source_id: file:PSEPK/tgt/tgt-uniprot.txt
                  statement: Q88PL7 carries EC 2.4.2.29 and Rhea 24104.
                - source_id: file:genes/ECOLI/tgt/tgt-ai-review.yaml
                  statement: >-
                    The reviewed E. coli exemplar P0A847 carries this activity
                    as its core function, from base exchange of guanosine-34
                    with preQ1 by the purified enzyme.
            processes:
              - preferred_term: tRNA queuosine(34) biosynthetic process
                term:
                  id: GO:0008616
                  label: tRNA queuosine(34) biosynthetic process
            role_description: Covalently installs preQ1 at the anticodon wobble position.
    - order: 3
      role: epoxyqueuosine formation
      node:
        id: quea_epoxyqueuosine_formation
        label: QueA-dependent epoxyqueuosine formation
        module_type: REACTION
        annotons:
          - id: quea_activity
            label: QueA SAM:tRNA ribosyltransferase-isomerase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: QueA family
                term:
                  id: PANTHER:PTHR30307
                  label: S-ADENOSYLMETHIONINE:TRNA RIBOSYLTRANSFERASE-ISOMERASE
                representative_members:
                  - preferred_term: QueA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A7F9
                      label: S-adenosylmethionine:tRNA ribosyltransferase-isomerase
                    description: >-
                      Kinetically characterized epoxyqueuosine synthase and the
                      PAINT seed of PTHR30307 node PTN000767999.
                  - preferred_term: QueA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PL8
                      label: S-adenosylmethionine:tRNA ribosyltransferase-isomerase
            function:
              preferred_term: S-adenosylmethionine:tRNA ribosyltransferase-isomerase activity
              term:
                id: GO:0051075
                label: S-adenosylmethionine:tRNA ribosyltransferase-isomerase activity
              substrates:
                - preferred_term: preQ1-modified tRNA
                - preferred_term: S-adenosyl-L-methionine
              products:
                - preferred_term: epoxyqueuosine-modified tRNA
                - preferred_term: adenine
                - preferred_term: L-methionine
              evidence:
                - source_id: RHEA:32155
                  title: epoxyqueuosine synthase reaction
                  statement: >-
                    Rhea 32155 defines QueA-dependent conversion of preQ1-tRNA
                    to epoxyqueuosine-tRNA.
                - source_id: file:PSEPK/queA/queA-uniprot.txt
                  statement: Q88PL8 carries EC 2.4.99.17 and Rhea 32155.
                - source_id: file:genes/ECOLI/queA/queA-ai-review.yaml
                  statement: >-
                    The reviewed E. coli exemplar P0A7F9 carries this activity
                    as its core function, from the purified enzyme forming oQ
                    from preQ1-tRNA in one AdoMet-dependent step.
            processes:
              - preferred_term: tRNA queuosine(34) biosynthetic process
                term:
                  id: GO:0008616
                  label: tRNA queuosine(34) biosynthetic process
            role_description: Builds the cyclopentenediol-containing epoxyqueuosine intermediate.
    - order: 4
