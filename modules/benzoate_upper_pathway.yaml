                description: >-
                  (alpha-beta)3 oxygenase of BenA and BenB, reduced by the
                  separate monomeric BenC reductase.
                active_units:
                  - id: bena_large_oxygenase
                    label: BenA catalytic oxygenase alpha subunit
                    role: >-
                      Carries the Rieske [2Fe-2S] cluster, the mononuclear
