      - statement: >-
          PcMNX1 decarboxylates syringate to dimethoxyhydroquinone, a reaction
          outside this module's boundary.
        supporting_text: >-
          Recombinant PcMNX1 catalyzed the NAD(P)H-dependent oxidative
          decarboxylation of SA to dimethoxyhydroquinone (DMHQ)
  - id: PMID:2824437
