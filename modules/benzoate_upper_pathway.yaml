id: MODULE:benzoate_upper_pathway
title: Benzoate upper degradation pathway
description: >-
  A bacterial aromatic-catabolism module for the aerobic upper benzoate
  degradation route that converts benzoate to catechol in two reactions. A
  multicomponent (class IB) Rieske benzoate 1,2-dioxygenase first
  dihydroxylates benzoate to the cis-dihydrodiol
  1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate. This enzyme is built from a
  BenA-family catalytic alpha subunit carrying the Rieske [2Fe-2S] cluster and
  the mononuclear iron, a BenB-family non-catalytic beta subunit, and a
  BenC-family NADH-dependent ferredoxin-reductase that delivers electrons
  directly to the oxygenase. A BenD-family NAD+-dependent short-chain cis-diol
  dehydrogenase then oxidatively decarboxylates the diol to catechol, which
  feeds catechol ring-cleavage and beta-ketoadipate modules. The route is
  conserved, with the same four-protein architecture and benABCD gene
  organization, in Gammaproteobacteria (Pseudomonas, Acinetobacter) and in
  Actinobacteria (Rhodococcus).
status: COMPLETE
scope: CONCRETE
references:
