      term:
        id: GO:0043639
        label: benzoate catabolic process
      description: >-
        Process-level grounding for benzoate breakdown by dioxygenation and
        dehydrogenation to catechol.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Aerobic benzoate-to-catechol routes using BenABC/BenD-family enzymes,
          experimentally characterized in Gammaproteobacteria (Pseudomonas,
          Acinetobacter) and Actinobacteria (Rhodococcus). The route is not
          universal among Bacteria.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The enzymes are soluble proteins purified from cell extracts, with
          no signal peptides or transmembrane segments.
  parts:
    - order: 1
      role: benzoate dioxygenation to a cis-dihydrodiol
      node:
        id: benabc_dioxygenation
        label: BenABC benzoate dioxygenation
        module_type: REACTION
        description: >-
          A two-component (class IB) Rieske benzoate 1,2-dioxygenase introduces
          both atoms of dioxygen into benzoate, producing the cis-dihydrodiol
          used by the downstream dehydrogenase step. The BenAB oxygenase does
          the oxygen chemistry; the BenC reductase supplies electrons from
          NADH directly to it.
