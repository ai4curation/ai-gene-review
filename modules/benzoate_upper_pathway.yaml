evidence:
  - source_id: GO:0043639
    title: benzoate catabolic process
    statement: >-
      GO:0043639 grounds the module. The route-specific term GO:0043640
      (benzoate catabolic process via hydroxylation) was obsoleted in GO
      release 2026-05-19 with replaced_by GO:0043639; the hydroxylation route,
      dioxygenation of benzoate to a cis-dihydrodiol intermediate followed by
      dehydrogenation to catechol, is carried by the module structure.
  - source_id: KEGG:M00551
    title: Benzoate degradation, benzoate to catechol
    statement: >-
      KEGG module M00551 captures the benzoate-to-catechol boundary
      implemented by benA, benB, benC and benD, and is the biochemical anchor
      for this module.
  - source_id: PMID:2824437
    title: Cloning and expression in Escherichia coli of Acinetobacter
      calcoaceticus genes for benzoate degradation.
    statement: >-
      The ADP1 benABCD genes are sufficient to convert benzoate to the cis-diol
      and then to catechol in E. coli, defining the two-reaction module
      boundary and the BenABC-before-BenD order.
    supporting_text: >-
      The catabolic genes necessary for the conversion of benzoate to catechol
      have been cloned from Acinetobacter calcoaceticus into Escherichia coli.
  - source_id: PMID:11673430
    title: Cloning and characterization of benzoate catabolic genes in the
      gram-positive polychlorinated biphenyl degrader Rhodococcus sp. strain RHA1.
    statement: >-
      The same four-gene route operates in the actinobacterium Rhodococcus
      jostii RHA1, via the same cis-diol intermediate, which is the basis for
      the Bacteria-wide (not Proteobacteria-only) taxon context.
    supporting_text: >-
      Escherichia coli cells containing RHA1 benABCD transformed benzoate to
      catechol via 2-hydro-1,2-dihydroxybenzoate.
  - source_id: PMID:11375157
    title: Cloning and expression of the benzoate dioxygenase genes from
      Rhodococcus sp. strain 19070.
    statement: >-
      An independent actinobacterial benzoate dioxygenase/dehydrogenase gene
      set shares the Pseudomonas ben gene order, while its reductase is
      longer than proteobacterial BenC; the reductase is the most
      architecturally variable component of the module.
    supporting_text: >-
      The reductase components of these latter dioxygenases, BenC and XylZ,
      are 201 residues shorter than the deduced BopZ sequence.
  - source_id: PMID:12534466
    title: Genomic analysis of the aromatic catabolic pathways from Pseudomonas putida KT2440
    statement: >-
      The KT2440 aromatic-catabolism map places the ben genes in a benzoate
      peripheral pathway feeding catechol into the beta-ketoadipate route.
  - source_id: PMID:11053377
    title: BenR, a XylS homologue, regulates three different pathways of aromatic acid degradation in Pseudomonas putida.
    statement: >-
      The BenR study identifies benABC as likely encoding the benzoate
      dioxygenase system and supports co-regulated benzoate-responsive
      expression in Pseudomonas putida.
  - source_id: KEGG:ppu00622
    title: Pseudomonas putida KT2440 xylene degradation
    statement: >-
      The broader KT2440 KEGG map ppu00622 that lists benA, benB, benC and benD
      intersects several aromatic maps; this module deliberately stops at
      catechol.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The local membership table lists benA, benB, benC, and benD in ppu00622
      and overlapping aromatic-catabolism maps, while PP_1791 and PP_2504 are
      ppu00621 lower-pathway spillover genes and are outside this module.
  - source_id: file:modules/benzoate_upper_pathway-deep-research-openscientist.md
    title: OpenScientist module research for benzoate upper degradation
    statement: >-
      OpenScientist module-level research supports the benzoate-to-catechol
      boundary, the obligatory ordering of BenABC dioxygenation before BenD
      dehydrogenation, conservation across Gram-negative and Gram-positive
      lineages, and the exclusion of downstream catechol cleavage and
      CoA-dependent benzoate routes from this module.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__benzoate_upper_pathway__ppu00622-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00622 benzoate upper-pathway review
    statement: >-
      OpenScientist concluded that the KT2440 benzoate upper pathway is covered
      by benA/benB/benC/benD, that PP_1791 and PP_2504 are lower meta-cleavage
      spillover candidates, and that the ppu00622 xylene map label is broader
      than the endogenous benzoate-to-catechol route.
  - source_id: PMID:42567519
    title: Structural basis for oxidative decarboxylation of lignin-derived aromatics
      by the fungal flavoprotein monooxygenase PcMNX1.
    statement: >-
      Assessed as a candidate member and declined. PcMNX1 performs
      decarboxylative hydroxylation of lignin-derived aromatic acids to
      hydroquinones, which is neither of this module's two reactions and does
      not yield the cis-dihydrodiol that BenD consumes; the paper is cited here
      only to record the boundary it helps delimit.
    supporting_text: >-
      Recombinant PcMNX1 catalyzed the NAD(P)H-dependent oxidative
      decarboxylation of SA to dimethoxyhydroquinone (DMHQ) and also
      converted other lignin-derived aromatics, including vanillic acid and
      4-hydroxybenzoic acid
notes: >-
  BOUNDARY. The module is the benzoate-to-catechol segment (KEGG M00551):
  benzoate 1,2-dioxygenation (GO:0018623) followed by cis-diol
  dehydrogenation (GO:0047116). Catechol ring cleavage (ortho or meta), the
  2-hydroxymuconate/4-oxalocrotonate steps, the CoA-dependent aerobic box route
  and anaerobic benzoyl-CoA routes are separate modules. The broader KEGG
  ppu00622 "xylene degradation" bucket in which the KT2440 genes appear
  intersects several aromatic maps; its PP_1791/PP_2504 ppu00621 spillover
  genes belong to downstream catechol/meta-cleavage modules.
  TAXONOMIC SCOPE. The route was first defined genetically and biochemically in
  Acinetobacter baylyi ADP1 (formerly A. calcoaceticus) and Pseudomonas putida,
  and the same benABCD architecture operates in the actinobacterium
  Rhodococcus jostii RHA1, so the context taxon is Bacteria rather than one
  genus. Representative members were chosen for experimental support in three
  genera spanning two phyla: P. putida KT2440 (PSEPK; gene reviews and genome
  context), A. baylyi ADP1 (ACIAD; reviewed Swiss-Prot entries, purified
  reconstituted enzyme, BenC crystal structure) and R. jostii RHA1 (RHOJR;
  heterologous reconstitution and a benA knockout). The pathway is not
  universal among bacteria. A UniProt query (2026-10-23) found no proteins
  matching the BenA (TIGR03229) or BenD (NF040811) equivalogs in Escherichia
  coli K-12, Bacillus subtilis 168, Saccharomyces cerevisiae or human, so
  E. coli appears here only as a heterologous host for reconstitution and no
  eukaryotic members are modelled. The closely related TOL-plasmid toluate dioxygenase XylXYZ and
  dehydrogenase XylL, and the Rhodococcus sp. 19070 BopXYZ/BopL system, are
  broader-specificity homologues of the same architecture that were not added
  as exemplars.
  MODELLING. Benzoate 1,2-dioxygenase is modelled as a protein complex with
  three role-bearing units rather than as three independent enablers. The
  BenA unit carries the dioxygenase activity (Rieske cluster, mononuclear
  iron and the main substrate-specificity determinants). The BenB unit is
  non-catalytic and is left without a separate GO function, since its gene
  reviews record contributes_to benzoate 1,2-dioxygenase activity. The BenC
  unit carries its own ferredoxin-NAD+ reductase activity. The reductase is
  the most architecturally variable component: RHA1 BenC (512 residues) and
  Rhodococcus sp. 19070 BopZ have C-terminal extensions absent from the
  proteobacterial proteins.
  FAMILY GROUNDING. Participants are grounded to the NCBIfam
  equivalogs that define each role exactly, rather than to PANTHER:
  TIGR03229 (benzoate 1,2-dioxygenase large subunit), TIGR03232 (small
  subunit), NF040810 (BenC) and NF040811 (BenD). All twelve representative
  proteins match their equivalog in UniProt. The PANTHER families containing
  these proteins are much broader and functionally heterogeneous:
  PTHR43756 "CHOLINE MONOOXYGENASE, CHLOROPLASTIC" (BenA, subfamily SF1
  "3-PHENYLPROPIONATE_CINNAMIC ACID DIOXYGENASE SUBUNIT ALPHA"), PTHR41534
  "BLR3401 PROTEIN" (BenB), PTHR47354 "NADH OXIDOREDUCTASE HCR" (BenC) and
  PTHR42760 "SHORT-CHAIN DEHYDROGENASES/REDUCTASES FAMILY MEMBER" (BenD).
  TreeGrafter propagation from these nodes produced the 3-phenylpropionate
  catabolism (BenB) and fatty-acid elongation (BenD) annotations that the
  member gene reviews remove. No PANTHER family or PAINT ancestral node is
  therefore asserted for any role. Each of the four families nevertheless has a
  completed FamilyReview recording where the pathway-specific subfamily sits and
  why the family term is too broad: interpro/panther/PTHR43756 (BenA, SF1),
  PTHR41534 (BenB, SF1), PTHR47354 (BenC, SF5) and PTHR42760 (BenD, SF123). Two
  of those reviews adjudicate the mis-propagations directly, each judged TOO_DEEP
  against the PANTHER 19 tree: PTN002222817 (GO:0019380, seeded only by E. coli
  HcaF but placed at the PTHR41534 root, so it reaches the BenB clade) and
  PTN001211919 (GO:0030497, seeded by FabG but placed at a Eubacteria node
  spanning 14 subfamilies including BenD's SF123).
  CANDIDATE ASSESSED, NOT MODELLED: PcMNX1 (PMID:42567519). A 2026 report
  identifies PcMNX1, a group A flavoprotein monooxygenase from the white-rot
  fungus Phanerodontia (Phanerochaete) chrysosporium, as the enzyme for
  NAD(P)H-dependent oxidative decarboxylation of syringate to
  dimethoxyhydroquinone; it also converts vanillate and 4-hydroxybenzoate,
  with products not stated in the cached abstract. It is not a member of this
  module. (i) Chemistry: PcMNX1 is a single-component FAD monooxygenase giving a
  hydroquinone, so it neither occupies either modelled step nor supplies the
  cis-dihydrodiol that BenD consumes. CO2 release is not a discriminator,
  since the BenD step is itself decarboxylating. (ii) Substrate, route and
  taxon: syringate rather than benzoate, the fungal lignin-aromatic
  hydroquinone route rather than benzoate-to-catechol, and a fungus rather
  than the Bacteria context. Its vanillate activity is also a different fate
  from the VanAB O-demethylation in
  hydroxycinnamate_vanillate_catabolism.yaml. (iii) Grounding: no UniProtKB
  entry cross-references PMID:42567519, and none was found for P.
  chrysosporium under the gene name MNX1. The related GsMNX1 of Gelatoporia
  (Ceriporiopsis) subvermispora was not run down further, so the
  not-found claim is deliberately narrow. Re-evaluate if a fungal
  lignin-derived aromatic catabolism module is created.
module:
  id: benzoate_upper_pathway
  label: Benzoate to catechol upper pathway
  module_type: METABOLIC_PATHWAY
  concepts:
