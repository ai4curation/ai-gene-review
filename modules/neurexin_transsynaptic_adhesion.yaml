id: MODULE:neurexin_transsynaptic_adhesion
title: Neurexin-centred trans-synaptic adhesion complexes
description: >-
  Neurexins are presynaptic type I transmembrane proteins that act as a hub for
  trans-synaptic adhesion. Their extracellular LNS domains bind a set of
  structurally unrelated postsynaptic or secreted partners, forming protein
  bridges that span the synaptic cleft, hold the pre- and postsynaptic
  membranes together, and signal in both directions to organize synaptic
  properties. The best-established partners are the neuroligins, which are
  catalytically inactive esterase-fold transmembrane proteins; the
  leucine-rich-repeat LRRTM proteins; and a tripartite bridge in which secreted
  cerebellin hexamers link neurexin to the amino-terminal domain of
  delta-family ionotropic glutamate receptors (GluD1/GluD2). Which partner a
  neurexin engages is controlled in large part by alternative splicing,
  notably at neurexin splice site 4. OUT OF SCOPE: the intracellular scaffolds
  recruited by the neurexin and partner cytoplasmic tails (CASK, Mint, PSD-95,
  gephyrin), the synaptic vesicle release machinery, and the many other
  neurexin ligands (dystroglycan, neurexophilins, latrophilins, calsyntenins,
  GABA-A receptor, cerebellin-independent C1q-like proteins). Each of these
  can be added as further partner variants or as a separate module.
status: DRAFT
evidence:
  - source_id: PMID:18923512
    title: Neuroligins and neurexins link synaptic function to cognitive disease.
    statement: >-
      Review establishing neurexins and neuroligins as synaptic
      cell-adhesion molecules bridging pre- and postsynaptic neurons.
    supporting_text: >-
      Neurexins and neuroligins are synaptic cell-adhesion molecules that
      connect presynaptic and postsynaptic neurons at synapses, mediate
      signalling across the synapse
  - source_id: PMID:20064387
    title: LRRTM2 functions as a neurexin ligand in promoting excitatory synapse formation.
    statement: >-
      Establishes that structurally unrelated postsynaptic partners converge on
      neurexin as a common presynaptic receptor, which is the organizing
      principle of this module.
    supporting_text: >-
      two unrelated postsynaptic cell-adhesion molecules, LRRTMs and
      neuroligins, unexpectedly bind to neurexins as the same presynaptic
      receptor
  - source_id: GO:0099560
    title: synaptic membrane adhesion
    statement: >-
      The module is grounded in the GO process describing adhesion between the
      pre- and postsynaptic membranes.
  - source_id: PANTHER:PTN002227321
    title: PAINT node PTN002227321 for the neurexin clade
    statement: >-
      Local PAINT IBD node in PTHR15036 (taxon Bilateria, NCBITaxon:33213)
      seeded by NRXN1/NRXN2/NRXN3 and fly and mouse orthologs, with propagated
      terms F:GO:0097109, F:GO:0004888, C:GO:0098820, C:GO:0048787,
      P:GO:0097116, P:GO:0007612, P:GO:0030534.
notes: >-
  Hub-and-partner module. The neurexin hub is the one required part; the
  postsynaptic side is modelled as a ONE_OR_MORE variant set because a single
  neurexin population can engage several partner classes, with alternative
  splicing (neurexin SS4, neuroligin splice site B) biasing the choice. The
  neurexin hub is anchored to the bilaterian PAINT node PTN002227321; the
  neuroligin partner is also bilaterian, whereas the LRRTM and cerebellin-GluD
  partners are documented in vertebrates. No PANTHER id is asserted for the
  LRRTM partner: UniProt cross-references LRRTM2 to PTHR45842, whereas PANTHER's
  own classification places it in PTHR45712:SF19, an LRRTM2-only subfamily of a
  broad leucine-rich-repeat family, so neither id cleanly names the LRRTM
  family. Molecular functions for the
  cerebellin and GluD annotons follow GOA (CBLN1 contributes_to GO:0030545, IDA
  PMID:27418511) and the completed GRID1 gene review. Only GRID1 has a gene
  review among the grounded members; NRXN1-3, NLGN1-4, LRRTM2, CBLN1 and GRID2
  are not yet reviewed.
