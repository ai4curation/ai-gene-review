id: MODULE:dmel_kpc_ubiquitin_ligase
title: Kip1 ubiquitination-promoting complex in Drosophila melanogaster
description: >-
  The Kip1 ubiquitination-promoting complex (KPC) is a heterodimeric E3 ubiquitin ligase first
  described in mammals, where the RING-finger protein KPC1 (RNF123) ubiquitylates substrates
  and KPC2 (UBAC1), a ubiquitin-like and UBA domain protein, links ubiquitylated substrates
  to the proteasome. Mammalian KPC promotes cytoplasmic degradation of the CDK inhibitor p27Kip1
  in G1. Drosophila Kpc1 and Kpc2 are the orthologs of these two subunits.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001735
  title: 'FlyBase gene group KPC: Kip1 ubiquitination-promoting complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as kip1 ubiquitination-promoting
    complex (KPC); this module models that group.
- source_id: GO:0000151
  title: ubiquitin ligase complex
  statement: >-
    GO term grounding the module as ubiquitin ligase complex.
notes: >-
  GO has no specific term for the KPC complex, so the module is grounded to the generic ubiquitin
  ligase complex term. The functions of KPC are known from mammals; Drosophila substrates
  have not been established, so no molecular function is assigned to the fly subunits. FlyBase
  groups realized by this module: KPC (FBgg0001735). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_kpc_ubiquitin_ligase.yaml; none of the member genes has a gene review
  yet unless noted.
