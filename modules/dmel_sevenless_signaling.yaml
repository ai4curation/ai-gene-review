id: MODULE:dmel_sevenless_signaling
title: Sevenless receptor tyrosine kinase signaling in Drosophila melanogaster
description: >-
  Sevenless is a receptor tyrosine kinase expressed in a subset of cells of the developing
  eye that is required for the R7 photoreceptor to adopt its fate. It is activated by Bride
  of sevenless, a seven-pass transmembrane ligand on the neighbouring R8 cell. The activated
  receptor recruits the adaptor Drk (Grb2), the docking protein Daughter of sevenless and
  the tyrosine phosphatase Corkscrew, which together activate Son of sevenless and Ras. Ras
  drives the Raf-MEK (Dsor1)-ERK (Rolled) cascade, aided by the scaffolds Ksr and Cnk. ERK
  phosphorylates the ETS factors Pointed (activating it) and Yan/Aop (relieving its repression),
  and induces Phyllopod, which with the E3 ligase Seven in absentia targets the repressor
  Tramtrack for degradation, allowing neuronal R7 differentiation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000941
  title: 'FlyBase gene group SEVL: Sevenless signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 30 D. melanogaster genes as sevenless signaling pathway
    (SEVL); this module models that group.
- source_id: GO:0045500
  title: sevenless signaling pathway
  statement: >-
    GO term grounding the module as sevenless signaling pathway.
- source_id: GO:0007465
  title: R7 cell fate commitment
  statement: >-
    GO term grounding the module as R7 cell fate commitment.
notes: >-
  Boundary. The Ras-ERK components are shared with other receptor tyrosine kinase pathways
  (EGFR, Torso, PVR); here they are the FlyBase Sevenless core components. Tramtrack is included
  as the substrate of the Phyllopod-Sina complex, as FlyBase places it among core components.
  FlyBase groups realized by this module: SEVL (FBgg0000941). Subgroups folded into it: SEVL-C.
  FlyBase also curates regulator sets for this pathway, which are context and not modelled
  as parts: SEVL-P (positive regulators of sevenless signaling pathway, 8 genes); SEVL-N (negative
  regulators of sevenless signaling pathway, 5 genes). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_sevenless_signaling.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
