id: MODULE:mitophagy
title: Mitophagy
description: >-
  Mitophagy is the selective macroautophagy of mitochondria. In animals,
  damaged or unwanted mitochondria are marked on their outer membrane and
  captured by phagophores decorated with Atg8-family proteins (LC3 and
  GABARAP in mammals, LGG-1 in nematodes). Two kinds of mark are used. In the
  ubiquitin-dependent route, the kinase PINK1 accumulates on the outer
  membrane of depolarized or import-defective mitochondria and phosphorylates
  ubiquitin and the ubiquitin-like domain of the RBR E3 ligase Parkin at
  Ser65. Activated Parkin builds ubiquitin chains on outer-membrane proteins,
  and in mammals these chains are read by soluble ubiquitin-binding receptors
  such as optineurin and NDP52, which also bind LC3/GABARAP and recruit the
  autophagy initiation machinery. In the receptor-mediated route, integral
  outer-membrane proteins bind Atg8-family proteins directly through
  LC3-interacting regions. BNIP3 and NIX (BNIP3L) act in hypoxia-induced and
  developmental mitophagy, such as mitochondrial clearance in maturing
  reticulocytes, and FUNDC1 acts in hypoxia-induced mitophagy. These
  receptors are conserved in nematodes, where the BNIP3/NIX ortholog DCT-1
  acts in stress-induced somatic mitophagy together with PINK-1 and the Parkin
  ortholog PDR-1, and the FUNDC1 ortholog FNDC-1 acts in
  hypoxia-reoxygenation mitophagy. Nematodes also have lineage-specific
  components. Paternal mitochondria and membranous organelles in the
  C. elegans embryo are cleared by the nematode-specific receptor ALLO-1
  (allophagy), and in worm muscle the FIS1-family proteins FIS-1 and FIS-2 act
  at a late step to complete orderly disposal of fission-derived
  mitochondrial fragments.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:24751536
    title: PINK1 phosphorylates ubiquitin to activate Parkin E3 ubiquitin ligase activity.
    statement: >-
      PINK1 phosphorylates ubiquitin at Ser65, the same position it
      phosphorylates in the Parkin ubiquitin-like domain, and phospho-ubiquitin
      activates Parkin.
    supporting_text: >-
      Using mass spectrometry, we discovered that endogenous PINK1
      phosphorylated ubiquitin at serine 65, homologous to the site
      phosphorylated by PINK1 in Parkin's ubiquitin-like domain.
  - source_id: PMID:26266977
    title: The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy.
    statement: >-
      In human cells, NDP52 and optineurin are the main receptors for
      PINK1/Parkin-mediated mitophagy.
    supporting_text: >-
      Using genome editing to knock out five autophagy receptors, we find that
      two previously linked to xenophagy, NDP52 and Optineurin, are the primary
      receptors for PINK1/Parkin-mediated mitophagy.
  - source_id: PMID:25896323
    title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
    statement: >-
      DCT-1 is a key mediator of stress-induced mitophagy in C. elegans, and
      mitophagy is coupled to mitochondrial biogenesis through SKN-1.
    supporting_text: >-
      We find that DCT-1 is a key mediator of mitophagy and longevity assurance
      under conditions of stress in C. elegans.
  - source_id: PMID:25896323
    title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
    statement: >-
      Impaired mitophagy triggers SKN-1 retrograde signalling that raises
      both mitochondrial biogenesis and DCT-1 expression.
    supporting_text: >-
      triggers mitochondrial retrograde signalling through the SKN-1
      transcription factor that regulates both mitochondrial biogenesis genes
      and mitophagy by enhancing DCT-1 expression
  - source_id: PMID:33734301
    title: Autophagy facilitates mitochondrial rebuilding after acute heat stress via a DRP-1-dependent process.
    statement: >-
      Secondary statement of the earlier primary finding that severe heat
      stress induces mitophagy in muscle that depends on DCT-1, PINK-1 and
      PDR-1, and that DCT-1/NIX and FUNDC1 are the known worm mitophagy
      receptors.
    supporting_text: >-
      a severe and prolonged HS induces a DCT-1
  - source_id: PMID:24196833
    title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
    statement: >-
      Nascent mitophagosomes are seen in worm muscle as LGG-1 spots on the
      mitochondrial surface. They are absent in pink-1 mutants.
    supporting_text: >-
      pink-1 single and pink-1 fis-1 fis-2 triple mutant animals had no
      colocalizing spots, as expected for a complete block of mitophagy
  - source_id: PMID:31153831
    title: Ubiquitination is required for the initial removal of paternal organelles in C. elegans.
    statement: >-
      Paternal mitochondria are removed by two temporally distinct routes, an
      early ubiquitin-dependent route and a later FNDC-1-dependent route.
    supporting_text: >-
      there are at least two different mechanisms for targeting paternal
      mitochondria for elimination: the first involving ubiquitination and a
      second involving a mitochondrial associated autophagy receptor, fndc-1
  - source_id: PMID:27145933
    title: >-
      FUNDC1 regulates mitochondrial dynamics at the ER-mitochondrial contact
      site under hypoxic conditions.
    statement: >-
      Human FUNDC1 also acts at ER-mitochondria contact sites as a DRP1
      adaptor for hypoxic fission. That role is outside this module and
      belongs with mitochondrial dynamics.
    supporting_text: >-
      Taken together, these findings reveal that FUNDC1 is not only a novel MAM
      protein that acts as an adaptor for DRP1 during the mitochondrial fission
      process, but also involved in hypoxia‐induced mitophagy.
  - source_id: file:genes/worm/pink-1/pink-1-ai-review.yaml
    title: worm pink-1 gene review
    statement: >-
      Core function: protein serine/threonine kinase activity in mitophagy at
      mitochondria. The ubiquitin and Parkin Ser65 phosphorylation mechanism
      is carried over from mammalian PINK1.
  - source_id: file:genes/human/PINK1/PINK1-ai-review.yaml
    title: human PINK1 gene review
    statement: >-
      Core function: damage-sensing ubiquitin and Parkin kinase (protein
      serine/threonine kinase activity) in mitophagy at the mitochondrial
      outer membrane.
  - source_id: file:genes/worm/pdr-1/pdr-1-ai-review.yaml
    title: worm pdr-1 gene review
    statement: >-
      Core function: RBR-family ubiquitin protein ligase activity in
      mitophagy, in the cytosol and on the mitochondrial outer membrane.
  - source_id: file:genes/human/PRKN/PRKN-ai-review.yaml
    title: human PRKN gene review
    statement: >-
      Core function: PINK1-activated RBR E3 ubiquitin ligase for damaged
      mitochondria (ubiquitin protein ligase activity in mitophagy).
  - source_id: file:genes/human/OPTN/OPTN-ai-review.yaml
    title: human OPTN gene review
    statement: >-
      Core function: receptor for PINK1/Parkin-dependent mitophagy that binds
      polyubiquitin through its UBAN domain and LC3/GABARAP through its LIR
      (protein-macromolecule adaptor activity in type 2 mitophagy).
  - source_id: file:genes/human/CALCOCO2/CALCOCO2-ai-review.yaml
    title: human CALCOCO2 gene review
    statement: >-
      Core function: selective-autophagy cargo adaptor in xenophagy and
      mitophagy.
  - source_id: file:genes/worm/dct-1/dct-1-ai-review.yaml
    title: worm dct-1 gene review
    statement: >-
      Core function: mitochondrion autophagosome adaptor activity
      (GO:0140580) in mitophagy at the mitochondrial outer membrane. The
      review records PINK-1-dependent ubiquitination of DCT-1 at Lys-26 under
      oxidative stress, from the full text of PMID:25896323.
  - source_id: file:genes/human/BNIP3/BNIP3-ai-review.yaml
    title: human BNIP3 gene review
    statement: >-
      Core functions: mitochondrion autophagosome adaptor activity in
      mitophagy, an ER-autophagosome adaptor role in reticulophagy, and
      hypoxia-induced promotion of macroautophagy. Pro-death activity is not
      treated as core.
  - source_id: file:genes/human/BNIP3L/BNIP3L-ai-review.yaml
    title: human BNIP3L gene review
    statement: >-
      Core function: NIX is a mitophagy receptor at the mitochondrial outer
      membrane (mitochondrion autophagosome adaptor activity), essential for
      mitochondrial elimination during reticulocyte maturation.
  - source_id: file:genes/worm/fndc-1/fndc-1-ai-review.yaml
    title: worm fndc-1 gene review
    statement: >-
      Core function: mitochondrion autophagosome adaptor activity
      (GO:0140580) in mitophagy at the mitochondrial outer membrane.
  - source_id: file:genes/human/FUNDC1/FUNDC1-ai-review.yaml
    title: human FUNDC1 gene review
    statement: >-
      Core functions: ubiquitin-independent mitophagy receptor (mitochondrion
      autophagosome adaptor activity), and a separate DRP1 adaptor role at
      ER-mitochondria contact sites in hypoxic fission.
  - source_id: file:genes/worm/allo-1/allo-1-ai-review.yaml
    title: worm allo-1 gene review
    statement: >-
      Core function: autophagy cargo adaptor activity in allophagy of
      paternal mitochondria and membranous organelles. Isoforms differ in
      cargo preference, and ALLO-1 also recruits the ULK complex.
  - source_id: file:genes/worm/lgg-1/lgg-1-ai-review.yaml
    title: worm lgg-1 gene review
    statement: >-
      Core function: PE-conjugated Atg8-family modifier on autophagosome
      membranes. The review accepts its mitophagy annotations and its direct
      binding to the ALLO-1 and SQST-1 receptors.
  - source_id: file:genes/human/GABARAP/GABARAP-ai-review.yaml
    title: human GABARAP gene review
    statement: >-
      Core function: Atg8-family protein conjugated to
      phosphatidylethanolamine on autophagic membranes (phosphatidylethanolamine
      binding), in autophagosome assembly, maturation and mitophagy.
  - source_id: file:genes/human/MAP1LC3B/MAP1LC3B-ai-review.yaml
    title: human MAP1LC3B gene review
    statement: >-
      Core function: Atg8-family protein conjugated to phospholipid on the
      autophagosome membrane (phosphatidylethanolamine binding), in
      autophagosome assembly and mitophagy.
  - source_id: file:genes/worm/sqst-1/sqst-1-ai-review.yaml
    title: worm sqst-1 gene review
    statement: >-
      Keeps the IBA mitophagy annotation as non-core because a role for
      SQST-1 in worm mitophagy has not been shown. SQST-1 is therefore not a
      member of this module.
  - source_id: file:projects/CAEEL_MITOPHAGY.md
    title: C. elegans Mitophagy and Mitochondrial Quality Control project page
    statement: >-
      Project page listing the worm mitophagy and mitochondrial dynamics
      gene reviews from which this module was first built.
notes: >-
  Boundary. This module covers the selective capture of mitochondria by the
  autophagy machinery in animals. It starts at the marking of a mitochondrion
  (PINK1/Parkin ubiquitin signalling, or an outer-membrane receptor) and ends
  at receptor engagement of Atg8-family proteins on the phagophore and, in
  nematodes, the FIS-1/FIS-2-dependent completion of disposal. Building the
  autophagosome (ULK1 initiation, PI3KC3-C1 PI3P synthesis, ATG9, ATG2/WIPI,
  and the ATG7/ATG3/ATG16L1 lipidation cascade) is the subject of
  MODULE:metazoan_autophagosome_biogenesis and is not re-modeled here; the
  Atg8-family proteins appear only in their role as the docking site that
  receptors bind. Autophagosome-lysosome fusion and degradation are also
  downstream and outside this boundary. The phagophore-ER contact that
  supplies lipid for phagophore growth is MODULE:phagophore_organelle_contact_site.
  The ER-mitochondria contact (MAM), where worm FIS-1 and human FUNDC1 also
  act, is a separate structure from the phagophore-ER contact.

  Taxon. The context is Eumetazoa. PAINT places the IBD statements for the
  PINK1 node (PTN001121970) and the BNIP3/NIX node (PTN001032684) at
  Eumetazoa, and the Parkin mitophagy node (PTN000188399) at Bilateria. The
  FUN14 and Atg8 family nodes are eukaryotic, so those two roles are older
  than the module. Mitophagy also occurs in fungi and plants, but there it
  uses different receptors (for example yeast Atg32) and no PINK1 or Parkin,
  so the boundary modeled here does not hold outside animals. Worm and human
  are the representatives. Drosophila Pink1 and parkin are classic genetic
  models of the ubiquitin route but have no gene review here, so they are
  not listed as representatives.

  Lineage differences. The ubiquitin-reading soluble receptors optineurin
  and NDP52 (CALCOCO2) are vertebrate proteins; no clear C. elegans ortholog
  of either has been identified, and which protein reads PDR-1-made ubiquitin
  in worms is unknown. ALLO-1 and the FIS-1/FIS-2 late disposal step are known
  only in C. elegans. In worms, PINK-1 and PDR-1 are placed in mitophagy by
  genetics (reporters, epistasis, LGG-1 colocalization) and by PDR-1 E3 ligase
  activity toward other substrates; ubiquitin Ser65 phosphorylation and
  phosphorylation-driven PDR-1 activation are carried over from the human
  and insect biochemistry.

  Fission. Stress-induced mitophagy in worm muscle uses MFF-dependent DRP-1
  fission upstream of the FIS-1/FIS-2 step. The fission machinery itself is
  in MODULE:mitochondrial_dynamics. Fission is not required for every route:
  oxidative-stress-induced neuronal mitophagy in worms is drp-1-independent
  but partly pink-1-dependent (PMID:35916724). Fission is therefore recorded
  as context, not as a required part. Human FUNDC1 has a second,
  separate role as a DRP1 adaptor at ER-mitochondria contacts during hypoxia
  (PMID:27145933); that fission role is out of scope here.

  Members left out. SQSTM1/p62 (worm SQST-1) is excluded: the worm review
  keeps the mitophagy annotation as non-core with no worm evidence, its
  demonstrated worm role is aggrephagy, and in human cells it is not one of
  the primary PINK1/Parkin mitophagy receptors (PMID:26266977). TAX1BP1 and
  NBR1 are minor receptors in that assay and are not modeled. TBK1 (worm
  IKKE-1) phosphorylates optineurin, NDP52 and ALLO-1 and is described in the
  receptor annotons, not modeled as its own member. Human FIS1 has no gene
  review here and is not modeled; its role in mammalian mitophagy is
  recorded only in notes. BNIP3 and NIX pro-death (BH3-like) activity and
  their ER-phagy role are not part of this module. MIRO1 is a PINK1 and
  Parkin substrate but is not a mitophagy receptor. The E2 enzymes UBC-18 and
  UBC-16 that ubiquitinate paternal membranous organelles, and the
  transcriptional regulators SKN-1, ATFS-1 and DAF-16, are context, not
  machinery. ATFS-1 and the mitochondrial unfolded protein response are in
  MODULE:mitochondrial_upr.

  Accessions. LGG-1 is Q09490, the accession used by the lgg-1 review and
  UniProt. The project page gives a different accession.

  PANTHER. The PINK1 subfamily (PTHR22972:SF7), the BNIP3/NIX family
  (PTHR15186) and the Atg8 family (PTHR10969) contain both the worm and human
  representatives. No family term is given for Parkin, because the UniProt
  PANTHER cross-reference for human PRKN (PTHR10677) differs from the PAINT
  family that holds the Parkin node (PTHR11685), or for FUNDC1, because the
  FUN14 family (PTHR21346) also contains FUNDC2 and yeast Fun14, which are
  not mitophagy receptors.
module:
  id: mitophagy
  label: Mitophagy
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Selective macroautophagy of mitochondria in animals. Damaged or unwanted
    mitochondria are marked by PINK1/Parkin ubiquitin signalling or by
    outer-membrane receptors (BNIP3/NIX, FUNDC1, and the nematode ALLO-1);
    ubiquitin-reading or membrane-integral receptors engage Atg8-family
    proteins on the phagophore; and, in nematodes, FIS-1/FIS-2 complete
    orderly disposal of fission-derived mitochondrial fragments.
  concepts:
    - preferred_term: mitophagy
      term:
        id: GO:0000423
        label: mitophagy
  context:
    taxa:
      - preferred_term: Eumetazoa
        term:
          id: NCBITaxon:6072
          label: Eumetazoa
        description: >-
          PAINT places the PINK1 and BNIP3/NIX IBD nodes at Eumetazoa and the
          Parkin mitophagy node at Bilateria. Representatives are human and
          C. elegans.
    cellular_components:
      - preferred_term: mitochondrial outer membrane
        term:
          id: GO:0005741
          label: mitochondrial outer membrane
        description: >-
          Shared site of marking. PINK1 accumulates there, Parkin is recruited
          there, and BNIP3/NIX, FUNDC1, worm FIS-1 and FIS-2 are outer-membrane
          proteins.
    conditions:
      - preferred_term: mitochondrial depolarization or import failure
      - preferred_term: hypoxia or hypoxia-reoxygenation
      - preferred_term: oxidative, heat or mitochondrial toxin stress in adult tissues
      - preferred_term: developmental clearance (reticulocyte maturation; paternal mitochondria after fertilization)
  parts:
    - order: 1
      role: ubiquitin-dependent marking of damaged mitochondria
      node:
        id: pink1_parkin_marking
        label: PINK1/Parkin ubiquitin signalling on damaged mitochondria
        module_type: SIGNALING_PATHWAY
        description: >-
          PINK1 is a mitochondrially targeted serine/threonine kinase. It is
          normally imported and degraded, but when import fails on
          depolarized mitochondria it accumulates on the outer membrane,
          phosphorylates ubiquitin and the Parkin ubiquitin-like domain at
          Ser65, and so recruits and activates Parkin. Parkin is an RBR E3
          ubiquitin ligase that builds ubiquitin chains on outer-membrane
          proteins, which PINK1 phosphorylates in turn, making a feed-forward
          loop. In C. elegans, pink-1 is required for nascent LGG-1-positive
          mitophagosomes on muscle mitochondria, the Parkin ortholog PDR-1
          joins the stalled mitophagy intermediates seen in fis-1 fis-2
          mutants, and the receptor DCT-1 is ubiquitinated in a
          PINK-1-dependent manner under oxidative stress.
        concepts:
          - preferred_term: type 2 mitophagy
            term:
              id: GO:0061734
              label: type 2 mitophagy
            description: >-
              The GO term for damage-initiated, Parkin-dependent mitophagy. In
              mammalian cells the trigger is depolarization. In worms the
              initiating signal is oxidative, heat or toxin stress, and
              depolarization has not been tested as the trigger.
        evidence:
          - source_id: PMID:22354088
            title: >-
              Mitochondrial processing peptidase regulates PINK1 processing,
              import and Parkin recruitment.
            statement: >-
              When import is compromised, PINK1 accumulates on the
              mitochondrial surface and recruits Parkin from the cytosol.
            supporting_text: >-
              However, when mitochondrial import is compromised by
              depolarization, PINK1 accumulates on the mitochondrial surface
              where it recruits the PD-linked E3 ubiquitin ligase Parkin from
              the cytosol, which in turn mediates the autophagic destruction of
              the dysfunctional organelles.
          - source_id: PMID:24196833
            title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
            statement: >-
              Stalled mitophagy intermediates in worm fis-1 fis-2 mutants are
              the product of PINK-1-induced mitophagy.
            supporting_text: >-
              do indicate that LGG-1 aggregates in Fis1 mutants are an
              aberrant product of Pink1-induced mitophagy
          - source_id: PMID:35916724
            title: >-
              Selective disruption of Drp1-independent mitophagy and
              mitolysosome trafficking by an Alzheimer's disease relevant tau
              modification in a novel Caenorhabditis elegans model.
            statement: >-
              Oxidative-stress-induced neuronal mitophagy in worms is
              drp-1-independent and at least partly pink-1-dependent.
            supporting_text: >-
              Both oxidative-stress-induced mitophagy and the ability of T231E to
              suppress it were independent of drp-1, but at least partially
              dependent on pink-1.
        annotons:
          - id: pink1_kinase
            label: PINK1 ubiquitin and Parkin kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PINK1 mitochondrial serine/threonine kinases
                term:
                  id: PANTHER:PTHR22972:SF7
                  label: SERINE_THREONINE-PROTEIN KINASE PINK1, MITOCHONDRIAL
                representative_members:
                  - preferred_term: PINK1 (human)
                    term:
                      id: UniProtKB:Q9BXM7
                      label: Serine/threonine-protein kinase PINK1, mitochondrial
                  - preferred_term: PINK-1 (worm)
                    term:
                      id: UniProtKB:Q09298
                      label: Serine/threonine-protein kinase pink-1, mitochondrial
                ancestral_nodes:
                  - preferred_term: PAINT PINK1 node PTN001121970
                    term:
                      id: PANTHER:PTN001121970
                      label: PTN001121970
                    description: >-
                      Eumetazoan node with IBD statements for protein
                      serine/threonine kinase activity, mitochondrion and
                      autophagy of mitochondrion. Both human PINK1 and worm
                      PINK-1 receive IBA rows from it.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001121970 in PTHR22972.
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              description: >-
                Substrates are ubiquitin and the Parkin ubiquitin-like domain
                (Ser65), shown for human and insect PINK1. They have not been
                shown biochemically for the worm protein.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Damage sensor and initiating kinase. Its stabilization on the
              outer membrane reports import failure, and its phospho-ubiquitin
              product recruits and activates Parkin.
            evidence:
              - source_id: PMID:24751536
                title: PINK1 phosphorylates ubiquitin to activate Parkin E3 ubiquitin ligase activity.
                statement: >-
                  Recombinant PINK1 phosphorylates ubiquitin, and
                  phospho-ubiquitin activates Parkin in cell-free assays.
                supporting_text: >-
                  Recombinant TcPINK1 directly phosphorylated ubiquitin and
                  phospho-ubiquitin activated Parkin E3 ubiquitin ligase activity
                  in cell-free assays.
              - source_id: PMID:24660806
                title: Parkin is activated by PINK1-dependent phosphorylation of ubiquitin at Ser65.
                statement: PINK1 phosphorylates ubiquitin Ser65 directly.
                supporting_text: >-
                  Remarkably, PINK1 directly phosphorylates Ser65 of ubiquitin in
                  vitro.
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  In worms, pink-1 loss abolishes LGG-1/TOM-70 colocalizing
                  spots (nascent mitophagosomes) on muscle mitochondria.
                supporting_text: >-
                  pink-1 single and pink-1 fis-1 fis-2 triple mutant animals had
                  no colocalizing spots, as expected for a complete block of
                  mitophagy
              - source_id: PMID:26469957
                title: >-
                  A bacterial metabolite induces glutathione-tractable
                  proteostatic damage, proteasomal disturbances, and
                  PINK1-dependent autophagy in C. elegans.
                statement: >-
                  In worms, metabolite-induced LGG-1 puncta require pink-1.
                supporting_text: >-
                  Notably, animals with reduced pink-1 no longer have increased
                  mCherry::LGG-1 accumulation in the presence of the metabolite.
          - id: parkin_ligase
            label: Parkin RBR E3 ubiquitin ligase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Parkin RBR E3 ubiquitin ligases
                description: >-
                  No PANTHER family term is given: the UniProt PANTHER
                  cross-reference for human PRKN (PTHR10677) differs from the
                  PAINT family that holds the Parkin node (PTHR11685), which
                  also holds worm PDR-1.
                representative_members:
                  - preferred_term: PRKN (human)
                    term:
                      id: UniProtKB:O60260
                      label: E3 ubiquitin-protein ligase parkin
                  - preferred_term: PDR-1 (worm)
                    term:
                      id: UniProtKB:Q9XUS3
                      label: E3 ubiquitin-protein ligase parkin
                ancestral_nodes:
                  - preferred_term: PAINT Parkin node PTN000188399
                    term:
                      id: PANTHER:PTN000188399
                      label: PTN000188399
                    description: >-
                      Bilaterian node in PTHR11685 with an IBD statement for
                      mitophagy, seeded by human, mouse, rat, fly and worm
                      Parkin. Both human PRKN and worm PDR-1 receive the
                      mitophagy IBA from it.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000188399 in PTHR11685.
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
              description: >-
                Activated by PINK1 phosphorylation of its ubiquitin-like domain
                and by binding phospho-ubiquitin. Worm PDR-1 ligase activity
                has been shown toward CED-10/Rac1; its mitophagy substrates in
                worms are not identified.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
              - preferred_term: protein ubiquitination
                term:
                  id: GO:0016567
                  label: protein ubiquitination
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              E3 ligase that is recruited from the cytosol to damaged
              mitochondria and coats their outer-membrane proteins with
              ubiquitin chains, the mark read by ubiquitin-binding receptors.
            evidence:
              - source_id: PMID:19029340
                title: >-
                  Parkin is recruited selectively to impaired mitochondria and
                  promotes their autophagy.
                statement: >-
                  Parkin is recruited to depolarized mitochondria and mediates
                  their engulfment by autophagosomes.
                supporting_text: >-
                  After recruitment, Parkin mediates the engulfment of
                  mitochondria by autophagosomes and the selective elimination of
                  impaired mitochondria.
              - source_id: PMID:23754282
                title: Parkin-catalyzed ubiquitin-ester transfer is triggered by PINK1-dependent phosphorylation.
                statement: >-
                  Parkin catalytic activity depends on PINK1 phosphorylation of
                  Ser65.
                supporting_text: >-
                  Furthermore, formation of the ubiquitin-ester depends on PINK1
                  phosphorylation of Parkin Ser-65.
              - source_id: PMID:16204351
                title: >-
                  A Caenorhabditis elegans Parkin mutant with altered
                  solubility couples alpha-synuclein aggregation to
                  proteotoxic stress.
                statement: >-
                  Worm PDR-1 cooperates with ubiquitylation co-enzymes to
                  mediate ubiquitin conjugation.
                supporting_text: >-
                  PDR-1 protein physically associates and cooperates with a
                  conserved degradation machinery to mediate ubiquitin
                  conjugation.
              - source_id: PMID:24625979
                title: >-
                  PDR-1/hParkin negatively regulates the phagocytosis of
                  apoptotic cell corpses in Caenorhabditis elegans.
                statement: >-
                  The E3-null pdr-1(lg103) allele fails to ubiquitylate
                  CED-10, which shows worm PDR-1 ligase activity in vivo.
                supporting_text: >-
                  As expected, the E3 ligase-null mutant of PDR-1 (lg103) failed
                  to induce CED-10 ubiquitylation
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Tagged worm PDR-1 is found in the stalled mitophagy
                  intermediates of fis-1 fis-2 mutants.
                supporting_text: >-
