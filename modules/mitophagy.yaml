          - id: fis1_adaptor
            label: FIS-1 outer-membrane disposal adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FIS-1 (worm)
                term:
                  id: UniProtKB:Q20291
                  label: FIS1-related protein fis-1
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              description: >-
                Family-level adaptor activity (TPR fold) as in the fis-1
                review. Its binding partners in this step are not defined.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
