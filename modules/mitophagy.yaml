    - order: 3
      role: receptor capture by Atg8-family proteins on the phagophore
      node:
        id: atg8_capture
        label: Atg8-family docking of mitophagy receptors on the phagophore
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Atg8-family proteins (LC3 and GABARAP subfamilies in mammals; LGG-1,
          the GABARAP-family ortholog, in worms) are conjugated to
          phosphatidylethanolamine on the phagophore membrane and serve as the
          binding site for LIR-containing receptors. In worm muscle, nascent
          mitophagosomes appear as LGG-1 spots on the mitochondrial surface; in
          the embryo, LGG-1 is recruited to paternal organelles. In human cells
          the GABARAP subfamily is the main contributor to PINK1/Parkin
          mitophagy, but Atg8-family proteins are dispensable for engulfment
          of mitochondria and essential for autophagosome-lysosome fusion, so
          receptor engagement of Atg8 proteins is not the only way cargo is
          captured. How the phagophore is built and Atg8 proteins are lipidated
          belongs to the autophagosome biogenesis module.
        annotons:
          - id: atg8_family
            label: Phagophore-anchored Atg8-family protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Atg8 family (LC3 and GABARAP subfamilies)
                term:
                  id: PANTHER:PTHR10969
                  label: MICROTUBULE-ASSOCIATED PROTEINS 1A/1B LIGHT CHAIN 3-RELATED
                representative_members:
                  - preferred_term: GABARAP (human)
                    term:
                      id: UniProtKB:O95166
                      label: Gamma-aminobutyric acid receptor-associated protein
                  - preferred_term: MAP1LC3B (human)
                    term:
                      id: UniProtKB:Q9GZQ8
                      label: Microtubule-associated protein 1 light chain 3 beta
                  - preferred_term: LGG-1 (worm)
                    term:
                      id: UniProtKB:Q09490
                      label: Protein lgg-1
                ancestral_nodes:
                  - preferred_term: PAINT Atg8 node PTN000103522
                    term:
                      id: PANTHER:PTN000103522
                      label: PTN000103522
                    description: >-
                      Eukaryotic node with IBD statements for
                      phosphatidylethanolamine binding, autophagosome membrane
                      and mitophagy. GABARAP, MAP1LC3B and LGG-1 all receive
                      IBA rows from it. The node is deeper than this module.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000103522 in PTHR10969.
            function:
              preferred_term: phosphatidylethanolamine binding
              term:
                id: GO:0008429
                label: phosphatidylethanolamine binding
              description: >-
                The core function in the GABARAP, MAP1LC3B and lgg-1 reviews.
                Covalent PE anchoring puts the protein on the phagophore. Its
                receptor-binding (LIR docking) role has no specific GO
                molecular function term and is described in role_description.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
            locations:
              - preferred_term: autophagosome membrane
                term:
                  id: GO:0000421
                  label: autophagosome membrane
            role_description: >-
              Membrane-anchored binding site for the mitophagy receptors.
              Optineurin, NDP52, NIX, BNIP3 and FUNDC1 bind LC3/GABARAP, and
              ALLO-1 binds LGG-1 directly through its LIR.
            evidence:
              - source_id: PMID:27864321
                title: >-
                  Atg8 family LC3/GABARAP proteins are crucial for
                  autophagosome-lysosome fusion but not autophagosome formation
                  during PINK1/Parkin mitophagy and starvation.
                statement: >-
                  The GABARAP subfamily is the main Atg8-family contributor to
                  PINK1/Parkin mitophagy in human cells.
                supporting_text: >-
                  identify GABARAP subfamily members as primary contributors to
                  PINK1/Parkin mitophagy and starvation autophagy
              - source_id: PMID:27864321
                title: >-
                  Atg8 family LC3/GABARAP proteins are crucial for
                  autophagosome-lysosome fusion but not autophagosome formation
                  during PINK1/Parkin mitophagy and starvation.
                statement: >-
                  Atg8-family proteins are not needed to engulf mitochondria,
                  but are needed for autophagosome-lysosome fusion.
                supporting_text: >-
                  We show that Atg8s are dispensable for autophagosome formation
                  and selective engulfment of mitochondria, but essential for
                  autophagosome-lysosome fusion.
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Nascent mitophagosomes in worm muscle are detected as LGG-1
                  spots on the mitochondrial surface.
                supporting_text: >-
                  Nascent mitophagosomes were detected by colocalization of
                  CFP::LGG-1 (red) and YFP::TOM70 (green) in spots on the surface
                  of mitochondria
              - source_id: PMID:31153831
                title: Ubiquitination is required for the initial removal of paternal organelles in C. elegans.
                statement: >-
                  Blocking organelle ubiquitination prevents LGG-1 recruitment
                  to paternal organelles.
                supporting_text: >-
                  inhibits the recruitment of the autophagy protein, LGG-1
                  (homolog of LC3/GABARAP), to paternal organelles
    - order: 4
      role: completion of orderly disposal of fission-derived mitochondrial fragments (nematode)
      node:
        id: fis1_disposal
        label: FIS-1/FIS-2-dependent disposal of damaged mitochondria (nematode)
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Established in C. elegans only. After stress-induced,
          MFF/DRP-1-dependent fission, the FIS1-family outer-membrane proteins
          FIS-1 and FIS-2 act redundantly at a late step of mitophagy, before
          fusion with lysosomes. Fis1 joins a DRP-1-containing complex at the
          ER-mitochondria interface but is not needed for DRP-1 recruitment or
          for fission. In fis-1 fis-2 mutants, large LGG-1-positive aggregates
          containing mitochondrial fragments, DRP-1 and PDR-1 build up. Their
          formation requires mff, drp-1 and pink-1. FIS-1 is also needed to
          remove UV-C-induced mitochondrial DNA damage. Whether mammalian FIS1
          has the same late role is not modeled here, because human FIS1 has
          no gene review in this repository.
