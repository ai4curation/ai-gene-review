knowledge_gaps:
  - gap_statement: >-
      It is unknown whether worm PINK-1 phosphorylates ubiquitin and PDR-1 at
      the residues used by mammalian and insect PINK1, which outer-membrane
      proteins PDR-1 ubiquitinates during mitophagy, and which worm protein
      reads that ubiquitin, given that nematodes lack clear optineurin and
      NDP52 orthologs.
    boundary: >-
      Worm evidence places PINK-1 and PDR-1 in mitophagy genetically and shows
      PDR-1 E3 activity toward CED-10. Direct kinase substrates, mitophagy
      ubiquitination targets and a ubiquitin-reading receptor have not been
      identified in C. elegans.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether the worm ubiquitin route has the same biochemistry as
      the mammalian PINK1/Parkin feed-forward loop, and whether DCT-1 or
      another protein fills the optineurin/NDP52 role in nematodes.
    resolution: >-
      Phospho-ubiquitin (Ser65) detection in pink-1 and kinase-dead
      backgrounds after mitochondrial stress, ubiquitin-remnant proteomics of
      mitochondria from wild-type and pdr-1 animals, and a screen for
      ubiquitin- and LGG-1-binding proteins recruited to stressed
      mitochondria.
    provenance:
      - reference_id: PMID:24196833
        supporting_text: >-
          do indicate that LGG-1 aggregates in Fis1 mutants are an aberrant
          product of Pink1-induced mitophagy
  - gap_statement: >-
      Whether FNDC-1 binds LGG-1 directly, and what restricts the
      FNDC-1-dependent and ALLO-1-dependent routes to sperm-derived
      mitochondria, are unknown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether FNDC-1 is a true LIR receptor like FUNDC1 and how
      paternal and maternal mitochondria are told apart after fertilization.
    resolution: >-
      LIR mutagenesis of FNDC-1 with LGG-1 binding assays, and sperm-specific
      degron or rescue experiments in fndc-1 and allo-1 mutants.
    provenance:
      - reference_id: PMID:31233739
        supporting_text: >-
          the mechanisms that restrict this process to sperm-derived
          organelles are not well understood
  - gap_statement: >-
      The molecular partners through which worm FIS-1/FIS-2 complete disposal
      of fission-derived mitochondrial fragments are unknown, as is whether
      FIS1 has a comparable late role in other animals.
    boundary: >-
      FIS1-family proteins are TPR adaptors, and worm Fis1 is in a
      DRP-1-containing MAM complex. The protein it binds at the late disposal
      step has not been identified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This late step separates orderly mitophagy from stalled
      intermediates.
    resolution: >-
      Proximity labeling of FIS-1 under paraquat stress, structure-guided
      TPR mutants tested for aggregate suppression, and the same stalled-
      intermediate assay in FIS1-deficient mammalian cells.
    provenance:
      - reference_id: PMID:24196833
        supporting_text: >-
          Fis1 is part of the MAM complex and contributes to a late stage of
          the removal process but is not required for entry of Drp1 into the
          MAM or fission
