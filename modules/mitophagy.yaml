                    evidence:
                      - source_id: PMID:20010802
                        title: Nix is a selective autophagy receptor for mitochondrial clearance.
                        statement: >-
                          NIX is a selective autophagy receptor that binds
                          LC3/GABARAP.
                        supporting_text: >-
                          Here, we show that the mitochondrial protein Nix is a
                          selective autophagy receptor by binding to LC3/GABARAP
