              - id: bnip3_nix_receptor
                label: BNIP3/NIX-family outer-membrane mitophagy receptor
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  BNIP3, NIX (BNIP3L) and worm DCT-1 are tail-anchored
                  outer-membrane proteins with an N-terminal LIR. BNIP3 and NIX
                  are HIF targets and act in hypoxic mitophagy; NIX is required
                  for mitochondrial clearance in maturing reticulocytes. DCT-1
