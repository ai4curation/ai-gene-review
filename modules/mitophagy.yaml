                  Fis1 mutants
    - order: 2
      role: receptor recognition of marked mitochondria
      node:
        id: mitophagy_receptor_recognition
        label: Mitophagy receptor recognition
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Receptors bridge the mitochondrion to Atg8-family proteins on the
          phagophore. Two receptor types exist. Soluble ubiquitin-binding
          receptors read the Parkin-made ubiquitin mark. Integral
          outer-membrane receptors carry their own LC3-interacting region and
          act largely without ubiquitin. The receptors are used in different
          contexts and lineages and are not interchangeable alternatives for
          one step; they are grouped as a variant set because each one
          supplies the mitochondrion-to-phagophore link.
        variant_sets:
          - id: mitophagy_receptors
            label: Mitophagy receptors by type and lineage
            axis: receptor type (ubiquitin-reading soluble receptor or integral outer-membrane receptor) and sequence lineage
            selection: ONE_OR_MORE
            notes: >-
              Optineurin and NDP52 are the main PINK1/Parkin receptors in human
              cells and have no clear nematode ortholog. The BNIP3/NIX and
              FUNDC1 families are conserved between nematodes and mammals.
              BNIP3 and NIX act in hypoxia-induced and developmental mitophagy,
              and worm DCT-1 in adult somatic stress-induced mitophagy,
              genetically with PINK-1/PDR-1. FUNDC1 and FNDC-1 act in hypoxic
              mitophagy, and FNDC-1 also in the late, ubiquitin-independent
              phase of paternal mitochondrial elimination. ALLO-1 is
              nematode-specific and acts in the early, ubiquitin-dependent
              phase of paternal organelle clearance (allophagy), which also
              removes the sperm membranous organelles.
            variants:
              - id: ubiquitin_binding_receptors
                label: Optineurin and NDP52 ubiquitin-binding mitophagy receptors (vertebrate)
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  Optineurin binds polyubiquitin through its UBAN domain and
                  LC3/GABARAP through a LIR motif; NDP52 binds ubiquitin and
                  Atg8-family proteins and its SKICH domain recruits the ULK1
                  complex. Once on mitochondria, both receptors recruit ULK1,
                  DFCP1 and WIPI1 to start autophagosome formation next to the
                  cargo. TBK1 phosphorylation of optineurin raises its
                  ubiquitin and LC3 binding. These receptors are vertebrate
                  proteins.
                annotons:
                  - id: optn_receptor
                    label: Optineurin ubiquitin-binding mitophagy receptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: OPTN (human)
                        term:
                          id: UniProtKB:Q96CV9
                          label: Optineurin
                    function:
                      preferred_term: protein-macromolecule adaptor activity
                      term:
                        id: GO:0030674
                        label: protein-macromolecule adaptor activity
                      description: >-
                        The core function in the OPTN review. It bridges
                        polyubiquitin on the cargo to LC3/GABARAP on the
                        phagophore.
                    processes:
                      - preferred_term: type 2 mitophagy
                        term:
                          id: GO:0061734
                          label: type 2 mitophagy
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Reads Parkin-made ubiquitin chains on damaged mitochondria
                      and recruits LC3 and the autophagy initiation machinery.
                    evidence:
                      - source_id: PMID:25294927
                        title: >-
                          Optineurin is an autophagy receptor for damaged
                          mitochondria in parkin-mediated mitophagy that is
                          disrupted by an ALS-linked mutation.
                        statement: >-
                          Optineurin induces autophagosome formation around
                          damaged mitochondria through its LIR.
                        supporting_text: >-
                          Optineurin then induces autophagosome formation around
                          damaged mitochondria via its LC3 interaction region
                          (LIR) domain
                      - source_id: PMID:25294927
                        title: >-
                          Optineurin is an autophagy receptor for damaged
                          mitochondria in parkin-mediated mitophagy that is
                          disrupted by an ALS-linked mutation.
                        statement: >-
                          Optineurin associates with ubiquitinated mitochondria
                          through its ubiquitin-binding domain.
                        supporting_text: >-
                          allowing optineurin to stably associate with
                          ubiquitinated mitochondria via its ubiquitin binding
                          domain
                      - source_id: PMID:21617041
                        title: Phosphorylation of the autophagy receptor optineurin restricts Salmonella growth.
                        statement: >-
                          Optineurin binds LC3/GABARAP through a LIR and
                          ubiquitin through its UBAN domain.
                        supporting_text: >-
                          OPTN is an autophagy receptor that binds and localizes
                          with LC3/GABARAP via a phenylalanine-containing LIR motif
                          and ubiquitin via its ubiquitin binding in ABIN and NEMO
                          (UBAN) domains
                  - id: ndp52_receptor
