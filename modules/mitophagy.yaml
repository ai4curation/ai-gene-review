                          and phosphorylates FUNDC1 at Ser-17.
                      - source_id: PMID:31233739
                        title: Fndc-1 contributes to paternal mitochondria elimination in C. elegans.
                        statement: >-
                          Worm FNDC-1 mediates hypoxic mitophagy and contributes
                          to paternal mitochondria elimination, as a
                          ubiquitin-independent receptor.
                        supporting_text: >-
