                      - source_id: PMID:20010802
                        title: Nix is a selective autophagy receptor for mitochondrial clearance.
                        statement: >-
                          Loss of the NIX-LC3/GABARAP interaction slows
                          mitochondrial clearance in reticulocytes.
                        supporting_text: >-
                          Furthermore, ablation of the Nix:LC3/GABARAP interaction
                          retards mitochondrial clearance in maturing murine
                          reticulocytes.
                      - source_id: PMID:22505714
                        title: >-
                          Microtubule-associated protein 1 light chain 3 (LC3)
                          interacts with Bnip3 protein to selectively remove
                          endoplasmic reticulum and mitochondria via autophagy.
                        statement: >-
                          The BNIP3 LC3-binding site is needed for mitophagy
                          but not for BNIP3 pro-death activity, so the two
                          activities are separable.
                        supporting_text: >-
                          Although ablation of the Bnip3-LC3 interaction by
                          mutating the LC3 binding site did not impair the prodeath
                          activity of Bnip3, it significantly reduced both mitophagy
                          and ERphagy.
                      - source_id: PMID:25896323
                        title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
                        statement: >-
                          Worm DCT-1 is a key mediator of mitophagy under stress.
                        supporting_text: >-
                          We find that DCT-1 is a key mediator of mitophagy and
                          longevity assurance under conditions of stress
              - id: fundc1_receptor
                label: FUNDC1-family ubiquitin-independent mitophagy receptor
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  FUNDC1 and worm FNDC-1 are FUN14-family multi-pass
                  outer-membrane proteins. Human FUNDC1 binds LC3 through a
                  Y18xxL21 LIR that is controlled by phosphorylation (ULK1
                  phosphorylates Ser17) and is required for hypoxia-induced
                  mitophagy. Worm FNDC-1 contributes to hypoxia-reoxygenation
                  mitophagy and to the late removal of paternal mitochondria.
                  Human FUNDC1 also has a separate DRP1-adaptor role at
                  ER-mitochondria contacts that is not modeled here.
                annotons:
