id: MODULE:arginine_biosynthesis
title: L-arginine biosynthesis via acetylated ornithine
description: 'De novo L-arginine synthesis through acetylated glutamate and ornithine intermediates in
  characterized bacterial, archaeal, fungal and plant systems. The reaction template distinguishes acetyl-CoA-dependent
  initiation from acetylornithine-dependent recycling: ArgJ family membership does not establish both
  activities. Linear ArgA/ArgE and cyclic acetyl-transfer implementations converge on ornithine, followed
  by carbamoylation, argininosuccinate synthesis and cleavage. Selected fungal implementations separate
  mitochondrial ornithine formation from downstream reactions; budding and fission yeast differ in ornithine
  carbamoyltransferase location. Plant plastid enzymes and an experimentally monofunctional archaeal ArgJ
  provide comparative anchors without implying that every lineage implements every step or shares one
  compartment. Dedicated fungal carbamoyl-phosphate supply is an optional side branch; shared substrate
  supply, transport, catabolism, and LysW-, succinylated-intermediate or acetylcitrulline routes lie outside
  this reaction-chain boundary.'
status: DRAFT
evidence:
- source_id: GapMind:aa
  title: GapMind for amino acid biosynthesis
  statement: The conserved reaction set and alternative linear and cyclic acetylated-ornithine routes
    derive from the GapMind arginine pathway definition arg.steps (PaperBLAST, Price & Arkin, LBL).
  url: https://papers.genomics.lbl.gov/cgi-bin/gapView.cgi?gdb=NCBI&set=aa&path=arg
- source_id: MetaCyc:ARGSYN-PWY
  title: L-arginine biosynthesis I via L-acetylornithine
  statement: Grounds the linear ArgA-to-ArgE acetylated-intermediate route.
- source_id: MetaCyc:ARGSYNBSUB-PWY
  title: L-arginine biosynthesis II (acetyl cycle)
  statement: Grounds the cyclic ArgJ acetyl-transfer implementation.
- source_id: GO:0006526
  title: L-arginine biosynthetic process
  statement: The module is grounded in the GO biological-process term for L-arginine biosynthesis.
- source_id: YeastPathways:ARGSYNBSUB-PWY
  title: L-arginine biosynthesis II (acetyl cycle) (S. cerevisiae, SGD YeastPathways)
  statement: The SGD YeastCyc pathway lists nine reactions with ARG2 and ARG7 (glutamate acetylation),
    ARG5,6 (kinase and reductase), ARG8, ARG7 (ornithine acetyltransferase), ARG3, ARG1, ARG4 and CPA1/CPA2/URA2
    (carbamoyl-phosphate synthetase). All arginine-enzyme assignments were retained; URA2 was not adopted
    because it is the pyrimidine-pathway CPSase-ATCase, and the carbamoyl-phosphate reaction was made
    an optional part carried by the arginine-specific CPA1/CPA2 enzyme.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARGSYNBSUB-PWY
- source_id: YeastPathways:CITRUL-BIO2-PWY
  title: citrulline biosynthesis (S. cerevisiae, SGD YeastPathways)
  statement: The YeastCyc citrulline pathway (CPA1/CPA2/URA2 carbamoyl-phosphate synthesis and ARG3 ornithine
    carbamoyltransferase) is a fragment of arginine biosynthesis and is folded into this module rather
    than modelled separately.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=CITRUL-BIO2-PWY
- source_id: GO:0070409
  title: carbamoyl phosphate biosynthetic process
  statement: Process term for the optional dedicated carbamoyl-phosphate synthetase part.
- source_id: PMID:205532
  title: 'Arginine metabolism in Saccharomyces cerevisiae: subcellular localization of the enzymes.'
  statement: In S. cerevisiae the five acetylated-cycle enzymes fractionate with mitochondria, whereas
    arginine-specific carbamoyl-phosphate synthetase, ornithine carbamoyltransferase, argininosuccinate
    synthetase and argininosuccinate lyase are soluble.
  supporting_text: These enzymes were exclusively particulate. Comparison with citrate synthase and cytochrome
    oxidase, and results from isopycnic gradient analysis, suggested that these enzymes were associated
    with the mitochondria.
- source_id: PMID:11553611
  title: 'A new yeast metabolon involving at least the two first enzymes of arginine biosynthesis: acetylglutamate
    synthase activity requires complex formation with acetylglutamate kinase.'
  statement: ARG2 (YJL071W) encodes acetylglutamate synthase; ascomycete synthases showed no significant
    sequence similarity to the prokaryotic equivalents in this study and are active only in a complex
    with the ARG5,6-derived kinase.
  supporting_text: they showed no significant similarity to their prokaryotic equivalents
- source_id: PMID:12603335
  title: The N-acetylglutamate synthase/N-acetylglutamate kinase metabolon of Saccharomyces cerevisiae
    allows co-ordinated feedback regulation of the first two steps in arginine biosynthesis.
  statement: Characterises the NAGS-NAGK metabolon and its coordinated arginine feedback regulation (cited
    by YeastPathways).
- source_id: PMID:1649049
  title: Determination of amino acid sequences involved in the processing of the ARG5/ARG6 precursor in
    Saccharomyces cerevisiae.
  statement: ARG5,6 is a single translation product, imported into mitochondria and processed into separable
    acetylglutamate kinase and acetylglutamyl-phosphate reductase.
  supporting_text: Our data support the idea that import of the ARG5/ARG6 precursor into the mitochondria
    is required for its processing into two mature enzymes.
- source_id: PMID:9428669
  title: Characterization of the Saccharomyces cerevisiae ARG7 gene encoding ornithine acetyltransferase,
    an enzyme also endowed with acetylglutamate synthase activity.
  statement: ARG7 is the mitochondrial ArgJ-family ornithine acetyltransferase and is modestly bifunctional,
    complementing arg2 and E. coli argA mutations when overexpressed.
  supporting_text: The yeast enzyme is thus clearly, albeit modestly, bifunctional.
- source_id: PMID:8798783
  title: The ARG11 gene of Saccharomyces cerevisiae encodes a mitochondrial integral membrane protein
    required for arginine biosynthesis.
  statement: The ORT1/ARG11 mitochondrial carrier is proposed to export matrix-made ornithine; it is a
    transport step connecting the two compartments and is kept outside the enzymatic module core.
  supporting_text: we propose that Arg11p participates in the export of matrix-made ornithine into the
    cytosol
- source_id: PMID:8626695
  title: Requirement for the carboxyl-terminal domain of Saccharomyces cerevisiae carbamoyl-phosphate
    synthetase.
  statement: The arginine-specific CPSase is a CPA1 (glutamine-cleaving) plus CPA2 (ammonia-accepting,
    ATP-using) heterodimer.
  supporting_text: The arginine-specific carbamoyl phosphate synthetase of Saccharomyces cerevisiae is
    a heterodimeric enzyme, with a 45-kDa CPA1 subunit binding and cleaving glutamine, and a 124-kDa CPA2
    subunit accepting the ammonia moiety cleaved from glutamine
- source_id: PMID:200419
  title: Change in location of ornithine carbamoyltransferase and carbamoylphosphate synthetase among
    yeasts in relation to the arginase/ornithine carbamoyltransferase regulatory complex and the energy
    status of the cells.
  statement: Bibliographic lead on differences in yeast enzyme localization; no accessible abstract or
    full text was independently inspected. Target localization is supported instead by the separately
    assessed primary and curated sources.
- source_id: PMID:2945985
  title: Compartmental and regulatory mechanisms in the arginine pathways of Neurospora crassa and Saccharomyces
    cerevisiae.
  statement: Review of the compartmentation of the fungal arginine pathway, cited by YeastPathways for
    citrulline biosynthesis (abstract not available in the cache).
- source_id: PMID:1313366
  title: Cloning and sequencing of arg3 and arg11 genes of Schizosaccharomyces pombe on a 10-kb DNA fragment.
    Heterologous expression and mitochondrial targeting of their translation products.
  statement: S. pombe arg11 is the ARG5,6-like kinase/reductase polyprotein and arg3 is ornithine carbamoyltransferase;
    unlike the S. cerevisiae enzyme, the S. pombe OTC is mitochondrially targeted.
  supporting_text: The acetylglutamate kinase and acetylglutamate-phosphate reductase domains have been
    defined by their identity with the S. cerevisiae ARG5,6 protein.
- source_id: PMID:18849471
  title: Thiol-independent action of mitochondrial thioredoxin to support the urea cycle of arginine biosynthesis
    in Schizosaccharomyces pombe.
  statement: S. pombe arg3 ornithine carbamoyltransferase acts in mitochondria and interacts with mitochondrial
    thioredoxin Trx2.
  supporting_text: we observed a direct interaction between Trx2 and Arg3 in cell extracts
- source_id: PMID:32896087
  title: Mitochondrial respiration is required to provide amino acids during fermentative proliferation
    of fission yeast.
  statement: Arg3-GFP localises to mitochondria in S. pombe; arg3 and arg41 deletions are arginine auxotrophs,
    and arg7 and arg41 are two argininosuccinate lyases. Cited in the PomBase GO-CAM as evidence that
    citrulline, not ornithine, is exported from fission-yeast mitochondria.
  supporting_text: arg7 is one of two argininosuccinate lyases (with deletion of the other one, arg41,
    showing arginine auxotrophy)
- source_id: PMID:31451546
  title: Arginine Biosynthesis Modulates Pyoverdine Production and Release in Pseudomonas putida as Part
    of the Mechanism of Adaptation to Oxidative Stress.
  statement: KT2440 genetics identifies PP_4481 as argD (= astC) and shows that separate argD, argE, and
    argJ mutants are not arginine auxotrophs. This supports overlapping aminotransferase and ornithine-release
    implementations without establishing which route carries dominant flux. In contrast, argA, argB, argF,
    argG, and argH mutants are auxotrophic, supporting the corresponding required steps in the PSEPK instance.
- source_id: KEGG:ppu00220
  title: Pseudomonas putida KT2440 arginine biosynthesis map
  statement: The PSEPK pathway instance supplies exact UniProt exemplars for all eight reactions while
    the broader KEGG map also contains catabolic and shared nitrogen-metabolism genes outside this module
    boundary.
- source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
  title: PSEPK pathway membership table
  statement: The local partition provides accession and locus-tag mappings used to distinguish the biosynthetic
    core from arginine catabolism, urease, and shared carbamoyl-phosphate synthesis.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__arginine_biosynthesis__ppu00220-deep-research-openscientist.md
  title: OpenScientist PSEPK module, pathway, and taxon synthesis
  statement: The species-aware retrieval recovers the eight-step pathway outline and flags the KEGG boundary
    spillover. Its recommendation to promote AST-operon PP_4481 as a biosynthetic step-4 contributor and
    its unqualified redundancy claims are rejected here in favor of direct KT2440 genetics, local PANTHER
    subfamilies, and the curated gene reviews.
- source_id: file:modules/arginine_biosynthesis-deep-research-openscientist.md
  title: OpenScientist reusable acetylated-ornithine pathway synthesis
  statement: The species-neutral retrieval supports the eight-reaction boundary, distinguishes linear
    ArgA/ArgE from cyclic ArgJ acetyl management, and identifies carbamoyl-phosphate supply plus LysW,
    N-acetylcitrulline, and succinylated routes as neighboring systems. Family and node identifiers remain
    grounded independently in local UniProt, PANTHER, and PAINT data.
- source_id: file:PSEPK/argD/argD-deep-research-openscientist.md
  title: OpenScientist synthesis for PSEPK PP_4481 acyl-ornithine aminotransferase
  statement: Genomic context and family analysis place PP_4481 in the AST catabolic operon and identify
    PP_0372 as the stronger PSEPK candidate for the biosynthetic acetylornithine-transaminase step. The
    report's route-level claims are treated as hypotheses pending direct KT2440 genetics.
- source_id: PMID:17347518
  title: 'Surprising arginine biosynthesis: a reappraisal of the enzymology and evolution of the pathway
    in microorganisms.'
  statement: Comparative enzymology distinguishes classical/short/fused NAGS and mono- versus bifunctional
    ArgJ; these findings constrain family-based pathway inference.
- source_id: PMID:26284079
  title: Physiological implications of arginine metabolism in plants.
  statement: Plant review describes acetylated intermediates and the downstream OTC/ASS/ASL sequence,
    and distinguishes characterized genes from predicted assignments.
- source_id: PMID:10931207
  title: Characterization and kinetic mechanism of mono- and bifunctional ornithine acetyltransferases
    from thermophilic microorganisms.
  statement: Purified Methanocaldococcus ArgJ is recycling-only, whereas the tested Thermotoga and Geobacillus
    proteins also use acetyl-CoA.
- source_id: PMID:16377628
  title: The PII signal transduction protein of Arabidopsis thaliana forms an arginine-regulated complex
    with plastid N-acetyl glutamate kinase.
  statement: Arabidopsis NAGK is a plastid kinase whose arginine inhibition is relieved by PII binding.
- source_id: PMID:28294536
  title: Acetylglutamate kinase is required for both gametophyte function and embryo development in Arabidopsis
    thaliana.
  statement: Native Arabidopsis NAGK genetics and bacterial complementation support the plastid arginine-biosynthetic
    step.
- source_id: PMID:23321422
  title: The Arabidopsis TUMOR PRONE5 gene encodes an acetylornithine aminotransferase required for arginine
    biosynthesis and root meristem maintenance in blue light.
  statement: Arabidopsis TUP5/WIN1 is required for normal arginine supply and complements yeast ACOAT
    deficiency; GFP localizes in chloroplasts.
- source_id: PMID:10753950
  title: The yeast ARG7 gene product is autoproteolyzed to two subunit peptides, yielding active ornithine
    acetyltransferase.
  statement: Yeast Arg7 autoproteolytic maturation precedes mitochondrial targeting.
- source_id: PMID:15838030
  title: Functional characterization of a novel ArgA from Mycobacterium tuberculosis.
  statement: Rv2747 is a short GNAT-type enzyme with measured acetyl-CoA-dependent glutamate acetylation
    and higher glutamine activity; physiological efficient flux remains unresolved.
- source_id: PMID:1406250
  title: Isolation of arginine auxotrophs, cloning by mutant complementation, and sequence analysis of
    the argC gene from the cyanobacterium Anabaena species PCC 7120.
  statement: Native and heterologous complementation supports the characterized cyanobacterial ArgC representative
    used in the type2 variant; the type2 family label is independently verified in UniProt.
