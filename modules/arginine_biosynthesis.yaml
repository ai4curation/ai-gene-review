  connections:
  - source: glutamate_acetylation_step
    target: acetylglutamate_kinase_step
    connection_type: PRECEDES
    description: Acetyl-CoA initiation provides N-acetylglutamate for phosphorylation; recycling can replenish
      the same pool. This is metabolite order, not universal physical channeling.
    evidence:
    - source_id: PMID:26284079
      statement: The review describes the ordered substrate/product transitions of the conserved acetylated-ornithine
        and ornithine-to-arginine chemistry. This supports reaction ordering, not universal taxon presence
        or physical substrate channeling.
    - source_id: PMID:12603335
      statement: Yeast NAGS/NAGK interaction coordinates the first two reactions, with reductase dispensable
        for NAGS activity/stability.
