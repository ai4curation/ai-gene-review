    description: SGD YeastPathways conversion for S. cerevisiae. All ten activities are placed in cytosol,
      although the five ornithine-forming enzymes (ARG2, ARG5,6, ARG8, ARG7) are mitochondrial matrix
      enzymes; the acetyl-CoA-dependent glutamate acetylation by ARG2 and ARG7 is typed GO:0103045 (L-methionine
      N-acyltransferase activity) instead of GO:0004042; the only causal edge links ARG7 GO:0004358 to
      the ARG5,6 kinase. Carbamoyl-phosphate synthesis is enabled by the CPA1-CPA2 complex (SGD CPX-579)
      with GO:0004088.
  - model: gomodel:YeastPathways_CITRUL-BIO2-PWY
    title: 'citrulline biosynthesis - imported from: Saccharomyces Genome Database'
    description: Two-activity SGD conversion (CPX-579 carbamoyl-phosphate synthetase and ARG3 ornithine
      carbamoyltransferase, both cytosolic, part of GO:0019240). Folded into this module.
  - model: gomodel:6690711d00000916
    title: L-arginine biosynthetic process (GO:0006526)
    description: 'PomBase S. pombe model with causally chained activities: arg6 NAGS, arg11 kinase and
      reductase, arg1 aminotransferase, aga1 ornithine acetyltransferase and arg3 OTC in the mitochondrial
      matrix; a mitochondrial-membrane transporter (SPBC365.16) modeled as exporting citrulline; cytosolic
