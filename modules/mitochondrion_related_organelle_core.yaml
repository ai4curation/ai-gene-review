        evidence:
        - source_id: PMID:9419358
          statement: Giardia Cpn60 falls in the clade of mitochondrial and hydrogenosomal Cpn60 proteins.
          supporting_text: Phylogenetic analyses position the G. lamblia cpn60 in a clade that includes mitochondrial
            and hydrogenosomal cpn60 proteins.
        - source_id: PMID:10022906
          statement: Entamoeba Hsp60 has an organelle-targeting presequence that targets it to a mitochondrion-derived
