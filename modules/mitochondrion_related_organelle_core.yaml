        evidence:
        - source_id: PMID:11880223
          statement: Giardia, Entamoeba and two microsporidians have mitochondrial-type Hsp70 genes that fall in the
            eukaryotic mitochondrial clade.
          supporting_text: However, all of these sequences were clearly located within a eukaryotic mitochondrial clade
            in the tree including various type hsp70 sequences, supporting the emerging notion that none of these amitochondriate
            lineages are primitively amitochodrial, but lost their mitochondria secondarily in their evolutionary past.
        - source_id: PMID:22079833
          statement: The Trichomonas hydrogenosome proteome contains mitochondrial-like Hsp70, Hsp60 and Hsp10.
          supporting_text: These include mitochondrial-like chaperones Hsp70, Hsp60 and Hsp10, a processing peptidase
            and putative members of the translocation machinery (Pam18 and Tim17/22/23 orthologs)
