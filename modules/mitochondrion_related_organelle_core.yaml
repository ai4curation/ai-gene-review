id: MODULE:mitochondrion_related_organelle_core
title: Mitochondrion and mitochondrion-related organelle core
description: Every eukaryote examined so far has a mitochondrion or a mitochondrion-related organelle (MRO) descended
  from it. MROs include the hydrogenosomes of trichomonads and the mitosomes of Giardia, Entamoeba and microsporidia.
  They have lost much of the mitochondrial proteome, often including the genome, respiration and most of the protein
  import machinery, but they keep a small shared core. That core includes the matrix chaperones that receive and
  fold imported proteins, namely the mitochondrial-type Hsp70 and the chaperonin Cpn60 (Hsp60). Both descend from the
  alpha-proteobacterial endosymbiont, and their presence in Giardia, Trichomonas and Entamoeba was the first evidence
  that these lineages once had mitochondria. This module is that chaperone core, written so that it can be evaluated
  in any genome.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:9419358
  title: 'A mitochondrial-like chaperonin 60 gene in Giardia lamblia: evidence that diplomonads once harbored an endosymbiont
    related to the progenitor of mitochondria.'
  statement: Mitochondrial-like Hsp70 and Cpn60 genes in trichomonads, microsporidia and Giardia imply that these lineages
    once had mitochondria.
  supporting_text: However, recent discoveries of mitochondrial-like heat shock protein 70 and/or chaperonin 60 (cpn60)
    genes in trichomonads and microsporidia imply that the ancestors of these two groups once harbored mitochondria
    or their endosymbiotic progenitors.
- source_id: PMID:19995967
  title: Mitosomes in Entamoeba histolytica contain a sulfate activation pathway.
  statement: Hydrogenosomes and mitosomes are mitochondrion-related organelles of anaerobic or microaerophilic eukaryotes.
  supporting_text: Hydrogenosomes and mitosomes are mitochondrion-related organelles in anaerobic/microaerophilic
    eukaryotes with highly reduced and divergent functions.
- source_id: PMID:26323757
  title: Diversity and origins of anaerobic metabolism in mitochondria and related organelles.
  statement: MROs have evolved independently many times across eukaryotes.
  supporting_text: While there are some common metabolic features shared between the MROs of distantly related protists,
    these organelles have evolved independently multiple times across the breadth of eukaryotic diversity.
- source_id: PMID:27185558
  title: A Eukaryote without a Mitochondrial Organelle.
  statement: The oxymonad Monocercomonoides lacks all hallmark mitochondrial proteins, the first eukaryote known to
    have lost any form of mitochondrion.
  supporting_text: This is the first example of a eukaryote lacking any form of a mitochondrion, demonstrating that
    this organelle is not absolutely essential for the viability of a eukaryotic cell.
notes: 'Scope: read as a satisfiability rule, a genome needs a mitochondrial-type Hsp70 and a mitochondrial Cpn60.
  The rule therefore tests for the organelle, mitochondrion or MRO, and not for any of its functions. It is the weakest
  rule in the project by design: the full mitochondrial rules (mitochondrial_protein_import and mitochondrial_iron_sulfur_cluster_assembly)
  fail in Giardia and Trichomonas, because their import machinery is too reduced or too divergent for PANTHER to classify,
  and this rule is what those lineages keep. Two limits follow from the selectors. In lineages with plastids, the
  plastid DnaK-type Hsp70 may fall in the same subfamily as the mitochondrial one, so the Hsp70 step alone does not
  show a mitochondrion there. And a genome with no MRO at all, such as the oxymonad Monocercomonoides (PMID:27185558), is not in the
  census, so the rule has not been tested against a true absence. Not modelled: the reduced import machinery of
  MROs (Tom40 and Sam50 homologues, which PANTHER does not classify in Giardia and Trichomonas), Fe-S cluster assembly
  (ISC in most lineages, a laterally acquired NIF system in Entamoeba, PMID:14757765), and lineage-specific functions
  such as hydrogen production in hydrogenosomes and sulfate activation in Entamoeba mitosomes (PMID:19995967).'
