              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000452554 in PANTHER family PTHR19375.
            description: The step uses the mitochondrial subfamilies of PTHR19375, not the whole Hsp70 family, which
              also holds the cytosolic and ER Hsp70s (47 Trichomonas proteins against 3 in SF184). SF184 holds the
              mitochondrial Hsp70 in every census organism except Arabidopsis, whose mitochondrial Hsp70s are in SF505
              and SF545. In plastid-bearing lineages the plastid DnaK-type Hsp70 may also be in SF184.
