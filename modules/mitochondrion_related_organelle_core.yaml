                (IRD) at the descendant node PTN002321904, taxon:224911 (Bradyrhizobium diazoefficiens), so the
                node's clade also includes at least one alpha-proteobacterial sequence; the step relies on the subfamilies,
                not on the node, to select eukaryotic proteins.
