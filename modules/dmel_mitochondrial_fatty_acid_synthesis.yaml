id: MODULE:dmel_mitochondrial_fatty_acid_synthesis
title: Mitochondrial type II fatty acid synthesis in Drosophila melanogaster
description: >-
  Mitochondria carry their own type II fatty acid synthesis (mtFAS) system, in which separate
  enzymes act on acyl chains attached to the mitochondrial acyl carrier protein (ND-ACP).
  Malonyl groups are loaded onto ACP by the malonyl transacylase (beg), condensed by a beta-ketoacyl-ACP
  synthase (CG12170), reduced by a 3-ketoacyl-ACP reductase, dehydrated and then reduced by
  the enoyl-ACP reductase Mecr. The main product, octanoyl-ACP, is the precursor of lipoic
  acid; acylated ACP also binds and supports assembly of respiratory complex I and the iron-sulfur
  cluster assembly machinery.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002247
  title: 'FlyBase gene group MTFABIO: Fatty acid biosynthesis (mitochondria)'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as fatty acid biosynthesis (mitochondria)
    (MTFABIO); this module models that group.
- source_id: GO:0006633
  title: fatty acid biosynthetic process
  statement: >-
    GO term grounding the module as fatty acid biosynthetic process.
notes: >-
  Boundary and caveats. The 3-hydroxyacyl-ACP dehydratase step (step 4; HTD2 in mammals) is
  not in the FlyBase group and is not modelled, so the connection from ketoacyl reduction
  to enoyl reduction spans it. Acc is a FlyBase member but is best known as the cytosolic
  acetyl-CoA carboxylase; whether a fly Acc isoform supplies malonyl-CoA inside mitochondria
  is not established (mammals use ACSF3 for intramitochondrial malonyl-CoA), so it is modelled
  as the malonyl-CoA supply step without a location claim. CG3603 is assigned to the ketoreductase
  step by its membership in the FlyBase group; in mammals this step is performed by an HSD17B8-CBR4
  heterotetramer and the fly assignment is only by sequence similarity, so no molecular function
  is given. ND-ACP is also a subunit of respiratory complex I and part of the iron-sulfur
  cluster assembly complex (module dmel_iron_sulfur_cluster_assembly). Other molecular functions
  follow orthology and have not been assayed in flies. FlyBase groups realized by this module:
  MTFABIO (FBgg0002247). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_mitochondrial_fatty_acid_synthesis.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
