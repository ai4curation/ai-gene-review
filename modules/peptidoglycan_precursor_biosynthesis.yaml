  knowledge_gaps:
    - gap_statement: >-
        How flux through the shared UDP-GlcNAc pool is partitioned between MurA
        (peptidoglycan) and LpxA (lipid A) is undetermined. Escherichia coli MurA
        is a direct binding partner of the LapB scaffold and of LpxA, LpxC, LpxD,
        and FabZ, but no catalytic or flux consequence of those contacts has been
        measured, so the coordinating mechanism cannot yet be modeled as a
        reaction step or a regulatory connection.
      boundary: >-
        The interactions themselves are established, by bacterial two-hybrid
        assay, by pull-down of purified proteins, and by microscale
        thermophoresis, and the measured affinities range from moderate to
        high. What is qualified is the association rather than the affinity:
        the authors read their own KD values as a dynamic, growth-condition
        dependent engagement of the LapB scaffold rather than a standing
        complex, on the grounds that simultaneous binding of the partners is
        unlikely. Two earlier screens did miss the contact, a global
        protein-protein interaction screen and a LapB pull-down, and the
        MurA/LpxC pair is the weakest of the five, detected only weakly and
        ranking last in the LpxA > FabZ > LapB > LpxD > LpxC binding
        preference.
        A dosage-level genetic link is nevertheless firmly established
        independently of those contacts: murA is a multicopy suppressor of lapB
        mutants, its overexpression shifting metabolic balance toward
        peptidoglycan and preventing toxic LPS accumulation. MurA is also known
        not to be a LapB/FtsH proteolytic substrate, unlike LpxC and LpxD, so
        coordination via adaptor-directed degradation is excluded for MurA. In
        Pseudomonas aeruginosa, which lacks LapB, MurA does modulate LpxC
        activity directly, and the authors argue from this that the two
        organisms employ distinct strategies: evolutionary covariation and
        AlphaFold-based structural modelling found comparable interactions in
        various bacteria but not in E. coli, and P. aeruginosa LpxC is
        stimulated by its own MurA but not by the corresponding E. coli enzyme.
        Neither result excludes the route in E. coli. The stimulation assay
        reads out P. aeruginosa LpxC throughout, so whether E. coli MurA
        modulates E. coli LpxC was never assayed, and the structural prediction
        is contradicted by this paper's own detection of an E. coli MurA/LpxC
        interaction by three approaches. What is established is a difference in
        strategy, not the absence of the route.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        MurA and LpxC are both antibacterial targets, so whether the committed
        steps of peptidoglycan and lipid A synthesis are functionally coupled
        bears on whether inhibiting one perturbs the other.
      resolution: >-
        Assay MurA and LpxA/LpxC/LpxD activity in the presence of their partners,
        and test envelope-composition phenotypes of interface mutants that lose
        binding without losing catalysis. Encoding the resulting mechanism would
        also require a lipid A (Raetz pathway) module, which modules/ does not
        currently contain.
      provenance:
        - reference_id: PMID:42604454
          supporting_text: >-
            In E. coli, however, the mechanism by which the biosynthesis of all
            three cell envelope layers is coordinated remains unclear.
        - reference_id: PMID:42604454
          supporting_text: >-
            MurA levels remained stable both at native and elevated LapB
            concentrations, indicating that MurA is not subject to degradation by
            the LapB/FtsH machinery
        - reference_id: PMID:42604454
          supporting_text: >-
            murA has been identified as multicopy suppressor of lapB mutants, as
            its overexpression shifts the metabolic balance toward peptidoglycan
            biosynthesis and prevents toxic LPS accumulation
        - reference_id: PMID:42604454
          supporting_text: >-
            MurA was not identified as a LapB binding partner in a global
            protein–protein interaction screen
        - reference_id: PMID:42604454
          supporting_text: >-
            the interactions are proposed to be dynamic and condition‐dependent
        - reference_id: PMID:42604454
          supporting_text: >-
            LpxC activity in P. aeruginosa is stimulated by MurA from the same
            organism, but not by the corresponding E. coli enzyme
        - reference_id: PMID:42604454
          supporting_text: >-
            which range from moderate to high affinity, these interactions
            are likely dynamic and growth‐condition dependent
        - reference_id: PMID:42604454
          supporting_text: >-
            we were able to detect interactions between E. coli MurA and
