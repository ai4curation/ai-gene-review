id: MODULE:peptidoglycan_precursor_biosynthesis
title: Peptidoglycan precursor biosynthesis and lipid II export
description: >-
  The conserved bacterial route that converts UDP-N-acetylglucosamine to UDP-MurNAc-pentapeptide,
  transfers that nucleotide precursor to the undecaprenyl carrier to form lipid I, glycosylates
  lipid I to form lipid II, and translocates lipid II across the cytoplasmic membrane.
  The ten steps are present in essentially all peptidoglycan-producing bacteria and are
  catalysed by single orthologous families throughout. D-Ala-D-Ala synthesis is modelled
  as a convergent input to MurF, and alternative MurE branches represent meso-diaminopimelate-
  and L-lysine-containing stem peptides, the variation that distinguishes most Gram-negative
  from most Gram-positive stem peptides. The module ends at lipid II export and does not
  include glycan polymerization, peptide cross-linking, amino-acid or carrier supply,
  carrier recycling, or cell-wall remodeling.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0009252
    title: peptidoglycan biosynthetic process
    statement: >-
      GO:0009252 supplies the biological-process scope for nucleotide,
      lipid-linked, and exported peptidoglycan precursor formation.
  - source_id:
      file:modules/peptidoglycan_precursor_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for the reusable peptidoglycan precursor module
    statement: >-
      The module-level review supports the ordered MurA-to-MurJ pathway,
      convergent D-Ala-D-Ala input, third-residue variation, and the boundary
      before glycan polymerization and peptide cross-linking.
  - source_id:
      file:projects/P_PUTIDA/deep-research/PSEPK__peptidoglycan_precursor_biosynthesis__ppu00550-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00550 pathway satisfiability review
    statement: >-
      The species-aware review finds all precursor and lipid II export steps
      covered, identifies MurJ as a transporter omitted by the KEGG candidate
      bucket, and distinguishes Ddl paralogs from upstream amino-acid supply.
  - source_id: PMID:42604454
    title: Protein-Protein Interactions Between Peptidoglycan, Lipopolysaccharide,
      and Phospholipid Biosynthesis Enzymes in Escherichia coli.
    statement: >-
      Places Escherichia coli MurA in the LapB interactome alongside the lipid A
      enzymes LpxA, LpxC, and LpxD and the phospholipid enzyme FabZ. The evidence
      is physical association only, so it grounds the recorded knowledge gap
      about partitioning of the shared UDP-GlcNAc pool rather than any module
      part, function, or connection.
    supporting_text: >-
      MurA interacts not only with LapB but also with the LPS biosynthesis
      enzymes LpxA, LpxC, and LpxD as well as with the PL biosynthesis enzyme FabZ
  - source_id: PMID:20659527
    title: >-
      Purification and biochemical characterization of Mur ligases from Staphylococcus
      aureus.
    statement: >-
      Grounds the MurE variant set and the single stem-agnostic MurF step: the purified
      Staphylococcus aureus and Escherichia coli MurE enzymes have strict and inverse
      third-residue specificities, while the MurF enzymes of both organisms accept either
      tripeptide.
    supporting_text: >-
      S. aureus MurF appeared less specific and accepted both forms
  - source_id: file:genes/STAA8/murE/murE-ai-review.yaml
    title: >-
      Gene review of Staphylococcus aureus NCTC 8325 murE (Q2FZP6)
    statement: >-
      Reviewed exemplar of the L-lysine-adding MurE branch, with the L-lysine ligase activity
      accepted as its core molecular function.
  - source_id: file:genes/ECOLI/mraY/mraY-ai-review.yaml
    title: >-
      Gene review of Escherichia coli K-12 mraY (P0A6W3)
    statement: >-
      Reviewed exemplar of the lipid I synthesis step, with the meso-diaminopimelate translocase
      reaction GO:0051992 as its core molecular function and the L-lysine-defined GO:0008963
      rows corrected laterally to it.
module:
  id: peptidoglycan_precursor_biosynthesis
  label: Peptidoglycan precursor biosynthesis and lipid II export
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: peptidoglycan biosynthetic process
      term:
        id: GO:0009252
        label: peptidoglycan biosynthetic process
      description: >-
        Assembly of the lipid II peptidoglycan precursor and its delivery to
        the outer leaflet of the bacterial cytoplasmic membrane.
  parts:
    - order: 1
      role: enolpyruvyl transfer to UDP-GlcNAc
      node:
        id: murA_enolpyruvyl_transfer
        label: MurA enolpyruvyl transfer
        module_type: REACTION
        annotons:
          - id: murA_activity
            label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MurA UDP-N-acetylglucosamine
                  1-carboxyvinyltransferases
                representative_members:
                  - preferred_term: murA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A749
                      label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase
                  - preferred_term: murA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88P88
                      label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase
                ancestral_nodes:
                  - preferred_term: PTHR43783 ancestral node PTN000472564
                    term:
                      id: PANTHER:PTN000472564
                      label: PTN000472564
                    description: >-
                      PAINT IBD node in PTHR43783 asserting GO:0008760 (UDP-N-acetylglucosamine
                      1-carboxyvinyltransferase activity), seeded by UniProtKB:P0A749,
                      with taxon:2 (Bacteria).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD assertion of GO:0008760 at node PTN000472564, read from
                          interpro/panther/PTHR43783/PTHR43783-paint.tsv (snapshot 20241126).
                description: >-
                  The members belong to PANTHER family PTHR43783 (UDP-N-ACETYLGLUCOSAMINE
                  1-CARBOXYVINYLTRANSFERASE), but no family or subfamily identifier is
                  asserted as the grounding for this activity. The family review leaves
                  GO:0008760 UNRESOLVED at both levels: the activity is established for
                  the bacterial and plant plastid members, exactly the PAINT clade asserted
                  below, while ten fungal, diatom and early-metazoan leaves that a family-wide
                  claim would sweep in share subfamily SF1 with canonical MurA and are
                  untested. The node and the reviewed representatives are the grounding
                  instead.
            function:
              preferred_term: UDP-N-acetylglucosamine 1-carboxyvinyltransferase
                activity
              term:
                id: GO:0008760
                label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase activity
              substrates:
                - preferred_term: UDP-N-acetylglucosamine
                - preferred_term: phosphoenolpyruvate
              products:
                - preferred_term: UDP-N-acetylglucosamine enolpyruvate
                - preferred_term: phosphate
            role_description: Commits UDP-GlcNAc to MurNAc precursor synthesis.
    - order: 2
      role: UDP-MurNAc formation
      node:
        id: murB_reduction
        label: MurB UDP-MurNAc formation
        module_type: REACTION
        annotons:
          - id: murB_activity
            label: UDP-N-acetylmuramate dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MurB UDP-N-acetylmuramate dehydrogenases
                representative_members:
                  - preferred_term: murB (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P08373
                      label: UDP-N-acetylenolpyruvoylglucosamine reductase
                  - preferred_term: murB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88LM5
                      label: UDP-N-acetylmuramate dehydrogenase
                term:
                  id: PANTHER:PTHR21071
                  label: UDP-N-ACETYLENOLPYRUVOYLGLUCOSAMINE REDUCTASE
                ancestral_nodes:
