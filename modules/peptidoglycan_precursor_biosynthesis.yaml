  knowledge_gaps:
    - gap_statement: >-
        How flux through the shared UDP-GlcNAc pool is partitioned between MurA
        (peptidoglycan) and LpxA (lipid A) is undetermined. Escherichia coli MurA
        is a direct binding partner of the LapB scaffold and of LpxA, LpxC, LpxD,
        and FabZ, but no catalytic or flux consequence of those contacts has been
        measured, so the coordinating mechanism cannot yet be modeled as a
        reaction step or a regulatory connection.
      boundary: >-
        The interactions themselves are established, by bacterial two-hybrid
        assay, by pull-down of purified proteins, and by microscale
        thermophoresis, and the measured affinities range from moderate to
        high. What is qualified is the association rather than the affinity:
        the authors read their own KD values as a dynamic, growth-condition
        dependent engagement of the LapB scaffold rather than a standing
        complex, on the grounds that simultaneous binding of the partners is
        unlikely. Two earlier screens did miss the contact, a global
        protein-protein interaction screen and a LapB pull-down, and the
        MurA/LpxC pair is the weakest of the five, detected only weakly and
        ranking last in the LpxA > FabZ > LapB > LpxD > LpxC binding
        preference.
        A dosage-level genetic link is nevertheless firmly established
        independently of those contacts: murA is a multicopy suppressor of lapB
        mutants, its overexpression shifting metabolic balance toward
        peptidoglycan and preventing toxic LPS accumulation. MurA is also known
        not to be a LapB/FtsH proteolytic substrate, unlike LpxC and LpxD, so
        coordination via adaptor-directed degradation is excluded for MurA. In
        Pseudomonas aeruginosa, which lacks LapB, MurA does modulate LpxC
        activity directly, and the authors argue from this that the two
        organisms employ distinct strategies: evolutionary covariation and
        AlphaFold-based structural modelling found comparable interactions in
        various bacteria but not in E. coli, and P. aeruginosa LpxC is
        stimulated by its own MurA but not by the corresponding E. coli enzyme.
        Neither result excludes the route in E. coli. The stimulation assay
        reads out P. aeruginosa LpxC throughout, so whether E. coli MurA
        modulates E. coli LpxC was never assayed, and the structural prediction
        is contradicted by this paper's own detection of an E. coli MurA/LpxC
        interaction by three approaches. What is established is a difference in
        strategy, not the absence of the route.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        MurA and LpxC are both antibacterial targets, so whether the committed
        steps of peptidoglycan and lipid A synthesis are functionally coupled
        bears on whether inhibiting one perturbs the other.
      resolution: >-
        Assay MurA and LpxA/LpxC/LpxD activity in the presence of their partners,
        and test envelope-composition phenotypes of interface mutants that lose
        binding without losing catalysis. Encoding the resulting mechanism would
        also require a lipid A (Raetz pathway) module, which modules/ does not
        currently contain.
      provenance:
        - reference_id: PMID:42604454
          supporting_text: >-
            In E. coli, however, the mechanism by which the biosynthesis of all
            three cell envelope layers is coordinated remains unclear.
        - reference_id: PMID:42604454
          supporting_text: >-
            MurA levels remained stable both at native and elevated LapB
            concentrations, indicating that MurA is not subject to degradation by
            the LapB/FtsH machinery
        - reference_id: PMID:42604454
          supporting_text: >-
            murA has been identified as multicopy suppressor of lapB mutants, as
            its overexpression shifts the metabolic balance toward peptidoglycan
            biosynthesis and prevents toxic LPS accumulation
        - reference_id: PMID:42604454
          supporting_text: >-
            MurA was not identified as a LapB binding partner in a global
            protein–protein interaction screen
        - reference_id: PMID:42604454
          supporting_text: >-
            the interactions are proposed to be dynamic and condition‐dependent
        - reference_id: PMID:42604454
          supporting_text: >-
            LpxC activity in P. aeruginosa is stimulated by MurA from the same
            organism, but not by the corresponding E. coli enzyme
        - reference_id: PMID:42604454
          supporting_text: >-
            which range from moderate to high affinity, these interactions
            are likely dynamic and growth‐condition dependent
        - reference_id: PMID:42604454
          supporting_text: >-
            we were able to detect interactions between E. coli MurA and
            LpxC (albeit weak)
        - reference_id: PMID:42604454
          supporting_text: >-
            providing further evidence that these Gram‐negative model
            organisms employ distinct strategies to regulate cell envelope
            homeostasis
  notes: >-
    Reviewed Escherichia coli K-12 proteins ground the conserved DAP-containing
    route, KT2440 representatives preserve traceability to the PSEPK pathway
    satisfiability audit, and reviewed Staphylococcus aureus MurE grounds the
    alternative L-lysine branch. MurF, MraY, and MurG use pentapeptide-generic
    molecular functions so the module remains valid downstream of either MurE branch;
    species-level gene reviews may use the corresponding stem-specific child
    terms. No PANTHER family or PAINT ancestral-node identifier is asserted:
    the checked-in family-member index does not contain most reviewed
    cross-species exemplars, and the shared MurE family does not distinguish
    DAP from L-lysine specificity. The module intentionally excludes amino-acid
    precursor supply, undecaprenyl-carrier synthesis and recycling, SEDS/PBP
    polymerization and cross-linking, and peptidoglycan remodeling.


    CANDIDATE ASSESSED, NOT MODELLED: the MurA-centred protein-interaction hub
    reported for Escherichia coli (PMID:42604454), in which MurA binds the LapB
    scaffold and the lipid A enzymes LpxA, LpxC, and LpxD as well as the
    phospholipid enzyme FabZ, is not represented here. It adds no part to this
    module, since MurA already occupies the enolpyruvyl-transfer step and the
    other five proteins catalyse no peptidoglycan-precursor reaction, and it
    cannot be represented as a connection either: connections are scoped to node
    identifiers within one module document, ModuleConnectionTypeEnum has no
    physical-association type, and four of the five partners (LapB, LpxA, LpxC,
    LpxD) are not modelled anywhere in modules/ because there is no lipid A
    biosynthesis module. Only FabZ is modelled, in type_ii_fatty_acid_synthesis.
    The finding is recorded above as an evidence item and a knowledge gap. It
    would become modellable if a lipid A module is created and a functional, not
    merely physical, consequence of the interactions is demonstrated.
notes: |
  Taxonomic scope. The ten steps are conserved across peptidoglycan-producing
  bacteria, so the module is written species-neutrally and the organisms named are
  exemplars, not a scope restriction. Reviewed Escherichia coli K-12 proteins ground the
  conserved meso-diaminopimelate route step by step, Pseudomonas putida KT2440
  representatives preserve traceability to the PSEPK pathway satisfiability audit that
  first assembled this module, and reviewed Staphylococcus aureus MurE grounds the
  alternative L-lysine branch. Every UniProt accession asserted here has a complete gene
  review; no organism was added only to raise a count.

  Stem-peptide chemistry and the GO terms used. The third stem residue is fixed by MurE
  and is the one real branch point in the pathway, so it is modelled as a variant set.
  Downstream of it, GO offers no stem-agnostic term for the MurF, MraY and MurG
  reactions: GO:0047480, GO:0008963 and GO:0050511 are defined on the L-lysine stem
  peptide, their counterparts GO:0008766, GO:0051992 and GO:0051991 on the
  meso-diaminopimelate one, and each pair is a pair of siblings rather than a
  parent and a child (GO:0016881, GO:0016780 and GO:0008375 respectively are the shared
  parents). These three steps therefore state the meso-diaminopimelate terms, matching
  the reviewed exemplars, and each role_description names the sibling that applies in
  Lys-type organisms. The enzymes themselves are not stem-selective: purified MurF of
  both Escherichia coli and Staphylococcus aureus accepts either tripeptide
  (PMID:20659527), which is why one step serves both MurE branches. A stem-agnostic
  parent for these three activities is raised as a question in the gene reviews rather
  than asserted here.

  PANTHER and PAINT grounding. Each family descriptor carries the PANTHER family of its
  members, taken from the DR PANTHER lines of the members' own UniProt records, with the
  official family name verbatim from interpro/panther/panther.obo; the curator-facing
  description of the role stays in preferred_term. Ancestral nodes are PAINT IBD nodes
  read from the checked-in interpro/panther/<family>/<family>-paint.tsv, one per step,
  each with the GO term it asserts and the snapshot date of the row. Three cases are
  deliberately asserted at a broader node than the module step: MraY (PTN000531998,
  GO:0016780) and MurG (PTN000470555, GO:0016757) have substrate-specific descendant
  nodes that carry the L-lysine-defined terms, which would mis-state the modelled
  reaction, and the L-lysine MurE variant has no node of its own at all, because the
  shared family PTHR23135 does not distinguish third-residue specificity. Both
  Escherichia coli and Staphylococcus aureus MurE in fact map to the same subfamily,
  PTHR23135:SF4, whose name refers to a chloroplastic homolog; specificity is set by
  active-site residues, so no family or subfamily identifier can predict it, and none is
  asserted for that variant.

  Why three steps assert no PANTHER identifier. A family identifier in a descriptor is
  read as the grounding for that step's activity, so it is asserted only where the family
  review grants the activity at that level. MurC therefore cites the subfamily
  PTHR43445:SF3 rather than the family, whose other subfamilies hold the Mpl recycling
  ligases and CapB. MurA and both MurE variants cite no PANTHER identifier at all: the
  family review leaves GO:0008760 UNRESOLVED at family and subfamily level, because the
  untested fungal and diatom leaves share subfamily SF1 with canonical MurA, and it scopes
  both MurE stem-specific terms RESIDUE_DETERMINED, since PTHR23135:SF4 holds
  meso-diaminopimelate-adding and L-lysine-adding enzymes together. In each case the
  family is named in the descriptor's description, and the grounding is the PAINT node plus
  the reviewed representatives, which is what those reviews recommend.

  Boundary. The module intentionally excludes amino-acid precursor supply and the
  racemases that make D-alanine and D-glutamate (modelled in
  d_amino_acid_cell_wall_precursor_supply), undecaprenyl-carrier synthesis and recycling,
  SEDS/PBP polymerization and cross-linking (modelled in
  bacterial_rod_complex_peptidoglycan_transpeptidation and
  bacterial_divisome_peptidoglycan_transpeptidation), and peptidoglycan remodeling and
  recycling.

  CANDIDATE ASSESSED, NOT MODELLED: the MurA-centred protein-interaction hub reported for
  Escherichia coli (PMID:42604454), in which MurA binds the LapB scaffold and the lipid A
  enzymes LpxA, LpxC, and LpxD as well as the phospholipid enzyme FabZ, is not
  represented here. It adds no part to this module, since MurA already occupies the
  enolpyruvyl-transfer step and the other five proteins catalyse no peptidoglycan-precursor
  reaction, and it cannot be represented as a connection either: connections are scoped to
  node identifiers within one module document, ModuleConnectionTypeEnum has no
  physical-association type, and four of the five partners (LapB, LpxA, LpxC, LpxD) are not
  modelled anywhere in modules/ because there is no lipid A biosynthesis module. Only FabZ
  is modelled, in type_ii_fatty_acid_synthesis. The finding is recorded above as an
  evidence item and a knowledge gap. It would become modellable if a lipid A module is
  created and a functional, not merely physical, consequence of the interactions is
  demonstrated.
