id: MODULE:dmel_lkb1_strad_mo25_complex
title: LKB1-STRAD-MO25 kinase complex in Drosophila melanogaster
description: >-
  LKB1 is a serine/threonine kinase that is active only when bound to the pseudokinase STRAD
  (Stlk in Drosophila) and the scaffold MO25. The trimeric complex phosphorylates the activation
  loop of AMPK and of AMPK-related kinases such as Par-1, and so acts as a master upstream
  kinase. In Drosophila, Lkb1 is required for anterior-posterior polarity of the oocyte, for
  epithelial polarity under energy stress, and for asymmetric division of neuroblasts.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001919
  title: 'FlyBase gene group LKB1C: Lkb1-strad-mo25 serine/threonine protein kinase complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as lkb1-strad-mo25 serine/threonine
    protein kinase complex (LKB1C); this module models that group.
- source_id: GO:1902554
  title: serine/threonine protein kinase complex
  statement: >-
    GO term grounding the module as serine/threonine protein kinase complex.
notes: >-
  Lkb1 has no UniProt mapping in the FlyBase file and is grounded to its FlyBase gene id.
  No specific GO cellular-component term exists for this complex, so it is grounded to the
  parent serine/threonine protein kinase complex term. The activation mechanism is best characterized
  for the human complex. FlyBase groups realized by this module: LKB1C (FBgg0001919). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_lkb1_strad_mo25_complex.yaml; none of the member genes has a gene
  review yet unless noted.
