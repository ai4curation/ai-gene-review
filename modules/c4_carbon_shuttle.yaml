id: MODULE:c4_carbon_shuttle
title: C4 carbon shuttle
description: >-
  The C4 carbon-concentrating shuttle, which raises the CO2 concentration at
  Rubisco by fixing inorganic carbon twice in two cell types. Mesophyll
  carbonic anhydrase supplies bicarbonate, PEP carboxylase fixes it into a C4
  acid, the acid moves to the bundle sheath and is decarboxylated there, and
  the released CO2 accumulates around Rubisco while the C3 product returns to
  the mesophyll for PEP regeneration by pyruvate, phosphate dikinase. The
  decarboxylation step is the classic three-way variation (NADP-malic enzyme,
  NAD-malic enzyme, PEP carboxykinase), modelled as a variant set; real
  species often run more than one route at once. The Calvin-Benson-Bassham
  cycle that consumes the released CO2 is included by reference rather than
  restated. Single-cell C4 (Bienertia, Suaeda aralocaspica), which performs
  the same shuttle between two compartments of one cell, is a realization of
  this module rather than an exception to it, but its compartment assignments
  are not modelled here. CAM, which separates the two carboxylations in time
  rather than in space, is a sibling module (MODULE:cam_carbon_shuttle).
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009760
    title: C4 photosynthesis
    statement: >-
      Defines the two-carboxylation process this module decomposes, and carries
      the three decarboxylation-type children used as the variant set.
  - source_id: UniProtKB:P04711
    title: Phosphoenolpyruvate carboxylase 1 (Zea mays)
    statement: >-
      Reviewed C4-type PEP carboxylase, the committing carboxylation of the
      mesophyll step.
  - source_id: UniProtKB:P11155
    title: Pyruvate, phosphate dikinase 1, chloroplastic (Zea mays)
    statement: >-
      Reviewed chloroplastic PPDK, the PEP-regenerating step that makes the
      shuttle cyclic.
notes: >-
  Species-neutral at this boundary: maize proteins are reviewed orienting
  exemplars for an NADP-ME implementation, not a claim that the module is
  maize-specific or that these are the only members. Representative members
  are reviewed (Swiss-Prot) entries except the maize carbonic anhydrase, for
  which no reviewed entry exists; Q41729 is an unreviewed entry carrying
  EC 4.2.1.1 and is marked as such. The variant set is deliberately
  non-exclusive: the NADP-ME, NAD-ME and PCK routes co-occur, and PCK commonly
  operates as a supplement to a malic-enzyme route rather than alone. Bundle
  sheath and mesophyll are named in prose and in node labels rather than as
  cell-type terms, because the module is also satisfied by single-cell C4.
  Suberized bundle-sheath walls and the resulting low CO2 conductance are a
  precondition for the shuttle working, not a step of it, and are left out.
module:
  id: c4_carbon_shuttle
  label: C4 carbon shuttle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: C4 photosynthesis
      term:
        id: GO:0009760
        label: C4 photosynthesis
      description: >-
        Two spatially separated carboxylations that concentrate CO2 at Rubisco.
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: mesophyll bicarbonate supply
      node:
        id: c4_bicarbonate_supply
        label: Carbonic anhydrase hydration of CO2 to bicarbonate
        module_type: REACTION
        annotons:
          - id: c4_carbonic_anhydrase
            label: Mesophyll cytosolic carbonic anhydrase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: beta-carbonic anhydrase (mesophyll cytosolic)
                representative_members:
                  - preferred_term: CA (carbonic anhydrase, Zea mays; unreviewed)
                    term:
                      id: UniProtKB:Q41729
                      label: carbonic anhydrase
            function:
              preferred_term: carbonate dehydratase activity
              term:
                id: GO:0004089
                label: carbonate dehydratase activity
              substrates:
                - preferred_term: CO2
              products:
                - preferred_term: bicarbonate
            role_description: >-
              PEP carboxylase uses bicarbonate, not CO2, so the shuttle needs a
              high cytosolic hydration rate to keep up with carboxylation.
    - order: 2
      role: mesophyll carboxylation
      node:
        id: c4_pep_carboxylation
        label: PEP carboxylase fixation of bicarbonate into oxaloacetate
        module_type: REACTION
        annotons:
          - id: c4_pepc
            label: C4-type phosphoenolpyruvate carboxylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: phosphoenolpyruvate carboxylase (C4 isoform)
                representative_members:
                  - preferred_term: PEP1 / PPC1 (Zea mays)
                    term:
                      id: UniProtKB:P04711
                      label: Phosphoenolpyruvate carboxylase 1
            function:
              preferred_term: phosphoenolpyruvate carboxylase activity
              term:
                id: GO:0008964
                label: phosphoenolpyruvate carboxylase activity
              substrates:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: bicarbonate
              products:
                - preferred_term: oxaloacetate
                - preferred_term: phosphate
            role_description: >-
              The committing step. Insensitive to O2, which is what lets the
              shuttle outrun Rubisco's oxygenase reaction.
    - order: 3
      role: C4 acid formation and transfer to the bundle sheath
      node:
        id: c4_acid_transfer
        label: Reduction to malate (or transamination) and intercellular transfer
        module_type: TRANSPORT_STEP
        annotons:
          - id: c4_nadp_mdh
            label: NADP-malate dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chloroplastic NADP-dependent malate dehydrogenase
                representative_members:
                  - preferred_term: MDH (malate dehydrogenase [NADP], chloroplastic, Zea mays)
                    term:
                      id: UniProtKB:P15719
                      label: Malate dehydrogenase [NADP], chloroplastic
            function:
              preferred_term: L-malate dehydrogenase (NADP+) activity
              term:
                id: GO:0046554
                label: L-malate dehydrogenase (NADP+) activity
              substrates:
                - preferred_term: oxaloacetate
                - preferred_term: NADPH
              products:
                - preferred_term: malate
                - preferred_term: NADP+
            role_description: >-
              Converts the carboxylation product into the transported acid in
              malate-type variants; aspartate-forming variants transaminate
              instead, which is why the carrier is modelled as a C4 acid rather
              than as malate specifically.
          - id: c4_acid_carrier
            label: Plasmodesmatal and plastidic C4-acid movement
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: C4-dicarboxylate transmembrane transporter activity
                term:
                  id: GO:0015556
                  label: C4-dicarboxylate transmembrane transporter activity
              description: >-
                Dicarboxylate translocators on the chloroplast envelope; the
                cell-to-cell leg is diffusive through plasmodesmata and is not
                a transporter-mediated step. The term is the C4-dicarboxylate
                one rather than the malate-specific GO:0015140, because this
                node is deliberately modelled as carrying a C4 acid: the
                aspartate-forming variants transaminate instead of reducing,
                so naming malate here would contradict the node's own scope.
                The term still covers the dicarboxylate leg only - it spans
                malate, oxaloacetate, fumarate and succinate, while aspartate
                moves on amino-acid transporters - so "C4 acid" in the node's
                sense remains broader than any single term GO offers. That gap
                is narrower than the malate-specific one and is accepted
                knowingly rather than papered over with a second annoton.
            function:
              preferred_term: C4-dicarboxylate transmembrane transporter activity
              term:
                id: GO:0015556
                label: C4-dicarboxylate transmembrane transporter activity
            role_description: >-
              Carries the fixed carbon to the decarboxylation site down a
              concentration gradient.
    - order: 4
      role: bundle-sheath decarboxylation
      node:
        id: c4_decarboxylation
        label: Release of CO2 around Rubisco
        module_type: REACTION
        description: >-
          The step that differentiates the three classical C4 subtypes. GO
          carries all three as children of GO:0009760, so the subtype is an
          ontology-level distinction as well as a biochemical one. The variants
          are alternatives at this node but are not mutually exclusive in a
          given species.
        variant_sets:
          - id: c4_decarboxylation_type
            label: C4 decarboxylation route
            axis: decarboxylation route
            selection: ONE_OR_MORE
            variants:
              - id: c4_nadp_me_variant
                label: NADP-malic enzyme type
                concepts:
                  - preferred_term: NADP-malic enzyme C4 photosynthesis
                    term:
                      id: GO:0009762
                      label: NADP-malic enzyme C4 photosynthesis
                annotons:
                  - id: c4_nadp_me
                    label: Chloroplastic NADP-dependent malic enzyme
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: NADP-dependent malic enzyme (C4 isoform)
                        representative_members:
                          - preferred_term: MOD1 (NADP-dependent malic enzyme, chloroplastic, Zea mays)
                            term:
                              id: UniProtKB:P16243
                              label: NADP-dependent malic enzyme, chloroplastic
                    function:
                      preferred_term: malate dehydrogenase (decarboxylating) (NADP+) activity
                      term:
                        id: GO:0004473
                        label: malate dehydrogenase (decarboxylating) (NADP+) activity
                      substrates:
                        - preferred_term: malate
                        - preferred_term: NADP+
                      products:
                        - preferred_term: pyruvate
                        - preferred_term: CO2
                        - preferred_term: NADPH
                    locations:
                      - preferred_term: bundle-sheath chloroplast stroma
                        term:
                          id: GO:0009570
                          label: chloroplast stroma
                    role_description: >-
                      Decarboxylates in the stroma, delivering CO2 directly to
                      Rubisco and NADPH to the reduction phase.
              - id: c4_nad_me_variant
                label: NAD-malic enzyme type
                concepts:
                  - preferred_term: NAD-malic enzyme C4 photosynthesis
                    term:
                      id: GO:0009763
                      label: NAD-malic enzyme C4 photosynthesis
                annotons:
                  - id: c4_nad_me
                    label: Mitochondrial NAD-dependent malic enzyme
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: malate dehydrogenase (decarboxylating) (NAD+) activity
                        term:
                          id: GO:0004471
                          label: malate dehydrogenase (decarboxylating) (NAD+) activity
                    function:
                      preferred_term: malate dehydrogenase (decarboxylating) (NAD+) activity
                      term:
                        id: GO:0004471
                        label: malate dehydrogenase (decarboxylating) (NAD+) activity
                      substrates:
                        - preferred_term: malate
                      products:
                        - preferred_term: pyruvate
                        - preferred_term: CO2
                    locations:
                      - preferred_term: mitochondrion
                        term:
                          id: GO:0005739
                          label: mitochondrion
                    role_description: >-
                      Decarboxylates in the mitochondrion, so the CO2 must
                      diffuse to the chloroplast; these species transport
                      aspartate rather than malate.
              - id: c4_pck_variant
                label: PEP carboxykinase type
                concepts:
                  - preferred_term: PEP carboxykinase C4 photosynthesis
                    term:
                      id: GO:0009764
                      label: PEP carboxykinase C4 photosynthesis
                annotons:
                  - id: c4_pepck
                    label: Cytosolic PEP carboxykinase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ATP-dependent phosphoenolpyruvate carboxykinase
                        representative_members:
                          - preferred_term: PCK1 (Arabidopsis thaliana; C3 exemplar of the family)
                            term:
                              id: UniProtKB:Q9T074
                              label: Phosphoenolpyruvate carboxykinase (ATP) 1
                    function:
                      preferred_term: phosphoenolpyruvate carboxykinase (ATP) activity
                      term:
                        id: GO:0004612
                        label: phosphoenolpyruvate carboxykinase (ATP) activity
                      substrates:
                        - preferred_term: oxaloacetate
                        - preferred_term: ATP
                      products:
                        - preferred_term: phosphoenolpyruvate
                        - preferred_term: CO2
                        - preferred_term: ADP
                    role_description: >-
                      Decarboxylates oxaloacetate and regenerates PEP in one
                      step, so this variant needs less PPDK flux. The
                      representative is a C3 family exemplar: no reviewed
                      entry exists for a PCK-type C4 grass.
    - order: 5
      role: PEP regeneration
      node:
        id: c4_pep_regeneration
        label: Pyruvate, phosphate dikinase regeneration of PEP
        module_type: REACTION
        annotons:
          - id: c4_ppdk
            label: Pyruvate, phosphate dikinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: pyruvate, phosphate dikinase
                representative_members:
                  - preferred_term: PPDK1 (pyruvate, phosphate dikinase 1, chloroplastic, Zea mays)
                    term:
                      id: UniProtKB:P11155
                      label: Pyruvate, phosphate dikinase 1, chloroplastic
            function:
              preferred_term: pyruvate, phosphate dikinase activity
              term:
                id: GO:0050242
                label: pyruvate, phosphate dikinase activity
              substrates:
                - preferred_term: pyruvate
                - preferred_term: ATP
                - preferred_term: phosphate
              products:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: AMP
                - preferred_term: diphosphate
            role_description: >-
              Closes the cycle at the cost of two ATP equivalents per CO2
              delivered, which is the energetic price of the shuttle.
    - order: 6
      role: light/dark control of PPDK
      optional: true
      node:
        id: c4_ppdk_regulation
        label: PPDK regulatory protein
        module_type: REGULATORY_STEP
        annotons:
          - id: c4_pdrp
            label: PPDK regulatory protein (bifunctional kinase/phosphatase)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: pyruvate, phosphate dikinase regulatory protein
                representative_members:
                  - preferred_term: PDRP1 (pyruvate, phosphate dikinase regulatory protein, Zea mays)
                    term:
                      id: UniProtKB:Q195N6
                      label: Pyruvate, phosphate dikinase regulatory protein, chloroplastic
            function:
              preferred_term: ADP-dependent phosphorylation and dephosphorylation of PPDK Thr
              description: >-
                A single protein carrying both activities (EC 2.7.11.32 and
                EC 2.7.4.27); phosphorylation inactivates PPDK in the dark.
              targets:
                - preferred_term: pyruvate, phosphate dikinase
            role_description: >-
              Switches the regeneration step off in the dark, preventing a
              futile ATP-consuming cycle.
    - order: 7
      role: carbon fixation by the Calvin-Benson-Bassham cycle
      node:
        id: c4_cbb_cycle
        label: Calvin-Benson-Bassham cycle in the bundle sheath
        description: >-
          Included by reference to MODULE:calvin_benson_bassham_cycle. The
          shuttle exists to raise CO2 at the Rubisco of this cycle; it is not
          an alternative to it. GO places GO:0009760 under the same
          carbon-fixation grouping term as the cycle itself.
        module_ref: calvin_benson_bassham_cycle
        concepts:
          - preferred_term: reductive pentose-phosphate cycle
            term:
              id: GO:0019253
              label: reductive pentose-phosphate cycle
  connections:
    - source: c4_bicarbonate_supply
      target: c4_pep_carboxylation
      connection_type: PROVIDES_INPUT_FOR
      description: Carbonic anhydrase supplies the bicarbonate PEP carboxylase fixes.
    - source: c4_pep_carboxylation
      target: c4_acid_transfer
      connection_type: PRECEDES
      description: Oxaloacetate is reduced or transaminated before transfer.
    - source: c4_acid_transfer
      target: c4_decarboxylation
      connection_type: PRECEDES
      description: The C4 acid reaches the bundle sheath and is decarboxylated.
    - source: c4_decarboxylation
      target: c4_pep_regeneration
      connection_type: PRECEDES
      description: >-
        The C3 product returns to the mesophyll for PEP regeneration. In the
        PCK variant the decarboxylation itself regenerates PEP, so this leg
        carries less flux.
    - source: c4_decarboxylation
      target: c4_cbb_cycle
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The released CO2 accumulates around Rubisco, suppressing the oxygenase
        reaction and photorespiration.
    - source: c4_ppdk_regulation
      target: c4_pep_regeneration
      connection_type: NEGATIVELY_REGULATES
      description: Phosphorylation inactivates PPDK in the dark.
