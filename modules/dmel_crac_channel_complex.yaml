id: MODULE:dmel_crac_channel_complex
title: CRAC channel (Stim-Orai) complex in Drosophila melanogaster
description: >-
  The calcium release-activated calcium (CRAC) channel mediates store-operated calcium entry.
  Stim is a single-pass endoplasmic reticulum membrane protein whose luminal EF-hand senses
  ER calcium; when ER stores are depleted, Stim oligomerises, moves to ER-plasma membrane
  junctions and binds and opens Orai, the pore-forming plasma membrane channel subunit. Stim
  and Orai were identified in Drosophila S2 cell RNAi screens as essential for store-operated
  calcium entry.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000592
  title: 'FlyBase gene group CRAC: Calcium release-activated calcium channel complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as calcium release-activated
    calcium channel complex (CRAC); this module models that group.
- source_id: GO:0034704
  title: calcium channel complex
  statement: >-
    GO term grounding the module as calcium channel complex.
notes: >-
  GO has no specific term for the CRAC channel complex, so the parent term calcium channel
  complex is used. Stim and Orai sit in different membranes and interact at ER-plasma membrane
  junctions after store depletion. FlyBase groups realized by this module: CRAC (FBgg0000592).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_crac_channel_complex.yaml;
  none of the member genes has a gene review yet unless noted.
