      connection_type: NEGATIVELY_REGULATES
      description: Malonyl-CoA, the ACC product, inhibits CPT1; less malonyl-CoA allows fatty acid entry into mitochondria.
knowledge_gaps:
  - gap_statement: >-
      Which phosphatase dephosphorylates AMPK alpha Thr172 in a given tissue under
      physiological energy recovery, and how the AMP/ADP-bound gamma subunit protects
      the site from each phosphatase class, is not established.
    boundary: >-
      PP2A, PPM1E/PPM1F and PP1-R6 have each been implicated by depletion or
      inhibitor studies in particular cell lines (metal-treated cells, HEK293, MIN6 beta
      cells), and PPM1F's role is described only as probable.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      Determines whether the termination step is one variant per tissue or a
      redundant set, and which phosphatase is a credible drug target for sustaining
      AMPK activity.
    provenance:
      - reference_id: PMID:20801214
        supporting_text: The data indicate that Ppm1E and probably PpM1F are in cellulo AMPK phosphatases and that Ppm1E is a potential anti-diabetic drug target.
