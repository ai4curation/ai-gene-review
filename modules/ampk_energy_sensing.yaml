      connection_type: NEGATIVELY_REGULATES
      description: Thr172 dephosphorylation switches AMPK off; AMP/ADP binding to gamma protects against it.
    - source: ampk_heterotrimer
      target: ampk_tsc_relay
      connection_type: POSITIVELY_REGULATES
      description: AMPK phosphorylates TSC2 and enhances TSC1-TSC2 GAP activity.
    - source: ampk_tsc_relay
      target: ampk_mtorc1_output
      connection_type: NEGATIVELY_REGULATES
      description: TSC1-TSC2 converts RHEB-GTP to RHEB-GDP, preventing mTORC1 activation.
    - source: ampk_heterotrimer
      target: ampk_mtorc1_output
      connection_type: NEGATIVELY_REGULATES
      description: AMPK phosphorylates raptor, inhibiting mTORC1 independently of TSC2.
    - source: ampk_heterotrimer
      target: ampk_acc_output
      connection_type: NEGATIVELY_REGULATES
      description: AMPK phosphorylation inhibits acetyl-CoA carboxylase.
    - source: ampk_acc_output
