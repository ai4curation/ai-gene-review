      description: >-
        The EJC deposited during splicing recruits UPF3B, and an EJC left downstream of a
        terminating ribosome is what lets UPF2-UPF3B connect to UPF1.
    - source: upf_surveillance_complex
      target: upf1_phosphorylation
      connection_type: PRECEDES
      description: SMG1C phosphorylates UPF1 only after SURF has associated with the EJC-bound UPF complex.
    - source: upf1_phosphorylation
      target: decay_initiation
      connection_type: PRECEDES
      description: Phosphorylated UPF1 is the binding site for the 14-3-3-like domains of SMG5, SMG6 and SMG7.
