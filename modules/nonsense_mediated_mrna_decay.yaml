id: MODULE:nonsense_mediated_mrna_decay
title: Human exon junction complex-dependent nonsense-mediated mRNA decay — EJC mark, UPF1-UPF2-UPF3B surveillance complex, SMG1C phosphorylation of UPF1, and SMG6 endonucleolytic and SMG5-SMG7 decay routes
description: >-
  Nonsense-mediated mRNA decay (NMD) removes mRNAs whose translation ends at a premature
  termination codon. In mammals the best-characterised trigger is a termination event that
  happens upstream of an exon junction complex (EJC). The EJC is deposited by the spliceosome
  about 24 nucleotides upstream of each exon-exon junction: the DEAD-box protein EIF4A3 clamps
  the mRNA in a sequence-independent way and is locked there by the MAGOH-RBM8A (Y14)
  heterodimer, which inhibits its ATPase; the peripheral factor CASC3 (Barentsz) joins the
  core. EJCs travel with the mRNA to the cytoplasm and are normally displaced by the first
  ribosome. When a ribosome terminates upstream of a remaining EJC, the RNA helicase UPF1,
  bound at the terminating ribosome with the release factors eRF1 and eRF3 and the SMG1
  kinase complex (the SURF complex), is connected to the EJC through UPF2 and UPF3B, which
  binds a composite surface of EIF4A3, MAGOH and RBM8A. UPF2 and UPF3B stimulate the ATPase
  and helicase activities of UPF1, and SMG1, a PI3K-related kinase held with its regulatory
  subunits SMG8 and SMG9, phosphorylates UPF1 on SQ motifs. Phosphorylated UPF1 recruits the
  decay effectors through their 14-3-3-like domains: the PIN-domain endonuclease SMG6 cleaves
  the mRNA near the premature stop codon, and the SMG5-SMG7 heterodimer recruits
  deadenylation and decapping activities through SMG7 and, with protein phosphatase 2A,
  promotes the dephosphorylation of UPF1. The fragments and the deadenylated or decapped mRNA
  are then degraded by the general cytoplasmic mRNA decay enzymes. The UPF3B paralogue UPF3A
  is only weakly active in NMD and mainly opposes it by competing with UPF3B for UPF2.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000101
    title: translation pathway
    statement: >-
      The RGD Pathway Ontology diagram for translation names nonsense-mediated mRNA decay as one
      of the surveillance pathways triggered by a premature stop codon and links the
      nonsense-mediated mRNA decay pathway as a diagram sub-pathway. This module is item 4 of the
      translation split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md and
      covers that surveillance branch. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0000101.yaml). RGD annotates none of the module's genes to PW:0000101 itself
      (see notes).
  - source_id: GO:0000184
    title: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    statement: >-
      The module's process concept, the GO term mapped from RGD's nonsense-mediated mRNA decay
      pathway in projects/RGD_PATHWAY_ONTOLOGY/data/pw_go_mappings.sssom.yaml. In QuickGO
      (November 2026) UPF1, UPF2, UPF3B, SMG1, SMG6, SMG8, SMG9, EIF4A3, MAGOH, MAGOHB and RBM8A
      carry an experimental (IDA, IMP or IGI) row for it; SMG5 and SMG7 carry TAS rows; CASC3
      carries an IDA row for regulation of NMD; UPF3A carries a NOT row.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000101 (translation pathway) as item 4 of
  the translation split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md). The
  PW:0000101 diagram text says that a premature stop codon triggers nonsense-mediated mRNA
  decay, with eRF1 and eRF3 recognising the ribosome, and the diagram links RGD's
  nonsense-mediated mRNA decay pathway PW:0000548 as a sub-pathway. PW:0000548's id and label
  were checked against .cache/rgd_pw/pw.obo, but RGD annotates no human or rat gene to it in
  homo_genes_pw and rattus_genes_pw (both dated 2026-07-25), so it is named here in prose and
  is not an evidence source. None of the module's genes is annotated to PW:0000101 either;
  thirteen of them (all but SMG8 and SMG9) are annotated by RGD, as KEGG imports (IEA), to the
  parent mRNA decay pathway PW:0000546, which also covers nonstop, no-go, exosome-mediated and
  Staufen-mediated decay and the rest of the KEGG mRNA surveillance map. PW:0000546 is not
  cited as an evidence source because the module covers only its nonsense-mediated branch;
  whether it should be cited is left to the project coordinator. PW:0000101 is cited because
  the split plan assigns NMD to it and the diagram draws it. Membership follows the split plan
  (UPF1-3, SMG1 and SMG5-7, with the exon junction complex) plus the SMG1 regulatory subunits
  SMG8 and SMG9. UniProt accessions are from the local gene-review UniProt files (UPF1, UPF2,
  UPF3A, UPF3B) and UniProt REST (November 2026). Gene reviews exist for UPF1, UPF2, UPF3A and
  UPF3B and their core functions were used; for the other members, functions come from their
  experimental QuickGO rows (November 2026). Curator-authored functions without an
  experimental GOA row or a gene-review core function are: UPF2 ATPase activator activity, the
  protein-macromolecule adaptor activity of the SMG5-SMG7 heterodimer and of SMG7, and the
  complex-level mRNA binding of the EJC, which restates the EIF4A3 IDA row for the assembled
  complex. UPF3B's mRNA binding is its gene-review core function and IDA row.

  Boundary decisions. (1) The EJC is a part, not context, although modules/mrna_nuclear_export
  treats it as context. In NMD it does work in the step: it binds UPF3B and so places the UPF
  complex downstream of the stop codon (the scaffold case of the participation rule), and its
  core subunits carry experimental NMD rows. Its assembly by the spliceosome (including the
  escort factor CWC22) belongs to the planned major_spliceosome_cycle module, its disassembly
  by PYM1 after translation is not modelled, and the peripheral RNPS1-containing ASAP/PSAP
  complexes, which define an alternative UPF2-dependent route into NMD (PMID:16209946), are
  left out. MAGOH and MAGOHB are listed as alternative units, as paralogues are in
  modules/mediator_complex. CASC3 is listed as a peripheral unit; it is part of the tetrameric
  EJC core used in the UPF3b-EJC structure, but its own requirement for NMD is less well
  established than that of the core (it carries only a regulation-of-NMD row in GOA). (2) The
  terminating ribosome and the release factors eRF1 (ETF1) and eRF3 (GSPT1), which are SURF
  components with UPF1 and SMG1, belong to the sibling modules cytoplasmic_ribosome and
  translation_elongation_and_termination. They are referenced in prose and not by module_ref,
  because those modules were drafted in parallel and do not yet exist in modules/; once they
  do, the upf_surveillance_complex part can reference the termination node. Ribosomal
  proteins are not listed. (3) UPF3A is an optional annoton with a negative-regulation
  process, because it is a weak NMD factor that mainly antagonises UPF3B. (4) SMG8 and SMG9
  get no molecular function: their effect on SMG1 was measured only on the isolated complex.
  (5) The decay step is a ROUTE variant set (SMG6 endonucleolytic; SMG5-SMG7) with
  ONE_OR_MORE selection, because the two routes are partially redundant. SMG6's EJC-binding
  and the SMG6-SMG5-SMG7 hand-offs are not modelled separately. (6) Downstream general decay
  is excluded by decision: the CCR4-NOT deadenylase, the DCP1-DCP2 decapping complex and its
  activators, the adaptor PNRC2, the 5'-3' exonuclease XRN1, and the cytoplasmic exosome with
  the SKI complex act on many mRNA classes and do not distinguish NMD targets. The only human
  modules that model some of them are the ccr4_not_deadenylation, target_decapping and
  xrn1_decay nodes of modules/mirna_biogenesis_and_silencing, which are framed on miRNA
  targets and so are not module_ref'd from here; there is no human exosome module
  (modules/dmel_rna_exosome is Drosophila). A general cytoplasmic mRNA decay module would be
  the right target for a module_ref from the decay_initiation part. Protein phosphatase 2A,
  which dephosphorylates UPF1 with SMG5-SMG7, is a general phosphatase and is named only in
  prose. (7) Out of scope: EJC-independent NMD triggered by long 3' UTRs and its antagonism by
  PABPC1; NMD regulators and feedback factors such as DHX34 and NBAS; Staufen-mediated decay
  (PW:0000550); nonstop and no-go decay, which the split plan leaves to a later
  ribosome-quality-control module; and the non-NMD roles of UPF1, SMG1, SMG5, SMG6 and SMG7 in
  telomere maintenance, histone mRNA decay and the DNA damage response. (8) Locations are the
  cytosol for every annoton where a location is given, because NMD acts on translating mRNA;
  the nuclear deposition of the EJC and the shuttling of UPF3B are stated in prose.

  GO-CAM links. No production GO-CAM in gocams/index.tsv contains any member (searched by all
  fifteen UniProt accessions and by NMD, UPF and SMG in titles and labels), and no
  orthologous NMD model was found. The human model of SKI-complex extraction of mRNA from
  stalled ribosomes followed by PELO-HBS1L and ABCE1 (gomodel:63e5937500001279) concerns
  no-go and nonstop decay and is not linked. PANTHER family ids and PTNs are not asserted.

  Possible upstream errors and curation gaps (queries only). (a) The definition of the GO
  cellular-component term for the UPF complex (nonsense-mediated decay complex) describes 3'
  to 5' degradation of an mRNA whose 3' end lacks a poly(A) tail, which does not describe the
  complex or human NMD; a definition change is recorded in proposed_ontology_changes. (b)
  UPF1, UPF2, SMG1, SMG5, SMG6 and SMG7 each carry a TAS row for mRNA export from nucleus from
  PMID:16488880, a paper on UPF1 in S-phase progression. A TAS needs only an author
  statement and the full text was not read, so this is a query about a possible
  over-annotation, not a claimed error. (c) SMG5 and SMG7 carry only TAS rows for NMD although
  experimental human evidence exists (PMID:23348841, PMID:14636577); a curation gap, not an
  error.
proposed_ontology_changes:
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0170010
      label: nonsense-mediated decay complex
    old_value: >-
      A highly conserved protein complex that recognises and elicits the rapid degradation of
      mRNAs in which an amino-acid codon has changed to a nonsense codon; occurs when the 3' end
      is not protected by a 3'-poly(A) tail; degradation proceeds in the 3' to 5' direction.
    new_value: >-
      A highly conserved protein complex that recognises mRNAs whose translation terminates at a
      premature termination codon and elicits their rapid degradation. Its core is the RNA
      helicase UPF1 with UPF2 and UPF3; in metazoa it links UPF1 at the terminating ribosome to
      a downstream exon junction complex.
    change_dsl: >-
      change definition of GO:0170010 to 'A highly conserved protein complex that recognises
      mRNAs whose translation terminates at a premature termination codon and elicits their
      rapid degradation. Its core is the RNA helicase UPF1 with UPF2 and UPF3; in metazoa it
      links UPF1 at the terminating ribosome to a downstream exon junction complex.'
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      The term's synonym is "Upf complex" and human UPF1, UPF2, UPF3B, SMG5 and SMG7 are
      annotated to it by NAS and IPI rows, but the last two clauses of the definition ("occurs
      when the 3' end is not protected by a 3'-poly(A) tail; degradation proceeds in the 3' to
      5' direction") describe a mode of decay of the target, not the complex, and are not true
      of NMD in general. In human cells NMD can begin with endonucleolytic cleavage near the
      premature stop codon by SMG6, and the SMG5-SMG7 route recruits deadenylation and
      decapping. The proposed text keeps the recognition clause, removes the decay-mode clauses
      and names the core subunits. The papers cited by the existing definition were not read,
      so the change is PROBABLE rather than CONFIRMED.
    supported_by:
      - reference_id: PMID:19060897
        supporting_text: Here we report that degradation of human nonsense mRNAs can be initiated by PTC-proximal endonucleolytic cleavage.
      - reference_id: PMID:23348841
        supporting_text: the SMG5-SMG7 complex and SMG6 play partially redundant roles in the degradation of aberrant mRNAs
      - reference_id: PMID:11163187
        supporting_text: While in HeLa cell extracts these proteins are complexed with hUpf1
module:
  id: nonsense_mediated_mrna_decay
  label: Human EJC-dependent nonsense-mediated mRNA decay
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: nonsense-mediated mRNA decay
      term:
        id: GO:0000184
        label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
      description: The GO process for the whole pathway; the four parts are its steps.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  parts:
    - order: 1
      role: the exon junction complex as the splicing-deposited mark that defines a premature stop codon
      node:
        id: ejc_mark
        label: Exon junction complex core (EIF4A3, MAGOH or MAGOHB, RBM8A) with CASC3, clamped on spliced mRNA
        module_type: PROTEIN_COMPLEX
        description: >-
          The EJC core is assembled by the spliceosome before exon ligation (EIF4A3 with
          MAGOH-RBM8A form the pre-EJC) and is joined by CASC3 after release from the
          spliceosome. It stays on the mRNA through export and marks the position of each
          removed intron until a translating ribosome displaces it. Its assembly is part of
          splicing and is not modelled here; the module uses the deposited EJC as the platform
          that recruits UPF3B.
        concepts:
          - preferred_term: exon-exon junction complex
            term:
              id: GO:0035145
              label: exon-exon junction complex
        annotons:
          - id: ejc_core_clamp
            label: The EJC core clamps spliced mRNA upstream of the exon-exon junction and presents a binding surface for UPF3B
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: exon junction complex core
                term:
                  id: GO:0035145
                  label: exon-exon junction complex
                active_units:
                  - id: eif4a3_unit
                    label: EIF4A3
                    role: >-
                      DEAD-box RNA-dependent ATPase that binds the RNA backbone of six nucleotides;
                      held in the ATP-bound, pre-hydrolysis state, it is the sequence-independent
                      RNA clamp of the EJC
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EIF4A3
                        term:
                          id: UniProtKB:P38919
                          label: Eukaryotic initiation factor 4A-III
                    function:
                      preferred_term: mRNA binding
                      term:
                        id: GO:0003729
                        label: mRNA binding
                  - id: magoh_unit
                    label: MAGOH
                    role: >-
                      with RBM8A, the heterodimer that locks EIF4A3 in the pre-hydrolysis state by
                      inhibiting its ATPase; part of the composite surface bound by UPF3B
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MAGOH
                        term:
                          id: UniProtKB:P61326
                          label: Protein mago nashi homolog
                  - id: magohb_unit
                    label: MAGOHB
                    role: >-
                      paralogue of MAGOH and alternative to it in a given EJC; MAGOH and MAGOHB are
                      redundant for NMD
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MAGOHB
                        term:
                          id: UniProtKB:Q96A72
                          label: Protein mago nashi homolog 2
                  - id: rbm8a_unit
                    label: RBM8A (Y14)
                    role: >-
                      RRM protein whose RNA-binding surface is masked by MAGOH; with MAGOH it
                      inhibits the EIF4A3 ATPase and contacts UPF3B
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RBM8A
                        term:
                          id: UniProtKB:Q9Y5S9
                          label: RNA-binding protein 8A
                  - id: casc3_unit
                    label: CASC3 (Barentsz, MLN51)
                    role: >-
                      peripheral EJC factor that joins the core after release from the spliceosome
                      and stabilises the EIF4A3 clamp on RNA; reported to bridge the EJC to UPF1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CASC3
                        term:
                          id: UniProtKB:O15234
                          label: Protein CASC3
            function:
              preferred_term: mRNA binding
              term:
                id: GO:0003729
                label: mRNA binding
            processes:
              - preferred_term: nonsense-mediated mRNA decay
                term:
                  id: GO:0000184
                  label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Function of the assembled complex: sequence-independent binding of spliced mRNA
              upstream of the junction. Only EIF4A3 binds the RNA (mRNA binding, IDA,
              PMID:22961380); MAGOH, MAGOHB and RBM8A have no experimental molecular function in
              GOA beyond high-throughput RNA binding and are given none here. Their ATPase
              inhibition was assayed only on the heterodimer within the reconstituted core
              (PMID:16170325), so no inhibitor activity is assigned to either subunit; CASC3,
              whose experimental function row is DEAD/H-box RNA helicase binding (EXP,
              PMID:16931718), likewise gets no function. EIF4A3's helicase and ATPase
              activities (IDA, PMID:10523622) are not used, because the EJC works by suppressing
              them. The EJC takes part in NMD as a scaffold: it does work in the step by
              binding UPF3B and so placing the UPF complex downstream of the stop codon, and
              EIF4A3, MAGOH, MAGOHB and RBM8A each carry experimental NMD rows (IMP,
              PMID:16209946; IGI, PMID:23917022). The location is the cytosol, where NMD acts;
              the EJC is deposited in the nucleus.
            evidence:
              - source_id: PMID:16170325
                statement: MLN51 (CASC3), MAGOH, Y14 and ATP-bound eIF4AIII are necessary and sufficient for a stable EJC core on RNA, held by inhibition of the eIF4AIII ATPase by MAGOH-Y14.
                supporting_text: The stable association of the recombinant EJC core with RNA is maintained by inhibition of eIF4AIII ATPase activity by MAGOH-Y14.
              - source_id: PMID:16931718
                statement: In the crystal structure of the EJC core, eIF4AIII binds six nucleotides of RNA and MAGOH-Y14 lock it in a prehydrolysis state.
                supporting_text: The MAGOH and Y14 subunits lock eIF4AIII in a prehydrolysis state
              - source_id: PMID:12781131
                statement: MAGOH binds the RRM of Y14 and masks its RNA-binding surface.
                supporting_text: Magoh binds with high affinity to the RNP motif RNA binding domain (RBD) of Y14 and completely masks its RNA binding surface.
              - source_id: PMID:22961380
                statement: Sequence-independent binding of the EJC core to RNA is carried by eIF4AIII.
                supporting_text: Sequence-independent binding of the EJC core to RNA is ensured by the DEAD-box helicase eIF4AIII.
              - source_id: PMID:23917022
                statement: MAGOH and MAGOHB both incorporate into EJCs and activate NMD; only their simultaneous depletion impairs NMD.
                supporting_text: the simultaneous depletion of MAGOH and MAGOHB, but not individual depletions, impair nonsense-mediated decay in human cells
              - source_id: PMID:19478851
                statement: The pre-EJC (eIF4A3 with MAGOH-Y14) forms before exon ligation; BTZ (CASC3) joins later and was found to bridge the EJC to UPF1.
                supporting_text: The pre-EJC consists of eIF4A3 and MAGOH-Y14, is formed before exon ligation, and provides a binding platform for peripheral EJC components
    - order: 2
      role: termination-coupled assembly of the UPF surveillance complex bridging UPF1 at the terminating ribosome to the downstream EJC
      node:
        id: upf_surveillance_complex
        label: UPF1 at the terminating ribosome joins UPF2 and the EJC-bound UPF3B, which activate its ATPase and helicase
        module_type: PROTEIN_COMPLEX
        description: >-
          UPF1 is recruited to the terminating ribosome with eRF1 and eRF3 and the SMG1 kinase
          complex (SURF). The terminating ribosome and the release factors belong to the
          sibling modules cytoplasmic_ribosome and translation_elongation_and_termination and
          are not re-modelled here. When an EJC lies downstream, UPF3B, bound to the EJC core,
          and UPF2 bridge UPF1 to it, forming the UPF1-UPF2-UPF3B surveillance complex in which
          UPF2 and UPF3B stimulate UPF1. The UPF3B paralogue UPF3A, a weak NMD factor that
          competes with UPF3B for UPF2, is an optional antagonistic annoton.
        concepts:
          - preferred_term: UPF surveillance complex
            term:
              id: GO:0170010
              label: nonsense-mediated decay complex
            description: >-
              GO's term for the UPF complex (synonym "Upf complex"). Its definition describes
              decay as 3' to 5' degradation of an unprotected 3' end, which does not describe
              human NMD; a definition change is requested in proposed_ontology_changes.
        annotons:
          - id: upf1_helicase
            label: UPF1 ATP-dependent RNA helicase remodels the target mRNP
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UPF1
                term:
                  id: UniProtKB:Q92900
                  label: Regulator of nonsense transcripts 1
            function:
              preferred_term: RNA helicase activity
              term:
                id: GO:0003724
                label: RNA helicase activity
            processes:
              - preferred_term: nonsense-mediated mRNA decay
                term:
                  id: GO:0000184
                  label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The central NMD effector. Function from the UPF1 gene review core function and
              its IDA rows (PMID:12554878, PMID:21419344); the more specific 5'-3' RNA helicase
              activity is also an IDA row (PMID:26138914). UPF1 is a highly processive
              translocase that can strip proteins from the mRNA, and its activity is held in
              check until UPF2 binds. Its phosphorylation by SMG1C is the next part.
            evidence:
              - source_id: PMID:26138914
                statement: Human UPF1 is a processive RNA helicase and translocase that remodels mRNPs.
                supporting_text: Upf1 efficiently translocates through double-stranded structures and protein-bound sequences, demonstrating that Upf1 is an efficient ribonucleoprotein complex remodeler.
              - source_id: PMID:11163187
                statement: Tethering any hUpf protein downstream of a stop codon elicits NMD; the hUpf complex is proposed to assemble at exon junctions and trigger NMD after termination.
                supporting_text: tethering of any hUpf protein to the 3'UTR of beta-globin mRNA elicits NMD
          - id: upf2_bridge_activator
            label: UPF2 bridges UPF1 to UPF3B and stimulates the UPF1 ATPase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UPF2
                term:
                  id: UniProtKB:Q9HAU5
                  label: Regulator of nonsense transcripts 2
            function:
              preferred_term: ATPase activator activity
              term:
                id: GO:0001671
                label: ATPase activator activity
            processes:
              - preferred_term: nonsense-mediated mRNA decay
                term:
                  id: GO:0000184
                  label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Curator-authored function. UPF2 has no experimental molecular function row in GOA
              relevant to NMD (its only one is telomeric repeat DNA binding), and its gene
              review records its two core roles, bridging UPF1 to UPF3B and activating UPF1, in
              prose without a molecular function term. ATPase activator activity is used
              because UPF2, with UPF3B, stimulates the ATPase and helicase of UPF1 in the
              reconstituted complex (PMID:18066079); GO has no helicase activator term. The
              stimulation is cooperative with UPF3B, so the term is a statement about UPF2 in
              the complex, not alone.
            evidence:
              - source_id: PMID:18066079
                statement: In the reconstituted UPF trimer, UPF2 and UPF3b cooperatively stimulate the ATPase and helicase of UPF1.
                supporting_text: In the UPF trimeric complex, UPF2 and UPF3b cooperatively stimulate both ATPase and RNA helicase activities of UPF1.
              - source_id: PMID:19556969
                statement: UPF2 bound to UPF3 on a downstream EJC contacts UPF1 at the stalled ribosome through a bipartite interface whose disruption impairs NMD.
                supporting_text: In mammalian cells, NMD is triggered when UPF2 bound to UPF3 on a downstream exon junction complex interacts with UPF1 bound to a stalled ribosome.
          - id: upf3b_ejc_bridge
            label: UPF3B binds the EJC core and recruits UPF2
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UPF3B
                term:
                  id: UniProtKB:Q9BZI7
                  label: Regulator of nonsense transcripts 3B
            function:
              preferred_term: mRNA binding
              term:
                id: GO:0003729
                label: mRNA binding
            processes:
              - preferred_term: nonsense-mediated mRNA decay
                term:
                  id: GO:0000184
                  label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The bridge between the EJC and the UPF complex. The function term is the UPF3B
              gene review core function and its IDA rows (PMID:11163187, PMID:11546873): UPF3B
              associates with spliced mRNA through the EJC. Its mechanistic role is binding
              the composite EIF4A3-MAGOH-RBM8A surface with its C-terminal domain and UPF2 with
              its N-terminal RRM; GO:1990448 exon-exon junction complex binding would describe
              the first, but has no experimental UPF3B row and is not asserted. UPF3B shuttles
              and joins the EJC in the nucleus; the surveillance complex acts in the cytosol.
            evidence:
              - source_id: PMID:20479275
                statement: UPF3b bridges the surveillance complex to the EJC, binding a composite surface of eIF4AIII, MAGO and Y14.
                supporting_text: Human UPF3b binds with the C-terminal domain stretched over a composite surface formed by eIF4AIII, MAGO, and Y14.
              - source_id: PMID:18066079
                statement: The EJC core provides a composite binding site for UPF3b, which bridges it to UPF2 and UPF1.
                supporting_text: The EJC proteins MAGOH, Y14 and eIF4AIII provide a composite binding site for UPF3b that serves as a bridge to UPF2 and UPF1.
              - source_id: PMID:12718880
                statement: The Y14-UPF3b interaction is essential for NMD in tethering assays.
                supporting_text: Tethered function analysis shows that the Y14/hUpf3b interaction is essential for NMD
          - id: upf3a_antagonist
            label: "Optional: UPF3A competes with UPF3B for UPF2 and dampens NMD"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UPF3A
                term:
                  id: UniProtKB:Q9H1J1
                  label: Regulator of nonsense transcripts 3A
            function:
              preferred_term: protein sequestering activity
              term:
                id: GO:0140311
                label: protein sequestering activity
            processes:
              - preferred_term: negative regulation of nonsense-mediated mRNA decay
                term:
                  id: GO:2000623
                  label: negative regulation of nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            role_description: >-
              A regulator, not a step: UPF3A is much less active than UPF3B in NMD because its
              EJC-binding region diverges, and GOA records it as NOT involved in NMD (IDA,
              PMID:16601204). Its function and process come from its gene review core function
