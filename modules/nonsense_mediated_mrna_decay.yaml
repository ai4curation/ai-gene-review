    - order: 3
      role: phosphorylation of UPF1 by the SMG1 kinase complex, the commitment step of NMD
      node:
        id: upf1_phosphorylation
        label: SMG1C (SMG1 with SMG8 and SMG9) phosphorylates UPF1 on SQ motifs when SURF meets a downstream EJC
        module_type: REACTION
        description: >-
          SMG1 travels with UPF1 in SURF and phosphorylates it once the surveillance complex
          has connected to the EJC. SMG8 and SMG9 are regulatory subunits: in the isolated
          complex they suppress SMG1 kinase activity, and SMG8 recruits SMG1 to the
          surveillance complex. Phospho-UPF1 is the binding site for the decay effectors in the
          next part.
        concepts:
          - preferred_term: serine/threonine protein kinase complex
            term:
              id: GO:1902554
              label: serine/threonine protein kinase complex
            description: >-
              The generic kinase-complex term used by the GOA IPI rows for SMG1, SMG8 and SMG9.
              GO has no specific SMG1C term; none is requested, because the
              generic term with the named members is adequate.
        annotons:
          - id: smg1c_kinase
            label: SMG1C phosphorylates UPF1
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: SMG1C (SMG1-SMG8-SMG9)
                term:
                  id: GO:1902554
                  label: serine/threonine protein kinase complex
                active_units:
                  - id: smg1_unit
                    label: SMG1
                    role: catalytic PI3K-related protein kinase; phosphorylates UPF1 serines in SQ motifs
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SMG1
                        term:
                          id: UniProtKB:Q96Q15
                          label: Serine/threonine-protein kinase SMG1
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                  - id: smg8_unit
                    label: SMG8
                    role: regulatory subunit; restrains SMG1 kinase activity in the isolated complex and recruits SMG1 to the surveillance complex
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SMG8
                        term:
                          id: UniProtKB:Q8ND04
                          label: Nonsense-mediated mRNA decay factor SMG8
                  - id: smg9_unit
                    label: SMG9
                    role: regulatory subunit; with SMG8 restrains SMG1 kinase activity in the isolated complex
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SMG9
                        term:
                          id: UniProtKB:Q9H0W8
                          label: Nonsense-mediated mRNA decay factor SMG9
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
            processes:
              - preferred_term: nonsense-mediated mRNA decay
                term:
                  id: GO:0000184
                  label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              SMG1 carries the kinase activity (IDA and EXP, PMID:11544179; IDA,
              PMID:19417104). SMG8 and SMG9 were assayed only as parts of the complex; their
              experimental rows are processes (SMG8 regulation of protein kinase activity, IMP,
              PMID:19417104), so they get no molecular function of their own. A kinase
              inhibitor activity for SMG8 was considered and not authored, because the
              suppression was measured on the isolated complex with both regulatory subunits.
              SMG1 also phosphorylates substrates in the DNA damage response; that role is not
              part of this module.
            evidence:
              - source_id: PMID:11544179
                statement: hSMG-1 phosphorylates hUPF1 at serines in SQ motifs, and a kinase-dead mutant suppresses NMD.
                supporting_text: hSMG-1 phosphorylates hUPF1/SMG-2 in vivo and in vitro at specific serine residues in SQ motifs.
              - source_id: PMID:19417104
                statement: SMG-8 and SMG-9 are subunits of the SMG-1 complex that suppress its kinase activity; SMG-8 recruits SMG-1 to the surveillance complex.
                supporting_text: SMG-8 and SMG-9 suppress SMG-1 kinase activity in the isolated SMG-1 complex and are involved in NMD in both mammals and nematodes.
              - source_id: PMID:16452507
                statement: SURF (SMG-1, UPF1, eRF1, eRF3) must associate with the EJC for SMG-1 to phosphorylate UPF1 and trigger NMD.
                supporting_text: an association between SURF and the EJC is required for SMG-1-mediated Upf1 phosphorylation and NMD
    - order: 4
      role: decay of the target, initiated by effectors that bind phosphorylated UPF1
      node:
        id: decay_initiation
        label: Phospho-UPF1 recruits SMG6 for endonucleolytic cleavage and SMG5-SMG7 for deadenylation-dependent decay
        module_type: BIOLOGICAL_PROCESS
        description: >-
          SMG5, SMG6 and SMG7 bind phosphorylated UPF1 through 14-3-3-like domains. SMG6 cuts the
          mRNA near the premature stop codon with its PIN-domain endonuclease. The SMG5-SMG7
          heterodimer recruits decay factors through SMG7 and, with protein phosphatase 2A,
          promotes UPF1 dephosphorylation, which recycles the surveillance complex. The two
          routes are partially redundant. The general decay enzymes that finish the job (the
          5'-3' exonuclease XRN1 on the 3' fragment, the exosome on the 5' fragment, and the
          CCR4-NOT deadenylase and DCP2 decapping enzyme recruited by SMG5-SMG7) are not
          modelled here (see notes).
        variant_sets:
          - id: decay_routes
            label: decay route initiated on phospho-UPF1
            axis: mode of decay initiation (endonucleolytic cleavage versus recruitment of deadenylation and decapping)
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            variants:
              - id: smg6_endonucleolytic_route
                label: SMG6 PIN-domain endonuclease cleaves near the premature stop codon
                module_type: REACTION
                annotons:
                  - id: smg6_endonuclease
                    label: SMG6 endonucleolytic cleavage of the NMD target
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SMG6
                        term:
                          id: UniProtKB:Q86US8
                          label: Telomerase-binding protein EST1A
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                    processes:
                      - preferred_term: nonsense-mediated mRNA decay
                        term:
                          id: GO:0000184
                          label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Function from the human IDA row (PMID:19060897) and IMP row
                      (PMID:18974281); mutation of the conserved PIN-domain residues abolishes
                      endonucleolysis in cells and in vitro. SMG6 also binds the EJC directly
                      (PMID:20930030) and has telomere roles as EST1A, which are not part of
                      this module.
                    evidence:
                      - source_id: PMID:19060897
                        statement: SMG6 is the endonuclease that initiates PTC-proximal cleavage of human nonsense mRNA; PIN-domain mutation abolishes endonucleolysis in vivo and in vitro.
                        supporting_text: We identify the metazoan-specific NMD factor SMG6 as the responsible endonuclease by demonstrating that mutation of conserved residues in its nuclease domain--the C-terminal PIN motif--abolishes endonucleolysis in vivo and in vitro.
                      - source_id: PMID:18974281
                        statement: The catalytic activity of SMG6 contributes to degradation of PTC-containing mRNAs in human cells.
                        supporting_text: the catalytic activity of SMG6 contributes to the degradation of PTC-containing mRNAs in human cells
              - id: smg5_smg7_route
                label: SMG5-SMG7 heterodimer binds phospho-UPF1 and recruits decay factors through SMG7
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: smg5_smg7_adaptor
                    label: SMG5-SMG7 links phospho-UPF1 to deadenylation and decapping and to UPF1 dephosphorylation
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: SMG5-SMG7 heterodimer
                        active_units:
                          - id: smg7_unit
                            label: SMG7
                            role: 14-3-3-like domain binds phospho-UPF1; carries the degradative activity of the heterodimer by recruiting decay factors
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: SMG7
                                term:
                                  id: UniProtKB:Q92540
                                  label: Nonsense-mediated mRNA decay factor SMG7
                            function:
                              preferred_term: protein-macromolecule adaptor activity
                              term:
                                id: GO:0030674
                                label: protein-macromolecule adaptor activity
                          - id: smg5_unit
                            label: SMG5
                            role: 14-3-3-like domain heterodimerises with SMG7 and raises its affinity for phospho-UPF1; associates with PP2A for UPF1 dephosphorylation; its PIN domain is not a nuclease
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: SMG5
                                term:
                                  id: UniProtKB:Q9UPR3
                                  label: Nonsense-mediated mRNA decay factor SMG5
                            function:
                              preferred_term: protein phosphatase 2A binding
                              term:
                                id: GO:0051721
                                label: protein phosphatase 2A binding
                    function:
                      preferred_term: protein-macromolecule adaptor activity
                      term:
                        id: GO:0030674
                        label: protein-macromolecule adaptor activity
                    processes:
                      - preferred_term: nonsense-mediated mRNA decay
                        term:
                          id: GO:0000184
                          label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Curator-authored adaptor function for the heterodimer and for SMG7: neither
                      has an experimental adaptor row in GOA. The basis is the finding that the
                      heterodimer binds phospho-UPF1 with high affinity and that its degradative
                      activity resides in SMG7, which recruits decay factors (PMID:23348841).
                      SMG5's function, protein phosphatase 2A binding, is its IDA row
                      (PMID:14636577); SMG7 carries the same row. Both carry a part_of row for
                      GO:0170010 (IPI, PMID:23348841). The complex has no GO term of its own and
                      none is asserted.
                    evidence:
                      - source_id: PMID:23348841
                        statement: The SMG5-SMG7 heterodimer binds phospho-UPF1 with high affinity and recruits decay factors through SMG7; it is partially redundant with SMG6.
                        supporting_text: We propose that the SMG5-SMG7 complex binds to phosphorylated UPF1 with high affinity and recruits decay factors to the mRNA target through SMG7, thus promoting target degradation.
                      - source_id: PMID:23348841
                        statement: The SMG5-SMG7 complex and SMG6 play partially redundant roles, which is the basis for the ONE_OR_MORE route set.
                        supporting_text: the SMG5-SMG7 complex and SMG6 play partially redundant roles in the degradation of aberrant mRNAs
                      - source_id: PMID:14636577
                        statement: Phosphorylated hUPF1 forms a complex with hSMG-5 and hSMG-7 that associates with PP2A and leads to hUPF1 dephosphorylation.
                        supporting_text: The complex also associates with protein phosphatase 2A (PP2A), resulting in dephosphorylation of hUPF1.
