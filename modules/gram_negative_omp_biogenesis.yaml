id: MODULE:gram_negative_omp_biogenesis
title: Gram-negative outer-membrane protein chaperone delivery
description: >-
  A periplasmic carrier-holdase module for Gram-negative beta-barrel
  outer-membrane protein biogenesis. SurA is the primary route for bulk OMP
  transit to the BAM/YaeT assembly complex, while the trimeric Skp chaperone
  provides a parallel ATP-independent holdase route that maintains OMP clients
  in soluble unfolded states and cooperates with lipopolysaccharide; DegP
  contributes an optional quality-control branch that can clear or, under some
  conditions, protect unfolded OMPs in protease-chaperone cages. Sec export
  across the inner membrane, BAM-mediated membrane insertion itself, and LPS
  synthesis are outside this focused module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0043165
    title: Gram-negative-bacterium-type cell outer membrane assembly
    statement: Defines the OMP assembly process served by periplasmic carrier-holdases.
  - source_id: GO:0140309
    title: unfolded protein holdase activity
    statement: >-
      Defines the carrier-holdase activity of escorting unfolded clients to a
      defined acceptor molecule or location.
  - source_id: file:genes/ECOLI/surA/surA-ai-review.yaml
    title: ECOLI surA gene review
    statement: >-
      The completed E. coli surA review grounds SurA as the primary
      periplasmic carrier-holdase that delivers unfolded OMPs to BAM/YaeT.
  - source_id: file:genes/ECOLI/Skp/Skp-ai-review.yaml
    title: ECOLI Skp gene review
    statement: >-
      The completed E. coli Skp review grounds Skp as a trimeric periplasmic
      carrier-holdase for unfolded OMP clients.
  - source_id: file:genes/ECOLI/degP/degP-ai-review.yaml
    title: ECOLI degP gene review
    statement: >-
      The completed E. coli degP review grounds DegP as a periplasmic serine
      endoprotease and temperature-switched chaperone.
  - source_id: PMID:11226178
    title: >-
      The SurA periplasmic PPIase lacking its parvulin domains functions in
      vivo and has chaperone activity.
    statement: >-
      Establishes that SurA has a PPIase-independent chaperone activity
      sufficient for near-normal in vivo function.
  - source_id: PMID:17908933
    title: >-
      Defining the roles of the periplasmic chaperones SurA, Skp, and DegP in
      Escherichia coli.
    statement: >-
      Places SurA on the primary periplasmic OMP transit route to YaeT/BAM and
      identifies the Skp/DegP system as a rescue route when SurA is absent.
  - source_id: PMID:26344570
    title: >-
      Impact of holdase chaperones Skp and SurA on the folding of beta-barrel
      outer-membrane proteins.
    statement: >-
      Supports the holdase interpretation by showing how Skp and SurA influence
      beta-barrel OMP folding.
  - source_id: PMID:10455120
    title: >-
      Skp, a molecular chaperone of gram-negative bacteria, is required for the
      formation of soluble periplasmic intermediates of outer membrane
      proteins.
    statement: >-
      Establishes that Skp generates and maintains soluble periplasmic OMP
      folding intermediates.
  - source_id: PMID:19181847
    title: >-
      The cavity-chaperone Skp protects its substrate from aggregation but
      allows independent folding of substrate domains.
    statement: >-
      Supports the model that Skp binds beta-barrel substrates in an unfolded,
      aggregation-protected state during periplasmic transit.
  - source_id: PMID:15304217
    title: >-
      Crystal structure of Skp, a prefoldin-like chaperone that protects
      soluble and membrane proteins from aggregation.
    statement: >-
      Establishes the trimeric Skp cavity architecture and ATP-independent
      chaperone mechanism.
  - source_id: PMID:24373465
    title: >-
      DegP primarily functions as a protease for the biogenesis of β-barrel
      outer membrane proteins in the Gram-negative bacterium Escherichia coli.
    statement: >-
      Establishes unfolded OMPs as major native DegP substrates and DegP's
      dominant OMP-biogenesis role as proteolytic clearance.
  - source_id: PMID:10319814
    title: >-
      A temperature-dependent switch from chaperone to protease in a widely
      conserved heat shock protein.
    statement: Establishes DegP's low-temperature chaperone mode.
notes: >-
  SurA is the major OMP delivery route, Skp is kept as a parallel/rescue route
  rather than as an equal bulk-flux route, and DegP is represented as the
  Skp-associated rescue-clearance branch rather than as a primary BAM delivery
  carrier.
