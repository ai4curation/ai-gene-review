id: MODULE:mitochondrial_translation
title: Human mitochondrial translation — mt-tRNA modification, aminoacylation and Glu-tRNAGln transamidation, mitoribosome, and initiation/elongation factors
description: >-
  Thirteen polypeptides of the oxidative phosphorylation (OXPHOS) system — seven Complex I
  subunits, cytochrome b of Complex III, three Complex IV subunits and two Complex V subunits —
  are encoded by mitochondrial DNA and are made inside the mitochondrial matrix by a dedicated
  translation system whose protein components are all nuclear-encoded and imported. The system
  has four kinds of part. (1) The 22 mtDNA-encoded tRNAs must be post-transcriptionally modified
  to read the mitochondrial genetic code: the GTPBP3-MTO1 complex installs
  5-taurinomethyluridine (taum5U) at the wobble position U34 of mt-tRNAs for Leu(UUR), Trp, Gln,
  Glu and Lys; NSUN3 methylates C34 of the single mt-tRNAMet to m5C34, which the dioxygenase
  ALKBH1 oxidises to 5-formylcytidine (f5C34) so that one tRNAMet can decode both AUG and AUA;
  and TRIT1 isopentenylates A37 (i6A37) of a subset of mt-tRNAs. (2) Nuclear-encoded
  mitochondrial aminoacyl-tRNA synthetases (the *ARS2 family, e.g. DARS2) charge the tRNAs;
  because mitochondria lack a glutaminyl-tRNA synthetase, EARS2 first mischarges tRNAGln with
  glutamate and (3) the heterotrimeric glutamyl-tRNA(Gln) amidotransferase GatCAB (QRSL1/GatA,
  GATB, GATC) transamidates Glu-tRNAGln to Gln-tRNAGln. (4) The 55S mitoribosome — whose
  28S small subunit contains, among others, uS7m (MRPS7), mS22 (MRPS22) and the
  pentatricopeptide-repeat protein mS39 (PTCD3) at the mRNA entry channel — translates the
  leaderless mt-mRNAs with the initiation factors MTIF2 and MTIF3 and the elongation factors
  TUFM (EF-Tu), TSFM (EF-Ts, its nucleotide exchange factor) and GFM1 (EF-G1). Because every one
  of the 13 products depends on the same apparatus, a lesion anywhere in it produces a combined
  (multi-complex) OXPHOS deficiency rather than a single-complex defect. The dismech
  knowledge base curates these as the combined oxidative phosphorylation deficiency series:
  GTPBP3 -> COXPD23 (MONDO:0014525); MTO1 -> MTO1 deficiency / COXPD10 (MONDO:0013865); NSUN3
  -> COXPD48 (MONDO:0033566); TRIT1 -> COXPD35 (MONDO:0054742); GATC -> COXPD42
  (MONDO:0030008); MRPS7 -> COXPD34 (MONDO:0054741), also a Perrault syndrome gene
  (MONDO:0017312); PTCD3 -> COXPD51 (MONDO:0033631); TUFM -> COXPD4 (MONDO:0012534); and MRPS22
  -> 46,XX gonadal dysgenesis (MONDO:0009299). ALKBH1 is curated in the dismech COXPD48 entry
  as the pathway partner of NSUN3, not as a disease gene.
status: DRAFT
evidence:
  - source_id: GO:0032543
    title: mitochondrial translation
    statement: >-
      The module is grounded in mitochondrial translation (GO:0032543), the synthesis of the
      13 mtDNA-encoded OXPHOS polypeptides on mitochondrial ribosomes.
  - source_id: Reactome:R-HSA-5368287
    title: Mitochondrial translation
    statement: >-
      Initiation, elongation and termination steps follow the human Reactome pathway
      R-HSA-5368287 and its children R-HSA-5368286 (Mitochondrial translation initiation),
      R-HSA-5389840 (Mitochondrial translation elongation) and R-HSA-5419276 (Mitochondrial
      translation termination).
  - source_id: Reactome:R-HSA-6787450
    title: tRNA modification in the mitochondrion
    statement: >-
      The mt-tRNA modification part (GTPBP3, MTO1, TRIT1) follows the human Reactome pathway
      R-HSA-6787450.
  - source_id: Reactome:R-HSA-379726
    title: Mitochondrial tRNA aminoacylation
    statement: >-
      The aminoacylation part (DARS2 and the other *ARS2 synthetases) follows the human Reactome
      pathway R-HSA-379726.
  - source_id: file:human/ALKBH1/ALKBH1-ai-review.yaml
    title: ALKBH1 gene review (human)
    statement: >-
      The f5C34 formation step on mt-tRNAMet (UniProtKB:Q13686, GO:0160290) matches the core
      function of the existing human ALKBH1 review, which also records its mitochondrial-matrix
      location and the regulation of mitochondrial translation (GO:0070129).
  - source_id: file:human/DARS2/DARS2-ai-review.yaml
    title: DARS2 gene review (human)
    statement: >-
      The representative mitochondrial aminoacyl-tRNA synthetase (UniProtKB:Q6PI48, GO:0004815)
      matches the core function of the existing human DARS2 review.
  - source_id: file:human/GTPBP3/GTPBP3-ai-review.yaml
    title: GTPBP3 gene review (human)
    statement: >-
      The GTPBP3 subunit of the GTPBP3-MTO1 taum5U34 synthase (UniProtKB:Q969Y2) has a human GTPBP3 gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: file:human/NSUN3/NSUN3-ai-review.yaml
    title: NSUN3 gene review (human)
    statement: >-
      The NSUN3 mt-tRNAMet C34 methyltransferase (UniProtKB:Q9H649) has a human NSUN3 gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: file:human/TRIT1/TRIT1-ai-review.yaml
    title: TRIT1 gene review (human)
    statement: >-
      The TRIT1 tRNA A37 dimethylallyltransferase (UniProtKB:Q9H3H1) has a human TRIT1 gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: file:human/GATC/GATC-ai-review.yaml
    title: GATC gene review (human)
    statement: >-
      The GATC small subunit of GatCAB (UniProtKB:O43716) has a human GATC gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: file:human/MRPS7/MRPS7-ai-review.yaml
    title: MRPS7 gene review (human)
    statement: >-
      The MRPS7 (uS7m) small-subunit mitoribosomal protein (UniProtKB:Q9Y2R9) has a human MRPS7 gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: file:human/PTCD3/PTCD3-ai-review.yaml
    title: PTCD3 gene review (human)
    statement: >-
      The PTCD3 (mS39) small-subunit mitoribosomal protein (UniProtKB:Q96EY7) has a human PTCD3 gene review in progress; its annotations
      were still pending review when this module was drafted, so the module's GO assertion
      for this participant is taken from UniProt GO annotation pending that review.
  - source_id: PMID:27497299
    title: NSUN3 and ABH1 modify the wobble position of mt-tRNAMet to expand codon recognition in mitochondrial translation.
    statement: >-
      Establishes the two-step NSUN3 (m5C34) then ALKBH1/ABH1 (f5C34) modification of
      mt-tRNAMet.
  - source_id: PMID:25434004
    title: Mutations in GTPBP3 cause a mitochondrial translation defect associated with hypertrophic cardiomyopathy, lactic acidosis, and encephalopathy.
    statement: >-
      GTPBP3 loss causes a mitochondrial translation defect (COXPD23).
  - source_id: PMID:24901367
    title: Defective i6A37 modification of mitochondrial and cytosolic tRNAs results from pathogenic mutations in TRIT1 and its substrate tRNA.
    statement: >-
      TRIT1 installs i6A37 on mitochondrial and cytosolic tRNAs; its loss causes COXPD35.
  - source_id: PMID:24579914
    title: Glutamyl-tRNAGln amidotransferase is essential for mammalian mitochondrial translation in vivo.
    statement: >-
      GatCAB-dependent transamidation is the sole route to Gln-mt-tRNAGln and is required for
      mitochondrial translation.
  - source_id: PMID:30283131
    title: Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder.
    statement: >-
      Biallelic variants in GatCAB subunits (including GATC) cause a lethal mitochondrial
      cardiomyopathy (COXPD42 for GATC).
  - source_id: PMID:25556185
    title: Mutation in mitochondrial ribosomal protein S7 (MRPS7) causes congenital sensorineural deafness, progressive hepatic and renal failure and lactic acidemia.
    statement: >-
      An MRPS7 (uS7m) small-subunit mitoribosomal protein variant impairs mitochondrial
      translation (COXPD34).
  - source_id: PMID:30607703
    title: Mitochondrial ribosomal protein PTCD3 mutations cause oxidative phosphorylation defects with Leigh syndrome.
    statement: >-
      PTCD3 (mS39) variants cause a combined OXPHOS defect with Leigh syndrome (COXPD51).
  - source_id: PMID:17160893
    title: Infantile encephalopathy and defective mitochondrial DNA translation in patients with mutations of mitochondrial elongation factors EFG1 and EFTu.
    statement: >-
      Mutations in the elongation factors GFM1 (EF-G1) and TUFM (EF-Tu) cause defective
      mitochondrial translation (TUFM -> COXPD4).
module:
  id: mitochondrial_translation
  label: Mitochondrial translation (mtDNA-encoded OXPHOS polypeptide synthesis)
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: mitochondrial translation
      term:
        id: GO:0032543
        label: mitochondrial translation
      description: >-
        Synthesis of the 13 mtDNA-encoded OXPHOS polypeptides on the mitoribosome, including
        the preparation of the mt-tRNAs that decode them.
  context:
    cellular_components:
      - preferred_term: mitochondrial matrix
        term:
          id: GO:0005759
          label: mitochondrial matrix
        description: >-
          tRNA modification, aminoacylation, transamidation and translation all occur in the
          matrix; the mitoribosome is tethered to the inner membrane for co-translational
          insertion of its hydrophobic products.
  parts:
    - order: 1
      role: mt-tRNA anticodon-loop modification
      node:
        id: mt_trna_modification
        label: Wobble (position 34) and position-37 modification of mt-tRNAs
        module_type: BIOLOGICAL_PROCESS
        concepts:
          - preferred_term: mitochondrial tRNA modification
            term:
              id: GO:0070900
              label: mitochondrial tRNA modification
        annotons:
          - id: gtpbp3_mto1_taum5u
            label: "GTPBP3-MTO1: 5-taurinomethyluridine (taum5U34) synthesis"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: GTPBP3-MTO1 complex
                term:
                  id: GO:7770010
                  label: GTPBP3-MTO1 complex
                active_units:
                  - id: gtpbp3_unit
                    label: GTPBP3 GTPase subunit
                    role: >-
                      MnmE-family GTPase that binds the methylene-tetrahydrofolate donor; GTP
                      hydrolysis drives the taurinomethylation reaction with MTO1.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GTPBP3
                        term:
                          id: UniProtKB:Q969Y2
                          label: 5-taurinomethyluridine-[tRNA] synthase subunit GTPB3, mitochondrial
                    function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
                  - id: mto1_unit
                    label: MTO1 FAD-binding subunit
                    role: >-
                      MnmG-family FAD-dependent subunit that, with GTPBP3, transfers the
                      taurinomethyl group (from taurine and 5,10-methylene-tetrahydrofolate) to
                      U34.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTO1
                        term:
                          id: UniProtKB:Q9Y2Z2
                          label: 5-taurinomethyluridine-[tRNA] synthase subunit MTO1, mitochondrial
                    function:
                      preferred_term: flavin adenine dinucleotide binding
                      term:
                        id: GO:0050660
                        label: flavin adenine dinucleotide binding
            function:
              preferred_term: tRNA 5-taurinomethyluridine synthase activity
              term:
                id: GO:0160236
                label: tRNA 5-taurinomethyluridine synthase activity
              substrates:
                - preferred_term: uridine-34 in mt-tRNA Leu(UUR), Trp, Gln, Glu, Lys
                - preferred_term: taurine
                - preferred_term: 5,10-methylene-tetrahydrofolate
                - preferred_term: GTP
              products:
                - preferred_term: 5-taurinomethyluridine-34 (taum5U34) in mt-tRNA
            processes:
              - preferred_term: mitochondrial tRNA wobble uridine modification
                term:
                  id: GO:0070899
                  label: mitochondrial tRNA wobble uridine modification
            locations:
              - preferred_term: mitochondrion
                term:
                  id: GO:0005739
                  label: mitochondrion
            role_description: >-
              Installs taum5U at the wobble position of five mt-tRNAs, required for accurate and
              efficient decoding of NNA/NNG codons. GTPBP3 deficiency causes COXPD23
              (MONDO:0014525); MTO1 deficiency causes COXPD10, mitochondrial hypertrophic
              cardiomyopathy with lactic acidosis (MONDO:0013865). TRMU, which 2-thiolates the
              same wobble uridine (taum5s2U in tRNA Gln/Glu/Lys), is a natural extension not
              modelled here.
            evidence:
              - source_id: Reactome:R-HSA-6787450
                statement: Human Reactome pathway tRNA modification in the mitochondrion (GTPBP3 and MTO1 reactions).
              - source_id: PMID:25434004
                statement: GTPBP3 loss causes a mitochondrial translation defect (COXPD23).
              - source_id: PMID:29348686
                statement: MTO1 and GTPBP3 defects in the same modification pathway cause distinct metabolic reprogramming.
          - id: nsun3_m5c34
            label: "NSUN3: mt-tRNAMet C34 5-methylation (m5C34)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NSUN3
                term:
                  id: UniProtKB:Q9H649
                  label: tRNA (cytosine(34)-C(5))-methyltransferase, mitochondrial
            function:
              preferred_term: tRNA (cytidine-N5)-methyltransferase activity
              term:
                id: GO:0016428
                label: tRNA (cytidine-N5)-methyltransferase activity
              substrates:
                - preferred_term: cytidine-34 in mt-tRNAMet
                - preferred_term: S-adenosyl-L-methionine
              products:
                - preferred_term: 5-methylcytidine-34 (m5C34) in mt-tRNAMet
                - preferred_term: S-adenosyl-L-homocysteine
            processes:
              - preferred_term: tRNA wobble base cytosine methylation
                term:
                  id: GO:0002127
                  label: tRNA wobble base cytosine methylation
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              First step of f5C34 formation on the single mt-tRNAMet that serves both initiation
              and elongation. Biallelic NSUN3 variants cause COXPD48 (MONDO:0033566).
            evidence:
              - source_id: PMID:27497299
                statement: NSUN3 deposits m5C34 on mt-tRNAMet as the substrate for ABH1 oxidation.
          - id: alkbh1_f5c34
            label: "ALKBH1: oxidation of m5C34 to f5C34 in mt-tRNAMet"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ALKBH1
                term:
                  id: UniProtKB:Q13686
                  label: Nucleic acid dioxygenase ALKBH1
            function:
              preferred_term: 2-oxoglutarate-dependent tRNA 5-methylcytidine formyltransferase activity
              term:
                id: GO:0160290
                label: 2-oxoglutarate-dependent tRNA 5-methylcytidine formyltransferase activity
              substrates:
                - preferred_term: 5-methylcytidine-34 (m5C34) in mt-tRNAMet
                - preferred_term: 2-oxoglutarate
                - preferred_term: O2
              products:
                - preferred_term: 5-formylcytidine-34 (f5C34) in mt-tRNAMet
                - preferred_term: succinate
                - preferred_term: CO2
            processes:
              - preferred_term: tRNA wobble cytosine modification
                term:
                  id: GO:0002101
                  label: tRNA wobble cytosine modification
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Fe(II)/2-oxoglutarate dioxygenase completing f5C34, which lets mt-tRNAMet read AUA as
              well as AUG. ALKBH1 has a broader substrate range (nuclear/cytosolic RNA and DNA
              demethylation) and no reported COXPD48 patient variant; dismech lists it in the
              COXPD48 entry as the pathway partner of NSUN3 only.
            evidence:
              - source_id: file:human/ALKBH1/ALKBH1-ai-review.yaml
                statement: Core function GO:0160290 in the mitochondrial matrix (human ALKBH1 review).
              - source_id: PMID:27497299
                statement: ALKBH1/ABH1 oxidises NSUN3-deposited m5C34 of mt-tRNAMet to f5C34.
          - id: trit1_i6a37
            label: "TRIT1: N6-isopentenylation of A37 (i6A37)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TRIT1
                term:
                  id: UniProtKB:Q9H3H1
                  label: tRNA dimethylallyltransferase
            function:
              preferred_term: tRNA dimethylallyltransferase activity
              term:
                id: GO:0052381
                label: tRNA dimethylallyltransferase activity
              substrates:
                - preferred_term: adenosine-37 in tRNA
                - preferred_term: dimethylallyl diphosphate
              products:
                - preferred_term: N6-dimethylallyladenosine-37 (i6A37) in tRNA
                - preferred_term: diphosphate
            processes:
              - preferred_term: mitochondrial tRNA modification
                term:
                  id: GO:0070900
                  label: mitochondrial tRNA modification
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Modifies A37 adjacent to the anticodon of a subset of mt-tRNAs (and cytosolic
              tRNAs, including tRNA[Ser]Sec), stabilising codon-anticodon pairing. Biallelic TRIT1
              variants cause COXPD35 (MONDO:0054742).
            evidence:
              - source_id: PMID:24901367
                statement: TRIT1 pathogenic variants abolish i6A37 on mitochondrial and cytosolic tRNAs.
              - source_id: Reactome:R-HSA-6787450
                statement: Human Reactome pathway tRNA modification in the mitochondrion (TRIT1 reaction).
        connections:
          - source: nsun3_m5c34
            target: alkbh1_f5c34
            connection_type: PRECEDES
            description: NSUN3-deposited m5C34 is the substrate ALKBH1 oxidises to f5C34.
            chaining_status: NOT_APPLICABLE
            chaining_note: >-
              The shared intermediate is an RNA nucleoside modification (m5C34 in mt-tRNAMet),
              not a CoA-bearing metabolite, so CoA continuity does not apply.
    - order: 2
      role: mt-tRNA aminoacylation
      node:
        id: mt_trna_aminoacylation
        label: Charging of mt-tRNAs by mitochondrial aminoacyl-tRNA synthetases (*ARS2)
        module_type: BIOLOGICAL_PROCESS
        concepts:
          - preferred_term: tRNA aminoacylation for mitochondrial protein translation
            term:
              id: GO:0070127
              label: tRNA aminoacylation for mitochondrial protein translation
        annotons:
          - id: dars2_aspartylation
            label: "DARS2: mitochondrial aspartyl-tRNA synthetase (representative *ARS2)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DARS2
                term:
                  id: UniProtKB:Q6PI48
                  label: Aspartate--tRNA ligase, mitochondrial
            function:
              preferred_term: aspartate-tRNA ligase activity
              term:
                id: GO:0004815
                label: aspartate-tRNA ligase activity
              substrates:
                - preferred_term: L-aspartate
                - preferred_term: mt-tRNAAsp
                - preferred_term: ATP
              products:
                - preferred_term: L-aspartyl-mt-tRNAAsp
                - preferred_term: AMP
                - preferred_term: diphosphate
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Representative of the ~19 nuclear-encoded mitochondrial aminoacyl-tRNA synthetases.
              DARS2 deficiency causes leukoencephalopathy with brainstem and spinal cord
              involvement and lactate elevation (LBSL); dismech also curates DARS2 as an axonal
              Charcot-Marie-Tooth type 2 gene (MONDO:0018993).
            evidence:
              - source_id: file:human/DARS2/DARS2-ai-review.yaml
                statement: Core function GO:0004815 in the mitochondrial matrix (human DARS2 review).
              - source_id: Reactome:R-HSA-379726
                statement: Human Reactome pathway Mitochondrial tRNA aminoacylation.
          - id: ears2_glu_trnagln
            label: "EARS2: nondiscriminating glutamyl-tRNA synthetase (Glu-tRNAGln formation)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EARS2
                term:
                  id: UniProtKB:Q5JPH6
                  label: Nondiscriminating glutamyl-tRNA synthetase EARS2, mitochondrial
            function:
              preferred_term: glutamate-tRNA(Gln) ligase activity
              term:
                id: GO:0050561
                label: glutamate-tRNA(Gln) ligase activity
              substrates:
                - preferred_term: L-glutamate
                - preferred_term: mt-tRNAGln (and mt-tRNAGlu)
                - preferred_term: ATP
              products:
                - preferred_term: L-glutamyl-mt-tRNAGln (misacylated)
                - preferred_term: AMP
                - preferred_term: diphosphate
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Charges both mt-tRNAGlu and mt-tRNAGln with glutamate; the misacylated
              Glu-tRNAGln is the substrate of GatCAB because mitochondria have no
              glutaminyl-tRNA synthetase.
    - order: 3
      role: Glu-tRNAGln to Gln-tRNAGln transamidation
      node:
        id: gln_trna_transamidation
        label: GatCAB transamidation of Glu-mt-tRNAGln
        module_type: REACTION
        concepts:
          - preferred_term: glutaminyl-tRNAGln biosynthesis via transamidation
            term:
              id: GO:0070681
              label: glutaminyl-tRNAGln biosynthesis via transamidation
        annotons:
          - id: gatcab_amidotransferase
            label: "GatCAB: glutamyl-tRNA(Gln) amidotransferase"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: glutamyl-tRNA(Gln) amidotransferase complex (GatCAB)
                term:
                  id: GO:0030956
                  label: glutamyl-tRNA(Gln) amidotransferase complex
                active_units:
                  - id: qrsl1_unit
                    label: QRSL1 (GatA) glutaminase subunit
                    role: Hydrolyses glutamine to release the ammonia used as amide donor.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: QRSL1
                        term:
                          id: UniProtKB:Q9H0R6
                          label: Glutamyl-tRNA(Gln) amidotransferase subunit A, mitochondrial
                    function:
                      preferred_term: glutaminase activity
                      term:
                        id: GO:0004359
                        label: glutaminase activity
                  - id: gatb_unit
                    label: GATB (GatB) kinase/transamidase subunit
                    role: >-
