                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GATC
                        term:
                          id: UniProtKB:O43716
                          label: Glutamyl-tRNA(Gln) amidotransferase subunit C, mitochondrial
            function:
              preferred_term: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
              term:
                id: GO:0050567
                label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
              substrates:
                - preferred_term: L-glutamyl-mt-tRNAGln
                - preferred_term: L-glutamine
                - preferred_term: ATP
              products:
                - preferred_term: L-glutaminyl-mt-tRNAGln
                - preferred_term: L-glutamate
                - preferred_term: ADP
                - preferred_term: phosphate
            locations:
              - preferred_term: mitochondrion
                term:
                  id: GO:0005739
                  label: mitochondrion
            role_description: >-
              Sole route to Gln-mt-tRNAGln, so its loss affects all 13 mtDNA-encoded products.
