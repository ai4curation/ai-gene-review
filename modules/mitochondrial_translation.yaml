  connections:
    - source: mt_trna_aminoacylation
      target: gln_trna_transamidation
      connection_type: PROVIDES_INPUT_FOR
      description: EARS2-made Glu-mt-tRNAGln is the substrate GatCAB transamidates to Gln-mt-tRNAGln.
    - source: mt_trna_modification
      target: mt_translation_elongation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Wobble- and position-37-modified mt-tRNAs are required for accurate decoding by the
        elongating mitoribosome.
    - source: mt_trna_aminoacylation
      target: mt_translation_elongation
      connection_type: PROVIDES_INPUT_FOR
      description: Charged mt-tRNAs are delivered to the A site by TUFM (EF-Tu).
    - source: gln_trna_transamidation
      target: mt_translation_elongation
      connection_type: PROVIDES_INPUT_FOR
      description: Gln-mt-tRNAGln supplies glutamine for decoding CAA/CAG codons.
    - source: mt_trna_modification
      target: mt_translation_initiation
      connection_type: PROVIDES_INPUT_FOR
      description: f5C34-modified mt-tRNAMet is the initiator tRNA (after formylation) that reads AUG and AUA.
    - source: mitoribosome_ssu
      target: mt_translation_initiation
      connection_type: PROVIDES_INPUT_FOR
      description: The small subunit binds the leaderless mt-mRNA and the initiation factors.
    - source: mt_translation_initiation
      target: mt_translation_elongation
      connection_type: PRECEDES
      description: The assembled 55S initiation complex enters elongation.
      chaining_status: NOT_APPLICABLE
      chaining_note: Ordered steps of one ribonucleoprotein machine; no metabolite intermediate is passed.
  notes: >-
    Human mitochondrial translation, the machinery making the 13 mtDNA-encoded OXPHOS
    polypeptides. Participants are grounded to human UniProtKB accessions retrieved from the
    UniProt REST API (reviewed entries, organism 9606): GTPBP3 Q969Y2, MTO1 Q9Y2Z2, NSUN3
    Q9H649, ALKBH1 Q13686, TRIT1 Q9H3H1, DARS2 Q6PI48, EARS2 Q5JPH6, QRSL1 Q9H0R6, GATB
    O75879, GATC O43716, MRPS7 Q9Y2R9, MRPS22 P82650, PTCD3 Q96EY7, MTIF2 P46199, MTIF3 Q9H2K0,
    TUFM P49411, TSFM P43897, GFM1 Q96RP9. GO molecular-function terms are taken from the UniProt
    GO annotation of each protein (or, for ALKBH1 and DARS2, from the core functions of the
    existing gene reviews) and verified against the local go.db; the GTPBP3-MTO1 complex
    function GO:0160236 (tRNA 5-taurinomethyluridine synthase activity) and complex term
    GO:7770010 were checked in go.db. Reactome pathway ids/titles were checked against the
    Reactome ContentService. The two-subunit complexes (GTPBP3-MTO1, GatCAB) are modelled as
    PROTEIN_COMPLEX participants with active units, so the complex activity is not assigned to
    every subunit. The *ARS2 family is represented by DARS2 plus EARS2 (whose
    nondiscriminating activity feeds GatCAB) rather than enumerated. Not modelled here and
    candidates for extension: mt-tRNA processing (RNase P/PRORP, ELAC2, TRNT1), TRMU and TRMT5,
    methionyl-tRNA formyltransferase (MTFMT), the large subunit (MRPL genes), termination and
    recycling (MTRF1L, MRRF, GFM2), mRNA-specific translational activators (e.g. TACO1 for
    MT-CO1), and co-translational insertion (OXA1L). Disease consequences are cited with the
    MONDO ids used by the corresponding dismech knowledge-base entries.
