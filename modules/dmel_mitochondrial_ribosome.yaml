id: MODULE:dmel_mitochondrial_ribosome
title: Mitochondrial ribosome in Drosophila melanogaster
description: >-
  The mitochondrial ribosome (mitoribosome) translates the small set of mitochondrial-DNA-encoded
  mRNAs, which in animals encode core subunits of the respiratory chain and ATP synthase.
  It consists of a small subunit built on the mitochondrially encoded 12S-type rRNA (mt:srRNA)
  and a large subunit built on the 16S-type rRNA (mt:lrRNA), together with nuclear-encoded
  mitochondrial ribosomal proteins. Animal mitoribosomes are protein-rich: they contain bacterial-type
  ribosomal proteins plus many mitochondria-specific proteins. In Drosophila, loss of the
  small-subunit protein tko (mRpS12) causes the technical knockout phenotype of bang sensitivity.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000059
  title: 'FlyBase gene group MRP: Mitochondrial ribosomal subunits'
  statement: >-
    FlyBase release FB2026_03 groups 83 D. melanogaster genes as mitochondrial ribosomal subunits
    (MRP); this module models that group.
- source_id: GO:0005761
  title: mitochondrial ribosome
  statement: >-
    GO term grounding the module as mitochondrial ribosome.
notes: >-
  Parts follow the FlyBase subgroups MRPS and MRPL, which include the mitochondrially encoded
  rRNAs (mt:srRNA, mt:lrRNA) grounded to their FlyBase gene ids. FlyBase lists mRpS30 in both
  subunits and mRpS18A in the large subunit group; these placements are kept as curated by
  FlyBase. Some members of MRPS (for example Ptcd3, bonsai, CG4882, CG12848) carry non-ribosomal-protein
  names; they are kept as FlyBase-listed subunit members. FlyBase groups realized by this
  module: MRP (FBgg0000059). Subgroups folded into it: MRPS, MRPL. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_mitochondrial_ribosome.yaml; none of the member genes has a gene
  review yet unless noted.
