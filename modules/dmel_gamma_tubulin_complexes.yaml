id: MODULE:dmel_gamma_tubulin_complexes
title: Gamma-tubulin complexes in Drosophila melanogaster
description: >-
  Gamma-tubulin complexes nucleate microtubules at centrosomes, spindles and other microtubule-organizing
  centres. The basic unit is the gamma-tubulin small complex (gamma-TuSC), two gamma-tubulin
  molecules bound to Grip84 (GCP2) and Grip91 (GCP3). In the larger gamma-tubulin ring complex
  (gamma-TuRC), several gamma-TuSCs assemble with additional GCP-family proteins (Grip75,
  Grip128, Grip163) and Grip71 into a ring that templates the 13-protofilament microtubule.
  Drosophila has two gamma-tubulins: gammaTub23C, used in most tissues, and gammaTub37C, which
  is maternally supplied and acts in the female germline and early embryo. In the testis a
  separate gamma-TuRC built from testis-specific t-Grip84, t-Grip91 and t-Grip128 paralogs
  acts in spermatogenesis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001769
  title: 'FlyBase gene group G-TUC: Gamma-tubulin complexes'
  statement: >-
    FlyBase release FB2026_03 groups 11 D. melanogaster genes as gamma-tubulin complexes (G-TUC);
    this module models that group.
- source_id: GO:0000930
  title: gamma-tubulin complex
  statement: >-
    GO term grounding the module as gamma-tubulin complex.
notes: >-
  The FlyBase subgroups G-TUSC, G-TURC and T-G-TURC share subunits; the gamma-TuSC is modelled
  as the core part and the two ring complexes as variants, so shared subunits appear more
  than once. Grip71 (NEDD1 homolog) is included because FlyBase places it in the gamma-TuRC;
  in other systems its homolog acts mainly as a targeting factor for the ring complex. Ring
  attachment factors such as the augmin complex (dmel_augmin_complex) and centrosomal tethers
  are not parts. FlyBase groups realized by this module: G-TUC (FBgg0001769). Subgroups folded
  into it: G-TUSC, T-G-TURC, G-TURC. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_gamma_tubulin_complexes.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
