id: MODULE:dmel_swr1_domino_complex
title: SWR1-type Domino H2Av exchange complex in Drosophila melanogaster
description: >-
  The SWR1-type complex deposits the histone variant H2Av into nucleosomes in exchange for
  H2A. Its catalytic subunit is the SWR1-family ATPase Domino; in Drosophila the Domino-B
  isoform forms this complex, whereas Domino-A is part of the Tip60 complex. The complex shares
  with Tip60 the AAA+ ATPases Pontin and Reptin, YL-1, DMAP1, Gas41, Bap55 and the MRG15 module,
  and contains the actin-related protein Arp6.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001790
  title: 'FlyBase gene group SWR1: Swr1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 12 D. melanogaster genes as swr1 complex (SWR1); this
    module models that group.
- source_id: GO:0000812
  title: Swr1 complex
  statement: >-
    GO term grounding the module as Swr1 complex.
notes: >-
  Grouping of accessory subunits follows the conserved SWR1/SRCAP organisation and is a modelling
  convenience. The Domino isoform specificity (Domino-B here, Domino-A in Tip60) cannot be
  represented with gene-level participants; both modules use the dom gene product. Hcf is
  included because FlyBase lists it in the SWR1 group. Bap55 has no UniProt mapping and is
  grounded to its FlyBase gene. FlyBase groups realized by this module: SWR1 (FBgg0001790).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_swr1_domino_complex.yaml;
  none of the member genes has a gene review yet unless noted.
