id: MODULE:dmel_atr_atrip_complex
title: ATR-ATRIP checkpoint kinase complex in Drosophila melanogaster
description: >-
  ATR is a phosphatidylinositol 3-kinase-related protein kinase that responds to single-stranded
  DNA at stalled replication forks and processed DNA breaks. Its partner ATRIP binds RPA-coated
  single-stranded DNA and recruits ATR, which then phosphorylates checkpoint targets such
  as Chk1 to arrest the cell cycle and stabilize replication forks. In Drosophila ATR is encoded
  by mei-41 and ATRIP by mus304; mutants are sensitive to DNA damage and are defective in
  DNA damage checkpoints.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002117
  title: 'FlyBase gene group ATR-ATRIP: Atr-atrip dna damage-sensing kinase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as atr-atrip dna damage-sensing
    kinase complex (ATR-ATRIP); this module models that group.
- source_id: GO:0070310
  title: ATR-ATRIP complex
  statement: >-
    GO term grounding the module as ATR-ATRIP complex.
notes: >-
  Upstream activators (9-1-1 clamp, TopBP1) and downstream effectors (Chk1, encoded by grp)
  are outside the module; see dmel_9_1_1_checkpoint_clamp. FlyBase groups realized by this
  module: ATR-ATRIP (FBgg0002117). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_atr_atrip_complex.yaml; none of the member genes has a gene review yet
  unless noted.
