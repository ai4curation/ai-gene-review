      description: Activated ATM phosphorylates p53 and MDM2 directly and activates CHK2.
    - source: p53_stabilizing_phosphorylation
      target: mdm2_mdm4_feedback
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Ser15/Ser20 phosphorylation of p53 and ATM phosphorylation of MDM2 weaken the
        p53-MDM2 interaction and p53 ubiquitylation.
    - source: p53_stabilizing_phosphorylation
      target: p53_transactivation
      connection_type: POSITIVELY_REGULATES
      description: N-terminal phosphorylation stabilises p53 and favours coactivator binding.
    - source: arf_mdm2_inhibition
      target: mdm2_mdm4_feedback
      connection_type: NEGATIVELY_REGULATES
      description: ARF inhibits MDM2 E3 activity and sequesters MDM2 in the nucleolus.
    - source: mdm2_mdm4_feedback
      target: p53_transactivation
      connection_type: NEGATIVELY_REGULATES
      description: MDM2 (stimulated by MDM4) ubiquitylates p53 for degradation and occludes its transactivation domain.
    - source: p53_transactivation
      target: mdm2_mdm4_feedback
      connection_type: POSITIVELY_REGULATES
      description: p53 transactivates the MDM2 gene, closing the negative feedback loop.
    - source: p53_acetylation
      target: p53_transactivation
      connection_type: POSITIVELY_REGULATES
      description: C-terminal acetylation stimulates sequence-specific DNA binding; K120 acetylation favours apoptotic targets.
    - source: p53_deacetylation
      target: p53_transactivation
      connection_type: NEGATIVELY_REGULATES
      description: SIRT1 removes activating acetylation and reduces p53 transcriptional activity.
    - source: p53_transactivation
      target: p53_apoptotic_output
