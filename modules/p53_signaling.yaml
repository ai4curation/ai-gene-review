knowledge_gaps:
  - gap_statement: >-
      How p53 chooses between cell-cycle arrest, senescence and apoptosis target
      programs is not resolved: the relative weight of response-element affinity,
      Lys120 acetylation, ASPP cofactors, p53 protein level and pulsatile versus
      sustained p53 dynamics in setting the outcome in a given cell type remains
      unknown.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      The division of labour between MDM2 and MDM4 in vivo is incompletely understood,
      including how much p53 control depends on the MDM2-MDM4 RING heterodimer as an
      E3 versus MDM4 occlusion of the transactivation domain, and how damage-induced
      phosphorylation of MDM2 and MDM4 by ATM and ABL1 redistributes their activities.
    gap_kind:
      - BIOLOGY
