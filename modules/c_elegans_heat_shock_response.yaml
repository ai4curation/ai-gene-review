id: MODULE:c_elegans_heat_shock_response
title: HSF-1 cytosolic heat shock response in Caenorhabditis elegans
description: >-
  In Caenorhabditis elegans the single heat shock factor HSF-1 couples
  proteotoxic stress to induction of the cytosolic chaperone network. HSF-1 is
  a nuclear, sequence-specific DNA-binding transcription factor that
  recognizes heat shock elements (HSEs) made of continuous inverted nGAAn
  pentamer repeats. On heat shock it is redistributed into transcriptionally
  active nuclear stress granules and shifts its genomic occupancy to inducible
  HSE sites. HSF-1 is required for heat-induced transcription of the hsp-16
  small heat shock protein genes, which are silent without stress, and it
  drives heat induction of the abundant Hsc70 HSP-1 and of the single
  cytosolic HSP90, HSP-90, through distal tandem HSEs. The chaperone output
  falls into three activities. HSP-1 is an ATP-dependent Hsp70 foldase whose
  nucleotide cycle is tuned by nucleotide-exchange factors, the HSP110-family
  HSP-110 and the BAG-domain protein BAG-1. HSP-90 is an ATP-dependent
  chaperone for signaling and structural client proteins. HSP-16.2 is an
  ATP-independent alpha-crystallin-domain holdase that keeps heat-denatured
  proteins soluble. Insulin/IGF-1-like signaling restrains an early step of
  HSF-1 activation through the DDL-1/DDL-2 complex. Reduced insulin signaling
  lets HSF-1 act together with DAF-16/FOXO on small heat shock protein genes,
  including the atypical 12-kDa sHSPs HSP-12.3 and HSP-12.6, which lack
  chaperone activity in vitro. The capacity of the response falls sharply at
  the onset of reproduction, when H3K27 trimethylation at stress loci blocks
  HSF-1 binding.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:15611166
    title: >-
      The L-type cyclin CYL-1 and the heat-shock-factor HSF-1 are required for
      heat-shock-induced protein expression in Caenorhabditis elegans.
    statement: >-
      hsf-1 mutation virtually abolishes heat-shock-induced hsp-16.2
      transcription, establishing HSF-1 as the inducing factor for heat shock
      genes in the worm.
    supporting_text: >-
      Heat-shock-induced expression of hsp-16.2 mRNA was reduced in cyl-1
      mutants and virtually eliminated in hsf-1 and sup-45 mutants, as compared
      to wild-type expression.
  - source_id: PMID:27688402
    title: >-
      E2F coregulates an essential HSF developmental program that is distinct
      from the heat-shock response.
    statement: >-
      Heat shock relocates HSF-1 to distal HSEs of the hsc70 (hsp-1) and hsp90
      promoters, which then drive their heat induction; the developmental
      HSF-1 program uses different sites and is outside this module.
    supporting_text: >-
      In contrast to the results for development at 20°C, activity of the
      hsc70 and hsp90 promoters at 34°C is independent of the GC-rich motif or
      the proximal HSEs but is regulated entirely by the tandem distal HSEs
  - source_id: PMID:26212459
    title: >-
      Repression of the Heat Shock Response Is a Programmed Event at the Onset
      of Reproduction.
    statement: >-
      The heat shock response collapses in early adulthood because repressive
      chromatin at stress loci prevents HSF-1 binding.
    supporting_text: >-
      This results in a repressed chromatin state that interferes with HSF-1
      binding and suppresses transcription initiation in response to stress.
  - source_id: PMID:14668486
    title: >-
      Regulation of longevity in Caenorhabditis elegans by heat shock factor
      and molecular chaperones.
    statement: >-
      Molecular chaperones are transcriptional targets of HSF-1, and their
      individual knockdown has smaller effects than loss of HSF-1, consistent
      with a chaperone network output.
    supporting_text: >-
      Down-regulation of individual molecular chaperones, transcriptional
      targets of HSF-1, also decreased longevity of long-lived mutant but not
      wild-type animals.
  - source_id: file:genes/worm/hsf-1/hsf-1-ai-review.yaml
    title: worm hsf-1 gene review
    statement: >-
      Accepts HSF-1 as the HSE-binding master transcription factor of the
      heat shock response; developmental, immune, autophagy and lifespan roles
      are kept as non-core.
  - source_id: file:projects/CAEEL_PROTEOSTASIS.md
    title: C. elegans Proteostasis Network Project
    statement: >-
      Project page whose heat shock response and chaperone tier this module
      organizes.
notes: >-
  Boundary. This is a concrete C. elegans module for the HSF-1-driven
  cytosolic heat shock response: HSF-1 activation and HSE binding (part 1)
  and the cytosolic chaperone output it induces (parts 2 to 5). HSF-1's
  heat-shock-independent developmental program with EFL-1/DPL-1 (larval
  development, PMID:27688402), its role in linker cell death through the
  ubiquitin-proteasome system (PMID:26952214), autophagy induction after
  hormetic heat (PMID:28198373) and pathogen resistance are outside the
  boundary; the hsf-1 review keeps these as non-core. The ER unfolded protein
  response (HSP-4/BiP) and the mitochondrial UPR belong to the
  CAEEL_UPR_STRESS project, not here. Chaperonin (CCT/TRiC) induction is a
  known HSF-1 output but no CCT subunit has a worm review yet, so it is not
  modeled.

  Relation to other modules. MODULE:bacterial_dnak_dnaj_refolding_cycle
  models the bacterial DnaK/DnaJ/GrpE Hsp70 cycle. Part 2 here is the
  eukaryotic cytosolic counterpart (Hsc70 HSP-1 with HSP110 and BAG-family
  nucleotide-exchange factors instead of GrpE), within a stress-induced
  transcriptional program, so the two are not duplicates. No eukaryotic
  Hsp70/Hsp110 or Hsp90 cycle module exists yet.

  Regulators kept as context. DDL-1/DDL-2 form the DHIC complex that holds
  HSF-1 inactive under insulin/IGF-1-like signaling (PMID:22265419); PQM-1
  contributes to heat induction of hsp-90 and to transcellular chaperone
  signaling (PMID:29949773); JMJD-3.1 and H3K27me3 set the reproductive
  decline of the response (PMID:26212459). None of these has a worm review,
  so they are recorded here rather than modeled as members. HSP-90-mediated
  negative feedback on HSF-1, a well-known feature of the response in yeast
  and mammals, has no cached worm evidence and is not modeled (see
  knowledge_gaps).

  Members deliberately excluded. Hsp40/J-domain co-chaperones are part of the
  worm Hsc70 cofactor network (DNJ-13 antagonizes UNC-23 in muscle,
  PMID:25053410; DNJ-19 limits SOD1 aggregation, PMID:19165329), but no worm
  DNJ gene has a review, and no cached paper assigns a specific DNJ protein
  as the HSF-1-induced Hsp40 partner. They are therefore named in text only.
  The strictly heat-inducible HSP70s (hsp-70/C12C8.1, F44E5.4/5) and the
  other hsp-16 genes (hsp-16.1, hsp-16.41, hsp-16.48) are direct HSF-1
  outputs but have no worm review; HSP-1 and HSP-16.2 stand in for their
  families.

  Atypical small HSPs. The 12-kDa sHSPs are modeled as a separate output
  part, following their gene reviews. HSP-12.3 forms tetramers and HSP-12.6
  is monomeric; neither shows in vitro chaperone activity. The hsp-12.6
  review marks "response to heat" as an over-annotation because hsp-12.6 is
  not stress-inducible, so no heat-response process is asserted for it. The
  link of these genes to HSF-1 is through HSF-1/DAF-16 co-regulation of sHSP
  genes in reduced insulin signaling and longevity (PMID:12750521), not
  through acute heat induction. Their part is therefore not required for the
  acute response.
module:
  id: c_elegans_heat_shock_response
  label: HSF-1 cytosolic heat shock response in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    HSF-1 activation and HSE-dependent transcription, and the cytosolic
    chaperone network it induces: the HSP-1 Hsc70 foldase with its HSP-110
    and BAG-1 nucleotide-exchange factors, the HSP-90 chaperone, the HSP-16.2
    holdase, and HSF-1/DAF-16-co-regulated atypical 12-kDa sHSPs.
  concepts:
    - preferred_term: cellular response to heat
      term:
        id: GO:0034605
        label: cellular response to heat
      description: >-
        Core process: the cell-autonomous transcriptional and chaperone
        response to elevated temperature.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    conditions:
      - preferred_term: heat shock or other proteotoxic stress
  parts:
    - order: 1
      role: stress-activated heat shock factor binding HSEs and inducing chaperone genes
      node:
        id: hsf1_activation
        label: HSF-1 activation and HSE-dependent transcription
        module_type: REGULATORY_STEP
        description: >-
          HSF-1 is constitutively nuclear. Heat shock causes its rapid,
          reversible redistribution into nuclear stress granules that
          colocalize with markers of active transcription; granule formation
          needs HSF-1 DNA binding. HSF-1 binds continuous inverted nGAAn
          pentamer HSEs (worm HSF-1, unlike other HSFs tested, does not bind
          discontinuous nGAAn units) and on heat shock occupies inducible
          distal HSEs at chaperone genes. HSF-1 self-associates into dimers
          and trimers (hsf-1 review); trimerization as the activation switch
          is inferred from HSF family biology rather than shown directly in
          the worm. Insulin/IGF-1-like signaling inhibits an early activation
          step through DDL-1/DDL-2, and repressive chromatin at stress loci
          blocks HSF-1 binding from early adulthood.
        annotons:
          - id: hsf1_tf
            label: HSF-1 HSE-binding transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSF-1
                term:
                  id: UniProtKB:G5EFT5
                  label: Heat shock transcription factor hsf-1
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              targets:
                - preferred_term: >-
                    HSE-containing promoters of heat shock genes (hsp-16
                    gene pairs, hsp-1/hsc70, hsp-90, inducible hsp-70 genes)
            processes:
              - preferred_term: cellular response to heat
                term:
                  id: GO:0034605
                  label: cellular response to heat
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
                description: >-
                  Heat shock concentrates HSF-1 in nuclear stress granules
                  (GO:0097165), a sub-compartment of the nucleus.
            role_description: >-
              Master stress-inducible transcription factor; binds HSEs and
              activates heat shock gene transcription.
            evidence:
              - source_id: PMID:21510947
                title: >-
                  Diversity in DNA recognition by heat shock transcription
                  factors (HSFs) from model organisms.
                statement: >-
                  Worm HSF-1 binds continuous nGAAn HSEs but, unusually, not
                  discontinuous ones.
                supporting_text: >-
                  Among these, only C. elegans HSF failed to bind the
                  discontinuous nGAAn units
              - source_id: PMID:23107491
                title: >-
                  Caenorhabditis elegans HSF-1 is an essential nuclear protein
                  that forms stress granule-like structures following heat
                  shock.
                statement: >-
                  Heat shock redistributes HSF-1 into nuclear stress granules
                  that mark active transcription, dependent on DNA binding.
                supporting_text: >-
                  Rapid formation of HSF-1 stress granules required HSF-1
                  DNA-binding activity
              - source_id: PMID:22265419
                title: >-
                  HSF-1 regulators DDL-1/2 link insulin-like signaling to
                  heat-shock responses and modulation of longevity.
                statement: >-
                  Insulin/IGF-1-like signaling regulates an early step of
                  HSF-1 activation via DDL-1 and DDL-2.
                supporting_text: >-
                  This regulation occurs at an early step of HSF-1 activation
                  via two HSF-1 regulators, DDL-1 and DDL-2.
              - source_id: file:genes/worm/hsf-1/hsf-1-ai-review.yaml
                title: worm hsf-1 gene review
                statement: >-
                  Core functions: DNA-binding transcription factor activity
                  (GO:0003700), sequence-specific HSE binding and homo-
                  oligomerization.
    - order: 2
      role: ATP-dependent Hsp70 refolding of heat-denatured clients with nucleotide-exchange factors
      node:
        id: hsp70_folding_cycle
        label: HSP-1 Hsc70 folding cycle with HSP-110 and BAG-1
        module_type: BIOLOGICAL_PROCESS
        description: >-
          HSP-1 is the abundant cytosolic Hsc70. Its mRNA is high without
          stress and rises two- to six-fold on heat shock, driven by distal
          HSEs that HSF-1 occupies during heat shock. HSP-1 binds non-native
          clients and refolds them through ATP hydrolysis-coupled cycles.
          Nucleotide exchange resets the cycle: HSP-110 (HSP110/HSPH family)
          and BAG-1 (BAG domain) both act as nucleotide-exchange factors for
          HSP-1, and BAG-1 stimulates the Hsc70 ATPase more strongly than its
          paralog UNC-23. J-domain (Hsp40) partners that target clients to
          HSP-1 are part of this cycle but are not modeled (see notes).
        concepts:
          - preferred_term: protein folding
            term:
              id: GO:0006457
              label: protein folding
        annotons:
          - id: hsp1_foldase
            label: HSP-1 ATP-dependent Hsp70 foldase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP-1
                term:
                  id: UniProtKB:P09446
                  label: Heat shock protein hsp-1
            function:
              preferred_term: ATP-dependent protein folding chaperone
              term:
                id: GO:0140662
                label: ATP-dependent protein folding chaperone
              substrates:
                - preferred_term: heat-denatured or misfolded cytosolic protein
            processes:
              - preferred_term: protein folding
                term:
                  id: GO:0006457
                  label: protein folding
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Constitutive, modestly heat-inducible Hsc70 that performs
              ATP-driven client refolding.
            evidence:
              - source_id: PMID:2841196
                title: >-
                  The Caenorhabditis elegans hsp70 gene family: a molecular
                  genetic characterization.
                statement: >-
                  hsp70A (hsp-1) is abundant without stress and heat-inducible.
                supporting_text: >-
                  Transcripts of another gene, hsp70A, are abundant in control
                  worms and are also increased (two- to six-fold) upon heat
                  shock.
              - source_id: PMID:25053410
                title: >-
                  The balanced regulation of Hsc70 by DNJ-13 and UNC-23 is
                  required for muscle functionality.
                statement: >-
                  Worm Hsc70 folds non-native proteins with J-domain and
                  BAG-domain cofactors.
                supporting_text: >-
                  The molecular chaperone Hsc70 assists in the folding of
                  non-native proteins together with its J domain- and BAG
                  domain-containing cofactors.
              - source_id: file:genes/worm/hsp-1/hsp-1-ai-review.yaml
                title: worm hsp-1 gene review
                statement: >-
                  Core function: ATP-dependent protein folding chaperone
                  (GO:0140662).
          - id: hsp110_nef
            label: HSP-110 Hsp70 nucleotide-exchange factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP-110
                term:
                  id: UniProtKB:Q05036
                  label: Heat shock protein 110
            function:
              preferred_term: adenyl-nucleotide exchange factor activity
              term:
                id: GO:0000774
                label: adenyl-nucleotide exchange factor activity
              targets:
                - preferred_term: HSP-1 (Hsc70) nucleotide-binding domain
            processes:
              - preferred_term: protein folding
                term:
                  id: GO:0006457
                  label: protein folding
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              HSP110-family nucleotide-exchange factor that releases ADP from
              Hsp70; also limits aggregation of misfolding-prone proteins.
            evidence:
              - source_id: PMID:19165329
                title: >-
                  An ALS-linked mutant SOD1 produces a locomotor defect
                  associated with aggregation and synaptic dysfunction when
                  expressed in neurons of Caenorhabditis elegans.
                statement: >-
                  Knockdown of hsp-110 (C30C11.4), with other chaperones,
                  increases aggregation of misfolded SOD1 in worm neurons.
                supporting_text: >-
                  hits of a collective of chaperone components registered
                  strong increases of aggregation, including an Hsp110
                  (C30C11.4), a DnaJ (A2) (dnj-19), an Hsp70 (stc-1), and a
                  neuron specific Hsp16 (F08H9.4)
              - source_id: PMID:16688211
                title: >-
                  Chaperone network in the yeast cytosol: Hsp110 is revealed
                  as an Hsp70 nucleotide exchange factor.
                statement: >-
                  Family-level grounding: HSP110 (yeast Sse1) is an Hsp70
                  nucleotide-exchange factor.
                supporting_text: >-
                  acts as an efficient nucleotide exchange factor (NEF) for
                  both yeast cytosolic Hsp70s, Ssa1p and Ssb1p
              - source_id: file:genes/worm/hsp-110/hsp-110-ai-review.yaml
                title: worm hsp-110 gene review
                statement: >-
                  Core function: adenyl-nucleotide exchange factor activity
                  (GO:0000774) for Hsp70 in the cytosol.
          - id: bag1_nef
            label: BAG-1 BAG-domain nucleotide-exchange factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BAG-1
                term:
                  id: UniProtKB:O44739
                  label: BAG family molecular chaperone regulator 1
            function:
              preferred_term: adenyl-nucleotide exchange factor activity
              term:
                id: GO:0000774
                label: adenyl-nucleotide exchange factor activity
              targets:
                - preferred_term: HSP-1 (Hsc70) ATPase domain
            processes:
              - preferred_term: protein folding
                term:
                  id: GO:0006457
                  label: protein folding
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              BAG-domain co-chaperone that stimulates the HSP-1 ATPase cycle
              and client release; tunes rather than drives folding, and can
              antagonize it in excess.
            evidence:
              - source_id: PMID:25053410
                title: >-
                  The balanced regulation of Hsc70 by DNJ-13 and UNC-23 is
                  required for muscle functionality.
                statement: >-
                  Worm BAG-1 stimulates the Hsc70 ATPase with higher affinity
                  than the BAG-domain fragments of UNC-23.
                supporting_text: >-
                  C-terminal fragments of UNC-23 instead perform all
                  Hsc70-related functions, like ATPase stimulation and
                  regulation of folding activity, albeit with lower affinity
                  than BAG-1.
              - source_id: file:genes/worm/bag-1/bag-1-ai-review.yaml
                title: worm bag-1 gene review
                statement: >-
                  Core function: adenyl-nucleotide exchange factor activity
                  (GO:0000774) for cytosolic Hsc70 HSP-1.
    - order: 2
      role: heat-inducible ATP-dependent HSP90 chaperone
      node:
        id: hsp90_chaperone
        label: HSP-90 ATP-dependent chaperone
        module_type: MOLECULAR_FUNCTION
        description: >-
          HSP-90 (historical mutant name DAF-21) is the only cytosolic HSP90
          in C. elegans. It is heat-inducible through distal HSEs bound by
          HSF-1, with an additional PQM-1 contribution, and it maintains
          signaling and structural clients; loss of HSP-90 causes MYO-3
          myosin aggregation in muscle.
        annotons:
          - id: hsp90_foldase
            label: HSP-90 ATP-dependent chaperone
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP-90
                term:
                  id: UniProtKB:Q18688
                  label: Heat shock protein 90
            function:
              preferred_term: ATP-dependent protein folding chaperone
              term:
                id: GO:0140662
                label: ATP-dependent protein folding chaperone
              substrates:
                - preferred_term: client proteins (kinases, guanylyl cyclases, myosin)
            processes:
              - preferred_term: protein folding
                term:
                  id: GO:0006457
                  label: protein folding
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Sole cytosolic HSP90; heat-induced chaperone for client
              maturation and maintenance.
            evidence:
              - source_id: PMID:29949773
                title: >-
                  A PQM-1-Mediated Response Triggers Transcellular Chaperone
                  Signaling and Regulates Organismal Proteostasis.
                statement: >-
                  hsp-90 expression depends partly on hsf-1 and its heat
                  induction also needs PQM-1.
                supporting_text: >-
                  After HS treatment, hsp-90 was weakly induced in the
                  hsf-1(sy441) mutant, albeit starting at a 50% lower basal
                  expression level
              - source_id: PMID:21980476
                title: >-
                  Downregulation of the Hsp90 system causes defects in muscle
                  cells of Caenorhabditis elegans.
                statement: >-
                  HSP-90 maintains myosin MYO-3 folding state in muscle.
                supporting_text: >-
                  aggregates of the myosin MYO-3 are visible in muscle cells,
                  if DAF-21 is depleted
              - source_id: file:genes/worm/hsp-90/hsp-90-ai-review.yaml
                title: worm hsp-90 gene review
                statement: >-
                  Core function: ATP-dependent protein folding chaperone
                  (GO:0140662).
    - order: 2
      role: ATP-independent small HSP holdase output
      node:
        id: shsp_holdase
        label: HSP-16.2 small HSP holdase
        module_type: MOLECULAR_FUNCTION
        description: >-
          The four hsp-16 genes are arranged as divergently transcribed pairs
          sharing intergenic HSEs. They are silent without stress and
          strictly heat-inducible, and their induction is HSF-1-dependent.
          HSP-16.2 is an alpha-crystallin-domain holdase that binds
          heat-denatured proteins without ATP and keeps them soluble and
          refolding-competent for Hsp70-dependent refolding. GO has no current
          term for holdase activity (GO:0051082 was obsoleted), so the
          function is given by name only.
        annotons:
          - id: hsp16_2_holdase
            label: HSP-16.2 holdase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP-16.2
                term:
                  id: UniProtKB:P06582
                  label: Heat shock protein hsp-16.2
            function:
              preferred_term: holdase chaperone activity
              description: >-
                No GO term; the hsp-16.2 review proposes a holdase chaperone
                activity NTR.
              substrates:
                - preferred_term: heat-denatured aggregation-prone protein
            processes:
              - preferred_term: response to heat
                term:
                  id: GO:0009408
                  label: response to heat
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Strictly heat-inducible sHSP holdase that prevents aggregation of
              denatured proteins; does not refold them itself.
            evidence:
              - source_id: PMID:1550963
                title: >-
                  Temporal and spatial expression patterns of the small heat
                  shock (hsp16) genes in transgenic Caenorhabditis elegans.
                statement: hsp16 transcription is entirely heat-shock dependent.
                supporting_text: >-
                  Transcription of the hsp16-lacZ transgenes was totally
                  heat-shock dependent
              - source_id: PMID:15611166
                title: >-
                  The L-type cyclin CYL-1 and the heat-shock-factor HSF-1 are
                  required for heat-shock-induced protein expression in
                  Caenorhabditis elegans.
                statement: hsp-16.2 heat induction requires HSF-1.
                supporting_text: >-
                  Heat-shock-induced expression of hsp-16.2 mRNA was reduced in
                  cyl-1 mutants and virtually eliminated in hsf-1 and sup-45
                  mutants
              - source_id: file:genes/worm/hsp-16.2/hsp-16.2-ai-review.yaml
                title: worm hsp-16.2 gene review
                statement: >-
                  Core function: ATP-independent holdase in response to heat;
                  protein refolding removed and GO:0051082 replaced by a
                  holdase NTR.
    - order: 3
      role: HSF-1/DAF-16-co-regulated atypical 12-kDa sHSPs (longevity branch, not required for the acute response)
      node:
        id: atypical_shsp_output
        label: Atypical 12-kDa small HSPs HSP-12.3 and HSP-12.6
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The four 12-kDa sHSPs of C. elegans are essentially bare
          alpha-crystallin domains with very short N-terminal regions and no
          C-terminal tail. HSP-12.3 forms tetramers (with HSP-12.2) and
          HSP-12.6 is monomeric; neither has in vitro chaperone activity, and
          hsp-12.6 is not stress-inducible. Their connection to HSF-1 is via
          HSF-1 and DAF-16 jointly activating sHSP genes when insulin/IGF-1
          signaling is reduced, a branch that contributes to longevity and
          delays polyglutamine aggregation. No holdase or heat-response
          function is asserted for HSP-12.6.
        concepts:
          - preferred_term: determination of adult lifespan
            term:
              id: GO:0008340
              label: determination of adult lifespan
            description: >-
              Physiological context of the HSF-1/DAF-16 sHSP branch; not
              asserted as an annoton process for either 12-kDa sHSP.
        annotons:
          - id: hsp12_3_shsp
            label: HSP-12.3 tetrameric atypical sHSP
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP-12.3
                term:
                  id: UniProtKB:Q20164
                  label: SHSP domain-containing protein
            function:
              preferred_term: heat shock protein binding
              term:
                id: GO:0031072
                label: heat shock protein binding
              targets:
                - preferred_term: HSP-12.2
            processes:
              - preferred_term: response to heat
                term:
                  id: GO:0009408
                  label: response to heat
            locations:
              - preferred_term: cytoplasm
                term:
