id: MODULE:swi_snf_chromatin_remodeling
title: >-
  Mammalian SWI/SNF (BAF) chromatin remodeling complexes — canonical BAF (ARID1A/B, DPF1-3), PBAF (ARID2,
  PBRM1, BRD7, PHF10) and non-canonical GBAF/ncBAF (BICRA/BICRAL, BRD9) built on a shared SMARCC-SMARCD-SMARCE1-SMARCB1
  core and a SMARCA4/SMARCA2 ATPase module
description: >-
  The mammalian SWI/SNF or BAF (BRG1/BRM-associated factor) complexes are ATP-dependent chromatin remodelers
  of the SWI2/SNF2 family. Each complex uses one of two mutually exclusive ATPases, SMARCA4 (BRG1) or
  SMARCA2 (BRM), to translocate on nucleosomal DNA, sliding or ejecting histone octamers and making promoters
  and enhancers accessible to transcription factors. The ATPase sits in an ATPase module with the actin-related
  protein ACTL6A or ACTL6B, beta-actin and a BCL7 protein. Most complexes also share a core module built
  from a SMARCC1/SMARCC2 dimer and one SMARCD paralogue, onto which SMARCE1 and SMARCB1 dock. Three classes
  are distinguished by their specific subunits. Canonical BAF (cBAF) contains ARID1A or ARID1B, a DPF
  protein (DPF1, DPF2 or DPF3) and SS18. Polybromo-associated BAF (PBAF), the RSC-type complex, contains
  ARID2, PBRM1, BRD7 and PHF10, and lacks SS18. Non-canonical BAF (ncBAF or GBAF) contains BICRA (GLTSCR1)
  or BICRAL (GLTSCR1L) with BRD9 and SS18, a reduced core of SMARCC1 and SMARCD1, and no SMARCE1, SMARCB1
  or DPF subunit. Paralogue choice and cell-type-specific subunits (for example ACTL6B and DPF1/DPF3 in
  post-mitotic neurons) create many complex variants. The complexes are recruited to chromatin by transcription
  factors and modified histones and both activate and repress genes. Subunits are mutated in about a fifth
  of human cancers and in Coffin-Siris syndrome.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001339
  title: chromatin remodeling pathway
  statement: >-
    The module models the SWI/SNF branch of the RGD chromatin remodeling pathway. RGD's text describes
    BAF and PBAF, a shared core of Smarca4/Smarca2, Smarcc1/Smarcc2, Smarcd1-3, Actl6a/b and Smarcb1,
    and the additional subunits Arid1a/b, Arid2, Pbrm1, Phf10, Dpf1-3, Brd7, Brd9, Smarce1 and beta-actin;
    its diagram draws BAF and PBAF complexes positively affecting gene expression. Derived through projects/RGD_PATHWAY_ONTOLOGY
    (pathways/PW_0001339.yaml); the INO80, ISWI and CHD branches of the same pathway are other modules.
- source_id: GO:0006338
  title: chromatin remodeling
  statement: >-
    The GO process mapped to PW:0001339 (skos:closeMatch, from the PW definition cross-reference and a
    label match in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is the process carried by
    each complex annoton.
- source_id: GO:0070603
  title: SWI/SNF superfamily-type complex
  statement: >-
    Parent class of the three complex terms used for the variants (SWI/SNF complex, RSC-type complex,
    GBAF complex). It is broader than this module (it also covers ISWI-, CHD- and INO80-type remodelers),
    so it is not used as a module concept.
- source_id: PMID:8895581
  statement: >-
    BAF complexes were purified as BRG1-associated factors; they are heterogeneous in subunit composition
    and BRG1 and hBRM occupy separate complexes.
  supporting_text: >-
    Purification of the complex from several cell lines demonstrates that it is heterogeneous with respect
    to subunit composition.
- source_id: PMID:30343899
  statement: >-
    Defines the three classes (cBAF, PBAF, ncBAF), their modular architecture and assembly order; the
    module's parts follow this model.
  supporting_text: >-
    Here, we elucidate the architecture and assembly pathway across three classes of mSWI/SNF complexes-canonical
    BRG1/BRM-associated factor (BAF), polybromo-associated BAF (PBAF), and newly defined ncBAF complexes-and
    define the requirement of each subunit for complex formation and stability.
- source_id: PMID:23644491
  statement: Proteomics of endogenous complexes added BCL7A-C, BRD9 and SS18 as dedicated stable subunits.
  supporting_text: >-
    identified several new dedicated, stable subunits not found in yeast SWI/SNF complexes, including
    BCL7A, BCL7B and BCL7C, BCL11A and BCL11B, BRD9 and SS18
notes: 'Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling pathway) through the
  RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier related_module_only).
  RGD curates 74 human genes to PW:0001339 and has no gene-level diagram; its text describes four remodeler
  families (SWI/SNF, INO80/SWR1, ISWI and CHD) that share no subunits beyond actin-related proteins and
  perform different reactions. The project therefore models the pathway as one human module per SNF2-family
  complex group. This module is the SWI/SNF group; the ISWI group is modules/iswi_chromatin_remodeling
  (drafted together with this one). The INO80, SRCAP, TIP60/p400 and CHD/NuRD genes on the RGD list are
  left for other modules and are not modelled here.


  RGD genes in scope (22): SMARCA2 SMARCA4 SMARCB1 SMARCC1 SMARCC2 SMARCD1 SMARCD2 SMARCD3 SMARCE1 ARID1A
  ARID1B ARID2 PBRM1 BRD7 BRD9 PHF10 DPF1 DPF2 DPF3 ACTL6A ACTL6B ACTB. All 22 are modelled. Seven gene
  products not on the RGD list are added because the current subcomplex definitions cannot be stated without
  them: BICRA (GLTSCR1) and BICRAL (GLTSCR1L), the defining subunits of ncBAF/GBAF (RGD lists BRD9 but
  not its partner); SS18 and SS18L1, which distinguish cBAF and ncBAF from PBAF; and BCL7A, BCL7B and
  BCL7C, pan-mSWI/SNF ATPase-module subunits identified by proteomics (PMID:23644491, PMID:30343899).
  BCL11A and BCL11B, also reported as BAF subunits in PMID:23644491, are not added: they are cell-type-restricted
  transcription factors whose stable incorporation is less well established, and treating them as subunits
  would bring transcription-factor targeting inside the module boundary.


  Structure. Following the Drosophila analogue modules/dmel_brahma_complexes (BAP, PBAP, ncBAP), the three
  classes are variants of one REALIZER variant set (selection ONE_OR_MORE, since they coexist), each a
  protein-complex annoton whose active units are listed in full. The shared subunits therefore appear
  once per class; this repetition is deliberate so that each complex annoton states its own composition.
  Within each class the paralogue alternatives are FAMILY units with representative members, not separate
  variants: SMARCA4/SMARCA2, ACTL6A/ACTL6B, SMARCC1/SMARCC2, SMARCD1-3, ARID1A/ARID1B, DPF1-3, BCL7A-C,
  SS18/SS18L1 and BICRA/BICRAL. The first representative listed is the predominant member. In ncBAF the
  core positions are single gene products (SMARCC1, SMARCD1, ACTL6A) because the purifications detected
  only those paralogues (PMID:30343899) and the GBAF definition names BAF53a (PMID:29374058). SMARCC is
  a dimer in cBAF and PBAF (homo- or heterodimer), recorded in the unit role rather than as stoichiometry.
  Cell-type-restricted complexes named by RGD (npBAF, nBAF, esBAF) and the GO terms for them are paralogue
  selections of the cBAF class (for example ACTL6B with DPF1/DPF3 in neurons, SMARCD3 in neural progenitors)
  and are not modelled as further variants. The Drosophila module is the evolutionary counterpart and
  is not referenced as a module_ref because its members are fly proteins.


  Complex typing. GO has no class that groups exactly the three mammalian SWI/SNF classes: GO:0070603
  SWI/SNF superfamily-type complex also covers the ISWI-, CHD- and INO80-type remodelers, so it is used
  only as an evidence entry, and the module concepts are the three class terms plus chromatin remodeling.
  cBAF is typed SWI/SNF complex (whose definition names SMARCA4/BRG1), PBAF RSC-type complex (whose definition
  names PB1/BAF180) and ncBAF GBAF complex (defined from PMID:29374058). Molecular functions. Functions
  come from each protein''s experimental GO annotations in QuickGO (November 2026) and, where a gene review
  exists (ARID1A, ARID1B, ARID2, DPF2, BICRA, ACTB), from its core functions. The ATPase family carries
  ATP-dependent chromatin remodeler activity (SMARCA4 IDA, PMID:8895581); each complex annoton carries
  the same activity, process chromatin remodeling and location chromatin. ARID1A/B and ARID2 carry DNA
  binding (IDA rows and the core function of all three gene reviews). The DPF family carries histone reader
  activity, the parent of the H3K14ac and H4K16ac reader activities that DPF2 has by IDA (PMID:28533407)
  and the core function of the DPF2 review; DPF1 and DPF3 have no experimental reader rows and are included
  by family. BRD7 carries histone H3K14ac reader activity (IDA, PMID:16265664). Units without a function:
  SMARCC1/2, SMARCD1-3, SMARCE1, SMARCB1, ACTL6A/B, ACTB, BCL7A-C, SS18/SS18L1, PBRM1, PHF10, BRD9 and
  BICRA/BICRAL. Their roles are given in prose. Deliberate omissions: (a) human GOA has "enables ATP-dependent
  chromatin remodeler activity" IDA rows from PMID:8895581 on SMARCB1, SMARCC1, SMARCC2, SMARCD1, SMARCD2,
  SMARCD3, SMARCE1, ARID1A and ARID2; that paper assayed the purified complex, so these subunits contribute
  to rather than enable the activity, and they are left without a function here (recorded for upstream
  review below). (b) Transcription coactivator/corepressor activity, nuclear receptor binding, p53 binding
  and DNA-binding transcription factor binding rows (SMARCA2, SMARCA4, SMARCB1, SMARCD1, SMARCD3, SMARCE1,
  ARID1A, BRD7, SS18, BICRA) describe recruitment by transcription factors, which is context, not part
  of the remodeling machine. (c) BRD9 has a histone reader IDA row from a bromodomain peptide-array screen
  (PMID:22464331, abstract only in cache, not quoted) and a protein-macromolecule adaptor IDA row for
  RAD51-RAD54 assembly in homologous recombination (PMID:32457312, gomodel:680ad14200007322); the first
  could not be checked against cached text and the second is DNA-repair context, so BRD9 carries no function
  here. (d) BICRA''s gene review core function, protein-macromolecule adaptor activity bridging BRD4 to
  GBAF, is targeting context and is not asserted. (e) PBRM1 has no experimental molecular-function row
  despite its six bromodomains, so no reader activity is authored for it. No function in this file is
  authored without an experimental GOA row or gene-review core function.


  Boundary decisions. (1) Histone modification (the histone modification pathway PW:0001338 linked from
  RGD''s diagram), DNA methylation (PW:0001340), recruitment to DNA damage and the ATM signaling link
  (PW:0001361; modules/atm_dsb_signaling), and targeting by transcription factors, nuclear receptors and
  BRD4 are context, not parts. (2) The RGD diagram''s edge from SWI/SNF to ATM signaling is not modelled.
  (3) Beta-actin is a genuine stoichiometric ATPase-module subunit (PMID:30343899) and is modelled here;
  ACTL6A is also a subunit of the INO80 and NuA4/TIP60 complexes, which are out of scope, so it appears
  in this module only in its BAF/PBAF/ncBAF positions. (4) PHF10 is a PBAF subunit in the current model
  (PMID:30343899); older descriptions place it in npBAF, and the npBAF GO definition still lists it. (5)
  WINAC (BAZ1B with SWI/SNF subunits) is not modelled; BAZ1B is placed in the ISWI module as the WICH
  subunit.


  GO-CAM links. gocams/index.tsv was checked for every member. The only human model containing a member
  is gomodel:680ad14200007322 (BRD9 regulates RAD51 and RAD54L in homologous recombination), in which
  BRD9 is typed protein-macromolecule adaptor activity in DNA repair; that activity is outside this module
  and is not linked. The seed''s best_gocam (gomodel:617b481400000460, KAT5 in homologous recombination)
  concerns the TIP60 branch of the RGD list and is unrelated to SWI/SNF. Observations for upstream review:
  the PMID:8895581 complex-level remodeler rows are annotated with qualifier enables on non-catalytic
  subunits (contributes_to would match the assay), and SMARCE1 has an "N-acetyltransferase activity" IDA
  row from PMID:12192000, a study of REST repression that does not, on its abstract, report an acetyltransferase
  activity for BAF57. PANTHER family ids and PTNs are deliberately not asserted.


  Quotes from PMID:30343899 and PMID:16265664 are verified against draft caches (not yet in publications/).'
module:
  id: swi_snf_chromatin_remodeling
  label: Mammalian SWI/SNF (BAF) chromatin remodeling complexes
  module_type: PROTEIN_COMPLEX
  description: >-
    Three classes of SMARCA4/SMARCA2-driven remodelers (cBAF, PBAF, ncBAF) assembled from shared core
    and ATPase modules plus class-specific subunits.
  concepts:
  - preferred_term: SWI/SNF complex
    term:
      id: GO:0016514
      label: SWI/SNF complex
  - preferred_term: RSC-type complex
    term:
      id: GO:0016586
      label: RSC-type complex
  - preferred_term: GBAF complex
    term:
      id: GO:0140288
      label: GBAF complex
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cellular_components:
    - preferred_term: chromatin
      term:
        id: GO:0000785
        label: chromatin
  variant_sets:
  - id: mswi_snf_complex_classes
    label: mSWI/SNF complex classes
    axis: class-specific subunits assembled on the shared core and ATPase modules
    variant_kind: REALIZER
    selection: ONE_OR_MORE
    notes: >-
      All three classes coexist in most cells; each is an alternative carrier of the ATP-dependent remodeler
      activity, with different genomic targeting.
    variants:
    - id: cbaf
      label: Canonical BAF complex (cBAF; ARID1A/B- and DPF-containing)
      module_type: PROTEIN_COMPLEX
      description: >-
        ARID1A/B-, DPF- and SS18-containing complex; the main enhancer-associated form. The cell-type-restricted
        esBAF, npBAF and nBAF complexes are paralogue selections of this class.
      concepts:
      - preferred_term: SWI/SNF complex
        term:
          id: GO:0016514
          label: SWI/SNF complex
      annotons:
      - id: cbaf_complex
        label: Canonical BAF complex (cBAF; ARID1A/B- and DPF-containing)
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: Canonical BAF complex (cBAF; ARID1A/B- and DPF-containing)
            term:
              id: GO:0016514
              label: SWI/SNF complex
            active_units:
            - id: cbaf_atpase
              label: SMARCA4 (BRG1) or SMARCA2 (BRM) ATPase
              role: >-
                Catalytic ATP-dependent DNA translocase that slides or ejects nucleosomes; the two paralogues
                are mutually exclusive within one complex.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: SWI2/SNF2-family ATPase paralogues of mammalian SWI/SNF (SMARCA4/BRG1,
                    SMARCA2/BRM)
                  representative_members:
                  - preferred_term: SMARCA4
                    term:
                      id: UniProtKB:P51532
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily A member 4
                  - preferred_term: SMARCA2
                    term:
                      id: UniProtKB:P51531
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily A member 2
              function:
                preferred_term: ATP-dependent chromatin remodeler activity
                term:
                  id: GO:0140658
                  label: ATP-dependent chromatin remodeler activity
              evidence:
              - source_id: PMID:8895581
                statement: BRG1-containing BAF complexes disrupt nucleosomes like yeast SWI/SNF; BRG1
                  and hBRM are in separate complexes.
                supporting_text: >-
                  Complexes containing BRG1 can disrupt nucleosomes and facilitate the binding of GAL4-VP16
                  to a nucleosomal template similar to the yeast SWI-SNF complex.
              - source_id: PMID:8895581
                statement: BRG1 and hBRM occupy separate complexes, so they are alternatives for one catalytic
                  position.
                supporting_text: The two SWI-SNF2 homologs, BRG1 and hbrm, were found in separate complexes.
            - id: cbaf_actl6
              label: ACTL6A (BAF53A) or ACTL6B (BAF53B)
              role: >-
                Actin-related subunit of the ATPase module, bound to the helicase-SANT-associated (HSA)
                region of the ATPase together with beta-actin; ACTL6B replaces ACTL6A in post-mitotic
                neurons.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: BAF53 actin-related paralogues (ACTL6A, ACTL6B)
                  representative_members:
                  - preferred_term: ACTL6A
                    term:
                      id: UniProtKB:O96019
                      label: Actin-like protein 6A
                  - preferred_term: ACTL6B
                    term:
                      id: UniProtKB:O94805
                      label: Actin-like protein 6B
            - id: cbaf_actb
              label: beta-actin
              role: Monomeric beta-actin bound with BAF53 to the ATPase HSA region in the ATPase module.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: ACTB
                  term:
                    id: UniProtKB:P60709
                    label: Actin, cytoplasmic 1
              evidence:
              - source_id: PMID:30343899
                statement: >-
                  Cross-linking mass spectrometry divides canonical BAF into an ATPase module (SMARCA,
                  beta-actin, ACTL6A), an associated SMARCB1/BCL7 module and a core module (SMARCC, SMARCD,
                  SMARCE1, ARID1).
                supporting_text: >-
                  This clustering revealed three distinct network modules: a catalytic module containing
                  the SMARCA ATPase subunit, β-actin, and ACTL6A, an associated module containing SMARCB1
                  and BCL7, and a module containing SMARCC, SMARCD, SMARCE1, and ARID1
            - id: cbaf_bcl7
              label: BCL7A, BCL7B or BCL7C
              role: Small dedicated subunit of the ATPase module present in all three complex classes;
                added beyond the RGD list.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: BCL7 family (BCL7A, BCL7B, BCL7C)
                  representative_members:
                  - preferred_term: BCL7A
                    term:
                      id: UniProtKB:Q4VC05
                      label: B-cell CLL/lymphoma 7 protein family member A
                  - preferred_term: BCL7B
                    term:
                      id: UniProtKB:Q9BQE9
                      label: B-cell CLL/lymphoma 7 protein family member B
                  - preferred_term: BCL7C
                    term:
                      id: UniProtKB:Q8WUZ0
                      label: B-cell CLL/lymphoma 7 protein family member C
              evidence:
              - source_id: PMID:30343899
                statement: BCL7 proteins co-purify with all three classes and belong to the ATPase module.
                supporting_text: >-
                  BCL7 purifications resolved all three mSWI/SNF complexes in expected fractions (Figure
                  S5G), demonstrating that BCL7 proteins are pan-mSWI/SNF ATPase module components.
            - id: cbaf_ss18
              label: SS18 or SS18L1
              role: >-
                Binds the ATPase N-terminal region in canonical BAF and ncBAF and competes with PBAF-specific
                PBRM1; absent from PBAF. Added beyond the RGD list.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: SS18 family (SS18, SS18L1/CREST)
                  representative_members:
                  - preferred_term: SS18
                    term:
                      id: UniProtKB:Q15532
                      label: Protein SSXT
                  - preferred_term: SS18L1
                    term:
                      id: UniProtKB:O75177
                      label: Calcium-responsive transactivator
              evidence:
              - source_id: PMID:30343899
                statement: SS18 assembles into BAF and ncBAF but not PBAF, competing with PBAF-specific
                  subunits such as PBRM1.
                supporting_text: suggesting a mutually exclusive competition between SS18 and PBAF-specific
                  subunits such as PBRM1
            - id: cbaf_smarcc
              label: SMARCC1 (BAF155) and/or SMARCC2 (BAF170)
              role: >-
                Scaffold of the BAF core module; present as a dimer (homodimer or SMARCC1-SMARCC2 heterodimer)
                that nucleates assembly.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: SWI3-homologous BAF155/BAF170 paralogues (SMARCC1, SMARCC2)
                  representative_members:
                  - preferred_term: SMARCC1
                    term:
                      id: UniProtKB:Q92922
                      label: SWI/SNF complex subunit SMARCC1
                  - preferred_term: SMARCC2
                    term:
                      id: UniProtKB:Q8TAQ2
                      label: SWI/SNF complex subunit SMARCC2
              evidence:
              - source_id: PMID:8804307
                statement: BAF155 and BAF170 are separate SWI3 homologues and copurify in the same complex.
                supporting_text: BAF155 and BAF170 are encoded by separate genes that are both homologs
                  of yeast SWI3.
            - id: cbaf_smarcd
              label: SMARCD1, SMARCD2 or SMARCD3 (BAF60A/B/C)
              role: >-
                Core-module subunit that nucleates assembly of every mSWI/SNF class together with SMARCC;
                the paralogues are tissue-restricted alternatives.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: BAF60 paralogues (SMARCD1, SMARCD2, SMARCD3)
                  representative_members:
                  - preferred_term: SMARCD1
                    term:
                      id: UniProtKB:Q96GM5
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily D member 1
                  - preferred_term: SMARCD2
                    term:
                      id: UniProtKB:Q92925
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily D member 2
                  - preferred_term: SMARCD3
                    term:
                      id: UniProtKB:Q6STE5
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily D member 3
              evidence:
              - source_id: PMID:8804307
                statement: >-
                  BAF60 is encoded by a gene family whose members (BAF60a, b, c) differ in tissue expression
                  and complex membership.
                supporting_text: BAF60 is encoded by a novel gene family.
            - id: cbaf_smarce1
              label: SMARCE1 (BAF57)
              role: >-
                HMG-box subunit that docks onto the SMARCC-SMARCD subcomplex to complete the BAF core
                module; absent from ncBAF.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: SMARCE1
                  term:
                    id: UniProtKB:Q969G3
                    label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin subfamily
                      E member 1
              evidence:
              - source_id: PMID:30343899
                statement: >-
                  SMARCE1 and SMARCB1 dock independently onto the SMARCC-SMARCD initial subcomplex to
                  form the BAF core module shared by cBAF and PBAF.
                supporting_text: >-
                  This initial subcomplex then acts as a platform for independent docking of SMARCE1 and
                  SMARCB1 subunits to form the BAF core module, which is required for assembly toward
                  fully formed cBAF and PBAF complexes
            - id: cbaf_smarcb1
              label: SMARCB1 (BAF47/SNF5/INI1)
              role: >-
                Nucleosome-contacting core subunit that docks onto the SMARCC-SMARCD subcomplex; absent
                from ncBAF. Its loss defines rhabdoid tumours.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: SMARCB1
                  term:
                    id: UniProtKB:Q12824
                    label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin subfamily
                      B member 1
              evidence:
              - source_id: PMID:30343899
                statement: >-
                  SMARCE1 and SMARCB1 dock independently onto the SMARCC-SMARCD initial subcomplex to
                  form the BAF core module shared by cBAF and PBAF.
                supporting_text: >-
                  This initial subcomplex then acts as a platform for independent docking of SMARCE1 and
                  SMARCB1 subunits to form the BAF core module, which is required for assembly toward
                  fully formed cBAF and PBAF complexes
            - id: cbaf_arid1
              label: ARID1A (BAF250A) or ARID1B (BAF250B)
              role: >-
                Defining large subunit of canonical BAF. Binds DNA without sequence preference through
                its ARID domain and bridges the core and ATPase modules; ARID1A and ARID1B are mutually
                exclusive.
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: ARID1 paralogues (ARID1A, ARID1B)
                  representative_members:
                  - preferred_term: ARID1A
                    term:
                      id: UniProtKB:O14497
                      label: AT-rich interactive domain-containing protein 1A
                  - preferred_term: ARID1B
                    term:
                      id: UniProtKB:Q8NFD5
                      label: AT-rich interactive domain-containing protein 1B
              function:
                preferred_term: DNA binding
                term:
                  id: GO:0003677
                  label: DNA binding
              evidence:
              - source_id: PMID:15170388
                statement: >-
                  ARID1A (p270) and ARID1B are alternative, mutually exclusive subunits, and ARID1B binds
                  DNA non-sequence-specifically like ARID1A.
                supporting_text: >-
                  indicates that p270 and ARID1B, similar to the ATPase subunits BRG1 and hBRM, are alternative,
