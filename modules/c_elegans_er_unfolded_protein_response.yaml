                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            processes:
              - preferred_term: integrated stress response signaling
                term:
                  id: GO:0140467
                  label: integrated stress response signaling
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              ISR transcription factor translated preferentially when
              eIF2alpha is phosphorylated, including under ER stress.
            evidence:
              - source_id: PMID:35181679
                title: ATF-4 and hydrogen sulfide signalling mediate longevity in response to inhibition of translation or mTORC1.
                statement: ER stress agents induce the uORF-regulated atf-4 translational reporter.
                supporting_text: >-
                  Compounds that induce ER stress and elicit the ISR, including
                  tunicamycin (TM) or dithiothreitol (DTT), also strongly
                  induced Patf-4(uORF)::GFP expression
              - source_id: PMID:35181679
                title: ATF-4 and hydrogen sulfide signalling mediate longevity in response to inhibition of translation or mTORC1.
                statement: Tunicamycin strongly increases eIF2alpha phosphorylation in worms.
                supporting_text: >-
                  treatment with 35 μg/ml tunicamycin for 4 h dramatically
                  increased eIF2α phosphorylation levels in L4 stage animals
        connections:
          - source: pek1_eif2a_kinase
