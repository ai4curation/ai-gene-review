id: MODULE:c_elegans_er_unfolded_protein_response
title: Endoplasmic reticulum unfolded protein response in Caenorhabditis elegans
description: >-
  The endoplasmic reticulum unfolded protein response (UPR-ER) matches the
  folding capacity of the ER to the load of client proteins entering it. As in
  other animals, Caenorhabditis elegans senses ER stress through three
  ER-membrane transducers. The kinase-endoribonuclease IRE-1 removes a small
  intron from the xbp-1 mRNA, and the spliced mRNA encodes the bZIP
  transcription factor XBP-1 that induces most stress-inducible UPR genes,
  including the BiP chaperone gene hsp-4. The eIF2alpha kinase PEK-1 (PERK)
  phosphorylates eIF2alpha to attenuate general translation; reduced ternary
  complex favours translation of the uORF-containing atf-4 mRNA, and ATF-4 then
  activates cytoprotective genes. ATF-6 is a membrane-anchored bZIP factor that
  is needed mainly for genes expressed constitutively during development, and
  it also regulates ER calcium buffering. The arms are partly redundant:
  deletion of ire-1 or xbp-1 together with pek-1 or atf-6 causes larval arrest.
  The two ER HSP70 paralogs HSP-4 and HSP-3 are luminal chaperones and UPR
  targets, and in the conserved model BiP binding to the luminal domains of
  the transducers keeps them inactive until misfolded proteins compete it
  away. In C. elegans, XBP-1 made in neurons can also switch on the UPR-ER in
  distant tissues.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:11779465
    title: Complementary signaling pathways regulate the unfolded protein response and are required for C. elegans development.
    statement: >-
      ire-1-mediated xbp-1 splicing is required for UPR transcription, and
      ire-1/xbp-1 acts with pek-1 in complementary pathways essential for
      development.
    supporting_text: >-
      C. elegans requires ire-1-mediated splicing of xbp-1 mRNA for UPR gene
      transcription and survival upon ER stress. In addition, ire-1/xbp-1 acts
      with pek-1, a protein kinase that mediates translation attenuation, in
      complementary pathways that are essential for worm development and
      survival.
  - source_id: PMID:16184190
    title: Genetic interactions due to constitutive and inducible gene regulation mediated by the unfolded protein response in C. elegans.
    statement: >-
      Loss of ire-1 or xbp-1 is synthetically lethal with loss of atf-6 or
      pek-1.
    supporting_text: >-
      deletion of either ire-1 or xbp-1 is synthetically lethal with deletion
      of either atf-6 or pek-1, both producing a developmental arrest at
      larval stage 2.
  - source_id: PMID:16184190
    title: Genetic interactions due to constitutive and inducible gene regulation mediated by the unfolded protein response in C. elegans.
    statement: >-
      The arms act mainly through non-overlapping target sets; atf-6 drives
      constitutive UPR genes and pek-1 about a quarter of inducible ones.
    supporting_text: >-
      As pek-1 and atf-6 mainly act through sets of nonoverlapping targets
      that are different from ire-1 and xbp-1 targets, at least two
      coordinated responses are required to alleviate ER stress by distinct
      mechanisms.
  - source_id: PMID:22125500
    title: Physiological IRE-1-XBP-1 and PEK-1 signaling in Caenorhabditis elegans larval development and immunity.
    statement: The three metazoan UPR-ER arms are mediated by IRE-1, PERK/PEK-1 and ATF-6.
    supporting_text: >-
      Endoplasmic reticulum (ER) stress activates the Unfolded Protein
      Response, a compensatory signaling response that is mediated by the
      IRE-1, PERK/PEK-1, and ATF-6 pathways in metazoans.
  - source_id: PMID:23791175
    title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity.
    statement: Neuronal XBP-1s activates the UPR-ER in distal, non-neuronal tissues.
    supporting_text: >-
      Neuronally derived XBP-1s was sufficient to rescue stress resistance,
      increase longevity, and activate the UPR(ER) in distal, non-neuronal
      cell types through a cell-nonautonomous mechanism.
  - source_id: file:genes/worm/ire-1/ire-1-ai-review.yaml
    title: worm ire-1 gene review
    statement: >-
      Core functions: RNA endonuclease and protein serine/threonine kinase
      activity at the ER membrane in the IRE1-mediated UPR.
  - source_id: file:genes/worm/pek-1/pek-1-ai-review.yaml
    title: worm pek-1 gene review
    statement: "Core function: eukaryotic translation initiation factor 2alpha kinase activity."
notes: >-
  Boundary. This concrete C. elegans module covers the three UPR-ER
  transducer arms (IRE-1/XBP-1, PEK-1/eIF2alpha/ATF-4 and ATF-6) and the ER
  HSP70 chaperones HSP-4 and HSP-3, which are both regulators of the
  transducers in the conserved model and transcriptional outputs. It has four
  parts.

  Integrated stress response. GCN-2 is a second worm eIF2alpha kinase. It is
  activated by amino-acid limitation and by mitochondrial stress
  (PMID:22719267, PMID:23692540), not by ER stress, and is therefore not a
  part of this module; it belongs with the integrated stress response, of
  which the PEK-1 branch is the ER-specific input. ATF-4 is included as the
  output of the PEK-1 branch because ER stress (tunicamycin, DTT) induces
  uORF-dependent atf-4 translation and eIF2alpha phosphorylation in worms
  (PMID:35181679), but the dependence of ATF-4 induction on PEK-1 itself has
  not been shown in C. elegans (see knowledge_gaps). Its process term is
  integrated stress response signaling, following the atf-4 review.

  Left out. eIF2alpha (EIF-2alpha, UniProtKB:Q9BKU3, unreviewed) is the
  PEK-1 substrate and is recorded as a target on the PEK-1 function, not as a
  participant. The Site-2 protease that is proposed to process ATF-6 is not
  modeled (C. elegans has no clear S1P homolog, PMID:16184190). The ABU/PQN
  "activated in blocked UPR" genes (PMID:12186849) are a compensatory
  response in xbp-1 mutants and are not core. The neuronal signal for
  cell-non-autonomous UPR-ER activation (small clear vesicle release,
  PMID:23791175) is inter-tissue regulation and not modeled as a part.
  ERAD and ER-phagy are downstream proteostasis outputs.

  UniProt. Accessions follow the gene reviews (ire-1 Q09499, pek-1 Q19192,
  atf-6 Q20435, hsp-4 P20163, atf-4 Q22156), which differ from some older
  identifiers listed on the project page.

  Related modules. The mitochondrial UPR is MODULE:c_elegans_mitochondrial_upr
  and the HSF-1 cytosolic heat shock response is
  MODULE:c_elegans_heat_shock_response.

  GO-CAM. Production model gomodel:5b528b1100000489 (XBP-1 is a
  cell-nonautonomous regulator of stress resistance and longevity) models
  IRE-1 RNA endonuclease activity causally upstream of XBP-1 DNA binding in
  intestine and neurons; it is linked on the IRE-1 and XBP-1 annotons.
module:
  id: c_elegans_er_unfolded_protein_response
  label: ER unfolded protein response in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Three ER-membrane stress transducers (IRE-1, PEK-1, ATF-6) and the ER
    HSP70 chaperones that restrain them and are induced by them.
  concepts:
    - preferred_term: endoplasmic reticulum unfolded protein response
      term:
        id: GO:0030968
        label: endoplasmic reticulum unfolded protein response
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    conditions:
      - preferred_term: >-
          ER protein-folding stress (tunicamycin, DTT, thapsigargin; also
          physiological load at elevated temperature and during immune
          activation)
  parts:
    - order: 1
      role: IRE-1/XBP-1 splicing arm
      node:
        id: ire1_xbp1_arm
        label: IRE-1 splicing of xbp-1 mRNA and XBP-1 transcription
        module_type: SIGNALING_PATHWAY
        description: >-
          Under ER stress IRE-1 oligomerizes and its cytosolic endoribonuclease
          removes a small intron from xbp-1 mRNA. The spliced mRNA encodes the
          active XBP-1 bZIP factor, which binds promoters including the hsp-4
          locus and drives most inducible UPR genes.
        concepts:
          - preferred_term: IRE1-mediated unfolded protein response
            term:
              id: GO:0036498
              label: IRE1-mediated unfolded protein response
        annotons:
          - id: ire1_endoribonuclease
            label: IRE-1 xbp-1 mRNA endoribonuclease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IRE-1
                term:
                  id: UniProtKB:Q09499
                  label: Serine/threonine-protein kinase/endoribonuclease ire-1
            function:
              preferred_term: RNA endonuclease activity
              term:
                id: GO:0004521
                label: RNA endonuclease activity
              description: >-
                The kinase domain (GO:0004674, also a core function in the
                ire-1 review) acts in trans-autophosphorylation that licenses
                the RNase; only the RNase output is modeled as the signaling
                step.
              substrates:
                - preferred_term: unspliced xbp-1 mRNA
              products:
                - preferred_term: spliced xbp-1 mRNA (xbp-1s)
            processes:
              - preferred_term: IRE1-mediated unfolded protein response
                term:
                  id: GO:0036498
                  label: IRE1-mediated unfolded protein response
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              ER-luminal stress sensor whose RNase output is the
              unconventional splicing of xbp-1 mRNA.
            evidence:
              - source_id: PMID:11780124
                title: IRE1 couples endoplasmic reticulum load to secretory capacity by processing the XBP-1 mRNA.
                statement: UPR activation causes IRE1-dependent removal of a small intron from xbp-1 mRNA in C. elegans.
                supporting_text: >-
                  Activation of the UPR causes IRE1-dependent splicing of a
                  small intron from the XBP-1 mRNA both in C. elegans and mice.
              - source_id: PMID:11780124
                title: IRE1 couples endoplasmic reticulum load to secretory capacity by processing the XBP-1 mRNA.
                statement: Mutation of ire-1 or xbp-1 abolishes the worm UPR.
                supporting_text: >-
                  mutations in either ire-1 or the
                  transcription-factor-encoding xbp-1 gene abolished the UPR in
                  Caenorhabditis elegans.
            gocam_associations:
              - model: gomodel:5b528b1100000489
                activity: gomodel:5b528b1100000489/5b528b1100000541
                title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity
          - id: xbp1_transcription_factor
            label: XBP-1s bZIP transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: XBP-1
                term:
                  id: UniProtKB:G5EE07
                  label: X-box-binding protein 1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              targets:
                - preferred_term: hsp-4 and other inducible UPR gene promoters
            processes:
              - preferred_term: IRE1-mediated unfolded protein response
                term:
                  id: GO:0036498
                  label: IRE1-mediated unfolded protein response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Transcription factor encoded by the spliced xbp-1 mRNA; the main
              transcriptional effector of the worm UPR-ER.
            evidence:
              - source_id: PMID:24068940
                title: Integration of the unfolded protein and oxidative stress responses through SKN-1/Nrf.
                statement: ER stress induces XBP-1 (and ATF-6) to bind target promoters directly.
                supporting_text: >-
                  We also found that ER stress induces SKN-1, XBP-1, and ATF-6
                  to bind promoters directly to regulate many of the same
                  genes, including skn-1 itself
              - source_id: PMID:24068940
                title: Integration of the unfolded protein and oxidative stress responses through SKN-1/Nrf.
                statement: XBP-1 binds the hsp-4 locus by ChIP.
                supporting_text: >-
                  our ChIP evidence indicated that both SKN-1 and XBP-1 bind
                  directly to the hsp-4 locus
            gocam_associations:
              - model: gomodel:5b528b1100000489
                activity: gomodel:5b528b1100000489/5b528b1100000547
                title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity
        connections:
          - source: ire1_endoribonuclease
            target: xbp1_transcription_factor
            connection_type: POSITIVELY_REGULATES
            description: IRE-1 splices xbp-1 mRNA, allowing synthesis of active XBP-1.
    - order: 2
      role: PEK-1/eIF2alpha translational arm with ATF-4 output
      node:
        id: pek1_arm
        label: PEK-1 eIF2alpha phosphorylation and ATF-4
        module_type: SIGNALING_PATHWAY
        description: >-
          PEK-1 phosphorylates eIF2alpha on ER stress, attenuating global
          translation and reducing client load on the ER. It is required for
          about a quarter of inducible UPR genes but not for constitutive UPR
          genes. eIF2alpha phosphorylation favours translation of atf-4,
          whose two 5' UTR uORFs make it a translational-control reporter;
          ATF-4 then activates chaperone and cytoprotective genes.
        concepts:
          - preferred_term: PERK-mediated unfolded protein response
            term:
              id: GO:0036499
              label: PERK-mediated unfolded protein response
        annotons:
          - id: pek1_eif2a_kinase
            label: PEK-1 eIF2alpha kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PEK-1
                term:
                  id: UniProtKB:Q19192
                  label: Eukaryotic translation initiation factor 2-alpha kinase pek-1
            function:
              preferred_term: eukaryotic translation initiation factor 2alpha kinase activity
              term:
                id: GO:0004694
                label: eukaryotic translation initiation factor 2alpha kinase activity
              targets:
                - preferred_term: eIF2alpha (EIF-2alpha, UniProtKB:Q9BKU3)
            processes:
              - preferred_term: PERK-mediated unfolded protein response
                term:
                  id: GO:0036499
                  label: PERK-mediated unfolded protein response
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              ER-luminal stress sensor that attenuates translation by
              phosphorylating eIF2alpha.
            evidence:
              - source_id: PMID:22125500
                title: Physiological IRE-1-XBP-1 and PEK-1 signaling in Caenorhabditis elegans larval development and immunity.
                statement: Tunicamycin induces PEK-1-dependent eIF2alpha phosphorylation in worms.
                supporting_text: >-
                  We observed that eIF-2α phosphorylation was induced by a 4 h
                  exposure to a high dose of tunicamycin in a PEK-1-dependent
                  manner
              - source_id: PMID:10677345
                title: Pancreatic eukaryotic initiation factor-2alpha kinase (PEK) homologues in humans, Drosophila melanogaster and Caenorhabditis elegans that mediate translational control in response to endoplasmic reticulum stress.
                statement: Worm PEK hyperphosphorylates eIF2alpha when expressed in yeast.
                supporting_text: >-
                  To address the role of C. elegans PEK in translational
                  control, we expressed this kinase in yeast and found that it
                  inhibits growth by hyperphosphorylation of eIF-2alpha and
                  inhibition of eIF-2B.
          - id: atf4_transcription_factor
            label: ATF-4 translationally induced bZIP activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATF-4
                term:
                  id: UniProtKB:Q22156
                  label: Transcription factor atf-4 homolog
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
