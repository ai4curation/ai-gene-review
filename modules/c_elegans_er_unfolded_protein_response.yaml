        id: atf6_arm
        label: ATF-6 arm
        module_type: SIGNALING_PATHWAY
        description: >-
          ATF-6 is an ER-membrane bZIP factor that, in the conserved model, is
          released by intramembrane proteolysis and enters the nucleus. In
          worms it regulates few inducible UPR genes but many constitutive UPR
          genes, binds promoters directly under ER stress, and controls ER
          calcium buffering through calreticulin.
        concepts:
