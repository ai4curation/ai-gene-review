id: MODULE:pyrenoid_ccm
title: Pyrenoid-based CO2-concentrating mechanism
description: >-
  The pyrenoid-based CO2-concentrating mechanism (PCCM) of green algae, modeled
  on Chlamydomonas reinhardtii. Rubisco is condensed by a multivalent linker
  protein into a liquid-like matrix (the pyrenoid) inside the chloroplast
  stroma. Thylakoid membrane tubules traverse the matrix. Bicarbonate
  accumulated in the stroma enters the thylakoid lumen through bestrophin-like
  channels and is dehydrated to CO2 by a lumenal carbonic anhydrase within the
  tubules, releasing CO2 into the Rubisco matrix. A starch sheath around the
  matrix limits CO2 back-diffusion, and a stromal LCIB/LCIC carbonic anhydrase
  complex at the pyrenoid periphery recaptures escaping CO2 as bicarbonate.
  The parts follow the six-step minimal-PCCM decomposition used in modeling and
  in plans to engineer a pyrenoid into C3 plant chloroplasts. Bicarbonate uptake
  across the plasma membrane and chloroplast envelope, and transcriptional
  induction under low CO2, are included as optional upstream parts.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:1990732
    title: pyrenoid
    statement: >-
      Defines the Rubisco-containing, non-membrane-bounded chloroplast organelle
      that is the site of this CO2-concentrating mechanism.
  - source_id: PMID:35596080
    title: >-
      Modelling the pyrenoid-based CO(2)-concentrating mechanism provides
      insights into its operating principles and a roadmap for its engineering
      into crops.
    statement: >-
      Reaction-diffusion model of the Chlamydomonas PCCM that recapitulates
      PCCM-deficient mutant phenotypes and defines the minimal component set
      (Rubisco condensate, lumenal CA, thylakoid bicarbonate channels, diffusion
      barrier, stromal CA) that this module's parts follow.
  - source_id: PMID:35961043
    title: New horizons for building pyrenoid-based CO2-concentrating mechanisms in plants to improve yields.
    statement: >-
      Review (Adler et al. 2022) setting out a stepwise strategy for
      reconstituting a minimal PCCM in C3 plant chloroplasts, including the
      need for a diffusional barrier around the pyrenoid matrix.
  - source_id: PMID:40794800
    title: >-
      A pyrenoid-based CO2-concentrating mechanism can be effective and
      efficient even under scenarios of high membrane CO2 permeability.
    statement: >-
      Updated modeling arguing that a PCCM can operate efficiently even with
      high CO2 membrane permeability, supporting the feasibility of the
      engineering roadmap.
  - source_id: PMID:33421532
    title: "Pyrenoids: CO(2)-fixing phase separated liquid organelles."
    statement: Review of pyrenoid structure, phase separation, and CCM function.
  - source_id: PMID:28938113
    title: >-
      A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    statement: >-
      Systematic localization and affinity-purification map of Chlamydomonas
      CCM proteins, used to assign participants to pyrenoid subcompartments.
  - source_id: PMID:41529212
    title: >-
      Pyrenoid Structure, Function, Evolution, and Characterization Across
      Diverse Lineages.
    statement: >-
      Review of pyrenoid diversity across algal lineages; supports scoping this
      module to the Chlamydomonas instance rather than claiming a universal
      molecular parts list.
notes: >-
  Scope is deliberately CONCRETE (Chlamydomonas reinhardtii). Pyrenoids arose
  several times independently across algal lineages and hornworts, and the
  linker, tether, and channel proteins are not conserved across them; a
  reusable abstract PCCM module should be derived from this one only after
  diatom and hornwort instances are curated. Q94ET8 is EPYC1: it is the same
  gene as LCI5 (Cre10.g436550; "EPYC1; also known as LCI5", PMID:28938114),
  reviewed under genes/CHLRE/LCI5. RBMP1 (A0A2K3DMS8) is the same gene as
  BST4 (PMID:39240724). Every UniProt participant has a gene review under
  genes/CHLRE/. The family node for the oxygenic photosynthesis module
  (`modules/photosynthesis.yaml`, variant `pyrenoid_ccm`) should point here once
  this module matures.
module:
  id: pyrenoid_ccm
  label: Pyrenoid-based CO2-concentrating mechanism
  module_type: BIOLOGICAL_PROCESS
  description: >-
    A biophysical CO2-concentrating mechanism in which bicarbonate is converted
    to CO2 inside a phase-separated Rubisco condensate, raising the CO2
    concentration at Rubisco and suppressing its oxygenase reaction.
  concepts:
    - preferred_term: pyrenoid-based CO2-concentrating mechanism
      description: >-
        No GO biological-process term exists for an inorganic carbon-concentrating
        mechanism; the process is described here and its location is grounded on
        the pyrenoid cellular-component term.
    - preferred_term: pyrenoid
      term:
        id: GO:1990732
        label: pyrenoid
      description: >-
        Liquid-like Rubisco condensate in the chloroplast stroma that is
        traversed by thylakoid tubules and surrounded by a starch sheath.
  context:
    taxa:
      - preferred_term: Chlamydomonas reinhardtii
        term:
          id: NCBITaxon:3055
          label: Chlamydomonas reinhardtii
    conditions:
      - preferred_term: limiting CO2 (air-level or lower inorganic carbon)
  parts:
    - order: 1
      role: Rubisco condensation into the pyrenoid matrix
      node:
        id: rubisco_condensate
        label: Rubisco condensate (pyrenoid matrix)
        module_type: CELLULAR_COMPONENT
        description: >-
          Rubisco and the intrinsically disordered linker EPYC1 are necessary
          and sufficient to phase separate into a liquid-like matrix. EPYC1
          repeats bind the two surface alpha-helices of the Rubisco small
          subunit.
        evidence:
          - source_id: PMID:27166422
            title: >-
              A repeat protein links Rubisco to form the eukaryotic
              carbon-concentrating organelle.
            statement: >-
              Identifies EPYC1 as a Rubisco-binding repeat protein required for
              normal pyrenoid formation and CCM function.
          - source_id: PMID:28938114
            title: >-
              The Eukaryotic CO(2)-Concentrating Organelle Is Liquid-like and
              Exhibits Dynamic Reorganization.
            statement: Shows that the pyrenoid matrix behaves as a liquid-like phase.
          - source_id: PMID:30498228
            title: The phase separation underlying the pyrenoid-based microalgal Rubisco supercharger.
            statement: >-
              Rubisco and EPYC1 are necessary and sufficient to phase separate
              in vitro, and the condensed Rubisco is functional.
          - source_id: PMID:23112177
            title: Rubisco small-subunit α-helices control pyrenoid formation in Chlamydomonas.
            statement: >-
              Two surface-exposed small-subunit alpha-helices determine pyrenoid
              formation; plant-like helices abolish the pyrenoid and the CCM.
          - source_id: PMID:33230314
            title: The structural basis of Rubisco phase separation in the pyrenoid.
            statement: Structural basis of EPYC1 binding to the Rubisco small subunit.
          - source_id: PMID:33298923
            title: Condensation of Rubisco into a proto-pyrenoid in higher plant chloroplasts.
            statement: >-
              EPYC1 plus a plant-algal hybrid Rubisco forms a single liquid-like
              condensate in Arabidopsis chloroplasts, completing engineering
              step 1 in a plant.
        annotons:
          - id: rubisco_carboxylation
            label: Rubisco carboxylation in the pyrenoid matrix
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: chloroplast Rubisco holoenzyme (L8S8)
                term:
                  id: GO:0009573
                  label: chloroplast ribulose bisphosphate carboxylase complex
                active_units:
                  - id: rubisco_large_subunit
                    label: Rubisco large subunit
                    role: Carries the carboxylase active site.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Chlamydomonas rbcL
                        term:
                          id: UniProtKB:P00877
                          label: Ribulose bisphosphate carboxylase large chain
                      required_function:
                        preferred_term: ribulose-bisphosphate carboxylase activity
                        term:
                          id: GO:0016984
                          label: ribulose-bisphosphate carboxylase activity
                  - id: rubisco_small_subunit
                    label: Rubisco small subunit
                    role: >-
                      Presents the two surface alpha-helices bound by the EPYC1
                      linker; these helices determine whether a pyrenoid forms.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Chlamydomonas RBCS1
                        term:
                          id: UniProtKB:P00873
                          label: Ribulose bisphosphate carboxylase small subunit, chloroplastic 1
            function:
              preferred_term: ribulose-bisphosphate carboxylase activity
              term:
                id: GO:0016984
                label: ribulose-bisphosphate carboxylase activity
              substrates:
                - preferred_term: CO2
                - preferred_term: D-ribulose 1,5-bisphosphate
              products:
                - preferred_term: 3-phospho-D-glycerate
            processes:
              - preferred_term: reductive pentose-phosphate cycle
                term:
                  id: GO:0019253
                  label: reductive pentose-phosphate cycle
            locations:
              - preferred_term: pyrenoid
                term:
                  id: GO:1990732
                  label: pyrenoid
            role_description: >-
              The CO2-fixing enzyme whose condensation into the matrix is what
              the CCM concentrates CO2 around.
          - id: epyc1_linker
            label: EPYC1 multivalent Rubisco linker
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Chlamydomonas EPYC1 (also known as LCI5)
                term:
                  id: UniProtKB:Q94ET8
                  label: LCI5
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
            locations:
              - preferred_term: pyrenoid
                term:
                  id: GO:1990732
                  label: pyrenoid
            role_description: >-
              Intrinsically disordered protein with repeated Rubisco-binding
              regions that cross-links Rubisco holoenzymes to drive phase
              separation of the matrix.
    - order: 2
      role: Thylakoid tubule association with the condensate
      node:
        id: tubule_matrix_tethering
        label: Pyrenoid tubule biogenesis and matrix tethering
        module_type: CELLULAR_COMPONENT
        description: >-
          Thylakoid membranes enter the matrix as pyrenoid tubules. SAGA1
          initiates tubule formation where thylakoids transition into tubules,
          and its homolog MITH1 extends the tubules through the matrix. Proteins
          carrying the Rubisco-binding motif (RBM) were proposed to hold the
          tubules and matrix together, but the best-tested tubule RBM protein,
          BST4 (also called RBMP1), is not needed for tubule-matrix contact; it
          is a tubule-resident bestrophin-family channel targeted there by its
          RBMs. What tethers the tubules to the matrix remains open (RBMP2 and
          redundancy are untested).
        evidence:
          - source_id: PMID:33177094
            title: >-
              Assembly of the algal CO(2)-fixing organelle, the pyrenoid, is
              guided by a Rubisco-binding motif.
            statement: >-
              A shared Rubisco-binding motif targets proteins to the pyrenoid
              and is found on tubule proteins (RBMP1, RBMP2) and on
              matrix-starch interface proteins (SAGA1, SAGA2).
          - source_id: PMID:39211136
            title: >-
              Biogenesis, engineering and function of membranes in the CO (2)
              -fixing pyrenoid.
            statement: >-
              SAGA1 and MITH1 mediate pyrenoid tubule biogenesis and are
              sufficient to reconstitute pyrenoid-traversing membranes in
              Arabidopsis; tubule-deficient mutants grow poorly at limiting CO2.
          - source_id: PMID:39548241
            title: SAGA1 and MITH1 produce matrix-traversing membranes in the CO(2)-fixing pyrenoid.
            statement: >-
              Peer-reviewed version of the SAGA1/MITH1 tubule biogenesis work;
              SAGA1-Venus lines the matrix-traversing membranes.
          - source_id: PMID:39240724
            title: >-
              Bestrophin-like protein 4 is involved in photosynthetic
              acclimation to light fluctuations in Chlamydomonas.
            statement: >-
              BST4 (RBMP1) is a pentameric bestrophin-like channel in the
              pyrenoid tubules; bst4 mutants still form tubules in contact with
              the matrix, so BST4 is not required for matrix tethering.
        annotons:
          - id: rbmp1_tubule_tether
            label: BST4/RBMP1 tubule-resident bestrophin-family channel
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Chlamydomonas BST4 / RBMP1 (Cre06.g261750)
                term:
                  id: UniProtKB:A0A2K3DMS8
                  label: Uncharacterized protein
            function:
              preferred_term: monoatomic ion channel activity
              term:
                id: GO:0005216
                label: monoatomic ion channel activity
              description: >-
                Bestrophin-family pentameric channel; the permeant ion is
                unknown (no chloride or bicarbonate currents in Xenopus
                oocytes). Its stroma-facing RBMs bind the Rubisco small subunit
                and target it to the tubules.
            locations:
              - preferred_term: pyrenoid tubule
                term:
                  id: GO:0160223
                  label: pyrenoid tubule
            role_description: >-
              Marks the pyrenoid tubule membrane and is proposed to help balance
              lumen ion or pH homeostasis during light changes. It was a
              candidate tubule-matrix tether, but that role was not supported.
          - id: saga1_tubule_initiation
            label: SAGA1 tubule initiation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Chlamydomonas SAGA1 (Cre11.g467712)
                term:
                  id: UniProtKB:A0A2K3D7T6
                  label: CBM20 domain-containing protein
            function:
              preferred_term: protein-membrane adaptor activity
              term:
                id: GO:0043495
                label: protein-membrane adaptor activity
              description: >-
                Tentative. SAGA1 binds Rubisco through its RBMs and co-pellets
                with membranes, and is proposed to supply the membrane-matrix
                bond; how it attaches to membranes is unknown (it has no
                transmembrane segment).
            processes:
              - preferred_term: thylakoid membrane organization
                term:
                  id: GO:0010027
                  label: thylakoid membrane organization
            locations:
              - preferred_term: pyrenoid tubule
                term:
                  id: GO:0160223
                  label: pyrenoid tubule
            role_description: >-
              Localizes where thylakoids transition into tubules and is
              necessary to initiate tubule formation; with MITH1 it is
              sufficient to draw thylakoids into a Rubisco condensate in
              Arabidopsis.
    - order: 3
      role: Lumenal carbonic anhydrase in the pyrenoid tubules
      node:
        id: lumenal_co2_release
        label: Lumenal bicarbonate dehydration (CAH3)
        module_type: REACTION
        description: >-
          In the acidic thylakoid lumen of the tubules, CAH3 dehydrates
          bicarbonate to CO2, which diffuses into the surrounding Rubisco matrix.
          Under limiting CO2, CAH3 is phosphorylated and activated, and its
          share in the pyrenoid tubules is reported to rise (from about 19% to
          37% of the total); a 2026 preprint instead finds it concentrated in
          the central tubules at both high and low CO2.
        evidence:
          - source_id: PMID:9482718
            title: >-
              A novel alpha-type carbonic anhydrase associated with the
              thylakoid membrane in Chlamydomonas reinhardtii is required for
              growth at ambient CO2.
            statement: >-
              CAH3 is a lumenal alpha-type carbonic anhydrase; complementation of
              the cia-3 mutant with cah3 restores growth at air CO2.
          - source_id: PMID:23139834
            title: >-
              Phosphorylation controls the localization and activation of the
              lumenal carbonic anhydrase in Chlamydomonas reinhardtii.
            statement: >-
              After transfer to low CO2, CAH3 is phosphorylated and this
              correlates with partial relocalization to the pyrenoid and a 5-6
              fold activity increase.
        annotons:
          - id: cah3_lumenal_ca
            label: CAH3 lumenal carbonic anhydrase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Chlamydomonas CAH3
                term:
                  id: UniProtKB:Q39588
                  label: Carbonic anhydrase
            function:
              preferred_term: carbonate dehydratase activity
              term:
                id: GO:0004089
                label: carbonate dehydratase activity
              substrates:
                - preferred_term: bicarbonate
              products:
                - preferred_term: CO2
                - preferred_term: water
            locations:
              - preferred_term: chloroplast thylakoid lumen
                term:
                  id: GO:0009543
                  label: chloroplast thylakoid lumen
              - preferred_term: pyrenoid tubule
                term:
                  id: GO:0160223
                  label: pyrenoid tubule
            role_description: >-
              Converts lumenal bicarbonate to CO2 inside the tubules so that CO2
              is released directly into the Rubisco matrix.
    - order: 4
      role: Bicarbonate channels in the thylakoid membrane
      node:
        id: thylakoid_bicarbonate_entry
        label: Thylakoid bicarbonate entry (bestrophin-like channels)
        module_type: TRANSPORT_STEP
        description: >-
          Three bestrophin-like paralogs (BST1-3), induced at low CO2 under
          CIA5 control and located on the thylakoid membrane, are proposed to
          move stromal bicarbonate into the lumen. No transport has been
          measured for BST1-3: the evidence is localization, CIA5-dependent
          induction, knockdown physiology and homology to bestrophin anion
          channels. GO:0160133 bicarbonate channel activity would be the precise
          term once conductance is shown.
        evidence:
          - source_id: PMID:31391312
            title: >-
              Thylakoid localized bestrophin-like proteins are essential for the
              CO(2) concentrating mechanism of Chlamydomonas reinhardtii.
            statement: >-
              BST1-3 localize to the thylakoid membrane, are CIA5-dependent and
              low-CO2-induced, and their knockdown impairs Ci uptake and growth
              at limiting CO2.
        annotons:
          - id: bst_thylakoid_channel
            label: Bestrophin-like thylakoid bicarbonate channel
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Chlamydomonas thylakoid bestrophin-like proteins BST1-3
                representative_members:
                  - preferred_term: BST1 (Chlamydomonas reinhardtii; Cre16.g662600)
                    term:
                      id: UniProtKB:A0A2K3CTN0
                      label: Uncharacterized protein
                  - preferred_term: BST2 (Chlamydomonas reinhardtii; Cre16.g663400)
                    term:
                      id: UniProtKB:A0A2K3CTQ2
                      label: Uncharacterized protein
                  - preferred_term: BST3 / LCI11 (Chlamydomonas reinhardtii; Cre16.g663450)
                    term:
                      id: UniProtKB:A0A2K3CTP3
                      label: Uncharacterized protein
            function:
              preferred_term: monoatomic anion channel activity
              term:
                id: GO:0005253
                label: monoatomic anion channel activity
              description: >-
                Family-level inference from the bestrophin channel fold.
                Bicarbonate is the proposed permeant anion but has not been
                tested.
            locations:
              - preferred_term: chloroplast thylakoid membrane
                term:
                  id: GO:0009535
                  label: chloroplast thylakoid membrane
            role_description: >-
              Supplies the lumenal bicarbonate that CAH3 dehydrates.
    - order: 5
      role: Starch sheath diffusion barrier
      node:
        id: starch_sheath_barrier
        label: Starch sheath around the matrix
        module_type: CELLULAR_COMPONENT
        description: >-
          Plates of starch around the matrix are proposed to slow CO2 leakage.
          SAGA1, which has a starch-binding CBM20 domain and Rubisco-binding
          motifs, links the matrix to the sheath and controls sheath morphology
          and pyrenoid number. Modeling predicts that some diffusion barrier is
          needed for an efficient PCCM. Whether starch itself is the main
          barrier is not settled.
        evidence:
          - source_id: PMID:31455733
            title: >-
              A Rubisco-binding protein is required for normal pyrenoid number
              and starch sheath morphology in Chlamydomonas reinhardtii.
            statement: >-
              saga1 mutants have multiple pyrenoids with abnormal starch sheaths
              and are impaired in CCM function.
          - source_id: PMID:42090253
            title: SAGA1 and SAGA2 localize the starch sheath to the pyrenoid in Chlamydomonas reinhardtii.
            statement: >-
              The SAGA1 CBM20 domain binds starch granules in vitro, supporting
              SAGA1 and SAGA2 as the links that place the starch sheath around
              the matrix.
          - source_id: PMID:35596080
            title: >-
              Modelling the pyrenoid-based CO(2)-concentrating mechanism
              provides insights into its operating principles and a roadmap for
              its engineering into crops.
            statement: >-
              Model predicts that a barrier to CO2 diffusion out of the matrix
              is needed for effective and energetically efficient operation.
        annotons:
          - id: saga1_matrix_starch_linker
            label: SAGA1 matrix-starch sheath linker
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Chlamydomonas SAGA1 (Cre11.g467712)
                term:
                  id: UniProtKB:A0A2K3D7T6
                  label: CBM20 domain-containing protein
            function:
              preferred_term: starch binding
              term:
                id: GO:2001070
                label: starch binding
              description: >-
                A purified tandem SAGA1 CBM20 construct binds starch granules,
                competed by beta-cyclodextrin and maltoheptaose (PMID:42090253);
                binding by the full-length protein has not been tested.
            locations:
              - preferred_term: pyrenoid
                term:
                  id: GO:1990732
                  label: pyrenoid
            role_description: >-
              Bridges the Rubisco matrix to the starch sheath through
              Rubisco-binding motifs and a CBM20 domain.
    - order: 6
      role: Stromal CO2 recapture by carbonic anhydrase
      node:
        id: stromal_co2_recapture
        label: LCIB/LCIC CO2 recapture at the pyrenoid periphery
        module_type: REACTION
        description: >-
          The LCIB/LCIC complex, members of a distinct beta-carbonic anhydrase
          group, gathers around the pyrenoid under limiting CO2. Purified
          Chlamydomonas LCIB, LCIC and the LCIB/LCIC complex were inactive in
          vitro; CA activity of LCIB rests on rescue of CA-deficient yeast and
          Arabidopsis mutants and on its beta-CA zinc site. It is proposed to
          hydrate CO2 leaking from the matrix, and CO2 entering the chloroplast,
          to bicarbonate that is then trapped in the stroma.
        evidence:
          - source_id: PMID:20660228
            title: >-
              Light and low-CO2-dependent LCIB-LCIC complex localization in the
              chloroplast supports the carbon-concentrating mechanism in
              Chlamydomonas reinhardtii.
            statement: >-
              LCIB interacts with LCIC and the complex co-localizes in the
              vicinity of the pyrenoid under low CO2 in the light.
          - source_id: PMID:27911826
            title: >-
              Structural insights into the LCIB protein family reveals a new
              group of β-carbonic anhydrases.
            statement: >-
              Crystal structures of Chlamydomonas LCIB and LCIC show beta-CA-like
              active sites. The CA-active homologs were from a diatom and a
              bacterium; the purified Chlamydomonas proteins were inactive.
          - source_id: PMID:24307449
            title: LCIB in the Chlamydomonas CO2-concentrating mechanism.
            statement: Review of genetic evidence that LCIB is required for CCM function.
        annotons:
          - id: lcib_lcic_ca
            label: LCIB/LCIC stromal carbonic anhydrase complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: LCIB/LCIC complex
                active_units:
                  - id: lcib_subunit
                    label: LCIB
                    role: >-
                      Beta-CA subunit required for CCM function; carries the
                      carbonic anhydrase activity shown by heterologous rescue.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Chlamydomonas LCIB
                        term:
                          id: UniProtKB:Q75NZ2
                          label: Low-CO2 inducible protein LCIB
                      required_function:
                        preferred_term: carbonate dehydratase activity
                        term:
                          id: GO:0004089
                          label: carbonate dehydratase activity
                  - id: lcic_subunit
                    label: LCIC
                    role: >-
                      LCIB paralog that forms the hetero-oligomeric complex and
                      binds zinc; no CA activity has been shown for LCIC.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Chlamydomonas LCIC
                        term:
                          id: UniProtKB:Q75NZ1
                          label: Low-CO2 inducible protein LCIC
            function:
              preferred_term: carbonate dehydratase activity
              term:
                id: GO:0004089
                label: carbonate dehydratase activity
              description: >-
                In this step the physiological direction is CO2 hydration to
                bicarbonate. CA activity of the Chlamydomonas complex itself
                has not been robustly measured in vitro.
              substrates:
                - preferred_term: CO2
                - preferred_term: water
              products:
                - preferred_term: bicarbonate
            locations:
              - preferred_term: chloroplast stroma
                term:
                  id: GO:0009570
                  label: chloroplast stroma
            role_description: >-
              Traps CO2 that escapes the matrix as bicarbonate, returning it to
              the thylakoid route.
    - order: 7
      role: Bicarbonate uptake into the chloroplast (upstream supply)
      optional: true
      node:
        id: ci_uptake
        label: Plasma membrane and chloroplast envelope bicarbonate uptake
        module_type: TRANSPORT_STEP
        description: >-
          At very low CO2, HLA3 at the plasma membrane and LCIA at the
          chloroplast envelope raise bicarbonate supply to the stroma. This is
          part of the full algal CCM but outside the minimal PCCM proposed for
          plants, where stromal bicarbonate is supplied by native stromal CA.
        evidence:
          - source_id: PMID:19321421
            title: >-
              Knockdown of limiting-CO2-induced gene HLA3 decreases HCO3-
              transport and photosynthetic Ci affinity in Chlamydomonas
              reinhardtii.
            statement: >-
              HLA3 knockdown combined with LCIA or LCIB loss sharply reduces Ci
              uptake and photosynthetic Ci affinity at very low CO2.
          - source_id: PMID:26538195
            title: >-
