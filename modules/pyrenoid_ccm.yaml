  connections:
    - source: ci_uptake
      target: thylakoid_bicarbonate_entry
      connection_type: PROVIDES_INPUT_FOR
      description: Stromal bicarbonate imported by HLA3 and LCIA is the substrate moved into the lumen.
    - source: stromal_co2_recapture
      target: thylakoid_bicarbonate_entry
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Bicarbonate formed by LCIB/LCIC from leaked or incoming CO2 joins the
        stromal pool that enters the thylakoid lumen.
    - source: thylakoid_bicarbonate_entry
      target: lumenal_co2_release
      connection_type: PROVIDES_INPUT_FOR
      description: Lumenal bicarbonate is the substrate for CAH3.
    - source: lumenal_co2_release
      target: rubisco_carboxylation
      connection_type: PROVIDES_INPUT_FOR
      description: CO2 released in the tubules diffuses into the Rubisco matrix.
    - source: tubule_matrix_tethering
      target: lumenal_co2_release
      connection_type: POSITIVELY_REGULATES
      description: >-
        Tubules that traverse the matrix place CAH3-generated CO2 at the
        Rubisco condensate; without tubules the matrix forms aberrant
        condensates and growth at limiting CO2 is impaired.
    - source: starch_sheath_barrier
      target: rubisco_carboxylation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Slowing CO2 escape from the matrix raises the CO2 concentration at
        Rubisco.
    - source: ccm_induction
      target: thylakoid_bicarbonate_entry
      connection_type: POSITIVELY_REGULATES
      description: CIA5 is required for low-CO2 induction of BST1-3.
  knowledge_gaps:
    - gap_statement: >-
        No plant Rubisco has been shown to bind an EPYC1-like linker without
        replacing its small-subunit helices with algal ones; whether a linker
        can be engineered to condense native crop Rubisco is unknown.
      boundary: Step 1 (Rubisco condensation) as it would work in crop chloroplasts.
      gap_kind: [BIOLOGY]
      status: OPEN
    - gap_statement: >-
        How thylakoid tubules that traverse the pyrenoid form in plants, and
        what they do beyond carrying CAH3, is only beginning to be tested
        (SAGA1/MITH1 reconstitution).
      boundary: Step 2 (thylakoid association with the condensate).
      gap_kind: [BIOLOGY]
      status: NARROWING
    - gap_statement: >-
        How CAH3 moves to the pyrenoid tubules under limiting CO2 is unknown
        beyond its correlation with phosphorylation.
      boundary: Step 3 (lumenal carbonic anhydrase).
      gap_kind: [BIOLOGY]
      status: OPEN
    - gap_statement: >-
        No thylakoid bicarbonate conductance has been measured directly for
        BST1-3; their transport activity is inferred.
      boundary: Step 4 (thylakoid bicarbonate channels).
      gap_kind: [BIOLOGY]
      dark_aspect: MF_DARK
      status: OPEN
    - gap_statement: >-
        What regulates the formation and turnover of the starch sheath, and
        whether a sheath would clash with or fit into plant starch metabolism,
        is unknown.
      boundary: Step 5 (diffusion barrier).
      gap_kind: [BIOLOGY]
      status: OPEN
    - gap_statement: >-
        Whether native stromal carbonic anhydrase activity in plant chloroplasts
        is enough to drive a PCCM, and whether normal thylakoid ATP output and
        proton-motive force can power it, has not been tested.
      boundary: Step 6 (stromal CO2 recapture) and energization of the whole module.
      gap_kind: [BIOLOGY]
      status: OPEN
    - gap_statement: >-
        GO has no biological-process term for an inorganic carbon-concentrating
        mechanism (pyrenoid-based, carboxysome-based, or C4), so the module
        process cannot be grounded on an ontology id.
      boundary: Module-level process concept.
      gap_kind: [ONTOLOGY]
      status: OPEN
