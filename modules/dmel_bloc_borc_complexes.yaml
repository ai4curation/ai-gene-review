id: MODULE:dmel_bloc_borc_complexes
title: BLOC and BORC complexes in Drosophila melanogaster
description: >-
  The biogenesis of lysosome-related organelles complexes BLOC-1, BLOC-2 and BLOC-3 are needed
  to form lysosome-related organelles such as melanosomes in mammals and pigment granules
  in Drosophila eyes. BLOC-1 is an eight-subunit complex of small coiled-coil proteins (including
  dysbindin, pallidin, muted and snapin) that cooperates with endosomal sorting to deliver
  cargo to these organelles. BLOC-2 contains the HPS3, HPS5 and HPS6 subunits in mammals;
  the Drosophila HPS5 homolog is pink (p). BLOC-3, a heterodimer of HPS1 and HPS4, is a guanine
  nucleotide exchange factor for Rab32 and Rab38 in mammals. BORC is a related complex that
  shares Blos1, Blos2 and Snapin with BLOC-1 and adds BORCS5, BORCS6, BORCS7, BORCS8 and KXD1
  subunits; it recruits Arl8 to lysosomes and controls their positioning.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000163
  title: 'FlyBase gene group BLOC: Biogenesis of lysosome-related organelles complexes'
  statement: >-
    FlyBase release FB2026_03 groups 12 D. melanogaster genes as biogenesis of lysosome-related
    organelles complexes (BLOC); this module models that group.
- source_id: FB:FBgg0001619
  title: 'FlyBase gene group BORC: Bloc1-related complex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as bloc1-related complex (BORC);
    this module models that group.
- source_id: GO:0031083
  title: BLOC-1 complex
  statement: >-
    GO term grounding the module as BLOC-1 complex.
- source_id: GO:0031084
  title: BLOC-2 complex
  statement: >-
    GO term grounding the module as BLOC-2 complex.
- source_id: GO:0031085
  title: BLOC-3 complex
  statement: >-
