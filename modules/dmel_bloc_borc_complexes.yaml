notes: >-
  Decomposition. Each complex is one part. Blos1, Blos2 and Snapin are shared by BLOC-1 and
  BORC and appear in both parts. FlyBase places CG14562 in BLOC-2 without a clear mammalian
  ortholog name; it is kept as listed. The Rab32/Rab38 exchange activity of BLOC-3 is established
  in mammals and is not asserted here for Drosophila. FlyBase groups realized by this module:
  BLOC (FBgg0000163), BORC (FBgg0001619). Subgroups folded into it: BLOC2, BLOC1, BLOC3. Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_bloc_borc_complexes.yaml; none of the member genes has a gene review
  yet unless noted.
