id: MODULE:methionine_biosynthesis
title: L-methionine biosynthesis
description: >-
  De novo biosynthesis of L-methionine, modelled as a species-agnostic pathway
  template with alternative routes at every step, so the same logic can be evaluated
  across genomes (a eukaryote-to-prokaryote test of the module satisfiability
  engine). The pathway is two required steps: form L-homocysteine, then methylate it.
  Homocysteine can be reached two ways. The canonical route activates L-homoserine by
  acylation - either an O-succinyltransferase (metA) or an O-acetyltransferase (metX) -
  and then incorporates sulfur onto the O-acyl-homoserine, by trans-sulfuration
  (cystathionine gamma-synthase metB plus cystathionine beta-lyase metC, drawing
  sulfur from cysteine) or by direct sulfhydrylation (an O-acyl-homoserine
  sulfhydrylase, metY/metZ, using free sulfide in one step). A second, phylogenetically
  distinct route bypasses homoserine altogether: an L-aspartate semialdehyde
  sulfurtransferase (MJ0100 with its iron-sulfur partner MJ0099) transfers sulfide
  directly onto aspartate semialdehyde, so no acyltransferase and no sulfhydrylase is
  needed. Finally homocysteine is methylated to methionine by either the
  cobalamin-independent synthase (metE) or the cobalamin-dependent synthase (metH).
  Because every step has alternatives, no single enzyme is universally required; an
  organism makes methionine if it encodes at least one option at each step. This
  mirrors GapMind-style pathway reconstruction: the template defines steps and route
  alternatives, and a per-genome oracle decides which candidates are present.
status: DRAFT
evidence:
  - source_id: GO:0071265
    title: L-methionine biosynthetic process
    statement: Module grounded in the GO biological-process term for L-methionine biosynthesis.
  - source_id: KEGG:map00270
    title: Cysteine and methionine metabolism
    statement: >-
      Step alternatives (metA/metX; trans-sulfuration vs direct sulfhydrylation;
      metE/metH) follow the KEGG/MetaCyc methionine biosynthesis routes; per-genome
      presence is resolved via KEGG Orthology (see oracle).
  - source_id: file:modules/methionine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist module research for L-methionine biosynthesis
    statement: >-
      OpenScientist framed methionine biosynthesis from homoserine as a Boolean
      satisfiability problem with required acylation, sulfur-incorporation, and
      methylation steps, each having route alternatives.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methionine_biosynthesis__ppu00270-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00270 methionine-biosynthesis research
    statement: >-
      OpenScientist concluded that the PSEPK module is satisfiable via MetXS/MetZ
      direct sulfhydrylation and terminal methionine synthase activity, with a
      secondary MetB/PP_4348 trans-sulfuration route and important caution around
      partial MetE-like candidates.
notes: >-
  Reusable boundary: this module is a route-choice template, with homoserine
  acylation, sulfur incorporation, and terminal methylation modeled as required
  steps that may be satisfied by alternatives. The PSEPK instantiation appears
  satisfiable through Pseudomonas-style O-succinylhomoserine direct
  sulfhydrylation (metXS plus metZ) and terminal metH, with metB plus PP_4348 as
  a plausible secondary trans-sulfuration route. metE is a predicted compact
  single-barrel cobalamin-independent MetE candidate that still lacks direct
  KT2440 biochemical evidence. PP_2528, PP_4594, and PP_4637 should be treated
  as route/paralog-ambiguous unless gene-level evidence establishes
  physiological methionine-biosynthesis roles.
module:
  id: methionine_biosynthesis
  label: L-methionine biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: methionine biosynthesis
      term:
        id: GO:0071265
        label: L-methionine biosynthetic process
  parts:
    - order: 1
      role: >-
        formation of L-homocysteine, either via an O-acyl-L-homoserine
        intermediate or directly from L-aspartate semialdehyde
      node:
        id: homocysteine_formation
        label: Formation of L-homocysteine
        module_type: METABOLIC_PATHWAY
        description: >-
          Two mutually alternative entries to L-homocysteine. The canonical
          bacterial/plant route activates L-homoserine by acylation and then
          incorporates sulfur onto the O-acyl-homoserine. A second, phylogenetically
          distinct route bypasses homoserine entirely: an L-aspartate semialdehyde
          sulfurtransferase transfers sulfide directly onto aspartate semialdehyde
          to give homocysteine, so neither an acyltransferase nor an
          O-acyl-homoserine sulfhydrylase is required. Modelling only the
          acyl-homoserine entry causes organisms using the direct route (methanogenic
          archaea, cyanobacteria) to be scored as spurious pathway gaps.
        variant_sets:
          - id: homocysteine_route
            label: Homocysteine-formation route
            axis: carbon/sulfur entry point
            selection: ONE_OR_MORE
            variants:
              - id: acyl_homoserine_route
                label: Via O-acyl-L-homoserine (acylation, then sulfur incorporation)
                module_type: METABOLIC_PATHWAY
                description: >-
                  The canonical route: activate homoserine by acylation, then
                  incorporate sulfur onto the O-acyl-homoserine. Both sub-steps are
                  required, each with its own alternatives.
                parts:
                  - order: 1
                    role: acylation of homoserine (succinyl or acetyl)
                    node:
                      id: acylation
                      label: Homoserine activation by acylation
                      module_type: REACTION
                      variant_sets:
                        - id: acyltransferase
                          label: Homoserine acyltransferase
                          axis: acyl donor
                          selection: ONE_OR_MORE
                          variants:
                            - id: metA_variant
                              label: O-succinyltransferase (metA)
                              module_type: REACTION
                              annotons:
                                - id: metA_activity
                                  label: "metA: homoserine O-succinyltransferase"
                                  participant:
                                    selector_type: GENE
                                    gene:
                                      preferred_term: metA (homoserine O-succinyltransferase)
                                  function:
                                    preferred_term: homoserine O-succinyltransferase activity
                                    term:
                                      id: GO:0008899
                                      label: homoserine O-succinyltransferase activity
                                  role_description: Activates homoserine to O-succinyl-L-homoserine.
                            - id: metX_variant
                              label: O-acetyltransferase (metX)
                              module_type: REACTION
                              annotons:
                                - id: metX_activity
                                  label: "metX: homoserine O-acetyltransferase"
                                  participant:
                                    selector_type: GENE
                                    gene:
                                      preferred_term: metX (homoserine O-acetyltransferase)
                                  function:
                                    preferred_term: homoserine O-acetyltransferase activity
                                    term:
                                      id: GO:0004414
                                      label: homoserine O-acetyltransferase activity
                                  role_description: Activates homoserine to O-acetyl-L-homoserine.
                  - order: 2
                    role: sulfur incorporation to homocysteine (trans-sulfuration or direct)
                    node:
                      id: sulfur_incorporation
                      label: Sulfur incorporation to homocysteine
                      module_type: METABOLIC_PATHWAY
                      variant_sets:
                        - id: sulfur_route
                          label: Sulfur-incorporation route
                          axis: sulfur source
                          selection: ONE_OR_MORE
                          variants:
                            - id: trans_sulfuration
                              label: Trans-sulfuration (metB + metC)
                              module_type: METABOLIC_PATHWAY
                              description: Two enzymes, drawing sulfur from cysteine via cystathionine.
                              parts:
                                - order: 1
                                  role: cystathionine formation
                                  node:
                                    id: metB_node
                                    label: Cystathionine gamma-synthase
                                    module_type: REACTION
                                    annotons:
                                      - id: metB_activity
                                        label: "metB: cystathionine gamma-synthase"
                                        participant:
                                          selector_type: GENE
                                          gene:
                                            preferred_term: metB (cystathionine gamma-synthase)
                                        function:
                                          preferred_term: cystathionine gamma-synthase activity
                                          term:
                                            id: GO:0003962
                                            label: cystathionine gamma-synthase activity
                                - order: 2
                                  role: cystathionine cleavage to homocysteine
                                  node:
                                    id: metC_node
                                    label: Cystathionine beta-lyase
                                    module_type: REACTION
                                    annotons:
                                      - id: metC_activity
                                        label: "metC: cystathionine beta-lyase"
                                        participant:
                                          selector_type: GENE
                                          gene:
                                            preferred_term: metC (cystathionine beta-lyase)
                                        function:
                                          preferred_term: cystathionine beta-lyase activity
                                          term:
                                            id: GO:0047804
                                            label: cysteine-S-conjugate beta-lyase activity
                                          evidence:
                                            - source_id: file:PSEPK/PP_4348/PP_4348-notes.md
                                              statement: >-
                                                QuickGO returned GO:0004121 with
                                                isObsolete=true and states that it is
                                                equivalent to the live GO:0047804
                                                cysteine-S-conjugate beta-lyase activity term;
                                                GO:0047804 also lists cystathionine beta-lyase
                                                activity as a related synonym.
                            - id: direct_sulfhydrylation
                              label: Direct sulfhydrylation of O-acetylhomoserine (metY)
                              module_type: REACTION
                              description: One enzyme, using free sulfide on O-acetyl-homoserine.
                              annotons:
                                - id: metY_activity
                                  label: "metY: O-acylhomoserine sulfhydrylase"
                                  participant:
                                    selector_type: GENE
                                    gene:
                                      preferred_term: metY (O-acetylhomoserine sulfhydrylase)
                                  function:
                                    preferred_term: O-acetylhomoserine aminocarboxypropyltransferase activity
                                    term:
                                      id: GO:0003961
                                      label: O-acetylhomoserine aminocarboxypropyltransferase activity
                            - id: direct_sulfhydrylation_metZ
                              label: Direct sulfhydrylation of O-succinylhomoserine (metZ)
                              module_type: REACTION
                              description: >-
                                One enzyme, using free sulfide on O-succinylhomoserine to form
                                L-homocysteine. This is the Pseudomonas-style direct route used
                                by KT2440 when homoserine is activated by a succinyltransferase.
                              annotons:
                                - id: metZ_activity
                                  label: "metZ: O-succinylhomoserine sulfhydrylase"
                                  participant:
                                    selector_type: GENE
                                    gene:
                                      preferred_term: metZ (O-succinylhomoserine sulfhydrylase)
                                  function:
                                    preferred_term: carbon-sulfur lyase activity
                                    term:
                                      id: GO:0016846
                                      label: carbon-sulfur lyase activity
                                  role_description: >-
                                    Converts O-succinyl-L-homoserine and sulfide to L-homocysteine;
                                    GO lacks a more specific O-succinylhomoserine sulfhydrylase
                                    molecular-function term in the local GOA record.
              - id: aspartate_semialdehyde_route
                label: Direct sulfurtransfer onto L-aspartate semialdehyde (MJ0100/MJ0099)
                module_type: REACTION
                description: >-
                  Homocysteine is formed directly from L-aspartate semialdehyde and
                  sulfide, bypassing L-homoserine and its acylation entirely. Both
                  subunits are required: the sulfurtransferase MJ0100 and its
                  iron-sulfur/ferredoxin partner MJ0099. Characterised in
                  Methanocaldococcus jannaschii and confirmed in Methanosarcina
                  acetivorans; the two-gene pair is also encoded by Synechocystis sp.
                  PCC 6803 (slr0689/slr2059). No standard three-letter gene symbol
                  exists for this step, so it is named by its characterised
                  M. jannaschii representatives.
                evidence:
                  - source_id: PMID:25938369
                    title: >-
                      Homocysteine is biosynthesized from aspartate semialdehyde and
                      hydrogen sulfide in methanogenic archaea.
                    supporting_text: >-
                      Methanocaldococcus jannaschii can biosynthesize homocysteine
                      from aspartate semialdehyde and hydrogen sulfide
                    statement: >-
                      Establishes the non-canonical homocysteine route modelled by this
                      variant, and states why genomes using it look like pathway gaps:
                      "The biosynthetic route for homocysteine, intermediate in
                      methionine biosynthesis, is unknown in some methanogenic archaea
                      because homologues of the canonical required genes cannot be
                      identified."
                annotons:
                  - id: MJ0100_activity
                    label: "MJ0100: L-aspartate semialdehyde sulfurtransferase"
                    participant:
                      selector_type: GENE
                      gene:
                        preferred_term: MJ0100 (L-aspartate semialdehyde sulfurtransferase)
                        term:
                          id: UniProtKB:Q57564
                          label: L-aspartate semialdehyde sulfurtransferase
                    function:
                      preferred_term: sulfurtransferase activity (EC 2.8.1.16)
                      term:
                        id: GO:0016783
                        label: sulfurtransferase activity
                    role_description: >-
                      Transfers sulfide onto L-aspartate semialdehyde to give
                      L-homocysteine, replacing both the acylation and the
                      O-acyl-homoserine sulfhydrylation steps.
                  - id: MJ0099_activity
                    label: "MJ0099: L-aspartate semialdehyde sulfurtransferase iron-sulfur subunit"
                    participant:
                      selector_type: GENE
                      gene:
                        preferred_term: MJ0099 (L-aspartate semialdehyde sulfurtransferase iron-sulfur subunit)
                        term:
                          id: UniProtKB:Q57563
                          label: L-aspartate semialdehyde sulfurtransferase iron-sulfur subunit
                    function:
                      preferred_term: 4Fe-4S cluster binding (ferredoxin partner subunit)
                      term:
                        id: GO:0051539
                        label: 4 iron, 4 sulfur cluster binding
                    role_description: >-
                      Obligate iron-sulfur/ferredoxin partner of the sulfurtransferase;
                      supplies the reducing equivalents for thioaldehyde reduction.
    - order: 2
      role: methylation of homocysteine to methionine (cobalamin-independent or -dependent)
      node:
        id: methylation
        label: Homocysteine methylation to methionine
        module_type: REACTION
        variant_sets:
          - id: methionine_synthase
            label: Methionine synthase
            axis: cobalamin dependence
            selection: ONE_OR_MORE
            variants:
              - id: metE_variant
                label: Cobalamin-independent synthase (metE)
                module_type: REACTION
                annotons:
                  - id: metE_activity
                    label: "metE: cobalamin-independent methionine synthase"
                    participant:
                      selector_type: GENE
                      gene:
                        preferred_term: metE (cobalamin-independent methionine synthase)
                    function:
                      preferred_term: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                      term:
                        id: GO:0003871
                        label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
              - id: metH_variant
                label: Cobalamin-dependent synthase (metH)
                module_type: REACTION
                annotons:
                  - id: metH_activity
                    label: "metH: cobalamin-dependent methionine synthase"
                    participant:
                      selector_type: GENE
                      gene:
                        preferred_term: metH (cobalamin-dependent methionine synthase)
                    function:
                      preferred_term: methionine synthase activity
                      term:
                        id: GO:0008705
                        label: methionine synthase activity
  connections:
    - source: acylation
      target: sulfur_incorporation
      connection_type: PRECEDES
    - source: homocysteine_formation
      target: methylation
      connection_type: PRECEDES
  notes: >-
    Species-agnostic GapMind-style template. Steps are grounded by gene symbol and
    GO molecular function where possible; the authoritative per-genome step candidates
    are KEGG Orthology ids held by the oracle (metA=K00651, metX=K00641, metB=K01739,
    metC=K01760, metY=K01740, metZ=K10764, MJ0100=K23975, MJ0099=K23976, metE=K00549,
    metH=K00548), supplemented by species-aware review for truncated MetE-like hits.
    The aspartate-semialdehyde route was added after an earlier version of this
    template - which modelled only the O-acyl-homoserine entry and was titled
    "from homoserine" - scored Synechocystis sp. PCC 6803 and Methanocaldococcus
    jannaschii as methionine-biosynthesis gaps and hence as spurious "metabolic dark
    matter" abduction targets. Both in fact encode the two-gene direct route
    (syn:slr0689/slr2059, mja:MJ_0100/MJ_0099), so the gap was a module-scope and
    oracle-coverage artifact rather than a missing enzyme. See
    projects/PATHWAY_SATISFIABILITY/REVIEW.md, and
    modules/experimental/gluconeogenesis-context/kegg_oracle.py and resolve_genomes.py
    for per-genome route resolution and gap detection.
