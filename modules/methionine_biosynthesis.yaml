id: MODULE:methionine_biosynthesis
title: L-methionine biosynthesis (from homoserine)
description: >-
  De novo biosynthesis of L-methionine from L-homoserine through three ordered
  stages: homoserine activation, sulfur incorporation to form L-homocysteine,
  and methylation of L-homocysteine. Bacteria can activate homoserine with an
  acetyl or succinyl group, incorporate sulfur through two-step
  trans-sulfuration or one-step direct sulfhydrylation, and complete the pathway
  with a cobalamin-independent or cobalamin-dependent methionine synthase.
  Substrate-matched alternatives are retained explicitly because enzyme-family
  membership alone does not reliably distinguish acetyl from succinyl chemistry
  or forward biosynthetic from related PLP-dependent lyase reactions.
status: DRAFT
evidence:
  - source_id: GO:0071265
    title: L-methionine biosynthetic process
    statement: Module grounded in the GO biological-process term for L-methionine biosynthesis.
  - source_id: KEGG:map00270
    title: Cysteine and methionine metabolism
    statement: >-
      Step alternatives (metA/metX; trans-sulfuration vs direct sulfhydrylation;
      metE/metH) follow the KEGG/MetaCyc methionine biosynthesis routes; per-genome
      presence is resolved via KEGG Orthology (see oracle).
  - source_id: file:modules/methionine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist module research for L-methionine biosynthesis
    statement: >-
      OpenScientist framed methionine biosynthesis from homoserine as a Boolean
      satisfiability problem with required acylation, sulfur-incorporation, and
      methylation steps, each having route alternatives.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methionine_biosynthesis__ppu00270-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00270 methionine-biosynthesis research
    statement: >-
      OpenScientist concluded that the PSEPK module is satisfiable via MetXS/MetZ
      direct sulfhydrylation and terminal methionine synthase activity, with a
      secondary MetB/PP_4348 trans-sulfuration route and important caution around
      partial MetE-like candidates.
  - source_id: PMID:28581482
    title: >-
      Parallel evolution of non-homologous isofunctional enzymes in methionine
      biosynthesis.
    statement: >-
      Experimental profiling of acyl-L-homoserine transferases establishes that
      acetyl- versus succinyl-CoA specificity cannot be assigned safely from a
      broad MetA/MetX-family classification alone.
  - source_id: file:genes/PSEPK/metXS/metXS-ai-review.yaml
    title: PSEPK metXS gene review
    statement: >-
      Q88CT3 is an experimentally supported homoserine O-succinyltransferase
      exemplar despite belonging to a MetX-fold acyltransferase family that
      does not determine acyl-donor specificity.
  - source_id: file:genes/PSEPK/metZ/metZ-ai-review.yaml
    title: PSEPK metZ gene review
    statement: >-
      Q88LD4 supports the substrate-matched O-succinylhomoserine direct
      sulfhydrylation route while illustrating the poor reaction specificity of
      the broader trans-sulfuration PANTHER family.
  - source_id: file:genes/PSEPK/metH/metH-ai-review.yaml
    title: PSEPK metH gene review
    statement: >-
      Q88KB5 supplies a complete cobalamin-dependent methionine synthase
      exemplar for the terminal methylation stage.
notes: >-
  The boundary begins with L-homoserine and ends with L-methionine. Upstream
  aspartate-family synthesis of homoserine, sulfur assimilation, cobalamin
  supply, methionine salvage, the methionine/SAM cycle, and transcriptional or
  riboswitch regulation are outside the module. PANTHER terms orient exact
  exemplars but do not override experimentally established substrate
  specificity. Family identifiers are omitted where the locally available
  family does not distinguish the leaf chemistry. No PTN is asserted because
  an appropriate ancestral function-bearing node has not been established
  locally for every route.
module:
  id: methionine_biosynthesis
  label: L-methionine biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: methionine biosynthesis
      term:
        id: GO:0071265
        label: L-methionine biosynthetic process
  parts:
    - order: 1
      role: acylation of homoserine (succinyl or acetyl)
      node:
        id: acylation
        label: Homoserine activation by acylation
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: acyltransferase
            label: Homoserine acyltransferase
            axis: acyl donor
            selection: ONE_OR_MORE
            variants:
              - id: o_succinyl_activation
                label: O-succinylhomoserine formation
                module_type: REACTION
                annotons:
                  - id: homoserine_o_succinyltransferase_activity
                    label: Homoserine O-succinyltransferase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metA (homoserine O-succinyltransferase)
                      family:
                        preferred_term: >-
                          homoserine O-succinyltransferases with verified donor
                          specificity
                        description: >-
                          No family identifier is asserted because MetA- and
                          MetX-fold acyltransferases can independently evolve
                          acetyl- or succinyl-CoA specificity.
                        representative_members:
                          - preferred_term: PSEPK MetXS
                            term:
                              id: UniProtKB:Q88CT3
                              label: Homoserine O-succinyltransferase
                            description: >-
                              Experimentally supported succinyl-CoA-specific
                              exemplar. The PANTHER label does not capture the
                              donor specificity of this member.
                    function:
                      preferred_term: homoserine O-succinyltransferase activity
                      term:
                        id: GO:0008899
                        label: homoserine O-succinyltransferase activity
                    role_description: Activates homoserine to O-succinyl-L-homoserine.
              - id: o_acetyl_activation
                label: O-acetylhomoserine formation
                module_type: REACTION
                annotons:
                  - id: homoserine_o_acetyltransferase_activity
                    label: Homoserine O-acetyltransferase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metX (homoserine O-acetyltransferase)
                      family:
                        preferred_term: homoserine O-acetyltransferases
                        description: >-
                          No family identifier is asserted because acyl-donor
                          specificity is not reliably delimited by the available
                          MetA/MetX family classifications.
                        representative_members:
                          - preferred_term: Mycobacterium tuberculosis MetX
                            term:
                              id: UniProtKB:P9WJY9
                              label: Homoserine O-acetyltransferase
                    function:
                      preferred_term: homoserine O-acetyltransferase activity
                      term:
                        id: GO:0004414
                        label: homoserine O-acetyltransferase activity
                    role_description: Activates homoserine to O-acetyl-L-homoserine.
    - order: 2
      role: sulfur incorporation to homocysteine (trans-sulfuration or direct)
      node:
        id: sulfur_incorporation
        label: Sulfur incorporation to homocysteine
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: sulfur_route
            label: Sulfur-incorporation route
            axis: sulfur source
            selection: ONE_OR_MORE
            variants:
              - id: trans_sulfuration
                label: Trans-sulfuration (metB + metC)
                module_type: METABOLIC_PATHWAY
                description: Two enzymes, drawing sulfur from cysteine via cystathionine.
                parts:
                  - order: 1
                    role: cystathionine formation
                    node:
                      id: metB_node
                      label: Cystathionine gamma-synthase
                      module_type: REACTION
                      annotons:
                        - id: metB_activity
                          label: "metB: cystathionine gamma-synthase"
                          participant:
                            selector_type: FAMILY
                            gene:
                              preferred_term: metB (cystathionine gamma-synthase)
                            family:
                              preferred_term: cystathionine gamma-synthases
                              family_terms:
                                - id: PANTHER:PTHR11808:SF75
                                  label: CYSTATHIONINE GAMMA-SYNTHASE
                              representative_members:
                                - preferred_term: Escherichia coli K-12 MetB
                                  term:
                                    id: UniProtKB:P00935
                                    label: Cystathionine gamma-synthase
                          function:
                            preferred_term: cystathionine gamma-synthase activity
                            term:
                              id: GO:0003962
                              label: cystathionine gamma-synthase activity
                  - order: 2
                    role: cystathionine cleavage to homocysteine
                    node:
                      id: metC_node
                      label: Cystathionine beta-lyase
                      module_type: REACTION
                      annotons:
                        - id: metC_activity
                          label: "metC: cystathionine beta-lyase"
                          participant:
                            selector_type: FAMILY
                            gene:
                              preferred_term: metC (cystathionine beta-lyase)
                            family:
                              preferred_term: cystathionine beta-lyases
                              description: >-
                                The official -RELATED subfamily label is broader
                                than a definitive activity assignment. The
                                characterized P06721 exemplar and leaf molecular
                                function provide the reaction-specific grounding.
                              family_terms:
                                - id: PANTHER:PTHR43500:SF1
                                  label: CYSTATHIONINE BETA-LYASE-RELATED
                              representative_members:
                                - preferred_term: Escherichia coli K-12 MetC
                                  term:
                                    id: UniProtKB:P06721
                                    label: Cystathionine beta-lyase MetC
                          function:
                            preferred_term: cystathionine beta-lyase activity
                            term:
                              id: GO:0047804
                              label: cysteine-S-conjugate beta-lyase activity
                            evidence:
                              - source_id: GO:0047804
                                statement: >-
                                  The live GO term lists cystathionine beta-lyase
                                  activity as a related synonym; the former
                                  GO:0004121 cystathionine beta-lyase activity
                                  term is obsolete.
                connections:
                  - source: metB_node
                    target: metC_node
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      Cystathionine formed by MetB is the substrate cleaved by
                      MetC to produce L-homocysteine.
              - id: direct_sulfhydrylation
                label: Direct sulfhydrylation of O-acetylhomoserine (metY)
                module_type: REACTION
                description: One enzyme, using free sulfide on O-acetyl-homoserine.
                annotons:
                  - id: metY_activity
                    label: "metY: O-acetylhomoserine sulfhydrylase"
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metY (O-acetylhomoserine sulfhydrylase)
                      family:
                        preferred_term: O-acetylhomoserine sulfhydrylases
                        description: >-
                          No family identifier is asserted because the available
                          homocysteine/cysteine synthase family does not by
                          itself establish O-acetylhomoserine specificity.
                        representative_members:
                          - preferred_term: Corynebacterium glutamicum MetY
                            term:
                              id: UniProtKB:Q79VI4
                              label: O-acetyl-L-homoserine sulfhydrylase
                    function:
                      preferred_term: O-acetylhomoserine aminocarboxypropyltransferase activity
                      term:
                        id: GO:0003961
                        label: O-acetylhomoserine aminocarboxypropyltransferase activity
              - id: direct_sulfhydrylation_metZ
                label: Direct sulfhydrylation of O-succinylhomoserine (metZ)
                module_type: REACTION
                description: >-
                  One enzyme, using free sulfide on O-succinylhomoserine to form
                  L-homocysteine. This route must be paired with a homoserine
                  O-succinyltransferase rather than an O-acetyltransferase.
                annotons:
                  - id: metZ_activity
                    label: "metZ: O-succinylhomoserine sulfhydrylase"
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metZ (O-succinylhomoserine sulfhydrylase)
                      family:
                        preferred_term: O-succinylhomoserine sulfhydrylases
                        description: >-
                          No family identifier is asserted because the available
                          trans-sulfuration PANTHER family spans multiple
                          reaction directions and sulfur-incorporation routes.
                        representative_members:
                          - preferred_term: PSEPK MetZ
                            term:
                              id: UniProtKB:Q88LD4
                              label: O-succinylhomoserine sulfhydrylase
                            description: >-
                              Substrate-matched direct-sulfhydrylation exemplar
                              supported by MetZ-specific HAMAP, NCBIfam, and
                              InterPro signatures.
                    function:
                      preferred_term: O-succinylhomoserine sulfhydrylase activity
                      term:
                        id: GO:0016765
                        label: >-
                          transferase activity, transferring alkyl or aryl
                          (other than methyl) groups
                    role_description: >-
                      Converts O-succinyl-L-homoserine and sulfide to L-homocysteine;
                      GO:0016765 captures the EC 2.5.1 transfer class; the exact
                      O-succinylhomoserine reaction is stated here because GO
                      lacks a more specific live molecular-function term.
    - order: 3
      role: methylation of homocysteine to methionine (cobalamin-independent or -dependent)
      node:
        id: methylation
        label: Homocysteine methylation to methionine
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: methionine_synthase
            label: Methionine synthase
            axis: cobalamin dependence
            selection: ONE_OR_MORE
            variants:
              - id: metE_variant
                label: Cobalamin-independent synthase (metE)
                module_type: REACTION
                annotons:
                  - id: metE_activity
                    label: "metE: cobalamin-independent methionine synthase"
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metE (cobalamin-independent methionine synthase)
                      family:
                        preferred_term: cobalamin-independent methionine synthases
                        description: >-
                          A PANTHER identifier is deliberately omitted because
                          the locally assigned PTHR30519 groups complete MetE
                          enzymes with partial MetE-like proteins and does not
                          by itself establish catalytic competence.
                        representative_members:
                          - preferred_term: Escherichia coli K-12 MetE
                            term:
                              id: UniProtKB:P25665
                              label: >-
                                5-methyltetrahydropteroyltriglutamate--homocysteine
                                methyltransferase
                    function:
                      preferred_term: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                      term:
                        id: GO:0003871
                        label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
              - id: metH_variant
                label: Cobalamin-dependent synthase (metH)
                module_type: REACTION
                annotons:
                  - id: metH_activity
                    label: "metH: cobalamin-dependent methionine synthase"
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metH (cobalamin-dependent methionine synthase)
                      family:
                        preferred_term: cobalamin-dependent methionine synthases
                        family_terms:
                          - id: PANTHER:PTHR45833:SF1
                            label: METHIONINE SYNTHASE
                        representative_members:
                          - preferred_term: PSEPK MetH
                            term:
                              id: UniProtKB:Q88KB5
                              label: Methionine synthase
                          - preferred_term: Escherichia coli K-12 MetH
                            term:
                              id: UniProtKB:P13009
                              label: Methionine synthase
                    function:
                      preferred_term: methionine synthase activity
                      term:
                        id: GO:0008705
                        label: methionine synthase activity
  connections:
    - source: o_succinyl_activation
      target: direct_sulfhydrylation_metZ
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Homoserine O-succinyltransferase supplies O-succinyl-L-homoserine to
        the MetZ direct-sulfhydrylation route.
    - source: o_acetyl_activation
      target: direct_sulfhydrylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Homoserine O-acetyltransferase supplies O-acetyl-L-homoserine to the
        MetY direct-sulfhydrylation route.
    - source: acylation
      target: trans_sulfuration
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Trans-sulfuration uses an activated homoserine substrate; the accepted
        acetyl or succinyl form depends on the organism's MetB chemistry.
    - source: acylation
      target: sulfur_incorporation
      connection_type: PRECEDES
      description: >-
        Homoserine activation precedes sulfur incorporation at the reusable
        stage level; the more specific edges above preserve substrate matching.
    - source: sulfur_incorporation
      target: methylation
      connection_type: PRECEDES
  notes: >-
    The module records biochemical alternatives, not universal gene-name
    requirements. Homoserine acyltransferase and Cys/Met PLP-enzyme families can
    contain members with different substrates or reaction directions, and some
    proteins are bifunctional across the nominal routes. Exact activity evidence
    therefore takes precedence over a family label when instantiating the
    template in a genome. A MetH-only implementation is conditional on
    cobalamin availability. Per-genome candidates are keyed by KEGG Orthology:
    metA=K00651, metX=K00641, metB=K01739, metC=K01760, metY=K01740,
    metE=K00549, and metH=K00548. MetZ/O-succinylhomoserine sulfhydrylase and
    partial MetE-like proteins require species-aware review beyond those KO
    mappings. See modules/experimental/gluconeogenesis-context/kegg_oracle.py
    and modules/experimental/gluconeogenesis-context/resolve_genomes.py for
    per-genome route resolution and gap detection.
