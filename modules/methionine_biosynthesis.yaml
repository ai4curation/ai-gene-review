id: MODULE:methionine_biosynthesis
title: L-methionine biosynthesis (from homoserine)
description: >-
  De novo biosynthesis of L-methionine from L-homoserine through three ordered
  stages: homoserine activation, sulfur incorporation to form L-homocysteine,
  and methylation of L-homocysteine. Homoserine is activated by acylation with
  an acetyl or succinyl group, or, in plants, by phosphorylation. Sulfur enters
  either by two-step trans-sulfuration from L-cysteine through cystathionine
  (cystathionine gamma-synthase then cystathionine beta-lyase) or by one-step
  direct sulfhydrylation of the activated homoserine with sulfide. The pathway
  ends with a cobalamin-independent (MetE-type) or cobalamin-dependent
  (MetH-type) methionine synthase that transfers a methyl group from
  5-methyltetrahydrofolate to L-homocysteine. Bacteria use every combination of
  these routes; fungi acetylate homoserine, rely mainly on direct
  sulfhydrylation and finish with a MetE-type synthase that needs a
  polyglutamylated folate; plants use phospho-homoserine trans-sulfuration in
  plastids and a MetE-type synthase. Animals lack the pathway; their
  MetH-type synthase regenerates methionine in the methionine cycle, which is
  outside this module. Acyl-donor specificity and
  reaction direction are not reliably predicted by enzyme-family membership, so
  alternatives are kept substrate-matched.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0071266
    title: "'de novo' L-methionine biosynthetic process"
    statement: >-
      Module grounded in the GO biological-process term for de novo
      L-methionine biosynthesis from L-aspartate or L-homoserine, which
      excludes salvage. It is a child of GO:0071265 L-methionine biosynthetic
      process, the term used by the SGD GO-CAM conversions.
  - source_id: YeastPathways:PWY3O-954
    title: superpathway of methionine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway with the HOM3, HOM2 and HOM6 trunk (modelled in
      aspartate_family_threonine_biosynthesis), MET2 homoserine
      O-acetyltransferase, MET17 O-acetylhomoserine sulfhydrylase, MET6
      cobalamin-independent methionine synthase and MET7 folylpolyglutamate
      synthase. Its comment notes the alternative trans-sulfuration route from
      cysteine, whose enzymes (STR2, STR3) the pathway gene list omits.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-954
  - source_id: YeastPathways:PWY-5344
    title: L-homocysteine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      MET2 (HOMOSERINE-O-ACETYLTRANSFERASE-RXN) and MET17
      (ACETYLHOMOSER-CYS-RXN); both assignments were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5344
  - source_id: YeastPathways:PWY3O-238
    title: methionine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      MET6 (HOMOCYSMET-RXN) and MET7 (RXN3O-22). MET6 is retained; MET7
      polyglutamylates the folate co-substrate and is treated as cofactor
      supply outside the module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-238
  - source_id: PMID:9409150
    title: Metabolism of sulfur amino acids in Saccharomyces cerevisiae.
    statement: >-
      Review of S. cerevisiae sulfur amino acid biosynthesis, cited by
      YeastPathways for the methionine pathways.
  - source_id: PMID:3552887
    title: 'The MET2 gene of Saccharomyces cerevisiae: molecular cloning and nucleotide sequence.'
    statement: MET2 encodes S. cerevisiae homoserine O-acetyltransferase.
    supporting_text: >-
      This fragment contains the wild-type MET2 gene which codes for the
      homoserine O-transacetylase, one of the methionine biosynthetic enzymes.
  - source_id: PMID:7765825
    title: >-
      Overexpression of the Saccharomyces cerevisiae MET17/MET25 gene in
      Escherichia coli and comparative characterization of the product with
      O-acetylserine.O-acetylhomoserine sulfhydrylase of the yeast.
    statement: >-
      MET17/MET25 encodes the yeast O-acetylserine/O-acetylhomoserine
      sulfhydrylase.
  - source_id: PMID:5764336
    title: Genetic and regulatory aspects of methionine biosynthesis in Saccharomyces cerevisiae.
    statement: >-
      Early genetic and enzymological evidence that yeast methionine synthesis
      does not require cystathionine and runs through homocysteine synthetase
      acting on O-acetylhomoserine.
    supporting_text: >-
      Data presented in this paper and others favor a scheme which excludes
      cystathionine as an obligatory intermediate.
  - source_id: PMID:10821189
    title: Cysteine is essential for transcriptional regulation of the sulfur assimilation genes in Saccharomyces cerevisiae.
    statement: >-
      Disruption of YJR130c (STR2, cystathionine gamma-synthase) or YGL184c
      (STR3, cystathionine beta-lyase) prevents S. cerevisiae from converting
      cysteine into homocysteine, identifying the yeast trans-sulfuration
      enzymes.
    supporting_text: >-
      Two genes that presumably encode cystathionine gamma-synthase and
      cystathionine beta-lyase were identified by genetic disruption (ORFs
      YJR130c and YGL184c), yielding yeast strains that cannot convert
      cysteine into homocysteine.
  - source_id: PMID:22572787
    title: 'Saccharomyces cerevisiae STR3 and yeast cystathionine β-lyase enzymes: The potential for engineering increased flavor release.'
    statement: Characterises STR3 as the S. cerevisiae cystathionine beta-lyase.
  - source_id: PMID:10799479
    title: >-
      Polyglutamylation of folate coenzymes is necessary for methionine
      biosynthesis and maintenance of intact mitochondrial genome in
      Saccharomyces cerevisiae.
    statement: >-
      MET7 encodes folylpolyglutamate synthetase, whose activity is required
      for methionine synthesis because Met6 uses only polyglutamylated
      5-methyltetrahydrofolate.
    supporting_text: >-
      Folylpolyglutamate synthetase activity is required for methionine
      synthesis and for maintenance of mitochondrial DNA.
  - source_id: PMID:16436428
    title: >-
      Homocysteine accumulation causes a defect in purine biosynthesis: further
      characterization of Schizosaccharomyces pombe methionine auxotrophs.
    statement: >-
      Disruption of S. pombe met26 (SPAC9.09), a MetE-family methionine
      synthase, causes methionine auxotrophy.
    supporting_text: >-
      Disruption of SPAC9.09 caused methionine auxotrophy, and thus the gene
      was identified as a methionine synthase and designated met26.
  - source_id: PMID:9636232
    title: The specific features of methionine biosynthesis and metabolism in plants.
    statement: >-
      Plant cystathionine gamma-synthase uses O-phospho-L-homoserine, and
      plants use a cobalamin-independent methionine synthase.
    supporting_text: >-
      the corresponding plant enzyme uses OPH as the physiological
      α-aminobutyryl donor for cystathionine synthesis
  - source_id: PMID:12832650
    title: >-
      In vivo analysis of various substrates utilized by cystathionine
      gamma-synthase and O-acetylhomoserine sulfhydrylase in methionine
      biosynthesis.
    statement: >-
      Bacterial and plant cystathionine gamma-synthases and an
      O-acetylhomoserine sulfhydrylase each accept both O-succinyl- and
      O-acetylhomoserine, and the gamma-synthases can also act as direct
      sulfhydrylases; only the plant enzyme accepts O-phosphohomoserine.
    supporting_text: >-
      All the three enzymes were able to utilize OSH and OAH as substrates,
      with different degrees of efficiency, but only the plant enzyme was able
      to utilize OPH as a substrate.
  - source_id: KEGG:map00270
    title: Cysteine and methionine metabolism
    statement: >-
      Step alternatives (metA/metX; trans-sulfuration vs direct sulfhydrylation;
      metE/metH) follow the KEGG/MetaCyc methionine biosynthesis routes; per-genome
      presence is resolved via KEGG Orthology (see oracle).
  - source_id: file:modules/methionine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist module research for L-methionine biosynthesis
    statement: >-
      OpenScientist framed methionine biosynthesis from homoserine as a Boolean
      satisfiability problem with required acylation, sulfur-incorporation, and
      methylation steps, each having route alternatives.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methionine_biosynthesis__ppu00270-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00270 methionine-biosynthesis research
    statement: >-
      OpenScientist concluded that the PSEPK module is satisfiable via MetXS/MetZ
      direct sulfhydrylation and terminal methionine synthase activity, with a
      secondary MetB/PP_4348 trans-sulfuration route and important caution around
      partial MetE-like candidates.
  - source_id: PMID:28581482
    title: >-
      Parallel evolution of non-homologous isofunctional enzymes in methionine
      biosynthesis.
    statement: >-
      Experimental profiling of acyl-L-homoserine transferases establishes that
      acetyl- versus succinyl-CoA specificity cannot be assigned safely from a
      broad MetA/MetX-family classification alone.
  - source_id: file:genes/PSEPK/metXS/metXS-ai-review.yaml
    title: PSEPK metXS gene review
    statement: >-
      Q88CT3 is an experimentally supported homoserine O-succinyltransferase
      exemplar despite belonging to a MetX-fold acyltransferase family that
      does not determine acyl-donor specificity.
  - source_id: file:genes/PSEPK/metZ/metZ-ai-review.yaml
    title: PSEPK metZ gene review
    statement: >-
      Q88LD4 supports the substrate-matched O-succinylhomoserine direct
      sulfhydrylation route while illustrating the poor reaction specificity of
      the broader trans-sulfuration PANTHER family.
  - source_id: file:genes/PSEPK/metH/metH-ai-review.yaml
    title: PSEPK metH gene review
    statement: >-
      Q88KB5 supplies a complete cobalamin-dependent methionine synthase
      exemplar for the terminal methylation stage.
notes: >-
  The boundary begins with L-homoserine and ends with L-methionine. Upstream
  aspartate-family synthesis of homoserine, sulfur assimilation, cobalamin and
  folate supply, methionine salvage, the methionine/SAM cycle, and
  transcriptional or riboswitch regulation are outside the module.

  SCOPE. The module is species-neutral and pan-domain: each leaf names a
  reaction and is grounded by experimentally characterized exemplars from
  bacteria (E. coli K-12, Pseudomonas putida KT2440, Corynebacterium
  glutamicum, Mycobacterium tuberculosis), fungi (S. cerevisiae, S. pombe) and
  plants (Arabidopsis). It is CONCRETE because every leaf is grounded to
  reviewed representative proteins. E. coli MetE (P25665) and MetH (P13009),
  listed in an earlier version, were removed as representatives because their
  gene reviews are being completed in a separate open PR (the bacterial
  methionine-cycle audit); they should be re-added when that work merges, which
  will also restore a bacterial MetE exemplar. Human MTR is not a
  representative: animals lack de novo methionine synthesis, and MTR's role is
  the methionine cycle; it is reviewed here only as the reference protein of
  PTHR45833.

  FAMILIES. Every leaf now names the PANTHER family or subfamily that holds its
  exemplars (PTHR20919 and PTHR32268:SF11 for acylation; PTHR11808:SF75,
  PTHR42699:SF1 and PTHR43379:SF1 for cystathionine gamma-synthase;
  PTHR43500:SF1 and PTHR11808:SF50 for cystathionine beta-lyase;
  PTHR43797:SF2 for MetY; PTHR11808:SF80 for MetZ; PTHR30519 for MetE;
  PTHR45833:SF1 for MetH), and each family has a family review. Family
  membership does not determine the leaf chemistry: both acyltransferase
  families contain acetyl- and succinyl-specific members in one subfamily
  (PMID:28581482), PTHR11808:SF80 holds a gamma-synthase as well as MetZ, and
  PTHR30519 includes partial MetE-like proteins. The family terms orient; the
  function selects members.

  PAINT NODES. Only nodes that are seeded by one of the module's own UniProt
  representatives are pinned (PTN000467771 MetA, PTN000211711 MetB,
  PTN000211746 MetC). The other function-bearing nodes (PTN000791315 MetX,
  PTN002887184 MetY, PTN008412101 MetE, PTN002501322 MetH) are assessed in the
  family reviews; their seeds name the yeast and fission-yeast exemplars by
  SGD/PomBase ids or are E. coli and human proteins not used as
  representatives here. Family-review findings that matter for genome
  annotation: PTN000467771 propagates succinyltransferase activity to
  acetyl-specific MetA enzymes (B. subtilis MetA); PTN000791315 propagates
  acetyltransferase activity to succinyl-specific MetXS; PTN000211591 gives
  E. coli MetB cystathionine gamma-lyase and cysteine-biosynthesis IBAs; and
  PTN008412101 carries cobalamin-dependent GO:0008705 on the MetE family.
  The UniRule for the MetA family (HAMAP MF_00295) was found to attach
  GO:0004414 to the succinyl case and GO:0008899 to the acetyl case; this is
  recorded as a source defect in the E. coli metA review.

  REMAINING VALIDATOR WARNINGS (intrinsic). The function-conformance check
  reports FAMILY_FUNCTION_UNREVIEWED for the acyl-donor activities on
  PTHR20919 and PTHR32268:SF11 and for GO:0016765 on PTHR11808:SF80, because the
  family reviews deliberately leave those terms UNRESOLVED: no PANTHER
  subfamily separates the donors or the reaction types. It reports
  ANNOTATION_SUPPORTED for MetZ because the metZ review's core function uses a
  proposed term (O-succinylhomoserine sulfhydrylase activity) that GO lacks,
  while the module annoton carries the nearest existing parent, GO:0016765.

  ROUTES. Plants activate homoserine by phosphorylation (homoserine kinase),
  and their cystathionine gamma-synthase uses O-phospho-L-homoserine
  (PMID:9636232; the CGS1 review proposes an O-phospho-L-homoserine-specific
  gamma-synthase term). That route is not yet a variant of the activation step
  because tests/test_module_logic.py fixes the route/gene inventory of this
  template; homoserine kinase is modelled in
  aspartate_family_threonine_biosynthesis. S. pombe met3 has only inferred
  gamma-synthase activity (no S. pombe assay), and direct sulfhydrylation by
  met17 is the main fission-yeast route.

  YEASTPATHWAYS AND GO-CAM ALIGNMENT (2026-10; PWY3O-954, PWY-5344,
  PWY3O-238). The module concept is GO:0071266 'de novo' L-methionine
  biosynthetic process, and the MetY leaf uses GO:0051009, the exact sulfide
  reaction (its parent GO:0003961 is defined by the methanethiol reaction;
  the MET17 and met17 reviews now MODIFY their GO:0003961 rows to GO:0051009).
  The HOM3, HOM2 and HOM6 reactions in PWY3O-954 are the upstream trunk,
  modelled in aspartate_family_threonine_biosynthesis. STR2 and STR3, which
  make homocysteine from cysteine (PMID:10821189), are missing from the
  YeastCyc gene lists although the pathway comment describes that route. MET7
  (folylpolyglutamate synthase) is required because Met6 uses only
  polyglutamylated 5-methyltetrahydrofolate (PMID:10799479), but it supplies a
  co-substrate and is kept outside the module, like sulfide supply and the
  MET13/MET12 methylenetetrahydrofolate reductases. All yeast activities are
  cytosolic in the GO-CAMs; no module-level compartment is asserted because
  plant steps up to cystathionine are plastidial. GO-CAM disagreements: (a) SGD
  models type MET17 with the broader GO:0003961, whereas PomBase uses
  GO:0051009; (b) YeastPathways_P4-PWY-1 (threonine superpathway) chains MET6
  -> MET17 -> MET2 -> THR1 with causally-upstream edges, the reverse of the
  biosynthetic order; (c) the PomBase model places S. pombe met3
  (cystathionine gamma-synthase) in GO:0019344 cysteine biosynthesis although
  S. pombe lacks the reverse trans-sulfuration enzymes (recorded as a source
  defect in the met3 review); (d) the PomBase model includes two
  uncharacterised FAD-binding proteins (SPAC1783.01, SPBC12C2.03c) typed as
  GO:0030586 [methionine synthase] reductase, upstream of the
  cobalamin-independent met26. That reductase reactivates cobalamin-dependent
  MetH-type synthases, and S. pombe has no MetH, so these activities are not
  adopted.
module:
  id: methionine_biosynthesis
  label: L-methionine biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: de novo L-methionine biosynthesis
      term:
        id: GO:0071266
        label: "'de novo' L-methionine biosynthetic process"
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-954
      title: 'superpathway of methionine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with HOM3, HOM2, HOM6, MET2, MET17, MET6 and MET7 in
        cytosol, part_of GO:0071265; the only causal edge is MET7 upstream of
        MET6.
    - model: gomodel:YeastPathways_PWY-5344
      title: 'L-homocysteine biosynthesis - imported from: Saccharomyces Genome Database'
      description: MET2 and MET17 activities in cytosol, part_of GO:0071269.
    - model: gomodel:YeastPathways_PWY3O-238
      title: 'methionine biosynthesis - imported from: Saccharomyces Genome Database'
      description: MET6 and MET7 activities in cytosol, part_of GO:0071265.
    - model: gomodel:66a3e0bb00001342
      title: >-
        'de novo' L-methionine biosynthetic process (GO:0071266), sulfate
        assimilation (GO:0000103), sulfite transmembrane transport
        (GO:0000316), sulfate import across plasma membrane (GO:1902434)
      description: >-
        PomBase S. pombe model. The module-relevant activities are met6
        (homoserine O-acetyltransferase), met17 (O-acetylhomoserine
        sulfhydrylase), met3 (cystathionine gamma-synthase) and met26
        (cobalamin-independent methionine synthase), all cytosolic. Sulfate
        uptake and assimilation, SAM synthesis (sam1), adenosylhomocysteinase
        (sah1) and cystathionine beta-synthase belong to other modules.
  parts:
    - order: 1
      role: acylation of homoserine (succinyl or acetyl)
      node:
        id: acylation
        label: Homoserine activation by acylation
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: acyltransferase
            label: Homoserine acyltransferase
            axis: acyl donor
            selection: ONE_OR_MORE
            variants:
              - id: o_succinyl_activation
                label: O-succinylhomoserine formation
                module_type: REACTION
                annotons:
                  - id: homoserine_o_succinyltransferase_activity
                    label: Homoserine O-succinyltransferase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metA (homoserine O-succinyltransferase)
                      family:
                        preferred_term: >-
                          homoserine O-succinyltransferases with verified donor
                          specificity
                        description: >-
                          Homoserine O-succinyltransferases arose independently
                          in two unrelated folds, the MetA family (PTHR20919)
                          and the alpha/beta-hydrolase MetX family
                          (PTHR32268:SF11). Both families also contain
                          acetyl-CoA-specific members, so the families are
                          listed for orientation and the succinyltransferase
                          function, not the family, selects members
                          (PMID:28581482).
                        family_terms:
                          - id: PANTHER:PTHR20919
                            label: HOMOSERINE O-SUCCINYLTRANSFERASE
                          - id: PANTHER:PTHR32268:SF11
                            label: HOMOSERINE O-ACETYLTRANSFERASE
                        representative_members:
                          - preferred_term: MetA (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P07623
                              label: Homoserine O-succinyltransferase
                            description: >-
                              The MetA-fold homoserine O-succinyltransferase of
                              E. coli, the seed of the PAINT node that carries
                              this activity in PTHR20919.
                          - preferred_term: MetXS (PSEPK)
                            term:
                              id: UniProtKB:Q88CT3
                              label: Homoserine O-succinyltransferase
                            description: >-
                              Experimentally supported succinyl-CoA-specific
                              exemplar. The PANTHER label does not capture the
                              donor specificity of this member.
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN000467771
                            term:
                              id: PANTHER:PTN000467771
                              label: PTN000467771
                            description: >-
                              PAINT IBD node in PTHR20919 asserting GO:0008899,
                              seeded by E. coli MetA (P07623). The family review
                              records that acetyl-specific MetA-fold members
                              descend from it.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000467771 in PTHR20919.
                    function:
                      preferred_term: homoserine O-succinyltransferase activity
                      term:
                        id: GO:0008899
                        label: homoserine O-succinyltransferase activity
                    role_description: Activates homoserine to O-succinyl-L-homoserine.
              - id: o_acetyl_activation
                label: O-acetylhomoserine formation
                module_type: REACTION
                annotons:
                  - id: homoserine_o_acetyltransferase_activity
                    label: Homoserine O-acetyltransferase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: metX (homoserine O-acetyltransferase)
                      family:
                        preferred_term: homoserine O-acetyltransferases
                        description: >-
                          Grounded to the MetX subfamily PTHR32268:SF11, which
                          holds all three exemplars, and constrained by the
                          acetyltransferase function, because the subfamily also
                          contains succinyl-CoA-specific members such as PSEPK
                          MetXS (PMID:28581482).
                        family_terms:
                          - id: PANTHER:PTHR32268:SF11
                            label: HOMOSERINE O-ACETYLTRANSFERASE
                        representative_members:
                          - preferred_term: MetX (Mycobacterium tuberculosis)
                            term:
                              id: UniProtKB:P9WJY9
                              label: Homoserine O-acetyltransferase
                            description: >-
                              M. tuberculosis MetXA (Rv3341), shown to be
                              acetyl-CoA-specific with no succinyltransferase
                              activity (PMID:32976971).
                          - preferred_term: MET2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P08465
                              label: Homoserine O-acetyltransferase
                            description: >-
                              S. cerevisiae MET2/YNL277W, a MetX-fold enzyme
                              (PMID:3552887).
                          - preferred_term: met6 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:O60062
                              label: Homoserine O-acetyltransferase
                            description: >-
                              S. pombe met6/SPBC56F2.11. The S. pombe symbol
                              met6 names this acetyltransferase, not the
                              methionine synthase (S. pombe met26).
                    function:
                      preferred_term: homoserine O-acetyltransferase activity
                      term:
                        id: GO:0004414
                        label: homoserine O-acetyltransferase activity
                    role_description: Activates homoserine to O-acetyl-L-homoserine.
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY-5344
                        activity: gomodel:HOMOSERINE-O-ACETYLTRANSFERASE-RXN
                        title: 'L-homocysteine biosynthesis - imported from: Saccharomyces Genome Database'
                        description: MET2 enables GO:0004414 in cytosol.
                      - model: gomodel:YeastPathways_PWY3O-954
                        activity: gomodel:HOMOSERINE-O-ACETYLTRANSFERASE-RXN
                        title: 'superpathway of methionine biosynthesis - imported from: Saccharomyces Genome Database'
                        description: MET2 enables GO:0004414 in cytosol.
                      - model: gomodel:66a3e0bb00001342
                        activity: gomodel:66a3e0bb00001342/678073a900003752
                        title: "'de novo' L-methionine biosynthetic process (GO:0071266) (S. pombe)"
                        description: S. pombe met6 enables GO:0004414 in cytosol.
    - order: 2
      role: sulfur incorporation to homocysteine (trans-sulfuration or direct)
      node:
        id: sulfur_incorporation
        label: Sulfur incorporation to homocysteine
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: sulfur_route
            label: Sulfur-incorporation route
            axis: sulfur source
            selection: ONE_OR_MORE
            variants:
              - id: trans_sulfuration
                label: Trans-sulfuration (metB + metC)
                module_type: METABOLIC_PATHWAY
                description: Two enzymes, drawing sulfur from cysteine via cystathionine.
                parts:
                  - order: 1
                    role: cystathionine formation
                    node:
                      id: metB_node
                      label: Cystathionine gamma-synthase
                      module_type: REACTION
                      annotons:
                        - id: metB_activity
                          label: "metB: cystathionine gamma-synthase"
                          participant:
                            selector_type: FAMILY
                            gene:
                              preferred_term: metB (cystathionine gamma-synthase)
                            family:
                              preferred_term: cystathionine gamma-synthases
                              description: >-
                                Cystathionine gamma-synthases from different
                                lineages sit in three PANTHER families; each
                                listed subfamily contains its representative.
                                The acyl or phosphoryl donor (O-succinyl-,
                                O-acetyl- or O-phospho-L-homoserine) follows the
                                organism's activation route, not the family.
                              family_terms:
                                - id: PANTHER:PTHR11808:SF75
                                  label: CYSTATHIONINE GAMMA-SYNTHASE
                                - id: PANTHER:PTHR42699:SF1
                                  label: CYSTATHIONINE GAMMA-SYNTHASE-RELATED
                                - id: PANTHER:PTHR43379:SF1
                                  label: CYSTATHIONINE GAMMA-SYNTHASE 1, CHLOROPLASTIC-RELATED
                              representative_members:
                                - preferred_term: MetB (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P00935
                                    label: Cystathionine gamma-synthase
                                - preferred_term: STR2 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P47164
                                    label: Cystathionine gamma-synthase
                                  description: >-
                                    S. cerevisiae STR2/YJR130C; its disruption
                                    blocks conversion of cysteine to
                                    homocysteine (PMID:10821189).
                                - preferred_term: met3 (Schizosaccharomyces pombe)
                                  term:
                                    id: UniProtKB:O74314
