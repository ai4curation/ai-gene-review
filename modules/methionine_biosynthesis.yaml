  connections:
    - source: o_succinyl_activation
      target: direct_sulfhydrylation_metZ
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Homoserine O-succinyltransferase supplies O-succinyl-L-homoserine to
        the MetZ direct-sulfhydrylation route.
    - source: o_acetyl_activation
      target: direct_sulfhydrylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Homoserine O-acetyltransferase supplies O-acetyl-L-homoserine to the
        MetY direct-sulfhydrylation route.
    - source: acylation
      target: trans_sulfuration
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Trans-sulfuration uses an activated homoserine substrate; the accepted
        acetyl or succinyl form depends on the organism's MetB chemistry.
    - source: acylation
      target: sulfur_incorporation
      connection_type: PRECEDES
      description: >-
        Homoserine activation precedes sulfur incorporation at the reusable
        stage level; the more specific edges above preserve substrate matching.
    - source: sulfur_incorporation
      target: methylation
      connection_type: PRECEDES
  notes: >-
    The module records biochemical alternatives, not universal gene-name
    requirements. Homoserine acyltransferase and Cys/Met PLP-enzyme families can
    contain members with different substrates or reaction directions, and some
    proteins are bifunctional across the nominal routes. Exact activity evidence
    therefore takes precedence over a family label when instantiating the
    template in a genome. A MetH-only implementation is conditional on
    cobalamin availability. Per-genome candidates are keyed by KEGG Orthology:
    metA=K00651, metX=K00641, metB=K01739, metC=K01760, metY=K01740,
    metE=K00549, and metH=K00548. MetZ/O-succinylhomoserine sulfhydrylase and
    partial MetE-like proteins require species-aware review beyond those KO
    mappings. See modules/experimental/gluconeogenesis-context/kegg_oracle.py
    and modules/experimental/gluconeogenesis-context/resolve_genomes.py for
    per-genome route resolution and gap detection.
