      switching to nucleate hexameric tube polymerization along the gpH tape measure template remains structurally unresolved
      at atomic resolution, alongside the lack of dedicated GO molecular function terms for tape-measure length determination
      and frameshift tail-assembly chaperones.
    boundary: Capture the programmed -1 frameshift relationship between gpG and gpGT and the length-ruler role of gpH in role
      descriptions and gene notes.
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
    - CURATION
