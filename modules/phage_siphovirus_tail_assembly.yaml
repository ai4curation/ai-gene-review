id: MODULE:phage_siphovirus_tail_assembly
title: Siphovirus long flexible non-contractile tail assembly and receptor adsorption
description: A morphogenetic assembly and host-entry pathway conserved across siphoviruses (long non-contractile tailed bacteriophages
  of class Caudoviricetes) and homologous to the inner tail-tube/baseplate-hub core of contractile myoviruses and type VI
  secretion systems. Assembly begins at the distal tip with the host entry-receptor attachment protein gpJ, which sequentially
  recruits the tail tip initiator proteins gpI, gpL (an [4Fe-4S] cluster-binding hub component), and gpK (a peptidoglycan-active
  NlpC/P60-domain protein) together with the tape measure protein gpH and gpM. The chaperone gpG and its programmed -1 ribosomal
  frameshift fusion product gpGT coat the alpha-helical tape measure protein gpH and recruit the major tail tube subunit gpV,
  which polymerizes into 31 to 32 stacked hexameric rings along the gpH scaffold until reaching its N-terminus. The hexameric terminator
  protein gpU caps the completed tube, gpH is proteolytically matured to gpH*, and the tail completion protein gpZ renders
  the mature tail competent to join the gpW/gpFII-plugged DNA-filled head. Optional side tail fibers (Stf, folded with the
  Tfa chaperone) attach to the collar/tail to mediate rapid reversible primary adsorption before irreversible gpJ engagement
  of the outer membrane receptor triggers gpH*-mediated DNA ejection across the host envelope.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:23911548
  title: Chaperone-protein interactions that mediate assembly of the bacteriophage lambda tail to the correct length.
  statement: Establishes the mechanism by which tail assembly chaperones gpG and gpGT bind the tape measure protein gpH and
    recruit major tail subunit gpV to assemble the lambda tail to its programmed length.
- source_id: PMID:19251647
  title: The phage lambda major tail protein structure reveals a common evolution for long-tailed phages and the type VI bacterial
    secretion system.
  statement: Resolves the structure of the phage lambda major tail tube subunit gpV and establishes the evolutionary conservation
    of long-tailed bacteriophage tail tubes.
- source_id: GO:0098003
  title: viral tail assembly
  statement: Defines the morphogenetic assembly of the bacteriophage tail structure.
- source_id: GO:0099001
  title: symbiont genome ejection through host cell envelope, long flexible tail mechanism
  statement: Defines genome delivery into the host cell through a long flexible non-contractile siphovirus tail.
notes: 'Exemplar phage: Escherichia phage lambda (NCBITaxon:2681611). Generalizes across long non-contractile tailed phages
  (siphoviruses such as coliphages HK97, T5, SPP1, and mycobacteriophages) that share the distal tail tip initiator -> G/GT-chaperoned
  tape measure -> hexameric tail tube -> terminator assembly cascade.'
