id: MODULE:dmel_cyclin_k_cdk12_complex
title: Cyclin K-Cdk12 complex in Drosophila melanogaster
description: >-
  Cdk12 and its partner cyclin K form a transcription-associated kinase that phosphorylates
  the C-terminal domain of elongating RNA polymerase II. CDK12 activity supports productive
  elongation and co-transcriptional processing, particularly of long genes. In Drosophila,
  Cdk12 has also been implicated in the control of transcription and chromatin silencing.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002118
  title: 'FlyBase gene group CLNK-C12: Cyclin k-cdk12 complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as cyclin k-cdk12 complex (CLNK-C12);
    this module models that group.
- source_id: GO:0002944
  title: cyclin K-CDK12 complex
  statement: >-
    GO term grounding the module as cyclin K-CDK12 complex.
notes: >-
  Cyclin K also partners with Cdk13 in mammals; no Cdk13 complex is grouped by FlyBase. FlyBase
  groups realized by this module: CLNK-C12 (FBgg0002118). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cyclin_k_cdk12_complex.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
