id: MODULE:cell_cycle_progression
title: Mitotic cell cycle progression (phase-transition control)
description: >-
  An umbrella module that composes the three irreversible, cyclin-CDK-gated
  phase transitions of the mitotic cell cycle into one cycle: (1) the G1/S
  transition (Start / restriction point), at which growth-coupled G1 cyclin-CDK
  releases the G1/S transcription program and SCF-dependent destruction of the
  CDK inhibitor commits the cell to S phase (MODULE:g1_s_transition); (2) the
  G2/M transition, at which the Wee1 / Cdc25 switch activates cyclin B-CDK1
  and commits the cell to mitosis (MODULE:g2_m_transition); and (3) the
  metaphase/anaphase transition and mitotic exit, at which SAC-gated APC/C-Cdc20
  destroys securin and the mitotic cyclins, separase cleaves cohesin, and a
  CDK-counteracting phosphatase resets the G1 state
  (MODULE:metaphase_anaphase_transition_and_mitotic_exit). The unifying logic
  is a single oscillator of cyclin-dependent kinase activity - rising from
  Start through mitotic entry and collapsing at mitotic exit - whose
  thresholds are made irreversible by positive-feedback proteolysis (SCF at
  G1/S, APC/C at M/A and exit) and by mutual antagonism between CDK and its
  inhibitors (CKIs, Wee1, PP2A-B55). Each part here is a compact summary node
  that names the phase-specific cyclin-CDK holoenzyme and the proteolytic
  switch; the detailed decompositions live in the three referenced modules.
  Representative members are drawn from human, Saccharomyces cerevisiae and
  Schizosaccharomyces pombe. Grounded in GO:0044772 (mitotic cell cycle phase
  transition).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0044772
    title: mitotic cell cycle phase transition
    statement: The umbrella is grounded in the GO term for mitotic cell cycle phase transitions.
  - source_id: GO:0000278
    title: mitotic cell cycle
    statement: The composed cycle is the mitotic cell cycle.
  - source_id: file:modules/g1_s_transition.yaml
    title: G1/S transition of the mitotic cell cycle (Start / restriction point)
    statement: Detailed decomposition of part 1.
  - source_id: file:modules/g2_m_transition.yaml
    title: G2/M transition of the mitotic cell cycle (mitotic entry)
    statement: Detailed decomposition of part 2.
  - source_id: file:modules/metaphase_anaphase_transition_and_mitotic_exit.yaml
    title: Metaphase/anaphase transition and mitotic exit (APC/C-driven)
    statement: Detailed decomposition of part 3.
  - source_id: PMID:9442875
    title: "Cyclin-dependent kinases: engines, clocks, and microprocessors"
    statement: >-
      Review establishing cyclin-CDK complexes as the engine that orders the
      phase transitions of the cell cycle.
  - source_id: PMID:4587263
    title: Genetic control of the cell division cycle in yeast
    statement: >-
      The cdc mutant collection of budding yeast defined the dependent sequence
      of cell-cycle events and the concept of Start.
  - source_id: PMID:1165770
    title: Genetic control of cell size at cell division in yeast
    statement: >-
      The wee mutants of fission yeast identified the G2/M size control and the
      cdc2/wee1 genes.
  - source_id: PMID:3553962
    title: Complementation used to clone a human homologue of the fission yeast cell cycle control gene cdc2
    statement: >-
      Human CDK1 complements fission-yeast cdc2, establishing that the CDK
      engine is conserved from yeast to human and justifying the shared
      representative-member scheme used here.
  - source_id: PMID:18813291
    title: "Cyclin-dependent kinases and cell-cycle transitions: does one fit all?"
    statement: >-
      Review of the quantitative CDK-activity model in which a single CDK can
      order S phase and mitosis, and of the metazoan division of labour among
      CDK4/6, CDK2 and CDK1.
  - source_id: PMID:21179163
    title: Driving the cell cycle with a minimal CDK control network
    statement: >-
      A single cyclin-CDK fusion suffices to drive ordered S phase and mitosis in
      fission yeast, supporting the oscillator model that unifies the three
      transitions.
  - source_id: PMID:19884882
    title: "Cyclin-dependent kinases: a family portrait"
    statement: Nomenclature and phylogeny of the CDK family across eukaryotes.
  - source_id: PMID:17912263
    title: Finishing mitosis, one step at a time
    statement: Review of the ordered proteolysis and dephosphorylation events that close the cycle.
notes: >-
  This umbrella deliberately stays at the level of the three transitions and
  their cyclic ordering; it does not model S-phase execution (origin licensing
  and firing, DNA replication), mitotic execution (spindle assembly,
  chromosome condensation, cytokinesis) or the checkpoint pathways that feed
  into each transition, each of which is or will be a separate module. The
  three part nodes intentionally duplicate the phase-specific CDK annotons of
  the referenced modules so that the umbrella page is self-contained for
  gene-review joins; the detailed modules are the authority on step structure.
  The umbrella does not use conforms_to because the conformance checker
  matches function-term tiers in order, which is not the relation between a
  summary node and a multi-part module. Deep research: no module deep-research
  report accompanies this file (no provider credentials were available in the
  authoring session; hand-writing one under a provider name is prohibited).
