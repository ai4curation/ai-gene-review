  connections:
    - source: g1_s
      target: g2_m
      connection_type: PRECEDES
      description: >-
        Commitment at Start precedes mitotic entry; S phase and G2 (DNA
        replication, growth, checkpoint surveillance) intervene and are outside
        this module.
      chaining_status: NOT_APPLICABLE
      chaining_note: Temporal ordering of cell-cycle transitions; not a metabolic step.
    - source: g2_m
      target: m_a_exit
      connection_type: PRECEDES
      description: >-
        Active cyclin B-CDK1 phosphorylates and primes the APC/C, and mitotic
        events (spindle assembly, kinetochore attachment) intervene before
        anaphase onset.
      chaining_status: NOT_APPLICABLE
      chaining_note: Temporal ordering of cell-cycle transitions.
    - source: g2_m
      target: m_a_exit
      connection_type: POSITIVELY_REGULATES
      description: CDK1 phosphorylation of APC/C subunits relieves autoinhibition and permits Cdc20 binding.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory phosphorylation edge.
    - source: m_a_exit
      target: g1_s
      connection_type: PRECEDES
      description: >-
        Mitotic exit resets the low-CDK G1 state (Cdh1-APC/C active, CKI
        re-accumulated, corepressor dephosphorylated) from which the next Start
        is executed, closing the cycle.
      chaining_status: NOT_APPLICABLE
      chaining_note: Cyclic re-entry edge.
    - source: m_a_exit
      target: g1_s
      connection_type: NEGATIVELY_REGULATES
      description: >-
        APC/C-Cdh1 activity and re-accumulated CKI keep S-phase cyclin-CDK off
        through G1 until the G1/S switch overrides them.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory edge.
