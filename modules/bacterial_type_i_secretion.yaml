id: MODULE:bacterial_type_i_secretion
title: Bacterial type I secretion
description: >-
  A species-neutral module for one-step export of a cytoplasmic protein across
  both membranes of a diderm bacterium through a tripartite type I secretion
  conduit. An inner-membrane ABC transporter recognizes an uncleaved secretion
  signal in its substrate and hydrolyzes ATP; a periplasmic membrane-fusion
  adaptor anchored in the inner membrane bridges to, and opens, an oligomeric
  outer-membrane exit duct. Because the three components form a continuous
  channel, the substrate never appears as a folded periplasmic intermediate.
  Substrate maturation before export, folding and cofactor acquisition after
  release, Sec- and Tat-dependent routes, and small-molecule efflux through the
  same family of outer-membrane ducts are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0030253
  title: protein secretion by the type I secretion system
  statement: >-
    GO:0030253 defines the biological process modeled by this module, and its
    definition supplies the two boundary criteria used here: secretion occurs as
    a continuous process without a distinct periplasmic intermediate, and the
    secreted protein is not proteolytically processed.
- source_id: GO:0030256
  title: type I protein secretion system complex
  statement: >-
    GO:0030256 identifies the assembled envelope-spanning machinery represented
    by the three conserved module parts.
- source_id: PMID:9822594
  title: >-
    Substrate-induced assembly of a contiguous channel for protein export from
    E.coli: reversible bridging of an inner-membrane translocase to an outer
    membrane exit pore.
  statement: >-
    Establishes that the inner-membrane translocase and the outer-membrane exit
    pore are bridged into one contiguous channel, and that the bridging is
    substrate-induced and reversible rather than a standing assembly. This is
    the basis for modeling the adaptor as causally opening the exit duct.
- source_id: PMID:10879525
  title: >-
    Crystal structure of the bacterial membrane protein TolC central to
    multidrug efflux and protein export.
  statement: >-
    The TolC structure defines the outer-membrane factor fold as a gated
    channel-tunnel shared between protein export and multidrug efflux, which is
    why efflux use of the same duct is placed outside this module rather than
    treated as a variant of it.
- source_id: PMID:24129268
  title: The Type 1 secretion pathway - the hemolysin system and beyond.
  statement: >-
    Reviews the hemolysin paradigm and the wider type 1 landscape, including the
    distinction between ABC transporters that merely export their substrate and
    those carrying an N-terminal peptidase domain that also process it. This
    supports the ABC-transporter subclass variant set.
notes: |-
  ## Boundary

  The module begins when an ABC transporter engages a cytoplasmic substrate bearing
  an uncleaved type I secretion signal and ends when that substrate leaves the
  outer-membrane duct. Only the three conserved machinery parts are admitted. Cargo
  proteins are deliberately excluded, in line with the sibling type II and type VI
  modules, because the same conduit serves unrelated substrate classes; the
  cargo-dependent features that do belong to the machinery are captured as an
  ABC-transporter subclass variant.

  Two things commonly conflated with this module are excluded on structural grounds.
  First, outer-membrane factors of the TolC family are shared with
  resistance-nodulation-division and major-facilitator efflux pumps, so the presence
  of a TolC-like duct is not evidence of protein secretion. Second, substrate
  acylation or other maturation performed by dedicated accessory enzymes acts on the
  substrate before engagement and is not part of the transport step.

  Ontology and curation gaps are recorded in these notes rather than as
  `knowledge_gaps`, which CLAUDE.md reserves for biological unknowns that only new
  experiments could close. None of the items below is a biological unknown: a term
  request or a curator would resolve each one.

  ## Ontology gap: the duct's molecular function cannot distinguish its two uses

  The molecular function asserted for the outer-membrane duct cannot distinguish
  protein cargo from small-molecule cargo. The efflux transporter term is what every
  outer-membrane factor carries, and its definition does cover a protein substrate,
  but using one term for both uses makes type I protein secretion indistinguishable
  from drug efflux to anything reading the annotations.

  **Asserted instead.** Use the family-wide efflux transporter term and keep the two
  uses separate in prose and in the module's part structure, rather than asserting a
  protein-transporter term that no outer-membrane factor carries.

  This gap is now a formal term request in
  `genes/ECOLI/tolC/tolC-ai-review.yaml` under `proposed_new_terms`.

  ## Ontology gap: no term for the membrane-fusion protein role

  No GO molecular-function term expresses the membrane-fusion protein role, so the
  periplasmic adaptor is annotated with the generic structural molecule activity.
  This loses the specific claim that the protein couples two membrane components and
  gates a shared channel.

  **Asserted instead.** Keep structural molecule activity as a placeholder on the
  adaptor rather than substituting a transporter term it does not deserve, and record
  the adaptor role in prose until a suitable term exists.
module:
  id: bacterial_type_i_secretion
  label: Bacterial type I secretion
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein secretion by the type I secretion system
    term:
      id: GO:0030253
      label: protein secretion by the type I secretion system
    description: >-
      Continuous export of a cytoplasmic substrate to the cell exterior through
      a tripartite conduit, without a periplasmic intermediate.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: >-
        Diderm bacteria, where a second membrane makes the outer-membrane duct
        and the periplasmic adaptor necessary.
  parts:
  - order: 1
    role: >-
      Recognize the substrate's uncleaved secretion signal and hydrolyze ATP to
      drive it across the inner membrane
    node:
      id: inner_membrane_abc_translocase
      label: Type I secretion inner-membrane ABC translocase
      module_type: TRANSPORT_STEP
      description: >-
        The ABC transporter is the entry point and the energizing component of
        the conduit. It binds the substrate's C-terminal secretion signal
        directly from the cytoplasm, so no cytoplasmic targeting factor or
        cleavable N-terminal signal peptide is involved. Transporters of this
        class divide according to whether they also process their substrate.
      variant_sets:
      - id: abc_transporter_subclass
        label: ABC transporter subclass
        axis: substrate-processing capability of the ABC transporter
        selection: EXACTLY_ONE
        notes: >-
          The axis is a property of the transporter, not of the cargo: an
          exporter either carries an N-terminal cytoplasmic peptidase domain
          that cleaves a leader from its substrate or it does not. Only the
          non-processing subclass satisfies the GO:0030253 requirement that the
          secreted protein is not proteolytically processed, so the processing
          subclass is recorded here as a recognized divergence from the
          canonical definition rather than silently merged into it.
        variants:
        - id: non_processing_abc_exporter
          label: Non-processing type I ABC exporter
          module_type: TRANSPORT_STEP
          description: >-
            The canonical subclass, exemplified by the hemolysin exporter HlyB
            and the protease exporters PrtD and AprD. The substrate is exported
            intact and its secretion signal is never removed.
          annotons:
          - id: hlyb_abc_exporter
            label: HlyB-type protein-exporting ABC transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: HlyB/PrtD/AprD-type protein-exporting ABC transporter family
                family_terms:
                - id: PANTHER:PTHR43394
                  label: "ATP-DEPENDENT PERMEASE MDL1, MITOCHONDRIAL"
                - id: PANTHER:PTHR24222
                  label: "ABC TRANSPORTER B FAMILY"
                representative_members:
                - preferred_term: HlyB (Escherichia coli)
                  term:
                    id: UniProtKB:P08716
                    label: Alpha-hemolysin translocation ATP-binding protein HlyB
                - preferred_term: PrtD (Dickeya chrysanthemi)
                  term:
                    id: UniProtKB:P23596
                    label: Proteases secretion ATP-binding protein PrtD
                - preferred_term: AprD (Pseudomonas aeruginosa)
                  term:
                    id: UniProtKB:Q03024
                    label: Alkaline protease secretion ATP-binding protein AprD
            function:
              preferred_term: protein-exporting ATPase activity
              term:
                id: GO:0008564
                label: protein-exporting ATPase activity
              description: >-
                ATP hydrolysis coupled to movement of an intact protein
                substrate across the inner membrane.
            processes:
            - preferred_term: protein secretion by the type I secretion system
              term:
                id: GO:0030253
                label: protein secretion by the type I secretion system
            locations:
            - preferred_term: plasma membrane
              term:
                id: GO:0005886
                label: plasma membrane
            role_description: >-
              Binds the substrate's uncleaved secretion signal at the
              cytoplasmic face and energizes its passage through the conduit.
        - id: processing_abc_exporter
          label: Processing type I ABC exporter
          module_type: TRANSPORT_STEP
          description: >-
            A subclass whose ABC transporter carries an N-terminal cytoplasmic
            peptidase domain, so export and leader cleavage are performed by the
            same protein. The colicin V exporter CvaB is the Escherichia coli
            exemplar; UniProt records the dual activity in its recommended name.
          annotons:
          - id: cvab_processing_abc_exporter
            label: CvaB-type processing ABC exporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CvaB-type peptidase-containing ABC exporter family
                term:
                  id: PANTHER:PTHR24221:SF606
                  label: "COLICIN V SECRETION-PROCESSING ATP-BINDING PROTEIN"
                representative_members:
                - preferred_term: CvaB (Escherichia coli)
                  term:
                    id: UniProtKB:P22520
                    label: Colicin V secretion/processing ATP-binding protein CvaB
            function:
              preferred_term: protein-exporting ATPase activity
              term:
                id: GO:0008564
                label: protein-exporting ATPase activity
              description: >-
                The export activity shared with the non-processing subclass;
                the additional peptidase activity is a property of a separate
                N-terminal domain and is not asserted here.
            processes:
            - preferred_term: protein secretion by the type I secretion system
              term:
                id: GO:0030253
                label: protein secretion by the type I secretion system
            locations:
            - preferred_term: plasma membrane
              term:
                id: GO:0005886
                label: plasma membrane
            role_description: >-
              Exports its substrate through the same tripartite conduit while
              removing an N-terminal leader, which places it outside the strict
              GO:0030253 definition.
            notes: >-
              The peptidase domain's catalytic activity is deliberately left
              unasserted. UniProt's name records processing, but assigning a
              specific peptidase GO term to this exemplar would go beyond what
              the entry states.
  - order: 2
    role: Bridge the inner-membrane transporter to the outer-membrane duct
    node:
      id: periplasmic_adaptor_bridge
      label: Type I secretion periplasmic adaptor bridge
      module_type: PROTEIN_COMPLEX
      description: >-
        The membrane-fusion protein is anchored in the inner membrane by a
        single span and projects a long periplasmic domain that oligomerizes
        around the conduit. Its function is architectural: it holds the two
        membrane components in register and transmits substrate engagement to
        the outer-membrane duct.
      annotons:
      - id: hlyd_membrane_fusion_protein
        label: HlyD-type membrane-fusion adaptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: HlyD/PrtE/CvaA-type membrane-fusion protein family
            term:
              id: PANTHER:PTHR30386
              label: "MEMBRANE FUSION SUBUNIT OF EMRAB-TOLC MULTIDRUG EFFLUX PUMP"
            representative_members:
            - preferred_term: HlyD (Escherichia coli, plasmid-encoded)
              term:
                id: UniProtKB:P06739
                label: Hemolysin secretion protein D, plasmid
            - preferred_term: PrtE (Dickeya chrysanthemi)
              term:
                id: UniProtKB:P23597
                label: Proteases secretion protein PrtE
            - preferred_term: CvaA (Escherichia coli, processing-subclass adaptor)
              term:
                id: UniProtKB:P22519
                label: Colicin V secretion protein CvaA
        function:
          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
          description: >-
            Used as the closest available molecular function for an
            architectural adaptor. No GO term expresses the membrane-fusion
            protein role itself; see the knowledge gaps.
        processes:
        - preferred_term: protein secretion by the type I secretion system
          term:
            id: GO:0030253
            label: protein secretion by the type I secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
          description: >-
            Anchored in the inner membrane, with the bulk of the protein
            extending into the periplasm.
        role_description: >-
          Oligomerizes around the conduit, couples the transporter to the exit
          duct, and communicates substrate engagement to it.
  - order: 3
    role: Provide the gated outer-membrane exit for the substrate
    node:
      id: outer_membrane_exit_duct
      label: Type I secretion outer-membrane exit duct
      module_type: PROTEIN_COMPLEX
      description: >-
        A trimeric channel-tunnel that spans the outer membrane as a beta-barrel
        and continues into the periplasm as a long alpha-helical barrel. It is
        closed at its periplasmic end until the adaptor opens it, which is what
        keeps the envelope sealed between secretion events.
      annotons:
      - id: tolc_outer_membrane_factor
        label: TolC-type outer-membrane factor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: TolC/PrtF/AprF outer-membrane factor family
            term:
              id: PANTHER:PTHR30026:SF20
              label: "OUTER MEMBRANE PROTEIN TOLC"
            representative_members:
            - preferred_term: TolC (Escherichia coli)
              term:
                id: UniProtKB:P02930
                label: Outer membrane protein TolC
            - preferred_term: PrtF (Dickeya chrysanthemi)
              term:
                id: UniProtKB:P23598
                label: Proteases secretion protein PrtF
            - preferred_term: AprF (Pseudomonas aeruginosa)
              term:
                id: UniProtKB:Q03027
                label: Alkaline protease secretion protein AprF
        function:
          preferred_term: efflux transmembrane transporter activity
          term:
            id: GO:0015562
            label: efflux transmembrane transporter activity
          description: >-
            The duct conducts the substrate across the outer membrane; it
            contributes no chemistry and consumes no energy. The term is
            substrate-general on purpose: its definition covers transfer of a
            substance from inside the cell to the outside without naming the
            cargo class, which is what an outer-membrane factor does.
        processes:
        - preferred_term: protein secretion by the type I secretion system
          term:
            id: GO:0030253
            label: protein secretion by the type I secretion system
        locations:
        - preferred_term: cell outer membrane
          term:
            id: GO:0009279
            label: cell outer membrane
        role_description: >-
          Forms the gated outer-membrane channel-tunnel through which the
          substrate reaches the cell exterior.
        evidence:
        - source_id: file:ECOLI/tolC/tolC-ai-review.yaml
          statement: >-
            The focused review of TolC retains this molecular function nine times
            over and uses it in two of its three core functions, including the one
            covering protein secretion. It declines to assert a protein-specific
            transporter term on a comparator check verified here: PrtF, AprF and
            TolC all carry the efflux transporter term, and no outer-membrane
            factor anywhere carries the protein-transporter term.
        notes: >-
          The same protein serves resistance-nodulation-division and
          major-facilitator efflux pumps. Membership in this family is therefore
          not evidence that a given organism performs type I protein secretion.
          This annoton previously asserted transmembrane protein transporter
          activity, which reads more naturally in a protein-secretion module but
          put the module at odds with its own gene review and with every other
          outer-membrane factor in GO. The family-wide term is used instead, and
          the loss of the cargo distinction is recorded as a knowledge gap.
  connections:
  - source: inner_membrane_abc_translocase
    target: periplasmic_adaptor_bridge
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The engaged substrate passes from the transporter into the periplasmic
      section of the conduit held by the adaptor.
  - source: periplasmic_adaptor_bridge
    target: outer_membrane_exit_duct
    connection_type: CAUSES
    description: >-
      Substrate engagement is transmitted through the adaptor, which bridges to
      the duct and opens its periplasmic gate. The bridging is reversible, so
      the connection is a substrate-induced event rather than a standing
      architectural relation.
  knowledge_gaps:
  - gap_statement: >-
      Whether the tripartite complex is pre-assembled or assembles on substrate
      engagement, and with what subunit stoichiometry, is resolved for some
      systems and assumed for others.
    boundary: >-
      Model the adaptor-to-duct link as a substrate-induced causal connection
      and assert no stoichiometry for any part.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      It is not established how widely the processing subclass extends, nor
      whether its peptidase domain is required for transport as well as for
      leader removal.
    boundary: >-
      Keep the processing subclass as one variant grounded in a single exemplar,
      and assert no peptidase molecular function for it.
    gap_kind:
    - BIOLOGY
