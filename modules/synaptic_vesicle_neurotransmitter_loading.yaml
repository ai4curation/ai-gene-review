  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: neurotransmitter loading into synaptic vesicle
      term:
        id: GO:0098700
        label: neurotransmitter loading into synaptic vesicle
      description: Proton-gradient-driven concentration of transmitter into the vesicle lumen.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
