id: MODULE:synaptic_vesicle_neurotransmitter_loading
title: Neurotransmitter loading into synaptic vesicles
description: >-
  The vesicle-filling stage of the synaptic vesicle cycle. The vacuolar-type
  H+-ATPase on the synaptic vesicle membrane hydrolyses ATP to pump protons into
  the lumen, generating a proton electrochemical gradient (a pH gradient plus a
  lumen-positive membrane potential). A vesicular neurotransmitter transporter
  then uses that gradient to concentrate transmitter into the vesicle against a
  steep concentration gradient. The transporter identity sets the transmitter
  phenotype of the terminal: VGLUT1/2/3 (SLC17A6/7/8) for glutamate, VGAT
  (SLC32A1) for GABA and glycine, VMAT2 (SLC18A2) for monoamines, and VAChT
  (SLC18A3) for acetylcholine. The module is modeled with human exemplars but
  the acidify -> load topology is conserved across metazoan chemical synapses.
  Grounded in GO:0098700 (neurotransmitter loading into synaptic vesicle) and
  GO:0097401 (synaptic vesicle lumen acidification).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0098700
    title: neurotransmitter loading into synaptic vesicle
    statement: The module is grounded in the GO process for transmitter uptake into synaptic vesicles.
  - source_id: GO:0097401
    title: synaptic vesicle lumen acidification
    statement: V-ATPase proton pumping supplies the driving force for vesicular transporters.
  - source_id: PMID:17880890
    title: The neurotransmitter cycle and quantal size.
    statement: >-
      Review of how the vesicular H+-ATPase gradient (delta-pH and delta-psi) is
      used differently by the vesicular transporter families and how transporter
      expression sets quantal size.
  - source_id: PMID:17110340
    title: Molecular anatomy of a trafficking organelle.
    statement: >-
      Quantitative proteomics of purified synaptic vesicles establishes the
      V-ATPase and the vesicular transporters as stoichiometric resident
      components of the organelle.
  - source_id: PMID:24183019
    title: 'Neurotransmitter release: the last millisecond in the life of a synaptic vesicle.'
    statement: Places transmitter loading as the first stage of the synaptic vesicle cycle.
notes: >-
  Human-centric exemplars; family-level descriptors are used so the module
  remains reusable. The V-ATPase is represented by three role-bearing subunits
  (catalytic A, proteolipid c ring, membrane a1 subunit) rather than the full
  fourteen-subunit complex. The transporter variant set is ONE_OR_MORE because
  some terminals co-release two transmitters. Detailed exocytosis and
  endocytosis stages are in MODULE:synaptic_vesicle_exocytosis and
  MODULE:synaptic_vesicle_endocytosis; the umbrella cycle is
  MODULE:synaptic_vesicle_cycle.
knowledge_gaps:
  - gap_statement: >-
      The molecular function of SV2A/B/C, the most abundant transporter-like
      proteins of the synaptic vesicle, is unresolved; they are not modeled as
      a loading step.
    boundary: >-
      SV2 proteins are stoichiometric vesicle residents with a major
      facilitator-superfamily fold and SV2A is the levetiracetam target.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: If SV2 turns out to transport a substrate or regulate loading it would become a part of this module.
    resolution: Reconstitution of purified SV2A in proteoliposomes with candidate substrates.
  - gap_statement: >-
      The contribution of the intrinsic VGLUT chloride conductance, and of
      vesicular Cl-, to the balance between delta-pH and delta-psi during
      glutamate loading is not modeled.
    boundary: >-
      VGLUT-mediated glutamate uptake is delta-psi driven and is allosterically
      stimulated by low millimolar chloride.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: Vesicle-loading assays with defined luminal ion composition.
  - gap_statement: >-
      Zinc co-loading by ZnT3 into a subset of glutamatergic vesicles is left
      out pending a decision on whether ion co-loading belongs in this module.
    boundary: ZnT3 is an established synaptic vesicle zinc transporter.
    gap_kind:
      - CURATION
    status: OPEN
