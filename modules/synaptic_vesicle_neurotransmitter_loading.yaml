        term:
          id: GO:0030672
          label: synaptic vesicle membrane
      - preferred_term: presynapse
        term:
          id: GO:0098793
          label: presynapse
  parts:
    - order: 1
      role: proton gradient generation
      node:
        id: sv_lumen_acidification
        label: V-ATPase acidification of the vesicle lumen (see MODULE:vacuolar_atpase_acidification)
        module_ref: vacuolar_atpase_acidification
        description: >-
          The V1 sector hydrolyses ATP and the V0 sector translocates protons
          into the vesicle lumen, generating the pH gradient and lumen-positive
          membrane potential that drive transmitter uptake. The
          pump and its subunits are modelled once, in
          MODULE:vacuolar_atpase_acidification; on synaptic vesicles the V0 a
          subunit is the a1 isoform (ATP6V0A1; unc-32 in C. elegans).
        concepts:
          - preferred_term: synaptic vesicle lumen acidification
            term:
              id: GO:0097401
              label: synaptic vesicle lumen acidification
        context:
          cellular_components:
            - preferred_term: synaptic vesicle membrane
              term:
                id: GO:0030672
                label: synaptic vesicle membrane
        evidence:
          - source_id: PMID:17880890
            title: The neurotransmitter cycle and quantal size.
            statement: The vesicular H+-ATPase produces the delta-pH and delta-psi that drive vesicular transport.
    - order: 2
      role: transmitter uptake
      node:
        id: transmitter_uptake
        label: Vesicular transporter uptake of neurotransmitter
        module_type: TRANSPORT_STEP
        description: >-
          A vesicular transporter couples transmitter import to the proton
          gradient (H+ antiport for VMAT/VAChT/VGAT; predominantly delta-psi
          driven for VGLUTs). The transporter family determines the transmitter
          phenotype of the terminal.
        variant_sets:
          - id: transmitter_transporter_family
            label: Vesicular transporter by neurotransmitter
            axis: neurotransmitter
            selection: ONE_OR_MORE
            notes: >-
              Selection is ONE_OR_MORE because some terminals co-release two
              transmitters (e.g. glutamate with GABA, dopamine or acetylcholine)
              from the same or neighbouring vesicle pools.
            variants:
              - id: glutamate_loading
                label: Glutamate loading (VGLUT)
                module_type: TRANSPORT_STEP
                description: >-
                  VGLUT1/2/3 accumulate L-glutamate driven mainly by the membrane
                  potential component of the H+ gradient; they are the defining
                  marker of glutamatergic terminals.
