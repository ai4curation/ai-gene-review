  knowledge_gaps:
  - gap_statement: The physiological substrate state and efficient recombinant reconstitution conditions for
      E. coli RlmC remain unresolved by the original study.
    boundary: Retain the native U747 genetic assignment without selecting a specific assembly particle or equating
      failed purification with an obligatory substrate state.
    gap_kind:
    - BIOLOGY
    status: OPEN
    resolution: Reconstitute activity with demonstrably active RlmC and defined RNA or ribonucleoprotein substrates.
    provenance:
    - reference_id: PMID:12907714
      supporting_text: We were unable to generate a recombinant version of YbjF that retained in vitro activity,
        so the function of this enzyme was defined in vivo by engineering a ybjF knockout strain.
references:
- id: PMID:12907714
  title: Identifying the methyltransferases for m(5)U747 and m(5)U1939 in 23S rRNA using MALDI mass spectrometry.
  findings:
  - statement: E. coli RlmC loss eliminates U747 methylation in vivo.
    supporting_text: Comparison of the methylation patterns in 23S rRNAs from YbjF(+) and YbjF(-) strains showed
      that the latter differed only in the lack of the m(5)U747 modification.
  - statement: Recombinant E. coli RlmD methylates a U1939-containing RNA substrate.
    supporting_text: A purified recombinant version of YgcA retains its activity and specificity, and methylates
      U1939 in an RNA transcript in vitro.
  - statement: An active recombinant RlmC preparation was not obtained in the original study; this does not
      prove a specific assembly-intermediate requirement.
    supporting_text: We were unable to generate a recombinant version of YbjF that retained in vitro activity,
      so the function of this enzyme was defined in vivo by engineering a ybjF knockout strain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text recovered and inspected. RlmC genetic site assignment and RlmD reconstituted chemistry
      are different evidence types. Preserve the authors’ enzyme-preparation caveat rather than turning their
      failed RlmC assay into a substrate-state discovery.
- id: PMID:21824914
  title: A single methyltransferase YefA (RlmCD) catalyses both m5U747 and m5U1939 modifications in Bacillus
    subtilis 23S rRNA.
  findings:
  - statement: B. subtilis YefA/RlmCD restores both U747 and U1939 methylation in the native deletion background.
    supporting_text: Transforming this latter strain with an active copy of yefA on a plasmid restored to a
      significant degree the methylation at both U747 (Figure 2G) and U1939 (Figure 2H).
  - statement: Heterologous E. coli rescue is additional evidence and does not make YefA a tRNA methyltransferase.
    supporting_text: Further HPLC analysis showed that YefA is not involved in m5U modification of tRNAs (Supplementary
      Figure S5).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Native loss/complementation establishes the two-site program; heterologous triple-mutant
      rescue is explicitly distinguished. No assumption that every Bacillota protein has this specificity.
- id: PMID:26365244
  title: RlmCD-mediated U747 methylation promotes efficient G748 methylation by methyltransferase RlmAII in
    23S rRNA in Streptococcus pneumoniae; interplay between two rRNA methylations responsible for telithromycin
    susceptibility.
  findings:
  - statement: S. pneumoniae SP_1029 encodes dual-specific RlmCD.
    supporting_text: U747 and another nucleotide, U1939, were methylated by the dual-specific methyltransferase
      RlmCD encoded by SP_1029 in S. pneumoniae.
  - statement: RlmCD increases the efficiency of the separate RlmAII/G748 reaction; high RlmAII can compensate
      for its absence.
    supporting_text: Without U747 methylation by RlmCD, full methylation at G748 could still be attained by
      increasing the amount of RlmAII (Figures 5 and 6),
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Native TIGR4 versus SP_1029-disrupted cells establish both methylation sites.
      TEL phenotypes depend on the additional methylation background, including Erm(B), and are outside the
      paired-site module. The methods/results disagree on the strain used for the complementation insert; native
      knockout chemistry is assessed separately from that construct.
- id: PMID:28949991
  title: Structural insights into substrate selectivity of ribosomal RNA methyltransferase RlmCD.
  findings:
  - statement: A central linker contributes to RlmCD substrate selectivity in biochemical assays.
    supporting_text: Its significance in the enzyme activity of RlmCD is further confirmed by in-vitro methyltransferase
      assay.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text. The biochemical comparison remains useful, but the 18-nt methylated-RNA crystal
      arrangement is not used as a physiological recognition model: the same group explicitly rejected that
      interpretation in PMID:30388185. Catalytic-trap E443Q and truncated proteins must remain identified.'
- id: PMID:30388185
  title: Unveiling the structural features that determine the dual methyltransferase activities of Streptococcus
    pneumoniae RlmCD.
  findings:
  - statement: Later structures compare RlmCD recognition of U747 and U1939 RNA segments.
    supporting_text: In this research, we determined the crystal structures of RlmCD in complex with two RNA
      segments containing U747 and U1939.
  - statement: The earlier 18-nt complex reflects physiologically irrelevant crystal packing.
    supporting_text: the complex structure of RlmCD with S-adenosyl homocysteine (SAH) and an 18-nt U747-containing
      RNA segment that we obtained only reflect a physiologically irrelevant interaction, likely due to crystal
      packing.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Structural differences are corroborated by methyltransferase and binding assays.
      Engineered fragments and catalytic-trap constructs establish local recognition, not the conformation
      or kinetic order of both sites in an intact native ribosome.
- id: PMID:28601226
  title: The Evolution of Substrate Specificity by tRNA Modification Enzymes.
  findings:
  - statement: Shared catalytic architecture does not remove the RNA-recognition differences between RlmD and
      TrmA.
    supporting_text: Outside of this consensus fold, other RNA-binding elements allow for discrimination between
      the different substrates (rRNA vs tRNA); for example, unlike RlmD, TrmA does not contain a TRAM domain
      [32,63].
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full review. Used for the family/substrate boundary, with primary studies establishing the
      named protein activities. TrmA is a separate tRNA specificity comparator and not a participant in either
      rRNA reaction.
- id: PMID:32290235
  title: Reductive Evolution and Diversification of C5-Uracil Methylation in the Nucleic Acids of Mollicutes.
  findings:
  - statement: The surveyed mollicutes lack RlmC/RlmCD homologs.
    supporting_text: No RlmC homolog was identified in any of the mollicutes, nor were there any homologs of
      the dual-specific enzyme RlmCD seen in B. subtilis [36] and Streptococcus pneumoniae [57].
  - statement: Mass spectrometry in the surveyed mollicutes found no modification at U747.
    supporting_text: Consistent with this, MS analyses of the G725-C772 in domain II of the mollicutes 23S
      rRNAs confirmed that there was no modification at U747, or at any other nucleotide in this region (not
      shown).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary comparative study, not a review. This is a direct counterexample to universal
      bacterial U747 methylation. The authors report the U747 mass-spectrometric result as data not shown;
      the claim is attributed at that strength. U1939-only RlmFO routes are outside the paired-site program.
- id: PMID:42517620
  title: Compendium of RNA modifications for bacterial stress adaptation.
  findings:
  - statement: A recent review summarizes dedicated RlmC versus dual-specific RlmCD implementations.
    supporting_text: m5U formation is catalyzed by RlmC in gram-negative bacteria (182); gram-positive bacteria
      instead encode the dual-functional enzyme RlmCD, which is responsible for methylation at both U747 and
      U1939 of the 23S rRNA (183, 184).
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Full 2026 review. The broad Gram-stain phrasing is not a universal taxonomic rule; PMID:32290235
      supplies a counterexample. The heading N5-methyluridine misnames C5 chemistry. The RlmC iron-sulfur/oxidative-regulation
      sentence cites reference 185, the RumA/RlmD redox study (PMID:15181002; DOI:10.1074/jbc.M405702200),
      not a direct RlmC experiment. That sentence is not used as evidence here; the corroborated site-specific
      overview is retained.
- id: PMID:21051506
  title: Specificity shifts in the rRNA and tRNA nucleotide targets of archaeal and bacterial m5U methyltransferases.
  findings:
  - statement: Pyrococcus abyssi proteins most similar to RlmD acquired tRNA-U54 and rRNA-U747 specificity,
      showing why family relatedness alone cannot transfer the RNA site.
    supporting_text: PAB0719 acts in a TrmA-like manner to catalyze m(5)U54 methylation in P. abyssi tRNAs,
      and here we show that PAB0760 possesses RlmC-like activity and specifically methylates the nucleotide
      equivalent to U747 in P. abyssi 23S rRNA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text recovered by the normal publication warmer. Comparative evolution motivates restricting
      the broad PANTHER family to experimentally characterized exemplars; no ancestral node or target-specific
      transfer is inferred from the family name.
