id: MODULE:bacterial_23s_rrna_m5u747_methylation
title: Bacterial 23S rRNA U747/U1939 C5 methylation
description: A paired rRNA modification program producing 5-methyluridine at positions corresponding to Escherichia
  coli 23S rRNA U747 and U1939. In E. coli, RlmC and RlmD divide these two activities; in the characterized
  Bacillus subtilis and Streptococcus pneumoniae implementations, RlmCD modifies both sites. The reactions
  share SAM-dependent C5 chemistry but act on distinct RNA regions. Their coexistence does not establish a
  required order or dependence between the two reactions. This comparison covers the named bacterial examples
  rather than universal bacterial conservation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:12907714
  statement: Two dedicated E. coli enzymes provide the paired-site implementation.
  supporting_text: Comparison of the methylation patterns in 23S rRNAs from YbjF(+) and YbjF(-) strains showed
    that the latter differed only in the lack of the m(5)U747 modification. ... A purified recombinant version
    of YgcA retains its activity and specificity, and methylates U1939 in an RNA transcript in vitro.
- source_id: PMID:21824914
  statement: B. subtilis uses a dual-specific enzyme.
  supporting_text: Transforming this latter strain with an active copy of yefA on a plasmid restored to a significant
    degree the methylation at both U747 (Figure 2G) and U1939 (Figure 2H).
- source_id: PMID:26365244
  statement: S. pneumoniae independently establishes a dual-specific implementation.
  supporting_text: U747 and another nucleotide, U1939, were methylated by the dual-specific methyltransferase
    RlmCD encoded by SP_1029 in S. pneumoniae.
- source_id: PMID:42517620
  statement: Review literature supplies the comparative overview, restricted by primary species evidence.
  supporting_text: m5U formation is catalyzed by RlmC in gram-negative bacteria (182); gram-positive bacteria
    instead encode the dual-functional enzyme RlmCD, which is responsible for methylation at both U747 and
    U1939 of the 23S rRNA (183, 184).
- source_id: PMID:32290235
  statement: Surveyed mollicutes lack U747 modification and delimit the paired-site scope.
  supporting_text: Consistent with this, MS analyses of the G725-C772 in domain II of the mollicutes 23S rRNAs
    confirmed that there was no modification at U747, or at any other nucleotide in this region (not shown).
notes: The existing U747 module identifier is retained while its one-reaction boundary is expanded to the experimentally
  linked U747/U1939 specificity program. Each native variant contains two substantive activities. No PRECEDES
  or regulatory edge is asserted because the sources do not establish an obligatory ordering between these
  sites. RlmAII-dependent G748 methylation, Erm(B)-dependent antibiotic phenotypes, tRNA TrmA activity and
  U1939-only RlmFO implementations are outside this boundary. Broad family identifiers ground membership; they
  do not assert that all family members or all bacteria execute these reactions.
