id: MODULE:bacterial_23s_rrna_m5u747_methylation
title: E. coli 23S rRNA m5U747 methylation
description: >-
  A cytosolic rRNA modification reaction in which RlmC methylates uracil 747 of
  23S rRNA to form 5-methyluridine. The enzyme is the U747-specific COG2265
  methyltransferase in E. coli, distinct from the paralogous TrmA and RlmD/RumA
  enzymes that modify tRNA U54 and 23S rRNA U1939, respectively.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0070041
    title: rRNA (uridine-C5-)-methyltransferase activity
    statement: Defines RlmC's SAM-dependent uridine-C5 rRNA methyltransferase activity.
  - source_id: GO:0070475
    title: rRNA base methylation
    statement: Defines the RNA-modification process that includes 23S rRNA m5U747 formation.
  - source_id: file:genes/ECOLI/rlmC/rlmC-ai-review.yaml
    title: ECOLI rlmC gene review
    statement: >-
      The completed E. coli rlmC review grounds RlmC as the enzyme required in
      vivo for 23S rRNA m5U747 formation.
  - source_id: PMID:12907714
    title: >-
      Identifying the methyltransferases for m(5)U747 and m(5)U1939 in 23S
      rRNA using MALDI mass spectrometry.
    statement: >-
      Establishes that the ybjF/rlmC knockout specifically lacks the m5U747
      modification in 23S rRNA.
  - source_id: PMID:21824914
    title: >-
      A single methyltransferase YefA (RlmCD) catalyses both m5U747 and m5U1939
      modifications in Bacillus subtilis 23S rRNA.
    statement: >-
      Places E. coli RlmC in a broader bacterial context in which the RlmC/RlmD
      split differs by lineage.
notes: >-
  RlmC could not be reconstituted as an active recombinant enzyme in the
  original study, suggesting that its physiological substrate may be an rRNA
  assembly intermediate rather than naked 23S rRNA.
