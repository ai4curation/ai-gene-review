id: MODULE:dmel_pp2a_holoenzymes
title: Protein phosphatase 2A holoenzymes in Drosophila melanogaster
description: >-
  Protein phosphatase 2A (PP2A) is a major serine/threonine phosphatase formed by a core dimer
  of a scaffold (A) subunit and a catalytic (C) subunit, joined by one of several regulatory
  B subunits that select substrates and subcellular location. In Drosophila the catalytic
  subunit is Microtubule star (Mts) and the scaffold is Pp2A-29B. The B55-family subunit Twins
  (Tws) directs PP2A to mitotic substrates and regulates mitotic exit, while the B56 subunits
  Widerborst (Wdb) and Well rounded (Wrd) act in planar cell polarity, Hedgehog and Wingless
  signaling, insulin signaling and synapse development.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000909
  title: 'FlyBase gene group PP2A: Protein phosophatase 2a complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as protein phosophatase 2a complexes
    (PP2A); this module models that group.
- source_id: GO:0000159
  title: protein phosphatase type 2A complex
  statement: >-
    GO term grounding the module as protein phosphatase type 2A complex.
notes: >-
  FlyBase defines three holoenzymes (WRD-PP2A, TWS-PP2A, WDB-PP2A) that share the A and C
  subunits; they are modelled as one core part plus an EXACTLY_ONE B-subunit choice. The striatin-containing
  PP2A of STRIPAK is a separate module (dmel_stripak_complex). The B'' subunit and PP2A inhibitors
  are not in the FlyBase group and are not modelled. FlyBase groups realized by this module:
  PP2A (FBgg0000909). Subgroups folded into it: WRD-PP2A, TWS-PP2A, WDB-PP2A. Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_pp2a_holoenzymes.yaml; none of the member genes has a gene review
  yet unless noted.
