id: MODULE:dmel_cytoplasmic_ribosome
title: Cytoplasmic (80S) ribosome in Drosophila melanogaster
description: >-
  The cytoplasmic 80S ribosome translates nuclear-encoded mRNAs. It consists of a 40S small
  subunit, which binds mRNA and decodes it, and a 60S large subunit, which carries the peptidyl
  transferase centre and the polypeptide exit tunnel. Each subunit is built from ribosomal
  RNAs and dozens of ribosomal proteins named by the universal (u) and eukaryote-specific
  (e) nomenclature. In Drosophila several ribosomal proteins are encoded by duplicated genes,
  and some paralogs are expressed mainly in the germline or testis (for example RpL22-like).
  FlyBase therefore also defines testis-specific variant compositions of both subunits, in
  which RpS28-like, RpL22-like and RpL37-2 appear only in the testis variants.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000141
  title: 'FlyBase gene group CRP: Cytoplasmic ribosomal subunits'
  statement: >-
    FlyBase release FB2026_03 groups 94 D. melanogaster genes as cytoplasmic ribosomal subunits
    (CRP); this module models that group.
- source_id: GO:0022626
  title: cytosolic ribosome
  statement: >-
    GO term grounding the module as cytosolic ribosome.
notes: >-
  The subunit parts follow the four FlyBase subgroups (RPS, RPL and their testis-specific
  variants); most proteins are shared and appear in both the canonical and the testis variant
  of a subunit. The variant groups record composition as curated by FlyBase; whether every
  listed paralog swap occurs in a single ribosome population in vivo is not established. FlyBase
  lists ribosomal proteins only, so rRNAs are not participants here, and some members (RpL24-like,
  a RLP24 ribosome biogenesis homolog; Rack1) are associated proteins rather than core rRNA-binding
  proteins. Ribosome biogenesis factors, translation factors and mitochondrial ribosomes are
  separate modules. FlyBase groups realized by this module: CRP (FBgg0000141). Subgroups folded
  into it: RPS, RPL, RPS-T, RPL-T. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_cytoplasmic_ribosome.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
