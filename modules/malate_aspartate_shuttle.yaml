  - source_id: file:human/MDH2/MDH2-ai-review.yaml
    title: MDH2 gene review (human)
    statement: The matrix malate-dehydrogenase step (UniProtKB:P40926, GO:0030060) matches the completed human MDH2 review.
  - source_id: file:human/GOT2/GOT2-ai-review.yaml
    title: GOT2 gene review (human)
    statement: The matrix aspartate-aminotransferase step (UniProtKB:P00505, GO:0004069) matches the completed human GOT2 review.
  - source_id: PMID:42822427
    title: Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS.
    statement: >-
      Evaluated candidate: a matrix malate dehydrogenase (AcMito-MDH) that cryo-EM of unenriched
      Acanthamoeba castellanii mitochondrial lysate resolves as a dimer sitting atop OSCP in the
      peripheral stalk of each ATP synthase monomer, anchored by a lineage-specific adaptor subunit
      (gene ACANB14707, named MASA) and remaining catalytically active in the purified complex.
      NOT modelled as a part of this module. The claim is about a physical tether between matrix
      malate oxidation and complex V, which is not a step of the malate-aspartate shuttle: the
      shuttle is defined by net inward transfer of cytosolic reducing equivalents and requires the
      cytosolic arm and the aspartate-glutamate limb, none of which this paper addresses - it never
      mentions the shuttle, aspartate, the aminotransferases or the SLC25 carriers. See notes for
      the full determination.
    supporting_text: >-
      In this configuration, ACANB14707 acts as a scaffold for AcMito-MDH to attach to ATP synthase,
      so we here on out refer to it as MDH-ATP synthase adaptor (MASA) subunit.
  - source_id: PMID:42822427
    title: Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS.
    statement: >-
      The tether rests on two features that are explicitly lineage-specific, which is why it cannot
      be propagated to the human enzymes this module is grounded on: a 76-residue N-terminal
      extension that no other MDH carries, cytosolic or mitochondrial, and the MASA adaptor subunit,
      which has no mammalian counterpart. The authors describe both as Acanthamoeba-specific
      adaptations, and report that in mammals the MDH-ATP synthase link has been detected only as a
      weak cross-linking-MS signal.
    supporting_text: >-
      Compared to other MDHs, both cytosolic and mitochondrial, AcMito-MDH has a 76 residue
      N-terminal extension
  - source_id: PMID:42822427
    title: Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS.
    statement: >-
      Participant grounding is unavailable even if the boundary call were different. The paper names
      its proteins by the ACANB gene identifiers of its own annotation; ACANB14707 returns no hit in
      UniProtKB, and the three Acanthamoeba castellanii EC 1.1.1.37 entries in UniProtKB (L8HIY2,
      343 aa; L8GQP0, 306 aa; L8HFT9, 416 aa, all unreviewed) cannot be reconciled with the paper's
      numbering, in which the mature construct spans residues 36-430 and the catalytic
      proton-transfer residue is His294 (L8HFT9 has Arg at 294). UniProt REST queries at review time;
      release not pinned. Following the repository rule, no accession is asserted for either protein.
    supporting_text: >-
      Mutation of a conserved histidine involved in proton transfer, His294, to an alanine produced a
      catalytically dead MDH enzyme
  - source_id: PMID:42822427
    title: Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS.
    statement: >-
      Even within Acanthamoeba the pathway the tether regulates is left undecided by the authors,
      which is a further reason not to attach the finding to a named shuttle: that organism runs a
      mitochondrially localised glyoxylate shunt with isocitrate lyase and malate synthase fused as
      one polypeptide, and the authors raise the possibility that the regulatory effect acts on the
      shunt as well as, or instead of, the TCA cycle.
    supporting_text: >-
      This raises the possibility that in the amoebozoan, the regulatory effects we observe in MDH
      through integration into ATP synthase impact the glyoxylate shunt as well or instead of the TCA
      cycle.
