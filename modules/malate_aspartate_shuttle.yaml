    fatty-acid-uptake moonlighting role kept non-core). Net effect: a cytosolic NADH is oxidised (MDH1)
    and a matrix NADH regenerated (MDH2), transferring reducing equivalents inward without moving NADH
    across the membrane; the electrogenic, Ca2+-activated AGC1 antiport sets the direction. GO term ids/
    labels verified against the local go.db. This shuttle feeds electrons to respiratory Complex I
    (curated in the mitochondrial_complex_i_core / assembly / accessory modules). Disorders: AGC1
    (SLC25A12) deficiency — global cerebral hypomyelination/epilepsy; MDH2 and GOT2 deficiency — early
    infantile epileptic encephalopathy.
    CANDIDATE ASSESSED, NOT MODELLED — AcMito-MDH integrated into ATP synthase (PMID:42822427):
    cryo-EM of unenriched Acanthamoeba castellanii mitochondrial lysate resolves a matrix malate
    dehydrogenase dimer sitting atop OSCP in the peripheral stalk of each ATP synthase monomer,
    anchored by a lineage-specific adaptor subunit (gene ACANB14707, named MASA), still catalytically
    active in the purified complex, with an ~85% lower KM and a higher substrate-inhibition Ki than
    the free enzyme, and with a kcat that ADP raises and ATP lowers. This is a genuine and
    well-supported finding, and it is deliberately not added as a part, annoton or context element of
    this module, for three reasons.
    (i) Pathway. The handoff (issue #3924) routed the paper here on the string "malate
    dehydrogenase", but the claim is a structural and allosteric link between matrix malate oxidation
    and complex V — a TCA/OXPHOS tether, as the title says. The malate-aspartate shuttle is not
    defined by matrix malate oxidation alone; it is defined by net inward transfer of cytosolic
    reducing equivalents, and it needs the cytosolic arm (MDH1, GOT1), the two inner-membrane
    carriers, and the aspartate-glutamate limb that gives it direction. The cached full text mentions
    none of these: zero occurrences of "shuttle", "aspartate", "GOT", "SLC25", "aminotransferase",
    "transaminase" or "reducing equivalent". MDH2 is shared between this shuttle and the TCA cycle
    (the module notes say so), and a regulator of the shared enzyme is not thereby a part of both
    pathways.
    (ii) Lineage. Every part here is grounded on a reviewed human accession with a completed gene
    review. The tether depends on two features the authors call Acanthamoeba-specific adaptations: a
    76-residue N-terminal extension that no other MDH carries, cytosolic or mitochondrial, and the
    MASA subunit, which has no mammalian counterpart. In mammals the authors report the link has been
    seen only as a weak cross-linking-MS signal. Even inside Acanthamoeba the regulated flux is
    undecided: that organism runs a mitochondrially localised glyoxylate shunt with a fused malate
    synthase-isocitrate lyase, and the authors raise the possibility that the effect acts on the
    shunt as well as, or instead of, the TCA cycle.
    (iii) Grounding. The paper names its proteins by its own ACANB gene identifiers. ACANB14707
    returns no hit in UniProtKB, and the three Acanthamoeba castellanii EC 1.1.1.37 entries there
    (L8HIY2 343 aa, L8GQP0 306 aa, L8HFT9 416 aa, all unreviewed) cannot be reconciled with the
    paper's numbering — the mature construct spans residues 36-430 and the catalytic proton-transfer
    residue is His294, where L8HFT9 has Arg (UniProt REST at review time; release not pinned). Per
    the repository rule, no accession is asserted rather than a plausible one guessed.
    Where it would belong if it is admitted anywhere: mitochondrial_complex_v.yaml, as a
    lineage-specific accessory subunit or in a separate amoebozoan ATP synthase module — the same
    admission path that module already records for the myzozoan ATPPM1/ATPPM2 candidates. That is a
    complex V scoping call and is left to that module; it is not recorded there in this change
    because two draft PRs are open against that file.
    The residual question that does bear on this module — whether the human matrix step is likewise
    coupled to complex V, and whether such coupling sets MDH2's working substrate range — is a
    genuine biological unknown and is recorded as a structured knowledge_gaps entry (status OPEN,
    BIOLOGY/RESIDUAL_SUBGAP) with verbatim provenance. Module composition is unchanged; no exclusion
    guard was added because every participant here is selected by an explicit UniProt accession or
    PANTHER family, so no selector can sweep an amoebozoan MDH in.
