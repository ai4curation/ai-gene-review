id: MODULE:malate_aspartate_shuttle
title: Malate-aspartate shuttle (MDH1/MDH2/GOT1/GOT2 + SLC25A11/SLC25A12)
description: >-
  The malate-aspartate shuttle is the principal mechanism by which reducing equivalents (cytosolic
  NADH generated in glycolysis) are transferred into the mitochondrial matrix for oxidation by the
  respiratory chain, in tissues such as heart, liver and brain. Because NADH itself cannot cross the
  inner mitochondrial membrane, the shuttle moves the electrons as malate: in the cytosol, malate
  dehydrogenase 1 (MDH1) reduces oxaloacetate to malate, consuming a cytosolic NADH; the malate is
  imported by the oxoglutarate/malate carrier (SLC25A11, OGC) in exchange for 2-oxoglutarate; in the
  matrix, malate dehydrogenase 2 (MDH2) re-oxidises malate to oxaloacetate, regenerating matrix NADH
  that feeds Complex I. Oxaloacetate cannot cross the membrane either, so it is transaminated with
  glutamate to aspartate by mitochondrial aspartate aminotransferase (GOT2, PLP-dependent); the
  aspartate is exported by the Ca2+-regulated aspartate-glutamate carrier (SLC25A12, AGC1/aralar) in
  exchange for cytosolic glutamate, and cytosolic aspartate aminotransferase (GOT1) regenerates
  oxaloacetate and 2-oxoglutarate to close the cycle. The AGC1 antiport, being electrogenic and
  effectively unidirectional, gives the shuttle its net direction. Defects in these components cause
  disease: SLC25A12/AGC1 deficiency causes a hypomyelinating encephalopathy (global cerebral
  hypomyelination / epilepsy), MDH2 and GOT2 deficiencies cause early infantile epileptic
  encephalopathy, and the shuttle is a key node in cancer redox metabolism.
references:
  - id: PMID:42822427
    title: Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Identifier, title and claims checked against the cached full text (PMC13632647, retrieved
        via the PMC XML route, so Results, Discussion and STAR Methods were read rather than the
        abstract alone). Technically strong study: cryo-EM of unenriched Acanthamoeba castellanii
        mitochondrial lysate with local refinement over OSCP, a 2.3 A apo crystal structure of the
        same MDH, BN-PAGE complexome profiling across oxygen/carbohydrate/iron perturbations,
        steady-state kinetics of recombinant MDH and of MDH within an immunoprecipitated ATP
        synthase complex, a catalytically dead His294Ala control, an N-terminal-extension deletion
        strain, and ADP/ATP titrations. Relevance is LOW for this module, not because the work is
        weak but because it is about a different pathway and a different lineage: the paper
        characterises a physical tether between matrix malate dehydrogenase and complex V in an
        amoebozoan, and never mentions the malate-aspartate shuttle, aspartate, the aspartate
        aminotransferases, the SLC25 carriers, or transfer of cytosolic reducing equivalents (zero
        occurrences of "shuttle", "aspartate", "GOT", "SLC25", "aminotransferase" or
        "transaminase" in the cached full text). Cited here only to delimit the candidate
        assessment recorded in module.notes and the knowledge gap below; module composition is
        unchanged.
knowledge_gaps:
  - gap_statement: >-
      Whether the matrix malate-dehydrogenase step of this shuttle is physically coupled to the
      respiratory chain it feeds, and whether such coupling sets MDH2's working substrate range, is
      undetermined in any mammal. In Acanthamoeba castellanii the matrix MDH is a stoichiometric
      subunit of ATP synthase that stays catalytically active there, with an ~85% lower KM and a
      higher substrate-inhibition Ki than the free enzyme, and with a kcat that ADP raises and ATP
      lowers. The equivalent question for human MDH2 is open in both directions: no mammalian
      MDH2-complex V association has been established beyond a weak cross-linking-MS signal, and if
      one exists it is unknown whether it modulates malate oxidation and therefore the inward flux
      of reducing equivalents through this shuttle.
    boundary: >-
      What is firmly established is the chemistry and the topology of the shuttle, modelled here:
      MDH2 (UniProtKB:P40926) re-oxidises matrix malate to oxaloacetate with GO:0030060, the NADH it
      regenerates feeds Complex I, and the electrogenic AGC1 antiport sets the net direction. What is
      not established is whether that step runs as a free matrix enzyme or as part of a
      substrate-channelling assembly with the ATP synthase whose substrate (ADP) and product (ATP)
      the Acanthamoeba enzyme senses allosterically. In Acanthamoeba the coupling is anchored by two
      lineage-specific features with no mammalian counterpart - a 76-residue N-terminal extension
      absent from all other MDHs, cytosolic and mitochondrial, and the scaffolding MASA subunit
      (gene ACANB14707) - and the authors themselves note that in mammals the link has been seen only
      as a weak cross-linking-MS signal. The Acanthamoeba physiology is also not transferable: that
      organism runs a mitochondrially localised glyoxylate shunt with a fused malate
      synthase-isocitrate lyase, so even there the authors leave open whether the regulated flux is
      the TCA cycle or the shunt.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The matrix arm is the step that converts imported malate back into the matrix NADH this shuttle
      exists to deliver, so anything that sets MDH2's effective KM sets the shuttle's capacity. If
      mammalian MDH2 is similarly tethered to complex V, the shuttle's inward flux would be under
      direct feedback from the adenylate state of the matrix - a regulatory input the module does not
      currently represent, and one that would bear on the tissues where the shuttle dominates (heart,
      liver, brain) and on the redox-metabolism phenotypes attributed to MDH2 and GOT2 deficiency.
    resolution: >-
      Wet-lab work on mammalian mitochondria, not curation: cross-linking or complexome profiling of
      human or mouse mitochondria to test whether MDH2 co-migrates with assembled complex V at
      stoichiometric rather than trace abundance; kinetics of MDH2 in an immunoprecipitated complex V
      preparation against the free recombinant enzyme (the KM/Ki comparison the authors performed in
      Acanthamoeba); an ADP/ATP titration of that preparation to test allosteric transmission; and, if
      an association is found, a structure or interface mapping to identify what substitutes for the
      amoebozoan MASA subunit and N-terminal extension. A negative result closes the gap as a
      lineage-specific adaptation and is equally informative.
    provenance:
      - reference_id: PMID:42822427
        supporting_text: >-
          Compared to recombinantly purified AcMito-MDH alone, the purified AcATP synthase shows an
          ~85% reduction in KM, suggesting that integration into ATP synthase increases AcMito-MDH
          substrate affinity
        reference_section_type: RESULTS
      - reference_id: PMID:42822427
        supporting_text: >-
          indicate that MDH activity is allosterically modulated by ATP synthase substrates,
          revealing not only a physical link between OXPHOS and the TCA cycle, but also suggesting
          regulatory mechanism.
        reference_section_type: RESULTS
      - reference_id: PMID:42822427
        supporting_text: >-
          A recent report also identified a weak link between MDH and ATP synthase in mammals that
          could only be detected by cross-linking MS
        reference_section_type: DISCUSSION
      - reference_id: PMID:42822427
        supporting_text: >-
          highlighting the broader relevance of this link and the need for a tractable system to
          investigate its potential regulatory roles and biological relevance
        reference_section_type: DISCUSSION
      - reference_id: PMID:42822427
        supporting_text: >-
          This raises the possibility that in the amoebozoan, the regulatory effects we observe in
          MDH through integration into ATP synthase impact the glyoxylate shunt as well or instead of
          the TCA cycle.
        reference_section_type: DISCUSSION
