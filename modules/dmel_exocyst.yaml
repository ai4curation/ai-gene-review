proposed_ontology_changes:
- change_type: NODE_OBSOLETION_WITH_NO_DIRECT_REPLACEMENT
  ontology: GO
  about_node:
    id: GO:0090522
    label: vesicle tethering involved in exocytosis
  has_nondirect_replacement:
  - id: GO:7770062
    label: vesicle membrane tethering activity
  change_dsl: obsolete GO:0090522
  justification: >-
    Tethering is a binding activity, not a process, so the exocyst's tethering step belongs
    in the molecular function hierarchy rather than as a biological process under exocytosis.
    GO has made this change: the term is obsolete and GO:7770062 vesicle membrane tethering
    activity is live. It is recorded as a non-direct replacement because GO deliberately
    carries no term replaced by - a biological process cannot be replaced outright by a
    molecular function, and the recommended pattern is the new MF with a part_of link to
    the transport process it serves, which a curator must choose per annotation.
  origin: UPSTREAM_COMPLETED
  stance: AGREE
  ontology_state_verified: '2026-10-31'
  adoption_status: NOT_APPLICABLE
  affected_annotations:
  - modules/dmel_exocyst.yaml
  - projects/VESICLE_TETHERING_OBSOLETION.md
  upstream_tracker_issue: https://github.com/geneontology/go-annotation/issues/6375
  see_also:
  - https://github.com/ai4curation/ai-gene-review/blob/main/projects/VESICLE_TETHERING_OBSOLETION.md
- change_type: REMOVE_MAPPING
  ontology: GO
  about_node:
    id: GO:0090522
    label: vesicle tethering involved in exocytosis
  old_value: InterPro:IPR007225
  justification: >-
    The InterPro2GO mapping from IPR007225 Exocyst complex component EXOC6/Sec15 to
    GO:0090522 sends every Sec15 orthologue to a term GO has obsoleted, so the mapping now
    generates IEA annotations to an obsolete term. It is still present in the pinned
    rules/arba/_interpro2go.txt, and GO:7770062 appears nowhere in that file, so the
    mapping needs removing or repointing to the replacement MF rather than simply dropping.
  origin: UPSTREAM_PROPOSED
  stance: AGREE
  ontology_state_verified: '2026-10-31'
  affected_annotations:
  - modules/dmel_exocyst.yaml
  upstream_tracker_issue: https://github.com/geneontology/go-annotation/issues/6375
  supported_by:
  - reference_id: file:../rules/arba/_interpro2go.txt
    supporting_text: 'InterPro:IPR007225 Exocyst complex component EXOC6/Sec15 > GO:vesicle tethering involved in exocytosis ; GO:0090522'
- change_type: REMOVE_MAPPING
  ontology: GO
  about_node:
    id: GO:0090522
    label: vesicle tethering involved in exocytosis
  old_value: InterPro:IPR039682
  justification: >-
    The InterPro2GO mapping from IPR039682 Exocyst complex component Sec8/EXOC4 to
    GO:0090522 has the same defect as the IPR007225 mapping above: it propagates IEA
    annotations to an obsoleted term for every Sec8 orthologue. Both are still in the
    pinned InterPro2GO file.
  origin: UPSTREAM_PROPOSED
  stance: AGREE
