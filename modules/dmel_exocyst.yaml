id: MODULE:dmel_exocyst
title: Exocyst complex in Drosophila melanogaster
description: >-
  The exocyst is an octameric tethering complex that captures secretory and recycling vesicles
  at sites of exocytosis on the plasma membrane before SNARE-mediated fusion. Its eight subunits
  (Sec3, Sec5, Sec6, Sec8, Sec10, Sec15, Exo70 and Exo84) are long helical-bundle proteins;
  Sec3 and Exo70 bind plasma membrane phosphoinositides and small GTPases, while Sec15 binds
  Rab11 on the vesicle. Structural studies divide the complex into two four-subunit modules,
  Sec3-Sec5-Sec6-Sec8 and Sec10-Sec15-Exo70-Exo84. In Drosophila the exocyst is required for
  polarized membrane delivery, for example to the rhabdomere of photoreceptors, to growing
  neurites and for epithelial junction protein trafficking.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000107
  title: 'FlyBase gene group EXOC: Exocyst'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as exocyst (EXOC); this module
    models that group.
- source_id: GO:0000145
  title: exocyst
  statement: >-
    GO term grounding the module as exocyst.
notes: >-
  Boundary. The module contains the eight exocyst subunits. Rab11, Ral and Rho-family GTPases
  that bind exocyst subunits, and the SNAREs that complete fusion, are partners, not parts.
  The two-subcomplex decomposition follows the structural organization described for yeast
  and mammalian exocyst. FlyBase groups realized by this module: EXOC (FBgg0000107). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_exocyst.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
