id: MODULE:dmel_wnt_tcf_signaling
title: Wnt-TCF (canonical Wingless) signaling in Drosophila melanogaster
description: >-
  In canonical Wnt signaling, secreted Wnt proteins, chiefly Wingless, bind Frizzled receptors
  and the LRP5/6 co-receptor Arrow. Wnt secretion requires palmitoleoylation by Porcupine
  and transport by Wntless. In the absence of ligand, a destruction complex of Axin, Adenomatous
  polyposis coli (Apc or Apc2), Casein kinase I alpha and Shaggy (GSK3) phosphorylates Armadillo
  (beta-catenin) and targets it for degradation. Ligand engagement recruits Dishevelled and
  Axin to the receptor, inhibiting the destruction complex, so that Armadillo accumulates,
  enters the nucleus and joins Pangolin (TCF), Legless (BCL9), Pygopus, Chip and Ssdp in a
  Wnt enhanceosome that activates Wingless target genes. The pathway patterns the embryonic
  segments, the wing, and many other tissues.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000889
  title: 'FlyBase gene group WNT-TCF: Wnt-tcf signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 104 D. melanogaster genes as wnt-tcf signaling pathway
    (WNT-TCF); this module models that group.
- source_id: FB:FBgg0000895
  title: 'FlyBase gene group WNT-E: Wnt enhanceosome'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as wnt enhanceosome (WNT-E);
    this module models that group.
- source_id: FB:FBgg0001810
  title: 'FlyBase gene group DES: Beta catenin destruction complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as beta catenin destruction complexes
    (DES); this module models that group.
- source_id: GO:0060070
  title: canonical Wnt signaling pathway
  statement: >-
    GO term grounding the module as canonical Wnt signaling pathway.
notes: >-
  Boundary. The module combines the FlyBase Wnt-TCF pathway core, Wnt production, the Wnt
  enhanceosome and the two destruction complex variants. Armadillo, Pangolin, Legless and
  Pygopus are FlyBase core components and also enhanceosome members; they are modelled once,
  in the enhanceosome. Axin, Shaggy and Casein kinase I alpha are shared by both destruction
  complex variants. The SCF-Slimb ubiquitin ligase that degrades phosphorylated Armadillo,
  the corepressor Groucho and other modulators are FlyBase regulator sets and not parts. Arrow
  has no molecular function assigned because the GO term for Wnt coreceptor activity is obsolete.
  FlyBase groups realized by this module: WNT-TCF (FBgg0000889), WNT-E (FBgg0000895), DES
  (FBgg0001810). Subgroups folded into it: WNT-TCFC, DES-C, WNT-PRO, DES-C2. FlyBase also
  curates regulator sets for this pathway, which are context and not modelled as parts: WNT-TCFN
  (negative regulators of wnt-tcf signaling pathway, 43 genes); WNT-TCFP (positive regulators
  of wnt-tcf signaling pathway, 52 genes). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_wnt_tcf_signaling.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
