id: MODULE:sos_salt_tolerance
title: Salt Overly Sensitive (SOS) pathway (SOS3/CBL4 - SOS2/CIPK24 - SOS1 Na+/H+ antiporter)
description: >-
  The Salt Overly Sensitive (SOS) pathway is a calcium-decoding kinase relay that drives Na+ extrusion
  from plant cells under salinity. A salt-induced cytosolic Ca2+ signal is sensed by N-myristoylated
  calcineurin B-like (CBL) EF-hand calcium sensors: SOS3/CBL4 predominantly in roots and
  SCaBP8/CBL10 in shoots. The Ca2+-bound CBL binds the C-terminal NAF/FISL motif of the CBL-interacting
  protein kinase SOS2/CIPK24, relieving its autoinhibition and recruiting it to the plasma membrane.
  The CBL-CIPK24 complex phosphorylates the C-terminal autoinhibitory domain of SOS1/NHX7, an
  electroneutral plasma-membrane Na+/H+ antiporter, relieving its autoinhibition so that SOS1 uses the
  proton-motive force to export Na+ to the apoplast; SOS1 also controls long-distance Na+ partitioning
  at the xylem/symplast boundary. The module ends at SOS1-mediated Na+ efflux. The salt-sensing
  upstream step (GIPC-mediated Ca2+ influx), SOS2 regulation by ABI2, 14-3-3 proteins and GI, the
  vacuolar CBL10-CIPK24 branch and NHX-type vacuolar antiporters, and HKT1-mediated xylem Na+ retrieval
  are outside this module's boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0006883
    title: intracellular sodium ion homeostasis
    statement: The module maintains low cytosolic Na+ by activating plasma-membrane Na+ extrusion.
  - source_id: PMID:10725350
    title: The Arabidopsis SOS2 protein kinase physically interacts with and is activated by the
      calcium-binding protein SOS3.
    statement: SOS3 binds and activates SOS2, defining a regulatory pathway for ion homeostasis.
    supporting_text: >-
      SOS3 and SOS2 define a novel regulatory pathway important for the control of intracellular ion
      homeostasis and salt tolerance in plants
  - source_id: PMID:11006339
    title: SOS3 function in plant salt tolerance requires N-myristoylation and calcium binding.
    statement: SOS3 calcium binding and myristoylation are required for SOS2 interaction and salt
      tolerance.
    supporting_text: >-
      these results strongly suggest that both N-myristoylation and calcium binding are required for SOS3
      function in plant salt tolerance
  - source_id: PMID:21262798
    title: Activation of the plasma membrane Na/H antiporter Salt-Overly-Sensitive 1 (SOS1) by
      phosphorylation of an auto-inhibitory C-terminal domain.
    statement: The SOS2-SOS3 complex activates SOS1 by phosphorylating its C-terminal autoinhibitory
      domain.
    supporting_text: >-
      SOS1 is relieved from auto-inhibition upon phosphorylation of the auto-inhibitory domain by
      SOS2-SOS3
  - source_id: PMID:17449811
    title: SCABP8/CBL10, a putative calcium sensor, interacts with the protein kinase SOS2 to protect
      Arabidopsis shoots from salt stress.
    statement: CBL10/SCaBP8 is a shoot calcium sensor that recruits SOS2 to the plasma membrane and
      activates SOS1.
    supporting_text: >-
      recruit SOS2 to the plasma membrane, enhance SOS2 activity in a calcium-dependent manner, and
      activate SOS1 in yeast
notes: >-
  Arabidopsis thaliana proteins are used as representative members, grounded with reviewed UniProtKB
  accessions: SOS1/NHX7 Q9LKW9 and SOS2/CIPK24 Q9LDI3 from the gene review folders; SOS3/CBL4 O81223
  and SCaBP8/CBL10 Q7FRS8 from UniProt (no gene reviews yet). Annoton molecular functions match the
  gene reviews' core functions: CIPK24 protein serine/threonine kinase activity (GO:0004674) and SOS1
  sodium:proton antiporter activity (GO:0015385). The CBL sensor annoton uses protein kinase activator
  activity (GO:0030295), supported by SOS3 binding and activating SOS2 (PMID:10725350); calcium ion
  sensor activity (GO:0061891) would be an alternative framing and is described in the role text.
  CBL4 (roots) and CBL10 (shoots) are treated as tissue-preferential members of one Ca2+-sensor role
  rather than as a formal variant set, because both act on the same SOS2-SOS1 relay at the plasma
  membrane; CBL10 also targets CIPK24 to the tonoplast, a branch not modeled here. Boundary decision
  on HKT1 (Q84TI7, reviewed): HKT1 is a plasma-membrane Na+ uniporter (GO:0015081) that retrieves Na+
  from the xylem sap and recirculates it to roots. It acts in parallel with SOS1 on whole-plant Na+
  partitioning but is not a substrate of the CBL-CIPK24 relay, so including it would turn this signaling
  module into a broader Na+ homeostasis program; it is excluded and would belong in a future
  whole-plant Na+ partitioning module together with SOS1's long-distance role. No PANTHER family ids are
  asserted. No production GO-CAM in gocams/index.tsv contains these Arabidopsis proteins (checked
  2026-10-14 by UniProt accession), so no gocam_associations are given.
module:
  id: sos_salt_tolerance
  label: SOS salt-tolerance pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: intracellular sodium ion homeostasis
      term:
        id: GO:0006883
        label: intracellular sodium ion homeostasis
      description: Calcium-dependent activation of plasma-membrane Na+ extrusion by the CBL-CIPK24-SOS1
        relay keeps cytosolic Na+ low under salinity.
    - preferred_term: cellular response to salt stress
      term:
        id: GO:0071472
        label: cellular response to salt stress
      description: The relay is engaged by salt-induced Ca2+ signals.
  context:
    taxa:
      - preferred_term: land plants
        term:
          id: NCBITaxon:3193
          label: Embryophyta
        description: CBL-CIPK networks and SOS1-type antiporters are conserved across land plants;
          Arabidopsis thaliana provides the representative members.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
  parts:
    - order: 1
      role: Ca2+ sensing by CBL proteins
      node:
        id: cbl_calcium_sensing
        label: Ca2+ sensing by SOS3/CBL4 and SCaBP8/CBL10
        module_type: REGULATORY_STEP
        description: >-
          Salt stress elicits a cytosolic Ca2+ transient. The N-myristoylated EF-hand sensor SOS3/CBL4
          (roots) or SCaBP8/CBL10 (shoots) binds Ca2+, binds the NAF/FISL motif of SOS2/CIPK24, relieves
          its autoinhibition and recruits it to the plasma membrane.
        annotons:
          - id: cbl_sensor
            label: CBL calcium sensor (SOS3/CBL4, SCaBP8/CBL10)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: calcineurin B-like calcium sensors acting on CIPK24 (CBL4/SOS3, CBL10/SCaBP8)
                representative_members:
                  - preferred_term: SOS3/CBL4 (Arabidopsis)
                    term:
                      id: UniProtKB:O81223
                      label: Calcineurin B-like protein 4
                  - preferred_term: SCaBP8/CBL10 (Arabidopsis)
                    term:
                      id: UniProtKB:Q7FRS8
                      label: Calcineurin B-like protein 10
            function:
              preferred_term: protein kinase activator activity
              term:
                id: GO:0030295
                label: protein kinase activator activity
              evidence:
                - source_id: PMID:10725350
                  statement: SOS3 binds and activates the SOS2 kinase.
                  supporting_text: SOS3 physically interacts with and activates SOS2 protein kinase
                - source_id: PMID:11402167
                  statement: The SOS3-binding motif of SOS2 is an autoinhibitory domain.
                  supporting_text: Removal of the regulatory domain of SOS2, including the SOS3 binding
                    motif, resulted in constitutive activation of the protein kinase, indicating that the
                    SOS3 binding motif can serve as a kinase autoinhibitory domain
            processes:
              - preferred_term: cellular response to salt stress
                term:
                  id: GO:0071472
                  label: cellular response to salt stress
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Binds Ca2+ (calcium ion sensor), then binds and activates SOS2/CIPK24 and
              recruits it to the plasma membrane.
    - order: 2
      role: SOS2/CIPK24 kinase activation
      node:
        id: cipk24_kinase_step
        label: SOS2/CIPK24 phosphorylation of SOS1
        module_type: REGULATORY_STEP
        description: >-
          The CBL-bound SOS2/CIPK24 kinase phosphorylates the C-terminal autoinhibitory domain of SOS1
          (and its CBL partner, stabilizing the complex), activating Na+/H+ exchange.
        annotons:
          - id: cipk24_kinase
            label: SOS2/CIPK24 protein kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOS2/CIPK24 (Arabidopsis)
                term:
                  id: UniProtKB:Q9LDI3
                  label: CBL-interacting serine/threonine-protein kinase 24
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:10725382
                  statement: SOS2 is an active protein kinase required for Na+ and K+ homeostasis.
                  supporting_text: Autophosphorylation assays show that SOS2 is an active protein kinase.
                - source_id: PMID:21262798
                  statement: SOS2-SOS3 phosphorylates the SOS1 autoinhibitory domain.
                  supporting_text: SOS1 is relieved from auto-inhibition upon phosphorylation of the
                    auto-inhibitory domain by SOS2-SOS3
            processes:
              - preferred_term: regulation of sodium ion transport
                term:
                  id: GO:0002028
                  label: regulation of sodium ion transport
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
                evidence:
                  - source_id: PMID:17449811
                    statement: CBL calcium sensors recruit SOS2/CIPK24 to the plasma membrane,
                      where it acts on SOS1. The CIPK24 gene review and GOA record only its
                      nuclear/cytosolic pools, so this location is the CBL-dependent pool.
                    supporting_text: recruit SOS2 to the plasma membrane
            role_description: Phosphorylates and activates SOS1 when bound to a Ca2+-loaded CBL.
    - order: 3
      role: Na+ extrusion by SOS1
      node:
        id: sos1_na_extrusion
        label: SOS1 Na+/H+ antiport at the plasma membrane
        module_type: TRANSPORT_STEP
        description: >-
          Activated SOS1/NHX7 exchanges cytosolic Na+ for extracellular H+, driven by the plasma-membrane
          proton gradient, exporting Na+ from root epidermal cells and controlling Na+ loading or
          retrieval at the xylem/symplast boundary.
        annotons:
          - id: sos1_antiporter
            label: SOS1/NHX7 plasma-membrane Na+/H+ antiporter
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOS1/NHX7 (Arabidopsis)
                term:
                  id: UniProtKB:Q9LKW9
                  label: Sodium/hydrogen exchanger 7
            function:
              preferred_term: sodium:proton antiporter activity
              term:
                id: GO:0015385
                label: sodium:proton antiporter activity
              evidence:
                - source_id: PMID:10823923
                  statement: SOS1 resembles microbial plasma-membrane Na+/H+ antiporters.
                  supporting_text: The transmembrane region of SOS1 has significant sequence similarities
                    to plasma membrane Na + /H + antiporters from bacteria and fungi.
                - source_id: PMID:11884687
                  statement: SOS1 is a Na+-specific plasma-membrane transporter controlling long-distance
                    Na+ movement.
                  supporting_text: SOS1 is a plasma membrane Na + transporter essential for controlling
                    long-distance Na + movement in plants.
            processes:
              - preferred_term: sodium ion export across plasma membrane
                term:
                  id: GO:0036376
                  label: sodium ion export across plasma membrane
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Exports Na+ from the cytosol in exchange for H+.
  connections:
    - source: cbl_calcium_sensing
      target: cipk24_kinase_step
      connection_type: POSITIVELY_REGULATES
      description: Ca2+-bound SOS3/CBL4 or CBL10 binds and activates SOS2/CIPK24 and recruits it to the
