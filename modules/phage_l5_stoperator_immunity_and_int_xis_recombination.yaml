id: MODULE:phage_l5_stoperator_immunity_and_int_xis_recombination
title: Mycobacteriophage L5 stoperator-mediated transcriptional silencing, early host growth arrest, and Int/Xis site-specific recombination
description: 'The lysogenic-lytic regulatory, host-shutoff, and site-specific integration/excision module of temperate siphovirus
  Mycobacterium phage L5 (52,297 bp linear dsDNA with 9-nt 3''-cohesive cos extensions). Unlike lambdoid coliphages that govern
  lysogeny via cooperative operator binding around divergent CI/Cro promoters, L5 establishes and maintains prophage latency
  and superinfection immunity through a single 183-residue repressor-like immunity protein gp71 (gene 71). gp71 operates via
  a dual mechanism: (1) operator binding at the early lytic promoter Pleft near the right genome end to repress transcription
  initiation, and (2) binding to approximately 24 asymmetric 13-bp stoperator sites (consensus 5''-GGTGGATGTCAAG-3'') distributed
  across the 52.3-kb genome predominantly in the transcription-blocking orientation to physically arrest elongating RNA polymerase
  complexes. When Pleft transcription proceeds upon lytic infection or derepression, the early leftward operon expresses three
  small cytotoxic host-growth-inhibitory proteins—gp77, gp78, and gp79—that arrest Mycobacterium smegmatis cell division and
  colony formation, with gp77 directly binding host pyridoxal-phosphate-dependent L-serine dehydratase (MSMEG_3532). Prophage
  chromosomal maintenance is mediated by the tyrosine integrase Int (gp33), which cooperates with the mycobacterial integration
  host factor (mIHF) to assemble a higher-order intasome on core-type and arm-type (P1-P7) sites of supercoiled attP DNA and
  catalyze site-specific integration into the 29-bp core overlapping the 3'' end of the host tRNA-Gly attB gene. Directionality
  is reversed during prophage induction by the 56-residue helix-turn-helix excisionase Xis (gp36), which binds cooperatively
  to four X1-X4 recognition sites within attR, bends DNA to promote Int arm-type bridging in the excisive intasome, activates
  attL x attR excisive recombination, and inhibits attP x attB re-integration.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  statement: Complete 52,297-bp genome sequence and transcriptional organization of mycobacteriophage L5, defining the Pleft
    early lytic promoter, gene 71 immunity region, and attP-int integration cassette.
- source_id: PMID:8459767
  title: 'Superinfection immunity of mycobacteriophage L5: applications for genetic transformation of mycobacteria.'
  statement: Identifies gene 71 as the sole L5 gene required to confer superinfection immunity and maintain lysogeny in Mycobacterium
    smegmatis.
- source_id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  statement: Maps promoters driving gene 71 expression and characterizes gp71 autoregulation and Pleft operator repression.
- source_id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  statement: Demonstrates that L5 immunity repressor gp71 binds asymmetric 13-bp stoperator sites oriented throughout the
    phage genome to block transcription elongation by RNA polymerase.
- source_id: PMID:1901654
  title: 'Site-specific integration of mycobacteriophage L5: integration-proficient vectors for Mycobacterium smegmatis, Mycobacterium
    tuberculosis, and bacille Calmette-Guérin.'
  statement: Identifies and sequences the L5 attP-int region (gene 33) and demonstrates site-specific integration into the
    mycobacterial chromosome.
- source_id: PMID:8226625
  title: Mycobacteriophage L5 integrase-mediated site-specific integration in vitro.
  statement: Reconstitutes L5 gp33 tyrosine integrase-mediated attP x attB recombination in vitro and demonstrates the requirement
    for a mycobacterial host factor.
- source_id: PMID:8986825
  title: A novel host factor for integration of mycobacteriophage L5.
  statement: Purifies and characterizes mycobacterial integration host factor (mIHF) as the essential host architectural cofactor
    for L5 Int-mediated integrative recombination.
- source_id: PMID:10652095
  title: Identification and characterization of mycobacteriophage L5 excisionase.
  statement: Identifies gene 36 (XIS) as the L5 excisionase required for efficient attL x attR excisive recombination and
    inhibition of integrative recombination.
- source_id: PMID:12581642
  title: Control of directionality in L5 integrase-mediated site-specific recombination.
  statement: Shows that gp36 (Xis) binds four X1-X4 repeats in attR/attP and bends DNA to promote Int arm-type bridging in
    the excisive intasome.
- source_id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5 leading to growth inhibition in Mycobacterium
    smegmatis.
  statement: Demonstrates that early Pleft operon products gp77, gp78, and gp79 inhibit Mycobacterium smegmatis growth and
    colony formation.
- source_id: PMID:21656815
  title: The cytotoxic early protein 77 of mycobacteriophage L5 interacts with MSMEG_3532, an L-serine dehydratase of Mycobacterium
    smegmatis.
  statement: Shows that L5 early cytotoxic protein gp77 physically interacts with host L-serine dehydratase MSMEG_3532 to
    remodel host metabolism and arrest growth.
notes: 'Exemplar organism: Mycobacterium phage L5 (NCBITaxon:31757, UniProt proteome UP000002402). Represents the archetypal
  Cluster A mycobacteriophage stoperator immunity and tyrosine integrase/excisionase module shared across related Actinobacteriophages
  such as D29, Bxb1, and Che12.'
