id: MODULE:isoprenoid_diphosphate_biosynthesis
title: Isoprenoid (prenyl) diphosphate biosynthesis (IPP/DMAPP -> GPP -> FPP -> GGPP)
description: >-
  The isoprenoid-diphosphate trunk converts the universal five-carbon isoprene units produced by the
  mevalonate pathway (or, in bacteria and plastids, the MEP pathway; both curated separately) into the
  linear trans-prenyl diphosphates that seed the major downstream isoprenoid classes. Isopentenyl-
  diphosphate delta-isomerase (type 1 IDI) reversibly interconverts isopentenyl diphosphate (IPP) and its
  allylic isomer dimethylallyl diphosphate (DMAPP), supplying the allylic primer. Farnesyl diphosphate
  synthase then carries out two sequential head-to-tail (trans, 1'-4) condensations: DMAPP + IPP ->
  geranyl diphosphate (GPP, C10), and GPP + IPP -> farnesyl diphosphate (FPP, C15). FPP is the central
  branch point: it feeds sterol synthesis (cholesterol in animals, ergosterol in fungi, via squalene),
  heme A, ubiquinone side chains, dolichol (cis-prenyltransferases) and protein farnesylation. A
  geranylgeranyl diphosphate synthase adds one more IPP to FPP giving geranylgeranyl diphosphate (GGPP,
  C20), the donor for protein geranylgeranylation. The GGPP step has two architectures: a dedicated
  homomeric GGPP synthase (human GGPS1, budding-yeast BTS1), or, in fission yeast, which lacks a GGPS1/BTS1
  homolog, a heteromer of the FPP synthase Fps1 with an inactive FPP-synthase-like subunit Spo9. All
  enzymes are soluble Mg2+-dependent isomerases/prenyltransferases (animal IDI1/IDI2 also peroxisomal).
  The pathway is the pharmacological target of nitrogen bisphosphonates (FDPS); human GGPS1
  loss-of-function causes a muscular dystrophy / sensorineural hearing loss / ovarian insufficiency
  syndrome.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0008299
    title: isoprenoid biosynthetic process
    statement: IDI, FPP synthase and GGPP synthase build the linear prenyl diphosphates of isoprenoid metabolism (GO:0008299).
  - source_id: GO:0045337
    title: trans, trans-farnesyl diphosphate biosynthetic process
    statement: FPP synthase produces farnesyl diphosphate (GO:0045337) via GPP (GO:0033384).
  - source_id: GO:0033386
    title: geranylgeranyl diphosphate biosynthetic process
    statement: GGPP synthase produces geranylgeranyl diphosphate (GO:0033386).
  - source_id: YeastPathways:PWY-5123
    title: trans, trans-farnesyl diphosphate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists IDI1 (IPP isomerase) and ERG20 (both the GPP- and FPP-forming
      condensations) for this frame; both assignments were retained. The frame stops at FPP;
      the GGPP synthase BTS1 was added from the literature (PMID:7665600). COQ1
      (hexaprenyl diphosphate synthase) is a long-chain prenyltransferase of the
      ubiquinone pathway and is modelled with coenzyme Q biosynthesis, not here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5123
  - source_id: PMID:2681212
    title: 'Isopentenyl diphosphate:dimethylallyl diphosphate isomerase. An improved purification
      of the enzyme and isolation of the gene from Saccharomyces cerevisiae.'
    statement: Purification of yeast IPP isomerase and isolation of its structural gene (IDI1).
    supporting_text: >-
      Oligonucleotide probes based on the protein sequence were used to isolate the
      structural gene encoding IPP isomerase from a yeast lambda library.
  - source_id: PMID:2681213
    title: Farnesyl diphosphate synthetase. Molecular cloning, sequence, and expression of
      an essential gene from Saccharomyces cerevisiae.
    statement: The yeast FPP synthase gene (ERG20) is essential and supplies C15 precursors for sterols, dolichols and ubiquinones.
    supporting_text: >-
      demonstrates that the gene is an essential, single copy number gene in yeast.
  - source_id: PMID:7665600
    title: BTS1 encodes a geranylgeranyl diphosphate synthase in Saccharomyces cerevisiae.
    statement: BTS1 is the budding-yeast GGPP synthase; it is not essential but is needed for normal protein geranylgeranylation.
    supporting_text: >-
      This suppressor gene, called BTS1, encodes the yeast
      geranylgeranyl diphosphate synthase.
  - source_id: PMID:17596513
    title: Geranylgeranyl diphosphate synthase in fission yeast is a heteromer of farnesyl
      diphosphate synthase (FPS), Fps1, and an FPS-like protein, Spo9, essential for sporulation.
    statement: >-
      In S. pombe, Fps1 is the FPP synthase, no GGPS homolog exists, and GGPP synthase
      activity requires a complex of Fps1 with the FPS-like Spo9.
    supporting_text: >-
      Thus, neither Fps1 nor Spo9 alone functions as a GGPS, but
      the two proteins together form a complex with GGPS activity.
  - source_id: file:yeast/ERG10/ERG10-ai-review.yaml
    title: ERG10 gene review (S. cerevisiae)
    statement: >-
      Upstream context only: ERG10 supplies acetoacetyl-CoA to the mevalonate pathway
      that produces the IPP consumed here.
  - source_id: file:human/IDI1/IDI1-ai-review.yaml
    title: IDI1 gene review (human)
    statement: IPP<->DMAPP isomerase, ubiquitous (UniProtKB:Q13907, GO:0004452) matches the completed human IDI1 review.
  - source_id: file:human/IDI2/IDI2-ai-review.yaml
    title: IDI2 gene review (human)
    statement: IPP<->DMAPP isomerase, muscle-enriched paralog (UniProtKB:Q9BXS1, GO:0004452) matches the completed human IDI2 review.
  - source_id: file:human/FDPS/FDPS-ai-review.yaml
    title: FDPS gene review (human)
    statement: Farnesyl diphosphate synthase, DMAPP+IPP->GPP->FPP (UniProtKB:P14324, GO:0004337/GO:0004161) matches the completed human FDPS review.
  - source_id: file:human/GGPS1/GGPS1-ai-review.yaml
    title: GGPS1 gene review (human)
    statement: Geranylgeranyl diphosphate synthase, FPP+IPP->GGPP (UniProtKB:O95749, GO:0004311) matches the completed human GGPS1 review.
module:
  id: isoprenoid_diphosphate_biosynthesis
  label: Isoprenoid (prenyl) diphosphate biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: isoprenoid biosynthetic process
      term:
        id: GO:0008299
        label: isoprenoid biosynthetic process
      description: Synthesis of the linear prenyl diphosphates (GPP/FPP/GGPP) from IPP/DMAPP.
    - preferred_term: trans, trans-farnesyl diphosphate biosynthetic process
      term:
        id: GO:0045337
        label: trans, trans-farnesyl diphosphate biosynthetic process
      description: FPP synthase makes the central C15 branch-point precursor FPP (via GPP).
    - preferred_term: geranylgeranyl diphosphate biosynthetic process
      term:
        id: GO:0033386
        label: geranylgeranyl diphosphate biosynthetic process
      description: GGPP synthase elongates FPP to the C20 donor GGPP.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: All three activities are cytosolic.
      - preferred_term: peroxisome
        term:
          id: GO:0005777
          label: peroxisome
        description: Animal IDI1/IDI2 carry a PTS1 and are also peroxisomal.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-5123
      title: 'trans, trans-farnesyl diphosphate biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with IDI1 (GO:0004452) and two ERG20 activities (GO:0004161 GPP
        synthase and GO:0004337 FPP synthase), all in cytosol and part_of GO:0045337,
        without causal edges. It does not include a GGPP synthase.
    - model: gomodel:662af8fa00000499
      title: isoprenoid biosynthetic process (GO:0008299)
      description: >-
        PomBase S. pombe model; the idi1, fps1 and spo9 activities belong to this module
        (its mevalonate-pathway activities are in mevalonate_pathway). Both fps1 and spo9
        are typed GO:0004337 FPP synthase, and the Fps1-Spo9 GGPP synthase heteromer is
        not represented (see notes).
  parts:
    - order: 1
      role: IPP/DMAPP isomerization
      node:
        id: ipp_isomerization
        label: Isopentenyl-diphosphate delta-isomerase (type 1 IDI)
        module_type: REACTION
        annotons:
          - id: idi_activity
            label: isopentenyl-diphosphate delta-isomerase (type 1)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IDI / isopentenyl-diphosphate delta-isomerase (type 1) family
                term:
                  id: PANTHER:PTHR10885
                  label: ISOPENTENYL-DIPHOSPHATE DELTA-ISOMERASE
                representative_members:
                  - preferred_term: IDI1 (human; ubiquitous)
                    term:
                      id: UniProtKB:Q13907
                      label: Isopentenyl-diphosphate Delta-isomerase 1
                  - preferred_term: IDI2 (human; muscle-enriched)
                    term:
                      id: UniProtKB:Q9BXS1
                      label: Isopentenyl-diphosphate Delta-isomerase 2
                  - preferred_term: IDI1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P15496
                      label: Isopentenyl-diphosphate Delta-isomerase
                  - preferred_term: idi1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q10132
                      label: Isopentenyl-diphosphate delta-isomerase
            function:
              preferred_term: isopentenyl-diphosphate delta-isomerase activity
              term:
                id: GO:0004452
                label: isopentenyl-diphosphate delta-isomerase activity
              substrates:
                - preferred_term: isopentenyl diphosphate (IPP)
              products:
                - preferred_term: dimethylallyl diphosphate (DMAPP)
              evidence:
                - source_id: file:human/IDI1/IDI1-ai-review.yaml
                  statement: Reversible IPP<->DMAPP isomerization (Mg2+/Mn2+); provides the DMAPP primer for FDPS; IDI2 is a muscle-enriched paralog
                - source_id: PMID:2681212
                  title: 'Isopentenyl diphosphate:dimethylallyl diphosphate isomerase. An improved purification
                    of the enzyme and isolation of the gene from Saccharomyces cerevisiae.'
                  statement: The yeast enzyme interconverts the homoallylic (IPP) and allylic (DMAPP) building blocks.
                  supporting_text: >-
                    catalyzes the
                    interconversion of the primary five-carbon homoallylic and allylic diphosphate
                    building blocks
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: peroxisome
                term:
                  id: GO:0005777
                  label: peroxisome
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-5123
                activity: gomodel:IPPISOM-RXN
                title: 'trans, trans-farnesyl diphosphate biosynthesis - imported from: Saccharomyces Genome Database'
                description: S. cerevisiae IDI1 enables GO:0004452 in cytosol.
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00000992
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe idi1 enables GO:0004452 in cytosol.
            role_description: >-
              Interconvert IPP and DMAPP to supply the allylic primer and balance the
              isoprene-unit pools. The peroxisome location applies to the animal
              enzymes; the yeast enzymes are recorded as cytoplasmic.
    - order: 2
      role: GPP + FPP synthesis (trans-prenyltransferase)
      node:
        id: fpp_synthesis
        label: Farnesyl diphosphate synthase (FDPS / ERG20 / Fps1)
        module_type: REACTION
        annotons:
          - id: fdps_activity
            label: farnesyl diphosphate synthase (DMAPP+IPP->GPP->FPP)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FDPS / farnesyl pyrophosphate synthase family
                term:
                  id: PANTHER:PTHR11525
                  label: FARNESYL-PYROPHOSPHATE SYNTHETASE
                representative_members:
                  - preferred_term: FDPS (human)
                    term:
                      id: UniProtKB:P14324
                      label: Farnesyl pyrophosphate synthase
                  - preferred_term: ERG20 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P08524
                      label: Farnesyl pyrophosphate synthase
                  - preferred_term: fps1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O14230
                      label: Farnesyl pyrophosphate synthase
            function:
              preferred_term: (2E,6E)-farnesyl diphosphate synthase activity
              term:
                id: GO:0004337
                label: (2E,6E)-farnesyl diphosphate synthase activity
              substrates:
                - preferred_term: dimethylallyl diphosphate (DMAPP)
                - preferred_term: isopentenyl diphosphate (IPP; Mg2+)
              products:
                - preferred_term: (2E,6E)-farnesyl diphosphate (FPP)
                - preferred_term: geranyl diphosphate (GPP; intermediate)
                - preferred_term: diphosphate
              evidence:
                - source_id: file:human/FDPS/FDPS-ai-review.yaml
                  statement: Two sequential trans (1'-4) condensations DMAPP+IPP->GPP (GO:0004161) and GPP+IPP->FPP (GO:0004337); nitrogen-bisphosphonate target
                - source_id: PMID:2681213
                  title: Farnesyl diphosphate synthetase. Molecular cloning, sequence, and expression of
                    an essential gene from Saccharomyces cerevisiae.
                  statement: Yeast ERG20 encodes the essential FPP synthase, similar to the animal enzyme.
                  supporting_text: >-
                    Farnesyl diphosphate (FPP) synthetase is a key enzyme in isoprenoid biosynthesis
                    which supplies C15 precursors for several classes of essential metabolites
                    including sterols, dolichols, and ubiquinones.
                - source_id: PMID:17596513
                  title: Geranylgeranyl diphosphate synthase in fission yeast is a heteromer of farnesyl
                    diphosphate synthase (FPS), Fps1, and an FPS-like protein, Spo9, essential for sporulation.
                  statement: S. pombe Fps1 complements an S. cerevisiae FPS-deficient mutant and is the fission-yeast FPP synthase.
                  supporting_text: >-
                    indicating that S. pombe Fps1 in fact functions as an FPS
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-5123
                activity: gomodel:FPPSYN-RXN
                title: 'trans, trans-farnesyl diphosphate biosynthesis - imported from: Saccharomyces Genome Database'
                description: >-
                  ERG20 enables GO:0004337 in cytosol; the GPP-forming half reaction is a
                  separate activity, gomodel:GPPSYN-RXN (GO:0004161).
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00001380
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe fps1 enables GO:0004337 in cytosol.
            role_description: Elongate DMAPP with two IPP units to the C15 branch-point precursor FPP.
    - order: 3
      role: GGPP synthesis (trans-prenyltransferase)
      node:
        id: ggpp_synthesis
        label: Geranylgeranyl diphosphate synthase (FPP + IPP -> GGPP)
        module_type: REACTION
        variant_sets:
          - id: ggpps_architecture_variants
            label: GGPP synthase architecture
            axis: enzyme architecture
            selection: EXACTLY_ONE
            variants:
              - id: homomeric_ggps_variant
                label: Dedicated homomeric GGPP synthase (GGPS1 / BTS1)
                module_type: REACTION
                annotons:
                  - id: ggps1_activity
                    label: geranylgeranyl diphosphate synthase (FPP+IPP->GGPP)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GGPS1 / geranylgeranyl pyrophosphate synthase family
                        term:
                          id: PANTHER:PTHR12001
                          label: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
                        representative_members:
                          - preferred_term: GGPS1 (human)
                            term:
                              id: UniProtKB:O95749
                              label: Geranylgeranyl pyrophosphate synthase
                          - preferred_term: BTS1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:Q12051
                              label: Geranylgeranyl pyrophosphate synthase BTS1
                    function:
                      preferred_term: geranylgeranyl diphosphate synthase activity
                      term:
                        id: GO:0004311
                        label: geranylgeranyl diphosphate synthase activity
                      substrates:
                        - preferred_term: (2E,6E)-farnesyl diphosphate (FPP)
                        - preferred_term: isopentenyl diphosphate (IPP; Mg2+)
                      products:
                        - preferred_term: (2E,6E,10E)-geranylgeranyl diphosphate (GGPP)
                        - preferred_term: diphosphate
                      evidence:
                        - source_id: file:human/GGPS1/GGPS1-ai-review.yaml
                          statement: FPP+IPP->GGPP (C20 donor for protein geranylgeranylation); homohexamer; loss causes muscular dystrophy/hearing-loss/POI
                        - source_id: PMID:7665600
                          title: BTS1 encodes a geranylgeranyl diphosphate synthase in Saccharomyces cerevisiae.
                          statement: BTS1 deletion is viable but impairs geranylgeranylation and causes cold sensitivity.
                          supporting_text: >-
                            BTS1 is not essential for the vegetative
                            growth of cells; however, disrupting it impedes the geranylgeranylation of many
                            cellular proteins and renders cells cold sensitive for growth.
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: Elongate FPP with one IPP unit to the C20 donor GGPP.
              - id: fps_heteromer_ggps_variant
                label: Heteromeric FPS / FPS-like GGPP synthase (S. pombe Fps1-Spo9)
                module_type: PROTEIN_COMPLEX
                notes: >-
                  S. pombe has no GGPS1/BTS1-family protein. GGPP synthase activity
                  appears only when Fps1 and the FPS-like Spo9 are co-expressed, the two
                  proteins interact, and spo9 mutants have reduced GGPS activity and
                  impaired geranylgeranylation (PMID:17596513). Spo9 alone does not
                  complement an FPS-deficient budding-yeast mutant. Both proteins belong
                  to the FPP synthase family PTHR11525.
                annotons:
                  - id: fps1_spo9_ggps_activity
                    label: Fps1-Spo9 heteromeric geranylgeranyl diphosphate synthase
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: Fps1-Spo9 GGPP synthase heteromer
                        description: >-
                          Complex of the catalytic FPP synthase Fps1 and the FPS-like
                          Spo9 subunit; the complex, not either subunit, has GGPS activity.
                        active_units:
                          - id: fps1_ggps_subunit
                            label: Fps1 catalytic FPP synthase subunit
                            role: >-
                              FPP synthase that, together with Spo9, forms the
                              GGPP-synthesising heteromer.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: fps1 (Schizosaccharomyces pombe)
                                term:
                                  id: UniProtKB:O14230
                                  label: Farnesyl pyrophosphate synthase
                          - id: spo9_ggps_subunit
                            label: Spo9 FPS-like subunit
                            role: >-
                              FPS-like partner required for GGPS activity of the
                              heteromer; lacks FPS activity on its own.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: spo9 (Schizosaccharomyces pombe)
                                term:
                                  id: UniProtKB:O59703
                                  label: Geranylgeranyl pyrophosphate synthase
                    function:
                      preferred_term: geranylgeranyl diphosphate synthase activity
                      term:
                        id: GO:0004311
                        label: geranylgeranyl diphosphate synthase activity
                      substrates:
                        - preferred_term: (2E,6E)-farnesyl diphosphate (FPP)
                        - preferred_term: isopentenyl diphosphate (IPP)
                      products:
                        - preferred_term: (2E,6E,10E)-geranylgeranyl diphosphate (GGPP)
                      evidence:
                        - source_id: PMID:17596513
                          title: Geranylgeranyl diphosphate synthase in fission yeast is a heteromer of farnesyl
                            diphosphate synthase (FPS), Fps1, and an FPS-like protein, Spo9, essential for sporulation.
                          statement: Co-expression of fps1 and spo9 is needed for GGPS activity.
                          supporting_text: >-
                            although neither fps1(+) nor spo9(+) expression alone in
                            E. coli confers clear GGPS activity, coexpression of both genes induces such
                            activity.
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:662af8fa00000499
                        activity: gomodel:662af8fa00000499/662af8fa00000638
                        title: isoprenoid biosynthetic process (GO:0008299)
                        description: >-
                          spo9 is typed GO:0004337 FPP synthase in cytosol; per
                          PMID:17596513 Spo9 is the non-FPS partner of the GGPS heteromer,
                          so the activity type disagrees with the literature.
                    role_description: >-
                      Fission-yeast route to GGPP in the absence of a dedicated GGPS;
                      required for geranylgeranylation of proteins needed for
                      forespore-membrane expansion.
  connections:
    - source: ipp_isomerization
      target: fpp_synthesis
      connection_type: PRECEDES
      description: IPP isomerase supplies the DMAPP primer (and balances IPP) that FPP synthase condenses to GPP/FPP.
    - source: fpp_synthesis
      target: ggpp_synthesis
      connection_type: PRECEDES
      description: FPP made by FPP synthase is the substrate GGPP synthase elongates to GGPP.
  notes: >-
    Isoprenoid (prenyl) diphosphate biosynthesis trunk (GO:0008299), the bridge between the
    mevalonate pathway (mevalonate_pathway) and the sterol (sterol_commitment_squalene_to_lanosterol,
    ergosterol_biosynthesis), dolichol, ubiquinone and protein-prenylation branches. Aligned to
    YeastCyc PWY-5123 and the PomBase isoprenoid GO-CAM: S. cerevisiae IDI1 (P15496) and ERG20
    (P08524), S. pombe idi1 (Q10132) and fps1 (O14230) were added as representatives of the
    existing families, and BTS1 (Q12051; PTHR12001), which YeastCyc does not list in this frame,
    was added to the GGPP step. The GGPP step became a variant set, because fission yeast makes
    GGPP with a heteromer of the FPP synthase Fps1 and the FPS-like Spo9 instead of a GGPS1/BTS1
    homolog (PMID:17596513). The PomBase GO-CAM types spo9 as an FPP synthase (GO:0004337) and does
    not model the heteromer's GGPS activity. Its UniProt name (geranylgeranyl pyrophosphate
    synthase) reflects the heteromer and should not be read as activity of Spo9 alone. COQ1
    (hexaprenyl diphosphate synthase), mentioned in the crosswalk, belongs to coenzyme Q
    biosynthesis (YeastCyc HEXPPSYN-PWY-2) and is excluded; cis-prenyltransferases for dolichol
    (RER2/SRT1, S. pombe rer2) are also downstream branches. Human content kept: IDI1/IDI2
    (cytosol + peroxisome via PTS1), FDPS (nitrogen-bisphosphonate target; partial reactions
    GO:0004161/GO:0004337 share one active site) and GGPS1 (homohexamer; loss-of-function ->
    muscular dystrophy/sensorineural hearing loss/ovarian insufficiency). Connections were retyped
    from PROVIDES_INPUT_FOR to PRECEDES.
