id: MODULE:dmel_nf_y_complex
title: NF-Y CCAAT-binding factor in Drosophila melanogaster
description: >-
  NF-Y is a heterotrimeric transcription factor that binds the CCAAT box found in many eukaryotic
  promoters. Nf-YB and Nf-YC form a histone-fold dimer that binds DNA nonspecifically and
  creates the surface for Nf-YA, which confers sequence-specific recognition of CCAAT. In
  Drosophila, NF-Y regulates genes in eye and neural development and in cell proliferation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000773
  title: 'FlyBase gene group CBFTF: Ccaat-binding factor complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as ccaat-binding factor complex
    (CBFTF); this module models that group.
- source_id: FB:FBgg0002205
  title: 'FlyBase gene group NFY: Ccaat-binding factor complex subunits'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as ccaat-binding factor complex
    subunits (NFY); this module models that group.
- source_id: GO:0016602
  title: CCAAT-binding factor complex
  statement: >-
    GO term grounding the module as CCAAT-binding factor complex.
notes: >-
  FlyBase lists the same three genes in two groups (CBFTF, the complex, and NFY, the subunit
  family); both are realized by this module. FlyBase groups realized by this module: CBFTF
  (FBgg0000773), NFY (FBgg0002205). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_nf_y_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
