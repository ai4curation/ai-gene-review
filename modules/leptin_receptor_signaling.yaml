knowledge_gaps:
  - gap_statement: >-
      Which LepRb branch carries which physiological output in vivo is only partly resolved: mouse
      knock-in and deletion studies separate the Tyr1138-STAT3 arm (energy balance) from Tyr985,
      Tyr1077-STAT5 and SHP2-ERK arms, but the contribution of the SH2B1-IRS-PI3K arm, and whether
      SH2B1 acts mainly as a JAK2 activator or as an IRS adaptor in neurons, is not settled.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      The relative weight of SOCS3 feedback and PTP1B dephosphorylation in diet-induced leptin
      resistance, and whether ER-anchored PTP1B reaches JAK2 at the plasma membrane or after
      receptor endocytosis, remain open.
    gap_kind:
      - BIOLOGY
