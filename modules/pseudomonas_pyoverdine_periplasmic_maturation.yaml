    - gap_statement: >-
        What PvdM does is unknown, which leaves a hole in the middle of this module. The pathway
        review reports it as the only essential gene of the pvdMNO operon - the one whose in-frame
        deletion abolishes pyoverdine, where pvdN and pvdO deletions do not - yet assigns it no
        reaction. So the step the pathway cannot do without is the one step that cannot be
        modelled.
      boundary: >-
        This is a biological unknown rather than a curation gap: no published reaction exists to
        record. PvdM is named in the module's operon context but is deliberately not a part, since
        adding one would assert a step the module cannot describe.
