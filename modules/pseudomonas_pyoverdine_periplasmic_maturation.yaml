            PvdO, possibly in conjunction with other proteins, facilitates the final oxidation
    - gap_statement: >-
        How the fluorophore ring actually closes is not established, and this is the gap that
        touches the step the module otherwise calls solid. The review presents the oxidative
        cyclisation cascade as a proposal of Dorrestein and colleagues that likely gives the
        three-ring fluorophore, and sets beside it a postulated alternative: an intramolecular
        Bucherer reaction, inferred from a trihydroxylated "pseudoverdin" seen in a
        pyoverdine-deficient mutant, with a further proposal that sulfonation facilitates it.
        The review qualifies both halves of that alternative, and both qualifications belong
        here. The pseudoverdin strain was essentially an artificial system with unidentified
        genetic elements and its product non-functional in iron acquisition; and the sulfonated
        dihydropyoverdines on which the sulfonation proposal rests are very lowly abundant and
        might be adducts of media constituents to the reactive dihydropyoverdine rather than
        pathway intermediates at all.
        So it is unknown which chemistry closes the ring and, consequently, whether PvdP
        catalyses the closure or only creates the conditions for it - which is why the review
        writes "promotes" in its text and "catalyzes" in its figure legend without the
        difference being idle.
      boundary: >-
        Settling this needs mechanistic enzymology on the purified protein, not curation: trapping
        or identifying the intermediate between the oxidised catechol and the closed ring. Until
        then part 1 asserts the hydroxylation and the oxidation, which are supported, and asserts
        nothing about the closure in either direction.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
