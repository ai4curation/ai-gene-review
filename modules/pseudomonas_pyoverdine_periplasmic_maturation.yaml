    - gap_statement: >-
        What the oxidations hand their electrons to is unknown, and the review says plainly that
        the electron transport pathways involved have not yet been clarified. There is one lead
        and it needs stating precisely: adding cysteine to a growing ccmC mutant culture
        resulted in formation of ferribactin, which implies a periplasmic redox-active compound
        downstream of PvdP whose supply depends on CcmC. The condition is load-bearing - this is
        not a ccmC mutant accumulating ferribactin on its own - and the lead is not neglected
        either, since the same paragraph cites three ccmC studies. What remains open is the
        identity of the acceptor and whether the same system serves both oxidation steps, which
        is also why the periplasm is an odd compartment for this chemistry.
      boundary: >-
        Identifying the acceptor is wet-lab work. Until then the module asserts the compartment,
        which is directly evidenced, without asserting a redox partner for either oxidation.
