        - reference_id: PMID:30386787
          reference_section_type: DISCUSSION
          supporting_text: >-
            which thereby also promotes the cyclization and formation of the dihydropyoverdine
        - reference_id: PMID:30386787
          reference_section_type: OTHER
          supporting_text: >-
            Subsequently, PvdP catalyzes the oxidative cyclization, resulting in
            dihydropyoverdine.
        - reference_id: PMID:30386787
          reference_section_type: DISCUSSION
