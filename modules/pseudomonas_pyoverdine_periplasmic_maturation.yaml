id: MODULE:pseudomonas_pyoverdine_periplasmic_maturation
title: Pseudomonas pyoverdine periplasmic maturation
description: >-
  A reusable Pseudomonas module for the periplasmic reactions that convert the exported,
  non-fluorescent pyoverdine precursor into the mature fluorescent siderophore. The
  tyrosinase PvdP carries out the initial hydroxylation and the first oxidation of ferribactin's
  D-tyrosine residue, after which that residue and the adjacent L-2,4-diaminobutyrate cyclise
  into the dihydro form of the dihydroxyquinoline chromophore; which chemistry closes the ring,
  and whether PvdP catalyses the closure, are unsettled. The second oxidation that completes it
  depends on PvdO, an FGE-fold protein encoded in the same operon, though whether PvdO is itself
  the catalyst has never been shown; and, in strains that carry one, a PLP-dependent tailoring
  enzyme converts the glutamate side chain at position 1 into a succinamide or an
  alpha-ketoglutarate residue. That last step is optional and the two routes are not exclusive:
  strains carry both enzymes, one, or neither, those with both make the products of both
  branches, and a strain with neither still makes a mature siderophore with the glutamate
  unmodified. Cytoplasmic precursor supply, NRPS assembly of
  ferribactin, PvdE-dependent export to the periplasm, PvdQ-dependent deacylation, mature
  pyoverdine secretion, ferripyoverdine uptake through FpvA, and iron release are outside
  this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:24816606
    title: PvdP is a tyrosinase that drives maturation of the pyoverdine chromophore in Pseudomonas aeruginosa.
    statement: >-
      Primary enzymology for the first step: identifies PvdP as a periplasmic tyrosinase
      that converts non-fluorescent ferribactin into fluorescent pyoverdine by three
      consecutive oxidation steps, and names the small tyrosinase family of fluorescent
      pseudomonads that this activity belongs to.
    supporting_text: >-
      a periplasmic enzyme of previously unknown function, is a tyrosinase required
  - source_id: PMID:30386787
    title: The biosynthesis of pyoverdines.
    statement: >-
      The review calls PvdP a copper-containing tyrosinase, which is what makes the tyrosinase
      assignment mechanistic rather than nominal. The same sentence's continuation says PvdP
      "thereby also promotes the cyclization", while the pathway-figure legend states it as
      "PvdP catalyzes the oxidative cyclization", so the review is not consistent on PvdP's role
      in the ring closure.
    supporting_text: >-
      The initial hydroxylation and oxidation steps are catalyzed by the copper-containing
      tyrosinase PvdP
  - source_id: PMID:30386787
    title: The biosynthesis of pyoverdines.
    statement: >-
      Pathway review that partitions the oxidation steps between PvdP and PvdO, reports the
      in-frame deletion phenotypes that distinguish the essential from the tailoring enzymes
      of the pvdMNO operon, and describes the two alternative side-chain branches and their
      Tat-dependent delivery to the periplasm.
    supporting_text: >-
      a mutant strain lacking the putative oxidoreductase PvdO produced the dihydropyoverdines,
      indicating that PvdP catalyzes only the initial hydroxylation and first oxidation, whereas
      the final oxidation depends on PvdO
  - source_id: PMID:19787431
    title: Synthesis of the siderophore pyoverdine in Pseudomonas aeruginosa involves a periplasmic maturation.
    statement: >-
      Establishes that pyoverdine maturation takes place in the periplasm rather than the
      cytoplasm, which is the compartment claim the whole module rests on: a fluorescent
      precursor was found stored there in quantity.
    supporting_text: >-
      large amounts of a fluorescent PVDI precursor PVDIp were stored in the periplasm
  - source_id: PMID:16621825
    title: >-
      Pyoverdine-mediated iron uptake in Pseudomonas aeruginosa: the Tat system is required
      for PvdN but not for FpvA transport.
    statement: >-
      Establishes that the periplasmic maturation enzymes reach their compartment through the
      twin-arginine translocation system, and is the direct-evidence source for the
      periplasmic location of PvdN - specifically at the periplasmic face of the cytoplasmic
      membrane rather than free in the compartment. Two caveats on the quote itself. It calls
      PvdN "a still unknown but essential component", which is the interposon-era reading that
      the later in-frame deletions corrected and that this module's own optional: true
      contradicts; the quote is used for the compartment, not for that. And the module keeps the
      location at GO:0030288 rather than adding the periplasmic side of the plasma membrane,
      because a localisation assay placing a Tat-exported soluble protein at the inner
      membrane's periplasmic face does not establish a stable membrane association, and the
      more specific term would assert one.
    supporting_text: >-
      We located PvdN, a still unknown but essential component in Pvd biogenesis, at the
      periplasmic side of the cytoplasmic membrane
  - source_id: file:PSEAE/pvdO/pvdO-uniprot.txt
    title: UniProt entry Q9I185 (Q9I185_PSEAE)
    statement: >-
      That an experimental structure of PvdO exists at 1.24 A over residues 22-284. This grounds
      the modality of part 2's claim - observed rather than predicted - and nothing else; the
      calcium and the fold are grounded by the two items below.
    supporting_text: DR   PDB; 5HHA; X-ray; 1.24 A; A/B=22-284.
  - source_id: file:PSEAE/pvdO/pvdO-uniprot.txt
    title: UniProt entry Q9I185 (Q9I185_PSEAE)
    statement: >-
      That the calcium is bound in that structure rather than inferred. The record's own
      description of what was solved names the ligand, so part 2's "with its calcium site,
      observed rather than predicted" rests on this line and not on the cross-reference above.
    supporting_text: >-
      X-RAY CRYSTALLOGRAPHY (1.24 ANGSTROMS) OF 22-284 IN COMPLEX WITH CA(2+)
  - source_id: file:PSEAE/pvdO/pvdO-uniprot.txt
    title: UniProt entry Q9I185 (Q9I185_PSEAE)
    statement: >-
      That the fold is the formylglycine-generating-enzyme fold. This is a signature match
      rather than a structural determination, which is the right grounding for a fold
      assignment and is what the module means by naming PvdO an FGE-domain protein.
    supporting_text: DR   Pfam; PF03781; FGE-sulfatase; 1.
  - source_id: file:PSEAE/pvdO/pvdO-uniprot.txt
    title: UniProt entry Q9I185 (Q9I185_PSEAE)
    statement: >-
      That the depositors named the protein for the pathway step rather than for sulfatase
      maturation, which the module uses as weak corroboration of the pyoverdine reading.
      Deliberately weak, and the reason belongs with the quote: these depositors share three
      authors - Bai, Xia and Gu - with the group whose PDB 5HH9 deposition claims a cysteine
      desulfurase activity for PvdN, which the sibling gene review discounts as unpublished.
      Both were submitted to the PDB in January 2016. So this is one group's naming, not an
      independent one, and the weight in part 2 rests on NCBIfam and the mutant phenotype.
    supporting_text: 'RT   "Crystal structure of Chromophore maturation protein from Pseudomonas'
  - source_id: PMID:12686626
    title: Identification and characterization of novel pyoverdine synthesis genes in Pseudomonas aeruginosa.
    statement: >-
      Mutational survey of candidate pyoverdine genes in Pseudomonas aeruginosa PAO1, the
      genetic basis for assigning the maturation genes to the pathway.
  - source_id: file:projects/REFSEQ_GO/results/PSEPK/ncbi_proteins.tsv
    title: RefSeq protein annotations for Pseudomonas putida KT2440 (this repository's results)
    statement: >-
      NCBIfam's own product names for the three models cited in this module, which corroborate
      the step assignments independently of the pathway review. NF051454 is the pyoverdine
      maturation tyrosinase, NF051459 the dihydropyoverdine dehydrogenase, and NF051467 the
      pyoverdine-tailoring periplasmic protein PvdN. The rows are the P. putida orthologs, but
      a product name is a property of the HMM rather than of the organism it is applied to.
    supporting_text: >-
      WP_010954970.1	PP_4215	dihydropyoverdine dehydrogenase	HMM:NF051459.1	GO:0002049
notes: >-
  Scope and level. Pyoverdine is restricted to the fluorescent pseudomonads, so the module
  stays at the Pseudomonas level rather than generalising to siderophore maturation at
  large. Pseudomonas aeruginosa PAO1 is the exemplar for the two oxidation steps, where
  PvdP has been purified and assayed and the pvdMNO genes have been mutated; the
  side-chain branch draws on in-frame deletion work in Pseudomonas fluorescens A506, which
  the pathway review states makes the same pyoverdine modifications as P. aeruginosa.

  Why DRAFT rather than COMPLETE. Only the first step has primary enzymology in hand.
  PvdO's assignment to the second oxidation rests on a mutant phenotype reported in a
  review, no activity has ever been measured for the purified protein, and the side-chain
  branch is grounded on the same review rather than on the primary papers it cites. The
  module is therefore published as a scaffold whose first step is solid and whose later
  steps are explicitly provisional, with the gaps recorded below rather than smoothed over.

  What is deliberately not asserted. Two of the three steps carry no molecular function
  term. GO has no term for the second oxidation of the pyoverdine chromophore, and none for
  the PLP-dependent decarboxylation that retains the alpha-amino group, which the review
  describes as a mechanism not previously seen for a PLP enzyme. Rather than fill those
  slots with an ill-fitting term, each annoton carries only a preferred_term. No PANTHER
  family id is asserted for any of the three roles: PvdO's whole-protein HMM assignment is
  to the sulfatase-maturating FGE clade, whose characterised reaction is not the one modelled
  here, and PvdN's is to a class-V PLP aminotransferase clade of cysteine desulfurases, so
  in both cases family membership would say something false about the activity.

  PvdM is named in the description's operon context but is not a part. The pathway review
  reports it as the only essential gene of the pvdMNO operon, yet gives it no reaction, so
  there is nothing to model: adding a part for it would assert a step this module cannot
  describe. It is recorded as a knowledge gap instead.

  Relationship to the other pyoverdine modules. This module begins where
  MODULE:pseudomonas_pyoverdine_precursor_supply ends two stages later: that module supplies
  N5-hydroxy-L-ornithine and L-2,4-diaminobutyrate to the cytoplasmic NRPS line, and
  explicitly scopes out assembly, export and periplasmic maturation. NRPS assembly remains
  unmodelled, so the two modules do not yet meet. Ferripyoverdine re-entry is the domain of
  MODULE:bacterial_tonb_siderophore_import.
module:
  id: pseudomonas_pyoverdine_periplasmic_maturation
  label: Pseudomonas pyoverdine periplasmic maturation
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: pyoverdine biosynthetic process
      term:
        id: GO:0002049
        label: pyoverdine biosynthetic process
    - preferred_term: outer membrane-bounded periplasmic space
      term:
        id: GO:0030288
        label: outer membrane-bounded periplasmic space
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: Chromophore cyclisation and first oxidation
      node:
        id: pvdp_ferribactin_oxidation
        label: PvdP-dependent oxidative cyclisation of ferribactin
        module_type: REACTION
        annotons:
          - id: pvdp_tyrosinase
            label: Pyoverdine maturation tyrosinase PvdP
            participant:
              selector_type: FAMILY
              family:
                preferred_term: >-
                  Pseudomonas pyoverdine maturation tyrosinase family (periplasmic tyrosinases
                  acting on peptidic siderophore substrates)
                description: >-
                  The small family of tyrosinases found in fluorescent pseudomonads that mature
                  the siderophore chromophore, which the primary paper names as such and of
                  which PvdP is the first characterised member. What distinguishes them from
                  ordinary tyrosinases is the substrate: they act on a large peptide rather
                  than on free tyrosine. No PANTHER family id is asserted, because the family
                  this paper describes was defined by function and the module does not need a
                  family grounding to place the step.
                representative_members:
                  - preferred_term: PvdP (Pseudomonas aeruginosa PAO1)
                    description: >-
                      The characterised exemplar: purified, shown to convert non-fluorescent
                      ferribactin to fluorescent pyoverdine, and the protein for which UniProt
                      carries a dedicated NCBIfam model (NF051454 tyrosinase_PvdP).
                    term:
                      id: UniProtKB:Q9I188
                      label: PvdP
            function:
              preferred_term: >-
                tyrosinase activity on a peptide-bound tyrosine residue (hydroxylation and
                first oxidation of the ferribactin chromophore precursor)
              term:
                id: GO:0004503
                label: tyrosinase activity
              substrates:
                - preferred_term: ferribactin (non-fluorescent pyoverdine precursor)
                - preferred_term: dioxygen
              products:
                - preferred_term: dihydropyoverdine
            processes:
              - preferred_term: pyoverdine biosynthetic process
                term:
                  id: GO:0002049
                  label: pyoverdine biosynthetic process
            locations:
              - preferred_term: outer membrane-bounded periplasmic space
                term:
                  id: GO:0030288
                  label: outer membrane-bounded periplasmic space
            role_description: >-
              Hydroxylates the D-tyrosine residue of the exported precursor and performs the
              first oxidation of the resulting catechol; the adjacent L-2,4-diaminobutyrate then
              cyclises with it to give the dihydro form of the chromophore. The hydroxylation and
              the oxidation are what the evidence supports and what this part asserts. How the
              ring closes, and whether PvdP catalyses that closure, are deliberately left open:
              the review calls the oxidative cyclisation cascade a proposal and sets a postulated
              alternative beside it, and it writes PvdP's role in the closure as "promotes" in
              its text and "catalyzes" in its pathway-figure legend. Nothing in this part turns
              on the answer - the substrate, the product and the GO term are the same either way.
              The review also calls PvdP a copper-containing tyrosinase, which is what makes the
              tyrosinase assignment mechanistic rather than nominal. The paper
              reports three consecutive oxidation steps for the overall ferribactin-to-pyoverdine
              conversion, and the review splits them two and one: the initial hydroxylation and
              the first oxidation are PvdP's, while the final oxidation depends on PvdO. That is
              why this part's product is the dihydro intermediate rather than mature pyoverdine.
    - order: 2
      role: Final chromophore oxidation
      node:
        id: pvdo_final_oxidation
        label: PvdO-dependent second oxidation of dihydropyoverdine
        module_type: REACTION
        annotons:
          - id: pvdo_chromophore_oxidation_factor
            label: Pyoverdine chromophore oxidation factor PvdO
            participant:
              selector_type: FAMILY
              family:
                preferred_term: >-
                  Pseudomonas pyoverdine PvdO family (FGE-fold proteins of the pvdMNO
                  maturation operon)
                description: >-
                  The dedicated PvdO protein of the pyoverdine maturation operon. It carries the
                  formylglycine-generating-enzyme fold with its calcium site, observed rather
                  than predicted: PDB 5HHA is a 1.24 A structure with calcium bound, deposited
                  under the name "Chromophore maturation protein". The family grounding that
                  carries the most weight here is NCBIfam's. UniProt gives PvdO a dedicated
                  model, NF051459, whose short name is pyoverdine_PvdO; this repo's RefSeq
                  results show the same model's product name applied to the P. putida ortholog
                  as "dihydropyoverdine dehydrogenase", mapped to GO:0002049. That is a stronger
                  corroboration than the short name alone, because NCBIfam independently names
                  both the substrate and the reaction type, and both match the step modelled
                  here. No PANTHER family id is asserted
                  deliberately: the whole-protein HMM assignment is to the sulfatase-maturating
                  FGE clade, whose characterised reaction is the oxidation of a cysteine in a
                  sulfatase active site, which is not the reaction modelled here.
                representative_members:
                  - preferred_term: PvdO (Pseudomonas aeruginosa PAO1)
                    term:
                      id: UniProtKB:Q9I185
                      label: PvdO
            function:
              preferred_term: >-
                second oxidation of the dihydropyoverdine chromophore (no GO term; cofactor and
                mechanism unknown)
              substrates:
                - preferred_term: dihydropyoverdine
              products:
                - preferred_term: mature pyoverdine fluorophore
            processes:
              - preferred_term: pyoverdine biosynthetic process
                term:
                  id: GO:0002049
                  label: pyoverdine biosynthetic process
            locations:
              - preferred_term: outer membrane-bounded periplasmic space
                term:
                  id: GO:0030288
                  label: outer membrane-bounded periplasmic space
            role_description: >-
              Completes the chromophore. Mutants lacking PvdO accumulate the dihydropyoverdines,
              which is what partitions the oxidation steps between the two enzymes. Whether PvdO
              is itself the catalyst is not established: protein purified from a heterologous
              host carried no detectable cofactor and was inactive, and the review notes it may
              need a partner, an electron transport system, or PvdP itself. The annoton is
              therefore written as an oxidation factor with no asserted molecular function.
    - order: 3
      role: Position-1 glutamate side-chain tailoring
      optional: true
      evidence:
        - source_id: PMID:30386787
          title: The biosynthesis of pyoverdines.
          statement: >-
            This is the sentence that licenses optional: true, and it states the neither-enzyme
            case outright rather than leaving it to be inferred from the single-enzyme
            deletions. A strain with no tailoring enzyme still makes pyoverdine; what it lacks
            is the modified side chain.
          supporting_text: >-
            Removal of both tailoring enzymes leaves the original glutamate unaltered
      node:
        id: side_chain_tailoring
        label: Position-1 glutamate side-chain tailoring
        module_type: REACTION
        variant_sets:
          - id: side_chain_branch
            label: Alternative mature side-chain forms
            axis: tailoring route for the position-1 L-glutamate residue
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:30386787
                title: The biosynthesis of pyoverdines.
                statement: >-
                  This is the sentence that licenses ONE_OR_MORE rather than EXACTLY_ONE: the
                  observed distribution is mixed, with strains carrying both enzymes, only
                  PvdN, or only PtaA. It appears again on knowledge gap 4, but there it is the
                  premise of an unknown rather than the warrant for this encoding.
                supporting_text: >-
                  There are pyoverdine-producing pseudomonads that have both enzymes, PvdN and
                  PtaA, some have only PvdN, and others only PtaA.
            notes: >-
              Two separate decisions are encoded here, and they are worth keeping apart.
              Whether the step happens at all is the enclosing part's question, and the part is
              marked optional: losing PvdN abolishes only the succinamide and succinic acid
              forms rather than pyoverdine, so a strain carrying neither tailoring enzyme still
              makes a mature siderophore with the position-1 glutamate unmodified, and the
              compiled circuit has to admit that realisation. Which chemistry runs, given that
              the step does happen, is this set's question, and the answer is one or both:
              these are alternative chemistries on the same substrate rather than
              interchangeable carriers of one activity, which is why the set is a ROUTE and not
              a REALIZER, and the review reports pseudomonads that carry both enzymes and make
              the products of both branches as well as strains with only one, which is why it is
              ONE_OR_MORE and not EXACTLY_ONE.
            variants:
              - id: pvdn_succinamide_route
                label: PvdN-dependent succinamide formation
                module_type: REACTION
                annotons:
                  - id: pvdn_side_chain_decarboxylase
                    label: Pyoverdine side-chain tailoring enzyme PvdN
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          Pseudomonas pyoverdine PvdN family (periplasmic PLP-dependent
                          side-chain decarboxylases of the pvdMNO operon)
                        description: >-
                          The PvdN protein of the pyoverdine maturation operon, a class-V
                          PLP-dependent aminotransferase by fold that is delivered to the
                          periplasm by the Tat system as a folded protein and must bind its PLP
                          cofactor in the cytoplasm to be transport competent. No PANTHER family
                          id is asserted: the whole-protein assignment is to a clade of cysteine
                          desulfurases, which is a different reaction on a different substrate,
                          so family membership would say something false about the activity.
                        representative_members:
                          - preferred_term: PvdN (Pseudomonas aeruginosa PAO1)
                            term:
                              id: UniProtKB:G3XCY5
                              label: PvdN
                    function:
                      preferred_term: >-
                        PLP-dependent decarboxylation of a peptide-bound glutamate side chain with
                        retention of the alpha-amino group, giving a succinamide (no GO term)
                      substrates:
                        - preferred_term: >-
                            pyoverdine bearing the position-1 L-glutamate residue
                      products:
                        - preferred_term: succinamide-form pyoverdine
                    processes:
                      - preferred_term: pyoverdine biosynthetic process
                        term:
                          id: GO:0002049
                          label: pyoverdine biosynthetic process
                    locations:
                      - preferred_term: outer membrane-bounded periplasmic space
                        term:
                          id: GO:0030288
                          label: outer membrane-bounded periplasmic space
                    role_description: >-
                      Converts the position-1 glutamate side chain into a succinamide. The review
                      describes the chemistry as a new PLP-dependent reaction mechanism - a
                      decarboxylation that retains the amino group at the alpha-carbon - and reports
                      that the succinic acid form found in mature pyoverdines is most likely the
                      spontaneous hydrolysis product of that succinamide. The enzyme will also
                      accept ferribactin, which is PvdP's own substrate and therefore upstream of
                      the chromophore oxidations, so the tailoring need not wait for them. Note
                      what that does not show: ferribactin is already the deacylated peptide in
                      this review's usage, so accepting it says nothing about whether the
                      tailoring can precede PvdQ-dependent deacylation, which lies outside this
                      module in any case.
              - id: ptaa_ketoglutarate_route
                label: PtaA-dependent alpha-ketoglutarate formation
                module_type: REACTION
                annotons:
                  - id: ptaa_periplasmic_transaminase
                    label: Periplasmic transaminase A (PtaA)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          Periplasmic transaminase A (PtaA) family (PLP-dependent transaminases
                          acting in the periplasm, usually encoded outside the pyoverdine cluster)
                        description: >-
                          No representative member and no family id are asserted for this variant,
                          deliberately. The review identifies PtaA as the enzyme that forms the
                          alpha-ketoglutarate side chain and states that it is an ordinary
                          PLP-dependent transaminase delivered to the periplasm by the Tat system
                          with its cofactor bound, but its characterisation is in a primary paper
                          not available here, and the UniProt entries that carry the gene name
                          ptaA are unreviewed records whose protein names are machine-generated.
                          Naming one of them as the exemplar would be a guess. The variant is
                          modelled because the branch is real and a realisation needs to be able
                          to select it; grounding it is left for whoever reads the primary paper.
                    function:
                      preferred_term: >-
                        PLP-dependent transamination of a peptide-bound glutamate side chain,
                        giving an alpha-ketoglutarate residue (no GO term)
                      substrates:
                        - preferred_term: >-
                            pyoverdine bearing the position-1 L-glutamate residue
                      products:
                        - preferred_term: alpha-ketoglutarate-form pyoverdine
                    processes:
                      - preferred_term: pyoverdine biosynthetic process
                        term:
                          id: GO:0002049
                          label: pyoverdine biosynthetic process
                    locations:
                      - preferred_term: outer membrane-bounded periplasmic space
                        term:
                          id: GO:0030288
                          label: outer membrane-bounded periplasmic space
                    role_description: >-
                      Converts the position-1 glutamate side chain into alpha-ketoglutarate, the
                      alternative to PvdN's succinamide. The gene usually lies outside the large
                      pyoverdine clusters, and the review notes one strain in which it substitutes
                      for pvdN at that locus. Because PtaA also occurs in species that make no
                      pyoverdine, it was given a general name, and it may serve other periplasmic
                      pathways as well - which is the reason this module treats it as a route
                      variant rather than as a dedicated pyoverdine enzyme.
  connections:
    - source: pvdp_ferribactin_oxidation
      target: pvdo_final_oxidation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      description: >-
        The dihydropyoverdine PvdP leaves behind is what the PvdO-dependent step consumes. This
        is the tightest link in the module and the one the mutant phenotype establishes directly:
        without PvdO the pathway stops at the dihydropyoverdines, which is what shows that
        PvdP's product is handed on rather than being the mature chromophore. The relation and
        the VERIFIED chaining are about flow into this node, not about who catalyses it - the
        substrate is established, the catalyst is not, so this says "consumed by" rather than
        "acted on by PvdO".
      evidence:
        - source_id: PMID:30386787
          title: The biosynthesis of pyoverdines.
          statement: >-
            The dihydropyoverdines accumulate when PvdO is missing, which places PvdP's product
            as PvdO's substrate.
          supporting_text: >-
            a mutant strain lacking the putative oxidoreductase PvdO produced the
            dihydropyoverdines, indicating that PvdP catalyzes only the initial hydroxylation and
            first oxidation, whereas the final oxidation depends on PvdO
    - source: pvdo_final_oxidation
      target: side_chain_tailoring
      chaining_status: NOT_APPLICABLE
      description: >-
        No connection_type, deliberately. The two steps are part of one pathway segment, which
        is why the
        connection exists at all, but neither of the two things a connection_type could assert
        holds. There is no substrate flow: the side-chain tailoring acts on the position-1
        glutamate, not on the chromophore PvdO completes, so the two steps modify different
        parts of the same molecule rather than one feeding the other - which is what
        chaining_status NOT_APPLICABLE records. And there is no established order either: PvdN
        will accept ferribactin, which is PvdP's own substrate and so sits upstream of both
        oxidations, meaning the tailoring step may well precede them rather than follow them.
        The review draws the same conclusion, that the ring system is not really relevant to the
        tailoring enzymes. PRECEDES would be wrong here, since the enum member means "the source
        occurs before the target", which is the claim this description withdraws. The enum has no
        member for "adjacent in the
        pathway, order not established", and connection_type is optional, so the honest encoding
        is to assert neither relation and let the description say why. Worth being clear that
        this is not caution in the face of thin evidence: the review has a section headed
        "Reactions of periplasmic pyoverdine biogenesis may not occur in a strict order" and
        closes it by saying no evidence exists for anything that would impose one, so an
        unordered relation is the positive finding here rather than the absence of one.
      evidence:
        - source_id: PMID:30386787
          title: The biosynthesis of pyoverdines.
          statement: >-
            PvdN accepts ferribactin, which places the tailoring step as potentially upstream of
            the oxidations rather than strictly after them.
          supporting_text: demonstrating that PvdN may even accept ferribactin as substrate
        - source_id: PMID:30386787
