    - gap_statement: >-
        What selective difference the alternative side chains make is unknown. The succinamide and
        alpha-ketoglutarate forms are produced by competing enzymes from the same precursor,
        strains differ in which they carry and some carry both, yet whether the two forms differ in
        iron affinity, in uptake by the cognate receptor, or in exclusion of competitors has not
        been established. Without that, there is no functional basis for predicting which route a
        given strain should use.
      boundary: >-
        Comparative biochemistry and uptake assays on the two purified pyoverdine forms would close
        this. The module therefore models the branch as ONE_OR_MORE on observed distribution rather
        than deriving it from any functional rule.
