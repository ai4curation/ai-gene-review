id: MODULE:dmel_mrn_complex
title: Mre11-Rad50-Nbs (MRN) complex in Drosophila melanogaster
description: >-
  The MRN complex senses DNA double-strand breaks. Rad50, an SMC-like ATPase with a long coiled-coil,
  tethers DNA ends; Mre11 is a nuclease with 3'-5' exonuclease and single-stranded endonuclease
  activities that starts resection of break ends; Nbs (Nibrin) mediates recruitment and activation
  of the ATM kinase. In Drosophila, mre11, rad50 and nbs are also required to prevent telomere
  fusions.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001923
  title: 'FlyBase gene group MRN: Mrn complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as mrn complex (MRN); this module
    models that group.
- source_id: GO:0030870
  title: Mre11 complex
  statement: >-
    GO term grounding the module as Mre11 complex.
notes: >-
  Catalytic activities are assigned to Mre11 and Rad50 by conservation with the characterized
  yeast and human proteins. ATM (tefu) and downstream repair factors are outside the module.
  FlyBase groups realized by this module: MRN (FBgg0001923). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_mrn_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
