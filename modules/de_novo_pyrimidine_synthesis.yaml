  notes: >-
    ALIGN with the YeastPathways crosswalk (PWY-5686-1, PYRIMID-RNTSYN-PWY,
    PWY0-162, PWY-7176). The six chemical leaves are conserved despite
    taxon-specific protein architecture: bacteria commonly use separate
    CarA/CarB/PyrB/PyrC/PyrE/PyrF chains, animals fuse the first three
    activities in CAD and the last two in UMPS, and fungi use a CPSase-ATCase
    fusion (S. cerevisiae URA2, S. pombe ura1) whose dihydroorotase-like
    domain is inactive (PMID:2679804), plus separate URA4/ura2
    dihydroorotase, URA5+URA10/ura5 OPRTase and URA3/ura4 ODCase. Fungal
    gene names are not orthologous between the two yeasts (S. cerevisiae
    URA1 = DHODH but S. pombe ura1 = CPSase-ATCase). Dihydroorotate oxidation
    is modelled as two variants: class 2 quinone DHODH (bacteria, animals, S.
    pombe ura3 in mitochondria) and the class 1A fumarate DHODH of S.
    cerevisiae URA1, which is cytosolic and of bacterial origin (PMID:1409592,
    PMID:15014982). The UMP to UTP and CTP steps (URA6, YNK1, URA7/URA8) were
    added as part 7 per the crosswalk; bacterial PyrH and eukaryotic UMP/CMP
    kinases are unrelated families and are modelled as variants. YeastCyc
    corrections: CPA1/CPA2 are listed for CARBPSYN-RXN in PWY-5686-1 but form
    the arginine-specific CPSase A (committed CPA1/CPA2 reviews) and are not
    exemplars here, although CPSase A carbamoyl phosphate can partly reach the
    pyrimidine pathway; PYRIMID-RNTSYN-PWY draws URA1 with the
    quinone-dependent reaction (EC 1.3.5.2) instead of the fumarate reaction;
    UDP kinase has no gene in YeastCyc (YNK1 added, as in the GO-CAM). GO-CAM
    disagreements: YeastPathways_PYRIMID-RNTSYN-PWY gives URA1 the generic
    GO:0004152 with no location, URA6 the obsolete GO:0004127 in several
    models, and labels the pathway GO:0006207 'de novo' pyrimidine
    nucleobase biosynthetic process although its products are nucleotides.
    The PomBase model 69a0c46f00003691 (listed in the crosswalk under
    pyrimidine_salvage) supplies the S. pombe exemplars. Carbamoyl phosphate
    also feeds arginine biosynthesis, so pathway assignment of bacterial
    CarA/CarB requires process context rather than reaction identity alone;
    pyrimidine CPS II must not be conflated with mitochondrial urea-cycle
    CPS1. PRPP supply (pentose_phosphate_pathway) is upstream and pyrimidine
    salvage (pyrimidine_salvage) and deoxynucleotide synthesis
    (dntp_de_novo_synthesis) are separate modules. Regulation (outside the
    core): UTP feedback-inhibits URA2 CPSase and Ppr1p senses dihydroorotate
    and orotate to activate later URA genes (PMID:9858611). Human disease and
    drug examples remain useful context: UMPS deficiency causes hereditary
    orotic aciduria, DHODH deficiency causes Miller syndrome, CAD deficiency
    causes a uridine-responsive developmental epileptic encephalopathy, and
    DHODH is targeted by leflunomide/teriflunomide. Pseudomonas PyrC' is a
    lineage-specific inactive dihydroorotase-like structural partner of PyrB
    and is not an additional dihydroorotase reaction leaf.
