          separate CarA and CarB chains in many bacteria, in one CAD
          polypeptide in animals and in the CPSase-ATCase protein of fungi
          (URA2 / S. pombe ura1). Fungi have a second, arginine-specific
          carbamoyl-phosphate synthetase (CPA1/CPA2) that is not part of this
          module.
