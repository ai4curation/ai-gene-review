id: MODULE:de_novo_pyrimidine_synthesis
title: De novo UMP biosynthesis and conversion to UTP and CTP
description: >-
  The conserved six-reaction pathway that builds UMP from glutamine,
  hydrogencarbonate, ATP, aspartate, and PRPP, followed by phosphorylation of
  UMP to UTP and amination of UTP to CTP. Carbamoyl phosphate is formed
  first, followed by assembly and oxidation of the pyrimidine ring, attachment
  to phosphoribose, and decarboxylation to UMP. UMP kinase and
  nucleoside-diphosphate kinase then make UTP, and CTP synthase transfers the
  glutamine amide nitrogen to UTP to make CTP. Enzyme architecture varies:
  bacteria commonly use separate CarA, CarB, PyrB, PyrC, PyrE, and PyrF
  proteins, whereas animals fuse the first three activities in CAD and the
  final two activities in UMPS; fungi fuse the carbamoyl-phosphate synthetase
  and aspartate carbamoyltransferase in one protein that also carries an
  inactive dihydroorotase-like domain, and use separate dihydroorotase,
  orotate phosphoribosyltransferase and OMP decarboxylase proteins. These
  fusions do not change the chemical leaves represented by the module.
  Dihydroorotate oxidation has two implementations: membrane-associated
  quinone-dependent (class 2) enzymes, which in eukaryotes sit on the
  mitochondrial inner membrane and couple pyrimidine synthesis to
  respiration, and soluble fumarate-dependent (class 1A) enzymes, acquired by
  Saccharomyces yeasts from bacteria, which allow pyrimidine synthesis without
  oxygen. Bacteria phosphorylate UMP with a PyrH-type UMP kinase, eukaryotes
  with a UMP/CMP kinase of the adenylate kinase family.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-5686-1
    title: UMP biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Six reactions with URA2, URA4, URA1 (fumarate-dependent, RXN-9929),
      URA5/URA10 and URA3. The carbamoyl-phosphate synthase reaction also lists
      CPA1/CPA2, which form the arginine-specific enzyme and are not
      pyrimidine-pathway catalysts.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5686-1
  - source_id: YeastPathways:PYRIMID-RNTSYN-PWY
    title: de novo biosynthesis of pyrimidine ribonucleotides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      UMP synthesis plus URA6, UDP kinase (no gene) and URA7/URA8. URA1 is
      drawn with the quinone-dependent DHODH reaction (EC 1.3.5.2) although the
      yeast enzyme uses fumarate (PMID:1409592).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PYRIMID-RNTSYN-PWY
  - source_id: YeastPathways:PWY0-162
    title: superpathway of pyrimidine ribonucleotides de novo biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: Same reactions as PYRIMID-RNTSYN-PWY with the fumarate-dependent URA1 reaction.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY0-162
  - source_id: YeastPathways:PWY-7176
    title: UTP and CTP de novo biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: URA6, UDP kinase (no gene in YeastCyc; YNK1 in the GO-CAM) and URA7/URA8.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-7176
  - source_id: GO:0044205
    title: "'de novo' UMP biosynthetic process"
    statement: Grounds the complete pathway from precursor metabolites to UMP.
  - source_id: GO:0044210
    title: "'de novo' CTP biosynthetic process"
    statement: Grounds the downstream UMP-to-CTP extension.
  - source_id: file:PSEPK/carA/carA-uniprot.txt
    title: PSEPK CarA UniProtKB record
    statement: Defines the glutaminase small-chain contribution to carbamoyl-phosphate synthesis and gives Q88DU5 as a bacterial exemplar.
  - source_id: file:PSEPK/carB/carB-uniprot.txt
    title: PSEPK CarB UniProtKB record
    statement: Defines the ATP-dependent large-chain contribution to carbamoyl-phosphate synthesis and gives Q88DU6 as a bacterial exemplar.
  - source_id: file:PSEPK/pyrB/pyrB-uniprot.txt
    title: PSEPK PyrB UniProtKB record
    statement: Defines the aspartate carbamoyltransferase reaction and gives Q88D30 as a bacterial exemplar.
  - source_id: file:PSEPK/pyrC/pyrC-uniprot.txt
    title: PSEPK PyrC UniProtKB record
    statement: Defines the dihydroorotase reaction and gives Q88NW7 as a bacterial exemplar.
  - source_id: file:PSEPK/pyrD/pyrD-uniprot.txt
    title: PSEPK PyrD UniProtKB record
    statement: Defines quinone-dependent dihydroorotate oxidation and gives Q88L40 as a bacterial exemplar.
  - source_id: file:PSEPK/pyrE/pyrE-uniprot.txt
    title: PSEPK PyrE UniProtKB record
    statement: Defines orotate phosphoribosyltransferase chemistry and gives Q88C92 as a bacterial exemplar.
  - source_id: file:PSEPK/pyrF/pyrF-uniprot.txt
    title: PSEPK PyrF UniProtKB record
    statement: Defines OMP decarboxylation and gives Q88LW2 as a bacterial exemplar.
  - source_id: PMID:7896697
    title: "Aspartate transcarbamoylase genes of Pseudomonas putida: requirement for an inactive dihydroorotase for assembly into the dodecameric holoenzyme."
    statement: >-
      Grounds the Pseudomonas PyrB/PyrC' dodecamer and establishes PyrC' as an
      inactive structural partner rather than the pathway dihydroorotase reaction.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__de_novo_pyrimidine_synthesis__ppu00240-deep-research-openscientist.md
    title: OpenScientist species-aware review of de novo UMP biosynthesis in Pseudomonas putida KT2440
    statement: >-
      Confirms that the six reaction leaves are satisfiable by CarA/CarB, PyrB,
      PyrC, PyrD, PyrE, and PyrF; identifies PyrC' as a non-catalytic structural
      partner and the CarAB reaction as a cross-pathway dependency shared with
      arginine biosynthesis.
  - source_id: file:human/CAD/CAD-ai-review.yaml
    title: Human CAD gene review
    statement: Grounds the fused eukaryotic architecture for the first three reaction leaves.
  - source_id: file:human/UMPS/UMPS-ai-review.yaml
    title: Human UMPS gene review
    statement: Grounds the fused eukaryotic architecture for the final two reaction leaves.
  - source_id: file:yeast/URA2/URA2-ai-review.yaml
    title: S. cerevisiae URA2 gene review
    statement: >-
      URA2 core functions are glutamine-dependent carbamoyl-phosphate synthase
      (GO:0004088) and aspartate carbamoyltransferase (GO:0004070) in the
      cytosol; its dihydroorotase-like domain is inactive.
  - source_id: file:yeast/CPA1/CPA1-ai-review.yaml
    title: S. cerevisiae CPA1 gene review
    statement: CPA1 is the glutaminase subunit of the arginine-specific CPSase A (core process GO:0006526 arginine biosynthesis).
  - source_id: file:yeast/CPA2/CPA2-ai-review.yaml
    title: S. cerevisiae CPA2 gene review
    statement: CPA2 is the synthetase subunit of the arginine-specific CPSase A.
  - source_id: PMID:2679804
    title: 'Pyrimidine biosynthesis in Saccharomyces cerevisiae: the ura2 cluster gene, its multifunctional enzyme product, and other structural or regulatory genes involved in de novo UMP synthesis.'
    statement: >-
      Six structural genes (URA2, URA4, URA1, URA5, URA10, URA3) make UMP; URA2
      encodes the CPSase-ATCase multifunctional protein with a GATase,
      CPSase, inactive DHOase-like and ATCase domain.
  - source_id: PMID:2897615
    title: Structure of the Saccharomyces cerevisiae URA4 gene encoding dihydroorotase.
    statement: URA4 encodes a monofunctional dihydroorotase related to the enterobacterial enzymes.
  - source_id: PMID:1409592
    title: Divergent evolution of pyrimidine biosynthesis between anaerobic and aerobic yeasts.
    statement: >-
      S. cerevisiae DHODH (URA1) is cytosolic and uses fumarate as electron
      acceptor, whereas S. pombe DHODH is mitochondrial and requires the
      respiratory chain.
  - source_id: PMID:15014982
    title: Horizontal gene transfer promoted evolution of the ability to propagate under anaerobic conditions in yeasts.
    statement: >-
      The cytoplasmic Saccharomyces DHODH is related to Lactococcus lactis
      DHODase and was acquired by horizontal transfer; only it supports
      anaerobic growth.
  - source_id: PMID:8391780
    title: Characteristics, substrate analysis, and intracellular location of Saccharomyces cerevisiae UMP kinase.
    statement: URA6 UMP kinase phosphorylates UMP and dUMP and is cytoplasmic and nuclear, not mitochondrial.
  - source_id: PMID:1333436
    title: 'The adenylate kinase family in yeast: identification of URA6 as a multicopy suppressor of deficiency in major AMP kinase.'
    statement: URA6 is an adenylate-kinase-family nucleoside monophosphate kinase that also phosphorylates CMP.
  - source_id: PMID:8121398
    title: Use of synthetic lethal mutants to clone and characterize a novel CTP synthetase gene in Saccharomyces cerevisiae.
    statement: >-
      URA7 and URA8 both encode CTP synthetase; the double null is lethal and
      URA7 is the major gene.
  - source_id: PMID:7559626
    title: Differential biochemical regulation of the URA7- and URA8-encoded CTP synthetases from Saccharomyces cerevisiae.
    statement: URA8-encoded CTP synthetase was purified from the cytosolic fraction.
  - source_id: PMID:9858611
    title: Activation of transcription by metabolic intermediates of the pyrimidine biosynthetic pathway.
    statement: Ppr1p senses dihydroorotate and orotate and activates later pathway genes (regulation, outside module core).
