                      id: UniProtKB:Q09794
                      label: Multifunctional protein ura1
                    description: S. pombe SPAC22G7.06c, the URA2 ortholog.
            function:
              preferred_term: glutaminase activity
              term:
                id: GO:0004359
                label: glutaminase activity
              substrates:
                - preferred_term: L-glutamine
                - preferred_term: water
              products:
                - preferred_term: L-glutamate
                - preferred_term: ammonia channeled to the synthetase component
              evidence:
