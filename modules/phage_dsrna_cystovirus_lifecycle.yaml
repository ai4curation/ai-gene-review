id: MODULE:phage_dsrna_cystovirus_lifecycle
title: Enveloped segmented dsRNA bacteriophage (Cystoviridae) procapsid packaging, replication, and envelope
  morphogenesis
description: A reusable module representing the intracellular assembly, sequential plus-strand RNA packaging,
  intra-capsid double-stranded RNA synthesis, and intracellular lipid envelope acquisition of enveloped
  trisegmented dsRNA bacteriophages (family Cystoviridae, exemplified by Pseudomonas phage phi6). Unlike
  DNA phages, cystoviruses never expose naked genomic dsRNA to the host cytoplasm. Instead, a dodecahedral
  polymerase complex (procapsid) is pre-assembled from 120 copies of major inner shell protein P1, 12
  copies of the RNA-directed RNA polymerase P2, 12 hexamers of the packaging NTPase turret P4 at the five-fold
  vertices, and the assembly/packaging cofactor P7. The empty procapsid sequentially packages single-stranded
  (+)-sense precursor transcripts s+, m+, and l+ in strict order via P4 NTPase translocation, synthesizes
  complementary (-)-strands inside the expanded core via P2 RdRP to yield the S, M, and L dsRNA segments,
  and transcribes late mRNAs by semi-conservative strand displacement. The dsRNA-filled core is subsequently
  enclosed by the T=13 icosahedral outer shell protein P8 (forming the nucleocapsid), enveloped inside
  the host cytoplasm by host-derived lipid vesicles containing viral membrane proteins P9, P6, P10, and
  P13 through the action of the nonstructural membrane morphogenetic factor P12, decorated with the pilus-attachment
  spike P3 anchored to P6, and released by P5 muralytic endopeptidase and P10 holin-like membrane lysis.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0019072
  title: viral genome packaging
  statement: Ontology grounding for NTP-driven translocation of viral (+)-strand RNA precursors into the
    pre-assembled cystovirus procapsid.
- source_id: GO:0039694
  title: viral RNA genome replication
  statement: Ontology grounding for intra-capsid minus-strand synthesis and semi-conservative dsRNA replication
    by the cystovirus polymerase complex.
- source_id: file:genes/BPPH6/P1/P1-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P11126 (P1_BPPH6)
  statement: Establishes that phi6 P1 forms the 120-copy inner capsid framework of the polymerase complex,
    binds RNA, and participates in genomic packaging.
  supporting_text: Binds to RNA and may be involved in genomic packaging.
- source_id: file:genes/BPPH6/P4/P4-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P11125 (P4_BPPH6)
  statement: Establishes that phi6 P4 is a hexameric ssRNA-stimulated NTPase packaging motor that packages
    the viral RNA segments into the procapsid for replication and transcription.
  supporting_text: Packaging motor with helicase and translocase activities. Part of the packaging complex
    that packages the viral RNA segments, replicate them into a double-stranded form and transcribe them.
- source_id: file:genes/BPPH6/P12/P12-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P07580 (P12_BPPH6)
  statement: Establishes that nonstructural protein P12 is the morphogenetic assembly factor required
    for intracellular viral membrane morphogenesis.
  supporting_text: Assembly factor active in membrane morphogenesis.
module:
