  connections:
  - source: procapsid_polymerase_complex_assembly
    target: P4_sequential_ssrna_packaging
    connection_type: PROVIDES_INPUT_FOR
    description: The pre-assembled P1-P2-P4-P7 dodecahedral procapsid exposes the s+ packaging site and
      mounts the P4 NTPase motors at its five-fold vertices.
  - source: P4_sequential_ssrna_packaging
    target: P2_intracapsid_dsrna_synthesis
    connection_type: PROVIDES_INPUT_FOR
    description: Sequential packaging of s+, m+, and l+ expands the procapsid and activates P2 RdRP to
      synthesize the complementary minus strands inside the core.
  - source: P2_intracapsid_dsrna_synthesis
    target: P8_nucleocapsid_shell_assembly
    connection_type: PROVIDES_INPUT_FOR
    description: Completion of dsRNA synthesis and late transcription produces the mature dsRNA-filled
      core that templates T=13 P8 shell assembly.
  - source: P8_nucleocapsid_shell_assembly
    target: P9_P12_P6_P3_envelopment
    connection_type: PROVIDES_INPUT_FOR
    description: The P8-coated nucleocapsid is enveloped in the cytoplasm by P9/P6/P10/P13 lipid vesicles
      through the action of morphogenetic factor P12 and decorated with P3 spikes.
  - source: P9_P12_P6_P3_envelopment
    target: P5_P10_virion_release
    connection_type: PROVIDES_INPUT_FOR
    description: Mature enveloped virions are released into the medium by P10/P5-mediated host cell lysis.
  context:
    taxa:
    - preferred_term: Cystoviridae
      term:
        id: NCBITaxon:10877
        label: Cystoviridae
  notes: 'Exemplar phages: Pseudomonas phage phi6 (NCBITaxon:2928686): Type species of Cystoviridae whose
    13 proteins (P1-P10, P12-P14) encoded across segments L, M, and S execute sequential procapsid packaging,
    intra-capsid dsRNA synthesis, T=13 nucleocapsid assembly, P12-assisted intracellular envelopment,
    type IV pilus attachment, outer-membrane fusion, and P5/P10 lysis.'
