      label: viral genome packaging
    description: Sequential packaging of (+)-sense ssRNA segments s+, m+, and l+ into the pre-assembled
      P1-P2-P4-P7 procapsid.
  - preferred_term: viral RNA genome replication
    term:
      id: GO:0039694
      label: viral RNA genome replication
    description: Intra-capsid synthesis of double-stranded RNA segments S, M, and L by the virion-associated
      RdRP P2.
  - preferred_term: virion assembly
    term:
      id: GO:0019068
      label: virion assembly
    description: Assembly of the double-layered nucleocapsid and intracellular acquisition of the lipid-protein
      viral envelope.
