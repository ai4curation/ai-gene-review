        function:
          preferred_term: histone H3K36me3 reader activity
          term:
            id: GO:0140003
            label: histone H3K36me3 reader activity
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
        role_description: >-
          PWWP-domain subunit specific to NuA3b. Its PWWP domain binds H3K36me3 and targets NuA3b to
          the transcribed regions of active genes; it is the main H3K36me3 reader of NuA3 in cells.
          Its association with the core depends on the Yng1 N-terminal region. Pdp3 has no gene
          review in this repository.
        evidence:
        - source_id: PMID:25104842
          title: A PWWP domain-containing protein targets the NuA3 acetyltransferase complex via histone
            H3 lysine 36 trimethylation to coordinate transcriptional elongation at coding regions.
          statement: >-
            Pdp3 defines NuA3b and mediates its interaction with H3K36me3 through its PWWP domain.
          supporting_text: NuA3b contains the unique member, Pdp3, which regulates an interaction between
            NuA3b and H3K36me3 at the transcribed regions of genes through its PWWP domain
        - source_id: PMID:33010166
          title: NuA3 HAT antagonizes the Rpd3S and Rpd3L HDACs to optimize mRNA and lncRNA expression
            dynamics.
          statement: >-
            NuA3 binding to H3K36me3 in cells requires Pdp3.
          supporting_text: Nto1 binding was detected in wild type cells but not in pdp3Δ, indicating
            that Pdp3 is a major reader of H3K36me3 in NuA3 HAT
        - source_id: PMID:25473596
          title: Comprehensive analysis of interacting proteins and genome-wide location studies of
            the Sas3-dependent NuA3 histone acetyltransferase complex.
          statement: >-
            Pdp3 is one of the most abundant Sas3-associated proteins.
          supporting_text: This analysis revealed Pdp3p, a recently described component of NuA3, to
            be one of the most abundant Sas3p-interacting proteins.
