  about_node:
    id: GO:1990468
    label: NuA3b histone acetyltransferase complex
  old_value: A NuA3 complex that catalyzes the acetylation of Histone H3. In S. cerevisiae, this complex
    consists of Eaf6p, Nto1p, Sas3p, Taf14p, Pdp3 and associates with H3K4me3 via Pdp3p.
  new_value: A NuA3 complex that catalyzes the acetylation of histone H3 and associates with histone
    H3 trimethylated at lysine 36 (H3K36me3) via the PWWP domain of Pdp3p. In S. cerevisiae, this
    complex contains Eaf6p, Nto1p, Sas3p, Taf14p and Pdp3p, and at least part of it also contains
    Yng1p.
  change_dsl: change definition of GO:1990468 to "A NuA3 complex that catalyzes the acetylation of
    histone H3 and associates with histone H3 trimethylated at lysine 36 (H3K36me3) via the PWWP domain
    of Pdp3p. In S. cerevisiae, this complex contains Eaf6p, Nto1p, Sas3p, Taf14p and Pdp3p, and at
    least part of it also contains Yng1p."
  justification: >-
    The definition says that NuA3b associates with H3K4me3 via Pdp3. The paper it cites
    (PMID:25104842) shows the opposite: Pdp3 is a PWWP protein that binds H3K36me3 and defines the
    form that acts in transcribed regions, while H3K4me3 binding is the Yng1-dependent property of
    NuA3a. Later work confirms that Pdp3 is the main H3K36me3 reader of NuA3 (PMID:33010166). The
    definition also lists no Yng1, whereas UniProt describes NuA3b as NuA3a plus Pdp3 and pulldowns
    show that part of NuA3 carries both Yng1 and Pdp3, with the Yng1 N-terminal region holding Pdp3
    on the core (PMID:33010166); the proposed text says so without claiming that every NuA3b complex
    contains Yng1.
  origin: SELF_PROPOSED
  confidence: CONFIRMED
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-18'
  supported_by:
  - reference_id: PMID:25104842
    supporting_text: NuA3b contains the unique member, Pdp3, which regulates an interaction between
      NuA3b and H3K36me3 at the transcribed regions of genes through its PWWP domain
  - reference_id: PMID:33010166
    supporting_text: indicating that a portion of NuA3 HAT includes both Yng1 and Pdp3
knowledge_gaps:
- gap_statement: >-
    It is unresolved whether NuA3a and NuA3b are separate complexes or one complex with variable
    occupancy of its two methyl-lysine readers.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    NuA3b was defined by Pdp3 purification and genetics as a form distinct from the Yng1-targeted
    NuA3a. Later pulldowns showed that part of NuA3 carries both readers and that Pdp3 depends on the
    Yng1 N-terminal region to stay on the core, and the recombinant complex used for cryo-EM contained
    all six subunits. How the two readers are combined decides whether NuA3 reads H3K4me3 and
    H3K36me3 as alternatives or together, and how promoter and gene-body acetylation are divided.
  provenance:
  - reference_id: PMID:25104842
    supporting_text: 'to classify NuA3 into two functionally distinct forms: NuA3a and NuA3b'
  - reference_id: PMID:33010166
    supporting_text: indicating that a portion of NuA3 HAT includes both Yng1 and Pdp3
- gap_statement: >-
    What controls whether NuA3 acetylates the nucleosomes it binds is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Genome-wide, NuA3 occupancy does not predict H3K14 acetylation of the associated nucleosomes,
    which implies a second level of regulation beyond targeting by the Yng1 and Pdp3 readers. The
    regulator, whether a modification of NuA3 subunits, a competing deacetylase or a feature of the
    nucleosome, has not been identified.
  provenance:
  - reference_id: PMID:28108585
    supporting_text: the simple presence of NuA3 is insufficient to ensure acetylation of the associated
      nucleosomes, suggesting a secondary level of acetylation regulation that does not involve control
      of HAT-nucleosome interactions
- gap_statement: >-
    The role of Eaf6 in NuA3, and how Taf14 is held in the complex, are not established.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Eaf6 is seen only as part of a helical bundle in the structure, with no functional test of its
    contribution. For Taf14, biochemistry and genetics show its extra-terminal domain binding motifs
    in both Sas3 and Yng1, with both contacts needed for NuA3 function, while the cryo-EM structure
    shows only the Sas3 contact; and no role has been found for the Taf14 YEATS domain in recruiting
    NuA3.
  provenance:
  - reference_id: PMID:38914563
    supporting_text: Our structural and functional analyses suggest a model in which the Taf14 subunit
      may bridge Yng1 and Sas3 through the formation of a heterodimeric assembly.
  - reference_id: PMID:41318527
    supporting_text: In our structure, Sas3 interacts with Taf14, whereas the neighboring residues of
      the EBM motif in Yng1 are located far from the ET domain.
  - reference_id: PMID:28108585
    supporting_text: In contrast, we find no evidence to support the YEATS domain of Taf14 functioning
      in NuA3 recruitment.
