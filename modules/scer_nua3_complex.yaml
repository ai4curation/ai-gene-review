    term:
      id: GO:0033100
      label: NuA3 histone acetyltransferase complex
    description: >-
      Grouping class for both forms; inherits part_of chromatin through GO:0000123, which fits a
      complex that acetylates nucleosomal H3 (see notes).
  context:
    taxa:
    - preferred_term: Saccharomyces cerevisiae
      term:
        id: NCBITaxon:4932
        label: Saccharomyces cerevisiae
  parts:
