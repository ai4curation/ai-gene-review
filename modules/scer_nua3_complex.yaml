            label: chromatin
        role_description: >-
          The C-terminal PHD finger reads H3K4me3 and targets NuA3a to the 5' ends of transcribed
          genes; an N-terminal motif binds the unmodified H3 tail. Yng1 links Sas3 to nucleosomes and
          is needed for NuA3 to acetylate them, but not for the integrity of the core. Its
          N-terminal helices join the helical bundle with Nto1 and Eaf6, an N-terminal region holds
          both Yng1 and Pdp3 on the core, and a motif at residues 113 to 124 binds the Taf14
          extra-terminal domain.
        evidence:
        - source_id: PMID:17157260
          title: Yng1 PHD finger binding to H3 trimethylated at K4 promotes NuA3 HAT activity at K14
            of H3 and transcription at a subset of targeted ORFs.
          statement: >-
            Yng1 colocalizes with H3K4me3 genome-wide.
          supporting_text: genome-wide ChIP-Chip analysis demonstrates colocalization of Yng1 and H3K4me3
            in vivo
        - source_id: PMID:12077334
          title: Yng1p modulates the activity of Sas3p as a component of the yeast NuA3 Hhistone acetyltransferase
            complex.
          statement: >-
            Yng1 links Sas3 to nucleosomes and is needed for NuA3 to modify histone tails.
          supporting_text: we find that Yng1p mediates the interaction of Sas3p with nucleosomes and
            is thus required for the ability of NuA3 to modify histone tails
        - source_id: PMID:20351216
          title: Critical determinants for chromatin binding by Saccharomyces cerevisiae Yng1 exist
            outside of the plant homeodomain finger.
          statement: >-
            Yng1 has two histone-binding motifs.
          supporting_text: >-
            full-length Yng1 has two independent histone-binding motifs: an amino-terminal
            motif that binds unmodified H3 tails and a carboxyl-terminal PHD finger that specifically
            recognizes H3K4me3
        - source_id: PMID:33010166
          title: NuA3 HAT antagonizes the Rpd3S and Rpd3L HDACs to optimize mRNA and lncRNA expression
            dynamics.
          statement: >-
            The Yng1 N-terminal region keeps both methyl readers on the core.
          supporting_text: the Yng1 N-terminal region is critical for the integrity of NuA3 HAT, as loss
            of this region caused dissociation of two methyl-binding proteins, Yng1 and Pdp3, from the
            complex
