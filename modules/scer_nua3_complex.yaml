        statement: >-
          NuA3a uses the Yng1 PHD finger at the 5' ends of genes and is synthetically lethal with
          gcn5 deletion.
        supporting_text: we determine that NuA3a, but not NuA3b, is synthetically lethal in combination
          with a deletion of the histone acetyltransferase GCN5
    - id: nua3b_form
      label: NuA3b (H3K36me3-targeted form)
      module_type: PROTEIN_COMPLEX
      description: >-
        The form that carries Pdp3, targeted to H3K36me3 across transcribed regions; it acts as a
        positive transcription elongation factor and has a role at coding regions independent of
        Gcn5.
      concepts:
      - preferred_term: NuA3b histone acetyltransferase complex
        term:
          id: GO:1990468
          label: NuA3b histone acetyltransferase complex
      annotons:
      - id: pdp3_h3k36me3_reader
        label: Pdp3 histone H3K36me3 reader
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: Pdp3
            term:
              id: UniProtKB:Q06188
