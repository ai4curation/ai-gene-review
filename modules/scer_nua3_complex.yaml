        role_description: >-
          Shared subunit of TFIID, TFIIF, SWI/SNF, RSC, INO80 and NuA3. Its extra-terminal domain
          binds a short motif in the Sas3 N-terminal region (seen in the cryo-EM structure) and, by
          biochemistry, a similar motif in Yng1; disrupting either contact impairs NuA3 function in
          transcription and DNA repair. Its YEATS domain reads H3K9ac (and H3K9 crotonylation), but
          no role of the YEATS domain in recruiting NuA3 has been found, so the reader activity is
          the protein's own activity and its use within NuA3 is not established.
        evidence:
