            NuA3 complex.
          statement: >-
            The Taf14 contacts with Sas3 and Yng1 are needed for NuA3 function.
          supporting_text: In vivo assays in yeast demonstrate that the interactions of Taf14 with both
            Sas3 and Yng1 are required for proper function of the NuA3 complex in gene transcription
            and DNA repair.
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            In the structure, only the Sas3 motif is bound by the Taf14 extra-terminal domain.
          supporting_text: In our structure, Sas3 interacts with Taf14, whereas the neighboring residues
            of the EBM motif in Yng1 are located far from the ET domain.
        - source_id: PMID:28108585
          title: Histone H3K4 and H3K36 Methylation Independently Recruit the NuA3 Histone Acetyltransferase
            in Saccharomyces cerevisiae.
          statement: >-
            No evidence that the Taf14 YEATS domain recruits NuA3.
          supporting_text: In contrast, we find no evidence to support the YEATS domain of Taf14 functioning
            in NuA3 recruitment.
  variant_sets:
  - id: nua3_forms
