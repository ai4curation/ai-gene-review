    role: catalytic subunit
    node:
      id: nua3_catalytic
      label: Sas3 catalytic subunit
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: sas3_h3k14_acetyltransferase
        label: Sas3 histone H3K14 acetyltransferase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: Sas3
            term:
              id: UniProtKB:P34218
              label: Histone acetyltransferase SAS3
        function:
          preferred_term: histone H3K14 acetyltransferase activity
          term:
            id: GO:0036408
            label: histone H3K14 acetyltransferase activity
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
        role_description: >-
          MYST-domain catalytic subunit that transfers acetyl groups from acetyl-CoA to lysine 14 of
          nucleosomal histone H3. Sas3 is required for both the activity and the integrity of NuA3.
          Its N-terminal region binds Nto1 to form the core of the complex, its C-terminal region
          and an Nto1 loop together hold acetyl-CoA and the H3 tail, and a short N-terminal motif is
          bound by the Taf14 extra-terminal domain.
        evidence:
        - source_id: PMID:10817755
          title: The something about silencing protein, Sas3, is the catalytic subunit of NuA3, a
            yTAF(II)30-containing HAT complex that interacts with the Spt16 subunit of the yeast CP
            (Cdc68/Pob3)-FACT complex.
          statement: >-
            Sas3 is the catalytic subunit and is needed for NuA3 activity and integrity.
          supporting_text: Sas3 is required for both the HAT activity and the integrity of the NuA3
            complex.
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            Purified NuA3 acetylates H3K14 specifically on H3K4me3 nucleosomes and peptides.
          supporting_text: In the presence of H3K4 tri-methylation, the purified NuA3 complex exhibited
            histone acetyltransferase activity specifically at the H3K14 site
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            Mutating any Sas3 catalytic residue abolishes NuA3 activity.
          supporting_text: Mutation of any catalytic residue abolished the HAT activity of the NuA3
            complex
  - order: 2
    role: scaffold and substrate-cleft subunit
    node:
      id: nua3_scaffold
      label: Nto1 scaffold subunit
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: nto1_histone_binding
        label: Nto1 histone H3 tail binding in the substrate cleft
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: Nto1
            term:
              id: UniProtKB:Q12311
              label: NuA3 HAT complex component NTO1
        function:
          preferred_term: histone binding
          term:
            id: GO:0042393
            label: histone binding
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          BRPF/JADE-like scaffold. Its PZP module (two PHD fingers and a zinc knuckle) forms one side
          of the cleft that binds H3 residues 9 to 15 and positions lysine 14 for Sas3, so Nto1
          contributes to the H3K14 acetyltransferase activity; the N354A mutation in its tail-binding
          loop partly reduces activity. Its C-terminal helix anchors Yng1 and Eaf6 in a helical
          bundle, and loss of Nto1 lowers Sas3 and Yng1 levels. A Nto1 PHD finger binds H3K36me3
          weakly in vitro, but H3K36me3 binding by NuA3 in cells depends on Pdp3.
        evidence:
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            Sas3 and Nto1 form the core of the complex.
          supporting_text: Sas3, the catalytic subunit, interacts with Nto1, a non-catalytic subunit,
            mainly through its N-terminal domain, together forming the core of the NuA3 complex.
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            The H3 tail cleft is built by Sas3 and Nto1.
          supporting_text: Our structure shows that the histone tail-binding cleft of NuA3 is formed
            cooperatively by two subunits, the catalytic subunit Sas3 and the non-catalytic subunit
            Nto1.
        - source_id: PMID:41318527
          title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3
            histone acetyltransferase complex.
          statement: >-
            The Nto1 cleft mutation N354A partly reduces activity.
          supporting_text: In line with these structural predictions, L369R abolished the HAT activity
            of the NuA3 complex, whereas N354A led to a partial reduction in activity
        - source_id: PMID:33010166
          title: NuA3 HAT antagonizes the Rpd3S and Rpd3L HDACs to optimize mRNA and lncRNA expression
            dynamics.
          statement: >-
            Pdp3, not Nto1, is the main H3K36me3 reader of NuA3 in cells.
          supporting_text: Nto1 binding was detected in wild type cells but not in pdp3Δ, indicating
            that Pdp3 is a major reader of H3K36me3 in NuA3 HAT
  - order: 3
    role: H3K4me3 reader and nucleosome-engaging subunit
    node:
