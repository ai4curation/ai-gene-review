id: MODULE:scer_nua3_complex
title: NuA3 histone acetyltransferase complex in Saccharomyces cerevisiae
description: >-
  NuA3 (nucleosomal acetyltransferase of histone H3) is a Gcn5-independent MYST-family histone
  acetyltransferase of budding yeast that acetylates lysine 14 of histone H3 on nucleosomes at
  actively transcribed genes. Its catalytic subunit Sas3 is the yeast counterpart of MOZ/MORF, and
  Nto1, Yng1 and Eaf6 correspond to the BRPF scaffold, ING reader and MEAF6 subunits of the metazoan
  MOZ/MORF and HBO1 complexes. In the cryo-EM structure, Sas3 and Nto1 form the core of the complex
  and together build the cleft that binds the H3 tail and selects lysine 14; the N-terminal helices of
  Yng1, the C-terminal helix of Nto1 and Eaf6 form a helical bundle beside the core; and the
  extra-terminal domain of Taf14, a subunit shared with TFIID, TFIIF and three chromatin remodelers,
  docks onto Sas3. Yng1 is required for NuA3 to bind and acetylate nucleosomes but not for complex
  integrity. NuA3 exists in two forms that differ in how they are targeted: NuA3a binds H3K4me3 at
  the 5' ends of genes through the Yng1 PHD finger, and NuA3b, which carries the additional PWWP
  subunit Pdp3, binds H3K36me3 in transcribed regions. The two readers recruit NuA3 independently,
  but NuA3 occupancy alone does not ensure acetylation of the bound nucleosomes. NuA3 promotes
  transcription of a subset of genes, NuA3b acts as a positive elongation factor, and NuA3 opposes
  the Rpd3S and Rpd3L deacetylases to set the induction kinetics of genes they repress. NuA3a, but
  not NuA3b, is essential in cells lacking the SAGA acetyltransferase Gcn5.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:10817755
  title: The something about silencing protein, Sas3, is the catalytic subunit of NuA3, a yTAF(II)30-containing
    HAT complex that interacts with the Spt16 subunit of the yeast CP (Cdc68/Pob3)-FACT complex.
  statement: >-
    Defines the complex: a Gcn5-independent nucleosomal H3 acetyltransferase with Sas3 as its
    catalytic subunit.
  supporting_text: We have purified and characterized a Gcn5-independent nucleosomal histone H3 HAT
    complex, NuA3 (Nucleosomal Acetyltransferase of histone H3).
- source_id: PMID:17157260
  title: Yng1 PHD finger binding to H3 trimethylated at K4 promotes NuA3 HAT activity at K14 of H3
    and transcription at a subset of targeted ORFs.
  statement: >-
    Establishes H3K14 as the NuA3 target and the sequence H3K4me3 reading, acetylation and gene
    regulation.
  supporting_text: Disrupting the K4me3 binding of Yng1 altered K14ac and transcription at certain
    genes, thereby demonstrating direct in vivo evidence of sequential trimethyl binding,
    acetyltransferase activity, and gene regulation by NuA3.
- source_id: PMID:25104842
  title: A PWWP domain-containing protein targets the NuA3 acetyltransferase complex via histone H3
    lysine 36 trimethylation to coordinate transcriptional elongation at coding regions.
  statement: >-
    Defines the two forms, NuA3a and NuA3b, which differ by the Pdp3 subunit and the mark that
    targets them.
  supporting_text: >-
    Here, we employ mass-spectrometric analysis of affinity purified Pdp3, biophysical
    binding assays, and genetic analyses to classify NuA3 into two functionally distinct forms:
    NuA3a and NuA3b.
- source_id: PMID:41318527
  title: Mechanistic insights into histone recognition and H3K14 acetylation by the NuA3 histone acetyltransferase
    complex.
  statement: >-
    Cryo-EM structure of the complex: six subunits, a Sas3-Nto1 core and a substrate cleft formed by
    both.
  supporting_text: The NuA3 complex in Saccharomyces cerevisiae, consisting of Sas3, Nto1, Yng1, Eaf6,
    Taf14, and Pdp3, is a typical histone acetyltransferase complex in budding yeast
notes: >-
  Boundary. The module contains the six NuA3 subunits: Sas3 (catalytic), Nto1 (scaffold and
  substrate-cleft subunit), Yng1 (ING-family reader), Eaf6, Taf14 (YEATS-domain subunit shared with
  TFIID, TFIIF, SWI/SNF, RSC and INO80) and, in the NuA3b form only, Pdp3 (PWWP reader). Histone H3
  is the substrate. The FACT subunit Spt16, which binds Sas3 (PMID:10817755), the Set1 and Set2
  methyltransferases that write the marks NuA3 reads, and the Rpd3S and Rpd3L deacetylases that
  oppose NuA3 are outside the boundary. Taf14's other host complexes belong to their own modules.

  Two forms. NuA3a and NuA3b are modelled as a variant set along the axis of the methylated-histone
  reader that targets the complex. The five-subunit core is shared; Pdp3 is the NuA3b-specific
  subunit. UniProt describes NuA3b as NuA3a plus Pdp3, and peptide pulldowns show that part of NuA3
  carries both Yng1 and Pdp3, with the Yng1 N-terminal region holding Pdp3 on the core
  (PMID:33010166), so Yng1 is modelled as a shared part. Selection is ONE_OR_MORE because both
  readers recruit NuA3 in the same cells, independently (PMID:28108585). Whether the forms are
  separate complexes is recorded as a knowledge gap.

  Taf14 contacts. Nguyen et al. found that the Taf14 extra-terminal domain binds short motifs in both
  Sas3 and Yng1 and that both contacts are needed for NuA3 function (PMID:38914563). In the cryo-EM
  structure the Taf14 extra-terminal domain binds the Sas3 motif, while the Yng1 motif lies far from
  it (PMID:41318527). The Sas3 contact is common to both; the Yng1 contact is recorded in the Taf14
  role description as reported but not seen in the structure.

  Ontology and chromatin. The module concept is GO:0033100 NuA3 histone acetyltransferase complex,
  which a reasoner classifies under GO:0000123 histone acetyltransferase complex and so under its
  part_of GO:0000785 chromatin. NuA3 acetylates histone H3 on nucleosomes (PMID:10817755,
  PMID:25473596, PMID:41318527), so the inherited chromatin location is reasonable for this complex,
  unlike the HAT-B and Rtt109-Vps75 complexes, which act on histones before deposition
  (modules/scer_hat_b_complex.yaml, modules/scer_rtt109_vps75_complex.yaml). The definition of
  GO:1990468 NuA3b histone acetyltransferase complex names the wrong mark for Pdp3; a correction is
  recorded under proposed_ontology_changes.

  Gene reviews. SAS3, NTO1, YNG1, EAF6 and TAF14 have gene reviews in this repository; Pdp3 has none.
  The Sas3, Nto1, Yng1 and Taf14 annotons use the core molecular functions of those reviews: histone
  H3K14 acetyltransferase activity (Sas3), histone binding contributing to that activity (Nto1),
  histone H3K4me3 reader activity (Yng1) and histone H3K9ac reader activity (Taf14). The Eaf6 annoton
  carries no molecular function because none is known for Eaf6 in NuA3.
module:
  id: scer_nua3_complex
  label: NuA3 complex
  module_type: PROTEIN_COMPLEX
  description: >-
    MYST-family histone H3 acetyltransferase that acetylates H3K14 on nucleosomes at transcribed
    genes, targeted to H3K4me3 by Yng1 (NuA3a) or to H3K36me3 by Pdp3 (NuA3b).
  concepts:
