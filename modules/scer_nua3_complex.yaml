      statement: >-
        Yng1 and Pdp3 independently recruit NuA3 to H3K4- and H3K36-methylated chromatin.
      supporting_text: we demonstrate that the PHD finger of Yng1, and the PWWP domain of Pdp3 independently
        target NuA3 to H3K4 and H3K36 methylated chromatin, respectively
    - source_id: PMID:33010166
      title: NuA3 HAT antagonizes the Rpd3S and Rpd3L HDACs to optimize mRNA and lncRNA expression
        dynamics.
      statement: >-
        A portion of NuA3 contains both readers.
      supporting_text: indicating that a portion of NuA3 HAT includes both Yng1 and Pdp3
    variants:
    - id: nua3a_form
      label: NuA3a (H3K4me3-targeted form)
      module_type: PROTEIN_COMPLEX
      description: >-
        The five-subunit form, targeted to H3K4me3 at the 5' ends of open reading frames by the Yng1
        PHD finger (part 3). It acts at promoters to promote transcription initiation and is
        synthetically lethal with deletion of GCN5.
      concepts:
