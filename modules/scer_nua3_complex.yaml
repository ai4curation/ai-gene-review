          title: Association of Taf14 with acetylated histone H3 directs gene transcription and the
            DNA damage response.
          statement: >-
            The Taf14 YEATS domain is a selective H3K9ac reader.
          supporting_text: we show that the YEATS domain of Taf14, a member of key transcriptional and
            chromatin-modifying complexes in yeast, is a selective reader of histone H3 Lys9 acetylation
