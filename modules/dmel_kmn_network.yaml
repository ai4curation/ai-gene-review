id: MODULE:dmel_kmn_network
title: KMN network of the outer kinetochore in Drosophila melanogaster
description: >-
  The KMN network (Knl1, Mis12 complex and Ndc80 complex) is the core microtubule-binding
  module of the outer kinetochore. The Mis12 complex links the network to the centromere-proximal
  inner kinetochore; in Drosophila it binds the CENP-C homolog Cenp-C, because flies lack
  the CENP-T pathway. The Ndc80 complex binds spindle microtubules directly and forms load-bearing
  attachments. Knl1 (Spc105R in Drosophila) provides a scaffold for spindle assembly checkpoint
  proteins and for protein phosphatase 1. Drosophila has two Nnf1 paralogs, Nnf1a and Nnf1b,
  which form alternative Mis12 complexes.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001871
  title: 'FlyBase gene group KMN: Kmn protein network supercomplex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as kmn protein network supercomplex
    (KMN); this module models that group.
- source_id: GO:0000940
  title: outer kinetochore
  statement: >-
    GO term grounding the module as outer kinetochore.
notes: >-
  FlyBase lists Ndc80, Nuf2 and Spc25 in the Ndc80 complex group. The microtubule binding
  function is placed on the Ndc80 complex as a whole. Checkpoint proteins recruited by Spc105R
  (Bub1, BubR1, Bub3) and the RZZ complex (dmel_rzz_complex) are outside the module. FlyBase
  groups realized by this module: KMN (FBgg0001871). Subgroups folded into it: MIS12B, MIS12A,
  NDC80C, KNL1. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_kmn_network.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
