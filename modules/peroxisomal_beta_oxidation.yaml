            locations:
              - preferred_term: peroxisomal matrix
                term:
                  id: GO:0005782
                  label: peroxisomal matrix
            role_description: L-specific hydration + (3S)-dehydrogenation (animals; absent from budding yeast).
    - order: 4
      role: thiolytic cleavage (-> acetyl/propionyl-CoA)
      node:
        id: thiolytic_cleavage
        label: Peroxisomal thiolases
        module_type: REACTION
        annotons:
