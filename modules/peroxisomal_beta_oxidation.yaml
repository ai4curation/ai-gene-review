        oxidase substrate; the transporter step does not involve a CoA product.
      description: Matrix acyl-CoA enters the oxidase step.
    - source: acyl_coa_oxidation
      target: hydration_dehydrogenation
      connection_type: PRECEDES
      description: The 2-trans-enoyl-CoA made by the oxidase is hydrated and dehydrogenated by the multifunctional proteins.
    - source: hydration_dehydrogenation
      target: thiolytic_cleavage
      connection_type: PRECEDES
      chaining_status: MAPPING_GAP
      chaining_note: >-
        The multifunctional-protein annotons are typed only with their hydratase
        activity (product 3-hydroxyacyl-CoA); the dehydrogenase domain of the
        same protein (GO:0106386 / GO:0003857) makes the 3-oxoacyl-CoA thiolase
        substrate.
      description: The 3-oxoacyl-CoA is thiolytically cleaved.
    - source: thiolytic_cleavage
      target: acyl_coa_oxidation
      connection_type: PRECEDES
      description: >-
        The chain-shortened acyl-CoA (minus two carbons) re-enters the oxidase
        step, iterating the spiral until the substrate is fully shortened.
