  notes: >-
    ALIGN (YeastPathways project, 2026-10): the human-centred peroxisomal
    module was extended to the fungal peroxisome-only system. S. cerevisiae
    representatives were added to the shared core steps (POX1 in the ACOX
    family PTHR10909; FOX2 in the D-specific MFE-2 role with HSD17B4; POT1 in
    PTHR43853 with ACAA1). EHHADH and SCPx remain animal-specific leaves.
    New optional parts: substrate entry (PXA1-PXA2/ABCD1, PTHR11384,
    GO:0005324; FAA2 re-activation, PTHR43272, GO:0004467), auxiliary
    unsaturated-FA enzymes (ECI1/ECI2 in PTHR43684, whose official PANTHER name
    is "FAMILY NOT NAMED"; SPS19/DECR2 in PTHR43296, GO:0008670; IDP3 NADPH
    regeneration, GO:0004450) and peroxisomal NAD+ regeneration (MDH3,
    PTHR11540:SF72, GO:0030060). IDP3 and MDH3 follow the completed yeast gene
    reviews. The module context gained Eukaryota; the importer is located in
    the peroxisomal membrane. Catalase (H2O2 removal), the carnitine export of
    acetyl units (carnitine_shuttle) and the glyoxylate cycle are downstream
    context. YeastCyc corrections: FOX2 is a (3R)-specific hydratase 2 /
    D-3-hydroxyacyl-CoA dehydrogenase (PMID:1551874), not the (3S)
    crotonase/L-HAD written in YEAST-FAO-PWY (EC 4.2.1.17, 1.1.1.35); SPS19,
    IDP3, MDH3, PXA1 and PXA2 are missing; FAA1, FAA3, FAA4 and FAT1 are
    cytosolic/membrane uptake-coupled synthetases rather than peroxisomal
    pathway enzymes (FAA2 is the peroxisomal one); DCI1 is listed as a
    delta3-delta2-enoyl-CoA isomerase, but UniProt names it a
    delta(3,5)-delta(2,4)-dienoyl-CoA isomerase and its demonstrated role is
    co-import of Eci1p (PMID:11302517), so it is not used as a representative.
    The DCI1 gene review places its core activity as the auxiliary
    delta(3,5)-delta(2,4)-dienoyl-CoA isomerase (GO:0051750, EC 5.3.3.21) on the
    Sps19p-dependent route and keeps the weak delta3-delta2 activity as non-core.
    GO-CAM disagreements: YeastPathways_YEAST-FAO-PWY places every activity in
    cytosol rather than the peroxisome, uses the broad GO:0019395 fatty acid
    oxidation, and types FOX2 with (3S)-specific GO:0004300/GO:0003857.
    Human details: ACOX3 is GO:0016402 (pristanoyl-CoA oxidase); HSD17B4 is
    PTHR13078 in PANTHER 19.0 (PTHR45024 in UniProt, as is FOX2), so the
    D-bifunctional descriptor carries no PANTHER id; SCP2 is PTHR24314 in
    PANTHER 19.0. Disorders: ACOX1, HSD17B4 (D-BP), EHHADH, SCP2, ABCD1
    (X-ALD) deficiencies; Zellweger spectrum (peroxisome biogenesis).
