id: MODULE:peroxisomal_beta_oxidation
title: Peroxisomal fatty-acid beta-oxidation
description: >-
  Peroxisomal beta-oxidation chain-shortens acyl-CoAs two carbons per turn
  inside the peroxisomal matrix. In fungi such as budding yeast and in plants it
  is the only fatty-acid beta-oxidation system of the cell, whereas in animals
  it handles the substrates mitochondria cannot: very-long-chain fatty acids,
  2-methyl-branched fatty acids (pristanic acid), the C27 bile-acid
  intermediates and dicarboxylic acids. Long-chain substrates enter as
  acyl-CoA through an ABC-D half-transporter dimer, which in yeast hydrolyses
  the thioester during transport so that the fatty acid is re-activated on the
  matrix side by an acyl-CoA synthetase; medium-chain fatty acids enter
  independently and are activated inside. Each turn uses four reactions with
  peroxisome-specific enzymes: an FAD acyl-CoA oxidase that passes electrons
  directly to O2 (making H2O2, degraded by catalase); hydration and
  NAD+-dependent dehydrogenation by multifunctional proteins (the
  D-specific, (3R)-hydroxyacyl-CoA-forming multifunctional enzyme type 2 in
  fungi and as the main animal enzyme, plus an L-specific bifunctional protein
  in animals); and thiolytic cleavage by peroxisomal 3-ketoacyl-CoA thiolases.
  Because the peroxisomal membrane is impermeable to NAD(H), NADP(H) and
  acetyl-CoA, the pathway also depends on matrix redox shuttles (a peroxisomal
  malate dehydrogenase reoxidising NADH) and on carnitine or glyoxylate-cycle
  routes that export the acetyl units. Unsaturated fatty acids additionally
  need auxiliary enzymes: a delta3-delta2-enoyl-CoA isomerase and an
  NADPH-dependent 2,4-dienoyl-CoA reductase, whose NADPH is regenerated inside
  the peroxisome by NADP-dependent isocitrate dehydrogenase. In humans,
  single-enzyme defects (ACOX1, HSD17B4, EHHADH, SCP2, ABCD1) and peroxisome
  biogenesis disorders cause accumulation of very-long-chain and branched
  fatty acids and bile-acid intermediates with severe neurological disease.
status: DRAFT
evidence:
  - source_id: YeastPathways:YEAST-FAO-PWY
    title: fatty acid oxidation pathway (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-FAO-PWY
    statement: >-
      YeastCyc lists activation (FAA1-4, FAT1), POX1 oxidase, FOX2 as (3S)
      enoyl-CoA hydratase and (3S)-3-hydroxyacyl-CoA dehydrogenase, POT1
      thiolase and ECI1/DCI1 isomerase. FOX2 acts via (3R) intermediates
      (PMID:1551874); SPS19, IDP3, MDH3 and PXA1/PXA2 are missing.
  - source_id: GO:0006635
    title: fatty acid beta-oxidation
    statement: Module-level process.
  - source_id: GO:0033540
    title: fatty acid beta-oxidation using acyl-CoA oxidase
    statement: The peroxisomal spiral is initiated by acyl-CoA oxidases.
  - source_id: PMID:17028011
    title: Peroxisomal beta-oxidation--a metabolic pathway with multiple functions.
    statement: >-
      Mammals have beta-oxidation in mitochondria and peroxisomes whereas plants
      and most fungi have it only in peroxisomes; type 1 and type 2
      multifunctional enzymes act with opposite stereochemistry.
  - source_id: PMID:12697341
    title: The biochemistry of peroxisomal beta-oxidation in the yeast Saccharomyces cerevisiae.
    statement: >-
      Yeast peroxisomal beta-oxidation requires classical and auxiliary enzymes;
      Pxa1p-Pxa2p resembles human ALDP and Ant1p exchanges peroxisomal AMP for
      ATP.
  - source_id: PMID:1551874
    title: Peroxisomal multifunctional beta-oxidation protein of Saccharomyces cerevisiae. Molecular analysis of the fox2 gene and gene product.
    statement: >-
      FOX2 has 2-enoyl-CoA hydratase 2 and D-3-hydroxyacyl-CoA dehydrogenase
      activities and lacks crotonase and L-3-hydroxyacyl-CoA dehydrogenase, so
      yeast beta-oxidation proceeds via D-3-hydroxyacyl-CoA.
  - source_id: PMID:9452501
    title: IDP3 encodes a peroxisomal NADP-dependent isocitrate dehydrogenase required for the beta-oxidation of unsaturated fatty acids.
    statement: >-
      Saturated fatty acid degradation in S. cerevisiae is confined to
      peroxisomes; peroxisomal Idp3p is needed for growth on unsaturated but
      not saturated fatty acids, regenerating NADPH for the dienoyl-CoA
      reductase.
  - source_id: PMID:9268358
    title: The Saccharomyces cerevisiae peroxisomal 2,4-dienoyl-CoA reductase is encoded by the oleate-inducible gene SPS19.
    statement: >-
      Sps19p is a peroxisomal-matrix NADPH-dependent 2,4-dienoyl-CoA reductase
      required for growth on petroselinic acid.
  - source_id: PMID:11302517
    title: 'Eci1p uses a PTS1 to enter peroxisomes: either its own or that of a partner, Dci1p.'
    statement: Eci1p is the peroxisomal delta3,delta2-enoyl-CoA isomerase essential for beta-oxidation of unsaturated fatty acids and can be co-imported with Dci1p.
  - source_id: PMID:7628449
    title: The membrane of peroxisomes in Saccharomyces cerevisiae is impermeable to NAD(H) and acetyl-CoA under in vivo conditions.
    statement: >-
      mdh3 disruption impairs beta-oxidation in intact cells and prevents growth
      on oleate; the peroxisomal membrane is impermeable to NAD(H) and acetyl-CoA
      in vivo.
  - source_id: PMID:28928432
    title: Two NAD-linked redox shuttles maintain the peroxisomal redox balance in Saccharomyces cerevisiae.
    statement: >-
      On oleate, peroxisomal NADH from beta-oxidation is reoxidised by the
      malate dehydrogenase (Mdh3p) malate/oxaloacetate shuttle; a
      Gpd1p-dependent shuttle can also contribute.
  - source_id: PMID:22493507
    title: Peroxisomal fatty acid uptake mechanism in Saccharomyces cerevisiae.
    statement: >-
      Pxa1p-Pxa2p hydrolyses very-long-chain acyl-CoA before transporting the
      fatty acid, which is re-esterified by Faa2p and/or Fat1p on the inner
      surface; the mechanism is shared with human ABCD1 and ABCD2.
  - source_id: file:human/ACOX1/ACOX1-ai-review.yaml
    title: ACOX1 gene review (human)
    statement: The straight-chain acyl-CoA oxidation step (UniProtKB:Q15067, GO:0003997) matches the completed human ACOX1 review.
  - source_id: file:human/ACOX3/ACOX3-ai-review.yaml
    title: ACOX3 gene review (human)
    statement: The branched (pristanoyl) acyl-CoA oxidation step (UniProtKB:O15254, GO:0016402) matches the completed human ACOX3 review.
  - source_id: file:human/HSD17B4/HSD17B4-ai-review.yaml
    title: HSD17B4 gene review (human)
    statement: The D-bifunctional hydratase/dehydrogenase step (UniProtKB:P51659, GO:0080023/GO:0106386) matches the completed human HSD17B4 review.
  - source_id: file:human/EHHADH/EHHADH-ai-review.yaml
    title: EHHADH gene review (human)
    statement: The L-bifunctional hydratase/dehydrogenase step (UniProtKB:Q08426, GO:0004300/GO:0003857) matches the completed human EHHADH review.
  - source_id: file:human/ACAA1/ACAA1-ai-review.yaml
    title: ACAA1 gene review (human)
    statement: The straight-chain thiolytic cleavage step (UniProtKB:P09110, GO:0003988) matches the completed human ACAA1 review.
  - source_id: file:human/SCP2/SCP2-ai-review.yaml
    title: SCP2 gene review (human)
    statement: The branched/bile-acid SCPx thiolase step (UniProtKB:P22307, GO:0050632) matches the completed human SCP2 review.
  - source_id: file:yeast/IDP3/IDP3-ai-review.yaml
    title: IDP3 gene review (S. cerevisiae)
    statement: Core function GO:0004450 in the peroxisomal matrix, regenerating NADPH for 2,4-dienoyl-CoA reductase in beta-oxidation of unsaturated fatty acids.
  - source_id: file:yeast/MDH3/MDH3-ai-review.yaml
    title: MDH3 gene review (S. cerevisiae)
    statement: Core function GO:0030060 in the peroxisomal matrix, reoxidising NADH generated by fatty acid beta-oxidation.
module:
  id: peroxisomal_beta_oxidation
  label: Peroxisomal fatty-acid beta-oxidation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: fatty acid beta-oxidation
      term:
        id: GO:0006635
        label: fatty acid beta-oxidation
      description: Two-carbon chain-shortening of acyl-CoAs in the peroxisome.
    - preferred_term: fatty acid beta-oxidation using acyl-CoA oxidase
      term:
        id: GO:0033540
        label: fatty acid beta-oxidation using acyl-CoA oxidase
      description: The peroxisomal spiral, initiated by O2/H2O2-generating acyl-CoA oxidases.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          Sole beta-oxidation system in budding yeast, most fungi and plants;
          specialised (very-long-chain, branched, bile-acid) system in animals.
    cellular_components:
      - preferred_term: peroxisomal matrix
        term:
          id: GO:0005782
          label: peroxisomal matrix
        description: The core and auxiliary enzymes act in the peroxisomal matrix; the importer is in the peroxisomal membrane.
  gocam_associations:
    - model: gomodel:YeastPathways_YEAST-FAO-PWY
      title: 'fatty acid oxidation pathway - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with FAA1/FAA2/FAA3/FAA4/FAT1, POX1, FOX2, POT1, ECI1
        and DCI1, all placed in cytosol and part of GO:0019395 fatty acid
        oxidation. FOX2 is typed with the (3S)-specific GO:0004300 and
        GO:0003857 rather than the (3R)-specific activities.
  parts:
    - order: 1
      role: substrate entry and activation in the peroxisome
      optional: true
      node:
        id: peroxisomal_substrate_entry
        label: Peroxisomal acyl-CoA import and intraperoxisomal re-activation
        module_type: METABOLIC_PATHWAY
        description: >-
          Long-chain acyl-CoAs are imported by an ABC-D transporter that, in
          yeast, releases the fatty acid into the matrix, where an acyl-CoA
          synthetase re-esterifies it. Cytosolic acyl-CoA synthetases that
          couple uptake to activation are upstream context.
        parts:
          - order: 1
            role: acyl-CoA import across the peroxisomal membrane
            node:
              id: abcd_import
              label: ABC-D peroxisomal acyl-CoA transporter
              module_type: TRANSPORT_STEP
              annotons:
                - id: abcd_transport_activity
                  label: "PXA1-PXA2 / ABCD1: peroxisomal ABC-D acyl-CoA transporter"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: ABC-D peroxisomal half-transporter family
                      term:
                        id: PANTHER:PTHR11384
                        label: ATP-BINDING CASSETTE, SUB-FAMILY D MEMBER
                      representative_members:
                        - preferred_term: PXA1 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P41909
                            label: Peroxisomal long-chain fatty acid import protein 2
                        - preferred_term: PXA2 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P34230
                            label: Peroxisomal long-chain fatty acid import protein 1
                        - preferred_term: ABCD1 (human)
                          term:
                            id: UniProtKB:P33897
                            label: ATP-binding cassette sub-family D member 1
                  function:
                    preferred_term: long-chain fatty acid transmembrane transporter activity
                    term:
                      id: GO:0005324
                      label: long-chain fatty acid transmembrane transporter activity
                    substrates:
                      - preferred_term: very-long-chain acyl-CoA (cytosol)
                      - preferred_term: ATP
                    products:
                      - preferred_term: fatty acid (peroxisomal matrix)
                      - preferred_term: CoA (released)
                      - preferred_term: ADP + phosphate
                    evidence:
                      - source_id: PMID:22493507
                        statement: Pxa1p-Pxa2p hydrolyses VLC acyl-CoA and transports the fatty acid moiety; shared with ABCD1/ABCD2.
                  locations:
                    - preferred_term: peroxisomal membrane
                      term:
                        id: GO:0005778
                        label: peroxisomal membrane
                  role_description: >-
                    Heterodimeric (yeast) or homodimeric (human) ABC-D
                    half-transporter importing long-chain acyl groups.
                  notes: >-
                    Open term choice. The human ABCD1 review keeps GO:0015607 (ABC-type
                    fatty-acyl-CoA transporter) as core, while the PXA1 and PXA2 reviews use
                    GO:0005324 (long-chain fatty acid transmembrane transporter), because
                    PMID:22493507 shows the yeast complex hydrolyses the acyl-CoA and moves only
                    the fatty acid, which Faa2p/Fat1p re-activate inside. GO:0015607 implies the
                    acyl-CoA itself crosses the membrane, so this annoton follows the PXA1/PXA2
                    term pending a decision on whether the hydrolysis-coupled mechanism holds
                    family-wide.
          - order: 2
            role: intraperoxisomal re-activation to acyl-CoA
            node:
              id: intraperoxisomal_activation
              label: Peroxisomal acyl-CoA synthetase
              module_type: REACTION
              annotons:
                - id: faa2_activity
                  label: "FAA2: peroxisomal acyl-CoA synthetase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: long-chain acyl-CoA synthetase family
                      family_terms:
                        - id: PANTHER:PTHR43272:SF83
                          label: ACYL-COA SYNTHETASE LONG-CHAIN, ISOFORM J
                        - id: PANTHER:PTHR43272:SF22
                          label: LONG-CHAIN-FATTY-ACID--COA LIGASE 4
                        - id: PANTHER:PTHR43272:SF13
                          label: FATTY ACID COA LIGASE ACSL3
                        - id: PANTHER:PTHR43272:SF28
                          label: LONG-CHAIN-FATTY-ACID--COA LIGASE 1
                        - id: PANTHER:PTHR43272:SF93
                          label: ACYL-COA SYNTHETASE BUBBLEGUM FAMILY MEMBER 1
                        - id: PANTHER:PTHR43272:SF101
                          label: ACYL-COA SYNTHETASE BUBBLEGUM FAMILY MEMBER 2-RELATED
                        - id: PANTHER:PTHR43272:SF32
                          label: AMP-DEPENDENT SYNTHETASE_LIGASE DOMAIN-CONTAINING PROTEIN
                        - id: PANTHER:PTHR43272:SF33
                          label: AMP-BINDING DOMAIN-CONTAINING PROTEIN-RELATED
                      representative_members:
                        - preferred_term: FAA2 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P39518
                            label: Long-chain-fatty-acid--CoA ligase 2
                  function:
                    preferred_term: long-chain fatty acid-CoA ligase activity
                    term:
                      id: GO:0004467
                      label: long-chain fatty acid-CoA ligase activity
                    substrates:
                      - preferred_term: fatty acid
                      - preferred_term: ATP
                      - preferred_term: CoA
                    products:
                      - preferred_term: acyl-CoA
                      - preferred_term: AMP + diphosphate
                    evidence:
                      - source_id: PMID:22493507
                        statement: Faa2p and/or Fat1p re-esterify the imported fatty acid on the inner surface of the peroxisomal membrane.
                  gocam_associations:
                    - model: gomodel:YeastPathways_YEAST-FAO-PWY
                      activity: gomodel:ACYLCOASYN-RXN
                      title: 'fatty acid oxidation pathway - imported from: Saccharomyces Genome Database'
                      description: >-
                        FAA2 (with FAA1, FAA3, FAA4 and FAT1) enables GO:0004467,
                        placed in cytosol.
                  role_description: >-
                    Re-esterify imported (and medium-chain) fatty acids to
                    acyl-CoA in the peroxisome. In animals, intraperoxisomal
                    activation is less defined and not represented here.
        connections:
          - source: abcd_import
            target: intraperoxisomal_activation
            connection_type: PROVIDES_INPUT_FOR
            description: The fatty acid delivered by the ABC-D transporter is re-activated in the matrix.
    - order: 2
      role: acyl-CoA oxidation (O2 -> H2O2)
      node:
        id: acyl_coa_oxidation
        label: Acyl-CoA oxidases
        module_type: REACTION
        annotons:
          - id: acox_activity
            label: "ACOX/POX1: FAD acyl-CoA oxidase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ACOX / peroxisomal acyl-CoA oxidase family
                term:
                  id: PANTHER:PTHR10909
                  label: ELECTRON TRANSPORT OXIDOREDUCTASE
                representative_members:
                  - preferred_term: ACOX1 (human, straight-chain/VLCFA)
                    term:
                      id: UniProtKB:Q15067
                      label: Peroxisomal acyl-coenzyme A oxidase 1
                  - preferred_term: ACOX3 (human, branched/pristanoyl)
                    term:
                      id: UniProtKB:O15254
                      label: Peroxisomal acyl-coenzyme A oxidase 3
                  - preferred_term: POX1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P13711
                      label: Acyl-coenzyme A oxidase
                    description: POX1/FOX1, the single acyl-CoA oxidase of budding yeast.
            function:
              preferred_term: acyl-CoA oxidase activity
              term:
                id: GO:0003997
                label: acyl-CoA oxidase activity
              substrates:
                - preferred_term: acyl-CoA (ACOX1/POX1 straight-chain; ACOX3 2-methyl-branched/pristanoyl)
                - preferred_term: O2 (FAD)
              products:
                - preferred_term: 2-trans-enoyl-CoA
                - preferred_term: H2O2
              evidence:
                - source_id: file:human/ACOX1/ACOX1-ai-review.yaml
                  statement: FAD oxidase; first, rate-limiting step passing electrons directly to O2 (H2O2). ACOX1 (Q15067) oxidises straight-chain VLC acyl-CoAs (deficiency = pseudo-neonatal ALD); ACOX3 (O15254, GO:0016402) oxidises 2-methyl-branched pristanoyl-CoA
            locations:
              - preferred_term: peroxisomal matrix
                term:
                  id: GO:0005782
                  label: peroxisomal matrix
            gocam_associations:
              - model: gomodel:YeastPathways_YEAST-FAO-PWY
                activity: gomodel:RXN-11026
                title: 'fatty acid oxidation pathway - imported from: Saccharomyces Genome Database'
                description: POX1 enables GO:0003997 (placed in cytosol).
            role_description: Dehydrogenate acyl-CoA to 2-trans-enoyl-CoA, reducing O2 to H2O2.
    - order: 3
      role: hydration + dehydrogenation (multifunctional proteins)
      node:
