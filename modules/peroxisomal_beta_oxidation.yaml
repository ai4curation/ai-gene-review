      target: peroxisomal_nad_regeneration
      connection_type: PROVIDES_INPUT_FOR
      description: NADH from the (3R)-hydroxyacyl-CoA dehydrogenase step is reoxidised by peroxisomal malate dehydrogenase.
  knowledge_gaps:
    - gap_statement: >-
        The transporters that move acetylcarnitine, malate/oxaloacetate and
        other shuttle metabolites across the yeast peroxisomal membrane are
        not identified, although the membrane is impermeable to NAD(H) and
        acetyl-CoA in vivo.
      boundary: >-
        The shuttles are represented by their matrix enzymes (MDH3 here, CAT2
        in carnitine_shuttle); membrane carriers other than PXA1-PXA2 and
        ANT1 are not modelled.
      gap_kind:
