id: MODULE:c_elegans_pirna_transgenerational_silencing
title: piRNA-initiated transgenerational silencing in Caenorhabditis elegans
description: >-
  The Caenorhabditis elegans germline distinguishes foreign from endogenous
  transcripts with a small RNA surveillance system. Its silencing can last
  for many generations. The Piwi Argonaute PRG-1 binds a very large
  repertoire of 21U-RNAs (the worm piRNAs) and works in perinuclear P
  granules. There it recognizes germline transcripts through imperfect but
  extensive base pairing. The P granule protein DEPS-1 binds PRG-1 directly
  and is needed for the next step. PRG-1 does not silence its targets by
  cleavage. Instead, recognition triggers RNA-dependent RNA polymerase
  synthesis of secondary 22G-RNAs, which are loaded into worm-specific
  Argonautes (WAGOs). PRG-1 is needed to start silencing but not to maintain
  it. Silencing is maintained and inherited through two parallel loops. In
  the nuclear loop, the WAGO HRDE-1 carries 22G-RNAs into germ cell nuclei
  and directs H3K9 trimethylation and transcriptional repression of target
  loci. In the cytoplasmic loop, the helicase ZNFX-1 and the WAGO-4
  Argonaute form Z granules, which separate from P granules during germline
  development. Z granules hold silenced, poly(UG)-tailed transcripts as
  templates for further 22G-RNA synthesis in the next generation. Once
  established, silencing can persist for more than 20 generations without the
  piRNA trigger. Loss of PRG-1 or HRDE-1 causes a progressive,
  multigenerational loss of fertility.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:22738724
    title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
    statement: >-
      piRNAs scan the germline transcriptome by imperfect pairing. PRG-1 loss
      derepresses loci and depletes RdRP-derived 22G-RNAs. PRG-1 initiates
      silencing but does not maintain it.
    supporting_text: >-
      We show that PRG-1 is required to initiate, but not to maintain,
      silencing of transgenes engineered to contain complementarity to
      endogenous 21U-RNAs.
  - source_id: PMID:22738724
    title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
    statement: Model of genome-wide scanning by piRNAs.
    supporting_text: >-
      Our findings support a model in which C. elegans piRNAs utilize their
      enormous repertoire of targeting capacity to scan the germline
      transcriptome for foreign sequences, while endogenous germline-expressed
      genes are actively protected from piRNA-induced silencing.
  - source_id: PMID:22738726
    title: piRNAs initiate an epigenetic memory of nonself RNA in the C. elegans germline.
    statement: >-
      PRG-1 initiates permanent silencing. Maintenance needs chromatin
      factors and the WAGO pathway.
    supporting_text: >-
      We show that the Piwi Argonaute PRG-1 and its genomically encoded piRNA
      cofactors initiate permanent silencing, and maintenance depends on
      chromatin factors and the WAGO Argonaute pathway.
  - source_id: PMID:22738725
    title: piRNAs can trigger a multigenerational epigenetic memory in the germline of C. elegans.
    statement: >-
      piRNA-triggered silencing becomes independent of the trigger and lasts
      at least 20 generations through a nuclear RNAi/chromatin pathway.
    supporting_text: >-
      piRNAs can trigger highly stable long-term silencing lasting at least
      20 generations. Once established, this long-term memory becomes
      independent of the piRNA trigger but remains dependent on the nuclear
      RNAi/chromatin pathway.
  - source_id: PMID:35739318
    title: The conserved helicase ZNFX-1 memorializes silenced RNAs in perinuclear condensates.
    statement: >-
      Heritable silencing involves two parallel amplification loops, a nuclear
      HRDE-1 loop and a perinuclear ZNFX-1 loop.
    supporting_text: >-
      The first loop, dependent on the nuclear Argonaute HRDE-1, targets
      nascent transcripts and reduces but does not eliminate productive
      transcription at the locus. The second loop, dependent on the conserved
      helicase ZNFX-1, targets mature transcripts and concentrates them in
      perinuclear condensates.
  - source_id: file:modules/c_elegans_mutator_22g_rna_amplification.yaml
    title: Mutator foci 22G-RNA amplification in Caenorhabditis elegans
    statement: >-
      Sibling module for the amplification machinery (MUT-16, RDE-2/MUT-7,
      RDE-3, RRF-1) and the WAGO-1 effector. The 22G-RNA amplification part
      of this module points to it.
  - source_id: file:genes/worm/prg-1/prg-1-ai-review.yaml
    title: prg-1 gene review
    statement: >-
      Core function: PRG-1 binds 21U-RNAs (GO:0034583) in P granules.
  - source_id: file:genes/worm/znfx-1/znfx-1-ai-review.yaml
    title: znfx-1 gene review
    statement: >-
      Core function: ZNFX-1 is an RNA helicase (GO:0003724) of the Z granule
      that acts in transgenerational siRNA inheritance.
notes: >-
  Boundary. This module covers how germline silencing is targeted and how it
  is inherited. Its parts are target recognition by PRG-1/21U-RNA (with
  DEPS-1), the hand-off to secondary 22G-RNAs and cytoplasmic WAGO
  silencing, nuclear HRDE-1 heritable silencing, and Z granule ZNFX-1/WAGO-4
  inheritance. The amplification machinery itself is modeled in
  MODULE:c_elegans_mutator_22g_rna_amplification: the MUT-16 scaffold, the
  RDE-2/MUT-7 exoribonuclease subcomplex, RDE-3 poly(UG) tailing and RRF-1
  RdRP synthesis. That module also holds the CSR-1 licensing branch, which
  protects endogenous germline genes from piRNA-triggered silencing. Here
  part 2 is a single cytoplasmic WAGO effector annoton (WAGO-1) that stands
  in for the whole amplification step. Its description points to the
  sibling module and does not repeat the machinery.

  Excluded. piRNA biogenesis (transcription by the USTC complex, PARN-1
  trimming and HENN-1 2'-O-methylation) is upstream of this boundary.
  PRG-2 is a nearly inactive paralog of PRG-1. The downstream nuclear RNAi
  factors (NRDE-1/2/4), the H3K9 methyltransferases SET-25 and SET-32, and
  HPL-2 carry out the chromatin step of the HRDE-1 loop. None of these has
  a gene review here, so they are named in descriptions but not modeled as
  annotons. SIMR-1 foci (PMID:32338603) link piRNA recognition to Mutator
  amplification and are also named only.

  DEPS-1. DEPS-1 is included in the recognition step because it binds
  PRG-1 directly and is required for piRNA-triggered secondary siRNAs, but
  not for piRNA biogenesis. Its MF (molecular condensate scaffold activity)
  follows the deps-1 review. It is not a claim that DEPS-1 recognizes
  targets.

  HRDE-1 (Q09249) has no gene review here. Its siRNA binding MF and its
  process terms rest on the cited primary papers.
module:
  id: c_elegans_pirna_transgenerational_silencing
  label: piRNA-initiated transgenerational silencing in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    PRG-1/21U-RNA recognition of germline transcripts, conversion into
    secondary 22G-RNA WAGO silencing, and inheritance of the silenced state
    through nuclear HRDE-1 and Z granule ZNFX-1/WAGO-4 loops.
  concepts:
    - preferred_term: regulatory ncRNA-mediated gene silencing
      term:
        id: GO:0031047
        label: regulatory ncRNA-mediated gene silencing
      description: >-
        Overall process. The cytoplasmic and nuclear modes are placed on
        individual annotons.
    - preferred_term: transposable element silencing
      term:
        id: GO:0010526
        label: transposable element silencing
      description: >-
        A major endogenous output. The same system also silences
        transgenes, pseudogenes and other non-self transcripts.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: perinuclear region of cytoplasm
        term:
          id: GO:0048471
          label: perinuclear region of cytoplasm
        description: >-
          Germline perinuclear nuage, where P granules, Z granules and
          Mutator foci sit together as PZM assemblages. The specific
          condensates are given on the annotons.
    anatomical_locations:
      - preferred_term: germline
        description: >-
          Hermaphrodite and male germ cells and the embryonic germline
          blastomeres through which the silenced state is transmitted.
  parts:
    - order: 1
      role: piRNA-guided target recognition
      node:
        id: pirna_recognition
        label: PRG-1/21U-RNA recognition of germline transcripts
        module_type: MOLECULAR_FUNCTION
        description: >-
          PRG-1 binds 21U-RNAs and needs them to accumulate. It localizes to
          P granules and pairs imperfectly with target transcripts. The P
          granule protein DEPS-1 binds PRG-1 through a Piwi-interacting
          motif, forms PRG-1-containing condensates, and is needed for
          piRNA targets to make secondary siRNAs.
        annotons:
          - id: prg1_pirna
            label: PRG-1 21U-RNA-bound Piwi Argonaute
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PRG-1
                term:
                  id: UniProtKB:P90786
                  label: Piwi-like protein 1
            function:
              preferred_term: 21U-RNA binding
              term:
                id: GO:0034583
                label: 21U-RNA binding
            processes:
              - preferred_term: regulatory ncRNA-mediated gene silencing
                term:
                  id: GO:0031047
                  label: regulatory ncRNA-mediated gene silencing
              - preferred_term: transposable element silencing
                term:
                  id: GO:0010526
                  label: transposable element silencing
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Guide-bound Piwi that scans germline transcripts and starts
              secondary siRNA production on the targets it recognizes.
            evidence:
              - source_id: PMID:18571452
                title: PRG-1 and 21U-RNAs interact to form the piRNA complex required for fertility in C. elegans.
                statement: 21U-RNAs bind PRG-1 and need it to accumulate; PRG-1 is in P granules.
                supporting_text: >-
                  interact with the C. elegans Piwi family member PRG-1, and
                  depend on PRG-1 activity for their accumulation. The PRG-1
                  protein is expressed throughout development and localizes to
                  nuage-like structures called P granules.
              - source_id: PMID:22738724
                title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
                statement: Targets pair imperfectly with 21U-RNAs and lose 22G-RNAs without PRG-1.
                supporting_text: >-
                  Sequences depleted of 22G-RNAs are proximal to potential
                  target sites that base pair imperfectly but extensively to
                  21U-RNAs.
          - id: deps1_prg1_partner
            label: DEPS-1 P granule partner of PRG-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DEPS-1
                term:
                  id: UniProtKB:Q9N303
                  label: P-granule-associated protein deps-1
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
            processes:
              - preferred_term: regulatory ncRNA-mediated gene silencing
                term:
                  id: GO:0031047
                  label: regulatory ncRNA-mediated gene silencing
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              P granule scaffold that binds PRG-1 directly and organizes
              PRG-1 condensates. It is needed for piRNA-triggered secondary
              siRNA production but not for piRNA biogenesis.
            evidence:
              - source_id: PMID:32843637
                title: DEPS-1 is required for piRNA-dependent silencing and PIWI condensate organisation in Caenorhabditis elegans.
                statement: >-
                  DEPS-1 binds PRG-1 and is needed for the secondary
                  endo-siRNAs that silence piRNA targets.
                supporting_text: >-
                  DEPS-1 is not required for piRNA biogenesis but
                  piRNA-dependent silencing: deps-1 mutants fail to produce the
                  secondary endo-siRNAs required for the silencing of piRNA
                  targets. We identify a motif on DEPS-1 which mediates a
                  direct interaction with PRG-1.
              - source_id: PMID:32843637
                title: DEPS-1 is required for piRNA-dependent silencing and PIWI condensate organisation in Caenorhabditis elegans.
                statement: DEPS-1 and PRG-1 form condensates that depend on the DEPS-1 Piwi-interacting motif.
                supporting_text: >-
                  DEPS-1 and PRG-1 form intertwining clusters to build
                  elongated condensates in vivo which are dependent on the
                  Piwi-interacting motif of DEPS-1.
    - order: 2
      role: secondary 22G-RNA amplification and cytoplasmic WAGO silencing
      node:
        id: secondary_wago_silencing
        label: Secondary 22G-RNA production and cytoplasmic WAGO silencing
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Targets recognized by PRG-1 are passed to the Mutator machinery
          next to P granules. There they are poly(UG)-tailed and used as
          templates for RdRP synthesis of 22G-RNAs. This machinery is
          modeled in MODULE:c_elegans_mutator_22g_rna_amplification. The
          22G-RNAs guide WAGO Argonautes, which keep silencing going after
          PRG-1 is no longer needed. WAGO-1 stands here for the cytoplasmic
          WAGO effector.
        annotons:
          - id: wago1_cytoplasmic_effector
            label: WAGO-1 cytoplasmic 22G-RNA effector
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WAGO-1
                term:
                  id: UniProtKB:Q21770
                  label: Argonaute protein wago-1
            function:
              preferred_term: siRNA binding
              term:
                id: GO:0035197
                label: siRNA binding
            processes:
              - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035194
                  label: regulatory ncRNA-mediated post-transcriptional gene silencing
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Non-slicing WAGO that carries amplified 22G-RNAs and maintains
              post-transcriptional silencing of piRNA targets.
            evidence:
              - source_id: PMID:19800275
                title: Distinct argonaute-mediated 22G-RNA pathways direct genome surveillance in the C. elegans germline.
                statement: WAGO-1 is a P granule WAGO that silences genes, transposons and cryptic loci.
                supporting_text: >-
                  WAGO-1 silences certain genes, transposons, pseudogenes, and
                  cryptic loci.
              - source_id: PMID:32338603
                title: A tudor domain protein, SIMR-1, promotes siRNA production at piRNA-targeted mRNAs in C. elegans.
                statement: P granules are the site of piRNA recognition and Mutator foci the site of siRNA amplification.
                supporting_text: >-
                  two phase-separated condensates that are the sites of
                  piRNA-dependent mRNA recognition and mutator
                  complex-dependent siRNA amplification, respectively.
    - order: 3
      role: nuclear heritable silencing
      node:
        id: nuclear_hrde1_loop
        label: HRDE-1 nuclear RNAi and chromatin silencing
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The germline nuclear WAGO HRDE-1 (WAGO-9) binds 22G-RNAs, enters
          germ cell nuclei, and recruits the nuclear RNAi defective (NRDE)
          pathway. This directs H3K9me3 at target loci and represses their
          transcription. Its partners HPL-2, SET-25 and SET-32 are needed for
          multigenerational inheritance of RNAi and piRNA silencing. Without
          HRDE-1, silencing is lost and fertility declines over generations.
        annotons:
          - id: hrde1_nuclear_ago
            label: HRDE-1 nuclear 22G-RNA Argonaute
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HRDE-1 (WAGO-9)
                term:
                  id: UniProtKB:Q09249
                  label: Argonaute protein hrde-1
            function:
              preferred_term: siRNA binding
              term:
                id: GO:0035197
                label: siRNA binding
            processes:
              - preferred_term: regulatory ncRNA-mediated heterochromatin formation
                term:
                  id: GO:0031048
                  label: regulatory ncRNA-mediated heterochromatin formation
              - preferred_term: negative regulation of gene expression, epigenetic
                term:
                  id: GO:0045814
                  label: negative regulation of gene expression, epigenetic
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Carries 22G-RNAs into germ cell nuclei and directs
              co-transcriptional H3K9me3 silencing that is passed to progeny.
            evidence:
              - source_id: PMID:22810588
                title: A nuclear Argonaute promotes multigenerational epigenetic inheritance and germline immortality.
                statement: HRDE-1 binds siRNAs and directs H3K9me3 through the NRDE pathway in germ cell nuclei.
                supporting_text: >-
                  hrde-1 encodes an Argonaute protein that associates with
                  small interfering RNAs in the germ cells of progeny of
                  animals exposed to double-stranded RNA. In the nuclei of
                  these germ cells, HRDE-1 engages the nuclear RNAi defective
                  pathway to direct the trimethylation of histone H3 at Lys 9
                  (H3K9me3) at RNAi-targeted genomic loci and promote RNAi
                  inheritance.
              - source_id: PMID:22810588
                title: A nuclear Argonaute promotes multigenerational epigenetic inheritance and germline immortality.
                statement: Without HRDE-1 or nuclear RNAi, germline silencing and fertility are lost over generations.
                supporting_text: >-
                  In hrde-1- or nuclear RNAi-deficient animals, germline
                  silencing is lost over generational time.
              - source_id: PMID:22738725
                title: piRNAs can trigger a multigenerational epigenetic memory in the germline of C. elegans.
                statement: HRDE-1/WAGO-9, HPL-2, SET-25 and SET-32 are needed for inheritance of piRNA silencing.
                supporting_text: >-
                  These include a germline-specific nuclear Argonaute
                  HRDE1/WAGO-9, a HP1 ortholog HPL-2, and two putative histone
                  methyltransferases, SET-25 and SET-32.
    - order: 4
      role: Z granule transgenerational memory
      node:
        id: z_granule_loop
        label: ZNFX-1/WAGO-4 Z granule inheritance
        module_type: BIOLOGICAL_PROCESS
        description: >-
          ZNFX-1 and WAGO-4 are in P granules of early germline blastomeres.
          Later they separate to form Z granules, which join P granules and
          Mutator foci in ordered PZM assemblages. The two proteins interact
          and are needed specifically for the inheritance phase of RNAi.
          ZNFX-1 binds silenced, poly(UG)-tailed transcripts and holds them
          in perinuclear condensates as templates for 22G-RNA amplification
          in the inheriting generation. This loop runs in parallel to the
          nuclear HRDE-1 loop.
        annotons:
          - id: znfx1_helicase
            label: ZNFX-1 Z granule RNA helicase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNFX-1
                term:
                  id: UniProtKB:E9P860
                  label: NFX1-type zinc finger-containing protein 1 homolog
            function:
              preferred_term: RNA helicase activity
              term:
                id: GO:0003724
                label: RNA helicase activity
            processes:
              - preferred_term: siRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0140766
                  label: siRNA-mediated post-transcriptional gene silencing
            locations:
              - preferred_term: Z granule
                term:
                  id: GO:0120279
                  label: Z granule
            role_description: >-
              Defining Z granule protein. It holds silenced pUG transcripts so
              that 22G-RNA amplification is sustained in the next generation.
            evidence:
              - source_id: PMID:29769721
                title: Spatiotemporal regulation of liquid-like condensates in epigenetic inheritance.
                statement: ZNFX-1 and WAGO-4 leave P granules to define the Z granule.
                supporting_text: >-
                  Later in germline development, ZNFX-1 and WAGO-4 separate
                  from P granules to define an independent liquid-like
                  condensate that we term the Z granule.
              - source_id: PMID:29769721
                title: Spatiotemporal regulation of liquid-like condensates in epigenetic inheritance.
                statement: ZNFX-1 is a dedicated RNAi inheritance factor.
                supporting_text: >-
                  The data establish that ZNFX-1 is a dedicated RNAi
                  inheritance factor.
              - source_id: PMID:35739318
                title: The conserved helicase ZNFX-1 memorializes silenced RNAs in perinuclear condensates.
                statement: ZNFX-1 binds pUG-tailed targets and sustains amplification in the inheriting generation.
                supporting_text: >-
                  ZNFX-1 interacts with sRNA-targeted transcripts that have
                  acquired poly(UG) tails and is required to sustain
                  pUGylation and robust sRNA amplification in the inheriting
                  generation.
              - source_id: PMID:29775580
                title: ZNFX-1 Functions within Perinuclear Nuage to Balance Epigenetic Signals.
                statement: ZNFX-1 is a conserved helicase-domain nuage protein that balances epigenetic inheritance.
                supporting_text: >-
                  we identify the deeply conserved helicase-domain protein,
                  ZNFX-1, as an epigenetic regulator and component of nuage
                  that interacts with Argonaute systems to balance epigenetic
                  inheritance.
          - id: wago4_inheritance_ago
            label: WAGO-4 Z granule 22G-RNA Argonaute
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WAGO-4
                term:
                  id: UniProtKB:O62275
                  label: Argonaute protein wago-4
            function:
              preferred_term: siRNA binding
              term:
                id: GO:0035197
                label: siRNA binding
            processes:
              - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035194
                  label: regulatory ncRNA-mediated post-transcriptional gene silencing
            locations:
              - preferred_term: Z granule
                term:
                  id: GO:0120279
                  label: Z granule
            role_description: >-
              Cytoplasmic WAGO that binds 22G-RNAs and their mRNA targets
              with ZNFX-1. It is needed for inheritance of RNAi aimed at both
              germline and somatic genes.
            evidence:
              - source_id: PMID:29791857
                title: A Cytoplasmic Argonaute Protein Promotes the Inheritance of RNAi.
                statement: WAGO-4 is needed for RNAi inheritance and binds 22G-RNAs and their targets.
                supporting_text: >-
                  is required for the inheritance of exogenous RNAi targeting
                  both germline- and soma-expressed genes. WAGO-4 binds to
                  22G-RNAs and their mRNA targets.
              - source_id: PMID:29769721
                title: Spatiotemporal regulation of liquid-like condensates in epigenetic inheritance.
                statement: WAGO-4 co-precipitates with ZNFX-1.
                supporting_text: >-
                  3xFLAG::WAGO-4 co-precipitates with HA::ZNFX-1, but not a HA
                  tagged negative control protein HA::HRDE-1, suggesting a
                  physical interaction between the two proteins
        connections:
          - source: wago4_inheritance_ago
            target: znfx1_helicase
            connection_type: POSITIVELY_REGULATES
            description: >-
              WAGO-4 interacts with ZNFX-1 and, according to the wago-4
              review, is needed for ZNFX-1 to engage silenced mRNAs.
  connections:
    - source: pirna_recognition
      target: secondary_wago_silencing
      connection_type: CAUSES
      description: >-
        PRG-1 recognition starts secondary 22G-RNA production at its
        targets. Without PRG-1 (or DEPS-1), targets lose 22G-RNAs.
    - source: secondary_wago_silencing
      target: nuclear_hrde1_loop
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Amplified 22G-RNAs are the guides of the nuclear WAGO HRDE-1.
    - source: secondary_wago_silencing
      target: z_granule_loop
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Amplified 22G-RNAs guide WAGO-4. Z granule pUG transcripts are in
        turn templates for further amplification in progeny.
knowledge_gaps:
  - gap_statement: >-
      How the nuclear HRDE-1 loop and the cytoplasmic ZNFX-1/WAGO-4 loop are
      coordinated within and across generations is unknown. So is the
      molecular basis of the hand-off from PRG-1-bound targets in P granules
      to the Mutator machinery.
    boundary: >-
      The two loops act genetically in parallel and use different
      templates (nascent versus mature transcripts). SIMR-1 foci sit between
      piRNA recognition and Mutator amplification. How a targeted transcript
      moves between the condensates has not been followed directly.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This decides whether heritable silencing is one coupled cycle or two
      separable memories, and what sets how long inheritance lasts.
    resolution: >-
      Live-image single tagged target RNAs through P granules, Mutator foci
      and Z granules in hrde-1, znfx-1 and double mutants across
      generations. Combine this with condensate-specific RNA profiling.
    provenance:
      - reference_id: PMID:35739318
        supporting_text: >-
          How the RDE-1, HRDE-1 and ZNFX-1 sRNA amplification mechanisms
          coordinate in cells and across generations will be an important
          focus for future investigations.
