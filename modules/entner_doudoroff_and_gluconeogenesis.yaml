                                  label: GLUCOKINASE
                              representative_members:
                                - preferred_term: glk (P. putida KT2440)
                                  term:
                                    id: UniProtKB:Q88P42
                                    label: Glucokinase
                                  description: >-
                                    PP_1011; phosphorylates glucose taken up by the
                                    ABC system (PMID:17483213).
                          function:
