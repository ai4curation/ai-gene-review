id: MODULE:entner_doudoroff_and_gluconeogenesis
title: Entner-Doudoroff glycolysis and gluconeogenesis module
description: >-
  A taxon-neutral module for bacterial hexose-phosphate central carbon metabolism
  in organisms that route glucose through the phosphorylative Entner-Doudoroff
  (ED) pathway rather than, or in addition to, a complete forward
  Embden-Meyerhof-Parnas (EMP) glycolytic route. 6-phosphogluconate is supplied
  either by phosphorylation and oxidation of glucose or by peripheral oxidative
  routes, and is split by 6-phosphogluconate dehydratase and KDPG aldolase into
  pyruvate and glyceraldehyde 3-phosphate. The module separates that committed ED
  branch from the shared lower glycolytic trunk and from the gluconeogenic bypass
  reactions that regenerate hexose phosphate from pyruvate, phosphoenolpyruvate or
  triose phosphate.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:0061678
    title: Entner-Doudoroff pathway
    statement: >-
      GO:0061678 grounds both the module and its committed 6-phosphogluconate
      branch. The route-specific terms GO:0061688 (glycolytic process via
      Entner-Doudoroff Pathway) and GO:0009255 (Entner-Doudoroff pathway
      through 6-phosphogluconate) were obsoleted in GO release 2026-05-19
      (replaced_by GO:0006096 and GO:0061678 respectively); the variant
      distinction is carried by the module structure rather than by the term.
  - source_id: GO:0006094
    title: gluconeogenesis
    statement: >-
      The reverse/anabolic route from lower central-carbon intermediates to
      hexose phosphates is grounded in the gluconeogenesis process term.
  - source_id: PMID:1624451
    title: >-
      Molecular characterization of the Entner-Doudoroff pathway in Escherichia
      coli: sequence analysis and localization of promoters for the edd-eda operon.
    statement: >-
      The ED dehydratase and aldolase are conserved across Escherichia coli,
      Zymomonas mobilis and Pseudomonas putida, which justifies a taxon-neutral
      ED branch with E. coli and P. putida exemplars.
    supporting_text: >-
      The primary amino acid sequences of the E. coli,
      Z. mobilis, and Pseudomonas putida aldolase enzymes are highly conserved.
  - source_id: PMID:17483213
    title: >-
      Convergent peripheral pathways catalyze initial glucose catabolism in
      Pseudomonas putida: genomic and flux analysis.
    statement: >-
      In P. putida, three peripheral glucose routes converge at
      6-phosphogluconate, which is then metabolized by Edd and Eda; this is the
      basis for modeling 6-phosphogluconate supply as alternative variants.
    supporting_text: >-
      glucose catabolism in Pseudomonas putida occurs
      through the simultaneous operation of three pathways that converge at the level
      of 6-phosphogluconate, which is metabolized by the Edd and Eda Entner/Doudoroff
      enzymes to central metabolites.
  - source_id: PMID:26350459
    title: >-
      Pseudomonas putida KT2440 strain metabolizes glucose through a cycle formed
      by enzymes of the Entner-Doudoroff, Embden-Meyerhof-Parnas, and pentose
      phosphate pathways.
    statement: >-
      In KT2440 the upper EMP enzymes run in the gluconeogenic direction during
      glucose growth and recycle triose phosphate to hexose phosphate (the EDEMP
      cycle), which is why the gluconeogenic bypass reactions belong in the same
      module.
    supporting_text: >-
      This set of reactions merges
      activities belonging to the ED, the EMP (operating in a gluconeogenic fashion),
      and the pentose phosphate pathways to form an unforeseen metabolic architecture
      (EDEMP cycle).
  - source_id: file:modules/entner_doudoroff_and_gluconeogenesis-deep-research-falcon.md
    title: Falcon module research for Entner-Doudoroff glycolysis and gluconeogenesis
    statement: >-
      Module-level research supports splitting ED-centered bacterial glucose
      catabolism from canonical EMP glycolysis and treating gluconeogenic
      bypasses as part of the same central-carbon module.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__entner_doudoroff_and_gluconeogenesis__ppu00010-deep-research-falcon.md
    title: Falcon PSEPK ppu00010 pathway satisfiability review
    statement: >-
      PSEPK-specific pathway research found that KEGG ppu00010 includes only a
      subset of the KT2440 ED/gluconeogenesis candidates and that core ED genes
      must be pulled from the neighboring pentose-phosphate boundary.
module:
  id: entner_doudoroff_and_gluconeogenesis
  label: Entner-Doudoroff glycolysis and gluconeogenesis
  module_type: METABOLIC_PATHWAY
  description: >-
    6-phosphogluconate supply -> 6-phosphogluconate dehydratase -> KDPG aldolase
    -> pyruvate + glyceraldehyde 3-phosphate; glyceraldehyde 3-phosphate -> lower
    glycolytic trunk -> pyruvate; gluconeogenic bypasses regenerate PEP,
    fructose 6-phosphate and glucose 6-phosphate.
  concepts:
    - preferred_term: Entner-Doudoroff pathway
      term:
        id: GO:0061678
        label: Entner-Doudoroff pathway
      description: >-
        Conversion of glucose-derived carbon to pyruvate and glyceraldehyde
        3-phosphate through the Entner-Doudoroff route. GO release 2026-05-19
        obsoleted the route-specific term GO:0061688 with replaced_by
        GO:0006096 (glycolytic process); this module grounds on GO:0061678
        instead so that it stays disjoint from the EMP-route modules grounded
        in GO:0061615, a subclass of GO:0006096. The shared lower trunk from
        glyceraldehyde 3-phosphate to pyruvate is modeled as a part below.
    - preferred_term: gluconeogenesis
      term:
        id: GO:0006094
        label: gluconeogenesis
      description: Formation of hexose phosphate from lower central-carbon precursors.
  context:
    taxa:
      - preferred_term: Bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Exemplars span Pseudomonas (ED as the sole glycolytic route) and
          Escherichia coli (ED induced for gluconate catabolism). The root is an
          evidence envelope, not a claim that every bacterium has the pathway.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The modeled enzymes are soluble cytosolic enzymes. Periplasmic and
          membrane steps of 6-phosphogluconate supply are confined to the
          referenced 2-ketogluconate loop module.
  parts:
    - order: 1
      role: 6-phosphogluconate supply
      node:
        id: six_phosphogluconate_supply
        label: Supply of 6-phosphogluconate
        module_type: METABOLIC_PATHWAY
        description: >-
          6-phosphogluconate, the committed ED substrate, is produced by one or
          more convergent routes that differ between lineages.
        variant_sets:
          - id: six_phosphogluconate_supply_routes
            label: 6-phosphogluconate supply routes
            axis: substrate route
            selection: ONE_OR_MORE
            variants:
              - id: phosphorylative_glucose_route
                label: Glucose phosphorylation and oxidation of glucose 6-phosphate
                module_type: METABOLIC_PATHWAY
                description: >-
                  Cytoplasmic glucose is phosphorylated by glucokinase, and glucose
                  6-phosphate is oxidized to 6-phosphogluconate by
                  glucose-6-phosphate dehydrogenase and 6-phosphogluconolactonase.
                  Glucose 6-phosphate can also come from phosphotransferase uptake
                  or from gluconeogenic recycling, so the glucokinase part is
                  optional.
                parts:
                  - order: 1
                    role: glucose to glucose 6-phosphate
                    optional: true
                    node:
                      id: glucokinase_step
                      label: Glucose phosphorylation
                      module_type: REACTION
                      annotons:
                        - id: glucokinase_activity
                          label: Glucokinase
                          participant:
