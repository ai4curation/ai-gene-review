  connections:
    - source: six_phosphogluconate_supply
      target: entner_doudoroff_branch
      connection_type: PROVIDES_INPUT_FOR
      description: All supply routes converge on 6-phosphogluconate, the dehydratase substrate.
    - source: glucokinase_step
      target: glucose_6_phosphate_dehydrogenase_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: Glucokinase produces D-glucose 6-phosphate, the dehydrogenase substrate.
    - source: glucose_6_phosphate_dehydrogenase_step
      target: phosphogluconolactonase_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: The dehydrogenase produces 6-phospho-D-glucono-1,5-lactone, the lactonase substrate.
    - source: phosphogluconate_dehydratase_step
      target: kdpg_aldolase_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        The dehydratase produces 2-dehydro-3-deoxy-6-phospho-D-gluconate (KDPG),
        the aldolase substrate.
    - source: entner_doudoroff_branch
      target: lower_emp_trunk
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The ED branch generates glyceraldehyde 3-phosphate that enters the lower
        trunk; it also directly produces pyruvate.
    - source: lower_emp_trunk
      target: gluconeogenic_bypasses
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Run in reverse, the lower trunk supplies triose phosphate to the
        aldolase/FBPase bypass; PEP formation from pyruvate bypasses the
        irreversible pyruvate kinase step.
    - source: gluconeogenic_bypasses
      target: glucose_6_phosphate_dehydrogenase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Regenerated glucose 6-phosphate can re-enter glucose-6-phosphate
        dehydrogenase. In P. putida KT2440 this closes the EDEMP cycle during
        glucose growth (PMID:26350459); elsewhere it serves hexose-phosphate
        biosynthesis.
  notes: >-
    Generalization. The phosphorylative ED branch (Edd and Eda) is conserved
    across bacteria that use it (E. coli, Zymomonas, Pseudomonas), so the module is
    ABSTRACT and the ED steps carry both E. coli K-12 and P. putida KT2440
    exemplars; the lower trunk adds the characterized B. subtilis GpmI. The
    KT2440 EDEMP architecture (upper EMP enzymes running gluconeogenically during
    glucose growth, no phosphofructokinase) is lineage-characteristic and is
    modeled only as a described connection, not as a required part. Boundary.
    Periplasmic glucose oxidation and the 2-ketogluconate loop are included by
    reference as one 6-phosphogluconate supply variant; the gluconate-kinase
    route, the non-phosphorylative and semi-phosphorylative archaeal ED variants,
    and pentose-phosphate recycling are not modeled. PEP carboxykinase is
    included by reference to the gluconeogenesis module. KT2440 exemplars and
    locus tags: glk/Q88P42, zwfA/Q88P31, pgl/Q88P30, edd/Q88P43, eda/Q88P29,
    tpiA/Q88DV4, gapA/Q88P44, pgk/Q88D64, gpmI/Q88CX4, eno/Q88MF9, pykA/Q88N54,
    pyk/Q88EZ9, ppsA/Q88L53, fba/Q88D67, fbp/Q88CY9, pgi1/Q88LW9 and pgi2/Q88DW7.
    KEGG ppu00010 alone is an incomplete satisfiability boundary for KT2440,
    because edd, zwfA, pgl and eda are assigned through neighboring
    pentose-phosphate or glutathione-metabolism maps. The second KT2440 GAPDH
    gapB/Q88KZ0 (PTHR43454) and the minor G6PDH paralogs are deliberately not
    representatives, because their contributions are unmeasured.
