id: MODULE:phage_phikz_chimallin_nucleus_and_phuz_spindle
title: Jumbo phage chimallin nuclear shell, PhuZ tubulin spindle, capsid maturation, and peptidoglycan lysis
description: 'Subcellular compartmentalization, cytoskeletal trafficking, virion morphogenesis, and cell envelope lysis module
  of chimallinviruses (exemplified by giant Pseudomonas phages phiKZ and 201phi2-1). The module coordinates four coupled stages
  of the jumbo phage lytic cycle: (1) Virion-associated peptidoglycan penetration during host entry, where the 2,237-amino-acid
  tail/baseplate exolysin gp181 (EXLYS) locally degrades the host cell wall peptidoglycan sacculus via its C-terminal lytic
  transglycosylase domain (residues 1880-2042, potentiated threefold by its distal C-terminal tail residues 2043-2237) to
  enable tail tube penetration and viral genome injection; (2) Self-assembly of the micrometer-scale phage nucleus in the
  host cytoplasm, in which chimallin (ChmA/PhuN; PHIKZ054/gp54 in phiKZ and 201phi2-1p105/gp105 in 201phi2-1) oligomerizes
  into C4-symmetric homotetramers with ~2 nm central pores that polymerize via flexible N- and C-terminal tail interactions
  into a closed single-layered square-lattice proteinaceous shell surrounding replicating phage DNA, concentrating viral DNA
  replication and transcription enzymes inside while excluding host ribosomes and DNA-targeting immune nucleases (such as
  CRISPR-Cas and restriction endonucleases); (3) Cytoskeletal centering, nuclear rotation, and procapsid trafficking by the
  phage-encoded divergent tubulin/FtsZ-family GTPase PhuZ (TubZ; PHIKZ039/gp39 in phiKZ and 201phi2-1p059/gp59 in 201phi2-1),
  which polymerizes via an extended acidic C-terminal tail into three-stranded helical filaments anchored at the host cell
  poles that harness GTPase-dependent dynamic instability to push the chimallin nucleus to midcell and filament treadmilling
  to rotate the nucleus and transport membrane-assembled procapsids to the nuclear surface for DNA packaging; and (4) T=27
  icosahedral procapsid proteolytic maturation and cytolytic virion egress, in which the morphogenetic MEROPS S80 serine protease
  gp175 (PRO) undergoes C-terminal self-cleavage autoactivation at Glu210 and cleaves 19 head and cylindrical inner body precursor
  proteins across 39 [S/A/G]-X-E sites—including removal of the 163-residue N-terminal propeptide of the major capsid protein
  gp120 (CAPSD)—followed at the end of infection by degradation of the host peptidoglycan sacculus by the modular endolysin
  gp144 (PHIKZ144), which combines a high-affinity N-terminal peptidoglycan-binding domain (residues 9-69) with a C-terminal
  dual-active-site (Glu115/Tyr197 and Glu178/Tyr147) GH23 lytic transglycosylase domain.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:18671939
  title: The structural peptidoglycan hydrolase gp181 of bacteriophage phiKZ.
  statement: Delineates the C-terminal peptidoglycan hydrolase domain (residues 1880-2042) and threefold activity-enhancing
    distal tail (residues 2043-2237) of the 2,237-amino-acid phiKZ structural virion exolysin gp181 involved in local peptidoglycan
    digestion during phage entry.
- source_id: PMID:28082593
  title: Assembly of a nucleus-like structure during viral replication in bacteria.
  statement: Demonstrates by live-cell fluorescence microscopy and cryo-electron tomography that Pseudomonas phage 201phi2-1
    gp105 assembles a proteinaceous nuclear shell around replicating viral DNA that segregates nuclear DNA replication and
    transcription from cytoplasmic translation and is centered at midcell by the bipolar PhuZ tubulin spindle.
- source_id: PMID:28813669
  title: The Phage Nucleus and Tubulin Spindle Are Conserved among Large Pseudomonas Phages.
  statement: Establishes that both the chimallin phage nuclear shell (gp54 in phiKZ, gp53 in phiPA3, gp105 in 201phi2-1) and
    the dynamically unstable PhuZ bipolar tubulin spindle (gp39 in phiKZ, requiring catalytic Asp204) are conserved across
    large Pseudomonas phages.
- source_id: PMID:35922510
  title: Architecture and self-assembly of the jumbo bacteriophage nuclear shell.
  statement: Resolves by cryo-EM and in situ cryo-ET how chimallin (ChmA/gp105) self-assembles into C4-symmetric homotetramers
    that polymerize via flexible N- and C-terminal tail interactions into a single-layered square-lattice nuclear shell.
- source_id: PMID:22726436
  title: A phage tubulin assembles dynamic filaments by an atypical mechanism to center viral DNA within the host cell.
  statement: Identifies the divergent phage tubulin-like GTPase PhuZ (gp59) of 201phi2-1 and shows that its extended acidic
    C-terminal tail and GTP hydrolysis activity are required to assemble dynamic filaments that center viral DNA at midcell.
- source_id: PMID:24631461
  title: The structure and assembly mechanism of a novel three-stranded tubulin filament that centers phage DNA.
  statement: Cryo-EM reconstruction of 201phi2-1 PhuZ filaments at 3.5 A resolution revealing a three-stranded helical filament
    architecture stabilized both longitudinally and laterally by the extended acidic C-terminal tail.
- source_id: PMID:25429514
  title: A bacteriophage tubulin harnesses dynamic instability to center DNA in infected cells.
  statement: Shows that polarly anchored PhuZ filaments exhibit microtubule-like dynamic instability in vitro and in vivo
    to form a bipolar spindle that pushes the phage nucleus to midcell.
- source_id: PMID:31199917
  title: Viral Capsid Trafficking along Treadmilling Tubulin Filaments in Bacteria.
  statement: Demonstrates that procapsids assemble on the host inner membrane and move along treadmilling PhuZ filaments to
    the chimallin nuclear shell, which is rotated by the PhuZ spindle to distribute capsids for DNA packaging.
- source_id: PMID:16081102
  title: A three-dimensional cryo-electron microscopy structure of the bacteriophage phiKZ head.
  statement: Resolves the 1455 A T=27 icosahedral capsid shell of phage phiKZ composed of 260 hexameric capsomers (1,560 subunits)
    of the 65 kDa mature major capsid protein gp120.
- source_id: PMID:22429790
  title: Extensive proteolysis of head and inner body proteins by a morphogenetic protease in the giant Pseudomonas aeruginosa
    phage φKZ.
  statement: Identifies gp175 as the phiKZ morphogenetic prohead protease that cleaves 19 head and inner body proteins across
    39 [S/A/G]-X-E sites, including removal of the 163-residue N-terminal propeptide of major capsid protein gp120.
- source_id: PMID:17233731
  title: Peptidoglycan lytic activity of the Pseudomonas aeruginosa phage phiKZ gp144 lytic transglycosylase.
  statement: Demonstrates that phiKZ gp144 is a lytic transglycosylase endolysin that cleaves Gram-negative peptidoglycan
    into 1,6-anhydro-muropeptides and lyses host bacterial cells.
- source_id: GO:0019058
  title: viral life cycle
  statement: Captures the core viral replication and subcellular compartmentalization cycle mediated by the chimallin nuclear
    shell and PhuZ spindle.
- source_id: GO:0046797
  title: viral procapsid maturation
  statement: Defines the proteolytic maturation of the phiKZ prohead and internal inner body catalyzed by the serine endopeptidase
    gp175.
notes: 'Exemplar phages: Pseudomonas phage phiKZ (NCBITaxon:2905945) and Pseudomonas phage 201phi2-1 (NCBITaxon:198110). Generalizes
  across nucleus-forming jumbo phages of family Chimallinviridae (including Pseudomonas phages phiKZ, 201phi2-1, and phiPA3,
  Serratia phage PCH45, and Escherichia phage Goslar) that construct a chimallin proteinaceous nucleus and a PhuZ cytoskeletal
  tubulin spindle inside the infected bacterial host.'
