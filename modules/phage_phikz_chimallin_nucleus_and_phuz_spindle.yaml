  knowledge_gaps:
  - gap_statement: Although the chimallin (ChmA) phage nuclear shell and the PhuZ three-stranded tubulin spindle are structurally
      and functionally well-characterized organelles in chimallinviruses, Gene Ontology currently lacks dedicated cellular
      component terms for the phage nuclear shell (chimallin compartment) and the phage-encoded PhuZ bipolar tubulin spindle,
      requiring annotation to the broad parent term host cell cytoplasm (GO:0030430); furthermore, the molecular identity
      of the shell-spanning pore/import machinery that selectively translocates folded ~50-100 kDa viral proteins across the
      ~2 nm chimallin lattice pore remains unresolved.
    boundary: Map chimallin (PHIKZ054, 201phi2-1p105) to GO:0005198 (structural molecule activity) and GO:0030430 (host cell
      cytoplasm), and PhuZ (PHIKZ039, 201phi2-1p059) to GO:0003924 (GTPase activity), GO:0019058 (viral life cycle) / GO:0019068
      (virion assembly), and GO:0030430 (host cell cytoplasm).
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
