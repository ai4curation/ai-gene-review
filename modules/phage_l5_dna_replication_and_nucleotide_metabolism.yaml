id: MODULE:phage_l5_dna_replication_and_nucleotide_metabolism
title: Mycobacteriophage L5 autonomous DNA replication, split DnaG primase, and NrdH-coupled nucleotide metabolism
description: 'The integrated deoxynucleotide precursor biosynthesis, replication fork priming, DNA synthesis, and Holiday
  junction resolution module encoded in the right-arm early/middle region of Mycobacterium phage L5 (52,297 bp). Because mycobacterial
  hosts maintain tightly regulated dNTP pools, L5 encodes a dedicated nucleotide metabolism suite coupled directly to its
  autonomous replication apparatus: (1) Deoxynucleotide synthesis and phosphoester remodeling, in which the class II adenosylcobalamin-dependent
  ribonucleoside-triphosphate reductase gp50 (gene 50) reduces ribonucleotides to deoxyribonucleotides using the phage-encoded
  77-residue NrdH glutaredoxin-like redoxin gp56 (gene 56, containing a conserved CVQC active site reduced by host mycobacterial
  thioredoxin reductase) as its physiological electron donor, while the flavin-dependent thymidylate synthase ThyX gp48 (gene
  48) methylates dUMP to dTMP using FAD and NAD(P)H, and the MazG-like nucleotide pyrophosphatase gp37 (gene 37) together
  with the calcineurin-like metallophosphoesterases gp54 (gene 54) and gp66 (gene 66) hydrolyze non-canonical nucleotide pyrophosphates
  and phosphoesters; (2) Replication fork unwinding and bipartite split-primase priming, in which the DnaB-like hexameric
  replicative DNA helicase gp65 (gene 65) unwinds duplex phage DNA and coordinates with a split DnaG-type primase whose N-terminal
  CHC2 zinc-ribbon DNA-binding domain is encoded by gp58 (gene 58) and whose C-terminal TOPRIM catalytic nucleotidyltransferase
  domain is encoded by the adjacent gp57 (gene 57); (3) Leading- and lagging-strand synthesis and proofreading, catalyzed
  by the 595-residue Pol I-family DNA polymerase gp44 (gene 44), which combines a C-terminal family A polymerase domain with
  an N-terminal 3''-5'' proofreading exonuclease domain; and (4) Recombination intermediate and concatemer branch resolution,
  in which the PD-(D/E)XK nuclease gp69 (gene 69) and the T4 endonuclease VII-like His-Me finger Holliday junction resolvase
  gp59 (gene 59) debranch replicated concatemeric DNA prior to cos-site packaging.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  statement: Identifies the right-arm replication and nucleotide metabolism gene cluster of mycobacteriophage L5, including
    DNA polymerase gp44, flavin-dependent thymidylate synthase gp48, ribonucleotide reductase gp50, split primase subunits
    gp57/gp58, endonuclease VII gp59, and DnaB-like helicase gp65.
- source_id: PMID:18248423
  title: Cloning, characterization and expression analysis of nucleotide metabolism-related genes of mycobacteriophage L5.
  statement: Clones, expresses, and characterizes L5 nucleotide metabolism proteins gp48 (ThyX), gp50 (class II ribonucleotide
    reductase), and gp54 (metallophosphoesterase).
- source_id: PMID:24913246
  title: Mycobacteriophage L5Gp56, a novel member of the NrdH family of redoxins.
  statement: Solves the solution NMR structure of L5 gp56 and demonstrates its disulfide reductase activity with mycobacterial
    thioredoxin reductase as the electron donor for L5 ribonucleotide reductase gp50.
- source_id: PMID:9636706
  title: 'Genome structure of mycobacteriophage D29: implications for phage evolution.'
  statement: Comparative genomic analysis of L5 and D29 conserving the right-arm Pol I polymerase (gp44), ThyX (gp48), NrdH
    (gp56), split DnaG primase (gp57/gp58), endonuclease VII (gp59), and DnaB helicase (gp65) replication module.
notes: 'Exemplar organism: Mycobacterium phage L5 (NCBITaxon:31757, UniProt proteome UP000002402). Illustrates the characteristic
  Actinobacteriophage Cluster A replication architecture featuring an autonomous Pol I polymerase, a split two-gene DnaG primase
  (gp58 Zn-ribbon + gp57 TOPRIM), and an AdoCbl-dependent class II RNR + NrdH redoxin + flavin-dependent ThyX nucleotide biosynthetic
  cassette.'
