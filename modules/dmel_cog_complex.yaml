id: MODULE:dmel_cog_complex
title: Conserved oligomeric Golgi (COG) complex in Drosophila melanogaster
description: >-
  The conserved oligomeric Golgi (COG) complex is an eight-subunit multisubunit tethering
  complex at the Golgi apparatus. It tethers COPI-derived vesicles that recycle Golgi resident
  proteins, such as glycosylation enzymes, between cisternae, and it interacts with Golgi
  SNAREs, Rab GTPases and COPI coat proteins. The complex is organized into two lobes, lobe
  A (Cog1-Cog4) and lobe B (Cog5-Cog8). In Drosophila, Cog5 is encoded by four way stop (fws),
  whose mutants are defective in male meiotic cytokinesis and Golgi organization during spermatogenesis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000467
  title: 'FlyBase gene group COG: Conserved oligomeric golgi complex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as conserved oligomeric golgi
    complex (COG); this module models that group.
- source_id: GO:0017119
  title: COG complex
  statement: >-
    GO term grounding the module as COG complex.
notes: >-
  Boundary. The module contains the eight COG subunits. Golgi SNAREs and Rabs that COG engages
  are partners, not parts. Lobe assignments follow the conserved organization established
  in yeast and mammals. FlyBase groups realized by this module: COG (FBgg0000467). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cog_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
