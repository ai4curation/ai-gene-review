id: MODULE:dmel_rzz_complex
title: Rod-Zw10-Zwilch (RZZ) complex in Drosophila melanogaster
description: >-
  The RZZ complex, made of Rough deal (Rod), Zw10 and Zwilch, assembles on unattached kinetochores
  in prometaphase. It recruits the Mad1-Mad2 checkpoint proteins and is therefore required
  for the spindle assembly checkpoint, and it recruits dynein-dynactin through the adaptor
  Spindly. Once microtubules attach, dynein strips RZZ and checkpoint proteins from the kinetochore
  along kinetochore fibres, which helps silence the checkpoint. Rod and Zw10 were first identified
  in Drosophila through mutants with chromosome segregation defects.
status: DRAFT
scope: CONCRETE
