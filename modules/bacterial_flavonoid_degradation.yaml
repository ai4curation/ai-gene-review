id: MODULE:bacterial_flavonoid_degradation
title: Bacterial naringenin A-ring degradation
description: >-
  A species-neutral model of the bacterial fde pathway that converts naringenin
  through hydroxylation and oxygenolytic A-ring cleavage to smaller aromatic
  products. The module exposes six reaction parts corresponding to KEGG
  R13074-R13079. FdeE (genetics, metabolite profiling and purified-enzyme
  assays) and FdeC (genetics and metabolite profiling) have experimental
  support in Herbaspirillum seropedicae, and the fde operon as a whole is
  naringenin-induced and required for naringenin degradation, whereas the
  individual roles assigned to FdeD, FdeH, FdeJ, FdeB, and FdeI remain pathway
  and orthology predictions. KEGG assigns Fde orthologs to roughly 80-140
  bacterial genomes per protein, so the module is written for bacteria
  generally, with H. seropedicae SmR1 and Pseudomonas putida KT2440 as
  exemplars. The module
  therefore distinguishes required pathway roles from directly established
  molecular functions and does not treat every co-assigned protein as an
  independently characterized catalyst.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:27059806
  title: Genetic and functional characterization of a novel meta-pathway for degradation of naringenin in Herbaspirillum seropedicae SmR1
  statement: >-
    Mutant and LC-MS/MS evidence establishes FdeE-dependent naringenin
    monooxygenation and FdeC-dependent A-ring dioxygenation in H. seropedicae.
- source_id: PMID:39107441
  title: Novel enzymatic route to the synthesis of C-8 hydroxyflavonoids including flavonols and isoflavones
  statement: >-
    Purified Hsero_1007 (HERSS) is an NADPH-dependent FAD monooxygenase that
    hydroxylates naringenin and other flavonoids at C-8.
- source_id: PMID:23125118
  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1
  statement: >-
    The fde operon is induced by naringenin and chrysin, and fdeA and fdeR
    mutants cannot degrade naringenin.
- source_id: KEGG:map00946
  title: Degradation of flavonoids
  statement: >-
    KEGG supplies the R13074-R13079 reaction chain and K26179-K26185 Fde role
    assignments; the individual reaction records mark the chemistry as unclear.
- source_id: file:HERSS/Hsero_1007/Hsero_1007-ai-review.yaml
  title: Herbaspirillum seropedicae Hsero_1007 FdeE gene review
  statement: >-
    The review grounds the FdeE leaf to D8J0W9, GO:0016709 and flavonoid
    catabolic process, from mutant and purified-enzyme evidence.
- source_id: file:HERSS/Hsero_1005/Hsero_1005-ai-review.yaml
  title: Herbaspirillum seropedicae Hsero_1005 FdeC gene review
  statement: >-
    The review grounds the FdeC leaf to D8J0W7 and GO:0016702 from the fdeC
    mutant phenotype and removes the submitter glyoxalase II activity.
- source_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
  title: KEGG orthology and reaction assignments for the H. seropedicae fde locus
  statement: >-
    Live KEGG queries map Hsero_1004-Hsero_1012 to the Fde orthology groups
    K26179-K26185, list the R13074-R13079 reactions, and count the genomes
    carrying each Fde ortholog.
- source_id: file:PSEPK/PP_3197/PP_3197-ai-review.yaml
  title: Pseudomonas putida PP_3197 FdeC-like gene review
  statement: >-
    The review grounds the FdeC leaf to Q88I05, GO:0016702, and orthology to the
    experimentally tested Hsero_1005 protein.
- source_id: file:PSEPK/PP_3199/PP_3199-ai-review.yaml
  title: Pseudomonas putida PP_3199 FdeE-like gene review
  statement: >-
    The review grounds the FdeE leaf to Q88I03 and a conservative monooxygenase
    molecular-function term.
- source_id: file:PSEPK/PP_3195/PP_3195-ai-review.yaml
  title: Pseudomonas putida PP_3195 FdeB-like gene review
  statement: The review grounds the predicted FdeB ester-hydrolase role to Q88I07.
- source_id: file:PSEPK/PP_3206/PP_3206-ai-review.yaml
  title: Pseudomonas putida PP_3206 FdeJ-like gene review
  statement: >-
    The review supports Q88HZ6 as an FdeJ-like pathway component while leaving
    its molecular function and the proposed R13076 chemistry unresolved.
- source_id: file:PSEPK/PP_3204/PP_3204-ai-review.yaml
  title: Pseudomonas putida PP_3204 FdeH-like gene review
  statement: The review supports FdeH pathway participation but leaves its molecular function unresolved.
- source_id: file:PSEPK/PP_3205/PP_3205-ai-review.yaml
  title: Pseudomonas putida PP_3205 FdeI-like gene review
  statement: The review accepts only broad catalytic activity for FdeI and carries the predicted R13078 decarboxylation and R13079 dehydration as an open knowledge gap.
notes: >-
  Scope: the fde route is bacterial but not restricted to Herbaspirillum or
  Pseudomonas; KEGG lists each Fde orthology group (K26179-K26185) in about
  80-140 genomes, so the module stays at NCBITaxon:2 with H. seropedicae SmR1
  (the only organism with experimental data) and P. putida KT2440 as
  exemplars. No third organism was added because no other fde locus has
  experimental support. Family groundings follow the PANTHER assignments of
  the representative proteins (as in PR #5076), except that FdeE is grounded
  to subfamily PTHR13789:SF309, where the family review scopes the
  NAD(P)H-monooxygenase term. Every PANTHER family used is far broader than its
  Fde orthology group and carries no flavonoid-specific function; the family
  reviews record this. One FAMILY_FUNCTION_UNREVIEWED warning is expected:
  the PTHR22946 review leaves carboxylic ester hydrolase activity UNRESOLVED
  because its SF12 subfamily mixes ester and carbon-carbon hydrolases. The
  FdeH, FdeJ and both FdeI annotons carry free-text functions without GO ids
  (NO_FUNCTION_ID warnings) because no reaction class is established for them;
  the PTHR43211 review leaves carboxy-lyase activity UNRESOLVED. FdeC has no PANTHER family in its UniProt record, so no
  family id is asserted for it. FdeG (Hsero_1009, a putative cyclase whose
  mutant was studied) and FdeA have no KEGG reaction assignment and are not
  modeled as parts.
module:
  id: bacterial_flavonoid_degradation
  label: bacterial naringenin A-ring degradation
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: flavonoid catabolic process
    term:
      id: GO:0046275
      label: flavonoid catabolic process
    description: >-
      The modeled fde route breaks naringenin down to oxaloacetate and smaller
      aromatic products; GO has no naringenin-specific catabolic child term.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
  parts:
  - order: 1
    role: naringenin hydroxylation
    node:
      id: r13074_naringenin_hydroxylation
      label: naringenin to 5,7,8-trihydroxyflavanone
      module_type: REACTION
      annotons:
      - id: fdee_monooxygenase
        label: FdeE flavonoid monooxygenase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeE naringenin monooxygenase family
            representative_members:
            - preferred_term: Hsero_1007 (HERSS)
              term:
                id: UniProtKB:D8J0W9
                label: FAD-dependent 2-polyprenyl-6-methoxyphenol hydroxylase protein
            - preferred_term: PP_3199 (PSEPK)
              term:
                id: UniProtKB:Q88I03
                label: Monooxygenase
            term:
              id: PANTHER:PTHR13789:SF309
              label: PUTATIVE (AFU_ORTHOLOGUE AFUA_6G14510)-RELATED
        function:
          preferred_term: flavonoid 8-monooxygenase activity
          term:
            id: GO:0016709
            label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen
          substrates:
          - preferred_term: naringenin
          - preferred_term: dioxygen
          products:
          - preferred_term: 5,7,8-trihydroxy-2-(4-hydroxyphenyl)-2,3-dihydro-4H-chromen-4-one
          evidence:
          - source_id: PMID:27059806
            statement: FdeE mutation blocked naringenin conversion in H. seropedicae.
          - source_id: PMID:39107441
            statement: Purified FdeE C-8-hydroxylates naringenin with an absolute NADPH requirement.
          - source_id: KEGG:R13074
            statement: Predicted hydroxylation reaction; exact cofactor accounting is unresolved.
        role_description: >-
          FdeE performs the experimentally supported entry monooxygenation. The
          broad GO term is used because no substrate-specific GO term exists.
      - id: fded_rieske_partner
        label: FdeD Rieske electron-transfer component
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeD Rieske [2Fe-2S] protein family
            representative_members:
            - preferred_term: Hsero_1006 (HERSS)
              term:
                id: UniProtKB:D8J0W8
                label: Rieske (2Fe-2S) domain protein
            - preferred_term: PP_3198 (PSEPK)
              term:
                id: UniProtKB:Q88I04
                label: Ferredoxin, 2Fe-2S
            term:
              id: PANTHER:PTHR40261
              label: FAMILY NOT NAMED
        function:
          preferred_term: 2 iron, 2 sulfur cluster binding
          term:
            id: GO:0051537
            label: 2 iron, 2 sulfur cluster binding
          evidence:
          - source_id: file:PSEPK/PP_3198/PP_3198-ai-review.yaml
            statement: Rieske domain evidence supports cluster binding.
        role_description: >-
          FdeD is associated with R13074 by KEGG, but its electron donor and
          acceptor have not been established; no direct FdeD-FdeE transfer is asserted.
          Purified FdeE is active with NADPH alone, so FdeD is not an obligate
          FdeE partner in vitro.
  - order: 2
    role: oxygenolytic A-ring cleavage
    node:
      id: r13075_a_ring_cleavage
      label: trihydroxyflavanone dioxygenation and A-ring cleavage
      module_type: REACTION
      annotons:
      - id: fdec_dioxygenase
        label: FdeC A-ring-cleaving dioxygenase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeC flavonoid A-ring dioxygenase family
            representative_members:
            - preferred_term: Hsero_1005 (HERSS)
              term:
                id: UniProtKB:D8J0W7
                label: Glyoxalase II protein
            - preferred_term: PP_3197 (PSEPK)
              term:
                id: UniProtKB:Q88I05
                label: Glyoxalase family protein
        function:
          preferred_term: flavonoid A-ring extradiol dioxygenase activity
          term:
            id: GO:0016702
            label: oxidoreductase activity, acting on single donors with incorporation of molecular oxygen, incorporation of two atoms of oxygen
          substrates:
          - preferred_term: 5,7,8-trihydroxyflavanone
          - preferred_term: dioxygen
          products:
          - preferred_term: A-ring meta-cleavage product C22569
          evidence:
          - source_id: PMID:27059806
            statement: FdeC mutation caused accumulation of the trihydroxyflavanone substrate.
          - source_id: KEGG:R13075
            statement: Predicted dioxygenation and A-ring cleavage reaction.
        role_description: >-
          FdeC is the experimentally supported ring-cleavage catalyst; substrate-
          specific chemistry in species other than H. seropedicae remains inferred.
      - id: fdeh_cupin_component
        label: FdeH cupin component
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeH cupin-family pathway component
            representative_members:
            - preferred_term: Hsero_1010 (HERSS)
              term:
                id: UniProtKB:D8J0X2
                label: Cupin_2 family protein
            - preferred_term: PP_3204 (PSEPK)
              term:
                id: UniProtKB:Q88HZ8
                label: Cupin type-2 domain-containing protein
            term:
              id: PANTHER:PTHR36156
              label: SLR2101 PROTEIN
        function:
          preferred_term: unresolved FdeH contribution to A-ring cleavage (no GO molecular function term)
          description: >-
            Cupin type-2 protein KEGG-co-assigned with FdeC to R13075. No
            catalytic, metal-binding or structural activity has been shown, so no
            GO identifier is asserted.
          evidence:
          - source_id: KEGG:R13075
            statement: KEGG lists FdeH with FdeC for the dioxygenation step.
          - source_id: file:HERSS/Hsero_1010/Hsero_1010-ai-review.yaml
            statement: The gene review asserts no molecular function.
        role_description: >-
          KEGG co-assigns FdeH to R13075, but available evidence does not show
          whether it is catalytic, metal-binding, structural, or dispensable.
  - order: 3
    role: cleavage-product hydrolysis
    node:
      id: r13076_c_c_hydrolysis
      label: C22569 to flavonoid-derived delta-lactone and oxaloacetate
      module_type: REACTION
      annotons:
      - id: fdej_c_c_hydrolase
        label: FdeJ pathway component
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeJ flavonoid-cleavage-product hydrolase family
            representative_members:
            - preferred_term: Hsero_1012 (HERSS)
              term:
                id: UniProtKB:D8J0X4
                label: UDP-glucose 4-epimerase protein
            - preferred_term: PP_3206 (PSEPK)
              term:
                id: UniProtKB:Q88HZ6
                label: NAD-dependent epimerase/dehydratase domain-containing protein
            term:
              id: PANTHER:PTHR43103
              label: NUCLEOSIDE-DIPHOSPHATE-SUGAR EPIMERASE
        function:
          preferred_term: predicted oxaloacetate-releasing cleavage of C22569 (no GO molecular function term)
          description: >-
            KEGG R13076 converts the A-ring cleavage product to a delta-lactone
            and oxaloacetate; KEGG marks the reaction as unclear and FdeJ has an
            NAD(P)-dependent epimerase/dehydratase fold, so no GO identifier is
            asserted.
          substrates:
          - preferred_term: A-ring meta-cleavage product C22569
          - preferred_term: water
          products:
          - preferred_term: 5-(4-hydroxyphenyl)-3-oxovalero-delta-lactone
          - preferred_term: oxaloacetate
          evidence:
          - source_id: KEGG:R13076
            statement: Unclear reaction assigned to FdeJ.
          - source_id: file:HERSS/Hsero_1012/Hsero_1012-ai-review.yaml
            statement: The gene review leaves the molecular function unresolved and removes the submitter UDP-glucose 4-epimerase activity.
        role_description: >-
          KEGG assigns FdeJ to the oxaloacetate-releasing R13076 step, but no
          FdeJ-family protein has been characterized for this reaction and the
          epimerase/dehydratase fold does not establish carbon-carbon hydrolase
          chemistry. No molecular-function term is asserted.
  - order: 4
    role: delta-lactone ring opening
    node:
      id: r13077_lactone_hydrolysis
      label: flavonoid-derived delta-lactone hydrolysis
      module_type: REACTION
      annotons:
      - id: fdeb_ester_hydrolase
        label: FdeB lactone hydrolase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeB flavonoid-derived lactone hydrolase family
            representative_members:
            - preferred_term: Hsero_1004 (HERSS)
              term:
                id: UniProtKB:D8J0W6
                label: Peptidase S9 prolyl oligopeptidase catalytic domain-containing protein
            - preferred_term: PP_3195 (PSEPK)
              term:
                id: UniProtKB:Q88I07
                label: Peptidase S9 prolyl oligopeptidase catalytic domain-containing protein
            term:
              id: PANTHER:PTHR22946
              label: DIENELACTONE HYDROLASE DOMAIN-CONTAINING PROTEIN-RELATED
        function:
          preferred_term: flavonoid-derived delta-lactone hydrolase activity
          term:
            id: GO:0052689
            label: carboxylic ester hydrolase activity
          substrates:
          - preferred_term: 5-(4-hydroxyphenyl)-3-oxovalero-delta-lactone
          - preferred_term: water
          products:
          - preferred_term: 5-hydroxy-5-(4-hydroxyphenyl)-3-oxopentanoate
          evidence:
          - source_id: KEGG:R13077
            statement: Predicted hydrolytic opening of the delta-lactone.
          - source_id: file:PSEPK/PP_3195/PP_3195-ai-review.yaml
            statement: The gene review supports broad carboxylic ester hydrolase activity.
        role_description: The exact R13077 lactone substrate remains untested for FdeB-family proteins.
  - order: 5
    role: beta-keto acid decarboxylation
    node:
      id: r13078_decarboxylation
      label: flavonoid-derived beta-keto acid decarboxylation
      module_type: REACTION
      annotons:
      - id: fdei_decarboxylase
        label: FdeI predicted decarboxylation
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeI late flavonoid-degradation enzyme family
            representative_members:
            - preferred_term: Hsero_1011 (HERSS)
              term:
                id: UniProtKB:D8J0X3
                label: Fumarylacetoacetate hydrolase family protein
            - preferred_term: PP_3205 (PSEPK)
              term:
                id: UniProtKB:Q88HZ7
                label: Fumarylacetoacetate hydrolase family protein
            term:
              id: PANTHER:PTHR43211
              label: FUMARYLACETOACETATE HYDROLASE
        function:
          preferred_term: predicted flavonoid-derived beta-keto acid decarboxylation (no GO molecular function term asserted)
          description: >-
            KEGG R13078 removes CO2 from the flavonoid-derived beta-keto acid
            and assigns the step to FdeI, but KEGG marks the reaction as
            unclear and no FdeI-family protein has been assayed. The FAH fold
            supports hydrolases, decarboxylases, isomerases and hydratases, so
            no carboxy-lyase GO term is asserted, matching FdeH and FdeJ.
          substrates:
          - preferred_term: 5-hydroxy-5-(4-hydroxyphenyl)-3-oxopentanoate
          products:
          - preferred_term: 4-hydroxy-4-(4-hydroxyphenyl)-butan-2-one
          - preferred_term: carbon dioxide
          evidence:
          - source_id: KEGG:R13078
            statement: Predicted decarboxylation assigned to FdeI.
          - source_id: file:PSEPK/PP_3205/PP_3205-ai-review.yaml
            statement: The gene review accepts only broad catalytic activity and carries the decarboxylase prediction as a knowledge gap.
          - source_id: file:HERSS/Hsero_1011/Hsero_1011-ai-review.yaml
            statement: The gene review asserts no reaction-specific molecular function.
        role_description: >-
          FdeI is the predicted decarboxylase for R13078 (KEGG K26185), but no
          direct FdeI-family assay has established the reaction or any
          reaction class.
  - order: 6
    role: water elimination
    node:
      id: r13079_dehydration
      label: hydroxyketone to 4-hydroxycinnamoylmethane
      module_type: REACTION
      annotons:
      - id: fdei_dehydration_role
        label: unresolved FdeI-associated dehydration
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FdeI late flavonoid-degradation enzyme family
            representative_members:
            - preferred_term: Hsero_1011 (HERSS)
              term:
                id: UniProtKB:D8J0X3
                label: Fumarylacetoacetate hydrolase family protein
            - preferred_term: PP_3205 (PSEPK)
              term:
                id: UniProtKB:Q88HZ7
                label: Fumarylacetoacetate hydrolase family protein
            term:
              id: PANTHER:PTHR43211
              label: FUMARYLACETOACETATE HYDROLASE
        function:
          preferred_term: predicted hydroxyketone dehydration (no GO molecular function term asserted)
          description: >-
            KEGG R13079 eliminates water from
            4-hydroxy-4-(4-hydroxyphenyl)-butan-2-one; whether FdeI, another
            protein, or no enzyme performs it is unknown, so no hydro-lyase term
            is asserted.
          substrates:
          - preferred_term: 4-hydroxy-4-(4-hydroxyphenyl)-butan-2-one
          products:
          - preferred_term: 4-hydroxycinnamoylmethane
          - preferred_term: water
          evidence:
          - source_id: KEGG:R13079
            statement: Unclear reaction assigned to FdeI.
        role_description: >-
          KEGG assigns R13079 to FdeI, but available evidence does not establish
          whether PP_3205 catalyzes water elimination or whether this conversion
          is spontaneous or performed by another factor. No MF term is asserted.
  connections:
  - source: r13074_naringenin_hydroxylation
    target: r13075_a_ring_cleavage
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: The R13074 product is the R13075 substrate in KEGG map00946.
  - source: r13075_a_ring_cleavage
    target: r13076_c_c_hydrolysis
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: The R13075 product C22569 is the R13076 substrate.
  - source: r13076_c_c_hydrolysis
    target: r13077_lactone_hydrolysis
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: R13076 produces the delta-lactone consumed by R13077.
  - source: r13077_lactone_hydrolysis
    target: r13078_decarboxylation
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: R13077 produces the beta-keto acid consumed by R13078.
  - source: r13078_decarboxylation
    target: r13079_dehydration
    connection_type: PRECEDES
    chaining_status: VERIFIED
    chaining_note: R13078 produces the hydroxyketone consumed by R13079.
  knowledge_gaps:
  - gap_statement: >-
      The biochemical roles of FdeD and FdeH and the exact R13076-R13079
      reactions remain unverified experimentally.
    gap_kind: [BIOLOGY]
    status: OPEN
    significance: >-
      The pathway order is useful for satisfiability analysis, but predicted
      leaves must not be treated as experimentally established enzyme functions.
    resolution: >-
      Reconstitute each reaction with purified proteins, test component
      dependence, identify products by isotope-resolved LC-MS, determine which
      proteins are catalytic versus redox or structural partners, and test
      whether FdeI catalyzes both R13078 and R13079.
    provenance:
    - reference_id: PMID:27059806
      supporting_text: After meta-cleavage of the A-ring, the subsequent metabolic steps generate oxaloacetic acid
