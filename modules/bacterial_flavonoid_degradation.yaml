id: MODULE:bacterial_flavonoid_degradation
title: Bacterial naringenin A-ring degradation
description: The Fde-associated oxidative route in Pseudomonadota begins with naringenin hydroxylation
  and oxygenolytic A-ring cleavage. Herbaspirillum seropedicae SmR1 supplies FdeE/FdeC mutant and metabolite
  evidence, and purified FdeE establishes NADPH-dependent hydroxylation. Related loci and whole-cell phenotypes
  extend the comparison across alpha-, beta- and gammaproteobacteria. Six chemical steps retain the proposed
  KEGG R13074-R13079 sequence, with unverified late enzyme assignments explicitly separated from demonstrated
  entry chemistry. FdeD and FdeH are associated proteins whose reaction position and physiological necessity
  remain unresolved. Pseudomonas putida KT2440 and Bradyrhizobium diazoefficiens USDA110 provide sequence-grounded
  comparisons, not demonstrated complete pathway reconstructions.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:27059806
  title: Genetic and functional characterization of a novel meta-pathway for degradation of naringenin
    in Herbaspirillum seropedicae SmR1
  statement: Mutant and LC-MS/MS evidence establishes FdeE-dependent naringenin monooxygenation and FdeC-dependent
    A-ring dioxygenation in H. seropedicae.
- source_id: PMID:39107441
  title: Novel enzymatic route to the synthesis of C-8 hydroxyflavonoids including flavonols and isoflavones
  statement: Purified Hsero_1007 (HERSS) is an NADPH-dependent FAD monooxygenase that hydroxylates naringenin
    and other flavonoids at C-8.
- source_id: PMID:23125118
  title: Naringenin degradation by the endophytic diazotroph Herbaspirillum seropedicae SmR1
  statement: The fde operon is induced by naringenin and chrysin, and fdeA and fdeR mutants cannot degrade
    naringenin.
- source_id: KEGG:map00946
  title: Degradation of flavonoids
  statement: KEGG supplies the R13074-R13079 reaction chain and K26179-K26185 Fde role assignments; the
    individual reaction records mark the chemistry as unclear.
- source_id: file:HERSS/Hsero_1007/Hsero_1007-ai-review.yaml
  title: Herbaspirillum seropedicae Hsero_1007 FdeE gene review
  statement: The review grounds the FdeE leaf to D8J0W9, GO:0016709 and flavonoid catabolic process, from
    mutant and purified-enzyme evidence.
- source_id: file:HERSS/Hsero_1005/Hsero_1005-ai-review.yaml
  title: Herbaspirillum seropedicae Hsero_1005 FdeC gene review
  statement: The review grounds the FdeC leaf to D8J0W7 and GO:0016702 from the fdeC mutant phenotype
    and removes the submitter glyoxalase II activity.
- source_id: file:HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
  title: KEGG orthology and reaction assignments for the H. seropedicae fde locus
  statement: Live KEGG queries map Hsero_1004-Hsero_1012 to the Fde orthology groups K26179-K26185, list
    the R13074-R13079 reactions, and count the genomes carrying each Fde ortholog.
- source_id: file:PSEPK/PP_3197/PP_3197-ai-review.yaml
  title: Pseudomonas putida PP_3197 FdeC-like gene review
  statement: The review grounds the FdeC leaf to Q88I05, GO:0016702, and orthology to the experimentally
    tested Hsero_1005 protein.
- source_id: file:PSEPK/PP_3199/PP_3199-ai-review.yaml
  title: Pseudomonas putida PP_3199 FdeE-like gene review
  statement: The review grounds the FdeE leaf to Q88I03 and a conservative monooxygenase molecular-function
    term.
- source_id: file:PSEPK/PP_3195/PP_3195-ai-review.yaml
  title: Pseudomonas putida PP_3195 FdeB-like gene review
  statement: The review grounds the predicted FdeB ester-hydrolase role to Q88I07.
- source_id: file:PSEPK/PP_3206/PP_3206-ai-review.yaml
  title: Pseudomonas putida PP_3206 FdeJ-like gene review
  statement: The review supports Q88HZ6 as an FdeJ-like pathway component while leaving its molecular
    function and the proposed R13076 chemistry unresolved.
- source_id: file:PSEPK/PP_3204/PP_3204-ai-review.yaml
  title: Pseudomonas putida PP_3204 FdeH-like gene review
  statement: The review supports FdeH pathway participation but leaves its molecular function unresolved.
- source_id: file:PSEPK/PP_3205/PP_3205-ai-review.yaml
  title: Pseudomonas putida PP_3205 FdeI-like gene review
  statement: The review accepts only broad catalytic activity for FdeI and carries the predicted R13078
    decarboxylation and R13079 dehydration as an open knowledge gap.
- source_id: PMID:31265361
  title: The Modification of the Flavonoid Naringenin by Bradyrhizobium sp. Strain ORS285 Changes the
    nod Genes Inducer Function to a Growth Stimulator.
  statement: ORS285 whole-fde deletion removes the reported flavonoid-degradation phenotype, while naringenin-dependent
    growth persists. This extends locus-level support to an alphaproteobacterium without assigning every
    downstream reaction.
- source_id: file:analysis/module_audits/bacterial_flavonoid_degradation/taxonomy-snapshot.json
  statement: 'Dated KO census: 50 genomes coassign all seven groups, spanning 29 beta-, 16 gamma- and
    five alphaproteobacteria; coassignment is not biochemical validation.'
- source_id: PMID:17014487
  title: Perception and modification of plant flavonoid signals by rhizosphere microorganisms.
  statement: The review proposes that flavonoids shape rhizosphere communities through carbon availability
    and toxicity; this is ecological context for catabolism.
- source_id: PMID:26963713
  title: Bacterial species involved in the conversion of dietary flavonoids in the human gut.
  statement: The review organizes intestinal flavonoid conversion by species, strains and enzymes; it
    is comparative background rather than an assay of Fde proteins.
- source_id: PMID:37718389
  title: Microbial degradation of plant toxins.
  statement: The review surveys genes and enzymes of plant-toxin breakdown; its broad ecological coverage
    does not establish a particular Fde reaction.
notes: 'Scope is Pseudomonadota (NCBITaxon:1224), based on the experimentally studied Herbaspirillum route,
  independent ORS285 locus evidence, and a dated census spanning alpha-, beta- and gammaproteobacteria.
  All seven KO groups co-occur in 50 sampled genomes of this phylum; two Actinomycetota carry individual
  FdeE assignments. This bounds the present model without asserting universal absence elsewhere. KEGG
  coassignment and broad PANTHER hits alone do not establish pathway capacity. The 21 reviewed representative
  proteins span three classes; only HERSS has the step-specific assays used here. H. rubrisubalbicans
  M1 provides an additional phenotype but lacks a resolved UniProt mapping for its FdeE, so no other strain
  is substituted. PP_3199 retains sequence-based FdeE support although current KEGG gene and link queries
  no longer assign K26180; historical analysis is preserved. Family identifiers describe broader evolutionary
  groups, not substrate-specific Fde clades. The FdeC group has no common verified family identifier across
  its exemplars: BRADU Q89GB8 maps to PTHR21366:SF14, while HERSS lacks a PANTHER assignment. Keep that
  group as a sequence-grounded free-text family rather than applying the BRADU identifier to every member.
  FdeA insertion in the 2013 study was probably polar and did not establish autonomous FdeA chemistry.
  FdeG was mutated in the 2016 study, but its outcome is not accessible in the abstract; exclusion from
  assigned reaction steps is not evidence of dispensability. Optional FdeD/FdeH context parts encode unresolved
  dependence, not experimentally demonstrated deletion tolerance. The six-step chemical chain remains
  a hypothesis beyond the demonstrated entry; neither model satisfaction nor family membership establishes
  native flux. See the module notes and audit evidence for source access and assay boundaries.'
