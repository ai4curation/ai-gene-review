  notes: >-
    GENERALIZE (YeastPathways project, 2026-10): the human-grounded module was extended to fungi without changing
    its human leaves. Each step gained S. cerevisiae and S. pombe exemplars in the existing PANTHER families
    (CKI1/EKI1 and S. pombe eki1 in PTHR22603; PCT1 and pcy1 in PTHR10739; ECT1 and ect1 in PTHR45780; CPT1/EPT1
    and ept1 in PTHR10414), and the two YeastPathways models and the PomBase phospholipid model were linked. Fungal
    specificities overlap: CKI1 and EKI1 each phosphorylate both choline and ethanolamine and together account for
    all kinase activity (PMID:10329685), so both are listed for both kinase steps; EPT1 uses CDP-choline as well as
    CDP-ethanolamine (PMID:1847919, PMID:2848840) and is listed on both phosphotransferase steps; S. pombe has a
    single kinase (SPAC13G7.12c) and a single CDP-alcohol phosphotransferase (SPAC22A12.10). Fungal PCT1 and ECT1
    associate with the nuclear/ER membrane rather than being soluble (PMID:22345606); the annoton locations remain
    those of the human enzymes. The PE methylation crosslink is kept as the animal PEMT step; the fungal CHO2/OPI3
    route is in cdp_dag_phospholipid_synthesis. YeastCyc corrections: EKI1 (choline kinase) and EPT1
    (cholinephosphotransferase) are missing from PWY3O-450, and CKI1 (ethanolamine kinase) from PWY3O-259. GO-CAM
    disagreements: both YeastPathways models place all activities in cytosol, including the membrane-bound CPT1
    and EPT1; PWY3O-259 uses the broad process GO:0046474 rather than GO:0006646. The ethanolamine-phosphate
    supply from sphingoid-base phosphate lyase (DPL1) and choline/ethanolamine import (HNM1) are upstream context.
    Previous curation notes follow.
    Kennedy pathway de-novo glycerophospholipid synthesis (GO:0006656 PC + GO:0006646 PE), grounded to
    eleven completed human gene reviews. CDP-CHOLINE branch -> PC: CHKA (P35790) + CHKB (Q9Y259) share
    PTHR22603, GO:0004103 (also ethanolamine kinase GO:0004305) -> PCYT1A (P49585) + PCYT1B (Q9Y5K3) share
    PTHR10739, GO:0004105 (rate-limiting, amphitropic; PCYT1A membrane-PC-sensing, shuttles nucleus<->ER) ->
    CHPT1 (Q8WUD6) + CEPT1 (Q9Y6K0) share PTHR10414, GO:0004142. CDP-ETHANOLAMINE branch -> PE: ETNK1 (Q9HBU6)
    + ETNK2 (Q9NVF9) share PTHR22603, GO:0004305 -> PCYT2 (Q99447 PTHR45780, GO:0004306, rate-controlling) ->
    SELENOI/EPT1 (Q9C0D9, a selenoprotein, + ether-PE) + CEPT1 share PTHR10414, GO:0004307. CROSSLINK: PEMT
    (Q9UBM1 PTHR15458, GO:0004608) methylates PE->PC 3x with SAM (only choline-independent PC route; NAFLD).
    CEPT1 is dual-specificity (appears in both phosphotransferase nodes). All 11 kinases/transferases require
    Mg2+/Mn2+; the DAG acceptor and CMP byproduct link to glycerolipid metabolism. GO term ids/labels verified
    against the local go.db. Disorders: PCYT1A lipodystrophy / SMD-CRD; CHKB megaconial muscular dystrophy;
    PCYT2 and SELENOI hereditary spastic paraplegia.
