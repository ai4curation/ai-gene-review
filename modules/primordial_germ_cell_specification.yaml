id: MODULE:primordial_germ_cell_specification
title: Primordial germ cell specification module
description: >-
  The early-metazoan program that sets aside the primordial germ cells (PGCs) -
  the lineage that will form the gametes - from the soma. Two evolutionarily
  alternative strategies achieve this and are modelled as a variant set along
  the "specification mode" axis: (1) preformation, in which maternally
  inherited germ plasm (a specialised cytoplasm rich in germline determinants
  such as Vasa/DDX4, Nanos, and Piwi-clade proteins) autonomously specifies PGCs
  in flies, worms, fish, and frogs; and (2) induction, in which BMP signalling
  from extraembryonic tissue instructs competent epiblast cells to become PGCs
  via the PRDM1/PRDM14/TFAP2C tripartite network, as in mouse and (inferred)
  human. Both routes converge on a conserved germline ground state:
  transcriptional quiescence of the somatic program, retention of pluripotency
  potential, and protection of the genome by piRNA-guided transposon silencing.
  Grounded in GO:0007281 (germ cell development) with the germ plasm component
  GO:0060293. See modules/bmp_signaling.yaml for the inductive signal.
status: DRAFT
evidence:
  - source_id: GO:0007281
    title: germ cell development
    statement: The module is grounded in the GO term for germ cell development.
  - source_id: GO:0060293
    title: germ plasm
    statement: The preformation variant is grounded in the germ plasm cellular-component term.
  - source_id: file:human/PIWIL1/PIWIL1-ai-review.yaml
    title: PIWIL1 gene review
    statement: PIWIL1 is used as a piRNA-pathway/germline exemplar; its function is reviewed in-repo.
notes: >-
  Exemplar gene products are curated human UniProt accessions orienting each
  conserved germline role. The preformation determinants (Vasa/DDX4, Nanos,
  Piwi) are ancient and broadly conserved even where the specification mode
  differs; the inductive network (PRDM1/PRDM14/TFAP2C) is the mammalian route.
  The piRNA/transposon-silencing arm is shared by both modes and modelled as a
  common part. Exemplar roles were cross-checked against curated GOA (QuickGO):
  DDX4, NANOS3, and PIWIL1 carry human germline/piRNA annotations, whereas the
  inductive network PRDM1/PRDM14/TFAP2C is supported for the PGC role chiefly by
  mouse orthologs (human GOA has cell fate commitment, inner cell mass and gonad
  terms, but not germ cell development on these three) - the mammalian PGC role
  is well established from Blimp1/Prdm14/Tfap2c knockouts.

  C. elegans germ plasm roles. Two preformation annotons are grounded in
  reviewed worm proteins. PIE-1 (UniProtKB:Q94131) has two genetically
  separable core functions in its gene review, so it appears twice: as the
  nuclear repressor of RNA polymerase II transcription in P2-P4, and with POS-1
  (UniProtKB:G5EF15) as a 3'-UTR-binding activator of nos-2 (Nanos)
  translation. Both annotons use family descriptors with no PANTHER id,
  because the roles are filled by unrelated proteins in other lineages (Pgc
  for transcriptional silencing in Drosophila). PIE-1 and POS-1 both belong to
  the TIS11 CCCH family PTHR12547, but that family as a whole includes the
  mRNA-decay factors TTP/ZFP36 and is not a germline family, so it is not
  asserted. The silencer annoton has no molecular function: the pie-1 review
  records cyclin binding (P-TEFb inhibition) only as a non-core refinement,
  and the Ser5 block that repression needs has no known activity. Out of
  scope here: the repressive POS-1 targets glp-1, zif-1 and neg-1 (embryonic
  patterning and protection of germline proteins from ZIF-1 degradation), the
  P granule association of PIE-1 and POS-1 (they are cargo, not assembly or
  segregation factors, so they are not in
  c_elegans_p_granule_assembly_segregation), OMA-1/OMA-2, which repress
  transcription in P0 and P1 by sequestering TAF-4 (PMID:18854162) and have no
  gene reviews, and MES-1/SRC-1 orientation of the unequal P2 and P3
  divisions that deliver germ plasm to P4, modelled in
  c_elegans_p2_ems_contact_signaling.
module:
  id: primordial_germ_cell_specification
  label: Primordial germ cell specification
  module_type: DEVELOPMENTAL_PROCESS
  concepts:
    - preferred_term: germ cell development
      term:
        id: GO:0007281
        label: germ cell development
      description: Setting aside and specifying the primordial germ cell lineage from the soma.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        description: Germline segregation is universal in animals, achieved by preformation or induction depending on clade.
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: germline determination
      node:
        id: pgc_determination
        label: Primordial germ cell determination
        module_type: DEVELOPMENTAL_PROCESS
        description: >-
          The choice of which cells become PGCs, achieved by one of two
          alternative conserved strategies.
        variant_sets:
          - id: specification_mode
            label: Modes of germ cell specification
            axis: specification mode
            selection: EXACTLY_ONE
            variants:
              - id: preformation
                label: Preformation via inherited germ plasm
                module_type: DEVELOPMENTAL_PROCESS
                description: >-
                  Maternally deposited germ plasm containing germline
                  determinants (Vasa/DDX4, Nanos, Bucky ball/Oskar-organised RNP
                  granules) is asymmetrically inherited and autonomously specifies
                  PGCs (Drosophila, C. elegans, zebrafish, Xenopus). Proteins
                  inherited with the germ plasm also hold the germline precursors
                  transcriptionally quiescent and allow nanos mRNA to be
                  translated only in the germline.
                concepts:
                  - preferred_term: germ plasm
                    term:
                      id: GO:0060293
                      label: germ plasm
                annotons:
                  - id: germ_plasm_vasa
                    label: Vasa/DDX4 germ plasm RNA helicase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DDX4 (Vasa)
                        term:
                          id: UniProtKB:Q9NQI0
                          label: Probable ATP-dependent RNA helicase DDX4
                        description: >-
                          DEAD-box RNA helicase; a canonical, broadly conserved
                          germ plasm/germ granule marker and translational regulator.
                    function:
                      preferred_term: germ-granule RNA helicase / mRNA binding
                      term:
                        id: GO:0003729
                        label: mRNA binding
                      targets:
                        - preferred_term: germline mRNAs in germ granules
                    processes:
                      - preferred_term: germ cell development
                        term:
                          id: GO:0007281
                          label: germ cell development
                    locations:
                      - preferred_term: germ plasm
                        term:
                          id: GO:0060293
                          label: germ plasm
                    role_description: Core germ plasm determinant organising germline mRNP granules.
                    evidence:
                      - source_id: PMID:10811828
                        title: "Zebrafish vasa RNA but not its protein is a component of the germ plasm and segregates asymmetrically before germline specification"
                        statement: "The vasa gene product is essential for germline specification and marks germ plasm."
                        supporting_text: "the vasa gene product is essential for germline specification"
                  - id: germ_plasm_nanos
                    label: Nanos translational repressor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NANOS3
                        term:
                          id: UniProtKB:P60323
                          label: Nanos homolog 3
                        description: >-
                          Zinc-finger translational repressor; conserved germline
                          determinant that represses somatic mRNAs in PGCs.
                    function:
                      preferred_term: sequence-specific mRNA binding / translational repression
                      term:
                        id: GO:0003729
                        label: mRNA binding
                      targets:
                        - preferred_term: somatic-program mRNAs in nascent PGCs
                    processes:
                      - preferred_term: germ cell development
                        term:
                          id: GO:0007281
                          label: germ cell development
                    locations:
                      - preferred_term: germ plasm
                        term:
                          id: GO:0060293
                          label: germ plasm
                    role_description: Represses somatic translation to protect germline identity.
                    evidence:
                      - source_id: PMID:11691838
                        title: "A zebrafish nanos-related gene is essential for the development of primordial germ cells"
                        statement: "Nanos is a germ-plasm-localised factor essential for primordial germ cell development."
                        supporting_text: "a nanos-like (nanos1) gene, which is expressed in the germ plasm and in the PGCs of the zebrafish"
                  - id: germ_plasm_nanos_translation_activator
                    label: Germ plasm activator of nanos mRNA translation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: germ plasm 3'-UTR-binding activators of germline mRNA translation
                        description: >-
                          A role, not a homology group. These germ plasm
                          RNA-binding proteins act on the 3' UTRs of maternal
                          mRNAs so that they are translated in the germline
                          precursors, which restricts Nanos protein to the
                          primordial germ cells. Different lineages use
                          different proteins. In C. elegans the CCCH tandem
                          zinc finger proteins POS-1 and PIE-1 promote
                          translation of nos-2 (Nanos). POS-1 binds nos-2 RNA in
                          vitro and competes with the repressor SPN-4 for it in
                          P4. PIE-1 binds the mom-2 3' UTR in vitro, but its
                          direct binding to nos-2 has not been shown.
                        representative_members:
                          - preferred_term: POS-1 (C. elegans)
                            term:
                              id: UniProtKB:G5EF15
                              label: RNA-binding protein pos-1
                          - preferred_term: PIE-1 (C. elegans)
                            term:
                              id: UniProtKB:Q94131
                              label: Pharynx and intestine in excess protein 1
                    function:
                      preferred_term: mRNA 3'-UTR binding
                      term:
                        id: GO:0003730
                        label: mRNA 3'-UTR binding
                      targets:
                        - preferred_term: nanos mRNA (nos-2 in C. elegans)
                    processes:
                      - preferred_term: positive regulation of translation
                        term:
                          id: GO:0045727
                          label: positive regulation of translation
                    locations:
                      - preferred_term: germ plasm
                        term:
                          id: GO:0060293
                          label: germ plasm
                    role_description: >-
                      Lets nanos mRNA be translated in the germline precursors,
                      against the translational repression that keeps it silent in
                      oocytes and early blastomeres.
                    evidence:
                      - source_id: PMID:16499902
                        title: "Translational repression restricts expression of the C. elegans Nanos homolog NOS-2 to the embryonic germline."
                        statement: POS-1, a germ plasm component, activates nos-2 translation in the primordial germ cells.
                        supporting_text: "Finally, the germ plasm component POS-1 activates nos-2 translation in the PGCs."
                      - source_id: PMID:16499902
                        title: "Translational repression restricts expression of the C. elegans Nanos homolog NOS-2 to the embryonic germline."
                        statement: Activation of nanos translation by germ plasm is also implicated in flies and fish, so the role is not worm-specific.
                        supporting_text: "A combination of translational repression, RNA degradation, and activation by germ plasm has also been implicated in the regulation of nanos homologs in Drosophila and zebrafish"
                      - source_id: PMID:18417623
                        title: "Multiple maternal proteins coordinate to restrict the translation of C. elegans nanos-2 to primordial germ cells."
                        statement: POS-1 rises relative to SPN-4 in P4 and competes with SPN-4 for nos-2 RNA in vitro.
                        supporting_text: "The POS-1:SPN-4 ratio in P(4) increases significantly over its precursor, P(3); and POS-1 competes with SPN-4 for binding to nos-2 RNA in vitro."
                      - source_id: PMID:11316796
                        title: "PIE-1 is a bifunctional protein that regulates maternal and zygotic gene expression in the embryonic germ line of Caenorhabditis elegans."
                        statement: PIE-1 is needed for NOS-2 expression, through its second zinc finger and separately from transcriptional repression.
                        supporting_text: "A mutation in PIE-1's second CCCH finger reduces NOS-2 expression without affecting transcriptional repression"
                      - source_id: file:worm/pos-1/pos-1-ai-review.yaml
                        title: pos-1 gene review
                        statement: >-
                          The pos-1 review has two core functions. One is mRNA
                          3'-UTR binding with positive regulation of translation
                          (nos-2, apx-1, mom-2) in germline blastomeres, the role
                          modelled here. The other is translational repression of
                          glp-1, zif-1 and neg-1.
                      - source_id: file:worm/pie-1/pie-1-ai-review.yaml
                        title: pie-1 gene review
                        statement: >-
                          The pie-1 review gives mRNA 3'-UTR binding with positive
                          regulation of translation (mom-2, nos-2) as one of two
                          core functions, genetically separable from
                          transcriptional repression.
                  - id: germ_plasm_transcriptional_silencer
                    label: Germline repressor of RNA polymerase II transcription
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: germline-inherited global repressors of RNA polymerase II transcription
                        description: >-
                          A role, not a homology group. Maternal proteins
                          segregated to the germline precursors keep them
                          transcriptionally quiescent, so that the somatic
                          program cannot start there. Unrelated proteins fill
                          the role: the CCCH tandem zinc finger protein PIE-1 in
                          the C. elegans P2-P4 blastomeres, and the small Pgc
                          (polar granule component) protein in Drosophila pole
                          cells. Both block phosphorylation of Ser2 of the RNA
                          polymerase II CTD by inhibiting P-TEFb. PIE-1 also
                          blocks Ser5 phosphorylation by a second, uncharacterised
                          mechanism, and that second block is the one essential
                          for repression and germline specification.
                        representative_members:
                          - preferred_term: PIE-1 (C. elegans)
                            term:
                              id: UniProtKB:Q94131
                              label: Pharynx and intestine in excess protein 1
                    processes:
                      - preferred_term: negative regulation of transcription by RNA polymerase II
                        term:
                          id: GO:0000122
                          label: negative regulation of transcription by RNA polymerase II
                      - preferred_term: cell fate determination
                        term:
                          id: GO:0001709
                          label: cell fate determination
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Blocks new transcription in the germline precursors, so that
                      somatic determinants inherited with the cytoplasm (SKN-1 in
                      C. elegans) cannot switch on somatic programs there. No
                      molecular function is asserted, because the mechanism
                      essential for PIE-1 repression is not known.
                    evidence:
                      - source_id: PMID:8751441
                        title: "Repression of gene expression in the embryonic germ lineage of C. elegans."
                        statement: PIE-1 is needed for the absence of new transcripts in germline blastomeres and represses transcription when expressed in somatic blastomeres.
                        supporting_text: "Furthermore, ectopic expression of PIE-1 in somatic blastomeres can significantly reduce the accumulation of new transcripts in these cells."
                      - source_id: PMID:18202370
                        title: "Inhibition of transcription by the Caenorhabditis elegans germline protein PIE-1: genetic evidence for distinct mechanisms targeting initiation and elongation."
                        statement: P-TEFb inhibition through YAPMAPT blocks Ser2 phosphorylation, but a second mechanism blocking Ser5 phosphorylation is the essential one.
                        supporting_text: "We find that sequences outside of the YAPMAPT are required to inhibit serine 5 phosphorylation, and that this second inhibitory mechanism is essential for transcriptional repression and specification of the germ lineage."
                      - source_id: PMID:18200011
                        title: "Drosophila Pgc protein inhibits P-TEFb recruitment to chromatin in primordial germ cells."
                        statement: >-
                          Drosophila Pgc represses CTD Ser2 phosphorylation in
                          pole cells by inhibiting P-TEFb, so P-TEFb inhibition
                          during germ cell specification is shared by flies and
                          worms through unrelated proteins.
                        supporting_text: "Thus, inhibition of P-TEFb is probably a common mechanism during germ cell specification in the disparate organisms C. elegans and Drosophila."
                      - source_id: file:worm/pie-1/pie-1-ai-review.yaml
                        title: pie-1 gene review
                        statement: >-
                          The pie-1 review takes negative regulation of
                          transcription by RNA polymerase II and cell fate
                          determination in the nucleus as its first core function
                          and asserts no molecular function for it.
                connections:
                  - source: germ_plasm_nanos_translation_activator
                    target: germ_plasm_nanos
                    connection_type: POSITIVELY_REGULATES
                    description: >-
                      Germ plasm RNA-binding proteins let nanos mRNA be translated
                      in the germline precursors (POS-1, with PIE-1, on nos-2 in C.
                      elegans).
              - id: induction
                label: Inductive specification via BMP signalling
                module_type: DEVELOPMENTAL_PROCESS
                description: >-
                  BMP4 from extraembryonic ectoderm induces competent epiblast
                  cells to activate the PRDM1(BLIMP1)/PRDM14/TFAP2C network, which
                  represses the somatic (mesodermal) program and re-establishes
                  the germline/pluripotency ground state (mouse; inferred human).
                concepts:
                  - preferred_term: germ cell development
                    term:
                      id: GO:0007281
                      label: germ cell development
                annotons:
                  - id: pgc_inductive_signal
                    label: BMP4 germ-cell-inducing signal
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: BMP2/4 subfamily (TGF-beta family)
                        term:
                          id: PANTHER:PTHR11848
                          label: TGF-BETA FAMILY
                        description: >-
                          BMP2/4-class ligands within the TGF-beta family;
                          extraembryonic BMP4 is the inductive signal specifying
                          PGC fate in mammals.
                        representative_members:
                          - preferred_term: BMP4
                            term:
                              id: UniProtKB:P12644
                              label: Bone morphogenetic protein 4
                        ancestral_nodes:
                          - preferred_term: PAINT BMP-signaling node PTN008983382
                            term:
                              id: PANTHER:PTN008983382
                              label: PTN008983382
                            description: >-
                              PANTHER PAINT node in PTHR11848 with IBD support for
                              BMP signaling pathway participation (P:GO:0030509);
                              BMP4 (UniProtKB:P12644) is among its seed proteins.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN008983382 in PTHR11848.
                    function:
                      preferred_term: BMP morphogen activity
                      term:
                        id: GO:0016015
                        label: morphogen activity
                      targets:
                        - preferred_term: BMP receptor complex on competent epiblast
                    processes:
                      - preferred_term: BMP signaling pathway
                        term:
                          id: GO:0030509
                          label: BMP signaling pathway
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: Instructive extracellular cue initiating the germline program.
                    evidence:
                      - source_id: PMID:10049358
                        title: "Bmp4 is required for the generation of primordial germ cells in the mouse embryo"
                        statement: "BMP4 is required to induce primordial germ cells in the mouse embryo."
                        supporting_text: "Bmp4 homozygous null embryos contain no PGCs"
                  - id: pgc_tripartite_network
                    label: PRDM1/PRDM14/TFAP2C germline network
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: mammalian PGC specification transcription factors
                        description: >-
                          The tripartite transcriptional network that specifies
                          mammalian PGCs by repressing the somatic program and
                          restoring germline/pluripotency identity.
                        representative_members:
                          - preferred_term: PRDM1 (BLIMP1)
                            term:
                              id: UniProtKB:O75626
                              label: PR domain zinc finger protein 1
                          - preferred_term: PRDM14
                            term:
                              id: UniProtKB:Q9GZV8
                              label: PR domain zinc finger protein 14
                          - preferred_term: TFAP2C
                            term:
                              id: UniProtKB:Q92754
                              label: Transcription factor AP-2 gamma
                    function:
                      preferred_term: DNA-binding transcription factor activity
                      term:
                        id: GO:0000981
                        label: DNA-binding transcription factor activity, RNA polymerase II-specific
                    processes:
                      - preferred_term: germ cell development
                        term:
                          id: GO:0007281
                          label: germ cell development
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: Represses somatic fate and installs the germline/pluripotency transcriptional state.
                    evidence:
                      - source_id: PMID:23851488
                        title: "A tripartite transcription factor network regulates primordial germ cell specification in mice"
                        statement: "BLIMP1 with PRDM14 and AP2gamma (TFAP2C) forms the tripartite network specifying mouse PGCs."
                        supporting_text: "BLIMP1, the key regulator of primordial germ cell (PGC) specification, apparently acts together with PRDM14 and AP2gamma"
                connections:
                  - source: pgc_inductive_signal
                    target: pgc_tripartite_network
                    connection_type: POSITIVELY_REGULATES
                    description: BMP4 signalling activates the PRDM1/PRDM14/TFAP2C germline network.
    - order: 2
      role: germline genome protection
      node:
        id: pgc_genome_protection
        label: piRNA-guided transposon silencing in the germline
        module_type: DEVELOPMENTAL_PROCESS
        description: >-
          A germline-shared arm in which Piwi-clade proteins, guided by piRNAs,
          silence transposable elements to protect genome integrity in the cells
          that will transmit the genome - required regardless of specification mode.
        annotons:
          - id: piwi_transposon_silencing
            label: Piwi-clade piRNA effector
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PIWIL1
                term:
                  id: UniProtKB:Q96J94
                  label: Piwi-like protein 1
                description: >-
                  Piwi-clade Argonaute; piRNA-guided effector silencing
                  transposons in the germline (see file:human/PIWIL1/PIWIL1-ai-review.yaml).
            function:
              preferred_term: piRNA binding (piRNA-guided small-RNA binding effector)
              term:
                id: GO:0034584
                label: piRNA binding
              targets:
                - preferred_term: transposable-element transcripts
            processes:
              - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035194
                  label: regulatory ncRNA-mediated post-transcriptional gene silencing
              - preferred_term: germ cell development
                term:
                  id: GO:0007281
                  label: germ cell development
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Protects germline genome integrity via piRNA-guided transposon silencing.
            evidence:
              - source_id: PMID:25747396
                title: "PIWI-Interacting RNA: Its Biogenesis and Functions"
                statement: "PIWI proteins with piRNAs repress transposons and maintain germline genome integrity."
                supporting_text: "They associate with PIWI proteins, which constitute a germline-specific subclade of the Argonaute family, to form effector complexes known as piRNA-induced silencing complexes, which repress transposons via transcriptional or posttranscriptional mechanisms and maintain germline genome integrity"
  connections:
    - source: pgc_determination
      target: pgc_genome_protection
      connection_type: PRECEDES
      description: Once the germline is specified, piRNA-guided genome protection safeguards the lineage.
