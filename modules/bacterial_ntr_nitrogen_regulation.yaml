id: MODULE:bacterial_ntr_nitrogen_regulation
title: Bacterial Ntr nitrogen-regulatory cascade and assimilation output
description: >-
  The bacterial nitrogen-regulatory (Ntr) system, which couples intracellular
  nitrogen status to the sigma-54-dependent nitrogen-scavenging regulon. The
  bifunctional uridylyltransferase/uridylyl-removing enzyme GlnD senses
  glutamine and sets the uridylylation state of the PII signal transduction
  proteins (GlnB, GlnK). PII proteins also bind 2-oxoglutarate, ATP and ADP,
  and in their unmodified state stimulate the phosphatase and inhibit the
  kinase activity of the sensor histidine kinase NtrB. NtrB phosphorylates the
  conserved receiver aspartate of NtrC, and phosphorylated NtrC uses its AAA+
  enhancer-binding module with the sigma-54 holoenzyme to open -24/-12
  promoters, inducing ammonium scavenging and ammonia assimilation. The module
  covers glutamine sensing, PII signal integration, His->Asp phosphotransfer,
  sigma-54-dependent activation, and the immediate assimilatory output.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the NtrB/NtrC two-component signalling relationship.
  - source_id: GO:0006808
    title: regulation of nitrogen utilization
    statement: >-
      Grounds the module as the regulatory program controlling nitrogen
      utilization under nitrogen limitation.
  - source_id: GO:0019676
    title: ammonia assimilation cycle
    statement: Defines the assimilatory output reaction catalysed by glutamine synthetase.
  - source_id: file:ECOLI/glnD/glnD-ai-review.yaml
    statement: >-
      Grounds the E. coli GlnD exemplar as the glutamine-sensing PII
      uridylyltransferase/uridylyl-removing enzyme.
  - source_id: file:ECOLI/glnB/glnB-ai-review.yaml
    statement: >-
      Grounds the E. coli GlnB exemplar as the PII protein that activates the
      NtrB phosphatase and inhibits its kinase.
  - source_id: file:ECOLI/glnK/glnK-ai-review.yaml
    statement: >-
      Grounds the E. coli GlnK exemplar as the PII paralog that blocks the AmtB
      ammonium channel when ammonium is plentiful.
  - source_id: file:ECOLI/glnL/glnL-ai-review.yaml
    statement: >-
      Grounds the E. coli NtrB (GlnL) exemplar as the bifunctional NtrC
      kinase/phosphatase.
  - source_id: file:ECOLI/glnG/glnG-ai-review.yaml
    statement: >-
      Grounds the E. coli NtrC (GlnG) exemplar as the NtrB response regulator
      and sigma-54-dependent activator of nitrogen-regulated promoters.
  - source_id: file:PSEPK/glnK/glnK-ai-review.yaml
    statement: >-
      Grounds the P. putida KT2440 GlnK exemplar, the single PII protein of that
      strain, and its modulation of the NtrB kinase/phosphatase balance.
  - source_id: file:PSEPK/ntrC/ntrC-ai-review.yaml
    statement: >-
      Grounds the P. putida KT2440 NtrC exemplar as the phosphorelay response
      regulator and as the sigma-54-dependent activator of glnK and further
      nitrogen-scavenging genes, with dual activator/repressor behaviour.
  - source_id: file:PSEPK/rpoN/rpoN-ai-review.yaml
    statement: >-
      Grounds the P. putida KT2440 sigma-54 exemplar whose holoenzyme is
      remodelled by enhancer-binding proteins such as NtrC.
  - source_id: file:PSEPK/amtB/amtB-ai-review.yaml
    statement: >-
      Grounds the P. putida KT2440 AmtB ammonium-transport exemplar, encoded in
      the glnK-amtB operon and induced through NtrC/sigma-54.
  - source_id: file:ECOLI/glnA/glnA-ai-review.yaml
    statement: >-
      Grounds the E. coli glutamine synthetase exemplar that assimilates
      ammonium and whose gene is NtrC-activated.
  - source_id: file:PSEPK/glnA/glnA-ai-review.yaml
    statement: >-
      Grounds the P. putida KT2440 glutamine synthetase exemplar.
notes: >-
  The Ntr cascade is conserved across proteobacteria. E. coli K-12, where
  GlnD, GlnB, GlnK, NtrB and NtrC were defined biochemically, supplies the
  canonical exemplars; Pseudomonas putida KT2440, whose single PII protein is
  GlnK, is a second exemplar, and sigma-54 is also exemplified by
  Nitratidesulfovibrio vulgaris RpoN (a deltaproteobacterial ortholog). The taxon
  context is kept at Bacteria because PII proteins, GlnD and NtrB/NtrC-type
  systems are found widely beyond proteobacteria, though partner sets vary.
  GlnD is now a member: it is the glutamine sensor whose uridylylation of PII
  is the first step of the cascade. Sigma-54 is included as the output partner
  of NtrC rather than as a member of the phosphorelay, since a single sigma-54
  serves many unrelated enhancer-binding proteins. The wider NtrC-dependent
  regulon (Nac, urease, nitrate and further nitrogen-source catabolism) and the
  GS-GOGAT cycle beyond glutamine synthetase are outside this boundary; that
  cycle is MODULE:bacterial_ammonia_assimilation. PII control of glutamine
  synthetase through the GlnE adenylyltransferase is also left out, as GlnE is
  not modelled here. PANTHER families of every member have family reviews
  (PTHR47320, PTHR30115, PTHR43065, PTHR32071, PTHR32248, PTHR43029,
  PTHR43407); members are grounded on the subfamily that carries the role,
  because the whole families are broader: PTHR43065 and PTHR32071 hold many
  unrelated two-component sensors and enhancer-binding proteins, and NtrB
  regulation is not expected of archaeal PII (PTHR30115:SF13), so the PII role
  is given separately for GlnB (SF11) and GlnK (SF20). The NtrB/NtrC relay is
  a simple two-component system with no histidine-phosphotransfer tier; it
  declares conformance to MODULE:two_component_relay WITH_DEVIATIONS, as that
  template prescribes, and the resulting tier/topology advisories are expected.
module:
  id: bacterial_ntr_nitrogen_regulation
  label: Bacterial Ntr nitrogen-regulatory cascade
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: regulation of nitrogen utilization
      term:
        id: GO:0006808
        label: regulation of nitrogen utilization
      description: >-
        Signal-dependent control of the nitrogen-scavenging and assimilation
        regulon.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: GlnD glutamine sensing and PII uridylylation
      node:
        id: glnd_pii_uridylylation
        label: GlnD-mediated PII uridylylation
        module_type: REGULATORY_STEP
        description: >-
          GlnD senses glutamine through its ACT domains; at low glutamine it
          transfers UMP from UTP to the T-loop tyrosine of PII, and at high
          glutamine it removes the UMP, so the PII modification state reports
          nitrogen sufficiency.
        annotons:
          - id: glnd_uridylyltransferase
            label: GlnD PII uridylyltransferase/uridylyl-removing enzyme
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GlnD bifunctional uridylyltransferase family
                term:
                  id: PANTHER:PTHR47320:SF1
                  label: BIFUNCTIONAL URIDYLYLTRANSFERASE_URIDYLYL-REMOVING ENZYME
                representative_members:
                  - preferred_term: GlnD (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P27249
                      label: Bifunctional uridylyltransferase/uridylyl-removing enzyme
            function:
              preferred_term: '[protein-PII] uridylyltransferase activity'
              term:
                id: GO:0008773
                label: '[protein-PII] uridylyltransferase activity'
            processes:
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Uridylylates PII when glutamine is low and deuridylylates PII-UMP
              when glutamine is high.
    - order: 2
      role: PII-mediated nitrogen-status integration
      node:
        id: pii_nitrogen_status_sensing
        label: PII (GlnB/GlnK) nitrogen-status integration
        module_type: REGULATORY_STEP
        description: >-
          A cytoplasmic PII homotrimer binds 2-oxoglutarate, ATP and ADP and
          carries a reversible uridylylation mark on its T-loop, converting
          nitrogen and energy status into a partner-modulating signal that sets
          the kinase/phosphatase balance of NtrB.
        annotons:
          - id: glnb_pii_signal_integration
            label: GlnB PII signal transduction protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GlnB-type PII subfamily
                term:
                  id: PANTHER:PTHR30115:SF11
                  label: NITROGEN REGULATORY PROTEIN P-II HOMOLOG
                representative_members:
                  - preferred_term: GlnB (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A9Z1
                      label: Nitrogen regulatory protein P-II 1
            function:
              preferred_term: phosphatase activator activity
              term:
                id: GO:0019211
                label: phosphatase activator activity
            processes:
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Integrates effector-metabolite and uridylylation signals and
              shifts NtrB toward its phosphatase state when nitrogen is
              sufficient.
          - id: glnk_pii_signal_integration
            label: GlnK PII signal transduction protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GlnK-type PII subfamily
                term:
                  id: PANTHER:PTHR30115:SF20
                  label: NITROGEN REGULATORY PROTEIN GLNK
                representative_members:
                  - preferred_term: GlnK (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CE7
                      label: Nitrogen regulatory protein P-II GlnK
            function:
              preferred_term: phosphatase activator activity
              term:
                id: GO:0019211
                label: phosphatase activator activity
            processes:
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              In bacteria whose only PII protein is GlnK, as in the Pseudomonas
              putida representative, GlnK integrates effector-metabolite and
              uridylylation signals and shifts NtrB toward its phosphatase state
              when nitrogen is sufficient. Where GlnB is also present, as in
              E. coli, NtrB control falls mainly to GlnB, and whether GlnK
              regulates the NtrB phosphatase directly in vivo is unresolved;
              E. coli GlnK's established roles are AmtB gating and GlnE
              activation.
    - order: 3
      role: NtrB/NtrC His-Asp phosphorelay
      node:
        id: ntr_phosphorelay
        label: NtrB/NtrC phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The sensor histidine kinase NtrB autophosphorylates and transfers
          phosphate directly to the conserved receiver aspartate of NtrC; the
          same kinase also dephosphorylates NtrC when nitrogen is sufficient.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is absent:
                this is a simple two-component system in which the sensor kinase
                transfers phosphate directly to the response regulator.
            notes: >-
              NtrB (sensor, GO:0000155) -> NtrC (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer, with no discrete Hpt protein.
        parts:
          - order: 1
            role: NtrB sensor-kinase autophosphorylation
            node:
              id: ntrb_sensor
              label: NtrB sensor histidine kinase
              module_type: REGULATORY_STEP
              description: >-
                The bifunctional sensor kinase whose kinase/phosphatase balance
                is set by the PII protein.
              annotons:
                - id: ntrb_sensor_kinase
                  label: NtrB phosphorelay sensor kinase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: NtrB sensor histidine kinase/phosphatase subfamily
                      term:
                        id: PANTHER:PTHR43065:SF16
                        label: SENSORY HISTIDINE KINASE_PHOSPHATASE NTRB
                      representative_members:
                        - preferred_term: NtrB/GlnL (Escherichia coli K-12)
                          term:
                            id: UniProtKB:P0AFB5
                            label: Sensory histidine kinase/phosphatase NtrB
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
                  role_description: >-
                    Autophosphorylates on its conserved histidine and transfers
                    phosphate to NtrC; acts as an NtrC phosphatase in the
                    nitrogen-sufficient state.
          - order: 2
            role: NtrC receiver-aspartate phosphorylation
            node:
              id: ntrc_response_regulator
              label: NtrC response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: ntrc_response_regulator_activity
                  label: NtrC phosphorelay response regulator
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: NtrC-type response-regulator family
                      term:
                        id: PANTHER:PTHR32071:SF95
                        label: DNA-BINDING TRANSCRIPTIONAL REGULATOR NTRC
                      representative_members:
                        - preferred_term: NtrC/GlnG (Escherichia coli K-12)
                          term:
                            id: UniProtKB:P0AFB8
                            label: DNA-binding transcriptional regulator NtrC
                        - preferred_term: NtrC (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88CY1
                            label: Nitrogen regulation protein NtrC
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
                  role_description: >-
                    Receives phosphate on its receiver aspartate, licensing the
                    AAA+ enhancer-binding and DNA-binding modules.
        connections:
          - source: ntrb_sensor
            target: ntrc_response_regulator
            connection_type: CAUSES
            description: NtrB transfers its phosphoryl group to the NtrC receiver aspartate.
    - order: 4
      role: sigma-54-dependent transcriptional activation
      node:
        id: sigma54_transcriptional_activation
        label: NtrC/sigma-54 transcriptional activation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated NtrC binds upstream enhancer DNA and uses ATP-dependent
          remodelling of the sigma-54 holoenzyme to convert a closed complex at
          -24/-12 promoters into an open complex.
        annotons:
          - id: ntrc_transcription_activator
            label: NtrC sigma-54-dependent transcription activator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NtrC-type response-regulator family
                term:
                  id: PANTHER:PTHR32071:SF95
                  label: DNA-BINDING TRANSCRIPTIONAL REGULATOR NTRC
                representative_members:
                  - preferred_term: NtrC/GlnG (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0AFB8
                      label: DNA-binding transcriptional regulator NtrC
                  - preferred_term: NtrC (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CY1
                      label: Nitrogen regulation protein NtrC
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Activates nitrogen-regulated promoters, including glnA and the
              glnK-amtB operon, once phosphorylated.
          - id: rpon_sigma_factor
            label: Sigma-54 promoter-specificity factor
            participant:
              selector_type: FAMILY
              family:
