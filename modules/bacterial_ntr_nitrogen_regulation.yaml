                term:
                  id: PANTHER:PTHR32248:SF4
                  label: RNA POLYMERASE SIGMA-54 FACTOR
                representative_members:
                  - preferred_term: RpoN (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:P0A171
                      label: RNA polymerase sigma-54 factor
                  - preferred_term: rpoN (DESVH)
                    term:
                      id: UniProtKB:Q72BK7
                      label: RNA polymerase sigma-54 factor
            function:
              preferred_term: sigma factor activity
              term:
                id: GO:0016987
                label: sigma factor activity
            processes:
              - preferred_term: regulation of DNA-templated transcription initiation
                term:
