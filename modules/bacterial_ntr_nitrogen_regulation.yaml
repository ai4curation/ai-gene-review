  connections:
    - source: glnd_pii_uridylylation
      target: pii_nitrogen_status_sensing
      connection_type: CAUSES
      description: >-
        GlnD sets the uridylylation state of PII; uridylylation prevents PII
        from stimulating the NtrB phosphatase.
    - source: pii_nitrogen_status_sensing
      target: ntr_phosphorelay
      connection_type: NEGATIVELY_REGULATES
      description: >-
        In the nitrogen-sufficient state the PII protein shifts NtrB toward
        NtrC dephosphorylation, damping the relay.
    - source: ntr_phosphorelay
      target: sigma54_transcriptional_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the NtrC receiver domain licenses its
        enhancer-binding activator output.
    - source: sigma54_transcriptional_activation
      target: ammonium_scavenging_assimilation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Open-complex formation at sigma-54 promoters induces the ammonium
        scavenging and assimilation genes.
  knowledge_gaps:
    - gap_statement: >-
        Whether the PII protein acts on NtrB alone or also directly on other
        nitrogen-regulatory targets varies between bacteria, and the KT2440
        partner set is not fully established.
