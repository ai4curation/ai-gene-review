id: MODULE:bacterial_ntr_nitrogen_regulation
title: Bacterial Ntr nitrogen-regulatory phosphorelay and assimilation output
description: >-
  The bacterial nitrogen-regulatory (Ntr) system, which couples intracellular
  nitrogen status to the sigma-54-dependent nitrogen-scavenging regulon. A
  PII-family signal transduction protein integrates nitrogen and carbon/energy
  status through 2-oxoglutarate, ATP and ADP binding and through reversible
  uridylylation, and relays that status to the sensor histidine kinase NtrB by
  modulating its kinase/phosphatase balance. NtrB phosphorylates the conserved
  receiver aspartate of NtrC, and phosphorylated NtrC uses its AAA+
  enhancer-binding module together with the sigma-54 holoenzyme to open
  -24/-12 promoters, inducing ammonium scavenging and ammonia assimilation. The
  module covers signal integration, His->Asp phosphotransfer, sigma-54-dependent
  activation, and the immediate assimilatory output.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the NtrB/NtrC two-component signalling relationship.
  - source_id: GO:0006808
    title: regulation of nitrogen utilization
    statement: >-
      Grounds the module as the regulatory program controlling nitrogen
      utilization under nitrogen limitation.
  - source_id: GO:0019676
    title: ammonia assimilation cycle
    statement: Defines the assimilatory output reaction catalysed by glutamine synthetase.
  - source_id: file:PSEPK/glnK/glnK-ai-review.yaml
    statement: >-
      Grounds the PSEPK GlnK PII exemplar, its effector-binding signal
      integration, and its modulation of the NtrB kinase/phosphatase balance.
  - source_id: file:PSEPK/ntrC/ntrC-ai-review.yaml
    statement: >-
      Grounds the PSEPK NtrC exemplar as the phosphorelay response regulator and
      as the sigma-54-dependent activator of glnK and further nitrogen-scavenging
      genes, with dual activator/repressor behaviour.
  - source_id: file:PSEPK/rpoN/rpoN-ai-review.yaml
    statement: >-
      Grounds the PSEPK sigma-54 exemplar whose holoenzyme is remodelled by
      enhancer-binding proteins such as NtrC to form the open complex.
  - source_id: file:PSEPK/amtB/amtB-ai-review.yaml
    statement: >-
      Grounds the PSEPK AmtB high-affinity ammonium-transport exemplar, encoded
      in the glnK-amtB operon and induced through NtrC/sigma-54.
  - source_id: file:PSEPK/glnA/glnA-ai-review.yaml
    statement: >-
      Grounds the PSEPK glutamine synthetase exemplar that assimilates the
      scavenged ammonium.
notes: >-
  The module is species-neutral; Pseudomonas putida KT2440 proteins provide the
  concrete implementation. The sensor kinase NtrB (NRII/GlnL) is modelled as an
  abstract phosphorelay-sensor-kinase role rather than a concrete exemplar,
  because no NtrB gene review exists in this repository yet; its partner
  relationship is grounded through the GlnK and NtrC reviews, which both describe
  it. Sigma-54 is included as the output partner of NtrC rather than as a member
  of the phosphorelay, since a single sigma-54 serves many unrelated
  enhancer-binding proteins and is shared with other modules. The wider
  NtrC-dependent regulon (urease, nitrate and further nitrogen-source catabolism)
  and the GS-GOGAT cycle beyond glutamine synthetase are outside this boundary.
  GlnD-mediated uridylylation is described as the modification that sets the GlnK
  state, but GlnD itself is not a module member.
module:
  id: bacterial_ntr_nitrogen_regulation
  label: Bacterial Ntr nitrogen-regulatory phosphorelay
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: regulation of nitrogen utilization
      term:
        id: GO:0006808
        label: regulation of nitrogen utilization
      description: >-
        Signal-dependent control of the nitrogen-scavenging and assimilation
        regulon.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: PII-mediated nitrogen-status integration
      node:
        id: pii_nitrogen_status_sensing
        label: PII (GlnK) nitrogen-status integration
        module_type: REGULATORY_STEP
        description: >-
          A cytoplasmic PII homotrimer binds 2-oxoglutarate, ATP and ADP and
          carries a reversible uridylylation mark on its T-loop, converting
          nitrogen and energy status into a partner-modulating signal that sets
          the kinase/phosphatase balance of NtrB.
        annotons:
          - id: glnk_pii_signal_integration
            label: GlnK PII signal transduction protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PII-family nitrogen regulatory protein GlnK
                term:
                  id: PANTHER:PTHR30115:SF20
                  label: NITROGEN REGULATORY PROTEIN GLNK
                representative_members:
                  - preferred_term: GlnK (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CE7
                      label: Nitrogen regulatory protein P-II GlnK
            function:
              preferred_term: phosphatase activator activity
              term:
                id: GO:0019211
                label: phosphatase activator activity
            processes:
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Integrates effector-metabolite and uridylylation signals and
              shifts NtrB toward its phosphatase state when nitrogen is
              sufficient.
    - order: 2
      role: NtrB/NtrC His-Asp phosphorelay
      node:
        id: ntr_phosphorelay
        label: NtrB/NtrC phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The sensor histidine kinase NtrB autophosphorylates and transfers
          phosphate directly to the conserved receiver aspartate of NtrC; the
          same kinase also dephosphorylates NtrC when nitrogen is sufficient.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is absent:
                this is a simple two-component system in which the sensor kinase
                transfers phosphate directly to the response regulator.
            notes: >-
              NtrB (sensor, GO:0000155) -> NtrC (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer, with no discrete Hpt protein.
        parts:
          - order: 1
            role: NtrB sensor-kinase autophosphorylation
            node:
              id: ntrb_sensor
              label: NtrB sensor histidine kinase
              module_type: REGULATORY_STEP
              description: >-
                The bifunctional sensor kinase whose kinase/phosphatase balance
                is set by the PII protein.
              annotons:
                - id: ntrb_sensor_kinase
                  label: NtrB phosphorelay sensor kinase
                  participant:
                    selector_type: ANY_WITH_FUNCTION
                    required_function:
                      preferred_term: phosphorelay sensor kinase activity
                      term:
                        id: GO:0000155
                        label: phosphorelay sensor kinase activity
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  role_description: >-
                    Autophosphorylates on its conserved histidine and transfers
                    phosphate to NtrC; acts as an NtrC phosphatase in the
                    nitrogen-sufficient state.
          - order: 2
            role: NtrC receiver-aspartate phosphorylation
            node:
              id: ntrc_response_regulator
              label: NtrC response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: ntrc_response_regulator_activity
                  label: NtrC phosphorelay response regulator
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: NtrC-type response-regulator family
                      term:
                        id: PANTHER:PTHR32071:SF95
                        label: DNA-BINDING TRANSCRIPTIONAL REGULATOR NTRC
                      representative_members:
                        - preferred_term: NtrC (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88CY1
                            label: Nitrogen regulation protein NtrC
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
                  role_description: >-
                    Receives phosphate on its receiver aspartate, licensing the
                    AAA+ enhancer-binding and DNA-binding modules.
        connections:
          - source: ntrb_sensor
            target: ntrc_response_regulator
            connection_type: CAUSES
            description: NtrB transfers its phosphoryl group to the NtrC receiver aspartate.
    - order: 3
      role: sigma-54-dependent transcriptional activation
      node:
        id: sigma54_transcriptional_activation
        label: NtrC/sigma-54 transcriptional activation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated NtrC binds upstream enhancer DNA and uses ATP-dependent
          remodelling of the sigma-54 holoenzyme to convert a closed complex at
          -24/-12 promoters into an open complex.
        annotons:
          - id: ntrc_transcription_activator
            label: NtrC sigma-54-dependent transcription activator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NtrC-type response-regulator family
                term:
                  id: PANTHER:PTHR32071:SF95
                  label: DNA-BINDING TRANSCRIPTIONAL REGULATOR NTRC
                representative_members:
                  - preferred_term: NtrC (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CY1
                      label: Nitrogen regulation protein NtrC
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Activates nitrogen-scavenging promoters, including the glnK-amtB
              operon, once phosphorylated.
          - id: rpon_sigma_factor
            label: Sigma-54 promoter-specificity factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RNA polymerase sigma-54 factor family
                term:
                  id: PANTHER:PTHR32248:SF4
                  label: RNA POLYMERASE SIGMA-54 FACTOR
                representative_members:
                  - preferred_term: RpoN (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:P0A171
                      label: RNA polymerase sigma-54 factor
            function:
              preferred_term: sigma factor activity
              term:
                id: GO:0016987
                label: sigma factor activity
            processes:
              - preferred_term: regulation of DNA-templated transcription initiation
                term:
                  id: GO:2000142
                  label: regulation of DNA-templated transcription initiation
            role_description: >-
              Directs the holoenzyme to -24/-12 promoters and holds it in a
              closed complex until an enhancer-binding protein acts.
    - order: 4
      role: ammonium scavenging and assimilation output
      node:
        id: ammonium_scavenging_assimilation
        label: Ammonium scavenging and assimilation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The induced output: high-affinity ammonium uptake across the inner
          membrane followed by ATP-dependent assimilation of ammonium into
          glutamine.
        annotons:
          - id: amtb_ammonium_transport
            label: AmtB high-affinity ammonium transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Amt/Mep/Rh ammonium transporter family
                term:
                  id: PANTHER:PTHR43029:SF10
                  label: AMMONIUM TRANSPORTER MEP2
                representative_members:
                  - preferred_term: AmtB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CE8
                      label: Ammonium transporter AmtB
            function:
              preferred_term: ammonium channel activity
              term:
                id: GO:0008519
                label: ammonium channel activity
            processes:
              - preferred_term: ammonium transmembrane transport
                term:
                  id: GO:0072488
                  label: ammonium transmembrane transport
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Scavenges low external ammonium once the glnK-amtB operon is
              induced.
          - id: glna_glutamine_synthetase
            label: Glutamine synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: glutamine synthetase family
                term:
                  id: PANTHER:PTHR43407:SF2
                  label: GLUTAMINE SYNTHETASE
                representative_members:
                  - preferred_term: GlnA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CY3
                      label: Glutamine synthetase
            function:
              preferred_term: glutamine synthetase activity
              term:
                id: GO:0004356
                label: glutamine synthetase activity
              substrates:
                - preferred_term: L-glutamate
                - preferred_term: ammonium
                - preferred_term: ATP
              products:
                - preferred_term: L-glutamine
                - preferred_term: ADP
                - preferred_term: phosphate
            processes:
              - preferred_term: ammonia assimilation cycle
                term:
                  id: GO:0019676
                  label: ammonia assimilation cycle
            role_description: >-
              Assimilates the scavenged ammonium into L-glutamine, the central
              amino-group donor.
  connections:
    - source: pii_nitrogen_status_sensing
      target: ntr_phosphorelay
      connection_type: NEGATIVELY_REGULATES
      description: >-
        In the nitrogen-sufficient state the PII protein shifts NtrB toward
        NtrC dephosphorylation, damping the relay.
    - source: ntr_phosphorelay
      target: sigma54_transcriptional_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the NtrC receiver domain licenses its
        enhancer-binding activator output.
    - source: sigma54_transcriptional_activation
      target: ammonium_scavenging_assimilation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Open-complex formation at sigma-54 promoters induces the ammonium
        scavenging and assimilation genes.
  knowledge_gaps:
    - gap_statement: >-
        The NtrB (NRII/GlnL) sensor kinase has no gene review in this
        repository, so the sensor tier is grounded only by molecular function.
      boundary: >-
        Model NtrB as an abstract phosphorelay-sensor-kinase role; replace it
        with a concrete family and exemplar once the gene is reviewed.
      gap_kind:
        - CURATION
    - gap_statement: >-
        Whether the PII protein acts on NtrB alone or also directly on other
        nitrogen-regulatory targets varies between bacteria, and the KT2440
        partner set is not fully established.
      boundary: >-
        Assert only the NtrB kinase/phosphatase modulation supported by the
        GlnK review, and keep GlnD and other candidate partners outside the
        module.
      gap_kind:
        - BIOLOGY
