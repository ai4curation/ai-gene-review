                label: channel inhibitor activity
            processes:
              - preferred_term: regulation of nitrogen utilization
                term:
                  id: GO:0006808
                  label: regulation of nitrogen utilization
            locations:
              - preferred_term: cytoplasmic side of plasma membrane
                term:
                  id: GO:0009898
                  label: cytoplasmic side of plasma membrane
            role_description: >-
              Unmodified GlnK, encoded with amtB, binds and blocks AmtB from the
