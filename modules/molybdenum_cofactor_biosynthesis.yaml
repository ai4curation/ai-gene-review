                - preferred_term: moeB (Escherichia coli K-12)
                  term:
                    id: UniProtKB:P12282
                    label: Molybdopterin-synthase adenylyltransferase
                  description: Escherichia coli K-12 MoeB exemplar.
                ancestral_nodes:
                - preferred_term: PAINT node PTN000102040
                  term:
                    id: PANTHER:PTN000102040
                    label: PTN000102040
                  description: >-
                    Root PAINT IBD node in PTHR10953 asserting the parent activity
