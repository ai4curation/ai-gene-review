    target: nucleotide_maturation
    connection_type: PROVIDES_INPUT_FOR
    description: Mo-MPT may be retained directly or converted to MGD and/or MCD.
knowledge_gaps:
- gap_statement: >-
    Catalytic MPT adenylyltransferase competence is lineage-dependent among
    prokaryotic MoaB-family proteins, and sequence-family membership alone does
    not reliably distinguish active enzymes from MPT-binding noncatalytic proteins.
  boundary: >-
    The catalytic MoaB alternative is anchored to reviewed Pyrococcus furiosus
    Q8U3T3 rather than asserted for the whole broad MoaB PANTHER family.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Prevents broad propagation of catalytic MogA-equivalent activity across the MoaB family.
  resolution: Comparative MPT-AMP formation and MoeA-coupled molybdate-insertion assays across resolved MoaB lineages.
  provenance:
  - reference_id: file:modules/molybdenum_cofactor_biosynthesis-deep-research-openscientist.md
    supporting_text: >-
      Whether every prokaryotic MoaB is a bona fide adenylyltransferase in vivo,
      or only a subset of the lineage, is not fully resolved.
- gap_statement: >-
    Broad MobA-like/PTHR43777 family assignments do not by themselves resolve
    whether an uncharacterized protein uses GTP to make MGD, CTP to make MCD,
    or another nucleotide and acceptor.
  boundary: >-
    The MGD branch uses the exact MobA subfamily PTHR19136:SF81, whereas the MCD
    branch is anchored to reviewed E. coli MocA Q46810 and deliberately omits
    the insufficiently specific PTHR43777:SF1 selector.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Prevents a broad fold or family label from being treated as proof of nucleotide specificity.
  resolution: Direct CTP- versus GTP-dependent Mo-MPT nucleotidyl-transfer assays followed by product identification.
  provenance:
  - reference_id: file:modules/molybdenum_cofactor_biosynthesis-deep-research-openscientist.md
    supporting_text: >-
      MobA and MocA share only ~22% identity yet are so nucleotide-selective that
      "the exchange of five amino acids was enough to obtain activity with both
      GTP and CTP in either MocA or MobA"
