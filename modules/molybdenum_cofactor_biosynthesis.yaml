notes: >-
  Scope and generalization: the MoaA-MoaC-MoaD/MoaE-MoeB-MogA/MoaB-MoeA chemistry,
  with the MobA and MocA dinucleotide branches, is conserved across bacteria and
  archaea, so the module is prokaryote-wide. Pseudomonas putida KT2440 is one
  exemplar and Escherichia coli K-12 is the biochemically characterized reference.
  Pyrococcus furiosus anchors the catalytically active MoaB alternative.
  Eukaryotic MOCS1/MOCS2/MOCS3/gephyrin organization is excluded, although several
  PANTHER families used here also contain those proteins. The scope stays CONCRETE
  because every leaf grounds to experimentally characterized representatives.
  Family groundings follow the PANTHER/PTN groundings proposed in PR #5076 where the
  family reviews verified them: MoeB SF194 with PTN000102040, MogA SF1 with
  PTN000022863, MoeA PTHR10192 with PTN000022760, and MobA SF81 with PTN001452257.
  Two were narrowed. MoaA keeps PTN000539172 but asserts no PTHR22960 family id,
  because that parent family also holds the MoaC cPMP synthases. MoaE is grounded
  on PTHR23404:SF2 instead of the parent, because the parent also holds the MBIP
  subfamily. The Listeria welshimeri MoaC exemplar (A0AHF9), which has no
  experimental evidence, was dropped. E. coli MoaC (P0A738) is not an SF29
  representative because PANTHER assigns it no subfamily. P. putida KT2440 has no
  separate mogA gene; its two MoaB-family paralogs, moaB-I (Q88L15) and moaB-II
  (Q88E67), are not grounded here because neither has been shown to adenylate MPT
  (see the MoaB knowledge gap). KT2440 is therefore an exemplar for every step
  except MPT adenylylation. A KT2440 realization leaves that step as a REALIZER
  gap (the activity is required but its carrier is unidentified), not as evidence
  that the step is absent. The P. furiosus MoaB anchor comes from a
  tungsten-cofactor organism; it is used here for the adenylyl transfer, which
  PMID:18154309 reports is shared by W and Mo cofactor maturation. Its gene review
  therefore uses the parent process GO:0032324, while this module's process concept
  is the Mo-specific GO:0006777.
knowledge_gaps:
- gap_statement: >-
    Catalytic MPT adenylyltransferase competence is lineage-dependent among
    prokaryotic MoaB-family proteins, and sequence-family membership alone does
    not reliably distinguish active enzymes from MPT-binding noncatalytic proteins.
  boundary: >-
    The catalytic MoaB alternative is anchored to reviewed Pyrococcus furiosus
    Q8U3T3 rather than asserted for the whole broad MoaB PANTHER family. In
    organisms without a separate MogA, such as P. putida KT2440 (MoaB-family
    paralogs Q88L15 and Q88E67), the MPT adenylylation step has no grounded
    carrier.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Prevents broad propagation of catalytic MogA-equivalent activity across the MoaB family.
  resolution: Comparative MPT-AMP formation and MoeA-coupled molybdate-insertion assays across resolved MoaB lineages.
  provenance:
  - reference_id: file:modules/molybdenum_cofactor_biosynthesis-deep-research-openscientist.md
    reference_section_type: LITERATURE_REVIEW
    supporting_text: >-
      Whether every prokaryotic MoaB is a bona fide adenylyltransferase in vivo,
      or only a subset of the lineage, is not fully resolved.
- gap_statement: >-
    Broad MobA-like/PTHR43777 family assignments do not by themselves resolve
    whether an uncharacterized protein uses GTP to make MGD, CTP to make MCD,
    or another nucleotide and acceptor.
  boundary: >-
    The MGD branch uses the exact MobA subfamily PTHR19136:SF81, whereas the MCD
    branch is anchored to reviewed E. coli MocA Q46810 and deliberately omits
    the insufficiently specific PTHR43777:SF1 selector.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Prevents a broad fold or family label from being treated as proof of nucleotide specificity.
  resolution: Direct CTP- versus GTP-dependent Mo-MPT nucleotidyl-transfer assays followed by product identification.
  provenance:
  - reference_id: file:modules/molybdenum_cofactor_biosynthesis-deep-research-openscientist.md
    reference_section_type: LITERATURE_REVIEW
    supporting_text: >-
      MobA and MocA share only ~22% identity yet are so nucleotide-selective that
      "the exchange of five amino acids was enough to obtain activity with both
      GTP and CTP in either MocA or MobA"
