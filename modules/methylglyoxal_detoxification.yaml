  knowledge_gaps:
    - gap_statement: >-
        The native activating metal has been measured for only a few glyoxalase I
        enzymes (E. coli GloA, P. aeruginosa GloA1-3, human and yeast GLO1). For
        others, such as P. putida GloA, UniProt lists Ni2+ or Zn2+ by similarity,
        so the metal class is predicted from PANTHER family membership, not shown.
      boundary: >-
        Metal class is encoded only at the variant (PANTHER family) level; no
        member-level metal is asserted beyond the gene reviews.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Glyoxalase I is cytosolic, yet vertebrates and budding yeast keep a
        matrix-targeted glyoxalase II. Whether S-D-lactoylglutathione is imported
        into mitochondria, made there, or whether the matrix enzyme mainly acts on
        other S-2-hydroxyacylglutathione thioesters is not known.
      boundary: >-
        The GLO4 and HAGH variants assert the glyoxalase II activity and matrix
        location only; the substrate source is left open.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Broad VOC- and metallo-beta-lactamase-superfamily assignments do not
        establish glyoxalase-I or glyoxalase-II substrate specificity.
      boundary: >-
        Require an exact glyoxalase subfamily assignment or direct biochemical
        evidence before allowing an additional family candidate to satisfy
        either reaction.
      gap_kind:
        - BIOLOGY
