id: MODULE:methylglyoxal_detoxification
title: Glutathione-dependent methylglyoxal detoxification (glyoxalase system)
description: >-
  A two-reaction detoxification module, conserved from bacteria to eukaryotes, in which glyoxalase I converts the spontaneously formed methylglyoxal-glutathione hemithioacetal to (R)-S-lactoylglutathione and glyoxalase II hydrolyzes that intermediate to D-lactate while regenerating glutathione. Glyoxalase II is carried out by non-orthologous metallo-beta-lactamase-fold enzymes in bacteria (GloB) and eukaryotes (HAGH/GLO2), and some fungi have separate cytosolic and mitochondrial glyoxalase II isozymes. Glutathione biosynthesis, methylglyoxal generation, glutathione-independent routes (glyoxalase III, methylglyoxal reductases) and downstream D-lactate oxidation are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0051596
    title: methylglyoxal catabolic process
    statement: Defines the complete glutathione-dependent route represented here.
  - source_id: RHEA:19069
    title: lactoylglutathione lyase reaction
    statement: Defines reversible formation of (R)-S-lactoylglutathione from methylglyoxal and glutathione.
  - source_id: RHEA:21864
    title: hydroxyacylglutathione hydrolase reaction
    statement: Defines hydrolysis of an S-(2-hydroxyacyl)glutathione with glutathione regeneration.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methylglyoxal-detoxification__ppu00620-deep-research-openscientist.md
    title: OpenScientist PSEPK methylglyoxal detoxification synthesis
    statement: Species-aware retrieval resolves GloA and GloB as the complete canonical KT2440 route.
  - source_id: UniProtKB:P16635
    title: Reviewed Pseudomonas putida glyoxalase I exemplar
    statement: Provides a reviewed same-species exemplar for glyoxalase I.
  - source_id: UniProtKB:Q9HU72
    title: Reviewed Pseudomonas aeruginosa glyoxalase I exemplar
    statement: Provides a reviewed cross-taxon bacterial exemplar in the exact PTHR10374:SF30 subfamily.
  - source_id: UniProtKB:Q88FF3
    title: Reviewed Pseudomonas putida KT2440 glyoxalase II
    statement: Provides reviewed HAMAP grounding for the second reaction in the target strain.
  - source_id: PMID:11461144
    title: Accumulation of methylglyoxal in anaerobically grown Escherichia coli and its detoxification by expression of the Pseudomonas putida glyoxalase I gene.
    statement: Same-species biochemical work supports GlxI-mediated methylglyoxal detoxification, although the historical locus is not tied to PP_3766.
  - source_id: PMID:21143325
    title: The critical role of S-lactoylglutathione formation during methylglyoxal detoxification in Escherichia coli.
    statement: Establishes that GloB-dependent turnover and methylglyoxal tolerance can make distinct physiological contributions.
  - source_id: YeastPathways:PWY-901
    title: methylglyoxal catabolism (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-901
    statement: YeastCyc lists GLYOXI-RXN (GLO1) and GLYOXII-RXN (GLO2, GLO4). Gene assignments retained; GLO4 is mitochondrial, not cytosolic as the SGD GO-CAM states.
  - source_id: PMID:8824231
    title: Identification of the structural gene for glyoxalase I from Saccharomyces cerevisiae.
    statement: GLO1 encodes yeast glyoxalase I; methylglyoxal detoxification requires glutathione.
  - source_id: PMID:9261170
    title: Identification and phenotypic analysis of two glyoxalase II encoding genes from Saccharomyces cerevisiae, GLO2 and GLO4, and intracellular localization of the corresponding proteins.
    statement: GLO2 encodes cytoplasmic and GLO4 mitochondrial-matrix glyoxalase II; GLO4 is expressed only on glycerol, and the glo2 glo4 double mutant lacks glyoxalase II activity and is methylglyoxal-sensitive.
  - source_id: PMID:10600466
    title: Heterologous expression, purification, and kinetic comparison of the cytoplasmic and mitochondrial glyoxalase II enzymes, Glo2p and Glo4p, from Saccharomyces cerevisiae.
    statement: Purified Glo2p and Glo4p hydrolyse S-D-lactoylglutathione with similar kinetic parameters.
  - source_id: file:yeast/GLO1/GLO1-ai-review.yaml
    title: GLO1 gene review (S. cerevisiae)
    statement: Core function GO:0004462 in cytosol.
  - source_id: file:yeast/GLO2/GLO2-ai-review.yaml
    title: GLO2 gene review (S. cerevisiae)
    statement: Core function GO:0004416 in cytosol.
  - source_id: file:yeast/GLO4/GLO4-ai-review.yaml
    title: GLO4 gene review (S. cerevisiae)
    statement: Core function GO:0004416 in the mitochondrial matrix.
notes: >-
  The non-enzymatic formation of the methylglyoxal-glutathione hemithioacetal is treated as input context rather than a protein-catalyzed part. GshA/GshB glutathione supply and D-lactate oxidation are satisfiability dependencies, not nominal parts. Dedicated methylglyoxal synthesis and glutathione-independent detoxification routes are outside this module. Target-specific candidates and exclusions belong in project batch pages; the PSEPK assessment is recorded in file:projects/P_PUTIDA/batches/ppu00620_methylglyoxal_detoxification.md. ALIGN (YeastPathways project, 2026-10): the P. putida-centred module was widened to bacteria plus eukaryotes. Glyoxalase I gained S. cerevisiae GLO1, S. pombe glo1 and human GLO1, all in PTHR10374:SF30 with the bacterial exemplars. Glyoxalase II became a ONE_OR_MORE variant set because eukaryotic GLO2/HAGH (PTHR11935) and bacterial GloB (PTHR43705:SF1) are different PANTHER families, and because S. cerevisiae has a cytosolic (GLO2) and a glycerol-induced mitochondrial-matrix (GLO4) isozyme (PMID:9261170). YeastCyc gene assignments for PWY-901 are correct. GO-CAM disagreements: the SGD model places GLO4 in cytosol; the PomBase model includes glutathione-independent glyoxalase III (hsp3101-hsp3105; budding-yeast HSP31 family), methylglyoxal reductase and lactate/lactaldehyde dehydrogenases, which are outside this module.
