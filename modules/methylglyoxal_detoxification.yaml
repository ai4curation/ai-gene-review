id: MODULE:methylglyoxal_detoxification
title: Glutathione-dependent methylglyoxal detoxification
description: >-
  A two-reaction detoxification module in which glyoxalase I converts the
  spontaneously formed methylglyoxal-glutathione hemithioacetal to
  (R)-S-lactoylglutathione and glyoxalase II hydrolyzes that intermediate to
  D-lactate while regenerating glutathione. Glutathione biosynthesis,
  methylglyoxal generation, alternative glutathione-independent routes, and
  downstream D-lactate oxidation are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0051596
    title: methylglyoxal catabolic process
    statement: Defines the complete glutathione-dependent route represented here.
  - source_id: RHEA:19069
    title: lactoylglutathione lyase reaction
    statement: Defines reversible formation of (R)-S-lactoylglutathione from methylglyoxal and glutathione.
  - source_id: RHEA:21864
    title: hydroxyacylglutathione hydrolase reaction
    statement: Defines hydrolysis of an S-(2-hydroxyacyl)glutathione with glutathione regeneration.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methylglyoxal-detoxification__ppu00620-deep-research-openscientist.md
    title: OpenScientist PSEPK methylglyoxal detoxification synthesis
    statement: Species-aware retrieval resolves GloA and GloB as the complete canonical KT2440 route.
  - source_id: UniProtKB:P16635
    title: Reviewed Pseudomonas putida glyoxalase I exemplar
    statement: Provides a reviewed same-species exemplar for glyoxalase I.
  - source_id: UniProtKB:Q88FF3
    title: Reviewed Pseudomonas putida KT2440 glyoxalase II
    statement: Provides reviewed HAMAP grounding for the second reaction in the target strain.
notes: >-
  The non-enzymatic formation of the methylglyoxal-glutathione hemithioacetal
  is treated as input context rather than a protein-catalyzed part. GshA/GshB
  glutathione supply and D-lactate oxidation are satisfiability dependencies,
  not nominal parts. KT2440 has no identified MgsA methylglyoxal synthase, which
  is a boundary decision rather than a hole in this detoxification module.
