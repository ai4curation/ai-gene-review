id: MODULE:phage_p1_plasmid_prophage_immunity_and_partition
title: Bacteriophage P1 plasmid prophage tripartite immunity, Cre-loxP dimer resolution, Phd-Doc addiction, and methylation-gated headful packaging
description: 'An integrated plasmid-prophage maintenance and lytic development module exemplified by Escherichia phage P1
  (Punavirus P1, 93.6 kb), which persists in the lysogenic state as a stable, low-copy extrachromosomal circular plasmid (~1
  copy per host chromosome) rather than integrating into the Escherichia coli chromosome. The module coordinates four coupled
  functional axes: (1) Tripartite immunity and lytic switch control across three dispersed loci—immC (encoding the master
  sequence-specific repressor C1, which binds 17-bp asymmetric operators across the P1 genome), immT (encoding the Bof co-repressor
  modulator that enhances C1 operator affinity), and immI (encoding the C4 antisense RNA repressor that blocks translation
  of the Ant1/Ant2 antirepressor and the adjacent KilA/RepL lytic replicon operon); upon C1 inactivation or C4 relief, Ant1/Ant2
  antagonize C1, RepL initiates lytic theta/rolling-circle replication at oriL, and Lpa trans-activates late morphogenetic
  promoters; (2) Extrachromosomal plasmid prophage stability via Cre-loxP site-specific recombination, which resolves dimeric
  P1 circles formed by homologous recombination back into monomeric unit-copy plasmids prior to ParAB active partitioning,
  and the Phd-Doc type II toxin-antitoxin post-segregational killing ("addiction") module, in which ClpXP-mediated degradation
  of labile antitoxin Phd in plasmid-cured daughter cells frees the Fic-fold kinase Doc to phosphorylate host EF-Tu at Thr-383
  and arrest translation; (3) Adenine-methylation-gated headful DNA packaging and restriction defense/counterdefense, in which
  either the lytic adenine methyltransferase Dmt or the EcoP1I Type III R-M enzyme (Mod2Res2) methylates 5''-AGACC-3'' sites
  within the 162-bp pac site to license recognition and cleavage by the PacAB terminase (PacA small subunit and PacB large
  ATPase/endonuclease subunit), while the internal capsid proteins DarA and DarB (a 250-kDa helicase-methyltransferase) are
  packaged into the procapsid and co-ejected with viral DNA to block host Type I R-M endonucleases; and (4) Cin-catalyzed
  inversion of the 4.2-kb C-segment between cixL and cixR sites to alternate expression of C-terminal Sc/Sv receptor-binding
  domains of tail fiber protein S and their dedicated assembly chaperones U and U'', followed by host lysis via the signal-arrest-release
  (SAR) endolysin gp17 (Lyz).'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:15489417
  title: Genome of bacteriophage P1.
  statement: Complete 93.6-kb genome sequence and functional analysis of Escherichia phage P1 defining its tripartite immunity
    system, Cre-loxP dimer resolution, Phd-Doc addiction operon, pacAB/dmt packaging machinery, dar antirestriction operon,
    and cin C-segment inversion cassette.
- source_id: PMID:2661831
  title: Structure and regulation of the lytic replicon of phage P1.
  statement: Establishes the organization of the P1 immI region and the c4-regulated kilA-repL lytic replicon operon.
- source_id: PMID:3811234
  title: The c4 gene of phage P1.
  statement: Identifies and characterizes the P1 immI immunity repressor gene c4 that prevents expression of the antirepressor
    ant.
- source_id: PMID:8411153
  title: 'Plasmid addiction genes of bacteriophage P1: doc, which causes cell death on curing of prophage, and phd, which
    prevents host death when prophage is retained.'
  statement: Discovers the P1 plasmid addiction operon encoding the toxin Doc (death on curing) and antitoxin Phd (prevents
    host death) that stabilize the low-copy P1 plasmid prophage by post-segregational killing.
- source_id: PMID:1538406
  title: Bacteriophage P1 genes involved in the recognition and cleavage of the phage packaging site (pac).
  statement: Demonstrates that P1 genes pacA and pacB are required for recognition and cleavage of the methylated bacteriophage
    P1 packaging site (pac).
- source_id: PMID:28509398
  title: The multicomponent antirestriction system of phage P1 is linked to capsid morphogenesis.
  statement: Shows that the P1 Dar antirestriction proteins DarA and DarB are sequentially incorporated as internal capsid
    proteins during procapsid assembly to protect ejected viral DNA against host Type I R-M systems.
- source_id: PMID:6327269
  title: A site-specific, conservative recombination system carried by bacteriophage P1. Mapping the recombinase gene cin
    and the cross-over sites cix for the inversion of the C segment.
  statement: Maps the P1 DNA invertase gene cin and the crossover sites cixL/cixR that mediate C-segment inversion and alternate
    tail fiber host-range specificity.
- source_id: GO:0019044
  title: maintenance of viral latency
  statement: Defines the maintenance of the lysogenic plasmid prophage state by coordinated immunity repression.
- source_id: GO:0044696
  title: killing by virus of host cell by post-segregational killing
  statement: Defines post-segregational killing of prophage-cured daughter cells by the viral toxin-antitoxin addiction system.
notes: 'Exemplar phage: Escherichia phage P1 / Punavirus P1 (NCBITaxon:2886926 / NCBITaxon:10678). Generalizes across Punavirus
  plasmid prophages (including P1 and P7) and related linear/circular plasmid phages (such as N15) that couple multipartite
  immunity control with recombinational dimer resolution, post-segregational toxin-antitoxin addiction, headful pac-site packaging,
  and invertase-mediated tail fiber switching.'
