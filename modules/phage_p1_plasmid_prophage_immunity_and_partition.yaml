  knowledge_gaps:
  - gap_statement: Although the P1 c4 immunity regulator (UniProtKB:P11189) is experimentally established as a 77-nt antisense
      ncRNA rather than a translated polypeptide, reference proteome databases still index P11189 as a protein entry; furthermore,
      the atomic mechanism by which ejected 250-kDa DarB coordinates its N-terminal methyltransferase and C-terminal SF2 translocase
      domains to occlude EcoB/EcoK Type I R-M complexes on incoming phage DNA remains to be structurally resolved.
    boundary: Map C4 to GO:0003729 (mRNA binding) and GO:0017148 (negative regulation of translation), DarB to GO:0003678
      (DNA helicase activity) and GO:0099018 (symbiont-mediated evasion of host restriction-modification system), and PacA/PacB
      to GO:0098008 (viral DNA genome packaging, headful packaging).
    gap_kind:
