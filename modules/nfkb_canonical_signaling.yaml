id: MODULE:nfkb_canonical_signaling
title: Canonical NF-kappaB signaling pathway module
description: >-
  A compact canonical NF-kappaB module. Pro-inflammatory receptors such as TNFR1
  assemble adaptor/ubiquitin ligase complexes, activate the IKK complex, induce
  phosphorylation and proteasomal destruction of IkappaB inhibitors, and release
  NF-kappaB dimers to enter the nucleus and drive inflammatory, survival, and
  immune-response genes. The module is grounded in GO:0007249 and includes
  curated TNFR1, TRAF2, TAK1-TAB, IKK, IkappaB, and NF-kappaB exemplars, with PTN
  anchors where PAINT seed rows support the role.
status: DRAFT
notes: >-
  TAK1 step (2026-10-06): the TAK1-TAB complex (MAP3K7 with TAB1 and TAB2/TAB3) was added as the
  IKKbeta-activating kinase step between the receptor-proximal ubiquitin scaffold and IKK activation,
  matching the tak1_tab_kinase_activation part in MODULE:tnf_signaling and MODULE:nlr_signaling and
  the MAP3K7 gene review. Before this, the receptor/TRAF tier was linked directly to IKK, which
  omitted the kinase that phosphorylates the IKKbeta activation loop. Only the IKKbeta-directed
  (GO:0004674) activity of TAK1 is modelled here; its MAP3K (GO:0004709) activity toward
  p38/JNK MAP2Ks is outside this module and is modelled in the TNF and NLR modules.
evidence:
  - source_id: GO:0007249
    title: canonical NF-kappaB signal transduction
    statement: The module is grounded in the GO biological process term for canonical NF-kappaB signaling.
module:
  id: nfkb_canonical_signaling
  label: Canonical NF-kappaB signal transduction
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: canonical NF-kappaB signal transduction
      term:
        id: GO:0007249
        label: canonical NF-kappaB signal transduction
      description: IKK-dependent activation of NF-kappaB through IkappaB degradation.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: receptor-proximal activation
      node:
        id: nfkb_receptor_complex
        label: TNF-family receptor/adaptor complex
        module_type: REGULATORY_STEP
        description: >-
          Ligand-bound TNFR-family receptors recruit adaptor proteins and TRAF
          ubiquitin ligases that build ubiquitin scaffolds for IKK activation.
        annotons:
          - id: tnfr1_receptor
            label: TNFR1 receptor input
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TNFRSF1A receptor family
                term:
                  id: PANTHER:PTHR46861
                  label: TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 1A
                representative_members:
                  - preferred_term: TNFRSF1A
                    term:
                      id: UniProtKB:P19438
                      label: Tumor necrosis factor receptor superfamily member 1A
                ancestral_nodes:
                  - preferred_term: PAINT TNFR1 receptor node PTN002930098
                    term:
                      id: PANTHER:PTN002930098
                      label: PTN002930098
                    description: >-
                      PANTHER PAINT node in PTHR46861 with IBD support for
                      tumor necrosis factor receptor activity (F:GO:0005031)
                      and tumor necrosis factor binding (F:GO:0043120).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002930098 in PTHR46861.
            function:
              preferred_term: tumor necrosis factor receptor activity
              term:
                id: GO:0005031
                label: tumor necrosis factor receptor activity
            role_description: Cell-surface receptor exemplar for canonical inflammatory NF-kappaB activation.
          - id: traf_adaptor_ligase
            label: TRAF adaptor/E3 ubiquitin ligase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TRAF adaptor/ubiquitin ligase family
                term:
                  id: PANTHER:PTHR10131
                  label: TNF RECEPTOR ASSOCIATED FACTOR
                representative_members:
                  - preferred_term: TRAF2
                    term:
                      id: UniProtKB:Q12933
                      label: TNF receptor-associated factor 2
                ancestral_nodes:
                  - preferred_term: PAINT TRAF NF-kappaB regulation node PTN000805648
                    term:
                      id: PANTHER:PTN000805648
                      label: PTN000805648
                    description: >-
                      PANTHER PAINT node in PTHR10131 with IBD support for
                      regulation of canonical NF-kappaB signal transduction
                      (P:GO:0043122).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000805648 in PTHR10131.
            processes:
              - preferred_term: regulation of canonical NF-kappaB signal transduction
                term:
                  id: GO:0043122
                  label: regulation of canonical NF-kappaB signal transduction
            role_description: Receptor-proximal scaffold/ligase tier that couples TNFR signaling to IKK.
    - order: 2
      role: ubiquitin-activated IKKbeta kinase
      node:
        id: tak1_tab_kinase_activation
        label: TAK1-TAB kinase complex activation
        module_type: REGULATORY_STEP
        description: >-
          The TAK1-TAB complex (TAK1 kinase with TAB1 and the ubiquitin-binding subunits TAB2/TAB3)
          binds K63-linked (and unanchored) polyubiquitin chains built by the receptor-proximal
          TRAF/RIPK/IRAK scaffold through the TAB2/TAB3 Npl4 zinc fingers, and TAK1 is activated.
          Activated TAK1 phosphorylates the IKKbeta activation loop (Ser177/Ser181), which commits
          canonical NF-kappaB signaling. NEMO binding to the same K63/M1-linked chains brings IKK
          to TAK1, and IKKbeta trans-autophosphorylation then amplifies IKK activity (step 3).
          TRAFs and RIPK1 provide the docking platform and do not phosphorylate IKK themselves.
        annotons:
          - id: tak1_complex_ikkbeta_kinase
            label: TAK1-TAB complex IKKbeta kinase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: TAK1-TAB kinase complex
                term:
                  id: GO:0097076
                  label: transforming growth factor beta activated kinase 1 complex
                active_units:
                  - id: tak1_catalytic_subunit
                    label: TAK1 catalytic subunit
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: TAK1/MAP3K7 ortholog group
                        term:
                          id: PANTHER:PTHR46716:SF1
                          label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
                        representative_members:
                          - preferred_term: MAP3K7
                            term:
                              id: UniProtKB:O43318
                              label: Mitogen-activated protein kinase kinase kinase 7
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN000723805 for TAK1
                            term:
                              id: PANTHER:PTN000723805
                              label: PTN000723805
                            description: Local PAINT IBD node in PTHR46716 (Bilateria root) seeded by
                              UniProtKB:O43318 with propagated terms F:GO:0004709, P:GO:0007254,
                              P:GO:0043123.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000723805 in PTHR46716.
                        evidence:
                          - source_id: file:interpro/panther/PTHR46716/PTHR46716-review.yaml
                            title: PTHR46716 family review
                            statement: Family review of the bilaterian TAK1 ortholog group used to
                              orient the family-level grounding of the catalytic subunit.
                    role: catalytic serine/threonine kinase subunit
                  - id: tab1_activating_subunit
                    label: TAB1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAB1
                        term:
                          id: UniProtKB:Q15750
                          label: TGF-beta-activated kinase 1 and MAP3K7-binding protein 1
                    role: constitutive TAK1-binding subunit that promotes TAK1 autophosphorylation
                  - id: tab2_tab3_ubiquitin_receptor
                    label: TAB2/TAB3 ubiquitin receptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAB2
                        term:
                          id: UniProtKB:Q9NYJ8
                          label: TGF-beta-activated kinase 1 and MAP3K7-binding protein 2
                      description: TAB2 and its paralog TAB3 (UniProtKB:Q8N5C8) act redundantly in
                        this position.
                    role: Npl4 zinc finger receptor for K63-linked polyubiquitin that couples the
                      ubiquitin scaffold to TAK1 activation
                    function:
                      preferred_term: K63-linked polyubiquitin modification-dependent protein binding
                      term:
                        id: GO:0070530
                        label: K63-linked polyubiquitin modification-dependent protein binding
                    evidence:
                      - source_id: PMID:15327770
                        statement: TAB2 and TAB3 bind K63 chains through their zinc finger.
                        supporting_text: TAB2 and TAB3 are receptors that bind preferentially to lysine
                          63-linked polyubiquitin chains through a highly conserved zinc finger (ZnF)
                          domain.
                      - source_id: PMID:14633987
                        statement: TAB2 and TAB3 act redundantly to activate TAK1 and NF-kappaB.
                        supporting_text: Cotransfection of siRNAs directed against both TAB2 and TAB3
                          inhibit both IL-1- and TNF-induced activation of TAK1 and NF-kappaB.
            function:
              preferred_term: protein serine/threonine kinase activity (IKKbeta activation loop)
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: IKBKB (IKKbeta)
                  term:
                    id: UniProtKB:O14920
                    label: Inhibitor of nuclear factor kappa-B kinase subunit beta
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Ubiquitin-activated TAK1 complex phosphorylates and activates IKKbeta, the upstream
              kinase step of the canonical cascade.
            evidence:
              - source_id: PMID:11460167
                statement: The purified TAK1-TAB1-TAB2 complex phosphorylates and activates IKK.
                supporting_text: We find that the TAK1 kinase complex phosphorylates and activates
                  IKK in a manner that depends on TRAF6 and Ubc13-Uev1A.
              - source_id: PMID:19675569
                statement: Unanchored K63-linked polyubiquitin activates TAK1 through TAB2.
                supporting_text: free Lys 63 polyubiquitin chains, which are not conjugated to any
                  target protein, directly activate TAK1 by binding to the ubiquitin receptor TAB2
              - source_id: PMID:14633987
                statement: TAK1 is required for IL-1- and TNF-induced NF-kappaB activation.
                supporting_text: TAK1, a MAPKKK, is critical for both IL-1- and TNF-induced activation
                  of the NF-kappaB pathway.
              - source_id: file:genes/human/MAP3K7/MAP3K7-ai-review.yaml
                title: MAP3K7 gene review
                statement: Core function of MAP3K7 as the ubiquitin-activated IKKbeta kinase (GO:0004674)
                  in the cytosol, as part of the TAK1 complex (GO:0097076).
    - order: 3
      role: IKK activation and IkappaB phosphorylation
      node:
        id: ikk_activation
        label: IKK complex activation
        module_type: REACTION
        description: >-
          NEMO/IKKgamma-bound IKK alpha and IKK beta are activated and
          phosphorylate IkappaB inhibitors, marking them for ubiquitin-dependent
          degradation.
        annotons:
          - id: ikk_kinase
            label: IKK alpha/beta catalytic subunits
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IkappaB kinase family
                term:
                  id: PANTHER:PTHR22969
                  label: IKB KINASE
                representative_members:
                  - preferred_term: CHUK
                    term:
                      id: UniProtKB:O15111
                      label: Inhibitor of nuclear factor kappa-B kinase subunit alpha
                  - preferred_term: IKBKB
                    term:
                      id: UniProtKB:O14920
                      label: Inhibitor of nuclear factor kappa-B kinase subunit beta
                ancestral_nodes:
                  - preferred_term: PAINT IKK positive NF-kappaB node PTN000540281
                    term:
                      id: PANTHER:PTN000540281
                      label: PTN000540281
                    description: >-
                      PANTHER PAINT node in PTHR22969 with IBD support for
                      positive regulation of canonical NF-kappaB signal
                      transduction (P:GO:0043123).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000540281 in PTHR22969.
                  - preferred_term: PAINT IKK kinase node PTN001491808
                    term:
                      id: PANTHER:PTN001491808
                      label: PTN001491808
                    description: >-
                      PANTHER PAINT node in PTHR22969 with IBD support for
                      protein serine/threonine kinase activity (F:GO:0004674).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001491808 in PTHR22969.
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: IkappaB inhibitor proteins
            role_description: Catalytic kinase tier that commits the canonical cascade.
          - id: ikb_inhibitor
            label: IkappaB inhibitor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NFKBIA
                term:
                  id: UniProtKB:P25963
                  label: NF-kappa-B inhibitor alpha
            role_description: Cytosolic inhibitor degraded after IKK phosphorylation.
    - order: 4
      role: NF-kappaB nuclear transcriptional output
      node:
        id: nfkb_transcriptional_output
        label: NF-kappaB dimer nuclear entry and transcription
        module_type: REGULATORY_STEP
        description: >-
          Degradation of IkappaB exposes nuclear localization signals on
          NF-kappaB dimers such as p50/RELA, allowing nuclear import and target
          gene activation.
        annotons:
          - id: nfkb_dimer
            label: NF-kappaB p50/RELA dimer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: NF-kappaB transcription factor dimer
                active_units:
                  - id: nfkb1_p50
                    label: NFKB1/p50
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NFKB1
                        term:
                          id: UniProtKB:P19838
                          label: Nuclear factor NF-kappa-B p105 subunit
                    role: DNA-binding p50 subunit
                  - id: rela_p65
                    label: RELA/p65
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RELA
                        term:
                          id: UniProtKB:Q04206
                          label: Transcription factor p65
                    role: transactivation subunit
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Transcription factor output of the canonical pathway.
  connections:
    - source: nfkb_receptor_complex
      target: tak1_tab_kinase_activation
      connection_type: CAUSES
      description: >-
        Receptor-proximal K63-linked (and unanchored) polyubiquitin chains recruit the TAK1-TAB
        complex through the TAB2/TAB3 ubiquitin-binding zinc fingers, and TAK1 is activated.
      evidence:
        - source_id: PMID:15327770
          statement: TAB2 and TAB3 are K63-polyubiquitin receptors.
          supporting_text: TAB2 and TAB3 are receptors that bind preferentially to lysine
            63-linked polyubiquitin chains through a highly conserved zinc finger (ZnF)
            domain.
        - source_id: PMID:19675569
          statement: Unanchored K63-linked polyubiquitin activates TAK1 through TAB2.
          supporting_text: free Lys 63 polyubiquitin chains, which are not conjugated to any
            target protein, directly activate TAK1 by binding to the ubiquitin receptor TAB2
    - source: tak1_tab_kinase_activation
      target: ikk_activation
      connection_type: CAUSES
      description: >-
        Activated TAK1 phosphorylates the IKKbeta activation loop. NEMO binding to the same
        polyubiquitin chains brings IKK to TAK1, and IKKbeta trans-autophosphorylation
        amplifies IKK activity.
      evidence:
        - source_id: PMID:11460167
          statement: The TAK1 kinase complex phosphorylates and activates IKK.
          supporting_text: We find that the TAK1 kinase complex phosphorylates and activates IKK in a
            manner that depends on TRAF6 and Ubc13-Uev1A.
        - source_id: PMID:19675569
          statement: Polyubiquitin chains bound by NEMO mediate IKK activation.
          supporting_text: suggesting that the polyUb chains activate IKK by direct binding to NEMO.
    - source: ikk_activation
      target: nfkb_transcriptional_output
      connection_type: CAUSES
      description: IKK-dependent IkappaB degradation releases NF-kappaB dimers for nuclear import.
