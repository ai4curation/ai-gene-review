                      label: Muropeptide permease AmpG
                  - preferred_term: Escherichia coli AmpG
                    term:
                      id: UniProtKB:P0AE16
                      label: Muropeptide permease AmpG
            function:
              preferred_term: muropeptide transmembrane transporter activity
              term:
