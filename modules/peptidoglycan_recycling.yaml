id: MODULE:peptidoglycan_recycling
title: Pseudomonas-type anabolic peptidoglycan recycling
description: >-
  A reusable Gram-negative bacterial recycling route that imports soluble
  anhydromuropeptides, separates their GlcNAc, anhMurNAc, and stem-peptide
  components, and returns both MurNAc and the recovered peptide to
  peptidoglycan precursor synthesis. The sugar arm uses AnmK, MupP, AmgK, and
  MurU to regenerate UDP-MurNAc. This anabolic branch is characteristic of
  Pseudomonas and other bacteria that lack the MurQ catabolic diversion.
  Periplasmic generation of turnover fragments and downstream polymerization
  of peptidoglycan are outside the boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009254
    title: peptidoglycan turnover
    statement: Defines the biological-process boundary for recovery of cell-wall material.
  - source_id: PMID:23831760
    title: A cell wall recycling shortcut that bypasses peptidoglycan de novo biosynthesis.
    statement: >-
      Direct P. putida work establishes AmgK and MurU as a salvage shortcut
      that channels MurNAc to UDP-MurNAc.
    supporting_text: >-
      The anomeric sugar kinase AmgK and the MurNAc α-1-phosphate uridylyl transferase MurU
  - source_id: PMID:28351914
    title: The N-Acetylmuramic Acid 6-Phosphate Phosphatase MupP Completes the Pseudomonas Peptidoglycan Recycling Pathway Leading to Intrinsic Fosfomycin Resistance.
    statement: >-
      Full-text target-species evidence establishes MupP and gives the complete
      P. putida pathway model from AmpG import through the anabolic sugar arm.
    supporting_text: >-
      specifically converts MurNAc 6-phosphate to MurNAc
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__peptidoglycan-recycling__ppu00520-deep-research-openscientist.md
    title: OpenScientist PSEPK peptidoglycan-recycling synthesis
    statement: >-
      Species-aware retrieval used to distinguish the eight recycling members
      from broad KEGG nucleotide-sugar spillover and from MurA/MurB de novo synthesis.
  - source_id: RHEA:24952
    title: AnmK reaction
    statement: Defines ring opening and phosphorylation of anhMurNAc to MurNAc-6-phosphate.
  - source_id: RHEA:53728
    title: MupP reaction
    statement: Defines hydrolysis of MurNAc-6-phosphate to MurNAc and phosphate.
  - source_id: RHEA:53720
    title: AmgK MurNAc reaction
    statement: Defines C1 phosphorylation of MurNAc to MurNAc-alpha-1-phosphate.
  - source_id: RHEA:53716
    title: MurU reaction
    statement: Defines uridylyl transfer yielding UDP-MurNAc.
  - source_id: RHEA:29563
    title: Mpl reaction
    statement: Defines ligation of the recovered stem tripeptide to UDP-MurNAc.
notes: >-
  The module models an anabolic wall-to-wall recycling route. MurA and MurB are
  de novo UDP-MurNAc enzymes and are deliberately excluded. MurQ is not a
  required alternate part because it diverts MurNAc-6-phosphate to catabolism
  and is absent from the P. putida instance. Lytic transglycosylases generate
  the imported substrate upstream but form a many-paralog turnover system
  rather than a single required leaf in this module. No generic cytoplasm or
  membrane term is asserted at module level; locations belong to individual
  activities.
