                  supporting_text: for a muropeptide to be imported by the AmpG permease, it must contain the disaccharide GlcNAc-anhMurNAc
            processes:
              - preferred_term: peptidoglycan turnover
                term:
                  id: GO:0009254
                  label: peptidoglycan turnover
            locations:
