id: MODULE:bombesin_receptor_signaling
title: Bombesin receptor signaling pathway module
description: >-
  The bombesin receptor signaling pathway (GO:0031989) is initiated when the secreted,
  C-terminally alpha-amidated mammalian bombesin-like neuropeptide hormones gastrin-releasing
  peptide (GRP, PANTHER:PTHR16866:SF2) and neuromedin B (NMB, PANTHER:PTHR16866:SF3) bind and
  activate their cognate seven-transmembrane G protein-coupled receptors GRPR (BB2,
  PANTHER:PTHR45695:SF7) and NMBR (BB1, PANTHER:PTHR45695:SF8) at the plasma membrane of
  central nervous system neurons, gastrointestinal endocrine/smooth-muscle cells, and anterior
  pituitary thyrotrophs. Agonist-bound GRPR and NMBR couple primarily to heterotrimeric Gq/11
  proteins (exemplified by GNAQ, PANTHER:PTHR10218:SF329) to stimulate phospholipase C-beta
  (PLCB1, PANTHER:PTHR10336:SF12), generating inositol 1,4,5-trisphosphate (IP3) and
  diacylglycerol (DAG) to mobilize intracellular Ca2+ and regulate gastrin secretion, smooth-muscle
  contraction, sighing, itch transmission, and circadian/neuroendocrine rhythms.
status: DRAFT
evidence:
  - source_id: GO:0031989
    title: bombesin receptor signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the bombesin receptor
      signaling pathway (GO:0031989: the series of molecular signals generated as a consequence
      of a bombesin receptor binding to its physiological ligand).
  - source_id: Reactome:R-HSA-375384
    title: Bombesin-like receptors bind bombesin homologues
    supporting_text: >-
      Bombesin-like receptors are widely distributed in the CNS as well as in the GI tract where
      they modulate smooth-muscle contraction, exocrine and endocrine processes, metabolism, and
      behaviour through the binding of bombesin-like peptides. They include gastrin-releasing
      peptide receptor (GRP-R), neuromedin B receptor (NMB-R) (Corjay MH et al, 1991) and
      bombesin-like receptor-3 (BRS-3) (Fathi Z et al, 1993).
    statement: >-
      Establishes that mammalian bombesin-like peptides (GRP and NMB) bind and activate GRPR
      and NMBR to initiate bombesin receptor signaling.
  - source_id: PMID:3211139
    title: Posttranslational processing of endogenous and of baculovirus-expressed human gastrin-releasing peptide precursor.
    supporting_text: >-
      In the small-cell lung cancer cell line, GRP1-27 was cleaved as expected from the endogenous
      prohormone at a pair of basic amino acids (29 and 30) and alpha-amidated at its C-terminal
      methionine
    statement: >-
      Demonstrates proteolytic processing and C-terminal alpha-amidation of human pro-GRP to
      mature bioactive GRP1-27.
  - source_id: PMID:2458345
    title: Molecular cloning of cDNAs encoding the human bombesin-like peptide neuromedin B. Chromosomal localization and comparison to cDNAs encoding its amphibian homolog ranatensin.
    supporting_text: >-
      The amidated decapeptide neuromedin B (NMB) is the mammalian homolog of the amphibian
      bombesin-like peptide ranatensin. cDNAs encoding human neuromedin B and amphibian
      ranatensin were isolated from human hypothalamic and Rana pipiens skin libraries,
      respectively.
    statement: >-
      Establishes human NMB as a secreted bombesin-like neuropeptide precursor homologous to
      amphibian ranatensin and GRP.
  - source_id: PANTHER:PTN008565241
    title: PAINT node PTN008565241 for bombesin-like peptides (PTHR16866)
    statement: >-
      Local PAINT IBD node in PTHR16866 with propagated terms C:GO:0005576, F:GO:0005184,
      P:GO:0007218; PAINT date 20260529.
notes: >-
  Curated signaling-pathway module for the bombesin receptor signaling pathway (GO:0031989)
  built with PANTHER FAMILY/subfamily selectors across the endogenous bombesin-like peptide
  ligands GRP (PANTHER:PTHR16866:SF2) and NMB (PANTHER:PTHR16866:SF3), their cognate G
  protein-coupled receptors GRPR (PANTHER:PTHR45695:SF7) and NMBR (PANTHER:PTHR45695:SF8),
  and downstream Gq/11 alpha (GNAQ, PANTHER:PTHR10218:SF329) and phospholipase C-beta (PLCB1,
  PANTHER:PTHR10336:SF12) signaling effectors.
