  - order: 6
    role: Hold substrates secretion-competent and gate the order of export
    optional: true
    node:
      id: substrate_gating_and_chaperones
      label: Substrate gating and cytoplasmic chaperones
      module_type: REGULATORY_STEP
      description: >-
        A gatekeeper protein withholds later substrates until the translocon is
        in place, and cytoplasmic chaperones hold substrates in a
        secretion-competent state and deliver them to the sorting platform. Both
        are conserved in role but variable in identity and number, so the part is
        optional.
      annotons:
      - id: sctw_gatekeeper
        label: SctW-family gatekeeper
        participant:
          selector_type: FAMILY
          family:
            preferred_term: SctW/InvE-family gatekeeper family
            representative_members:
            - preferred_term: InvE (Salmonella typhimurium)
              term:
                id: UniProtKB:P35671
                label: Invasion protein InvE
            - preferred_term: SepL (Escherichia coli O127:H6, unreviewed entry)
              term:
                id: UniProtKB:B7UM95
                label: Secretion switching protein SepL
        processes:
        - preferred_term: protein secretion by the type III secretion system
          term:
            id: GO:0030254
            label: protein secretion by the type III secretion system
        locations:
        - preferred_term: cytoplasm
          term:
            id: GO:0005737
            label: cytoplasm
        role_description: >-
          Withholds later substrates until translocon components have been
          exported, imposing an order on secretion.
        notes: >-
          No molecular function is asserted. Gating here is a negative control
          exercised through occupancy rather than an activity any GO molecular
          function term expresses.
      - id: t3ss_chaperone
        label: Type III secretion cytoplasmic chaperone
        participant:
          selector_type: FAMILY
          family:
            preferred_term: type III secretion cytoplasmic chaperone family
            representative_members:
            - preferred_term: CesT (Escherichia coli O127:H6)
              term:
                id: UniProtKB:P21244
                label: Tir chaperone
        processes:
        - preferred_term: protein secretion by the type III secretion system
          term:
            id: GO:0030254
            label: protein secretion by the type III secretion system
        locations:
        - preferred_term: cytoplasm
          term:
            id: GO:0005737
            label: cytoplasm
        role_description: >-
          Binds its substrate in the cytoplasm, keeps it from folding or
          aggregating, and delivers it to the sorting platform, where the ATPase
          releases it.
        notes: >-
          No molecular function is asserted. GOA gives this chaperone only
          protein binding, and the obvious alternative, unfolded protein binding,
          is obsolete; see the knowledge gaps. Chaperone-substrate pairing for
          individual cargo is outside the module boundary.
  connections:
  - source: substrate_gating_and_chaperones
    target: sorting_platform_and_atpase
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      Chaperones deliver their substrates to the cytoplasmic platform, and the
      gatekeeper determines which class of substrate is admitted when.
  - source: sorting_platform_and_atpase
    target: export_apparatus
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The platform hands stripped substrates to the export gate at the inner
      membrane.
  - source: export_apparatus
    target: basal_body
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The export apparatus sits within the basal body rings, which continue the
      conduit across the periplasm and outer membrane.
  - source: basal_body
    target: extracellular_conduit
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The secretin provides the opening from which the inner rod and needle
      extend.
  - source: extracellular_conduit
    target: translocon
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The distal end of the conduit delivers the translocon proteins and then
      docks onto the pore they form.
  - source: export_apparatus
    target: substrate_gating_and_chaperones
    connection_type: POSITIVELY_REGULATES
    description: >-
      Autoprocessing within the export apparatus changes which substrate class is
      accepted, which is the event the gatekeeper's release is coordinated with.
  knowledge_gaps:
  - gap_statement: >-
      What energizes translocation through the needle is not settled. The
      proton-motive force is generally held to drive it while the ATPase acts on
      chaperone release, but the division of labour between them is unresolved.
    boundary: >-
      Assert ATP hydrolysis for the ATPase and no energetic function for any
      other part, and record the proton-motive-force account in prose rather than
      as an annotation.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Cytoplasmic chaperones and the gatekeeper have no molecular function term
      that fits. GOA gives the chaperone only protein binding, and unfolded
      protein binding, which would have been the natural choice, is obsolete, so
      the holdase-like role is inexpressible without overstating it.
    boundary: >-
      Assert no molecular function for the chaperone or the gatekeeper and record
      their roles in prose, rather than borrowing the holdase term used for the
      periplasmic chaperones of the type V module.
    gap_kind:
    - ONTOLOGY
  - gap_statement: >-
      Most structural components of the Escherichia coli locus-of-enterocyte-effacement
      system exist only as unreviewed UniProt entries, and one of them carries a
      name suggesting proton transport that its role does not support. The
      conserved roles are therefore grounded on Salmonella and Yersinia exemplars
      with the Escherichia coli counterparts attached.
    boundary: >-
      Mark every unreviewed exemplar as such on its annoton, and never let an
      unreviewed entry's name drive the asserted function.
    gap_kind:
    - CURATION
  - gap_statement: >-
      The filament-extended architecture has no clear counterpart to the tip
      complex that caps a bare needle, and how the capping and
      pore-nucleating roles are divided among the filament and translocon
      proteins in those systems is not established.
    boundary: >-
      Assert no Escherichia coli exemplar for the tip-complex annoton and keep
      the filament as an added component of the conduit rather than assigning it
      the tip role.
    gap_kind:
    - BIOLOGY
