id: MODULE:bacterial_type_iii_secretion_injectisome
title: Bacterial type III secretion injectisome
description: >-
  A species-neutral module for the injectisome, the envelope-spanning type III
  secretion machine that moves unfolded substrates from the bacterial cytoplasm
  through a continuous conduit and across a second, target-cell membrane in one
  step. A cytoplasmic sorting platform and ATPase select substrates and strip
  their chaperones; an inner-membrane export apparatus forms the narrow channel;
  rings in the inner membrane and an outer-membrane secretin complete the basal
  body; an inner rod and a helical needle extend the conduit beyond the cell
  surface; and a translocon inserted in the target membrane completes the
  passage. The substrates themselves are excluded from this module, as are
  chaperone-substrate pairing for individual cargo, transcriptional regulation
  of the locus, and the flagellar export system, which is homologous but builds
  a different structure.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0030254
  title: protein secretion by the type III secretion system
  statement: GO:0030254 defines the biological process modeled by the assembled machine.
- source_id: GO:0030257
  title: type III protein secretion system complex
  statement: >-
    GO:0030257 identifies the assembled machinery represented by the module
    parts. It is a complex rather than a cellular anatomical entity, so it is
    recorded here rather than used as an annoton location.
- source_id: PMID:28392566
  title: >-
    Assembly, structure, function and regulation of type III secretion systems.
  statement: >-
    The review that introduced the unified Sct nomenclature used throughout this
    module, and the source for the part boundaries: export apparatus, basal body,
    sorting platform, needle, and translocon as distinct subassemblies.
- source_id: PMID:15931226
  title: >-
    Structural characterization of the molecular platform for type III secretion
    system assembly.
  statement: >-
    Establishes the SctJ ring as the assembly platform on which the rest of the
    basal body is built, which is why the two inner-membrane rings and the
    secretin are modeled as one part rather than as independent components.
- source_id: PMID:9545230
  title: >-
    A novel EspA-associated surface organelle of enteropathogenic Escherichia
    coli involved in protein translocation into epithelial cells.
  statement: >-
    Establishes the EspA filament as a surface organelle extending from the
    bacterium and required for translocation, which is the direct evidence for
    the filament-extended variant of the extracellular conduit.
notes: >-
  Reusable boundary: the module begins when the sorting platform selects a
  substrate in the cytoplasm and ends when that substrate passes through the
  translocon. Substrates are excluded for the same reason as in the sibling type
  II, type IV, type V, and type VI modules, and here the exclusion matters more
  than usual because injectisome substrate repertoires are large, lineage
  specific, and unrelated to each other in function.
  The flagellar export system is deliberately not admitted, although the
  export-apparatus and ATPase components are homologous and the repository has a
  separate module for flagellar assembly and export. The two systems build
  different structures from that shared core, and merging them would make the
  needle, secretin, and translocon parts inapplicable to half the module.
  Grounding is uneven by necessity. Every conserved role carries a reviewed
  Swiss-Prot exemplar, taken from Salmonella SPI-1 or Yersinia. The
  enteropathogenic Escherichia coli counterparts are given alongside them, but
  most of the Esc structural proteins exist only as unreviewed UniProt entries,
  which is noted on each annoton where it applies rather than hidden. Two
  Escherichia coli components are reviewed: the translocon protein EspB and the
  chaperone CesT.
