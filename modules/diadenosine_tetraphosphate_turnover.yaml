id: MODULE:diadenosine_tetraphosphate_turnover
title: Diadenosine tetraphosphate (Ap4A) turnover
description: >-
  A reusable metabolic module for the production and removal of diadenosine
  5',5'''-P1,P4-tetraphosphate (Ap4A), a dinucleoside polyphosphate that
  accumulates under stress and has been proposed to act as an intracellular
  signal. Ap4A is made as a side reaction of aminoacyl-tRNA synthetases, either
  by transfer of the aminoacyl-adenylate AMP to ATP (as in lysyl-tRNA
  synthetase) or by direct condensation of two ATP molecules (as in glycyl-tRNA
  synthetase). It is removed by one of three unrelated enzyme chemistries:
  asymmetrical Nudix hydrolases that yield ATP + AMP (animals and other
  eukaryotes), symmetrical ApaH-type hydrolases that yield two ADP
  (proteobacteria), and Ap4A phosphorylases that yield ADP + ATP by
  phosphorolysis (fungi). Downstream Ap4A effectors (for example HINT1 or
  transcription factors) and the related Ap3A/FHIT system are outside the
  module boundary.
status: DRAFT
evidence:
  - source_id: GO:0015966
    title: diadenosine tetraphosphate biosynthetic process
    statement: GO:0015966 describes the synthesis half of the module.
  - source_id: GO:0015967
    title: diadenosine tetraphosphate catabolic process
    statement: GO:0015967 describes the removal half of the module.
  - source_id: PMID:19710017
    title: Crystal structures and biochemical analyses suggest a unique mechanism
      and role for human glycyl-tRNA synthetase in Ap4A homeostasis.
    statement: >-
      Establishes that aminoacyl-tRNA synthetases divert the aminoacylation
      reaction to make Ap4A, either through the aminoacyl-adenylate or, for
      GlyRS, by direct condensation of two ATPs.
    supporting_text: >-
      Crystal structures and biochemical analyses show that human glycyl-tRNA
      synthetase (GlyRS) produces Ap4A by direct condensation of two ATPs,
      independent of glycine concentration.
  - source_id: PMID:27144453
    title: NUDT2 Disruption Elevates Diadenosine Tetraphosphate (Ap4A) and Down-Regulates
      Immune Response and Cancer Promotion Genes.
    statement: >-
      Loss of the asymmetrical hydrolase NUDT2 raises cellular Ap4A, showing
      that the hydrolase sets steady-state Ap4A levels in human cells.
  - source_id: PMID:2174863
    title: Catabolism of bis(5'-nucleosidyl) tetraphosphates in Saccharomyces cerevisiae.
    statement: >-
      Yeast apa1 apa2 double mutants accumulate dinucleoside tetraphosphates,
      showing the phosphorylases act catabolically in vivo.
    supporting_text: >-
      The concentrations of all bis(5'-nucleosidyl) tetraphosphates are
      increased in an apa1 apa2 double mutant, as compared with the parental
      wild-type strain.
  - source_id: file:modules/diadenosine_tetraphosphate_turnover-deep-research-openscientist.md
    title: OpenScientist research for Ap4A turnover
    statement: >-
      Supports the synthesis-plus-removal boundary, the exclusion of HINT1,
      Fhit and extracellular ApnA signalling, and identified the HD-domain YqeK
      family as an additional removal implementation. It also highlights that
      Np4A can be incorporated as 5' RNA caps and that ApaH, YqeK and NUDT2
      also act as decapping enzymes; that RNA-cap biology is recorded in the
      notes but kept outside the module boundary.
  - source_id: file:interpro/panther/PTHR21340/PTHR21340-review.yaml
    title: PTHR21340 family review
    statement: >-
      Family-level assessment of the asymmetrical Ap4A hydrolase family,
      including the PAINT node PTN000482012 that carries GO:0004081.
  - source_id: file:worm/ndx-4/ndx-4-ai-review.yaml
    title: C. elegans ndx-4 gene review
    statement: Q9U2M7 is a biochemically and structurally characterised asymmetrical Ap4A hydrolase.
  - source_id: file:human/NUDT2/NUDT2-ai-review.yaml
    title: NUDT2 (human) gene review
    statement: P50583 is the human asymmetrical Ap4A hydrolase.
  - source_id: file:mouse/Nudt2/Nudt2-ai-review.yaml
    title: Nudt2 (mouse) gene review
    statement: P56380 is the mouse asymmetrical Ap4A hydrolase.
  - source_id: file:DROME/Datp/Datp-ai-review.yaml
    title: Drosophila Datp gene review
    statement: Q4V6M1 is the Drosophila asymmetrical Ap4A hydrolase (formerly Apf).
module:
  id: diadenosine_tetraphosphate_turnover
  label: Diadenosine tetraphosphate (Ap4A) turnover
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: diadenosine polyphosphate metabolic process
      term:
        id: GO:0015959
        label: diadenosine polyphosphate metabolic process
      description: >-
        GO has no current Ap4A-specific metabolic-process term (the former
        diadenosine tetraphosphate metabolic process term is obsolete), so the
        diadenosine polyphosphate parent is used for the whole module; the
        synthesis and removal steps use the Ap4A-specific biosynthetic and
        catabolic process terms.
  parts:
    - order: 1
      role: Ap4A synthesis
      node:
        id: ap4a_synthesis_step
        label: Ap4A synthesis by aminoacyl-tRNA synthetases
        module_type: REACTION
        concepts:
          - preferred_term: diadenosine tetraphosphate biosynthetic process
            term:
              id: GO:0015966
              label: diadenosine tetraphosphate biosynthetic process
        variant_sets:
          - id: ap4a_synthesis_mechanism
            label: Ap4A synthesis mechanism
            axis: enzyme mechanism
            selection: ONE_OR_MORE
            notes: >-
              Both routes have the same net stoichiometry (2 ATP = Ap4A +
              diphosphate), which is what GO:0141192 describes. Several class I
              and class II synthetases can make Ap4A in vitro; lysyl- and
              glycyl-tRNA synthetases are used as exemplars because their Ap4A
              production is best characterised in cells.
            variants:
              - id: aminoacyl_adenylate_route
                label: Aminoacyl-adenylate route (LysRS type)
                module_type: REACTION
                description: >-
                  The aminoacyl-AMP intermediate of tRNA aminoacylation is
                  attacked by ATP instead of tRNA, releasing the amino acid and
                  Ap4A. Ap4A output therefore depends on the cognate amino acid.
                  In stimulated mammalian mast cells, phosphorylated LysRS leaves
                  the multi-tRNA synthetase complex and produces Ap4A in the
                  nucleus.
                annotons:
                  - id: lysrs_ap4a_synthesis
                    label: LysRS Ap4A synthesis
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: lysyl-tRNA synthetases (class II)
                        term:
                          id: PANTHER:PTHR42918:SF9
                          label: LYSINE--TRNA LIGASE
                        representative_members:
                          - preferred_term: KARS1 (human)
                            term:
                              id: UniProtKB:Q15046
                              label: Lysine--tRNA ligase
                    function:
                      preferred_term: ATP:ATP adenylyltransferase activity
                      term:
                        id: GO:0141192
                        label: ATP:ATP adenylyltransferase activity
                      substrates:
                        - preferred_term: ATP
                      products:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: diphosphate
                    role_description: >-
                      Makes Ap4A from the lysyl-adenylate intermediate and ATP;
                      the canonical lysine-tRNA ligase activity is the primary
                      function of the enzyme and is not part of this module.
                    evidence:
                      - source_id: PMID:23159739
                        title: Structural switch of lysyl-tRNA synthetase between
                          translation and transcription.
                        statement: >-
                          Phosphorylation releases LysRS from the multi-tRNA
                          synthetase complex and triggers LysRS-directed Ap4A
                          production.
                        supporting_text: >-
                          triggers LysRS-directed production of the second
                          messenger Ap(4)A that activates MITF
              - id: direct_atp_condensation_route
                label: Direct ATP condensation route (GlyRS type)
                module_type: REACTION
                description: >-
                  An insertion domain in glycyl-tRNA synthetase forms a second
                  ATP pocket, allowing direct condensation of two ATP molecules
                  independently of glycine.
                annotons:
                  - id: glyrs_ap4a_synthesis
                    label: GlyRS Ap4A synthesis
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: glycyl-tRNA synthetases (class II, eukaryotic type)
                        term:
                          id: PANTHER:PTHR10745:SF0
                          label: GLYCINE--TRNA LIGASE
                        representative_members:
                          - preferred_term: GARS1 (human)
                            term:
                              id: UniProtKB:P41250
                              label: Glycine--tRNA ligase
                    function:
                      preferred_term: ATP:ATP adenylyltransferase activity
                      term:
                        id: GO:0141192
                        label: ATP:ATP adenylyltransferase activity
                      substrates:
                        - preferred_term: ATP
                      products:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: diphosphate
                    role_description: Condenses two ATP molecules directly into Ap4A.
                    evidence:
                      - source_id: PMID:19710017
                        title: Crystal structures and biochemical analyses suggest
                          a unique mechanism and role for human glycyl-tRNA synthetase
                          in Ap4A homeostasis.
                        statement: GlyRS forms Ap4A from two ATPs without glycine.
                        supporting_text: >-
                          the second ATP pocket is formed by an insertion domain
                          that is unique to GlyRS, suggesting that GlyRS is the
                          only tRNA synthetase catalyzing direct Ap4A synthesis
    - order: 2
      role: Ap4A removal
      node:
        id: ap4a_removal_step
        label: Ap4A removal
        module_type: REACTION
        concepts:
          - preferred_term: diadenosine tetraphosphate catabolic process
            term:
              id: GO:0015967
              label: diadenosine tetraphosphate catabolic process
        variant_sets:
          - id: ap4a_removal_chemistry
            label: Ap4A removal chemistry
            axis: enzyme chemistry and lineage
            selection: ONE_OR_MORE
            notes: >-
              The four implementations are evolutionarily unrelated and use
              three chemistries with different products. A given organism usually relies on one of
              them, but some carry more than one Ap4A-degrading activity, so
              the selection is ONE_OR_MORE.
            variants:
              - id: asymmetrical_nudix_hydrolase
                label: Asymmetrical Nudix hydrolase (NUDT2 type)
                module_type: REACTION
                description: >-
                  A small Nudix-fold hydrolase cleaves Ap4A between the
                  gamma and delta phosphates to give ATP + AMP. This is the
                  animal implementation; the same subfamily occurs in other
                  eukaryotes, archaea and many bacteria.
                annotons:
                  - id: nudt2_asymmetrical_hydrolysis
                    label: NUDT2-type asymmetrical Ap4A hydrolysis
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: asymmetrical Ap4A hydrolases (Nudix)
                        term:
                          id: PANTHER:PTHR21340:SF0
                          label: BIS(5'-NUCLEOSYL)-TETRAPHOSPHATASE [ASYMMETRICAL]
                        representative_members:
                          - preferred_term: NUDT2 (human)
                            term:
                              id: UniProtKB:P50583
                              label: Bis(5'-nucleosyl)-tetraphosphatase [asymmetrical]
                          - preferred_term: NUDT2 (pig)
                            term:
                              id: UniProtKB:P50584
                              label: Bis(5'-nucleosyl)-tetraphosphatase [asymmetrical]
                          - preferred_term: Nudt2 (mouse)
                            term:
                              id: UniProtKB:P56380
                              label: Bis(5'-nucleosyl)-tetraphosphatase [asymmetrical]
                          - preferred_term: ndx-4 (Caenorhabditis elegans)
                            term:
                              id: UniProtKB:Q9U2M7
                              label: Bis(5'-nucleosyl)-tetraphosphatase [asymmetrical]
                          - preferred_term: Datp / Apf (Drosophila melanogaster)
                            term:
                              id: UniProtKB:Q4V6M1
                              label: Bis(5'-nucleosyl)-tetraphosphatase [asymmetrical]
                        ancestral_nodes:
                          - preferred_term: PAINT PTHR21340 root node
                            term:
                              id: PANTHER:PTN000482012
                              label: PTN000482012
                            description: >-
                              PTHR21340 PAINT IBD node carrying GO:0004081,
                              seeded by C0H4F3, P50584 and WBGene00003581. The
                              same node also carries AMP and ATP biosynthetic
                              process IBDs that the family and gene reviews
                              judge to be product-based over-annotations.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  PAINT places bis(5'-nucleosyl)-tetraphosphatase
                                  (asymmetrical) activity at PTN000482012.
                    function:
                      preferred_term: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical)
                        activity
                      term:
                        id: GO:0004081
                        label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
                      substrates:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: water
                      products:
                        - preferred_term: ATP
                        - preferred_term: AMP
                    role_description: Hydrolyses Ap4A asymmetrically to ATP + AMP.
              - id: symmetrical_apah_hydrolase
                label: Symmetrical ApaH-type hydrolase
                module_type: REACTION
                description: >-
                  A metallophosphoesterase-fold hydrolase cleaves Ap4A
                  symmetrically between the beta and gamma phosphates to give
                  two ADP. This is the gamma-proteobacterial implementation.
                annotons:
                  - id: apah_symmetrical_hydrolysis
                    label: ApaH symmetrical Ap4A hydrolysis
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: apaH (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P05637
                          label: Bis(5'-nucleosyl)-tetraphosphatase, symmetrical
                    function:
                      preferred_term: bis(5'-nucleosyl)-tetraphosphatase (symmetrical)
                        activity
                      term:
                        id: GO:0008803
                        label: bis(5'-nucleosyl)-tetraphosphatase (symmetrical) activity
                      substrates:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: water
                      products:
                        - preferred_term: ADP
                    role_description: Hydrolyses Ap4A symmetrically to two ADP.
                    evidence:
                      - source_id: PMID:2986688
                        title: 'Catabolism of bis(5''-nucleosidyl) oligophosphates
                          in Escherichia coli: metal requirements and substrate specificity
                          of homogeneous diadenosine-5'',5''''''-P1,P4-tetraphosphate
                          pyrophosphohydrolase.'
                        statement: >-
                          The purified E. coli enzyme always releases a
                          nucleoside diphosphate from dinucleoside polyphosphates.
                        supporting_text: >-
                          Among the products, a nucleoside diphosphate is always
                          formed.
              - id: symmetrical_yqek_hydrolase
                label: Symmetrical YqeK-type hydrolase (HD domain)
                module_type: REACTION
                description: >-
                  An HD-domain diiron hydrolase of the YqeK family (COG1713)
                  cleaves Ap4A symmetrically to two ADP. It is structurally
                  unrelated to ApaH and replaces it in a group of Gram-positive
                  bacteria that lack ApaH.
                annotons:
                  - id: yqek_symmetrical_hydrolysis
                    label: YqeK symmetrical Ap4A hydrolysis
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: yqeK (Staphylococcus aureus NCTC 8325)
                        term:
                          id: UniProtKB:Q2G297
                          label: Bis(5'-nucleosyl)-tetraphosphatase, symmetrical
                    function:
                      preferred_term: bis(5'-nucleosyl)-tetraphosphatase (symmetrical)
                        activity
                      term:
                        id: GO:0008803
                        label: bis(5'-nucleosyl)-tetraphosphatase (symmetrical) activity
                      substrates:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: water
                      products:
                        - preferred_term: ADP
                    role_description: Hydrolyses Ap4A symmetrically to two ADP in ApaH-lacking Gram-positive bacteria.
                    evidence:
                      - source_id: PMID:32152217
                        title: Functional Characterization of COG1713 (YqeK) as a Novel
                          Diadenosine Tetraphosphate Hydrolase Family.
                        statement: >-
                          YqeK is a symmetrically cleaving Ap4A hydrolase with an
                          HD-domain fold, found in Gram-positive bacteria lacking
                          ApaH, and it affects Ap4A levels in vivo in B. subtilis.
                        supporting_text: >-
                          we identified the YqeK family of proteins (COG1713) as
                          an unprecedented class of symmetrically cleaving Ap4A
                          hydrolases
              - id: fungal_ap4a_phosphorylase
                label: Ap4A phosphorylase (fungal APA1/APA2 type)
                module_type: REACTION
                description: >-
                  A HIT-superfamily phosphorylase cleaves Ap4A by
                  phosphorolysis to ADP + ATP. The reaction is reversible in
                  vitro, but yeast genetics show that it acts catabolically in
                  vivo.
                annotons:
                  - id: apa_phosphorolysis
                    label: APA1/APA2 Ap4A phosphorolysis
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: APA1 (Saccharomyces cerevisiae)
                        term:
                          id: UniProtKB:P16550
                          label: Protein APA1
                    function:
                      preferred_term: ATP:ADP adenylyltransferase activity
                      term:
                        id: GO:0003877
                        label: ATP:ADP adenylyltransferase activity
                      substrates:
                        - preferred_term: P1,P4-bis(5'-adenosyl) tetraphosphate
                        - preferred_term: phosphate
                      products:
                        - preferred_term: ADP
                        - preferred_term: ATP
                    role_description: >-
                      Phosphorolyses Ap4A to ADP + ATP. GO:0003877 is written in
                      the synthetic direction; the module uses it for the
                      catabolic direction shown by apa1 apa2 mutants. The
                      paralogue APA2 (UniProtKB:P22108) has the same activity.
                    evidence:
                      - source_id: PMID:2556364
                        title: Isolation, characterization, and inactivation of
                          the APA1 gene encoding yeast diadenosine 5',5'''-P1,P4-tetraphosphate
                          phosphorylase.
                        statement: APA1 disruption shows the phosphorylase degrades Ap4N in vivo.
                        supporting_text: >-
                          in vivo, Ap4A phosphorylase catabolizes the Ap4N
                          nucleotides
  connections:
    - source: ap4a_synthesis_step
      target: ap4a_removal_step
      connection_type: PROVIDES_INPUT_FOR
      description: Aminoacyl-tRNA synthetases supply the Ap4A that the removal enzymes degrade.
      chaining_status: NOT_APPLICABLE
      chaining_note: Ap4A is not a CoA-carrier intermediate, so the CoA continuity check does not apply.
  notes: >-
    The module boundary is synthesis plus removal of Ap4A. Effectors that bind
    Ap4A (HINT1, MITF/USF2 signalling, Ap4A-binding proteins in bacteria) and
    the Ap3A-specific FHIT branch are downstream or parallel biology and are
    left out. Np4A/Ap4A can also be incorporated as non-canonical 5' RNA caps,
    and the ApaH, YqeK and NUDT2 removal enzymes also decap such RNAs; that
    epitranscriptomic role is a candidate for a separate, connected module.
    Whether Ap4A is a regulated signal or a constitutively cleared by-product
    appears to differ between organisms and is not resolved by this module.
    The asymmetrical Nudix variant is grounded on four completed gene
    reviews and the PTHR21340 family review; the ApaH, APA1 and synthetase
    exemplars (including YqeK) have no gene review in this repository yet. PANTHER families are
    not asserted for ApaH or APA1/APA2 because their PANTHER placements
    (ApaH in PTHR40942:SF4, APA1 and APA2 in different families) were not
    checked against the family trees. PTN000482012 is the PTHR21340 root node
    in the local PAINT data and also carries AMP and ATP biosynthetic process
    IBDs that the reviews judge to be over-annotations; only its GO:0004081
    assertion is used here.
