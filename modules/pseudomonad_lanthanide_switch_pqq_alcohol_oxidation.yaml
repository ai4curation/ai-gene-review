                modelled as a separate step: phosphotransfer from PedS2 to
                PedR2 is represented as a direct His->Asp transfer.
            notes: >-
              PedS2 (sensor, GO:0000155) -> PedR2/ExaE (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer topology.
        parts:
        - order: 1
