id: MODULE:pseudomonad_lanthanide_switch_pqq_alcohol_oxidation
title: Pseudomonad lanthanide-switch PQQ alcohol oxidation
description: >-
  A reusable pseudomonad module coupling PedS2/PedR2 two-component signaling
  to metal-conditioned periplasmic alcohol oxidation. In the absence of usable
  lanthanides, phosphorylated PedR2 favors expression of the calcium-dependent
  PQQ alcohol dehydrogenase PedE. Lanthanide availability shifts the system
  toward the lanthanide-dependent paralog PedH. Both enzymes oxidize diverse
  alcohols in the periplasm and pass electrons to cytochrome c. PQQ
  biosynthesis, downstream aldehyde metabolism, and lanthanide uptake are
  adjacent systems and are outside this module. The enzymes carry the
  cytochrome-c alcohol dehydrogenase assignment, but their specific
  physiological cytochrome c partner in KT2440 remains inferred.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:28655819
    title: Functional role of lanthanides in enzymatic activity and transcriptional regulation of pyrroloquinoline quinone-dependent alcohol dehydrogenases in Pseudomonas putida KT2440
    statement: >-
      Establishes the overlapping alcohol substrate ranges and contrasting
      calcium versus lanthanide requirements of PedE and PedH.
  - source_id: PMID:30158283
    title: The PedS2/PedR2 two-component system is crucial for the rare earth element switch in Pseudomonas putida KT2440
    statement: >-
      Establishes PedS2/PedR2 as the central phosphorelay controlling inverse
      pedE and pedH expression in response to lanthanide availability.
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the sensor-kinase and response-regulator relationship.
  - source_id: GO:0052934
    title: alcohol dehydrogenase (cytochrome c) activity
    statement: Defines the shared catalytic activity of PedE and PedH.
notes: >-
  The module is species-neutral but intentionally limited to the experimentally
  supported pseudomonad Ped system. Pseudomonas putida KT2440 proteins are
  exemplars, not species-specific required members. No PANTHER or PTN selector
  is asserted for PedS2 or PedR2 because their current broad family assignments
  do not establish this regulatory specificity. PedH-dependent feedback on
  pedE/pedH transcription is retained as a knowledge gap rather than assigning
  PedH a transcription-regulatory molecular function.
