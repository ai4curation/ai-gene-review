  knowledge_gaps:
    - gap_statement: >-
        The specific physiological cytochrome c electron-transfer partner for
        PedE and PedH in KT2440 has not been directly demonstrated.
      boundary: >-
        Retain the EC-derived cytochrome-c alcohol dehydrogenase activity while
        avoiding assignment of a particular adjacent cytochrome c as the
        experimentally established partner.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The direct lanthanide-sensing input to PedS2 and the mechanism by which
        PedH protein feeds back on pedE/pedH transcription are unresolved.
      boundary: >-
        Model the experimentally established PedS2/PedR2 control and catalytic
        alternatives without assigning PedH a transcription-regulatory function.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The range of lanthanides that support PedH catalysis and switch behavior
        depends on element identity, concentration, and growth conditions.
      boundary: >-
        Use lanthanide-dependent as the reusable branch definition without
        asserting a universal element preference.
      gap_kind:
        - BIOLOGY
