id: MODULE:myo_inositol_and_inositol_phosphate_biosynthesis
title: myo-Inositol and inositol (pyro)phosphate biosynthesis (MIPS/IMPase and the PLC-IPMK-IPK1-IP6K-PPIP5K route)
description: >-
  myo-Inositol is made de novo from glucose 6-phosphate in two cytosolic steps: myo-inositol-3-phosphate synthase
  (MIPS), an NAD+-dependent isomerase, cyclises glucose 6-phosphate to 1D-myo-inositol 3-phosphate, and a
  lithium-sensitive inositol monophosphatase (IMPase) removes the phosphate to release free myo-inositol. Free
  inositol is used to make phosphatidylinositol and, through the phosphoinositides, the higher soluble inositol
  phosphates. In the lipid-dependent route, phospholipase C cleaves phosphatidylinositol 4,5-bisphosphate to
  diacylglycerol and inositol 1,4,5-trisphosphate (IP3). An inositol polyphosphate multikinase (IPMK; yeast
  Arg82/Ipk2) phosphorylates IP3 to inositol 1,3,4,5-tetrakisphosphate and then to inositol
  1,3,4,5,6-pentakisphosphate (IP5), and inositol-pentakisphosphate 2-kinase (IPK1) completes inositol
  hexakisphosphate (IP6, phytate). IP6 is further pyrophosphorylated to the high-energy inositol pyrophosphates
  by two unrelated kinase families: IP6 kinases (yeast Kcs1, mammalian IP6K) make 5-diphosphoinositol
  pentakisphosphate (IP7), and the PPIP5K/Vip1/Asp1 kinases add a further diphosphate to make IP8. IP6 and the
  inositol pyrophosphates act in mRNA export, phosphate homeostasis, vacuole biogenesis and stress responses.
  Some fungi, including fission yeast, lack the de novo branch and rely on imported inositol.
status: DRAFT
scope: CONCRETE
evidence:
