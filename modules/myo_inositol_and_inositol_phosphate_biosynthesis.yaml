    title: myo-inositol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: INO1 (MYO-INOSITOL-1-PHOSPHATE-SYNTHASE-RXN) and INM1/INM2 (MYO-INOSITOL-1OR-4-MONOPHOSPHATASE-RXN). All retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-2301
  - source_id: YeastPathways:PWY3O-402
    title: inositol phosphate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      PLC1 (3.1.4.11-RXN), ARG82 (2.7.1.127-RXN, 2.7.1.151-RXN, RXN-7162, RXN-7184, RXN-4941), IPK1 (RXN-7163),
      KCS1 (2.7.1.152-RXN, RXN-4941), VIP1 (RXN3O-143, RXN3O-258) and DDP1 (RXN3O-785, RXN3O-786); RXN3O-9819 has
      no gene. The kinase and PLC assignments were retained; the DDP1 diphosphatase (turnover) is outside the
      biosynthetic boundary.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-402
  - source_id: GO:0006021
    title: inositol biosynthetic process
    statement: MIPS and IMPase make myo-inositol from glucose 6-phosphate.
  - source_id: GO:0032958
    title: inositol phosphate biosynthetic process
    statement: The PLC-initiated route makes IP3, IP4, IP5, IP6 and the inositol pyrophosphates.
  - source_id: GO:0010264
    title: myo-inositol hexakisphosphate biosynthetic process
    statement: IPMK and IPK1 complete IP6.
  - source_id: PMID:22345606
    title: Metabolism and regulation of glycerolipids in the yeast Saccharomyces cerevisiae.
    statement: Inositol is derived from glucose-6-P by the cytosolic INO1-encoded inositol-3-P synthase and the INM1-encoded inositol-3-P phosphatase.
  - source_id: PMID:2642902
    title: Biosynthesis of inositol in yeast. Primary structure of myo-inositol-1-phosphate synthase (EC 5.5.1.4) and functional analysis of its structural gene, the INO1 locus.
    statement: INO1 encodes L-myo-inositol-1-phosphate synthase; ino1 disruptants are inositol auxotrophs.
  - source_id: PMID:10844654
    title: Expression of yeast INM1 encoding inositol monophosphatase is regulated by inositol, carbon source and growth stage and is decreased by lithium and valproate.
    statement: Purified Inm1p has lithium-sensitive inositol monophosphatase activity; inm1 cells retain some activity and are not inositol auxotrophs.
  - source_id: PMID:10096091
    title: The yeast inositol monophosphatase is a lithium- and sodium-sensitive enzyme encoded by a non-essential gene pair.
    statement: Recombinant YHR046c (INM1) and YDR287w (INM2) both hydrolyse inositol 1-phosphate; the double disruptant is not an inositol auxotroph.
  - source_id: PMID:8395015
    title: Genetic and biochemical characterization of a phosphatidylinositol-specific phospholipase C in Saccharomyces cerevisiae.
    statement: PLC1 encodes a Ca2+-dependent PI-PLC that hydrolyses PI(4,5)P2.
  - source_id: PMID:10390371
    title: A phospholipase C-dependent inositol polyphosphate kinase pathway required for efficient messenger RNA export.
    statement: Phospholipase C and two inositol polyphosphate kinases (Ipk2/Arg82 and Ipk1) form a pathway from PI(4,5)P2 to IP6 required for mRNA export.
  - source_id: PMID:10574768
    title: Synthesis of diphosphoinositol pentakisphosphate by a newly identified family of higher inositol polyphosphate kinases.
    statement: Cloning of a yeast InsP6 kinase (Kcs1) and mammalian IP6Ks; ArgRIII (Arg82) converts InsP3 to InsP4, InsP5 and InsP6.
  - source_id: PMID:10683435
    title: Inositol polyphosphate multikinase (ArgRIII) determines nuclear mRNA export in Saccharomyces cerevisiae.
    statement: arg82 disruption raises InsP3 170-fold and lowers InsP6 100-fold.
  - source_id: PMID:11311242
    title: The transcriptional regulator, Arg82, is a hybrid kinase with both monophosphoinositol and diphosphoinositol polyphosphate synthase activity.
    statement: Arg82 phosphorylates Ins(1,3,4,5)P4 to InsP5 and InsP5 further to diphosphoinositol tetrakisphosphates.
  - source_id: PMID:10827188
    title: The inositol hexakisphosphate kinase family. Catalytic flexibility and function in yeast vacuole biogenesis.
    statement: kcs1 (ip6k) cells have 60-80% less diphosphoinositol polyphosphate and fragmented vacuoles; IP6Ks also phosphorylate InsP5 to PP-InsP4.
  - source_id: PMID:11956213
    title: In Saccharomyces cerevisiae, the inositol polyphosphate kinase activity of Kcs1p is required for resistance to salt stress, cell wall integrity, and vacuolar morphogenesis.
    statement: A kinase-dead Kcs1p does not support diphosphoinositol polyphosphate synthesis; the same phenotypes arise in arg82 cells that lack the precursor.
  - source_id: PMID:17412958
    title: A conserved family of enzymes that phosphorylate inositol hexakisphosphate.
    statement: Yeast Vip1 and S. pombe Asp1 are a separate class of inositol pyrophosphate synthases with IP6 and IP7 kinase activities.
  - source_id: PMID:10419486
    title: The diadenosine hexaphosphate hydrolases from Schizosaccharomyces pombe and Saccharomyces cerevisiae are homologues of the human diphosphoinositol polyphosphate phosphohydrolase. Overlapping substrate specificities in a MutT-type protein.
    statement: DDP1 (YOR163w) and S. pombe Aps1 hydrolyse diphosphorylated inositol polyphosphates (turnover; outside the module).
notes: >-
  NEW (YeastPathways project, 2026-10). The module has two sub-pathways joined through lipid intermediates made
  in other modules: de novo myo-inositol synthesis (MIPS -> IMPase) and the lipid-dependent synthesis of IP6 and
  inositol pyrophosphates (PLC -> IPMK -> IPMK -> IPK1 -> IP6K -> PPIP5K). Inositol is incorporated into PI by
  PI synthase (cdp_dag_phospholipid_synthesis) and PI is phosphorylated to PI(4,5)P2 (phosphoinositide_biosynthesis)
  before PLC releases IP3. The IMPase step uses GO:0052832 (inositol monophosphate 3-phosphatase) because the MIPS
  product is 1D-myo-inositol 3-phosphate; YeastPathways uses the 1-phosphatase term GO:0008934 for the same
  reaction (the 1D-3-phosphate is the L-1-phosphate in the older numbering). Arg82/IPMK is modelled as two
  sequential steps (IP3 3-kinase, then Ins(1,3,4,5)P4 6-kinase); the parallel 6-kinase-first route through
  Ins(1,4,5,6)P4 and the minor diphosphoinositol-tetrakisphosphate products of Arg82 and Kcs1 (PMID:11311242,
  PMID:10827188) are recorded here rather than as separate parts. The positional specificities (Kcs1/IP6K at
  position 5, Vip1/PPIP5K at position 1) are not established in the cached literature, so the generic GO terms
  GO:0000828 and GO:0000829 are used. DDP1 inositol-pyrophosphate diphosphatase activity (PMID:10419486) is
  turnover and is excluded, as are the transcriptional and mRNA-export roles of the products. Exemplars: S.
  cerevisiae for all steps, S. pombe for the IP route (plc1, arg82, ipk1, kcs1/SPCC970.08, asp1) and human
  orthologs sharing the PANTHER family. S. pombe has no member of the MIPS (PTHR11510) or IMPase (PTHR20854)
  families in the PANTHER 19.0 classification and no MIPS in UniProt, so the de novo branch has no S. pombe
  exemplar; the PomBase model 663d668500002178 instead contains the itr2 myo-inositol transporter. YeastCyc
  corrections: none needed; ARG82, KCS1 and VIP1 are present in PWY3O-402 (contrary to the crosswalk note). The
  crosswalk lists only the YeastPathways models for this group; the PomBase model 663d668500002178, assigned to
  phosphoinositide_biosynthesis, is also linked here because it contains plc1, arg82, ipk1, kcs1 and asp1. GO-CAM
  disagreements: (a) both YeastPathways models place everything in cytosol (the IPMK/IPK1 pathway is largely
  nuclear in yeast, not addressed in cached sources); (b) YeastPathways_PWY3O-402 gives ARG82 the IP3 6-kinase
  term GO:0000823 for the Ins(1,3,4,5)P4 6-kinase reaction (RXN-7162), where GO:0000825 is specific; (c) the
  PomBase model gives asp1 GO:0052723 (IP6 1-kinase) but has no IP7 kinase activity, and gives kcs1 and the
  other kinases no location.
