id: MODULE:kit_signaling
title: Kit signaling pathway module
description: Stem cell factor (KIT ligand) binds and dimerizes the class III receptor tyrosine
  kinase KIT, whose autophosphorylated intracellular tyrosines recruit SH2-domain effectors
  (GRB2, PI3K p85, SHP2, Src-family kinases) that drive Ras-MAPK, PI3K-AKT, and STAT5 outputs
  controlling survival, proliferation, and migration of hematopoietic progenitors, mast cells,
  melanocytes, germ cells, and interstitial cells of Cajal.
status: DRAFT
evidence:
  - source_id: GO:0038109
    title: Kit signaling pathway
    statement: The module is grounded in the GO biological process term for Kit signaling pathway,
      defined as the series of molecular signals initiated by stem cell factor binding to the
      tyrosine kinase receptor KIT, followed by receptor dimerization, autophosphorylation, and
      phosphorylation of substrates that activate distinct downstream cascades.
  - source_id: PMID:23073628
    title: "Stem cell factor receptor/c-Kit: from basic science to clinical implications."
    statement: >-
      Physiological Reviews summary (Lennartsson and Ronnstrand 2012): SCF is a dimeric ligand
      that activates c-Kit; activation leads to autophosphorylation, and signaling proteins are
      recruited through SH2 and PTB interaction domains that bind phosphorylated tyrosines in the
      intracellular region of c-Kit. c-Kit signaling mediates cell survival, migration, and
      proliferation and is crucial for hematopoiesis, pigmentation, fertility, and gut movement.
      Abstract verified against PubMed; used to set the module boundary and the three-step
      decomposition.
  - source_id: PMID:15526160
    title: Signal transduction via the stem cell factor receptor/c-Kit.
    statement: >-
      Review (Ronnstrand 2004): ligand stimulation leads to receptor dimerization, activation of
      intrinsic tyrosine kinase activity, and phosphorylation of key receptor tyrosines that serve
      as docking sites for SH2-containing signal transduction molecules, which are recruited to the
      receptor and often activated by receptor-mediated phosphorylation. Abstract verified against
      PubMed; supports the phosphotyrosine effector-recruitment step.
  - source_id: PMID:17662946
    title: Structural basis for activation of the receptor tyrosine kinase KIT by stem cell factor.
    statement: >-
      Crystal structures of the KIT ectodomain before and after SCF binding show that KIT
      dimerization is driven by SCF binding, followed by lateral D4-D4 and D5-D5 contacts; this
      is the GOA IDA reference for GO:0038109 on human KIT (UniProtKB:P10721). Abstract verified
      against PubMed.
  - source_id: PMID:21135090
    title: Mechanisms of STAT protein activation by oncogenic KIT mutants in neoplastic mast cells.
    statement: >-
      STAT1, STAT3, and STAT5 are activated downstream of KIT and KIT can directly phosphorylate
      STATs on activation-specific tyrosines in vitro; this is the GOA IMP reference for
      GO:0046427 (positive regulation of receptor signaling pathway via JAK-STAT) on human KIT.
      Abstract verified against PubMed; supports the STAT5 output annoton.
  - source_id: PMID:21640708
    title: Mechanism of activation of human c-KIT kinase by internal tandem duplications of the
      juxtamembrane domain and point mutations at aspartic acid 816.
    statement: GOA IDA reference for GO:0004714 (transmembrane receptor protein tyrosine kinase
      activity), GO:0046777 (protein autophosphorylation), and GO:0043410 (positive regulation of
      MAPK cascade) on human KIT. Title verified against PubMed.
  - source_id: PANTHER:PTN001230349
    title: PAINT node PTN001230349 for KIT
    statement: Local PAINT IBD node in PTHR24416 with propagated terms C:GO:0005886, F:GO:0004714,
