notes: >-
  Curated compact signaling-pathway module built to the same three-step template as the sibling
  receptor tyrosine kinase modules (pdgfr_signaling, egfr_signaling, fgfr_signaling): ligand
  engagement, phosphotyrosine effector recruitment, and downstream output. KIT is a class III
  receptor tyrosine kinase in the same PANTHER family (PTHR24416) as PDGFRA/PDGFRB, CSF1R, and
  FLT3; the module is kept separate from pdgfr_signaling because GO models Kit signaling as its
  own pathway term (GO:0038109) with its own PAINT node (PTN002814378) and its own ligand (KITLG,
  PTHR11574, which has no local PANTHER cache directory, so KITLG is grounded as a UniProt exemplar
  only). Effector choice follows the reviews cited in evidence: GRB2 and PI3K p85 are the canonical
  SH2 adaptors recruited to phosphorylated KIT, SHP2 (PTPN11) is the KIT-associated phosphatase
  that couples to the Ras-ERK branch, and LYN is the Src-family kinase representative for the
  juxtamembrane phosphotyrosine docking site. Downstream outputs are limited to the three branches
  with direct GOA support on human KIT (positive regulation of MAPK cascade, PI3K-AKT, and STAT
  activation); PLCG1 and other Ras-branch components are deliberately left to broader modules.
  PTN anchors are included only when the exemplar accession appears in an IBD seed row in
  interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar
  accessions. UniProt protein names were taken verbatim from the UniProt REST API; PANTHER family
  labels from interpro/panther/panther.obo; PMIDs and titles were checked against PubMed. None of
  KIT, KITLG, GRB2, PIK3R1, LYN, SOS1, PIK3CA, or STAT5A yet has a gene review in this repository,
  and gocams/index.tsv contains no KIT activity, so this module is not yet cross-checked against a
  production GO-CAM.
