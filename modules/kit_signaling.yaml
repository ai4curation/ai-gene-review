knowledge_gaps:
  - gap_statement: >-
      Whether STAT activation downstream of ligand-stimulated wild-type KIT proceeds mainly by
      direct receptor phosphorylation, by Src-family kinases, or by JAK2 is not settled; the
      GO_REF/IMP evidence for GO:0046427 on human KIT comes from oncogenic D816 mutants in
      neoplastic mast cells.
    boundary: >-
      STAT1, STAT3, and STAT5 are activated downstream of KIT, and KIT can phosphorylate STAT
      activation-loop tyrosines in vitro; the module therefore models STAT5 as a direct output
      without asserting a JAK intermediate.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    resolution: >-
      Compare STAT5 tyrosine phosphorylation after SCF stimulation of wild-type KIT in cells with
      and without JAK2 or Src-family kinase inhibition, and annotate the mediating kinase in a
      GO-CAM for the pathway.
