id: MODULE:hydroxycinnamate_vanillate_catabolism
title: Hydroxycinnamate and vanillate catabolism to protocatechuate
description: >-
  A four-step bacterial peripheral aromatic-catabolism route that funnels the
  hydroxycinnamate ferulate to protocatechuate by the non-beta-oxidative
  CoA-dependent pathway. A feruloyl-CoA synthetase (Fcs) activates ferulate to
  feruloyl-CoA; a crotonase-fold hydroxycinnamoyl-CoA hydratase-lyase (Ech/HCHL)
  hydrates the thioester and cleaves it to vanillin and acetyl-CoA; an
  NAD-dependent vanillin dehydrogenase (Vdh) oxidizes vanillin to vanillate;
  and the two-component Rieske oxygenase VanAB O-demethylates vanillate to
  protocatechuate and formaldehyde. Aromatic-acid uptake, formaldehyde
  detoxification, gallate catabolism and the downstream protocatechuate
  beta-ketoadipate pathway are separate modules.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:1901067
    title: ferulate catabolic process
    statement: Defines the upper ferulate-catabolic context of the first three reactions.
  - source_id: RHEA:36251
    title: trans-feruloyl-CoA synthase reaction
    statement: Defines ATP-dependent ferulate activation to feruloyl-CoA.
  - source_id: RHEA:62412
    title: feruloyl-CoA hydratase/lyase reaction
    statement: Defines conversion of feruloyl-CoA and water to vanillin and acetyl-CoA.
  - source_id: RHEA:13309
    title: vanillin dehydrogenase reaction
    statement: Defines NAD-dependent oxidation of vanillin to vanillate.
  - source_id: RHEA:13021
    title: vanillate monooxygenase reaction
    statement: Defines VanAB conversion of vanillate to protocatechuate and formaldehyde.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__hydroxycinnamate-vanillate-catabolism__ppu00627-deep-research-openscientist.md
    title: OpenScientist PSEPK hydroxycinnamate and vanillate catabolism synthesis
    statement: Species-aware retrieval identifies direct KT2440 evidence for every modeled reaction.
  - source_id: PMID:12764569
    title: Functional analyses of genes involved in the metabolism of ferulic acid in Pseudomonas putida KT2440.
    statement: Separate fcs, ech, and vdh inactivation establishes the first three parts of the KT2440 route.
  - source_id: PMID:31809239
    title: Biotransformation of corn bran derived ferulic acid to vanillic acid using engineered Pseudomonas putida KT2440.
    statement: A vanAB-nonfunctional KT2440 mutant establishes the terminal vanillate-metabolism part.
  - source_id: PMID:9461612
    title: Metabolism of ferulic acid to vanillin. A bacterial gene of the enoyl-SCoA hydratase/isomerase superfamily encodes an enzyme for the hydration and cleavage of a hydroxycinnamic acid SCoA thioester.
    statement: The P. fluorescens hydratase-lyase gene establishes the feruloyl-CoA to vanillin step outside KT2440.
  - source_id: PMID:9098058
    title: Molecular characterization of genes of Pseudomonas sp. strain HR199 involved in bioconversion of vanillin to protocatechuate.
    statement: HR199 vdh and vanAB convert vanillin via vanillate to protocatechuate and confer growth on vanillin when transferred.
  - source_id: PMID:10348863
    title: Genetic analysis of a chromosomal region containing vanA and vanB, genes required for conversion of either ferulate or vanillate to protocatechuate in Acinetobacter.
    statement: Acinetobacter baylyi ADP1 mutants blocked in vanAB cannot catabolize ferulate or vanillate, extending the terminal step beyond Pseudomonas.
notes: >-
  The route is anchored in Pseudomonas putida KT2440, where every step has
  target-strain genetic evidence, and is sampled in three further strains with
  experimental evidence: the P. fluorescens AN103 hydratase-lyase HCHL, the
  Pseudomonas sp. HR199 vanillin dehydrogenase, and the Acinetobacter baylyi
  ADP1 VanAB demethylase. The taxon context (Pseudomonadales) is the
  evidence-sampled envelope, not a claim of universality. Swiss-Prot-reviewed vanillin
  dehydrogenases of Corynebacterium glutamicum and Amycolatopsis and the
  Rhodococcus jostii RHA1 VanA (PTHR42986 and PTHR21266 member inventories)
  show the same enzymes in Actinomycetota, but no full-route exemplar outside
  Pseudomonadales is grounded here. Sphingomonad lignin catabolism uses a
  different, tetrahydrofolate-dependent vanillate demethylase and is not this
  module. Fcs, Ech, Vdh and VanA are grounded as reaction-qualified families
  without PANTHER identifiers: their PANTHER families (PTHR43201, PTHR42964,
  PTHR42986, PTHR21266) each mix substrate specificities within the subfamily
  that holds these enzymes, as recorded in the family reviews, so membership
  does not predict the reaction. Dedicated non-PANTHER signatures exist for
  the first two steps: NCBIfam NF006588 (p-hydroxycinnamoyl CoA
  hydratase/lyase), used as the Ech family term, and CDD cd05921 (FCS),
  matched by KT2440 Fcs. VanB is grounded to PTHR47354:SF1, which that
  family review includes in the scope of ferredoxin-NAD+ reductase activity
  (excluding only the SF7 flavin reductases). The Vdh exemplars differ in
  pathway entry point: the KT2440 evidence starts from ferulate and the HR199
  evidence from vanillin, so the Vdh annoton carries both ferulate and
  vanillin catabolic process. The VanAB step uses aerobic phenol-containing
  compound catabolic process because GO has no vanillate catabolic process
  term; the KT2440 VanB gene review proposes one. GalA-dependent gallate cleavage is a parallel pathway and is
  excluded from this serial ferulate-to-protocatechuate module. Transport of
  ferulate and vanillate and handling of the formaldehyde released by VanAB are
  outside the module boundary.
module:
  id: hydroxycinnamate_vanillate_catabolism
  label: Hydroxycinnamate and vanillate catabolism to protocatechuate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ferulate catabolic process
      term:
        id: GO:1901067
        label: ferulate catabolic process
      description: Peripheral conversion of ferulate through vanillin and vanillate.
    - preferred_term: aerobic phenol-containing compound catabolic process
      term:
        id: GO:0046191
        label: aerobic phenol-containing compound catabolic process
      description: Aerobic O-demethylation of vanillate to the protocatechuate convergence node.
  context:
    taxa:
      - preferred_term: Pseudomonadales with the CoA-dependent ferulate route
        term:
          id: NCBITaxon:72274
          label: Pseudomonadales
        description: >-
          Evidence-sampled envelope: the complete route in P. putida KT2440,
          the hydratase-lyase in P. fluorescens AN103, the vanillin
          dehydrogenase in Pseudomonas sp. HR199, and VanAB in Acinetobacter
          baylyi ADP1. Not every member of the order carries the route.
        evidence:
          - source_id: PMID:12764569
            title: Functional analyses of genes involved in the metabolism of ferulic acid in Pseudomonas putida KT2440.
            statement: The fcs, ech and vdh mutants of KT2440 cannot grow on ferulic acid.
          - source_id: PMID:10348863
            title: Genetic analysis of a chromosomal region containing vanA and vanB, genes required for conversion of either ferulate or vanillate to protocatechuate in Acinetobacter.
            statement: Ferulate is degraded through vanillate in Acinetobacter, and vanAB are required.
  parts:
    - order: 1
      role: ferulate activation
      node:
        id: fcs_activation
        label: Feruloyl-CoA formation
        module_type: REACTION
        annotons:
          - id: fcs_activity
            label: Trans-feruloyl-CoA synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Feruloyl-CoA synthetases (Fcs)
                description: >-
                  ATP-dependent ANL-superfamily acid-CoA ligases that activate
                  ferulate, matched by the CDD feruloyl-CoA synthetase model
                  cd05921. PANTHER places KT2440 Fcs in PTHR43201:SF32 beside
                  o-succinylbenzoate-CoA ligases, so no PANTHER identifier is
                  asserted for this role.
                representative_members:
                  - preferred_term: fcs (PSEPK)
                    term:
                      id: UniProtKB:Q88HK0
                      label: Feruloyl-CoA-synthetase
                    description: KT2440 PP_3356; recombinant Fcs activity and fcs insertion mutant unable to grow on ferulate.
                    evidence:
                      - source_id: file:PSEPK/fcs/fcs-ai-review.yaml
                        statement: Gene review accepts trans-feruloyl-CoA synthase activity as the core function.
            function:
              preferred_term: trans-feruloyl-CoA synthase activity
              term:
                id: GO:0050563
                label: trans-feruloyl-CoA synthase activity
              substrates:
                - preferred_term: (E)-ferulate
                - preferred_term: ATP
                - preferred_term: CoA
              products:
                - preferred_term: (E)-feruloyl-CoA
                - preferred_term: AMP
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:36251
                  statement: Exact AMP-forming ligase reaction.
                - source_id: PMID:12764569
                  statement: Fcs activity was measured in recombinant protein extracts, and the KT2440 fcs mutant cannot grow on ferulic acid.
            processes:
              - preferred_term: ferulate catabolic process
                term:
                  id: GO:1901067
                  label: ferulate catabolic process
            role_description: ATP-dependent first committed step of the hydroxycinnamate route.
    - order: 2
      role: feruloyl-CoA hydration and cleavage
      node:
        id: ech_cleavage
        label: Feruloyl-CoA hydratase/lyase reaction
        module_type: REACTION
        annotons:
          - id: ech_activity
            label: Feruloyl-CoA hydratase/lyase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hydroxycinnamoyl-CoA hydratase-lyases (Ech/HCHL)
                term:
                  id: NCBIfam:NF006588
                  label: p-hydroxycinnamoyl CoA hydratase/lyase
                description: >-
                  Crotonase-fold enzymes that hydrate feruloyl-CoA and cleave it
                  by retro-aldol to vanillin and acetyl-CoA. Their PANTHER
                  subfamily PTHR42964:SF1 also holds FabM isomerases, PksH
                  dehydratases and LiuC, so the NCBIfam PRK09120 model, which
                  both representatives match, is used instead of a PANTHER
                  identifier.
                representative_members:
                  - preferred_term: ech (PSEPK)
                    term:
                      id: UniProtKB:Q88HJ8
                      label: Hydroxycinnamoyl-CoA hydratase-lyase
                    description: KT2440 PP_3358; ech insertion mutant unable to grow on ferulate; CoA-bound crystal structures.
                    evidence:
                      - source_id: file:PSEPK/ech/ech-ai-review.yaml
                        statement: Gene review sets feruloyl-CoA hydratase/lyase activity as the core function.
                  - preferred_term: HCHL (PSEFL)
                    term:
                      id: UniProtKB:O69762
                      label: Hydroxycinnamoyl-CoA hydratase-lyase
                    description: Pseudomonas fluorescens AN103 enzyme with purified-enzyme kinetics, crystal structures and active-site mutagenesis.
                    evidence:
                      - source_id: file:PSEFL/O69762/O69762-ai-review.yaml
                        statement: Gene review accepts the experimental feruloyl-CoA hydratase/lyase activity rows.
            function:
              preferred_term: feruloyl-CoA hydratase/lyase activity
              term:
                id: GO:0050547
                label: feruloyl-CoA hydratase/lyase activity
              substrates:
                - preferred_term: (E)-feruloyl-CoA
                - preferred_term: water
              products:
                - preferred_term: vanillin
                - preferred_term: acetyl-CoA
              evidence:
                - source_id: RHEA:62412
                  statement: Exact composite reaction and current EC 4.1.2.61 mapping.
                - source_id: PMID:10222033
                  statement: Purified P. fluorescens HCHL is active on feruloyl-, caffeoyl- and 4-coumaroyl-CoA.
            processes:
              - preferred_term: ferulate catabolic process
                term:
                  id: GO:1901067
                  label: ferulate catabolic process
            role_description: Non-beta-oxidative two-carbon side-chain cleavage yielding vanillin.
    - order: 3
      role: vanillin oxidation
      node:
        id: vdh_oxidation
        label: Vanillin dehydrogenase reaction
        module_type: REACTION
        annotons:
          - id: vdh_activity
            label: Vanillin dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NAD-dependent vanillin dehydrogenases (Vdh)
                description: >-
                  Aldehyde dehydrogenases that oxidize vanillin to vanillate.
                  Their PANTHER subfamily PTHR42986:SF1 also holds benzaldehyde,
                  salicylaldehyde and 4-hydroxybenzaldehyde dehydrogenases, so no
                  PANTHER identifier is asserted.
                representative_members:
                  - preferred_term: vdh (PSEPK)
                    term:
                      id: UniProtKB:Q88HJ9
                      label: Vanillin dehydrogenase
                    description: KT2440 PP_3357; Vdh activity in recombinant extracts and vdh mutant unable to grow on ferulate.
                    evidence:
                      - source_id: file:PSEPK/vdh/vdh-ai-review.yaml
                        statement: Gene review accepts vanillin dehydrogenase (NAD+) activity as the core function.
                  - preferred_term: vdh (PSEUH)
                    term:
                      id: UniProtKB:O05619
                      label: Vanillin dehydrogenase
                    description: Pseudomonas sp. HR199 enzyme; recombinant E. coli oxidizes vanillin to vanillate.
                    evidence:
                      - source_id: file:PSEUH/vdh/vdh-ai-review.yaml
                        statement: Gene review accepts the IDA vanillin dehydrogenase (NAD+) activity row.
            function:
              preferred_term: vanillin dehydrogenase (NAD+) activity
              term:
                id: GO:0050608
                label: vanillin dehydrogenase (NAD+) activity
              substrates:
                - preferred_term: vanillin
                - preferred_term: NAD+
                - preferred_term: water
              products:
                - preferred_term: vanillate
                - preferred_term: NADH
              evidence:
                - source_id: RHEA:13309
                  statement: Exact NAD-dependent vanillin oxidation.
                - source_id: PMID:9098058
                  statement: Recombinant HR199 vdh converts vanillin to vanillate.
            processes:
              - preferred_term: ferulate catabolic process
                term:
                  id: GO:1901067
                  label: ferulate catabolic process
              - preferred_term: vanillin catabolic process
                term:
                  id: GO:0042190
                  label: vanillin catabolic process
            role_description: Oxidizes the vanillin intermediate to vanillate.
    - order: 4
      role: vanillate O-demethylation
      node:
        id: vanAB_demethylation
        label: VanAB vanillate O-demethylase
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: vanA_oxygenase_activity
            label: VanA oxygenase subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanA Rieske oxygenase subunits
                description: >-
                  Rieske non-heme iron oxygenase alpha subunits with a VanA_C
                  catalytic domain that partner with VanB. Their PANTHER
                  subfamily PTHR21266:SF60 also holds KshA, NdmA/NdmB and DdmC,
                  so no PANTHER identifier is asserted.
                representative_members:
                  - preferred_term: vanA (PSEPK)
                    term:
                      id: UniProtKB:Q88GI6
                      label: Vanillate O-demethylase oxygenase subunit
                    description: KT2440 PP_3736; VanAB kinetics and vanAB-defective mutant.
                    evidence:
                      - source_id: file:PSEPK/vanA/vanA-ai-review.yaml
                        statement: Gene review accepts vanillate monooxygenase activity as the core function.
                  - preferred_term: vanA (ACIAD)
                    term:
                      id: UniProtKB:Q6FDI6
                      label: Vanillate O-demethylase oxygenase subunit
                    description: Acinetobacter baylyi ADP1 ACIAD0980; vanAB mutants cannot use vanillate or ferulate.
                    evidence:
                      - source_id: file:ACIAD/vanA/vanA-ai-review.yaml
                        statement: Gene review accepts vanillate monooxygenase activity as the core function.
            function:
              preferred_term: vanillate monooxygenase activity
              term:
                id: GO:0018489
                label: vanillate monooxygenase activity
              substrates:
                - preferred_term: vanillate
                - preferred_term: oxygen
              products:
                - preferred_term: protocatechuate
                - preferred_term: formaldehyde
              evidence:
                - source_id: RHEA:13021
                  statement: Exact two-component VanAB reaction.
                - source_id: PMID:10348863
                  statement: VanA and VanB form the oxygenative demethylase converting vanillate to protocatechuate.
            processes:
              - preferred_term: aerobic phenol-containing compound catabolic process
                term:
                  id: GO:0046191
                  label: aerobic phenol-containing compound catabolic process
            role_description: Rieske oxygenase subunit that performs substrate O-demethylation.
          - id: vanB_reductase_activity
            label: VanB reductase subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VanB reductases of PTHR47354:SF1
                term:
                  id: PANTHER:PTHR47354:SF1
                  label: CARNITINE MONOOXYGENASE REDUCTASE SUBUNIT
                description: >-
                  PDR-type flavin/[2Fe-2S] reductases that pass electrons from
                  NADH to VanA. The subfamily also holds phthalate dioxygenase
                  and carnitine monooxygenase reductases, so the VanA partner,
                  not membership, defines the role.
                representative_members:
                  - preferred_term: vanB (PSEPK)
                    term:
                      id: UniProtKB:Q88GI5
                      label: Vanillate O-demethylase oxidoreductase
                    description: KT2440 PP_3737; partner of VanA in the VanAB enzyme.
                    evidence:
                      - source_id: file:PSEPK/vanB/vanB-ai-review.yaml
                        statement: Gene review sets ferredoxin-NAD+ reductase activity contributing to vanillate monooxygenase activity.
                  - preferred_term: vanB (ACIAD)
                    term:
                      id: UniProtKB:O24840
                      label: Vanillate O-demethylase oxidoreductase
                    description: Acinetobacter baylyi ADP1 ACIAD0979; Swiss-Prot PDR/VanB family reductase.
                    evidence:
                      - source_id: file:ACIAD/vanB/vanB-ai-review.yaml
                        statement: Gene review sets ferredoxin-NAD+ reductase activity contributing to vanillate monooxygenase activity.
            function:
              preferred_term: ferredoxin-NAD+ reductase activity
              term:
                id: GO:0008860
                label: ferredoxin-NAD+ reductase activity
              substrates:
                - preferred_term: NADH
              products:
                - preferred_term: NAD+
              evidence:
                - source_id: file:interpro/panther/PTHR47354/PTHR47354-review.yaml
                  statement: The family review includes SF1, the VanB subfamily, in the scope of ferredoxin-NAD+ reductase activity, excluding only the SF7 flavin reductases.
            processes:
              - preferred_term: aerobic phenol-containing compound catabolic process
                term:
                  id: GO:0046191
                  label: aerobic phenol-containing compound catabolic process
            role_description: Supplies reducing equivalents to VanA and contributes to complex-level vanillate monooxygenase activity.
  connections:
    - source: fcs_activation
      target: ech_cleavage
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: (E)-feruloyl-CoA is the explicit Fcs product and Ech substrate.
    - source: ech_cleavage
      target: vdh_oxidation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: Vanillin is the explicit Ech product and Vdh substrate.
    - source: vdh_oxidation
      target: vanAB_demethylation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: Vanillate is the explicit Vdh product and VanAB substrate.
    - source: vanB_reductase_activity
      target: vanA_oxygenase_activity
      connection_type: PROVIDES_INPUT_FOR
      chaining_note: VanB passes electrons from NADH to the Rieske centre of VanA.
  knowledge_gaps:
    - gap_statement: >-
        Which residues set hydroxycinnamate rather than o-succinylbenzoate
        specificity in Fcs-type ligases, relative to their PTHR43201:SF32
        neighbours, is unknown; the CDD cd05921 model recognizes the Fcs clade
        but does not explain its substrate selectivity.
      boundary: The module grounds Fcs by experimental exemplar and names no PANTHER clade for the activity.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The flavin cofactor and electron-transfer kinetics of VanB toward VanA
        have not been measured for any of the reviewed VanB proteins; FMN is
        assigned by similarity.
      boundary: VanB is modeled with the reaction class of its family, contributing to the VanAB activity.
      gap_kind:
        - BIOLOGY
