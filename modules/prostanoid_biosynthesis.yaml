id: MODULE:prostanoid_biosynthesis
title: Prostanoid biosynthesis — cyclooxygenase conversion of arachidonate to PGH2 and its isomerisation or reduction to PGE2, PGD2, PGI2, TXA2 and PGF2alpha; PTGS1/PTGS2/PTGES/PTGES2/PTGES3/HPGDS/PTGDS/PTGIS/TBXAS1/AKR1C3/AKR1B1/PRXL2B/CBR1
description: >-
  Prostanoids (the prostaglandins, prostacyclin and the thromboxanes) are
  oxygenated derivatives of arachidonate that act locally through G-protein-coupled
  prostanoid receptors in inflammation, pain and fever, vascular tone, platelet
  function, immunity and reproduction. Their synthesis is a two-stage reaction
  chain. In the first, committed stage, prostaglandin G/H synthase (cyclooxygenase,
  COX), a bifunctional haem enzyme on the lumenal face of the endoplasmic reticulum
  and nuclear envelope, adds two molecules of O2 to free arachidonate to form the
  hydroperoxy endoperoxide prostaglandin G2 (PGG2) at its cyclooxygenase site, and
  reduces PGG2 to the hydroxy endoperoxide prostaglandin H2 (PGH2) at its peroxidase
  site. Two isoforms carry out this stage: COX-1 (PTGS1), expressed constitutively in
  most tissues and in platelets, and COX-2 (PTGS2), induced by cytokines, growth
  factors and lipopolysaccharide and responsible for most prostanoid production in
  inflammation. Both are the targets of non-steroidal anti-inflammatory drugs. In
  the second stage, PGH2 is converted by cell-type-specific terminal enzymes into
  the individual prostanoids. Prostaglandin E2 (PGE2) is formed by isomerisation by
  the glutathione-dependent, inducible microsomal PGE synthase-1 (PTGES), by
  microsomal PGE synthase-2 (PTGES2) and by the cytosolic PGE synthase p23 (PTGES3).
  PGD2 is formed by the glutathione-dependent haematopoietic PGD synthase (HPGDS) of
  mast cells and other immune cells, and by the secreted lipocalin-type PGD synthase
  (PTGDS) of the brain, male genital tract and heart. Prostacyclin (PGI2) and
  thromboxane A2 (TXA2) are formed by two atypical cytochrome P450 isomerases of the
  endoplasmic reticulum, prostacyclin synthase (PTGIS, CYP8A1) in endothelium and
  thromboxane synthase (TBXAS1, CYP5A1) in platelets, which need no external electron
  donor or O2. PGF2alpha is formed by reduction rather than isomerisation: aldo-keto
  reductases AKR1C3 and AKR1B1 reduce PGH2 with NADPH, the thioredoxin-like
  prostamide/PGF synthase PRXL2B reduces PGH2 with reduced thioredoxin, and carbonyl
  reductase CBR1 reduces PGE2 at C-9. AKR1C3 also reduces PGD2 at C-11, giving the
  stereoisomer 11-epi-PGF2alpha (9alpha,11beta-PGF2). Which prostanoids a cell makes
  depends on its complement of terminal enzymes and on their coupling to COX-1 or
  COX-2.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001243
    title: prostanoid biosynthetic pathway
    statement: >-
      The module boundary and its core gene products follow the RGD interactive diagram
      for this Pathway Ontology term. The diagram draws arachidonic acid positively
      affecting PGG2, PGG2 positively affecting PGH2, PGH2 positively affecting PGD2,
      PGE2, PGF2alpha, PGI2 and TXA2, and PGD2 and PGE2 each positively affecting
      PGF2alpha, with the gene products Ptgs1, Ptgs2, Ptges, Ptges2, Ptges3, Hpgds,
      Ptgds, Ptgis, Tbxas1, Akr1c3, Akr1b1, Akr1a1, Fam213b (PRXL2B) and Cbr1. The
      prostanoid outputs link to the PGE2, PGD2, PGI2, PGF2alpha and TXA2 signalling
      pathways (PW:0001529, PW:0001530, PW:0001531, PW:0001535, PW:0001527) and the input
      links to the cyclooxygenase pathway of arachidonic acid metabolism (PW:0000461).
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001243.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001243.yaml
    title: RGD PW:0001243 record text (project snapshot)
    statement: >-
      The RGD record text assigns the three PGF2alpha routes to specific enzymes,
      including Akr1a1 on the PGH2 route; that Akr1a1 assignment is the one RGD claim not
      carried into this module (see notes).
    supporting_text: The PGH2 based route is believed to be the result of Fam213b oxidoreductase activity as well as of Akr1a1 and Akr1b1 activities whereas the formation of PGF2alpha from PGD2 and PGE2 requires the activities of Akr1c3 and Cbr1, respectively
  - source_id: GO:0046457
    title: prostanoid biosynthetic process
    statement: >-
      The module is grounded in GO prostanoid biosynthetic process, the closeMatch GO
      mapping recorded for PW:0001243 in the project's module seeds.
  - source_id: GO:0019371
    title: cyclooxygenase pathway
    statement: >-
      The committed COX step is the GO cyclooxygenase pathway, defined as prostaglandin
      formation from arachidonic acid with prostaglandin-endoperoxide synthase
      catalysing the committed step to PGG2 and PGH2.
  - source_id: PMID:10377395
    title: 'Identification of human prostaglandin E synthase: a microsomal, glutathione-dependent, inducible enzyme, constituting a potential novel drug target.'
    statement: >-
      States the two-stage architecture: PGH2 made by COX-1 or COX-2 is the common
      precursor of the individual prostanoids.
    supporting_text: Downstream of the cyclooxygenases, the product PGH 2 can be further metabolized into the various physiologically important eicosanoids
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001243 through the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route; GO mapping GO:0046457
  prostanoid biosynthetic process (closeMatch). The RGD diagram supplied the boundary
  (arachidonate in, five prostanoid classes out), the PGG2 -> PGH2 -> terminal product
  topology, the secondary PGE2 -> PGF2alpha and PGD2 -> PGF2alpha edges, and the gene
  list. It is modelled as a reaction chain: one COX part with COX-1 and COX-2 as
  variants, then one terminal-synthase part whose variant set branches from PGH2 by
  prostanoid product, with nested enzyme variants where more than one enzyme makes the
  same product. Boundary decisions. (1) Arachidonate release from membrane
  phospholipids by cytosolic phospholipase A2 (PLA2G4A, RHEA:40427 for
  1-hexadecanoyl-2-arachidonoyl-PC) is substrate supply and is left outside: it is not
  in the PW:0001243 gene list, belongs to the parent RGD pathway PW:0000461 together
  with its regulators (ANXA1, MKNK1, VIM), and supplies arachidonate to the
  lipoxygenase and cytochrome P450 branches as well. (2) The five prostanoid signalling
  subpathways (receptors PTGER1-4, PTGDR/PTGDR2, PTGIR, PTGFR, TBXA2R) are downstream
  and out of scope. (3) Prostanoid inactivation (HPGD 15-hydroxyprostaglandin
  dehydrogenase, transport by SLCO2A1 and export by ABCC4) is out of scope; CBR1's PGE2
  9-ketoreductase step is kept because RGD draws it as a PGF2alpha-forming route, but
  CBR1 also oxidises the 15-hydroxyl of PGE1, PGE2 and PGF2alpha (GO:0047021, EXP) and
  is better known as a catabolic enzyme, so its PGF2alpha output is a minor route. (4)
  AKR1A1 is drawn by RGD on the PGH2 -> PGF2alpha route, but neither its reviewed
  UniProt entry (P14550; no prostaglandin reaction) nor its QuickGO annotations
  (checked 2026-10-26; no prostaglandin-related term) record any prostaglandin
  reductase activity, and no supporting primary paper was found, so it is not
  included as a participant; this is recorded as a knowledge gap. (5) PTGDS is
  secreted and acts in the extracellular region (cerebrospinal fluid, seminal plasma)
  as well as being a lipophilic-ligand carrier; only its PGD synthase activity is
  modelled. Molecular functions were taken from each protein's experimental GO
  annotations in QuickGO (checked 2026-10-26) and cross-checked against the
  experimentally evidenced Rhea reactions in the reviewed UniProt entries: PTGS1 and
  PTGS2 GO:0004666 (IDA; PTGS2 also EXP), whose Rhea xref RHEA:23728 is the overall
  reaction and which GO does not split into separate cyclooxygenase (RHEA:42596) and
  peroxidase (RHEA:42600) activities; PTGES GO:0050220 (EXP, IDA); PTGES2 GO:0050220
  (EXP, IDA); PTGES3 GO:0050220 (EXP, IDA; and the completed PTGES3 gene review accepts
  it as core); HPGDS GO:0004667 (EXP, IDA); PTGDS GO:0004667 (EXP, IDA); PTGIS
  GO:0008116 (EXP, IDA); TBXAS1 GO:0004796 (EXP, IDA, IMP); AKR1C3 GO:0036130 (EXP) and
  GO:0036131 (EXP); AKR1B1 GO:0036130 (IDA); CBR1 GO:0050221 (EXP). GO:0047017
  prostaglandin F synthase activity was not used. Its definition and Rhea xref
  (RHEA:10140) describe PGD2 reduction, not PGH2 reduction. AKR1C3 does carry it
  (EXP), but this module models AKR1C3's PGD2 route by the more specific
  11-ketoreductase term GO:0036131 (RHEA:45316, the reaction that gives
  11-epi-PGF2alpha). PRXL2B carries GO:0047017 by IBA/ISS. That conflicts with the
  primary report on the orthologous mouse and swine enzyme (PMID:18006499), which found
  PGD2 is not a substrate, and is a candidate for upstream review. PRXL2B's actual
  reaction, thioredoxin-dependent PGH2 reduction (EC 1.11.1.20, RHEA:28214), has no GO
  molecular-function term (the NADPH-defined GO:0036130 on PRXL2B is IEA only), so the
  PRXL2B annoton carries a preferred_term and Rhea evidence but no GO id; human PRXL2B
  activity is by similarity in UniProt (ECO:0000250 from mouse Q9DB60). PTGES3 is also
  the HSP90 co-chaperone p23. Its PGE synthase activity is shown in vitro and in cells
  (PMID:10922363), but how much it contributes to PGE2 in vivo relative to mPGES-1 is
  less well established than for PTGES, and this is recorded in the annoton. No human
  GO-CAM covers any of these genes (gocams/index.tsv checked 2026-10-26), and no
  existing module models eicosanoid synthesis; modules/ferroptosis.yaml and
  modules/c_elegans_lysosomal_lipid_signaling.yaml mention arachidonate only in other
  contexts. Gene reviews exist only for PTGES3. All cited publications are
  abstract-only in the publications cache except PMID:10377395 and PMID:17344335.
knowledge_gaps:
  - gap_statement: >-
      Whether aldehyde reductase AKR1A1 reduces PGH2 to PGF2alpha, as the RGD
      record states, and whether it contributes to PGF2alpha formation in any human
      tissue, is undetermined.
    boundary: >-
      AKR1A1 is an established NADPH-dependent aldehyde reductase, and the related
      AKR1B1 and AKR1C3 have measured PGH2 reductase activity (PMID:19010934). The
      reviewed human AKR1A1 UniProt entry records no prostaglandin reaction, and
      AKR1A1 has no prostaglandin-related GO annotation.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether AKR1A1 belongs among the PGF2alpha synthases of this module or
      the RGD assignment should be withdrawn.
    resolution: >-
      Assay purified human AKR1A1 with PGH2 and NADPH alongside AKR1B1 and AKR1C3
      controls, and measure PGF2alpha output in AKR1A1-depleted cells that express
      it.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001243.yaml
        supporting_text: The PGH2 based route is believed to be the result of Fam213b oxidoreductase activity as well as of Akr1a1 and Akr1b1 activities
module:
  id: prostanoid_biosynthesis
  label: Prostanoid biosynthesis
  module_type: METABOLIC_PATHWAY
  description: >-
    Arachidonate is converted by COX-1 or COX-2 to PGH2, which cell-specific terminal
    isomerases and reductases convert to PGE2, PGD2, PGI2, TXA2 or PGF2alpha.
  concepts:
    - preferred_term: prostanoid biosynthetic process
      term:
        id: GO:0046457
        label: prostanoid biosynthetic process
      description: >-
        Formation of prostaglandins, prostacyclin and thromboxanes from arachidonate
        through the PGH2 endoperoxide.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Members are grounded on the human proteins; the RGD diagram is drawn for rat
          and the pathway is conserved across mammals.
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: >-
          COX-1, COX-2, prostacyclin synthase and thromboxane synthase are endoplasmic
          reticulum membrane enzymes.
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          Asserted alongside the endoplasmic reticulum membrane because the soluble
          terminal enzymes (cPGES/p23, HPGDS, AKR1C3, AKR1B1, PRXL2B, CBR1) act in the
          cytosol on PGH2 released from the membrane-bound COX.
  parts:
    - order: 1
      role: cyclooxygenase conversion of arachidonate to PGH2
      node:
        id: pgh2_formation
        label: Cyclooxygenase and peroxidase conversion of arachidonate to PGH2
        module_type: REACTION
        description: >-
          The committed step. The cyclooxygenase site adds two O2 to arachidonate to
          form PGG2, and the peroxidase site of the same enzyme reduces the
          15-hydroperoxide of PGG2 to give PGH2. COX-1 and COX-2 catalyse the same
          chemistry and differ in regulation: COX-1 is constitutive and COX-2 is
          induced.
        concepts:
          - preferred_term: cyclooxygenase pathway
            term:
              id: GO:0019371
              label: cyclooxygenase pathway
        variant_sets:
          - id: cox_isoform
            label: Cyclooxygenase isoform
            axis: enzyme isoform (constitutive vs inducible)
            selection: ONE_OR_MORE
            variants:
              - id: cox1_variant
                label: COX-1 (PTGS1)
                module_type: REACTION
                annotons:
                  - id: ptgs1_cox
                    label: COX-1 (PTGS1) prostaglandin-endoperoxide synthase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PTGS1 (COX-1)
                        term:
                          id: UniProtKB:P23219
                          label: Prostaglandin G/H synthase 1
                    function:
                      preferred_term: prostaglandin-endoperoxide synthase activity
                      term:
                        id: GO:0004666
                        label: prostaglandin-endoperoxide synthase activity
                      substrates:
                        - preferred_term: arachidonate
                          term:
                            id: CHEBI:32395
                            label: arachidonate
                        - preferred_term: O2
                          term:
                            id: CHEBI:15379
                            label: dioxygen
                        - preferred_term: reductant (AH2)
                          term:
                            id: CHEBI:17499
                            label: hydrogen donor
                      products:
                        - preferred_term: prostaglandin H2
                          term:
                            id: CHEBI:57405
                            label: prostaglandin H2(1-)
                        - preferred_term: oxidised reductant (A)
                          term:
                            id: CHEBI:13193
                            label: hydrogen acceptor
                        - preferred_term: water
                          term:
                            id: CHEBI:15377
                            label: water
                      evidence:
                        - source_id: RHEA:23728
                          statement: >-
                            (5Z,8Z,11Z,14Z)-eicosatetraenoate + AH2 + 2 O2 = prostaglandin
                            H2 + A + H2O; the overall reaction and the Rhea xref of
                            GO:0004666.
                        - source_id: RHEA:42596
                          statement: >-
                            Cyclooxygenase half-reaction: arachidonate + 2 O2 =
                            prostaglandin G2 (CHEBI:82629).
                        - source_id: RHEA:42600
                          statement: >-
                            Peroxidase half-reaction: prostaglandin G2 + AH2 =
                            prostaglandin H2 + A + H2O.
                    processes:
                      - preferred_term: cyclooxygenase pathway
                        term:
                          id: GO:0019371
                          label: cyclooxygenase pathway
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    role_description: >-
                      Constitutive cyclooxygenase of most tissues and the only COX of
                      platelets, where it supplies PGH2 to thromboxane synthase;
                      preferentially coupled to cPGES/p23 for immediate PGE2 synthesis.
                    evidence:
                      - source_id: PMID:7947975
                        statement: >-
                          Purified recombinant human PGHS-1 and PGHS-2 both have
                          cyclooxygenase and peroxidase activity with arachidonate as
