id: MODULE:dmel_stripak_complex
title: STRIPAK complex in Drosophila melanogaster
description: >-
  The striatin-interacting phosphatase and kinase (STRIPAK) complex is a large, conserved
  assembly built around a PP2A phosphatase whose regulatory B subunit is a striatin. In Drosophila
  the striatin is Connector of kinase to AP-1 (Cka), which binds the PP2A scaffold (A) subunit
  Pp2A-29B and the catalytic subunit Microtubule star (Mts) together with Mob4, Strip, Slmap
  and Fgop2. Ccm3 links germinal-centre kinase III family kinases to the complex. STRIPAK
  restrains the Hippo pathway by dephosphorylating the Hippo kinase, and also acts in JNK
  signaling, axon transport, synapse development and centrosome positioning.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000915
  title: 'FlyBase gene group STRIPAK: Striatin-interacting phosphatase and kinase complex'
  statement: >-
    FlyBase release FB2026_03 groups 9 D. melanogaster genes as striatin-interacting phosphatase
    and kinase complex (STRIPAK); this module models that group.
- source_id: GO:0090443
  title: FAR/SIP/STRIPAK complex
  statement: >-
    GO term grounding the module as FAR/SIP/STRIPAK complex.
notes: >-
  The PP2A core subunits mts and Pp2A-29B are shared with dmel_pp2a_holoenzymes. GCKIII kinases
  (GckIII) and the Hippo kinase (hpo) are binding partners or substrates and are not parts.
  The position of Fgop2 and Slmap within the complex is inferred from mammalian STRIPAK. FlyBase
  groups realized by this module: STRIPAK (FBgg0000915). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_stripak_complex.yaml; none of the member genes has a gene review
  yet unless noted.
