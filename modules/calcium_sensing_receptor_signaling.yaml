        id: GO:0071277
        label: cellular response to calcium ion
      description: >-
        Broad GO process; GO has no calcium-sensing receptor signaling pathway term. The
        module is the CaSR-initiated share of the cellular response to extracellular calcium.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Members are grounded on the human proteins; the diagram is RGD's rat curation and the
          pathway is conserved across vertebrates.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: CaSR, its G proteins, GRKs and arrestins act at the plasma membrane.
  parts:
    - order: 1
      role: CaSR activation by extracellular calcium and G protein coupling
      node:
        id: casr_receptor
        label: CaSR senses extracellular calcium and couples to Gq/11 and Gi/o
        module_type: REGULATORY_STEP
        description: >-
          Extracellular Ca2+ binds the Venus flytrap domains of the CaSR homodimer; the active
          receptor acts as a guanine nucleotide exchange factor for G alpha q/11 and G alpha i/o.
        annotons:
          - id: casr_gpcr
            label: CaSR G protein-coupled receptor activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CASR
                term:
                  id: UniProtKB:P41180
                  label: Extracellular calcium-sensing receptor
            function:
              preferred_term: G protein-coupled receptor activity
              term:
                id: GO:0004930
                label: G protein-coupled receptor activity
            processes:
              - preferred_term: detection of calcium ion
                term:
                  id: GO:0005513
                  label: detection of calcium ion
              - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
                term:
                  id: GO:0007200
                  label: phospholipase C-activating G protein-coupled receptor signaling pathway
              - preferred_term: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
                term:
                  id: GO:0007193
                  label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
            locations:
