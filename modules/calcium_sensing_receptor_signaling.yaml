                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Class C dimeric GPCR whose principal agonist is extracellular Ca2+; the hub of the
              module and the target of AP2 endocytosis, PKC feedback and GRK/arrestin
              desensitization.
            evidence:
              - source_id: PMID:8255296
                statement: >-
                  The parathyroid cell-surface Ca2+ sensor couples through phosphoinositide
                  turnover and cytosolic Ca2+ to regulation of PTH secretion.
                supporting_text: >-
                  couples by changes in phosphoinositide turnover and cytosolic Ca2+ to
                  regulation of parathyroid hormone secretion
              - source_id: PMID:27434672
                statement: Extracellular Ca2+ is the principal CaSR agonist.
                supporting_text: >-
                  The general consensus is that the principal agonist of CaSR is extracellular
                  Ca2+
              - source_id: PMID:38632411
                statement: In parathyroid and kidney CaSR signals through Gq/11 and Gi/o.
                supporting_text: In parathyroid and kidney, CaSR signals through Gq/11 and Gi/o
              - source_id: PMID:38326620
                statement: The receptor couples selectively to Gi and Gq through distinct interfaces.
                supporting_text: >-
                  Selective Gi and Gq coupling by the receptor is achieved through substantial
                  rearrangements of intracellular loop 2 and the C terminus
