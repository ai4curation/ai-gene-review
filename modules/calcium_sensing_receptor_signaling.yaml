id: MODULE:calcium_sensing_receptor_signaling
title: Calcium-sensing receptor signaling — extracellular calcium activation of CaSR, Gq/11-phospholipase C and Gi/o-adenylyl cyclase coupling, AP2-dependent endocytic signalling, PKC feedback, and GRK/beta-arrestin desensitization
description: >-
  The calcium-sensing receptor (CaSR) is a class C G protein-coupled receptor that detects
  the concentration of extracellular calcium and sets the body's calcium set point. It is
  most abundant in the parathyroid glands, where its activation suppresses parathyroid
  hormone secretion, and in the kidney, where it regulates calcium reabsorption. CaSR is an
  obligate disulfide-linked homodimer; calcium ions bind cooperatively in the Venus flytrap
  domains of its large extracellular region, closing them and driving an asymmetric
  rearrangement of the seven-transmembrane domains. The active receptor couples to
  G alpha q/11, which activates phospholipase C beta to produce inositol trisphosphate
  (release of stored calcium) and diacylglycerol (protein kinase C), and to G alpha i/o,
  which inhibits adenylyl cyclase and lowers cAMP. Loss-of-function mutations in CASR, in
  GNA11 (G alpha 11) or in AP2S1 (the sigma 2 subunit of the clathrin adaptor AP-2, which
  mediates CaSR endocytosis and sustained signalling) each cause familial hypocalciuric
  hypercalcaemia, and gain-of-function CASR and GNA11 mutations cause autosomal dominant
  hypocalcaemia. Protein kinase C phosphorylation of the receptor tail feeds back to blunt
  calcium mobilization, and G protein-coupled receptor kinases and beta-arrestins
  desensitize the receptor.
status: DRAFT
scope: CONCRETE
references:
  - id: PMID:8255296
    title: Cloning and characterization of an extracellular Ca(2+)-sensing receptor from bovine parathyroid.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Brown et al., Nature 1993). Abstract only. Cloning of CaSR; the
        native sensor couples through phosphoinositide turnover and cytosolic calcium to PTH
        secretion.
  - id: PMID:27434672
    title: Structural mechanism of ligand activation in human calcium-sensing receptor.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached (Geng et al., eLife 2016); source of CASR IDA rows for calcium ion
        binding and detection of calcium ion. Cited for Ca2+ as principal agonist and the
        range of G protein couplings.
  - id: PMID:38632411
    title: Promiscuous G-protein activation by the calcium-sensing receptor.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached (Zuo et al., Nature 2024); CaSR-Gq and CaSR-Gi structures; source of
        CASR IDA rows for GO:0007193 and GO:0007200.
  - id: PMID:38326620
    title: Allosteric modulation and G-protein selectivity of the Ca(2+)-sensing receptor.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached (He et al., Nature 2024); CaSR coupling to Gi versus Gq in nanodiscs.
  - id: PMID:23802516
    title: Mutations affecting G-protein subunit α11 in hypercalcemia and hypocalcemia.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Nesbit et al., NEJM 2013); full text cached. GNA11 loss-of-function
        causes FHH2 and gain-of-function causes ADH2, by changing cell sensitivity to
        extracellular calcium.
  - id: PMID:23222959
    title: Mutations in AP2S1 cause familial hypocalciuric hypercalcemia type 3.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached (Nesbit et al., Nat Genet 2013). AP2S1 Arg15 mutations reduce CaSR
        endocytosis and cell sensitivity to extracellular calcium.
  - id: PMID:9694886
    title: Protein kinase C phosphorylation of threonine at position 888 in Ca2+o-sensing receptor (CaR) inhibits coupling to Ca2+ store release.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Abstract only (Bai et al., JBC 1998). PKC phosphorylation of CaSR Thr888 inhibits
        receptor-evoked calcium release.
  - id: PMID:15637145
    title: Beta-arrestin- and G protein receptor kinase-mediated calcium-sensing receptor desensitization.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (Pi et al., Mol Endocrinol 2005; RGD diagram reference RGD:7207060).
        Abstract only. GRK4 and GRK2 desensitize CaSR; beta-arrestin2 null mice show altered
        PTH responses.
evidence:
  - source_id: PW:0001141
    title: calcium signaling pathway via the calcium-sensing receptor
    statement: >-
      The module boundary follows the RGD diagram for this Pathway Ontology term: Ca2+,
      calcimimetics and calcilytics associated with Casr; Casr feeding the Galphaq, Galphai and
      Galpha12/13 family G protein pathways, giving increased DAG/IP3 via PLC activation (and
      PKC signalling) and inhibition of adenylyl cyclases/decreased cAMP; GRKs acting
      negatively on Casr, with Arrb1 and Arrb2 associated with it; RGS proteins acting
      negatively on the three G protein pathways; Flna associated with Casr; and Casr acting
      negatively on PTH secretion and the parathyroid hormone signaling pathway. Derived
      through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001141.yaml).
  - source_id: GO:0071277
    title: cellular response to calcium ion
    statement: >-
      The closest GO process; GO has no calcium-sensing receptor signaling pathway term, and
      this term covers every cellular response to calcium (see notes).
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001141 (12 RGD-curated human genes)
  through the RGD_PATHWAY_ONTOLOGY project, where it sits in the no_specific_go_term tier.

  GO term search. The go-basic release used for validation (2026-07-26) was searched again
  for calcium-sensing, extracellular calcium, calcium ion sensing and calcium response terms.
  There is no CaSR signaling pathway term and no receptor-specific molecular function term
  (no "calcium-sensing receptor activity"). The live terms are GO:0071277 cellular response
  to calcium ion (module concept, as on the project page), GO:0005513 detection of calcium
  ion (synonym calcium ion sensing), which CASR carries by IDA and as a CASR review core
  process and which is used on the receptor annoton, and the generic G protein routes
  GO:0007200 and GO:0007193, also CASR IDA rows. The two "calcium-mediated signaling using
  extracellular/intracellular calcium source" terms are obsolete. A CaSR signaling pathway
  term is requested in proposed_new_terms.

  Molecular functions come from experimental GOA rows or gene review core functions: CASR
  GO:0004930 G protein-coupled receptor activity (IDA; CASR review core); GNA11 and GNAQ
  GO:0003925 G protein activity (IDA; review core); GNAI1 and GNAI2 GO:0003925 (IDA; review
  core); AP2S1 GO:0035615 clathrin-cargo adaptor activity (TAS, accepted in the AP2S1
  review, whose core functions carry no molecular function); GRK2 GO:0004703 (IDA; review
  core); ARRB1/ARRB2 GO:0030674 protein-macromolecule adaptor activity (IDA), as in the
  sibling pth_receptor_signaling module. The ligand, extracellular Ca2+, is a chemical and
  not an annoton; calcimimetics (positive allosteric modulators such as cinacalcet) and
  calcilytics are pharmacology, recorded here only.

  Shared steps by reference. The Gq/11 route reuses the phospholipase C beta step of
  modules/gpcr_plc_calcium_pkc_signaling.yaml by module_ref, as pth_receptor_signaling does,
  and the PKC step of the same module is referenced for the feedback loop. The G alpha 11/q
  annoton is kept local because GNA11 is a disease gene of this pathway (FHH2/ADH2). The
  Gi/o route has no generic module, so the G alpha i annoton is local and its target, the
  adenylyl cyclase step of modules/gpcr_camp_pka_signaling.yaml, is referenced and connected
  with NEGATIVELY_REGULATES. Downstream PKA, IP3 receptor calcium release and PTH secretion
  are outside the module.

  Added genes. GNA11, GNAQ, GNAI1, GNAI2 and AP2S1 are not on RGD's curated list for
  PW:0001141 (RGD represents the G protein steps as links to PW:0000229 and PW:0000228) but
  the coupling steps cannot be modelled without the G alpha subunits, and GNA11 and AP2S1 are
  the FHH2 and FHH3 genes that regulate CaSR signalling directly (PMID:23802516,
  PMID:23222959). AP2S1 is modelled as a regulator that sustains signalling: FHH3 mutations
  reduce CaSR endocytosis and decrease cell sensitivity to extracellular calcium, and loss of
  the CaSR dileucine motif that AP2 sigma 2 recognises also reduces intracellular signalling,
  so AP2-mediated endocytosis supports rather than ends the response here.

  Termination and feedback. GRK4 and GRK2 desensitize CaSR and beta-arrestin2 matters in vivo
  (PMID:15637145); GRK3, also on the RGD list, has no specific CaSR evidence in the cached
  literature and is mentioned only. PKC phosphorylation of Thr888 blunts receptor-evoked
  calcium release (PMID:9694886). The RGS proteins on the RGD list (RGS2, RGS4, RGS5, RGS12)
  act on the G alpha subunits generally and are not modelled as parts; the RGD record notes
  that several inhibit CaSR signalling, but no cached paper was found to ground a specific
  one. Filamin A (FLNA) and RHOA, the G12/13-Rho route, Gs coupling in breast cancer cells,
  and the ERK/MAPK outputs (RGD links PW:0000230, PW:0000105, PW:0000102) are out of scope;
  FLNA binds the receptor tail and scaffolds Rho signalling (RGD record text) and belongs with
  a Rho module.

  GO-CAM grounding. CASR is linked to its two human models: the Gq model
  gomodel:67c10cc400004380 (CASR, GNAQ, PLCB3) and the Gi model gomodel:67c10cc400004342
  (CASR, GNAI1, ADCY6). PLCB3 and ADCY6 are in the referenced generic modules. GNA11 is not in
  either CASR model, which uses GNAQ. The GRK2 and arrestin annotons are linked, as in
  pth_receptor_signaling, to the desensitization model gomodel:67f85f2b00004426 built for
  C5AR1 (the seed's best_gocam lead): gene and function match but not the receptor. No cached
  GO-CAM covers AP2S1 with CaSR. GRK4, ARRB1 and ARRB2 have no gene review yet in this
  repository's genes/human tree, which is curation follow-up for the project plan.
proposed_new_terms:
- proposed_name: calcium-sensing receptor signaling pathway
  proposed_definition: >-
    A G protein-coupled receptor signaling pathway initiated by extracellular calcium ions
    binding to the calcium-sensing receptor (CaSR) on the surface of a target cell, and ending
    with the regulation of a downstream cellular process.
  justification: >-
    GO has no CaSR signaling pathway term. The module concept uses GO:0071277 cellular response
    to calcium ion, and the receptor annoton uses the generic G protein routes GO:0007200 and
    GO:0007193.
  proposed_parent:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  supported_by:
  - reference_id: PMID:27434672
    supporting_text: The general consensus is that the principal agonist of CaSR is extracellular Ca2+
  - reference_id: PMID:38632411
    supporting_text: In parathyroid and kidney, CaSR signals through Gq/11 and Gi/o
