id: MODULE:g2_m_transition
title: G2/M transition of the mitotic cell cycle (mitotic entry)
description: >-
  A taxon-neutral decomposition of mitotic entry, the switch-like activation of
  cyclin B-CDK1 (Cdc2/Cdc28-Clb2/Cdc13) at the G2/M transition. Five steps are
  modeled: (1) assembly of the cyclin B-CDK1 holoenzyme and activating T-loop
  phosphorylation by the CDK-activating kinase (CDK7-cyclin H-MAT1 in metazoa
  and Mcs6-Mcs2 in fission yeast; the unrelated single-subunit Cak1 in budding
  yeast); (2) inhibitory phosphorylation of CDK1 Tyr15 (and Thr14) by the
  Wee1/Mik1/Swe1 and Myt1 kinases, which holds the complex inactive through G2;
  (3) activating dephosphorylation by the Cdc25 (Mih1) phosphatase, which
  triggers mitotic entry; (4) the Polo-like kinase (PLK1, Cdc5, Plo1), which
  reinforces the transition by activating Cdc25 and priming Wee1 for
  destruction; and (5) the Greatwall-endosulfine axis (MASTL/Rim15/Ppk18 ->
  ENSA-ARPP19/Igo1-2/Igo1 -| PP2A-B55), which suppresses the CDK-counteracting
  phosphatase so that CDK substrate phosphorylation can accumulate. Mutual
  antagonism between CDK1 and Wee1, and positive feedback between CDK1 and
  Cdc25, make the transition bistable and irreversible. Checkpoint kinases that
  restrain Cdc25 and activate Wee1 after DNA damage are modeled as an optional
  regulatory part. Representative members are drawn from human, Saccharomyces
  cerevisiae and Schizosaccharomyces pombe. Grounded in GO:0000086 (G2/M
  transition of mitotic cell cycle).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000086
    title: G2/M transition of mitotic cell cycle
    statement: The module is grounded in the GO biological process term for the G2/M transition.
  - source_id: PMID:2138713
    title: Universal control mechanism regulating onset of M-phase
    statement: >-
      Establishes that a cyclin B-cdc2 (CDK1) kinase, activated by tyrosine
      dephosphorylation, is the universal trigger of M-phase onset in
      eukaryotes.
  - source_id: PMID:2682257
    title: Tyrosine phosphorylation of the fission yeast cdc2+ protein kinase regulates entry into mitosis
    statement: >-
      Tyr15 phosphorylation of cdc2 is inhibitory and its removal is the
      rate-limiting event for mitotic entry in fission yeast.
  - source_id: PMID:3032459
    title: Negative regulation of mitosis by wee1+, a gene encoding a protein kinase homolog
    statement: wee1 encodes a protein kinase that negatively regulates mitotic entry.
  - source_id: PMID:1706223
    title: mik1 and wee1 cooperate in the inhibitory tyrosine phosphorylation of cdc2
    statement: >-
      Wee1 and its paralog Mik1 are the kinases that phosphorylate cdc2 Tyr15 in
      fission yeast.
  - source_id: PMID:3955656
    title: cdc25+ functions as an inducer in the mitotic control of fission yeast
    statement: cdc25 is a dosage-dependent inducer of mitosis that antagonizes wee1.
  - source_id: PMID:1825803
    title: The cdc25 protein controls tyrosine dephosphorylation of the cdc2 protein in a cell-free system
    statement: Cdc25 controls the tyrosine dephosphorylation of cdc2 that activates the kinase.
  - source_id: PMID:1655274
    title: The cdc25 protein contains an intrinsic phosphatase activity
    statement: Cdc25 is itself the CDK1-Tyr15 phosphatase.
  - source_id: PMID:19364923
    title: "The decision to enter mitosis: feedback and redundancy in the mitotic entry network"
    statement: >-
      Review of the mitotic entry network: cyclin B-CDK1, Wee1/Myt1, Cdc25 and
      PLK1 form feedback loops that make the G2/M switch bistable and robust.
  - source_id: PMID:8069918
    title: A novel cyclin associates with MO15/CDK7 to form the CDK-activating kinase
    statement: CDK7 with cyclin H constitutes the CDK-activating kinase (CAK) in metazoa.
  - source_id: PMID:8752210
    title: The Cdk-activating kinase (CAK) from budding yeast
    statement: >-
      Budding yeast uses Cak1, a single-subunit kinase unrelated to CDK7, as its
      CDK-activating kinase.
  - source_id: PMID:16280550
    title: "Secrets of a double agent: CDK7 in cell-cycle control and transcription"
    statement: >-
      Review of CDK7-cyclin H-MAT1 as both the CDK-activating kinase and the
      TFIIH CTD kinase, and of the Mcs6/Csk1 arrangement in fission yeast.
  - source_id: PMID:8703070
    title: Purification and molecular cloning of Plx1, a Cdc25-regulatory kinase from Xenopus egg extracts
    statement: Polo-like kinase phosphorylates and activates Cdc25 at mitotic entry.
  - source_id: PMID:7744248
    title: The conserved Schizosaccharomyces pombe kinase plo1, required to form a bipolar spindle, the actin ring, and septum, can drive septum formation in G1 and G2 cells
    statement: Plo1 is the fission-yeast Polo kinase.
  - source_id: PMID:21164013
    title: Greatwall phosphorylates an inhibitor of protein phosphatase 2A that is essential for mitosis
    statement: >-
      Greatwall kinase phosphorylates ENSA, converting it into an inhibitor of
      PP2A-B55 that is essential for mitotic entry and maintenance.
  - source_id: PMID:21164014
    title: The substrate of Greatwall kinase, Arpp19, controls mitosis by inhibiting protein phosphatase 2A
    statement: >-
      Greatwall-phosphorylated Arpp19 inhibits PP2A-B55, allowing CDK1 substrate
      phosphorylation to accumulate at mitotic entry.
  - source_id: PMID:11448769
    title: Fission yeast Clp1p phosphatase regulates G2/M transition and coordination of cytokinesis with cell cycle progression
    statement: >-
      The Cdc14-family phosphatase Clp1 antagonizes mitotic entry in fission
      yeast by dephosphorylating Cdc25, an example of a CDK-counteracting
      phosphatase acting at G2/M.
  - source_id: PMID:1165770
    title: Genetic control of cell size at cell division in yeast
    statement: >-
      wee mutants of fission yeast divide at reduced size, showing that the
      G2/M control couples growth to division.
  - source_id: PMID:11413462
    title: Mitotic kinases as regulators of cell division and its checkpoints
    statement: Review of CDK1, Polo and Aurora kinases in mitotic entry and progression.
  - source_id: PMID:10637286
    title: Regulation of mitotic inhibitor Mik1 helps to enforce the DNA damage checkpoint
    statement: >-
      Checkpoint signalling upregulates the Wee1 paralog Mik1 to enforce the
      G2/M DNA-damage delay in fission yeast.
  - source_id: PMID:11298456
    title: The ATM-Chk2-Cdc25A checkpoint pathway guards against radioresistant DNA synthesis
    statement: >-
      Checkpoint kinases phosphorylate Cdc25A to trigger its degradation, an
      example of checkpoint restraint acting on the Cdc25 phosphatase.
notes: >-
  Boundary decisions. The module starts with cyclin B accumulation in G2 and
  ends with fully active cyclin B-CDK1; the downstream execution of mitosis
  (nuclear envelope breakdown, spindle assembly, chromosome condensation) and
  the subsequent metaphase/anaphase transition are separate modules. Cyclin B
  nuclear import and CDK1-cyclin B centrosomal activation are localisation
  details recorded in annoton locations rather than as parts. The CAK step is
  split by taxon because the budding-yeast Cak1 is not a CDK7 ortholog. The
  Greatwall-endosulfine axis is included as an optional part: it is essential
  for mitotic entry in metazoa, whereas in fission yeast Ppk18-Igo1-PP2A(Pab1)
  primarily couples TORC1/nutrient status to mitotic timing and in budding
  yeast Rim15-Igo1/2-PP2A(Cdc55) is best characterised in quiescence entry,
  with PP2A-Cdc55 acting on Swe1/Mih1 during mitotic entry. The checkpoint
  restraint part is optional context for the same reason. The Wee1 annoton
  spans Wee1-type and Myt1/Mik1-type kinases within one PANTHER family
  (PTHR11042), whose PANTHER name is dominated by the eIF2-alpha kinases.
  Deep research: no module deep-research report accompanies this file (no
  provider credentials were available in the authoring session; hand-writing one
  under a provider name is prohibited). Open questions: the relative
  contribution of PP2A-B55 inhibition versus Cdc25 activation to the switch in
  each lineage; whether Cdc25 activation by PLK1 or by CDK1 feedback is the
  primary trigger in human somatic cells; and how cell size is read by the
  Cdr2-Wee1 / Cdc25-scaling systems in fission yeast (recorded in the pombe
  GO-CAM gomodel:69729a3800001390 but outside this module boundary).
module:
