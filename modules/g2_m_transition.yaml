  description: >-
    Cyclin B-CDK1 is assembled and T-loop-phosphorylated, held inactive by
    Wee1/Myt1 Tyr15 phosphorylation, and switched on by Cdc25 with Polo-kinase
    and Greatwall-endosulfine reinforcement.
