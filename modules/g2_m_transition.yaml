        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          The CDK1 / Wee1 / Cdc25 switch is conserved across eukaryotes;
          representative members are taken from human, Saccharomyces cerevisiae
          and Schizosaccharomyces pombe.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
        description: >-
          Cyclin B-CDK1 accumulates in the cytoplasm and at the centrosome/spindle
          pole body during G2 and translocates to the nucleus at prophase; both
          compartments are therefore listed intentionally.
