                            term:
                              id: UniProtKB:P60651
                              label: Agmatinase
                          - preferred_term: agm1 (S. pombe, SPAC11D3.09)
                            term:
                              id: UniProtKB:Q10088
                              label: Putative agmatinase 1
                          - preferred_term: agm2 (S. pombe, SPAPB24D3.03)
                            term:
                              id: UniProtKB:Q9C0Y9
                              label: Putative agmatinase 3
                            description: PomBase agm2; UniProt calls it "putative agmatinase 3".
                          - preferred_term: agm3 (S. pombe, SPBC8E4.03)
                            term:
                              id: UniProtKB:O42887
                              label: Putative agmatinase 2
                            description: PomBase agm3; UniProt calls it "putative agmatinase 2".
                    function:
                      preferred_term: agmatinase activity
                      term:
                        id: GO:0008783
                        label: agmatinase activity
                      substrates:
                        - preferred_term: agmatine
                        - preferred_term: water
                      products:
                        - preferred_term: putrescine
                        - preferred_term: urea
                      evidence:
                        - source_id: EC:3.5.3.11
                          statement: agmatinase
                    role_description: >-
                      The PomBase model places the S. pombe agmatinases on the
