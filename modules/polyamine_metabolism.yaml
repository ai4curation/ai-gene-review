id: MODULE:polyamine_metabolism
title: Eukaryotic polyamine metabolism (biosynthesis, back-conversion and antizyme feedback)
description: >-
  The polyamines putrescine, spermidine and spermine are small polycations
  needed for eukaryotic cell growth. They stabilise nucleic acids and
  chromatin, regulate ion channels and act in translation. Spermidine is also
  the precursor of the hypusine modification of eIF5A, which is why it is
  essential in yeast. Biosynthesis begins with ornithine decarboxylase (ODC),
  a short-lived PLP-dependent enzyme that decarboxylates L-ornithine to
  putrescine and is the main control point. Some lineages also make
  putrescine by hydrolysing agmatine with agmatinase. In parallel, a
  pyruvoyl-dependent S-adenosylmethionine decarboxylase makes decarboxylated
  SAM (dcSAM), the only aminopropyl donor. Spermidine synthase transfers an
  aminopropyl group from dcSAM to putrescine to make spermidine. Where
  spermine is made, a spermine synthase adds a second aminopropyl group.
  Animals use a dedicated SMS family for this, and budding yeasts use the
  SPE3 paralogue SPE4. Each transfer releases 5'-methylthioadenosine (MTA),
  which the methionine salvage cycle recycles. Back-conversion catabolism
  oxidises spermine or N1-acetylated polyamines with FAD-dependent polyamine
  oxidases to give shorter polyamines plus an aminoaldehyde and H2O2. In
  animals, SAT1 N1-acetylates polyamines and peroxisomal PAOX then oxidises
  them, while SMOX oxidises free spermine. In budding yeast a single oxidase,
  Fms1, oxidises both spermine and N1-acetylpolyamines, and its
  3-aminopropanal product is the source of beta-alanine for pantothenate and
  coenzyme A synthesis. ODC is controlled by antizyme, a protein whose
  synthesis needs a +1 ribosomal frameshift that polyamines stimulate.
  Antizyme binds ODC and targets it for ubiquitin-independent proteasomal
  degradation. In vertebrates, antizyme inhibitors (catalytically dead ODC
  paralogues) bind antizyme and release ODC.
status: DRAFT
evidence:
  - source_id: YeastPathways:POLYAMSYN-YEAST-PWY
    title: superpathway of polyamine biosynthesis
    statement: >-
      Source superpathway for S. cerevisiae: SPE1 ODC, SPE2 AdoMetDC, SPE3
      spermidine synthase and SPE4 spermine synthase. All four assignments are
      kept. YeastCyc has no catabolic or regulatory frame; FMS1, PAA1 and OAZ1
      were added from the literature.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=POLYAMSYN-YEAST-PWY
  - source_id: YeastPathways:BSUBPOLYAMSYN-PWY
    title: spermidine biosynthesis I
    statement: SPE2 and SPE3 subpathway (dcSAM + putrescine to spermidine).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=BSUBPOLYAMSYN-PWY
  - source_id: YeastPathways:ARGSPECAT-PWY
    title: spermine biosynthesis
    statement: SPE2 and SPE4 subpathway (dcSAM + spermidine to spermine).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARGSPECAT-PWY
  - source_id: YeastPathways:PWY-46
    title: putrescine biosynthesis III
    statement: SPE1 ornithine decarboxylase (ornithine to putrescine).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-46
  - source_id: GO:0006596
    title: polyamine biosynthetic process
    statement: ODC (or agmatinase), AdoMetDC, spermidine synthase and spermine synthase carry out polyamine biosynthesis.
  - source_id: GO:0006598
    title: polyamine catabolic process
    statement: Polyamine N1-acetyltransferases and FAD polyamine oxidases carry out back-conversion.
  - source_id: PMID:9073064
    title: 'Spermidine biosynthesis in Saccharomyces cerevisae: polyamine requirement of a null mutant of the SPE3 gene (spermidine synthase).'
    statement: SPE3 is the only yeast spermidine synthase, and spermidine is essential.
    supporting_text: >-
      we constructed a null mutant of this gene, spe3delta, which has no
      spermidine synthase activity and has an absolute requirement for
      spermidine or spermine for the growth.
  - source_id: PMID:9573363
    title: 'Spermine is not essential for growth of Saccharomyces cerevisiae: identification of the SPE4 gene (spermine synthase) and characterization of a spe4 deletion mutant.'
    statement: SPE4 is the yeast spermine synthase, and spermine is dispensable.
    supporting_text: >-
      This mutant has neither spermine nor spermine synthase activity. Using
      the spe4 deletion mutant, we show that S. cerevisiae does not require
      spermine for growth
  - source_id: PMID:12670477
    title: Yeast Fms1 is a FAD-utilizing polyamine oxidase.
    statement: Fms1 oxidises spermine and N1-acetylpolyamines, but not spermidine.
    supporting_text: >-
      Biochemical characterization of Fms1 shows that it can oxidize spermine,
      N(1)-acetylspermine, N(1)-acetylspermidine, and N(8)-acetylspermidine,
      but not spermidine. The products of spermine oxidation are spermidine
      and 3-aminopropanal.
  - source_id: PMID:11154694
    title: Saccharomyces cerevisiae is capable of de Novo pantothenic acid biosynthesis involving a novel pathway of beta-alanine production from spermine.
    statement: FMS1 and all SPE genes are needed for beta-alanine, which comes from spermine.
    supporting_text: >-
      we found that all the enzymes of the polyamine pathway in yeast are
      necessary for beta-alanine biosynthesis; spe1Delta, spe2Delta,
      spe3Delta, and spe4Delta are all beta-alanine auxotrophs.
  - source_id: PMID:15723835
    title: A yeast polyamine acetyltransferase.
    statement: PAA1 acetylates putrescine, spermidine and spermine, and lowers the spermine available for beta-alanine.
    supporting_text: >-
      The recombinant Paa1 protein readily acetylates various polyamines such
      as putrescine, spermidine, and spermine.
  - source_id: PMID:15538383
    title: Polyamines regulate their synthesis by inducing expression and blocking degradation of ODC antizyme.
    statement: >-
      Identifies S. cerevisiae OAZ1 antizyme, which is made by
      polyamine-regulated frameshifting and needed for proteasomal ODC
      degradation.
    supporting_text: >-
      We show that synthesis of yeast AZ (Oaz1) involves polyamine-regulated
      frameshifting as well. Degradation of yeast ODC by the proteasome
      depends on Oaz1.
  - source_id: PMID:10775274
    title: Conservation of polyamine regulation by translational frameshifting from yeast to mammals.
    statement: S. pombe antizyme (spa1) needs a +1 frameshift like mammalian antizyme.
    supporting_text: >-
      As shown here, the yeast antizyme gene and several newly identified
      antizyme genes from different nematodes also require a ribosomal
      frameshift event for their expression.
  - source_id: PMID:14506228
    title: Methylthioadenosine phosphorylase regulates ornithine decarboxylase by production of downstream metabolites.
    statement: >-
      The methionine salvage intermediate 4-methylthio-2-oxobutanoate
      represses ODC; meu1 deletion raises yeast ODC activity.
    supporting_text: >-
      We show that in Saccharomyces cerevisiae the MEU1 gene encodes MTAP and
      that Meu1delta cells have an 8-fold increase in ODC activity, resulting
      in large elevations in polyamine pools.
  - source_id: file:human/ODC1/ODC1-ai-review.yaml
    title: ODC1 gene review (human)
    statement: The ornithine-to-putrescine step (UniProtKB:P11926, GO:0004586) matches the completed human ODC1 review.
  - source_id: file:human/AMD1/AMD1-ai-review.yaml
    title: AMD1 gene review (human)
    statement: The SAM-to-dcSAM step (UniProtKB:P17707, GO:0004014) matches the completed human AMD1 review.
  - source_id: file:human/SRM/SRM-ai-review.yaml
    title: SRM gene review (human)
    statement: The putrescine-to-spermidine step (UniProtKB:P19623, GO:0004766) matches the completed human SRM review.
  - source_id: file:human/SMS/SMS-ai-review.yaml
    title: SMS gene review (human)
    statement: The animal spermidine-to-spermine step (UniProtKB:P52788, GO:0016768) matches the completed human SMS review.
  - source_id: file:human/SAT1/SAT1-ai-review.yaml
    title: SAT1 gene review (human)
    statement: The animal polyamine N1-acetylation step (UniProtKB:P21673, GO:0004145) matches the completed human SAT1 review.
  - source_id: file:human/PAOX/PAOX-ai-review.yaml
    title: PAOX gene review (human)
    statement: The animal N1-acetylpolyamine oxidation step (UniProtKB:Q6QHF9, GO:0052903) matches the completed human PAOX review.
  - source_id: file:human/SMOX/SMOX-ai-review.yaml
    title: SMOX gene review (human)
    statement: The animal direct spermine-to-spermidine oxidation step (UniProtKB:Q9NWM0, GO:0052901) matches the completed human SMOX review.
  - source_id: file:human/OAZ1/OAZ1-ai-review.yaml
    title: OAZ1 gene review (human)
    statement: The antizyme regulator (UniProtKB:P54368, GO:0008073) matches the completed human OAZ1 review.
  - source_id: file:human/AZIN1/AZIN1-ai-review.yaml
    title: AZIN1 gene review (human)
    statement: The antizyme inhibitor (UniProtKB:O14977, GO:0042978) matches the completed human AZIN1 review.
module:
  id: polyamine_metabolism
  label: Eukaryotic polyamine metabolism (biosynthesis, back-conversion, antizyme regulation)
  module_type: METABOLIC_PATHWAY
  description: >-
    ornithine (or agmatine) -> putrescine -> spermidine [-> spermine], using
    dcSAM from SAM; spermine / N1-acetylpolyamines -> spermidine -> putrescine
    by back-conversion; antizyme feedback on ODC.
  concepts:
    - preferred_term: polyamine biosynthetic process
      term:
        id: GO:0006596
        label: polyamine biosynthetic process
      description: Ornithine to putrescine to spermidine to spermine, using dcSAM aminopropyl groups.
    - preferred_term: polyamine catabolic process
      term:
        id: GO:0006598
        label: polyamine catabolic process
      description: N1-acetylation plus FAD-dependent oxidation (back-conversion).
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The biosynthetic enzymes and antizyme regulators are cytosolic in
          yeasts and animals (SGD and PomBase GO-CAMs, human reviews). Animal
          PAOX is peroxisomal; see that annoton.
  gocam_associations:
    - model: gomodel:YeastPathways_POLYAMSYN-YEAST-PWY
      title: "superpathway of polyamine biosynthesis - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_BSUBPOLYAMSYN-PWY
      title: "spermidine biosynthesis I - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_ARGSPECAT-PWY
      title: "spermine biosynthesis - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:67b1629100004168
      title: "polyamine biosynthetic process (GO:0006596) (S. pombe)"
  parts:
    - order: 1
      role: putrescine synthesis (rate-limiting)
      node:
        id: ornithine_to_putrescine
        label: Putrescine formation
        module_type: REACTION
        variant_sets:
          - id: putrescine_formation_variants
            label: Putrescine-forming routes
            axis: route variant
            selection: ONE_OR_MORE
            variants:
              - id: odc_route
                label: Ornithine decarboxylase (all eukaryotes examined)
                module_type: REACTION
                annotons:
                  - id: odc1_activity
                    label: Ornithine decarboxylase (ODC1/SPE1/spe1)
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: ornithine decarboxylase activity
                        term:
                          id: GO:0004586
                          label: ornithine decarboxylase activity
                      family:
                        preferred_term: ODC / group IV PLP decarboxylase family
                        description: >-
                          The family also contains the catalytically dead
                          antizyme inhibitors (AZIN1/AZIN2), so
                          required_function restricts the role.
                        family_terms:
                          - id: PANTHER:PTHR11482:SF42
                            label: ORNITHINE DECARBOXYLASE
                          - id: PANTHER:PTHR11482:SF6
                            label: ORNITHINE DECARBOXYLASE 1-RELATED
                          - id: PANTHER:PTHR11482:SF63
                            label: ORNITHINE DECARBOXYLASE
                          - id: PANTHER:PTHR11482:SF4
                            label: ANTIZYME INHIBITOR 2
                        representative_members:
                          - preferred_term: SPE1 (S. cerevisiae)
                            term:
                              id: UniProtKB:P08432
                              label: Ornithine decarboxylase
                          - preferred_term: spe1 (S. pombe, SPAC144.04c)
                            term:
                              id: UniProtKB:Q9UQW9
                              label: Ornithine decarboxylase
                          - preferred_term: ODC1 (human)
                            term:
                              id: UniProtKB:P11926
                              label: Ornithine decarboxylase
                    function:
                      preferred_term: ornithine decarboxylase activity
                      term:
                        id: GO:0004586
                        label: ornithine decarboxylase activity
                      substrates:
                        - preferred_term: L-ornithine (PLP cofactor)
                      products:
                        - preferred_term: putrescine
                        - preferred_term: CO2
                      evidence:
                        - source_id: file:human/ODC1/ODC1-ai-review.yaml
                          statement: PLP-dependent homodimer; rate-limiting first step of polyamine synthesis; short-lived and antizyme-regulated; ODC1 gain of function causes Bachmann-Bupp syndrome
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: Decarboxylates ornithine to putrescine (rate-limiting).
                    gocam_associations:
                      - model: gomodel:YeastPathways_POLYAMSYN-YEAST-PWY
                        activity: gomodel:ORNDECARBOX-RXN
                        title: "superpathway of polyamine biosynthesis (S. cerevisiae)"
                      - model: gomodel:67b1629100004168
                        activity: gomodel:67b1629100004168/67b1629100004218
                        title: "polyamine biosynthetic process (S. pombe)"
              - id: agmatinase_route
                label: Agmatinase (agmatine ureohydrolase; bacteria, asserted in S. pombe)
                module_type: REACTION
                description: >-
                  Hydrolysis of agmatine to putrescine and urea. In bacteria
                  the agmatine comes from biosynthetic arginine decarboxylase
                  (e.g. E. coli SpeA), which is outside this module. S. pombe
                  has three putative agmatinases in the PomBase model but no
                  arginine decarboxylase family (PTHR43295) member, so where
                  its agmatine comes from is unknown (see knowledge gaps).
                annotons:
