                      - model: gomodel:67b1629100004168
                        activity: gomodel:67b1629100004168/69d8496c00000112
                        title: "polyamine biosynthetic process (S. pombe; agm2)"
                      - model: gomodel:67b1629100004168
                        activity: gomodel:67b1629100004168/69d8496c00000123
                        title: "polyamine biosynthetic process (S. pombe; agm3)"
    - order: 2
