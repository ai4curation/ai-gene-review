    - source: spermidine_to_spermine
      target: polyamine_acetylation
      connection_type: PROVIDES_INPUT_FOR
      description: Spermine (and spermidine) are N-acetylated by SAT1 or PAA1.
    - source: spermidine_to_spermine
      target: polyamine_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: Free spermine is oxidised directly to spermidine by SMOX or Fms1.
    - source: polyamine_acetylation
      target: polyamine_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: N1-acetylpolyamines are oxidised by PAOX (animals) or Fms1 (yeast), completing back-conversion.
    - source: putrescine_to_spermidine
      target: antizyme
      connection_type: POSITIVELY_REGULATES
      description: >-
        Polyamines (spermidine) stimulate the +1 frameshift needed to make
        antizyme and, in yeast, block Oaz1 degradation, closing the feedback
        loop (PMID:15538383).
    - source: antizyme
      target: ornithine_to_putrescine
      connection_type: NEGATIVELY_REGULATES
      description: Antizyme binds ODC, inhibits it and targets it for ubiquitin-independent proteasomal degradation.
    - source: antizyme_inhibitor
      target: antizyme
      connection_type: NEGATIVELY_REGULATES
      description: AZIN1 sequesters antizyme, releasing active ODC.
  notes: >-
    Generalisation (crosswalk GENERALIZE, scope: eukaryotic polyamine
    biosynthesis). The original human-grounded module (nine human reviews:
    ODC1, AMD1, SRM, SMS, SAT1, PAOX, SMOX, OAZ1, AZIN1) is kept in full. The
    animal-specific enzymes are now lineage variants: SMS-family spermine
    synthase, SAT1, PAOX, SMOX and the AZIN1 inhibitor step. Fungal exemplars
    were added for every conserved step. Spermine synthesis, catabolism and
    the antizyme inhibitor are marked optional because spermine is
    dispensable in S. cerevisiae (PMID:9573363), S. pombe has no FMS1-like
    oxidase, and antizyme inhibitors are vertebrate-specific. The crosswalk
    rationale called FMS1 orthologous to the human oxidases. It is a member
    of the same FAD amine oxidase family but combines the SMOX and PAOX
    substrate ranges in one enzyme (PMID:12670477), so it is modelled as its
    own variant rather than as an orthologue of either.

    YeastCyc corrections: the four biosynthetic assignments (SPE1, SPE2, SPE3,
    SPE4; all cytosolic) are kept and agree with the committed SPE2, SPE3 and
    SPE4 reviews. SPE3 is the only spermidine synthase (PMID:9073064). The
    PAINT IBA spermidine synthase annotation on SPE4 is over-propagation from
    SPE3, and SPE4 is modelled with spermine synthase activity only. YeastCyc
    has no S. cerevisiae polyamine catabolism or regulation. Added here: FMS1
    polyamine oxidase (PMID:12670477), which also supplies beta-alanine
    (PMID:11154694); PAA1 polyamine acetyltransferase (PMID:15723835); and
    OAZ1 antizyme (PMID:15538383). Regulatory cross-talk: deletion of MEU1 in
    the methionine salvage cycle raises yeast ODC activity about 8-fold, and
    the salvage intermediate 4-methylthio-2-oxobutanoate represses ODC
    (PMID:14506228). Each aminopropyl transfer releases MTA, the entry
    substrate of methionine_salvage_mta_cycle.

    GO-CAM notes: (1) PomBase model gomodel:67b1629100004168 gives srm1
    (SPBC12C2.07c) both spermidine synthase (67b1629100004357) and spermine
    synthase (67b1629100004380) activities. S. pombe has no separate SMS or
    SPE4-like gene, and srm1 is used here only as a spermidine synthase
    exemplar. Whether S. pombe makes spermine through srm1 is left open. (2)
    The same model includes upstream supply activities (sam1 methionine
    adenosyltransferase; car1 and aru1 arginases; ort1 mitochondrial
    ornithine transporter), which are outside the module boundary, and three
    agmatinases (agm1-3) placed in putrescine biosynthesis. (3) The
    YeastPathways models agree with this module (MFs GO:0004586, GO:0004014,
    GO:0004766, GO:0016768; cytosol).

    Out of scope: eIF5A hypusination (consumes spermidine), polyamine
    transport (e.g. yeast TPO and DUR3 transporters, human ATP13A3), and the
    beta-alanine to pantothenate steps (coenzyme_a_biosynthesis). Diseases
    (human): ODC1 gain of function causes Bachmann-Bupp syndrome; SMS
    deficiency causes Snyder-Robinson syndrome.
knowledge_gaps:
  - gap_statement: >-
      The source of agmatine for the three putative S. pombe agmatinases
      (agm1-3), and whether they contribute to putrescine synthesis in vivo,
      are unknown.
    boundary: >-
      S. pombe has ODC (spe1) and no member of the biosynthetic arginine
      decarboxylase family (PTHR43295). The PomBase GO-CAM assigns agmatinase
      activity to agm1, agm2 and agm3.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether S. pombe really has a second putrescine route, or
      whether the agm proteins act on another guanidino substrate.
    resolution: >-
      Measure putrescine and agmatine in spe1 and spe1 agm1/2/3 deletion
      strains, and assay the purified agm proteins against agmatine and other
      guanidino compounds.
