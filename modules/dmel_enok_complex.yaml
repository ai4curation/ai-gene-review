id: MODULE:dmel_enok_complex
title: Enok histone acetyltransferase complex in Drosophila melanogaster
description: >-
  Enok (Enoki mushroom) is the Drosophila MOZ/MORF (KAT6) family MYST histone acetyltransferase.
  It forms a complex with the bromodomain-PHD scaffold Br140 (BRPF homolog), the ING-family
  protein Ing5 and Eaf6, the same subunit composition as the mammalian MOZ/MORF complexes.
  Enok acetylates histone H3 and was first identified through its requirement for mushroom
  body neuroblast proliferation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000604
  title: 'FlyBase gene group ENOK-C: Enok complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as enok complex (ENOK-C); this
    module models that group.
- source_id: GO:0070776
  title: MOZ/MORF histone acetyltransferase complex
  statement: >-
    GO term grounding the module as MOZ/MORF histone acetyltransferase complex.
notes: >-
  A small four-subunit complex without known sub-structure; it is decomposed one part per
  subunit. FlyBase groups realized by this module: ENOK-C (FBgg0000604). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_enok_complex.yaml; none of the member genes has a gene review yet
  unless noted.
