  notes: >-
    Backbone and characterized-protein groundings were mined from GapMind
    trp.steps and ModelSEED (see modules/experimental/gapmind-mining/), then
    curated: GO molecular-function terms were verified via QuickGO, reaction
    chemistry and channeling/fusion notes were added, and the GapMind
    anthranilate-synthase OR-rule (two-component vs single-protein) was curated
    into an EXACTLY_ONE variant set. EC numbers that GapMind records only as
    ignore_other (the true reaction ECs 4.1.3.27, 4.1.2.8, 4.2.1.20) were
    reinstated as reaction evidence.
    SCOPE - the reaction chain is conserved across bacteria, archaea, fungi and
    plants, so the module is species-neutral (scope ABSTRACT:
    family selectors with representative members). Exemplars carry
    experimental or genetic evidence: P. putida KT2440 (the full chain by
    transposon/knockout auxotrophs and precursor feeding, PMID:21261884 full
    text, which names PP_0420 trpG in the trpGDC operon), E. coli K-12 (TrpGD
    and TrpCF enzymology), S. cerevisiae (TRP1-TRP5) and S. pombe (trp1-trp4).
    S. meliloti TrpE(G) represents the alphaproteobacterial single-chain
    anthranilate synthase. In KT2440 the module is fully satisfied by trpE,
    PP_0420/trpG, trpD, trpF, trpC, trpA and trpB; upstream shikimate genes,
    phenylalanine/tyrosine branch enzymes and quinate catabolism are outside
    the module.
    ALIGN with YeastPathways (2026-10): the five YeastCyc TRPSYN-PWY-1
    reactions map one-to-one onto the five parts and the YeastCyc catalysts
    (TRP2 + TRP3, TRP4, TRP1, TRP3, TRP5) are all correct; no enzymes are
    missing. Architecture variant sets capture the lineage-specific fusions:
    anthranilate synthase (bacterial TrpE + TrpG/TrpGD complex, fungal TrpE +
    TrpG-domain complex, single-chain TrpE(G)); PRAI (monofunctional TrpF
    versus the TrpF domain of TrpCF-type fusions); IGPS (standalone TrpC or
    TrpCF-type fusions in PTHR22854, versus the TRP3-type TrpG-TrpC protein in
    PTHR43418:SF4); tryptophan synthase (TrpA2-TrpB2 complex versus fungal
    single-chain TrpA-TrpB, PTHR48077:SF3). Fusion choices are correlated
    across steps: budding yeast uses the fungal anthranilate synthase,
    monofunctional TrpF, TrpG-TrpC IGPS and fused tryptophan synthase
    variants; fission yeast uses the fungal anthranilate synthase, TrpCF-type
    PRAI, TrpCF-type IGPS and fused tryptophan synthase variants.
    COMPLEXES - both heteromeric anthranilate synthase variants are modelled as
    GO:0005950 complexes with TrpE and TrpG active units; the TrpG units carry
    GO:0004049 as contributing subunits, matching the contributes_to core
    functions of PP_0420, TRP3, S. pombe trp1 and E. coli TrpGD (enables-
    qualified GOA rows for these glutaminases are recorded as WRONG_QUALIFIER
    source defects in their reviews).
    QUALIFIER CONVENTIONS - TrpE can make anthranilate from chorismate and
    free ammonia on its own (PMID:4886289, PMID:3881257), so the full
    GO:0004049 reaction is performed by the synthase component, and the TrpG
    glutaminase only contributes. Its enables-qualified GO:0004049 rows are
    therefore recorded as WRONG_QUALIFIER. Tryptophan synthase differs:
    neither TrpA nor TrpB alone performs the overall GO:0004834 reaction (the
    isolated subunits catalyse only their half-reactions, slowly), and GO has
    no tryptophan synthase complex term to which both could contribute. The
    enables GO:0004834 rows on TrpA and TrpB are therefore accepted as the only
    available representation, and a "tryptophan synthase complex" term is
    proposed in the P. putida TrpA review.
    LOCATIONS - the SGD YeastPathways GO-CAM places TRP2 (and the other yeast
    activities) in cytosol. The TRP2 review keeps cytoplasm in core_functions
    because its only location row is an HDA cytoplasm annotation and it has no
    cytosol row; the two do not conflict, cytosol being part of cytoplasm.
    FAMILIES - reviewed families: PTHR11236 (TrpE), PTHR43418 (TrpG/PabA and
    CarA), PTHR43285 (TrpD), PTHR42894 (TrpF), PTHR22854 (TrpC), PTHR43406
    (TrpA, new review) and PTHR48077 (TrpB/TRP5). PAINT node placements were
    checked against the PANTHER 19 trees: the PTHR11236 root tryptophan IBD
    reaches bacterial PabB (TOO_DEEP), the PTHR43285 root tryptophan IBD reaches
    the YbiB paralog (NEEDS_PRUNING), and the PTHR43418 phenazine IBD at
    PTN000230115 reaches E. coli TrpGD (WRONG_NODE; removed in the TrpGD review
    with a source defect). Bacterial TrpE, TrpG, TrpA and TrpB annotons are
    grounded on NCBIfam models because the PANTHER families mix them with
    paralogous enzymes (PabB/MenF in PTHR11236; PabA and CarA in PTHR43418) or
    because P. putida TrpE sits in the PTHR11236:SF48 "MenF" subfamily.
    PR #5076 reconciliation - adopted the PTHR43418 grounding for the fungal
    TrpG domain (narrowed to SF4 to match the family review's subfamily scope)
    and the IGPS ancestral node PTN000523336 (verified: root of the PTHR22854
    tree, with E. coli TrpCF as a descendant). Not adopted: PTN000230115 as an
    ancestral node of the TrpD step (it belongs to the PTHR43418 tree and covers
    only TrpGD/PhnB, not TRP4, trp4 or P. putida TrpD); PTHR22854/PTHR43418
    family_terms for the fused-PRAI domain (PRAI activity in those families is
    architecture-determined, so neither family establishes it); and S. pombe
    trp1 as a member of the TRP3-type IGPS variant (trp1 is the trifunctional
    TrpCF-type architecture).
    Compartment - every activity is cytosolic in both GO-CAMs and in bacteria,
    but the plant pathway is plastid-localised, so no module-level compartment
    is asserted.
    GO-CAM disagreements - neither model has causal edges (activities are
    linked only by shared input/output molecules); the PomBase model
    (67369e7600004623) shows S. pombe trp3 alone enabling GO:0004049 and does
    not represent the TrpG glutaminase contribution of trp1 or an anthranilate
    synthase complex, whereas the SGD model attributes GO:0004049 to the
    TRP2-TRP3 complex (CPX-1850). The PomBase model is a whole-network
    aromatic amino acid model, and only its four tryptophan-branch activities
    map to this module. S. pombe assignments (trp1, trp2, trp3, trp4) are
    sequence-based (UniProt, PomBase); the trifunctional TrpG-TrpC-TrpF
    architecture of trp1 is supported by the Neurospora trp-1 precedent
    (PMID:6221060).
