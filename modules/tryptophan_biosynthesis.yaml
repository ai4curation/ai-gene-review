                label: Two-component anthranilate synthase (TrpE + TrpG or TrpGD)
                module_type: PROTEIN_COMPLEX
                description: >-
                  The common bacterial arrangement: a synthase component (TrpE)
                  plus a glutamine-amidotransferase component that is either a
                  separate TrpG protein (as in P. putida) or the N-terminal
                  domain of a bifunctional TrpGD protein (as in E. coli).
