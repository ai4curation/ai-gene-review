id: MODULE:tryptophan_biosynthesis
title: L-tryptophan biosynthesis
description: >-
  De novo biosynthesis of L-tryptophan from chorismate, the branch-point
  precursor of the aromatic amino acids, as found in bacteria, archaea, fungi
  and plants. Five ordered reactions convert chorismate to L-tryptophan,
  drawing in L-glutamine (amide nitrogen), PRPP (5-phospho-alpha-D-ribose
  1-diphosphate) and L-serine, and releasing pyruvate, CO2 and glyceraldehyde
  3-phosphate along the way. The reaction chain is invariant, but the enzymes
  that carry it out are fused in different combinations in different
  lineages. Anthranilate synthase is a glutamine amidotransferase built from a
  synthase component (TrpE) and a glutaminase component (TrpG); TrpG can be a
  separate protein, fused to anthranilate phosphoribosyltransferase (TrpGD of
  enteric bacteria), fused to indole-3-glycerol-phosphate synthase (budding
  yeast TRP3, TrpG-TrpC), or the first domain of a trifunctional
  TrpG-TrpC-TrpF protein (Neurospora trp-1, fission yeast trp1).
  Phosphoribosylanthranilate isomerase (TrpF) is a standalone enzyme in many
  bacteria and in budding yeast, but is fused to indole-3-glycerol-phosphate
  synthase in TrpCF proteins and in the fungal trifunctional protein. The
  terminal tryptophan synthase is an alpha-2-beta-2 complex of TrpA and TrpB in
  bacteria and plants and a single fused TrpA-TrpB chain in fungi; in both
  forms indole made at the TrpA (alpha) active site is channelled through an
  intramolecular tunnel to the PLP-dependent TrpB (beta) site, where it
  condenses with L-serine, so free indole is not released. The pathway is
  feedback-regulated by L-tryptophan at anthranilate synthase and, in many
  bacteria, also transcriptionally by attenuation and the TrpR repressor.
status: DRAFT
evidence:
  - source_id: GapMind:aa
    title: GapMind for amino acid biosynthesis
    statement: >-
      Step set and characterized-protein groundings derive from the GapMind
      amino-acid biosynthesis pathway definition trp.steps (PaperBLAST, Price &
      Arkin, LBL).
    url: https://papers.genomics.lbl.gov/cgi-bin/gapView.cgi?gdb=NCBI&set=aa&path=trp
  - source_id: MetaCyc:TRPSYN-PWY
    title: L-tryptophan biosynthesis
    statement: GapMind bases the tryptophan pathway on the MetaCyc pathway TRPSYN-PWY.
  - source_id: YeastPathways:TRPSYN-PWY-1
    title: L-tryptophan biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD YeastCyc pathway lists the five chorismate-to-tryptophan
      reactions with TRP2 + TRP3 (anthranilate synthase), TRP4, TRP1, TRP3
      (indole-3-glycerol-phosphate synthase) and TRP5 as catalysts. All five
      gene assignments were retained after review; no enzymes are missing.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TRPSYN-PWY-1
  - source_id: GO:0000162
    title: L-tryptophan biosynthetic process
    statement: The module is grounded in the GO biological-process term for tryptophan biosynthesis.
  - source_id: GO:0005950
    title: anthranilate synthase complex
    statement: >-
      The heteromeric TrpE + TrpG anthranilate synthase variants are instances
      of the GO anthranilate synthase complex.
  - source_id: PMID:1943992
    title: >-
      Aromatic amino acid biosynthesis in the yeast Saccharomyces cerevisiae: a
      model system for the regulation of a eukaryotic biosynthetic pathway.
    statement: >-
      Review of the yeast aromatic amino acid pathway, its gene-enzyme
      relationships and feedback regulation; cited by YeastPathways for
      TRPSYN-PWY-1.
  - source_id: PMID:3881257
    title: >-
      Purification and characterization of the indole-3-glycerolphosphate
      synthase/anthranilate synthase complex of Saccharomyces cerevisiae.
    statement: >-
      The yeast anthranilate synthase is a TRP2 + TRP3 heteromer; TRP2 is the
      ammonia-dependent synthase and TRP3 carries both the glutamine
      amidotransferase and the indole-3-glycerol-phosphate synthase activities.
  - source_id: PMID:6323449
    title: >-
      Nucleotide sequence of Saccharomyces cerevisiae genes TRP2 and TRP3
      encoding bifunctional anthranilate synthase: indole-3-glycerol phosphate
      synthase.
    statement: >-
      TRP3 is a TrpG-TrpC fusion joined by a short connector; TRP2 is
      anthranilate synthase component I. Cited by YeastPathways.
  - source_id: PMID:6221060
    title: >-
      Structure of the trifunctional trp-1 gene from Neurospora crassa and its
      aberrant expression in Escherichia coli.
    statement: >-
      Establishes the fungal trifunctional TrpG-TrpC-TrpF domain order, the
      architecture shared by fission yeast trp1.
  - source_id: PMID:3286643
    title: The role of the TRP1 gene in yeast tryptophan biosynthesis.
    statement: >-
      Budding-yeast TRP1 is a separate, highly active
      phosphoribosylanthranilate isomerase, proposed to have arisen by
      separation of the PRAI domain from the IGPS domain.
  - source_id: PMID:2428012
    title: 'The TRP4 gene of Saccharomyces cerevisiae: isolation and structural analysis.'
    statement: TRP4 encodes the yeast anthranilate phosphoribosyltransferase.
  - source_id: PMID:6342605
    title: Purification and properties of tryptophan synthase from baker's yeast (Saccharomyces cerevisiae).
    statement: >-
      The purified single-chain yeast tryptophan synthase catalyses the
      indole-3-glycerol-phosphate lyase, indole-serine condensation and overall
      reactions.
  - source_id: PMID:3053720
    title: >-
      Three-dimensional structure of the tryptophan synthase alpha 2 beta 2
      multienzyme complex from Salmonella typhimurium.
    statement: >-
      The bacterial alpha2beta2 structure shows a 25 angstrom tunnel connecting
      the TrpA and TrpB active sites, the basis for indole channelling.
  - source_id: PMID:8432699
    title: Analysis of feedback-resistant anthranilate synthases from Saccharomyces cerevisiae.
    statement: >-
      Tryptophan feedback inhibition of anthranilate synthase acts on TRP2 and
      depends on the conserved LLES motif (Ser76).
  - source_id: PMID:10790693
    title: 'A counterselection for the tryptophan pathway in yeast: 5-fluoroanthranilic acid resistance.'
    statement: >-
      Cited by YeastPathways for TRPSYN-PWY-1; uses the anthranilate-consuming
      steps of the pathway for 5-fluoroanthranilate counterselection, a
      genetic tool rather than evidence for an additional enzyme.
  - source_id: file:modules/tryptophan_biosynthesis-deep-research-falcon.md
    title: Falcon module review for microbial L-tryptophan biosynthesis
    statement: >-
      Generic module-level retrieval supports the chorismate-to-tryptophan
      boundary, common fusion/complex architectures, and terminal tryptophan
      synthase channeling.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__tryptophan_biosynthesis__ppu00400-deep-research-falcon.md
    title: Falcon PSEPK ppu00400 tryptophan biosynthesis review
    statement: >-
      Species/pathway review finds the KT2440 chorismate-to-tryptophan pathway
      fully covered by seven core genes, separates broad ppu00400 shikimate and
      phenylalanine/tyrosine spillover from the tryptophan core, and flags
      PP_0420 as a TrpG-like anthranilate-synthase amidotransferase despite the
      local pabA gene name.
  - source_id: file:PSEPK/pabA/pabA-ai-review.yaml
    title: PSEPK PP_0420/pabA gene review
    statement: >-
      Existing review supports PP_0420 as the TrpG-like glutamine
      amidotransferase component of anthranilate synthase for tryptophan module
      satisfiability, while leaving any folate/pABA role unresolved.
module:
  id: tryptophan_biosynthesis
  label: L-tryptophan biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-tryptophan biosynthetic process
      term:
        id: GO:0000162
        label: L-tryptophan biosynthetic process
      description: Formation of L-tryptophan from chorismate, glutamine, PRPP and serine.
  gocam_associations:
    - model: gomodel:YeastPathways_TRPSYN-PWY-1
      title: 'L-tryptophan biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae. All five activities
        occur in cytosol and are part of GO:0000162; anthranilate synthase is
        enabled by the TRP2-TRP3 complex (CPX-1850). Activities are linked only
        through shared input/output molecules, with no causal edges.
    - model: gomodel:67369e7600004623
      title: aromatic amino acid biosynthetic process (GO:0009073)
      description: >-
        PomBase S. pombe model of the whole aromatic amino acid network. Its
        tryptophan branch has trp3 (GO:0004049), trp4 (GO:0004048), trp1
        (GO:0004640 and GO:0004425) and trp2 (GO:0004834), all cytosolic and
        chained through shared molecules. The shikimate (aro1-aro4, aro7),
        phenylalanine/tyrosine (pha2, tyr1, SPAC56E4.03), hypoxanthine
        phosphoribosyltransferase, mitochondrial aminoacyl-tRNA ligase and
        transport activities in the same model lie outside this module.
  parts:
    - order: 1
      role: chorismate to anthranilate (anthranilate synthase)
      node:
        id: anthranilate_synthase_node
        label: Chorismate to anthranilate (anthranilate synthase, alternative architectures)
        module_type: REACTION
        description: >-
          Anthranilate synthase aminates chorismate using the amide nitrogen of
          L-glutamine, eliminating pyruvate. It is a glutamine amidotransferase
          whose synthase (TrpE) and glutaminase (TrpG) units are combined
          differently in different taxa.
        concepts:
          - preferred_term: anthranilate synthase reaction
            description: chorismate + L-glutamine -> anthranilate + pyruvate + L-glutamate.
        variant_sets:
          - id: anthranilate_synthase_architecture
            label: Anthranilate synthase subunit architecture
            axis: enzyme architecture
            selection: EXACTLY_ONE
            variants:
              - id: two_component_anthranilate_synthase
                label: Two-component anthranilate synthase (TrpE + TrpG or TrpGD)
                module_type: PROTEIN_COMPLEX
                description: >-
                  The common bacterial arrangement: a synthase component (TrpE)
                  plus a glutamine-amidotransferase component that is either a
                  separate TrpG protein (as in P. putida) or the N-terminal
                  domain of a bifunctional TrpGD protein (as in E. coli).
                concepts:
                  - preferred_term: anthranilate synthase complex
                    term:
                      id: GO:0005950
                      label: anthranilate synthase complex
                annotons:
                  - id: trpE_activity
                    label: "trpE: anthranilate synthase component I (synthase subunit)"
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: anthranilate synthase activity
                        term:
                          id: GO:0004049
                          label: anthranilate synthase activity
                      family:
                        preferred_term: anthranilate synthase component I (TrpE)
                        term:
                          id: NCBIfam:TIGR00565
                          label: anthranilate synthase component I
                        representative_members:
                          - preferred_term: trpE (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88QS1
                              label: Anthranilate synthase component 1
                    function:
                      preferred_term: anthranilate synthase activity
                      term:
                        id: GO:0004049
                        label: anthranilate synthase activity
                      substrates:
                        - preferred_term: chorismate
                        - preferred_term: ammonia (channeled from the glutaminase subunit)
                      products:
                        - preferred_term: anthranilate
                        - preferred_term: pyruvate
                      evidence:
                        - source_id: EC:4.1.3.27
                          statement: anthranilate synthase
                          notes: "ModelSEED:rxn00726; KEGG:R00985; HMM NCBIfam:TIGR00564/TIGR00565/TIGR01820"
                    role_description: Synthase (component I) subunit; aminates chorismate and eliminates pyruvate.
                  - id: trpD1_activity
                    label: "trpD_1/trpG: glutamine amidotransferase component of anthranilate synthase"
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: anthranilate synthase activity
                        term:
                          id: GO:0004049
                          label: anthranilate synthase activity
                      family:
                        preferred_term: anthranilate synthase glutamine amidotransferase component (TrpG/TrpD)
                        term:
                          id: NCBIfam:TIGR00566
                          label: anthranilate synthase component II / glutamine amidotransferase
                        representative_members:
                          - preferred_term: trpG / PP_0420 (Pseudomonas putida KT2440; UniProt gene name pabA)
                            term:
                              id: UniProtKB:Q88QR8
                              label: Aminodeoxychorismate synthase / para-aminobenzoate synthase multi-enzyme complex
                    function:
                      preferred_term: anthranilate synthase activity
                      term:
                        id: GO:0004049
                        label: anthranilate synthase activity
                      cofactors:
                        - preferred_term: L-glutamine (ammonia donor)
                      evidence:
                        - source_id: EC:4.1.3.27
                          statement: glutamine amidotransferase (component II) of anthranilate synthase
                          notes: >-
                            HMM NCBIfam:TIGR00566. The same amidotransferase family also serves
                            4-amino-4-deoxychorismate / p-aminobenzoate synthase (EC 2.6.1.85).
                    role_description: >-
                      Glutaminase (component II) subunit; hydrolyses L-glutamine and channels
                      ammonia to the TrpE active site, contributing to rather than
                      independently performing anthranilate synthase activity. In E. coli
                      this is the N-terminal domain of bifunctional TrpGD, fused to
                      anthranilate phosphoribosyltransferase.
              - id: fungal_trpg_fusion_anthranilate_synthase
                label: Fungal anthranilate synthase (TrpE + TrpG domain of a TrpG-TrpC(-TrpF) fusion)
                module_type: PROTEIN_COMPLEX
                description: >-
                  In fungi the synthase component is a separate TrpE protein
                  (S. cerevisiae TRP2, S. pombe trp3), while the glutaminase is
                  the N-terminal TrpG domain of a larger protein that also
                  carries indole-3-glycerol-phosphate synthase: the bifunctional
                  TrpG-TrpC protein of budding yeast (TRP3) or the trifunctional
                  TrpG-TrpC-TrpF protein of Neurospora (trp-1) and fission yeast
                  (trp1). The yeast complex is a 2 TRP2 + 2 TRP3 heterotetramer.
                concepts:
                  - preferred_term: anthranilate synthase complex
                    term:
                      id: GO:0005950
                      label: anthranilate synthase complex
                notes: >-
                  A lineage using this variant also uses the fused TrpG-TrpC
                  IGPS variant (bifunctional, S. cerevisiae) or the fused
                  TrpCF IGPS and PRAI variants (trifunctional, S. pombe) at
                  steps 3 and 4, because the same polypeptide fills those steps.
                annotons:
                  - id: fungal_trpE_activity
                    label: "Fungal TrpE: anthranilate synthase component I"
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: anthranilate synthase activity
                        term:
                          id: GO:0004049
                          label: anthranilate synthase activity
                      family:
                        preferred_term: anthranilate synthase component I subfamily
                        term:
                          id: PANTHER:PTHR11236:SF9
                          label: ANTHRANILATE SYNTHASE COMPONENT 1
                        representative_members:
                          - preferred_term: TRP2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P00899
                              label: Anthranilate synthase component 1
                            description: >-
                              S. cerevisiae TRP2/YER090W; the tryptophan
                              feedback-inhibited subunit (Ser76 in the LLES
                              motif, PMID:8432699).
                          - preferred_term: trp3 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:O94582
                              label: Probable anthranilate synthase component 1
                            description: S. pombe trp3/SPCC1442.09 (sequence-based assignment).
                    function:
                      preferred_term: anthranilate synthase activity
                      term:
                        id: GO:0004049
                        label: anthranilate synthase activity
                      substrates:
                        - preferred_term: chorismate
                        - preferred_term: ammonia (from the TrpG domain, or free ammonia in vitro)
                      products:
                        - preferred_term: anthranilate
                        - preferred_term: pyruvate
                      evidence:
                        - source_id: EC:4.1.3.27
                          statement: anthranilate synthase
                        - source_id: PMID:3881257
                          statement: >-
                            The larger polypeptide was identified as
                            anthranilate synthase and is active in vitro with
                            ammonia as cosubstrate without need of complex
                            formation.
                        - source_id: PMID:8432699
                          statement: >-
                            serine 76 is a crucial amino acid for proper
                            regulation of the yeast enzyme
                    gocam_associations:
                      - model: gomodel:YeastPathways_TRPSYN-PWY-1
                        activity: gomodel:ANTHRANSYN-RXN
                        title: 'L-tryptophan biosynthesis - imported from: Saccharomyces Genome Database'
                        description: >-
                          Enabled by the TRP2-TRP3 complex (SGD:S000218001,
                          CPX-1850); GO:0004049 in cytosol.
                      - model: gomodel:67369e7600004623
                        activity: gomodel:67369e7600004623/67369e7600004737
                        title: aromatic amino acid biosynthetic process (GO:0009073)
                        description: >-
                          S. pombe trp3 alone enables GO:0004049; the trp1
                          TrpG glutaminase contribution is not represented.
                    role_description: >-
                      Synthase subunit binding chorismate; site of tryptophan
                      feedback inhibition.
                  - id: fungal_trpG_domain_activity
                    label: "Fungal TrpG domain: glutamine amidotransferase of anthranilate synthase"
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: anthranilate synthase activity
                        term:
                          id: GO:0004049
                          label: anthranilate synthase activity
                      family:
                        preferred_term: >-
                          N-terminal TrpG glutamine-amidotransferase domain of
                          fungal TrpG-TrpC and TrpG-TrpC-TrpF fusion proteins
                        description: >-
                          PANTHER places the two fungal architectures in
                          different families (S. cerevisiae TRP3 in
                          PTHR43418:SF4; S. pombe trp1 in PTHR22854:SF2, by
                          its IGPS domain), so no single PANTHER family is
                          asserted for the TrpG domain.
                        representative_members:
                          - preferred_term: TRP3 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P00937
                              label: Multifunctional tryptophan biosynthesis protein
                            description: S. cerevisiae TRP3/YKL211C, bifunctional TrpG-TrpC.
                          - preferred_term: trp1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q92370
                              label: Multifunctional tryptophan biosynthesis protein
                            description: S. pombe trp1/SPBC1539.09c, trifunctional TrpG-TrpC-TrpF.
                    function:
                      preferred_term: anthranilate synthase activity
                      term:
                        id: GO:0004049
                        label: anthranilate synthase activity
                      cofactors:
                        - preferred_term: L-glutamine (ammonia donor)
                      evidence:
                        - source_id: EC:4.1.3.27
                          statement: glutamine amidotransferase (component II) of anthranilate synthase
                        - source_id: PMID:3881257
                          statement: >-
                            The smaller polypeptide carries both glutamine
                            amidotransferase activity and
                            indole-3-glycerolphosphate synthase activity.
                        - source_id: PMID:6221060
                          statement: >-
                            the order of functional domains within trp-1 is
                            NH2-glutamine
                            amidotransferase-indoleglycerolphosphate
                            synthase-phosphoribosylanthranilate isomerase-COOH
                    role_description: >-
                      Glutaminase domain that supplies ammonia to TrpE within the
                      heteromeric complex; it contributes to anthranilate
                      synthase activity rather than performing it alone (the
                      S. cerevisiae TRP3 review records it as contributes_to
                      GO:0004049, in GO:0005950).
              - id: single_protein_anthranilate_synthase
                label: Single-protein anthranilate synthase (TrpED, alphaproteobacterial clade)
                module_type: REACTION
                annotons:
                  - id: trpED_activity
