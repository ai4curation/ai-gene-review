id: MODULE:phenylacetate_catabolism
title: Aerobic phenylacetate catabolism
description: >-
  A bacterial aerobic phenylacetyl-CoA ("box") pathway that activates
  phenylacetate, epoxidizes the aromatic ring with the multicomponent PaaABCE system,
  isomerizes and hydrolytically opens the ring, oxidizes the resulting
  semialdehyde, and processes the open-chain CoA ester through two thiolytic
  cleavages separated by a beta-oxidation-like hydration and oxidation
  sequence, yielding acetyl-CoA and succinyl-CoA. Regulatory and detoxification
  proteins are outside the required reaction chain.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:20660314
    title: Bacterial phenylalanine and phenylacetate catabolic pathway revealed.
    statement: >-
      Reconstitution with purified enzymes from Escherichia coli K-12 and
      Pseudomonas sp. strain Y2 established the ordered CoA-thioester route
      (epoxidation, epoxide-oxepin isomerization, hydrolytic ring cleavage and
      beta-oxidation-like steps to acetyl-CoA and succinyl-CoA) and its
      distribution across about 16% of sequenced bacteria.
    supporting_text: >-
      Here we elucidate the catabolic pathway functioning in 16% of all
      bacteria whose genome has been sequenced, including Escherichia coli and
      Pseudomonas putida
  - source_id: PMID:21247899
    title: >-
      Structural and functional studies of the Escherichia coli
      phenylacetyl-CoA monooxygenase complex.
    statement: >-
      In vitro reconstitution of the E. coli oxygenase shows that PaaA, PaaB,
      PaaC and PaaE are required for catalysis and PaaD is dispensable, with
      PaaA the catalytic alpha subunit and PaaC the structural beta subunit.
    supporting_text: >-
      In vitro reconstitution of the oxygenase subunits showed that each of the
      PaaA, B, C, and E subunits are necessary for catalysis, whereas PaaD is
      not essential.
  - source_id: GO:0010124
    title: phenylacetate catabolic process
    statement: >-
      GO:0010124 provides the biological-process boundary for conversion of
      phenylacetate through the aerobic phenylacetyl-CoA pathway.
  - source_id: file:modules/phenylacetate_catabolism-deep-research-openscientist.md
    title: OpenScientist research for the reusable aerobic phenylacetate catabolism module
    statement: >-
      The module-level review supports the ordered phenylacetyl-CoA pathway,
      the multicomponent epoxidase, bifunctional PaaZ, and the distinction
      between required reactions and accessory detoxification proteins.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__phenylacetate_catabolism__ppu00360-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00360 pathway satisfiability review
    statement: >-
      The species-aware review finds the KT2440 pathway satisfiable, identifies
      paaJ as a gene omitted by the broad KEGG bucket, and separates the
      contiguous paa locus from paralogous beta-oxidation enzymes.
  - source_id: PMID:22961985
    title: >-
      Protein-protein interactions in the β-oxidation part of the
      phenylacetate utilization pathway: crystal structure of the PaaF-PaaG
      hydratase-isomerase complex.
    statement: >-
      Structural work on E. coli identifies a stable PaaFG
      hydratase-isomerase complex, providing comparative evidence for
      interaction between the two crotonase-family enzymes.
    supporting_text: >-
      Here we report characterization of interactions between the remaining
      enzymes of this pathway and show another stable complex, PaaFG, an
      enoyl-CoA hydratase and enoyl-Coa isomerase, both belonging to the
      crotonase superfamily.
  - source_id: file:PSEPK/paaK/paaK-uniprot.txt
    title: UniProtKB entry Q88HS4 for PSEPK PaaK
    statement: >-
      UniProt identifies Q88HS4 as phenylacetate-CoA ligase, the activation
      step that supplies phenylacetyl-CoA.
  - source_id: file:PSEPK/paaA/paaA-uniprot.txt
    title: UniProtKB entry Q88HS5 for PSEPK PaaA
    statement: >-
      UniProt places Q88HS5 in the ring 1,2-phenylacetyl-CoA epoxidase system.
  - source_id: file:PSEPK/paaZ/paaZ-uniprot.txt
    title: UniProtKB entry Q88HT3 for PSEPK PaaZ
    statement: >-
      UniProt identifies Q88HT3 as the bifunctional oxepin-CoA hydrolase and
      semialdehyde dehydrogenase that opens and oxidizes the ring-cleavage
      intermediate.
  - source_id: file:PSEPK/paaJ/paaJ-uniprot.txt
    title: UniProtKB entry Q88HS3 for PSEPK PaaJ
    statement: >-
      UniProt identifies Q88HS3 as a dual
      3-oxoadipyl-CoA/3-oxo-5,6-dehydrosuberyl-CoA thiolase.
