  notes: >-
    Representative members are given for two experimentally anchored
    bacterial lineages: Escherichia coli K-12, whose paa enzymes were purified
    and assayed (the PaaABCE oxygenase, PaaZ, PaaH and the PaaFG complex were
    characterized directly in E. coli, while the reconstitution study also used
    Pseudomonas sp. strain Y2 PaaABCE, PaaG, PaaJ and PaaF), and Pseudomonas
    putida KT2440, whose contiguous paa locus encodes orthologs of every step.
    Neither list is a species restriction. The route is bacterial (about 16% of
    sequenced bacteria, plus some Halobacteria by horizontal transfer) and has
    no eukaryotic counterpart, so no yeast or human members are given; the
    crotonase, 3-hydroxyacyl-CoA dehydrogenase and thiolase families that
    supply PaaF, PaaG, PaaH and PaaJ also contain eukaryotic fatty-acid
    beta-oxidation enzymes, but those homologs do not perform these steps.
    Family groundings follow PANTHER 19.0. Where PANTHER names a subfamily for
    the Paa protein itself (PaaK SF1, PaaA SF2, PaaC SF0, PaaE SF8) the subfamily is
    used, and PaaG, PaaZ and PaaH are grounded to the subfamilies that the
    family reviews scope their activities to (PTHR43459:SF1, PTHR43111:SF1,
    PTHR48075:SF5; official PANTHER names, which for PaaG and PaaH do not
    describe the Paa role). PANTHER's own 19.0 E. coli file places E. coli
    PaaG in PTHR11941:SF133 (1,2-EPOXYPHENYLACETYL-COA ISOMERASE), while
    UniProt and InterPro place both PaaG exemplars in PTHR43459:SF1, which is
    used here. PaaB has no PANTHER family and is grounded to NCBIfam TIGR02157.
    PaaF sits in PTHR11941:SF54 together with mitochondrial ECHS1 and E. coli
    CaiD and ScpB, so that subfamily is broader than the PaaF role. PANTHER's
    E. coli classification places E. coli PaaJ in PTHR43853:SF2 with P. putida
    PaaJ, whereas its UniProt cross-reference and InterPro give
    PTHR18919:SF12; the PANTHER release file is used here, and the conflict is
    recorded in both family reviews. GO has no substrate-specific activity terms for
    the PaaG epoxide-oxepin isomerase (EC 5.3.3.18), the PaaZ oxepin-CoA
    hydrolase (EC 3.3.2.12) or the PaaZ semialdehyde dehydrogenase (EC
    1.2.1.91), so those leaves use the closest EC-class parents
    (GO:0016863, GO:0016803 and GO:0033721). PaaD is a
    pathway-associated accessory protein but is not required by the minimal
    PaaABCE catalytic assembly in vitro; its proposed metallocenter maturation
    or assembly role remains unresolved and is not counted for module
    satisfiability. A stable PaaFG complex is known from E. coli, but obligate
    complex formation is not established across taxa, so PaaF and PaaG remain
    separate reaction annotons rather than a required complex selector. PaaI
    and PaaY thioesterases are pathway-associated proofreading or
    detoxification proteins, and PaaX is a regulator; none is a required
    reaction in this core linear module. Broad organism-level pathway maps are
    useful for candidate discovery, but the module boundary is the
    paa-specific phenylacetyl-CoA route.
