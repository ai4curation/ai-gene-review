id: MODULE:mucosal_duox1_lactoperoxidase_antimicrobial_system
title: Mucosal DUOX1-DUOXA1 hydrogen peroxide generator and epithelial signaling module
description: >-
  Conserved vertebrate apical epithelial NADPH oxidase module in which the
  maturation factor DUOXA1 (maturation factor of dual oxidase 1) chaperones and
  assembles in a 1:1 heterodimeric complex with dual oxidase 1 (DUOX1) in the
  endoplasmic reticulum to target the holoenzyme to the apical plasma membrane
  of ciliated airway, urothelial, and squamous mucosal epithelia, where DUOX1
  catalyzes Ca2+-activated, NADPH-dependent transmembrane electron transfer and
  extracellular hydrogen peroxide (H2O2) generation. Despite carrying an
  N-terminal extracellular peroxidase-homology domain (PHD), vertebrate DUOX1
  lacks heme-binding histidines and does not possess intrinsic peroxidase
  activity. Instead, the extracellular H2O2 generated by the apical DUOX1-DUOXA1
  complex feeds into two major downstream physiological pathways: (1) mucosal
  antimicrobial host defense, in which secreted lactoperoxidase (LPO) uses
  DUOX1-derived H2O2 to oxidize thiocyanate (SCN-) into hypothiocyanite (OSCN-)
  in the airway surface liquid, and (2) paracrine and autocrine epithelial redox
  signaling triggered by damage cues (extracellular ATP, Ca2+ influx, IL-33)
  that drive wound repair and mucin secretion.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:32929281
    title: >-
      Structures of mouse DUOX1-DUOXA1 provide mechanistic insights into enzyme
      activation and regulation.
    statement: >-
      Cryo-EM structures of the mouse DUOX1-DUOXA1 complex reveal the 1:1
      heterodimer and dimer-of-dimer assembly, Ca2+-regulated cytosolic EF-hand
      and dehydrogenase domains, two-heme transmembrane electron transfer path,
      and absence of heme in the extracellular PHD domain.
    supporting_text: >-
      Here I report cryo-EM structures of mouse DUOX1–DUOXA1 complexes in
      NADPH-free, NADPH-bound and dimer-of-dimer states, providing structural
      mechanisms underlying DUOX1–DUOXA1 activation and regulation and molecular
      insights into ROS production.
  - source_id: PMID:33420071
    title: >-
      Structures of human dual oxidase 1 complex in low-calcium and
      high-calcium states.
    statement: >-
      Co-expression of human DUOX1 and DUOXA1 forms an active plasma membrane
      complex that catalyzes Ca2+-activated, NADPH-dependent H2O2 production
      while lacking heme-coordinating histidines in the PHD.
    supporting_text: >-
      we found the co-expression of DUOX1 and DUOXA1 resulted in cell membranes
      that showed robust calcium-activated, NADPH-dependent hydrogen peroxide
      production detected by the Amplex Red assay
  - source_id: PMID:19460756
    title: >-
      Caenorhabditis elegans and human dual oxidase 1 (DUOX1) "peroxidase"
      domains: insights into heme binding and catalytic activity.
    statement: >-
      Biochemical characterization shows that the human DUOX1 ectodomain does
      not bind heme and has no intrinsic peroxidase activity.
    supporting_text: >-
      the isolated hDUOX1(1-593) does not bind heme and has no intrinsic
      peroxidase activity
  - source_id: PMID:34168077
    title: Dual oxidase 1 promotes antiviral innate immunity.
    statement: >-
      Demonstrates in Duox1-/- mice that Duox1 is required for airway mucosal
      antiviral innate immunity and viral clearance in vivo.
    supporting_text: >-
      Here, we show that Duox1 promotes antiviral innate immunity in vivo. Upon
      influenza airway challenge, Duox1-/- mice have enhanced mortality,
      morbidity, and impaired lung viral clearance.
  - source_id: PMID:39126279
    title: >-
      The NADPH oxidases DUOX1 and DUOX2 are sorted to the apical plasma
      membrane in epithelial cells via their respective maturation factors
      DUOXA1 and DUOXA2.
    statement: >-
      Demonstrates that DUOX1 is sorted to the apical plasma membrane in
      polarized epithelial cells specifically via its transmembrane maturation
      factor DUOXA1.
    supporting_text: >-
      Here we show that DUOX1 and DUOX2 are correctly sorted to the apical
      membrane via the membrane-spanning DUOX maturation proteins DUOXA1 and
      DUOXA2, respectively, when co-expressed in MDCK epithelial cells.
  - source_id: file:genes/human/DUOX1/DUOX1-ai-review.yaml
    title: Human DUOX1 gene review
    statement: >-
      Grounds human DUOX1 (UniProtKB:Q9NRD9) as a Ca2+-regulated apical
      epithelial H2O2-producing NADPH oxidase lacking intrinsic peroxidase
      activity.
  - source_id: file:genes/mouse/Duox1/Duox1-ai-review.yaml
    title: Mouse Duox1 gene review
    statement: >-
      Grounds mouse Duox1 (UniProtKB:A2AQ92) as the orthologous Ca2+-activated
      apical epithelial H2O2-generating NADPH oxidase in airway, urothelium, and
      keratinocytes.
notes: >-
  Boundary: This module models the two-step apical H2O2-generating core—(1)
  DUOXA1-mediated ER exit and apical plasma membrane targeting of DUOX1 and (2)
  Ca2+-activated, NADPH-dependent extracellular H2O2 production by DUOX1.
  Downstream consumers of DUOX1-derived H2O2 (secreted mucosal lactoperoxidase
  [LPO] in the airway surface liquid and redox-sensitive epithelial signaling
  effectors such as Src/ADAM17/EGFR) lie downstream of the modeled H2O2
  generation step. Unlike C. elegans BLI-3, vertebrate DUOX1 lacks
  heme-coordinating histidines in its N-terminal peroxidase-homology domain
  (PHD) and has no intrinsic peroxidase activity (GO:0004601), although
  domain-based electronic mappings (InterPro:IPR010255) continue to project
  GO:0004601 and GO:0006979 onto vertebrate DUOX1/DUOX2. Member genes with
  reviews in this repository: human/DUOX1 (UniProtKB:Q9NRD9), mouse/Duox1
  (UniProtKB:A2AQ92).
