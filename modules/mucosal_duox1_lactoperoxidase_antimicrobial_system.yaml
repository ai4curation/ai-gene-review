                title: >-
                  Structures of mouse DUOX1-DUOXA1 provide mechanistic insights
                  into enzyme activation and regulation.
                statement: >-
                  Mouse DUOX1-DUOXA1 transfers electrons from cytosolic NADPH
                  through FAD and two intramembrane hemes to reduce O2 to H2O2,
                  while lacking heme density and heme-coordinating histidines in
                  its extracellular PHD.
                supporting_text: >-
                  the facts that no heme density is observed in the cryo-EM map
                  and histidines needed for heme coordination are missing in the
                  putative binding pocket strongly suggest that the PHD domain
                  of DUOX1 lacks heme-dependent peroxidase activity.
              - source_id: PMID:33420071
                title: >-
                  Structures of human dual oxidase 1 complex in low-calcium and
                  high-calcium states.
                statement: >-
                  Human DUOX1 lacks the heme-coordinating histidine in the
                  peroxidase-homology domain and shows no heme density in the
                  cryo-EM structure.
                supporting_text: >-
                  key residues for heme binding, such as the heme ligand
                  histidine, are missing in the PHD of hDUOX1. Indeed, we did
                  not observe any heme density in the structure of hDUOX1 PHD,
                  suggesting PHD is probably not enzymatic functional in term of
                  peroxidase activity.
