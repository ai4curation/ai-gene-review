      node:
        id: lola_carriage_step
        label: LolA periplasmic carriage
        module_type: TRANSPORT_STEP
        description: LolA shields the lipid anchor while carrying the released lipoprotein across the periplasm.
        annotons:
          - id: lola_carrier
            label: LolA periplasmic lipoprotein carrier
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LolA family
                term:
                  id: PANTHER:PTHR35869:SF1
                  label: OUTER-MEMBRANE LIPOPROTEIN CARRIER PROTEIN
                representative_members:
                  - preferred_term: PSEPK LolA exemplar
