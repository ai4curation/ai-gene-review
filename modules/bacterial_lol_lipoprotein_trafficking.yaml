      node:
        id: lolb_delivery_step
        label: LolB outer-membrane delivery
        module_type: TRANSPORT_STEP
        description: LolB receives the LolA-bound lipoprotein and promotes its incorporation into the outer membrane.
        annotons:
          - id: lolb_receptor
            label: LolB outer-membrane lipoprotein receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LolB family
                representative_members:
                  - preferred_term: PSEPK LolB exemplar
                    term:
                      id: UniProtKB:Q88PX4
                      label: Outer-membrane lipoprotein LolB
            function:
              preferred_term: outer-membrane lipoprotein delivery activity
            processes:
              - preferred_term: lipoprotein transport
                term:
                  id: GO:0042953
                  label: lipoprotein transport
              - preferred_term: lipoprotein localization to outer membrane
                term:
                  id: GO:0044874
                  label: lipoprotein localization to outer membrane
            locations:
              - preferred_term: cell outer membrane
                term:
                  id: GO:0009279
                  label: cell outer membrane
            role_description: Terminal pathway step that incorporates the delivered lipoprotein into the outer membrane.
  connections:
    - source: lolcde_release_step
      target: lola_carriage_step
      connection_type: PROVIDES_INPUT_FOR
      description: LolCDE loads released lipoprotein onto LolA.
    - source: lola_carriage_step
      target: lolb_delivery_step
      connection_type: PROVIDES_INPUT_FOR
      description: LolA presents its lipoprotein cargo to LolB.
  knowledge_gaps:
    - gap_statement: GO lacks specific molecular-function terms for LolA carriage, LolB delivery, and LolCDE lipoprotein extraction.
      boundary: Preserve the precise roles in preferred terms and descriptions without inventing GO identifiers.
      gap_kind: [ONTOLOGY]
    - gap_statement: >-
        PANTHER:PTHR30489:SF0 is assigned locally to both PSEPK LolC and LolE and
        therefore does not discriminate the two membrane-subunit roles.
      boundary: >-
        Q88KY3 is retained as the LolE exemplar because the conserved lolC-lolD-lolE
        operon order resolves its role; no discriminating LolE family identifier is asserted.
      gap_kind:
        - CURATION
    - gap_statement: >-
        Diderm lineages vary between heterodimeric LolC/LolE and homodimeric
        LolF-like extractors, and some lack a canonical LolB receptor.
      boundary: >-
        Treat this document as the canonical LolCDE-LolA-LolB route and model
        lineage-specific replacements as explicit variants when grounded.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        LolA and LolB are normally required in the canonical relay but can be
        genetically bypassed under specific envelope-stress conditions in a
        characterized model.
      boundary: >-
        Do not generalize conditional bypass or essentiality to KT2440 without
        target-organism evidence.
      gap_kind:
        - BIOLOGY
