                  id: GO:0042953
                  label: lipoprotein transport
              - preferred_term: lipoprotein localization to outer membrane
                term:
                  id: GO:0044874
                  label: lipoprotein localization to outer membrane
            locations:
              - preferred_term: outer membrane-bounded periplasmic space
                term:
