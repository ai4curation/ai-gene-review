id: MODULE:bacterial_lol_lipoprotein_trafficking
title: Bacterial Lol-dependent outer-membrane lipoprotein trafficking
description: >-
  A diderm-bacterial module for delivery of mature lipoproteins from the inner
  membrane to the outer membrane. The inner-membrane ABC-superfamily complex
  LolCDE uses ATP hydrolysis by LolD to extract an outer-membrane-destined
  lipoprotein from the outer leaflet of the inner membrane, without moving it
  across the bilayer, and hands it to the periplasmic carrier LolA. LolA shields
  the lipid anchor while crossing the periplasm and passes the lipoprotein
  mouth-to-mouth to the outer-membrane lipoprotein LolB, which incorporates it
  into the outer membrane. Lipoproteins with an inner-membrane retention signal
  are not released. Lipoprotein maturation and the functions of individual
  lipoproteins lie outside the module. Escherichia coli K-12, in which the
  pathway was defined, and Pseudomonas putida KT2440 supply exact exemplars for
  all five components.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0044874
    title: lipoprotein localization to outer membrane
    statement: GO:0044874 captures the shared biological-process outcome of the three-stage Lol pathway.
  - source_id: GO:0140306
    title: lipoprotein releasing activity
    statement: >-
      GO defines this activity for the LolCDE complex of diderm bacteria:
      recognizing mature outer-membrane lipoproteins in the inner membrane and
      releasing them for transport across the periplasm.
  - source_id: GO:0140598
    title: lipoprotein carrier activity
    statement: GO:0140598 describes binding and carrying a lipoprotein between two cellular locations, the LolA activity.
  - source_id: PMID:10783239
    title: A new ABC transporter mediating the detachment of lipid-modified proteins from membranes.
    statement: >-
      Reconstitution identifies E. coli LolCDE as the ATP-dependent release
      complex and shows that it does not transport its substrate across the
      membrane.
    supporting_text: >-
      The LolCDE complex differs mechanistically from all other ABC
      transporters as it is not involved in the transmembrane transport of
      substrates.
  - source_id: PMID:11844772
    title: Disruption of lolCDE, encoding an ATP-binding cassette transporter, is lethal for Escherichia coli and prevents release of lipoproteins from the inner membrane.
    statement: LolC, LolD and LolE are each essential, and LolCDE is the sole lipoprotein-release apparatus in E. coli.
    supporting_text: both LolC and LolE were essential for the release of lipoproteins
  - source_id: PMID:7628437
    title: A novel periplasmic carrier protein involved in the sorting and transport of Escherichia coli lipoproteins destined for the outer membrane.
    statement: Identification of LolA as the periplasmic lipoprotein carrier.
    supporting_text: p20 is a periplasmic carrier protein involved in the translocation of lipoproteins from the inner to the outer membrane
  - source_id: PMID:9384574
    title: A novel outer membrane lipoprotein, LolB (HemM), involved in the LolA (p20)-dependent localization of lipoproteins to the outer membrane of Escherichia coli.
    statement: LolB is an essential outer-membrane lipoprotein that accepts lipoprotein from LolA and is required for its incorporation.
    supporting_text: When the Lpp-LolA complex was incubated with a water-soluble LolB derivative, Lpp was transferred from LolA to LolB.
  - source_id: PMID:19307584
    title: Model of mouth-to-mouth transfer of bacterial lipoproteins through inner membrane LolC, periplasmic LolA, and outer membrane LolB.
    statement: Photo-cross-linking supports direct LolC-LolA and LolA-LolB hand-over through the carriers' cavity entrances.
    supporting_text: These results indicate that the transfer of lipoproteins through Lol proteins occurs in a mouth-to-mouth manner.
  - source_id: file:ECOLI/lolA/lolA-ai-review.yaml
    title: Escherichia coli K-12 lolA AI gene review
    statement: P61316 is the periplasmic lipoprotein carrier (GO:0140598).
  - source_id: file:ECOLI/lolB/lolB-ai-review.yaml
    title: Escherichia coli K-12 lolB AI gene review
    statement: P61320 accepts lipoproteins from LolA and incorporates them into the outer membrane.
  - source_id: file:ECOLI/lolC/lolC-ai-review.yaml
    title: Escherichia coli K-12 lolC AI gene review
    statement: P0ADC3 is the LolA-recruiting membrane subunit of LolCDE.
  - source_id: file:ECOLI/lolD/lolD-ai-review.yaml
    title: Escherichia coli K-12 lolD AI gene review
    statement: P75957 is the ATPase subunit of LolCDE.
  - source_id: file:ECOLI/lolE/lolE-ai-review.yaml
    title: Escherichia coli K-12 lolE AI gene review
    statement: P75958 is the cargo-binding membrane subunit of LolCDE.
  - source_id: file:PSEPK/lolA/lolA-uniprot.txt
    title: PSEPK LolA UniProt record
    statement: Q88FS9 is the periplasmic carrier between LolCDE and LolB.
  - source_id: file:PSEPK/lolB/lolB-uniprot.txt
    title: PSEPK LolB UniProt record
    statement: Q88PX4 incorporates LolA-delivered lipoproteins into the outer membrane.
  - source_id: file:PSEPK/lolD/lolD-uniprot.txt
    title: PSEPK LolD UniProt record
    statement: Q88KY4 is the ATPase subunit of the LolCDE release complex.
  - source_id: file:interpro/panther/PTHR24220/PTHR24220-review.yaml
    title: PANTHER PTHR24220 family review
    statement: >-
      Lol-pathway and lipoprotein releasing activity are safe only for the LolD
      subfamily SF689; transmembrane-transport terms propagated from a deep ABC
      node need pruning from LolD.
  - source_id: file:interpro/panther/PTHR30489/PTHR30489-review.yaml
    title: PANTHER PTHR30489 family review
    statement: The LolC/LolE family is coherent for lipoprotein releasing activity.
  - source_id: file:interpro/panther/PTHR35869/PTHR35869-review.yaml
    title: PANTHER PTHR35869 family review
    statement: The LolA family is coherent for lipoprotein carrier activity.
  - source_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
    title: OpenScientist research for the reusable Lol trafficking module
    statement: >-
      The report supports the post-maturation three-stage boundary, confines
      ATP use to LolCDE extraction, distinguishes mechanotransmission from
      transmembrane pore transport, and identifies lineage variation in
      extractor and outer-membrane-delivery architecture.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_lol_lipoprotein_trafficking__ppu02010-deep-research-openscientist.md
    title: OpenScientist PSEPK Lol-pathway satisfiability review
    statement: >-
      The report independently identifies lolC/PP_2154, lolD/PP_2155,
      lolE/PP_2156, lolA/PP_4003, and lolB/PP_0724 as the complete canonical
      KT2440 system and finds no biological gap.
notes: >-
  Boundary: the module begins with extraction of an already mature
  outer-membrane-destined lipoprotein and ends with outer-membrane delivery.
  Lgt/LspA/Lnt maturation is upstream and substrate-specific lipoprotein
  function is downstream. Generalization: the LolCDE-LolA-LolB relay is
  conserved beyond Pseudomonas, so the module is species-neutral and uses
  E. coli K-12 (the organism with the defining biochemistry and genetics) and
  P. putida KT2440 as exemplars; every leaf grounds to UniProt members of both.
  The modeled three-part relay is the canonical implementation and not a claim
  that every diderm lineage has LolB or a heterodimeric LolC/LolE extractor;
  LolB is mainly found in beta- and gammaproteobacteria, and some lineages
  encode a single LolC-type membrane subunit. GO terms: LolCDE carries
  GO:0140306 lipoprotein releasing activity (a protein transporter activity,
  not a transmembrane transporter activity) and LolA carries GO:0140598
  lipoprotein carrier activity; GO has no molecular-function term for the LolB
  acceptance and insertion step, which the LolB gene reviews record as a
  proposed new term. Family grounding: PANTHER:PTHR30489 covers both LolC and
  LolE; its subfamilies do not separate the two roles outside enterobacteria
  (KT2440 LolC and LolE are both in SF0), so the operon order lolC-lolD-lolE is
  what assigns the roles. LolB has no PANTHER family assignment in UniProt and
  is grounded to the NCBIfam LolB family TIGR00548, which both exemplars match.
