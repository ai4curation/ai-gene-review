id: MODULE:bacterial_lol_lipoprotein_trafficking
title: Bacterial Lol-dependent outer-membrane lipoprotein trafficking
description: >-
  A species-neutral diderm-bacterial module for ATP-dependent release of
  outer-membrane-destined mature lipoproteins from the inner membrane by
  LolCDE, periplasmic carriage by LolA, and delivery into the outer membrane
  by LolB. Lipoprotein maturation and inner-membrane retention decisions are
  upstream of this module.
status: DRAFT
evidence:
  - source_id: GO:0044874
    title: lipoprotein localization to outer membrane
    statement: GO:0044874 captures the shared biological-process outcome of the three-stage Lol pathway.
  - source_id: file:PSEPK/lolA/lolA-uniprot.txt
    title: PSEPK LolA UniProt record
    statement: Q88FS9 is the periplasmic carrier between LolCDE and LolB.
  - source_id: file:PSEPK/lolB/lolB-uniprot.txt
    title: PSEPK LolB UniProt record
    statement: Q88PX4 incorporates LolA-delivered lipoproteins into the outer membrane.
  - source_id: file:PSEPK/lolD/lolD-uniprot.txt
    title: PSEPK LolD UniProt record
    statement: Q88KY4 is the ATPase subunit of the LolCDE release complex.
  - source_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
    title: OpenScientist research for the reusable Lol trafficking module
    statement: >-
      The report supports the post-maturation three-stage boundary, confines
      ATP use to LolCDE extraction, distinguishes mechanotransmission from
      transmembrane pore transport, and identifies lineage variation in
      extractor and outer-membrane-delivery architecture.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_lol_lipoprotein_trafficking__ppu02010-deep-research-openscientist.md
    title: OpenScientist PSEPK Lol-pathway satisfiability review
    statement: >-
      The report independently identifies lolC/PP_2154, lolD/PP_2155,
      lolE/PP_2156, lolA/PP_4003, and lolB/PP_0724 as the complete canonical
      KT2440 system and finds no biological gap.
notes: >-
  Reusable boundary: this module begins with extraction of an already mature
  outer-membrane-destined lipoprotein and ends with outer-membrane delivery.
  Lgt/LspA/Lnt maturation is upstream and substrate-specific lipoprotein
  function is downstream. Pseudomonas putida KT2440 provides exemplars for all
  five canonical Lol components. The modeled three-part relay is the canonical
  LolCDE-LolA-LolB implementation, not a claim that every diderm lineage has
  LolB or a heterodimeric LolC/LolE extractor.
module:
  id: bacterial_lol_lipoprotein_trafficking
  label: Bacterial Lol-dependent outer-membrane lipoprotein trafficking
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: lipoprotein localization to outer membrane
      term:
        id: GO:0044874
        label: lipoprotein localization to outer membrane
  context:
    taxa:
      - preferred_term: diderm bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: The canonical LolCDE-LolA-LolB route operates across the diderm bacterial envelope.
  parts:
    - order: 1
      role: ATP-dependent inner-membrane extraction and release
      node:
        id: lolcde_release_step
        label: LolCDE lipoprotein release
        module_type: TRANSPORT_STEP
        description: >-
          LolCDE uses ATP hydrolysis to extract an outer-membrane-destined
          mature lipoprotein from the inner membrane and load it onto LolA.
        annotons:
          - id: lolcde_release_complex
            label: LolCDE lipoprotein-release complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: LolCDE ABC lipoprotein-release complex
                description: Heteromeric inner-membrane complex with LolC, LolD, and LolE subunits.
                active_units:
                  - id: lolc_unit
                    label: LolC membrane subunit
                    role: Integral membrane subunit contributing to lipoprotein extraction.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LolC family
                        representative_members:
                          - preferred_term: PSEPK LolC exemplar
                            term:
                              id: UniProtKB:Q88KY5
                              label: LolC
                  - id: lold_unit
                    label: LolD ATPase subunit
                    role: Cytoplasmic ATPase that powers lipoprotein extraction.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LolD family
                        term:
                          id: PANTHER:PTHR24220:SF689
                          label: LIPOPROTEIN-RELEASING SYSTEM ATP-BINDING PROTEIN LOLD
                        representative_members:
                          - preferred_term: PSEPK LolD exemplar
                            term:
                              id: UniProtKB:Q88KY4
                              label: Lipoprotein-releasing system ATP-binding protein LolD
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: lole_unit
                    label: LolE membrane subunit
                    role: >-
                      Integral membrane subunit contributing to lipoprotein extraction.
                      LolC/E sequence classifications may not distinguish this role from
                      LolC, so concrete assignments require orthology and genomic context.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LolE family
                        representative_members:
                          - preferred_term: PSEPK LolE exemplar
                            term:
                              id: UniProtKB:Q88KY3
                              label: Lipoprotein releasing system, permease protein
            function:
              preferred_term: ATP-dependent lipoprotein extraction and release activity
            processes:
              - preferred_term: lipoprotein transport
                term:
                  id: GO:0042953
                  label: lipoprotein transport
              - preferred_term: lipoprotein localization to outer membrane
                term:
                  id: GO:0044874
                  label: lipoprotein localization to outer membrane
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Initiates trafficking by releasing the mature lipoprotein from the inner membrane to LolA.
    - order: 2
