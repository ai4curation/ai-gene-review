    - source: lola_carriage_step
      target: lolb_delivery_step
      connection_type: PROVIDES_INPUT_FOR
      description: LolA presents its lipoprotein cargo to LolB.
  knowledge_gaps:
    - gap_statement: >-
        Diderm lineages vary between heterodimeric LolC/LolE and homodimeric
        LolF-type extractors, and some lack a canonical LolB receptor; what
        replaces LolB in lineages lacking it is not established.
      boundary: >-
        Treat this document as the canonical LolCDE-LolA-LolB route and model
        lineage-specific replacements as explicit variants when grounded.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
          reference_section_type: DISCUSSION
          supporting_text: >-
            Whether all diderms use a LolA-type soluble carrier, and what
            receptor (if any) substitutes for LolB in lineages lacking it, are
            open.
    - gap_statement: >-
        LolA and LolB are normally required in the canonical relay but can be
        genetically bypassed under envelope-stress conditions in E. coli; how
        lipoproteins reach the outer membrane in the bypass state is unknown.
      boundary: >-
        Do not generalize conditional bypass or essentiality to other
        organisms without target-organism evidence.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
          reference_section_type: DISCUSSION
          supporting_text: >-
            how substrates reach the outer membrane in the bypass state
            (diffusion? alternative factors?) is unresolved.
    - gap_statement: >-
        The atomic mechanism of cargo hand-off at the LolCDE-LolA and LolA-LolB
        interfaces, and of LolB-mediated insertion of the lipid anchor into the
        outer membrane, is unresolved.
      boundary: >-
        LolC-LolA docking, LolA-to-LolB transfer and LolB-dependent
        incorporation are established; the molecular choreography is not.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
          reference_section_type: DISCUSSION
          supporting_text: >-
            The **atomic choreography** of cargo hand-off at each interface,
            and the physiological route in the LolA/LolB-bypass state, remain
            unresolved.
