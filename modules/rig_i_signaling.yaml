notes: >-
  Curated compact signaling-pathway module generated from verified UniProt exemplar accessions and local
  PAINT IBD rows. PTN anchors are included only when the exemplar accession appears in an IBD seed row
  in interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar accessions.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level support. Automatically
  extracted open-question headings were intentionally not retained as knowledge_gap entries because they
  were not manually curated. Machine-generated Falcon citations remain curation support and are not manually
  adjudicated here.


  CANDIDATE ASSESSED, NOT MODELLED - MAVS mitochondrial-import maintenance (PMID:42808786): a 2026
  report identifies MAVS as "a regulator of mitochondrial import machinery whose activity is required
  for an IFN-independent antiviral state", reporting that "Loss of MAVS leads to severe mitochondrial
  fragmentation, depolarization, and mitophagy, accompanied by diminished mitochondrial bioenergetics
  and protein import" and that, mechanistically, "MAVS maintains mitochondrial integrity by maintaining
  the expression and assembly of the translocase of the outer membrane complex and sustaining the
  abundance of its core components". No part, annoton or connection is added here, for four reasons.
  (i) The claim points away from this module, by the authors' own framing. Every part of this module is
  a step in transducing a viral-RNA signal: RIG-I ligand recognition causes MAVS signalosome assembly,
  which causes TBK1-IRF3 activation and interferon output. The reported maintenance function is neither
  downstream of RIG-I ligand binding nor upstream of TBK1/IRF, so there is no connections edge it could
  take without asserting what the report denies - that the import-competence arm feeds the interferon
  arm. The authors state the opposite: it is "a mitochondrial maintenance function of MAVS that operates
  in parallel to, and independently of, canonical interferon signaling during RNA virus infection", and
  the antiviral effect they measure persists "even under IFN-deficient conditions". GO:0039529, the
  concept this module is grounded on, is defined as "The series of molecular signals initiated by the
  binding ssRNA or dsRNA from another organism to the cytoplasmic pattern recognition receptor (PRR)
  RIG-1 (also known as DDX58)", so a function whose defining property is independence from that series
  is out of scope by the module's own concept.
  (ii) A second role for a participant is not a second part of this module. Modules model reusable
  mechanisms, and the mechanism here - sustaining the abundance and assembly of the TOM complex, hence
  outer-membrane import competence - already has one: MODULE:mitochondrial_protein_import, whose first
  part (tom_translocation, concept GO:0005742 mitochondrial outer membrane translocase complex) is the
  very complex in question, grounded on the Tom40/Tom22/Tom20/Tom70 families with reviewed human
  representatives (genes/human/TOMM40, TOMM22, TOMM20, TOMM70). If this regulation is modelled at all
  it belongs there, as a regulatory input to TOM biogenesis, not as a fourth step in a
  signal-transduction chain. That module is deliberately left untouched here, because the step below
  is unresolved.
  (iii) The mechanism is not resolved to part granularity. A module part needs a role statement, and
  the available statement - that MAVS maintains TOM "expression and assembly" - is equally consistent
  with MAVS acting on TOM components (transcriptionally or as a stabilizing partner) and with reduced
  TOM abundance being secondary to the fragmentation, depolarization and mitophagy the same report
  describes. Only the abstract and IMPORTANCE paragraph are cached (full_text_available: false; mBio
  ahead-of-print with no PMC record when checked on 2026-10-28), so the assays that would separate
  these were not read. A bioRxiv entry from the same group reporting the same MAVS/TOM/IFN-independent
  findings (10.1101/2025.04.28.651145) appears to be an earlier version of this work, but it was not
  retrievable from this environment either and so is not cited. No knowledge_gaps entry is created
  from this, deliberately: the cached text
  contains the authors' positive claims but no verbatim admission of what remains unknown, and a gap
  statement needs provenance of the ignorance, not an inference from a missing section.
  (iv) The gene-level review is the missing prerequisite, and the claim is not in GOA. There is no
  genes/human/MAVS review in this repository, even though the module grounds the MAVS adaptor on
  UniProtKB:Q7Z434. MAVS's only protein-import annotation, GO:0070585 protein localization to
  mitochondrion (IDA, PMID:23582325), is the unrelated finding that MAVS recruits NLRP3 to
  mitochondria, and its GO-CAM typing is GO:0035591 signaling adaptor activity
  (gomodel:5e72450500004019, gomodel:5ee8120100000524). So the question of whether MAVS itself does
  the work of maintaining import competence, or is merely required for it, has not been adjudicated
  anywhere - and it is a gene-level question about MAVS, answerable only against the full text, not a
  module-boundary question about RIG-I signaling. Revisit this candidate after a MAVS gene review
  exists and the full text is available.
