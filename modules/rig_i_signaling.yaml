    - order: 4
      role: mavs k63 polyubiquitination amplification
      optional: true
      node:
        id: mavs_k63_polyubiquitination
        label: ATG13-ASB1 K63 polyubiquitination of MAVS
        module_type: REGULATORY_STEP
        description: >-
          A Cullin5-RING ligase using ASB1 as its substrate receptor builds K63-linked
          polyubiquitin on MAVS Lys348, raising MAVS oligomerization and downstream IFN-beta/ISRE
          output. ATG13 is the non-catalytic adaptor that binds the MAVS aa 180-360 region and
          brings ASB1 to it, in a role separable from its ULK1-complex autophagy function. This
          is an amplifying input to MAVS signalosome assembly, not an obligatory transduction
          step: loss of either protein lowers MAVS ubiquitination and raises influenza A titres
          without abolishing signalling.
        annotons:
          - id: asb1_mavs_crl5_substrate_receptor
            label: ASB1 CRL5 substrate receptor for MAVS
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ASB1
                term:
                  id: UniProtKB:Q9Y576
                  label: Ankyrin repeat and SOCS box protein 1 (ASB-1)
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              description: ASB1 presents MAVS to the Cullin5-RING ligase through its SOCS box;
                the ubiquitin transfer itself is performed by the CRL5 core, so no catalytic
                activity is asserted for ASB1.
            processes:
              - preferred_term: positive regulation of RIG-I signaling pathway
                term:
                  id: GO:1900246
                  label: positive regulation of RIG-I signaling pathway
            role_description: Substrate-recognition subunit that routes MAVS into CRL5-dependent
              K63-linked polyubiquitination. Placed upstream of TBK1 by reporter epistasis and
              by binding MAVS but not RIG-I or TBK1.
            evidence:
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: ASB1 binds MAVS selectively, increases MAVS K63-linked
                  polyubiquitination dose-dependently, and amplifies RIG-I/MAVS-driven but not
                  TBK1/IKKepsilon/IRF3-driven reporter output, placing it at the MAVS step.
                supporting_text: Immunoprecipitation analysis revealed an interaction between
                  ASB1 and MAVS but not between ASB1 and RIG-I or TBK1
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: The ubiquitin-ligase role is CRL5-dependent; ASB1 is identified as the
                  substrate receptor and Cullin 5 knockdown removes the effect.
                supporting_text: knockdown of Cullin 5 attenuated the ATG13-induced enhancement
                  of MAVS K63-linked polyubiquitination
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: Loss of ASB1 in human lung epithelial cells raises influenza A titres,
                  so the role has a measurable antiviral output and is not reporter-only.
                supporting_text: ASB1 knockdown enhanced IAV titres, indicating that ASB1
                  directly suppresses IAV replication
          - id: atg13_mavs_ubiquitination_adaptor
            label: ATG13 nonautophagic MAVS adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATG13
                term:
                  id: UniProtKB:O75143
                  label: Autophagy-related protein 13
            function:
              preferred_term: ubiquitin-protein transferase activator activity
              term:
                id: GO:0097027
                label: ubiquitin-protein transferase activator activity
              description: ATG13 binds both MAVS and ASB1 and increases ASB1/CRL5-dependent
                K63-linked polyubiquitination of MAVS. It has no ligase activity of its own, so
                the assertion is activation of the transferase, not catalysis.
            processes:
              - preferred_term: positive regulation of RIG-I signaling pathway
                term:
                  id: GO:1900246
                  label: positive regulation of RIG-I signaling pathway
            role_description: Adaptor coupling MAVS to the CRL5-ASB1 ligase. The N-terminal
              HORMA region carries the activity; phospholipid-binding and ATG101-binding mutants
              retain it, so this role is modeled separately from ATG13's autophagy-initiation
              role in the ULK1 complex and is not a reason to place autophagy machinery inside
              this module.
            evidence:
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: ATG13 is non-catalytic here and acts through ASB1; its effect on MAVS
                  K63-linked polyubiquitination is lost on ASB1 knockdown.
                supporting_text: The ATG13 protein itself lacks E3 ubiquitin ligase activity,
                  thus precluding it from directly polyubiquitinating MAVS.
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: Endogenous loss-of-function supports the direction of the effect on
                  MAVS modification, complementing the overexpression result.
                supporting_text: ATG13 knockdown reduced the K63-linked polyubiquitination of
                  endogenous MAVS
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication.
                statement: The MAVS-activating role is separable from autophagy by domain mutants,
                  by 3-MA insensitivity, and by absence of MAVS-LC3 colocalization.
                supporting_text: ATG13 retained its function in promoting MAVS-mediated IFN
                  signalling even after the addition of 3-MA
      evidence:
        - source_id: PMID:42704283
          title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
            influenza A virus replication.
          statement: >-
            The modified residue and the interacting region are mapped: ATG13 binds MAVS aa
            180-360 and the K348R substitution abolishes the ATG13-dependent increase in MAVS
            K63-linked polyubiquitination. This is what makes the step a defined modification of
            the existing MAVS adaptor rather than a generic co-regulator claim.
          supporting_text: when the lysine at position 348 of MAVS was mutated to arginine
            (K348R), ATG13 failed to increase the K63-linked polyubiquitination of MAVS
      notes: >-
        Marked optional because the evidence establishes amplification rather than requirement:
        ATG13 and ASB1 knockdown reduce MAVS K63-linked polyubiquitination and raise influenza A
        titres, but RIG-I/MAVS signalling still runs without them. Evidence is from one study in
        human HEK-293T, A549 and THP-1 cells with influenza A (H9N2, H1N1); other K63 ligases
        reported for MAVS are not modeled here, and no alternative-ligase variant_set is asserted
        until a second independent study constrains the set.
