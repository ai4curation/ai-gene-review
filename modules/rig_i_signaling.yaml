id: MODULE:rig_i_signaling
title: RIG-I signaling pathway module
description: RIG-I detects viral RNA and signals through MAVS to activate TBK1/IKK-family kinases
  and IRF transcription factors that induce type I interferon responses.
references:
  - id: PMID:42808786
    title: MAVS maintains mitochondrial import competence and also limits RNA virus replication independently
      of interferon signaling.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Identifier and title checked against the cached PubMed record. Only the abstract plus the
        IMPORTANCE paragraph are cached (full_text_available: false; the article is mBio
        ahead-of-print, CC-BY, and had no PMC record when checked on 2026-10-28), so the
        experiments behind the claims could not be inspected here. Directly about MAVS, the central
        adaptor of this module, but about a function the authors themselves place outside the
        pathway the module represents: a constitutive mitochondrial-maintenance role that "operates
        in parallel to, and independently of, canonical interferon signaling". Marked MEDIUM for
        that reason rather than LOW — the claim concerns a module participant — and VERIFIED
        because the statements used below are the authors' own summary claims and the paper is not
        cited in support of any module part. Cited only to delimit the assessed-but-unmodelled
        candidate recorded in the notes.
status: DRAFT
