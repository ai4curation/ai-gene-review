                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000540338 in PTHR22969.
                  - preferred_term: PAINT node PTN001491808 for TBK1
                    term:
                      id: PANTHER:PTN001491808
                      label: PTN001491808
                    description: Local PAINT IBD node in PTHR22969 with propagated terms 
                      C:GO:0005737, F:GO:0004674; PAINT date 20260601.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001491808 in PTHR22969.
                evidence:
                  - source_id: file:interpro/panther/PTHR22969/PTHR22969-deep-research-falcon.md
                    title: PTHR22969 Falcon family review
                    statement: >-
                      Falcon family-level GO review: The current state of no InterPro2GO terms mapped
                      to PTHR22969 is appropriate and should be maintained. This is a sound decision for
                      the following reasons: Use this PANTHER family as context with representative members/PTN
                      anchors, not as blanket pathway propagation.
            role_description: Curated exemplar for the tbk1 kinase role in RIG-I signaling pathway.
          - id: irf3_irf3_transcription_factor
            label: IRF3 transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IRF3
