  - source_id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza
      A virus replication.
    statement: >-
      Evaluated candidate regulators ATG13 (UniProtKB:O75143) and ASB1 (UniProtKB:Q9Y576), reported
      to act together on the MAVS node: ATG13 binds the MAVS 180-360 region through its N-terminal
      HORMA domain and recruits ASB1, the substrate-recognition subunit of a CRL5 complex, which
      adds K63-linked polyubiquitin at MAVS K348 and amplifies downstream interferon induction.
      NOT modelled as parts of this module: both are dispensable amplifiers of an already-active
      step rather than obligatory steps of the three-step backbone modelled here, and the entire
      MAVS/RIG-I regulatory layer is unrepresented - see notes for why.
    supporting_text: >-
      ATG13 binds to MAVS and recruits the E3 ubiquitin ligase ASB1, thereby enhancing K63-linked
      polyubiquitination at the K348 site of MAVS
  - source_id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza
      A virus replication.
    statement: >-
      Epistasis by reporter assay places both candidates at the MAVS node of this module rather
      than downstream: ATG13 and ASB1 each potentiate RIG-I N- and MAVS-driven IFN-beta and ISRE
      reporter activity but not that of TBK1, IKK-epsilon or the constitutively active IRF3-5D, so
      if they were ever modelled the receiving node would be mavs_signalosome_assembly.
    supporting_text: >-
      ASB1 enhances RIG-I N- and MAVS-mediated IFN-β and ISRE reporter activity without increasing
      the expression of TBK1, IKKϵ, or IRF3-5D
  - source_id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza
      A virus replication.
    statement: >-
      The contribution is modulatory and cell-type dependent, not switch-like: ATG13 knockout
      reduces but does not abolish RNA-virus-induced interferon transcription, and the authors note
      that an earlier survey found no effect of ATG13 on influenza replication in HeLa or U2OS
      cells. A regulator that tunes the magnitude of an already-active step is what the schema's
      omitted_regulators slot describes; that slot is only meaningful alongside activation_logic,
      which this module does not yet carry, so the determination is recorded in notes instead.
    supporting_text: >-
      the effect of ATG13 on IAV replication is markedly cell-type specific: ATG13 inhibits IAV
      replication in mouse embryonic fibroblasts (MEFs) but has no significant effect on HeLa cells
      or human osteosarcoma (U2OS) cells
  - source_id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza
      A virus replication.
    statement: >-
      The reported acceptor site is not reconciled with the previously mapped K63 sites of MAVS,
      which the same Discussion lists as K7, K136, K297 and K500 (UBE2N-Riplet, UBE2N-TRIM31), and
      K348 is the residue RNF34 is reported to modify with K27/K29 chains. The wiring of the step
      is therefore not yet determinate enough to encode as a module part.
    supporting_text: >-
      this modification primarily occurs at residues K7, K136, K297 and K500 and is catalyzed by
      E2-E3 complexes, such as UBE2N-Riplet and UBE2N-TRIM31
  - source_id: UniProtKB:Q9Y576
    title: Ankyrin repeat and SOCS box protein 1 (ASB-1), human
    statement: >-
      ASB1 resolves to UniProtKB:Q9Y576 (335 aa, protein existence "Evidence at protein level",
      confirmed via the UniProt REST API). Its curated GO annotations are confined to the ubiquitin
      machinery - contributes_to ubiquitin protein ligase activity (GO:0061630, IDA), part_of
      ubiquitin ligase complex (GO:0000151, IDA), ubiquitin-protein transferase regulator activity
      (GO:1990756, IBA) and protein ubiquitination (GO:0016567) - with no annotation to innate
      immunity, interferon induction or the RIG-I pathway (QuickGO, checked at review time). There
      is also no genes/human/ASB1/ review in this repository, so the gene-level curation that a
      module part would rest on does not exist yet.
    url: https://www.uniprot.org/uniprotkb/Q9Y576
  - source_id: UniProtKB:O75143
    title: Autophagy-related protein 13 (ATG13), human
    statement: >-
      ATG13 resolves to UniProtKB:O75143 (517 aa, protein existence "Evidence at protein level",
      confirmed via the UniProt REST API) and has a completed review in this repository, but its
      curated biological-process annotations are entirely autophagic - autophagosome assembly,
      macroautophagy, mitophagy, piecemeal microautophagy of the nucleus, protein localization to
      the phagophore assembly site, regulation of protein lipidation - with no term touching innate
      immunity, interferon induction or RIG-I signalling (checked at review time). The nonautophagic
      role reported here is therefore unannotated at the gene level; proposing it belongs in the
      ATG13 gene review, not in this module's composition.
    url: https://www.uniprot.org/uniprotkb/O75143
knowledge_gaps:
  - gap_statement: >-
      Which lysines of endogenous MAVS actually carry the activating K63-linked polyubiquitin, and
      which E3 ligase writes each of them, is unsettled - so no particular ubiquitin writer can yet
      be admitted as a part of the MAVS signalosome node. The site assignments in the literature
      conflict rather than accumulate: the K63 acceptors mapped in HEK-293T are K7, K136, K297 and
      K500 (UBE2N-Riplet, UBE2N-TRIM31), whereas K348 - the residue reported here as the
      ATG13/ASB1-dependent K63 site - is also the residue RNF34 is reported to modify with K27- and
      K29-linked chains. Each assignment comes from a different overexpression system, and none has
      been corroborated by site-resolved ubiquitinomics on endogenous MAVS.
    boundary: >-
      What is firmly established is the backbone this module models: RIG-I end-selective recognition
      of 5'-triphosphate blunt dsRNA, CARD exposure and tetramerisation, prion-like MAVS
      polymerisation on the mitochondrial outer membrane as the signalling scaffold, and
      TBK1-dependent IRF3 phosphorylation. That K63-linked polyubiquitin on MAVS promotes TRAF and
      TBK1/IKK-epsilon recruitment, and so amplifies output, is also established at the level of the
      modification type. What is not established is the site-and-writer map: which residues bear
      those chains on endogenous MAVS during infection, which of the candidate ligases are
      redundant, hierarchical or cell-type restricted, and whether the ATG13-ASB1-CRL5 route operates
      outside transfected HEK-293T. Accordingly ATG13 (UniProtKB:O75143) and ASB1 (UniProtKB:Q9Y576)
      are recorded as assessed candidate regulators and are deliberately NOT added as parts or
      annotons of the module.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The ubiquitin writers are where the tuning of this pathway happens, and they are the druggable
      layer: too little MAVS ubiquitination gives failed antiviral responses, too much gives
      interferonopathy. A site-and-writer map is also the prerequisite for ever modelling a
      regulatory arm of this module, because an annoton needs a determinate substrate and a
      determinate acceptor site, not a set of mutually inconsistent candidate pairs. Until then,
      admitting one single-paper writer while the structurally characterised ones (TRIM25, RIPLET)
      are unrepresented would misrepresent the state of the evidence.
    resolution: >-
      Site-resolved ubiquitinomics on endogenous MAVS during RNA virus infection - diGly enrichment
      with linkage-specific readout, in cells with each candidate ligase deleted rather than
      overexpressed - would determine which acceptor sites are used and by which writer, and would
      say directly whether K348 carries K63 chains at all. Pairing that with ASB1 and ATG13 knockouts
      in a primary or immune cell type (the paper's own THP-1 line, or primary macrophages) would
      test whether the ATG13-ASB1-CRL5 route is general or HEK-293T-specific. The curation that
      follows - a genes/human/ASB1/ review, a genes/human/MAVS/ review, and the nonautophagic RLR
      role added to the existing ATG13 review - is recorded in this module's notes rather than here,
      since a curator rather than an experiment closes it.
    provenance:
      - reference_id: PMID:42704283
        reference_section_type: DISCUSSION
        supporting_text: >-
          this modification primarily occurs at residues K7, K136, K297 and K500 and is catalyzed by
          E2-E3 complexes, such as UBE2N-Riplet and UBE2N-TRIM31
      - reference_id: PMID:42704283
        reference_section_type: DISCUSSION
        supporting_text: >-
          It has been reported that the E3 ubiquitin ligase ring finger protein 34 (RNF34) promotes
          K27-linked and K29-linked polyubiquitination of MAVS at lysine residue 348
      - reference_id: PMID:42704283
        reference_section_type: DISCUSSION
        supporting_text: >-
          Currently, there is insufficient evidence to determine the precise role of TRAF3 in
          enhancing RLR pathway activation via ATG13.
