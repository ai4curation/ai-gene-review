  - source_id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza A
      virus replication.
    statement: >-
      Grounds the optional MAVS K63-polyubiquitination amplification part: ATG13 binds the MAVS
      aa 180-360 region, recruits the CRL5 substrate receptor ASB1, and raises K63-linked
      polyubiquitination of MAVS Lys348, MAVS oligomerization and IFN-beta/ISRE output in human
      cells. The role is separable from ATG13's autophagy-initiation function.
    supporting_text: ASB1 knockdown attenuated the ATG13-mediated increase in MAVS K63-linked
      polyubiquitination
references:
  - id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza A
      virus replication.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Cached full text (PMC13587579) read for this review; the quoted statements are verbatim
        from it. Evidence for the MAVS step is multi-modal and endogenous as well as
        overexpression-based: ATG13 knockdown/knockout raises influenza A titres in A549 and
        THP-1 cells and lowers endogenous MAVS K63-linked polyubiquitination; ASB1 knockdown
        raises titres and removes the ATG13 effect; Cullin 5 knockdown removes it too; the K348R
        substitution abolishes it. Autophagy-independence rests on three separate lines
        (phospholipid-binding and ATG101-binding HORMA mutants retaining activity, 3-MA
        insensitivity, no MAVS-LC3 colocalization). Limitations noted rather than disputed: a
        single group, influenza A only, no in vivo or primary-cell data, and the reporter
        epistasis placing ASB1 upstream of TBK1 uses overexpressed pathway components.
knowledge_gaps:
  - gap_statement: >-
      Whether ATG13/ASB1-dependent K63-linked polyubiquitination of MAVS Lys348 is a general
      feature of RIG-I signalling or an influenza-A-restricted amplification is undetermined, and
      the quantitative contribution of Lys348 relative to the other reported MAVS K63 ligases is
      unmeasured.
    boundary: >-
      It is established in human HEK-293T, A549 and THP-1 cells that ATG13 binds MAVS aa 180-360,
      recruits ASB1, and raises MAVS Lys348 K63-linked polyubiquitination, MAVS oligomerization
      and IFN-beta/ISRE output, that the effect requires ASB1 and Cullin 5, that it is abolished
      by K348R, and that it survives 3-MA treatment and loss of ATG101/phospholipid binding. All
      of this was shown with influenza A (H9N2, H1N1) by one group.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      Whether this part belongs in the reusable module core or stays an optional virus-specific
      amplifier depends on it. If the axis generalizes to other RNA viruses and to primary cells,
      MAVS Lys348 becomes a defined regulatory site of the signalosome; if not, it is a
      pathogen-specific branch and should be modeled as such.
    provenance:
      - reference_id: PMID:42704283
        supporting_text: ASB1 enhances RIG-I N- and MAVS-mediated IFN-β and ISRE reporter
          activity without increasing the expression of TBK1, IKKϵ, or IRF3-5D
notes: >-
  Curated compact signaling-pathway module generated from verified UniProt exemplar accessions and local
  PAINT IBD rows. PTN anchors are included only when the exemplar accession appears in an IBD seed row
  in interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar accessions.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level support. Automatically
  extracted open-question headings were intentionally not retained as knowledge_gap entries because they
  were not manually curated. Machine-generated Falcon citations remain curation support and are not manually
  adjudicated here.
  Literature triage (2026-10-27, issue #3922): the optional part 4 (ATG13-ASB1 K63 polyubiquitination of
  MAVS) was added from PMID:42704283. It is modeled as an optional amplifying input to the MAVS signalosome
  rather than a core transduction step, following the convention that regulation stays outside the module
  core unless the pathway definition requires it; the comparable precedent in this repository is the
  context-dependent LYN regulator in modules/b_cell_receptor_signaling.yaml. ATG13's autophagy-initiation
  role and the rest of the ULK1 complex are deliberately NOT brought into this module: the paper separates
  the MAVS-activating activity from autophagy, so only the adaptor role is represented. The ATG13 gene
  review (genes/human/ATG13) does not yet carry this innate-immunity role and is a separate follow-up.
