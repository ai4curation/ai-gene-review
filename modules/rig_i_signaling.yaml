id: MODULE:rig_i_signaling
title: RIG-I signaling pathway module
description: RIG-I detects viral RNA and signals through MAVS to activate TBK1/IKK-family kinases
  and IRF transcription factors that induce type I interferon responses.
references:
  - id: PMID:42704283
    title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza
      A virus replication.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Identifier, title and claims checked against the cached full text (PMC13587579, retrieved
        via the PMC XML route, so Results and Discussion were read rather than the abstract alone).
        Technically substantial study in human cells (HEK-293T, A549, THP-1) with knockdown and
        knockout lines, endogenous as well as tagged co-immunoprecipitation, ATG13 and MAVS
        truncation series, ubiquitin-linkage panels, a K348R acceptor-site mutant, ASB1 shRNA and
        CUL5 siRNA, plus autophagy-independence controls (3-MA, HORMA/PLBD point mutants, absence
        of MAVS-LC3 colocalisation). Relevance is MEDIUM rather than HIGH because the paper
        characterises a dispensable amplifier of an already-active step rather than any of the
        three obligatory steps this module models, and because the quantitative mechanism rests
        on transfected reporter and ubiquitination assays in HEK-293T. Cited only to delimit the
        candidate assessment recorded in module.notes; module composition is unchanged.
status: DRAFT
