  notes: >-
    CANDIDATE ASSESSED, NOT MODELLED - ATG13 and ASB1 (PMID:42704283): a 2026 study in human
    HEK-293T, A549 and THP-1 cells reports that ATG13 (UniProtKB:O75143) binds the MAVS 180-360
    region through its N-terminal HORMA domain and recruits ASB1 (UniProtKB:Q9Y576), the
    substrate-recognition subunit of a CRL5 complex, which adds K63-linked polyubiquitin at MAVS
    K348 and amplifies interferon induction; the function is nonautophagic (it survives 3-MA, and
    ATG101-binding and phospholipid-binding mutants retain it) and RLR-specific (ATG13 potentiates
    SeV- but not immunostimulatory-DNA-driven IFNB1/CXCL10). Reporter epistasis places both
    candidates at the MAVS node: each potentiates RIG-I N- and MAVS-driven output but not that of
    TBK1, IKK-epsilon or IRF3-5D, so mavs_signalosome_assembly is where they would go. Neither is
    added as a part here, for three reasons.
    (i) Granularity and evidence order: this module is a deliberately compact three-step backbone -
    viral RNA sensing, MAVS signalosome assembly, TBK1-IRF activation - with five annotons, each an
    obligatory cascade component grounded on a verified UniProt exemplar plus, where available, a
    local PAINT IBD seed. It carries no regulatory layer at all. The module's own deep-research
    report inventories that layer in detail: TRIM25 and RIPLET/RNF135, the K63 ligases required for
    RIG-I CARD tetramerisation; TRIM31 and TRIM22 on MAVS; ZDHHC7/ZDHHC12 palmitoylation; PRMT9
    arginine methylation; SIRT3 deacetylation; O-GlcNAcylation; the deubiquitinases USP10 and USP35;
    and the negative regulators WDR77 and PWWP3A. None of these is modelled. Admitting a
    single-paper accessory pair as the only represented MAVS ubiquitin regulators, while the
    structurally characterised ones are absent, would invert the evidence order.
    (ii) Role: every node here is a step without which the cascade does not run, whereas ATG13 and
    ASB1 tune the magnitude of an already-active step - ATG13 knockout reduces but does not abolish
    RNA-virus-induced IFNB1/CXCL10, and the authors themselves note an earlier survey in which
    ATG13 had no effect on influenza replication in HeLa or U2OS cells. This is exactly what the
    schema's omitted_regulators slot is for ("a modulator that tunes an already-active step rather
    than switching it on or off"), but that slot is only meaningful alongside activation_logic,
    which this module does not yet carry.
    (iii) Determinacy and grounding: the ASB1-to-MAVS ligase relationship and the K348 acceptor site
    rest on this one paper and almost entirely on transfected reporter and ubiquitination assays, and
    they are not reconciled with the K63 sites the same Discussion attributes to UBE2N-Riplet and
    UBE2N-TRIM31 (K7, K136, K297, K500) or with RNF34's reported K27/K29 chains on the same K348; the
    ATG13-TRAF3 interaction found in the same experiments is explicitly left unexplained. ASB1 also
    has no gene review in this repository and no GO annotation touching innate immunity, and ATG13's
    completed review has no immune-related process term, so the gene-level curation a module part
    would rest on does not exist yet. The residual biological question is recorded as a structured
    knowledge_gaps entry (status OPEN) carrying the conflicting site assignments and the experiment
    that would settle them.
    No exclusion guard is added: every participant here is selected by an explicit UniProt accession
    or PANTHER family, so no selector in this module can sweep ATG13 or ASB1 in and guard text would
    be redundant.
    Where this belongs, in order: the nonautophagic RLR role added to the existing
    genes/human/ATG13/ review (its GOA currently has no immune term at all); new genes/human/ASB1/
    and genes/human/MAVS/ reviews, neither of which exists; and only then a MAVS-signalosome
    regulation arm of this module, built regulator-first from TRIM25/RIPLET and the characterised
    MAVS writers and erasers, at which point ATG13 and ASB1 should be re-evaluated for inclusion
    alongside them. Re-evaluate sooner if the ATG13-ASB1-CRL5 route is reproduced on endogenous MAVS
    outside HEK-293T, or if site-resolved ubiquitinomics confirms K348 as a K63 acceptor.
