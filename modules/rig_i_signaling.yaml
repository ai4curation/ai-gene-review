      description: K63-linked polyubiquitination of MAVS Lys348 by CRL5-ASB1, brought to MAVS by
        ATG13, raises MAVS oligomerization and so the signalosome's output. This is an amplifying
        contribution under RNA-virus infection, not a gate on signalosome assembly.
      evidence:
        - source_id: PMID:42704283
          title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
            influenza A virus replication.
          statement: The readout linking the modification to signalosome activation is MAVS
            oligomerization measured by SDD-AGE.
          supporting_text: ATG13 enhanced the oligomerization level of MAVS
