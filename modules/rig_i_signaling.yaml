    - order: 2
      role: mavs k63-polyubiquitination amplification
      optional: true
      node:
        id: mavs_k63_polyubiquitination_amplification
        label: ATG13-ASB1 amplification of MAVS K63-polyubiquitination
        module_type: REGULATORY_STEP
        description: >-
          A non-autophagic amplification step acting on assembled MAVS rather than a step the
          signal has to pass through. ATG13 binds the MAVS 180-360 region through its N-terminal
          HORMA domain and recruits ASB1, the substrate-recognition subunit of the Cullin5-RING
          ligase complex (CRL5); CRL5-ASB1 then builds a K63-linked polyubiquitin chain on MAVS
          Lys348, increasing MAVS oligomerization and IFN-beta/ISRE output. ATG13 carries no
          ubiquitin-ligase activity of its own, so it acts here as the substrate-presenting
          adaptor and ASB1 as the ligase substrate receptor. Reporter epistasis places both
          proteins upstream of TBK1, which is why the step is modelled on MAVS signalosome
          assembly and not as a fourth stage of the cascade.
        annotons:
          - id: atg13_mavs_ubiquitination_adaptor
            label: ATG13 MAVS-ubiquitination adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATG13
                term:
                  id: UniProtKB:O75143
                  label: Autophagy-related protein 13
            function:
              preferred_term: signaling adaptor activity
              description: Brings ASB1 and its substrate MAVS together; ATG13 has no catalytic
                role in the ubiquitin transfer itself.
              term:
                id: GO:0035591
                label: signaling adaptor activity
              targets:
                - preferred_term: MAVS
                  term:
                    id: UniProtKB:Q7Z434
                    label: Mitochondrial antiviral-signaling protein
                - preferred_term: ASB1
                  term:
                    id: UniProtKB:Q9Y576
                    label: Ankyrin repeat and SOCS box protein 1
            processes:
              - preferred_term: positive regulation of protein K63-linked ubiquitination
                term:
                  id: GO:1902523
                  label: positive regulation of protein K63-linked ubiquitination
              - preferred_term: positive regulation of type I interferon production
                term:
                  id: GO:0032481
                  label: positive regulation of type I interferon production
            role_description: Substrate-presenting adaptor that couples MAVS to the CRL5-ASB1
              ligase; a nonautophagic role, separate from the ULK1-complex function that the
              ATG13 gene review treats as core.
            evidence:
              - source_id: PMID:42704283
                title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
                  influenza A virus replication
                statement: Reporter epistasis places ATG13 action at MAVS, upstream of TBK1.
                supporting_text: These results suggest that the target of ATG13 in the RIG-I
                  signalling pathway is upstream of TBK1.
              - source_id: PMID:42704283
                statement: Endogenous ATG13 associates with MAVS in infected human lung epithelial
                  cells.
                supporting_text: And then we also observed endogenous interactions between MAVS and
                  TRAF3 with ATG13 in A549 cells following IAV infection
              - source_id: PMID:42704283
                statement: ATG13 gain and loss of function move MAVS K63-linked polyubiquitination
                  in opposite directions.
                supporting_text: The results show that ATG13 knockdown reduced the K63-linked
                  polyubiquitination of endogenous MAVS
              - source_id: PMID:42704283
                statement: ATG13 increases the oligomerization that marks MAVS activation.
                supporting_text: we performed SDD-AGE analysis and found that ATG13 enhanced the
                  oligomerization level of MAVS
              - source_id: PMID:42704283
                statement: ATG13 contributes no catalytic activity to the ubiquitin transfer.
                supporting_text: The ATG13 protein itself lacks E3 ubiquitin ligase activity, thus
                  precluding it from directly polyubiquitinating MAVS.
              - source_id: PMID:42704283
                statement: The amplification is separable from the autophagy function of ATG13;
                  it survives ATG101-binding and phospholipid-binding mutations and the early
                  autophagy inhibitor 3-MA.
                supporting_text: The results demonstrated that ATG13 retained its function in
                  promoting MAVS-mediated IFN signalling even after the addition of 3-MA
            notes: >-
              The ATG13 gene review (genes/human/ATG13) and its GOA file carry no innate-immunity
              or interferon annotations, so this role is asserted here from the primary paper
              alone and is a candidate NEW row for that review rather than a restatement of it.
          - id: asb1_mavs_k63_ligase_adaptor
            label: ASB1 CRL5 substrate receptor for MAVS
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ASB1
                term:
                  id: UniProtKB:Q9Y576
                  label: Ankyrin repeat and SOCS box protein 1
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              description: SOCS-box substrate receptor of CRL5 that presents MAVS to the
                Cullin5-RBX2 catalytic core; the K63 chain is built on MAVS Lys348.
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              targets:
                - preferred_term: MAVS
                  term:
                    id: UniProtKB:Q7Z434
                    label: Mitochondrial antiviral-signaling protein
            processes:
              - preferred_term: protein K63-linked ubiquitination
                term:
                  id: GO:0070534
                  label: protein K63-linked ubiquitination
              - preferred_term: positive regulation of type I interferon production
                term:
                  id: GO:0032481
                  label: positive regulation of type I interferon production
            role_description: Ligase arm of the step. ASB1 is the ASB-family member that binds
              ATG13, binds MAVS directly, and requires Cullin5 to modify it.
            evidence:
              - source_id: PMID:42704283
                statement: ASB1 is the ASB-family member recovered with ATG13.
                supporting_text: immunoprecipitation, which revealed that ASB1 binds to ATG13
                  among ASB family members
              - source_id: PMID:42704283
                statement: ASB1 binds MAVS and not the flanking pathway components.
                supporting_text: Immunoprecipitation analysis revealed an interaction between ASB1
                  and MAVS but not between ASB1 and RIG-I or TBK1
              - source_id: PMID:42704283
                statement: ASB1 is both sufficient (dose-dependent) and required for the
                  ATG13-driven increase in MAVS K63-linked polyubiquitination.
                supporting_text: The results demonstrated that ASB1 knockdown attenuated the
                  ATG13-mediated increase in MAVS K63-linked polyubiquitination
              - source_id: PMID:42704283
                statement: ASB1 acts as the CRL5 substrate receptor, and the modification depends
                  on the Cullin5 scaffold.
                supporting_text: We found that knockdown of Cullin 5 attenuated the ATG13-induced
                  enhancement of MAVS K63-linked polyubiquitination
            notes: >-
              ASB1 has no gene folder under genes/human (every other human ASB paralog does), so
              the accession Q9Y576 is the only grounding available here.
        knowledge_gaps:
          - gap_statement: The compartment in which the ATG13-ASB1-MAVS step occurs is
              undetermined; colocalization was resolved only to the cytoplasm, so it is not known
              whether the CRL5-ASB1 ligase acts on MAVS already docked at the mitochondrial outer
              membrane or on a pre-docking pool.
            boundary: The interactions, the K63 linkage, the Lys348 acceptor site, the Cullin5
              requirement and the autophagy-independence are established in human A549, THP-1 and
              HEK-293T cells.
            gap_kind:
              - BIOLOGY
            status: OPEN
            resolution: Mitochondrial fractionation or sub-organellar imaging of the ATG13-ASB1-MAVS
              complex, with an ER marker control to separate the outer membrane from
              mitochondria-associated ER membranes.
            provenance:
              - reference_id: PMID:42704283
                supporting_text: confocal microscopy was used to confirm the colocalization of
                  ATG13 with MAVS and TRAF3, but not RIG-I, within the cytoplasm
          - gap_statement: It is not known whether the ATG13-ASB1 amplification is general to RLR
              signalling or specific to the stimuli tested, and no ATG13 or ASB1 loss-of-function
              animal or primary-cell data bound its physiological contribution.
            boundary: Knockdown or knockout of either protein raises influenza A titres in human
              cell lines, and ATG13 loss also lowers IFNB1 and CXCL10 induction by Sendai virus
              and HSV-1.
            gap_kind:
              - BIOLOGY
            status: OPEN
            resolution: Test MAVS Lys348 K63-ubiquitination and interferon output across RLR
              agonists in ATG13- and ASB1-null primary cells and in vivo.
            provenance:
              - reference_id: PMID:42704283
                supporting_text: The results showed that ASB1 knockdown enhanced IAV titres,
                  indicating that ASB1 directly suppresses IAV replication
      evidence:
        - source_id: PMID:42704283
          title: ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict
            influenza A virus replication
          statement: Lys348 of MAVS is the acceptor residue whose mutation abolishes both the
            ATG13-driven ubiquitination and the ATG13-driven increase in interferon output.
          supporting_text: indicating that K348 is the critical ubiquitin modification site for
            the regulation of MAVS function by ATG13
      notes: >-
        Added in response to issue #3922. The step is marked optional because it tunes an
        already-assembled MAVS signalosome rather than gating it: RIG-I signalling proceeds in its
        absence, with reduced interferon output. It rests on a single 2026 study from one group,
        all of it in human cell lines, and none of it is yet in GOA for either ATG13 or ASB1; it
        should be revisited when independent replication appears. The same paper reports an
        ATG13-TRAF3 interaction that was not followed up mechanistically, so TRAF3 is deliberately
        left out of this step.
    - order: 3
      role: tbk1 irf activation
      node:
