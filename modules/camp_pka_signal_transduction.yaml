    - model: gomodel:693b3c0900000157
      title: GPR161 acts as a negative regulator of smoothened pathway by promoting protein processing of GLI3 into transcription repressor GLI3R (Human).
      description: >-
        Project lead model. GPR161 -> GNAS -> ADCY3 adenylate cyclase activity ->
        PRKAR1A regulator / PRKACA cAMP-dependent protein kinase activity, with PKA
        acting on GLI3 processing.
  parts:
    - order: 1
      optional: true
      role: receptor activation of Gs (upstream input)
      node:
        id: camp_upstream_gs_input
        label: Gs-coupled receptor activates G alpha s (shared upstream input)
        description: >-
          Included by reference to the receptor/Gs node of the compact GPCR-cAMP-PKA
          module. Optional because soluble adenylyl cyclase needs no receptor and
          because other G-protein and calcium inputs also regulate the transmembrane
          cyclases. Receptors on the RGD list (CRHR2, GLP1R) belong here, not in the
          cassette.
        module_ref: gpcr_camp_pka_signaling#gs_gpcr_activation
    - order: 2
      role: cAMP synthesis from ATP by adenylyl cyclase
      node:
        id: camp_production
        label: Adenylyl cyclase production of cAMP
        module_type: REACTION
        description: >-
          Adenylyl cyclases convert ATP to cAMP and pyrophosphate. The nine
          transmembrane isoforms are stimulated by G alpha s and differ in how calcium,
          G beta gamma and G alpha i regulate them. The soluble isoform responds to
          bicarbonate and calcium.
        variant_sets:
          - id: adenylyl_cyclase_class
            label: Adenylyl cyclase regulatory class
            axis: regulatory class of the adenylyl cyclase isoform
            selection: ONE_OR_MORE
            notes: >-
              Most tissues express several isoforms; the classes share the C1/C2
              catalytic mechanism and differ in regulation.
            evidence:
              - source_id: PMID:18948702
                statement: Nine membrane-bound G protein-regulated AC isoforms plus a tenth that lacks membrane spans.
                supporting_text: Nine hormone-sensitive, membrane-bound AC isoforms have been identified in addition to a tenth isoform that lacks membrane spans and more closely resembles the cyanobacterial AC enzymes.
              - source_id: PMID:11264454
                statement: Calcium/calmodulin activates AC1 and AC8; calcium inhibits AC5 and AC6.
                supporting_text: emphasizing the role of calcium/calmodulin in activating AC1 and AC8 in the central nervous system, the potential inhibitory effect of calcium on AC5 and AC6
