id: MODULE:plastid_lifecycle
title: Plastid lifecycle
description: 'Plastids are never made from scratch: they grow by importing nucleus-encoded proteins through
  the TOC-TIC translocons and multiply by binary fission, and each cell inherits them from its parent.
  In green tissue they differentiate into chloroplasts that carry out photosynthesis and much of the cell''s
  lipid, amino acid and cofactor synthesis; they can also become amyloplasts, chromoplasts or etioplasts,
  and are removed by chloroplast autophagy and other degradation routes. This umbrella module composes
  the modules for those stages by reference. Protein import and division are required in the green lineage;
  the photosynthesis modules are optional.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/plastid_protein_import.yaml
  title: Plastid protein import through the TOC-TIC translocons
  statement: Green-lineage TOC receptor, Toc75 and ClpC core, with Tic214 optional.
- source_id: file:modules/plastid_division.yaml
  title: Plastid division by the FtsZ and ARC5 rings
  statement: Green-lineage FtsZ1, FtsZ2 and ARC5 core, with MinD optional.
notes: 'Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles and order slots
  follow the shared skeleton. Scoped to Viridiplantae, unlike the eukaryote-wide umbrellas, because the
  plastid rules are grounded in Arabidopsis and green-lineage PAINT nodes. Read as a satisfiability rule,
  the umbrella is satisfied when import and division are. Photosynthesis, the light reactions, the Calvin-Benson-Bassham
  cycle and photorespiration are optional references: non-photosynthetic plastids exist, and those modules
  are not written as Viridiplantae satisfiability rules. Not yet modelled: plastid gene expression, envelope
  and thylakoid membrane biogenesis, plastid quality control (the FtsH and Clp proteases) and turnover
  by chlorophagy or the CHLORAD pathway.'
