    - preferred_term: CMP-KDO biosynthetic process
      term: {id: "GO:0033468", label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
      description: Activation of KDO to the nucleotide-sugar donor CMP-KDO.
