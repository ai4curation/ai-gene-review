id: MODULE:kdo_biosynthesis
title: CMP-KDO biosynthesis
description: >-
  A four-reaction bacterial pathway that converts D-ribulose-5-phosphate to
  CMP-3-deoxy-D-manno-octulosonate (CMP-KDO). An arabinose-5-phosphate
  isomerase supplies D-arabinose-5-phosphate, KdsA forms KDO-8-phosphate, KdsC
  removes the phosphate, and KdsB activates KDO with CTP. Alternative paralogs
  may implement the first two reactions. Transfer of CMP-KDO to lipid A by WaaA
  and the separate ADP-heptose pathway are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019294
    title: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
    statement: Defines biosynthesis of the KDO sugar used in bacterial lipopolysaccharide.
  - source_id: GO:0033468
    title: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
    statement: Defines activation of KDO to CMP-KDO.
  - source_id: KEGG:M00063
    title: CMP-KDO biosynthesis
    statement: Defines the four committed reaction classes represented here.
  - source_id: PMID:16199563
    title: Identification of GutQ from Escherichia coli as a D-arabinose 5-phosphate isomerase.
    statement: >-
      Comparative E. coli biochemistry and genetics establish that a second API
      can substitute for KdsD in KDO/LPS synthesis.
    supporting_text: >-
      Recombinant GutQ was shown to indeed be a second copy of API from the E. coli K-12 genome
  - source_id: PMID:16765569
    title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia coli yrbG-yhbG locus.
    statement: >-
      Comparative E. coli genetics demonstrates redundancy in early KDO
      biosynthetic functions.
    supporting_text: >-
      were shown to be non-essential, indicating genetic redundancy for these two functions
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__kdo-biosynthesis__ppu00541-deep-research-openscientist.md
    title: OpenScientist PSEPK KDO-biosynthesis synthesis
    statement: >-
      Species-aware retrieval used to separate M00063 from the broad ppu00541
      map and to identify paralog alternatives at the first two reactions.
  - source_id: RHEA:23104
    title: arabinose-5-phosphate isomerase reaction
    statement: Defines reversible interconversion of ribulose-5-phosphate and arabinose-5-phosphate.
  - source_id: RHEA:14053
    title: KDO-8-phosphate synthase reaction
    statement: Defines condensation of arabinose-5-phosphate with phosphoenolpyruvate.
  - source_id: RHEA:11500
    title: KDO-8-phosphate phosphatase reaction
    statement: Defines hydrolysis of KDO-8-phosphate to KDO.
  - source_id: RHEA:23448
    title: CMP-KDO synthetase reaction
    statement: Defines CTP-dependent activation of KDO.
notes: >-
  The broad KEGG ppu00541 map also contains ADP-heptose, dTDP-rhamnose,
  GDP-mannose, and UDP-sugar enzymes; these are not parts of CMP-KDO synthesis.
  KT2440 has two API candidates and two KdsA paralogs, represented as ONE_OR_MORE
  alternatives rather than serial steps. All target assignments are based on
  reviewed or rule-based database evidence and pathway continuity; no direct
  KT2440 biochemical assay was found. No generic cytoplasm/cytosol term is
  asserted at module level.
