id: MODULE:kdo_biosynthesis
title: CMP-KDO biosynthesis
description: >-
  A four-reaction pathway that converts the pentose-phosphate intermediate
  D-ribulose 5-phosphate into CMP-3-deoxy-D-manno-octulosonate (CMP-KDO), the
  activated donor of the KDO residues that link lipid A to the core
  oligosaccharide of Gram-negative lipopolysaccharide. An arabinose-5-phosphate
  isomerase (KdsD, or a paralog such as GutQ) forms D-arabinose 5-phosphate;
  KDO 8-phosphate synthase (KdsA) condenses it with phosphoenolpyruvate; KDO
  8-phosphate phosphatase (KdsC) releases free KDO; and CMP-KDO synthetase
  (KdsB) activates KDO with CTP. Transfer of KDO to lipid A by WaaA and the
  separate ADP-heptose pathway are outside the module boundary.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:0019294
    title: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
    statement: Defines biosynthesis of the KDO sugar used in bacterial lipopolysaccharide.
  - source_id: GO:0033468
    title: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
    statement: Defines activation of KDO to CMP-KDO.
  - source_id: KEGG:M00063
    title: CMP-KDO biosynthesis
    statement: Defines the four committed reaction classes represented here.
  - source_id: PMID:12805358
    title: Escherichia coli YrbH is a D-arabinose 5-phosphate isomerase.
    statement: >-
      Biochemical identification of E. coli KdsD (YrbH) as the arabinose-5-phosphate
      isomerase that starts KDO biosynthesis.
    supporting_text: first enzyme in the biosynthesis of 3-deoxy-d-manno-octulosonate (KDO)
  - source_id: PMID:16199563
    title: Identification of GutQ from Escherichia coli as a D-arabinose 5-phosphate isomerase.
    statement: >-
      E. coli biochemistry and genetics establish that a second API (GutQ) can
      substitute for KdsD in KDO/LPS synthesis.
    supporting_text: >-
      Recombinant GutQ was shown to indeed be a second copy of API from the E. coli K-12 genome
  - source_id: PMID:10734095
    title: Structure and mechanism of 3-deoxy-D-manno-octulosonate 8-phosphate synthase.
    statement: The E. coli KdsA structure and reaction define the second step.
    supporting_text: >-
      synthase catalyzes the condensation of phosphoenolpyruvate (PEP) with
      arabinose 5-phosphate (A5P) to form KDO8P and inorganic phosphate
  - source_id: PMID:12639950
    title: Escherichia coli YrbI is 3-deoxy-D-manno-octulosonate 8-phosphate phosphatase.
    statement: Identification of E. coli YrbI/KdsC as the KDO 8-phosphate phosphatase.
    supporting_text: which catalyzes the hydrolysis of KDO 8-P to KDO and inorganic phosphate
  - source_id: PMID:19815542
    title: >-
      Structure-based mechanism of CMP-2-keto-3-deoxymanno-octulonic acid
      synthetase: convergent evolution of a sugar-activating enzyme with DNA/RNA
      polymerases.
    statement: E. coli KdsB structures define the final activation step.
    supporting_text: catalyzes the addition of 2-keto-3-deoxymanno-octulonic acid (Kdo) to CTP to form CMP-Kdo
  - source_id: PMID:16765569
    title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia coli yrbG-yhbG locus.
    statement: >-
      E. coli genetics shows that the isomerase and phosphatase steps are
      individually redundant.
    supporting_text: >-
      were shown to be non-essential, indicating genetic redundancy for these two functions
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__kdo-biosynthesis__ppu00541-deep-research-openscientist.md
    title: OpenScientist PSEPK KDO-biosynthesis synthesis
    statement: >-
      Species-aware retrieval used to separate M00063 from the broad ppu00541
      map and to identify paralogs at the first two reactions in P. putida
      KT2440.
  - source_id: RHEA:23104
    title: arabinose-5-phosphate isomerase reaction
    statement: Defines reversible interconversion of ribulose-5-phosphate and arabinose-5-phosphate.
  - source_id: RHEA:14053
    title: KDO-8-phosphate synthase reaction
    statement: Defines condensation of arabinose-5-phosphate with phosphoenolpyruvate.
  - source_id: RHEA:11500
    title: KDO-8-phosphate phosphatase reaction
    statement: Defines hydrolysis of KDO-8-phosphate to KDO.
  - source_id: RHEA:23448
    title: CMP-KDO synthetase reaction
    statement: Defines CTP-dependent activation of KDO.
notes: >-
  Scope is ABSTRACT: the four reactions and their enzyme families are conserved
  across lipopolysaccharide-producing Gram-negative bacteria (and KdsA/KdsB
  homologs also occur in plants), so the module is written species-neutrally
  with Escherichia coli K-12 as the experimentally characterized exemplar at
  every step and Pseudomonas putida KT2440 as a second, homology-only exemplar.
  KT2440 has two KdsA paralogs (KdsA1 and KdsA2, both listed as
  representatives of the single KdsA step) and two KdsD-subfamily isomerases,
  KdsD (PP_0957) and PP_1806; PP_1806 is listed under the KdsD-type variant because PANTHER
  places it in PTHR42745:SF1, but which pathway receives its product has not
  been tested. The GutQ-type variant is the enterobacterial PTHR42745:SF2
  isomerase. Family groundings use the reviewed PANTHER families for the
  isomerase (PTHR42745:SF1/SF2), KdsA (PTHR21057, a single-subfamily family
  despite its DAHP-aldolase name) and KdsB (PTHR42866:SF2, which holds
  bacterial and plant KdsB despite its mitochondrial name; the Shewanella
  Kdo8N-activating members are recorded as exceptions in the family review).
  The KdsC step is grounded in InterPro IPR010023 instead, because PANTHER
  PTHR21485 mixes KdsC phosphatases with CMP-sialic acid synthetases in both
  of its subfamilies and places E. coli and KT2440 KdsC in different
  subfamilies; the PTHR21485 family review records why. In E. coli the isomerase and phosphatase steps are
  genetically redundant, whereas KdsA and KdsB are single-copy. KdsB uses KDO
  and forms CMP-KDO, so its process is CMP-KDO biosynthesis (GO:0033468), not
  KDO biosynthesis; the PAINT GO:0019294 assertion on the proteobacterial KdsB
  node is recorded as a source defect in the kdsB gene reviews. The CMP-KDO
  produced here is consumed by the WaaA/KdtA Kdo transfer step of
  MODULE:lipid_a_raetz_biosynthesis. The broad KEGG ppu00541 map also contains
  ADP-heptose, dTDP-rhamnose, GDP-mannose and UDP-sugar enzymes, which are not
  parts of CMP-KDO synthesis. KdsA, KdsC and KdsB are cytosolic by
  fractionation proteomics in E. coli, so cytosol is asserted on those leaf
  annotons rather than as module context; no isomerase location is asserted.
module:
  id: kdo_biosynthesis
  label: CMP-KDO biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: KDO biosynthetic process
      term: {id: "GO:0019294", label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
      description: Formation of KDO from pentose-phosphate pathway carbon (steps 1-3).
    - preferred_term: CMP-KDO biosynthetic process
      term: {id: "GO:0033468", label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
      description: Activation of KDO to the nucleotide-sugar donor CMP-KDO (step 4).
  context:
    taxa:
      - preferred_term: Gram-negative bacteria that make KDO-containing lipopolysaccharide
        term: {id: "NCBITaxon:2", label: Bacteria}
  parts:
    - order: 1
      role: D-arabinose-5-phosphate supply
      node:
        id: api_step
        label: D-ribulose-5-phosphate isomerization
        module_type: REACTION
        variant_sets:
          - id: api_paralog_alternatives
            label: Arabinose-5-phosphate isomerase alternatives
            axis: paralog
            selection: ONE_OR_MORE
            variants:
              - id: kdsD_api_variant
                label: KdsD-type API
                module_type: REACTION
                annotons:
                  - id: kdsD_api_activity
                    label: KdsD arabinose-5-phosphate isomerase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KdsD API subfamily
                        term: {id: "PANTHER:PTHR42745:SF1", label: ARABINOSE 5-PHOSPHATE ISOMERASE KDSD}
                        representative_members:
                          - preferred_term: kdsD (Escherichia coli K-12)
                            term: {id: "UniProtKB:P45395", label: Arabinose 5-phosphate isomerase KdsD}
                          - preferred_term: kdsD (Pseudomonas putida KT2440)
                            term: {id: "UniProtKB:Q88P95", label: Arabinose 5-phosphate isomerase}
                          - preferred_term: PP_1806 (Pseudomonas putida KT2440)
                            term: {id: "UniProtKB:Q88LX1", label: Arabinose 5-phosphate isomerase}
                            description: >-
                              Second KT2440 KdsD-subfamily paralog, adjacent to kdsA2;
                              its isomerase activity is inferred by homology, but
                              its contribution to KDO flux is untested.
                    function:
                      preferred_term: arabinose-5-phosphate isomerase activity
                      term: {id: "GO:0019146", label: arabinose-5-phosphate isomerase activity}
                      substrates:
                        - preferred_term: D-ribulose 5-phosphate
                      products:
                        - preferred_term: D-arabinose 5-phosphate
                      evidence:
                        - source_id: RHEA:23104
                          statement: Defines the reversible EC 5.3.1.13 reaction.
                        - source_id: PMID:12805358
                          statement: Kinetic characterization of purified E. coli KdsD.
                          supporting_text: The enzyme is specific for A5P and Ru5P
                    processes:
                      - preferred_term: KDO biosynthetic process
                        term: {id: "GO:0019294", label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
                    role_description: Housekeeping API supplying arabinose 5-phosphate for KDO synthesis.
              - id: gutQ_api_variant
                label: GutQ-type API
                module_type: REACTION
                annotons:
                  - id: gutQ_api_activity
                    label: GutQ arabinose-5-phosphate isomerase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GutQ API subfamily
                        term: {id: "PANTHER:PTHR42745:SF2", label: ARABINOSE 5-PHOSPHATE ISOMERASE GUTQ}
                        representative_members:
                          - preferred_term: gutQ (Escherichia coli K-12)
                            term: {id: "UniProtKB:P17115", label: Arabinose 5-phosphate isomerase GutQ}
                    function:
                      preferred_term: arabinose-5-phosphate isomerase activity
                      term: {id: "GO:0019146", label: arabinose-5-phosphate isomerase activity}
                      substrates:
                        - preferred_term: D-ribulose 5-phosphate
                      products:
                        - preferred_term: D-arabinose 5-phosphate
                      evidence:
                        - source_id: PMID:16199563
                          statement: >-
                            GutQ alone sustains LPS synthesis in a kdsD deletion;
                            the double mutant needs exogenous arabinose 5-phosphate.
                          supporting_text: >-
                            TCM11[(deltakdsD)] was capable of sustaining essential LPS
                            synthesis at wild-type levels, indicating that GutQ functions
                            as an API inside the cell
                    processes:
                      - preferred_term: KDO biosynthetic process
                        term: {id: "GO:0019294", label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
                    role_description: >-
                      Glucitol-operon API of enterobacteria that can replace KdsD
                      for KDO synthesis.
    - order: 2
      role: KDO-8-phosphate formation
      node:
        id: kdsA_step
        label: KDO-8-phosphate synthesis
        module_type: REACTION
        annotons:
          - id: kdsA_activity
            label: KdsA KDO-8-phosphate synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: KdsA KDO-8-phosphate synthase family (PANTHER name refers to the related DAHP synthase reaction)
                term: {id: "PANTHER:PTHR21057", label: PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE}
                representative_members:
                  - preferred_term: kdsA (Escherichia coli K-12)
                    term: {id: "UniProtKB:P0A715", label: 2-dehydro-3-deoxyphosphooctonate aldolase}
                  - preferred_term: kdsA1 (Pseudomonas putida KT2440)
                    term: {id: "UniProtKB:Q88MG0", label: 2-dehydro-3-deoxyphosphooctonate aldolase 1}
                  - preferred_term: kdsA2 (Pseudomonas putida KT2440)
                    term: {id: "UniProtKB:Q88LX0", label: 2-dehydro-3-deoxyphosphooctonate aldolase 2}
            function:
              preferred_term: KDO-8-phosphate synthase activity
              term: {id: "GO:0008676", label: 3-deoxy-8-phosphooctulonate synthase activity}
              substrates:
                - preferred_term: D-arabinose 5-phosphate
                - preferred_term: phosphoenolpyruvate
                - preferred_term: water
              products:
                - preferred_term: KDO 8-phosphate
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:14053
                  statement: Defines the EC 2.5.1.55 reaction.
                - source_id: PMID:10734095
                  statement: Structure and reaction of E. coli KdsA.
                  supporting_text: >-
                    synthase catalyzes the condensation of phosphoenolpyruvate
                    (PEP) with arabinose 5-phosphate (A5P) to form KDO8P and
                    inorganic phosphate
            processes:
              - preferred_term: KDO biosynthetic process
                term: {id: "GO:0019294", label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
            locations:
              - preferred_term: cytosol
                term: {id: "GO:0005829", label: cytosol}
            role_description: >-
              Commits arabinose 5-phosphate to KDO; some genomes, such as KT2440,
              carry two KdsA paralogs.
    - order: 3
      role: KDO-8-phosphate dephosphorylation
      node:
        id: kdsC_step
        label: KDO formation
        module_type: REACTION
        annotons:
          - id: kdsC_activity
            label: KDO-8-phosphate phosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: KdsC family
                term: {id: "InterPro:IPR010023", label: KdsC family}
                representative_members:
                  - preferred_term: kdsC (Escherichia coli K-12)
                    term: {id: "UniProtKB:P0ABZ4", label: 3-deoxy-D-manno-octulosonate 8-phosphate phosphatase KdsC}
                  - preferred_term: kdsC (Pseudomonas putida KT2440)
                    term: {id: "UniProtKB:Q88P96", label: 3-deoxy-D-manno-octulosonate 8-phosphate phosphatase KdsC}
            function:
              preferred_term: KDO-8-phosphate phosphatase activity
              term: {id: "GO:0019143", label: 3-deoxy-manno-octulosonate-8-phosphatase activity}
              substrates:
                - preferred_term: KDO 8-phosphate
                - preferred_term: water
              products:
                - preferred_term: KDO
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:11500
                  statement: Defines the EC 3.1.3.45 reaction.
                - source_id: PMID:12639950
                  statement: Purified E. coli YrbI/KdsC is a Mg2+-dependent HAD phosphatase specific for KDO 8-P.
                  supporting_text: The enzyme is highly specific for KDO 8-P
            processes:
              - preferred_term: KDO biosynthetic process
                term: {id: "GO:0019294", label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
            locations:
              - preferred_term: cytosol
                term: {id: "GO:0005829", label: cytosol}
            role_description: Produces free KDO for nucleotide activation.
    - order: 4
      role: CMP-KDO formation
      node:
        id: kdsB_step
        label: CTP-dependent KDO activation
        module_type: REACTION
        annotons:
          - id: kdsB_activity
            label: CMP-KDO synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: KdsB CMP-KDO synthetase subfamily (bacterial and plant; PANTHER name says mitochondrial)
                term: {id: "PANTHER:PTHR42866:SF2", label: "3-DEOXY-MANNO-OCTULOSONATE CYTIDYLYLTRANSFERASE, MITOCHONDRIAL"}
                representative_members:
                  - preferred_term: kdsB (Escherichia coli K-12)
                    term: {id: "UniProtKB:P04951", label: 3-deoxy-manno-octulosonate cytidylyltransferase}
                  - preferred_term: kdsB (Pseudomonas putida KT2440)
                    term: {id: "UniProtKB:Q88LM7", label: 3-deoxy-manno-octulosonate cytidylyltransferase}
            function:
              preferred_term: CMP-KDO synthetase activity
              term: {id: "GO:0008690", label: 3-deoxy-manno-octulosonate cytidylyltransferase activity}
              substrates:
                - preferred_term: KDO
                - preferred_term: CTP
              products:
                - preferred_term: CMP-KDO
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:23448
                  statement: Defines the EC 2.7.7.38 reaction.
                - source_id: PMID:19815542
                  statement: E. coli KdsB structures with CTP and a KDO analogue.
                  supporting_text: catalyzes the addition of 2-keto-3-deoxymanno-octulonic acid (Kdo) to CTP to form CMP-Kdo
            processes:
              - preferred_term: CMP-KDO biosynthetic process
                term: {id: "GO:0033468", label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process}
              - preferred_term: lipopolysaccharide biosynthetic process
                term: {id: "GO:0009103", label: lipopolysaccharide biosynthetic process}
            locations:
              - preferred_term: cytosol
                term: {id: "GO:0005829", label: cytosol}
            role_description: Produces the activated KDO donor consumed downstream by WaaA.
  connections:
    - source: api_step
      target: kdsA_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: API produces D-arabinose-5-phosphate consumed by KdsA.
    - source: kdsA_step
      target: kdsC_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: KdsA produces KDO-8-phosphate consumed by KdsC.
    - source: kdsC_step
      target: kdsB_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: KdsC produces KDO consumed by KdsB.
