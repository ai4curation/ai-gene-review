id: MODULE:plant_mirna_biogenesis
title: Plant miRNA biogenesis and AGO1 RISC loading
description: >-
  In Arabidopsis thaliana, microRNAs (miRNAs) are transcribed by RNA polymerase II as capped and
  polyadenylated primary transcripts (pri-miRNAs) that fold into imperfect stem-loop hairpins. Unlike
  animals, which split processing between nuclear Drosha and cytoplasmic Dicer, plants carry out both
  cleavage steps in the nucleus with a single RNase III enzyme, DICER-LIKE1 (DCL1). DCL1 works in a
  microprocessor with the double-stranded RNA-binding protein HYPONASTIC LEAVES1 (HYL1, also called DRB1)
  and the C2H2 zinc-finger protein SERRATE (SE). The three proteins meet in nuclear dicing bodies
  (D-bodies) and nucleoplasm. DCL1 alone can cut miRNA precursors, but most of its products are then
  misplaced. HYL1 and SE raise the rate of DCL1 cleavage and position the cuts, so that the correct
  21-nt miRNA/miRNA* duplex is released. The small-RNA methyltransferase HUA ENHANCER1 (HEN1) then adds
  a 2'-O-methyl group to the 3'-terminal ribose of each strand of the duplex. This methyl mark protects
  the miRNA from 3' uridylation, trimming and degradation. The guide strand is then loaded into
  ARGONAUTE1 (AGO1), the main plant miRNA effector. AGO1 cleaves complementary target mRNAs through its
  PIWI-domain slicer activity and can also repress their translation. The miRNA-AGO1 complex is the
  output of this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:17442570
    title: Identification of nuclear dicing bodies containing proteins for microRNA biogenesis in living
      Arabidopsis plants.
    statement: >-
      Both processing steps occur in the plant nucleus by DCL1 with SE and HYL1; the miRNAs are then
      methylated by HEN1 and loaded onto AGO1.
    supporting_text: >-
      in plant cells both steps occur in the nucleus via the enzyme Dicer-like1 (DCL1)
  - source_id: PMID:16144699
    title: MicroRNA biogenesis and function in plants.
    statement: >-
      Plant miRNA biogenesis adds a HEN1 methylation step to the two RNase III cleavage steps and RISC
      incorporation shared with animals.
    supporting_text: >-
      the biogenesis of plant miRNAs consists of an additional step, i.e., the miRNAs are methylated on
      the ribose of the last nucleotide by the miRNA methyltransferase HEN1.
  - source_id: PMID:18632569
    title: The RNA-binding proteins HYL1 and SE promote accurate in vitro processing of pri-miRNA by DCL1.
    statement: >-
      Reconstitution with recombinant proteins shows that DCL1 alone cleaves miRNA precursors inaccurately
      and that HYL1 and SE raise the rate and accuracy of cleavage.
    supporting_text: >-
      We show that recombinant HYL1 and SE proteins accelerate the rate of DCL1-mediated cleavage of pre-
      and pri-miR167b substrates and promote accurate processing.
  - source_id: file:genes/ARATH/DCL1/DCL1-ai-review.yaml
    title: Arabidopsis DCL1 gene review
    statement: >-
      Core functions are ribonuclease III activity (GO:0004525) and double-stranded RNA binding
      (GO:0003725) in primary miRNA processing within the DCL1-HYL1-SE microprocessor.
  - source_id: file:genes/ARATH/DRB1/DRB1-ai-review.yaml
    title: Arabidopsis DRB1/HYL1 gene review
    statement: >-
      Core functions are double-stranded RNA binding (GO:0003725) and noncatalytic ribonuclease activator
      activity (GO:0170054) toward DCL1; the IBA ribonuclease III activity row is removed.
  - source_id: file:genes/ARATH/HEN1/HEN1-ai-review.yaml
    title: Arabidopsis HEN1 gene review
    statement: >-
      Core function is small RNA 2'-O-ribose methyltransferase activity (GO:0090486) on miRNA/miRNA* and
      siRNA/siRNA* duplexes.
  - source_id: file:genes/ARATH/AGO1/AGO1-ai-review.yaml
    title: Arabidopsis AGO1 gene review
    statement: >-
      Core functions are miRNA/siRNA-guided RNA endonuclease (slicer) activity (GO:0004521) in
      miRNA-mediated post-transcriptional gene silencing, siRNA binding, and translation repressor
      activity (GO:0030371) in miRNA-mediated inhibition of translation at the ER.
module:
  id: plant_mirna_biogenesis
  label: Plant miRNA biogenesis (DCL1-HYL1-SE processing, HEN1 methylation, AGO1 loading)
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Concrete Arabidopsis module with three ordered steps: nuclear processing of pri-miRNA hairpins by the
    DCL1-HYL1-SE microprocessor, HEN1 2'-O-methylation of the miRNA/miRNA* duplex, and loading of the
    guide strand into AGO1 to form the miRNA-induced silencing complex (miRISC) that slices target mRNAs
    and represses their translation.
  concepts:
    - preferred_term: miRNA processing
      term:
        id: GO:0035196
        label: miRNA processing
      description: >-
        Conversion of pri-miRNA into a mature, methylated miRNA ready for AGO loading; covers parts 1
        and 2.
    - preferred_term: miRNA-mediated post-transcriptional gene silencing
      term:
        id: GO:0035195
        label: miRNA-mediated post-transcriptional gene silencing
      description: The silencing output carried out by the miRNA-loaded AGO1 complex (part 3).
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: >-
          Concrete instance in Arabidopsis. DCL1, HYL1/DRB-family partners, SE, HEN1 and AGO1 orthologs
          are found across land plants, but this module is grounded only in Arabidopsis proteins.
  parts:
    - order: 1
      role: nuclear pri-miRNA and pre-miRNA processing (microprocessor)
      node:
        id: dcl1_microprocessor
        label: DCL1-HYL1-SE microprocessor in nuclear dicing bodies
        module_type: PROTEIN_COMPLEX
        description: >-
          DCL1 makes both cuts that release the miRNA/miRNA* duplex from the pri-miRNA stem-loop. HYL1
          binds the precursor stem through its tandem N-terminal dsRNA-binding domains and binds DCL1
          through the second DCL1 dsRNA-binding domain. SE, a C2H2 zinc-finger protein that also works in
          pre-mRNA splicing, binds HYL1. HYL1 and SE do not cut RNA themselves. They speed up DCL1 and
          place its cuts at the right positions. The three proteins interact in nuclear dicing bodies.
          A DCL1 truncation that lacks the second dsRNA-binding domain (dcl1-9) neither binds HYL1 nor
          enters D-bodies.
        concepts:
          - preferred_term: primary miRNA processing
            term:
              id: GO:0031053
              label: primary miRNA processing
            description: The first DCL1 cut, releasing a pre-miRNA from the pri-miRNA.
          - preferred_term: pre-miRNA processing
            term:
              id: GO:0031054
              label: pre-miRNA processing
            description: The second DCL1 cut, releasing the miRNA/miRNA* duplex; also done by DCL1 in the nucleus.
        context:
          cellular_components:
            - preferred_term: nuclear dicing body
              term:
                id: GO:0010445
                label: nuclear dicing body
              description: >-
                DCL1, HYL1 and SE interact in D-bodies, and a tagged pri-miRNA is recruited to them. All
                three proteins are also diffuse in the nucleoplasm, so D-bodies may be storage or assembly
                sites rather than the only place of cleavage.
              evidence:
                - source_id: PMID:17442570
                  statement: BiFC shows DCL1, HYL1 and SE interacting in discrete nuclear foci.
                  supporting_text: >-
                    BiFC signals between DCL1, HYL1 and SE were observed in discrete foci while the signal
                    in the nucleoplasm was very low
        annotons:
          - id: dcl1_rnase3
            label: "DCL1: nuclear RNase III that cuts pri- and pre-miRNA hairpins"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DCL1
                term:
                  id: UniProtKB:Q9SP32
                  label: Endoribonuclease Dicer homolog 1
            function:
              preferred_term: ribonuclease III activity
              term:
                id: GO:0004525
                label: ribonuclease III activity
              evidence:
                - source_id: PMID:18632569
                  statement: Recombinant DCL1 alone releases 21-nt RNAs from dsRNA and miRNA precursors.
                  supporting_text: >-
                    We find that DCL1 alone releases 21-nt short RNAs from dsRNA as well as synthetic
                    miR167b precursor RNAs.
                - source_id: PMID:16699516
                  statement: DCL1 is the major Arabidopsis Dicer for miRNA processing.
                  supporting_text: >-
                    DCL1, in addition to its role as the major enzyme for processing miRNAs, has a
                    previously unknown role in the production of small RNAs from endogenous inverted repeats
            processes:
              - preferred_term: primary miRNA processing
                term:
                  id: GO:0031053
                  label: primary miRNA processing
              - preferred_term: pre-miRNA processing
                term:
                  id: GO:0031054
                  label: pre-miRNA processing
                evidence:
                  - source_id: PMID:18632569
                    statement: >-
                      Recombinant DCL1 cleaves both the pre-miRNA hairpin and the longer pri-miRNA, so it
                      makes the second (pre-miRNA) cut as well as the first.
                    supporting_text: >-
                      DCL1 alone is capable of cleaving both the hairpin RNA structure of the pre-miR167b
                      and a longer pri-miR167b containing flanking single-stranded regions to release
                      21-nt small RNAs.
            locations:
              - preferred_term: nuclear dicing body
                term:
                  id: GO:0010445
                  label: nuclear dicing body
          - id: hyl1_dsrna_binding
            label: "HYL1/DRB1: dsRNA-binding recognition of the miRNA precursor stem"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HYL1 (DRB1)
                term:
                  id: UniProtKB:O04492
                  label: Double-stranded RNA-binding protein 1
            function:
              preferred_term: double-stranded RNA binding
              term:
                id: GO:0003725
                label: double-stranded RNA binding
              evidence:
                - source_id: PMID:15821876
                  statement: HYL1 and DCL1 both bind dsRNA.
                  supporting_text: >-
                    DCL1, DCL3, HYL1 and the four HYL1 homologs exhibit significant dsRNA-binding activity
            processes:
              - preferred_term: pre-miRNA processing
                term:
                  id: GO:0031054
                  label: pre-miRNA processing
            locations:
              - preferred_term: nuclear dicing body
                term:
                  id: GO:0010445
                  label: nuclear dicing body
          - id: hyl1_dcl1_activator
            label: "HYL1/DRB1: noncatalytic activator of DCL1 cleavage rate and accuracy"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HYL1 (DRB1)
                term:
                  id: UniProtKB:O04492
                  label: Double-stranded RNA-binding protein 1
            function:
              preferred_term: ribonuclease activator activity
              term:
                id: GO:0170054
                label: ribonuclease activator activity
              targets:
                - preferred_term: DCL1
                  term:
                    id: UniProtKB:Q9SP32
                    label: Endoribonuclease Dicer homolog 1
              evidence:
                - source_id: PMID:16428603
                  statement: HYL1 binds DCL1 and is needed for efficient and precise pri-miRNA cleavage.
                  supporting_text: >-
                    These results indicate that HYL1 has a function in assisting efficient and precise
                    cleavage of pri-miRNA through interaction with DCL1.
                - source_id: PMID:18632569
                  statement: Recombinant HYL1 raises the rate and accuracy of DCL1 cleavage in vitro.
                  supporting_text: >-
                    We show that recombinant HYL1 and SE proteins accelerate the rate of DCL1-mediated
                    cleavage of pre- and pri-miR167b substrates and promote accurate processing.
            processes:
              - preferred_term: miRNA processing
                term:
                  id: GO:0035196
                  label: miRNA processing
            locations:
              - preferred_term: nuclear dicing body
                term:
                  id: GO:0010445
                  label: nuclear dicing body
          - id: se_dcl1_activator
            label: "SE: zinc-finger cofactor that raises DCL1 cleavage rate and accuracy"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SERRATE (SE)
                term:
                  id: UniProtKB:Q9ZVD0
                  label: Serrate RNA effector molecule
            function:
              preferred_term: ribonuclease activator activity
              term:
                id: GO:0170054
                label: ribonuclease activator activity
              targets:
                - preferred_term: DCL1
                  term:
                    id: UniProtKB:Q9SP32
                    label: Endoribonuclease Dicer homolog 1
              evidence:
                - source_id: PMID:18632569
                  statement: Recombinant SE raises the rate and accuracy of DCL1 cleavage in vitro.
                  supporting_text: >-
                    We show that recombinant HYL1 and SE proteins accelerate the rate of DCL1-mediated
                    cleavage of pre- and pri-miR167b substrates and promote accurate processing.
                - source_id: PMID:16889646
                  statement: SE binds HYL1 and acts with DCL1 in pri-miRNA processing before HEN1.
                  supporting_text: >-
                    we provide evidence that SE and HYL1 probably act with DCL1 in processing pri-miRNAs
                    before HEN1 in miRNA biogenesis.
            processes:
              - preferred_term: primary miRNA processing
                term:
                  id: GO:0031053
                  label: primary miRNA processing
            locations:
              - preferred_term: nuclear dicing body
                term:
                  id: GO:0010445
                  label: nuclear dicing body
                description: >-
                  SE is found in D-bodies only in a minority of cells and is predominantly in nuclear
                  speckles, so its D-body presence is transient compared with DCL1 and HYL1.
                evidence:
                  - source_id: PMID:17442570
                    statement: SE is in HYL1 bodies in about 20% of nuclei and is mainly in nuclear speckles.
                    supporting_text: >-
                      the SE signal was present in HYL1 bodies in only a small population of cells
                      (~20%, total nuclei = 125)
            notes: >-
              SE has no gene review yet, so this MF is asserted here from the in vitro reconstitution
              (PMID:18632569) rather than from a reviewed core function. SE also acts in pre-mRNA splicing
              with the cap-binding complex; that role is outside this module.
    - order: 2
      role: 3'-terminal 2'-O-methylation of the miRNA/miRNA* duplex
      node:
        id: hen1_methylation
        label: HEN1 2'-O-methylation of miRNA/miRNA* duplexes
        module_type: REACTION
        description: >-
          HEN1 transfers a methyl group from S-adenosyl-L-methionine to the 2'-OH of the 3'-terminal
          ribose on both strands of the DCL1-generated duplex. HEN1 alone is sufficient for this reaction
          in vitro. Without the methyl mark, miRNAs are 3'-uridylated and trimmed, and their levels fall.
          HEN1 also methylates siRNA duplexes, so this step is shared with siRNA pathways.
        annotons:
          - id: hen1_mtase
            label: "HEN1: small RNA 2'-O-ribose methyltransferase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HEN1
                term:
                  id: UniProtKB:Q9C5Q8
                  label: Small RNA 2'-O-methyltransferase
            function:
              preferred_term: small RNA 2'-O-ribose methyltransferase activity
              term:
                id: GO:0090486
                label: small RNA 2'-O-ribose methyltransferase activity
              evidence:
                - source_id: PMID:15705854
                  statement: HEN1 alone methylates miRNA/miRNA* duplexes on the ribose of the last nucleotide.
                  supporting_text: >-
                    the methyltransferase protein HEN1 is sufficient to methylate miRNA/miRNA* duplexes
                - source_id: PMID:16111943
                  statement: The methyl mark protects miRNA and siRNA 3' ends from uridylation.
                  supporting_text: >-
                    We conclude that 3'-end methylation is a common step in miRNA and siRNA metabolism and
                    likely protects the 3' ends of the small RNAs from the uridylation activity.
            processes:
              - preferred_term: miRNA processing
                term:
                  id: GO:0035196
                  label: miRNA processing
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
                evidence:
                  - source_id: PMID:17442570
                    statement: Tagged HEN1 is found in both the nucleus and the cytoplasm.
                    supporting_text: HEN1 and AGO1 localize both in the nucleus and the cytoplasm
            notes: >-
              Only the nuclear location is asserted. The HEN1 gene review leaves its cytoplasm rows
              UNDECIDED.
    - order: 3
      role: guide-strand loading into AGO1 and miRISC target slicing
      node:
        id: ago1_mirisc
        label: AGO1 loading and miRNA-guided target slicing (miRISC)
        module_type: PROTEIN_COMPLEX
        description: >-
          The methylated miRNA strand is loaded into AGO1. AGO1 binds miRNAs, trans-acting siRNAs and
          transgene siRNAs but excludes 24-nt heterochromatic siRNAs. Loaded AGO1 cleaves complementary
          target mRNAs with its PIWI-domain catalytic centre. The active slicer is about 150 kDa,
          probably AGO1 with its guide RNA and no other protein, rather than a large animal-type RISC.
          AGO1 also represses target translation at the endoplasmic reticulum (modelled as a
          separate annoton). HYL1 and AGO1 interact in
          BiFC, which suggests that strand selection may be coupled to the microprocessor, but the
          loading mechanism is not modelled here.
        concepts:
          - preferred_term: RISC complex
            term:
              id: GO:0016442
              label: RISC complex
            description: >-
              The miRNA-loaded AGO1 effector. In Arabidopsis the slicer-active form is small (about
              150 kDa).
        annotons:
          - id: ago1_guide_binding
            label: "AGO1: miRNA guide binding (loaded effector)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AGO1
                term:
                  id: UniProtKB:O04379
                  label: Protein argonaute 1
            function:
              preferred_term: miRNA binding
              term:
                id: GO:0035198
                label: miRNA binding
              evidence:
                - source_id: PMID:16081530
                  statement: AGO1 is physically associated with miRNAs and selected siRNA classes.
                  supporting_text: >-
                    AGO1 is physically associated with miRNAs, transacting siRNAs, and transgene-derived
                    siRNAs but excludes virus-derived siRNAs and 24-nt siRNAs involved in chromatin
                    silencing.
                - source_id: PMID:17442570
                  statement: The methylated miRNA strand is preferentially loaded into the AGO1 slicer complex.
                  supporting_text: >-
                    then the miRNA strand is preferentially loaded onto the RNA-induced silencing complex
                    (RISC) containing the slicer AGO1 to degrade target RNAs
            processes:
              - preferred_term: miRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035195
                  label: miRNA-mediated post-transcriptional gene silencing
            notes: >-
              miRNA binding is retained (ACCEPT) but is not listed as a core MF in the AGO1 gene review,
              whose core MFs are the slicer, siRNA binding and translational repression. It is modelled
              here because this annoton is the loading step itself.
          - id: ago1_slicer
            label: "AGO1: miRNA-guided target RNA endonuclease (slicer)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AGO1
                term:
                  id: UniProtKB:O04379
                  label: Protein argonaute 1
            function:
              preferred_term: endoribonuclease activity, cleaving miRNA-paired mRNA
              term:
                id: GO:0090624
                label: endoribonuclease activity, cleaving miRNA-paired mRNA
              evidence:
                - source_id: PMID:16081530
                  statement: AGO1 cleaves a miR165 target RNA in vitro through PIWI-domain catalytic residues.
                  supporting_text: We also show that AGO1 has Slicer activity.
                - source_id: PMID:16081530
                  statement: >-
                    Immunopurified AGO1 programmed with endogenous miR165 cleaves the PHV target mRNA, and
                    a mutation at the miRNA-paired position abolishes cleavage.
                  supporting_text: >-
                    the WT protein was correctly programmed by endogenous miR165 as it cleaved the PHV RNA
                    in vitro into the predicted 5′ and 3′ fragments
            notes: >-
              GO:0090624 is a child of RNA endonuclease activity (GO:0004521), the term the AGO1 gene
              review uses as its core MF. The more specific term is used here because the annoton's
              evidence is miRNA-guided cleavage of a paired target mRNA; siRNA-guided slicing by AGO1 is
              outside this module.
            processes:
              - preferred_term: miRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035195
                  label: miRNA-mediated post-transcriptional gene silencing
                evidence:
                  - source_id: PMID:15131082
                    statement: ago1 mutants accumulate miRNA-targeted mRNAs.
                    supporting_text: >-
                      we show that Arabidopsis ago1 mutants have increased accumulation of mRNAs known to
                      be targeted for cleavage by miRNAs
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
          - id: ago1_translational_repression
            label: "AGO1: miRNA-guided translational repression at the endoplasmic reticulum"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AGO1
                term:
                  id: UniProtKB:O04379
                  label: Protein argonaute 1
            function:
              preferred_term: translation repressor activity
              term:
                id: GO:0030371
                label: translation repressor activity
              evidence:
                - source_id: PMID:23622241
                  statement: AGO1 is required for miRNA-mediated translational repression.
                  supporting_text: >-
                    Given that both AMP1 and the miRNA effector AGO1 are required for miRNA-mediated
                    translation repression
                - source_id: file:genes/ARATH/AGO1/AGO1-ai-review.yaml
                  statement: >-
                    The AGO1 gene review lists translation repressor activity (GO:0030371) in
                    miRNA-mediated translational inhibition (GO:0035278) at the ER (GO:0005783) as a core
                    function.
            processes:
              - preferred_term: miRNA-mediated gene silencing by inhibition of translation
                term:
                  id: GO:0035278
                  label: miRNA-mediated gene silencing by inhibition of translation
                evidence:
                  - source_id: PMID:23622241
                    statement: miRNAs repress translation of their targets on the ER.
                    supporting_text: miRNAs inhibit the translation of target RNAs on the ER.
            locations:
              - preferred_term: endoplasmic reticulum
                term:
                  id: GO:0005783
                  label: endoplasmic reticulum
                evidence:
                  - source_id: PMID:23622241
                    statement: AGO1 is a peripheral ER membrane protein.
                    supporting_text: >-
                      AGO1 is a peripheral ER membrane protein that is also possibly associated with the
                      rough ER.
            notes: >-
              Modelled because the module's scope includes the action of the loaded miRISC, and the
              AGO1 gene review treats translational repression as a core function alongside slicing.
              The ER membrane protein AMP1, which is also required for this repression, has no
              Arabidopsis gene review and is not modelled.
  connections:
    - source: dcl1_microprocessor
      target: hen1_methylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The DCL1-HYL1-SE microprocessor releases the miRNA/miRNA* duplex, which is the substrate HEN1
        methylates.
      evidence:
        - source_id: PMID:16889646
          supporting_text: >-
            we provide evidence that SE and HYL1 probably act with DCL1 in processing pri-miRNAs before
            HEN1 in miRNA biogenesis.
    - source: hen1_methylation
      target: ago1_mirisc
      connection_type: PROVIDES_INPUT_FOR
      description: The methylated miRNA guide strand is loaded into AGO1.
      evidence:
        - source_id: PMID:17442570
          supporting_text: >-
            Plant miRNA/miRNA* duplexes generated by DCL1 are methylated by HEN1 at their 3’ ends
notes: >-
  Boundary. The module starts at the pri-miRNA hairpin and ends with the miRNA-loaded AGO1 effector and
  its two outputs, target slicing and translational repression at the ER. MIR gene transcription by RNA polymerase II and its regulators (for example
  DAWDLE, CDC5, NOT2, and HYL1's own role at MIR loci) are upstream and are not modelled. Other
  accessory microprocessor factors (TGH, CPL1, which dephosphorylates HYL1, and the cap-binding complex
  CBP20/CBP80) and HASTY-dependent export are also not modelled. None of these has an Arabidopsis gene
  review yet. The specific 3'-to-5' exonucleases (SDN1) and uridylyltransferases (HESO1, URT1) that act
  on unmethylated or AGO1-bound miRNAs are miRNA turnover and are out of scope.

  RDR6 is deliberately excluded. RDR6 (UniProtKB:Q9SG02, reviewed in genes/ARATH/RDR6) is an
  RNA-dependent RNA polymerase that converts AGO-cleaved or aberrant transcripts into dsRNA for
  DCL4/DCL2-dependent secondary siRNA (tasiRNA/phasiRNA) production with SGS3. It acts downstream of
  miRNA-guided cleavage (for example miR173-AGO1 at TAS1/TAS2 and miR390-AGO7 at TAS3). It has no role
  in making miRNAs. It belongs in a separate secondary-siRNA amplification module. That module would
  take miRISC cleavage of TAS transcripts as its input, and its siRNAs would also be HEN1-methylated and
  AGO1-loaded. Likewise, DCL1-produced inverted-repeat siRNAs and the heterochromatic DCL3/RDR2/AGO4
  pathway are out of scope.

  The HYL1 ribonuclease activator assertion follows the DRB1 gene review, which removes the IBA
  ribonuclease III activity row because HYL1 has no RNase III domain. No production GO-CAMs in
  gocams/index.tsv contain these Arabidopsis proteins. SERRATE (UniProtKB:Q9ZVD0) has no gene review
  yet. It is the only grounding in this module without one.
