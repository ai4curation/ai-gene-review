id: MODULE:dmel_cgas_sting_signaling
title: cGAS-STING signaling pathway in Drosophila melanogaster
description: >-
  Drosophila has two cGAS-like receptors, cGlr1 and cGlr2, that sense infection-associated
  nucleic acids and synthesize cyclic GMP-AMP dinucleotides. cGlr1 is activated by double-stranded
  RNA and produces 3',2'-cGAMP. The cyclic dinucleotides bind Sting, which signals through
  the IKK kinases to activate the NF-kappa-B family transcription factor Relish. Relish then
  induces Sting-regulated genes that restrict RNA virus infection.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001792
  title: 'FlyBase gene group CGAS-STING: Cgas-sting signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as cgas-sting signaling pathway
    (CGAS-STING); this module models that group.
- source_id: GO:0140896
  title: cGAS/STING signaling pathway
  statement: >-
    GO term grounding the module as cGAS/STING signaling pathway.
notes: >-
  Boundary. Core components only (FlyBase CGAS-STING-C). IKKbeta and Relish are shared with
  the Imd pathway. The role of IKKepsilon in Sting signaling is included because FlyBase lists
  it as core; no activity is asserted for it here. A generic cyclic GMP-AMP synthase activity
  is used for both cGLRs because the two enzymes differ in the cGAMP isomers they make. FlyBase
  groups realized by this module: CGAS-STING (FBgg0001792). Subgroups folded into it: CGAS-STING-C.
  FlyBase also curates regulator sets for this pathway, which are context and not modelled
  as parts: CGAS-STING-P (positive regulators of cgas-sting signaling pathway, 1 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cgas_sting_signaling.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
