id: MODULE:bacterial_nonhomologous_end_joining
title: Bacterial non-homologous end joining
description: >-
  A reusable bacterial DNA double-strand-break repair module in which a Ku
  homodimer recognizes, protects, and aligns broken duplex ends, a LigD-family
  enzyme conditionally remodels non-ligatable termini through polymerase and
  3-prime-phosphoesterase activities, and an ATP-dependent LigD ligase domain
  seals the DNA backbone. The module excludes homologous recombination,
  single-strand annealing, eukaryotic NHEJ factors, and accessory bacterial
  backup routes that do not require the Ku-LigD core.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006303
    title: double-strand break repair via nonhomologous end joining
    statement: Defines the template-independent double-strand-break repair process represented by this module.
  - source_id: PMID:12215643
    title: Identification of a DNA nonhomologous end-joining complex in bacteria.
    statement: Experimental work established bacterial Ku-mediated ligase recruitment and stimulation.
    supporting_text: bacterial Ku specifically recruits DNA ligase to DNA ends
  - source_id: PMID:16023671
    title: Domain structure of a NHEJ DNA repair ligase from Mycobacterium tuberculosis.
    statement: Biochemical dissection established separable LigD catalytic activities.
    supporting_text: ligase domains of Mt-Lig were cloned individually
  - source_id: PMID:20018881
    title: Gap filling activities of Pseudomonas DNA ligase D (LigD) polymerase and functional interactions of LigD with the DNA end-binding Ku protein.
    statement: Pseudomonas reconstitution supports Ku-dependent end protection, gap filling, and end joining.
    supporting_text: Pseudomonas Ku stimulates POL-catalyzed ribonucleotide addition to a plasmid DSB end and promotes plasmid end joining by full-length Pseudomonas LigD.
  - source_id: PANTHER:PTN002222140
    title: PAINT prokaryotic Ku double-stranded-DNA-binding node
    statement: The local PTHR41251 PAINT export assigns GO:0003690 to this ancestral node.
  - source_id: PANTHER:PTN001627042
    title: PAINT LigD polymerase, ligase, and NHEJ node
    statement: The local PTHR42705 PAINT export assigns GO:0003887, GO:0003910, and GO:0006303 to this ancestral node.
notes: >-
  The core boundary is Ku plus LigD. End processing is conditional because
  directly compatible termini can proceed from Ku-bound ends to ligation,
  whereas blocked, gapped, or incompatible termini require one or both LigD
  processing activities. Some bacterial lineages split LigD activities among
  proteins or use backup ligases; those architectures require explicit,
  separately grounded variants. No generic cytoplasm location is asserted at
  module or annoton level because the target records do not directly establish
  a more specific cellular-component claim.
