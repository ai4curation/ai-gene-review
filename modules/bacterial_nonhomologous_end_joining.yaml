id: MODULE:bacterial_nonhomologous_end_joining
title: Bacterial non-homologous end joining
description: A bacterial Ku–LigD implementation of double-strand-break repair in which Ku binds and aligns
  broken duplex ends and a fused LigD protein seals compatible termini with ATP. Depending on end chemistry
  and the domains present, repair can additionally involve deoxynucleotide or ribonucleotide addition,
  3-prime-phosphate removal, or abasic-site processing. These processing activities are conditional and
  are not all conserved in every LigD or required for every break. The scope excludes homologous recombination,
  single-strand annealing, eukaryotic NHEJ, split-protein implementations and alternative backup-ligase
  routes.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0006303
  title: double-strand break repair via nonhomologous end joining
  statement: Defines DNA-end joining without a homologous repair template; this does not imply that POL
    nucleotide incorporation is template-independent.
- source_id: PMID:12215643
  title: Identification of a DNA nonhomologous end-joining complex in bacteria.
  statement: Experimental work established bacterial Ku-mediated ligase recruitment and stimulation.
  supporting_text: bacterial Ku specifically recruits DNA ligase to DNA ends
- source_id: PMID:16023671
  title: Domain structure of a NHEJ DNA repair ligase from Mycobacterium tuberculosis.
  statement: Biochemical dissection demonstrates templated polymerase activity and an independently active
    ligase domain.
  supporting_text: The ligase domain catalysed the sealing of nicked double-stranded DNA designed to mimic
    a DSB
- source_id: PMID:20018881
  title: Gap filling activities of Pseudomonas DNA ligase D (LigD) polymerase and functional interactions
    of LigD with the DNA end-binding Ku protein.
  statement: Pseudomonas reconstitution supports Ku-dependent end protection, gap filling, and end joining.
  supporting_text: Pseudomonas Ku stimulates POL-catalyzed ribonucleotide addition to a plasmid DSB end
    and promotes plasmid end joining by full-length Pseudomonas LigD.
- source_id: PANTHER:PTN002222140
  title: PAINT prokaryotic Ku double-stranded-DNA-binding node
  statement: The local PTHR41251 PAINT export assigns GO:0003690 to this ancestral node.
- source_id: PANTHER:PTN001627042
  title: PAINT LigD polymerase, ligase, and NHEJ node
  statement: The local PTHR42705 PAINT export assigns GO:0003887, GO:0003910, and GO:0006303 to this ancestral
    node.
- &id005
  source_id: PMID:34901162
  title: 'LigD: A Structural Guide to the Multi-Tool of Bacterial Non-Homologous End Joining.'
  statement: Review of comparative LigD architecture establishes that processing-domain content and order
    vary by lineage.
  supporting_text: B. subtilis LigD lacks the PE domain, with only the LIG domain at the N-terminus and
    the POL domain at the C-terminus
- &id002
  source_id: PMID:30746801
  title: 'Bacterial NHEJ: a never ending story.'
  statement: Comparative review covers bacterial systems of different complexity; the canonical fused-LigD
    boundary does not encompass every bacterial NHEJ architecture.
  supporting_text: Bacterial NHEJ is performed by sets of proteins of growing complexity from Bacillus
    subtilis and Mycobacterium tuberculosis to Streptomyces and Sinorhizobium meliloti.
- &id001
  source_id: PMID:33078828
  title: Evolutionary and Comparative Analysis of Bacterial Nonhomologous End Joining Repair.
  statement: Comparative genomic analysis supports sporadic bacterial distribution rather than universal
    presence or an asserted bacterial ancestral state.
  supporting_text: Our results show that this pathway is sporadically distributed across the phylogeny.
- &id006
  source_id: PMID:16046407
  title: Essential constituents of the 3'-phosphoesterase domain of bacterial DNA ligase D, a nonhomologous
    end-joining enzyme.
  statement: Pseudomonas PE directly removes a blocking phosphate from an all-DNA primer-template; this
    is distinct from terminal-ribonucleotide trimming.
  supporting_text: the PE domain has a 3'-phosphatase activity on an all-DNA primer-template
- &id003
  source_id: PMID:25355514
  title: Efficient processing of abasic sites by bacterial nonhomologous end-joining Ku proteins.
  statement: AP lyase is measured in Bacillus Ku and also Pseudomonas Ku; it is not a universal family
    grant or a native BER process assertion.
  supporting_text: The presence of an AP-lyase activity also in the homolog protein from the distantly
    related bacterium Pseudomonas aeruginosa
- &id007
  source_id: PMID:30976810
  title: Bacterial Ligase D preternary-precatalytic complex performs efficient abasic sites processing
    at double strand breaks during nonhomologous end joining.
  statement: Bacillus POL cleaves AP sites near recessed ends and couples the reaction to joining under
    defined nucleotide and metal conditions.
  supporting_text: a robust AP lyase activity in the polymerization domain of Bacillus subtilis LigD
- &id010
  source_id: PMID:41957403
  title: Insights into the functional coordination of LigD and Ku in bacterial nonhomologous end joining.
  statement: Bacillus LigD couples AP-site processing, nucleotide insertion and ligation under Ku-mediated
    synapsis in the tested reconstitution. This is substrate- and construct-specific.
  supporting_text: LigDBs catalyzes these steps without dissociating from DNA, being this processive catalysis
    dependent on KuBs-mediated synapsis.
- source_id: PMID:17938628
  title: Bacterial DNA repair by non-homologous end joining.
  statement: The accessible abstract of this historical review corroborates the Ku-LigD framework in mycobacteria
    and other genera; it is not used to assert universal bacterial presence or ancestry.
  supporting_text: an NHEJ system that depends on a dedicated DNA ligase, LigD, and the DNA-end-binding
    protein Ku
notes: 'Bacteria is the taxonomic envelope of this implementation, not a claim of universal occurrence.
  The panel samples Pseudomonadota, Actinomycetota and Bacillota. Bacillus LigD lacks PE despite sharing
  PTHR42705:SF2 with PE-containing proteins, so the phosphatase participant is function- and domain-qualified.
  Ku can itself catalyze AP-site chemistry in measured exemplars; it is not universally an inert scaffold.
  Required Ku and fused-LigD roles define the modeled canonical route, not the necessity of those proteins
  for every end-joining event in each organism. KT2440 Cas9 repair can be LigD-independent, and PA14 backup-route
  findings are not automatically native PAO1 evidence. Family/PTN provenance is distinct from exact member
  placement: the KT2440 accessions are absent from the sampled trees. Optional chemistry records capabilities,
  while substrate-specific necessity and compatible native partners must be supplied by the evidence-backed
  capacity scenarios. Family membership does not establish compatible native partners, the chemistry of
  a particular break or that all optional activities occur in one event. Evaluate compatible-end, gap,
  phosphate-blocked and AP-bearing scenarios with explicit evidence-qualified capability requirements;
  Boolean core satisfaction alone does not prove repair of each substrate.'
