  knowledge_gaps:
    - gap_statement: The relative contributions and ordering of LigD polymerase and phosphoesterase activities depend on the chemistry of each DNA end.
      boundary: Model both as conditional activities within end remodeling; do not infer that every repaired break requires both.
      gap_kind:
        - BIOLOGY
    - gap_statement: Ku-LigD systems with split catalytic proteins or backup ligases require separately grounded implementation variants.
      boundary: The canonical fused-LigD implementation is modeled here; accessory and replacement routes remain outside the core.
      gap_kind:
        - CURATION
