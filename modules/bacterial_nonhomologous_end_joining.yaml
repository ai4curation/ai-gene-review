  knowledge_gaps:
  - gap_statement: The relative contributions and ordering of LigD polymerase and phosphoesterase activities
      depend on the chemistry of each DNA end.
    boundary: Model both as conditional activities within end remodeling; do not infer that every repaired
      break requires both.
    gap_kind:
    - BIOLOGY
  - gap_statement: Ku-LigD systems with split catalytic proteins or backup ligases require separately
      grounded implementation variants.
    boundary: The canonical fused-LigD implementation is modeled here; accessory and replacement routes
      remain outside the core.
    gap_kind:
    - CURATION
  - gap_statement: Ku effects on LigD polymerization vary with assay, construct and substrate, and alternate
      routes can repair DNA in the absence of canonical LigD.
    boundary: Keep the 2026 CDC1551 LigD construct separate from H37Rv, the truncated Bacillus Ku construct
      separate from native occupancy, and native KT2440/PA14 observations separate from PAO1 biochemistry.
      No universal activation sign or obligatory gene dependence is asserted.
    gap_kind:
    - BIOLOGY
  - gap_statement: AP beta-elimination products depend on substrate geometry. A 3-prime phospho-alpha,beta-unsaturated
      aldehyde end is not equivalent to a simple 3-prime phosphate.
    boundary: AP-lyase and ligase capacity alone does not establish repair of arbitrary AP-bearing ends.
      Test the experimentally supported short5-prime-overhang/recessed-end substrates separately from
