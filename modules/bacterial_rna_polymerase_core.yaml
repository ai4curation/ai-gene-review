id: MODULE:bacterial_rna_polymerase_core
title: Bacterial DNA-directed RNA polymerase core enzyme
description: >-
  The bacterial DNA-directed RNA polymerase core enzyme, the multisubunit
  machine that carries out DNA-templated RNA synthesis in all bacteria. The
  conserved core is built from an alpha dimer, the beta and beta-prime subunits
  that together form the active-centre cleft, and the small omega subunit.
  Alpha dimerization is the first assembly step and provides the platform on
  which beta and then beta-prime assemble; omega latches beta-prime and
  promotes the final assembly step. The beta/beta-prime cleft holds the DNA
  template, the RNA-DNA hybrid, the incoming nucleotide and the catalytic
  Mg(2+) ion. Sigma factors convert the core into promoter-specific holoenzymes
  and are outside this module, as are elongation and termination factors and
  lineage-specific accessory subunits.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: file:modules/bacterial_rna_polymerase_core-deep-research-openscientist.md
    title: OpenScientist review of the bacterial RNA polymerase core
    statement: >-
      The species-neutral review supports the alpha2-beta-beta-prime-omega
      canonical composition, the assembly order, the beta/beta-prime active
      cleft, and the distinction between omega-mediated assembly and stability
      and catalytic necessity.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_rna_polymerase_core__ppu03020-deep-research-openscientist.md
    title: OpenScientist PSEPK RNA polymerase pathway satisfiability review
    statement: >-
      The taxon-constrained report finds the P. putida KT2440 RNA polymerase
      bucket (KEGG ppu03020) completely satisfiable through RpoA, RpoB, RpoC
      and RpoZ, with no missing core role or lineage-specific replacement.
  - source_id: GO:0000345
    title: cytosolic DNA-directed RNA polymerase complex
    statement: >-
      GO defines this term as the eubacterial multisubunit RNA polymerase with
      a core of beta-prime, beta, two alpha and the nonessential omega subunit,
      to which a sigma factor binds for promoter recognition. This is exactly
      the boundary of the module.
  - source_id: file:ECOLI/rpoC/rpoC-uniprot.txt
    title: UniProtKB entry for E. coli K-12 rpoC (P0A8T7)
    statement: >-
      UniProt records the E. coli core composition (2 alpha, 1 beta, 1 beta',
      1 omega) and the experimentally determined catalytic Mg(2+) and
      structural Zn(2+) sites of beta-prime.
  - source_id: file:BACSU/rpoB/rpoB-uniprot.txt
    title: UniProtKB entry for B. subtilis 168 rpoB (P37870)
    statement: >-
      UniProt records the experimentally determined B. subtilis RNAP
      composition: a core of 2 alpha, beta and beta-prime associated with the
      delta subunit and at least one of epsilon or omega.
  - source_id: PMID:11531998
    title: >-
      Escherichia coli RNA polymerase subunit omega and its N-terminal domain
      bind full-length beta' to facilitate incorporation into the alpha2beta
      subassembly.
    statement: >-
      Establishes the assembly order alpha2, then alpha2-beta, then
      alpha2-beta-beta-prime, with omega acting at the last step by binding
      intact beta-prime.
  - source_id: PMID:18289874
    title: Overproduction and purification of recombinant Bacillus subtilis RNA polymerase.
    statement: >-
      Recombinant B. subtilis RNAP lacking omega, or carrying either omega or
      epsilon, has the same activity as native enzyme, showing omega is not
      required for catalysis.
notes: >-
  Generalization. The alpha2-beta-beta-prime-omega core is conserved across
  bacteria, so the module is species-neutral and each role is grounded on a
  family with representative members from three phylogenetically distant,
  experimentally characterised bacteria: Escherichia coli K-12
  (Gammaproteobacteria, the reference for structure and assembly), Bacillus
  subtilis 168 (Firmicutes) and Pseudomonas putida KT2440 (Gammaproteobacteria,
  the original pathway exemplar). All twelve members have complete gene
  reviews that follow one cross-subunit policy (projects/PROTEIN_COMPLEX_FUNCTIONS.md):
  only beta and beta-prime carry DNA-directed RNA polymerase activity, with
  contribution semantics; alpha carries dimerization and assembly; omega
  carries core-enzyme (beta-prime) binding and assembly.

  Family grounding. Alpha has no PANTHER family in UniProt (none of the three
  alpha exemplars carries a PANTHER cross-reference), so it is grounded on
  InterPro IPR011773, present in all three records; no PANTHER family review
  can therefore apply to alpha, and the derived-QC family-review gap for
  IPR011773 is intrinsic. Beta is grounded on
  PANTHER:PTHR20856 at the family level, because UniProt assigns no subfamily
  to bacterial rpoB. Beta-prime is grounded on subfamily PTHR19376:SF54
  (bacterial beta-prime and plastid rpoC1) and omega on PTHR34476:SF1. The
  beta and beta-prime families are pan-domain (archaeal Rpo2/Rpo1, eukaryotic
  Pol I/II/III/IV/V subunits, plastid PEP and large DNA virus homologs); their
  family reviews record that divergence, and confirm that the lineage-specific
  PAINT nodes (eukaryotic Pol I/II/III complexes) do not propagate to bacteria.

  Modelling. Polymerase activity is placed on the beta/beta-prime cleft as a
  complex, with beta and beta-prime as active units, because neither subunit is
  active alone; the subunit gene reviews record contribution to GO:0003899.
  The leaf function checks therefore apply to alpha (protein dimerization) and
  omega (core enzyme binding) only.

  Boundary. Sigma factors (RpoD, RpoS, RpoH, RpoN, RpoE, FliA and ECF sigmas),
  elongation and termination factors (NusA, NusG, Rho, GreA/B, Mfd, RapA,
  DksA) and promoter-specific regulators belong to adjacent transcription
  modules. Lineage-specific accessory subunits are also outside the conserved
  core: Firmicutes RNAP carries the delta (RpoE) and epsilon (RpoY/YkzG)
  subunits, and cyanobacteria and plastids split beta-prime into rpoC1 and
  rpoC2. Cytoplasm is used as the shared location because the transcribing
  enzyme acts on the nucleoid, which lies in the bacterial cytoplasm; E. coli
  proteomics also detects a free cytosolic pool.
module:
  id: bacterial_rna_polymerase_core
  label: Bacterial DNA-directed RNA polymerase core enzyme
  module_type: PROTEIN_COMPLEX
  concepts:
    - preferred_term: eubacterial DNA-directed RNA polymerase complex
      term:
        id: GO:0000345
        label: cytosolic DNA-directed RNA polymerase complex
      description: >-
        The eubacterial alpha2-beta-beta-prime-omega RNA polymerase, which binds
        a sigma factor for promoter recognition.
    - preferred_term: DNA-templated transcription
      term:
        id: GO:0006351
        label: DNA-templated transcription
      description: >-
        Cellular process carried out by the assembled RNA polymerase together
        with promoter-recognition and regulatory factors.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          The core architecture is conserved across bacteria; exemplars come
          from Gammaproteobacteria and Firmicutes.
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
        description: >-
          Bacterial RNA polymerase transcribes the nucleoid within the
          cytoplasm.
  parts:
    - order: 1
      role: alpha dimer assembly platform
      node:
        id: rpoa_alpha_dimer_platform
        label: RpoA alpha dimer platform
        module_type: PROTEIN_COMPLEX
        description: >-
          Two alpha subunits dimerize through their N-terminal domains, the
          first step of core assembly, and recruit beta. The flexibly tethered
          alpha C-terminal domains bind UP promoter elements and many
          transcription activators.
        annotons:
          - id: rpoa_alpha_subunit
            label: "rpoA: RNA polymerase alpha subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial RNA polymerase alpha subunit (RpoA) family
                term:
                  id: InterPro:IPR011773
                  label: DNA-directed RNA polymerase, alpha subunit
                description: >-
                  No PANTHER family is assigned to bacterial rpoA in UniProt, so
                  the InterPro family is used; IPR011773 is present in the
                  UniProt record of each representative.
                representative_members:
                  - preferred_term: rpoA (E. coli K-12)
                    term:
                      id: UniProtKB:P0A7Z4
                      label: DNA-directed RNA polymerase subunit alpha
                    description: Escherichia coli K-12 rpoA (b3295).
                  - preferred_term: rpoA (B. subtilis 168)
                    term:
                      id: UniProtKB:P20429
                      label: DNA-directed RNA polymerase subunit alpha
                    description: Bacillus subtilis 168 rpoA (BSU01430).
                  - preferred_term: rpoA (P. putida KT2440)
                    term:
                      id: UniProtKB:Q88QL1
                      label: DNA-directed RNA polymerase subunit alpha
                    description: Pseudomonas putida KT2440 rpoA (PP_0479).
            function:
              preferred_term: protein dimerization activity
              term:
                id: GO:0046983
                label: protein dimerization activity
              evidence:
                - source_id: file:ECOLI/rpoA/rpoA-uniprot.txt
                  statement: >-
                    UniProt records, with experimental evidence, that alpha
                    dimerization is the first step in the sequential assembly
                    of RNA polymerase subunits.
            processes:
              - preferred_term: DNA-templated transcription
                term:
                  id: GO:0006351
                  label: DNA-templated transcription
              - preferred_term: protein-containing complex assembly
                term:
                  id: GO:0065003
                  label: protein-containing complex assembly
            role_description: >-
              Alpha subunit that dimerizes to form the scaffold for beta and
              beta-prime recruitment and, through its C-terminal domain,
              contacts promoter DNA and activators.
    - order: 2
      role: beta and beta-prime catalytic cleft
      node:
        id: rpob_rpoc_catalytic_cleft
        label: RpoB/RpoC catalytic cleft
        module_type: PROTEIN_COMPLEX
        description: >-
          Beta and beta-prime form the active-centre cleft. Beta-prime carries
          the catalytic Mg(2+) site (NADFDGD), the clamp, bridge helix, trigger
          loop and two structural Zn(2+) sites; beta contributes the RNA-DNA
          hybrid and NTP-contacting surfaces, the RNA exit-channel flap and the
          rifampicin-binding pocket. The activity belongs to the cleft as a
          whole.
        annotons:
          - id: rpob_rpoc_active_centre
            label: "rpoB/rpoC: RNA polymerase active-centre cleft"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: RNA polymerase beta/beta-prime active-centre cleft
                description: >-
                  Catalytic cleft formed by the two largest subunits within the
                  assembled core enzyme.
                active_units:
                  - id: rpob_beta_subunit
                    label: "rpoB: RNA polymerase beta subunit"
                    role: >-
                      Second-largest subunit; RNA-DNA hybrid and NTP contacts,
                      RNA exit-channel flap, rifampicin pocket.
                    stoichiometry: '1'
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: RNA polymerase second-largest subunit family (bacterial beta)
                        term:
                          id: PANTHER:PTHR20856
                          label: DNA-DIRECTED RNA POLYMERASE I SUBUNIT 2
                        description: >-
                          Pan-domain family named after a eukaryotic paralog;
                          bacterial rpoB has no PANTHER subfamily assignment
                          in UniProt, so the family is used. The divergence is
                          recorded in the PTHR20856 family review.
                        representative_members:
                          - preferred_term: rpoB (E. coli K-12)
                            term:
                              id: UniProtKB:P0A8V2
                              label: DNA-directed RNA polymerase subunit beta
                            description: Escherichia coli K-12 rpoB (b3987).
                          - preferred_term: rpoB (B. subtilis 168)
                            term:
                              id: UniProtKB:P37870
                              label: DNA-directed RNA polymerase subunit beta
                            description: Bacillus subtilis 168 rpoB (BSU01070).
                          - preferred_term: rpoB (P. putida KT2440)
                            term:
                              id: UniProtKB:Q88QP2
                              label: DNA-directed RNA polymerase subunit beta
                            description: Pseudomonas putida KT2440 rpoB (PP_0447).
                        ancestral_nodes:
                          - preferred_term: PAINT root node of the RNAP second-largest subunit family
                            term:
                              id: PANTHER:PTN000465875
                              label: PTN000465875
                            description: >-
                              PTHR20856 PAINT IBD node carrying GO:0003899 and
                              GO:0006354 at the family root; the PTHR20856
                              family review assesses it as SOUND.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  PAINT places DNA-directed RNA polymerase
                                  activity at PTN000465875 in PTHR20856.
                  - id: rpoc_beta_prime_subunit
                    label: "rpoC: RNA polymerase beta-prime subunit"
                    role: >-
                      Largest subunit; catalytic Mg(2+) site, clamp, bridge
                      helix, trigger loop and structural zinc sites.
                    stoichiometry: '1'
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial RNA polymerase beta-prime subunit subfamily
                        term:
                          id: PANTHER:PTHR19376:SF54
                          label: DNA-DIRECTED RNA POLYMERASE SUBUNIT BETA'
                        description: >-
                          Bacterial beta-prime and plastid rpoC1 subfamily of
                          the pan-domain RNAP largest-subunit family
                          PTHR19376.
                        representative_members:
                          - preferred_term: rpoC (E. coli K-12)
                            term:
                              id: UniProtKB:P0A8T7
                              label: DNA-directed RNA polymerase subunit beta'
                            description: Escherichia coli K-12 rpoC (b3988).
                          - preferred_term: rpoC (B. subtilis 168)
                            term:
                              id: UniProtKB:P37871
                              label: DNA-directed RNA polymerase subunit beta'
                            description: Bacillus subtilis 168 rpoC (BSU01080).
                          - preferred_term: rpoC (P. putida KT2440)
                            term:
                              id: UniProtKB:Q88QP1
                              label: DNA-directed RNA polymerase subunit beta'
                            description: Pseudomonas putida KT2440 rpoC (PP_0448).
                        ancestral_nodes:
                          - preferred_term: PAINT root node of the RNAP largest subunit family
                            term:
                              id: PANTHER:PTN009039432
                              label: PTN009039432
                            description: >-
                              PTHR19376 PAINT IBD node carrying GO:0003899,
                              GO:0006351 and GO:0000428 at the family root;
                              the PTHR19376 family review assesses it as SOUND.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  PAINT places DNA-directed RNA polymerase
                                  activity at PTN009039432 in PTHR19376.
            function:
              preferred_term: DNA-directed RNA polymerase activity
              term:
                id: GO:0003899
                label: DNA-directed RNA polymerase activity
              substrates:
                - preferred_term: DNA template
                - preferred_term: ribonucleoside triphosphates
              products:
                - preferred_term: RNA transcript
                - preferred_term: diphosphate
              cofactors:
                - preferred_term: magnesium ion
                  term:
                    id: GO:0000287
                    label: magnesium ion binding
              evidence:
                - source_id: file:ECOLI/rpoC/rpoC-uniprot.txt
                  statement: >-
                    UniProt records the catalysed reaction (RHEA:21248) and the
                    experimentally and structurally defined Mg(2+) site of
                    beta-prime.
                - source_id: file:ECOLI/rpoB/rpoB-uniprot.txt
                  statement: >-
                    UniProt records beta as part of the catalytic core and lists
                    beta mutations conferring resistance to rifampicin and other
                    RNA polymerase inhibitors.
            processes:
              - preferred_term: DNA-templated transcription
                term:
                  id: GO:0006351
                  label: DNA-templated transcription
              - preferred_term: DNA-templated transcription elongation
                term:
                  id: GO:0006354
                  label: DNA-templated transcription elongation
            role_description: >-
              Active-centre cleft that binds the template, the RNA-DNA hybrid
              and incoming NTPs and catalyses nucleotide addition.
    - order: 3
      role: omega assembly and stability subunit
      node:
        id: rpoz_omega_assembly_subunit
        label: RpoZ omega assembly/stability subunit
        module_type: PROTEIN_COMPLEX
        description: >-
          The omega subunit binds intact beta-prime, prevents its aggregation
          and promotes its incorporation into the alpha2-beta subassembly. It
          is not catalytic: omega-less RNAP is active, and in Firmicutes the
          epsilon subunit can take its place.
        annotons:
          - id: rpoz_omega_subunit
            label: "rpoZ: RNA polymerase omega subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial RNA polymerase omega subunit family
                term:
                  id: PANTHER:PTHR34476:SF1
                  label: DNA-DIRECTED RNA POLYMERASE SUBUNIT OMEGA
                description: >-
                  Single subfamily of the bacteria-specific omega family
                  PTHR34476.
                representative_members:
                  - preferred_term: rpoZ (E. coli K-12)
                    term:
                      id: UniProtKB:P0A800
                      label: DNA-directed RNA polymerase subunit omega
                    description: Escherichia coli K-12 rpoZ (b3649).
                  - preferred_term: rpoZ (B. subtilis 168)
                    term:
                      id: UniProtKB:O35011
                      label: DNA-directed RNA polymerase subunit omega
                    description: Bacillus subtilis 168 rpoZ/yloH (BSU15690).
                  - preferred_term: rpoZ (P. putida KT2440)
                    term:
                      id: UniProtKB:Q88C82
                      label: DNA-directed RNA polymerase subunit omega
                    description: Pseudomonas putida KT2440 rpoZ (PP_5301).
                ancestral_nodes:
                  - preferred_term: PAINT bacterial omega node
                    term:
                      id: PANTHER:PTN002157784
                      label: PTN002157784
                    description: >-
                      PTHR34476 PAINT IBD node (Bacteria) carrying GO:0001000,
                      GO:0000345 and GO:0006352, seeded by E. coli RpoZ
                      (P0A800); the PTHR34476 family review assesses it as
                      SOUND.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          PAINT places bacterial-type RNA polymerase core enzyme
                          binding at PTN002157784 in PTHR34476.
            function:
              preferred_term: bacterial-type RNA polymerase core enzyme binding
              term:
                id: GO:0001000
                label: bacterial-type RNA polymerase core enzyme binding
              evidence:
                - source_id: PMID:11531998
                  statement: >-
                    Omega binds intact beta-prime and facilitates its
                    incorporation into the alpha2-beta subassembly.
            processes:
              - preferred_term: protein-containing complex assembly
                term:
                  id: GO:0065003
                  label: protein-containing complex assembly
            role_description: >-
              Small subunit that latches beta-prime and promotes the final step
              of core assembly.
  connections:
    - source: rpoa_alpha_dimer_platform
      target: rpob_rpoc_catalytic_cleft
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The alpha dimer is the assembly platform: alpha2 binds beta, and the
        alpha2-beta subassembly then binds beta-prime.
      chaining_status: NOT_APPLICABLE
      chaining_note: Protein-complex assembly relation, not a metabolic reaction chain.
    - source: rpoz_omega_assembly_subunit
      target: rpob_rpoc_catalytic_cleft
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Omega binds beta-prime and promotes its incorporation into the
        alpha2-beta subassembly, completing the cleft.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Protein-complex assembly relation, not a metabolic reaction chain.
        PROVIDES_INPUT_FOR is the closest available connection type for omega's
        assembly role; it does not imply a consumable input.
  knowledge_gaps:
    - gap_statement: >-
        What omega contributes in vivo is unresolved. It promotes beta-prime
        assembly, yet omega-less RNAP has native activity in vitro, rpoZ
        mutants in E. coli mainly shift holoenzyme composition (towards
        sigma-38) and DNA supercoiling, and in Firmicutes the unrelated
        epsilon subunit can replace it. Whether omega's main role is folding
        and assembly of beta-prime, holoenzyme selection, or a regulatory
        interface, and how far this differs between lineages, is not known.
      gap_kind:
        - BIOLOGY
