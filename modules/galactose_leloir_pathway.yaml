id: MODULE:galactose_leloir_pathway
title: Galactose catabolism (Leloir pathway)
description: >-
  The Leloir pathway converts D-galactose to glucose 6-phosphate. A galactose
  mutarotase supplies alpha-D-galactose, galactokinase phosphorylates it to
  alpha-D-galactose 1-phosphate, and galactose-1-phosphate uridylyltransferase
  exchanges UMP with UDP-glucose to give glucose 1-phosphate and UDP-galactose.
  UDP-glucose 4-epimerase regenerates UDP-glucose from UDP-galactose, so the
  pathway is catalytic in its UDP-sugar co-substrate, and phosphoglucomutase
  converts glucose 1-phosphate to glucose 6-phosphate for glycolysis. In
  bacteria and animals the mutarotase and the epimerase are separate proteins;
  in yeasts a single bifunctional protein carries an N-terminal UDP-glucose
  4-epimerase domain and a C-terminal mutarotase domain. The pathway is
  distinct from nucleotide-sugar biosynthesis or isolated UDP-galactose
  epimerization in organisms that lack the galactokinase and uridylyltransferase
  reactions.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:YEAST-GALACT-METAB-PWY
    title: galactose degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists ALDOSE1EPIM-RXN and UDPGLUCEPIM-RXN (GAL10),
      GALACTOKIN-RXN (GAL1), GALACTURIDYLYLTRANS-RXN (GAL7) and
      PHOSPHOGLUCMUT-RXN (PGM1, PGM2). All gene assignments were retained;
      the phosphoglucomutase step was added to the module as its exit.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-GALACT-METAB-PWY
  - source_id: GO:0033499
    title: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
    statement: Module-level process for the Leloir route.
  - source_id: GO:0006012
    title: galactose metabolic process
    statement: The broader galactose-handling process the module falls under.
  - source_id: Reactome:R-HSA-70370
    title: Galactose catabolism
    statement: >-
      Step order and reaction stoichiometries of the four core reactions
      follow the human Reactome "Galactose catabolism" pathway (R-HSA-70370)
      and its member reactions (R-HSA-9931853, R-HSA-70355, R-HSA-70361,
      R-HSA-70369).
  - source_id: PMID:18779058
    title: Galactose metabolism in yeast-structure and regulation of the leloir pathway enzymes and the genes encoding them.
    statement: >-
      In most organisms, including S. cerevisiae, five enzymes convert
      galactose to glucose 6-phosphate: a galactose mutarotase, a
      galactokinase, a galactose-1-phosphate uridyltransferase, a
      UDP-galactose-4-epimerase and a phosphoglucomutase.
  - source_id: PMID:14764091
    title: UDPgalactose 4-epimerase from Saccharomyces cerevisiae. A bifunctional enzyme with aldose 1-epimerase activity.
    statement: >-
      GAL10 has an N-terminal UDP-galactose 4-epimerase domain and a
      C-terminal aldose 1-epimerase (mutarotase) domain; the purified protein
      has both activities with separate active sites.
  - source_id: PMID:8119301
    title: A family of hexosephosphate mutases in Saccharomyces cerevisiae.
    statement: >-
      PGM1 and PGM2 encode phosphoglucomutase isoenzymes; pgm1 pgm2 double
      mutants have no detectable activity and cannot grow on galactose.
  - source_id: PMID:21075050
    title: 'New insights into galactose metabolism by Schizosaccharomyces pombe: isolation and characterization of a galactose-assimilating mutant.'
    statement: >-
      S. pombe gal1, gal7 and gal10, homologs of S. cerevisiae GAL1, GAL7 and
      GAL10, lie in a silenced subtelomeric cluster; wild-type S. pombe cannot
      use galactose unless silencing is relieved or the genes are expressed
      from a vector.
  - source_id: PMID:19942659
    title: Characterization of two different types of UDP-glucose/-galactose 4-epimerase involved in galactosylation in fission yeast.
    statement: >-
      S. pombe has two UDP-glucose 4-epimerases, Uge1p (major, for
      galactosylation on glucose) and Gal10p, and Gal7p converts galactose
      1-phosphate to UDP-galactose in vivo.
  - source_id: file:human/GALM/GALM-ai-review.yaml
    title: GALM gene review (human)
    statement: >-
      The GALM step grounding (UniProtKB:Q96C23, GO:0004034 aldose 1-epimerase
      activity) matches the completed human GALM review.
  - source_id: file:human/GALK1/GALK1-ai-review.yaml
    title: GALK1 gene review (human)
    statement: >-
      The GALK1 step grounding (UniProtKB:P51570, GO:0004335 galactokinase
      activity, EC 2.7.1.6) matches the completed human GALK1 review.
  - source_id: file:human/GALT/GALT-ai-review.yaml
    title: GALT gene review (human)
    statement: >-
      The GALT step grounding (UniProtKB:P07902, GO:0008108
      UDP-glucose:hexose-1-phosphate uridylyltransferase activity, EC 2.7.7.12)
      matches the completed human GALT review.
  - source_id: file:human/GALE/GALE-ai-review.yaml
    title: GALE gene review (human)
    statement: >-
      The GALE step grounding (UniProtKB:Q14376, GO:0003978 UDP-glucose
      4-epimerase activity, EC 5.1.3.2) matches the completed human GALE review.
  - source_id: https://data.pantherdb.org/ftp/sequence_classifications/19.0/PANTHER_Sequence_Classification_files/
    title: PANTHER 19.0 sequence classifications
    statement: >-
      PANTHER's release-pinned sequence classifications place the bacterial,
      human and yeast representative members in the declared GalK, GalT, GalE
      and phosphoglucomutase PANTHER families; the yeast bifunctional GAL10
      proteins classify with GalE (PTHR43725:SF47), not with GalM.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__galactose_leloir_pathway__ppu00052-deep-research-openscientist.md
    title: PSEPK Leloir module/pathway/taxon deep research
    statement: >-
      OpenScientist research found no identifiable GalK or GalT in KT2440 and
      independently classified the focused catabolic Leloir route as
      unsatisfiable; PP_1165 remained substrate-uncertain and GalE alone did not
      establish catabolic pathway coverage.
notes: >-
  ALIGN (YeastPathways project, 2026-10): S. cerevisiae and S. pombe exemplars
  were added to every step, the phosphoglucomutase exit step (glucose
  1-phosphate to glucose 6-phosphate) was added as the fifth part because the
  YeastCyc pathway, the PomBase model and the yeast literature (PMID:18779058,
  PMID:8119301) treat it as the last Leloir enzyme, and the mutarotase step was
  given an EXACTLY_ONE architecture variant set: a standalone GalM-family
  mutarotase (bacteria, animals) versus the C-terminal mutarotase domain of the
  bifunctional yeast GAL10 protein (PMID:14764091). The fused GAL10 proteins
  classify in the GalE PANTHER subfamily, so the fused variant carries no
  PANTHER id and is grounded by its representative members; the same proteins
  are representatives of the shared epimerase step. S. cerevisiae also has two
  uncharacterized standalone GalM-family proteins (YHR210C, YNR071C) that are
  not used as exemplars. Galactokinase family membership alone does not
  establish activity: S. cerevisiae GAL3, in the same PANTHER subfamily as
  GAL1, is the galactose sensor of the GAL switch rather than the pathway
  kinase. S. pombe gal1/gal7/gal10 are silenced in wild-type cells
  (PMID:21075050); S. pombe also has a second UDP-glucose 4-epimerase, uge1,
  which serves galactosylation on glucose and which the PomBase model places in
  the Leloir pathway (PMID:19942659); it is not used as a Leloir exemplar here.
  Galactose uptake (GAL2, S. pombe ght2) and GAL4/GAL80/GAL3 regulation are
  outside the module. The previous CURATION-only knowledge gap was retired as a
  curation rather than biological gap; its content is kept here: aldose
  1-epimerase and UDP-glucose 4-epimerase families are substrate- and
  pathway-promiscuous, so a satisfiable Leloir pathway requires galactokinase
  and galactose-1-phosphate uridylyltransferase in addition to any mutarotase
  or epimerase candidate (P. putida KT2440 has only GalE and does not satisfy
  the module). The GO:0033499 label was updated to its current form
  ("beta-D-galactose ..."). GO-CAM disagreements: YeastPathways
  YEAST-GALACT-METAB-PWY places all activities in GO:0019388 galactose
  catabolic process rather than the Leloir-specific GO:0033499, but otherwise
  agrees. PomBase 6796b94c00002484 includes uge1 and the ght2 transporter and
  lacks the gal10 mutarotase activity.
