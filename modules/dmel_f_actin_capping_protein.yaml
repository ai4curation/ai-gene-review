id: MODULE:dmel_f_actin_capping_protein
title: F-actin capping protein (CapZ) in Drosophila melanogaster
description: >-
  Capping protein is an alpha/beta heterodimer that binds the barbed (plus) end of actin filaments
  with high affinity and blocks the addition and loss of actin subunits there. It limits filament
  elongation, which shapes branched actin networks and controls the length of actin structures.
  In Drosophila the alpha (cpa) and beta (cpb) subunits are each required to restrict actin
  filament growth, for example in bristle development and in the germline, and loss of either
  subunit destabilizes the other. The same heterodimer also caps the barbed end of the Arp1
  filament of dynactin.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001737
  title: 'FlyBase gene group ACPC: F-actin capping protein complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as f-actin capping protein complex
    (ACPC); this module models that group.
- source_id: GO:0008290
  title: F-actin capping protein complex
  statement: >-
    GO term grounding the module as F-actin capping protein complex.
notes: >-
  cpa and cpb are also members of the FlyBase dynactin complex group, where the heterodimer
  caps the Arp1 filament; they appear in both modules. The barbed-end capping activity belongs
  to the heterodimer as a whole, so no molecular function is assigned to the individual subunits.
  FlyBase groups realized by this module: ACPC (FBgg0001737). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_f_actin_capping_protein.yaml; none of the member genes has a gene
  review yet unless noted.
