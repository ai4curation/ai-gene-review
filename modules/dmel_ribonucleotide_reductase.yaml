id: MODULE:dmel_ribonucleotide_reductase
title: Ribonucleotide reductase in Drosophila melanogaster
description: >-
  Class I ribonucleotide reductase converts ribonucleoside diphosphates to deoxyribonucleoside
  diphosphates, the rate-limiting step in supplying dNTPs for DNA replication and repair.
  It is a complex of a large R1 subunit (RnrL), which contains the catalytic site and the
  allosteric sites that control activity and substrate specificity, and a small R2 subunit
  (RnrS), which carries the diferric-tyrosyl radical cofactor that starts catalysis. Electrons
  are supplied by thioredoxin or glutaredoxin.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002006
  title: 'FlyBase gene group RNRC: Ribonucleotide reductase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as ribonucleotide reductase complex
    (RNRC); this module models that group.
- source_id: GO:0005971
  title: ribonucleoside-diphosphate reductase complex
  statement: >-
    GO term grounding the module as ribonucleoside-diphosphate reductase complex.
notes: >-
  The reductase activity is assigned to the catalytic R1 subunit; R2 provides the tyrosyl
  radical. Thioredoxins and dNTP-pool regulators are outside the module. FlyBase groups realized
  by this module: RNRC (FBgg0002006). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_ribonucleotide_reductase.yaml; none of the member genes has a gene review
  yet unless noted.
