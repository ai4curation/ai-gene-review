id: MODULE:pseudomonad_cbr_crc_catabolite_control
title: Pseudomonad CbrA/CbrB carbon catabolite control via Crc/Hfq
description: >-
  The pseudomonad CbrA/CbrB two-component system and the post-transcriptional
  machinery it controls, which together set carbon catabolite repression and
  balance carbon against nitrogen utilization. The sensor histidine kinase CbrA
  phosphorylates the conserved receiver aspartate of CbrB, and phosphorylated
  CbrB acts as a sigma-54-dependent enhancer-binding activator of the crcZ and
  crcY small-RNA genes. Those small RNAs act as decoys for the Hfq/Crc
  translational repressor pair: when carbon is poor and crcZ/crcY levels are
  high, Hfq/Crc is sequestered away from the A-rich catabolite-activity motifs
  near the ribosome-binding sites of catabolic mRNAs, relieving translational
  repression. The module spans sensing, phosphotransfer, sigma-54-dependent
  small-RNA induction, and the translational repression step that the small RNAs
  antagonise.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the CbrA/CbrB two-component signalling relationship.
  - source_id: GO:0061985
    title: carbon catabolite repression
    statement: >-
      Grounds the module as the circuitry that sets and relieves carbon
      catabolite repression.
  - source_id: GO:0045974
    title: regulation of translation, ncRNA-mediated
    statement: >-
      Defines the small-RNA-antagonised translational repression step performed
      by Hfq with the co-repressor Crc.
  - source_id: file:PSEPK/cbrB/cbrB-ai-review.yaml
    statement: >-
      Grounds the PSEPK CbrB exemplar as the CbrA/CbrB response regulator and as
      the sigma-N-dependent activator of crcZ, crcY and further poor-carbon
      targets.
  - source_id: file:PSEPK/rpoN/rpoN-ai-review.yaml
    statement: >-
      Grounds the PSEPK sigma-54 exemplar whose holoenzyme CbrB remodels as an
      enhancer-binding protein.
  - source_id: file:PSEPK/hfq/hfq-ai-review.yaml
    statement: >-
      Grounds the PSEPK Hfq exemplar, its Crc-dependent repression of catabolic
      mRNAs bearing A-rich catabolite-activity motifs, and the antagonism of that
      repression by the CrcZ and CrcY decoy small RNAs.
notes: >-
  The module is scoped to Pseudomonas because the CbrA/CbrB-crcZ/crcY-Crc/Hfq
  arrangement is characterised in that genus. The sensor kinase CbrA has no gene
  review in this repository, so the sensor tier is modelled as an abstract
  phosphorelay-sensor-kinase role; its partner relationship is grounded through
  the CbrB review. The crcZ and crcY decoy small RNAs are central to the
  mechanism but are non-coding and therefore appear as the described input to the
  repression step rather than as protein participants. Crc is likewise described
  as the co-repressor that acts with Hfq, but is not asserted as a module member
  because it has no gene review here. Note that UniProt entry Q88DX2 carries the
  name AlgB by homology while the KT2440 literature studies this locus as CbrB;
  the gene review records that discrepancy. The wider CbrB regulon and the
  downstream catabolic pathways whose mRNAs are repressed are separate modules.
module:
  id: pseudomonad_cbr_crc_catabolite_control
  label: Pseudomonad CbrA/CbrB carbon catabolite control
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: carbon catabolite repression
      term:
        id: GO:0061985
        label: carbon catabolite repression
      description: >-
        Signal-dependent setting and relief of translational repression of
        catabolic genes.
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: CbrA/CbrB His-Asp phosphorelay
      node:
        id: cbr_phosphorelay
        label: CbrA/CbrB phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The sensor histidine kinase CbrA autophosphorylates in response to
          carbon availability and transfers phosphate directly to the conserved
          receiver aspartate of CbrB.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is absent:
                this is a simple two-component system in which the sensor kinase
                transfers phosphate directly to the response regulator.
            notes: >-
              CbrA (sensor, GO:0000155) -> CbrB (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer, with no discrete Hpt protein.
        parts:
          - order: 1
            role: CbrA sensor-kinase autophosphorylation
            node:
              id: cbra_sensor
              label: CbrA sensor histidine kinase
              module_type: REGULATORY_STEP
              annotons:
                - id: cbra_sensor_kinase
                  label: CbrA phosphorelay sensor kinase
                  participant:
                    selector_type: ANY_WITH_FUNCTION
                    required_function:
                      preferred_term: phosphorelay sensor kinase activity
                      term:
                        id: GO:0000155
                        label: phosphorelay sensor kinase activity
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  role_description: >-
                    Autophosphorylates in response to carbon availability and
                    transfers phosphate to CbrB.
          - order: 2
            role: CbrB receiver-aspartate phosphorylation
            node:
              id: cbrb_response_regulator
              label: CbrB response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: cbrb_response_regulator_activity
                  label: CbrB phosphorelay response regulator
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CbrB-type sigma-54-dependent response-regulator family
                      term:
                        id: PANTHER:PTHR32071:SF117
                        label: PTS-DEPENDENT DIHYDROXYACETONE KINASE OPERON REGULATORY PROTEIN-RELATED
                      representative_members:
                        - preferred_term: CbrB (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88DX2
                            label: Response regulator CbrB
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  role_description: >-
                    Receives phosphate on its receiver aspartate, licensing the
                    AAA+ enhancer-binding and DNA-binding modules.
        connections:
          - source: cbra_sensor
            target: cbrb_response_regulator
            connection_type: CAUSES
            description: CbrA transfers its phosphoryl group to the CbrB receiver aspartate.
    - order: 2
      role: sigma-54-dependent small-RNA induction
      node:
        id: crc_srna_induction
        label: CbrB/sigma-54 induction of crcZ and crcY
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated CbrB binds upstream enhancer DNA and remodels the
          sigma-54 holoenzyme to open the crcZ and crcY promoters, raising the
          level of the decoy small RNAs under poor-carbon conditions.
        annotons:
          - id: cbrb_transcription_activator
            label: CbrB sigma-54-dependent transcription activator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CbrB-type sigma-54-dependent response-regulator family
                term:
                  id: PANTHER:PTHR32071:SF117
                  label: PTS-DEPENDENT DIHYDROXYACETONE KINASE OPERON REGULATORY PROTEIN-RELATED
                representative_members:
                  - preferred_term: CbrB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DX2
                      label: Response regulator CbrB
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
              - preferred_term: carbon catabolite repression
                term:
                  id: GO:0061985
                  label: carbon catabolite repression
            role_description: >-
              Activates the crcZ and crcY small-RNA promoters when carbon is
              poor.
          - id: rpon_sigma_factor_cbr
            label: Sigma-54 promoter-specificity factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RNA polymerase sigma-54 factor family
                term:
                  id: PANTHER:PTHR32248:SF4
                  label: RNA POLYMERASE SIGMA-54 FACTOR
                representative_members:
                  - preferred_term: RpoN (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:P0A171
                      label: RNA polymerase sigma-54 factor
            function:
              preferred_term: sigma factor activity
              term:
                id: GO:0016987
                label: sigma factor activity
            processes:
              - preferred_term: regulation of DNA-templated transcription initiation
                term:
                  id: GO:2000142
                  label: regulation of DNA-templated transcription initiation
            role_description: >-
              Directs the holoenzyme to the -24/-12 promoters that CbrB
              activates.
    - order: 3
      role: Hfq/Crc translational repression of catabolic mRNAs
      node:
        id: hfq_crc_translational_repression
        label: Hfq/Crc translational repression
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Hfq, with the co-repressor Crc, binds A-rich catabolite-activity motifs
          near the ribosome-binding sites of catabolic mRNAs and blocks their
          translation. The CbrB-induced crcZ and crcY small RNAs act as decoys
          that sequester Hfq/Crc and relieve this repression.
        annotons:
          - id: hfq_translational_repressor
            label: Hfq RNA chaperone and translational repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hfq (Sm-like) RNA-binding protein family
                term:
                  id: PANTHER:PTHR34772:SF1
                  label: RNA-BINDING PROTEIN HFQ
                representative_members:
                  - preferred_term: Hfq (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DD3
                      label: RNA-binding protein Hfq
            function:
              preferred_term: RNA binding
              term:
                id: GO:0003723
                label: RNA binding
            processes:
              - preferred_term: regulation of translation, ncRNA-mediated
                term:
                  id: GO:0045974
                  label: regulation of translation, ncRNA-mediated
              - preferred_term: carbon catabolite repression
                term:
                  id: GO:0061985
                  label: carbon catabolite repression
            role_description: >-
              Binds catabolite-activity motifs with Crc to repress translation of
              catabolic mRNAs, and is titrated away by the decoy small RNAs.
          - id: hfq_srna_stability
            label: Hfq-dependent small-RNA stabilization
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hfq (Sm-like) RNA-binding protein family
                term:
                  id: PANTHER:PTHR34772:SF1
                  label: RNA-BINDING PROTEIN HFQ
                representative_members:
                  - preferred_term: Hfq (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DD3
                      label: RNA-binding protein Hfq
            function:
              preferred_term: RNA binding
              term:
                id: GO:0003723
                label: RNA binding
            processes:
              - preferred_term: regulation of RNA stability
                term:
                  id: GO:0043487
                  label: regulation of RNA stability
            role_description: >-
              Contributes to the stability and processing of the CrcZ small RNA,
              coupling the repressor to its own decoy.
  connections:
    - source: cbr_phosphorelay
      target: crc_srna_induction
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the CbrB receiver domain licenses its
        enhancer-binding activator output at the small-RNA promoters.
    - source: crc_srna_induction
      target: hfq_crc_translational_repression
      connection_type: NEGATIVELY_REGULATES
      description: >-
        The induced crcZ and crcY small RNAs sequester Hfq/Crc, relieving
        translational repression of catabolic mRNAs.
  knowledge_gaps:
    - gap_statement: >-
        The CbrA sensor kinase and the Crc co-repressor have no gene reviews in
        this repository.
      boundary: >-
        Model CbrA as an abstract phosphorelay-sensor-kinase role and describe
        Crc in prose as Hfq's partner, without asserting either as a grounded
        module member.
      gap_kind:
        - CURATION
    - gap_statement: >-
        The proximal carbon signal that CbrA senses is not established.
      boundary: >-
        Describe the sensor by molecular function only, without asserting a
        specific metabolite input.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The crcZ and crcY decoy small RNAs are mechanistically central but are
        non-coding, so the module has no participant slot for them.
      boundary: >-
        Represent their effect as the regulatory connection from small-RNA
        induction to the repression step, and describe them in the node
        descriptions.
      gap_kind:
        - ONTOLOGY
