id: MODULE:pseudomonad_cbr_crc_catabolite_control
title: Pseudomonadaceae CbrA/CbrB carbon catabolite control via Crc/Hfq
description: >-
  The CbrA/CbrB two-component system of the Pseudomonadaceae and the
  post-transcriptional machinery it controls, which together set carbon
  catabolite repression and balance carbon against nitrogen utilization. The
  membrane sensor histidine kinase CbrA phosphorylates the conserved receiver
  aspartate of CbrB, and CbrB acts as a sigma-54-dependent enhancer-binding
  activator of the genes for the CrcZ-family small RNAs (CrcZ, and CrcY or CrcX
  in some species). Those small RNAs act as decoys for the Hfq/Crc translational
  repressor: Hfq binds A-rich catabolite-activity motifs near the
  ribosome-binding sites of catabolic mRNAs through its distal face, and the
  catalytically inactive co-repressor Crc stabilises the repressive Hfq/RNA
  assemblies. When favoured carbon sources are scarce, CrcZ-family RNA levels
  rise, Hfq/Crc is sequestered, and translational repression of catabolic mRNAs
  is relieved. The module spans sensing, phosphotransfer, sigma-54-dependent
  small-RNA induction, and the translational repression step that the small RNAs
  antagonise.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the CbrA/CbrB two-component signalling relationship.
  - source_id: GO:0061985
    title: carbon catabolite repression
    statement: >-
      Grounds the module as the circuitry that sets and relieves carbon
      catabolite repression.
  - source_id: PMID:20080802
    statement: >-
      Establishes the CbrA-CbrB-CrcZ-Crc cascade in Pseudomonas aeruginosa,
      including the requirement for RpoN and CbrA/CbrB for crcZ expression and
      relief of catabolite repression by CrcZ.
  - source_id: PMID:28404995
    statement: >-
      Shows that the CbrA/CbrB and Crc/Hfq systems are functionally conserved
      between Azotobacter vinelandii and Pseudomonas, supporting the
      Pseudomonadaceae scope.
  - source_id: PMID:23353577
    statement: >-
      Shows RpoN- and CbrAB-dependent expression of CrcZ-family RNAs (crcZ,
      crcX) in Pseudomonas syringae pv. tomato DC3000.
  - source_id: file:PSEPK/cbrA/cbrA-ai-review.yaml
    statement: >-
      Grounds the KT2440 CbrA exemplar as the membrane sensor kinase that
      autophosphorylates on His766 and phosphorylates CbrB.
  - source_id: file:PSEPK/cbrB/cbrB-ai-review.yaml
    statement: >-
      Grounds the KT2440 CbrB exemplar as the CbrA/CbrB response regulator and as
      the sigma-N-dependent activator of crcZ, crcY and further poor-carbon
      targets.
  - source_id: file:PSEPK/rpoN/rpoN-ai-review.yaml
    statement: >-
      Grounds the KT2440 sigma-54 exemplar whose holoenzyme CbrB remodels as an
      enhancer-binding protein.
  - source_id: file:PSEPK/hfq/hfq-ai-review.yaml
    statement: >-
      Grounds the KT2440 Hfq exemplar, its recognition of A-rich
      catabolite-activity motifs, and the antagonism of Hfq/Crc repression by the
      CrcZ and CrcY decoy small RNAs.
  - source_id: file:PSEPK/crc/crc-ai-review.yaml
    statement: >-
      Grounds the KT2440 Crc exemplar as a catalytically inactive co-repressor
      that needs Hfq to engage RNA and stabilises repressive Hfq/RNA complexes.
notes: >-
  Scope. The CbrA/CbrB-CrcZ-Crc/Hfq arrangement is characterised in Pseudomonas
  putida, P. aeruginosa, P. fluorescens and P. syringae, and in Azotobacter
  vinelandii, where both systems are functionally conserved; it is absent from
  Enterobacteria, which use cAMP-CRP and PTS-based catabolite control instead.
  The module is therefore a concrete Pseudomonadaceae realisation rather than a
  pan-bacterial motif, with P. putida KT2440 proteins as exemplars (all five
  have complete gene reviews). Grounding. CbrA, both CbrB roles, the Hfq/Crc
  translational repressor step and Crc are grounded as concrete KT2440 gene
  products: the PANTHER families that classify them are much broader than the
  role (CbrA sits in a generic
  sensor-histidine-kinase family; CbrB's subfamily PTHR32071:SF117 also holds
  receiver-less NifA and XylR, so phosphorelay response-regulator activity and
  control of the CrcZ-family promoters are not subfamily properties, and
  P. putida XylR is a Pseudomonadaceae SF117 member that does not drive them;
  the Hfq translation repressor role depends on the Crc partnership, which is
  restricted to the Pseudomonadaceae, so it is not asserted for the pan-bacterial
  Hfq family; Crc sits in the catalytic exonuclease III family
  whose nuclease activity it has lost). Sigma-54 and the Hfq sRNA-stabilisation role
  are grounded to their PANTHER families, whose reviewed family-wide activities
  match the annotons. Bulk family groundings proposed elsewhere that
  add A. vinelandii NifA (P09570) to an SF117-grounded CbrB activator role and
  Desulfovibrio RpoN (Q72BK7) to the sigma-54 role were not adopted as module
  exemplars, because neither organism's protein acts in this catabolite-control
  circuit;
  both are recorded as representatives in the PTHR32071 and PTHR32248 family
  reviews instead. Phosphorelay motif. The CbrA -> CbrB step is a simple
  two-component system that conforms to MODULE:two_component_relay
  WITH_DEVIATIONS: the histidine-phosphotransfer (Hpt) tier is absent, so the
  validator's tier-count, tier-function and topology advisories for this node
  are the expected output of that declared deviation.
  Small RNAs. The CrcZ-family decoy RNAs are non-coding and appear as the
  described input to the repression step rather than as protein participants.
  Naming. UniProt entry Q88DX2 carries the name AlgB by homology while the
  KT2440 literature studies this locus as CbrB, and Q88C91 (Crc) is named
  exodeoxyribonuclease III by family rule; the gene reviews record both. The
  wider CbrB regulon and the downstream catabolic pathways whose mRNAs are
  repressed are separate modules.
module:
  id: pseudomonad_cbr_crc_catabolite_control
  label: Pseudomonadaceae CbrA/CbrB carbon catabolite control
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: carbon catabolite repression
      term:
        id: GO:0061985
        label: carbon catabolite repression
      description: >-
        Signal-dependent setting and relief of translational repression of
        catabolic genes.
  context:
    taxa:
      - preferred_term: Pseudomonadaceae
        term:
          id: NCBITaxon:135621
          label: Pseudomonadaceae
  parts:
    - order: 1
      role: CbrA/CbrB His-Asp phosphorelay
      node:
        id: cbr_phosphorelay
        label: CbrA/CbrB phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The membrane sensor histidine kinase CbrA autophosphorylates on a
          conserved histidine and transfers phosphate directly to the conserved
          receiver aspartate of CbrB, with no intervening histidine-phosphotransfer
          protein.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is absent:
                CbrA transfers phosphate directly to the CbrB receiver aspartate.
            notes: >-
              CbrA (sensor, GO:0000155) -> CbrB (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer, with no discrete Hpt protein.
        parts:
          - order: 1
            role: CbrA sensor-kinase autophosphorylation
            node:
              id: cbra_sensor
              label: CbrA sensor histidine kinase
              module_type: REGULATORY_STEP
              annotons:
                - id: cbra_sensor_kinase
                  label: CbrA phosphorelay sensor kinase
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: CbrA (Pseudomonas putida KT2440)
                      term:
                        id: UniProtKB:Q88DX3
                        label: histidine kinase
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Autophosphorylates on His766 and transfers phosphate to CbrB;
                    its N-terminal SLC5 domain also takes up L-histidine, but the
                    signal that sets kinase activity is unknown.
          - order: 2
            role: CbrB receiver-aspartate phosphorylation
            node:
              id: cbrb_response_regulator
              label: CbrB response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: cbrb_response_regulator_activity
                  label: CbrB phosphorelay response regulator
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: CbrB (Pseudomonas putida KT2440)
                      term:
                        id: UniProtKB:Q88DX2
                        label: Response regulator CbrB
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  role_description: >-
                    Receives phosphate on its receiver aspartate, licensing the
                    AAA+ enhancer-binding and DNA-binding modules.
        connections:
          - source: cbra_sensor
            target: cbrb_response_regulator
            connection_type: CAUSES
            description: CbrA transfers its phosphoryl group to the CbrB receiver aspartate.
    - order: 2
      role: sigma-54-dependent small-RNA induction
      node:
        id: crc_srna_induction
        label: CbrB/sigma-54 induction of CrcZ-family small RNAs
        module_type: BIOLOGICAL_PROCESS
        description: >-
          CbrB binds upstream enhancer DNA and remodels the sigma-54 holoenzyme
          to open the crcZ (and crcY or crcX) promoters, raising the level of the
          decoy small RNAs when favoured carbon sources are scarce.
        annotons:
          - id: cbrb_transcription_activator
            label: CbrB sigma-54-dependent transcription activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CbrB (Pseudomonas putida KT2440)
                term:
                  id: UniProtKB:Q88DX2
                  label: Response regulator CbrB
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
              - preferred_term: carbon catabolite repression
                term:
                  id: GO:0061985
                  label: carbon catabolite repression
            role_description: >-
              Activates the CrcZ-family small-RNA promoters when favoured carbon
              sources are scarce.
          - id: rpon_sigma_factor_cbr
            label: Sigma-54 promoter-specificity factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RNA polymerase sigma-54 factor family
                term:
                  id: PANTHER:PTHR32248:SF4
                  label: RNA POLYMERASE SIGMA-54 FACTOR
                representative_members:
                  - preferred_term: RpoN (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:P0A171
                      label: RNA polymerase sigma-54 factor
            function:
              preferred_term: sigma factor activity
              term:
                id: GO:0016987
                label: sigma factor activity
            processes:
              - preferred_term: regulation of DNA-templated transcription initiation
                term:
                  id: GO:2000142
                  label: regulation of DNA-templated transcription initiation
            role_description: >-
              Directs the holoenzyme to the -24/-12 promoters that CbrB
              activates.
    - order: 3
      role: Hfq/Crc translational repression of catabolic mRNAs
      node:
        id: hfq_crc_translational_repression
        label: Hfq/Crc translational repression
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Hfq binds A-rich catabolite-activity motifs near the ribosome-binding
          sites of catabolic mRNAs, and the co-repressor Crc joins Hfq to form
          stable, higher-order repressive assemblies that block translation
          initiation. The CbrB-induced CrcZ-family small RNAs carry the same
          motifs and act as decoys that sequester Hfq/Crc and relieve this
          repression.
        annotons:
          - id: hfq_translational_repressor
            label: Hfq catabolite-motif RNA binding and translational repression
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Hfq (Pseudomonas putida KT2440)
                term:
                  id: UniProtKB:Q88DD3
                  label: RNA-binding protein Hfq
            function:
              preferred_term: translation repressor activity
              term:
                id: GO:0030371
                label: translation repressor activity
            processes:
              - preferred_term: negative regulation of translation
                term:
                  id: GO:0017148
                  label: negative regulation of translation
              - preferred_term: carbon catabolite repression
                term:
                  id: GO:0061985
                  label: carbon catabolite repression
            role_description: >-
              Recognises catabolite-activity motifs through its distal face and,
              with Crc, represses translation of catabolic mRNAs; it is titrated
              away by the decoy small RNAs.
          - id: crc_corepressor
            label: Crc co-repressor of Hfq
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Crc (Pseudomonas putida KT2440)
                term:
                  id: UniProtKB:Q88C91
                  label: Exodeoxyribonuclease III
            processes:
              - preferred_term: negative regulation of translation
                term:
                  id: GO:0017148
                  label: negative regulation of translation
              - preferred_term: carbon catabolite repression
                term:
                  id: GO:0061985
                  label: carbon catabolite repression
            role_description: >-
              Catalytically inactive AP-endonuclease-fold protein that cannot
              bind RNA alone but joins Hfq on catabolite-activity motifs and
              stabilises the translationally repressive Hfq/RNA assemblies. Its
              activity is a contribution to the translation repressor activity of
              the Hfq/Crc assembly, so no standalone molecular function is
              asserted.
          - id: hfq_srna_stability
            label: Hfq-dependent small-RNA stabilization
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hfq (Sm-like) RNA-binding protein family
                term:
                  id: PANTHER:PTHR34772:SF1
                  label: RNA-BINDING PROTEIN HFQ
                representative_members:
                  - preferred_term: Hfq (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DD3
                      label: RNA-binding protein Hfq
            function:
              preferred_term: RNA binding
              term:
                id: GO:0003723
                label: RNA binding
            processes:
              - preferred_term: regulation of RNA stability
                term:
                  id: GO:0043487
                  label: regulation of RNA stability
            role_description: >-
              With Crc, increases the stability of the CrcZ small RNA and is
              required for its processed form, coupling the repressor to its own
              decoy.
  connections:
    - source: cbr_phosphorelay
      target: crc_srna_induction
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the CbrB receiver domain licenses its
        enhancer-binding activator output at the small-RNA promoters.
    - source: crc_srna_induction
      target: hfq_crc_translational_repression
      connection_type: NEGATIVELY_REGULATES
      description: >-
        The induced CrcZ-family small RNAs sequester Hfq/Crc, relieving
        translational repression of catabolic mRNAs.
  knowledge_gaps:
    - gap_statement: >-
        The proximal carbon or carbon/nitrogen signal that sets CbrA kinase
        activity is not established.
      boundary: >-
        CbrA autophosphorylates and phosphorylates CbrB, and binds and
        transports L-histidine, but L-histidine does not change its kinase
        activities in vitro. The sensor is described by molecular function only.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: PMID:32214184
          reference_section_type: RESULTS
          supporting_text: >-
            The lack of an effect of L-histidine leaves open the possibility that
            a yet to be identified intracellular metabolite is perceived by CbrA
            as a signal.
    - gap_statement: >-
        Whether the CrcZ-family RNAs relieve repression by sequestering Hfq,
        Crc, or preassembled Hfq/Crc complexes, and in what stoichiometry in
        vivo, is unresolved.
      boundary: >-
        CrcZ and CrcY carry A-rich motifs, bind Hfq/Crc in vitro, and relieve
        catabolite repression when abundant; the module represents their effect
        only as the negative connection to the repression step.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: PMID:27777366
          reference_section_type: INTRODUCTION
          supporting_text: >-
            It was thus suggested that these sRNAs counteract Hfq/Crc repression
            by sequestering one or both proteins, making them unavailable to act
            on mRNAs with A-rich motifs.
