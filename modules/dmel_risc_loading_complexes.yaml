id: MODULE:dmel_risc_loading_complexes
title: RISC-loading complexes and miRISC in Drosophila melanogaster
description: >-
  Small RNA duplexes produced by Dicer are loaded into Argonaute proteins by RISC-loading
  complexes. In Drosophila the miRNA pathway uses Dicer-1 with the dsRNA-binding partner Loquacious
  (Loqs-PB) and loads miRNAs mainly into AGO1, whereas the siRNA pathway uses Dicer-2 with
  R2D2, which senses duplex asymmetry and loads siRNAs into AGO2. FlyBase also defines an
  alternative siRNA loading complex in which Loqs (Loqs-PD isoform) partners Dicer-2 with
  AGO2. Mature miRNA-loaded AGO1 associates with the GW182 protein Gawky to form the miRNA-induced
  silencing complex (miRISC), which represses translation and promotes deadenylation and decay
  of target mRNAs.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001550
  title: 'FlyBase gene group RLC: Risc loading complexes'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as risc loading complexes (RLC);
    this module models that group.
- source_id: FB:FBgg0001801
  title: 'FlyBase gene group miRISC: Mirna-induced silencing complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as mirna-induced silencing complex
    (miRISC); this module models that group.
- source_id: GO:0070578
  title: RISC-loading complex
  statement: >-
    GO term grounding the module as RISC-loading complex.
- source_id: GO:0016442
  title: RISC complex
  statement: >-
    GO term grounding the module as RISC complex.
notes: >-
  Parts follow FlyBase groups miRLC, siRLC, aRLC and miRISC. The Loqs isoform specificity
  (Loqs-PB in the miRNA loading complex, Loqs-PD in the alternative siRNA loading complex)
  cannot be expressed at gene level here. Ribonuclease III activity is given to the Dicers
  only. Downstream effectors of miRISC (CCR4-NOT, decapping) and the piRNA pathway are outside
  this module. FlyBase groups realized by this module: RLC (FBgg0001550), miRISC (FBgg0001801).
  Subgroups folded into it: miRLC, siRLC, aRLC. Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_risc_loading_complexes.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
