id: MODULE:il1_signaling
title: IL-1 signaling pathway module
description: IL-1 alpha or mature IL-1 beta binds IL1R1, which recruits the co-receptor IL1RAP. The paired
  TIR domains recruit MYD88, which nucleates the Myddosome with IRAK4. IRAK4 phosphorylates IRAK1 or IRAK2,
  which leave the complex and engage the E3 ligase TRAF6. TRAF6 K63-linked chains activate the TAK1-TAB
  complex, which drives NF-kappaB and MAPK inflammatory outputs. TOLLIP restrains IRAK1 in resting cells.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: GO:0070498
  statement: The module is grounded in the GO process interleukin-1-mediated signaling pathway.
- source_id: file:modules/il1_signaling-deep-research-falcon.md
  title: IL-1 signaling pathway Falcon module review
  statement: Falcon/Edison module review generated 2026-06-28 is linked as supporting evidence for module
    boundaries, core mechanism, variation, constraints, and failure modes; open questions in that report
    require manual review before promotion to curated knowledge gaps.
- &id001
  source_id: file:modules/il1_signaling-deep-research-falcon.md
  statement: Deep-research summary of the core components, used as retrieval support.
  supporting_text: 'The core molecular components include: the ligands IL-1α and IL-1β; the signaling
    receptor IL-1R1; the obligatory co-receptor IL-1RAcP (IL-1R3); the adaptor MyD88; the kinases IRAK4
    and IRAK1/IRAK2; and the E3 ubiquitin ligase TRAF6'
- source_id: file:modules/il1_signaling-deep-research-falcon.md
  statement: IL-1 family receptors trace to early vertebrates (retrieval support).
  supporting_text: IL-1 family cytokines and their receptors are evolutionarily ancient, with IL-1R-like
    TIR domain-containing receptors traceable to early vertebrate evolution approximately 420–535 million
    years ago
