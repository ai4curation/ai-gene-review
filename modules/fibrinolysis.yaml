    - order: 5
      role: alpha2-antiplasmin inhibition of plasmin
      node:
        id: fibrinolysis_plasmin_inhibition
        label: Alpha2-antiplasmin inhibition of plasmin
        module_type: REGULATORY_STEP
        description: >-
          Alpha2-antiplasmin inhibits free plasmin almost instantaneously, confining
          plasmin activity to the clot where it is protected by fibrin binding.
        annotons:
          - id: serpinf2_a2ap
            label: Alpha2-antiplasmin (SERPINF2) inhibition of plasmin
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SERPINF2 (alpha-2-antiplasmin)
                term:
                  id: UniProtKB:P08697
                  label: Alpha-2-antiplasmin
            function:
              preferred_term: serine-type endopeptidase inhibitor activity
              term:
                id: GO:0004867
                label: serine-type endopeptidase inhibitor activity
              targets:
                - preferred_term: plasmin (PLG)
                  term:
                    id: UniProtKB:P00747
                    label: Plasminogen
            processes:
              - preferred_term: negative regulation of fibrinolysis
                term:
                  id: GO:0051918
                  label: negative regulation of fibrinolysis
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Acts on the effector rather than the activators, at close to the diffusion
              limit, and accounts for essentially all plasma antiplasmin activity against
              activator-induced clot lysis.
            evidence:
              - source_id: PMID:134998
                statement: >-
                  Alpha2-plasmin inhibitor was isolated as the plasma protein that blocks
                  activator-induced fibrin clot lysis.
                supporting_text: A procedure is presented for purifying a novel proteinase inhibitor in human plasma whose apparent unique biological property is to inhibit efficiently the lysis of fibrin clots induced by plasminogen activator.
              - source_id: PMID:134998
                statement: >-
                  Inhibition is near-instantaneous on plasmin, not on the activator, so it
                  acts at the effector step.
                supporting_text: Inhibition of plasmin by the inhibitor is almost instantaneous even at 0 degrees, in contrast to the slow inhibition of urokinase (plasminogen activator in urine).
    - order: 6
      role: TAFI removal of fibrin C-terminal lysines
      node:
        id: fibrinolysis_tafi_lysine_removal
        label: TAFIa (CPB2) removal of C-terminal lysines from partly degraded fibrin
        module_type: REGULATORY_STEP
        description: >-
          Thrombin bound to thrombomodulin cleaves TAFI to TAFIa, a basic
          carboxypeptidase that excises the C-terminal lysine and arginine residues
          plasmin exposes on fibrin, withdrawing fibrin's cofactor function and slowing
          lysis. The thrombin-thrombomodulin activation step itself belongs to the
          coagulation module.
        annotons:
          - id: cpb2_tafia
            label: TAFIa (CPB2) carboxypeptidase activity on fibrin
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CPB2 (TAFI)
                term:
                  id: UniProtKB:Q96IY4
                  label: Carboxypeptidase B2
            function:
              preferred_term: metallocarboxypeptidase activity
              term:
                id: GO:0004181
                label: metallocarboxypeptidase activity
              substrates:
                - preferred_term: plasmin-modified fibrin alpha chain
                  term:
                    id: UniProtKB:P02671
                    label: Fibrinogen alpha chain
                - preferred_term: plasmin-modified fibrin beta chain
                  term:
                    id: UniProtKB:P02675
                    label: Fibrinogen beta chain
                - preferred_term: plasmin-modified fibrin gamma chain
                  term:
                    id: UniProtKB:P02679
                    label: Fibrinogen gamma chain
            processes:
              - preferred_term: negative regulation of fibrinolysis
                term:
                  id: GO:0051918
                  label: negative regulation of fibrinolysis
              - preferred_term: negative regulation of plasminogen activation
                term:
                  id: GO:0010757
                  label: negative regulation of plasminogen activation
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              The only non-serpin brake in the module, and the only one that works by
              modifying the substrate rather than inhibiting an enzyme: it strips the
              lysines that make partly degraded fibrin a better cofactor.
            evidence:
              - source_id: PMID:7782309
                statement: >-
                  TAFI was purified as the thrombin-activated plasma protein that retards
                  tPA-induced clot lysis, and is a carboxypeptidase B precursor.
                supporting_text: Amino-terminal sequence analyses identified TAFI as a precursor of a plasma carboxypeptidase B (CPB).
              - source_id: PMID:7782309
                statement: Activated TAFI blocks activation of Glu-plasminogen.
                supporting_text: Activated TAFI inhibits the activation of Glu-plasminogen but does not prolong the lysis of clots formed in the presence of Lys-plasminogen.
              - source_id: PMID:9765237
                statement: >-
                  The mechanism is removal of C-terminal lysine and arginine residues from
                  fibrin, abolishing its cofactor functions.
                supporting_text: We conclude that TAFIa suppresses fibrinolysis by removing COOH-terminal lysine and arginine residues from fibrin, thereby reducing its cofactor functions in both plasminogen activation and the positive feedback conversion of Glu-plasminogen to Lys-plasminogen.
  connections:
    - source: fibrinolysis_tpa_activation
      target: fibrinolysis_plasmin_effector
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        tPA acting on fibrin-bound plasminogen generates the plasmin that degrades the
        clot.
    - source: fibrinolysis_upa_activation
      target: fibrinolysis_plasmin_effector
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Receptor-bound uPA generates plasmin at the cell surface, the second route into
        the effector step.
    - source: fibrinolysis_plasmin_effector
      target: fibrinolysis_tpa_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Plasmin-modified fibrin exposes C-terminal lysines that bind plasminogen and tPA
        kringles and raise the rate constant for activation, a positive feedback loop
        (PMID:9765237).
    - source: fibrinolysis_activator_inhibition
      target: fibrinolysis_tpa_activation
      connection_type: NEGATIVELY_REGULATES
      description: PAI-1 complexes tPA, in plasma and on fibrin, blocking activation.
    - source: fibrinolysis_activator_inhibition
      target: fibrinolysis_upa_activation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        PAI-1, PAI-2, protease nexin-1 and protein C inhibitor all inhibit uPA, the
        receptor-bound arm.
    - source: fibrinolysis_plasmin_inhibition
      target: fibrinolysis_plasmin_effector
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Alpha2-antiplasmin inactivates plasmin that escapes the clot, and in excess also
        plasmin within it.
    - source: fibrinolysis_tafi_lysine_removal
      target: fibrinolysis_tpa_activation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        TAFIa removes the C-terminal lysines on which the positive feedback into tPA-
        mediated activation depends.
    - source: fibrinolysis_tafi_lysine_removal
      target: fibrinolysis_plasmin_effector
      connection_type: NEGATIVELY_REGULATES
      description: >-
        At elevated concentrations TAFIa also directly inhibits plasmin activity within
        the clot (PMID:9765237).
