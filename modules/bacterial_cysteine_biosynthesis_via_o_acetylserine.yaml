              activity of the M. tuberculosis CysE protein was detected using Ellman''s

              reagent.'
            notes: Cached abstract directly reports the Rv2335 CysE enzyme assay. Full-text construct
              details were inaccessible; no exact tag or unreported strain equivalence is asserted.
          - source_id: PMID:18974048
            title: The CymR regulator in complex with the enzyme CysK controls cysteine metabolism in
              Bacillus subtilis.
            statement: Bacillus CysE and CysK are independently active; a physical CysE-CysK complex is
              not required for the two reactions.
            notes: Primary full text inspected via author-hosted article; normal publication cache remains
              abstract-only. Purified CysE/CysK are active separately; SPR/pulldown/two-hybrid fail to
