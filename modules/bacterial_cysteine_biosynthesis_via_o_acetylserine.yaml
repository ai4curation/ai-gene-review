                          term:
                            id: CHEBI:58340
                            label: O-acetyl-L-serine zwitterion
                        - preferred_term: hydrosulfide
                          term:
                            id: CHEBI:29919
                            label: hydrosulfide
                      products:
                        - preferred_term: L-cysteine
                          term:
                            id: CHEBI:35235
                            label: L-cysteine zwitterion
                        - preferred_term: acetate
                          term:
                            id: CHEBI:30089
                            label: acetate
                      cofactors:
                        - preferred_term: pyridoxal 5'-phosphate
                          term:
                            id: CHEBI:597326
                            label: pyridoxal 5'-phosphate(2-)
                      evidence:
                        - source_id: RHEA:14829
                          statement: O-acetylserine sulfhydrylase reaction.
                        - source_id: PANTHER:PTN008497439
                          statement: >-
                            PAINT places cysteine synthase activity at the CysM
                            node.
                    role_description: >-
                      Alternative PLP-dependent O-acetylserine sulfhydrylase
                      implementation. P. aeruginosa CysM prefers thiosulfate
                      (forming S-sulfocysteine) as well as using sulfide; GO has
                      no term for the thiosulfate reaction, so it is recorded in
                      the gene reviews as a proposed term. Substrate breadth can
                      differ among CysM-family proteins and must be assessed per
                      taxon.
  connections:
    - source: serine_o_acetylation
      target: sulfide_incorporation
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        O-acetyl-L-serine produced by serine O-acetyltransferase is the substrate
        consumed by either terminal sulfhydrylase variant.
  notes: >-
    Sulfate transport, sulfate activation, APS/PAPS reduction, and sulfite
    reduction are upstream sulfur-assimilation context, not module parts. The
    CysK and CysM alternatives are modeled separately because their PAINT nodes
    and substrate ranges differ even though both carry GO:0004124. The CysE
    family (PTHR42811) is coherent, so the family id grounds that step. The
    PLP fold-type II family PTHR10314 also contains cystathionine
    beta-synthase, threonine synthase and cysteine desulfhydrase clades, so the
    CysK and CysM variants are identified by their PAINT ancestral nodes
    (PTN000034535 and PTN008497439) and, outside PANTHER, by the InterPro
    CysK (IPR005859) and CysM (IPR005858) entries; the PANTHER subfamily
    SF194 named CYSTATHIONINE BETA-SYNTHASE holds the bacterial CysK proteins
    alongside eukaryotic CBS. The chemistry is conserved across bacteria, and
    representatives are drawn from experimentally studied E. coli K-12 and
    P. aeruginosa PAO1 proteins, with P. putida KT2440 as a further exemplar.
    Plant and fungal SAT and OAS-TL isoforms belong to the same PANTHER families
    but are outside this bacterial module.
    The CysK variant has no P. aeruginosa representative because PaCysK
    (PA2709, UniProtKB Q9I0D3) has no gene review in this corpus yet, although
    the cited P. aeruginosa studies characterise it alongside PaCysM; E. coli
    and P. putida CysK represent that variant.
