- id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas
    aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PAO1 enzyme/LC-MS and native-deletion study inspected. Supports complementary sulfide/thiosulfate
      preferences and a measured failure of endogenous CysE peptide interaction. Chemical products, not
      just donor names, determine route membership.
  findings:
  - statement: PaCysM favors thiosulfate, while PaCysK is adapted to sulfide; this is a preference rather
      than absolute exclusivity.
    supporting_text: PaCysK primarily supports sulfide‐dependent cysteine biosynthesis, whereas PaCysM
      is specialized for thiosulfate utilization, consistent with their distinct catalytic properties.
    reference_section_type: RESULTS
