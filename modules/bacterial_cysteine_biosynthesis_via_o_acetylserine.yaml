id: MODULE:bacterial_cysteine_biosynthesis_via_o_acetylserine
title: Bacterial L-cysteine biosynthesis via O-acetyl-L-serine
description: A reusable two-step bacterial pathway in which serine O-acetyltransferase (CysE) converts
  L-serine and acetyl-CoA to O-acetyl-L-serine, followed by a pyridoxal-phosphate-dependent O-acetylserine
  sulfhydrylase that incorporates sulfide to produce L-cysteine. OAS-active CysK or CysM proteins can
  implement the terminal reaction. The route is distributed across bacterial lineages, but neither the
  gene names nor broad family membership establish substrate choice. Thiosulfate incorporation produces
  S-sulfocysteine and requires a further reduction; it is adjacent chemistry rather than the direct sulfide
  route. A regulatory cysteine synthase complex forms in some lineages but is not a required pathway assembly.
  Upstream sulfide generation and distinct O-phosphoserine/sulfur-carrier pathways lie outside this module.
status: COMPLETE
scope: ABSTRACT
evidence:
- source_id: GO:0019344
  title: L-cysteine biosynthetic process
  statement: GO:0019344 grounds the module. The route-specific term GO:0006535 (L-cysteine biosynthetic
    process from L-serine) is obsolete with replaced_by GO:0019344 since at least GO release 2026-03-25
    and in every release since; a reviewed label alias in conf/oak_config.yaml had masked the obsoletion
    from validation. The O-acetylserine route is carried by the module structure rather than by the term.
- source_id: PMID:10482527
  title: Pathways of assimilative sulfur metabolism in Pseudomonas putida
  statement: Pseudomonas putida S-313 cell extracts showed substantial O-acetylserine sulfhydrylase activity,
    providing organism-level evidence that this terminal chemistry operates in P. putida.
- source_id: PMID:42278617
  title: 'Serine Acetyltransferase from Pseudomonas aeruginosa: Distinctive Features, Pleiotropic Roles,
    and Therapeutic Potential.'
  statement: Biochemical and deletion analysis identifies PA3816/Q9HXI6 as the major Pseudomonas aeruginosa
    serine acetyltransferase, grounding the first reaction in a closely related Pseudomonas species.
- source_id: PMID:41541697
  title: 'De novo cysteine biosynthesis in Pseudomonas aeruginosa: Characterization of the two main cysteine
    synthase isoforms.'
  statement: Biochemical and genetic analysis establishes CysK and CysM as partially redundant O-acetylserine
    sulfhydrylases with distinct sulfur-donor preferences in Pseudomonas aeruginosa.
- source_id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas
    aeruginosa
  statement: Direct PAO1 biochemical and genetic work supports partially redundant CysK/CysM roles and
    PaCysM thiosulfate preference. Binding assays detected no interaction of CysK with the tested endogenous
    CysE1 terminal peptide; PMID:42278617 separately found negligible reciprocal kinetic effects of the
    full-length enzymes.
- source_id: file:ECOLI/cysE/cysE-ai-review.yaml
  title: ECOLI CysE gene review
  statement: The E. coli K-12 CysE (P0A9D4) review accepts directly assayed serine O-acetyltransferase
    activity and membership of the cysteine synthase complex with CysK.
- source_id: file:ECOLI/cysK/cysK-ai-review.yaml
  title: ECOLI CysK gene review
  statement: The E. coli K-12 CysK (P0ABK5) review accepts directly assayed cysteine synthase activity
    as core and keeps L-cysteine desulfhydrase activity as a secondary, non-core activity.
- source_id: file:ECOLI/cysM/cysM-ai-review.yaml
  title: ECOLI CysM gene review
  statement: The E. coli K-12 CysM (P16703) review accepts directly assayed cysteine synthase activity
    as core.
- source_id: file:PSEAE/cysE/cysE-ai-review.yaml
  title: PSEAE CysE gene review
  statement: The P. aeruginosa PAO1 CysE (Q9HXI6) review accepts serine O-acetyltransferase activity from
    direct biochemistry and genetics and records that PaCysE does not functionally interact with CysK.
- source_id: file:PSEAE/cysM/cysM-ai-review.yaml
  title: PSEAE CysM gene review
  statement: The P. aeruginosa PAO1 CysM (Q9I526) review accepts cysteine synthase activity and proposes
    a thiosulfate-dependent S-sulfocysteine synthase activity for which GO has no term.
- source_id: file:interpro/panther/PTHR42811/PTHR42811-review.yaml
  title: PTHR42811 serine acetyltransferase family review
  statement: The PANTHER serine acetyltransferase family is functionally coherent; PAINT places serine
    O-acetyltransferase activity and cysteine biosynthesis at its family node PTN000602332 with no recorded
    loss.
- source_id: file:interpro/panther/PTHR10314/PTHR10314-review.yaml
  title: PTHR10314 cystathionine beta-synthase family review
  statement: The PANTHER PLP fold-type II family is heterogeneous (cysteine synthases, cystathionine beta-synthase,
    threonine synthase, cysteine desulfhydrase); cysteine synthase activity is placed at separate bacterial
    CysK and CysM nodes, which the module uses to distinguish its two variants.
- source_id: file:PSEPK/cysE/cysE-ai-review.yaml
  title: PSEPK CysE gene review
  statement: The exact Q88PL0 record and curated review ground serine O-acetylation in the KT2440 instance.
- source_id: file:PSEPK/cysK/cysK-ai-review.yaml
  title: PSEPK CysK gene review
  statement: The exact Q88E95 record and curated review ground the CysK sulfide route in the KT2440 instance.
- source_id: file:PSEPK/cysM/cysM-ai-review.yaml
  title: PSEPK CysM gene review
  statement: The exact Q88MC0 record and curated review ground a CysM-family alternative for the same
    sulfide-dependent reaction in KT2440.
- source_id: PMID:36148777
  title: Combatting antimicrobial resistance via the cysteine biosynthesis pathway in bacterial pathogens.
  statement: CysE forms OAS from serine and acetyl-CoA.
  supporting_text: requiring L-serine and acetyl coenzyme A (acetyl-CoA) to produce O-acetylserine (OAS).
- source_id: PMID:36148777
  title: Combatting antimicrobial resistance via the cysteine biosynthesis pathway in bacterial pathogens.
  statement: CysK incorporates sulfide into OAS.
  supporting_text: combines O-acetylserine with sulfide to produce cysteine
- source_id: PMID:38257399
  title: Challenges and Advances in the Bioproduction of L-Cysteine.
  statement: The thiosulfate route produces S-sulfocysteine before reduction to cysteine; it is not the
    two-step OAS/sulfide route.
  supporting_text: OAS and thiosulfate into S-sulfocysteine, which is reduced into L-cysteine and sulfite
    by glutaredoxin (Grx1)
- source_id: PMID:38931847
  title: Amino Acid Biosynthesis Inhibitors in Tuberculosis Drug Discovery.
  statement: M. tuberculosis CysK1 is the OAS/sulfide enzyme; other cysteine synthase names need separate
    substrate checks.
  supporting_text: CysK1, a bona fide PLP-dependent O-acetylserine sulfhydrylase encoded by the gene rv2334,
    which converts O-acetylserine and sulfide to Cys
- source_id: PMID:42278617
  title: 'Serine Acetyltransferase from Pseudomonas aeruginosa: Distinctive Features, Pleiotropic Roles,
    and Therapeutic Potential.'
  statement: PAO1 CysE and CysK do not show the measured reciprocal activity coupling expected from a
    canonical CSC.
  supporting_text: PaCysE did not measurably affect PaCysK activity, nor was its own activity significantly
    altered by PaCysK.
- source_id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas
    aeruginosa.
  statement: PaCysM favors thiosulfate, while PaCysK is adapted to sulfide; this is a preference rather
    than absolute exclusivity.
  supporting_text: PaCysK primarily supports sulfide‐dependent cysteine biosynthesis, whereas PaCysM is
    specialized for thiosulfate utilization, consistent with their distinct catalytic properties.
- source_id: PMID:41541697
  title: 'De novo cysteine biosynthesis in Pseudomonas aeruginosa: Characterization of the two main cysteine
    synthase isoforms.'
  statement: The thiosulfate branch requires an additional reduction after sulfocysteine formation.
  supporting_text: S-sulfocysteine can subsequently be converted to cysteine by the action of glutaredoxins.
- source_id: PMID:10482527
  title: Pathways of assimilative sulfur metabolism in Pseudomonas putida.
  statement: The study compares P. putida S-313 with P. aeruginosa PAO1, not KT2440.
  supporting_text: Cysteine and methionine biosynthesis was studied in Pseudomonas putida S-313 and Pseudomonas
    aeruginosa PAO1.
- source_id: PMID:18842002
  title: O-phospho-L-serine and the thiocarboxylated sulfur carrier protein CysO-COSH are substrates for
    CysM, a cysteine synthase from Mycobacterium tuberculosis.
  statement: Mtb CysM strongly favors OPS over OAS.
  supporting_text: 'specificity of CysM for its amino acid substrate is more than 500-fold greater

    for O-phospho-L-serine than for O-acetyl-L-serine'
  notes: Full primary text inspected. Measures the first half-reaction and sulfur transfer kinetics separately;
    OPS and CysO-COSH are strongly preferred. Slow OAS intermediate formation does not alone establish
    the complete OAS/free-sulfide reaction or its physiological use.
- source_id: PMID:18842002
  title: O-phospho-L-serine and the thiocarboxylated sulfur carrier protein CysO-COSH are substrates for
    CysM, a cysteine synthase from Mycobacterium tuberculosis.
  statement: CysO-bound sulfur is strongly preferred over free bisulfide.
  supporting_text: 'The specificity of CysM for this physiological sulfide

    equivalent is more than 3 orders of magnitude greater than that for bisulfide.'
  notes: Full primary text inspected. Measures the first half-reaction and sulfur transfer kinetics separately;
    OPS and CysO-COSH are strongly preferred. Slow OAS intermediate formation does not alone establish
    the complete OAS/free-sulfide reaction or its physiological use.
- source_id: PMID:16104727
  title: Reconstitution of a new cysteine biosynthetic pathway in Mycobacterium tuberculosis.
  statement: Mec+ releases free cysteine from the carrier-bound product of CysM.
  supporting_text: 'A protease, Mec+, hydrolyzes

    the CysO-cysteine adduct to release cysteine and regenerate CysO.'
  notes: Full primary pathway reconstruction inspected. Supports sulfur-carrier adduct formation and a
    separate Mec+ release step; the later 18842002 substrate-specificity study determines the preferred
    OPS carbon donor. Do not collapse the coupled carrier pathway into one OAS/free-sulfide reaction.
- source_id: PMID:38311199
  title: Multi-oligomeric and catalytically compromised serine acetyltransferase and cysteine regulatory
    complex of Mycobacterium tuberculosis.
  statement: An experimentally reported Mtb regulatory complex reduces CysE activity, differing from the
    activation reported for other organisms.
  supporting_text: 'significantly reduced in CRC state, in contrast to enhanced activity of SAT

    in CRC of other organisms.'
  notes: Cached abstract supplies direct experimental evidence for an Mtb CysE/CysK regulatory complex
    and reduced CysE activity in that state. Full-text assay constructs and exact assembly stoichiometry
    remain unavailable. This newer observation qualifies the earlier peptide-only evidence and argues
    against universal CysE activation by complex formation.
- source_id: PMID:18799456
  title: 'Cysteine synthase (CysM) of Mycobacterium tuberculosis is an O-phosphoserine sulfhydrylase:
    evidence for an alternative cysteine biosynthesis pathway in mycobacteria.'
  statement: The reported OAS/free-sulfide assay did not detect cysteine, leaving native complete-reaction
    capability unresolved rather than proving biochemical impossibility.
  notes: Full primary article inspected via author-hosted text; cached publication remains abstract-only.
    OAS/free-sulfide product was not detected in the reported assay, whereas OPS was positive. The GSH/Thr2Ala
    construct and absence of a formal detection limit prevent a universal zero-activity claim; 18842002
    independently shows slow OAS half-reaction chemistry. Exact source excerpt and scope are retained
    in genes/MYCTU/cysM/cysM-source-analysis/18799456-assay-scope.md.
- source_id: file:BACSU/cysK/cysK-source-analysis/primary-evidence.md
  statement: Direct Bacillus assay, regulatory-partner and construct checks; distinguishes independently
    active OAS enzymes from CymR-dependent transcriptional regulation.
- source_id: file:MYCTU/cysM/cysM-source-analysis/18799456-assay-scope.md
  statement: The assay and construct limits of non-detected OAS/free-sulfide cysteine formation are explicit;
    native route exclusion is not an assertion of absolute chemical impossibility.
