id: MODULE:bacterial_cysteine_biosynthesis_via_o_acetylserine
title: Bacterial L-cysteine biosynthesis via O-acetyl-L-serine
description: >-
  A reusable two-step bacterial pathway in which serine O-acetyltransferase
  (CysE) converts L-serine and acetyl-CoA to O-acetyl-L-serine, followed by a
  pyridoxal-phosphate-dependent O-acetylserine sulfhydrylase that incorporates
  sulfide to produce L-cysteine. The terminal reaction may be implemented by a
  CysK-type (cysteine synthase A) or CysM-type (cysteine synthase B) enzyme;
  many bacteria carry both, and CysM-type enzymes can also use thiosulfate to
  form S-sulfocysteine. In enterobacteria CysE and CysK associate in the
  cysteine synthase complex, an association that is not conserved in every
  lineage. Sulfide generation by assimilatory sulfate reduction or other
  sulfur-acquisition pathways supplies an input but is not part of this module.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:0019344
    title: L-cysteine biosynthetic process
    statement: >-
      GO:0019344 grounds the module. The route-specific term GO:0006535
      (L-cysteine biosynthetic process from L-serine) is obsolete with
      replaced_by GO:0019344 since at least GO release 2026-03-25 and in every
      release since; a reviewed label alias in conf/oak_config.yaml had masked
      the obsoletion from validation. The O-acetylserine route is carried by
      the module structure rather than by the term.
  - source_id: PMID:10482527
    title: Pathways of assimilative sulfur metabolism in Pseudomonas putida
    statement: >-
      Pseudomonas putida S-313 cell extracts showed substantial
      O-acetylserine sulfhydrylase activity, providing organism-level evidence
      that this terminal chemistry operates in P. putida.
  - source_id: PMID:42278617
    title: "Serine Acetyltransferase from Pseudomonas aeruginosa: Distinctive Features, Pleiotropic Roles, and Therapeutic Potential."
    statement: >-
      Biochemical and deletion analysis identifies PA3816/Q9HXI6 as the major
      Pseudomonas aeruginosa serine acetyltransferase, grounding the first
      reaction in a closely related Pseudomonas species.
  - source_id: PMID:41541697
    title: "De novo cysteine biosynthesis in Pseudomonas aeruginosa: Characterization of the two main cysteine synthase isoforms."
    statement: >-
      Biochemical and genetic analysis establishes CysK and CysM as partially
      redundant O-acetylserine sulfhydrylases with distinct sulfur-donor
      preferences in Pseudomonas aeruginosa.
  - source_id: PMID:41676964
    title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas aeruginosa
    statement: >-
      Direct biochemical and genetic work in Pseudomonas aeruginosa supports
      partially redundant CysK/CysM pathway roles, CysM thiosulfate preference,
      and absence of detectable binding between CysK and endogenous CysE1.
  - source_id: file:ECOLI/cysE/cysE-ai-review.yaml
    title: ECOLI CysE gene review
    statement: >-
      The E. coli K-12 CysE (P0A9D4) review accepts directly assayed serine
      O-acetyltransferase activity and membership of the cysteine synthase
      complex with CysK.
  - source_id: file:ECOLI/cysK/cysK-ai-review.yaml
    title: ECOLI CysK gene review
    statement: >-
      The E. coli K-12 CysK (P0ABK5) review accepts directly assayed cysteine
      synthase activity as core and keeps L-cysteine desulfhydrase activity as
      a secondary, non-core activity.
  - source_id: file:ECOLI/cysM/cysM-ai-review.yaml
    title: ECOLI CysM gene review
    statement: >-
      The E. coli K-12 CysM (P16703) review accepts directly assayed cysteine
      synthase activity as core.
  - source_id: file:PSEAE/cysE/cysE-ai-review.yaml
    title: PSEAE CysE gene review
    statement: >-
      The P. aeruginosa PAO1 CysE (Q9HXI6) review accepts serine
      O-acetyltransferase activity from direct biochemistry and genetics and
      records that PaCysE does not functionally interact with CysK.
  - source_id: file:PSEAE/cysM/cysM-ai-review.yaml
    title: PSEAE CysM gene review
    statement: >-
      The P. aeruginosa PAO1 CysM (Q9I526) review accepts cysteine synthase
      activity and proposes a thiosulfate-dependent S-sulfocysteine synthase
      activity for which GO has no term.
  - source_id: file:interpro/panther/PTHR42811/PTHR42811-review.yaml
    title: PTHR42811 serine acetyltransferase family review
    statement: >-
      The PANTHER serine acetyltransferase family is functionally coherent;
      PAINT places serine O-acetyltransferase activity and cysteine
      biosynthesis at its family node PTN000602332 with no recorded loss.
  - source_id: file:interpro/panther/PTHR10314/PTHR10314-review.yaml
    title: PTHR10314 cystathionine beta-synthase family review
    statement: >-
      The PANTHER PLP fold-type II family is heterogeneous (cysteine synthases,
      cystathionine beta-synthase, threonine synthase, cysteine desulfhydrase);
      cysteine synthase activity is placed at separate bacterial CysK and CysM
      nodes, which the module uses to distinguish its two variants.
  - source_id: file:PSEPK/cysE/cysE-ai-review.yaml
    title: PSEPK CysE gene review
    statement: >-
      The exact Q88PL0 record and curated review ground serine O-acetylation in
      the KT2440 instance.
  - source_id: file:PSEPK/cysK/cysK-ai-review.yaml
    title: PSEPK CysK gene review
    statement: >-
      The exact Q88E95 record and curated review ground the CysK sulfide route
      in the KT2440 instance.
  - source_id: file:PSEPK/cysM/cysM-ai-review.yaml
    title: PSEPK CysM gene review
    statement: >-
      The exact Q88MC0 record and curated review ground a CysM-family
      alternative for the same sulfide-dependent reaction in KT2440.
