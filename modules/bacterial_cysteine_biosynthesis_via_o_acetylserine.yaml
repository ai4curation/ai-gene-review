              Exact excerpts and Bacillus CysE clone-coordinate uncertainty are retained in genes/BACSU/cysK/cysK-source-analysis/primary-evidence.md.
        role_description: Transfers an acetyl group from acetyl-CoA to L-serine to form O-acetyl-L-serine,
          the carbon skeleton consumed by the terminal sulfhydrylation step.
