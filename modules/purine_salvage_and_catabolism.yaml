    - source: adenine_moiety_deamination
      target: pnp_step
      connection_type: PROVIDES_INPUT_FOR
      description: (Deoxy)inosine from adenosine deaminase is phosphorolysed by PNP.
    - source: adenine_moiety_deamination
      target: hprt1_step
      connection_type: PROVIDES_INPUT_FOR
      description: Hypoxanthine from adenine deaminase is salvaged to IMP by HGPRT.
    - source: pnp_step
      target: hprt1_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Hypoxanthine/guanine released by PNP can be salvaged back to IMP/GMP
        by HGPRT (the salvage-vs-catabolism branch point).
    - source: pnp_step
      target: guanine_deamination_step
      connection_type: PROVIDES_INPUT_FOR
      description: Guanine released by PNP can be deaminated to xanthine.
    - source: guanine_deamination_step
      target: xprt_step
      connection_type: PROVIDES_INPUT_FOR
      description: Xanthine is salvaged to XMP where XPRT exists.
    - source: pnp_step
      target: purine_base_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: Hypoxanthine released by PNP is oxidised to xanthine/urate by XDH where present.
    - source: guanine_deamination_step
      target: purine_base_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: Xanthine is oxidised to urate by XDH or Xan1 where present.
  knowledge_gaps:
    - gap_statement: >-
        Saccharomyces cerevisiae deaminates adenine and guanine and
        phosphorolyses inosine and guanosine, yet lacks any enzyme known to
        oxidise hypoxanthine or xanthine; the fate of purine bases that are
        not re-salvaged (for example the xanthine produced by Gud1p in
        post-diauxic cells) is not established.
      boundary: >-
        The oxidation part is optional and has no S. cerevisiae exemplar.
      gap_kind:
        - BIOLOGY
  notes: >-
    GENERALIZE from the earlier human-only module (HPRT1 P00492, APRT P07741,
    ADA P00813, PNP P00491, XDH P47989; GO terms from human GOA; Reactome
    reactions verified against the local cache), now species-neutral with
    fungal exemplars from the YeastPathways crosswalk (PWY3O-1, PWY3O-2220,
    PWY3O-743, PWY3O-285) and the PomBase model 680ad14200001682. Added parts:
    XPRT (optional; fungi and bacteria; XPT1), adenosine kinase (ADO1), an
    adenine-moiety deamination variant set (fungal/bacterial adenine
    deaminase AAH1/dea2 versus animal adenosine deaminase ADA; neither S.
    cerevisiae nor S. pombe encodes adenosine deaminase), guanine deaminase
    (GUD1/gud1/GDA) and a separate guanine PRTase annoton for HGPRT. The
    oxidation to urate is now optional with two enzyme variants (XDH and the
    fungal Xan1/XanA dioxygenase) because S. cerevisiae has neither: its
    realisation of this module is salvage-only (no S288C protein in UniProt
    carries EC 1.17.1.4, 1.17.3.2, 1.14.11.48 or 1.7.3.3; checked
    2026-10-06), whereas S. pombe oxidises xanthine with xan1 but has no
    xanthine dehydrogenase. YeastCyc corrections: APT2 is listed as an APRT in
    PWY3O-1/PWY3O-2220 but is a pseudogene without activity (PMID:9864350) and
    is not used as an exemplar; AMD1 AMP deaminase is placed in the salvage
    frames but is modelled in purine_nucleotide_interconversion; ISN1 IMP
    5'-nucleotidase (PWY3O-285) belongs to purine_nucleotide_catabolism; the
    superpathway's de novo, interconversion and RNR reactions belong to
    de_novo_purine_synthesis, purine_nucleotide_interconversion and
    dntp_de_novo_synthesis. GO-CAM disagreements: YeastPathways uses
    GO:0004422 for both the hypoxanthine and guanine HPT1 reactions (the
    guanine reaction is GO:0052657) and lists APT2 as an enabler; the PomBase
    model gives S. pombe hpt1 xanthine PRTase activity, and assigns adenine
    deaminase activity also to SPBC1683.02 (UniProt Q9P6J8, an
    uncharacterised PTHR43114:SF7 deaminase), which is not used as an
    exemplar here. PomBase also models plasma-membrane nucleobase
    transporters and urate oxidase (uro1), which are outside the enzymatic
    core (uptake; ureide catabolism). Nucleotide-level catabolism
    (5'-nucleotidases, AMP deaminase) is in purine_nucleotide_catabolism and
    purine_nucleotide_interconversion; ecto-ADA/CD26 signalling is captured
    non-core in the ADA gene review.
