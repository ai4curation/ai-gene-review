                  supporting_text: We conclude that XPT1 encodes XPRT in yeast.
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-743
                activity: gomodel:XANPRIBOSYLTRAN-RXN
                title: 'salvage pathways of guanine, xanthine and their nucleosides - imported from: Saccharomyces Genome Database'
                description: XPT1 enables GO:0000310 in cytosol.
              - model: gomodel:680ad14200001682
                activity: gomodel:680ad14200001682/680ad14200001767
                title: purine-containing compound salvage (GO:0043101)
                description: >-
                  PomBase assigns S. pombe XMP salvage (GO:0000310) to hpt1;
                  S. pombe has no XPT1-type paralog in this model.
            role_description: >-
              Returns xanthine (from guanine deamination) to the nucleotide pool
              as XMP, which GMP synthase converts to GMP. Mammals lack a
              dedicated XPRT, so the step is optional.
    - order: 4
      role: adenosine phosphorylation
      node:
        id: adenosine_kinase_step
        label: adenosine + ATP to AMP + ADP
        module_type: REACTION
        annotons:
          - id: adenosine_kinase_activity
            label: Adenosine kinase
