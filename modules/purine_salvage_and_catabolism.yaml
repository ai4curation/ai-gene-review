id: MODULE:purine_salvage_and_catabolism
title: Purine base and nucleoside salvage, with oxidation of purine bases to urate
description: >-
  The cytosolic handling of purine bases and nucleosides released by
  nucleic-acid and nucleotide turnover or taken up from outside the cell. A
  salvage arm recycles them into nucleotides, sparing costly de novo
  synthesis: phosphoribosyltransferases transfer the phosphoribosyl group of
  PRPP to adenine (adenine phosphoribosyltransferase, giving AMP), to
  hypoxanthine and guanine (hypoxanthine-guanine phosphoribosyltransferase,
  giving IMP and GMP) and, in fungi and bacteria, to xanthine (xanthine
  phosphoribosyltransferase, giving XMP); adenosine kinase phosphorylates
  adenosine to AMP. Interconverting deaminations and phosphorolysis route
  bases between these entry points: adenosine deaminase (animals) or
  adenine deaminase (fungi, bacteria) converts the adenine moiety to the
  hypoxanthine level, purine nucleoside phosphorylase releases hypoxanthine
  and guanine from inosine and guanosine, and guanine deaminase converts
  guanine to xanthine. An optional catabolic arm oxidises hypoxanthine and
  xanthine to urate, by molybdenum-dependent xanthine oxidoreductase in
  animals, plants and many bacteria, or, for xanthine, by an
  alpha-ketoglutarate-dependent xanthine dioxygenase found only in fungi.
  Some organisms lack the catabolic arm entirely: budding yeast has no
  xanthine oxidoreductase, xanthine dioxygenase or urate oxidase and only
  salvages purine bases. In humans, inherited defects define classic
  disorders: complete HPRT1 deficiency causes Lesch-Nyhan syndrome and
  partial deficiency gout/hyperuricemia; APRT deficiency causes
  2,8-dihydroxyadenine nephrolithiasis; ADA and PNP deficiencies cause
  immunodeficiency through lymphotoxic deoxynucleotide accumulation; and XDH
  deficiency causes xanthinuria type I (XDH is the target of allopurinol and
  febuxostat).
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-1
    title: salvage pathways of purines and their nucleosides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      APT1/APT2, HPT1, XPT1, AAH1, ADO1, GUD1, PNP1 and AMD1. APT2 is a
      pseudogene with no APRT activity (PMID:9864350); AMD1 AMP deaminase is
      modelled in purine_nucleotide_interconversion.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1
  - source_id: YeastPathways:PWY3O-2220
    title: salvage pathways of adenine, hypoxanthine and their nucleosides (S. cerevisiae, SGD YeastPathways)
    statement: Adenine/hypoxanthine subset of PWY3O-1 (APT1/APT2, HPT1, AAH1, ADO1, PNP1, AMD1).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-2220
  - source_id: YeastPathways:PWY3O-743
    title: salvage pathways of guanine, xanthine and their nucleosides (S. cerevisiae, SGD YeastPathways)
    statement: Guanine/xanthine subset (HPT1, GUD1, XPT1).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-743
  - source_id: YeastPathways:PWY3O-285
    title: superpathway of purine biosynthesis and salvage pathways (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Union of de novo IMP synthesis, interconversion, ribonucleotide
      reduction and salvage; also includes the IMP 5'-nucleotidase ISN1, which
      belongs to purine nucleotide catabolism.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-285
  - source_id: GO:0043101
    title: purine-containing compound salvage
    statement: Module-level process term for the salvage arm.
  - source_id: GO:0006144
    title: purine nucleobase metabolic process
    statement: >-
      Broader process term spanning salvage and the oxidative catabolic arm.
  - source_id: Reactome:R-HSA-74259
    title: Purine catabolism
    statement: >-
      Reaction stoichiometries follow the human Reactome purine salvage/catabolism
      reactions R-HSA-74215 (HPRT1), R-HSA-74213 (APRT), R-HSA-74241 (ADA),
      R-HSA-112033 (PNP) and R-HSA-74247 (XDH).
  - source_id: PMID:9864350
    title: APT1, but not APT2, codes for a functional adenine phosphoribosyltransferase in Saccharomyces cerevisiae.
    statement: APT1 encodes the functional yeast APRT; APT2 is a non-expressed, inactive duplicate (pseudogene).
  - source_id: PMID:6392474
    title: Adenine phosphoribosyltransferase mutants in Saccharomyces cerevisiae.
    statement: Genetic identification of yeast APRT mutants.
  - source_id: PMID:6355764
    title: 'Hypoxanthine: guanine phosphoribosyltransferase mutants in Saccharomyces cerevisiae.'
    statement: hpt1 mutants lacking HGPRT activity are 8-azaguanine resistant and excrete purines.
  - source_id: PMID:18245832
    title: Lethal accumulation of guanylic nucleotides in Saccharomyces cerevisiae HPT1-deregulated mutants.
    statement: Yeast HGPRT is feedback-inhibited by GMP; feedback-insensitive mutants accumulate toxic guanylic nucleotides on guanine.
  - source_id: PMID:10217799
    title: Isolation and characterization of the Saccharomyces cerevisiae XPT1 gene encoding xanthine phosphoribosyl transferase.
    statement: XPT1 encodes yeast XPRT; its disruption impairs xanthine utilisation without affecting HPRT.
  - source_id: PMID:11223943
    title: 'Role of adenosine kinase in Saccharomyces cerevisiae: identification of the ADO1 gene and study of the mutant phenotypes.'
    statement: ADO1 encodes adenosine kinase, recycling adenosine produced by the methyl cycle.
  - source_id: PMID:1577682
    title: Adenine deaminase and adenine utilization in Saccharomyces cerevisiae.
    statement: >-
      Exogenous adenine is used through either adenine deaminase (AAH) or APRT;
      exogenous adenosine cannot normally be used as a purine source.
  - source_id: PMID:11466296
    title: YLR209c encodes Saccharomyces cerevisiae purine nucleoside phosphorylase.
    statement: PNP1 acts on inosine and guanosine; pnp1 mutants excrete these nucleosides.
  - source_id: PMID:15565584
    title: GUD1 (YDL238c) encodes Saccharomyces cerevisiae guanine deaminase, an enzyme expressed during post-diauxic growth.
    statement: GUD1 encodes guanine deaminase producing xanthine and ammonia.
  - source_id: PMID:15948966
    title: 'Convergent evolution of hydroxylation mechanisms in the fungal kingdom: molybdenum cofactor-independent hydroxylation of xanthine via alpha-ketoglutarate-dependent dioxygenases.'
    statement: >-
      Fungi have, besides xanthine dehydrogenase, an alpha-ketoglutarate- and
      Fe(II)-dependent xanthine dioxygenase (A. nidulans XanA); inactivating
      the S. pombe homologue impairs xanthine use as nitrogen source.
  - source_id: PMID:23670538
    title: Nucleotide degradation and ribose salvage in yeast.
    statement: >-
      Pnp1 and the pyrimidine nucleoside hydrolase Urh1 release ribose from
      nucleosides during starvation, feeding the pentose phosphate pathway.
  - source_id: PMID:17052198
    title: 'Regulation of purine nucleotide biosynthesis: in yeast and beyond.'
    statement: Review of de novo and salvage balance of adenine and guanine nucleotide pools in yeast.
  - source_id: PMID:22419079
    title: Regulation of amino acid, nucleotide, and phosphate metabolism in Saccharomyces cerevisiae.
    statement: YeastBook review of purine salvage and its regulation.
  - source_id: file:human/HPRT1/HPRT1-ai-review.yaml
    title: HPRT1 gene review (human)
    statement: >-
      The hypoxanthine/guanine salvage step (UniProtKB:P00492, GO:0004422 + GO:0052657)
      matches the completed human HPRT1 review.
  - source_id: file:human/APRT/APRT-ai-review.yaml
    title: APRT gene review (human)
    statement: >-
      The adenine salvage step (UniProtKB:P07741, GO:0003999) matches the completed
      human APRT review.
  - source_id: file:human/ADA/ADA-ai-review.yaml
    title: ADA gene review (human)
    statement: >-
      The adenosine-deamination catabolic step (UniProtKB:P00813, GO:0004000) matches
      the completed human ADA review.
  - source_id: file:human/PNP/PNP-ai-review.yaml
    title: PNP gene review (human)
    statement: >-
      The nucleoside-phosphorolysis step (UniProtKB:P00491, GO:0004731) matches the
      completed human PNP review.
  - source_id: file:human/XDH/XDH-ai-review.yaml
    title: XDH gene review (human)
    statement: >-
      The terminal oxidation to urate (UniProtKB:P47989, GO:0004854 + GO:0004855)
      matches the completed human XDH review.
module:
  id: purine_salvage_and_catabolism
  label: Purine base and nucleoside salvage and oxidation to urate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: purine-containing compound salvage
      term:
        id: GO:0043101
        label: purine-containing compound salvage
      description: Recycling of purine bases and nucleosides into nucleotides.
    - preferred_term: purine nucleobase metabolic process
      term:
        id: GO:0006144
        label: purine nucleobase metabolic process
      description: >-
        Salvage of purine bases into nucleotides and, where present, their
        oxidation to urate.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: The salvage and catabolic enzymes are cytosolic.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-1
      title: 'salvage pathways of purines and their nucleosides - imported from: Saccharomyces Genome Database'
      description: HPT1, APT1, XPT1, AAH1, ADO1, GUD1, PNP1 and AMD1 in cytosol, part_of GO:0043101.
    - model: gomodel:YeastPathways_PWY3O-2220
      title: 'salvage pathways of adenine, hypoxanthine and their nucleosides - imported from: Saccharomyces Genome Database'
      description: Includes APT2 as an enabler of GO:0003999 although APT2 is inactive (PMID:9864350).
    - model: gomodel:YeastPathways_PWY3O-743
      title: 'salvage pathways of guanine, xanthine and their nucleosides - imported from: Saccharomyces Genome Database'
    - model: gomodel:YeastPathways_PWY3O-285
      title: 'superpathway of purine biosynthesis and salvage pathways - imported from: Saccharomyces Genome Database'
    - model: gomodel:680ad14200001682
      title: purine-containing compound salvage (GO:0043101)
      description: >-
        PomBase S. pombe model: apt1, hpt1 (hypoxanthine, guanine and xanthine
        PRTase activities), dea2 and SPBC1683.02 adenine deaminases, gud1,
        xan1 xanthine dioxygenase and uro1 urate oxidase, plus out-of-scope
        activities (ada1 AMP deaminase, gua1 IMP dehydrogenase, gua2 GMP
        synthase, ade10, isn1, npt1 nicotinate PRTase and the SPBC887.17
        nucleobase transporter).
  parts:
    - order: 1
      role: salvage of adenine
      node:
        id: aprt_step
        label: adenine + PRPP to AMP + PPi
        module_type: REACTION
        annotons:
          - id: aprt_activity
            label: Adenine phosphoribosyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Adenine phosphoribosyltransferase family (APRT/Apt)
                family_terms:
                  - id: PANTHER:PTHR32315:SF3
                    label: ADENINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: APRT (human)
                    term:
                      id: UniProtKB:P07741
                      label: Adenine phosphoribosyltransferase
                  - preferred_term: APT1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P49435
                      label: Adenine phosphoribosyltransferase 1
                    description: The functional yeast APRT (PMID:9864350).
                  - preferred_term: apt1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O42842
                      label: Adenine phosphoribosyltransferase
                    description: S. pombe SPAC23A1.03.
            function:
              preferred_term: adenine phosphoribosyltransferase activity
              term:
                id: GO:0003999
                label: adenine phosphoribosyltransferase activity
              substrates:
                - preferred_term: adenine
                - preferred_term: PRPP
              products:
                - preferred_term: AMP
                - preferred_term: diphosphate
              evidence:
                - source_id: EC:2.4.2.7
                  statement: adenine phosphoribosyltransferase
                - source_id: Reactome:R-HSA-74213
                  statement: "APRT catalyzes the conversion of adenine to AMP (human Reactome reaction)"
                - source_id: PMID:9864350
                  supporting_text: >-
                    We conclude that APT1 is the functional gene in S.
                    cerevisiae and that APT2 is a pseudogene.
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-1
                activity: gomodel:ADENPRIBOSYLTRAN-RXN
                title: 'salvage pathways of purines and their nucleosides - imported from: Saccharomyces Genome Database'
                description: APT1 enables GO:0003999 in cytosol.
              - model: gomodel:680ad14200001682
                activity: gomodel:680ad14200001682/680ad14200001699
                title: purine-containing compound salvage (GO:0043101)
                description: S. pombe apt1 enables GO:0003999, part_of AMP salvage.
            role_description: >-
              Salvages adenine to AMP. In humans, deficiency diverts adenine to
              XDH-mediated oxidation, forming insoluble 2,8-dihydroxyadenine
              (2,8-DHA nephrolithiasis).
    - order: 2
      role: salvage of hypoxanthine and guanine
      node:
        id: hprt1_step
        label: hypoxanthine/guanine + PRPP to IMP/GMP + PPi
        module_type: REACTION
        annotons:
          - id: hprt1_activity
            label: Hypoxanthine phosphoribosyltransferase (HGPRT)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hypoxanthine-guanine phosphoribosyltransferases
                family_terms:
                  - id: PANTHER:PTHR43340:SF6
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                  - id: PANTHER:PTHR43340:SF11
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                  - id: PANTHER:PTHR43340:SF1
                    label: HYPOXANTHINE PHOSPHORIBOSYLTRANSFERASE
                  - id: PANTHER:PTHR43363:SF1
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: HPRT1 (human)
                    term:
                      id: UniProtKB:P00492
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                  - preferred_term: HPT1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:Q04178
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                    description: Fungal HGPRT subfamily PTHR43363:SF1 (PMID:6355764).
                  - preferred_term: hpt1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O13917
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                    description: S. pombe SPAC23C11.13c.
                  - preferred_term: hpt (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A9M2
                      label: Hypoxanthine phosphoribosyltransferase
            function:
              preferred_term: hypoxanthine phosphoribosyltransferase activity
              term:
                id: GO:0004422
                label: hypoxanthine phosphoribosyltransferase activity
              substrates:
                - preferred_term: hypoxanthine
                - preferred_term: 5-phospho-alpha-D-ribose 1-diphosphate (PRPP)
              products:
                - preferred_term: IMP
                - preferred_term: diphosphate
              evidence:
                - source_id: EC:2.4.2.8
                  statement: hypoxanthine phosphoribosyltransferase (also guanine, GO:0052657)
                - source_id: Reactome:R-HSA-74215
                  statement: "HPRT1 catalyzes the conversion of guanine or hypoxanthine to GMP or IMP (human Reactome reaction)"
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-1
                activity: gomodel:HYPOXANPRIBOSYLTRAN-RXN
                title: 'salvage pathways of purines and their nucleosides - imported from: Saccharomyces Genome Database'
                description: HPT1 enables GO:0004422 in cytosol.
              - model: gomodel:680ad14200001682
                activity: gomodel:680ad14200001682/680ad14200001711
                title: purine-containing compound salvage (GO:0043101)
                description: S. pombe hpt1 enables GO:0004422, part_of IMP salvage.
            role_description: >-
              Salvages hypoxanthine to IMP. Complete human HPRT1 deficiency causes
              Lesch-Nyhan syndrome; partial deficiency causes gout/hyperuricemia
              (Kelley-Seegmiller).
          - id: guanine_prt_activity
            label: Guanine phosphoribosyltransferase (HGPRT)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hypoxanthine-guanine phosphoribosyltransferases
                family_terms:
                  - id: PANTHER:PTHR43340:SF6
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                  - id: PANTHER:PTHR43340:SF11
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                  - id: PANTHER:PTHR43363:SF1
                    label: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: HPRT1 (human)
                    term:
                      id: UniProtKB:P00492
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                  - preferred_term: HPT1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:Q04178
                      label: Hypoxanthine-guanine phosphoribosyltransferase
                  - preferred_term: hpt1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O13917
                      label: Hypoxanthine-guanine phosphoribosyltransferase
            function:
              preferred_term: guanine phosphoribosyltransferase activity
              term:
                id: GO:0052657
                label: guanine phosphoribosyltransferase activity
              substrates:
                - preferred_term: guanine
                - preferred_term: PRPP
              products:
                - preferred_term: GMP
                - preferred_term: diphosphate
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-743
                activity: gomodel:GUANPRIBOSYLTRAN-RXN
                title: 'salvage pathways of guanine, xanthine and their nucleosides - imported from: Saccharomyces Genome Database'
                description: HPT1 is given GO:0004422 for the guanine reaction; GO:0052657 is the specific term.
              - model: gomodel:680ad14200001682
                activity: gomodel:680ad14200001682/680ad14200001745
                title: purine-containing compound salvage (GO:0043101)
                description: S. pombe hpt1 enables GO:0052657, part_of GMP salvage.
            role_description: >-
              Salvages guanine to GMP. The yeast enzyme is feedback-inhibited by
              GMP, and deregulated mutants accumulate toxic guanylic
              nucleotides (PMID:18245832).
    - order: 3
      optional: true
      role: salvage of xanthine (fungi and bacteria)
      node:
        id: xprt_step
        label: xanthine + PRPP to XMP + PPi
        module_type: REACTION
        annotons:
          - id: xprt_activity
            label: Xanthine phosphoribosyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: xanthine phosphoribosyltransferases (fungal Xpt1 and bacterial Gpt types)
                family_terms:
                  - id: PANTHER:PTHR43363:SF4
                    label: XANTHINE PHOSPHORIBOSYLTRANSFERASE 1
                  - id: PANTHER:PTHR39563
                    label: XANTHINE PHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: XPT1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P47165
                      label: Xanthine phosphoribosyltransferase 1
                    description: PMID:10217799.
                  - preferred_term: gpt (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A9M5
                      label: Xanthine-guanine phosphoribosyltransferase
            function:
              preferred_term: xanthine phosphoribosyltransferase activity
              term:
                id: GO:0000310
                label: xanthine phosphoribosyltransferase activity
              substrates:
                - preferred_term: xanthine
                - preferred_term: PRPP
              products:
                - preferred_term: XMP
                - preferred_term: diphosphate
