    - order: 5
      role: deamination of the adenine moiety to the hypoxanthine level
      node:
        id: adenine_moiety_deamination
        label: Adenine or adenosine deamination
        module_type: REACTION
        variant_sets:
          - id: adenine_deamination_route
            label: Substrate of adenine-moiety deamination
            axis: base (adenine deaminase) versus nucleoside (adenosine deaminase)
            selection: ONE_OR_MORE
            variants:
              - id: adenine_deaminase_route
                label: Adenine deaminase (fungi, bacteria)
                module_type: REACTION
                annotons:
                  - id: adenine_deaminase_activity
                    label: Adenine deaminase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: fungal adenine deaminases (adenosine deaminase fold)
                        term:
                          id: PANTHER:PTHR43114:SF6
                          label: ADENINE DEAMINASE
                        representative_members:
                          - preferred_term: AAH1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P53909
                              label: Adenine deaminase
                            description: PMID:1577682.
                          - preferred_term: dea2 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q9P6I7
                              label: Adenine deaminase
                            description: S. pombe SPBC1198.02.
                    function:
                      preferred_term: adenine deaminase activity
                      term:
                        id: GO:0000034
                        label: adenine deaminase activity
                      substrates:
                        - preferred_term: adenine
                        - preferred_term: water
                      products:
                        - preferred_term: hypoxanthine
                        - preferred_term: ammonia
                      evidence:
                        - source_id: EC:3.5.4.2
                          statement: adenine deaminase
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-1
                        activity: gomodel:ADENINE-DEAMINASE-RXN
                        title: 'salvage pathways of purines and their nucleosides - imported from: Saccharomyces Genome Database'
                        description: AAH1 enables GO:0000034 in cytosol.
                      - model: gomodel:680ad14200001682
                        activity: gomodel:680ad14200001682/680ad14200001705
                        title: purine-containing compound salvage (GO:0043101)
                        description: S. pombe dea2 enables GO:0000034, part_of hypoxanthine salvage.
                    role_description: >-
                      Converts adenine to hypoxanthine, which HGPRT salvages to
                      IMP; with APRT this is one of the two entry routes for
                      exogenous adenine in yeast, and Aah1 also supplies
                      nitrogen (PMID:1577682).
              - id: adenosine_deaminase_route
                label: Adenosine deaminase (animals, many bacteria)
