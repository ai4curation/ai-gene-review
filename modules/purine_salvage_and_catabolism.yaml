                      id: UniProtKB:P47143
                      label: Adenosine kinase
                    description: PMID:11223943.
                  - preferred_term: ADK (human)
                    term:
                      id: UniProtKB:P55263
                      label: Adenosine kinase
            function:
              preferred_term: adenosine kinase activity
              term:
                id: GO:0004001
                label: adenosine kinase activity
              substrates:
                - preferred_term: adenosine
                - preferred_term: ATP
              products:
                - preferred_term: AMP
                - preferred_term: ADP
              evidence:
                - source_id: EC:2.7.1.20
                  statement: adenosine kinase
                - source_id: PMID:11223943
                  supporting_text: >-
                    we propose that the physiological role of adenosine kinase in
                    S. cerevisiae could primarily be to recycle adenosine produced
                    by the methyl cycle
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-1
                activity: gomodel:ADENOSINE-KINASE-RXN
                title: 'salvage pathways of purines and their nucleosides - imported from: Saccharomyces Genome Database'
                description: ADO1 enables GO:0004001 in cytosol.
            role_description: >-
              Recycles adenosine released by S-adenosylhomocysteine hydrolysis
