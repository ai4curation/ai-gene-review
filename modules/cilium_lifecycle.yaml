id: MODULE:cilium_lifecycle
title: Cilium lifecycle
description: The cilium (eukaryotic flagellum) is a microtubule-based projection of the cell surface, enclosed
  by a specialised domain of the plasma membrane, that moves cells or fluid and senses the environment.
  It is templated by a basal body, gated from the cytoplasm by the transition zone, built and maintained
  by intraflagellar transport, which carries axonemal precursors to the tip and brings turnover products
  and receptors back, and in many cells resorbed before division. Cilia go back to the last eukaryotic
  common ancestor and have been lost in several lineages. This umbrella module composes the modules for
  those stages by reference. Intraflagellar transport is required.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/intraflagellar_transport_core.yaml
  title: Intraflagellar transport core across eukaryotes
  statement: Eukaryote-wide IFT-B, IFT-A and dynein-2 rule, met in the ciliated lineages checked except
    Plasmodium, Thalassiosira and Physcomitrium, and in none of the non-ciliated ones.
- source_id: file:modules/intraflagellar_transport.yaml
  title: Intraflagellar transport
  statement: Descriptive IFT module grounded on UniProt accessions.
- source_id: file:modules/bbsome.yaml
  title: BBSome ciliary trafficking complex module
  statement: BBSome subunits grounded on UniProt accessions.
- source_id: file:modules/ciliary_transition_zone.yaml
  title: Ciliary transition zone MKS, NPHP and CEP290 modules
  statement: Transition zone modules scoped to Bilateria.
- source_id: file:modules/primary_cilium_life_cycle.yaml
  title: Primary cilium life cycle module
  statement: Human primary cilium assembly and disassembly, grounded on UniProt accessions.
notes: Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles and order slots
  follow the shared skeleton. Read as a satisfiability rule, the umbrella is satisfied when intraflagellar_transport_core
  is. That rule is met by every ciliated lineage checked in PANTHER's release-19 classification files except
  Plasmodium, Thalassiosira and the moss Physcomitrium, and by none of the non-ciliated lineages checked,
  so a pass means the genome has the required IFT-B, IFT-A and dynein-2 intermediate chain subunits, not merely that it builds cilia; the motors are optional in that rule. Plasmodium and
  Thalassiosira build flagella only in gametes. The other parts are optional because they are
  grounded on UniProt accessions or scoped to a clade (the transition-zone modules to Bilateria, primary_cilium_life_cycle
  to human). Not yet modelled as eukaryote-wide rules are the basal body and its docking,
  the transition zone, the BBSome, ciliary membrane trafficking (Arl13b, Arl3, Rab8, TULP3), the motile
  axoneme (outer and inner dynein arms, radial spokes, central pair) and cilium resorption. In PANTHER's
  files the subfamilies of the BBSome subunits miss Batrachochytrium and the moss, and some also miss
  Giardia or Nematostella, so a BBSome rule needs lineage checks first.
