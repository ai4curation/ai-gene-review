                statement: >-
                  Caspase-9 reaches this node by CARD-CARD recruitment to the apoptosome
                  and is activated by induced proximity rather than by a conformational
                  change in the CARD itself, which keeps this step a recruitment step
                  rather than an allosteric one.
                supporting_text: Through CARD-CARD interactions, C9 is recruited to the apoptosome via
