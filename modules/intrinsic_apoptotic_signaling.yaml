  - source_id: file:modules/bcl2_family_momp_control.yaml
    title: BCL2-family MOMP control module
    statement: >-
      Companion APOPTOSIS module that expands the BAX/BCL2 seed into
      pore-forming BAX/BAK effectors, pro-survival BH3-binding guardians, and
      BH3-only activator/sensitizer proteins.
  - source_id: file:modules/apoptotic_execution_phase.yaml
    title: Apoptotic execution phase module
    statement: >-
      Companion APOPTOSIS module that starts downstream of CASP9/CASP8/CASP10
      initiator output and models executioner-caspase proteolysis, IAP
      restraint, DFF/CAD DNA fragmentation, and nuclear remodeling.
references:
  - id: PMID:42819741
    title: Structural insights into human caspase-9 CARD assembly modes driven by conserved arginine
      hotspots.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Identifier and title checked against the fetched publication
        (publications/PMID_42819741.md, full text from PMC13626777). Triaged here
        from issue #3921, which routed the paper to
        modules/death_receptor_apoptotic_signaling.yaml; the subject matter is the
        CASP9/APAF-1 apoptosome, so it belongs to this intrinsic module instead.
        Relevance is MEDIUM rather than HIGH because the paper adds mechanistic
        detail to the already-modelled CASP9 and APAF1 annotons and introduces no
        new module member: the assemblies it characterizes are in vitro and their
        physiological relevance is explicitly left open by the authors.
    findings:
      - statement: >-
          CASP9 is recruited to the APAF-1 apoptosome through CARD-CARD interaction
          and activated by induced proximity, which is the mechanism this module's
          caspase_9_activation node represents.
        supporting_text: Through CARD-CARD interactions, C9 is recruited to the apoptosome via APAF-1CARD
          and activated in an induced-proximity manner
      - statement: >-
          The APAF-1-binding surface of the caspase-9 CARD is an arginine-rich patch
          (R13, R52 in the 4RHW complex) that is reused by caspase-9 CARD
          self-association interfaces, so the heterotypic apoptosome contact and
          homotypic filament/crystal contacts are not independent surfaces.
        supporting_text: >-
          Moreover, the interacting interfaces for the C9CARD and APAF-1CARD complex (PDB:
          4RHW) involves a subset of same arginine residues of C9CARD (R13 and R52)
      - statement: >-
          Isolated caspase-9 CARD is predominantly monomeric at basal conditions; the
          dimer-of-dimers assembly was captured only under high-sulfate
          crystallization, so no constitutive higher-order CASP9 CARD state is being
          asserted for the module.
        supporting_text: Under basal conditions, C9CARD is predominantly monomeric, whereas crystallization
          in high sulfate condition captured a sulfate-mediated dimer-of-dimers centered on a conserved
          arginine-rich surface.
      - statement: >-
          Charge-reversal of the arginine patch (R10E/R52E/R56E) attenuates the
          sulfate-dependent response and abolishes higher-order assembly, identifying
          the patch as the determinant of CARD self-association.
        supporting_text: To directly assess the contribution of the arginine-rich region to C9CARD assembly
          behavior, we analyzed a triple-arginine mutant (R10E/R52E/R56E), designed based on the crystallographic
          interface.
knowledge_gaps:
  - gap_statement: >-
      The BCL2-family MOMP decision is represented only by BAX and BCL2 in this
      seed module.
    boundary: >-
      Human BAX, BAK1, BCL2, BCL2L1, MCL1, BID, BCL2L11, BBC3, and PMAIP1 have
      complete reviews. Add a BCL2-family MOMP control submodule that represents
      BAX/BAK effectors, anti-apoptotic BCL2-like proteins, direct BH3-only
      activators, and sensitizers without folding execution-caspase substrates
      into the mitochondrial decision step.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: RESOLVED
    significance: >-
      Keeps upstream MOMP control separate from apoptosome assembly and prevents
      broad positive/negative apoptosis-regulation rows from being treated as
      interchangeable BCL2-family mechanisms.
    resolution: >-
      Created modules/bcl2_family_momp_control.yaml to ground this gap in the
      completed human BCL2-family reviews.
  - gap_statement: >-
      The CYCS-APAF1-CASP9 apoptosome branch is mammalian/metazoan canonical and
      should not be asserted for every opisthokont comparator.
    boundary: >-
      CYCS, APAF1, and CASP9 are the correct reviewed mammalian intrinsic
      apoptosome components; worm, fly, and fungal comparators use CED-4/Dark
      and fungal metacaspase/EndoG-like wiring rather than this exact
      cytochrome-c/APAF1/CASP9 cassette.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Prevents PAINT or module reuse from smearing the mammalian apoptosome
      boundary over clades where cytochrome c, Apaf-1-like adaptors, and
      caspases are wired differently.
    resolution: >-
      Add mammal-specific context to the apoptosome node and keep worm, fly, and
      fungal execution modules as separate variants or comparators.
  - gap_statement: >-
      Effector-caspase execution is downstream of this initiation module but is
      not yet represented in a companion module.
    boundary: >-
      CASP3, CASP6, CASP7, XIAP, DIABLO, DFFA, DFFB, ENDOG, AIFM1, and ACIN1
      were reviewed as execution/IAP/downstream dismantling genes, not as part
      of the core BCL2-MOMP-apoptosome initiation module.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: RESOLVED
    significance: >-
      The initiator-caspase step should feed execution without making nuclear
      condensation, DNA fragmentation, PARP cleavage, or apoptotic-cell-surface
      exposure look like parts of apoptosome assembly.
    resolution: >-
      Created modules/apoptotic_execution_phase.yaml to represent effector
      CASP3/CASP6/CASP7 proteolysis, IAP restraint, and downstream dismantling
      downstream of intrinsic and extrinsic initiator-caspase activation.
  - gap_statement: >-
      It is not known whether caspase-9 CARD homotypic assembly states occur in
      cells, nor whether they compete with APAF-1 CARD binding for the shared
      arginine-rich surface and thereby tune apoptosome-dependent caspase-9
      activation.
    boundary: >-
      What is established is structural: the caspase-9 CARD is a monomer at basal
      concentration, it is recruited to the apoptosome by heterotypic CARD-CARD
      contact with APAF-1 and activated by induced proximity, and the arginine
      patch used in the APAF-1-bound complex (4RHW) overlaps the patch used in the
      caspase-9 CARD filament (9S6F) and in the isolated-domain crystal contacts
      (9R44). Charge reversal of that patch (R10E/R52E/R56E) abolishes higher-order
      assembly in vitro. What is not established is whether any homotypic state is
      populated in a cell, and therefore whether surface sharing is a regulatory
      mechanism or only a crystallographic and in vitro coincidence.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The module currently models caspase-9 activation as apoptosome recruitment
      only. If homotypic caspase-9 CARD assembly is populated in cells on the same
      surface, it would be either an additional activation route (as CARD/DED
      filaments are for caspase-1 and caspase-8) or a competitive brake on
      apoptosome loading, and either reading would change the wiring at this node
      rather than merely annotate it.
    resolution: >-
      Cell-based experiments are required, not curation: test whether endogenous
      caspase-9 CARD assemblies exist at physiological concentration (for example
      by imaging or crosslinking in intact cells), and whether the triple-arginine
      charge-reversal mutant separates apoptosome recruitment from self-association
      in a caspase-9 activation assay. Until then the module keeps the single
      apoptosome-recruitment route and cites this paper as structural support only.
    provenance:
      - reference_id: PMID:42819741
        supporting_text: the physiological relevance of the observed assemblies remain unclear and is
          not investigated in the present study
        reference_section_type: INTRODUCTION
      - reference_id: PMID:42819741
        supporting_text: The assembly states described here are characterized under in vitro conditions,
          and their physiological relevance remains to be established.
        reference_section_type: DISCUSSION
notes: >-
  Curated compact signaling-pathway module generated from verified UniProt exemplar accessions and local
  PAINT IBD rows. PTN anchors are included only when the exemplar accession appears in an IBD seed row
  in interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar accessions.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level support. Automatically
  extracted open-question headings were intentionally not retained as knowledge_gap entries because they
  were not manually curated. Machine-generated Falcon citations remain curation support and are not manually
  adjudicated here. Manual APOPTOSIS audit (2026-09-30): the BCL2/MOMP,
  CYCS/APAF1/CASP9, and downstream execution boundaries were checked against
  completed human, mouse, worm, fly, and fungal apoptosis reviews. This module
  remains a valid intrinsic-signaling seed. The BCL2-family and execution-phase
  handoff now have companion draft modules; this seed should stay draft until
  mammalian apoptosome scoping is modeled explicitly.
  Litscan triage (2026-10-26, issue #3921): PMID:42819741 (caspase-9 CARD
  assembly modes) was routed by litscan to
  modules/death_receptor_apoptotic_signaling.yaml, but caspase-9 and APAF-1 are
  intrinsic-pathway components and are not parts of the FAS/FADD/CASP8
  death-receptor module, so the paper was re-filed here. It adds no new module
  member: CASP9 and APAF1 are already annotons at apoptosome_assembly and
  caspase_9_activation. It is retained as structural evidence for those two
  annotons plus one BIOLOGY knowledge gap about whether homotypic caspase-9 CARD
  assembly is populated in cells on the same arginine surface the apoptosome
  uses. The in vitro higher-order assemblies (sulfate-mediated dimer-of-dimers,
  filaments, droplets) were deliberately NOT modeled as module states, because
  the authors state their physiological relevance is untested.
