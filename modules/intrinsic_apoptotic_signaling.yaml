              - source_id: PMID:42819741
                title: Structural insights into human caspase-9 CARD assembly modes driven by conserved
                  arginine hotspots.
                statement: >-
                  The CARD fold is unchanged between the isolated, filament-associated and
                  APAF-1-bound states (RMSD 0.54-0.68 A), so apoptosome loading does not
                  require remodeling of the recruited monomer.
                supporting_text: This structural conservation indicates that C9CARD retains a highly similar
                  fold across different assembly states, suggesting that self-association occurs without
                  major conformational rearrangements of the monomer.
