id: MODULE:intrinsic_apoptotic_signaling
title: Intrinsic apoptotic signaling pathway module
description: Cell-intrinsic stress signals regulate BCL2-family mitochondrial permeabilization, 
  cytochrome c release, apoptosome assembly, and initiator caspase-9 activation.
status: DRAFT
evidence:
  - source_id: file:modules/intrinsic_apoptotic_signaling-deep-research-falcon.md
    title: Intrinsic apoptotic signaling pathway Falcon module review
    statement: >-
      Falcon/Edison module review generated 2026-06-28 is linked as supporting evidence for module boundaries,
      core mechanism, variation, constraints, and failure modes; open questions in that report require
      manual review before promotion to curated knowledge gaps.
  - source_id: GO:0097193
    title: intrinsic apoptotic signaling pathway
    statement: The module is grounded in the GO biological process term for intrinsic apoptotic 
      signaling pathway.
  - source_id: PANTHER:PTN000047947
    title: PAINT node PTN000047947 for CASP9
    statement: Local PAINT IBD node in PTHR10454 with propagated terms C:GO:0005737, F:GO:0004197, 
      P:GO:0006915; PAINT date 20260528.
  - source_id: PANTHER:PTN000238899
    title: PAINT node PTN000238899 for CYCS
    statement: Local PAINT IBD node in PTHR11961 with propagated terms C:GO:0005758; PAINT date 
      20170228.
  - source_id: PANTHER:PTN008306143
    title: PAINT node PTN008306143 for CASP9
    statement: Local PAINT IBD node in PTHR10454 with propagated terms C:GO:0005829; PAINT date 
      20260528.
  - source_id: file:modules/bcl2_family_momp_control.yaml
    title: BCL2-family MOMP control module
    statement: >-
      Companion APOPTOSIS module that expands the BAX/BCL2 seed into
      pore-forming BAX/BAK effectors, pro-survival BH3-binding guardians, and
      BH3-only activator/sensitizer proteins.
  - source_id: file:modules/apoptotic_execution_phase.yaml
    title: Apoptotic execution phase module
    statement: >-
      Companion APOPTOSIS module that starts downstream of CASP9/CASP8/CASP10
      initiator output and models executioner-caspase proteolysis, IAP
      restraint, DFF/CAD DNA fragmentation, and nuclear remodeling.
knowledge_gaps:
  - gap_statement: >-
      The BCL2-family MOMP decision is represented only by BAX and BCL2 in this
      seed module.
    boundary: >-
      Human BAX, BAK1, BCL2, BCL2L1, MCL1, BID, BCL2L11, BBC3, and PMAIP1 have
      complete reviews. Add a BCL2-family MOMP control submodule that represents
      BAX/BAK effectors, anti-apoptotic BCL2-like proteins, direct BH3-only
      activators, and sensitizers without folding execution-caspase substrates
      into the mitochondrial decision step.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: RESOLVED
    significance: >-
      Keeps upstream MOMP control separate from apoptosome assembly and prevents
      broad positive/negative apoptosis-regulation rows from being treated as
      interchangeable BCL2-family mechanisms.
    resolution: >-
      Created modules/bcl2_family_momp_control.yaml to ground this gap in the
      completed human BCL2-family reviews.
  - gap_statement: >-
      The CYCS-APAF1-CASP9 apoptosome branch is mammalian/metazoan canonical and
      should not be asserted for every opisthokont comparator.
    boundary: >-
      CYCS, APAF1, and CASP9 are the correct reviewed mammalian intrinsic
      apoptosome components; worm, fly, and fungal comparators use CED-4/Dark
      and fungal metacaspase/EndoG-like wiring rather than this exact
      cytochrome-c/APAF1/CASP9 cassette.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Prevents PAINT or module reuse from smearing the mammalian apoptosome
      boundary over clades where cytochrome c, Apaf-1-like adaptors, and
      caspases are wired differently.
    resolution: >-
      Add mammal-specific context to the apoptosome node and keep worm, fly, and
      fungal execution modules as separate variants or comparators.
  - gap_statement: >-
      Effector-caspase execution is downstream of this initiation module but is
      not yet represented in a companion module.
    boundary: >-
      CASP3, CASP6, CASP7, XIAP, DIABLO, DFFA, DFFB, ENDOG, AIFM1, and ACIN1
      were reviewed as execution/IAP/downstream dismantling genes, not as part
      of the core BCL2-MOMP-apoptosome initiation module.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: RESOLVED
    significance: >-
      The initiator-caspase step should feed execution without making nuclear
      condensation, DNA fragmentation, PARP cleavage, or apoptotic-cell-surface
      exposure look like parts of apoptosome assembly.
    resolution: >-
      Created modules/apoptotic_execution_phase.yaml to represent effector
      CASP3/CASP6/CASP7 proteolysis, IAP restraint, and downstream dismantling
      downstream of intrinsic and extrinsic initiator-caspase activation.
notes: >-
  Curated compact signaling-pathway module generated from verified UniProt exemplar accessions and local
  PAINT IBD rows. PTN anchors are included only when the exemplar accession appears in an IBD seed row
  in interpro/panther; roles without local PAINT seeds remain grounded by verified UniProt exemplar accessions.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level support. Automatically
  extracted open-question headings were intentionally not retained as knowledge_gap entries because they
  were not manually curated. Machine-generated Falcon citations remain curation support and are not manually
  adjudicated here. Manual APOPTOSIS audit (2026-09-30): the BCL2/MOMP,
  CYCS/APAF1/CASP9, and downstream execution boundaries were checked against
  completed human, mouse, worm, fly, and fungal apoptosis reviews. This module
  remains a valid intrinsic-signaling seed. The BCL2-family and execution-phase
  handoff now have companion draft modules; this seed should stay draft until
  mammalian apoptosome scoping is modeled explicitly.
