id: MODULE:dmel_er_membrane_protein_complex
title: ER membrane protein complex (EMC) in Drosophila melanogaster
description: >-
  The ER membrane protein complex (EMC) is a multisubunit membrane protein insertase in the
  endoplasmic reticulum. It inserts tail-anchored proteins with moderately hydrophobic transmembrane
  segments and the first transmembrane segment of many multipass membrane proteins in the
  N-terminus out orientation, and it supports biogenesis of other multipass proteins. The
  conserved hydrophilic vestibule formed by EMC3 and EMC6 in the membrane carries out insertion,
  while the cytosolic EMC2 and EMC8/9 and the large lumenal EMC1, EMC7 and EMC10 subunits
  shape the complex. In Drosophila the EMC is required in photoreceptors for the biogenesis
  of rhodopsin and other multipass membrane proteins. Drosophila has two EMC2 paralogs, EMC2A
  and EMC2B, which FlyBase treats as alternative subunits.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001811
  title: 'FlyBase gene group EMPC: Er membrane protein complexes'
  statement: >-
    FlyBase release FB2026_03 groups 10 D. melanogaster genes as er membrane protein complexes
    (EMPC); this module models that group.
- source_id: GO:0072546
  title: EMC complex
  statement: >-
    GO term grounding the module as EMC complex.
notes: >-
  Decomposition. The subunits shared by both FlyBase variants form one part; EMC2A and EMC2B
  are alternatives. The insertase activity is assigned to EMC3, the core subunit of the insertion
  vestibule; EMC6 contributes to the same site. FlyBase groups realized by this module: EMPC
  (FBgg0001811). Subgroups folded into it: EMC, EMC2B. Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_er_membrane_protein_complex.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
