id: MODULE:chemokine_signaling
title: Chemokine-mediated signaling pathway module
description: >-
  Secreted chemokines (exemplified by the ELR-positive CXC chemokine CXCL8/IL-8) bind glycosaminoglycans
  in the extracellular region and engage seven-transmembrane Gi-coupled chemokine receptors (such as
  CXCR1/CXCR2 for CXCL8 and CCR5 for CC chemokines) at the leukocyte plasma membrane. Agonist binding
  initiates the chemokine-mediated signaling pathway (GO:0070098) and the specific
  interleukin-8-mediated signaling pathway (GO:0038112), promoting heterotrimeric Gi nucleotide
  exchange and Gbetagamma/Galpha_i signaling through PI3Kgamma (PIK3CG), phospholipase C beta
  calcium mobilization, and RhoA-dependent actomyosin remodeling to direct leukocyte chemotaxis
  (GO:0060326) and neutrophil chemotaxis (GO:0030593).
status: DRAFT
evidence:
  - source_id: file:modules/chemokine_signaling-deep-research-falcon.md
    title: Chemokine-mediated signaling pathway Falcon module review
    statement: >-
      Falcon/Edison module review generated 2026-06-28 is linked as supporting evidence for module boundaries,
      core mechanism, variation, constraints, and failure modes; open questions in that report require
      manual review before promotion to curated knowledge gaps.
  - source_id: GO:0070098
    title: chemokine-mediated signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for chemokine-mediated signaling
      pathway (GO:0070098) and its ligand-specific child term interleukin-8-mediated signaling
      pathway (GO:0038112).
  - source_id: GO:0038112
    title: interleukin-8-mediated signaling pathway
    statement: >-
      Specific child pathway initiated by CXCL8 (interleukin-8) binding to CXCR1 and CXCR2 on
      neutrophils and other target cells.
  - source_id: PMID:1840701
    title: Structure and functional expression of a human interleukin-8 receptor.
    supporting_text: >-
      Mammalian cells transfected with the IL-8 receptor cDNA clone bind IL-8 with high affinity
      and respond specifically to IL-8 by transiently mobilizing calcium.
    statement: >-
      Establishes high-affinity CXCL8 binding to cloned human CXCR1 and downstream calcium
      mobilization.
  - source_id: PMID:32610344
    title: Structural basis of CXC chemokine receptor 2 activation and signalling.
    supporting_text: >-
      Here we present the cryo-electron microscopy structures of interleukin-8 (IL-8, also known as
      CXCL8)-activated human CXC chemokine receptor 2 (CXCR2) in complex with Gi protein, along
      with a crystal structure of CXCR2 bound to a designed allosteric antagonist.
    statement: >-
      Resolves the active ternary signaling complex of CXCL8, CXCR2, and heterotrimeric Gi.
  - source_id: PMID:37433790
    title: Structural basis of CXC chemokine receptor 1 ligand binding and activation.
    supporting_text: >-
      Here, we solve the structure of CXCR1 complexed with CXCL8 and cognate G-proteins using
      cryo-EM, showing the detailed interactions between the receptor, the chemokine and Gαi
      protein.
    statement: >-
      Resolves the cryo-EM structure of the active CXCL8-CXCR1-Gi signaling complex.
