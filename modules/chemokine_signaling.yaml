notes: >-
  Curated signaling-pathway module upgraded from GENE_PRODUCT exemplars to PANTHER FAMILY/subfamily
  selectors with explicit molecular functions, biological processes, cellular locations, and
  PAINT/experimental evidence across all participants. The CXCL8-CXCR2 arm models the specific
  interleukin-8-mediated signaling pathway (GO:0038112) and neutrophil chemotaxis (GO:0030593)
  within the general chemokine-mediated signaling pathway (GO:0070098). Retained Falcon
  deep-research citations in references are machine-generated and have not been manually
  adjudicated against primary literature.
