id: MODULE:t_type_calcium_channels
title: T-type (low-voltage-activated) calcium channels — CaV3.1 (CACNA1G), CaV3.2 (CACNA1H) and CaV3.3 (CACNA1I) pore-forming alpha1 subunits mediating calcium entry across the plasma membrane near the resting potential (human)
description: >-
  T-type calcium channels are the low-voltage-activated (LVA) members of the voltage-gated
  calcium channel family. They open with small depolarisations from near the resting
  membrane potential, inactivate rapidly and deactivate slowly, and have a small single-
  channel conductance, so their currents are transient and tiny. Each channel is a single
  alpha1 protein of four homologous repeats that carries both the voltage sensors and the
  calcium-selective pore; unlike the high-voltage-activated CaV1 and CaV2 channels, the CaV3
  channels form functional channels without obligatory beta or alpha2delta subunits. Humans
  have three paralogues: CaV3.1 (CACNA1G), highly expressed in brain, notably thalamus and
  cerebellum, and in cardiac nodal tissue; CaV3.2 (CACNA1H), in brain, heart, adrenal gland,
  kidney and sensory neurons; and CaV3.3 (CACNA1I), mainly in brain, with slower kinetics.
  Calcium entering through T-type channels depolarises cells toward threshold and supports
  pacemaking, low-threshold calcium spikes and rhythmic or burst firing, and it also feeds
  calcium signalling in secretory and smooth muscle cells. Overlap of their activation and
  inactivation ranges gives a steady window current near rest.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes the voltage-operated calcium channels and their division
      into subfamilies by current type. This module models the low-voltage-activated CaV3
      (T-type) channels; the high-voltage-activated CaV1 and CaV2 channels are the sibling
      module high_voltage_activated_calcium_channels. Human genes in scope from RGD's list:
      CACNA1G CACNA1H CACNA1I. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text divides the voltage-operated channels by current type.
    supporting_text: >-
      The alpha subunits differ by the type of Ca2+ currents and can be subdivided into
      three subfamilies of which the L-type channels are better characterized.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings.
      Too broad for this module, whose concept is its descendant GO:0090676 calcium ion
      transmembrane transport via low voltage-gated calcium channel (is_a GO:0070588 is_a
      GO:0006816), checked in go-basic 2026-07-26.
  - source_id: GO:0090676
    title: calcium ion transmembrane transport via low voltage-gated calcium channel
    statement: >-
      Module concept and the process on each annoton. No human T-type channel has a GOA row
      for it; authored from their experimental low voltage-gated channel activity and GOA
      process rows GO:0070588 (IDA, CACNA1G) and GO:0070509 calcium ion import (IDA, CACNA1G,
      CACNA1H).
  - source_id: PMID:21746798
    title: Voltage-gated calcium channels.
    statement: Review cited by RGD for PW:0001139 (RGD:7204688); roles of the CaV3 subfamily.
    supporting_text: >-
      The Ca(V)3 subfamily is important for repetitive firing of action potentials in
      rhythmically firing cells such as cardiac myocytes and thalamic neurons.
  - source_id: PMID:9495342
    title: Molecular characterization of a neuronal low-voltage-activated T-type calcium channel.
    statement: >-
      Cloning of the first T-type alpha1 (rat alpha1G); defines the T-type current and its
      proposed physiological roles, which are context for this module rather than parts.
    supporting_text: >-
      T-type channels are thought to be involved in pacemaker activity, low-threshold
      calcium spikes, neuronal oscillations and resonance, and rebound burst firing.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport), which models the record as one human module per
  transport system. RGD's voltage-operated channels (CACNA1A-I, CACNA1S, CACNB1-4) are split
  into high_voltage_activated_calcium_channels (CaV1, CaV2 with auxiliary subunits; drafted
  in the same batch) and this module (CaV3). Earlier siblings: store_operated_calcium_entry,
  er_calcium_store_cycling, plasma_membrane_calcium_extrusion, mitochondrial_calcium_uniporter.
  PW:0001139 is the only PW evidence source_id; PW:0001140 is mentioned in prose only.


  (1) STRUCTURE. One required activity, low-voltage-gated calcium entry, carried by any of
  three paralogous single-protein channels, so the root is a REALIZER variant set (ONE_OR_MORE,
  as neurons often co-express CaV3 paralogues) of three annotons. No complex is modelled:
  each alpha1 alone gives T-type currents in heterologous cells (PMID:9930755, PMID:10648811),
  and the beta and alpha2delta subunits of the HVA module are not obligatory. GOA's part_of
  GO:0005891 voltage-gated calcium channel complex rows for CACNA1G and CACNA1H are TAS only
  and are not used as a module concept.


  (2) MOLECULAR FUNCTIONS. GO:0008332 low voltage-gated calcium channel activity (sibling of
  the HVA term GO:0008331 under GO:0005245; go-basic 2026-07-26, not obsolete). Experimental
  in GOA for CACNA1G (IDA PMID:21084288, PMID:26456284, PMID:26715324; also the CACNA1G gene
  review core function) and CACNA1H (IDA PMID:21084288). For CACNA1I GOA has only the parent
  GO:0005245 (IMP PMID:33704440, TAS PMID:10454147); the LVA child is authored from the curated
  UniProt function statement tied to PMID:33704440 (ECO:0000269) and the T-type gating shown
  in that paper. Calcium substrate and product are ChEBI calcium(2+) CHEBI:29108, labelled
  extracellular to cytosol. Scaffold protein binding (caveolin-3, IPI) and protein binding are
  not used. Location: plasma membrane, IDA/EXP for CACNA1G and CACNA1H, Reactome TAS only for
  CACNA1I (authored by family).


  (3) CONTEXT, NOT PARTS. Window current, rebound burst firing, low-threshold spikes, thalamic
  oscillations, sinoatrial pacemaking, aldosterone secretion and nociception are
  physiological uses of the channels, recorded in descriptions only. Modulators (caveolin-3
  and PKA for CaV3.2, CATSPER1/2 suppression of CaV3.3, redox and zinc modulation of CaV3.2)
  are regulation context. Disease variants (CACNA1G spinocerebellar ataxia, CACNA1H
  hyperaldosteronism and epilepsy, CACNA1I neurodevelopmental disorder) are noted only where
  the paper is the functional evidence.


  (4) GO-CAM LINKS. No GO-CAM in gocams/index.tsv (any species, including gene-centric MGI
  models) contains CACNA1G, CACNA1H or CACNA1I or their orthologues, so there are no
  gocam_associations.


  (5) OTHER MODULES. No existing module uses a T-type channel as an annoton (checked by
  symbol in modules/). OTHER PW:0001139 GENES: see the sibling modules; CACNA1A-F, CACNA1S
  and CACNB1-4 are in high_voltage_activated_calcium_channels.


  (6) GROUNDING. UniProt accession for CACNA1G from genes/human/CACNA1G/CACNA1G-uniprot.txt;
  CACNA1H and CACNA1I from UniProt REST (reviewed human entries). Only CACNA1G has a gene
  review; CACNA1H and CACNA1I lack one (curation follow-up). No PANTHER or PTN ids are asserted.
