id: MODULE:glycerol_metabolism
title: Glycerol synthesis and utilisation via glycerol 3-phosphate and dihydroxyacetone
description: >-
  Glycerol metabolism in eukaryotic microbes connects the triose-phosphate pool
  of glycolysis with free glycerol through two opposing arms. In the synthetic
  arm, a cytosolic NAD-dependent glycerol-3-phosphate dehydrogenase reduces
  dihydroxyacetone phosphate (DHAP) to sn-glycerol 3-phosphate, and a specific
  glycerol-3-phosphate phosphatase releases glycerol. The arm reoxidizes
  cytosolic NADH, which makes it a redox sink under anaerobic or
  respiration-deficient conditions, and it produces glycerol as the main
  compatible solute during hyperosmotic stress. In the utilisation arm, glycerol
  is returned to DHAP by one of two routes. In the phosphorylating route,
  glycerol kinase forms sn-glycerol 3-phosphate in the cytosol, and a
  FAD-dependent glycerol-3-phosphate:quinone oxidoreductase on the outer face
  of the mitochondrial inner membrane oxidizes it to DHAP, passing electrons to
  ubiquinone. In the oxidative (dihydroxyacetone) route, a glycerol
  dehydrogenase oxidizes glycerol to dihydroxyacetone, which a
  dihydroxyacetone kinase phosphorylates to DHAP. Organisms use one or both
  routes. Both arms share DHAP with glycolysis and gluconeogenesis, and the
  dehydrogenase pair at the centre of the module is the same pair that forms
  the glycerol-3-phosphate shuttle.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:PWY3O-48
    title: glycerol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists 1.1.1.8-RXN (GPD1, GPD2) and GLYCEROL-1-PHOSPHATASE-RXN
      (GPP1, GPP2). Both gene assignments are retained. YeastCyc names the
      phosphatase substrate glycerol 1-phosphate; the purified enzymes act on
      DL-glycerol 3-phosphate and the physiological substrate is
      sn-glycerol 3-phosphate (PMID:8662716).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-48
  - source_id: YeastPathways:AERO-GLYCEROL-CAT-PWY
    title: glycerol degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists GLYCEROL-KIN-RXN (GUT1) and RXN3O-9815 (GUT2,
      ubiquinone-6-linked). Both assignments are retained. YeastCyc omits the
      dihydroxyacetone route (GCY1, DAK1, DAK2), which is added here as a
      variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=AERO-GLYCEROL-CAT-PWY
  - source_id: GO:0006071
    title: glycerol metabolic process
    statement: Module-level process covering both arms.
  - source_id: GO:0006114
    title: glycerol biosynthetic process
    statement: Process for the DHAP to glycerol arm.
  - source_id: GO:0019563
    title: glycerol catabolic process
    statement: Process for the glycerol to DHAP arm, by either route.
  - source_id: PMID:8196651
    title: GPD1, which encodes glycerol-3-phosphate dehydrogenase, is essential for growth under osmotic stress in Saccharomyces cerevisiae, and its expression is regulated by the high-osmolarity glycerol response pathway.
    statement: >-
      GPD1 encodes the NADH-dependent cytosolic glycerol-3-phosphate
      dehydrogenase, the key enzyme of glycerol synthesis; gpd1 mutants make
      little glycerol and are osmosensitive.
  - source_id: PMID:9171333
    title: The two isoenzymes for yeast NAD+-dependent glycerol 3-phosphate dehydrogenase encoded by GPD1 and GPD2 have distinct roles in osmoadaptation and redox regulation.
    statement: >-
      gpd1 gpd2 double mutants make no detectable glycerol and cannot grow
      anoxically; glycerol formation is required as a redox sink for excess
      cytosolic NADH.
  - source_id: PMID:15210723
    title: Distinct intracellular localization of Gpd1p and Gpd2p, the two yeast isoforms of NAD+-dependent glycerol-3-phosphate dehydrogenase, explains their different contributions to redox-driven glycerol production.
    statement: >-
      Gpd1p is partly cytosolic and partly peroxisomal; Gpd2p is cytosolic
      with a mitochondrial presequence sufficient for partial mitochondrial
      targeting.
  - source_id: PMID:8662716
    title: Purification and characterization of two isoenzymes of DL-glycerol-3-phosphatase from Saccharomyces cerevisiae. Identification of the corresponding GPP1 and GPP2 genes and evidence for osmotic regulation of Gpp2p expression by the osmosensing mitogen-activated protein kinase signal transduction pathway.
    statement: >-
      GPP1 and GPP2 encode two highly similar glycerol-3-phosphatase isoforms
      with high specificity for DL-glycerol 3-phosphate.
  - source_id: PMID:11058591
    title: The yeast glycerol 3-phosphatases Gpp1p and Gpp2p are required for glycerol biosynthesis and differentially involved in the cellular responses to osmotic, anaerobic, and oxidative stress.
    statement: >-
      gpp1 gpp2 double mutants lack glycerol-3-phosphatase activity and
      produce only a small amount of glycerol.
  - source_id: PMID:7498541
    title: The osmo-inducible gpd1+ gene is a target of the signaling pathway involving Wis1 MAP-kinase kinase in fission yeast.
    statement: >-
      S. pombe gpd1+ encodes an NADH-dependent glycerol-3-phosphate
      dehydrogenase isozyme for glycerol synthesis, induced by osmotic upshift.
  - source_id: PMID:191434
    title: Isolation and characterization of Saccharomyces cerevisiae mutants defective in glycerol catabolism.
    statement: >-
      Glycerol non-utilizing mutants fall into two complementation classes,
      lacking glycerol kinase or sn-glycerol 3-phosphate dehydrogenase.
  - source_id: PMID:8358828
    title: 'The glycerol kinase (GUT1) gene of Saccharomyces cerevisiae: cloning and characterization.'
    statement: >-
      GUT1 encodes glycerol kinase, homologous to bacterial glycerol kinases;
      gut1 disruptants lack activity and cannot grow on glycerol.
  - source_id: PMID:8256521
    title: GUT2, a gene for mitochondrial glycerol 3-phosphate dehydrogenase of Saccharomyces cerevisiae.
    statement: >-
      GUT2 encodes the flavin-binding mitochondrial glycerol 3-phosphate
      dehydrogenase required for glycerol utilization.
  - source_id: PMID:11502169
    title: Yeast mitochondrial dehydrogenases are associated in a supramolecular complex.
    statement: >-
      Gut2p is one of the intermembrane space-facing dehydrogenases of the
      mitochondrial inner membrane.
  - source_id: PMID:9038161
    title: Metabolic and regulatory changes associated with growth of Saccharomyces cerevisiae in 1.4 M NaCl. Evidence for osmotic induction of glycerol dissimilation via the dihydroxyacetone pathway.
    statement: >-
      Proposes a salt-induced dihydroxyacetone route of glycerol dissimilation
      in S. cerevisiae and assigns DAK1/DAK2 and GCY1/YPR1 as candidate
      enzymes.
  - source_id: PMID:22979944
    title: Characterization of GCY1 in Saccharomyces cerevisiae by metabolic profiling.
    statement: >-
      Dihydroxyacetone is undetectable in gcy1 disruptants and accumulates in
      DHA kinase-deficient strains, supporting GCY1 as the glycerol
      dehydrogenase of the dihydroxyacetone route.
  - source_id: PMID:12401799
    title: Dihydroxyacetone kinases in Saccharomyces cerevisiae are involved in detoxification of dihydroxyacetone.
    statement: >-
      DAK1 and DAK2 encode dihydroxyacetone kinases with micromolar Km for
      dihydroxyacetone.
  - source_id: PMID:20396879
    title: The gld1+ gene encoding glycerol dehydrogenase is required for glycerol metabolism in Schizosaccharomyces pombe.
    statement: >-
      S. pombe gld1 encodes a bacterial-type glycerol dehydrogenase required
      for glycerol assimilation, and dak1/dak2 DHA kinases are required for
      growth on glycerol; S. pombe uses the dihydroxyacetone route.
notes: >-
  NEW (YeastPathways project, 2026-10). The module joins the two YeastCyc
  frames because synthesis and utilisation share the sn-glycerol
  3-phosphate/DHAP couple and are reciprocally regulated (GPD1/GPP2 are
  HOG-induced; GUT1/GUT2 are glucose-repressed). Boundary: glycerol transport
  (Fps1 channel, Stl1 symporter), the HOG signalling pathway, triose-phosphate
  isomerase and lipid-backbone use of glycerol 3-phosphate are outside the
  module. The existing glycerol_phosphate_shuttle module (human GPD1 + GPD2)
  reuses the same two dehydrogenase activities for redox shuttling rather than
  net glycerol flux and is not edited here; bacterial GlpF/GlpK/GlpD
  catabolism is modelled in bacterial_glycerol_uptake_catabolism. The
  utilisation arm is an ONE_OR_MORE variant set: S. cerevisiae has both the
  glycerol 3-phosphate route (GUT1-GUT2, the main aerobic route) and the
  dihydroxyacetone route (GCY1-DAK1/DAK2, osmotically induced and also needed
  to detoxify DHA), while S. pombe lacks a glycerol kinase (PANTHER PTHR10196
  contains only xks1 in S. pombe) and assimilates glycerol through gld1 and
  dak1/dak2 (PMID:20396879). The glycerol dehydrogenase step has two
  unrelated enzyme families: the NAD-dependent iron-containing GldA-type
  enzyme (S. pombe gld1, E. coli gldA; PTHR43616) and the NADP-dependent
  aldo-keto reductase GCY1 of S. cerevisiae (EC 1.1.1.156); the GCY1
  assignment rests on metabolite profiling (PMID:22979944) and YPR1, a GCY1
  paralog proposed in PMID:9038161, is not used as an exemplar. Locations:
  GPD1 is dual cytosolic/peroxisomal and GPD2 partly mitochondrial
  (PMID:15210723), so the NAD-dependent dehydrogenase annoton carries
  cytosol as the principal site; GUT2 is placed at the mitochondrial inner
  membrane facing the intermembrane space (PMID:11502169). UniProt places S.
  pombe gld1 in mitochondria, whereas the PomBase GO-CAM places its activity in
  the cytosol; the annoton carries no location. YeastCyc corrections: added the
  dihydroxyacetone route (GCY1, DAK1, DAK2), which YeastCyc omits; the GPP
  reaction substrate is corrected to sn-glycerol 3-phosphate. GO-CAM
  disagreements: YeastPathways_AERO-GLYCEROL-CAT-PWY places GUT2 only in
  "mitochondrion", consistent with but less specific than the module. The
  PomBase model 6796b94c00004743 has the glycerol-3-phosphatase activity
  enabled by an unspecified protein (CHEBI:36080), places gut2 in the
  mitochondrial outer membrane and as part of the glycerol-3-phosphate
  shuttle, puts gpd1/gpd2 in GO:0006072 (glycerol-3-phosphate metabolic
  process) rather than glycerol biosynthesis, and includes tpi1 (glycolysis),
  which is outside this module.
