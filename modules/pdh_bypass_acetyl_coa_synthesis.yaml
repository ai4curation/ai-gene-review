id: MODULE:pdh_bypass_acetyl_coa_synthesis
title: Pyruvate dehydrogenase bypass and acetate-dependent acetyl-CoA synthesis
description: >-
  The pyruvate dehydrogenase (PDH) bypass makes acetyl-CoA in the cytosol
  without the mitochondrial PDH complex. Acetaldehyde is oxidised by an aldehyde
  dehydrogenase to acetate, and acetate is ligated to coenzyme A by an
  AMP-forming acetyl-CoA synthetase. The acetaldehyde comes either from pyruvate
  decarboxylase during growth on sugars or from alcohol dehydrogenase oxidising
  ethanol during growth on ethanol. Acetyl-CoA cannot cross organelle
  membranes, and some fungi, including budding yeast, lack ATP-citrate lyase.
  In those organisms this route is the main or only source of nucleocytosolic
  acetyl-CoA for fatty acid and sterol synthesis, lysine synthesis and histone
  acetylation, and it is essential. The same three reactions carry ethanol
  and acetate into central metabolism (via the glyoxylate cycle) after the
  diauxic shift. The acetate-activation step is the conserved acetyl-CoA
  synthetase found from bacteria to mammals.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0006085
    title: acetyl-CoA biosynthetic process
    statement: >-
      Module-level process. GO has no more specific term for acetyl-CoA formation
      from acetaldehyde via acetate. GO:0006086 (pyruvate decarboxylation to
      acetyl-CoA) denotes the PDH complex route that this module bypasses.
  - source_id: GO:0006068
    title: ethanol catabolic process
    statement: Concept for the ethanol-oxidation entry variant (YeastPathways PWY3O-4300).
  - source_id: GO:0019413
    title: acetate biosynthetic process
    statement: Concept for the aldehyde dehydrogenase step that forms acetate.
  - source_id: YeastPathways:PWY3O-4300
    title: ethanol degradation
    statement: >-
      Source for the ethanol entry and the ALD-ACS chain. Corrections: the frame
      lists ADH1-ADH5 for ethanol oxidation, but ADH2 is the glucose-repressed,
      ethanol-oxidising isozyme (ADH1 is fermentative), so only ADH2 is used for
      this direction. The frame gives no gene for the acetaldehyde
      dehydrogenase reaction (RXN66-3). Its GO-CAM fills that reaction with ALD2
      and the acetylating (CoA-dependent) MF GO:0008774, which is wrong on both
      counts. Ald6 (cytosolic) and Ald4 (mitochondrial) are the enzymes needed
      for growth on ethanol (PMID:9675847), and the yeast enzymes form free
      acetate, not acetyl-CoA.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4300
  - source_id: YeastPathways:ACETATEUTIL2-PWY
    title: acetate utilization
    statement: Source for the acetate-activation step (ACS1, ACS2); accepted unchanged.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ACETATEUTIL2-PWY
  - source_id: YeastPathways:GLUCFERMEN-PWY
    title: superpathway of glucose fermentation
    statement: >-
      Supplies the sugar-growth arm: PDC1/PDC5/PDC6 make acetaldehyde, and ALD6
      (NADP+, cytosol) and ALD4/ALD5 (mitochondria) oxidise it. The ALD2 and
      ALD3 assignments in the frame are not supported as bypass members
      (PMID:15256563).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUCFERMEN-PWY
  - source_id: PMID:7649171
    title: ACS2, a Saccharomyces cerevisiae gene encoding acetyl-coenzyme A synthetase, essential for growth on glucose.
    statement: Defines the PDH bypass and shows that ACS2 is essential on glucose and the acs1 acs2 double mutant is inviable.
    supporting_text: >-
      indirectly via the so-called PDH bypass, which requires the sequential
      action of pyruvate decarboxylase, acetaldehyde dehydrogenase and
      acetyl-coenzyme A synthetase.
  - source_id: PMID:8910545
    title: The two acetyl-coenzyme A synthetases of Saccharomyces cerevisiae differ with respect to kinetic properties and transcriptional regulation.
    statement: Acs1 is the high-affinity, glucose-repressed "aerobic" form and Acs2 the constitutive "non-aerobic" form.
    supporting_text: >-
      The Km for acetate of Acs1p was about 30-fold lower than that of Acs2p
  - source_id: PMID:16857587
    title: Nucleocytosolic acetyl-coenzyme a synthetase is required for histone acetylation and global transcription.
    statement: Acs2 (and Acs1 on non-fermentable carbon) supplies the nucleocytosolic acetyl-CoA used for histone acetylation.
    supporting_text: >-
      Yeast mitochondrial and nucleocytosolic acetyl-CoA pools are biochemically
      isolated.
  - source_id: PMID:22876324
    title: Profiling of cytosolic and peroxisomal acetyl-CoA metabolism in Saccharomyces cerevisiae.
    statement: Acetyl-CoA is not transported between compartments, so the cytosolic pool must be made in place.
    supporting_text: >-
      Membranes separating intracellular compartments are impermeable to
      acetyl-CoA and no direct transport between the compartments occurs.
  - source_id: PMID:8904337
    title: "Pyruvate decarboxylase: an indispensable enzyme for growth of Saccharomyces cerevisiae on glucose."
    statement: Pdc-negative yeast cannot grow on glucose without added C2 compounds; mitochondrial PDH cannot supply cytosolic acetyl-CoA.
    supporting_text: >-
      It is concluded that the mitochondrial pyruvate dehydrogenase complex
      cannot function as the sole source of acetyl-CoA during growth of S.
      cerevisiae on glucose
  - source_id: PMID:10234824
    title: Growth requirements of pyruvate-decarboxylase-negative Saccharomyces cerevisiae.
    statement: The acetate requirement of Pdc-negative yeast equals the cytosolic acetyl-CoA demand for lipid and lysine synthesis.
    supporting_text: >-
      consistent with the proposed role of pyruvate decarboxylase in the
      synthesis of cytosolic acetyl-CoA.
  - source_id: PMID:9392076
    title: The ALD6 gene of Saccharomyces cerevisiae encodes a cytosolic, Mg(2+)-activated acetaldehyde dehydrogenase.
    statement: ALD6 encodes the cytosolic Mg2+-activated acetaldehyde dehydrogenase; ald6 mutants grow slowly on glucose and cannot use ethanol.
    supporting_text: >-
      This enzyme is thought to be involved in the production of acetate from
      which cytosolic acetyl-CoA is then synthesized.
  - source_id: PMID:9675847
    title: Identification and disruption of the gene encoding the K(+)-activated acetaldehyde dehydrogenase of Saccharomyces cerevisiae.
    statement: YOR374w (ALD4/ALD7) encodes the mitochondrial K+-activated acetaldehyde dehydrogenase, required with Ald6 for growth on ethanol.
    supporting_text: >-
      both the Mg(2+)- and K(+)-ACDHs are required for growth on ethanol, whilst
      only the former plays a role during growth on glucose.
  - source_id: PMID:15256563
    title: "Functional analysis of the ALD gene family of Saccharomyces cerevisiae during anaerobic growth on glucose: the NADP+-dependent Ald6p and Ald5p isoforms play a major role in acetate formation."
    statement: Acetate is made mainly by cytosolic Ald6 and mitochondrial Ald5; Ald2 and Ald3 do not contribute.
    supporting_text: >-
      Thus, acetate is mainly produced by the cytosolic PDH bypass via Ald6p and
      by a mitochondrial route involving Ald5p.
  - source_id: PMID:10919763
    title: "Engineering of the pyruvate dehydrogenase bypass in Saccharomyces cerevisiae: role of the cytosolic Mg(2+) and mitochondrial K(+) acetaldehyde dehydrogenases Ald6p and Ald4p in acetate formation during alcoholic fermentation."
    statement: Ald4 can partially replace Ald6.
    supporting_text: >-
      a strain lacking both Ald6p and Ald4p exhibited a long delay in growth and
      acetate production, suggesting that Ald4p can partially replace the Ald6p
      isoform.
  - source_id: PMID:11589696
    title: Participation of acetaldehyde dehydrogenases in ethanol and pyruvate metabolism of the yeast Saccharomyces cerevisiae.
    statement: The relative contribution of mitochondrial Ald4 and cytosolic Ald6 on ethanol depends on strain background.
    supporting_text: >-
      when cultured on ethanol, the cytosolic acetaldehyde dehydrogenase can
      partially compensate for the lack of mitochondrial acetaldehyde
      dehydrogenase only when the activity of the cytosolic enzyme is
      sufficient.
  - source_id: PMID:15864308
    title: Resurrecting ancestral alcohol dehydrogenases from yeast.
    statement: Adh2 is the paralog that consumes the accumulated ethanol.
    supporting_text: >-
      Yeast later consumes the accumulated ethanol, exploiting Adh2, an Adh1
      homolog differing by 24 (of 348) amino acids.
  - source_id: PMID:11495982
    title: Adr1 and Cat8 synergistically activate the glucose-regulated alcohol dehydrogenase gene ADH2 of the yeast Saccharomyces cerevisiae.
    statement: ADH2 is glucose-repressed and activated by Adr1 and Cat8.
    supporting_text: >-
      Glucose-repressible alcohol dehydrogenase II, encoded by the ADH2 gene of
      the yeast Saccharomyces cerevisiae, is transcriptionally controlled by the
      activator Adr1
