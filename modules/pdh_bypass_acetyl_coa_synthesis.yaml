  notes: >-
    Boundary. The module covers acetaldehyde formation (from pyruvate or ethanol),
    its oxidation to acetate, and acetate activation. The mitochondrial PDH
    complex (modules/pyruvate_metabolism.yaml), ATP-citrate lyase (animals,
    plants, oleaginous yeasts; absent from budding yeast), the bacterial
    acetate kinase / phosphotransacetylase route and the carnitine shuttle are
    other acetyl-CoA routes, outside this module. Alcoholic fermentation
    (modules/alcoholic_fermentation.yaml) shares the pyruvate decarboxylase
    step but reduces, rather than oxidises, the acetaldehyde.

    YeastCyc corrections. (1) PWY3O-4300 lists ADH1-ADH5 for ethanol oxidation;
    only ADH2 is the ethanol-oxidising isozyme. ADH1 is fermentative and ADH3
    is a mitochondrial shuttle enzyme. (2) The PWY3O-4300 acetaldehyde
    dehydrogenase reaction (RXN66-3) has no gene in the frame. The GO-CAM
    assigns it to ALD2 with GO:0008774 acetaldehyde dehydrogenase (acetylating,
    NAD+) activity. That is wrong: yeast ALDs are non-acylating, ALD2/ALD3 are
    stress-induced enzymes with no role in acetate formation (PMID:15256563),
    and Ald6 plus Ald4 are needed for growth on ethanol (PMID:9675847). (3) In
    GLUCFERMEN-PWY and its GO-CAM, ALD4 and ALD5 are placed in the cytosol,
    but both are mitochondrial isozymes.

    Not grounded in fission yeast. No PomBase GO-CAM is linked to this group.
    The PomBase fermentation model types atd1 (SPAC9E9.09c) as acetaldehyde
    dehydrogenase (NAD+) in pyruvate fermentation to acetate; it is a candidate
    fission-yeast member, but its compartment and role in acetyl-CoA supply were
    not checked here.
