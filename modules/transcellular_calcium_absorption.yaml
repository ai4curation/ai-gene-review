id: MODULE:transcellular_calcium_absorption
title: Transcellular calcium absorption — apical entry through the epithelial calcium channels TRPV6 (intestine) and TRPV5 (kidney distal convoluted and connecting tubule), cytosolic buffering by calbindin-D9k (S100G) and calbindin-D28k (CALB1), and basolateral extrusion by PMCA1 and NCX1
description: >-
  Active, transcellular calcium absorption moves calcium from the intestinal lumen or the
  tubular fluid across an epithelial cell into the blood, against the electrochemical
  gradient at the exit step. It complements passive paracellular flux and is the
  hormonally regulated route: in the duodenum it adapts dietary calcium uptake to need,
  and in the late distal convoluted tubule and connecting tubule (DCT2/CNT) of the kidney
  it fine-tunes how much filtered calcium is reabsorbed. The route has three steps.
  Calcium enters across the apical membrane through the highly calcium-selective
  epithelial channels TRPV6 (mainly intestine, also placenta and other epithelia) and
  TRPV5 (mainly kidney DCT2/CNT), which are constitutively open at low cytosolic calcium
  and inactivated by rising calcium. In the cytosol the vitamin D-induced EF-hand
  proteins calbindin-D9k (S100G; intestine) and calbindin-D28k (CALB1; kidney) bind the
  entering calcium, keeping free calcium low near the channel, preventing calcium-
  dependent channel inactivation and speeding diffusion to the basolateral side. There
  calcium is extruded to the interstitium by the plasma membrane calcium ATPase PMCA1b
  (ATP2B1) and the sodium/calcium exchanger NCX1 (SLC8A1), which carries most
  basolateral extrusion in DCT2/CNT. 1,25-dihydroxyvitamin D3 acting through the vitamin
  D receptor induces the channels, the calbindins and PMCA1b; parathyroid hormone and
  klotho stimulate renal reabsorption.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes the TRP channels and states that calcium selectivity is
      confined to a subgroup of the vanilloid TRPV family; RGD curates TRPV5 and TRPV6 to
      the record. This module models the epithelial transcellular absorption system built
      on those two channels; the record's other transport systems are separate modules or
      unmodelled (see notes). Human genes in scope from RGD's list: TRPV5 TRPV6. Added on
      evidence: S100G and CALB1 (not on RGD's list), and the basolateral ATP2B1 and SLC8A1
      steps, included by reference to the plasma membrane extrusion module. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text places calcium-selective TRP channels in the vanilloid subfamily.
    supporting_text: Ca2+ selectivity appears to be confined to a subgroup of the ''vanilloid'' TRPV family.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module. GO has no term for transepithelial (transcellular) calcium transport or for
      intestinal or renal calcium absorption; a term is requested in proposed_new_terms,
      and the module uses GO:0070293 renal absorption and GO:0050892 intestinal absorption
      as concepts in the meantime (see notes).
  - source_id: PMID:15618484
    title: Calcium absorption across epithelia.
    statement: >-
      Review of epithelial calcium absorption; TRPV5 and TRPV6 are the rate-limiting entry
      step of the transcellular route in intestine and kidney.
    supporting_text: >-
      Functional analysis indicated that these Ca(2+)
      channels constitute the rate-limiting step in Ca(2+)-transporting epithelia.
  - source_id: PMID:26392310
    title: >-
      Deletion of the intestinal plasma membrane calcium pump, isoform 1, Atp2b1, in mice
      is associated with decreased bone mineral density and impaired responsiveness to 1,
      25-dihydroxyvitamin D3.
    statement: >-
      The three-step architecture of the enterocyte route (apical TRPV channels,
      calbindins, basolateral PMCA and NCX).
    supporting_text: >-
      In a Ca-transporting cell such as the enterocyte of the duodenum, apically situated,
      TRPV 5/6 cation channels mediate the increase in Ca uptake from the lumen into the
      cell [5]; intracellular Ca binding proteins such as calbindin D9K and D28K facilitate
      the movement of Ca across the cell [4,6]; and the basal-lateral plasma membrane Ca
      pump (PMCA) [7,8,9] and the Na-Ca exchanger (NCX) [10] assist in the extrusion of Ca
      from within the cell into the ECF.
  - source_id: PMID:26418956
    title: The Na+/Ca2+ Exchanger 1 (NCX1) Variant 3 as the Major Extrusion System in Renal Distal Tubular Transcellular Ca2+-Transport.
    statement: The three-step architecture of the DCT2/CNT route in the kidney.
    supporting_text: >-
      Here, Ca(2+) enters the cell at the apical
      side via the epithelial Ca(2+) channel transient receptor potential vanilloid 5
      and is subsequently extruded at the basolateral side by the concerted actions of
      the plasma membrane Ca(2+) ATPases and the Na(+)/Ca(2+) exchanger 1 (NCX1).
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the epithelial transcellular
  absorption system built on RGD's TRPV5 and TRPV6. Sibling modules from the same record:
  store_operated_calcium_entry, plasma_membrane_calcium_extrusion (referenced here by
  module_ref), er_calcium_store_cycling and mitochondrial_calcium_uniporter. PW:0001139 is
  the only PW evidence source_id; its sub-pathway PW:0001140 (calcium/calcium-mediated
  signaling) is mentioned here in prose only.


  (1) STRUCTURE. Three ordered parts joined by PROVIDES_INPUT_FOR connections: (1) apical
  entry, a ONE_OR_MORE REALIZER set over TRPV6 and TRPV5 (tissue-preferential paralogs that
  can co-assemble); (2) cytosolic buffering, a ONE_OR_MORE REALIZER set over S100G and
  CALB1; (3) basolateral extrusion, a ONE_OR_MORE ROUTE set whose two variants are
  module_ref inclusions of plasma_membrane_calcium_extrusion#atp2b1_pmca1_variant and
  #slc8a1_ncx1_variant. The extrusion annotons are not duplicated; their functions,
  substrates and evidence live in that module. Intestine and kidney are modelled as one
  module because the three-step design and the protein families are shared and the
  tissue difference is a choice of paralog within each step; the variant labels record
  the tissue. Placenta, where TRPV6 is the maternal-fetal entry route (PMID:29861107), uses
  the same design and is mentioned in prose only.


  (2) RGD GENES AND ADDITIONS. In scope from RGD's list: TRPV5 and TRPV6. Added on
  evidence, not on RGD's list: S100G and CALB1 (buffering step; PMID:1610358,
  PMID:16763551, PMID:26392310), and ATP2B1 and SLC8A1 (by reference; PMID:26392310,
  PMID:26418956). The RGD record itself says buffers are not shown because they do not
  move calcium; they are included here because in this epithelial system the calbindins
  are a recognised step that carries calcium across the cell and sustains channel
  activity, which is the module's boundary, not RGD's.


  (3) MOLECULAR FUNCTIONS. From GOA (QuickGO, November 2026), checked in go-basic
  2026-07-26 (none obsolete). TRPV6 and TRPV5: GO:0005262 calcium channel activity (IDA;
  TRPV6 PMID:11097838, PMID:15184369, PMID:23612980; TRPV5 PMID:18768590). GO has no more
  specific child for a constitutively open, calcium-inactivated epithelial channel, so the
  parent is used. TRPV6 also has GO:0005516 calmodulin binding (IDA), which reflects
  calcium-calmodulin-dependent inactivation and is not used as a function. CALB1:
  GO:0005509 calcium ion binding (IDA PMID:30289411, IMP PMID:18359862). S100G: GO:0005509
  is authored on a TAS row (PMID:1610358) and an IBA row; human S100G has no experimental
  GOA function row, stated here as required. A buffering-specific term was considered and
  not used: GO:0140314 calcium ion sequestering activity has no annotation on either
  calbindin in GOA, and the ferrying of calcium across the cytosol has no GO activity term,
  so the annotons stop at calcium ion binding, which is what the evidence supports. The
  calbindins carry no substrates or products because binding is not a transport reaction.
  GO:0005515 protein binding rows (CALB1-TRPV5, PMID:16763551) are expressed as the
  POSITIVELY_REGULATES connection from the CALB1 node to the TRPV5 node instead.


  (4) PROCESSES AND LOCATIONS ON ANNOTONS. TRPV6 GO:0098703 calcium ion import across
  plasma membrane (IDA PMID:11097838, IMP PMID:29861107) and plasma membrane (IDA/EXP).
  TRPV5 GO:0098703 (IDA), GO:0070293 renal absorption (IDA PMID:18768590, PMID:28534087) and
  apical plasma membrane GO:0016324 (EXP PMID:18768590). Apical membrane is not authored for
  TRPV6, whose human GOA location rows are plasma membrane only. CALB1 cytosol (TAS, IBA)
  and S100G cytoplasm (IBA). No process is authored on the calbindins: they do not carry
  any absorption or transport process term in human GOA, and whether they are required
  for the process is disputed (note 6), so the process sits at module level only.
  Ca2+ is grounded to ChEBI calcium(2+) CHEBI:29108 (label checked in OLS, November
  2026); compartments are given in preferred_term.


  (5) PROCESS TERM AND ONTOLOGY REQUEST. GO has transepithelial transport (GO:0070633) with
  chloride, water and ammonium children, and absorption terms for renal sodium and
  phosphate and for intestinal iron, glucose and lipids, but nothing for calcium. The
  module concepts are therefore the broad GO:0070293 renal absorption and GO:0050892
  intestinal absorption, and a term "transepithelial calcium ion transport" (is_a
  GO:0070633 and GO:0006816) is requested in proposed_new_terms; tissue-specific
  renal and intestinal calcium absorption children could follow under GO:0070293 and
  GO:0050892 if GO prefers that pattern. The mapped GO:0006816 is too broad for the module.


  (6) DISPUTED NECESSITY. Mouse knockouts of TRPV6, calbindin-D9k or both still show
  substantial vitamin D-stimulated duodenal calcium transport (PMID:18325990), whereas
  TRPV5 knockout abolishes active distal renal reabsorption (PMID:14679186) and enterocyte
  PMCA1 deletion abolishes the vitamin D response (PMID:26392310). The parts are kept
  because the molecular route is established, but the intestinal entry step may have
  additional, unidentified carriers; this is a genuine unknown, recorded here rather than
  as a module knowledge gap because it does not change the modelled parts.


  (7) REGULATION (CONTEXT, NOT MODELLED AS PARTS). 1,25-dihydroxyvitamin D3 acting through
  the vitamin D receptor (VDR) induces TRPV6, TRPV5, the calbindins and PMCA1b
  (PMID:26392310 introduction); parathyroid hormone stimulates renal reabsorption, and in
  rabbit TRPV5 by PKA phosphorylation, a response the human channel largely lacks
  (PMID:28534087); klotho and the WNK3 kinase increase TRPV5 surface abundance
  (WNK3: PMID:18768590). These are hormonal and trafficking controls rather than steps of
  the transport, and they are named here only. The one regulatory edge modelled is
  calbindin-D28k on TRPV5, because it is direct (binding to the channel) and part of how
  the route works (PMID:16763551). Klotho, VDR, PTH/PTH1R and WNK3 are not annotons.


  (8) GO-CAM LINKS. No production GO-CAM in gocams/index.tsv (any species) contains TRPV5,
  TRPV6, S100G or CALB1, so there are no gocam_associations. The seed's best_gocam
  (gomodel:65d7e4ac00002121, ITPR1-HSPA9-VDAC1 mitochondrial calcium import in apoptosis) is
  unrelated to this module.


  (9) OTHER PW:0001139 GENES NOT MODELLED HERE. They are in the sibling modules or
  unmodelled in this batch (voltage-gated, cyclic nucleotide-gated and endolysosomal
  channels, Golgi SPCA pumps); see plasma_membrane_calcium_extrusion note 8 for the list.


  (10) GROUNDING. UniProt accessions from UniProt REST (reviewed human entries; no gene
  folders exist for TRPV5, TRPV6, S100G or CALB1, and none has a gene review, which is
  curation follow-up for the project plan). GO ids and labels checked against go-basic
  release 2026-07-26. No PANTHER or PTN ids are asserted.


  (11) POSSIBLE UPSTREAM ISSUE. Human TRPV5 GO:0005262 and GO:0016324 rest on
  PMID:18768590, a WNK3 regulation study in Xenopus oocytes; the activity is not in doubt,
  but EXP for apical membrane from an oocyte-expression paper deserves a check of the full
  text by the GOA curators. Not a defect claim.
proposed_new_terms:
  - proposed_name: transepithelial calcium ion transport
    proposed_definition: >-
      The directed movement of calcium ions from one side of an epithelium to the other,
      as in active calcium absorption by the intestine and reabsorption by the kidney
      tubule.
    justification: >-
      GO has transepithelial transport (GO:0070633) with children for chloride, water and
      ammonium, and organ-level absorption terms for sodium, phosphate, iron, glucose and
      lipids, but no term for calcium. Transcellular calcium absorption through TRPV6 or
      TRPV5, calbindins and PMCA1/NCX1 is a well-defined process in intestine, kidney and
      placenta, and is currently annotated only to broad terms such as calcium ion
      transport or renal absorption. The new term would sit under GO:0070633
      (proposed_parent) and GO:0006816 calcium ion transport, and would become this
      module's concept and a process for TRPV5 and TRPV6.
    proposed_parent:
      id: GO:0070633
      label: transepithelial transport
    supported_by:
      - reference_id: PMID:11097838
        supporting_text: Transcellular calcium transport occurs in many epithelial tissues including intestine, kidney, and placenta.
      - reference_id: PMID:15618484
        supporting_text: They form the prime target for hormonal control of the active Ca(2+) flux from the intestinal lumen or urine space to the blood compartment.
module:
  id: transcellular_calcium_absorption
  label: Transcellular calcium absorption
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: renal absorption
      term:
        id: GO:0070293
        label: renal absorption
    - preferred_term: intestinal absorption
      term:
        id: GO:0050892
        label: intestinal absorption
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  parts:
    - order: 1
      role: apical calcium entry from the lumen into the epithelial cell
      node:
        id: apical_calcium_entry
        label: Apical calcium entry through the epithelial calcium channels TRPV6 and TRPV5
        module_type: TRANSPORT_STEP
        description: >-
          Calcium crosses the apical membrane down its electrochemical gradient through the
          highly calcium-selective TRPV6 and TRPV5 channels. This is the rate-limiting,
          hormonally controlled step. TRPV6 predominates in the intestine (and placenta),
          TRPV5 in the kidney DCT2/CNT; the two can co-assemble, so both may contribute
          where they are co-expressed.
        variant_sets:
          - id: epithelial_calcium_channel_paralogs
            label: Epithelial calcium channel paralogs
            axis: paralog and tissue (intestine versus kidney)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              TRPV6 realizes the step in the duodenum and other TRPV6-expressing epithelia,
              TRPV5 in the kidney DCT2/CNT. Either alone realizes apical entry.
            variants:
              - id: trpv6_variant
                label: TRPV6 (intestine, placenta)
                module_type: TRANSPORT_STEP
                annotons:
                  - id: trpv6_apical_channel
                    label: TRPV6 calcium channel activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TRPV6
                        term:
                          id: UniProtKB:Q9H1D0
                          label: Transient receptor potential cation channel subfamily V member 6
                    function:
                      preferred_term: calcium channel activity
                      term:
                        id: GO:0005262
                        label: calcium channel activity
                      substrates:
                        - preferred_term: calcium(2+) (intestinal lumen, extracellular)
                          term:
                            id: CHEBI:29108
                            label: calcium(2+)
                      products:
                        - preferred_term: calcium(2+) (cytosol)
                          term:
                            id: CHEBI:29108
                            label: calcium(2+)
                    processes:
                      - preferred_term: calcium ion import across plasma membrane
                        term:
                          id: GO:0098703
                          label: calcium ion import across plasma membrane
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Intestinal (duodenal) and placental epithelial calcium channel.
                      GO:0005262 is IDA in GOA (PMID:11097838, PMID:15184369,
                      PMID:23612980); GO:0098703 is IDA (PMID:11097838) and IMP
                      (PMID:29861107); plasma membrane is IDA/EXP. Apical localization in
                      enterocytes is not in human GOA and is not authored as a location;
                      it is stated here from the cited architecture (PMID:26392310). Loss-
                      of-function variants cause transient neonatal hyperparathyroidism by
                      impairing maternal-fetal calcium transport.
                    evidence:
                      - source_id: PMID:11097838
                        statement: Human TRPV6 (hCaT1) mediates saturable calcium uptake when expressed in oocytes.
                        supporting_text: >-
                          When expressed in Xenopus laevis oocytes, hCaT1 promotes
                          saturable Ca(2+) uptake with a Michaelis constant of 0.25 mM.
                      - source_id: PMID:11097838
                        statement: TRPV6 is proposed as the entry step of intestinal transcellular calcium transport.
                        supporting_text: >-
                          Our studies
                          suggest a role for hCaT1 in cellular calcium uptake in a variety of tissues,
                          including the transcellular calcium transport pathway in intestine.
                      - source_id: PMID:29861107
                        statement: Human TRPV6 loss of function impairs placental calcium transport.
                        supporting_text: >-
                          These results suggest that TNHP is an
                          autosomal-recessive disease caused by TRPV6 mutations that affect maternal-fetal
                          calcium transport.
              - id: trpv5_variant
                label: TRPV5 (kidney DCT2/CNT)
                module_type: TRANSPORT_STEP
                annotons:
                  - id: trpv5_apical_channel
                    label: TRPV5 calcium channel activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TRPV5
                        term:
                          id: UniProtKB:Q9NQA5
                          label: Transient receptor potential cation channel subfamily V member 5
                    function:
                      preferred_term: calcium channel activity
                      term:
                        id: GO:0005262
                        label: calcium channel activity
                      substrates:
                        - preferred_term: calcium(2+) (tubular fluid, extracellular)
                          term:
                            id: CHEBI:29108
                            label: calcium(2+)
                      products:
                        - preferred_term: calcium(2+) (cytosol)
                          term:
                            id: CHEBI:29108
                            label: calcium(2+)
                    processes:
                      - preferred_term: calcium ion import across plasma membrane
                        term:
                          id: GO:0098703
                          label: calcium ion import across plasma membrane
                      - preferred_term: renal absorption
                        term:
                          id: GO:0070293
                          label: renal absorption
                    locations:
                      - preferred_term: apical plasma membrane
                        term:
                          id: GO:0016324
                          label: apical plasma membrane
                    role_description: >-
                      Renal epithelial calcium channel of the DCT2/CNT apical membrane.
                      All terms are experimental GOA rows: GO:0005262 IDA (PMID:18768590),
                      GO:0098703 IDA (PMID:18768590), GO:0070293 IDA (PMID:18768590,
                      PMID:28534087), GO:0016324 EXP (PMID:18768590). Mouse knockout
                      abolishes active distal reabsorption (PMID:14679186). Calbindin-D28k
                      binds the channel and sustains its activity (see the connection from
                      the CALB1 node).
                    evidence:
                      - source_id: PMID:18768590
                        statement: TRPV5 is the renal epithelial calcium channel gating active reabsorption.
                        supporting_text: >-
                          TRPV5, a renal epithelial Ca2+
                          channel that serves as a gatekeeper for active Ca2+ reabsorption
                      - source_id: PMID:14679186
                        statement: Mice lacking TRPV5 lose active calcium reabsorption in the early distal convolution.
                        supporting_text: >-
                          mice lacking TRPV5 display diminished active
                          Ca2+ reabsorption despite enhanced vitamin D levels, causing severe
                          hypercalciuria.
    - order: 2
      role: cytosolic calcium buffering and diffusion from the apical to the basolateral side
      node:
        id: cytosolic_calcium_buffering
        label: Cytosolic calcium buffering and shuttling by calbindin-D9k and calbindin-D28k
        module_type: MODULE
        description: >-
          Vitamin D-induced EF-hand calbindins bind the calcium that enters through the
          apical channels. Buffering keeps free calcium low beneath the channel, which
          prevents calcium-dependent channel inactivation and protects the cell, and the
          mobile calcium-calbindin complex is proposed to speed diffusion of calcium to the
          basolateral membrane. Calbindin-D9k (S100G) is the intestinal protein,
          calbindin-D28k (CALB1) the renal one.
        variant_sets:
          - id: calbindin_paralogs
            label: Epithelial calbindins
            axis: protein and tissue (intestine versus kidney)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              S100G and CALB1 are unrelated EF-hand proteins (an S100-family protein with two
              EF-hands and a hexa-EF-hand protein) that serve the same buffering role in
              different epithelia. Mouse knockouts of either, alone or with TRPV6, leave
              substantial active transport (PMID:18325990), so this part is supporting
              rather than strictly required (see notes).
            variants:
              - id: s100g_variant
                label: S100G (calbindin-D9k; intestine)
                module_type: MODULE
                annotons:
                  - id: s100g_calcium_buffer
                    label: S100G (calbindin-D9k) calcium ion binding
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: S100G (calbindin-D9k)
                        term:
                          id: UniProtKB:P29377
                          label: Protein S100-G
                    function:
                      preferred_term: calcium ion binding
                      term:
                        id: GO:0005509
                        label: calcium ion binding
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                    role_description: >-
                      Intestinal vitamin D-dependent calcium-binding protein. Human GOA has
                      GO:0005509 only by TAS (PMID:1610358) and IBA, and cytoplasm by IBA;
                      no human experimental row exists, so the function rests on those and on
                      the protein's identity as calbindin-D9k (see notes). Human S100G mRNA is
                      in proximal small intestine but was not detected in kidney
                      (PMID:1610358), so the human renal buffer is CALB1.
                    evidence:
                      - source_id: PMID:1610358
                        statement: Human calbindin-D9k is the vitamin D-dependent calcium-binding protein of the proximal small intestine.
                        supporting_text: >-
                          Human calbindin-D9k, the vitamin D-dependent calcium binding protein, has been
                          cloned and sequenced
                      - source_id: PMID:1610358
                        statement: Human S100G expression is intestinal, not renal.
                        supporting_text: >-
                          A single abundant mRNA transcript was detectable in proximal small intestine
                          but not in kidney, uterus or placenta.
              - id: calb1_variant
                label: CALB1 (calbindin-D28k; kidney)
                module_type: MODULE
                annotons:
                  - id: calb1_calcium_buffer
                    label: CALB1 (calbindin-D28k) calcium ion binding
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CALB1 (calbindin-D28k)
                        term:
                          id: UniProtKB:P05937
                          label: Calbindin
                    function:
                      preferred_term: calcium ion binding
                      term:
                        id: GO:0005509
                        label: calcium ion binding
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Renal (DCT2/CNT) calcium buffer that binds TRPV5 at low cytosolic
                      calcium and buffers incoming calcium at the pore. GO:0005509 is IDA
                      (PMID:30289411, crystal structure with bound calcium) and IMP
                      (PMID:18359862) in GOA; cytosol is TAS/IBA. CALB1 is also a major
                      neuronal buffer; only its epithelial role is modelled here.
                    evidence:
                      - source_id: PMID:16763551
                        statement: Calbindin-D28k buffers calcium entering through TRPV5 by direct association with the channel.
                        supporting_text: >-
                          CaBP(28K) acts in Ca(2+)-transporting epithelia as a dynamic Ca(2+)
                          buffer, regulating [Ca(2+)] in close vicinity to the TRPV5 pore by direct
                          association with the channel.
                      - source_id: PMID:30289411
                        statement: Calbindin-D28k is a calcium-buffering cytoplasmic protein of absorptive epithelia.
                        supporting_text: >-
                          Calbindin-D28K is a major calcium-buffering cytoplasmic protein that is
                          expressed at particularly high levels in the central nervous system (CNS) and
                          absorptive epithelium (gut and kidney
    - order: 3
      role: basolateral calcium extrusion into the interstitium
      node:
        id: basolateral_calcium_extrusion
        label: Basolateral calcium extrusion by PMCA1 and NCX1
        module_type: TRANSPORT_STEP
        description: >-
          Calcium leaves the cell across the basolateral membrane against its gradient,
          through the plasma membrane calcium ATPase PMCA1 (the PMCA1b splice form in
          enterocytes and DCT2/CNT) and the sodium/calcium exchanger NCX1 (the NCX1.3
          variant in DCT2/CNT, about 70% of renal basolateral extrusion). Both activities
          are modelled in plasma_membrane_calcium_extrusion and included here by reference;
          in this epithelial context they sit in the basolateral plasma membrane.
        variant_sets:
          - id: basolateral_extruders
            label: Basolateral extrusion systems
            axis: transport mechanism (ATP versus sodium gradient)
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              The pump and the exchanger act in parallel; their relative share differs
              between intestine (PMCA1 considered dominant) and kidney (NCX1 dominant).
            variants:
              - id: basolateral_pmca1
                label: PMCA1 (ATP2B1) basolateral calcium pump
                module_type: TRANSPORT_STEP
                description: >-
                  Included by reference to the ATP2B1 node of the plasma membrane extrusion
                  module. Intestine-specific deletion of mouse Pmca1 abolishes the
                  1,25-dihydroxyvitamin D3-induced increase in active intestinal calcium
                  transport (PMID:26392310).
                module_ref: plasma_membrane_calcium_extrusion#atp2b1_pmca1_variant
                evidence:
                  - source_id: PMID:26392310
                    statement: Enterocyte PMCA1 is required for vitamin D-stimulated active intestinal calcium transport.
                    supporting_text: >-
                      Following the administration of 1α,25(OH)2D3 intestinal calcium transport
                      increased in wild-type mice but failed to do so in Pmca1EKO knockout mice.
              - id: basolateral_ncx1
                label: NCX1 (SLC8A1) basolateral sodium/calcium exchanger
                module_type: TRANSPORT_STEP
                description: >-
                  Included by reference to the SLC8A1 node of the plasma membrane extrusion
                  module. NCX1 (variant NCX1.3) carries most basolateral extrusion in the
                  kidney DCT2/CNT (PMID:26418956).
                module_ref: plasma_membrane_calcium_extrusion#slc8a1_ncx1_variant
                evidence:
                  - source_id: PMID:26418956
                    statement: NCX1 carries most basolateral calcium extrusion in DCT2/CNT.
                    supporting_text: NCX1 is responsible for ∼ 70% of basolateral Ca(2+) extrusion.
  connections:
    - source: apical_calcium_entry
      target: cytosolic_calcium_buffering
      connection_type: PROVIDES_INPUT_FOR
      description: Calcium entering through TRPV6 or TRPV5 is bound by the calbindins beneath the apical membrane.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Cytosolic calcium(2+) is the channel product and the calbindin ligand; the calbindin
        annotons carry a binding function with no substrate slot, so there is no reaction to
        chain to.
    - source: cytosolic_calcium_buffering
      target: basolateral_calcium_extrusion
      connection_type: PROVIDES_INPUT_FOR
      description: Calbindin-bound calcium diffuses to the basolateral membrane, where it is released to the pump and the exchanger.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Binding step without a reaction; cytosolic calcium(2+) is the substrate of the
        referenced PMCA1 and NCX1 annotons.
    - source: calb1_variant
      target: trpv5_variant
      connection_type: POSITIVELY_REGULATES
      description: >-
        Calbindin-D28k translocates to the membrane at low cytosolic calcium, binds TRPV5 and
        buffers calcium at the pore, preventing calcium-dependent channel inactivation and
        sustaining high transport rates (PMID:16763551, primary rabbit DCT2/CNT cells).
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory edge by direct association and local buffering.
