id: MODULE:dmel_smc5_6_complex
title: SMC5/6 complex in Drosophila melanogaster
description: >-
  The SMC5/6 complex is the third eukaryotic SMC complex, acting in DNA repair by homologous
  recombination, in the resolution of recombination and replication intermediates, and in
  the maintenance of repetitive DNA such as the rDNA and heterochromatin. It is built on an
  SMC5-SMC6 heterodimer bridged by the kleisin Nse4, which binds the Nse1-Nse3 pair (Nse3
  is a MAGE-family protein, encoded in Drosophila by MAGE). The SUMO ligase subunit Nse2 binds
  the SMC arms. Drosophila has two Nse2 paralogs, Quijote (qjt) and Cervantes (cerv), which
  define two variants of the complex.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000060
  title: 'FlyBase gene group SMC5-6-T: Smc5/6 complex - qjt variant'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as smc5/6 complex - qjt variant
    (SMC5-6-T); this module models that group.
- source_id: FB:FBgg0001825
  title: 'FlyBase gene group SMC5-6-V: Smc5/6 complex - cerv variant'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as smc5/6 complex - cerv variant
    (SMC5-6-V); this module models that group.
- source_id: GO:0030915
  title: Smc5-Smc6 complex
  statement: >-
    GO term grounding the module as Smc5-Smc6 complex.
notes: >-
  FlyBase defines the QJT and CERV variants (SMC5-6-T, SMC5-6-V) that differ only in the Nse2
  paralog; the shared subunits are modelled once. SUMO ligase activity is not assigned to
  Qjt or Cerv because it is inferred from yeast and human Nse2 rather than shown for the fly
  proteins. FlyBase groups realized by this module: SMC5-6-T (FBgg0000060), SMC5-6-V (FBgg0001825).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_smc5_6_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
