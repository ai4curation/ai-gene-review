id: MODULE:dmel_core_binding_factor
title: Core binding factor (Runt/CBFbeta) in Drosophila melanogaster
description: >-
  Core binding factors are heterodimeric transcription factors made of a Runt domain DNA-binding
  alpha subunit and a non-DNA-binding beta subunit that increases the alpha subunit's DNA-binding
  affinity. Drosophila has four Runt domain proteins, runt, lozenge (lz), RunxA and RunxB,
  and two beta subunits, Brother (Bro) and Big brother (Bgb). Runt acts as a pair-rule and
  sex determination gene and in neurogenesis, while lozenge specifies cell fates in the eye
  and crystal cells among hemocytes.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000769
  title: 'FlyBase gene group CBF: Core binding factor'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as core binding factor (CBF);
    this module models that group.
- source_id: GO:0016513
  title: core-binding factor complex
  statement: >-
    GO term grounding the module as core-binding factor complex.
notes: >-
  The alpha and beta subunits are emitted one annoton per gene because any of the Runt domain
  proteins can in principle pair with either beta subunit and the pairings used in each tissue
  are not fully defined. FlyBase groups realized by this module: CBF (FBgg0000769). Subgroups
  folded into it: RUNT, CBFB. Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_core_binding_factor.yaml;
  none of the member genes has a gene review yet unless noted.
