notes: >-
  Derived from the RGD Pathway Ontology record and diagram PW:0001344 (cardiolipin metabolic pathway) through
  the RGD_PATHWAY_ONTOLOGY project's diagram->module route; GO mapping GO:0032048 cardiolipin metabolic process
  (skos:closeMatch). Of the 10 RGD human genes, TAMM41, PGS1, PTPMT1, CRLS1 and TAFAZZIN are participants. The
  module is modelled as eight parts, two of them optional: (1, optional) PRELID1-TRIAP1 phosphatidic acid
  transfer; (2) TAMM41 CDP-diacylglycerol synthesis; (3) PGS1; (4) PTPMT1; (5) CRLS1; (6) a variant set of
  deacylating phospholipases (ABHD18, PLA2G6, PNPLA8); (7) tafazzin transacylation; and (8, optional) HADHA
  acyl-CoA-dependent monolysocardiolipin reacylation. ChEBI ids are the Rhea participants of RHEA:16229,
  RHEA:12593, RHEA:33751, RHEA:32931, RHEA:32935, RHEA:33731 and RHEA:35839, with labels checked against OLS.

  RGD record error: the record text says that in the first step "Tamm41 uses cytidine triphosphate and
  phosphatidylglycerol"; the substrate is phosphatidic acid, as the RGD diagram itself draws (phosphatidic acid
  and CTP to CDP-diacylglycerol). The module follows the diagram.

  Boundary decisions. (a) The outer branch of the RGD diagram is not modelled: translocation of cardiolipin to
  the outer membrane (with CKMT1A, CKMT1B and NME4 bridging the membranes and the scramblase PLSCR3), its
  peroxidation by cytochrome c (CYCS), and its signalling roles in mitophagy and apoptosis. These genes do not
  make or remodel cardiolipin; cardiolipin is their binding partner or substrate, and their roles belong to
  modules/mitophagy.yaml and modules/intrinsic_apoptotic_signaling.yaml (RGD PW:0001842 and PW:0000104, mentioned
  here only as diagram links). Creatine kinase and nucleoside diphosphate kinase are also kinases of energy
  transfer, not lipid enzymes. The diagram's downstream outputs (electron transport chain, ATP synthesis,
  metabolite carriers) are uses of cardiolipin and are likewise out of scope. (b) PRELID1-TRIAP1 is included
  as an optional transport step rather than context because it performs the delivery of the TAMM41 substrate
  to the inner membrane (direct lipid transfer activity, PMID:23931759), not merely because it is required;
  it is optional because it is substrate supply and is not drawn by RGD. Other PRELI-domain pairs (PRELID3B
  with TRIAP1, transferring phosphatidylserine for PE synthesis) are not part of this pathway. (c) The
  CDP-diacylglycerol step is modelled directly with human TAMM41 rather than by module_ref to
  cdp_dag_phospholipid_synthesis#cdp_dag_synthesis (or its mito_tam41 variant): that module is scoped to Fungi
  with S. cerevisiae and S. pombe exemplars, and a module_ref node carries no annotons, so referencing it would
  drop TAMM41, an RGD-curated human member, and assert fungal proteins in a concrete human module. The two
  modules describe the same reaction, and the fungal module's PGS1, GEP4 and CRD1 nodes are the fungal
  counterparts of parts 3 to 5. The ER CDS1/CDS2 synthases are not included: they supply phosphatidylinositol
  synthesis, not mitochondrial cardiolipin. (d) Remodelling. Deacylation is a variant set because no single
  human enzyme is established: ABHD18 (mouse and fly genetics, PMID:40378955), PLA2G6 (in vitro cardiolipin
  hydrolysis, PMID:23533611; the human GO-CAM uses it) and PNPLA8 (oxidised cardiolipin, PMID:28442572; no
  remodelling process asserted on it). Tafazzin is a required part because its loss alone causes Barth syndrome.
  HADHA is an optional acyl-CoA-dependent reacylation route. LCLAT1 (ALCAT1, AGPAT8), an ER multi-pass
  acyltransferase that UniProt describes as an acyl-CoA:lysocardiolipin acyltransferase only by similarity, is
  not included: two studies of the human protein found no lysocardiolipin acyltransferase activity
  attributable to it (PMID:19075029, PMID:16620771), its experimental GOA function is lysophosphatidic acid
  acyltransferase activity, and its ER location places it away from the inner-membrane cardiolipin pool. It
  could be added as an optional variant of part 8 if later human evidence supports it. Other phospholipases
  reported to act on cardiolipin (secreted and cytosolic PLA2s) are not included. (e) Fly and bacterial
  counterparts: modules/dmel_cardiolipin_biosynthesis_remodeling.yaml models the same Pgs1-Ptpmt1-Cls-Taz chain
  with Abhd18 and iPLA2-VIA deacylation (it leaves tafazzin without a function term);
  modules/bacterial_phosphatidylglycerol_cardiolipin_biosynthesis.yaml covers the bacterial route, whose
  phospholipase D-type cardiolipin synthase condenses two phosphatidylglycerols. Neither is referenced as a
  part. (f) Not modelled: cardiolipin degradation beyond remodelling, the regulatory condensate scaffold
  SPATA18 (Mieap) present in the GO-CAM as a positive regulator of the enzymes, and transcriptional control.

  Molecular functions (QuickGO, checked 2026-11-10). Backed by experimental human GOA rows: CRLS1 GO:0043337
  (IDA, PMID:16678169, PMID:16716149; CRLS1 review core function); PLA2G6 GO:0004623 (IDA, PMID:23533611);
  PNPLA8 GO:0004623 (IDA, several papers); PRELID1 and TRIAP1 GO:1990050 (contributes_to, IMP/IDA,
  PMID:23931759, PMID:26071602). Not backed by an experimental human GOA row: TAMM41 GO:0004605, PGS1 GO:0008444
  and PTPMT1 GO:0008962 (ISS/IBA, and the GO-CAM; supported by the yeast, hamster and mouse enzymes cited on each
  annoton); ABHD18 GO:0004623 (the ABHD18 review's core function); HADHA GO:0016747 (the HADHA review's core
  function for this activity). Tafazzin GO:0032577 phosphatidylcholine:cardiolipin O-linoleoyltransferase
  activity is authored here: it is the only GO term describing transfer of an acyl group from phosphatidylcholine
  to cardiolipin, and tafazzin prefers linoleoyl groups (PMID:17082194), but the acceptor is strictly
  monolysocardiolipin and the enzyme is not linoleoyl-specific, so a term for CoA-independent
  phospholipid:monolysocardiolipin transacylase activity, requested in proposed_new_terms, would fit better. Comparator check for processes:
  GO:0032049 is placed on the four synthetic enzymes and GO:0035965 on the deacylases and reacylating enzymes;
  GO:0120010 on PRELID1, which transfers lipid, and not on TRIAP1, whose experimental process row is the parent
  GO:0015914; neither transfer subunit is given GO:0032049.

  Possible upstream issues. (1) The TAFAZZIN GO:0047184 1-acylglycerophosphocholine O-acyltransferase activity
  IDA row (PMID:12930833) uses an acyl-CoA-dependent EC 2.3.1.23 term for a CoA-independent transacylase; the
  cited paper is a yeast complementation study of splice variants and does not assay acyl-CoA acyltransferase
  activity in its abstract. (2) In GO-CAM gomodel:67b1629100002092 the HADHA activity is typed GO:0052816
  long-chain fatty acyl-CoA hydrolase activity, which the HADHA gene review traces to a wrong-paper attribution;
  the monolysocardiolipin acyltransferase activity would be an acyltransferase term. (3) The same model places
  TAMM41 and PGS1 in the mitochondrial matrix (GO:0005759); both act at the matrix face of the inner membrane
  (TAMM41 peripheral, PGS1 membrane-associated), so the inner membrane would be more precise. (4) The model's
  causal chain CRLS1 -> PLA2G6 -> TAFAZZIN -> HADHA uses directly-positively-regulates edges for what are
  substrate hand-offs; HADHA and tafazzin are alternative reacylation routes, not sequential steps.

  GO-CAM: gomodel:67b1629100002092 (Cardiolipin metabolic process, Human; the seed's best_gocam lead, which here
  is the pathway itself) contains TAMM41, PGS1, PTPMT1, CRLS1, PLA2G6, TAFAZZIN, HADHA and SPATA18; all but
  SPATA18 are linked at activity level. No production GO-CAM in gocams/index.tsv contains PRELID1, TRIAP1,
  PNPLA8 or ABHD18. Gene reviews exist for CRLS1, ABHD18 and HADHA among the participants (and CKMT1A and CYCS
  among the excluded RGD genes); TAMM41, PGS1, PTPMT1, TAFAZZIN, PLA2G6, PNPLA8, PRELID1 and TRIAP1 have none.
  PANTHER family ids and PTNs are deliberately not asserted. Abstract-only caches: PMID:17082194, PMID:19700766,
  PMID:28442572, PMID:16620771, PMID:11171073, PMID:23931759 and others; full text is cached for PMID:21641550,
  PMID:35321494, PMID:39279645 and PMID:23533611.
