      enzymes PLA2G6 and PNPLA8, and whether they act on nascent cardiolipin, on damaged or oxidised
      cardiolipin, or both, has not been settled; the ABHD18 evidence is from mouse cells and flies and the
      iPLA2 evidence is largely in vitro or concerns oxidised cardiolipin.
