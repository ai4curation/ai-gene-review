      module_type: TRANSPORT_STEP
      description: >-
        Phosphatidic acid made in the endoplasmic reticulum reaches the outer mitochondrial membrane and
        is carried across the intermembrane space to the inner membrane by a heterodimer of the PRELI-domain
        lipid transfer protein PRELID1 and its chaperone TRIAP1, a mammalian counterpart of the yeast
        Ups1-Mdm35 pair. Loss of either subunit lowers cardiolipin and is bypassed by supplying
        phosphatidylglycerol. Marked optional because it delivers the substrate rather than performing a
        step of cardiolipin chemistry, and because the RGD diagram does not draw it.
      concepts:
      - preferred_term: intermembrane phospholipid transfer
        term:
          id: GO:0120010
          label: intermembrane phospholipid transfer
      evidence:
      - source_id: PMID:23931759
        statement: TRIAP1/PRELI complexes in the IMS transfer lipid and supply PA for CL synthesis in the
          inner membrane.
        supporting_text: TRIAP1/PRELI complexes exert lipid transfer activity in vitro and supply phosphatidic
          acid (PA) for CL synthesis in the inner membrane.
