id: MODULE:cardiolipin_metabolism
title: Mitochondrial cardiolipin metabolism — TAMM41 CDP-diacylglycerol synthesis, PGS1/PTPMT1 phosphatidylglycerol
  synthesis, CRLS1 cardiolipin synthase and deacylation-reacylation remodelling by phospholipases and tafazzin
description: >-
  Cardiolipin is a dimeric phospholipid, two phosphatidyl groups joined through a central glycerol and
  carrying four acyl chains, that is made in and largely confined to the mitochondrial inner membrane,
  where it supports the respiratory chain complexes, ATP synthase, the ADP/ATP carrier and cristae
  structure. Its synthesis is a four-step pathway on the matrix side of the inner membrane. Phosphatidic
  acid, which must first be moved from the outer to the inner membrane by the intermembrane-space
  PRELID1-TRIAP1 lipid transfer complex, is activated with CTP to CDP-diacylglycerol by the mitochondrial
  CDP-diacylglycerol synthase TAMM41. PGS1 transfers the phosphatidyl group of CDP-diacylglycerol to
  sn-glycerol 3-phosphate, forming phosphatidylglycerophosphate, the committed step. The protein
  tyrosine phosphatase-like enzyme PTPMT1 dephosphorylates it to phosphatidylglycerol, and cardiolipin
  synthase CRLS1 condenses phosphatidylglycerol with a second CDP-diacylglycerol to give nascent
  cardiolipin and CMP. Nascent cardiolipin carries mixed, often saturated acyl chains and is remodelled
  to its mature, unsaturated (in heart mostly tetralinoleoyl) form by deacylation and reacylation. A
  phospholipase removes one acyl chain to give monolysocardiolipin; candidates are the alpha/beta
  hydrolase ABHD18 and the calcium-independent phospholipases A2 PLA2G6 (iPLA2-beta) and PNPLA8
  (iPLA2-gamma). The CoA-independent transacylase tafazzin (TAFAZZIN) then transfers an acyl chain from
  another phospholipid, mainly phosphatidylcholine, to monolysocardiolipin; acyl-CoA-dependent
  monolysocardiolipin acyltransferase activity of the trifunctional protein alpha subunit (HADHA) has also
  been reported. Loss of tafazzin causes Barth syndrome, with monolysocardiolipin accumulation and
  cardiomyopathy, and biallelic variants in TAMM41, PTPMT1 and CRLS1 cause mitochondrial disease.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001344
  title: cardiolipin metabolic pathway
  statement: >-
    The module boundary follows the de novo synthesis and remodelling branches of the RGD Pathway Ontology
    record and diagram for this term. The diagram draws phosphatidic acid and CTP forming CDP-diacylglycerol,
    CDP-diacylglycerol to phosphatidylglycerophosphate, phosphatidylglycerophosphate to phosphatidylglycerol,
    phosphatidylglycerol to cardiolipin and Taz acting on cardiolipin, and then cardiolipin translocated to
    the outer membrane and associated with Ckmt1, CKMT1B, Nme4 and Plscr3, and peroxidised by Cycs as an
    input to the intrinsic apoptotic (PW:0000104) and mitochondrial autophagy (PW:0001842) pathways. The
    RGD human gene set is CKMT1A, CKMT1B, CRLS1, CYCS, NME4, PGS1, PLSCR3, PTPMT1, TAMM41 and TAFAZZIN.
    Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001344.yaml).
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001344.yaml
  title: RGD PW:0001344 record text (project snapshot)
  statement: >-
    The RGD record divides cardiolipin metabolism into a four-step de novo synthesis and a
    deacylation-reacylation remodelling branch, the two branches modelled here.
  supporting_text: In the biosynthesis of CL, a series of four steps generate an initial CL molecule which
    then undergoes remodeling, through a deacylation-reacylation cycle that can follow several routes to
    produce the final, mature CL.
- source_id: GO:0032048
  title: cardiolipin metabolic process
  statement: >-
    The skos:closeMatch GO mapping of PW:0001344 (PW definition xref and lexical match;
    projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). Used as the module-level concept; its children
    GO:0032049 cardiolipin biosynthetic process and GO:0035965 cardiolipin acyl-chain remodeling are placed on
    the synthesis and remodelling parts.
- source_id: PMID:19075029
  title: The microsomal cardiolipin remodeling enzyme acyl-CoA lysocardiolipin acyltransferase is an acyltransferase
    of multiple anionic lysophospholipids.
  statement: >-
    Boundary evidence for leaving the ER acyltransferase LCLAT1 (ALCAT1) out of the remodelling parts: knockdown
    of the human enzyme lowers lysophosphatidylinositol and lysophosphatidylglycerol acyltransferase activity
    but not lysocardiolipin acyltransferase activity.
  supporting_text: Reduced expression of ALCAT1 in Hela cells resulted in significant reductions of LPIAT and
    LPGAT activities, but not ALCAT activity.
- source_id: PMID:16620771
  title: 'Functional characterization of human 1-acylglycerol-3-phosphate acyltransferase isoform 8: cloning,
    tissue distribution, gene structure, and enzymatic activity.'
  statement: >-
    A second study of the same human protein (as AGPAT8) found lysophosphatidic acid acyltransferase activity
    and no lysocardiolipin acyltransferase activity in cell lysates.
  supporting_text: lacks acyl-CoA:lysocardiolipin acyltransferase activity
proposed_new_terms:
- proposed_name: phospholipid:monolysocardiolipin acyltransferase activity (CoA-independent)
  proposed_definition: >-
    Catalysis of the transfer of an acyl group from a glycerophospholipid, such as
    phosphatidylcholine, to monolysocardiolipin without an acyl-CoA intermediate, forming
    cardiolipin and a lysophospholipid.
  justification: >-
    Tafazzin's activity has no exact GO term. GO:0032577 phosphatidylcholine:cardiolipin
    O-linoleoyltransferase activity, used on the tafazzin annoton, restricts the acyl group to
    linoleoyl, and GO:0047184 on TAFAZZIN is an acyl-CoA-dependent term.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: PMID:17082194
    supporting_text: catalyzed both forward and reverse transacylations between cardiolipin and phosphatidylcholine, but was unable to utilize CoA or acyl-CoA as substrates.
