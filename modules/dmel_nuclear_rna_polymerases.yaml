id: MODULE:dmel_nuclear_rna_polymerases
title: Nuclear DNA-directed RNA polymerases I, II and III in Drosophila melanogaster
description: >-
  Eukaryotic nuclei contain three multisubunit DNA-directed RNA polymerases. RNA polymerase
  I transcribes the large ribosomal RNA precursor in the nucleolus, RNA polymerase II transcribes
  mRNAs and most snRNAs and microRNA precursors, and RNA polymerase III transcribes tRNAs,
  5S rRNA, U6 snRNA and other short structured RNAs. Each enzyme has two large catalytic subunits
  that form the active site, a set of subunits shared by all three enzymes (RPABC1, RPABC2,
  RPABC3, RPABC4 and RPABC5), subunits shared by Pol I and Pol III (RPAC1 and RPAC2), and
  enzyme-specific subunits.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001646
  title: 'FlyBase gene group RNAP: Nuclear rna polymerase complexes'
  statement: >-
    FlyBase release FB2026_03 groups 31 D. melanogaster genes as nuclear rna polymerase complexes
    (RNAP); this module models that group.
- source_id: GO:0055029
  title: nuclear DNA-directed RNA polymerase complex
  statement: >-
    GO term grounding the module as nuclear DNA-directed RNA polymerase complex.
notes: >-
  Boundary. The common subunits (Polr2E, Polr2F, Polr2H, Polr2K, Polr2L) and the Pol I/III
  subunits (Polr1C, Polr1D) appear in each enzyme they belong to, following the FlyBase subgroups.
  Polr2M (Gdown1 homolog) is listed by FlyBase in RNA polymerase II but is an associated factor
  rather than one of the twelve core subunits. Mitochondrial RNA polymerase and the general
  transcription factors are outside the module. FlyBase groups realized by this module: RNAP
  (FBgg0001646). Subgroups folded into it: RNAPII, RNAPI, RNAPIII. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_nuclear_rna_polymerases.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
