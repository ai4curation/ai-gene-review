id: MODULE:generic_gluconeogenesis
title: Generic gluconeogenesis module
description: >-
  A generic, taxon-neutral decomposition of gluconeogenesis: the synthesis of a
  hexose phosphate (and, in some lineages, free glucose) from three- and
  four-carbon precursors such as pyruvate, lactate, glycerol, amino-acid
  skeletons, or the malate and oxaloacetate made by the glyoxylate cycle from
  two-carbon substrates. Seven near-equilibrium reactions are shared with
  Embden-Meyerhof-Parnas glycolysis and run in reverse. The three effectively
  irreversible glycolytic steps are bypassed by dedicated enzymes. Pyruvate
  kinase is bypassed either in two steps through oxaloacetate (a pyruvate
  carboxylase or a malate dehydrogenase makes oxaloacetate, and a
  phosphoenolpyruvate carboxykinase decarboxylates and phosphorylates it) or in
  one step by a pyruvate dikinase. Phosphofructokinase is bypassed by
  fructose-1,6-bisphosphatase. Hexokinase is bypassed only where free glucose is
  released, by glucose-6-phosphatase. Organisms that keep the product as glucose
  6-phosphate for storage polysaccharides and cell-wall glucans stop one step
  earlier. The module is written as function selectors grounded by
  representative enzyme families, so that it can represent bacterial, fungal,
  plant and animal implementations.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0006094
    title: gluconeogenesis
    statement: The module is grounded in the GO biological process term for gluconeogenesis.
  - source_id: MetaCyc:GLUCONEO-PWY
    title: gluconeogenesis pathway
    statement: MetaCyc represents gluconeogenesis as a conserved pathway with organism-specific enzyme variants.
  - source_id: YeastPathways:GLUCONEO-PWY-1
    title: gluconeogenesis I
    statement: >-
      Source pathway for the S. cerevisiae realisation (11 reactions). Retained:
      PYC1/PYC2 (pyruvate carboxylase), MDH2 (cytosolic malate dehydrogenase),
      PCK1 (ATP-dependent PEPCK), ENO1/ENO2, GPM1, PGK1, TDH1-3, FBA1, FBP1 and
      PGI1. Corrections: TPI1 is missing from the frame although the
      triose-phosphate isomerase step is required to return
      glyceraldehyde 3-phosphate to the aldolase as dihydroxyacetone phosphate,
      so it is added here. The mitochondrial malic enzyme MAE1 (malate to
      pyruvate) and the mitochondrial (MDH1) and peroxisomal (MDH3) malate
      dehydrogenases are listed but are not gluconeogenic bypass steps. MAE1
      makes pyruvate in the matrix, MDH1 is the TCA-cycle isozyme and MDH3 the
      glyoxylate-cycle isozyme, so they are left to those modules.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUCONEO-PWY-1
  - source_id: PMID:1898090
    title: Electron microscopic localization of pyruvate carboxylase in rat liver and Saccharomyces cerevisiae by immunogold procedures.
    statement: >-
      Pyruvate carboxylase is mitochondrial in rat liver but cytosolic in
      budding yeast, which is the basis of the compartment variant set on the
      carboxylation step.
    supporting_text: In contrast, in S. cerevisiae, pyruvate carboxylase was found exclusively in the cytosol.
  - source_id: PMID:2665820
    title: Localization and kinetics of pyruvate-metabolizing enzymes in relation to aerobic alcoholic fermentation in Saccharomyces cerevisiae CBS 8066 and Candida utilis CBS 621.
    statement: Independent confirmation that yeast pyruvate carboxylase is cytosolic.
    supporting_text: >-
      In contrast to the general situation in fungi, plants and animals,
      pyruvate carboxylase was found to be a cytosolic enzyme in both yeasts.
  - source_id: PMID:9123965
    title: Pyruvate metabolism in Saccharomyces cerevisiae.
    statement: Review of the yeast pyruvate branch point, including anaplerotic carboxylation by pyruvate carboxylase.
    supporting_text: >-
      the anaplerotic carboxylation of pyruvate to oxaloacetate, catalysed by
      pyruvate carboxylase
  - source_id: PMID:1986231
    title: "Isolation, nucleotide sequence analysis, and disruption of the MDH2 gene from Saccharomyces cerevisiae: evidence for three isozymes of yeast malate dehydrogenase."
    statement: >-
      MDH2 encodes the major non-mitochondrial malate dehydrogenase and is
      required for growth on C2 carbon sources, where gluconeogenesis is fed by
      glyoxylate-cycle malate.
    supporting_text: >-
      Disruption of the MDH2 gene in a haploid yeast strain produced a mutant
      unable to grow on minimal medium with acetate or ethanol as a carbon source.
  - source_id: PMID:2689220
    title: Isolation and characterization of the gene encoding phosphoenolpyruvate carboxykinase from Saccharomyces cerevisiae.
    statement: PCK1 encodes the single, glucose-repressed yeast PEPCK.
    supporting_text: >-
      Only one copy of the gene was found per haploid yeast genome. An RNA of
      about 2 kb which hybridized with a DNA probe internal to the PCK1 gene was
      found only in cells growing in non-fermentable carbon sources.
  - source_id: PMID:3003364
    title: Fructose bisphosphatase of Saccharomyces cerevisiae. Cloning, disruption and regulation of the FBP1 structural gene.
    statement: FBP1 is the single yeast fructose-1,6-bisphosphatase; the null mutant is a hexose auxotroph.
    supporting_text: The fbp1 mutant strain is a hexose auxotroph, otherwise growing normally.
  - source_id: PMID:3905788
    title: Differential expression of the three yeast glyceraldehyde-3-phosphate dehydrogenase genes.
    statement: The same three GAPDH isozymes act on glucose and ethanol, so the glycolytic enzymes also serve the gluconeogenic direction.
    supporting_text: >-
      The relative proportions of expression of each gene is the same in cells
      grown in the presence of glucose or ethanol as carbon source
  - source_id: file:modules/emp_glycolysis.yaml
    title: Generic Embden-Meyerhof-Parnas (EMP) glycolysis module
    statement: >-
      The catabolic counterpart. The reversible trunk below uses the same enzyme
      families and exemplars as the corresponding EMP steps, run in the
      gluconeogenic direction.
