  notes: >-
    Scope. The module starts at pyruvate or at cytosolic C4 acids and ends at
    glucose 6-phosphate or free glucose. The pathways that supply its
    precursors (glyoxylate cycle, lactate oxidation, amino-acid catabolism,
    glycerol kinase and glycerol-3-phosphate dehydrogenase) and the pathways
    that consume glucose 6-phosphate (trehalose, glycogen, glucan synthesis)
    are separate modules. Regulators such as fructose-2,6-bisphosphate
    metabolism and catabolite inactivation of FBPase and PEPCK are not
    included.

    Yeast realisation (YeastPathways GLUCONEO-PWY-1). Cytosolic pyruvate
    carboxylase PYC1/PYC2 or cytosolic MDH2 makes the oxaloacetate, the ATP-type
    PCK1 makes phosphoenolpyruvate, the glycolytic trunk enzymes (ENO1/ENO2,
    GPM1, PGK1, TDH1-3, TPI1, FBA1) run in reverse, and FBP1 and PGI1 complete
    the route to glucose 6-phosphate. MDH2 rather than PYC is the oxaloacetate
    source on ethanol or acetate. Corrections relative to YeastCyc and its GO-CAM:
    TPI1 is added, because the frame and GO-CAM omit the triose-phosphate
    isomerase step. MAE1, MDH1 and MDH3 are not counted as members. The
    GO-CAM types the mitochondrial NAD-malic enzyme MAE1 twice, as GO:0008948
    oxaloacetate decarboxylase activity (1.1.1.39-RXN) and as GO:0030060
    L-malate dehydrogenase (NAD+) activity (activity 6690711d00001655).
    Neither is the malic-enzyme activity, and the reaction runs in the
    anaplerotic/pyruvate-supplying direction, not as a gluconeogenic step.
    The GO-CAM correctly places PYC1/PYC2 in the cytosol.

    Structure. Compared with the earlier sketch, the pyruvate kinase bypass is
    now a variant set (two steps through oxaloacetate, or one step by a
    dikinase). Oxaloacetate supply has a carbon-source variant set (pyruvate
    carboxylation or malate oxidation), and pyruvate carboxylase has a
    compartment variant set. The reversible trunk is expanded into its six
    reactions, and the glucose-6-phosphate isomerase step, which was missing,
    has been added. Terminal glucose-6-phosphatase and the GTP- and
    diphosphate-dependent PEPCKs and PPDK stay as ungrounded function
    selectors; concrete human grounding is in gluconeogenesis_human.
