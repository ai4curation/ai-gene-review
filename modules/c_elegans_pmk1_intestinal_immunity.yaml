              term:
                id: GO:0004709
                label: MAP kinase kinase kinase activity
              targets:
                - preferred_term: SEK-1
            processes:
              - preferred_term: p38MAPK cascade
                term:
                  id: GO:0038066
                  label: p38MAPK cascade
              - preferred_term: antibacterial innate immune response
                term:
                  id: GO:0140367
                  label: antibacterial innate immune response
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
