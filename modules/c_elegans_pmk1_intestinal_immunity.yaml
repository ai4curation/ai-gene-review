  connections:
    - source: tir1_activation
      target: pmk1_relay
      connection_type: POSITIVELY_REGULATES
      description: >-
        TIR-1 oligomerization and NADase activity are required for NSY-1-dependent
        PMK-1 activation. The molecular link to NSY-1 is unknown.
    - source: pmk1_relay
      target: atf7_switch
      connection_type: POSITIVELY_REGULATES
      description: >-
        PMK-1 binds and phosphorylates ATF-7, relieving its repression and
        converting it to an activator.
    - source: atf7_switch
      target: effector_output
      connection_type: CAUSES
      description: >-
        Phosphorylated ATF-7 activates transcription of secreted output
        genes. Unphosphorylated ATF-7 represses them at the basal level.
knowledge_gaps:
  - gap_statement: >-
      How TIR-1 NAD+ hydrolysis activates NSY-1 is unknown. It is not known
      whether a NAD+ breakdown product, local NAD+ depletion, or the
      oligomeric TIR-1 scaffold itself is the signal.
    boundary: >-
      Catalytic and multimerization mutants of TIR-1 both block PMK-1
      phosphorylation. TIR-1 localizes NSY-1 in neurons, but no direct
      activation step for NSY-1 has been shown in the intestine.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This is the only step at which the module's input meets the kinase
      relay. Resolving it would show whether the conserved SARM1 NADase acts
      as a second messenger generator in immunity.
    resolution: >-
      Measure NAD+, ADPR and cADPR in intestinal cells of wild-type and
      catalytic-dead tir-1 animals. Test whether supplying the product rescues
      PMK-1 phosphorylation. Assay TIR-1/NSY-1 co-assembly in intestinal
      puncta.
    provenance:
      - reference_id: PMID:15123841
        supporting_text: >-
          Although it is unclear at what point TIR-1 intersects the
          NSY-1/SEK-1/PMK-1 pathway, the regulation of PMK-1 activation by
          TIR-1 appears to be a critical component of TIR-1-mediated immunity.
  - gap_statement: >-
      The microbial or host signals that trigger TIR-1 oligomerization during
      infection are unknown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      C. elegans lacks pattern-recognition receptors upstream of this
      cascade, so the sensing step that defines the module's input is
      missing.
    resolution: >-
      Screen for bacterial mutants and host perturbations that fail to induce
      TIR-1 puncta, and test candidate metabolic or damage signals.
    provenance:
      - reference_id: PMID:35098926
        supporting_text: >-
          Currently, it is unknown how low cholesterol leads to the
          oligomerization and phase transition of C.
  - gap_statement: >-
      Whether SYSM-1, the standard reporter of PMK-1/ATF-7 activity, contributes
      to pathogen resistance at all is unknown. Its only tested function is in
      DNA damage-induced germ cell apoptosis.
    boundary: >-
      sysm-1 induction by P. aeruginosa and by PMK-1 is established, but no
      survival, bacterial load or killing assay has been reported for a sysm-1
      mutant, and single-gene RNAi of PMK-1-induced genes did not alter
      susceptibility.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The most widely used readout of the cascade may report a stress-signaling
      output rather than an antimicrobial one, which affects how reporter
      induction is read as immune activation.
    resolution: >-
      Compare survival and intestinal colonization of sysm-1(ok3236), wild-type
      and intestine-rescued animals on P. aeruginosa PA14, E. faecalis and S.
      aureus, alone and with related ShKT paralogs knocked down.
    provenance:
      - reference_id: PMID:17096597
        supporting_text: >-
          However, none of the genes inactivated individually by RNAi
          reproducibly resulted in an enhanced susceptibility to pathogens
          (unpublished data).
