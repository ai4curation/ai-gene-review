    - order: 3
      role: PMK-1-controlled transcriptional switch
      node:
        id: atf7_switch
        label: ATF-7 repressor-to-activator switch
        module_type: MOLECULAR_FUNCTION
        description: >-
          ATF-7 binds PMK-1 and is phosphorylated by it. Without PMK-1 input,
          ATF-7 represses basal expression of PMK-1-regulated genes, so atf-7
          loss-of-function restores basal expression in pmk-1 nulls. After
