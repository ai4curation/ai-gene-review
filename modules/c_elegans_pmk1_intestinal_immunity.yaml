id: MODULE:c_elegans_pmk1_intestinal_immunity
title: PMK-1 p38 MAPK intestinal innate immunity in Caenorhabditis elegans
description: >-
  In the Caenorhabditis elegans intestine, a conserved p38 MAPK cassette is the
  main signaling route by which infection and other physiological stresses
  induce antibacterial defense genes. The TIR-domain protein TIR-1, the
  nematode ortholog of SARM1, oligomerizes into puncta in intestinal epithelial
  cells under pathogen or non-pathogen stress. Its NAD+ glycohydrolase
  activity, which oligomerization strongly potentiates, is required to activate
  the cascade. TIR-1 acts upstream of the ASK1-family MAP3K NSY-1, which
  activates the MKK3/6-family MAP2K SEK-1, which in turn phosphorylates and
  activates the p38 MAPK PMK-1. PMK-1 phosphorylates the CREB/ATF bZIP
  transcription factor ATF-7. Unphosphorylated ATF-7 represses
  PMK-1-regulated genes, and phosphorylation switches it to an activator. ATF-7
  occupies regulatory regions of pathogen-induced genes in a PMK-1-dependent
  manner and controls most genes induced by Pseudomonas aeruginosa infection.
  These outputs include secreted proteins such as C-type lectin domain
  proteins, lysozymes, CUB-like proteins and ShK-toxin-domain peptides, most of
  which have not been shown to act against microbes. The ShKT gene sysm-1
  (T24B8.5) is the standard transcriptional reporter of pathway activity, but
  its only demonstrated function is as a secreted intestinal signal that
  promotes DNA damage-induced germ cell apoptosis. The
  pathway acts cell-autonomously in the intestine, cooperates with the GATA
  factor ELT-2, and is required for resistance to Gram-negative and
  Gram-positive bacteria. The same TIR-1/NSY-1/SEK-1 module also has neuronal
  roles in AWC asymmetry and serotonin-dependent behavior, and PMK-1 has a
  second transcriptional target, SKN-1, in the oxidative stress response.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12142542
    title: A conserved p38 MAP kinase pathway in Caenorhabditis elegans innate immunity.
    statement: >-
      Forward genetics identified SEK-1 (MAP2K) and NSY-1 (MAP3K) as required
      for resistance to P. aeruginosa, with PMK-1 as the downstream p38 MAPK.
    supporting_text: >-
      RNA interference assays and biochemical analysis established that a p38
      ortholog, pmk-1, functions as the downstream MAP kinase required for
      pathogen defense.
  - source_id: PMID:19837372
    title: >-
      Tissue-specific activities of an immune signaling module regulate
      physiological responses to pathogenic and nutritional bacteria in C.
      elegans.
    statement: >-
      The SARM-ASK1-MKK3 module (TIR-1/NSY-1/SEK-1) acts cell-autonomously in
      immunity and separately in neurons for behavior.
    supporting_text: >-
      We determined that the SARM-ASK1-MKK3 module has dual tissue-specific
      roles in the C. elegans response to pathogens--in the cell-autonomous
      regulation of innate immunity and the neuroendocrine regulation of
      serotonin-dependent aversive behavior.
  - source_id: PMID:30789901
    title: Global transcriptional regulation of innate immunity by ATF-7 in C. elegans.
    statement: >-
      PMK-1-ATF-7 signaling controls most pathogen-induced genes, and ATF-7
      occupies their regulatory regions in a PMK-1-dependent manner.
    supporting_text: >-
      We observe that PMK-1-ATF-7 activity regulates a majority of all genes
      induced by pathogen infection, and observe ATF-7 occupancy in regulatory
      regions of pathogen-induced genes in a PMK-1-dependent manner.
  - source_id: PMID:26016853
    title: >-
      The Developmental Intestinal Regulator ELT-2 Controls p38-Dependent
      Immune Responses in Adult C. elegans.
    statement: >-
      In the adult intestine, ELT-2 cooperates with both p38-activated
      transcription factors, ATF-7 and SKN-1.
    supporting_text: >-
      We show that elt-2 controls p38-dependent gene induction, cooperating
      with two p38-activated transcription factors, ATF-7 and SKN-1.
  - source_id: file:modules/p38_cascade.yaml
    title: p38 stress-activated MAPK cascade module
    statement: >-
      The taxon-neutral MAP3K -> MKK3/6 -> p38 -> transcriptional output
      template that this module instantiates for the C. elegans intestine.
  - source_id: file:modules/c_elegans_jak_independent_stat_signaling.yaml
    title: JAK-independent STAT signaling in Caenorhabditis elegans
    statement: >-
      Models the epidermal arm, in which the same TIR-1/NSY-1/SEK-1/PMK-1
      cassette acts upstream of STA-2 to induce nlp-29 antimicrobial peptides.
  - source_id: file:gocams/568b0f9600000284/568b0f9600000284-review.yaml
    title: Review of GO-CAM 568b0f9600000284 (intestinal antibacterial MAPK cascade)
    statement: >-
      The reviewed GO-CAM models the same TIR-1 -> NSY-1 -> SEK-1 -> PMK-1 ->
      ATF-7 -> SYSM-1 chain and flags that its ATF-7 -> SYSM-1 edge has the
      wrong sign relative to the repressor-to-activator switch.
notes: >-
  Boundary. This is a concrete C. elegans module for the intestinal
  antibacterial arm of the p38 MAPK pathway, from TIR-1 activation to
  ATF-7-dependent transcription of secreted output genes. It instantiates the
  taxon-neutral MODULE:p38_cascade (stress input, MAP3K -> MAP2K -> p38 relay,
  transcriptional output). The epidermal antifungal and wound arm, in which
  the same cassette acts upstream of STA-2 and nlp-29, is modeled in
  MODULE:c_elegans_jak_independent_stat_signaling and is not repeated here.
  PMK-1 also phosphorylates SKN-1, which controls an oxidative-stress and
  detoxification program. That branch belongs to the separate SKN-1
  oxidative-stress module (MODULE:nrf_oxidative_stress_response) and is
  only cross-referenced. The neuronal roles of TIR-1/NSY-1/SEK-1 (AWC
  asymmetry via UNC-43/CaMKII; serotonin and egg-laying behavior) are outside
  this immune boundary.

  Upstream inputs. TIR-1 is the only modeled activating input. Its
  oligomerization and NAD+ glycohydrolase activity are needed for PMK-1
  phosphorylation (PMID:35098926). The TIR-1 annoton carries NAD+ nucleosidase
  activity, which is the activity the genetic data tie to pathway activation.
  The GO-CAM 568b0f9600000284 types the same node as signaling adaptor
  activity, the other accepted core function in the tir-1 review. How NAD+
  hydrolysis by TIR-1 activates NSY-1 is unknown (see knowledge_gaps). TOL-1,
  the only worm Toll-like receptor, is deliberately not a member. TIR-1
  activity in immunity is independent of TOL-1 (PMID:15048112), and the tol-1
  review places TOL-1 in BAG-neuron signaling upstream of PMK-3, not PMK-1.
  The PKC-delta TPA-1 -> PKD DKF-2 input to PMK-1 and the MKP-7 ortholog
  VHP-1, which dephosphorylates PMK-1, are present in GO-CAM 568b0f9600000284
  but have no gene reviews here. They are recorded as context, not modeled
  parts.

  Transcriptional output. Outputs are modeled as a downstream part, not as
  core members. The output part has two representatives with different
  standing. SYSM-1 (T24B8.5), a secreted ShKT-domain protein, is the standard
  PMK-1/ATF-7 transcriptional reporter (PMID:20369020) and is the downstream
  node in GO-CAM 568b0f9600000284. The sysm-1 gene review found no evidence
  that it is antibacterial. Its induction by P. aeruginosa is expression
  evidence only, single-gene RNAi of PMK-1 targets did not change pathogen
  susceptibility (PMID:17096597), and its only demonstrated function is as an
  intestine-to-germline signal required for DNA damage-induced germ cell
  apoptosis (PMID:35121747). It is therefore modeled as a reporter and
  non-immune output of the cascade, not as an antimicrobial effector. That
  apoptosis role is cross-referenced in MODULE:c_elegans_core_apoptosis as a
  systemic modulator. LYS-7 is the antimicrobial representative. Its loss
  increases susceptibility to several pathogens in its gene review, and its
  basal expression falls together with p38 pathway activity (PMID:19023415).
  LYS-7 is also a DAF-16 target, so it is not specific to this pathway. Two
  other reviewed effectors were left out on purpose. For clec-60, the cached
  literature (PMID:20617181) shows induction by S. aureus and other pathogens
  but no PMK-1 or ATF-7 dependence. The S. aureus response is largely
  PMK-1-independent. For lys-1, TIR-1/NSY-1-dependent expression is reported
  only in an abstract-only cached paper (PMID:17526726) that does not name
  the gene. The gene reviews put lys-1 under ELT-2 and DAF-16 control.
  Neither gene is given a membership claim here.

  Relation to surveillance immunity. ATF-7 and the PMK-1 pathway are needed to
  survive P. aeruginosa Exotoxin A, which inhibits translation
  (PMID:22520464). The ZIP-2/CEBP-2 surveillance branch that induces irg-1 and
  irg-2 is PMK-1-independent and is modeled in
  MODULE:c_elegans_translation_surveillance_immunity.
module:
  id: c_elegans_pmk1_intestinal_immunity
  label: PMK-1 p38 MAPK intestinal innate immunity in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Intestinal TIR-1 -> NSY-1 -> SEK-1 -> PMK-1 p38 MAPK relay that
    phosphorylates ATF-7. This switches ATF-7 from a repressor to an activator
    of pathogen-induced secreted output genes, some of which are antimicrobial.
  concepts:
    - preferred_term: antibacterial innate immune response
      term:
        id: GO:0140367
        label: antibacterial innate immune response
      description: >-
        The process the whole module serves. It is the shared process of every
        activity in GO-CAM 568b0f9600000284.
    - preferred_term: p38MAPK cascade
      term:
        id: GO:0038066
        label: p38MAPK cascade
      description: The signaling core (parts 1 and 2).
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    anatomical_locations:
      - preferred_term: intestine
        description: >-
          WBbt:0005772 intestine. The cascade acts cell-autonomously in
          intestinal epithelial cells. The WBbt id is given in text because the
          WBbt prefix is not configured for label validation.
    conditions:
      - preferred_term: Pseudomonas aeruginosa PA14 and other bacterial infections
      - preferred_term: non-pathogen physiological stress, e.g. sterol scarcity
  gocam_associations:
    - model: gomodel:568b0f9600000284
      title: Antibacterial innate immune response in the intestine via MAPK cascade (C. elegans)
      description: >-
        Production GO-CAM covering the same chain. It also includes the
        TPA-1/DKF-2 input and the VHP-1/KGB-1 negative arm, which are not
        modeled here.
  parts:
    - order: 1
      role: stress-induced TIR-1 activation
      node:
        id: tir1_activation
        label: TIR-1/SARM1 oligomerization and NADase activation
        module_type: MOLECULAR_FUNCTION
        description: >-
          Pathogen infection and non-pathogen stresses, including sterol
          scarcity in nhr-8 mutants, induce TIR-1 to multimerize into puncta in
          intestinal epithelial cells. Multimerization and a phase transition
          strongly potentiate the TIR-domain NAD+ glycohydrolase activity of
          TIR-1. Mutations that block either multimerization or catalysis
          abolish PMK-1 phosphorylation and effector induction.
        annotons:
          - id: tir1_nadase
            label: TIR-1 NAD+ glycohydrolase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TIR-1
                term:
                  id: UniProtKB:Q86DA5
                  label: NAD(+) hydrolase tir-1
            function:
              preferred_term: NAD+ nucleosidase activity
              term:
                id: GO:0003953
                label: NAD+ nucleosidase activity
              description: >-
                The catalytic activity is shown in vitro for C. elegans TIR-1
                and is genetically required for pathway activation. The tir-1
                review also accepts signaling adaptor activity (GO:0035591),
                which is how the GO-CAM types this node.
            processes:
              - preferred_term: antibacterial innate immune response
                term:
                  id: GO:0140367
                  label: antibacterial innate immune response
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Stress-activated apical component. Its oligomerization-dependent
              NADase activity is needed for NSY-1/SEK-1/PMK-1 activation.
            gocam_associations:
              - model: gomodel:568b0f9600000284
                activity: gomodel:568b0f9600000284/57ec3a7e00000079
                title: Antibacterial innate immune response in the intestine via MAPK cascade (C. elegans)
            evidence:
              - source_id: PMID:35098926
                title: >-
                  Pathogen infection and cholesterol deficiency activate the C.
                  elegans p38 immune pathway through a TIR-1/SARM1 phase
                  transition.
                statement: >-
                  Mutations that block TIR-1 multimerization or its NAD+
                  glycohydrolase activity prevent PMK-1 phosphorylation and
                  effector induction.
                supporting_text: >-
                  C. elegans with genetic mutations that specifically block
                  either multimerization or the NAD+ glycohydrolase activity
                  of TIR-1/SARM1 fail to induce p38 PMK phosphorylation, are
                  unable to increase immune effector expression, and are
                  dramatically susceptible to bacterial infection.
              - source_id: PMID:15123841
                title: >-
                  Requirement for a conserved Toll/interleukin-1 resistance
                  domain protein in the Caenorhabditis elegans immune
                  response.
                statement: tir-1 RNAi lowers PMK-1 phosphorylation and pathogen resistance.
                supporting_text: >-
                  RNA interference inactivation of tir-1 resulted in enhanced
                  susceptibility to killing by pathogens and correspondingly
                  diminished PMK-1 phosphorylation.
              - source_id: PMID:15048112
                title: >-
                  TLR-independent control of innate immunity in Caenorhabditis
                  elegans by the TIR domain adaptor protein TIR-1, an ortholog
                  of human SARM.
                statement: TIR-1 immune function does not require the single worm Toll-like receptor.
                supporting_text: >-
                  As the activity of tir-1 was independent of the single
                  nematode Toll-like receptor
    - order: 2
      role: MAP3K -> MAP2K -> p38 kinase relay
      node:
        id: pmk1_relay
        label: NSY-1 -> SEK-1 -> PMK-1 kinase relay
        module_type: SIGNALING_PATHWAY
        description: >-
          Three-tier MAPK relay. The ASK1-family MAP3K NSY-1 activates the
          MKK3/6-family MAP2K SEK-1, which dual-phosphorylates the p38 MAPK
          PMK-1. Loss of nsy-1 or sek-1 lowers phosphorylated PMK-1, and all
          three mutants are hypersusceptible to pathogens.
        annotons:
          - id: nsy1_map3k
            label: NSY-1 MAP3K
