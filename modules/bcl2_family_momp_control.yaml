                term:
                  id: UniProtKB:Q07817
                  label: BCL2L1
            function:
              preferred_term: BH3 domain binding
              term:
                id: GO:0051434
                label: BH3 domain binding
            processes:
              - preferred_term: >-
                  negative regulation of mitochondrial outer membrane
                  permeabilization involved in apoptotic signaling pathway
                term:
                  id: GO:1901029
                  label: >-
