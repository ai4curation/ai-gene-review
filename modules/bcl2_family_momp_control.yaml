        module_type: REGULATORY_STEP
        description: >-
          BCL2, BCL-xL, and MCL-1 use BH3-binding grooves to bind and restrain
          BAX, BAK, and BH3-only activators, preventing pore formation until
          stress-responsive BH3-only proteins neutralize the restraint.
        annotons:
