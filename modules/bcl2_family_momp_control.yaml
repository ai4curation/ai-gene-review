id: MODULE:bcl2_family_momp_control
title: BCL2-family mitochondrial outer membrane permeabilization control module
description: >-
  Mammalian BCL2-family proteins control mitochondrial outer membrane
  permeabilization during intrinsic apoptosis. BH3-only proteins activate or
  derepress the pore-forming effectors BAX and BAK, while pro-survival
  BCL2-like proteins bind BH3 helices to sequester activators and effectors.
  When BH3-only activity overwhelms the pro-survival buffer, BAX and BAK
  oligomerize at the mitochondrial outer membrane to release cytochrome c and
  other intermembrane-space proteins into the apoptotic execution pathway.
status: DRAFT
evidence:
  - source_id: file:projects/APOPTOSIS.md
    title: Apoptosis project page
    statement: >-
      The APOPTOSIS project identified BAX, BAK1, BCL2, BCL2L1, MCL1, BID,
      BCL2L11, BBC3, and PMAIP1 as the reviewed mammalian BCL2-family set for
      explicit MOMP modeling.
  - source_id: GO:0097345
    title: mitochondrial outer membrane permeabilization
    statement: >-
      The module is grounded in the GO biological-process term for
      permeabilization of the mitochondrial outer membrane.
  - source_id: GO:1901029
    title: >-
      negative regulation of mitochondrial outer membrane permeabilization
      involved in apoptotic signaling pathway
    statement: >-
      Pro-survival BCL2-family proteins act directly on the mitochondrial MOMP
      switch by inhibiting BAX/BAK activation and pore formation.
  - source_id: GO:1901030
    title: >-
      positive regulation of mitochondrial outer membrane permeabilization
      involved in apoptotic signaling pathway
    statement: >-
      BH3-only proteins promote the BAX/BAK MOMP switch by either directly
      activating pore-forming effectors or neutralizing pro-survival BCL2
      proteins.
  - source_id: file:genes/human/BAX/BAX-ai-review.yaml
    title: Human BAX AI gene review
    statement: >-
      Reviewed BAX core functions establish channel activity, BAX
      homodimerization, BH3-domain engagement, and heteromeric BCL2-family
      assemblies in mitochondrial outer membrane permeabilization.
  - source_id: file:genes/human/BAK1/BAK1-ai-review.yaml
    title: Human BAK1 AI gene review
    statement: >-
      Reviewed BAK1 core functions establish apoptotic porin activity,
      homodimerization, BH3-domain engagement, and BCL2-family heteromeric
      assemblies in mitochondrial outer membrane permeabilization.
  - source_id: file:genes/human/BID/BID-ai-review.yaml
    title: Human BID AI gene review
    statement: >-
      Reviewed BID core functions distinguish tBID as a cleaved BH3-only
      activator that links death-receptor and intrinsic signaling to BAX/BAK
      mitochondrial outer membrane permeabilization.
knowledge_gaps:
  - gap_statement: >-
      BAD, BMF, HRK, BIK, BCL2L2/Bcl-w, BCL2A1/A1, and BCL2L10/Bcl-B are not
      yet represented.
    boundary: >-
      The seed module is limited to the already reviewed mammalian BAX, BAK1,
      BCL2, BCL2L1, MCL1, BID, BCL2L11, BBC3, and PMAIP1 set.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The reviewed set captures the major effectors, common pro-survival
      guardians, and a representative direct-activator/sensitizer BH3-only
      subset, but it is not an exhaustive mammalian BCL2-family module.
    resolution: >-
      Review the remaining mammalian BCL2-family paralogs before using this
      module as a complete family-level inventory.
  - gap_statement: >-
      BH3-only direct-activator versus sensitizer behavior is represented
      coarsely.
    boundary: >-
      BID, BIM/BCL2L11, and PUMA/BBC3 can directly activate BAX or BAK, while
      BIM, PUMA, and NOXA/PMAIP1 also derepress effectors by inhibiting
      pro-survival BCL2 relatives. BAD-class sensitizers have not yet been
      reviewed for this project.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The direct-activation and derepression arms have different experimental
      signatures and should not be flattened to generic positive regulation of
      apoptosis.
    resolution: >-
      Expand the BH3-only node into direct-activator and sensitizer variants
      once the remaining BH3-only genes have been reviewed.
  - gap_statement: >-
      BAX/BAK pore architecture is not yet represented below the homodimer and
      effector nodes.
    boundary: >-
      The completed BAX and BAK1 reviews capture channel/porin activity,
      homodimerization, BH3 binding, and mitochondrial outer membrane
      permeabilization, but the membrane-lipid contacts and higher-order
      oligomer topology remain out of scope.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The pore-assembly step is the point at which BCL2-family signaling
      becomes physical MOMP and cytochrome-c release.
    resolution: >-
      Add structural MOMP subnodes only when they can be grounded to reviewed
      annotations or GO-CAM activities.
notes: >-
  Created during the APOPTOSIS module pass after the individual human
  BCL2-family gene reviews were completed. The module is mammal-first and uses
  concrete human proteins as representatives; worm CED-9/EGL-1/CED-3/CED-4,
  Drosophila IAP/RHG/Dark/caspase wiring, and fungal metacaspase death are
  comparators rather than implied variants of this exact BAX/BAK/CYCS pathway.
