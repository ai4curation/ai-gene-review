      id: GO:0014033
      label: neural crest cell differentiation
    description: 'Umbrella term: GO:0014034 fate commitment, GO:0014032 development and GO:0001755 migration all
      fall under it.'
  context:
    taxa:
    - preferred_term: Vertebrata
      term:
        id: NCBITaxon:7742
        label: Vertebrata
      description: The neural crest is a vertebrate innovation; the border layer is shared with other chordates.
    cellular_components:
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
