              title: Specification of the neural crest occurs during gastrulation and requires Pax7.
              statement: Pax7 is required for crest formation and binds the FoxD3 NC1 enhancer.
              supporting_text: In chicken embryos, Pax7 is required for neural crest formation in vivo, because
