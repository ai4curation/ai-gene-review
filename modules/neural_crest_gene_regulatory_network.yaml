        and undifferentiated, preserving the broad potential that crest cells later deploy. Loss causes progenitor
        arrest or death rather than a switch to another fate, so these factors support crest formation without specifying
        crest identity. No GO process term captures this role; it is recorded with GO:0014029 at gene level and
        raised as a knowledge gap here.
