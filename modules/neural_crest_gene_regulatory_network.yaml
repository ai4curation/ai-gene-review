              title: Pax3 and Zic1 trigger the early neural crest gene regulatory network by the direct activation
                of multiple key neural crest specifiers.
              statement: Pax3 and Zic1 directly activate the crest specifier genes.
              supporting_text: We demonstrated that the neural border specifiers Pax3 and Zic1 are direct upstream
                regulators of neural crest specifiers Snail1/2, Foxd3, Twist1, and Tfap2b.
            - source_id: PMID:24360906
              title: Pax3 and Zic1 trigger the early neural crest gene regulatory network by the direct activation
                of multiple key neural crest specifiers.
              statement: Pax3 and Zic1 directly activate the crest specifier genes.
              supporting_text: We showed that Pax3 binds efficiently to snail2 oligonucleotide but much less to
                the oligonucleotide mutated in the putative binding site (Figure 4D).
