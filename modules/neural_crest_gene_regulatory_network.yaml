id: MODULE:neural_crest_gene_regulatory_network
title: Neural crest gene regulatory network module
description: 'The vertebrate neural crest gene regulatory network: the transcriptional program by which signals
  at the edge of the neural plate are converted, through a neural plate border layer and a crest specifier layer,
  into migratory multipotent crest cells, of which the cranial population forms skeletogenic ectomesenchyme. A parallel
  competence layer, shared with pluripotent blastula cells, keeps progenitors undifferentiated. Border specifiers
  (Gbx2, Msx1, AP-2alpha, Pax3, Zic1) are largely ancestral chordate genes already expressed at the amphioxus neural
  plate border; most crest specifiers were recruited at the base of vertebrates, mainly by changes in where they
  are expressed, and some cranial circuit components (Ets1) were added later in jawed vertebrates. Inducing signals
  (Wnt, BMP, FGF) are covered by the wnt_signaling, bmp_signaling and FGF modules and are treated here as upstream
  context.'
status: DRAFT
evidence:
- source_id: PMID:25564621
  title: 'Establishing neural crest identity: a gene regulatory recipe.'
  statement: Review of the layered neural crest gene regulatory network (border, specifier, effector layers).
- source_id: PMID:18562679
  title: Insights from the amphioxus genome on the origin of vertebrate neural crest.
  statement: Amphioxus has border patterning genes at the neural plate border but lacks most crest specifier expression
    there.
  supporting_text: neural plate border patterning genes, and melanocyte differentiation genes appear conserved
- source_id: file:modules/neural_crest_gene_regulatory_network-deep-research-falcon.md
  statement: Module deep research supports treating inducing signals as upstream inputs rather than network members.
  supporting_text: WNT, BMP and FGF signaling are upstream inputs
- source_id: PMID:31645763
  title: Evolution of the new head by gradual acquisition of neural crest regulatory circuits.
  statement: The cranial crest circuit was assembled gradually in gnathostomes; the ancestral crest was trunk-like.
notes: 'Concrete members are the gene products reviewed in projects/NEURAL_CREST_ORIGINS.md: Xenopus laevis proteins
  where reviewed Swiss-Prot entries exist, human proteins otherwise. Process terms follow the replacement rule of
  projects/NEURAL_CREST_FORMATION_OBSOLETION.md: border genes at the proposed ''neural plate border formation''
  term (plus GO:0014034 where they directly induce crest fate), crest specifiers at GO:0014036; competence factors
  still carry GO:0014029 pending a decision on their replacement. Genes with roles in more than one layer (AP-2alpha,
  Snai2, Twist1, Sox9) have one annoton per role, which is how roles that are non-core at gene level (e.g. Twist1
  in ectomesenchyme) become explicit parts here. Sox10-driven melanocyte and glial differentiation are downstream
  derivative programs and are out of scope.'
