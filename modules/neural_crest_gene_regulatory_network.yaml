      id: neural_plate_border_specification
      label: Neural plate border specification
      module_type: DEVELOPMENTAL_PROCESS
      description: Wnt, intermediate BMP and FGF signals at the edge of the neural plate are read out by a set of
        transcription factors that define the neural plate border, a competence territory that gives rise to neural
        crest, preplacodal ectoderm, dorsal neural tube and epidermis. Border specifiers act upstream of, and are
        required for, crest specifier expression, but individually do not impose crest fate; Pax3 and Zic1 together
        are necessary and sufficient to do so.
      concepts:
      - preferred_term: neural plate border formation (proposed new term)
        description: No GO term exists. GO:0014029 neural crest formation is defined as forming this ectodermal
          region but is placed under epithelial to mesenchymal transition; it is proposed for obsoletion, with this
          new term as one replacement (projects/NEURAL_CREST_FORMATION_OBSOLETION.md).
