      growth
    reference_section_type: ABSTRACT
- id: PMID:11421275
  title: Bacterial transporters for sulfate and organosulfur compounds.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Historical comparative transporter review, abstract inspected; full text unavailable.
      The statement about transporters known in 2001 is not a present-day universal restriction or evidence
      for BetD/BetE cargo. Direct OpuC assays supply the modern module exemplar.
