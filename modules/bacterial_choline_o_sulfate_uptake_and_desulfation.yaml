id: MODULE:bacterial_choline_o_sulfate_uptake_and_desulfation
title: Bacterial choline-O-sulfate uptake and desulfation
description: >-
  A reusable bacterial two-step module in which choline-O-sulfate is imported
  and then hydrolyzed by a BetC choline sulfatase to choline, sulfate, and a
  proton. The module represents the transport-plus-desulfation boundary;
  downstream oxidation of choline to glycine betaine, transcriptional
  regulation, and alternative sulfur-starvation pathways are outside scope.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:17116241
    title: >-
      Uncoupling of choline-O-sulphate utilization from osmoprotection in
      Pseudomonas putida.
    statement: >-
      A KT2440 betC deletion retained choline-O-sulfate accumulation but lost
      its use as a carbon or nitrogen source. This supports BetC in utilization
      while showing that uptake is BetC-independent; it does not establish the
      adjacent BetD/BetE candidates as an importer.
    supporting_text: >-
      This mutant still accumulated intact COS but failed to use this compound
      as carbon or nitrogen source.
  - source_id: PMID:9736747
    title: >-
      Presence of a gene encoding choline sulfatase in Sinorhizobium meliloti
      bet operon: choline-O-sulfate is metabolized into glycine betaine.
    statement: >-
      Sinorhizobium genetics and enzyme assays establish BetC as a choline
      sulfatase that converts choline-O-sulfate to choline.
    supporting_text: >-
      a new gene (betC) was identified as encoding a choline sulfatase
      catalyzing the conversion of choline-O-sulfate and, at a lower rate,
      phosphorylcholine, into choline.
  - source_id: PMID:21369825
    title: Inducible expression of choline sulfatase and its regulator BetR in Pseudomonas sp. ATCC19151.
    statement: >-
      A second Pseudomonas locus contains BetC beside a PBPb-superfamily BetD
      and a STAS-domain permease BetE. The paper establishes this recurring
      architecture but does not directly demonstrate BetD/BetE transport.
    supporting_text: >-
      Genes encoding potential choline sulfatase (betC), substrate-binding ABC
      transporter protein (betD), sulfate transporter (betE), and divergent
      putative transcriptional regulator (betR) were cloned and characterized
      from strain ATCC19151.
  - source_id: PMID:29458126
    title: 'Structural and Mechanistic Analysis of the Choline Sulfatase from Sinorhizobium melliloti: A Class I Sulfatase Specific for an Alkyl Sulfate Ester.'
    statement: >-
      Purified Sinorhizobium BetC efficiently hydrolyzes choline-O-sulfate, and
      its crystal structure defines the choline-sulfatase catalytic exemplar.
    supporting_text: >-
      Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the
      hydrolysis of alkyl sulfate choline-O-sulfate
  - source_id: UniProtKB:Q88RQ4
    title: Pseudomonas putida KT2440 PP_0075 (BetE candidate)
    statement: >-
      Q88RQ4 is a multi-pass SLC26A/SulP-family transporter with a STAS domain
      and is the membrane component proposed for the KT2440 BetDE system.
  - source_id: UniProtKB:Q88RQ3
    title: Pseudomonas putida KT2440 PP_0076 (BetD candidate)
    statement: >-
      Q88RQ3 is a signal-peptide-bearing periplasmic substrate-binding protein
      in the choline-transporter substrate-binding family.
  - source_id: UniProtKB:Q88RQ2
    title: Pseudomonas putida KT2440 BetC
    statement: >-
      Q88RQ2 carries EC 3.1.6.6, GO:0047753, and the InterPro choline-sulfatase
      family signature.
  - source_id: UniProtKB:O69787
    title: Experimentally characterized Sinorhizobium meliloti BetC
    statement: >-
      O69787 is the reviewed BetC exemplar linked to the direct genetic and
      biochemical evidence in PMID:9736747.
notes: >-
  The 2006 KT2440 paper described the transporter adjacent to betC as a putative
  ABC system, but the current Q88RQ4 domain architecture is SLC26A/SulP plus STAS and contains no
  canonical ABC nucleotide-binding component. The module therefore records
  BetD and BetE as separate candidate transport-associated proteins, without
  asserting a physical complex, ABC coupling, or choline-O-sulfate specificity.
  The betC deletion phenotype shows that choline-O-sulfate can enter KT2440 but
  does not identify the responsible transporter.
