- id: PMID:23354714
  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative minireview. Cached abstract inspected and independent PMC full text recovered
      (PMC3623244). Choline/betaine homeostasis distinguishes osmoprotective storage from nutrient catabolism,
      corroborating the module boundary; it does not establish the cargo of the unresolved KT2440 transporter.
  findings:
