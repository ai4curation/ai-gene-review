- id: PMID:29458126
  title: 'Structural and Mechanistic Analysis of the Choline Sulfatase from Sinorhizobium melliloti: A
    Class I Sulfatase Specific for an Alkyl Sulfate Ester.'
  findings:
  - statement: Purified SmCS hydrolyzes choline-O-sulfate efficiently and 4-nitrophenyl sulfate much more
      slowly.
    supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the hydrolysis
      of alkyl sulfate choline-O-sulfate
    reference_section_type: ABSTRACT
  - statement: The 2018 mutagenesis/structure analysis proposed a role for Glu386 in quaternary-ammonium
      recognition; later ligand-bound CECT 4857 structures question this direct binding interpretation.
    supporting_text: a conserved glutamate (Glu386) plays a role in recognition of the quaternary ammonium
      group of the choline substrate
    reference_section_type: ABSTRACT
  - statement: The formylglycine nucleophile is at position 54 and is coordinated by His104 and the metal
      ion, matching the O69787 active-site numbering.
    supporting_text: The nucleophile (Cys54/fGly54) is coordinated to His104 and the metal ion.
    reference_section_type: RESULTS
  - statement: The recombinant enzyme was cloned from the 1021 target strain with accession O69787 explicitly
      identified.
    supporting_text: 'The gene encoding CS from S. meliloti 1021 (Uniprot accession number protein sequence:
      O69787, gene sequence positions 1491–3029 of GenBank accession number U39940)'
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked. Methods explicitly identify S. meliloti 1021 genomic DNA (ATCC 51124D-5)
      and UniProt O69787. Tagged recombinant enzyme was expressed in E. coli with M. tuberculosis formylglycine-generating
      enzyme; kinetics establish catalytic activity, not native maturation efficiency or physiological
      flux through promiscuous substrates.
