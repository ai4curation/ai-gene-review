  connections:
    - source: betde_choline_o_sulfate_import
      target: betc_choline_o_sulfate_hydrolysis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Some transport route supplies intracellular choline-O-sulfate for BetC
        hydrolysis; whether BetD or BetE participates is unresolved.
      chaining_status: KNOWLEDGE_GAP
      chaining_note: >-
        Substrate continuity is chemically explicit, but the KT2440 deletion
        data show that transporters other than BetDE can supply the intracellular
        substrate.
  knowledge_gaps:
    - gap_statement: >-
        The physiological substrate range and energy-coupling mechanism of the
        adjacent BetD and SLC26A/SulP-family BetE candidates are unresolved, as
        is whether they function together.
      boundary: >-
        The transport step records separate candidates and does not classify
        them as a complex, an ABC transporter, or the sole KT2440 importer.
