id: MODULE:bacterial_choline_o_sulfate_uptake_and_desulfation
title: Bacterial choline-O-sulfate uptake and desulfation
description: A bacterial uptake-and-hydrolysis mechanism in which intact choline-O-sulfate enters the
  cell and is cleaved by BetC to choline, sulfate and a proton. Import implementations and molecular assignments
  vary among lineages. Uptake for osmoprotection without hydrolysis is a distinct outcome; downstream
  choline oxidation and sulfur assimilation lie outside this boundary.
status: COMPLETE
scope: ABSTRACT
evidence:
- &id003
  source_id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  statement: A KT2440 betC deletion retained choline-O-sulfate accumulation but lost its use as a carbon
    or nitrogen source. This supports BetC in utilization while showing that uptake is BetC-independent;
    it does not establish the adjacent BetD/BetE candidates as an importer.
  supporting_text: This mutant still accumulated intact COS but failed to use this compound as carbon
    or nitrogen source.
- &id005
  source_id: PMID:9736747
  title: 'Presence of a gene encoding choline sulfatase in Sinorhizobium meliloti bet operon: choline-O-sulfate
    is metabolized into glycine betaine.'
  statement: Sinorhizobium genetics and enzyme assays establish BetC as a choline sulfatase that converts
    choline-O-sulfate to choline.
  supporting_text: a new gene (betC) was identified as encoding a choline sulfatase catalyzing the conversion
    of choline-O-sulfate and, at a lower rate, phosphorylcholine, into choline.
- &id006
  source_id: PMID:29458126
  title: 'Structural and Mechanistic Analysis of the Choline Sulfatase from Sinorhizobium melliloti: A
    Class I Sulfatase Specific for an Alkyl Sulfate Ester.'
  statement: Purified Sinorhizobium BetC efficiently hydrolyzes choline-O-sulfate, and its crystal structure
    defines the choline-sulfatase catalytic exemplar.
  supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the hydrolysis
    of alkyl sulfate choline-O-sulfate
- source_id: PMID:23354714
  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  statement: 'Comparative review: osmoprotectant accumulation and nutrient catabolism are different fates.
    Choline-to-betaine conversion and further catabolism remain outside the uptake/desulfation boundary.'
  supporting_text: the GB intermediate represents a metabolic decision point to determine whether GB is
    catabolized or stored as an osmo- and stress protectant.
- source_id: PMID:10717312
  title: Riding the sulfur cycle--metabolism of sulfonates and sulfate esters in gram-negative bacteria.
  statement: Comparative review distinguishes sulfur acquisition from carbon-skeleton catabolism. COS
    hydrolysis does not by itself establish every downstream physiological use.
  supporting_text: Many microorganisms can use sulfonates and sulfate esters as a source of sulfur for
    growth
- &id004
  source_id: PMID:11421275
  title: Bacterial transporters for sulfate and organosulfur compounds.
  statement: Historical transporter review distinguishes uptake machinery from intracellular metabolism.
    Its 2001 ABC survey is not evidence that an unresolved SulP candidate carries COS.
  supporting_text: the sulfonate and sulfate ester transporters identified to date are all ABC-type systems
- &id001
  source_id: PMID:9925583
  title: High-affinity transport of choline-O-sulfate and its use as a compatible solute in Bacillus subtilis.
  statement: OpuC directly imports COS, but the assayed Bacillus strains accumulate it intact rather than
    hydrolyzing it; this is a transport exemplar, not a complete native pathway exemplar.
  supporting_text: choline-O-sulfate was specifically acquired from the environment via OpuC.
- &id002
  source_id: PMID:9925583
  title: High-affinity transport of choline-O-sulfate and its use as a compatible solute in Bacillus subtilis.
  statement: 'Uptake is insufficient to establish this two-step module: COS remains a metabolically inert
    compatible solute in the assayed Bacillus strains.'
- &id007
  source_id: PMID:26058574
  title: Comparative genomics and mutagenesis analyses of choline metabolism in the marine Roseobacter
    clade.
  statement: The native DSS-3 betC mutant supports COS utilization through SPO1083; the BetT COS-growth
    phenotype is partial and does not identify a directly measured COS uptake reaction.
  supporting_text: Growth of the ΔbetT::Gm mutant on COS (μ = 0.027 ± 0.001 h−1) was also affected
notes: Bacteria is the reusable scope, not a universal distribution claim. OpuC supplies a resolved transport
  exemplar from Bacillus, whose tested strains do not perform the complete hydrolytic pathway. Pseudomonas,
  Sinorhizobium and Ruegeria provide physiological or biochemical hydrolysis evidence, while their COS
  importer assignments remain open. BetD/BetE and BetT candidates are not mandatory core components. BetC
  uses the specific TIGR03417/IPR017785 lineage rather than the heterogeneous PTHR45953 family. OpuC subunit
  family assignments are classification evidence, not cargo predictions; related OpuB proteins cannot
  substitute merely because a family label matches. Whole-cell observed uptake and gene-based capacity
  are separate evidence modes. No native compatibility of components taken from different taxa is implied.
  Ruegeria is a hydrolysis/utilization comparator with unresolved compartment; its growth phenotype does
  not count as directly observed intact COS uptake. The four OpuC components are distinct subunit types,
  not a four-polypeptide stoichiometry.
  For ontology maintenance, no exact COS-transporter GO term was identified. Generic transmembrane
  transport with structured COS cargo represents the measured complex activity; subunit contributions
  remain distinct from independently enabled transport. A term request would improve terminology,
  without constituting an unresolved biological activity.
module:
  id: bacterial_choline_o_sulfate_uptake_and_desulfation
  label: Bacterial choline-O-sulfate uptake and desulfation
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: choline-O-sulfate utilization
    description: Cellular uptake of choline-O-sulfate followed by hydrolysis to choline and sulfate.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
  parts:
  - order: 1
    role: intact COS import
    node:
      id: choline_o_sulfate_import
      label: Intact choline-O-sulfate import
      module_type: TRANSPORT_STEP
      variant_sets:
      - id: cos_import_realizer_axis
        selection: ONE_OR_MORE
        variants:
        - id: opuc_choline_o_sulfate_import
          label: OpuC-mediated COS import
          module_type: TRANSPORT_STEP
          description: 'A characterized uptake implementation. Bacillus OpuC is an import-only exemplar
            at this boundary: the native assayed strain does not hydrolyze COS.'
          annotons:
          - id: opuc_cos_transport
            label: Assembled OpuC COS transport
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: OpuC compatible-solute ABC importer
                active_units:
                - id: opuca_active_unit
                  label: opuCA OpuC subunit
                  role: ATP-coupling subunit; family membership or ATPase activity alone does not establish
                    COS transport.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: opuCA role within an experimentally supported OpuC complex
                      term:
                        id: PANTHER:PTHR43117:SF3
                        label: CHOLINE TRANSPORT ATP-BINDING PROTEIN OPUBA
                      representative_members:
                      - preferred_term: opuCA (BACSU)
                        term:
                          id: UniProtKB:O34992
                          label: Glycine betaine/carnitine/choline transport ATP-binding protein OpuCA
                        evidence:
                        - source_id: file:BACSU/opuCA/opuCA-ai-review.yaml
                          statement: Individual review distinguishes native assay evidence, reference
                            identity and contribution to a complex.
                      description: The classification contains related transport-system proteins. Independent
                        OpuC role and assembled-complex cargo evidence are required; the official family
                        label alone does not specify COS.
                - id: opucb_active_unit
                  label: opuCB OpuC subunit
                  role: First membrane subunit of the OpuC transporter; requires the other OpuC components.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: opuCB role within an experimentally supported OpuC complex
                      term:
                        id: PANTHER:PTHR30177:SF28
                        label: CHOLINE TRANSPORT SYSTEM PERMEASE PROTEIN OPUBB
                      representative_members:
                      - preferred_term: opuCB (BACSU)
                        term:
                          id: UniProtKB:O34878
                          label: Glycine betaine/carnitine/choline transport system permease protein OpuCB
                        evidence:
                        - source_id: file:BACSU/opuCB/opuCB-ai-review.yaml
                          statement: Individual review distinguishes native assay evidence, reference
                            identity and contribution to a complex.
                      description: The classification contains related transport-system proteins. Independent
                        OpuC role and assembled-complex cargo evidence are required; the official family
                        label alone does not specify COS.
                - id: opucc_active_unit
                  label: opuCC OpuC subunit
                  role: Lipid-anchored substrate-binding subunit. The COS range is demonstrated for the
                    assembled transporter, not inferred from the family label.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: opuCC role within an experimentally supported OpuC complex
                      term:
                        id: PANTHER:PTHR30024:SF44
                        label: CHOLINE-BINDING PROTEIN
                      representative_members:
                      - preferred_term: opuCC (BACSU)
                        term:
                          id: UniProtKB:O32243
                          label: Glycine betaine/carnitine/choline-binding protein OpuCC
                        evidence:
                        - source_id: file:BACSU/opuCC/opuCC-ai-review.yaml
                          statement: Individual review distinguishes native assay evidence, reference
                            identity and contribution to a complex.
                      description: The classification contains related transport-system proteins. Independent
                        OpuC role and assembled-complex cargo evidence are required; the official family
                        label alone does not specify COS.
                - id: opucd_active_unit
                  label: opuCD OpuC subunit
                  role: Second membrane subunit of the OpuC transporter; a related OpuB/other permease
                    is not automatically an OpuC realizer.
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: opuCD role within an experimentally supported OpuC complex
                      term:
                        id: PANTHER:PTHR30177:SF4
                        label: OSMOPROTECTANT IMPORT PERMEASE PROTEIN OSMW
                      representative_members:
                      - preferred_term: opuCD (BACSU)
                        term:
                          id: UniProtKB:O34742
                          label: Glycine betaine/carnitine/choline transport system permease protein OpuCD
                        evidence:
                        - source_id: file:BACSU/opuCD/opuCD-ai-review.yaml
                          statement: Individual review distinguishes native assay evidence, reference
                            identity and contribution to a complex.
                      description: The classification contains related transport-system proteins. Independent
                        OpuC role and assembled-complex cargo evidence are required; the official family
                        label alone does not specify COS.
            function:
              preferred_term: transmembrane transporter activity
              term:
                id: GO:0022857
                label: transmembrane transporter activity
              cargo:
              - preferred_term: choline sulfate
                term:
                  id: CHEBI:16822
                  label: choline sulfate
            role_description: Imports intact COS using the assembled ABC system with four distinct subunit
              types (including two OpuCA copies). Every subunit contributes to transport; none is asserted
              to enable this activity alone.
            evidence:
            - *id001
            - source_id: PMID:10216873
              title: Two evolutionarily closely related ABC transporters mediate the uptake of choline
                for synthesis of the osmoprotectant glycine betaine in Bacillus subtilis.
              statement: OpuC has distinct ATP-coupling, substrate-binding and two membrane-subunit roles.
                This architecture is required together with whole-complex COS uptake evidence; related-family
                proteins alone are insufficient.
            notes: Family/domain matches must be combined with curated OpuC subunit roles and complex-level
              COS cargo evidence. Do not infer a native Bacillus desulfation pathway.
          evidence:
          - *id001
          - *id002
        - id: unresolved_choline_o_sulfate_import
          label: Observed COS import with unresolved molecular identity
          module_type: TRANSPORT_STEP
          description: Retains the required import role where whole-cell physiology establishes intracellular
            COS supply but cannot assign a specific transporter. A missing gene assignment is an abduction
            target, not evidence that uptake is absent.
          annotons:
          - id: unresolved_cos_import_activity
            label: Unassigned COS import activity
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: transmembrane transporter activity
                term:
                  id: GO:0022857
                  label: transmembrane transporter activity
                cargo:
                - preferred_term: choline sulfate
                  term:
                    id: CHEBI:16822
                    label: choline sulfate
              description: No molecular family or representative is asserted until the cargo-specific
                importer is identified. Generic transporter activity alone cannot fill this role.
            function:
              preferred_term: transmembrane transporter activity
              term:
                id: GO:0022857
                label: transmembrane transporter activity
              cargo:
              - preferred_term: choline sulfate
                term:
                  id: CHEBI:16822
                  label: choline sulfate
            role_description: 'Supplies intact intracellular COS to BetC. KT2440 intact-accumulation evidence
              can establish this role without identifying its gene. Ruegeria COS growth alone cannot:
              hydrolysis compartment and intact uptake remain unresolved.'
            evidence:
            - *id003
          notes: The production Boolean compiler leaves cargo and molecular-assignment constraints to
            the oracle. A gene-only inventory may leave this role unresolved even when native pathway
            physiology is established.
      evidence:
      - *id004
      - *id001
      - *id003
  - order: 2
    role: choline-O-sulfate hydrolysis
    node:
      id: betc_choline_o_sulfate_hydrolysis
      label: BetC choline-O-sulfate hydrolysis
      module_type: REACTION
      annotons:
      - id: betc_choline_sulfatase_activity
        label: BetC choline-sulfatase activity
        participant:
          selector_type: FAMILY
          family:
            preferred_term: BetC choline-sulfatase family (InterPro IPR017785)
            term:
              id: NCBIfam:TIGR03417
              label: choline-sulfatase
            representative_members:
            - preferred_term: betC (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88RQ2
                label: Choline-sulfatase
            - preferred_term: betC (Sinorhizobium meliloti 1021; experimentally characterized SmCS)
              term:
                id: UniProtKB:O69787
                label: Choline-sulfatase
            - preferred_term: betC-1 (RUEPO)
              term:
                id: UniProtKB:Q5LUH1
                label: Choline sulfatase
              evidence:
              - source_id: file:RUEPO/betC-1/betC-1-ai-review.yaml
                statement: Individual review distinguishes native assay evidence, reference identity and
                  contribution to a complex.
            description: TIGR03417 and IPR017785 distinguish the choline-sulfatase lineage from the heterogeneous
              PANTHER sulfatase family. Named exemplars also have physiological or biochemical support.
              Sequence classification alone does not establish identical kinetic profiles or every promiscuous
              substrate.
        function:
          preferred_term: choline-sulfatase activity
          term:
            id: GO:0047753
            label: choline-sulfatase activity
          substrates:
          - preferred_term: choline-O-sulfate
            term:
              id: CHEBI:16822
              label: choline sulfate
          - preferred_term: water
            term:
              id: CHEBI:15377
              label: water
          products:
          - preferred_term: choline
            term:
              id: CHEBI:15354
              label: choline
          - preferred_term: sulfate
            term:
              id: CHEBI:16189
              label: sulfate
          - preferred_term: proton
            term:
              id: CHEBI:15378
              label: hydron
          evidence:
          - source_id: RHEA:20820
            title: choline-O-sulfate hydrolysis
            statement: RHEA:20820 is the reaction mapped to GO:0047753 and EC 3.1.6.6.
          - source_id: PMID:9736747
            title: 'Presence of a gene encoding choline sulfatase in Sinorhizobium meliloti bet operon:
              choline-O-sulfate is metabolized into glycine betaine.'
            statement: BetC-dependent enzyme assays establish conversion of choline-O-sulfate to choline.
            supporting_text: Choline sulfatase activity was absent from betC but not from betB mutants
          - source_id: PMID:29458126
            title: 'Structural and Mechanistic Analysis of the Choline Sulfatase from Sinorhizobium melliloti:
              A Class I Sulfatase Specific for an Alkyl Sulfate Ester.'
            statement: Purified SmCS directly hydrolyzes choline-O-sulfate and provides a structurally
              characterized BetC exemplar.
            supporting_text: Sinorhizobium meliloti choline sulfatase (SmCS) efficiently catalyzes the
              hydrolysis of alkyl sulfate choline-O-sulfate
        role_description: Cleaves the sulfate ester, releasing choline for downstream metabolism and sulfate
          for cellular use or excretion.
        evidence:
        - *id005
        - *id006
        - *id007
        - source_id: PMID:35503214
          title: Structural insights into choline-O-sulfatase reveal the molecular determinants for ligand
            binding.
          statement: Ligand-bound CECT 4857 BetC structures support hydrolysis-product recognition in
            this family. They are homolog evidence for the 1021 exemplar and revise the earlier binding-site
            interpretation, not an additional assay of O69787.
          supporting_text: The binding mode of this AP superfamily member to both products of the reaction
            (sulfate and choline)
        notes: 'The 2018 recombinant Sinorhizobium experiment used 1021/O69787. The 2022 ligand structures
          used CECT 4857/MH208481 and are homolog evidence unless explicitly sequence-mapped. Ruegeria
          SPO1083 has native COS-utilization evidence; no purified Ruegeria enzyme assay is claimed. No
          common cellular location is asserted across all exemplars: native BetC compartments are unresolved,
          so hydrolysis evidence alone does not resolve the compartment or transport order. KT2440 intact-COS
          accumulation is positive evidence for import, without a localization assay for its BetC.'
  - role: qualified transporter-locus candidate
    optional: true
    node:
      id: bete_transport_candidate_context
      label: BetE SLC26A/SulP transport candidate
      module_type: TRANSPORT_STEP
      description: Candidate context only; this role does not satisfy the required cargo-specific COS
        import step.
      annotons:
      - id: bete_transport_candidate
        label: BetE SLC26A/SulP transport candidate
        participant:
          selector_type: FAMILY
          family:
            preferred_term: PANTHER PTHR11814 SLC26/SulP transporter family
            term:
              id: PANTHER:PTHR11814
              label: SULFATE TRANSPORTER
            representative_members:
            - preferred_term: PP_0075 (Pseudomonas putida KT2440; BetE candidate)
              term:
                id: UniProtKB:Q88RQ4
                label: Choline sulfate transporter
            description: PANTHER PTHR11814 is a heterogeneous SLC26/SulP family whose bacterial members
              carry C4-dicarboxylate, bicarbonate or unknown cargo; the family name does not establish
              sulfate or choline-O-sulfate transport for this candidate.
        function:
          preferred_term: transmembrane transporter activity
          term:
            id: GO:0022857
            label: transmembrane transporter activity
          evidence:
          - source_id: PMID:21369825
            title: Inducible expression of choline sulfatase and its regulator BetR in Pseudomonas sp.
              ATCC19151.
            statement: A BetE homolog in a second Pseudomonas bet locus was identified as a STAS-domain
              permease.
            supporting_text: BetE is a permease and contains STAS domain.
          - source_id: file:interpro/panther/PTHR11814/PTHR11814-review.yaml
            title: PTHR11814 family review
            statement: The family review assesses generic transmembrane transporter activity as FAMILY_WIDE,
              from the SOUND root PAINT node PTN002483418 seeded from bacteria to mammals; no cargo is
              inherited for bacterial members such as PP_0075.
            supporting_text: Generic transmembrane transporter activity is the root PAINT assertion (PTN002483418,
              assessed SOUND), seeded from bacteria to mammals
        processes:
        - preferred_term: transmembrane transport
          term:
            id: GO:0055085
            label: transmembrane transport
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: Multi-pass transport candidate adjacent to betC. Its transported substrate and
          coupling mechanism are not established.
  - role: qualified transporter-locus candidate
    optional: true
    node:
      id: betd_binding_candidate_context
      label: BetD periplasmic binding-protein candidate
      module_type: TRANSPORT_STEP
      description: Candidate context only; this role does not satisfy the required cargo-specific COS
        import step.
      annotons:
      - id: betd_binding_candidate
        label: BetD periplasmic binding-protein candidate
        participant:
          selector_type: FAMILY
          family:
            preferred_term: choline-transporter substrate-binding family (InterPro IPR017783)
            term:
              id: NCBIfam:TIGR03414
              label: choline ABC transporter substrate-binding protein
            representative_members:
            - preferred_term: PP_0076 (Pseudomonas putida KT2440; BetD candidate)
              term:
                id: UniProtKB:Q88RQ3
                label: Choline betaine-binding protein
            description: Family assignment supports binding of a choline-related ligand, but the physiological
              ligand and transport partner are unresolved.
        function:
          preferred_term: quaternary ammonium group binding
          term:
            id: GO:0050997
            label: quaternary ammonium group binding
          evidence:
          - source_id: PMID:21369825
            title: Inducible expression of choline sulfatase and its regulator BetR in Pseudomonas sp.
              ATCC19151.
            statement: 'Architecture only: the BetD homolog of a second Pseudomonas bet locus is a PBPb-superfamily
              periplasmic binding protein. This does not by itself establish the ligand class.'
            supporting_text: BetD is part of the PBPb superfamily of periplasmic and membrane-associated
              proteins
          - source_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
            title: UniProtKB entry Q88RQ3 for Pseudomonas putida KT2440 PP_0076
            statement: PP_0076 is assigned to NCBIfam TIGR03414 and Pfam PF04069 (OpuAC), the substrate-binding-protein
              families of quaternary ammonium compatible-solute importers; this supports the ligand class
              but not choline specifically.
            supporting_text: NCBIfam; TIGR03414; ABC_choline_bnd; 1.
          - source_id: file:PSEPK/PP_0076/PP_0076-uniprot.txt
            title: UniProtKB entry Q88RQ3 for Pseudomonas putida KT2440 PP_0076
            statement: Pfam OpuAC domain assignment.
            supporting_text: Pfam; PF04069; OpuAC; 1.
        processes:
        - preferred_term: transmembrane transport
          term:
            id: GO:0055085
            label: transmembrane transport
        - preferred_term: quaternary ammonium group transport
          term:
            id: GO:0015697
            label: quaternary ammonium group transport
        locations:
        - preferred_term: periplasmic space
          term:
            id: GO:0042597
            label: periplasmic space
        role_description: Candidate periplasmic substrate-binding protein adjacent to betC; direct ligand
          binding and coupling to BetE are untested.
  - role: qualified BetT cargo-scope candidate
    optional: true
    node:
      id: ruegeria_bett_candidate_context
      label: Ruegeria BetT cargo-scope candidate
      module_type: TRANSPORT_STEP
      description: A choline-depletion phenotype and a partial COS-growth phenotype identify a pathway
        candidate. Co-transcription with betA leaves insertion polarity unresolved; neither choline nor
        COS cargo is established for this protein.
      annotons:
      - id: ruegeria_bett_candidate
        label: BetT transport candidate
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Ruegeria BetT-type membrane transport proteins with verified locus identity
            representative_members:
            - preferred_term: SPO1087 (RUEPO)
              term:
                id: UniProtKB:Q5LUG7
                label: Membrane protein, putative
              evidence:
              - source_id: file:RUEPO/SPO1087/SPO1087-ai-review.yaml
                statement: Individual review distinguishes native assay evidence, reference identity and
                  contribution to a complex.
            description: The frozen target record has no PANTHER/InterPro assignment. Its eggNOG
              COG1292 classification and the paper's BCCT-type assignment support transporter-family
              plausibility, while substrate specificity remains unresolved. No PANTHER identifier is
              invented from the BetT name.
        role_description: Optional candidate implicated by an insertion/depletion phenotype. The
          co-transcribed betA oxidation step is a possible downstream confound. No choline- or COS-import
          molecular function is asserted for this locus.
        evidence:
        - *id007
        - source_id: PMID:40801533
          title: Novel regulatory mechanism of choline-O-sulfate and choline catabolism by two BetIs in
            Alphaproteobacteria.
          statement: This later regulatory study labels BetT as a choline/COS transporter in a proposed
            diagram. Neither cargo assignment is established by the diagram; the earlier insertion/depletion
            phenotype remains confounded by the co-transcribed betA oxidation step.
          supporting_text: BetT, choline and choline-O-sulfate transporter
  connections:
  - source: choline_o_sulfate_import
    target: betc_choline_o_sulfate_hydrolysis
    connection_type: PROVIDES_INPUT_FOR
    description: Intact intracellular COS supplied by an uptake route is hydrolyzed by BetC. This order
      is established for the defined module boundary, but a utilization phenotype alone does not establish
      the compartment or order in every lineage.
    chaining_status: KNOWLEDGE_GAP
    chaining_note: Chemical substrate continuity is established. The importer gene is unresolved in the
      sampled hydrolyzing lineages; the betC-deletion uptake phenotype does not establish independence
      from BetD/BetE.
    evidence:
    - *id003
    - *id005
  knowledge_gaps:
  - gap_statement: The physiological substrate range and energy-coupling mechanism of the adjacent BetD
      and SLC26A/SulP-family BetE candidates are unresolved, as is whether they function together.
    boundary: The transport step records separate candidates and does not classify them as a complex,
      an ABC transporter, or the sole KT2440 importer.
    gap_kind:
    - BIOLOGY
  - gap_statement: Direct enzymology has not been reported for KT2440 Q88RQ2 in isolation.
    boundary: The exact BetC function is supported by the KT2440 betC phenotype, conserved choline-sulfatase
      family signatures, EC mapping, and direct ortholog biochemistry.
    gap_kind:
    - BIOLOGY
  - gap_statement: The importer for native COS hydrolysis in KT2440, Sinorhizobium and Ruegeria is not
      resolved by the evidence assembled here.
    boundary: Whole-cell uptake/metabolism can establish the role while leaving gene-level coverage unresolved.
      Candidate proteins are optional context, never replacements for demonstrated cargo-specific import.
    gap_kind:
    - BIOLOGY
references:
- id: PMID:17116241
  title: Uncoupling of choline-O-sulphate utilization from osmoprotection in Pseudomonas putida.
  full_text_unavailable: true
  findings:
  - statement: KT2440 betC is required to use choline-O-sulfate as a carbon or nitrogen source but not
      to accumulate it.
    supporting_text: This mutant still accumulated intact COS but failed to use this compound as carbon
      or nitrogen source.
    reference_section_type: ABSTRACT
  - statement: High salt downregulates betC, supporting metabolism rather than osmoprotection as its main
      KT2440 role.
