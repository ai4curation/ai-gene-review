        - BIOLOGY
    - gap_statement: >-
        Direct enzymology has not been reported for KT2440 Q88RQ2 in isolation.
      boundary: >-
        The exact BetC function is supported by the KT2440 betC phenotype,
        conserved choline-sulfatase family signatures, EC mapping, and direct
        ortholog biochemistry.
      gap_kind:
        - BIOLOGY
