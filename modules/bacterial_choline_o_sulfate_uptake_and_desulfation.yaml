- id: PMID:10717312
  title: Riding the sulfur cycle--metabolism of sulfonates and sulfate esters in gram-negative bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review, abstract inspected; full-text retrieval failed. Supports the sulfur-versus-carbon
      utilization boundary only. It does not identify a COS importer or establish a universal BetC compartment.
  findings:
  - statement: Comparative review distinguishes sulfur acquisition from carbon-skeleton catabolism. COS
