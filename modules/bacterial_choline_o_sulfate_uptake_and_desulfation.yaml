                  statement: A BetE homolog in a second Pseudomonas bet locus was identified as a STAS-domain permease.
                  supporting_text: BetE is a permease and contains STAS domain.
                - source_id: file:interpro/panther/PTHR11814/PTHR11814-review.yaml
                  title: PTHR11814 family review
                  statement: >-
                    The family review assesses generic transmembrane transporter
                    activity as FAMILY_WIDE, from the SOUND root PAINT node
