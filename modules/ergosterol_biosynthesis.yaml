id: MODULE:ergosterol_biosynthesis
title: Ergosterol biosynthesis (squalene -> lanosterol -> ergosterol)
description: >-
  Fungal sterol synthesis converts farnesyl diphosphate from the isoprenoid trunk
  into ergosterol, the principal sterol of fungal membranes, through about twenty
  reactions on the endoplasmic-reticulum membrane. The first half is shared with
  animal cholesterol synthesis. Squalene synthase reductively joins two farnesyl
  diphosphates into squalene, squalene epoxidase oxidises it to
  2,3-oxidosqualene, and lanosterol synthase cyclises that to lanosterol. The
  cytochrome P450 sterol 14alpha-demethylase (CYP51) then removes the C-14
  methyl, a Delta14-reductase saturates the resulting double bond, and a C-4
  demethylation complex removes both C-4 methyls in two rounds: a C-4
  methylsterol oxidase oxidises the methyl to a carboxylate, a
  3beta-hydroxysteroid dehydrogenase/C-4 decarboxylase releases it as CO2, and a
  3-ketosteroid reductase restores the 3beta-hydroxyl. A membrane scaffold
  (Erg28) tethers the three C-4 demethylation enzymes, yielding zymosterol. The
  ergosterol-specific tail follows. A sterol C-24 methyltransferase adds the C-28
  methyl group that animals lack. A C-8 sterol isomerase that is unrelated to the
  animal EBP isomerase moves the Delta8 bond to Delta7. A C-5 desaturase
  homologous to animal SC5D adds the Delta5 bond, a cytochrome P450 C-22
  desaturase (CYP61) adds the side-chain Delta22 bond, and a C-24(28) reductase
  completes ergosterol. The P450 steps take electrons from NADPH-cytochrome P450
  reductase, and the C-4 oxidase and C-5 desaturase use cytochrome b5, which can
  also support CYP51. The pathway is the target of the main antifungal drug
  classes: azoles (CYP51), allylamines such as terbinafine (squalene epoxidase)
  and morpholines (Delta14-reductase and C-8 isomerase).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006696
    title: ergosterol biosynthetic process
    statement: >-
      The module is grounded in the GO biological-process term for ergosterol
      biosynthesis; the shared squalene -> lanosterol segment is also covered by the
      template sterol_commitment_squalene_to_lanosterol.
  - source_id: YeastPathways:PWY3O-31704
    title: ergosterol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Main YeastCyc frame (FPP -> ergosterol) with ERG20, ERG9, ERG1, ERG7, ERG11, ERG24,
      ERG25, ERG26, ERG27, ERG6, ERG2, ERG3, ERG5 and ERG4. All catalyst assignments
      were retained. The FPP-forming ERG20 reactions belong to
      isoprenoid_diphosphate_biosynthesis. ERG28 (C-4 demethylation scaffold), NCP1
      (P450 reductase) and CYB5 (cytochrome b5) are not listed by YeastCyc and were
      added. The cytochrome b5 and P450-reductase electron carriers appear only as
      generic reactants in its ERG25, ERG3, ERG1, ERG11 and ERG5 equations.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-31704
  - source_id: YeastPathways:ERGOSTEROL-SYN-PWY-1
    title: superpathway of ergosterol biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway frame combining the mevalonate pathway, FPP synthesis and the
      ergosterol pathway; its upstream segments are the mevalonate_pathway and
      isoprenoid_diphosphate_biosynthesis modules.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ERGOSTEROL-SYN-PWY-1
  - source_id: YeastPathways:PWY-5670-1
    title: epoxysqualene biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: ERG9 (two half-reactions via presqualene diphosphate) and ERG1; the first two steps of the commitment segment.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5670-1
  - source_id: YeastPathways:PWY-6132
    title: lanosterol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: Single-reaction frame for ERG7 lanosterol synthase, folded into the commitment segment.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6132
  - source_id: YeastPathways:PWY-6074-1
    title: zymosterol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Lanosterol -> zymosterol with ERG11, ERG24 and the C-4 demethylation enzymes
      ERG25, ERG26 and ERG27; the first five tiers of the post-lanosterol segment here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6074-1
  - source_id: YeastPathways:PWY-6075-1
    title: ergosterol biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: Zymosterol -> ergosterol with ERG6, ERG2, ERG3, ERG5 and ERG4; the fungal-specific tail.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6075-1
  - source_id: PMID:8561481
    title: Physiological implications of sterol biosynthesis in yeast.
    statement: Ergosterol is the fungal counterpart of cholesterol, with distinct structural features; most antifungals act on its synthesis or function.
    supporting_text: >-
      Most of the antifungal compounds in medical and agricultural use affect some aspect
      of sterol synthesis or function.
  - source_id: PMID:8277826
    title: Sterol synthesis and viability of erg11 (cytochrome P450 lanosterol demethylase)
      mutations in Saccharomyces cerevisiae and Candida albicans.
    statement: >-
      In S. cerevisiae the tail steps C-24 methylation (ERG6), C-5 desaturation (ERG3)
      and Delta8-Delta7 isomerization (ERG2) are dispensable, whereas C-14
      demethylation (ERG11) and C-14 reduction (ERG24) are required for aerobic
      viability.
    supporting_text: >-
      C-24 methylation (ERG6), C-5 desaturation (ERG3) and delta
      8-delta 7 isomerization (ERG2) are not required, while C-14 demethylation
      (ERG11) and C-14 reduction (ERG24) are each required for aerobic viability.
  - source_id: PMID:18310029
    title: Multiple functions of ergosterol in the fission yeast Schizosaccharomyces pombe.
    statement: >-
      The S. pombe late-pathway genes erg6, erg2, erg31/erg32, erg5 and sts1/erg4 are
      required for ergosterol synthesis; erg31 and erg32 are redundant C-5 desaturases.
    supporting_text: >-
      Disruption of erg31(+) or erg32(+) did not cause ergosterol
      deficiency or tolerance to polyene drugs, indicating that the two C-5 sterol
      desaturases have overlapping functions.
  - source_id: PMID:32679672
    title: Regulation of Ergosterol Biosynthesis in Saccharomyces cerevisiae.
    statement: Review of the S. cerevisiae ergosterol pathway, its enzymes and its regulation by sterols, oxygen and iron.
  - source_id: PMID:12119386
    title: Protein-protein interactions among C-4 demethylation enzymes involved in yeast
      sterol biosynthesis.
    statement: Erg25, Erg26, Erg27 and Erg28 form an ER-membrane C-4 demethylation complex with Erg28 as scaffold.
    supporting_text: >-
      we suggest that Erg28p works
      as a transmembrane scaffold to tether Erg27p and possibly other C-4
      demethylation proteins (Erg25p, Erg26p), forming a demethylation complex in the
      endoplasmic reticulum.
  - source_id: PMID:15995173
    title: Erg28p is a key protein in the yeast sterol biosynthetic enzyme complex.
    statement: Erg28 also interacts with Erg11, Erg1 and Erg6, suggesting a larger tethered enzyme assembly.
    supporting_text: >-
      Erg28p not only
      interacted with the C-4 demethylation enzymes and Erg6p but also with Erg11p and
      Erg1p.
  - source_id: PMID:12842197
    title: In yeast sterol biosynthesis the 3-keto reductase protein (Erg27p) is required
      for oxidosqualene cyclase (Erg7p) activity.
    statement: Erg27 binds and stabilises lanosterol synthase Erg7 and is required for its activity in lipid particles.
    supporting_text: >-
      We
      demonstrate that Erg27p is required for oxidosqualene cyclase (Erg7p) activity
      in LPs
  - source_id: PMID:6163470
    title: Involvement of cytochrome b5 and a cyanide-sensitive monooxygenase in the 4-demethylation
      of 4,4-dimethylzymosterol by yeast microsomes.
    statement: Cytochrome b5 supplies electrons to C-4 demethylation but not to 14alpha-demethylation in yeast microsomes.
    supporting_text: >-
      cytochrome b5 and a cyanide-sensitive enzyme are involved in the 4-demethylation
      of 4,4-dimethylzymosterol, but not the 14 alpha-demethylation of lanosterol
  - source_id: PMID:2543395
    title: Disruption of the Saccharomyces cerevisiae gene for NADPH-cytochrome P450 reductase
      causes increased sensitivity to ketoconazole.
    statement: NCP1 deletion is viable but sensitises cells to the CYP51 inhibitor ketoconazole, implying an alternative electron supply.
    supporting_text: >-
      suggesting that an alternate pathway may provide for the
      functions of this reductase in S. cerevisiae.
  - source_id: PMID:8181746
    title: Cloning and characterization of a yeast cytochrome b5-encoding gene which suppresses
      ketoconazole hypersensitivity in a NADPH-P-450 reductase-deficient strain.
    statement: CYB5 overexpression suppresses ketoconazole hypersensitivity of a P450-reductase-deficient strain.
    supporting_text: >-
      yeast cytochrome b5-encoding gene (CYB5), which encodes a 120-amino-acid
      (aa) protein, is required and sufficient for the suppressor effect.
module:
  id: ergosterol_biosynthesis
  label: Ergosterol biosynthesis (FPP -> ergosterol)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ergosterol biosynthetic process
      term:
        id: GO:0006696
        label: ergosterol biosynthetic process
      description: Conversion of farnesyl diphosphate via squalene, lanosterol and zymosterol to ergosterol.
  context:
    taxa:
      - preferred_term: Fungi
        term:
          id: NCBITaxon:4751
          label: Fungi
        description: >-
          Ergosterol is the major sterol of most fungi; some fungi (e.g.
          Pneumocystis) do not make it, per the YeastCyc pathway comment.
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: >-
          The sterol enzymes are ER-membrane proteins; Erg7 (and to a lesser extent
          other enzymes) also resides on lipid droplets.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-31704
      title: 'ergosterol biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with ERG20, ERG9, ERG1, ERG7, ERG11, ERG24, ERG25, ERG26, ERG27,
        ERG6, ERG2, ERG3, ERG5 and ERG4 activities, all placed in cytosol and part_of
        GO:0006696, without causal edges. ERG2 (RXN3O-203) is typed only with the root
        GO:0003674. ERG28, NCP1 and CYB5 are absent.
    - model: gomodel:YeastPathways_ERGOSTEROL-SYN-PWY-1
      title: 'superpathway of ergosterol biosynthesis I - imported from: Saccharomyces Genome Database'
      description: >-
        Superpathway conversion that also contains the mevalonate and FPP-synthase
        activities. ERG2 (RXN3O-203) and ERG5 (RXN3O-9828) are typed with the root
        GO:0003674, and all activities are in cytosol.
    - model: gomodel:YeastPathways_PWY-5670-1
      title: 'epoxysqualene biosynthesis - imported from: Saccharomyces Genome Database'
      description: ERG9 (two activities) and ERG1, in cytosol, part_of GO:0016104 triterpenoid biosynthetic process.
    - model: gomodel:YeastPathways_PWY-6074-1
      title: 'zymosterol biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        ERG11, ERG24, ERG25 (five activities), ERG26 and ERG27, in cytosol, part_of
        GO:0036197. The only causal edge (RXN3O-9822 -> RXN3O-9822) loops ERG25 to
        itself.
    - model: gomodel:YeastPathways_PWY-6075-1
      title: 'ergosterol biosynthesis I - imported from: Saccharomyces Genome Database'
      description: >-
        ERG6, ERG2, ERG3, ERG5 and ERG4, in cytosol; ERG2 and ERG5 are typed only with
        the root GO:0003674.
    - model: gomodel:66c7d41500002088
      title: ergosterol biosynthetic process (GO:0006696), intracellular sterol transport (GO:0032366)
      description: >-
        PomBase S. pombe model with ER-localised, causally chained erg9 -> erg1 -> erg7 ->
        erg11 -> erg24 and erg25 -> erg26 -> erg27 -> erg6 -> erg2 -> erg31/erg32 -> erg5 ->
        erg4 activities, plus the erg28 adaptor, ccr1 (P450 reductase), the cytochromes b5
        cyb502 and oca8 with their reductase cbr1, and dap1. It lacks an erg24 -> erg25
        edge, types erg31/erg32 with GO:0000248 rather than GO:0050046, and also contains
        sterol esterification (are1, are2), steryl-acetate deacetylation (say1) and sterol
        transfer (ltc1), which lie outside this module.
  parts:
    - order: 1
      role: sterol commitment (FPP -> squalene -> lanosterol), shared with animals
      node:
        id: squalene_to_lanosterol
        label: Sterol commitment (2 FPP -> squalene -> 2,3-oxidosqualene -> lanosterol)
        module_type: METABOLIC_PATHWAY
        conforms_to:
          - template: sterol_commitment_squalene_to_lanosterol
            status: WITH_DEVIATIONS
            deviations:
              - >-
                Steps are linked by PRECEDES connections rather than the template's
                PROVIDES_INPUT_FOR; tier order and molecular functions (GO:0051996,
                GO:0004506, GO:0000250) are identical.
            notes: >-
              Same three enzymes and families as the human segment (FDFT1/SQLE/LSS =
              ERG9/ERG1/ERG7). In yeast, lanosterol synthase activity additionally
              depends on Erg27 (connection erg27_activity -> erg7_step).
        parts:
          - order: 1
            role: squalene synthesis (committed sterol step)
            node:
              id: erg9_step
              label: 2 farnesyl diphosphate + NAD(P)H to squalene (via presqualene diphosphate)
              module_type: REACTION
              annotons:
                - id: erg9_activity
                  label: squalene synthase (ERG9)
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: Squalene synthase family (FDFT1/ERG9)
                      family_terms:
                        - id: PANTHER:PTHR11626:SF2
                          label: SQUALENE SYNTHASE
                      representative_members:
                        - preferred_term: ERG9 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P29704
                            label: Squalene synthase
                        - preferred_term: erg9 (Schizosaccharomyces pombe)
                          term:
                            id: UniProtKB:P36596
                            label: Squalene synthase
                  function:
                    preferred_term: squalene synthase [NAD(P)H] activity
                    term:
                      id: GO:0051996
                      label: squalene synthase [NAD(P)H] activity
                    substrates:
                      - preferred_term: (2E,6E)-farnesyl diphosphate (x2)
                      - preferred_term: NAD(P)H
                    products:
                      - preferred_term: squalene (via presqualene diphosphate)
                      - preferred_term: diphosphate
                    evidence:
                      - source_id: EC:2.5.1.21
                        statement: squalene synthase; head-to-head condensation of two FPP via presqualene diphosphate
                      - source_id: PMID:2068081
                        title: Molecular cloning and characterization of the yeast gene for squalene
                          synthetase.
                        statement: ERG9 encodes the essential yeast squalene synthase.
                        supporting_text: >-
                          Disruption of the chromosomal squalene synthetase coding region by
                          insertional mutagenesis indicates that ERG9 is a single copy gene that is
                          essential for cell growth in yeast.
                      - source_id: PMID:3277535
                        title: Purification to homogeneity and some properties of squalene synthetase.
                        statement: The purified yeast enzyme makes squalene from FPP via presqualene diphosphate.
                        supporting_text: >-
                          This enzyme catalyzes the synthesis of squalene from
                          farnesyl diphosphate via presqualene diphosphate.
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  gocam_associations:
                    - model: gomodel:YeastPathways_PWY3O-31704
                      activity: gomodel:RXN66-281
                      title: 'ergosterol biosynthesis - imported from: Saccharomyces Genome Database'
                      description: >-
                        ERG9 presqualene diphosphate -> squalene half reaction
                        (GO:0051996); the FPP -> presqualene diphosphate half is
                        gomodel:RXN-12263.
                    - model: gomodel:66c7d41500002088
                      activity: gomodel:66c7d41500002088/66c7d41500002309
                      title: ergosterol biosynthetic process (GO:0006696), intracellular sterol transport (GO:0032366)
                      description: S. pombe erg9 enables GO:0051996 on the cytoplasmic side of the ER membrane.
                  role_description: >-
                    First committed sterol step, diverting FPP from the branched
                    isoprenoid pool (dolichol, ubiquinone, prenylation) to sterols.
          - order: 2
            role: squalene epoxidation (allylamine target)
            node:
              id: erg1_step
              label: squalene + O2 + reduced P450 reductase to (S)-2,3-epoxysqualene
              module_type: REACTION
              annotons:
                - id: erg1_activity
                  label: squalene epoxidase (ERG1)
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: Squalene monooxygenase family (SQLE/ERG1)
                      term:
                        id: PANTHER:PTHR10835:SF0
                        label: SQUALENE MONOOXYGENASE
                      representative_members:
                        - preferred_term: ERG1 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P32476
                            label: Squalene epoxidase
                        - preferred_term: erg1 (Schizosaccharomyces pombe)
                          term:
                            id: UniProtKB:Q9C1W3
                            label: Squalene epoxidase erg1
                  function:
                    preferred_term: squalene monooxygenase activity
                    term:
                      id: GO:0004506
                      label: squalene monooxygenase activity
                    substrates:
                      - preferred_term: squalene
                      - preferred_term: O2
                      - preferred_term: reduced [NADPH-hemoprotein reductase]
                    products:
                      - preferred_term: (S)-2,3-epoxysqualene (2,3-oxidosqualene)
                    evidence:
                      - source_id: EC:1.14.14.17
                        statement: squalene monooxygenase; FAD flavoprotein; electrons from NADPH-hemoprotein reductase
                      - source_id: PMID:1743514
                        title: 'The gene encoding squalene epoxidase from Saccharomyces cerevisiae: cloning
                          and characterization.'
                        statement: ERG1 was cloned from an allylamine-resistant mutant; its enzyme is the terbinafine target.
                        supporting_text: >-
                          The ERG tested in a cell-free extract from
                          one of these transformants proved to be resistant to the Al derivative,
                          terbinafine.
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  gocam_associations:
                    - model: gomodel:YeastPathways_PWY3O-31704
                      activity: gomodel:SQUALENE-MONOOXYGENASE-RXN
                      title: 'ergosterol biosynthesis - imported from: Saccharomyces Genome Database'
                      description: ERG1 enables GO:0004506 (placed in cytosol).
                    - model: gomodel:66c7d41500002088
                      activity: gomodel:66c7d41500002088/66c7d41500002123
                      title: ergosterol biosynthetic process (GO:0006696), intracellular sterol transport (GO:0032366)
                      description: S. pombe erg1 enables GO:0004506 on the ER membrane.
                  role_description: >-
                    FAD-dependent epoxidation of squalene; target of allylamine
                    antifungals (terbinafine).
          - order: 3
            role: cyclization to lanosterol
            node:
              id: erg7_step
              label: (S)-2,3-epoxysqualene to lanosterol
              module_type: REACTION
              annotons:
                - id: erg7_activity
                  label: lanosterol synthase (ERG7)
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: Lanosterol synthase subfamily of oxidosqualene cyclases (LSS/ERG7)
                      term:
                        id: PANTHER:PTHR11764:SF20
                        label: LANOSTEROL SYNTHASE
                      representative_members:
                        - preferred_term: ERG7 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P38604
                            label: Lanosterol synthase
                        - preferred_term: erg7 (Schizosaccharomyces pombe)
                          term:
                            id: UniProtKB:Q10231
                            label: Lanosterol synthase erg7
                  function:
                    preferred_term: lanosterol synthase activity
                    term:
                      id: GO:0000250
                      label: lanosterol synthase activity
                    substrates:
                      - preferred_term: (S)-2,3-epoxysqualene
                    products:
                      - preferred_term: lanosterol
                    evidence:
                      - source_id: EC:5.4.99.7
                        statement: lanosterol synthase (2,3-oxidosqualene-lanosterol cyclase)
                      - source_id: PMID:8134375
                        title: Molecular cloning, characterization, and overexpression of ERG7, the Saccharomyces
                          cerevisiae gene encoding lanosterol synthase.
                        statement: ERG7 encodes yeast lanosterol synthase.
                        supporting_text: >-
                          which encodes lanosterol synthase [(S)-2,3-epoxysqualene mutase
                          (cyclizing, lanosterol forming), EC 5.4.99.7]
                  locations:
                    - preferred_term: lipid droplet
                      term:
                        id: GO:0005811
                        label: lipid droplet
                      evidence:
                        - source_id: PMID:12842197
                          title: In yeast sterol biosynthesis the 3-keto reductase protein (Erg27p) is required
                            for oxidosqualene cyclase (Erg7p) activity.
                          statement: Erg27 promotes the association of Erg7 with lipid particles, where its activity is measured.
                          supporting_text: >-
                            facilitating the association of Erg7p with lipid particles (LPs)
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  gocam_associations:
                    - model: gomodel:YeastPathways_PWY3O-31704
                      activity: gomodel:LANOSTEROL-SYNTHASE-RXN
                      title: 'ergosterol biosynthesis - imported from: Saccharomyces Genome Database'
                      description: ERG7 enables GO:0000250 (placed in cytosol); same activity id in PWY-6132.
                    - model: gomodel:66c7d41500002088
                      activity: gomodel:66c7d41500002088/66c7d41500002130
                      title: ergosterol biosynthetic process (GO:0006696), intracellular sterol transport (GO:0032366)
                      description: S. pombe erg7 enables GO:0000250 in the ER.
                  role_description: >-
                    Polycyclization of 2,3-oxidosqualene to lanosterol, the first cyclic
                    sterol. In budding yeast Erg7 requires the C-4 3-ketoreductase Erg27
                    for stability and activity.
        connections:
          - source: erg9_step
            target: erg1_step
            connection_type: PRECEDES
            description: Squalene from ERG9 is epoxidised by ERG1.
          - source: erg1_step
            target: erg7_step
            connection_type: PRECEDES
            description: 2,3-Oxidosqualene from ERG1 is cyclised by ERG7 to lanosterol.
    - order: 2
      role: post-lanosterol demethylation and ergosterol-specific tail
      node:
        id: lanosterol_to_ergosterol
        label: Lanosterol -> zymosterol -> ergosterol
        module_type: METABOLIC_PATHWAY
        description: >-
          Tiers 1-5 (ERG11, ERG24, ERG25, ERG26, ERG27) convert lanosterol to
          zymosterol (YeastCyc PWY-6074-1, GO:0036197) and correspond to the
          demethylation core of the animal post-lanosterol pathway; tiers 6-10 (ERG6,
          ERG2, ERG3, ERG5, ERG4) are the fungal tail from zymosterol to ergosterol
          (YeastCyc PWY-6075-1).
        conforms_to:
          - template: cholesterol_synthesis_post_lanosterol
            status: WITH_DEVIATIONS
            deviations:
              - >-
                Adds the Delta14-sterol reductase tier (ERG24, GO:0050613) between
                14alpha-demethylation and C-4 methyl oxidation; the template abbreviates
                this step (TM7SF2/LBR in animals).
              - >-
                Adds the 3-ketosteroid reductase tier (ERG27, GO:0000253) after
                C-4 decarboxylation; the template abbreviates it (HSD17B7 in animals,
                not in the same PANTHER family as ERG27).
              - >-
                Adds the fungal-specific sterol C-24 methyltransferase tier (ERG6,
                GO:0003838) before Delta8-Delta7 isomerisation.
              - >-
                The Delta8-Delta7 isomerase tier has the same function term
                (GO:0000247) but is carried out by ERG2, a sigma-1-receptor-family
                protein unrelated to the animal EBP.
              - >-
                Replaces the template's terminal 7-dehydrocholesterol reductase tier
                (DHCR7, GO:0047598) with the fungal C-22 desaturase (ERG5, GO:0000249)
                and Delta24(28) reductase (ERG4, GO:0000246); fungi retain the
                Delta5,7 diene and have no DHCR7 step.
              - Steps are linked by PRECEDES rather than PROVIDES_INPUT_FOR connections.
            notes: >-
              The 14alpha-demethylase (CYP51), C-4 methyl oxidase (ERG25/MSMO1), C-4
              decarboxylase (ERG26/NSDHL) and C-5 desaturase (ERG3/SC5D) tiers are
              orthologous to the template's, with identical function terms.
        parts:
          - order: 1
            role: 14alpha-demethylation (azole target)
            node:
              id: erg11_step
              label: lanosterol to 4,4-dimethylcholesta-8,14,24-trienol + formate
              module_type: REACTION
