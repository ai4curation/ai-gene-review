  knowledge_gaps:
    - gap_statement: >-
        How Erg28 promotes C-4 demethylation is not known. It may only tether Erg25,
        Erg26 and Erg27 in the ER membrane, or it may also position the sterol
        intermediates or change enzyme activity. erg28 deletion causes a partial block
        and slow growth rather than the auxotrophy seen for the catalytic subunits, and
        the evidence for the scaffold model is co-immunoprecipitation and split-ubiquitin
        interaction data.
      boundary: >-
        Erg28 is modelled as a non-catalytic adaptor annoton (GO:0030674) in the
        C-4 methyl-oxidation step; no catalytic function is asserted.
      gap_kind:
        - BIOLOGY
  notes: >-
    New module that merges six YeastCyc frames into one pathway, from FPP to ergosterol:
    ERGOSTEROL-SYN-PWY-1 (superpathway), PWY3O-31704, PWY-5670-1 (epoxysqualene), PWY-6132
    (lanosterol), PWY-6074-1 (zymosterol) and PWY-6075-1 (ergosterol I). The mevalonate and
    FPP-synthase segments of the superpathway are the separate mevalonate_pathway and
    isoprenoid_diphosphate_biosynthesis modules. The ERG10 review places ERG10 in the
    mevalonate segment that feeds this pathway. Structure. Part 1 (ERG9, ERG1, ERG7)
    conforms to sterol_commitment_squalene_to_lanosterol with identical tier functions;
    the only deviation is the connection type. Part 2 is one ordered 10-tier
    post-lanosterol bundle that conforms with deviations to
    cholesterol_synthesis_post_lanosterol. The shared core is CYP51 (ERG11), the C-4 methyl
    oxidase (ERG25 = MSMO1), the C-4 decarboxylase (ERG26 = NSDHL), a functionally
    equivalent but nonhomologous Delta8-Delta7 isomerase (ERG2 vs EBP) and the C-5
    desaturase (ERG3 = SC5D). The fungal-specific steps are ERG6 (C-24 methylation), ERG5
    (CYP61 C-22 desaturation) and ERG4 (Delta24(28) reduction), which replaces the animal
    DHCR7. ERG24 and ERG27 are explicit tiers here but abbreviated in the template. YeastCyc
    corrections. ERG28 (C-4 demethylation scaffold), NCP1 (P450 reductase) and CYB5
    (cytochrome b5) were added; YeastCyc does not list them. The three ERG28-family and
    C-4 complex members are grounded on PMID:12119386, PMID:15522820 and PMID:11160377. DAP1
    (heme-binding stabiliser of Erg11, PMID:15713626) is recorded here as a regulator but
    not modelled as a part. Compartments: YeastCyc-derived GO-CAMs place every activity in
    cytosol. Here the enzymes are on the ER membrane, and Erg7 is also on lipid droplets
    (PMID:12842197). Ordering: ERG6 acts on zymosterol after C-4 demethylation, and ERG3 ->
    ERG5 -> ERG4 is the canonical YeastCyc order.
    GO-CAM disagreements: (1) all SGD conversions use cytosol; (2) ERG2 (RXN3O-203) is typed
    GO:0003674 everywhere and ERG5 (RXN3O-9828) is typed GO:0003674 in PWY-6075-1 and the
    superpathway; (3) PWY-6074-1 has a self-loop causal edge on RXN3O-9822; (4) the PomBase
    model types the C-5 desaturases erg31/erg32 with GO:0000248 "C-5 sterol desaturase
    activity", whose GO definition actually describes the C-22 desaturation (ERG5) reaction
    (5,7,24(28)-ergostatrienol -> 5,7,22,24(28)-ergostatetraenol); GO:0050046 is the correct
    Delta7-sterol 5(6)-desaturase term and is used here (raise with GO); (5) the PomBase model
    lacks an erg24 -> erg25 causal edge and wires cytochrome b5 only to erg31/erg32, not to
    erg25. Sterol esterification (ARE1/ARE2), steryl acetate deacetylation (SAY1) and sterol
    transport (LTC1 etc.), which are in the PomBase model, are outside this module.
