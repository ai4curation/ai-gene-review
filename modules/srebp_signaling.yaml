id: MODULE:srebp_signaling
title: SREBP signaling — sterol-regulated ER-to-Golgi escort and two-step cleavage of SREBP; SCAP/INSIG/MBTPS1/MBTPS2/SREBF1/SREBF2
description: >-
  The SREBP pathway couples membrane sterol levels to transcription of the genes for
  cholesterol and fatty-acid synthesis and LDL uptake. SREBP precursors (SREBF1 and
  SREBF2) are ER-membrane proteins whose N-terminal basic helix-loop-helix leucine-zipper
  transcription factor domain is held on the cytosolic face of the ER. Their C-terminal
  regulatory domain binds the WD-repeat domain of SCAP, which carries a sterol-sensing
  domain and escorts SREBP from the ER to the Golgi in COPII vesicles. When ER cholesterol
  is high, cholesterol binding to SCAP and oxysterol (25-hydroxycholesterol) binding to the
  ER-resident INSIG proteins (INSIG1, INSIG2) lock SCAP-SREBP into an INSIG-bound complex
  that the COPII coat cannot recognise, so SREBP stays in the ER. When sterols fall, SCAP is
  released, SCAP-SREBP is packaged into COPII vesicles and moves to the Golgi. There
  SREBP is cleaved sequentially: site-1 protease (MBTPS1, a subtilisin-like serine
  protease) cuts in the luminal loop, and site-2 protease (MBTPS2, an intramembrane zinc
  metalloprotease) then cuts within the first transmembrane segment. The released
  N-terminal fragment enters the nucleus and activates genes bearing sterol regulatory
  elements, including HMGCR, LDLR and INSIG1 itself, closing a negative feedback loop.
  In mammals SREBF2 preferentially drives cholesterol synthesis, the SREBF1c transcript
  fatty-acid synthesis, and SREBF1a both.
status: DRAFT
evidence:
  - source_id: PW:0000753
    title: sterol regulatory element-binding protein signaling pathway
    statement: >-
      The module boundary and its seven gene products follow the RGD interactive diagram
      for this Pathway Ontology term. The diagram draws SCAP associated with Srebf1/2,
      Insig2 associated with Scap and with 25-hydroxycholesterol, cholesterol associated
      with Scap, Mbtps1 and Mbtps2 acting on "Srebf at Golgi", and "translocated Srebf"
      acting on SREBF targets and the cholesterol and fatty-acid biosynthetic pathways.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000753.yaml).
  - source_id: GO:0032933
    title: SREBP signaling pathway
    statement: >-
      The module is grounded in GO SREBP signaling pathway, which is also the lexical
      exact match for PW:0000753 in the project's PW->GO candidate mappings.
  - source_id: GO:0032937
    title: SREBP-SCAP-Insig complex
    statement: >-
      The sterol-retained state is the INSIG-bound SCAP-SREBP complex.
  - source_id: GO:0031293
    title: membrane protein intracellular domain proteolysis
    statement: >-
      Release of the SREBP transcription factor domain by site-1 then site-2 cleavage is
      regulated intramembrane proteolysis.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000753 as the pilot for the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route. The RGD diagram supplied the
  boundary, members and topology; GO terms were then chosen against each protein's
  experimental GO annotations in QuickGO (SCAP sterol binding GO:0032934 ISS; INSIG1 and
  INSIG2 oxysterol binding GO:0008142 IDA and protein sequestering activity GO:0140311
  IDA; MBTPS1 serine-type endopeptidase activity GO:0004252 IDA/EXP; MBTPS2
  metalloendopeptidase activity GO:0004222 EXP; SREBF1 DNA-binding transcription
  activator activity, RNA polymerase II-specific GO:0001228 IDA). SCAP's escort role has
  no specific GO molecular-function term; it is described in prose on the transport step
  and carried by sterol binding. None of the seven genes has a gene review yet, and
  PANTHER family ids are deliberately omitted (gene products are named directly) until
  their families are checked against the PANTHER member index. Downstream SREBP target
  genes (HMGCR, LDLR, FASN and others) are outputs, not parts, of this module; the
  cholesterol and fatty-acid biosynthesis modules are its downstream neighbours.
module:
  id: srebp_signaling
  label: SREBP signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: SREBP signaling pathway
      term:
        id: GO:0032933
        label: SREBP signaling pathway
      description: >-
        Sterol-regulated ER-to-Golgi transport and two-step proteolytic activation of
        SREBP transcription factors.
  context:
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
      - preferred_term: Golgi membrane
        term:
          id: GO:0000139
          label: Golgi membrane
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: sterol sensing and ER retention
      node:
        id: srebp_sterol_retention
        label: Sterol-dependent retention of SCAP-SREBP by INSIG in the ER
        module_type: REGULATORY_STEP
        description: >-
          Cholesterol bound to SCAP's sterol-sensing domain and 25-hydroxycholesterol bound
          to INSIG promote formation of the INSIG-SCAP-SREBP complex, which hides SCAP's
          COPII sorting signal and holds SREBP in the ER.
        annotons:
          - id: scap_sterol_sensing
            label: SCAP sterol sensing
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SCAP
                term:
                  id: UniProtKB:Q12770
                  label: Sterol regulatory element-binding protein cleavage-activating protein
            function:
              preferred_term: sterol binding
              term:
                id: GO:0032934
                label: sterol binding
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Senses ER cholesterol; cholesterol binding switches SCAP into the INSIG-binding
              conformation.
          - id: insig_retention
            label: INSIG oxysterol-dependent retention of SCAP-SREBP
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INSIG1
                term:
                  id: UniProtKB:O15503
                  label: Insulin-induced gene 1 protein
            function:
              preferred_term: protein sequestering activity
              term:
                id: GO:0140311
                label: protein sequestering activity
              targets:
                - preferred_term: SCAP-SREBP complex
            processes:
              - preferred_term: negative regulation of SREBP signaling pathway
                term:
                  id: GO:2000639
                  label: negative regulation of SREBP signaling pathway
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              ER-resident brake; oxysterol-bound INSIG binds SCAP and keeps SCAP-SREBP in
              the ER.
          - id: insig2_retention
            label: INSIG2 oxysterol-dependent retention of SCAP-SREBP
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INSIG2
                term:
                  id: UniProtKB:Q9Y5U4
                  label: Insulin-induced gene 2 protein
            function:
              preferred_term: oxysterol binding
              term:
                id: GO:0008142
                label: oxysterol binding
            processes:
              - preferred_term: negative regulation of SREBP signaling pathway
                term:
                  id: GO:2000639
                  label: negative regulation of SREBP signaling pathway
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Constitutively expressed INSIG paralog; binds 25-hydroxycholesterol and SCAP
              (the Insig2 edges drawn on the RGD diagram).
    - order: 2
      role: ER-to-Golgi escort
      node:
        id: srebp_er_golgi_transport
        label: SCAP-escorted COPII transport of SREBP from ER to Golgi
        module_type: TRANSPORT_STEP
        description: >-
          With sterols low, SCAP is released from INSIG; its sorting signal is recognised
          by the COPII coat and SCAP-SREBP is carried to the Golgi.
        annotons:
          - id: scap_escort
            label: SCAP escort of SREBP to the Golgi
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SCAP
                term:
                  id: UniProtKB:Q12770
                  label: Sterol regulatory element-binding protein cleavage-activating protein
            processes:
              - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
                term:
                  id: GO:0006888
                  label: endoplasmic reticulum to Golgi vesicle-mediated transport
            role_description: >-
              Binds the SREBP C-terminal regulatory domain through its WD-repeat domain
              and carries it into COPII vesicles.
    - order: 3
      role: site-1 cleavage
      node:
        id: srebp_site1_cleavage
        label: Site-1 protease (MBTPS1) cleavage of SREBP in the Golgi lumen
        module_type: REACTION
        description: >-
          MBTPS1, a subtilisin-like serine protease, cuts SREBP in its luminal loop,
          separating the two transmembrane halves.
        annotons:
          - id: mbtps1_s1p
            label: MBTPS1 site-1 protease activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MBTPS1
                term:
                  id: UniProtKB:Q14703
                  label: Membrane-bound transcription factor site-1 protease
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              targets:
                - preferred_term: SREBP luminal loop
            locations:
              - preferred_term: Golgi membrane
                term:
                  id: GO:0000139
                  label: Golgi membrane
            role_description: First, luminal cleavage of SREBP.
    - order: 4
      role: site-2 cleavage
      node:
        id: srebp_site2_cleavage
        label: Site-2 protease (MBTPS2) intramembrane cleavage of SREBP
        module_type: REACTION
        description: >-
          MBTPS2, an intramembrane zinc metalloprotease, cuts the N-terminal half within its
          transmembrane segment and releases the transcription factor domain to the
          cytosol.
        annotons:
          - id: mbtps2_s2p
            label: MBTPS2 site-2 protease activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MBTPS2
                term:
                  id: UniProtKB:O43462
                  label: Membrane-bound transcription factor site-2 protease
            function:
              preferred_term: metalloendopeptidase activity
              term:
                id: GO:0004222
                label: metalloendopeptidase activity
              targets:
                - preferred_term: SREBP N-terminal transmembrane segment
            processes:
              - preferred_term: membrane protein intracellular domain proteolysis
                term:
                  id: GO:0031293
                  label: membrane protein intracellular domain proteolysis
            locations:
              - preferred_term: Golgi membrane
                term:
                  id: GO:0000139
                  label: Golgi membrane
            role_description: Second, intramembrane cleavage that frees the SREBP N-terminus.
    - order: 5
      role: nuclear transcriptional output
      node:
        id: srebp_transcription
        label: Nuclear SREBP activation of sterol-regulatory-element genes
        module_type: REGULATORY_STEP
        description: >-
          The released N-terminal bHLH-LZ fragment of SREBF1 or SREBF2 enters the nucleus
          and activates SRE-containing genes of cholesterol and fatty-acid synthesis and LDL
          uptake, including INSIG1.
        annotons:
          - id: srebf1_tf
            label: SREBF1 transcription activation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SREBF1
                term:
                  id: UniProtKB:P36956
                  label: Sterol regulatory element-binding protein 1
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Mainly fatty-acid synthesis genes (SREBF1c transcript) and both arms (SREBF1a).
          - id: srebf2_tf
            label: SREBF2 transcription activation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SREBF2
                term:
                  id: UniProtKB:Q12772
                  label: Sterol regulatory element-binding protein 2
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Mainly cholesterol synthesis and uptake genes.
  connections:
    - source: srebp_sterol_retention
      target: srebp_er_golgi_transport
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Sterol-bound SCAP and INSIG hold SCAP-SREBP in the ER and block COPII loading.
    - source: srebp_er_golgi_transport
      target: srebp_site1_cleavage
      connection_type: PROVIDES_INPUT_FOR
      description: Delivers SREBP to the Golgi, where MBTPS1 resides.
    - source: srebp_site1_cleavage
      target: srebp_site2_cleavage
      connection_type: PROVIDES_INPUT_FOR
      description: Site-1 cleavage produces the intermediate that MBTPS2 can cut.
    - source: srebp_site2_cleavage
      target: srebp_transcription
      connection_type: PROVIDES_INPUT_FOR
      description: Releases the nuclear N-terminal SREBP fragment.
    - source: srebp_transcription
      target: srebp_sterol_retention
      connection_type: POSITIVELY_REGULATES
      description: SREBP induces INSIG1 transcription, closing the negative feedback loop.
