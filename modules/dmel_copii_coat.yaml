id: MODULE:dmel_copii_coat
title: COPII coat in Drosophila melanogaster
description: >-
  The COPII coat forms vesicles and tubules that export secretory cargo from endoplasmic reticulum
  exit sites to the Golgi apparatus. The small GTPase Sar1, activated by its ER-membrane exchange
  factor, inserts into the membrane and recruits the inner coat, a heterodimer of Sec23 and
  Sec24. Sec24 binds cargo sorting signals, and Sec23 is the GTPase-activating protein for
  Sar1. The inner coat then recruits the outer coat of Sec13 and Sec31, which forms a cage
  around the bud and stimulates Sec23 GAP activity. Drosophila has two Sec24 paralogs, Sec24AB
  and Sec24CD.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000116
  title: 'FlyBase gene group COPII: Coat protein complex ii'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as coat protein complex ii (COPII);
    this module models that group.
- source_id: GO:0030127
  title: COPII vesicle coat
  statement: >-
    GO term grounding the module as COPII vesicle coat.
notes: >-
  Boundary. The module contains Sar1 and the inner and outer coat proteins. The Sar1 exchange
  factor (Sec12 homolog), Sec16 and the TANGO1 machinery for large cargo organize exit sites
  and are context, not parts. The two Sec24 paralogs are modelled as alternative inner-coat
  variants; their cargo preferences in Drosophila are not fully mapped. FlyBase groups realized
  by this module: COPII (FBgg0000116). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_copii_coat.yaml; none of the member genes has a gene review yet unless
  noted.
