id: MODULE:dmel_wash_complex
title: WASH complex in Drosophila melanogaster
description: >-
  The WASH complex is a five-subunit regulatory complex on endosomes that activates the Arp2/3
  complex to build branched actin patches on endosomal membranes. These patches help sort
  cargo into recycling tubules in cooperation with retromer. The subunits are WASH (wash),
  FAM21, CCDC53, SWIP and Strumpellin (Strump). WASH carries the C-terminal VCA domain that
  activates Arp2/3, and FAM21 links the complex to retromer and to capping protein. Drosophila
  wash mutant hemocytes are defective in lysosomal neutralization.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000508
  title: 'FlyBase gene group WASH-C: Wasp and scar homolog complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as wasp and scar homolog complex
    (WASH-C); this module models that group.
- source_id: GO:0071203
  title: WASH complex
  statement: >-
    GO term grounding the module as WASH complex.
notes: >-
  Decomposition. No subcomplex is modelled; each subunit is a part. Only the WASH subunit
  carries the Arp2/3-activating VCA domain. The Arp2/3 complex and retromer are partners,
  not parts. FlyBase groups realized by this module: WASH-C (FBgg0000508). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_wash_complex.yaml; none of the member genes has a gene review yet
  unless noted.
