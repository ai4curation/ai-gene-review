id: MODULE:collagen_ddr_signaling
title: Collagen-activated tyrosine kinase receptor (DDR1/DDR2) signaling pathway module
description: >-
  The collagen-activated tyrosine kinase receptor signaling pathway (GO:0038063) transduces
  extracellular matrix structural and mechanical cues into epithelial and mesenchymal cells via
  the discoidin domain receptor tyrosine kinases DDR1 (PANTHER:PTHR24416:SF333) and DDR2
  (PANTHER:PTHR24416:SF295). Native triple-helical fibrillar collagens — including type I
  collagen heterotrimers ([alpha-1(I)]2[alpha-2(I)], encoded by COL1A1 PANTHER:PTHR24023:SF1082
  and COL1A2 PANTHER:PTHR24023:SF568), type II collagen homotrimers (COL2A1
  PANTHER:PTHR24023:SF58), and type III collagen homotrimers (COL3A1 PANTHER:PTHR24023:SF604)
  — present conserved triple-helical motifs (such as GVMGFO) in the extracellular matrix
  (GO:0031012) that act as insoluble receptor ligands (GO:0048018). Engagement of the
  extracellular discoidin domains of preformed DDR1 and DDR2 homodimers at the plasma membrane
  (GO:0005886) triggers slow, sustained receptor tyrosine kinase autophosphorylation
  (GO:0038062) and recruitment of phosphotyrosine-binding and SH2-domain signaling effectors
  including SHC1 (PANTHER:PTHR10337:SF2) and SHP-2 / PTPN11 (PANTHER:PTHR46559:SF1), regulating
  cell adhesion, migration, proliferation, and matrix metalloproteinase-mediated extracellular
  matrix remodeling.
status: DRAFT
evidence:
  - source_id: GO:0038063
    title: collagen-activated tyrosine kinase receptor signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the collagen-activated
      tyrosine kinase receptor signaling pathway (GO:0038063: the series of molecular signals
      initiated by collagen binding to a receptor tyrosine kinase on the surface of a target
      cell).
  - source_id: Reactome:R-HSA-2327738
    title: DDR1 binds collagen type I, II, III, IV, V, XI fibrils
    supporting_text: >-
      Discoidin domain receptors (DDRs) are a subfamily of receptor tyrosine kinases, the only
      members known to respond to an ECM component. DDR1 binds several of the major fibrillar
      collagens (types I, II, III, and V) and the non-fibrillar collagen IV (Shrivastava et al.
      1997, Vogel et al. 1997, Hou et al. 2001). DDR proteins bind collagen as dimers (Leitinger
      2003, 2011).
    statement: >-
      Establishes direct binding of native fibrillar collagens (types I, II, III, V) and
      collagen IV to DDR1 receptor tyrosine kinase dimers.
  - source_id: Reactome:R-HSA-2465890
    title: DDR2 binds collagen type I, II, III, V, X fibrils
    supporting_text: >-
      Discoidin domain receptors (DDRs) are a subfamily of receptor tyrosine kinases, the only
      members known to respond to an ECM component. DDR2 binds the major fibrillar collagens
      types I, II, III, and V) and the non-fibrillar collagen X (Shrivastava et al. 1997,
      Vogel et al. 1997, Leitinger & Kwan 2006).
    statement: >-
      Establishes direct binding of native fibrillar collagens (types I, II, III, V) to DDR2
      receptor tyrosine kinase dimers.
  - source_id: PANTHER:PTN009074843
    title: PAINT node PTN009074843 for major fibrillar collagens (PTHR24023)
    statement: >-
      Local PAINT IBD node in PTHR24023 with propagated term P:GO:0030199 (collagen fibril
      organization); PAINT date 20251220.
notes: >-
  Curated signaling-pathway module for the collagen-activated tyrosine kinase receptor signaling
  pathway (GO:0038063) built with PANTHER FAMILY/subfamily selectors across the major fibrillar
  collagen ligands COL1A1 (PANTHER:PTHR24023:SF1082), COL1A2 (PANTHER:PTHR24023:SF568), COL2A1
  (PANTHER:PTHR24023:SF58), and COL3A1 (PANTHER:PTHR24023:SF604), the discoidin domain receptor
  tyrosine kinases DDR1 (PANTHER:PTHR24416:SF333) and DDR2 (PANTHER:PTHR24416:SF295), and
  downstream phosphotyrosine-binding effectors SHC1 (PANTHER:PTHR10337:SF2) and PTPN11
  (PANTHER:PTHR46559:SF1).
