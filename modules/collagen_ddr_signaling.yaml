knowledge_gaps:
  - gap_statement: Which endogenous collagen activates Ddr in invertebrates is not known. In
      Drosophila the only evidence is a dominant genetic interaction between Ddr and Multiplexin
      (collagen XV/XVIII homologue); whether Multiplexin or collagen IV (Col4a1/viking) binds and
      activates Ddr has not been tested. Dipteran Ddr is moreover a predicted pseudokinase (lost
      beta3 lysine, catalytic-loop asparagine and DFG aspartate; genes/DROME/Ddr), so whether it
      signals as a collagen receptor at all, and how, is open.
    boundary: It is established that vertebrate DDR1 and DDR2 bind and are activated by native
      fibrillar collagens, that DDR1 binds collagen IV and DDR2 collagen X, and that Drosophila Ddr
      and Multiplexin interact genetically in axon ensheathment.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: Without a biochemically defined invertebrate ligand, the ligand step of this
      pan-eumetazoan module is grounded only by vertebrate collagens, and the fly pathway cannot be
      checked for a ligand.
    provenance:
      - reference_id: PMID:36355066
