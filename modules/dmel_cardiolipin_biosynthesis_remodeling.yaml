id: MODULE:dmel_cardiolipin_biosynthesis_remodeling
title: Cardiolipin biosynthesis and remodelling in Drosophila melanogaster
description: >-
  Cardiolipin is the signature phospholipid of the inner mitochondrial membrane, where it
  supports respiratory chain complexes and cristae structure. It is made in mitochondria from
  CDP-diacylglycerol: Pgs1 forms phosphatidylglycerol phosphate, the phosphatase Ptpmt1 dephosphorylates
  it to phosphatidylglycerol, and cardiolipin synthase (Cls) joins phosphatidylglycerol with
  a second CDP-diacylglycerol to make nascent cardiolipin. Nascent cardiolipin is then remodelled:
  a lipase removes an acyl chain to form monolysocardiolipin, and the transacylase tafazzin
  (Taz) transfers an acyl chain from another phospholipid to monolysocardiolipin, giving cardiolipin
  its mature acyl composition. ABHD18 deacylates cardiolipin in flies and mice, and the calcium-independent
  phospholipase A2 iPLA2-VIA has also been implicated in cardiolipin deacylation. Loss of
  tafazzin causes monolysocardiolipin to accumulate and models Barth syndrome in flies.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002238
  title: 'FlyBase gene group CARLIPB: Cardiolipin biosynthesis and remodelling'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as cardiolipin biosynthesis and
    remodelling (CARLIPB); this module models that group.
- source_id: GO:0032049
  title: cardiolipin biosynthetic process
  statement: >-
    GO term grounding the module as cardiolipin biosynthetic process.
- source_id: GO:0035965
  title: cardiolipin acyl-chain remodeling
  statement: >-
    GO term grounding the module as cardiolipin acyl-chain remodeling.
- source_id: PMID:40378955
  title: ABHD18 degrades cardiolipin by stepwise hydrolysis of fatty acids.
  statement: >-
    Shows that ABHD18 is a cardiolipin lipase in mice and flies and that its inactivation
    in Drosophila raises cardiolipin and suppresses deacylated cardiolipin accumulation in
    tafazzin-deficient flies.
  supporting_text: >-
    Our data demonstrate that ABHD18 is the elusive lipase that hydrolyzes CL in mice and
    flies and presumably in other organisms.
notes: >-
  Boundary. The module covers the six FlyBase members. CDP-diacylglycerol synthesis (CdsA)
  is upstream context. No GO molecular function term specifically describes tafazzin transacylase
  activity or ABHD18 cardiolipin deacylase activity, so these are left unassigned. Pgs1 has
  no UniProt entry in the FlyBase mapping and is grounded to its FlyBase gene id. FlyBase
  groups realized by this module: CARLIPB (FBgg0002238). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cardiolipin_biosynthesis_remodeling.yaml; none of the member genes
  has a gene review yet unless noted.
