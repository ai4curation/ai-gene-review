id: MODULE:phage_filamentous_extrusion
title: Filamentous bacteriophage non-lytic virion assembly and trans-envelope extrusion
description: A reusable module representing the chronic, non-lytic virion assembly and trans-envelope
  extrusion pathway of filamentous single-stranded DNA bacteriophages (Inoviridae, exemplified by Ff coliphages
  M13, fd, and f1). Unlike lytic phages that assemble capsids in the cytoplasm and lyse the host, filamentous
  phages package progeny circular (+)ssDNA into a left-handed helical nucleoprotein complex with the dimeric
  ssDNA-binding protein pV in the cytoplasm, store all five structural coat proteins (pVIII, pIII, pVI,
  pVII, pIX) as integral inner-membrane proteins, and continuously extrude mature filaments across both
  bacterial membranes without killing the host cell (GO:0099045 viral extrusion). Extrusion is driven
  by a trans-envelope assembly nanomachine comprising the inner-membrane ATPase motor complex pI/pXI (encoded
  by gene I via full-length translation and internal initiation) coupled across the periplasm to the gated
  outer-membrane secretin channel pIV. Assembly initiates when the packaging hairpin of the pV-ssDNA complex
  is recognized at the pI/pXI motor and capped by the distal tip proteins pVII and pIX, proceeds via ATP-
  and proton-motive-force-driven replacement of cytoplasmic pV dimers by ~2,700 membrane-embedded major
  coat subunits pVIII, and terminates when the proximal tip complex pVI-pIII caps the trailing end and
  releases the virion through the pIV secretin pore.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0099045
  title: viral extrusion
  statement: Ontology grounding for non-lytic filamentous phage release by continuous extrusion across
    the host cell envelope.
- source_id: file:genes/BPM13/I/I-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03656 (G1P_BPM13)
  statement: Establishes that M13 gene I encodes the inner-membrane isoforms G1P (pI) and G11P (pXI),
    which form a pore-like oligomeric ATP-hydrolyzing complex with outer-membrane G4P (pIV) through which
    the phage is assembled and extruded.
  supporting_text: Part of a viral G1P-G11P-G4P transmembrane assembly machine, through which the phage
    is assembled and extruded (PubMed:35746635). Together with G11P, generates an oligomeric structure
    with a pore-like inner cavity and an ATP hydrolyzing domain (PubMed:35746635).
- source_id: file:genes/BPM13/IV/IV-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03665 (G4P_BPM13)
  statement: Establishes that M13 pIV (G4P) is a secretin-family outer-membrane channel that interacts
    via its periplasmic N-terminus with inner-membrane G1P/G11P to span both host membranes.
  supporting_text: Interacts (via N-terminus) with G1P/G11P; this interaction allows the formation of
    the transmembrane assembly machine that spans the host inner and outer membranes (By similarity).
