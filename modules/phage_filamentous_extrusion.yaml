  notes: 'Exemplar phages: Enterobacteria phage M13 (NCBITaxon:1977402): Canonical F-pilus-specific filamentous
    coliphage (Inoviridae) whose 9 genes (encoding 11 proteins pI-pXI) execute chronic non-lytic extrusion
    via the pI/pXI-pIV trans-envelope assembly machine.'
