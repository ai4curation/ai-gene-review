  connections:
  - source: pV_ssdna_sequestration
    target: pVII_pIX_tip_initiation
    connection_type: PROVIDES_INPUT_FOR
    description: The pV-coated (+)ssDNA nucleoprotein filament presents the exposed packaging hairpin
      to initiate assembly with pVII and pIX at the inner membrane.
  - source: pVII_pIX_tip_initiation
    target: pI_pXI_pVIII_elongation
    connection_type: PROVIDES_INPUT_FOR
    description: Initiation by pVII-pIX nucleates progressive replacement of pV by membrane-stored pVIII
      subunits driven by the pI/pXI motor.
  - source: pI_pXI_pVIII_elongation
    target: pVI_pIII_termination
    connection_type: PROVIDES_INPUT_FOR
    description: Once the entire ssDNA circle is coated with pVIII, pVI and pIII cap the trailing proximal
      tip and sever the virion from the inner membrane.
  - source: pI_pXI_pVIII_elongation
    target: pIV_secretin_transit
    connection_type: PROVIDES_INPUT_FOR
    description: The elongating filament is threaded directly from the inner-membrane pI/pXI motor into
      the coupled periplasmic/outer-membrane pIV secretin channel.
  - source: pVI_pIII_termination
    target: pIV_secretin_transit
    connection_type: PROVIDES_INPUT_FOR
    description: Proximal tip capping by pVI-pIII releases the completed virion to exit through the pIV
      secretin pore.
  context:
    taxa:
    - preferred_term: Inoviridae
      term:
