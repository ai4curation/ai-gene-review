id: MODULE:floral_organ_identity_abce
title: ABCE model of floral organ identity (MADS floral quartets)
description: >-
  In the eudicot flower, four concentric whorls of organs (sepals, petals,
  stamens and carpels) get their identities from overlapping homeotic gene
  activities, as described by the ABC model and its later ABCE extension. In
  Arabidopsis thaliana the A function is supplied by APETALA1 (AP1, a MIKC-type
  MADS-domain transcription factor) and APETALA2 (AP2, an AP2/ERF-domain
  transcriptional repressor). The B function is supplied by the obligate
  MADS heterodimer APETALA3/PISTILLATA (AP3/PI) and the C function by AGAMOUS
  (AG). The E function is supplied redundantly by the four SEPALLATA MADS
  proteins (SEP1-SEP4). A alone specifies sepals (whorl 1), A+B petals (whorl 2),
  B+C stamens (whorl 3) and C carpels (whorl 4). E activity is required for B
  and C function: sep1 sep2 sep3 flowers make only sepals, and sep1 sep2 sep3
  sep4 flowers make only leaf-like organs. At the molecular level, the floral
  quartet model proposes that each organ identity is set by a distinct
  tetrameric MADS complex. Two MADS dimers bind two CArG boxes and loop the DNA
  between them, with SEP proteins (above all SEP3) acting as the
  tetramerization hub. Expressing A or C together with B and E genes is enough
  to turn leaves into petal-like or stamen-like organs. A and C are mutually
  antagonistic. AP2 confines AG to the inner two whorls by recruiting the
  TOPLESS/HDA19 co-repressor, while AG excludes AP1 from the inner whorls. The
  SEP3-AG tetramer also terminates the floral meristem after carpel initiation.
  Floral meristem identity (LEAFY, AP1 meristem function, CAULIFLOWER,
  FRUITFULL, TERMINAL FLOWER1) is a separate, upstream module. LEAFY is cited
  here only as an activator of the B and C genes. The D-class ovule identity
  genes (STK/SHP) and the downstream organ differentiation programs are also
  outside this boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:1685111
    title: Genetic interactions among floral homeotic genes of Arabidopsis.
    statement: >-
      Classic ABC field model: AP2 acts in the two outer whorls, AP3/PI in whorls
      two and three, and AG in the two inner whorls. AP2 and AG act
      antagonistically.
    supporting_text: >-
      the products of these homeotic genes are each active in fields occupying
      two adjacent whorls, AP2 in the two outer whorls, PI and AP3 in whorls two
      and three, and AG in the two inner whorls
  - source_id: PMID:10821278
    title: B and C floral organ identity functions require SEPALLATA MADS-box genes.
    statement: The SEP genes define the E function required for B and C activity.
    supporting_text: >-
      Here we show that the activities of the B and C organ-identity genes
      require the activities of three closely related and functionally
      redundant MADS-box genes, SEPALLATA1/2/3 (SEP1/2/3).
  - source_id: PMID:15530395
    title: The SEP4 gene of Arabidopsis thaliana functions in floral organ and meristem
      identity.
    statement: >-
      SEP4 adds to the E function. Quadruple sep mutants convert all floral
      organs, including sepals, into leaf-like organs.
    supporting_text: >-
      floral organs are converted into leaf-like organs in sep1 sep2 sep3 sep4
      quadruple mutants, indicating the involvement of all four SEP genes in the
      development of sepals.
  - source_id: PMID:11206550
    title: Complexes of MADS-box proteins are sufficient to convert leaves into floral
      organs.
    statement: >-
      ABC proteins form ternary and quaternary complexes through SEP3, and these
      complexes are sufficient to convert leaves into petaloid or staminoid organs.
    supporting_text: >-
      Our findings indicate that the formation of ternary and quaternary
      complexes of ABC proteins may be the molecular basis of the ABC model
  - source_id: PMID:11231153
    title: Conversion of leaves into petals in Arabidopsis.
    statement: SEP plus A and B genes are sufficient for petal identity.
    supporting_text: >-
      Here we show that the combined action of the SEP genes, together with the A
      and B genes, is sufficient to convert leaves into petals.
  - source_id: PMID:27624831
    title: 'MADS-domain transcription factors and the floral quartet model of flower
      development: linking plant development and evolution.'
    statement: Review of the floral quartet model.
    supporting_text: >-
      The floral quartet model of floral organ specification poses that different
      tetramers of MIKC-type MADS-domain transcription factors control gene
      expression and hence the identity of floral organs during development.
  - source_id: PMID:22238427
    title: Characterization of MADS-domain transcription factor complexes in Arabidopsis
      flower development.
    statement: AP1, AP3, PI, AG and SEP3 form complexes in floral tissue in vivo.
    supporting_text: >-
      five major floral homeotic MADS-domain proteins (AP1, AP3, PI, AG, and
      SEP3) interact in floral tissues as proposed in the "floral quartet"
      model.
module:
  id: floral_organ_identity_abce
  label: ABCE floral organ identity specification
  module_type: DEVELOPMENTAL_PROCESS
  description: >-
    Combinatorial specification of the four floral organ identities by A
    (AP1, AP2), B (AP3/PI), C (AG) and E (SEP1-4) homeotic transcription
    factors acting as whorl-specific MADS tetramers, with A-C mutual
    antagonism setting the boundary between perianth and reproductive whorls.
  concepts:
    - preferred_term: specification of floral organ identity
      term:
        id: GO:0010093
        label: specification of floral organ identity
      description: The module as a whole; whorl-specific child terms are placed on the quartet variants.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: >-
          Concrete Arabidopsis instance. The ABC(E) logic is broadly conserved in
          eudicots, but A-function details, especially the AP2 role, are
          lineage-specific.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: homeotic class activities (A, B, C, E transcription factors)
      node:
        id: homeotic_class_activities
        label: Floral homeotic class activities
        module_type: MODULE
        description: >-
          The individual gene-product activities that make up each homeotic
          class. All except AP2 are MIKC-type MADS-domain transcription factors
          that bind CArG boxes as dimers and assemble into tetramers.
        parts:
          - order: 1
            role: A function
            node:
              id: a_function
              label: A function (AP1, AP2)
              module_type: REGULATORY_STEP
              description: >-
                A function specifies sepals alone and petals together with B.
                AP1 is a MADS-domain factor that also acts earlier in floral
                meristem identity (a separate module). AP2 is an AP2/ERF-domain
                repressor that confines AG to the inner whorls. AP2 protein is
                itself limited by miR172.
              annotons:
                - id: ap1_a_class_tf
                  label: "AP1: A-class MADS transcription factor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AP1
                      term:
                        id: UniProtKB:P35631
                        label: Floral homeotic protein APETALA 1
                  function:
                    preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                    term:
                      id: GO:0000981
                      label: DNA-binding transcription factor activity, RNA polymerase II-specific
                  processes:
                    - preferred_term: specification of sepal identity
                      term:
                        id: GO:0010096
                        label: specification of sepal identity
                    - preferred_term: specification of petal identity
                      term:
                        id: GO:0010095
                        label: specification of petal identity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: >-
                    A-class MADS factor in the sepal (AP1-SEP) and petal
                    (AP1-SEP-AP3-PI) quartets; binds CArG boxes as a homodimer
                    or in heteromeric complexes.
                  evidence:
                    - source_id: PMID:8643482
                      title: Dimerization specificity of Arabidopsis MADS domain homeotic
                        proteins APETALA1, APETALA3, PISTILLATA, and AGAMOUS.
                      statement: AP1 homodimers bind CArG boxes.
                      supporting_text: >-
                        only AP1 homodimers, AG homodimers, and AP3/PI heterodimers
                        are capable of binding to CArG-box sequences
                - id: ap2_a_class_repressor
                  label: "AP2: A-class AP2/ERF-domain transcriptional repressor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AP2
                      term:
                        id: UniProtKB:P47927
                        label: Floral homeotic protein APETALA 2
                  function:
                    preferred_term: DNA-binding transcription factor activity
                    term:
                      id: GO:0003700
                      label: DNA-binding transcription factor activity
                  processes:
                    - preferred_term: specification of floral organ identity
                      term:
                        id: GO:0010093
                        label: specification of floral organ identity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: >-
                    Represses AG (and sets the expression borders of AP3, PI and
                    SEP3) in the outer whorls by recruiting TOPLESS and HDA19.
                  evidence:
                    - source_id: PMID:23034631
                      title: APETALA2 negatively regulates multiple floral organ identity
                        genes in Arabidopsis by recruiting the co-repressor TOPLESS and
                        the histone deacetylase HDA19.
                      statement: AP2 represses C, B and E genes via TOPLESS/HDA19.
                      supporting_text: >-
                        We show that AP2 represses its target genes by physically
                        recruiting the co-repressor TOPLESS and the histone
                        deacetylase HDA19.
          - order: 2
            role: B function
            node:
              id: b_function
              label: B function (AP3/PI obligate heterodimer)
              module_type: REGULATORY_STEP
              description: >-
                AP3 and PI bind DNA only as an AP3/PI heterodimer. They specify
                petals with A and stamens with C. In ap3 or pi mutants, petals
                become sepals and stamens become carpels.
              annotons:
                - id: ap3_b_class_tf
                  label: "AP3: B-class MADS transcription factor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AP3
                      term:
                        id: UniProtKB:P35632
                        label: Floral homeotic protein APETALA 3
                  function:
                    preferred_term: DNA-binding transcription factor activity
                    term:
                      id: GO:0003700
                      label: DNA-binding transcription factor activity
                  processes:
                    - preferred_term: specification of petal identity
                      term:
                        id: GO:0010095
                        label: specification of petal identity
                    - preferred_term: specification of stamen identity
                      term:
                        id: GO:0010097
                        label: specification of stamen identity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Obligate heterodimer partner of PI; B-class subunit of petal and stamen quartets.
                  evidence:
                    - source_id: PMID:8643482
                      title: Dimerization specificity of Arabidopsis MADS domain homeotic
                        proteins APETALA1, APETALA3, PISTILLATA, and AGAMOUS.
                      statement: Only the AP3/PI heterodimer, not either homodimer, binds CArG boxes.
                      supporting_text: >-
                        only AP1 homodimers, AG homodimers, and AP3/PI heterodimers
                        are capable of binding to CArG-box sequences
                - id: pi_b_class_tf
                  label: "PI: B-class MADS transcription factor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: PI
                      term:
                        id: UniProtKB:P48007
                        label: Floral homeotic protein PISTILLATA
                  function:
                    preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                    term:
                      id: GO:0000981
                      label: DNA-binding transcription factor activity, RNA polymerase II-specific
                  processes:
                    - preferred_term: specification of petal identity
                      term:
                        id: GO:0010095
                        label: specification of petal identity
                    - preferred_term: specification of stamen identity
                      term:
                        id: GO:0010097
                        label: specification of stamen identity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Obligate heterodimer partner of AP3; B-class subunit of petal and stamen quartets.
                  evidence:
                    - source_id: PMID:1685111
                      title: Genetic interactions among floral homeotic genes of Arabidopsis.
                      statement: pi mutants convert petals to sepals and stamens to carpels.
                      supporting_text: >-
                        Homeotic conversions are petals to sepals and stamens to
                        carpels
          - order: 3
            role: C function
            node:
              id: c_function
              label: C function (AG)
              module_type: REGULATORY_STEP
              description: >-
                AG specifies stamens with B and carpels alone, and terminates the
                floral meristem. In ag mutants, stamens become petals and a new
                flower arises in place of the gynoecium.
              annotons:
                - id: ag_c_class_tf
                  label: "AG: C-class MADS transcription factor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: AG
                      term:
                        id: UniProtKB:P17839
                        label: Floral homeotic protein AGAMOUS
                  function:
                    preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                    term:
                      id: GO:0000981
                      label: DNA-binding transcription factor activity, RNA polymerase II-specific
                  processes:
                    - preferred_term: specification of stamen identity
                      term:
                        id: GO:0010097
                        label: specification of stamen identity
                    - preferred_term: specification of carpel identity
                      term:
                        id: GO:0010094
                        label: specification of carpel identity
                    - preferred_term: floral meristem determinacy
                      term:
                        id: GO:0010582
                        label: floral meristem determinacy
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: >-
                    C-class subunit of the stamen (AP3-PI-AG-SEP) and carpel
                    (AG-SEP) quartets. The SEP3-AG tetramer activates KNU and CRC
                    to terminate the floral meristem.
                  evidence:
                    - source_id: PMID:1685111
                      title: Genetic interactions among floral homeotic genes of Arabidopsis.
                      statement: ag mutants transform stamens to petals and make an indeterminate inner flower.
                      supporting_text: >-
                        cause petals to develop instead of stamens and another flower
                        to arise in place of the gynoecium
                    - source_id: PMID:29562355
                      title: Tetramerization of MADS family transcription factors SEPALLATA3
                        and AGAMOUS is required for floral meristem determinacy in
                        Arabidopsis.
                      statement: The SEP3-AG heterotetramer activates KNU and CRC for determinacy.
                      supporting_text: >-
                        The heterotetramer formed by SEP3 and the MADS protein,
                        AGAMOUS, is necessary to activate two target genes, KNUCKLES
                        and CRABSCLAW
          - order: 4
            role: E function (redundant SEPALLATA hub)
            node:
              id: e_function
              label: E function (SEP1-SEP4)
              module_type: REGULATORY_STEP
              description: >-
                The four SEPALLATA MADS proteins act redundantly as
                tetramerization partners for A, B and C proteins. SEP3 is the
                dominant hub, and its K3 subdomain can confer tetramer formation
                on AP3/PI. SEP1, SEP2 and SEP4 each contribute but are masked by
                redundancy. SEP4 is also needed for sepal identity and adds to
                floral meristem identity.
              annotons:
                - id: sep3_e_class_hub
                  label: "SEP3: E-class MADS tetramerization hub"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: SEP3
                      term:
                        id: UniProtKB:O22456
                        label: Developmental protein SEPALLATA 3
                  function:
                    preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                    term:
                      id: GO:0000981
                      label: DNA-binding transcription factor activity, RNA polymerase II-specific
                  processes:
                    - preferred_term: specification of floral organ identity
                      term:
                        id: GO:0010093
                        label: specification of floral organ identity
                    - preferred_term: floral meristem determinacy
                      term:
                        id: GO:0010582
                        label: floral meristem determinacy
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: >-
                    Principal E-class subunit. It heterodimerizes with AP1, AP3/PI
                    and AG, drives tetramerization and is sufficient to loop DNA
                    in quartet-like complexes in vitro.
                  evidence:
                    - source_id: PMID:19276203
                      title: Reconstitution of 'floral quartets' in vitro involving class
                        B and class E floral homeotic proteins.
                      statement: SEP3 K3 subdomain confers tetramerization; SEP3-AP3-PI complexes form preferentially.
                      supporting_text: >-
                        Domain-deletion and domain-swapping experiments indicate that
                        the subdomain K3 of SEP3 is involved in tetramer formation and
                        is sufficient to confer the ability of tetramer formation to
                        AP3 and PI.
                - id: sep1_e_class
                  label: "SEP1: redundant E-class MADS factor"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: SEP1
                      term:
                        id: UniProtKB:P29382
                        label: Developmental protein SEPALLATA 1
                  function:
                    preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                    term:
                      id: GO:0000981
                      label: DNA-binding transcription factor activity, RNA polymerase II-specific
                  processes:
                    - preferred_term: specification of floral organ identity
                      term:
                        id: GO:0010093
                        label: specification of floral organ identity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Redundant E-class partner; binds CArG DNA as a dimer and heterodimerizes with AG.
                  evidence:
                    - source_id: PMID:10821278
                      title: B and C floral organ identity functions require SEPALLATA
                        MADS-box genes.
                      statement: sep1 sep2 sep3 triple mutants form only sepals.
                      supporting_text: >-
                        Triple mutant Arabidopsis plants lacking the activity of all
