    - order: 2
      role: whorl-specific MADS quartet complexes
      node:
        id: whorl_quartets
        label: Whorl-specific floral quartet complexes
        module_type: MODULE
        description: >-
          Combinations of the class activities as tetrameric MADS complexes, one
          per whorl. The compositions follow the floral quartet model. The
          stamen and carpel quartets (and the SEP3-AP3-PI-containing petal and
          stamen complexes) have biochemical support in vitro and in vivo. The
          sepal quartet composition remains a model inference.
        variant_sets:
