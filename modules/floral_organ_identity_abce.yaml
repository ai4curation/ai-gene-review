      evidence:
        - source_id: PMID:1675158
          title: Negative regulation of the Arabidopsis homeotic gene AGAMOUS by the
            APETALA2 product.
          statement: AG RNA spreads to all whorls in ap2 mutants.
          supporting_text: >-
            In ap2 mutant flowers, AG RNA is present in the organ primordia of all
            floral whorls.
        - source_id: PMID:20876650
          title: On reconciling the interactions between APETALA2, miR172 and AGAMOUS
            with the ABC model of flower development.
          statement: AP2 and AG are antagonistic A- and C-class genes.
          supporting_text: >-
            APETALA2 ( AP2 ) and AGAMOUS ( AG ) represent A- and C-class genes that
            act in an antagonistic fashion to specify perianth and reproductive
            organs, respectively.
    - source: ap2_a_class_repressor
      target: b_function
      connection_type: NEGATIVELY_REGULATES
      description: AP2 also sets the expression borders of AP3 and PI (and SEP3) through TOPLESS/HDA19.
      evidence:
        - source_id: PMID:23034631
          title: APETALA2 negatively regulates multiple floral organ identity genes in
            Arabidopsis by recruiting the co-repressor TOPLESS and the histone deacetylase
            HDA19.
          statement: AP2 regulates expression borders of B-class and E-class genes.
          supporting_text: >-
            also regulates the expression borders of the B-class genes APETALA3 and
            PISTILLATA, and the E-class gene SEPALLATA3
    - source: c_function
      target: ap1_a_class_tf
      connection_type: NEGATIVELY_REGULATES
      description: AG prevents AP1 RNA accumulation in the two inner whorls, completing A-C mutual antagonism.
      evidence:
        - source_id: PMID:7506995
          title: Regulation of the arabidopsis floral homeotic gene APETALA1.
          statement: AG excludes AP1 from whorls 3 and 4.
          supporting_text: >-
            the organ identity gene AGAMOUS prevents AP1 RNA accumulation in the two
            inner whorls of wild-type flowers
    - source: homeotic_class_activities
      target: whorl_quartets
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The A, B, C and E proteins are the subunits from which the
        whorl-specific quartet complexes assemble. The E-class SEP proteins
        enter as tetramerization partners rather than as regulators of B and C
        activity, which is why B and C organ identity genetically requires SEP
        function.
      evidence:
        - source_id: PMID:10821278
          title: B and C floral organ identity functions require SEPALLATA MADS-box
            genes.
          statement: B and C activities require SEP1/2/3.
          supporting_text: >-
            the activities of the B and C organ-identity genes require the
            activities of three closely related and functionally redundant MADS-box
            genes
