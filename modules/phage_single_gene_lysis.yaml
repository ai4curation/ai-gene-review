  notes: 'Exemplar phages: Enterobacteria phage phiX174 (NCBITaxon:1217068): Canonical ssDNA microvirus whose overlapping
    gene E encodes a 91-aa transmembrane protein that inhibits host MraY in a ternary YES complex with host SlyD.; Escherichia
    virus Qbeta (NCBITaxon:39803): Canonical allolevivirus whose single-copy virion maturation protein A2 doubles as a cytoplasmic
    MurA inhibitor once unassembled A2 accumulates.; Escherichia phage MS2 (NCBITaxon:12022): Canonical levivirus whose overlapping
    lysis protein L induces lysis at membrane adhesion sites without inhibiting peptidoglycan precursor enzymes.'
