id: MODULE:phage_single_gene_lysis
title: Single-gene bacteriophage lysis (peptidoglycan biosynthesis inhibition and envelope destabilization)
description: 'A reusable module representing single-gene lysis (SGL) systems of small single-stranded DNA (Microviridae) and
  single-stranded RNA (Fiersviridae / Leviviricetes) bacteriophages. Unlike double-stranded DNA phages that deploy multigene
  holin-endolysin-spanin cassettes to degrade existing peptidoglycan, small-genome phages encode a single lysis protein—frequently
  overlapping essential structural or replication genes or embedded within the virion maturation protein—that triggers host
  bacteriolysis during cell division. Two principal mechanistic branches are represented: (1) "protein antibiotic" SGL proteins
  that directly inhibit conserved cytoplasmic or inner-membrane enzymes of the host peptidoglycan precursor pathway, exemplified
  by phiX174 protein E (which forms a transmembrane ternary YES complex with host phospho-N-acetylmuramoyl-pentapeptide-transferase
  MraY and the peptidyl-prolyl isomerase chaperone SlyD to block lipid I synthesis) and Qbeta maturation/lysis protein A2
  (which binds and inhibits host UDP-N-acetylglucosamine 1-carboxyvinyltransferase MurA in a closed conformation to block
  the first committed step of murein synthesis); and (2) small transmembrane membrane-destabilizing SGL proteins such as MS2
  protein L, which insert into inner-outer membrane adhesion sites and induce autolysis without inhibiting murein precursor
  enzymes.'
status: COMPLETE
scope: ABSTRACT
evidence:
- source_id: GO:0039640
  title: viral release via suppression of host peptidoglycan biosynthetic process
  statement: Ontology grounding for the "protein antibiotic" single-gene lysis pathway in which a viral lysis protein inhibits
    host peptidoglycan precursor biosynthesis to induce bacteriolysis.
- source_id: GO:0044659
  title: viral release from host cell by cytolysis
  statement: Parent biological process encompassing both peptidoglycan-biosynthesis-inhibiting and membrane-destabilizing
    single-gene phage lysis mechanisms.
- source_id: file:genes/BPPHS/E/E-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03639 (LYS_BPPHS)
  statement: Establishes that phiX174 lysis protein E induces host cell lysis by inhibiting the host translocase MraY that
    catalyzes lipid I synthesis.
  supporting_text: Inhibits the host translocase MraY activity that catalyzes the synthesis of lipid I, a necessary step for
    the host cell wall biosynthesis
- source_id: file:genes/BPQBE/A2/A2-uniprot.txt
  title: UniProtKB/Swiss-Prot entry Q8LTE2 (MATA2_BPQBE)
  statement: Establishes that Qbeta maturation protein A2 mediates host cell lysis by interacting with and inhibiting host
    MurA, blocking the first step in host cell wall synthesis.
  supporting_text: Inhibits host MurA activity thereby blocking the synthesis of murein precursors necessary for the host
    cell wall biosynthesis
- source_id: file:genes/BPMS2/L/L-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03609 (LYS_BPMS2)
  statement: Establishes that MS2 lysis protein L localizes to membrane adhesion sites between the inner and outer membranes
    to induce host cell lysis.
  supporting_text: Induces the formation of specific membrane adhesion sites between the inner and outer membranes, apparently
    leading to host cell lysis.
