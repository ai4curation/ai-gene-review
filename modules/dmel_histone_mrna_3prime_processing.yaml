notes: >-
  Boundary. FlyBase's HPF group is the union of HCC, U7 and Slbp plus FLASH, and all members
  are covered by the four parts. The histone pre-mRNA cleavage complex shares all its subunits
  with the polyadenylation machinery in dmel_cleavage_polyadenylation. The core Sm proteins
  of the U7 snRNP (SmB, SmD3, SmE, SmF, SNRPG) are shared with spliceosomal snRNPs. snRNA:U7
  has no protein product and is grounded to its FlyBase gene id. FlyBase groups realized by
  this module: HCC (FBgg0000615), U7 (FBgg0000628), HPF (FBgg0000630). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_histone_mrna_3prime_processing.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
