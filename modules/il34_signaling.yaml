id: MODULE:il34_signaling
title: Interleukin-34 / CSF1R signaling pathway module
description: >-
  Secreted homodimeric Interleukin-34 (IL34) binds the extracellular D2-D3
  immunoglobulin-like junction of the class III receptor tyrosine kinase CSF1R
  (macrophage colony-stimulating factor 1 receptor), driving receptor
  homodimerization and trans-autophosphorylation of intracellular tyrosine
  residues. Phosphorylated CSF1R recruits SH2-domain adaptors and enzymes
  (GRB2, PI3K regulatory subunit PIK3R1, and PLC-gamma-2) and activates
  downstream Ras-MAPK/ERK, PI3K-AKT, and STAT3 signaling cascades that promote
  monocyte survival, macrophage differentiation, and microglial and Langerhans
  cell homeostasis.
status: DRAFT
evidence:
  - source_id: GO:0061514
    title: interleukin-34-mediated signaling pathway
    statement: >-
      Grounded in the GO biological process term for interleukin-34-mediated
      signaling pathway (a child of GO:0038145 macrophage colony-stimulating
      factor signaling pathway), defined as the series of molecular signals
      initiated by interleukin-34 binding to its receptor CSF1R on the surface
      of a target cell.
  - source_id: GO:0038145
    title: macrophage colony-stimulating factor signaling pathway
    statement: >-
      Parent pathway term shared by the two endogenous CSF1R cytokine agonists
      CSF1 and IL34, encompassing CSF1R dimerization, tyrosine
      autophosphorylation, and downstream myeloid/microglial signaling.
  - source_id: PMID:18467591
    title: Discovery of a cytokine and its receptor by functional screening of the extracellular proteome.
    statement: >-
      Identified human IL34 as a secreted homodimeric cytokine that binds CSF1R
      with high affinity, stimulates CSF1R tyrosine phosphorylation and ERK1/2
      (MAPK1/MAPK3) activation in primary human monocytes, and promotes
      monocyte viability and bone marrow macrophage colony formation.
  - source_id: PMID:22483114
    title: Structural basis for the dual recognition of helical cytokines IL-34 and CSF-1 by CSF-1R.
    statement: >-
      Crystal structures of free human IL34 and the ternary IL34:CSF1R (D1-D3)
      complex demonstrate that noncovalently dimerized IL34 adopts a four-helix
      bundle fold and bridges the D2-D3 junction of two CSF1R ectodomains to
      drive receptor dimerization.
  - source_id: PMID:26754294
    title: miR-28-5p-IL-34-macrophage feedback loop modulates hepatocellular carcinoma metastasis.
    statement: >-
      GOA IDA reference for GO:0061514 (interleukin-34-mediated signaling
      pathway) and GO:0043410 (positive regulation of MAPK cascade) on human
      IL34, showing that IL34 activates CSF1R-dependent ERK1/2 and FAK
      signaling in macrophages.
  - source_id: PMID:30066957
    title: Interleukin-34, a comprehensive review.
    statement: >-
      Summarizes IL34 engagement of CSF1R and co-receptors SDC1 and PTPRZ1 and
      the recruitment of GRB2/SOS, PI3K, PLCG2, and STAT3 to phosphorylated
      CSF1R cytoplasmic tyrosines.
  - source_id: Reactome:R-HSA-6785807
    title: Interleukin-34 signaling
    statement: >-
      Reactome pathway documenting IL34 homodimerization, binding to CSF1R
      (and modulation by SDC1 and PTPRZ1), and initiation of CSF1R signaling.
  - source_id: file:genes/human/IL34/IL34-ai-review.yaml
    title: Human IL34 gene review
    statement: >-
      Curates human IL34 (UniProtKB:Q6ZMJ4) with GO:0005125 (cytokine activity),
      GO:0061514 (interleukin-34-mediated signaling pathway), and GO:0038145
      (macrophage colony-stimulating factor signaling pathway), upgrading
      GO:0005157 (macrophage colony-stimulating factor receptor binding).
  - source_id: file:genes/human/CSF1R/CSF1R-ai-review.yaml
    title: Human CSF1R gene review
    statement: >-
      Curates human CSF1R (UniProtKB:P07333) with GO:0005011 (macrophage
      colony-stimulating factor receptor activity) and GO:0004714 (transmembrane
      receptor protein tyrosine kinase activity) in GO:0038145.
  - source_id: file:interpro/panther/PTHR28606/PTHR28606-review.yaml
