        Series of molecular signals initiated by secreted homodimeric IL34
        binding to the extracellular D2-D3 junction of CSF1R on target myeloid
        or microglial cells, driving receptor dimerization, tyrosine
        autophosphorylation, and downstream effector activation.
    - preferred_term: macrophage colony-stimulating factor signaling pathway
      term:
        id: GO:0038145
        label: macrophage colony-stimulating factor signaling pathway
      description: >-
        Parent CSF1R signaling pathway shared by the two endogenous cytokine
        agonists IL34 and CSF1.
