notes: >-
  Three-step receptor tyrosine kinase signaling module modeling Interleukin-34
  (IL34, family PTHR28606) signaling through the class III RTK CSF1R
  (PTHR24416:SF47), built to the same template as kit_signaling and
  pdgfr_signaling. Per ligand-in-signaling conventions (projects/LIGANDS_IN_SIGNALING.md),
  the IL34 ligand annoton uses GO:0005125 (cytokine activity, an is_a child of
  GO:0048018 receptor ligand activity) rather than the receptor-binding term
  GO:0005157 (macrophage colony-stimulating factor receptor binding), resolving
  the Category C gap for GO:0061514 across human, mouse, and rat. Both
  GO:0061514 (interleukin-34-mediated signaling pathway) and its parent
  GO:0038145 (macrophage colony-stimulating factor signaling pathway, shared
  with CSF1) are declared as module concepts.
