id: MODULE:strigolactone_signaling_shoot_branching
title: Strigolactone perception and D14-MAX2-SMXL signalling in shoot-branching control
description: >-
  Strigolactones (SLs) are carotenoid-derived hormones that inhibit axillary bud outgrowth. In
  Arabidopsis thaliana, SL is perceived by the alpha/beta-hydrolase receptor DWARF14 (D14), which
  binds and slowly hydrolyses the butenolide D-ring. SL binding changes the conformation of D14 so
  that it associates with the F-box protein MORE AXILLARY GROWTH2 (MAX2) in an SCF(MAX2) E3
  ubiquitin ligase and with the SMAX1-LIKE co-repressors SMXL6, SMXL7 and SMXL8. The SMXLs are
  then polyubiquitinated and degraded by the proteasome, and D14 itself is degraded as negative
  feedback. In the absence of SL, the nuclear SMXL6/7/8 proteins repress target genes by recruiting
  TOPLESS-related co-repressors through an EAR motif, and SMXL6 can also bind target promoters
  itself. Their removal de-represses the bud-expressed TCP transcription factor BRANCHED1 (BRC1),
  which keeps buds dormant, in part by activating HD-ZIP genes that raise abscisic acid in the bud.
  SL-triggered SMXL degradation also reduces PIN1 accumulation and auxin transport in the stem,
  which inhibits bud activation in parallel with BRC1. The sister karrikin pathway uses the same
  F-box protein, MAX2, with the D14 paralog KAI2 and the SMAX1/SMXL2 repressors. That pathway, SL
  biosynthesis (D27, MAX3, MAX4, MAX1) and the auxin-transport branch are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:26546446
    title: Strigolactone Signaling in Arabidopsis Regulates Shoot Development by Targeting D53-Like
      SMXL Repressor Proteins for Ubiquitination and Degradation.
    statement: >-
      The core Arabidopsis mechanism: SL-induced, D14- and MAX2-dependent ubiquitination and
      degradation of SMXL6/7/8, which repress transcription with TPR2 and repress BRC1.
    supporting_text: >-
      in the presence of SLs , D14 binds and hydrolyzes the SLs , triggering the formation of a
      D14-SMXL-SCF MAX2 complex for the ubiquitination and degradation of SMXL6, 7, and 8
  - source_id: PMID:26546447
    title: SMAX1-LIKE/D53 Family Members Enable Distinct MAX2-Dependent Responses to Strigolactones
      and Karrikins in Arabidopsis.
    statement: >-
      SMXL6/7/8 mediate SL responses and SMAX1 mediates karrikin responses through the shared F-box
      protein MAX2.
    supporting_text: >-
      Our data indicate that SMAX1 and SMXL6,7,8 repress karrikin and strigolactone signaling,
      respectively, and suggest that all MAX2-dependent growth effects are mediated by degradation
      of SMAX1/SMXL proteins.
  - source_id: PMID:27479325
    title: DWARF14 is a non-canonical hormone receptor for strigolactone.
    statement: SL induces a D14 conformational change and formation of the D14-MAX2/D3-ASK1 complex.
    supporting_text: >-
      Here we report the crystal structure of the strigolactone-induced AtD14-D3-ASK1 complex
  - source_id: PMID:30643123
    title: Strigolactone perception and deactivation by a hydrolase receptor DWARF14.
    statement: >-
      A catalytically inactive AtD14 still signals, so intact SL binding can activate the receptor;
      hydrolysis deactivates SL after signalling.
    supporting_text: >-
      We also demonstrate that D14 can deactivate SLs by hydrolytic degradation after signal
      transmission.
  - source_id: PMID:32528176
    title: Transcriptional regulation of strigolactone signalling in Arabidopsis.
    statement: >-
      SL controls shoot branching mainly through transcriptional activation of BRC1; SMXL6 binds
      DNA directly and autoregulates SMXL6/7/8.
    supporting_text: >-
      these plant hormones regulate shoot branching, leaf shape and anthocyanin accumulation
      mainly through transcriptional activation of the BRANCHED 1, TCP DOMAIN PROTEIN 1 and
      PRODUCTION OF ANTHOCYANIN PIGMENT 1 genes
  - source_id: PMID:28289131
    title: BRC1 expression regulates bud activation potential but is not necessary or sufficient for
      bud growth inhibition in Arabidopsis.
    statement: >-
      SL inhibits bud activation by acting in parallel on BRC1 transcription and on the shoot auxin
      transport network.
    supporting_text: >-
      our data suggest a coherent feed-forward loop in which strigolactone treatment reduces the
      probability of bud activation by parallel effects on BRC1 transcription and the shoot auxin
      transport network
notes: >-
  Concrete Arabidopsis instance; the rice orthologous pathway is D14-D3-D53 (PMID:24336200,
  PMID:24336215), and petunia/pea receptors are DAD2/RMS3. Annoton molecular functions match the
  core_functions of the D14, MAX2, SMXL6, SMXL7, SMXL8 and BRC1 gene reviews. Because GO has no
  strigolactone-specific receptor term, D14 is typed with signaling receptor activity (GO:0038023),
  and the D14 review proposes a new term, strigolactone receptor activity. GO also has no
  strigolactone signalling pathway term, so the module concept is cellular response to
  strigolactone (GO:1902348). SMXL6, SMXL7 and SMXL8 are modelled as three redundant annotons on
  one co-repressor node instead of a PANTHER family descriptor: their shared PANTHER family
  (PTHR43572, CLPD chaperone) is far broader than the SMXL6/7/8 clade. No GO-CAM in
  gocams/index.tsv contains these proteins. The ASK1 and CUL1 SCF scaffold subunits and the
  TOPLESS/TPR2 co-repressors are named in prose but not modelled as parts, because they are shared
  with many other hormone pathways. No Falcon deep research could be generated (all providers
  failed).
module:
  id: strigolactone_signaling_shoot_branching
  label: Strigolactone D14-MAX2-SMXL signalling controlling shoot branching
  module_type: SIGNALING_PATHWAY
  description: >-
    SL perception by D14 leads to SCF(MAX2)-dependent degradation of SMXL6/7/8 co-repressors,
    de-repressing the TCP factor BRC1 to keep axillary buds dormant.
  concepts:
    - preferred_term: cellular response to strigolactone
      term:
        id: GO:1902348
        label: cellular response to strigolactone
      description: >-
        The SL signal transduction cascade from receptor activation to target-gene de-repression.
        GO has no strigolactone-mediated signaling pathway term.
    - preferred_term: regulation of secondary shoot formation
      term:
        id: GO:2000032
        label: regulation of secondary shoot formation
      description: The developmental outcome, which is inhibition of axillary bud outgrowth.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: strigolactone perception
      node:
        id: sl_perception
        label: Strigolactone perception by the D14 hydrolase-receptor
        module_type: REGULATORY_STEP
        description: >-
          D14 binds SL in its alpha/beta-hydrolase pocket and switches to a conformation that
          associates with MAX2 and the SMXL co-repressors. D14 also hydrolyses SL, which deactivates
          the hormone. Whether hydrolysis is needed to activate the receptor is still debated.
        annotons:
          - id: d14_sl_receptor
            label: "D14: strigolactone receptor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: D14 (AtD14, At3g03990)
                term:
                  id: UniProtKB:Q9SQR3
                  label: Strigolactone esterase D14
            function:
              preferred_term: signaling receptor activity (strigolactone receptor)
              term:
                id: GO:0038023
                label: signaling receptor activity
              evidence:
                - source_id: PMID:27479325
                  statement: SL triggers an AtD14 open-to-closed transition that drives MAX2/D3 binding.
                  supporting_text: >-
                    reveal that Arabidopsis thaliana (At)D14 undergoes an open-to-closed state
                    transition to trigger strigolactone signalling
                - source_id: file:ARATH/D14/D14-ai-review.yaml
                  statement: D14 gene review core function (GO:0038023), with a proposed strigolactone receptor activity term.
            processes:
              - preferred_term: cellular response to strigolactone
                term:
                  id: GO:1902348
                  label: cellular response to strigolactone
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Receptor; the SL-bound conformation recruits MAX2 and the SMXL6/7/8 co-repressors.
          - id: d14_sl_hydrolase
            label: "D14: strigolactone hydrolase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: D14 (AtD14, At3g03990)
                term:
                  id: UniProtKB:Q9SQR3
                  label: Strigolactone esterase D14
            function:
              preferred_term: carboxylic ester hydrolase activity (SL butenolide hydrolysis)
              term:
                id: GO:0052689
                label: carboxylic ester hydrolase activity
              substrates:
                - preferred_term: strigolactone (GR24 analog in vitro)
              products:
                - preferred_term: ABC-ring product and hydroxy-butenolide D-ring
              evidence:
                - source_id: PMID:23381136
                  statement: AtD14 and OsD14 hydrolyse GR24, at a very low turnover rate.
                  supporting_text: >-
                    only the D14 proteins were able to hydrolyze GR24, demonstrating hormone
                    substrate specificity for this class of signaling hydrolases
            role_description: >-
              Hydrolyses SL slowly, which deactivates the hormone after signalling and may help
              activate the receptor.
    - order: 2
      role: SCF(MAX2)-mediated ubiquitination of SMXL co-repressors
      node:
        id: smxl_ubiquitination
        label: SCF(MAX2) recruitment and SMXL6/7/8 ubiquitination
        module_type: REGULATORY_STEP
        description: >-
          MAX2, the F-box subunit of SCF(MAX2), binds SL-activated D14 and the SMXL6/7/8 proteins.
          The SMXLs are polyubiquitinated and degraded by the proteasome within minutes of SL
          treatment. D14 is degraded in an SL- and MAX2-dependent manner as negative feedback.
        annotons:
          - id: max2_f_box_adaptor
            label: "MAX2: SCF F-box substrate adaptor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MAX2 (ORE9, At2g42620)
                term:
                  id: UniProtKB:Q9SIM9
                  label: F-box protein MAX2
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              evidence:
                - source_id: PMID:26546446
                  statement: SMXL ubiquitination and degradation require MAX2 and D14.
                  supporting_text: >-
                    Collectively, these data indicate that the D53-like SMXLs are subject to D14-
                    and MAX2-dependent degradation in response to SL signaling.
                - source_id: PMID:17346265
                  statement: MAX2 forms an SCF complex with ASK1 and CUL1 in planta.
                  supporting_text: >-
                    Myc-epitope-tagged MAX2 interacts with the core SCF subunits ASK1 and AtCUL1 in
                    planta.
            processes:
              - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0031146
                  label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              F-box subunit of SCF(MAX2). It brings D14-bound SMXL6/7/8 to the E3 ligase for
              polyubiquitination. MAX2 also serves the KAI2-SMAX1 karrikin pathway, which is outside
              this module.
    - order: 3
      role: SMXL6/7/8 co-repression of branching-inhibitor genes
      node:
        id: smxl_corepression
        label: SMXL6/7/8 transcriptional co-repression
        module_type: REGULATORY_STEP
        description: >-
          Without SL, the redundant nuclear SMXL6, SMXL7 and SMXL8 proteins recruit TOPLESS-related
          co-repressors (TPR2) through an EAR motif and repress BRC1 and other SL-responsive genes.
          SMXL6 can also bind target promoters directly. Degradation of the SMXLs after SL perception lifts
          this repression.
        annotons:
          - id: smxl6_corepressor
            label: "SMXL6: SL-labile co-repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SMXL6 (At1g07200)
                term:
                  id: UniProtKB:Q9LML2
                  label: Protein SMAX1-LIKE 6
            function: &smxl_mf
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
              evidence:
                - source_id: PMID:26546446
                  statement: SMXL6/7/8 repress transcription in an EAR- and TPR2-dependent manner and repress BRC1.
                  supporting_text: >-
                    D53-like SMXLs exhibit TPR2-dependent transcriptional repression activity and
                    repress the expression of BRANCHED1.
            locations: &nuc
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Redundant co-repressor. It also binds the SMXL6/7/8 promoters itself, acting as an
              autoregulated transcription factor (PMID:32528176).
          - id: smxl7_corepressor
            label: "SMXL7: SL-labile co-repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SMXL7 (At2g29970)
                term:
                  id: UniProtKB:O80875
                  label: Protein SMAX1-LIKE 7
            function: *smxl_mf
            locations: *nuc
            role_description: >-
              The major branching-relevant paralog. It acts in the nucleus, and deleting its RGKT
              motif makes it resistant to degradation (PMID:26546447, PMID:27317673).
          - id: smxl8_corepressor
            label: "SMXL8: SL-labile co-repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SMXL8 (At2g40130)
                term:
                  id: UniProtKB:F4IGZ2
                  label: Protein SMAX1-LIKE 8
            function: *smxl_mf
            locations: *nuc
            role_description: Redundant co-repressor with SMXL6 and SMXL7.
    - order: 4
      role: BRC1 transcriptional output in axillary buds
      node:
        id: brc1_output
        label: BRC1-mediated bud dormancy
        module_type: REGULATORY_STEP
        description: >-
          BRC1 is a TCP transcription factor expressed in axillary buds. It is induced when the
          SMXLs are degraded, and it promotes bud dormancy, partly by directly activating
          HB21/HB40/HB53 and so raising abscisic acid in the bud. BRC1 sets how likely a bud is to
          activate, working in parallel with SL effects on auxin transport.
        annotons:
          - id: brc1_tcp_tf
            label: "BRC1 (TCP18): bud dormancy transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BRC1 (TCP18, At3g18550)
                term:
                  id: UniProtKB:A1YKT1
                  label: Transcription factor TCP18
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:28028241
                  statement: BRC1 binds and activates HB21/HB40/HB53 inside axillary buds.
                  supporting_text: >-
                    binds to and positively regulates the transcription of three related Homeodomain
                    leucine zipper protein (HD-ZIP)-encoding genes
            processes:
              - preferred_term: regulation of secondary shoot formation
                term:
                  id: GO:2000032
                  label: regulation of secondary shoot formation
              - preferred_term: bud dormancy process
                term:
                  id: GO:0097207
                  label: bud dormancy process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Output transcription factor. SL induces BRC1 by removing SMXL repression, and BRC1
              arrests bud development.
  connections:
    - source: sl_perception
      target: smxl_ubiquitination
      connection_type: POSITIVELY_REGULATES
      description: >-
        SL-bound D14 recruits MAX2 and the SMXLs, so SCF(MAX2) can ubiquitinate the SMXLs.
      evidence:
        - source_id: PMID:26546446
          statement: SMXL6 ubiquitination after GR24 treatment is lost in d14-1 and max2-1.
          supporting_text: >-
            the ubiquitination of SMXL6-GFP was detected in 35S:SMXL6-GFP seedlings but not in
            35S:SMXL6-GFP/max2-1 and 35S:SMXL6-GFP/d14-1 seedlings
    - source: smxl_ubiquitination
      target: smxl_corepression
      connection_type: NEGATIVELY_REGULATES
      description: Ubiquitination leads to proteasomal degradation of the SMXL co-repressors.
      evidence:
        - source_id: PMID:26546446
          statement: GR24 causes ubiquitination and degradation of SMXL6/7/8 that requires D14 and MAX2.
          supporting_text: >-
            Exogenous application of the SL analog rac-GR24 causes ubiquitination and degradation of
            SMXL6, 7, and 8; this requires D14 and MAX2.
    - source: smxl_corepression
      target: brc1_output
      connection_type: NEGATIVELY_REGULATES
      description: SMXL6/7/8 repress BRC1 transcription in axillary buds.
      evidence:
        - source_id: PMID:26546446
          statement: BRC1 is repressed in max mutants and induced in smxl6/7/8 mutants.
          supporting_text: >-
            the BRC1 gene was strongly repressed in max2-1 and max3-9 but was induced in smxl6/7/8
