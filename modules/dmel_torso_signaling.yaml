id: MODULE:dmel_torso_signaling
title: Torso receptor tyrosine kinase signaling in Drosophila melanogaster
description: >-
  Torso is a receptor tyrosine kinase that is uniformly distributed in the early embryo membrane
  but activated only at the anterior and posterior poles, where it specifies the terminal
  structures. Local activation depends on Torso-like, which is deposited at the poles by follicle
  cells and acts together with eggshell components (Nasrat/fs(1)N, Polehole/fs(1)M3 and Closca)
  to allow activation of Torso by its ligand Trunk. Torso signals through Drk, Sos and Ras
  to the Raf-MEK (Dsor1)-ERK (Rolled) cascade. ERK phosphorylation relieves repression by
  Capicua, which with the corepressor Groucho represses the terminal gap genes tailless and
  huckebein outside the poles. In the larval prothoracic gland, Torso is activated by prothoracicotropic
  hormone (PTTH) to trigger ecdysone production and the onset of metamorphosis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000934
  title: 'FlyBase gene group TORS: Torso signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 31 D. melanogaster genes as torso signaling pathway (TORS);
    this module models that group.
- source_id: GO:0008293
  title: torso signaling pathway
  statement: >-
    GO term grounding the module as torso signaling pathway.
- source_id: GO:0007362
  title: terminal region determination
  statement: >-
    GO term grounding the module as terminal region determination.
notes: >-
  Boundary. The Ras-ERK components are shared with other receptor tyrosine kinase pathways.
  The connection from MAPK cascade to transcriptional output is negative because ERK inactivates
  the repressor Capicua; Bicoid sits in the same part only because FlyBase lists it among
  core components. Rap1 is a FlyBase core member; its role relative to Ras in Torso signaling
  is less clear. FlyBase groups realized by this module: TORS (FBgg0000934). Subgroups folded
  into it: TORS-C. FlyBase also curates regulator sets for this pathway, which are context
  and not modelled as parts: TORS-P (positive regulators of torso signaling pathway, 2 genes);
  TORS-N (negative regulators of torso signaling pathway, 7 genes). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_torso_signaling.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
