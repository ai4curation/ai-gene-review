evidence:
  - source_id: GO:0006911
    title: phagocytosis, engulfment
    statement: >-
      The module is grounded in the GO process for internalizing a particle by
      surrounding it with plasma membrane. Recognition (GO:0006910) is modelled as
      the first part. Phagosome maturation (GO:0090382) is a separate module.
  - source_id: PMID:25319336
    title: "Phagocytosis: receptors, signal integration, and the cytoskeleton."
    statement: >-
      Receptor diversity and staged actin remodeling (cortical disruption, then
      polymerization for pseudopod extension, then termination for closure) set
      the part order of this module.
    supporting_text: the actin polymerization that propels pseudopod extension
  - source_id: PMID:15744306
    title: Two pathways converge at CED-10 to mediate actin rearrangement and corpse removal in C. elegans.
    statement: >-
      The two partially redundant C. elegans engulfment routes share a Rac
      output. This supports treating receptor classes as alternative entry
      points into a shared Rho-GTPase/actin core.
    supporting_text: two conserved, partially redundant genetic pathways regulate this process
  - source_id: PMID:36897976
    title: Convergence of Ras- and Rac-regulated formin pathways is pivotal for phagosome formation and particle uptake in Dictyostelium.
    statement: >-
      In Dictyostelium, as in animal phagocytes, Arp2/3 activity downstream of
      SCAR/WAVE and Rho-family GTPases builds the protruding rim of the
      phagocytic cup, and loss of SCAR reduces phagocytosis. This supports a
      eukaryote-wide context for the Rac-to-actin core of the module.
    supporting_text: actin assembly at the tips of macroendocytic cups is initiated by the actin-related protein (Arp) 2/3 complex downstream of the SCAR (suppressor of cAMP receptor)/WAVE (Wiskott-Aldrich syndrome protein family verprolin homologs) complex (also known as the WAVE regulatory complex, WRC) activation and Rho family GTPase signaling
  - source_id: PMID:29799847
    title: A G-protein-coupled chemoattractant receptor recognizes lipopolysaccharide for bacterial phagocytosis.
    statement: >-
      Dictyostelium lacks Fc-gamma and complement receptors and uses its own
      receptors to recognize bacteria. Receptor classes are therefore modelled
      as lineage-specific variants feeding a shared core.
    supporting_text: as typical phagocytic receptors, such as complement receptors or Fcγ receptors, have not been found in Dictyostelium, it remains mysterious how these cells recognize bacteria
  - source_id: file:modules/fc_gamma_receptor_signaling.yaml
    title: "Module: Fc-gamma receptor signaling pathway"
    statement: >-
      The Fc-gamma receptor recognition variant here covers only the engulfment
      role. MODULE:fc_gamma_receptor_signaling models the full ITAM/SYK/BTK
      signaling pathway, including the PLC-gamma and inflammatory branches.
  - source_id: file:modules/phagosome_maturation.yaml
    title: "Module: Phagosome maturation"
    statement: >-
      Sibling module. The sealed nascent phagosome produced here is the input to
      phagosome maturation.
notes: >-
  Boundary: this module runs from particle recognition to closure of the
  phagocytic cup. It does not include phagosome maturation (the Rab5-to-Rab7
  transition, lysosome fusion, acidification and the NADPH oxidase), which is in
  MODULE:phagosome_maturation. Also excluded: generation of "eat-me" signals on
  the target (for example XKR8-mediated phosphatidylserine exposure,
  GO:0070782), find-me chemotaxis, "don't-eat-me" checkpoints (CD47-SIRPA), and
  the inflammatory and transcriptional outputs of phagocytic receptors.
  LC3-associated phagocytosis (RUBCN, NOX2, ATG16L1 WD40 domain) is a related
  route that has not been modelled here.

  Taxon scope. The context is Eukaryota because the core that turns receptor
  signals into a phagocytic cup is shared by animals and phagotrophic amoebae.
  Dictyostelium needs Rac GTPases (PMID:10825297), the SCAR/WAVE
  nucleation-promoting factor (PMID:11683394) and the Arp2/3 complex
  (PMID:11807934, PMID:36897976) to engulf particles, and makes PI(3,4,5)P3 at
  engulfment sites (PMID:15572406). Each lineage-specific part carries its own
  taxon context. The Fc-gamma receptor, CR3 and Dectin-1 variants are
  vertebrate-only. TIMD4, GAS6 and MERTK in the apoptotic-cell variant are
  vertebrate-only, while the CED-1/Draper/MEGF10 receptor, CED-6/GULP and the
  Draper-Shark kinase link are bilaterian. The fAR1/SibA variant is shown only
  in Dictyostelium.

  Three core annotons have evidence from animals only. (1) The CRK/DOCK180/ELMO
  Rac GEF. PAINT places DOCK GEF activity at a eukaryote-level node, and
  Dictyostelium has an ELMO-DockD complex that acts on Rac during motility
  (PMID:19037099). But the best-studied amoebal ELMO, ElmoA, restrains
  phagocytosis rather than promoting it (PMID:18854143), and no amoebal
  CRK ortholog is known. (2) Class I PI3K at cup closure. In Dictyostelium,
  class I PI3K products appear at engulfment sites, but a loss-of-function
  phagocytosis defect for pikA/pikB was not found in the literature reviewed
  here. (3) Dynamin at cup closure. Dictyostelium dynamin A acts on
  endo-lysosomal membranes and not at the plasma membrane (PMID:9880338), so
  only mammalian dynamin 2 evidence supports this step.

  Receptor variants are alternatives (ONE_OR_MORE). A professional phagocyte
  usually uses several at once, and opsonic and non-opsonic routes can
  cooperate. The apoptotic-cell variant combines vertebrate receptors (TIMD4, the
  GAS6-MERTK bridge) with the CED-1/Draper/MEGF10 receptor family, its
  CED-6/GULP adaptor and the Syk-like kinase Shark. The CED-1/MEGF10 receptor
  is grounded on PTHR24035, the family PANTHER's own classification and PAINT
  use (ced-1 and Draper in SF109, MEGF10 in SF136). The UniProt/InterPro
  cross-references name PTHR24043 and PTHR24052 instead; see
  projects/PANTHER_FAMILY_ASSIGNMENT_DISCREPANCIES.md. PANTHER also places
  Dictyostelium SibA in SF109 (PROTEIN DRAPER), and SibA is a seed of the PAINT
  node PTN009076277 that carries scavenger receptor activity for CED-1 and
  MEGF10. SibA is nevertheless modelled as a separate amoebal gene product,
  because its assayed role is adhesion to particles and no ligand-binding
  activity has been shown. Whether it shares an ancestral engulfment-receptor
  function with CED-1 is recorded as a knowledge gap.

  Not modelled as annotons. TM9/Phg1 nonaspanins (Dictyostelium Phg1A,
  Drosophila TM9SF4) are needed for adhesion to particles and phagocytosis in
  both lineages (PMID:10944536, PMID:18796536). Phg1A acts by setting the
  surface level of SibA (PMID:22219373), so it supports recognition rather than
  carrying it out. Formins (Dictyostelium ForB and ForG) build linear actin at
  the cup base (PMID:36897976) and could be added as a further actin annoton.

  The worm DYN-1 gene review places DYN-1's engulfment-cell role at phagosome
  maturation (GO:0090386). Mammalian dynamin 2 also acts earlier, at
  pseudopod extension. The dynamin family therefore appears in this module for
  cup closure (DNM2 evidence) and again in MODULE:phagosome_maturation (DYN-1
  evidence).
module:
  id: phagocytic_engulfment
  label: Phagocytic engulfment
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: phagocytosis, engulfment
      term:
        id: GO:0006911
        label: phagocytosis, engulfment
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        notes: >-
          The Rac-to-Arp2/3 core of cup formation is shared by animal phagocytes
          and phagotrophic amoebae such as Dictyostelium. Receptor variants and
          some core annotons are narrower; each lineage-specific variant states
          its own taxon context, and the module notes list the core annotons
          that have evidence from animals only.
    cell_types:
      - preferred_term: phagocyte
        term:
          id: CL:0000234
          label: phagocyte
        notes: >-
          Includes professional phagocytes (macrophages, neutrophils, dendritic
          cells, insect hemocytes), non-professional engulfing cells such as the
          C. elegans hypodermal and gonadal sheath cells that clear apoptotic
          corpses, and free-living amoebae that feed on bacteria.
    cellular_components:
      - preferred_term: phagocytic cup
        term:
          id: GO:0001891
          label: phagocytic cup
  parts:
    - order: 1
      role: particle recognition
      node:
        id: particle_recognition
        label: Particle recognition by phagocytic receptors
        module_type: BIOLOGICAL_PROCESS
        description: >-
          A cell-surface receptor binds the particle, either directly or through an
          opsonin or bridging molecule. The receptors cluster and signal across
          the plasma membrane.
        concepts:
          - preferred_term: phagocytosis, recognition
            term:
              id: GO:0006910
              label: phagocytosis, recognition
        variant_sets:
          - id: phagocytic_receptor_class
            label: Phagocytic receptor class
            axis: receptor class and target ligand
            selection: ONE_OR_MORE
            notes: >-
              The receptor class decides which Rho GTPase program is used
              downstream (see Rho-family GTPase activation) and whether uptake is
              inflammatory. For example, IgG-dependent uptake triggers a
              respiratory burst and complement-dependent uptake does not
              (PMID:9831565). Receptor classes are lineage-specific, and each
              variant carries its own taxon context.
            variants:
              - id: fc_gamma_receptor_recognition
                label: Fc-gamma receptor recognition of IgG-opsonized particles
                module_type: SIGNALING_PATHWAY
                description: >-
                  Activating Fc-gamma receptors bind IgG-coated particles. ITAM
                  phosphorylation recruits SYK, which is required for
                  internalization after actin cups have formed.
                context:
                  taxa:
                    - preferred_term: Vertebrata
                      term:
                        id: NCBITaxon:7742
                        label: Vertebrata <vertebrates>
                      notes: >-
                        Lineage-specific variant. IgG-dependent uptake is a
                        vertebrate adaptive-immune mechanism, so the participants
                        are human gene products, not families.
                concepts:
                  - preferred_term: Fc-gamma receptor signaling pathway involved in phagocytosis
                    term:
                      id: GO:0038096
                      label: Fc-gamma receptor signaling pathway involved in phagocytosis
                annotons:
                  - id: fcgr2a_igg_receptor
                    label: FCGR2A IgG receptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FCGR2A
                        term:
                          id: UniProtKB:P12318
                          label: Low affinity immunoglobulin gamma Fc region receptor II-a
                    function:
                      preferred_term: IgG receptor activity
                      term:
                        id: GO:0019770
                        label: IgG receptor activity
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Representative activating Fc-gamma receptor with an ITAM in its
                      own cytoplasmic tail. It binds the Fc region of IgG on opsonized
