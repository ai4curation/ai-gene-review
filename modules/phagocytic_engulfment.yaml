  - id: PMID:16950926
    title: RacG regulates morphology, phagocytosis, and chemotaxis.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified (Somesh et al. 2006, Eukaryot Cell); full text
