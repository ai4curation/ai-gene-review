id: MODULE:phagocytic_engulfment
title: Phagocytic engulfment
description: >-
  Phagocytic engulfment is the receptor-driven internalization of a large
  particle (a microbe, an opsonized target, or an apoptotic cell) into a
  plasma-membrane-derived vacuole, the nascent phagosome. A cell-surface receptor
  recognizes the particle, either directly (beta-glucan, phosphatidylserine) or
  through a bound opsonin or bridging ligand (IgG, iC3b, GAS6). Receptor
  engagement then activates Rho-family GTPases, Rac and Cdc42 for Fc-gamma and
  apoptotic-cell receptors and RhoA for complement receptor 3. The GTPases drive
  Arp2/3-dependent actin polymerization that extends pseudopods around the
  particle. Class I PI3K activity and dynamin are then needed to complete
  pseudopod extension and close the phagocytic cup. The receptor-to-Rac core is
  conserved between nematodes and mammals: the CED-1/CED-6 and CED-2/CED-5/CED-12
  routes of C. elegans correspond to MEGF10/GULP1 and CRK/DOCK1/ELMO1 upstream of
  Rac1.
status: DRAFT
references:
  - id: PMID:25319336
    title: "Phagocytosis: receptors, signal integration, and the cytoskeleton."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified review (Freeman & Grinstein 2014). Supports the receptor
        repertoire and the staged actin-remodeling framework used to order parts
        2-4 of this module.
  - id: PMID:21910624
    title: The cell biology of phagocytosis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified review (Flannagan, Jaumouille & Grinstein 2012). Supports
        the module boundary: phagosome formation here, maturation in
        MODULE:phagosome_maturation.
  - id: PMID:9831565
    title: Identification of two distinct mechanisms of phagocytosis controlled by different Rho GTPases.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. Defines the Rac/Cdc42 (Fc-gamma receptor, type I) versus
        RhoA (CR3, type II) split that is modelled as the Rho-GTPase variant set.
  - id: PMID:9314552
    title: A critical role for Syk in signal transduction and phagocytosis mediated by Fcgamma receptors on macrophages.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. Syk-deficient macrophages form actin
        cups but fail to internalize IgG-coated particles, and PI3K inhibitors
        arrest at the same stage.
  - id: PMID:10783245
    title: Involvement of the Arp2/3 complex in phagocytosis mediated by FcgammaR or CR3.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified (May et al. 2000). The cached record has no abstract, so
        it is cited by title only for Arp2/3 involvement in both FcgammaR and CR3
        uptake.
  - id: PMID:10601359
    title: Dynamin 2 is required for phagocytosis in macrophages.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Dominant-negative dynamin 2 arrests membrane extension around the particle.
  - id: PMID:11581283
    title: Distinct roles of class I and class III phosphatidylinositol 3-kinases in phagosome formation and maturation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. Class I PI3K is required for optimal
        phagocytosis but not for maturation. This separates the class I PI3K step
        here from the class III (VPS34) step in MODULE:phagosome_maturation.
  - id: PMID:12163569
    title: Dectin-1 is a major beta-glucan receptor on macrophages.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; grounds the non-opsonic beta-glucan receptor variant.
  - id: PMID:17960135
    title: Identification of Tim4 as a phosphatidylserine receptor.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; grounds TIMD4 as a phosphatidylserine-recognizing engulfment receptor.
  - id: PMID:11163239
    title: CED-1 is a transmembrane receptor that mediates cell corpse engulfment in C. elegans.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; CED-1 is the engulfment receptor of the CED-1/CED-6/CED-7 route.
  - id: PMID:9635426
    title: Candidate adaptor protein CED-6 promotes the engulfment of apoptotic cells in C. elegans.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; CED-6 is a PTB-domain adaptor that acts in engulfing cells.
  - id: PMID:9635425
    title: The C. elegans cell corpse engulfment gene ced-7 encodes a protein similar to ABC transporters.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. CED-7 acts in both dying and engulfing cells. Its
        mechanism is a proposal in the paper, so it is recorded as a knowledge gap
        and not as an annoton.
  - id: PMID:9548255
    title: C. elegans phagocytosis and cell-migration protein CED-5 is similar to human DOCK180.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; establishes CED-5 as the DOCK180 ortholog.
  - id: PMID:10707082
    title: CED-2/CrkII and CED-10/Rac control phagocytosis and cell migration in Caenorhabditis elegans.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; places CED-2/CrkII and CED-5 upstream of CED-10/Rac in engulfing cells.
  - id: PMID:11595183
    title: CED-12/ELMO, a novel member of the CrkII/Dock180/Rac pathway, is required for phagocytosis and cell migration.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; CED-12/ELMO binds CED-5/Dock180 to form the Rac-activating complex.
  - id: PMID:12134158
    title: Unconventional Rac-GEF activity is mediated through the Dock180-ELMO complex.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; shows that the GEF (Docker/DHR-2) activity lies in Dock180 and needs ELMO.
  - id: PMID:15744306
    title: Two pathways converge at CED-10 to mediate actin rearrangement and corpse removal in C. elegans.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. Both C. elegans engulfment routes converge on CED-10/Rac.
        Also the source for the open question of how CED-1/CED-6 signalling
        reaches actin.
  - id: PMID:27170117
    title: Megf10 Is a Receptor for C1Q That Mediates Clearance of Apoptotic Cells by Astrocytes.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. Megf10 binds C1q with high affinity and confers
        apoptotic-cell phagocytosis. Grounds the MF of the CED-1/MEGF10 annoton.
  - id: PMID:20526330
    title: Caenorhabditis elegans transthyretin-like protein TTR-52 mediates recognition of apoptotic cells by the CED-1 phagocyte receptor.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached. TTR-52 binds both phosphatidylserine and the CED-1
        extracellular domain and is needed for CED-1 clustering. Grounds the
        TTR-52 bridging annoton.
evidence:
  - source_id: GO:0006911
    title: phagocytosis, engulfment
    statement: >-
      The module is grounded in the GO process for internalizing a particle by
      surrounding it with plasma membrane. Recognition (GO:0006910) is modelled as
      the first part. Phagosome maturation (GO:0090382) is a separate module.
  - source_id: PMID:25319336
    title: "Phagocytosis: receptors, signal integration, and the cytoskeleton."
    statement: >-
      Receptor diversity and staged actin remodeling (cortical disruption, then
      polymerization for pseudopod extension, then termination for closure) set
      the part order of this module.
    supporting_text: the actin polymerization that propels pseudopod extension
  - source_id: PMID:15744306
    title: Two pathways converge at CED-10 to mediate actin rearrangement and corpse removal in C. elegans.
    statement: >-
      The two partially redundant C. elegans engulfment routes share a Rac
      output. This supports treating receptor classes as alternative entry
      points into a shared Rho-GTPase/actin core.
    supporting_text: two conserved, partially redundant genetic pathways regulate this process
  - source_id: file:modules/fc_gamma_receptor_signaling.yaml
    title: "Module: Fc-gamma receptor signaling pathway"
    statement: >-
      The Fc-gamma receptor recognition variant here covers only the engulfment
      role. MODULE:fc_gamma_receptor_signaling models the full ITAM/SYK/BTK
      signaling pathway, including the PLC-gamma and inflammatory branches.
  - source_id: file:modules/phagosome_maturation.yaml
    title: "Module: Phagosome maturation"
    statement: >-
      Sibling module. The sealed nascent phagosome produced here is the input to
      phagosome maturation.
notes: >-
  Boundary: this module runs from particle recognition to closure of the
  phagocytic cup. It does not include phagosome maturation (the Rab5-to-Rab7
  transition, lysosome fusion, acidification and the NADPH oxidase), which is in
  MODULE:phagosome_maturation. Also excluded: generation of "eat-me" signals on
  the target (for example XKR8-mediated phosphatidylserine exposure,
  GO:0070782), find-me chemotaxis, "don't-eat-me" checkpoints (CD47-SIRPA), and
  the inflammatory and transcriptional outputs of phagocytic receptors.
  LC3-associated phagocytosis (RUBCN, NOX2, ATG16L1 WD40 domain) is a related
  route that has not been modelled here.

  Receptor variants are alternatives (ONE_OR_MORE). A professional phagocyte
  usually uses several at once, and opsonic and non-opsonic routes can
  cooperate. The apoptotic-cell variant combines mammalian receptors (TIMD4, the
  GAS6-MERTK bridge) with the CED-1/MEGF10 receptor family and its CED-6/GULP
  adaptor. The CED-1/MEGF10 receptor is grounded on PTHR24035, the family
  PANTHER's own classification and PAINT use (ced-1 and Draper in SF109,
  MEGF10 in SF136). The UniProt/InterPro cross-references name PTHR24043 and
  PTHR24052 instead; see projects/PANTHER_FAMILY_ASSIGNMENT_DISCREPANCIES.md.
  CED-12/ELMO representatives are
  human ELMO1 and Drosophila Ced-12, which UniProt places in PTHR12771. C.
  elegans CED-12 (Q8STE5) has no PANTHER cross-reference and is named only in
  prose.

  The worm DYN-1 gene review places DYN-1's engulfment-cell role at phagosome
  maturation (GO:0090386). Mammalian dynamin 2 also acts earlier, at
  pseudopod extension. The dynamin family therefore appears in this module for
  cup closure (DNM2 evidence) and again in MODULE:phagosome_maturation (DYN-1
  evidence).
module:
  id: phagocytic_engulfment
  label: Phagocytic engulfment
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: phagocytosis, engulfment
      term:
        id: GO:0006911
        label: phagocytosis, engulfment
  context:
    taxa:
      - preferred_term: Metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        notes: >-
          Phagocytosis is older than animals (it is well studied in amoebozoans
          such as Dictyostelium). The receptor repertoire modelled here is
          metazoan, and the Fc-gamma and complement receptor variants are
          vertebrate-specific.
    cell_types:
      - preferred_term: phagocyte
        term:
          id: CL:0000234
          label: phagocyte
        notes: >-
          Includes professional phagocytes (macrophages, neutrophils, dendritic
          cells) and non-professional engulfing cells such as the C. elegans
          hypodermal and gonadal sheath cells that clear apoptotic corpses.
    cellular_components:
      - preferred_term: phagocytic cup
        term:
          id: GO:0001891
          label: phagocytic cup
  parts:
    - order: 1
      role: particle recognition
      node:
        id: particle_recognition
        label: Particle recognition by phagocytic receptors
        module_type: BIOLOGICAL_PROCESS
        description: >-
          A cell-surface receptor binds the particle, either directly or through an
          opsonin or bridging molecule. The receptors cluster and signal across
          the plasma membrane.
        concepts:
          - preferred_term: phagocytosis, recognition
            term:
              id: GO:0006910
              label: phagocytosis, recognition
        variant_sets:
          - id: phagocytic_receptor_class
            label: Phagocytic receptor class
            axis: receptor class and target ligand
            selection: ONE_OR_MORE
            notes: >-
              The receptor class decides which Rho GTPase program is used
              downstream (see Rho-family GTPase activation) and whether uptake is
              inflammatory. For example, IgG-dependent uptake triggers a
              respiratory burst and complement-dependent uptake does not
              (PMID:9831565).
            variants:
              - id: fc_gamma_receptor_recognition
                label: Fc-gamma receptor recognition of IgG-opsonized particles
                module_type: SIGNALING_PATHWAY
                description: >-
                  Activating Fc-gamma receptors bind IgG-coated particles. ITAM
                  phosphorylation recruits SYK, which is required for
                  internalization after actin cups have formed.
                concepts:
                  - preferred_term: Fc-gamma receptor signaling pathway involved in phagocytosis
                    term:
                      id: GO:0038096
                      label: Fc-gamma receptor signaling pathway involved in phagocytosis
                annotons:
                  - id: fcgr2a_igg_receptor
                    label: FCGR2A IgG receptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FCGR2A
                        term:
                          id: UniProtKB:P12318
                          label: Low affinity immunoglobulin gamma Fc region receptor II-a
                    function:
                      preferred_term: IgG receptor activity
                      term:
                        id: GO:0019770
                        label: IgG receptor activity
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Representative activating Fc-gamma receptor with an ITAM in its
                      own cytoplasmic tail. It binds the Fc region of IgG on opsonized
                      particles and starts phagocytic signaling when clustered.
                  - id: syk_fcgr_kinase
                    label: SYK kinase downstream of Fc-gamma receptors
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SYK
                        term:
                          id: UniProtKB:P43405
                          label: Tyrosine-protein kinase SYK
                    function:
                      preferred_term: non-membrane spanning protein tyrosine kinase activity
                      term:
                        id: GO:0004715
                        label: non-membrane spanning protein tyrosine kinase activity
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Binds phosphorylated receptor ITAMs and phosphorylates
                      downstream substrates. It is needed to go from actin-cup
                      formation to internalization of IgG-opsonized particles, but
                      not for uptake of latex beads or E. coli.
                    evidence:
                      - source_id: PMID:9314552
                        title: A critical role for Syk in signal transduction and phagocytosis mediated by Fcgamma receptors on macrophages.
                        statement: Syk-deficient macrophages make actin cups but do not internalize Fc-gamma receptor-bound particles.
                        supporting_text: Syk is required for FcγR-induced phagocytosis, but not for phagocytosis of latex beads or microorganisms.
                evidence:
                  - source_id: file:modules/fc_gamma_receptor_signaling.yaml
                    title: "Module: Fc-gamma receptor signaling pathway"
                    statement: The wider Fc-gamma receptor signaling pathway is modelled in its own module.
              - id: complement_receptor_3_recognition
                label: Complement receptor 3 recognition of iC3b-opsonized particles
