      target: rho_gtpase_activation
      connection_type: CAUSES
      description: >-
        Clustered phagocytic receptors signal (through ITAM/SYK, CRK/DOCK/ELMO,
        or CED-6/GULP) to activate Rho-family GTPases at the contact site.
    - source: rho_gtpase_activation
      target: phagocytic_actin_polymerization
      connection_type: CAUSES
      description: GTP-bound Cdc42/Rac recruit and activate WASP-family NPFs and the Arp2/3 complex.
    - source: phagocytic_actin_polymerization
      target: phagocytic_cup_closure
      connection_type: PRECEDES
      description: >-
        Pseudopod extension comes before PI3K- and dynamin-dependent cup
        closure. SYK loss, PI3K inhibition and dominant-negative dynamin 2 all
        arrest uptake after actin-cup formation.
knowledge_gaps:
  - gap_statement: >-
      The ligand that CED-1 recognizes on apoptotic cells, and so whether
      CED-1/MEGF10 has a direct ligand-binding molecular function, was not
      known when the C. elegans routes were defined.
    boundary: >-
      CED-1 is an engulfing-cell transmembrane receptor that clusters around
      corpses, and its tail motifs signal to CED-6. For mammalian MEGF10, high-
      affinity binding to the bridging eat-me signal C1q has been shown
      (PMID:27170117). The annoton now uses scavenger receptor activity, which
      the MEGF10 IDA and PAINT node PTN009076277 support. Whether these
      receptors bind phosphatidylserine directly is still open.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: NARROWING
    significance: >-
      A direct phosphatidylserine-binding activity would show whether the
      receptor reads the eat-me signal itself or only through bridging
      molecules.
    resolution: >-
      Curate direct-binding studies of the CED-1 and MEGF10 ectodomains with
      phosphatidylserine, and add a binding function if direct binding is
      established.
    provenance:
      - reference_id: PMID:15744306
