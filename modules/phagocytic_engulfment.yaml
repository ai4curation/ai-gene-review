id: MODULE:phagocytic_engulfment
title: Phagocytic engulfment
description: >-
  Phagocytic engulfment is the receptor-driven internalization of a large
  particle (a microbe, an opsonized target, or an apoptotic cell) into a
  plasma-membrane-derived vacuole, the nascent phagosome. A cell-surface receptor
  recognizes the particle, either directly (beta-glucan, phosphatidylserine) or
  through a bound opsonin or bridging ligand (IgG, iC3b, GAS6). Receptor
  engagement then activates Rho-family GTPases, Rac and Cdc42 for Fc-gamma and
  apoptotic-cell receptors and RhoA for complement receptor 3. The GTPases drive
  Arp2/3-dependent actin polymerization that extends pseudopods around the
  particle. Class I PI3K activity and dynamin are then needed to complete
  pseudopod extension and close the phagocytic cup. The Rac-to-actin core is
  shared by animal phagocytes and phagotrophic amoebae. In Dictyostelium, Rac
  GTPases, the SCAR/WAVE nucleation-promoting factor and the Arp2/3 complex build
  the phagocytic cup, and PI(3,4,5)P3 forms at the site of engulfment. The
  receptors differ between lineages. Amoebae recognize bacteria with receptors
  such as the GPCR fAR1 and the adhesion protein SibA. Animals use the
  CED-1/Draper/MEGF10 receptor family and its CED-6/GULP adaptor, and the
  CRK/DOCK180/ELMO Rac GEF (CED-2/CED-5/CED-12 in C. elegans). Vertebrates add
  opsonin receptors for IgG and complement and lectin receptors such as
  Dectin-1.
status: DRAFT
references:
