    title: Dynamin 2 is required for phagocytosis in macrophages.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Dominant-negative dynamin 2 arrests membrane extension around the particle.
  - id: PMID:11581283
    title: Distinct roles of class I and class III phosphatidylinositol 3-kinases in phagosome formation and maturation.
    reference_review:
