knowledge_gaps:
  - gap_statement: >-
      The ligand that CED-1 recognizes on apoptotic cells, and so whether
      CED-1/MEGF10 has a direct ligand-binding molecular function, was not
      known when the C. elegans routes were defined.
    boundary: >-
      CED-1 is an engulfing-cell transmembrane receptor that clusters around
      corpses, and its tail motifs signal to CED-6. For mammalian MEGF10, high-
      affinity binding to the bridging eat-me signal C1q has been shown
      (PMID:27170117). The annoton now uses scavenger receptor activity, which
      the MEGF10 IDA and PAINT node PTN009076277 support. Drosophila Draper, a
      member of the same family, binds phosphatidylserine directly in
      solid-phase and surface plasmon resonance assays (PMID:23420848).
      Whether CED-1 and MEGF10 also bind phosphatidylserine directly is still
      open.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: NARROWING
    significance: >-
      A direct phosphatidylserine-binding activity would show whether the
      receptor reads the eat-me signal itself or only through bridging
      molecules.
    resolution: >-
      Test direct binding of the CED-1 and MEGF10 ectodomains to
      phosphatidylserine with the solid-phase and surface plasmon resonance
      assays used for Draper.
    provenance:
      - reference_id: PMID:15744306
        supporting_text: probably recognizes an unknown ligand on the apoptotic cell
      - reference_id: PMID:23420848
        supporting_text: Draper is a phosphatidylserine-binding receptor for phagocytosis
  - gap_statement: >-
      How the CED-1/CED-6 route connects to actin remodeling, and which effectors
      sit between CED-6/GULP and the actin cytoskeleton, is unresolved.
    boundary: >-
      CED-1, CED-6 and CED-7 are needed for actin reorganization around the
      corpse, and the route converges with CED-2/5/12 on CED-10/Rac.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Without this link there is no causal connection from the CED-6/GULP annoton to the Rho-GTPase part.
    resolution: Identify direct CED-6/GULP effectors and test whether they activate CED-10/Rac or act on actin independently.
    provenance:
      - reference_id: PMID:15744306
        supporting_text: Molecular understanding of how the second pathway promotes engulfment of the apoptotic cell is lacking.
  - gap_statement: >-
      The molecular function of the ABC transporter CED-7 (ABCA1/ABCA7 in
      mammals) in engulfment is unknown, so it is not modelled as an annoton.
    boundary: >-
      CED-7 is a plasma-membrane ABC transporter that acts in both dying and
      engulfing cells and is needed for CED-1 to cluster around corpses.
      Genetically, with TTR-52 it promotes PS efflux from apoptotic cells in
      extracellular vesicles, but no transport assay has identified what the
      protein itself moves (see the ced-7 review).
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: CED-7 is a core genetic component of the CED-1 route but has no assignable activity in this module.
    resolution: Find the CED-7 transport substrate and test whether its transport activity is needed for corpse recognition.
    provenance:
      - reference_id: PMID:9635425
        supporting_text: We propose that CED-7 functions to translocate molecules that mediate homotypic adhesion
      - reference_id: PMID:22727702
        supporting_text: CED-7 and TTR-52 may promote the efflux of PS from apoptotic cells through the generation of extracellular PS vesicles
  - gap_statement: >-
      It is not known whether the ELMO-DOCK Rac GEF takes part in phagocytosis
      by amoebae, or which GEF activates Rac at the amoebal phagocytic cup.
    boundary: >-
      DOCK GEF activity is placed at a eukaryote-level PAINT node, and
      Dictyostelium DockD binds an ELMO protein and acts on Rac in cell
      motility. The amoebal ELMO studied for phagocytosis, ElmoA, restrains
      uptake instead of promoting it.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      This decides whether the CRK/DOCK/ELMO arm of the module is eukaryote-wide
      or an animal addition to an older Rac-to-actin core.
    resolution: >-
      Measure particle uptake in Dictyostelium dock and elmo single and multiple
      mutants, and test which Rac GEFs are active at the phagocytic cup.
    provenance:
      - reference_id: PMID:18854143
        supporting_text: Cells lacking ElmoA display an elevated rate of phagocytosis
      - reference_id: PMID:19037099
        supporting_text: DdELMO1 is associated with DockD and that Rac1A and RacC are possible in vivo DockD substrates
  - gap_statement: >-
      Whether Dictyostelium SibA and the CED-1/Draper/MEGF10 receptors share an
      ancestral engulfment-receptor function is unknown.
    boundary: >-
      PANTHER classifies SibA in the same subfamily as ced-1 and Draper, and
      SibA is a seed of PAINT node PTN009076277, where it seeds the plasma
      membrane annotation; the scavenger receptor activity annotation there is
      seeded by CED-1 and MEGF10 only. SibA is needed for amoebae to adhere to phagocytic
      particles, but no ligand of SibA has been identified.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      A shared function would make the CED-1/Draper/MEGF10 receptor family a
      eukaryote-wide part of particle recognition rather than a bilaterian one.
    resolution: >-
      Identify what the SibA ectodomain binds on bacteria or beads, and test
      whether SibA rescues engulfment by ced-1 or drpr mutant cells.
    provenance:
      - reference_id: PMID:16699495
        supporting_text: genetic inactivation of SIBA affects adhesion to phagocytic particles
