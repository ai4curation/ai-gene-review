  - id: PMID:9831565
    title: Identification of two distinct mechanisms of phagocytosis controlled by different Rho GTPases.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. Defines the Rac/Cdc42 (Fc-gamma receptor, type I) versus
