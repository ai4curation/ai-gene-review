    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified (Isik et al. 2008, Dev Cell); abstract only.
        Dictyostelium ElmoA restrains phagocytosis, so it is not used as an
