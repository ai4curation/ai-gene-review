            role_description: >-
              Collects on early phagosomes in a PI3K-dependent way. It is needed
              for membrane extension around the particle and is thought to help
              deliver focal membrane and seal the phagosome.
            evidence:
              - source_id: PMID:10601359
                title: Dynamin 2 is required for phagocytosis in macrophages.
                statement: Dominant-negative dynamin 2 blocks internalization at the membrane-extension stage, and PI3K inhibition prevents dynamin recruitment.
                supporting_text: significantly inhibits particle internalization at the stage of membrane extension around the particle
              - source_id: PMID:9880338
                title: Disruption of a dynamin homologue affects endocytosis, organelle morphology, and cytokinesis in Dictyostelium discoideum.
                statement: Dictyostelium dynamin A acts on endo-lysosomal membranes and not at the plasma membrane, which limits this step to the animal evidence.
