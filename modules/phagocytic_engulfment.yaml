    title: "Phagocytosis: receptors, signal integration, and the cytoskeleton."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified review (Freeman & Grinstein 2014). Supports the receptor
        repertoire and the staged actin-remodeling framework used to order parts
        2-4 of this module.
  - id: PMID:21910624
    title: The cell biology of phagocytosis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified review (Flannagan, Jaumouille & Grinstein 2012). Supports
