  - id: PMID:19037099
    title: Dictyostelium Dock180-related RacGEFs regulate the actin cytoskeleton during cell motility.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified (Para et al. 2009, MBoC); full text cached. An
        ELMO-DockD complex acts on Rac in amoebal motility. Phagocytosis was not
        the readout.
  - id: PMID:9880338
    title: Disruption of a dynamin homologue affects endocytosis, organelle morphology, and cytokinesis in Dictyostelium discoideum.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified (Wienke et al. 1999, MBoC); abstract only.
