                statement: The PIK3CD review gives 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity (GO:0046934) as the core MF.
              - source_id: PMID:15572406
                title: In vivo analysis of 3-phosphoinositide dynamics during Dictyostelium phagocytosis and chemotaxis.
                statement: >-
                  In Dictyostelium the class I PI3K product PI(3,4,5)P3 rises
                  transiently at engulfment sites. This shows the same lipid step
                  in amoebae but is not loss-of-function evidence.
                supporting_text: During phagocytosis and macropinocytosis PtdIns(3,4,5)P3 levels transiently increased at sites of engulfment
            notes: >-
              The requirement for class I PI3K at cup closure is shown in
              mammalian macrophages. Amoebal representatives are not listed
              because a phagocytosis defect in Dictyostelium pikA/pikB mutants
              was not found in the literature reviewed here.
          - id: dynamin_cup_closure
            label: Dynamin GTPase at the forming phagosome
