        label: Calnexin/calreticulin lectin chaperone
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Calnexin/calreticulin family
            term:
              id: PANTHER:PTHR11073
              label: CALRETICULIN AND CALNEXIN
            representative_members:
            - preferred_term: CANX (human)
              term:
                id: UniProtKB:P27824
                label: Calnexin
            - preferred_term: CALR (human)
              term:
                id: UniProtKB:P27797
                label: Calreticulin
            ancestral_nodes:
            - preferred_term: PAINT node PTN000117401
              term:
                id: PANTHER:PTN000117401
                label: PTN000117401
              description: 'PANTHER PAINT ancestral node PTN000117401 in family PTHR11073, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Aspergillus fumigatus,
                Caenorhabditis elegans, Canis lupus familiaris, Drosophila melanogaster, Homo sapiens,
                Mus musculus, Mycosarcoma maydis, Rattus norvegicus, Saccharomyces cerevisiae and Schizosaccharomyces
                pombe. IBD GO terms at this node: C:GO:0005789, F:GO:0005509, P:GO:0006457, P:GO:0036503.
                PAINT rows dated 20230405-20260528. Human CANX descends from it (its IBA rows cite PTN000117401;
                it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000117401 in PANTHER family PTHR11073.
        function:
          preferred_term: carbohydrate binding
          term:
            id: GO:0030246
            label: carbohydrate binding
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: Lectin chaperones that hold monoglucosylated glycoproteins until they fold.
        evidence:
