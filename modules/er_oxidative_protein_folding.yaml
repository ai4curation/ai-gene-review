        - source_id: file:genes/human/CALR/CALR-ai-review.yaml
          statement: 'Reviewed core function of human CALR: carbohydrate binding.'
        - source_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  connections:
  - source: bip_folding
    target: disulfide_relay
    connection_type: PRECEDES
    description: BiP-held folding intermediates are oxidized by PDI.
