id: MODULE:er_oxidative_protein_folding
title: Oxidative protein folding in the ER
description: Proteins entering the endoplasmic reticulum fold in its lumen with the help of the Hsp70
  chaperone BiP and form disulfide bonds through a relay in which protein disulfide isomerase oxidizes
  the substrate and is itself reoxidized by the flavoprotein Ero1, which passes the electrons to oxygen.
  Glycoproteins are also monitored by the calnexin/calreticulin cycle. This module is the eukaryote-wide
  core of ER folding, written so that it can be evaluated in any genome.
status: DRAFT
scope: CONCRETE
notes: 'Eukaryote-wide scope: PAINT places the BiP ER-lumen node and the Ero1 node at Eukaryota (taxon:2759);
  the PDI node carries no taxon in the source rows. Each node is shown to be an ancestor of the human
  protein by its IBA rows or its IBD seeds. Read as a satisfiability rule, BiP and PDI are expected in
  any eukaryote. Ero1 is optional because PDI has other reoxidation routes that are not modelled here
  (see the Ero1 part). The glycoprotein quality-control cycle (UGGT with calnexin/calreticulin) is optional:
  its parts are lineage-variable, and whether it is complete in every eukaryote has not been checked here.
  Two selectors over-match by design and say so on their families: the Hsp70 family for BiP and the PDI
  family for PDI. The rule therefore tests that the folding machinery''s families are present, not that
  the ER paralog is. Molecular functions come from the human gene reviews'' core functions. Not modelled:
  other PDI-family oxidoreductases, the alternative PDI oxidants (peroxiredoxin-4, VKOR-family enzymes,
  GPX7/8), the BiP co-chaperones (Sec63, ERdj proteins, Lhs1/GRP170), and the glucosidases I and II that
  trim N-glycans.'
module:
  id: er_oxidative_protein_folding
  label: Oxidative protein folding in the ER
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein folding in endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
  parts:
  - order: 1
    role: chaperone-assisted folding
    node:
      id: bip_folding
      label: BiP chaperone
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: bip_chaperone
        label: BiP/Kar2 ER Hsp70 chaperone
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Hsp70 family
            term:
              id: PANTHER:PTHR19375
              label: HEAT SHOCK PROTEIN 70KDA
            representative_members:
            - preferred_term: HSPA5 (human)
              term:
                id: UniProtKB:P11021
                label: Endoplasmic reticulum chaperone BiP
            ancestral_nodes:
            - preferred_term: PAINT node PTN001834223
              term:
                id: PANTHER:PTN001834223
                label: PTN001834223
              description: 'PANTHER PAINT ancestral node PTN001834223 in family PTHR19375, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana, Caenorhabditis elegans, Drosophila melanogaster,
                Homo sapiens, Mus musculus, Mycosarcoma maydis, Rattus norvegicus, Saccharomyces cerevisiae,
                Schizosaccharomyces pombe and 1 seed(s) whose species is not resolved locally (UniProtKB:Q6Z7B0).
                IBD GO terms at this node: C:GO:0005634, C:GO:0005788, C:GO:0016020, C:GO:0034663, P:GO:0030968,
                P:GO:0036503. PAINT rows dated 20170831-20260529. Human HSPA5 descends from it (its IBA
                rows cite PTN001834223; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN001834223 in PANTHER family PTHR19375.
            - preferred_term: PAINT node PTN000452648
              term:
                id: PANTHER:PTN000452648
                label: PTN000452648
              description: 'PANTHER PAINT ancestral node PTN000452648 in family PTHR19375, given no taxon
                in the source PAINT rows; IBD seeds from Caenorhabditis elegans, Drosophila melanogaster,
                Escherichia coli, Homo sapiens, Mus musculus, Rattus norvegicus, Saccharomyces cerevisiae,
                Schizosaccharomyces pombe and 2 seed(s) whose species is not resolved locally (UniProtKB:Q57VR7,
                UniProtKB:Q8IB24). IBD GO terms at this node: F:GO:0016887, F:GO:0031072, F:GO:0044183,
                P:GO:0042026. PAINT rows dated 20221122-20260828. Human HSPA5 descends from it (its IBA
                rows cite PTN000452648; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000452648 in PANTHER family PTHR19375.
            description: The PANTHER family is the whole Hsp70 family with no subfamily split in interpro/panther/PTHR19375/PTHR19375-entries.csv,
              so the selector over-matches cytosolic, mitochondrial and plastid Hsp70s. The PANTHER member
              index places human HSPA5 in subfamily PTHR19375:SF380, but which lineages SF380 covers is
              not recorded locally, so it is not used as the selector. Node PTN001834223, at Eukaryota
              with C:GO:0005788 ER lumen, establishes the eukaryote-wide ER clade but is not part of the
              selector.
        function:
          preferred_term: ATP-dependent protein folding chaperone
          term:
            id: GO:0140662
            label: ATP-dependent protein folding chaperone
        locations:
        - preferred_term: endoplasmic reticulum lumen
          term:
            id: GO:0005788
            label: endoplasmic reticulum lumen
        role_description: Lumenal Hsp70 that binds unfolded segments of incoming chains, assists folding
          and gates the translocon from the lumenal side.
        evidence:
        - source_id: file:genes/human/HSPA5/HSPA5-ai-review.yaml
          statement: 'Reviewed core function of human HSPA5: ATP-dependent protein folding chaperone.'
        - source_id: file:interpro/panther/PTHR19375/PTHR19375-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 2
    role: disulfide bond formation
    node:
      id: disulfide_relay
      label: PDI-Ero1 disulfide relay
      module_type: REACTION
      annotons:
      - id: pdi_isomerase
        label: Protein disulfide isomerase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: PDI family
            term:
              id: PANTHER:PTHR18929
              label: PROTEIN DISULFIDE ISOMERASE
            representative_members:
            - preferred_term: P4HB (human)
              term:
                id: UniProtKB:P07237
                label: Protein disulfide-isomerase
            ancestral_nodes:
            - preferred_term: PAINT node PTN000432607
              term:
                id: PANTHER:PTN000432607
                label: PTN000432607
              description: 'PANTHER PAINT ancestral node PTN000432607 in family PTHR18929, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Caenorhabditis elegans,
                Drosophila melanogaster, Homo sapiens, Mus musculus, Oryza sativa subsp. japonica, Rattus
                norvegicus, Saccharomyces cerevisiae and 2 seed(s) whose species is not resolved locally
                (UniProtKB:C0H4Y6, UniProtKB:Q4WH99). IBD GO terms at this node: C:GO:0005783, F:GO:0003756,
                P:GO:0006457, P:GO:0034976. PAINT rows dated 20250903-20260828. Human P4HB descends from
                it (its IBA rows cite PTN000432607; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000432607 in PANTHER family PTHR18929.
            description: The family also holds the other PDI-family oxidoreductases (ERp57/PDIA3, PDIA4,
              ERp27 and plant PDI-like proteins), so the selector is met by any of them. Human P4HB's
              subfamily SF101 is vertebrate-only and yeast Pdi1 and plant PDIL1-1 sit in SF132, so no
              single subfamily is eukaryote-wide.
        function:
          preferred_term: protein disulfide isomerase activity
          term:
            id: GO:0003756
            label: protein disulfide isomerase activity
        locations:
        - preferred_term: endoplasmic reticulum lumen
          term:
            id: GO:0005788
            label: endoplasmic reticulum lumen
        role_description: Introduces and rearranges disulfide bonds in folding secretory proteins; reoxidized
          by Ero1.
        evidence:
        - source_id: file:genes/human/P4HB/P4HB-ai-review.yaml
          statement: 'Reviewed core function of human P4HB: protein disulfide isomerase activity.'
        - source_id: file:interpro/panther/PTHR18929/PTHR18929-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      parts:
      - order: 1
        role: PDI reoxidation
        optional: true
        node:
          id: ero1_reoxidation
          label: Ero1 reoxidation of PDI
          module_type: REACTION
          annotons:
          - id: ero1_oxidase
            label: Ero1 sulfhydryl oxidase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Ero1 family
                term:
                  id: PANTHER:PTHR12613
                  label: ERO1-RELATED
                representative_members:
                - preferred_term: ERO1A (human)
                  term:
                    id: UniProtKB:Q96HE7
                    label: ERO1-like protein alpha
                ancestral_nodes:
                - preferred_term: PAINT node PTN000289179
                  term:
                    id: PANTHER:PTN000289179
                    label: PTN000289179
                  description: 'PANTHER PAINT ancestral node PTN000289179 in family PTHR12613, placed
                    at taxon:2759 (Eukaryota); IBD seeds from Arabidopsis thaliana, Caenorhabditis elegans,
                    Drosophila melanogaster, Homo sapiens, Mus musculus, Saccharomyces cerevisiae, Schizosaccharomyces
                    pombe and 1 seed(s) whose species is not resolved locally (UniProtKB:Q6AVU2). IBD
                    GO terms at this node: C:GO:0005789, F:GO:0015035, P:GO:0030968, P:GO:0034975. PAINT
                    rows dated 20170228-20260528. Human ERO1A descends from it (its IBA rows cite PTN000289179;
                    it is one of the node''s IBD seeds).'
                  evidence:
                  - source_id: GO_REF:0000033
                    statement: IBD propagation from PAINT ancestral node PTN000289179 in PANTHER family
                      PTHR12613.
                description: The family holds only Ero1 proteins (human ERO1A and ERO1B, yeast Ero1, plant
                  AERO1/2).
            function:
              preferred_term: flavin-dependent sulfhydryl oxidase activity
              term:
                id: GO:0016971
                label: flavin-dependent sulfhydryl oxidase activity
            locations:
            - preferred_term: endoplasmic reticulum membrane
              term:
                id: GO:0005789
                label: endoplasmic reticulum membrane
            role_description: FAD-dependent oxidase that reoxidizes PDI, passing electrons to oxygen.
            evidence:
            - source_id: file:genes/human/ERO1A/ERO1A-ai-review.yaml
              statement: 'Reviewed core function of human ERO1A: flavin-dependent sulfhydryl oxidase activity.'
            - source_id: file:interpro/panther/PTHR12613/PTHR12613-paint.tsv
              statement: PAINT ancestral-node rows for this step's family.
          description: Optional because PDI can be reoxidized by more than one route. In animals peroxiredoxin-4,
            VKOR-family enzymes and GPX7/8 also do it, and none of these alternatives is modelled here,
            so a genome lacking Ero1 is not shown to lack the step. interpro/panther/PTHR12613/PTHR12613-entries.csv
            lists animal, fungal and Arabidopsis Ero1 but no Dictyostelium member; whether that is a loss
            has not been checked.
  - order: 3
    role: glycoprotein quality control
    optional: true
    node:
      id: calnexin_cycle
      label: Calnexin/calreticulin cycle
      module_type: MODULE
      annotons:
      - id: uggt_folding_sensor
        label: UGGT folding sensor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: UGGT family
            term:
              id: PANTHER:PTHR11226
              label: UDP-GLUCOSE GLYCOPROTEIN:GLUCOSYLTRANSFERASE
            representative_members:
            - preferred_term: UGGT1 (human)
              term:
                id: UniProtKB:Q9NYU2
                label: UDP-glucose:glycoprotein glucosyltransferase 1
            ancestral_nodes:
            - preferred_term: PAINT node PTN000132051
              term:
                id: PANTHER:PTN000132051
                label: PTN000132051
              description: 'PANTHER PAINT ancestral node PTN000132051 in family PTHR11226, placed at taxon:2759
