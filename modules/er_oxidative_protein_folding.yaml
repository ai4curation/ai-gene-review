                F:GO:0003980, P:GO:0006487. PAINT rows dated 20260528. Human UGGT1 descends from it (its
                IBA rows cite PTN000132051; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000132051 in PANTHER family PTHR11226.
            description: The family also holds budding yeast Kre5, which is UGGT-like but works in cell-wall
              beta-glucan synthesis, so in that lineage the selector over-matches.
        function:
          preferred_term: UDP-glucose:glycoprotein glucosyltransferase activity
          term:
            id: GO:0003980
            label: UDP-glucose:glycoprotein glucosyltransferase activity
        locations:
        - preferred_term: endoplasmic reticulum lumen
          term:
            id: GO:0005788
            label: endoplasmic reticulum lumen
