  connections:
    - source: g1_cdk_priming
      target: g1s_transcription_release
      connection_type: CAUSES
      description: >-
        G1 cyclin-CDK phosphorylation of the corepressor (Rb, Whi5) releases the
        G1/S transcription factor.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory phosphorylation edge.
    - source: g1s_transcription_release
      target: g1s_cdk_activation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The released transcription program produces the G1/S cyclins that
        activate the G1/S CDK.
      chaining_status: NOT_APPLICABLE
      chaining_note: Transcriptional input, not a metabolic intermediate.
    - source: g1s_cdk_activation
      target: g1s_transcription_release
      connection_type: POSITIVELY_REGULATES
      description: >-
        Positive feedback: G1/S cyclin-CDK reinforces corepressor phosphorylation
        (cyclin E-CDK2 on Rb; Cln1/2-Cdc28 on Whi5), making commitment
        switch-like and irreversible.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory feedback edge.
    - source: g1s_cdk_activation
      target: cki_destruction
      connection_type: CAUSES
      description: >-
        G1/S CDK multisite phosphorylation of the CKI creates the phosphodegron
        recognized by the SCF F-box adaptor.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory phosphorylation edge.
    - source: cki_destruction
      target: g1s_cdk_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Destruction of the CKI releases S-phase cyclin-CDK activity, completing
        the commitment positive feedback loop.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory feedback edge.
