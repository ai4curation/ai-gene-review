    - preferred_term: G1/S transition of mitotic cell cycle
      term:
        id: GO:0000082
        label: G1/S transition of mitotic cell cycle
      description: Commitment to a new division cycle at Start / the restriction point.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          The four-step logic is conserved across eukaryotes; representative
          members are taken from human, Saccharomyces cerevisiae and
          Schizosaccharomyces pombe.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
