id: MODULE:g1_s_transition
title: G1/S transition of the mitotic cell cycle (Start / restriction point)
description: >-
  A taxon-neutral decomposition of the G1/S transition: the commitment step
  ("Start" in yeasts, the "restriction point" in metazoa) at which a cell
  irreversibly enters a new division cycle. Four steps are modeled: (1) a G1
  cyclin-CDK (cyclin D-CDK4/6 in metazoa, Cln3-Cdc28 in budding yeast,
  Puc1/Cig-Cdc2 in fission yeast) accumulates with growth and phosphorylates the
  transcriptional corepressor of the G1/S program; (2) the G1/S transcription
  factor is released from its corepressor (Rb from E2F-DP in metazoa, Whi5 from
  SBF/MBF in budding yeast; fission yeast MBF has no Rb/Whi5-type corepressor and
  is modeled as its own variant); (3) the G1/S cyclins transcribed by that program
  (cyclin E, Cln1/2 and Clb5/6, Cig2) activate the G1/S CDK; and (4) the G1/S
  CDK phosphorylates the stoichiometric CDK inhibitor (p27/Kip1, Sic1, Rum1),
  marking it for SCF-dependent ubiquitination and proteasomal destruction, which
  releases S-phase CDK activity in a switch-like positive feedback loop. The
  module ends with active S-phase cyclin-CDK; DNA replication licensing and
  initiation are downstream and are not part of this module. Representative
  members are drawn from human, Saccharomyces cerevisiae and Schizosaccharomyces
  pombe. Grounded in GO:0000082 (G1/S transition of mitotic cell cycle).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000082
    title: G1/S transition of mitotic cell cycle
    statement: The module is grounded in the GO biological process term for the G1/S transition.
  - source_id: PMID:9442875
    title: "Cyclin-dependent kinases: engines, clocks, and microprocessors"
    statement: >-
      Review establishing the cyclin-CDK framework in which successive cyclin-CDK
      complexes drive the G1/S and G2/M transitions and are gated by CDK
      inhibitors and inhibitory phosphorylation.
  - source_id: PMID:23877564
    title: Control of cell cycle transcription during G1 and S phases
    statement: >-
      Review of the conserved logic of G1/S transcription: an Rb/Whi5-type
      corepressor bound to E2F/SBF/MBF is inactivated by CDK phosphorylation,
      releasing a G1/S transcriptional wave in metazoa and yeasts.
  - source_id: PMID:32946743
    title: Integrating Old and New Paradigms of G1/S Control
    statement: >-
      Review integrating the Rb-E2F and Whi5-SBF paradigms of G1/S commitment
      with positive feedback by G1/S cyclin-CDKs.
  - source_id: PMID:15210111
    title: CDK activity antagonizes Whi5, an inhibitor of G1/S transcription in yeast
    statement: >-
      Whi5 is the SBF-bound repressor of G1/S transcription in budding yeast and
      is antagonized by Cln-Cdc28 activity.
  - source_id: PMID:15210110
    title: Cln3 activates G1-specific transcription via phosphorylation of the SBF bound repressor Whi5
    statement: >-
      Cln3-Cdc28 phosphorylates Whi5 to release SBF and activate G1-specific
      transcription, the budding-yeast counterpart of Rb phosphorylation.
  - source_id: PMID:8372350
    title: A role for the transcription factors Mbp1 and Swi4 in progression from G1 to S phase
    statement: >-
      Mbp1 (MBF) and Swi4 (SBF) are the DNA-binding subunits of the two
      budding-yeast G1/S transcription factors.
  - source_id: PMID:1832338
    title: The role of SWI4 and SWI6 in the activity of G1 cyclins in yeast
    statement: >-
      SWI4 and SWI6 are required for G1 cyclin (CLN1/CLN2) transcription and
      hence for Start.
  - source_id: PMID:9694791
    title: The regulation of E2F by pRB-family proteins
    statement: >-
      pRB-family pocket proteins bind and repress E2F transcription factors; CDK
      phosphorylation of pRB releases E2F to activate G1/S genes.
  - source_id: PMID:7954792
    title: The B-type cyclin kinase inhibitor p40SIC1 controls the G1 to S transition in S. cerevisiae
    statement: >-
      Sic1 is a stoichiometric inhibitor of Clb-Cdc28 kinases whose destruction is
      required for S-phase entry in budding yeast.
  - source_id: PMID:8121488
    title: Regulation of progression through the G1 phase of the cell cycle by the rum1+ gene
    statement: >-
      rum1 encodes the fission-yeast G1 CDK inhibitor whose loss abolishes the G1
      pre-Start interval and whose overexpression blocks Start.
  - source_id: PMID:8521500
    title: p25rum1 orders S phase and mitosis by acting as an inhibitor of the p34cdc2 mitotic kinase
    statement: Rum1 acts as a direct inhibitor of Cdc2 kinase activity.
  - source_id: PMID:10385618
    title: "CDK inhibitors: positive and negative regulators of G1-phase progression"
    statement: >-
      Review of the Cip/Kip (p21, p27, p57) and INK4 CDK inhibitor families that
      gate G1 progression in mammalian cells.
  - source_id: PMID:9346239
    title: A complex of Cdc4p, Skp1p, and Cdc53p/cullin catalyzes ubiquitination of the phosphorylated CDK inhibitor Sic1p
    statement: >-
      The SCF(Cdc4) complex (Cdc4-Skp1-Cdc53/cullin) ubiquitinates phosphorylated
      Sic1, the founding SCF substrate.
  - source_id: PMID:10559916
    title: SKP2 is required for ubiquitin-mediated degradation of the CDK inhibitor p27
    statement: >-
      SKP2 is the F-box substrate adaptor for phosphorylated p27 in mammalian
      cells.
  - source_id: PMID:9203581
    title: Fission yeast WD-repeat protein pop1 regulates genome ploidy through ubiquitin-proteasome-mediated degradation of the CDK inhibitor Rum1 and the S-phase initiator Cdc18
    statement: >-
      Pop1 is a Cdc4-like WD-repeat F-box adaptor required for
      ubiquitin-proteasome degradation of Rum1 in fission yeast.
  - source_id: PMID:8657126
    title: Cig2, a B-type cyclin, promotes the onset of S in Schizosaccharomyces pombe
    statement: Cig2-Cdc2 is the principal fission-yeast S-phase-promoting cyclin-CDK.
  - source_id: PMID:8631306
    title: A single fission yeast mitotic cyclin B p34cdc2 kinase promotes both S-phase and mitosis in the absence of G1 cyclins
    statement: >-
      In fission yeast a single Cdc13-Cdc2 complex can drive both S phase and
      mitosis, showing that G1 cyclin specificity is dispensable and that CDK
      activity level orders the cycle.
  - source_id: PMID:1734281
    title: Control of DNA synthesis genes in fission yeast by the cell-cycle gene cdc10+
    statement: >-
      cdc10 is the core subunit of the fission-yeast MBF transcription factor that
      activates DNA-synthesis genes at Start.
  - source_id: PMID:21179163
    title: Driving the cell cycle with a minimal CDK control network
    statement: >-
      A single cyclin-CDK fusion suffices to order S phase and mitosis in fission
      yeast, supporting the quantitative CDK-activity model of cell cycle
      progression.
  - source_id: PMID:4587263
    title: Genetic control of the cell division cycle in yeast
    statement: >-
      Defines Start as the point in G1 at which budding-yeast cells commit to a
      new division cycle.
  - source_id: PMID:3062366
    title: DAF1, a mutant gene affecting size control, pheromone arrest, and cell cycle kinetics of Saccharomyces cerevisiae
    statement: >-
      DAF1/WHI1 (CLN3) mutants alter cell size at Start, identifying Cln3 as the
      upstream size-coupled G1 cyclin.
notes: >-
  Boundary decisions. The module starts with growth-coupled accumulation of the
  G1 cyclin-CDK and ends with active S-phase cyclin-CDK after CKI destruction;
  origin licensing (MCM loading) and replication initiation (CDC7/DBF4,
  Cdc45/GINS) are separate modules. The DNA-damage G1 checkpoint (p53/p21,
  Rad53/Mec1) and mitogen signalling into cyclin D are regulatory context, not
  parts. Only the corepressor-release step is split by taxon: fission yeast has
  no Rb/Whi5-type corepressor, so its MBF (Cdc10-Res1-Res2-Rep2) is modeled as
  a third variant whose CDK-dependent trigger is a knowledge gap (Nrm1-mediated
  negative feedback and Cdc2-Cig2 regulation are documented but not modeled here
  as parts). The G1/S cyclin annoton deliberately spans two PANTHER families
  (PTHR10177 cyclins and PTHR21615 Cln1/Cln2) because the budding-yeast Start
  cyclins Cln1/2 are not classified with cyclin E, Clb5/6 or Cig2. The CKI
  annoton carries no PANTHER family term: p27/Kip1 belongs to PTHR10265 whereas
  Sic1 and Rum1 are unclassified and structurally unrelated to Cip/Kip proteins,
  so the family descriptor grounds only through representative members and an
  ANY_WITH_FUNCTION-like description. The F-box adaptor unit of SCF is likewise
  split across families (Skp2, Cdc4, Pop1, Pop2) and declared with
  family_terms using the local PANTHER 19.0 classification, which disagrees
  with the UniProt PANTHER cross-references for these four proteins. Deep research: no module deep-research report accompanies this
  file (no provider credentials were available in the authoring session; writing
  one by hand under a provider name is prohibited). Open questions: whether the
  fission-yeast Start trigger is best modeled as Cdc2-Cig2 phosphorylation of MBF
  components or of Rum1; and the extent to which metazoan cyclin E-CDK2 versus
  cyclin D-CDK4/6 is rate-limiting for Rb inactivation in vivo.
module:
  id: g1_s_transition
  label: G1/S transition (Start / restriction point)
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Growth-coupled G1 cyclin-CDK activity releases the G1/S transcription
    program from its corepressor; the resulting G1/S cyclin-CDK destroys the
    CDK inhibitor through SCF-dependent proteolysis, committing the cell to S
    phase.
