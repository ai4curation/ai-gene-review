        label: Growth-coupled G1 cyclin-CDK activation
        module_type: REGULATORY_STEP
        description: >-
          The G1 cyclin accumulates with cell growth and mitogenic input (cyclin
          D in metazoa, Cln3 in budding yeast, Puc1 and the Cig cyclins in fission
          yeast) and activates its CDK partner, whose first substrate is the
          transcriptional corepressor of the G1/S program.
