notes: >-
  Boundary. The module covers the three FlyBase L-arginine metabolism enzymes. Arginine use
  by nitric oxide synthase (which yields citrulline) and by arginine kinase, and ornithine
  use for proline and polyamine synthesis, are connected pathways and not parts. The enzyme
  functions are assigned by orthology to the well-characterized urea-cycle enzymes. FlyBase
  groups realized by this module: ARGMET (FBgg0002186). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_arginine_metabolism.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
