id: MODULE:dmel_arginine_metabolism
title: L-arginine metabolism in Drosophila melanogaster
description: >-
  Three conserved urea-cycle enzymes interconvert citrulline, arginine and ornithine in Drosophila.
  Argininosuccinate synthase (Ass) condenses citrulline with aspartate to form argininosuccinate,
  argininosuccinate lyase (Argl) cleaves it to arginine and fumarate, and arginase (Arg) hydrolyses
  arginine to ornithine and urea. Together the first two steps regenerate arginine from citrulline,
  and arginase links arginine to ornithine, the precursor of proline and polyamines. Insects
  are not known to run a complete urea cycle, so the three enzymes act as a branch of amino
  acid metabolism rather than as the main route of nitrogen excretion.
status: DRAFT
scope: CONCRETE
