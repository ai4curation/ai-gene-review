    factor complex (NXF); this module models that group.
- source_id: GO:0006406
  title: mRNA export from nucleus
  statement: >-
    GO term grounding the module as mRNA export from nucleus.
notes: >-
  Boundary. FlyBase's THO-C group is entirely contained in TREX and is represented through
  the TREX part. Nuclear pore complex proteins, the exon junction complex and SAGA are outside
  the module. GO has no cellular-component term for the Nxf1-Nxt1 heterodimer, so that part
  has no complex term. FlyBase groups realized by this module: THO-C (FBgg0000601), TREX (FBgg0000603),
  TREX-2 (FBgg0000605), NXF (FBgg0001972). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_mrna_nuclear_export.yaml; none of the member genes has a gene review yet
  unless noted.
