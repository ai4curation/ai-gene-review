id: MODULE:dmel_mrna_nuclear_export
title: mRNA nuclear export machinery in Drosophila melanogaster
description: >-
  Bulk export of mRNA from the nucleus is coupled to transcription and processing. The TREX
  complex, consisting of the THO subcomplex with the DEAD-box helicase Hel25E (UAP56) and
  the adaptor Ref1 (ALY), is loaded onto nascent mRNA and hands it to the export receptor
  heterodimer formed by sbr (NXF1) and Nxt1, which carries the mRNP through the nuclear pore
  complex by interacting with FG-repeat nucleoporins. TREX-2 (xmas, PCID2 and e(y)2) associates
  with the nuclear pore and couples transcription with export; in Drosophila it links actively
  transcribed genes to the nuclear periphery and shares e(y)2 with the SAGA deubiquitinase
  module.
status: DRAFT
scope: CONCRETE
