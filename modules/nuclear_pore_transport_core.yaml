id: MODULE:nuclear_pore_transport_core
title: Nuclear pore complex and Ran-dependent karyopherin transport
description: 'Proteins and RNAs cross the nuclear envelope through nuclear pore complexes, built from
  nucleoporins that form a scaffold of stacked rings and a central channel lined with FG repeats. Karyopherins
  of the importin-beta superfamily carry cargo through the channel, and the small GTPase Ran sets the
  direction: Ran-GTP, made in the nucleus by RCC1, releases import cargo and loads export cargo, while
  Ran-GDP is returned to the nucleus by NTF2. This module is the eukaryote-wide part of that system that
  can be grounded locally, written so that it can be evaluated in any genome.'
status: DRAFT
scope: CONCRETE
notes: 'Eukaryote-wide scope: PAINT places the NTF2, Nup88, Cse1 (exportin-2) and Crm1-specific exportin-1
  nodes at Eukaryota (taxon:2759); the Seh1/Sec13 outer-ring node and the exportin-1/5 receptor node carry
  no taxon in the source rows, and their seeds are listed on each node. The Ran and Nup98 families have
  no PAINT table locally and their selectors rest on family membership. Each cited node is shown to be
  an ancestor of the human protein by its IBA rows or its IBD seeds (for Cse1, which has no gene folder,
  by its IBA rows in QuickGO). Read as a satisfiability rule, every part is expected in any eukaryote.
  Molecular functions come from the human NUP98 review and from the F IBD of the exportin nodes (nuclear
  export signal receptor activity for both; the Cse1 node records the loss of the import-receptor activity
  it would otherwise inherit); Ran, NTF2, Nup88, Seh1 and Sec13 are untyped. This is a partial rule. Many
  required parts of the system have no local PANTHER entry for the human protein and are not modelled:
  importin beta (KPNB1) and importin alpha, RCC1, RanGAP and RanBP1, and most scaffold and FG nucleoporins
  (NUP93, NUP205, NUP155, NUP160, NUP107, NUP85, NUP62 and others). A genome that passes this rule has
  therefore not been shown to have a complete pore. Selector caveats are on each family: Seh1 and Sec13
  also work outside the pore, the NTF2 family takes in NXT1/NXT2, and no Dictyostelium member is listed
  for Nup88 or Seh1 and no Arabidopsis member for Sec13. The modules dmel_nuclear_pore_complex (Drosophila)
  and mrna_nuclear_export (human) describe the pore and mRNA export in one species.'
module:
  id: nuclear_pore_transport_core
  label: Nuclear pore complex and Ran-dependent karyopherin transport
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: nucleocytoplasmic transport
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
  parts:
  - order: 1
    role: transport channel
    node:
      id: nuclear_pore_scaffold
      label: Nuclear pore complex scaffold (partial)
      module_type: PROTEIN_COMPLEX
      concepts:
      - preferred_term: nuclear pore
        term:
          id: GO:0005643
          label: nuclear pore
      annotons:
      - id: nup98_96
        label: Nup98-Nup96 nucleoporin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Nup98-Nup96 subfamily
            term:
              id: PANTHER:PTHR23198:SF6
              label: NUCLEAR PORE COMPLEX PROTEIN NUP98-NUP96
            representative_members:
            - preferred_term: NUP98 (human)
              term:
                id: UniProtKB:P52948
                label: Nuclear pore complex protein Nup98-Nup96
            description: SF6 lists budding yeast Nup145, fission yeast nup189, Arabidopsis NUP98B, Dictyostelium
              and human Nup98. The yeast FG paralogs Nup100 and Nup116 sit in SF30, and Arabidopsis NUP98A
              and NUP96 in SF25 and SF26; they are not needed for the selector.
        function:
          preferred_term: structural constituent of nuclear pore
          term:
            id: GO:0017056
            label: structural constituent of nuclear pore
        locations:
        - preferred_term: nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
        role_description: Autoproteolytic precursor of the FG-repeat nucleoporin Nup98, which lines the
          pore's permeability barrier, and the Y-complex scaffold subunit Nup96.
        evidence:
        - source_id: file:genes/human/NUP98/NUP98-ai-review.yaml
          statement: 'Reviewed core function of human NUP98: structural constituent of nuclear pore.'
        - source_id: file:interpro/panther/PTHR23198/PTHR23198-entries.csv
          statement: PANTHER family membership table; no PAINT node with descent evidence for the human
            protein is available, so the selector rests on membership alone.
      - id: nup88_82
        label: Nup88/Nup82 nucleoporin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Nup88/Nup82 subfamily
            term:
              id: PANTHER:PTHR13257:SF0
              label: NUCLEAR PORE COMPLEX PROTEIN NUP88
            representative_members:
            - preferred_term: NUP88 (human)
              term:
                id: UniProtKB:Q99567
                label: Nuclear pore complex protein Nup88
            ancestral_nodes:
            - preferred_term: PAINT node PTN000327285
              term:
                id: PANTHER:PTN000327285
                label: PTN000327285
              description: 'PANTHER PAINT ancestral node PTN000327285 in family PTHR13257, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana, Drosophila melanogaster, Homo sapiens,
                Rattus norvegicus, Saccharomyces cerevisiae and Schizosaccharomyces pombe. IBD GO terms
                at this node: C:GO:0005643, P:GO:0000055, P:GO:0000056, P:GO:0006406, P:GO:0006606, P:GO:0006611.
                PAINT rows dated 20170228-20260120. Human NUP88 descends from it (its IBA rows in QuickGO
                cite PTN000327285; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000327285 in PANTHER family PTHR13257.
            description: SF0 lists budding and fission yeast Nup82, Arabidopsis MOS7/NUP88 and human NUP88
              but no Dictyostelium member, so genomes from that lineage may fail this step for want of
              a selector.
        locations:
        - preferred_term: nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
        role_description: Beta-propeller nucleoporin of the cytoplasmic filaments that anchors the Nup214/Nup159
          complex.
        evidence:
        - source_id: file:interpro/panther/PTHR13257/PTHR13257-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: seh1
        label: Seh1 nucleoporin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Seh1 subfamily
            term:
              id: PANTHER:PTHR11024:SF3
              label: NUCLEOPORIN SEH1
            representative_members:
            - preferred_term: SEH1L (human)
              term:
                id: UniProtKB:Q96EE3
                label: Nucleoporin SEH1
            ancestral_nodes:
            - preferred_term: PAINT node PTN000111811
              term:
                id: PANTHER:PTN000111811
                label: PTN000111811
              description: 'PANTHER PAINT ancestral node PTN000111811 in family PTHR11024, given no taxon
                in the source PAINT rows; IBD seeds from Homo sapiens, Saccharomyces cerevisiae, Schizosaccharomyces
                pombe and 1 seed whose species is not resolved locally (UniProtKB:Q388I4). IBD GO terms
                at this node: C:GO:0031080. PAINT rows dated 20250902. Human SEH1L descends from it (its
                IBA rows in QuickGO cite PTN000111811; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000111811 in PANTHER family PTHR11024.
            description: Seh1 is also a subunit of the SEA/GATOR2 complex on the vacuole and lysosome,
              so the selector does not show nuclear-pore use on its own. SF3 lists yeast, Arabidopsis
              and human members but no Dictyostelium member.
        locations:
        - preferred_term: nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
        role_description: Beta-propeller subunit of the Y-complex (outer ring) scaffold.
        evidence:
        - source_id: file:interpro/panther/PTHR11024/PTHR11024-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: sec13
        label: Sec13 nucleoporin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Sec13 subfamily
            term:
              id: PANTHER:PTHR11024:SF2
              label: PROTEIN SEC13 HOMOLOG
            representative_members:
            - preferred_term: SEC13 (human)
              term:
                id: UniProtKB:P55735
                label: Protein SEC13 homolog
            ancestral_nodes:
            - preferred_term: PAINT node PTN000111811
              term:
                id: PANTHER:PTN000111811
                label: PTN000111811
              description: 'PANTHER PAINT ancestral node PTN000111811 in family PTHR11024, given no taxon
                in the source PAINT rows; IBD seeds from Homo sapiens, Saccharomyces cerevisiae, Schizosaccharomyces
                pombe and 1 seed whose species is not resolved locally (UniProtKB:Q388I4). IBD GO terms
                at this node: C:GO:0031080. PAINT rows dated 20250902. Human SEC13 descends from it (its
                IBA rows in QuickGO cite PTN000111811; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000111811 in PANTHER family PTHR11024.
            description: Sec13 also works in the COPII coat and the SEA/GATOR2 complex, so the selector
              does not show nuclear-pore use on its own. SF2 lists yeast, Dictyostelium and human members
              but no Arabidopsis member, although plants have Sec13; where the plant proteins are placed
              has not been checked.
        locations:
        - preferred_term: nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
        role_description: Beta-propeller subunit of the Y-complex scaffold; it is also the inner subunit
          of the COPII outer coat.
        evidence:
        - source_id: file:interpro/panther/PTHR11024/PTHR11024-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 2
    role: directionality
    node:
      id: ran_gradient
      label: Ran GTPase and its import factor NTF2
      module_type: MODULE
      annotons:
      - id: ran_gtpase
        label: Ran GTPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Ran family
            term:
              id: PANTHER:PTHR24071
              label: RAN GTPASE
            representative_members:
            - preferred_term: RAN (human)
              term:
                id: UniProtKB:P62826
                label: GTP-binding nuclear protein Ran
            description: The family has no PAINT table locally and no human review, so the step is untyped.
              The family is used rather than human RAN's subfamily SF0 because SF0 lists no Arabidopsis
              member, although the family does.
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Small GTPase whose GTP-bound form, kept nuclear by chromatin-bound RCC1, sets
          the direction of karyopherin transport.
        evidence:
        - source_id: file:interpro/panther/PTHR24071/PTHR24071-entries.csv
          statement: PANTHER family membership table; no PAINT node with descent evidence for the human
            protein is available, so the selector rests on membership alone.
      - id: ntf2_ran_import
        label: NTF2 Ran import factor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: NTF2 family
            term:
              id: PANTHER:PTHR12612
              label: NUCLEAR TRANSPORT FACTOR 2
            representative_members:
            - preferred_term: NUTF2 (human)
              term:
                id: UniProtKB:P61970
                label: Nuclear transport factor 2
            ancestral_nodes:
            - preferred_term: PAINT node PTN000289031
              term:
                id: PANTHER:PTN000289031
                label: PTN000289031
              description: 'PANTHER PAINT ancestral node PTN000289031 in family PTHR12612, placed at taxon:2759
                (Eukaryota); IBD seeds from Arabidopsis thaliana, Drosophila melanogaster, Homo sapiens,
                Mus musculus, Rattus norvegicus, Saccharomyces cerevisiae, Schizosaccharomyces pombe and
                1 seed whose species is not resolved locally (UniProtKB:Q582J1). IBD GO terms at this
                node: C:GO:0044613, P:GO:0006913. PAINT rows dated 20170412-20251219. Human NUTF2 descends
                from it (its IBA rows in QuickGO cite PTN000289031; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000289031 in PANTHER family PTHR12612.
            description: The family also holds the NXT1/NXT2 (yeast Mtr2-like) mRNA-export cofactors,
              so the selector over-matches. It has no subfamily split in the local entries table. A deeper
              node, PTN000289033 at Opisthokonta, carries F:GO:0061608, but that is not used to type this
              eukaryote-wide step.
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Small dimeric carrier that returns Ran-GDP from the cytoplasm to the nucleus
          through the pore.
        evidence:
        - source_id: file:interpro/panther/PTHR12612/PTHR12612-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 3
    role: export
    node:
      id: ran_gtp_exportins
      label: Ran-GTP-dependent exportins
      module_type: MODULE
      annotons:
      - id: crm1_exportin
        label: Crm1/exportin-1
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Exportin-1 subfamily
            term:
              id: PANTHER:PTHR11223:SF2
              label: EXPORTIN-1
            representative_members:
            - preferred_term: XPO1 (human)
              term:
                id: UniProtKB:O14980
                label: Exportin-1
            ancestral_nodes:
            - preferred_term: PAINT node PTN000131749
              term:
                id: PANTHER:PTN000131749
                label: PTN000131749
              description: 'PANTHER PAINT ancestral node PTN000131749 in family PTHR11223, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Candida albicans, Drosophila
                melanogaster, Homo sapiens, Mus musculus, Saccharomyces cerevisiae, Schizosaccharomyces
                pombe and 3 seeds whose species is not resolved locally (UniProtKB:C8VRM0, UniProtKB:Q382A3,
                UniProtKB:Q38AK6). IBD GO terms at this node: C:GO:0005634, C:GO:0005737, F:GO:0005049.
                PAINT rows dated 20210529-20260528. Human XPO1 descends from it (its IBA rows in QuickGO
                cite PTN000131749; it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000131749 in PANTHER family PTHR11223.
            - preferred_term: PAINT node PTN000131787
              term:
                id: PANTHER:PTN000131787
                label: PTN000131787
              description: 'PANTHER PAINT ancestral node PTN000131787 in family PTHR11223, placed at taxon:2759
                (Eukaryota); IBD seeds from Drosophila melanogaster, Homo sapiens and Saccharomyces cerevisiae.
                IBD GO terms at this node: P:GO:0000055, P:GO:0000056. PAINT rows dated 20170228. Human
                XPO1 descends from it (its IBA rows in QuickGO cite PTN000131787; it is one of the node''s
                IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000131787 in PANTHER family PTHR11223.
            description: SF2 lists yeast Crm1, Arabidopsis XPO1, Dictyostelium and human members and excludes
              exportin-5/Msn5 in the same family.
        function:
          preferred_term: nuclear export signal receptor activity
          term:
            id: GO:0005049
            label: nuclear export signal receptor activity
          description: The F IBD at PTN000131749, a node above the split between exportin-1 and exportin-5
            (human XPO5, Q9HAV4, is one of its seeds). Both are nuclear export receptors, so the term
            holds for Crm1; the Crm1-specific node PTN000131787, at Eukaryota, carries only process terms.
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Exportin that binds leucine-rich nuclear export signals together with Ran-GTP
          and carries proteins and some RNAs out of the nucleus.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0005049 at PTN000131749 in PTHR11223; no gene review for the human
            protein here.
        - source_id: file:interpro/panther/PTHR11223/PTHR11223-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: cse1_exportin
        label: Cse1/exportin-2
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Exportin-2 subfamily
            term:
              id: PANTHER:PTHR10997:SF8
              label: EXPORTIN-2
            representative_members:
            - preferred_term: CSE1L (human)
              term:
                id: UniProtKB:P55060
                label: Exportin-2
            ancestral_nodes:
            - preferred_term: PAINT node PTN000108304
              term:
                id: PANTHER:PTN000108304
                label: PTN000108304
              description: 'PANTHER PAINT ancestral node PTN000108304 in family PTHR10997, placed at taxon:2759
                (Eukaryota); IBD seeds from Drosophila melanogaster and Saccharomyces cerevisiae. IBD
                GO terms at this node: F:GO:0005049, P:GO:0006611. IRD rows at this node record as lost:
                F:GO:0061608 (relative to PTN000108134), P:GO:0006606 (relative to PTN000108134). PAINT
                rows dated 20170228-20250731. Human CSE1L descends from it (its IBA rows in QuickGO cite
                PTN000108304).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000108304 in PANTHER family PTHR10997.
            description: SF8 lists yeast Cse1, Arabidopsis, Dictyostelium and human members and excludes
              the importin-7/8/11 group in the same family.
        function:
          preferred_term: nuclear export signal receptor activity
          term:
            id: GO:0005049
            label: nuclear export signal receptor activity
          description: The F IBD at the Cse1 node PTN000108304 (Eukaryota). That node also records, by
            IRD, the loss of the import-receptor activity and protein import inherited from the importin
            node PTN000108134 above it, so the import term is not used.
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Exportin that returns importin alpha to the cytoplasm in complex with Ran-GTP,
          recycling the classical import receptor.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0005049 at PTN000108304 in PTHR10997; no gene review for the human
            protein here.
        - source_id: file:interpro/panther/PTHR10997/PTHR10997-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  connections:
  - source: ran_gradient
    target: ran_gtp_exportins
    connection_type: PROVIDES_INPUT_FOR
    description: Nuclear Ran-GTP loads the exportins with their cargo.
  - source: nuclear_pore_scaffold
    target: ran_gtp_exportins
    connection_type: PROVIDES_INPUT_FOR
    description: Loaded exportins cross the envelope through the pore channel.
