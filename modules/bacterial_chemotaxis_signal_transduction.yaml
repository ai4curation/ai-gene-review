  connections:
  - source: receptor_adaptation
    target: mcp_receptor_input
    connection_type: PROVIDES_INPUT_FOR
    description: Receptor methylation state tunes stimulus-dependent signaling.
  - source: mcp_receptor_input
    target: chea_phosphotransfer
    connection_type: PROVIDES_INPUT_FOR
    description: Ligand-dependent receptor state modulates CheA with stimulus-dependent sign.
  - source: chea_phosphotransfer
    target: chey_response_output
    connection_type: PROVIDES_INPUT_FOR
  - source: chea_phosphotransfer
    target: receptor_adaptation
    connection_type: POSITIVELY_REGULATES
    description: CheA-dependent phosphorylation activates the CheB receiver domain, increasing receptor
      methylesterase activity and closing the adaptation feedback loop.
  - source: chez_signal_reset
    target: chey_response_output
    connection_type: NEGATIVELY_REGULATES
    description: CheZ lowers the lifetime and abundance of phosphorylated CheY.
  - source: chey_response_output
    target: c_ring_motor_switch
    connection_type: CAUSES
    description: CheY-P binding at FliM changes C-ring conformation and rotational bias.
  - source: c_ring_motor_switch
    target: flagellar_motor_rotation_output
    connection_type: CAUSES
    description: C-ring conformation sets rotational direction and switching bias.
  - source: flagellar_stator_conductance
    target: flagellar_motor_rotation_output
    connection_type: CAUSES
    description: Ion conductance through occupied stators supplies torque for rotation.
  knowledge_gaps:
  - gap_statement: KT2440 encodes multiple chemoreceptors and chemotaxis systems; exact ligand assignments
      and component cross-talk are incompletely resolved.
    boundary: McpS, PcaY and Tar ground receptor architecture only. Their ligand specificity is not transferred
      to other receptors.
    gap_kind:
    - BIOLOGY
  - gap_statement: PP_4332 and the adjacent CheW-domain protein PP_4333 may have distinct or partially
      redundant receptor-array coupling roles.
    boundary: Q88EX0 grounds the canonical CheW role; no unique function is asserted for Q88EW9 without
      direct comparative evidence.
    gap_kind:
    - BIOLOGY
  - gap_statement: The environmental and regulatory determinants that recruit KT2440 MotAB versus MotCD
      to individual motors remain incompletely resolved.
    boundary: Both experimentally supported stator complexes are represented, without asserting that they
      are simultaneously occupied or interchangeable.
    gap_kind:
    - BIOLOGY
  - gap_statement: No KT2440 mutant or biochemical data yet test CheY or CheZ directly, and the C-ring
      proteins FliM and FliN of KT2440 are grounded by family evidence rather than KT2440 experiments.
    boundary: KT2440 CheY, CheZ, FliM and FliN are included by orthology to the E. coli and P. aeruginosa
      proteins; their KT2440-specific kinetics and mutant phenotypes are not asserted.
    gap_kind:
    - BIOLOGY
