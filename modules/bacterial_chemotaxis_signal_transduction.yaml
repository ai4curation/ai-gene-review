id: MODULE:bacterial_chemotaxis_signal_transduction
title: Bacterial chemotaxis signal transduction to flagellar motor output
description: >-
  Reusable bacterial chemotaxis signaling module linking chemoreceptor input to
  CheA autophosphorylation, CheY response-regulator phosphorylation, flagellar
  switch control, and MotAB-powered motor output. Receptor repertoires and
  attractant specificity vary by species; exact Pseudomonas putida exemplars
  ground one realization without making the module species-specific.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006935
    title: chemotaxis
    statement: Grounds directional motility in response to chemical stimuli.
  - source_id: KEGG:ppu02030
    title: Pseudomonas putida KT2440 bacterial chemotaxis
    statement: Identifies the PSEPK receptor, CheA/CheY, switch, and stator realization.
notes: >-
  The module captures signal flow rather than the entire receptor repertoire.
  McpS and PcaY are exact receptor exemplars, not a claim that all PSEPK MCPs
  sense the same ligands. CheZ-mediated dephosphorylation is included as signal
  reset. Flagellar construction is outside this module and is modeled separately.
module:
  id: bacterial_chemotaxis_signal_transduction
  label: Chemoreceptor-to-flagellar-motor signaling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: chemotaxis
      term:
        id: GO:0006935
        label: chemotaxis
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: chemical stimulus detection
      node:
        id: mcp_receptor_input
        label: Methyl-accepting chemotaxis receptor input
        module_type: REGULATORY_STEP
        annotons:
          - id: mcp_receptor_activity
            label: Chemotaxis receptor activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: methyl-accepting chemotaxis receptor family
                term:
                  id: PANTHER:PTHR32089
                  label: METHYL-ACCEPTING CHEMOTAXIS PROTEIN MCPB
                representative_members:
                  - preferred_term: PSEPK McpS exemplar
                    term:
                      id: UniProtKB:Q88E10
                      label: Methyl-accepting chemotaxis protein McpS
                  - preferred_term: PSEPK PcaY exemplar
                    term:
                      id: UniProtKB:Q88JK6
                      label: Methyl-accepting chemotaxis protein PcaY
            function:
              preferred_term: transmembrane signaling receptor activity
              term:
                id: GO:0004888
                label: transmembrane signaling receptor activity
            role_description: Detects extracellular chemoeffectors and controls CheA signaling.
    - order: 2
      role: histidine-kinase phosphotransfer
      node:
        id: chea_phosphotransfer
        label: CheA autophosphorylation and phosphotransfer
        module_type: REACTION
        annotons:
          - id: chea_activity
            label: CheA histidine kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis CheA family
                term:
                  id: PANTHER:PTHR43395
                  label: SENSOR HISTIDINE KINASE CHEA
                representative_members:
                  - preferred_term: PSEPK CheA exemplar
                    term:
                      id: UniProtKB:Q88EW4
                      label: Chemotaxis protein CheA
            function:
              preferred_term: protein histidine kinase activity
              term:
                id: GO:0004673
                label: protein histidine kinase activity
            role_description: Transfers receptor-state information into the phosphorelay.
    - order: 3
      role: response-regulator control and reset
      node:
        id: chey_response_control
        label: CheY phosphorylation state controls motor bias
        module_type: REGULATORY_STEP
        annotons:
          - id: chey_activity
            label: CheY response regulator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: two-component response regulator family
                term:
                  id: PANTHER:PTHR43228
                  label: TWO-COMPONENT RESPONSE REGULATOR
                representative_members:
                  - preferred_term: PSEPK CheY exemplar
                    term:
                      id: UniProtKB:Q88EW2
                      label: Chemotaxis response regulator CheY
            function:
              preferred_term: phosphorelay response regulator activity
              term:
                id: GO:0000156
                label: phosphorelay response regulator activity
            role_description: Phosphorylated CheY engages the flagellar switch to alter rotation bias.
          - id: chez_reset_activity
            label: CheZ phosphatase reset
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CheZ phosphatase family
                term:
                  id: PANTHER:PTHR43693
                  label: PROTEIN PHOSPHATASE CHEZ
                representative_members:
                  - preferred_term: PSEPK CheZ exemplar
                    term:
                      id: UniProtKB:Q88EW3
                      label: Chemotaxis protein CheZ
            function:
              preferred_term: phosphoprotein phosphatase activity
              term:
                id: GO:0004721
                label: phosphoprotein phosphatase activity
            role_description: Dephosphorylates CheY-P to terminate and reset the response.
    - order: 4
      role: motor-switch response
      node:
        id: flig_motor_switch
        label: FliG flagellar switch output
        module_type: REGULATORY_STEP
        annotons:
          - id: flig_switch_component
            label: FliG motor switch component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: flagellar motor switch FliG family
                term:
                  id: PANTHER:PTHR30534
                  label: FLAGELLAR MOTOR SWITCH PROTEIN FLIG
                representative_members:
                  - preferred_term: PSEPK FliG exemplar
                    term:
                      id: UniProtKB:Q88ET5
                      label: Flagellar motor switch protein FliG
            role_description: Converts CheY-P binding into a change in motor rotation bias.
    - order: 5
      role: proton-driven motor output
      node:
        id: motab_torque_generation
        label: MotAB stator-driven flagellar rotation
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: mota_stator_subunit
            label: MotA stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MotA family
                term:
                  id: PANTHER:PTHR30433
                  label: CHEMOTAXIS PROTEIN MOTA
                representative_members:
                  - preferred_term: PSEPK MotA exemplar
                    term:
                      id: UniProtKB:Q88DC2
                      label: Flagellar motor protein MotA
            role_description: Membrane stator subunit contributing to proton-driven torque generation.
          - id: motb_stator_subunit
            label: MotB stator subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MotB family
                term:
                  id: PANTHER:PTHR30329
                  label: STATOR ELEMENT OF FLAGELLAR MOTOR COMPLEX
                representative_members:
                  - preferred_term: PSEPK MotB exemplar
                    term:
                      id: UniProtKB:Q88DC3
                      label: Flagellar motor protein MotB
            role_description: Peptidoglycan-anchored stator subunit contributing to proton-driven torque generation.
  connections:
    - source: mcp_receptor_input
      target: chea_phosphotransfer
      connection_type: POSITIVELY_REGULATES
    - source: chea_phosphotransfer
      target: chey_response_control
      connection_type: PROVIDES_INPUT_FOR
    - source: chey_response_control
      target: flig_motor_switch
      connection_type: CAUSES
    - source: flig_motor_switch
      target: motab_torque_generation
      connection_type: CAUSES
