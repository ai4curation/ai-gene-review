- id: PMID:33684668
  title: Diversity of bacterial chemosensory systems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached review read. Separates flagellar, type-IV-pilus and alternative cellular-function
      outputs, and compares phosphatase and phosphotransfer reset mechanisms. Review summaries guide exemplar
      selection; target gene claims require primary evidence.
  findings:
  - statement: CheZ is one signal-reset implementation, not a universal required bacterial component.
    supporting_text: The E. coli chemosensory system utilizes the CheZ phosphatase, however, homologous
