id: MODULE:bacterial_chemotaxis_signal_transduction
title: Pseudomonas chemotaxis signal transduction to flagellar motor output
description: >-
  Reusable Pseudomonas module linking methyl-accepting chemoreceptor
  input and adaptation through CheW-coupled CheA/CheY phosphotransfer, CheZ signal reset, C-ring
  switching, and proton-conducting flagellar stators. Pseudomonas putida proteins
  ground one realization without making receptor ligand specificity universal.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006935
    title: chemotaxis
    statement: Grounds directional movement in response to chemical stimuli.
  - source_id: KEGG:ppu02030
    title: Pseudomonas putida KT2440 bacterial chemotaxis
    statement: Identifies the PSEPK receptor, adaptation, phosphorelay, switch, and motor realization.
  - source_id: file:PSEPK/mcpS/mcpS-ai-review.yaml
    statement: Grounds a characterized KT2440 chemoreceptor input.
  - source_id: PMID:23677992
    title: "High specificity in CheR methyltransferase function: CheR2 of Pseudomonas putida is essential for chemotaxis, whereas CheR1 is involved in biofilm formation."
    statement: Directly grounds methylation of McpS by the CheR2 adaptation enzyme.
  - source_id: file:PSEPK/cheA/cheA-ai-review.yaml
    statement: Grounds the CheA histidine-kinase relay and its intrinsic CheW-like coupling domain.
  - source_id: file:PSEPK/cheZ/cheZ-ai-review.yaml
    statement: Grounds CheZ-dependent CheY-P dephosphorylation and signal reset.
  - source_id: PMID:36409076
    title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida
    statement: >-
      Direct KT2440 deletion and complementation experiments establish distinct
      contributions from the MotAB and MotCD stators.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_chemotaxis_signal_transduction__ppu02030-deep-research-openscientist.md
    statement: >-
      Reviews pathway satisfiability, receptor diversity, adaptation proteins,
      the C-ring output, and the dual-stator realization in KT2440.
notes: >-
  The module captures canonical signal flow rather than the complete PSEPK
  receptor repertoire. McpS and PcaY are receptor exemplars, not a claim of
  shared ligand specificity. KT2440 CheA carries a CheW-like coupling domain,
  but free CheW proteins still couple the receptor array to CheA. CheR2 and
  CheB1 represent receptor methylation and demethylation. Components from
  additional Pseudomonas chemotaxis systems are not assumed interchangeable.
  Flagellar construction is modeled separately.
module:
  id: bacterial_chemotaxis_signal_transduction
  label: Chemoreceptor-to-flagellar-motor signaling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: chemotaxis
      term:
        id: GO:0006935
        label: chemotaxis
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: chemical stimulus detection
      node:
        id: mcp_receptor_input
        label: Methyl-accepting chemotaxis receptor input
        module_type: REGULATORY_STEP
        description: >-
          Ligand-dependent receptor states modulate CheA; attractants generally
          decrease CheA activity, whereas repellents or ligand-free states can
          increase it.
        annotons:
          - id: mcp_receptor_activity
            label: Chemotaxis receptor activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: methyl-accepting chemotaxis receptor family
                term:
                  id: PANTHER:PTHR32089
                  label: METHYL-ACCEPTING CHEMOTAXIS PROTEIN MCPB
                representative_members:
                  - preferred_term: PSEPK McpS exemplar
                    term:
                      id: UniProtKB:Q88E10
                      label: Methyl-accepting chemotaxis protein McpS
                  - preferred_term: PSEPK PcaY exemplar
                    term:
                      id: UniProtKB:Q88JK6
                      label: Methyl-accepting chemotaxis protein PcaY
            function:
              preferred_term: transmembrane signaling receptor activity
              term:
                id: GO:0004888
                label: transmembrane signaling receptor activity
            role_description: Detects chemoeffectors and controls the associated CheA signaling state.
    - order: 2
      role: receptor methylation-dependent adaptation
      node:
        id: receptor_adaptation
        label: CheR and CheB receptor adaptation
        module_type: REGULATORY_STEP
        description: >-
          Opposing receptor methylation and demethylation tune signaling
          sensitivity and permit adaptation to sustained stimuli.
        annotons:
          - id: cher_receptor_methylation
            label: CheR receptor methyltransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis receptor methyltransferase CheR family
                term:
                  id: PANTHER:PTHR24422:SF21
                  label: CHEMOTAXIS PROTEIN METHYLTRANSFERASE 1
                representative_members:
                  - preferred_term: PSEPK CheR2 exemplar
                    term:
                      id: UniProtKB:Q88ER1
                      label: Chemotaxis protein methyltransferase Cher2
            function:
              preferred_term: protein-glutamate O-methyltransferase activity
              term:
                id: GO:0008983
                label: protein-glutamate O-methyltransferase activity
            role_description: Methylates receptor glutamate residues during sensory adaptation.
          - id: cheb_receptor_demethylation
            label: CheB receptor methylesterase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis receptor methylesterase CheB family
                term:
                  id: PANTHER:PTHR42872:SF3
                  label: PROTEIN-GLUTAMATE METHYLESTERASE_PROTEIN-GLUTAMINE GLUTAMINASE 1
                representative_members:
                  - preferred_term: PSEPK CheB1 exemplar
                    term:
                      id: UniProtKB:Q88EW5
                      label: Protein-glutamate methylesterase/protein-glutamine glutaminase of group 1 operon
            function:
              preferred_term: protein-glutamate methylesterase activity
              term:
                id: GO:0008984
                label: protein-glutamate methylesterase activity
            role_description: Demethylates adapted receptors and deamidates designated receptor glutamines.
    - order: 3
      role: histidine-kinase phosphotransfer
      node:
        id: chea_phosphotransfer
        label: CheW-coupled CheA autophosphorylation and phosphotransfer
        module_type: REACTION
        description: >-
          Free CheW adaptors and the CheW-like P5 domain of CheA organize
          receptor-state input to CheA kinase activity.
        annotons:
          - id: chea_activity
            label: CheA histidine kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis CheA family
                term:
                  id: PANTHER:PTHR43395
                  label: SENSOR HISTIDINE KINASE CHEA
                representative_members:
                  - preferred_term: PSEPK CheA exemplar
                    term:
                      id: UniProtKB:Q88EW4
                      label: Chemotaxis protein CheA
            function:
              preferred_term: protein histidine kinase activity
              term:
                id: GO:0004673
                label: protein histidine kinase activity
            role_description: Autophosphorylates and transfers phosphoryl groups to CheY and other response regulators.
          - id: chew_coupling_activity
            label: CheW receptor-array adaptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis coupling protein CheW family
                term:
                  id: PANTHER:PTHR22617:SF23
                  label: CHEMOTAXIS PROTEIN CHEW
                representative_members:
                  - preferred_term: PSEPK CheW exemplar PP_4332
                    term:
                      id: UniProtKB:Q88EX0
                      label: Chemotaxis protein CheW
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
            role_description: Couples receptor arrays to CheA without catalyzing phosphotransfer.
    - order: 4
      role: CheY response-regulator output
      node:
        id: chey_response_output
        label: CheY phosphorylation state
        module_type: REGULATORY_STEP
        annotons:
          - id: chey_activity
            label: CheY response regulator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chemotaxis response regulator CheY family
                representative_members:
                  - preferred_term: PSEPK CheY exemplar
                    term:
                      id: UniProtKB:Q88EW2
                      label: Response regulator for chemotactic signal transduction
            function:
              preferred_term: phosphorelay response regulator activity
              term:
                id: GO:0000156
                label: phosphorelay response regulator activity
            role_description: Phosphorylated CheY binds the C-ring, principally through FliM, to alter rotation bias.
    - order: 5
      role: CheY-P signal reset
      node:
        id: chez_signal_reset
        label: CheZ-dependent CheY-P dephosphorylation
        module_type: REGULATORY_STEP
        annotons:
          - id: chez_reset_activity
            label: CheZ phosphatase reset
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CheZ phosphatase family
                term:
                  id: PANTHER:PTHR43693
                  label: PROTEIN PHOSPHATASE CHEZ
                representative_members:
                  - preferred_term: PSEPK CheZ exemplar
                    term:
                      id: UniProtKB:Q88EW3
                      label: Protein phosphatase CheZ
            function:
              preferred_term: phosphoprotein phosphatase activity
              term:
                id: GO:0004721
                label: phosphoprotein phosphatase activity
            role_description: Accelerates CheY-P dephosphorylation to terminate and reset the switch signal.
    - order: 6
      role: C-ring motor-switch response
      node:
        id: c_ring_motor_switch
        label: FliG/FliM/FliN C-ring switch
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: c_ring_switch_complex
            label: Flagellar C-ring switch complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial flagellar C-ring switch complex
                active_units:
                  - id: flim_chey_binding_switch_subunit
                    label: FliM switch subunit
                    role: Binds CheY-P and transmits the chemotaxis signal into the C-ring.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FliM flagellar switch family
                        term:
                          id: PANTHER:PTHR30034:SF3
                          label: FLAGELLAR MOTOR SWITCH PROTEIN FLIM
                        representative_members:
                          - preferred_term: PSEPK FliM exemplar
                            term:
                              id: UniProtKB:Q88EU5
                              label: Flagellar motor switch protein FliM
                  - id: flin_switch_assembly_subunit
                    label: FliN switch subunit
                    role: Supports C-ring assembly and switching.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FliN flagellar switch family
                        term:
                          id: PANTHER:PTHR43484:SF1
                          label: FLAGELLAR MOTOR SWITCH PROTEIN FLIN
                        representative_members:
                          - preferred_term: PSEPK FliN exemplar
                            term:
                              id: UniProtKB:Q88EU6
                              label: Flagellar motor switch protein FliN
                  - id: flig_torque_coupling_subunit
                    label: FliG rotor/switch subunit
                    role: Reorients its stator-facing surface during switching and transmits torque.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: flagellar motor switch FliG family
                        term:
                          id: PANTHER:PTHR30534
                          label: FLAGELLAR MOTOR SWITCH PROTEIN FLIG
                        representative_members:
                          - preferred_term: PSEPK FliG exemplar
                            term:
                              id: UniProtKB:Q88ET5
                              label: Flagellar motor switch protein FliG
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
            role_description: Converts CheY-P binding at FliM into a change in C-ring conformation and rotation bias.
    - order: 7
      role: proton-conducting stator input to motor rotation
      node:
        id: flagellar_stator_conductance
        label: Flagellar stator proton conductance
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: motab_stator_complex
            label: MotAB flagellar stator complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial MotAB flagellar stator complex
                active_units:
                  - id: mota_channel_subunit
                    label: MotA stator membrane subunit
                    role: Forms the membrane proton-conducting and FliG-contacting portion of the stator.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: MotA flagellar stator family
                        term:
                          id: PANTHER:PTHR30433
                          label: CHEMOTAXIS PROTEIN MOTA
                        representative_members:
                          - preferred_term: PSEPK MotA exemplar
                            term:
                              id: UniProtKB:Q88DC2
                              label: Flagellar motor rotation protein
                  - id: motb_anchor_subunit
                    label: MotB stator anchor subunit
                    role: Anchors the stator to peptidoglycan and contributes the single-pass membrane channel component.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: MotB flagellar stator family
                        representative_members:
                          - preferred_term: PSEPK MotB exemplar
                            term:
                              id: UniProtKB:Q88DC3
                              label: Flagellar motor rotation protein
            function:
              preferred_term: proton transmembrane transporter activity
              term:
                id: GO:0015078
                label: proton transmembrane transporter activity
            role_description: Conducts protons and supplies energy for torque generation by the assembled motor.
          - id: motcd_stator_complex
            label: MotCD flagellar stator complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial MotCD flagellar stator complex
                active_units:
                  - id: motc_channel_subunit
                    label: MotC stator membrane subunit
                    role: Forms the membrane proton-conducting portion of the alternative stator.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: MotC-like flagellar stator family
                        term:
                          id: PANTHER:PTHR30433:SF3
                          label: MOTILITY PROTEIN A
                        representative_members:
                          - preferred_term: PSEPK MotC exemplar PP_4336
                            term:
                              id: UniProtKB:Q88EW6
                              label: Flagellar motor rotation protein
                  - id: motd_anchor_subunit
                    label: MotD stator anchor subunit
                    role: Anchors the alternative stator to peptidoglycan and contributes its membrane component.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: MotD-like flagellar stator anchor family
                        representative_members:
                          - preferred_term: PSEPK MotD exemplar PP_4335
                            term:
                              id: UniProtKB:Q88EW7
                              label: Flagellar motor protein
            function:
              preferred_term: proton transmembrane transporter activity
              term:
                id: GO:0015078
                label: proton transmembrane transporter activity
            role_description: >-
              Provides an alternative proton-driven stator with a distinct contribution
              to KT2440 motility under semisolid conditions.
    - order: 8
      role: assembled flagellar motor output
      node:
        id: flagellar_motor_rotation_output
        label: Flagellum-dependent motility output
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Stator proton conductance supplies torque while the C-ring switch sets
          rotational bias; neither is modeled as causally upstream of the other.
        concepts:
          - preferred_term: bacterial-type flagellum-dependent cell motility
            term:
              id: GO:0071973
              label: bacterial-type flagellum-dependent cell motility
  connections:
    - source: receptor_adaptation
      target: mcp_receptor_input
      connection_type: PROVIDES_INPUT_FOR
      description: Receptor methylation state tunes stimulus-dependent signaling.
    - source: mcp_receptor_input
      target: chea_phosphotransfer
      connection_type: PROVIDES_INPUT_FOR
      description: Ligand-dependent receptor state modulates CheA with stimulus-dependent sign.
    - source: chea_phosphotransfer
      target: chey_response_output
      connection_type: PROVIDES_INPUT_FOR
    - source: chea_phosphotransfer
      target: receptor_adaptation
      connection_type: POSITIVELY_REGULATES
      description: >-
        CheA-dependent phosphorylation activates the CheB receiver domain,
        increasing receptor methylesterase activity and closing the adaptation
        feedback loop.
    - source: chez_signal_reset
      target: chey_response_output
      connection_type: NEGATIVELY_REGULATES
      description: CheZ lowers the lifetime and abundance of phosphorylated CheY.
    - source: chey_response_output
      target: c_ring_motor_switch
      connection_type: CAUSES
      description: CheY-P binding at FliM changes C-ring conformation and rotational bias.
    - source: c_ring_motor_switch
      target: flagellar_motor_rotation_output
      connection_type: CAUSES
      description: C-ring conformation sets rotational direction and switching bias.
    - source: flagellar_stator_conductance
      target: flagellar_motor_rotation_output
      connection_type: CAUSES
      description: Proton conductance through occupied stators supplies torque for rotation.
  knowledge_gaps:
    - gap_statement: >-
        PSEPK encodes multiple chemoreceptors and chemotaxis systems; exact
        ligand assignments and component cross-talk are incompletely resolved.
      boundary: >-
        McpS and PcaY ground receptor architecture only. Their ligand
        specificity is not transferred to other receptor families.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        FliM and FliN are required to represent CheY-P engagement of the C-ring,
        but dedicated PSEPK reviews for these proteins are not yet available.
      boundary: >-
        Exact UniProt and PANTHER-grounded identities are included as module
        exemplars; gene-level annotation adjudication remains future work.
      gap_kind:
        - CURATION
    - gap_statement: >-
        PP_4332 and the adjacent CheW-domain protein PP_4333 may have distinct
        or partially redundant receptor-array coupling roles.
      boundary: >-
        Q88EX0 grounds the canonical CheW role; no unique function is asserted
        for Q88EW9 without direct comparative evidence.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The environmental and regulatory determinants that recruit KT2440 MotAB
        versus MotCD to individual motors remain incompletely resolved.
      boundary: >-
        Both experimentally supported stator complexes are represented, without
        asserting that they are simultaneously occupied or interchangeable.
      gap_kind:
        - BIOLOGY
