                adapter protein in this complex.
            - source_id: PMID:1660136
              title: Disulfide cross-linking studies of the transmembrane regions of the aspartate sensory
                receptor of Escherichia coli.
              statement: Tar transmits an aspartate signal across the membrane; this source-specific ligand
                response is not generalized to all chemoreceptors.
              supporting_text: The ability of an 18-18' cross-linked dimer to transmit an aspartate-induced
                transmembrane signal is also supportive of such an extended helix. The changes in relative
                rates of disulfide cross-linking provide experimental evidence of a conformational change
                transmitted through the transmembrane domain during signaling.
