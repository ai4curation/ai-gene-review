id: MODULE:bacterial_chemotaxis_signal_transduction
title: Bacterial chemotaxis signal transduction to flagellar motor output
description: Reusable bacterial chemotaxis module linking methyl-accepting chemoreceptor input and CheR/CheB
  methylation-dependent adaptation through CheW-coupled CheA autophosphorylation and phosphotransfer to
  the response regulator CheY, CheZ-dependent CheY-P dephosphorylation, CheY-P action on the FliG/FliM/FliN
  C-ring switch, and ion-conducting MotA/MotB-family stators that power flagellar rotation. Escherichia
  coli K-12 proteins ground the paradigm relay and Pseudomonas putida KT2440 proteins ground a second,
  polar-flagellate realization with two stator systems; receptor ligand specificity is not made universal.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0006935
  title: chemotaxis
  statement: Grounds directional movement in response to chemical stimuli.
- source_id: KEGG:eco02030
  title: Bacterial chemotaxis - Escherichia coli K-12 MG1655
  statement: Identifies the E. coli receptor, adaptation, phosphorelay, switch, and motor realization.
- source_id: KEGG:ppu02030
  title: Pseudomonas putida KT2440 bacterial chemotaxis
  statement: Identifies the PSEPK receptor, adaptation, phosphorelay, switch, and motor realization.
- source_id: file:ECOLI/cheA/cheA-ai-review.yaml
  statement: Grounds E. coli CheA histidine autokinase activity and phosphotransfer to CheY and CheB.
- source_id: file:ECOLI/cheY/cheY-ai-review.yaml
  statement: Grounds CheY receiver phosphorylation and CheY-P binding to FliM at the motor.
- source_id: file:ECOLI/cheZ/cheZ-ai-review.yaml
  statement: Grounds CheZ-dependent CheY-P dephosphorylation and signal reset.
- source_id: file:ECOLI/tar/tar-ai-review.yaml
  statement: Grounds the transmembrane chemoreceptor input of the E. coli realization.
- source_id: file:PSEPK/mcpS/mcpS-ai-review.yaml
  statement: Grounds a characterized KT2440 chemoreceptor input.
- source_id: PMID:23677992
  title: 'High specificity in CheR methyltransferase function: CheR2 of Pseudomonas putida is essential
    for chemotaxis, whereas CheR1 is involved in biofilm formation.'
  statement: Directly grounds methylation of McpS by the KT2440 CheR2 adaptation enzyme.
- source_id: PMID:36409076
  title: Role of the Two Flagellar Stators in Swimming Motility of Pseudomonas putida
  statement: Direct KT2440 deletion and complementation experiments establish distinct contributions from
    the MotAB and MotCD stators.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_chemotaxis_signal_transduction__ppu02030-deep-research-openscientist.md
  statement: Reviews pathway satisfiability, receptor diversity, adaptation proteins, the C-ring output,
    and the dual-stator realization in KT2440.
- source_id: PMID:33684668
  title: Diversity of bacterial chemosensory systems.
  statement: CheZ is one signal-reset implementation, not a universal required bacterial component.
  supporting_text: The E. coli chemosensory system utilizes the CheZ phosphatase, however, homologous
    systems in many other prokaryotes do not have CheZ, but instead contain other phosphatases for signal
    termination
- source_id: PMID:38985972
  title: Unpacking Alternative Features of the Bacterial Chemotaxis System.
  statement: Canonical E. coli architecture does not define all bacterial chemotaxis systems.
  supporting_text: Here, we compare the canonical chemotaxis system of E. coli with systems that diverge
    in supramolecular architecture, sensory mechanisms, and protein composition.
- source_id: PMID:31473052
  title: Diversity of Bacterial Chemosensory Arrays.
  statement: Some bacteria assemble multiple arrays with different sensory coverage and localization.
  supporting_text: Unlike E. coli, some bacteria assemble more than one chemosensory array and respond
    to a broader spectrum of environmental and internal stimuli.
- source_id: PMID:38038435
  title: Diverse domain architectures of CheA histidine kinase, a central component of bacterial and archaeal
    chemosensory systems.
  statement: A canonical five-domain CheA architecture is not universal; the experimentally grounded functional
    core must be separated from accessory domain occurrence.
  supporting_text: we found that only 46% of the CheA protein sequences in our data set have the classical
    five domain architecture
- source_id: PMID:41495260
  title: Altering chemotaxis as a strategy to enhance the foraging range of motility-restricted bacteria.
  statement: CheX and CheZ can coexist and make distinct contributions to chemotaxis in the same bacterial
    system.
  supporting_text: CheX and CheZ jointly regulate but exert distinct effects on V. vulnificus chemotaxis.
notes: 'The module captures the conserved signal flow rather than any species'' complete receptor repertoire.
  Tar (E. coli) and McpS and PcaY (KT2440) are receptor exemplars, not a claim of shared ligand specificity;
  enterobacterial-type receptors (PANTHER PTHR43531) and Pseudomonas-type receptors (PTHR32089:SF120)
  are separate PANTHER families and are modelled as alternative realizers. Lineage differences are real
  and are recorded here rather than averaged away. (1) Pseudomonas encodes several chemosensory systems
  (flagellar Che, Che2, the c-di-GMP-linked Wsp and pilus-linked Chp systems); only the flagellar cluster
  is modelled, its components (CheA2/PP_4338, CheR2, CheB1, CheW PP_4332) are not assumed interchangeable
  with paralogs of the other systems, and the adjacent CheW-domain protein PP_4333 is not given a separate
  role. (2) KT2440 CheA also carries a C-terminal CheW-like domain, but CheA domain architectures vary;
  free CheW is still needed to couple receptors to CheA. (3) CheY-P reset is not restricted to CheZ or
  to beta- and gammaproteobacteria: divergent Helicobacter CheZ partners with ChePep, while B. subtilis
  uses CheC and the FliY CheC-like domain, together with CheD and CheV; CheX is a distinct alternative
  in other bacteria, and in B. subtilis attractants activate rather than inhibit CheA. Those alternatives
  are not grounded here. (4) E. coli and Salmonella drive the motor with a single proton-type MotAB stator;
  KT2440 and P. aeruginosa have a second MotCD stator, and Vibrio uses sodium-type PomAB stators; the
  stator step is therefore a realizer variant set. MotA and MotC are grounded at the disjoint PTHR30433
  subfamilies SF4 and SF3. PANTHER PTHR30329 is HETEROGENEOUS: it is an OmpA-like peptidoglycan-binding
  domain family in which only the MotB, PomB, LafU and MotD members are stator anchors (OmpA, Pal and
  OprF are outer-membrane proteins). MotD is grounded at SF20; MotB stays at family level because its
  subfamily SF21 mixes MotB with OmpA-type proteins. (5) The CheA-to-CheY His-Asp transfer follows the
  two-component phosphorelay motif, but CheA is controlled by separate receptors rather than sensing a
  signal itself, and the module does not declare conformance to the two-component relay template. Flagellar
  construction and export are modelled separately (bacterial_flagellar_assembly_export). Comparative audit
  in progress: the current required CheZ reset, receptor architecture and adaptation assumptions need
  explicit alternative implementations before Bacteria-wide coverage can be claimed. The original 22 member
  reviews are being reassessed, and Bacillus-specific signaling and reset exemplars are being added. DRAFT
  records this pending model integration; the original COMPLETE flag was not evidence of cross-taxon completeness.'
