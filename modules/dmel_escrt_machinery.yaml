id: MODULE:dmel_escrt_machinery
title: ESCRT machinery in Drosophila melanogaster
description: >-
  The endosomal sorting complexes required for transport (ESCRTs) sort ubiquitylated membrane
  proteins into intralumenal vesicles of multivesicular bodies and drive membrane scission
  that buds away from the cytoplasm. ESCRT-0 (Hrs, Stam) binds ubiquitylated cargo on endosomes;
  ESCRT-I and ESCRT-II bind cargo and membrane and nucleate ESCRT-III, whose subunits polymerize
  into spirals that constrict the bud neck. The AAA ATPase Vps4, with its cofactor Vta1, disassembles
  ESCRT-III and recycles it. The same ESCRT-III and Vps4 machinery acts in cytokinetic abscission,
  nuclear envelope sealing and membrane repair. In Drosophila, loss of ESCRT function causes
  accumulation of signalling receptors such as Notch on endosomes and neoplastic overgrowth
  in epithelia.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000215
  title: 'FlyBase gene group ESCRT: Endosomal sorting complexes required for transport'
  statement: >-
    FlyBase release FB2026_03 groups 20 D. melanogaster genes as endosomal sorting complexes
    required for transport (ESCRT); this module models that group.
- source_id: GO:0032509
  title: endosome transport via multivesicular body sorting pathway
  statement: >-
    GO term grounding the module as endosome transport via multivesicular body sorting pathway.
notes: >-
  Decomposition. The five ESCRT subcomplexes are modelled as ordered parts, following the
  sequential recruitment established for the MVB pathway. The two ESCRT-I variants that differ
  in their Vps37 paralog are alternatives. Accessory factors such as ALiX are outside the
  module. FlyBase groups realized by this module: ESCRT (FBgg0000215). Subgroups folded into
  it: VSP4C, ESCRT-0, ESCRT-III, ESCRT-I, ESCRT-II, ESCRT-IB, ESCRT-IA. Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_escrt_machinery.yaml; none of the member genes has a gene review
  yet unless noted.
