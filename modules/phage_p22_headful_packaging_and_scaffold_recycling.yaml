  knowledge_gaps:
  - gap_statement: The exact allosteric and electrostatic mechanism by which initial DNA entry at the gp1 portal vertex triggers
      cooperative release of ~300 gp8 scaffolding C-terminal helix-turn-helix domains from coat protein gp5 and intact exit
      through procapsid shell pores remains incompletely resolved, and Gene Ontology lacks a dedicated biological process
      term for non-proteolytic viral capsid scaffolding release and catalytic recycling.
    boundary: Electrostatic C-terminal helix-turn-helix binding of ~250-300 gp8 scaffolding subunits to the gp5 N-arm, intact
      exit of gp8 through procapsid pores upon DNA packaging initiation, and catalytic reuse of gp8 across multiple assembly
      rounds are established biochemically and structurally (PMID:9792844, PMID:30787152, PMID:36851569).
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
