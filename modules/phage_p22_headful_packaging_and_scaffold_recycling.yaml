id: MODULE:phage_p22_headful_packaging_and_scaffold_recycling
title: Phage P22 non-proteolytic scaffolding recycling, pac-site headful DNA packaging, and portal-hub vertex closure
description: >-
  A coordinated viral capsid morphogenesis and genome packaging module exemplified by Salmonella phage P22 (Lederbergvirus)
  that couples non-proteolytic scaffolding-assisted T=7 procapsid assembly to pac-site-initiated headful DNA translocation
  and portal vertex closure. During procapsid assembly, ~250-300 copies of the 303-amino-acid scaffolding protein gp8 co-assemble
  with 415 subunits of the HK97/I-domain major capsid protein gp5, a single dodecameric portal ring (gp1) at one fivefold
  vertex, and the three internal ejection proteins (gp7, gp16, gp20). Unlike phage lambda or T4, P22 encodes no prohead maturation
  protease: when the nonameric small terminase (gp3) recognizes the pac site embedded within gene 3 and loads the large terminase
  motor/nuclease (gp2) onto the gp1 portal vertex, ATP-driven DNA translocation triggers intact release of all ~300 gp8 scaffolding
  molecules through pores in the procapsid lattice so that gp8 is recycled catalytically across multiple rounds of procapsid
  assembly. Once ~43.4 kb (~104% genome length) of terminally redundant, circularly permuted dsDNA fills the expanded T=7
  head, conformational signaling through the 150-Angstrom alpha-helical barrel of the gp1 portal triggers sequence-nonspecific
  headful cleavage by gp2, followed by sequential binding of the dodecameric head-to-tail adapter gp4, hexameric tail hub
  gp10, and triple-helical coiled-coil needle plug gp26 to seal the packaged genome inside the virion.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:9792844
  title: Electrostatic interactions drive scaffolding/coat protein binding and procapsid maturation in bacteriophage P22.
  statement: Demonstrates that electrostatic interactions between the C-terminal helix-turn-helix domain of gp8 and coat protein
    gp5 drive procapsid assembly and allow intact scaffolding exit and catalytic recycling during maturation.
- source_id: PMID:30787152
  title: 'Architect of Virus Assembly: the Portal Protein Nucleates Procapsid Assembly in Bacteriophage P22.'
  statement: Establishes that the dodecameric gp1 portal ring nucleates procapsid co-assembly with scaffolding protein gp8,
    coat protein gp5, and the internal ejection proteins.
- source_id: PMID:21499245
  title: Three-dimensional structure of a viral genome-delivery portal vertex.
  statement: Resolves the crystal and cryo-EM structure of the dodecameric gp1 portal complex including its 150-Angstrom
    alpha-helical barrel domain that collimates packaged DNA and acts as a headful packaging pressure gauge.
- source_id: PMID:22771211
  title: Small terminase couples viral DNA binding to genome-packaging ATPase activity.
  statement: Determines the nonameric ring structure of the P22 small terminase subunit gp3 and maps its pac-site DNA-binding
    and gp2-recruitment domains.
- source_id: PMID:36851569
  title: Assembly and Capsid Expansion Mechanism of Bacteriophage P22 Revealed by High-Resolution Cryo-EM Structures.
  statement: High-resolution cryo-EM structures of the P22 procapsid and mature virion defining gp8-gp5 interactions, scaffolding
    release, and I-domain-assisted T=7 capsid expansion.
- source_id: GO:0098006
  title: viral DNA genome packaging, headful
  statement: Defines the headful viral DNA packaging mechanism that produces circularly permuted, terminally redundant viral
    chromosomes.
- source_id: GO:0019069
  title: viral capsid assembly
  statement: Defines assembly of the icosahedral viral capsid shell around the portal and scaffolding core.
notes: 'Exemplar phage: Salmonella phage P22 (NCBITaxon:10754). Generalizes across Lederbergvirus and related headful-packaging
  podoviruses and siphoviruses (including Sf6 and CUS-3) that combine catalytic non-proteolytic scaffolding recycling with
  a long-barrel portal headful sensor and gp4-gp10-gp26 vertex closure.'
