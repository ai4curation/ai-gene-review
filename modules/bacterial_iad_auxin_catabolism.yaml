id: MODULE:bacterial_iad_auxin_catabolism
title: Bacterial iad-type aerobic indole-3-acetic acid catabolism
description: >-
  A conserved rhizosphere bacterial pathway module mediating aerobic uptake and
  catabolism of the plant hormone indole-3-acetic acid (IAA) via the iad gene
  cluster. The module comprises the MarR-family IAA-sensing transcriptional
  repressor IadR, the high-affinity periplasmic subcluster B-III ABC transporter
  solute-binding protein IadK2 (paired with its non-IAA-binding paralog IadK3),
  the Class IA NADH:ferredoxin oxidoreductase component IadC, the heterohexameric
  Rieske non-heme iron aromatic-ring-hydroxylating dioxygenase complex IadD/IadE
  that catalyzes the initial oxidative conversion of IAA into biologically
  inactive 2-oxindole-3-acetic acid (oxIAA), and the downstream cytoplasmic
  enzymes—including the heterodimeric TPP/[4Fe-4S]-dependent 2-oxoacid:ferredoxin
  oxidoreductase complex IadA/IadB and the arylformamidase IadI (KynB2)—that
  process oxidized indole intermediates through dioxindole-3-acetic acid, isatin,
  and isatinic acid to anthranilic acid, thereby buffering rhizosphere auxin
  levels and preventing root growth inhibition.
status: DRAFT
evidence:
  - source_id: GO:0042437
    title: indoleacetic acid catabolic process
    statement: >-
      GO:0042437 provides the biological-process context for bacterial oxidative
      indole-3-acetic acid degradation.
  - source_id: PMID:32999461
    title: >-
      A single bacterial genus maintains root growth in a complex microbiome.
    statement: >-
      Demonstrates that a conserved auxin-degradation (iad) operon in Variovorax
      strains is necessary and sufficient for reverting auxin- and
      microbiome-induced root growth inhibition.
    supporting_text: >-
      We identify an auxin-degradation operon that is conserved in all available
      genomes of Variovorax and is necessary and sufficient for the reversion of
      root growth inhibition.
  - source_id: PMID:36266335
    title: >-
      Diverse MarR bacterial regulators of auxin catabolism in the plant
      microbiome.
    statement: >-
      Demonstrates that co-expression of iadC with iadD and iadE is required to
      revert Arthrobacter-dependent root growth inhibition in the rhizosphere,
      characterizes the IAA-responsive MarR-family repressor IadR binding upstream
      of iadA, identifies iotA/iadA and iorB/iadB as exclusive markers of iad-like
      operons, and shows by 13C6-IAA metabolomics that the iad pathway degrades
      IAA via dioxindole-3-acetic acid, isatin, and isatinic acid to anthranilic
      acid.
    supporting_text: >-
      The intermediates dioxindole, isatin and isatinic acid, and the product
      anthranilic acid were all detected and thus produced in the bacterial
      cultures. Importantly, catechol, the main product of the iac IAA
      degradation, was not detected in any of the V. paradoxus CL14 samples.
  - source_id: PMID:37459330
    title: >-
      Structural and biochemical characterization of the key components of an
      auxin degradation operon from the rhizosphere bacterium Variovorax.
    statement: >-
      Resolves the crystal structures and biochemical activities of the
      Variovorax paradoxus IadK2 periplasmic IAA-binding protein (and its
      non-IAA-binding paralog IadK3), the IadD/IadE Rieske dioxygenase complex,
      and the IadC ferredoxin-NAD+ reductase.
    supporting_text: >-
      Together, these data suggest that IAA was converted to oxIAA by the
      dioxygenase system composed of the IadD/E dioxygenase and the IadC
      reductase (Fig 5E).
  - source_id: PMID:21183664
    title: >-
      Complete genome sequence of the metabolically versatile plant
      growth-promoting endophyte Variovorax paradoxus S110.
    statement: >-
      Establishes the complete genome sequence of Variovorax paradoxus S110
      hosting the iad gene cluster (Vapar_1489 to Vapar_1494).
    supporting_text: >-
      The complete genome sequence of V. paradoxus S110 is composed of 6,754,997
      bp with 6,279 predicted protein-coding sequences within two circular
      chromosomes.
  - source_id: file:VARPS/iadD/iadD-ai-review.yaml
    title: Variovorax paradoxus S110 iadD gene review
    statement: >-
      C5CSP6 (Vapar_1493) encodes the catalytic alpha subunit IadD of the
      indole-3-acetic acid Rieske dioxygenase.
  - source_id: file:VARPS/iadE/iadE-ai-review.yaml
    title: Variovorax paradoxus S110 iadE gene review
    statement: >-
      C5CSP7 (Vapar_1494) encodes the structural beta subunit IadE of the
      heterohexameric IadD/IadE dioxygenase complex.
  - source_id: file:VARPS/iadC/iadC-ai-review.yaml
    title: Variovorax paradoxus S110 iadC gene review
    statement: >-
      C5CSP5 (Vapar_1492) encodes the Class IA FMN/[2Fe-2S] ferredoxin-NAD+
      reductase component IadC that supplies electrons to IadD/IadE.
  - source_id: file:VARPS/iadR/iadR-ai-review.yaml
    title: Variovorax paradoxus S110 iadR gene review
    statement: >-
      C5CSP2 (Vapar_1489) encodes the IAA-sensing MarR-family transcriptional
      repressor IadR.
  - source_id: file:VARPD/iadK2/iadK2-ai-review.yaml
    title: Variovorax paradoxus iadK2 gene review
    statement: >-
      A0A0H2MF78 (VPARA_32110) encodes the high-affinity periplasmic subcluster
      B-III ABC transporter IAA-binding protein IadK2.
  - source_id: file:VARPD/iadK3/iadK3-ai-review.yaml
    title: Variovorax paradoxus iadK3 gene review
    statement: >-
      A0A0H2LZ84 (VPARA_32100) encodes the paralogous subcluster B-III
      periplasmic solute-binding protein IadK3 that lacks IAA binding due to
      pocket substitutions (S104V/W172L equivalent) and weakly associates with
      oxIAA.
  - source_id: file:VARPD/iadA/iadA-ai-review.yaml
    title: Variovorax paradoxus iadA gene review
    statement: >-
      A0A0H2MF87 (VPARA_32210) encodes the TPP- and [4Fe-4S]-binding alpha
      subunit IadA (IotA) of the iad-operon 2-oxoacid:ferredoxin oxidoreductase
      complex.
  - source_id: file:VARPD/iadB/iadB-ai-review.yaml
    title: Variovorax paradoxus iadB gene review
    statement: >-
      A0A0H2LZ92 (VPARA_32200) encodes the beta subunit IadB (IorB) of the
      iad-operon 2-oxoacid:ferredoxin oxidoreductase complex.
  - source_id: file:VARPD/iadI/iadI-ai-review.yaml
    title: Variovorax paradoxus iadI gene review
    statement: >-
      A0A0H2M433 (VPARA_32130, kynB2) encodes the arylformamidase IadI involved
      in downstream hydrolytic conversion of oxidized IAA intermediates to
      anthranilic acid.
module:
  id: bacterial_iad_auxin_catabolism
  label: Bacterial iad-type aerobic indole-3-acetic acid catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: indoleacetic acid catabolic process
      term:
        id: GO:0042437
        label: indoleacetic acid catabolic process
      description: >-
        Oxidative breakdown of the plant hormone indole-3-acetic acid (IAA) by
        rhizosphere bacteria via the iad gene cluster.
  parts:
    - order: 1
      role: auxin-responsive transcriptional derepression of the iad operon
      node:
        id: iadR_regulation_step
        label: IadR IAA-responsive transcriptional repression
        module_type: REGULATORY_STEP
        annotons:
          - id: iadR_repressor_activity
            label: IadR MarR-family DNA-binding transcription repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadR MarR-family IAA-sensing repressors
                representative_members:
                  - preferred_term: iadR (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CSP2
                      label: Transcriptional regulator, MarR family
                    description: >-
                      Variovorax paradoxus S110 Vapar_1489; binds IAA to release
                      operator DNA between iadR and iadA and derepress the iad
                      operon.
            function:
              preferred_term: DNA-binding transcription repressor activity
              term:
                id: GO:0001217
                label: DNA-binding transcription repressor activity
            role_description: >-
              Represses transcription of the iad operon in the absence of auxin
              and dissociates from operator DNA upon binding indole-3-acetic acid.
    - order: 2
      role: high-affinity periplasmic capture of indole-3-acetic acid for ABC transporter import
      node:
        id: iadK2_periplasmic_uptake_step
        label: IadK2 periplasmic indole-3-acetic acid capture
        module_type: TRANSPORT_STEP
        annotons:
          - id: iadK2_auxin_binding_activity
            label: IadK2 subcluster B-III periplasmic IAA-binding protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadK2 subcluster B-III periplasmic IAA-binding proteins
                representative_members:
                  - preferred_term: iadK2 (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2MF78
                      label: Leucine-binding protein domain-containing protein
                    description: >-
                      Variovorax paradoxus VPARA_32110; binds IAA with nanomolar
                      affinity in the periplasm to deliver auxin to the iad ABC
                      transporter complex.
            function:
              preferred_term: auxin binding
              term:
                id: GO:0010011
                label: auxin binding
              substrates:
                - preferred_term: indole-3-acetic acid
              products:
                - preferred_term: indole-3-acetic acid
            role_description: >-
              Selectively binds extracellular indole-3-acetic acid in the
              periplasm with nanomolar affinity to facilitate ABC
              transporter-mediated auxin import into the bacterial cell.
    - order: 3
      role: NADH-dependent ferredoxin electron transfer to the IadD/IadE oxygenase complex
      node:
        id: iadC_electron_transfer_step
        label: IadC ferredoxin-NAD+ reductase electron transfer
        module_type: REACTION
        annotons:
          - id: iadC_ferredoxin_activity
            label: IadC ferredoxin-NAD+ reductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadC Class IA FMN/[2Fe-2S] dioxygenase reductases
                representative_members:
                  - preferred_term: iadC (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CSP5
                      label: Ferredoxin
                    description: >-
                      Variovorax paradoxus S110 Vapar_1492; transfers electrons
                      from NADH via FMN and its [2Fe-2S] domain to the Rieske
                      [2Fe-2S] cluster of IadD.
            function:
              preferred_term: ferredoxin-NAD+ reductase activity
              term:
                id: GO:0008860
                label: ferredoxin-NAD+ reductase activity
              substrates:
                - preferred_term: NADH
              products:
                - preferred_term: NAD+
            role_description: >-
              Oxidizes NADH and shuttles electrons via FMN and its C-terminal
              [2Fe-2S] ferredoxin domain to the Rieske [2Fe-2S] cluster of IadD.
    - order: 4
      role: oxidative indole-3-acetic acid hydroxylation and ring conversion
      node:
        id: iadDE_dioxygenase_step
        label: IadD/IadE indole-3-acetic acid Rieske dioxygenase
        module_type: REACTION
        annotons:
          - id: iadDE_dioxygenase_activity
            label: IadD/IadE heterohexameric indole-3-acetic acid Rieske dioxygenase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: IadD/IadE indole-3-acetic acid Rieske dioxygenase heterohexamer
                term:
                  id: GO:1902494
                  label: catalytic complex
                active_units:
                  - id: iadD_alpha_unit
                    label: IadD catalytic alpha subunit
                    role: >-
                      Catalytic alpha subunit housing the Rieske [2Fe-2S]
                      cluster, mononuclear non-heme iron center, and IAA
                      substrate-binding pocket.
                    stoichiometry: alpha3
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: IadD aromatic-ring-hydroxylating dioxygenase alpha subunits
                        representative_members:
                          - preferred_term: iadD (Variovorax paradoxus S110)
                            term:
                              id: UniProtKB:C5CSP6
                              label: Rieske (2Fe-2S) domain protein
                            description: >-
                              Variovorax paradoxus S110 Vapar_1493; houses the
                              Rieske [2Fe-2S] cluster, mononuclear non-heme iron
                              center, and IAA substrate-binding pocket.
                    function:
                      preferred_term: >-
                        oxidoreductase activity, acting on paired donors, with
                        incorporation or reduction of molecular oxygen, NAD(P)H
                        as one donor, and incorporation of two atoms of oxygen
                        into one donor
                      term:
                        id: GO:0016708
                        label: >-
                          oxidoreductase activity, acting on paired donors, with
                          incorporation or reduction of molecular oxygen,
                          NAD(P)H as one donor, and incorporation of two atoms
                          of oxygen into one donor
                  - id: iadE_beta_unit
                    label: IadE structural beta subunit
                    role: >-
                      Structural beta subunit forming the trimeric stem base of
                      the alpha3-beta3 heterohexamer; contributes to holoenzyme
                      assembly without autonomous catalytic activity.
                    stoichiometry: beta3
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: IadE aromatic-ring-hydroxylating dioxygenase beta subunits
                        representative_members:
                          - preferred_term: iadE (Variovorax paradoxus S110)
                            term:
                              id: UniProtKB:C5CSP7
                              label: Aromatic-ring-hydroxylating dioxygenase beta subunit
                            description: >-
                              Variovorax paradoxus S110 Vapar_1494; assembles
                              into the alpha3-beta3 heterohexamer required for
                              IadD/IadE holoenzyme stability and catalysis.
            function:
              preferred_term: >-
                oxidoreductase activity, acting on paired donors, with
                incorporation or reduction of molecular oxygen, NAD(P)H as one
                donor, and incorporation of two atoms of oxygen into one donor
              term:
                id: GO:0016708
                label: >-
                  oxidoreductase activity, acting on paired donors, with
                  incorporation or reduction of molecular oxygen, NAD(P)H as one
                  donor, and incorporation of two atoms of oxygen into one donor
              substrates:
                - preferred_term: indole-3-acetic acid
                - preferred_term: dioxygen
              products:
                - preferred_term: 2-oxindole-3-acetic acid
            role_description: >-
              Catalyzes the committed oxidative conversion of indole-3-acetic
              acid to 2-oxindole-3-acetic acid at the mononuclear non-heme iron
              active site of the alpha3-beta3 IadD/IadE holoenzyme.
    - order: 5
      role: TPP- and [4Fe-4S]-dependent oxidative side-chain cleavage of oxidized indole intermediates
      node:
        id: iadAB_oxidoreductase_step
        label: IadA/IadB 2-oxoacid:ferredoxin oxidoreductase side-chain processing
        module_type: REACTION
        annotons:
          - id: iadAB_oxidoreductase_activity
            label: IadA/IadB heterodimeric 2-oxoacid:ferredoxin oxidoreductase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: IadA/IadB indolepyruvate/2-oxoacid ferredoxin oxidoreductase complex
                term:
                  id: GO:1902494
                  label: catalytic complex
                active_units:
                  - id: iadA_alpha_unit
                    label: IadA catalytic TPP/[4Fe-4S] alpha subunit
                    role: >-
                      Alpha subunit housing the thiamine pyrophosphate (TPP)
                      binding fold and C-terminal [4Fe-4S] ferredoxin domain.
                    stoichiometry: alpha
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: IadA (IotA) 2-oxoacid:ferredoxin oxidoreductase alpha subunits
                        representative_members:
                          - preferred_term: iadA (Variovorax paradoxus)
                            term:
                              id: UniProtKB:A0A0H2MF87
                              label: Indolepyruvate ferredoxin oxidoreductase
                            description: >-
                              Variovorax paradoxus VPARA_32210; TPP- and
                              [4Fe-4S]-binding alpha subunit encoded immediately
                              downstream of the IadR operator.
                    function:
                      preferred_term: >-
                        oxidoreductase activity, acting on the aldehyde or oxo
                        group of donors
                      term:
                        id: GO:0016903
                        label: >-
                          oxidoreductase activity, acting on the aldehyde or oxo
                          group of donors
                  - id: iadB_beta_unit
                    label: IadB catalytic beta subunit
                    role: >-
                      Beta subunit containing the PF01558 oxidoreductase
                      catalytic domain and C-terminal DUF6537 domain.
                    stoichiometry: beta
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: IadB (IorB) 2-oxoacid:ferredoxin oxidoreductase beta subunits
                        representative_members:
                          - preferred_term: iadB (Variovorax paradoxus)
                            term:
                              id: UniProtKB:A0A0H2LZ92
                              label: Putative indolepyruvate oxidoreductase subunit B
                            description: >-
                              Variovorax paradoxus VPARA_32200; beta subunit
                              co-encoded with iadA as an exclusive marker of
                              iad-type auxin catabolism operons.
                    function:
                      preferred_term: >-
                        oxidoreductase activity, acting on the aldehyde or oxo
                        group of donors
                      term:
                        id: GO:0016903
                        label: >-
                          oxidoreductase activity, acting on the aldehyde or oxo
                          group of donors
            function:
              preferred_term: >-
                oxidoreductase activity, acting on the aldehyde or oxo group of
                donors
              term:
                id: GO:0016903
                label: >-
                  oxidoreductase activity, acting on the aldehyde or oxo group of
                  donors
              substrates:
                - preferred_term: dioxindole-3-acetic acid
              products:
                - preferred_term: isatinic acid
            role_description: >-
              Heterodimeric TPP/[4Fe-4S] oxidoreductase complex (IadA/IadB) that
              serves as an exclusive hallmark of iad-like operons and mediates
              oxidative side-chain processing of oxidized indole intermediates
              toward isatin and isatinic acid.
    - order: 6
      role: hydrolytic deformylation of ring-opened oxidized indole intermediates to anthranilic acid
      node:
        id: iadI_arylformamidase_step
        label: IadI arylformamidase hydrolysis to anthranilic acid
        module_type: REACTION
        annotons:
          - id: iadI_arylformamidase_activity
            label: IadI kynurenine formamidase / arylformamidase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadI (KynB2) iad-operon arylformamidases
                representative_members:
                  - preferred_term: iadI (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M433
                      label: Kynurenine formamidase
                    description: >-
                      Variovorax paradoxus VPARA_32130 (kynB2); kynurenine
                      formamidase/cyclase-family hydrolase encoded in the iad
                      operon.
            function:
              preferred_term: arylformamidase activity
              term:
                id: GO:0004061
                label: arylformamidase activity
              substrates:
                - preferred_term: N-formylanthranilic acid
              products:
                - preferred_term: anthranilic acid
            role_description: >-
              Hydrolyzes the acyl/formyl group from ring-opened oxidized indole
              intermediates (derived from isatin/isatinic acid) to release
              anthranilic acid as the terminal aromatic product of the iad
              pathway.
  connections:
    - source: iadR_regulation_step
      target: iadDE_dioxygenase_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        IadR binds the 24 bp operator between iadR and iadA to repress
        transcription of the iad operon in the absence of IAA; binding of
        indole-3-acetic acid to IadR relieves repression across the operon.
    - source: iadK2_periplasmic_uptake_step
      target: iadDE_dioxygenase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Periplasmic IadK2 captures extracellular indole-3-acetic acid with
        nanomolar affinity for ABC transporter-mediated import to supply
        intracellular IAA to the IadD/IadE dioxygenase complex.
    - source: iadC_electron_transfer_step
      target: iadDE_dioxygenase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        IadC transfers electrons via its [2Fe-2S] cluster to the Rieske cluster
        of IadD to support dioxygen activation and IAA oxidation.
    - source: iadDE_dioxygenase_step
      target: iadAB_oxidoreductase_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: KNOWLEDGE_GAP
      description: >-
        Initial oxygenation of IAA by IadD/IadE produces 2-hydroxyindole-3-acetic
        acid / 2-oxindole-3-acetic acid, which is further oxidized via
        dioxindole-3-acetic acid and processed by downstream iad enzymes
        including IadA/IadB toward isatin and isatinic acid.
    - source: iadAB_oxidoreductase_step
      target: iadI_arylformamidase_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: KNOWLEDGE_GAP
      description: >-
        Side-chain cleavage and ring opening of oxidized indole intermediates
        generate the formyl/acyl-anthranilate substrate hydrolyzed by IadI to
        anthranilic acid.
  notes: >-
    Grounded on the Variovorax paradoxus S110 (NCBITaxon:543728) exemplars
    C5CSP2 (IadR, Vapar_1489), C5CSP5 (IadC, Vapar_1492), C5CSP6 (IadD,
    Vapar_1493), and C5CSP7 (IadE, Vapar_1494) together with the syntenic
    Variovorax paradoxus (NCBITaxon:34073) iad operon proteins A0A0H2MF78
    (IadK2, VPARA_32110), A0A0H2LZ84 (IadK3, VPARA_32100), A0A0H2MF87 (IadA,
    VPARA_32210), A0A0H2LZ92 (IadB, VPARA_32200), and A0A0H2M433 (IadI/KynB2,
    VPARA_32130), supported by biochemical, structural, genetic, and
    metabolomic characterization in PMID:32999461, PMID:36266335, and
    PMID:37459330. The co-encoded paralogous B-III solute-binding protein IadK3
    (A0A0H2LZ84) lacks IAA-binding activity due to pocket substitutions
    corresponding to S104V and W172L of IadK2 and weakly associates with
    2-oxindole-3-acetic acid (oxIAA).
