id: MODULE:bacterial_iad_auxin_catabolism
title: Bacterial iad-type aerobic indole-3-acetic acid catabolism
description: >-
  A conserved rhizosphere bacterial pathway module mediating aerobic catabolism
  of the plant hormone indole-3-acetic acid (IAA) via the iad gene cluster. The
  module comprises the MarR-family IAA-sensing transcriptional repressor IadR,
  the Class IA NADH:ferredoxin oxidoreductase component IadC, and the
  heterohexameric Rieske non-heme iron aromatic-ring-hydroxylating dioxygenase
  complex IadD/IadE that catalyzes the initial oxidative step of IAA
  degradation into biologically inactive 2-oxindole-3-acetic acid, thereby
  buffering rhizosphere auxin levels and preventing root growth inhibition.
status: DRAFT
evidence:
  - source_id: GO:0042437
    title: indoleacetic acid catabolic process
    statement: >-
      GO:0042437 provides the biological-process context for bacterial oxidative
      indole-3-acetic acid degradation.
  - source_id: PMID:32999461
    title: >-
      A single bacterial genus maintains root growth in a complex microbiome.
    statement: >-
      Demonstrates that a conserved auxin-degradation (iad) operon in Variovorax
      strains is necessary and sufficient for reverting auxin- and
      microbiome-induced root growth inhibition.
    supporting_text: >-
      We identify an auxin-degradation operon that is conserved in all available
      genomes of Variovorax and is necessary and sufficient for the reversion of
      root growth inhibition.
  - source_id: PMID:36266335
    title: >-
      Diverse MarR bacterial regulators of auxin catabolism in the plant
      microbiome.
    statement: >-
      Demonstrates that co-expression of iadC with iadD and iadE is required to
      revert Arthrobacter-dependent root growth inhibition in the rhizosphere
      and characterizes the IAA-responsive MarR-family repressor IadR.
    supporting_text: >-
      However, only the CL14 ΔHS33 pBBR1::iadCDE strain containing all three
      genes was able to revert the Arthrobacter CL28-dependent RGI to CL14
      wild-type levels.
  - source_id: PMID:37459330
    title: >-
      Structural and biochemical characterization of the key components of an
      auxin degradation operon from the rhizosphere bacterium Variovorax.
    statement: >-
      Resolves the crystal structures and biochemical activities of the
      Variovorax paradoxus S110 IadD/IadE Rieske dioxygenase complex, IadC
      ferredoxin-NAD+ reductase, and IadR MarR-family IAA-binding repressor.
    supporting_text: >-
      Together, these data suggest that IAA was converted to oxIAA by the
      dioxygenase system composed of the IadD/E dioxygenase and the IadC
      reductase (Fig 5E).
  - source_id: PMID:21183664
    title: >-
      Complete genome sequence of the metabolically versatile plant
      growth-promoting endophyte Variovorax paradoxus S110.
    statement: >-
      Establishes the complete genome sequence of Variovorax paradoxus S110
      hosting the iad gene cluster (Vapar_1489 to Vapar_1494).
    supporting_text: >-
      The complete genome sequence of V. paradoxus S110 is composed of 6,754,997
      bp with 6,279 predicted protein-coding sequences within two circular
      chromosomes.
  - source_id: file:VARPS/iadD/iadD-ai-review.yaml
    title: Variovorax paradoxus S110 iadD gene review
    statement: >-
      C5CSP6 (Vapar_1493) encodes the catalytic alpha subunit IadD of the
      indole-3-acetic acid Rieske dioxygenase.
  - source_id: file:VARPS/iadE/iadE-ai-review.yaml
    title: Variovorax paradoxus S110 iadE gene review
    statement: >-
      C5CSP7 (Vapar_1494) encodes the structural beta subunit IadE of the
      heterohexameric IadD/IadE dioxygenase complex.
  - source_id: file:VARPS/iadC/iadC-ai-review.yaml
    title: Variovorax paradoxus S110 iadC gene review
    statement: >-
      C5CSP5 (Vapar_1492) encodes the Class IA FMN/[2Fe-2S] ferredoxin-NAD+
      reductase component IadC that supplies electrons to IadD/IadE.
  - source_id: file:VARPS/iadR/iadR-ai-review.yaml
    title: Variovorax paradoxus S110 iadR gene review
    statement: >-
      C5CSP2 (Vapar_1489) encodes the IAA-sensing MarR-family transcriptional
      repressor IadR.
module:
  id: bacterial_iad_auxin_catabolism
  label: Bacterial iad-type aerobic indole-3-acetic acid catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
