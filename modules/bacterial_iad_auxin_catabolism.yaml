            label: IadC ferredoxin-NAD+ reductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadC Class IA FMN/[2Fe-2S] dioxygenase reductases
                representative_members:
                  - preferred_term: iadC (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CSP5
                      label: Ferredoxin
                    description: >-
                      Variovorax paradoxus S110 Vapar_1492; transfers electrons
                      from NADH via FMN and its [2Fe-2S] domain to the Rieske
                      [2Fe-2S] cluster of IadD.
            function:
              preferred_term: ferredoxin-NAD+ reductase activity
              term:
                id: GO:0008860
                label: ferredoxin-NAD+ reductase activity
              substrates:
                - preferred_term: NADH
              products:
                - preferred_term: NAD+
            role_description: >-
              Oxidizes NADH and shuttles electrons via FMN and its C-terminal
              [2Fe-2S] ferredoxin domain to the Rieske [2Fe-2S] cluster of IadD.
    - order: 3
      role: oxidative indole-3-acetic acid hydroxylation and ring conversion
