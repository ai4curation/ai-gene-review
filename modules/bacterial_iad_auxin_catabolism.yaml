        module_type: REGULATORY_STEP
        annotons:
          - id: iadR_repressor_activity
            label: IadR MarR-family DNA-binding transcription repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IadR MarR-family IAA-sensing repressors
                representative_members:
                  - preferred_term: iadR (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CSP2
                      label: Transcriptional regulator, MarR family
                    description: >-
                      Variovorax paradoxus S110 Vapar_1489; binds IAA to release
                      operator DNA and derepress the iad operon.
            function:
              preferred_term: DNA-binding transcription repressor activity
              term:
                id: GO:0001217
                label: DNA-binding transcription repressor activity
            role_description: >-
              Represses transcription of the iad operon in the absence of auxin
              and dissociates from operator DNA upon binding indole-3-acetic acid.
    - order: 2
      role: NADH-dependent ferredoxin electron transfer to the IadD/IadE oxygenase complex
      node:
        id: iadC_electron_transfer_step
        label: IadC ferredoxin-NAD+ reductase electron transfer
        module_type: REACTION
        annotons:
