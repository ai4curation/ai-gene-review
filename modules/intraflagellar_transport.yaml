    - order: 5
      role: ciliary kinase regulation of IFT motors and cargo unloading
      node:
        id: dyf5_regulation
        label: MAK/CILK1-family kinase regulation of IFT
        module_type: REGULATORY_STEP
        description: >-
          Ciliary serine/threonine kinases of the MAK/CILK1 family (worm DYF-5,
          human CILK1, Chlamydomonas LF4) travel into the cilium and regulate
          IFT and cilium length; loss of their function generally gives long
          cilia. In worm dyf-5 mutants IFT proteins accumulate distally,
          kinesin-II is no longer confined to the middle segment and OSM-3
          moves slowly without attached IFT particles. DYF-5 phosphorylates the
          tubulin-binding module of IFT-74, lowering IFT-74/81 affinity for
          tubulin and promoting tubulin unloading at the tip. Human CILK1
          concentrates at the ciliary tip and phosphorylates KIF3A, and its
          loss causes IFT-A, IFT-B and BBSome components to accumulate at
          ciliary tips. These kinases regulate IFT rather than form part of
          the transport machinery.
        annotons:
          - id: dyf5_kinase
            label: MAK/CILK1-family ciliary kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MAK/CILK1 (RCK) ciliary kinase family
                description: >-
                  Worm has one member (DYF-5); mammals have CILK1 and MAK, of
                  which only CILK1 has a gene review here.
                representative_members:
                  - preferred_term: DYF-5 (worm)
                    term:
                      id: UniProtKB:B3WFY8
                      label: Serine/threonine-protein kinase dyf-5
                  - preferred_term: CILK1 (human)
                    term:
                      id: UniProtKB:Q9UPZ9
                      label: Serine/threonine-protein kinase ICK
