          IFT-B is the subcomplex that OSM-3 moves when trains are split in bbs
          mutants; worm IFT-B subunits concentrate at the ciliary base and move
          bidirectionally along the axoneme, and mutants lacking them have
          short or absent axonemes and fail to take up dyes.
