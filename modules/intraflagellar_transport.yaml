    - order: 3
      role: anterograde transport by kinesin-2 motors
      node:
        id: anterograde_kinesin2_transport
        label: Anterograde IFT by kinesin-2
        module_type: TRANSPORT_STEP
        description: >-
          Kinesin-2 motors move IFT trains toward the ciliary tip.
          Heterotrimeric kinesin-II is the conserved anterograde IFT motor.
          Some lineages add a homodimeric kinesin-2. In C. elegans, kinesin-II
          imports trains through the ciliary base and transition zone and hands
          them over to OSM-3 on the proximal axoneme; in the middle segment the
          two motors act together and partly redundantly, OSM-3 alone moves
          trains along the distal singlets, and the BBSome (BBS-7, BBS-8) is
          needed to keep both motors on the same train.
        concepts:
          - preferred_term: intraciliary anterograde transport
            term:
              id: GO:0035720
              label: intraciliary anterograde transport
        parts:
          - order: 1
            role: heterotrimeric kinesin-II transport
            node:
              id: kinesin_ii_import
              label: Heterotrimeric kinesin-II transport of IFT trains
              module_type: TRANSPORT_STEP
              description: >-
                Heterotrimeric kinesin-II is made of two different kinesin-2
                motor subunits (human KIF3A/KIF3B; worm KLP-20/KLP-11) and a
                non-motor armadillo-repeat subunit (human KAP3; worm KAP-1)
                that links the motor to IFT cargo. In worms it is the slower,
                less processive motor: it carries trains through the base and
                transition zone into a handover zone on the proximal axoneme and
                then turns around and recycles to the base. KLP-11 is
                unprocessive as a homodimer and gains processivity by
                heterodimerizing with KLP-20; heterodimerization is also needed
                to bind KAP-1, which co-recognizes the folded pair of motor
                tails.
              annotons:
                - id: kinesin_ii_motor
                  label: Heterotrimeric kinesin-II motor
                  participant:
                    selector_type: PROTEIN_COMPLEX
                    protein_complex:
                      preferred_term: heterotrimeric kinesin-II (KIF3A/KIF3B/KAP3; KLP-20/KLP-11/KAP-1)
                      term:
                        id: GO:0030993
                        label: axonemal heterotrimeric kinesin-II complex
                      active_units:
