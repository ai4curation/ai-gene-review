id: MODULE:intraflagellar_transport
title: Intraflagellar transport
description: >-
  Intraflagellar transport (IFT) is the bidirectional, motor-driven movement of
  large protein trains along the ciliary axoneme that builds and maintains
  cilia. It is ancestral in ciliated eukaryotes and has been lost along with
  cilia in lineages such as most fungi, flowering plants and Dictyostelium.
  IFT trains are polymers of two multisubunit complexes. IFT-B (including
  IFT88, IFT52, IFT57, IFT80, IFT70, IFT38, IFT46, IFT54, IFT56, IFT172, IFT20
  and the IFT74/IFT81 tubulin-binding module) is needed to extend the axoneme
  and carries tubulin and other axonemal precursors. IFT-A (IFT140, IFT122,
  IFT144, IFT139, IFT121 and IFT43) is needed for retrograde transport and for
  ciliary import of membrane proteins. Heterotrimeric kinesin-II (two kinesin-2
  motor subunits and a non-motor KAP subunit) carries trains from the ciliary
  base through the transition zone toward the tip. Some lineages add a
  homodimeric kinesin-2 accessory motor. In Caenorhabditis elegans sensory
  cilia, OSM-3 takes trains over from kinesin-II in a handover zone and alone
  builds the distal singlet segment, and the IFT-B subunit DYF-1 is required
  for OSM-3 to dock onto trains. At the tip trains turn around and are
  returned to the base by IFT-dynein (cytoplasmic dynein-2), whose heavy chain
  is DYNC2H1 (worm CHE-3). Ciliary kinases of the MAK/CILK1 family (worm
  DYF-5, human CILK1) regulate motor behaviour, train turnaround and cilium
  length; DYF-5 phosphorylates the tubulin-binding module of IFT-74 to promote
  tubulin unloading, and CILK1 phosphorylates the kinesin-II subunit KIF3A.
  The BBSome couples IFT-A and IFT-B and regulates IFT assembly at the base
  and turnaround at the tip. Loss of IFT-B, IFT-A, kinesin-II or dynein-2
  function causes absent, truncated or malformed cilia; in worms this
  prevents dye uptake by sensory neurons, and in humans IFT gene mutations
  cause skeletal and renal ciliopathies.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:11062270
    title: Chlamydomonas IFT88 and its mouse homologue, polycystic kidney disease gene tg737, are required for assembly of cilia and flagella.
    statement: >-
      IFT88 is a complex B subunit required for flagellar assembly in
      Chlamydomonas, and its mouse homologue is required for primary cilium
      assembly, so the IFT machine is shared by algae and mammals.
    supporting_text: >-
      This indicates that IFT is important for primary cilia assembly in
      mammals.
  - source_id: PMID:15489852
    title: Two anterograde intraflagellar transport motors cooperate to build sensory cilia on C. elegans neurons.
    statement: >-
      Kinesin-II and OSM-3 kinesin act redundantly along the middle-segment
      doublets, and OSM-3 alone builds the distal segment, creating two
      sequential anterograde pathways.
    supporting_text: >-
      the two motors function redundantly to transport IFT particles along
      doublet microtubules adjacent to the transition zone to form the axoneme
      middle segment. Next, Osm-3-kinesin alone transports IFT particles along
      the distal singlet microtubules to stabilize the distal segment.
  - source_id: PMID:17314406
    title: 'Sensory ciliogenesis in Caenorhabditis elegans: assignment of IFT components into distinct modules based on transport and phenotypic profiles.'
    statement: >-
      Transport and phenotypic profiling divides the worm IFT machinery into
      IFT-A, IFT-B, BBS, motor and cargo modules.
    supporting_text: >-
      the C. elegans IFT machinery has a modular design, consisting of modules
      IFT-subcomplex A, IFT-subcomplex B, and a BBS protein complex, in addition
      to motor and cargo modules
  - source_id: PMID:11301258
    title: An autosomal recessive polycystic kidney disease gene homolog is involved in intraflagellar transport in C. elegans ciliated sensory neurons.
    statement: >-
      IFT-B (OSM-5) and IFT-A (DAF-10, CHE-11) polypeptides and CHE-2 move at
      the same rate in worm sensory cilia.
    supporting_text: >-
      We demonstrate that OSM-5 (a Complex B polypeptide), DAF-10 and CHE-11
      (two Complex A polypeptides), and CHE-2 [10], a previously uncategorized
      IFT polypeptide, all move at the same rate in C. elegans sensory cilia.
  - source_id: PMID:31451806
    title: Structure of the dynein-2 complex and its assembly with intraflagellar transport trains.
    statement: >-
      In the human IFT cycle dynein-2 joins IFT trains at the base and is
      carried to the tip in an inhibited state by kinesin-2.
    supporting_text: >-
      Dynein-2 assembles with IFT trains at the ciliary base, moves to the tip
      in an inhibited state under the power of
  - source_id: file:modules/bbsome.yaml
    title: BBSome ciliary trafficking complex module
    statement: >-
      The BBSome, which acts as an IFT adaptor that couples IFT-A and IFT-B and
      regulates IFT turnaround, is modelled in its own module and is referenced
      here as an interface rather than duplicated.
  - source_id: file:modules/ciliary_transition_zone.yaml
    title: Ciliary transition zone module
    statement: >-
      The transition zone that IFT trains pass through is modelled in its own
      module and is referenced here as an interface.
  - source_id: file:projects/CAEEL_CILIOPATHY.md
    title: C. elegans Ciliopathy/IFT Pathway Project
    statement: >-
      Project page listing the worm IFT-B, IFT-A, kinesin-2 and dynein-2 genes
      whose gene reviews ground the worm members of this module.
notes: >-
  Boundary. This module covers the IFT machine itself: the IFT-B and IFT-A
  train complexes, the anterograde kinesin-2 motors, the retrograde IFT-dynein,
  and the MAK/CILK1-family kinases that regulate motor behaviour and cargo
  release. The ciliary transition zone (MODULE:ciliary_transition_zone) is a
  separate module; IFT trains pass through it, and IFT and transition-zone
  proteins act at different steps of ciliogenesis. Transcriptional control of
  ciliary genes (RFX factors such as worm DAF-19) is regulatory context, not a
  part.

  Taxon scope. The module is set at Eukaryota because the IFT-A, IFT-B,
  kinesin-II and dynein-2 families were present in the last eukaryotic common
  ancestor and the IFT cycle has been characterised in green algae, nematodes
  and vertebrates. It does not apply to lineages that lost cilia, and some
  ciliated lineages build flagella without IFT (for example, Plasmodium
  gametes assemble their axonemes in the cytoplasm). Representatives here are
  from C. elegans and human only. No Chlamydomonas IFT protein has a gene
  review in this repository, so Chlamydomonas is used as evidence, not as a
  representative.

  Lineage-variable motor. The homodimeric kinesin-2 accessory motor is
  modelled as an optional part with a variant set. Only the nematode OSM-3
  variant is grounded. Vertebrate KIF17 is the OSM-3 homolog and acts as an
  accessory or cell-type-specific motor (for example, in photoreceptor outer
  segments), but it has no gene review here, so it is mentioned in these notes
  and not modelled as a variant. Chlamydomonas flagella are built by
  heterotrimeric kinesin-II (FLA10/FLA8/KAP) without a homodimeric kinesin-2.

  Relation to MODULE:bbsome. The BBSome is modelled separately. In worms
  BBS-7 and BBS-8 hold IFT-A and IFT-B together so that both motors move the
  same train (in bbs-7/bbs-8 mutants IFT-A is moved by kinesin-II and IFT-B
  by OSM-3 separately; PMID:16049494), and the BBSome binds anterograde
  trains in a DYF-2- and BBS-1-dependent manner and is needed for turnaround
  at the tip (PMID:22922713). Those interactions are recorded as an interface
  in the IFT-A part and the turnaround connection, not as BBSome membership.

  Members and molecular functions. Each subunit or motor role is an ortholog
  family, with the worm protein and, where a gene review exists, a human
  representative (IFT88, IFT140, KIF3A, DYNC2H1, CILK1). Human orthologs of
  the other worm subunits (for example KIF3B, KIFAP3, DYNC2LI1, IFT122, WDR19,
  WDR35) have no gene reviews here and are named in text only. Molecular
  functions follow the gene reviews' core functions. Several worm reviews
  (OSM-6, CHE-13, CHE-11, DAF-10, DYF-2) give structural molecule activity
  for scaffold subunits; this module does not use that term, and those
  subunits, like the ones whose reviews assert no MF (CHE-2, DYF-3, DYF-6,
  OSM-1, IFT-20, IFT-139, IFT-43, IFTA-1, human IFT88 and IFT140), carry only
  a role description. IFT20 has a Golgi-associated role in mammalian cells
  that is not seen in worms; this module covers only its ciliary IFT-B role.
  Where the worm and human reviews differ, the annoton description says which
  review asserts the MF. No PANTHER family ids are asserted for these roles.
  IFT25, IFT27 and IFT22 are intentionally not in the IFT-B roster. IFT25 and
  IFT27 are absent from several ciliated lineages (PMID:31951201), and no
  C. elegans ortholog is modelled here. Worm IFTA-2, the IFT22/RABL5 homolog,
  co-purifies with IFT-74/81 (PMID:35969738), but its loss does not cause
  overt cilia assembly defects (PMID:16968739), and it has no gene review
  here, so it is named in text only.

  Kinase regulation. DYF-5 and CILK1 are modelled as regulators of IFT, not
  as transport machinery. Worm has a single MAK/CILK1-family ciliary kinase
  (DYF-5); mammals have both CILK1 and MAK, and only CILK1 is reviewed here.

  Ciliary segments. Worm amphid channel cilia have a transition zone, a
  middle segment of doublet microtubules and a distal segment of singlet
  microtubules. Segment-level anatomy is described in prose because GO has
  no terms for ciliary middle or distal segments.
module:
  id: intraflagellar_transport
  label: Intraflagellar transport
  module_type: BIOLOGICAL_PROCESS
  description: >-
    IFT-B and IFT-A trains carried to the ciliary tip by kinesin-2 motors and
    returned to the base by IFT-dynein, with motor behaviour and cargo release
    tuned by MAK/CILK1-family ciliary kinases.
  concepts:
    - preferred_term: intraciliary transport
      term:
        id: GO:0042073
        label: intraciliary transport
      description: >-
        Module-level process. The anterograde and retrograde branches are
        placed on the motor parts.
    - preferred_term: cilium assembly
      term:
        id: GO:0060271
        label: cilium assembly
      description: >-
        The outcome that IFT serves. In worm sensory neurons this is non-motile
        cilium assembly (GO:1905515); in mammals IFT builds both primary and
        motile cilia.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          IFT is ancestral in ciliated eukaryotes and is lost in lineages
          without cilia (most fungi, flowering plants, Dictyostelium).
          Representatives are from Caenorhabditis elegans and Homo sapiens;
          Chlamydomonas reinhardtii, where IFT was discovered, contributes
          evidence only.
    cellular_components:
      - preferred_term: cilium
        term:
          id: GO:0005929
          label: cilium
    anatomical_locations:
      - preferred_term: ciliated cells
        description: >-
          Any cell that builds a cilium or flagellum by IFT: in C. elegans the
          ciliated sensory neurons (amphid, phasmid and labial), in mammals the
          primary-ciliated and multiciliated cells.
