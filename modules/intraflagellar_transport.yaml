knowledge_gaps:
  - gap_statement: >-
      In nematode cilia, the molecular signal that triggers the handover from
      kinesin-II to OSM-3 on the proximal axoneme, and how the two motors are
      coordinated on one train, are not known. The DYF-5 substrates that
      control motor docking and undocking have not been identified; IFT-74 is
      the only reported worm substrate and accounts for tubulin unloading, not
      motor exchange.
    boundary: >-
      DYF-5 is genetically required to confine kinesin-II and to dock OSM-3,
      and OSM-3 autoinhibition is relieved by cargo attachment in vitro. No
      direct phosphorylation of KLP-11, KLP-20, KAP-1, OSM-3 or DYF-1 by DYF-5
      has been shown, although mammalian CILK1 phosphorylates KIF3A.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Explains how a single train is passed between two motors with different
      speeds and processivity, a feature of worm cilia not shared by
      single-motor systems such as Chlamydomonas flagella.
    resolution: >-
      Ciliary phosphoproteomics in dyf-5 mutants; phospho-site mutants of
      kinesin-II subunits (including the KIF3A-equivalent site in KLP-20) and
      DYF-1 tested for handover-zone position by single-molecule imaging.
    provenance:
      - reference_id: PMID:17420466
        supporting_text: >-
          Not much is known about the mechanisms that compartmentalize the
          kinesin-2 complexes or how transport by both kinesins is coordinated.
  - gap_statement: >-
      How IFT trains are remodelled at the ciliary tip, and how the BBSome and
      tip kinases switch them from kinesin-2 to dynein-2, is not understood at
      the molecular level.
    boundary: >-
      The BBSome and DYF-2 are required for turnaround in worms, dynein-2 is
      carried to the tip by anterograde trains in an inhibited state, and loss
      of CILK1 makes IFT components accumulate at the tip in mammalian cells.
      The tip events that release kinesin-2 and activate dynein-2 are not
      characterised.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Turnaround defects cause accumulation of IFT and BBSome proteins at the
      tip and abnormal cilia, so this step is required for a working IFT
      cycle.
    resolution: >-
      Time-resolved imaging of tagged kinesin-II, dynein-2, IFT-A, IFT-B and
      BBSome subunits at the tip in wild type and turnaround mutants, combined
      with in vitro reconstitution of train remodelling.
    provenance:
      - reference_id: PMID:22922713
        supporting_text: >-
          how IFT assembly and turnaround are regulated in vivo remains elusive
