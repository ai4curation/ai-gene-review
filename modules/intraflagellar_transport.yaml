                              label: kinesin binding
                  function:
                    preferred_term: plus-end-directed microtubule motor activity
                    term:
                      id: GO:0008574
                      label: plus-end-directed microtubule motor activity
                  processes:
                    - preferred_term: intraciliary anterograde transport
                      term:
                        id: GO:0035720
                        label: intraciliary anterograde transport
                  locations:
                    - preferred_term: ciliary transition zone
                      term:
                        id: GO:0035869
                        label: ciliary transition zone
                    - preferred_term: axoneme
                      term:
                        id: GO:0005930
                        label: axoneme
                  role_description: >-
                    Carries IFT trains from the ciliary base through the
                    transition zone toward the tip; in worms it imports trains
                    and carries them along the middle-segment doublets.
                  evidence:
                    - source_id: PMID:16298999
                      title: Role of the kinesin-2 family protein, KIF3, during mitosis.
                      statement: Mammalian kinesin-2 is a KIF3A/KIF3B motor heterodimer with KAP3.
                      supporting_text: >-
                        Kinesin-2 is composed of two microtubule-based motor
                        subunits, KIF3A/3B, and a kinesin-associated protein
                        known as KAP3
                    - source_id: PMID:23386061
                      title: Kif3a interacts with Dynactin subunit p150 Glued to organize centriole subdistal appendages.
                      statement: Cilium formation requires the kinesin-II subunit Kif3a.
                      supporting_text: >-
                        Formation of cilia, microtubule-based structures that
