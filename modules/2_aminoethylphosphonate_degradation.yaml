id: MODULE:2_aminoethylphosphonate_degradation
title: PhnWX 2-aminoethylphosphonate degradation
description: >-
  A reusable two-reaction bacterial pathway that degrades
  2-aminoethylphosphonate through phosphonoacetaldehyde. PhnW first transfers
  the amino group to pyruvate, producing L-alanine and phosphonoacetaldehyde.
  PhnX then hydrolytically cleaves the carbon-phosphorus bond, yielding
  acetaldehyde and inorganic phosphate. Transport of 2-aminoethylphosphonate
  and downstream acetaldehyde metabolism are outside the module boundary.
status: COMPLETE
evidence:
  - source_id: GO:0019700
    title: organic phosphonate catabolic process
    statement: The GO process term supplies the pathway-level biological boundary.
  - source_id: file:PSEPK/phnW/phnW-uniprot.txt
    title: UniProtKB entry for PSEPK PhnW
    statement: >-
      Q88KT0 supplies a reviewed PSEPK exemplar for the
      2-aminoethylphosphonate:pyruvate transaminase reaction.
  - source_id: file:PSEPK/phnX/phnX-uniprot.txt
    title: UniProtKB entry for PSEPK PhnX
    statement: >-
      Q88KT1 supplies a reviewed PSEPK exemplar for phosphonoacetaldehyde
      hydrolysis to acetaldehyde and phosphate.
  - source_id:
      file:projects/P_PUTIDA/deep-research/PSEPK__2-aminoethylphosphonate-degradation-by-phnwx__ppu00440-deep-research-openscientist.md
    title: OpenScientist PSEPK PhnWX pathway satisfiability research
    statement: >-
      Provider-generated species/pathway research supports the narrow two-step
      module boundary, confirms that both reactions are covered in KT2440, and
      distinguishes the uncertain uptake and regulatory context from the core
      pathway.
  - source_id: PMID:37836707
    title: The Microbial Degradation of Natural and Anthropogenic Phosphonates.
    statement: The PhnWX route is distinct from PhnWAY and occurs beyond Pseudomonas; the review
      surveys bacterial pathway distribution and lineage-dependent regulation.
    supporting_text: The PhnWX pathway was initially described in Bacillus cereus
  - source_id: PMID:12107130
    title: The 2-aminoethylphosphonate-specific transaminase of the 2-aminoethylphosphonate
      degradation pathway.
    statement: Purified Salmonella PhnW catalyzes AEP/pyruvate transamination and discriminates
      against alternative substrates. This supplies direct evidence for the first step, separately
      from inference for KT2440.
    supporting_text: Substrate specificity tests revealed a high degree of discrimination
  - source_id: PMID:9649311
    title: Insights into the mechanism of catalysis by the P-C bond-cleaving enzyme
      phosphonoacetaldehyde hydrolase derived from gene sequence analysis and mutagenesis.
    statement: Recombinant Salmonella and Bacillus phosphonatases establish hydrolytic C-P cleavage
      and a shared catalytic mechanism across the two bacterial lineages.
    supporting_text: The kinetic properties of the purified, recombinant phosphonatases were
      determined.
  - source_id: PMID:37876809
    title: Deciphering the role of recurrent FAD-dependent enzymes in bacterial phosphonate
      catabolism.
    statement: Some bacterial pathways generate phosphonoacetaldehyde through a FAD-dependent
      oxidoreductase instead of PhnW. Thus a PhnX homolog alone does not establish this PhnWX
      module.
    supporting_text: they surrogate the role of PhnW in organisms that do not possess the
      transaminase
notes: >-
  The bacterial taxonomic envelope covers the sampled Bacillota (Bacillus cereus) and Pseudomonadota (Salmonella
  typhimurium and Pseudomonas putida), without asserting universal pathway retention. Each step has a
  narrow verified PANTHER subfamily and representatives from both phyla. Salmonella PhnW and Salmonella/Bacillus
  PhnX provide direct biochemical anchors; the KT2440 proteins and Bacillus PhnW remain distinguished
  as homology-supported exemplars. Q8RLU1 is a probable fragment with a sequence caution, not an experimentally
  established intact Bacillus PhnW. Neither phosphate-starvation regulation nor a particular transporter
  is a defining component: regulatory wiring differs among studied strains. PhnWAY, oxidative AEP deamination
  and broad-substrate C-P lyase routes remain outside this two-reaction PhnWX boundary. PbfD-mediated
  PAA formation explains why phnX presence alone is insufficient to infer PhnWX. The KT2440-specific experimental
  and regulatory gaps below remain open.
