knowledge_gaps:
  - gap_statement: >-
      The KT2440 PhnW and PhnX proteins have not been directly assayed for the
      two reactions represented here.
    boundary: >-
      Direct pathway activity has been measured in other Pseudomonas putida
      strains, while the KT2440 realization is supported by exact family,
      reaction, and gene-neighborhood evidence.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Distinguishes direct pathway evidence in the species from inference for the KT2440 proteins.
    resolution: Purify Q88KT0 and Q88KT1 for coupled and individual enzyme assays, then test matched deletion strains.
    provenance:
      - reference_id: PMID:9841125
        supporting_text: "phosphonoacetaldehyde hydrolase (phosphonatase) activities which were inducible"
  - gap_statement: The transporter responsible for 2-aminoethylphosphonate uptake in KT2440 is unresolved.
    boundary: Transport is intentionally excluded from this two-reaction degradation module.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    significance: Uptake is required for pathway operation in vivo but cannot yet be assigned to a KT2440 gene.
    resolution: Combine transporter knockout screening with radiolabeled or mass-spectrometric 2-aminoethylphosphonate uptake assays.
    provenance:
      - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__2-aminoethylphosphonate-degradation-by-phnwx__ppu00440-deep-research-openscientist.md
        supporting_text: "No AepXVW/AepP/AepSTU ortholog is annotated by name in KT2440."
  - gap_statement: PP_2210 is only a candidate AepR-like regulator of the adjacent KT2440 phnWX genes.
    boundary: Regulation is outside the core reaction module and no direct KT2440 regulator-promoter test was found.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    significance: Prevents transferring the experimentally established BIRD-1 AepR mechanism directly to KT2440.
    resolution: Test PP_2210 deletion and complementation with phnWX promoter reporters across substrate and nutrient-limitation conditions.
    provenance:
      - reference_id: PMID:35229442
        supporting_text: "Mutation of a LysR-type regulator, termed AepR, upstream of the 2AEP"
