knowledge_gaps:
  - gap_statement: >-
      The kinase that acts on STA-1, and the biochemical basis of the link
      from SID-3 to STA-1, are unknown. No direct SID-3-STA-1 interaction or
      SID-3-dependent STA-1 phosphorylation has been shown.
    boundary: >-
      Genetic placement of SID-3 upstream of STA-1 rests on overlapping
      derepressed gene sets and ChIP enrichment. SID-3 is also required
      separately for an early pre-replication step of Orsay virus infection
      (viral entry). The low viral load in sid-3 mutants therefore does not
      by itself show that SID-3 signals to STA-1.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the STA-1 variant is a true kinase-to-STAT signaling
      relay or two parallel requirements for viral permissivity.
    resolution: >-
      Test SID-3 phosphorylation of STA-1 Y588 in vitro and in vivo, and
      STA-1 phosphorylation and nuclear retention in sid-3 kinase-dead
      animals.
    provenance:
      - reference_id: PMID:42427644
        supporting_text: >-
          C. elegans lacks homologs to mammalian JAK tyrosine kinases and it is
          not clear which kinase performs analogous functions in
          phosphorylating STA-1.
  - gap_statement: >-
      How STA-2 is activated downstream of the p38 MAPK cascade and SNF-12 is
      unknown. No STA-2 post-translational modification or PMK-1 substrate
      link has been reported. STA-2 binding sites in AMP gene promoters have
      not been mapped.
    boundary: >-
      Epistasis places the TPA-1/TIR-1/p38 cassette upstream of STA-2, and
      STA-2 binds SNF-12 and MUP-4. The step between these inputs and STA-2
      transcriptional activity is not characterized.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This is the central mechanistic difference from canonical STAT
      activation by tyrosine phosphorylation, and it remains unexplained.
    resolution: >-
      Phosphoproteomics of STA-2 after infection, STA-2 ChIP-seq in infected
      and wounded epidermis, and structure-function mapping of the SNF-12 and
      MUP-4 binding surfaces.
    provenance:
      - reference_id: PMID:21575913
        supporting_text: >-
          These findings reveal an unorthodox mode of regulation for a STAT
          factor
      - reference_id: PMID:26716073
        supporting_text: >-
          It is still not clear how p38 MAPK-dependent STA-2 activation and
          trafficking are regulated in C. elegans epidermis.
  - gap_statement: >-
      It is not known whether the PIAS SUMO ligase GEI-17, or any SOCS-,
      phosphatase- or PIAS-type negative regulator, acts on STA-1 or STA-2.
    boundary: >-
      GEI-17 is the only worm PIAS. Its GO:0046426 IBA (negative regulation
      of receptor signaling pathway via JAK-STAT) is a lineage-inappropriate
      transfer. No cached primary paper shows GEI-17 acting on either worm
      STAT, so the canonical negative-regulation layer is left out of this
      module.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Whether worm STATs keep the conserved PIAS-STAT interaction even though
      JAK signaling was lost.
    resolution: >-
      Test GEI-17 binding to and SUMOylation of STA-1 and STA-2, and test the
      effect of gei-17 loss on STA-1 target derepression and nlp-29 induction.
    provenance:
      - reference_id: PMID:28874466
        supporting_text: >-
          despite the fact that both upstream and downstream genes in the
          pathway are not conserved in mammals and C. elegans
  - gap_statement: >-
      Preprint evidence suggests that the RIG-I-like sensor DRH-1 interacts
      with STA-1 in cytoplasmic puncta during infection and may restrain it.
      Peer-reviewed confirmation and the functional significance are lacking.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would supply the missing infection-sensing input that relieves STA-1
      repression.
    resolution: >-
      Peer-reviewed replication; test whether drh-1 loss blocks STA-1 nuclear
      exit and target derepression in infected cells.
    provenance:
      - reference_id: PMID:42427644
        supporting_text: >-
          During viral infection, STA-1 forms cytoplasmic puncta that interact
          with the RNA viral sensor DRH-1, suggesting that DRH-1 helps restrain
          this immune-repressive factor.
