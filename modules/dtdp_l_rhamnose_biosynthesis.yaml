id: MODULE:dtdp_l_rhamnose_biosynthesis
title: dTDP-L-rhamnose biosynthesis
description: >-
  Species-neutral bacterial module for synthesis of the activated sugar
  dTDP-L-rhamnose from alpha-D-glucose 1-phosphate. The pathway proceeds
  through dTDP-glucose formation, dTDP-glucose 4,6-dehydration,
  dTDP-4-dehydrorhamnose 3,5-epimerization, and final NADPH-dependent
  reduction to dTDP-L-rhamnose. The module represents the soluble
  nucleotide-sugar supply pathway and treats downstream O-antigen, LPS, and
  specialized-polysaccharide assembly reactions as consumers, not as part of
  the biosynthetic module itself.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0019305
    title: dTDP-rhamnose biosynthetic process
    statement: >-
      GO:0019305 is the process term for the whole RmlABCD route and is accepted on every member gene
      review used as an exemplar here (E. coli K-12 RfbA/RfbB/RfbC/RfbD and P. putida KT2440
      RfbA/RffG/RfbC/RmlC/RfbD).
  - source_id: PMID:11697907
    title: >-
      Kinetic and crystallographic analyses support a sequential-ordered bi bi catalytic mechanism for
      Escherichia coli glucose-1-phosphate thymidylyltransferase.
    statement: >-
      Establishes RmlA as the first enzyme of dTDP-L-rhamnose biosynthesis, condensing dTTP and
      glucose 1-phosphate, from kinetics and crystal structures of the E. coli K-12 enzyme.
  - source_id: PMID:7517391
    title: Structure of the O antigen of Escherichia coli K-12 and the sequence of its rfb gene cluster.
    statement: >-
      The K-12 rfb cluster carries the four rhamnose-pathway genes rfbBDAC, and the O16 repeat unit
      contains alpha-L-rhamnose transferred by a separate rhamnosyltransferase, which sets the module's
      downstream boundary.
  - source_id: KEGG:ppu00523
    title: Pseudomonas putida KT2440 polyketide sugar unit biosynthesis bucket
    statement: >-
      The KT2440 ppu00523 batch contains rmlC, PP_0500, rfbC and rfbD and also pulls in the adjacent
      rfbA/rffG early-step genes from ppu00525.
  - source_id: KEGG:ppu00525
    title: Pseudomonas putida KT2440 acarbose/validamycin bucket
    statement: >-
      The ppu00525 bucket contributes the dTDP-glucose formation and dTDP-glucose 4,6-dehydration steps
      in KT2440, rather than a literal acarbose or validamycin pathway.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__dtdp_l_rhamnose_biosynthesis__ppu00523-deep-research-openscientist.md
    title: OpenScientist module, pathway, and taxon review
    statement: >-
      The combined ppu00523/ppu00525 candidate set covers all four canonical reactions through the
      PP_1782-PP_1785 cluster. PP_0265 is a supported extra RmlC-family epimerase, whereas the in-vivo
      substrate and pathway assignment of the orphan RmlD-family paralog PP_0500 remain uncertain.
notes: >-
  Scope and generalization: the RmlABCD route is conserved across Bacteria (Proteobacteria, Firmicutes,
  Actinobacteria, Cyanobacteria and others) and RmlC/RmlD homologs occur in some archaea, so the module
  is written species-neutrally and grounded to PANTHER families and bacterial PAINT nodes, with E. coli
  K-12 (experimentally characterised RfbA; rfb O16 cluster) and P. putida KT2440 (PP_1782-PP_1785
  rfbC-rfbA-rfbD-rffG cluster plus the extra RmlC paralog PP_0265) as exemplars. Plants make
  UDP-L-rhamnose with trifunctional RHM enzymes instead and are outside this module. Representative
  members are exemplars, not simultaneously required pathway components. The KT2440 RmlD-like paralog
  PP_0500 lacks the NCBIfam TIGR01214 rmlD model and has no established substrate, so it is not used
  as an exemplar. Downstream O-antigen, LPS, capsule and secondary-metabolite assembly are product-use
  context outside the module boundary; the member gene reviews mark propagated polymer-level process
  terms (polysaccharide, LPS and O-antigen biosynthesis) as over-annotations of these precursor-supply
  enzymes. Location (cytosol, accepted on every member review) is omitted from this reusable reaction
  module because it adds no pathway discrimination. Family-function QC: PTHR43000 is a heterogeneous
  NAD(P)-dependent epimerase/dehydratase superfamily whose review leaves GO:0008460 UNRESOLVED at family
  scope while assessing the bacterial RmlB/RffG node PTN000042046 as SOUND, so the module keeps the
  verified PANTHER id for membership and cites that node; the resulting FAMILY_FUNCTION_UNREVIEWED
  warning is expected.
module:
