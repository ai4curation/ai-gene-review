              term:
                id: GO:0008879
                label: glucose-1-phosphate thymidylyltransferase activity
              substrates:
                - preferred_term: dTTP
                - preferred_term: alpha-D-glucose 1-phosphate
              products:
                - preferred_term: dTDP-alpha-D-glucose
                - preferred_term: diphosphate
              evidence:
                - source_id: PMID:11697907
                  statement: >-
                    Kinetics and crystal structures of E. coli K-12 RfbA establish glucose-1-phosphate thymidylyltransferase activity; accepted in genes/ECOLI/rfbA and genes/PSEPK/rfbA reviews.
            processes:
              - preferred_term: dTDP-rhamnose biosynthetic process
                term:
                  id: GO:0019305
                  label: dTDP-rhamnose biosynthetic process
            role_description: >-
              Activates glucose 1-phosphate as dTDP-glucose for downstream
              deoxy-sugar conversion.
    - order: 2
