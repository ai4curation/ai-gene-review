        label: dTDP-rhamnose biosynthetic process
      description: >-
        Biosynthesis of dTDP-L-rhamnose from alpha-D-glucose 1-phosphate via
        dTDP-glucose and 4-keto deoxy intermediates.
  context:
    taxa:
