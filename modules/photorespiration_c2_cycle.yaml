knowledge_gaps:
  - gap_statement: >-
      The carriers that move glycine into and serine out of mitochondria, and most other
      transporters for photorespiratory intermediates, have not been assigned at the molecular
      level in the sources cited here. The 2010 review states that most photorespiratory
      transporters were unidentified; PLGG1 (2013) is the first core transporter with
      demonstrated glycolate/glycerate transport.
    boundary: >-
      Transport steps other than PLGG1 are not modelled as parts until carriers with transport
      assays and photorespiratory mutant phenotypes are identified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Each unassigned carrier is a step the module cannot ground in a gene product.
    provenance:
      - reference_id: PMID:22303256
        supporting_text: most transporters have not been identified or even biochemically characterized in detail
      - reference_id: PMID:23382251
        supporting_text: no transporter required for the core photorespiratory cycle has been identified at the molecular level to date
