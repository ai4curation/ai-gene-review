        label: Photorespiratory ammonia refixation (GS2 and Fd-GOGAT)
        module_type: METABOLIC_PATHWAY
        description: >-
          NH3 released by glycine decarboxylase is reassimilated in the chloroplast by the
          plastidic glutamine synthetase (GS2) and ferredoxin-dependent glutamate synthase
          (Fd-GOGAT), producing the glutamate that the peroxisomal glyoxylate transamination
          consumes. Of the two Arabidopsis Fd-GOGAT genes only GLU1 mutants (gls) are
          photorespiratory.
