id: MODULE:photorespiration_c2_cycle
title: Photorespiratory C2 cycle (2-phosphoglycolate to 3-phosphoglycerate) in land plants
description: >-
  The photorespiratory C2 cycle salvages 2-phosphoglycolate, the two-carbon product of the
  oxygenase reaction of ribulose-1,5-bisphosphate carboxylase/oxygenase (Rubisco), and returns
  three of every four carbons to the Calvin-Benson cycle as 3-phosphoglycerate. The pathway
  runs through three organelles. In the chloroplast, 2-phosphoglycolate phosphatase
  dephosphorylates 2-phosphoglycolate to glycolate, which the inner-envelope
  glycolate/glycerate translocator exports. In the peroxisome, glycolate oxidase oxidizes
  glycolate to glyoxylate with O2, generating H2O2 that catalase removes, and glyoxylate is
  transaminated to glycine, mainly by glutamate:glyoxylate aminotransferase. In the
  mitochondrion, the glycine decarboxylase (glycine cleavage) complex converts one glycine to
  CO2, NH3 and 5,10-methylenetetrahydrofolate, and serine hydroxymethyltransferase uses the
  one-carbon unit and a second glycine to make serine. Back in the peroxisome, serine:glyoxylate
  aminotransferase converts serine to hydroxypyruvate while aminating a second glyoxylate, and
  hydroxypyruvate reductase reduces hydroxypyruvate to glycerate; a cytosolic hydroxypyruvate
  reductase provides a bypass. In the chloroplast, D-glycerate 3-kinase phosphorylates glycerate
  to 3-phosphoglycerate. The NH3 released in the mitochondrion is refixed in the chloroplast by
  plastidic glutamine synthetase and ferredoxin-dependent glutamate synthase, which return the
  glutamate used by the glyoxylate transamination. Loss of most core steps makes plants unable
  to grow in normal air but viable at elevated CO2. The Rubisco oxygenase reaction itself, the
  Calvin-Benson cycle, the transporters for the other intermediates (largely unidentified),
  supply of NADH to the peroxisome, alternative glycolate routes in algae and cyanobacteria,
  and C4 or CAM carbon-concentrating mechanisms are outside this module's boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009853
    title: photorespiration
    statement: The module is grounded in the GO biological process term for photorespiration.
  - source_id: PMID:22303256
    title: Photorespiration.
    statement: Review of the Arabidopsis photorespiratory pathway, which converts
      2-phosphoglycolate to 3-phosphoglycerate; most pathway components were identified in
      Arabidopsis.
    supporting_text: >-
      In this chapter, we describe the biochemical pathway that converts the vast amount of
      2-phosphoglycolate (PG) to 3-phosphoglycerate (PGA). The pathway components were mainly
      identified by molecular and biochemical studies in Arabidopsis.
  - source_id: PMID:23382251
    title: PLGG1, a plastidic glycolate glycerate transporter, is required for photorespiration
      and defines a unique class of metabolite transporters.
    statement: Photorespiration is compartmentalized, with enzymatic reactions in chloroplasts,
      peroxisomes, mitochondria and the cytosol.
    supporting_text: >-
      Although photorespiration is a compartmentalized process with enzymatic reactions in the
      chloroplast, the peroxisomes, the mitochondria, and the cytosol
  - source_id: PMID:15980259
    title: D-GLYCERATE 3-KINASE, the last unknown enzyme in the photorespiratory cycle in
      Arabidopsis, belongs to a novel kinase family.
    statement: The C2 cycle is an indispensable ancillary pathway to the C3 cycle in an
      oxygen-containing atmosphere.
    supporting_text: >-
      the photorespiratory C2 cycle, an indispensable ancillary metabolic pathway to the
      photosynthetic C3 cycle that enables land plants to grow in an oxygen-containing atmosphere
notes: >-
  Arabidopsis thaliana proteins are used as representative members; the module itself is
  phrased for land plants. Every Arabidopsis representative, and the glycine decarboxylase
  subunits named in step 5 (GLDP1, GLDP2, GDCH, GDCST, mtLPD1, mtLPD2), has a gene review under
  genes/ARATH/, and each annoton molecular function matches a core function of the
  corresponding review. Photorespiration (GO:0009853) is the process term for every step,
  matching the GOA experimental rows and the gene reviews' core functions; GO:0009854 oxidative
  photosynthetic carbon pathway, its child, is accepted in the reviews where GOA carries it but
  is not used here, so that the carbon-cycle steps, catalase and ammonia refixation share one
  term. GO:0008891 glycolate oxidase activity is obsolete, so the glycolate oxidase step uses
  its parent GO:0003973 (S)-2-hydroxy-acid oxidase activity, which is the term UniProt assigns
  to GLO1 and GLO2. The glycine decarboxylase step reuses the glycine_cleavage_system module by
  reference; its Arabidopsis subunits are named in that node's description. No PANTHER family
  ids are asserted: they have not been checked against interpro/panther/panther.obo for these
  families. Paralogs not listed (GLU2, the other PGLP, GOX and CAT genes) are not modelled. No
  production GO-CAM in gocams/index.tsv contains these Arabidopsis gene products.
module:
  id: photorespiration_c2_cycle
  label: Photorespiratory C2 cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: photorespiration
      term:
        id: GO:0009853
        label: photorespiration
      description: Salvage of 2-phosphoglycolate to 3-phosphoglycerate across chloroplast,
        peroxisome and mitochondrion, with release of CO2 and NH3.
  context:
    taxa:
      - preferred_term: land plants
        term:
          id: NCBITaxon:3193
          label: Embryophyta
        description: The glycolate oxidase-based, peroxisome-dependent C2 cycle described here is
          characterized in land plants; many green algae and cyanobacteria oxidize glycolate with
          a glycolate dehydrogenase instead.
  parts:
    - order: 1
      role: dephosphorylation of 2-phosphoglycolate in the chloroplast
      node:
        id: pglp_step
        label: 2-Phosphoglycolate phosphatase (PGLP1)
        module_type: REACTION
        annotons:
          - id: pglp_activity
            label: "PGLP1: 2-phosphoglycolate phosphatase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: plastid photorespiratory 2-phosphoglycolate phosphatase
                representative_members:
                  - preferred_term: PGLP1 (Arabidopsis; At5g36700)
                    term:
                      id: UniProtKB:P0DKC3
                      label: Phosphoglycolate phosphatase 1A, chloroplastic
            function:
              preferred_term: phosphoglycolate phosphatase activity
              term:
                id: GO:0008967
                label: phosphoglycolate phosphatase activity
              substrates:
                - preferred_term: 2-phosphoglycolate
              products:
                - preferred_term: glycolate
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:14369
                  statement: 2-phosphoglycolate + H2O = glycolate + phosphate (EC 3.1.3.18).
                - source_id: PMID:17478634
                  statement: Recombinant AtPGLP1 has PGLP activity; the knockout has very low leaf
                    PGLP activity and is unviable in normal air but grows in 0.9% CO2.
                  supporting_text: >-
                    These combined data establish At5g36700 as the gene encoding the
                    photorespiratory PGLP, PGLP1.
            processes:
              - preferred_term: photorespiration
                term:
                  id: GO:0009853
                  label: photorespiration
            locations:
              - preferred_term: chloroplast
                term:
                  id: GO:0009507
                  label: chloroplast
            role_description: Entry reaction of the cycle; removes 2-phosphoglycolate, which
              inhibits Calvin-Benson cycle enzymes.
    - order: 2
      role: glycolate export from the chloroplast (and glycerate import)
      node:
        id: plgg_transport_step
        label: Plastidic glycolate/glycerate translocator (PLGG1)
        module_type: REACTION
        annotons:
          - id: plgg1_transport
            label: "PLGG1: glycolate/glycerate translocator"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LrgB-like plastidic glycolate/glycerate translocator
                representative_members:
                  - preferred_term: PLGG1 (Arabidopsis; At1g32080)
                    term:
                      id: UniProtKB:Q9FVQ4
                      label: Plastidal glycolate/glycerate translocator 1, chloroplastic
            function:
              preferred_term: glycolate transmembrane transporter activity
              term:
                id: GO:0043879
                label: glycolate transmembrane transporter activity
              substrates:
                - preferred_term: glycolate (stroma to cytosol)
              evidence:
                - source_id: PMID:23382251
                  statement: The plgg1 mutant accumulates glycolate and glycerate and needs high
                    CO2; transport assays support glycolate/glycerate transport.
                  supporting_text: >-
                    Our results indicate that PLGG1 is the chloroplastidic glycolate/glycerate
                    transporter, which is required for the function of the photorespiratory cycle.
            processes:
              - preferred_term: photorespiration
                term:
                  id: GO:0009853
                  label: photorespiration
            locations:
              - preferred_term: chloroplast inner membrane
                term:
                  id: GO:0009706
                  label: chloroplast inner membrane
            role_description: The same translocator imports glycerate for the final kinase step
              (glycerate transmembrane transporter activity, GO:1901974). The dicarboxylate
              translocators DiT1/DiT2 that exchange 2-oxoglutarate and glutamate for the ammonia
              refixation step are not modelled.
    - order: 3
      role: peroxisomal oxidation of glycolate to glyoxylate and removal of H2O2
      node:
        id: glycolate_oxidation_step
        label: Glycolate oxidase (GOX) and catalase (CAT2)
        module_type: METABOLIC_PATHWAY
        description: >-
          Glycolate oxidase, an FMN-dependent (S)-2-hydroxy-acid oxidase, uses O2 to oxidize
          glycolate to glyoxylate and produces H2O2; peroxisomal catalase disproportionates the
          H2O2. In Arabidopsis two co-regulated leaf genes, GOX1 and GOX2, are redundant enough
          that no glycolate oxidase mutant was found in the classical photorespiratory screens.
        parts:
          - order: 1
            role: glycolate oxidation
            node:
              id: gox_step
              label: Glycolate oxidase (GOX1/GOX2)
              module_type: REACTION
              annotons:
                - id: gox_activity
                  label: "GOX1/GOX2: glycolate oxidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: peroxisomal glycolate oxidase
                      representative_members:
                        - preferred_term: GLO1/GOX1 (Arabidopsis; At3g14420)
                          term:
                            id: UniProtKB:Q9LRR9
                            label: Glycolate oxidase 1
                        - preferred_term: GLO2/GOX2 (Arabidopsis; At3g14415)
                          term:
                            id: UniProtKB:Q9LRS0
                            label: Glycolate oxidase 2
                  function:
                    preferred_term: (S)-2-hydroxy-acid oxidase activity
                    term:
                      id: GO:0003973
                      label: (S)-2-hydroxy-acid oxidase activity
                    substrates:
                      - preferred_term: glycolate
                      - preferred_term: O2
                    products:
                      - preferred_term: glyoxylate
                      - preferred_term: H2O2
                    evidence:
                      - source_id: RHEA:25311
                        statement: glycolate + O2 = glyoxylate + H2O2 (EC 1.1.3.15).
                      - source_id: PMID:22303256
                        statement: Glycolate oxidase oxidizes glycolate to glyoxylate and produces
                          H2O2; two Arabidopsis genes are co-regulated with photorespiratory genes.
                        supporting_text: >-
                          Two of these genes (At3g14415 and At3g14420) are transcriptionally
                          co-regulated with other photorespiratory genes
                  processes:
                    - preferred_term: photorespiration
                      term:
                        id: GO:0009853
                        label: photorespiration
                  locations:
                    - preferred_term: peroxisome
                      term:
                        id: GO:0005777
                        label: peroxisome
                  notes: GO:0008891 glycolate oxidase activity is obsolete; the parent
                    (S)-2-hydroxy-acid oxidase term is used.
          - order: 2
            role: decomposition of photorespiratory H2O2
            node:
              id: catalase_step
              label: Catalase (CAT2)
              module_type: REACTION
              annotons:
                - id: cat2_activity
                  label: "CAT2: catalase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: peroxisomal monofunctional catalase
                      representative_members:
                        - preferred_term: CAT2 (Arabidopsis; At4g35090)
                          term:
                            id: UniProtKB:P25819
                            label: Catalase-2
                  function:
                    preferred_term: catalase activity
                    term:
                      id: GO:0004096
                      label: catalase activity
                    substrates:
                      - preferred_term: H2O2 (x2)
                    products:
                      - preferred_term: O2
                      - preferred_term: H2O (x2)
                    evidence:
                      - source_id: RHEA:20309
                        statement: 2 H2O2 = O2 + 2 H2O (EC 1.11.1.6).
                      - source_id: PMID:22303256
                        statement: Of the three Arabidopsis catalase genes, CAT2 encodes the major
                          photorespiratory enzyme.
                        supporting_text: >-
                          In Arabidopsis, three catalase genes are known, but only one gene ( Cat
                          2, At4g35090) encodes the major enzyme involved in photorespiration.
                  processes:
                    - preferred_term: photorespiration
                      term:
                        id: GO:0009853
                        label: photorespiration
                  locations:
                    - preferred_term: peroxisome
                      term:
                        id: GO:0005777
                        label: peroxisome
                  role_description: Ancillary detoxification step; cat2 mutants show high-CO2
                    reversible growth and redox phenotypes in air.
        connections:
          - source: gox_step
            target: catalase_step
            connection_type: PRECEDES
    - order: 4
      role: transamination of glyoxylate to glycine with glutamate
      node:
        id: ggat_step
        label: Glutamate:glyoxylate aminotransferase (GGAT1)
        module_type: REACTION
        annotons:
          - id: ggat_activity
            label: "GGAT1: glutamate:glyoxylate aminotransferase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: peroxisomal alanine aminotransferase-like GGAT
                representative_members:
                  - preferred_term: GGAT1/AOAT1 (Arabidopsis; At1g23310)
                    term:
                      id: UniProtKB:Q9LR30
                      label: Glutamate--glyoxylate aminotransferase 1
                  - preferred_term: GGAT2/AOAT2 (Arabidopsis; At1g70580)
                    term:
                      id: UniProtKB:Q9S7E9
                      label: Glutamate--glyoxylate aminotransferase 2
            function:
              preferred_term: glycine:2-oxoglutarate transaminase activity
              term:
                id: GO:0047958
                label: glycine:2-oxoglutarate transaminase activity
              substrates:
                - preferred_term: glyoxylate
                - preferred_term: L-glutamate
              products:
                - preferred_term: glycine
                - preferred_term: 2-oxoglutarate
              evidence:
                - source_id: RHEA:14089
                  statement: glycine + 2-oxoglutarate = glyoxylate + L-glutamate (EC 2.6.1.4); the
                    photorespiratory direction is glyoxylate to glycine.
                - source_id: PMID:12631323
                  statement: AOAT1 is a peroxisomal PTS1 protein; leaf GGAT activity is drastically
                    reduced in the aoat1-1 knockout.
                  supporting_text: >-
                    Here, we report that an alanine:2-oxoglutarate aminotransferase (AOAT)-like
                    protein functions as GGAT in peroxisomes.
            processes:
              - preferred_term: photorespiration
                term:
                  id: GO:0009853
                  label: photorespiration
            locations:
              - preferred_term: peroxisome
                term:
                  id: GO:0005777
                  label: peroxisome
            role_description: GGAT1 knockouts have a weak photorespiratory phenotype, with residual
              activity from GGAT2; serine:glyoxylate aminotransferase (step 7) aminates the other
              half of the glyoxylate.
    - order: 5
      role: mitochondrial glycine decarboxylation
      node:
        id: glycine_decarboxylation_step
        label: Glycine decarboxylase complex (P, H, T and L proteins)
        description: >-
          Glycine is oxidatively decarboxylated and deaminated to CO2, NH3, NADH and
          5,10-methylenetetrahydrofolate. In Arabidopsis the P protein is encoded by GLDP1
          (UniProtKB:Q94B78) and GLDP2 (UniProtKB:O80988), which are redundant; the H and T
          proteins include GDCH (UniProtKB:P25855) and GDCST (UniProtKB:O65396). The leaf L
          protein is mainly mitochondrial LPD1 (mtLPD1, At1g48030, UniProtKB:Q9M5K3); the
          paralog mtLPD2 (At3g17240, UniProtKB:Q9M5K2) is thought to serve chiefly the
          2-oxoacid dehydrogenase complexes, although the two are presumed interchangeable in
          the matrix. Loss of both P-protein genes is lethal even at high CO2, because the
          complex is also required for one-carbon metabolism.
        module_ref: glycine_cleavage_system
        evidence:
          - source_id: PMID:17496108
            statement: GLDP1/GLDP2 double knockouts do not develop beyond cotyledons even in 0.9%
              CO2.
            supporting_text: >-
              the double mutant does not develop beyond the cotyledon stage in air enriched with
              0.9% CO(2)
          - source_id: PMID:11598235
            statement: mtLPD1 is proposed as the GDC-associated L protein and mtLPD2 as the
              2-oxoacid dehydrogenase E3, from organ- and light-dependent expression.
            supporting_text: >-
              we hypothesize that mtLPD1 encodes the protein most often associated with the Gly
              decarboxylase complex, and mtLPD2 encodes the protein incorporated into
              alpha-ketoacid dehydrogenase complexes
          - source_id: PMID:38861078
            statement: Photosynthesizing tissue needs large amounts of mtLPD1 for glycine
              decarboxylase.
            supporting_text: >-
              in illuminated, photosynthesizing tissue a vast amount of mtLPD1 is necessary for
              glycine decarboxylase (GDC), the key enzyme of photorespiration
          - source_id: PMID:32311173
            statement: Leaf GDC contains about four times more GCS-L1 (mtLPD1) than GCS-L2, and
              four times more GCS-P1 than GCS-P2.
            supporting_text: >-
              The Arabidopsis GDC contains four times more of the isoforms GCS-P1 and GCS-L1 in
              comparison with GCS-P2 and GCS-L2, respectively
          - source_id: PMID:41990722
            statement: Mutant analysis shows both mtLPDs contribute to photorespiration, with
              mtLPD1 predominant.
            supporting_text: >-
              While the two mtLPDs both contribute to photorespiration, mtLPD1 plays a more
              predominant role, especially under high-light stress.
    - order: 6
      role: mitochondrial serine formation from glycine and methylene-THF
      node:
        id: shmt_step
        label: Serine hydroxymethyltransferase (SHM1)
        module_type: REACTION
        annotons:
          - id: shm1_activity
            label: "SHM1: mitochondrial serine hydroxymethyltransferase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: mitochondrial serine hydroxymethyltransferase
                representative_members:
                  - preferred_term: SHM1/SHMT1 (Arabidopsis; At4g37930)
                    term:
                      id: UniProtKB:Q9SZJ5
                      label: Serine hydroxymethyltransferase 1, mitochondrial
            function:
              preferred_term: glycine hydroxymethyltransferase activity
              term:
                id: GO:0004372
                label: glycine hydroxymethyltransferase activity
              substrates:
                - preferred_term: glycine
                - preferred_term: 5,10-methylenetetrahydrofolate
                - preferred_term: H2O
              products:
                - preferred_term: L-serine
                - preferred_term: tetrahydrofolate
              evidence:
                - source_id: RHEA:15481
                  statement: (6R)-5,10-methylene-THF + glycine + H2O = (6S)-THF + L-serine (EC
                    2.1.2.1); the photorespiratory direction forms serine.
                - source_id: PMID:16339799
                  statement: The shm1 mutant lacks mitochondrial SHMT activity and is lethal in air
                    but unaffected at elevated CO2; SHM1 expression rescues it.
                  supporting_text: >-
                    is defective in mitochondrial SHMT activity and displays a lethal photorespiratory
                    phenotype when grown at ambient CO2, but is virtually unaffected at elevated CO2
            processes:
              - preferred_term: photorespiration
                term:
                  id: GO:0009853
                  label: photorespiration
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
    - order: 7
      role: transamination of serine to hydroxypyruvate with glyoxylate
      node:
        id: sgat_step
        label: Serine:glyoxylate aminotransferase (SGAT/AGT1)
        module_type: REACTION
        annotons:
          - id: sgat_activity
            label: "SGAT/AGT1: serine:glyoxylate aminotransferase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: class V aminotransferase serine:glyoxylate aminotransferase
                representative_members:
                  - preferred_term: AGT1/SGAT (Arabidopsis; At2g13360)
                    term:
                      id: UniProtKB:Q56YA5
                      label: Serine--glyoxylate aminotransferase
            function:
              preferred_term: L-serine:glyoxylate transaminase activity
              term:
                id: GO:0050281
                label: L-serine:glyoxylate transaminase activity
              substrates:
                - preferred_term: L-serine
                - preferred_term: glyoxylate
              products:
                - preferred_term: 3-hydroxypyruvate
                - preferred_term: glycine
              evidence:
                - source_id: RHEA:19125
                  statement: glyoxylate + L-serine = 3-hydroxypyruvate + glycine (EC 2.6.1.45).
                - source_id: PMID:11309139
                  statement: Recombinant AGT1 is most active with serine:glyoxylate, localizes to
                    peroxisomes, and carries the lesion of the photorespiratory sat mutants.
                  supporting_text: >-
                    AGT1 had the highest specific activity with the serine : glyoxylate
                    transamination, and apparent Km measurements indicate that this is the
                    preferred in vivo reaction.
                - source_id: PMID:22303256
                  statement: SGAT is a single gene whose deletion makes plants unviable in normal
                    air.
                  supporting_text: >-
                    In Arabidopsis, SGAT is encoded by a single gene (At2g13360) and its deletion
                    results in plants that are unviable under normal atmospheric conditions
            processes:
              - preferred_term: photorespiration
                term:
                  id: GO:0009853
                  label: photorespiration
            locations:
              - preferred_term: peroxisome
                term:
                  id: GO:0005777
                  label: peroxisome
            role_description: Supplies the second amino group for glycine formation, which keeps
              the nitrogen stoichiometry of the cycle closed.
    - order: 8
      role: reduction of hydroxypyruvate to glycerate
      node:
        id: hpr_step
        label: Hydroxypyruvate reductase (HPR1, with cytosolic HPR2 bypass)
        module_type: REACTION
        variant_sets:
          - id: hpr_compartment_variants
            label: Hydroxypyruvate reduction routes
            axis: compartment
            selection: ONE_OR_MORE
            notes: >-
              Single hpr1 mutants are only mildly affected in air, whereas hpr1 hpr2 double
              mutants are air-sensitive, so the peroxisomal and cytosolic reductases act in
              parallel.
            variants:
              - id: peroxisomal_hpr1_variant
                label: Peroxisomal NADH-dependent hydroxypyruvate reductase (HPR1)
                module_type: REACTION
                annotons:
                  - id: hpr1_activity
                    label: "HPR1: peroxisomal hydroxypyruvate reductase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: peroxisomal hydroxypyruvate reductase
                        representative_members:
                          - preferred_term: HPR1 (Arabidopsis; At1g68010)
                            term:
                              id: UniProtKB:Q9C9W5
                              label: Glycerate dehydrogenase HPR, peroxisomal
                    function:
                      preferred_term: hydroxypyruvate reductase (NADH) activity
                      term:
                        id: GO:0008465
                        label: hydroxypyruvate reductase (NADH) activity
                      substrates:
                        - preferred_term: 3-hydroxypyruvate
                        - preferred_term: NADH
                      products:
                        - preferred_term: (R)-glycerate
                        - preferred_term: NAD+
                      evidence:
                        - source_id: RHEA:17905
                          statement: (R)-glycerate + NAD+ = 3-hydroxypyruvate + NADH + H+ (EC
                            1.1.1.29); the photorespiratory direction forms glycerate.
                        - source_id: PMID:22303256
                          statement: HPR1 catalyses the peroxisomal NADH-dependent reduction of
                            hydroxypyruvate.
                          supporting_text: >-
                            In Arabidopsis, the peroxisomal reaction is catalyzed by HPR1
                            (At1g68010) using NADH as a co-factor
                    processes:
                      - preferred_term: photorespiration
                        term:
                          id: GO:0009853
                          label: photorespiration
                    locations:
                      - preferred_term: peroxisome
                        term:
                          id: GO:0005777
                          label: peroxisome
              - id: cytosolic_hpr2_variant
                label: Cytosolic NADPH-dependent hydroxypyruvate reductase (HPR2) bypass
                module_type: REACTION
                annotons:
                  - id: hpr2_activity
                    label: "HPR2: cytosolic hydroxypyruvate reductase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: cytosolic glyoxylate/hydroxypyruvate reductase
                        representative_members:
                          - preferred_term: HPR2 (Arabidopsis; At1g79870)
                            term:
                              id: UniProtKB:Q9CA90
                              label: Glyoxylate/hydroxypyruvate reductase A HPR2
                    function:
                      preferred_term: hydroxypyruvate reductase [NAD(P)H] activity
                      term:
                        id: GO:0016618
                        label: hydroxypyruvate reductase [NAD(P)H] activity
                      substrates:
                        - preferred_term: 3-hydroxypyruvate
                        - preferred_term: NADPH
                      products:
                        - preferred_term: (R)-glycerate
                        - preferred_term: NADP+
                      evidence:
                        - source_id: PMID:18952776
                          statement: HPR2 provides a cytosolic bypass; hpr1 hpr2 double mutants
                            are air-sensitive.
                          supporting_text: >-
                            We have identified a second hydroxypyruvate reductase, HPR2, and
                            present genetic and biochemical evidence that the enzyme provides a
                            cytosolic bypass to the photorespiratory core cycle
                    processes:
                      - preferred_term: photorespiration
                        term:
                          id: GO:0009853
                          label: photorespiration
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
    - order: 9
      role: phosphorylation of glycerate to 3-phosphoglycerate in the chloroplast
      node:
        id: glyk_step
        label: D-Glycerate 3-kinase (GLYK)
        module_type: REACTION
        annotons:
          - id: glyk_activity
            label: "GLYK: D-glycerate 3-kinase"
            participant:
