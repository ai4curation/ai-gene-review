                        term:
                          id: InterPro:IPR004535
                          label: Translation elongation factor SelB
                        representative_members:
                          - preferred_term: SelB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88QJ7
                              label: Selenocysteyl-tRNA-specific translation elongation factor
