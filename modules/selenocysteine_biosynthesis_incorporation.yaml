                    target: eefsec_delivery
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      SECISBP2-dependent mRNP assembly supplies the recoding
                      context used during EEFSEC delivery.
  connections:
    - source: selenophosphate_synthesis
      target: sec_trna_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: Selenophosphate supplies selenium to either Sec-tRNA synthesis route.
      chaining_status: VERIFIED
      chaining_note: >-
        Rhea 18737 product is consumed by Rhea 22728 or Rhea 25041.
    - source: ser_trna_sec_synthesis
      target: sec_trna_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: SerS supplies Ser-tRNA(Sec) to either conversion route.
      chaining_status: VERIFIED
      chaining_note: >-
        Rhea 42580 product is consumed directly by SelA or first by PSTK.
    - source: sec_trna_synthesis
      target: sec_codon_recoding
      connection_type: PROVIDES_INPUT_FOR
      description: Completed Sec-tRNA(Sec) is the substrate delivered during UGA recoding.
      chaining_status: VERIFIED
      chaining_note: Both conversion variants produce L-selenocysteinyl-tRNA(Sec).
  knowledge_gaps:
    - gap_statement: >-
        Archaea use PSTK and SepSecS chemistry but have a distinct
        selenocysteine-recoding implementation that is not modeled here.
      boundary: >-
        Treat this module as bacterial plus eukaryotic. Add a separately
        researched archaeal insertion variant before broadening the title to
        all three domains of life.
      gap_kind:
        - BIOLOGY
        - CURATION
