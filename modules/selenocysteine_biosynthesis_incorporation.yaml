                    target: sepsecs_sec_trna_formation
                    connection_type: PROVIDES_INPUT_FOR
                    description: PSTK produces the phosphoseryl-tRNA consumed by SepSecS.
                    chaining_status: VERIFIED
                    chaining_note: Rhea 25037 product matches the Rhea 25041 substrate.
    - order: 4
