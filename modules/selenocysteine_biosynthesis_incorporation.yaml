        label: Alternative selenocysteine insertion systems
        module_type: BIOLOGICAL_PROCESS
        variant_sets:
          - id: sec_insertion_system
            label: Selenocysteine-specific translation machinery
            axis: taxonomic implementation
            selection: EXACTLY_ONE
            variants:
