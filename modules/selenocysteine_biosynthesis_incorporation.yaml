                              - source_id: file:human/PSTK/PSTK-ai-review.yaml
                                statement: >-
                                  The completed review accepts GO:0043915 for
                                  UniProtKB:Q8IV42.
                          role_description: Produces the SepSecS substrate.
                  - order: 2
                    role: phosphoseryl-tRNA(Sec) selenium transfer
                    node:
                      id: sepsecs_sec_trna_formation
                      label: SepSecS-dependent Sec-tRNA(Sec) formation
                      module_type: REACTION
                      annotons:
                        - id: sepsecs_activity
                          label: SepSecS phosphoseryl-tRNA(Sec) selenium transferase activity
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: SepSecS family
                              term:
                                id: PANTHER:PTHR12944
                                label: SOLUBLE LIVER ANTIGEN/LIVER PANCREAS ANTIGEN
                              representative_members:
                                - preferred_term: SEPSECS (human)
                                  term:
                                    id: UniProtKB:Q9HD40
                                    label: O-phosphoseryl-tRNA(Sec) selenium transferase
                          function:
                            preferred_term: O-phosphoseryl-tRNA(Sec) selenium transferase activity
                            term:
                              id: GO:0098621
                              label: O-phosphoseryl-tRNA(Sec) selenium transferase activity
