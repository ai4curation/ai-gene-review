id: MODULE:selenocysteine_biosynthesis_incorporation
title: Bacterial and eukaryotic selenocysteine biosynthesis and co-translational incorporation
description: >-
  A reusable module for the bacterial and eukaryotic synthesis of
  selenocysteyl-tRNA(Sec) and recoding of UGA as selenocysteine.
  Selenophosphate synthetase activates selenium, and seryl-tRNA synthetase
  charges tRNA(Sec) with serine. Bacteria convert Ser-tRNA(Sec) directly with
  SelA, whereas the represented eukaryotic route first phosphorylates it with
  PSTK and then uses SepSecS. The completed Sec-tRNA(Sec) is delivered by a
  lineage-specific elongation system to a UGA codon in a SECIS-dependent
  translation context.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0016260
    title: L-selenocysteine biosynthetic process
    statement: >-
      GO:0016260 captures activated selenium production and synthesis of
      selenocysteyl-tRNA(Sec).
  - source_id: GO:0001514
    title: selenocysteine incorporation
    statement: >-
      GO:0001514 captures specialized co-translational insertion of
      selenocysteine at recoded UGA codons.
  - source_id: file:modules/selenocysteine_biosynthesis_incorporation-deep-research-openscientist.md
    title: OpenScientist review of selenocysteine biosynthesis and incorporation
    statement: >-
      The reusable-module review supports the ordered tRNA-dependent synthesis
      route and distinguishes the bacterial SelA/SelB implementation from the
      represented eukaryotic PSTK-SepSecS and SECISBP2-EEFSEC implementation.
  - source_id: file:PSEPK/selD/selD-uniprot.txt
    title: UniProtKB entry for PSEPK SelD
    statement: >-
      P59392 is a reviewed selenophosphate synthetase assigned Rhea 18737.
  - source_id: file:PSEPK/serS/serS-uniprot.txt
    title: UniProtKB entry for PSEPK SerS
    statement: >-
      Q88FT2 is a reviewed serine-tRNA ligase with the tRNA(Sec)-specific
      charging reaction Rhea 42580.
  - source_id: file:PSEPK/selA/selA-uniprot.txt
    title: UniProtKB entry for PSEPK SelA
    statement: >-
      Q88QJ8 is a reviewed bacterial L-seryl-tRNA(Sec) selenium transferase
      assigned Rhea 22728.
  - source_id: file:PSEPK/selB/selB-uniprot.txt
    title: UniProtKB entry for PSEPK SelB
    statement: >-
      Q88QJ7 is a selenocysteyl-tRNA-specific translation elongation factor.
notes: >-
  This revision generalizes the previous human-only document while preserving
  its curated eukaryotic route. The shared SerS and selenophosphate steps are
  modeled once. SelA versus PSTK/SepSecS and SelB versus
  SECISBP2/EEFSEC are explicit implementation variants. Archaeal Sec-tRNA
  synthesis overlaps the PSTK-SepSecS chemistry, but archaeal recoding
  machinery is not represented, so the module title is explicitly limited to
  bacteria and eukaryotes. tRNA(Sec) and SECIS RNA elements are required
  non-protein substrates/context, not missing gene parts. Selenium uptake,
  selenide production, tRNA transcription and maturation, ribosome biogenesis,
  and downstream selenoprotein function are outside the boundary.
module:
  id: selenocysteine_biosynthesis_incorporation
  label: Bacterial and eukaryotic selenocysteine biosynthesis and incorporation
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: L-selenocysteine biosynthetic process
      term:
        id: GO:0016260
        label: L-selenocysteine biosynthetic process
      description: Synthesis of Sec on its cognate tRNA.
    - preferred_term: selenocysteine incorporation
      term:
        id: GO:0001514
        label: selenocysteine incorporation
      description: SECIS-dependent recoding and delivery of Sec-tRNA(Sec).
  parts:
    - order: 1
      role: activated selenium donor production
      node:
        id: selenophosphate_synthesis
        label: Selenophosphate synthesis
        module_type: REACTION
        annotons:
          - id: seld_sephs_activity
            label: SelD/SEPHS2 selenide, water dikinase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: selenophosphate synthetase family
                term:
                  id: PANTHER:PTHR10256
                  label: SELENIDE, WATER DIKINASE
                representative_members:
                  - preferred_term: SelD (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:P59392
                      label: Selenide, water dikinase
                  - preferred_term: SEPHS2 (human)
                    term:
                      id: UniProtKB:Q99611
                      label: Selenide, water dikinase 2
            function:
              preferred_term: selenide, water dikinase activity
              term:
                id: GO:0004756
                label: selenide, water dikinase activity
              substrates:
                - preferred_term: hydrogenselenide
                - preferred_term: ATP
                - preferred_term: water
              products:
                - preferred_term: selenophosphate
                - preferred_term: AMP
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:18737
                  title: selenide, water dikinase reaction
                  statement: >-
                    Rhea 18737 defines ATP-dependent formation of
                    selenophosphate from hydrogenselenide.
                - source_id: file:PSEPK/selD/selD-uniprot.txt
                  statement: P59392 carries EC 2.7.9.3 and Rhea 18737.
                - source_id: file:human/SEPHS2/SEPHS2-ai-review.yaml
                  statement: >-
                    The completed human review accepts GO:0004756 for
                    UniProtKB:Q99611.
            processes:
              - preferred_term: L-selenocysteine biosynthetic process
                term:
                  id: GO:0016260
                  label: L-selenocysteine biosynthetic process
            role_description: Supplies the activated selenium donor for Sec-tRNA synthesis.
    - order: 2
      role: tRNA(Sec) aminoacylation with serine
      node:
        id: ser_trna_sec_synthesis
        label: Ser-tRNA(Sec) synthesis
        module_type: REACTION
        annotons:
          - id: sers_activity
            label: SerS/SARS serine-tRNA ligase activity on tRNA(Sec)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: seryl-tRNA synthetase family
                term:
                  id: PANTHER:PTHR43697
                  label: SERYL-TRNA SYNTHETASE
                family_terms:
                  - id: PANTHER:PTHR43697
                    label: SERYL-TRNA SYNTHETASE
                  - id: PANTHER:PTHR11778
                    label: SERYL-TRNA SYNTHETASE 1
                description: >-
                  Bacterial SerS proteins and eukaryotic cytoplasmic SARS1
                  proteins occupy separate PANTHER families but catalyze the
                  shared Ser-tRNA(Sec) synthesis step.
                representative_members:
                  - preferred_term: SerS (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FT2
                      label: Serine--tRNA ligase
                  - preferred_term: SARS1 (human)
                    term:
                      id: UniProtKB:P49591
                      label: Serine--tRNA ligase, cytoplasmic
            function:
              preferred_term: serine-tRNA ligase activity
              term:
                id: GO:0004828
                label: serine-tRNA ligase activity
              substrates:
                - preferred_term: tRNA(Sec)
                - preferred_term: L-serine
                - preferred_term: ATP
              products:
                - preferred_term: L-seryl-tRNA(Sec)
                - preferred_term: AMP
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:42580
                  title: tRNA(Sec) seryl-aminoacylation reaction
                  statement: >-
                    Rhea 42580 specifically defines formation of
                    L-seryl-tRNA(Sec).
                - source_id: file:PSEPK/serS/serS-uniprot.txt
                  statement: Q88FT2 carries the tRNA(Sec)-specific Rhea reaction.
            processes:
              - preferred_term: L-selenocysteine biosynthetic process
                term:
                  id: GO:0016260
                  label: L-selenocysteine biosynthetic process
            role_description: Produces the common Ser-tRNA(Sec) pathway intermediate.
    - order: 3
      role: conversion of Ser-tRNA(Sec) to Sec-tRNA(Sec)
      node:
        id: sec_trna_synthesis
        label: Alternative Sec-tRNA(Sec) synthesis routes
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: sec_trna_route
            label: Ser-tRNA(Sec) conversion route
            axis: taxonomic implementation
            selection: EXACTLY_ONE
            variants:
              - id: bacterial_sela_route
