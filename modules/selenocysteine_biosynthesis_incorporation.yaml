                        term:
                          id: InterPro:IPR004535
                          label: Translation elongation factor SelB
                        representative_members:
                          - preferred_term: SelB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88QJ7
                              label: Selenocysteyl-tRNA-specific translation elongation factor
                    function:
                      preferred_term: translation elongation factor activity
                      term:
                        id: GO:0003746
                        label: translation elongation factor activity
                      substrates:
