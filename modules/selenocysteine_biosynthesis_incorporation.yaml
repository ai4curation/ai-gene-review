                          title: bacterial Sec synthase reaction
                          statement: >-
                            Rhea 22728 defines direct SelA-dependent conversion
                            of Ser-tRNA(Sec) to Sec-tRNA(Sec).
                        - source_id: file:PSEPK/selA/selA-uniprot.txt
                          statement: Q88QJ8 carries EC 2.9.1.1 and Rhea 22728.
                    processes:
                      - preferred_term: conversion of seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec)
                        term:
                          id: GO:0001717
                          label: conversion of seryl-tRNAsec to selenocys-tRNAsec
                    role_description: Performs the one-step bacterial conversion.
              - id: eukaryal_pstk_sepsecs_route
                label: Eukaryotic PSTK-SepSecS route
                module_type: METABOLIC_PATHWAY
                context:
                  taxa:
                    - preferred_term: eukaryotes
                      term:
                        id: NCBITaxon:2759
                        label: Eukaryota
                parts:
                  - order: 1
                    role: Ser-tRNA(Sec) phosphorylation
                    node:
                      id: pstk_phosphoseryl_trna_formation
                      label: PSTK-dependent phosphoseryl-tRNA(Sec) formation
                      module_type: REACTION
                      annotons:
                        - id: pstk_activity
