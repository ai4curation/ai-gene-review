id: MODULE:bacterial_chromosomal_dna_replication
title: Bacterial chromosomal DNA replication
description: >-
  Reusable bacterial chromosome-replication module spanning origin initiation,
  fork unwinding and single-strand protection, RNA priming, DNA polymerase III
  synthesis and proofreading, sliding-clamp processivity, clamp loading, and
  Okazaki-fragment ligation. Verified Pseudomonas putida and Escherichia coli
  exemplars ground the conserved activities and complexes without restricting
  the module to either species.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006260
    title: DNA replication
    statement: Grounds chromosome duplication by the bacterial replisome.
  - source_id: KEGG:ppu03030
    title: Pseudomonas putida KT2440 DNA replication
    statement: Identifies the PSEPK replisome realization.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_chromosomal_dna_replication__ppu03030-deep-research-openscientist.md
    title: OpenScientist PSEPK chromosomal DNA-replication pathway review
    statement: >-
      The species-aware report finds all seven modeled parts satisfiable,
      supports HolA, HolB, and HolC in the DnaX-containing clamp loader, and
      distinguishes three non-core exonuclease/helicase candidates from the
      authentic replisome.
notes: >-
  The module models the conserved chromosome-replication mechanism rather than
  every protein in the broad KEGG map. DNA polymerase I gap filling, RNase H,
  repair exonucleases, and DNA ligase B are adjacent replication/repair
  activities outside the focused replisome realization. Molecular functions are
  attached only to leaf annotons. The loader's psi assignment at PP_0978 and
  the presence or absence of a theta subunit remain uncertain and are not
  asserted as exact exemplars. OpenScientist proposed PP_1552 as a DnaC
  helicase loader, but current UniProt and local metadata instead identify
  Q88ML9 as an unnamed phage replication protein; no exact DnaC, DnaI, or DciA
  exemplar is therefore asserted.
