- id: PMID:41255390
  title: Indole-containing inhibitors with improved efficacy targeting the gyrase of Mycobacterium tuberculosis.
  findings:
  - statement: The study explicitly identifies both full-length H37Rv target accessions.
    supporting_text: encoding each full-length gyrase subunit (UniProt accession numbers P9WG47 and P9WG45,
      respectively).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text explicitly names full-length H37Rv P9WG47 and P9WG45 in pET28a constructs.
      His-affinity purification is reported without tag removal. Supercoiling and ATPase inhibition assays
