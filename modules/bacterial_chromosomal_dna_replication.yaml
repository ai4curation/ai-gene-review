id: MODULE:bacterial_chromosomal_dna_replication
title: Bacterial chromosomal DNA replication
description: >-
  Reusable bacterial chromosome-replication module spanning origin initiation,
  fork unwinding and single-strand protection, RNA priming, DNA polymerase III
  synthesis and proofreading, sliding-clamp processivity, clamp loading, and
  Okazaki-fragment ligation. Exact Pseudomonas putida exemplars ground the
  conserved activities and complexes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006260
    title: DNA replication
    statement: Grounds chromosome duplication by the bacterial replisome.
  - source_id: KEGG:ppu03030
    title: Pseudomonas putida KT2440 DNA replication
    statement: Identifies the PSEPK replisome realization.
notes: >-
  The module models the conserved chromosome-replication mechanism rather than
  every protein in the broad KEGG map. DNA polymerase I gap filling, RNase H,
  repair exonucleases, and DNA ligase B are adjacent replication/repair
  activities outside the focused replisome realization. Molecular functions are
  attached only to catalytic leaf annotons.
module:
  id: bacterial_chromosomal_dna_replication
  label: Bacterial chromosomal DNA replication
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: DNA replication
      term:
        id: GO:0006260
        label: DNA replication
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: replication initiation at the chromosomal origin
      node:
        id: dnaa_origin_initiation
        label: DnaA-dependent origin opening
        module_type: REGULATORY_STEP
        annotons:
          - id: dnaa_initiator
            label: DnaA replication initiator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DnaA family
                term:
                  id: PANTHER:PTHR30050
                  label: CHROMOSOMAL REPLICATION INITIATOR PROTEIN DNAA
                representative_members:
                  - preferred_term: PSEPK DnaA exemplar
                    term:
                      id: UniProtKB:P0A116
                      label: Chromosomal replication initiator protein DnaA
            role_description: Recognizes the chromosomal origin and promotes local duplex opening.
    - order: 2
      role: fork unwinding and single-strand protection
      node:
        id: fork_unwinding_protection
        label: DnaB helicase and SSB expose and protect templates
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: dnab_helicase
            label: DnaB replicative helicase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DnaB helicase family
                representative_members:
                  - preferred_term: PSEPK DnaB exemplar
                    term:
                      id: UniProtKB:Q88DF2
                      label: Replicative DNA helicase DnaB
            function:
              preferred_term: DNA helicase activity
              term:
                id: GO:0003678
                label: DNA helicase activity
            role_description: Unwinds parental duplex DNA at the replication fork.
          - id: ssb_template_protection
            label: SSB single-strand protection
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial single-stranded DNA-binding protein family
                representative_members:
                  - preferred_term: PSEPK SSB exemplar
                    term:
                      id: UniProtKB:Q88QK5
                      label: Single-stranded DNA-binding protein
            role_description: Coats exposed single-stranded templates and prevents secondary structure.
    - order: 3
      role: RNA primer synthesis
      node:
        id: dnag_priming
        label: DnaG primer synthesis
        module_type: REACTION
        annotons:
          - id: dnag_primase
            label: DnaG primase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DnaG primase family
                representative_members:
                  - preferred_term: PSEPK DnaG exemplar
                    term:
                      id: UniProtKB:P0A118
                      label: DNA primase DnaG
            function:
              preferred_term: DNA-directed RNA polymerase activity
              term:
                id: GO:0003899
                label: DNA-directed RNA polymerase activity
            role_description: Synthesizes RNA primers for leading- and lagging-strand DNA synthesis.
    - order: 4
      role: processive DNA synthesis and proofreading
      node:
        id: poliii_core_synthesis
        label: DNA polymerase III alpha-epsilon core
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: dnaea_polymerase
            label: DNA polymerase III alpha subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DNA polymerase III alpha family
                representative_members:
                  - preferred_term: PSEPK DnaE alpha exemplar
                    term:
                      id: UniProtKB:Q88MG5
                      label: DNA polymerase III subunit alpha
            function:
              preferred_term: DNA polymerase activity
              term:
                id: GO:0034061
                label: DNA polymerase activity
            role_description: Extends DNA primers using the template strand.
          - id: dnaq_proofreading
            label: DNA polymerase III epsilon subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DnaQ proofreading exonuclease family
                representative_members:
                  - preferred_term: PSEPK DnaQ exemplar
                    term:
                      id: UniProtKB:Q88FF6
                      label: DNA polymerase III subunit epsilon
            function:
              preferred_term: 3'-5' exonuclease activity
              term:
                id: GO:0008408
                label: 3'-5' exonuclease activity
            role_description: Proofreads newly synthesized DNA within the polymerase III core.
    - order: 5
      role: sliding-clamp processivity
      node:
        id: beta_clamp_processivity
        label: DnaN beta sliding clamp
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: dnan_sliding_clamp
            label: DnaN beta clamp
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DNA polymerase III beta-clamp family
                term:
                  id: PANTHER:PTHR30478
                  label: DNA POLYMERASE III SUBUNIT BETA
                representative_members:
                  - preferred_term: PSEPK DnaN exemplar
                    term:
                      id: UniProtKB:P0A120
                      label: DNA polymerase III beta sliding clamp
            role_description: Encircles DNA and tethers polymerase for processive synthesis.
    - order: 6
      role: clamp loading and replisome coupling
      node:
        id: clamp_loader_activity
        label: DnaX clamp-loader ATPase
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: dnax_clamp_loader
            label: DnaX tau/gamma clamp-loader subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial DnaX clamp-loader family
                representative_members:
                  - preferred_term: PSEPK DnaX exemplar
                    term:
                      id: UniProtKB:Q88F30
                      label: DNA polymerase III subunit gamma/tau
            role_description: Uses ATP to coordinate clamp loading and couple polymerase cores at the fork.
    - order: 7
      role: Okazaki-fragment nick sealing
      node:
        id: liga_nick_sealing
        label: LigA-dependent DNA ligation
        module_type: REACTION
        annotons:
          - id: liga_activity
            label: NAD-dependent DNA ligase LigA
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial NAD-dependent DNA ligase family
                representative_members:
                  - preferred_term: PSEPK LigA exemplar
                    term:
                      id: UniProtKB:Q88F25
                      label: DNA ligase LigA
            function:
              preferred_term: DNA ligase (NAD+) activity
              term:
                id: GO:0003911
                label: DNA ligase (NAD+) activity
            role_description: Seals remaining nicks after lagging-strand primer replacement.
  connections:
    - source: dnaa_origin_initiation
      target: fork_unwinding_protection
      connection_type: PRECEDES
    - source: fork_unwinding_protection
      target: dnag_priming
      connection_type: PRECEDES
    - source: dnag_priming
      target: poliii_core_synthesis
      connection_type: PROVIDES_INPUT_FOR
    - source: beta_clamp_processivity
      target: poliii_core_synthesis
      connection_type: PART_OF
    - source: clamp_loader_activity
      target: beta_clamp_processivity
      connection_type: CAUSES
    - source: poliii_core_synthesis
      target: liga_nick_sealing
      connection_type: PRECEDES
