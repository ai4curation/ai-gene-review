- id: PMID:14717711
  title: Crystal structure of the chi:psi sub-assembly of the Escherichia coli DNA polymerase clamp-loader
    complex.
  findings:
  - statement: The E. coli chi-psi heterodimer bridges SSB with the clamp loader; this is complex-level
      bridging evidence for the HolC adaptor role.
    supporting_text: In E. coli, the chi:psi heterodimer serves as a bridge between the clamp-loader complex
      and the single-stranded DNA-binding protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Direct E. coli chi-psi structure and SSB-site mapping support
      bridging; the flexible psi linkage/docking geometry is a model. This source does not prove each
      isolated subunit is an autonomous clamp loader or establish the precise KT2440 assembly.
- id: PMID:17210572
  title: A function for the psi subunit in loading the Escherichia coli DNA polymerase sliding clamp.
  findings:
  - statement: Comparative psi mechanism supports stabilization of the ATP-induced DNA-binding loader
      state.
    supporting_text: 'The

      psi subunit is important for stabilizing an ATP-induced conformational state

      with high affinity for DNA'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Comparisons of gamma3-delta-delta-prime loaders with psi
      and chi show psi-dependent stabilization of an ATP-induced DNA-binding state. Chi is dispensable
      for the measured reaction without SSB. This is E. coli comparative mechanism evidence for KT2440
      HolD, not direct target activity or universal physiological dispensability.
- id: PMID:15047530
  title: 'Mycobacterium tuberculosis DNA gyrase: interaction with quinolones and correlation with antimycobacterial
    drug activity.'
  findings:
  - statement: Supercoiling requires the reconstituted GyrA/GyrB enzyme.
    supporting_text: Neither subunit alone induced DNA supercoiling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text. Recombinant GyrA and GyrB came from cosmid T776; drug susceptibility
      used H37Rv. GyrA has a C-terminal hexahistidine tag and GyrB an N-terminal decahistidine tag. Reconstitution
      directly establishes partner-dependent supercoiling. This study does not itself measure native chromosome
      segregation.
- id: PMID:17038336
  title: The key DNA-binding residues in the C-terminal domain of Mycobacterium tuberculosis DNA gyrase
    A subunit (GyrA).
  findings:
  - statement: Both assayed genes derive from H37Rv genomic DNA.
    supporting_text: The gyrA and gyrB genes were both amplified from the genomic DNA from M.tuberculosis
      H37Rv, and ligated to pET20b and pET32a, respectively.
  - statement: Wild-type H37Rv gyrase directly decatenates the kDNA substrate in the mutant comparison.
    supporting_text: However, lowering gyrase concentration to 0.01 μM, mutants of D669A, R691A, G729A
      and R745A showed no decatenation activity, whereas the wild-type enzyme and E514A still had (Figure
      8C).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text explicitly identifies H37Rv genomic templates and sequencing identical
      to NC000962. His-tagged recombinant proteins were assayed; no tag removal is reported. Fig8 directly
      compares kDNA decatenation by wild-type GyrA/GyrB and GyrA mutants. Fig9 measures ATP hydrolysis
      of assembled A2B2 variants, not isolated GyrA ATPase. The text has inconsistent G729A/G729W naming;
      this review does not annotate that mutant residue or equate it to the wild-type target.
- id: PMID:21745817
  title: 'The dimer state of GyrB is an active form: implications for the initial complex assembly and
    processive strand passage.'
  findings:
  - statement: M. tuberculosis GyrB exhibits a monomer-dimer equilibrium relevant to assembly with GyrA.
    supporting_text: These results indicate that M. tuberculosis GyrB alone exists as a monomer–dimer
      equilibrium in solution and this equilibrium process is slow
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text distinguishes isolated GyrB monomer/dimer preparations, assembly with
