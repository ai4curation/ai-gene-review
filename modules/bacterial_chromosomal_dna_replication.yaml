                      source-strain limits.
                term:
                  id: PANTHER:PTHR30050:SF8
                  label: PRIMOSOMAL PROTEIN DNAI
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
            role_description: ATPase activity participates in functional helicase loading; the family
              and native-origin recruitment role are required in addition to ATP hydrolysis.
            evidence:
            - source_id: PMID:12718886
              title: A two-protein strategy for the functional loading of a cellular replicative DNA helicase.
              statement: Bacillus DnaI and DnaB cooperate in functional delivery of the DnaC helicase
                onto DNA.
              supporting_text: 'We show that DnaI and DnaB interact physically and functionally

                with the DnaC helicase and mediate its functional delivery onto DNA.'
            - source_id: PMID:19968790
              title: Ordered association of helicase loader proteins with the Bacillus subtilis origin
                of replication in vivo.
              statement: Bacillus origin recruitment proceeds through ordered DnaA, DnaD and DnaB association
                followed by DnaI-mediated helicase loading.
              supporting_text: 'We found that there was

                a clear order of stable association with oriC; DnaA, DnaD, DnaB, and finally

                DnaI-mediated loading of helicase.'
            - source_id: PMID:17003052
              title: Helicase binding to DnaI exposes a cryptic DNA-binding site during helicase loading
                in Bacillus subtilis.
              statement: DnaI directly binds and hydrolyzes ATP; this chemistry is distinct from the complete
                cooperative loading reaction.
              supporting_text: DnaI binds ATP and exhibits ATPase activity that is not stimulated by ssDNA
          notes: DnaA precedes DnaD, DnaB and DnaI-dependent recruitment. The Bacillus helicase is named
            DnaC. Do not equate a restart-substrate reconstitution with oriC initiation.
