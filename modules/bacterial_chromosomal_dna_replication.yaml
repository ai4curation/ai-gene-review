                  label: DciA
            function:
              preferred_term: replicative DNA helicase loader activity
            role_description: Vibrio Q9KPH3 matches the assayed 157-residue protein and deposited 9TZF
              entity2. Loading is tested on a fork with a streptavidin-blocked 5-prime ssDNA end; not
              a covalently closed circle.
            evidence:
            - source_id: PMID:42927770
              title: Structural basis of DnaB ring opening by the ancestral helicase loader DciA.
              statement: Vibrio DciA promotes topological helicase loading; the intact protein is more
                effective than its isolated domains.
              supporting_text: Under these conditions, full-length DciA supported efficient duplex unwinding,
                whereas the isolated C-terminal fragment was completely inactive
            - source_id: PMID:42927770
              title: Structural basis of DnaB ring opening by the ancestral helicase loader DciA.
              statement: DciA stabilizes an open DnaB hexamer, providing a structural mechanism for DNA
                loading.
              supporting_text: 'A 3.5 Å cryo-EM structure reveals a DnaB6·DciA3

                complex in which DciA binds the periphery of the helicase and stabilizes a

                right-handed open-helical conformation with a single cracked interface.'
            - source_id: PMID:27830752
              title: DciA is an ancestral replicative helicase operator essential for bacterial replication
                initiation.
              statement: P. aeruginosa DciA is implicated in replicative-helicase operation during initiation.
              supporting_text: 'We validate this

                hypothesis by establishing in Pseudomonas aeruginosa that DciA possesses the

                attributes of the replicative helicase-operating proteins associated with

                replication initiation.'
          notes: The 2016 PAO1 native genetics supports a DciA-dependent route but is not an exact Q9KPH3
            assay. No verified KT2440 DciA representative is asserted.
