                  limits.
            - preferred_term: dnaA (Bacillus subtilis subsp. subtilis str. 168)
              term:
                id: UniProtKB:P05648
                label: Chromosomal replication initiator protein DnaA
              evidence:
              - source_id: file:genes/BACSU/dnaA/dnaA-ai-review.yaml
                statement: Individual review separates molecular activity, complex contribution and source-strain
                  limits.
            term:
              id: PANTHER:PTHR30050:SF2
              label: CHROMOSOMAL REPLICATION INITIATOR PROTEIN DNAA
        function:
          preferred_term: DNA replication origin binding
          term:
            id: GO:0003688
            label: DNA replication origin binding
        role_description: ATP-bound DnaA recognizes oriC and promotes local opening with lineage-specific
          partners; origin binding alone is not a complete initiation apparatus.
        evidence:
        - source_id: PMID:42133467
          title: Mechanisms of chromosomal DNA replication in Escherichia coli and Bacillus subtilis.
          statement: ATP-bound DnaA promotes origin strand opening with nucleoid-associated factors in
            the two model bacteria.
          supporting_text: together with nucleoid-associated proteins, recognizes and “melts” parental
            DNA strands at oriC to initiate DNA replication
    order: 1
  - role: Replicative helicase loading
    node:
      id: replicative_helicase_loading
      label: Replicative helicase loading
      module_type: BIOLOGICAL_PROCESS
      evidence:
      - source_id: PMID:36877032
        title: Diverse Mechanisms of Helicase Loading during DNA Replication Initiation in Bacteria.
        statement: A non-ATPase DciA implementation provides an alternative to DnaC/DnaI-type loading.
        supporting_text: 'DciA is

          not an ATPase, and yet it serves as a helicase operator, providing a function

          analogous to that of DnaC and DnaI across diverse bacterial species.'
      variant_sets:
      - id: replicative_helicase_loading_alternatives
        label: Replicative helicase loading implementations
        axis: lineage-specific loading architecture
        variant_kind: ROUTE
        selection: ONE_OR_MORE
        variants:
        - id: dnac_helicase_loading
          label: DnaC-dependent helicase loading
          module_type: MOLECULAR_FUNCTION
          annotons:
          - id: dnac_helicase_loading_activity
            label: DnaC-dependent helicase loading
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DnaC helicase loaders
                representative_members:
                - preferred_term: dnaC (Escherichia coli K-12)
                  term:
                    id: UniProtKB:P0AEF0
                    label: Replicative helicase loader DnaC
                  evidence:
                  - source_id: file:genes/ECOLI/dnaC/dnaC-ai-review.yaml
                    statement: Individual review separates molecular activity, complex contribution and
                      source-strain limits.
                term:
                  id: PANTHER:PTHR30050:SF9
                  label: DNA REPLICATION PROTEIN DNAC
            function:
              preferred_term: replicative DNA helicase loader activity
            role_description: Loads and remodels DnaB rings. The gene review proposes the loader activity
              because no exact GO activity is asserted.
            evidence:
            - source_id: PMID:23562643
              title: The bacterial DnaC helicase loader is a DnaB ring breaker.
              statement: E. coli DnaC opens the DnaB ring and can load it onto DNA.
              supporting_text: 'the DnaC isolated

                helicase-binding domain can both load DnaB onto DNA and increase the efficiency

                by which the helicase acts on substrates in vitro.'
            - source_id: PMID:30797687
              title: Physical Basis for the Loading of a Bacterial Replicative Helicase onto DNA.
              statement: DnaC ATP hydrolysis after DNA binding permits closure of the helicase into a
                primase-compatible state.
              supporting_text: 'Upon binding DNA, DnaC hydrolyzes ATP, allowing DnaB to

                isomerize into a topologically closed, pre-translocation state competent to bind

                primase.'
        - id: bacillus_helicase_loading
          label: Bacillus DnaD-DnaB-DnaI loading route
          module_type: BIOLOGICAL_PROCESS
          annotons:
          - id: dnad_origin_recruitment
            label: DnaD origin recognition
