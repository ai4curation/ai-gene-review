- id: PMID:22844097
  title: The role of Ca²⁺ in the activity of Mycobacterium tuberculosis DNA gyrase.
  findings:
  - statement: The mutant retains decatenation while losing supercoiling, separating the two activities.
    supporting_text: The quadruple mutant displays normal relaxation and decatenation activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text uses the earlier PMID17038336 preparations with modifications. Wild-type
      and mutant kDNA decatenation are functional results; calcium regulation is proposed and does not
      establish native physiological regulation. Calcium depletion is not evidence for direct magnesium
      binding by GyrA.
- id: PMID:31953321
  title: Functional interactions between gyrase subunits are optimized in a species-specific manner.
  findings:
  - statement: Comparative assay conditions yield relatively low M. tuberculosis supercoiling and decatenation
      efficiency.
    supporting_text: 'M. tuberculosis gyrase

      hydrolyzes ATP only slowly and is a poor supercoiling enzyme and decatenase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache after a genuine force retry; PMC/Europe PMC/publisher full-text
      retrievals failed. Its primary comparative result explicitly calls M. tuberculosis gyrase a poor
      decatenase under the tested conditions. This qualifies claims of universally enhanced efficiency
