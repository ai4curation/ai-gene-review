                    statement: Individual review separates molecular activity, complex contribution and
                      source-strain limits.
                term:
                  id: PANTHER:PTHR37293:SF6
                  label: DNA REPLICATION PROTEIN DNAD
            function:
              preferred_term: DNA replication origin binding
              term:
                id: GO:0003688
                label: DNA replication origin binding
            role_description: Recognizes an oriC single-stranded element during recruitment.
            evidence:
            - source_id: PMID:37093985
              title: The DNA replication initiation protein DnaD recognises a specific strand of the Bacillus
                subtilis chromosome origin.
              statement: DnaD recognizes an oriC single-stranded element as part of the Bacillus loading
                architecture.
              supporting_text: 'Biochemical and genetic data support the model that DnaD recognizes a
                new

                single-stranded DNA (ssDNA) motif located in oriC, the DnaD Recognition Element

                (DRE).'
            - source_id: PMID:19968790
              title: Ordered association of helicase loader proteins with the Bacillus subtilis origin
                of replication in vivo.
              statement: Bacillus origin recruitment proceeds through ordered DnaA, DnaD and DnaB association
                followed by DnaI-mediated helicase loading.
              supporting_text: 'We found that there was

                a clear order of stable association with oriC; DnaA, DnaD, DnaB, and finally

                DnaI-mediated loading of helicase.'
          - id: dnab_loading_accessory
            label: Bacillus DnaB DNA-binding loading accessory
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Bacillus DnaB initiation accessory family
                representative_members:
                - preferred_term: dnaB (Bacillus subtilis subsp. subtilis str. 168)
                  term:
                    id: UniProtKB:P07908
                    label: Replicative helicase loading/DNA remodeling protein DnaB
                  evidence:
                  - source_id: file:genes/BACSU/dnaB/dnaB-ai-review.yaml
                    statement: Individual review separates molecular activity, complex contribution and
                      source-strain limits.
            function:
              preferred_term: DNA binding
              term:
                id: GO:0003677
                label: DNA binding
            role_description: Cooperates with DnaI in functional delivery of DnaC; not the DnaB helicase
              of E. coli.
            evidence:
            - source_id: PMID:12718886
              title: A two-protein strategy for the functional loading of a cellular replicative DNA helicase.
              statement: Bacillus DnaI and DnaB cooperate in functional delivery of the DnaC helicase
                onto DNA.
              supporting_text: 'We show that DnaI and DnaB interact physically and functionally

                with the DnaC helicase and mediate its functional delivery onto DNA.'
            - source_id: PMID:19968790
              title: Ordered association of helicase loader proteins with the Bacillus subtilis origin
                of replication in vivo.
              statement: Bacillus origin recruitment proceeds through ordered DnaA, DnaD and DnaB association
                followed by DnaI-mediated helicase loading.
              supporting_text: 'We found that there was

                a clear order of stable association with oriC; DnaA, DnaD, DnaB, and finally

                DnaI-mediated loading of helicase.'
          - id: dnai_loader
            label: DnaI helicase loader ATPase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DnaI helicase loaders
                representative_members:
                - preferred_term: dnaI (Bacillus subtilis subsp. subtilis str. 168)
                  term:
                    id: UniProtKB:P06567
                    label: Replicative helicase loader DnaI
                  evidence:
                  - source_id: file:genes/BACSU/dnaI/dnaI-ai-review.yaml
