id: MODULE:bacterial_chromosomal_dna_replication
title: Bacterial chromosomal DNA replication
description: Bacterial chromosome duplication coordinates origin recognition and helicase loading with
  template unwinding, protection and priming, replicative synthesis and proofreading, clamp-dependent
  processivity, RNA-primer replacement, nick sealing and topological separation. Alternative loader and
  polymerase architectures are grounded in Proteobacteria, Bacillota and Actinomycetota examples.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:22206257
  title: Architecture and conservation of the bacterial DNA replication machinery, an underexploited drug
    target.
  statement: The older review distinguishes widespread core replication machinery from lineage-restricted
    modules.
  supporting_text: Other modules are restricted to particular phylogenetic groups and are likely therefore
    to have evolved more recently
- source_id: PMID:41728957
  title: Diversity and distribution of bacterial DNA polymerases.
  statement: Three major replicative catalytic-subunit configurations are DnaE1 alone, PolC with DnaE1,
    and PolC with DnaE3.
  supporting_text: (i) DnaE1-only, (ii) PolC + DnaE1, and (iii) PolC + DnaE3
notes: The boundary is DnaA-initiated duplication with a circular-chromosome topology realization. Bacteria
  denotes reusable scope, not universal possession of every named enzyme. Missing representatives or unresolved
  physiological roles are gaps in this panel, not organismal absence. Every role must be evaluated within
  a compatible lineage; representatives from different species cannot be pooled to claim a native complete
  pathway. Domain or broad-family membership alone does not establish DnaE1/3 identity, PHP catalysis,
  cargo-independent assembly or a complete loader/topoisomerase. Tus/Rtp fork traps, dimer resolution
  and lesion bypass are conditional adjacent mechanisms. HolC/HolD and tau coupling are explicit contextual
  roles; their optional status does not assert physiological dispensability in each species. The former
  exclusion of primer replacement and the PP_0978 HolD assignment are superseded. No PP_1552 DnaC/DciA
  claim is retained.
module:
  id: bacterial_chromosomal_dna_replication
  label: Bacterial chromosomal DNA replication
