id: MODULE:mevalonate_pathway
title: Mevalonate pathway (acetyl-CoA -> isopentenyl diphosphate)
description: >-
  The eukaryotic (classical) mevalonate pathway converts acetyl-CoA into the
  universal five-carbon isoprenoid building block isopentenyl diphosphate (IPP),
  the precursor of sterols (cholesterol in animals, ergosterol in fungi),
  dolichol, ubiquinone (CoQ), heme A and the farnesyl/geranylgeranyl groups used
  for protein prenylation. A cytosolic acetoacetyl-CoA thiolase condenses two
  acetyl-CoA to acetoacetyl-CoA; HMG-CoA synthase adds a third acetyl-CoA to give
  3-hydroxy-3-methylglutaryl-CoA (HMG-CoA); HMG-CoA reductase, the rate-limiting,
  sterol-feedback-regulated enzyme and target of the statin drugs, reduces HMG-CoA
  to mevalonate with two NADPH on the endoplasmic-reticulum membrane; mevalonate
  kinase and phosphomevalonate kinase then doubly phosphorylate mevalonate to
  mevalonate 5-diphosphate; and diphosphomevalonate decarboxylase decarboxylates
  it to IPP in an ATP-dependent reaction. The reaction chain is conserved across
  animals, fungi and plants, but the phosphomevalonate kinase step is carried out
  by two unrelated protein families: a GHMP-kinase-type enzyme (ERG8 type) in
  fungi, plants and bacteria, and a small P-loop kinase (PMVK type) that
  displaced it early in animal evolution. Fungi may carry two HMG-CoA reductase
  isozymes (budding yeast HMG1 and HMG2). Mevalonate kinase is a second,
  metabolite-level control point, competitively feedback-inhibited by
  downstream prenyl diphosphates. In humans, inherited defects cause mevalonate
  kinase deficiency (MVK; hyper-IgD/periodic fever syndrome to mevalonic
  aciduria) and porokeratosis (MVD and MVK); HMGCR and HMGCS1 are pharmacologic
  (statin), autoimmune and rare-myopathy loci rather than classic enzymopathies.
status: DRAFT
scope: CONCRETE
references:
  - id: PMID:42754161
    title: Structural basis of mevalonate pathway regulation by feedback inhibition of
      mevalonate kinase.
    findings:
      - statement: >-
          Mevalonate kinase is a second regulatory node of the pathway (alongside the
          sterol-regulated HMGCR step): downstream isoprenoid pyrophosphates feedback-inhibit
          MVK, and the five known inhibitors (IPP, DMAPP, GPP, FPP, GGPP) compete for one
          shared site despite spanning C5-C20.
        supporting_text: >-
          Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
          in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
          as feedback inhibitors.
evidence:
  - source_id: GO:0019287
    title: "isopentenyl diphosphate biosynthetic process, mevalonate pathway"
    statement: >-
      The module is grounded in the GO isopentenyl diphosphate biosynthetic process,
      mevalonate pathway (GO:0019287), defined as the conversion of acetate, in the
      form of acetyl-CoA, to IPP through mevalonate intermediates; the acetoacetyl-CoA
      thiolase step is therefore inside the boundary.
  - source_id: YeastPathways:IPPSYN-PWY
    title: mevalonate pathway (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists ERG10, ERG13, HMG1/HMG2, ERG12, ERG8, MVD1 and IDI1 as the
      catalysts of the mevalonate pathway. All gene assignments were retained;
      IDI1 (IPP/DMAPP isomerase) is modelled in the downstream
      isoprenoid_diphosphate_biosynthesis module because GO:0019287 ends at IPP.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=IPPSYN-PWY
  - source_id: YeastPathways:PWY-922
    title: mevalonate pathway I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Duplicate YeastCyc frame with the same seven reactions and gene list as
      IPPSYN-PWY.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-922
  - source_id: PMID:42754161
    title: Structural basis of mevalonate pathway regulation by feedback inhibition of
      mevalonate kinase.
    statement: >-
      Mevalonate kinase is a second regulatory node of the pathway (alongside the
      sterol-regulated HMGCR step): downstream isoprenoid pyrophosphates feedback-inhibit
      MVK, and the five known inhibitors (IPP, DMAPP, GPP, FPP, GGPP) compete for one
      shared site despite spanning C5-C20.
    supporting_text: >-
      Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
      in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
      as feedback inhibitors.
  - source_id: PMID:7989303
    title: ERG10 from Saccharomyces cerevisiae encodes acetoacetyl-CoA thiolase.
    statement: >-
      ERG10 is the single-copy essential gene for the cytoplasmic acetoacetyl-CoA
      thiolase; erg10 and hmg1 alleles were recovered as mevalonate auxotrophs.
    supporting_text: >-
      null alleles of ERG10 produced no detectable acetoacetyl-CoA thiolase enzyme activity
  - source_id: PMID:3526336
    title: Saccharomyces cerevisiae contains two functional genes encoding
      3-hydroxy-3-methylglutaryl-coenzyme A reductase.
    statement: >-
      Budding yeast has two HMG-CoA reductase genes, HMG1 and HMG2, homologous to the
      catalytic carboxy-terminal half of the animal enzyme; loss of both is lethal and
      HMG1 contributes most of the activity.
    supporting_text: >-
      HMG1 contributes at least 83% of the activity found in wild-type cells
  - source_id: PMID:1645230
    title: Nucleotide sequence of the ERG12 gene of Saccharomyces cerevisiae encoding
      mevalonate kinase.
    statement: >-
      ERG12 encodes yeast mevalonate kinase; the enzyme is not rate-limiting but is
      sensitive to farnesyl diphosphate, an early report of the feedback control
      later resolved structurally (PMID:42754161).
    supporting_text: >-
      we show that mevalonate kinase is not a rate-limiting enzyme; however its
      sensitivity to FFP could be a key regulatory mechanism in the sterol pathway of
      yeast.
  - source_id: PMID:1846667
    title: Cloning and characterization of ERG8, an essential gene of Saccharomyces cerevisiae
      that encodes phosphomevalonate kinase.
    statement: ERG8 is an essential, single-copy gene encoding yeast phosphomevalonate kinase.
    supporting_text: >-
      Expression of the ERG8 gene in S. cerevisiae from the galactose-inducible
      galactokinase (GAL1) promoter resulted in 1,000-fold-elevated levels of
      phosphomevalonate kinase enzyme activity.
  - source_id: PMID:11243736
    title: Nonorthologous gene displacement of phosphomevalonate kinase.
    statement: >-
      ERG8-type phosphomevalonate kinases (eubacteria, fungi, plants) and the
      animal PMVK are nonorthologous, justifying the phosphomevalonate-kinase
      variant set.
    supporting_text: >-
      orthologues of ERG8 are present in eubacteria, fungi, and plants, while
      orthologues of human PMK are found only in animals, indicative of a
      nonorthologous gene displacement early in animal evolution
  - source_id: PMID:8663599
    title: Molecular cloning of human phosphomevalonate kinase and identification of a
      consensus peroxisomal targeting sequence.
    statement: The animal-type phosphomevalonate kinase is a small (191-residue) protein.
    supporting_text: >-
      The human PMKase cDNAs predict a 191-amino acid protein
  - source_id: PMID:8626466
    title: Molecular cloning and expression of the cDNAs encoding human and yeast mevalonate
      pyrophosphate decarboxylase.
    statement: >-
      Human and yeast diphosphomevalonate decarboxylases are orthologous and were
      cloned and expressed together.
    supporting_text: >-
      We also cloned and expressed the yeast homolog using the human enzyme's
      similarity to a previously unidentified and incomplete genomic sequence.
  - source_id: PMID:32679672
    title: Regulation of Ergosterol Biosynthesis in Saccharomyces cerevisiae.
    statement: >-
      Review of the yeast sterol pathway, including the mevalonate segment, and its
      transcriptional and feedback regulation.
  - source_id: Reactome:R-HSA-191273
    title: Cholesterol biosynthesis
    statement: >-
      Step order and reaction stoichiometries follow the human Reactome cholesterol/
      isoprenoid-biosynthesis reactions R-HSA-191323 (HMGCS1), R-HSA-191352 (HMGCR),
      R-HSA-191380 (MVK), R-HSA-191422 (PMVK) and R-HSA-191414 (MVD).
  - source_id: file:yeast/ERG10/ERG10-ai-review.yaml
    title: ERG10 gene review (S. cerevisiae)
    statement: >-
      The acetoacetyl-CoA thiolase step (UniProtKB:P41338, GO:0003985, cytosol,
      directly involved in GO:0019287 and ergosterol biosynthesis) matches the core
      function of the ERG10 review.
  - source_id: file:human/HMGCS1/HMGCS1-ai-review.yaml
    title: HMGCS1 gene review (human)
    statement: >-
      The HMG-CoA-synthesis step (UniProtKB:Q01581, GO:0004421) matches the completed
      human HMGCS1 review.
  - source_id: file:human/HMGCR/HMGCR-ai-review.yaml
    title: HMGCR gene review (human)
    statement: >-
      The rate-limiting HMG-CoA-reductase step (UniProtKB:P04035, GO:0004420) matches
      the completed human HMGCR review.
  - source_id: file:human/MVK/MVK-ai-review.yaml
    title: MVK gene review (human)
    statement: >-
      The mevalonate-kinase step (UniProtKB:Q03426, GO:0004496) matches the completed
      human MVK review.
  - source_id: file:human/PMVK/PMVK-ai-review.yaml
    title: PMVK gene review (human)
    statement: >-
      The phosphomevalonate-kinase step (UniProtKB:Q15126, GO:0004631) matches the
      completed human PMVK review.
  - source_id: file:human/MVD/MVD-ai-review.yaml
    title: MVD gene review (human)
    statement: >-
      The diphosphomevalonate-decarboxylase step (UniProtKB:P53602, GO:0004163) matches
      the completed human MVD review.
module:
  id: mevalonate_pathway
  label: Mevalonate pathway (acetyl-CoA -> IPP)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: "isopentenyl diphosphate biosynthetic process, mevalonate pathway"
      term:
        id: GO:0019287
        label: "isopentenyl diphosphate biosynthetic process, mevalonate pathway"
      description: >-
        Conversion of acetyl-CoA to the C5 isoprenoid unit IPP via acetoacetyl-CoA,
        HMG-CoA and mevalonate.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The soluble mevalonate enzymes are cytosolic; HMG-CoA reductase is an
          integral ER-membrane protein (location given on its annoton).
  gocam_associations:
    - model: gomodel:YeastPathways_IPPSYN-PWY
      title: 'mevalonate pathway - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae: ERG10, ERG13, HMG1, HMG2,
        ERG12, ERG8, MVD1 and IDI1, all typed with the module's MF terms, all placed
        in cytosol and part_of the broad GO:0008299 isoprenoid biosynthetic process,
        with no causal edges. HMG1 and HMG2 are two activities that share the IRI
        gomodel:1.1.1.34-RXN, and both are placed in cytosol although they are
        ER-membrane proteins.
    - model: gomodel:YeastPathways_PWY-922
      title: 'mevalonate pathway I - imported from: Saccharomyces Genome Database'
      description: >-
        Duplicate SGD conversion with the same activities and activity ids as
        YeastPathways_IPPSYN-PWY; activities are part_of GO:0010142, which is now
        obsolete (farnesyl diphosphate biosynthetic process, mevalonate pathway).
    - model: gomodel:662af8fa00000499
      title: isoprenoid biosynthetic process (GO:0008299)
      description: >-
        PomBase S. pombe model with a causally chained erg10 -> hcs1 -> hmg1 ->
        erg12 -> erg8 -> mvd1 -> idi1 sequence, hmg1 on the ER membrane and the
        others in cytosol. It also contains activities outside this module: fps1 and
        spo9 prenyl-diphosphate synthesis (isoprenoid_diphosphate_biosynthesis), erg9
        squalene synthase (ergosterol_biosynthesis), rer2 cis-prenyltransferase
        (dolichol), and the ppe1 phosphatase / sds23 inhibitor pair acting upstream of
        hmg1. erg10 and hmg1 are part_of the obsolete GO:0010142 and erg12/erg8/mvd1
        part_of GO:0045337 rather than GO:0019287.
  parts:
    - order: 1
      role: acetoacetyl-CoA formation (thiolase)
      node:
        id: thiolase_step
        label: 2 acetyl-CoA to acetoacetyl-CoA + CoA
        module_type: REACTION
        annotons:
          - id: thiolase_activity
            label: cytosolic acetoacetyl-CoA thiolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Cytosolic acetoacetyl-CoA thiolase (ERG10 / ACAT2)
                term:
                  id: PANTHER:PTHR18919
                  label: ACETYL-COA C-ACYLTRANSFERASE
                description: >-
                  The PANTHER family covers all thiolases, including mitochondrial
                  and peroxisomal 3-ketoacyl-CoA thiolases of beta-oxidation; the
                  mevalonate role belongs to the cytosolic acetoacetyl-CoA thiolase
                  members shown as representatives (ERG10 in PTHR18919:SF165, human
                  ACAT2 in PTHR18919:SF107).
                representative_members:
                  - preferred_term: ERG10 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P41338
                      label: Acetyl-CoA acetyltransferase
                  - preferred_term: erg10 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q9UQW6
                      label: Acetyl-CoA acetyltransferase
                  - preferred_term: ACAT2 (human, cytosolic)
                    term:
                      id: UniProtKB:Q9BWD1
                      label: Acetyl-CoA acetyltransferase, cytosolic
            function:
              preferred_term: acetyl-CoA C-acetyltransferase activity
              term:
                id: GO:0003985
                label: acetyl-CoA C-acetyltransferase activity
              substrates:
                - preferred_term: acetyl-CoA (x2)
              products:
                - preferred_term: acetoacetyl-CoA
                - preferred_term: CoA
              evidence:
                - source_id: EC:2.3.1.9
                  statement: acetyl-CoA C-acetyltransferase (acetoacetyl-CoA thiolase)
                - source_id: PMID:7989303
                  title: ERG10 from Saccharomyces cerevisiae encodes acetoacetyl-CoA thiolase.
                  statement: ERG10 encodes the cytoplasmic acetoacetyl-CoA thiolase of budding yeast.
                  supporting_text: >-
                    was demonstrated to encode cytoplasmic aceto-acetyl-CoA
                    thiolase
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_IPPSYN-PWY
                activity: gomodel:ACETYL-COA-ACETYLTRANSFER-RXN
                title: 'mevalonate pathway - imported from: Saccharomyces Genome Database'
                description: ERG10 enables GO:0003985 in cytosol (same activity id in YeastPathways_PWY-922).
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00000915
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe erg10 enables GO:0003985 in cytosol.
            role_description: >-
              Claisen condensation of two acetyl-CoA to acetoacetyl-CoA, the
              substrate of HMG-CoA synthase. In animals the cytosolic isozyme ACAT2
              serves this role, distinct from the mitochondrial ACAT1 of ketone-body
              metabolism.
    - order: 2
      role: HMG-CoA synthesis
      node:
        id: hmgcs1_step
        label: acetoacetyl-CoA + acetyl-CoA to (S)-HMG-CoA + CoA
        module_type: REACTION
        annotons:
          - id: hmgcs1_activity
            label: HMG-CoA synthase (cytosolic)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: HMG-CoA synthase family (HMGCS1/HMGCS2, ERG13)
                term:
                  id: PANTHER:PTHR43323
                  label: 3-HYDROXY-3-METHYLGLUTARYL COENZYME A SYNTHASE
                representative_members:
                  - preferred_term: HMGCS1 (human, cytosolic)
                    term:
                      id: UniProtKB:Q01581
                      label: Hydroxymethylglutaryl-CoA synthase, cytoplasmic
                  - preferred_term: ERG13 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P54839
                      label: Hydroxymethylglutaryl-CoA synthase
                  - preferred_term: hcs1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:P54874
                      label: Hydroxymethylglutaryl-CoA synthase
            function:
              preferred_term: hydroxymethylglutaryl-CoA synthase activity
              term:
                id: GO:0004421
                label: hydroxymethylglutaryl-CoA synthase activity
              substrates:
                - preferred_term: acetoacetyl-CoA
                - preferred_term: acetyl-CoA
              products:
                - preferred_term: (S)-3-hydroxy-3-methylglutaryl-CoA (HMG-CoA)
                - preferred_term: CoA
              evidence:
                - source_id: EC:2.3.3.10
                  statement: hydroxymethylglutaryl-CoA synthase; cytosolic HMGCS1 (mevalonate), distinct from mitochondrial HMGCS2 (ketogenesis)
                - source_id: Reactome:R-HSA-191323
                  statement: "HMGCS1 condenses Ac-CoA and ACA-CoA to form bHMG-CoA (human Reactome reaction)"
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_IPPSYN-PWY
                activity: gomodel:HYDROXYMETHYLGLUTARYL-COA-SYNTHASE-RXN
                title: 'mevalonate pathway - imported from: Saccharomyces Genome Database'
                description: ERG13 enables GO:0004421 in cytosol.
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00000921
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe hcs1 enables GO:0004421 in cytosol.
            role_description: >-
              Condenses acetoacetyl-CoA + acetyl-CoA to HMG-CoA (SREBP-regulated in
              animals). Distinct from mitochondrial HMGCS2 of ketogenesis, which is
              in the same PANTHER family.
    - order: 3
      role: rate-limiting reduction to mevalonate (statin target)
      node:
        id: hmgcr_step
        label: (S)-HMG-CoA + 2 NADPH to (R)-mevalonate + CoA
        module_type: REACTION
        annotons:
          - id: hmgcr_activity
            label: HMG-CoA reductase (class I)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Class I HMG-CoA reductase family (HMGCR, HMG1/HMG2)
                term:
                  id: PANTHER:PTHR10572
                  label: 3-HYDROXY-3-METHYLGLUTARYL-COENZYME A REDUCTASE
                representative_members:
                  - preferred_term: HMGCR (human)
                    term:
                      id: UniProtKB:P04035
                      label: 3-hydroxy-3-methylglutaryl-coenzyme A reductase
                  - preferred_term: HMG1 (Saccharomyces cerevisiae; major isozyme)
                    term:
                      id: UniProtKB:P12683
                      label: 3-hydroxy-3-methylglutaryl-coenzyme A reductase 1
                  - preferred_term: HMG2 (Saccharomyces cerevisiae; minor isozyme)
                    term:
                      id: UniProtKB:P12684
                      label: 3-hydroxy-3-methylglutaryl-coenzyme A reductase 2
                  - preferred_term: hmg1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q10283
                      label: 3-hydroxy-3-methylglutaryl-coenzyme A reductase
            function:
              preferred_term: hydroxymethylglutaryl-CoA reductase (NADPH) activity
              term:
                id: GO:0004420
                label: hydroxymethylglutaryl-CoA reductase (NADPH) activity
              substrates:
                - preferred_term: (S)-HMG-CoA
                - preferred_term: NADPH (x2)
              products:
                - preferred_term: (R)-mevalonate
                - preferred_term: CoA
              evidence:
                - source_id: EC:1.1.1.34
                  statement: HMG-CoA reductase (NADPH); rate-limiting committed step; ER membrane, sterol-regulated degradation; statin target
                - source_id: Reactome:R-HSA-191352
                  statement: "HMGCR dimer reduces bHMG-CoA to MVA (human Reactome reaction)"
                - source_id: PMID:3526336
                  title: Saccharomyces cerevisiae contains two functional genes encoding
                    3-hydroxy-3-methylglutaryl-coenzyme A reductase.
                  statement: Yeast HMG1 and HMG2 are functionally redundant HMG-CoA reductase isozymes.
                  supporting_text: >-
                    Cells containing mutant alleles of both HMG1 and HMG2 are unable to
                    undergo spore germination and vegetative growth.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            gocam_associations:
              - model: gomodel:YeastPathways_IPPSYN-PWY
                activity: gomodel:1.1.1.34-RXN
                title: 'mevalonate pathway - imported from: Saccharomyces Genome Database'
                description: >-
                  HMG1 and HMG2 enable GO:0004420; both activities share this IRI
                  and are placed in cytosol rather than ER membrane.
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00000903
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe hmg1 enables GO:0004420 on the ER membrane.
            role_description: >-
              Rate-limiting enzyme of the pathway; polytopic ER-membrane protein with
              a sterol-sensing domain. Animal HMGCR is regulated by SREBP/Insig and
              sterol-accelerated degradation and is the statin target; budding yeast
              has two partially redundant isozymes, of which HMG1 contributes most
              of the activity (PMID:3526336).
    - order: 4
      role: mevalonate phosphorylation
      node:
        id: mvk_step
        label: (R)-mevalonate + ATP to (R)-mevalonate-5-phosphate + ADP
        module_type: REACTION
        annotons:
          - id: mvk_activity
            label: mevalonate kinase (GHMP kinase)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mevalonate kinase / GHMP kinase family (MVK, ERG12)
                term:
                  id: PANTHER:PTHR43290
                  label: MEVALONATE KINASE
                representative_members:
                  - preferred_term: MVK (human)
                    term:
                      id: UniProtKB:Q03426
                      label: Mevalonate kinase
                  - preferred_term: ERG12 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P07277
                      label: Mevalonate kinase
                  - preferred_term: erg12 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q09780
                      label: Mevalonate kinase
            function:
              preferred_term: mevalonate kinase activity
              term:
                id: GO:0004496
                label: mevalonate kinase activity
              substrates:
                - preferred_term: (R)-mevalonate
                - preferred_term: ATP
              products:
                - preferred_term: (R)-mevalonate 5-phosphate
                - preferred_term: ADP
              evidence:
                - source_id: EC:2.7.1.36
                  statement: mevalonate kinase (GHMP kinase); Mg2+/ATP-dependent
                - source_id: Reactome:R-HSA-191380
                  statement: "Mevalonate is phosphorylated to mevalonate-5-phosphate (human Reactome reaction)"
                - source_id: PMID:2161381
                  title: Isolation of the ERG12 gene of Saccharomyces cerevisiae encoding mevalonate
                    kinase.
                  statement: ERG12 encodes yeast mevalonate kinase and is essential.
                  supporting_text: >-
                    Gene disruption shows that the ERG12 gene is essential
                    in yeast, both for spore germination and vegetative growth.
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_IPPSYN-PWY
                activity: gomodel:MEVALONATE-KINASE-RXN
                title: 'mevalonate pathway - imported from: Saccharomyces Genome Database'
                description: ERG12 enables GO:0004496 in cytosol.
              - model: gomodel:662af8fa00000499
                activity: gomodel:662af8fa00000499/662af8fa00000937
                title: isoprenoid biosynthetic process (GO:0008299)
                description: S. pombe erg12 enables GO:0004496 in cytosol.
            role_description: >-
              Phosphorylates mevalonate to mevalonate-5-phosphate. Second regulatory node
              of the pathway: competitively feedback-inhibited at a single shared site by
              downstream isoprenoid pyrophosphates spanning C5-C20 (IPP, DMAPP, GPP, FPP,
              GGPP). Human deficiency causes mevalonate kinase deficiency (hyper-IgD/periodic
              fever to mevalonic aciduria).
            evidence:
              - source_id: PMID:42754161
                title: Structural basis of mevalonate pathway regulation by feedback inhibition
                  of mevalonate kinase.
                statement: >-
                  All five known isoprenoid-pyrophosphate feedback inhibitors of mevalonate
                  kinase compete for a single binding site despite ranging from C5 to C20.
                supporting_text: >-
                  Known MK inhibitors vary widely in size, including IPP and DMAPP (five
                  carbons, C5), geranyl pyrophosphate (GPP, C10), farnesyl pyrophosphate
                  (FPP, C15), and geranylgeranyl pyrophosphate (GGPP, C20). These inhibitors
                  compete for binding at a single site
              - source_id: PMID:42754161
                title: Structural basis of mevalonate pathway regulation by feedback inhibition
                  of mevalonate kinase.
                statement: >-
                  Inhibition kinetics and apo/inhibitor-bound crystal structures were
                  determined for the Saccharomyces cerevisiae enzyme (ScMK); inhibitor
                  potencies span roughly two orders of magnitude. Per-inhibitor Ki values
                  are not stated in the abstract and are deliberately not recorded here.
                supporting_text: >-
                  we first characterized the inhibition kinetics of all five of these
                  inhibitors using MK from Saccharomyces cerevisiae (ScMK), revealing an
                  inhibition potency that ranges approximately two orders of magnitude
    - order: 5
      role: second phosphorylation
      node:
        id: pmvk_step
        label: (R)-mevalonate-5-phosphate + ATP to (R)-mevalonate-5-diphosphate + ADP
        module_type: REACTION
        variant_sets:
          - id: pmvk_family_variants
