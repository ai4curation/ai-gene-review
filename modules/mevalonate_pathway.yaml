  connections:
    - source: thiolase_step
      target: hmgcs1_step
      connection_type: PRECEDES
      description: Acetoacetyl-CoA from the thiolase is condensed with acetyl-CoA by HMG-CoA synthase.
    - source: hmgcs1_step
      target: hmgcr_step
      connection_type: PRECEDES
      description: HMG-CoA from HMG-CoA synthase is reduced to mevalonate by HMG-CoA reductase.
    - source: hmgcr_step
      target: mvk_step
      connection_type: PRECEDES
      description: Mevalonate from HMG-CoA reductase is phosphorylated by mevalonate kinase.
    - source: mvk_step
      target: pmvk_step
      connection_type: PRECEDES
      description: Mevalonate-5-phosphate is phosphorylated by phosphomevalonate kinase.
    - source: pmvk_step
      target: mvd_step
      connection_type: PRECEDES
      description: Mevalonate-5-diphosphate is decarboxylated to IPP.
    - source: mvd_step
      target: mvk_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Feedback inhibition. IPP, the product of the decarboxylase step, and the
        isoprenoid pyrophosphates derived from it further downstream (DMAPP via IPP
        isomerase; GPP, FPP and GGPP via the prenyltransferases) competitively inhibit
        mevalonate kinase at a single shared site, closing a negative-feedback loop on
        the pathway's first phosphorylation step.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Regulatory, not a reaction-chaining edge; no CoA intermediate is transferred.
      evidence:
        - source_id: PMID:42754161
          title: Structural basis of mevalonate pathway regulation by feedback inhibition
            of mevalonate kinase.
          statement: >-
            Downstream isoprenoid pyrophosphates act as feedback inhibitors of the
            mevalonate kinase step.
          supporting_text: >-
            Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
            in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
            as feedback inhibitors.
  notes: >-
    Generalised from a human-only module to the eukaryotic (classical) mevalonate
    pathway. Changes: (1) the cytosolic acetoacetyl-CoA thiolase step was added as
    part 1, because GO:0019287 is defined from acetyl-CoA, YeastCyc IPPSYN-PWY and both
    yeast GO-CAMs include it, and the ERG10 review places ERG10 directly in GO:0019287;
    the human representative is the cytosolic ACAT2 (UniProtKB:Q9BWD1), not the
    mitochondrial ACAT1 of ketone-body metabolism. (2) S. cerevisiae (ERG10, ERG13,
    HMG1, HMG2, ERG12, ERG8, MVD1) and S. pombe (erg10, hcs1, hmg1, erg12, erg8, mvd1)
    representatives were added; all share the human enzymes' PANTHER families except
    phosphomevalonate kinase. (3) The phosphomevalonate kinase step became a variant set:
    ERG8-type GHMP kinases (PTHR31814; fungi, plants, eubacteria) and the animal P-loop
    PMVK (PTHR13101) are nonorthologous (PMID:11243736), so one family selector cannot
    cover both. (4) Connections were retyped from PROVIDES_INPUT_FOR to PRECEDES. IDI1,
    which both YeastCyc frames list, is modelled in isoprenoid_diphosphate_biosynthesis
    (IPP -> DMAPP), because the GO process term ends at IPP. Archaeal variants of the
    lower mevalonate pathway are outside this module. Regulation. HMG-CoA reductase
    is the sterol-feedback, rate-limiting step (SREBP/Insig in animals; the PomBase model
    also records the ppe1 phosphatase and
    its inhibitor sds23 acting upstream of S. pombe hmg1). Mevalonate kinase is a second,
    metabolite-level control point: downstream isoprenoid pyrophosphates feedback-inhibit it,
    and the five known inhibitors (IPP, DMAPP, GPP, FPP, GGPP) compete for one shared site
    despite spanning C5-C20 (PMID:42754161, which reports inhibition kinetics and apo plus
    five inhibitor-bound X-ray structures for the S. cerevisiae enzyme; per-inhibitor Ki
    values are not in the abstract and are not asserted). FPP sensitivity of yeast ERG12 was
    already reported in PMID:1645230. GO-CAM disagreements: both SGD conversions place every
    activity, including the ER-membrane HMG1/HMG2, in cytosol, give HMG1 and HMG2 one
    shared activity IRI, and use either the broad GO:0008299 or the obsolete GO:0010142 as
    the process; the PomBase model uses GO:0010142 and GO:0045337 rather than GO:0019287 as
    process terms. Human disorders: MVK -> mevalonate kinase deficiency; MVD (and MVK) ->
    porokeratosis; HMGCR -> statin target and autoantibody-mediated necrotizing myopathy;
    HMGCS1 -> a rare rigid-spine myopathy.
