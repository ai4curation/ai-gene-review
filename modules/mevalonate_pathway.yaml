  connections:
    - source: hmgcs1_step
      target: hmgcr_step
      connection_type: PROVIDES_INPUT_FOR
      description: HMG-CoA from HMGCS1 is reduced to mevalonate by HMGCR.
    - source: hmgcr_step
      target: mvk_step
      connection_type: PROVIDES_INPUT_FOR
      description: Mevalonate from HMGCR is phosphorylated by MVK.
    - source: mvk_step
      target: pmvk_step
      connection_type: PROVIDES_INPUT_FOR
      description: Mevalonate-5-phosphate from MVK is phosphorylated by PMVK.
    - source: pmvk_step
      target: mvd_step
      connection_type: PROVIDES_INPUT_FOR
      description: Mevalonate-5-diphosphate from PMVK is decarboxylated by MVD to IPP.
    - source: mvd_step
      target: mvk_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Feedback inhibition. IPP, the product of the MVD step, and the isoprenoid
        pyrophosphates derived from it further downstream (DMAPP via IDI1; GPP, FPP and
        GGPP via the prenyltransferases) competitively inhibit mevalonate kinase at a
        single shared site, closing a negative-feedback loop on the pathway's first
        phosphorylation step.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Regulatory, not a reaction-chaining edge; no CoA intermediate is transferred.
      evidence:
        - source_id: PMID:42754161
          title: Structural basis of mevalonate pathway regulation by feedback inhibition
            of mevalonate kinase.
          statement: >-
            Downstream isoprenoid pyrophosphates act as feedback inhibitors of the
            mevalonate kinase step.
          supporting_text: >-
            Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
            in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
            as feedback inhibitors.
  notes: >-
    The mevalonate pathway (acetyl-CoA -> IPP) grounded to the human enzymes HMGCS1
    (UniProtKB:Q01581, GO:0004421, EC 2.3.3.10), HMGCR (P04035, GO:0004420, EC 1.1.1.34),
    MVK (Q03426, GO:0004496, EC 2.7.1.36), PMVK (Q15126, GO:0004631, EC 2.7.4.2) and MVD
    (P53602, GO:0004163, EC 4.1.1.33). GO molecular-function terms were taken from the human
    GOA records; Reactome reaction ids and titles were verified against the local reactome
    cache. Each step uses a PANTHER family selector (generic over orthologs; HMGCS node covers
    HMGCS1 cytosolic + HMGCS2 mitochondrial, the latter being the ketogenesis enzyme reviewed
    in the ketogenesis module). HMGCR is the sole ER-membrane step (sterol-regulated, statin
    target); the rest are cytosolic. Downstream, IPP is isomerised to dimethylallyl-PP (IDI1)
    and condensed by farnesyl/geranylgeranyl-PP synthases (FDPS/GGPS1) toward squalene ->
    cholesterol (post-squalene sterol synthesis: SQLE/LSS/.../SC5D/DHCR7/DHCR24), and also
    supplies dolichol, ubiquinone (CoQ), heme A and the prenyl groups for protein prenylation.
    Disorders: MVK -> mevalonate kinase deficiency (HIDS/periodic fever to mevalonic aciduria);
    MVD (and MVK) -> porokeratosis; HMGCR -> statin target and autoantibody-mediated necrotizing
    myopathy; HMGCS1 -> a rare rigid-spine myopathy. (Acetoacetyl-CoA for HMGCS1 is supplied by
    cytosolic thiolase ACAT2.)

    Regulation. The module has two regulatory nodes, not one. HMGCR is the sterol-feedback,
    SREBP/Insig-regulated rate-limiting step. MVK is a second, metabolite-level control point:
    downstream isoprenoid pyrophosphates feedback-inhibit it, and the five known inhibitors
    (IPP, DMAPP, GPP, FPP, GGPP) compete for one shared site despite spanning C5-C20
    (PMID:42754161). That work reports inhibition kinetics and apo plus five inhibitor-bound
    X-ray structures for the *Saccharomyces cerevisiae* enzyme (ScMK) and states only that
    potency spans roughly two orders of magnitude; individual Ki values and the residue-level
    description of how one site accommodates C5-C20 ligands are not in the abstract, and the
    full text was not available here, so no numeric or structural detail beyond this is
    asserted. Whether the human MVK site behaves identically is likewise not established by
    that paper. No new module members follow from it - MVK is already part 3 - so the finding
    is recorded as a regulatory connection (mvd_step -| mvk_step) and annoton evidence rather
    than as an additional part.

    Scope against mevalonate-pathway diversity (2026 review PMID:41700894). This module models the
    eukaryotic/bacterial-type route (MVK -> PMVK -> MVD). Archaea and some Chloroflexota use
    archaeal-type variants that share HMGCS/HMGCR chemistry up to mevalonate and then diverge. In one,
    mevalonate 5-phosphate is decarboxylated to isopentenyl phosphate and phosphorylated by isopentenyl
    phosphate kinase (PMID:24327557, PMID:16621811). In Thermoplasma the route goes through mevalonate
    3-phosphate and mevalonate 3,5-bisphosphate (PMID:24914732). These are not modeled as variants here,
    and the human representatives and PANTHER selectors for the PMVK and MVD steps should not be read
    as covering archaea. HMG-CoA reductase also comes as type I (eukaryotes, archaea, some bacteria)
    and type II (mostly bacteria), which differ in statin sensitivity. PANTHER:PTHR10572 contains both,
    including the NAD-dependent class II enzyme of Pseudomonas mevalonii (UniProtKB:P13702, EC 1.1.1.88).
    The family-level GO:0004420 (NADPH) assertion is therefore exact only for the class I members
    represented here.
