                  label: endoplasmic reticulum membrane
            role_description: >-
              Rate-limiting, committed enzyme of the pathway; polytopic ER-membrane protein
              with sterol-sensing domain and SREBP/Insig-regulated degradation. Target of
              the statin cholesterol-lowering drugs.
    - order: 3
      role: mevalonate phosphorylation (product-inhibited regulatory step)
      node:
        id: mvk_step
        label: (R)-mevalonate + ATP to (R)-mevalonate-5-phosphate + ADP
        module_type: REACTION
        annotons:
          - id: mvk_activity
            label: "MVK: mevalonate kinase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mevalonate kinase / GHMP kinase family (MVK)
                term:
                  id: PANTHER:PTHR43290
                  label: MEVALONATE KINASE
                representative_members:
                  - preferred_term: MVK (human)
                    term:
                      id: UniProtKB:Q03426
                      label: Mevalonate kinase
            function:
              preferred_term: mevalonate kinase activity
              term:
                id: GO:0004496
                label: mevalonate kinase activity
              substrates:
                - preferred_term: (R)-mevalonate
                - preferred_term: ATP
              products:
                - preferred_term: (R)-mevalonate 5-phosphate
                - preferred_term: ADP
              evidence:
                - source_id: EC:2.7.1.36
                  statement: mevalonate kinase (GHMP kinase); Mg2+/ATP-dependent
                - source_id: Reactome:R-HSA-191380
                  statement: "Mevalonate is phosphorylated to mevalonate-5-phosphate (human Reactome reaction)"
                - source_id: PMID:42754161
                  statement: >-
                    MK is feedback-inhibited by downstream isoprenoid pyrophosphates of widely
                    differing chain length (IPP/DMAPP C5, GPP C10, FPP C15, GGPP C20), all of
                    which compete for the same site on the enzyme.
                  supporting_text: >-
                    Known MK inhibitors vary widely in size, including IPP and DMAPP (five
                    carbons, C5), geranyl pyrophosphate (GPP, C10), farnesyl pyrophosphate
                    (FPP, C15), and geranylgeranyl pyrophosphate (GGPP, C20). These inhibitors
                    compete for binding at a single site
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Phosphorylates mevalonate to mevalonate-5-phosphate. This is the pathway's
              product-inhibited regulatory step: downstream isoprenoid pyrophosphates from C5
              to C20 (IPP, DMAPP, GPP, FPP, GGPP) all bind one shared site and inhibit the
              enzyme competitively, so flux into the isoprenoid pool is throttled by the pool
              itself. The layer is distinct from the sterol/Insig-SREBP control of HMGCR
              abundance one step upstream, and acts on enzyme activity rather than on enzyme
              amount. Deficiency causes mevalonate kinase deficiency (hyper-IgD/periodic fever
              to mevalonic aciduria).
    - order: 4
      role: second phosphorylation
      node:
        id: pmvk_step
        label: (R)-mevalonate-5-phosphate + ATP to (R)-mevalonate-5-diphosphate + ADP
        module_type: REACTION
        annotons:
          - id: pmvk_activity
            label: "PMVK: phosphomevalonate kinase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Phosphomevalonate kinase family (PMVK)
                term:
                  id: PANTHER:PTHR13101
                  label: PHOSPHOMEVALONATE KINASE
                representative_members:
                  - preferred_term: PMVK (human)
                    term:
