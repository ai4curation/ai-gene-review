id: MODULE:mevalonate_pathway
title: Mevalonate pathway (acetyl-CoA -> isopentenyl diphosphate); statin target, mevalonate kinase deficiency
description: >-
  The mevalonate pathway is the cytosolic/ER route that converts acetyl-CoA into the
  universal five-carbon isoprenoid building block isopentenyl diphosphate (IPP), the
  precursor of cholesterol, dolichol, ubiquinone (CoQ), heme A, and the farnesyl/
  geranylgeranyl groups used for protein prenylation. Cytosolic HMG-CoA synthase (HMGCS1)
  condenses acetoacetyl-CoA with acetyl-CoA to 3-hydroxy-3-methylglutaryl-CoA (HMG-CoA);
  HMG-CoA reductase (HMGCR), the rate-limiting, committed, sterol-feedback-regulated
  enzyme and target of the statin drugs, reduces HMG-CoA to mevalonate using 2 NADPH on
  the endoplasmic-reticulum membrane; mevalonate kinase (MVK) and phosphomevalonate kinase
  (PMVK) then doubly phosphorylate mevalonate to mevalonate-5-diphosphate; and
  diphosphomevalonate decarboxylase (MVD) decarboxylates it to IPP. Inherited defects
  cause: mevalonate kinase deficiency (MVK) — spanning hyper-IgD/periodic fever syndrome
  to mevalonic aciduria; porokeratosis (MVD and MVK); and HMGCR/HMGCS1 are pharmacologic/
  autoimmune (statin) and rare-myopathy loci rather than classic enzymopathies.
status: DRAFT
references:
  - id: PMID:42754161
    title: Structural basis of mevalonate pathway regulation by feedback inhibition of
      mevalonate kinase.
    findings:
      - statement: >-
          Mevalonate kinase is a second regulatory node of the pathway (alongside the
          sterol-regulated HMGCR step): downstream isoprenoid pyrophosphates feedback-inhibit
          MVK, and the five known inhibitors (IPP, DMAPP, GPP, FPP, GGPP) compete for one
          shared site despite spanning C5-C20.
        supporting_text: >-
          Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
          in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
          as feedback inhibitors.
evidence:
  - source_id: PMID:42754161
    title: Structural basis of mevalonate pathway regulation by feedback inhibition of
      mevalonate kinase.
    statement: >-
      Mevalonate kinase is a second regulatory node of the pathway (alongside the
      sterol-regulated HMGCR step): downstream isoprenoid pyrophosphates feedback-inhibit
      MVK, and the five known inhibitors (IPP, DMAPP, GPP, FPP, GGPP) compete for one
      shared site despite spanning C5-C20.
    supporting_text: >-
      Mevalonate kinase (MK) catalyzes a key regulatory step of mevalonate pathway
      in many eukaryotes, in which several downstream isoprenoid pyrophosphates act
      as feedback inhibitors.
  - source_id: PMID:41700894
    title: 'Harnessing evolution: leveraging bacterial isoprenoid pathway diversity toward improved bioengineering strategies.'
    statement: >-
      2026 review used to audit the module's scope. It separates the eukaryotic/bacterial-type
      mevalonate pathway modeled here from archaeal-type routes, which some Chloroflexota bacteria also
      carry, and distinguishes type I from type II HMG-CoA reductases. Those variants are recorded in
      notes; they are not modeled as variants.
    supporting_text: >-
      There is a eukaryotic/bacterial-type MEV pathway and an archaeal-type MEV pathway, which differ
      in the intermediate steps taken, but ultimately both lead to the generation of IDP and DMADP (40, 63).
  - source_id: PMID:24327557
    title: Discovery of a metabolic alternative to the classical mevalonate pathway.
    statement: >-
      Primary evidence for the alternative route in which mevalonate 5-phosphate is decarboxylated
      (MPD) to isopentenyl phosphate and then phosphorylated by isopentenyl phosphate kinase (IPK). It
      replaces the PMVK and MVD steps of this module in Haloferax and some Chloroflexi.
    supporting_text: >-
      Key to this pathway is the
      catalytic actions of a newly uncovered enzyme, mevalonate phosphate
      decarboxylase (MPD) and IPK.
  - source_id: PMID:16621811
    title: Methanocaldococcus jannaschii uses a modified mevalonate pathway for biosynthesis of isopentenyl diphosphate.
    statement: >-
      Primary identification of archaeal isopentenyl phosphate kinase (MJ0044), which was predicted to be
      the missing phosphomevalonate kinase but phosphorylates isopentenyl phosphate instead.
    supporting_text: >-
      The MJ0044 gene product was found to
      phosphorylate isopentenyl phosphate, generating isopentenyl diphosphate.
  - source_id: PMID:24914732
    title: Evidence of a novel mevalonate pathway in archaea.
    statement: >-
      Thermoplasma acidophilum mevalonate-3-kinase and mevalonate-3-phosphate-5-kinase define a third,
      3-phosphorylating archaeal route from mevalonate toward IPP.
    supporting_text: >-
      We have
      identified two novel enzymes, mevalonate-3-kinase and
      mevalonate-3-phosphate-5-kinase from Thermoplasma acidophilum, which act
      sequentially in a putative alternate mevalonate pathway.
  - source_id: GO:0019287
    title: "isopentenyl diphosphate biosynthetic process, mevalonate pathway"
    statement: >-
      The module is grounded in the GO isopentenyl diphosphate biosynthetic process,
      mevalonate pathway (GO:0019287): acetyl-CoA -> HMG-CoA -> mevalonate -> IPP.
  - source_id: Reactome:R-HSA-191273
    title: Cholesterol biosynthesis
    statement: >-
      Step order and reaction stoichiometries follow the human Reactome cholesterol/
      isoprenoid-biosynthesis reactions R-HSA-191323 (HMGCS1), R-HSA-191352 (HMGCR),
      R-HSA-191380 (MVK), R-HSA-191422 (PMVK) and R-HSA-191414 (MVD).
  - source_id: file:human/HMGCS1/HMGCS1-ai-review.yaml
    title: HMGCS1 gene review (human)
    statement: >-
      The HMG-CoA-synthesis step (UniProtKB:Q01581, GO:0004421) matches the completed
      human HMGCS1 review.
  - source_id: file:human/HMGCR/HMGCR-ai-review.yaml
    title: HMGCR gene review (human)
    statement: >-
      The rate-limiting HMG-CoA-reductase step (UniProtKB:P04035, GO:0004420) matches
      the completed human HMGCR review.
  - source_id: file:human/MVK/MVK-ai-review.yaml
    title: MVK gene review (human)
    statement: >-
      The mevalonate-kinase step (UniProtKB:Q03426, GO:0004496) matches the completed
      human MVK review.
  - source_id: file:human/PMVK/PMVK-ai-review.yaml
    title: PMVK gene review (human)
    statement: >-
      The phosphomevalonate-kinase step (UniProtKB:Q15126, GO:0004631) matches the
      completed human PMVK review.
  - source_id: file:human/MVD/MVD-ai-review.yaml
    title: MVD gene review (human)
    statement: >-
      The diphosphomevalonate-decarboxylase step (UniProtKB:P53602, GO:0004163) matches
      the completed human MVD review.
