id: MODULE:glycine_cleavage_system
title: Glycine cleavage system
description: >-
  A four-component lipoyl-relay system that oxidatively decarboxylates glycine,
  transfers its one-carbon unit to tetrahydrofolate, and regenerates the oxidized
  H-protein carrier. The P protein loads the aminomethyl intermediate onto the H
  protein, the H protein carries it to the T protein, the T protein forms
  5,10-methylenetetrahydrofolate and ammonium, and the shared L protein reoxidizes
  the reduced lipoyl arm with NAD+. H-protein lipoylation, glycine-generating
  pathways, and downstream one-carbon metabolism are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019464
    title: glycine decarboxylation via glycine cleavage system
    statement: Defines the complete glycine-cleavage process represented by the module.
  - source_id: GO:0005960
    title: glycine cleavage complex
    statement: Defines the P/H/T/L multienzyme assembly.
  - source_id: RHEA:24304
    title: glycine dehydrogenase (decarboxylating) reaction
    statement: Defines transfer of the glycine-derived aminomethyl group to lipoyl-H protein.
  - source_id: RHEA:16945
    title: aminomethyltransferase reaction
    statement: Defines transfer from aminomethyl-H protein to tetrahydrofolate.
  - source_id: RHEA:15045
    title: dihydrolipoyl dehydrogenase reaction
    statement: Defines NAD+-dependent reoxidation of protein-bound dihydrolipoamide.
  - source_id: Reactome:R-HSA-6783984
    title: Glycine degradation
    statement: >-
      The human pathway supplies reviewed eukaryotic implementations of the P,
      H, T, and L roles, including reactions R-HSA-5693967, R-HSA-5693977, and
      R-HSA-5694018.
  - source_id: file:human/GLDC/GLDC-ai-review.yaml
    title: GLDC gene review (human)
    statement: The gene review grounds human GLDC as the P-protein representative.
  - source_id: file:human/GCSH/GCSH-ai-review.yaml
    title: GCSH gene review (human)
    statement: The completed review grounds human GCSH as the lipoyl H-protein representative.
  - source_id: file:human/AMT/AMT-ai-review.yaml
    title: AMT gene review (human)
    statement: The gene review grounds human AMT as the T-protein representative.
  - source_id: file:human/DLD/DLD-ai-review.yaml
    title: DLD gene review (human)
    statement: The gene review grounds human DLD as the shared L-protein representative.
  - source_id: PANTHER:PTN000206531
    title: PAINT glycine dehydrogenase ancestral node
    statement: >-
      The local PTHR11773 PAINT table assigns GO:0004375 and GO:0019464 to
      PTN000206531, with experimentally characterized UniProt proteins among its seeds.
  - source_id: PANTHER:PTN000354058
    title: PAINT aminomethyltransferase ancestral node
    statement: >-
      The local PTHR43757 PAINT table assigns GO:0004047 to PTN000354058, with
      bacterial and eukaryotic aminomethyltransferases among its seeds.
notes: >-
  The boundary is the four-role catalytic cycle rather than a universal stable
  complex: P loads the H carrier, T transfers the one-carbon unit to
  tetrahydrofolate, and a potentially shared L enzyme reoxidizes H. H-protein
  lipoylation, glycine supply, downstream one-carbon metabolism, regulation,
  and clinical consequences remain outside the module. Representative members
  orient family roles and do not prescribe a species-specific composition.
