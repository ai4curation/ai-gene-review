id: MODULE:glycine_cleavage_system
title: Glycine cleavage system
description: >-
  A four-component lipoyl-relay system that oxidatively decarboxylates glycine,
  transfers its one-carbon unit to tetrahydrofolate, and regenerates the oxidized
  H-protein carrier. The P protein loads the aminomethyl intermediate onto the H
  protein, the H protein carries it to the T protein, the T protein forms
  5,10-methylenetetrahydrofolate and ammonium, and the shared L protein reoxidizes
  the reduced lipoyl arm with NAD+. H-protein lipoylation, glycine-generating
  pathways, and downstream one-carbon metabolism are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019464
    title: glycine decarboxylation via glycine cleavage system
    statement: Defines the complete glycine-cleavage process represented by the module.
  - source_id: GO:0005960
    title: glycine cleavage complex
    statement: Defines the P/H/T/L multienzyme assembly.
  - source_id: RHEA:24304
    title: glycine dehydrogenase (decarboxylating) reaction
    statement: Defines transfer of the glycine-derived aminomethyl group to lipoyl-H protein.
  - source_id: RHEA:16945
    title: aminomethyltransferase reaction
    statement: Defines transfer from aminomethyl-H protein to tetrahydrofolate.
  - source_id: RHEA:15045
    title: dihydrolipoyl dehydrogenase reaction
    statement: Defines NAD+-dependent reoxidation of protein-bound dihydrolipoamide.
  - source_id: Reactome:R-HSA-6783984
    title: Glycine degradation
    statement: >-
      The human pathway supplies reviewed eukaryotic implementations of the P,
      H, T, and L roles, including reactions R-HSA-5693967, R-HSA-5693977, and
      R-HSA-5694018.
  - source_id: file:human/GLDC/GLDC-ai-review.yaml
    title: GLDC gene review (human)
    statement: The gene review grounds human GLDC as the P-protein representative.
  - source_id: file:human/GCSH/GCSH-ai-review.yaml
    title: GCSH gene review (human)
    statement: The completed review grounds human GCSH as the lipoyl H-protein representative.
  - source_id: file:human/AMT/AMT-ai-review.yaml
    title: AMT gene review (human)
    statement: The gene review grounds human AMT as the T-protein representative.
  - source_id: file:human/DLD/DLD-ai-review.yaml
    title: DLD gene review (human)
    statement: The gene review grounds human DLD as the shared L-protein representative.
  - source_id: file:genes/ECOLI/lpd/lpd-ai-review.yaml
    title: ECOLI lpd gene review
    statement: >-
      The completed E. coli lpd review grounds LpdA as the glycine-cleavage
      L protein in addition to its E3 roles in 2-oxoacid dehydrogenase complexes.
  - source_id: PMID:1902462
    title: Cloning and sequence analysis of the LPD-glc structural gene of Pseudomonas putida.
    supporting_text: >-
      LPD-glc, which is the E3 component of the pyruvate and 2-ketoglutarate
      dehydrogenase complexes and the L-factor for the glycine oxidation system
    statement: Distinguishes the glycine-oxidation-compatible LPD-glc enzyme from other P. putida LPD paralogs.
  - source_id: PMID:6546487
    title: Oxidation of glycine by Pseudomonas putida requires a specific lipoamide dehydrogenase.
    supporting_text: >-
      These results indicate that LPD-glc is specifically utilized for glycine
      oxidation in P. putida.
    statement: Direct biochemical evidence that glycine oxidation uses LPD-glc rather than LPD-val.
  - source_id: YeastPathways:GLYCLEAV-PWY
    title: glycine cleavage (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD YeastCyc pathway lists three reactions with GCV2 (P protein,
      EC 1.4.4.2), GCV1 (T protein, EC 2.1.2.10) and LPD1 (L protein,
      EC 1.8.1.4). These assignments are retained; the H protein GCV3, which
      carries every intermediate, is missing from the YeastCyc gene list and
      is added here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYCLEAV-PWY
  - source_id: PMID:8830251
    title: Specific induction by glycine of the gene for the P-subunit of glycine decarboxylase from Saccharomyces cerevisiae.
    statement: GCV2 encodes the yeast P protein and is induced by glycine.
    supporting_text: >-
      The Saccharomyces cerevisiae GCV2 gene, encoding the P-protein has been
      cloned by complementation of the gsd2 mutation which prevents cells
      converting glycine to serine or using glycine as the sole nitrogen
      source.
  - source_id: PMID:9020168
    title: Molecular characterization of GCV3, the Saccharomyces cerevisiae gene coding for the glycine cleavage system hydrogen carrier protein.
    statement: GCV3 (YAL044C) encodes the H protein, has a mitochondrial targeting signal, and is needed to use glycine as nitrogen source.
    supporting_text: >-
      YAL044, a gene on the left arm of Saccharomyces cerevisiae chromosome
      one, is shown to code for the H-protein subunit of the multienzyme
      glycine cleavage system.
  - source_id: PMID:9047339
    title: Cloning, and molecular characterization of the GCV1 gene encoding the glycine cleavage T-protein from Saccharomyces cerevisiae.
    statement: GCV1 encodes the T protein; gcv1 strains lack glycine cleavage activity.
    supporting_text: >-
      All gcv1 strains studied were unable to grow on glycine as a sole
      nitrogen source and lacked glycine cleavage enzyme activity.
  - source_id: PMID:7498764
    title: Genetics of the synthesis of serine from glycine and the utilization of glycine as sole nitrogen source by Saccharomyces cerevisiae.
    statement: The single yeast lipoamide dehydrogenase LPD1 is the L subunit of the glycine decarboxylase complex.
    supporting_text: >-
      Yeast strains with mutations in the single gene for lipoamide
      dehydrogenase (lpd1) lack GDC activity, as well as the other three
      2-oxoacid dehydrogenases dependent on this enzyme.
  - source_id: PMID:2821168
    title: Cloning and characterization of the gene encoding lipoamide dehydrogenase in Saccharomyces cerevisiae.
    statement: LPD1 encodes the single-copy yeast lipoamide dehydrogenase (cited by YeastPathways for the L-protein reaction).
    supporting_text: The LPD1 gene is present as a single copy in the yeast genome
  - source_id: PANTHER:PTN000206531
    title: PAINT glycine dehydrogenase ancestral node
    statement: >-
      The local PTHR11773 PAINT table assigns GO:0004375 and GO:0019464 to
      PTN000206531, with experimentally characterized UniProt proteins among its seeds.
  - source_id: PANTHER:PTN000354058
    title: PAINT aminomethyltransferase ancestral node
    statement: >-
      The local PTHR43757 PAINT table assigns GO:0004047 to PTN000354058, with
      bacterial and eukaryotic aminomethyltransferases among its seeds.
notes: >-
  The boundary is the four-role catalytic cycle rather than a universal stable
  complex: P loads the H carrier, T transfers the one-carbon unit to
  tetrahydrofolate, and a potentially shared L enzyme reoxidizes H. H-protein
  lipoylation, glycine supply, downstream one-carbon metabolism, regulation,
  and clinical consequences remain outside the module. Representative members
  orient family roles and do not prescribe a species-specific composition.
  ALIGN with YeastPathways (2026-10): GLYCLEAV-PWY has the P (GCV2), T (GCV1)
  and L (LPD1) reactions, with correct catalysts, but omits the H-protein
  carrier GCV3 (YAL044C, PMID:9020168), which is added as an exemplar; the
  YeastCyc reactions are written as H-protein half-reactions and map
  one-to-one onto the P, T and L parts. S. cerevisiae and S. pombe exemplars
  were added to all four roles. The eukaryotic system is in the mitochondrial
  matrix (the yeast and fission-yeast proteins carry mitochondrial targeting
  signals); no location is asserted because the module also covers bacteria.
  In yeast it lets cells use glycine as a nitrogen source and supplies
  one-carbon units, so that mitochondrial SHMT can make serine from glycine
  (glycine_serine_interconversion). GO-CAM disagreements:
  YeastPathways_GLYCLEAV-PWY places all activities in cytosol, omits GCV3,
  and has no causal edges. PomBase 67b1629100001554 types the H protein
  with GO:0140104 molecular carrier activity, whereas this module keeps
  GO:0031405 lipoic acid binding to stay consistent with the human GCSH
  review; the carrier term arguably describes the swinging-arm role better and
  is worth revisiting. Its aim22 lipoate-protein ligase activity belongs to
  H-protein lipoylation, outside this module.
