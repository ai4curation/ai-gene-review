          title: MYD88-dependent TLR4 signaling pathway leading to NF-kappa-B activation (Human)
          notes: The model types TLR4 with the generic parent GO:0038023 signaling receptor activity and
            does not include MD-2; this module uses GO:0001875 on the TLR4-MD-2 complex.
        - model: gomodel:6413ac9800000654
          activity: gomodel:6413ac9800000654/6413ac9800000655
