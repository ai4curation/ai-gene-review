      label: TLR4 adaptor branches
      module_type: REGULATORY_STEP
      description: TLR4 is the only TLR that uses both adaptor pairs, from two compartments in sequence.
      variant_sets:
      - id: tlr4_adaptor_pair
        label: Adaptor pair and compartment
        axis: sorting adaptor pair and signaling compartment
        selection: ONE_OR_MORE
        notes: The MyD88 branch signals from the plasma membrane first; after endocytosis the TRIF branch
          signals from endosomes. Both normally fire in macrophages.
        evidence:
        - source_id: PMID:18222170
          statement: TLR4 switches to TRIF signaling after relocating to endosomes.
          supporting_text: These results suggest that TLR4 activates TRIF-signaling in endosome/lysosome
            after relocation from the cell surface.
        variants:
        - id: tlr4_myd88_branch
          label: TIRAP-MYD88 branch (plasma membrane)
          module_type: REGULATORY_STEP
          description: TIRAP recruits MYD88 to TLR4 at the plasma membrane; MYD88 recruits IRAK4, leading
            to NF-kappaB activation.
