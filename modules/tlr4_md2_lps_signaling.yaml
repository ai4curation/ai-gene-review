id: MODULE:tlr4_md2_lps_signaling
title: TLR4-MD-2 lipopolysaccharide sensing module
description: Recognition of bacterial lipopolysaccharide (LPS) by the TLR4-MD-2 receptor and its two adaptor
  branches. LBP and CD14 deliver monomeric LPS; MD-2 binds lipid A in its hydrophobic pocket and TLR4
  transmits the signal; the receptor first signals through TIRAP-MYD88 at the plasma membrane and, after
  endocytosis, through TRAM-TRIF from endosomes. This is the module where GO:0001875 lipopolysaccharide
  immune receptor activity belongs.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:19252480
  statement: TLR4 and MD-2 form the LPS-recognising heterodimer.
  supporting_text: Toll-like receptor (TLR) 4 and myeloid differentiation factor 2 (MD-2) form a heterodimer
    that recognizes a common 'pattern' in structurally diverse LPS molecules
module:
  id: tlr4_md2_lps_signaling
  label: TLR4-MD-2 LPS sensing
  module_type: SIGNALING_PATHWAY
  concepts:
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
  context:
    taxa:
    - preferred_term: mammals
      term:
        id: NCBITaxon:40674
        label: Mammalia
  parts:
  - order: 1
    role: ligand delivery
    optional: true
    node:
      id: lipid_ligand_delivery
      label: Lipid-ligand delivery by LBP and CD14
      module_type: TRANSPORT_STEP
      description: Soluble LBP and CD14 bind the acylated ligand and hand it to the receptor; neither
        stays in the signaling complex. Delivery enhances sensitivity but is not strictly required, so
        the step is optional.
      annotons:
      - id: lbp_carrier
        label: LBP lipid carrier
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: LBP
            term:
              id: UniProtKB:P18428
              label: Lipopolysaccharide-binding protein
        function:
          preferred_term: molecular carrier activity
          term:
            id: GO:0140104
            label: molecular carrier activity
          cargo: &id001
          - preferred_term: lipopolysaccharide
            term:
              id: CHEBI:16412
              label: lipopolysaccharide
        locations:
        - &id002
          preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: Extracellular acute-phase carrier that extracts the acylated ligand and transfers
          it onward.
        evidence: &id003
        - source_id: PMID:27986454
          statement: LBP and CD14 both catalyse LPS transfer to TLR4-MD-2.
          supporting_text: LPS transfer to TLR4-MD2 is catalyzed by both LPS binding protein (LBP) and
            CD14
        - source_id: PMID:27986454
          statement: CD14 hands a single LPS molecule to TLR4-MD-2.
          supporting_text: Subsequently, the single LPS molecule bound to CD14 was transferred to TLR4-MD2
            in a TLR4-dependent manner
        gocam_associations:
        - model: gomodel:5f46c3b700001031
          activity: gomodel:5f46c3b700001031/5f46c3b700001032
          title: MYD88-dependent TLR4 signaling pathway leading to NF-kappa-B activation (Human)
          notes: LBP carrier activity; consistent with this module.
      - id: cd14_carrier
        label: CD14 lipid carrier
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: CD14
            term:
              id: UniProtKB:P08571
              label: Monocyte differentiation antigen CD14
        function:
          preferred_term: molecular carrier activity
          term:
            id: GO:0140104
            label: molecular carrier activity
          cargo: *id001
        locations:
        - &id004
          preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        - *id002
        role_description: GPI-anchored and soluble carrier; it cannot signal across the membrane, so it
          is a carrier, not a receptor.
        evidence: *id003
        gocam_associations:
        - model: gomodel:5f46c3b700001031
          activity: gomodel:5f46c3b700001031/5f46c3b700001036
          title: MYD88-dependent TLR4 signaling pathway leading to NF-kappa-B activation (Human)
          notes: CD14 carrier activity; consistent with this module and the CD14 gene review.
  - order: 2
    role: receptor recognition
    node:
      id: tlr4_md2_receptor
      label: TLR4-MD-2 receptor
      module_type: PROTEIN_COMPLEX
      description: MD-2 binds lipid A; LPS then bridges two TLR4-MD-2 units into an m-shaped dimer that
        brings the TLR4 TIR domains together.
      annotons:
      - id: tlr4_md2_lps_receptor
        label: TLR4-MD-2 LPS receptor
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: lipopolysaccharide receptor complex
            term:
              id: GO:0046696
              label: lipopolysaccharide receptor complex
            active_units:
            - id: tlr4_unit
              label: TLR4
              role: Transmembrane signaling chain; does not bind LPS on its own but transmits the signal
                through its TIR domain.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: TLR4
                  term:
                    id: UniProtKB:O00206
                    label: Toll-like receptor 4
              function:
                preferred_term: transmembrane signaling receptor activity
                term:
                  id: GO:0004888
                  label: transmembrane signaling receptor activity
                description: TLR4 alone transmits the signal across the membrane; LPS recognition needs
                  MD-2, so the LPS receptor term belongs to the complex.
            - id: md2_unit
              label: MD-2 (LY96)
              role: Extracellular co-receptor whose hydrophobic pocket binds lipid A.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: LY96
                  term:
                    id: UniProtKB:Q9Y6Y9
                    label: Lymphocyte antigen 96
              function:
                preferred_term: coreceptor activity
                term:
                  id: GO:0015026
                  label: coreceptor activity
                description: Binds lipid A in its hydrophobic pocket and confers LPS responsiveness on
                  TLR4; matches the LY96 gene review (coreceptor activity, contributing to GO:0001875).
        function:
          preferred_term: lipopolysaccharide immune receptor activity
          term:
            id: GO:0001875
            label: lipopolysaccharide immune receptor activity
        processes:
        - preferred_term: toll-like receptor 4 signaling pathway
          term:
            id: GO:0034142
            label: toll-like receptor 4 signaling pathway
        locations:
        - *id004
        role_description: 'The LPS receptor: binding by MD-2, signal transmission by TLR4. CD14 and LBP
          deliver ligand but are not part of it.'
        evidence:
        - source_id: PMID:22532668
          statement: MD-2 binds lipid A directly.
          supporting_text: MD-2 has a unique hydrophobic cavity that directly binds to lipid A, the active
            center of LPS.
        - source_id: PMID:22532668
          statement: TLR4 needs MD-2 to bind LPS.
          supporting_text: TLR4 alone does not directly bind LPS and requires the coreceptor MD-2
        - source_id: PMID:19252480
          statement: LPS induces an m-shaped dimer of TLR4-MD-2-LPS.
          supporting_text: LPS binding induced the formation of an m-shaped receptor multimer composed
            of two copies of the TLR4-MD-2-LPS complex arranged symmetrically
        gocam_associations:
        - model: gomodel:5f46c3b700001031
