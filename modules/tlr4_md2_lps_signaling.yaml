notes: Reference representation for TLR4 LPS sensing. Unlike GO-CAMs 5f46c3b700001031 and 6413ac9800000654,
  it includes MD-2 and puts GO:0001875 on the TLR4-MD-2 complex; unlike 5fb9cc0600000727 and 5fce9b7300000030,
  it does not use GO:0001875 for TLR2 heterodimers (see modules/tlr2_heterodimer_lipopeptide_signaling.yaml).
