    - order: 5
      role: transient ankle links between developing stereocilia
      node:
        id: ush2_ankle_link_complex
        label: USH2 ankle-link complex (USH2A, ADGRV1, WHRN, PDZD7)
        module_type: PROTEIN_COMPLEX
        description: >-
          In developing cochlear hair bundles, ankle links join the bases of neighbouring
          stereocilia. Their extracellular strands are formed by the transmembrane adhesion
          proteins usherin and ADGRV1, whose cytoplasmic tails are held by the PDZ scaffolds
          whirlin (long isoform) and PDZD7 in a condensate at the stereocilium membrane. The
          links exist only during bundle development (about postnatal days 2 to 12 in mouse)
          and are lost as the bundle matures.
        annotons:
          - id: ush2a_ankle_link_strand
            label: Usherin forms an extracellular ankle-link strand
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: USH2A (usherin)
                term:
                  id: UniProtKB:O75445
                  label: Usherin
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilia ankle link
                term:
                  id: GO:0002141
                  label: stereocilia ankle link
            role_description: >-
              The USH2A gene-review core function (structural fibre of the transient ankle
              links). That review places the process at inner ear receptor cell
              differentiation; the stereocilium organization child is used here because the
              ankle links act within the bundle.
            evidence:
              - source_id: PMID:17567809
                statement: Usherin and whirlin colocalise with VLGR1 at the stereocilium base and are lost in Vlgr1-null mice that lack ankle links.
                supporting_text: Here, we show that the transmembrane protein usherin, the putative transmembrane protein vezatin, and the PDZ (postsynaptic density-95/Discs large/zona occludens-1) domain-containing submembrane protein whirlin are colocalized with Vlgr1 at the stereocilia base in developing cochlear hair cells and are absent in Vlgr1-/- mice that lack the ankle links.
              - source_id: PMID:36964137
                statement: USH2A and ADGRV1 are transmembrane adhesion proteins forming the extracellular linkage.
                supporting_text: Meanwhile, both USH2A and ADGRV1 are transmembrane adhesion proteins that form extracellular linkages.
          - id: adgrv1_ankle_link_strand
            label: ADGRV1 forms an extracellular ankle-link strand
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ADGRV1 (VLGR1, GPR98)
                term:
                  id: UniProtKB:Q8WXG9
                  label: Adhesion G protein-coupled receptor V1
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
            processes:
              - preferred_term: inner ear receptor cell stereocilium organization
                term:
                  id: GO:0060122
                  label: inner ear receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilia ankle link
                term:
                  id: GO:0002141
                  label: stereocilia ankle link
            role_description: >-
              The ADGRV1 gene-review ankle-link core function, with its process
              GO:0060122. The review's other core function, G protein-coupled receptor
              activity, is not modelled here: whether ankle-link signalling through the
              receptor shapes the bundle is unresolved (knowledge gap).
            evidence:
              - source_id: PMID:17567809
                statement: VLGR1 makes up the ankle links.
                supporting_text: Several lines of evidence indicate that very large G-protein-coupled receptor 1 (Vlgr1) makes up the ankle links that connect the stereocilia of hair cells at their base.
          - id: whrn_ankle_link_scaffold
            label: Whirlin scaffolds the ankle-link complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WHRN (whirlin, long isoform at the ankle)
                term:
                  id: UniProtKB:Q9P202
                  label: Whirlin
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
            processes:
              - preferred_term: inner ear receptor cell stereocilium organization
                term:
                  id: GO:0060122
                  label: inner ear receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilia ankle link
                term:
                  id: GO:0002141
                  label: stereocilia ankle link
            role_description: >-
              The WHRN gene-review core function for the long isoform in the ankle-link (USH2)
              complex, binding the cytoplasmic PDZ-binding motifs of usherin and ADGRV1.
            evidence:
              - source_id: PMID:17567809
                statement: The four ankle-link proteins interact directly in vitro in a complex scaffolded by whirlin.
                supporting_text: Direct in vitro interactions between these four proteins further support their involvement in a molecular complex associated with the ankle links and scaffolded by whirlin.
              - source_id: PMID:36964137
                statement: WHRN and PDZD7 assemble ADGRV1 and USH2A into the ankle-link complex by phase separation.
                supporting_text: Here we show that WHRN and PDZD7 orchestrate ADGRV1 and USH2A to assemble the ALC through liquid-liquid phase separation (LLPS).
          - id: pdzd7_ankle_link_scaffold
            label: PDZD7 scaffolds the ankle-link complex
