id: MODULE:hair_cell_stereocilium_bundle_organization
title: Hair-cell stereocilium bundle organization — cytoplasmic actin core with espin/plastin-1 cross-linkers, MYO15A-whirlin-EPS8 and MYO3A/MYO3B-espin-like tip length regulation, transient USH2 ankle-link complex, and MYO6/TRIOBP/PTPRQ base and rootlet anchoring; ACTB/ACTG1/ESPN/PLS1/MYO15A/WHRN/EPS8/MYO3A/MYO3B/ESPNL/USH2A/ADGRV1/PDZD7/MYO6/TRIOBP/PTPRQ
description: >-
  The hair bundle of a cochlear or vestibular hair cell is a staircase of stereocilia,
  actin-based protrusions that grow from the apical surface in rows of graded height.
  Each stereocilium is supported by a paracrystalline core of parallel actin filaments
  with their barbed ends at the tip. The core is built from the two cytoplasmic actins,
  beta-actin (ACTB) and gamma-actin (ACTG1), and is held together by actin cross-linkers,
  chiefly espin (ESPN) and plastin-1 (PLS1). The height of each row is set at the tip,
  where actin filaments elongate. The unconventional motor myosin XVa (MYO15A) carries
  the PDZ scaffold whirlin (WHRN) and the actin regulator EPS8 to the tips of the
  stereocilia; this tip complex is needed for the stereocilia to elongate. A second pair
  of plus-end-directed motors, the kinase-myosins MYO3A and MYO3B, carry espin-1 and
  espin-like (ESPNL) to the tips and limit or tune stereocilia length. During bundle
  development, ankle links join the bases of neighbouring stereocilia; they are formed
  by the large transmembrane proteins usherin (USH2A) and ADGRV1 (VLGR1), anchored on the
  cytoplasmic side by the PDZ scaffolds whirlin and PDZD7, and disappear as the bundle
  matures. At the base, each stereocilium tapers and continues into the cuticular plate
  as a dense actin rootlet; the rootlet is bundled by TRIOBP, the minus-end-directed
  myosin VI (MYO6) is needed to anchor the apical membrane to the cuticular plate and
  keep stereocilia separate, and the phosphoinositide phosphatase PTPRQ forms the shaft
  connectors near the base and is needed for bundle maturation. Variants in most of
  these genes cause hereditary hearing loss: MYO15A (DFNB3), WHRN (DFNB31 and Usher
  syndrome type 2D), ESPN, MYO3A (DFNB30), ACTG1 (DFNA20/26), MYO6, TRIOBP (DFNB28),
  PTPRQ, PLS1, and USH2A, ADGRV1 and PDZD7 (Usher syndrome type 2 and its modifiers).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001503
    title: auditory mechanotransduction pathway
    statement: >-
      The RGD record and diagram for this pathway describe the bundle architecture that this
      module covers, and its human gene list (RGD GAF homo_genes_pw) includes all twelve genes
      that modules/hair_cell_mechanotransduction.yaml left out as bundle builders: ACTB, ACTG1,
      ESPN, PLS1, PLS3, MYO15A, WHRN, MYO3A, PTPRQ, USH2A, ADGRV1 and MYO6. The record says the
      stereocilium core is cross-linked actin with a 2:1 ratio of gamma to beta actin,
      cross-linked by Espn, Pls1 and Pls3; places Myo15a, whirlin (Dfnb31) and Myo3a with its
      partner espin near the lower tip-link density; places Gpr98 (Vlgr1, now ADGRV1), Ush2a and
      Ptprq at the stereocilium base; and places Myo6 in the cuticular plate. The module covers
      this part of PW:0001503; the transduction part is covered by hair_cell_mechanotransduction.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (module seed PW:0001503;
      pathways/PW_0001503.yaml).
  - source_id: GO:0060122
    title: inner ear receptor cell stereocilium organization
    statement: >-
      The GO process that this module realises: assembly, arrangement and disassembly of the
      stereocilia of inner ear receptor cells, covering both auditory (GO:0060088 auditory
      receptor cell stereocilium organization) and vestibular (GO:0060121) hair cells, which
      are its two is_a children. GO:0060122 is itself part_of inner ear receptor cell
      development. It is the process named in the WHRN core function and in the ADGRV1
      ankle-link core function; PDZD7 and PLS1 carry the auditory child. The PW:0001503
      mapping (GO:0050910) belongs to the transduction module, not to this one.
  - source_id: PMID:20976199
    title: β-actin and γ-actin are each dispensable for auditory hair cell development but required for Stereocilia maintenance.
    statement: The stereocilium core is built from the two cytoplasmic actins.
    supporting_text: Hair cell stereocilia structure depends on actin filaments composed of cytoplasmic β-actin and γ-actin isoforms.
  - source_id: PMID:36964137
    title: Temporal and spatial assembly of inner ear hair cell ankle link condensate through phase separation.
    statement: Bundle architecture depends on the ankle links, which the four USH2 proteins anchor.
    supporting_text: Development of the characteristic architecture of stereocilia relies on the coordination of ankle links, which are anchored to stereocilia by the USH2 proteins WHRN, PDZD7, ADGRV1, and USH2A.
notes: >-
  Derivation. Split out of the RGD Pathway Ontology record PW:0001503 (auditory
  mechanotransduction pathway) through the RGD_PATHWAY_ONTOLOGY project. When
  modules/hair_cell_mechanotransduction.yaml was drafted from that record, its decision (3)
  left twelve bundle-building genes for a stereocilium-organization module, and
  projects/RGD_PATHWAY_ONTOLOGY.md lists that module as a candidate follow-up. This is that
  module. All twelve genes are on RGD's human list for PW:0001503 (checked in the RGD GAF
  homo_genes_pw), so PW:0001503 is cited as an evidence source: the module covers its
  bundle-architecture part. No other PW term covers stereocilium organization; the Usher
  syndrome disease pathway in PW names several of these genes but is a disease pathway and is
  not cited. GO:0060122 is the process; it has no curated PW mapping, because the PW:0001503
  mapping (GO:0050910) belongs to the transduction module. Of the twelve, eleven are modelled
  (ACTB, ACTG1, ESPN, PLS1, MYO15A, WHRN, MYO3A, PTPRQ, USH2A, ADGRV1, MYO6) and PLS3 is
  excluded (decision 2). Five proteins not on the RGD list are added: EPS8, MYO3B, ESPNL,
  PDZD7 and TRIOBP.
  Relation to hair_cell_mechanotransduction. The bundle built here is where transduction
  happens: the tip link, the MET channel and the upper tip-link density of that module sit on
  the stereocilia whose height, staircase and stiffness this module sets. That module models
  detection (GO:0050910, GO:0050973) and this one models construction and maintenance
  (GO:0060122); neither is a step of the other, so no module_ref part is used in either
  direction. Shared genes are split by role: WHRN is here (tip and ankle-link scaffold);
  USH1C, which also bundles F-actin, stays in the transduction module, which models only its
  upper tip-link role. MYO7A, which carries ankle-link proteins to the stereocilia
  (PMID:17567809) and is modelled in the transduction module as the tip-link tensioning
  motor, is not repeated here.
  Boundary decisions.
  (1) Participant rule. Almost every hair-cell gene is needed for a normal bundle, so
  necessity was not enough. Each member was asked which step of building the bundle it does:
  supplying the core polymer (actins), cross-linking it (ESPN, PLS1, TRIOBP), moving cargo to
  the tip or setting tip polymerisation (MYO15A, WHRN, EPS8, MYO3A/MYO3B, ESPNL), forming a
  link between stereocilia (USH2A, ADGRV1, WHRN, PDZD7, PTPRQ), or anchoring the base
  (MYO6). Transcription factors, planar-polarity proteins, the kinocilium and
  hair-cell-fate genes are out of scope even though their loss disrupts the bundle.
  (2) PLS3 excluded. RGD names t-plastin (Pls3) with Espn and Pls1 as core cross-linkers, but
  human PLS3 has no hair-cell row in GOA and no cached paper places it in stereocilia; plastin-1
  is the plastin with hair-cell evidence (PMID:30872814). PLS3 is left out rather than
  modelled on the RGD description alone; a hair-bundle proteomics check could bring it back.
  FSCN2 was considered as a third cross-linker. Its evidence for stereocilia is from mouse
  (the Fscn2 hearing-loss allele); the human GOA rows are retinal (TAS) or by IBA/ISS, so per
  the scope of this human module it is not added.
  (3) Tip complex. MYO15A, WHRN (short isoform) and EPS8 form the elongation complex
  (PMID:15654330, PMID:21236676). GPSM2 and GNAI3, which mouse work places at the tips of the
  tallest row with the MYO15A complex, were not added: human GPSM2 and GNAI3 rows in GOA concern
  spindle orientation and G-protein signalling, and no human stereocilium evidence was found.
  The GNAI3 gene review core functions are G-protein activities with no hair-cell process.
  Other tip proteins (EPS8L2, BAIAP2L2, CAPZB, TWF2) are not modelled.
  (4) Myosin III. MYO3A (on the RGD list) and MYO3B (added) are modelled as two annotons in one
  part, not as a variant set, because the double knockout shows partial redundancy rather than
  alternative use (PMID:26754646). ESPNL is added as the cargo that appears early; espin-1,
  the other cargo, is the ESPN participant of part 2 and is named as a MYO3A target. The
  connection from this part to the actin core is NEGATIVELY_REGULATES, following the title of
  PMID:26754646; the cargo espin-1 can lengthen stereocilia, so the net effect may differ by
  row and stage.
  (5) Ankle links. The USH2 complex (USH2A, ADGRV1, WHRN long isoform, PDZD7) is modelled as
  one part of four annotons, each with its own gene-review core function, rather than as a
  complex with one complex-level activity, because the four members do different things
  (two extracellular strands, two cytoplasmic scaffolds). The links are transient
  (PMID:36964137), which the part description records; the part is not optional, because
  the mature bundle needs them during development. Vezatin (VEZT), named with the complex in
  PMID:17567809, is not added; no human evidence was read. The ADGRV1 review lists GO:0050910
  under its ankle-link core function; the transduction module read that as a developmental
  effect, and this module keeps ADGRV1 to bundle organization, consistent with that reading.
  (6) Base, rootlet and cuticular plate. MYO6 (on the RGD list), TRIOBP (added) and PTPRQ (on
  the RGD list) are modelled. RDX (radixin) was considered and not added: its stereocilium
  evidence is a mouse knockout and localisation at the taper, and no human evidence or cached
  paper was read. ANKRD24 and TPRN, which hold TRIOBP-5 at the rootlet and have gene reviews
  here, are candidates for this part in a revision. PTPRQ is placed here rather than with the
  ankle links because its shaft connectors lie near the base and are distinct from ankle
  links (PMID:14534255). MYO6 is also needed to keep PTPRQ at the base in mouse; that edge is
  not modelled. The MYO6-OTOF interaction drawn by RGD belongs to the synapse and is not
  modelled here either.
  Functions authored without an experimental human GOA row or gene-review core function,
  stated as the rules require: MYO15A microfilament motor activity (human IBA; mouse motor
  kinetics), MYO3B microfilament motor activity (IBA), EPS8 actin binding (IBA/ISS), ESPNL actin
  filament binding (IBA/ISS), PLS1 actin filament binding (TAS/IBA), MYO6 minus-end directed
  microfilament motor activity (human IBA/ISS; direction from the cryo-EM study cited in the GO
  definition), TRIOBP actin-filament cross-linking activity (human IDA is actin filament
  binding; bundling by purified TRIOBP-4), and PTPRQ phosphatidylinositol phosphate
  phosphatase activity (no non-IEA GOA MF row; UniProt function and human kinetics). The
  processes on ACTB, ACTG1, ESPN, USH2A, EPS8, MYO15A, MYO3A/B, ESPNL, TRIOBP and PTPRQ are
  authored for this module; WHRN, ADGRV1, PDZD7 and PLS1 carry them in GOA or their reviews.
  Cochlear versus vestibular. GO:0060122 covers both; most annotons use the auditory child
  GO:0060088 because the cited evidence is cochlear, while ESPN, the actins, ADGRV1 and WHRN in
  the ankle complex use the parent. MYO3B and ESPN-1 evidence includes vestibular hair cells
  (PMID:26926603).
  GO-CAM. No GO-CAM in gocams/index.tsv contains any member of this module or uses GO:0060122,
  GO:0060088, GO:0060121 or GO:0160194, so there are no gocam_associations.
  Ontology. GO:0160194 stereocilium bundle organization is not connected to GO:0060122; an
  edge is requested in proposed_ontology_changes (checked against go-basic release
  2026-07-26). No new GO term is requested: the stereocilium rootlet has no CC term, and
  stereocilium base is used, as in the ANKRD24 review.
  Gene reviews used: ACTB, ACTG1, ESPN, WHRN, USH2A, ADGRV1, PDZD7 and GNAI3 core functions.
  PLS1, PLS3, MYO15A, EPS8, MYO3A, MYO3B, ESPNL, MYO6, TRIOBP, PTPRQ and FSCN2 have no review
  yet. PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: hair_cell_stereocilium_bundle_organization
  label: Hair-cell stereocilium bundle organization
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: inner ear receptor cell stereocilium organization
      term:
        id: GO:0060122
        label: inner ear receptor cell stereocilium organization
      description: >-
        Building, arranging and maintaining the stereocilia of cochlear and vestibular hair
        cells; the auditory and vestibular children are both covered.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Members are grounded on the human proteins. Human evidence is mostly genetic
          (deafness genes) and biochemical; most hair-cell evidence comes from mouse.
    cell_types:
      - preferred_term: cochlear inner hair cell
        term:
          id: CL:0000589
          label: cochlear inner hair cell
      - preferred_term: cochlear outer hair cell
        term:
          id: CL:0000601
          label: cochlear outer hair cell
      - preferred_term: vestibular hair cell
        term:
          id: CL:0000609
          label: vestibular hair cell
    cellular_components:
      - preferred_term: stereocilium bundle
        term:
          id: GO:0032421
          label: stereocilium bundle
        description: >-
          The whole hair bundle; core, tip, ankle-link, base and cuticular-plate locations
          are given on the annotons.
  parts:
    - order: 1
      role: actin core of the stereocilium
      node:
        id: actin_core
        label: Cytoplasmic actin filament core
        module_type: PROTEIN_COMPLEX
        description: >-
          Parallel actin filaments of beta- and gamma-actin, barbed ends at the tip, make up
          the core of each stereocilium. The actins are the structural material of the
          bundle; neither isoform alone is needed for the bundle to develop, but each is
          needed to maintain it.
        annotons:
          - id: actb_stereocilium_core
            label: ACTB is a structural constituent of the stereocilium actin core
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ACTB (beta-actin)
                term:
                  id: UniProtKB:P60709
                  label: Actin, cytoplasmic 1
            function:
              preferred_term: structural constituent of cytoskeleton
              term:
                id: GO:0005200
                label: structural constituent of cytoskeleton
            processes:
              - preferred_term: inner ear receptor cell stereocilium organization
                term:
                  id: GO:0060122
                  label: inner ear receptor cell stereocilium organization
            locations:
              - preferred_term: actin filament bundle of stereocilium
                term:
                  id: GO:0098860
                  label: actin filament bundle of stereocilium
            role_description: >-
              Minor actin isoform of the core (about one third, by the RGD record). The function
              is the ACTB gene-review core function; ACTB carries no stereocilium process row in
              GOA, so the process is authored here from the mouse conditional knockout.
            evidence:
              - source_id: PMID:20976199
                statement: Cytoplasmic actin is needed for stereocilia, but either isoform alone suffices for development.
                supporting_text: We found that, although cytoplasmic actin is necessary, neither β-actin nor γ-actin is required for normal stereocilia development or auditory function in young animals.
          - id: actg1_stereocilium_core
            label: ACTG1 is a structural constituent of the stereocilium actin core
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ACTG1 (gamma-actin)
                term:
                  id: UniProtKB:P63261
                  label: Actin, cytoplasmic 2
            function:
              preferred_term: structural constituent of cytoskeleton
              term:
                id: GO:0005200
                label: structural constituent of cytoskeleton
            processes:
              - preferred_term: inner ear receptor cell stereocilium organization
                term:
                  id: GO:0060122
                  label: inner ear receptor cell stereocilium organization
            locations:
              - preferred_term: actin filament bundle of stereocilium
                term:
                  id: GO:0098860
                  label: actin filament bundle of stereocilium
            role_description: >-
              Major actin isoform of the core. Dominant ACTG1 variants cause progressive
              hearing loss in humans. The function is the ACTG1 gene-review core function; the
              process is authored here, as for ACTB.
            evidence:
              - source_id: PMID:20976199
                statement: Human ACTG1 mutations cause dominant progressive nonsyndromic hearing loss.
                supporting_text: In contrast, several different mutations in human ACTG1 cause dominant progressive hearing loss without other syndromic phenotypes
    - order: 2
      role: actin filament cross-linking in the stereocilium core
      node:
        id: core_cross_linking
        label: Espin and plastin-1 cross-linking of the actin core
        module_type: MOLECULAR_FUNCTION
        description: >-
          Actin-bundling proteins pack the core filaments into a paracrystalline array and
          set stereocilium width. Espin is present along the core and at the tip (espin-1,
          the long isoform, is the MYO3A/MYO3B cargo; see part 4); plastin-1 is the most
          abundant cross-linker of mature stereocilia and is needed to maintain them.
        annotons:
          - id: espn_actin_cross_linking
            label: Espin cross-links stereocilium actin filaments
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ESPN (espin)
                term:
                  id: UniProtKB:B1AK53
                  label: Espin
            function:
              preferred_term: actin-filament cross-linking activity
              term:
                id: GO:7770064
                label: actin-filament cross-linking activity
            processes:
              - preferred_term: inner ear receptor cell stereocilium organization
                term:
                  id: GO:0060122
                  label: inner ear receptor cell stereocilium organization
            locations:
              - preferred_term: actin filament bundle of stereocilium
                term:
                  id: GO:0098860
                  label: actin filament bundle of stereocilium
            role_description: >-
              The function is the ESPN gene-review core function, which rests on bundling by
              purified human espin and on a human deafness deletion that weakens it. The ESPN
              review places the process at microvillar actin bundle assembly; the stereocilium
              process is used here because the same bundling acts in the stereocilium core.
            evidence:
              - source_id: PMID:29572253
                statement: A six-residue deletion in the espin bundling motif cosegregates with Usher-like disease and impairs bundling by purified espin.
                supporting_text: Our functional analyses revealed that the deletion of the six conserved residues impairs the actin bundling function of purified espin protein.
          - id: pls1_actin_cross_linking
            label: Plastin-1 binds and bundles stereocilium actin filaments
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PLS1 (plastin-1)
                term:
                  id: UniProtKB:Q14651
                  label: Plastin-1
            function:
              preferred_term: actin filament binding
              term:
                id: GO:0051015
                label: actin filament binding
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: actin filament bundle of stereocilium
                term:
                  id: GO:0098860
                  label: actin filament bundle of stereocilium
            role_description: >-
              Function from the human GOA rows (TAS and IBA); the process is the human ISS row.
              Cross-linking activity is the expected plastin activity but no human
              hair-cell or biochemical cross-linking assay was read, so the more specific term
              is not asserted. PLS1 variants cause dominant hearing loss in humans.
            evidence:
              - source_id: PMID:30872814
                statement: PLS1 is identified as a dominant hearing-loss gene and is needed to preserve adult stereocilia.
                supporting_text: There is evidence that PLS1 is important in the preservation of adult stereocilia and normal hearing.
    - order: 3
      role: tip-complex delivery and elongation of the actin core
      node:
        id: myo15a_tip_complex
        label: MYO15A-whirlin-EPS8 tip complex
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Myosin XVa moves to the stereocilia tips and delivers its cargo, the short isoform
          of whirlin and the actin regulator EPS8, which together form the elongation complex
          at the barbed ends of the core. Without any one of the three, stereocilia stay
          short and the staircase is lost.
        annotons:
          - id: myo15a_tip_delivery
            label: MYO15A motor delivers whirlin and EPS8 to stereocilia tips
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MYO15A (myosin XVa)
                term:
                  id: UniProtKB:Q9UKN7
                  label: Unconventional myosin-XV
            function:
              preferred_term: microfilament motor activity
              term:
                id: GO:0000146
                label: microfilament motor activity
              targets:
                - preferred_term: WHRN (whirlin)
                  term:
                    id: UniProtKB:Q9P202
                    label: Whirlin
                - preferred_term: EPS8
                  term:
                    id: UniProtKB:Q12929
                    label: Epidermal growth factor receptor kinase substrate 8
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilium tip
                term:
                  id: GO:0032426
                  label: stereocilium tip
            role_description: >-
              Human MYO15A has only an IBA row for microfilament motor activity; the
              experimental motor (ATPase) kinetics are for the mouse MYO15 motor domain. The
              function is therefore authored from the IBA row and the mouse data; there is no
              MYO15A gene review yet. The targets are the delivered cargo.
            evidence:
              - source_id: PMID:15654330
                statement: Myosin XVa binds the third PDZ domain of whirlin and carries it to stereocilia tips.
                supporting_text: Myosin-XVa then delivers whirlin to the tips of stereocilia.
              - source_id: PMID:33372036
                statement: The MYO15 motor domain is an actin-activated ATPase kinetically suited to processive movement.
                supporting_text: These findings are consistent with MYO15 being kinetically adapted for processive motility when oligomerized.
          - id: whrn_tip_scaffold
            label: Whirlin scaffolds the stereocilium tip complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WHRN (whirlin, short isoform at the tip)
                term:
                  id: UniProtKB:Q9P202
                  label: Whirlin
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilium tip
                term:
                  id: GO:0032426
                  label: stereocilium tip
            role_description: >-
              The WHRN gene-review core function for the short C-terminal isoform at the tip,
              where it binds MYO15A and EPS8.
            evidence:
              - source_id: PMID:21236676
                statement: Whirlin also binds EPS8 and is needed for MYO15A and EPS8 to reach the tips.
                supporting_text: We find that Eps8 also interacts with whirlin and that the expression of both Eps8 and MyoXVa at stereocilia tips is reduced in whirlin-deficient mice.
          - id: eps8_tip_actin_regulation
            label: EPS8 regulates actin core elongation at the tip
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EPS8
                term:
                  id: UniProtKB:Q12929
                  label: Epidermal growth factor receptor kinase substrate 8
            function:
              preferred_term: actin binding
              term:
                id: GO:0003779
                label: actin binding
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilium tip
                term:
                  id: GO:0032426
                  label: stereocilium tip
            role_description: >-
              The actin-regulatory element of the tip complex. Human EPS8 has actin binding
              only by IBA and ISS (barbed-end capping and bundling are ISS process rows from
              mouse), so the general binding term is used; there is no EPS8 gene review, and
              the hair-cell evidence is from mouse.
            evidence:
              - source_id: PMID:21236676
                statement: EPS8 is the actin-regulatory component of the MYO15A-whirlin tip complex.
                supporting_text: We conclude that MyoXVa, whirlin, and Eps8 are integral components of the stereocilia tip complex, where Eps8 is a central actin-regulatory element for elongation of the stereocilia actin core.
              - source_id: PMID:21236676
                statement: EPS8 fails to reach the tips without MYO15A.
                supporting_text: We show that Eps8 fails to accumulate at the tips of stereocilia in the absence of MyoXVa
    - order: 4
      role: class III myosin tuning of stereocilium length
      node:
        id: myo3_length_regulation
        label: MYO3A/MYO3B with espin-1 and espin-like
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The plus-end-directed kinase-myosins MYO3A and MYO3B move to the tips and carry
          espin-1 and espin-like (ESPNL), which act on actin at the tips. The motors limit
          the growth of microvilli and stereocilia in development and influence the spacing
          of the staircase; the two paralogs are partly redundant.
        annotons:
          - id: myo3a_tip_motor
            label: MYO3A plus-end-directed motor carries espin-1 and ESPNL to the tips
            participant:
              selector_type: GENE_PRODUCT
