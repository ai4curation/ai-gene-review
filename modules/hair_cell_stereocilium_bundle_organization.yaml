              as the fourth ankle-link protein. In humans PDZD7 variants modify USH2A disease
              and act digenically with ADGRV1.
            evidence:
              - source_id: PMID:36964137
                statement: WHRN, PDZD7, ADGRV1 and USH2A form the ankle-link complex.
                supporting_text: WHRN, PDZD7, ADGRV1 and USH2A have been identified to form the so-called ankle link complex (ALC)
              - source_id: PMID:20440071
                statement: Human genotypes support digenic inheritance of PDZD7 with GPR98 (ADGRV1).
                supporting_text: We validated the human genotypes using zebrafish, and our findings were consistent with digenic inheritance of PDZD7 and GPR98, and with PDZD7 as a retinal disease modifier in patients with USH2A.
    - order: 6
      role: anchoring of the stereocilium base, rootlet and apical membrane
      node:
        id: base_rootlet_anchoring
        label: MYO6, TRIOBP and PTPRQ at the stereocilium base and cuticular plate
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Each stereocilium tapers at its base and its core continues into the cuticular
          plate as a dense rootlet, which makes the pivot stiff and durable. TRIOBP bundles
          the rootlet actin. Myosin VI, the only minus-end-directed myosin, is needed to keep
          the apical membrane anchored to the cuticular plate; without it the stereocilia
          fuse. PTPRQ, a receptor-like phosphoinositide phosphatase, forms the shaft
          connectors near the base and is needed for the cochlear bundle to mature.
        annotons:
          - id: triobp_rootlet_bundling
            label: TRIOBP bundles rootlet actin
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TRIOBP (TRIOBP-4/5 isoforms)
                term:
                  id: UniProtKB:Q9H2D6
                  label: TRIO and F-actin-binding protein
            function:
              preferred_term: actin-filament cross-linking activity
              term:
                id: GO:7770064
                label: actin-filament cross-linking activity
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilium base
                term:
                  id: GO:0120044
                  label: stereocilium base
            role_description: >-
              Authored function: human GOA has actin filament binding (IDA), and the
              cross-linking term rests on the in vitro bundling by purified TRIOBP-4 in the
              cited paper. The rootlet has no GO term; stereocilium base is used, as in the
              ANKRD24 review. TRIOBP is not on the RGD list. Its isoforms 4 and 5 carry all
              known DFNB28 mutations.
            evidence:
              - source_id: PMID:20510926
                statement: Purified TRIOBP-4 packs actin filaments into dense rootlet-like bundles.
                supporting_text: In vitro, purified TRIOBP isoform 4 protein organizes actin filaments into uniquely dense bundles reminiscent of rootlets but distinct from bundles formed by espin, an actin crosslinker in stereocilia.
              - source_id: PMID:20510926
                statement: TRIOBP, the DFNB28 gene, localises to rootlets.
                supporting_text: We found that TRIOBP, a cytoskeleton-associated protein mutated in human hereditary deafness DFNB28, is localized to rootlets.
          - id: myo6_cuticular_plate_anchoring
            label: MYO6 minus-end-directed motor anchors the apical membrane to the cuticular plate
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MYO6 (myosin VI)
                term:
                  id: UniProtKB:Q9UM54
                  label: Unconventional myosin-VI
            function:
              preferred_term: minus-end directed microfilament motor activity
              term:
                id: GO:0060001
                label: minus-end directed microfilament motor activity
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: cuticular plate
                term:
                  id: GO:0032437
                  label: cuticular plate
            role_description: >-
              Authored function. Human MYO6 has microfilament motor activity only by IBA and
              ISS; the minus-end direction was shown for a myosin VI construct by cryo-EM (the
              paper that GO cites in the term definition), which by its MeSH terms was not a
              human-only construct. There is no MYO6 gene review. The anchoring role is the
              Snell's waltzer model; MYO6 also works in endocytosis and vesicle traffic, which
              are outside this module.
            evidence:
              - source_id: PMID:10519557
                statement: Myosin VI moves toward the pointed (minus) end of actin.
                supporting_text: Here we report that myosin VI, an unconventional myosin, moves towards the pointed (-) end of actin.
              - source_id: PMID:10525338
                statement: Without myosin VI the stereocilia become disorganised and fuse.
                supporting_text: Over the next few days, the stereocilia become progressively more disorganised and fuse together.
              - source_id: PMID:10525338
                statement: Myosin VI is proposed to anchor the apical membrane to the cuticular plate.
                supporting_text: One possible model for the fusion is that myosin VI may be involved in anchoring the apical hair cell membrane to the underlying actin-rich cuticular plate
          - id: ptprq_shaft_connectors
            label: PTPRQ forms shaft connectors and dephosphorylates phosphoinositides at the stereocilium base
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PTPRQ
                term:
                  id: UniProtKB:Q9UMZ3
                  label: Phosphatidylinositol phosphatase PTPRQ
            function:
              preferred_term: phosphatidylinositol phosphate phosphatase activity
              term:
                id: GO:0052866
                label: phosphatidylinositol phosphate phosphatase activity
            processes:
              - preferred_term: auditory receptor cell stereocilium organization
                term:
                  id: GO:0060088
                  label: auditory receptor cell stereocilium organization
            locations:
              - preferred_term: stereocilium base
                term:
                  id: GO:0120044
                  label: stereocilium base
            role_description: >-
              Authored function: human GOA has no non-IEA molecular function row for PTPRQ.
              The term follows the UniProt function text and the human kinetic study (PIP3
              preferred, D3 and D5 phosphates removed); the parent term is used because both
              3- and 5-phosphatase reactions are reported. The shaft-connector and maturation
              evidence is from mouse and chick; there is no PTPRQ gene review.
            evidence:
              - source_id: PMID:23897475
                statement: Human PTPRQ prefers PI(3,4,5)P3 as substrate.
                supporting_text: Moreover, subsequent kinetic experiments showed that PTPRQ has a strong preferences for PI(3,4,5)P3 over other PI substrates
              - source_id: PMID:14534255
                statement: Ptprq is needed for shaft connectors and for maturation of cochlear hair bundles.
                supporting_text: These results reveal that Ptprq is required for formation of the shaft connectors of the hair bundle, the normal maturation of cochlear hair bundles, and the long-term survival of high-frequency auditory hair cells.
