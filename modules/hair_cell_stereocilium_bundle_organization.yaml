knowledge_gaps:
  - gap_statement: >-
      Whether the ankle links act only as structural connectors or also signal through the
      ADGRV1 receptor to direct hair-bundle differentiation is not known.
    boundary: >-
      ADGRV1 is modelled only with the structural ankle-link function; its G
      protein-coupled receptor activity is not placed in the module.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Decides whether the ankle-link part is a structural step or also a signalling input to bundle development.
    resolution: >-
      Hair-cell-specific ADGRV1 alleles that keep the ectodomain and ankle links but abolish
      G-protein coupling, with assessment of bundle morphology and the markers lost in
      Vlgr1-null mice.
    provenance:
      - reference_id: PMID:17567809
        supporting_text: The premature disappearance of these cadherin isoforms in the Vlgr1-/- mutant argues in favor of a signaling function of the ankle links in hair bundle differentiation.
  - gap_statement: >-
      What makes the ankle-link complex assemble at the start of bundle development and
      disassemble as the bundle matures is not known.
    boundary: >-
      The ankle-link part is described as transient; no mechanism for its emergence or loss
      is asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Ties the transient part to a developmental timer that the module does not model.
    resolution: >-
      Time-resolved imaging of tagged USH2 proteins in hair cells across the period when ankle
      links form and disappear, combined with perturbation of the phase-separating
      interactions.
    provenance:
      - reference_id: PMID:36964137
        supporting_text: the detailed mechanism underlying the temporal emergence and degeneration of ankle links remains elusive
proposed_ontology_changes:
  - change_type: EDGE_CREATION
    ontology: GO
    about_node:
      id: GO:0060122
      label: inner ear receptor cell stereocilium organization
    subject:
      id: GO:0160194
      label: stereocilium bundle organization
    predicate: BFO:0000050
    justification: >-
      GO:0160194 stereocilium bundle organization (assembly, arrangement or disassembly of a
      sensory hair cell stereocilium bundle) has a single asserted parent, GO:0016043 cellular
      component organization, and no relation to GO:0060122 inner ear receptor cell
      stereocilium organization or its auditory and vestibular children, which describe the
      organization of the stereocilia that make up the bundle. The two branches therefore do
      not meet: an annotation to GO:0060088 cannot be retrieved by a query for bundle
      organization, and the reverse. Organizing a stereocilium of an inner ear hair cell is
      part of organizing its bundle, so a part_of edge from GO:0060122 to GO:0160194 is
      proposed. GO:0160194 is broader in scope (its definition covers any sensory hair cell,
      including lateral-line neuromasts), so part_of rather than is_a is the fitting relation.
    origin: SELF_PROPOSED
    confidence: PROBABLE
    ontology_state_verified: '2026-11-21'
