id: MODULE:plant_tonoplast_transport
title: Tonoplast proton pumping and solute transport in plants
description: The plant vacuole membrane, the tonoplast, carries two proton pumps, the V-ATPase and the
  pyrophosphate-energized H+-PPase, whose gradient drives the uptake of ions and metabolites by antiporters,
  while aquaporins and channels let water and ions move between the cytosol and the vacuole. This module
  is the green-lineage core of tonoplast transport beyond the V-ATPase, written so that it can be evaluated
  in a plant genome.
status: DRAFT
scope: CONCRETE
notes: 'Viridiplantae scope, with Arabidopsis representatives. Read as a satisfiability rule, a genome
  needs the vacuolar H+-pyrophosphatase, a TIP1 aquaporin and a vacuolar NHX exchanger; TPC1, TPK1, CLC-a
  and ALMT9 are optional. The V-ATPase is the separate eukaryote-wide rule vacuolar_atpase_acidification.
  AVP1 and ALMT9 take their subfamily from PANTHER''s release-19 Arabidopsis classification file, because
  the local entries tables list them without one. The CLC-a selector lists Arabidopsis only, AVP1 lists
  Arabidopsis and poplar (in PANTHER''s files) and the NHX selectors Arabidopsis and one rice protein,
  so other green lineages may fail for want of a selector; the TPK1 subfamily also holds animal K2P channels.
  Not modelled: the many other tonoplast transporters (sugar, metal, phosphate and organic-acid carriers)
  and the tonoplast calcium pumps and exchangers.'
