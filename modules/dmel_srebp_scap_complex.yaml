notes: >-
  The Golgi site-1 and site-2 proteases that release SREBP and the COPII machinery are outside
  the module. No molecular function is assigned to SCAP. FlyBase groups realized by this module:
  SREBP-SCAP (FBgg0002067). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_srebp_scap_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
