id: MODULE:dmel_srebp_scap_complex
title: SREBP-SCAP complex in Drosophila melanogaster
description: >-
  SREBP is a membrane-bound basic helix-loop-helix leucine zipper transcription factor held
  in the endoplasmic reticulum by its escort protein SCAP. When lipid levels fall, SCAP carries
  SREBP to the Golgi, where two proteolytic cleavages release the N-terminal transcription
  factor domain, which enters the nucleus and activates genes of lipid synthesis. In Drosophila,
  which cannot make sterols, SREBP processing is controlled by phosphatidylethanolamine rather
  than by sterols, and SREBP mainly regulates fatty acid synthesis.
status: DRAFT
scope: CONCRETE
