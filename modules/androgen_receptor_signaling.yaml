  connections:
  - source: receptor_competence
    target: ligand_response
    connection_type: PROVIDES_INPUT_FOR
    description: The chaperone machinery supplies a ligand-responsive receptor pool; this is not a claim
      that isolated receptor-domain ligand binding always requires chaperones.
    evidence:
    - source_id: PMID:20048054
      statement: Co-chaperone/HSP90 assembly changes the number of androgen-binding competent AR molecules
        in the tested cells.
  - source: ligand_response
    target: nuclear_dna_engagement
    connection_type: PROVIDES_INPUT_FOR
    description: Androgen-dependent receptor conformations support the genomic route. Nuclear availability
      can be regulated without a universal cytoplasm-to-nucleus switch or a fixed order of dimerization
      and import. Receptor activation alone is not sufficient without DNA-binding competence.
    evidence:
    - source_id: PMID:19819965
      statement: The cloned shark receptor combines androgen-responsive localization and ARE reporter
        activity.
    - source_id: PMID:27959439
      statement: Testosterone-responsive mouse AR directly occupies and activates the Aard promoter.
    - source_id: PMID:19574395
      statement: Nuclear AR with a damaged DBD fails genomic function.
    - source_id: PMID:26507457
      statement: Medaka paralogs differ in subcellular localization and ligand-responsive activity.
  - source: nuclear_dna_engagement
    target: coregulator_selection
    connection_type: PROVIDES_INPUT_FOR
    description: The receptor and its regulatory DNA context provide sites for cofactor recruitment; cofactors
      can also associate before DNA binding, so this is a functional connection rather than a strict temporal
      sequence.
    evidence:
    - source_id: PMID:10567563
      statement: SRC1 interacts with AR activation domains.
    - source_id: PMID:9717843
      statement: AR-TIF2 functional interaction depends on the promoter and receptor domains.
    - source_id: PMID:17505061
      statement: Antagonist-bound AR recruits corepressor components at responsive promoters.
  - source: nuclear_dna_engagement
    target: transcriptional_output
    connection_type: PROVIDES_INPUT_FOR
    description: Productive receptor-DNA engagement connects ligand sensing to the genomic transcriptional
      response, together with activation-domain and cellular transcription machinery context.
    evidence:
    - source_id: PMID:27959439
      statement: ChIP/EMSA and reporter assays connect promoter-bound AR to Aard transcription.
    - source_id: PMID:19574395
      statement: DNA-binding-domain disruption uncouples nuclear AR from genomic function.
  - source: fkbp4_route
    target: nuclear_dna_engagement
    connection_type: POSITIVELY_REGULATES
    description: In tested human prostate cancer cells, FKBP52 supports AR dimerization and chromatin
      association. This does not mean it is required for AR import in mouse tissues or every vertebrate.
    evidence:
    - source_id: PMID:34057812
      statement: FKBP52 depletion reduces AR dimerization/chromatin binding while preserving nuclear translocation.
    - source_id: PMID:17142810
      statement: Mouse Fkbp4 knockout preserves AR ligand binding and nuclear entry.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      conditions:
      - preferred_term: tested human prostate cancer cell systems
  - source: fkbp5_route
    target: ligand_response
    connection_type: POSITIVELY_REGULATES
    description: Human FKBP51 can increase the androgen-binding competent AR pool through HSP90/p23 assembly.
      Its inhibitory effect on GR must not be transferred as a universal negative AR edge.
    evidence:
    - source_id: PMID:20048054
      statement: FKBP51 promotes HSP90/p23 complex assembly and increases AR molecules undergoing androgen
        binding.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      conditions:
      - preferred_term: tested prostate cancer cell and xenograft systems
  - source: fkbp5_route
    target: nuclear_dna_engagement
    connection_type: POSITIVELY_REGULATES
    description: Human FKBP51 can support AR dimerization and chromatin binding without being an obligatory
      nuclear-import factor or a universal reproductive requirement.
    evidence:
    - source_id: PMID:34057812
      statement: FKBP51 depletion impairs AR dimer formation and chromatin binding.
    - source_id: PMID:17142810
      statement: Fkbp5-null mouse males lack the tested AR-dependent reproductive defects seen after Fkbp4
        loss.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      conditions:
      - preferred_term: tested human prostate cancer cell systems
  - source: p23_route
    target: ligand_response
    connection_type: POSITIVELY_REGULATES
    description: p23 can enhance AR ligand-binding competence; some effects survive loss of p23-HSP90
      binding, so its contribution is not represented solely as ATPase-cycle regulation.
    evidence:
    - source_id: PMID:22899854
      statement: p23 increases ligand-binding capacity and retains some AR potentiation when HSP90 binding
        is disrupted.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  - source: p23_route
    target: nuclear_dna_engagement
    connection_type: POSITIVELY_REGULATES
    description: p23 supports AR protein stability and occupancy/function at target genes in tested human
      cancer models.
    evidence:
    - source_id: PMID:22899854
      statement: p23 enhances AR occupancy at target promoters.
    - source_id: PMID:41193657
      statement: PTGES3 directly binds AR, regulates protein stability and supports nuclear target-gene
        function.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      conditions:
      - preferred_term: tested prostate cancer models
  - source: ncoa1_route
    target: transcriptional_output
    connection_type: POSITIVELY_REGULATES
    description: SRC1 provides a positive coactivation contribution in the tested promoter contexts. It
      is not a ligand-independent substitute for AR or a universally required SRC paralog.
    evidence:
    - source_id: PMID:10567563
      statement: SRC1 recruitment via AR activation domains supports transcriptional potentiation.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  - source: ncoa2_route
    target: transcriptional_output
    connection_type: POSITIVELY_REGULATES
    description: TIF2 provides a positive coactivation contribution in the tested human AR systems, with
      promoter and cell-context dependence.
    evidence:
    - source_id: PMID:9717843
      statement: TIF2 potentiation is stronger on the complex MMTV promoter than on GRE-TATA.
    - source_id: PMID:17079484
      statement: TIF2 depletion reduces expression of AR-induced genes.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  - source: ncor1_route
    target: transcriptional_output
    connection_type: NEGATIVELY_REGULATES
    description: NCOR1 supplies a repressive regulatory contribution at selected AR-responsive promoters.
      This is not a general prohibition of all AR signaling whenever NCOR1 is present.
    evidence:
    - source_id: PMID:17505061
      statement: Antagonist-bound AR recruits corepressor components.
    - source_id: PMID:20812024
      statement: FBI-1 promotes NCoR recruitment and repression in specific prostate cancer contexts.
    context:
      taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      conditions:
      - preferred_term: antagonist-bound AR or FBI-1-enhanced corepressor recruitment
  notes: All 15 unique exemplars have gene reviews. Human and mouse FKBP identities are retained separately;
    optional cofactor implementations are not interchangeable physiological requirements. A supported
    mammalian-like N/C interaction motif is not demanded of shark AR. HSP70/HOP, nuclear import/export
    machinery, other chromatin factors and ligand metabolism are acknowledged background machinery outside
    the named-member boundary. PANTHER and PAINT evidence supports membership/general molecular functions,
    not automatic assignment of every family member to AR signaling.
  knowledge_gaps:
  - gap_statement: The conserved NR3C4 receptor mechanism does not establish an identical co-chaperone
      or coregulator requirement across jawed vertebrates.
    boundary: Mammalian FKBP and p23 mechanisms are directly tested in selected cells; shark and fish
      assays establish receptor function but not the complete human cofactor implementation.
    gap_kind:
    - BIOLOGY
    status: OPEN
    provenance:
    - reference_id: PMID:19819965
    - reference_id: PMID:17142810
    - reference_id: PMID:34057812
  - gap_statement: Quantitative coupling among chaperone association, receptor oligomerization, nuclear
      availability and chromatin engagement remains context-dependent.
    boundary: No single ordered exchange/import model is asserted. Human prostate cancer studies distinguish
      non-genomic monomer signaling from dimer/oligomer-associated transcription; native medaka localization
      also differs from transfected assays.
    gap_kind:
    - BIOLOGY
    status: OPEN
    provenance:
    - reference_id: PMID:39227594
    - reference_id: PMID:36918573
notes: Independent manual literature and family/member audit. Fifteen audited gene exemplars are retained.
  The generated Falcon report is a discovery aid, not adjudicated evidence. Source caches remain untouched.
  Regulatory edges carry the positive or negative effect supported in the stated experimental context.
  These signs describe quantitative modulation and do not assert sufficient Boolean on/off gates. The file
  is a biological template, not a calibrated executable model.
