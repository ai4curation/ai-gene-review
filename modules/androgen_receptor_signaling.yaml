id: MODULE:androgen_receptor_signaling
title: NR3C4 androgen receptor genomic signaling in characterized jawed vertebrates
description: Full-length NR3C4 receptors couple androgen sensing to nuclear regulatory-DNA recognition
  and transcriptional responses in characterized jawed vertebrates. Cytosolic HSP90 and context-dependent
  co-chaperones support receptor competence. Nuclear availability, cooperative receptor-DNA assembly and
  coregulator recruitment are distinct aspects of the genomic response, not a universally ordered import
  switch. Mammalian FKBP4/FKBP5, p23, NCOA1/NCOA2 and NCOR1 provide experimentally grounded optional implementations.
  Fish paralogs differ in localization, ligand response and native physiological requirement. Steroid
  synthesis/transport, non-NR3C4 androgen sensors, non-genomic monomer signaling and ligand-binding-domain-deficient
  cancer variants lie outside this module.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:39208923
  statement: Current structural synthesis supports domain cooperation and conformational plasticity rather
    than a single rigid receptor cycle.
- source_id: PMID:19819965
  statement: Comparative phylogeny and receptor assays ground the jawed-vertebrate NR3C4 scope.
- source_id: PMID:39227594
  statement: Non-genomic monomer activity is a demonstrated alternative mode, excluded from the genomic
    boundary rather than denied.
- source_id: PMID:32449767
  statement: Coregulator abundance and context shape transcriptional outcomes.
- source_id: PANTHER:PTN000163527
  statement: Retained legacy PTHR11528 PAINT provenance for ATP binding, ATP hydrolysis and folding. This
    is general HSP90 evidence, not proof of AR-specific signaling or cellular location.
- source_id: PANTHER:PTN000163629
  statement: Retained legacy PTHR11528 PAINT provenance for cytosolic/complex roles and stabilization.
    Direct AR links are supported by the separately cited primary studies.
- source_id: PANTHER:PTN002471265
  statement: Retained legacy FKBP PAINT provenance for PPIase and protein folding, present in PTHR10516/PTHR46512
    caches. It does not establish the sign, target receptor or physiological requirement of regulation.
module:
  id: androgen_receptor_signaling
  label: NR3C4 androgen-responsive genomic signaling
  module_type: SIGNALING_PATHWAY
  description: A taxon-bounded genomic receptor template with contextual mammalian co-chaperone and coregulator
    implementations. Connections describe material or regulatory contributions, not sufficient Boolean
    switches or an invariant temporal ordering.
  concepts:
  - preferred_term: androgen receptor signaling pathway
    term:
      id: GO:0030521
      label: androgen receptor signaling pathway
  context:
    taxa:
    - preferred_term: Gnathostomata
      term:
        id: NCBITaxon:7776
        label: Gnathostomata <vertebrates>
      description: Evidence envelope for the characterized NR3C4 genomic response in jawed vertebrates,
        spanning mammal, ray-finned fish and shark exemplars. This does not assert identical ligands,
        cofactors, localization or physiological requirements in every descendant.
    cellular_components:
    - preferred_term: cytosol
      term:
        id: GO:0005829
        label: cytosol
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
    evidence:
    - source_id: PMID:19819965
      statement: Phylogenetic and functional comparison places characterized NR3C4 receptors before the
        cartilaginous/bony-fish split and distinguishes teleost duplication.
    - source_id: PMID:36918573
      statement: Native medaka paralog functions demonstrate limits on transferring mammalian physiology.
  parts:
  - order: 1
    role: receptor competence
    node:
      id: receptor_competence
      label: Receptor maturation and context-dependent co-chaperones
      module_type: REGULATORY_STEP
      description: Cytosolic HSP90 supports full-length receptor competence. The named FKBP and p23 implementations
        are optional choices in this cross-taxon template; optional does not mean dispensable in every
        assayed cell. GR maturation structures or immunophilin-exchange/import experiments are comparative
        evidence and are not direct proof of an identical AR complex.
      annotons:
      - id: hsp90_activity
        label: ATP-dependent HSP90 client maturation
        participant:
          selector_type: FAMILY
          family:
            preferred_term: cytosolic HSP90 chaperones participating in AR maturation
            representative_members:
            - preferred_term: HSP90AA1 (Homo sapiens)
              term:
                id: UniProtKB:P07900
                label: Heat shock protein HSP 90-alpha
              description: A cytosolic HSP90 exemplar. General HSP90-complex experiments do not prove
                that HSP90AA1 is the sole isoform required for AR in every tissue.
            term:
              id: PANTHER:PTHR11528
              label: HEAT SHOCK PROTEIN 90 FAMILY MEMBER
            description: The parent family also contains proteins with other cellular/client roles. The
              cytosolic AR-client constraint is required; family membership alone does not assign this
              pathway.
          required_function:
            preferred_term: cytosolic ATP-dependent chaperoning of full-length NR3C4 receptors
            term:
              id: GO:0140662
              label: ATP-dependent protein folding chaperone
            description: The GO term supplies the general molecular capability. The stated family identity
              and AR-specific contextual role further constrain this module selection.
        function:
          preferred_term: ATP-dependent protein folding chaperone
          term:
            id: GO:0140662
            label: ATP-dependent protein folding chaperone
        role_description: Maintains a receptor pool competent for ligand response through the co-chaperone-regulated
          ATPase cycle. This represents client maturation, not an invariant requirement for every assay
          of an isolated receptor domain.
        evidence:
        - source_id: PMID:20048054
          statement: Recombinant HSP90/co-chaperone assembly and cellular AR assays connect the chaperone
            complex to androgen-binding competence.
        - source_id: file:human/HSP90AA1/HSP90AA1-ai-review.yaml
          statement: The target review independently supports the HSP90AA1 ATP-dependent chaperone function
            while distinguishing it from isoform-unspecific AR evidence.
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
      variant_sets:
      - id: cochaperone_implementations
        label: Selected mammalian co-chaperone contributions
        axis: co-chaperone identity and cell context
        selection: ZERO_OR_MORE
        variants:
        - id: fkbp4_route
          label: FKBP4-associated receptor regulation
          module_type: REGULATORY_STEP
          description: A selected mammalian implementation, not a required step in every jawed-vertebrate
            AR response.
          annotons:
          - id: fkbp4_activity
            label: FKBP52 context-dependent co-chaperone activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FKBP52/FKBP4 co-chaperone orthologs
                representative_members:
                - preferred_term: FKBP4 (Homo sapiens)
                  term:
                    id: UniProtKB:Q02790
                    label: Peptidyl-prolyl cis-trans isomerase FKBP4
                  description: Human prostate cancer cell experiments support AR dimerization/chromatin
                    effects; they do not establish a universal nuclear-import requirement.
                - preferred_term: Fkbp4 (Mus musculus)
                  term:
                    id: UniProtKB:P30416
                    label: Peptidyl-prolyl cis-trans isomerase FKBP4
                  description: Native knockout evidence distinguishes physiological requirement from human
                    tumor-cell potentiation. Fkbp4 loss impairs selected androgen-dependent tissues while
                    AR binding and nuclear translocation remain intact.
                term:
                  id: PANTHER:PTHR10516:SF25
                  label: PEPTIDYL-PROLYL CIS-TRANS ISOMERASE FKBP4
                description: PANTHER19.0 places the human and mouse exemplars in this subfamily; current
                  UniProt places them in shared PTHR46512:SF9 (PEPTIDYLPROLYL ISOMERASE). Both placements
                  are supported. The release subfamily preserves FKBP4/FKBP5 identity without claiming
                  identical effects across steroid receptors.
              required_function:
                preferred_term: HSP90-associated modulation of NR3C4 receptor complexes
                term:
                  id: GO:0031072
                  label: heat shock protein binding
                description: The GO term supplies the general molecular capability. The stated family
                  identity and AR-specific contextual role further constrain this module selection.
            function:
              preferred_term: heat shock protein binding in receptor co-chaperone complexes
              term:
                id: GO:0031072
                label: heat shock protein binding
            role_description: A co-chaperone role with receptor- and context-dependent effects. PPIase
              activity is independently established but its catalytic requirement is not assumed for every
              AR response.
            evidence:
            - source_id: PMID:34057812
              statement: Depletion of either FKBP51 or FKBP52 reduces AR dimerization and chromatin binding
                in human prostate cancer cells without blocking nuclear translocation.
            - source_id: PMID:17142810
              statement: Native mouse knockouts establish distinct reproductive requirements for Fkbp4
                and Fkbp5; loss of Fkbp4 does not abolish AR hormone binding or nuclear entry.
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            notes: The shared molecular-function level follows both mammalian gene reviews. Human HSP90
              binding is more specifically supported; mouse evidence establishes HSP90/receptor-complex
              association without independently resolving every binary contact.
          context:
            taxa:
            - preferred_term: Homo sapiens
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            - preferred_term: Mus musculus
              term:
                id: NCBITaxon:10090
                label: Mus musculus
            notes: The named implementations are experimentally grounded in these mammals; the whole vertebrate
              clade is not assigned their exact native requirement.
        - id: fkbp5_route
          label: FKBP5-associated receptor regulation
          module_type: REGULATORY_STEP
          description: A selected mammalian implementation, not a required step in every jawed-vertebrate
            AR response.
          annotons:
          - id: fkbp5_activity
            label: FKBP51 context-dependent co-chaperone activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FKBP51/FKBP5 co-chaperone orthologs
                representative_members:
                - preferred_term: FKBP5 (Homo sapiens)
                  term:
                    id: UniProtKB:Q13451
                    label: Peptidyl-prolyl cis-trans isomerase FKBP5
                  description: Human prostate cancer cell experiments support AR dimerization/chromatin
                    effects; they do not establish a universal nuclear-import requirement.
                - preferred_term: Fkbp5 (Mus musculus)
                  term:
                    id: UniProtKB:Q64378
                    label: Peptidyl-prolyl cis-trans isomerase FKBP5
                  description: Native knockout evidence distinguishes physiological requirement from human
                    tumor-cell potentiation. Fkbp5-null males lack the Fkbp4-null reproductive phenotype;
                    this is not evidence that human FKBP51 inhibits AR.
                term:
                  id: PANTHER:PTHR10516:SF26
                  label: PEPTIDYL-PROLYL CIS-TRANS ISOMERASE FKBP5
                description: PANTHER19.0 places the human and mouse exemplars in this subfamily; current
                  UniProt places them in shared PTHR46512:SF9 (PEPTIDYLPROLYL ISOMERASE). Both placements
                  are supported. The release subfamily preserves FKBP4/FKBP5 identity without claiming
                  identical effects across steroid receptors.
              required_function:
                preferred_term: HSP90-associated modulation of NR3C4 receptor complexes
                term:
                  id: GO:0031072
                  label: heat shock protein binding
                description: The GO term supplies the general molecular capability. The stated family
                  identity and AR-specific contextual role further constrain this module selection.
            function:
              preferred_term: heat shock protein binding in receptor co-chaperone complexes
              term:
                id: GO:0031072
                label: heat shock protein binding
            role_description: A co-chaperone role with receptor- and context-dependent effects. PPIase
              activity is independently established but its catalytic requirement is not assumed for every
              AR response.
            evidence:
            - source_id: PMID:34057812
              statement: Depletion of either FKBP51 or FKBP52 reduces AR dimerization and chromatin binding
                in human prostate cancer cells without blocking nuclear translocation.
            - source_id: PMID:17142810
              statement: Native mouse knockouts establish distinct reproductive requirements for Fkbp4
                and Fkbp5; loss of Fkbp4 does not abolish AR hormone binding or nuclear entry.
            - source_id: PMID:20048054
              statement: FKBP51 promotes p23 recruitment to ATP-bound HSP90 and increases androgen-binding
                competent AR in prostate cancer models.
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            notes: The shared molecular-function level follows both mammalian gene reviews. Human HSP90
              binding is more specifically supported; mouse evidence establishes HSP90/receptor-complex
              association without independently resolving every binary contact.
          context:
            taxa:
            - preferred_term: Homo sapiens
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            - preferred_term: Mus musculus
              term:
                id: NCBITaxon:10090
                label: Mus musculus
            notes: The named implementations are experimentally grounded in these mammals; the whole vertebrate
              clade is not assigned their exact native requirement.
        - id: p23_route
          label: p23/PTGES3-associated receptor regulation
          module_type: REGULATORY_STEP
          annotons:
          - id: p23_activity
            label: p23-mediated receptor maturation and stabilization
            participant:
              selector_type: FAMILY
              family:
                preferred_term: p23/PTGES3 HSP90 co-chaperones
                representative_members:
                - preferred_term: PTGES3 (Homo sapiens)
                  term:
                    id: UniProtKB:Q15185
                    label: Prostaglandin E synthase 3 / p23
                  description: Direct human AR evidence includes ligand-binding competence, promoter occupancy
                    and protein stability. Some effects persist when p23 cannot bind HSP90; prostaglandin
                    synthesis is a distinct function outside this module.
                term:
                  id: PANTHER:PTHR22932:SF3
                  label: PROSTAGLANDIN E SYNTHASE 3
              required_function:
                preferred_term: p23-mediated regulation of AR maturation or stability
                term:
                  id: GO:0051879
                  label: Hsp90 protein binding
                description: The GO term supplies the general molecular capability. The stated family
                  identity and AR-specific contextual role further constrain this module selection.
            function:
              preferred_term: Hsp90 protein binding
              term:
                id: GO:0051879
                label: Hsp90 protein binding
            role_description: p23 binds ATP-bound HSP90 and also supports AR through partly HSP90-independent
              interactions. The binding MF captures the co-chaperone aspect; it does not assert that all
              AR effects require HSP90 binding.
            evidence:
            - source_id: PMID:10543959
              statement: p23 binds ATP-bound HSP90 and also has independent anti-aggregation activity.
            - source_id: PMID:22899854
              statement: Human p23 increases AR ligand-binding capacity and promoter occupancy; an HSP90-binding-defective
                mutant retains some AR potentiation.
            - source_id: PMID:41193657
              statement: Human prostate cancer experiments establish direct PTGES3-AR binding, AR protein
                stabilization and nuclear target-gene function.
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
          context:
            taxa:
            - preferred_term: Homo sapiens
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            notes: Direct target mechanism is supported in the stated human receptor/cell systems; universal
              cofactor necessity is not inferred.
        evidence:
        - source_id: PMID:17142810
          statement: Mouse genetics distinguishes FKBP52 requirement from FKBP51 dispensability in the
            tested reproductive traits.
        - source_id: PMID:34057812
          statement: Human prostate cancer cells display positive AR effects of both FKBPs.
  - order: 2
    role: androgen sensing
    node:
      id: ligand_response
      label: Androgen sensing and receptor conformational response
      module_type: REGULATORY_STEP
      description: Ligand recognition changes receptor conformation and regulatory interactions. This
        node is restricted to the full-length ligand-responsive route; constitutively active LBD-deficient
        variants, pharmacological promiscuity and other androgen sensors are outside its scope.
      annotons:
      - id: ar_ligand_activity
        label: Ligand-responsive NR3C4 receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: NR3C4 androgen receptors, including teleost ara/arb paralogs
            representative_members:
            - preferred_term: AR (Homo sapiens)
              term:
                id: UniProtKB:P10275
                label: Androgen receptor
              description: Full-length ligand-responsive NR3C4 is the exemplar; LBD-deficient splice products
                and disease mutants need separate conditions.
            - preferred_term: Ar (Mus musculus)
              term:
                id: UniProtKB:P19091
                label: Androgen receptor
              description: Native Sertoli-cell DNA-binding-domain disruption and Aard promoter assays
                support genomic AR function; nuclear localization alone is insufficient.
            - preferred_term: ara (Oryzias latipes)
              term:
                id: UniProtKB:D1MV72
                label: Androgen receptor alpha
              description: D1MV72 is the AB252233/chromosome-10 paralog. Reporter localization and native
                tissue localization differ; native anal-fin Ara is cytoplasmic despite constitutive nuclear
                localization in some transfected assays.
            - preferred_term: arb (Oryzias latipes)
              term:
                id: UniProtKB:D1MV73
                label: Androgen receptor beta
              description: D1MV73 is the AB252679/chromosome-14 paralog. Native functions overlap with
                and differ from ara; double mutants retain functional sperm despite impaired reproductive
                behavior and secondary sexual traits.
            - preferred_term: AR (Chiloscyllium punctatum)
              term:
                id: UniProtKB:D0VX34
                label: Androgen receptor
              description: D0VX34 is the experimentally cloned shark AR AB213019. Androgen-responsive
                reporter activity and ligand-dependent localization were measured in heterologous cells,
                not native knockout animals.
            - preferred_term: ar (Danio rerio)
              term:
                id: UniProtKB:A4GT83
                label: Androgen receptor
              description: A4GT83 is the characterized zebrafish receptor; testosterone and 11-ketotestosterone
                support binding/transactivation. Weak high-concentration cortisol activity does not establish
                a physiological glucocorticoid pathway.
            description: PANTHER PTHR48092 contains these accessions but is a broader nuclear-receptor
              grouping with official name KNIRPS-RELATED PROTEIN-RELATED. No PANTHER ID is asserted to
              mean NR3C4 itself. The free family intent, curated accessions and comparative phylogeny
              define this selector.
          required_function:
            preferred_term: androgen binding by NR3C4 receptors
            term:
              id: GO:0005497
              label: androgen binding
            description: The GO term supplies the general molecular capability. The stated family identity
              and AR-specific contextual role further constrain this module selection.
        function:
          preferred_term: androgen binding
          term:
            id: GO:0005497
            label: androgen binding
          description: This annoton represents ligand recognition; the separate transcription annoton
            represents nuclear steroid receptor activity.
        role_description: Full-length receptors bind and respond to androgens. Testosterone, dihydrotestosterone
          and fish 11-ketotestosterone are experimentally relevant in different receptor/taxon contexts;
          they are not asserted as an identical ligand set or potency ranking for every exemplar.
        evidence:
        - source_id: PMID:3353726
          statement: The cloned human receptor binds androgens specifically with high affinity.
        - source_id: PMID:18469035
          statement: The cloned zebrafish receptor supports androgen binding and transactivation, including
            testosterone and 11-ketotestosterone.
        - source_id: PMID:19819965
          statement: The cloned shark receptor responds to classical androgens in an ARE reporter assay;
            conserved ligand-contact residues and receptor-dependent responses support inferred androgen
            binding, rather than a direct affinity measurement.
        - source_id: PMID:26507457
          statement: Medaka ara and arb encode functional androgen-responsive receptors with different
            transactivation and localization properties. Ligand binding is inferred from receptor/domain
            evidence here; direct binding is separately measured for the zebrafish exemplar.
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
  - order: 3
    role: nuclear DNA engagement
    node:
      id: nuclear_dna_engagement
      label: Nuclear availability and response-element engagement
      module_type: REGULATORY_STEP
      description: The genomic route requires nuclear access, which may involve ligand-dependent redistribution
        or a pre-existing nuclear receptor pool. No obligatory FKBP51-to-FKBP52 exchange/import switch
        is asserted. DNA-directed receptor assemblies include dimers and higher-order states; non-genomic
        monomer signaling is excluded rather than denied.
      annotons:
      - id: ar_dna_activity
        label: NR3C4 response-element recognition
        participant:
          selector_type: FAMILY
          family:
            preferred_term: NR3C4 androgen receptors, including teleost ara/arb paralogs
            representative_members:
            - preferred_term: AR (Homo sapiens)
              term:
                id: UniProtKB:P10275
                label: Androgen receptor
              description: Full-length ligand-responsive NR3C4 is the exemplar; LBD-deficient splice products
                and disease mutants need separate conditions.
            - preferred_term: Ar (Mus musculus)
              term:
                id: UniProtKB:P19091
                label: Androgen receptor
              description: Native Sertoli-cell DNA-binding-domain disruption and Aard promoter assays
                support genomic AR function; nuclear localization alone is insufficient.
            - preferred_term: ara (Oryzias latipes)
              term:
                id: UniProtKB:D1MV72
                label: Androgen receptor alpha
              description: D1MV72 is the AB252233/chromosome-10 paralog. Reporter localization and native
                tissue localization differ; native anal-fin Ara is cytoplasmic despite constitutive nuclear
                localization in some transfected assays.
            - preferred_term: arb (Oryzias latipes)
              term:
                id: UniProtKB:D1MV73
                label: Androgen receptor beta
              description: D1MV73 is the AB252679/chromosome-14 paralog. Native functions overlap with
                and differ from ara; double mutants retain functional sperm despite impaired reproductive
                behavior and secondary sexual traits.
            - preferred_term: AR (Chiloscyllium punctatum)
              term:
                id: UniProtKB:D0VX34
                label: Androgen receptor
              description: D0VX34 is the experimentally cloned shark AR AB213019. Androgen-responsive
                reporter activity and ligand-dependent localization were measured in heterologous cells,
                not native knockout animals.
            - preferred_term: ar (Danio rerio)
              term:
                id: UniProtKB:A4GT83
                label: Androgen receptor
              description: A4GT83 is the characterized zebrafish receptor; testosterone and 11-ketotestosterone
                support binding/transactivation. Weak high-concentration cortisol activity does not establish
                a physiological glucocorticoid pathway.
          required_function:
            preferred_term: androgen-responsive NR3C4 nuclear receptor activity
            term:
              id: GO:0003707
              label: nuclear steroid receptor activity
            description: The GO term supplies the general molecular capability. The stated family identity
              and AR-specific contextual role further constrain this module selection.
        function:
          preferred_term: sequence-specific DNA binding
          term:
            id: GO:0043565
            label: sequence-specific DNA binding
        role_description: The receptor DNA-binding domain recognizes regulatory DNA, commonly as a cooperative
          head-to-head dimer at paired ARE half-sites. Nuclear accumulation, oligomerization and DNA occupancy
          are distinct measurements; this grouping does not impose a universal temporal order or make
          nuclear localization sufficient for transcription.
        evidence:
        - source_id: PMID:38604378
          statement: Human AR DBD structures and binding assays demonstrate cooperative binding at natural
            AREs in head-to-head dimer conformations.
        - source_id: PMID:27959439
          statement: Mouse Sertoli-cell ChIP, EMSA and reporter assays connect ligand-bound AR to the
            Aard promoter.
        - source_id: PMID:19574395
          statement: Mouse Sertoli-cell AR lacking its second zinc finger remains nuclear but loses genomic
            function.
        - source_id: PMID:36918573
          statement: Native medaka localization varies by paralog and tissue; transfected-cell localization
            does not define all native tissues.
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
  - order: 4
    role: selected coregulator implementations
    optional: true
    node:
      id: coregulator_selection
      label: Context-dependent coregulator recruitment
      module_type: REGULATORY_STEP
      description: NCOA1, NCOA2 and NCOR1 are selected mammalian implementations, not consecutive enzymes
        or obligatory components of one invariant complex. Other coactivators and chromatin regulators
        are outside the named-member panel. Recruitment through AF1, AF2 and partner-mediated contacts
        depends on receptor construct, ligand, promoter and cell context.
      variant_sets:
      - id: coregulator_implementations
        label: Coactivation and corepression implementations
        axis: coregulator and promoter context
        selection: ZERO_OR_MORE
        variants:
        - id: ncoa1_route
          label: NCOA1 coactivation
          module_type: REGULATORY_STEP
          annotons:
          - id: ncoa1_activity
            label: NCOA1 contextual coactivation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NCOA1 coactivator subfamily
                representative_members:
                - preferred_term: NCOA1 (Homo sapiens)
                  term:
                    id: UniProtKB:Q15788
                    label: Nuclear receptor coactivator 1
                  description: A human contextual coactivator exemplar. No requirement for this named
                    SRC paralog is transferred to all species or all AR-responsive genes.
                term:
                  id: PANTHER:PTHR10684:SF1
                  label: NUCLEAR RECEPTOR COACTIVATOR 1
              required_function:
                preferred_term: AR-associated transcription coactivator activity
                term:
                  id: GO:0003713
                  label: transcription coactivator activity
                description: The GO term supplies the general molecular capability. The stated family
                  identity and AR-specific contextual role further constrain this module selection.
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            role_description: SRC1 can contact AR AF1 through its glutamine-rich region as well as AF2
              through LXXLL motifs. LXXLL mutations retain potentiation in the tested full-length AR system;
              this is not a universal AF1-only rule.
            evidence:
            - source_id: PMID:10567563
              statement: SRC1 interacts with the AR N terminus through a conserved glutamine-rich region
                and with the ligand-binding domain through LXXLL motifs. In the tested constructs,
                an SRC1 mutant lacking functional LXXLL motifs retains AR potentiation.
            - source_id: PMID:10454556
              statement: Target-specific experiments support coactivation with construct, promoter and
                cell-context limits.
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
          context:
            taxa:
            - preferred_term: Homo sapiens
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            notes: Direct target mechanism is supported in the stated human receptor/cell systems; universal
              cofactor necessity is not inferred.
        - id: ncoa2_route
          label: NCOA2 coactivation
          module_type: REGULATORY_STEP
          annotons:
          - id: ncoa2_activity
            label: NCOA2 contextual coactivation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NCOA2 coactivator subfamily
                representative_members:
                - preferred_term: NCOA2 (Homo sapiens)
                  term:
                    id: UniProtKB:Q15596
                    label: Nuclear receptor coactivator 2
                  description: A human contextual coactivator exemplar. No requirement for this named
                    SRC paralog is transferred to all species or all AR-responsive genes.
                term:
