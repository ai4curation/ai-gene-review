id: MODULE:dmel_carnitine_biosynthesis
title: L-carnitine biosynthesis in Drosophila melanogaster
description: >-
  L-carnitine carries long-chain fatty acids into mitochondria for beta-oxidation. In animals
  it is made from N6,N6,N6-trimethyllysine, released by degradation of proteins carrying methylated
  lysines, in four steps. Trimethyllysine dioxygenase (Tmlh) hydroxylates trimethyllysine
  to 3-hydroxy-trimethyllysine; an aldolase cleaves this to 4-trimethylaminobutyraldehyde
  and glycine; an aldehyde dehydrogenase oxidizes the aldehyde to gamma-butyrobetaine; and
  gamma-butyrobetaine dioxygenase hydroxylates gamma-butyrobetaine to carnitine. In Drosophila,
  CG10814 is the homolog of gamma-butyrobetaine dioxygenase, and the aldolase step is attributed
  to the threonine-aldolase-like protein CG10184 and to serine hydroxymethyltransferase (Shmt),
  which in mammals has hydroxytrimethyllysine aldolase activity.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002240
  title: 'FlyBase gene group CARNIBI: L-carnitine biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as l-carnitine biosynthesis (CARNIBI);
    this module models that group.
- source_id: GO:0045329
  title: carnitine biosynthetic process
  statement: >-
    GO term grounding the module as carnitine biosynthetic process.
notes: >-
  Boundary. The module covers the four FlyBase members. The 4-trimethylaminobutyraldehyde
  dehydrogenase step has no FlyBase member and is represented only in the connection between
  the aldolase and hydroxylase steps. Catalytic functions are assigned only to Tmlh; CG10184,
  Shmt and CG10814 carry no function in this module because their carnitine-pathway activities
  have not been shown for the fly proteins. Shmt is also a part of the glycine biosynthesis
  module. FlyBase groups realized by this module: CARNIBI (FBgg0002240). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_carnitine_biosynthesis.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
