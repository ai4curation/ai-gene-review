id: MODULE:dmel_ommochrome_biosynthesis
title: Tryptophan catabolism to ommochrome pigments in Drosophila melanogaster
description: >-
  The brown ommochrome eye pigment xanthommatin is made from tryptophan through the kynurenine
  pathway, which in insects is also the main route of tryptophan catabolism. Tryptophan 2,3-dioxygenase
  (vermilion) opens the indole ring to give N-formylkynurenine, kynurenine formamidase (Kfase)
  releases kynurenine, and kynurenine 3-monooxygenase (cinnabar) hydroxylates it to 3-hydroxykynurenine.
  3-Hydroxykynurenine is imported into pigment granules of the eye and other tissues by the
  White-Scarlet ABC transporter, where it is condensed to xanthommatin; this last step requires
  the heme peroxidase Cardinal. Mutations in v, cn, w, st and cd give the classic eye-colour
  phenotypes that lack or reduce brown pigment.
status: DRAFT
scope: CONCRETE
