notes: >-
  Boundary. The module joins the FlyBase tryptophan catabolism and ommochrome pigment groups,
  which share v, Kfase and cn. White also pairs with Brown to import pteridine (drosopterin)
  precursors; that heterodimer belongs to pteridine pigment synthesis and is not modelled
  here. No molecular function is given to the White-Scarlet transporter, since the exact transported
  substrate has been inferred from genetics rather than transport assays, or to Cardinal,
  which has peroxidase activity by homology but whose precise chemistry in xanthommatin synthesis
  is not settled. Kynurenic acid and other kynurenine side branches are not part of this module.
  FlyBase groups realized by this module: TRYCAT (FBgg0002189), OMMOBI (FBgg0002233). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_ommochrome_biosynthesis.yaml; none of the member genes has a gene
  review yet unless noted.
