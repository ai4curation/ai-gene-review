id: MODULE:dmel_cytoplasmic_dynein_dynactin
title: Cytoplasmic dynein and dynactin in Drosophila melanogaster
description: >-
  Cytoplasmic dyneins are multi-subunit minus-end-directed microtubule motors. Cytoplasmic
  dynein 1, built around the heavy chain Dhc64C, moves organelles, vesicles, mRNAs and chromosomes
  toward microtubule minus ends and acts in spindle assembly, nuclear positioning and oocyte
  polarity. It contains intermediate chains (Short wing, sw), light intermediate chains (Dlic)
  and LC8, Tctex and roadblock families of light chains. Dynein 1 is processive only when
  bound to dynactin and a cargo adaptor. Dynactin is a large complex with a short filament
  of Arp1 capped at the barbed end by capping protein and at the pointed end by a complex
  including Arp10 (Arp11), plus a projecting shoulder and arm formed by p150Glued (DCTN1-p150),
  p50 dynamitin (DCTN2-p50) and p24 (DCTN3-p24). Cytoplasmic dynein 2, with the heavy chain
  Beethoven (btv), drives retrograde intraflagellar transport in the cilia of sensory neurons.
status: DRAFT
scope: CONCRETE
