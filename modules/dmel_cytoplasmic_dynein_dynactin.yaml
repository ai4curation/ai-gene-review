notes: >-
  Boundary. The FlyBase dynein light chain group (DYN-LC) also contains two axonemal light
  chains, ODA-Dnal1 (outer-arm LC1 homolog) and Dnali1 (inner-arm p28 homolog); they are excluded
  here and modelled in dmel_axonemal_dynein_arms. Cargo adaptors (for example BicD), Lis1
  and NudE are regulators and not parts. The dynein 2 intermediate chains and dedicated light
  chains are not in the FlyBase groups and are not modelled. cpa and cpb also form the stand-alone
  actin capping protein (dmel_f_actin_capping_protein). FlyBase groups realized by this module:
  DYNA-C (FBgg0000376), DYNC (FBgg0000378), DYN-LC (FBgg0000382), DYN-LIC (FBgg0000383), DYNC-IC
  (FBgg0000385). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_cytoplasmic_dynein_dynactin.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
