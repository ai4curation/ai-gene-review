      reference_section_type: RESULTS
      supporting_text: All KT2440 assignments are homology-inferred (PE3); there is **no direct KT2440
        experimental OPG characterization** in the retrieved literature.
references:
- id: PMID:26265506
  title: New insights into the biological role of the osmoregulated periplasmic glucans in pathogenic
    and symbiotic bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; comparative review supplies route boundaries, not exact enzyme assignments.
  findings:
  - statement: OPG backbone synthesis includes OpgGH-dependent and Ndv/Chv/Cgs-dependent systems; product
      cyclicity alone does not identify the biosynthetic mechanism.
    supporting_text: either the opgGH operon
  - statement: OPG structural diversity must be retained when sampling taxa; the linear enterobacterial
      product is one realization.
    supporting_text: The OPGs were divided into four families based on their structure
- id: PMID:39976643
  title: Enzymes that catalyze cyclization of β-1,2-glucans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; recent review integrates the 2023 hydrolase and 2024 cyclase discoveries.
      Primary papers independently ground chemistry.
  findings:
  - statement: OpgG and OpgD have different native genetic phenotypes; chain-length control is separable
      from loss of OPG synthesis.
    supporting_text: A ΔopgD strain produces OPG with main chains longer than those of a wild-type strain.
- id: PMID:37735577
  title: Identification of enzymatic functions of osmo-regulated periplasmic glucan biosynthesis proteins
    from Escherichia coli reveals a novel glycoside hydrolase family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; BL21-derived signal-deleted, His-tagged proteins. Exact precursor identity
      to K-12 is verified separately. Measured activity does not establish the native OpgG reaction.
  findings:
  - statement: E. coli OpgG has measurable intrinsic beta-1,2-glucan hydrolysis; weak activity is not
      evidence that the molecular function is absent.
    supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was
      very low
  - statement: OpgG hydrolysis is much slower under the reported comparison, so it must not be silently
      equated with the physiological chain-processing role of OpgD.
    supporting_text: 0.79% at 8.0 mg/mL β-1,2-glucan
  - statement: Purified E. coli OpgD directly hydrolyzes beta-1,2-glucans; this intrinsic reaction is
      distinct from the inferred native chain-length mechanism.
    supporting_text: EcOpgD exhibited hydrolytic activity toward β-1,2-glucans
- id: PMID:38957137
  title: 'Discovery of Anomer-Inverting Transglycosylase: Cyclic Glucohexadecaose-Producing Enzyme from
    Xanthomonas, a Phytopathogen.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; purified recombinant XccOpgD makes a cyclic product. PDB 8X18 source and
      SIFTS identify ATCC 33913 Q8P3C6; construct details require separate inspection.
  findings:
  - statement: XccOpgD alone converts a linear beta-1,2 substrate into the alpha-1,6-closed cyclic hexadecaose;
      GH186 membership cannot grant hydrolase activity uniformly.
    supporting_text: 'XccOpgD, a GH186 homologue from X. campestris pv. campestris, alone

      converts linear β-1,2-glucan into CβG16α specifically.'
- id: PMID:12027885
  title: The opgGIH and opgC genes of Rhodobacter sphaeroides form an operon that controls backbone synthesis
    and succinylation of osmoregulated periplasmic glucans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only at acquisition; genetic participation and complementation are explicit,
      but exact strain and individual chemical steps need further primary-source verification. Subsequent
      publisher Table1 inspection identifies 2.4.1 opgG/opgI/opgH mutants; exact sequence provenance is
      being archived with the gene reviews.
  findings:
  - statement: The Rhodobacter pathway requires an additional OpgI component; a universal two-gene criterion
      would misrepresent this realization.
    supporting_text: 'Inactivation of opgG, opgI or opgH

      abolished OPG production'
  - statement: Rhodobacter genes can yield a different product topology in a heterologous host, so family
      membership alone does not specify the final product.
    supporting_text: abnormally long linear glucans
- id: PMID:12027884
  title: Osmoregulated periplasmic glucans of the free-living photosynthetic bacterium Rhodobacter sphaeroides.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; isolation, mass spectrometry and NMR explicitly characterize the product.
      This establishes chemistry without assigning an individual enzyme to ring closure. Publisher Figure7
      identifies WS8 for the NMR-resolved 18-mer; this is not direct product chemistry on the 2.4.1 gene-panel
      strain.
  findings:
  - statement: The Rhodobacter product predominantly contains eighteen glucose residues, with seventeen
      beta-1,2 linkages and one alpha-1,6 closure.
    supporting_text: 'a single alpha-1,6 glycosidic linkage, whereas all other glucose

      residues are beta-1,2 linked'
- id: PMID:39145657
  title: OpgH is an essential regulator of Caulobacter morphology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; NA1000 CCNA_02097 matches B8GX72. Morphology, active-site mutation and substrate
      accumulation support a functional inference; direct product detection failed.
  findings:
  - statement: Caulobacter provides an OpgH-only comparative boundary, not a demonstrated complete OpgGH
      product-synthesis witness.
    supporting_text: the only opg homolog encoded in Caulobacter is opgH (CCNA_02097)
  - statement: Failure of the E. coli isolation method to detect the Caulobacter product leaves its chemistry
      unresolved; it does not prove product absence.
    supporting_text: we were unable to detect OPGs using these methods
