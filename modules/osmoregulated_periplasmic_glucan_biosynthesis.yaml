id: MODULE:osmoregulated_periplasmic_glucan_biosynthesis
title: OpgH-associated periplasmic glucan synthesis and processing
description: OpgH membrane glucosyltransferases support synthesis of beta-glucan backbones in characterized
  OpgGH-dependent systems. The required native chemical contribution of OpgG remains unresolved. Particular
  realizations additionally need OpgI or a compatible ACP-dependent membrane system. Periplasmic processing
  includes E. coli OpgD hydrolysis and Xanthomonas OpgD alpha-1,6 cyclization, which are distinct reactions
  within the same protein subfamily. Caulobacter OpgH provides a comparative homolog whose native product
  chemistry remains unresolved.
status: COMPLETE
evidence:
- &id001
  source_id: PMID:7934824
  statement: Gene-specific work assigns OpgH to the membrane glucosyltransferase system while OpgG is
    a required periplasmic component with unresolved native chemistry.
  supporting_text: 'MdoH, whose presence was shown to be necessary for normal

    glucosyl transferase activity'
- &id005
  source_id: PMID:9171419
  statement: 'The E. coli membrane-system ACP requirement differs from acyl transfer: the prosthetic group
    is dispensable and tested ACPs differ in compatibility.'
  supporting_text: 'the phosphopantetheine prosthetic group is not required for

    membrane-derived oligosaccharide biosynthesis'
- &id002
  source_id: PMID:1827116
  statement: The assayed membrane system needs UDP-glucose and ACP, with polyprenyl-phosphate effects.
    It does not establish an obligatory polyprenyl-P-glucose intermediate.
  supporting_text: 'the endogenous pool of polyprenyl-P-glucose cannot be an obligate

    intermediate'
- &id008
  source_id: PMID:15175282
  statement: OpgD affects native OPG chain lengths; its loss does not abolish all OPG production.
  supporting_text: mdoD resulted in production of OPGs with a higher degree of polymerization
- &id003
  source_id: PMID:37735577
  statement: OpgG has measured intrinsic hydrolysis, but its native required reaction remains unresolved.
  supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was very
    low
- &id010
  source_id: PMID:38957137
  statement: Xanthomonas OpgD cyclizes a linear beta-1,2 substrate by forming an alpha-1,6 closure; it
    is not assigned the E. coli hydrolytic reaction.
  supporting_text: anomer-inverting transglycosylation mechanism
- &id004
  source_id: PMID:12027885
  statement: The 2.4.1 OpgGIH system needs OpgI in addition to OpgG and OpgH. The molecular work done
    by OpgI remains unknown.
  supporting_text: 'Inactivation of opgG, opgI or opgH

    abolished OPG production'
- &id011
  source_id: PMID:39145657
  statement: Caulobacter OpgH is an informative homolog with glycosyltransferase and morphology evidence
    but unresolved OPG product chemistry.
  supporting_text: we were unable to detect OPGs using these methods
- source_id: PMID:26265506
  statement: OPG backbone synthesis includes OpgGH-dependent and Ndv/Chv/Cgs-dependent systems; product
    cyclicity alone does not identify the biosynthetic mechanism.
  supporting_text: either the opgGH operon
- source_id: PMID:39976643
  statement: OpgG and OpgD have different native genetic phenotypes; chain-length control is separable
    from loss of OPG synthesis.
  supporting_text: A ΔopgD strain produces OPG with main chains longer than those of a wild-type strain.
- &id006
  source_id: PMID:2945202
  statement: Purified ACP substitutes for the soluble factor and antibody inhibition is reversed by added
    ACP, supporting direct cofactor participation in the membrane glucan reaction.
  supporting_text: 'Antibody raised against pure ACP completely inhibits

    transglucosylation activity'
- &id007
  source_id: PMID:3479786
  statement: The OPG-system function persists after removal of phosphopantetheine, so it is distinct from
    ACP-mediated acyl transfer.
  supporting_text: 'nor by complete removal of the

    phosphopantetheine residue'
notes: The required H/G pair describes the OpgGH-associated backbone mechanism, not a sufficient two-gene
  recipe for a native final product. OpgI and ACP are optional at the generic node but obligatory in their
  documented conditional systems. Native endpoint checks must enforce those conditions and compatible
  same-organism partners. The family classifier cannot distinguish SF3 hydrolysis from cyclization, nor
  does SF5 identify an experimentally proven OPG product in Caulobacter. The separate source-scoped capacity
  evaluation must enforce actual activity evidence. The Caulobacter comparator cannot satisfy a native
  OpgGH-product endpoint. Rhodobacter 2.4.1 gene perturbations and WS8 product NMR are distinct experiments.
  Cyclic products do not imply the Ndv/Chv/Cgs route, which is outside this OpgH-associated mechanism.
  The module does not equate failed product detection with absence, infer OpgH-alone sufficiency, assign
  OpgG branching, or make OpgH/FtsZ moonlighting a synthesis requirement. All eleven representative gene
  reviews are complete. The scoped evaluator distinguishes native-process evidence, supplied-substrate
  chemistry and qualified inference; it does not infer arbitrary proteome capacity from family labels.
