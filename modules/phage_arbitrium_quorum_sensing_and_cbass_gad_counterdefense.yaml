id: MODULE:phage_arbitrium_quorum_sensing_and_cbass_gad_counterdefense
title: SPbeta-group Bacillus phage phi3T arbitrium peptide quorum-sensing lysis-lysogeny switch, Gad1 anti-Gabija immune evasion, and host-evasion metabolism
description: 'A viral intercellular communication, immune counter-defense, and nucleotide-provisioning module exemplified
  by the SPbeta-group temperate siphovirus Bacillus phage phi3T (NCBITaxon:10736). The module integrates three functional
  axes that govern phage population dynamics and survival inside Bacillus subtilis hosts: (1) Arbitrium peptide quorum sensing
  (AimP-AimR-AimX), the prototype viral intercellular communication system in which infected Bacillus cells secrete a 43-aa
  prepropeptide (AimP) that is processed by extracellular host proteases into the mature C-terminal hexapeptide SAIRGA ("arbitrium")
  and imported into neighboring cells via the host oligopeptide permease (OPP); at low early-infection concentrations, apo-AimR
  homodimers bind upstream of the non-coding regulatory RNA gene aimX to activate lytic development by inhibiting the phage
  repressor YonR, whereas accumulation of imported SAIRGA across infection rounds binds the TPR-like pocket of AimR, dissociating
  active AimR homodimers into inactive monomers to shut off aimX and switch late-stage infections to lysogeny so that the
  exhausted host population is preserved; (2) Multi-layered anti-defense against bacterial innate immunity, comprising the
  35-kDa Gabija anti-defense protein Gad1, which assembles into an octameric cage (4:4:8 GajAB-Gad1 complex) around the host
  GajAB nucleotide-sensing Toprim endonuclease-helicase complex to sterically block target DNA binding and cleavage, alongside
  the multispecific orphan cytosine-5 DNA methyltransferase M.Phi3TI (MtbP), which methylates the internal cytosine of both
  5''-GGCC-3'' and 5''-GCNGC-3'' motifs to protect the phage genome from host Type II restriction endonucleases without encoding
  a cognate restriction enzyme; and (3) Autonomous dTMP biosynthesis via the phage-encoded folate-dependent thymidylate synthase
  ThyP3, which converts dUMP to dTMP during both lytic replication and prophage-mediated thymidine prototrophy conversion.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:28099413
  title: Communication between viruses guides lysis-lysogeny decisions.
  statement: Discovers the phi3T arbitrium system (AimP hexapeptide SAIRGA, intracellular receptor AimR, and non-coding RNA
    effector AimX) and demonstrates that SAIRGA binding dissociates dimeric AimR into monomers to promote lysogeny.
- source_id: PMID:37992756
  title: Phages overcome bacterial immunity via diverse anti-defence proteins.
  statement: Identifies phi3T Gad1 as an anti-defense protein that counteracts the bacterial Gabija (GajAB) antiviral system
    by blocking DNA cleavage, alongside broad discovery of phage counter-defense families (including Tad, Acb, and Gad).
- source_id: PMID:37992757
  title: Structural basis of Gabija anti-phage defence and viral immune evasion.
  statement: Cryo-EM structure of the 4:4:8 GajAB-Gad1 complex revealing that eight Gad1 subunits form an octameric web encasing
    the host GajAB octamer and sterically occluding the GajA DNA-binding and cleavage site.
- source_id: PMID:3087819
  title: 'DNA methyltransferase genes of Bacillus subtilis phages: comparison of their nucleotide sequences.'
  statement: Characterizes the Bacillus phage phi3T multispecific cytosine-5 methyltransferase gene (mtbP / M.Phi3TI) that
    modifies 5'-GGCC-3' and 5'-GCNGC-3' sites to evade host restriction.
- source_id: PMID:3924741
  title: Nucleotide sequence of the thymidylate synthetase gene (thyP3) from the Bacillus subtilis phage phi 3T.
  statement: Establishes the sequence and function of the phi3T thymidylate synthase gene thyP3 in de novo dTMP biosynthesis
    and lysogenic conversion of thy- Bacillus subtilis hosts.
- source_id: GO:0098689
  title: latency-replication decision
  statement: Defines the regulatory decision between viral lytic replication and establishment of latency (lysogeny).
- source_id: GO:0052170
  title: symbiont-mediated suppression of host innate immune response
  statement: Defines viral counter-defense mechanisms that inhibit host innate antiviral restriction and abortive-infection
    systems.
notes: 'Exemplar phage: Bacillus phage phi3T (NCBITaxon:10736). Generalizes across SPbeta-group Bacillus phages (including
  SPbeta, phi3T, Z, and Wbeta) and related Firmicutes temperate phages that deploy phage-specific arbitrium peptide variants
  (e.g. SAIRGA in phi3T vs GMPRGA in SPbeta), anti-Gabija/anti-CBASS/anti-Thoeris immune-evasion proteins (Gad1, Gad2, Acb1,
  Acb2, Tad1, Tad2), and multispecific orphan C5-methyltransferases.'
