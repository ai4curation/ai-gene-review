id: MODULE:dmel_proteasome
title: 26S proteasome in Drosophila melanogaster
description: >-
  The 26S proteasome degrades proteins tagged with polyubiquitin chains. Its 20S core particle
  is a barrel of four stacked heptameric rings, two outer rings of alpha subunits that gate
  substrate entry and two inner rings of beta subunits, three of which (beta1, beta2 and beta5)
  are N-terminal threonine proteases with caspase-like, trypsin-like and chymotrypsin-like
  specificities. The 19S regulatory particle caps the core. Its base contains six AAA+ ATPases
  (Rpt1-Rpt6) that unfold substrates and open the core gate, together with the scaffolds Rpn1
  and Rpn2. Ubiquitin receptors (Rpn10 and Rpn13) bind ubiquitylated substrates, the lid metalloprotease
  Rpn11 removes ubiquitin chains before degradation, and Uch-L5 bound to Rpn13 trims chains.
  Drosophila has a testis-specific 26S proteasome in which paralogs replace several alpha,
  beta, Rpt, Rpn and Uch-L5 subunits.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000208
  title: 'FlyBase gene group PSM: Proteasome subunits'
  statement: >-
    FlyBase release FB2026_03 groups 50 D. melanogaster genes as proteasome subunits (PSM);
    this module models that group.
- source_id: FB:FBgg0001846
  title: 'FlyBase gene group PSM-V: Proteasome 26s complex variants'
  statement: >-
    FlyBase release FB2026_03 groups 50 D. melanogaster genes as proteasome 26s complex variants
    (PSM-V); this module models that group.
- source_id: GO:0000502
  title: proteasome complex
  statement: >-
    GO term grounding the module as proteasome complex.
notes: >-
  Somatic and testis-specific variants follow the FlyBase groups PSM26S and PSM26S-T; subunits
  shared by both appear in each variant. Prosalpha1R is a member of both FlyBase variant groups.
  The base, lid and ubiquitin-receptor split follows the conserved eukaryotic 19S organisation;
  Rpn10 and Rpn13 are modelled separately because their placement between base and lid is
  not sharply defined. Catalytic activity is asserted only for the canonical beta1 (Prosbeta1),
  beta2 (Prosbeta2) and beta5 (Prosbeta5) subunits; whether the testis paralogs Prosbeta2R1,
  Prosbeta2R2, Prosbeta5R1 and Prosbeta5R2 keep catalytic activity is not asserted. Likewise
  ATPase and deubiquitinase activities are not asserted for the testis paralogs Rpt3R, Rpt4R,
  Rpt6R and Uch-L5R. FlyBase groups realized by this module: PSM (FBgg0000208), PSM-V (FBgg0001846).
  Subgroups folded into it: T1P, PSM20S, PSM19S, PSM20SA, PSM20SB, PSM20SB-NC, RPN, RPT, PSM26S-T,
  PSM26S. Participants were generated from the FlyBase gene-group membership and mapped to
  UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_proteasome.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
