id: MODULE:store_operated_calcium_entry
title: Store-operated calcium entry — STIM1/STIM2 sensing of ER calcium depletion, STIM translocation to ER-plasma membrane junctions, gating of ORAI1/2/3 CRAC channels, with STIMATE support and SARAF-mediated slow calcium-dependent inactivation
description: >-
  Store-operated calcium entry (SOCE) is the calcium influx across the plasma membrane
  that is triggered by depletion of calcium from the endoplasmic reticulum (ER). In
  resting cells the single-pass ER membrane proteins STIM1 and STIM2 bind calcium
  through a luminal EF-hand-SAM region. When ER calcium falls, typically after IP3
  receptor-mediated release, calcium dissociates, the STIM luminal domains unfold and
  oligomerize, and the cytosolic STIM-ORAI activating region (SOAR/CAD) is exposed. The
  STIM oligomers accumulate as puncta in the cortical ER at ER-plasma membrane
  junctions, where they bind and open ORAI channels, the hexameric pore-forming
  subunits of the highly calcium-selective calcium release-activated calcium (CRAC)
  channel. Humans have three ORAI paralogs that form homo- and heteromeric channels;
  ORAI1 dominates the classical CRAC current while ORAI2 and ORAI3 tune its calcium
  sensitivity and inactivation. STIM1 responds to substantial store depletion and STIM2
  to small decreases, which lets STIM2 stabilize basal cytosolic and ER calcium. The ER
  multi-pass protein STIMATE (TMEM110) promotes the STIM1 conformational switch and
  maintains the junctions, and the ER protein SARAF associates with STIM to drive slow
  calcium-dependent inactivation of the entry, limiting store overfilling. The calcium
  entering through ORAI channels refills the ER through SERCA pumps and drives
  calcium-dependent signalling such as calcineurin-NFAT activation in lymphocytes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text and diagram describe store-operated ORAI channels activated by the
      STIM ER calcium sensors (diagram edges ORAIs associated with Stim1 and Stim2, label
      Stim1 --+> ORAIs). This module models that store-operated entry system only; the
      other transport systems of the record are separate modules or unmodelled (see notes).
      Human genes in scope from RGD's list: STIM1 STIM2 ORAI1 ORAI2 ORAI3. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: >-
      The RGD record text gives the mechanism used for the part order: EF-hand calcium
      sensing in the ER, oligomerization, translocation to ER-plasma membrane junctions,
      and coupling to and activation of ORAI channels.
    supporting_text: >-
      upon Ca2+ depletion and dissociation of the ion from the EF-hand domain, the proteins
      oligomerize, translocate to ER-plasma membrane junctions where they couple to and
      activate the channels
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose concept is its descendant GO:0002115 store-operated calcium entry
      (is_a GO:0006816), checked in go-basic 2026-07-26.
  - source_id: GO:0002115
    title: store-operated calcium entry
    statement: >-
      Module concept: a calcium ion entry mechanism in the plasma membrane activated by
      depletion of calcium from the ER store. Carried in GOA by ORAI1, ORAI2, ORAI3, STIM1
      and STIMATE with IDA evidence (QuickGO, November 2026).
  - source_id: PMID:16005298
    title: STIM is a Ca2+ sensor essential for Ca2+-store-depletion-triggered Ca2+ influx.
    statement: >-
      siRNA screen of human signalling proteins identifying STIM1 and STIM2 as the ER
      calcium sensors that connect store depletion to calcium influx.
    supporting_text: Our study suggests that STIM proteins function as Ca(2+) store sensors in the signaling pathway connecting Ca(2+) store depletion to Ca(2+) influx
  - source_id: PMID:16921383
    title: Orai1 is an essential pore subunit of the CRAC channel.
    statement: Selectivity mutants establish ORAI1 as the pore subunit of the CRAC channel.
    supporting_text: These changes in ion selectivity provide strong evidence that Orai1 is a pore subunit of the CRAC channel
  - source_id: PMID:19182790
    title: SOAR and the polybasic STIM1 domains gate and regulate Orai channels.
    statement: A conserved STIM1 fragment (SOAR) is sufficient to activate all three ORAI channels.
    supporting_text: All Orai channels are fully activated by the conserved STIM1 amino acid fragment 344-442, which we termed SOAR (the STIM1 Orai activating region)
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the store-operated entry system;
  modules/plasma_membrane_calcium_extrusion.yaml (drafted in the same batch) is the plasma
  membrane extrusion system. PW:0001139 is the only PW evidence source_id; its sub-pathway
  PW:0001140 (calcium/calcium-mediated signaling) is mentioned here in prose only.


  (1) BOUNDARY: UPSTREAM STORE DEPLETION. ER calcium release through IP3 receptors (ITPR1-3)
  or ryanodine receptors, and ER refilling by SERCA pumps (ATP2A1-3), are upstream and
  downstream context, not parts. They are to be modelled in a planned ER store module,
  er_calcium_store_cycling (not yet existing, so not referenced by module_ref). The
  receptor-PLC-IP3 route that commonly empties the store is in
  modules/gpcr_plc_calcium_pkc_signaling.yaml. Thapsigargin-type store depletion in
  experiments shows that depletion itself, not IP3, is the trigger.


  (2) PARTS. Five parts: (1) ER calcium sensing by STIM1/STIM2 (calcium ion binding);
  (2) STIM oligomerization, translocation to ER-plasma membrane junctions and ORAI gating
  (calcium channel regulator activity); (3) STIMATE support of STIM1 activation; (4) ORAI
  channel calcium conduction (store-operated calcium channel activity), with ORAI1/2/3 as
  a ONE_OR_MORE realizer set because the paralogs form homo- and heteromeric channels; (5)
  SARAF-mediated slow calcium-dependent inactivation. STIM1 and STIM2 each appear twice, in
  the sensing and the gating parts, because each has two separable roles; this follows the
  two core functions of the STIM1 gene review (genes/human/STIM1/).


  (3) REGULATORS ADDED BEYOND RGD'S LIST. STIMATE (TMEM110) and SARAF are not in RGD's
  PW:0001139 gene list. Both are added on direct human evidence: STIMATE from proximity
  proteomics plus functional loss of STIM1 puncta and entry (PMID:26322679, PMID:26644574;
  GOA GO:0005246 and GO:0032237 IDA), SARAF from its identification as the mediator of
  slow calcium-dependent inactivation (PMID:22464749; GOA GO:2001256 IDA). Other reported
  modulators were left out as context without a cached primary source checked in this
  draft: calmodulin (fast calcium-dependent inactivation; STIM2 regulation,
  PMID:17905723), CRACR2A, junctate, septins, the ER-plasma membrane tethers (extended
  synaptotagmins, junctophilins) and the TRPC channels that STIM1 also regulates. The
  ORAI3-containing arachidonate-regulated (ARC) channel is store-independent and outside
  the module.


  (4) MOLECULAR FUNCTIONS. From experimental GOA (QuickGO, November 2026), checked in
  go-basic 2026-07-26: ORAI1 GO:0015279 store-operated calcium channel activity (IDA,
  many papers); ORAI2 and ORAI3 GO:0015279 (IDA PMID:17442569, PMID:19182790, PMID:32415068;
  IMP for ORAI2); STIM1 GO:0005509 calcium ion binding (IDA PMID:16005298) and GO:0005246
  calcium channel regulator activity (IDA PMID:25326555, PMID:26322679; IGI); STIM2
  GO:0005509 (IDA PMID:18166150) and GO:0005246 (IMP PMID:18160041); STIMATE GO:0005246
  (IDA PMID:26322679, PMID:26644574). SARAF has only bare protein binding rows, which are
  not used, so its annoton has no function; its process GO:0106128 negative regulation of
  store-operated calcium entry is authored (GOA has the parent GO:2001256 by IDA from the
  same paper). GO has no calcium channel activator term; the STIM gating annotons use the
  parent GO:0005246 and a new term is requested in proposed_new_terms. The production
  mouse GO-CAMs type Stim1 with GO:0099103 channel activator activity, which is the other
  parent the requested term would have.


  (5) POSSIBLE UPSTREAM ERROR. Human STIM2 carries GO:0015279 store-operated calcium channel
  activity (enables, IDA, PMID:16860747, UniProt). STIM2 is an ER calcium sensor and ORAI
  activator, not a channel, and the cited paper reports overexpressed STIM2 as an
  inhibitor of STIM1-mediated entry. The row looks like a mis-typed activity (calcium
  channel regulator activity would fit) and is not used here; worth reporting to UniProt.
  The inhibitory effect of overexpressed STIM2 contrasts with later work showing STIM2 as
  a positive regulator of basal entry (PMID:18160041); the module follows the latter.


  (6) GO-CAM LINKS. No production human GO-CAM in gocams/index.tsv contains STIM1, STIM2,
  ORAI1-3, STIMATE or SARAF. Mouse Stim1 (GO:0099103 channel activator activity) and Orai1
  (GO:0015279) appear in gomodel:62f58d8800003012 and gomodel:62f58d8800003672 (Positive
  regulation of insulin secretion 2 and 3, Mouse), inside GPCR-PLC signalling chains.
  They are mouse orthologs, so they are recorded here and not pinned as
  gocam_associations on the human annotons. The seed's best_gocam (gomodel:65d7e4ac00002121,
  ITPR1-HSPA9-VDAC1 mitochondrial calcium import in apoptosis) is a gene-overlap lead
  through ITPR1 and is unrelated to this module.


  (7) OTHER PW:0001139 GENES NOT MODELLED HERE. ATP2B1-4, SLC8A1-3 and SLC24A1-5 are in
  the plasma membrane extrusion module. Unmodelled in this batch, by symbol: voltage-gated
  channels CACNA1A CACNA1B CACNA1C CACNA1D CACNA1E CACNA1F CACNA1G CACNA1H CACNA1I CACNA1S
  and auxiliary CACNB1 CACNB2 CACNB3 CACNB4; cyclic nucleotide-gated channels CNGA1 CNGA2
  CNGA3 CNGA4 CNGB1 CNGB3 (the rod and cone channels are in
  modules/visual_phototransduction.yaml); TRPV5 TRPV6; endolysosomal TPCN1 TPCN2 MCOLN1;
  Golgi SPCA pumps ATP2C1 ATP2C2; ER store genes ITPR1 ITPR2 ITPR3 RYR1 RYR2 RYR3 ATP2A1
  ATP2A2 ATP2A3 (planned er_calcium_store_cycling); mitochondrial MCU and SLC8B1.


  (8) GROUNDING. UniProt accessions: STIM1 from genes/human/STIM1/STIM1-uniprot.txt, the
  rest from UniProt REST (reviewed human entries). GO ids and labels checked against
  .cache/rgd_pw/go-basic.obo (2026-07-26); none obsolete. Only STIM1 has a gene review;
  STIM2, ORAI1-3, STIMATE and SARAF have none yet, which is curation follow-up for the
  project plan. No PANTHER or PTN ids are asserted: every participant is a concrete human
  gene product.
proposed_new_terms:
  - proposed_name: calcium channel activator activity
    proposed_definition: >-
      Direct interaction with a calcium channel (binding or modification), resulting in its
      opening.
    justification: >-
      GO has potassium channel activator activity (GO:0099104, is_a GO:0015459 potassium
      channel regulator activity and GO:0099103 channel activator activity) and sodium
      channel activator activity (GO:7770087), but no calcium counterpart; GO:0005246
      calcium channel regulator activity has only the inhibitor child GO:0019855. STIM1 and
      STIM2 bind and open ORAI channels through the SOAR/CAD domain, and the mouse GO-CAMs
      already type Stim1 with the generic GO:0099103. The new term would sit under both
      GO:0005246 (proposed_parent) and GO:0099103, and would replace GO:0005246 on the STIM
      gating annotons of this module.
    proposed_parent:
      id: GO:0005246
      label: calcium channel regulator activity
    supported_by:
      - reference_id: PMID:19182790
        supporting_text: All Orai channels are fully activated by the conserved STIM1 amino acid fragment 344-442, which we termed SOAR (the STIM1 Orai activating region)
      - reference_id: PMID:18160041
        supporting_text: STIM2, like STIM1, caused Ca2+ influx via activation of the plasma membrane Ca2+ channel Orai1
module:
  id: store_operated_calcium_entry
  label: Store-operated calcium entry
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: store-operated calcium entry
      term:
        id: GO:0002115
        label: store-operated calcium entry
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: endoplasmic reticulum-plasma membrane contact site
        term:
          id: GO:0140268
          label: endoplasmic reticulum-plasma membrane contact site
  parts:
    - order: 1
      role: sensing of ER calcium store depletion
      node:
        id: soce_store_depletion_sensing
        label: STIM1 and STIM2 luminal EF-hand sensing of ER calcium
        module_type: MODULE
        description: >-
          The luminal EF-hand-SAM region of STIM1 and STIM2 binds calcium in the ER lumen.
          Loss of bound calcium on store depletion is the trigger of the pathway. STIM2 has
          a lower calcium affinity and responds to smaller decreases in ER calcium than
          STIM1, so the two sensors cover basal and receptor-evoked depletion.
        variant_sets:
          - id: soce_stim_sensors
            label: STIM ER calcium sensors
            axis: paralog and sensitivity to store depletion
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              Both sensors are widely co-expressed and can co-cluster. STIM1 drives
              receptor-evoked entry; STIM2 activates on small decreases of ER calcium and
              sets basal cytosolic and ER calcium.
            variants:
              - id: soce_stim1_sensing_variant
                label: STIM1 ER calcium sensing
                module_type: MODULE
                annotons:
                  - id: stim1_er_calcium_sensing
                    label: STIM1 luminal calcium binding (ER calcium sensor)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: STIM1
                        term:
                          id: UniProtKB:Q13586
                          label: Stromal interaction molecule 1
                    function:
                      preferred_term: calcium ion binding
                      term:
                        id: GO:0005509
                        label: calcium ion binding
                    processes:
                      - preferred_term: detection of calcium ion
                        term:
                          id: GO:0005513
                          label: detection of calcium ion
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    role_description: >-
                      The luminal EF-hand-SAM region binds ER calcium; its dissociation on
                      store depletion triggers STIM1 oligomerization. Function and process
                      follow the first core function of the STIM1 gene review
                      (GO:0005509 IDA PMID:16005298; GO:0005513 IDA).
                    evidence:
                      - source_id: PMID:16005298
                        statement: An EF-hand mutant of STIM1 prelocalizes in puncta and no longer responds to store depletion.
                        supporting_text: Introducing a point mutation in the STIM1 Ca(2+) binding domain resulted in prelocalization of the protein in puncta, and this mutant failed to respond to store depletion
                      - source_id: file:human/STIM1/STIM1-ai-review.yaml
                        statement: Core function of the STIM1 gene review.
                        supporting_text: ER calcium sensor - the lumenal EF-hand/SAM region binds ER Ca(2+) and detects store depletion.
              - id: soce_stim2_sensing_variant
                label: STIM2 ER calcium sensing
                module_type: MODULE
                annotons:
                  - id: stim2_er_calcium_sensing
                    label: STIM2 luminal calcium binding (sensor of small ER calcium decreases)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: STIM2
                        term:
                          id: UniProtKB:Q9P246
                          label: Stromal interaction molecule 2
                    function:
                      preferred_term: calcium ion binding
                      term:
                        id: GO:0005509
                        label: calcium ion binding
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    role_description: >-
                      Responds to smaller decreases in ER calcium than STIM1 and so acts as a
                      feedback sensor that keeps basal cytosolic and ER calcium within narrow
                      limits. Function from GOA (GO:0005509 IDA PMID:18166150). No STIM2 gene
                      review exists yet.
                    evidence:
                      - source_id: PMID:18160041
                        statement: STIM2 activates calcium influx at smaller decreases in ER calcium than STIM1.
                        supporting_text: STIM2 activated Ca2+ influx upon smaller decreases in ER Ca2+
    - order: 2
      role: STIM oligomerization, translocation to ER-plasma membrane junctions and ORAI gating
      node:
        id: soce_stim_gating
        label: Activated STIM accumulates at ER-plasma membrane junctions and gates ORAI
        module_type: REGULATORY_STEP
        description: >-
          Calcium-free STIM oligomerizes, extends its cytosolic region to expose the SOAR/CAD
          domain, and moves into puncta of cortical ER at ER-plasma membrane junctions. There
          SOAR binds the ORAI C- and N-terminal regions, traps ORAI in the junction and opens
          the pore. STIM1 is the principal activator; STIM2 also activates ORAI1 after small
          store decreases.
        variant_sets:
          - id: soce_stim_activators
            label: STIM activators of ORAI
            axis: paralog
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            variants:
              - id: soce_stim1_gating_variant
                label: STIM1 gating of ORAI
                module_type: REGULATORY_STEP
                annotons:
                  - id: stim1_orai_gating
                    label: STIM1 activation of ORAI CRAC channels
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: STIM1
                        term:
                          id: UniProtKB:Q13586
                          label: Stromal interaction molecule 1
                    function:
                      preferred_term: calcium channel regulator activity
                      term:
                        id: GO:0005246
                        label: calcium channel regulator activity
                      targets:
                        - preferred_term: ORAI1 (and ORAI2, ORAI3) CRAC channel
                          term:
                            id: UniProtKB:Q96D31
                            label: Calcium release-activated calcium channel protein 1
                    processes:
                      - preferred_term: activation of store-operated calcium channel activity
                        term:
                          id: GO:0032237
                          label: activation of store-operated calcium channel activity
                    locations:
                      - preferred_term: endoplasmic reticulum-plasma membrane contact site
                        term:
                          id: GO:0140268
                          label: endoplasmic reticulum-plasma membrane contact site
                    role_description: >-
                      Directly binds and opens ORAI channels through its SOAR/CAD domain. The
                      function and process are the second core function of the STIM1 gene
                      review (GO:0005246 IDA PMID:26322679, PMID:25326555; GO:0032237 IDA).
                      GO has no calcium channel activator term, so the regulator parent is
                      used; a new term is requested in proposed_new_terms.
                    evidence:
                      - source_id: PMID:16005298
                        statement: STIM1 translocates to puncta near the plasma membrane after store depletion.
                        supporting_text: Ca(2+) store depletion led to a rapid translocation of STIM1 into puncta that accumulated near the plasma membrane
                      - source_id: PMID:19182790
                        statement: The STIM1 SOAR fragment activates all three ORAI channels.
                        supporting_text: All Orai channels are fully activated by the conserved STIM1 amino acid fragment 344-442, which we termed SOAR (the STIM1 Orai activating region)
                      - source_id: file:human/STIM1/STIM1-ai-review.yaml
                        statement: Core function of the STIM1 gene review.
                        supporting_text: On store depletion STIM1 oligomerizes, moves to ER-PM junctions and directly gates ORAI CRAC channels via its SOAR/CAD domain, driving store-operated calcium entry.
              - id: soce_stim2_gating_variant
                label: STIM2 gating of ORAI
                module_type: REGULATORY_STEP
                annotons:
                  - id: stim2_orai_gating
                    label: STIM2 activation of ORAI1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: STIM2
                        term:
                          id: UniProtKB:Q9P246
                          label: Stromal interaction molecule 2
                    function:
                      preferred_term: calcium channel regulator activity
                      term:
                        id: GO:0005246
                        label: calcium channel regulator activity
                      targets:
                        - preferred_term: ORAI1 CRAC channel
                          term:
                            id: UniProtKB:Q96D31
                            label: Calcium release-activated calcium channel protein 1
                    processes:
                      - preferred_term: activation of store-operated calcium channel activity
                        term:
                          id: GO:0032237
                          label: activation of store-operated calcium channel activity
                    locations:
                      - preferred_term: endoplasmic reticulum-plasma membrane contact site
                        term:
                          id: GO:0140268
                          label: endoplasmic reticulum-plasma membrane contact site
                    role_description: >-
                      Activates ORAI1 after small decreases in ER calcium, more weakly than
                      STIM1. Function and process from GOA (GO:0005246 IMP PMID:18160041;
                      GO:0032237 IDA PMID:17905723, IMP PMID:18160041). Overexpressed STIM2
                      was reported to inhibit STIM1-mediated entry (PMID:16860747); see notes.
                    evidence:
                      - source_id: PMID:18160041
                        statement: STIM2, like STIM1, activates ORAI1.
                        supporting_text: STIM2, like STIM1, caused Ca2+ influx via activation of the plasma membrane Ca2+ channel Orai1
    - order: 3
      role: maintenance of ER-plasma membrane junctions and promotion of STIM1 activation
      node:
        id: soce_stimate_support
        label: STIMATE (TMEM110) promotes the STIM1 conformational switch at ER-plasma membrane junctions
        module_type: REGULATORY_STEP
        description: >-
          STIMATE is an ER-resident multi-pass protein found by proximity proteomics of
          ER-plasma membrane junctions. It binds STIM1, promotes its activating
          conformational switch and puncta formation, and maintains and remodels the
          junctions that STIM-ORAI coupling needs. It is not on RGD's PW:0001139 list and is
          added here on direct human evidence.
        annotons:
          - id: stimate_stim1_activation
            label: STIMATE positive regulation of STIM1-ORAI1 coupling
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: STIMATE (TMEM110)
                term:
                  id: UniProtKB:Q86TL2
                  label: Store-operated calcium entry regulator STIMATE
            function:
              preferred_term: calcium channel regulator activity
              term:
                id: GO:0005246
                label: calcium channel regulator activity
            processes:
              - preferred_term: activation of store-operated calcium channel activity
                term:
                  id: GO:0032237
                  label: activation of store-operated calcium channel activity
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Positive regulator acting on STIM1 rather than a channel subunit. Function and
              process from GOA (GO:0005246 IDA PMID:26322679, PMID:26644574; GO:0032237 IDA
              PMID:26322679). GOA also places it at the ER-plasma membrane contact site
              (IDA PMID:26644574).
            evidence:
              - source_id: PMID:26322679
                statement: STIMATE binds STIM1 and promotes its conformational switch.
                supporting_text: STIMATE physically interacts with STIM1 to promote STIM1 conformational switch
              - source_id: PMID:26322679
                statement: STIMATE depletion reduces STIM1 puncta at ER-PM junctions.
                supporting_text: Genetic depletion of STIMATE substantially reduces STIM1 puncta formation at ER-PM junctions
              - source_id: PMID:26644574
                statement: TMEM110 maintains and remodels ER-plasma membrane junctions used for STIM-ORAI signalling.
                supporting_text: regulates the long-term maintenance of ER-plasma membrane junctions and the short-term physiological remodeling of the junctions during store-dependent calcium signaling
    - order: 4
      role: calcium conduction through the CRAC channel pore
      node:
        id: soce_orai_conduction
        label: ORAI1, ORAI2 and ORAI3 CRAC channels conduct calcium into the cytosol
        module_type: TRANSPORT_STEP
        description: >-
          ORAI proteins form the hexameric, highly calcium-selective pore of the CRAC channel
          in the plasma membrane. The three paralogs form homo- and heteromeric channels;
          ORAI1 dominates the classical CRAC current, while ORAI2 and ORAI3 shape receptor-
          evoked calcium oscillations and inactivation.
        variant_sets:
          - id: soce_orai_channels
            label: ORAI pore subunits
            axis: paralog (homo- and heteromeric channels)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              Any ORAI paralog forms a store-operated channel when activated by STIM1, and the
              paralogs co-assemble in native cells, so one or more variants realize the step.
            variants:
              - id: soce_orai1_variant
                label: ORAI1
                module_type: TRANSPORT_STEP
                annotons:
                  - id: orai1_crac_channel
                    label: ORAI1 store-operated calcium channel activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ORAI1
                        term:
                          id: UniProtKB:Q96D31
                          label: Calcium release-activated calcium channel protein 1
                    function:
                      preferred_term: store-operated calcium channel activity
                      term:
                        id: GO:0015279
                        label: store-operated calcium channel activity
                    processes:
                      - preferred_term: store-operated calcium entry
                        term:
                          id: GO:0002115
                          label: store-operated calcium entry
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Pore-forming subunit of the CRAC channel. Function from GOA (GO:0015279
                      IDA from many papers including PMID:16645049, PMID:16921383,
                      PMID:19182790, PMID:32415068; GO:0002115 IDA/IMP). No ORAI1 gene review
                      exists yet.
                    evidence:
                      - source_id: PMID:16921383
                        statement: Selectivity mutations show ORAI1 forms the CRAC pore.
                        supporting_text: These changes in ion selectivity provide strong evidence that Orai1 is a pore subunit of the CRAC channel
                      - source_id: PMID:16645049
