      node:
        id: soce_saraf_inactivation
        label: SARAF-mediated slow calcium-dependent inactivation
        module_type: REGULATORY_STEP
        description: >-
          After entry has refilled the store, the ER membrane protein SARAF associates with
          STIM and promotes slow calcium-dependent inactivation of the CRAC current, which
          prevents store overfilling. Fast calcium-dependent inactivation, which depends on
          calcium binding near the ORAI pore and on calmodulin, is a channel property not
          modelled as a separate step. SARAF is not on RGD's PW:0001139 list and is added on
          direct human evidence.
        annotons:
          - id: saraf_scdi
            label: SARAF negative regulation of store-operated calcium entry
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SARAF
                term:
                  id: UniProtKB:Q96BY9
                  label: Store-operated calcium entry-associated regulatory factor
            processes:
              - preferred_term: negative regulation of store-operated calcium entry
                term:
                  id: GO:0106128
                  label: negative regulation of store-operated calcium entry
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              No molecular function is asserted. SARAF's only experimental MF rows in GOA
              are bare protein binding (not used), and the published mechanism (association
              with STIM, which then inactivates ORAI) does not identify a specific activity.
              GOA has GO:2001256 regulation of store-operated calcium entry by IDA
              (PMID:22464749); the negative child GO:0106128 used here is authored from the
              same paper, which identifies SARAF as a negative regulator.
            evidence:
              - source_id: PMID:22464749
                statement: SARAF is an ER membrane protein that associates with STIM and promotes slow calcium-dependent inactivation.
                supporting_text: SARAF is an endoplasmic reticulum membrane resident protein that associates with STIM to facilitate slow Ca(2+)-dependent inactivation of SOCE
              - source_id: PMID:22464749
                statement: SARAF is a negative regulator of SOCE.
                supporting_text: we report the molecular identification of SARAF as a negative regulator of SOCE
