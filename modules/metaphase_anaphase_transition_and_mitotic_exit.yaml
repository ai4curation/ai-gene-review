      description: Sister-chromatid separation triggered by APC/C-Cdc20-dependent securin destruction.
    - preferred_term: exit from mitosis
      term:
        id: GO:0010458
        label: exit from mitosis
      description: Cyclin destruction and CDK-substrate dephosphorylation that return the cell to G1.
