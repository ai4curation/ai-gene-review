id: MODULE:metaphase_anaphase_transition_and_mitotic_exit
title: Metaphase/anaphase transition and mitotic exit (APC/C-driven)
description: >-
  A taxon-neutral decomposition of the two coupled proteolytic switches that
  end mitosis. (1) The anaphase-promoting complex/cyclosome (APC/C), a
  cullin-RING ubiquitin ligase, is activated by CDK1 phosphorylation and by
  binding of its substrate-adaptor coactivator Cdc20 (Slp1). (2) Until every
  kinetochore is attached, the spindle assembly checkpoint (SAC) - Mps1/Mph1
  kinase at unattached kinetochores, Mad1-Mad2 templating, and the Bub1/Bub3
  scaffold - assembles the mitotic checkpoint complex (Mad2-BubR1/Mad3-Bub3-Cdc20)
  that sequesters and inhibits APC/C-Cdc20. (3) Once the SAC is satisfied,
  APC/C-Cdc20 ubiquitinates securin (PTTG1, Pds1, Cut2), releasing separase
  (ESPL1, Esp1, Cut1) to cleave the cohesin kleisin subunit (RAD21, Scc1/Mcd1,
  Rad21) and trigger sister-chromatid separation, the metaphase/anaphase
  transition proper. (4) APC/C-Cdc20 and then APC/C-Cdh1 (FZR1, Hct1/Cdh1,
  Ste9/Srw1) ubiquitinate the mitotic cyclins, extinguishing CDK1 activity.
  (5) A CDK-counteracting phosphatase - Cdc14 released by the mitotic exit
  network in budding yeast, Clp1/Flp1 and the septation initiation network in
  fission yeast, and reactivated PP2A-B55 in metazoa - reverses CDK
  phosphorylation to complete mitotic exit and reset G1. Representative
  members are drawn from human, Saccharomyces cerevisiae and Schizosaccharomyces
  pombe. Grounded in GO:0007091 (metaphase/anaphase transition of mitotic cell
  cycle) and GO:0010458 (exit from mitosis).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0007091
    title: metaphase/anaphase transition of mitotic cell cycle
    statement: The module's first half is grounded in the GO term for the mitotic metaphase/anaphase transition.
  - source_id: GO:0010458
    title: exit from mitosis
    statement: The module's second half is grounded in the GO term for exit from mitosis.
  - source_id: GO:0031145
    title: anaphase-promoting complex-dependent catabolic process
    statement: Both switches are executed by APC/C-dependent ubiquitin-mediated proteolysis.
  - source_id: PMID:7787245
    title: The cyclosome, a large complex containing cyclin-selective ubiquitin ligase activity, targets cyclins for destruction at the end of mitosis
    statement: Identification of the cyclosome (APC/C) as the cyclin-selective ubiquitin ligase active at the end of mitosis.
  - source_id: PMID:7736580
    title: A 20S complex containing CDC27 and CDC16 catalyzes the mitosis-specific conjugation of ubiquitin to cyclin B
    statement: The CDC27/CDC16-containing 20S complex is the mitotic cyclin B ubiquitin ligase.
  - source_id: PMID:16896351
    title: "The anaphase promoting complex/cyclosome: a machine designed to destroy"
    statement: Review of APC/C composition, coactivators, substrate recognition and its two mitotic switches.
  - source_id: PMID:29167309
    title: Visualizing the complex functions and mechanisms of the anaphase promoting complex/cyclosome (APC/C)
    statement: Structural review of the APC/C, its Cdc20/Cdh1 coactivators and MCC inhibition.
  - source_id: PMID:27120157
    title: Molecular mechanism of APC/C activation by mitotic phosphorylation
    statement: CDK1/PLK1 phosphorylation of APC/C relieves autoinhibition and permits Cdc20 binding.
  - source_id: PMID:10465783
    title: "Whose end is destruction: cell division and the anaphase-promoting complex"
    statement: Review of APC/C-Cdc20 and APC/C-Cdh1 roles in anaphase onset and mitotic exit.
  - source_id: PMID:9334304
    title: "CDC20 and CDH1: a family of substrate-specific activators of APC-dependent proteolysis"
    statement: Cdc20 and Cdh1 are substrate-specific activators of APC/C; Cdc20 targets Pds1 and Cdh1 targets Clb2.
  - source_id: PMID:9288748
    title: Yeast Hct1 is a regulator of Clb2 cyclin proteolysis
    statement: Hct1/Cdh1 is required for Clb2 cyclin proteolysis at the end of mitosis.
  - source_id: PMID:9571240
    title: Fission yeast Ste9, a homolog of Hct1/Cdh1 and Fizzy-related, is a novel negative regulator of cell cycle progression during G1-phase
    statement: Ste9/Srw1 is the fission-yeast Cdh1 ortholog acting in G1.
  - source_id: PMID:10921876
    title: APC(ste9/srw1) promotes degradation of mitotic cyclins in G(1) and is inhibited by cdc2 phosphorylation
    statement: APC/C-Ste9 degrades mitotic cyclins in G1 and is inhibited by Cdc2 phosphorylation.
  - source_id: PMID:26485365
    title: The Molecular Biology of Spindle Assembly Checkpoint Signaling Dynamics
    statement: Review of SAC signalling from Mps1 kinetochore recruitment to MCC assembly and APC/C-Cdc20 inhibition.
  - source_id: PMID:34210579
    title: Spindle assembly checkpoint activation and silencing at kinetochores
    statement: Review of the kinetochore events that activate and silence the SAC.
  - source_id: PMID:11535616
    title: Checkpoint inhibition of the APC/C in HeLa cells is mediated by a complex of BUBR1, BUB3, CDC20, and MAD2
    statement: The mitotic checkpoint complex (BUBR1-BUB3-CDC20-MAD2) is the APC/C inhibitor produced by the SAC.
  - source_id: PMID:22437499
    title: Structure of the mitotic checkpoint complex
    statement: Crystal structure of the fission-yeast MCC (Mad2-Mad3-Slp1/Cdc20) showing how Mad2 and Mad3 block Cdc20 substrate recognition.
  - source_id: PMID:1651172
    title: Feedback control of mitosis in budding yeast
    statement: Identification of the MAD genes that arrest cells in mitosis when the spindle is disrupted.
  - source_id: PMID:9635435
    title: An ESP1/PDS1 complex regulates loss of sister chromatid cohesion at the metaphase to anaphase transition in yeast
    statement: Separase Esp1 is held in a complex with securin Pds1; Pds1 destruction releases Esp1 to dissolve cohesion.
  - source_id: PMID:10403247
    title: Sister-chromatid separation at anaphase onset is promoted by cleavage of the cohesin subunit Scc1
    statement: Separase cleaves the cohesin kleisin Scc1 at anaphase onset.
  - source_id: PMID:11509732
    title: Cohesin cleavage by separase required for anaphase and cytokinesis in human cells
    statement: Separase cleavage of RAD21/SCC1 is required for anaphase in human cells.
  - source_id: PMID:8632802
    title: Cut2 proteolysis required for sister-chromatid seperation in fission yeast
    statement: APC/C-dependent Cut2 (securin) proteolysis is required for sister-chromatid separation in fission yeast.
  - source_id: PMID:8978688
    title: Fission yeast Cut1 and Cut2 are essential for sister chromatid separation, concentrate along the metaphase spindle and form large complexes
    statement: Cut1 (separase) and Cut2 (securin) form a complex essential for sister chromatid separation.
  - source_id: PMID:9885559
    title: The phosphatase Cdc14 triggers mitotic exit by reversal of Cdk-dependent phosphorylation
    statement: Cdc14 triggers mitotic exit by dephosphorylating Cdk substrates including Cdh1, Sic1 and Swi5.
  - source_id: PMID:10219244
    title: Exit from mitosis is triggered by Tem1-dependent release of the protein phosphatase Cdc14 from nucleolar RENT complex
    statement: The mitotic exit network GTPase Tem1 triggers release of Cdc14 from its nucleolar Net1/Cfi1 anchor.
  - source_id: PMID:10235265
    title: Cfi1 prevents premature exit from mitosis by anchoring Cdc14 phosphatase in the nucleolus
    statement: Net1/Cfi1 sequesters Cdc14 in the nucleolus until anaphase.
  - source_id: PMID:15568976
    title: "Closing mitosis: the functions of the Cdc14 phosphatase and its regulation"
    statement: Review of Cdc14 regulation by the FEAR and MEN networks and its roles in mitotic exit.
  - source_id: PMID:11715048
    title: "Men and sin: what's the difference?"
    statement: Review comparing the budding-yeast mitotic exit network with the fission-yeast septation initiation network.
  - source_id: PMID:11448769
    title: Fission yeast Clp1p phosphatase regulates G2/M transition and coordination of cytokinesis with cell cycle progression
    statement: Clp1/Flp1 is the fission-yeast Cdc14 ortholog, released from the nucleolus at mitosis and acting with the SIN.
  - source_id: PMID:17912263
    title: Finishing mitosis, one step at a time
    statement: Review of the ordered dephosphorylation and proteolysis events that constitute mitotic exit across eukaryotes.
  - source_id: PMID:21164013
    title: Greatwall phosphorylates an inhibitor of protein phosphatase 2A that is essential for mitosis
    statement: PP2A-B55 is the principal CDK1-counteracting phosphatase whose Greatwall-ENSA inhibition must be reversed for mitotic exit in metazoa.
  - source_id: PMID:19144818
    title: Mitotic exit in the absence of separase activity
    statement: Mitotic exit can proceed without separase activity in budding yeast, separating the exit switch from the anaphase switch.
notes: >-
  Boundary decisions. The module starts with the assembled, CDK1-phosphorylated
  APC/C at metaphase and ends with CDK-substrate dephosphorylation and cyclin
  clearance in telophase/G1. Anaphase chromosome movement, spindle elongation,
  and cytokinesis are separate modules; the SAC is modeled only as the
  regulatory restraint on APC/C-Cdc20 (kinetochore-microtubule attachment
  sensing is not decomposed). The cohesin kleisin is included as an annoton
  because its cleavage is the metaphase/anaphase transition; cohesin loading
  and cohesion establishment are separate modules. The securin descriptor has
  no PANTHER family term: PTTG1 and Cut2 are classified in PTHR10418 but
  budding-yeast Pds1 is unclassified, so securin grounds through representative
  members only. Likewise the effector phosphatase step is a taxon variant set:
  Cdc14 (via the mitotic exit network) is essential for exit in budding yeast,
  Clp1/Flp1 (via the septation initiation network) contributes in fission
  yeast, and in metazoa CDC14A/B are dispensable and reactivated PP2A-B55 (and
  PP1) perform the bulk CDK-substrate dephosphorylation. Deep research: no
  module deep-research report accompanies this file (no provider credentials
  were available in the authoring session; hand-writing one under a provider
  name is prohibited). Open questions: the identity of the metazoan
  Cdc14-equivalent for specific late-mitotic substrates; the degree to which
  Cdc20 versus Cdh1 handles cyclin B clearance in each lineage; and whether
  separase autocleavage and its cyclin B1 binding are best modeled as parts of
  this module or as regulatory context.
