id: MODULE:variochelin_siderophore_biosynthesis_and_uptake
title: Variobactin and variochelin photoreactive lipopeptide siderophore biosynthesis and transport
description: A conserved hybrid polyketide synthase / nonribosomal peptide synthetase (PKS/NRPS) biosynthetic
  and iron-transport module (the var gene cluster) in soil and rhizosphere Variovorax species (exemplified
  by Variovorax paradoxus P4B GenBank KT362218 producing variobactin A/B, and Variovorax boronicumulans
  and Variovorax sp. H002 producing variochelins A-E). Downstream of the unreviewed starter NRPS Var3
  (ALG65336.1, loading the N-acyl-arginine starter unit), the cytoplasmic hybrid PKS/NRPS/TauD megasynthase
  Var4 (VarG) extends the N-acyl-arginine starter with a malonate/methylmalonate ketide unit, reduces
  the beta-keto group, condenses the ketide-extended intermediate with the position-3 aspartate monomer
  loaded in trans on Var5 (ALG65340.1), and beta-hydroxylates that aspartate residue via its C-terminal
  TauD domain to install the photoreactive beta-hydroxyaspartate (Hya; reported as L-erythro-Hya for
  TauD-type hydroxylases in PMID:38590537, though L-threo-Hya was earlier reported for variochelin A in
  PMID:27023373) ligand; the bimodular NRPS Var6 elongates and epimerizes two internal peptide monomers
  (established as D-Ser and L-Pro in Variovorax sp. H002 variochelins in PMID:38590537, with Ser/Thr
  combinatorialization and amino-acid substitutions noted in V. paradoxus P4B variobactin A/B in PMID:26412281);
  and the terminal bimodular NRPS-thioesterase Var7 incorporates two C-terminal modified N-hydroxyornithine
  hydroxamate chelators (established as N-delta-acetyl-N-delta-hydroxy-L-ornithine in H002 variochelins
  and combinatorialized across N-formyl/N-acetyl/unmodified N-hydroxyornithine in P4B variobactin) and
  cleaves the mature lipopeptide siderophore. The inner-membrane SyrD-family type I ABC half-transporter
  Var14 exports the apo-siderophore across the cytoplasmic membrane. After extracellular Fe(III) chelation
  (and optional light-driven Fe(III)-to-Fe(II) photolysis), the outer-membrane TonB-dependent receptor
  Var8 imports ferric-variobactin/variochelin across the outer membrane, and following uptake into the
  cytoplasm, the FhuF-family ferric-siderophore reductase Var13 reduces complexed Fe(III) to release bioavailable
  Fe(II).
status: DRAFT
evidence:
- source_id: GO:0019290
  title: siderophore biosynthetic process
  statement: GO:0019290 provides the biological-process context for assembly of the photoreactive lipopeptide
    siderophores variobactin and variochelin.
- source_id: GO:0033214
  title: siderophore-iron import into cell
  statement: GO:0033214 provides the biological-process context for TonB-dependent ferric-siderophore
    uptake and intracellular reductive iron release.
- source_id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  statement: Identifies the Variovorax paradoxus P4B var hybrid NRPS/PKS gene cluster (GenBank KT362218)
    and isolates and structurally characterizes its lipopeptide siderophore products variobactin A and
    B.
  supporting_text: A second Variovorax isolate (V. paradoxus P4B (ref. 32)) was found to possess another
    distinct NRPS/PKS gene cluster, corresponding to a putative lipopeptide (Fig. 2b, Supplementary Fig.
    17a and Supplementary Table 7). By altering amino-acid composition, macrocyclization status and tailoring
    modifications, we generated a library of 32 structures (Supplementary Fig. 17b) for use in GNP analysis
    of the LC–MS/MS spectrum. The crude extract of V. paradoxus P4B was shown to contain a series of candidate
    hits (Fig. 2b) whose isolation yielded the novel natural products variobactin A and B, in spite of
    several unforeseen amino-acid substitutions
- source_id: PMID:26412281
  title: An automated Genomes-to-Natural Products platform (GNP) for the discovery of modular natural
    products.
  statement: Describes the GNP combinatorialization of position-3 beta-hydroxyaspartate, interchangeable
    Ser/Thr, malonate/methylmalonate, and N-formylated, N-acetylated, or unmodified N-hydroxyornithine
    monomers for the V. paradoxus P4B var cluster.
  supporting_text: The prediction was modified as the presence of an aspartate β-hydroxylating enzyme led to the conclusion that the predicted position 3 aspartate was β-hydroxyaspartate. This structure was combinatorialized to generate the linear lipopeptide and lipodepsipeptide macrocycle forms, with serines and threonines being interchangeable, the polyketide portion incorporating either a malonate or methylmalonate, and predicted N-hydroxyornithines being N-formylated, N-acetylated or not further modified, yielding a concentrated library of 32 hypothetical structures.
- source_id: PMID:27023373
  title: Variochelins, Lipopeptide Siderophores from Variovorax boronicumulans Discovered by Genome Mining.
  statement: Characterizes the orthologous Variovorax var PKS/NRPS gene cluster and demonstrates that
    the ferric complexes of its lipopeptide siderophores are photoreactive.
  supporting_text: In this paper, we describe the genomics-driven discovery and characterization of variochelins,
    lipopeptide siderophores from the bacterium Variovorax boronicumulans, which thrives in soil and freshwater
    habitats. Variochelins are different from most other lipopeptide siderophores in that their biosynthesis
    involves a polyketide synthase. We demonstrate that the ferric iron complex of variochelin A possesses
    photoreactive properties and present the MS-derived structures of two degradation products that emerge
    upon light exposure.
- source_id: PMID:38590537
  title: New variochelins from soil-isolated Variovorax sp. H002.
  statement: Demonstrates by targeted varG::cmR gene replacement that the hybrid PKS/TauD module is essential
    for variochelin A-E biosynthesis and that its embedded TauD domain installs the photoreactive beta-hydroxyaspartate
    moiety.
  supporting_text: To investigate whether the identified var biosynthetic gene cluster is responsible
    for variochelin production, we substituted varG encoding the polyketide synthase (PKS) module with
    a chloramphenicol resistance (cmR) gene cassette, using homologous recombination (Figure 3b). As a
    result, the varG knock-out mutant no longer produced 1–5, validating that the var biosynthetic gene
    cluster is indispensable for variochelin production in Variovorax sp. H002 (Figure 3b).
- source_id: file:VARPD/var4/var4-ai-review.yaml
  title: Variovorax paradoxus var4 gene review
  statement: A0A0N7FMV9 (ALG65339.1) encodes the hybrid PKS/NRPS and embedded TauD beta-aspartyl dioxygenase
    module Var4.
- source_id: file:VARPD/var6/var6-ai-review.yaml
  title: Variovorax paradoxus var6 gene review
  statement: A0A0N9LX43 (ALG65341.1) encodes the bimodular NRPS elongation and epimerization subunit Var6.
- source_id: file:VARPD/var7/var7-ai-review.yaml
  title: Variovorax paradoxus var7 gene review
  statement: A0A0N9LYB5 (ALG65342.1) encodes the terminal bimodular NRPS and C-terminal chain-releasing
    thioesterase subunit Var7.
- source_id: file:VARPD/var14/var14-ai-review.yaml
  title: Variovorax paradoxus var14 gene review
  statement: A0A0N9LS79 (ALG65349.1) encodes the inner-membrane SyrD-family type I ABC siderophore exporter
    Var14.
- source_id: file:VARPD/var8/var8-ai-review.yaml
  title: Variovorax paradoxus var8 gene review
  statement: A0A0N9M610 (ALG65343.1) encodes the TonB-dependent outer-membrane ferric-variobactin receptor
    Var8.
- source_id: file:VARPD/var13/var13-ai-review.yaml
  title: Variovorax paradoxus var13 gene review
  statement: A0A0N9M354 (ALG65348.1) encodes the cytoplasmic FhuF-family ferric-siderophore reductase
    Var13.
module:
  id: variochelin_siderophore_biosynthesis_and_uptake
  label: Variobactin and variochelin photoreactive lipopeptide siderophore biosynthesis and transport
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: siderophore biosynthetic process
    term:
      id: GO:0019290
      label: siderophore biosynthetic process
    description: Hybrid PKS/NRPS assembly of photoreactive beta-hydroxyaspartate- and hydroxamate-containing
      lipopeptide siderophores (variobactin and variochelins) in Variovorax.
  - preferred_term: siderophore-iron import into cell
    term:
      id: GO:0033214
      label: siderophore-iron import into cell
    description: TonB-dependent outer-membrane uptake and cytoplasmic FhuF-catalyzed reductive iron release
      from ferric-variobactin/variochelin complexes.
  parts:
  - order: 1
    role: polyketide ketide elongation and TauD-catalyzed beta-aspartyl hydroxylation of the lipopeptidyl
      intermediate
    node:
      id: var4_pks_taud_step
      label: Var4 hybrid PKS elongation and TauD beta-aspartyl hydroxylation
      module_type: REACTION
      annotons:
      - id: var4_acyltransferase_activity
        label: Var4 hybrid PKS/NRPS ketide elongation module
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var4/VarG hybrid PKS/NRPS/TauD siderophore megasynthases
            representative_members:
            - preferred_term: var4 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N7FMV9
                label: Var4
              description: Variovorax paradoxus P4B ALG65339.1; extends the N-acyl-arginine starter unit
                with a malonate/methylmalonate ketide unit and condenses the downstream aspartate monomer.
        function:
          preferred_term: polyketide synthase activity
          term:
            id: GO:0016218
            label: polyketide synthase activity
          substrates:
          - preferred_term: methylmalonyl-CoA
          products:
          - preferred_term: 4-acylamino-7-guanidino-3-hydroxy-2-methylheptanoyl-S-ACP
        role_description: Incorporates a malonate or methylmalonate polyketide unit onto the N-acyl-arginine
          starter unit (loaded upstream on Var3 / ALG65336.1) and reduces the beta-keto group via its KS-AT-KR-ACP
          module.
      - id: var4_nrps_condensation_activity
        label: Var4 LCL-type NRPS condensation domain
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var4/VarG hybrid PKS/NRPS/TauD siderophore megasynthases
            representative_members:
            - preferred_term: var4 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N7FMV9
                label: Var4
              description: Variovorax paradoxus P4B ALG65339.1; LCL condensation domain (PF00668 / IPR001242)
                condenses the polyketide-extended intermediate with the position-3 aspartate monomer tethered
                in trans on Var5 (ALG65340.1).
        function:
          preferred_term: non-ribosomal peptide synthetase activity
          term:
            id: GO:1904091
            label: non-ribosomal peptide synthetase activity
          substrates:
          - preferred_term: 4-acylamino-7-guanidino-3-hydroxy-2-methylheptanoyl-S-ACP
          - preferred_term: L-aspartyl-S-PCP
          products:
          - preferred_term: lipodipeptidyl-S-PCP
        role_description: Condenses the polyketide-extended 4-acylamino-7-guanidino-3-hydroxy-2-methylheptanoyl-S-ACP
          intermediate with the position-3 aspartate monomer loaded in trans on Var5 (ALG65340.1).
      - id: var4_taud_dioxygenase_activity
        label: Var4 embedded TauD-family beta-aspartyl dioxygenase domain
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var4/VarG hybrid PKS/NRPS/TauD siderophore megasynthases
            representative_members:
            - preferred_term: var4 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N7FMV9
                label: Var4
              description: Variovorax paradoxus P4B ALG65339.1; C-terminal TauD domain beta-hydroxylates
                the position-3 aspartate residue (loaded on Var5 / ALG65340.1) to beta-hydroxyaspartate
                (reported as L-erythro-Hya for TauD-type hydroxylases in PMID:38590537, though L-threo-Hya
                was earlier reported in PMID:27023373).
        function:
          preferred_term: 2-oxoglutarate-dependent dioxygenase activity
          term:
            id: GO:0016706
            label: 2-oxoglutarate-dependent dioxygenase activity
          substrates:
          - preferred_term: L-aspartyl-S-PCP
          - preferred_term: 2-oxoglutarate
          - preferred_term: dioxygen
          products:
          - preferred_term: beta-hydroxyaspartyl-S-PCP
          - preferred_term: succinate
        role_description: Catalyzes Fe(II)/2-oxoglutarate-dependent beta-hydroxylation of the position-3
          aspartate monomer (tethered in trans on Var5) to install the photoreactive beta-hydroxyaspartate
          iron-coordinating ligand.
  - order: 2
    role: bimodular NRPS activation, condensation, and epimerization of two internal peptide monomers
      (established as D-Ser and L-Pro in Variovorax sp. H002 variochelins; Ser/Thr combinatorialization
      and substitutions noted in P4B variobactin)
    node:
      id: var6_nrps_elongation_step
      label: Var6 bimodular NRPS peptide elongation and epimerization
      module_type: REACTION
      annotons:
      - id: var6_ligase_activity
        label: Var6 bimodular nonribosomal peptide synthetase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var6 bimodular variobactin/variochelin NRPS elongases
            representative_members:
            - preferred_term: var6 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9LX43
                label: Var6
              description: Variovorax paradoxus P4B ALG65341.1; contains three condensation/epimerization
                domains, two adenylation domains, and two phosphopantetheinylated PCP domains.
        function:
          preferred_term: non-ribosomal peptide synthetase activity
          term:
            id: GO:1904091
            label: non-ribosomal peptide synthetase activity
          substrates:
          - preferred_term: L-alpha-amino acid
          - preferred_term: ATP
          products:
          - preferred_term: lipotetrapeptidyl-S-PCP
        role_description: Activates, condenses, and epimerizes two internal peptide monomers (established
          as L-Ser epimerized to D-Ser and L-Pro in Variovorax sp. H002 variochelins, PMID:38590537, with
          Ser/Thr interchange and amino-acid substitutions noted in V. paradoxus P4B variobactin A/B,
          PMID:26412281) onto the growing lipopeptidyl-S-PCP intermediate.
  - order: 3
    role: incorporation of two C-terminal modified N-hydroxyornithine hydroxamate chelators and thioesterase
      offloading of mature variobactin
    node:
      id: var7_nrps_release_step
      label: Var7 terminal NRPS elongation and thioesterase chain release
      module_type: REACTION
      annotons:
      - id: var7_ligase_activity
        label: Var7 terminal bimodular NRPS subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var7 terminal variobactin/variochelin NRPS-thioesterases
            representative_members:
            - preferred_term: var7 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9LYB5
                label: Var7
              description: Variovorax paradoxus P4B ALG65342.1; contains two PvdJ-like adenylation domains,
                two condensation domains, two PCP domains, and a C-terminal thioesterase domain.
        function:
          preferred_term: non-ribosomal peptide synthetase activity
          term:
            id: GO:1904091
            label: non-ribosomal peptide synthetase activity
          substrates:
          - preferred_term: N-hydroxyornithine derivative
          - preferred_term: ATP
          products:
          - preferred_term: variobactinyl-S-PCP
        role_description: Activates and condenses the two C-terminal modified N-hydroxyornithine residues
          (established as N-delta-acetyl-N-delta-hydroxy-L-ornithine in H002 variochelins, PMID:38590537,
          and combinatorialized across N-formylated, N-acetylated, or unmodified N-hydroxyornithine in
          P4B variobactin, PMID:26412281) that form the bidentate hydroxamate iron-binding ligands.
      - id: var7_thioesterase_activity
        label: Var7 C-terminal offloading thioesterase domain
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var7 terminal variobactin/variochelin NRPS-thioesterases
            representative_members:
            - preferred_term: var7 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9LYB5
                label: Var7
              description: Variovorax paradoxus P4B ALG65342.1; C-terminal PF00975 thioesterase domain
                releases mature variobactin.
        function:
          preferred_term: thiolester hydrolase activity
          term:
            id: GO:0016790
            label: thiolester hydrolase activity
          substrates:
          - preferred_term: variobactinyl-S-PCP
          products:
          - preferred_term: variobactin
        role_description: Hydrolyzes the full-length lipohexapeptidyl-S-PCP thioester to release the mature
          apo-siderophore variobactin into the cytoplasm.
  - order: 4
    role: ATP-coupled inner-membrane export of apo-variobactin
    node:
      id: var14_siderophore_export_step
      label: Var14 ABC transporter-mediated siderophore export
      module_type: TRANSPORT_STEP
      annotons:
      - id: var14_abc_exporter_activity
        label: Var14 SyrD-family type I ABC siderophore exporter
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var14 SyrD-family lipopeptide siderophore ABC exporters
            representative_members:
            - preferred_term: var14 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9LS79
                label: Var14
              description: Variovorax paradoxus P4B ALG65349.1; six-TM inner-membrane ABC type-1 exporter
                fused to a C-terminal ATPase domain.
        function:
          preferred_term: ABC-type transporter activity
          term:
            id: GO:0140359
            label: ABC-type transporter activity
          substrates:
          - preferred_term: variobactin
          - preferred_term: ATP
          products:
          - preferred_term: extracellular variobactin
          - preferred_term: ADP
        role_description: Couples ATP hydrolysis to the export of newly synthesized apo-variobactin across
          the cytoplasmic membrane.
  - order: 5
    role: TonB-energized outer-membrane import of ferric-variobactin
    node:
      id: var8_outer_membrane_import_step
      label: Var8 TonB-dependent outer-membrane ferric-siderophore import
      module_type: TRANSPORT_STEP
      annotons:
      - id: var8_receptor_transporter_activity
        label: Var8 TonB-dependent outer-membrane ferric-variobactin receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var8 TonB-dependent ferric-variobactin/variochelin receptors
            representative_members:
            - preferred_term: var8 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9M610
                label: Var8
              description: Variovorax paradoxus P4B ALG65343.1; 22-stranded beta-barrel TonB-dependent
                receptor with an N-terminal STN signaling domain.
        function:
          preferred_term: siderophore uptake transmembrane transporter activity
          term:
            id: GO:0015344
            label: siderophore uptake transmembrane transporter activity
          substrates:
          - preferred_term: ferric-variobactin
          products:
          - preferred_term: periplasmic ferric-variobactin
        role_description: Recognizes extracellular ferric-variobactin complexes and mediates TonB-dependent
          import across the bacterial cell outer membrane.
  - order: 6
    role: cytoplasmic reductive release of ferrous iron from imported ferric-variobactin
    node:
      id: var13_ferric_reductase_step
      label: Var13 FhuF-family ferric-siderophore reduction
      module_type: REACTION
      annotons:
      - id: var13_reductase_activity
        label: Var13 FhuF-family ferric-siderophore reductase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Var13 FhuF-family ferric-siderophore reductases
            representative_members:
            - preferred_term: var13 (Variovorax paradoxus P4B)
              term:
                id: UniProtKB:A0A0N9M354
                label: Var13
              description: Variovorax paradoxus P4B ALG65348.1; cytoplasmic TIGR03951/PF06276 ferric iron
                reductase encoded in the var cluster.
        function:
          preferred_term: ferric-chelate reductase activity
          term:
            id: GO:0000293
            label: ferric-chelate reductase activity
          substrates:
          - preferred_term: ferric-variobactin
          products:
          - preferred_term: Fe(II)
          - preferred_term: variobactin
        role_description: Catalyzes one-electron reduction of Fe(III) bound to imported variobactin, releasing
          bioavailable Fe(II) for cellular incorporation.
  connections:
  - source: var4_pks_taud_step
    target: var6_nrps_elongation_step
    connection_type: PROVIDES_INPUT_FOR
    chaining_status: MAPPING_GAP
    chaining_note: >-
      Var4 lacks a PF00501 adenylation domain; the position-3 aspartate monomer is activated
      and carried in trans on the intervening unannotated NRPS protein Var5 (ALG65340.1, bases 13769..16882
      in KT362218), which receives the ketide-extended acyl chain from Var4's LCL condensation domain,
      undergoes beta-hydroxylation by Var4's TauD domain, and passes the beta-hydroxyaspartyl-containing
      intermediate to Var6.
    description: Var4 condenses the polyketide-extended starter chain onto the position-3 aspartate monomer
      tethered in trans on Var5 (ALG65340.1) and beta-hydroxylates it via its TauD domain before handoff
      from Var5 to the first NRPS module of Var6.
  - source: var6_nrps_elongation_step
    target: var7_nrps_release_step
    connection_type: PROVIDES_INPUT_FOR
    description: Var6 elongates and epimerizes the two internal peptide monomers (established as D-Ser
      and L-Pro in Variovorax sp. H002 variochelins) and passes the lipotetrapeptidyl chain to the terminal
      NRPS-thioesterase Var7.
  - source: var7_nrps_release_step
    target: var14_siderophore_export_step
    connection_type: PROVIDES_INPUT_FOR
    description: Thioesterase offloading by Var7 releases mature apo-variobactin in the cytoplasm for
      export across the inner membrane by Var14.
  - source: var14_siderophore_export_step
    target: var8_outer_membrane_import_step
    connection_type: PROVIDES_INPUT_FOR
    description: Secreted variobactin chelates environmental Fe(III) extracellularly to form ferric-variobactin,
      the substrate imported across the outer membrane by Var8.
  - source: var8_outer_membrane_import_step
    target: var13_ferric_reductase_step
    connection_type: PROVIDES_INPUT_FOR
    chaining_status: KNOWLEDGE_GAP
    chaining_note: The inner-membrane permease or ABC importer mediating periplasm-to-cytoplasm translocation
      of ferric-variobactin between outer-membrane Var8 and cytoplasmic Var13 has not yet been identified
      in V. paradoxus P4B (var14 encodes a SyrD-family type-1 exporter).
    description: Following outer-membrane translocation by Var8 and inner-membrane uptake into the cytoplasm,
      ferric-variobactin is reduced by Var13 to liberate Fe(II).
  notes: >-
    Grounded on the six GOA-annotated proteins of the Variovorax paradoxus strain P4B (NCBITaxon:34073)
    variobactin gene cluster (GenBank KT362218, 41,899 bp, var1-var14; PMID:26412281) — A0A0N7FMV9 (Var4,
    ALG65339.1), A0A0N9LX43 (Var6, ALG65341.1), A0A0N9LYB5 (Var7, ALG65342.1), A0A0N9M610 (Var8, ALG65343.1),
    A0A0N9M354 (Var13, ALG65348.1), and A0A0N9LS79 (Var14, ALG65349.1) — together with comparative characterization
    and varG::cmR knockout validation of the orthologous variochelin var gene clusters in Variovorax boronicumulans
    (PMID:27023373) and Variovorax sp. H002 (PMID:38590537). Remaining ORFs in GenBank KT362218 lacking
    UniProt GOA records account for the upstream starter and intervening assembly-line steps: var1 (ALG65337.1,
    type II editing thioesterase), var2 (ALG65338.1, 4'-phosphopantetheinyl transferase), var3 (ALG65336.1,
    starter NRPS loading the N-terminal fatty-acyl and L-arginine units upstream of Var4), var5 (ALG65340.1,
    intervening NRPS module between var4 and var6 that activates and tethers the position-3 aspartate
    monomer in trans for Var4's LCL condensation and TauD beta-hydroxylase domains), var9/var10 (ALG65344.1/ALG65345.1,
    FecR-like anti-sigma factor and ECF sigma-24 subunit paired with Var8's STN domain), and var11/var12
    (ALG65346.1/ALG65347.1, ornithine N-monooxygenase and N-acyltransferase supplying the modified N-hydroxyornithine
    substrates of Var7). Similarly, the inner-membrane transporter mediating periplasm-to-cytoplasm import
    of ferric-variobactin between outer-membrane Var8 and cytoplasmic Var13 is uncharacterized and recorded
    as KNOWLEDGE_GAP.
