id: MODULE:bacterial_purine_nucleotide_interconversion
title: Bacterial purine nucleotide interconversion
description: >-
  A reusable bacterial module that partitions inosine monophosphate (IMP) into
  the two canonical purine nucleotide branches and connects the resulting AMP
  and GMP pools to nucleotide phosphorylation. The AMP branch uses
  adenylosuccinate synthetase and adenylosuccinate lyase; the GMP branch uses
  IMP dehydrogenase and glutamine-hydrolyzing GMP synthase. Adenylate kinase
  equilibrates AMP, ADP, and ATP, while guanylate kinase and nucleoside
  diphosphate kinase connect GMP to GDP and GTP. Synthesis of IMP from PRPP,
  purine uptake and salvage entry, alarmone metabolism, cyclic-nucleotide
  signaling, and purine degradation are outside this module.
status: DRAFT
evidence:
  - source_id: file:modules/de_novo_purine_synthesis.yaml
    title: De novo inosine monophosphate biosynthesis module
    statement: >-
      The upstream module terminates at IMP and explicitly places the IMP-to-AMP
      and IMP-to-GMP branches outside its boundary.
  - source_id: file:projects/P_PUTIDA/batches/ppu00230_purine_nucleotide_interconversion.tsv
    title: Pseudomonas putida KT2440 purine nucleotide interconversion batch
    statement: >-
      The immutable pathway snapshot identifies the exact KT2440 proteins used
      here to test the reusable bacterial module.
