  notes: >-
    This reusable bacterial boundary begins with IMP and ends with connected
    adenine and guanine nucleotide phosphate-state exchange. PurB is included
    only for its adenylosuccinate-to-AMP role here; its SAICAR-lyase role remains
    in de novo IMP synthesis. Ndk is included as the physiologically shared GDP-
    to-GTP step, while its pyrimidine and deoxyribonucleotide substrates are not
    modeled as separate branches. No localization is asserted because a generic
    cytoplasm or cytosol term is not part of the reusable pathway definition.
