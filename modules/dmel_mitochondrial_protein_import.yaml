id: MODULE:dmel_mitochondrial_protein_import
title: Mitochondrial protein import machinery in Drosophila melanogaster
description: >-
  Most mitochondrial proteins are made on cytosolic ribosomes and imported post-translationally.
  Nearly all enter through the TOM complex of the outer membrane, whose channel is formed
  by Tom40. Beta-barrel outer membrane proteins are then handed by the small TIM chaperones
  of the intermembrane space to the SAM complex for insertion. Carrier-type inner membrane
  proteins are inserted by the TIM22 complex, and presequence-bearing precursors are translocated
  by the TIM23 complex, driven into the matrix by the presequence translocase-associated motor
  (PAM) built around mitochondrial Hsp70 (Hsc70-5). Matrix presequences are removed by the
  mitochondrial processing peptidase, and some intermembrane space-sorted precursors are further
  cleaved by the inner membrane peptidase. Cysteine-rich intermembrane space proteins are
  imported and oxidatively folded by the Mia40-Alr disulfide relay. Drosophila has testis-specific
  paralogs of several subunits (for example tomboy40, tomboy20 and several Tim17 and Tim50
  paralogs).
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001904
  title: 'FlyBase gene group MPT: Mitochondrial protein import complexes'
  statement: >-
    FlyBase release FB2026_03 groups 32 D. melanogaster genes as mitochondrial protein import
    complexes (MPT); this module models that group.
- source_id: FB:FBgg0001907
  title: 'FlyBase gene group TIMM23: Tim23 translocase of inner mitochondrial membrane complex
    subunits'
  statement: >-
    FlyBase release FB2026_03 groups 18 D. melanogaster genes as tim23 translocase of inner
    mitochondrial membrane complex subunits (TIMM23); this module models that group.
- source_id: FB:FBgg0002013
  title: 'FlyBase gene group MDRS: Mitochondrial disulfide relay system'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as mitochondrial disulfide relay
    system (MDRS); this module models that group.
- source_id: FB:FBgg0002140
  title: 'FlyBase gene group MPP: Mitochondrial processing peptidase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as mitochondrial processing peptidase
    complex (MPP); this module models that group.
- source_id: FB:FBgg0002141
  title: 'FlyBase gene group IMP: Mitochondrial inner membrane peptidase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as mitochondrial inner membrane
    peptidase complex (IMP); this module models that group.
- source_id: GO:7770058
  title: mitochondrial protein import pathway
  statement: >-
    GO term grounding the module as mitochondrial protein import pathway.
notes: >-
  Boundary. The module covers the FlyBase import complexes (MPT), the TIM23 subunit families
  (TIMM23), the disulfide relay (MDRS) and the two presequence peptidases (MPP, IMP). Cytosolic
  chaperones and mitochondrial quality-control proteases are outside. Tom6, Tom7, Tom20, Tim23,
  CG5662, Mppa, Immp2 and some other members have no UniProt entry in the cache and are grounded
  to FlyBase gene ids. The Tim9-Tim10 chaperones appear both in the small TIM part and, following
  FlyBase, in the TIM22 complex. Paralogs listed by FlyBase in the Tim17, Tim50 and Tim16
  families are kept as separate annotons; which of them function in somatic versus testis
  TIM23 complexes is only partly established. FlyBase groups realized by this module: MPT
  (FBgg0001904), TIMM23 (FBgg0001907), MDRS (FBgg0002013), MPP (FBgg0002140), IMP (FBgg0002141).
  Subgroups folded into it: TOMM-C, TOMM-T, TOMM, TIMM22, PAM, TIMM23C, TIMM17, TIM23F, TIM23SSU,
  TIM50F, TIMS, TIM813-U, TIM813-T, TIM23-SORT, TIM23-MOTOR, SAM-U, SAM-T, TIM910, TIM-3SU.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_mitochondrial_protein_import.yaml;
  none of the member genes has a gene review yet unless noted.
