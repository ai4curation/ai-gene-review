  - order: 2
    role: Granule polarisation and exocytosis at the synapse
    node:
      id: granule_delivery
      label: Polarised delivery of cytolytic granules to the synapse
      module_type: TRANSPORT_STEP
      description: 'Cytolytic granules, which are secretory lysosomes holding perforin and granzymes as
        soluble cargo, are moved to the synapse and fuse with the plasma membrane, releasing their contents
        into the cleft. Arl8b grounds the trafficking step: it is the lysosomal Arf-like GTPase that drives
        granule polarisation, and silencing it leaves perforin-containing granules away from the contact
        while leaving granule content intact. The SNARE and Munc machinery that executes fusion (STX11,
        UNC13D, STXBP2) is part of this step biologically but is not grounded here, because none of those
        genes has a review in this repository yet; that is a curation gap, not a claim that they are outside
        the module.'
