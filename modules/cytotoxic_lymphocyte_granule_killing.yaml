        the attacked cell, reaches acid sphingomyelinase by passing through the very pores that caused
        its activation, and activates it by proteolytic cleavage; the resulting ceramide supports endocytic
        removal of the pores and so limits lysis. Optional because it modulates the outcome rather than
        being required for killing, and because it has been established in a particular setting - hepatocytes
        under NK attack - rather than as a general feature of every target.
