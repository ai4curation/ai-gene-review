        role_description: 'Contributes the Qa helix of the bundle that merges the granule with the plasma
          membrane, and is atypical in a way that turns out to be load-bearing: it has no transmembrane
          domain and is held in the bilayer by palmitoylation, which is also what polarises it to the
          synapse. Live imaging in primary human effector cytotoxic T lymphocytes resolves the sequence -
          syntaxin-11 arrives through a subpopulation of recycling endosomes, clusters at the synapse, and
          those clusters are the platform on which arriving granules fuse - and knocking it down abolishes
          fusion while the granules still arrive, which places the requirement at the fusion step rather
          than at delivery. Reconstituted with SNAP23 and VAMP8 alone it gets only as far as hemifusion,
          which is why the Munc18-2 annoton beside it is not an accessory to this one but part of the same
          reaction.'
