  connections:
  - source: target_recognition
    target: granule_delivery
    connection_type: CAUSES
    description: Activating-receptor signalling triggers polarisation and exocytosis of the granules.
      Modelled as CAUSES rather than a direct regulatory relation because several signalling steps intervene
      between receptor engagement and granule fusion.
    evidence:
    - *id011
  - source: granule_delivery
    target: perforin_pore
    connection_type: PROVIDES_INPUT_FOR
    description: Exocytosis puts perforin into the synaptic cleft, which is the input the pore-forming
      step consumes. The granules are released into a synapse that has already formed.
    evidence:
    - *id012
    - *id002
  - source: perforin_pore
    target: granzyme_proteolysis
    connection_type: PROVIDES_INPUT_FOR
    description: 'The pore delivers granzyme B to the target cytosol. Deliberately PROVIDES_INPUT_FOR
      rather than a regulatory relation: the pore does not change granzyme B''s catalytic rate, which
      it already has, it changes where the enzyme is. The curated GO-CAM asserts direct positive regulation
      here, and that model''s review disputes it on exactly this ground.'
    evidence:
    - *id013
    - *id005
  - source: granzyme_proteolysis
    target: death_execution
    connection_type: CAUSES
    description: Granzyme B proteolysis of procaspase-3, BID and gasdermin E commits the target to death.
      Which death follows is set within the target.
    evidence:
    - *id004
    - *id014
  - source: perforin_pore
    target: membrane_repair
    connection_type: CAUSES
    description: The repair arm is a response to the pores themselves, and the pores are also how the
      caspase that triggers it reaches its substrate, so this edge closes a loop back onto part three
      rather than continuing the chain.
    evidence:
    - *id010
  - source: membrane_repair
    target: perforin_pore
    connection_type: NEGATIVELY_REGULATES
    description: Ceramide-supported endocytic removal of the pores limits the damage they do, which is
      why this module can end in apoptosis rather than immediate lysis.
    evidence:
    - *id010
  - source: perforin_pore
    target: antimicrobial_arm
    connection_type: PROVIDES_INPUT_FOR
    description: 'The pore delivers granulysin as well as the granzymes, and granulysin may require perforin
      as a cofactor to enter the host cell at all. Modelled as input provision rather than regulation
      for the same reason as the granzyme edge: the pore changes where the effector is, not what it can
      do.'
    evidence:
    - *id015
    - *id016
  evidence:
  - *id017
  - *id018
  - *id012
  notes: 'Boundary decisions worth challenging. Target recognition is inside the module as an interchangeable
    trigger; a reviewer may prefer it as upstream context, which would make the module start at degranulation
    and leave CD16A out. Granule biogenesis and the lymphocyte''s arming are outside. The apoptotic and
    pyroptotic execution programmes are named as the branch point only, since each is its own module and
    this repository already holds apoptotic_execution_phase and intrinsic_apoptotic_signaling.


    Known grounding gaps, stated rather than papered over. Part two has no annoton for the fusion machinery
    that actually executes exocytosis - STX11, UNC13D and STXBP2, the genes behind familial haemophagocytic
    lymphohistiocytosis types 3 to 5 - because none of them has a gene review in this repository. Arl8b
    grounds the trafficking that positions the granule, not the fusion. Granzyme A has since been grounded
    alongside granzyme B in part four, and granulysin in the new part seven, so the remaining granzyme
    gaps are granzyme H, granzyme K and granzyme M, each of which delivers a further substrate programme
    through the same pore.


    Status is DRAFT, not COMPLETE, for three specific reasons rather than as a formality. No module deep
    research exists for this module, because no provider was reachable in the environment where it was
    written, so the derived QC panel''s deep-research check will report none. Two of the eight grounded
    genes carry UNDECIDED rows in their gene reviews - CASP3 at 190 of 199 rows and CASP7 at 98 of 101
    - so the gene-review completeness check does not come back wholly clean, although no row anywhere
    is left PENDING. And the gene reviews behind three parts are themselves not at COMPLETE status: GSDME
    and CORO1A sit at DRAFT and SMPD1 at INITIALIZED. That is deliberate and not a gap to close from here.
    All three are genes of the ClinGen Mendelian campaign, which records that a COMPLETE status does not
    certify assessment against its current evidence and curation rules and that campaign acceptance does
    not change a review''s computed status; GSDME in particular was accepted as campaign gene 745 with
    its DRAFT status explicitly retained. Their curation state is the campaign''s to set, not this module''s.
    Both are honest states of the evidence, not oversights to be marked over.'
