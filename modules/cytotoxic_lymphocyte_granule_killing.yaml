id: MODULE:cytotoxic_lymphocyte_granule_killing
title: Cytotoxic lymphocyte granule-mediated target cell killing
description: 'The route by which a cytotoxic lymphocyte kills a cell it has recognised, using preformed
  secretory granules rather than death receptors. An activating receptor engages the target and triggers
  polarised exocytosis of cytolytic granules into the immunological synapse; perforin binds the target
  membrane in a calcium-dependent way, oligomerises and forms a large pore; granzyme B passes through
  that pore, or through a second perforin pore in the endosome the target internalises, into the target
  cytosol; and granzyme B then kills by limited activating proteolysis of executioner caspases and other
  substrates. Whether the target dies by non-inflammatory apoptosis or by lytic pyroptosis is set downstream,
  by whether it expresses a gasdermin that caspase-3 can cleave. A final, optional arm runs the other
  way: caspase-7 escaping through the same pores activates acid sphingomyelinase, whose ceramide supports
  membrane repair and so limits lysis. The module is perforin-dependent throughout - in perforin-null
  animals the lymphocytes are present in normal numbers and simply fail to lyse - which is what makes
  it a single mechanism rather than a collection of cytotoxic activities. Target recognition is included
  as the trigger but the receptor is interchangeable: CD16A grounds the antibody-dependent case here,
  while NKG2D, the T-cell receptor and other activating receptors substitute for it without changing anything
  downstream. Outside the boundary: granule biogenesis, the transcriptional arming of the lymphocyte,
  death-receptor killing, the cytokine arm of lymphocyte effector function, and the apoptotic and pyroptotic
  execution programmes themselves, which are separate modules reached from here.'
status: DRAFT
scope: CONCRETE
module:
