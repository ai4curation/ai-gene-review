  - preferred_term: leukocyte mediated cytotoxicity
    term:
      id: GO:0001909
      label: leukocyte mediated cytotoxicity
  - preferred_term: granzyme-mediated programmed cell death signaling pathway
    term:
      id: GO:0140507
      label: granzyme-mediated programmed cell death signaling pathway
