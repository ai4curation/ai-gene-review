  - order: 7
    role: Killing of pathogens inside the target cell
    optional: true
    node:
      id: antimicrobial_arm
      label: Granulysin killing of intracellular pathogens
      module_type: BIOLOGICAL_PROCESS
      description: 'A second outcome of the same delivery, aimed at the pathogen rather than at the cell
        harbouring it. Granulysin is a cationic saposin-like protein of the same granules; perforin may
        be required as a cofactor for it to enter the host cell, and once inside it is internalised with
        lipid rafts into endosomes that fuse with bacteria-containing phagosomes, where it lyses the bacteria.
        Its mechanism is not the module''s pore-forming motif: electrostatic attraction to the anionic
        microbial surface drives amphipathic refolding that disrupts the membrane and lyses by osmotic
        shock, and it spares membranes of eukaryotic lipid composition, which is precisely what lets a
        lymphocyte deploy it inside its own target. Optional because it operates only against an infected
        target and is not part of killing an uninfected tumour or allogeneic cell.'
