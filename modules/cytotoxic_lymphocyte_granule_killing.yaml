  label: Cytotoxic lymphocyte granule-mediated target cell killing
  module_type: BIOLOGICAL_PROCESS
  description: A six-step chain from target recognition to target death, grounded on human exemplars whose
    gene reviews are complete. Steps three and four are the conserved core; step one is the interchangeable
    trigger and step six is an optional counter-regulatory arm.
