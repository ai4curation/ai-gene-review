module:
  id: cytotoxic_lymphocyte_granule_killing
  label: Cytotoxic lymphocyte granule-mediated target cell killing
  module_type: BIOLOGICAL_PROCESS
  description: A seven-step chain from target recognition to the death of the target or of the pathogen
    inside it, grounded on human exemplars that all have gene reviews in this repository, at mixed curation
    status. Steps three and four are the conserved core; step one is the interchangeable trigger and step
    six is an optional counter-regulatory arm.
