      description: The perforin/granzyme granule system is vertebrate. GO independently treats the immunological
        synapse as vertebrate-restricted. Groundings here are human; conservation across vertebrates is
        asserted for the perforin and granzyme core, not for the particular activating receptor used as
        the trigger.
