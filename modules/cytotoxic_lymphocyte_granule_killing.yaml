  - order: 5
    role: Target cell death execution
    node:
      id: death_execution
      label: Execution of target cell death
      module_type: BIOLOGICAL_PROCESS
      description: The same attack ends in one of two deaths, and which one is a property of the target
        rather than of the lymphocyte. Granzyme B activates caspase-3; in a target that expresses a cleavable
        gasdermin, caspase-3 cuts it and the liberated pore-forming fragment converts the death from non-inflammatory
        apoptosis to lytic, inflammatory pyroptosis. The execution programmes themselves are separate
        modules; what belongs here is the branch point and the activities that set it.
