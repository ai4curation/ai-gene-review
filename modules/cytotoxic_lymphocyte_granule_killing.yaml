  - order: 4
    role: Granzyme B proteolysis in the target cytosol
    node:
      id: granzyme_proteolysis
      label: Granzyme B activating proteolysis of target substrates
      module_type: REACTION
      description: 'Granzyme B, delivered through the pore, kills by limited activating cleavage rather
        than by degradation. It is a chymotrypsin-fold serine protease that cuts after aspartate, which
        is why it can substitute for caspases on their own substrates: it processes the accessible procaspase-3,
        which in turn permits caspase-7 activation, and it cleaves BID to the tBID fragment that drives
        mitochondrial outer-membrane permeabilisation. GO has no granzyme-specific molecular function
        term, so the generic endopeptidase term is as precise as the ontology allows.'
