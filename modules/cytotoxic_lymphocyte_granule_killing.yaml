  - order: 3
    role: Perforin pore formation and cargo translocation
    node:
      id: perforin_pore
      label: Calcium-dependent perforin pore formation in the target membrane
      module_type: TRANSPORT_STEP
      description: 'The conserved core of the module. Released perforin binds the target bilayer through
        its C-terminal C2 domain once calcium is bound, oligomerises into a ring through a membrane-bound
        pre-pore, and inserts amphipathic beta-hairpins to open a large aqueous channel. The channel is
        cargo-selective rather than an indiscriminate hole, favouring cationic molecules including granzyme
        B. Delivery is not confined to the plasma membrane: perforin also triggers endocytosis and then
        perforates the resulting enlarged endosome, and which route predominates in physiological killing
        is still disputed. Both membranes are therefore given as locations.'
