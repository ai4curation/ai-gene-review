        role_description: 'Does two things to the annoton above it, and a reconstituted assay separates
          them. It chaperones syntaxin-11 to the plasma membrane - in patient cells lacking Munc18-2 the
          SNARE is lost from that membrane, while Munc18-2 itself is unaffected in patient cells lacking
