    description: 'The pore delivers granzyme B to the target cytosol. Deliberately PROVIDES_INPUT_FOR
      rather than a regulatory relation: the pore does not change granzyme B''s catalytic rate, which
      it already has, it changes where the enzyme is. The curated GO-CAM asserts direct positive regulation
      here, and that model''s review disputes it on exactly this ground.'
    evidence:
