  notes: 'Boundary decisions worth challenging. Target recognition is inside the module as an interchangeable
    trigger; a reviewer may prefer it as upstream context, which would make the module start at degranulation
    and leave CD16A out. Granule biogenesis and the lymphocyte''s arming are outside. The apoptotic and
    pyroptotic execution programmes are named as the branch point only, since each is its own module and
    this repository already holds apoptotic_execution_phase and intrinsic_apoptotic_signaling.


    Known grounding gaps, stated rather than papered over. Part two has no annoton for the fusion machinery
    that actually executes exocytosis - STX11, UNC13D and STXBP2, the genes behind familial haemophagocytic
    lymphohistiocytosis types 3 to 5 - because none of them has a gene review in this repository. Arl8b
    grounds the trafficking that positions the granule, not the fusion. Granzyme B is the only granzyme
    grounded; granzyme A, granzyme H, granzyme K and granzyme M deliver different substrate programmes
    through the same pore and would each extend part four. Granulysin, which perforin also delivers and
    which kills intracellular bacteria, is absent for the same reason.


