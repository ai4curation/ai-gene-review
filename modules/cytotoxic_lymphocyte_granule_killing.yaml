        degranulation. CD16A grounds the antibody-dependent case, where the determinant is the Fc region
        of IgG bound to the target surface; it is the exemplar rather than the requirement, and NKG2D,
        the T-cell receptor and other activating receptors substitute without altering steps two to six.
        The receptor contributes recognition and signal transduction only - it has no catalytic activity,
        and in CD16A's case no signalling motif of its own, depending on CD247 or FcepsilonRI gamma for
        ITAMs.
