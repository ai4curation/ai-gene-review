          reaction that stalls at hemifusion into complete membrane merger. Mutants with disturbed
          syntaxin-11 binding do neither. That is what makes an SM protein part of the core fusion
          machinery here rather than a regulator of it, and it is why mutations in either gene give the
          same disease: FHL4 for the SNARE, FHL5 for its SM protein.'
        evidence:
        - source_id: PMID:28265073
          title: SM protein Munc18-2 facilitates transition of Syntaxin 11-mediated lipid mixing to complete
            fusion for T-lymphocyte cytotoxicity.
          statement: Munc18-2 takes syntaxin-11-mediated lipid mixing through to complete fusion by promoting
            SNARE complex assembly, not merely by chaperoning the SNARE.
          supporting_text: Our data reveal that Munc18-2 is not just a chaperone of STX11 but also directly
            contributes to complete membrane merging by promoting SNARE complex assembly.
        - source_id: PMID:26771955
          title: Munc18-2 is required for Syntaxin 11 Localization on the Plasma Membrane in Cytotoxic
