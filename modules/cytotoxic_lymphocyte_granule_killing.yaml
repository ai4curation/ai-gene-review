      id: granzyme_proteolysis
      label: Granzyme proteolysis of target substrates
      module_type: REACTION
      description: 'The granzymes, delivered through the pore, kill by limited proteolysis of host substrates.
        Five are grounded here and they share nothing but the delivery route. Granzyme B cleaves after
        aspartate, which lets it substitute for caspases on their own substrates: it processes procaspase-3
        and through it caspase-7, cleaves BID to the tBID fragment that permeabilises mitochondria, and
        cleaves gasdermin E at the caspase-3 site. Granzyme A is a tryptase, cleaving after lysine or
        arginine, and an obligate disulfide-linked homodimer; it cannot touch caspase substrates and kills
        without caspases, by cleaving gasdermin B and by a nuclear programme that frees the SET complex
        to nick DNA and destroys the repair enzyme APEX1. Granzyme H is a chymase with the narrowest specificity of the five and the only
        documented viral substrates; granzyme M cleaves after methionine and reaches the caspases
        indirectly, by removing survivin so that XIAP is degraded; granzyme K is the second tryptase
        and converges with granzyme B on BID, though its principal function is extracellular and sits
        outside this module. GO has no granzyme-specific molecular function term for any of them, so
        all five sit on the generic endopeptidase term and the distinction lives in their substrates.'
