  - order: 2
    role: Granule polarisation and exocytosis at the synapse
    node:
      id: granule_delivery
      label: Polarised delivery of cytolytic granules to the synapse
      module_type: TRANSPORT_STEP
      description: 'Cytolytic granules, which are secretory lysosomes holding perforin and granzymes as
        soluble cargo, are moved to the synapse and fuse with the plasma membrane, releasing their contents
        into the cleft. Arl8b grounds the trafficking step: it is the lysosomal Arf-like GTPase that drives
        granule polarisation, and silencing it leaves perforin-containing granules away from the contact
        while leaving granule content intact. The machinery that executes the fusion is now grounded beside
        it, one annoton each: syntaxin-11 contributes the Qa helix of the bundle, Munc18-2 chaperones that
        SNARE to the plasma membrane and then drives the complex past hemifusion to complete fusion, and
        Munc13-4 primes the granule and assembles the endosomal exocytic vesicle that it fuses with. The
        three are not interchangeable and the clinical genetics says so: FHL3, FHL4 and FHL5 are the same
        failure reached through UNC13D, STX11 and STXBP2 respectively, with Griscelli syndrome type 2 a
        fourth route through the GTPase that Munc13-4 is the effector of.'
