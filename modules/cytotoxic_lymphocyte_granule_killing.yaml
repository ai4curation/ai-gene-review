    notes: 'The compartments belong to two different cells, which no GO cellular-component annotation
      can express: the granule and its exocytosis are in the killer cell, while the plasma membrane that
      is perforated and the cytosol where granzyme B works belong to the target. Reading any single location
      here without that in mind will mislead.'
