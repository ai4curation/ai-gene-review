        - source_id: file:interpro/panther/PTHR23129/PTHR23129-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      description: 'Optional because the FIT family is not shown to be eukaryote-wide: interpro/panther/PTHR23129/PTHR23129-entries.csv
        lists yeast and animal members but no Arabidopsis or Dictyostelium member, and the PAINT node
        is at Opisthokonta (taxon:33154).'
  connections:
  - source: dag_acylation
    target: fit_budding
    connection_type: PROVIDES_INPUT_FOR
    description: Triacylglycerol accumulating in the ER bilayer buds into a droplet with FIT proteins.
