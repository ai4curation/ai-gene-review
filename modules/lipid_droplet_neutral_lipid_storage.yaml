id: MODULE:lipid_droplet_neutral_lipid_storage
title: Triacylglycerol synthesis for lipid droplet formation
description: Lipid droplets form in the endoplasmic reticulum membrane when neutral lipids, chiefly triacylglycerol
  and sterol esters, are made between the two leaflets, coalesce into a lens and bud toward the cytosol
  as an oil core covered by a phospholipid monolayer. The committed step of triacylglycerol storage is
  the acylation of diacylglycerol, catalysed in eukaryotes by two unrelated acyl-CoA-dependent enzyme
  families, DGAT1 and DGAT2, either of which can supply a droplet. This module is the eukaryote-wide core
  of that step, written so that it can be evaluated in any genome.
status: DRAFT
scope: CONCRETE
notes: 'Eukaryote-wide scope: PAINT places the DGAT1 and DGAT2 nodes cited here at Eukaryota (taxon:2759)
  with F:GO:0004144; each node is shown to be an ancestor of the human protein by its IBA rows or its
  IBD seeds. Read as a satisfiability rule, a genome needs at least one of the two DGAT families (a ONE_OR_MORE
  realizer set). FIT proteins are optional (see that part). Molecular functions come from the human DGAT1
  and DGAT2 reviews, and for FIT from the node''s F IBD. Selector caveats are on each family: both DGAT
  variants use the subfamilies their family reviews allow and may miss other lineages'', and no yeast
  DGAT1 is listed. Not modelled: seipin, which organizes droplet nucleation sites but whose human protein
  (BSCL2) has no local PANTHER entry; the acyl-CoA-independent PDAT route (yeast Lro1, fission yeast Plh1,
  plant PDAT1), which has no human member; and the perilipins and other surface proteins, which are lineage-specific.
  The sterol acyltransferases (Are1/Are2, SOAT1/SOAT2) make the sterol-ester half of the droplet core;
  they share PTHR10408 with DGAT1 and are excluded from it here, so the rule tests only triacylglycerol
  synthesis. The upstream glycerolipid pathway is described in triacylglycerol_biosynthesis.'
module:
  id: lipid_droplet_neutral_lipid_storage
  label: Triacylglycerol synthesis for lipid droplet formation
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: triglyceride biosynthetic process
    term:
      id: GO:0019432
      label: triglyceride biosynthetic process
  - preferred_term: lipid droplet formation
    term:
      id: GO:0140042
      label: lipid droplet formation
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
  parts:
  - order: 1
    role: neutral lipid synthesis
    node:
      id: dag_acylation
      label: Acyl-CoA:diacylglycerol acyltransferase
      module_type: REACTION
      variant_sets:
      - id: dgat_family
        label: DGAT enzyme family
        axis: enzyme family
        variant_kind: REALIZER
        selection: ONE_OR_MORE
        notes: DGAT1 and DGAT2 are unrelated families with the same activity; many eukaryotes have both,
          yeasts only DGAT2, hence ONE_OR_MORE.
        variants:
        - id: dgat1_variant
          label: DGAT1 (MBOAT family)
          module_type: REACTION
          annotons:
          - id: dgat1_mboat
            label: DGAT1 (MBOAT-family) diacylglycerol acyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DGAT1 subfamilies
                family_terms:
                - id: PANTHER:PTHR10408:SF7
                  label: DIACYLGLYCEROL O-ACYLTRANSFERASE 1
                - id: PANTHER:PTHR10408:SF12
                  label: DIACYLGLYCEROL O-ACYLTRANSFERASE 1-1
                - id: PANTHER:PTHR10408:SF22
                  label: DIACYLGLYCEROL O-ACYLTRANSFERASE 1A
                representative_members:
                - preferred_term: DGAT1 (human)
                  term:
                    id: UniProtKB:O75907
                    label: Diacylglycerol O-acyltransferase 1
                - preferred_term: DGAT1-1 (rice)
                  term:
                    id: UniProtKB:Q5I396
                    label: Diacylglycerol O-acyltransferase 1-1
                - preferred_term: DGAT1A (soybean)
                  term:
                    id: UniProtKB:Q5GKZ7
                    label: Diacylglycerol O-acyltransferase 1A
                ancestral_nodes:
                - preferred_term: PAINT node PTN000045226
                  term:
                    id: PANTHER:PTN000045226
                    label: PTN000045226
                  description: 'PANTHER PAINT ancestral node PTN000045226 in family PTHR10408, placed
                    at taxon:2759 (Eukaryota); IBD seeds from Arabidopsis thaliana, Bos taurus, Dictyostelium
                    discoideum, Drosophila melanogaster, Glycine max, Homo sapiens, Mus musculus, Rattus
                    norvegicus and 1 seed whose species is not resolved locally (UniProtKB:F1MIW3). IBD
                    GO terms at this node: F:GO:0004144, P:GO:0019432. PAINT rows dated 20170228-20200807.
                    Human DGAT1 descends from it (its IBA rows cite PTN000045226; it is one of the node''s
                    IBD seeds).'
                  evidence:
                  - source_id: GO_REF:0000033
                    statement: IBD propagation from PAINT ancestral node PTN000045226 in PANTHER family
                      PTHR10408.
                description: 'Three subfamilies of the MBOAT sterol O-acyltransferase family PTHR10408,
                  the ones the PTHR10408 family review allows diacylglycerol O-acyltransferase activity
                  for: SF7 (Arabidopsis, Dictyostelium and human DGAT1), SF12 (rice DGAT1-1, Q5I396) and
                  SF22 (soybean DGAT1A and DGAT1B, Q5GKZ7 and I1MSF2). The sterol acyltransferases (human
                  SOAT1/SOAT2, yeast Are1/Are2) in the same family are excluded. No yeast member is listed:
                  budding and fission yeast make triacylglycerol with Dga1 (the DGAT2 variant) and the
                  acyl-CoA-independent Lro1/Plh1.'
            function:
              preferred_term: diacylglycerol O-acyltransferase activity
              term:
                id: GO:0004144
                label: diacylglycerol O-acyltransferase activity
            locations:
            - preferred_term: endoplasmic reticulum membrane
              term:
                id: GO:0005789
                label: endoplasmic reticulum membrane
            role_description: Multipass ER-membrane acyltransferase that esterifies diacylglycerol with
              acyl-CoA to make triacylglycerol in the ER bilayer.
            evidence:
            - source_id: file:genes/human/DGAT1/DGAT1-ai-review.yaml
              statement: 'Reviewed core function of human DGAT1: diacylglycerol O-acyltransferase activity.'
            - source_id: file:interpro/panther/PTHR10408/PTHR10408-paint.tsv
              statement: PAINT ancestral-node rows for this step's family.
        - id: dgat2_variant
          label: DGAT2 family
          module_type: REACTION
          annotons:
          - id: dgat2_family
            label: DGAT2-family diacylglycerol acyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DGAT2 subfamilies
                family_terms:
                - id: PANTHER:PTHR12317:SF14
                  label: DIACYLGLYCEROL O-ACYLTRANSFERASE 2
                - id: PANTHER:PTHR12317:SF0
                  label: ACYLTRANSFERASE
                - id: PANTHER:PTHR12317:SF63
                  label: DIACYLGLYCEROL O-ACYLTRANSFERASE 2
                representative_members:
                - preferred_term: DGAT2 (human)
                  term:
                    id: UniProtKB:Q96PD7
                    label: Diacylglycerol O-acyltransferase 2
                - preferred_term: DGA1 (budding yeast)
                  term:
                    id: UniProtKB:Q08650
                    label: Diacylglycerol O-acyltransferase 1
                - preferred_term: DGAT2 (Arabidopsis)
                  term:
                    id: UniProtKB:Q9ASU1
                    label: Diacylglycerol O-acyltransferase 2
                - preferred_term: dga1 (fission yeast)
                  term:
                    id: UniProtKB:O74850
                    label: Diacylglycerol O-acyltransferase 1
                ancestral_nodes:
                - preferred_term: PAINT node PTN000268127
                  term:
                    id: PANTHER:PTN000268127
                    label: PTN000268127
                  description: 'PANTHER PAINT ancestral node PTN000268127 in family PTHR12317, placed
                    at taxon:2759 (Eukaryota); IBD seeds from Arabidopsis thaliana, Bos taurus, Dictyostelium
                    discoideum, Glycine max, Homo sapiens, Mus musculus, Rattus norvegicus, Saccharomyces
                    cerevisiae, Schizosaccharomyces pombe and 1 seed whose species is not resolved locally
                    (UniProtKB:Q57ZE1). IBD GO terms at this node: C:GO:0005789, F:GO:0004144, P:GO:0019432.
                    PAINT rows dated 20250903-20260528. Human DGAT2 descends from it (its IBA rows cite
                    PTN000268127; it is one of the node''s IBD seeds).'
                  evidence:
                  - source_id: GO_REF:0000033
                    statement: IBD propagation from PAINT ancestral node PTN000268127 in PANTHER family
                      PTHR12317.
                description: 'Three subfamilies of PTHR12317 together cover the DGAT2 enzymes: SF14 (vertebrate
                  DGAT2), SF0 (budding yeast, fission yeast and Dictyostelium Dga1) and SF63 (Arabidopsis
                  DGAT2). The rest of the family, the monoacylglycerol acyltransferases MOGAT1-3 and the
                  wax-ester synthases AWAT1/2, is excluded, because the PTHR12317 family review allows
                  diacylglycerol O-acyltransferase activity at subfamily level only. The family review
                  narrows the PAINT node rather than restating it: the F:GO:0004144 IBD at PTN000268127
                  is seeded partly from human MOGAT3 (Q86VF5, SF36) and DGAT2L6 (Q6ZPD8, SF19), members
                  of subfamilies this selector excludes. An IRD at PTN000268139 (taxon:32523, Tetrapoda)
                  negates F:GO:0004144 and P:GO:0019432 below PTN000268127, which fits that subfamily-level
                  restriction; which tetrapod members it covers has not been checked. Other lineages''
                  DGAT2 subfamilies are not listed, so their genomes may fail this variant for want of
                  a selector.'
            function:
              preferred_term: diacylglycerol O-acyltransferase activity
              term:
                id: GO:0004144
                label: diacylglycerol O-acyltransferase activity
            locations:
            - preferred_term: endoplasmic reticulum membrane
              term:
                id: GO:0005789
                label: endoplasmic reticulum membrane
            role_description: ER-membrane acyltransferase, also found on lipid droplets, that esterifies
              diacylglycerol with acyl-CoA to make triacylglycerol.
            evidence:
            - source_id: file:genes/human/DGAT2/DGAT2-ai-review.yaml
              statement: 'Reviewed core function of human DGAT2: diacylglycerol O-acyltransferase activity.'
            - source_id: file:interpro/panther/PTHR12317/PTHR12317-paint.tsv
              statement: PAINT ancestral-node rows for this step's family.
  - order: 2
    role: droplet budding
    optional: true
    node:
      id: fit_budding
