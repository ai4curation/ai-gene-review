              term:
                id: UniProtKB:Q8N6M3
                label: Acyl-coenzyme A diphosphatase FITM2
            ancestral_nodes:
            - preferred_term: PAINT node PTN000565881
              term:
                id: PANTHER:PTN000565881
                label: PTN000565881
              description: 'PANTHER PAINT ancestral node PTN000565881 in family PTHR23129, placed at taxon:33154;
                IBD seeds from Caenorhabditis elegans, Homo sapiens, Mus musculus and Saccharomyces cerevisiae.
                IBD GO terms at this node: C:GO:0005789, F:GO:0016818, P:GO:0055088, P:GO:0140042. PAINT
                rows dated 20250903-20260306. Human FITM2 descends from it (its IBA rows cite PTN000565881;
                it is one of the node''s IBD seeds).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000565881 in PANTHER family PTHR23129.
        function:
          preferred_term: hydrolase activity, acting on acid anhydrides, in phosphorus-containing anhydrides
          term:
            id: GO:0016818
            label: hydrolase activity, acting on acid anhydrides, in phosphorus-containing anhydrides
          description: The F IBD at PTN000565881. The human FITM2 review records acyl-CoA diphosphatase
            activity (GO:0010945), and PAINT places that narrower term at PTN002751040 (taxon:117571,
            Euteleostomi), a descendant of this opisthokont node seeded by human FITM2 alone. The family
            also holds FITM1, whose diphosphatase activity is not established, so the family-level selector
            carries the node's parent term.
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: ER-membrane protein needed for lipid droplets to bud from the ER toward the
          cytosol; human FITM2 has been shown to cleave the diphosphate bond of acyl-CoA.
        evidence:
        - source_id: GO_REF:0000033
