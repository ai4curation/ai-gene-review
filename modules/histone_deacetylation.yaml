          - preferred_term: histone deacetylase complex
            term:
              id: GO:0000118
              label: histone deacetylase complex
        evidence:
          - source_id: PMID:10944117
            statement: SMRT and N-CoR each form large HDAC3-containing complexes in human cells.
            supporting_text: These findings thus establish both SMRT and N-CoR complexes as bona fide HDAC-containing complexes
          - source_id: PMID:10809664
            statement: The core SMRT complex contains TBL1 bridged to HDAC3 through SMRT.
            supporting_text: In vivo, TBL1 is bridged to HDAC3 through SMRT and can potentiate repression by TR.
          - source_id: PMID:11931768
            statement: >-
              GPS2 is an integral subunit; GPS2 and TBL1 bind repression domain 1 of
              N-CoR, and an extended N-CoR SANT domain activates latent HDAC3.
            supporting_text: GPS2 and TBL1, another component of the N-CoR-HDAC3 complex, interact cooperatively with repression domain 1 of N-CoR to form a heterotrimeric structure and are indirectly linked to HDAC3 via an extended N-CoR SANT domain that also activates latent HDAC3 activity.
          - source_id: PMID:12628926
            statement: >-
              In the purified human N-CoR complex HDAC3 is essential for repression,
              and TBL1 and TBLR1 are redundant histone-binding subunits.
            supporting_text: we demonstrate that HDAC3 is essential, whereas TBL1 and TBLR1 are functionally redundant but essential for repression by unliganded thyroid hormone receptor.
