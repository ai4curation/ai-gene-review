id: MODULE:histone_deacetylation
title: Human histone deacetylation — class I HDAC corepressor complexes (SIN3A-HDAC1/2, CoREST RCOR1-KDM1A-HDAC1/2 and NCoR/SMRT-HDAC3 with its class IIa HDAC4/5/7/9 adaptors), NuRD by reference, and the NAD-dependent histone deacetylases SIRT1, SIRT6 and SIRT7
description: >-
  Removal of acetyl groups from lysine residues in histone tails restores their
  positive charge and the binding sites they lose to bromodomain readers, and is a
  principal enzymatic route to transcriptional repression and chromatin
  compaction. Two chemically distinct enzyme families do it in human cells. The
  zinc-dependent class I deacetylases HDAC1, HDAC2 and HDAC3 hydrolyse the
  acetyl-lysine amide to release acetate. They are nearly inactive alone and
  work inside corepressor complexes whose scaffold subunits activate them and
  bring them to chromatin: HDAC1 and HDAC2 in the SIN3A complex (with RBBP4/7,
  SAP30, SUDS3 and SAP18), in the CoREST complex (with the SANT-domain
  corepressor RCOR1, the demethylase KDM1A, HMG20B and PHF21A) and in NuRD;
  HDAC3 in the NCoR/SMRT complex, where the deacetylase activation domain of
  NCOR1 or NCOR2, held by inositol tetrakisphosphate, switches on the enzyme
  and the WD40 proteins TBL1X/TBL1XR1 and GPS2 complete the complex. The class
  IIa HDACs HDAC4, HDAC5, HDAC7 and HDAC9 carry a histidine in place of a
  catalytic tyrosine and are about a thousand-fold less active on acetyl-lysine;
  they repress MEF2 and other transcription factor targets by bridging them to
  the NCoR/SMRT-HDAC3 complex. The class III sirtuins SIRT1, SIRT6 and SIRT7
  instead transfer the acetyl group to NAD+, releasing nicotinamide and
  2''-O-acetyl-ADP-ribose: SIRT1 prefers H4K16 and H3K9, SIRT6 deacetylates
  H3K9 and H3K56 at telomeres and DNA breaks, and SIRT7 deacetylates H3K18 at
  promoters it is recruited to.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD's histone modification pathway names the deacetylases as the erasers of
      lysine acetylation and divides them into the zinc-dependent classes I, II and
      IV and the NAD-dependent class III sirtuins. RGD curates HDAC1 to HDAC11,
      SIRT1 to SIRT7 and KDM1A among its 173 human genes. The pathway has no
      specific GO process mapping, so the project splits it into one module per
      writer-eraser system
      (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md); this module is
      the deacetylation system.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD divides the histone deacetylases into zinc-dependent classes and the NAD-dependent sirtuins.
    supporting_text: into four classes of which class I, II and IV are the classical, zinc-dependent enzymes and class III
  - source_id: GO:0004407
    title: histone deacetylase activity
    statement: >-
      The GO concept for the module. GO has no histone deacetylation process: the
      former process term was obsoleted because it represents a molecular
      function, so the module is typed by the activity, and its two mechanistic
      children (hydrolytic and NAD-dependent) are carried by the catalytic
      annotons.
  - source_id: PMID:22230954
    title: Structure of HDAC3 bound to co-repressor and inositol tetraphosphate.
    statement: >-
      Class I HDACs are active in corepressor complexes rather than alone; this is
      why each class I deacetylase is modelled inside its complex.
    supporting_text: The enzymatic activity of most class I HDACs requires recruitment into multi-subunit co-repressor complexes, which are in turn recruited to chromatin by repressive transcription factors.
  - source_id: PMID:11102443
    title: Stable histone deacetylase complexes distinguished by the presence of SANT domain proteins CoREST/kiaa0071 and Mta-L1.
    statement: >-
      HDAC1 and HDAC2 partition into distinct stable complexes, one containing
      CoREST and the KDM1A precursor name kiaa0601, the other NuRD.
    supporting_text: Complex cI (9.5 S) contained transcriptional corepressor CoREST/kiaa0071 and a protein homologous to FAD-dependent oxidoreductases, kiaa0601.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001338 (histone modification
  pathway) through the RGD_PATHWAY_ONTOLOGY project, as module 4 of the histone
  modification split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md;
  seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier
  no_specific_go_term, flagged broad, 173 RGD-curated human genes). The pathway has
  no GO process mapping and GO has no histone deacetylation process (the former
  term is obsolete because it described a molecular function), so the module is
  typed by the activity histone deacetylase activity and module_type
  MOLECULAR_FUNCTION; the catalytic annotons carry its hydrolytic and
  NAD-dependent children, using the current site-specific labels (for example
  histone H3K18 deacetylase activity, NAD-dependent). Sibling modules from the
  same plan: polycomb_repressive_complexes, compass_family_h3k4_methylation,
  histone_acetyltransferase_complexes (the writers whose marks these enzymes
  remove), histone_lysine_demethylation and histone_arginine_methylation.


  RGD genes used (11 of the list): HDAC1, HDAC2, HDAC3, HDAC4, HDAC5, HDAC7, HDAC9,
  KDM1A, SIRT1, SIRT6, SIRT7. RGD genes left out of this module: HDAC6 and HDAC10
  (class IIb; HDAC6 is a cytoplasmic tubulin and HSP90 deacetylase and HDAC10 a
  polyamine deacetylase), HDAC8 (class I but not a corepressor-complex enzyme; its
  established substrate is cohesin SMC3), HDAC11 (class IV, a fatty-acyl
  deacylase), SIRT2 (mainly cytoplasmic; its mitotic H4K16 deacetylation is a
  minor role) and the mitochondrial SIRT3, SIRT4 and SIRT5. Any of these could be
  added as a further variant if a human histone role is to be modelled. The
  readers, writers and other erasers on the RGD list belong to the sibling
  modules. Participants added that are not on the RGD list, each with human
  evidence cited on its node: SIN3A, SAP30, SUDS3, SAP18, RBBP4, RBBP7 (SIN3
  complex; PMID:9150135, PMID:9651585, PMID:21239494); RCOR1, HMG20B, PHF21A
  (CoREST complex; PMID:11171972, PMID:12032298); NCOR1, NCOR2, TBL1X, TBL1XR1,
  GPS2 (NCoR/SMRT complex; PMID:10944117, PMID:10809664, PMID:11931768,
  PMID:12628926).


  Boundary decisions. (1) Each complex is a part; HDAC1 and HDAC2 appear in the
  SIN3A and CoREST parts and, by module_ref, in nurd_complex, which is not
  remodelled. (2) KDM1A is a CoREST unit only, with no function asserted: its
  demethylase activity belongs to histone_lysine_demethylation. (3) The class IIa
  HDACs (HDAC4, HDAC5, HDAC7, HDAC9) are an optional adaptor part beside the
  NCoR/SMRT-HDAC3 part and are given no deacetylase activity, applying the
  CLAUDE.md rule that measured activity is not automatically function: the
  catalytic tyrosine is a histidine, the isolated HDAC4 domain is about 1000-fold
  less active than class I enzymes, activity in class IIa immunoprecipitates comes
  from copurifying HDAC3, and reconstitution shows class II HDACs do not
  contribute to the SMRT/N-CoR-HDAC3 activity (PMID:11804585, PMID:17956988). The
  HDAC5 gene review marks its histone deacetylase rows as over-annotations; the
  HDAC4 gene review accepted them, which this module does not follow (its core
  functions there are corepressor and adaptor activities). (4) The sirtuin part is
  a ONE_OR_MORE variant set of separate enzymes, not a complex; SIRT1 and SIRT6
  each have two annotons for their best-supported histone sites. The eNoSC
  complex (SIRT1 with NML and SUV39H1) is not modelled because only its SIRT1
  activity is deacetylation. (5) The SIN3B complex (SIN3B with PHF12 and MORF4L1)
  and the larger SIN3A-associated proteins (ARID4A/B, SAP130, BRMS1, SINHCAF) are
  not parts; only the core SIN3A complex with direct human purification evidence
  is modelled. (6) Further CoREST-associated proteins (ZNF217, ZMYM2, GSE1, GTF2I)
  and the paralogues RCOR2/RCOR3 and KDM1B are not parts. (7) DNA-binding
  repressors that recruit these complexes (MAD-MAX, REST, unliganded nuclear
  receptors, MEF2) are targeting context, and histones are substrates, not
  participants. (8) Chemicals: hydrolytic deacetylation is grounded to RHEA:58196,
  the exact Rhea match of GO:0141221; NAD-dependent deacetylation to the generic
  protein reaction RHEA:43636 with NAD+, nicotinamide and 2''-O-acetyl-ADP-D-ribose
  as ChEBI participants, because Rhea has no histone-specific NAD-dependent
  reaction. Inositol 1,4,5,6-tetrakisphosphate is recorded as the HDAC3 cofactor
  (PMID:22230954).


  Functions. Catalytic annotons use the subunits' experimental rows (QuickGO,
  November 2026): GO:0141221 for HDAC1, HDAC2 and HDAC3 (EXP); the NAD-dependent
  site-specific terms for SIRT1 (H4K16, H3K9), SIRT6 (H3K9, H3K56) and SIRT7 (H3K18)
  (IDA). Non-catalytic subunits carry experimental non-binding rows where they
  exist (transcription corepressor activity for SIN3A, SAP30, NCOR1 and GPS2;
  enzyme activator activity for NCOR2; histone binding for RBBP4, RBBP7, TBL1X and
  TBL1XR1; transcription factor binding for HDAC7 and HDAC9). Curator-authored or
  review-derived functions: HDAC5 transcription corepressor activity (core
  function of the HDAC5 review; no experimental row) and HDAC4 molecular adaptor
  activity (core function of the HDAC4 review; its IDA row is from an interferon
  signalling context). No function is given to RCOR1, KDM1A, HMG20B, PHF21A,
  SUDS3 or SAP18, and no complex-level activity is asserted; generic protein
  binding is not used. Gene reviews exist for HDAC4, HDAC5, SIRT1 and NCOR1.


  GO-CAM. Of the members, the histone-relevant activities in gocams/index.tsv are
  SIRT6's: NAD-dependent histone deacetylase activity in gomodel:6205c24300000050
  (pinned to the SIRT6 H3K9 annoton, its best-supported generic histone activity)
  and H3K56 deacetylase activity in gomodel:62183af000000536 (pinned to the SIRT6
  H3K56 annoton). Not pinned: HDAC1 histone deacetylase activity in
  gomodel:69c59f8a00000219 (CDKN1A induction via PCAF-SAGA; the seed's best GO-CAM,
  but the model names no HDAC1 complex), KDM1A H3K4 demethylase activity (the
  sibling demethylation module), and the HDAC3, HDAC4, HDAC7, SIRT1 and SIRT7
  activities, which act on non-histone substrates.


  Observations for upstream review. (a) GOA carries hydrolytic-mechanism histone
  deacetylase rows on sirtuins, which use NAD+: SIRT1 histone H4K12 deacetylase
  activity, hydrolytic mechanism (IDA, PMID:15469825) and SIRT6 histone H3K9
  deacetylase activity, hydrolytic mechanism (EXP, PMID:33067423); the NAD-dependent
  sibling terms appear to be intended. (b) Histone deacetylase activity IDA/EXP
  rows on HDAC4, HDAC5 and HDAC9 (and HDAC9 histone H4K16 deacetylase activity,
  hydrolytic mechanism, IDA PMID:28855441) conflict with PMID:11804585 and
  PMID:17956988. (c) GO has no CoREST or NCoR/SMRT complex term; both are
  requested in proposed_new_terms. PANTHER family ids and PTNs are deliberately
  not asserted.
proposed_new_terms:
  - proposed_name: CoREST complex
    proposed_definition: >-
      A histone deacetylase complex built on a CoREST-family SANT-domain
      corepressor (in human RCOR1, RCOR2 or RCOR3) that binds the class I histone
      deacetylases HDAC1 and/or HDAC2 and the flavin-dependent histone demethylase
      LSD1 (KDM1A), and in its core form also contains HMG20B and PHF21A. It
      represses target genes, notably neuronal genes bound by REST, by combined
      histone deacetylation and H3K4 demethylation.
    justification: >-
      GO has NuRD complex and Sin3-type complex under histone deacetylase complex,
      but no term for the third major vertebrate HDAC1/2 complex, which is purified
      as a distinct stable complex lacking RBBP4/7. Subunits are currently annotated
      only to histone deacetylase complex, transcription repressor complex,
      histone methyltransferase complex or DNA repair complex. The only LSD1-related
      complex term in GO, Lsd1/2 complex, is defined as two SWIRM-domain
      demethylases with two PHD-finger proteins, first identified in fission yeast,
      and contains no CoREST corepressor or histone deacetylase.
    proposed_parent:
      id: GO:0000118
      label: histone deacetylase complex
    supported_by:
      - reference_id: PMID:11171972
        supporting_text: CoREST-HDAC is composed of polypeptides distinct from previously characterized HDAC1/2-containing complexes such as the mSin3 and nucleosome remodeling and deacetylating (NRD, also named NURD, NuRD) complex.
      - reference_id: PMID:12032298
        supporting_text: Here we report the isolation of a six-subunit core-BRAF35 complex with the capacity to deacetylate histones, termed the BRAF-histone deacetylase complex (BHC), from human cells.
  - proposed_name: NCoR-HDAC3 complex
    proposed_definition: >-
      A histone deacetylase complex in which the nuclear receptor corepressor
      NCoR (NCOR1) or SMRT (NCOR2) binds and activates the class I histone
      deacetylase HDAC3 through its deacetylase activation domain, together with
      the WD40-repeat proteins TBL1X and/or TBL1XR1 and GPS2. It is recruited by
      unliganded nuclear receptors and other repressors.
    justification: >-
      GO has no term for this complex; its subunits are annotated to histone
      deacetylase complex or transcription repressor complex. The complex is
      purified from human cells for both NCoR and SMRT and is the context in which
      HDAC3 is catalytically active.
    proposed_parent:
      id: GO:0000118
      label: histone deacetylase complex
    supported_by:
      - reference_id: PMID:10944117
        supporting_text: These findings thus establish both SMRT and N-CoR complexes as bona fide HDAC-containing complexes
      - reference_id: PMID:11931768
        supporting_text: We report here that GPS2, a protein involved in intracellular signaling, is an integral subunit of the N-CoR-HDAC3 complex.
module:
  id: histone_deacetylation
  label: Human histone deacetylation
  module_type: MOLECULAR_FUNCTION
  description: >-
    Class I HDAC corepressor complexes (SIN3A, CoREST, NCoR/SMRT and, by
    reference, NuRD), the class IIa HDACs as adaptors to the NCoR/SMRT-HDAC3
    complex, and the NAD-dependent histone deacetylases SIRT1, SIRT6 and SIRT7.
  concepts:
    - preferred_term: histone deacetylase activity
      term:
        id: GO:0004407
        label: histone deacetylase activity
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: SIN3A-HDAC1/2 corepressor complex
      node:
        id: sin3a_hdac_complex
        label: SIN3A-HDAC1/2 complex
        module_type: PROTEIN_COMPLEX
        description: >-
          The SIN3A scaffold carries HDAC1 and/or HDAC2, the histone-binding WD40
          proteins RBBP4 and RBBP7, and the SIN3-associated polypeptides SAP30,
          SUDS3 (SDS3) and SAP18. DNA-binding repressors such as MAD-MAX tether it
          to target promoters. The purified complex deacetylates histone octamers.
        concepts:
          - preferred_term: Sin3-type complex
            term:
              id: GO:0070822
              label: Sin3-type complex
        evidence:
          - source_id: PMID:9150135
            statement: >-
              The human SIN3 complex contains HDAC1 and HDAC2, histone-tethering
              polypeptides and SAP18 and SAP30.
            supporting_text: We have found that the mammalian transcriptional repressor Sin3 (mSin3) exists in a complex with histone deacetylases HDAC1 and HDAC2.
          - source_id: PMID:9651585
            statement: >-
              The SAP30 complex contains SIN3, HDAC1, HDAC2 and the histone-binding
              proteins RbAp46 (RBBP7) and RbAp48 (RBBP4), and deacetylates core
              histone octamers but not nucleosomal histones in vitro.
            supporting_text: The human SAP30 complex is active in deacetylating core histone octamers, but inactive in deacetylating nucleosomal histones due to the inability of the histone binding proteins RbAp46 and RbAp48 to gain access to nucleosomal histones.
        annotons:
          - id: sin3a_scaffold
            label: SIN3A scaffold of the SIN3-HDAC complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SIN3A
                term:
                  id: UniProtKB:Q96ST3
                  label: Paired amphipathic helix protein Sin3a
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
            role_description: >-
              Scaffold that binds HDAC1/2 and the other subunits and is tethered to
              DNA by repressors such as MAD-MAX. Function from the human IMP row
              (PMID:22783022); SIN3A has no catalytic activity, and the complex's
              deacetylation is carried by HDAC1/2.
          - id: sin3_sap30
            label: SAP30 subunit of the SIN3-HDAC complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SAP30
                term:
                  id: UniProtKB:O75446
                  label: Histone deacetylase complex subunit SAP30
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
            role_description: >-
              SIN3-associated polypeptide identified in the purified human complex
              (PMID:9651585), from which its IDA transcription corepressor activity
              row comes. No catalytic role.
          - id: sin3_suds3
            label: SUDS3 (SDS3) subunit of the SIN3-HDAC complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SUDS3
                term:
                  id: UniProtKB:Q9H7L9
                  label: Sin3 histone deacetylase corepressor complex component SDS3
            role_description: >-
              Core subunit that maintains the HDAC activity of the SIN3A complex.
              Human GOA records it as contributing to histone deacetylase activity
              (IDA, PMID:21239494); a contributing subunit is given no function of
              its own here, because the catalysis belongs to HDAC1/2.
            evidence:
              - source_id: PMID:21239494
                statement: SDS3 is a core component of the SIN3A complex and maintains its HDAC activity.
                supporting_text: SDS3 is a key component of the histone deacetylase (HDAC)-dependent Sin3A co-repressor complex, serving to maintain its HDAC activity.
          - id: sin3_sap18
            label: SAP18 subunit of the SIN3-HDAC complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SAP18
                term:
                  id: UniProtKB:O00422
                  label: Histone deacetylase complex subunit SAP18
            role_description: >-
              SIN3-binding polypeptide of the human complex that represses
              transcription when tethered to a promoter. Its only experimental MF
              row is high-throughput RNA binding, reflecting its separate role in
              the ASAP/exon junction complex; no function is asserted here.
            evidence:
              - source_id: PMID:9150135
                statement: SAP18 is a component of a SIN3 complex in vivo and binds SIN3 directly.
                supporting_text: Moreover, we demonstrate a direct interaction between SAP18 and mSin3.
        variant_sets:
          - id: sin3_hdac_paralog
            label: class I histone deacetylase (HDAC1 or HDAC2)
            axis: paralogue (HDAC1 versus HDAC2)
            variant_kind: REALIZER
