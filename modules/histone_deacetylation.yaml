    - order: 4
      role: class IIa HDACs as adaptors to the NCoR/SMRT-HDAC3 complex
      optional: true
      node:
        id: class_iia_hdac_adaptors
        label: Class IIa HDACs (HDAC4, HDAC5, HDAC7, HDAC9) bridge transcription factors to NCoR/SMRT-HDAC3
        module_type: MOLECULAR_FUNCTION
        description: >-
          The class IIa HDACs bind MEF2 and other DNA-binding transcription factors
          through their N-terminal regions and, through their HDAC domain, the
          NCoR/SMRT-HDAC3 complex, so that they bring the active HDAC3 enzyme to
          target genes. Signal-dependent phosphorylation and 14-3-3 binding export
          them from the nucleus and relieve repression. Their own deacetylase
          domain carries a histidine in place of the catalytic tyrosine and is
          about a thousand-fold less active than class I enzymes on acetyl-lysine;
          deacetylase activity measured in their immunoprecipitates comes from
          associated HDAC3. No histone deacetylase activity is therefore asserted
          for them, although human GOA carries IDA rows for HDAC4, HDAC5 and HDAC9.
        evidence:
          - source_id: PMID:11804585
            statement: >-
              Class II HDACs are inactive in the SMRT/N-CoR-HDAC3 complex and act by
              bridging it to transcription factors.
            supporting_text: These observations indicate that class II HDACs regulate transcription by bridging the enzymatically active SMRT/N-CoR-HDAC3 complex and select transcription factors independently of any intrinsic HDAC activity.
          - source_id: PMID:11804585
            statement: Reconstitution shows class II HDACs do not contribute to the complex's enzymatic activity.
            supporting_text: In vitro reconstitution experiments indicate that HDAC4 and other class II HDACs are inactive in the context of the SMRT/N-CoR-HDAC3 complex and do not contribute to its enzymatic activity.
          - source_id: PMID:17956988
            statement: >-
              The bacterially expressed HDAC4 catalytic domain is a thousand-fold
              less active than class I HDACs, and activity in HDAC4 assays reflects
              copurified class I HDACs.
            supporting_text: Moreover, an HDAC4 catalytic domain purified from bacteria was 1,000-fold less active than class I HDACs on standard substrates.
          - source_id: PMID:17956988
            statement: The catalytic tyrosine of other HDACs is a histidine in vertebrate class IIa enzymes.
            supporting_text: A catalytic Tyr is conserved in all HDACs except for vertebrate class IIa enzymes where it is replaced by His.
        variant_sets:
          - id: class_iia_paralog
            label: class IIa HDAC adaptor (HDAC4, HDAC5, HDAC7 or HDAC9)
            axis: paralogue and cell type (class IIa HDACs are expressed in muscle, heart, brain, T cells and endothelium in different combinations)
