    - order: 2
      role: CoREST corepressor complex (RCOR1-KDM1A-HDAC1/2)
      node:
        id: corest_complex
        label: CoREST (BHC) complex
        module_type: PROTEIN_COMPLEX
        description: >-
          The SANT-domain corepressor RCOR1 (CoREST) binds HDAC1/2 and the
          demethylase KDM1A (LSD1); HMG20B (BRAF35) and PHF21A (BHC80) complete
          the six-subunit BHC core. REST recruits the complex to RE1 elements of
          neuronal genes in non-neuronal cells. GO has no CoREST complex term; the
          node is typed by histone deacetylase complex and a new term is
          requested (proposed_new_terms).
        concepts:
          - preferred_term: histone deacetylase complex
            term:
              id: GO:0000118
              label: histone deacetylase complex
        evidence:
          - source_id: PMID:11171972
            statement: >-
              CoREST-HDAC is an HDAC1/2 complex distinct from SIN3 and NuRD, lacking
              RBBP4/7, with CoREST and a polyamine-oxidase homologue (KDM1A) as
              components.
