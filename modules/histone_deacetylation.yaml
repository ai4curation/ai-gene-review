    - order: 3
      role: NCoR/SMRT-HDAC3 corepressor complex
      node:
        id: ncor_smrt_hdac3_complex
        label: NCoR/SMRT-HDAC3 complex
        module_type: PROTEIN_COMPLEX
        description: >-
          NCOR1 (N-CoR) or NCOR2 (SMRT) binds HDAC3 through its deacetylase
          activation domain (DAD) and the WD40 proteins TBL1X/TBL1XR1 and GPS2
          through repression domain 1. Unliganded nuclear receptors and other
          repressors recruit the complex. HDAC3 is inactive alone and is switched
          on by the DAD together with inositol tetrakisphosphate. GO has no
          NCoR/SMRT complex term; the node is typed by histone deacetylase complex
          (each of NCOR1, TBL1X, TBL1XR1 and HDAC3 has an IDA row to it,
          PMID:18326024) and a new term is requested.
