                    the reaction of GO:0004402 (skos:exactMatch) and the broad match of each
                    residue-specific histone acetyltransferase term; Rhea has no residue-specific
                    histone lysine acetylation reaction. ChEBI participants and labels from the
                    Rhea entry and OLS (November 2026).
