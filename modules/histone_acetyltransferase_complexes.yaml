                  id: GO:0045815
                  label: transcription initiation-coupled chromatin remodeling
            locations:
              - preferred_term: chromatin
                term:
                  id: GO:0000785
                  label: chromatin
            role_description: >-
              Human SAGA acetylates histone H3, not H4, in free histones and nucleosomes, and
              does so more efficiently than recombinant GCN5. In cells GCN5/PCAF are required
              chiefly for H3K9 acetylation, and SAGA and ATAC together for H3K9 and H3K14
              acetylation. KAT2A and KAT2B carry the catalytic activity: the histone H3K9
              acetyltransferase rows on both (IDA, PMID:21131905) come from a study of GCN5/PCAF
              double-knockout mouse cells; KAT2A also carries histone H3 acetyltransferase
              (IDA, PMID:18838386, human SAGA and ATAC) and histone acetyltransferase rows (EXP
              and IDA), and KAT2B histone acetyltransferase rows (EXP, PMID:8945521, and others).
              SGF29 carries its own reader function (IDA, PMID:26421618). TADA2B and TADA3 have
              no experimental human molecular function beyond coactivator rows from assays of
              the whole STAGA complex, so they contribute to the complex activity only. GCN5 and
              PCAF also acetylate non-histone proteins and catalyse other acyl transfers
              (succinyl, glutaryl), which are outside this module.
            evidence:
              - source_id: PMID:11564863
                statement: Human STAGA contains homologues of most yeast SAGA components and is an acetyl-CoA-dependent coactivator on chromatin templates.
                supporting_text: STAGA has acetyl coenzyme A-dependent transcriptional coactivator functions from a chromatin-assembled template in vitro
              - source_id: PMID:9674425
                statement: PCAF (KAT2B) is purified in a SAGA-type complex of more than twenty polypeptides including TAFs.
                supporting_text: PCAF is found in a complex consisting of more than 20 distinct polypeptides
              - source_id: PMID:18838386
                statement: ADA2B is a STAGA-specific subunit; GCN5, PCAF, ADA3 and SGF29 (STAF36) are shared by STAGA and ATAC.
                supporting_text: In contrast, GCN5, PCAF, ADA3, and STAF36 were co-immunoprecipitated with both STAGA-specific and ATAC-specific components, indicating that they are part of both types of complexes.
              - source_id: PMID:18838386
                statement: Human STAGA and ATAC acetylate nucleosomal histone H3 specifically.
                supporting_text: STAGA and ATAC acetylate specifically nucleosomal histone H3 in vitro
              - source_id: PMID:19936620
                statement: SAGA and ATAC are both involved in H3K9 and H3K14 acetylation in mammalian cells.
                supporting_text: both ATAC and SAGA are involved in the acetylation of histone H3K9 and K14 residues
              - source_id: PMID:21131905
                statement: Loss of GCN5/PCAF (in mouse cells) specifically reduces H3K9 acetylation.
                supporting_text: deletion of GCN5/PCAF in cells specifically and dramatically reduces acetylation on histone H3K9 (H3K9ac)
              - source_id: PMID:20850016
                statement: Human SAGA binds H3K4me3 through the tandem Tudor domain of SGF29.
                supporting_text: the human SAGA complex binds to H3K4me3 via a double Tudor-domain in the C terminus of Sgf29
              - source_id: PMID:26421618
                statement: The SGF29 tandem Tudor domain binds H3K4me3 and H3K4me2 through an aromatic cage including Asp266.
                supporting_text: we report thermodynamic analyses for the recognition of histone H3K4me3 and H3K4me2 by the tandem tudor domain of Sgf29
            gocam_associations:
