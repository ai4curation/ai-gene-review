          The acetyltransferase module of human SAGA (also called STAGA, TFTC or the PCAF
          complex): GCN5 (KAT2A) or PCAF (KAT2B) with the SAGA-specific adaptor ADA2B (TADA2B),
          ADA3 (TADA3) and the H3K4me3-reading tandem Tudor protein SGF29. Only the HAT module
          is modelled; the deubiquitinase module, the TAF/SPT structural core and TRRAP are
