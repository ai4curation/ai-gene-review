id: MODULE:histone_acetyltransferase_complexes
title: Human histone acetyltransferase complexes outside TIP60 — the GCN5/PCAF (KAT2A/KAT2B) HAT modules of SAGA and ATAC, the MYST acetyltransferases KAT6A/KAT6B (MOZ/MORF-BRPF-ING5-MEAF6), KAT7 (HBO1 with JADE or BRPF scaffolds) and KAT8 (MOF in the NSL and MSL complexes), and the stand-alone CBP/p300 acetyltransferases (CREBBP, EP300)
description: >-
  Histone acetyltransferases (HATs) transfer the acetyl group of acetyl-CoA to the epsilon-amino
  group of lysine residues in histone tails, neutralising their charge and creating binding sites
  for bromodomain and YEATS readers; acetylation of promoters and enhancers accompanies and
  promotes transcription. Apart from the TIP60-p400 complex, the human nuclear HATs fall into
  three groups. The GNAT-family paralogues GCN5 (KAT2A) and PCAF (KAT2B) are the catalytic
  subunits of two coactivator complexes, SAGA and ATAC, which share the ADA3 and SGF29 subunits
  but use different ADA2 paralogues (ADA2B in SAGA, ADA2A in ATAC); both acetylate nucleosomal
  histone H3, chiefly at K9 and K14. The MYST-family enzymes work in tetrameric assemblies on
  EPc-domain scaffolds with an ING reader and MEAF6: MOZ (KAT6A) and MORF (KAT6B) with a BRPF
  scaffold acetylate histone H3 (K14 and K23); HBO1 (KAT7) acetylates histone H4 at K5, K8 and
  K12 when bound to a JADE scaffold, but H3K14 when bound to a BRPF scaffold, so the scaffold,
  not the enzyme, chooses the histone tail; MOF (KAT8) acetylates H4K5 and H4K8 in the
  nine-subunit NSL complex at housekeeping promoters and deposits most H4K16 acetylation in the
  MSL complex. The paralogous coactivators CBP (CREBBP) and p300 (EP300) are themselves HATs
  recruited by many transcription factors without a dedicated stable complex, and are
  responsible for most H3K18 and H3K27 acetylation. Reader subunits (SGF29 for H3K4me3, ING4
  and ING5 for H3K4me3, BRPF PHD fingers for unmodified H3, YEATS2 for acylated H3K27, ZZZ3 for
  the H3 N-terminus, MSL3 for H4K20me1) target the enzymes to chromatin.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates twelve of this module's genes directly to the pathway: the catalytic subunits
      KAT2A, KAT2B, KAT6A, KAT6B, KAT7, KAT8, CREBBP and EP300, and the subunits SGF29, BRD1
      (BRPF2), WDR5 and HCFC1 (the last two are also COMPASS subunits). KAT5 is reached through
      the referenced tip60_p400_complex module. RGD's text describes nuclear (type A) HATs in
      the GNAT, MYST and CBP/p300 subclasses, which are the three groups modelled. This module
      realises item 3 of the histone modification split plan in
      projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD divides histone acetyltransferases into nuclear type A enzymes of the GNAT, MYST and CBP/p300 subclasses and cytoplasmic type B enzymes.
    supporting_text: 'fall into two classes: type-A which are nuclear and are further classified into three subclasses - GNAT,'
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD's second subclass sentence names MYST and CBP/p300 and the cytoplasmic type B enzymes that modify free histones.
    supporting_text: MYST and CPB/p300, and type-B that are cytoplasmic and modify free histones.
  - source_id: GO:0045815
    title: transcription initiation-coupled chromatin remodeling
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted histone acetylation and every
      residue-specific histone acetylation process because each represents a molecular
      function. The module's process concept is therefore GO:0045815, which human GOA uses for
      EP300, KAT7, KAT8, SGF29 and WDR5 (experimental rows) and which the sibling module
      compass_family_h3k4_methylation also uses. It fits the coactivator complexes (SAGA, ATAC,
      MOZ/MORF, NSL, CBP/p300) and is not asserted on the HBO1 and MSL annotons, whose roles
      (replication licensing, bulk H4K16 acetylation) are not transcription-initiation
      specific. The acetylation itself is carried by GO:0004402 histone acetyltransferase
      activity and its residue-specific children on the catalytic annotons.
  - source_id: GO:0000123
    title: histone acetyltransferase complex
    statement: >-
      The GO complex term that groups SAGA (GO:0000124 under SAGA-type complex), ATAC
      (GO:0140672), MOZ/MORF (GO:0070776), the H3K14 acetyltransferase complex (GO:0036409),
      NSL (GO:0044545) and MSL (GO:0072487); it is the module's complex concept.
  - source_id: PMID:18838386
    title: Human ATAC Is a GCN5/PCAF-containing acetylase complex with a novel NC2-like histone fold module that interacts with the TATA-binding protein.
    statement: Purification of human ATAC and STAGA defines the shared and complex-specific subunits of the two GCN5/PCAF complexes.
    supporting_text: We now report the purification and characterization of vertebrate (human) ATAC-type complexes and identify novel components of STAGA.
  - source_id: PMID:16387653
    title: ING tumor suppressor proteins are critical regulators of chromatin acetylation required for genome expression and perpetuation.
    statement: Purification of the human ING4 and ING5 complexes defines the HBO1 and MOZ/MORF acetyltransferase complexes.
    supporting_text: Our data also indicate that ING subunits are crucial for acetylation of chromatin substrates.
  - source_id: PMID:24065767
    title: Exchange of associated factors directs a switch in HBO1 acetyltransferase histone tail specificity.
    statement: The scaffold subunit of MYST complexes, not the catalytic subunit, selects the histone tail.
    supporting_text: These results uncover a crucial new role for associated proteins within HAT complexes, previously thought to be intrinsic to the catalytic subunit.
  - source_id: PMID:20018852
    title: Subunit composition and substrate specificity of a MOF-containing histone acetyltransferase distinct from the male-specific lethal (MSL) complex.
    statement: Assembly of MOF (KAT8) into the MSL or NSL complex controls its substrate specificity.
    supporting_text: In addition, we show that assembly of the MOF HAT into MSL or NSL complexes controls its substrate specificity.
  - source_id: PMID:8945521
    title: The transcriptional coactivators p300 and CBP are histone acetyltransferases.
    statement: CBP and p300 are histone acetyltransferases as well as transcriptional adaptors.
    supporting_text: p300/CBP represents a novel class of acetyltransferases in that it does not have the conserved motif found among various other acetyltransferases.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001338 (histone modification pathway) through
  the RGD_PATHWAY_ONTOLOGY project, as item 3 of the histone modification split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 173 RGD-curated human
  genes, tier no_specific_go_term). PW:0001338 has no PW children with genes and no GO process
  mapping, so it is the only PW evidence source; its sub-pathway PW:0001339 (chromatin
  remodeling) is the source of the referenced TIP60-p400 module and is named here only. Sibling
  modules of the split (not modelled here): polycomb_repressive_complexes,
  compass_family_h3k4_methylation, histone_deacetylation, histone_lysine_demethylation and
  histone_arginine_methylation. The structure follows modules/dmel_gcn5_acetyltransferase_complexes.yaml
  for SAGA and ATAC (structure only; no Drosophila evidence is used). UniProt accessions and
  recommended names are from UniProt REST, and molecular functions from each protein's
  experimental human GOA rows in QuickGO (November 2026). Gene reviews exist only for CREBBP,
  EP300, BRPF1 and HCFC1; their core functions agree with the module (BRPF1 acetyltransferase
  activator activity; CREBBP and EP300 protein-lysine-acetyltransferase activity, the parent of
  the histone H3K27 term used here, which the validator reports as annotation-supported but not
  core).

  Participants. RGD genes modelled (12): KAT2A, KAT2B, KAT6A, KAT6B, KAT7, KAT8, CREBBP, EP300,
  SGF29, BRD1, WDR5 and HCFC1; KAT5 is in the referenced TIP60-p400 module. Participants added
  from outside the RGD list, each with cited human complex-purification evidence (25): TADA2B
  and TADA3 (SAGA; PMID:18838386, PMID:11564863); TADA2A, YEATS2, DR1, ZZZ3, KAT14, MBIP (ATAC;
  PMID:18838386, PMID:30217978); BRPF1, BRPF3, ING5, MEAF6 (MOZ/MORF; PMID:18794358,
  PMID:16387653); JADE1, JADE2, JADE3, ING4 (HBO1; PMID:16387653, PMID:24065767); KANSL1,
  KANSL2, KANSL3, MCRS1, PHF20, OGT (NSL; PMID:20018852); MSL1, MSL2, MSL3 (MSL;
  PMID:16227571). Each of these also carries an experimental human GOA cellular-component row
  for its complex. RGD genes considered and left out: USP22 (SAGA deubiquitinase; see below);
  KAT5 (modelled in tip60_p400_complex); HAT1, the cytoplasmic type B acetyltransferase that
  acetylates newly made histone H4 before deposition, which RGD's own text sets apart from the
  nuclear type A enzymes and which belongs with histone supply and deposition rather than
  with the chromatin-bound complexes here (a candidate for a later module or an optional part
  if the coordinator prefers); TAF1, whose histone acetyltransferase row (PMID:8980232)
  belongs to TFIID and which is modelled in rna_polymerase_ii_core_and_initiation; BRD4 and
  other bromodomain proteins, which are readers outside these complexes; ING2 (Sin3 HDAC
  complex, histone_deacetylation); NCOA6 (COMPASS). Other proteins reported to acetylate
  histones (NCOA1, NCOA3, CLOCK, ATF2, ELP3) are not in the RGD list and are not added.

  Boundary decisions. (1) SAGA is modelled as its HAT module only. The deubiquitinase module
  (USP22, ATXN7L3, ENY2, ATXN7) removes ubiquitin from histone H2B, a different reaction with
  its own experimental functions (USP22 histone H2B deubiquitinase activity), and the
  TAF/SPT structural core (TAF5L, TAF6L, TAF9, TAF10, TAF12, SUPT3H, SUPT7L, SUPT20H, TADA1),
  the activator-binding TRRAP and the SF3B3/SF3B5 splicing subunits do no work in the
  acetylation step: GCN5 with ADA2B, ADA3 and SGF29 is the acetyltransferase. The DUB module
  and the core are therefore named here and not modelled; a SAGA-wide module (or an H2B
  deubiquitination module) would be the place for them, and USP22 is the one RGD gene this
  leaves unplaced. TRRAP is modelled as a unit of tip60_p400_complex, where its role is the
  same activator platform. (2) Each complex is one part, with a complex annoton carrying the
  acetyltransferase activity and its subunits as active units. Catalytic units take their
  experimental residue-specific terms where GOA has them (H3K9 for KAT2A and KAT2B, H3K14 for
  KAT6A and KAT6B, H4 or H3K14 for KAT7 according to the scaffold, H4 and H4K16 for KAT8,
  H3K27 for CREBBP and EP300); a complex annoton takes the term that covers the complex's
  known residues (histone H3 for SAGA, ATAC and MOZ/MORF; histone H4 for HBO1-JADE and NSL).
  (3) Scaffold, adaptor and reader units get no catalytic function, including those that carry
  contributes_to histone acetyltransferase rows from assays of the purified complex (TADA2A,
  BRPF1, BRD1, BRPF3, JADE1, JADE3, ING4, MEAF6). Readers carry their experimental reader
  function; BRPF1 its activator function; MSL1 its adaptor function; DR1 its TBP-binding
  function. (4) KAT14 (ATAC2) is given no catalytic function although GOA has an IDA histone
  acetyltransferase row (PMID:19103755): the recombinant protein's activity is weak and
  H4-directed, while purified human ATAC acetylates H3 and not H4 (PMID:18838386), so the
  activity is treated as real in vitro activity of unknown relevance. (5) MSL2's histone H2B
  ubiquitin ligase activity is recorded on its unit because it is an experimental activity of
  the complex, but it is not the acetylation step. OGT's O-GlcNAc transferase activity is not
  recorded on the NSL unit because no study links it to the acetylation step. (6) Paralogues
  that occupy one position in alternative assemblies (KAT2A/KAT2B, KAT6A/KAT6B,
  BRPF1/BRD1/BRPF3, JADE1/2/3, ING4/ING5) are listed together in one descriptor with roles
  stating the alternatives, as in the Mediator module; JADE and ING paralogues in the HBO1
  complexes are family descriptors because their units carry the same (or no) function. (7)
  The HBO1 complexes are one part with two annotons, because the same catalytic subunit
  acetylates H4 with a JADE scaffold and H3K14 with a BRPF scaffold (PMID:24065767); the BRPF,
  ING and MEAF6 units are written identically in the MOZ/MORF and HBO1-BRPF annotons. (8)
  CBP/p300 are a MOLECULAR_FUNCTION node with one annoton per paralogue rather than a complex,
  because they act without a dedicated stable complex; their coactivator role is recorded in
  hif_oxygen_sensing and p53_signaling. (9) TIP60-p400 is included by module_ref and not
  remodelled. (10) Histones are substrates, not participants: the reaction is written once per
  catalytic annoton from RHEA:21992 (L-lysyl-[histone] + acetyl-CoA = N(6)-acetyl-L-lysyl-[histone]
  + CoA + H(+)), the exact match of GO:0004402 and the broad match of every residue-specific
  child; Rhea has no residue-specific histone lysine acetylation reaction. Non-histone
  substrates and non-acetyl acyl transfers (succinyl, glutaryl, crotonyl, lactyl, propionyl)
  by the same enzymes are outside the module. (11) Associated proteins not modelled: MAP3K7
  (TAK1) and the POLE3-POLE4 histone-fold dimer in ATAC (PMID:18838386), UBAP2L, reported in
  ATAC preparations, ORC1 and the MCM helicase, partners of HBO1 complexes in replication
  licensing, and PHF20L1, a paralogue of PHF20 not established as an NSL subunit in human
  purifications. (12) The species basis of some GOA rows: the residue-specific H3K9 (KAT2A,
  KAT2B) and H3K18/H3K27 (CREBBP, EP300) rows from PMID:21131905 and the BRD1 H3K14 complex row
  from PMID:21753189 rest on mouse cells; human evidence supports the same activities more
  generally (PMID:18838386, PMID:8945521, PMID:32691935 for EP300 H3K27).

  Possible upstream GOA issues (queries, not confirmed). MSL3 has an IDA row for histone
  H4K16ac reader activity from PMID:20657587, whose abstract reports DNA-dependent binding of
  the MSL3 chromodomain to H4K20me1 that H4K16 acetylation antagonises; the intended term is
  probably histone H4K20me1 reader activity (GO:0140117). SGF29 has an IDA row for histone
  H3K36me3 reader activity from PMID:20850016, whose abstract assigns H3K4me3 binding to the
  SGF29 tandem Tudor domain and H3K36me3 binding to PWWP domains. JADE2 carries enables rows
  for histone H4K5, H4K8 and H4K12 acetyltransferase activities from PMID:16387653, where the
  other scaffold and reader subunits from the same paper carry contributes_to; the qualifier is
  probably a slip. Both cached abstracts are abstract-only, so these are CHECK queries.

  GO-CAM links. gomodel:65c57c3400000173 (the MSL complex mediates H4K16 acetylation, Human)
  contains all four MSL subunits; KAT8, MSL1, MSL2 and MSL3 are pinned to the MSL annoton. Its
  MSL2 activity is typed chromatin-protein adaptor activity, whereas MSL2's experimental GOA
  function is histone H2B ubiquitin ligase activity; the module keeps the GOA function and
  records the difference here. gomodel:69c59f8a00000219 (CDKN1A induction via PCAF-SAGA, the
  seed's best_gocam) types KAT2B as protein-lysine-acetyltransferase activity in a SAGA context
  and EP300 as histone acetyltransferase activity; these are pinned to the SAGA HAT and EP300
  annotons. Its USP22 deubiquitinase activity belongs to the unmodelled DUB module and is not
  pinned. The histone acetyltransferase activities of EP300 in gomodel:69d8496c00000318,
  gomodel:653b0ce600000202 and gomodel:682fbcd000000000, and of CREBBP in
  gomodel:62b4ffe300005283, are pinned to their annotons. KAT8 H4K16 acetyltransferase activity
  in gomodel:65bc474400000788 (nuclear import of KAT8) is not complex-specific and is not
  pinned. The many models in which CREBBP, EP300, KAT2A, KAT2B, KAT8 or OGT acetylate or
  glycosylate non-histone proteins are outside the module. No production model contains a
  SAGA, ATAC, MOZ/MORF, HBO1 or NSL subunit other than these catalytic units. PANTHER family
  ids and PTNs are deliberately not asserted.
module:
  id: histone_acetyltransferase_complexes
  label: Human histone acetyltransferase complexes (non-TIP60)
  module_type: PROTEIN_COMPLEX
  description: >-
    GCN5/PCAF HAT modules of SAGA and ATAC, the MYST complexes of KAT6A/KAT6B, KAT7 and KAT8
    (MOZ/MORF, HBO1-JADE, HBO1-BRPF, NSL and MSL), the stand-alone CBP/p300 acetyltransferases,
    and the TIP60-p400 complex by reference.
  concepts:
    - preferred_term: histone acetyltransferase complex
      term:
        id: GO:0000123
        label: histone acetyltransferase complex
    - preferred_term: transcription initiation-coupled chromatin remodeling
      term:
        id: GO:0045815
        label: transcription initiation-coupled chromatin remodeling
