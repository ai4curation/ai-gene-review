            role_description: >-
              Purified human ATAC acetylates histone H3 (H3K14 in vitro; H3K9 and H3K14 in cells
              together with SAGA) and does not acetylate histone H4. The catalytic subunit is
              GCN5 or PCAF. KAT14 (ATAC2) has a GNAT domain and a GOA histone acetyltransferase
              row (IDA, PMID:19103755) for weak H4-directed activity of the recombinant protein,
              but the purified human complex does not acetylate H4 (PMID:18838386) and KAT14
              depletion disassembles the complex, so in this module KAT14 is a structural unit
              without a catalytic function; the weak activity is treated as in vitro activity of
              unknown relevance. Reader and adaptor units carry their experimental human GOA
              functions: YEATS2 histone reader activity (IDA, PMID:27103431; the paper shows
              selective reading of crotonylated H3K27), ZZZ3 histone binding (IDA, PMID:30217978;
              the ZZ domain reads the H3 N-terminus), DR1 TBP-class protein binding (IDA,
              PMID:18838386) and SGF29 H3K4me3 reader activity. TADA2A carries a contributes_to
              histone acetyltransferase row (PMID:9674425) and no function of its own; TADA3,
              MBIP and WDR5 have no experimental molecular function relevant to ATAC (MBIP's
              protein kinase inhibitor rows concern MAP3K12; WDR5's reader rows are from COMPASS
              studies). ATAC also stably carries the kinase MAP3K7 (TAK1) and the POLE3-POLE4
              histone-fold dimer; these are named in the notes and not modelled.
            evidence:
              - source_id: PMID:18838386
                statement: Human ATAC contains GCN5 or PCAF with ADA2A, ADA3, SGF29 (STAF36) and WDR5, MBIP, and a YEATS2-NC2-beta module that binds TBP.
                supporting_text: We show that human ATAC complexes incorporate in addition to GCN5 or PCAF (GCN5/PCAF), other epigenetic coregulators (ADA2-A, ADA3, STAF36, and WDR5)
              - source_id: PMID:18838386
                statement: The YEATS2-NC2-beta histone fold module binds TBP and represses transcription.
                supporting_text: a novel YEATS2-NC2beta histone fold module that interacts with the TATA-binding protein (TBP) and negatively regulates transcription when recruited to a promoter
              - source_id: PMID:18838386
                statement: Purified human ATAC does not acetylate histone H4 although KAT14 (CSRP2BP) has a GNAT domain.
                supporting_text: Thus, human ATAC under these conditions does not acetylate histone H4, despite the fact that one of the subunits (CSRP2BP) has a GNAT domain
              - source_id: PMID:19936620
                statement: Mammalian ATAC contains GCN5 or PCAF in a mutually exclusive manner and acetylates H3K14 in vitro.
                supporting_text: In vitro ATAC complexes acetylate lysine 14 of histone H3.
              - source_id: PMID:19103755
                statement: Recombinant ATAC2 (KAT14) has weak H4-directed activity and is needed for complex integrity.
                supporting_text: Recombinant ATAC2 has a weak HAT activity directed to histone H4.
              - source_id: PMID:19103755
                statement: Depletion of ATAC2 disassembles the complex.
                supporting_text: depletion of ATAC2 results in the disassembly of the complex
              - source_id: PMID:30217978
                statement: The ZZ domain of ZZZ3 reads histone H3 and is required for ATAC-dependent promoter H3K9 acetylation.
                supporting_text: Depletion of ZZZ3 or disruption of the ZZ-H3 interaction dampens ATAC-dependent promoter histone H3K9 acetylation and target gene expression.
              - source_id: PMID:27103431
                statement: The YEATS domain of YEATS2 is a selective reader of crotonylated H3K27.
                supporting_text: Collectively, these results demonstrate that the YEATS domain of YEATS2 is a selective reader for H3K27cr.
