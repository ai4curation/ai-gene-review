              statement: Loss of laat-1 makes lysosomes defective in degradation.
              supporting_text: Loss of laat-1 caused accumulation of lysine and arginine in
                enlarged, degradation-defective lysosomes.
            - source_id: PMID:22822152
              title: LAAT-1 is the lysosomal lysine/arginine transporter that maintains amino
                acid homeostasis.
              statement: Engulfment is normal in laat-1 mutants, so the defect is in digestion.
              supporting_text: Cell death and cell corpse engulfment were normal in qx42 mutants
            - source_id: PMID:23169667
