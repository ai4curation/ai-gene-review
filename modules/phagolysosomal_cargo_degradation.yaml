id: MODULE:phagolysosomal_cargo_degradation
title: Phagolysosomal cargo degradation
description: Once a phagosome has matured into a phagolysosome, acid hydrolases digest the
  engulfed particle and transporters in the phagolysosomal membrane return the products to
  the cytosol. DNase II finishes digesting the DNA of engulfed cells; cathepsins digest proteins;
  in amoebae that eat bacteria, lysozymes break down the bacterial cell wall. Amino acids,
  nucleosides, heme and cholesterol are then exported by dedicated transporters. Digestion
  is how phagotrophic protists feed and how animal phagocytes dispose of dead cells and microbes.
  Loss of a hydrolase or an exporter leaves undigested cargo, and undigested DNA in particular
  can trigger innate immune signalling.
status: DRAFT
scope: ABSTRACT
