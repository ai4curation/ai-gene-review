                step of DNA degradation during apoptosis.
              statement: In C. elegans, nuc-1 completes degradation of apoptotic-cell DNA,
                and completion needs engulfment.
              supporting_text: Completion of DNA degradation did not occur in the absence
                of cell-corpse engulfment.
            - source_id: PMID:12524536
              title: Impaired thymic development in mouse embryos deficient in apoptotic DNA
                degradation.
              statement: In mouse, macrophage DNase II digests the DNA of phagocytosed apoptotic
                cells.
              supporting_text: But, when apoptotic cells were phagocytosed by macrophages,
                their DNA was degraded by DNase II.
            - source_id: PMID:11375492
              title: Requirement of DNase II for definitive erythropoiesis in the mouse fetal
                liver.
              statement: DNase II acts non-cell-autonomously, in the macrophages that engulf
                expelled erythroid nuclei.
              supporting_text: suggesting that DNase II functions in a non-cell-autonomous
                manner
            - source_id: PMID:12381665
              title: Activation of the innate immunity in Drosophila by endogenous chromosomal
                DNA that escaped apoptotic degradation.
              statement: A Drosophila DNase II loss-of-function mutant accumulates undigested
                DNA.
              supporting_text: We also identified a loss-of-function mutant in Drosophila
                for DNase II-like acid DNase.
