                underlying the action of cysteamine in cystinosis therapy.
              statement: Human PQLC2 is a lysosomal exporter of cationic amino acids.
              supporting_text: We also show that PQLC2, a mammalian PQ-loop protein closely
                related to yeast Ypq proteins, localizes to lysosomes and catalyzes a robust,
                electrogenic transport that is selective for CAAs and strongly activated at
                low extracytosolic pH.
            notes: PQLC2 is included by orthology; it has no phagocytic-cargo data.
