notes: 'Boundary: starts with a degradative phagolysosome (the output of MODULE:phagosome_maturation)
  and ends with digestion products in the cytosol. Phagosome maturation, acidification and
  lysosome reformation are excluded. Signalling programmes triggered by digestion products
  are separate modules (MODULE:efferocytosis_induced_macrophage_proliferation, MODULE:efferocytosis_induced_anti_inflammatory_programme,
  MODULE:heme_induced_iron_recycling_macrophage_differentiation). The tryptophan exporter
  SLC36A4 is modelled in the anti-inflammatory module.


  Most of these hydrolases and transporters are general lysosomal machinery. They are included
  where there is loss-of-function evidence that engulfed cargo is not digested or its products
  accumulate. LIPA is left out because its efferocytosis evidence is pharmacological and its
  macrophage knockout is masked by cross-correction from other cells.


  Taxon scope: digestion of phagocytosed material is eukaryote-wide. DNase II activity is
  inferred at a eukaryote-level PAINT node. The evidence here comes from mouse, zebrafish,
  C. elegans, Drosophila and Dictyostelium.'
