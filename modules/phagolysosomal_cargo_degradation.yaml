knowledge_gaps:
- gap_statement: Which hydrolases digest the protein of engulfed cell corpses in C. elegans
    is unknown.
  boundary: Corpse degradation needs lysosome function (nuc-1, laat-1), but no single cathepsin
    has been shown to be required for corpse digestion in the worm.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: The protein-digestion part has no nematode exemplar.
  resolution: Test cathepsin (cpr, cpl, asp) mutants and combinations for persistent corpses
    in engulfing cells.
  provenance:
  - reference_id: PMID:22822152
    supporting_text: Cell death and cell corpse engulfment were normal in qx42 mutants
