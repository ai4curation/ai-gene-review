            - source_id: PMID:9108473
              statement: Caspase-3 cleaves the DFF45 inhibitor and releases a DNA-fragmenting factor.
        - id: casp7_proteolysis
          label: CASP7 substrate-selective proteolysis
          module_type: REGULATORY_STEP
          description: CASP7 cleaves selected apoptotic substrates including PARP1 and p23. Its overlapping
            substrate repertoire with CASP3 is not identical; contributions depend on cell and genetic context.
          annotons:
          - id: casp7_executioner
            label: CASP7 executioner caspase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: caspase-7 subfamily
                term:
                  id: PANTHER:PTHR10454:SF31
                  label: CASPASE-7
                representative_members:
                - preferred_term: CASP7 (human)
                  term:
                    id: UniProtKB:P55210
                    label: CASP7
                - preferred_term: Casp7 (mouse)
                  term:
                    id: UniProtKB:P97864
                    label: Casp7
                description: Verified human/mouse UniProt classification and official PANTHER subfamily label;
                  biochemical assertions are restricted to the assayed representatives and contexts.
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
            processes:
            - preferred_term: execution phase of apoptosis
              term:
                id: GO:0097194
                label: execution phase of apoptosis
            locations:
