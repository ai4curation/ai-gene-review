  description: Human and mouse exemplars ground a mammalian template. Part numbering is organizational,
    not temporal. A required CASP3/CASP7 variant set encodes at least one principal executioner
    contribution; neither protease is individually obligatory. CASP6, regulators and nuclear branches
    are optional additions, and their optional flags do not assert dispensability within every assay.
    AIF-associated caspase-independent death alone is outside this caspase-mediated implementation. ICAD-dependent folding and disinhibition are internal requirements of the represented
    CAD route, while CAD-mediated DNA fragmentation is not required for all apoptotic death. Upstream
    caspase activation and AIF release mechanisms are boundary inputs.
