        from CASP3 or CASP7. The alternatives delimit the modeled caspase-mediated execution route;
        they do not assert equivalent substrate repertoires or that either protease alone suffices
        for every apoptotic phenotype. CASP6 and nuclear remodeling remain contextual branches.
      variant_sets:
      - id: principal_executioner_choice
        label: One or both principal executioner contributions
        axis: executioner caspase
        selection: ONE_OR_MORE
        variants:
        - id: casp3_proteolysis
          label: CASP3 executioner proteolysis
          module_type: REGULATORY_STEP
          description: Activated CASP3 cleaves a broad but defined substrate repertoire, including ICAD. It
            is not interchangeable with CASP7 on all protein substrates and is not the only possible execution
            route.
          annotons:
          - id: casp3_executioner
            label: CASP3 principal executioner caspase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: caspase-3 subfamily
                term:
                  id: PANTHER:PTHR10454:SF198
                  label: CASPASE-3
                representative_members:
                - preferred_term: CASP3 (human)
                  term:
                    id: UniProtKB:P42574
                    label: CASP3
                - preferred_term: Casp3 (mouse)
                  term:
                    id: UniProtKB:P70677
                    label: Casp3
                description: Verified human/mouse UniProt classification and official PANTHER subfamily label;
                  biochemical assertions are restricted to the assayed representatives and contexts.
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
            processes:
            - preferred_term: execution phase of apoptosis
              term:
                id: GO:0097194
                label: execution phase of apoptosis
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            role_description: Activated CASP3 cleaves a broad but defined substrate repertoire, including
              ICAD. It is not interchangeable with CASP7 on all protein substrates and is not the only possible
              execution route.
            gocam_associations:
            - model: gomodel:62b4ffe300001804
              activity: gomodel:62b4ffe300001804/62b4ffe300001805
              title: Cleavage and inactivation of PARP1 by CASP3 and/or CASP7 during the execution phase of
