id: MODULE:apoptotic_execution_phase
title: Apoptotic execution phase module
description: >-
  Mammalian apoptotic execution begins when initiator caspases activate
  executioner caspases-3, -6, and -7. The active cysteine endopeptidases cleave
  nuclear, DNA-repair, cytoskeletal, membrane-trafficking, and signaling
  substrates; remove IAP restraint; activate DFF/CAD DNA fragmentation through
  DFFA/ICAD cleavage; and enable downstream nuclear condensation and apoptotic
  surface changes. The module starts after receptor or apoptosome signaling and
  keeps execution-caspase substrates separate from the upstream MOMP and DISC
  decisions.
status: DRAFT
evidence:
  - source_id: file:projects/APOPTOSIS.md
    title: Apoptosis project page
    statement: >-
      The APOPTOSIS project identified CASP3, CASP6, CASP7, XIAP, DIABLO, DFFA,
      DFFB, AIFM1, ACIN1, and ENDOG as downstream execution/IAP/dismantling
      genes to separate from intrinsic- and death-receptor-initiation modules.
  - source_id: GO:0097194
    title: execution phase of apoptosis
    statement: >-
      The module is grounded in the GO biological-process term for apoptotic
      execution.
  - source_id: GO:0006309
    title: apoptotic DNA fragmentation
    statement: >-
      DFFA and DFFB connect execution-caspase proteolysis to the apoptotic
      oligonucleosomal DNA-fragmentation branch.
  - source_id: GO:0030263
    title: apoptotic chromosome condensation
    statement: >-
      DFFB and ACIN1 connect caspase activation to nuclear condensation during
      apoptotic execution.
  - source_id: gomodel:62b4ffe300000784
    title: >-
      Involvement of CASP7 in apoptosis, its activation by initiator caspases
      (CASP8, CASP9 and CASP10) and regulation by XIAP and PAK2 (Human)
    statement: >-
      A cached human GO-CAM grounds activation of CASP7 by initiator caspases
      and inhibition by XIAP.
  - source_id: gomodel:62b4ffe300001804
    title: >-
      Cleavage and inactivation of PARP1 by CASP3 and/or CASP7 during the
      execution phase of apoptosis (Human)
    statement: >-
      A cached human GO-CAM grounds CASP3/CASP7 cleavage of PARP1 during
      apoptotic execution.
  - source_id: file:genes/human/CASP6/CASP6-ai-review.yaml
    title: Human CASP6 AI gene review
    statement: >-
      The reviewed CASP6 core function captures intrinsic and execution-phase
      caspase substrate cleavage, including RIPK1 cleavage and nuclear substrate
      cleavage.
  - source_id: file:genes/human/DFFA/DFFA-ai-review.yaml
    title: Human DFFA AI gene review
    statement: >-
      The reviewed DFFA core functions capture inhibition and client-specific
      folding of the CAD/DFFB nuclease before caspase cleavage licenses
      apoptotic DNA fragmentation.
  - source_id: file:genes/human/ACIN1/ACIN1-ai-review.yaml
    title: Human ACIN1 AI gene review
    statement: >-
      The reviewed ACIN1 apoptosis function captures caspase-activated RNA
      binding and promotion of apoptotic chromatin condensation.
knowledge_gaps:
  - gap_statement: >-
      Execution-caspase substrate classes are represented by exemplar branches
      rather than by a full substrate inventory.
    boundary: >-
      The module captures PARP1-like repair-protein cleavage through cached
      CASP3/CASP7 GO-CAMs, DFFA/DFFB-dependent DNA fragmentation, and
      ACIN1-dependent chromatin condensation, but it does not yet model lamins,
      PAK2, gelsolin, XKR scramblases, flippases, or hundreds of other
      execution-caspase substrates.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Without this scoping, the module could make any caspase substrate look
      equivalent to the small set of substrates that drive canonical execution
      morphology.
    resolution: >-
      Add substrate-specific branches only after the relevant substrate gene
      review supports a direct execution-phase role.
  - gap_statement: >-
      ENDOG is not modeled as a core human apoptotic execution leaf.
    boundary: >-
      The human ENDOG review centers ENDOG on mitochondrial DNA/RNA nuclease
      activity, nuclear recombination, and starvation-linked autophagy
      regulation. It treats apoptotic DNA-fragmentation evidence as non-core
      rather than as a direct human execution assertion.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      EndoG-like biology is a key cross-opisthokont comparator, but generic
      nuclease activity and stress-associated release are not by themselves
      enough to place ENDOG beside CAD/DFFB in the canonical mammalian
      execution module.
    resolution: >-
      Keep ENDOG in the conserved-comparator notes until a follow-up review
      justifies a concrete human apoptotic-execution role or a lineage-specific
      variant.
  - gap_statement: >-
      Apoptotic phosphatidylserine exposure has CASP3 GO-CAM anchors but no
      reviewed XKR or ATP11C module leaves yet.
    boundary: >-
      Cached human XKR4, XKR8, and XKR9 GO-CAMs model CASP3-dependent
      phosphatidylserine exposure on the apoptotic cell surface, but those XKR
      scramblases and flippase regulators have not yet been reviewed for this
      APOPTOSIS slice.
    gap_kind:
      - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Surface exposure is a major execution output leading to apoptotic-cell
      clearance and should remain distinct from DNA fragmentation and chromatin
      condensation.
    resolution: >-
      Add an apoptotic surface-remodeling branch after reviewing XKR/ATP11C
      substrates and TIMD4-mediated clearance context.
notes: >-
  Created during the APOPTOSIS module pass to separate downstream cell
  dismantling from upstream receptor/DISC, BCL2/MOMP, and apoptosome-initiation
  decisions. CASP3 and CASP7 have cached GO-CAM activity anchors for PARP1
  cleavage; CASP7 and XIAP are also grounded in the cached CASP7-activation
  model. CASP6, DFFA, DFFB, AIFM1, and ACIN1 are grounded in the completed
  human gene reviews.
