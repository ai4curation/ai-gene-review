id: MODULE:apoptotic_execution_phase
title: 'Mammalian apoptotic execution: proteolysis, ICAD/CAD and contextual nuclear branches'
description: Mammalian executioner caspases cleave distinct sets of cellular substrates. CASP3 cleavage
  of ICAD relieves inhibition of the CAD nuclease after ICAD-supported folding, enabling chromatin DNA
  fragmentation; mouse CASP7 provides a supported alternative ICAD-cleaving activity. XIAP and mitochondrial
  SMAC regulate execution in a cell-dependent manner. CASP6 proteolysis, Acinus-associated nuclear remodeling
  and AIF chromatin engagement are separately qualified branches, not an obligatory sequence shared by
  every dying cell. The template starts downstream of initiation and excludes a complete substrate inventory
  and phagocyte-mediated disposal.
status: DRAFT
evidence:
- source_id: PMID:23457257
  statement: Comparative network evolution constrains transfer across metazoan lineages.
- source_id: PMID:38824481
  statement: Mouse genetics contextualizes executioner-caspase requirements.
- source_id: PMID:24890510
  statement: Review links ICAD-dependent folding and nuclease release to nuclear DNA degradation.
- source_id: PMID:18309324
  statement: Non-apoptotic functions prevent interpreting every knockout phenotype as execution evidence.
- source_id: PMID:18414036
  statement: Direct anti-caspase activity of mammalian XIAP is not a family-wide property of IAP proteins.
knowledge_gaps:
- gap_statement: Execution-caspase substrate classes are represented by exemplar branches rather than
    by a full substrate inventory.
  boundary: This template models distinct caspase activities and their ICAD/Acinus regulatory targets;
    PARP1 GO-CAM associations and lamin substrates are mechanistic context. It does not attempt a full
    reviewed substrate panel.
  gap_kind:
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Without this scoping, the module could make any caspase substrate look equivalent to the
    small set of substrates that drive canonical execution morphology.
  resolution: Add substrate-specific family leaves only after target gene review and direct participation
    evidence; current substrate mentions do not create gene annotations.
- gap_statement: ENDOG is not modeled as a core human apoptotic execution leaf.
  boundary: The human ENDOG review centers ENDOG on mitochondrial DNA/RNA nuclease activity, nuclear recombination,
    and starvation-linked autophagy regulation. It treats apoptotic DNA-fragmentation evidence as non-core
    rather than as a direct human execution assertion.
  gap_kind:
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: EndoG-like biology is a key cross-opisthokont comparator, but generic nuclease activity
    and stress-associated release are not by themselves enough to place ENDOG beside CAD/DFFB in the canonical
    mammalian execution module.
  resolution: Keep ENDOG in the conserved-comparator notes until a follow-up review justifies a concrete
    human apoptotic-execution role or a lineage-specific variant.
- gap_statement: Apoptotic phosphatidylserine exposure has CASP3 GO-CAM anchors but no reviewed XKR or
    ATP11C module leaves yet.
  boundary: Cached human XKR4, XKR8, and XKR9 GO-CAMs model CASP3-dependent phosphatidylserine exposure
    on the apoptotic cell surface, but those XKR scramblases and flippase regulators have not yet been
    reviewed for this APOPTOSIS slice.
  gap_kind:
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Surface exposure is a major execution output leading to apoptotic-cell clearance and should
    remain distinct from DNA fragmentation and chromatin condensation.
  resolution: Add an apoptotic surface-remodeling branch after reviewing XKR/ATP11C substrates and TIMD4-mediated
    clearance context.
notes: The original human-only template is expanded through verified human/mouse subfamily representatives.
  CASP3/CASP7/CASP6 are distinct roles; XIAP is not generalized to all BIR proteins or all executioners.
  ICAD folding and inhibition are split and connected with appropriate signs. AIF has no generic CASP3
  causal incoming edge, and Acinus RNA binding is not presented as its condensation mechanism. Family
  labels are copied verbatim from the official PANTHER ontology, including the unusual official DFFA label.
  Sixteen human/mouse representatives have individual reviews. Independent integration QA distinguishes
  biochemical capacity, native perturbation evidence and broader family membership; Mammalia scope does
  not transfer every assay-specific relationship to all mammals.
module:
  id: apoptotic_execution_phase
  label: Mammalian apoptotic execution with contextual branches
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: execution phase of apoptosis
    term:
      id: GO:0097194
      label: execution phase of apoptosis
    description: The downstream apoptotic phase in which active executioner caspases and their substrates
      dismantle the cell.
  context:
    taxa:
    - preferred_term: Mammalia
      term:
        id: NCBITaxon:40674
        label: Mammalia
      description: Characterized mammalian implementations, with human and mouse representatives. This
        is not a universal-presence or essentiality assertion for every mammal, tissue or genotype; nonmammalian
        homologs are comparative boundary evidence.
    cellular_components:
    - preferred_term: cytosol
      term:
        id: GO:0005829
        label: cytosol
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
    - preferred_term: mitochondrial intermembrane space
      term:
        id: GO:0005758
        label: mitochondrial intermembrane space
    evidence:
    - source_id: PMID:23457257
      statement: Comparative review documents lineage-specific expansion and loss rather than a universally
        identical animal network.
    - source_id: PMID:17343828
      statement: DFF comparative genomics shows conserved architecture with losses in several sampled
        animal lineages.
    - source_id: PMID:38824481
      statement: Mouse studies reveal tissue, genotype and non-apoptotic variation.
