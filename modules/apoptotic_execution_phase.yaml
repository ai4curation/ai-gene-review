            gocam_associations:
            - model: gomodel:62b4ffe300000784
              activity: gomodel:62b4ffe300000784/62b4ffe300000785
              title: Involvement of CASP7 in apoptosis, its activation by initiator caspases (CASP8, CASP9
                and CASP10) and regulation by XIAP and PAK2 (Human)
            - model: gomodel:62b4ffe300001804
              activity: gomodel:62b4ffe300001804/62b4ffe300001814
              title: Cleavage and inactivation of PARP1 by CASP3 and/or CASP7 during the execution phase of
                apoptosis (Human)
            evidence:
            - source_id: PMID:18723680
              statement: Biochemical comparison distinguishes CASP7 substrate preferences from CASP3.
            - source_id: PMID:38824481
              statement: Mouse genetic studies contextualize redundancy, strain effects and non-apoptotic
                roles.
            - source_id: PMID:15525783
              statement: Mouse CASP7 efficiently cleaves ICAD in the reported comparison, unlike human CASP7;
