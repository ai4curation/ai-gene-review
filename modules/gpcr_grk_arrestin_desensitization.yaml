id: MODULE:gpcr_grk_arrestin_desensitization
title: GPCR GRK-arrestin desensitization module
description: >-
  A reusable receptor-termination motif in which an agonist-occupied G protein-coupled receptor becomes
  a substrate for G protein-coupled receptor kinases, and the phosphorylated receptor recruits
  beta-arrestins that uncouple the receptor from heterotrimeric G proteins and drive receptor
  internalization. The module is grounded in the GRK and ARRB1/ARRB2 steps of the curated C5AR1
  GO-CAM, in the beta-adrenergic receptor kinase/beta-arrestin discovery experiment, and in AT1A
  receptor evidence that GRK isoforms can separate receptor phosphorylation and endocytosis from
  arrestin-mediated ERK scaffolding.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0002029
    title: desensitization of G protein-coupled receptor signaling pathway
    statement: The module is grounded in the GO biological process term for GPCR desensitization.
  - source_id: PMID:2163110
    statement: Beta-arrestin blocks signaling by beta-ARK/GRK2-phosphorylated beta-adrenergic receptors.
    supporting_text: >-
      It inhibited the signaling function of beta ARK-phosphorylated
      beta-adrenergic receptors by more than 75 percent, but not that of
      rhodopsin.
  - source_id: PMID:15671181
    statement: GRK2/3 are the primary kinases for AT1A receptor phosphorylation, beta-arrestin recruitment, and endocytosis.
    supporting_text: >-
      Angiotensin II-stimulated receptor phosphorylation, beta-arrestin
      recruitment, and receptor endocytosis are all mediated primarily by
      GRK2/3.
  - source_id: gomodel:67f85f2b00004426
    title: Desensitization of C5AR1-mediated signaling following phosphorylation by GRK2 or GRK3 (Human).
    statement: >-
      The C5AR1 GO-CAM realizes the motif with parallel GRK2 and GRK3
      G protein-coupled receptor kinase activities that directly provide input for ARRB1
      and ARRB2 protein-macromolecule adaptor activities.
notes: >-
  Boundary: this module begins after ligand binding has produced an active GPCR and ends at
  beta-arrestin binding/internalization. It intentionally leaves the receptor's ligand, G alpha route and
  downstream second-messenger output to receptor-specific modules, and it does not model
  G protein-independent beta-arrestin scaffolding such as ERK activation. It also leaves upstream
  kinase-recruitment control outside the boundary: PH-domain GRK2/3 translocation by G-beta-gamma
  and the membrane anchoring of GRK5/6 are receptor-specific inputs that concrete modules can add
  when relevant. Cytosol is retained in the context for soluble GRK2/3 and beta-arrestin pools before
  recruitment; the annoton locations mark the active receptor-bound step on the cytoplasmic side of
  the plasma membrane. Human GRK and ARRB accessions are exemplars for metazoan family descriptors,
  not a restriction to human receptor modules.

  Reusable conformance target. A node in a concrete receptor-specific module declares
  conforms_to: [{template: gpcr_grk_arrestin_desensitization}] when it contains the three-tier
  GO:0004930 -> GO:0004703 -> GO:0030674 termination motif. Concrete receptor bundles usually
  realize the first tier with a receptor-specific child of GO:0004930 and may add ligand sensing,
  G-protein routing, trafficking and beta-arrestin scaffolding, so they generally conform with
  status: EXTENDS or WITH_DEVIATIONS rather than EXACT.

  Taxon scope. The module context is Metazoa (NCBITaxon:33208), the clade for the GRK/arrestin
  termination motif modelled here. Non-metazoan GPCRs can be desensitized by distinct mechanisms that
  use different receptor kinases and arrestin-related proteins, and are outside this template.
