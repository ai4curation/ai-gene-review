            label: GRK paralog class
            axis: GPCR kinase membrane-recruitment class
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              GRK2/3 and GRK5/6 both realize receptor phosphorylation, but individual receptors can
              prefer different paralog classes. The C5AR1 exemplar realizes the GRK2/3 branch; the
              GRK5/6 branch is retained for receptors where those membrane-associated kinases carry
              homologous desensitization. The GRK5/6 exemplar evidence is asymmetric: GRK5 is grounded
              by activated-receptor phosphorylation and GRK6 by homologous beta-AR desensitization, so
              concrete receptor modules should keep receptor-specific paralog choices explicit. Visual
              GRKs GRK1 and GRK7 are out of scope because this template fixes the downstream adaptor tier
              to ARRB1/ARRB2-family beta-arrestins.
            variants:
