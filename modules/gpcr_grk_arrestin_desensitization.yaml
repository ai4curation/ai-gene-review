                        activity: gomodel:67f85f2b00004426/67f85f2b00004492
                        title: Desensitization of C5AR1-mediated signaling following phosphorylation by GRK2 or GRK3 (Human).
                        description: GRK3 kinase activity in the C5AR1 desensitization GO-CAM.
              - id: grk5_6_branch
                label: GRK5/GRK6 membrane-associated branch
                module_type: REGULATORY_STEP
