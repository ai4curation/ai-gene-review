                  id: GO:0009898
                  label: cytoplasmic side of plasma membrane
            role_description: >-
              Generic GRK tier used as the GO:0004703 conformance anchor; the paralog-class variants
              below record which GRK branch realizes this activity in a concrete receptor module.
        variant_sets:
