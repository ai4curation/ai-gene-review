        description: >-
          A ligand-activated GPCR with cytoplasmic serine/threonine sites that can be phosphorylated by
          GRKs. In concrete modules this role is supplied by receptors such as C5AR1, ADRB1/2, AGTR1,
          CASR, GCGR, PTH1R, muscarinic ACh receptors and other receptor-specific GPCR modules.
