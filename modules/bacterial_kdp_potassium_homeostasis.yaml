id: MODULE:bacterial_kdp_potassium_homeostasis
title: Bacterial Kdp potassium uptake and regulatory control
description: A bacterial potassium-homeostasis module combining the KdpABC transport machinery, a variably
  required KdpF stabilizing component, and lineage-dependent control of pump production and activity.
  KdpA selects potassium and supplies the inter-subunit pathway; KdpB couples ATP turnover to ion transfer
  and cytoplasmic release, supported by KdpC. Canonical KdpD-to-KdpE signaling induces pump expression,
  whereas a Caulobacter regulatory profile retains KdpE output without making cognate KdpD activation
  obligatory. Characterized KdpD proteins can also restrain KdpE phosphorylation or inhibit existing pumps
  through KdpB serine phosphorylation. Other potassium uptake systems and non-Kdp virulence outputs are
  outside this module.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0000160
  title: phosphorelay signal transduction system
  statement: Defines the KdpD/KdpE two-component signaling relationship.
- source_id: GO:0008556
  title: P-type potassium transmembrane transporter activity
  statement: Defines ATP-coupled potassium transport by the KdpFABC pump.
- source_id: file:interpro/panther/PTHR30607/PTHR30607-review.yaml
  statement: KdpA family review (single subfamily, one PAINT node).
- source_id: file:interpro/panther/PTHR43743/PTHR43743-review.yaml
  statement: KdpB family review (single subfamily, one PAINT node).
- source_id: file:interpro/panther/PTHR30042/PTHR30042-review.yaml
  statement: KdpC family review; KdpC is a non-catalytic accessory subunit.
- source_id: file:interpro/panther/PTHR45569/PTHR45569-review.yaml
  statement: KdpD family review; characterized short forms lack the histidine transmitter, which does not exclude atypical serine-kinase activity.
- source_id: file:interpro/panther/PTHR48111/PTHR48111-review.yaml
  statement: OmpR/PhoB-type response-regulator family review; SF50 contains the verified KdpE exemplars, while exclusivity of Kdp-specific biology to this subfamily remains unresolved.
