id: MODULE:bacterial_kdp_potassium_homeostasis
title: Bacterial Kdp potassium-homeostasis system
description: >-
  A reusable bacterial module coupling KdpD/KdpE phosphorelay control to the
  high-affinity KdpFABC potassium pump. KdpD senses conditions associated with
  potassium limitation and phosphorylates KdpE, activated KdpE promotes kdpFABC
  transcription, and the membrane KdpFABC complex couples ATP hydrolysis to
  potassium uptake. Constitutive potassium channels and lower-affinity uptake
  systems are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10608856
    title: The KdpF subunit is part of the K(+)-translocating Kdp complex of Escherichia coli and is responsible for stabilization of the complex in vitro
    statement: >-
      Biochemical deletion and reconstitution experiments establish KdpF as a
      complex-associated stabilizing element rather than an independently
      catalytic potassium transporter.
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the KdpD/KdpE two-component signaling relationship.
  - source_id: GO:0008556
    title: P-type potassium transmembrane transporter activity
    statement: Defines ATP-coupled potassium transport by the KdpFABC pump.
  - source_id: file:PSEPK/kdpA/kdpA-ai-review.yaml
    statement: Grounds the PSEPK KdpA potassium-binding and translocation exemplar.
  - source_id: file:PSEPK/kdpB/kdpB-ai-review.yaml
    statement: Grounds the PSEPK KdpB P-type ATPase exemplar.
  - source_id: file:PSEPK/kdpC/kdpC-ai-review.yaml
    statement: Grounds the PSEPK KdpC accessory-subunit exemplar.
  - source_id: file:PSEPK/kdpD/kdpD-ai-review.yaml
    statement: Grounds the PSEPK KdpD sensor-kinase exemplar.
  - source_id: file:PSEPK/kdpE/kdpE-ai-review.yaml
    statement: Grounds the PSEPK KdpE response-regulator exemplar.
  - source_id: file:PSEPK/kdpF/kdpF-ai-review.yaml
    statement: Grounds the PSEPK KdpF stabilizing-subunit exemplar.
notes: >-
  The module is species-neutral; Pseudomonas putida KT2440 proteins provide a
  concrete implementation. The environmental input to KdpD can integrate
  potassium limitation, ionic strength, and membrane-state signals differently
  among bacteria, so the first role is described conservatively. KdpC and KdpF
  are retained as pump components but are not assigned independent catalytic
  molecular functions. KdpF stabilization is grounded by E. coli biochemical
  evidence; conservation of that quantitative contribution in KT2440 remains
  inferential.
