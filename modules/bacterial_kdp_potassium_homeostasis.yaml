id: MODULE:bacterial_kdp_potassium_homeostasis
title: Bacterial Kdp potassium-homeostasis system
description: >-
  A reusable bacterial module coupling KdpD/KdpE phosphorelay control to the
  high-affinity KdpFABC potassium pump. KdpD senses conditions associated with
  potassium limitation and phosphorylates KdpE, activated KdpE promotes kdpFABC
  transcription, and the membrane KdpFABC complex couples ATP hydrolysis to
  potassium uptake. Constitutive potassium channels and lower-affinity uptake
  systems are outside this module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:28636601
    title: Crystal structure of the potassium-importing KdpFABC membrane complex.
    statement: >-
      The E. coli KdpFABC crystal structure defines the subunit architecture:
      a channel-like KdpA from the superfamily of K+ transporters, a P-type
      ATPase KdpB, and the single-helix accessory subunits KdpC and KdpF.
  - source_id: PMID:34272288
    title: Structural basis for potassium transport in prokaryotes by KdpFABC.
    statement: >-
      Cryo-EM structures of E. coli KdpFABC in several catalytic states show
      KdpA selecting K+ and KdpB coupling ATP hydrolysis to its release.
  - source_id: PMID:10608856
    title: The KdpF subunit is part of the K(+)-translocating Kdp complex of Escherichia coli and is responsible for stabilization of the complex in vitro
    statement: >-
      Biochemical deletion and reconstitution experiments establish KdpF as a
      complex-associated stabilizing element rather than an independently
      catalytic potassium transporter.
  - source_id: PMID:9099740
    title: Purification, reconstitution, and characterization of KdpD, the turgor sensor of Escherichia coli.
    statement: >-
      Purified, reconstituted E. coli KdpD autophosphorylates and controls
      kdpFABC expression through KdpE.
  - source_id: PMID:22291906
    title: Structure-function studies of DNA binding domain of response regulator KdpE reveals equal affinity interactions at DNA half-sites.
    statement: >-
      The KdpE winged-helix DNA-binding domain binds two 6-bp direct repeats
      at the kdpFABC promoter.
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: Defines the KdpD/KdpE two-component signaling relationship.
  - source_id: GO:0008556
    title: P-type potassium transmembrane transporter activity
    statement: Defines ATP-coupled potassium transport by the KdpFABC pump.
  - source_id: file:interpro/panther/PTHR30607/PTHR30607-review.yaml
    statement: KdpA family review (single subfamily, one PAINT node).
  - source_id: file:interpro/panther/PTHR43743/PTHR43743-review.yaml
    statement: KdpB family review (single subfamily, one PAINT node).
  - source_id: file:interpro/panther/PTHR30042/PTHR30042-review.yaml
    statement: KdpC family review; KdpC is a non-catalytic accessory subunit.
  - source_id: file:interpro/panther/PTHR45569/PTHR45569-review.yaml
    statement: KdpD family review; truncated cyanobacterial members lack the kinase.
  - source_id: file:interpro/panther/PTHR48111/PTHR48111-review.yaml
    statement: >-
      OmpR/PhoB-type response-regulator family review; Kdp-specific biology is
      confined to the KdpE subfamily SF50.
  - source_id: file:ECOLI/kdpA/kdpA-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpA reference exemplar.
  - source_id: file:ECOLI/kdpB/kdpB-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpB reference exemplar.
  - source_id: file:ECOLI/kdpC/kdpC-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpC reference exemplar.
  - source_id: file:ECOLI/kdpD/kdpD-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpD reference exemplar.
  - source_id: file:ECOLI/kdpE/kdpE-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpE reference exemplar.
  - source_id: file:ECOLI/kdpF/kdpF-ai-review.yaml
    statement: Grounds the E. coli K-12 KdpF reference exemplar.
  - source_id: file:PSEPK/kdpA/kdpA-ai-review.yaml
    statement: Grounds the PSEPK KdpA potassium-binding and translocation exemplar.
  - source_id: file:PSEPK/kdpB/kdpB-ai-review.yaml
    statement: Grounds the PSEPK KdpB P-type ATPase exemplar.
  - source_id: file:PSEPK/kdpC/kdpC-ai-review.yaml
    statement: Grounds the PSEPK KdpC accessory-subunit exemplar.
  - source_id: file:PSEPK/kdpD/kdpD-ai-review.yaml
    statement: Grounds the PSEPK KdpD sensor-kinase exemplar.
  - source_id: file:PSEPK/kdpE/kdpE-ai-review.yaml
    statement: Grounds the PSEPK KdpE response-regulator exemplar.
  - source_id: file:PSEPK/kdpF/kdpF-ai-review.yaml
    statement: Grounds the PSEPK KdpF stabilizing-subunit exemplar.
  - source_id: file:DESVH/Q725T7/Q725T7-ai-review.yaml
    statement: Grounds a deltaproteobacterial KdpB exemplar.
notes: >-
  The Kdp system is conserved across phylogenetically distant bacteria
  (Proteobacteria, Firmicutes, Actinobacteria, Cyanobacteria) and also occurs
  in some haloarchaea, so the module is species-neutral. Escherichia coli K-12
  KdpFABC/KdpDE is the canonical, structurally and biochemically
  characterized system and seeds every PAINT node used here; Pseudomonas
  putida KT2440 provides a second, sequence-inferred proteobacterial
  implementation, and a Desulfovibrio KdpB adds a deltaproteobacterial pump
  exemplar. The module context is kept at Bacteria because the archaeal
  members are known here only from PANTHER membership, not from
  characterization. The KdpD/KdpE sensor and response-regulator steps are
  grouped as an inner phosphorelay bundle that `conforms_to`
  MODULE:two_component_relay WITH_DEVIATIONS: it is a simple two-tier system
  with direct His-to-Asp transfer and no histidine-phosphotransfer (Hpt,
  GO:0009927) protein, so the validator's tier-count, tier-function and
  topology advisories for the missing Hpt tier are expected. The pump output
  remains a free extension outside the conforming bundle. KdpE carries two annotons, matching the two
  core functions its gene reviews keep separate: the receiver-domain
  phosphotransfer (GO:0000156) inside the bundle, and cis-regulatory DNA
  binding (GO:0000987) driving transcription as a sibling part outside it. Fusing the phosphorelay function
  with the transcription process would assert that GO:0000156 is the activity
  performing GO:0045893, which neither the gene reviews nor the ontology
  support. The environmental input to KdpD integrates potassium limitation,
  ionic strength and membrane-state signals differently among bacteria, so
  the first role is described conservatively; truncated cyanobacterial
  KdpD-like proteins lack the transmitter region and fall outside the sensor
  kinase role. KdpC and KdpF are retained as pump components but are not
  assigned independent catalytic molecular functions. KdpF stabilization is
  grounded by E. coli biochemical evidence; conservation of that quantitative
  contribution in other bacteria remains inferential. KdpF is grounded on
  NCBIfam:TIGR02115 (integrated in InterPro IPR011726) because this 29-residue
  membrane peptide has no PANTHER family assignment; both KdpF exemplars carry
  the TIGR02115 match. The KdpE family (PTHR48111) is a broad OmpR/PhoB-type
  response-regulator family; it is grounded at the KdpE subfamily SF50
  because target genes and regulatory sign differ between subfamilies. PAINT
  and GOA assign the Kdp subunits to GO:1903103 potassium:proton antiporter
  complex; the family and gene reviews treat that as a mis-mapping of
  GO:0031004, since KdpFABC is an ATP-driven importer.
module:
  id: bacterial_kdp_potassium_homeostasis
  label: Bacterial Kdp potassium-homeostasis system
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: potassium ion homeostasis
      term:
        id: GO:0055075
        label: potassium ion homeostasis
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: KdpD/KdpE His-Asp phosphorelay
      node:
        id: kdp_phosphorelay
        label: KdpD/KdpE phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The sensor histidine kinase KdpD autophosphorylates in response to the
          potassium-limitation input and transfers phosphate directly to the
          conserved receiver aspartate of KdpE, which effects the transcriptional
          output.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is absent:
                this is a simple bacterial two-component system in which the
                sensor kinase transfers phosphate directly to the response
                regulator.
            notes: >-
              KdpD (sensor, GO:0000155) -> KdpE (response regulator,
              GO:0000156) fills the sensor and response-regulator tiers with the
              canonical His->Asp transfer, with no discrete Hpt protein.
        parts:
        - order: 1
          role: KdpD sensor-kinase signaling
          node:
            id: kdpd_sensor_signaling
            label: KdpD sensor-kinase signaling
            module_type: BIOLOGICAL_PROCESS
            annotons:
              - id: kdpd_sensor_kinase
                label: KdpD phosphorelay sensor kinase
                participant:
                  selector_type: FAMILY
                  family:
                    preferred_term: bacterial KdpD sensor-kinase family
                    term:
                      id: PANTHER:PTHR45569:SF1
                      label: SENSOR PROTEIN KDPD
                    representative_members:
                      - preferred_term: KdpD (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P21865
                          label: Sensor protein KdpD
                      - preferred_term: KdpD (Pseudomonas putida KT2440)
                        term:
                          id: UniProtKB:Q88FD9
                          label: Sensor protein KdpD
                function:
                  preferred_term: phosphorelay sensor kinase activity
                  term:
                    id: GO:0000155
                    label: phosphorelay sensor kinase activity
                processes:
                  - preferred_term: phosphorelay signal transduction system
                    term:
                      id: GO:0000160
                      label: phosphorelay signal transduction system
                locations:
                  - preferred_term: plasma membrane
                    term:
                      id: GO:0005886
                      label: plasma membrane
                role_description: >-
                  Detects the physiological input and transfers phosphate through
                  its histidine-kinase relay to KdpE.
        - order: 2
          role: KdpE receiver-aspartate phosphorylation
          node:
            id: kdpe_response_regulator
            label: KdpE response regulator
            module_type: REGULATORY_STEP
            annotons:
              - id: kdpe_response_regulator_activity
                label: KdpE phosphorelay response regulator
                participant:
                  selector_type: FAMILY
                  family:
                    preferred_term: bacterial KdpE response-regulator family
                    term:
                      id: PANTHER:PTHR48111:SF50
                      label: KDP OPERON TRANSCRIPTIONAL REGULATORY PROTEIN KDPE
                    representative_members:
                      - preferred_term: KdpE (Escherichia coli K-12)
                        term:
                          id: UniProtKB:P21866
                          label: KDP operon transcriptional regulatory protein KdpE
                      - preferred_term: KdpE (Pseudomonas putida KT2440)
                        term:
                          id: UniProtKB:Q88FE0
                          label: Kdp operon transcriptional regulatory protein KdpE
                function:
                  preferred_term: phosphorelay response regulator activity
                  term:
                    id: GO:0000156
                    label: phosphorelay response regulator activity
                processes:
                  - preferred_term: phosphorelay signal transduction system
                    term:
                      id: GO:0000160
                      label: phosphorelay signal transduction system
                locations:
                  - preferred_term: cytosol
                    term:
                      id: GO:0005829
                      label: cytosol
                role_description: >-
                  Receives phosphate from KdpD on its conserved receiver
                  aspartate, licensing the DNA-binding output domain.
        connections:
          - source: kdpd_sensor_signaling
            target: kdpe_response_regulator
            connection_type: CAUSES
            description: >-
              KdpD transfers its phosphoryl group to the KdpE receiver
              aspartate.
    - order: 2
      role: KdpE-dependent transcriptional activation
      node:
        id: kdpe_transcriptional_activation
        label: KdpE transcriptional activation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated KdpE binds the Kdp cis-regulatory region and activates
          transcription of the pump genes. This is a separate activity from the
          receiver-domain phosphotransfer step, and the KdpE gene review keeps
          the two apart.
        annotons:
          - id: kdpe_transcription_activator
            label: KdpE cis-regulatory DNA binding
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial KdpE response-regulator family
                term:
                  id: PANTHER:PTHR48111:SF50
                  label: KDP OPERON TRANSCRIPTIONAL REGULATORY PROTEIN KDPE
                representative_members:
                  - preferred_term: KdpE (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P21866
                      label: KDP operon transcriptional regulatory protein KdpE
                  - preferred_term: KdpE (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FE0
                      label: Kdp operon transcriptional regulatory protein KdpE
            function:
              preferred_term: cis-regulatory region sequence-specific DNA binding
              term:
                id: GO:0000987
                label: cis-regulatory region sequence-specific DNA binding
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Binds Kdp cis-regulatory DNA in the phosphorylated state and
              activates transcription of the pump genes.
    - order: 3
      role: ATP-coupled high-affinity potassium uptake
      node:
        id: kdpfabc_potassium_pump
        label: KdpFABC potassium pump
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: kdpfabc_transport_activity
            label: KdpFABC P-type potassium transporter
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial KdpFABC potassium pump
                active_units:
                  - id: kdpa_transport_subunit
                    label: KdpA potassium-selective transport subunit
                    role: Selects and translocates potassium ions.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KdpA family
                        term:
                          id: PANTHER:PTHR30607:SF2
                          label: POTASSIUM-TRANSPORTING ATPASE POTASSIUM-BINDING SUBUNIT
                        representative_members:
                          - preferred_term: KdpA (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P03959
                              label: Potassium-transporting ATPase potassium-binding subunit
                          - preferred_term: KdpA (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FD7
                              label: Potassium-transporting ATPase potassium-binding subunit
                  - id: kdpb_atpase_subunit
                    label: KdpB P-type ATPase subunit
                    role: Couples ATP hydrolysis to KdpA-mediated potassium transport.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KdpB family
                        term:
                          id: PANTHER:PTHR43743:SF1
                          label: POTASSIUM-TRANSPORTING ATPASE ATP-BINDING SUBUNIT
                        representative_members:
                          - preferred_term: KdpB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P03960
                              label: Potassium-transporting ATPase ATP-binding subunit
                          - preferred_term: KdpB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:A0A140FWL1
                              label: Potassium-transporting ATPase ATP-binding subunit
                          - preferred_term: KdpB (Nitratidesulfovibrio vulgaris Hildenborough)
                            term:
                              id: UniProtKB:Q725T7
                              label: Potassium-transporting ATPase ATP-binding subunit
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: kdpc_accessory_subunit
                    label: KdpC accessory subunit
                    role: Membrane-associated accessory component of the pump.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KdpC family
                        term:
                          id: PANTHER:PTHR30042:SF2
                          label: POTASSIUM-TRANSPORTING ATPASE KDPC SUBUNIT
                        representative_members:
                          - preferred_term: KdpC (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P03961
                              label: Potassium-transporting ATPase KdpC subunit
                          - preferred_term: KdpC (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FD8
                              label: Potassium-transporting ATPase KdpC subunit
                  - id: kdpf_stabilizing_subunit
                    label: KdpF stabilizing subunit
                    role: Small membrane component that stabilizes the KdpFABC complex.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: KdpF family
                        term:
                          id: NCBIfam:TIGR02115
                          label: K(+)-transporting ATPase subunit F
                        representative_members:
                          - preferred_term: KdpF (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P36937
                              label: Potassium-transporting ATPase KdpF subunit
                          - preferred_term: KdpF (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:A0A140FWL2
                              label: Potassium-transporting ATPase subunit F
            function:
              preferred_term: P-type potassium transmembrane transporter activity
              term:
                id: GO:0008556
                label: P-type potassium transmembrane transporter activity
              substrates:
                - preferred_term: extracellular potassium ion
                - preferred_term: ATP
                - preferred_term: water
              products:
                - preferred_term: cytoplasmic potassium ion
                - preferred_term: ADP
                - preferred_term: phosphate
            processes:
              - preferred_term: potassium ion transmembrane transport
                term:
                  id: GO:0071805
                  label: potassium ion transmembrane transport
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Performs high-affinity ATP-driven potassium uptake after induction
              of the kdp pump genes.
  connections:
    - source: kdp_phosphorelay
      target: kdpe_transcriptional_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the KdpE receiver domain licenses its cis-regulatory
        DNA-binding output.
    - source: kdpe_transcriptional_activation
      target: kdpfabc_potassium_pump
      connection_type: POSITIVELY_REGULATES
      description: >-
        KdpE-driven transcription promotes production of the KdpFABC pump.
  knowledge_gaps:
    - gap_statement: >-
        The quantitative requirement for KdpF and KdpC in different bacterial
        KdpFABC complexes is incompletely characterized.
      boundary: >-
        Retain both as non-catalytic pump components, without assigning either
        the complete transporter activity independently.
      gap_kind:
        - BIOLOGY
