id: MODULE:stomatal_lineage_development
title: Stomatal lineage progression and spacing (EPF-ERECTA-YODA-MAPK and SPCH/MUTE/FAMA-SCRM)
description: >-
  In the Arabidopsis leaf epidermis, stomata are produced by a dedicated cell lineage whose successive
  transitions are driven by three closely related group Ia bHLH transcription factors, each acting as a
  heterodimer with the broadly expressed group IIIb bHLHs SCREAM/ICE1 (SCRM) and SCRM2. SPEECHLESS (SPCH)
  initiates the lineage by driving the asymmetric entry division of a meristemoid mother cell, MUTE terminates
  the self-renewing asymmetric divisions of the meristemoid and converts it into a guard mother cell (GMC),
  and FAMA drives the single symmetric GMC division and guard cell differentiation, then locks in guard cell
  fate with RETINOBLASTOMA-RELATED. Lineage entry and spacing are restrained by cell-cell signalling: the
  secreted cysteine-rich peptide EPF2, produced by early lineage cells, binds the leucine-rich-repeat receptor
  kinase ERECTA in a complex with the non-catalytic co-receptor TOO MANY MOUTHS (TMM); ligand binding recruits
  SERK co-receptor kinases and activates the MAPKKK YODA, which phosphorylates MKK4/MKK5, which in turn activate
  MPK3/MPK6. MPK3/MPK6, docked onto SCRM through its KiDoK motif and recruited with YODA to the cortex by
  the polarity scaffold BASL, phosphorylate SPCH and SCRM and promote their degradation, limiting lineage
  entry. Because SPCH-SCRM directly activates EPF2 and TMM, the circuit forms a negative feedback loop that
  self-organizes stomatal density and the one-cell spacing rule. The related peptide EPF1, perceived mainly
  by ERL1, acts later on spacing divisions, and the positive peptide stomagen (EPFL9) competes with EPF2 for
  ERECTA-TMM. Brassinosteroid (via BIN2 inhibition of YODA), CO2 (via CRSP cleavage of EPF2) and other
  environmental inputs converge on this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:18641265
  title: SCREAM/ICE1 and SCREAM2 specify three cell-state transitional steps leading to arabidopsis stomatal
    differentiation.
  statement: SPCH, MUTE and FAMA act as heterodimers with SCRM/ICE1 and SCRM2 at three successive steps.
  supporting_text: Here, we identify two paralogous proteins, SCREAM (SCRM) and SCRM2, which directly interact
    with and specify the sequential actions of SPCH, MUTE, and FAMA.
- source_id: PMID:17183267
  title: Termination of asymmetric cell division and differentiation of stomata.
  statement: SPCH, MUTE and FAMA control stomatal development at three consecutive steps.
  supporting_text: Together, SPCH, MUTE and FAMA bHLH proteins control stomatal development at three consecutive
    steps
- source_id: PMID:22241782
  title: Direct interaction of ligand-receptor pairs specifying stomatal patterning.
  statement: ERECTA-family receptors are the primary EPF receptors; EPF2-ERECTA specifies lineage entry and
    TMM modulates the signal.
  supporting_text: Our results place the ERECTA family as the primary receptors for EPFs with TMM as a signal
    modulator and establish EPF2-ERECTA and EPF1-ERL1 as ligand-receptor pairs specifying two steps of stomatal
    development
- source_id: PMID:17259259
  title: Stomatal development and patterning are regulated by environmentally responsive mitogen-activated
    protein kinases in Arabidopsis.
  statement: MKK4/MKK5-MPK3/MPK6 act downstream of YODA in stomatal development.
  supporting_text: We further establish that the MKK4/MKK5-MPK3/MPK6 module is downstream of YODA, a MAPKKK.
- source_id: PMID:26203655
  title: Molecular Framework of a Regulatory Circuit Initiating Two-Dimensional Spatial Patterning of Stomatal
    Lineage.
  statement: SPCH-SCRM directly activates EPF2 and TMM, closing a negative feedback loop.
  supporting_text: This transcription factor module directly binds to the promoters and activates a secreted
    signal, EPIDERMAL PATTERNING FACTOR2, and the receptor modifier TOO MANY MOUTHS, while the receptor ERECTA
    lies outside of this module.
notes: >-
  Boundary: the module covers the core EPF2-ERECTA/TMM-YODA-MKK4/5-MPK3/6 inhibitory relay and the
  SPCH-MUTE-FAMA/SCRM transcriptional switch of the Arabidopsis stomatal lineage. Parallel or modulatory
  components are described in prose but not modelled as annotons because they lack gene reviews in this
  repository: EPF1 and ERL1/ERL2 (spacing divisions), stomagen/EPFL9 (antagonist ligand), SERK co-receptors,
  BASL/POLAR polarity scaffolds, BIN2, CRSP, SCRM2 and MPK3 (MPK3 is named in prose as MPK6's redundant
  partner). MKK4 and MKK5 are grounded as representative members of the redundant MAPKK step and both have
  complete gene reviews. Annoton molecular functions follow the gene reviews'
  core_functions (EPF2, TMM, ERECTA, YDA, MKK4, MKK5, MPK6, SPCH, MUTE, FAMA, ICE1). No production GO-CAM in
  gocams/index.tsv contains any member, so no gocam_associations are given. No PANTHER family ids are
  asserted (families are described by preferred_term and representative members only). Deep research by the
  Falcon provider was unavailable (HTTP 402) during this session.
module:
