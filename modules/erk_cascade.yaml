    - source: erk_output
      target: sprouty_spred_feedback
      connection_type: CAUSES
      description: >-
        ERK/FGF signalling induces Sprouty expression, closing the Sprouty
        negative-feedback loop onto the Ras switch and the RAF tier.
      evidence:
        - source_id: PMID:31761616
          statement: Sprouty expression is induced by ERK activation as negative feedback.
          supporting_text: SPRY expression was previously reported to be induced by ERK activation as a negative feedback
        - source_id: PMID:11238463
          statement: Mammalian and chicken Sprouty genes are upregulated by FGF signalling.
          supporting_text: expression of mSprys and chicken Sprys is also upregulated by the FGF signaling pathway
    - source: sprouty_spred_feedback
      target: ras_nucleotide_switch
      connection_type: NEGATIVELY_REGULATES
      description: SPRY2 sequesters GRB2 away from SOS and SPRED recruits the RasGAP NF1, both
        lowering Ras-GTP.
    - source: sprouty_spred_feedback
      target: erk_relay
      connection_type: NEGATIVELY_REGULATES
      description: SPRY4 binds RAF1 and blocks its activation.
    - source: erk_output
      target: mapk_negative_regulation
      connection_type: CAUSES
      description: >-
        The ERK transcriptional program induces the immediate-early phosphatases
        MKP-1/MKP-2 (DUSP1/DUSP4), closing the DUSP negative-feedback loop.
      evidence:
        - source_id: PMID:8995446
          title: The dual specificity mitogen-activated protein kinase phosphatase-1 and -2 are induced by the p42/p44MAPK cascade.
          statement: MKP-1 and MKP-2 induction requires the p42/p44 MAPK cascade and temporally correlates with MAPK inactivation.
          supporting_text: activation of the p42/p44MAPK cascade promotes the induction of MKP-1 and MKP-2, which may then attenuate p42/p44MAPK-dependent events
    - source: erk_mapk
      target: raf_map3k
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active ERK feedback-phosphorylates RAF (six S/TP sites on Raf-1, four on
        B-Raf), which blocks Ras binding and desensitizes the MAP3K tier until
        PP2A/Pin1 recycle it.
      evidence:
        - source_id: PMID:15664191
          title: Regulation of Raf-1 by direct feedback phosphorylation.
          statement: ERK-dependent hyperphosphorylation of Raf-1 inhibits the Ras/Raf-1 interaction and desensitizes Raf-1.
          supporting_text: Five of the identified sites are proline-directed targets of activated ERK, and phosphorylation of all six sites requires MEK signaling, indicating a negative feedback mechanism. Hyperphosphorylation of these six sites inhibits the Ras/Raf-1 interaction and desensitizes Raf-1 to additional stimuli.
        - source_id: PMID:19933846
          title: Impact of feedback phosphorylation and Raf heterodimerization on normal and mutant B-Raf signaling.
          statement: B-Raf is subject to the same ERK-dependent feedback phosphorylation, which inhibits binding to activated Ras.
          supporting_text: We identify four S/TP sites of B-Raf phosphorylated by activated ERK and find that feedback phosphorylation of B-Raf inhibits binding to activated Ras
        - source_id: file:models/boolean/bbm-070-mapk-cancer-cell-fate/model.bnet
          statement: The published MAPK logical model (Grieco 2013, PMID:24250280) carries ERK as an inhibitor in the RAF update rule.
        - source_id: file:models/boolean/signor/SIGNOR-EGF.tsv
          statement: SIGNOR-EGF records ERK1/2 down-regulating BRAF by phosphorylation of Thr401 (direct; PMID:21135229).
    - source: erk_mapk
      target: ras_gef_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active ERK directly phosphorylates the C-terminal proline-rich region of
        SOS1 on multiple MAPK sites, weakening GRB2-SOS binding and uncoupling
        SOS from the receptor: a direct negative feedback onto the Ras switch.
      evidence:
        - source_id: PMID:8816480
          title: Identification of the mitogen-activated protein kinase phosphorylation sites on human Sos1 that regulate interaction with Grb2.
          statement: Five MAPK sites in the C-terminal domain of hSos1 regulate Grb2 binding; alanine substitution increases Grb2 affinity.
          supporting_text: Replacing the MAP kinase phosphorylation sites with alanine residues results in an increase in the binding affinity of Grb2 to hSos1
        - source_id: file:models/boolean/signor/SIGNOR-EGF.tsv
          statement: SIGNOR-EGF records ERK1/2 down-regulating SOS1 activity by phosphorylation of Ser1132/Ser1167/Ser1197 (direct; PMID:8816480).
    - source: erk_output
      target: ras_gef_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        The ERK substrate kinase RSK (part of the ERK effector output step)
        phosphorylates SOS1 on further C-terminal sites (Ser1134/Ser1161),
        creating 14-3-3 docking sites: a second, one-step-delayed negative
        feedback onto the Ras switch, and the route the published MAPK logical
        model uses (RSK -| SOS).
      evidence:
        - source_id: PMID:22827337
          title: RSK phosphorylates SOS1 creating 14-3-3-docking sites and negatively regulating MAPK activation.
          statement: RSK phosphorylates SOS1 on Ser1134/Ser1161, creating 14-3-3 sites; mutating them extends MAPK activation.
          supporting_text: RSK phosphorylates the Ras activator SOS1 (Son of Sevenless homologue 1) in cultured cells on two C-terminal residues, Ser(1134) and Ser(1161)
        - source_id: PMID:9242373
          title: EGF induced SOS phosphorylation in PC12 cells involves P90 RSK-2.
          statement: p90 RSK-2, downstream of MAP kinase, is a major SOS kinase after EGF stimulation and down-regulates Ras activation through SOS.
          supporting_text: a major mitogen activated kinase for SOS is p90 Rsk-2, a downstream target of MAP kinase
        - source_id: file:models/boolean/bbm-070-mapk-cancer-cell-fate/model.bnet
          statement: The published MAPK logical model (Grieco 2013, PMID:24250280) carries RSK as an inhibitor in the SOS update rule.
