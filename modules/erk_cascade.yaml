id: MODULE:erk_cascade
title: ERK1/2 (Ras-RAF-MEK-ERK) MAPK cascade module
description: >-
  A taxon-neutral decomposition of the canonical Ras-RAF-MEK-ERK
  mitogen-activated protein kinase cascade, the concrete ERK1/2 realization of
  the generic three-tier MAP kinase relay (MODULE:mapk_relay). The cascade
  converts receptor-proximal tyrosine-phosphorylation events into ERK1/ERK2
  activity and a proliferative/differentiation transcriptional program, and is
  deployed downstream of many distinct receptor systems: receptor tyrosine
  kinases (EGFR, FGFR, PDGFR, insulin/IGF), cytokine receptors signaling through
  JAKs, G-protein-coupled receptors, and integrins. The module captures six
  parts, numbered as in `parts`: (1) recruitment of SH2/SH3 adaptors (GRB2,
  SHC) to a receptor phosphotyrosine, with GRB2-mediated recruitment of the Ras
  guanine nucleotide exchange factor SOS; (2) the Ras nucleotide switch (SOS
  GEF -> Ras GTPase -> RasGAP), declared as an inner bundle that `conforms_to`
  gtpase_switch; (3) the conforming ERK kinase relay - Ras-driven RAF(MAP3K) ->
  MEK1/2(MAP2K) -> ERK1/2(MAPK) on the TEY motif - declared as an inner bundle
  that `conforms_to` mapk_relay; (4) ERK action on nuclear (ELK1/Ets, RSK, MSK)
  and cytoplasmic substrates to drive transcription, proliferation, and
  differentiation; (5) DUSP/MKP negative feedback on ERK; and (6) optional
  Sprouty/SPRED feedback inhibition at the SOS-Ras-RAF level.
  Grounded in GO:0000165 (MAPK cascade) / GO:0070371 (ERK1 and ERK2 cascade).
status: DRAFT
evidence:
  - source_id: GO:0000165
    title: MAPK cascade
    statement: >-
      The module is grounded in the GO biological process term for the MAPK
      cascade, an intracellular protein kinase cascade containing at least a
      MAPK, a MAP2K, and a MAP3K acting in series.
  - source_id: GO:0070371
    title: ERK1 and ERK2 cascade
    statement: >-
      The terminal tier of this module is the ERK1/ERK2 cascade, the
      classical mitogen-responsive MAPK module.
  - source_id: GO:0007265
    title: Ras protein signal transduction
    statement: >-
      The switch tier is grounded in Ras protein signal transduction: GTP-bound
      Ras transmits the signal from receptor-recruited GEFs to the RAF kinases.
  - source_id: PANTHER:PTN000631348
    title: PAINT Ras GTPase ancestral node
    statement: >-
      Local PAINT IBD seed rows place curated HRAS/KRAS/NRAS exemplars in
      PTHR24070 node PTN000631348 with GTPase activity and small GTPase-mediated
      signal-transduction terms.
  - source_id: PANTHER:PTN008604616
    title: PAINT Ras protein signal transduction node
    statement: >-
      Local PAINT IBD seed rows place curated HRAS/KRAS/NRAS exemplars in a
      Ras protein signal transduction node, anchoring the Ras-switch tier
      evolutionarily where the cache supports it.
notes: >-
  This module is the concrete ERK1/2 branch of the generic three-tier MAP kinase
  relay (MODULE:mapk_relay), and embeds two nested conforming bundles: the inner
  `erk_relay` node bundles the RAF -> MEK -> ERK tiers and conforms to
  mapk_relay, and the inner `ras_nucleotide_switch` node bundles the SOS GEF ->
  Ras GTPase -> RasGAP tiers and conforms to MODULE:gtpase_switch. The receptor-
  proximal adaptor step and the downstream ERK-output and DUSP-feedback steps
  are this cascade's free extensions around the conforming cores. The module is
  intentionally a reusable "sidecar": it is deployed downstream of many receptor
  systems rather than being specific to one. It is referenced as a branch-point
  interface by the JAK-STAT signaling module (MODULE:jak_stat_signaling), where
  JAK-phosphorylated receptor tyrosines recruit GRB2/SHC and fork into this
  cascade in parallel with STAT activation; ERK in turn feeds back onto STATs
  via C-terminal serine phosphorylation. The same module is deployed by RTKs,
  GPCRs (often via PI3K/PKC or transactivation), and integrins. Representative
  UniProt members were verified against curated reviews in this repository;
  tiers without a verified local exemplar are given as family descriptors with
  preferred_term and description. PANTHER grounding: kinase-tier family
  descriptors carry family-level PTHR ids checked against interpro/panther
  membership (PTHR24055 for every MAPK tier, PTHR48013 for all MAP2Ks, including
  MEK1/MEK2, MKK3/4/5/6/7 and Pbs2/Ste7, per the current PANTHER classification,
  PTHR24361 for MEKK2/MEKK3). PANTHER subfamilies are deliberately not used:
  they are not clean paralog groups here (e.g. PTHR48013:SF9, named for MEK5,
  also contains yeast Ste7 and plant MKKs), so branch identity is carried by the
  representative members and the PTN evidence rather than by a subfamily id. The
  RAF family id PTHR44329 carries PANTHER's official name (TNNI3K-related) but
  contains BRAF, RAF1 and ARAF. The GRB2/SHC adaptor and DUSP descriptors mix
  unrelated PANTHER families and assert no id; the MAP3K tiers of the stress
  cascades likewise stay id-free.
module:
  id: erk_cascade
  label: ERK1/2 (Ras-RAF-MEK-ERK) cascade
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: MAPK cascade
      term:
        id: GO:0000165
        label: MAPK cascade
      description: Three-tier MAP3K -> MAP2K -> MAPK protein kinase relay.
    - preferred_term: ERK1 and ERK2 cascade
      term:
        id: GO:0070371
        label: ERK1 and ERK2 cascade
      description: The classical mitogen-activated ERK module that this cascade culminates in.
  context:
    taxa:
      - preferred_term: eukaryotes
        description: >-
          MAPK cascades are conserved across eukaryotes; the Ras-ERK module is a
          metazoan elaboration deployed by many receptor classes.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: receptor-proximal adaptor recruitment
      node:
        id: adaptor_recruitment
        label: GRB2/SHC adaptor recruitment to receptor phosphotyrosine
        module_type: REGULATORY_STEP
        description: >-
          SH2-domain adaptors (GRB2 directly, or SHC then GRB2) recognize a
          phosphotyrosine motif on an activated receptor (or receptor-associated
          kinase) and use their SH3 domains to recruit the Ras GEF SOS to the
          membrane. This step couples the upstream receptor to the Ras switch.
        annotons:
          - id: grb2_shc_adaptor
            label: GRB2/SHC adaptor function
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GRB2/SHC adaptor proteins
                description: SH2/SH3 (GRB2) and PTB/SH2 (SHC) adaptors that link receptor phosphotyrosines to SOS.
            function:
              preferred_term: phosphotyrosine residue binding
              term:
                id: GO:0001784
                label: phosphotyrosine residue binding
              description: SH2/PTB recognition of the activated-receptor phosphotyrosine docking site.
            role_description: Bridges the activated receptor to the Ras guanine nucleotide exchange factor.
    - order: 2
      role: Ras nucleotide switch (conforms to gtpase_switch)
      node:
        id: ras_nucleotide_switch
        label: Ras GTPase nucleotide switch (SOS / Ras / RasGAP)
        module_type: REACTION
        description: >-
          The Ras nucleotide switch: the GEF SOS loads GTP onto Ras (HRAS/KRAS/
          NRAS), the GTP-bound GTPase activates RAF, and RasGAPs (e.g. NF1)
          accelerate GTP hydrolysis to switch Ras off. This bundle is an instance
          of the generic GTPase nucleotide switch.
        conforms_to:
          - template: gtpase_switch
            status: EXACT
            notes: >-
              SOS (GEF, GO:0005085) -> Ras (GTPase, GO:0003924), switched off by
              RasGAP/NF1 (GAP, GO:0005096), fills the GEF / active-GTPase / GAP
              tiers with the canonical load/hydrolyze topology.
        concepts:
          - preferred_term: Ras protein signal transduction
            term:
              id: GO:0007265
              label: Ras protein signal transduction
        parts:
          - order: 1
            role: GEF tier (SOS)
            node:
              id: ras_gef_step
              label: SOS guanine nucleotide exchange on Ras
              module_type: REACTION
              description: The recruited GEF SOS1/SOS2 catalyzes GDP-for-GTP exchange on Ras.
              annotons:
                - id: sos_gef
                  label: SOS Ras GEF activity
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: SOS Ras GEFs
                      term:
                        id: PANTHER:PTHR23113
                        label: GUANINE NUCLEOTIDE EXCHANGE FACTOR
                      description: Son-of-sevenless guanine nucleotide exchange factors SOS1/SOS2.
                      representative_members:
                        - preferred_term: SOS1
                          term:
                            id: UniProtKB:Q07889
                            label: Son of sevenless homolog 1
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN000560991
                          term:
                            id: PANTHER:PTN000560991
                            label: PTN000560991
                          description: Local PAINT IBD node in PTHR23113 with propagated terms F:GO:0005085 guanyl-nucleotide exchange factor activity, P:GO:0007265 Ras protein signal transduction; seeded by SOS1 among others.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN000560991 in PTHR23113.
                  function:
                    preferred_term: guanyl-nucleotide exchange factor activity
                    term:
                      id: GO:0005085
                      label: guanyl-nucleotide exchange factor activity
                    targets:
                      - preferred_term: Ras GTPase
                  role_description: Loads GTP onto Ras, activating the switch.
          - order: 2
            role: active GTPase tier (Ras)
            node:
              id: ras_active
              label: Active GTP-bound Ras
              module_type: REACTION
              description: >-
                GTP-bound Ras (HRAS, KRAS, or NRAS) adopts the active conformation
                and recruits/activates RAF kinases; intrinsic and GAP-stimulated
                hydrolysis resets the switch.
              annotons:
                - id: ras_gtpase
                  label: Ras GTPase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: Ras GTPases (HRAS/KRAS/NRAS)
                      term:
                        id: PANTHER:PTHR24070
                        label: RAS, DI-RAS, AND RHEB FAMILY MEMBERS OF SMALL GTPASE SUPERFAMILY
                      description: Classical Ras small GTPases that act as the binary switch of the cascade.
                      representative_members:
                        - preferred_term: KRAS
                          term:
                            id: UniProtKB:P01116
                            label: GTPase KRas
                        - preferred_term: HRAS
                          term:
                            id: UniProtKB:P01112
                            label: GTPase HRas
                        - preferred_term: NRAS
                          term:
                            id: UniProtKB:P01111
                            label: GTPase NRas
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN000631348
                          term:
                            id: PANTHER:PTN000631348
                            label: PTN000631348
                          description: Local PAINT IBD node in PTHR24070 with propagated terms F:GO:0003924 GTPase activity, C:GO:0005886 plasma membrane, P:GO:0007264; seeded by HRAS, KRAS and NRAS among others.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN000631348 in PTHR24070.
                        - preferred_term: PAINT node PTN008604616
                          term:
                            id: PANTHER:PTN008604616
                            label: PTN008604616
                          description: Local PAINT IBD node in PTHR24070 with propagated terms P:GO:0007265 Ras protein signal transduction; seeded by HRAS, KRAS and NRAS.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN008604616 in PTHR24070.
                  function:
                    preferred_term: GTPase activity
                    term:
                      id: GO:0003924
                      label: GTPase activity
                  processes:
                    - preferred_term: Ras protein signal transduction
                      term:
                        id: GO:0007265
                        label: Ras protein signal transduction
                  role_description: Binary molecular switch coupling SOS to RAF.
          - order: 3
            role: GAP tier (RasGAP)
            node:
              id: rasgap_step
              label: RasGAP acceleration of Ras GTP hydrolysis
              module_type: REACTION
              description: RasGAPs (e.g. NF1/neurofibromin, RASA1) stimulate Ras GTP hydrolysis to switch Ras off.
              annotons:
                - id: rasgap_role
                  label: RasGAP function
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: RasGAPs (e.g. NF1, RASA1)
                      term:
                        id: PANTHER:PTHR10194
                        label: RAS GTPASE-ACTIVATING PROTEINS
                      description: GTPase-activating proteins that switch Ras off.
                      representative_members:
                        - preferred_term: NF1 (neurofibromin)
                          term:
                            id: UniProtKB:P21359
                            label: Neurofibromin
                        - preferred_term: RASA1 (p120RasGAP)
                          term:
                            id: UniProtKB:P20936
                            label: Ras GTPase-activating protein 1
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN008939999
                          term:
                            id: PANTHER:PTN008939999
                            label: PTN008939999
                          description: Local PAINT IBD node in PTHR10194 with propagated terms F:GO:0005096 GTPase activator activity, P:GO:1902531; seeded by NF1 and RASA1 among others.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN008939999 in PTHR10194.
                  function:
                    preferred_term: GTPase activator activity
                    term:
                      id: GO:0005096
                      label: GTPase activator activity
                  role_description: Stimulates Ras GTP hydrolysis to switch Ras off.
        connections:
          - source: ras_gef_step
            target: ras_active
            connection_type: CAUSES
            description: SOS loads GTP onto Ras, activating the switch.
          - source: rasgap_step
            target: ras_active
            connection_type: NEGATIVELY_REGULATES
            description: RasGAPs accelerate hydrolysis to switch Ras off.
    - order: 3
      role: ERK kinase relay (conforms to mapk_relay)
      node:
        id: erk_relay
        label: ERK kinase relay (RAF -> MEK -> ERK)
        module_type: REACTION
        description: >-
          The three-tier kinase relay of the ERK cascade: GTP-Ras-activated RAF
          (MAP3K) phosphorylates MEK1/2 (MAP2K), which dually phosphorylates
          ERK1/2 (MAPK) on its TEY activation-loop motif. This bundle is an
          instance of the generic three-tier MAP kinase relay.
        conforms_to:
          - template: mapk_relay
            status: EXACT
            notes: >-
              RAF -> MEK1/2 -> ERK1/2 fills the MAP3K (GO:0004709) -> MAP2K
              (GO:0004708) -> MAPK (GO:0004707) tiers with their canonical
              activating phosphotransfer topology.
        parts:
          - order: 1
            role: MAP3K tier (RAF)
            node:
              id: raf_map3k
              label: RAF MAP kinase kinase kinase activation
              module_type: REACTION
              description: >-
                Active Ras recruits RAF kinases (RAF1/CRAF, BRAF, ARAF) to the
                membrane, where they dimerize and become active MAP3Ks that
                phosphorylate MEK.
              annotons:
                - id: raf_kinase
                  label: RAF MAP3K activity
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: RAF kinases
                      term:
                        id: PANTHER:PTHR44329
                        label: SERINE/THREONINE-PROTEIN KINASE TNNI3K-RELATED
                      description: RAF1/CRAF, BRAF, ARAF serine/threonine MAP3Ks.
                      representative_members:
                        - preferred_term: BRAF
                          term:
                            id: UniProtKB:P15056
                            label: Serine/threonine-protein kinase B-raf
                        - preferred_term: RAF1 (CRAF)
                          term:
                            id: UniProtKB:P04049
                            label: RAF proto-oncogene serine/threonine-protein kinase
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN001147804
                          term:
                            id: PANTHER:PTN001147804
                            label: PTN001147804
                          description: Local PAINT IBD node in PTHR44329 with propagated terms F:GO:0004709 MAP kinase kinase kinase activity, P:GO:0000165 MAPK cascade; seeded by RAF1 and BRAF.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN001147804 in PTHR44329.
                  function:
                    preferred_term: MAP kinase kinase kinase activity
                    term:
                      id: GO:0004709
                      label: MAP kinase kinase kinase activity
                    targets:
                      - preferred_term: MEK1/MEK2
                  role_description: Top kinase tier; phosphorylates and activates MEK.
          - order: 2
            role: MAP2K tier (MEK)
            node:
              id: mek_map2k
              label: MEK1/MEK2 MAP kinase kinase activation
              module_type: REACTION
              description: >-
                RAF phosphorylates the dual-specificity MAP2Ks MEK1 (MAP2K1) and
                MEK2 (MAP2K2), which in turn phosphorylate ERK on both threonine
                and tyrosine of its activation-loop TEY motif.
              annotons:
                - id: mek_kinase
                  label: MEK MAP2K activity
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: MEK1/MEK2 (MAP2K1/MAP2K2)
                      term:
                        id: PANTHER:PTHR48013
                        label: DUAL SPECIFICITY MITOGEN-ACTIVATED PROTEIN KINASE KINASE 5-RELATED
                      description: Dual-specificity MAP kinase kinases dedicated to the ERK tier.
                      representative_members:
                        - preferred_term: MEK1 (MAP2K1)
                          term:
                            id: UniProtKB:Q02750
                            label: Dual specificity mitogen-activated protein kinase kinase 1
                        - preferred_term: MEK2 (MAP2K2)
                          term:
                            id: UniProtKB:P36507
                            label: Dual specificity mitogen-activated protein kinase kinase 2
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN000684494
                          term:
                            id: PANTHER:PTN000684494
                            label: PTN000684494
                          description: Local PAINT IBD node in PTHR48013 with propagated terms F:GO:0004708 MAP kinase kinase activity, P:GO:0000165 MAPK cascade; seeded by MEK1 and MEK2 among others.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN000684494 in PTHR48013.
                  function:
                    preferred_term: MAP kinase kinase activity
                    term:
                      id: GO:0004708
                      label: MAP kinase kinase activity
                    targets:
                      - preferred_term: ERK1/ERK2 TEY motif
                  role_description: Middle kinase tier; dual-specificity activation of ERK.
          - order: 3
            role: MAPK tier (ERK)
            node:
              id: erk_mapk
              label: ERK1/ERK2 MAP kinase activation
              module_type: REACTION
              description: >-
                Dually phosphorylated ERK1 (MAPK3) and ERK2 (MAPK1) become active
                proline-directed serine/threonine kinases, dimerize, and act on
                cytoplasmic and (after nuclear translocation) nuclear substrates.
              annotons:
                - id: erk_kinase
                  label: ERK1/ERK2 MAP kinase activity
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: ERK1/ERK2 (MAPK3/MAPK1)
                      term:
                        id: PANTHER:PTHR24055
                        label: MITOGEN-ACTIVATED PROTEIN KINASE
                      description: The terminal effector kinases of the classical MAPK cascade.
                      representative_members:
                        - preferred_term: ERK2 (MAPK1)
                          term:
                            id: UniProtKB:P28482
                            label: Mitogen-activated protein kinase 1
                        - preferred_term: ERK1 (MAPK3)
                          term:
                            id: UniProtKB:P27361
                            label: Mitogen-activated protein kinase 3
                      ancestral_nodes:
                        - preferred_term: PAINT node PTN000622075
                          term:
                            id: PANTHER:PTN000622075
                            label: PTN000622075
                          description: Local PAINT IBD node in PTHR24055 with propagated terms F:GO:0004674, P:GO:0035556, C:GO:0005634, C:GO:0005737; seeded by ERK1 and ERK2 among the MAPK family.
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN000622075 in PTHR24055.
                  function:
                    preferred_term: MAP kinase activity
                    term:
                      id: GO:0004707
                      label: MAP kinase activity
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Effector kinase that transduces the cascade output to substrates.
        connections:
          - source: raf_map3k
            target: mek_map2k
            connection_type: CAUSES
            description: RAF phosphorylates and activates MEK1/2.
          - source: mek_map2k
            target: erk_mapk
            connection_type: CAUSES
            description: MEK dually phosphorylates ERK1/2.
    - order: 4
      role: ERK transcriptional and effector output
      node:
        id: erk_output
        label: ERK effector and transcriptional output
        module_type: REGULATORY_STEP
        description: >-
          Active ERK phosphorylates nuclear transcription factors and kinases
          (ELK1 and other Ets factors, RSK, MSK) and numerous cytoplasmic
          substrates, driving immediate-early gene transcription, cell-cycle
          entry, proliferation, and differentiation.
        annotons:
          - id: erk_substrate_output
            label: ERK substrate phosphorylation and transcriptional activation
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: MAP kinase activity
                term:
                  id: GO:0004707
                  label: MAP kinase activity
            processes:
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
            role_description: Converts ERK activity into a proliferation/differentiation gene program.
          - id: rsk_kinase
            label: RSK (p90 ribosomal S6 kinase) effector activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RSK (p90 ribosomal S6 kinases, RPS6KA1-3/6)
                description: >-
                  ERK-activated AGC kinases that carry part of the ERK output
                  (CREB/SRF-family and translational substrates) and feed back
                  onto SOS1.
                representative_members:
                  - preferred_term: RPS6KA1 (RSK1)
                    term:
                      id: UniProtKB:Q15418
                      label: Ribosomal protein S6 kinase alpha-1
                  - preferred_term: RPS6KA3 (RSK2)
                    term:
                      id: UniProtKB:P51812
                      label: Ribosomal protein S6 kinase alpha-3
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: SOS1 C-terminal serines (Ser1134/Ser1161)
                  term:
                    id: UniProtKB:Q07889
                    label: Son of sevenless homolog 1
            role_description: >-
              The ERK substrate kinase whose phosphorylation of SOS1 is the
              actor behind the erk_output -| ras_gef_step feedback connection.
    - order: 5
      role: DUSP/MKP negative feedback on ERK
      node:
        id: mapk_negative_regulation
        label: DUSP/MKP dephosphorylation of ERK
        module_type: REACTION
        description: >-
          DUSP/MKP dual-specificity phosphatases dephosphorylate the ERK
          activation loop to terminate signaling. MKP-1/MKP-2 (DUSP1/DUSP4) are
          immediate-early products of the ERK transcriptional program itself, so
          this step is both a basal input and an ERK-induced negative feedback
          (closed by the erk_output -> mapk_negative_regulation connection).
          RasGAP-mediated switch-off of Ras is captured inside the Ras nucleotide
          switch bundle.
        annotons:
          - id: dusp_role
            label: DUSP/MKP phosphatase function
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DUSP/MKP dual-specificity phosphatases
                description: >-
                  ERK-inactivating dual-specificity (Thr/Tyr) MAP kinase phosphatases. The
                  cytoplasmic ERK-selective member DUSP6 (MKP-3) is the representative; it is induced
                  by FGF/ERK signalling and allosterically activated by binding ERK.
                term:
                  id: PANTHER:PTHR10159
                  label: DUAL SPECIFICITY PROTEIN PHOSPHATASE
                representative_members:
                  - preferred_term: DUSP6
                    term:
                      id: UniProtKB:Q16828
                      label: Dual specificity protein phosphatase 6
            function:
              preferred_term: MAP kinase tyrosine/serine/threonine phosphatase activity
              term:
                id: GO:0017017
                label: MAP kinase tyrosine/serine/threonine phosphatase activity
            processes:
              - preferred_term: negative regulation of ERK1 and ERK2 cascade
                term:
                  id: GO:0070373
                  label: negative regulation of ERK1 and ERK2 cascade
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: Dephosphorylates the ERK activation loop to terminate signaling.
            evidence:
              - source_id: PMID:8670865
                supporting_text: Like CL100/ MKP-1, Pyst1 dephosphorylates and inactivates MAP kinase
                  in vitro and in vivo.
              - source_id: file:genes/human/DUSP6/DUSP6-ai-review.yaml
                statement: DUSP6 (Pyst1/MKP-3) review core functions MAP kinase
                  tyrosine/serine/threonine phosphatase activity (GO:0017017) and MAP kinase binding in
                  negative regulation of the ERK1/2 cascade (GO:0070373).
    - order: 6
      role: Sprouty/SPRED negative feedback on Ras-RAF
      optional: true
      node:
        id: sprouty_spred_feedback
        label: Sprouty/SPRED feedback inhibition of Ras-RAF activation
        module_type: REGULATORY_STEP
        description: >-
          Sprouty (SPRY1, SPRY2, SPRY4) and SPRED (SPRED1, SPRED2) proteins damp signalling into
          the ERK relay, mostly at the level of SOS-Ras-RAF. Sprouty expression is induced by
          ERK signalling, closing a negative-feedback loop. The paralogs reach the same outcome by
          different molecular routes, so each mechanism is its own variant with its own molecular
          function rather than one shared activity.
        variant_sets:
          - id: sprouty_spred_mechanisms
            label: Sprouty/SPRED paralogs and their mechanisms
            axis: paralog
            selection: ONE_OR_MORE
            notes: >-
              Union over the Sprouty (PTHR12365) and SPRED (PTHR11202) families. Variants are split
              by mechanism. SPRY2 also binds CBL (with CIN85) and blocks EGFR ubiquitination, which
              sustains EGFR signalling; that opposite-sign activity is recorded in the SPRY2 review
              and is not part of this feedback step.
            variants:
              - id: spry_grb2_variant
                label: Sprouty GRB2 sequestration (SPRY2)
                module_type: REGULATORY_STEP
                description: >-
                  SPRY2 binds the GRB2 SH3 domain through a C-terminal PXXPXR motif that no other
                  Sprouty paralog has, keeping GRB2-SOS from docking on FRS2 or SHP2. Whether this
                  binding is required for ERK inhibition is contested (Lao 2007 versus Martinez
                  2007). SPRY1 lacks the motif; a reported phospho-Tyr53-dependent SPRY1-GRB2
                  interaction is disputed and is not modelled here.
                annotons:
                  - id: spry_grb2_sequestration
                    label: Sprouty GRB2 sequestering activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: SPRY2 orthologs
                        term:
                          id: PANTHER:PTHR12365:SF8
                          label: PROTEIN SPROUTY HOMOLOG 2
                        representative_members:
                          - preferred_term: SPRY2
                            term:
                              id: UniProtKB:O43597
                              label: Protein sprouty homolog 2
                    function:
                      preferred_term: protein sequestering activity
                      term:
                        id: GO:0140311
                        label: protein sequestering activity
                    processes:
                      - preferred_term: negative regulation of Ras protein signal transduction
                        term:
                          id: GO:0046580
                          label: negative regulation of Ras protein signal transduction
                      - preferred_term: negative regulation of ERK1 and ERK2 cascade
                        term:
                          id: GO:0070373
                          label: negative regulation of ERK1 and ERK2 cascade
                    role_description: Holds GRB2 away from FRS2 and SHP2 so SOS is not recruited.
                    evidence:
                      - source_id: PMID:12402043
                        supporting_text: Next, they bind to the adaptor protein Grb2 and inhibit the recruitment of the Grb2-Sos complex either to the fibroblast growth factor receptor (FGFR) docking adaptor protein FRS2 or to Shp2.
                      - source_id: PMID:16893902
                        supporting_text: Spry2 is considerably more inhibitory than Spry1 or Spry4, and this correlates with the binding to Grb2 via a C-terminal proline-rich sequence that is found exclusively on Spry2.
                      - source_id: file:genes/human/SPRY2/SPRY2-ai-review.yaml
                        statement: SPRY2 review core functions GRB2 sequestering activity (GO:0140311) and RAF antagonism (GO:0004860).
              - id: spry_raf_variant
                label: Sprouty kinase inhibition (SPRY1, SPRY2, SPRY4)
                module_type: REGULATORY_STEP
                description: >-
                  SPRY4 binds RAF1 through its C-terminal cysteine-rich Sprouty domain and blocks
                  Ras-independent RAF1 activation (e.g. by VEGF); it does not block EGF-induced,
                  Ras-dependent RAF1 activation. SPRY4 lacks the SPRY2-specific C-terminal PxxPxR
                  GRB2 SH3-binding motif. The same cysteine-rich domain directly inhibits the kinase
                  TESK1. SPRY1 and SPRY2 carry the same inherited protein kinase inhibitor
                  activity (PAINT family node), with SPRY4 as the experimentally characterized
                  member.
                annotons:
                  - id: spry_raf_inhibition
                    label: Sprouty RAF kinase inhibition
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Sprouty paralogs
                        term:
                          id: PANTHER:PTHR12365
                          label: SPROUTY
                        representative_members:
                          - preferred_term: SPRY1
                            term:
                              id: UniProtKB:O43609
                              label: Protein sprouty homolog 1
                          - preferred_term: SPRY2
                            term:
                              id: UniProtKB:O43597
                              label: Protein sprouty homolog 2
                          - preferred_term: SPRY4
                            term:
                              id: UniProtKB:Q9C004
                              label: Protein sprouty homolog 4
                    function:
                      preferred_term: protein kinase inhibitor activity
                      term:
                        id: GO:0004860
                        label: protein kinase inhibitor activity
                    processes:
                      - preferred_term: negative regulation of Ras protein signal transduction
                        term:
                          id: GO:0046580
                          label: negative regulation of Ras protein signal transduction
                      - preferred_term: negative regulation of ERK1 and ERK2 cascade
                        term:
                          id: GO:0070373
                          label: negative regulation of ERK1 and ERK2 cascade
                    role_description: Binds RAF1 and prevents its activation.
                    evidence:
                      - source_id: PMID:12717443
                        supporting_text: Mammalian Sprouty4 suppresses Ras-independent ERK activation by binding to Raf1.
                      - source_id: file:genes/human/SPRY1/SPRY1-ai-review.yaml
                        statement: SPRY1 review core function protein kinase inhibitor activity (GO:0004860, inherited family IBA); a GRB2-sequestering activity was not supported after an OpenScientist motif analysis.
                      - source_id: file:genes/human/SPRY4/SPRY4-ai-review.yaml
                        statement: SPRY4 review core function protein kinase inhibitor activity (GO:0004860) in negative regulation of ERK1/2, FGFR and Ras signalling.
              - id: spred_nf1_variant
                label: SPRED neurofibromin recruitment (SPRED1, SPRED2)
                module_type: REGULATORY_STEP
                description: >-
                  SPRED proteins bind the Ras GAP neurofibromin (NF1) through their EVH1 domain
                  and use their membrane-anchored SPR domain to bring it to the plasma membrane,
                  where NF1 converts Ras-GTP to Ras-GDP. SPRED has no catalytic activity; the GAP
                  step itself sits in the Ras nucleotide switch. Sprouty proteins lack the EVH1
                  domain and do not bind neurofibromin.
                annotons:
                  - id: spred_nf1_recruitment
                    label: SPRED neurofibromin membrane recruitment
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: SPRED paralogs
                        term:
                          id: PANTHER:PTHR11202
                          label: SPROUTY-RELATED, EVH1 DOMAIN-CONTAINING PROTEIN FAMILY MEMBER
                        representative_members:
                          - preferred_term: SPRED1
                            term:
                              id: UniProtKB:Q7Z699
                              label: Sprouty-related, EVH1 domain-containing protein 1
                          - preferred_term: SPRED2
                            term:
                              id: UniProtKB:Q7Z698
                              label: Sprouty-related, EVH1 domain-containing protein 2
                    function:
                      preferred_term: protein-membrane adaptor activity
                      term:
                        id: GO:0043495
                        label: protein-membrane adaptor activity
                    processes:
                      - preferred_term: negative regulation of Ras protein signal transduction
                        term:
                          id: GO:0046580
                          label: negative regulation of Ras protein signal transduction
                      - preferred_term: negative regulation of ERK1 and ERK2 cascade
                        term:
                          id: GO:0070373
                          label: negative regulation of ERK1 and ERK2 cascade
                    role_description: Recruits neurofibromin to the plasma membrane to switch Ras off.
                    evidence:
                      - source_id: PMID:22751498
                        supporting_text: However, Sprouty proteins, which lack the N-terminal EVH1 domain, did not coprecipitate neurofibromin.
                      - source_id: file:genes/human/SPRED1/SPRED1-ai-review.yaml
                        statement: SPRED1 review core function protein-membrane adaptor activity (GO:0043495, NEW) recruiting NF1, supported by the SPRED1 EVH1-NF1-KRAS structure; Legius syndrome EVH1 variants lose NF1 binding.
                      - source_id: file:genes/human/SPRED2/SPRED2-ai-review.yaml
                        statement: SPRED2 review core function protein-membrane adaptor activity (GO:0043495) recruiting NF1 to the membrane.
  connections:
    - source: adaptor_recruitment
      target: ras_nucleotide_switch
      connection_type: PROVIDES_INPUT_FOR
      description: Adaptors recruit the Ras GEF SOS to the membrane.
    - source: ras_nucleotide_switch
