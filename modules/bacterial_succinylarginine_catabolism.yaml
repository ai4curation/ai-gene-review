id: MODULE:bacterial_succinylarginine_catabolism
title: Bacterial succinylarginine catabolism to glutamate and succinate
description: >-
  A five-reaction bacterial pathway that transfers a succinyl group from
  succinyl-CoA to L-arginine, hydrolyzes the guanidino group, transaminates the
  resulting N-succinyl-L-ornithine, oxidizes the semialdehyde, and removes the
  succinyl group to produce L-glutamate and succinate. The initiating
  transferase may be a single-chain enzyme or a two-chain complex. Arginine
  transport, regulation, alternative arginine-catabolic routes, and downstream
  central metabolism are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:2865249
  title: Occurrence of succinyl derivatives in the catabolism of arginine in Pseudomonas cepacia.
  statement: Defines the ordered five-reaction pathway from arginine through succinylated intermediates to glutamate and succinate.
- source_id: PMID:7523119
  title: Purification and properties of a succinyltransferase from Pseudomonas aeruginosa specific for both arginine and ornithine.
  statement: Establishes a two-chain heterotetrameric Pseudomonas implementation of the initiating transferase.
- source_id: PMID:9393691
  title: Cloning and characterization of the aru genes encoding enzymes of the catabolic arginine succinyltransferase pathway in Pseudomonas aeruginosa.
  statement: Assigns the two AstA chains and the four downstream enzyme roles in a Pseudomonas AST pathway.
- source_id: PMID:23484010
  title: Determination of the structure of the catabolic N-succinylornithine transaminase (AstC) from Escherichia coli.
  statement: Establishes the PLP-dependent AstC reaction with succinylornithine and 2-oxoglutarate.
- source_id: file:PSEPK/argD/argD-deep-research-openscientist.md
  title: OpenScientist synthesis for PSEPK PP_4481 acyl-ornithine aminotransferase
  statement: >-
    Integrates KT2440 locus context, PANTHER subfamily placement, and comparative
    literature to identify PP_4481 as the pathway's AstC-like transaminase while
    retaining secondary acetylornithine activity as plausible.
notes: >-
  The module is species-neutral. Pseudomonas putida KT2440 proteins are included
  as concrete representatives, not as a restriction on taxonomic scope. Exact
  UniProt identities and PANTHER assignments were checked against current
  UniProt records. GOA WITH/FROM values PTN002279553 (P59319) and PTN002309601
  (Q88EI7) were verified as the sources of broad PLP/self-binding and
  amide-hydrolase annotations, respectively. They are not used as ancestral
  nodes because the available evidence does not establish the exact
  substrate-specific AstC or AstE function at those nodes.
  InterPro IPR017651 and IPR017650, corroborated by NCBIfam TIGR03245 and
  TIGR03244, distinguish the alpha-like and beta-like components of split AstA,
  respectively; PANTHER PTHR30420:SF1 groups both chain types with single-chain
  AstA and therefore does not discriminate the architecture. The AstD selector
  uses broad PTHR11699 because the checked Q88EI4 and P76217 member records have
  no populated PANTHER subfamily.
