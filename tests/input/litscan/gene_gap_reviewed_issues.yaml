- issue: 7138
  closed_gap: false
  paper:
    abstract: Mitochondrial homeostasis supports sperm motility and fertilization, but the genetic factors
      linking mitochondrial dysfunction to human infertility remain incompletely defined. Here, we investigated
      the role of MORN5, a previously uncharacterized member of the membrane occupation and recognition
      nexus (MORN) family, in the regulation of sperm mitochondrial homeostasis. Whole-exome sequencing
      of men with idiopathic infertility identified rare MORN5 variants, including a frameshift variant
      absent from fertile controls that reduces protein stability. Two independent Morn5 knockout (KO)
      mouse lines exhibited male infertility. Detailed analyses, mainly using the Morn5-5bp line, demonstrated
      the reduced sperm count and motility, mitochondrial sheath defects, decreased membrane potential
      and ATP, increased mitochondrial oxidative stress and sperm DNA fragmentation, and reduced electron
      transport chain complex II/III activities upon Morn5 deficiency. Heterozygous males showed intermediate
      defects, consistent with the dosage-sensitive MORN5 function. MORN5 was enriched in mitochondrial
      fractions and associated with respiratory-chain and mitochondrial quality-control proteins. Transcriptomic,
      single-cell transcriptomic, and proteomic analyses further revealed the altered oxidative phosphorylation,
      electron transport, and autophagy/mitophagy-related signaling in KO testes. Although KO sperm failed
      to support fertilization and preimplantation development in conventional in vitro fertilization,
      they retained developmental competence after intracytoplasmic sperm injection, suggesting that MORN5
      loss primarily compromises sperm functional competence required for fertilization. These findings
      establish MORN5 as a previously unrecognized regulator of sperm mitochondrial homeostasis and male
      fertility.
    doi: 10.1093/jmcb/mjag050
