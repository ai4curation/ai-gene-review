- issue: 7139
  closed_gap: false
  paper:
    abstract: Brain injury after cardiac arrest and cardiopulmonary resuscitation (CA-CPR) is a major
      cause of poor neurological outcomes among survivors, yet effective mechanism-based interventions
      remain lacking. Mitophagy maintains mitochondrial homeostasis, but whether increased mitophagy contributes
      to brain injury after CA-CPR and which upstream factors regulate it remain unclear. Transcriptomic
      analysis of hippocampal tissue from rats subjected to asphyxial CA-CPR identified tribbles pseudokinase
      3 (TRIB3) as one of the most strongly upregulated genes, with its expression approximately 68-fold
      higher than that in sham controls. TRIB3 was knocked down by adeno-associated virus (AAV) injection
      into the hippocampal CA1 region 4 weeks before CA-CPR and by lentiviral transduction in H19-7 cells
      before oxygen-glucose deprivation/reoxygenation (OGD/R). TRIB3 knockdown improved neurological function
      and attenuated hippocampal CA1 neuronal injury in CA-CPR rats. It also attenuated mitophagy, alleviated
      mitochondrial dysfunction, and reduced neuronal apoptosis in vivo and in vitro. Valproic acid partially
      counteracted these mitochondrial and anti-apoptotic effects in vitro. Mechanistic analyses in OGD/R-treated
      cells showed that TRIB3 knockdown increased the p-AKT/AKT and p-FOXO3a/FOXO3a ratios, reduced FOXO3a
      nuclear accumulation and BNIP3 expression, and decreased FOXO3a enrichment at the Bnip3 promoter.
      Co-immunoprecipitation assays showed increased TRIB3-AKT association and reduced AKT-FOXO3a association
      after OGD/R. In vivo, TIC10 treatment partially counteracted the improvements in mitochondrial function
      and neurological outcomes following TRIB3 knockdown. Together, these findings suggest that TRIB3
      may act as a previously unrecognized upstream modulator of mitophagy after CA-CPR, implicate AKT-FOXO3a-BNIP3
      signaling, and support further evaluation of TRIB3 as a potential neuroprotective target.
    doi: 10.1007/s11064-026-04956-8
