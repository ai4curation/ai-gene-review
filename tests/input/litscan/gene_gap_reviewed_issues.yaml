- issue: 7140
  closed_gap: false
  paper:
    abstract: Identifying upstream regulators of the STING pathway is critical for advancing cancer immunotherapy.
      Although pescadillo ribosomal biogenesis factor 1 (PES1) is overexpressed in multiple cancer types,
      its immunoregulatory role within the tumor microenvironment remains poorly characterized. Here,
      we show that tumor-cell PES1 knockdown is sufficient to induce an antitumor immune phenotype in
      mice, characterized by enhanced CD8 + T-cell infiltration. We further define a cell-intrinsic mechanism
      by which PES1 promotes immune evasion. PES1 loss upregulates interferon (IFN)-stimulated genes in
      tumor cells, and this transcriptional program is attenuated by STING knockdown, indicating that
      the PES1-IFN signature and immune activation are dependent on STING signaling. Mechanistically,
      PES1 interacts with the RNA helicase DDX21, and PES1 depletion impairs DDX21 recruitment to R-loops.
      This defect is accompanied by the accumulation of R-loops and RNA-DNA hybrids, which trigger STING-dependent
      type I IFN production. More importantly, depletion of PES1 sensitizes melanoma to anti-PD-1 therapy,
      resulting in significantly improved responses to immune checkpoint blockade (ICB). These findings
      reveal a previously unrecognized function of PES1 as a negative regulator of innate immune sensing
      in cancer. Targeting PES1 may provide an upstream strategy for engaging the cGAS-STING axis and
      overcoming resistance to ICB.
    doi: 10.1016/j.canlet.2026.219008
