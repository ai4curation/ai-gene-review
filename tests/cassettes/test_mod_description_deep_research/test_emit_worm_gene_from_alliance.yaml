        encodes a small GTPase homologous to the Rab GTPases that function in endocytosis,
        membrane fusion, and vesicular trafficking events; RAB-11.1 activity is required
        for completion of the final stages of cytokinesis during early embryogenesis
        and for efficient uptake of yolk proteins during oocyte development; RAB-11.1
        is also required for normal peripheral localization of nuclei in the synctial
        germ cell in the ovary and for regulated secretion of CAV-1-containing cortical
        granules following fertilization; RAB-11.1 localizes to recycling endosomes
        and to cortical granules.","noteType":{"name":"MOD_provided_gene_description"}},{"freeText":"Predicted
        to enable GTP binding activity and GTPase activity. Involved in several processes,
        including eggshell formation; membrane addition at site of mitotic cytokinesis;
        and vesicle-mediated transport. Located in Golgi trans cisterna membrane;
        cortical granule; and recycling endosome. Expressed in gonad. Is an ortholog
        of human RAB11B (RAB11B, member RAS oncogene family).","noteType":{"name":"MOD_provided_automated_gene_description"}},{"freeText":"Predicted
