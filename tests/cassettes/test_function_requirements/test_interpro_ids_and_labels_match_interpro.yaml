        domain","type":"Domain","children":[{"accession":"IPR005702","name":"Tyrosine-protein
        kinase Wzc-like, C-terminal domain","type":"Domain","children":[]}]},"name":{"name":"Tyrosine-protein
        kinase Wzc-like, C-terminal domain","short":"Wzc-like_C"},"description":[{"text":"<p>This
        entry represents the C-terminal domain of Tyrosine-protein kinase wzc from
        Escherichia coli and similar bacterial sequences. Wzc in required for the
        extracellular polysaccharide colanic acid synthesis. It is probably involved
        in the export of colanic acid from the cell to medium [[cite:PUB00104565]].
        This domain covers the whole length of the protein in Tyrosine-protein kinase
        CpsD from Streptococcus agalactiae, which is involved in the regulation of
        capsular polysaccharide biosynthesis [[cite:PUB00106862]].</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Wzc
        is an integral cytoplasmic membrane protein that belonds to the bacterial
        tyrosine kinase (BY-kinase) family. This enzyme is essential for extracellular
        polysaccharide colanic acid synthesis and export in Escherichia coli. The
        protein undergoes autophosphorylation at multiple tyrosine residues through
        a cooperative two-step mechanism involving both intra- and intermolecular
        phosphorylation events. Paradoxically, whilst the autophosphorylated form
        is required for colanic acid assembly, it is inactive for its actual production.
        The enzyme phosphorylates UDP-glucose dehydrogenase (Ugd), stimulating its
        activity and connecting colanic acid biosynthesis with polymer export from
        the cell to the medium. Wzc functions as a master regulator of polysaccharide
        assembly through the formation and dissociation of octameric complexes, driven
        by changes in the phosphorylation status of its C-terminal tyrosine-rich tail.
        [[cite:PUB00104565]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00104565":{"PMID":12851388,"ISBN":null,"volume":"278","issue":"41","year":2003,"title":"Autophosphorylation
