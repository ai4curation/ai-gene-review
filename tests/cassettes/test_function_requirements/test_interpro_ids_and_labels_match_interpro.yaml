        M","Sun JL","Olson CA","Weinman O","Trester-Zedlitz ML","Darst SA."],"DOI_URL":"http://dx.doi.org/10.1016/S1097-2765(02)00470-7"},"PUB00011848":{"PMID":11955433,"ISBN":null,"volume":"108","issue":"6","year":2002,"title":"Crystal
        structure of the Bacillus stearothermophilus anti-sigma factor SpoIIAB with
