        and specific channels of bacterial outer membranes.\",\"URL\":null,\"raw_pages\":\"435-42\",\"medline_journal\":\"Mol
        Microbiol\",\"ISO_journal\":\"Mol. Microbiol.\",\"authors\":[\"Nikaido H.\"],\"DOI_URL\":\"http://dx.doi.org/10.1111/j.1365-2958.1992.tb01487.x\"},\"PUB00005073\":{\"PMID\":2178269,\"ISBN\":null,\"volume\":\"23\",\"issue\":\"4\",\"year\":1990,\"title\":\"Biophysics
        of the structure and function of porins.\",\"URL\":null,\"raw_pages\":\"367-403\",\"medline_journal\":\"Q
        Rev Biophys\",\"ISO_journal\":\"Q. Rev. Biophys.\",\"authors\":[\"Jap BK\",\"Walian
        PJ.\"],\"DOI_URL\":null},\"PUB00003475\":{\"PMID\":1725488,\"ISBN\":null,\"volume\":\"107\",\"issue\":\"2\",\"year\":1991,\"title\":\"A
        common channel-forming motif in evolutionarily distant porins.\",\"URL\":null,\"raw_pages\":\"136-45\",\"medline_journal\":\"J
        Struct Biol\",\"ISO_journal\":\"J. Struct. Biol.\",\"authors\":[\"Pauptit
