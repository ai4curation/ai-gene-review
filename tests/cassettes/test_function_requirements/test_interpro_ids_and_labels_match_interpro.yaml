        carboxylation domain","type":"Domain","children":[]},"name":{"name":"Biotin
        carboxylation domain","short":"Biotin_carboxylation_dom"},"description":[{"text":"<p>Biotin-dependent
        carboxylase enzymes perform a two step reaction. Enzyme-bound biotin is first
        carboxylated by bicarbonated and ATP and the carboxyl group temporarily bound
        to biotin is subsequently transferred to an acceptor substrate such as pyruvate
        or acetyl-CoA. The first step is mediated by the BC domain common to all biotin-dependent
        carboxylases [[cite:PUB00015350]]. The BC domain can be divided in three subdomains
        (N-terminal, central and C-terminal). The N-terminal region provides part
        of the active site; the central region corresponds to the ATP-grasp domain,
        which is common to many ATP-dependent enzymes involved in macromolecular synthesis
        [[cite:PUB00015348]]. The ATP-grasp module directly binds the ATP molecule.
        The C-terminal subdomain is involved in dimer formation.</p>\n\n<p>Several
        structure of the BC domain have been solved [[cite:PUB00015349], [cite:PUB00014226]].
        The central module is splayed significantly away from the main body of the
        domain and is able to rotate of approximately 45 degree upon nucleotide binding
        thereby closing off the active site pocket [[cite:PUB00014226]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00015348":{"PMID":8564538,"ISBN":null,"volume":"3","issue":"2","year":1996,"title":"Biotin
