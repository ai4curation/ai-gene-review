    body:
      string: "{\"metadata\":{\"accession\":\"IPR010919\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:3.10.390.10\":\"SAND
        domain-like\"},\"ssf\":{\"SSF63763\":\"SAND domain-like\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR010919\",\"name\":\"SAND-like
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"SAND-like
        domain superfamily\",\"short\":\"SAND-like_dom_sf\"},\"description\":[{\"text\":\"<p>The
        SAND domain (named after Sp100, AIRE-1, NucP41/75, DEAF-1) is a conserved
        ~80 residue region found in a number of nuclear proteins, many of which function
        in chromatin-dependent transcriptional control. These include proteins linked
        to various human diseases, such as the Sp100 (Speckled protein 100kDa), NUDR
        (Nuclear DEAF-1 related), GMEB (Glucocorticoid Modulatory Element Binding)
        proteins and AIRE-1 (Autoimmune regulator 1) proteins.</p>\\n\\n<p>Proteins
        containing the SAND domain have a modular structure; the SAND domain can be
        associated with a number of other modules, including the bromodomain, the
        PHD finger and the MYND finger. Because no SAND domain has been found in yeast,
        it is thought that the SAND domain could be restricted to animal phyla. Many
        SAND domain-containing proteins, including NUDR, DEAF-1 (Deformed epidermal
        autoregulatory factor-1) and GMEB, have been shown to bind DNA sequences specifically.
        The SAND domain has been proposed to mediate the DNA binding activity of these
        proteins [[cite:PUB00005483], [cite:PUB00007101]]. Structurally, the SAND
        domain consists of a novel \u03B1/\u03B2 fold, which has a core of three short
        helices packed against a barrel-like \u03B2-sheet; it is structurally similar
        to the SH3-like fold.</p>\\n\\n<p>Other proteins display domains that are
        structurally similar to the SAND domain. One such example is the SMAD4-binding
        domain of the oncoprotein Ski, which is stabilised by a bound zinc atom, and
        resembles a SAND domain, in which the corresponding I loop is responsible
        for DNA binding. Ski is able to disrupt the formation of a functional complex
        between the Co- and R-SMADs, leading to the repression of TGF-beta, Activin
        and BMP responses, resulting in the repression of TGF-signalling [[cite:PUB00013959]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00005483\":{\"PMID\":9697411,\"ISBN\":null,\"volume\":\"23\",\"issue\":\"7\",\"year\":1998,\"title\":\"The
        APECED polyglandular autoimmune syndrome protein, AIRE-1, contains the SAND
        domain and is probably a transcription factor.\",\"URL\":null,\"raw_pages\":\"242-4\",\"medline_journal\":\"Trends
        Biochem Sci\",\"ISO_journal\":\"Trends Biochem. Sci.\",\"authors\":[\"Gibson
        TJ\",\"Ramu C\",\"Gemund C\",\"Aasland R.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0968-0004(98)01231-6\"},\"PUB00007101\":{\"PMID\":11427895,\"ISBN\":null,\"volume\":\"8\",\"issue\":\"7\",\"year\":2001,\"title\":\"The
        SAND domain structure defines a novel DNA-binding fold in transcriptional
        regulation.\",\"URL\":null,\"raw_pages\":\"626-33\",\"medline_journal\":\"Nat
        Struct Biol\",\"ISO_journal\":\"Nat. Struct. Biol.\",\"authors\":[\"Bottomley
        MJ\",\"Collard MW\",\"Huggenvik JI\",\"Liu Z\",\"Gibson TJ\",\"Sattler M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/89675\"},\"PUB00013959\":{\"PMID\":12419246,\"ISBN\":null,\"volume\":\"111\",\"issue\":\"3\",\"year\":2002,\"title\":\"Structural
        mechanism of Smad4 recognition by the nuclear oncoprotein Ski: insights on
        Ski-mediated repression of TGF-beta signaling.\",\"URL\":null,\"raw_pages\":\"357-67\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Wu
        JW\",\"Krawitz AR\",\"Chai J\",\"Li W\",\"Zhang F\",\"Luo K\",\"Shi Y.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0092-8674(02)01006-1\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR014890\",\"name\":\"c-SKI
        SMAD4-binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR000770\",\"name\":\"SAND
        domain\",\"type\":\"domain\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":0,\"interactions\":0,\"matches\":12518,\"pathways\":6,\"proteins\":11909,\"proteomes\":1565,\"sets\":0,\"structural_models\":{\"alphafold\":9910},\"structures\":7,\"taxa\":5014},\"entry_annotations\":{},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"1oqj\",\"name\":\"Crystal
        structure of the SAND domain from glucocorticoid modulatory element binding
        protein-1 (GMEB1)\"}}}"
