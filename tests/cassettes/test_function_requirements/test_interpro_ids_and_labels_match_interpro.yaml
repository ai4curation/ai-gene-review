        protein 1, zeta subunit","type":"Family","children":[]}]},{"accession":"IPR028790","name":"Molecular
        chaperone MKKS","type":"Family","children":[]},{"accession":"IPR042984","name":"Chaperonin-containing
        T-complex member BBS12","type":"Family","children":[]}]},"name":{"name":"Chaperonin
        Cpn60/GroEL/TCP-1 family","short":"Cpn60/GroEL/TCP-1"},"description":[{"text":"<p>The
        assembly of proteins has been thought to be the sole result of properties
        inherent in the primary sequence of polypeptides themselves. In some cases,
        however, structural information from other protein molecules is required for
        correct folding and subsequent assembly into oligomers [[cite:PUB00004022]].
        These ''helper'' molecules are referred to as molecular chaperones, a subfamily
        of which are the chaperonins [[cite:PUB00004550]], which include 10kDa and
        60kDa proteins. These are found in abundance in prokaryotes, chloroplasts
        and mitochondria. They are required for normal cell growth (as demonstrated
        by the fact that no temperature sensitive mutants for the chaperonin genes
        can be found in the temperature range 20 to 43 degrees centigrade [[cite:PUB00004022]]),
        and are stress-induced, acting to stabilise or protect disassembled polypeptides
        under heat-shock conditions [[cite:PUB00004550]].</p>\n\n<p>The 10kDa chaperonin
        (Cpn10) and its bacterial homologue groES, exist as a ring-shaped oligomer
        of between 6 to 8 identical subunits, whereas the 60kDa chaperonin (Cpn60)
        and its bacterial homologue groEL, form a structure comprising 2 stacked rings,
        each ring containing 7 identical subunits [[cite:PUB00004022]]. These ring
        structures assemble by self-stimulation in the presence of Mg2+-ATP. The Cpn10
        and Cpn60 oligomers also require Mg2+-ATP in order to interact to form a functional
        complex, although the mechanism of this interaction is as yet unknown [[cite:PUB00002183]].
        This chaperonin complex is essential for the correct folding and assembly
        of polypeptides into oligomeric structures, of which the chaperonins themselves
        are not a part [[cite:PUB00004550]]. The binding of Cpn10 to Cpn60 inhibits
        the weak ATPase activity of Cpn60.</p>\n\n<p>TCP-1 (t-complex polypeptide
        1) is a subunit of the hetero-oligomeric complex CCT (chaperonin containing
        TCP- 1) present in the eukaryotic cytosol. It is a member of the chaperonin
        family which includes GroEL, 60kDa heat shock protein (Hsp60), Rubisco subunit
        binding protein (RBP) and thermophilic factor 55 (TF55) [[cite:PUB00064264]].</p>\n\n<p>BBS10
        and BBS10 chaperonins play a role in the assembly of BBSome, a complex involved
        in ciliogenesis regulating transports vesicles to the cilia [[cite:PUB00069285]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00004550":{"PMID":1349837,"ISBN":null,"volume":"18","issue":"5","year":1992,"title":"cDNA
        clones encoding Arabidopsis thaliana and Zea mays mitochondrial chaperonin
        HSP60 and gene expression during seed germination and heat shock.","URL":null,"raw_pages":"873-85","medline_journal":"Plant
