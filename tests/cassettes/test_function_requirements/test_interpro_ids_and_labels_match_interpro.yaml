        second NDPk domain\",\"type\":\"Domain\",\"children\":[]}]},\"name\":{\"name\":\"Nucleoside
        diphosphate kinase-like domain\",\"short\":\"NDK-like_dom\"},\"description\":[{\"text\":\"<p>This
        entry represents the Nucleoside diphosphate kinase-like domain that contains
        an \u03B1/\u03B2 fold. It is also found at the C-terminal of retinitis pigmentosa
        2 protein (XRP2/RP2) [[cite:PUB00039797]]. XRP2, a GTPase-activating protein,
        is required for the maintenance of rod and cone photoreceptor cells in the
        retina [[cite:PUB00082322]]. NDK is a hexamer composed of identical subunits
        with a novel mononucleotide binding fold. Each subunit contains an \u03B1/\u03B2
        domain with a four stranded, anti-parallel \u03B2-sheet [[cite:PUB00085079]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>Nucleoside
        diphosphate kinases ([ec:2.7.4.6]) (NDK) are enzymes required for the synthesis
        of nucleoside triphosphates (NTP) other than ATP. They provide NTPs for nucleic
        acid synthesis, CTP for lipid synthesis, UTP for polysaccharide synthesis
        and GTP for protein elongation, signal transduction and microtubule polymerisation.</p>\\r\\n\\r\\n<p>NDK
        are proteins of 17 Kd that act via a ping-pong mechanism in which a histidine
        residue is phosphorylated, by transfer of the terminal phosphate group from
        ATP. In the presence of magnesium, the phosphoenzyme can transfer its phosphate
        group to any NDP, to produce an NTP.</p>\\r\\n\\r\\n<p>NDK isozymes have been
        sequenced from prokaryotic and eukaryotic sources. It has also been shown
        [[cite:PUB00000847]] that the Drosophila awd (abnormal wing discs) protein,
        is a microtubule-associated NDK. Mammalian NDK is also known as metastasis
        inhibition factor nm23. The sequence of NDK has been highly conserved through
        evolution. There is a single histidine residue conserved in all known NDK
        isozymes, which is involved in the catalytic mechanism [[cite:PUB00002696]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00039797\":{\"PMID\":16472755,\"ISBN\":null,\"volume\":\"14\",\"issue\":\"2\",\"year\":2006,\"title\":\"Crystal
        structure of the human retinitis pigmentosa 2 protein and its interaction
