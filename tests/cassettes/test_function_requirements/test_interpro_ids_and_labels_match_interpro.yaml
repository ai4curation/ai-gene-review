      string: '{"metadata":{"accession":"IPR008917","entry_id":null,"type":"homologous_superfamily","go_terms":[{"identifier":"GO:0003677","name":"DNA
        binding","category":{"code":"F","name":"molecular_function"}},{"identifier":"GO:0006355","name":"regulation
        of DNA-templated transcription","category":{"code":"P","name":"biological_process"}}],"source_database":"interpro","member_databases":{"ssf":{"SSF47454":"A
        DNA-binding domain in eukaryotic transcription factors"}},"integrated":null,"hierarchy":{"accession":"IPR008917","name":"Transcription
        factor, Skn-1-like, DNA-binding domain superfamily","type":"Homologous_superfamily","children":[]},"name":{"name":"Transcription
        factor, Skn-1-like, DNA-binding domain superfamily","short":"TF_DNA-bd_sf"},"description":[{"text":"<p>The
        DNA-binding domain of certain eukaryotic transcription factors displays a
        distinctive helix-turn-helix (HTH) motif.  The MafG basic region-leucine zipper
        (bZIP) protein and the Caenorhabditis elegans Skn-1 transcription factor share
        this HTH motif.</p>\r\n<p>MafG is a member of the Maf family of proteins,
        which are a subgroup of bZIP proteins that function as transcriptional regulators
        of cellular differentiation.  Mafs can form either homodimers, or heterodimers
        with other bZIP proteins through their leucine zipper domains.  MafG proteins
        are small Mafs that lack a putative transactivation domain.  The DNA-binding
        domain of MafG contains the conserved Maf extended homology region (EHR),
        which is not present in other bZIP proteins.  The EHR together with the basic
        region are responsible for the DNA-binding specificity of Mafs.</p>\r\n<p>Skn-1
        is a transcription factor that specifies mesodermal development in C. elegans.  Skn-1
        and MafG share a conserved DNA-binding motif, however Skn-1 lacks the leucine
        zipper dimerisation domain that is found in all bZIP proteins.  Skn-1 acts
        as a monomer.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00007700":{"PMID":11875518,"ISBN":null,"volume":"9","issue":"4","year":2002,"title":"Solution
        structure of the DNA-binding domain of MafG.","URL":null,"raw_pages":"252-6","medline_journal":"Nat
        Struct Biol","ISO_journal":"Nat. Struct. Biol.","authors":["Kusunoki H","Motohashi
        H","Katsuoka F","Morohashi A","Yamamoto M","Tanaka T."],"DOI_URL":"http://dx.doi.org/10.1038/nsb771"},"PUB00011711":{"PMID":9628487,"ISBN":null,"volume":"5","issue":"6","year":1998,"title":"A
        new DNA-binding motif in the Skn-1 binding domain-DNA complex.","URL":null,"raw_pages":"484-91","medline_journal":"Nat
        Struct Biol","ISO_journal":"Nat. Struct. Biol.","authors":["Rupert PB","Daughdrill
        GW","Bowerman B","Matthews BW."],"DOI_URL":"http://dx.doi.org/10.1038/nsb0698-484"}},"set_info":null,"overlaps_with":[{"accession":"IPR004826","name":"Basic
        leucine zipper domain, Maf-type","type":"domain"}],"counters":{"subfamilies":0,"domain_architectures":0,"interactions":0,"matches":15853,"pathways":75,"proteins":15839,"proteomes":1505,"sets":0,"structural_models":{"alphafold":13778},"structures":24,"taxa":4770},"entry_annotations":{},"cross_references":{},"is_llm":false,"is_reviewed_llm":false,"is_updated_llm":false,"representative_structure":null}}'
