        K\",\"Veltel S\",\"Schlichting I\",\"Wittinghofer A.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/j.str.2005.11.008\"},\"PUB00085079\":{\"PMID\":556853,\"ISBN\":null,\"volume\":\"367\",\"issue\":\"3\",\"year\":1977,\"title\":\"Influences
