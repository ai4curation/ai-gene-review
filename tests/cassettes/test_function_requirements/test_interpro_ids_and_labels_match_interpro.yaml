        factor\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR007604\",\"name\":\"CP2
        transcription factor\",\"type\":\"Domain\",\"children\":[]},\"name\":{\"name\":\"CP2
        transcription factor\",\"short\":\"CP2\"},\"description\":[{\"text\":\"<p>This
        entry represents a domain found in animal and fungal Grh/CP2 transcription
        factors (TFs), key regulators of epithelial differentiation, organ development
        and skin barrier formation. The Grh/CP2 family of TFs comprises two distinct
        divisions, CP2 (CCAAT box-binding protein 2) and Grh (grainyhead). Proteins
        of the CP2 subfamily are generally expressed ubiquitously, while the expression
        pattern of the Grh subfamily is rather tissue- and developmental stage specific.
        All Grh/CP2 family members share a common domain architecture characterised
        by an intrinsically unstructured N-terminal transactivation domain (TAD),
        a conserved DNA-binding domain (DB, also termed CP2 binding domain), and a
        C-terminal dimerisation domain (DD). The Grh/CP2 DB domain contains an immunoglobulin
        (Ig)-like core with two long, twisted antiparallel \u03B2 sheets of five and
        six strands, respectively. This core is decorated by three \u03B1 helices
        and a series of surface loops [[cite:PUB00100931], [cite:PUB00100932], [cite:PUB00090637]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00090637\":{\"PMID\":29309642,\"ISBN\":null,\"volume\":\"46\",\"issue\":\"4\",\"year\":2018,\"title\":\"Structural
