      string: "{\"metadata\":{\"accession\":\"IPR015300\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF101936\":\"DNA-binding
        pseudobarrel domain\"},\"cathgene3d\":{\"G3DSA:2.40.330.10\":\"DNA-binding
        pseudobarrel domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR015300\",\"name\":\"DNA-binding
        pseudobarrel domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"DNA-binding
        pseudobarrel domain superfamily\",\"short\":\"DNA-bd_pseudobarrel_sf\"},\"description\":[{\"text\":\"<p>This
        superfamily represents a DNA recognition domain found in the restriction endonuclease
        EcoRII and numerous transcription factors. The EcoRII structure has been studied
        and forms an eight-stranded \u03B2-sheet with the strands in the order of
        b2, b5, b4, b3, b7, b6, b1 and b8. The strands are mostly antiparallel to
        each other except that b3 is parallel to b7. Alternatively, it may also be
        viewed as consisting of two mini \u03B2-sheets of four antiparallel \u03B2-strands,
        sheet I from \u03B2-strands b2, b5, b4, b3 and sheet II from strands b7, b6,
        b1, b8, folded into an open mixed \u03B2-barrel with a novel topology. Sheet
        I has a simple Greek key motif while sheet II does not [[cite:PUB00029018]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00029018\":{\"PMID\":14659759,\"ISBN\":null,\"volume\":\"335\",\"issue\":\"1\",\"year\":2004,\"title\":\"Crystal
        structure of type IIE restriction endonuclease EcoRII reveals an autoinhibition
        mechanism by a novel effector-binding fold.\",\"URL\":null,\"raw_pages\":\"307-19\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Zhou XE\",\"Wang
        Y\",\"Reuter M\",\"Mucke M\",\"Kruger DH\",\"Meehan EJ\",\"Chen L.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/j.jmb.2003.10.030\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR003340\",\"name\":\"B3
        DNA binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR051442\",\"name\":\"B3
        domain-containing protein\",\"type\":\"family\"},{\"accession\":\"IPR023372\",\"name\":\"Restriction
        endonuclease, type II, EcoRII, N-terminal\",\"type\":\"domain\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":0,\"interactions\":0,\"matches\":77409,\"pathways\":0,\"proteins\":58339,\"proteomes\":771,\"sets\":0,\"structural_models\":{\"alphafold\":46607},\"structures\":24,\"taxa\":2256},\"entry_annotations\":{},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"5os9\",\"name\":\"Structure
        of the B3 DNA-Binding Domain of NGA1\"}}}"
