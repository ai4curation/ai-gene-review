      string: "{\"metadata\":{\"accession\":\"IPR036955\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003700\",\"name\":\"DNA-binding
        transcription factor activity\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:3.30.730.10\":\"AP2/ERF
        domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036955\",\"name\":\"AP2/ERF
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"AP2/ERF
        domain superfamily\",\"short\":\"AP2/ERF_dom_sf\"},\"description\":[{\"text\":\"<p>Ethylene
        is an endogenous plant hormone that influences many aspects of plant growth
        and development. Some defense related genes that are induced by ethylene contain
        a cis-regulatory element known as the Ethylene-Responsive Element (ERE) [[cite:PUB00018481]].
        Sequence analysis on various ERE regions has identified a short motif rich
        in G/C nucleotides, the GCC-box, essential for the response to ethylene. This
        short motif is recognised by a family of transcrition factors, the ERE binding
        factors (ERF) [[cite:PUB00018482]].</p>\\n\\n<p>ERF proteins contain a domain
        of around 60 amino acids which is also found in the APETALA2 (AP2) protein
        [[cite:PUB00004522]]. This AP2/ERF domain has been shown in various proteins
        to be necessary and sufficient to bind the GCC-box [[cite:PUB00018483]].</p>\\n\\n<p>The
        structure of the AP2/ERF domain in complex with the target DNA has been solved
        [[cite:PUB00018484]]. The structure resembles that of bacteriophage integrases
        and the methyl-CpG-binding domain (MBD): a three-stranded \u03B2-sheet and
        an \u03B1 helix almost parallel to the \u03B2-sheet. It contacts DNA via Arg
        and Trp residues located in the \u03B2-sheet.</p>\\n\\n<p>Some proteins known
        to contain an AP2/ERF domain include:</p>\\n\\n<ul>\\n<li>Arabidopsis thaliana
        ERF1 to 6.</li>\\n<li>Tobacco ethylene-responsive element-binding proteins
        (EREBPs), homologues of ERF proteins.</li>\\n<li>Arabidopsis thaliana AP2
        protein. It regulates meristeme identity, floral organ specification and seed
        coat development.</li>\\n<li>Arabidopsis thaliana C-repeat/dehydration-responsive
        element (DRE) binding factor 1 (CBF1 or DREB1) and DREB2. They bind a GCC-box-like
        element found in dehydratation responsive element. Binding to this element
        mediates cold-inducible transcription.</li>\\n<li>Arabidopsis thaliana and
        maize abscisic acid (ABA)-insensitive 4 (ABI4) proteins. They bind to a GCC-box-like
        element found in ABA-responsive genes.</li>\\n<li>Octadecanoid-derivative
        responsive catharenthus AP2-domain (ORCA2) protein. It binds a GCC-box-like
        element in the jasmonate responsive element of Str promoter.</li>\\n<li>Tomato
        Pto-interacting proteins 4 to 6 (Pti4 to Pti6). Pti5 and 6 bind a GCC-box-like
        element in regulatory regions of various pathogenesis-related (PR) genes.</li>\\n<li>Trichodesmium
        erythraeum, Tetrahymena thermophila, Enterobacteria phage RB49 and bacteriophage
        Felix 01 HNH endonucleases. HNH endonucleases are homing endonucleases that
        move extensively via lateral gene transfer [[cite:PUB00018485]].</li>\\n</ul>\\n\\n<p>This
        entry represents the AP2/ERF domain superfamily.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00018485\":{\"PMID\":15319480,\"ISBN\":null,\"volume\":\"16\",\"issue\":\"9\",\"year\":2004,\"title\":\"From
        endonucleases to transcription factors: evolution of the AP2 DNA binding domain
        in plants.\",\"URL\":null,\"raw_pages\":\"2265-77\",\"medline_journal\":\"Plant
        Cell\",\"ISO_journal\":\"Plant Cell\",\"authors\":[\"Magnani E\",\"Sjolander
        K\",\"Hake S.\"],\"DOI_URL\":\"http://dx.doi.org/10.1105/tpc.104.023135\"},\"PUB00018484\":{\"PMID\":9736626,\"ISBN\":null,\"volume\":\"17\",\"issue\":\"18\",\"year\":1998,\"title\":\"A
        novel mode of DNA recognition by a beta-sheet revealed by the solution structure
        of the GCC-box binding domain in complex with DNA.\",\"URL\":null,\"raw_pages\":\"5484-96\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Allen MD\",\"Yamasaki K\",\"Ohme-Takagi
        M\",\"Tateno M\",\"Suzuki M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/emboj/17.18.5484\"},\"PUB00018483\":{\"PMID\":9756931,\"ISBN\":null,\"volume\":\"273\",\"issue\":\"41\",\"year\":1998,\"title\":\"Unique
        mode of GCC box recognition by the DNA-binding domain of ethylene-responsive
        element-binding factor (ERF domain) in plant.\",\"URL\":null,\"raw_pages\":\"26857-61\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Hao D\",\"Ohme-Takagi
        M\",\"Sarai A.\"],\"DOI_URL\":\"http://dx.doi.org/10.1074/jbc.273.41.26857\"},\"PUB00018482\":{\"PMID\":10715325,\"ISBN\":null,\"volume\":\"12\",\"issue\":\"3\",\"year\":2000,\"title\":\"Arabidopsis
        ethylene-responsive element binding factors act as transcriptional activators
        or repressors of GCC box-mediated gene expression.\",\"URL\":null,\"raw_pages\":\"393-404\",\"medline_journal\":\"Plant
        Cell\",\"ISO_journal\":\"Plant Cell\",\"authors\":[\"Fujimoto SY\",\"Ohta
        M\",\"Usui A\",\"Shinshi H\",\"Ohme-Takagi M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1105/tpc.12.3.393\"},\"PUB00018481\":{\"PMID\":2535512,\"ISBN\":null,\"volume\":\"1\",\"issue\":\"6\",\"year\":1989,\"title\":\"Functional
