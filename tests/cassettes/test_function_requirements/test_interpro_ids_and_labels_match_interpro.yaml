        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cdd\":{\"cd00202\":\"ZnF_GATA\"},\"profile\":{\"PS50114\":\"GATA-type
        zinc finger domain profile\"},\"prosite\":{\"PS00344\":\"GATA-type zinc finger
        domain\"},\"pfam\":{\"PF00320\":\"GATA zinc finger\"},\"prints\":{\"PR00619\":\"GATAZNFINGER\"},\"smart\":{\"SM00401\":\"zinc
        finger binding to DNA consensus sequence [AT]GATA[AG]\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR000679\",\"name\":\"Zinc
        finger, GATA-type\",\"type\":\"Domain\",\"children\":[]},\"name\":{\"name\":\"Zinc
        finger, GATA-type\",\"short\":\"Znf_GATA\"},\"description\":[{\"text\":\"<p>This
        entry represents GATA-type zinc fingers (Znf). A number of transcription factors
        (including erythroid-specific transcription factor and nitrogen regulatory
        proteins), specifically bind the DNA sequence (A/T)GATA(A/G) [[cite:PUB00001896]]
        in the regulatory regions of genes. They are consequently termed GATA-binding
        transcription factors. The interactions occur via highly-conserved Znf domains
        in which the zinc ion is coordinated by four cysteine residues [[cite:PUB00000834],
        [cite:PUB00005167]]. NMR studies have shown the core of the Znf to comprise
        two irregular anti-parallel \u03B2-sheets and an \u03B1-helix, followed by
        a long loop to the C-terminal end of the finger. The N-terminal part, which
        includes the helix, is similar in structure, but not sequence, to the N-terminal
        zinc module of the glucocorticoid receptor DNA-binding domain. The helix and
        the loop connecting the two \u03B2-sheets interact with the major groove of
        the DNA, while the C-terminal tail wraps around into the minor groove. It
        is this tail that is the essential determinant of specific binding. Interactions
        between the Znf and DNA are mainly hydrophobic, explaining the preponderance
        of thymines in the binding site; a large number of interactions with the phosphate
        backbone have also been observed [[cite:PUB00005167]]. Two GATA zinc fingers
        are found in the GATA transcription factors. However there are several proteins
        which only contains a single copy of the domain.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00005167\":{\"PMID\":8332909,\"ISBN\":null,\"volume\":\"261\",\"issue\":\"5120\",\"year\":1993,\"title\":\"NMR
        structure of a specific DNA complex of Zn-containing DNA binding domain of
        GATA-1.\",\"URL\":null,\"raw_pages\":\"438-46\",\"medline_journal\":\"Science\",\"ISO_journal\":\"Science\",\"authors\":[\"Omichinski
        JG\",\"Clore GM\",\"Schaad O\",\"Felsenfeld G\",\"Trainor C\",\"Appella E\",\"Stahl
        SJ\",\"Gronenborn AM.\"],\"DOI_URL\":\"http://www.sciencemag.org/cgi/content/abstract/261/5120/438\"},\"PUB00000834\":{\"PMID\":2776214,\"ISBN\":null,\"volume\":\"58\",\"issue\":\"5\",\"year\":1989,\"title\":\"The
        erythroid-specific transcription factor Eryf1: a new finger protein.\",\"URL\":null,\"raw_pages\":\"877-85\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Evans
        T\",\"Felsenfeld G.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0092-8674(89)90940-9\"},\"PUB00001896\":{\"PMID\":2249770,\"ISBN\":null,\"volume\":\"4\",\"issue\":\"10\",\"year\":1990,\"title\":\"Activity
        and tissue-specific expression of the transcription factor NF-E1 multigene
        family.\",\"URL\":null,\"raw_pages\":\"1650-62\",\"medline_journal\":\"Genes
        Dev\",\"ISO_journal\":\"Genes Dev.\",\"authors\":[\"Yamamoto M\",\"Ko LJ\",\"Leonard
        MW\",\"Beug H\",\"Orkin SH\",\"Engel JD.\"],\"DOI_URL\":\"http://www.genesdev.org/cgi/content/abstract/4/10/1650\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR013088\",\"name\":\"Zinc
        finger, NHR/GATA-type\",\"type\":\"homologous_superfamily\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":623,\"interactions\":1,\"matches\":60301,\"pathways\":78,\"proteins\":50521,\"proteomes\":3619,\"sets\":0,\"structural_models\":{\"alphafold\":40543},\"structures\":32,\"taxa\":9811},\"entry_annotations\":{\"alignment:seed\":56,\"alignment:full\":41147},\"cross_references\":{\"prositedoc\":{\"displayName\":\"PROSITE
        Doc\",\"description\":\"PROSITE is a database of protein families and domains.\",\"rank\":18,\"accessions\":[{\"accession\":\"PDOC00300\",\"url\":\"http://prosite.expasy.org/PDOC00300\"}]}},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"4hc9\",\"name\":\"DNA
        binding by GATA transcription factor-complex 3\"}}}"
