        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"NAD(P)-binding
        domain superfamily\",\"short\":\"NAD(P)-bd_dom_sf\"},\"description\":[{\"text\":\"<p>This
        entry represents NAD- and NADP-binding domains superfamily with a core Rossmann-type
        fold, which consists of three layers (\u03B1/\u03B2/\u03B1) with parallel
        \u03B2-sheet of 6 strands. Many different enzymes contain an NAD/NADP-binding
        domain, including:</p>\\n\\n<ul>\\n<li>C-terminal domain of alcohol dehydrogenases
        [[cite:PUB00031657]]</li>\\n<li>Tyrosine-dependent oxidoreductases (also known
        as short-chain dehydrogenases) [[cite:PUB00000446]]</li>\\n<li>N-terminal
        domain of glyceraldehyde-3-phosphate dehydrogenase [[cite:PUB00023536]]</li>\\n<li>NAD-binding
        domain of formate/glycerate dehydrogenases [[cite:PUB00032846]]</li>\\n<li>N-terminal
        domain of sirohaem synthase [[cite:PUB00029889]]</li>\\n<li>N-terminal domain
        of lactate dehydrogenase [[cite:PUB00025866]]</li>\\n<li>N-terminal domain
        of 6-phosphogluconate dehydrogenase (the \u03B2-sheet is extended to 8 strands)
        [[cite:PUB00041823]]</li>\\n<li>C-terminal domain of amino acid dehydrogenases
        (an extra N-terminal helix displaces the C-terminal helix [[cite:PUB00025375]]</li>\\n<li>NAD-binding
        domain of certain potassium channels [[cite:PUB00025981]]</li>\\n<li>C-terminal
        domain of the transcriptional repressor Rex [[cite:PUB00032388]]</li>\\n<li>Ornithine
        cyclodeaminase [[cite:PUB00031693]]</li>\\n<li>CoA-binding N-terminal domain
        of the alpha chain of succinyl-CoA synthetase [[cite:PUB00015984]]</li>\\n</ul>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00023536\":{\"PMID\":10448043,\"ISBN\":null,\"volume\":\"291\",\"issue\":\"3\",\"year\":1999,\"title\":\"Crystal
        structure of the glyceraldehyde-3-phosphate dehydrogenase from the hyperthermophilic
