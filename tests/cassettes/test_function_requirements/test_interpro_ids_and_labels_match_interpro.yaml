        transcription factor activity","category":{"code":"F","name":"molecular_function"}},{"identifier":"GO:0006355","name":"regulation
        of DNA-templated transcription","category":{"code":"P","name":"biological_process"}}],"source_database":"interpro","member_databases":{"profile":{"PS51152":"NF-YA/HAP2
        family profile"},"panther":{"PTHR12632":"TRANSCRIPTION FACTOR NF-Y ALPHA-RELATED"},"prints":{"PR00616":"CCAATSUBUNTB"},"pfam":{"PF02045":"CCAAT-binding
        transcription factor (CBF-B/NF-YA) subunit B"},"smart":{"SM00521":"CCAAT-Binding
        transcription Factor"}},"integrated":null,"hierarchy":{"accession":"IPR001289","name":"Nuclear
        transcription factor Y subunit A","type":"Family","children":[]},"name":{"name":"Nuclear
        transcription factor Y subunit A","short":"NFYA"},"description":[{"text":"<p>Diverse
        DNA binding proteins are known to bind the CCAAT box, a common cis- acting
        element found in the promoter and enhancer regions of a large number of genes
        in eukaryotes. Amongst these proteins is one known as the CCAAT-binding factor
        (CBF) or nuclear transcription factor Y (NF-Y) [[cite:PUB00004401]]. CBF is
        a heteromeric transcription factor that consists of two different components
        both needed for DNA-binding.</p>\n\n<p>The HAP protein complex of yeast binds
        to the upstream activation site of cytochrome C iso-1 gene (CYC1) as well
        as other genes involved in mitochondrial electron transport and activates
        their expression. It also recognises the sequence CCAAT and is structurally
        and evolutionary related to CBF.</p>\n\n<p>The first subunit of CBF is known
        as CBF-A or NF-YB in vertebrates, and HAP3 in budding yeast. The second subunit
        is known as CBF-B or NF-YA in vertebrates and HAP2 in budding yeast. It is
        a protein of 265 to 350 amino-acid residues which contains a highly conserved
        region of about 60 residues. This region, called the ''essential core'' [[cite:PUB00003675]],
        seems to consist of two subdomains: an N-terminal subunit-association domain
        and a C-terminal DNA recognition domain.</p>\n\n<p>This entry represents the
        NF-YA subunit.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00004401":{"PMID":1549471,"ISBN":null,"volume":"20","issue":"5","year":1992,"title":"Evolutionary
