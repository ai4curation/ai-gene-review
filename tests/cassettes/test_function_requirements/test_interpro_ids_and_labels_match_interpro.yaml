        finger Dof-type signature"},"profile":{"PS50884":"Zinc finger Dof-type profile"},"pfam":{"PF02701":"Dof
        domain, zinc finger"}},"integrated":null,"hierarchy":{"accession":"IPR003851","name":"Zinc
        finger, Dof-type","type":"Domain","children":[]},"name":{"name":"Zinc finger,
        Dof-type","short":"Znf_Dof"},"description":[{"text":"<p>This entry consists
        of proteins containing a Dof domain, which is a zinc finger DNA-binding domain
        that shows resemblance to the Cys2 zinc finger, although it has a longer putative
        loop where an extra Cys residue is conserved [[cite:PUB00007566]]. AOBP, a
        DNA-binding protein in pumpkin (Cucurbita maxima), contains a 52 amino acid
        Dof domain, which is highly conserved in several DNA-binding proteins of higher
        plants.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Zinc
        finger (Znf) domains are relatively small protein motifs which contain multiple
        finger-like protrusions that make tandem contacts with their target molecule.
        Some of these domains bind zinc, but many do not; instead, they bind other
        metals, such as iron, or no metal at all. For example, some family members
        form salt bridges to stabilise the finger-like folds. They were first identified
        as a DNA-binding motif in transcription factor TFIIIA from Xenopus laevis
        (African clawed frog); however, they are now recognised to bind DNA, RNA,
        protein and/or lipid substrates [[cite:PUB00035807], [cite:PUB00035805], [cite:PUB00035806],
        [cite:PUB00035804], [cite:PUB00014077]]. Their binding properties depend on
        the amino acid sequence of the finger domains and of the linker between fingers,
        as well as on the higher-order structures and the number of fingers. Znf domains
        are often found in clusters, where fingers can have different binding specificities.
        There are many superfamilies of Znf motifs, varying in both sequence and structure.
        They display considerable versatility in binding modes, even between members
        of the same class (e.g., some bind DNA, others protein), suggesting that Znf
        motifs are stable scaffolds that have evolved specialised functions. For example,
        Znf-containing proteins function in gene transcription, translation, mRNA
        trafficking, cytoskeleton organisation, epithelial development, cell adhesion,
        protein folding, chromatin remodelling and zinc sensing, to name but a few
        [[cite:PUB00035812]]. Zinc-binding motifs are stable structures, and they
        rarely undergo conformational changes upon binding their target.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00035807":{"PMID":10529348,"ISBN":null,"volume":"293","issue":"2","year":1999,"title":"Zinc
        finger peptides for the regulation of gene expression.","URL":null,"raw_pages":"215-8","medline_journal":"J
        Mol Biol","ISO_journal":"J. Mol. Biol.","authors":["Klug A."],"DOI_URL":"http://dx.doi.org/10.1006/jmbi.1999.3007"},"PUB00035805":{"PMID":15963892,"ISBN":null,"volume":"15","issue":"3","year":2005,"title":"Multiple
        modes of RNA recognition by zinc finger proteins.","URL":null,"raw_pages":"367-73","medline_journal":"Curr
        Opin Struct Biol","ISO_journal":"Curr. Opin. Struct. Biol.","authors":["Hall
        TM."],"DOI_URL":"http://dx.doi.org/10.1016/j.sbi.2005.04.004"},"PUB00035806":{"PMID":15718139,"ISBN":null,"volume":"15","issue":"1","year":2005,"title":"Zinc
        finger proteins: getting a grip on RNA.","URL":null,"raw_pages":"94-8","medline_journal":"Curr
        Opin Struct Biol","ISO_journal":"Curr. Opin. Struct. Biol.","authors":["Brown
        RS."],"DOI_URL":"http://dx.doi.org/10.1016/j.sbi.2005.01.006"},"PUB00035804":{"PMID":17210253,"ISBN":null,"volume":"32","issue":"2","year":2007,"title":"Sticky
        fingers: zinc-fingers as protein-recognition motifs.","URL":null,"raw_pages":"63-70","medline_journal":"Trends
        Biochem Sci","ISO_journal":"Trends Biochem. Sci.","authors":["Gamsjaeger R","Liew
        CK","Loughlin FE","Crossley M","Mackay JP."],"DOI_URL":"http://dx.doi.org/10.1016/j.tibs.2006.12.007"},"PUB00007566":{"PMID":9688549,"ISBN":null,"volume":"430","issue":"3","year":1998,"title":"Functional
        analyses of the Dof domain, a zinc finger DNA-binding domain, in a pumpkin
