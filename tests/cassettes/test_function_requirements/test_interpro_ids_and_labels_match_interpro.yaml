        stage V, protein E","type":"Family","children":[]}]}]},"name":{"name":"Probable
        peptidoglycan glycosyltransferase FtsW/RodA","short":"FtsW/RodA"},"description":[{"text":"<p>A
        number of prokaryotic integral membrane proteins involved in cell cycle processes
