        kinase family [[cite:PUB00043362]], and it acts in the Krebs cycle [[cite:PUB00043363]].
        The catalytic activities of ICDH kinase/phosphatase constitute a moiety conserved
        cycle, require ATP, and exhibit ''zero-order ultrasensitivity'' [[cite:PUB00043364]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00043362":{"PMID":11258918,"ISBN":null,"volume":"40","issue":"10","year":2001,"title":"The
