        A","Severinova E","Darst SA."],"DOI_URL":"http://dx.doi.org/10.1016/S0092-8674(00)81329-X"},"PUB00010042":{"PMID":11931761,"ISBN":null,"volume":"9","issue":"3","year":2002,"title":"Structure
        of the bacterial RNA polymerase promoter specificity sigma subunit.","URL":null,"raw_pages":"527-39","medline_journal":"Mol
