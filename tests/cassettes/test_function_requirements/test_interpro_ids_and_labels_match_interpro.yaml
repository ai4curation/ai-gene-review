      string: "{\"metadata\":{\"accession\":\"IPR036431\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:1.10.150.60\":\"ARID
        DNA-binding domain\"},\"ssf\":{\"SSF46774\":\"ARID-like\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036431\",\"name\":\"ARID
        DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"ARID
        DNA-binding domain superfamily\",\"short\":\"ARID_dom_sf\"},\"description\":[{\"text\":\"<p>The
        AT-rich interaction domain (ARID) is an ~100-amino acid DNA-binding module
        found in a large number of eukaryotic transcription factors that regulate
        cell proliferation, differentiation, and development [[cite:PUB00018453],
        [cite:PUB00018454]]. The ARID domain appears as a single-copy motif and can
        be found in association with other domains, such as JmjC, JmjN, Tudor and
        PHD-type zinc finger [[cite:PUB00018455]].</p>\\n\\n<p>The basic structure
        of the ARID domain appears to be a series of six \u03B1-helices separated
        by \u03B2-strands, loops, or turns, but the structured region may extend to
        an additional helix at either or both ends of the basic six. Based on primary
        sequence homology, they can be partitioned into three structural classes:</p>\\n\\n<ul><li>Minimal
        ARID proteins that consist of a core domain formed by six \u03B1-helices;</li>\\n\\n<li>ARID
        proteins that supplement the core domain with an N-terminal \u03B1-helix;</li>\\n\\n<li>Extended-ARID
        proteins, which contain the core domain and additional \u03B1-helices at their
        N-and C-termini.</li></ul>\\n\\n<p>Minimal ARIDs are distributed in all eukaryotes,
        while extended ARIDs are restricted to metazoans. The ARID domain binds DNA
        as a monomer, recognising the duplex through insertion of a loop and an \u03B1-helix
        into the major groove and by extensive non-specific anchoring contacts to
        the adjacent sugar-phosphate backbone [[cite:PUB00018453], [cite:PUB00018454],
        [cite:PUB00018456]].</p>\\n\\n<p>Some proteins known to contain an ARID domain
        are listed below:</p>\\n\\n<ul><li>Eukaryotic transcription factors of the
        jumonji family.</li>\\n\\n<li>Mammalian Bright, a B-cell-specific trans-activator
        of IgH transcription.</li>\\n\\n<li>Mammalian PLU-1, a protein that is upregulated
        in breast cancer cells.</li>\\n\\n<li>Mammalian RBP1 and RBP2, retinoblastoma-binding
        factors.</li>\\n\\n<li>Mammalian Mrf-1 and Mrf-2, transcriptional modulators
        of the cytomegalovirus major intermediate-early promoter.</li>\\n\\n<li>Drosophila
        melanogaster dead ringer protein, a transcriptional regulatory protein required
        for early embryonic development.</li>\\n\\n<li>Yeast SWI1 protein, from the
        SWI/SNF complex involved in chromatin remodelling and broad aspects of transcription
        regulation.</li>\\n\\n<li>Drosophila melanogaster Osa. It is structurally
        related to SWI1 and associates with the brahma complex, which is the Drosophila
        equivalent of the SWI/SNF complex.</li></ul>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00018456\":{\"PMID\":14722072,\"ISBN\":null,\"volume\":\"279\",\"issue\":\"16\",\"year\":2004,\"title\":\"Structure
        and DNA-binding sites of the SWI1 AT-rich interaction domain (ARID) suggest
        determinants for sequence-specific DNA recognition.\",\"URL\":null,\"raw_pages\":\"16670-6\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Kim S\",\"Zhang
        Z\",\"Upchurch S\",\"Isern N\",\"Chen Y.\"],\"DOI_URL\":\"http://dx.doi.org/10.1074/jbc.M312115200\"},\"PUB00018455\":{\"PMID\":11959810,\"ISBN\":null,\"volume\":\"13\",\"issue\":\"3\",\"year\":2002,\"title\":\"ARID
        proteins: a diverse family of DNA binding proteins implicated in the control
        of cell growth, differentiation, and development.\",\"URL\":null,\"raw_pages\":\"95-106\",\"medline_journal\":\"Cell
        Growth Differ\",\"ISO_journal\":\"Cell Growth Differ.\",\"authors\":[\"Wilsker
        D\",\"Patsialou A\",\"Dallas PB\",\"Moran E.\"],\"DOI_URL\":\"http://intl-cgd.aacrjournals.org/cgi/reprint/13/3/95.pdf\"},\"PUB00018454\":{\"PMID\":11867548,\"ISBN\":null,\"volume\":\"21\",\"issue\":\"5\",\"year\":2002,\"title\":\"The
        structure of the Dead ringer-DNA complex reveals how AT-rich interaction domains
        (ARIDs) recognize DNA.\",\"URL\":null,\"raw_pages\":\"1197-209\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Iwahara J\",\"Iwahara M\",\"Daughdrill
        GW\",\"Ford J\",\"Clubb RT.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/emboj/21.5.1197\"},\"PUB00018453\":{\"PMID\":10545119,\"ISBN\":null,\"volume\":\"18\",\"issue\":\"21\",\"year\":1999,\"title\":\"Solution
        structure of the DNA binding domain from Dead ringer, a sequence-specific
        AT-rich interaction domain (ARID).\",\"URL\":null,\"raw_pages\":\"6084-94\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Iwahara J\",\"Clubb RT.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/emboj/18.21.6084\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR001606\",\"name\":\"ARID
        DNA-binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR030408\",\"name\":\"AT-rich
        interactive domain-containing protein 5B, ARID/BRIGHT DNA binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR030094\",\"name\":\"AT-rich
        interactive domain-containing protein 1A, ARID/BRIGHT DNA binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR028853\",\"name\":\"ARID4B,
        ARID/BRIGHT domain\",\"type\":\"domain\"},{\"accession\":\"IPR045303\",\"name\":\"HMGB9-like,
        ARID/BRIGHT DNA binding domain\",\"type\":\"domain\"},{\"accession\":\"IPR038040\",\"name\":\"AT-rich
        interactive domain-containing protein 1B, ARID domain\",\"type\":\"domain\"},{\"accession\":\"IPR047981\",\"name\":\"Lysine-specific
        demethylase 5B, ARID domain\",\"type\":\"domain\"},{\"accession\":\"IPR047974\",\"name\":\"Lysine-specific
        demethylase 5A, ARID domain\",\"type\":\"domain\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":0,\"interactions\":0,\"matches\":35353,\"pathways\":40,\"proteins\":35266,\"proteomes\":3373,\"sets\":0,\"structural_models\":{\"alphafold\":16775},\"structures\":42,\"taxa\":8989},\"entry_annotations\":{},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"2cxy\",\"name\":\"Crystal
        structure of the hBAF250b AT-rich interaction domain (ARID)\"}}}"
