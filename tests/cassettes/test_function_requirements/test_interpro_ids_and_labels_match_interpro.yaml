    body:
      string: '{"metadata":{"accession":"IPR013854","entry_id":null,"type":"domain","go_terms":null,"source_database":"interpro","member_databases":{"pfam":{"PF03299":"Transcription
        factor AP-2"},"prints":{"PR01748":"AP2TNSCPFCT"}},"integrated":null,"hierarchy":{"accession":"IPR013854","name":"Transcription
        factor AP-2, C-terminal","type":"Domain","children":[]},"name":{"name":"Transcription
        factor AP-2, C-terminal","short":"TF_AP2_C"},"description":[{"text":"<p>Activator
        protein-2 (AP-2) transcription factors constitute a family of closely related
        and evolutionarily conserved proteins that bind to the DNA \nconsensus sequence
        5''-GCCNNNGGC-3'' and stimulate target gene transcription [[cite:PUB00010265],
        [cite:PUB00010264]]. Five different isoforms of AP-2 have been identified
        in mammals, termed AP-2 alpha, beta, gamma, delta and epsilon. Each family
        member shares a common structure, possessing a proline/glutamine-rich domain
        in the N-terminal region, which is responsible for transcriptional activation
        [[cite:PUB00010265]], and a helix-span-helix domain in the C-terminal region,
        which mediates dimerisation and site-specific DNA binding [[cite:PUB00010264]].</p>\n\n<p>The
        AP-2 family have been shown to be critical regulators of gene expression during
        embryogenesis. They regulate the development of facial prominence and limb
        buds, and are essential for cranial closure and development of the lens [[cite:PUB00010381],
        [cite:PUB00099638]]; they have also been implicated in tumorigenesis. AP-2
        protein expression levels have been found to affect cell transformation, tumour
        growth and metastasis, and may predict survival in some types of cancer [[cite:PUB00010332],
        [cite:PUB00010369]]. Mutations in human AP-2 have been linked with bronchio-occular-facial
        syndrome and Char Syndrome, congenital birth defects characterised by craniofacial
        deformities and patent ductus arteriosus, respectively [[cite:PUB00099637]].</p>","llm":false,"checked":false,"updated":false},{"text":"<p>This
        entry represents the C-terminal region of these proteins, including the helix-span-helix
        domain.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00010265":{"PMID":2010091,"ISBN":null,"volume":"5","issue":"4","year":1991,"title":"Analysis
        of the DNA-binding and activation properties of the human transcription factor
        AP-2.","URL":null,"raw_pages":"670-82","medline_journal":"Genes Dev","ISO_journal":"Genes
        Dev.","authors":["Williams T","Tjian R."],"DOI_URL":"http://www.genesdev.org/cgi/content/abstract/5/4/670"},"PUB00010264":{"PMID":1998122,"ISBN":null,"volume":"251","issue":"4997","year":1991,"title":"Characterization
        of a dimerization motif in AP-2 and its function in heterologous DNA-binding
        proteins.","URL":null,"raw_pages":"1067-71","medline_journal":"Science","ISO_journal":"Science","authors":["Williams
        T","Tjian R."],"DOI_URL":"http://www.sciencemag.org/cgi/content/abstract/251/4997/1067"},"PUB00010381":{"PMID":11137286,"ISBN":null,"volume":"260","issue":"1-2","year":2000,"title":"Regulatory
        roles of AP-2 transcription factors in vertebrate development, apoptosis and
        cell-cycle control.","URL":null,"raw_pages":"1-12","medline_journal":"Gene","ISO_journal":"Gene","authors":["Hilger-Eversheim
        K","Moser M","Schorle H","Buettner R."],"DOI_URL":"http://dx.doi.org/10.1016/S0378-1119(00)00454-6"},"PUB00010332":{"PMID":9632718,"ISBN":null,"volume":"273","issue":"26","year":1998,"title":"Loss
        of AP-2 results in up-regulation of MCAM/MUC18 and an increase in tumor growth
        and metastasis of human melanoma cells.","URL":null,"raw_pages":"16501-8","medline_journal":"J
        Biol Chem","ISO_journal":"J. Biol. Chem.","authors":["Jean D","Gershenwald
        JE","Huang S","Luca M","Hudson MJ","Tainsky MA","Bar-Eli M."],"DOI_URL":"http://dx.doi.org/10.1074/jbc.273.26.16501"},"PUB00010369":{"PMID":10864206,"ISBN":null,"volume":"82","issue":"12","year":2000,"title":"Expression
        of transcription factor AP-2alpha predicts survival in epithelial ovarian
