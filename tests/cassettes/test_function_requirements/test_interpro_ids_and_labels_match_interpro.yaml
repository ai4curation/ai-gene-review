    body:
      string: "{\"metadata\":{\"accession\":\"IPR036395\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0003700\",\"name\":\"DNA-binding
        transcription factor activity\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0005507\",\"name\":\"copper
        ion binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}},{\"identifier\":\"GO:0005634\",\"name\":\"nucleus\",\"category\":{\"code\":\"C\",\"name\":\"cellular_component\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF57879\":\"Zinc
        domain conserved in yeast copper-regulated transcription factors\"},\"cathgene3d\":{\"G3DSA:3.90.430.10\":\"Copper
        fist DNA-binding domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036395\",\"name\":\"Copper
        fist DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Copper
        fist DNA-binding domain superfamily\",\"short\":\"Cu_fist_DNA-bd_dom_sf\"},\"description\":[{\"text\":\"<p>Some
        fungal transcription factors contain an N-terminal domain, the copper fist,
        which seems to be involved in copper-dependent DNA-binding [[cite:PUB00001242],
        [cite:PUB00002782]]. These proteins activate the transcription of the metallothionein
        gene in response to copper. Metallothionein maintains copper levels in yeast
        [[cite:PUB00006077], [cite:PUB00001242]]. The copper fist domain, which is
        similar in structure to metallothionein itself, undergoes a large conformational
        change on copper-binding that allows DNA-binding. The domain contains a conserved
        array of zinc-binding residues (Cys-X2-Cys-X8-Cys-X-His) and forms a three-stranded
        antiparallel \u03B2-sheet with two short helical segments that project from
        one end of the \u03B2-sheet [[cite:PUB00016288]]. Conserved residues form
        a basic patch that may be important for DNA binding.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00016288\":{\"PMID\":9665167,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"7\",\"year\":1998,\"title\":\"Solution
        structure of a zinc domain conserved in yeast copper-regulated transcription
        factors.\",\"URL\":null,\"raw_pages\":\"551-5\",\"medline_journal\":\"Nat
        Struct Biol\",\"ISO_journal\":\"Nat. Struct. Biol.\",\"authors\":[\"Turner
        RB\",\"Smith DL\",\"Zawrotny ME\",\"Summers MF\",\"Posewitz MC\",\"Winge DR.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/805\"},\"PUB00002782\":{\"PMID\":8509391,\"ISBN\":null,\"volume\":\"268\",\"issue\":\"17\",\"year\":1993,\"title\":\"Regulation
        of metallothionein genes by the ACE1 and AMT1 transcription factors.\",\"URL\":null,\"raw_pages\":\"12512-8\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Thorvaldsen
