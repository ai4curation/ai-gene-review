        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"TEA/ATTS
        domain superfamily\",\"short\":\"TEA/ATTS_sf\"},\"description\":[{\"text\":\"<p>This
        superfamily represents a domain found in the Transcriptional enhancer factor
        (TEF) and in the Conidiophore development regulator aba.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>The
        TEA domain is a DNA-binding region of about 66 to 68 amino acids that has
        been named after the two proteins that originally defined the domain: TEF-1
        and AbaA. The TEA domain is located toward the N-terminal of eukaryotic transcription
        factors of the TEA/ATTS family. It shows a three-helix bundle with a homeodomain
        fold [[cite:PUB00017959], [cite:PUB00041557]]. Two \u03B1-helices are nearly
        anti-parallel and pack on either side of the third one, which is the DNA-recognition
        helix of the TEA domain. Phosphorylation of one or both of the two conserved
        serines found on the DNA-binding surface could interfere with DNA-binding
        activity by introducing electrostatic repulsion and/or steric hindrance and
        help regulate the transcription factor activity of the proteins [[cite:PUB00103734],
        [cite:PUB00041557]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00041557\":{\"PMID\":17085591,\"ISBN\":null,\"volume\":\"103\",\"issue\":\"46\",\"year\":2006,\"title\":\"Insights
        into transcription enhancer factor 1 (TEF-1) activity from the solution structure
        of the TEA domain.\",\"URL\":null,\"raw_pages\":\"17225-30\",\"medline_journal\":\"Proc
        Natl Acad Sci U S A\",\"ISO_journal\":\"Proc. Natl. Acad. Sci. U.S.A.\",\"authors\":[\"Anbanandam
