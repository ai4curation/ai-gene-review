      string: "{\"metadata\":{\"accession\":\"IPR036879\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0046983\",\"name\":\"protein
        dimerization activity\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:3.40.1810.10\":\"Transcription
        factor, MADS-box\"},\"ssf\":{\"SSF55455\":\"SRF-like\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036879\",\"name\":\"Transcription
        factor, MADS-box superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Transcription
        factor, MADS-box superfamily\",\"short\":\"TF_MADSbox_sf\"},\"description\":[{\"text\":\"<p>Human
        serum response factor (SRF) is a ubiquitous nuclear protein important for
        cell proliferation and differentiation. SRF function is essential for transcriptional
        regulation of numerous growth-factor-inducible genes, such as c-fos oncogene
        and muscle-specific actin genes.  A core domain of around 90 amino acids is
        sufficient for the activities of DNA-binding, dimerisation and interaction
        with accessory factors. Within the core is a DNA-binding region, designated
        the MADS box [[cite:PUB00004216]], that is highly similar to many eukaryotic
        regulatory proteins: among these are MCM1, the regulator of cell type-specific
        genes in fission yeast; DSRF, a Drosophila trachea development factor; the
        MEF2 family of myocyte-specific enhancer factors; and the Agamous and Deficiens
        families of plant homeotic proteins.</p>\\n\\n<p>In SRF, the MADS box has
        been shown to be involved in DNA-binding and dimerisation [[cite:PUB00000821]].
        Proteins belonging to the MADS family function as dimers, the primary DNA-binding
        element of which is an anti-parallel coiled coil of two amphipathic \u03B1-helices,
        one from each subunit. The DNA wraps around the coiled coil allowing the basic
        N-termini of the helices to fit into the DNA major groove. The chain extending
        from the helix N-termini reaches over the DNA backbone and penetrates into
        the minor groove. A 4-stranded, anti-parallel \u03B2-sheet packs against the
        coiled-coil face opposite the DNA and is the central element of the dimerisation
        interface. The MADS-box domain is commonly found associated with K-box region
        see ([interpro:IPR002487]).</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00004216\":{\"PMID\":7637780,\"ISBN\":null,\"volume\":\"376\",\"issue\":\"6540\",\"year\":1995,\"title\":\"Structure
        of serum response factor core bound to DNA.\",\"URL\":null,\"raw_pages\":\"490-8\",\"medline_journal\":\"Nature\",\"ISO_journal\":\"Nature\",\"authors\":[\"Pellegrini
        L\",\"Tan S\",\"Richmond TJ.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/376490a0\"},\"PUB00000821\":{\"PMID\":3203386,\"ISBN\":null,\"volume\":\"55\",\"issue\":\"6\",\"year\":1988,\"title\":\"Isolation
        and properties of cDNA clones encoding SRF, a transcription factor that binds
        to the c-fos serum response element.\",\"URL\":null,\"raw_pages\":\"989-1003\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Norman
        C\",\"Runswick M\",\"Pollock R\",\"Treisman R.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0092-8674(88)90244-9\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR002100\",\"name\":\"Transcription
        factor, MADS-box\",\"type\":\"domain\"},{\"accession\":\"IPR033897\",\"name\":\"SRF-like,
        MADS-box\",\"type\":\"domain\"},{\"accession\":\"IPR033896\",\"name\":\"MADS
        MEF2-like, N-terminal\",\"type\":\"domain\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":0,\"interactions\":0,\"matches\":58328,\"pathways\":26,\"proteins\":58087,\"proteomes\":3319,\"sets\":0,\"structural_models\":{\"alphafold\":48684},\"structures\":26,\"taxa\":10719},\"entry_annotations\":{},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"1egw\",\"name\":\"CRYSTAL
        STRUCTURE OF MEF2A CORE BOUND TO DNA\"}}}"
