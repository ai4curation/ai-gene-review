        E","Middendorf A","Martinussen J","Valentin-Hansen P."],"DOI_URL":"http://dx.doi.org/10.1016/0378-1119(90)90341-N"}},"set_info":null,"overlaps_with":[{"accession":"IPR018013","name":"Nucleoside-specific
