        zipper domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Basic-leucine
        zipper domain superfamily\",\"short\":\"bZIP_sf\"},\"description\":[{\"text\":\"<p>The
        basic-leucine zipper (bZIP) domain transcription factors [[cite:PUB00004967]]
        of eukaryotic are proteins that contain a basic region mediating sequence-specific
        DNA-binding followed by a leucine zipper region required for dimerisation.</p>\\n\\n<p>Several
        structure of bZIP have been solved. The basic region and the leucine zipper
        form a contiguous \u03B1-helix where the four hydrophobic residues of the
        leucine zipper are oriented on one side. This conformation allows dimerisation
        in parallel and it bends the helices so that the newly functional dimer forms
        a flexible fork where the basic domains, at the N-terminal open end, can then
        interact with DNA. The two leucine zipper are therefore oriented perpendicular
        to the DNA [[cite:PUB00017872]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00004967\":{\"PMID\":7780801,\"ISBN\":null,\"volume\":\"2\",\"issue\":\"2\",\"year\":1995,\"title\":\"Transcription
