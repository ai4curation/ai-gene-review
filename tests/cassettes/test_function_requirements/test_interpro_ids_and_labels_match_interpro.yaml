        Cell\",\"ISO_journal\":\"Mol. Cell\",\"authors\":[\"Liu J\",\"Smith CL\",\"DeRyckere
        D\",\"DeAngelis K\",\"Martin GS\",\"Berger JM.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S1097-2765(00)00062-9\"},\"PUB00013196\":{\"PMID\":8248124,\"ISBN\":null,\"volume\":\"90\",\"issue\":\"22\",\"year\":1993,\"title\":\"Hepatocyte
        nuclear factor 3/fork head or \\\"winged helix\\\" proteins: a family of transcription
        factors of diverse biologic function.\",\"URL\":null,\"raw_pages\":\"10421-3\",\"medline_journal\":\"Proc
        Natl Acad Sci U S A\",\"ISO_journal\":\"Proc. Natl. Acad. Sci. U.S.A.\",\"authors\":[\"Lai
        E\",\"Clark KL\",\"Burley SK\",\"Darnell JE Jr.\"],\"DOI_URL\":\"http://www.pubmedcentral.nih.gov/articlerender.fcgi?tool=EBI&pubmedid=8248124\"},\"PUB00013195\":{\"PMID\":10679470,\"ISBN\":null,\"volume\":\"10\",\"issue\":\"1\",\"year\":2000,\"title\":\"Winged
        helix proteins.\",\"URL\":null,\"raw_pages\":\"110-6\",\"medline_journal\":\"Curr
        Opin Struct Biol\",\"ISO_journal\":\"Curr. Opin. Struct. Biol.\",\"authors\":[\"Gajiwala
        KS\",\"Burley SK.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0959-440X(99)00057-3\"},\"PUB00013198\":{\"PMID\":12408833,\"ISBN\":null,\"volume\":\"10\",\"issue\":\"3\",\"year\":2002,\"title\":\"Crystal
