        communication in proteobacteria: biochemical and structural studies of signal
        synthases and receptors required for intercellular signalling.","URL":null,"raw_pages":"755-69","medline_journal":"Mol
        Microbiol","ISO_journal":"Mol. Microbiol.","authors":["Pappas KM","Weingart
        CL","Winans SC."],"DOI_URL":"http://dx.doi.org/10.1111/j.1365-2958.2004.04212.x"},"PUB00016945":{"PMID":11931562,"ISBN":null,"volume":"4","issue":"3","year":2002,"title":"Network
        regulation of the Escherichia coli maltose system.","URL":null,"raw_pages":"301-7","medline_journal":"J
        Mol Microbiol Biotechnol","ISO_journal":"J. Mol. Microbiol. Biotechnol.","authors":["Schlegel
