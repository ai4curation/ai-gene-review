        plant and bacterial proteins chaperone oligomeric protein assembly.","URL":null,"raw_pages":"330-4","medline_journal":"Nature","ISO_journal":"Nature","authors":["Hemmingsen
        SM","Woolford C","van der Vies SM","Tilly K","Dennis DT","Georgopoulos CP","Hendrix
        RW","Ellis RJ."],"DOI_URL":"http://dx.doi.org/10.1038/333330a0"},"PUB00069285":{"PMID":20080638,"ISBN":null,"volume":"107","issue":"4","year":2010,"title":"BBS6,
        BBS10, and BBS12 form a complex with CCT/TRiC family chaperonins and mediate
