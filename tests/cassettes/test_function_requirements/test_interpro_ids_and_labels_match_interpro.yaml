      string: "{\"metadata\":{\"accession\":\"IPR036893\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0005634\",\"name\":\"nucleus\",\"category\":{\"code\":\"C\",\"name\":\"cellular_component\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF103612\":\"SBT
        domain\"},\"cathgene3d\":{\"G3DSA:4.10.1100.10\":\"Transcription factor, SBP-box
        domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036893\",\"name\":\"SBP
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"SBP
        domain superfamily\",\"short\":\"SBP_sf\"},\"description\":[{\"text\":\"<p>SBP
        (for SQUAMOSA-pROMOTER BINDING PROTEIN) domain is a sequence specific DNA-binding
        domain found in plant proteins [[cite:PUB00007522]]. Members of family probably
        function as transcription factors involved in the control of early flower
        development [[cite:PUB00007522]]. They share a highly conserved DNA-binding
        domain that contains two zinc-binding sites. Among the 11 possible ligands
        for the zinc atoms that are conserved in the SBP zinc finger, only 8 are used.
        The SBP zinc finger follows the general pattern C-x4-C-x16-C-x2-[HC]-x15-C-x2-C-x3-H-x11-C.
        Three other histidines are well conserved but not involved in zinc binding
        [[cite:PUB00007522], [cite:PUB00018582]].</p>\\n\\n<p>In vitro experiments
        show that the SBP zinc finger preferentially binds the consensus sequence
        -TNCGTACAA- [[cite:PUB00018583]]. However, little is known of the physiological
        functions of these putative transcriptional regulators beyond their ability
        to bind DNA.</p>\\n\\n<p>The solution structure of the SBP zinc finger has
        been solved [[cite:PUB00018582]]. The first four Cys or His coordinate one
        zinc ion and the last four coordinate the other. It can be viewed as two structural
        subdomains, each subdomain containing a single zinc-binding pocket. The N-terminal
        subdomain consists of two short \u03B1 helices whereas the C-terminal one
        contains a three-stranded antiparallel \u03B2-sheet.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00018583\":{\"PMID\":10524240,\"ISBN\":null,\"volume\":\"237\",\"issue\":\"1\",\"year\":1999,\"title\":\"Molecular
        characterisation of the Arabidopsis SBP-box genes.\",\"URL\":null,\"raw_pages\":\"91-104\",\"medline_journal\":\"Gene\",\"ISO_journal\":\"Gene\",\"authors\":[\"Cardon
        G\",\"Hohmann S\",\"Klein J\",\"Nettesheim K\",\"Saedler H\",\"Huijser P.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0378-1119(99)00308-X\"},\"PUB00018582\":{\"PMID\":15001351,\"ISBN\":null,\"volume\":\"337\",\"issue\":\"1\",\"year\":2004,\"title\":\"A
        novel zinc-binding motif revealed by solution structures of DNA-binding domains
        of Arabidopsis SBP-family transcription factors.\",\"URL\":null,\"raw_pages\":\"49-63\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Yamasaki K\",\"Kigawa
        T\",\"Inoue M\",\"Tateno M\",\"Yamasaki T\",\"Yabuki T\",\"Aoki M\",\"Seki
