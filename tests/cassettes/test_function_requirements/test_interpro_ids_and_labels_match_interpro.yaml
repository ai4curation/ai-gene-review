        polymerase domain, PaeLigD-type","type":"Domain","children":[]},{"accession":"IPR033652","name":"LigD
        polymerase domain, type 3","type":"Domain","children":[]}]},"name":{"name":"DNA
        ligase D, polymerase domain","short":"LigD_pol_dom"},"description":[{"text":"<p>DNA
        repair of double-stranded breaks by non-homologous end joining (NHEJ) is accomplished
        by a two-protein system that is present in a minority of prokaryotes. One
        component is the Ku protein (see [interpro:IPR009187]), which binds DNA ends.
        The other is a DNA ligase, a protein that is a multidomain polypeptide in
        most of those bacteria that have NHEJ, a permuted polypeptide in Mycobacterium
        tuberculosis and a few other species, and the product of tandem genes in some
        other bacteria [[cite:PUB00106908], [cite:PUB00049296]]. This region represents
        the polymerase domain.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00106908":{"PMID":29089537,"ISBN":null,"volume":"8","issue":"1","year":2017,"title":"DNA
