      string: "{\"metadata\":{\"accession\":\"IPR036525\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF52490\":\"Tubulin
        nucleotide-binding domain-like\"},\"cathgene3d\":{\"G3DSA:3.40.50.1440\":\"Tubulin/FtsZ,
        GTPase domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036525\",\"name\":\"Tubulin/FtsZ,
        GTPase domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Tubulin/FtsZ,
        GTPase domain superfamily\",\"short\":\"Tubulin/FtsZ_GTPase_sf\"},\"description\":[{\"text\":\"<p>This
        entry represents a GTPase domain found in all tubulin chains, such as tubulin
        alpha, beta and gamma chains, plant ARC3 and prokaryotic FtsZ and CetZ proteins
        [[cite:PUB00003961], [cite:PUB00096948]]. These proteins are involved in polymer
        formation. Tubulin is the major component of microtubules, while FtsZ (homologue
        of eukaryotic tubulin) is the polymer-forming protein of bacterial cell division,
        it is part of a ring in the middle of the dividing cell that is required for
        constriction of cell membrane and cell envelope to yield two daughter cells
        [[cite:PUB00044363], [cite:PUB00004272]]. FtsZ can polymerise into tubes,
        sheets, and rings in vitro and is ubiquitous in bacteria and archaea. CetZ
        co-exists with FtsZ in many archaea. Cetz does not affect cell division, instead,
        it is involved in cell shape control [[cite:PUB00074278]]. Arabidopsis chloroplast
        protein ARC3 (At1g75010) is a Z-ring accessory protein involved in the initiation
        of plastid division and division site placement [[cite:PUB00074279], [cite:PUB00074280]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>The
        structure of the GTPase domain has a three layers (\u03B1/\u03B2/\u03B1) with
        a parallel \u03B2-sheet of six strands.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00044363\":{\"PMID\":9144213,\"ISBN\":null,\"volume\":\"94\",\"issue\":\"10\",\"year\":1997,\"title\":\"An
        essential cell division gene of Drosophila, absent from Saccharomyces, encodes
        an unusual protein with tubulin-like and myosin-like peptide motifs.\",\"URL\":null,\"raw_pages\":\"5189-94\",\"medline_journal\":\"Proc
        Natl Acad Sci U S A\",\"ISO_journal\":\"Proc. Natl. Acad. Sci. U.S.A.\",\"authors\":[\"Miklos
        GL\",\"Yamamoto M\",\"Burns RG\",\"Maleszka R.\"],\"DOI_URL\":\"http://dx.doi.org/10.1073/pnas.94.10.5189\"},\"PUB00004272\":{\"PMID\":9428770,\"ISBN\":null,\"volume\":\"391\",\"issue\":\"6663\",\"year\":1998,\"title\":\"Crystal
        structure of the bacterial cell-division protein FtsZ.\",\"URL\":null,\"raw_pages\":\"203-6\",\"medline_journal\":\"Nature\",\"ISO_journal\":\"Nature\",\"authors\":[\"Lowe
        J\",\"Amos LA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/34472\"},\"PUB00003961\":{\"PMID\":9628483,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"6\",\"year\":1998,\"title\":\"Tubulin
        and FtsZ form a distinct family of GTPases.\",\"URL\":null,\"raw_pages\":\"451-8\",\"medline_journal\":\"Nat
        Struct Biol\",\"ISO_journal\":\"Nat. Struct. Biol.\",\"authors\":[\"Nogales
        E\",\"Downing KH\",\"Amos LA\",\"Lowe J.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/nsb0698-451\"},\"PUB00074280\":{\"PMID\":18764889,\"ISBN\":null,\"volume\":\"84\",\"issue\":\"6\",\"year\":2008,\"title\":\"Effects
        of arc3, arc5 and arc6 mutations on plastid morphology and stromule formation
        in green and nongreen tissues of Arabidopsis thaliana.\",\"URL\":null,\"raw_pages\":\"1324-35\",\"medline_journal\":\"Photochem
        Photobiol\",\"ISO_journal\":\"Photochem. Photobiol.\",\"authors\":[\"Holzinger
        A\",\"Kwok EY\",\"Hanson MR.\"],\"DOI_URL\":\"http://dx.doi.org/10.1111/j.1751-1097.2008.00437.x\"},\"PUB00074279\":{\"PMID\":15356321,\"ISBN\":null,\"volume\":\"45\",\"issue\":\"8\",\"year\":2004,\"title\":\"ARC3,
        a chloroplast division factor, is a chimera of prokaryotic FtsZ and part of
        eukaryotic phosphatidylinositol-4-phosphate 5-kinase.\",\"URL\":null,\"raw_pages\":\"960-7\",\"medline_journal\":\"Plant
        Cell Physiol\",\"ISO_journal\":\"Plant Cell Physiol.\",\"authors\":[\"Shimada
        H\",\"Koizumi M\",\"Kuroki K\",\"Mochizuki M\",\"Fujimoto H\",\"Ohta H\",\"Masuda
        T\",\"Takamiya K.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/pcp/pch130\"},\"PUB00074278\":{\"PMID\":25533961,\"ISBN\":null,\"volume\":null,\"issue\":null,\"year\":2014,\"title\":\"CetZ
