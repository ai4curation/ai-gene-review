    body:
      string: "{\"metadata\":{\"accession\":\"IPR000089\",\"entry_id\":null,\"type\":\"domain\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"profile\":{\"PS50968\":\"Biotinyl/lipoyl
        domain profile\"},\"pfam\":{\"PF00364\":\"Biotin-requiring enzyme\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR000089\",\"name\":\"Biotin/lipoyl
        attachment\",\"type\":\"Domain\",\"children\":[]},\"name\":{\"name\":\"Biotin/lipoyl
        attachment\",\"short\":\"Biotin_lipoyl\"},\"description\":[{\"text\":\"<p>The
        biotin/lipoyl attachment domain has a conserved lysine residue that binds
        biotin or lipoic acid. The 80 residues surrounding the biotinyl-binding lysine
        residue display some sequence similarity to that around the lipoyl-binding
        lysine residue. Biotin plays a catalytic role in some carboxyl transfer reactions
        and is covalently attached, via an amide bond, to a lysine residue in enzymes
        requiring this coenzyme [[cite:PUB00002740]]. E2 acyltransferases have an
        essential cofactor, lipoic acid, which is covalently bound via an amide linkage
        to a lysine group [[cite:PUB00000614]]. The lipoic acid cofactor is found
        in a variety of proteins that include, H-protein of the glycine cleavage system
        (GCS), mammalian and yeast pyruvate dehydrogenases and branched-chain 2-oxo
        acid dehydrogenase complex (BCOADC).</p>\\n\\n<p>The lipoyl domains of 2-oxo
        acid dehydrogenase multienzyme complexes and the biotinyl domains of biotin-dependent
        enzymes have been solved, which revealed that they have homologous structures
        consisting of a flattened 8-stranded -barrel with the target lysine positioned
        in comparable \u03B2-turns. Additional important residues for specificity
        have been identified, such as the conserved methionine flanking the target
        lysine that is essential for the recognition of the biotinyl domain by the
        biotinyl protein ligase [[cite:PUB00014190], [cite:PUB00005256]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00002740\":{\"PMID\":1526981,\"ISBN\":null,\"volume\":\"267\",\"issue\":\"26\",\"year\":1992,\"title\":\"The
        importance of methionine residues for the catalysis of the biotin enzyme,
        transcarboxylase. Analysis by site-directed mutagenesis.\",\"URL\":null,\"raw_pages\":\"18407-12\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Shenoy BC\",\"Xie
        Y\",\"Park VL\",\"Kumar GK\",\"Beegen H\",\"Wood HG\",\"Samols D.\"],\"DOI_URL\":\"http://intl.jbc.org/cgi/reprint/267/26/18407.pdf\"},\"PUB00000614\":{\"PMID\":1825611,\"ISBN\":null,\"volume\":\"1076\",\"issue\":\"2\",\"year\":1991,\"title\":\"Sequence
        similarities within the family of dihydrolipoamide acyltransferases and discovery
        of a previously unidentified fungal enzyme.\",\"URL\":null,\"raw_pages\":\"225-32\",\"medline_journal\":\"Biochim
        Biophys Acta\",\"ISO_journal\":\"Biochim. Biophys. Acta\",\"authors\":[\"Russell
        GC\",\"Guest JR.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0167-4838(91)90271-Z\"},\"PUB00005256\":{\"PMID\":8747466,\"ISBN\":null,\"volume\":\"3\",\"issue\":\"12\",\"year\":1995,\"title\":\"Structure
        of the biotinyl domain of acetyl-coenzyme A carboxylase determined by MAD
        phasing.\",\"URL\":null,\"raw_pages\":\"1407-19\",\"medline_journal\":\"Structure\",\"ISO_journal\":\"Structure\",\"authors\":[\"Athappilly
        FK\",\"Hendrickson WA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0969-2126(01)00277-5\"},\"PUB00014190\":{\"PMID\":8950276,\"ISBN\":null,\"volume\":\"264\",\"issue\":\"1\",\"year\":1996,\"title\":\"Three-dimensional
        structure of the lipoyl domain from the dihydrolipoyl succinyltransferase
        component of the 2-oxoglutarate dehydrogenase multienzyme complex of Escherichia
        coli.\",\"URL\":null,\"raw_pages\":\"179-90\",\"medline_journal\":\"J Mol
        Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Ricaud PM\",\"Howard
        MJ\",\"Roberts EL\",\"Broadhurst RW\",\"Perham RN.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1996.0632\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR011053\",\"name\":\"Single
        hybrid motif\",\"type\":\"homologous_superfamily\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":925,\"interactions\":0,\"matches\":185111,\"pathways\":111,\"proteins\":170165,\"proteomes\":21827,\"sets\":0,\"structural_models\":{\"alphafold\":110917},\"structures\":237,\"taxa\":35582},\"entry_annotations\":{\"alignment:seed\":38,\"alignment:full\":89252},\"cross_references\":{\"prositedoc\":{\"displayName\":\"PROSITE
