        DNA-binding domain superfamily","type":"Homologous_superfamily","children":[]},"name":{"name":"Helix-loop-helix
        DNA-binding domain superfamily","short":"HLH_DNA-bd_sf"},"description":[{"text":"<p>This
        domain is found in a number of eukaryotic proteins, which probably are sequence
        specific DNA-binding proteins that act as transcription factors, share a conserved
        domain of 40 to 50 amino acid residues. It has been proposed [[cite:PUB00000825]]
        that this domain is formed of two amphipathic helices joined by a variable
        length linker region that could form a loop. This ''helix-loop-helix'' (HLH)
        domain mediates protein dimerisation and has been found in the proteins listed
        below [[cite:PUB00001514]]. Most of these proteins have an extra basic region
        of about 15 amino acid residues that is adjacent to the HLH domain and specifically
        binds to DNA. They are referred as basic helix-loop-helix proteins (bHLH),
        and are classified in two groups: class A (ubiquitous) and class B (tissue-specific).
        Members of the bHLH family bind variations on the core sequence ''CANNTG'',
        also referred to as\nthe E-box motif. The homo- or heterodimerisation mediated
        by the HLH domain is independent of, but necessary for DNA binding, as two
        basic regions are required for DNA binding activity. The HLH proteins lacking
        the basic domain (Emc, Id) function as negative regulators, since they form
        heterodimers, but fail to bind DNA. The hairy-related proteins (hairy, E(spl),
        deadpan) also repress transcription although they can bind DNA. The proteins
        of this subfamily act together with co-repressor proteins, like groucho, through
        their -terminal motif WRPW.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00001514":{"PMID":1521738,"ISBN":null,"volume":"6","issue":"12","year":1992,"title":"Function
