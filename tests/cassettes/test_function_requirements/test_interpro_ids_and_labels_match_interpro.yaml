        DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"DM
        DNA-binding domain superfamily\",\"short\":\"DM_DNA-bd_sf\"},\"description\":[{\"text\":\"<p>This
        entry represents the DM DNA-binding domain superfamily.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>DMRT
        genes encode a conserved family of transcription factors that share a unique
        DNA binding motif, the DM domain [[cite:PUB00086561]]. This domain was first
        discovered in the doublesex proteins of Drosophila melanogaster [[cite:PUB00004274]].
        In D. melanogaster the doublesex gene controls somatic sexual differentiation
        by producing alternatively spliced mRNAs encoding related sex-specific polypeptides
        [[cite:PUB00001940]]. These proteins are believed to function as transcription
        factors on downstream sex-determination genes, especially on neuroblast differentiation
        and yolk protein genes transcription [[cite:PUB00007136], [cite:PUB00007137]].
        The DM domain binds DNA as a dimer, allowing the recognition of pseudopalindromic
        sequences [[cite:PUB00001940], [cite:PUB00007138], [cite:PUB00007139]]. The
        NMR analysis of the DSX DM domain [[cite:PUB00007139]] revealed a novel zinc
        module containing 'intertwined' CCHC and HCCC zinc-binding sites with an \u03B1-helical
        fold. The recognition of the DNA requires the carboxy-terminal basic tail
        which contacts the minor groove of the target sequence.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00001940\":{\"PMID\":8978051,\"ISBN\":null,\"volume\":\"144\",\"issue\":\"4\",\"year\":1996,\"title\":\"Functional
        and genetic characterization of the oligomerization and DNA binding properties
        of the Drosophila doublesex proteins.\",\"URL\":null,\"raw_pages\":\"1639-52\",\"medline_journal\":\"Genetics\",\"ISO_journal\":\"Genetics\",\"authors\":[\"Erdman
        SE\",\"Chen HJ\",\"Burtis KC.\"],\"DOI_URL\":\"http://www.pubmedcentral.nih.gov/articlerender.fcgi?tool=EBI&pubmedid=8978051\"},\"PUB00007137\":{\"PMID\":3046751,\"ISBN\":null,\"volume\":\"54\",\"issue\":\"7\",\"year\":1988,\"title\":\"mab-3,
        a gene required for sex-specific yolk protein expression and a male-specific
        lineage in C. elegans.\",\"URL\":null,\"raw_pages\":\"1019-31\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Shen
        MM\",\"Hodgkin J.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0092-8674(88)90117-1\"},\"PUB00007136\":{\"PMID\":1907913,\"ISBN\":null,\"volume\":\"10\",\"issue\":\"9\",\"year\":1991,\"title\":\"The
        doublesex proteins of Drosophila melanogaster bind directly to a sex-specific
        yolk protein gene enhancer.\",\"URL\":null,\"raw_pages\":\"2577-82\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Burtis KC\",\"Coschigano KT\",\"Baker
        BS\",\"Wensink PC.\"],\"DOI_URL\":\"http://ukpmc.ac.uk/picrender.cgi?tool=EBI&pubmedid=1907913&action=stream&blobtype=pdf\"},\"PUB00007139\":{\"PMID\":10898790,\"ISBN\":null,\"volume\":\"14\",\"issue\":\"14\",\"year\":2000,\"title\":\"Sexual
        dimorphism in diverse metazoans is regulated by a novel class of intertwined
