        domain of Mlu1-box binding protein MBP1\"},\"cathgene3d\":{\"G3DSA:3.10.260.10\":\"Transcription
        regulator HTH, APSES-type DNA-binding domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036887\",\"name\":\"HTH
        APSES-type DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"HTH
        APSES-type DNA-binding domain superfamily\",\"short\":\"HTH_APSES_sf\"},\"description\":[{\"text\":\"<p>The
        APSES domain, named after five founding members (ASM-1, Phd1, StuA, EFG1 and
        Sok2), is a sequence-specific DNA-binding domain of approximately 110 residues
        found in a family of fungal transcription factors and other DNA-binding proteins.
        This domain is often found in association with ankyrin repeats (see [interpro:IPR002110])
        and a heterodimerisation domain [[cite:PUB00043683], [cite:PUB00043684]].</p>\\n\\n<p>Structurally,
        the APSES domain adopts a winged helix-turn-helix (HTH) fold, consisting of
        a six-stranded \u03B2-sheet packed against two pairs of \u03B1-helices [[cite:PUB00021230]].
        The \u03B1A/\u03B1B helical pair corresponds to the canonical HTH motif responsible
        for DNA recognition [[cite:PUB00021230], [cite:PUB00019159], [cite:PUB00026907]].</p>\\n\\n<p>APSES
        domain-containing proteins are widespread among fungi and are involved in
        diverse cellular processes, including cell cycle regulation, morphogenesis
        and development. Representative members include:</p>\\n\\n<p>Saccharomyces
        cerevisiae Mlu1 box-binding protein MBP1 ([swissprot:P39678]), which together
        with Swi6 forms the MBF (Mlu1-binding factor) transcription factor complex
        that binds to Mlu1 cell-cycle box (MCB) elements in the promoters of DNA synthesis
        genes [[cite:PUB00026907]].</p>\\n\\n<p>Schizosaccharomyces pombe cell division
        cycle-related proteins Res1/Sct1 ([swissprot:P33520]) and Res2/Pct1 ([swissprot:P41412]),
        which are functional homologues of MBP1.</p>\\n\\n<p>S. pombe starts control
        protein Cdc10 ([swissprot:P01129]).</p>\\n\\n<p>Aspergillus nidulans developmental
        regulator StuA ([swissprot:P36011]), which controls the transformation of
        undifferentiated hyphal elements into complex multicellular structures.</p>\\n\\n<p>S.
        cerevisiae transcription factor Phd1 ([swissprot:P36093]).</p>\\n\\n<p>S.
        cerevisiae protein Sok2 ([swissprot:P53438]), a repressor of the transition
        from unicellular growth to pseudohyphal development.</p>\\n\\n<p>Candida albicans
        enhanced filamentous growth protein Efg1 ([swissprot:P43064]).</p>\\n\\n<p>Neurospora
        crassa ascospore maturation protein Asm-1 ([swissprot:Q92251]), which functions
        in spore maturation.</p>\\n\\n<p>S. pombe bouquet formation protein Bqt4 ([swissprot:O60158]),
        a nuclear membrane protein that connects telomeres to the nuclear envelope
        during vegetative growth and meiosis. Unlike other family members, Bqt4 does
        not appear to bind DNA directly but instead functions as an adaptor between
        Bqt3 and Rap1 [[cite:PUB00087159]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00043683\":{\"PMID\":8913744,\"ISBN\":null,\"volume\":\"144\",\"issue\":\"3\",\"year\":1996,\"title\":\"Asm-1+,
        a Neurospora crassa gene related to transcriptional regulators of fungal development.\",\"URL\":null,\"raw_pages\":\"991-1003\",\"medline_journal\":\"Genetics\",\"ISO_journal\":\"Genetics\",\"authors\":[\"Aramayo
        R\",\"Peleg Y\",\"Addison R\",\"Metzenberg R.\"],\"DOI_URL\":\"http://ukpmc.ac.uk/articlerender.cgi?tool=EBI&pubmedid=8913744\"},\"PUB00019159\":{\"PMID\":9299332,\"ISBN\":null,\"volume\":\"272\",\"issue\":\"1\",\"year\":1997,\"title\":\"The
        X-ray structure of the DNA-binding domain from the Saccharomyces cerevisiae
        cell-cycle transcription factor Mbp1 at 2.1 A resolution.\",\"URL\":null,\"raw_pages\":\"1-8\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Taylor IA\",\"Treiber
        MK\",\"Olivi L\",\"Smerdon SJ.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1997.1229\"},\"PUB00026907\":{\"PMID\":12564929,\"ISBN\":null,\"volume\":\"42\",\"issue\":\"5\",\"year\":2003,\"title\":\"NMR
        structure of the DNA-binding domain of the cell cycle protein Mbp1 from Saccharomyces
        cerevisiae.\",\"URL\":null,\"raw_pages\":\"1266-73\",\"medline_journal\":\"Biochemistry\",\"ISO_journal\":\"Biochemistry\",\"authors\":[\"Nair
        M\",\"McIntosh PB\",\"Frenkiel TA\",\"Kelly G\",\"Taylor IA\",\"Smerdon SJ\",\"Lane
        AN.\"],\"DOI_URL\":\"http://dx.doi.org/10.1021/bi0205247\"},\"PUB00043684\":{\"PMID\":9312029,\"ISBN\":null,\"volume\":\"16\",\"issue\":\"18\",\"year\":1997,\"title\":\"StuAp
        is a sequence-specific transcription factor that regulates developmental complexity
        in Aspergillus nidulans.\",\"URL\":null,\"raw_pages\":\"5710-21\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Dutton JR\",\"Johns S\",\"Miller
        BL.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/emboj/16.18.5710\"},\"PUB00021230\":{\"PMID\":9083114,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"3\",\"year\":1997,\"title\":\"Crystal
        structure of the DNA-binding domain of Mbp1, a transcription factor important
        in cell-cycle control of DNA synthesis.\",\"URL\":null,\"raw_pages\":\"349-58\",\"medline_journal\":\"Structure\",\"ISO_journal\":\"Structure\",\"authors\":[\"Xu
        RM\",\"Koch C\",\"Liu Y\",\"Horton JR\",\"Knapp D\",\"Nasmyth K\",\"Cheng
        X.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0969-2126(97)00192-5\"},\"PUB00087159\":{\"PMID\":19948484,\"ISBN\":null,\"volume\":\"187\",\"issue\":\"3\",\"year\":2009,\"title\":\"Membrane
        proteins Bqt3 and -4 anchor telomeres to the nuclear envelope to ensure chromosomal
        bouquet formation.\",\"URL\":null,\"raw_pages\":\"413-27\",\"medline_journal\":\"J
        Cell Biol\",\"ISO_journal\":\"J. Cell Biol.\",\"authors\":[\"Chikashige Y\",\"Yamane
        M\",\"Okamasa K\",\"Tsutsumi C\",\"Kojidani T\",\"Sato M\",\"Haraguchi T\",\"Hiraoka
        Y.\"],\"DOI_URL\":\"https://doi.org/10.1083/jcb.200902122\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR003163\",\"name\":\"Transcription
        regulator HTH, APSES-type DNA-binding domain\",\"type\":\"domain\"}],\"counters\":{\"subfamilies\":0,\"domain_architectures\":0,\"interactions\":0,\"matches\":8580,\"pathways\":0,\"proteins\":8496,\"proteomes\":1864,\"sets\":0,\"structural_models\":{\"alphafold\":6837},\"structures\":8,\"taxa\":4094},\"entry_annotations\":{},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"1bm8\",\"name\":\"DNA-BINDING
        DOMAIN OF MBP1\"}}}"
