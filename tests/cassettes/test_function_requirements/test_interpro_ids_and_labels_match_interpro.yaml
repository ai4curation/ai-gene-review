        Life","ISO_journal":"IUBMB Life","authors":["Matthews JM","Sunde M."],"DOI_URL":"http://dx.doi.org/10.1080/15216540216035"}},"set_info":null,"overlaps_with":null,"counters":{"subfamilies":0,"domain_architectures":118,"interactions":0,"matches":16894,"pathways":0,"proteins":16831,"proteomes":424,"sets":0,"structural_models":{"alphafold":13771},"structures":1,"taxa":1224},"entry_annotations":{"alignment:seed":43,"alignment:full":10279},"cross_references":{"prositedoc":{"displayName":"PROSITE
