      string: '{"metadata":{"accession":"IPR013324","entry_id":null,"type":"homologous_superfamily","go_terms":null,"source_database":"interpro","member_databases":{"ssf":{"SSF88659":"Sigma3
        and sigma4 domains of RNA polymerase sigma factors"}},"integrated":null,"hierarchy":{"accession":"IPR013324","name":"RNA
        polymerase sigma factor, region 3/4-like","type":"Homologous_superfamily","children":[]},"name":{"name":"RNA
        polymerase sigma factor, region 3/4-like","short":"RNA_pol_sigma_r3/r4-like"},"description":[{"text":"<p>This
        entry represents regions 3 and 4 (or sigma3 and sigma4 domains) found in several
        sigma factors, often in conjunction with the sigma2 domain ([interpro:IPR013325]).
        Both regions 3 and 4 are present in Sigma70 [[cite:PUB00000942]], Sigma28
        (FliA), and SigA [[cite:PUB00010042]], while region4 is also found in SigmaF
        [[cite:PUB00011848]] and RpoE. Regions 3 and 4 have a nucleotide-binding 3-helical
        core structure, consisting of a closed or partly open bundle with a right-handed
        twist. Some other nucleotide-binding proteins are thought to contain domains
        with a similar topology.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>The
        bacterial core RNA polymerase complex, which consists of five subunits, is
        sufficient for transcription elongation and termination but is unable to initiate
        transcription. Transcription initiation from promoter elements requires a
        sixth, dissociable subunit called a sigma factor, which reversibly associates
        with the core RNA polymerase complex to form a holoenzyme [[cite:PUB00000061]].
        RNA polymerase recruits alternative sigma factors as a means of switching
        on specific regulons. Most bacteria express a multiplicity of sigma factors.
        Two of these factors, sigma-70 (gene rpoD), generally known as the major or
        primary sigma factor, and sigma-54 (gene rpoN or ntrA) direct the transcription
        of a wide variety of genes. The other sigma factors, known as alternative
        sigma factors, are required for the transcription of specific subsets of genes.</p>\n\n<p>With
        regard to sequence similarity, sigma factors can be grouped into two classes,
        the sigma-54 and sigma-70 families. Sequence alignments of the sigma70 family
        members reveal four conserved regions that can be further divided into subregions
        eg. sub-region 2.2, which may be involved in the binding of the sigma factor
        to the core RNA polymerase; and sub-region 4.2, which seems to harbor a DNA-binding
        ''helix-turn-helix'' motif involved in binding the conserved -35 region of
        promoters recognised by the major sigma factors [[cite:PUB00004340], [cite:PUB00002181]].</p>\n\n<p>The
        plastids of higher plants originating from an ancestral cyanobacterial endosymbiont
        also contain sigma factors that are encoded by a small family of nuclear genes.
        All plastid sigma factors belong to the superfamily of sigmaA/sigma70 and
        have sequences homologous to the conserved regions 1.2, 2, 3, and 4 of bacterial
        sigma factors [[cite:PUB00088319]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00004340":{"PMID":3092189,"ISBN":null,"volume":"14","issue":"16","year":1986,"title":"Sigma
        factors from E. coli, B. subtilis, phage SP01, and phage T4 are homologous
        proteins.","URL":null,"raw_pages":"6745-63","medline_journal":"Nucleic Acids
        Res","ISO_journal":"Nucleic Acids Res.","authors":["Gribskov M","Burgess RR."],"DOI_URL":"http://dx.doi.org/10.1093/nar/14.16.6745"},"PUB00002181":{"PMID":1597408,"ISBN":null,"volume":"174","issue":"12","year":1992,"title":"The
        sigma 70 family: sequence conservation and evolutionary relationships.","URL":null,"raw_pages":"3843-9","medline_journal":"J
        Bacteriol","ISO_journal":"J. Bacteriol.","authors":["Lonetto M","Gribskov
        M","Gross CA."],"DOI_URL":"http://jb.asm.org/cgi/content/abstract/174/12/3843"},"PUB00000061":{"PMID":3052291,"ISBN":null,"volume":"57","issue":null,"year":1988,"title":"Structure
