      string: "{\"metadata\":{\"accession\":\"IPR011761\",\"entry_id\":null,\"type\":\"domain\",\"go_terms\":[{\"identifier\":\"GO:0005524\",\"name\":\"ATP
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0046872\",\"name\":\"metal
        ion binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"profile\":{\"PS50975\":\"ATP-grasp
        fold profile\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR011761\",\"name\":\"ATP-grasp
        fold\",\"type\":\"Domain\",\"children\":[{\"accession\":\"IPR003806\",\"name\":\"ATP-grasp
