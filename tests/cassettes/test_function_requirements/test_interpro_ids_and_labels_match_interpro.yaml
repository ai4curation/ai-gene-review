        drive the synthesis of ATP.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00020604":{"PMID":15078220,"ISBN":null,"volume":"5","issue":"2","year":2004,"title":"Mechanisms
