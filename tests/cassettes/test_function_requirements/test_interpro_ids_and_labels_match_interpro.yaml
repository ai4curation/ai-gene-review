    body:
      string: "{\"metadata\":{\"accession\":\"IPR016032\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF46894\":\"C-terminal
        effector domain of the bipartite response regulators\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR016032\",\"name\":\"Signal
        transduction response regulator, C-terminal effector\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Signal
        transduction response regulator, C-terminal effector\",\"short\":\"Sig_transdc_resp-reg_C-effctor\"},\"description\":[{\"text\":\"<p>This
        entry represents a structural domain usually found at the C-terminal of bipartite
        response regulators. These proteins are known to bind to DNA and RNA polymerases,
        and their N-terminal receiver domain belongs to the CheY family. The C-terminal
        effector domain consists of a 3-helical bundle in an up-an-down arrangement
        with a right-handed twist. This domain occurs in:</p>\\r\\n\\r\\n\\n<ul><li>PhoB-like
        proteins, which includes PhoB [[cite:PUB00013308]], OmpR [[cite:PUB00022327]],
        and DrrB [[cite:PUB00022388]]; these proteins contain a 4-stranded meander
        \u03B2-sheet in the N-terminal extension.</li>\\r\\n\\r\\n<li>GerE-like proteins
        from the LuxR/UhpA family of proteins, which includes GerE [[cite:PUB00016941]],
        TraR (quorum-sensing) [[cite:PUB00016950]], NarL (nitrate/nitrite response
        regulator) [[cite:PUB00036081]], and RcsB transcriptional regulator [[cite:PUB00016947]];
        these proteins contain an additional fourth helix in the C-terminal extension.</li>\\r\\n\\r\\n<li>Spo0A
        proteins [[cite:PUB00014650]], which are elaborated with additional helices.</li></ul>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>Two-component
        signal transduction systems enable bacteria to sense, respond, and adapt to
        a wide range of environments, stressors, and growth conditions [[cite:PUB00042804]].
        \ Some bacteria can contain up to as many as 200 two-component systems that
        need tight regulation to prevent unwanted cross-talk [[cite:PUB00042805]].
        These pathways have been adapted to response to a wide variety of stimuli,
        including nutrients, cellular redox state, changes in osmolarity, quorum signals,
        antibiotics, and more [[cite:PUB00010651]]. Two-component systems are comprised
        of a sensor histidine kinase (HK) and its cognate response regulator (RR)
        [[cite:PUB00011096]]. The HK catalyses its own auto-phosphorylation followed
        by the transfer of the phosphoryl group to the receiver domain on RR; phosphorylation
        of the RR usually activates an attached output domain, which can then effect
        changes in cellular physiology, often by regulating gene expression. Some
        HK are bifunctional, catalysing both the phosphorylation and dephosphorylation
        of their cognate RR. The input stimuli can regulate either the kinase or phosphatase
        activity of the bifunctional HK.</p>\\r\\n<p>A variant of the two-component
        system is the phospho-relay system. Here a hybrid HK auto-phosphorylates and
        then transfers the phosphoryl group to an internal receiver domain, rather
        than to a separate RR protein. The phosphoryl group is then shuttled to histidine
        phosphotransferase (HPT) and subsequently to a terminal RR, which can evoke
        the desired response [[cite:PUB00042806], [cite:PUB00042807]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00042804\":{\"PMID\":16176121,\"ISBN\":null,\"volume\":\"3\",\"issue\":\"10\",\"year\":2005,\"title\":\"Two-component
        signal transduction pathways regulating growth and cell cycle progression
        in a bacterium: a system-level analysis.\",\"URL\":null,\"raw_pages\":\"e334\",\"medline_journal\":\"PLoS
        Biol\",\"ISO_journal\":\"PLoS Biol.\",\"authors\":[\"Skerker JM\",\"Prasol
        MS\",\"Perchuk BS\",\"Biondi EG\",\"Laub MT.\"],\"DOI_URL\":\"http://dx.doi.org/10.1371/journal.pbio.0030334\"},\"PUB00042805\":{\"PMID\":18076326,\"ISBN\":null,\"volume\":\"41\",\"issue\":null,\"year\":2007,\"title\":\"Specificity
        in two-component signal transduction pathways.\",\"URL\":null,\"raw_pages\":\"121-45\",\"medline_journal\":\"Annu
        Rev Genet\",\"ISO_journal\":\"Annu. Rev. Genet.\",\"authors\":[\"Laub MT\",\"Goulian
        M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1146/annurev.genet.41.042007.170548\"},\"PUB00010651\":{\"PMID\":12372152,\"ISBN\":null,\"volume\":\"3\",\"issue\":\"10\",\"year\":2002,\"title\":\"Histidine
        protein kinases: key signal transducers outside the animal kingdom.\",\"URL\":null,\"raw_pages\":\"REVIEWS3013\",\"medline_journal\":\"Genome
        Biol\",\"ISO_journal\":\"Genome Biol.\",\"authors\":[\"Wolanin PM\",\"Thomason
        PA\",\"Stock JB.\"],\"DOI_URL\":\"http://ukpmc.ac.uk/articlerender.cgi?tool=EBI&pubmedid=12372152\"},\"PUB00011096\":{\"PMID\":10966457,\"ISBN\":null,\"volume\":\"69\",\"issue\":null,\"year\":2000,\"title\":\"Two-component
        signal transduction.\",\"URL\":null,\"raw_pages\":\"183-215\",\"medline_journal\":\"Annu
        Rev Biochem\",\"ISO_journal\":\"Annu. Rev. Biochem.\",\"authors\":[\"Stock
        AM\",\"Robinson VL\",\"Goudreau PN.\"],\"DOI_URL\":\"http://dx.doi.org/10.1146/annurev.biochem.69.1.183\"},\"PUB00042806\":{\"PMID\":11934609,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"2\",\"year\":2002,\"title\":\"Molecular
        recognition of bacterial phosphorelay proteins.\",\"URL\":null,\"raw_pages\":\"142-8\",\"medline_journal\":\"Curr
        Opin Microbiol\",\"ISO_journal\":\"Curr. Opin. Microbiol.\",\"authors\":[\"Varughese
        KI.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S1369-5274(02)00305-3\"},\"PUB00042807\":{\"PMID\":11489844,\"ISBN\":null,\"volume\":\"183\",\"issue\":\"17\",\"year\":2001,\"title\":\"Keeping
        signals straight in phosphorelay signal transduction.\",\"URL\":null,\"raw_pages\":\"4941-9\",\"medline_journal\":\"J
        Bacteriol\",\"ISO_journal\":\"J. Bacteriol.\",\"authors\":[\"Hoch JA\",\"Varughese
        KI.\"],\"DOI_URL\":\"http://dx.doi.org/10.1128/JB.183.17.4941-4949.2001\"},\"PUB00014650\":{\"PMID\":11069648,\"ISBN\":null,\"volume\":\"38\",\"issue\":\"2\",\"year\":2000,\"title\":\"The
        trans-activation domain of the sporulation response regulator Spo0A revealed
        by X-ray crystallography.\",\"URL\":null,\"raw_pages\":\"198-212\",\"medline_journal\":\"Mol
