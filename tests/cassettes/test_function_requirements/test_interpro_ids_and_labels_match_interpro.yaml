        Cell","ISO_journal":"Mol. Cell","authors":["Walker EH","Pacold ME","Perisic
        O","Stephens L","Hawkins PT","Wymann MP","Williams RL."],"DOI_URL":"http://dx.doi.org/10.1016/S1097-2765(05)00089-4"},"PUB00014025":{"PMID":12191603,"ISBN":null,"volume":"93","issue":"2-3","year":2002,"title":"Structural
        aspects of protein kinase control-role of conformational flexibility.","URL":null,"raw_pages":"99-111","medline_journal":"Pharmacol
        Ther","ISO_journal":"Pharmacol. Ther.","authors":["Engh RA","Bossemeyer D."],"DOI_URL":"http://dx.doi.org/10.1016/S0163-7258(02)00180-8"},"PUB00014030":{"PMID":11467935,"ISBN":null,"volume":"40","issue":"30","year":2001,"title":"Structural
