      string: "{\"metadata\":{\"accession\":\"IPR036093\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:2.170.150.80\":\"NAC
        domain\"},\"ssf\":{\"SSF101941\":\"NAC domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036093\",\"name\":\"NAC
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"NAC
        domain superfamily\",\"short\":\"NAC_dom_sf\"},\"description\":[{\"text\":\"<p>This
        entry represents the NAC domain superfamily.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>The
        NAC domain (for Petunia hybrida (Petunia) NAM and for Arabidopsis ATAF1, ATAF2,
        and CUC2) is an N-terminal module of ~160 amino acids, which is found in proteins
        of the NAC family of plant-specific transcriptional regulators (no apical
        meristem (NAM) proteins) [[cite:PUB00015417]]. NAC proteins are involved in
        developmental processes, including formation of the shoot apical meristem,
        floral organs and lateral shoots, as well as in plant hormonal control and
        defence. The NAC domain is accompanied by diverse C-terminal transcriptional
        activation domains. The NAC domain has been shown to be a DNA-binding domain
        (DBD) and a dimerization domain [[cite:PUB00015418], [cite:PUB00015419]].</p>\\n\\n<p>The
        NAC domain can be subdivided into five subdomains (A-E). Each subdomain is
        distinguishable by blocks of heterogeneous amino acids or gaps. While the
        NAC domains were rich in basic amino acids (R, K and H) as a whole, the distribution
        of positive and negative amino acids in each subdomain were unequal. Subdomains
        C and D are rich in basic amino acids but poor in acidic amino acids, while
        subdomain B contains a high proportion of acidic amino acids. Putative nuclear
        localization signals (NLS) have been detected in subdomains C and D [[cite:PUB00015420]].
        The DBD is contained within a 60 amino acid region located within subdomains
        D and E [[cite:PUB00015419]]. The overall structure of the NAC domain monomer
        consists of a very twisted antiparallel \u03B2-sheet, which packs against
        an N-terminal \u03B1-helix on one side and one shorter helix on the other
        side surrounded by a few helical elements. The structure suggests that the
        NAC domain mediates dimerization through conserved interactions including
        a salt bridge, and DNA binding through the NAC dimer face rich in positive
        charges [[cite:PUB00015421]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00015421\":{\"PMID\":15083810,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"3\",\"year\":2004,\"title\":\"Structure
        of the conserved domain of ANAC, a member of the NAC family of transcription
        factors.\",\"URL\":null,\"raw_pages\":\"297-303\",\"medline_journal\":\"EMBO
        Rep\",\"ISO_journal\":\"EMBO Rep.\",\"authors\":[\"Ernst HA\",\"Olsen AN\",\"Larsen
        S\",\"Lo Leggio L.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/sj.embor.7400093\"},\"PUB00015420\":{\"PMID\":10660065,\"ISBN\":null,\"volume\":\"262\",\"issue\":\"6\",\"year\":2000,\"title\":\"Molecular
        analysis of the NAC gene family in rice.\",\"URL\":null,\"raw_pages\":\"1047-51\",\"medline_journal\":\"Mol
        Gen Genet\",\"ISO_journal\":\"Mol. Gen. Genet.\",\"authors\":[\"Kikuchi K\",\"Ueguchi-Tanaka
        M\",\"Yoshida KT\",\"Nagato Y\",\"Matsusoka M\",\"Hirano HY.\"],\"DOI_URL\":\"http://dx.doi.org/10.1007/PL00008647\"},\"PUB00015418\":{\"PMID\":11114891,\"ISBN\":null,\"volume\":\"14\",\"issue\":\"23\",\"year\":2000,\"title\":\"Arabidopsis
        NAC1 transduces auxin signal downstream of TIR1 to promote lateral root development.\",\"URL\":null,\"raw_pages\":\"3024-36\",\"medline_journal\":\"Genes
        Dev\",\"ISO_journal\":\"Genes Dev.\",\"authors\":[\"Xie Q\",\"Frugis G\",\"Colgan
        D\",\"Chua NH.\"],\"DOI_URL\":\"http://dx.doi.org/10.1101/gad.852200\"},\"PUB00015419\":{\"PMID\":12175016,\"ISBN\":null,\"volume\":\"50\",\"issue\":\"2\",\"year\":2002,\"title\":\"Molecular
        characterization of AtNAM: a member of the Arabidopsis NAC domain superfamily.\",\"URL\":null,\"raw_pages\":\"237-48\",\"medline_journal\":\"Plant
        Mol Biol\",\"ISO_journal\":\"Plant Mol. Biol.\",\"authors\":[\"Duval M\",\"Hsieh
        TF\",\"Kim SY\",\"Thomas TL.\"],\"DOI_URL\":\"http://dx.doi.org/10.1023/A:1016028530943\"},\"PUB00015417\":{\"PMID\":9212461,\"ISBN\":null,\"volume\":\"9\",\"issue\":\"6\",\"year\":1997,\"title\":\"Genes
        involved in organ separation in Arabidopsis: an analysis of the cup-shaped
        cotyledon mutant.\",\"URL\":null,\"raw_pages\":\"841-57\",\"medline_journal\":\"Plant
