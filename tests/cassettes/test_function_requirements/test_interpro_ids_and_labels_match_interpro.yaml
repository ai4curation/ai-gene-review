        domain\",\"type\":\"Domain\",\"children\":[]},\"name\":{\"name\":\"PPC domain\",\"short\":\"PPC_dom\"},\"description\":[{\"text\":\"<p>The
        Plants and Prokaryotes Conserved (PPC) domain contains a hydrophobic region
        in the C-terminal, and in the case of plants, is often found in several proteins
        with the AT-hook motif. Proteins with PPC domains are found in Bacteria, Archaea
        and the plant kingdom [[cite:PUB00074814], [cite:PUB00040306]].</p>\\n\\n<p>The
        PPC domain has a single \u03B1-helix packed against an antiparallel \u03B2-sheet,
        which is formed by five \u03B2-strands. Three conserved histidine residues
        appear to form a zinc-binding site, and the domain has been observed to form
        homotrimers. The domain co-occurs with a thioredoxin-like domain in uncharacterised
        cyanobacterial proteins [[cite:PUB00040306]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00074814\":{\"PMID\":15604740,\"ISBN\":null,\"volume\":\"56\",\"issue\":\"2\",\"year\":2004,\"title\":\"Identification
