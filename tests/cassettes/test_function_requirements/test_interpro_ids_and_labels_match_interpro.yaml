        gammaproteobacterial\",\"type\":\"Family\",\"children\":[]},{\"accession\":\"IPR002299\",\"name\":\"Porin,
        Neisseria sp. type\",\"type\":\"Family\",\"children\":[]}]},\"name\":{\"name\":\"Porin,
        Gram-negative type\",\"short\":\"Porin_Gram-ve\"},\"description\":[{\"text\":\"<p>This
        entry represents porins from Gram-negative bacteria.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>Porins
        are found in the outer membranes of Gram-negative bacteria, mitochondria and
        chloroplasts, where they form ion-selective channels for small hydrophilic
        molecules (up to ~600 D) [[cite:PUB00005073], [cite:PUB00003829]]. X-ray structure
        analyses of several bacterial porins [[cite:PUB00001604], [cite:PUB00003475],
        [cite:PUB00003334]] have revealed a large 16-stranded anti-parallel \u03B2-barrel
        structure enclosing the transmembrane pore, by contrast with all other integral
        membrane proteins described to date, which are \u03B1-helical. Three subunits
        form a trimer; the 3-fold axis is approximately parallel to the barrel axes
        and is assumed to be perpendicular to the membrane plane.</p>\\n\\n<p>From
        the range of porins now known, similarities have been observed between porins
        from different species, and between porins of different specificity within
        the same species. But most porins cannot be related to each other on the basis
        of sequence alone, and this is reflected in the lengths of the known porin
        sequences, which range from 282-483 residues/monomer.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00003334\":{\"PMID\":7525973,\"ISBN\":null,\"volume\":\"243\",\"issue\":\"5\",\"year\":1994,\"title\":\"Refined
        structure of the porin from Rhodopseudomonas blastica. Comparison with the
        porin from Rhodobacter capsulatus.\",\"URL\":null,\"raw_pages\":\"891-905\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Kreusch A\",\"Schulz
        GE.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1994.1690\"},\"PUB00003829\":{\"PMID\":1373213,\"ISBN\":null,\"volume\":\"6\",\"issue\":\"4\",\"year\":1992,\"title\":\"Porins
        and specific channels of bacterial outer membranes.\",\"URL\":null,\"raw_pages\":\"435-42\",\"medline_journal\":\"Mol
        Microbiol\",\"ISO_journal\":\"Mol. Microbiol.\",\"authors\":[\"Nikaido H.\"],\"DOI_URL\":\"http://dx.doi.org/10.1111/j.1365-2958.1992.tb01487.x\"},\"PUB00003475\":{\"PMID\":1725488,\"ISBN\":null,\"volume\":\"107\",\"issue\":\"2\",\"year\":1991,\"title\":\"A
        common channel-forming motif in evolutionarily distant porins.\",\"URL\":null,\"raw_pages\":\"136-45\",\"medline_journal\":\"J
        Struct Biol\",\"ISO_journal\":\"J. Struct. Biol.\",\"authors\":[\"Pauptit
        RA\",\"Schirmer T\",\"Jansonius JN\",\"Rosenbusch JP\",\"Parker MW\",\"Tucker
