      string: '{"metadata":{"accession":"IPR008207","entry_id":null,"type":"domain","go_terms":[{"identifier":"GO:0000160","name":"phosphorelay
        signal transduction system","category":{"code":"P","name":"biological_process"}}],"source_database":"interpro","member_databases":{"cdd":{"cd00088":"HPT"},"profile":{"PS50894":"Histidine-containing
        phosphotransfer (HPt) domain profile"},"pfam":{"PF01627":"Hpt domain"},"smart":{"SM00073":"Histidine
        Phosphotransfer domain"}},"integrated":null,"hierarchy":{"accession":"IPR008207","name":"Signal
        transduction histidine kinase, phosphotransfer (Hpt) domain","type":"Domain","children":[]},"name":{"name":"Signal
        transduction histidine kinase, phosphotransfer (Hpt) domain","short":"Sig_transdc_His_kin_Hpt_dom"},"description":[{"text":"<p>Two-component
        signal transduction systems enable bacteria to sense, respond, and adapt to
        a wide range of environments, stressors, and growth conditions [[cite:PUB00042804]].  Some
        bacteria can contain up to as many as 200 two-component systems that need
        tight regulation to prevent unwanted cross-talk [[cite:PUB00042805]]. These
        pathways have been adapted to response to a wide variety of stimuli, including
        nutrients, cellular redox state, changes in osmolarity, quorum signals, antibiotics,
        and more [[cite:PUB00010651]]. Two-component systems are comprised of a sensor
        histidine kinase (HK) and its cognate response regulator (RR) [[cite:PUB00011096]].
        The HK catalyses its own auto-phosphorylation followed by the transfer of
        the phosphoryl group to the receiver domain on RR; phosphorylation of the
        RR usually activates an attached output domain, which can then effect changes
        in cellular physiology, often by regulating gene expression. Some HK are bifunctional,
        catalysing both the phosphorylation and dephosphorylation of their cognate
        RR. The input stimuli can regulate either the kinase or phosphatase activity
        of the bifunctional HK.</p>\r\n<p>A variant of the two-component system is
        the phospho-relay system. Here a hybrid HK auto-phosphorylates and then transfers
        the phosphoryl group to an internal receiver domain, rather than to a separate
        RR protein. The phosphoryl group is then shuttled to histidine phosphotransferase
        (HPT) and subsequently to a terminal RR, which can evoke the desired response
        [[cite:PUB00042806], [cite:PUB00042807]].</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Signal
        transducing histidine kinases are the key elements in two-component signal
        transduction systems, which control complex processes such as the initiation
        of development in microorganisms [[cite:PUB00013246], [cite:PUB00007866]].
        Examples of histidine kinases are EnvZ, which plays a central role in osmoregulation
        [[cite:PUB00013247]], and CheA, which plays a central role in the chemotaxis
        system [[cite:PUB00000966]]. Histidine kinases usually have an N-terminal
        ligand-binding domain and a C-terminal kinase domain, but other domains may
        also be present.  The kinase domain is responsible for the autophosphorylation
        of the histidine with ATP, the phosphotransfer from the kinase to an aspartate
        of the response regulator, and (with bifunctional enzymes) the phosphotransfer
        from aspartyl phosphate back to ADP or to water [[cite:PUB00020801]]. The
        kinase core has a unique fold, distinct from that of the Ser/Thr/Tyr kinase
        superfamily.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>This
        entry represents a domain present at the N terminus in proteins which undergo
        autophosphorylation. The group includes, the gliding motility regulatory protein
        from Myxococcus xanthus and a number of bacterial chemotaxis proteins.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00042804":{"PMID":16176121,"ISBN":null,"volume":"3","issue":"10","year":2005,"title":"Two-component
        signal transduction pathways regulating growth and cell cycle progression
