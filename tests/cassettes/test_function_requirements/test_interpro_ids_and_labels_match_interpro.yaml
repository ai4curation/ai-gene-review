      string: "{\"metadata\":{\"accession\":\"IPR036890\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF55874\":\"ATPase
        domain of HSP90 chaperone/DNA topoisomerase II/histidine kinase\"},\"cathgene3d\":{\"G3DSA:3.30.565.10\":\"Histidine
        kinase-like ATPase, C-terminal domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036890\",\"name\":\"Histidine
        kinase/HSP90-like ATPase superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Histidine
        kinase/HSP90-like ATPase superfamily\",\"short\":\"HATPase_C_sf\"},\"description\":[{\"text\":\"<p>This
        domain superfamily is found in several ATP-binding proteins, including: DNA
        mismatch repair protein MutL, Chaperone protein HtpG, DNA gyrase subunit B,
        Anti-sigma F factor, histidine kinase [[cite:PUB00030541]], topoisomerases
        [[cite:PUB00022659]], heat shock protein HSP90 [[cite:PUB00031400], [cite:PUB00031884],
        [cite:PUB00031942]], phytochrome-like ATPases and DNA mismatch repair proteins.
        The fold of this domain consists of two layers, \u03B1/\u03B2, which contains
        an 8-stranded mixed \u03B2-sheet.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>DNA
        mismatch repair protein MutL is an essential component of the methyl-directed
        mismatch repair (MMR) system, which corrects replication errors and maintains
        genomic integrity. MutL functions in the Dam-dependent MMR pathway, where
        the methylation status of GATC sequences is used to distinguish the parental
        strand from the newly synthesised strand containing the replication error.
        MutL acts as a molecular matchmaker, facilitating the ATP-dependent assembly
        of stable complexes between DNA-binding proteins involved in the repair process
        without itself remaining part of the final effector complex. Following mismatch
        recognition by MutS, MutL is recruited to the site of damage, where it coordinates
        downstream repair events, including activation of the endonuclease MutH and
        recruitment of the UvrD helicase and exonucleases required for excision of
        the error-containing strand. The ATPase activity of MutL, mediated by its
        N-terminal GHKL domain, is essential for these functions, driving the conformational
        changes necessary for proper coordination of the repair machinery [[cite:PUB00163295],
        [cite:PUB00023516]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00022659\":{\"PMID\":15105144,\"ISBN\":null,\"volume\":\"48\",\"issue\":\"5\",\"year\":2004,\"title\":\"Crystal
        structures of Escherichia coli topoisomerase IV ParE subunit (24 and 43 kilodaltons):
        a single residue dictates differences in novobiocin potency against topoisomerase
        IV and DNA gyrase.\",\"URL\":null,\"raw_pages\":\"1856-64\",\"medline_journal\":\"Antimicrob
        Agents Chemother\",\"ISO_journal\":\"Antimicrob. Agents Chemother.\",\"authors\":[\"Bellon
        S\",\"Parsons JD\",\"Wei Y\",\"Hayakawa K\",\"Swenson LL\",\"Charifson PS\",\"Lippke
        JA\",\"Aldape R\",\"Gross CH.\"],\"DOI_URL\":\"http://dx.doi.org/10.1128/AAC.48.5.1856-1864.2004\"},\"PUB00031400\":{\"PMID\":15292259,\"ISBN\":null,\"volume\":\"279\",\"issue\":\"44\",\"year\":2004,\"title\":\"Ligand-induced
        conformational shift in the N-terminal domain of GRP94, an Hsp90 chaperone.\",\"URL\":null,\"raw_pages\":\"46162-71\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Immormino RM\",\"Dollins
        DE\",\"Shaffer PL\",\"Soldano KL\",\"Walker MA\",\"Gewirth DT.\"],\"DOI_URL\":\"http://dx.doi.org/10.1074/jbc.M405253200\"},\"PUB00031884\":{\"PMID\":14718169,\"ISBN\":null,\"volume\":\"116\",\"issue\":\"1\",\"year\":2004,\"title\":\"The
        Mechanism of Hsp90 regulation by the protein kinase-specific cochaperone p50(cdc37).\",\"URL\":null,\"raw_pages\":\"87-98\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Roe
        SM\",\"Ali MM\",\"Meyer P\",\"Vaughan CK\",\"Panaretou B\",\"Piper PW\",\"Prodromou
        C\",\"Pearl LH.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0092-8674(03)01027-4\"},\"PUB00031942\":{\"PMID\":15217611,\"ISBN\":null,\"volume\":\"11\",\"issue\":\"6\",\"year\":2004,\"title\":\"Structure-activity
        relationships in purine-based inhibitor binding to HSP90 isoforms.\",\"URL\":null,\"raw_pages\":\"775-85\",\"medline_journal\":\"Chem
        Biol\",\"ISO_journal\":\"Chem. Biol.\",\"authors\":[\"Wright L\",\"Barril
