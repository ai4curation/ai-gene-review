        primase/polymerase protein","type":"Family","children":[]},"name":{"name":"DNA-directed
        primase/polymerase protein","short":"PRIMPOL"},"description":[{"text":"<p>PRIMPOL
        has both DNA polymerase and DNA/RNA primase activities. It is involved in
        downstream repriming of stalled forks during both nuclear and mitochondrial
        DNA replication. It pays an important part in DNA damage tolerance [[cite:PUB00097590]].
        It is predicted to possess an archaeo-eukaryotic primase and a UL52-like zinc
        finger domain [[cite:PUB00097587], [cite:PUB00097588]]. The primase activity
        of PRIMPOL is essential for many functions in the nucleus. However, the role
        of PRIMPOL polymerase activity is still unclear, as PRIMPOL synthesizes DNA
        with limited processivity, rarely incorporating more than four nucleotides
        on an undamaged template [[cite:PUB00097589]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00097588":{"PMID":24682820,"ISBN":null,"volume":"42","issue":"9","year":2014,"title":"Molecular
