      string: '{"metadata":{"accession":"IPR000647","entry_id":null,"type":"family","go_terms":[{"identifier":"GO:0003700","name":"DNA-binding
        transcription factor activity","category":{"code":"F","name":"molecular_function"}},{"identifier":"GO:0006355","name":"regulation
        of DNA-templated transcription","category":{"code":"P","name":"biological_process"}},{"identifier":"GO:0005634","name":"nucleus","category":{"code":"C","name":"cellular_component"}}],"source_database":"interpro","member_databases":{"panther":{"PTHR11492":"NUCLEAR
        FACTOR I"},"pfam":{"PF00859":"CTF/NF-I family transcription modulation region"}},"integrated":null,"hierarchy":{"accession":"IPR000647","name":"CTF
        transcription factor/nuclear factor 1","type":"Family","children":[]},"name":{"name":"CTF
        transcription factor/nuclear factor 1","short":"CTF/NFI"},"description":[{"text":"<p>Nuclear
        factor I (NF-I) or CCAAT box-binding transcription factor (CTF) [[cite:PUB00000833],
        [cite:PUB00004374], [cite:PUB00097186]] (also known as TGGCA-binding proteins)
        are a family of vertebrate nuclear proteins which recognise and bind, as dimers,
        the palindromic DNA sequence 5''-TGGCANNNTGCCA-3''. This family was first
        described for its role in stimulating the initiation of adenovirus DNA replication
        [[cite:PUB00004597]]. In vertebrates there are four members NFIA, NFIB, NFIC,
        and NFIX and an orthologue from Caenorhabditis elegans has been described,
        called Nuclear factor I family protein (NFI-I) [[cite:PUB00097185]]. The CTF/NF-I
        proteins are individually capable of activating transcription and DNA replication,
        thus they function by regulating cell proliferation and differentiation. They
        are involved in normal development and have been associated with developmental
        abnormalities and cancer in humans [[cite:PUB00097186]]. In a given species,
        there are a large number of different CTF/NF-I proteins, generated both by
        alternative splicing and by the occurrence of four different genes. CTF/NF-1
        proteins contain 400 to 600 amino acids. The N-terminal 200 amino-acid sequence,
        almost perfectly conserved in all species and genes sequenced, mediates site-specific
        DNA recognition, protein dimerisation and Adenovirus DNA replication. The
        C-terminal 100 amino acids contain the transcriptional activation domain.
        This activation domain is the target of gene expression regulatory pathways
        elicited by growth factors and it interacts with basal transcription factors
        and with histone H3 [[cite:PUB00001922]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00004374":{"PMID":2339052,"ISBN":null,"volume":"18","issue":"9","year":1990,"title":"Chicken
        NFI/TGGCA proteins are encoded by at least three independent genes: NFI-A,
        NFI-B and NFI-C with homologues in mammalian genomes.","URL":null,"raw_pages":"2607-16","medline_journal":"Nucleic
        Acids Res","ISO_journal":"Nucleic Acids Res.","authors":["Rupp RA","Kruse
        U","Multhaup G","Gobel U","Beyreuther K","Sippel AE."],"DOI_URL":"http://dx.doi.org/10.1093/nar/18.9.2607"},"PUB00000833":{"PMID":2504497,"ISBN":null,"volume":"58","issue":"4","year":1989,"title":"The
        proline-rich transcriptional activator of CTF/NF-I is distinct from the replication
        and DNA binding domain.","URL":null,"raw_pages":"741-53","medline_journal":"Cell","ISO_journal":"Cell","authors":["Mermod
        N","O''Neill EA","Kelly TJ","Tjian R."],"DOI_URL":"http://dx.doi.org/10.1016/0092-8674(89)90108-6"},"PUB00001922":{"PMID":8543151,"ISBN":null,"volume":"9","issue":"24","year":1995,"title":"A
        proline-rich TGF-beta-responsive transcriptional activator interacts with
        histone H3.","URL":null,"raw_pages":"3051-66","medline_journal":"Genes Dev","ISO_journal":"Genes
