        carrier protein domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Mitochondrial
        carrier protein domain superfamily\",\"short\":\"MCP_dom_sf\"},\"description\":[{\"text\":\"<p>This
        superfamily represents a structural domain found in mitochondrial carrier
        proteins.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>A
        variety of substrate carrier proteins involved in energy transfer are found
        in the inner mitochondrial membrane or are integral to the membranes of other
        eukaryotic organelles such as the peroxisome [[cite:PUB00005351], [cite:PUB00005084],
        [cite:PUB00003301], [cite:PUB00001675], [cite:PUB00005407]]. Such proteins
        include:</p>\\n\\n<ul><li>ADP/ATP carrier protein (ADP/ATP translocase)</li>\\n
        \ <li>2-oxoglutarate/malate carrier protein</li>\\n  <li>Phosphate carrier
        protein</li>\\n  <li>Tricarboxylate transport protein (or citrate transport
        protein)</li>\\n  <li>Graves disease carrier protein</li>\\n  <li>Yeast mitochondrial
        proteins MRS3 and MRS4</li>\\n  <li>Yeast mitochondrial FAD carrier protein</li>\\n
        \ <li>And many others</li></ul>\\n\\n<p>These mitochondrial carrier proteins
        share a tripartite structure, consisting of up to three tandem repeats of
        a domain approximately 100 residues in length [[cite:PUB00001005]]. Each domain
        contains two transmembrane (TM) regions, resulting in a total of six TM domains.
        Sequence analysis has shown that the TM regions and their adjacent hydrophilic
        loops are more highly conserved than other parts of the protein, with five
        of the six TM domains followed by the conserved motif (D/E)-Hy(K/R), where
        Hy denotes a hydrophobic residue [[cite:PUB00001005]]. Structurally, these
        domains contain six \u03B1-helices that form a compact transmembrane unit.
        This structure exhibits a deep depression on the side facing the space between
        the inner and outer mitochondrial membranes, resembling a channel-like conformation
        [[cite:PUB00101069], [cite:PUB00029479]]. It is suggested that substrates
        bind at the bottom of this cavity, and translocation occurs through a conformational
        change from a 'pit' to a 'channel' structure.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00001675\":{\"PMID\":8206158,\"ISBN\":null,\"volume\":\"346\",\"issue\":\"1\",\"year\":1994,\"title\":\"Mitochondrial
        carrier proteins.\",\"URL\":null,\"raw_pages\":\"48-54\",\"medline_journal\":\"FEBS
        Lett\",\"ISO_journal\":\"FEBS Lett.\",\"authors\":[\"Palmieri F.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0014-5793(94)00329-7\"},\"PUB00003301\":{\"PMID\":8487299,\"ISBN\":null,\"volume\":\"230\",\"issue\":\"4\",\"year\":1993,\"title\":\"Site-directed
        mutagenesis of the yeast mitochondrial ADP/ATP translocator. Six arginines
        and one lysine are essential.\",\"URL\":null,\"raw_pages\":\"1159-70\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Nelson DR\",\"Lawson
        JE\",\"Klingenberg M\",\"Douglas MG.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1993.1233\"},\"PUB00005084\":{\"PMID\":8140286,\"ISBN\":null,\"volume\":\"144\",\"issue\":\"8\",\"year\":1993,\"title\":\"Expansion
        of the mitochondrial carrier family.\",\"URL\":null,\"raw_pages\":\"671-2\",\"medline_journal\":\"Res
        Microbiol\",\"ISO_journal\":\"Res. Microbiol.\",\"authors\":[\"Kuan J\",\"Saier
        MH Jr.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0923-2508(93)90073-B\"},\"PUB00005351\":{\"PMID\":2158156,\"ISBN\":null,\"volume\":\"15\",\"issue\":\"3\",\"year\":1990,\"title\":\"Mechanism
        and evolution of the uncoupling protein of brown adipose tissue.\",\"URL\":null,\"raw_pages\":\"108-12\",\"medline_journal\":\"Trends
        Biochem Sci\",\"ISO_journal\":\"Trends Biochem. Sci.\",\"authors\":[\"Klingenberg
        M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0968-0004(90)90194-G\"},\"PUB00005407\":{\"PMID\":8291088,\"ISBN\":null,\"volume\":\"18\",\"issue\":\"11\",\"year\":1993,\"title\":\"PMP47,
        a peroxisomal homologue of mitochondrial solute carrier proteins.\",\"URL\":null,\"raw_pages\":\"427-8\",\"medline_journal\":\"Trends
        Biochem Sci\",\"ISO_journal\":\"Trends Biochem. Sci.\",\"authors\":[\"Jank
        B\",\"Habermann B\",\"Schweyen RJ\",\"Link TA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/0968-0004(93)90141-9\"},\"PUB00029479\":{\"PMID\":14603310,\"ISBN\":null,\"volume\":\"426\",\"issue\":\"6962\",\"year\":2003,\"title\":\"Structure
        of mitochondrial ADP/ATP carrier in complex with carboxyatractyloside.\",\"URL\":null,\"raw_pages\":\"39-44\",\"medline_journal\":\"Nature\",\"ISO_journal\":\"Nature\",\"authors\":[\"Pebay-Peyroula
        E\",\"Dahout-Gonzalez C\",\"Kahn R\",\"Trezeguet V\",\"Lauquin GJ\",\"Brandolin
        G.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/nature02056\"},\"PUB00101069\":{\"PMID\":21785437,\"ISBN\":null,\"volume\":\"476\",\"issue\":\"7358\",\"year\":2011,\"title\":\"Mitochondrial
        uncoupling protein 2 structure determined by NMR molecular fragment searching.\",\"URL\":null,\"raw_pages\":\"109-13\",\"medline_journal\":\"Nature\",\"ISO_journal\":\"Nature\",\"authors\":[\"Berardi
        MJ\",\"Shih WM\",\"Harrison SC\",\"Chou JJ.\"],\"DOI_URL\":null},\"PUB00001005\":{\"PMID\":8325039,\"ISBN\":null,\"volume\":\"28\",\"issue\":\"3\",\"year\":1993,\"title\":\"The
