      string: '{"metadata":{"accession":"IPR036910","entry_id":null,"type":"homologous_superfamily","go_terms":null,"source_database":"interpro","member_databases":{"ssf":{"SSF47095":"HMG-box"},"cathgene3d":{"G3DSA:1.10.30.10":"High
        mobility group box domain"}},"integrated":null,"hierarchy":{"accession":"IPR036910","name":"High
        mobility group box domain superfamily","type":"Homologous_superfamily","children":[]},"name":{"name":"High
        mobility group box domain superfamily","short":"HMG_box_dom_sf"},"description":[{"text":"<p>High
        mobility group (HMG) box domains are involved in binding DNA, and may be involved
        in protein-protein interactions as well. The structure of the HMG-box domain
        consists of three helices in an irregular array. HMG-box domains are found
        in one or more copies in HMG-box proteins, which form a large, diverse family
        involved in the regulation of DNA-dependent processes such as transcription,
        replication, and strand repair, all of which require the bending and unwinding
        of chromatin. Many of these proteins are regulators of gene expression. HMG-box
        proteins are found in a variety of eukaryotic organisms, and can be broadly
        divided into two groups, based on sequence-dependent and sequence-independent
        DNA recognition; the former usually contain one HMG-box motif, while the latter
        can contain multiple HMG-box motifs.</p>\r\n<p>HMG-box domains can be found
        in single or multiple copies in the following protein classes:  HMG1 and HMG2
        non-histone components of chromatin; SRY (sex determining region Y protein)
        involved in differential gonadogenesis; the SOX family of transcription factors
        [[cite:PUB00015128]]; sequence-specific LEF1 (lymphoid enhancer binding factor
        1) and TCF-1 (T-cell factor 1) involved in regulation of organogenesis and
        thymocyte differentiation [[cite:PUB00015129]]; structure-specific recognition
        protein SSRP involved in transcription and replication; MTF1 mitochondrial
        transcription factor; nucleolar transcription factors UBF 1/2 (upstream binding
        factor) involved in transcription by RNA polymerase I; Abf2 yeast ARS-binding
        factor [[cite:PUB00015130]]; yeast transcription factors lxr1, Rox1, Nhp6b
        and Spp41; mating type proteins (MAT) involved in the sexual reproduction
        of fungi [[cite:PUB00015131]]; and the YABBY plant-specific transcription
        factors.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Structurally,
        the HMG box domain is composed of three helices.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00015130":{"PMID":11779632,"ISBN":null,"volume":"1522","issue":"3","year":2001,"title":"The
        modulation of the biological activities of mitochondrial histone Abf2p by
