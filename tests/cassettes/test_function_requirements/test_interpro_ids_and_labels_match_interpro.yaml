        superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Homeodomain-like
        superfamily\",\"short\":\"Homeodomain-like_sf\"},\"description\":[{\"text\":\"<p>Homeodomain
        (HD)-containing proteins are transcription factors that share a related DNA
        binding domain [[cite:PUB00013192]]. HD was first identified in a number of
        Drosophila homeotic and segmentation proteins, but is now known to be well
        conserved in organisms from all domains in life. The domain binds DNA through
        a helix-turn-helix (HTH) structure. The HTH motif is characterised by two
        \u03B1-helices, which make intimate contacts with the DNA and are joined by
        a short turn. The second helix binds to DNA via a number of hydrogen bonds
        and hydrophobic interactions, which occur between specific side chains and
        the exposed bases and thymine methyl groups within the major groove of the
        DNA. The first helix helps to stabilise the structure. Many proteins contain
        homeodomains, including Drosophila Engrailed, yeast mating type proteins,
        hepatocyte nuclear factor 1a and HOX proteins.</p>\\n\\n<p>The homeodomain
        motif is very similar in sequence and structure to domains in a wide range
        of DNA-binding proteins, including recombinases, Myb proteins, GARP response
        regulators, human telomeric proteins (hTRF1), paired domain proteins (PAX),
        yeast RAP1, centromere-binding proteins CENP-B and ABP-1, transcriptional
        regulators (TyrR), AraC-type transcriptional activators, and tetracycline
        repressor-like proteins (TetR, QacR, YcdC) [[cite:PUB00013193], [cite:PUB00013194],
        [cite:PUB00003347]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00013192\":{\"PMID\":10377888,\"ISBN\":null,\"volume\":\"21\",\"issue\":\"4\",\"year\":1999,\"title\":\"Target
