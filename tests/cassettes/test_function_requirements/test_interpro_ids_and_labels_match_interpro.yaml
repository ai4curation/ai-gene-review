        A carboxyltransferase, N-terminal\",\"short\":\"COA_CT_N\"},\"description\":[{\"text\":\"<p>Acetyl-coenzyme
        A carboxylase ([ec:6.4.1.2]) (ACC), a member of the biotin-dependent enzyme
        family, catalyses the formation of malonyl-coenzyme A (CoA) and regulates
        fatty acid biosynthesis and oxidation. Biotin-dependent carboxylase enzymes
        perform a two step reaction: enzyme-bound biotin is first carboxylated by
        bicarbonate and ATP and the carboxyl group temporarily bound to biotin is
        subsequently transferred to an acceptor substrate such as acetyl-CoA. The
        carboxyltransferase domain performs the second part of the reaction [[cite:PUB00000064],
        [cite:PUB00015343]].</p>\\n\\n<p>The N- and C-terminal regions of the carboxyltransferase
        domain share similar polypeptide backbone folds, with a central \u03B2-\u03B2-\u03B1
        superhelix [[cite:PUB00015346]]. The CoA molecule is mostly associated with
        the N subdomain. In bacterial acetyl coenzyme A carboxylase the N and C subdomains
        are encoded by two different polypeptides.</p>\\n\\n<p>This entry represents
        the N-terminal subdomain and contains the bacterial ACC beta-subunit.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00000064\":{\"PMID\":2673009,\"ISBN\":null,\"volume\":\"58\",\"issue\":null,\"year\":1989,\"title\":\"The
