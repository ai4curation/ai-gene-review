      string: "{\"metadata\":{\"accession\":\"IPR003812\",\"entry_id\":null,\"type\":\"domain\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"pfam\":{\"PF02661\":\"Fic/DOC
        family\"},\"profile\":{\"PS51459\":\"Fido domain profile\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR003812\",\"name\":\"Fido
        domain\",\"type\":\"Domain\",\"children\":[]},\"name\":{\"name\":\"Fido domain\",\"short\":\"Fido\"},\"description\":[{\"text\":\"<p>This
        globular domain is named fido after the Fic and Doc proteins where it is found.
        It is approximately 125 to 150 residues long, and is present in proteins from
        all kingdoms of life [[cite:PUB00015218], [cite:PUB00051349], [cite:PUB00051774],
        [cite:PUB00057404]], including:</p>\\n\\n<ul>\\n<li>Fic (filamentation induced
        by cAMP) from diverse bacteria. It contains a longer insert in the fido domain.</li>\\n<li>Doc
        (death on curing) proteins from phage P1 and several bacteria. All these proteins
        contain a minimal stand-alone version of the fido domain.</li>\\n<li>HypE
        (Huntingtin associated protein E) from animal. In humans, HypE is thought
        to interact with Huntingtin, one of the major proteins in the Huntington's
        disease protein interaction network. Proteins related to HypE are also found
        in several bacteria and some archaea. HypE proteins contain a longer insert
        in their fido domain and are typically multidomain proteins.</li>\\n<li>Type
        IV secretion system effector AnkX from Legionella.</li>\\n<li>VopS, a type
        III secretion system effector from Vibrio that causes eukaryotic cell cytotoxicity.</li>\\n<li>IbpA
        (virulence factor p76) from Haemophilus somnus. It includes an N-terminal
        haemagglutination activity domain, two fido domains and a peptidase C58 domain.</li>\\n<li>BepA,
        an anti-apoptotic bacterial effector protein, which is a type IV secretion
        system substrate.</li>\\n</ul>\\n\\n<p>The fido domain of Vibrio VopS covalently
        modifies Rho GTPase threonine with AMP to inhibit downstream signaling events
        in host cells. The AMPylation activity extends to a eukaryotic fido domain
        in Drosophila fic homologue CG9523. AMPylation represents a newly discovered
        posttranslational modification used to stably modify proteins with AMP. This
        signaling mechanism is predicted to be functionally similar to other posttranslation
        modifications such as phosphorylation, SUMOylation or acetylation, because
        the added moiety changes the activity of the modified protein. The covalent
        attachment of AMP by a phosphodiester bond is predicted to be reversible and
        is bulky enough to provide a docking site for a putative AMP binding domain
        [[cite:PUB00057404]].</p>\\n\\n<p>The fido domain contains a central motif
        conserved in most sequences (H-x-F-x-[DE]-[AG]-N-[GK]-R), with the motif His
        contributing to fic AMPylation. The fido domain adopts an \u03B1-helical fold,
        arranged as a six-helix up and down bundle [[cite:PUB00051349], [cite:PUB00051774],
        [cite:PUB00057404]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00051349\":{\"PMID\":18757857,\"ISBN\":null,\"volume\":\"283\",\"issue\":\"45\",\"year\":2008,\"title\":\"Doc
        of prophage P1 is inhibited by its antitoxin partner Phd through fold complementation.\",\"URL\":null,\"raw_pages\":\"30821-7\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Garcia-Pino
        A\",\"Christensen-Dalsgaard M\",\"Wyns L\",\"Yarmolinsky M\",\"Magnuson RD\",\"Gerdes
        K\",\"Loris R.\"],\"DOI_URL\":\"http://dx.doi.org/10.1074/jbc.M805654200\"},\"PUB00057404\":{\"PMID\":19503829,\"ISBN\":null,\"volume\":\"4\",\"issue\":\"6\",\"year\":2009,\"title\":\"Fido,
        a novel AMPylation domain common to fic, doc, and AvrB.\",\"URL\":null,\"raw_pages\":\"e5818\",\"medline_journal\":\"PLoS
        One\",\"ISO_journal\":\"PLoS ONE\",\"authors\":[\"Kinch LN\",\"Yarbrough ML\",\"Orth
        K\",\"Grishin NV.\"],\"DOI_URL\":\"http://dx.doi.org/10.1371/journal.pone.0005818\"},\"PUB00015218\":{\"PMID\":14659018,\"ISBN\":null,\"volume\":\"4\",\"issue\":\"12\",\"year\":2003,\"title\":\"New
        connections in the prokaryotic toxin-antitoxin network: relationship with
        the eukaryotic nonsense-mediated RNA decay system.\",\"URL\":null,\"raw_pages\":\"R81\",\"medline_journal\":\"Genome
        Biol\",\"ISO_journal\":\"Genome Biol.\",\"authors\":[\"Anantharaman V\",\"Aravind
        L.\"],\"DOI_URL\":\"http://dx.doi.org/10.1186/gb-2003-4-12-r81\"},\"PUB00051774\":{\"PMID\":19127588,\"ISBN\":null,\"volume\":\"75\",\"issue\":\"1\",\"year\":2009,\"title\":\"Crystal
        structure of the Fic (Filamentation induced by cAMP) family protein SO4266
        (gi|24375750) from Shewanella oneidensis MR-1 at 1.6 A resolution.\",\"URL\":null,\"raw_pages\":\"264-71\",\"medline_journal\":\"Proteins\",\"ISO_journal\":\"Proteins\",\"authors\":[\"Das
        D\",\"Krishna SS\",\"McMullan D\",\"Miller MD\",\"Xu Q\",\"Abdubek P\",\"Acosta
        C\",\"Astakhova T\",\"Axelrod HL\",\"Burra P\",\"Carlton D\",\"Chiu HJ\",\"Clayton
        T\",\"Deller MC\",\"Duan L\",\"Elias Y\",\"Elsliger MA\",\"Ernst D\",\"Feuerhelm
        J\",\"Grzechnik A\",\"Grzechnik SK\",\"Hale J\",\"Han GW\",\"Jaroszewski L\",\"Jin
        KK\",\"Klock HE\",\"Knuth MW\",\"Kozbial P\",\"Kumar A\",\"Marciano D\",\"Morse
        AT\",\"Murphy KD\",\"Nigoghossian E\",\"Okach L\",\"Oommachen S\",\"Paulsen
        J\",\"Reyes R\",\"Rife CL\",\"Sefcovic N\",\"Tien H\",\"Trame CB\",\"Trout
        CV\",\"van den Bedem H\",\"Weekes D\",\"White A\",\"Hodgson KO\",\"Wooley
        J\",\"Deacon AM\",\"Godzik A\",\"Lesley SA\",\"Wilson IA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1002/prot.22338\"}},\"set_info\":null,\"overlaps_with\":[{\"accession\":\"IPR036597\",\"name\":\"Fido-like
