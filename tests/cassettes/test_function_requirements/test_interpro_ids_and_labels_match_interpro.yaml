        der Weid T","Wahli W","Mermod N."],"DOI_URL":"http://www.genesdev.org/cgi/content/abstract/9/24/3051"},"PUB00097185":{"PMID":19584245,"ISBN":null,"volume":"106","issue":"29","year":2009,"title":"DNA-binding
        specificity and in vivo targets of Caenorhabditis elegans nuclear factor I.","URL":null,"raw_pages":"12049-54","medline_journal":"Proc
