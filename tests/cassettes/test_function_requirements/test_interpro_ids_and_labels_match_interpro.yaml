        channel-forming protein, Tsx-like superfamily","type":"Homologous_superfamily","children":[]},"name":{"name":"Nucleoside-specific
        channel-forming protein, Tsx-like superfamily","short":"Channel_Tsx-like_sf"},"description":[{"text":"<p>The
        tsx gene of Escherichia coli encodes an outer membrane protein, Tsx, which
        constitutes the receptor for colicin K and Bacteriophage T6, and functions
        as a substrate-specific channel for nucleosides and deoxy-nucleosides [[cite:PUB00006257]].
        The protein contains 294 amino acids, the first 22 of which are characteristic
        of a bacterial signal sequence peptide. The putative mature form of Tsx contains
        272 residues with a calculated Mr of 31418. The Tsx sequence shows an even
        distribution of charged residues and lacks extensive hydrophobic stretches
        [[cite:PUB00006257]]. Tsx shows no significant similarities to the channel-forming
        proteins OmpC, OmpF, PhoE and LamB from the E. coli outer membrane.</p>\n\n<p>This
        entry also contains related proteins of unknown function.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00006257":{"PMID":2265760,"ISBN":null,"volume":"96","issue":"1","year":1990,"title":"Analysis
