      string: "{\"metadata\":{\"accession\":\"IPR010992\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:4.10.520.10\":\"IHF-like
        DNA-binding proteins\"},\"ssf\":{\"SSF47729\":\"IHF-like DNA-binding proteins\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR010992\",\"name\":\"Integration
        host factor (IHF)-like DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Integration
        host factor (IHF)-like DNA-binding domain superfamily\",\"short\":\"IHF-like_DNA-bd_dom_sf\"},\"description\":[{\"text\":\"<p>Integration
        host factor (IHF) ([interpro:IPR005684], [interpro:IPR005685]) is a small
        heterodimeric protein that binds the minor groove of DNA in a sequence-specific
        manner and induces a large bend. This bending stabilises distinct DNA conformations
        that are required during several bacterial processes, such as recombination,
        transposition, replication and transcription [[cite:PUB00014038]]. The core
        structure of IHF consists of a partly opened 4-helical bundle that is capped
        with a \u03B2-sheet.</p>\\r\\n<p>Prokaryotic protein HU and the bacteriophage
        SPO1 transcription factor TF1 are closely related to IHF. These proteins are
        collectively referred to as type II DNA-binding proteins (DBPII), forming
        a group of basic, dimeric proteins found in all bacteria that are able to
        bind DNA to induce and stabilise DNA bending. HU plays a structural role in
        replication initiation, transcription regulation, site-specific recombination,
        and the compaction of the bacterial genome [[cite:PUB00014039]]. TF1 is essential
        for viral multiplication [[cite:PUB00014040]].</p>\\r\\n<p>The DNA-binding
        domain of the TraM protein ([interpro:IPR007925]), an essential component
        of the DNA transfer machinery of the conjugative resistance plasmid R1, appears
        to have a similar structure to DBPII [[cite:PUB00010445]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00014038\":{\"PMID\":12842466,\"ISBN\":null,\"volume\":\"330\",\"issue\":\"3\",\"year\":2003,\"title\":\"Integration
        host factor: putting a twist on protein-DNA recognition.\",\"URL\":null,\"raw_pages\":\"493-502\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Lynch TW\",\"Read
        EK\",\"Mattis AN\",\"Gardner JF\",\"Rice PA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0022-2836(03)00529-1\"},\"PUB00014039\":{\"PMID\":12853489,\"ISBN\":null,\"volume\":\"22\",\"issue\":\"14\",\"year\":2003,\"title\":\"Flexible
        DNA bending in HU-DNA cocrystal structures.\",\"URL\":null,\"raw_pages\":\"3749-60\",\"medline_journal\":\"EMBO
        J\",\"ISO_journal\":\"EMBO J.\",\"authors\":[\"Swinger KK\",\"Lemberg KM\",\"Zhang
        Y\",\"Rice PA.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/emboj/cdg351\"},\"PUB00014040\":{\"PMID\":10993726,\"ISBN\":null,\"volume\":\"302\",\"issue\":\"4\",\"year\":2000,\"title\":\"Solution
        structure of a mutant of transcription factor 1: implications for enhanced
        DNA binding.\",\"URL\":null,\"raw_pages\":\"821-30\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Liu W\",\"Vu HM\",\"Geiduschek
        EP\",\"Kearns DR.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.2000.4084\"},\"PUB00010445\":{\"PMID\":11258958,\"ISBN\":null,\"volume\":\"40\",\"issue\":\"11\",\"year\":2001,\"title\":\"Solution
