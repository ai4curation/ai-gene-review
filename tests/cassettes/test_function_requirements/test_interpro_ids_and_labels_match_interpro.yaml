        ( Pt 3)","issue":null,"year":1997,"title":"A classification of nucleotide-diphospho-sugar
        glycosyltransferases based on amino acid sequence similarities.","URL":null,"raw_pages":"929-39","medline_journal":"Biochem
        J","ISO_journal":"Biochem. J.","authors":["Campbell JA","Davies GJ","Bulone
