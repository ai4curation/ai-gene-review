        ATPase, subfamily IB","type":"Family","children":[{"accession":"IPR000579","name":"Cation-transporting
        P-type ATPase A/B","type":"Family","children":[]}]}]},"name":{"name":"P-type
        ATPase","short":"P_typ_ATPase"},"description":[{"text":"<p>This entry represents
        the P-type ATPases. These P-ATPases are found in both prokaryotes and eukaryotes.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>P-ATPases
        (also known as E1-E2 ATPases) ([ec:7.2.2.6]) are found in bacteria and in
        a number of eukaryotic plasma membranes and organelles [[cite:PUB00009616]].
        P-ATPases function to transport a variety of different compounds, including
        ions and phospholipids, across a membrane using ATP hydrolysis for energy.  There
        are many different classes of P-ATPases, which transport specific types of
        ion: H<sup>+</sup>, Na<sup>+</sup>, K<sup>+</sup>, Mg<sup>2+</sup>, Ca<sup>2+</sup>,
        Ag<sup>+</sup>and Ag<sup>2+</sup>, Zn<sup>2+</sup>, Co<sup>2+</sup>, Pb<sup>2+</sup>,
        Ni<sup>2+</sup>, Cd<sup>2+</sup>, Cu<sup>+</sup>and Cu<sup>2+</sup> [[cite:PUB00160066],
        [cite:PUB00160065]]. P-ATPases can be composed of one or two polypeptides,
        and can usually assume two main conformations called E1 and E2.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Transmembrane
        ATPases are membrane-bound enzyme complexes/ion transporters that use ATP
        hydrolysis to drive the transport of protons across a membrane. Some transmembrane
        ATPases also work in reverse, harnessing the energy from a proton gradient,
