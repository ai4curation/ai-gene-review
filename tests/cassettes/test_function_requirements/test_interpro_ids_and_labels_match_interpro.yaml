      string: "{\"metadata\":{\"accession\":\"IPR036576\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003700\",\"name\":\"DNA-binding
        transcription factor activity\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0043565\",\"name\":\"sequence-specific
        DNA binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF118290\":\"WRKY
        DNA-binding domain\"},\"cathgene3d\":{\"G3DSA:2.20.25.80\":\"WRKY domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036576\",\"name\":\"WRKY
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"WRKY
        domain superfamily\",\"short\":\"WRKY_dom_sf\"},\"description\":[{\"text\":\"<p>This
        entry represents the WRKY domain superfamily.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>The
        WRKY domain is a 60 amino acid region that is defined by the conserved amino
        acid sequence WRKYGQK at its N-terminal end, together with a novel zinc-finger-like
        motif. The WRKY domain is found in one or two copies in a superfamily of plant
        transcription factors involved in the regulation of various physiological
        programs that are unique to plants, including pathogen defence, senescence,
        trichome development and the biosynthesis of secondary metabolites. The WRKY
        domain binds specifically to the DNA sequence motif (T)(T)TGAC(C/T), which
        is known as the W box. The invariant TGAC core of the W box is essential for
        function and WRKY binding [[cite:PUB00007562]]. Some proteins known to contain
        a WRKY domain include Arabidopsis thaliana ZAP1 (Zinc-dependent Activator
        Protein-1) and AtWRKY44/TTG2, a protein involved in trichome development and
        anthocyanin pigmentation; and wild oat ABF1-2, two proteins involved in the
        gibberelic acid-induced expression of the alpha-Amy2 gene.</p>\\n\\n<p>Structural
        studies indicate that this domain is a four-stranded \u03B2-sheet with a zinc
        binding pocket, forming a novel zinc and DNA binding structure [[cite:PUB00033608]].
        The WRKYGQK residues correspond to the most N-terminal \u03B2-strand, which
        enables extensive hydrophobic interactions, contributing to the structural
        stability of the \u03B2-sheet.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00033608\":{\"PMID\":15705956,\"ISBN\":null,\"volume\":\"17\",\"issue\":\"3\",\"year\":2005,\"title\":\"Solution
        structure of an Arabidopsis WRKY DNA binding domain.\",\"URL\":null,\"raw_pages\":\"944-56\",\"medline_journal\":\"Plant
        Cell\",\"ISO_journal\":\"Plant Cell\",\"authors\":[\"Yamasaki K\",\"Kigawa
        T\",\"Inoue M\",\"Tateno M\",\"Yamasaki T\",\"Yabuki T\",\"Aoki M\",\"Seki
        E\",\"Matsuda T\",\"Tomo Y\",\"Hayami N\",\"Terada T\",\"Shirouzu M\",\"Tanaka
        A\",\"Seki M\",\"Shinozaki K\",\"Yokoyama S.\"],\"DOI_URL\":\"http://dx.doi.org/10.1105/tpc.104.026435\"},\"PUB00007562\":{\"PMID\":10785665,\"ISBN\":null,\"volume\":\"5\",\"issue\":\"5\",\"year\":2000,\"title\":\"The
        WRKY superfamily of plant transcription factors.\",\"URL\":null,\"raw_pages\":\"199-206\",\"medline_journal\":\"Trends
        Plant Sci\",\"ISO_journal\":\"Trends Plant Sci.\",\"authors\":[\"Eulgem T\",\"Rushton
