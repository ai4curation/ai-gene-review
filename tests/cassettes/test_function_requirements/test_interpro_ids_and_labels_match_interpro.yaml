        phosphotransferase","type":"Family","children":[{"accession":"IPR023660","name":"Protein
        arginine kinase","type":"Family","children":[]}]},"name":{"name":"Protein
        arginine kinase","short":"Arg_Kinase"},"description":[{"text":"<p>Bacterial
        arginine kinases catalyse the transfer of phosphate from ATP to arginine.
        Protein arginine phosphorylation is involved in the regulation of many critical
        cellular processes, such as protein degradation, competence and stress responses
        [[cite:PUB00081098]]. Bacterial protein arginine kinase McsB main targets
        comprise central factors of the stress response system, including the CtsR
        and HrcA heat shock repressors, as well as major components of the protein
        quality control system, such as the ClpCP protease and the GroEL chaperonine
        [[cite:PUB00081101]]. McsB has been shown to phosphorylate and inhibit the
        global heat shock repressor CtsR [[cite:PUB00052996]]. Furthermore, McsB is
        an adaptor for the ClpCP protease. McsB is activated during heat stress by
        autophosphorylation, allowing the controlled degradation of CtsR by ClpCP
        [[cite:PUB00081099]]. It is also required for de-localisation of competence
        proteins [[cite:PUB00081100]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00081098":{"PMID":22517742,"ISBN":null,"volume":"109","issue":"19","year":2012,"title":"Global
