      string: "{\"metadata\":{\"accession\":\"IPR023395\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:1.50.40.10\":\"Mitochondrial
