      string: '{"metadata":{"accession":"IPR003369","entry_id":null,"type":"domain","go_terms":[{"identifier":"GO:0015031","name":"protein
        transport","category":{"code":"P","name":"biological_process"}}],"source_database":"interpro","member_databases":{"pfam":{"PF02416":"mttA/Hcf106
        family"}},"integrated":null,"hierarchy":{"accession":"IPR003369","name":"Sec-independent
        protein translocase protein TatA/B/E, N-terminal","type":"Domain","children":[]},"name":{"name":"Sec-independent
        protein translocase protein TatA/B/E, N-terminal","short":"TatA/B/E_"},"description":[{"text":"<p>This
        entry represents the N-terminal region of the related related TatA, TatB and
        TatE proteins.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Translocation
        of proteins across the two membranes of Gram-negative bacteria can be carried
        out via a number of routes. Most proteins marked for export carry a secretion
        signal at their N terminus, and are secreted by the general secretory pathway.
        The signal peptide is cleaved as they pass through the outer membrane. Other
        secretion systems include the type III system found in a select group of Gram-negative
        plant and animal pathogens, and the CagA system of Helicobacter pylori [[cite:PUB00007662]].</p>\n\n<p>In
        some bacterial species, however, there exists a system that operates independently
        of the Sec pathway [[cite:PUB00007663]]. It selectively translocates periplasmic-bound
        molecules that are synthesised with, or are in close association with, \"partner\"
        proteins bearing an (S/T)RRXFLK twin arginine motif at the N terminus. The
        pathway is therefore termed the Twin-Arginine Translocation or TAT system.
        Surprisingly, the four components that make up the TAT system are structurally
        and mechanistically related to a pH-dependent import system in plant chloroplast
        thylakoid membranes [[cite:PUB00007663]]. The gene products responsible for
        the Sec-independent pathway are called TatA, TatB, TatC and TatE.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00007663":{"PMID":10652088,"ISBN":null,"volume":"35","issue":"2","year":2000,"title":"The
        Tat protein export pathway.","URL":null,"raw_pages":"260-74","medline_journal":"Mol
        Microbiol","ISO_journal":"Mol. Microbiol.","authors":["Berks BC","Sargent
        F","Palmer T."],"DOI_URL":"http://dx.doi.org/10.1046/j.1365-2958.2000.01719.x"},"PUB00007662":{"PMID":9649434,"ISBN":null,"volume":"17","issue":"13","year":1998,"title":"Overlapping
        functions of components of a bacterial Sec-independent protein export pathway.","URL":null,"raw_pages":"3640-50","medline_journal":"EMBO
        J","ISO_journal":"EMBO J.","authors":["Sargent F","Bogsch EG","Stanley NR","Wexler
        M","Robinson C","Berks BC","Palmer T."],"DOI_URL":"http://dx.doi.org/10.1093/emboj/17.13.3640"}},"set_info":null,"overlaps_with":null,"counters":{"subfamilies":0,"domain_architectures":64,"interactions":0,"matches":36711,"pathways":0,"proteins":36706,"proteomes":16389,"sets":0,"structural_models":{"alphafold":23905},"structures":15,"taxa":23761},"entry_annotations":{"alignment:seed":128,"alignment:full":18217},"cross_references":{},"is_llm":false,"is_reviewed_llm":false,"is_updated_llm":false,"representative_structure":null}}'
