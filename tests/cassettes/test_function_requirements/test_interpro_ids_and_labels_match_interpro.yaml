        hydrolase","type":"Family","children":[]},"name":{"name":"Phosphonoacetate
        hydrolase","short":"Phosphonoacetate_hydro"},"description":[{"text":"<p>This
        family consists of examples of phosphonoacetate hydrolase, an enzyme specific
        for the cleavage of the C-P bond in phosphonoacetate. Phosphonates are organic
        compounds with a direct C-P bond that is far less labile than the C-O-P bonds
        of phosphate attachment sites. Phosphonates may be degraded for phosphorus
        and energy by broad spectrum C-P lyase encoded by a large operon or by specific
        enzymes for some of the more common phosphonates in nature. This family represents
        an enzyme from the latter category. It may be found encoded near genes for
