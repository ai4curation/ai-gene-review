        finger C2H2-type\",\"short\":\"Zf-C2H2_type\"},\"description\":[{\"text\":\"<p>This
        entry represents the classical C2H2 zinc finger domain.</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>C2H2-type
        (classical) zinc fingers (Znf) were the first class to be characterised. They
        contain a short \u03B2-hairpin and an \u03B1-helix (\u03B2/\u03B2/\u03B1 structure),
        where a single zinc atom is held in place by Cys(2)His(2) (C2H2) residues
        in a tetrahedral array. C2H2 Znf's can be divided into three groups based
        on the number and pattern of fingers: triple-C2H2 (binds single ligand), multiple-adjacent-C2H2
        (binds multiple ligands), and separated paired-C2H2 [[cite:PUB00035808]].
        C2H2 Znf's are the most common DNA-binding motifs found in eukaryotic transcription
        factors, and have also been identified in prokaryotes [[cite:PUB00035809]].
        \ Transcription factors usually contain several Znf's (each with a conserved
        \u03B2/\u03B2/\u03B1 structure) capable of making multiple contacts along
        the DNA, where the C2H2 Znf motifs recognise DNA sequences by binding to the
        major groove of DNA via a short \u03B1-helix in the Znf, the Znf spanning
        3-4 bases of the DNA [[cite:PUB00035811]]. C2H2 zinc fingers can also bind
        to RNA and protein targets [[cite:PUB00043274]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false},{\"text\":\"<p>Zinc
        finger (Znf) domains are relatively small protein motifs which contain multiple
        finger-like protrusions that make tandem contacts with their target molecule.
        Some of these domains bind zinc, but many do not; instead, they bind other
        metals, such as iron, or no metal at all. For example, some family members
        form salt bridges to stabilise the finger-like folds. They were first identified
        as a DNA-binding motif in transcription factor TFIIIA from Xenopus laevis
        (African clawed frog); however, they are now recognised to bind DNA, RNA,
        protein and/or lipid substrates [[cite:PUB00035807], [cite:PUB00035805], [cite:PUB00035806],
        [cite:PUB00035804], [cite:PUB00014077]]. Their binding properties depend on
        the amino acid sequence of the finger domains and of the linker between fingers,
        as well as on the higher-order structures and the number of fingers. Znf domains
        are often found in clusters, where fingers can have different binding specificities.
        There are many superfamilies of Znf motifs, varying in both sequence and structure.
        They display considerable versatility in binding modes, even between members
        of the same class (e.g., some bind DNA, others protein), suggesting that Znf
        motifs are stable scaffolds that have evolved specialised functions. For example,
        Znf-containing proteins function in gene transcription, translation, mRNA
        trafficking, cytoskeleton organisation, epithelial development, cell adhesion,
        protein folding, chromatin remodelling and zinc sensing, to name but a few
        [[cite:PUB00035812]]. Zinc-binding motifs are stable structures, and they
        rarely undergo conformational changes upon binding their target.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00035807\":{\"PMID\":10529348,\"ISBN\":null,\"volume\":\"293\",\"issue\":\"2\",\"year\":1999,\"title\":\"Zinc
        finger peptides for the regulation of gene expression.\",\"URL\":null,\"raw_pages\":\"215-8\",\"medline_journal\":\"J
