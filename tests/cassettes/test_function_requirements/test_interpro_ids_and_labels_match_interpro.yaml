        phosphate synthase, ATP-binding domain\",\"type\":\"Domain\",\"children\":[{\"accession\":\"IPR005483\",\"name\":\"Carbamoyl
        phosphate synthase, CPSase domain\",\"type\":\"Domain\",\"children\":[]}]},{\"accession\":\"IPR009720\",\"name\":\"IMP
        biosynthesis enzyme PurP, C-terminal\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR011095\",\"name\":\"D-alanine--D-alanine
        ligase, C-terminal\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR013650\",\"name\":\"ATP-grasp
        fold, succinyl-CoA synthetase-type\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR013651\",\"name\":\"ATP-grasp
        fold, RimK-type\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR020561\",\"name\":\"Phosphoribosylglycinamide
        synthetase, ATP-grasp (A) domain\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR039523\",\"name\":\"Alpha-L-glutamate
        ligase-related protein, ATP-grasp domain\",\"type\":\"Domain\",\"children\":[]},{\"accession\":\"IPR063490\",\"name\":\"L-aspartate--L-methionine
        ligase, ATP grasp\",\"type\":\"Domain\",\"children\":[]}]},\"name\":{\"name\":\"ATP-grasp
        fold\",\"short\":\"ATP-grasp\"},\"description\":[{\"text\":\"<p>The ATP-grasp
        superfamily currently includes 17 groups of enzymes, catalysing ATP-dependent
        ligation of a carboxylate containing molecule to an amino or thiol group-containing
        molecule [[cite:PUB00020972]]. They contribute predominantly to macromolecular
        synthesis. ATP-hydrolysis is used to activate a substrate. For example, DD-ligase
        transfers phosphate from ATP to D-alanine on the first step of catalysis.
        On the second step the resulting acylphosphate is attacked by a second D-alanine
        to produce a DD dipeptide following phosphate elimination [[cite:PUB00015340]].</p>\\n\\n<p>The
        ATP-grasp domain contains three conserved motifs, corresponding to the phosphate
        binding loop and the Mg(2+) binding site [[cite:PUB00015341]]. The fold is
        characterised by two \u03B1-\u03B2 subdomains that grasp the ATP molecule
        between them. Each subdomain provides a variable loop that forms part of the
        active site, with regions from other domains also contributing to the active
        site, even though these other domains are not conserved between the various
        ATP-grasp enzymes [[cite:PUB00015342]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00020972\":{\"PMID\":9416615,\"ISBN\":null,\"volume\":\"6\",\"issue\":\"12\",\"year\":1997,\"title\":\"A
        diverse superfamily of enzymes with ATP-dependent carboxylate-amine/thiol
        ligase activity.\",\"URL\":null,\"raw_pages\":\"2639-43\",\"medline_journal\":\"Protein
        Sci\",\"ISO_journal\":\"Protein Sci.\",\"authors\":[\"Galperin MY\",\"Koonin
