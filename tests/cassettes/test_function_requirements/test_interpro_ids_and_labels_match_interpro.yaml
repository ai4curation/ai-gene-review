      string: "{\"metadata\":{\"accession\":\"IPR010982\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF47413\":\"lambda
        repressor-like DNA-binding domains\"},\"cathgene3d\":{\"G3DSA:1.10.260.40\":\"lambda
        repressor-like DNA-binding domains\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR010982\",\"name\":\"Lambda
        repressor-like, DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Lambda
        repressor-like, DNA-binding domain superfamily\",\"short\":\"Lambda_DNA-bd_dom_sf\"},\"description\":[{\"text\":\"<p>Bacteriophage
        lambda C1 repressor controls the expression of viral genes as part of the
        lysogeny/lytic growth switch. C1 is essential for maintaining lysogeny, where
        the phage replicates non-disruptively along with the host. If the host cell
        is threatened, then lytic growth is induced. The Lambda C1 repressor consists
        of two domains connected by a linker: an N-terminal DNA-binding domain that
        also mediates interactions with RNA polymerase and a C-terminal dimerisation
        domain [[cite:PUB00014015]]. The DNA-binding domain consists of four helices
        in a closed folded leaf motif. Several different phage repressors from different
        helix-turn-helix families contain DNA-binding domains that adopt a similar
        topology. These include the Lambda Cro repressor, bacteriophage 434 C1 and
        Cro repressors, P22 C2 repressor, and bacteriophage Mu Ner protein.</p>\\n\\n<p>The
        DNA-binding domain of Bacillus subtilis spore inhibition repressor SinR is
        identical to that of phage repressors [[cite:PUB00014013]]. SinR represses
        sporulation, which only occurs in response to adverse conditions. This provides
        a possible evolutionary link between the two adaptive responses of bacterial
        sporulation and prophage induction.</p>\\n\\n<p>Other DNA-binding domains
        also display similar structural folds to that of Lambda C1. These include
        bacterial regulators such as the purine repressor (PurR), the lactose repressor
        (LacR) and the fructose repressor (FruR), each of which has an N-terminal
        DNA-binding domain that exhibits a fold similar to that of lambda C1, except
        that they lack the first helix [[cite:PUB00014016], [cite:PUB00014017], [cite:PUB00014018]].
        POU-specific domains found in transcription factors such as Oct-1, Pit-1 and
        hepatocyte nuclear factor 1a (LFB1/HNF1) display four-helical fold DNA-binding
        domains similar to that of Lambda C1 [[cite:PUB00014019], [cite:PUB00007265],
        [cite:PUB00014020]]. The N-terminal domain of cyanase has an \u03B1-helix
        bundle motif similar to lambda C1, but it probably does not bind DNA. Cyanase
        is an enzyme found in bacteria and plants that catalyses the reaction of cyanate
        with bicarbonate to produce ammonia and carbon dioxide in response to extracellular
        cyanate [[cite:PUB00008198]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00014015\":{\"PMID\":10892750,\"ISBN\":null,\"volume\":\"101\",\"issue\":\"7\",\"year\":2000,\"title\":\"Crystal
        structure of the lambda repressor C-terminal domain provides a model for cooperative
        operator binding.\",\"URL\":null,\"raw_pages\":\"801-11\",\"medline_journal\":\"Cell\",\"ISO_journal\":\"Cell\",\"authors\":[\"Bell
        CE\",\"Frescura P\",\"Hochschild A\",\"Lewis M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1016/S0092-8674(00)80891-0\"},\"PUB00014013\":{\"PMID\":9799632,\"ISBN\":null,\"volume\":\"283\",\"issue\":\"5\",\"year\":1998,\"title\":\"An
        evolutionary link between sporulation and prophage induction in the structure
        of a repressor:anti-repressor complex.\",\"URL\":null,\"raw_pages\":\"907-12\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Lewis RJ\",\"Brannigan
        JA\",\"Offen WA\",\"Smith I\",\"Wilkinson AJ.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1998.2163\"},\"PUB00014016\":{\"PMID\":7973627,\"ISBN\":null,\"volume\":\"266\",\"issue\":\"5186\",\"year\":1994,\"title\":\"Crystal
        structure of LacI member, PurR, bound to DNA: minor groove binding by alpha
        helices.\",\"URL\":null,\"raw_pages\":\"763-70\",\"medline_journal\":\"Science\",\"ISO_journal\":\"Science\",\"authors\":[\"Schumacher
        MA\",\"Choi KY\",\"Zalkin H\",\"Brennan RG.\"],\"DOI_URL\":\"http://www.sciencemag.org/cgi/content/abstract/266/5186/763\"},\"PUB00014017\":{\"PMID\":10700279,\"ISBN\":null,\"volume\":\"7\",\"issue\":\"3\",\"year\":2000,\"title\":\"A
        closer view of the conformation of the Lac repressor bound to operator.\",\"URL\":null,\"raw_pages\":\"209-14\",\"medline_journal\":\"Nat
        Struct Biol\",\"ISO_journal\":\"Nat. Struct. Biol.\",\"authors\":[\"Bell CE\",\"Lewis
        M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1038/73317\"},\"PUB00014018\":{\"PMID\":9237914,\"ISBN\":null,\"volume\":\"270\",\"issue\":\"3\",\"year\":1997,\"title\":\"Three-dimensional
        structure of the DNA-binding domain of the fructose repressor from Escherichia
        coli by 1H and 15N NMR.\",\"URL\":null,\"raw_pages\":\"496-510\",\"medline_journal\":\"J
        Mol Biol\",\"ISO_journal\":\"J. Mol. Biol.\",\"authors\":[\"Penin F\",\"Geourjon
        C\",\"Montserret R\",\"Bockmann A\",\"Lesage A\",\"Yang YS\",\"Bonod-Bidaud
        C\",\"Cortay JC\",\"Negre D\",\"Cozzone AJ\",\"Deleage G.\"],\"DOI_URL\":\"http://dx.doi.org/10.1006/jmbi.1997.1123\"},\"PUB00014019\":{\"PMID\":11583619,\"ISBN\":null,\"volume\":\"8\",\"issue\":\"3\",\"year\":2001,\"title\":\"Differential
