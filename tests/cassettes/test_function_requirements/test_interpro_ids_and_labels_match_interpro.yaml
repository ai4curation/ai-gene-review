    body:
      string: "{\"metadata\":{\"accession\":\"IPR008967\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003700\",\"name\":\"DNA-binding
        transcription factor activity\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF49417\":\"p53-like
        transcription factors\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR008967\",\"name\":\"p53-like
        transcription factor, DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"p53-like
        transcription factor, DNA-binding domain superfamily\",\"short\":\"p53-like_TF_DNA-bd_sf\"},\"description\":[{\"text\":\"<p>This
        domain superfamily is found in a number of transcription factors, including
        p53, NFATC, TonEBP, STAT-1, and NFkappaB, where it is responsible for DNA-binding.
        \ These transcription factors play diverse roles in the regulation of cellular
        functions: the p53 tumour suppressor upregulates the expression of genes involved
        in cell cycle arrest and apoptosis [[cite:PUB00011797]]; NFATC regulates the
        production of effector proteins involved in coordinating the immune response
        [[cite:PUB00011799]]; TonEBP regulates gene expression induced by osmotic
        stress and helps regulate intracellular volume during cell growth [[cite:PUB00011802]];
        STAT-1 plays an important role in B lymphocyte growth and function [[cite:PUB00011801]];
        and NFkappaB is involved in the inflammatory response [[cite:PUB00011803]].
        \ The DNA-binding domain acts to clamp, or in the case of TonEBP, encircle
        the DNA target in order to stabilise the protein-DNA complex [[cite:PUB00011800]].
        \ Protein interactions may also serve to stabilise the protein-DNA complex,
        for example in the STAT-1 dimer the SH2 (Src homology 2) domain in each monomer
        is coupled to the DNA-binding domain to increase stability [[cite:PUB00011807]].
        \ The DNA-binding domain consists of a \u03B2-sandwich formed of 9 strands
        in 2 sheets with a Greek-key topology. This structure is found in many transcription
        factors, often within the DNA-binding domain.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00011797\":{\"PMID\":12826037,\"ISBN\":null,\"volume\":\"39\",\"issue\":\"10\",\"year\":2003,\"title\":\"Tumour
