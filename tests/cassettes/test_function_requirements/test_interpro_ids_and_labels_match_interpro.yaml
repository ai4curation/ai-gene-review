      string: "{\"metadata\":{\"accession\":\"IPR036388\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"cathgene3d\":{\"G3DSA:1.10.10.10\":\"Winged
        helix-like DNA-binding domain superfamily/Winged helix DNA-binding domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036388\",\"name\":\"Winged
        helix-like DNA-binding domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"Winged
        helix-like DNA-binding domain superfamily\",\"short\":\"WH-like_DNA-bd_sf\"},\"description\":[{\"text\":\"<p>Winged
        helix DNA-binding proteins share a related winged helix-turn-helix DNA-binding
        motif, where the \\\"wings\\\", or loops, are small \u03B2-sheets. The winged
        helix motif consists of two wings (W1, W2), three \u03B1-helices (H1, H2,
        H3) and three \u03B2-sheets (S1, S2, S3) arranged in the order H1-S1-H2-H3-S2-W1-S3-W2
        [[cite:PUB00013195]]. The DNA-recognition helix makes sequence-specific DNA
        contacts with the major groove of DNA, while the wings make different DNA
        contacts, often with the minor groove or the backbone of DNA. Several winged-helix
        proteins display an exposed patch of hydrophobic residues thought to mediate
        protein-protein interactions.</p>\\n\\n<p>Many different proteins with diverse
        biological functions contain a winged helix DNA-binding domain, including
        transcriptional repressors such as biotin repressor, LexA repressor and the
        arginine repressor [[cite:PUB00004803]]; transcription factors such as the
        hepatocyte nuclear factor-3 proteins involved in cell differentiation, heat-shock
        transcription factor, and the general transcription factors TFIIE and TFIIF
        [[cite:PUB00013196], [cite:PUB00013197]]; helicases such as RuvB that promotes
        branch migration at the Holliday junction, and CDC6 in the pre-replication
        complex [[cite:PUB00013198], [cite:PUB00013199]]; endonucleases such as FokI
        and TnsA [[cite:PUB00007438]]; histones; and Mu transposase, where the flexible
        wing of the enhancer-binding domain is essential for efficient transposition
        [[cite:PUB00013200]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00013199\":{\"PMID\":11030343,\"ISBN\":null,\"volume\":\"6\",\"issue\":\"3\",\"year\":2000,\"title\":\"Structure
        and function of Cdc6/Cdc18: implications for origin recognition and checkpoint
