        domain\",\"type\":\"Domain\",\"children\":[]}]},\"name\":{\"name\":\"SpoVT-AbrB
        domain\",\"short\":\"SpoVT-AbrB_dom\"},\"description\":[{\"text\":\"<p>The
        SpoVT-AbrB domain is a DNA-binding domain found in a large protein superfamily
        [[cite:PUB00038698], [cite:PUB00038491]], which includes:</p>\\n\\n<ul><li>Bacterial
        antibiotic resistance protein B (AbrB), a transition-state regulator.</li>\\n<li>Bacterial
        SpoVT, a late sporulation factor that modulates forespore-specific sigma G-dependent
        transcription.</li>\\n<li>Bacterial PrlF, an antitoxin component of a toxin-antitoxin
        (TA) module.</li>\\n<li>Bacterial transcription factors (antitoxins) of plasmid
        maintenance systems (VapB, MvpT, VppA ,VagC, PemI, MazE, ChpS).</li>\\n<li>Bacterial
        transcriptional regulator MraZ, involved in the expression of the division
        and cell wall (dcw) cluster. It contains two copies of the SpoVT-AbrB domain.</li>\\n<li>Bacterial
        endoribonuclease SymE.</li>\\n<li>Sulfolobus solfataricus repressor-like proteins
        SSo7c3 and SSo7c4.</li>\\n<li>ORF4 from Saline Natrinema sp. J7-1 virus 1
        ([swissprot:A0AAE9VSC7]), which is responsible for the lysis-lysogeny switch
        and mediates superinfection immunity by the repression of genomic DNA replication
        of the superinfecting viruses [[cite:PUB00164996]].</li></ul>\\n\\n<p>The
        SpoVT-AbrB domain contains four \u03B2 strands and one \u03B1 helix and can
        be described as a pair of \u03B2 hairpins linked by the \u03B1 helix [[cite:PUB00038698],
        [cite:PUB00038491]].</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00164996\":{\"PMID\":32522850,\"ISBN\":null,\"volume\":\"94\",\"issue\":\"16\",\"year\":2020,\"title\":\"ORF4
        of the Temperate Archaeal Virus SNJ1 Governs the Lysis-Lysogeny Switch and
        Superinfection Immunity.\",\"URL\":null,\"raw_pages\":\"e00841-20\",\"medline_journal\":\"J
        Virol\",\"ISO_journal\":\"J Virol\",\"authors\":[\"Chen B\",\"Chen Z\",\"Wang
