        / ABF1 chromatin reorganising factor","type":"Family","children":[]},"name":{"name":"BAF1
        / ABF1 chromatin reorganising factor","short":"BAF1_ABF1"},"description":[{"text":"<p>ABF1
        (ARS-binding factor 1) is a sequence-specific DNA binding protein involved
        in transcription activation, gene silencing and initiation of DNA replication.
        ABF1 is known to remodel chromatin, and it is proposed that it mediates its
        effects on transcription and gene expression by modifying local chromatin
        architecture [[cite:PUB00008538]]. These functions require a conserved stretch
        of 20 amino acids in the C-terminal region of ABF1 (amino acids 639 to 662
        Saccharomyces cerevisiae ([swissprot:P14164])) [[cite:PUB00008538]]. The N-terminal
        two thirds of the protein are necessary for DNA binding, and the N terminus
        (amino acids 9 to 91 in S. cerevisiae) is thought to contain a novel zinc-finger
        motif which may stabilise the protein structure [[cite:PUB00009007]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00008538":{"PMID":11756546,"ISBN":null,"volume":"22","issue":"2","year":2002,"title":"Identification
