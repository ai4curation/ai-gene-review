      string: '{"metadata":{"accession":"IPR001264","entry_id":null,"type":"domain","go_terms":null,"source_database":"interpro","member_databases":{"pfam":{"PF00912":"Transglycosylase"}},"integrated":null,"hierarchy":{"accession":"IPR001264","name":"Glycosyl
        transferase, family 51","type":"Domain","children":[]},"name":{"name":"Glycosyl
        transferase, family 51","short":"Glyco_trans_51"},"description":[{"text":"<p>The
        biosynthesis of disaccharides, oligosaccharides and polysaccharides involves
        the action of hundreds of different glycosyltransferases. These enzymes catalyse
        the transfer of sugar moieties from activated donor molecules to specific
        acceptor molecules, forming glycosidic bonds. A classification of glycosyltransferases
        using nucleotide diphospho-sugar, nucleotide monophospho-sugar and sugar phosphates
        ([ec:2.4.1.-]) and related proteins into distinct sequence-based families
        has been described [[cite:PUB00009409]]. This classification is available
        on the CAZy (CArbohydrate-Active EnZymes) website. The same three-dimensional
        fold is expected to occur within each of the families. Because 3-D structures
        are better conserved than sequences, several of the families defined on the
        basis of sequence similarities may have similar 3-D structures and therefore
        form superfamilies.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Glycosyltransferase
        family 51 [cazy:GT51] comprises enzymes with only one known activity; murein
        polymerases ([ec:2.4]). These enzymes utilise MurNAc-GlcNAc-P-P-lipid II as
        the sugar donor.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00002311":{"PMID":9244263,"ISBN":null,"volume":"179","issue":"15","year":1997,"title":"Topographical
        and functional investigation of Escherichia coli penicillin-binding protein
        1b by alanine stretch scanning mutagenesis.","URL":null,"raw_pages":"4761-7","medline_journal":"J
        Bacteriol","ISO_journal":"J. Bacteriol.","authors":["Lefevre F","Remy MH","Masson
        JM."],"DOI_URL":"http://www.pubmedcentral.nih.gov/articlerender.fcgi?tool=EBI&pubmedid=9244263"},"PUB00003875":{"PMID":8830253,"ISBN":null,"volume":"19","issue":"3","year":1996,"title":"Monofunctional
        biosynthetic peptidoglycan transglycosylases.","URL":null,"raw_pages":"639-40","medline_journal":"Mol
