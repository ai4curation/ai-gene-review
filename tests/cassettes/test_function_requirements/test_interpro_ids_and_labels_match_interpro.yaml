      string: '{"metadata":{"accession":"IPR000792","entry_id":null,"type":"domain","go_terms":[{"identifier":"GO:0006355","name":"regulation
        of DNA-templated transcription","category":{"code":"P","name":"biological_process"}}],"source_database":"interpro","member_databases":{"profile":{"PS50043":"LuxR-type
        HTH domain profile"},"prosite":{"PS00622":"LuxR-type HTH domain signature"},"cdd":{"cd06170":"LuxR_C_like"},"smart":{"SM00421":"helix_turn_helix,
        Lux Regulon"},"pfam":{"PF00196":"Bacterial regulatory proteins, luxR family"},"prints":{"PR00038":"HTHLUXR"}},"integrated":null,"hierarchy":{"accession":"IPR000792","name":"Transcription
        regulator LuxR-like, C-terminal","type":"Domain","children":[]},"name":{"name":"Transcription
        regulator LuxR-like, C-terminal","short":"Tscrpt_reg_LuxR-like_C"},"description":[{"text":"<p>This
        domain is a DNA-binding, helix-turn-helix (HTH) domain of about 65 amino acids,
        present in transcription regulators of the LuxR/FixJ family of response regulators.
        The domain is named after Vibrio fischeri luxR, a transcriptional activator
        for quorum-sensing control of luminescence. LuxR-type HTH domain proteins
        occur in a variety of organisms. The DNA-binding HTH domain is usually located
        in the C-terminal region; the N-terminal region often containing an autoinducer-binding
        domain or a response regulatory domain. Most luxR-type regulators act as transcription
        activators, but some can be repressors or have a dual role for different sites.
        LuxR-type HTH regulators control a wide variety of activities in various biological
        processes.</p>\r\n\r\n<p>The luxR-type, DNA-binding HTH domain forms a four-helical
        bundle structure. The HTH motif comprises the second and third helices, known
        as the scaffold and recognition helix, respectively. The HTH binds DNA in
        the major groove, where the N-terminal part of the recognition helix makes
        most of the DNA contacts. The fourth helix is involved in dimerisation of
        gerE and traR. Signalling events by one of the four activation mechanisms
        described below lead to multimerisation of the regulator. The regulators bind
        DNA as multimers [[cite:PUB00016941], [cite:PUB00016947], [cite:PUB00016946]].</p>\r\n\r\n<p>LuxR-type
        HTH proteins can be activated by one of four different mechanisms:</p>\r\n\r\n<p>1)
        Regulators which belong to a two-component sensory transduction system where
        the protein is activated by its phosphorylation, generally on an aspartate
        residue, by a transmembrane kinase [[cite:PUB00016942], [cite:PUB00016943]].
        Some proteins that belong to this category are:</p>\r\n<ul>\r\n<li>Rhizobiaceae
        fixJ (global regulator inducing expression of nitrogen-fixation genes in microaerobiosis)</li>\r\n<li>Escherichia
        coli and Salmonella typhimurium uhpA (activates hexose phosphate transport
        gene uhpT)</li>\r\n<li>E. coli narL and narP (activate nitrate reductase operon)</li>\r\n<li>Enterobacteria
        rcsB (regulation of exopolysaccharide biosynthesis in enteric and plant pathogenesis)</li>\r\n<li>Bordetella
        pertussis bvgA (virulence factor)</li>\r\n<li>Bacillus subtilis coma (involved
        in expression of late-expressing competence genes)</li>\r\n</ul>\r\n \r\n<p>2)
        Regulators which are activated, or in very rare cases repressed, when bound
        to N-acyl homoserine lactones, which are used as quorum sensing molecules
        in a variety of Gram-negative bacteria [[cite:PUB00016944]]:</p>\r\n<ul>\r\n<li>V.
        fischeri luxR (activates bioluminescence operon)</li>\r\n<li>Agrobacterium
        tumefaciens traR (regulation of Ti plasmid transfer)</li>\r\n<li>Erwinia carotovora
        carR (control of carbapenem antibiotics biosynthesis)</li>\r\n<li>E. carotovora
        expR (virulence factor for soft rot disease; activates plant tissue macerating
        enzyme genes)</li>\r\n<li>Pseudomonas aeruginosa lasR (activates elastase
        gene lasB)</li>\r\n<li>Erwinia chrysanthemi echR and Erwinia stewartii esaR</li>\r\n<li>Pseudomonas
        chlororaphis phzR (positive regulator of phenazine antibiotic production)</li>\r\n<li>Pseudomonas
        aeruginosa rhlR (activates rhlAB operon and lasB gene)</li>\r\n</ul>\r\n \r\n<p>3)
        Autonomous effector domain regulators, without a regulatory domain, represented
        by gerE [[cite:PUB00016941]].</p>\r\n\r\n<p>4) Multiple ligand-binding regulators,
        exemplified by malT [[cite:PUB00016945]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00016941":{"PMID":11243786,"ISBN":null,"volume":"306","issue":"4","year":2001,"title":"Crystal
        structure of GerE, the ultimate transcriptional regulator of spore formation
        in Bacillus subtilis.","URL":null,"raw_pages":"759-71","medline_journal":"J
        Mol Biol","ISO_journal":"J. Mol. Biol.","authors":["Ducros VM","Lewis RJ","Verma
        CS","Dodson EJ","Leonard G","Turkenburg JP","Murshudov GN","Wilkinson AJ","Brannigan
        JA."],"DOI_URL":"http://dx.doi.org/10.1006/jmbi.2001.4443"},"PUB00016942":{"PMID":12352954,"ISBN":null,"volume":"9","issue":"10","year":2002,"title":"Dimerization
