        transcription regulator","short":"Gti1/Pac2"},"description":[{"text":"<p>This
        entry represents global transcription factors found in fungi.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>In
        Schizosaccharomyces pombe the Gti1 protein promotes the onset of gluconate
        uptake upon glucose starvation [[cite:PUB00044289]]. The Pac2 protein controls
        the onset of sexual development by inhibiting the expression of ste11 in a
        pathway that is independent of the cAMP cascade [[cite:PUB00044290]]. Sge1
        is a global transcriptional regulator of pathogenicity. It acts as an activator
        of parasitic growth. It is not essential for colonisation or penetration of
        the root surface but is required for expression of genes encoding effectors
        that are secreted during infection. It is involved in conidiogenesis but is
        not required for conidial fitness, overall (colony) morphology, vegetative
        growth or carbon source utilisation [[cite:PUB00163265]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00044289":{"PMID":9372449,"ISBN":null,"volume":"110
        ( Pt 20)","issue":null,"year":1997,"title":"Onset of gluconate-H+ symport
