      string: "{\"metadata\":{\"accession\":\"IPR036115\",\"entry_id\":null,\"type\":\"homologous_superfamily\",\"go_terms\":[{\"identifier\":\"GO:0003677\",\"name\":\"DNA
        binding\",\"category\":{\"code\":\"F\",\"name\":\"molecular_function\"}},{\"identifier\":\"GO:0006355\",\"name\":\"regulation
        of DNA-templated transcription\",\"category\":{\"code\":\"P\",\"name\":\"biological_process\"}}],\"source_database\":\"interpro\",\"member_databases\":{\"ssf\":{\"SSF90073\":\"GCM
        domain\"}},\"integrated\":null,\"hierarchy\":{\"accession\":\"IPR036115\",\"name\":\"GCM
        domain superfamily\",\"type\":\"Homologous_superfamily\",\"children\":[]},\"name\":{\"name\":\"GCM
        domain superfamily\",\"short\":\"GCM_dom_sf\"},\"description\":[{\"text\":\"<p>GCM
        transcription factors are a family of proteins which contain a GCM motif.
        The GCM motif is a domain that has been identified in proteins belonging to
        a family of transcriptional regulators involved in fundamental developmental
        processes which comprise Drosophila melanogaster GCM and its mammalian homologues
        [[cite:PUB00007596], [cite:PUB00007597], [cite:PUB00007598], [cite:PUB00007599]].
        In GCM transcription factors the N-terminal moiety contains a DNA-binding
        domain of 150 residues. Sequence conservation is highest in this GCM domain.
        In contrast, the C-terminal moiety contains one or two transactivating regions
        and is only poorly conserved.</p>\\n\\n<p>The GCM motif has been shown to
        be a DNA binding domain that recognises preferentially the nonpalindromic
        octamer 5'-ATGCGGGT-3' [[cite:PUB00007596], [cite:PUB00007597], [cite:PUB00007598]].
        The GCM motif contains many conserved basic amino acid residues, seven cysteine
        residues, and four histidine residues [[cite:PUB00007596]]. The conserved
        cysteines are involved in shaping the overall conformation of the domain,
        in the process of DNA binding and in the redox regulation of DNA binding [[cite:PUB00007598]].
        The GCM domain is a new class of Zn-containing DNA-binding domain with no
        similarity to any other DNA-binding domain [[cite:PUB00011125]]. The GCM domain
        consists of a large and a small domain tethered together by one of the two
        Zn ions present in the structure. The large and the small domains comprise
        five-and three-stranded \u03B2-sheets, respectively, with three small helical
        segments packed against the same side of the two \u03B2-sheets. The GCM domain
        exercises a novel mode of sequence-specific DNA recognition, where the five-stranded
        \u03B2-pleated sheet inserts into the major groove of the DNA. Residues protruding
        from the edge strand of the \u03B2-pleated sheet and the following loop and
        strand contact the bases and backbone of both DNA strands, providing specificity
        for its DNA target site.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":{\"PUB00007597\":{\"PMID\":9114061,\"ISBN\":null,\"volume\":\"94\",\"issue\":\"9\",\"year\":1997,\"title\":\"The
        regulator of early gliogenesis glial cells missing is a transcription factor
        with a novel type of DNA-binding domain.\",\"URL\":null,\"raw_pages\":\"4739-44\",\"medline_journal\":\"Proc
        Natl Acad Sci U S A\",\"ISO_journal\":\"Proc. Natl. Acad. Sci. U.S.A.\",\"authors\":[\"Schreiber
        J\",\"Sock E\",\"Wegner M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1073/pnas.94.9.4739\"},\"PUB00007596\":{\"PMID\":8962155,\"ISBN\":null,\"volume\":\"93\",\"issue\":\"25\",\"year\":1996,\"title\":\"The
        gcm-motif: a novel DNA-binding motif conserved in Drosophila and mammals.\",\"URL\":null,\"raw_pages\":\"14912-6\",\"medline_journal\":\"Proc
        Natl Acad Sci U S A\",\"ISO_journal\":\"Proc. Natl. Acad. Sci. U.S.A.\",\"authors\":[\"Akiyama
        Y\",\"Hosoya T\",\"Poole AM\",\"Hotta Y.\"],\"DOI_URL\":\"http://dx.doi.org/10.1073/pnas.93.25.14912\"},\"PUB00007599\":{\"PMID\":10671510,\"ISBN\":null,\"volume\":\"275\",\"issue\":\"7\",\"year\":2000,\"title\":\"Protein
        stability and domain topology determine the transcriptional activity of the
        mammalian glial cells missing homolog, GCMb.\",\"URL\":null,\"raw_pages\":\"4774-82\",\"medline_journal\":\"J
        Biol Chem\",\"ISO_journal\":\"J. Biol. Chem.\",\"authors\":[\"Tuerk EE\",\"Schreiber
        J\",\"Wegner M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1074/jbc.275.7.4774\"},\"PUB00007598\":{\"PMID\":9580683,\"ISBN\":null,\"volume\":\"26\",\"issue\":\"10\",\"year\":1998,\"title\":\"Structural
        requirements for DNA binding of GCM proteins.\",\"URL\":null,\"raw_pages\":\"2337-43\",\"medline_journal\":\"Nucleic
        Acids Res\",\"ISO_journal\":\"Nucleic Acids Res.\",\"authors\":[\"Schreiber
        J\",\"Enderich J\",\"Wegner M.\"],\"DOI_URL\":\"http://dx.doi.org/10.1093/nar/26.10.2337\"},\"PUB00011125\":{\"PMID\":12682016,\"ISBN\":null,\"volume\":\"22\",\"issue\":\"8\",\"year\":2003,\"title\":\"Structure
        of the GCM domain-DNA complex: a DNA-binding domain with a novel fold and
