        transcription factor activity","category":{"code":"F","name":"molecular_function"}}],"source_database":"interpro","member_databases":{"panther":{"PTHR31072":"TRANSCRIPTION
        FACTOR TCP4-RELATED"}},"integrated":null,"hierarchy":{"accession":"IPR005333","name":"Transcription
        factor, TCP","type":"Family","children":[]},"name":{"name":"Transcription
        factor, TCP","short":"Transcription_factor_TCP"},"description":[{"text":"<p>The
        TCP transcription factor family was named after: teosinte branched 1 (tb1,
        Zea mays (Maize)) [[cite:PUB00036025]], cycloidea (cyc) (Antirrhinum majus)
        (Garden snapdragon) [[cite:PUB00008402]] and PCF in rice (Oryza sativa) [[cite:PUB00036026],
        [cite:PUB00036027]]. The TCP proteins code for structurally related proteins
        implicated in the evolution of key morphological traits [[cite:PUB00008402]].
        However, the biochemical function of CYC and TB1 proteins remains to be demonstrated.  One
        of the conserved regions is predicted to form a non-canonical basic-Helix-Loop-Helix
        (bHLP) structure. This domain is also found in two rice DNA-binding proteins,
        PCF1 and PCF2, where it has been shown to be involved in DNA-binding and dimerization.</p>\r\n<p>This
        family of transcription factors are exclusive to higher plants. They can be
        divided into two groups, TCP-C and TCP-P, that appear to have separated following
        an early gene duplication event [[cite:PUB00036029]]. This duplication event
        may have led to functional divergence and it has been proposed that that the
        TCP-P subfamily are transcriptional repressors, while the TPC-C subfamily
        are transcription activators [[cite:PUB00036028]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00008402":{"PMID":10363373,"ISBN":null,"volume":"18","issue":"2","year":1999,"title":"The
        TCP domain: a motif found in proteins regulating plant growth and development.","URL":null,"raw_pages":"215-22","medline_journal":"Plant
        J","ISO_journal":"Plant J.","authors":["Cubas P","Lauter N","Doebley J","Coen
