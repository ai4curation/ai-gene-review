        proteins ywcF and ylaO and the Cyanophora paradoxa cyanelle ftsW homologue.
        They constitute the SEDS (shape, elongation, division and sporulation) family.
        SEDS  proteins are thought to be peptidoglycan polymerases, functioning as
        cell wall synthases of the cell elongation and division machinery [[cite:PUB00083894]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00083894":{"PMID":27525505,"ISBN":null,"volume":"537","issue":"7622","year":2016,"title":"SEDS
