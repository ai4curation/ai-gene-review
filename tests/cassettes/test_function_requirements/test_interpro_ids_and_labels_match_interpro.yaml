      string: '{"metadata":{"accession":"IPR014374","entry_id":null,"type":"family","go_terms":null,"source_database":"interpro","member_databases":{"pirsf":{"PIRSF000547":"Protein
        kinase, phage T7 type"}},"integrated":null,"hierarchy":{"accession":"IPR060291","name":"Bacteriophage
        T7 protein kinase 0.7","type":"Family","children":[{"accession":"IPR014374","name":"Protein
        kinase, T7-type, autographiviridae","type":"Family","children":[]}]},"name":{"name":"Protein
        kinase, T7-type, autographiviridae","short":"Protein_kinase_T7-type"},"description":[{"text":"<p>This
        entry represents a protein encoded by the bacteriophage T7 early gene 0.7.
        This gene is dispensible in a fast-growing host, but is essential when the
        host is growing suboptimally. The protein is bifunctional, with the C-terminal
        third involved in host transcription shut-off, while the N-terminal two-thirds
        has protein kinase activity and is capable of phosphorylating a number of
        host cell proteins and itself [[cite:PUB00056594]]. Expression of the protein
        kinase in the host leads to the phosphorylation of host RNAse E and the stabilisation
        of phage mRNA.</p>","llm":false,"checked":false,"updated":false},{"text":"<p>Protein
        phosphorylation, which plays a key role in most cellular activities, is a
        reversible process mediated by protein kinases and phosphoprotein phosphatases.
        Protein kinases catalyse the transfer of the gamma phosphate from nucleotide
        triphosphates (often ATP) to one or more amino acid residues in a protein
        substrate side chain, resulting in a conformational change affecting protein
        function. Phosphoprotein phosphatases catalyse the reverse process. \nProtein
        kinases fall into three broad classes, characterised with respect to substrate
        specificity [[cite:PUB00005115]]:</p>\n\n<ul>\n<li>Serine/threonine-protein
        kinases</li>\n<li>Tyrosine-protein kinases</li>\n<li>Dual specificity protein
        kinases (e.g. MEK -phosphorylates both Thr and Tyr on target proteins)</li>\n</ul>\n\n<p>Protein
        kinase function is evolutionarily conserved from Escherichia coli to human
        [[cite:PUB00020114]]. Protein kinases play a role in a multitude of cellular
        processes, including division, proliferation, apoptosis, and differentiation
        [[cite:PUB00015362]]. Phosphorylation usually results in a functional change
        of the target protein by changing enzyme activity, cellular location, or association
        with other proteins. The catalytic subunits of protein kinases are highly
        conserved, and several structures have been solved [[cite:PUB00034898]], leading
        to large screens to develop kinase-specific inhibitors for the treatments
        of a number of diseases [[cite:PUB00034899]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00056594":{"PMID":11722741,"ISBN":null,"volume":"42","issue":"3","year":2001,"title":"Bacteriophage
        T7 protein kinase phosphorylates RNase E and stabilizes mRNAs synthesized
        by T7 RNA polymerase.","URL":null,"raw_pages":"767-76","medline_journal":"Mol
        Microbiol","ISO_journal":"Mol. Microbiol.","authors":["Marchand I","Nicholson
        AW","Dreyfus M."],"DOI_URL":"http://dx.doi.org/10.1046/j.1365-2958.2001.02668.x"},"PUB00020114":{"PMID":12471243,"ISBN":null,"volume":"298","issue":"5600","year":2002,"title":"The
        protein kinase complement of the human genome.","URL":null,"raw_pages":"1912-34","medline_journal":"Science","ISO_journal":"Science","authors":["Manning
        G","Whyte DB","Martinez R","Hunter T","Sudarsanam S."],"DOI_URL":"http://dx.doi.org/10.1126/science.1075762"},"PUB00015362":{"PMID":12368087,"ISBN":null,"volume":"27","issue":"10","year":2002,"title":"Evolution
        of protein kinase signaling from yeast to man.","URL":null,"raw_pages":"514-20","medline_journal":"Trends
        Biochem Sci","ISO_journal":"Trends Biochem. Sci.","authors":["Manning G","Plowman
        GD","Hunter T","Sudarsanam S."],"DOI_URL":"http://dx.doi.org/10.1016/S0968-0004(02)02179-5"},"PUB00005115":{"PMID":3291115,"ISBN":null,"volume":"241","issue":"4861","year":1988,"title":"The
        protein kinase family: conserved features and deduced phylogeny of the catalytic
        domains.","URL":null,"raw_pages":"42-52","medline_journal":"Science","ISO_journal":"Science","authors":["Hanks
        SK","Quinn AM","Hunter T."],"DOI_URL":"http://www.sciencemag.org/cgi/content/abstract/241/4861/42"},"PUB00034899":{"PMID":15320712,"ISBN":null,"volume":"7","issue":"5","year":2004,"title":"Creating
        chemical diversity to target protein kinases.","URL":null,"raw_pages":"453-72","medline_journal":"Comb
        Chem High Throughput Screen","ISO_journal":"Comb. Chem. High Throughput Screen.","authors":["Li
        B","Liu Y","Uno T","Gray N."],"DOI_URL":"http://openurl.ingenta.com/content?genre=article&issn=1386-2073&volume=7&issue=5&spage=453"},"PUB00034898":{"PMID":15078142,"ISBN":null,"volume":"10","issue":"10","year":2004,"title":"High-throughput
