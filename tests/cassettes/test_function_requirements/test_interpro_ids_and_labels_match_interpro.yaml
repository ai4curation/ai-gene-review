        membrane efflux protein\",\"short\":\"OMP_efflux\"},\"description\":[{\"text\":\"<p>The
        OEP family (Outer membrane efflux protein) form trimeric channels that allow
        export of a variety of substrates in Gram-negative bacteria. Each member of
        this family is composed of two repeats. The trimeric channel is composed of
        a 12\\nstranded all \u03B2 sheet barrel that spans the outer membrane, and
        a long all helical barrel that spans the periplasm. Examples include the Escherichia
        coli TolC outer membrane protein, which is required for proper expression
        of outer membrane protein genes; the Rhizobium nodulation protein; and the
        Pseudomonas FusA protein, which is involved in resistance to fusaric acid.</p>\",\"llm\":false,\"checked\":false,\"updated\":false}],\"wikipedia\":null,\"literature\":null,\"set_info\":null,\"overlaps_with\":null,\"counters\":{\"subfamilies\":0,\"domain_architectures\":111,\"interactions\":0,\"matches\":149879,\"pathways\":3,\"proteins\":82534,\"proteomes\":10627,\"sets\":0,\"structural_models\":{\"alphafold\":51543},\"structures\":48,\"taxa\":15806},\"entry_annotations\":{\"alignment:seed\":30,\"alignment:full\":67461},\"cross_references\":{},\"is_llm\":false,\"is_reviewed_llm\":false,\"is_updated_llm\":false,\"representative_structure\":{\"accession\":\"1yc9\",\"name\":\"The
