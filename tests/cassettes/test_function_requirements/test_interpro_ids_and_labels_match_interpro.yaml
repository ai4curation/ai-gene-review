        basis for the regulation mechanism of the tyrosine kinase CapB from Staphylococcus
        aureus.","URL":null,"raw_pages":"e143","medline_journal":"PLoS Biol","ISO_journal":"PLoS
        Biol.","authors":["Olivares-Illana V","Meyer P","Bechet E","Gueguen-Chaignon
        V","Soulat D","Lazereg-Riquier S","Mijakovic I","Deutscher J","Cozzone AJ","Laprevote
