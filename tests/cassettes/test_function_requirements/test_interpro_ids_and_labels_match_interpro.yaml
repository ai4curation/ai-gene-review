        DL","Hon WC","Leung AK","Berghuis AM."],"DOI_URL":"http://dx.doi.org/10.1021/bi010504p"},"PUB00014029":{"PMID":12791258,"ISBN":null,"volume":"11","issue":"6","year":2003,"title":"The
        crystal structure of choline kinase reveals a eukaryotic protein kinase fold.","URL":null,"raw_pages":"703-13","medline_journal":"Structure","ISO_journal":"Structure","authors":["Peisach
        D","Gee P","Kent C","Xu Z."],"DOI_URL":"http://dx.doi.org/10.1016/S0969-2126(03)00094-7"},"PUB00001530":{"PMID":7768349,"ISBN":null,"volume":"9","issue":"8","year":1995,"title":"Protein
