        factor activity","category":{"code":"F","name":"molecular_function"}}],"source_database":"interpro","member_databases":{"pirsf":{"PIRSF000774":"RNA
        polymerase sigma-54 factor"},"panther":{"PTHR32248":"RNA POLYMERASE SIGMA-54
        FACTOR"},"prosite":{"PS00718":"Sigma-54 factors family signature 2","PS00717":"Sigma-54
        factors family signature 1"},"pfam":{"PF00309":"Sigma-54 factor, Activator
        interacting domain (AID)"},"ncbifam":{"TIGR02395":"RNA polymerase factor sigma-54"},"prints":{"PR00045":"SIGMA54FCT"}},"integrated":null,"hierarchy":{"accession":"IPR000394","name":"RNA
        polymerase sigma factor 54","type":"Family","children":[]},"name":{"name":"RNA
        polymerase sigma factor 54","short":"RNA_pol_sigma_54"},"description":[{"text":"<p>Sigma
        factors [[cite:PUB00000061]] are bacterial transcription initiation factors
        that promote the attachment of the core RNA polymerase to specific initiation
        sites and are then released. They alter the specificity of promoter recognition.
        Most bacteria express a multiplicity of sigma factors. Two of these factors,
        sigma-70 (gene rpoD), generally known as the major or primary sigma factor,
        and sigma-54 (gene rpoN or ntrA) direct the transcription of a wide variety
        of genes. The other sigma factors, known as alternative sigma factors, are
        required for the transcription of specific subsets of genes. With regard to
        sequence similarity, sigma factors can be grouped into two classes: the sigma-54
        and sigma-70 families. The sigma-70 family has many different sigma factors
        (see the relevant entry [interpro:IPR000943]). The sigma-54 family consists
        exclusively of sigma-54 factor [[cite:PUB00001740], [cite:PUB00003853]] required
        for the transcription of promoters that have a characteristic -24 and -12
        consensus recognition element but which are devoid of the typical -10, -35
        sequences recognised by the major sigma factors. The sigma-54 factor is also
        characterised by its interaction with ATP-dependent positive regulatory proteins
        that bind to upstream activating sequences. Structurally sigma-54 factors
        consist of three distinct regions:</p>\n\n<p><ol>\n\n<li>A relatively well
        conserved N-terminal glutamine-rich region of about 50 residues that contains
        a potential leucine zipper motif.</li>\n\n<li>A region of variable length
        which is not well conserved.</li>\n\n<li>A well conserved C-terminal region
        of about 350 residues that contains a second potential leucine zipper, a potential
        DNA-binding ''helix-turn-helix'' motif and a perfectly conserved octapeptide
        whose function is not known.</li>\n\n</ol></p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00000061":{"PMID":3052291,"ISBN":null,"volume":"57","issue":null,"year":1988,"title":"Structure
        and function of bacterial sigma factors.","URL":null,"raw_pages":"839-72","medline_journal":"Annu
        Rev Biochem","ISO_journal":"Annu. Rev. Biochem.","authors":["Helmann JD","Chamberlin
        MJ."],"DOI_URL":"http://dx.doi.org/10.1146/annurev.bi.57.070188.004203"},"PUB00001740":{"PMID":2517036,"ISBN":null,"volume":"5","issue":"4","year":1989,"title":"The
        -24/-12 promoter comes of age.","URL":null,"raw_pages":"341-57","medline_journal":"FEMS
        Microbiol Rev","ISO_journal":"FEMS Microbiol. Rev.","authors":["Thony B","Hennecke
        H."],"DOI_URL":"http://dx.doi.org/10.1016/0168-6445(89)90028-4"},"PUB00003853":{"PMID":7934866,"ISBN":null,"volume":"10","issue":"5","year":1993,"title":"In
