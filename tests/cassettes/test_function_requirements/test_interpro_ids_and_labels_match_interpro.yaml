        C-terminal","type":"Domain","children":[]},"name":{"name":"HipA-like, C-terminal","short":"HipA-like_C"},"description":[{"text":"<p>The
        members of this entry are similar to a region close to the C terminus of the
        HipA protein expressed by various bacterial species (for example [swissprot:P23874]).
        This protein is known to be involved in high-frequency persistence to the
        lethal effects of inhibition of either DNA or peptidoglycan synthesis [[cite:PUB00016440]].
        When expressed alone, it is toxic to bacterial cells [[cite:PUB00016440]],
        but it is usually tightly associated with HipB [[cite:PUB00016369]], and the
        HipA-HipB complex may be involved in autoregulation of the hip operon. The
        hip proteins may be involved in cell division control and may interact with
        cell division genes or their products [[cite:PUB00016369]].  The domain is
        also found in the serine/threonine-protein kinase CtkA from<i>Helicobacter
        pylori</i>which is important in induction of host inflammation by inducing
        release of cytokines such as TNF-alpha and IL-8 by phosphorylation of NF-kappa-B
        [[cite:PUB00055674]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00016440":{"PMID":1715862,"ISBN":null,"volume":"173","issue":"18","year":1991,"title":"Structure
