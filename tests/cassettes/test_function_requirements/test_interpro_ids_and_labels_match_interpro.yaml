        nucleotide binding domain","type":"Homologous_superfamily","children":[]},"name":{"name":"ATPase,
        nucleotide binding domain","short":"ATPase_NBD"},"description":[{"text":"<p>This
        superfamily comprises domains found in several ATPases, including actin, Hsp70,
        BadF/BadG/BcrA/BcrD, various kinases, DnaK, ROK, PilM, and Fumble. Members
        of this superfamily have two lobes, one with nucleotide binding activity,
        and a second one with substrate binding activity. The lobes can be structurally
        divided into 4 subdomains - 1A, 1B, 2A, 2B (or 1, 2, 3, 4). The ATP binding
        site in these ATPases is well conserved, and is located at the junction of
        the two lobes, in a deep cleft. This superfamily entry represents the nucleotide
        binding domain (NBD) or the first lobe (subdomains 1A and 1B), which exhibits
        ATPase activity.</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":null,"set_info":null,"overlaps_with":[{"accession":"IPR003696","name":"Carbamoyltransferase","type":"domain"},{"accession":"IPR042024","name":"D-xylulose
