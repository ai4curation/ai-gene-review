      string: '{"metadata":{"accession":"IPR008540","entry_id":null,"type":"domain","go_terms":null,"source_database":"interpro","member_databases":{"pfam":{"PF05687":"BES1/BZR1
        plant transcription factor, N-terminal"}},"integrated":null,"hierarchy":{"accession":"IPR008540","name":"BES1/BZR1
        plant transcription factor, N-terminal","type":"Domain","children":[]},"name":{"name":"BES1/BZR1
        plant transcription factor, N-terminal","short":"BES1_N"},"description":[{"text":"<p>This
        entry represents the N-terminal regions of several plant transcription factors.
        It is classified as BES1/BZR1, a plant-specific transcription factor that
        cooperates with transcription factors such as BIM1 to regulate brassinosteroid-induced
        genes [[cite:PUB00075707]].</p>\r\n\r\n<p>Proteins containing this domain
        are transcriptional repressors involved in controlling the response to Brassinosteroids
        (BRs). BRs are plant hormones that play essential roles in growth and development.
        BZR1 binds directly to DNA repressing the synthesis of genes involved in BR
        synthesis. Phosphorylation of BZR1 by BIN1 targets BZR1 to the 20S proteosome,
        while dephosphorylation leads to nuclear accumulation of BZR1 [[cite:PUB00016668]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00016668":{"PMID":15681342,"ISBN":null,"volume":"307","issue":"5715","year":2005,"title":"BZR1
        is a transcriptional repressor with dual roles in brassinosteroid homeostasis
        and growth responses.","URL":null,"raw_pages":"1634-8","medline_journal":"Science","ISO_journal":"Science","authors":["He
        JX","Gendron JM","Sun Y","Gampala SS","Gendron N","Sun CQ","Wang ZY."],"DOI_URL":"http://dx.doi.org/10.1126/science.1107580"},"PUB00075707":{"PMID":15680330,"ISBN":null,"volume":"120","issue":"2","year":2005,"title":"A
        new class of transcription factors mediates brassinosteroid-regulated gene
        expression in Arabidopsis.","URL":null,"raw_pages":"249-59","medline_journal":"Cell","ISO_journal":"Cell","authors":["Yin
        Y","Vafeados D","Tao Y","Yoshida S","Asami T","Chory J."],"DOI_URL":"http://dx.doi.org/10.1016/j.cell.2004.11.044"}},"set_info":null,"overlaps_with":null,"counters":{"subfamilies":0,"domain_architectures":63,"interactions":0,"matches":4280,"pathways":0,"proteins":4260,"proteomes":381,"sets":0,"structural_models":{"alphafold":3408},"structures":10,"taxa":1092},"entry_annotations":{"alignment:seed":19,"alignment:full":2620},"cross_references":{},"is_llm":false,"is_reviewed_llm":false,"is_updated_llm":false,"representative_structure":null}}'
