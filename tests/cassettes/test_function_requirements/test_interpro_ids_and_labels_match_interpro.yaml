      string: "{\"metadata\":{\"accession\":\"IPR007604\",\"entry_id\":null,\"type\":\"domain\",\"go_terms\":null,\"source_database\":\"interpro\",\"member_databases\":{\"profile\":{\"PS51968\":\"Grh/CP2
