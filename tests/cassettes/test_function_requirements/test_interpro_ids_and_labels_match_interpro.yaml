        Struct Biol","ISO_journal":"Nat. Struct. Biol.","authors":["Maris AE","Sawaya
        MR","Kaczor-Grzeskowiak M","Jarvis MR","Bearson SM","Kopka ML","Schroder I","Gunsalus
        RP","Dickerson RE."],"DOI_URL":"http://dx.doi.org/10.1038/nsb845"},"PUB00016943":{"PMID":12162958,"ISBN":null,"volume":"321","issue":"3","year":2002,"title":"Insights
        into signal transduction revealed by the low resolution structure of the FixJ
        response regulator.","URL":null,"raw_pages":"447-57","medline_journal":"J
