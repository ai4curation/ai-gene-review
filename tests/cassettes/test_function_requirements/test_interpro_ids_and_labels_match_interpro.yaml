      string: '{"metadata":{"accession":"IPR019548","entry_id":null,"type":"domain","go_terms":null,"source_database":"interpro","member_databases":{"pfam":{"PF10524":"Nuclear
        factor I protein pre-N-terminus"}},"integrated":null,"hierarchy":{"accession":"IPR019548","name":"CTF
        transcription factor/nuclear factor 1, N-terminal","type":"Domain","children":[]},"name":{"name":"CTF
        transcription factor/nuclear factor 1, N-terminal","short":"CTF/NFI_DNA-bd_N"},"description":[{"text":"<p>Nuclear
        factor I (NF-I) or CCAAT box-binding transcription factor (CTF) [[cite:PUB00000833],
        [cite:PUB00004374], [cite:PUB00097186]] (also known as TGGCA-binding proteins)
        are a family of vertebrate nuclear proteins which recognise and bind, as dimers,
        the palindromic DNA sequence 5''-TGGCANNNTGCCA-3''. This family was first
        described for its role in stimulating the initiation of adenovirus DNA replication
        [[cite:PUB00004597]]. In vertebrates there are four members NFIA, NFIB, NFIC,
        and NFIX and an orthologue from Caenorhabditis elegans has been described,
        called Nuclear factor I family protein (NFI-I) [[cite:PUB00097185]]. The CTF/NF-I
        proteins are individually capable of activating transcription and DNA replication,
        thus they function by regulating cell proliferation and differentiation. They
        are involved in normal development and have been associated with developmental
        abnormalities and cancer in humans [[cite:PUB00097186]]. In a given species,
        there are a large number of different CTF/NF-I proteins, generated both by
        alternative splicing and by the occurrence of four different genes. CTF/NF-1
        proteins contain 400 to 600 amino acids. The N-terminal 200 amino-acid sequence,
        almost perfectly conserved in all species and genes sequenced, mediates site-specific
        DNA recognition, protein dimerisation and Adenovirus DNA replication. The
        C-terminal 100 amino acids contain the transcriptional activation domain.
        This activation domain is the target of gene expression regulatory pathways
        elicited by growth factors and it interacts with basal transcription factors
        and with histone H3 [[cite:PUB00001922]].</p>","llm":false,"checked":false,"updated":false},{"text":"<p>This
        entry represents the N terminus, of which 200 residues contain the DNA-binding
        and dimerisation domain, but also has an 8-47 residue highly conserved region
        5'' of this, whose function is not known. Deletion of the N-terminal 200 amino
        acids removes the DNA-binding activity, dimerisation-ability and the stimulation
        of adenovirus DNA replication [[cite:PUB00004374]].</p>","llm":false,"checked":false,"updated":false}],"wikipedia":null,"literature":{"PUB00000833":{"PMID":2504497,"ISBN":null,"volume":"58","issue":"4","year":1989,"title":"The
        proline-rich transcriptional activator of CTF/NF-I is distinct from the replication
        and DNA binding domain.","URL":null,"raw_pages":"741-53","medline_journal":"Cell","ISO_journal":"Cell","authors":["Mermod
        N","O''Neill EA","Kelly TJ","Tjian R."],"DOI_URL":"http://dx.doi.org/10.1016/0092-8674(89)90108-6"},"PUB00001922":{"PMID":8543151,"ISBN":null,"volume":"9","issue":"24","year":1995,"title":"A
        proline-rich TGF-beta-responsive transcriptional activator interacts with
        histone H3.","URL":null,"raw_pages":"3051-66","medline_journal":"Genes Dev","ISO_journal":"Genes
        Dev.","authors":["Alevizopoulos A","Dusserre Y","Tsai-Pflugfelder M","von
        der Weid T","Wahli W","Mermod N."],"DOI_URL":"http://www.genesdev.org/cgi/content/abstract/9/24/3051"},"PUB00004374":{"PMID":2339052,"ISBN":null,"volume":"18","issue":"9","year":1990,"title":"Chicken
        NFI/TGGCA proteins are encoded by at least three independent genes: NFI-A,
        NFI-B and NFI-C with homologues in mammalian genomes.","URL":null,"raw_pages":"2607-16","medline_journal":"Nucleic
        Acids Res","ISO_journal":"Nucleic Acids Res.","authors":["Rupp RA","Kruse
        U","Multhaup G","Gobel U","Beyreuther K","Sippel AE."],"DOI_URL":"http://dx.doi.org/10.1093/nar/18.9.2607"},"PUB00097185":{"PMID":19584245,"ISBN":null,"volume":"106","issue":"29","year":2009,"title":"DNA-binding
        specificity and in vivo targets of Caenorhabditis elegans nuclear factor I.","URL":null,"raw_pages":"12049-54","medline_journal":"Proc
        Natl Acad Sci U S A","ISO_journal":"Proc Natl Acad Sci U S A","authors":["Whittle
        CM","Lazakovitch E","Gronostajski RM","Lieb JD."],"DOI_URL":null},"PUB00097186":{"PMID":28962832,"ISBN":null,"volume":"410","issue":null,"year":2017,"title":"The
        convergent roles of the nuclear factor I transcription factors in development
        and cancer.","URL":null,"raw_pages":"124-138","medline_journal":"Cancer Lett","ISO_journal":"Cancer
        Lett","authors":["Chen KS","Lim JWC","Richards LJ","Bunt J."],"DOI_URL":null},"PUB00004597":{"PMID":6216480,"ISBN":null,"volume":"79","issue":"21","year":1982,"title":"Adenovirus
        DNA replication in vitro: identification of a host factor that stimulates
        synthesis of the preterminal protein-dCMP complex.","URL":null,"raw_pages":"6438-42","medline_journal":"Proc
        Natl Acad Sci U S A","ISO_journal":"Proc. Natl. Acad. Sci. U.S.A.","authors":["Nagata
        K","Guggenheimer RA","Enomoto T","Lichy JH","Hurwitz J."],"DOI_URL":"http://www.pubmedcentral.nih.gov/picrender.fcgi?tool=EBI&pubmedid=6216480&action=stream&blobtype=pdf"}},"set_info":null,"overlaps_with":null,"counters":{"subfamilies":0,"domain_architectures":30,"interactions":0,"matches":8548,"pathways":2,"proteins":8546,"proteomes":1087,"sets":0,"structural_models":{"alphafold":7502},"structures":13,"taxa":3631},"entry_annotations":{"alignment:seed":4,"alignment:full":6508},"cross_references":{},"is_llm":false,"is_reviewed_llm":false,"is_updated_llm":false,"representative_structure":null}}'
