        dehydrogenase kinasephosphatase","type":"Family","children":[]},"name":{"name":"Isocitrate
        dehydrogenase kinasephosphatase","short":"Isocitrate_DH_AceK"},"description":[{"text":"<p>This
        family consists of several bacterial isocitrate dehydrogenase kinase/phosphatase
        (ICDH kinase/phosphatase) proteins. The enzyme has no activating compound
