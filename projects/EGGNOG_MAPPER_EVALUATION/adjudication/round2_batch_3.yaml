claims:
- claim_id: R2-MF-UNR-09
  category: UNRELATED
  accession: B3DI32
  gene: vcla
  organism_dir: DANRE
  aspect: MF
  term:
    id: GO:0031625
    label: ubiquitin protein ligase binding
  review_file: genes/DANRE/vcla/vcla-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: The only source is a human VCL IPI from a Parkin TAP-MS pull-down in which vinculin was one of many abundant cytoskeletal co-purifiers; the human VCL review marks it over-annotated. Nothing links zebrafish vcla, an actin-binding adhesion adaptor, to ubiquitin ligase binding.
  evidence: review description/core_functions; genes/human/VCL review GO:0031625 IPI MARK_AS_OVER_ANNOTATED reason
- claim_id: R2-CC-UNR-08
  category: UNRELATED
  accession: P90757
  gene: che-11
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0005813
    label: centrosome
  review_file: genes/worm/che-11/che-11-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Human IFT140 has an IDA for centrosome in cycling mammalian cells, but CHE-11 acts only in post-mitotic C. elegans ciliated sensory neurons. There the centrioles degenerate after ciliogenesis and no centrosome is present. Its ciliary-base location is already captured by ciliary basal body, axoneme and non-motile cilium.
  evidence: review description; existing_annotations GO:0036064/GO:0097730 ACCEPT; human IFT140 GOA GO:0005813 IDA
- claim_id: R2-CC-REJ-01
  category: REJECTED
  accession: G5EBX9
  gene: pef-1
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0005634
    label: nucleus
  review_file: genes/worm/pef-1/pef-1-ai-review.yaml
  assessment: NPI
  error_type: LOCALIZATION_DEFAULT
  rationale: PEF-1 is anchored to membranes by N-terminal myristoylation and palmitoylation. Both localization studies place it in sensory cilia, the plasma membrane and neuronal processes, never in the nucleus. The nucleus IBA, and its eggNOG echo, is a family-level default that does not fit this membrane-anchored ciliary phosphatase; the curator's removal stands.
  evidence: existing_annotations GO:0005634 IBA REMOVE reason; review description
- claim_id: R2-BP-UNR-10
  category: UNRELATED
  accession: P26435
  gene: Slc10a1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0035725
    label: sodium ion transmembrane transport
  review_file: genes/rat/Slc10a1/Slc10a1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Ntcp is a sodium-coupled bile salt symporter that moves Na+ into the hepatocyte along with each bile salt, so sodium ion transmembrane transport is a real part of what it does. The review records the symporter MF and bile acid transport BP but has no sodium-transport BP.
  evidence: review description; core_functions GO:0008508 bile acid:sodium symporter activity
- claim_id: R2-BP-REJ-03
  category: REJECTED
  accession: P91682
  gene: smo
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0071679
    label: commissural neuron axon guidance
  review_file: genes/DROME/smo/smo-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Shh/Smo-mediated chemoattraction of commissural axons is a vertebrate spinal-cord mechanism. No such Hh/Smo role in commissural guidance is described in Drosophila, and fly smo is not among the PAINT donors. The curator's removal of this over-deep IBA stands.
  evidence: existing_annotations GO:0071679 IBA REMOVE reason (PTHR11309 TOO_DEEP)
- claim_id: R2-MF-UNR-01
  category: UNRELATED
  accession: O76050
  gene: NEURL1
  organism_dir: human
  aspect: MF
  term:
    id: GO:0008270
    label: zinc ion binding
  review_file: genes/human/NEURL1/NEURL1-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: The C-terminal RING finger (residues 520-560) coordinates zinc, so the term is literally true. It is a structural-cofactor annotation that adds nothing beyond the ubiquitin protein ligase activity already curated.
  evidence: uniprot ZN_FING 520-560; core_functions GO:0061630
- claim_id: R2-MF-UNR-06
  category: UNRELATED
  accession: Q6PHK4
  gene: agxtb
  organism_dir: DANRE
  aspect: MF
  term:
    id: GO:0016597
    label: amino acid binding
  review_file: genes/DANRE/agxtb/agxtb-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: agxtb is an alanine:glyoxylate and serine:pyruvate aminotransferase, so it necessarily binds amino-acid substrates. Amino acid binding only restates substrate binding and is uninformative next to the specific transaminase activities already curated.
  evidence: core_functions GO:0008453, GO:0004760; GO:0016597 definition
- claim_id: R2-BP-REJ-01
  category: REJECTED
  accession: Q9SQR3
  gene: D14
  organism_dir: ARATH
  aspect: BP
  term:
    id: GO:1901601
    label: strigolactone biosynthetic process
  review_file: genes/ARATH/D14/D14-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: D14 is the strigolactone receptor and D-ring hydrolase acting downstream of SL synthesis. d14 mutants are SL-insensitive and over-accumulate SL rather than lacking it, a feedback effect, and the biosynthetic steps are performed by D27, CCD7, CCD8 and MAX1. The source IBA/IMP annotations are themselves wrong, and the removal stands.
  evidence: existing_annotations GO:1901601 IBA and IMP REMOVE reasons; core_functions
- claim_id: R2-MF-UNR-03
  category: UNRELATED
  accession: B7Z0E0
  gene: Idh
  organism_dir: DROME
  aspect: MF
  term:
    id: GO:0051990
    label: (R)-2-hydroxyglutarate dehydrogenase activity
  review_file: genes/DROME/Idh/Idh-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Drosophila Idh is a wild-type NADP-isocitrate dehydrogenase. Producing (R)-2-hydroxyglutarate from 2-oxoglutarate is a neomorphic activity of cancer-associated IDH1/IDH2 active-site mutants, and it runs opposite to the dehydrogenase direction the term defines. Neither the wild-type enzyme nor this protein is a 2-HG dehydrogenase.
  evidence: review description/core_functions GO:0004450; GO:0051990 definition (RHEA:38295)
- claim_id: R2-CC-UNR-09
  category: UNRELATED
  accession: Q9VTN9
  gene: Gcat
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005886
    label: plasma membrane
  review_file: genes/DROME/Gcat/Gcat-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Gcat is a mitochondrial-matrix PLP enzyme of threonine catabolism with no transmembrane segment or membrane anchor. A plasma membrane location is unsupported for it and is most likely a high-throughput localization artifact on an ortholog.
  evidence: review description; existing_annotations GO:0005739 IBA/ISS ACCEPT
- claim_id: R2-BP-NAR-02
  category: NARROWER
  accession: P36510
  gene: Ugt2a1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0007608
    label: sensory perception of smell
  review_file: genes/rat/Ugt2a1/Ugt2a1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Ugt2a1 (UGT-olf) is enriched in olfactory epithelium and sits at the ciliary membrane of olfactory neurons. It glucuronidates odorants as a perireceptor clearance and signal-termination step that modulates the olfactory response, which is a specific and supported refinement of the retained parent, sensory perception of chemical stimulus. The review kept the parent only as non-core, so this is a moderate-confidence call.
  evidence: review description; existing_annotations GO:0007606 ISO KEEP_AS_NON_CORE; core_functions
- claim_id: R2-BP-REJ-04
  category: REJECTED
  accession: Q01705
  gene: Notch1
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0008045
    label: motor neuron axon guidance
  review_file: genes/mouse/Notch1/Notch1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Drosophila Notch does steer ISNb/SNb motor axons via Abl signaling, so the curator's reason for removing axon guidance (a SLIT-family transfer artifact) is questionable. However, no mouse Notch1 motor axon guidance role is documented in the review, so the transfer to Notch1 can be neither validated nor refuted.
  evidence: existing_annotations GO:0007411 IBA REMOVE reason; GO:0007409 axonogenesis KEEP_AS_NON_CORE
- claim_id: R2-BP-UNR-09
  category: UNRELATED
  accession: H2KZZ2
  gene: hlh-30
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0045165
    label: cell fate commitment
  review_file: genes/worm/hlh-30/hlh-30-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: HLH-30 is the TFEB ortholog and regulates transcription of autophagy, lysosomal and lipid-metabolism genes. Cell fate commitment is a vertebrate MiT/TFE developmental term (e.g. MITF in melanocyte and RPE specification) that has no counterpart in worm hlh-30 biology.
  evidence: review description; existing_annotations (no developmental fate terms)
- claim_id: R2-BP-NAR-05
  category: NARROWER
  accession: P48754
  gene: Brca1
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0070317
    label: negative regulation of G0 to G1 transition
  review_file: genes/mouse/Brca1/Brca1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Brca1 is curated for DNA-damage checkpoint and general cell-cycle regulation, but the review presents no evidence that it controls exit from quiescence (G0 to G1). The more specific term is an unsupported over-specification of regulation of cell cycle, and GO:0070317 appears on no human or mouse BRCA1 in local GOA.
  evidence: existing_annotations GO:0051726 KEEP_AS_NON_CORE, GO:0044818 ACCEPT; local GOA grep
- claim_id: R2-MF-UNR-10
  category: UNRELATED
  accession: Q9BYV1
  gene: AGXT2
  organism_dir: human
  aspect: MF
  term:
    id: GO:0042802
    label: identical protein binding
  review_file: genes/human/AGXT2/AGXT2-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: AGXT2 is a homotetrameric class-III aminotransferase (UniProt SUBUNIT, by similarity), so self-association is true. Identical protein binding is a structural property that says nothing about its transaminase function.
  evidence: uniprot SUBUNIT Homotetramer; review description
- claim_id: R2-MF-REJ-03
  category: REJECTED
  accession: P91302
  gene: ubl-5
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0031386
    label: protein tag activity
  review_file: genes/worm/ubl-5/ubl-5-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: UBL-5/Hub1 lacks the C-terminal di-glycine motif needed for covalent conjugation and works through non-covalent binding of HIND-containing spliceosomal proteins and DVE-1. Protein tag activity, which requires covalent attachment to targets, is a ubiquitin-superfamily default that does not apply; the removal stands.
  evidence: existing_annotations GO:0031386 IBA REMOVE reason; review description; core_functions
- claim_id: R2-MF-UNR-02
  category: UNRELATED
  accession: P22307
  gene: SCP2
  organism_dir: human
  aspect: MF
  term:
    id: GO:1904121
    label: phosphatidylethanolamine transfer activity
  review_file: genes/human/SCP2/SCP2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: UniProt states that the SCP2 isoform (nsLTP) mediates the transfer of all common phospholipids between membranes, so phosphatidylethanolamine transfer is supported. The review captures only cholesterol transfer as a core activity.
  evidence: uniprot FUNCTION [Isoform SCP2]; review description; core_functions GO:0120020
- claim_id: R2-BP-UNR-11
  category: UNRELATED
  accession: P61458
  gene: Pcbd1
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0006559
    label: L-phenylalanine catabolic process
  review_file: genes/mouse/Pcbd1/Pcbd1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Pcbd1 dehydrates the 4a-hydroxy-BH4 that phenylalanine hydroxylase releases, so it recycles cofactor for Phe hydroxylation but never acts on phenylalanine or its catabolites. The review removed the analogous L-tyrosine biosynthesis term on this participation argument while accepting BH4 synthesis, so whether cofactor recycling counts as taking part in Phe catabolism is a GO-convention question this evidence cannot settle.
  evidence: review description; existing_annotations GO:0006571 IEA REMOVE reason, GO:0006729 ACCEPT
