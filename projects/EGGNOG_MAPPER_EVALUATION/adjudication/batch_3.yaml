claims:
- claim_id: UNR-08
  category: UNRELATED
  accession: Q86BP6
  gene: elg1
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0030890
    label: positive regulation of B cell proliferation
  review_file: genes/DROME/elg1/elg1-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Drosophila has no B cells; this vertebrate immune process term was transferred from ATAD5/Elg1
    orthologs (likely a mouse phenotype) and cannot apply to the fly protein, which acts as the PCNA unloader
    subunit.
  evidence: review description; core_functions (Elg1 RLC PCNA unloading)
- claim_id: NAR-16
  category: NARROWER
  accession: Q86BP6
  gene: elg1
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0033260
    label: nuclear DNA replication
  review_file: genes/DROME/elg1/elg1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Elg1 is a nuclear subunit of the Elg1 RFC-like complex that unloads PCNA after replication
    and is needed for nurse-cell endoreplication, so nuclear DNA replication is a correct, slightly more
    specific refinement of the accepted DNA-templated DNA replication core process.
  evidence: review description; core_functions GO:0006261; nucleus EXP/IBA ACCEPT
- claim_id: UNR-13
  category: UNRELATED
  accession: Q88EY1
  gene: ccmG
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003756
    label: protein disulfide isomerase activity
  review_file: genes/PSEPK/ccmG/ccmG-ai-review.yaml
  assessment: NPI
  error_type: PARALOG_OVERANNOTATION
  rationale: CcmG/DsbE is a dedicated periplasmic thiol:disulfide reductase for apocytochrome CXXCH motifs,
    not a disulfide-shuffling isomerase; PDI activity belongs to other thioredoxin-fold Dsb family members
    (e.g. DsbC/DsbG).
  evidence: review description; core_functions GO:0015035 (disulfide reductase)
- claim_id: NAR-20
  category: NARROWER
  accession: Q13451
  gene: FKBP5
  organism_dir: human
  aspect: CC
  term:
    id: GO:0005654
    label: nucleoplasm
  review_file: genes/human/FKBP5/FKBP5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: UniProt and the review document a nuclear pool of FKBP5 (by similarity to mouse) in addition
    to its main cytoplasmic location; a soluble nuclear co-chaperone fraction is nucleoplasmic, so this
    is a reasonable refinement of the retained nucleus term.
  evidence: uniprot SUBCELLULAR LOCATION; existing_annotations GO:0005634 KEEP_AS_NON_CORE
- claim_id: UNR-38
  category: UNRELATED
  accession: P63018
  gene: Hspa8
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0048260
    label: positive regulation of receptor-mediated endocytosis
  review_file: genes/rat/Hspa8/Hspa8-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: HSC70 supports clathrin-mediated endocytosis through ATP-driven clathrin coat disassembly
    (accepted core function); a positive-regulation-of-receptor-mediated-endocytosis term is a looser,
    indirect description of that role rather than new information.
  evidence: core_functions GO:1990833/GO:0072318 clathrin uncoating
- claim_id: REJ-01
  category: REJECTED
  accession: A0A6N3IN21
  gene: Sdsl
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0006567
    label: L-threonine catabolic process
  review_file: genes/rat/Sdsl/Sdsl-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Rat SDSL deaminates L-threonine (threonine deaminase IDA ACCEPT) and supports L-threonine
    degradation in cells, so L-threonine catabolic process is correct; the REJECTED category is an artefact
    of the review removing only the ND root biological_process placeholder.
  evidence: review description; GO:0004794 IDA ACCEPT; GO:0008150 ND REMOVE reason
- claim_id: UNR-05
  category: UNRELATED
  accession: Q2M2I8
  gene: AAK1
  organism_dir: human
  aspect: BP
  term:
    id: GO:0008356
    label: asymmetric cell division
  review_file: genes/human/AAK1/AAK1-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: No evidence links human AAK1 to asymmetric cell division; the term likely derives from invertebrate
    Numb-associated kinase / Numb pathway phenotypes, whereas AAK1 acts as an AP-2 kinase in clathrin-mediated
    endocytosis and focal-adhesion turnover.
  evidence: review description; core_functions
- claim_id: UNR-12
  category: UNRELATED
  accession: P30776
  gene: rad21
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:0005739
    label: mitochondrion
  review_file: genes/SCHPO/rad21/rad21-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Rad21 is the nuclear alpha-kleisin of mitotic cohesin with extensive nuclear/chromatin evidence
    and no mitochondrial targeting or function; a mitochondrion transfer most likely reflects a high-throughput
    localization artefact in an ortholog.
  evidence: review description; core_functions (chromatin); nucleus IDA/HDA ACCEPT
- claim_id: UNR-24
  category: UNRELATED
  accession: Q21004
  gene: amph-1
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0030838
    label: positive regulation of actin filament polymerization
  review_file: genes/worm/amph-1/amph-1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: AMPH-1 binds actin and links nesprin to the cytoskeleton, but no worm evidence shows it promotes
    actin filament polymerization; the term may transfer from mammalian BIN1/amphiphysin studies and cannot
    be validated or refuted here.
  evidence: review description; core_functions (nesprin-actin adaptor)
- claim_id: UNR-30
  category: UNRELATED
  accession: P70473
  gene: Amacr
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0005886
    label: plasma membrane
  review_file: genes/rat/Amacr/Amacr-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Amacr is a peroxisomal and mitochondrial matrix racemase with no membrane-targeting features;
    plasma membrane has no support for the rat protein and likely reflects a proteomics/localization artefact
    in an ortholog.
  evidence: review description; peroxisome/mitochondrion IDA
- claim_id: NAR-12
  category: NARROWER
  accession: P63018
  gene: Hspa8
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0009267
    label: cellular response to starvation
  review_file: genes/rat/Hspa8/Hspa8-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: HSC70 is the cytosolic recognition chaperone of chaperone-mediated autophagy, which is activated
    by prolonged starvation, and the review retains response to starvation (IEP); cellular response to
    starvation is a correct refinement.
  evidence: core_functions GO:0061684 chaperone-mediated autophagy; GO:0042594 IEP KEEP_AS_NON_CORE
- claim_id: NAR-07
  category: NARROWER
  accession: P34579
  gene: unc-47
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0044316
    label: cone cell pedicle
  review_file: genes/worm/unc-47/unc-47-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Cone cell pedicle is a vertebrate retinal cone axon terminal; C. elegans has no cone photoreceptors,
    so this transfer from vertebrate VGAT (SLC32A1) retinal data cannot apply to UNC-47.
  evidence: review description; neuron projection terminus IBA
- claim_id: NAR-09
  category: NARROWER
  accession: P14056
  gene: Araf
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0043524
    label: negative regulation of neuron apoptotic process
  review_file: genes/rat/Araf/Araf-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: The review keeps a generic anti-apoptotic role for A-Raf as non-core; a neuron-specific survival
    role is documented mainly for B-Raf/Raf-1, so this refinement is plausible but unverified for rat
    Araf and may reflect paralog evidence.
  evidence: existing_annotations GO:0043066 ISO KEEP_AS_NON_CORE
- claim_id: REJ-06
  category: REJECTED
  accession: Q21554
  gene: ddb-1
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0003684
    label: damaged DNA binding
  review_file: genes/worm/ddb-1/ddb-1-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: In UV-DDB, damaged-DNA recognition is provided by DDB2, with DDB1 acting as the CRL4 adaptor;
    worm DDB-1 is supported only as a CUL-4/DCAF adaptor, so damaged DNA binding is a complex-level activity
    transferred to the non-binding subunit, consistent with the curator removal of nucleic acid binding.
  evidence: existing_annotations GO:0003676 REMOVE reason; core_functions
- claim_id: REJ-15
  category: REJECTED
  accession: P15108
  gene: HSC82
  organism_dir: yeast
  aspect: MF
  term:
    id: GO:0051082
    label: unfolded protein binding
  review_file: genes/yeast/HSC82/HSC82-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Hsc82 does bind non-native client proteins, so the term is not wrong; it was REJECTED only
    because generic protein binding (its parent) was removed, but it is less precise than the accepted
    ATP-dependent protein folding chaperone activity (GO:0140662).
  evidence: core_functions GO:0140662; protein binding REMOVE reasons
- claim_id: UNR-29
  category: UNRELATED
  accession: Q01477
  gene: UBP3
  organism_dir: yeast
  aspect: MF
  term:
    id: GO:0043022
    label: ribosome binding
  review_file: genes/yeast/UBP3/UBP3-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Ubp3-Bre5 deubiquitinates ribosomal proteins and is required for ribophagy, and its human
    ortholog USP10 associates with ribosomes, but the review cites no direct evidence that yeast Ubp3
    binds ribosomes.
  evidence: review description; ribophagy IMP ACCEPT
- claim_id: UNR-21
  category: UNRELATED
  accession: Q1XHL7
  gene: grk7b
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0046777
    label: protein autophosphorylation
  review_file: genes/DANRE/grk7b/grk7b-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: GRK1/GRK7 family kinases are known to autophosphorylate, so the term is plausible for Grk7b,
    but neither the review nor UniProt reports autophosphorylation assays for the zebrafish protein.
  evidence: review core_functions (rhodopsin kinase IDA); no autophosphorylation evidence in review/uniprot
- claim_id: REJ-04
  category: REJECTED
  accession: P63086
  gene: Mapk1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0019858
    label: cytosine metabolic process
  review_file: genes/rat/Mapk1/Mapk1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: ERK2 is a protein kinase with no role executing cytosine metabolism; the donor mouse annotation
    misapplies a process term from an IDA paper, and the curator removed the same term for this reason.
  evidence: existing_annotations GO:0019858 REMOVE reason
- claim_id: UNR-15
  category: UNRELATED
  accession: Q99KV1
  gene: Dnajb11
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0036498
    label: IRE1-mediated unfolded protein response
  review_file: genes/mouse/Dnajb11/Dnajb11-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: ERdj3 is an ER-lumenal BiP co-chaperone whose gene is induced by IRE1/XBP1s; being a UPR
    target gene is not participation in IRE1-mediated signaling, so the term (likely from Reactome target-gene
    membership) does not describe its function.
  evidence: review description; core_functions (BiP co-chaperone)
- claim_id: REJ-07
  category: REJECTED
  accession: A0A8M9Q8E3
  gene: cryabb
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0097060
    label: synaptic membrane
  review_file: genes/DANRE/cryabb/cryabb-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: cryabb is a soluble cytosolic small HSP and the curator removed plasma membrane for lack
    of evidence; synaptic membrane likely transfers from mammalian CRYAB synaptosome/proteomic data, which
    is plausible given brain expression but untested in zebrafish.
  evidence: existing_annotations GO:0005886 REMOVE reason; review description
