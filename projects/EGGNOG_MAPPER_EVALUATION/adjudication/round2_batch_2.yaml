claims:
- claim_id: R2-CC-REJ-03
  category: REJECTED
  accession: B7Z0E0
  gene: Idh
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005782
    label: peroxisomal matrix
  review_file: genes/DROME/Idh/Idh-ai-review.yaml
  assessment: "NPI"
  error_type: "DOMAIN_ARCHITECTURE_MISMATCH"
  rationale: "Peroxisomal matrix localization of the donor IDH1/IDP3 enzymes depends on a C-terminal PTS1; every fly Idh isoform (incl. B7Z0E0) ends in ...AVAAK with no PTS1 and fly Idh is documented as cytosolic (IDHc) or mitochondrial (IDHm). The single fly gene is co-orthologous to IDH1 and IDH2, so the IDH1-clade peroxisomal targeting was transferred without the targeting signal that confers it."
  evidence: "existing_annotations GO:0005777 IBA REMOVE and ISS MARK_AS_OVER_ANNOTATED reasons; uniprot SQ C-terminus AVAAK; review description"
- claim_id: R2-BP-UNR-04
  category: UNRELATED
  accession: P09372
  gene: grpE
  organism_dir: ECOLI
  aspect: BP
  term:
    id: GO:0050790
    label: regulation of catalytic activity
  review_file: genes/ECOLI/grpE/grpE-ai-review.yaml
  assessment: "LSP"
  error_type: null
  rationale: "GrpE is the nucleotide-exchange factor that accelerates ADP release from DnaK and so modulates the DnaK ATPase cycle, so 'regulation of catalytic activity' is technically true, but it is an uninformative grouping BP that merely restates the MF (adenyl-nucleotide exchange factor activity) already captured as the core function."
  evidence: "review description; core_functions GO:0000774"
- claim_id: R2-CC-UNR-12
  category: UNRELATED
  accession: Q9VEC5
  gene: cdm
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005737
    label: cytoplasm
  review_file: genes/DROME/cdm/cdm-ai-review.yaml
  assessment: "COR"
  error_type: null
  rationale: "Cadmus is importin-13, a Ran-regulated karyopherin that shuttles cargo (Mago-Y14) between cytoplasm and nucleus and is seen in and around nuclei; a cytoplasmic pool is intrinsic to its import cycle, and the review currently carries only nucleus/nuclear envelope CC terms."
  evidence: "review description; existing_annotations nucleus/nuclear envelope rows"
- claim_id: R2-CC-UNR-01
  category: UNRELATED
  accession: Q10350
  gene: cab4
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:1990143
    label: CoA-synthesizing protein complex
  review_file: genes/SCHPO/cab4/cab4-ai-review.yaml
  assessment: "UNC"
  error_type: null
  rationale: "The CoA-SPC (Cab2-Cab5, Sis2, Vhs3) is defined from S. cerevisiae; S. pombe cab4 is the PPAT ortholog but is uncharacterised, and its PPCDC is a single fused protein rather than a Cab3-based heterotrimer, so whether an equivalent complex forms in fission yeast is an open question the reviewer explicitly raised."
  evidence: "GO:1990143 definition; review description; suggested_questions on CoA-SPC"
- claim_id: R2-BP-NAR-01
  category: NARROWER
  accession: Q9XYZ4
  gene: mre11
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0007004
    label: telomere maintenance via telomerase
  review_file: genes/DROME/mre11/mre11-ai-review.yaml
  assessment: "NPI"
  error_type: "TAXON_CONSTRAINT_VIOLATION"
  rationale: "Drosophila lacks telomerase and maintains telomere length by HeT-A/TART retrotransposition; fly Mre11 acts in telomere capping (HOAP/HP1 recruitment, fusion prevention), not telomerase-mediated repeat addition. The telomerase-specific child of telomere maintenance was transferred from yeast/mammalian MRE11 where telomerase exists."
  evidence: "review description; existing_annotations GO:0000723 MODIFY to telomere capping reason"
- claim_id: R2-CC-NAR-02
  category: NARROWER
  accession: Q7KNF5
  gene: Su-var-2-10
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0016604
    label: nuclear body
  review_file: genes/DROME/Su-var-2-10/Su-var-2-10-ai-review.yaml
  assessment: "UNC"
  error_type: null
  rationale: "Su(var)2-10 is documented at the nuclear lamina, some polytene telomeres and the nucleoplasm; nuclear-body localization is likely transferred from vertebrate PIAS proteins (PML/nuclear speckle association), and flies lack PML. No fly evidence supports or refutes punctate nuclear-body localization."
  evidence: "review description; existing_annotations nucleoplasm/nuclear lamina rows"
- claim_id: R2-MF-REJ-01
  category: REJECTED
  accession: Q88N56
  gene: groES
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0046872
    label: metal ion binding
  review_file: genes/PSEPK/groES/groES-ai-review.yaml
  assessment: "NPI"
  error_type: "DOMAIN_ARCHITECTURE_MISMATCH"
  rationale: "P. putida GroES (97 aa) is a plain Cpn10 beta-barrel with no His/Cys-rich C-terminal extension of the metal-binding HspA-type co-chaperonins and no annotated metal site or cofactor; its function is GroEL capping, so metal ion binding is unsupported and the curator's removal stands."
  evidence: "existing_annotations GO:0046872 REMOVE reason; uniprot SQ"
- claim_id: R2-BP-REJ-05
  category: REJECTED
  accession: P61009
  gene: SPCS3
  organism_dir: human
  aspect: BP
  term:
    id: GO:0045047
    label: protein targeting to ER
  review_file: genes/human/SPCS3/SPCS3-ai-review.yaml
  assessment: "NPI"
  error_type: "CURATION_MISTAKE"
  rationale: "SPCS3 is a non-catalytic accessory subunit of the ER signal peptidase complex, which cleaves signal peptides from substrates already being translocated; it acts downstream of, and does not direct, ER targeting (SRP/SRP receptor/Sec61 do). The source PANTHER-level term mis-specifies signal-peptide processing as targeting."
  evidence: "existing_annotations GO:0045047 IBA REMOVE reason; GO:0045047 definition; review description"
- claim_id: R2-CC-UNR-07
  category: UNRELATED
  accession: A0A9L0SB67
  gene: DARS2
  organism_dir: HORSE
  aspect: CC
  term:
    id: GO:0005634
    label: nucleus
  review_file: genes/HORSE/DARS2/DARS2-ai-review.yaml
  assessment: "NPI"
  error_type: "LOCALIZATION_DEFAULT"
  rationale: "DARS2 is the mitochondrial aspartyl-tRNA synthetase with an N-terminal mitochondrial targeting sequence acting on mt-tRNA(Asp); no nuclear role or localization is reported (human DARS2 has no nucleus annotation), so nucleus is a generic default localization (possibly bleeding from the cytosolic DARS1 paralog, which has a nuclear pool)."
  evidence: "review description; human DARS2 goa (no nucleus)"
- claim_id: R2-MF-UNR-05
  category: UNRELATED
  accession: Q19542
  gene: che-3
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0045503
    label: dynein light chain binding
  review_file: genes/worm/che-3/che-3-ai-review.yaml
  assessment: "NPI"
  error_type: "COMPLEX_ACTIVITY_TRANSFER"
  rationale: "CHE-3 is the dynein-2 heavy chain; its curated direct contacts are the light intermediate chain (XBX-1) and intermediate chains. In dynein complexes the light chains (LC8, Tctex, roadblock) bind the intermediate chains, not the heavy chain, so dynein light chain binding is a complex-level interaction attributed to the heavy chain (only some axonemal heavy chains bind specific LCs directly)."
  evidence: "existing_annotations dynein light intermediate chain binding and dynein intermediate chain binding rows; review description"
- claim_id: R2-MF-NAR-04
  category: NARROWER
  accession: A8Z522
  gene: fosB
  organism_dir: STAAT
  aspect: MF
  term:
    id: GO:0004364
    label: glutathione transferase activity
  review_file: genes/STAAT/fosB/fosB-ai-review.yaml
  assessment: "PLI"
  error_type: "PARALOG_OVERANNOTATION"
  rationale: "FosB is a divalent-metal-dependent fosfomycin thiol-S-transferase that uses bacillithiol (or L-cysteine) in staphylococci, which lack glutathione; glutathione transferase activity belongs to the FosA subfamily of the fosfomycin-resistance family. The review explicitly states FosB enzymes are not glutathione transferases."
  evidence: "review description; proposed_new_terms justification; ARO mapping finding excluding FosB from GST propagation"
- claim_id: R2-MF-NAR-06
  category: NARROWER
  accession: P34607
  gene: mut-7
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0044748
    label: 3'-5'-exoribonuclease activity involved in mature miRNA 3'-end processing
  review_file: genes/worm/mut-7/mut-7-ai-review.yaml
  assessment: "NPI"
  error_type: "PATHWAY_CONTEXT_IGNORED"
  rationale: "MUT-7 has 3'-5' exoribonuclease activity, but the mature-miRNA 3'-end trimming context comes from Drosophila Nibbler; in C. elegans MUT-7 acts in Mutator-focus 22G siRNA amplification and is required for siRNAs, not miRNAs. The curator marked the same ISS term over-annotated."
  evidence: "existing_annotations GO:0044748 ISS MARK_AS_OVER_ANNOTATED reason; review description"
- claim_id: R2-BP-UNR-07
  category: UNRELATED
  accession: O45830
  gene: ndx-1
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0046712
    label: GDP catabolic process
  review_file: genes/worm/ndx-1/ndx-1-ai-review.yaml
  assessment: "NPI"
  error_type: "CURATION_MISTAKE"
  rationale: "NDX-1 is an 8-oxo-(d)GDP phosphatase that sanitises oxidised guanine nucleotides; purified NDX-1 hydrolyses unoxidised GDP at under 5% and does not act on dGDP. GDP catabolism conflates the oxidised substrate with ordinary GDP and implies a role in normal GDP turnover that is not supported."
  evidence: "review description; existing_annotations nucleoside diphosphate phosphatase MODIFY reason"
- claim_id: R2-MF-UNR-12
  category: UNRELATED
  accession: P0DJ07
  gene: PET100
  organism_dir: human
  aspect: MF
  term:
    id: GO:0051082
    label: unfolded protein binding
  review_file: genes/human/PET100/PET100-ai-review.yaml
  assessment: "NPI"
  error_type: "CURATION_MISTAKE"
  rationale: "PET100 is a COX-specific assembly factor that binds COX subunits (e.g. COX7A2) to incorporate them into an early assembly intermediate; there is no evidence it binds unfolded polypeptides. The 'chaperone' label of assembly factors is conflated with folding-chaperone substrate binding (the review marks the related protein folding chaperone/protein folding terms over-annotated)."
  evidence: "review description; existing_annotations GO:0044183 and GO:0006457 MARK_AS_OVER_ANNOTATED reasons"
- claim_id: R2-BP-NAR-06
  category: NARROWER
  accession: E3W6T6
  gene: tbx5b
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0060039
    label: pericardium development
  review_file: genes/DANRE/tbx5b/tbx5b-ai-review.yaml
  assessment: "NPI"
  error_type: "MULTIPLE_FUNCTIONS"
  rationale: "tbx5b loss causes failed cardiac looping and a fluid-filled edema around the heart, a non-specific consequence of heart dysfunction rather than a defect in development of the pericardial sac; the term is a phenotype-derived transfer (likely from tbx5a/Tbx5 pericardial edema phenotypes)."
  evidence: "review description; existing_annotations heart looping rows quoting PMID:30532148 edema"
- claim_id: R2-CC-NAR-05
  category: NARROWER
  accession: P09605
  gene: Ckmt2
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0044289
    label: mitochondrial inner-outer membrane contact site
  review_file: genes/rat/Ckmt2/Ckmt2-ai-review.yaml
  assessment: "COR"
  error_type: null
  rationale: "Sarcomeric MtCK octamers sit on the intermembrane-space face of the inner membrane, bound to cardiolipin and associated with VDAC and ANT at inner-outer membrane contact sites, which is the classic location for its phosphocreatine shuttle role; this refines the accepted mitochondrial inner membrane term."
  evidence: "review description; core_functions text on contact-site complexes"
- claim_id: R2-BP-UNR-01
  category: UNRELATED
  accession: Q49HM9
  gene: grk7a
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0046777
    label: protein autophosphorylation
  review_file: genes/DANRE/grk7a/grk7a-ai-review.yaml
  assessment: "UNC"
  error_type: null
  rationale: "Autophosphorylation is a known regulatory property of the rhodopsin-kinase subfamily (GRK1/GRK7), and grk7a is an active kinase, but the review and local sources contain no autophosphorylation data for zebrafish Grk7a (only PKA-dependent phosphorylation), so the transfer is plausible but unverified."
  evidence: "review description; existing_annotations kinase activity rows"
- claim_id: R2-CC-REJ-05
  category: REJECTED
  accession: Q01705
  gene: Notch1
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0001669
    label: acrosomal vesicle
  review_file: genes/mouse/Notch1/Notch1-ai-review.yaml
  assessment: "UNC"
  error_type: null
  rationale: "Notch1 is a plasma-membrane receptor with endosomal and nuclear (NICD) pools; the acrosomal vesicle term derives from orthology (ISO, likely a rat immunolocalization in spermatids). The curator removed it only for lack of local evidence, which neither confirms nor refutes the source observation; at most it is a niche non-core localization."
  evidence: "existing_annotations GO:0001669 IEA/ISO REMOVE reasons"
