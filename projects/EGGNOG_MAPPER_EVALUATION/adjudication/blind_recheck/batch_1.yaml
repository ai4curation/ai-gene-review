claims:
- blind_id: B01
  accession: Q9Y6B6
  gene: SAR1B
  organism_dir: human
  aspect: MF
  term:
    id: GO:0097110
    label: scaffold protein binding
  review_file: genes/human/SAR1B/SAR1B-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: SAR1B-GTP is captured at ER exit sites by the SEC16 scaffold together with SEC23/SEC24 (Reactome
    event), so binding a scaffold protein is plausibly true. But it is a bare binding term that says nothing
    about SAR1B's GTPase/COPII-initiating activity.
  evidence: SAR1B review description; Reactome R-HSA-5694417 (SEC16 complex binds SAR1B:GTP:SEC23:SEC24)
- blind_id: B02
  accession: P15108
  gene: HSC82
  organism_dir: yeast
  aspect: MF
  term:
    id: GO:0051082
    label: unfolded protein binding
  review_file: genes/yeast/HSC82/HSC82-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Hsc82 is a bona fide Hsp90 chaperone that binds non-native client proteins, so unfolded protein
    binding is true, but it is less informative than the ATP-dependent protein folding chaperone activity
    (GO:0140662) that the review uses for its core function.
  evidence: HSC82 review description and core functions (GO:0140662); UniProt P15108
- blind_id: B03
  accession: P30038
  gene: ALDH4A1
  organism_dir: human
  aspect: BP
  term:
    id: GO:0007165
    label: signal transduction
  review_file: genes/human/ALDH4A1/ALDH4A1-ai-review.yaml
  assessment: NPI
  error_type: FREQUENCY_BIAS
  rationale: ALDH4A1 is the mitochondrial matrix P5C dehydrogenase of proline catabolism; nothing in the
    review or UniProt places it as a component of a signal transduction pathway. 'Signal transduction'
    is a generic high-frequency term with no specific basis here.
  evidence: ALDH4A1 review description; UniProt P30038
- blind_id: B04
  accession: Q9CAD5
  gene: YDA
  organism_dir: ARATH
  aspect: BP
  term:
    id: GO:0032147
    label: activation of protein kinase activity
  review_file: genes/ARATH/YDA/YDA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: YODA is a MAPKKK that phosphorylates and thereby activates the kinases MKK4/MKK5, which is
    what activation of protein kinase activity describes. Consistent with the review's MAPK cascade core
    function.
  evidence: YDA review description and core function (GO:0000165; phosphorylates and activates MKK4/MKK5)
- blind_id: B05
  accession: Q9W4S9
  gene: Pde4
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0040013
    label: negative regulation of locomotion
  review_file: genes/DROME/Pde4/Pde4-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: No evidence that dunce negatively regulates locomotion; the review and FlyBase phenotypes
    concern learning, memory, courtship and neurophysiology, and dnc-1 adults if anything show decreased
    movement. The term looks phenotype-derived from orthologs and the effect is an indirect cAMP-signaling
    outcome.
  evidence: Pde4 review; Pde4-flybase.txt phenotypes ('decreased rate of movement | adult stage dnc-1')
- blind_id: B06
  accession: Q13451
  gene: FKBP5
  organism_dir: human
  aspect: CC
  term:
    id: GO:0005654
    label: nucleoplasm
  review_file: genes/human/FKBP5/FKBP5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: FKBP5 is mainly cytoplasmic but has a documented nuclear pool linked to steroid receptor
    regulation (UniProt nucleus by similarity, reviewer KEEP_AS_NON_CORE for nucleus); nucleoplasm is
    a reasonable specific nuclear location for this soluble co-chaperone.
  evidence: FKBP5 review nucleus annotations (non-core) and description
- blind_id: B07
  accession: Q88DN4
  gene: lnt
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0016410
    label: N-acyltransferase activity
  review_file: genes/PSEPK/lnt/lnt-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Lnt is apolipoprotein N-acyltransferase, transferring an acyl chain from phospholipid to
    the alpha-amino group of the N-terminal diacylglyceryl-cysteine. GO:0016410 is current (not obsolete)
    in the ontology and is the most specific available term.
  evidence: lnt review description; UniProt FUNCTION; GO:0016410 definition in go-basic-2026-03-25
- blind_id: B08
  accession: P09372
  gene: grpE
  organism_dir: ECOLI
  aspect: BP
  term:
    id: GO:0050790
    label: regulation of catalytic activity
  review_file: genes/ECOLI/grpE/grpE-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: GrpE stimulates ADP release from DnaK and so modulates the DnaK ATPase cycle; this is true
    but the term is very generic compared with its adenyl-nucleotide exchange factor activity.
  evidence: grpE review description (nucleotide-exchange co-chaperone for DnaK)
- blind_id: B09
  accession: Q88N56
  gene: groES
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0046872
    label: metal ion binding
  review_file: genes/PSEPK/groES/groES-ai-review.yaml
  assessment: NPI
  error_type: FREQUENCY_BIAS
  rationale: P. putida GroES is a 97-aa Cpn10 with no His/Cys-rich metal-binding tail (unlike Helicobacter
    HspA) and no annotated metal site or cofactor; its cycle is driven by GroEL ATPase. Metal ion binding
    is unsupported.
  evidence: groES-uniprot.txt sequence (ends ...ENEILAVVEG); review REMOVE of IEA metal ion binding
- blind_id: B10
  accession: A0A6N3IN21
  gene: Sdsl
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0006567
    label: L-threonine catabolic process
  review_file: genes/rat/Sdsl/Sdsl-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Recombinant rat SDSL deaminates L-threonine to 2-oxobutanoate and supports L-threonine degradation
    in cells, so L-threonine catabolic process fits its PLP-dependent dehydratase activity.
  evidence: Sdsl review description (threonine deaminase activity)
- blind_id: B11
  accession: Q99M87
  gene: Dnaja3
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0051059
    label: NF-kappaB binding
  review_file: genes/mouse/Dnaja3/Dnaja3-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Evidence links Tid1 to repression of NF-kappaB signaling (reported via IKK interaction),
    not to direct binding of NF-kappaB transcription factor subunits. The source paper (PMID:15572682)
    shows only modulation of TNF-induced NF-kappaB activity.
  evidence: PMID:15572682 abstract; Dnaja3 review REMOVE reason
- blind_id: B12
  accession: P09605
  gene: Ckmt2
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0044289
    label: mitochondrial inner-outer membrane contact site
  review_file: genes/rat/Ckmt2/Ckmt2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Mitochondrial creatine kinase octamers sit on the intermembrane-space face of the inner membrane
    bound to cardiolipin and associated with VDAC and ANT at inner-outer membrane contact sites, a classic
    localization of MtCK.
  evidence: Ckmt2 review description
- blind_id: B13
  accession: P52286
  gene: SKP1
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0010458
    label: exit from mitosis
  review_file: genes/yeast/SKP1/SKP1-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Skp1 mutants delay mitotic exit and Skp1 interacts with Bfa1, supporting a regulatory role
    rather than direct execution of mitotic exit; the regulation term (GO:0007096) is the better fit and
    the plain process term overstates participation.
  evidence: SKP1 review (IMP PMID:17205042 marked over-annotated, regulation-of row retained)
- blind_id: B14
  accession: Q6U1J5
  gene: col1a1a
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0005794
    label: Golgi apparatus
  review_file: genes/DANRE/col1a1a/col1a1a-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Type I procollagen is synthesized in the ER and transported through the Golgi for secretion,
    so Golgi apparatus is a true (transit) location for the protein, though not where it acts.
  evidence: col1a1a review description and ER/secretion discussion
- blind_id: B15
  accession: P23561
  gene: STE11
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0051286
    label: cell tip
  review_file: genes/yeast/STE11/STE11-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Ste11 is cytoplasmic and transiently recruited by Ste5/Ste50 to plasma-membrane signaling
    sites; Ste5 concentrates at shmoo tips, but there is no direct localization evidence for Ste11 at
    the cell/mating projection tip in the materials available.
  evidence: STE11 review localization annotations (cytoplasm, GFP); notes/deep research
- blind_id: B16
  accession: P02340
  gene: Trp53
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0001221
    label: transcription coregulator binding
  review_file: genes/mouse/Trp53/Trp53-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: p53 binds the coactivators p300/CBP and other coregulators, so the term is true, but the
    review already carries the more specific transcription coactivator binding term.
  evidence: Trp53 review (transcription coactivator binding row; 'Binding and modulation of p53 by p300/CBP
    coactivators')
- blind_id: B17
  accession: Q88CW7
  gene: betB
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006113
    label: fermentation
  review_file: genes/PSEPK/betB/betB-ai-review.yaml
  assessment: NPI
  error_type: PATHWAY_CONTEXT_IGNORED
  rationale: BetB oxidizes betaine aldehyde to glycine betaine for osmoprotection in the obligately aerobic
    P. putida; it has no role in fermentation, a term likely carried over from aldehyde dehydrogenases
    of fermenting organisms.
  evidence: betB review description; P. putida KT2440 physiology
- blind_id: B18
  accession: P20070
  gene: Cyb5r3
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0019852
    label: L-ascorbic acid metabolic process
  review_file: genes/rat/Cyb5r3/Cyb5r3-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Cytochrome b5 reductase is the classical NADH:semidehydroascorbate (ascorbate free radical)
    reductase of microsomal/outer mitochondrial and erythrocyte membranes, regenerating ascorbate, and
    UniProt cross-references Reactome vitamin C metabolism. The process term is reasonable though a non-core
    role.
  evidence: Cyb5r3-uniprot.txt (Reactome R-RNO-196836 Vitamin C metabolism); review suggested_question
    on ascorbate-radical reductase
- blind_id: B19
  accession: Q04195
  gene: SIZ1
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0035861
    label: site of double-strand break
  review_file: genes/yeast/SIZ1/SIZ1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Siz1 contributes only partially (with Siz2 dominant) to DSB relocation to the nuclear periphery
    and to DNA-damage SUMOylation, but there is no direct evidence of Siz1 recruitment to DSB sites; the
    localization may reflect Siz2/Mms21.
  evidence: 'SIZ1 review (PMID:27056668: siz2 more defective than siz1)'
- blind_id: B20
  accession: Q9M9Y8
  gene: CRTISO
  organism_dir: ARATH
  aspect: MF
  term:
    id: GO:0016491
    label: oxidoreductase activity
  review_file: genes/ARATH/CRTISO/CRTISO-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: CRTISO is a prolycopene cis-trans isomerase (EC 5.2.1.13) that uses reduced FAD in a non-redox
    reaction and lacks desaturase activity; oxidoreductase activity reflects the CrtI-family desaturase
    paralogs.
  evidence: CRTISO review description and REMOVE of IEA oxidoreductase
- blind_id: B21
  accession: O45830
  gene: ndx-1
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0046712
    label: GDP catabolic process
  review_file: genes/worm/ndx-1/ndx-1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NDX-1 hydrolyses oxidised 8-oxo-(d)GDP; it does not act on dGDP and hydrolyses GDP at under
    5% of the 8-oxo rate, so GDP catabolism conflates the oxidised nucleotide substrate with GDP.
  evidence: ndx-1 review description and activity reasons (GDP <5%)
- blind_id: B22
  accession: Q9PUR2
  gene: cryaba
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0032355
    label: response to estradiol
  review_file: genes/DANRE/cryaba/cryaba-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: '''Response to estradiol'' is a common expression-derived term (typically from rodent studies)
    with no evidence for this lens-restricted zebrafish alphaB1-crystallin paralog.'
  evidence: cryaba review description (lens-restricted paralog; no hormone data)
