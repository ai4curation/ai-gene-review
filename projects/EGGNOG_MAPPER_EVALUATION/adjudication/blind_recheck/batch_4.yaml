claims:
- blind_id: B67
  accession: Q7KVQ7
  gene: Tango5
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0016236
    label: macroautophagy
  review_file: genes/DROME/Tango5/Tango5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Tango5 is the Drosophila VMP1 ortholog; fly vmp1 loss blocks normal Atg8a puncta formation,
    causes Ref(2)P accumulation and impairs developmental mitophagy, and VMP1-family ER scramblases act
    in phagophore expansion. Macroautophagy is a sound, informative process term.
  evidence: Tango5 deep-research (Shen 2021 fly vmp1 data); UniProt VMP1 family
- blind_id: B68
  accession: Q9BZX2
  gene: UCK2
  organism_dir: human
  aspect: BP
  term:
    id: GO:0007631
    label: feeding behavior
  review_file: genes/human/UCK2/UCK2-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: UCK2 is a cytosolic pyrimidine ribonucleoside salvage kinase; no evidence links it to feeding
    behavior. The term likely reflects a phenotype-level transfer from an ortholog and has no mechanistic
    basis.
  evidence: UCK2 review (IEA feeding behavior REMOVE); UCK2 deep research
- blind_id: B69
  accession: Q01279
  gene: Egfr
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0005576
    label: extracellular region
  review_file: genes/mouse/Egfr/Egfr-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Canonical mouse Egfr is a single-pass plasma-membrane receptor, and the UniProt entry lists
    no secreted isoform; however soluble EGFR splice products and exosomal EGFR are reported in mammals.
    The extracellular localization cannot be confirmed or refuted for this entry from the available evidence.
  evidence: Egfr UniProt subcellular location; Egfr review (no extracellular region row)
- blind_id: B70
  accession: P61009
  gene: SPCS3
  organism_dir: human
  aspect: BP
  term:
    id: GO:0045047
    label: protein targeting to ER
  review_file: genes/human/SPCS3/SPCS3-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: SPCS3 is a non-catalytic subunit of the ER signal peptidase complex, which cleaves signal
    peptides of substrates already being translocated; it does not direct proteins to the ER. The accurate
    process is signal-peptide processing / protein processing.
  evidence: SPCS3 review (IBA protein targeting to ER REMOVE); GO:0045047 definition
- blind_id: B71
  accession: P91682
  gene: smo
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0071679
    label: commissural neuron axon guidance
  review_file: genes/DROME/smo/smo-ai-review.yaml
  assessment: NPI
  error_type: PATHWAY_CONTEXT_IGNORED
  rationale: Shh-Smo guidance of commissural axons is a vertebrate non-canonical Hedgehog function; no
    such role is described for Drosophila smo, whose characterized roles are patterning, growth, stem
    cells and ciliary signalling. The transfer applies vertebrate-specific pathway usage to the fly.
  evidence: smo review (IBA commissural axon guidance REMOVE, vertebrate-only donors)
- blind_id: B72
  accession: P50591
  gene: TNFSF10
  organism_dir: human
  aspect: MF
  term:
    id: GO:0045569
    label: TRAIL binding
  review_file: genes/human/TNFSF10/TNFSF10-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: TNFSF10 is the TRAIL ligand itself; GO:0045569 is meant for proteins that bind TRAIL, such
    as its DR4/DR5/decoy receptors. The ligand's homotrimer self-association is better captured as identical
    protein binding.
  evidence: TNFSF10 review (IEA TRAIL binding MODIFY to identical protein binding); GO:0045569 definition
- blind_id: B73
  accession: P48500
  gene: Tpi1
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0030018
    label: Z disc
  review_file: genes/rat/Tpi1/Tpi1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Tpi1 is a cytosolic glycolytic isomerase. Some glycolytic enzymes associate with sarcomeric
    structures in muscle, but neither the review nor the UniProt record gives evidence placing rat Tpi1
    at the Z disc.
  evidence: Tpi1 review and UniProt (no Z disc evidence)
- blind_id: B74
  accession: P27638
  gene: spk1
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:0010494
    label: cytoplasmic stress granule
  review_file: genes/SCHPO/spk1/spk1-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: Spk1 is the pheromone-pathway MAPK, active in the nucleus during mating. Stress-granule localization
    is documented for the cell-integrity MAPK Pmk1 (and stress MAPK contexts), not for Spk1, so the term
    likely transfers a paralog-specific localization.
  evidence: spk1 review/UniProt (no stress granule evidence); MAPK paralog biology
- blind_id: B75
  accession: Q88KF4
  gene: acnA-II
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003994
    label: aconitate hydratase activity
  review_file: genes/PSEPK/acnA-II/acnA-II-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: PP_2336 carries the IPR012708 AcnD family signature and acts as the Fe-S 2-methylcitrate
    dehydratase of the 2-methylcitrate cycle. Canonical citrate/isocitrate aconitase activity belongs
    to the AcnA/AcnB paralogs.
  evidence: acnA-II review (GO:0003994 REMOVE); UniProt IPR012708
- blind_id: B76
  accession: A0A8M9Q8E3
  gene: cryabb
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0097060
    label: synaptic membrane
  review_file: genes/DANRE/cryabb/cryabb-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: cryabb is a small heat shock protein holdase expressed in lens, heart, muscle and brain.
    No evidence places it in synaptic membranes, but sparse data on zebrafish brain localization means
    the term can be neither confirmed nor firmly refuted.
  evidence: cryabb review description; no synaptic localization data
- blind_id: B77
  accession: Q01705
  gene: Notch1
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0008045
    label: motor neuron axon guidance
  review_file: genes/mouse/Notch1/Notch1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Notch controls motor axon guidance in Drosophila (Notch/Abl signalling), but the mouse Notch1
    review has no evidence for motor neuron axon guidance. Transfer of the fly role to mouse Notch1 is
    plausible but unverified.
  evidence: Notch1 review (no axon guidance rows); knowledge of fly Notch guidance
- blind_id: B78
  accession: P06761
  gene: Hspa5
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0060904
    label: regulation of protein folding in endoplasmic reticulum
  review_file: genes/rat/Hspa5/Hspa5-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: BiP is the major ER lumenal Hsp70 chaperone that directly carries out ER protein folding,
    and it also tunes ER folding capacity through UPR sensor control. The regulation term is defensible
    but less precise than the folding-in-ER process BiP directly executes.
  evidence: Hspa5 review description; GO:0060904 definition
- blind_id: B79
  accession: Q88KF4
  gene: acnA-II
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003994
    label: aconitate hydratase activity
  review_file: genes/PSEPK/acnA-II/acnA-II-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: This is a duplicate claim of B75. AcnA-II is the AcnD-family 2-methylcitrate dehydratase,
    not a canonical citrate/isocitrate aconitase, so the transfer comes from the AcnA/AcnB paralog function.
  evidence: acnA-II review (GO:0003994 REMOVE); UniProt IPR012708
- blind_id: B80
  accession: Q8IG69
  gene: cebp-2
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0016071
    label: mRNA metabolic process
  review_file: genes/worm/cebp-2/cebp-2-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: CEBP-2 is a bZIP transcription factor (C/EBPgamma ortholog) acting in surveillance immunity
    and lipid metabolism gene regulation. A generic mRNA metabolic process term has no specific support
    and does not describe a transcription factor's role.
  evidence: cebp-2 review and deep research
- blind_id: B81
  accession: Q9VT70
  gene: nudE
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005871
    label: kinesin complex
  review_file: genes/DROME/nudE/nudE-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NudE is a Lis1/dynein-binding regulator of cytoplasmic dynein, not a kinesin complex subunit.
    The term traces to an over-propagated single interaction report in the NDE1/NDEL1 family.
  evidence: nudE review (IBA kinesin complex REMOVE)
- blind_id: B82
  accession: P11798
  gene: Camk2a
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  review_file: genes/mouse/Camk2a/Camk2a-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: CaMKIIalpha is a Ca2+/calmodulin-dependent Ser/Thr kinase with no guanine-nucleotide exchange
    activity. It participates in Ras-pathway Reactome events only as a kinase, and the GEF step is performed
    by the actual GEFs.
  evidence: Camk2a review description; human CAMK2A review (Reactome RAS GEF reaction note)
- blind_id: B83
  accession: P47196
  gene: Akt1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0071276
    label: cellular response to cadmium ion
  review_file: genes/rat/Akt1/Akt1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Akt is activated by cadmium exposure in various cell studies, so a cellular-response role
    is plausible. It is a context-specific, phenotype-level annotation, however, and the rat review does
    not evidence it.
  evidence: Akt1 review (no cadmium row; notes ISO over-annotation of stress-response terms)
- blind_id: B84
  accession: Q88N51
  gene: sbcB
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  review_file: genes/PSEPK/sbcB/sbcB-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: SbcB is Exonuclease I (EC 3.1.11.1), a ssDNA-specific 3'-5' exonuclease. RNA 3'-5' exonuclease
    activity belongs to related DEDD-family paralogs such as RNase T and oligoribonuclease.
  evidence: sbcB review (GO:0000175 REMOVE, contradicted by EC 3.1.11.1)
- blind_id: B85
  accession: P31266
  gene: Rbpj
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0006310
    label: DNA recombination
  review_file: genes/mouse/Rbpj/Rbpj-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Rbpj was originally named as an immunoglobulin recombination-signal-binding protein, but
    it is a sequence-specific CSL transcription factor of Notch signalling, and the V(D)J recombination
    role was not upheld. No evidence supports direct participation in DNA recombination.
  evidence: Rbpj review description
- blind_id: B86
  accession: O60238
  gene: BNIP3L
  organism_dir: human
  aspect: BP
  term:
    id: GO:0051607
    label: defense response to virus
  review_file: genes/human/BNIP3L/BNIP3L-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NIX is a mitophagy receptor. Its known viral link is hijacking by SARS-CoV-2 ORF10 to promote
    mitophagy and dampen antiviral signalling, which is the opposite of host defense. No evidence supports
    a role in defense response to virus.
  evidence: BNIP3L review (ORF10 interaction row; mitophagy receptor description)
