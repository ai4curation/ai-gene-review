claims:
- blind_id: B23
  accession: Q9VEC5
  gene: cdm
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005737
    label: cytoplasm
  review_file: genes/DROME/cdm/cdm-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Cadmus is importin-13, a Ran-regulated karyopherin that shuttles cargo between cytoplasm
    and nucleus, so a cytoplasmic location is genuinely part of its working cycle.
  evidence: cdm review description; importin-beta family membership (cdm-uniprot.txt)
- blind_id: B24
  accession: Q08273
  gene: HRT1
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0031467
    label: Cul7-RING ubiquitin ligase complex
  review_file: genes/yeast/HRT1/HRT1-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: GO:0031467 requires a Cul7-subfamily cullin, which is a metazoan-specific cullin; S. cerevisiae
    has only Cdc53, Cul3 and Rtt101/Cul8, all of which Hrt1 partners with. The Cul7-RING complex does
    not exist in yeast.
  evidence: GO:0031467 definition; HRT1 review description listing yeast cullins
- blind_id: B25
  accession: Q01705
  gene: Notch1
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0001669
    label: acrosomal vesicle
  review_file: genes/mouse/Notch1/Notch1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Notch1 is a juxtacrine receptor at the plasma membrane/endosomes with nuclear NICD; no evidence
    places it in the sperm acrosomal vesicle. The orthology-sourced localization lacks biological support.
  evidence: Notch1 review (IEA and ISO acrosomal vesicle rows REMOVEd); Notch1 description
- blind_id: B26
  accession: G5EBX9
  gene: pef-1
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0005634
    label: nucleus
  review_file: genes/worm/pef-1/pef-1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: PEF-1 is N-myristoylated and palmitoylated and localizes to sensory-neuron membranes and
    cilia; experimental studies observed no nuclear localization. The family-level nucleus assignment
    does not apply to this lipid-anchored ciliary phosphatase.
  evidence: pef-1 review (IBA nucleus REMOVE; PMID:11312268, PMID:39550471)
- blind_id: B27
  accession: A1ZBJ2
  gene: Acadvl
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0042645
    label: mitochondrial nucleoid
  review_file: genes/DROME/Acadvl/Acadvl-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Mitochondrial nucleoid for VLCAD rests on a nucleoid proteomics study in human cells (ACADVL
    IDA, PMID:18063578), where many inner-membrane metabolic enzymes co-purify; it has not been examined
    in Drosophila Acadvl. Mitochondrial inner-membrane matrix-face location is solid, but nucleoid association
    is neither validated nor refuted.
  evidence: human ACADVL review (nucleoid IDA kept non-core); Acadvl review description
- blind_id: B28
  accession: Q88QE6
  gene: ubiX
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0008694
    label: 4-hydroxy-3-polyprenylbenzoate decarboxylase activity
  review_file: genes/PSEPK/ubiX/ubiX-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: UbiX is a flavin prenyltransferase that makes prenylated FMN; the decarboxylation of 4-hydroxy-3-polyprenylbenzoate
    is catalysed by UbiD using that cofactor. The decarboxylase activity is a historical misassignment
    to UbiX.
  evidence: ubiX review description; known UbiX/UbiD division of labour
- blind_id: B29
  accession: Q6PEI9
  gene: col1a1b
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0005794
    label: Golgi apparatus
  review_file: genes/DANRE/col1a1b/col1a1b-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: col1a1b encodes a secreted fibrillar procollagen chain that, like other type I procollagen
    chains, transits the Golgi during secretion (immunogold-detected in ER/Golgi in mammalian alpha1(I)).
    Golgi is a valid transit location, although not the mature-protein compartment.
  evidence: col1a1b review description (secreted procollagen); human COL1A1 review discussion of ER/Golgi/secretory-granule
    localization
- blind_id: B30
  accession: P15108
  gene: HSC82
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0044182
    label: filamentous growth of a population of unicellular organisms
  review_file: genes/yeast/HSC82/HSC82-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Hsc82 is a general Hsp90 chaperone; nothing in the review or SGD record links it to pseudohyphal/filamentous
    growth, and Hsp90 effects on filamentation (e.g. in Candida) are indirect, via client signaling. A
    phenotype-derived process term is not a function of the chaperone.
  evidence: HSC82 review description and annotations (no filamentous growth evidence)
- blind_id: B31
  accession: O74689
  gene: nudE
  organism_dir: EMENI
  aspect: CC
  term:
    id: GO:0005871
    label: kinesin complex
  review_file: genes/EMENI/nudE/nudE-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NudE-family proteins are LIS1/dynein regulators, not kinesin subunits; the source data describe
    rat Ndel1 as a kinesin-1 cargo, which does not make it a kinesin complex component.
  evidence: nudE review (IBA kinesin complex REMOVE); description of NudE dynein role
- blind_id: B32
  accession: Q01477
  gene: UBP3
  organism_dir: yeast
  aspect: MF
  term:
    id: GO:0043022
    label: ribosome binding
  review_file: genes/yeast/UBP3/UBP3-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Ubp3-Bre5 deubiquitinates ribosomal proteins during ribophagy and Ubp3 is the yeast USP10
    homolog, which acts on ribosomal proteins, so ribosome association is plausible. Direct ribosome binding
    by Ubp3 is not documented in the review or UniProt record.
  evidence: UBP3 review (ribophagy, PMID:18391941-type ribophagy evidence); UBP3-uniprot.txt
- blind_id: B33
  accession: Q88PK7
  gene: iscU
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  review_file: genes/PSEPK/iscU/iscU-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: IscU is an Fe-S cluster assembly scaffold; any effect on cellular iron levels is a downstream
    consequence of Fe-S deficiency (in eukaryotes via IRP/Aft regulons absent from Pseudomonas). The process
    term is phenotype-derived rather than a function of the scaffold.
  evidence: iscU review description; GO:0006879 definition; UniProt GO only Fe-S assembly
- blind_id: B34
  accession: P00684
  gene: Rnase1
  organism_dir: rat
  aspect: MF
  term:
    id: GO:0042802
    label: identical protein binding
  review_file: genes/rat/Rnase1/Rnase1-ai-review.yaml
  assessment: NPI
  error_type: IN_VITRO_NOT_IN_VIVO
  rationale: UniProt describes rat Rnase1 as a monomer; RNase A self-association is the artificial domain-swapped
    dimer/oligomer formed in vitro under denaturing conditions. Identical protein binding is also uninformative
    about its ribonuclease function.
  evidence: 'Rnase1-uniprot.txt SUBUNIT: Monomer; Rnase1 review description'
- blind_id: B35
  accession: Q1XHL7
  gene: grk7b
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0046777
    label: protein autophosphorylation
  review_file: genes/DANRE/grk7b/grk7b-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Grk7b is a catalytically active GRK1/GRK7-type rhodopsin kinase, and autophosphorylation
    is a conserved regulatory property of photoreceptor GRKs (GRK1 and GRK7). Not directly shown for zebrafish
    Grk7b, but the active kinase domain makes it a sound inference.
  evidence: grk7b review description and uniprot (active rhodopsin kinase, PMID:16787417); GRK family
    knowledge
- blind_id: B36
  accession: H6TB12
  gene: mdr
  organism_dir: STABO
  aspect: CC
  term:
    id: GO:0000324
    label: fungal-type vacuole
  review_file: genes/STABO/mdr/mdr-ai-review.yaml
  assessment: NPI
  error_type: PARALOG_OVERANNOTATION
  rationale: Mdr is the sophorolipid exporter shown to act at the plasma membrane (UniProt Cell membrane,
    IMP plasma membrane). The vacuolar location comes from other ABC transporters with distinct roles.
  evidence: mdr review and mdr-uniprot.txt (plasma membrane IMP, PMID:23516968)
- blind_id: B37
  accession: Q88R95
  gene: ssuD
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0009408
    label: response to heat
  review_file: genes/PSEPK/ssuD/ssuD-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: SsuD is an FMNH2-dependent alkanesulfonate monooxygenase induced by sulfate starvation; nothing
    links it to a heat response. Any such term would rest on expression/phenotype data rather than its
    function.
  evidence: ssuD review description (no heat or stress evidence)
- blind_id: B38
  accession: P19324
  gene: Serpinh1
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  review_file: genes/mouse/Serpinh1/Serpinh1-ai-review.yaml
  assessment: NPI
  error_type: PSEUDOENZYME_OVERANNOTATION
  rationale: HSP47 is a non-inhibitory serpin that has lost protease inhibitor activity and acts as a
    collagen-specific ER chaperone. The serpin-family inhibitor activity does not apply.
  evidence: Serpinh1 review description; IBA and IEA rows REMOVEd
- blind_id: B39
  accession: P63086
  gene: Mapk1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0019858
    label: cytosine metabolic process
  review_file: genes/rat/Mapk1/Mapk1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: ERK2 is a protein kinase in MAPK signaling with no role in cytosine base metabolism. The
    source annotation has no plausible biological basis.
  evidence: Mapk1 review (ISO cytosine metabolic process REMOVE); description
- blind_id: B40
  accession: Q9P7N2
  gene: vas2
  organism_dir: SCHPO
  aspect: BP
  term:
    id: GO:0006896
    label: Golgi to vacuole transport
  review_file: genes/SCHPO/vas2/vas2-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Vas2 is the AP-1 sigma subunit, which in S. pombe acts in TGN-endosome and endosome-plasma
    membrane traffic; apm1 loss gives vacuole-fusion defects. Direct Golgi-to-vacuole transport is classically
    an AP-3 function, and there is no specific evidence either way for AP-1 in fission yeast.
  evidence: vas2-uniprot.txt GO (trans-Golgi to endosome, endosome to Golgi); vas2 deep research (Apm1
    vacuole defects)
- blind_id: B41
  accession: P14056
  gene: Araf
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0043524
    label: negative regulation of neuron apoptotic process
  review_file: genes/rat/Araf/Araf-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: A-Raf has a documented anti-apoptotic role through MST2 sequestration, which the review retains
    as negative regulation of apoptotic process. No evidence specifically for neuron survival appears
    for Araf; the neuronal term may reflect B-Raf neurotrophic signaling.
  evidence: Araf review (negative regulation of apoptotic process kept); no neuronal evidence
- blind_id: B42
  accession: O89110
  gene: Casp8
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0097110
    label: scaffold protein binding
  review_file: genes/mouse/Casp8/Casp8-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Caspase-8 binds FADD/RIPK1 platforms that tether death-complex components, so a scaffold-binding
    statement is loosely true. It is a generic protein-binding child; death effector domain binding captures
    the interaction more precisely.
  evidence: Casp8 review (scaffold protein binding MODIFY to GO:0035877); GO:0097110 definition
- blind_id: B43
  accession: P63018
  gene: Hspa8
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0009267
    label: cellular response to starvation
  review_file: genes/rat/Hspa8/Hspa8-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: HSC70 is the cytosolic targeting chaperone for chaperone-mediated autophagy, which is activated
    by prolonged starvation, so a role in the starvation response is defensible. The more precise process
    is chaperone-mediated autophagy, which the gene already carries.
  evidence: Hspa8 review description (CMA) and response to starvation IEP row
- blind_id: B44
  accession: O94826
  gene: TOMM70
  organism_dir: human
  aspect: MF
  term:
    id: GO:0015450
    label: protein-transporting ATPase activity
  review_file: genes/human/TOMM70/TOMM70-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: TOMM70 is a cytosol-facing receptor that docks chaperone-bound precursors and passes them
    to the TOM channel; it has no ATPase or translocase activity, and the TOM import pore itself is not
    ATP-hydrolysis driven. A translocation activity is assigned to an accessory receptor.
  evidence: TOMM70 review description; GO:0015450 definition
