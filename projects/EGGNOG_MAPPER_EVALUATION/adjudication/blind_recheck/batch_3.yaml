claims:
- blind_id: B45
  accession: P70677
  gene: Casp3
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0002020
    label: protease binding
  review_file: genes/mouse/Casp3/Casp3-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Caspase-3 does physically engage other proteases (it is cleaved and activated by initiator
    caspases-8/9 and granzyme B), so protease binding is not false, but it is a generic binding term that
    adds nothing over its effector cysteine-type endopeptidase activity.
  evidence: Casp3 review (effector protease role); UniProt function text
- blind_id: B46
  accession: Q19542
  gene: che-3
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0045503
    label: dynein light chain binding
  review_file: genes/worm/che-3/che-3-ai-review.yaml
  assessment: NPI
  error_type: PARALOG_OVERANNOTATION
  rationale: In cytoplasmic dynein-2 the light chains (LC8, TCTEX, roadblock) dock on the intermediate
    chains, not on the heavy chain; direct heavy-chain/light-chain contacts are a feature of axonemal
    outer-arm dynein heavy chains. CHE-3 is supported for intermediate and light-intermediate chain binding
    only.
  evidence: che-3 review (IC and LIC binding accepted; no DLC binding evidence); dynein-2 architecture
- blind_id: B47
  accession: Q21554
  gene: ddb-1
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0003684
    label: damaged DNA binding
  review_file: genes/worm/ddb-1/ddb-1-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: Damaged-DNA recognition in the UV-DDB complex is supplied by DDB2; DDB1 is a triple beta-propeller
    adaptor of CRL4 that binds CUL4 and DCAFs. The term transfers a complex/partner activity to the adaptor
    subunit, with no worm evidence of DDB-1 nucleic acid binding.
  evidence: ddb-1 review description and line ~31 (DNA binding provided by DDB2)
- blind_id: B48
  accession: Q88KF2
  gene: prpD
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  review_file: genes/PSEPK/prpD/prpD-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: PrpD 2-methylcitrate dehydratase is a cofactor-independent MmgE/PrpD-family enzyme; purified
    PrpD contains no iron-sulfur center and needs no metals. The Fe-S cluster binding belongs to aconitase-type
    dehydratases (e.g. AcnD), not this fold.
  evidence: PMID:11294638 quoted in prpD review; prpD description
- blind_id: B49
  accession: B7Z0E0
  gene: Idh
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005782
    label: peroxisomal matrix
  review_file: genes/DROME/Idh/Idh-ai-review.yaml
  assessment: NPI
  error_type: PARALOG_OVERANNOTATION
  rationale: Fly Idh is the single pre-duplication ortholog of IDH1/IDH2; peroxisomal targeting of IDH1/yeast
    IDP3 depends on a C-terminal PTS1, but the fly protein ends ...NAVAAK with no PTS1, and fly Idh is
    described as cytosolic/mitochondrial. Peroxisomal matrix localization is unsupported.
  evidence: Idh-uniprot.txt sequence C-terminus; Idh review peroxisome rows; deep research
- blind_id: B50
  accession: P91302
  gene: ubl-5
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0031386
    label: protein tag activity
  review_file: genes/worm/ubl-5/ubl-5-ai-review.yaml
  assessment: NPI
  error_type: PARALOG_OVERANNOTATION
  rationale: UBL-5/Hub1 lacks the C-terminal di-glycine motif and acts through non-covalent interactions
    with spliceosomal proteins; it is not conjugated to targets. Protein tag activity is a ubiquitin/UBL-family
    function not shared by this subfamily.
  evidence: ubl-5 review description and IBA row reason
- blind_id: B51
  accession: P10639
  gene: Txn1
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0004791
    label: thioredoxin-disulfide reductase (NADPH) activity
  review_file: genes/mouse/Txn1/Txn1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Thioredoxin-1 is the substrate of thioredoxin-disulfide reductase (Txnrd1/2), not the catalyst;
    Txn1 is a CGPC dithiol-disulfide oxidoreductase with no NADPH-binding flavoenzyme domain. The term
    inverts enzyme and substrate.
  evidence: Txn1 review description; GO:0004791 definition (RHEA:20345)
- blind_id: B52
  accession: P12023
  gene: App
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0006468
    label: protein phosphorylation
  review_file: genes/mouse/App/App-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: APP has no kinase activity and does not itself phosphorylate proteins. The source IMP row
    cites a paper on Abeta-triggered dephosphorylation of NR2B, so the transferred process is both indirect
    and mis-curated.
  evidence: App review row for PMID:16025111 (REMOVE); UniProt P12023
- blind_id: B53
  accession: P0ABZ6
  gene: surA
  organism_dir: ECOLI
  aspect: BP
  term:
    id: GO:0000413
    label: protein peptidyl-prolyl isomerization
  review_file: genes/ECOLI/surA/surA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: 'SurA carries parvulin-type PPIase domains with demonstrated peptidyl-prolyl cis-trans isomerase
    activity, which the review accepts, so the corresponding isomerization process is consistent. Caveat:
    the PPIase activity is largely dispensable for its in vivo OMP chaperone role.'
  evidence: surA review (PPIase activity IBA/IEA accepted)
- blind_id: B54
  accession: Q95XH2
  gene: epg-9
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0046983
    label: protein dimerization activity
  review_file: genes/worm/epg-9/epg-9-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: ATG101/EPG-9 forms a HORMA-HORMA heterodimer with ATG13/EPG-1, so dimerization is true, but
    the generic term is uninformative compared with its role as a structural subunit of the UNC-51/Atg1
    initiation complex.
  evidence: epg-9 review (direct EPG-9-EPG-1 interaction, complex membership)
- blind_id: B55
  accession: Q86BP6
  gene: elg1
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0033260
    label: nuclear DNA replication
  review_file: genes/DROME/elg1/elg1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Elg1/ATAD5 RFC-like complex unloads PCNA from chromatin after replication in S phase, and
    fly elg1 depletion raises chromatin-bound PCNA; it participates in nuclear DNA replication, consistent
    with the review core DNA-templated DNA replication term.
  evidence: elg1 review description and replication rows
- blind_id: B56
  accession: Q88DL7
  gene: rlmH
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0042803
    label: protein homodimerization activity
  review_file: genes/PSEPK/rlmH/rlmH-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: RlmH is a SPOUT methyltransferase that functions as an obligate homodimer, with a composite
    asymmetric active site formed across the two subunits; homodimerization is mechanistically integral.
  evidence: rlmH review description; UniProt SUBUNIT Homodimer (HAMAP MF_00658)
- blind_id: B57
  accession: B7Z0E0
  gene: Idh
  organism_dir: DROME
  aspect: MF
  term:
    id: GO:0051990
    label: (R)-2-hydroxyglutarate dehydrogenase activity
  review_file: genes/DROME/Idh/Idh-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Wild-type NADP-IDH does not oxidize (R)-2-hydroxyglutarate; 2HG production is a neomorphic
    property of engineered/cancer R132H-type mutants (fly Idh-R195H), and the dehydrogenase direction
    belongs to FAD-dependent D2HGDH. Not a function of wild-type B7Z0E0.
  evidence: Idh deep-research-falcon (neomorphic allele must not be assigned to wild-type); GO:0051990
    def
- blind_id: B58
  accession: Q8MMJ4
  gene: Gcm
  organism_dir: STRPU
  aspect: BP
  term:
    id: GO:0007403
    label: glial cell fate determination
  review_file: genes/STRPU/Gcm/Gcm-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: In the sea urchin embryo Gcm is a direct Delta/Notch target that specifies non-skeletal mesoderm
    pigment cells, not glia; glial fate determination is the Drosophila-lineage function of gcm and is
    not conserved here.
  evidence: Gcm review description (pigment cell specification)
- blind_id: B59
  accession: P63018
  gene: Hspa8
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0046777
    label: protein autophosphorylation
  review_file: genes/rat/Hspa8/Hspa8-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: The source paper (PMID:8420978) does report that purified rat hsc70 autophosphorylates in
    vitro, but only substoichiometrically (<1% of molecules) and uncorrelated with ATPase; physiological
    relevance is unestablished, so the term can be neither confirmed nor refuted as a real function.
  evidence: PMID:8420978 abstract; Hspa8 review
- blind_id: B60
  accession: P30776
  gene: rad21
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:0005739
    label: mitochondrion
  review_file: genes/SCHPO/rad21/rad21-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Rad21 is the alpha-kleisin of the nuclear cohesin complex acting on chromatin; there is no
    credible evidence for mitochondrial localization or function, so the term likely stems from a high-throughput
    localization artifact.
  evidence: rad21 review description (no mitochondrial support)
- blind_id: B61
  accession: Q88D80
  gene: putA
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0000987
    label: cis-regulatory region sequence-specific DNA binding
  review_file: genes/PSEPK/putA/putA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: P. putida PutA has an N-terminal ribbon-helix-helix domain that binds the put control DNA
    sequence (14-bp operator, gel shift) and represses the put promoters; sequence-specific cis-regulatory
    DNA binding is directly supported.
  evidence: putA review (DNA-binding repressor rows; PpPutA45 EMSA)
- blind_id: B62
  accession: Q6PHK4
  gene: agxtb
  organism_dir: DANRE
  aspect: MF
  term:
    id: GO:0016597
    label: amino acid binding
  review_file: genes/DANRE/agxtb/agxtb-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: As a PLP-dependent alanine-glyoxylate aminotransferase agxtb necessarily binds L-alanine/serine
    substrates, but amino acid binding is an uninformative substrate-binding term relative to its transaminase
    activity.
  evidence: agxtb review description
- blind_id: B63
  accession: Q10350
  gene: cab4
  organism_dir: SCHPO
  aspect: MF
  term:
    id: GO:0004140
    label: dephospho-CoA kinase activity
  review_file: genes/SCHPO/cab4/cab4-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: Cab4 consists only of a cytidylyltransferase-like PPAT domain; dephospho-CoA kinase is a
    separate P-loop kinase (Cab5 in yeasts). The IBA/orthology transfer from bacterial CoaE-containing
    nodes does not apply to this domain architecture.
  evidence: cab4 review description and IBA row reason
- blind_id: B64
  accession: P02761
  gene: Ratn1
  organism_dir: rat
  aspect: MF
  term:
    id: GO:0005009
    label: insulin receptor activity
  review_file: genes/rat/Ratn1/Ratn1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Rat n 1 is a secreted ~19 kDa lipocalin lacking transmembrane and tyrosine kinase domains;
    the mouse MUP1 source study found MUP1 did not alter insulin receptor phosphorylation, so the source
    annotation is itself unsupported.
  evidence: Ratn1 review row (PMID:19258313); UniProt
- blind_id: B65
  accession: Q9SQR3
  gene: D14
  organism_dir: ARATH
  aspect: BP
  term:
    id: GO:1901601
    label: strigolactone biosynthetic process
  review_file: genes/ARATH/D14/D14-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: D14 is the strigolactone receptor/hydrolase acting downstream of SL synthesis (D27, CCD7,
    CCD8, MAX1); d14 mutants are SL-insensitive and altered SL levels reflect feedback, so the biosynthetic
    process term is phenotype-derived.
  evidence: D14 review IBA and IMP rows
- blind_id: B66
  accession: Q88DY9
  gene: ilvH
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003984
    label: acetolactate synthase activity
  review_file: genes/PSEPK/ilvH/ilvH-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: IlvH is the small ACT-domain regulatory subunit of AHAS; catalysis resides in IlvI. Assigning
    acetolactate synthase activity (enables) to the regulatory subunit transfers the complex catalytic
    activity.
  evidence: ilvH review description and IEA row
