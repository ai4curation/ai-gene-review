claims:
- claim_id: NAR-15
  category: NARROWER
  accession: P52286
  gene: SKP1
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0010458
    label: exit from mitosis
  review_file: genes/yeast/SKP1/SKP1-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Skp1 mutant mitotic arrest (short spindle, G2 DNA content) is attributed in the review to
    Skp1's CBF3 kinetochore role and SCF-driven G1/S and G2/M transitions; no evidence that Skp1 drives
    the M-to-G1 exit transition, so this looks like a phenotype-derived term from an ortholog's mitotic-arrest
    phenotype.
  evidence: review existing_annotations G1/S, G2/M transition and mitotic cell cycle entries; description
- claim_id: REJ-02
  category: REJECTED
  accession: O60238
  gene: BNIP3L
  organism_dir: human
  aspect: BP
  term:
    id: GO:0051607
    label: defense response to virus
  review_file: genes/human/BNIP3L/BNIP3L-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: 'Curator removed defense response to virus: the source 1999 paper concerns apoptosis/BCL-2
    interactions, and later work shows NIX-mediated mitophagy is hijacked by SARS-CoV-2 ORF10 to degrade
    MAVS, i.e. viral immune evasion rather than host antiviral defense. Transferring the same unsupported
    ortholog annotation does not add evidence.'
  evidence: existing_annotations GO:0051607 REMOVE reason (PMID:9973195, PMID:34845370)
- claim_id: UNR-37
  category: UNRELATED
  accession: P27638
  gene: spk1
  organism_dir: SCHPO
  aspect: BP
  term:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  review_file: genes/SCHPO/spk1/spk1-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Spk1 is the terminal MAPK of the pheromone response pathway, which is initiated by the Map3/Mam2
    GPCRs and Gpa1, so it is technically part of a GPCR-initiated pathway; but the review already captures
    the much more specific pheromone response MAPK cascade.
  evidence: review description; core_functions (pheromone response MAPK cascade)
- claim_id: REJ-19
  category: REJECTED
  accession: P10639
  gene: Txn1
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0004791
    label: thioredoxin-disulfide reductase (NADPH) activity
  review_file: genes/mouse/Txn1/Txn1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Thioredoxin is the substrate of thioredoxin reductase (TXNRD), not an NADPH-using reductase
    itself; the review removed the related NAD(P)H-dependent reductase term for exactly this reason. The
    predicted activity belongs to the partner enzyme Txnrd1/2.
  evidence: existing_annotations GO:0047134 REMOVE reason; GO:0004791 definition
- claim_id: UNR-17
  category: UNRELATED
  accession: P30038
  gene: ALDH4A1
  organism_dir: human
  aspect: BP
  term:
    id: GO:0007165
    label: signal transduction
  review_file: genes/human/ALDH4A1/ALDH4A1-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: ALDH4A1 is a mitochondrial delta-1-pyrroline-5-carboxylate dehydrogenase in proline catabolism;
    generic 'signal transduction' has no specific basis for this enzyme and reflects a high-frequency
    ortholog term.
  evidence: review description/core_functions
- claim_id: NAR-05
  category: NARROWER
  accession: Q08273
  gene: HRT1
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0031467
    label: Cul7-RING ubiquitin ligase complex
  review_file: genes/yeast/HRT1/HRT1-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Cul7 (and the Cul7-RING ligase) is metazoan-specific and absent from S. cerevisiae; yeast
    Hrt1/Rbx1 is in SCF, Cul3 and Cul4/Rtt101 cullin-RING complexes, not a Cul7 complex. Transfer from
    metazoan RBX1 ignores lineage.
  evidence: review cullin-RING ligase complex annotations; absence of CUL7 in yeast
- claim_id: UNR-35
  category: UNRELATED
  accession: P06761
  gene: Hspa5
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0060904
    label: regulation of protein folding in endoplasmic reticulum
  review_file: genes/rat/Hspa5/Hspa5-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: BiP/GRP78 is the central ER lumenal Hsp70 that controls folding of nascent secretory and
    membrane proteins; a process term for ER protein folding is not in the curated set (review has the
    protein folding chaperone MF, refolding and UPR terms). The 'regulation of' framing is a slight misfit
    (protein folding in ER, GO:0034975, would be more direct), but the biology is correct.
  revision_note: 'Changed COR -> LSP after PR review (2026-10-18): BiP performs ER folding
    rather than regulating it, so the regulation term is a less precise framing of the true process.'
  evidence: review description; existing_annotations protein folding chaperone, ER lumen
- claim_id: UNR-25
  category: UNRELATED
  accession: P10408
  gene: SecA
  organism_dir: ECOLI
  aspect: MF
  term:
    id: GO:0015462
    label: ABC-type protein transporter activity
  review_file: genes/ECOLI/SecA/SecA-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: SecA is the cytoplasmic DEAD-motor ATPase that drives preprotein translocation through SecYEG
    (protein-exporting ATPase activity, EC 7.4.2.8), not an ABC-type transporter (EC 7.4.2.5) with ABC/transmembrane
    domains; the review accepts GO:0008564 instead.
  evidence: existing_annotations GO:0008564 ACCEPT; GO:0015462 definition/comment
- claim_id: UNR-33
  category: UNRELATED
  accession: Q9HXE5
  gene: rhlB
  organism_dir: PSEAE
  aspect: MF
  term:
    id: GO:0097718
    label: disordered domain specific binding
  review_file: genes/PSEAE/rhlB/rhlB-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: RhlB binds the intrinsically disordered C-terminal scaffold region of RNase E (via an AR1-type
    segment) to assemble the degradosome, as described in the review; disordered domain specific binding
    is a correct and more informative description of that interaction.
  evidence: review description (direct interaction with RNase E via the AR1 motif)
- claim_id: UNR-03
  category: UNRELATED
  accession: Q9UTR0
  gene: sil1
  organism_dir: SCHPO
  aspect: BP
  term:
    id: GO:0050790
    label: regulation of catalytic activity
  review_file: genes/SCHPO/sil1/sil1-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Sil1 is a nucleotide-exchange factor that stimulates the Hsp70 (BiP) ATPase cycle, so it
    does regulate catalytic activity, but this grouping term is uninformative relative to the NEF activity
    captured in the review.
  evidence: review description; core_functions (Hsp70 NEF)
- claim_id: UNR-18
  category: UNRELATED
  accession: P07687
  gene: Ephx1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0006805
    label: xenobiotic metabolic process
  review_file: genes/rat/Ephx1/Ephx1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Microsomal epoxide hydrolase is a classic xenobiotic biotransformation enzyme hydrolysing
    P450-generated arene/aliphatic epoxides (styrene oxide, cis-stilbene oxide etc.); xenobiotic metabolic
    process is correct and not in the curated set.
  evidence: review description; deep-research substrate list
- claim_id: UNR-27
  category: UNRELATED
  accession: P47196
  gene: Akt1
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0071276
    label: cellular response to cadmium ion
  review_file: genes/rat/Akt1/Akt1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Akt phosphorylation changes in cadmium-treated cells are reported in the literature, but
    nothing in the review or UniProt entry supports a specific role of rat Akt1 in cellular response to
    cadmium; this is a stimulus-response readout of a pleiotropic kinase.
  evidence: review and uniprot (no cadmium evidence)
- claim_id: REJ-08
  category: REJECTED
  accession: P02340
  gene: Trp53
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0001221
    label: transcription coregulator binding
  review_file: genes/mouse/Trp53/Trp53-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: p53 directly binds transcriptional coactivators/coregulators (e.g. CBP/p300) as part of its
    transactivation mechanism; the 'rejection' arises only because the review removed bare protein binding
    as uninformative, not because coregulator binding was refuted. The specific term is informative and
    consistent with the core TF function.
  evidence: existing_annotations GO:0005515 REMOVE reason (generic binding only); review description
- claim_id: NAR-08
  category: NARROWER
  accession: P27638
  gene: spk1
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:0010494
    label: cytoplasmic stress granule
  review_file: genes/SCHPO/spk1/spk1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Spk1 is reported as mainly nuclear/cytoplasmic; neither the review nor UniProt has evidence
    for stress granule localization, and the transfer likely comes from a distant MAPK ortholog. Cannot
    validate or refute.
  evidence: uniprot SUBCELLULAR LOCATION; review CC annotations
- claim_id: REJ-20
  category: REJECTED
  accession: Q99M87
  gene: Dnaja3
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0051059
    label: NF-kappaB binding
  review_file: genes/mouse/Dnaja3/Dnaja3-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Curator removed NF-kappaB binding because the cited paper supports Tid1 repression of NF-kappaB
    signalling rather than direct binding to NF-kappaB subunits; reported Tid1 interactions in this pathway
    are with IKK components rather than NF-kappaB itself. The ISO/human source full text was not available,
    so direct binding is neither confirmed nor refuted.
  evidence: existing_annotations GO:0051059 REMOVE reason; uniprot GO lines
- claim_id: REJ-12
  category: REJECTED
  accession: O89110
  gene: Casp8
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0097110
    label: scaffold protein binding
  review_file: genes/mouse/Casp8/Casp8-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: The review MODIFIED scaffold protein binding to death effector domain binding (Casp8 binds
    FADD/cFLIP via DEDs) rather than rejecting the biology; the predicted term is true but less precise
    than the curated replacement.
  evidence: existing_annotations GO:0097110 MODIFY to GO:0035877
- claim_id: NAR-10
  category: NARROWER
  accession: P32591
  gene: SWI3
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0016586
    label: RSC-type complex
  review_file: genes/yeast/SWI3/SWI3-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: In S. cerevisiae Swi3 is a SWI/SNF subunit; the RSC complex uses its paralog Rsc8/Swh3. The
    RSC-type term likely comes from metazoan SMARCC1/2 (shared by BAF and PBAF), which does not hold for
    the yeast paralog split.
  evidence: review SWI/SNF complex annotations; yeast SWI3 vs RSC8 paralogy
- claim_id: NAR-02
  category: NARROWER
  accession: Q04195
  gene: SIZ1
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0035861
    label: site of double-strand break
  review_file: genes/yeast/SIZ1/SIZ1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Siz1 contributes redundantly (with dominant Siz2 and Mms21) to DSB relocation to the nuclear
    periphery via polySUMOylation of break-associated proteins, but direct recruitment of Siz1 to DSB
    sites has not been shown in the review evidence; plausible but unverified.
  evidence: existing_annotations GO:1990683 KEEP_AS_NON_CORE reason (PMID:27056668)
- claim_id: UNR-26
  category: UNRELATED
  accession: Q9W720
  gene: ucp2
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  review_file: genes/DANRE/ucp2/ucp2-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Zebrafish ucp2 is a mitochondrial C4-dicarboxylate/aspartate carrier; nothing in the review
    supports a role in response to amino acid starvation. Likely a mammalian UCP2 stimulus-response/phenotype
    term; neither validated nor refuted for zebrafish.
  evidence: review description; existing_annotations (transport/thermogenesis only)
- claim_id: UNR-28
  category: UNRELATED
  accession: Q804Q5
  gene: fezf2
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0045665
    label: negative regulation of neuron differentiation
  review_file: genes/DANRE/fezf2/fezf2-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Zebrafish fezf2 promotes forebrain dopaminergic/hypothalamic neuron differentiation embryonically,
    while in adults high fezf2 maintains neural stem cell quiescence via Notch, which could be read as
    restraining neurogenesis; the predicted negative regulation of neuron differentiation is thus context-dependent
    and not directly supported.
  evidence: review description; neuronal stem cell population maintenance and forebrain neuron differentiation
    annotations
