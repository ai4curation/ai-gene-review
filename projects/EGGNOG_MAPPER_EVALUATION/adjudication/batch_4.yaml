claims:
- claim_id: UNR-20
  category: UNRELATED
  accession: A1Z7T8
  gene: Myd88
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005829
    label: cytosol
  review_file: genes/DROME/Myd88/Myd88-ai-review.yaml
  assessment: NPI
  error_type: LOCALIZATION_DEFAULT
  rationale: Mammalian MyD88 is a cytosolic adaptor, but Drosophila Myd88 is held at the plasma membrane by its PI(4,5)P2-binding C-terminal extension (cytoplasmic side of plasma membrane, IDA); the cytosol transfer from vertebrate orthologs ignores this fly-specific membrane targeting.
  evidence: review description; existing_annotations GO:0009898 and GO:0005546 ACCEPT
- claim_id: NAR-17
  category: NARROWER
  accession: O94826
  gene: TOMM70
  organism_dir: human
  aspect: MF
  term:
    id: GO:0015450
    label: protein-transporting ATPase activity
  review_file: genes/human/TOMM70/TOMM70-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: TOMM70 is a TPR-repeat TOM receptor that docks chaperone-bound precursors; it has no ATPase domain and does not hydrolyse NTPs to drive translocation, so the ATPase-driven primary active transport child of protein transmembrane transporter activity is unsupported.
  evidence: review description; core_functions; GO:0015450 definition
- claim_id: REJ-18
  category: REJECTED
  accession: P20070
  gene: Cyb5r3
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0019852
    label: L-ascorbic acid metabolic process
  review_file: genes/rat/Cyb5r3/Cyb5r3-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: REJECTED only because the review removed the ND root GO:0008150, not ascorbate metabolism. Cytochrome b5 reductase has well-documented NADH:ascorbate radical (monodehydroascorbate) reductase activity regenerating ascorbate, and UniProt cross-references Reactome 'Vitamin C (ascorbate) metabolism'.
  evidence: existing_annotations GO:0008150 REMOVE (ND root); uniprot DR Reactome R-RNO-196836; deep-research-falcon substrates table
- claim_id: UNR-40
  category: UNRELATED
  accession: A8Y332
  gene: drd-5
  organism_dir: CAEBR
  aspect: BP
  term:
    id: GO:0007601
    label: visual perception
  review_file: genes/CAEBR/drd-5/drd-5-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: drd-5 is an uncharacterized nematode SDR whose closest characterized ortholog (DHS-16) acts in dafachronic acid steroid synthesis; visual perception comes from vertebrate retinol dehydrogenase SDRs of the visual cycle, a process nematodes (no eyes or retinoid visual cycle) lack.
  evidence: review description; core_functions steroid dehydrogenase activity
- claim_id: REJ-14
  category: REJECTED
  accession: P63018
  gene: Hspa8
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0046777
    label: protein autophosphorylation
  review_file: genes/rat/Hspa8/Hspa8-ai-review.yaml
  assessment: NPI
  error_type: IN_VITRO_NOT_IN_VIVO
  rationale: The review removed this term because the cited paper reports HSC70 ATPase activity, not autophosphorylation. Reports of Hsp70 'autophosphorylation' are in vitro phospho-intermediate observations with no established physiological role; HSC70's function is ATP-dependent chaperoning.
  evidence: existing_annotations GO:0046777 REMOVE reason; core_functions
- claim_id: UNR-22
  category: UNRELATED
  accession: Q88R95
  gene: ssuD
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0009408
    label: response to heat
  review_file: genes/PSEPK/ssuD/ssuD-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: SsuD is the FMNH2-dependent alkanesulfonate monooxygenase for sulfur scavenging, induced by sulfate limitation; nothing in the review or UniProt links it to heat stress, so the term is likely an expression or phenotype-derived transfer from a bacterial ortholog.
  evidence: review core_functions; uniprot FUNCTION
- claim_id: UNR-19
  category: UNRELATED
  accession: P01132
  gene: Egf
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0043235
    label: signaling receptor complex
  review_file: genes/mouse/Egf/Egf-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: EGF is the secreted ligand that binds EGFR, not a component of the receptor complex. GO defines a signaling receptor complex as the complex that binds the signaling molecule, so a ligand-to-receptor-complex transfer conflates bound ligand with complex membership.
  evidence: review description; core_functions receptor ligand activity, extracellular region; GO:0043235 definition
- claim_id: UNR-01
  category: UNRELATED
  accession: P15108
  gene: HSC82
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0044182
    label: filamentous growth of a population of unicellular organisms
  review_file: genes/yeast/HSC82/HSC82-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Likely transferred from Candida albicans Hsp90, whose role in filamentation (Hsp90 restrains the yeast-to-hypha transition) is a client-dependent phenotype. There is no evidence for Hsc82 in S. cerevisiae pseudohyphal growth; its core role is the ATP-dependent Hsp90 chaperone cycle.
  evidence: review description; core_functions
- claim_id: UNR-07
  category: UNRELATED
  accession: Q21554
  gene: ddb-1
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0051702
    label: biological process involved in interaction with symbiont
  review_file: genes/worm/ddb-1/ddb-1-ai-review.yaml
  assessment: NPI
  error_type: PATHWAY_CONTEXT_IGNORED
  rationale: DDB1 symbiont-interaction annotations come from viral proteins (e.g. HBx, paramyxovirus V) hijacking human or plant CRL4-DDB1. Worm DDB-1 is a CRL4 adaptor with no evidence of symbiont or viral interaction, so the host-pathogen context does not carry over.
  evidence: review description; core_functions ubiquitin ligase complex scaffold activity
- claim_id: NAR-06
  category: NARROWER
  accession: Q03336
  gene: Rgn
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0005829
    label: cytosol
  review_file: genes/rat/Rgn/Rgn-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Regucalcin (SMP30) is a soluble protein classically purified from and studied in rat liver cytosol, where it regulates cytosolic Ca2+-dependent enzymes. Cytosol is a correct refinement of the curated cytoplasm.
  evidence: review existing_annotations cytoplasm ACCEPT and supporting_text 'rat liver cytosol'; uniprot SUBCELLULAR LOCATION
- claim_id: REJ-10
  category: REJECTED
  accession: Q95XH2
  gene: epg-9
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0046983
    label: protein dimerization activity
  review_file: genes/worm/epg-9/epg-9-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: REJECTED only because it descends from protein binding, which the review removed for being uninformative, not false. EPG-9/ATG101 does form a HORMA heterodimer with EPG-1/ATG13, but 'protein dimerization activity' adds little beyond membership in the Atg1/UNC-51 complex.
  evidence: existing_annotations GO:0005515 REMOVE reason; review description
- claim_id: UNR-16
  category: UNRELATED
  accession: P31266
  gene: Rbpj
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0006310
    label: DNA recombination
  review_file: genes/mouse/Rbpj/Rbpj-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: RBP-J was named 'recombination signal binding protein for Ig kappa J' because it was first thought to bind V(D)J recombination signals. It was later shown to be the CSL transcription factor of Notch signalling with no recombinase role, so DNA recombination is a historical name-based error.
  evidence: review description; core_functions DNA-binding transcription factor activity
- claim_id: NAR-11
  category: NARROWER
  accession: D4ADY9
  gene: Elovl7
  organism_dir: rat
  aspect: BP
  term:
    id: GO:0030148
    label: sphingolipid biosynthetic process
  review_file: genes/rat/Elovl7/Elovl7-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: The term comes from the ELOVL family IBA, which the review marked over-annotated because ELOVL7 prefers C16-C20 acyl-CoAs, while sphingolipid VLCFA chains are made mainly by ELOVL1/4. Some ELOVL7 products may still enter ceramides, so the term can be neither confirmed nor refuted.
  evidence: existing_annotations GO:0030148 MARK_AS_OVER_ANNOTATED reason; core_functions
- claim_id: REJ-03
  category: REJECTED
  accession: Q88KF4
  gene: acnA-II
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003994
    label: aconitate hydratase activity
  review_file: genes/PSEPK/acnA-II/acnA-II-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: AcnA-II (PP_2336) belongs to the AcnD subfamily (IPR012708) and is a dedicated 2-methylcitrate dehydratase in the 2-methylcitrate cycle. Citrate/isocitrate aconitase activity belongs to the canonical AcnA/AcnB paralogs, and the review's removal stands.
  evidence: existing_annotations GO:0003994 REMOVE reason; core_functions
- claim_id: UNR-10
  category: UNRELATED
  accession: Q9PUR2
  gene: cryaba
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0032355
    label: response to estradiol
  review_file: genes/DANRE/cryaba/cryaba-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Response to estradiol is an expression-response term from a mammalian CRYAB ortholog. Zebrafish cryaba is a subfunctionalized, lens-restricted crystallin with no evidence of estradiol responsiveness.
  evidence: review description; core_functions structural constituent of eye lens
- claim_id: REJ-09
  category: REJECTED
  accession: Q9Y6B6
  gene: SAR1B
  organism_dir: human
  aspect: MF
  term:
    id: GO:0097110
    label: scaffold protein binding
  review_file: genes/human/SAR1B/SAR1B-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: REJECTED only because it descends from protein binding, which the review removed for being uninformative rather than false. SAR1 engages the ER-exit-site scaffold SEC16 and the COPII coat, so the term is plausible but is a binding term that adds little beyond SAR1B's GTPase and COPII coat-assembly functions.
  evidence: existing_annotations GO:0005515 REMOVE reasons; core_functions
- claim_id: REJ-16
  category: REJECTED
  accession: Q9P7N2
  gene: vas2
  organism_dir: SCHPO
  aspect: BP
  term:
    id: GO:0006896
    label: Golgi to vacuole transport
  review_file: genes/SCHPO/vas2/vas2-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: REJECTED only because GO:0006896 has is_a intercellular transport, which the review removed, so this is an ontology artifact. Fission yeast AP-1 loss causes vacuole-fusion defects, but direct Golgi-to-vacuole cargo sorting by Vas2/AP-1 is not documented (in budding yeast that route uses AP-3).
  evidence: existing_annotations GO:0010496 REMOVE; GO:0006896 is_a GO:0010496; deep-research-falcon section 4.3
- claim_id: UNR-31
  category: UNRELATED
  accession: Q9CAD5
  gene: YDA
  organism_dir: ARATH
  aspect: BP
  term:
    id: GO:0032147
    label: activation of protein kinase activity
  review_file: genes/ARATH/YDA/YDA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: YODA is the MAPKKK that phosphorylates and activates MKK4/MKK5 in the YDA-MKK4/5-MPK3/6 cascade. Activating a downstream protein kinase is what it does in the process, and this complements the MAPK cascade and MAPKKK activity annotations.
  evidence: review description; core_functions GO:0004709; existing_annotations GO:0004709 ACCEPT
- claim_id: NAR-03
  category: NARROWER
  accession: Q9VQY8
  gene: Vps53
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0032588
    label: trans-Golgi network membrane
  review_file: genes/DROME/Vps53/Vps53-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: GARP tethers endosome-derived carriers at the trans-Golgi network. The review MODIFIES the Golgi apparatus rows toward TGN, and UniProt places Vps53 at the trans-Golgi network membrane, so this is a correct refinement.
  evidence: existing_annotations GO:0005794 MODIFY reason; core_functions location trans-Golgi network
- claim_id: UNR-36
  category: UNRELATED
  accession: Q64438
  gene: Ang2
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0043025
    label: neuronal cell body
  review_file: genes/mouse/Ang2/Ang2-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: The neuronal cell body localization comes from canonical angiogenin (ANG/Ang1) neural biology. Ang2/Angrp is a secreted, divergent non-angiogenic RNase A paralog, and the review removes the whole set of canonical-angiogenin intracellular transfers.
  evidence: review description; existing_annotations nucleus/cytoplasm ISO REMOVE reasons (PMID:8633065)
