    assessment: NPI
    rationale: DDB1 symbiont-interaction annotations come from viral proteins (e.g. HBx, paramyxovirus
      V) hijacking human or plant CRL4-DDB1. Worm DDB-1 is a CRL4 adaptor with no evidence of symbiont
