CC:
  CURATION_MISTAKE:
  - claim_id: UNR-12
    gene: rad21
    organism_dir: SCHPO
    term: GO:0005739 mitochondrion
    category: UNRELATED
    assessment: NPI
    rationale: Rad21 is the nuclear alpha-kleisin of mitotic cohesin with extensive nuclear/chromatin
      evidence and no mitochondrial targeting or function; a mitochondrion transfer most likely reflects
      a high-throughput localization artefact in an ortholog.
  - claim_id: UNR-30
    gene: Amacr
    organism_dir: rat
    term: GO:0005886 plasma membrane
    category: UNRELATED
    assessment: NPI
    rationale: Amacr is a peroxisomal and mitochondrial matrix racemase with no membrane-targeting features;
      plasma membrane has no support for the rat protein and likely reflects a proteomics/localization
      artefact in an ortholog.
  - claim_id: UNR-19
    gene: Egf
    organism_dir: mouse
    term: GO:0043235 signaling receptor complex
    category: UNRELATED
    assessment: NPI
    rationale: EGF is the secreted ligand that binds EGFR, not a component of the receptor complex. GO
      defines a signaling receptor complex as the complex that binds the signaling molecule, so a ligand-to-receptor-complex
      transfer conflates bound ligand with complex membership.
  - claim_id: R2-CC-UNR-09
    gene: Gcat
    organism_dir: DROME
    term: GO:0005886 plasma membrane
    category: UNRELATED
    assessment: NPI
    rationale: Gcat is a mitochondrial-matrix PLP enzyme of threonine catabolism with no transmembrane
      segment or membrane anchor. A plasma membrane location is unsupported for it and is most likely
      a high-throughput localization artifact on an ortholog.
  - claim_id: R2-CC-REJ-02
    gene: nudE
    organism_dir: DROME
    term: GO:0005871 kinesin complex
    category: REJECTED
    assessment: NPI
    rationale: NudE is a Lis1/dynein regulator, not a kinesin subunit; the family-level kinesin complex
      IBA stems from rat Ndel1 being reported as a kinesin-1 cargo, and was removed in the human NDE1/NDEL1
      reviews. No fly evidence links NudE to a kinesin complex, so the removal stands.
  - claim_id: R2-CC-REJ-04
    gene: nudE
    organism_dir: EMENI
    term: GO:0005871 kinesin complex
    category: REJECTED
    assessment: NPI
    rationale: A. nidulans NudE supports NudF/LIS1-dependent dynein activation and is not a kinesin complex
      subunit; the IBA derives from rat Ndel1 described as a kinesin-1 cargo. No fungal evidence supports
      kinesin complex membership.
  - claim_id: R2-CC-NAR-06
    gene: Acadvl
    organism_dir: DROME
    term: GO:0042645 mitochondrial nucleoid
    category: NARROWER
    assessment: NPI
    rationale: Acadvl is a mitochondrial inner-membrane-associated beta-oxidation flavoenzyme; mitochondrial
      nucleoid assignments for VLCAD-family proteins come from nucleoid-preparation proteomics, which
      co-purify inner-membrane proteins. No evidence that the fly enzyme is a nucleoid component.
  TAXON_CONSTRAINT_VIOLATION:
  - claim_id: NAR-05
    gene: HRT1
    organism_dir: yeast
    term: GO:0031467 Cul7-RING ubiquitin ligase complex
    category: NARROWER
    assessment: NPI
    rationale: Cul7 (and the Cul7-RING ligase) is metazoan-specific and absent from S. cerevisiae; yeast
      Hrt1/Rbx1 is in SCF, Cul3 and Cul4/Rtt101 cullin-RING complexes, not a Cul7 complex. Transfer from
      metazoan RBX1 ignores lineage.
  - claim_id: NAR-07
    gene: unc-47
    organism_dir: worm
    term: GO:0044316 cone cell pedicle
    category: NARROWER
    assessment: NPI
    rationale: Cone cell pedicle is a vertebrate retinal cone axon terminal; C. elegans has no cone photoreceptors,
      so this transfer from vertebrate VGAT (SLC32A1) retinal data cannot apply to UNC-47.
  - claim_id: R2-CC-UNR-08
    gene: che-11
    organism_dir: worm
    term: GO:0005813 centrosome
    category: UNRELATED
    assessment: NPI
    rationale: Human IFT140 has an IDA for centrosome in cycling mammalian cells, but CHE-11 acts only
      in post-mitotic C. elegans ciliated sensory neurons. There the centrioles degenerate after ciliogenesis
      and no centrosome is present. Its ciliary-base location is already captured by ciliary basal body,
      axoneme and non-motile cilium.
  - claim_id: R2-CC-UNR-03
    gene: Ccnt1
    organism_dir: mouse
    term: GO:0005703 polytene chromosome puff
    category: UNRELATED
    assessment: NPI
    rationale: Polytene chromosome puffs exist only in dipteran polytene tissues; mouse has no polytene
      chromosomes. The term was transferred from the Drosophila CycT ortholog's immunostaining; mouse
      cyclin T1 is in nucleoplasmic P-TEFb.
  LOCALIZATION_DEFAULT:
  - claim_id: UNR-20
    gene: Myd88
    organism_dir: DROME
    term: GO:0005829 cytosol
    category: UNRELATED
    assessment: NPI
    rationale: Mammalian MyD88 is a cytosolic adaptor, but Drosophila Myd88 is held at the plasma membrane
      by its PI(4,5)P2-binding C-terminal extension (cytoplasmic side of plasma membrane, IDA); the cytosol
      transfer from vertebrate orthologs ignores this fly-specific membrane targeting.
  - claim_id: R2-CC-UNR-06
    gene: Sstr5
    organism_dir: rat
    term: GO:0005737 cytoplasm
    category: UNRELATED
    assessment: NPI
    rationale: 'SSTR5 is a multi-pass plasma-membrane GPCR (UniProt: Cell membrane); the review supports
      only plasma membrane and neuron projection. Bulk ''cytoplasm'' is a default compartment with no
      specific basis; any intracellular pool would be internalized receptor on endosome membranes, not
      the cytoplasm.'
  - claim_id: R2-CC-UNR-07
    gene: DARS2
    organism_dir: HORSE
    term: GO:0005634 nucleus
    category: UNRELATED
    assessment: NPI
    rationale: DARS2 is the mitochondrial aspartyl-tRNA synthetase with an N-terminal mitochondrial targeting
      sequence acting on mt-tRNA(Asp); no nuclear role or localization is reported (human DARS2 has no
      nucleus annotation), so nucleus is a generic default localization (possibly bleeding from the cytosolic
      DARS1 paralog, which has a nuclear pool).
  - claim_id: R2-CC-REJ-01
    gene: pef-1
    organism_dir: worm
    term: GO:0005634 nucleus
    category: REJECTED
    assessment: NPI
    rationale: PEF-1 is anchored to membranes by N-terminal myristoylation and palmitoylation. Both localization
      studies place it in sensory cilia, the plasma membrane and neuronal processes, never in the nucleus.
      The nucleus IBA, and its eggNOG echo, is a family-level default that does not fit this membrane-anchored
      ciliary phosphatase; the curator's removal stands.
  PARALOG_OVERANNOTATION:
  - claim_id: NAR-10
    gene: SWI3
    organism_dir: yeast
    term: GO:0016586 RSC-type complex
    category: NARROWER
    assessment: PLI
    rationale: In S. cerevisiae Swi3 is a SWI/SNF subunit; the RSC complex uses its paralog Rsc8/Swh3.
      The RSC-type term likely comes from metazoan SMARCC1/2 (shared by BAF and PBAF), which does not
      hold for the yeast paralog split.
  - claim_id: UNR-36
    gene: Ang2
    organism_dir: mouse
    term: GO:0043025 neuronal cell body
    category: UNRELATED
    assessment: PLI
    rationale: The neuronal cell body localization comes from canonical angiogenin (ANG/Ang1) neural biology.
      Ang2/Angrp is a secreted, divergent non-angiogenic RNase A paralog, and the review removes the whole
      set of canonical-angiogenin intracellular transfers.
  FREQUENCY_BIAS:
  - claim_id: UNR-09
    gene: mdr
    organism_dir: STABO
    term: GO:0000324 fungal-type vacuole
    category: UNRELATED
    assessment: NPI
    rationale: Mdr is a full-length ABCB/MDR-subfamily exporter that secretes sophorolipids, and UniProt
      and the transportome analysis place it in the plasma membrane. Nothing supports vacuolar localization.
      The term looks like a common fungal localization carried over from orthologs, not specific evidence.
  DOMAIN_ARCHITECTURE_MISMATCH:
  - claim_id: R2-CC-REJ-03
    gene: Idh
    organism_dir: DROME
    term: GO:0005782 peroxisomal matrix
    category: REJECTED
    assessment: NPI
    rationale: Peroxisomal matrix localization of the donor IDH1/IDP3 enzymes depends on a C-terminal
      PTS1; every fly Idh isoform (incl. B7Z0E0) ends in ...AVAAK with no PTS1 and fly Idh is documented
      as cytosolic (IDHc) or mitochondrial (IDHm). The single fly gene is co-orthologous to IDH1 and IDH2,
      so the IDH1-clade peroxisomal targeting was transferred without the targeting signal that confers
      it.
MF:
  CURATION_MISTAKE:
  - claim_id: REJ-19
    gene: Txn1
    organism_dir: mouse
    term: GO:0004791 thioredoxin-disulfide reductase (NADPH) activity
    category: REJECTED
    assessment: NPI
    rationale: Thioredoxin is the substrate of thioredoxin reductase (TXNRD), not an NADPH-using reductase
      itself; the review removed the related NAD(P)H-dependent reductase term for exactly this reason.
      The predicted activity belongs to the partner enzyme Txnrd1/2.
  - claim_id: REJ-17
    gene: Ratn1
    organism_dir: rat
    term: GO:0005009 insulin receptor activity
    category: REJECTED
    assessment: NPI
    rationale: Rat n 1 is a secreted ~19 kDa lipocalin with no transmembrane or tyrosine-kinase domain,
      so it cannot have insulin receptor activity. The source mouse MUP1 annotation is itself contradicted
      by its own study (no change in insulin receptor phosphorylation). The curator's removal is correct.
  - claim_id: UNR-23
    gene: Kras
    organism_dir: mouse
    term: GO:0005085 guanyl-nucleotide exchange factor activity
    category: UNRELATED
    assessment: NPI
    rationale: KRAS is the GTPase substrate of guanine-nucleotide exchange factors (SOS, RasGRP), not
      a GEF itself. GTP-bound Ras allosterically stimulates SOS, but that is not exchange-factor activity.
      A source annotation probably conflated GEF binding/allostery with GEF activity.
  - claim_id: REJ-05
    gene: TNFSF10
    organism_dir: human
    term: GO:0045569 TRAIL binding
    category: DOWNGRADED
    assessment: NPI
    rationale: '''TRAIL binding'' describes receptors (DR4/DR5/decoys) that bind the TRAIL ligand. Here
      it was transferred, via mouse Tnfsf10, onto the ligand itself. TNFSF10''s only self-interaction
      is homotrimerization, which identical protein binding captures. The curator''s MODIFY away from
      this term is correct.'
  - claim_id: R2-MF-NAR-01
    gene: App
    organism_dir: mouse
    term: GO:0016504 peptidase activator activity
    category: NARROWER
    assessment: NPI
    rationale: Full-length APP is a secretase substrate, not a peptidase activator; the curator MODIFIED
      this ISO row to serine-type endopeptidase inhibitor activity, which only the KPI-domain isoforms
      have. The activator claim probably comes from Abeta-fragment effects (e.g. stimulating tPA in vitro),
      so the source annotation was itself wrong.
  - claim_id: R2-MF-UNR-12
    gene: PET100
    organism_dir: human
    term: GO:0051082 unfolded protein binding
    category: UNRELATED
    assessment: NPI
    rationale: PET100 is a COX-specific assembly factor that binds COX subunits (e.g. COX7A2) to incorporate
      them into an early assembly intermediate; there is no evidence it binds unfolded polypeptides. The
      'chaperone' label of assembly factors is conflated with folding-chaperone substrate binding (the
      review marks the related protein folding chaperone/protein folding terms over-annotated).
  - claim_id: R2-MF-UNR-09
    gene: vcla
    organism_dir: DANRE
    term: GO:0031625 ubiquitin protein ligase binding
    category: UNRELATED
    assessment: NPI
    rationale: The only source is a human VCL IPI from a Parkin TAP-MS pull-down in which vinculin was
      one of many abundant cytoskeletal co-purifiers; the human VCL review marks it over-annotated. Nothing
      links zebrafish vcla, an actin-binding adhesion adaptor, to ubiquitin ligase binding.
  - claim_id: R2-MF-UNR-03
    gene: Idh
    organism_dir: DROME
    term: GO:0051990 (R)-2-hydroxyglutarate dehydrogenase activity
    category: UNRELATED
    assessment: NPI
    rationale: Drosophila Idh is a wild-type NADP-isocitrate dehydrogenase. Producing (R)-2-hydroxyglutarate
      from 2-oxoglutarate is a neomorphic activity of cancer-associated IDH1/IDH2 active-site mutants,
      and it runs opposite to the dehydrogenase direction the term defines. Neither the wild-type enzyme
      nor this protein is a 2-HG dehydrogenase.
  DOMAIN_ARCHITECTURE_MISMATCH:
  - claim_id: UNR-25
    gene: SecA
    organism_dir: ECOLI
    term: GO:0015462 ABC-type protein transporter activity
    category: UNRELATED
    assessment: NPI
    rationale: SecA is the cytoplasmic DEAD-motor ATPase that drives preprotein translocation through
      SecYEG (protein-exporting ATPase activity, EC 7.4.2.8), not an ABC-type transporter (EC 7.4.2.5)
      with ABC/transmembrane domains; the review accepts GO:0008564 instead.
  - claim_id: NAR-17
    gene: TOMM70
    organism_dir: human
    term: GO:0015450 protein-transporting ATPase activity
    category: NARROWER
    assessment: NPI
    rationale: TOMM70 is a TPR-repeat TOM receptor that docks chaperone-bound precursors; it has no ATPase
      domain and does not hydrolyse NTPs to drive translocation, so the ATPase-driven primary active transport
      child of protein transmembrane transporter activity is unsupported.
  - claim_id: R2-MF-UNR-11
    gene: Camk2a
    organism_dir: mouse
    term: GO:0005085 guanyl-nucleotide exchange factor activity
    category: UNRELATED
    assessment: NPI
    rationale: CaMKIIalpha is a Ser/Thr kinase made of a catalytic domain, a CaM-binding autoregulatory
      segment and an association hub; it has no DH, CDC25, SEC7 or DOCK GEF domain. No CaMKII ortholog
      in the repo carries GEF activity, so the term has no support.
  - claim_id: R2-MF-REJ-01
    gene: groES
    organism_dir: PSEPK
    term: GO:0046872 metal ion binding
    category: REJECTED
    assessment: NPI
    rationale: P. putida GroES (97 aa) is a plain Cpn10 beta-barrel with no His/Cys-rich C-terminal extension
      of the metal-binding HspA-type co-chaperonins and no annotated metal site or cofactor; its function
      is GroEL capping, so metal ion binding is unsupported and the curator's removal stands.
  - claim_id: R2-MF-REJ-03
    gene: ubl-5
    organism_dir: worm
    term: GO:0031386 protein tag activity
    category: REJECTED
    assessment: NPI
    rationale: UBL-5/Hub1 lacks the C-terminal di-glycine motif needed for covalent conjugation and works
      through non-covalent binding of HIND-containing spliceosomal proteins and DVE-1. Protein tag activity,
      which requires covalent attachment to targets, is a ubiquitin-superfamily default that does not
      apply; the removal stands.
  - claim_id: R2-MF-REJ-05
    gene: cab4
    organism_dir: SCHPO
    term: GO:0004140 dephospho-CoA kinase activity
    category: REJECTED
    assessment: NPI
    rationale: S. pombe cab4 contains only the PPAT-like cytidylyltransferase domain and lacks the dephospho-CoA
      kinase (CoaE) domain; DPCK activity was transferred from bifunctional COASY-type orthologs. The
      removal is correct (DPCK in fission yeast is a separate protein).
  PARALOG_OVERANNOTATION:
  - claim_id: UNR-13
    gene: ccmG
    organism_dir: PSEPK
    term: GO:0003756 protein disulfide isomerase activity
    category: UNRELATED
    assessment: NPI
    rationale: CcmG/DsbE is a dedicated periplasmic thiol:disulfide reductase for apocytochrome CXXCH
      motifs, not a disulfide-shuffling isomerase; PDI activity belongs to other thioredoxin-fold Dsb
      family members (e.g. DsbC/DsbG).
  - claim_id: REJ-03
    gene: acnA-II
    organism_dir: PSEPK
    term: GO:0003994 aconitate hydratase activity
    category: REJECTED
    assessment: PLI
    rationale: AcnA-II (PP_2336) belongs to the AcnD subfamily (IPR012708) and is a dedicated 2-methylcitrate
      dehydratase in the 2-methylcitrate cycle. Citrate/isocitrate aconitase activity belongs to the canonical
      AcnA/AcnB paralogs, and the review's removal stands.
  - claim_id: R2-MF-REJ-02
    gene: CRTISO
    organism_dir: ARATH
    term: GO:0016491 oxidoreductase activity
    category: REJECTED
    assessment: PLI
    rationale: CRTISO belongs to the carotenoid/retinoid oxidoreductase (CrtI-like) family, but it is
      a FAD(red)-dependent cis-trans isomerase (EC 5.2.1.13) that carries out a non-redox reaction and
      has no desaturase activity. The oxidoreductase activity belongs to the desaturase paralogs of the
      family.
  - claim_id: R2-MF-NAR-04
    gene: fosB
    organism_dir: STAAT
    term: GO:0004364 glutathione transferase activity
    category: NARROWER
    assessment: PLI
    rationale: FosB is a divalent-metal-dependent fosfomycin thiol-S-transferase that uses bacillithiol
      (or L-cysteine) in staphylococci, which lack glutathione; glutathione transferase activity belongs
      to the FosA subfamily of the fosfomycin-resistance family. The review explicitly states FosB enzymes
      are not glutathione transferases.
  COMPLEX_ACTIVITY_TRANSFER:
  - claim_id: REJ-06
    gene: ddb-1
    organism_dir: worm
    term: GO:0003684 damaged DNA binding
    category: REJECTED
    assessment: NPI
    rationale: In UV-DDB, damaged-DNA recognition is provided by DDB2, with DDB1 acting as the CRL4 adaptor;
      worm DDB-1 is supported only as a CUL-4/DCAF adaptor, so damaged DNA binding is a complex-level
      activity transferred to the non-binding subunit, consistent with the curator removal of nucleic
      acid binding.
  - claim_id: R2-MF-UNR-05
    gene: che-3
    organism_dir: worm
    term: GO:0045503 dynein light chain binding
    category: UNRELATED
    assessment: NPI
    rationale: CHE-3 is the dynein-2 heavy chain; its curated direct contacts are the light intermediate
      chain (XBX-1) and intermediate chains. In dynein complexes the light chains (LC8, Tctex, roadblock)
      bind the intermediate chains, not the heavy chain, so dynein light chain binding is a complex-level
      interaction attributed to the heavy chain (only some axonemal heavy chains bind specific LCs directly).
  - claim_id: R2-MF-UNR-04
    gene: Ppp3r1
    organism_dir: rat
    term: GO:0004721 phosphoprotein phosphatase activity
    category: UNRELATED
    assessment: NPI
    rationale: Ppp3r1 (CnB1) is the non-catalytic, EF-hand calcium-binding regulatory subunit of calcineurin;
      phosphatase catalysis is performed by the PPP3CA/B/C A subunit. The holoenzyme's activity was transferred
      onto the regulatory subunit.
  PSEUDOENZYME_OVERANNOTATION:
  - claim_id: R2-MF-REJ-04
    gene: Serpinh1
    organism_dir: mouse
    term: GO:0004867 serine-type endopeptidase inhibitor activity
    category: REJECTED
    assessment: NPI
    rationale: HSP47 keeps the serpin fold but has lost protease-inhibitor activity and works only as
      an ER collagen-specific chaperone. Inhibitor activity is the ancestral serpin function, transferred
      by family membership onto a neofunctionalized non-inhibitory serpin.
  FREQUENCY_BIAS:
  - claim_id: R2-MF-UNR-08
    gene: Rnase1
    organism_dir: rat
    term: GO:0042802 identical protein binding
    category: UNRELATED
    assessment: REP
    rationale: Rat pancreatic RNase is annotated as a monomer (UniProt SUBUNIT). The domain-swapped dimers
      known for bovine RNase A form under non-physiological in vitro conditions. Identical protein binding
      is a high-frequency generic term with no specific basis for this protein.
  PATHWAY_CONTEXT_IGNORED:
  - claim_id: R2-MF-NAR-06
    gene: mut-7
    organism_dir: worm
    term: GO:0044748 3'-5'-exoribonuclease activity involved in mature miRNA 3'-end processing
    category: NARROWER
    assessment: NPI
    rationale: MUT-7 has 3'-5' exoribonuclease activity, but the mature-miRNA 3'-end trimming context
      comes from Drosophila Nibbler; in C. elegans MUT-7 acts in Mutator-focus 22G siRNA amplification
      and is required for siRNAs, not miRNAs. The curator marked the same ISS term over-annotated.
  IN_VITRO_NOT_IN_VIVO:
  - claim_id: R2-MF-NAR-03
    gene: CDC14
    organism_dir: yeast
    term: GO:0004725 protein tyrosine phosphatase activity
    category: NARROWER
    assessment: NPI
    rationale: Cdc14 is a dual-specificity PTP-superfamily enzyme that can hydrolyse phosphotyrosine in
      vitro, but its physiological substrates are CDK pSer/pThr-Pro sites and pTyr is a poor substrate;
      the review MODIFYs this EC-mapped term to dual-specificity/Ser-Thr phosphatase. The tyrosine-specific
      term misrepresents its biological activity.
