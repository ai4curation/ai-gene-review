# Generated by summarize.py; do not edit by hand.
# Every adjudicated claim judged wrong (NPI/PLI/REP), by GO aspect and error type.
BP:
  MULTIPLE_FUNCTIONS:
  - claim_id: NAR-15
    gene: SKP1
    organism_dir: yeast
    term: GO:0010458 exit from mitosis
    category: NARROWER
    assessment: NPI
    rationale: Skp1 mutant mitotic arrest (short spindle, G2 DNA content) is attributed in the review
      to Skp1's CBF3 kinetochore role and SCF-driven G1/S and G2/M transitions; no evidence that Skp1
      drives the M-to-G1 exit transition, so this looks like a phenotype-derived term from an ortholog's
      mitotic-arrest phenotype.
  - claim_id: REJ-13
    gene: UCK2
    organism_dir: human
    term: GO:0007631 feeding behavior
    category: REJECTED
    assessment: NPI
    rationale: UCK2 is a cytosolic pyrimidine-salvage uridine/cytidine kinase. 'Feeding behavior' is an
      organism-level phenotype term transferred from an ortholog and does not reflect any activity of
      the enzyme. The curator's removal is correct.
  - claim_id: UNR-05
    gene: AAK1
    organism_dir: human
    term: GO:0008356 asymmetric cell division
    category: UNRELATED
    assessment: NPI
    rationale: No evidence links human AAK1 to asymmetric cell division; the term likely derives from
      invertebrate Numb-associated kinase / Numb pathway phenotypes, whereas AAK1 acts as an AP-2 kinase
      in clathrin-mediated endocytosis and focal-adhesion turnover.
  - claim_id: UNR-22
    gene: ssuD
    organism_dir: PSEPK
    term: GO:0009408 response to heat
    category: UNRELATED
    assessment: NPI
    rationale: SsuD is the FMNH2-dependent alkanesulfonate monooxygenase for sulfur scavenging, induced
      by sulfate limitation; nothing in the review or UniProt links it to heat stress, so the term is
      likely an expression or phenotype-derived transfer from a bacterial ortholog.
  - claim_id: UNR-01
    gene: HSC82
    organism_dir: yeast
    term: GO:0044182 filamentous growth of a population of unicellular organisms
    category: UNRELATED
    assessment: NPI
    rationale: Likely transferred from Candida albicans Hsp90, whose role in filamentation (Hsp90 restrains
      the yeast-to-hypha transition) is a client-dependent phenotype. There is no evidence for Hsc82 in
      S. cerevisiae pseudohyphal growth; its core role is the ATP-dependent Hsp90 chaperone cycle.
  - claim_id: UNR-10
    gene: cryaba
    organism_dir: DANRE
    term: GO:0032355 response to estradiol
    category: UNRELATED
    assessment: NPI
    rationale: Response to estradiol is an expression-response term from a mammalian CRYAB ortholog. Zebrafish
      cryaba is a subfunctionalized, lens-restricted crystallin with no evidence of estradiol responsiveness.
  - claim_id: R2-BP-NAR-06
    gene: tbx5b
    organism_dir: DANRE
    term: GO:0060039 pericardium development
    category: NARROWER
    assessment: NPI
    rationale: tbx5b loss causes failed cardiac looping and a fluid-filled edema around the heart, a non-specific
      consequence of heart dysfunction rather than a defect in development of the pericardial sac; the
      term is a phenotype-derived transfer (likely from tbx5a/Tbx5 pericardial edema phenotypes).
  - claim_id: R2-BP-UNR-09
    gene: hlh-30
    organism_dir: worm
    term: GO:0045165 cell fate commitment
    category: UNRELATED
    assessment: NPI
    rationale: HLH-30 is the TFEB ortholog and regulates transcription of autophagy, lysosomal and lipid-metabolism
      genes. Cell fate commitment is a vertebrate MiT/TFE developmental term (e.g. MITF in melanocyte
      and RPE specification) that has no counterpart in worm hlh-30 biology.
  - claim_id: R2-BP-UNR-03
    gene: Pde4
    organism_dir: DROME
    term: GO:0040013 negative regulation of locomotion
    category: UNRELATED
    assessment: NPI
    rationale: Locomotor phenotype term likely transferred from a mammalian PDE4 mutant phenotype; Pde4/dunce
      is a cAMP phosphodiesterase whose behavioural effects are downstream of cAMP turnover in specific
      circuits. No fly evidence that dunce negatively regulates locomotion.
  TAXON_CONSTRAINT_VIOLATION:
  - claim_id: UNR-39
    gene: ced-6
    organism_dir: worm
    term: GO:0016319 mushroom body development
    category: UNRELATED
    assessment: NPI
    rationale: Mushroom bodies are an insect brain structure; the term comes from a Drosophila Ced-6 mutant
      phenotype. C. elegans has no mushroom body, and CED-6 acts as a PTB adaptor downstream of CED-1
      in apoptotic-corpse engulfment.
  - claim_id: UNR-04
    gene: dyf-6
    organism_dir: worm
    term: GO:0060041 retina development in camera-type eye
    category: UNRELATED
    assessment: NPI
    rationale: Camera-type eye/retina development comes from a vertebrate ift46 mutant phenotype (photoreceptor
      cilia). C. elegans has no camera-type eye; DYF-6/IFT46 acts in IFT-B in amphid/phasmid sensory cilia.
  - claim_id: UNR-11
    gene: HST2
    organism_dir: yeast
    term: GO:0036166 phenotypic switching
    category: UNRELATED
    assessment: NPI
    rationale: Phenotypic switching (e.g. white-opaque switching) is a Candida albicans trait in which
      sirtuins have been implicated. S. cerevisiae does not show this switching. HST2 is an NAD-dependent
      H4K16 deacetylase that acts in chromatin regulation.
  - claim_id: UNR-08
    gene: elg1
    organism_dir: DROME
    term: GO:0030890 positive regulation of B cell proliferation
    category: UNRELATED
    assessment: NPI
    rationale: Drosophila has no B cells; this vertebrate immune process term was transferred from ATAD5/Elg1
      orthologs (likely a mouse phenotype) and cannot apply to the fly protein, which acts as the PCNA
      unloader subunit.
  - claim_id: UNR-40
    gene: drd-5
    organism_dir: CAEBR
    term: GO:0007601 visual perception
    category: UNRELATED
    assessment: NPI
    rationale: drd-5 is an uncharacterized nematode SDR whose closest characterized ortholog (DHS-16)
      acts in dafachronic acid steroid synthesis; visual perception comes from vertebrate retinol dehydrogenase
      SDRs of the visual cycle, a process nematodes (no eyes or retinoid visual cycle) lack.
  - claim_id: R2-BP-REJ-06
    gene: Gcm
    organism_dir: STRPU
    term: GO:0007403 glial cell fate determination
    category: REJECTED
    assessment: NPI
    rationale: Glial fate determination is a Drosophila-specific use of gcm. Sea urchin Gcm is expressed
      only in the mesodermal pigment-cell lineage and is never seen in neural or glial tissue, and its
      knockdown removes pigment cells. The curator's removal of the parent gliogenesis term is well supported.
  - claim_id: R2-BP-NAR-01
    gene: mre11
    organism_dir: DROME
    term: GO:0007004 telomere maintenance via telomerase
    category: NARROWER
    assessment: NPI
    rationale: Drosophila lacks telomerase and maintains telomere length by HeT-A/TART retrotransposition;
      fly Mre11 acts in telomere capping (HOAP/HP1 recruitment, fusion prevention), not telomerase-mediated
      repeat addition. The telomerase-specific child of telomere maintenance was transferred from yeast/mammalian
      MRE11 where telomerase exists.
  - claim_id: R2-BP-REJ-03
    gene: smo
    organism_dir: DROME
    term: GO:0071679 commissural neuron axon guidance
    category: REJECTED
    assessment: NPI
    rationale: Shh/Smo-mediated chemoattraction of commissural axons is a vertebrate spinal-cord mechanism.
      No such Hh/Smo role in commissural guidance is described in Drosophila, and fly smo is not among
      the PAINT donors. The curator's removal of this over-deep IBA stands.
  - claim_id: R2-BP-UNR-12
    gene: alc
    organism_dir: DROME
    term: GO:0035878 nail development
    category: UNRELATED
    assessment: NPI
    rationale: Nail development is a mammalian (digit keratinized appendage) process, presumably transferred
      from a mouse AMPK beta-subunit phenotype; Drosophila has no nails. alc is the AMPK beta scaffold
      acting in energy sensing and photoreceptor/neuron maintenance.
  CURATION_MISTAKE:
  - claim_id: REJ-02
    gene: BNIP3L
    organism_dir: human
    term: GO:0051607 defense response to virus
    category: REJECTED
    assessment: NPI
    rationale: 'Curator removed defense response to virus: the source 1999 paper concerns apoptosis/BCL-2
      interactions, and later work shows NIX-mediated mitophagy is hijacked by SARS-CoV-2 ORF10 to degrade
      MAVS, i.e. viral immune evasion rather than host antiviral defense. Transferring the same unsupported
      ortholog annotation does not add evidence.'
  - claim_id: REJ-04
    gene: Mapk1
    organism_dir: rat
    term: GO:0019858 cytosine metabolic process
    category: REJECTED
    assessment: NPI
    rationale: ERK2 is a protein kinase with no role executing cytosine metabolism; the donor mouse annotation
      misapplies a process term from an IDA paper, and the curator removed the same term for this reason.
  - claim_id: UNR-15
    gene: Dnajb11
    organism_dir: mouse
    term: GO:0036498 IRE1-mediated unfolded protein response
    category: UNRELATED
    assessment: NPI
    rationale: ERdj3 is an ER-lumenal BiP co-chaperone whose gene is induced by IRE1/XBP1s; being a UPR
      target gene is not participation in IRE1-mediated signaling, so the term (likely from Reactome target-gene
      membership) does not describe its function.
  - claim_id: UNR-16
    gene: Rbpj
    organism_dir: mouse
    term: GO:0006310 DNA recombination
    category: UNRELATED
    assessment: NPI
    rationale: RBP-J was named 'recombination signal binding protein for Ig kappa J' because it was first
      thought to bind V(D)J recombination signals. It was later shown to be the CSL transcription factor
      of Notch signalling with no recombinase role, so DNA recombination is a historical name-based error.
  - claim_id: R2-BP-REJ-02
    gene: App
    organism_dir: mouse
    term: GO:0006468 protein phosphorylation
    category: REJECTED
    assessment: NPI
    rationale: APP has no kinase domain or kinase activity; the source IMP (PMID:16025111) actually describes
      Abeta-triggered DEPHOSPHORYLATION of NR2B by PP2B/STEP, so the ortholog annotation being transferred
      was itself a misreading. The curator's removal stands.
  - claim_id: R2-BP-REJ-05
    gene: SPCS3
    organism_dir: human
    term: GO:0045047 protein targeting to ER
    category: REJECTED
    assessment: NPI
    rationale: SPCS3 is a non-catalytic accessory subunit of the ER signal peptidase complex, which cleaves
      signal peptides from substrates already being translocated; it acts downstream of, and does not
      direct, ER targeting (SRP/SRP receptor/Sec61 do). The source PANTHER-level term mis-specifies signal-peptide
      processing as targeting.
  - claim_id: R2-BP-UNR-07
    gene: ndx-1
    organism_dir: worm
    term: GO:0046712 GDP catabolic process
    category: UNRELATED
    assessment: NPI
    rationale: NDX-1 is an 8-oxo-(d)GDP phosphatase that sanitises oxidised guanine nucleotides; purified
      NDX-1 hydrolyses unoxidised GDP at under 5% and does not act on dGDP. GDP catabolism conflates the
      oxidised substrate with ordinary GDP and implies a role in normal GDP turnover that is not supported.
  - claim_id: R2-BP-REJ-01
    gene: D14
    organism_dir: ARATH
    term: GO:1901601 strigolactone biosynthetic process
    category: REJECTED
    assessment: NPI
    rationale: D14 is the strigolactone receptor and D-ring hydrolase acting downstream of SL synthesis.
      d14 mutants are SL-insensitive and over-accumulate SL rather than lacking it, a feedback effect,
      and the biosynthetic steps are performed by D27, CCD7, CCD8 and MAX1. The source IBA/IMP annotations
      are themselves wrong, and the removal stands.
  FREQUENCY_BIAS:
  - claim_id: UNR-17
    gene: ALDH4A1
    organism_dir: human
    term: GO:0007165 signal transduction
    category: UNRELATED
    assessment: REP
    rationale: ALDH4A1 is a mitochondrial delta-1-pyrroline-5-carboxylate dehydrogenase in proline catabolism;
      generic 'signal transduction' has no specific basis for this enzyme and reflects a high-frequency
      ortholog term.
  - claim_id: R2-BP-UNR-02
    gene: cebp-2
    organism_dir: worm
    term: GO:0016071 mRNA metabolic process
    category: UNRELATED
    assessment: NPI
    rationale: CEBP-2 is a bZIP transcription factor regulating immune and lipid-metabolism genes; there
      is no evidence it participates in mRNA processing, stability or degradation. Regulating transcription
      of target genes is not mRNA metabolism.
  IN_VITRO_NOT_IN_VIVO:
  - claim_id: REJ-14
    gene: Hspa8
    organism_dir: rat
    term: GO:0046777 protein autophosphorylation
    category: REJECTED
    assessment: NPI
    rationale: The review removed this term because the cited paper reports HSC70 ATPase activity, not
