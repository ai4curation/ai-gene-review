claims:
- claim_id: R2-BP-UNR-12
  category: UNRELATED
  accession: A1Z7Q8
  gene: alc
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0035878
    label: nail development
  review_file: genes/DROME/alc/alc-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Nail development is a mammalian (digit keratinized appendage) process, presumably transferred
    from a mouse AMPK beta-subunit phenotype; Drosophila has no nails. alc is the AMPK beta scaffold acting
    in energy sensing and photoreceptor/neuron maintenance.
  evidence: review description; core_functions; GO:0035878 definition (UBERON nail)
- claim_id: R2-CC-REJ-02
  category: REJECTED
  accession: Q9VT70
  gene: nudE
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005871
    label: kinesin complex
  review_file: genes/DROME/nudE/nudE-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NudE is a Lis1/dynein regulator, not a kinesin subunit; the family-level kinesin complex
    IBA stems from rat Ndel1 being reported as a kinesin-1 cargo, and was removed in the human NDE1/NDEL1
    reviews. No fly evidence links NudE to a kinesin complex, so the removal stands.
  evidence: existing_annotations GO:0005871 IBA REMOVE reason; review description
- claim_id: R2-MF-UNR-04
  category: UNRELATED
  accession: P63100
  gene: Ppp3r1
  organism_dir: rat
  aspect: MF
  term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  review_file: genes/rat/Ppp3r1/Ppp3r1-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: Ppp3r1 (CnB1) is the non-catalytic, EF-hand calcium-binding regulatory subunit of calcineurin;
    phosphatase catalysis is performed by the PPP3CA/B/C A subunit. The holoenzyme's activity was transferred
    onto the regulatory subunit.
  evidence: review description ('it has no catalytic'); existing_annotations GO:0008597 regulator activity
    ACCEPT
- claim_id: R2-BP-UNR-05
  category: UNRELATED
  accession: P08018
  gene: PBS2
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0034599
    label: cellular response to oxidative stress
  review_file: genes/yeast/PBS2/PBS2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Pbs2 is the sole MAPKK activating Hog1, and the HOG pathway is activated by and contributes
    to resistance to oxidative stress (e.g. Pbs2-dependent Hog1 activation counteracting ROS after telomerase
    loss). A secondary but genuine stress-response role not in current GOA; less central than the osmotic
    response.
  evidence: PBS2 deep-research-falcon (Zeinoun 2024, Pbs2-dependent Hog1 activation by ROS); review description;
    GO:0033554 cellular response to stress KEEP_AS_NON_CORE
- claim_id: R2-CC-REJ-04
  category: REJECTED
  accession: O74689
  gene: nudE
  organism_dir: EMENI
  aspect: CC
  term:
    id: GO:0005871
    label: kinesin complex
  review_file: genes/EMENI/nudE/nudE-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: A. nidulans NudE supports NudF/LIS1-dependent dynein activation and is not a kinesin complex
    subunit; the IBA derives from rat Ndel1 described as a kinesin-1 cargo. No fungal evidence supports
    kinesin complex membership.
  evidence: existing_annotations GO:0005871 IBA REMOVE reason; review description
- claim_id: R2-MF-NAR-03
  category: NARROWER
  accession: Q00684
  gene: CDC14
  organism_dir: yeast
  aspect: MF
  term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  review_file: genes/yeast/CDC14/CDC14-ai-review.yaml
  assessment: NPI
  error_type: IN_VITRO_NOT_IN_VIVO
  rationale: Cdc14 is a dual-specificity PTP-superfamily enzyme that can hydrolyse phosphotyrosine in
    vitro, but its physiological substrates are CDK pSer/pThr-Pro sites and pTyr is a poor substrate;
    the review MODIFYs this EC-mapped term to dual-specificity/Ser-Thr phosphatase. The tyrosine-specific
    term misrepresents its biological activity.
  evidence: existing_annotations GO:0004725 IEA MODIFY reason; GO:0004722 ACCEPT
- claim_id: R2-MF-REJ-06
  category: REJECTED
  accession: P70677
  gene: Casp3
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0002020
    label: protease binding
  review_file: genes/mouse/Casp3/Casp3-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Caspase-3 is cleaved and activated by initiator caspases (caspase-8/9) and granzyme B, so
    physical association with proteases occurs, but this is an enzyme-substrate relationship rather than
    an informative function; the review removal used generic reasoning. Neither clearly wrong nor a meaningful
    molecular function.
  evidence: existing_annotations GO:0002020 IEA/ISO REMOVE reason (generic); review description
- claim_id: R2-CC-NAR-03
  category: NARROWER
  accession: Q8IG69
  gene: cebp-2
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0005654
    label: nucleoplasm
  review_file: genes/worm/cebp-2/cebp-2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: CEBP-2 is a bZIP transcription factor with IDA nuclear localization in intestinal cells;
    as a DNA-binding TF acting on chromatin it resides in the nucleoplasm. Correct, modestly more specific
    than the curated nucleus.
  evidence: existing_annotations GO:0005634 nucleus IDA ACCEPT; review description
- claim_id: R2-CC-NAR-06
  category: NARROWER
  accession: A1ZBJ2
  gene: Acadvl
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0042645
    label: mitochondrial nucleoid
  review_file: genes/DROME/Acadvl/Acadvl-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Acadvl is a mitochondrial inner-membrane-associated beta-oxidation flavoenzyme; mitochondrial
    nucleoid assignments for VLCAD-family proteins come from nucleoid-preparation proteomics, which co-purify
    inner-membrane proteins. No evidence that the fly enzyme is a nucleoid component.
  evidence: review description; existing_annotations GO:0005743 mitochondrial inner membrane ACCEPT
- claim_id: R2-MF-NAR-02
  category: NARROWER
  accession: H2KZZ2
  gene: hlh-30
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0070888
    label: E-box binding
  review_file: genes/worm/hlh-30/hlh-30-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: HLH-30 is the TFEB ortholog, a MiT/TFE bHLH-zip factor that binds E-box (CLEAR, CACGTG) elements
    in promoters of lysosomal/autophagy and lipase genes. E-box binding is a correct, more specific refinement
    of the accepted cis-regulatory DNA-binding term.
  evidence: existing_annotations GO:0000978 IBA ACCEPT reason (E-box binding); review description
- claim_id: R2-MF-UNR-07
  category: UNRELATED
  accession: G5EBX9
  gene: pef-1
  organism_dir: worm
  aspect: MF
  term:
    id: GO:0005516
    label: calmodulin binding
  review_file: genes/worm/pef-1/pef-1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: PEF-1 is the C. elegans RdgC/PPEF phosphatase and UniProt annotates an N-terminal IQ motif;
    in Drosophila RdgC the IQ motif mediates calmodulin binding required for function. Calmodulin binding
    is well-founded by domain and family mechanism, though untested directly in worm.
  evidence: pef-1-uniprot.txt FT IQ domain; pef-1 deep research (Lee and Montell 2001 RdgC-calmodulin)
- claim_id: R2-CC-UNR-03
  category: UNRELATED
  accession: Q9QWV9
  gene: Ccnt1
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0005703
    label: polytene chromosome puff
  review_file: genes/mouse/Ccnt1/Ccnt1-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Polytene chromosome puffs exist only in dipteran polytene tissues; mouse has no polytene
    chromosomes. The term was transferred from the Drosophila CycT ortholog's immunostaining; mouse cyclin
    T1 is in nucleoplasmic P-TEFb.
  evidence: GO:0005703 definition; review description; existing_annotations GO:0005654 nucleoplasm ACCEPT
- claim_id: R2-BP-NAR-04
  category: NARROWER
  accession: Q8UUZ6
  gene: cryaa
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0070309
    label: lens fiber cell morphogenesis
  review_file: genes/DANRE/cryaa/cryaa-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: cryaa is a lens structural crystallin and holdase required for normal lens development; in
    the cloche model alphaA-crystallin overexpression restored lens fiber cell differentiation. Whether
    it participates in fiber cell morphogenesis per se (rather than being required for lens transparency)
    is not established for zebrafish.
  evidence: existing_annotations GO:0001654 MODIFY reason and PMID:16728471 quote; core_functions (lens
    development)
- claim_id: R2-BP-UNR-06
  category: UNRELATED
  accession: A0A8M9QG43
  gene: A0A8M9QG43
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0061024
    label: membrane organization
  review_file: genes/DANRE/A0A8M9QG43/A0A8M9QG43-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Auxilin acts in the uncoating of clathrin-coated vesicles by recruiting Hsc70; this is protein-coat
    disassembly within endocytosis. Membrane organization is a vague grouping term that at best loosely
    covers this and adds nothing over clathrin coat disassembly/clathrin-dependent endocytosis.
  evidence: review description; NEW GO:0072318 clathrin coat disassembly and GO:0072583 clathrin-dependent
    endocytosis
- claim_id: R2-MF-REJ-05
  category: REJECTED
  accession: Q10350
  gene: cab4
  organism_dir: SCHPO
  aspect: MF
  term:
    id: GO:0004140
    label: dephospho-CoA kinase activity
  review_file: genes/SCHPO/cab4/cab4-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: S. pombe cab4 contains only the PPAT-like cytidylyltransferase domain and lacks the dephospho-CoA
    kinase (CoaE) domain; DPCK activity was transferred from bifunctional COASY-type orthologs. The removal
    is correct (DPCK in fission yeast is a separate protein).
  evidence: existing_annotations GO:0004140 IBA REMOVE reason; review description
- claim_id: R2-BP-UNR-03
  category: UNRELATED
  accession: Q9W4S9
  gene: Pde4
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0040013
    label: negative regulation of locomotion
  review_file: genes/DROME/Pde4/Pde4-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Locomotor phenotype term likely transferred from a mammalian PDE4 mutant phenotype; Pde4/dunce
    is a cAMP phosphodiesterase whose behavioural effects are downstream of cAMP turnover in specific
    circuits. No fly evidence that dunce negatively regulates locomotion.
  evidence: review description; existing_annotations behavioural terms KEEP_AS_NON_CORE
- claim_id: R2-BP-UNR-02
  category: UNRELATED
  accession: Q8IG69
  gene: cebp-2
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0016071
    label: mRNA metabolic process
  review_file: genes/worm/cebp-2/cebp-2-ai-review.yaml
  assessment: NPI
  error_type: FREQUENCY_BIAS
  rationale: CEBP-2 is a bZIP transcription factor regulating immune and lipid-metabolism genes; there
    is no evidence it participates in mRNA processing, stability or degradation. Regulating transcription
    of target genes is not mRNA metabolism.
  evidence: review description; core_functions; existing_annotations (all transcription/immunity)
- claim_id: R2-CC-UNR-11
  category: UNRELATED
  accession: P34574
  gene: chc-1
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0043195
    label: terminal bouton
  review_file: genes/worm/chc-1/chc-1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Clathrin heavy chain functions in synaptic vesicle recycling at presynaptic terminals, so
    presynaptic localization is plausible, but terminal bouton is a vertebrate synapse morphology transferred
    from rodent ortholog localization; C. elegans neurons mostly form en passant synapses and no worm
    chc-1 presynaptic localization is in the review.
  evidence: review description; GO:0043195 definition; existing_annotations (no synaptic location)
