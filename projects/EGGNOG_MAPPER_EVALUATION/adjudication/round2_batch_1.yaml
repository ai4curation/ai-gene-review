claims:
- claim_id: R2-BP-REJ-02
  category: REJECTED
  accession: P12023
  gene: App
  organism_dir: mouse
  aspect: BP
  term:
    id: GO:0006468
    label: protein phosphorylation
  review_file: genes/mouse/App/App-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: "APP has no kinase domain or kinase activity; the source IMP (PMID:16025111) actually describes Abeta-triggered DEPHOSPHORYLATION of NR2B by PP2B/STEP, so the ortholog annotation being transferred was itself a misreading. The curator's removal stands."
  evidence: "existing_annotations GO:0006468 IMP REMOVE reason; review description"
- claim_id: R2-MF-REJ-04
  category: REJECTED
  accession: P19324
  gene: Serpinh1
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  review_file: genes/mouse/Serpinh1/Serpinh1-ai-review.yaml
  assessment: NPI
  error_type: PSEUDOENZYME_OVERANNOTATION
  rationale: "HSP47 keeps the serpin fold but has lost protease-inhibitor activity and works only as an ER collagen-specific chaperone. Inhibitor activity is the ancestral serpin function, transferred by family membership onto a neofunctionalized non-inhibitory serpin."
  evidence: "review description; existing_annotations GO:0004867 IBA/IEA REMOVE reasons"
- claim_id: R2-CC-UNR-06
  category: UNRELATED
  accession: P30938
  gene: Sstr5
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0005737
    label: cytoplasm
  review_file: genes/rat/Sstr5/Sstr5-ai-review.yaml
  assessment: NPI
  error_type: LOCALIZATION_DEFAULT
  rationale: "SSTR5 is a multi-pass plasma-membrane GPCR (UniProt: Cell membrane); the review supports only plasma membrane and neuron projection. Bulk 'cytoplasm' is a default compartment with no specific basis; any intracellular pool would be internalized receptor on endosome membranes, not the cytoplasm."
  evidence: "uniprot SUBCELLULAR LOCATION; review CC annotations (GO:0005886 ACCEPT)"
- claim_id: R2-MF-REJ-02
  category: REJECTED
  accession: Q9M9Y8
  gene: CRTISO
  organism_dir: ARATH
  aspect: MF
  term:
    id: GO:0016491
    label: oxidoreductase activity
  review_file: genes/ARATH/CRTISO/CRTISO-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: "CRTISO belongs to the carotenoid/retinoid oxidoreductase (CrtI-like) family, but it is a FAD(red)-dependent cis-trans isomerase (EC 5.2.1.13) that carries out a non-redox reaction and has no desaturase activity. The oxidoreductase activity belongs to the desaturase paralogs of the family."
  evidence: "existing_annotations GO:0016491 IEA REMOVE reason; review description"
- claim_id: R2-CC-NAR-04
  category: NARROWER
  accession: P60766
  gene: Cdc42
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  review_file: genes/mouse/Cdc42/Cdc42-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: "Cdc42 is membrane-associated, and the review supports plasma membrane, Golgi membrane and intracellular membranes for the palmitoylated isoform. An ER-membrane pool is plausible as the site of CAAX processing or palmitoylation, but that is a transit or processing site, not where Cdc42 acts, and no Cdc42-specific evidence for it is cited here."
  evidence: "uniprot SUBCELLULAR LOCATION; review description; GO:0016020/GO:0000139 annotations"
- claim_id: R2-MF-NAR-01
  category: NARROWER
  accession: P12023
  gene: App
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0016504
    label: peptidase activator activity
  review_file: genes/mouse/App/App-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: "Full-length APP is a secretase substrate, not a peptidase activator; the curator MODIFIED this ISO row to serine-type endopeptidase inhibitor activity, which only the KPI-domain isoforms have. The activator claim probably comes from Abeta-fragment effects (e.g. stimulating tPA in vitro), so the source annotation was itself wrong."
  evidence: "existing_annotations GO:0016504 ISO MODIFY reason; review description"
- claim_id: R2-CC-REJ-06
  category: REJECTED
  accession: Q6PEI9
  gene: col1a1b
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0005794
    label: Golgi apparatus
  review_file: genes/DANRE/col1a1b/col1a1b-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: "Secreted procollagen alpha3(I) passes through the Golgi on its way out of the cell, so the term is not false. But it is a transit compartment and says nothing about where the protein works, which is the extracellular matrix. The parent 'cytoplasm' was removed because its only grounding was a paralog mRNA in situ."
  evidence: "existing_annotations GO:0005737 IBA REMOVE reason; GO:0005576/GO:0031012 ACCEPT; review description"
- claim_id: R2-BP-UNR-08
  category: UNRELATED
  accession: Q6DG85
  gene: uox
  organism_dir: DANRE
  aspect: BP
  term:
    id: GO:0019428
    label: allantoin biosynthetic process
  review_file: genes/DANRE/uox/uox-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: "Uricase carries out the first, committed step of urate oxidation to (S)-allantoin (with Urah and Urad), and allantoin is the excreted end product in fish. So allantoin biosynthetic process is correct and adds a pathway-outcome term that the review's urate catabolic process does not capture."
  evidence: "review description; GO:0019428 definition; urate oxidase activity ACCEPT"
- claim_id: R2-BP-NAR-03
  category: NARROWER
  accession: Q00684
  gene: CDC14
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0031536
    label: positive regulation of exit from mitosis
  review_file: genes/yeast/CDC14/CDC14-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: "Cdc14 is the essential phosphatase that drives mitotic exit by reversing Cdk1 phosphorylation (Cdh1, Sic1, Swi5). Positive regulation of exit from mitosis is the correct, more specific direction of the regulation-of-exit-from-mitosis rows the review accepts."
  evidence: "review description; GO:0007096 rows; GO:0031536 definition"
- claim_id: R2-CC-UNR-02
  category: UNRELATED
  accession: P13864
  gene: Dnmt1
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0043025
    label: neuronal cell body
  review_file: genes/mouse/Dnmt1/Dnmt1-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: "Dnmt1 is a nuclear (and partly cytoplasmic) protein that is also expressed in post-mitotic neurons. Because the neuronal cell body includes the nucleus, the term is technically true, but it is an expression or immunostaining observation with no functional information beyond nucleus/cytoplasm."
  evidence: "uniprot SUBCELLULAR LOCATION; review CC annotations (nucleus ACCEPT, cytoplasm KEEP_AS_NON_CORE)"
- claim_id: R2-MF-NAR-05
  category: NARROWER
  accession: E7FE11
  gene: slc7a10b
  organism_dir: DANRE
  aspect: MF
  term:
    id: GO:0015194
    label: L-serine transmembrane transporter activity
  review_file: genes/DANRE/slc7a10b/slc7a10b-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: "slc7a10b is an Asc-1 co-ortholog that keeps all substrate-binding residues, and Asc-1 is an established glycine/L-serine exchanger. L-serine transporter activity correctly narrows the accepted neutral L-amino acid transporter term. Support comes from conservation; there is no zebrafish assay."
  evidence: "review description; GO:0015175 IBA ACCEPT reason; core_functions"
- claim_id: R2-CC-UNR-05
  category: UNRELATED
  accession: P06784
  gene: STE7
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0032153
    label: cell division site
  review_file: genes/yeast/STE7/STE7-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: "S. cerevisiae Ste7 is documented in the cytoplasm and at the mating projection tip (IDA), and nothing ties it to the bud neck or division plane. The term probably came from a localization-screen annotation of a fungal ortholog. It is unsupported for Ste7, but no evidence directly excludes it."
  evidence: "uniprot DR GO lines; review CC annotations (cytoplasm, mating projection tip ACCEPT)"
- claim_id: R2-CC-UNR-10
  category: UNRELATED
  accession: Q01279
  gene: Egfr
  organism_dir: mouse
  aspect: CC
  term:
    id: GO:0005576
    label: extracellular region
  review_file: genes/mouse/Egfr/Egfr-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: "Canonical EGFR is a single-pass plasma-membrane receptor. Truncated soluble EGFR isoforms from alternative transcripts and ectodomain shedding have been reported in rodents and human, but mouse UniProt lists no secreted isoform and the review does not address them. The term may hold only for an isoform or fragment."
  evidence: "uniprot SUBCELLULAR LOCATION (no secreted isoform); review description and CC annotations"
- claim_id: R2-MF-UNR-08
  category: UNRELATED
  accession: P00684
  gene: Rnase1
  organism_dir: rat
  aspect: MF
  term:
    id: GO:0042802
    label: identical protein binding
  review_file: genes/rat/Rnase1/Rnase1-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: "Rat pancreatic RNase is annotated as a monomer (UniProt SUBUNIT). The domain-swapped dimers known for bovine RNase A form under non-physiological in vitro conditions. Identical protein binding is a high-frequency generic term with no specific basis for this protein."
  evidence: "uniprot SUBUNIT: Monomer; review description"
- claim_id: R2-MF-UNR-11
  category: UNRELATED
  accession: P11798
  gene: Camk2a
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  review_file: genes/mouse/Camk2a/Camk2a-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: "CaMKIIalpha is a Ser/Thr kinase made of a catalytic domain, a CaM-binding autoregulatory segment and an association hub; it has no DH, CDC25, SEC7 or DOCK GEF domain. No CaMKII ortholog in the repo carries GEF activity, so the term has no support."
  evidence: "review description; uniprot domain/FUNCTION; no GO:0005085 in any CaMKII goa.tsv in repo"
- claim_id: R2-CC-NAR-01
  category: NARROWER
  accession: P48500
  gene: Tpi1
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0030018
    label: Z disc
  review_file: genes/rat/Tpi1/Tpi1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: "Glycolytic enzymes, including TPI, have been reported to associate with thin filaments and the Z-disc/I-band in striated muscle, so the term is plausible. But the rat review and UniProt support only cytosol/cytoplasm, and there is no rat-specific evidence to check."
  evidence: "uniprot SUBCELLULAR LOCATION: Cytoplasm; review CC annotations"
- claim_id: R2-CC-UNR-04
  category: UNRELATED
  accession: E7FE11
  gene: slc7a10b
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0097440
    label: apical dendrite
  review_file: genes/DANRE/slc7a10b/slc7a10b-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: "A neuron-subcompartment term transferred from mammalian Asc-1 immunolocalization. slc7a10b is expressed at low levels in zebrafish brain, but nothing shows the protein in apical dendrites, and the review leaves open which tissues each paralog keeps."
  evidence: "review description (expression); suggested_questions on paralog expression; CC annotations (plasma membrane only)"
- claim_id: R2-BP-REJ-06
  category: REJECTED
  accession: Q8MMJ4
  gene: Gcm
  organism_dir: STRPU
  aspect: BP
  term:
    id: GO:0007403
    label: glial cell fate determination
  review_file: genes/STRPU/Gcm/Gcm-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: "Glial fate determination is a Drosophila-specific use of gcm. Sea urchin Gcm is expressed only in the mesodermal pigment-cell lineage and is never seen in neural or glial tissue, and its knockdown removes pigment cells. The curator's removal of the parent gliogenesis term is well supported."
  evidence: "existing_annotations GO:0042063 IBA REMOVE reason (PMID:12027439, PMID:16925988)"
