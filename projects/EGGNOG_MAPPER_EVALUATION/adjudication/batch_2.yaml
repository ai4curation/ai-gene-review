claims:
- claim_id: UNR-39
  category: UNRELATED
  accession: O76337
  gene: ced-6
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0016319
    label: mushroom body development
  review_file: genes/worm/ced-6/ced-6-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Mushroom bodies are an insect brain structure; the term comes from a Drosophila Ced-6 mutant
    phenotype. C. elegans has no mushroom body, and CED-6 acts as a PTB adaptor downstream of CED-1 in
    apoptotic-corpse engulfment.
  evidence: review description; core_functions (engulfment of apoptotic cell)
- claim_id: UNR-04
  category: UNRELATED
  accession: Q0G838
  gene: dyf-6
  organism_dir: worm
  aspect: BP
  term:
    id: GO:0060041
    label: retina development in camera-type eye
  review_file: genes/worm/dyf-6/dyf-6-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Camera-type eye/retina development comes from a vertebrate ift46 mutant phenotype (photoreceptor
    cilia). C. elegans has no camera-type eye; DYF-6/IFT46 acts in IFT-B in amphid/phasmid sensory cilia.
  evidence: review description; core_functions (intraciliary transport, non-motile cilium assembly)
- claim_id: UNR-09
  category: UNRELATED
  accession: H6TB12
  gene: mdr
  organism_dir: STABO
  aspect: CC
  term:
    id: GO:0000324
    label: fungal-type vacuole
  review_file: genes/STABO/mdr/mdr-ai-review.yaml
  assessment: NPI
  error_type: FREQUENCY_BIAS
  rationale: Mdr is a full-length ABCB/MDR-subfamily exporter that secretes sophorolipids, and UniProt
    and the transportome analysis place it in the plasma membrane. Nothing supports vacuolar localization.
    The term looks like a common fungal localization carried over from orthologs, not specific evidence.
  evidence: uniprot FUNCTION and SUBCELLULAR LOCATION (cell membrane); review core_functions (plasma membrane)
- claim_id: NAR-01
  category: NARROWER
  accession: Q94527
  gene: Rel
  organism_dir: DROME
  aspect: CC
  term:
    id: GO:0005739
    label: mitochondrion
  review_file: genes/DROME/Rel/Rel-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Relish acts in the cytoplasm (as the uncleaved precursor and the REL-49 fragment) and in
    the nucleus (as REL-68). No Relish-specific evidence places it in mitochondria. Mitochondrial pools
    have been reported for some mammalian NF-kappaB/IkappaB proteins, so the term cannot be firmly refuted,
    but it is an unsupported over-specification of cytoplasm.
  evidence: review description; existing_annotations GO:0005737 cytoplasm ACCEPT reason; core_functions
    (nucleus)
- claim_id: NAR-04
  category: NARROWER
  accession: A0A811M5M6
  gene: NCGR_LOCUS1765
  organism_dir: 9POAL
  aspect: BP
  term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  review_file: genes/9POAL/NCGR_LOCUS1765/NCGR_LOCUS1765-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: CBP80/NCBP1 is the large CBC subunit, which promotes spliceosome assembly on cap-proximal
    introns through U1 snRNP recruitment. Arabidopsis ABH1/CBP80 regulates splicing genome-wide. The review
    adds RNA splicing as NEW, and this spliceosomal-mRNA child is the correct, more specific term.
  evidence: review description; core_functions (RNA splicing); existing_annotations GO:0008380 NEW reason
- claim_id: UNR-14
  category: UNRELATED
  accession: P10361
  gene: Tp53
  organism_dir: rat
  aspect: CC
  term:
    id: GO:0035861
    label: site of double-strand break
  review_file: genes/rat/Tp53/Tp53-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: p53 is recruited to DNA double-strand break foci as part of its DNA-damage response, which
    is documented for mammalian (human/mouse) p53. Given the conserved DNA-damage role of rat Tp53, this
    localization is very likely correct. It is a secondary location, not the core site of transcription-factor
    activity.
  evidence: review description and core_functions (DNA damage response; nucleus, chromatin)
- claim_id: REJ-17
  category: REJECTED
  accession: P02761
  gene: Ratn1
  organism_dir: rat
  aspect: MF
  term:
    id: GO:0005009
    label: insulin receptor activity
  review_file: genes/rat/Ratn1/Ratn1-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Rat n 1 is a secreted ~19 kDa lipocalin with no transmembrane or tyrosine-kinase domain,
    so it cannot have insulin receptor activity. The source mouse MUP1 annotation is itself contradicted
    by its own study (no change in insulin receptor phosphorylation). The curator's removal is correct.
  evidence: existing_annotations GO:0005009 REMOVE reason; review description
- claim_id: NAR-18
  category: NARROWER
  accession: P90961
  gene: clic-1
  organism_dir: worm
  aspect: CC
  term:
    id: GO:0032588
    label: trans-Golgi network membrane
  review_file: genes/worm/clic-1/clic-1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Clathrin light chains are part of the clathrin coats that form on trans-Golgi network membranes
    as well as on the plasma membrane. The review accepts clathrin coat of trans-Golgi network vesicle
    for CLIC-1, and the description names TGN-derived coated vesicles. The TGN membrane location is consistent
    with that and adds information beyond 'membrane'.
  evidence: review description; existing_annotations GO:0030130 ACCEPT
- claim_id: UNR-11
  category: UNRELATED
  accession: P53686
  gene: HST2
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0036166
    label: phenotypic switching
  review_file: genes/yeast/HST2/HST2-ai-review.yaml
  assessment: NPI
  error_type: TAXON_CONSTRAINT_VIOLATION
  rationale: Phenotypic switching (e.g. white-opaque switching) is a Candida albicans trait in which sirtuins
    have been implicated. S. cerevisiae does not show this switching. HST2 is an NAD-dependent H4K16 deacetylase
    that acts in chromatin regulation.
  evidence: review description; core_functions; GO term definition (C. albicans white-opaque example)
- claim_id: UNR-32
  category: UNRELATED
  accession: P23561
  gene: STE11
  organism_dir: yeast
  aspect: CC
  term:
    id: GO:0051286
    label: cell tip
  review_file: genes/yeast/STE11/STE11-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Experimentally, Ste11 is cytoplasmic and is transiently recruited to the membrane through
    Ste50/Opy2/Cdc42 and Ste5. It may therefore be present at the mating-projection tip (a child of cell
    tip) in pheromone-treated cells, but no direct Ste11 localization there is cited. Cell tip is probably
    carried over from an ortholog in an elongated fungus such as fission yeast.
  evidence: review existing_annotations cytoplasm (GFP localization) reason; description (Ste5/Ste50 recruitment)
- claim_id: UNR-06
  category: UNRELATED
  accession: Q02196
  gene: MET14
  organism_dir: yeast
  aspect: BP
  term:
    id: GO:0016310
    label: phosphorylation
  review_file: genes/yeast/MET14/MET14-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Met14 is an APS kinase, so it does carry out phosphorylation, but of a small-molecule nucleotide
    (APS to PAPS) in sulfate assimilation. The generic 'phosphorylation' term adds nothing to adenylylsulfate
    kinase activity and sulfate assimilation.
  evidence: review description; core_functions (adenylylsulfate kinase activity; sulfate assimilation)
- claim_id: NAR-19
  category: NARROWER
  accession: P78820
  gene: cut6
  organism_dir: SCHPO
  aspect: CC
  term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  review_file: genes/SCHPO/cut6/cut6-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Cut6 is a large soluble biotin-dependent ACC with no transmembrane segment. The review and
    S. pombe HDA data place it in the cytosol. A peripheral ER association has not been shown for Cut6.
    The term is a plausible but unsupported over-specification of cytoplasm, perhaps from ortholog localizations.
  evidence: review description ('The protein is cytosolic'); existing_annotations GO:0005829 cytosol HDA
    ACCEPT
- claim_id: UNR-23
  category: UNRELATED
  accession: P32883
  gene: Kras
  organism_dir: mouse
  aspect: MF
  term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  review_file: genes/mouse/Kras/Kras-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: KRAS is the GTPase substrate of guanine-nucleotide exchange factors (SOS, RasGRP), not a
    GEF itself. GTP-bound Ras allosterically stimulates SOS, but that is not exchange-factor activity.
    A source annotation probably conflated GEF binding/allostery with GEF activity.
  evidence: review description; core_functions (GTPase activity, nucleotide switch)
- claim_id: REJ-13
  category: REJECTED
  accession: Q9BZX2
  gene: UCK2
  organism_dir: human
  aspect: BP
  term:
    id: GO:0007631
    label: feeding behavior
  review_file: genes/human/UCK2/UCK2-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: UCK2 is a cytosolic pyrimidine-salvage uridine/cytidine kinase. 'Feeding behavior' is an
    organism-level phenotype term transferred from an ortholog and does not reflect any activity of the
    enzyme. The curator's removal is correct.
  evidence: existing_annotations GO:0007631 REMOVE reason; core_functions (UMP salvage, CTP salvage)
- claim_id: REJ-11
  category: REJECTED
  accession: Q6U1J5
  gene: col1a1a
  organism_dir: DANRE
  aspect: CC
  term:
    id: GO:0005794
    label: Golgi apparatus
  review_file: genes/DANRE/col1a1a/col1a1a-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: The curator removed cytoplasm (IBA) because the collagen chain acts in the ECM. Even so,
    pro-alpha1(I) procollagen does pass through the Golgi on its way to secretion; this is conserved secretory-pathway
    biology for fibrillar collagens. The Golgi location is therefore biologically correct as a biosynthetic
    transit compartment, though it is not where the structural activity is exerted.
  evidence: existing_annotations GO:0005737 REMOVE/MARK_AS_OVER_ANNOTATED reasons; review description
    (signal peptide, secreted procollagen)
- claim_id: NAR-13
  category: NARROWER
  accession: Q12702
  gene: pab1
  organism_dir: SCHPO
  aspect: BP
  term:
    id: GO:0070262
    label: peptidyl-serine dephosphorylation
  review_file: genes/SCHPO/pab1/pab1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Pab1 is the substrate-selecting B55 subunit of PP2A-B55. The review's core functions name
    dephosphorylation of serine/threonine sites, including removal of the activating Ser546 phosphate
    from Gad8. Peptidyl-serine dephosphorylation is a correct specific child of protein dephosphorylation
    for the holoenzyme in which Pab1 participates.
  evidence: core_functions (protein dephosphorylation; Gad8 Ser546 dephosphorylation)
- claim_id: NAR-14
  category: NARROWER
  accession: P52564
  gene: MAP2K6
  organism_dir: human
  aspect: BP
  term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  review_file: genes/human/MAP2K6/MAP2K6-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: The review keeps regulation of cell cycle as non-core on the basis of MKK6-p38gamma signalling
    to the G2 checkpoint, which is a mitotic-cell-cycle checkpoint. This makes regulation of mitotic cell
    cycle a correct, more specific, though non-core, term.
  evidence: existing_annotations GO:0051726 regulation of cell cycle KEEP_AS_NON_CORE reason
- claim_id: UNR-02
  category: UNRELATED
  accession: P0ABZ6
  gene: surA
  organism_dir: ECOLI
  aspect: BP
  term:
    id: GO:0000413
    label: protein peptidyl-prolyl isomerization
  review_file: genes/ECOLI/surA/surA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: SurA has experimentally demonstrated PPIase activity in its second parvulin domain (IDA),
    which the review accepts. Protein peptidyl-prolyl isomerization is the process counterpart of that
    activity. The isomerase activity is dispensable for SurA's main in vivo chaperone role, so the process
    is non-core.
  evidence: existing_annotations GO:0003755 IDA/IBA ACCEPT reasons; core_functions (PPIase)
- claim_id: REJ-05
  category: REJECTED
  accession: P50591
  gene: TNFSF10
  organism_dir: human
  aspect: MF
  term:
    id: GO:0045569
    label: TRAIL binding
  review_file: genes/human/TNFSF10/TNFSF10-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: '''TRAIL binding'' describes receptors (DR4/DR5/decoys) that bind the TRAIL ligand. Here
    it was transferred, via mouse Tnfsf10, onto the ligand itself. TNFSF10''s only self-interaction is
    homotrimerization, which identical protein binding captures. The curator''s MODIFY away from this
    term is correct.'
  evidence: existing_annotations GO:0045569 MODIFY summary and reason; core_functions (tumor necrosis
    factor receptor binding)
- claim_id: UNR-34
  category: UNRELATED
  accession: Q7KVQ7
  gene: Tango5
  organism_dir: DROME
  aspect: BP
  term:
    id: GO:0016236
    label: macroautophagy
  review_file: genes/DROME/Tango5/Tango5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Tango5 is the Drosophila VMP1 ortholog (UniProt synonym vmp1; VMP1 family). Direct fly experiments
    show it is required for autophagy and developmental mitophagy, and VMP1's role in autophagosome formation
    is conserved from Dictyostelium to human. Macroautophagy is correct, although the review does not
    currently include it.
  evidence: uniprot GN synonyms/SIMILARITY (VMP1 family); Tango5-deep-research-falcon.md
