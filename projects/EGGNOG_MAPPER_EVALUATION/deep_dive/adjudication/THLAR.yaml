claims:
- claim_id: THLAR-01
  category: UNRELATED
  accession: P49264
  gene: CYP71B1
  organism_dir: THLAR
  aspect: CC
  term:
    id: GO:0005886
    label: plasma membrane
  review_file: genes/THLAR/CYP71B1/CYP71B1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Plant CYP71 P450s are typically anchored to the ER membrane on its cytoplasmic face, so a
    plasma membrane location is unexpected and probably comes from an Arabidopsis proteomics hit on a
    CYP71B paralog. However, pennycress CYP71B1 localization has never been tested, so the term cannot
    be refuted outright.
  evidence: CYP71B1 notes (ER expected but untested); deep-research report
- claim_id: THLAR-02
  category: NARROWER
  accession: P49264
  gene: CYP71B1
  organism_dir: THLAR
  aspect: MF
  term:
    id: GO:0016709
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen
  review_file: genes/THLAR/CYP71B1/CYP71B1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Plant microsomal P450s are NADPH-P450 reductase-dependent monooxygenases that insert one
    oxygen atom into the substrate, which is exactly GO:0016709 (is_a both monooxygenase activity and
    GO:0016705). It is a correct, slightly more precise refinement of the accepted family-level terms,
    but still uninformative about substrate.
  evidence: CYP71B1 review (GO:0004497, GO:0016705 ACCEPT); GO:0016709 definition
- claim_id: THLAR-03
  category: UNRELATED
  accession: P49264
  gene: CYP71B1
  organism_dir: THLAR
  aspect: BP
  term:
    id: GO:0044550
    label: secondary metabolite biosynthetic process
  review_file: genes/THLAR/CYP71B1/CYP71B1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Most CYP71-clan enzymes act in specialised metabolism (e.g. camalexin, indole glucosinolates
    in Brassicaceae), so a role in secondary metabolite biosynthesis is plausible. The substrate and pathway
    of pennycress CYP71B1 are unknown, and the review declined to assign any process.
  evidence: CYP71B1 review core function and notes; deep-research report
- claim_id: THLAR-04
  category: DOWNGRADED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: CC
  term:
    id: GO:0005634
    label: nucleus
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: The nucleus term traces to Arabidopsis ESP/ESR, which enters the nucleus only together with
    the transcription factor WRKY53 (Miao & Zentgraf 2007); its main pool is cytoplasmic. Whether TaTFP
    has a similar interaction-dependent nuclear pool is untested, and the TFP review marked the row over-annotated
    rather than refuted.
  evidence: TFP review (nucleus MARK_AS_OVER_ANNOTATED); ARATH/ESP review (nucleus IDA via WRKY53)
- claim_id: THLAR-05
  category: UNRELATED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: BP
  term:
    id: GO:0009753
    label: response to jasmonic acid
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: The source is AtESP/ESR transcript induction by jasmonate (an expression response in the
    Arabidopsis senescence/defence study). TaTFP is constitutively expressed across tissues, and its JA
    responsiveness has never been tested, so the term can be neither confirmed nor refuted.
  evidence: ARATH/ESP review (GO:0009753 IMP KEEP_AS_NON_CORE, expression-based); TFP notes (constitutive
    expression)
- claim_id: THLAR-06
  category: UNRELATED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: BP
  term:
    id: GO:0010150
    label: leaf senescence
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Leaf senescence is an Arabidopsis ESP/ESR mutant phenotype that depends on its antagonism
    of WRKY53. It is copied from a single phenotype study onto pennycress TFP, a functionally diverged
    thiocyanate-forming specifier protein with no senescence data.
  evidence: ARATH/ESP review (GO:0010150 IMP from PMID:17369373); TFP review/notes
- claim_id: THLAR-07
  category: DOWNGRADED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: MF
  term:
    id: GO:0030234
    label: enzyme regulator activity
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: This reflects the outdated view of specifier proteins as myrosinase cofactors. TaTFP is itself
    an Fe2+-dependent carbon-sulfur lyase (sulfolyase, EC 4.8.1.8) that acts on the aglucone, and the
    review MODIFIES enzyme regulator activity to GO:0016846 in both the TFP and the source AtESP reviews.
  evidence: TFP review (GO:0030234 MODIFY -> GO:0016846; PMID:30900313); ARATH/ESP review (GO:0030234
    MODIFY)
- claim_id: THLAR-08
  category: UNRELATED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: BP
  term:
    id: GO:0042742
    label: defense response to bacterium
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Defence response to bacterium comes from Pseudomonas growth phenotypes of Arabidopsis ESR
    overexpression and knockout lines, linked to its WRKY53 partnership. Nothing indicates that TaTFP
    has a role in antibacterial defence, which is a different matter from the herbivore-oriented glucosinolate
    breakdown chemistry.
  evidence: ARATH/ESP review (GO:0042742 IMP from PMID:17369373); TFP review
- claim_id: THLAR-09
  category: UNRELATED
  accession: G1FNI6
  gene: TFP
  organism_dir: THLAR
  aspect: BP
  term:
    id: GO:0050790
    label: regulation of catalytic activity
  review_file: genes/THLAR/TFP/TFP-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: This is the process-level counterpart of the outdated 'enzyme regulator' framing. TaTFP does
    not modulate myrosinase activity; it catalyses the redirection of the aglucone as a lyase in its own
    right.
  evidence: TFP review (GO:0030234 MODIFY to lyase; PMID:30900313)
