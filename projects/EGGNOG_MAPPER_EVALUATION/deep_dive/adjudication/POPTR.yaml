claims:
- claim_id: POPTR-UNR-01
  category: UNRELATED
  accession: A4GYQ9
  gene: psaB
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0010287
    label: plastoglobule
  review_file: genes/POPTR/psaB/psaB-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: PsaB is an integral reaction-center apoprotein of the photosystem I core in the thylakoid
    membrane, not a component of plastoglobule lipoprotein particles. The term most likely derives from
    Arabidopsis plastoglobule proteomics, where abundant thylakoid proteins co-purify with thylakoid-attached
    plastoglobules.
  evidence: psaB review (PSI, chloroplast thylakoid membrane ACCEPT); GO:0010287 definition
- claim_id: POPTR-UNR-02
  category: UNRELATED
  accession: B9HQZ6
  gene: ALARS
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0006400
    label: tRNA modification
  review_file: genes/POPTR/ALARS/ALARS-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: AlaRS charges tRNA(Ala) and deacylates mischarged Ser/Gly-tRNA(Ala) through its editing domain;
    it does not covalently alter tRNA nucleotides as GO:0006400 requires. Nothing in the review, UniProt
    (HAMAP MF_03134) or the domain architecture supports a tRNA modification role, so the transferred
    term is not supported by any evidence for this enzyme.
  evidence: ALARS review core functions (GO:0004813, GO:0002161); UniProt B9HQZ6 FUNCTION; GO:0006400
    definition
- claim_id: POPTR-UNR-03
  category: UNRELATED
  accession: A9P822
  gene: METK1
  organism_dir: POPTR
  aspect: MF
  term:
    id: GO:0005507
    label: copper ion binding
  review_file: genes/POPTR/METK1/METK1-ai-review.yaml
  assessment: NPI
  error_type: IN_VITRO_NOT_IN_VIVO
  rationale: METK1 is a Mg2+/K+-dependent methionine adenosyltransferase; there is no copper site in MAT
    enzymes. Copper ion binding on Arabidopsis SAM synthetases comes from Cu-affinity-chromatography proteomics,
    which captures many abundant cytosolic proteins and does not show a physiological copper-binding function.
  evidence: METK1 review description (Mg2+, K+ cofactors); UniProt A9P822 cofactor lines
- claim_id: POPTR-UNR-04
  category: UNRELATED
  accession: A4GYX2
  gene: ndhH
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0009570
    label: chloroplast stroma
  review_file: genes/POPTR/ndhH/ndhH-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: NdhH is a subunit of the membrane-bound chloroplast NDH complex (subcomplex A, on the stromal
    face of the thylakoid membrane), not a soluble stromal protein. The stroma term most likely comes
    from chloroplast fractionation proteomics, where peripheral thylakoid subunits are recovered in the
    soluble fraction. The review places it in the chloroplast thylakoid membrane.
  evidence: ndhH review (chloroplast thylakoid membrane ACCEPT; NDH complex GO:0010598 NEW)
- claim_id: POPTR-UNR-05
  category: UNRELATED
  accession: A4GYR0
  gene: psaA
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0009941
    label: chloroplast envelope
  review_file: genes/POPTR/psaA/psaA-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: PsaA is a plastid-encoded PSI reaction-center apoprotein inserted into the thylakoid membrane.
    Envelope assignments for highly abundant thylakoid proteins come from contamination in Arabidopsis
    envelope proteomics, not from a real envelope pool.
  evidence: psaA review (chloroplast thylakoid membrane ACCEPT; PSI core)
- claim_id: POPTR-UNR-06
  category: UNRELATED
  accession: B9H5L9
  gene: LIP1
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0006546
    label: glycine catabolic process
  review_file: genes/POPTR/LIP1/LIP1-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: Mitochondrial LIP1 inserts sulfur into octanoylated lipoyl domains, including that of the
    glycine cleavage H-protein, so it is required for glycine decarboxylation. It does not perform any
    step of glycine catabolism itself. The process term reflects a dependence on the cofactor (a mutant
    or photorespiratory phenotype), not participation; protein lipoylation (GO:0009249) is the correct
    process.
  evidence: LIP1 review core (GO:0016992, GO:0009249); CLAUDE.md necessity-vs-participation rule
- claim_id: POPTR-UNR-07
  category: UNRELATED
  accession: A4GYS2
  gene: ycf4
  organism_dir: POPTR
  aspect: MF
  term:
    id: GO:0051082
    label: unfolded protein binding
  review_file: genes/POPTR/ycf4/ycf4-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Ycf4 is a thylakoid membrane scaffold that holds PSI subunits during assembly. There is no
    evidence that it acts as a chaperone binding unfolded proteins. GO:0051082 is a generic chaperone
    term that was transferred without a specific basis; the review supports photosystem I assembly (GO:0048564)
    instead.
  evidence: ycf4 review (GO:0048564 NEW, thylakoid membrane); UniProt A4GYS2 FUNCTION (HAMAP MF_00437)
- claim_id: POPTR-UNR-08
  category: UNRELATED
  accession: B9N2B0
  gene: LIP1P-2
  organism_dir: POPTR
  aspect: MF
  term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  review_file: genes/POPTR/LIP1P-2/LIP1P-2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Lipoyl synthase is a radical SAM enzyme that consumes two S-adenosyl-L-methionine molecules
    per lipoyl group through its auxiliary [4Fe-4S] clusters, so SAM binding is a correct and mechanistically
    meaningful cofactor/substrate binding term. The review accepts lipoate synthase activity and 4Fe-4S
    cluster binding but did not list SAM binding.
  evidence: LIP1P-2 review description ('radical SAM lipoyl synthase'); HAMAP-curated 4Fe-4S binding
- claim_id: POPTR-UNR-09
  category: UNRELATED
  accession: A4GYW5
  gene: ccsA
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0015886
    label: heme transport
  review_file: genes/POPTR/ccsA/ccsA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: CcsA belongs to the CcsA/ResC (heme exporter protein C, PTHR30071) family with a WWD heme-handling
    domain. In system II cytochrome c biogenesis this protein, with Ccs1/CcsB, carries heme across the
    membrane to the lumenal side for attachment. The term is a family-level homology inference from bacterial
    CcsBA work rather than plastid-specific data, but it is coherent with the accepted heme binding and
    cytochrome complex assembly terms. The review itself raised heme transport as an open question.
  evidence: ccsA review/notes (PANTHER PTHR30071 'heme exporter protein C', suggested question); UniProt
    A4GYW5
- claim_id: POPTR-UNR-10
  category: UNRELATED
  accession: A9PCL4
  gene: PRX2
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0046686
    label: response to cadmium ion
  review_file: genes/POPTR/PRX2/PRX2-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: '''Response to cadmium ion'' is a high-frequency Arabidopsis expression and proteomics term
    attached to many abundant redox enzymes. It says nothing specific about this type II peroxiredoxin.
    The review captures the actual roles as peroxiredoxin activity and cellular oxidant detoxification.'
  evidence: PRX2 review core functions (GO:0051920, GO:0098869)
- claim_id: POPTR-NAR-01
  category: NARROWER
  accession: A0A2K2BF92
  gene: NRAMP6.1
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0015690
    label: aluminum cation transport
  review_file: genes/POPTR/NRAMP6.1/NRAMP6.1-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: Aluminum cation transport is the specific function of rice Nrat1 (OsNRAMP4), a monocot NRAMP
    that imports trivalent Al3+, and is not a general property of the family. PtNRAMP6.1 is uncharacterised
    beyond 'probable divalent metal transporter' (PANTHER SF77), and nothing in the review or UniProt
    suggests Al transport in poplar.
  evidence: NRAMP6.1 review (metal ion transport only); UniProt A0A2K2BF92 FUNCTION/PANTHER
- claim_id: POPTR-NAR-02
  category: NARROWER
  accession: P34105
  gene: MAOX
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0009507
    label: chloroplast
  review_file: genes/POPTR/MAOX/MAOX-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: P34105 is a 591-aa NADP-ME of the cytosolic subfamily (PANTHER SF89 'NADP-dependent malic
    enzyme 1') with UniProt location Cytoplasm and no plastid transit extension. Chloroplast localization
    belongs to the plastidic NADP-ME paralogs (e.g. Arabidopsis NADP-ME4, maize C4 NADP-ME), which the
    orthogroup merges with this one.
  evidence: MAOX review (cytoplasm ACCEPT; open question on cytosolic vs plastidic isoform); UniProt P34105
    SUBCELLULAR LOCATION, length, PANTHER
- claim_id: POPTR-NAR-03
  category: NARROWER
  accession: B9H5L9
  gene: LIP1
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0005759
    label: mitochondrial matrix
  review_file: genes/POPTR/LIP1/LIP1-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Mitochondrial lipoyl synthase acts on the lipoyl domains of matrix enzymes (PDH E2, OGDH
    E2, GDC H-protein), so the mitochondrial matrix is the correct and more precise compartment. It refines
    the accepted mitochondrion term.
  evidence: LIP1 review (mitochondrion ACCEPT; mitochondrial lipoylation)
- claim_id: POPTR-NAR-04
  category: NARROWER
  accession: A4GYX3
  gene: rps15
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0009570
    label: chloroplast stroma
  review_file: genes/POPTR/rps15/rps15-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Plastid-encoded uS15c is a component of the chloroplast 70S ribosome, which is located in
    the stroma. The term correctly refines the accepted chloroplast localization, although a chloroplast
    ribosomal subunit term would be more precise.
  evidence: rps15 review (chloroplast ACCEPT, small ribosomal subunit NEW)
- claim_id: POPTR-NAR-05
  category: NARROWER
  accession: A4GYU7
  gene: rpl14
  organism_dir: POPTR
  aspect: CC
  term:
    id: GO:0005762
    label: mitochondrial large ribosomal subunit
  review_file: genes/POPTR/rpl14/rpl14-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: A4GYU7 is the plastid-encoded uL14c of the chloroplast large subunit. The mitochondrial term
    belongs to the separate mitochondrial uL14m paralog, which the bacterial-type uL14 orthogroup merges
    with it at the Streptophyta level. The review likewise rejects the cytosolic large subunit compartment
    for this protein.
  evidence: rpl14 review (chloroplast ACCEPT; cytosolic LSU MODIFY); UniProt chloroplast-encoded gene
- claim_id: POPTR-NAR-06
  category: NARROWER
  accession: B9N9Y7
  gene: NRAMP1
  organism_dir: POPTR
  aspect: BP
  term:
    id: GO:0034755
    label: iron ion transmembrane transport
  review_file: genes/POPTR/NRAMP1/NRAMP1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: PtNRAMP1 falls in the NRAMP1 subfamily (PANTHER SF54); its Arabidopsis and rice orthologs
    transport Mn2+ and can also carry Fe2+, so iron transmembrane transport is plausible. However, poplar
    NRAMP1 substrate selectivity is uncharacterised, and the review downgraded the related iron homeostasis
    IBA (MARK_AS_OVER_ANNOTATED).
  evidence: NRAMP1 review (iron homeostasis MARK_AS_OVER_ANNOTATED; metal ion transport ACCEPT); UniProt
    B9N9Y7 PANTHER
