claims:
- claim_id: HORSE-UNR-01
  category: UNRELATED
  accession: A0A9L0TJE1
  gene: MYL10
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0006936
    label: muscle contraction
  review_file: genes/HORSE/MYL10/MYL10-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: MYL10 is the precursor-lymphocyte regulatory light chain (PLRLC) with no demonstrated sarcomeric
    role; 'muscle contraction' reflects the cardiac/skeletal RLC paralogs (MYL2/MYLPF) or invertebrate
    Mlc2 in the same OG. The horse review supports only calcium binding and cytoplasm/mitochondrion.
  evidence: MYL10-ai-review.yaml; MYL10-notes.md (PLRLC, B-cell expression); human MYL10 GOA has no muscle
    term
- claim_id: HORSE-UNR-02
  category: UNRELATED
  accession: A0A9L0TTC1
  gene: GPAM
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0001817
    label: regulation of cytokine production
  review_file: genes/HORSE/GPAM/GPAM-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: GPAT1 is a mitochondrial outer-membrane acyltransferase in glycerolipid synthesis; altered
    cytokine output comes from Gpam-knockout T-cell phenotypes, an indirect consequence of lipid composition
    rather than a regulatory process the enzyme performs.
  evidence: GPAM-ai-review.yaml description/core function; human GPAM GOA lacks the term (rodent phenotype
    origin)
- claim_id: HORSE-UNR-03
  category: UNRELATED
  accession: A0A9L0RWM8
  gene: PEA15
  organism_dir: HORSE
  aspect: CC
  term:
    id: GO:0005875
    label: microtubule associated complex
  review_file: genes/HORSE/PEA15/PEA15-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Source is a 1996 human NAS annotation based on a mouse astrocyte paper describing PEA-15
    as microtubule-associated; the human review left it UNDECIDED. PEA15 is a cytoplasmic ERK/FADD-binding
    regulator and there is no evidence it is a component of a microtubule-associated complex, but it cannot
    be refuted.
  evidence: human PEA15-goa.tsv (NAS PMID:8662970); genes/human/PEA15 review UNDECIDED; horse PEA15 review
- claim_id: HORSE-UNR-04
  category: UNRELATED
  accession: F6Z587
  gene: HSPD1
  organism_dir: HORSE
  aspect: CC
  term:
    id: GO:0043209
    label: myelin sheath
  review_file: genes/HORSE/HSPD1/HSPD1-ai-review.yaml
  assessment: REP
  error_type: FREQUENCY_BIAS
  rationale: Hsp60 is a mitochondrial matrix chaperonin; 'myelin sheath' derives from rodent myelin-fraction
    proteomics that capture many abundant mitochondrial proteins, so it is a recurrent proteomics location
    rather than a specific property of Hsp60.
  evidence: HSPD1-ai-review.yaml (mitochondrial matrix accepted); GO:0043209 definition; not in human
    HSPD1 GOA
- claim_id: HORSE-UNR-05
  category: UNRELATED
  accession: F6T000
  gene: CH25H
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0051607
    label: defense response to virus
  review_file: genes/HORSE/CH25H/CH25H-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: 25-hydroxycholesterol produced by CH25H is an established interferon-induced antiviral effector
    in human and mouse, and the horse review already keeps the related virus-fusion inhibition and type
    I interferon response terms. The horse enzyme retains the catalytic diiron family architecture, so
    the conserved mammalian function plausibly holds.
  evidence: CH25H-ai-review.yaml description ('defense against enveloped viruses'), GO:1903914 KEEP_AS_NON_CORE
- claim_id: HORSE-UNR-06
  category: UNRELATED
  accession: A0A3Q2H1L9
  gene: VAPA
  organism_dir: HORSE
  aspect: MF
  term:
    id: GO:0033149
    label: FFAT motif binding
  review_file: genes/HORSE/VAPA/VAPA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: FFAT motif recognition by the MSP domain is the defining molecular activity of VAPA (human
    IDA/IMP), and the horse review states the MSP domain is retained. Correct and more informative than
    the review's protein-membrane adaptor core function.
  evidence: VAPA-ai-review.yaml description; human VAPA GOA IDA PMID:33124732, IMP PMID:18713837
- claim_id: HORSE-UNR-07
  category: UNRELATED
  accession: A0A9L0R9P8
  gene: OMA1
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0006006
    label: glucose metabolic process
  review_file: genes/HORSE/OMA1/OMA1-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: OMA1 is a mitochondrial stress-activated protease (OPA1/DELE1 processing); glucose metabolic
    process is transferred from mouse Oma1-knockout metabolic phenotypes (obesity, altered energy metabolism),
    an indirect systemic effect, not participation in glucose chemistry.
  evidence: OMA1-ai-review.yaml core functions; human OMA1 GOA ISS/IEA from mouse Q9D8H7, human review
    KEEP_AS_NON_CORE with indirect-effect reason
- claim_id: HORSE-UNR-08
  category: UNRELATED
  accession: A0A9L0T7K6
  gene: USP8
  organism_dir: HORSE
  aspect: MF
  term:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  review_file: genes/HORSE/USP8/USP8-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: USP8 is a cysteine-type deubiquitinase cleaving isopeptide bonds; the endopeptidase term
    (hydrolysis of internal alpha-peptide bonds) stems from a legacy 2003 human TAS annotation that the
    human review marks MODIFY to GO:0004843, which is not a descendant of endopeptidase activity.
  evidence: USP8-ai-review.yaml (GO:0004843 core); human USP8 GOA TAS PMID:9827704 and human review MODIFY;
    GO:0004197 vs GO:0004843 parents in go-basic
- claim_id: HORSE-UNR-09
  category: UNRELATED
  accession: A0A9L0R5P7
  gene: GEMIN5
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  review_file: genes/HORSE/GEMIN5/GEMIN5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Spliceosomal snRNP assembly via the SMN complex is the canonical, conserved function of mammalian
    GEMIN5 (snRNA recognition by its WD40 propellers). The horse model's internal deletion (human 723-798)
    is a caveat that may be a gene-model artefact, but there is no evidence of horse-specific loss.
  evidence: GEMIN5-ai-review.yaml description and notes (deletion, PMID:27881600, PMID:11714716)
- claim_id: HORSE-UNR-10
  category: UNRELATED
  accession: A0A9L0SHX8
  gene: MAP2K2
  organism_dir: HORSE
  aspect: MF
  term:
    id: GO:0097110
    label: scaffold protein binding
  review_file: genes/HORSE/MAP2K2/MAP2K2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: MEK2 binds the KSR1 scaffold (and DLG1) in human IPI annotations, a conserved feature of
    RAF-MEK-ERK scaffolding; plausibly conserved in horse MAP2K2. A binding term, but informative about
    its signaling mechanism.
  evidence: human MAP2K2 GOA IPI PMID:10409742 (KSR1), PMID:21615688; horse MAP2K2 review core MAPKK activity
- claim_id: HORSE-UNR-11
  category: UNRELATED
  accession: A0A9L0T1D1
  gene: CXCR3
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  review_file: genes/HORSE/CXCR3/CXCR3-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: CXCR3 effects on proliferation are isoform- and cell-type-dependent (CXCR3-A pro-proliferative,
    CXCR3-B angiostatic/anti-proliferative), and the term is absent from human CXCR3 GOA. Which horse
    isoform is represented, and in what context, cannot be resolved.
  evidence: CXCR3-ai-review.yaml description (isoform-differential growth responses); human CXCR3 GOA
- claim_id: HORSE-UNR-12
  category: UNRELATED
  accession: F6TY09
  gene: WEE1
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0007143
    label: female meiotic nuclear division
  review_file: genes/HORSE/WEE1/WEE1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: Horse WEE1 matches somatic WEE1A; mammalian oocyte meiotic control is attributed mainly to
    the WEE2 paralog, and the term likely transfers from invertebrate orthologs/Wee1-like kinases. The
    horse notes judge redundancy not excluded, so the claim is unresolved rather than refuted.
  evidence: WEE1-ai-review.yaml description; WEE1-notes.md (PMID:21454751, PMID:37527245, meiotic claims
    UNC)
- claim_id: HORSE-NAR-01
  category: NARROWER
  accession: A0A9L0SB67
  gene: DARS2
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0006422
    label: aspartyl-tRNA aminoacylation
  review_file: genes/HORSE/DARS2/DARS2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: DARS2 is the mitochondrial aspartate-tRNA ligase, so aspartyl-tRNA aminoacylation is correct
    and more specific than the accepted tRNA aminoacylation term (mitochondrial aspartyl-tRNA aminoacylation
    would be still more precise).
  evidence: DARS2-ai-review.yaml description; GO:0006418 ACCEPT
- claim_id: HORSE-NAR-02
  category: NARROWER
  accession: A0A9L0TSN4
  gene: BCAT2
  organism_dir: HORSE
  aspect: BP
  term:
    id: GO:0006550
    label: L-isoleucine catabolic process
  review_file: genes/HORSE/BCAT2/BCAT2-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: BCAT2 catalyses the first transamination step of leucine, isoleucine and valine catabolism;
    the horse protein conserves the catalytic architecture, so L-isoleucine catabolism is a correct refinement
    of the accepted branched-chain amino acid catabolic process.
  evidence: BCAT2-ai-review.yaml description; GO:0009083 ACCEPT
- claim_id: HORSE-NAR-03
  category: NARROWER
  accession: F6TY09
  gene: WEE1
  organism_dir: HORSE
  aspect: CC
  term:
    id: GO:0005730
    label: nucleolus
  review_file: genes/HORSE/WEE1/WEE1-ai-review.yaml
  assessment: UNC
  error_type: null
  rationale: WEE1 is nuclear, but a specific nucleolar pool rests on human HPA-derived data; the horse
    review left the IEA nucleolus row UNDECIDED pending imaging.
  evidence: WEE1-ai-review.yaml GO:0005730 UNDECIDED reason
- claim_id: HORSE-NAR-04
  category: NARROWER
  accession: A0A9L0R5P7
  gene: GEMIN5
  organism_dir: HORSE
  aspect: CC
  term:
    id: GO:0032797
    label: SMN complex
  review_file: genes/HORSE/GEMIN5/GEMIN5-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: GEMIN5 was identified as a core component of the SMN complex and colocalizes with SMN in
    gems; the C-terminal interaction regions are retained in the horse model, so SMN complex membership
    is a well-supported conserved mammalian assignment.
  evidence: GEMIN5-ai-review.yaml (PMID:11714716 SMN complex component; retained C-terminal regions);
    GO:0032797 definition
