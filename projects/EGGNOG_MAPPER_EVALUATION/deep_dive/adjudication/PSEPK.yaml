claims:
- claim_id: PSEPK-UNR-01
  category: UNRELATED
  accession: Q88FB9
  gene: htpG
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006974
    label: DNA damage response
  review_file: genes/PSEPK/htpG/htpG-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: HtpG is a constitutive Hsp90-family holdase/foldase chaperone; nothing places it in a DNA-damage-sensing
    or SOS pathway. The term most likely derives from a stress/expression or mutant-phenotype annotation
    on an enterobacterial ortholog (e.g. E. coli HtpG) and does not describe a direct function.
  evidence: htpG review description/core functions; GO:0006974 definition
- claim_id: PSEPK-UNR-02
  category: UNRELATED
  accession: Q88LZ4
  gene: rfbC
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006974
    label: DNA damage response
  review_file: genes/PSEPK/rfbC/rfbC-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: RfbC/RmlC is a dTDP-4-dehydrorhamnose 3,5-epimerase in dTDP-L-rhamnose biosynthesis; there
    is no mechanistic link to responding to DNA damage. Likely a screen/expression-derived annotation
    on a gammaproteobacterial ortholog transferred by eggNOG.
  evidence: rfbC review (epimerase, dTDP-rhamnose biosynthesis accepted)
- claim_id: PSEPK-UNR-03
  category: UNRELATED
  accession: Q88CW7
  gene: betB
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006113
    label: fermentation
  review_file: genes/PSEPK/betB/betB-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: BetB is the dedicated betaine-aldehyde dehydrogenase of the betIBA osmoprotection operon
    in aerobic P. putida; fermentation is a property of other aldehyde dehydrogenase family members (e.g.
    ethanol/acetaldehyde ALDHs) pooled in the same broad ALDH orthogroup.
  evidence: 'betB review: GO:0008802 and glycine betaine biosynthesis; operon context'
- claim_id: PSEPK-UNR-04
  category: UNRELATED
  accession: Q88PK7
  gene: iscU
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  review_file: genes/PSEPK/iscU/iscU-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: IscU is the Isc Fe-S scaffold; altered iron homeostasis in iscU mutants (E. coli) is an indirect
    consequence of Fe-S assembly loss and IscR/Fur regulatory feedback, not a function of IscU itself.
    Its process is captured by iron-sulfur cluster assembly.
  evidence: iscU review (GO:0016226 accepted, iron ion binding marked over-annotated)
- claim_id: PSEPK-UNR-05
  category: UNRELATED
  accession: Q88QJ8
  gene: selA
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0016260
    label: L-selenocysteine biosynthetic process
  review_file: genes/PSEPK/selA/selA-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: SelA makes Sec only on tRNA(Sec) (Ser-tRNA(Sec) to Sec-tRNA(Sec)); the review captures this
    precisely as GO:0001717. GO:0016260 (formation of L-selenocysteine) is loosely true but less precise
    and not a parent of the tRNA-borne conversion in GO, so it adds no information.
  evidence: selA review (GO:0001717 ACCEPT, GO:0004125); GO:0016260 vs GO:0001717 in go-basic
- claim_id: PSEPK-UNR-06
  category: UNRELATED
  accession: Q88RC0
  gene: davD
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006540
    label: GABA shunt
  review_file: genes/PSEPK/davD/davD-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: DavD is the glutarate-semialdehyde dehydrogenase of the lysine Dav pathway; GABA shunt belongs
    to the GabD succinate-semialdehyde dehydrogenase paralogs (E. coli/P. aeruginosa GabD) in the same
    ALDH orthogroup. The curator removed the succinate-semialdehyde dehydrogenase MF terms for the same
    reason.
  evidence: 'davD review: SSADH MF terms REMOVED, GABA catabolism UNDECIDED, GO:0102810 ACCEPT'
- claim_id: PSEPK-UNR-07
  category: UNRELATED
  accession: Q88DL7
  gene: rlmH
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0042803
    label: protein homodimerization activity
  review_file: genes/PSEPK/rlmH/rlmH-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: RlmH is a homodimer whose composite active site is assembled across the two subunits (E.
    coli/S. aureus RlmH structures), so homodimerization is mechanistically meaningful and conserved in
    this single-copy SPOUT enzyme.
  evidence: 'rlmH review description; UniProt SUBUNIT: Homodimer (HAMAP MF_00658)'
- claim_id: PSEPK-UNR-08
  category: UNRELATED
  accession: Q88FQ0
  gene: pydA
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  review_file: genes/PSEPK/pydA/pydA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: PydA (PreA-like) carries two 4Fe-4S ferredoxin-type motifs and is described as the iron-sulfur
    flavoprotein subunit of the PydA-PydX dihydropyrimidine dehydrogenase; iron-sulfur cluster binding
    is correct (4Fe-4S binding would be more precise).
  evidence: pydA UniProt (GO:0051536 KW, two 4Fe-4S ferredoxin-type domains); pydA review description
- claim_id: PSEPK-UNR-09
  category: UNRELATED
  accession: Q88CV2
  gene: aroB
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0008270
    label: zinc ion binding
  review_file: genes/PSEPK/aroB/aroB-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: 3-dehydroquinate synthase requires one divalent metal (Zn2+ or Co2+) per subunit; HAMAP MF_00110
    maps conserved Zn2+ ligands in Q88CV2, consistent with E. coli AroB structures.
  evidence: aroB UniProt COFACTOR and Zn(2+) binding-site features; review description
- claim_id: PSEPK-UNR-10
  category: UNRELATED
  accession: Q88JJ2
  gene: pstC
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0010921
    label: regulation of phosphatase activity
  review_file: genes/PSEPK/pstC/pstC-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: 'Derived from the E. coli pst phenotype: loss of Pst derepresses the PhoB regulon (including
    alkaline phosphatase), so Pst signalling to PhoR/PhoU, not PstC permease activity, alters phosphatase
    levels. Moreover this PstC is from the second Pst-like operon (PP_2656-PP_2659) whose signalling role
    is untested.'
  evidence: pstC review description (permease subunit, PP_2656-2659 Pst-like operon); GO:0010921 definition
- claim_id: PSEPK-UNR-11
  category: UNRELATED
  accession: Q88HR9
  gene: paaF
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0042802
    label: identical protein binding
  review_file: genes/PSEPK/paaF/paaF-ai-review.yaml
  assessment: LSP
  error_type: null
  rationale: Crotonase-superfamily enoyl-CoA hydratases such as E. coli PaaF form trimers/hexamers, so
    self-association is plausible, but identical protein binding says nothing about the enoyl-CoA hydratase
    function already accepted in the review.
  evidence: paaF review (GO:0004300 ACCEPT); crotonase family oligomerization
- claim_id: PSEPK-UNR-12
  category: UNRELATED
  accession: Q88FA6
  gene: sdhD
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0006101
    label: citrate metabolic process
  review_file: genes/PSEPK/sdhD/sdhD-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: SdhD is the membrane anchor of succinate dehydrogenase; it does not act on citrate. The term
    is a pathway-level/phenotypic inference (TCA cycle involvement) transferred from an ortholog and is
    not supported by the succinate-to-fumarate chemistry of SdhABCD.
  evidence: sdhD review (TCA cycle, aerobic respiration, heme binding accepted); GO:0006101 definition
- claim_id: PSEPK-UNR-13
  category: UNRELATED
  accession: Q88R95
  gene: ssuD
  organism_dir: PSEPK
  aspect: BP
  term:
    id: GO:0009408
    label: response to heat
  review_file: genes/PSEPK/ssuD/ssuD-ai-review.yaml
  assessment: NPI
  error_type: MULTIPLE_FUNCTIONS
  rationale: SsuD is the FMNH2-dependent alkanesulfonate monooxygenase of the sulfate-starvation ssu operon;
    nothing implicates it in heat response. The term likely stems from an expression/phenotype study on
    an E. coli ortholog.
  evidence: ssuD review description and accepted MF/BP terms
- claim_id: PSEPK-UNR-14
  category: UNRELATED
  accession: Q88QL5
  gene: secY
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0005048
    label: signal sequence binding
  review_file: genes/PSEPK/secY/secY-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Signal sequences bind the SecY lateral gate during translocation initiation (E. coli SecY
    crosslinking and SecYEG-signal peptide structures), and this core channel function is conserved in
    the single KT2440 SecY.
  evidence: secY review description (lateral gate, translocon core); conservation of SecY
- claim_id: PSEPK-NAR-01
  category: NARROWER
  accession: Q88D80
  gene: putA
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0000987
    label: cis-regulatory region sequence-specific DNA binding
  review_file: genes/PSEPK/putA/putA-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: The review accepts transcription cis-regulatory region binding based on direct structural
    and binding experiments with the P. putida PutA N-terminal RHH domain showing sequence-specific binding
    to put control DNA, so the narrower sequence-specific term is supported.
  evidence: putA review GO:0000976 ACCEPT reason; repressor activity accepted
- claim_id: PSEPK-NAR-02
  category: NARROWER
  accession: Q88CN8
  gene: lgt
  organism_dir: PSEPK
  aspect: CC
  term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  review_file: genes/PSEPK/lgt/lgt-ai-review.yaml
  assessment: NPI
  error_type: LOCALIZATION_DEFAULT
  rationale: Lgt is a seven-TM integral inner-membrane enzyme whose active site faces the periplasm (E.
    coli Lgt structures); assigning it to the cytoplasmic leaflet is unsupported and likely a generic
    membrane-side default. Plasma membrane (accepted) is the correct location.
  evidence: lgt UniProt (7 TRANSMEM, cell inner membrane); lgt review plasma membrane ACCEPT
- claim_id: PSEPK-NAR-03
  category: NARROWER
  accession: Q88BX6
  gene: glmU
  organism_dir: PSEPK
  aspect: CC
  term:
    id: GO:0005829
    label: cytosol
  review_file: genes/PSEPK/glmU/glmU-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: GlmU is a soluble cytoplasmic enzyme (E. coli GlmU) with no membrane or secretion features;
    cytosol is a correct, more specific refinement of the accepted cytoplasm.
  evidence: glmU review cytoplasm ACCEPT; soluble bifunctional enzyme
- claim_id: PSEPK-NAR-04
  category: NARROWER
  accession: Q88MV7
  gene: ffh
  organism_dir: PSEPK
  aspect: CC
  term:
    id: GO:0005829
    label: cytosol
  review_file: genes/PSEPK/ffh/ffh-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Ffh binds 4.5S RNA and engages nascent chains on cytosolic ribosomes before docking at membrane
    FtsY; the cytosolic pool is well established in E. coli and fits the accepted cytoplasm and SRP terms.
  evidence: ffh review (cytoplasm, SRP, SRP-dependent targeting accepted)
- claim_id: PSEPK-NAR-05
  category: NARROWER
  accession: Q88DN4
  gene: lnt
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0016410
    label: N-acyltransferase activity
  review_file: genes/PSEPK/lnt/lnt-ai-review.yaml
  assessment: COR
  error_type: null
  rationale: Lnt transfers an acyl chain from a phospholipid to the alpha-amino group of the N-terminal
    diacylglyceryl-cysteine of apolipoproteins, so N-acyltransferase activity is a correct refinement
    of the accepted acyltransferase term.
  evidence: lnt review (GO:0016747 ACCEPT, lipoprotein biosynthesis); Lnt reaction
- claim_id: PSEPK-REJ-01
  category: REJECTED
  accession: Q88KF4
  gene: acnA-II
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003994
    label: aconitate hydratase activity
  review_file: genes/PSEPK/acnA-II/acnA-II-ai-review.yaml
  assessment: PLI
  error_type: PARALOG_OVERANNOTATION
  rationale: PP_2336 is an AcnD-family (IPR012708) 2-methylcitrate dehydratase in the prp/acnD/prpF cluster;
    citrate-isocitrate aconitase activity belongs to AcnA/AcnB paralogs, whose terms were transferred
    via the broad aconitase orthogroup. The curator's removal stands.
  evidence: acnA-II review REMOVE reason; IPR012708; operon context
- claim_id: PSEPK-REJ-02
  category: REJECTED
  accession: Q88DY9
  gene: ilvH
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0003984
    label: acetolactate synthase activity
  review_file: genes/PSEPK/ilvH/ilvH-ai-review.yaml
  assessment: NPI
  error_type: COMPLEX_ACTIVITY_TRANSFER
  rationale: IlvH is the non-catalytic ACT-domain regulatory small subunit; the acetolactate synthase
    chemistry is performed by IlvI, so the catalytic term (E. coli AHAS III complex annotation) is misassigned
    to the accessory subunit. The review's acetolactate synthase regulator activity is the correct MF.
  evidence: ilvH review REMOVE reason; GO:1990610 ACCEPT
- claim_id: PSEPK-REJ-03
  category: REJECTED
  accession: Q88QE6
  gene: ubiX
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0008694
    label: 4-hydroxy-3-polyprenylbenzoate decarboxylase activity
  review_file: genes/PSEPK/ubiX/ubiX-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: UbiX is a flavin prenyltransferase producing prFMN for UbiD, which performs the 4-hydroxy-3-polyprenylbenzoate
    decarboxylation; the term reflects the historical E. coli UbiX misannotation as the decarboxylase.
  evidence: ubiX review REMOVE reason; GO:0106141 ACCEPT
- claim_id: PSEPK-REJ-04
  category: REJECTED
  accession: Q88N51
  gene: sbcB
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  review_file: genes/PSEPK/sbcB/sbcB-ai-review.yaml
  assessment: NPI
  error_type: DOMAIN_ARCHITECTURE_MISMATCH
  rationale: SbcB is Exonuclease I (EC 3.1.11.1), a DnaQ-like ssDNA-specific 3'-5' exonuclease with an
    SSB-interacting C terminus; RNA exonuclease activity belongs to RNase T/D-type DEDDh relatives, not
    ExoI. The removal is correct.
  evidence: sbcB review REMOVE reason; ssDNA 3'-5' exonuclease ACCEPT
- claim_id: PSEPK-REJ-05
  category: REJECTED
  accession: Q88KF2
  gene: prpD
  organism_dir: PSEPK
  aspect: MF
  term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  review_file: genes/PSEPK/prpD/prpD-ai-review.yaml
  assessment: NPI
  error_type: CURATION_MISTAKE
  rationale: Purified PrpD contains no iron-sulfur centre and needs no metal or reductant, unlike aconitase-family
    (AcnD) dehydratases; the 2Fe-2S binding term is directly contradicted, so the removal is upheld.
  evidence: prpD review REMOVE reason (purified PrpD lacks Fe-S)
