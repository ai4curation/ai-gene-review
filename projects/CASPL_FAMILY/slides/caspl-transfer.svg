<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">Transferring function from Arabidopsis to poplar CASPLs</text>

  <!-- tetraspan topology -->
  <text x="24" y="70" font-size="14" font-weight="bold" fill="#0e6b66">A small four-span membrane scaffold</text>
  <rect x="24" y="110" width="300" height="46" fill="#e8f1ee"/>
  <line x1="24" y1="110" x2="324" y2="110" stroke="#8fa39c" stroke-width="2"/>
  <line x1="24" y1="156" x2="324" y2="156" stroke="#8fa39c" stroke-width="2"/>
  <text x="30" y="100" font-size="11" fill="#56655f">apoplast</text>
  <text x="30" y="178" font-size="11" fill="#56655f">cytosol</text>
  <path d="M50,190 C60,190 64,170 70,160 L70,106 C74,86 96,86 100,106 L100,160 C106,180 126,180 130,160 L130,106 C134,86 156,86 160,106 L160,160 C166,180 186,180 190,160 L190,106 C196,94 206,90 214,90"
        fill="none" stroke="#0e6b66" stroke-width="4"/>
  <rect x="64" y="112" width="12" height="42" rx="3" fill="#0e6b66"/>
  <rect x="94" y="112" width="12" height="42" rx="3" fill="#0e6b66"/>
  <rect x="124" y="112" width="12" height="42" rx="3" fill="#0e6b66"/>
  <rect x="154" y="112" width="12" height="42" rx="3" fill="#0e6b66"/>
  <text x="236" y="136" font-size="12" fill="#15201e">no catalytic</text>
  <text x="236" y="150" font-size="12" fill="#15201e">domain</text>

  <!-- characterized Arabidopsis clades -->
  <text x="24" y="224" font-size="14" font-weight="bold" fill="#0e6b66">What is known (Arabidopsis)</text>
  <rect x="24" y="236" width="400" height="56" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="36" y="258" font-size="13" font-weight="bold" fill="#15201e">CASP1–5</text>
  <text x="120" y="258" font-size="12" fill="#15201e">build the Casparian strip; recruit lignin</text>
  <text x="120" y="276" font-size="12" fill="#15201e">polymerization in root endodermis</text>
  <rect x="24" y="300" width="400" height="56" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="36" y="322" font-size="13" font-weight="bold" fill="#15201e">CASPL1B / 1D</text>
  <text x="140" y="322" font-size="12" fill="#15201e">suberized endodermis; bind aquaporin</text>
  <text x="140" y="340" font-size="12" fill="#15201e">PIP2;1 (PMID:30767240)</text>
  <rect x="24" y="364" width="400" height="56" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="36" y="386" font-size="13" font-weight="bold" fill="#15201e">CASPL4C1</text>
  <text x="140" y="386" font-size="12" fill="#15201e">cold-inducible; negative regulator of</text>
  <text x="140" y="404" font-size="12" fill="#15201e">growth and flowering (PMID:26399665)</text>
  <text x="24" y="448" font-size="12" fill="#56655f">Most other CASPL clades have no characterized member.</text>

  <!-- arrow to poplar -->
  <path d="M430,330 L500,330" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="465" y="318" font-size="12" text-anchor="middle" fill="#0e6b66">transfer?</text>

  <!-- evidence funnel -->
  <text x="510" y="70" font-size="14" font-weight="bold" fill="#0e6b66">Tested with sequence and expression data</text>
  <rect x="510" y="86" width="420" height="44" rx="8" fill="#1d8a4b"/>
  <text x="522" y="113" font-size="14" fill="#ffffff"><tspan font-weight="bold">20 / 20</tspan> poplar best Arabidopsis hit in same Roppolo group</text>
  <rect x="510" y="138" width="273" height="44" rx="8" fill="#1d8a4b" opacity="0.8"/>
  <text x="522" y="165" font-size="14" fill="#ffffff"><tspan font-weight="bold">12 / 20</tspan> reciprocal best hits</text>
  <rect x="510" y="190" width="182" height="44" rx="8" fill="#1d8a4b" opacity="0.6"/>
  <text x="522" y="217" font-size="14" fill="#ffffff"><tspan font-weight="bold">8 / 20</tspan> exact code</text>
  <text x="510" y="256" font-size="12" fill="#56655f">So transfer is sound at group level, not as strict 1:1 orthology.</text>

  <rect x="510" y="286" width="420" height="62" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="522" y="310" font-size="13" font-weight="bold" fill="#15201e">Poplar CASPL1B1</text>
  <text x="522" y="330" font-size="12" fill="#15201e">120 TPM in primary root, ~0 elsewhere: fits the endodermis role</text>
  <rect x="510" y="356" width="420" height="62" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="522" y="380" font-size="13" font-weight="bold" fill="#15201e">Poplar CASPL4C1</text>
  <text x="522" y="400" font-size="12" fill="#15201e">drought +3.0, heat +2.1 log2FC; cold-repressed in leaf</text>
  <text x="510" y="448" font-size="12" fill="#56655f">Data: bioinformatics/RESULTS.md and expression/RESULTS.md</text>
</svg>
