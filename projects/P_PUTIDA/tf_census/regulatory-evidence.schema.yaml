$schema: https://json-schema.org/draft/2020-12/schema
title: KT2440 TF regulatory evidence sidecar
description: Experimental regulatory assertions; not GO annotations or inferred iModulon targets.
type: object
additionalProperties: false
required: [regulator, relationships]
properties:
  regulator:
    type: object
    additionalProperties: false
    required: [accession, locus, taxon]
    properties:
      accession: {$ref: '#/$defs/text'}
      locus: {type: string, pattern: '^PP_[0-9]{4,5}$'}
      taxon: {const: 'NCBITaxon:160488'}
  relationships:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, target, effect, directness, experimental_strain, condition, evidence, interpretation, limitations]
      properties:
        id: {$ref: '#/$defs/text'}
        target:
          type: object
          additionalProperties: false
          required: [name, type]
          properties:
            name: {$ref: '#/$defs/text'}
            locus: {type: string, pattern: '^PP_[0-9]{4,5}$'}
            type: {enum: [gene, promoter, operon]}
        effect: {enum: [activates, represses, unknown]}
        directness: {enum: [direct, indirect, unresolved]}
        experimental_strain: {$ref: '#/$defs/text'}
        condition: {$ref: '#/$defs/text'}
        evidence: {$ref: '#/$defs/evidence_list'}
        interpretation: {$ref: '#/$defs/text'}
        limitations:
          type: array
          minItems: 1
          items: {$ref: '#/$defs/text'}
  pathway_context:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, relationship, mechanism, evidence]
      properties:
        name: {$ref: '#/$defs/text'}
        process:
          type: object
          additionalProperties: false
          required: [id, label]
          properties:
            id: {type: string, pattern: '^GO:[0-9]{7}$'}
            label: {$ref: '#/$defs/text'}
        relationship: {const: regulates}
        mechanism: {$ref: '#/$defs/text'}
        evidence: {$ref: '#/$defs/evidence_list'}
$defs:
  text: {type: string, minLength: 1, pattern: '\S'}
  evidence_list:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [reference_id, assay, supporting_text]
      properties:
        reference_id: {type: string, pattern: '^(PMID:[0-9]+|DOI:.+)$'}
        source_url: {type: string, pattern: '^https://'}
        assay: {$ref: '#/$defs/text'}
        supporting_text: {$ref: '#/$defs/text'}
