# Manually selected review-design cases; these are not functional annotations.
cases:
- accession: Q88I42
  name: BenR
  rationale: Case-normalized alias; existing iModulon report exposes membership versus weight-filter distinction.
- accession: Q88DX2
  name: cbrB
  rationale: Existing review names CbrB; proteome metadata describes AlgB. Reconcile identity by accession and locus.
- accession: Q88FJ6
  name: gacA
  rationale: Existing GacA review joins metadata uvrY by accession; assess naming and evidence provenance.
- accession: Q88ET0
  name: fleQ
  rationale: Transcriptional AAA+ regulator; distinguish receiver-like architecture and sigma-factor interaction from sigma-factor identity.
- accession: Q88PZ2
  name: ada
  rationale: Multifunctional enzyme/TF control; enzyme activity does not exclude transcriptional regulation.
- accession: Q88P32
  name: hexR
  rationale: Existing metabolic-regulator review; compare RegPrecise and PRECISE321 source reuse.
- accession: Q88HH7
  name: ptxS
  rationale: Existing review and KT2440 CollecTF evidence lead; binding, targets and effector evidence assessed separately.
- accession: P59479
  name: lexA2
  rationale: Paralog-specific locus resolution and distinct regulon evidence.
- accession: Q88JQ2
  name: PP_2597
  rationale: TetR name without GO/Pfam support in metadata; assess weak name and broad-fold discovery signals.
- accession: Q88DR9
  name: PP_4754
  rationale: TetR domain with broad DNA-binding GO; test annotation coverage without inferring ligand or targets.
- accession: Q88E08
  name: PP_4660
  rationale: LysR architecture and TF GO; no review found at initial accession audit.
- accession: Q88ME8
  name: rpoS
  rationale: Sigma-factor lane; distinguish regulator identity from indirect transcriptional consequences.
- accession: Q88F55
  name: pvdS
  rationale: Alternative sigma-factor lane and published module assignment.
- accession: Q88DD3
  name: hfq
  rationale: Post-transcriptional regulator with broad transcription-related GO; boundary control.
- accession: Q88G93
  name: csrA
  rationale: Nonunique gene symbol; require locus/accession mapping of RNA-regulatory proteins.
- accession: Q88EW2
  name: cheY
  rationale: Receiver-only false-positive control; signaling does not establish transcriptional output.
- accession: Q88EQ8
  name: flgM
  rationale: Anti-sigma accessory control; distinguish sigma-factor regulators from sigma factors.
- accession: Q88GF9
  name: MvaT
  rationale: Nucleoid-associated protein lacking GO in metadata; distinguish architecture from sequence-specific TF evidence.
- accession: Q88QT6
  name: rsmA
  rationale: rRNA methyltransferase symbol-collision control; do not confuse with CsrA/Rsm regulatory proteins.
- accession: P06519
  name: xylR
  rationale: Existing PSEPK review outside the reference metadata; out-of-proteome control, excluded from census denominator.
