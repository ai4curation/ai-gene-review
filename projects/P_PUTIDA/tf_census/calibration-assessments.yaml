- accession: Q88I42
  calibration_name: BenR
  assessment_status: SCOPED_REVIEW_COMPLETE
  identity:
    reference_taxon: NCBITaxon:160488
    locus_tags:
    - PP_3159
    metadata_aliases:
    - benR
    - PP_3159
    in_reference_proteome: true
    join_basis: accession and locus from pinned metadata; no fresh sequence comparison
    existing_review_path: genes/PSEPK/BenR/BenR-ai-review.yaml
    existing_review_taxon: NCBITaxon:160488
    existing_review_validation: not_run
  role_identity:
    role: DNA-binding transcriptional activator
    status: SUPPORTED
    assessment: The accession joins PP_3159/benR to the existing BenR review; capitalization is an alias
      issue. Functional promoter evidence supports the regulatory role.
  targets_and_directness: benABCD expression depends on BenR in the KT2440 lineage. The checked 2008 study
    uses KT2442 derivatives and a chromosomal benA promoter reporter; it is not a purified-BenR binding
    assay. Do not import every BenR iModulon member as a direct target.
  activation_repression: Activation of the ben promoter is supported. Repression of other aromatic pathways
    is not assigned as a direct BenR effect here.
  effector_evidence: Benzoate-dependent activation is supported; direct benzoate binding to the N-terminal
    domain was not verified in the sources inspected.
  evidence_sources:
  - PMID:18156252
  limitations:
  - Primary study uses KT2442, explicitly a rifampin-resistant derivative of KT2440. Direct ligand-binding
    evidence remains unverified.
  go_review_followups:
  - Audit the existing description’s direct benzoate-binding and master-regulator language against biochemical
    evidence.
  - Assess catA-II separately from catA-I; the older iModulon report’s blanket cat-gene interpretation
    must not substitute for promoter evidence.
  importer_assessment:
    status: CHECKED
    identity_status: resolved
    assignment_status: assigned_modules_found
    assigned_modules:
