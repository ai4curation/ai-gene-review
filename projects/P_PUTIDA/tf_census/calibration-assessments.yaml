assessment_version: 1
review_date: '2026-11-05'
scope: Twenty accession-specific calibration assessments, not full GO annotation reviews. No gene review
  YAML edited.
evidence_policy:
  identity: Metadata accession/locus/taxon reconciliation does not prove sequence identity across experimental
    strains.
  claims: Role identity, targets/directness, regulatory sign and effectors are assessed independently.
  limitations: A bounded search failing to find evidence is not evidence of absence; inaccessible full
    text does not justify removing experimental annotations.
  nonindependence: RegPrecise, PRECISE321 prior network and module labels may reuse the same papers; database
    agreement is not an independent evidence count.
  status: SCOPED_REVIEW_COMPLETE means this calibration assessment is written, not that function is fully
    characterized or existing GO review validated.
