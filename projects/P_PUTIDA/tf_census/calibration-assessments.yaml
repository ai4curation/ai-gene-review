    functional evidence verified for PP_2597, PP_4754, PP_4660, or PP_4244 in this bounded search.
additional_identity_note:
  accessions:
  - Q88RL0
  - Q88DT9
  assessment: Outside the twenty selected cases. Census sources and the 2022 PRECISE paper associate Zur
    with PP_0119/Q88RL0 while metadata calls both PP_0119 and PP_4730 fur. The underlying Zur metal-specificity
    experiments were not verified here; retain distinct accessions and a follow-up rather than treating
    database agreement as biochemical proof.
