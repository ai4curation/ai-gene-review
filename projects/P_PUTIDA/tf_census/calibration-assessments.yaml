      module_name: TCA cycle
      weight: 0.0581557715493435
    report: projects/P_PUTIDA/tf_census/imodulon/reports/Q88I42.md
    notes: Source-defined expression membership and regulator assignments only; no direct target, sign,
      ligand or GO inference.
