- accession: Q88DX2
  calibration_name: cbrB
  assessment_status: SCOPED_REVIEW_COMPLETE
  identity:
    reference_taxon: NCBITaxon:160488
    locus_tags:
    - PP_4696
    metadata_aliases:
    - PP_4696
    in_reference_proteome: true
    join_basis: accession and locus from pinned metadata; no fresh sequence comparison
    existing_review_path: genes/PSEPK/cbrB/cbrB-ai-review.yaml
    existing_review_taxon: NCBITaxon:160488
    existing_review_validation: not_run
  role_identity:
    role: Transcriptional response regulator
    status: SUPPORTED
    assessment: PP_4696 is explicitly called cbrB in KT2440 primary literature. Accession Q88DX2 therefore
      reconciles the review CbrB name with the metadata AlgB description; do not transfer alginate targets
      from the metadata name.
  targets_and_directness: CbrB activation of crcZ and crcY has in vivo/in vitro promoter and DNA-binding
    evidence. The 2018 full text also dissects the PP2810-13 promoter. Its genome-wide binding results
    are not interchangeable with functional validation of every edge.
  activation_repression: Positive transcriptional regulation is supported at the examined promoters; phosphorylation
    dependence varies with assay/protein dose.
  effector_evidence: Phosphorylation and carbon-source context regulate activity. No small molecule directly
    bound by CbrB was established here; a CbrA stimulus is not automatically a CbrB ligand.
  evidence_sources:
  - PMID:23692431
  - PMID:30557364
  - PMC:PMC7580535
  limitations:
  - The 2013 cache is abstract-only. The 2018 full text explicitly reports KT2442 wild-type promoter assays
    mapped to the KT2440 reference genome.
  go_review_followups:
  - Retain PP_4696-based CbrB identity and document the AlgB source-name conflict.
  - Preserve KT2442 experimental-strain provenance and assay-specific phosphorylation conclusions in future
    GO review.
  importer_assessment:
    status: CHECKED
    identity_status: resolved
    assignment_status: no_assigned_module
    assigned_modules: []
    gene_memberships: []
    report: projects/P_PUTIDA/tf_census/imodulon/reports/Q88DX2.md
    notes: Source-defined expression membership and regulator assignments only; no direct target, sign,
      ligand or GO inference.
