    existing_review_path: genes/PSEPK/gacA/gacA-ai-review.yaml
    existing_review_taxon: NCBITaxon:160488
    existing_review_validation: not_run
  role_identity:
    role: Transcriptional response regulator
    status: SUPPORTED
    assessment: The KT2440 full text identifies PP_4099 as gacA; uvrY is the metadata alias on the same
      accession, not another protein.
  targets_and_directness: KT2440 studies support Gac-system-dependent adhesin and K1-T6SS expression.
    These perturbation/promoter-expression results do not establish GacA occupancy at those promoters.
    Direct KT2440 GacA DNA targets remain unverified in this pass.
  activation_repression: Positive system-level control of K1-T6SS expression is supported; do not label
    this a demonstrated direct GacA activating edge.
  effector_evidence: A physiological activating signal for GacS/GacA was not established here. The conserved
    response-regulator phosphorelay architecture is a mechanistic inference.
  evidence_sources:
  - PMID:27489550
  - PMID:24488315
  - PMID:36748579
  limitations:
  - Binding-site or purified-GacA assays were not identified in the inspected texts. PMID:24488315 is
    abstract-only locally.
  go_review_followups:
  - Keep system-level expression effects distinct from direct targets.
  - Add primary-paper support to the existing review, whose top-level references currently rely on research/notes
    files.
