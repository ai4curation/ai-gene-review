- accession: Q88PZ2
  calibration_name: ada
  assessment_status: SCOPED_REVIEW_COMPLETE
  identity:
    reference_taxon: NCBITaxon:160488
    locus_tags:
    - PP_0706
    metadata_aliases:
    - ada
    - PP_0706
    in_reference_proteome: true
    join_basis: accession and locus from pinned metadata; no fresh sequence comparison
    existing_review_path: genes/PSEPK/ada/ada-ai-review.yaml
    existing_review_taxon: NCBITaxon:160488
    existing_review_validation: not_run
  role_identity:
    role: Multifunctional DNA-repair enzyme and transcriptional activator
    status: SUPPORTED
    assessment: 'PP_0706 is the Ada fusion: its enzymatic architecture does not justify excluding it from
      the TF queue. The KT2440 study supports an Ada-dependent adaptive transcriptional response.'
  targets_and_directness: The alkA-ada promoter responds to alkylation and Ada; promoter-box perturbations
    support cis-regulatory involvement. Purified KT2440 Ada occupancy was not verified in this pass.
  activation_repression: Positive regulation of the adaptive promoter is supported. The paper distinguishes
    inducible alkA-ada from constitutive alkB.
  effector_evidence: MMS/MNNG are experimental alkylation treatments, not demonstrated reversible Ada
    ligands. Covalent methylation activation is a family-mechanism inference unless separately demonstrated
    for this protein.
  evidence_sources:
  - PMID:24098441
  limitations:
  - Promoter and mutation evidence were inspected; specific residue assignments and direct methyl-transfer
    biochemistry were not independently audited.
  go_review_followups:
  - Add the primary KT2440 paper rather than citing only provider research.
  - Separate species-specific promoter evidence from conserved residue/methylation-mechanism inference.
  importer_assessment:
    status: CHECKED
    identity_status: resolved
    assignment_status: no_assigned_module
    assigned_modules: []
    gene_memberships: []
    report: projects/P_PUTIDA/tf_census/imodulon/reports/Q88PZ2.md
