<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">Module-first review of a whole bacterial proteome</text>
  <!-- step 1 -->
  <g transform="translate(20 70)">
    <rect width="170" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">1 · Proteome</text>
    <text x="85" y="62" text-anchor="middle" font-size="26" font-weight="600" fill="#0e6b66">5,527</text>
    <text x="85" y="82" text-anchor="middle" font-size="12" fill="#56655f">KT2440 proteins</text>
    <text x="85" y="104" text-anchor="middle" font-size="12" fill="#56655f">UniProt metadata only,</text>
    <text x="85" y="120" text-anchor="middle" font-size="12" fill="#56655f">no GOA or stubs yet</text>
  </g>
  <path d="M192 145 L222 145" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- step 2 -->
  <g transform="translate(226 70)">
    <rect width="220" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">2 · Partition into buckets</text>
    <text x="110" y="62" text-anchor="middle" font-size="26" font-weight="600" fill="#0e6b66">161</text>
    <text x="110" y="82" text-anchor="middle" font-size="12" fill="#56655f">KEGG ppu / UniPathway /</text>
    <text x="110" y="98" text-anchor="middle" font-size="12" fill="#56655f">functional-module buckets</text>
    <text x="110" y="122" text-anchor="middle" font-size="11" fill="#56655f">+ 1,149 orphans, 825 unknowns</text>
  </g>
  <path d="M448 145 L478 145" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- step 3 -->
  <g transform="translate(482 70)">
    <rect width="220" height="150" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <text x="110" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">3 · Curated module</text>
    <text x="110" y="54" text-anchor="middle" font-size="12" fill="#15201e">species-neutral steps</text>
    <g transform="translate(20 70)">
      <rect width="50" height="26" rx="5" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
      <path d="M50 13 L64 13" stroke="#8fa39c"/>
      <rect x="64" width="50" height="26" rx="5" fill="#ffffff" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="89" y="18" text-anchor="middle" font-size="13" fill="#bd3a30">?</text>
      <path d="M114 13 L128 13" stroke="#8fa39c"/>
      <rect x="128" width="50" height="26" rx="5" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
    </g>
    <text x="110" y="124" text-anchor="middle" font-size="12" fill="#56655f">which steps can KT2440</text>
    <text x="110" y="140" text-anchor="middle" font-size="12" fill="#56655f">satisfy, and with which gene?</text>
  </g>
  <path d="M704 145 L734 145" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- step 4 -->
  <g transform="translate(738 70)">
    <rect width="200" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">4 · Review only</text>
    <text x="100" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">what the step needs</text>
    <text x="100" y="74" text-anchor="middle" font-size="12" fill="#56655f">fetch-gene + research</text>
    <text x="100" y="92" text-anchor="middle" font-size="12" fill="#56655f">for missing, ambiguous or</text>
    <text x="100" y="108" text-anchor="middle" font-size="12" fill="#56655f">over-propagated steps</text>
  </g>
  <!-- outputs -->
  <path d="M838 222 L838 290" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(40 296)">
    <rect width="880" height="180" rx="12" fill="#f4f7f6" stroke="#8fa39c"/>
    <text x="24" y="32" font-size="15" font-weight="600" fill="#15201e">Outputs per batch (one PR each)</text>
    <g transform="translate(24 52)">
      <rect width="250" height="100" rx="8" fill="#ffffff" stroke="#8fa39c"/>
      <text x="125" y="36" text-anchor="middle" font-size="28" font-weight="600" fill="#0e6b66">144</text>
      <text x="125" y="62" text-anchor="middle" font-size="13" fill="#56655f">batch pages in</text>
      <text x="125" y="80" text-anchor="middle" font-size="13" fill="#56655f">P_PUTIDA/batches/</text>
    </g>
    <g transform="translate(300 52)">
      <rect width="250" height="100" rx="8" fill="#ffffff" stroke="#8fa39c"/>
      <text x="125" y="36" text-anchor="middle" font-size="28" font-weight="600" fill="#0e6b66">955</text>
      <text x="125" y="62" text-anchor="middle" font-size="13" fill="#56655f">PSEPK gene reviews</text>
      <text x="125" y="80" text-anchor="middle" font-size="13" fill="#56655f">5,533 annotation rows</text>
    </g>
    <g transform="translate(576 52)">
      <rect width="280" height="100" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="5 4"/>
      <text x="140" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#bd3a30">holes kept as holes</text>
      <text x="140" y="58" text-anchor="middle" font-size="12" fill="#56655f">an unresolved step is recorded,</text>
      <text x="140" y="76" text-anchor="middle" font-size="12" fill="#56655f">not filled with the nearest paralog</text>
    </g>
  </g>
</svg>
