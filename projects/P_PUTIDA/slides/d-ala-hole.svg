<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">Worked example: D-amino-acid supply for the cell wall (KEGG ppu00470)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#56655f">21 KEGG members; 6 selected for review; three module parts</text>
  <!-- cytoplasm -->
  <rect x="30" y="80" width="900" height="300" rx="16" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="46" y="102" font-size="13" fill="#56655f">cytoplasm</text>
  <!-- part 1 -->
  <text x="100" y="150" font-size="14" fill="#15201e">L-Glu</text>
  <path d="M142 145 L232 145" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="240" y="150" font-size="14" fill="#15201e">D-Glu</text>
  <rect x="150" y="160" width="76" height="28" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="188" y="179" text-anchor="middle" font-size="13" fill="#1d8a4b" font-weight="600">murI</text>
  <text x="188" y="206" text-anchor="middle" font-size="11" fill="#56655f">step covered</text>
  <path d="M290 145 L320 145" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="330" y="150" font-size="12" fill="#56655f">to MurD (peptidoglycan module)</text>
  <!-- part 2 -->
  <text x="100" y="270" font-size="14" fill="#15201e">L-Ala</text>
  <path d="M142 265 L232 265" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="240" y="270" font-size="14" fill="#15201e">D-Ala</text>
  <rect x="150" y="280" width="76" height="28" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="188" y="299" text-anchor="middle" font-size="13" fill="#bd3a30" font-weight="600">dadX ?</text>
  <text x="188" y="326" text-anchor="middle" font-size="11" fill="#bd3a30">candidate_uncertain</text>
  <text x="188" y="342" text-anchor="middle" font-size="11" fill="#56655f">alanine-specific, but cell-wall</text>
  <text x="188" y="356" text-anchor="middle" font-size="11" fill="#56655f">role never tested</text>
  <!-- part 3 -->
  <path d="M290 262 Q 360 262 420 225" fill="none" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="426" y="222" font-size="14" fill="#15201e">D-Ala-D-Ala</text>
  <g transform="translate(560 190)">
    <text x="0" y="0" font-size="12" fill="#56655f">three ligase paralogs, treated as variants:</text>
    <rect y="12" width="80" height="28" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="40" y="31" text-anchor="middle" font-size="13" fill="#1d8a4b" font-weight="600">ddlA</text>
    <rect x="92" y="12" width="80" height="28" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="132" y="31" text-anchor="middle" font-size="13" fill="#1d8a4b" font-weight="600">ddlB</text>
    <rect x="184" y="12" width="80" height="28" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="224" y="31" text-anchor="middle" font-size="13" fill="#1d8a4b" font-weight="600">ddl</text>
    <text x="0" y="62" font-size="11" fill="#56655f">DdlA-like / DdlB-like PANTHER subfamilies; relative</text>
    <text x="0" y="77" font-size="11" fill="#56655f">deployment among the three unresolved</text>
  </g>
  <path d="M520 218 L560 218" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- periplasm -->
  <rect x="30" y="400" width="900" height="100" rx="16" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="6 4"/>
  <text x="46" y="422" font-size="13" fill="#56655f">periplasm</text>
  <rect x="150" y="436" width="76" height="28" rx="6" fill="#ffffff" stroke="#56655f" stroke-width="2"/>
  <text x="188" y="455" text-anchor="middle" font-size="13" fill="#56655f" font-weight="600">alr</text>
  <text x="250" y="448" font-size="12" fill="#15201e">Q88GJ9: broad-spectrum racemase with a signal peptide, prefers lysine/arginine;</text>
  <text x="250" y="466" font-size="12" fill="#15201e">deletion did not change peptidoglycan. Excluded from the cytoplasmic D-Ala step.</text>
  <path d="M188 434 L188 364" stroke="#bd3a30" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="196" y="394" font-size="16" fill="#bd3a30">✕</text>
</svg>
