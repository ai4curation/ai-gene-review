    lifespan, which the review adds as NEW.
  sources:
  - Alliance_Automated
- gene: abu-1
  text: Neither text mentions the CED-1-dependent role in defense against Salmonella that the review adds
    as NEW.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: acr-18
  text: No source mentions the established role of ACR-18 in backward command interneurons for male mating
    reversal behaviour.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- gene: acs-1
  text: The automated text names epithelial cell apical/basal polarity, which the review does not mention
    or evaluate.
  sources:
  - Alliance_Automated
- gene: acs-1
  text: Neither source mentions the established requirement for C15ISO/C17ISO monomethyl branched-chain
    fatty acid synthesis.
  sources:
  - UniProt
  - Alliance_Automated
- gene: aldo-1
  text: No source mentions compensatory glycolysis in complex I mutants or the HIF-1 hypoxia program covered
    in the review.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: asd-1
  text: Neither text names SUP-12 as the cooperating partner in egl-15 exon selection or the neuronal
    unc-32 target.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: atg-2
  text: No source names EPG-6 (WIPI3/4), the direct ATG-2 binding partner described in the review.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: bbs-1
  text: WormBase reports increased insulin, biogenic amine and neuropeptide secretion via AEX-6 and a
    fat storage role; the review does not mention these.
  sources:
  - Alliance_Imported
- gene: bbs-2
  text: WormBase's GCY-35/GCY-36 cGMP suppression of non-ciliary BBS phenotypes is not in the review.
  sources:
  - Alliance_Imported
- gene: bbs-5
  text: WormBase's increased insulin and neuropeptide secretion phenotype (AEX-6-dependent) is not mentioned
    in the review.
  sources:
  - Alliance_Imported
- gene: bbs-7
  text: WormBase's cGMP (GCY-35/GCY-36) suppression of body size and roaming phenotypes is not in the
    review.
  sources:
  - Alliance_Imported
- gene: bbs-8
  text: WormBase's increased insulin and neuropeptide secretion phenotype is not covered in the review.
  sources:
  - Alliance_Imported
- gene: bbs-9
  text: WormBase's increased insulin, DAF-7 and FLP-21 secretion phenotype is not mentioned in the review.
  sources:
  - Alliance_Imported
- gene: cct-1
  text: WormBase says CCT-1 represses SKN-1-dependent gst-4 transcription. The review does not mention
    gst-4 or SKN-1.
  sources:
  - Alliance_Imported
- gene: cct-2
  text: None of the sources mention the oocyte RNP condensate phenotype or the lifespan and polyQ effects
    of cct-2 overexpression that the review describes.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: cct-4
  text: None of the sources mention the germline nuclear CCT-4 that binds HIM-3/HTP-1/HTP-3 and whose
    P382S allele suppresses HORMAD axis defects.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: cct-8
  text: None of the sources mention the review's finding that CCT-8 limits TRiC assembly and that its
    overexpression suppresses polyQ/Htt aggregation and extends lifespan.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
