discrepancy:
- gene: C28G1.2
  text: 'The only annotation (extracellular region) is removed in the review: the protein lacks a signal
    peptide and its paralogs are intracellular serpins.'
  sources:
  - Alliance_Automated
- gene: F44E5.4
  text: Current automated text places the protein in the ER lumen, while the review describes a cytosolic
    HSP70 lacking ER targeting signals.
  sources:
  - Alliance_Automated
- gene: P91866
  text: Acyltransferase activity is removed in the review because the fragment lacks the ketoacyl synthase
    active site.
  sources:
  - Alliance_Automated
- gene: acs-1
  text: UniProt's adipocyte differentiation role is a mammalian carry-over with no worm counterpart.
  sources:
  - UniProt
- gene: akt-2
  text: WormBase says akt-2 inactivation causes constitutive dauer arrest; the review says single mutants
    have mild phenotypes and dauer arrest requires akt-1; akt-2 double loss.
  sources:
  - Alliance_Imported
- gene: anc-1
  text: The automated kinesin binding claim is marked over-annotated in the review.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: apa-2
  text: The automated GTPase activating protein binding term is removed in the review because the partner
    RME-6 is a GEF.
  sources:
  - Alliance_Automated
- gene: asna-1
  text: WormBase calls ASNA-1 a putative membrane transporter; the review describes a cytosolic GET3 ATPase
    targeting tail-anchored proteins to the ER.
  sources:
  - Alliance_Imported
- gene: atg-13
  text: The automated piecemeal microautophagy of the nucleus term is marked over-annotated in the review
    (a yeast-specific process).
  sources:
  - Alliance_Automated
  - RefSeq
- gene: atg-16.2
  text: WormBase states atg-16.2 has no obvious function; the review documents its role specifying LGG-1
    puncta sites and in embryonic aggrephagy.
  sources:
  - Alliance_Imported
  - UniProt
- gene: atg-2
  text: WormBase says atg-2 has no obvious RNAi phenotype; the review describes autophagosome formation
    and aggregate clearance defects in mutants.
  sources:
  - Alliance_Imported
  - UniProt
- gene: atg-3
  text: WormBase says no obvious phenotype; the review describes ATG-3 as essential for autophagosome
    biogenesis and aggregate clearance in embryos.
  sources:
  - Alliance_Imported
- gene: atg-5
  text: WormBase says atg-5 has no obvious function; the review describes loss of LGG-1 lipidation and
    puncta in atg-5 mutants.
  sources:
  - Alliance_Imported
- gene: bbs-1
  text: The automated patched binding and smoothened binding terms are removed in the review.
  sources:
  - Alliance_Automated
- gene: bir-1
  text: The automated egg-laying behavior and inductive cell migration processes are marked over-annotated
    in the review.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: car-1
  text: UniProt and the automated text present CAR-1 as a promoter-binding transcriptional regulator;
    the review treats CAR-1 as an LSM14 mRNA-binding protein and holds the DNA-binding annotation UNDECIDED.
  sources:
  - UniProt
  - Alliance_Automated
  - RefSeq
- gene: cat-1
  text: 'The automated dopamine:sodium and serotonin:sodium:chloride symporter terms are modified in the
    review: VMAT is a proton antiporter.'
  sources:
  - Alliance_Automated
  - RefSeq
- gene: ccep-290
  text: The automated chromatin binding term is removed in the review.
  sources:
  - Alliance_Automated
- gene: cdc-14
  text: The automated text names cytoskeleton-dependent cytokinesis and mitotic spindle midzone assembly.
    The review states cdc-14 null alleles are viable and fertile with no cytokinesis defect.
  sources:
  - Alliance_Automated
- gene: ced-4
  text: WormBase calls CED-4 a novel protein. The review and the automated text describe the Apaf-1-like
    apoptosome adaptor that activates CED-3.
  sources:
  - Alliance_Imported
- gene: ced-9
  text: The automated text lists actin filament depolymerization as a process. The review MODIFIES that
    row to positive regulation of synapse pruning.
  sources:
  - Alliance_Automated
- gene: cgt-1
  text: WormBase says cgt-1 single mutants show no obvious defects. The review reports reduced brood size
    and oocyte and embryonic cytokinesis defects in cgt-1 alone.
  sources:
  - Alliance_Imported
- gene: che-13
  text: UniProt describes transport 'in the motile cilium'. The review and the other sources place CHE-13
    in non-motile sensory cilia.
  sources:
  - UniProt
- gene: clec-67
  text: The automated text gives protein folding chaperone activity, which the review removes, and PERK-mediated
    UPR, which the review marks as over-annotated. Neither text mentions the immune role.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: clk-1
  text: The automated text omits the core ubiquinone-biosynthetic hydroxylase activity and foregrounds
    the debated nuclear transcriptional role.
  sources:
  - Alliance_Automated
- gene: daf-11
  text: RefSeq gives peptide receptor activity. The review argues DAF-11 has no known peptide ligand and
    rejects the IBA.
  sources:
  - RefSeq
- gene: daf-18
  text: The automated text names protein tyrosine phosphatase activity and not the PIP3 3-phosphatase
    activity that the review treats as the core function.
  sources:
  - Alliance_Automated
- gene: dcar-1
  text: The automated text gives neuropeptide receptor activity. The review removes it because the characterized
    ligands are HPLA and DHCA, not peptides.
  sources:
  - Alliance_Automated
- gene: dct-1
  text: UniProt and WormBase present DCT-1 as an apoptosis initiator. The review says a physiological
    apoptotic role in C. elegans has not been shown and that the protein acts mainly as a mitophagy receptor.
  sources:
  - UniProt
  - Alliance_Imported
- gene: ddb-1
  text: The automated text gives nucleic acid binding activity, which the review removes.
  sources:
  - Alliance_Automated
- gene: dpm-1
  text: All descriptions attribute Dol-P-Man synthase activity to U4PF58, a 51-residue fragment lacking
    the glycosyltransferase domain; the review REMOVEs the activity annotation and assigns it to Q9TYJ7.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- gene: dve-1
  text: WormBase omits the mitochondrial unfolded protein response, which UniProt, the automated text
    and the review treat as the core function.
  sources:
  - Alliance_Imported
  - UniProt
- gene: dyf-2
  text: WormBase and the automated text assign DYF-2 to IFT complex B; UniProt and the review identify
    it as the IFT-A subunit WDR19/IFT144 and mark the IFT-B annotation as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - UniProt
- gene: eat-4
  text: The automated text lists glutamate:sodium symporter activity; the review REMOVEs it because EAT-4/VGLUT
    is driven by the vesicular proton gradient.
  sources:
  - Alliance_Automated
- gene: egl-1
  text: The automated text describes EGL-1 through actin depolymerization and antibacterial defense and
    never mentions apoptosis, its defining role.
  sources:
  - Alliance_Automated
- gene: elo-6
  text: WormBase says ELO-6 may be required for a normal growth rate; the review states that elo-6 knockdown
    causes no obvious growth or developmental defect.
  sources:
  - Alliance_Imported
- gene: epg-5
  text: The automated text describes EPG-5 as a negative regulator of autophagosome assembly; the review
    MODIFYs that term and places EPG-5 in autophagosome-lysosome fusion as a RAB-7 effector.
  sources:
  - Alliance_Automated
- gene: fath-1
  text: UniProt's FUNCTION text describes myelin, epidermal barrier, sebaceous gland and hair follicle
    roles that cannot apply to C. elegans; the review cites the worm growth defect rescued by (R)-2-hydroxy
    palmitate.
  sources:
  - UniProt
- gene: fis-1
  text: The automated text and UniProt's by-similarity sentences imply a mitochondrial fission role, whereas
    WormBase and the review report that worm fis-1 is dispensable for fission and acts downstream of it.
  sources:
  - Alliance_Automated
  - UniProt
  - Alliance_Imported
- gene: fshr-1
  text: WormBase covers only the synaptic role and the automated text covers only immunity. The UniProt
    entry (unreviewed) has no FUNCTION text.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: gcy-8
  text: WormBase states GCY-18 is the primary AFD guanylyl cyclase; the gcy-8 review calls GCY-8 the principal
    individual AFD cyclase for thermotaxis, and the gcy-18 review restricts GCY-18's primacy to higher
    cultivation temperatures.
  sources:
  - Alliance_Imported
- gene: gpa-12
  text: Both automated texts lead with D5 dopamine receptor binding, which the review removes as an unsupported
    orthology transfer.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: gpr-2
  text: WormBase describes the GoLoco motif as characteristic of guanine nucleotide exchange factors;
    the review and automated text give GDP-dissociation inhibitor activity.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: gst-44
  text: WormBase says gst-44 has no obvious function; the review cites arsenite and arsenate sensitivity
    of deletion and RNAi animals.
  sources:
  - Alliance_Imported
- gene: gsto-1
  text: UniProt and the automated text assert methylarsonate reductase activity, which the review marks
    UNDECIDED for lack of worm evidence.
  sources:
  - UniProt
  - Alliance_Automated
- gene: hlh-30
  text: WormBase presents hlh-30 as an MITF ortholog with a metabolism role; UniProt and the review describe
    a TFEB ortholog driving autophagy, lysosome biogenesis and longevity.
  sources:
  - Alliance_Imported
  - UniProt
- gene: hrde-1
  text: The automated text gives RNA endonuclease activity, which the review removes because HRDE-1 lacks
    slicer catalytic residues.
  sources:
  - Alliance_Automated
- gene: hsp-12.3
  text: The automated text gives protein refolding, which the review removes because HSP-12.3 has no chaperone
    activity in vitro, as WormBase also says.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: hsp-12.6
  text: The automated text gives protein refolding and response to heat; WormBase and the review say HSP-12.6
    is not a chaperone in vitro and not stress-induced.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: hsp-70
  text: The automated text places HSP-70 in the chaperonin-containing T-complex, which the review marks
    as over-annotated.
  sources:
  - Alliance_Automated
- gene: ift-20
  text: WormBase says ift-20 has no obvious RNAi function; the review cites null mutants with vestigial
    axonemes and dye-filling, osmotic avoidance and mating defects.
  sources:
  - Alliance_Imported
- gene: ift-20
  text: UniProt places IFT-20 in the motile cilium; C. elegans IFT-20 acts in non-motile sensory cilia.
  sources:
  - UniProt
  - Alliance_Automated
- gene: ift-81
  text: UniProt says IFT-81 is required for SHH signaling and sperm flagellum elongation; C. elegans has
    no Hedgehog-cilia signaling or flagellated sperm, and the review does not include these.
  sources:
  - UniProt
- gene: lgg-1
  text: The automated text leads with predicted GABA receptor binding; the review removes that annotation
    as having no support in C. elegans.
  sources:
  - Alliance_Automated
- gene: lgg-2
  text: WormBase says lgg-2 has no obvious function. UniProt and the review describe a downstream role
    in autophagosome maturation through VPS-39/HOPS.
  sources:
  - Alliance_Imported
  - UniProt
- gene: lgg-2
  text: WormBase says lgg-2 "is not required for either dauer formation or extended lifespan"; UniProt
    says it is "Essential for dauer development and life-span extension" (PubMed:20523114). The two curated
    texts contradict each other directly.
  sources:
  - Alliance_Imported
  - UniProt
- gene: lin-65
  text: WormBase calls LIN-65 an unfamiliar protein without known function; the review describes it as
    the MET-2 H3K9 methyltransferase cofactor (ATF7IP analog).
  sources:
  - Alliance_Imported
- gene: lon-2
  text: WormBase suggests LON-2 binds DBL-1 directly; the review says direct LON-2/DBL-1 binding was not
    detected and the link is through SMOC-1.
  sources:
  - Alliance_Imported
- gene: lrx-1
  text: WormBase asserts four class A LDL receptor domains and the automated texts imply CD320 orthology;
    the review's analysis finds no canonical LDL-A domains and calls LRX-1 not an LRP family member.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: lys-1
  text: WormBase states LYS-1 expression is not promoted by DAF-16; the review describes lys-1 as a DAF-16/FOXO
    target (PMID from an RNAi screen of DAF-16 targets).
  sources:
  - Alliance_Imported
- gene: lys-7
  text: WormBase states LYS-7 hydrolyzes peptidoglycan by homology; the review says it lacks conserved
    catalytic residues and marks lysozyme activity as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: mec-14
  text: WormBase and the automated text relate MEC-14 to Shaker/Kv beta subunits (KCNAB1); the review
    says it belongs to an L-galactose dehydrogenase-like AKR family that has no vertebrate member.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: meg-3
  text: WormBase says MEG-3 affects hypodermal development and is expressed in all somatic cells; the
    review describes it as the main P granule scaffold in the germline and treats the GEI-12/GEX-3 interaction
    as doubtful.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: met-2
  text: WormBase and the automated text attribute H3K36 methylation to MET-2; the review removes H3K36
    methyltransferase activity and describes MET-2 as an H3K9me1/me2 enzyme.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: mff-1
  text: UniProt says MFF-1 promotes DRP1 recruitment to mitochondria; the review notes that in C. elegans
    Mff is not essential for DRP-1 recruitment.
  sources:
  - UniProt
- gene: mff-2
  text: UniProt says MFF-2 promotes DRP1 recruitment to the mitochondrial surface; the review reports
    DRP-1 still associates with mitochondria in mff-1 mff-2 double mutants.
  sources:
  - UniProt
- gene: mpz-1
  text: The automated text says MPZ-1 enables GTPase activating protein binding; the review removes this
    because the partner RHGF-2 is a RhoGEF.
  sources:
  - Alliance_Automated
- gene: mut-16
  text: WormBase predicts MUT-16 acts in chromatin organization; the review describes it as the Q/N-rich
    scaffold that nucleates perinuclear Mutator foci for siRNA amplification.
  sources:
  - Alliance_Imported
- gene: ndx-2
  text: WormBase says ndx-2 RNAi has no obvious abnormalities; the review reports increased sensitivity
    to methyl viologen and menadione.
  sources:
  - Alliance_Imported
- gene: ndx-4
  text: WormBase calls NDX-4 homodimeric; the review and the UniProt SUBUNIT note (PMID:11937063) say
    it is a monomer.
  sources:
  - Alliance_Imported
- gene: nhr-60
  text: The automated text calls NHR-60 orthologous to human RXRA/RXRB/RXRG; WormBase and the review classify
    it as a nematode-specific supplementary nuclear receptor of the HNF4 lineage.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: nipi-3
  text: WormBase describes nipi-3 as encoding a kinase; the review describes a Tribbles pseudokinase lacking
    key catalytic residues.
  sources:
  - Alliance_Imported
- gene: nlp-29
  text: UniProt states sleep is induced 'through the neuropeptide receptor nlp-29'; the review identifies
    the receptor as the neuronal GPCR NPR-12.
  sources:
  - UniProt
- gene: nuc-1
  text: WormBase says NUC-1 acts in apoptotic cells prior to engulfment; the review states corpse DNA
    degradation depends on engulfment and that action inside dying cells is debated.
  sources:
  - Alliance_Imported
- gene: odr-1
  text: The automated text states predicted peptide receptor activity; the review marks this as over-annotated,
    noting no ligand for ODR-1 is known.
  sources:
  - Alliance_Automated
- gene: osm-1
  text: UniProt says OSM-1 is required for transport in the 'motile cilium'; the review states all C.
    elegans cilia are non-motile sensory cilia.
  sources:
  - UniProt
- gene: osm-11
  text: WormBase text omits the Notch co-ligand role that UniProt, the automated text and the review treat
    as core.
  sources:
  - Alliance_Imported
- gene: pef-1
  text: WormBase says pef-1 has no known mutant phenotype; the review cites thermotaxis, salt chemotaxis,
    CO2 and UV avoidance defects and cilium microtubule abnormalities.
  sources:
  - Alliance_Imported
- gene: pfd-4
  text: WormBase cites the deletion allele as gk403; the review cites pfd-4(gk430).
  sources:
  - Alliance_Imported
- gene: pfd-5
  text: The automated text describes PFD-5 by RNA polymerase assembly terms; the review keeps these as
    non-core and treats tubulin/actin delivery to CCT as the core role.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: rde-3
  text: WormBase says MUT-2's mechanistic role and expression are unknown; the review describes poly(UG)
    polymerase activity templating RRF-1 22G-RNA synthesis in Mutator foci.
  sources:
  - Alliance_Imported
- gene: rft-2
  text: The automated text lists the IRE1-mediated unfolded protein response; the review marks it as over-annotated.
  sources:
  - Alliance_Automated
- gene: rheb-1
  text: The automated text places RHEB-1 at the plasma membrane; the review reports endogenously tagged
    RHEB-1 on lysosomal membranes with DAF-15.
  sources:
  - Alliance_Automated
- gene: rps-3
  text: The automated apoptotic signalling claim is marked MARK_AS_OVER_ANNOTATED in the review.
  sources:
  - Alliance_Automated
- gene: rrf-1
  text: WormBase says RRF-1 is required for somatic 'but not germline' RNAi; the review places it also
    in germline Mutator foci acting redundantly with EGO-1.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: sdf-9
  text: WormBase calls SDF-9 a protein tyrosine phosphatase; the review describes a pseudophosphatase
    with Ser223 replacing the catalytic cysteine.
  sources:
  - Alliance_Imported
- gene: sem-5
  text: UniProt and WormBase describe SEM-5 as a negative regulator of let-23/Ras vulval signaling; the
    review describes it as the adaptor coupling LET-23 to SOS-1/LET-60.
  sources:
  - UniProt
  - Alliance_Imported
- gene: sod-2
  text: WormBase says sod-2 might promote normal lifespan; the review states loss of sod-2 does not shorten
    and can extend lifespan.
  sources:
  - Alliance_Imported
- gene: spg-7
  text: WormBase calls spg-7 the paraplegin (SPG7) ortholog; the review and the automated text identify
    it as the AFG3L2 ortholog.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: srp-2
  text: The automated text places SRP-2 in the extracellular region, but the review reports GFP-tagged
    SRP-2 is cytosolic and not secreted.
  sources:
  - Alliance_Automated
- gene: tmem-138
  text: UniProt says TMEM-138 is required for ciliogenesis, but the review says no clear in vivo requirement
    for worm TMEM-138 in cilium formation has been shown.
  sources:
  - UniProt
- gene: ttr-52
  text: 'Both automated texts list ''apoptotic process involved in development'', which the review removes:
    TTR-52 acts in corpse engulfment, not in killing.'
  sources:
  - Alliance_Automated
  - RefSeq
- gene: ubl-5
  text: The automated text says UBL-5 enables protein tag activity; the review removes this because UBL-5
    cannot be conjugated.
  sources:
  - Alliance_Automated
- gene: ugtp-1
  text: WormBase gives UDP-galactose and the automated text CMP-sialic acid as the substrate; the review
    says the physiological substrate is unknown and sialic acid is implausible in C. elegans.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: unc-13
  text: Both automated texts list positive regulation of oocyte development, which the review removes.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: unc-32
  text: The automated text lists defense response to Gram-positive bacterium, which the review removes.
  sources:
  - Alliance_Automated
- gene: unc-47
  text: The automated text names glycine but not GABA transmembrane transporter activity as the MF; the
    review adds the GABA MF as NEW and treats glycine as non-core.
  sources:
  - Alliance_Automated
- gene: unc-57
  text: 'The automated text lists necroptotic process, which the review modifies: UNC-57 contributes non-specifically
    to necrotic neurodegeneration, not necroptosis.'
  sources:
  - Alliance_Automated
- gene: unc-64
  text: The automated text names protein-folding chaperone binding as the only MF; the review marks it
    over-annotated and gives SNAP receptor activity as core.
  sources:
  - Alliance_Automated
- gene: vha-19
  text: WormBase calls VHA-19 a predicted transmembrane rotor component that carries protons; the review
    describes an accessory single-pass subunit supporting assembly.
  sources:
  - Alliance_Imported
- gene: vps-15
  text: The automated text says VPS-15 enables protein serine/threonine kinase activity; the review removes
    all kinase rows because the domain is a pseudokinase regulating VPS-34.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: wago-1
  text: The automated text gives RNA endonuclease and miRNA binding activity; the review removes the first
    (no catalytic residues) and modifies the second to siRNA binding.
  sources:
  - Alliance_Automated
- gene: wago-4
  text: Both automated texts give RNA endonuclease activity, which the review removes because WAGO-4 lacks
    the catalytic metal-binding residues.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: zen-4
  text: WormBase and both automated texts list pronuclear migration, which the review marks over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- gene: znfx-1
  text: RefSeq places ZNFX-1 in chromosome, nucleus and the nuclear RNA-directed RNA polymerase complex;
    the review removes these and adds Z granule and P granule.
  sources:
  - RefSeq
gap:
- gene: J7SF87
