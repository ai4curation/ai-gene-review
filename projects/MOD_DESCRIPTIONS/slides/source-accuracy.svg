<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="IBM Plex Mono, Menlo, monospace" role="img" aria-labelledby="t d">
  <title id="t">Mean correctness of each description source</title>
  <desc id="d">Mean correctness, 1 to 5. Worm: WormBase 4.2, UniProt 4.5, automated 3.9. Yeast: SGD 4.8, UniProt 4.6, automated 4.4. Fly: FlyBase 4.7, UniProt 4.6, automated 4.3.</desc>
  <rect width="680" height="230" fill="#ffffff"/>
