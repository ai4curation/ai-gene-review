insight:
- gene: CG3515
  text: The text calls CG3515 the WDR82 ortholog, but the review says the conserved ortholog is Wdr82
    (CG17293) and that the fly COMPASS purified from S2 cells contains Wdr82, not CG3515.
  sources:
  - Alliance_Automated
- gene: Caf1-55
  text: FlyBase describes only the MuvB role and UniProt omits it; the review lists both among eight or
    more complexes.
  sources:
  - Alliance_Imported
  - UniProt
- gene: Dic1
  text: The FlyBase claim of a main role in gluconeogenesis is extrapolated from mammalian liver; the
    review keeps gluconeogenesis only as non-core.
  sources:
  - Alliance_Imported
- gene: Mettl1
  text: UniProt names mRNA and miRNA substrates; the review keeps a broader RNA guanine-N7 methylation
    row and raises fly mRNA/miRNA m7G as an open question.
  sources:
  - UniProt
- gene: Sp7
  text: The review notes that genetic and biochemical studies disagree on whether Sp7 cleaves PPO1 directly
    or acts upstream of MP1. UniProt states direct cleavage as fact.
  sources:
