consensus:
- gene: Diap1
  text: UniProt and the review agree on DIAP1 as ubiquitin and NEDD8 ligase for Dronc, DrICE and Dcp-1.
  sources:
  - UniProt
discrepancy:
- gene: 18w
  text: Both sources name antibacterial humoral response; the review marks it over-annotated because 18w
    is not needed for adult antimicrobial responses and is not a bacterial pattern recognition receptor.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Ank2
  text: All sources describe locus-level Ank2 roles; the review covers Ank2-PE, a 697-aa product lacking
    the giant-isoform sequence, whose own role is undetermined.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Arg
  text: UniProt and the automated text give a nitrogen disposal or ammonium excretion role; the review
    notes flies lack a complete urea cycle and marks ammonium excretion over-annotated.
  sources:
  - UniProt
  - Alliance_Automated
- gene: Br140
  text: FlyBase calls Br140 a histone acetyltransferase; UniProt and the review describe a non-catalytic
    scaffold subunit of the Enok complex.
  sources:
  - Alliance_Imported
  - UniProt
- gene: CG10359
  text: The automated text asserts GPCR binding and GPCR signaling; the review removes both for this secreted
    fibrinogen-domain protein.
  sources:
  - Alliance_Automated
- gene: CG32086
  text: Both texts assert calcium ion sensor activity; the review notes the fly EFHB protein lacks a canonical
    calcium-binding EF-hand loop.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG32086__Q8IQG0
  text: Both texts assert calcium ion sensor activity; the review removes it because the fly protein lacks
    a canonical calcium-binding EF-hand loop.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG3226
  text: UniProt describes calcium-dependent ubiquitination; the review notes that flies have no S100 calcium-binding
    partners and removes S100 protein binding.
  sources:
  - UniProt
- gene: CG33090__Q7KT91
  text: The automated text names bile acid metabolic process; the review removes it as a mammal-specific
    GBA2 role.
  sources:
  - Alliance_Automated
- gene: CG3434
  text: The automated text says CG3434 enables queuine transglycosylase activity. UniProt and the review
    call it the non-catalytic accessory subunit that lacks the catalytic residues.
  sources:
  - Alliance_Automated
  - UniProt
- gene: CG3631
  text: The automated text gives protein serine/threonine kinase activity; UniProt and the review describe
    a xylose kinase, and the review removes the protein kinase row.
  sources:
  - Alliance_Automated
  - UniProt
- gene: CG42331
  text: The automated text lists 'cellular process involved in reproduction in multicellular organism',
    which the review removes.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG4860
  text: UniProt and the automated text call CG4860 short-chain specific. The review modifies this to generic
    acyl-CoA dehydrogenase activity because only Arc42 loss reproduces the C4 profile.
  sources:
  - UniProt
  - Alliance_Automated
- gene: CG6051
  text: The automated text lists phosphatase activity; the review removes all phosphatase rows for this
    FYVE adaptor.
  sources:
  - Alliance_Automated
- gene: CG6830
  text: The automated text names ecdysteroid 22-kinase activity; the review says the substrate is unknown
    and leaves this row UNDECIDED.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Ccs
  text: UniProt's FUNCTION text describes a superoxide dismutase. The review says Ccs is not itself a
    dismutase and removes the IEA SOD activity rows from UniProt.
  sources:
  - UniProt
- gene: Cyp301a1
  text: FlyBase describes a detoxification P450; the review has no evidence for detoxification and centres
    on abdominal tergite formation.
  sources:
  - Alliance_Imported
- gene: Dhps
  text: FlyBase names the substrate 'eEF5'; UniProt and the review name the eIF5A precursor.
  sources:
  - Alliance_Imported
- gene: Dic4
  text: The automated text predicts sulfate, thiosulfate and phosphate transport; FlyBase and the review
    report no detectable exchange activity for Dic4.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: Dif
  text: The automated text lists salivary gland histolysis; the review removes that annotation because
    the cited paper reports the opposite.
  sources:
  - Alliance_Automated
- gene: Dscam1
  text: The automated text lists touch sensation; the review removes that annotation.
  sources:
  - Alliance_Automated
- gene: Eaf6
  text: The automated text lists DNA strand elongation involved in DNA replication; the review modifies
    this to G1/S transition because the cited assay did not measure elongation.
  sources:
  - Alliance_Automated
- gene: Eb1
  text: Wound healing (FlyBase) and melanotic encapsulation (automated) are both marked over-annotated
    in the review.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Egm
  text: FlyBase describes Egm as a beta-oxidation acyl-CoA dehydrogenase; UniProt and the review make
    it an MCIA complex I assembly factor whose dehydrogenase activity is undemonstrated in flies.
  sources:
  - Alliance_Imported
  - UniProt
- gene: EloB
  text: The UniProt text is mammalian (EPOP recruitment in embryonic stem cells) and omits the cullin-RING
    adaptor role that the review makes core.
  sources:
  - UniProt
- gene: GatC
  text: RefSeq gives GatC glutaminyl-tRNA synthase activity; UniProt and the review describe GatC as a
    non-catalytic structural subunit.
  sources:
  - RefSeq
  - UniProt
- gene: Gen
  text: UniProt says Gen does not cleave Holliday junctions; FlyBase, the automated text and the review
    describe symmetric Holliday junction resolution.
  sources:
  - UniProt
  - Alliance_Imported
- gene: Gfat1
  text: All sources assign full GFAT activity; the review says this accession (Gfat1-PF) lacks the Cys2
    nucleophile and glutaminase domain and cannot catalyse the reaction alone.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Gpdh3
  text: The automated text predicts glycerol-3-phosphate dehydrogenase activity; the review says Gpdh3
    lacks conserved catalytic and NAD-binding residues and its activity is untested.
  sources:
  - Alliance_Automated
- gene: Hand
  text: The automated text lists positive regulation of transcription elongation; the review modifies
    it to positive regulation of transcription.
  sources:
  - Alliance_Automated
- gene: HipHop
  text: The automated text leads with CENP-A chromatin assembly, which the review leaves undecided.
  sources:
  - Alliance_Automated
- gene: Hn
  text: All sources assign hydroxylase activity; the review says this accession (Hn-PD, residues 275-452)
    lacks the pterin-binding and regulatory regions and is not expected to be catalytic.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: IKKbeta
  text: UniProt says IKKbeta phosphorylates Cactus to activate Relish; the review gives Relish S528/S529
    as the substrate and says IKKbeta is not required for Cactus-dependent Toll signaling.
  sources:
  - UniProt
- gene: IKKepsilon
  text: The current automated text drops the antiviral innate immune response that the older RefSeq copy
    and the review (cGAS/STING core function) include.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Idh
  text: FlyBase places Idh NADPH regeneration in the peroxisome; the review removes or marks as over-annotated
    the peroxisome rows.
  sources:
  - Alliance_Imported
- gene: Ing5
  text: FlyBase calls Ing5 a histone acetyltransferase; the review and automated text treat it as an acetyltransferase
    activator subunit, with Enok as the catalytic subunit.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Lam
  text: Both automated texts lead with signaling receptor binding activity, which the review removes.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Lis-1
  text: FlyBase says Lis-1 is a non-catalytic PAF-AH subunit; the review states the fly protein does not
    bind the Drosophila PAF-AH alpha subunit homolog.
  sources:
  - Alliance_Imported
- gene: Lsp2
  text: The automated text lists motor neuron axon guidance and synaptic target inhibition; the review
    marks both as over-annotations, and also the LSP-1 'larval serum protein complex' for this homohexamer.
  sources:
  - Alliance_Automated
- gene: LysB
  text: The automated text gives defense response to Gram-negative bacterium; UniProt and the review say
    LysB is digestive and repressed on infection.
  sources:
  - Alliance_Automated
  - UniProt
- gene: MESK2
  text: Both texts say MESK2 enables serine hydrolase activity; the review marks this over-annotated because
    the nucleophile-elbow serine is replaced by glycine.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: MESK2__Q7KVN0
  text: Serine hydrolase activity is asserted, but the review argues MESK2 is noncatalytic and marks the
    row over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Mef2
  text: The RefSeq copy lists carbohydrate storage among highlighted processes and omits muscle differentiation,
    the core role in the review.
  sources:
  - RefSeq
  - Alliance_Automated
- gene: Mo25
  text: The automated text says positive regulation of TORC1 signaling; the review modifies this, as the
    LKB1-Stlk-Mo25 complex restrains TORC1.
  sources:
  - Alliance_Automated
- gene: Mon1
  text: Automated texts say Mon1 enables GEF inhibitor activity; UniProt, FlyBase and the review describe
    it as the Rab7 GEF, and the review marks the inhibitor term over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
  - UniProt
- gene: Mst27D
  text: The automated text asserts microtubule plus-end binding and spindle assembly; the review says
    Mst27D binds along the lattice, marks plus-end terms over-annotated and removes spindle assembly.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: Mtpalpha
  text: Automated texts place Mtpalpha only in the peroxisome; the review accepts the mitochondrial inner
    membrane MTP complex and keeps peroxisome as non-core.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Mtpbeta
  text: Automated texts give acetyl-CoA C-acetyltransferase activity; the review corrects this to acetyl-CoA
    C-acyltransferase (long-chain 3-ketoacyl-CoA thiolase).
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Nepl15
  text: The automated text predicts metalloendopeptidase activity; the review finds the HExxH motif reads
    RQMLH and predicts Nepl15 is catalytically inactive.
  sources:
  - Alliance_Automated
- gene: Nepl19
  text: Both texts predict proteolysis; the review removes proteolysis because Nepl19 lacks the catalytic
    HExxH residues.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: NijA
  text: The automated texts and UniProt (by similarity) give homophilic cell-cell adhesion; the review
    marks cell-cell adhesion mediator activity over-annotated and keeps only Mmp1-shed ectodomain effects
    on substrate adhesion.
  sources:
  - Alliance_Automated
  - UniProt
- gene: Nprl3
  text: The automated text places Nprl3 in the GATOR2 complex; UniProt, FlyBase and the review place it
    in GATOR1.
  sources:
  - Alliance_Automated
  - UniProt
  - Alliance_Imported
- gene: NtR
  text: Both texts predict acetylcholine-gated channel activity and cholinergic synaptic transmission;
    the review marks these over-annotated because NtR lacks the vicinal loop-C cysteines and GEK selectivity
    ring.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Pak
  text: The automated text names autophagic cell death as a main process; the review marks it over-annotated.
  sources:
  - Alliance_Automated
- gene: Pcf11
  text: FlyBase says Pcf11 regulates RNA splicing; the reviews describe cleavage factor II, poly(A)-site
    choice and Pol II termination, with no splicing role.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: Pcf11__A1Z9W4
  text: FlyBase describes Pcf11 as a splicing regulator; UniProt and the review describe cleavage factor
    II, Pol II termination and poly(A)-site choice.
  sources:
  - Alliance_Imported
  - UniProt
- gene: Pcf11__A1Z9W4
  text: The automated text leads with piRNA-guided transposon silencing, which the review keeps as non-core,
    and omits transcription termination.
  sources:
  - Alliance_Automated
- gene: Pde4
  text: RefSeq lists predicted cGMP phosphodiesterase activity. The review describes dnc as cAMP-specific
    and raises the cGMP IBA only as a question.
  sources:
  - RefSeq
- gene: Pde4__P12252
  text: RefSeq names predicted cGMP phosphodiesterase activity. The review and the other sources describe
    a cAMP-specific PDE4.
  sources:
  - RefSeq
- gene: Pld
  text: 'The automated text names gastrulation involving germ band extension as a lead process. The review
    marks that term as over-annotated: the shortened germ band follows cellularization defects.'
  sources:
  - Alliance_Automated
- gene: PolG2
  text: The automated text leads with DNA/RNA hybrid and ssRNA binding. UniProt says the subunit does
    not bind DNA, and the review leaves the hybrid binding UNDECIDED.
  sources:
  - Alliance_Automated
  - UniProt
- gene: Prx4
  text: FlyBase calls Prx4 an atypical 2-Cys peroxiredoxin. The review describes a typical 2-Cys peroxiredoxin
    of the AhpC/Prx1 family.
  sources:
  - Alliance_Imported
- gene: Pxd
  text: FlyBase describes Pxd as a glutathione-oxidizing antioxidant enzyme. UniProt, the automated text
    and the review describe the chorion-hardening heme peroxidase.
  sources:
  - Alliance_Imported
  - UniProt
- gene: Pxd
  text: The automated and RefSeq texts name human EPX as an ortholog. The review states Pxd has no vertebrate
    ortholog and belongs to an arthropod-specific expansion.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Rad9
  text: The automated and RefSeq texts lead with predicted 3'-5' exonuclease activity. The review marks
    this as over-annotated, transferred from early mammalian reports.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: RluA-1
  text: The automated text predicts rRNA pseudouridine synthesis. The review says the RPUSD2 subfamily
    has lost rRNA activity and acts on tRNA U32.
  sources:
  - Alliance_Automated
- gene: Roc1a
  text: UniProt says Roc1a is required for Ci but not Armadillo proteolysis. The review description lists
    Armadillo destruction among its SCF roles.
  sources:
  - UniProt
- gene: Roc1a
  text: FlyBase calls Roc1a a C2H2 zinc finger protein. The review describes a RING-H2 domain.
  sources:
  - Alliance_Imported
- gene: SCAP
  text: UniProt and the automated texts describe sterol-regulated SREBP processing and cholesterol synthesis.
    The review says flies cannot make sterols and regulate SREBP through phosphatidylethanolamine, and
    it removes the cholesterol biosynthesis annotation.
  sources:
  - UniProt
  - Alliance_Automated
  - RefSeq
- gene: SK
  text: UniProt says the channel is blocked by apamin (By similarity). FlyBase and the review say fly
    dSK is apamin insensitive.
  sources:
  - UniProt
  - Alliance_Imported
- gene: SK
  text: The automated text claims photoreceptor activity (light absorption). The review removes this annotation.
  sources:
  - Alliance_Automated
- gene: SREBP
  text: FlyBase says SREBP responds to reduced cholesterol. The review says fly SREBP processing is controlled
    by phosphatidylethanolamine.
  sources:
  - Alliance_Imported
- gene: Septin2
  text: The automated text says Sep2 enables GTPase activity. The review says recombinant Sep2 binds GTP
    but has no detectable GTPase activity.
  sources:
  - Alliance_Automated
- gene: Serinc
  text: FlyBase describes Serinc as a putative L-serine transporter. The review says serine incorporation
    has not been upheld and its lipid transport activity is undetermined.
  sources:
  - Alliance_Imported
- gene: Serinc__M9PFR2
  text: FlyBase calls Serinc a putative L-serine transporter. The review describes a lipid-binding membrane
    protein whose transport activity is undetermined.
  sources:
  - Alliance_Imported
- gene: Smurf
  text: UniProt calls Smurf a positive regulator of smoothened signaling through Patched degradation.
    The review accepts negative regulation of smoothened signaling through Smo ubiquitination.
  sources:
  - UniProt
- gene: Stim
  text: RefSeq states store-operated calcium channel activity and calcium-induced calcium release activity.
    The review treats Stim as the ER Ca2+ sensor and Orai regulator, and has neither term.
  sources:
  - RefSeq
- gene: Stlk
  text: The automated texts say Stlk is involved in positive regulation of TORC1 signaling; the review
    describes the LKB1-Stlk-Mo25 complex activating AMPK to restrain TORC1-driven growth.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Sur
  text: FlyBase says Sur is expressed almost exclusively in the embryonic heart; the review lists embryonic
    trachea, adult heart, corpora cardiaca and insulin-producing cells.
  sources:
  - Alliance_Imported
- gene: Suv3
  text: The automated texts give DNA helicase activity as the molecular function; the review marks it
    over-annotated and uses RNA helicase activity.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Tdrd3
  text: UniProt's spliceosome assembly, histone methylarginine reading and G3BP1 stress-granule roles
    come from human TDRD3 and are absent from the review; the review marks Cajal body, nuclear speck and
    mRNA processing as over-annotated.
  sources:
  - UniProt
- gene: Tl
  text: The automated text lists virion binding activity; the review states Toll does not bind microbial
    molecules directly.
  sources:
  - Alliance_Automated
- gene: Toll-7
  text: FlyBase says Toll-7 binds viral glycoproteins; the review treats direct glycoprotein binding as
    unresolved.
  sources:
  - Alliance_Imported
- gene: Top3beta
  text: FlyBase says Top3beta promotes transcription via Tdrd3 binding to methylated histones; the review
    describes Top3beta-Tdrd3 promoting siRNA-guided heterochromatin silencing.
  sources:
  - Alliance_Imported
- gene: Vhl
  text: The automated texts lead with transcription corepressor activity, which the review marks over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: Vps50
  text: The automated text places Vps50 in the GARP complex; the review describes Vps50 as the defining
    EARP subunit that replaces Vps54.
  sources:
  - Alliance_Automated
- gene: Zpr1
  text: UniProt and FlyBase place Zpr1 in EGFR/FGFR signaling; the review marks those terms over-annotated
    and treats Zpr1 as an eEF1A chaperone.
  sources:
  - UniProt
  - Alliance_Imported
- gene: amon
  text: FlyBase says amon directly cleaves Slit; UniProt cites one study for and one against, and the
    review does not mention Slit.
  sources:
  - Alliance_Imported
  - UniProt
- gene: aub
  text: The automated text places Aub in the Yb body, a location the review removes.
  sources:
  - Alliance_Automated
- gene: borr
  text: UniProt says Borr has no function in meiotic histone phosphorylation; the review says borr mutant
    cells lose H3S10 phosphorylation, and the UniProt sentence appears to come from the Australin study.
  sources:
  - UniProt
- gene: cact
  text: UniProt says Cactus is degraded by IKKbeta; the review describes Pelle-mediated phosphorylation
    and Slimb-dependent degradation downstream of Toll.
  sources:
  - UniProt
- gene: cav
  text: The automated text says telomeric repeat DNA binding, while UniProt and the review stress sequence-independent
    binding to chromosome ends.
  sources:
  - Alliance_Automated
  - UniProt
- gene: dac
  text: Automated and RefSeq texts assign sequence-specific DNA-binding transcription factor activity;
    the review says no DNA binding has been shown and treats Dac as a cofactor of Eya.
  sources:
  - Alliance_Automated
  - RefSeq
  - Alliance_Imported
- gene: dl__P15330
  text: UniProt says Dorsal promotes expression of zen and dpp; the review states that Dorsal represses
    these dorsal genes with Groucho-recruiting cofactors.
  sources:
  - UniProt
- gene: ey
  text: The automated text names PAX4 as the human ortholog and omits eye development; the review treats
    ey as the Pax6 ortholog at the top of the retinal determination network.
  sources:
  - Alliance_Automated
- gene: eya
  text: UniProt says Eya regulates transcription through its phosphatase activity; the review says the
    phosphatase is dispensable for eye development and acts in axon pathfinding.
  sources:
  - UniProt
- gene: frc
  text: FlyBase lists UDP-glucose as a transported substrate; the review records conflicting evidence,
    including a NOT UDP-glucose transporter annotation.
  sources:
  - Alliance_Imported
- gene: glo
  text: FlyBase and the automated text present nurse cell chromatin organization as a Glo function; the
    review treats it as a downstream phenotype of RNA regulation (MARK_AS_OVER_ANNOTATED).
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: mTor
  text: The automated and RefSeq texts lead with chromatin DNA binding, which the review marks as over-annotated.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: metro
  text: The automated text assigns predicted kinase and ATP binding activity; the review removes kinase
    activity because the MAGUK GUK domain lacks catalytic residues.
  sources:
  - Alliance_Automated
- gene: msk
  text: The automated text leads with snRNA binding, which the review marks over-annotated, and omits
    the import receptor activity for ERK, Mad and Yorkie.
  sources:
  - Alliance_Automated
- gene: mud
  text: The automated text assigns DNA binding and thermosensory behavior; the review removes DNA binding
    and treats Mud as a Pins-recruited microtubule-binding spindle orientation effector.
  sources:
  - Alliance_Automated
- gene: mus312
  text: UniProt says MUS312 has endonuclease activity towards branched DNA; the review and FlyBase present
    it as a non-catalytic scaffold whose nuclease partners do the cutting.
  sources:
  - UniProt
  - Alliance_Imported
- gene: mus81
  text: UniProt suggests MUS81 may repair meiotic double-strand breaks; the review states fly MUS81-MMS4
    is not needed for meiotic crossing over.
  sources:
  - UniProt
- gene: neur
  text: The automated text never names Notch, the gene's main pathway, and gives long-term memory as a
    headline process; the review keeps memory as non-core.
  sources:
  - Alliance_Automated
- gene: olf413
  text: Both sources assign tyramine beta-hydroxylase activity; the review treats the substrate as undetermined
    and annotates only a generic ascorbate-dependent monooxygenase activity.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: pnr
  text: UniProt and FlyBase describe pnr through achaete-scute activation, while the automated text gives
    only cardiac and closure roles; the review treats both as core.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: ptc
  text: UniProt gives a cholesterol-transport mechanism for Smo inhibition by similarity; the review supports
    a phospholipid (PI4P, phosphatidic acid) mechanism in Drosophila.
  sources:
  - UniProt
- gene: rasp
  text: The automated text gives protein-cysteine S-palmitoyltransferase activity, while the review says
    Rasp makes an amide-linked N-palmitoyl cysteine.
  sources:
  - Alliance_Automated
- gene: rgn
  text: The automated text gives carbohydrate binding; the review says this is not established for Rgn.
  sources:
  - Alliance_Automated
- gene: rpr
  text: UniProt says Reaper acts on the caspase Dredd; the review describes Reaper as a DIAP1 antagonist
    that promotes DIAP1 degradation, with no Dredd role.
  sources:
  - UniProt
- gene: sima
  text: The automated text never mentions hypoxia, the core role of this HIF-alpha ortholog, and leads
    with insulin receptor signalling.
  sources:
  - Alliance_Automated
- gene: smo
  text: UniProt describes Smo activation by cholesterol and translocation to the primary cilium; the review
    states fly epithelia transduce Hh without a cilium, through the C-tail and Costal-2/Fused.
  sources:
  - UniProt
- gene: spi
  text: UniProt writes 'Ligand for the EGF receptor (Gurken)'; Gurken is another EGFR ligand, not the
    receptor.
  sources:
  - UniProt
- gene: tin
  text: The automated text gives human NKX2-2 as the ortholog; the review describes tin as the ortholog
    of Nkx2-5.
  sources:
  - Alliance_Automated
- gene: ttv
  text: Both sources assign heparan sulfate co-polymerase activity, but the review states the D5SHU8 ttv-PC
    product lacks the N-terminal anchor and GT47 domain and its activity is unstudied.
  sources:
  - Alliance_Imported
  - Alliance_Automated
gap:
- gene: AGO3
  text: UniProt says AGO3 is involved in transposon silencing in the adult brain (PubMed:23559253); the
    review does not mention a brain role.
  sources:
  - UniProt
- gene: Acat1
  text: FlyBase says Acat1 also performs the last step of fatty acid beta-oxidation; the review places
    Acat1 in ketone body and isoleucine metabolism only.
  sources:
  - Alliance_Imported
- gene: Actbeta
  text: FlyBase names hemocyte development and body size as Actbeta roles; the review does not cover either.
  sources:
  - Alliance_Imported
- gene: BicD
  text: UniProt names a role in annulate lamellae biogenesis (PubMed:31626769); the review does not mention
    annulate lamellae.
  sources:
  - UniProt
- gene: Buffy
  text: FlyBase links Buffy loss to altered larval energy metabolism; the review does not mention energy
    metabolism.
  sources:
  - Alliance_Imported
- gene: CG34171
  text: No source says CG34171 is a catalytically inactive serine protease homolog (SPH244), the one firm
    fact in the review.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG34171__A8DZ15
  text: The text does not state the pseudoprotease status (Phe in place of the catalytic serine) that
    the review treats as the defining feature.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG4793
  text: The text does not mention that depletion increases encapsulation of parasitoid eggs, the review's
    core role.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CG6836
  text: The automated text says CG6836 is used to study chromosome 3q29 microdeletion syndrome; the review
    does not mention this.
  sources:
  - Alliance_Automated
  - RefSeq
- gene: CRY
  text: No source names TIMELESS binding or JETLAG/CUL1-mediated TIM degradation, which the review treats
    as the core entrainment mechanism.
  sources:
  - UniProt
  - Alliance_Automated
- gene: Caf1-105
  text: FlyBase says Caf1-105 contributes to Notch signaling; the review does not mention Notch.
  sources:
  - Alliance_Imported
- gene: Ced-12
  text: FlyBase names embryonic cellularization; the review does not mention it.
  sources:
  - Alliance_Imported
