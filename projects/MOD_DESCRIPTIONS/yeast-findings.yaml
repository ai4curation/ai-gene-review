insight:
- gene: BIO6
  text: The review notes BIO6 is a BIO3 paralog with a class-III aminotransferase fold, not a BioF-family
    enzyme, so the KAPA synthase assignment that both texts repeat rests on genetics (KAPA rescue) rather
    than on assayed activity.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: CAB3
  text: None of the sources says that Cab3 supplies the catalytic cysteine of the heterotrimeric PPCDC
    and scaffolds CoA-SPC through its N-terminal extension, the review's key points.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: CAF120
  text: No source mentions the meiotic crossover role (MutLgamma-Exo1 interactor, reduced crossovers when
    deleted) that the review takes as its one functional core.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
