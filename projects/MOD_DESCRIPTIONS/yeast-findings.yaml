discrepancy:
- gene: AAD3
  text: The automated text predicts aryl-alcohol dehydrogenase activity. The review reports that purified
    Aad3p is inactive toward aryl-aldehydes and lacks the catalytic tyrosine.
  sources:
  - Alliance_Automated
- gene: ACH1
  text: UniProt links Ach1 to cholesterol synthesis and melatonin acetylation. The review describes a
    mitochondrial succinyl-CoA:acetate CoA-transferase.
  sources:
  - UniProt
- gene: ACO2
  text: SGD and the automated text describe a TCA-cycle aconitase. UniProt and the review describe a homocitrate
    dehydratase that cannot replace Aco1p in the TCA cycle.
  sources:
  - Alliance_Imported
  - Alliance_Automated
  - UniProt
- gene: ACP1
  text: UniProt calls Acp1 an accessory subunit of Complex I. The review notes S. cerevisiae lacks Complex
    I.
  sources:
  - UniProt
- gene: AGP2
  text: UniProt calls Agp2 a general amino acid permease that transports carnitine. SGD says it lacks
    transport activity and regulates transporter genes, which the review favours.
  sources:
  - UniProt
  - Alliance_Imported
- gene: ALG11
  text: SGD says Alg11 adds mannoses to the Man5GlcNAc2-PP-dolichol intermediate. UniProt and the review
    say it converts Man3 to Man5.
  sources:
  - Alliance_Imported
  - UniProt
- gene: ALG13
  text: The automated text locates Alg13 to the cytoplasmic side of the Golgi membrane. The review says
    the source paper places it at the cytosolic face of the ER.
  sources:
  - Alliance_Automated
- gene: ARO3
  text: The automated text locates Aro3 in the mitochondrion and nucleus; the review marks the mitochondrion
    row over-annotated and describes a cytosolic enzyme.
  sources:
  - Alliance_Automated
- gene: ARO9
  text: The automated text gives aromatic-amino-acid:2-oxoglutarate transaminase activity, but UniProt
    and the review say Aro9 does not accept 2-oxoglutarate.
  sources:
  - Alliance_Automated
  - UniProt
- gene: ASP1
  text: The automated text places Asp1 in the periplasm; SGD and the review describe it as cytosolic,
    and the review removes the periplasmic row.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: BIO1
  text: SGD and the automated text describe BIO1 as a pimeloyl-CoA synthetase (CoA ligase); the review
    places it in the PhyH Fe(II)/2-oxoglutarate oxygenase family and calls the reaction unknown.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: BNA4
  text: The automated text locates Bna4 only in the peroxisome; the review accepts mitochondrial outer
    membrane as the main site and keeps peroxisome as non-core.
  sources:
  - Alliance_Automated
- gene: BTS1
  text: UniProt describes the reaction as three IPP additions onto DMAPP; the review marks the DMAPP and
    FPP synthase annotations as over-annotations and says the physiological reaction uses FPP made by
    Erg20p.
  sources:
  - UniProt
- gene: CAB2
  text: UniProt calls the PPCS reaction the first step of CoA biosynthesis; SGD and the review place it
    second, after pantothenate kinase (Cab1).
  sources:
  - UniProt
  - Alliance_Imported
- gene: CAB4
  text: The automated text gives Cab4 dephospho-CoA kinase activity; the review removes that IBA because
    Cab4 is a single-domain PPAT and Cab5 is the DPCK.
  sources:
  - Alliance_Automated
- gene: CAF120
  text: The automated text predicts protein kinase activity; the review removes it as an over-propagated
    IBA because Caf120 has only a PH domain and disordered regions.
  sources:
  - Alliance_Automated
- gene: CAK1
  text: The automated text calls Cak1 an ortholog of human CDK4 and CDK6 and imports their diseases; the
    review describes a monomeric fungal-specific CAK distinct from CDK7 and CDKs.
  sources:
  - Alliance_Automated
- gene: CBR1
  text: The automated text lists 2-(3-amino-3-carboxypropyl)histidine synthase activity; the review modifies
    it because that is the Dph1-Dph2 reaction and Cbr1 only reduces Dph3.
  sources:
  - Alliance_Automated
- gene: CDA2
  text: The automated text says Cda2 is active in the cytosol and involved in chitin catabolism; the review
    removes cytosol (secreted, glycosylated enzyme) and modifies catabolism because deacetylation makes
    chitosan rather than degrading chitin.
  sources:
  - Alliance_Automated
- gene: CDC21
  text: SGD names the human complementing homolog TYMSOS (TYMS opposite strand, a non-coding RNA); the
    automated text and the review name TYMS.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: CDC5
  text: The automated text says Cdc5 binds centromeric DNA; the review modifies that annotation because
    the evidence is cohesin-mediated chromatin association and Cdc5 has no DNA-binding domain.
  sources:
  - Alliance_Automated
- gene: CHD1
  text: The automated text gives histone H3K4me3 reader activity; the review's description says yeast
    Chd1 chromodomains do not bind H3K4me3 and the annotation is left UNDECIDED.
  sources:
  - Alliance_Automated
- gene: CIT2
  text: UniProt ties Cit2 to the TCA cycle as its rate-limiting enzyme; the review's core function is
    the glyoxylate cycle.
  sources:
  - UniProt
- gene: CNE1
  text: Automated text states predicted calcium ion binding; the review removes this because direct yeast
    biochemistry argues against it.
  sources:
  - Alliance_Automated
- gene: COQ1
  text: Automated text says heptaprenyl (C35) diphosphate synthase; SGD and the review say hexaprenyl
    (C30), for Q6.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: COQ6
  text: UniProt says Coq6 also performs the C1 hydroxylation downstream of COQ4; the review says this
    step is a COQ4-dependent oxidative decarboxylation, not a Coq6 reaction.
  sources:
  - UniProt
- gene: COQ8
  text: Automated text claims protein kinase activity; SGD and the review say Coq8 lacks canonical protein
    kinase activity and acts as an ATPase.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: COX17
  text: Automated text includes protein farnesylation; the review says this annotation comes from a paper
    about COX10, not Cox17.
  sources:
  - Alliance_Automated
- gene: COX19
  text: SGD calls Cox19 a putative copper metallochaperone delivering copper to COX; UniProt and the review
    describe a chaperone for Cox11 rather than a copper donor.
  sources:
  - Alliance_Imported
  - UniProt
- gene: CPT1
  text: UniProt says Cpt1 prefers CDP-monomethylethanolamine; the review says it is relatively specific
    for CDP-choline.
  sources:
  - UniProt
- gene: CYB5
  text: SGD singles out sterol C5-6 desaturation; the review's core role is C-4 demethylation (Erg25)
    and Erg11 support, with Erg3 desaturation only a suggested question.
  sources:
  - Alliance_Imported
  - UniProt
- gene: DAK1
  text: UniProt says Dak1 phosphorylates glyceraldehyde; the review says this is inferred from mammalian
    triokinase and not shown in yeast.
  sources:
  - UniProt
- gene: DAK2
  text: UniProt says Dak2 phosphorylates glyceraldehyde; the review says this is not shown for the yeast
    enzyme.
  sources:
  - UniProt
- gene: DCI1
  text: SGD says the dienoyl-CoA isomerase identification is disputed. UniProt and the review accept the
    3,5-2,4 di-isomerase activity and doubt only a physiological 3,2-isomerase role.
  sources:
  - Alliance_Imported
  - UniProt
- gene: DEG1
  text: 'The automated text says DEG1 is active in mitochondrion. The review removes that location: mitochondrial
    tRNAs are modified, but direct mitochondrial localization was not shown.'
  sources:
  - Alliance_Automated
- gene: DFG10
  text: SGD describes a polyprenol reductase. The review and UniProt cite PMID:38821050 showing Dfg10
    reduces polyprenal to dolichal and has no activity on polyprenol.
  sources:
  - Alliance_Imported
  - UniProt
- gene: DNM1
  text: UniProt calls Dnm1 a microtubule-associated protein. The review marks microtubule and microtubule
    binding as over-annotations.
  sources:
  - UniProt
- gene: DOT5
  text: UniProt gives DOT5 roles in telomere silencing and telomere length. The review attributes the
    telomeric-silencing defects to overexpression and marks the telomeric location as over-annotated.
  sources:
  - UniProt
- gene: DUG1
  text: 'UniProt and SGD place Dug1 in a Dug1-Dug2-Dug3 complex. The review finds the heteromeric complex
    unsupported: Dug1 is a homodimer acting after (Dug2-Dug3)2.'
  sources:
  - UniProt
  - Alliance_Imported
- gene: DUG2
  text: The automated text gives Dug2 omega peptidase activity. The review says Dug2 is a non-catalytic
    scaffold whose M20A-like domain lacks peptidase activity.
  sources:
  - Alliance_Automated
- gene: ERG12
  text: UniProt's pathway text (also used for ERG19 and ERG20) says the mevalonate-to-FPP module occurs
    in the vacuole. The review places these enzymes in the cytosol and marks vacuole annotations as over-annotated
    or removed.
  sources:
  - UniProt
- gene: ERG20
  text: The automated text gives ERG20 isopentenyl-diphosphate delta-isomerase activity. The review leaves
    this row undecided; that step belongs to IDI1.
  sources:
  - Alliance_Automated
- gene: ERG3
  text: Automated text locates Erg3 in the ER lumen; the review modifies this IDA row to ER membrane because
    only the tagged N-terminus faces the lumen.
  sources:
  - Alliance_Automated
- gene: ERG6
  text: SGD and the automated text place Erg6 in mitochondria (outer membrane); the review marks the outer-membrane
    proteome row as over-annotated, explained by co-purifying lipid droplet/ER contacts.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: ERG8
  text: UniProt says the second (mevalonate) module is carried out in the vacuole; SGD and the review
    describe Erg8 as a soluble cytoplasmic protein.
  sources:
  - UniProt
  - Alliance_Imported
- gene: ESL1
  text: Automated text says Esl1 is predicted to act in nonsense-mediated decay; the review removes this
    because single and double esl mutants do not accumulate NMD substrates.
  sources:
  - Alliance_Automated
- gene: EXG1
  text: Automated text gives glucan endo-1,6-beta-glucosidase activity; the review modifies this IDA row
    to beta-glucosidase because the activity is exo/small-substrate, not endo.
  sources:
  - Alliance_Automated
- gene: FOX2
  text: UniProt calls Fox2 a hydratase-dehydrogenase-epimerase and the automated text gives (3S)-hydroxyacyl-CoA
    dehydrogenase; the review states the enzyme lacks epimerase and (3S) activities and works through
    (3R)-hydroxyacyl-CoA.
  sources:
  - UniProt
  - Alliance_Automated
- gene: GDB1
  text: SGD (phosphorylated in mitochondria) and the automated text (located in mitochondrion) imply a
    mitochondrial pool; the review treats this as a proteome detection without targeting signal and describes
    Gdb1 as cytosolic.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: GLG1
  text: SGD (vacuole, cell periphery) and the automated text (vacuole) give locations that the review
    rejects; it treats the vacuole term as a propagation from Komagataella glycophagy and places Glg1
    in the cytosol.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: GLK1
  text: Glucose import across the plasma membrane and plasma membrane location (automated) and the glucose
    uptake claim (UniProt) are marked as over-annotated in the review, which places Glk1 in the cytosol.
  sources:
  - UniProt
  - Alliance_Automated
- gene: GND1
  text: The automated text locates Gnd1 in the mitochondrion; the review marks this as over-annotated
    and places the enzyme in the cytosol.
  sources:
  - Alliance_Automated
- gene: GND2
  text: The automated text places Gnd2 at the plasma membrane; the review marks this as over-annotated
    and places the enzyme in the cytosol.
  sources:
  - Alliance_Automated
- gene: GPM3
  text: The automated text gives predicted phosphoglycerate mutase activity and glycolysis; SGD and the
    review state Gpm3 has no detectable mutase activity and no growth phenotype.
  sources:
  - Alliance_Automated
  - Alliance_Imported
- gene: GRX1
  text: The automated text gives only glutathione peroxidase and transferase activities plus protein glutathionylation;
    the review's core activity is glutathione disulfide oxidoreductase and it marks glutathionylation
    as over-annotated.
  sources:
  - Alliance_Automated
- gene: GSY1
  text: The automated text places Gsy1 in the mitochondrion; the review marks this as over-annotated and
    places Gsy1 in the cytosol and glycogen granule.
  sources:
  - Alliance_Automated
- gene: GTT2
  text: SGD's text says Gtt2 overlaps functionally with Gtt2p, a self-reference; the review and the GTT1
    SGD text indicate the partner is Gtt1.
  sources:
  - Alliance_Imported
- gene: GTT3
  text: SGD places Gtt3 fusion proteins at the cell periphery; the automated text and the review place
    it at the nuclear periphery/nuclear envelope.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: HFA1
  text: The automated text leads with long-chain fatty acid biosynthesis, which the review marks as over-annotated
    (rescue by an engineered cytosolic form); the native product feeds lipoic acid synthesis.
  sources:
  - Alliance_Automated
- gene: HFD1
  text: The automated text names carboxylate reductase activity; the review modifies this to NAD+-dependent
    long-chain fatty aldehyde dehydrogenase activity.
  sources:
  - Alliance_Automated
- gene: HKR1
  text: UniProt describes Hkr1 as a filamentous-growth signalling mucin and does not mention HOG osmosensing;
    SGD and GOA make it a Sho1-branch osmosensor redundant with Msb2. There is no HKR1 gene review yet
    to adjudicate.
  sources:
  - UniProt
  - Alliance_Imported
- gene: HMG2
  text: The automated text places Hmg2 in the proteasome complex; the review removes that annotation because
    Hmg2 is an ERAD substrate.
  sources:
  - Alliance_Automated
- gene: HSC82
  text: The automated text locates Hsc82 in the mitochondrion and plasma membrane; the review marks both
    as over-annotations of a cytosolic chaperone.
  sources:
  - Alliance_Automated
- gene: HXK1
  text: The automated text gives hexose import across the plasma membrane and a mitochondrial location;
    the review removes or marks the import terms as over-annotations and treats mitochondria as a minor
    pool.
  sources:
  - Alliance_Automated
- gene: HXK2
  text: SGD presents Hxk2 as a nuclear-shuttling repressor; the review cites live-cell imaging and RNA-seq
    showing negligible direct transcriptional activity and leaves the transcription annotation undecided.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: IDI1
  text: UniProt says the second ergosterol module is carried out in the vacuole; the review and the automated
    text place Idi1 in the cytosol.
  sources:
  - UniProt
  - Alliance_Automated
- gene: IDP3
  text: UniProt says IDP3 may supply NADPH for fatty acid and sterol synthesis; the review and SGD tie
    it to beta-oxidation of unsaturated fatty acids in peroxisomes.
  sources:
  - UniProt
  - Alliance_Imported
- gene: IMD2
  text: The automated text gives chromatin binding as the only function and omits IMP dehydrogenase activity,
    the core function in the review.
  sources:
  - Alliance_Automated
- gene: IMD3
  text: The automated text omits IMP dehydrogenase activity and names only identical protein binding.
  sources:
  - Alliance_Automated
- gene: IMD4
  text: The automated text gives mRNA binding as the only function and omits IMP dehydrogenase activity.
  sources:
  - Alliance_Automated
- gene: IPK1
  text: The automated text names nuclear-transcribed mRNA catabolism by non-stop decay, which the review
    marks as over-annotated.
  sources:
  - Alliance_Automated
- gene: IRC24
  text: SGD calls IRC24 a putative paralog of IRC24 itself; the review names the adjacent gene NRE1 as
    the paralog.
  sources:
  - Alliance_Imported
- gene: JIP4
  text: The automated text's spliceosome terms are marked over-annotated in the review, which treats function
    as unknown.
  sources:
  - Alliance_Automated
- gene: KDX1
  text: All three texts call Kdx1 a kinase; the review treats it as a pseudokinase (DFG to DFN, no TEY)
    acting non-catalytically with Swi4.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: KDX1
  text: The automated text's CDK activity, CDK holoenzyme and G2/M transition terms are removed in the
    review.
  sources:
  - Alliance_Automated
- gene: KGD4
  text: The automated text's ribosomal constituent activity and mitochondrial ribosome location are removed
    in the review, which treats the MRPS36 assignment as co-sedimentation with KGDH.
  sources:
  - Alliance_Automated
- gene: KTI11
  text: 'The automated text gives Kti11 the 2-(3-amino-3-carboxypropyl)histidine synthase activity, which
    the review marks as over-annotated: Kti11 donates electrons to Dph1-Dph2.'
  sources:
  - Alliance_Automated
- gene: LEE1
  text: The automated text's ubiquitin ligase activity and protein ubiquitination are marked over-annotated
    in the review, which accepts only zinc binding.
  sources:
  - Alliance_Automated
- gene: LEU2
  text: The automated text lists the glyoxylate cycle, which the review removes.
  sources:
  - Alliance_Automated
- gene: LOA1
  text: UniProt's vacuolar protein sorting role is marked over-annotated in the review (protein targeting
    to vacuole).
  sources:
  - UniProt
- gene: LPD1
  text: The automated text gives Lpd1 glycine dehydrogenase (decarboxylating) and oxoglutarate dehydrogenase
    activities, which belong to Gcv2 and Kgd1; the review modifies them.
  sources:
  - Alliance_Automated
- gene: LPP1
  text: UniProt gives substrate preference PA > DGPP > LPA; the review quotes PA > lyso-PA > DGPP from
    the primary paper.
  sources:
  - UniProt
- gene: LPX2
  text: SGD calls Lpx2 a lipase; the review notes the name rests on a lipidomic phenotype and a reported
    activity, with no hydrolase domain and no direct assay.
  sources:
  - Alliance_Imported
- gene: LYS4
  text: SGD has Lys4 converting homocitrate to homoisocitrate; the review says Lys4 only hydrates cis-homoaconitate
    and the homocitrate dehydration is done by Aco2.
  sources:
  - Alliance_Imported
- gene: MAD2
  text: The automated text leads with double-strand break repair via break-induced replication and microtubule
    cytoskeleton, both marked over-annotated in the review.
  sources:
  - Alliance_Automated
- gene: MAL33
  text: UniProt states MAL33 regulates the MAL3 maltase and permease genes; SGD and the review say the
    S288C allele is a non-functional activator.
  sources:
  - UniProt
  - Alliance_Imported
- gene: MBP1
  text: The automated text lists 'maintenance of translational fidelity', which the review removes.
  sources:
  - Alliance_Automated
- gene: MCR1
  text: SGD and the automated text name ergosterol biosynthesis; the review says the in vivo link is unresolved
    given the ER paralog Cbr1.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: MCT1
  text: SGD gives phospholipid remodeling as the mtFAS output; the review names octanoyl-ACP for lipoic
    acid synthesis and does not mention phospholipid remodeling.
  sources:
  - Alliance_Imported
- gene: MDH3
  text: SGD links MDH3 to the glyoxylate cycle; the automated text and the review place it in fatty acid
    beta-oxidation NADH reoxidation, with only mild acetate growth defects.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: MDM12
  text: SGD describes Mdm12 as a mitochondrial outer membrane protein; the review describes it as a soluble
    SMP-domain subunit held at contacts by Mmm1 and Mdm34.
  sources:
  - Alliance_Imported
- gene: MIM1
  text: SGD and the automated text describe Mim1-Mim2 as a channel; the review marks voltage-gated channel
    activity as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: MMM1
  text: SGD says Mmm1 localizes to the peroxisome in glucose; the review marks the peroxisome annotation
    as over-annotated.
  sources:
  - Alliance_Imported
- gene: MNT4
  text: The automated text predicts a role in protein O-linked glycosylation; SGD says MNT4 is not required
    for it, and the review marks the term over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: MOH1
  text: UniProt gives a pro-apoptotic DNA damage role, while the review notes that moh1 deletion increases
    resistance to MMS and other stresses and calls the apoptosis interpretation uncertain.
  sources:
  - UniProt
- gene: MRX20
  text: The automated text predicts citrate transport; the review calls MRX20 a carrier of unknown substrate
    in a fungal-specific subfamily.
  sources:
  - Alliance_Automated
- gene: MSC2
  text: UniProt says Msc2 moves zinc from the nucleus/ER to the cytoplasm; SGD and the review say the
    Msc2-Zrg17 complex imports cytosolic zinc into the ER lumen.
  sources:
  - UniProt
  - Alliance_Imported
- gene: MVD1
  text: UniProt places the second module of ergosterol synthesis in the vacuole; the review describes
    Mvd1 as a soluble cytosolic enzyme and removes the vacuole annotation.
  sources:
  - UniProt
- gene: NCL1
  text: UniProt suggests a ribosome-biogenesis role from paromomycin sensitivity; the review removes the
    rRNA methyltransferase and rRNA processing rows and attributes 25S rRNA m5C to Rcm1 and Nop2.
  sources:
  - UniProt
- gene: NDE1
  text: The automated text lists pyruvate fermentation to ethanol, which the review marks as over-annotated.
  sources:
  - Alliance_Automated
- gene: NDI1
  text: SGD and the automated text give a pro-apoptotic role (positive regulation of apoptotic process);
    the review marks that row as over-annotated and treats death as a consequence of overexpression and
    ROS.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: NDL1
  text: The automated text gives microtubule plus-end binding as the function; the review marks it as
    over-annotated and uses dynein intermediate chain binding and motor regulator activity instead.
  sources:
  - Alliance_Automated
- gene: NQM1
  text: SGD describes Nqm1 as a transaldolase of unknown function; the review cites crystal structure
    and assays showing an active transaldolase, minor relative to Tal1.
  sources:
  - Alliance_Imported
- gene: NTE1
  text: The automated text locates Nte1 to lipid droplets; the review removes that annotation.
  sources:
  - Alliance_Automated
- gene: NVJ3
  text: The automated text predicts phosphatidylinositol-3-phosphate binding, which the review marks as
    over-annotated because Nvj3 lacks Mdm1's PX domain.
  sources:
  - Alliance_Automated
- gene: OAR1
  text: SGD says human CBR4 complements the oar1 null; the review states rescue requires co-expression
    of both CBR4 and HSD17B8.
  sources:
  - Alliance_Imported
- gene: OCA6
  text: The automated text predicts phosphatase activity; the review removes it because Oca6 lacks the
    invariant CX5R arginine and is likely a pseudophosphatase.
  sources:
  - Alliance_Automated
- gene: OLE1
  text: SGD and the automated text list mitochondrial inheritance as an Ole1 role; the review marks it
    as over-annotated, an indirect phenotype of UFA shortage.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: PAA1
  text: The automated text lists chromatin organization; the review marks it as over-annotated.
  sources:
  - Alliance_Automated
- gene: PAH1
  text: The automated text lists transcription cis-regulatory region binding; the review marks it as over-annotated.
  sources:
  - Alliance_Automated
- gene: PBS2
  text: The automated text gives Pbs2 protein N-terminal acetyltransferase activity and NatB membership;
    the review holds these UNDECIDED as a likely NAT3 mis-attribution.
  sources:
  - Alliance_Automated
- gene: PDC1
  text: UniProt lists phenylpyruvate as a preferred substrate for all three PDCs; the review keeps phenylpyruvate
    decarboxylase UNDECIDED for Pdc1 and finds it only for Pdc5.
  sources:
  - UniProt
- gene: PDC6
  text: UniProt and the automated text attribute phenylalanine-derived substrate use to Pdc6; the review
    says it shows no detectable phenylpyruvate decarboxylase activity.
  sources:
  - UniProt
  - Alliance_Automated
- gene: PDI1
  text: The automated text names PDIA3 as ortholog; the review says the closest human counterpart is PDIA1/P4HB.
  sources:
  - Alliance_Automated
- gene: PFK1
  text: SGD and the automated text say Pfk1 associates with or binds ribosomes; the review removes ribosome
    binding because the cited paper concludes Pfk1 is not directly associated with translating ribosomes,
    unlike Pfk2.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: PGI1
  text: The automated text lists mitochondrion as the only location; the review treats this as a minor
    pool of a cytosolic enzyme.
  sources:
  - Alliance_Automated
- gene: PHS1
  text: SGD and the automated text include a protein trafficking / vacuolar transport role that the review
    marks as over-annotated (from a promoter-shutoff screen).
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: PNO1
  text: The automated text lists proteasome assembly, which the review marks as over-annotated.
  sources:
  - Alliance_Automated
- gene: PNP1
  text: The automated text states inosine nucleosidase and nicotinamide riboside hydrolase activities;
    the review modifies both, as Pnp1 cleaves these substrates by phosphorolysis.
  sources:
  - Alliance_Automated
- gene: POF1
  text: SGD and the automated text give Pof1 ATPase activity in protein quality control; the review marks
    ATP hydrolysis activity and ERAD as over-annotated.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- gene: PPH21
  text: UniProt states the exact function of Pph21 is not known; the review describes its mitotic and
    TORC1-pathway roles in detail.
  sources:
  - UniProt
- gene: PSD2
  text: SGD places Psd2 in Golgi and vacuolar membranes; the review assigns it to the cytoplasmic face
    of endosomes, noting the early fraction only resembled Golgi and vacuoles.
  sources:
  - Alliance_Imported
- gene: PTA1
  text: All three sources name pre-tRNA processing as a Pta1 function; the review marks it over-annotated
    as a probably indirect phenotype.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- gene: PYK2
  text: The automated text gives melatonin binding and mitochondrion; the review marks melatonin binding
    over-annotated and treats Pyk2 as cytosolic.
