    cell stage due to diminished signaling of the B cell receptor.
  phenotype_vocabulary: true
- gene: Cd79b
  mgi_id: MGI:96431
  mgi_note: Homozygotes for targeted null mutations exhibit arrested development of B cells at the pro-B
    cell stage due to diminished signaling of the B cell receptor.
  phenotype_vocabulary: true
