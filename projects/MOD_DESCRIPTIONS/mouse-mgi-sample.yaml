summary:
  mouse_review_folders: 221
  sampled: 25
  seed: 1
  with_mgi_note: 22
  with_phenotype_vocabulary: 22
  notes_shared_by_several_genes:
  - Homozygotes for targeted null mutations exhibit arrested development of B cells at the pro-B cell
    stage due to diminished signaling of the B cell receptor.
genes:
- gene: Ccne1
  mgi_id: MGI:88316
  mgi_note: Mice homozygous for disruptions in this gene display no abnormal phenotype.
  phenotype_vocabulary: true
- gene: Notch1
  mgi_id: MGI:97363
  mgi_note: Homozygotes for null alleles exhibit defects in embryonic development resulting in lethality
    at some point in organogenesis.  Lethal phenotype may be affected by genetic background.
  phenotype_vocabulary: true
- gene: Wdpcp
  mgi_id: MGI:2144467
  mgi_note: Mice homozygous for a null mutation display ciliogenesis defects, anophthalmia, cysts in multiple
    tissues, central polydactyly, duplex kidney, and septation defects in the outflow tract and cloaca.
  phenotype_vocabulary: true
- gene: Traf2
  mgi_id: MGI:101835
  mgi_note: Increased lethaltiy is observed with homozygous null mice. Offspring are runted and exhibit
    atrophic thymii and spleens with reduced numbers of lymphocytes.
  phenotype_vocabulary: true
- gene: Sry
  mgi_id: MGI:98660
  mgi_note: Variations in expression of alleles on specific backgrounds result in partial and/or complete
    male to female sex reversal. Deletion of alleles results in XY females.
  phenotype_vocabulary: true
- gene: Bnip3
  mgi_id: MGI:109326
  mgi_note: Mice homozygous for a null allele exhibit decreased post-ischemic ventricular remodeling.
  phenotype_vocabulary: true
- gene: Duox1
  mgi_id: MGI:2139422
  mgi_note: Mice homozygous for an ENU-induced allele exhibit normal skeletal development.
  phenotype_vocabulary: true
- gene: Casp9
  mgi_id: MGI:1277950
  mgi_note: Homozygous targeted mutants die perinatally with enlarged and malformed cerebrums caused by
    reduced apoptosis during brain development. Broad system- and stimulus-dependent effects are seen
    on apoptosis.
  phenotype_vocabulary: true
- gene: Map2k3
  mgi_id: MGI:1346868
  mgi_note: Mice homozygous for disruptions in this gene are viable and fertile but display abnormalities
    in cytokine production.
  phenotype_vocabulary: true
- gene: Src
  mgi_id: MGI:98397
  mgi_note: Homozygotes for a targeted null mutation exhibit growth retardation, failure of tooth eruption,
    osteopetrosis with lack of secondary bone resorption, and lethality at 3-4 weeks.
  phenotype_vocabulary: true
- gene: Krtap29-1
  mgi_id: MGI:3652056
  mgi_note: null
  phenotype_vocabulary: false
- gene: Krtap8-1
  mgi_id: MGI:1330293
  mgi_note: null
  phenotype_vocabulary: false
- gene: Rgs6
  mgi_id: MGI:1354730
  mgi_note: Mice homozygous for a knock-out allele exhibit decreased heart rate and abnormal impulse conducting
    system conduction.
  phenotype_vocabulary: true
- gene: Hes7
  mgi_id: MGI:2135679
  mgi_note: Homozygotes for a targeted null mutation exhibit disrupted somite formation leading to skeletal
    defects including short trunk and tail, reduced numbers of ribs, and deformed and fused vertebrae,
    and neonatal death. Some heterozygotes have tail kinks.
  phenotype_vocabulary: true
- gene: Tlr12
  mgi_id: MGI:3045221
  mgi_note: Mice homozygous for a null mutation exhibit a greatly increased susceptibility to kidney infection
    by uropathogenic bacteria.
  phenotype_vocabulary: true
- gene: Dffa
  mgi_id: MGI:1196227
  mgi_note: Mice homozygous for a knock-out allele show increased resistance to apoptosis in response
    to several apoptotic stimuli, enhanced spatial learning and memory, higher granule cell density and
    total granule cell number in the dentate gyrus, and resistance to kainic acid-induced CA3 neuronal
    cell death.
  phenotype_vocabulary: true
- gene: Camk2a
  mgi_id: MGI:88256
  mgi_note: Homozygous targeted mutants display deficient long-term hippocampal potentiation (LTP) and
    specific impairment in spatial learning; heterozygotes show decreased fear response and increased
    defensive aggression, which is more pronounced in homozygotes.
  phenotype_vocabulary: true
- gene: Ldoc1
  mgi_id: MGI:2685212
  mgi_note: Mice homozygous for a null allele display delayed parturtion, placental abnormalities, and
    impaired ability to raise pups to weaning.
  phenotype_vocabulary: true
- gene: Aldh7a1
  mgi_id: MGI:108186
  mgi_note: Normal phenotype is seen in one allele that disrupts the gene. Another knock-out allele shows
    high levels of upstream lysine metabolites in the brain and liver, abnormal amino acid metabolism,
    increased oxidative stress, and high lysine/low pyridoxine diet-induced seizures.
  phenotype_vocabulary: true
- gene: Hras
  mgi_id: MGI:96224
  mgi_note: Mice homozygous for targeted null mutations are viable and fertile with no gross morphological
    or histological abnormalities, defects in neuronal development or defects in lymphocyte cell populations.  A
    decreased susceptibility to DMBA induced skin papillomas was also demonstrated.
  phenotype_vocabulary: true
- gene: Krtap15-1
  mgi_id: MGI:1347350
  mgi_note: null
  phenotype_vocabulary: false
- gene: Peg10
  mgi_id: MGI:2157785
  mgi_note: Heterozygous mice with a paternally inherited null allele display embryonic lethality during
    organogenesis with abnormal placental development. Heterozygous mice with a maternally inherited null
    allele are viable and fertile.
  phenotype_vocabulary: true
- gene: Xiap
  mgi_id: MGI:107572
  mgi_note: Homozygous null mutants are indistinguishable from normal littermates, but increased levels
    of protein from other Birc gene family members suggest a compensatory mechanism in the absence of
    the Birc4 gene's product.
  phenotype_vocabulary: true
- gene: Stat1
  mgi_id: MGI:103063
  mgi_note: Homozygotes for targeted null mutations are largely unresponsive to interferon, fail to thrive,
    are susceptible to viral diseases and cutaneous leishmaniasis, and show excess osteoclastogenesis
    leading to increased bone mass.
  phenotype_vocabulary: true
- gene: Abi2
  mgi_id: MGI:106913
  mgi_note: Homozygous null mice display microphthalmia, abnormal lens development, abnormal corpus callosum,
    cerebral cortex, and hippocampus morphology, and impaired contextual conditioning.
  phenotype_vocabulary: true
also:
