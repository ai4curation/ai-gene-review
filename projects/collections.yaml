# Project collections: named groupings of projects that share an index page.
#
# A project joins a collection by listing its key in frontmatter:
#
#   collections: [HOMOLOGY_PROPAGATION]
#
# The index page (``index``, a top-level project slug) gets an automatically
# generated list of member projects; each member page links back to the index.
# Keys are validated by tests/test_project_frontmatter.py.

FUNCTION_PREDICTION:
  title: Function prediction evaluation
  index: FUNCTION_PREDICTION_EVALUATION
  description: >-
    Evaluations of computational protein-function predictions and functional
    summaries (ML models, agents, and annotation pipelines).

HOMOLOGY_PROPAGATION:
  title: Propagation by homology
  index: HOMOLOGY_PROPAGATION
  description: >-
    Reviews of GO annotations transferred from other gene products by
    orthology, sequence similarity, or phylogenetic inference (ISO, ISS/ISA,
    IBA, and electronic orthology pipelines).
