<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Ribosome quality control: sense, split, then destroy the nascent chain</text>
  <!-- mRNA -->
  <line x1="30" y1="200" x2="330" y2="200" stroke="#56655f" stroke-width="3"/>
  <text x="30" y="222" font-size="12" fill="#56655f">mRNA</text>
  <!-- collided disome -->
  <g>
    <ellipse cx="120" cy="178" rx="42" ry="20" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
    <ellipse cx="120" cy="140" rx="52" ry="28" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
    <ellipse cx="214" cy="178" rx="42" ry="20" fill="#e8f1ee" stroke="#bd3a30" stroke-width="2"/>
    <ellipse cx="214" cy="140" rx="52" ry="28" fill="#e8f1ee" stroke="#bd3a30" stroke-width="2"/>
    <text x="214" y="145" font-size="12" fill="#bd3a30" text-anchor="middle">stalled</text>
    <text x="120" y="145" font-size="12" fill="#56655f" text-anchor="middle">collided</text>
  </g>
  <text x="30" y="84" font-size="15" font-weight="bold" fill="#0e6b66">1. Sense the collision</text>
  <rect x="30" y="250" width="130" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="95" y="270" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">ZNF598</text>
  <text x="30" y="298" font-size="12" fill="#56655f">ubiquitinates 40S</text><text x="30" y="313" font-size="12" fill="#56655f">(RPS10, RPS20)</text>
  <rect x="190" y="250" width="130" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="255" y="270" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">EDF1</text>
  <text x="190" y="298" font-size="12" fill="#56655f">recruits GIGYF2 (+ 4EHP):</text>
  <text x="190" y="313" font-size="12" fill="#56655f">represses re-initiation</text>
  <line x1="120" y1="249" x2="130" y2="200" stroke="#15201e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="250" y1="249" x2="235" y2="200" stroke="#15201e" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- arrow to split -->
  <line x1="340" y1="160" x2="400" y2="160" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- splitting -->
  <text x="410" y="84" font-size="15" font-weight="bold" fill="#0e6b66">2. Split the ribosome</text>
  <ellipse cx="480" cy="190" rx="42" ry="20" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/><text x="480" y="195" font-size="12" text-anchor="middle" fill="#56655f">40S</text>
  <ellipse cx="480" cy="130" rx="52" ry="28" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/><text x="480" y="135" font-size="12" text-anchor="middle" fill="#56655f">60S</text>
  <line x1="420" y1="160" x2="540" y2="160" stroke="#b8620f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="410" y="230" width="150" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="485" y="250" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">PELO · HBS1L</text>
  <rect x="410" y="268" width="150" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="485" y="288" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">ABCE1</text>
  <rect x="410" y="306" width="150" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="485" y="326" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">ASCC3 · ASCC2</text>
  <text x="410" y="352" font-size="12" fill="#56655f">no-go decay of the mRNA (PELO, HBS1L)</text>
  <!-- arrow to RQC -->
  <line x1="570" y1="130" x2="640" y2="130" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- RQC on 60S -->
  <text x="650" y="84" font-size="15" font-weight="bold" fill="#0e6b66">3. Destroy the nascent chain</text>
  <ellipse cx="730" cy="140" rx="60" ry="32" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/><text x="730" y="145" font-size="12" text-anchor="middle" fill="#56655f">60S · peptidyl-tRNA</text>
  <path d="M790 140 C820 130 830 160 860 150" fill="none" stroke="#bd3a30" stroke-width="3"/>
  <text x="866" y="146" font-size="12" fill="#bd3a30">nascent</text><text x="866" y="160" font-size="12" fill="#bd3a30">chain</text>
  <rect x="650" y="200" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="710" y="220" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">NEMF</text>
  <rect x="780" y="200" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="840" y="220" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">LTN1</text>
  <text x="650" y="248" font-size="12" fill="#56655f">RQC complex (with TCF25): NEMF recruits the</text>
  <text x="650" y="263" font-size="12" fill="#56655f">LTN1 E3, which ubiquitinates the chain</text>
  <rect x="650" y="285" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="710" y="305" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">ANKZF1</text>
  <text x="780" y="298" font-size="12" fill="#56655f">releases the chain</text><text x="780" y="312" font-size="12" fill="#56655f">from tRNA</text>
  <rect x="650" y="335" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="710" y="355" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">VCP</text>
  <line x1="770" y1="350" x2="820" y2="350" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="826" y="355" font-size="13" fill="#15201e">proteasome</text>
  <!-- footer band -->
  <rect x="30" y="410" width="900" height="80" rx="8" fill="#e8f1ee"/>
  <text x="50" y="440" font-size="14" fill="#15201e">All 12 RQC genes are reviewed. Every row using an RQC-specific GO term was accepted or added (97 rows):</text>
  <text x="50" y="464" font-size="13" fill="#0e6b66" font-family="Menlo, monospace">GO:0072344 rescue of stalled cytosolic ribosome · GO:1990112 RQC complex · GO:0180022 RQC-trigger complex</text>
  <text x="50" y="482" font-size="13" fill="#0e6b66" font-family="Menlo, monospace">GO:1990116 ribosome-associated ubiquitin-dependent protein catabolic process · GO:0032790 ribosome disassembly</text>
</svg>
