<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker></defs>
  <line x1="480" y1="30" x2="480" y2="490" stroke="#dcefec" stroke-width="2"/>
  <!-- Panel A: pom1 -->
  <text x="30" y="40" font-size="17" font-weight="600" fill="#0e6b66">A. Localization crosses a subfamily</text>
  <text x="30" y="62" font-size="13" fill="#56655f">PTHR24058 dual-specificity kinases · node PTN008603465</text>
  <g stroke="#8fa39c" stroke-width="2" fill="none">
    <path d="M60 250 H110 V160 H200"/><path d="M110 250 V340 H200"/>
  </g>
  <circle cx="110" cy="250" r="10" fill="#0e6b66"/>
  <text x="46" y="285" font-size="12" fill="#0e6b66">IBD node</text>
  <rect x="200" y="135" width="230" height="50" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="214" y="157" font-size="14" font-weight="600" fill="#15201e">SF35 · human DYRK3 (seed)</text>
  <text x="214" y="175" font-size="12" fill="#56655f">cytoskeleton: a DYRK3 property</text>
  <rect x="200" y="315" width="230" height="50" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="1.6"/>
  <text x="214" y="337" font-size="14" font-weight="600" fill="#15201e">SF132 · S. pombe Pom1</text>
  <text x="214" y="355" font-size="12" fill="#56655f">cortical / plasma-membrane kinase</text>
  <path d="M320 190 C360 240 360 260 330 308" stroke="#bd3a30" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="365" y="255" font-size="12" fill="#bd3a30">IBA GO:0005856</text>
  <rect x="30" y="410" width="410" height="62" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="46" y="435" font-size="14" font-weight="600" fill="#bd3a30">REMOVE</text>
  <text x="46" y="457" font-size="13" fill="#15201e">Same pattern: rqh1 cytoplasm (RecQ, SF153; seeds SF105/152)</text>
  <!-- Panel B: mid1 -->
  <text x="510" y="40" font-size="17" font-weight="600" fill="#0e6b66">B. Ancestral function split between paralogs</text>
  <text x="510" y="62" font-size="13" fill="#56655f">anillins · node PTN001853010</text>
  <rect x="600" y="90" width="260" height="58" rx="8" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="730" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">ancestral anillin</text>
  <text x="730" y="133" text-anchor="middle" font-size="12" fill="#15201e">septin ring organization (fly, worm seeds)</text>
  <g stroke="#8fa39c" stroke-width="2" fill="none"><path d="M730 148 V190 H620 V230"/><path d="M730 190 H840 V230"/></g>
  <rect x="520" y="230" width="200" height="80" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="1.6"/>
  <text x="620" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Mid1</text>
  <text x="620" y="276" text-anchor="middle" font-size="12" fill="#15201e">positions the</text>
  <text x="620" y="293" text-anchor="middle" font-size="12" fill="#15201e">actomyosin ring</text>
  <rect x="740" y="230" width="200" height="80" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="840" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Mid2</text>
  <text x="840" y="276" text-anchor="middle" font-size="12" fill="#15201e">organizes the</text>
  <text x="840" y="293" text-anchor="middle" font-size="12" fill="#15201e">septin ring</text>
  <text x="510" y="350" font-size="13" fill="#15201e">The propagation is not spurious at the family level;</text>
  <text x="510" y="370" font-size="13" fill="#15201e">the ancestral term just no longer describes mid1.</text>
  <rect x="510" y="410" width="420" height="62" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="526" y="435" font-size="14" font-weight="600" fill="#bd3a30">REMOVE (sub-functionalization)</text>
  <text x="526" y="457" font-size="13" fill="#15201e">KEEP_AS_NON_CORE also defensible for the IBA alone</text>
</svg>
