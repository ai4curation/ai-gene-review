<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-size="18" font-weight="600" fill="#0e6b66">Per-gene action on the 161 IBAs</text>
  <text x="510" y="44" font-size="18" font-weight="600" fill="#0e6b66">Triage flags (a row can carry several)</text>
  <g font-size="14" fill="#15201e">
    <text x="40" y="100">ACCEPT</text><rect x="220" y="84" width="230" height="24" fill="#1d8a4b"/><text x="420" y="101" fill="#ffffff">118</text>
    <text x="40" y="150">KEEP_AS_NON_CORE</text><rect x="220" y="134" width="61" height="24" fill="#0e6b66"/><text x="287" y="151">31</text>
    <text x="40" y="200">OVER_ANNOTATED</text><rect x="220" y="184" width="14" height="24" fill="#7657a3"/><text x="240" y="201">7</text>
    <text x="40" y="250">REMOVE</text><rect x="220" y="234" width="6" height="24" fill="#bd3a30"/><text x="232" y="251">3</text>
    <text x="40" y="300">MODIFY</text><rect x="220" y="284" width="4" height="24" fill="#b8620f"/><text x="230" y="301">2</text>
  </g>
  <g font-size="14" fill="#15201e">
    <text x="510" y="100">NO_UNIPROT_SEEDS</text><rect x="700" y="84" width="200" height="24" fill="#8fa39c"/><text x="870" y="101" fill="#ffffff">60</text>
    <text x="510" y="150">LOCALIZATION</text><rect x="700" y="134" width="193" height="24" fill="#b8620f"/><text x="863" y="151" fill="#ffffff">58</text>
    <text x="510" y="200">CROSS_SUBFAMILY</text><rect x="700" y="184" width="127" height="24" fill="#bd3a30"/><text x="833" y="201">38</text>
    <text x="510" y="250">GENE_NO_SUBFAMILY</text><rect x="700" y="234" width="100" height="24" fill="#8fa39c"/><text x="806" y="251">30</text>
    <text x="510" y="300">none</text><rect x="700" y="284" width="80" height="24" fill="#1d8a4b"/><text x="786" y="301">24</text>
    <text x="510" y="350">SINGLE_NODE_SEED</text><rect x="700" y="334" width="50" height="24" fill="#dcefec" stroke="#8fa39c"/><text x="756" y="351">15</text>
    <text x="510" y="400">NODE_NOT_IN_IBD</text><rect x="700" y="384" width="23" height="24" fill="#dcefec" stroke="#8fa39c"/><text x="729" y="401">7</text>
  </g>
  <text x="40" y="380" font-size="14" fill="#15201e">149 of 161 kept (ACCEPT or non-core).</text>
  <text x="40" y="404" font-size="14" fill="#15201e">All 3 REMOVEs were already made per gene.</text>
  <text x="40" y="470" font-size="13" fill="#56655f">Source: projects/PANTHER_IBA_REVIEW/iba_propagation.tsv. SINGLE_NODE_SEED counts provenance, not evidential strength.</text>
</svg>
