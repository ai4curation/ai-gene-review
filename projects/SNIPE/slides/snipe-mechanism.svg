<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">SNIPE cuts phage DNA as it is injected (phage lambda, E. coli)</text>
<g font-size="13">
<!-- phage -->
<polygon points="330,60 380,60 400,90 380,120 330,120 310,90" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="355" y="95" text-anchor="middle" fill="#0e6b66" font-weight="bold">λ</text>
<rect x="348" y="120" width="14" height="50" fill="#dcefec" stroke="#0e6b66"/>
<text x="410" y="80" fill="#15201e">phage λ capsid and tail</text>
<text x="410" y="98" fill="#56655f">gpJ tail tip binds LamB</text>
<!-- outer membrane -->
<rect x="30" y="170" width="900" height="30" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="40" y="190" fill="#56655f">outer membrane</text>
<rect x="335" y="165" width="40" height="40" rx="6" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
<text x="385" y="222" fill="#56655f">LamB</text>
<!-- periplasm -->
<text x="40" y="250" fill="#56655f">periplasm</text>
<!-- tape measure protein -->
<rect x="349" y="205" width="12" height="100" fill="#b8620f"/>
<text x="250" y="262" fill="#b8620f" font-weight="bold" text-anchor="end">gpH tape measure</text>
<text x="250" y="278" fill="#b8620f" text-anchor="end">protein (TMP)</text>
<!-- inner membrane -->
<rect x="30" y="300" width="900" height="36" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="40" y="324" fill="#56655f">inner membrane</text>
<rect x="320" y="294" width="30" height="48" rx="6" fill="#ffffff" stroke="#15201e" stroke-width="2"/>
<rect x="360" y="294" width="30" height="48" rx="6" fill="#ffffff" stroke="#15201e" stroke-width="2"/>
<text x="300" y="360" fill="#15201e" text-anchor="end">ManYZ</text>
<!-- SNIPE -->
<rect x="440" y="294" width="16" height="48" rx="4" fill="#0e6b66"/>
<text x="462" y="290" fill="#0e6b66" font-weight="bold">TM (aa 5-24)</text>
<path d="M448 342 C 448 370, 420 380, 405 385" stroke="#0e6b66" stroke-width="3" fill="none"/>
<ellipse cx="400" cy="395" rx="44" ry="20" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="400" y="400" text-anchor="middle" fill="#0e6b66" font-weight="bold">DUF4041</text>
<path d="M444 398 C 470 410, 480 430, 470 440" stroke="#0e6b66" stroke-width="3" fill="none"/>
<ellipse cx="440" cy="455" rx="48" ry="20" fill="#0e6b66"/>
<text x="440" y="460" text-anchor="middle" fill="#ffffff" font-weight="bold">GIY-YIG</text>
<!-- DNA -->
<path d="M355 342 C 355 380, 360 420, 380 450 C 395 470, 380 490, 360 505" stroke="#1d68b3" stroke-width="4" fill="none"/>
<text x="250" y="470" fill="#1d68b3" font-weight="bold" text-anchor="end">phage DNA</text>
<text x="250" y="486" fill="#1d68b3" text-anchor="end">entering cytoplasm</text>
<g stroke="#bd3a30" stroke-width="3"><line x1="378" y1="440" x2="398" y2="456"/><line x1="398" y1="440" x2="378" y2="456"/></g>
<text x="40" y="440" fill="#56655f">cytoplasm</text>
<!-- annotations -->
<rect x="560" y="220" width="370" height="230" rx="10" fill="#ffffff" stroke="#8fa39c"/>
<text x="575" y="246" font-weight="bold" fill="#15201e">1. SNIPE pre-associates with ManYZ</text>
<text x="575" y="264" fill="#56655f">before infection</text>
<text x="575" y="294" font-weight="bold" fill="#15201e">2. DUF4041 binds the TMP and DNA</text>
<text x="575" y="312" fill="#56655f">placing the nuclease at the injection site</text>
<text x="575" y="342" font-weight="bold" fill="#15201e">3. GIY-YIG cleaves incoming DNA</text>
<text x="575" y="360" fill="#56655f">catalytic residue E414</text>
<text x="575" y="390" font-weight="bold" fill="#1d8a4b">4. Direct defence: the cell survives</text>
<text x="575" y="408" fill="#56655f">unlike abortive infection systems</text>
<text x="575" y="436" fill="#56655f">Schematic; positions not to scale.</text>
</g>
</svg>
