<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M5,0 L5,10" stroke="#bd3a30" stroke-width="3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="bold" fill="#15201e">The Arabidopsis heat stress cascade (10 reviewed genes)</text>

  <!-- heat input -->
  <rect x="24" y="210" width="110" height="70" rx="10" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="79" y="240" font-size="18" text-anchor="middle" fill="#bd3a30" font-weight="bold">Heat</text>
  <text x="79" y="262" font-size="13" text-anchor="middle" fill="#56655f">misfolded proteins</text>

  <!-- chaperone holding HSFA1 (repression) -->
  <rect x="180" y="70" width="210" height="80" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="285" y="100" font-size="16" text-anchor="middle" fill="#15201e" font-weight="bold">HSC70-1 · HSP90.1</text>
  <text x="285" y="122" font-size="13" text-anchor="middle" fill="#56655f">bind and hold HSFA1s inactive</text>
  <text x="285" y="140" font-size="13" text-anchor="middle" fill="#56655f">(negative feedback)</text>

  <!-- HSFA1 masters -->
  <rect x="180" y="200" width="210" height="90" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="285" y="230" font-size="17" text-anchor="middle" fill="#0e6b66" font-weight="bold">HSFA1A / B / D</text>
  <text x="285" y="252" font-size="13" text-anchor="middle" fill="#15201e">master regulators</text>
  <text x="285" y="272" font-size="13" text-anchor="middle" fill="#56655f">(HSFA1E: osmotic/salt bias)</text>

  <!-- arrows heat -> chaperones titrated away; heat -> HSFA1 -->
  <line x1="134" y1="245" x2="176" y2="245" stroke="#0e6b66" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="285" y1="152" x2="285" y2="196" stroke="#bd3a30" stroke-width="3" marker-end="url(#bar)"/>
  <text x="296" y="180" font-size="12" fill="#bd3a30">release on heat</text>

  <!-- amplifiers -->
  <rect x="470" y="130" width="190" height="70" rx="10" fill="#dcefec" stroke="#0e6b66"/>
  <text x="565" y="160" font-size="17" text-anchor="middle" fill="#0e6b66" font-weight="bold">HSFA2</text>
  <text x="565" y="182" font-size="13" text-anchor="middle" fill="#56655f">amplifier, heat memory</text>

  <rect x="470" y="280" width="190" height="70" rx="10" fill="#dcefec" stroke="#0e6b66"/>
  <text x="565" y="310" font-size="17" text-anchor="middle" fill="#0e6b66" font-weight="bold">DREB2A</text>
  <text x="565" y="332" font-size="13" text-anchor="middle" fill="#56655f">heat + drought integrator</text>

  <rect x="740" y="280" width="190" height="70" rx="10" fill="#dcefec" stroke="#0e6b66"/>
  <text x="835" y="310" font-size="17" text-anchor="middle" fill="#0e6b66" font-weight="bold">HSFA3</text>
  <text x="835" y="332" font-size="13" text-anchor="middle" fill="#56655f">memory (with HSFA2)</text>

  <line x1="390" y1="230" x2="466" y2="175" stroke="#0e6b66" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="390" y1="262" x2="466" y2="310" stroke="#0e6b66" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="660" y1="315" x2="736" y2="315" stroke="#0e6b66" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M660,165 C760,165 835,200 835,276" fill="none" stroke="#8fa39c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="760" y="190" font-size="12" fill="#56655f">heteromers</text>

  <!-- chaperone output -->
  <rect x="470" y="420" width="460" height="74" rx="10" fill="#fff4e8" stroke="#b8620f"/>
  <text x="700" y="448" font-size="17" text-anchor="middle" fill="#b8620f" font-weight="bold">HSP101 disaggregase · HSP70 · HSP90 · sHSPs</text>
  <text x="700" y="472" font-size="13" text-anchor="middle" fill="#56655f">induced chaperones refold and disaggregate proteins → thermotolerance</text>
  <line x1="330" y1="292" x2="480" y2="416" stroke="#0e6b66" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="565" y1="202" x2="565" y2="250" stroke="#0e6b66" stroke-width="0"/>
  <path d="M470,457 C200,457 110,380 90,284" fill="none" stroke="#8fa39c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="170" y="440" font-size="12" fill="#56655f">clears misfolded protein</text>
</svg>
