<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Each review should place its gene on one chain</text>
  <text x="30" y="56" font-size="13" fill="#56655f">stimulus → sensor / transducer → downstream axis → phenotype or context</text>
  <!-- cell outline -->
  <rect x="190" y="80" width="560" height="400" rx="40" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="206" y="104" font-size="12" fill="#56655f">cell</text>
  <!-- stimuli -->
  <g font-size="13" fill="#15201e">
    <text x="30" y="110" font-weight="bold" fill="#0e6b66">STIMULUS</text>
    <text x="30" y="140">shear flow</text><text x="30" y="170">stretch</text><text x="30" y="200">membrane tension</text><text x="30" y="230">osmotic change</text><text x="30" y="290">matrix stiffness</text><text x="30" y="320">compression</text><text x="30" y="350">crowding</text>
  </g>
  <line x1="140" y1="180" x2="232" y2="180" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <line x1="140" y1="310" x2="232" y2="310" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- membrane sensors -->
  <rect x="236" y="130" width="190" height="104" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="248" y="152" font-size="14" font-weight="bold" fill="#0e6b66">1 Direct sensors</text>
  <text x="248" y="174" font-size="13" fill="#15201e">PIEZO1, PIEZO2 channels</text>
  <text x="248" y="194" font-size="13" fill="#15201e">TRPV4</text>
  <text x="248" y="214" font-size="13" fill="#15201e">PKD1/PKD2 (cilium, flow)</text>
  <!-- adhesion -->
  <rect x="236" y="262" width="190" height="104" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="248" y="284" font-size="14" font-weight="bold" fill="#0e6b66">2 Adhesion coupling</text>
  <text x="248" y="306" font-size="13" fill="#15201e">ITGB1, ITGA5 integrins</text>
  <text x="248" y="326" font-size="13" fill="#15201e">TLN1, VCL, PXN, PTK2, ILK</text>
  <!-- cytoskeleton -->
  <rect x="460" y="262" width="150" height="104" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="472" y="284" font-size="14" font-weight="bold" fill="#0e6b66">3 Cytoskeleton</text>
  <text x="472" y="306" font-size="13" fill="#15201e">RHOA, ROCK1/2</text>
  <text x="472" y="326" font-size="13" fill="#15201e">MYH9, FLNA, ACTN4</text>
  <line x1="428" y1="314" x2="456" y2="314" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- nucleus -->
  <ellipse cx="660" cy="180" rx="78" ry="68" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="660" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">4 Nucleus</text>
  <text x="660" y="180" font-size="13" text-anchor="middle" fill="#15201e">LMNA</text>
  <text x="660" y="198" font-size="13" text-anchor="middle" fill="#15201e">SUN1/2, SYNE1/2</text>
  <text x="660" y="216" font-size="13" text-anchor="middle" fill="#15201e">EMD</text>
  <line x1="600" y1="262" x2="625" y2="240" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- effectors -->
  <rect x="460" y="392" width="270" height="72" rx="8" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  <text x="472" y="414" font-size="14" font-weight="bold" fill="#1d68b3">5 Downstream effectors</text>
  <text x="472" y="436" font-size="13" fill="#15201e">YAP1, WWTR1, LATS1/2 (Hippo)</text>
  <text x="472" y="454" font-size="13" fill="#15201e">MRTFA/SRF, MAPK, MTOR, SMAD</text>
  <line x1="535" y1="368" x2="560" y2="388" stroke="#1d68b3" stroke-width="3" marker-end="url(#a)"/>
  <line x1="430" y1="200" x2="580" y2="200" stroke="#0e6b66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="192" font-size="12" fill="#0e6b66">Ca²⁺ influx</text>
  <!-- ECM -->
  <rect x="236" y="396" width="190" height="68" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="248" y="418" font-size="14" font-weight="bold" fill="#b8620f">6 Matrix modifiers</text>
  <text x="248" y="440" font-size="13" fill="#15201e">FN1, LOX, SPARC, DCN</text>
  <!-- phenotype -->
  <text x="780" y="110" font-size="13" font-weight="bold" fill="#0e6b66">CONTEXT</text>
  <g font-size="13" fill="#15201e"><text x="780" y="140">endothelial flow</text><text x="780" y="165">kidney cilia</text><text x="780" y="190">fibrosis</text><text x="780" y="215">cancer invasion</text><text x="780" y="240">cartilage, bone,</text><text x="780" y="258">muscle</text></g>
  <line x1="734" y1="428" x2="800" y2="280" stroke="#1d68b3" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="505" font-size="13" fill="#56655f">Guardrail: modules 5 and 6 are usually downstream context, not sensors, unless the upstream mechanical link is shown.</text>
</svg>
