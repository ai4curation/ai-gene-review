<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .hdr { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    .panel-title { font-size: 13px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 10.5px; fill: #475569; }
    .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 10.5px; }
    .bad-box { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; rx: 5; }
    .good-box { fill: #f0fdfa; stroke: #0e6b66; stroke-width: 1.5; rx: 5; }
    .bad-txt { font-size: 10.5px; font-weight: 700; fill: #be123c; }
    .good-txt { font-size: 10.5px; font-weight: 700; fill: #0f766e; }
    .lbl { font-size: 10px; fill: #334155; }
  </style>

  <text x="15" y="18" class="hdr">Three Experimental Knockout Phenotypes Broken in Raw iMM904 — Rescued by Applying Curated GO Reviews</text>

  <!-- Panel 1: GPD1 / GPD2 Anaerobic Glycerol -->
  <g transform="translate(15, 28)">
    <rect width="286" height="265" class="panel"/>
    <text x="14" y="24" class="panel-title">1. Anaerobic Glycerol (GPD1 / GPD2)</text>
    <text x="14" y="41" class="sub">PMID:9171333: single Δ viable; double Δ lethal</text>

    <rect x="14" y="52" width="258" height="92" class="bad-box"/>
    <text x="24" y="69" class="bad-txt">Unmodified iMM904 (Broken)</text>
    <text x="24" y="85" class="lbl">• G3PD1ir = YDL022W (GPD1) only</text>
    <text x="24" y="100" class="lbl">• GPD2 stranded in mito G3PD1irm</text>
    <text x="24" y="115" class="lbl">• 3 anaerobic loops dump NADH → succ</text>
    <text x="24" y="133" class="mono" fill="#be123c">WT EX_glyc_e = 0.00 | gpd1Δ max = 0.00</text>

    <rect x="14" y="154" width="258" height="98" class="good-box"/>
    <text x="24" y="171" class="good-txt">After GPD1/GPD2 Review Repair</text>
    <text x="24" y="187" class="lbl">• G3PD1ir GPR → YDL022W or YOL059W</text>
    <text x="24" y="202" class="lbl">• Close GCY1/DAK, anaerobic FRDm, GLT1</text>
    <text x="24" y="220" class="mono" fill="#0f766e">WT EX_glyc_e = 1.31 mmol/gDW/h</text>
    <text x="24" y="236" class="mono" fill="#0f766e">gpd1Δ: 1.31 | gpd2Δ: 1.31 | ΔΔ: 0.00</text>
  </g>

  <!-- Panel 2: DAL3 / DUR1,2 Allantoin Catabolism -->
  <g transform="translate(317, 28)">
    <rect width="286" height="265" class="panel"/>
    <text x="14" y="24" class="panel-title">2. Allantoin Nitrogen (DAL3 / DUR1,2)</text>
    <text x="14" y="41" class="sub">Yeast DAL3 is lyase (EC 4.3.2.3) → urea</text>

    <rect x="14" y="52" width="258" height="92" class="bad-box"/>
    <text x="24" y="69" class="bad-txt">Unmodified iMM904 (Broken)</text>
    <text x="24" y="85" class="lbl">• Models UGLYCH (DAL3) as bacterial</text>
    <text x="24" y="100" class="lbl">  amidohydrolase (EC 3.5.3.19):</text>
    <text x="24" y="115" class="mono" fill="#334155">  urdglyc → glx + 2 nh4 + co2</text>
    <text x="24" y="133" class="mono" fill="#be123c">dur1,2Δ growth = 0.2900 h⁻¹ (100% WT!)</text>

    <rect x="14" y="154" width="258" height="98" class="good-box"/>
    <text x="24" y="171" class="good-txt">After DAL3 / DUR1,2 Review Repair</text>
    <text x="24" y="187" class="lbl">• Fix UGLYCH to GO:0004850 lyase:</text>
    <text x="24" y="202" class="mono" fill="#334155">  urdglyc_c → glx_c + urea_c</text>
    <text x="24" y="220" class="mono" fill="#0f766e">WT on allantoin  = 0.2895 h⁻¹</text>
    <text x="24" y="236" class="mono" fill="#0f766e">dal3Δ = 0.0000   | dur1,2Δ = 0.0000 h⁻¹</text>
  </g>

  <!-- Panel 3: BNA3 vs BNA7 De Novo NAD+ Synthesis -->
  <g transform="translate(619, 28)">
    <rect width="286" height="265" class="panel"/>
    <text x="14" y="24" class="panel-title">3. De Novo NAD⁺ (BNA3 vs. BNA7)</text>
    <text x="14" y="41" class="sub">PMID:18205391: BNA7 is formamidase (3.5.1.9)</text>

    <rect x="14" y="52" width="258" height="92" class="bad-box"/>
    <text x="24" y="69" class="bad-txt">Unmodified iMM904 (Broken)</text>
    <text x="24" y="85" class="lbl">• Orphan bacterial ASPOcm + QULNS</text>
    <text x="24" y="100" class="lbl">  bypasses entire BNA1..6 pathway</text>
    <text x="24" y="115" class="lbl">• FKYNH assigned to BNA3 (YJL060W)</text>
    <text x="24" y="133" class="mono" fill="#be123c">bna3Δ blocks FKYNH | bna7Δ = no effect</text>

    <rect x="14" y="154" width="258" height="98" class="good-box"/>
    <text x="24" y="171" class="good-txt">After BNA3 Review Repair</text>
    <text x="24" y="187" class="lbl">• Close prokaryotic ASPOcm / QULNS</text>
    <text x="24" y="202" class="lbl">• Reassign FKYNH → YDR428C (BNA7)</text>
    <text x="24" y="220" class="mono" fill="#0f766e">bna3Δ NAD⁺ flux = 0.528 (prototroph)</text>
    <text x="24" y="236" class="mono" fill="#0f766e">bna7Δ NAD⁺ flux = 0.000 (auxotroph)</text>
  </g>

  <!-- Bottom Banner: ChatGEM Regex Bug vs AST E-Flux Compiler -->
  <text x="15" y="318" class="hdr">Discovering &amp; Fixing ChatGEM's E-Flux GPR Parser Bug → Derived CONSTRAINT_BASED Module Compiler</text>
  <g transform="translate(15, 326)">
    <rect width="435" height="132" class="bad-box"/>
    <text x="14" y="22" class="bad-txt">PNNL ChatGEM 46._automatic_E_flux.py (Regex + Stack Bug)</text>
    <text x="14" y="42" class="lbl">Splits GPR via re.split(r'(\band\b|\bor\b|\(|\))') and collapses</text>
    <text x="14" y="57" class="lbl">without operator precedence (`max(stack)` at end):</text>
    <text x="14" y="79" class="mono" fill="#be123c">1. "(HXK1 or HXK2) and PFK2" → 1.00 (True AST: 0.20, +400% err)</text>
    <text x="14" y="97" class="mono" fill="#be123c">2. "(PFK1 and PFK2) or (GPD1 and GPD2)" → max=0.20 (True: 0.35)</text>
    <text x="14" y="115" class="lbl">Overestimates multi-subunit complexes; underestimates isozyme complexes</text>
  </g>

  <g transform="translate(470, 326)">
    <rect width="435" height="132" class="good-box"/>
    <text x="14" y="22" class="good-txt">ai-gene-review AST E-Flux + Module FBA (module_fba.py)</text>
    <text x="14" y="42" class="lbl">Recursive AST (`ast.BoolOp`) + direct compilation from module YAML:</text>
    <text x="14" y="57" class="lbl">• PROTEIN_COMPLEX active_units → all_of (min subunit abundance)</text>
    <text x="14" y="72" class="lbl">• variant_sets isozymes → any_of (sum of isozyme abundances)</text>
    <text x="14" y="92" class="mono" fill="#0f766e">just validate-modules runs COBRApy LP + E-Flux in CI:</text>
    <text x="14" y="110" class="mono" fill="#0f766e">19 reactions · 13 scenarios · 51 quantitative assertions PASS</text>
  </g>
</svg>
