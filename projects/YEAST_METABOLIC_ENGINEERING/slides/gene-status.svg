<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .hdr { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .card-ok { fill: #f0fdfa; stroke: #0e6b66; stroke-width: 1.6; rx: 6; }
    .card-fix { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; rx: 6; }
    .card-mod { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 6; }
    .sym { font-size: 13.5px; font-weight: 800; fill: #0f172a; }
    .ec { font-size: 10px; fill: #0e6b66; font-family: 'SF Mono', Menlo, monospace; font-weight: 700; }
    .ec-warn { font-size: 10px; fill: #be123c; font-family: 'SF Mono', Menlo, monospace; font-weight: 700; }
    .role { font-size: 10.5px; fill: #334155; }
    .tag-ok { fill: #ccfbf1; rx: 3; }
    .tag-ok-txt { font-size: 9px; font-weight: 700; fill: #0f766e; text-anchor: middle; }
    .tag-fix { fill: #ffe4e6; rx: 3; }
    .tag-fix-txt { font-size: 9px; font-weight: 700; fill: #be123c; text-anchor: middle; }
    .bar-lbl { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .bar-num { font-size: 11px; font-weight: 700; fill: #0f172a; font-family: 'SF Mono', Menlo, monospace; }
  </style>

  <!-- Top bar: 540 reviewed iMM904 genes alignment summary -->
  <text x="15" y="18" class="hdr">Proteome-wide EC &amp; GPR Alignment Across 540 Reviewed S. cerevisiae Genes in iMM904</text>
  <g transform="translate(15, 26)">
    <!-- Stacked bar of 540 genes (width = 890px) -->
    <!-- EXACT_MATCH: 234 (43.3%) -> 386px -->
    <rect x="0" y="0" width="386" height="26" fill="#0e6b66" rx="4"/>
    <text x="193" y="17" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">EXACT_MATCH: 234 (43.3%)</text>
    <!-- SAME_CLASS_DIFF: 155 (28.7%) -> 255px -->
    <rect x="388" y="0" width="255" height="26" fill="#0284c7"/>
    <text x="515" y="17" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Sub-class diff: 155 (28.7%)</text>
    <!-- MODEL_MISSING_EC: 88 (16.3%) -> 145px -->
    <rect x="645" y="0" width="145" height="26" fill="#94a3b8"/>
    <text x="717" y="17" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">No GEM EC: 88 (16.3%)</text>
    <!-- CLASS_CHANGE: 26 (4.8%) -> 45px -->
    <rect x="792" y="0" width="45" height="26" fill="#dc2626"/>
    <text x="814" y="17" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">26</text>
    <!-- Complex + Translocase + Other: 37 (6.9%) -> 53px -->
    <rect x="839" y="0" width="51" height="26" fill="#f59e0b" rx="4"/>
    <text x="864" y="17" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">37</text>

    <text x="814" y="39" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">4.8% True Class Change</text>
    <text x="400" y="39" font-size="10" fill="#475569">AST filter separates 10 complex-subunit propagations (CAT5, COQ4/6, ETR1, HTD2, OAR1, LYS5) &amp; EC 7 translocases from 26 true top-level EC conflicts</text>
  </g>

  <text x="15" y="86" class="hdr">16 Reviewed Central-Carbon &amp; Paralog Genes + 4 Key Metabolic Audit Cases (100% Complete)</text>

  <!-- Row 1: Upper Glycolysis -->
  <g transform="translate(15, 95)">
    <rect width="215" height="82" class="card-ok"/>
    <text x="10" y="20" class="sym">HXK2 · HXK1 · GLK1</text>
    <rect x="148" y="7" width="58" height="16" class="tag-ok"/><text x="177" y="18" class="tag-ok-txt">3 REVIEWED</text>
    <text x="10" y="36" class="ec">EC 2.7.1.1 / 2.7.1.2</text>
    <text x="10" y="52" class="role">GOA: 3'-UTR RNA binding → NON_CORE</text>
    <text x="10" y="67" class="role">iMM904: GLUK carries 87% via β-G6P</text>
  </g>

  <g transform="translate(240, 95)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">PFK1 · PFK2</text>
    <rect x="148" y="7" width="58" height="16" class="tag-fix"/><text x="177" y="18" class="tag-fix-txt">GPR + FLUX</text>
    <text x="10" y="36" class="ec-warn">EC 2.7.1.11 · α4β4 complex</text>
    <text x="10" y="52" class="role">iMM904: PFK=0 (detours via PFK_3/FBA3)</text>
    <text x="10" y="67" class="role">Strict AND kills single pfk1Δ / pfk2Δ</text>
  </g>

  <g transform="translate(465, 95)">
    <rect width="215" height="82" class="card-ok"/>
    <text x="10" y="20" class="sym">FBA1</text>
    <rect x="148" y="7" width="58" height="16" class="tag-ok"/><text x="177" y="18" class="tag-ok-txt">REVIEWED</text>
    <text x="10" y="36" class="ec">EC 4.1.2.13 · Essential</text>
    <text x="10" y="52" class="role">Class II Zn²⁺ F1,6BP aldolase</text>
    <text x="10" y="67" class="role">iMM904 FBA3 (S1,7BP) bypasses FBA</text>
  </g>

  <g transform="translate(690, 95)">
    <rect width="215" height="82" class="card-ok"/>
    <text x="10" y="20" class="sym">TDH3 · TDH2 · TDH1</text>
    <rect x="148" y="7" width="58" height="16" class="tag-ok"/><text x="177" y="18" class="tag-ok-txt">3 REVIEWED</text>
    <text x="10" y="36" class="ec">EC 1.2.1.12 · GAPDH</text>
    <text x="10" y="52" class="role">E-Flux: TDH3 supplies 82% of YPD cap.</text>
    <text x="10" y="67" class="role">GOA: RNA binding → KEEP_AS_NON_CORE</text>
  </g>

  <!-- Row 2: Pyruvate / Ethanol / PDH Bypass / Glycerol -->
  <g transform="translate(15, 190)">
    <rect width="215" height="82" class="card-ok"/>
    <text x="10" y="20" class="sym">PDC1 · PDC5 · PDC6</text>
    <rect x="148" y="7" width="58" height="16" class="tag-ok"/><text x="177" y="18" class="tag-ok-txt">3 REVIEWED</text>
    <text x="10" y="36" class="ec">EC 4.1.1.1 · Pyruvate decarb.</text>
    <text x="10" y="52" class="role">GOA: Root IEA (GO:0003824/0008152)</text>
    <text x="10" y="67" class="role">marked MODIFY → specific GO:0004737</text>
  </g>

  <g transform="translate(240, 190)">
    <rect width="215" height="82" class="card-ok"/>
    <text x="10" y="20" class="sym">ADH1 · ADH2</text>
    <rect x="148" y="7" width="58" height="16" class="tag-ok"/><text x="177" y="18" class="tag-ok-txt">2 REVIEWED</text>
    <text x="10" y="36" class="ec">EC 1.1.1.1 · Opposing roles</text>
    <text x="10" y="52" class="role">ADH1: glucose fermentation (→ EtOH)</text>
    <text x="10" y="67" class="role">ADH2: glucose-repressed EtOH oxid.</text>
  </g>

  <g transform="translate(465, 190)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">GPD1 · GPD2</text>
    <rect x="148" y="7" width="58" height="16" class="tag-fix"/><text x="177" y="18" class="tag-fix-txt">GEM + GOA</text>
    <text x="10" y="36" class="ec-warn">EC 1.1.1.8 · Glycerol-3-P DH</text>
    <text x="10" y="52" class="role">GOA: GPD2 false nuclear IBA → REMOVE</text>
    <text x="10" y="67" class="role">iMM904: GPD2 stranded in mito G3PD1irm</text>
  </g>

  <g transform="translate(690, 190)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">GPP1 · GPP2</text>
    <rect x="148" y="7" width="58" height="16" class="tag-fix"/><text x="177" y="18" class="tag-fix-txt">PATHWAY DB</text>
    <text x="10" y="36" class="ec-warn">EC 3.1.3.21 · G3P phosphatase</text>
    <text x="10" y="52" class="role">YeastPathways PWY3O-48 mislabels as</text>
    <text x="10" y="67" class="role">"glycerol-1-P" vs sn-glycerol-3-P</text>
  </g>

  <!-- Row 3: Deep Metabolic Audit Cases Across Pathways & Species -->
  <text x="15" y="295" class="hdr">Cross-Pathway &amp; Cross-Species Discrepancies Uncovered by GEM ↔ GOA Audit</text>

  <g transform="translate(15, 304)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">BNA3 vs. BNA7</text>
    <rect x="138" y="7" width="68" height="16" class="tag-fix"/><text x="172" y="18" class="tag-fix-txt">6 RCA REMOVE</text>
    <text x="10" y="36" class="ec-warn">EC 2.6.1.7 vs. EC 3.5.1.9</text>
    <text x="10" y="52" class="role">YeastPathways + iMM904 assign FKYNH</text>
    <text x="10" y="67" class="role">to BNA3; PMID:18205391 proved BNA7</text>
  </g>

  <g transform="translate(240, 304)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">DAL3 + DUR1,2</text>
    <rect x="138" y="7" width="68" height="16" class="tag-fix"/><text x="172" y="18" class="tag-fix-txt">KO RESCUED</text>
    <text x="10" y="36" class="ec-warn">EC 4.3.2.3 vs. bacterial 3.5.3.19</text>
    <text x="10" y="52" class="role">iMM904 UGLYCH releases 2 NH4+ directly,</text>
    <text x="10" y="67" class="role">masking dur1,2Δ allantoin lethality</text>
  </g>

  <g transform="translate(465, 304)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">ERG26 · NSDHL</text>
    <rect x="138" y="7" width="68" height="16" class="tag-fix"/><text x="172" y="18" class="tag-fix-txt">8 GO REMOVE</text>
    <text x="10" y="36" class="ec-warn">EC 1.1.1.170 vs. BiGG 5.3.3.1</text>
    <text x="10" y="52" class="role">iMM904 &amp; Recon3D tag C-3 sterol DH /</text>
    <text x="10" y="67" class="role">decarboxylase as Δ-isomerase 5.3.3.1</text>
  </g>

  <g transform="translate(690, 304)">
    <rect width="215" height="82" class="card-fix"/>
    <text x="10" y="20" class="sym">rbsD · mdcD · HADHB</text>
    <rect x="138" y="7" width="68" height="16" class="tag-fix"/><text x="172" y="18" class="tag-fix-txt">3 GEM AUDIT</text>
    <text x="10" y="36" class="ec-warn">iML1515 · iRP911 · Recon3D</text>
    <text x="10" y="52" class="role">rbsD: UniRule lyase vs EC 5.4.99.62</text>
    <text x="10" y="67" class="role">mdcD: carboxylase vs decarboxylase</text>
  </g>

  <!-- Bottom: 3 Derived CONSTRAINT_BASED Executable Pathway Modules -->
  <text x="15" y="408" class="hdr">3 Curated Pathway Modules Compiled to Self-Validating CONSTRAINT_BASED FBA + E-Flux Models</text>

  <g transform="translate(15, 416)">
    <rect width="285" height="62" class="card-mod"/>
    <text x="12" y="20" class="sym">glycerol_metabolism.yaml</text>
    <text x="12" y="36" class="role">GPD1/GPD2 + GPP1/GPP2 · 5 scenarios</text>
    <text x="12" y="51" class="ec">YPD WT · NaCl E-Flux · Anaerobic · gpd1Δ · gpd1Δgpd2Δ</text>
  </g>

  <g transform="translate(317, 416)">
    <rect width="285" height="62" class="card-mod"/>
    <text x="12" y="20" class="sym">alcoholic_fermentation.yaml</text>
    <text x="12" y="36" class="role">14 enzymes (HXK..ADH) · 4 scenarios</text>
    <text x="12" y="51" class="ec">Aerobic Crabtree · Anaerobic · pdcΔ · adh1Δ→glyc</text>
  </g>

  <g transform="translate(620, 416)">
    <rect width="285" height="62" class="card-mod"/>
    <text x="12" y="20" class="sym">pdh_bypass_acetyl_coa_synthesis</text>
    <text x="12" y="36" class="role">PDC1/5/6 → ALD6 → ACS1/ACS2 · 4 scenarios</text>
    <text x="12" y="51" class="ec">Glucose · Ethanol · acs2Δ on Glc · acs1Δacs2Δ lethal</text>
  </g>
</svg>
