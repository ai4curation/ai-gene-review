<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0e6b66"/>
    </marker>
    <style>
      .met { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .met-end { fill: #f0fdfa; stroke: #0e6b66; stroke-width: 2; rx: 6; }
      .met-txt { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .met-sub { font-size: 10px; fill: #64748b; text-anchor: middle; }
      .enz-done { fill: #ccfbf1; stroke: #0e6b66; stroke-width: 1.8; rx: 5; }
      .enz-warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 5; }
      .enz-txt { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .enz-ec { font-size: 9.5px; fill: #334155; text-anchor: middle; font-family: 'SF Mono', Menlo, monospace; }
      .bug-box { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 4 2; rx: 5; }
      .bug-txt { font-size: 9.5px; font-weight: 600; fill: #9f1239; text-anchor: middle; }
      .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .flow-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 5 3; fill: none; marker-end: url(#arr-red); }
      .nad { stroke: #0e6b66; stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; marker-end: url(#arr-teal); }
      .nad-lbl { font-size: 10px; fill: #0e6b66; font-weight: 700; }
      .hdr { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <text x="440" y="18" class="hdr" text-anchor="middle">Upper glycolysis &amp; iMM904 detours</text>
  <text x="155" y="188" class="hdr" text-anchor="middle">Glycerol NADH sink (GPD2 bug)</text>
  <text x="720" y="218" class="hdr" text-anchor="middle">Lower glycolysis &amp; Ethanol / PDH bypass</text>

  <!-- Glucose -->
  <rect x="380" y="28" width="120" height="30" class="met"/>
  <text x="440" y="47" class="met-txt">D-Glucose</text>

  <!-- HXK1 / HXK2 / GLK1 -->
  <line x1="440" y1="58" x2="440" y2="74" class="flow"/>
  <rect x="345" y="76" width="190" height="36" class="enz-done"/>
  <text x="440" y="92" class="enz-txt">HXK2 · HXK1 · GLK1 (All Reviewed)</text>
  <text x="440" y="105" class="enz-ec">EC 2.7.1.1 / 2.7.1.2 · + non-core 3'-UTR RNA binding</text>
  <line x1="440" y1="112" x2="440" y2="128" class="flow"/>

  <!-- GLUK detour callout -->
  <rect x="555" y="74" width="235" height="38" class="bug-box"/>
  <text x="672" y="90" class="bug-txt">iMM904 artifact: GLUK (GLK1 only)</text>
  <text x="672" y="104" class="bug-txt">carries 87% of glucose via β-D-G6P</text>
  <line x1="555" y1="93" x2="535" y2="93" class="flow-red"/>

  <!-- G6P / F6P -->
  <rect x="360" y="130" width="160" height="28" class="met"/>
  <text x="440" y="148" class="met-txt">G6P ⇌ F6P (PGI1)</text>

  <!-- PFK1 / PFK2 -->
  <line x1="440" y1="158" x2="440" y2="174" class="flow"/>
  <rect x="345" y="176" width="190" height="38" class="enz-warn"/>
  <text x="440" y="192" class="enz-txt">PFK1 + PFK2 α4β4 (Reviewed)</text>
  <text x="440" y="206" class="enz-ec">EC 2.7.1.11 · iMM904 PFK flux = 0.0!</text>
  <line x1="440" y1="214" x2="440" y2="232" class="flow"/>

  <!-- PFK_3 / FBA3 detour callout -->
  <rect x="555" y="168" width="255" height="48" class="bug-box"/>
  <text x="682" y="184" class="bug-txt">iMM904 detour: 8.92 mmol/gDW/h routes via</text>
  <text x="682" y="197" class="bug-txt">rev-TALA → PFK_3 (S7P→S1,7BP) → FBA3</text>
  <text x="682" y="210" class="bug-txt">+ strict (PFK1 and PFK2) kills single Δ</text>
  <line x1="555" y1="195" x2="535" y2="195" class="flow-red"/>

  <!-- F1,6BP + FBA1 -->
  <rect x="355" y="234" width="170" height="32" class="met"/>
  <text x="440" y="249" class="met-txt">F1,6BP → (FBA1 / TPI1)</text>
  <text x="440" y="261" class="met-sub">DHAP ⇌ G3P</text>

  <!-- Branch left to DHAP -->
  <path d="M 355 250 L 220 250" class="flow"/>
  <!-- Branch right to G3P -->
  <path d="M 525 250 L 620 250" class="flow"/>

  <!-- LEFT: Glycerol branch -->
  <rect x="95" y="234" width="120" height="30" class="met"/>
  <text x="155" y="253" class="met-txt">DHAP</text>

  <line x1="155" y1="264" x2="155" y2="282" class="flow"/>
  <rect x="45" y="284" width="220" height="44" class="enz-warn"/>
  <text x="155" y="300" class="enz-txt">GPD1 (osmo) · GPD2 (anaerobic)</text>
  <text x="155" y="313" class="enz-ec">iMM904 strands GPD2 in mito G3PD1irm</text>
  <text x="155" y="324" class="enz-ec">GOA: GPD2 had false nuclear IBA (REMOVE)</text>
  <line x1="155" y1="328" x2="155" y2="346" class="flow"/>

  <rect x="90" y="348" width="130" height="28" class="met"/>
  <text x="155" y="366" class="met-txt">sn-Glycerol-3-P</text>

  <line x1="155" y1="376" x2="155" y2="392" class="flow"/>
  <rect x="45" y="394" width="220" height="38" class="enz-done"/>
  <text x="155" y="410" class="enz-txt">GPP1 (anaerobic) · GPP2 (osmo)</text>
  <text x="155" y="423" class="enz-ec">YeastPathways mislabels as "glycerol-1-P"</text>
  <line x1="155" y1="432" x2="155" y2="448" class="flow"/>

  <rect x="65" y="450" width="180" height="36" class="met-end"/>
  <text x="155" y="467" class="met-txt">Glycerol (EX_glyc_e)</text>
  <text x="155" y="480" class="met-sub">0.0 in raw iMM904 → 1.31 after repair</text>

  <!-- RIGHT: Lower glycolysis -->
  <rect x="625" y="234" width="110" height="30" class="met"/>
  <text x="680" y="253" class="met-txt">G3P</text>

  <line x1="680" y1="264" x2="680" y2="282" class="flow"/>
  <rect x="580" y="284" width="200" height="36" class="enz-done"/>
  <text x="680" y="300" class="enz-txt">TDH3 · TDH2 · TDH1 (Reviewed)</text>
  <text x="680" y="313" class="enz-ec">EC 1.2.1.12 · E-Flux: TDH3 = 82% cap.</text>
  <line x1="680" y1="320" x2="680" y2="338" class="flow"/>

  <!-- Pyruvate -->
  <rect x="615" y="340" width="130" height="28" class="met"/>
  <text x="680" y="358" class="met-txt">Pyruvate</text>

  <!-- PDC1 / PDC5 / PDC6 -->
  <line x1="680" y1="368" x2="680" y2="384" class="flow"/>
  <rect x="575" y="386" width="210" height="36" class="enz-done"/>
  <text x="680" y="402" class="enz-txt">PDC1 · PDC5 · PDC6 (Reviewed)</text>
  <text x="680" y="415" class="enz-ec">EC 4.1.1.1 · GOA root IEA → MODIFY</text>
  <line x1="680" y1="422" x2="680" y2="438" class="flow"/>

  <!-- Acetaldehyde -->
  <rect x="615" y="440" width="130" height="26" class="met"/>
  <text x="680" y="457" class="met-txt">Acetaldehyde</text>

  <!-- Split from Acetaldehyde to Ethanol (left) and Acetate/AcCoA (right) -->
  <path d="M 615 453 L 520 453" class="flow"/>
  <rect x="355" y="434" width="160" height="38" class="enz-done"/>
  <text x="435" y="450" class="enz-txt">ADH1 (ferment.) · ADH2 (resp.)</text>
  <text x="435" y="463" class="enz-ec">Opposite directionality captured in FBA</text>

  <path d="M 355 453 L 325 453" class="flow"/>
  <rect x="255" y="436" width="68" height="34" class="met-end"/>
  <text x="289" y="453" class="met-txt">Ethanol</text>
  <text x="289" y="465" class="met-sub">15.8 mmol</text>

  <!-- Right branch from Acetaldehyde: ALD6 -> ACS1/ACS2 -->
  <path d="M 745 453 L 775 453" class="flow"/>
  <rect x="778" y="434" width="132" height="38" class="enz-done"/>
  <text x="844" y="450" class="enz-txt">ALD6 → ACS1/ACS2</text>
  <text x="844" y="463" class="enz-ec">PDH bypass module</text>

  <!-- Cytosolic NADH/NAD+ coupling -->
  <path d="M 580 302 C 430 302, 420 305, 268 305" class="nad"/>
  <text x="435" y="295" class="nad-lbl" text-anchor="middle">Cytosolic NADH ⇌ NAD⁺ redox balance</text>
  <path d="M 580 308 C 500 355, 450 400, 435 432" class="nad"/>

  <!-- Legend -->
  <g transform="translate(265, 486)">
    <rect x="0" y="0" width="14" height="14" class="enz-done"/>
    <text x="20" y="11" font-size="11" fill="#334155">Reviewed in ai-gene-review + FBA module</text>
    <rect x="250" y="0" width="14" height="14" class="enz-warn"/>
    <text x="270" y="11" font-size="11" fill="#9f1239" font-weight="600">Major GEM or GOA discrepancy discovered &amp; fixed</text>
  </g>
</svg>
