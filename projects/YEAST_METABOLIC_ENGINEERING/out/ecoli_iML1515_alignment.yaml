      PFL/TdcE loop (RVSGYAV), and activase specificity follows the Gly-loop sequence
      (PMID:42361324; file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md). No experiment
      shows PflC activating PFL, and PFL is served by PflA. Aligned with the pflA/nrdG
      reviews (GO:0043365 is correct only when the substrate is PflB): the PflB-specific
      child is removed here, and the correct general activase activity GO:0043364
      is retained on the IBA and Rhea rows.'
