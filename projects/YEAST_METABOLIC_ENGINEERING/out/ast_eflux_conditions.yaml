input_levels_note: Synthetic per-gene levels chosen to exercise the parsers; they
  are not measured expression data and support no biological conclusion.
synthetic_input_levels:
  YGR240C: 0.8
  YMR205C: 0.2
  YDL022W: 0.15
  YOL059W: 0.95
  YFR053C: 0.1
  YGL253W: 0.9
  YCL040W: 0.15
  YKL060C: 0.0
gpr_parser_benchmark:
- case: PFK heterooctamer (AND)
  gpr: YGR240C and YMR205C
  correct_ast_capacity: 0.2
  chatgem_regex_capacity: 0.2
  discrepancy: 0.0
- case: Cytosolic GPD isozymes (OR)
  gpr: YDL022W or YOL059W
  correct_ast_capacity: 1.1
  chatgem_regex_capacity: 1.1
  discrepancy: 0.0
- case: Hexokinase isozymes (3-way OR)
  gpr: YFR053C or YGL253W or YCL040W
  correct_ast_capacity: 1.15
  chatgem_regex_capacity: 1.15
  discrepancy: 0.0
- case: Nested complex with isozyme subunits ((A or B) and C)
  gpr: (YFR053C or YGL253W) and YMR205C
  correct_ast_capacity: 0.2
  chatgem_regex_capacity: 1.0
  discrepancy: 0.8
- case: Alternative complexes ((A and B) or (C and D))
  gpr: (YGR240C and YMR205C) or (YDL022W and YOL059W)
  correct_ast_capacity: 0.35
  chatgem_regex_capacity: 0.2
  discrepancy: 0.15
