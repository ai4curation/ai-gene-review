    lipid-droplet locations, replace the categorical single-pass type II description with membrane-associated
    wording, and refine generic membrane rows to the already supported ER membrane. Neither the previous
    predicted topology nor the five-residue IF call is treated as direct insertion evidence.
  primary_pmids:
  - PMID:23741432
  - PMID:22560221
