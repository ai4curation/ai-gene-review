- gene: PNPLA2
  accession: Q96AD5
  source_row: 37
  author_evidence: Element
  review_yaml_changed: false
  assessment: Retain; correct interpretation of supplement
  rationale: 'The S20 text describes the predicted PNPLA2 element using a basic patch in PNPLA5. PMID:23741432
    directly distinguishes these mechanisms: PNPLA5/Brummer use basic residues, while human ATGL/PNPLA2
    uses a hydrophobic region, including deletion/truncation analyses around residues 320-360. The predicted
    345-354 segment lies within that region but does not map its full determinant or establish its geometry.
    Keep existing lipid-droplet annotations; do not transfer the PNPLA5 basic-patch mechanism.'
  primary_pmids:
  - PMID:23741432
