audit:
- gene: ACSL4
  accession: O60488
  source_row: 42
  author_evidence: Element
  review_yaml_changed: false
  assessment: Retain; homolog-based candidate
  rationale: PMID:22357706 studies ACSL3, not ACSL4, and favors an amphipathic helix embedded in the cytosolic
    ER leaflet. The ACSL4 N-terminal prediction is a plausible homolog-based candidate; it does not independently
    establish ACSL4 residue boundaries or choose between its ER, mitochondrial outer-membrane and other
    context-dependent pools. Retain the current membrane-associated description and locations.
  primary_pmids:
  - PMID:22357706
- gene: ADCK2
  accession: Q7Z695
  source_row: 33
  author_evidence: '?'
  review_yaml_changed: true
  assessment: Qualify inference; topology unresolved
  rationale: Human protease protection in PMID:31480808 permits matrix or inner-membrane association.
    The UniProt spanning-helix model and the S20 interfacial model describe the same hydrophobic region
    and are not independent evidence. Retain the existing provisional inner-membrane IC inference using
    membrane-contact prediction plus yeast Cqd1 evidence (PMID:37073556), but remove the argument that
    a demonstrated spanning helix forces that conclusion. Do not assign a membrane face. Carbonate extraction
    and human topology mapping remain needed.
  primary_pmids:
  - PMID:31480808
  - PMID:37073556
