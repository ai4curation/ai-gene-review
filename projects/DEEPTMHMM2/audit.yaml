- gene: DHRS3
  accession: O75911
  source_row: 46
  author_evidence: Element
  review_yaml_changed: true
  assessment: Correct topology from direct experiment
  rationale: PMID:30104359 reports cysteine scanning of DHRS3 and identifies a partially buried amphipathic
    helix in lipid-droplet monolayers and the ER cytoplasmic leaflet. Its abstract supplies direct topology
    evidence even though full text was not recovered. Replace the multi-pass biological description and
    annotation rationale, retain the ER membrane claim, and refine generic membrane to the existing ER
    and photoreceptor outer-segment membrane locations. Record the conflicting UniProt topology as a source
    defect. The predictor supports discovery of this paper; it is not the evidential basis of the correction.
  primary_pmids:
  - PMID:30104359
  - PMID:40519748
- gene: DPM1
  accession: O60762
  source_row: 23
  author_evidence: Peripheral
  review_yaml_changed: true
  assessment: Retain tethering mechanism; retain root ER
  rationale: The current review distinguishes human DPM1 from the membrane-spanning DPM3 tether. Keep
    that complex-mediated anchoring mechanism (PMID:16280320); S20 says no further structural evidence
    is available. The two IF calls are additional contact hypotheses, not evidence that DPM1 spans the
    membrane or that DPM3 tethering is dispensable. Correct root ER actions to ACCEPT alongside ER membrane.
    The prior local benchmark reproduces these S20 segments.
  primary_pmids:
  - PMID:16280320
  - PMID:9724629
- gene: GPAM
  accession: Q9HCL2
  source_row: 26
  author_evidence: Element
  review_yaml_changed: true
  assessment: Retain structural correction; retain root organelle
  rationale: The review already incorporates the human GPAT1 structure (PMID:36522428), whose abstract
    explicitly reports no transmembrane regions and identifies an amphipathic surface plus an N-terminal
    loop-helix anchor. S20 detects only one of the membrane-contact elements. Preserve that structural
    interpretation and restore root mitochondrion actions to ACCEPT. Existing PAINT node placement was
    retained; paint-losses found no IRD/IKR loss.
  primary_pmids:
  - PMID:36522428
