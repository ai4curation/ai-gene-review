  - PMID:36306796
- gene: COQ8B
  accession: Q96D53
  source_row: 35
  author_evidence: Peripheral
  review_yaml_changed: true
  assessment: Refine location from direct human evidence
  rationale: 'PMID:29194833 directly studies human COQ8B-HA in HEK293 mitochondria: protease protection
