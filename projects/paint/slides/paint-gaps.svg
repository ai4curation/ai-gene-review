<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker></defs>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0e6b66">How a human gene gets, or misses, an IBA</text>
  <!-- tree -->
  <g stroke="#8fa39c" stroke-width="2" fill="none">
    <path d="M60 270 H110 V140 H200"/><path d="M110 270 V400 H200"/>
    <path d="M200 140 H240 V95 H330"/><path d="M240 140 V185 H330"/>
    <path d="M200 400 H240 V355 H330"/><path d="M240 400 V445 H330"/>
  </g>
  <!-- IBD node -->
  <circle cx="200" cy="140" r="11" fill="#0e6b66"/>
  <text x="140" y="118" font-size="13" font-weight="600" fill="#0e6b66">IBD</text>
  <text x="120" y="170" font-size="11" fill="#56655f">curator places</text>
  <text x="120" y="184" font-size="11" fill="#56655f">function here</text>
  <circle cx="200" cy="400" r="9" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
  <text x="130" y="432" font-size="11" fill="#56655f">no MF IBD</text>
  <g font-size="13" fill="#15201e">
    <rect x="332" y="84" width="92" height="22" rx="4" fill="#dcefec" stroke="#0e6b66"/><text x="340" y="100">yeast (exp.)</text>
    <rect x="332" y="174" width="92" height="22" rx="4" fill="#dcefec" stroke="#0e6b66"/><text x="340" y="190">human</text>
    <rect x="332" y="344" width="92" height="22" rx="4" fill="#f4f7f6" stroke="#8fa39c"/><text x="340" y="360">mouse</text>
    <rect x="332" y="434" width="92" height="22" rx="4" fill="#f4f7f6" stroke="#8fa39c"/><text x="340" y="450">human</text>
  </g>
  <text x="432" y="190" font-size="13" font-weight="600" fill="#1d8a4b">gets IBA</text>
  <text x="432" y="450" font-size="13" font-weight="600" fill="#bd3a30">no IBA</text>
  <!-- right panel -->
  <g font-size="14" fill="#15201e">
    <rect x="540" y="70" width="380" height="120" rx="10" fill="#e8f1ee" stroke="#0e6b66"/>
    <text x="556" y="96" font-weight="600" fill="#0e6b66">What this project does</text>
    <text x="556" y="122">For each no-IBA human gene: 2 deep-research</text>
    <text x="556" y="142">reports + review of every existing GO row.</text>
    <text x="556" y="168">715 genes complete · 24,409 decisions.</text>
    <rect x="540" y="210" width="380" height="120" rx="10" fill="#ffffff" stroke="#b8620f"/>
    <text x="556" y="236" font-weight="600" fill="#b8620f">The list is stale</text>
    <text x="556" y="262">Most of the 2026-09-04 batch now receive</text>
    <text x="556" y="282">IBAs (PAINT IBDs dated 2022-2026).</text>
    <text x="556" y="308">The real gap: families with no MF IBD.</text>
    <rect x="540" y="350" width="380" height="120" rx="10" fill="#ffffff" stroke="#bd3a30"/>
    <text x="556" y="376" font-weight="600" fill="#bd3a30">A wrong node</text>
    <text x="556" y="402">PTHR48178 (PEX2): a Cdc73/Paf1 complex</text>
    <text x="556" y="422">IBD rests on PEX2's old synonym PAF1.</text>
    <text x="556" y="448">Family review verdict: WRONG_NODE.</text>
  </g>
</svg>
