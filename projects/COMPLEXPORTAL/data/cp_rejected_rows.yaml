- organism: human
  gene: SDHA
  qualifier: involved_in
  term:
    id: GO:0042776
    label: proton motive force-driven mitochondrial ATP synthesis
  evidence: NAS
  reference: PMID:30030361
  review_action: REMOVE
  review_summary: NAS annotation from ComplexPortal suggesting SDHA is involved in proton motive force-driven mitochondrial ATP synthesis. This annotation is problematic because Complex II does NOT pump
    protons across the inner mitochondrial membrane. Unlike Complexes I, III, and IV which translocate protons to generate the proton motive force, Complex II transfers electrons from succinate to ubiquinone
    without any proton pumping. Complex II contributes to ATP synthesis only indirectly by feeding reduced ubiquinol into the Q pool, which is then oxidized by Complex III (which does pump protons). Annotating
    SDHA with this term conflates electron donation to the Q pool with proton translocation.
  review_file: genes/human/SDHA/SDHA-ai-review.yaml
