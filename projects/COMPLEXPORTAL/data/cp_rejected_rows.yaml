  review_action: MODIFY
  review_summary: 'This row is NOT the ALA-export inference the other two GO:0006783 rows rest on, and needs its own argument. It is a ComplexPortal NAS assignment from PMID:30765471, which identified a
    crosslinking/MS-defined complex of ferrochelatase (FECH), ABCB7 and ABCB10 and titled it "required for heme biosynthesis". That curator was asserting complex-level participation via FECH - the terminal
    enzyme of the pathway - not that ABCB10 itself transports a heme intermediate, so rebutting ALA transport does not engage this evidence. The term is still wrong for ABCB10, on narrower grounds. An annotation
    inherited from a partner''s catalytic role is a complex-level attribution, and ABCB10''s own demonstrated contribution to hemoglobinization is regulatory: ATP-hydrolysis-dependent relief of Bach1 repression
    of the heme transcriptional programme, and stabilisation of mitoferrin-1 for mitochondrial iron import. GO:0070455 positive regulation of heme biosynthetic process, already on this gene by ISS, says
    that without asserting that ABCB10 carries out a step. The FECH association itself is not lost - it is carried by the complex-membership annotations this review retains, which is where a complex-level
    fact belongs.'
  review_file: genes/human/ABCB10/ABCB10-ai-review.yaml
