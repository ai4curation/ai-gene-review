<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Epe1: the domain says eraser, the biochemistry says recruiter</text>

  <!-- LEFT: predicted -->
  <rect x="24" y="54" width="400" height="404" rx="10" fill="#fbf1f0" stroke="#bd3a30"/>
  <text x="44" y="82" font-size="16" font-weight="bold" fill="#bd3a30">What the JmjC domain predicts</text>
  <!-- nucleosome -->
  <ellipse cx="160" cy="250" rx="70" ry="46" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="160" y="255" font-size="13" text-anchor="middle" fill="#15201e">nucleosome</text>
  <path d="M200 214 C 220 180, 240 170, 262 168" stroke="#15201e" stroke-width="2" fill="none"/>
  <text x="170" y="182" font-size="12" fill="#56655f">H3 tail</text>
  <circle cx="272" cy="166" r="11" fill="#7657a3"/><text x="272" y="170" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">me</text>
  <text x="290" y="160" font-size="12" fill="#15201e">K9me2/3</text>
  <!-- JmjC -->
  <rect x="250" y="250" width="150" height="70" rx="12" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="325" y="276" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">JmjC domain</text>
  <text x="325" y="296" font-size="12" text-anchor="middle" fill="#15201e">Fe(II) + 2-OG</text>
  <text x="325" y="312" font-size="12" text-anchor="middle" fill="#15201e">HxD…H motif</text>
  <path d="M300 250 L 280 184" stroke="#bd3a30" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="44" y="352" font-size="13" fill="#15201e">Annotated: histone demethylase (IBA),</text>
  <text x="44" y="370" font-size="13" fill="#15201e">H3K9 demethylase (IDA, EXP), H3K36 demethylase,</text>
  <text x="44" y="388" font-size="13" fill="#15201e">dioxygenase, oxidoreductase, metal ion binding</text>
  <g font-size="13" fill="#bd3a30" font-weight="bold">
    <text x="44" y="418">✗ triad is H-E-Y: His370 (Fe(II) ligand) is a Tyr</text>
    <text x="44" y="438">✗ no demethylation of H3K9me2/3 peptides (MS)</text>
  </g>

  <!-- RIGHT: actual -->
  <rect x="440" y="54" width="496" height="404" rx="10" fill="#eef7f1" stroke="#1d8a4b"/>
  <text x="460" y="82" font-size="16" font-weight="bold" fill="#1d8a4b">What Epe1 does: a non-enzymatic anti-silencing factor</text>
  <!-- heterochromatin -->
  <ellipse cx="560" cy="290" rx="62" ry="40" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <ellipse cx="700" cy="300" rx="62" ry="40" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="630" y="360" font-size="12" text-anchor="middle" fill="#56655f">heterochromatin boundary (H3K9me)</text>
  <rect x="520" y="200" width="80" height="40" rx="18" fill="#dcefec" stroke="#0e6b66"/>
  <text x="560" y="225" font-size="13" text-anchor="middle" font-weight="bold" fill="#0e6b66">Swi6/HP1</text>
  <path d="M560 240 L 560 252" stroke="#0e6b66" stroke-width="2"/>
  <!-- Epe1 -->
  <rect x="620" y="150" width="120" height="56" rx="14" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="680" y="175" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">Epe1</text>
  <text x="680" y="194" font-size="11" text-anchor="middle" fill="#56655f">JmjC-like, inactive</text>
  <path d="M620 190 L 602 212" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="578" y="186" font-size="12" fill="#15201e">binds</text>
  <!-- recruits -->
  <rect x="790" y="110" width="120" height="44" rx="14" fill="#1d68b3"/>
  <text x="850" y="137" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">SAGA (HAT)</text>
  <rect x="790" y="190" width="120" height="44" rx="14" fill="#1d68b3"/>
  <text x="850" y="217" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Bdf2</text>
  <path d="M740 170 L 786 136" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M740 185 L 786 208" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="750" y="181" font-size="11" fill="#15201e">recruits</text>
  <path d="M850 234 C 850 290, 800 300, 766 300" stroke="#1d68b3" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="780" y="340" font-size="12" fill="#1d68b3">acetylation,</text>
  <text x="780" y="356" font-size="12" fill="#1d68b3">nucleosome turnover</text>
  <g font-size="13" fill="#1d8a4b" font-weight="bold">
    <text x="460" y="398">✓ overexpressed H297A still disrupts silencing (SAGA-dependent)</text>
    <text x="460" y="418">✓ C-terminus alone (no JmjC) disrupts heterochromatin</text>
    <text x="460" y="438">✓ reader and recruiter, not eraser</text>
  </g>

  <rect x="24" y="470" width="912" height="40" rx="8" fill="#dcefec"/>
  <text x="36" y="495" font-size="13" fill="#15201e"><tspan font-weight="bold" fill="#bd3a30">REMOVE</tspan> all 7 catalytic and metal rows · replacements: GO:0042393 histone binding, GO:0140030 modification-dependent protein binding</text>
</svg>
