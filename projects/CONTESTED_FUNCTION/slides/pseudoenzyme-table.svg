<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Four pseudo-enzymes: fold kept, catalysis lost</text>
<text x="24" y="56" font-size="13" fill="#56655f">Actions as recorded in each review for the catalytic rows. What the protein does instead is in green.</text>
<rect x="24" y="80" width="912" height="34" fill="#dcefec"/>
<text x="32" y="102" font-size="14" font-weight="bold" fill="#15201e">Gene</text>
<text x="158" y="102" font-size="14" font-weight="bold" fill="#15201e">Domain</text>
<text x="318" y="102" font-size="14" font-weight="bold" fill="#15201e">Annotated activity</text>
<text x="538" y="102" font-size="14" font-weight="bold" fill="#15201e">What is missing</text>
<text x="748" y="102" font-size="14" font-weight="bold" fill="#15201e">Review action</text>
<rect x="24" y="114" width="912" height="88" fill="#ffffff" stroke="#c9d6d1"/>
<text x="32" y="144" font-size="16" font-weight="bold" fill="#15201e">Epe1</text><text x="32" y="164" font-size="12" fill="#56655f">SCHPO</text>
<text x="158" y="144" font-size="13" fill="#15201e">JmjC</text>
<text x="318" y="144" font-size="13" fill="#15201e">histone demethylase, dioxygenase</text>
<text x="538" y="144" font-size="13" fill="#15201e">H297-E299-Y370; Fe(II) His lost</text>
<text x="748" y="144" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE ×4</text><text x="748" y="162" font-size="11" fill="#56655f">UNDECIDED ×3</text>
<text x="158" y="180" font-size="13" fill="#1d8a4b">what it does: chromatin reader; recruits SAGA and Bdf2</text>
<rect x="24" y="202" width="912" height="88" fill="#ffffff" stroke="#c9d6d1"/>
<text x="32" y="232" font-size="16" font-weight="bold" fill="#15201e">eryCII</text><text x="32" y="252" font-size="12" fill="#56655f">SACEN</text>
<text x="158" y="232" font-size="13" fill="#15201e">cytochrome P450</text>
<text x="318" y="232" font-size="13" fill="#15201e">monooxygenase, heme, iron</text>
<text x="538" y="232" font-size="13" fill="#15201e">no heme-ligating Cys</text>
<text x="748" y="232" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE ×4</text>
<text x="158" y="268" font-size="13" fill="#1d8a4b">what it does: activates the EryCIII glycosyltransferase</text>
<rect x="24" y="290" width="912" height="88" fill="#ffffff" stroke="#c9d6d1"/>
<text x="32" y="320" font-size="16" font-weight="bold" fill="#15201e">pqsB</text><text x="32" y="340" font-size="12" fill="#56655f">PSEAE</text>
<text x="158" y="320" font-size="13" fill="#15201e">FabH / KAS-III</text>
<text x="318" y="320" font-size="13" fill="#15201e">acyltransferase</text>
<text x="538" y="320" font-size="13" fill="#15201e">active site is in PqsC</text>
<text x="748" y="320" font-size="11" font-weight="bold" fill="#7657a3">MARK_AS_OVER_ANNOTATED</text>
<text x="158" y="356" font-size="13" fill="#1d8a4b">what it does: non-catalytic partner of PqsC</text>
<rect x="24" y="378" width="912" height="88" fill="#ffffff" stroke="#c9d6d1"/>
<text x="32" y="408" font-size="16" font-weight="bold" fill="#15201e">actI-ORF2</text><text x="32" y="428" font-size="12" fill="#56655f">STRCO</text>
<text x="158" y="408" font-size="13" fill="#15201e">β-ketoacyl synthase</text>
<text x="318" y="408" font-size="13" fill="#15201e">acyltransferase</text>
<text x="538" y="408" font-size="13" fill="#15201e">no active site</text>
<text x="748" y="408" font-size="11" font-weight="bold" fill="#7657a3">MARK_AS_OVER_ANNOTATED ×2</text>
<text x="158" y="444" font-size="13" fill="#1d8a4b">what it does: sets polyketide chain length with KSα</text>
</svg>