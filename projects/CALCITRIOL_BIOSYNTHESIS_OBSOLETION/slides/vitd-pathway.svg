<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- GO:1901755 bracket (whole pathway, redefined output) -->
  <rect x="20" y="24" width="920" height="46" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="36" y="46" font-size="15" font-weight="600" fill="#0e6b66">GO:1901755 vitamin D3 biosynthetic process  (replacement)</text>
  <text x="36" y="62" font-size="12.5" fill="#15201e">redefined: has_primary_output calcitriol (CHEBI:17823), was calciol; xref MetaCyc:PWY-6076</text>
  <!-- GO:0036378 bracket (two enzymatic steps) -->
  <rect x="268" y="84" width="672" height="40" rx="8" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="284" y="109" font-size="14.5" font-weight="600" fill="#bd3a30">OBSOLETE  GO:0036378 calcitriol biosynthetic process from calciol</text>
  <!-- metabolites -->
  <rect x="24" y="190" width="170" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="109" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">7-dehydro-</text>
  <text x="109" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">cholesterol</text>
  <rect x="280" y="190" width="160" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="360" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">calciol</text>
  <text x="360" y="240" text-anchor="middle" font-size="12.5" fill="#56655f">vitamin D3</text>
  <rect x="526" y="190" width="170" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="611" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">calcidiol</text>
  <text x="611" y="240" text-anchor="middle" font-size="12.5" fill="#56655f">25-hydroxy-D3</text>
  <rect x="780" y="190" width="156" height="70" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="858" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">calcitriol</text>
  <text x="858" y="240" text-anchor="middle" font-size="12.5" fill="#0e6b66">active hormone</text>
  <!-- arrows -->
  <path d="M196 225 L276 225" stroke="#8fa39c" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="236" y="212" text-anchor="middle" font-size="11.5" fill="#56655f">UV, skin</text>
  <text x="236" y="248" text-anchor="middle" font-size="11.5" fill="#56655f">non-enzymatic</text>
  <path d="M442 225 L522 225" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <path d="M698 225 L776 225" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- enzymes -->
  <rect x="400" y="290" width="164" height="96" rx="10" fill="#ffffff" stroke="#0e6b66"/>
  <text x="482" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#0e6b66">25-HYDROXYLATION · liver</text>
  <text x="482" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">CYP2R1</text>
  <text x="482" y="354" text-anchor="middle" font-size="13" fill="#56655f">principal</text>
  <text x="482" y="374" text-anchor="middle" font-size="13" fill="#56655f">CYP27A1, CYP3A4 minor</text>
  <path d="M482 288 L482 240" stroke="#0e6b66" stroke-width="1.4"/>
  <rect x="648" y="290" width="188" height="96" rx="10" fill="#ffffff" stroke="#0e6b66"/>
  <text x="742" y="312" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e6b66">1α-HYDROXYLATION · kidney</text>
  <text x="742" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">CYP27B1</text>
  <text x="742" y="354" text-anchor="middle" font-size="13" fill="#56655f">15 of the 24</text>
  <text x="742" y="374" text-anchor="middle" font-size="13" fill="#56655f">curated annotations</text>
  <path d="M742 288 L742 240" stroke="#0e6b66" stroke-width="1.4"/>
  <!-- CYP24A1 inactivation -->
  <rect x="700" y="420" width="236" height="80" rx="10" fill="#fdf1e4" stroke="#b8620f" stroke-width="1.6"/>
  <text x="818" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#b8620f">24-HYDROXYLATION · inactivation</text>
  <text x="818" y="466" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">CYP24A1</text>
  <text x="818" y="487" text-anchor="middle" font-size="12.5" fill="#56655f">edge case: catabolic term instead?</text>
  <path d="M880 262 C 900 330, 900 380, 880 418" fill="none" stroke="#b8620f" stroke-width="2.2" marker-end="url(#r)"/>
  <path d="M640 262 C 650 340, 680 420, 698 450" fill="none" stroke="#b8620f" stroke-width="2.2" marker-end="url(#r)"/>
  <text x="24" y="440" font-size="13" fill="#56655f">Both enzymatic steps of the pathway fall under the obsolete term,</text>
  <text x="24" y="460" font-size="13" fill="#56655f">so once GO:1901755 outputs calcitriol it covers the same ground.</text>
  <text x="24" y="480" font-size="13" fill="#56655f">CYP24A1 consumes calcidiol and calcitriol; it does not make them.</text>
</svg>
