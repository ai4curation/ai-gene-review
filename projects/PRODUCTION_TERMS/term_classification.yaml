# Curated classification of GO's live "X production" terms.
#
# This file replaces the name-pattern heuristic in scripts/inventory.py, which
# only groups terms by what their label looks like. Each entry here is a curator
# judgement against the test set out in projects/PRODUCTION_TERMS.md: is any step
# on the way to this product performed by machinery dedicated to it, or to a
# small family that includes it? If yes, the term sits on a real mechanism and a
# module is warranted. If no, the term reads out shared programmes and the only
# product-specific part is the gene's own regulatory DNA and mRNA 3' end.
#
# Scope: the 137 live terms whose label contains "production" and which are not
# "(positive|negative) regulation of ...". A regulation term inherits its
# parent's verdict, so they are not listed separately.
#
# Evidentiary status: `basis` is curator judgement at textbook level, not a
# literature review, and entries carry no per-term citation unless a
# `supported_by` quote is given. `confidence` says how far to trust the verdict:
#   HIGH    - named dedicated machinery, and GO already has a term for the step
#   MEDIUM  - well established, but the specifics were not checked here
#   LOW     - plausible and worth checking before any module or ticket rests on it
# Treat every LOW entry, and every UNCERTAIN verdict, as a question rather than
# a finding. Nothing here should be used to obsolete a term on its own.

verdicts:
  DEDICATED_MACHINERY: >-
    Some step uses machinery dedicated to this product or to a small family
    including it (a processing protease, a sheddase, a latency complex, a
    dedicated granule, an obligate heterodimer partner, or a transcription-factor
    arm close to dedicated). A module is warranted; `module` names an existing one
    and `module_candidate` a proposed one.
  SHARED_PROGRAMME: >-
    A readout. Transcription by shared factors, shared mRNA-stability machinery
    and constitutive secretion; the only product-specific element is the gene's
    own regulatory DNA and 3' UTR. The term is true but names an outcome.
  GROUPING: >-
    A parent, cell-type or context grouping that names no single product.
  BIOSYNTHESIS_PLUS_TRANSPORT: >-
    A small molecule for which GO already has a biosynthesis term; "production"
    adds export, storage or inflammatory context to chemistry modelled elsewhere.
  COMPOSITE_PROCESS: >-
    A genuinely composite biological process in its own right, not a readout of
    one.
  DIFFERENT_SENSE: >-
    The word "production" in the label does not mean the appearance of a
    molecule. Such a term must be excluded from any sweep over "production"
    terms.
  UNCERTAIN: >-
    The test could not be settled from what was checked here. Recorded as a
    question, with what would settle it.

classification:

# ---------------------------------------------------------------------------
# IL-1 family: maturation by a dedicated protease is the controlled step
# ---------------------------------------------------------------------------
- id: GO:0032612
  label: interleukin-1 production
  verdict: DEDICATED_MACHINERY
  group: il1_family
  basis: >-
    Family term over IL-1alpha and IL-1beta. Both leave the cell without the
    secretory pathway and IL-1beta needs proteolytic maturation, so the family's
    controlled steps are processing and release rather than transcription.
  confidence: HIGH
  dedicated_step:
  - id: GO:0140447
    label: cytokine precursor processing
  module: canonical_nlrp3_inflammasome
- id: GO:0032611
  label: interleukin-1 beta production
  verdict: DEDICATED_MACHINERY
  group: il1_family
  basis: >-
    Pro-IL-1beta is inactive until an inflammasome caspase cleaves it, and the
    mature cytokine leaves through gasdermin D pores. Both steps are modelled in
    the inflammasome module. This is the clearest case in the whole set: the
    gene is transcribed long before any cytokine appears.
  confidence: HIGH
  dedicated_step:
  - id: GO:0140447
    label: cytokine precursor processing
  - id: GO:0140632
    label: canonical inflammasome complex assembly
  module: canonical_nlrp3_inflammasome
- id: GO:0032621
  label: interleukin-18 production
  verdict: DEDICATED_MACHINERY
  group: il1_family
  basis: >-
    Same route as IL-1beta: constitutively expressed precursor, caspase-1
    cleavage, gasdermin-dependent release.
  confidence: HIGH
  dedicated_step:
  - id: GO:0140447
    label: cytokine precursor processing
  module: canonical_nlrp3_inflammasome
- id: GO:0032610
  label: interleukin-1 alpha production
  verdict: DEDICATED_MACHINERY
  group: il1_family
  basis: >-
    Unlike IL-1beta the full-length form is already active, so maturation is not
    the switch; release without the secretory pathway is. Grouped here because
    the release machinery is shared with IL-1beta.
  confidence: MEDIUM
  module: canonical_nlrp3_inflammasome
- id: GO:0150137
  label: interleukin-37 production
  verdict: UNCERTAIN
  group: il1_family
  basis: >-
    An IL-1 family member whose maturation is reported to involve caspase-1, but
    this was not checked against the literature here, and the term was created
    from an mRNA-level request (go-ontology#18370).
  confidence: LOW
  resolution: Establish whether a dedicated protease matures IL-37 before grouping
    it with IL-1beta and IL-18.
- id: GO:0072639
  label: interleukin-33 production
  verdict: UNCERTAIN
  group: il1_family
  basis: >-
    Full-length IL-33 is active and is held in the nucleus until cell damage
    releases it, so its controlled step is release rather than synthesis or
    maturation. No protease dedicated to IL-33 is involved, and caspase-1 is
    reported to inactivate rather than activate it, so the IL-1 family verdict
    does not carry over.
  confidence: LOW
  resolution: Decide whether damage-associated alarmin release is a module in its
    own right; if it is, IL-33 belongs to that one.

# ---------------------------------------------------------------------------
# TNF superfamily and other membrane-anchored ligands: regulated shedding
# ---------------------------------------------------------------------------
- id: GO:0071706
  label: tumor necrosis factor superfamily cytokine production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    The superfamily's defining feature is that members are made as
    membrane-anchored proteins, so the appearance of a soluble ligand is a
    proteolytic step, not a transcriptional one. Which protease depends on the
    member.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
- id: GO:0032640
  label: tumor necrosis factor production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    Membrane TNF is cleaved to the soluble trimer by ADAM17, whose own
    trafficking and activation depend on iRhom2; the two forms signal
    differently, so the cleavage is not a detail of release.
  confidence: HIGH
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
- id: GO:0072535
  label: tumor necrosis factor (ligand) superfamily member 11 production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    RANKL is made membrane-anchored on osteoblasts and stromal cells and is shed
    to a soluble form; membrane and soluble RANKL have different roles in
    osteoclast differentiation.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
- id: GO:0140730
  label: amphiregulin production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    An EGF-family ligand made as a membrane precursor and released by ADAM17;
    this is the canonical substrate class of that sheddase. GO created the term
    for the Cell Ontology and OBI (go-ontology#21878), not for annotation.
  confidence: HIGH
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
- id: GO:0032603
  label: fractalkine production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    CX3CL1 is one of the two membrane-anchored chemokines. It works as an
    adhesion molecule while anchored and as a chemoattractant once ADAM10 or
    ADAM17 releases it, so shedding changes what the product does.
  confidence: HIGH
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
  notes: >-
    This is also the term whose positive-regulation child GO:0050754 was merged
    into, instead of into GO:0032724 (see the project page).
- id: GO:0097392
  label: chemokine (C-X-C motif) ligand 16 production
  verdict: DEDICATED_MACHINERY
  group: ectodomain_shedding
  basis: >-
    The other membrane-anchored chemokine, released by the same sheddases, with
    the same split between an adhesive anchored form and a soluble chemoattractant.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  module_candidate: adam17_ectodomain_shedding
- id: GO:0032639
  label: TRAIL production
  verdict: UNCERTAIN
  group: ectodomain_shedding
  basis: >-
    A TNF superfamily member, so shedding is the expected controlled step, but
    which protease releases soluble TRAIL and whether the soluble form matters
    were not checked here.
  confidence: LOW
- id: GO:0032641
  label: lymphotoxin A production
  verdict: SHARED_PROGRAMME
  group: shared_cytokine
  basis: >-
    Unlike most of the superfamily, LTalpha is secreted as a soluble homotrimer
    through the classical pathway; the membrane heterotrimer with LTbeta is a
    different assembly rather than a precursor of it. No shedding step, so the
    verdict does not follow the family.
  confidence: MEDIUM

# ---------------------------------------------------------------------------
# TGF-beta: secreted latent, activated outside the cell
# ---------------------------------------------------------------------------
- id: GO:0071604
  label: transforming growth factor beta production
  verdict: DEDICATED_MACHINERY
  group: tgf_beta_activation
  basis: >-
    TGF-beta is secreted as a latent complex with its own pro-domain and a
    latent-binding protein, and is stored in the matrix. Almost all of the
    control is in activation of that store, not in transcription or secretion,
    which is why "production" and "activity" come apart for this family more
    than for any other cytokine.
  confidence: HIGH
  module_candidate: latent_tgfb_activation
  notes: >-
    This term and its three children are among the six cytokine production terms
    that never received gocheck_do_not_annotate.
- id: GO:0032905
  label: transforming growth factor beta1 production
  verdict: DEDICATED_MACHINERY
  group: tgf_beta_activation
  basis: >-
    The best-characterised member: latency through LAP and LTBP, presentation by
    GARP on regulatory T cells, and activation by the integrins alphaVbeta6 and
    alphaVbeta8 and by force.
  confidence: HIGH
  module_candidate: latent_tgfb_activation
- id: GO:0032906
  label: transforming growth factor beta2 production
  verdict: DEDICATED_MACHINERY
  group: tgf_beta_activation
  basis: Same latency architecture as TGF-beta1; the integrin-dependence is less
    well established for this isoform.
  confidence: MEDIUM
  module_candidate: latent_tgfb_activation
- id: GO:0032907
  label: transforming growth factor beta3 production
  verdict: DEDICATED_MACHINERY
  group: tgf_beta_activation
  basis: Same latency architecture as TGF-beta1; the integrin-dependence is less
    well established for this isoform.
  confidence: MEDIUM
  module_candidate: latent_tgfb_activation

# ---------------------------------------------------------------------------
# Type I and type III interferons: the IRF3/IRF7 induction arm
# ---------------------------------------------------------------------------
- id: GO:0032606
  label: type I interferon production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    Induction runs through a signalling arm that is close to dedicated: the
    adaptors STING, MAVS and TRIF present IRF3 to TBK1 or IKBKE, and in
    plasmacytoid dendritic cells MyD88 and IRAK1 activate IRF7. The module built
    for this project covers it.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
  supported_by:
  - reference_id: PMID:27302953
    reference_section_type: ABSTRACT
    supporting_text: These signaling pathways converge at the recruitment and activation of the transcription
      factor IRF-3 (IFN regulatory factor 3).
- id: GO:0032608
  label: interferon-beta production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    The IRF3 target gene of the first wave, and the one whose enhancer gave the
    enhanceosome its name.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
- id: GO:0032607
  label: interferon-alpha production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    Requires IRF7 rather than IRF3, which is why the plasmacytoid dendritic cell
    route exists as a separate branch of the module.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
  supported_by:
  - reference_id: PMID:15800576
    reference_section_type: ABSTRACT
    supporting_text: the transcription factor IRF-7 is essential for the induction of IFN-alpha/beta genes
      via the virus-activated, MyD88-independent pathway and the TLR-activated, MyD88-dependent pathway
- id: GO:0034343
  label: type III interferon production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    The interferon-lambda genes are induced by the same IRF3/IRF7 arm as type I,
    and differ downstream, in their receptor. Also one of the six unflagged
    cytokine production terms.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
- id: GO:0072627
  label: interleukin-28A production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    IL-28A is interferon-lambda2: a type III interferon, induced by the same arm.
    The "interleukin" name is historical.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
  notes: The name-pattern heuristic put this term with the shared-programme
    interleukins; its parent GO:0034343 shows otherwise.
- id: GO:0072629
  label: interleukin-28B production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: IL-28B is interferon-lambda3; as for IL-28A.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
  notes: Same heuristic correction as GO:0072627.
- id: GO:0072631
  label: interleukin-29 production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: IL-29 is interferon-lambda1; as for IL-28A.
  confidence: HIGH
  module: irf3_irf7_interferon_induction
  notes: Same heuristic correction as GO:0072627.
- id: GO:0072645
  label: interferon-delta production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: A type I interferon of pigs; same induction arm, restricted taxon.
  confidence: MEDIUM
  module: irf3_irf7_interferon_induction
- id: GO:0072649
  label: interferon-kappa production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: A type I interferon of keratinocytes; same induction arm.
  confidence: MEDIUM
  module: irf3_irf7_interferon_induction
- id: GO:0072651
  label: interferon-tau production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: >-
    A type I interferon of ruminants with a pregnancy-recognition role; the
    induction arm is assumed from the class rather than shown here, and its
    trophoblast expression may be driven differently.
  confidence: LOW
  module: irf3_irf7_interferon_induction
- id: GO:0072653
  label: interferon-omega production
  verdict: DEDICATED_MACHINERY
  group: irf_interferon_induction
  basis: A type I interferon; same induction arm.
  confidence: MEDIUM
  module: irf3_irf7_interferon_induction
- id: GO:0072647
  label: interferon-epsilon production
  verdict: UNCERTAIN
  group: irf_interferon_induction
  basis: >-
    A type I interferon by sequence and receptor, but reported to be expressed
    constitutively in mucosal epithelium under hormonal rather than
    pattern-recognition control. If that holds, it is not a product of the IRF
    induction arm and the class membership is misleading here.
  confidence: LOW
  resolution: Check whether interferon-epsilon induction depends on IRF3 or IRF7
    at all before grouping it with the virus-induced interferons.

# ---------------------------------------------------------------------------
# Type II interferon: a lineage programme, not a dedicated machine
# ---------------------------------------------------------------------------
- id: GO:0032609
  label: type II interferon production
  verdict: SHARED_PROGRAMME
  group: shared_cytokine
  basis: >-
    Interferon-gamma is a conventionally secreted cytokine whose control is
    transcriptional, through the T-bet and STAT4 lineage programme of Th1 and NK
    cells. No dedicated maturation, storage or release machinery, despite the
    name it shares with the type I interferons.
  confidence: MEDIUM
  notes: >-
    This is the term the Cell Ontology leans on most: nine CL classes are
    defined with capable_of GO:0032609. That use is about which cell makes it,
    which is exactly a lineage-programme claim.

# ---------------------------------------------------------------------------
# Cytotoxic granule mediators: dedicated granule and polarised release
# ---------------------------------------------------------------------------
- id: GO:0035944
  label: perforin production
  verdict: DEDICATED_MACHINERY
  group: cytotoxic_granule
  basis: >-
    Perforin is stored in the cytolytic granule of cytotoxic lymphocytes and
    released only at the immune synapse. The controlled step is granule
    biogenesis and polarised exocytosis (RAB27A, UNC13D, STX11, STXBP2), which
    is dedicated machinery and is what human deficiencies of this pathway
    disable.
  confidence: HIGH
  dedicated_step:
  - id: GO:0043320
    label: natural killer cell degranulation
  - id: GO:0044194
    label: cytolytic granule
  module_candidate: cytotoxic_granule_exocytosis
- id: GO:0071613
  label: granzyme B production
  verdict: DEDICATED_MACHINERY
  group: cytotoxic_granule
  basis: >-
    Stored in the same granule as perforin and released with it; granzymes are
    also made as proenzymes that need processing before storage.
  confidence: HIGH
  dedicated_step:
  - id: GO:0043320
    label: natural killer cell degranulation
  module_candidate: cytotoxic_granule_exocytosis
- id: GO:0035746
  label: granzyme A production
  verdict: DEDICATED_MACHINERY
  group: cytotoxic_granule
  basis: As granzyme B; same granule, same release machinery.
  confidence: HIGH
  dedicated_step:
  - id: GO:0043320
    label: natural killer cell degranulation
  module_candidate: cytotoxic_granule_exocytosis
- id: GO:0036262
  label: granulysin production
  verdict: DEDICATED_MACHINERY
  group: cytotoxic_granule
  basis: >-
    Stored and released with perforin and the granzymes; GO created the term by
    analogy with granzyme B for that reason (go-ontology#9758).
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0043320
    label: natural killer cell degranulation
  module_candidate: cytotoxic_granule_exocytosis

# ---------------------------------------------------------------------------
# Prohormone processing and regulated secretion
# ---------------------------------------------------------------------------
- id: GO:0036162
  label: oxytocin production
  verdict: DEDICATED_MACHINERY
  group: prohormone_processing
  basis: >-
    A neuropeptide cut from a larger precursor by prohormone convertases and
    carboxypeptidase E, stored in neurosecretory granules and released on
    demand. Processing and regulated release are the controlled steps, as for
    insulin, whose secretion GO keeps as a separate term and which this repo
    already models.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0016486
    label: peptide hormone processing
  notes: >-
    One of the production terms outside the cytokine branch that carries no
    do-not-annotate flag, and the only one whose is_a parent is GO:0010467
    gene expression directly.
- id: GO:1990775
  label: endothelin production
  verdict: DEDICATED_MACHINERY
  group: prohormone_processing
  basis: >-
    Big-endothelin is converted to the mature peptide by endothelin-converting
    enzyme, an enzyme named for this one substrate. GO already has a term for
    the step, so the dedicated machinery is not in doubt.
  confidence: HIGH
  dedicated_step:
  - id: GO:0034959
    label: endothelin maturation
  notes: >-
    The clearest non-immune case in the set, and an argument that the question
    is the mechanism rather than whether the product is a cytokine.

# ---------------------------------------------------------------------------
# IL-12 family: an obligate heterodimer is the product
# ---------------------------------------------------------------------------
- id: GO:0032615
  label: interleukin-12 production
  verdict: DEDICATED_MACHINERY
  group: il12_family_assembly
  basis: >-
    IL-12 is a disulfide-linked heterodimer of IL12A and IL12B, and neither
    subunit is active alone. The subunits are separately regulated and IL12B
    pairs with IL23A instead to make IL-23, so which cytokine appears depends on
    an assembly step, not only on transcription. GO recognises the products as
    complexes.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0043514
    label: interleukin-12 complex
  module_candidate: il12_family_heterodimer_assembly
- id: GO:0032627
  label: interleukin-23 production
  verdict: DEDICATED_MACHINERY
  group: il12_family_assembly
  basis: >-
    The IL12B subunit shared with IL-12 pairs with IL23A; the pairing decides
    which of the two cytokines the cell makes.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0070743
    label: interleukin-23 complex
  module_candidate: il12_family_heterodimer_assembly
- id: GO:0032631
  label: interleukin-27 production
  verdict: DEDICATED_MACHINERY
  group: il12_family_assembly
  basis: A heterodimer of EBI3 and IL27, on the same shared-subunit pattern.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0070744
    label: interleukin-27 complex
  module_candidate: il12_family_heterodimer_assembly
- id: GO:0070753
  label: interleukin-35 production
  verdict: DEDICATED_MACHINERY
  group: il12_family_assembly
  basis: >-
    A heterodimer of EBI3 and IL12A, so it competes for both subunits with
    IL-12 and IL-27; assembly is the whole of its identity.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0070745
    label: interleukin-35 complex
  module_candidate: il12_family_heterodimer_assembly

# ---------------------------------------------------------------------------
# A real composite process
# ---------------------------------------------------------------------------
- id: GO:0002377
  label: immunoglobulin production
  verdict: COMPOSITE_PROCESS
  group: immunoglobulin
  basis: >-
    Not a readout of anything. Making an antibody requires V(D)J recombination,
    class switching and plasma cell differentiation, each a process in its own
    right, and the product's sequence is created by the process rather than
    encoded. This is the one term in the set that would survive a from-scratch
    rebuild unchanged.
  confidence: HIGH
  dedicated_step:
  - id: GO:0033151
    label: V(D)J recombination
  - id: GO:0045190
    label: isotype switching
  - id: GO:0002317
    label: plasma cell differentiation
- id: GO:0002381
  label: immunoglobulin production involved in immunoglobulin-mediated immune response
  verdict: GROUPING
  group: immunoglobulin
  basis: >-
    The composite process above, precomposed with the response it serves. The
    context is the part that should be dropped, not the process.
  confidence: HIGH
- id: GO:0002426
  label: immunoglobulin production in mucosal tissue
  verdict: GROUPING
  group: immunoglobulin
  basis: >-
    The same process precomposed with an anatomical context. Tissue context is
    what annotation extensions are for; compare the hepatic glucose production
    request GO declined in 2013 (go-ontology#10601).
  confidence: HIGH

# ---------------------------------------------------------------------------
# Small-molecule mediators: chemistry GO already models elsewhere
# ---------------------------------------------------------------------------
- id: GO:0002349
  label: histamine production involved in inflammatory response
  verdict: DEDICATED_MACHINERY
  group: granule_amine
  basis: >-
    Histamine is made by one decarboxylase and then stored in mast cell and
    basophil granules; in inflammation the controlled step is degranulation, not
    synthesis. Both steps already have GO terms, so the production term adds
    only the inflammatory context.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0001694
    label: histamine biosynthetic process
  - id: GO:0043303
    label: mast cell degranulation
  module_candidate: mast_cell_degranulation
- id: GO:0002351
  label: serotonin production involved in inflammatory response
  verdict: BIOSYNTHESIS_PLUS_TRANSPORT
  group: small_molecule
  basis: >-
    GO has the biosynthetic process. In inflammation the relevant store is the
    platelet dense granule, which platelets fill by uptake rather than
    synthesis, so "production" here conflates two different things and neither
    is specific to inflammation.
  confidence: MEDIUM
  dedicated_step:
  - id: GO:0042427
    label: serotonin biosynthetic process
- id: GO:0002537
  label: nitric oxide production involved in inflammatory response
  verdict: BIOSYNTHESIS_PLUS_TRANSPORT
  group: small_molecule
  basis: >-
    NO is made by nitric oxide synthases and diffuses; there is no storage or
    release step to control. GO has the biosynthetic process, and the inducible
    synthase's own induction is a transcriptional readout.
  confidence: HIGH
  dedicated_step:
  - id: GO:0006809
    label: nitric oxide biosynthetic process
  notes: >-
    GO obsoleted the symbiont terms for inducing host NO production as processes
    that do not exist (go-ontology#25395), and obsoleted the nitric-oxide
    synthase biosynthetic process terms as gene-product terms (#28860).
- id: GO:0002538
  label: arachidonate metabolite production involved in inflammatory response
  verdict: BIOSYNTHESIS_PLUS_TRANSPORT
  group: small_molecule
  basis: >-
    Grouping over the eicosanoid branches, each of which GO models as a
    biosynthetic process. Substrate release by phospholipase A2 is the real
    committed step and is modelled separately.
  confidence: HIGH
