    The root of the branch, created in 2003 deliberately to cover an increase in
    cytokine level whatever its cause. It is also the term that carries the
    merged cytokine biosynthesis, metabolism and secretion identifiers, so it is
    where the 2020 overhaul landed.
  confidence: HIGH
  notes: >-
    Its definition is the one every term in the branch inherits the shape of:
    the appearance of a cytokine due to biosynthesis or secretion following a
    cellular stimulus, resulting in an increase in its levels. That is a
    statement about an amount, which is the whole of this project's argument.
