<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1d8a4b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#bd3a30"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b8620f"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">Who performs the phosphorylation step?</text>

  <!-- central reaction -->
  <g transform="translate(250 190)">
    <rect width="150" height="56" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="75" y="24" text-anchor="middle" font-size="15" fill="#15201e">substrate protein</text>
    <text x="75" y="44" text-anchor="middle" font-size="12" fill="#56655f">+ ATP</text>
  </g>
  <g transform="translate(560 190)">
    <rect width="150" height="56" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="75" y="24" text-anchor="middle" font-size="15" fill="#15201e">substrate–P</text>
    <text x="75" y="44" text-anchor="middle" font-size="12" fill="#56655f">+ ADP</text>
  </g>
  <path d="M402 208 L556 208" stroke="#1d8a4b" stroke-width="3" marker-end="url(#k)"/>
  <path d="M556 232 L404 232" stroke="#bd3a30" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- kinase -->
  <g transform="translate(395 90)">
    <rect width="170" height="58" rx="10" fill="#e3f3ea" stroke="#1d8a4b" stroke-width="1.8"/>
    <text x="85" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1d8a4b">protein kinase</text>
    <text x="85" y="44" text-anchor="middle" font-size="12" fill="#15201e">GO:0004672 → GO:0006468</text>
  </g>
  <path d="M480 148 L480 204" stroke="#1d8a4b" stroke-width="2" marker-end="url(#k)"/>
  <text x="488" y="182" font-size="12" fill="#1d8a4b">catalyses</text>

  <!-- cyclin / regulator -->
  <g transform="translate(70 60)">
    <rect width="230" height="78" rx="10" fill="#fbf1e6" stroke="#b8620f"/>
    <text x="115" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">R · cyclins, adapters, GTPases</text>
    <text x="115" y="42" text-anchor="middle" font-size="12" fill="#15201e">CCNE1, Ccnb1, YWHAZ, ABI2, Cdc42</text>
    <text x="115" y="62" text-anchor="middle" font-size="12" fill="#56655f">activate or scaffold the kinase</text>
  </g>
  <path d="M300 104 L392 116" stroke="#b8620f" stroke-width="2" marker-end="url(#m)"/>

  <!-- ligand / receptor -->
  <g transform="translate(660 60)">
    <rect width="240" height="78" rx="10" fill="#fbf1e6" stroke="#b8620f"/>
    <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">R · ligands, cytokines, receptors</text>
    <text x="120" y="42" text-anchor="middle" font-size="12" fill="#15201e">Egf, GAS6, PDGFB, IL15, IL21, Drd1</text>
    <text x="120" y="62" text-anchor="middle" font-size="12" fill="#56655f">trigger a receptor kinase cascade</text>
  </g>
  <path d="M660 104 L568 116" stroke="#b8620f" stroke-width="2" marker-end="url(#m)"/>

  <!-- substrate -->
  <g transform="translate(60 300)">
    <rect width="250" height="84" rx="10" fill="#fbeceb" stroke="#bd3a30"/>
    <text x="125" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#bd3a30">S · the substrate itself</text>
    <text x="125" y="42" text-anchor="middle" font-size="12" fill="#15201e">CREB1, ATF2, RUNX3, Bcl2, LIMD1</text>
    <text x="125" y="62" text-anchor="middle" font-size="12" fill="#56655f">"phosphorylation OF", not "BY"</text>
  </g>
  <path d="M250 300 L300 250" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- phosphatase -->
  <g transform="translate(360 300)">
    <rect width="240" height="84" rx="10" fill="#fbeceb" stroke="#bd3a30"/>
    <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#bd3a30">O · phosphatases</text>
    <text x="120" y="42" text-anchor="middle" font-size="12" fill="#15201e">CDC25B, PPP3CB, PTPN6, PPP4R1</text>
    <text x="120" y="62" text-anchor="middle" font-size="12" fill="#56655f">catalyse the reverse reaction</text>
  </g>
  <path d="M480 300 L480 240" stroke="#bd3a30" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- wrong substrate -->
  <g transform="translate(650 300)">
    <rect width="250" height="84" rx="10" fill="#fbf1e6" stroke="#b8620f"/>
    <text x="125" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">W · lipid and sugar kinases</text>
    <text x="125" y="42" text-anchor="middle" font-size="12" fill="#15201e">PIK3CD, IP6K3, GLYCTK</text>
    <text x="125" y="62" text-anchor="middle" font-size="12" fill="#56655f">real kinases, non-protein substrate</text>
  </g>

  <!-- verdict row -->
  <g font-size="13" text-anchor="middle">
    <text x="185" y="418" fill="#bd3a30">→ REMOVE the process row</text>
    <text x="480" y="418" fill="#bd3a30">→ REMOVE the process row</text>
    <text x="775" y="418" fill="#b8620f">→ substrate term (PIK3CD → GO:0046834) or REMOVE</text>
  </g>
  <rect x="160" y="444" width="640" height="48" rx="10" fill="#fbf1e6" stroke="#b8620f"/>
  <text x="480" y="465" text-anchor="middle" font-size="14" fill="#15201e">Regulators (R): MODIFY to GO:0045859 regulation of protein kinase activity</text>
  <text x="480" y="484" text-anchor="middle" font-size="12" fill="#56655f">or GO:0042531 for cytokines that induce STAT tyrosine phosphorylation</text>
</svg>
