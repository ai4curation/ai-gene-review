<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- mitochondrion -->
  <rect x="20" y="60" width="760" height="400" rx="60" fill="#e8f1ee" stroke="#0e6b66" stroke-width="3"/>
  <text x="50" y="88" font-size="14" font-weight="600" fill="#0e6b66">mitochondrial matrix</text>
  <!-- inner membrane at right edge -->
  <rect x="772" y="60" width="16" height="400" fill="#0e6b66" opacity="0.18"/>
  <!-- envelope of GO:0019418 -->
  <rect x="40" y="100" width="700" height="230" rx="16" fill="none" stroke="#0e6b66" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="56" y="316" font-size="13" font-weight="600" fill="#0e6b66">GO:0019418 sulfide oxidation (sulfide → sulfite / sulfate)</text>
  <!-- metabolites -->
  <g font-size="16" font-weight="600" fill="#15201e" text-anchor="middle">
    <rect x="60" y="180" width="90" height="42" rx="21" fill="#ffffff" stroke="#8fa39c"/><text x="105" y="207">H₂S</text>
    <rect x="250" y="180" width="130" height="42" rx="21" fill="#ffffff" stroke="#8fa39c"/><text x="315" y="207">persulfide</text>
    <rect x="470" y="180" width="100" height="42" rx="21" fill="#ffffff" stroke="#8fa39c"/><text x="520" y="207">sulfite</text>
    <rect x="640" y="180" width="100" height="42" rx="21" fill="#ffffff" stroke="#8fa39c"/><text x="690" y="207">sulfate</text>
  </g>
  <path d="M152 201 L246 201" stroke="#15201e" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M382 201 L466 201" stroke="#15201e" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M572 201 L636 201" stroke="#15201e" stroke-width="2.4" marker-end="url(#a)"/>
  <!-- enzymes -->
  <rect x="140" y="130" width="120" height="36" rx="8" fill="#1d68b3"/><text x="200" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">SQOR</text>
  <text x="200" y="120" text-anchor="middle" font-size="11.5" fill="#bd3a30">was GO:0070221</text>
  <rect x="360" y="130" width="130" height="36" rx="8" fill="#56655f"/><text x="425" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">sulfur dioxygenase</text>
  <text x="425" y="120" text-anchor="middle" font-size="11.5" fill="#bd3a30">was GO:0070223</text>
  <rect x="555" y="130" width="100" height="36" rx="8" fill="#56655f"/><text x="605" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">SUOX</text>
  <!-- CoQ -->
  <path d="M200 222 C 200 260, 230 270, 260 270" stroke="#1d68b3" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#e)"/>
  <text x="266" y="275" font-size="13" fill="#1d68b3">2e⁻ → coenzyme Q → respiratory chain</text>
  <!-- TSTD1 side -->
  <rect x="250" y="370" width="150" height="40" rx="8" fill="#1d68b3"/><text x="325" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">TSTD1</text>
  <text x="410" y="386" font-size="12.5" fill="#15201e">thiosulfate:glutathione sulfurtransferase</text>
  <text x="410" y="404" font-size="12.5" fill="#56655f">(rhodanese-type; TAS row on GO:0070221)</text>
  <!-- SLC25A10 -->
  <rect x="800" y="170" width="140" height="64" rx="10" fill="#7657a3"/>
  <text x="870" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">SLC25A10</text>
  <text x="870" y="218" text-anchor="middle" font-size="11.5" fill="#ffffff">sulfate / Pi antiport</text>
  <path d="M742 201 L796 201" stroke="#7657a3" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="870" y="258" text-anchor="middle" font-size="12" fill="#7657a3">exports the product;</text>
  <text x="870" y="274" text-anchor="middle" font-size="12" fill="#7657a3">does not oxidise sulfide</text>
  <text x="870" y="292" text-anchor="middle" font-size="10.5" fill="#7657a3">MARK_AS_OVER_ANNOTATED</text>
  <text x="20" y="494" font-size="12.5" fill="#56655f">Grey: enzymes not on the affected list. The third obsolete term (sulfide dehydrogenase, GO:0070222) had no annotations.</text>
</svg>
