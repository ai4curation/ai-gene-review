<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>

  <!-- top: one entry, many proteins -->
  <text x="30" y="36" font-size="20" font-weight="700" fill="#15201e">One mapping, many genes</text>
  <rect x="30" y="52" width="210" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="135" y="76" font-size="16" font-weight="700" text-anchor="middle" fill="#15201e">IPR000719</text>
  <text x="135" y="96" font-size="13" text-anchor="middle" fill="#56655f">protein kinase domain</text>
  <text x="275" y="70" font-size="13" fill="#0e6b66">InterPro2GO</text>
  <text x="275" y="86" font-size="13" fill="#0e6b66">GO:0005524 ATP binding</text>
  <text x="275" y="102" font-size="13" fill="#0e6b66">GO:0006468 protein phosphorylation</text>
  <g font-size="13" fill="#15201e">
    <rect x="520" y="46" width="92" height="30" rx="5" fill="#e8f1ee" stroke="#1d8a4b"/><text x="566" y="66" text-anchor="middle">kinase</text>
    <rect x="620" y="46" width="92" height="30" rx="5" fill="#e8f1ee" stroke="#1d8a4b"/><text x="666" y="66" text-anchor="middle">kinase</text>
    <rect x="720" y="46" width="92" height="30" rx="5" fill="#e8f1ee" stroke="#1d8a4b"/><text x="766" y="66" text-anchor="middle">kinase</text>
    <rect x="520" y="84" width="92" height="30" rx="5" fill="#e8f1ee" stroke="#1d8a4b"/><text x="566" y="104" text-anchor="middle">kinase</text>
    <rect x="620" y="84" width="92" height="30" rx="5" fill="#e8f1ee" stroke="#1d8a4b"/><text x="666" y="104" text-anchor="middle">kinase</text>
    <rect x="720" y="84" width="120" height="30" rx="5" fill="#fbeceb" stroke="#bd3a30" stroke-width="2"/><text x="780" y="104" text-anchor="middle" fill="#bd3a30" font-weight="700">pseudokinase</text>
  </g>
  <line x1="490" y1="80" x2="515" y2="80" stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="850" y="68" font-size="12" fill="#56655f">every match</text>
  <text x="850" y="84" font-size="12" fill="#56655f">inherits both</text>
  <text x="850" y="100" font-size="12" fill="#56655f">terms</text>

  <line x1="30" y1="134" x2="930" y2="134" stroke="#8fa39c" stroke-dasharray="4 4"/>
  <text x="30" y="164" font-size="20" font-weight="700" fill="#15201e">How the project finds and judges bad mappings</text>

  <!-- pipeline boxes -->
  <g font-size="14" fill="#15201e">
    <rect x="30" y="184" width="170" height="104" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="115" y="208" text-anchor="middle" font-weight="700">Gene reviews</text>
    <text x="115" y="230" text-anchor="middle">GOA rows with</text>
    <text x="115" y="248" text-anchor="middle">GO_REF:0000002</text>
    <text x="115" y="270" text-anchor="middle" fill="#56655f" font-size="12">action + reason per row</text>

    <rect x="240" y="184" width="170" height="104" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="325" y="208" text-anchor="middle" font-weight="700">Extractor</text>
    <text x="325" y="230" text-anchor="middle">WITH/FROM → IPR id</text>
    <text x="325" y="252" text-anchor="middle" font-weight="700" fill="#0e6b66">3,652 records</text>
    <text x="325" y="270" text-anchor="middle" fill="#56655f" font-size="12">1,706 genes</text>

    <rect x="450" y="184" width="170" height="104" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="535" y="208" text-anchor="middle" font-weight="700">Entry worklist</text>
    <text x="535" y="230" text-anchor="middle">rank by flagged rows</text>
    <text x="535" y="252" text-anchor="middle" font-weight="700" fill="#0e6b66">1,826 entries</text>
    <text x="535" y="270" text-anchor="middle" fill="#56655f" font-size="12">IPR000719: 50 of 112</text>

    <rect x="660" y="184" width="170" height="104" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="745" y="208" text-anchor="middle" font-weight="700">Family research</text>
    <text x="745" y="230" text-anchor="middle">deep research per</text>
    <text x="745" y="248" text-anchor="middle">InterPro entry</text>
    <text x="745" y="270" text-anchor="middle" fill="#56655f" font-size="12">does the term hold for all?</text>
  </g>
  <g stroke="#0e6b66" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="200" y1="236" x2="236" y2="236"/>
    <line x1="410" y1="236" x2="446" y2="236"/>
    <line x1="620" y1="236" x2="656" y2="236"/>
    <line x1="745" y1="288" x2="745" y2="330"/>
  </g>

  <!-- side intake -->
  <path d="M115,288 L115,430 Q115,445 130,445 L560,445" fill="none" stroke="#1d68b3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="140" y="400" font-size="13" fill="#1d68b3">gene-first intake: 3 entries found while reading</text>
  <text x="140" y="417" font-size="13" fill="#1d68b3">human genes (TMEM63, ZBP1, IFIH1)</text>

  <!-- SSSOM output -->
  <rect x="565" y="334" width="365" height="170" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="747" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#15201e">interpro2go.sssom.yaml</text>
  <text x="747" y="380" text-anchor="middle" font-size="13" fill="#56655f">29 (entry, GO term) verdicts, 12 entries</text>
  <rect x="585" y="394" width="14" height="14" fill="#1d8a4b"/><text x="608" y="406" font-size="14" fill="#15201e">exactMatch: sound</text><text x="905" y="406" font-size="15" font-weight="700" text-anchor="end" fill="#1d8a4b">12</text>
  <rect x="585" y="422" width="14" height="14" fill="#b8620f"/><text x="608" y="434" font-size="14" fill="#15201e">broadMatch: narrow / qualify</text><text x="905" y="434" font-size="15" font-weight="700" text-anchor="end" fill="#b8620f">10</text>
  <rect x="585" y="450" width="14" height="14" fill="#bd3a30"/><text x="608" y="462" font-size="14" fill="#15201e">exactMatch + Not: remove</text><text x="905" y="462" font-size="15" font-weight="700" text-anchor="end" fill="#bd3a30">7</text>
  <text x="747" y="490" text-anchor="middle" font-size="12" fill="#56655f">proposals for InterPro curators</text>
</svg>
