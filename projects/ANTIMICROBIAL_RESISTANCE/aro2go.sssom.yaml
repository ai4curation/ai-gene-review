# ARO -> GO mapping (SSSOM)
#
# CARD/ARO carries no native GO cross-references (verified against aro.owl: hasDbXref
# namespaces are ARO/PMID/PubChem/ChEBI/ChEMBL/CAS/PDB/ISBN/RO/DOID, zero GO). This file is the
# hand-curated ARO->GO bridge described in projects/ANTIMICROBIAL_RESISTANCE.md.
#
# Every entity is given as a CURIE + label tuple (subject_id/subject_label,
# predicate_id/predicate_label, object_id/object_label) so the rows are self-describing.
# Every ARO label is checked against the pinned CARD release (aro_release.yaml) by
# `just check-aro-release`; every GO id/label by `just validate-mappings`.
#
# Propagation (see aro_release.py): a row on an AMR gene family applies to that family and its
# is_a descendants; a row on a resistance-mechanism term applies to every gene that reaches the
# mechanism through ARO's participates_in relation (is_a* o participates_in o is_a*).
#
# Gap rows (object_id sssom:NoTermFound) record ARO families for which GO has no suitable term.
# AMR gene families that are deliberately NOT mapped, with the reason, are listed in
# aro_family_triage.yaml; FAMILY_COVERAGE.md reports every CARD AMR gene family's status.

mapping_set_id: https://w3id.org/ai4curation/ai-gene-review/mappings/aro2go
mapping_set_version: "2026-11-27"
mapping_set_title: ARO to GO mapping (AMR gene families and resistance mechanisms)
mapping_set_description: >-
  Curated mappings from Antibiotic Resistance Ontology (ARO / CARD) AMR-gene-family and
  resistance-mechanism terms to Gene Ontology molecular-function and biological-process terms.
  CARD provides no native ARO->GO cross-references, so these are manually asserted to seed and
  quality-check GO annotations of AMR genes. Gene family -> MF rows use 'enables' (RO:0002327) when
  every member of the family enables the GO term, and skos:relatedMatch when the GO term is broader
  than the family's activity or a minority of members may differ; mechanism -> BP rows use
  skos:relatedMatch. Each row carries a confidence (0-1) and a justification in its comment.
license: https://creativecommons.org/licenses/by/4.0/
creator_label:
- AI Gene Review project
subject_source: obo:aro
subject_source_version: CARD 4.0.2 (ARO 2026-08-11)
object_source: obo:go.owl
object_source_version: GO as served by sqlite:obo:go (semsql build of 2026-11-03), checked 2026-11-27
mapping_date: "2026-11-27"
see_also:
- https://ai4curation.io/ai-gene-review/pages/projects/ANTIMICROBIAL_RESISTANCE.html
comment: >-
  Reviewed by the CARD curation team (CARD review of the aro2go table, received 2026-11-27). CARD
  confirmed that all ARO accessions used were current, that the enzyme-family mappings were right
  (beta-lactamase, APH, AAC, ANT, CAT, MPH, Erm, trimethoprim-resistant DHFR, sulfonamide-resistant
  folP, MCR-type phosphoethanolamine transferases), that the FosA rows were appropriately cautious,
  and that the GO-gap list was accurate. Rows CARD reviewed carry reviewer_label; rows added after
  that review do not. CARD also pointed out that mechanism rows reached no genes under is_a-only
  propagation (fixed: they now propagate along participates_in), that ARO:3000560 and ARO:3000202
  had been relabelled (updated), and that the separate mphA/mphB rows were redundant with the MPH
  family row (removed).
curie_map:
  ARO: http://purl.obolibrary.org/obo/ARO_
  GO: http://purl.obolibrary.org/obo/GO_
  RO: http://purl.obolibrary.org/obo/RO_
  skos: http://www.w3.org/2004/02/skos/core#
  semapv: https://w3id.org/semapv/vocab/
  sssom: https://w3id.org/sssom/
  obo: http://purl.obolibrary.org/obo/

mappings:
# =============================================================================================
# Resistance mechanism -> biological process
# =============================================================================================
# Mechanism terms are reached from gene families by ARO participates_in, not is_a. Every ARO
# mechanism class relates to GO:0046677 'response to antibiotic' (relatedMatch: different axes).
- subject_id: ARO:0001004
  subject_label: antibiotic inactivation
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.8
  comment: >-
    Mechanism axis (ARO 'antibiotic inactivation') relates to the GO biological process 'response to
    antibiotic'; relatedMatch (not exact) because the two terms sit on different axes. Reaches genes
    whose family participates_in this mechanism or one of its is_a children (e.g. ARO:3000105
    phosphorylation of antibiotic conferring resistance).

- subject_id: ARO:0010000
  subject_label: antibiotic efflux
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.7
  comment: >-
    Reaches efflux pump subunits (ARO:3000159 participates_in antibiotic efflux) and the efflux
    regulators (ARO:3000451). Transporter MFs are mapped per pump family below where the family is
    homogeneous enough.

- subject_id: ARO:0001001
  subject_label: antibiotic target alteration
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.7
  comment: >-
    Reaches target-modifying enzymes (ARO:3000519) and, through ARO:0000031 participates_in
    'mutation conferring antibiotic resistance', the resistance variants of housekeeping targets
    (gyrA, rpoB, ...). For those variants the BP is a property of the variant allele; curators
    should weigh it against the wild-type gene's annotation.

- subject_id: ARO:0001003
  subject_label: antibiotic target protection
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.8
  comment: >-
    Reaches target-protection proteins (Qnr, Tet-type ribosomal protection proteins, ABC-F proteins) through ARO:3000185 participates_in this mechanism.

- subject_id: ARO:0001002
  subject_label: antibiotic target replacement
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.8
  comment: >-
    Reaches acquired, drug-insensitive replacements of the target (dfr, sul, mecA-type PBP2a) through ARO:3000381 participates_in this mechanism.

- subject_id: ARO:3000244
  subject_label: reduced permeability to antibiotic
  predicate_id: skos:relatedMatch
  predicate_label: related match
  object_id: GO:0046677
  object_label: response to antibiotic
  mapping_justification: semapv:ManualMappingCuration
  confidence: 0.6
  comment: >-
    Reaches porins and other permeability proteins (ARO:3000270). Lower confidence: resistance here
    is usually loss or down-regulation of the protein, so the BP describes the phenotype of the
    altered allele more than the activity of the protein.

