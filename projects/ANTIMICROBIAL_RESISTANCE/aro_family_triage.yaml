# Triage of CARD AMR gene families NOT mapped to GO (schema: src/ai_gene_review/schema/aro_go_mapping.yaml, class AROFamilyTriage).
# Checked by `just check-aro-release`: every unmapped family must appear here, and every entry here must still be unmapped.
id: https://w3id.org/ai4curation/ai-gene-review/mappings/aro2go/family-triage
description: CARD AMR gene families deliberately not mapped to GO by aro2go.sssom.yaml, with the reason. Families
  mapped directly, covered by a mapped ancestor, or recorded as GO gaps are not listed. basis RULE = assigned by
  the name/mechanism rule in the triage pass and spot-checked; MANUAL = assigned individually.
aro_release: CARD 4.0.2 (ARO 2026-08-11)
triage_date: '2026-11-27'
families:
- id: ARO:0000002
  label: tetracycline-resistant ribosomal protection protein
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: TetM/TetO-type translational GTPases plus rpsJ (ribosomal protein S10) variants; GO:0003924 GTPase
    activity would be wrong for rpsJ. Mappable at a GTPase-only node.
- id: ARO:0010001
  label: ATP-binding cassette (ABC) antibiotic efflux pump
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Mixes single ABC transporters with complexes and operons (MacAB-TolC, lmrAB operon, mlaFEDB) and
    a non-ABC protein (LptD); GO:0008559 ABC-type xenobiotic transporter activity fits only the single transporters.
- id: ARO:0010002
  label: major facilitator superfamily (MFS) antibiotic efflux pump
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Mixes single MFS pumps (Tet(A)-type, NorA, ...) with tripartite complexes (EmrAB-TolC, EmrKY-TolC);
    single pumps would take GO:0042910 or, for Tet pumps, GO:0015520 tetracycline:proton antiporter activity at
    the gene level.
- id: ARO:0010004
  label: resistance-nodulation-cell division (RND) antibiotic efflux pump
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Tripartite RND systems whose subunits (inner-membrane RND transporter, periplasmic adaptor, outer-membrane
    channel) have distinct roles; ARO records the subunit roles with inner_membrane_protein_of etc., so a mapping
    belongs on the transporter subunit, not the family.
- id: ARO:3000002
  label: vanW
  reason: UNKNOWN_FUNCTION
  basis: MANUAL
  explanation: 'VanW: biochemical activity not established.'
- id: ARO:3000100
  label: gene modulating beta-lactam resistance
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Grab-bag of genes that modulate beta-lactam resistance by different means.
- id: ARO:3000112
  label: multidrug and toxic compound extrusion (MATE) transporter
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Would take GO:0042910 xenobiotic transmembrane transporter activity, but the node also holds CrcB,
    which ARO itself describes as a Camphor Resistance Protein family member, not a MATE transporter (possible misplacement,
    reported to CARD).
- id: ARO:3000116
  label: vanZ
  reason: UNKNOWN_FUNCTION
  basis: MANUAL
  explanation: 'VanZ: confers teicoplanin resistance by an unknown mechanism; no activity to map.'
- id: ARO:3000133
  label: fosfomycin thiol transferase
  reason: HETEROGENEOUS
  basis: MANUAL
  explanation: Holds FosA (glutathione transferase), FosB (bacillithiol/L-cysteine transferase) and FosX (epoxide
    hydrolase); the FosA-type members are mapped individually.
- id: ARO:3000210
  label: rifamycin-resistant beta-subunit of RNA polymerase (rpoB)
  reason: CHROMOSOMAL_VARIANT
  basis: RULE
  explanation: Family is defined by resistance-conferring mutations (or altered expression) of a chromosomal gene.
    The protein's GO function is the wild-type gene's own function and belongs on that gene's annotation; an AMR
    family mapping would add nothing AMR-specific.
