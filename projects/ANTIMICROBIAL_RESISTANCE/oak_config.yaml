# OAK configuration for validating the ARO->GO mapping (just validate-mappings).
#
# ARO is read from the pinned CARD release fetched by `just fetch-aro` (.cache/aro/aro.obo),
# not from OLS: OLS lags CARD releases (on 2026-11-27 it still served the pre-4.0.2 labels of
# ARO:3000560 and ARO:3000202), so validating against it would reject the current labels.
# Paths are relative to the repository root, where the recipe runs.

ontology_adapters:
  GO: sqlite:obo:go
  ARO: simpleobo:.cache/aro/aro.obo
  RO: null
  skos: null
  semapv: null
