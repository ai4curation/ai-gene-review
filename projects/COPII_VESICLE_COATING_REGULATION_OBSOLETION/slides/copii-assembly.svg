<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- process bracket -->
  <rect x="30" y="16" width="900" height="34" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="480" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#0e6b66">GO:0048208 COPII vesicle coat assembly: every protein below is a part of it</text>
  <rect x="200" y="58" width="560" height="28" rx="8" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="6 4"/>
  <text x="480" y="77" text-anchor="middle" font-size="13" fill="#bd3a30">obsolete GO:0003400 called them regulators of this process</text>

  <!-- ER lumen label and membrane -->
  <text x="40" y="500" font-size="13" fill="#56655f">ER lumen</text>
  <text x="40" y="120" font-size="13" fill="#56655f">cytosol</text>
  <path d="M30 400 L560 400 C 600 400, 610 380, 620 340 C 640 250, 820 250, 840 340 C 850 380, 860 400, 900 400 L930 400" fill="none" stroke="#15201e" stroke-width="5"/>
  <path d="M30 416 L560 416 C 604 416, 620 392, 634 346 C 652 272, 808 272, 826 346 C 840 392, 856 416, 900 416 L930 416" fill="none" stroke="#15201e" stroke-width="2"/>

  <!-- Step 1: SEC12 GEF -->
  <rect x="60" y="360" width="70" height="46" rx="6" fill="#e8f1ee" stroke="#56655f"/>
  <text x="95" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">SEC12</text>
  <text x="95" y="440" text-anchor="middle" font-size="12" fill="#56655f">PREB (human)</text>
  <text x="95" y="456" text-anchor="middle" font-size="12" fill="#56655f">GEF for SAR1</text>
  <text x="95" y="472" text-anchor="middle" font-size="12" fill="#56655f">SED4: paralog</text>
  <!-- SAR1 GDP -> GTP -->
  <circle cx="190" cy="250" r="26" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
  <text x="190" y="248" text-anchor="middle" font-size="12" fill="#15201e">SAR1</text>
  <text x="190" y="262" text-anchor="middle" font-size="10.5" fill="#56655f">GDP</text>
  <path d="M190 278 C 190 330, 210 360, 236 370" stroke="#0e6b66" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="260" cy="376" r="24" fill="#1d68b3"/>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#ffffff">SAR1</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#ffffff">GTP</text>
  <text x="260" y="440" text-anchor="middle" font-size="12" fill="#56655f">inserts into</text>
  <text x="260" y="456" text-anchor="middle" font-size="12" fill="#56655f">the membrane</text>

  <!-- Step 2: inner coat -->
  <circle cx="380" cy="376" r="24" fill="#1d68b3"/>
  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#ffffff">SAR1</text>
  <rect x="352" y="306" width="56" height="44" rx="8" fill="#0e6b66"/>
  <text x="380" y="325" text-anchor="middle" font-size="11.5" fill="#ffffff">SEC23</text>
  <text x="380" y="341" text-anchor="middle" font-size="11.5" fill="#ffffff">SEC24</text>
  <text x="380" y="440" text-anchor="middle" font-size="12" fill="#56655f">inner coat;</text>
  <text x="380" y="456" text-anchor="middle" font-size="12" fill="#56655f">SEC23 is SAR1's GAP</text>

  <!-- Step 3: outer coat -->
  <circle cx="490" cy="376" r="24" fill="#1d68b3"/>
  <text x="490" y="380" text-anchor="middle" font-size="12" fill="#ffffff">SAR1</text>
  <rect x="462" y="306" width="56" height="44" rx="8" fill="#0e6b66"/>
  <text x="490" y="333" text-anchor="middle" font-size="11.5" fill="#ffffff">23/24</text>
  <rect x="446" y="238" width="88" height="54" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="490" y="261" text-anchor="middle" font-size="11.5" fill="#15201e">SEC13</text>
  <text x="490" y="278" text-anchor="middle" font-size="11.5" fill="#15201e">SEC31</text>
  <text x="490" y="440" text-anchor="middle" font-size="12" fill="#56655f">outer cage</text>

  <!-- Budding vesicle with coat -->
  <path d="M636 336 C 654 262, 806 262, 824 336" fill="none" stroke="#0e6b66" stroke-width="10" stroke-dasharray="16 6"/>
  <path d="M624 330 C 644 236, 816 236, 836 330" fill="none" stroke="#8fa39c" stroke-width="8" stroke-dasharray="26 10"/>
  <text x="730" y="330" text-anchor="middle" font-size="13" fill="#15201e">COPII vesicle</text>
  <text x="730" y="346" text-anchor="middle" font-size="13" fill="#15201e">buds from ER exit site</text>

  <!-- SEC16 scaffold -->
  <rect x="620" y="130" width="220" height="64" rx="10" fill="#ffffff" stroke="#7657a3" stroke-width="1.6"/>
  <text x="730" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#7657a3">SEC16 (SEC16A)</text>
  <text x="730" y="176" text-anchor="middle" font-size="12" fill="#56655f">ER exit site scaffold</text>
  <path d="M730 196 L730 228" stroke="#7657a3" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="620" y="94" width="220" height="30" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="730" y="114" text-anchor="middle" font-size="12" fill="#56655f">PEF1: Ca2+-binding accessory factor</text>
</svg>
