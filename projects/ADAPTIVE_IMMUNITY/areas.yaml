# Scope of the ADAPTIVE_IMMUNITY project.
#
# Each area is one adaptive immune pathway or process. `go` lists the GO
# biological process terms that ground the area (checked in OLS); `modules`
# are existing module slugs under modules/; `projects` are existing project
# slugs that already work in the area; `genes` are human HGNC symbols that
# anchor the area (receptor, kinase or enzyme, adaptor, effector, key brake).
# The gene lists are a scoping choice, not an exhaustive membership list, and
# a gene may anchor more than one area.
#
# Regenerate the coverage tables with:
#   uv run python projects/ADAPTIVE_IMMUNITY/scripts/coverage.py

areas:
  - id: mhc_i
    label: MHC class I antigen processing and presentation
    go:
      - {id: GO:0019885, label: "antigen processing and presentation of endogenous peptide antigen via MHC class I"}
    genes: [HLA-A, HLA-B, B2M, TAP1, TAP2, TAPBP, ERAP1, ERAP2]
  - id: mhc_ii
    label: MHC class II antigen processing and presentation
    go:
      - {id: GO:0019886, label: "antigen processing and presentation of exogenous peptide antigen via MHC class II"}
    genes: [HLA-DRA, HLA-DRB1, HLA-DMA, HLA-DMB, CD74, CTSS, CIITA]
  - id: vdj
    label: V(D)J recombination
    go:
      - {id: GO:0033151, label: "V(D)J recombination"}
    genes: [RAG1, RAG2, DCLRE1C, PRKDC, LIG4, NHEJ1, DNTT]
  - id: tcr
    label: T cell receptor signaling
    go:
      - {id: GO:0050852, label: "T cell receptor signaling pathway"}
    modules: [t_cell_receptor_signaling]
    genes: [CD3D, CD3E, CD3G, CD247, CD4, CD8A, CD8B, LCK, PTPRC, ZAP70, LAT, LCP2, GRAP2, ITK, PLCG1, PPP3CA, PPP3CB, PPP3R1, NFATC1]
  - id: costim
    label: T cell co-stimulation and inhibitory checkpoints
    go:
      - {id: GO:0031295, label: "T cell costimulation"}
    projects: [AUTOIMMUNE]
    genes: [CD28, CD80, CD86, ICOS, CTLA4, PDCD1, CD274, LAG3, PTPN22]
  - id: gamma_c
    label: IL-2 and common gamma-chain cytokine signaling
    go:
      - {id: GO:0038110, label: "interleukin-2-mediated signaling pathway"}
    modules: [jak_stat_signaling]
    projects: [AUTOIMMUNE]
    genes: [IL2, IL2RA, IL2RB, IL2RG, IL7, IL7R, IL21R, JAK1, JAK3, STAT5A, STAT5B]
  - id: t_differentiation
    label: Helper and regulatory T cell differentiation
    go:
      - {id: GO:0046632, label: "alpha-beta T cell differentiation"}
    projects: [AUTOIMMUNE]
    genes: [TBX21, GATA3, RORC, FOXP3, BCL6, STAT4, STAT3, IRF4, BACH2]
  - id: cytotoxicity
    label: T cell mediated cytotoxicity
    go:
      - {id: GO:0001913, label: "T cell mediated cytotoxicity"}
    genes: [PRF1, GZMA, GZMB, FASLG, UNC13D, STX11, STXBP2]
  - id: bcr
    label: B cell receptor signaling
    go:
      - {id: GO:0050853, label: "B cell receptor signaling pathway"}
    modules: [b_cell_receptor_signaling]
    genes: [CD79A, CD79B, CD19, CR2, LYN, SYK, BTK, BLNK, PLCG2, PIK3CD, CD22, FCGR2B]
  - id: b_differentiation
    label: B cell differentiation and germinal center
    go:
      - {id: GO:0030183, label: "B cell differentiation"}
      - {id: GO:0002467, label: "germinal center formation"}
    genes: [PAX5, EBF1, CD40, CD40LG, CXCR5, CXCL13, SH2D1A, BCL6, PRDM1, IRF4]
  - id: antibody_diversification
    label: Class switch recombination and somatic hypermutation
    go:
      - {id: GO:0045190, label: "isotype switching"}
      - {id: GO:0016446, label: "somatic hypermutation of immunoglobulin genes"}
    genes: [AICDA, UNG, MSH2, MSH6, POLH, REV1]
  - id: antibody_effector
    label: Antibody transport and Fc receptor effector signaling
    go:
      - {id: GO:0006959, label: "humoral immune response"}
    modules: [fc_gamma_receptor_signaling, fc_epsilon_receptor_signaling]
    genes: [FCGRT, PIGR, FCGR1A, FCGR2A, FCGR3A, FCER1A, FCER1G]
