# Reannotation table for GO:0051764 actin crosslink formation (BP).
#
# GO created GO:7770064 actin-filament cross-linking activity (MF) on
# 2026-04-16. Obsoleting GO:0051764 was left until its experimental
# annotations were checked one by one. This file is that check: one entry per
# experimental GOA row, saying what the cited paper shows the gene product does
# and where the row should go.
#
# Rows were retrieved from the QuickGO annotation API on 2026-11-16 (goId
# GO:0051764, goUsage exact, experimental evidence codes). Each judgement rests
# on the cached text in publications/PMID_*.md; `full_text` records whether that
# cache holds the full paper or only the abstract. Every supporting_text is a
# verbatim quote, checked by `just validate-quotes`.
#
# Verdicts:
#   MIGRATE_TO_MF  the cited paper shows the protein (or a named domain of it)
#                  cross-linking or bundling actin filaments, which is what
#                  GO:7770064 defines. Same reference and evidence code.
#   PROCESS_ONLY   the paper shows a mutant or knockdown phenotype on actin
#                  organization, not the activity itself. The row belongs on a
#                  process term; the MF for the gene needs its own evidence.
#   CHECK          cannot be settled from the cached text (abstract only, or
#                  the abstract and the row disagree). Needs the curator who
#                  made the row, or the full text.
#   WRONG_SENSE    the paper is about something else that shares the word.

