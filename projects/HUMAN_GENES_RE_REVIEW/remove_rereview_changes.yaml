title: 'Re-review of REMOVE actions in human gene reviews: row-level changes'
date: '2026-11-10'
issue: https://github.com/ai4curation/ai-gene-review/issues/4097
base_commit: f0a0e4c53
scope:
  remove_rows_at_start: 23802
  bare_protein_binding_rows: 22013
  substantive_rows: 1789
  rows_reactioned: 408
  remove_rows_kept_with_revised_reason: 9
  source_defects_recorded: 60
  reviews_edited: 222
  remove_rows_at_end: 23394
description: 'changes lists every row whose review block was edited: rows that moved from REMOVE to another action,
  and rows that stay REMOVE with a corrected reason or a recorded source defect. retained_with_note lists REMOVE
  rows that were examined closely and left in place; close_call marks judgement calls that a curator might decide
  differently. index is the position of the row in existing_annotations at base_commit; term, evidence_type and
  reference identify the row if the file is re-fetched. A note that names further indexes covers those rows as well.'
rules:
  same-term-kept: The same term is kept on another row of the review. Rows that share a term are judged alike, so
    the row takes the action of its sibling; a defect in the row's own reference or evidence is recorded as a source
    defect.
  ancestor-of-kept: The removed term is an ancestor of a term kept in the review, so it is true; it is recorded
    as TOO_GENERAL.
  true-but-broad: The reason conceded that the term is true but broad; it is kept or refined, not removed.
  reason-concedes-truth: The reason for removal conceded that the claim is true (uninformative, redundant, better
    described elsewhere). A true claim is kept, as core or non-core.
  general-to-specific: A correct but general term is refined to the specific term the evidence supports (MODIFY).
  lateral-correction: The observation is real but the term misstates it (wrong sign, wrong cofactor, wrong compartment);
    it is redirected to the term the evidence supports (MODIFY).
  claim-established: An electronic or similarity transfer whose donor annotation comes from a targeted experiment
    that establishes the claim; kept as non-core.
  electronic-unsupported-plausible: An electronic or similarity transfer whose donor annotation is experimental
    but over-reads a phenotype or downstream consequence; marked as an over-annotation instead of removed.
  downstream-readout: The term describes a downstream readout of the established function; marked as an over-annotation.
  experimental-incomplete-evidence: An experimental or curated row removed on the strength of an abstract or without
    access to the source; left UNDECIDED, or kept where the function is clearly correct.
  experimental-fulltext-supports: The full text of the cited paper supports the annotation.
  curated-statement: A curated author statement (TAS, NAS, IC) whose claim is plausible and uncontradicted; kept
    or marked instead of removed.
  omics-location: A location from proteomics, high-throughput imaging or the Human Protein Atlas with no positive
    contradiction; marked as an over-annotation, or kept as non-core where independent evidence agrees.
  omics-function: A molecular function inferred from an omics hit (cadherin interactome, RNA interactome capture);
    marked as an over-annotation.
  expression-only: A process annotated from an expression change of the gene (IEP, HEP and expression-based direct
    assays); marked as an over-annotation.
  reactome-location: A location taken from a Reactome reaction that is plausible for the reaction but not a place
    of residence; kept as non-core or marked.
  er-transit: An endoplasmic reticulum row on a secreted or membrane protein that rests on transit; marked as an
    over-annotation, following the organelle policy.
  organelle-root: 'A root organelle term handled under the organelle policy: the organelle claim holds, so the row
    is kept.'
  cross-gene-consistency: Twin genes or subunits of one complex are treated alike across reviews.
  iba-node-not-examined: A phylogenetic annotation removed without an argument against the node placement.
  promiscuous-activity: A measured secondary enzyme activity handled under the promiscuous-activity tiers.
  remove-rereasoned: REMOVE stands; the reason was corrected or a source defect was recorded.
  source-defect-recorded: REMOVE stands and the action is unchanged; the error in the source record that justifies
    it is recorded as a structured source defect.
  protein-binding-audit: Bare protein binding row (sanctioned REMOVE); a source defect found during the policy audit
    was recorded.
