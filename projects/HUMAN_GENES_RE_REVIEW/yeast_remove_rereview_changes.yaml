title: 'Re-review of REMOVE actions in yeast gene reviews: row-level changes'
date: '2026-11-20'
issue: https://github.com/ai4curation/ai-gene-review/issues/4097
base_commit: 9496534c1
scope:
  review_files: 905
  remove_rows_at_start: 3068
  bare_protein_binding_rows: 2440
  substantive_rows: 628
  reviews_with_substantive_rows: 342
  reviews_with_protein_binding_rows: 347
  rows_reactioned: 38
  remove_rows_kept_with_revised_record: 5
  source_defects_recorded: 5
  reviews_edited: 27
  remove_rows_at_end: 3030
  retired_rows:
    substantive: 10
    bare_protein_binding: 325
    reactioned: 2
  protein_binding_rows_without_reason: 261
description: 'changes lists every REMOVE row whose review block was edited: rows that moved from REMOVE to another action,
  and rows that stay REMOVE with a written reason or a recorded source defect. retained_with_note lists REMOVE rows that were
  examined closely and left in place; close_call marks judgement calls that a curator might decide differently. index is the
  position of the row in existing_annotations at base_commit; term, evidence_type and reference identify the row if the file
  is re-fetched. A note that names further indexes covers those rows as well. followups lists rows outside the scope of this
  pass that the pass shows to need another look; within it, transfers_of_changed_source_rows lists rows in other reviews that
  are transfers of yeast rows changed here. retired_rows counts REMOVE rows marked retired (GOA no longer carries the annotation);
  they were read like the others and are included in the other counts.'
rules:
  same-term-kept: The same term is kept, redirected or marked on another row of the review. Rows that share a term are judged
    alike, so the row takes the action of its sibling; a defect in the row's own source is recorded as a source defect.
  ancestor-of-kept: The removed term is an ancestor of a term kept in the review, so it is true; it is recorded as TOO_GENERAL.
  omics-location: A location from an organelle or membrane proteome, or from a high-throughput localisation screen, removed
    as probable contamination with no study that refutes the detection. The organelle policy keeps a directly observed location,
    so the proteome rows are kept as non-core; the one hit from a screen with over-produced proteins is marked as an over-annotation.
  observation-over-read: An experimental row that records a real observation in a term that names more than was shown; marked
    as an over-annotation.
  evidence-supports-claim: The row's own paper or curated record supports the claim (checked in the abstract or in the UniProt
    statement tied to a publication), so the removal argument fails; kept as non-core.
  experimental-incomplete-evidence: An experimental row removed on the strength of an abstract that does not describe the
    assay the term names; the full text could not be obtained, so the row is left UNDECIDED.
  lateral-correction: The link between gene and process is real but the term misstates it (participation where the gene product
    represses); it is redirected to the term that states it (MODIFY).
  self-binding-observed: Identical protein binding removed as uninformative, like bare protein binding. The protein-binding
    policy covers bare protein binding only; a recorded self-interaction that may be indirect (bridged in a two-hybrid assay,
    co-recovered in a purification) is marked as an over-annotation.
  remove-rereasoned: REMOVE stands; a missing reason was written.
  source-defect-recorded: REMOVE stands and the action is unchanged; the error in the source record that justifies it is recorded
    as a structured source defect.
