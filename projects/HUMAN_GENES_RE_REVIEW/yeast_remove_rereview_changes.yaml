followups:
  yeast_rows_to_revisit:
  - 'ERG19 and MVD1 are two review folders for the same protein (P32377). They disagree on the vacuole statement of PMID:28904410:
    ERG19 index 12 is MARK_AS_OVER_ANNOTATED, MVD1 index 10 is REMOVE. One folder should be retired.'
  - The vacuole and mitochondrion statements of the ergosterol review article (PMID:28904410) are REMOVE in ERG8, ERG10, ERG13
    and MVD1 and MARK_AS_OVER_ANNOTATED in ERG19, ERG20 and IDI1. The claim is the same for all of them.
  - 'ARO7 index 14, nucleus (HDA, MARK_AS_OVER_ANNOTATED): the targeted study found the functional fusion exclusively in the
    cytoplasm.'
  - 'ACO2 index 13 and THI3 index 9, cytosol (IBA, MARK_AS_OVER_ANNOTATED): the pathway-derived rows for the same claim were
    harmonised with them; removal of all rows for the claim would also be defensible.'
  - 'HXK1 indexes 48, 49 and 52, HXK2 indexes 56, 57 and 60 (sugar import, IGI) and GCY1 indexes 14 and 21 (pentose catabolism,
    IDA), all MARK_AS_OVER_ANNOTATED: the electronic rows for the same claims were harmonised with them. The reasons describe
    a failure of participation (the kinase does not transport; reduction of a pentose is not its catabolism), so removal of
    all rows for these claims would also be defensible, and the experimental rows may be the ones in the wrong tier.'
  - 46 high-throughput mitochondrion rows in other yeast reviews are MARK_AS_OVER_ANNOTATED (for example ACC1, IDP3, FAS1,
    GPD1). Rule 2 of the organelle policy keeps a directly observed location, as this pass now does for the proteome rows
    it changed; those rows were not REMOVE rows and were not touched.
  - SAS3 index 9, silent mating-type cassette heterochromatin formation (IMP, KEEP_AS_NON_CORE) is the second row from PMID:11731479,
    a paper with no sas3 mutant; the claim is kept on other papers, but the row belongs to SAS2 like index 11 (see the source
    defect there).
  - 'MDH2 index 26, intracellular organelle lumen (TOO_GENERAL): the entailing row is nuclear periphery from a localisation
    screen under stress; MARK_AS_OVER_ANNOTATED is the near alternative.'
  - COX17 index 19, mitochondrion (IDA, KEEP_AS_NON_CORE) is the second MGI row from PMID:8078902, a paper on COX10; the location
    is true of Cox17 but the row is mis-sourced.
  transfers_of_changed_source_rows:
  - 'CANAL/CEK2 index 22, identical protein binding (IEA, REMOVE): a transfer of the Fus3 self-interaction rows (FUS3 indexes
    46 and 47), which this pass marks as over-annotations instead of removing them. The removal is defensible as it stands:
    a transfer of a self-interaction to another species has no observation behind it, and the rule that rows sharing a term
    are judged alike applies within one review. Found by a sweep over every changed row for rows in other reviews that name
    the yeast protein as their source; no other transfer differs from its changed source.'
