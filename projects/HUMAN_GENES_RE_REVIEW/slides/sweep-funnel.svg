<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">The A→Z sweep: what a second reader changed</text>
  <!-- funnel -->
  <path d="M40 70 L600 70 L560 150 L80 150 Z" fill="#dcefec" stroke="#0e6b66"/>
  <text x="320" y="104" text-anchor="middle" font-size="22" font-weight="600" fill="#15201e">1,323 human review files</text>
  <text x="320" y="130" text-anchor="middle" font-size="14" fill="#56655f">AAAS … ZSWIM8, read alphabetically in 71 batches</text>
  <path d="M80 160 L560 160 L520 240 L120 240 Z" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="320" y="196" text-anchor="middle" font-size="22" font-weight="600" fill="#15201e">~55k annotation actions</text>
  <text x="320" y="222" text-anchor="middle" font-size="14" fill="#56655f">"do I agree?" from YAML + cached papers</text>
  <path d="M120 250 L520 250 L480 330 L160 330 Z" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="320" y="286" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">6 flagged, not edited</text>
  <text x="320" y="310" text-anchor="middle" font-size="13" fill="#56655f">4 fence cases · 2 need literature</text>
  <path d="M160 340 L480 340 L440 420 L200 420 Z" fill="#fbf1e6" stroke="#b8620f"/>
  <text x="320" y="378" text-anchor="middle" font-size="22" font-weight="600" fill="#b8620f">3 actions changed</text>
  <text x="320" y="402" text-anchor="middle" font-size="13" fill="#56655f">≈ 99.7% agreement at gene level</text>
  <!-- edits -->
  <g transform="translate(640 80)">
    <text font-size="15" font-weight="600" fill="#15201e">The three edits</text>
    <rect y="16" width="290" height="92" rx="10" fill="#ffffff" stroke="#bd3a30"/>
    <text x="14" y="42" font-size="14" font-weight="600" fill="#15201e">ABL1 · GO:0004515</text>
    <text x="14" y="62" font-size="12" fill="#56655f">NMN adenylyltransferase on a Tyr kinase</text>
    <text x="14" y="88" font-size="13" fill="#15201e">UNDECIDED → <tspan fill="#bd3a30" font-weight="600">REMOVE</tspan></text>
    <rect y="122" width="290" height="92" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="14" y="148" font-size="14" font-weight="600" fill="#15201e">ADRM1 · GO:0006368 (IMP)</text>
    <text x="14" y="168" font-size="12" fill="#56655f">experimental, full text not in cache</text>
    <text x="14" y="194" font-size="13" fill="#15201e">REMOVE → <tspan fill="#56655f" font-weight="600">UNDECIDED</tspan></text>
    <rect y="228" width="290" height="92" rx="10" fill="#ffffff" stroke="#1d8a4b"/>
    <text x="14" y="254" font-size="14" font-weight="600" fill="#15201e">BRCA2 · NOT GO:0004402</text>
    <text x="14" y="274" font-size="12" fill="#56655f">correct "no intrinsic HAT" negative</text>
    <text x="14" y="300" font-size="13" fill="#15201e">REMOVE → <tspan fill="#1d8a4b" font-weight="600">ACCEPT</tspan></text>
  </g>
  <text x="30" y="470" font-size="13" fill="#56655f">Sweep completed July 2026. The human set has since grown to 2,048 review files.</text>
</svg>
