<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Fe-S cluster biogenesis: built in the mitochondrion, finished in the cytosol</text>
  <!-- mitochondrion -->
  <rect x="20" y="60" width="640" height="380" rx="60" fill="#e8f1ee" stroke="#8fa39c" stroke-width="4"/>
  <text x="50" y="92" font-size="14" fill="#56655f" font-weight="bold">MITOCHONDRIAL MATRIX (ISC)</text>
  <!-- stage 1 core -->
  <rect x="50" y="110" width="200" height="150" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="150" y="132" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">1. [2Fe-2S] on scaffold</text>
  <text x="150" y="158" font-size="14" text-anchor="middle" fill="#15201e"><tspan font-weight="bold">NFS1–LYRM4</tspan>: Cys → S</text>
  <text x="150" y="180" font-size="14" text-anchor="middle" fill="#15201e"><tspan font-weight="bold">FXN</tspan>: iron / activator</text>
  <text x="150" y="202" font-size="14" text-anchor="middle" fill="#15201e">FDXR–FDX2: electrons</text>
  <rect x="100" y="215" width="100" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="150" y="235" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">ISCU</text>
  <!-- cluster glyph -->
  <g transform="translate(222,230)"><rect x="-9" y="-9" width="18" height="18" fill="#b8620f" transform="rotate(45)"/></g>
  <line x1="250" y1="185" x2="290" y2="185" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- stage 2 transfer -->
  <rect x="295" y="110" width="160" height="150" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="375" y="132" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">2. Transfer</text>
  <text x="375" y="160" font-size="14" text-anchor="middle" fill="#15201e"><tspan font-weight="bold">HSPA9</tspan> + <tspan font-weight="bold">HSCB</tspan></text>
  <text x="375" y="180" font-size="12" text-anchor="middle" fill="#56655f">release cluster from ISCU</text>
  <rect x="325" y="200" width="100" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="375" y="220" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">GLRX5</text>
  <text x="375" y="248" font-size="12" text-anchor="middle" fill="#56655f">[2Fe-2S] carrier</text>
  <line x1="455" y1="185" x2="490" y2="185" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- stage 3 4Fe4S -->
  <rect x="495" y="110" width="150" height="150" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="570" y="132" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">3. [4Fe-4S]</text>
  <text x="570" y="160" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">ISCA1 · ISCA2</text>
  <text x="570" y="182" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">IBA57</text>
  <text x="570" y="204" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">NFU1 · BOLA3</text>
  <text x="570" y="228" font-size="12" text-anchor="middle" fill="#56655f">to respiratory complexes,</text>
  <text x="570" y="243" font-size="12" text-anchor="middle" fill="#56655f">lipoate synthase</text>
  <!-- export -->
  <line x1="375" y1="262" x2="375" y2="400" stroke="#15201e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="385" y="330" font-size="12" fill="#56655f">unknown sulfur-</text><text x="385" y="345" font-size="12" fill="#56655f">containing compound</text>
  <rect x="320" y="420" width="110" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="375" y="446" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">ABCB7</text>
  <line x1="430" y1="440" x2="700" y2="440" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="470" y="470" font-size="13" fill="#56655f">inner-membrane export</text>
  <!-- cytosol CIA -->
  <text x="700" y="92" font-size="14" fill="#56655f" font-weight="bold">CYTOSOL / NUCLEUS (CIA)</text>
  <rect x="700" y="110" width="240" height="360" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="820" y="140" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">4. Cytosolic assembly</text>
  <text x="820" y="176" font-size="13" text-anchor="middle" fill="#56655f">early CIA scaffold (not listed)</text>
  <line x1="820" y1="186" x2="820" y2="216" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="820" y="236" font-size="14" text-anchor="middle" fill="#15201e">CIAO3</text>
  <line x1="820" y1="246" x2="820" y2="276" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="725" y="282" width="190" height="70" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="820" y="306" font-size="13" text-anchor="middle" fill="#0e6b66" font-weight="bold">CIA targeting complex</text>
  <text x="820" y="330" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">CIAO1 · MMS19</text>
  <text x="820" y="346" font-size="12" text-anchor="middle" fill="#56655f">CIAO2A / CIAO2B</text>
  <line x1="820" y1="352" x2="820" y2="392" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="820" y="414" font-size="13" text-anchor="middle" fill="#15201e">cytosolic and nuclear</text>
  <text x="820" y="432" font-size="13" text-anchor="middle" fill="#15201e">Fe-S apoproteins</text>
  <text x="30" y="500" font-size="13" fill="#56655f">Bold names: genes in the project table (all reviewed). Plain names: listed on the page, not yet reviewed.</text>
</svg>
