<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
  </defs>

  <!-- compartments -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#56655f">intermembrane space</text>
  <rect x="16" y="330" width="928" height="26" fill="#dcefec" stroke="#8fa39c"/>
  <text x="24" y="348" font-size="12" fill="#56655f">inner membrane</text>
  <text x="24" y="500" font-size="12" fill="#56655f">matrix side</text>

  <!-- COX17 -->
  <rect x="380" y="60" width="140" height="44" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="450" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">COX17</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#56655f">Cu chaperone</text>

  <!-- SCO1 branch (CuA) -->
  <rect x="150" y="220" width="130" height="44" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="215" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">SCO1</text>
  <text x="215" y="256" text-anchor="middle" font-size="11" fill="#56655f">with SCO2 · COA6</text>
  <!-- COX11 branch (CuB) -->
  <rect x="600" y="220" width="130" height="44" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="665" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">COX11</text>
  <text x="665" y="256" text-anchor="middle" font-size="11" fill="#56655f">Cu chaperone (IM)</text>

  <!-- CcO sites -->
  <rect x="120" y="380" width="190" height="48" rx="10" fill="#ffffff" stroke="#15201e" stroke-width="1.6"/>
  <text x="215" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">COX2 · CuA site</text>
  <rect x="570" y="380" width="190" height="48" rx="10" fill="#ffffff" stroke="#15201e" stroke-width="1.6"/>
  <text x="665" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">COX1 · CuB site</text>
  <text x="440" y="470" text-anchor="middle" font-size="13" fill="#56655f">cytochrome c oxidase (complex IV)</text>

  <!-- copper transfer -->
  <g stroke="#0e6b66" stroke-width="2.5" fill="none">
    <path d="M410 106 L260 216" marker-end="url(#a)"/>
    <path d="M490 106 L640 216" marker-end="url(#a)"/>
    <path d="M215 266 L215 376" marker-end="url(#a)"/>
    <path d="M665 266 L665 376" marker-end="url(#a)"/>
  </g>
  <text x="300" y="150" font-size="12" fill="#0e6b66">Cu⁺</text>
  <text x="580" y="150" font-size="12" fill="#0e6b66">Cu⁺</text>

  <!-- COA4 validated -->
  <rect x="790" y="120" width="150" height="56" rx="10" fill="#f6efe6" stroke="#b8620f" stroke-width="2"/>
  <text x="865" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">COA4</text>
  <text x="865" y="161" text-anchor="middle" font-size="11" fill="#b8620f">orphan, now assigned</text>
  <path d="M840 178 L730 228" stroke="#1d68b3" stroke-width="3.5" fill="none" marker-end="url(#b)"/>
  <text x="800" y="220" font-size="12" font-weight="700" fill="#1d68b3">predicted +</text>
  <text x="800" y="236" font-size="12" font-weight="700" fill="#1d68b3">co-IP validated</text>

  <!-- COX19 known -->
  <rect x="790" y="40" width="150" height="40" rx="10" fill="#ffffff" stroke="#8fa39c"/>
  <text x="865" y="65" text-anchor="middle" font-size="14" fill="#15201e">COX19</text>
  <path d="M820 82 C 760 120, 730 180, 705 218" stroke="#8fa39c" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#g)"/>
  <text x="770" y="112" text-anchor="end" font-size="11" fill="#56655f">known COX11 partner</text>

  <!-- predicted only -->
  <rect x="380" y="220" width="150" height="40" rx="10" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="4 3"/>
  <text x="455" y="245" text-anchor="middle" font-size="14" fill="#15201e">CMC2 · COX23</text>
  <path d="M410 262 L290 378" stroke="#8fa39c" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#g)"/>
  <path d="M500 262 L600 378" stroke="#8fa39c" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#g)"/>
  <text x="455" y="290" text-anchor="middle" font-size="11" fill="#56655f">predicted only:</text>
  <text x="455" y="304" text-anchor="middle" font-size="11" fill="#56655f">CMC2–COX2, COX23–COX1</text>

  <!-- KO readout -->
  <g transform="translate(790 270)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#15201e">COA4 knockout:</text>
    <text x="0" y="18" font-size="12" fill="#15201e">COX11 ↓ · mito Cu ↓</text>
    <text x="0" y="36" font-size="12" fill="#15201e">CIV supercomplexes ↓</text>
    <text x="0" y="54" font-size="12" fill="#15201e">respiration ↓</text>
  </g>
</svg>
