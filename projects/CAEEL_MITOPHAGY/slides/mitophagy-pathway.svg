<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">From a damaged mitochondrion to the lysosome: the 17 reviewed genes</text>
  <!-- step 1: network + fission -->
  <text x="40" y="72" font-size="13" font-weight="bold" fill="#56655f">1. Dynamics</text>
  <rect x="40" y="90" width="190" height="56" rx="28" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <path d="M60,118 q12,-14 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="135" y="168" font-size="12" fill="#15201e" text-anchor="middle">fusion: FZO-1 (outer), EAT-3 (inner)</text>
  <path d="M135,178 L135,210" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="145" y="198" font-size="12" fill="#15201e">fission: DRP-1</text>
  <!-- damaged piece -->
  <ellipse cx="135" cy="275" rx="90" ry="48" fill="#fbeeec" stroke="#bd3a30" stroke-width="2.5"/>
  <path d="M65,275 q10,-12 20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#bd3a30" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="135" y="340" font-size="12" fill="#bd3a30" text-anchor="middle">depolarised, import blocked</text>
  <!-- PINK-1 etc -->
  <rect x="200" y="226" width="60" height="22" rx="4" fill="#0e6b66"/>
  <text x="230" y="241" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PINK-1</text>
  <rect x="200" y="252" width="60" height="22" rx="4" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="230" y="267" font-size="12" font-weight="bold" fill="#0e6b66" text-anchor="middle">PDR-1</text>
  <text x="268" y="265" font-size="16" fill="#7657a3">Ub Ub</text>
  <rect x="200" y="278" width="60" height="22" rx="4" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  <text x="230" y="293" font-size="12" font-weight="bold" fill="#1d68b3" text-anchor="middle">DCT-1</text>
  <text x="165" y="238" font-size="11" fill="#15201e" text-anchor="end">MIRO-1</text>
  <text x="165" y="251" font-size="10" fill="#56655f" text-anchor="end">degraded, stops</text>
  <text x="165" y="262" font-size="10" fill="#56655f" text-anchor="end">transport</text>
  <text x="40" y="382" font-size="13" font-weight="bold" fill="#56655f">2. Tagging</text>
  <text x="40" y="400" font-size="12" fill="#15201e">PINK-1 kinase recruits PDR-1 (Parkin) E3 ligase;</text>
  <text x="40" y="416" font-size="12" fill="#15201e">DCT-1 (BNIP3L/NIX) is a direct receptor</text>
  <!-- LIR link -->
  <path d="M262,290 L380,290" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="320" y="282" font-size="11" fill="#1d68b3" text-anchor="middle">LIR motif</text>
  <text x="320" y="308" font-size="11" fill="#1d68b3" text-anchor="middle">GO:0140580 NEW</text>
  <!-- phagophore -->
  <text x="390" y="72" font-size="13" font-weight="bold" fill="#56655f">3. Engulfment</text>
  <path d="M470,190 A100,100 0 1,0 470,390" fill="none" stroke="#0e6b66" stroke-width="7"/>
  <text x="484" y="200" font-size="12" fill="#15201e">BEC-1 (VPS34 complex, PI3P)</text>
  <text x="484" y="216" font-size="12" fill="#15201e">ATG-18 (WIPI, PI3P effector)</text>
  <circle cx="396" cy="290" r="10" fill="#0e6b66"/>
  <text x="396" y="294" font-size="9" fill="#ffffff" text-anchor="middle">L1</text>
  <text x="410" y="330" font-size="12" fill="#15201e">LGG-1 (GABARAP),</text>
  <text x="410" y="346" font-size="12" fill="#15201e">LGG-2 (LC3)</text>
  <text x="410" y="362" font-size="12" fill="#15201e">SQST-1 (p62) cargo adaptor</text>
  <!-- fusion with lysosome -->
  <path d="M560,290 L640,290" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="600" y="280" font-size="12" fill="#15201e" text-anchor="middle">EPG-5</text>
  <text x="600" y="310" font-size="10" fill="#56655f" text-anchor="middle">fusion (NEW)</text>
  <circle cx="710" cy="290" r="62" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="710" y="286" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">lysosome</text>
  <text x="710" y="302" font-size="11" fill="#15201e" text-anchor="middle">degradation</text>
  <text x="640" y="72" font-size="13" font-weight="bold" fill="#56655f">4. Degradation</text>
  <!-- nucleus -->
  <rect x="776" y="90" width="176" height="190" rx="16" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <text x="864" y="110" font-size="13" font-weight="bold" fill="#56655f" text-anchor="middle">nucleus</text>
  <text x="790" y="136" font-size="12" font-weight="bold" fill="#b8620f">ATFS-1</text>
  <text x="790" y="151" font-size="11" fill="#15201e">UPRmt: chaperones,</text>
  <text x="790" y="165" font-size="11" fill="#15201e">proteases</text>
  <text x="790" y="190" font-size="12" font-weight="bold" fill="#0e6b66">HLH-30 (TFEB)</text>
  <text x="790" y="205" font-size="11" fill="#15201e">autophagy, lysosome genes</text>
  <text x="790" y="230" font-size="12" font-weight="bold" fill="#0e6b66">SKN-1 (Nrf)</text>
  <text x="790" y="245" font-size="11" fill="#15201e">oxidative stress genes</text>
  <path d="M230,226 C300,140 600,110 786,140" fill="none" stroke="#b8620f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="500" y="112" font-size="12" fill="#b8620f" text-anchor="middle">import blocked: ATFS-1 goes to the nucleus</text>
  <!-- spg-7 -->
  <text x="40" y="452" font-size="12" fill="#15201e"><tspan font-weight="bold">SPG-7</tspan> (AFG3L2-like m-AAA protease): inner-membrane quality control; its loss activates UPRmt.</text>
  <text x="40" y="480" font-size="12" fill="#56655f">Schematic from the project page and pathway summary. Blue: the receptor route. Orange: the repair route.</text>
</svg>
