<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="28" y="34" font-size="20" font-weight="bold" fill="#15201e">Cohort outcomes across the 5 curated trafficking ABM modules (N = 100, T = 24)</text>
  <text x="28" y="54" font-size="13" fill="#56655f">Each bar shows 100% of the initial cargo cohort partitioned across terminal/trapped compartments under wild-type vs perturbation scenarios</text>

  <!-- Grid lines for 0%, 25%, 50%, 75%, 100% (x=350 to x=850, width=500px => 5px per 1%) -->
  <g stroke="#e8f1ee" stroke-width="1">
    <line x1="350" y1="70" x2="350" y2="435"/>
    <line x1="475" y1="70" x2="475" y2="435"/>
    <line x1="600" y1="70" x2="600" y2="435"/>
    <line x1="725" y1="70" x2="725" y2="435"/>
    <line x1="850" y1="70" x2="850" y2="435"/>
  </g>
  <g font-size="12" fill="#56655f" text-anchor="middle">
    <text x="350" y="452">0%</text>
    <text x="475" y="452">25%</text>
    <text x="600" y="452">50%</text>
    <text x="725" y="452">75%</text>
    <text x="850" y="452">100%</text>
  </g>

  <!-- Module 1: endosomal_trafficking_routing -->
  <text x="28" y="93" font-size="14" font-weight="bold" fill="#0e6b66">1. TfR1 / LNP Endosomal Routing</text>
  <text x="340" y="93" text-anchor="end" font-size="12" fill="#15201e">WT baseline</text>
  <rect x="350" y="78" width="235" height="22" fill="#1d8a4b"/>
  <rect x="585" y="78" width="215" height="22" fill="#bd3a30"/>
  <rect x="800" y="78" width="50" height="22" fill="#b8620f"/>
  <text x="467" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">47% recycle</text>
  <text x="692" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">43% lysosome</text>
  <text x="860" y="94" font-size="11" font-weight="bold" fill="#b8620f">10% escape</text>

  <text x="340" y="121" text-anchor="end" font-size="12" fill="#56655f">Rab7 loss (PMID:41814093)</text>
  <rect x="350" y="106" width="265" height="22" fill="#1d8a4b"/>
  <rect x="615" y="106" width="235" height="22" fill="#b8620f"/>
  <text x="482" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">53% recycle</text>
  <text x="732" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">47% cytosolic escape</text>

  <!-- Module 2: asgr_galnac_hepatocyte_delivery -->
  <text x="28" y="165" font-size="14" font-weight="bold" fill="#0e6b66">2. ASGR1/2 GalNAc Delivery</text>
  <text x="340" y="165" text-anchor="end" font-size="12" fill="#15201e">WT baseline (uncalibrated)</text>
  <rect x="350" y="150" width="235" height="22" fill="#1d8a4b"/>
  <rect x="585" y="150" width="215" height="22" fill="#bd3a30"/>
  <rect x="800" y="150" width="50" height="22" fill="#b8620f"/>
  <text x="467" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">47% ASGR recycle</text>
  <text x="692" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">43% lysosome</text>
  <text x="860" y="166" font-size="11" font-weight="bold" fill="#b8620f">10% escape</text>

  <text x="340" y="193" text-anchor="end" font-size="12" fill="#56655f">ASGR1/2 surface KO</text>
  <rect x="350" y="178" width="500" height="22" fill="#8fa39c"/>
  <text x="600" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">100% trapped at extracellular ligand pool</text>

  <!-- Module 3: fcrn_igg_albumin_salvage_transcytosis -->
  <text x="28" y="237" font-size="14" font-weight="bold" fill="#0e6b66">3. FcRn (FCGRT/B2M) Salvage</text>
  <text x="340" y="237" text-anchor="end" font-size="12" fill="#15201e">WT pH 6.0 salvage</text>
  <rect x="350" y="222" width="400" height="22" fill="#1d8a4b"/>
  <rect x="750" y="222" width="100" height="22" fill="#bd3a30"/>
  <text x="550" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">80% EHD1/SNAP23 salvage exocytosis</text>
  <text x="800" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">20% lys.</text>

  <text x="340" y="265" text-anchor="end" font-size="12" fill="#56655f">FCGRT/B2M KO or blocker</text>
  <rect x="350" y="250" width="500" height="22" fill="#bd3a30"/>
  <text x="600" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">100% lysosomal catabolism (IgG / albumin wasting)</text>

  <!-- Module 4: retromer_endosome_to_tgn_retrieval -->
  <text x="28" y="309" font-size="14" font-weight="bold" fill="#0e6b66">4. Retromer &amp; SORL1 Retrieval</text>
  <text x="340" y="309" text-anchor="end" font-size="12" fill="#15201e">WT retromer sorting</text>
  <rect x="350" y="294" width="400" height="22" fill="#1d68b3"/>
  <rect x="750" y="294" width="100" height="22" fill="#bd3a30"/>
  <text x="550" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">80% RAB9A / AP-1 TGN retrieval</text>
  <text x="800" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">20% lys.</text>

  <text x="340" y="337" text-anchor="end" font-size="12" fill="#56655f">VPS35 retromer loss</text>
  <rect x="350" y="322" width="500" height="22" fill="#bd3a30"/>
  <text x="600" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">100% lysosomal degradation (reversed by RAB7A block)</text>

  <!-- Module 5: ldl_receptor_mediated_endocytosis -->
  <text x="28" y="381" font-size="14" font-weight="bold" fill="#0e6b66">5. LDLR Cholesterol Clearance</text>
  <text x="340" y="381" text-anchor="end" font-size="12" fill="#15201e">WT LDL clearance</text>
  <rect x="350" y="366" width="500" height="22" fill="#0e6b66"/>
  <text x="600" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">100% LIPA cholesteryl ester hydrolysis</text>

  <text x="340" y="409" text-anchor="end" font-size="12" fill="#56655f">PCSK9 GOF  |  LIPA loss</text>
  <rect x="350" y="394" width="248" height="22" fill="#8fa39c"/>
  <rect x="602" y="394" width="248" height="22" fill="#d98b84"/>
  <text x="474" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PCSK9 GOF: 100% extracellular</text>
  <text x="726" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LIPA KO: 100% endolysosomal trap</text>

  <!-- Legend -->
  <g font-size="12" fill="#15201e">
    <rect x="28" y="472" width="13" height="13" fill="#1d8a4b"/><text x="46" y="483">Recycling / Salvage</text>
    <rect x="178" y="472" width="13" height="13" fill="#1d68b3"/><text x="196" y="483">TGN Retrieval</text>
    <rect x="304" y="472" width="13" height="13" fill="#b8620f"/><text x="322" y="483">Cytosolic Escape</text>
    <rect x="444" y="472" width="13" height="13" fill="#0e6b66"/><text x="462" y="483">Productive Hydrolysis</text>
    <rect x="610" y="472" width="13" height="13" fill="#bd3a30"/><text x="628" y="483">Lysosomal Degradation</text>
    <rect x="786" y="472" width="13" height="13" fill="#8fa39c"/><text x="804" y="483">Upstream Trap</text>
  </g>
</svg>
