# IRDs contradicted by direct evidence in a gene review whose PANTHER family has no
# family review yet. Read by paint_report.py; each entry quotes the review it comes from.
cases:
- family: PTHR12929
  node: PTN000309189
  go_id: GO:0032217
  label: riboflavin transmembrane transporter activity
  clade: primate SLC52A1 (4 proteins)
  gene_review: genes/human/SLC52A1/SLC52A1-ai-review.yaml
  evidence: >-
    Human SLC52A1 (RFVT1) transports riboflavin in direct assays (IDA, PMID:20463145 and
    PMID:21854757). The IRD also blocks GO:0032218 riboflavin transport on the same node.
  suggestion: Retract the IRD for GO:0032217 and GO:0032218.
- family: PTHR13194
  node: PTN000995776
  go_id: GO:0010257
  label: NADH dehydrogenase complex assembly
  clade: fungal CIA30/NDUFAF1 (11 proteins, including Neurospora crassa cia30)
  gene_review: genes/NEUCR/cia30/cia30-ai-review.yaml
  evidence: >-
    N. crassa cia30 disruption mutants fail to form the membrane-arm assembly intermediate
    of complex I (PMID:9769214). The clade includes complex I-containing fungi.
  suggestion: Retract the IRD, or restrict it to a branch that has lost complex I.
- family: PTHR10454
  node: PTN000047958
  go_id: GO:0031265
  label: CD95 death-inducing signaling complex
  clade: mammalian CFLAR (6 proteins)
  gene_review: genes/human/CFLAR/CFLAR-ai-review.yaml
  evidence: >-
    The CD95/TRAILR-FADD DISC assembles with procaspase-8 and cFLIP (PMID:38710704). The
    other CFLAR IRDs on this node (endopeptidase activity, macrophage differentiation,
    neuron apoptosis) agree with the gene review.
  suggestion: Retract the IRD for GO:0031265 only.
