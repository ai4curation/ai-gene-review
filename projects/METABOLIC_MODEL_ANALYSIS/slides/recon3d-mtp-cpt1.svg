<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Two gene-reaction errors in human Recon3D</text>
  <text x="32" y="64" font-size="15" fill="#56655f">Green: biology (reviewed GO). Red: what the model's GPR rules say.</text>

  <!-- Panel A: MTP -->
  <rect x="24" y="84" width="440" height="420" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="40" y="110" font-size="16" font-weight="bold" fill="#0e6b66">Mitochondrial trifunctional protein</text>
  <text x="40" y="130" font-size="12" fill="#56655f">last three steps of long-chain β-oxidation</text>

  <rect x="40" y="148" width="130" height="54" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="105" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e6b66">HADHA (α)</text>
  <text x="105" y="191" font-size="11" text-anchor="middle" fill="#56655f">Entrez 3033</text>
  <rect x="40" y="258" width="130" height="54" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="105" y="282" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e6b66">HADHB (β)</text>
  <text x="105" y="301" font-size="11" text-anchor="middle" fill="#56655f">Entrez 3034</text>

  <rect x="250" y="142" width="200" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="260" y="162" font-size="12" fill="#15201e">enoyl-CoA hydratase</text>
  <rect x="250" y="180" width="200" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="260" y="200" font-size="12" fill="#15201e">3-hydroxyacyl-CoA DH</text>
  <rect x="250" y="262" width="200" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="260" y="282" font-size="12" fill="#15201e">3-ketoacyl-CoA thiolase</text>

  <path d="M172,168 L246,158" stroke="#1d8a4b" stroke-width="2" marker-end="url(#g)"/>
  <path d="M172,178 L246,194" stroke="#1d8a4b" stroke-width="2" marker-end="url(#g)"/>
  <path d="M172,284 L246,278" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="40" y="230" font-size="11" fill="#1d8a4b">GO: HADHB hydratase + DH rows (TAS) → REMOVE;</text>
  <text x="40" y="244" font-size="11" fill="#1d8a4b">those activities belong to HADHA</text>

  <!-- model -->
  <rect x="250" y="330" width="200" height="44" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="260" y="350" font-size="12" font-weight="bold" fill="#bd3a30">HISDr histidase</text>
  <text x="260" y="366" font-size="11" fill="#56655f">EC 4.3.1.3, histidine degradation</text>
  <path d="M105,314 C105,352 180,352 246,352" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="40" y="400" font-size="12" fill="#bd3a30">Recon3D: HADHB's only reaction is histidase.</text>
  <text x="40" y="418" font-size="12" fill="#bd3a30">Thiolase reactions (ACACT5m, ACACT7m, KAT180_m,</text>
  <text x="40" y="436" font-size="12" fill="#bd3a30">ACACT10m) list HADH, HSD17B10, ACAA2, not HADHB.</text>
  <text x="40" y="466" font-size="12" fill="#15201e">Knockout: HADHA blocks FAOXC5C3x;</text>
  <text x="40" y="484" font-size="12" fill="#15201e">HADHB blocks only HISDr.</text>

  <!-- Panel B: CPT1 -->
  <rect x="488" y="84" width="448" height="420" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="504" y="110" font-size="16" font-weight="bold" fill="#0e6b66">CPT1 paralogs</text>
  <text x="504" y="130" font-size="12" fill="#56655f">carnitine O-palmitoyltransferase, EC 2.3.1.21</text>

  <rect x="504" y="150" width="180" height="120" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="594" y="176" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e6b66">CPT reactions (92)</text>
  <text x="594" y="198" font-size="11" text-anchor="middle" fill="#15201e">palmitoyl-CoA + carnitine</text>
  <text x="594" y="214" font-size="11" text-anchor="middle" fill="#15201e">→ palmitoylcarnitine</text>
  <text x="594" y="240" font-size="10" text-anchor="middle" fill="#bd3a30">GPR: 1374 or 126129 or 1375</text>
  <text x="594" y="256" font-size="10" text-anchor="middle" fill="#56655f">CPT1A · CPT1C · CPT1B</text>

  <rect x="740" y="150" width="180" height="44" rx="8" fill="#dcefec" stroke="#1d8a4b" stroke-width="2"/>
  <text x="830" y="177" font-size="13" font-weight="bold" text-anchor="middle" fill="#15201e">CPT1A, CPT1B</text>
  <path d="M738,172 L688,190" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>

  <rect x="740" y="236" width="180" height="60" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="830" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#15201e">CPT1C</text>
  <text x="830" y="280" font-size="11" text-anchor="middle" fill="#56655f">ER, brain</text>
  <path d="M738,252 L688,236" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <rect x="740" y="330" width="180" height="60" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="830" y="354" font-size="12" font-weight="bold" text-anchor="middle" fill="#15201e">palmitoyl-protein</text>
  <text x="830" y="372" font-size="12" font-weight="bold" text-anchor="middle" fill="#15201e">thioesterase (GRIA1)</text>
  <path d="M830,298 L830,326" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>

  <text x="504" y="310" font-size="12" fill="#bd3a30">Model: CPT1C can stand in for CPT1A/B.</text>
  <text x="504" y="330" font-size="12" fill="#1d8a4b">Biology: EC 3.1.2.22, a hydrolase.</text>
  <text x="504" y="350" font-size="12" fill="#1d8a4b">GO review: transferase and</text>
  <text x="504" y="366" font-size="12" fill="#1d8a4b">acyltransferase rows → REMOVE;</text>
  <text x="504" y="382" font-size="12" fill="#1d8a4b">NOT CPT activity → ACCEPT.</text>
  <text x="504" y="430" font-size="12" fill="#15201e">Effect: false redundancy in fatty-acid</text>
  <text x="504" y="448" font-size="12" fill="#15201e">transport; CPT1C expression would wrongly</text>
  <text x="504" y="466" font-size="12" fill="#15201e">predict transport capacity.</text>
</svg>
