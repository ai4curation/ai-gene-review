<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">Four roles that shared one "localization" term</text>
  <!-- ER membrane -->
  <path d="M40 420 L800 420" stroke="#0e6b66" stroke-width="10" fill="none" stroke-linecap="round"/>
  <text x="60" y="455" font-size="14" fill="#0e6b66" font-weight="600">ER membrane</text>
  <!-- ER exit site bud -->
  <path d="M430 420 Q 430 330 480 320 Q 530 330 530 420" fill="#e8f1ee" stroke="#1d68b3" stroke-width="3"/>
  <g fill="#1d68b3"><circle cx="440" cy="370" r="6"/><circle cx="452" cy="340" r="6"/><circle cx="480" cy="322" r="6"/><circle cx="508" cy="340" r="6"/><circle cx="520" cy="370" r="6"/></g>
  <text x="455" y="312" font-size="13" text-anchor="end" fill="#1d68b3">COPII coat</text>
  <!-- SEC16 scaffold (cytosolic face) -->
  <rect x="540" y="386" width="140" height="28" rx="6" fill="#dcefec" stroke="#0e6b66"/>
  <text x="610" y="405" font-size="13" text-anchor="middle" fill="#15201e" font-weight="600">SEC16 scaffold</text>
  <text x="440" y="448" font-size="12" fill="#56655f">1 · coat assembly → GO:0048208</text>
  <!-- LRRK2 -->
  <circle cx="740" cy="396" r="24" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="740" y="401" font-size="12" text-anchor="middle" fill="#b8620f" font-weight="600">LRRK2</text>
  <path d="M714 398 L686 400" stroke="#b8620f" stroke-width="2" marker-end="url(#a)"/>
  <text x="660" y="470" font-size="12" fill="#56655f">3 · regulates Sec16A → GO:0060628</text>
  <!-- TANGO1 -->
  <path d="M400 420 L400 380" stroke="#7657a3" stroke-width="5"/>
  <rect x="330" y="340" width="70" height="40" rx="6" fill="#ffffff" stroke="#7657a3"/>
  <text x="365" y="365" font-size="12" text-anchor="middle" fill="#7657a3" font-weight="600">MIA3</text>
  <text x="260" y="320" font-size="12" fill="#56655f">2 · bulky cargo export</text>
  <!-- vesicle to Golgi -->
  <circle cx="640" cy="200" r="30" fill="#e8f1ee" stroke="#1d68b3" stroke-width="3"/>
  <path d="M510 300 Q 560 230 606 206" stroke="#15201e" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M672 190 L 740 160" stroke="#15201e" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <g fill="#e8f1ee" stroke="#56655f" stroke-width="2">
    <path d="M750 120 Q 830 100 910 120"/><path d="M750 140 Q 830 120 910 140"/><path d="M750 160 Q 830 140 910 160"/>
  </g>
  <text x="830" y="190" font-size="14" text-anchor="middle" fill="#15201e" font-weight="600">Golgi</text>
  <rect x="740" y="210" width="80" height="30" rx="6" fill="#ffffff" stroke="#7657a3"/>
  <text x="780" y="230" font-size="12" text-anchor="middle" fill="#7657a3" font-weight="600">GBF1</text>
  <text x="600" y="130" font-size="12" fill="#56655f">2 · ER → Golgi transport</text>
  <text x="600" y="146" font-size="12" fill="#56655f">→ GO:0006888</text>
  <!-- BAP31 QC -->
  <rect x="120" y="396" width="90" height="48" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="165" y="425" font-size="12" text-anchor="middle" fill="#bd3a30" font-weight="600">BAP29/31</text>
  <text x="70" y="370" font-size="12" fill="#56655f">4 · ER quality control, upstream of export</text>
  <text x="70" y="386" font-size="12" fill="#56655f">→ GO:0034976 (or child)</text>
  <text x="40" y="70" font-size="12.5" fill="#56655f">ER lumen below the membrane · cytosol above. Schematic, not to scale.</text>
</svg>
