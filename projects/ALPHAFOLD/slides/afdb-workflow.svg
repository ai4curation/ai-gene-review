<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="38" font-size="21" font-weight="700" fill="#15201e">Proposed workflow (not yet built)</text>
  <text x="30" y="62" font-size="14" fill="#56655f">Each claim in a review is checked against a structural feature of the predicted model</text>

  <!-- step 1 -->
  <rect x="30" y="90" width="170" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="115" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">1 · Fetch</text>
  <text x="115" y="138" text-anchor="middle" font-size="13" fill="#15201e">UniProt accession</text>
  <text x="115" y="156" text-anchor="middle" font-size="13" fill="#15201e">→ AFDB model</text>
  <text x="115" y="172" text-anchor="middle" font-size="11" fill="#56655f">monomer or complex</text>
  <line x1="200" y1="135" x2="246" y2="135" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 2: features w/ pLDDT strip -->
  <rect x="250" y="90" width="300" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="400" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">2 · Extract features</text>
  <g>
    <rect x="266" y="130" width="60" height="14" fill="#1d68b3"/>
    <rect x="326" y="130" width="40" height="14" fill="#8fa39c"/>
    <rect x="366" y="130" width="90" height="14" fill="#1d68b3"/>
    <rect x="456" y="130" width="78" height="14" fill="#b8620f"/>
  </g>
  <text x="266" y="162" font-size="11" fill="#56655f">per-residue pLDDT: ordered domains vs disordered (&lt;70)</text>
  <text x="266" y="176" font-size="11" fill="#56655f">+ fold, pockets, TM helices, interfaces</text>
  <line x1="550" y1="135" x2="596" y2="135" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 3/4 -->
  <rect x="600" y="90" width="150" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="675" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">3 · Compare</text>
  <text x="675" y="140" text-anchor="middle" font-size="13" fill="#15201e">with GO terms</text>
  <text x="675" y="158" text-anchor="middle" font-size="13" fill="#15201e">or ARBA rule</text>
  <line x1="750" y1="135" x2="796" y2="135" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="800" y="90" width="130" height="90" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="865" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">4 · Flag</text>
  <text x="865" y="140" text-anchor="middle" font-size="13" fill="#15201e">mismatch in</text>
  <text x="865" y="158" text-anchor="middle" font-size="13" fill="#15201e">review output</text>

  <!-- checks table -->
  <text x="30" y="226" font-size="17" font-weight="700" fill="#15201e">Claim → structural check → flag if absent</text>
  <g font-size="14" fill="#15201e">
    <rect x="30" y="240" width="900" height="44" fill="#f4f7f6"/>
    <text x="46" y="268">"ATP binding" (MF)</text><text x="330" y="268">recognisable nucleotide-binding fold</text><text x="700" y="268" fill="#b8620f">no fold → challenge</text>
    <text x="46" y="312">"kinase activity" via ARBA rule</text><text x="330" y="312">kinase fold, active-site residues placed</text><text x="700" y="312" fill="#b8620f">lacking → review rule</text>
    <rect x="30" y="328" width="900" height="44" fill="#f4f7f6"/>
    <text x="46" y="356">"transmembrane transport"</text><text x="330" y="356">predicted TM helices</text><text x="700" y="356" fill="#b8620f">none → implausible</text>
    <text x="46" y="400">complex membership (CC)</text><text x="330" y="400">protein in AFDB quaternary prediction</text><text x="700" y="400" fill="#56655f">absent ≠ evidence against</text>
    <rect x="30" y="416" width="900" height="44" fill="#f4f7f6"/>
    <text x="46" y="444">structured-domain claim</text><text x="330" y="444">region has high pLDDT</text><text x="700" y="444" fill="#b8620f">disordered → question</text>
  </g>
  <text x="30" y="494" font-size="13" fill="#56655f">Evidence would be COMPUTATIONAL, citing the AFDB accession; pLDDT gives a built-in confidence. BGC work showed real complexes can score low ipTM.</text>
</svg>
