title: 'Phase 1 anchor gene set: human experimental molecular adaptor activity annotations'
description: 'Human gene products carrying at least one EXPERIMENTAL annotation (evidence under

  ECO:0000269: IDA, IPI, IMP, IGI, IEP, EXP) to GO:0060090 molecular adaptor activity

  or a descendant. This is the deterministic anchor set for the Molecular Adaptor

  Activity annotation-review project; it is a worklist, not a set of curation decisions.

  Genes are grouped by ''branch'' so the epigenetic/RNA ''reader'' sub-branch and the

  scaffold and membrane-tether sub-branches can be scoped separately from the core

  protein-adaptor terms.'
source:
  resource: QuickGO annotation downloadSearch API
  go_root: GO:0060090
  go_usage: descendants over is_a, part_of, occurs_in
  taxon: 9606 (Homo sapiens)
  gene_product_type: protein
  evidence_filter: ECO:0000269 (experimental), descendants
  retrieved: '2026-11-07'
  annotation_rows: 1289
  gene_products: 666
branch_gene_counts:
  core_adaptor: 516
  reader: 114
  scaffold: 45
  tether_anchor: 17
  note: a gene may appear in more than one branch; branches are a pragmatic surface-role grouping and
    deliberately cut across the ontology (e.g. the reader subtree nests under GO:0140463, itself a core_adaptor
    term), so counts sum above the 666 distinct genes
