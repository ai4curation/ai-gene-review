# Provenance for the propagation / IBA statistics quoted on the project page.
# Reproducible QuickGO annotation-statistics queries. Regenerate by re-running
# the documented curl calls; do not hand-edit the counts.
source: QuickGO annotation statistics API (https://www.ebi.ac.uk/QuickGO/services/annotation/stats)
retrieved: '2026-11-07'
note: >-
  The two subtrees below are DIFFERENT roots (GO:0030674 vs GO:0060090) and the
  facets are different (assigned_by/evidence vs evidence-code), so the figures
  are not directly comparable as a single breakdown; each is reported against its
  own query.

queries:
  - label: GO:0030674 subtree, all annotations, assigned_by + evidence facets
    url: >-
      https://www.ebi.ac.uk/QuickGO/services/annotation/stats?goId=GO:0030674&goUsage=descendants&goUsageRelationships=is_a,part_of,occurs_in
    total_annotations: 446453
    evidence_facets:
      ECO:0007826 (phylogenetic, TreeGrafter/PANTHER): 0.4805   # 214533
      ECO:0000256 (sequence-model match): 0.2148                # 95895
      ECO:0000501 (general electronic): 0.1299                  # 58009
      ECO:0000265 (sequence orthology): 0.1216                  # 54297
      ECO:0000318 (IBA, biological aspect of ancestor): 0.0410  # 18295
    assigned_by_facets:
      TreeGrafter: 0.4805   # 214533
      UniProt: 0.2263       # 101031
      InterPro: 0.1229      # 54883
      Ensembl: 0.1007       # 44949
      GO_Central: 0.0427    # 19042

  - label: GO:0060090 full tree, IBA-only (ECO:0000318) annotations
    url: >-
      https://www.ebi.ac.uk/QuickGO/services/annotation/stats?goId=GO:0060090&goUsage=descendants&goUsageRelationships=is_a,part_of,occurs_in&evidenceCode=ECO:0000318&evidenceCodeUsage=descendants
    total_annotations: 20948
    assigned_by_facets:
      GO_Central: 1.0   # 20948 (100%)
