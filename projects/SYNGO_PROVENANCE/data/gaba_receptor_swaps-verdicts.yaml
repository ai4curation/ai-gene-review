# Verdicts on the papers flagged by gaba_receptor_swaps.py (output:
# gaba_receptor_swaps.yaml, 2026-11-17). Hand-curated; quotes are verbatim from
# the cached PubMed records and checked by `just validate-quotes`.
#
# The two GABA receptor families share a letter. GABA-B receptor subunits are
# written GABA(B1) and GABA(B2) (genes GABBR1, GABBR2); GABA-A beta subunits
# are beta1-3 (genes GABRB1-3). A GABA-B finding recorded on a GABRB gene is a
# wrong gene product with cause SYMBOL_COLLISION. Each abstract below defines
# the entity it studies as a GABA-B receptor subunit, which the full text
# cannot change, so these are CONFIRMED; PMID:15174078 was also read in full.
#
# derived_rows counts QuickGO rows on the same GO term whose WITH/FROM names the
# seed accession. Where SynGO has the same term on the same gene from another
# paper, the derived rows do not depend on the swap alone (noted per term).
#
# IBA (swap_iba_donors.py, output gaba_receptor_swaps-iba.yaml, 2026-11-17):
# PAINT names donors by MGI/RGD identifier. Listing every IBA that names each
# swapped gene, and keeping those on a swapped term or an ancestor of one, the
# swaps feed three IBA terms: GO:0098982 GABA-ergic synapse (PTN008566841; all
# three genes are donors, and for MGI:95619 and RGD:2650 the swap is their only
# support), GO:0045211 postsynaptic membrane (PTN008360792; RGD:2649, whose
# only support is the swapped GO:0099634 row) and GO:0005886 plasma membrane
# (PTN001054635; both rat genes, each with independent support). Every node
# keeps independent support from other donors, so correcting the seeds removes
# donors, not IBAs. The rest of the spread is Ensembl IEA projections
# (GO_REF:0000107), UniProt automatic rows (GO_REF:0000120) and four UniProt
# ISS rows (GO_REF:0000024) copying rat Gabrb2's postsynaptic specialization
# membrane, which rat Gabrb2 also has from an independent IDA (PMID:9464994).
#
# derived_rows is a count of annotation records (different evidence codes and
# extensions count separately), not of independent experiments. Correcting a
# seed will not necessarily remove every derived row: UniProt GO_REF:0000120
# rows merge several automatic sources (some also cite an ARBA rule or the
# human ortholog), and the ISS rows are manual transfers that need their own
# correction. So the request to resources is to remove the erroneous support,
# regenerate affected automatic annotations, and review the ISS/ISO transfers.
checked: '2026-11-17'
papers:
- reference: PMID:11498050
  title: Epilepsy, hyperalgesia, impaired memory, and loss of pre- and postsynaptic GABA(B) responses in mice lacking GABA(B(1)).
  verdict: WRONG_GENE_PRODUCT
  confidence: CONFIRMED
  evidence_depth: ABSTRACT_ONLY
  syngo_records_on_wrong_gene: 12
  explanation: >-
    A GABA(B1) knockout paper. SynGO annotated it to mouse Gabbr1, which is
    correct, and gave mouse Gabrb1 (the GABA-A beta1 subunit) the same 12
    records: three terms, each as EXP, IDA and IMP, with the GPCR activity term
    recorded twice per code (occurs_in Schaffer collateral - CA1 synapse and
    occurs_in GABA-ergic synapse), so 3 + 3 + 6.
    One term, G protein-coupled neurotransmitter receptor activity, is
    biologically impossible for a subunit of a ligand-gated chloride channel.
    Each of the three terms has 58 derived records in 57 species, including
    human GABRB1; on human GABRB1 GO's own inference (GO_REF:0000108) then adds
    GO:0007186 G protein-coupled receptor signaling pathway.
  asserted: mouse Gabrb1 (UniProtKB:P50571)
  seed_accessions: [P50571]
  corrected: mouse Gabbr1 (UniProtKB:Q9WV18), which SynGO already annotated from this paper; the Gabrb1 rows should be removed
  suspect_annotations:
  - {go_id: GO:0099528, go_name: G protein-coupled neurotransmitter receptor activity, codes: [EXP, IDA, IMP], derived_rows: 58, derived_by: {Ensembl IEA GO_REF:0000107: 58}, derived_taxa: 57, biologically_wrong: true}
  - {go_id: GO:0098685, go_name: Schaffer collateral - CA1 synapse, codes: [EXP, IDA, IMP], derived_rows: 58, derived_by: {Ensembl IEA GO_REF:0000107: 58}, derived_taxa: 57}
  - {go_id: GO:0098982, go_name: GABA-ergic synapse, codes: [EXP, IDA, IMP], derived_rows: 58, derived_by: {Ensembl IEA GO_REF:0000107: 41, UniProt IEA GO_REF:0000120: 17}, derived_taxa: 57}
  inferred_downstream:
  - {gene: human GABRB1 (UniProtKB:P18505), go_id: GO:0007186, go_name: G protein-coupled receptor signaling pathway, source: GOC IEA GO_REF:0000108 from GO:0099528}
  supported_by:
  - reference_id: PMID:11498050
    supporting_text: Here, we demonstrate that Balb/c mice lacking the GABA(B(1)) subunit are viable
  - reference_id: PMID:11498050
    supporting_text: This demonstrates that GABA(B(1)) is an essential component of pre- and postsynaptic GABA(B) receptors
- reference: PMID:15174078
  title: Subcellular localization of GABAB receptor subunits in rat globus pallidus.
  verdict: WRONG_GENE_PRODUCT
  confidence: CONFIRMED
  evidence_depth: FULL_TEXT
  evidence_source: full text supplied by the curator (PDF), read 2026-11-17; the cached record is abstract-only
  syngo_records_on_wrong_gene: 18
  explanation: >-
    An immunogold study of GABA(B1) and GABA(B2) in rat globus pallidus. SynGO
    recorded the localizations on rat Gabrb1 and Gabrb2 (GABA-A beta1 and
    beta2) and not on Gabbr1 or Gabbr2. Every assertion appears as two IDA
    records (evidence ECO:0006003 and ECO:0007719), so the 18 records are 9
    assertions: 3 on Gabrb1 (three terms) and 6 on Gabrb2 (four terms, two of
    them with two synapse-type extensions). The rat Gabrb1 presynaptic active zone
    membrane row is projected by Ensembl to 4 annotations in 2 species,
    including human GABRB1, and is the only presynaptic location on GABRB1's
    record. Read in full, the paper's receptor antibodies target the C-termini
    of GABA(B1) (common to the 1a and 1b splice variants) and GABA(B2); the
    other labels are VGLUT2 and an anterograde tracer. GABA-A receptors appear
    only in the introduction and discussion. SynGO made no Gabbr1 or Gabbr2
    records from this paper, so the fix is re-curation, not an identifier swap:
    the paper finds labelling in the main body of GABAergic synapses but mostly
    perisynaptic labelling at glutamatergic (VGLUT2-positive) synapses, so each
    compartment term and synapse-type extension should be checked against its
    figures. The Gabrb2 postsynaptic specialization membrane record with a
    glutamatergic synapse extension needs this most.
  asserted: rat Gabrb1 (UniProtKB:P15431) and rat Gabrb2 (UniProtKB:P63138)
  seed_accessions: [P15431, P63138]
  corrected: re-curate the 18 records against rat Gabbr1 (UniProtKB:Q9Z0U4, in place of Gabrb1) and rat Gabbr2 (UniProtKB:O88871, in place of Gabrb2), re-checking each compartment and extension
  suspect_annotations:
  - {gene: Gabrb1, go_id: GO:0048787, go_name: presynaptic active zone membrane, derived_rows: 4, derived_by: {Ensembl IEA GO_REF:0000107: 4}, derived_human: [GABRB1]}
  - {gene: Gabrb1, go_id: GO:0099634, go_name: postsynaptic specialization membrane, derived_rows: 4, derived_by: {Ensembl IEA GO_REF:0000107: 4}, note: "also the only experimental support behind rat Gabrb1's donation to the GO:0045211 postsynaptic membrane IBA (PTN008360792); that node has three other independent donors (gaba_receptor_swaps-iba.yaml)"}
  - {gene: Gabrb1, go_id: GO:0098982, go_name: GABA-ergic synapse, derived_rows: 4, derived_by: {UniProt IEA GO_REF:0000120: 4}, note: "SynGO has this term on rat Gabrb1 from another paper (PMID:16469775, a GABA-A beta1 IPSC study read in full and correctly attributed), so these derived rows do not rest on the swap alone"}
  - {gene: Gabrb2, go_id: GO:0099634, go_name: postsynaptic specialization membrane, derived_rows: 4, derived_by: {UniProt ISS GO_REF:0000024: 4}, note: "manual sequence-similarity transfers that need their own correction request; rat Gabrb2 also has this term from an independent IDA (PMID:9464994), so the transfers can stand once the swapped support is removed"}
  - {gene: Gabrb2, go_id: GO:0048787, go_name: presynaptic active zone membrane, derived_rows: 0}
  - {gene: Gabrb2, go_id: GO:0098978, go_name: glutamatergic synapse, derived_rows: 0}
  - {gene: Gabrb2, go_id: GO:0098982, go_name: GABA-ergic synapse, derived_rows: 0}
  supported_by:
  - reference_id: PMID:15174078
    supporting_text: Here, we use pre-embedding immunogold labeling to study the subcellular localization of GABA(B) receptor subunits, GABA(B1) and GABA(B2), in globus pallidus neurons
  - reference_id: PMID:15174078
    supporting_text: was found at perisynaptic sites of both pre- and postsynaptic specializations
- reference: PMID:15749345
  title: 'Synaptic and extrasynaptic GABA-A and GABA-B receptors in the globus pallidus: an electron microscopic immunogold analysis in monkeys.'
  verdict: NOT_A_SWAP
  explanation: >-
    Flagged only because the abstract names GABA-A receptors more often than
    GABA-B. The paper studies both, and SynGO annotated only the GABA-B
    subunit (macaque GABBR1) with locations the abstract reports for it.
  supported_by:
  - reference_id: PMID:15749345
    supporting_text: GABA-BR1 immunoreactivity is expressed presynaptically in putative glutamatergic terminals
