# Verdicts on the papers flagged by gaba_receptor_swaps.py (output:
# gaba_receptor_swaps.yaml, 2026-11-17). Hand-curated; quotes are verbatim from
# the cached PubMed records and checked by `just validate-quotes`.
#
# The two GABA receptor families share a letter. GABA-B receptor subunits are
# written GABA(B1) and GABA(B2) (genes GABBR1, GABBR2); GABA-A beta subunits
# are beta1-3 (genes GABRB1-3). A GABA-B finding recorded on a GABRB gene is a
# wrong gene product with cause SYMBOL_COLLISION. Each abstract below defines
# the entity it studies as a GABA-B receptor subunit, which the unread full
# text cannot change, so these are CONFIRMED from the abstract.
#
# derived_rows counts QuickGO rows on the same GO term whose WITH/FROM names the
# seed accession. Where SynGO has the same term on the same gene from another
# paper, the derived rows do not depend on the swap alone (noted per term).
checked: '2026-11-17'
papers:
- reference: PMID:11498050
  title: Epilepsy, hyperalgesia, impaired memory, and loss of pre- and postsynaptic GABA(B) responses in mice lacking GABA(B(1)).
  verdict: WRONG_GENE_PRODUCT
  confidence: CONFIRMED
  evidence_depth: ABSTRACT_ONLY
  explanation: >-
    A GABA(B1) knockout paper. SynGO annotated it to mouse Gabbr1, which is
    correct, and gave mouse Gabrb1 (the GABA-A beta1 subunit) the same three
    terms with the same evidence codes. One of them, G protein-coupled
    neurotransmitter receptor activity, is biologically impossible for a
    subunit of a ligand-gated chloride channel. Ensembl has projected each of
    the three Gabrb1 rows to 58 annotations in 57 species, including human
    GABRB1.
  asserted: mouse Gabrb1 (UniProtKB:P50571)
  corrected: mouse Gabbr1 (UniProtKB:Q9WV18), which SynGO already annotated from this paper; the Gabrb1 rows should be removed
  suspect_annotations:
  - {go_id: GO:0099528, go_name: G protein-coupled neurotransmitter receptor activity, codes: [EXP, IDA, IMP], derived_rows: 58, derived_taxa: 57, biologically_wrong: true}
  - {go_id: GO:0098685, go_name: Schaffer collateral - CA1 synapse, codes: [EXP, IDA, IMP], derived_rows: 58, derived_taxa: 57}
  - {go_id: GO:0098982, go_name: GABA-ergic synapse, codes: [EXP, IDA, IMP], derived_rows: 58, derived_taxa: 57}
  supported_by:
  - reference_id: PMID:11498050
    supporting_text: Here, we demonstrate that Balb/c mice lacking the GABA(B(1)) subunit are viable
  - reference_id: PMID:11498050
    supporting_text: This demonstrates that GABA(B(1)) is an essential component of pre- and postsynaptic GABA(B) receptors
- reference: PMID:15174078
  title: Subcellular localization of GABAB receptor subunits in rat globus pallidus.
  verdict: WRONG_GENE_PRODUCT
  confidence: CONFIRMED
  evidence_depth: ABSTRACT_ONLY
  explanation: >-
    An immunogold study of GABA(B1) and GABA(B2) in rat globus pallidus. SynGO
    recorded the localizations on rat Gabrb1 and Gabrb2 (GABA-A beta1 and
    beta2) and not on Gabbr1 or Gabbr2. The rat Gabrb1 presynaptic active zone
    membrane row is projected by Ensembl to 4 annotations, 2 of them on human
    GABRB1, and is the only presynaptic location on GABRB1's record. The
    corrected genes are an inference from the abstract's subunit names, not a
    reading of the full text.
  asserted: rat Gabrb1 (UniProtKB:P15431) and rat Gabrb2 (UniProtKB:P63138)
  corrected: rat Gabbr1 and Gabbr2 (candidates, from the subunit names in the abstract)
  suspect_annotations:
  - {gene: Gabrb1, go_id: GO:0048787, go_name: presynaptic active zone membrane, derived_rows: 4, derived_human: [GABRB1]}
  - {gene: Gabrb1, go_id: GO:0099634, go_name: postsynaptic specialization membrane, derived_rows: 4}
  - {gene: Gabrb1, go_id: GO:0098982, go_name: GABA-ergic synapse, derived_rows: 4, note: SynGO has this term on rat Gabrb1 from another paper (PMID:16469775), so these derived rows do not rest on the swap alone}
  - {gene: Gabrb2, go_id: GO:0099634, go_name: postsynaptic specialization membrane, derived_rows: 4}
  - {gene: Gabrb2, go_id: GO:0048787, go_name: presynaptic active zone membrane, derived_rows: 0}
  - {gene: Gabrb2, go_id: GO:0098978, go_name: glutamatergic synapse, derived_rows: 0}
  - {gene: Gabrb2, go_id: GO:0098982, go_name: GABA-ergic synapse, derived_rows: 0}
  supported_by:
  - reference_id: PMID:15174078
    supporting_text: Here, we use pre-embedding immunogold labeling to study the subcellular localization of GABA(B) receptor subunits, GABA(B1) and GABA(B2), in globus pallidus neurons
- reference: PMID:15749345
  title: 'Synaptic and extrasynaptic GABA-A and GABA-B receptors in the globus pallidus: an electron microscopic immunogold analysis in monkeys.'
  verdict: NOT_A_SWAP
  explanation: >-
    Flagged only because the abstract names GABA-A receptors more often than
    GABA-B. The paper studies both, and SynGO annotated only the GABA-B
    subunit (macaque GABBR1) with locations the abstract reports for it.
  supported_by:
  - reference_id: PMID:15749345
    supporting_text: GABA-BR1 immunoreactivity is expressed presynaptically in putative glutamatergic terminals
