  verdict: SUPPORTED
  evidence_depth: FULL_TEXT
  evidence_source: PMC article page (PMC6763057)
  confidence: CONFIRMED
  assay_system: rat hippocampal slices, immunogold
  notes: BK's own activity term is GO:0060072 large conductance calcium-activated potassium channel activity.
    Its is_a ancestry (OLS getAncestors on GO:0060072, 2026-11-16) runs GO:0060072 -> GO:0015269
    calcium-activated potassium channel activity -> GO:0005227 calcium-activated cation channel activity
    -> GO:0099094 ligand-gated monoatomic cation channel activity -> GO:0015276 ligand-gated monoatomic ion
    channel activity, so the ligand-gated genus of GO:0099507 fits.
  supported_by:
  - reference_id: PMID:11739569
    supporting_text: we demonstrate the existence of functional BK channels in presynaptic terminals in the hippocampus
