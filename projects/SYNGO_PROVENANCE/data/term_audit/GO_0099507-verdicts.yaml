# Per-paper verdicts for every SynGO annotation to GO:0099507
# (ligand-gated monoatomic ion channel activity involved in regulation of
# presynaptic membrane potential), as listed in GO_0099507-rows.yaml.
#
# Hand-curated. Each verdict rests on the publication (abstract, or full text
# where read) and on the reference-level view of how SynGO annotated the whole
# paper (data/reference_level/PMID_*.yaml). Quotes are verbatim and are checked
# by `just validate-quotes` against the cached publications. Nine papers were
# read from full text supplied by the project owner (evidence_source says
# which); their cached records are abstract-only, so the quotes for those stay
# abstract quotes and the full-text reading is not checkable from the repo.
#
# Verdict values:
#   SUPPORTED               the paper studies the annotated gene product at a
#                           presynaptic site and reports its channel function there
#   WRONG_GENE_PRODUCT      the paper assigns the presynaptic function to another subunit
#   NO_PRESYNAPTIC_CONTEXT  the paper studies the channel (usually in heterologous
#                           cells) but reports nothing presynaptic
#   POSTSYNAPTIC_CONTEXT    the paper studies the receptor at the postsynaptic side
#   WRONG_REFERENCE         the cited PMID is not the study (e.g. an erratum notice)
#
# evidence_depth is what the verdict was read from. An ABSTRACT_ONLY verdict of
# NO_PRESYNAPTIC_CONTEXT is PROBABLE, not CONFIRMED: the full text could hold a
# presynaptic experiment the abstract does not mention.
go_id: GO:0099507
checked: '2026-11-17'
papers:
- reference: PMID:10704491
  genes: [Gria2 (rat)]
  verdict: NO_PRESYNAPTIC_CONTEXT
  evidence_depth: FULL_TEXT
  evidence_source: cached full text
  confidence: CONFIRMED
  assay_system: Xenopus oocytes
  supported_by:
