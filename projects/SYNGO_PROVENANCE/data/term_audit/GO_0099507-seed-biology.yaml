# Biology check for the SynGO seeds of GO:0099507 (ligand-gated monoatomic ion
# channel activity involved in regulation of presynaptic membrane potential).
#
# GO_0099507-verdicts.yaml asks whether the paper SynGO cited supports the
# annotation. This file asks a separate question: is the claim true, from any
# source? A seed whose citation fails but whose biology holds is mis-sourced,
# not wrong. Only a seed whose biology is unsupported or contradicted is a bad
# seed, and its impact is the number of annotations derived from it
# (GO_0099507-downstream.yaml, from seed_downstream.py).
#
# Method (2026-11-17): one PubMed search per gene, the subunit's names AND a
# presynaptic term (presynaptic, axon/nerve terminal, autoreceptor,
# heteroreceptor) AND receptor/channel, top 40 by relevance, abstracts read;
# targeted follow-up searches for the GABA-A, glycine and 5-HT3 subunits, whose
# first searches were swamped by adrenergic alpha/beta receptors. Supporting
# papers were cached and are quoted verbatim. This is a screen, not a
# systematic review: NOT_FOUND means not found by this search.
#
# biology values:
#   SUPPORTED          independent functional evidence that receptors with this
#                      subunit act at presynaptic terminals (release modulation,
#                      terminal depolarization, or loss of a presynaptic effect
#                      in a knockout)
#   PARTIAL            the subunit is shown in afferent or presynaptic membranes,
#                      but the functional evidence is on another compartment
#   LOCALIZATION_ONLY  presynaptic immunolocalization of the subunit, with no
#                      functional evidence found
#   NOT_RESOLVED       evidence found only with reagents that do not separate
#                      this subunit from a paralog
#   NOT_FOUND          no independent evidence found by this search
# citation is the verdict from GO_0099507-verdicts.yaml.
