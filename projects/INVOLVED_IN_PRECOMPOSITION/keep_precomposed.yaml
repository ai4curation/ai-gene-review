# Combined "X involved in Y" terms judged KEEP_PRECOMPOSED: the term is the
# right grain and is not decomposed. Curated input to scripts/inventory.py,
# which flags rows and authored uses of these terms `kept` and leaves them out
# of module_candidates.yaml. A label containing "involved in" is not by itself
# a reason to decompose; each entry says why this one stays.
- id: GO:0106074
  label: aminoacyl-tRNA metabolism involved in translational fidelity
  triage_class: D-iii
  round: 5
  reason: >-
    The term is the aminoacyl-tRNA editing (proofreading) process, and GO has
    no other term for it. Its genus candidate, GO:0006399 tRNA metabolic
    process, covers all tRNA metabolism and would lose the editing meaning.
    The "translational fidelity" half adds nothing a decomposition could carry:
    the term already is_a GO:0006450 regulation of translational fidelity. GO
    itself attaches the editing activity to this process (GO:0002161
    aminoacyl-tRNA deacylase activity part_of GO:0106074), and every review
    that uses the term in core_functions pairs it with that activity or one of
    its children. Upstream: rename to the process it names and add a logical
    definition (upstream-tickets.md, ticket 6).
- id: GO:0006271
  label: DNA strand elongation involved in DNA replication
  triage_class: B
  round: 5
  reason: >-
    The term names the elongation stage of DNA replication (EXACT synonym
    "DNA replication elongation"; Reactome R-HSA-69190 "DNA strand
    elongation"), as GO:0006414 translational elongation names a stage of
    translation. Its own subclasses, GO:0006272 leading strand elongation and
    GO:0006273 lagging strand elongation, are stages of replication too, so
    decomposing the parent to GO:0022616 DNA strand elongation would leave
    them under a retired class. The genus also covers strand extension outside
    replication, so the polymerase, clamp, clamp loader and helicase subunits
    that carry the term would lose which process they serve. Upstream: rename
    to the EXACT synonym (upstream-tickets.md, ticket 6).
- id: GO:0050910
  label: detection of mechanical stimulus involved in sensory perception of sound
  triage_class: B
  round: 6
  reason: >-
    The term names the transduction stage of hearing (EXACT synonyms "detection
    of sound", "sensory transduction of sound"). It is one of a family of
    per-sense detection terms under GO:0050974 (sound, touch, pain,
    equilibrioception). The bare genus, GO:0050982 detection of mechanical
    stimulus, also covers non-perceptual detection such as baroreceptor
    detection of arterial stretch, detection of renal blood flow and detection of
    muscle stretch, so it would lose which sense the hair-cell machinery serves.
    The hair-cell mechanotransduction apparatus serves hearing and balance alike;
    GO expresses that with the sibling GO:0050973, and the
    hair_cell_mechanotransduction module already uses both (TMC2's annoton
    carries the two siblings). A context-free statement of the shared apparatus
    is their parent GO:0050974, which the zebrafish tmc2a/tmc2b reviews use.
- id: GO:0050973
  label: detection of mechanical stimulus involved in equilibrioception
  triage_class: B
  round: 6
  reason: >-
    The vestibular sibling of GO:0050910, kept for the same reason: it names the
    transduction stage of equilibrioception, and the bare genus GO:0050982 would
    lose which sense is served. The hair_cell_mechanotransduction module uses it
    for TMC2 and the MYO1C adaptation motor in vestibular hair cells.
- id: GO:0050974
  label: detection of mechanical stimulus involved in sensory perception
  triage_class: B
  round: 6
  reason: >-
    The common parent of the per-sense mechanical detection terms (hearing, touch,
    pain, equilibrioception). It is the right term where one apparatus serves
    several senses, as the zebrafish lhfpl5a/lhfpl5b, tmc2a/tmc2b and tomt reviews
    use it for hair cells across the sensory patches of the ear (hearing and
    balance). Without "involved in
    sensory perception" the genus GO:0050982 would include interoceptive
    detection (baroreceptor, renal blood flow, muscle stretch).
