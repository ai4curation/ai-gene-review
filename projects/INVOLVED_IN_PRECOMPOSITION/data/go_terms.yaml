    endopeptidases in other cellular process (e.g., cell cycle arrest) that do not necessarily develop
    into an apoptotic process, please use the more general parent term GO:0097202. Examples of 'activation
    of cysteine-type endopeptidase activity involved in apoptotic process' are cytochrome c and Apaf1.
    When cytochrome c is released from mitochondria and forms a complex with Apaf1, they form a scaffolding
    platform in which the pro-caspase 9 is bound (the 'apoptosome'). The caspase is then cleaved and activated.
