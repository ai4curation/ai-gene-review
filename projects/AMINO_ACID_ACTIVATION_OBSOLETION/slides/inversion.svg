<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="240" y="40" text-anchor="middle" font-size="17" font-weight="600" fill="#15201e">What PSEPK serS says today</text>
  <text x="720" y="40" text-anchor="middle" font-size="17" font-weight="600" fill="#15201e">What GO says after the merge</text>
  <line x1="480" y1="60" x2="480" y2="470" stroke="#8fa39c" stroke-dasharray="4 5"/>
  <!-- left -->
  <rect x="60" y="80" width="360" height="72" rx="10" fill="#f2edf8" stroke="#7657a3" stroke-width="1.6"/>
  <text x="78" y="106" font-size="14" font-weight="600" fill="#7657a3">MARK_AS_OVER_ANNOTATED</text>
  <text x="78" y="128" font-size="14" fill="#15201e">GO:0006418 tRNA aminoacylation</text>
  <text x="78" y="144" font-size="12" fill="#56655f">for protein translation (IEA)</text>
  <path d="M240 154 L240 204" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="184" font-size="12" fill="#56655f">"GO:0006434 already captures"</text>
  <rect x="60" y="208" width="360" height="72" rx="10" fill="#e9f5ee" stroke="#1d8a4b" stroke-width="1.6"/>
  <text x="78" y="234" font-size="14" font-weight="600" fill="#1d8a4b">ACCEPT + core_functions</text>
  <text x="78" y="256" font-size="14" fill="#15201e">GO:0006434 seryl-tRNA aminoacylation</text>
  <text x="78" y="272" font-size="12" fill="#56655f">substrate identity recorded in the BP</text>
  <rect x="60" y="316" width="360" height="60" rx="10" fill="#eaf1fa" stroke="#1d68b3"/>
  <text x="78" y="342" font-size="14" fill="#15201e">MF: GO:0004828 serine-tRNA ligase</text>
  <text x="78" y="362" font-size="12" fill="#56655f">substrate identity recorded again</text>
  <!-- right -->
  <rect x="540" y="80" width="360" height="72" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="558" y="106" font-size="14" font-weight="600" fill="#0e6b66">the correct BP</text>
  <text x="558" y="128" font-size="14" fill="#15201e">GO:0006418 tRNA aminoacylation</text>
  <text x="558" y="144" font-size="12" fill="#56655f">for protein translation</text>
  <rect x="540" y="208" width="360" height="72" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="558" y="234" font-size="14" font-weight="600" fill="#bd3a30">OBSOLETE → replaced by GO:0006418</text>
  <text x="558" y="256" font-size="14" fill="#15201e">GO:0006434 seryl-tRNA aminoacylation</text>
  <text x="558" y="272" font-size="12" fill="#56655f">core_functions id fails strict validation</text>
  <rect x="540" y="316" width="360" height="60" rx="10" fill="#eaf1fa" stroke="#1d68b3" stroke-width="1.8"/>
  <text x="558" y="342" font-size="14" fill="#15201e">MF: GO:0004828 serine-tRNA ligase</text>
  <text x="558" y="362" font-size="12" fill="#1d68b3">the one place substrate identity lives</text>
  <!-- bottom -->
  <rect x="60" y="410" width="840" height="64" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="480" y="436" text-anchor="middle" font-size="14" fill="#15201e">Same pattern in 16 reviews: 15 PSEPK synthetases mark GO:0006418 over-annotated; human AARS1 modifies it to GO:0006419.</text>
  <text x="480" y="458" text-anchor="middle" font-size="13" fill="#56655f">Fix: re-argue, not re-point. Keep specificity on the MF and let the BP sit at GO:0006418.</text>
</svg>
