# Genes for the trusted-cutoff check (run_cutoff_check.py).
# Selection: P. putida KT2440 reviews carrying at least one REMOVE on an electronic
# enzyme-activity row where the reviewer's reason is a paralog or wrong-reaction call
# (the Schnoes et al. 2009 overprediction pattern), picked by reading the REMOVE list.
# The ACCEPT/MODIFY rows on the same genes act as within-gene controls. Two human
# genes from this project are added to show coverage outside bacteria.
# The set is therefore enriched for REMOVE rows and is not a random sample.
genes:
  - review: "genes/PSEPK/prpB/prpB-ai-review.yaml"
  - review: "genes/PSEPK/kdsC/kdsC-ai-review.yaml"
  - review: "genes/PSEPK/phnX/phnX-ai-review.yaml"
  - review: "genes/PSEPK/metXS/metXS-ai-review.yaml"
  - review: "genes/PSEPK/nspC/nspC-ai-review.yaml"
  - review: "genes/PSEPK/PP_3599/PP_3599-ai-review.yaml"
  - review: "genes/PSEPK/pyrC'/pyrC'-ai-review.yaml"
  - review: "genes/PSEPK/mqo2/mqo2-ai-review.yaml"
  - review: "genes/PSEPK/mqo3/mqo3-ai-review.yaml"
  - review: "genes/PSEPK/kguE/kguE-ai-review.yaml"
  - review: "genes/PSEPK/puuD/puuD-ai-review.yaml"
  - review: "genes/PSEPK/mdh/mdh-ai-review.yaml"
  - review: "genes/PSEPK/PP_2325/PP_2325-ai-review.yaml"
  - review: "genes/PSEPK/PP_4452/PP_4452-ai-review.yaml"
  - review: "genes/PSEPK/ptxD/ptxD-ai-review.yaml"
  - review: "genes/PSEPK/serA/serA-ai-review.yaml"
  - review: "genes/PSEPK/PP_0556/PP_0556-ai-review.yaml"
  - review: "genes/PSEPK/PP_4638/PP_4638-ai-review.yaml"
  - review: "genes/PSEPK/hisI/hisI-ai-review.yaml"
  - review: "genes/PSEPK/purM/purM-ai-review.yaml"
  - review: genes/human/PHYKPL/PHYKPL-ai-review.yaml
  - review: genes/human/HADH/HADH-ai-review.yaml
