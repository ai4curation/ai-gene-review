# Triage of the class-term leads: GO terms that carry only a partial EC (class terms such
# as hydrolase activity, EC 3.-.-.-) whose EC class neither contains nor lies inside the
# model's EC and which are not GO ancestors of a term for the model's EC, plus the
# narrower class terms. Judged, like the pairs above, from product names and GO
# definitions. A class term often rides on the protein family's fold (a glycoside
# hydrolase family member that transglycosylates, an amidohydrolase-fold member that
# hydrolyses phosphoanhydrides); those are WRONG_REACTION. EC renumbering (transporters
# and decarboxylases moved to EC 7, DAHP synthase from 4.1.2 to 2.5.1) is ACCEPTABLE.
class_term_triage:
  # --- the class names a different kind of reaction ------------------------------------
  - models: [NF003811.1, NF008631.0, NF008366.0]
    go: GO:0004553
    verdict: WRONG_REACTION
    note: >-
      Glycoside hydrolase families (GH13, GH23 and relatives) include non-hydrolytic members.
      The branching enzyme GlgB transfers glucan chains (EC 2.4.1.18) and lytic murein
      transglycosylases cleave by intramolecular transglycosylation (EC 4.2.2.-); neither
      hydrolyses the O-glycosyl bond. The term follows the family, not the reaction.
  - models: [TIGR02476.1]
    go: GO:0016722
    verdict: WRONG_REACTION
    note: BluB cleaves FMNH2 to form 5,6-dimethylbenzimidazole (EC 1.13.11.79); it does not act on metal ions.
  - models: [TIGR02070.1]
    go: GO:0016763
    verdict: WRONG_REACTION
    note: >-
      MtgA polymerises lipid II glycan strands, a hexosyl (GlcNAc-MurNAc) transfer; a
      pentosyltransferase term names a different sugar.
  - models: [NF011984.0, NF011981.0]
    go: GO:0016810
    verdict: WRONG_REACTION
    note: PhnM hydrolyses a phosphoanhydride (EC 3.6.1.63); the C-N hydrolase class follows its amidohydrolase fold.
  - models: [NF006828.0]
    go: GO:0004812
    verdict: WRONG_REACTION
    note: EpmA is a lysyl-tRNA synthetase paralog that ligates (R)-beta-lysine to elongation factor P, not to tRNA.
  - models: [TIGR03590.1]
    go: GO:0016758
    verdict: WRONG_REACTION
    note: PseG hydrolyses a UDP-sugar (EC 3.6.1.57); the hexosyltransferase class follows its GT-B fold.
  - models: [NF008978.0, NF008977.0]
    go: GO:0016765
    verdict: WRONG_REACTION
    note: >-
      Decaprenyl-phosphate phosphoribosyltransferase transfers a phosphoribosyl group
      (EC 2.4.2.45); the alkyl/aryl-transferase class follows the UbiA prenyltransferase fold.
  - models: [NF003000.0]
    go: GO:0008484
    verdict: WRONG_REACTION
    note: OpgB transfers glycerophosphate from phosphatidylglycerol (EC 2.7.8.20); the sulfatase class follows its alkaline-phosphatase/sulfatase fold.
