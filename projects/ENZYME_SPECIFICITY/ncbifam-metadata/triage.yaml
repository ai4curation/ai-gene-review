# Curator triage of every `unrelated`, `narrower` and `no_go_for_model_ec` pair in
# release_table_check.yaml, plus four models from the cutoff-check sweep the EC comparison
# cannot catch (three with no EC number, one with a partial EC).
# Those four entries are marked `source: sweep`; render_feedback.py rejects any other
# triaged (model, term) pair that is not a flagged pair in release_table_check.yaml.
#
# Verdicts are judged from the model's product name and EC number against the GO term's
# name and definition. They are not checked against literature, so each is a candidate
# for NCBIfam curators, not a confirmed error.
#
#   WRONG_REACTION  the term names a different enzyme's reaction
#   WRONG_COFACTOR  same transformation, different cofactor, donor or acceptor
#   EC_SUSPECT      the GO term fits the product name; the model's EC number does not
#   ACCEPTABLE      dual-substrate name, bifunctional model, partial or secondary activity,
#                   or an EC reclassification; no change suggested
#   CHECK           unclear from names alone
#
# `better` names the GO term that fits the product name, only where GO has one whose
# label was checked in the GO database used by `just validate`.
