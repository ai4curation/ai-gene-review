<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker></defs>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#15201e">One spiral, four steps, chain-length-specific isozymes at each</text>
  <!-- step headers -->
  <g font-size="15" font-weight="bold" fill="#ffffff">
    <rect x="30" y="54" width="210" height="44" rx="8" fill="#0e6b66"/><text x="135" y="82" text-anchor="middle">① acyl-CoA DH</text>
    <rect x="260" y="54" width="210" height="44" rx="8" fill="#0e6b66"/><text x="365" y="82" text-anchor="middle">② enoyl-CoA hydratase</text>
    <rect x="490" y="54" width="210" height="44" rx="8" fill="#0e6b66"/><text x="595" y="82" text-anchor="middle">③ 3-OH-acyl-CoA DH</text>
    <rect x="720" y="54" width="210" height="44" rx="8" fill="#0e6b66"/><text x="825" y="82" text-anchor="middle">④ 3-ketoacyl thiolase</text>
  </g>
  <g stroke="#56655f" stroke-width="2" marker-end="url(#a)"><line x1="240" y1="76" x2="258" y2="76"/><line x1="470" y1="76" x2="488" y2="76"/><line x1="700" y1="76" x2="718" y2="76"/></g>
  <!-- MTP band -->
  <rect x="260" y="130" width="670" height="110" rx="10" fill="#f1ecf8" stroke="#7657a3" stroke-dasharray="6 4"/>
  <text x="920" y="148" text-anchor="end" font-size="12" fill="#7657a3" font-weight="bold">MTP: HADHA (α) + HADHB (β)</text>
  <g font-size="13" fill="#15201e">
    <!-- step1 -->
    <rect x="40" y="112" width="190" height="42" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="130" text-anchor="middle" font-weight="bold">ACADVL</text><text x="135" y="146" text-anchor="middle">GO:0017099 VLC-specific</text>
    <rect x="40" y="176" width="190" height="42" rx="6" fill="#e6f4ea" stroke="#1d8a4b" stroke-width="2"/><text x="135" y="194" text-anchor="middle" font-weight="bold">ACAD9</text><text x="135" y="210" text-anchor="middle">GO:0004466 LC + CI</text>
    <rect x="40" y="244" width="190" height="42" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="262" text-anchor="middle" font-weight="bold">ACADM</text><text x="135" y="278" text-anchor="middle">GO:0070991 MC-specific</text>
    <rect x="40" y="334" width="190" height="42" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="352" text-anchor="middle" font-weight="bold">ACADS</text><text x="135" y="368" text-anchor="middle">GO:0016937 SC-specific</text>
    <!-- step2 -->
    <rect x="270" y="160" width="190" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="365" y="180" text-anchor="middle" font-weight="bold">HADHA</text><text x="365" y="198" text-anchor="middle">GO:0004300 (general)</text>
    <rect x="270" y="290" width="190" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="365" y="310" text-anchor="middle" font-weight="bold">ECHS1</text><text x="365" y="328" text-anchor="middle">GO:0004300 (general)</text>
    <!-- step3 -->
    <rect x="500" y="160" width="190" height="46" rx="6" fill="#e6f4ea" stroke="#1d8a4b" stroke-width="2"/><text x="595" y="180" text-anchor="middle" font-weight="bold">HADHA</text><text x="595" y="198" text-anchor="middle">GO:0016509 LC-specific</text>
    <rect x="500" y="290" width="190" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="595" y="310" text-anchor="middle" font-weight="bold">HADH</text><text x="595" y="328" text-anchor="middle">GO:0003857 (general)</text>
    <!-- step4 -->
    <rect x="730" y="160" width="190" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="825" y="180" text-anchor="middle" font-weight="bold">HADHB</text><text x="825" y="198" text-anchor="middle">GO:0003988 (general)</text>
    <rect x="730" y="290" width="190" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="825" y="310" text-anchor="middle" font-weight="bold">ACAA2</text><text x="825" y="328" text-anchor="middle">GO:0003988 (general)</text>
  </g>
  <!-- errors -->
  <g font-size="12.5">
    <rect x="30" y="404" width="215" height="100" rx="8" fill="#fff6d7"/>
    <text x="42" y="424" font-weight="bold" fill="#9a6a00">ACADVL: UNDECIDED</text><text x="42" y="444" fill="#15201e">mouse VLCAD/P50544-derived</text><text x="42" y="462" fill="#15201e">regulation rows need</text><text x="42" y="480" fill="#15201e">full-text resolution</text>
    <rect x="260" y="404" width="215" height="100" rx="8" fill="#fdf1e4"/>
    <text x="272" y="424" font-weight="bold" fill="#b8620f">HADHA: MODIFY</text><text x="272" y="444" fill="#15201e">generic GO:0003857 → LC</text><text x="272" y="462" fill="#15201e">GO:0016509. And REMOVE thiolase</text><text x="272" y="480" fill="#15201e">GO:0003985 (that is HADHB's)</text>
    <rect x="490" y="404" width="215" height="100" rx="8" fill="#f1ecf8"/>
    <text x="502" y="424" font-weight="bold" fill="#7657a3">HADH: OVER-ANNOTATED</text><text x="502" y="444" fill="#15201e">long-chain GO:0016509 on</text><text x="502" y="462" fill="#15201e">the short/medium-chain</text><text x="502" y="480" fill="#15201e">enzyme</text>
    <rect x="720" y="404" width="210" height="100" rx="8" fill="#fbeeec"/>
    <text x="732" y="424" font-weight="bold" fill="#bd3a30">ACAT1: REMOVE</text><text x="732" y="444" fill="#15201e">cholesterol O-acyltransferase</text><text x="732" y="462" fill="#15201e">from a SOAT1 paper ("ACAT1"</text><text x="732" y="480" fill="#15201e">nickname); T2 is acetoacetyl-CoA</text>
  </g>
</svg>
