<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#15201e">Right enzyme class, wrong specificity: four exemplars</text>
  <g font-size="14">
    <!-- header -->
    <text x="40" y="76" font-weight="bold" fill="#56655f">error type</text><text x="250" y="76" font-weight="bold" fill="#56655f">GOA said</text><text x="560" y="76" font-weight="bold" fill="#56655f">the enzyme actually</text><text x="830" y="76" font-weight="bold" fill="#56655f">action</text>
    <line x1="30" y1="88" x2="930" y2="88" stroke="#8fa39c"/>
    <!-- LPL1 -->
    <text x="40" y="124" font-weight="bold" fill="#15201e">substrate too narrow</text><text x="40" y="144" fill="#56655f">LPL1 · C. albicans</text>
    <rect x="240" y="104" width="280" height="50" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="380" y="126" text-anchor="middle" fill="#15201e">GO:0004622 PC lysophospholipase</text><text x="380" y="144" text-anchor="middle" fill="#15201e">A1 activity (IBA)</text>
    <rect x="550" y="104" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#1d8a4b"/><text x="675" y="126" text-anchor="middle" fill="#15201e">phospholipase B: hydrolase,</text><text x="675" y="144" text-anchor="middle" fill="#15201e">lysophospholipase, transacylase</text>
    <rect x="818" y="114" width="100" height="30" rx="6" fill="#b8620f"/><text x="868" y="134" text-anchor="middle" font-weight="bold" fill="#ffffff">MODIFY</text>
    <!-- PHYKPL -->
    <text x="40" y="214" font-weight="bold" fill="#15201e">wrong reaction</text><text x="40" y="234" fill="#56655f">PHYKPL · human</text>
    <rect x="240" y="194" width="280" height="50" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="380" y="216" text-anchor="middle" fill="#15201e">GO:0008483 transaminase activity</text><text x="380" y="234" text-anchor="middle" fill="#15201e">(IEA; aminotransferase III family)</text>
    <rect x="550" y="194" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#1d8a4b"/><text x="675" y="216" text-anchor="middle" fill="#15201e">phospho-lyase, EC 4.2.3.134</text><text x="675" y="234" text-anchor="middle" fill="#15201e">NEW GO:0016838</text>
    <rect x="818" y="204" width="100" height="30" rx="6" fill="#bd3a30"/><text x="868" y="224" text-anchor="middle" font-weight="bold" fill="#ffffff">REMOVE</text>
    <!-- eryCIII -->
    <text x="40" y="304" font-weight="bold" fill="#15201e">wrong sugar donor</text><text x="40" y="324" fill="#56655f">EryCIII · S. erythraea</text>
    <rect x="240" y="284" width="280" height="50" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="380" y="306" text-anchor="middle" fill="#15201e">GO:0008194 UDP-glycosyl-</text><text x="380" y="324" text-anchor="middle" fill="#15201e">transferase activity (IEA)</text>
    <rect x="550" y="284" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#1d8a4b"/><text x="675" y="306" text-anchor="middle" fill="#15201e">transfers TDP-D-desosamine;</text><text x="675" y="324" text-anchor="middle" fill="#15201e">GO:0016758 already present</text>
    <rect x="818" y="294" width="100" height="30" rx="6" fill="#bd3a30"/><text x="868" y="314" text-anchor="middle" font-weight="bold" fill="#ffffff">REMOVE</text>
    <!-- GND1 -->
    <text x="40" y="394" font-weight="bold" fill="#15201e">cofactor (control)</text><text x="40" y="414" fill="#56655f">GND1 · C. albicans</text>
    <rect x="240" y="374" width="280" height="50" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="380" y="396" text-anchor="middle" fill="#15201e">GO:0004616 6PGDH, NADP+-</text><text x="380" y="414" text-anchor="middle" fill="#15201e">specific by definition</text>
    <rect x="550" y="374" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#1d8a4b"/><text x="675" y="396" text-anchor="middle" fill="#15201e">GxAxMG + NRT motifs present,</text><text x="675" y="414" text-anchor="middle" fill="#15201e">NAD-type DRD absent</text>
    <rect x="818" y="384" width="100" height="30" rx="6" fill="#1d8a4b"/><text x="868" y="404" text-anchor="middle" font-weight="bold" fill="#ffffff">ACCEPT</text>
    <text x="40" y="470" font-size="13" fill="#56655f">GND1 also: keyword-derived GO:0019521 D-gluconate metabolic process marked over-annotated (the substrate is 6-phospho-D-gluconate).</text>
    <text x="40" y="492" font-size="13" fill="#56655f">Actions read from each gene's *-ai-review.yaml.</text>
  </g>
</svg>
