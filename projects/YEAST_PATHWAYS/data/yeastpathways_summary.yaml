  - *id019
  comment: 'Serine is a proteinogenic amino acid and a precursor to the amino acids tryptophan, glycine,
    and cysteine. Serine is also the primary source of one-carbon units in folate-mediated one-carbon
    metabolism, a network of carbon transfer reactions required for the biosynthesis of methionine, thymidylate,
    and purines. S. cerevisiae possesses three major pathways for serine biosynthesis: a phosphoglycerate
    pathway that synthesizes serine from 3-phosphoglycerate, a threonine pathway that synthesizes serine
    from threonine-derived glycine, and a glyoxylate pathway that synthesizes serine from glyoxylate-derived
    glycine. The former two pathways operate when glucose is the carbon source while the latter pathway
    operates during growth on non-fermentable substrates. In the glyoxylate pathway, glyoxylate is converted
    to glycine via alanine:glyoxylate aminotransferase (Agx1p). Glycine is then converted to serine via
    serine hydroxymethyltransferase (Shm1p/Shm2p). The reaction catalyzed by serine hydroxymethyltransferase
    is reversible; however the cytoplasmic isoform (SHM2) is thought to contribute more to serine catabolism
    while the mitochondrial isoform (SHM1) contributes to serine synthesis. The roles of SHM1 and SHM2
    are reported to change in accordance to the nutritional requirements of the cell, particularly to
    the availability of serine or glycine. Despite the proposed preference of Shm2p for glycine synthesis,
    expression of SHM2 but not SHM1 is increased in the presence of glycine. References: |CITS:[(JONES)]||CITS:
    [12525494]||CITS: [14745783]||CITS: [9398220]||CITS: [15948949]|'
  name: serine biosynthesis from glyoxylate
