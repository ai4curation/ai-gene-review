  comment: 'Cytidine diphosphate diacylglycerol (CDP-DAG) is a liponucleotide and the precursor to all
    major phospholipids in S. cerevisiae. It is synthesized in a reaction catalyzed by CDP-DAG synthase,
    which converts phosphatidic acid (PA) to CDP-DAG using cytidine triphosphate (CTP) as the CDP donor.
    There are two distinct CDP-DAG synthases in S. cerevisiae: Cds1p, localized in the endoplasmic reticulum
    (ER), and Tam41p, localized in the mitochondrial matrix. Both localizations represent the site of
    action for the CDP-DAG pathway of phospholipid biosynthesis in yeast. At the ER site, CDP-DAG generated
    by Cds1p can be converted to phosphatidylinositol (PI) or phosphatidylserine (PS) via PI synthase
    (Pis1p) and PS synthase (Cho1p), respectively. At the mitochondrial site, CDP-DAG generated by Tam41p
    can be sequentially converted to phosphatidylglycerol (PG) and further converted to cardiolipin. Synthesis
    of PI, PG, and cardiolipin occurs through similar mechanisms in mammalian cells; however, unlike yeast,
    mammals primarily synthesize PS from other phospholipids and not from CDP-DAG. References: |CITS:[24866973]||CITS:
    [23623749]||CITS: [16943180]||CITS: [21382416]|'
  name: CDP-diacylglycerol biosynthesis
