  comment: 'The thioredoxin and glutathione/glutaredoxin systems help maintain the reduced environment
    of the cell and play a significant role in defending the cell against oxidative stress. They also
    have been proposed to play a role in the biosynthesis of purines and pyrimidines as required for DNA
    synthesis, protein folding and regulation, and sulfur metabolism |CITS:[11169096],[2668278]|. Thioredoxins
    and glutaredoxins are small heat-stable proteins with redox-active cysteines that facilitate the reduction
    of other proteins by catalyzing cysteine thiol-disulfide exchange reactions |CITS:[2668278]|. Thioredoxins
    contain two conserved cysteines that exist in either a reduced form as in thioredoxin-(SH)2 or in
    an oxidized form as in thioredoxin-S2 when they form an intramolecular disulfide bridge |CITS:[2668278]|.
    Thioredoxins donate electrons from their active center dithiol to protein disulfide bonds (Protein-S2)
    that are then reduced to dithiols (Protein-(SH)2). The resulting oxidized thioredoxin disulfide is
    reduced directly by thioredoxin reductase with electrons donated by NADPH |CITS:[2668278]|. Hence
    the thioredoxin reduction system consists of thioredoxin, thioredoxin reductase, and NADPH. Oxidized
    glutaredoxins, on the other hand, are reduced by the tripeptide glutathione (gamma-Glu-Cys-Gly, known
    as GSH) using electrons donated by NADPH |CITS:[2668278]|. Hence the glutathione/glutaredoxin system
    consists of glutaredoxin, glutathione, glutathione reductase and NADPH. S. cerevisiae contains a cytoplasmic
    thioredoxin system comprised of the thioredoxins Trx1p and Trx2p and the thioredoxin reductase Trr1p,
    and a complete mitochondrial thioredoxin system comprised of the thioredoxin Trx3p and the thioredoxin
    reductase Trr2p |CITS:[15701801]|. Evidence suggests that the cytoplasmic thioredoxin system may have
    overlapping function with the glutathione/glutaredoxin system |CITS:[8930901], [10844700]|. The mitochondrial
    thioredoxin system, on the other hand, does not appear to be able to substitute for either the cytoplasmic
    thioredoxin or glutathione/glutaredoxin systems |CITS:[10844700]|. Instead, the mitochondrial thioredoxn
    proteins, thioredoxin (Trx3p) and thioredoxin reductase (Trr2p) have been implicated in the defense
    against oxidative stress generated during respiratory metabolism |CITS:[10037727]|. The two cytoplasmic
    thioredoxins (Trx1p and Trx2p) are believed to supply reducing equivalents to the enzymes ribonucleotide
    reductase (Rnr1p, Rnr2p, Rnr3p, Rnr4p) and 3''-phosphoadenosine 5''-phosphosulfate (PAPS) reductase
    (Met16p) |CITS:[4392601],[5442277]|. Deletion of either TRX1 or TRX2 has no effect on cell growth
    or morphology |CITS:[2026619]|, but, deletion of both genes affects the cell cycle, and makes the
    cells auxotrophic for methionine/cysteine |CITS:[2026619],[7929110]|. Deletion of the single gene
    TRX2 does result in extreme sensitivity to H2O2 and is thereby believed to be involved in the response
    against H2O2 |CITS:[8313910]|. The expression of TRX2 and TRR1 are regulated by the transcription
    factors Yap1p and Skn7p in response to H2O2 |CITS:[8313910],[9118942]|. '
