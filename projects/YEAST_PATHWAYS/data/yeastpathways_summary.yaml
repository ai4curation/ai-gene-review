  comment: 'In S. cerevisiae, mitochondrial acetyl-CoA reserves are biochemically isolated and cannot
    be transported to the cytosol to support processes such as protein acetylation and fatty acid biosynthesis.
    Instead, S. cerevisiae obtains cytosolic acetyl-CoA through the activation of acetate. Acetate activation
    to acetyl-CoA occurs via the enzyme acetyl-CoA synthetase, which catalyzes the ATP-dependent ligation
    of acetate and coenzyme A to form acetyl-CoA. Two genes encode for acetyl-CoA synthetase in S. cerevisiae:
    ACS1 and ACS2. ACS1 is a glucose-repressed gene required for growth on acetate during glucose starvation,
    while ACS2 is a constitutively expressed gene essential for cell viability in glucose medium. ACS1
    is repressed by Ume6p and is activated by Adr1p and Cat8p in the absence of glucose. Double mutants
    of acs1 and acs2 are inviable, suggesting that acetate activation by acetyl-CoA synthetase is an essential
    source of acetyl-CoA in S. cerevisiae. Likewise, acs2 mutants are inviable when grown on glucose medium
    due to repression of ACS1. References: |CITS: [25326522]||CITS: [16857587]||CITS: [8910545]||CITS:
    [22876324]||CITS: [7649171]||CITS: [15743812]||CITS: [9427394]|'
  name: acetate utilization
  pmids:
