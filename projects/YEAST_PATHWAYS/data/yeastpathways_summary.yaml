  comment: 'The biosynthesis of threonine and methionine in S. cerevisiae begins in a common three-step
    pathway that converts aspartate to homoserine. HOM3 and HOM2, which encode the enzymes responsible
    for the first and second steps of this pathway respectively, are regulated by Gcn4p under the general
    control of amino acid biosynthesis. Additionally, threonine represses HOM3 and competitively inhibits
    homoserine dehydrogenase (encoded by HOM6), lending that the flow of carbon into the common pathway
    is primarily regulated by threonine. The Hom3p, Hom2p, and Hom6p-catalyzed reactions yield homoserine,
    at which point the threonine and methionine pathways diverge. Phosphorylation of homoserine by homoserine
    kinase (encoded by THR1) directs homoserine towards the biosynthesis of threonine, whereas acetylation
    by homoserine O-transacetylase (encoded by MET2) commits homoserine to the biosynthesis of sulfur
    amino acids. If homoserine is phosphorylated by homoserine kinase (Thr1p), threonine synthase (Thr4p)
    can subsequently catalyze its conversion to threonine. THR1 and THR4 are both transcriptionally regulated
    by general control of amino acid biosynthesis. Like Hom3p and Hom6p, homoserine kinase is also subject
    to feedback inhibition by threonine. If homoserine is acetylated by homoserine O-transacetylase (Met2p),
    it can enter one of two routes to be converted to homocysteine, the immediate precursor to methionine.
    In the first route, homocysteine is synthesized from the direct incorporation of sufide into O-acetylhomoserine
    via Met17p. In the second route, O-acetylhomoserine is condensed with cysteine via the transsulfuration
    pathway and subsequently cleaved, yielding homocysteine and pyruvate. Homocysteine can then accept
    a methyl group from a 1C unit-carrying derivative of tetrahydrofolate via Met6p to form methionine.
    When yeast cells are grown in methionine, synthesis of enzymes required for sulfate assimilation (which
    provides sulfide for homocysteine production) as well as methionine biosynthesis is repressed. Activation
    of most genes involved in the sulfur metabolic network (MET genes) requires the transcriptional activator
    Met4p. The activity of Met4p is regulated in response to the sulfur status of the cell, with cysteine
    levels serving as the major regulatory signal. References: |CITS:[(JONES)]||CITS: [(HINNEBUSCH)]||CITS:
    [22419079]||CITS: [9409150]||CITS: [5764336]|'
  name: superpathway of threonine and methionine biosynthesis
