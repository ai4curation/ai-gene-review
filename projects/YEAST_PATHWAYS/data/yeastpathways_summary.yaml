  comment: 'Tetrapyrroles are a group of molecules that contain of four pyrrole rings linked together
    by single-atom bridges in a cyclic or linear arrangement. Biologically important cyclic tetrapyrroles,
    such as chlorophyll, cobalamin, heme, and siroheme, coordinate a metal ion in their central cavity
    and function as cofactors in numerous biological processes. The iron-containing tetrapyrroles siroheme
    and heme function in sulfur assimilation and oxygen sensing/utilization respectively. Both are synthesized
    de novo via the intermediary formation of uroporphyrinogen-III in the budding yeast S. cerevisiae.
    Like in mammals and photosynthetic bacteria, de novo synthesis of tetrapyrroles in S. cerevisiae begins
    with the condensation of glycine and succinyl-CoA to 5-aminolevulinic acid (ALA). In many plants and
    prokaryotes however, ALA is instead synthesized from the 5-carbon chain of glutamate. After two ALA
    molecules are produced, they can be condensed by ALA dehydratase (Hem2p in yeast) to form porphobilinogen
    (PBG), the building block of tetrapyrroles. Condensation of four molecules of PBG by PBG deaminase
    (Hem3p) results in a linear tetrapyrrole that can be rearranged and cyclized by uroporphyrinogen-III
    synthase (Hem4p) to yield uroporphyrinogen-III, the major branch point intermediate between heme and
    siroheme biosynthesis in yeast. The fate of uroporphyrinogen-III is determined by its subsequent modification:
    decarboxylation of uroporphyrinogen-III commits it to the heme biosynthesis pathway, whereas methylation
    commits it to the biosynthesis of siroheme. References: |CITS:[2077690]||CITS: [10051442]||CITS: [11212295]|'
