  comment: 'Ubiquinone (Coenzyme Q; CoQ) is a lipophilic, redox-active molecule present in cell membranes.
    For its ability to sustain continuous oxidation-reduction cycles, ubiquinone functions as both a membrane
    antioxidant and an electron carrier in many cellular pathways. In the electron transport chain, it
    transfers electrons from complex I and complex II to complex III. Ubiquinone is composed of a quinone
    core and a polyisoprenoid tail whose chain length varies according to species. The principal ubiquinone
    in S. cerevisiae has six subunits (CoQ6), whereas mice and humans have nine (CoQ9) and ten (CoQ10)
    subunits, respectively. In yeast, the polyisoprenoid tail of ubiquinone derives from the two main
    products of the mevalonate pathway: dimethylallyl-pyrophosphate (DPP) and isopentenyl-pyrophosphate
    (IPP). The condensation of DPP with one or more units of IPP produces short-chain polyprenyl diphosphates,
    such as farnesyl-PP (FPP) and geranylgeranyl-PP (GGPP), which serve as precursors for many primary
    metabolites. In the CoQ biosynthetic pathway, these short-chain molecules are further extended by
    long-chain polyprenyl diphosphate synthases. S. cerevisiae Coq1p (hexaprenyl pyrophosphate synthase)
    extends the isoprenoid subunit length of FPP or GGPP to six subunits, forming the hexaprenyl precursor
    to the polyprenyl tail of CoQ6. S. cerevisiae derives the quinone component of ubiquinone from either
    para-aminobenzoic acid (pABA) or 4-hydroxybenzoate (4-HB). While it is known that pABA synthesis from
    chorismate occurs via Abz1p and Abz2p in S. cerevisiae, the pathway of 4-HB synthesis is not fully
    characterized in this organism. It has been proposed that S. cerevisiae possesses a three-step pathway
    that converts tyrosine to 4-HB. This takes place through the following reactions: 1) deamination of
    tyrosine to 4-hydroxyphenylpyruvate (4-HPP) by Aro8p and Aro9p, 2) conversion of 4-HPP to 4-hydroxybenzaldehyde
    (4-Hbz) by an unknown enzyme, and 3) oxidation of 4-Hbz to 4-HB by Hfd1p. To synthesize CoQ6 in yeast,
    4-HB is condensed with hexaprenyl-diphosphate via Coq2p to form 3-hexaprenyl-4-hydroxybenzoate. This
    molecule then undergoes a series of methylation, decarboxylation, and hydroxylation reactions in a
    pathway involving enzymes encoded by COQ genes. Of all the COQ genes known to be important for the
    biosynthesis of ubiquinone, several members (e.g. COQ4 and COQ9) have yet to be assigned a specific
    role in the pathway. References: |CITS:[27060254]||CITS: [19531029]||CITS: [20592037]||CITS: [27693056]|'
