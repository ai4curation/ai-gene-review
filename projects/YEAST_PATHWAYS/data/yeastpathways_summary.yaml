    in either carbon source. Gdh1p uses alpha-ketoglutarate at a higher rate than Gdh3p. Thus, under fermentative
    growth conditions, Gdh1p drives glutamate biosynthesis, whereas in nonfermentable or limiting carbon
    sources, Gdh3p is the key isoform involved in balancing distribution of alpha-ketoglutarate to glutamate
    biosynthesis and energy metabolism.'
