  comment: 'In the dolichol pathway of N-linked glycosylation, an oligosaccharide consisting of two N-acetylglucosamine
    (GlcNAc), nine mannosyl, and three glucosyl residues (abbreviated GlcNAc2Man9Glc3) is assembled on
    the lipid carrier dolichol-pyrophosphate (Dol-PP). The ordered assembly of this lipid-linked oligosaccharide
    (LLO) begins on the cytoplasmic face of the endoplasmic reticulum (ER) and concludes within the lumen
    of the ER. Two distinct molecules provide the mannose units required for assembly of the LLO: GDP-mannose
    and Dol-P-mannose. GDP-mannose provides the first five mannose units attached to the LLO during the
    cytoplasmic phase, whereas Dol-P-mannose provides the final four units during the ER lumenal phase.
    In S. cerevisiae, Dol-P-mannose is synthesized from GDP-mannose and dolichyl phosphate (Dol-P) while
    GDP-mannose is synthesized from GDP and fructose-6-phosphate. The pathway for the synthesis of GDP-mannose
    from fructose-6-phosphate (F6P) occurs in three steps in S. cerevisiae: isomerization of F6P to mannose-6-phosphate
    by phosphomannoisomerase (Pmi40p), conversion of mannose-6-phosphate to mannose-1-phosphate by phosphomannomutase
    (Sec53p), and conversion of mannose-1-phosphate and GDP to GDP-mannose via mannose-1-phosphate guanylyltransferase
    (Psa1p). During the cytoplasmic phase of LLO biosynthesis, GDP-mannose molecules are used by a series
    of glycosyltransferases (Alg1p, Alg2p, and Alg11p) to add five mannosyl residues to Dol-PP-GlcNAc2.
    Alternatively, GDP-mannose can donate its sugar unit to Dol-P via Dol-P-mannose synthase (Dpm1p),
    forming Dol-P-mannose. Molecules of Dol-P-mannose are used by a second group of glycosyltransferases
    (Alg3p, Alg9p, and Alg12p) during the ER lumenal phase to add the four final mannoses to Dol-PP-GlcNAc2Man5.
    References: |CITS:[23751184]||CITS: [9878760]|'
