  comment: 'Thiamin (vitamin B1) is an essential compound for all organisms. The major bioactive form
    of thiamin, thiamin diphosphate (TDP), is a cofactor for many enzymes involved in carbohydrate and
    amino acid metabolism. Bacteria, plants, and fungi are able to synthesize thiamin de novo, while animals
    must acquire it from the environment. Thiamin is formed from the ring structures of two aromatic compounds:
    4-amino-5-hydroxymethyl-2-methylpyrimidine diphosphate (HMP-PP) and 5-(2-hydroxyethyl)-4-methylthiazole
    phosphate (HET-P). In S. cerevisiae, thiamin diphosphate is synthesized from HMP-PP and HET-P in three
    steps. First, HMP-PP and HET-P are condensed by Thi6p to yield thiamin monophosphate (TMP). Second,
    TMP is dephosphorylated to yield thiamine. This step is presumed to be catalyzed by nonspecific phosphatases
    in the cytosol. Third, thiamine is pyrophosphorylated by thiamin pyrophosphokinase (Thi80p) to yield
    TDP. The thiazole and pyrimidine heterocycles of thiamin are derived from HET-P and HMP-PP, respectively.
    The underlying mechanisms for the synthesis of the thiazole and pyrimidine precursors in yeast are
    not yet fully understood. In S. cerevisiae, the thiazole is formed from NAD, glycine, and a cysteine
    residue from the active site of thiazole synthase (Thi4p). This unusual suicide mechanism results
    in a single turnover capacity for Thi4p. Likewise, the pyrimidine ring is formed from histidine and
    pyridoxal phosphate via the action of THI5 family enzymes, and may also involve a suicide mechanism
    where histidine is supplied from the active site of Thi5p. The single turnover capacity of Thi4p and
    Thi5p is speculated to balance the provision of thiazole and pyramidine heterocycles and provide an
    alternate regulatory mechanism for thiamin biosynthesis in yeast (see |CITS: [23048037]|). References:
    |CITS:[18161008]||CITS: [17309261]||CITS: [22031445]||CITS: [22568620]||CITS: [23048037]|'
