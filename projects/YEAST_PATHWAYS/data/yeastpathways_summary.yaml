  comment: 'S. cerevisiae synthesizes methionine via the methylation of homocysteine. In this reaction,
    the cobalamin-independent methionine synthase Met6p catalyzes the transfer of a methyl group from
    5-methyltetrahydrofolate (5-methyl-THF) to the thiol of homocysteine, forming methionine. 5-methyl-THF
    is a folate coenzyme that carries a single-carbon unit originating from one-carbon metabolism. It
    exists in both monoglutamated and polyglutamated forms, however only the latter can be used by Met6p
    as the methyl donor for this reaction. Yeast cells defective in polyglutamylation of folate coenzymes
    (MET7 null mutants) are auxotrophic for methionine. The other component of this reaction, homocysteine,
    is derived from aspartate and sulfur. In S. cerevisiae, aspartate can be utilized for homocysteine
    biosynthesis by undergoing a three-step conversion to homoserine followed by acetylation to O-acetylhomoserine.
    O-acetylhomoserine can then react with sulfide to produce homocysteine directly, or it can react with
    cysteine (a sulfur amino acid) to produce cystathionine via the transsulfuration pathway. The subsequent
    cleavage of cystathionine produces homocysteine. References: |CITS:[9409150]||CITS: [16700064]||CITS:
    [10799479]|'
  name: methionine biosynthesis
