    orf: YGR194C
    symbol: XKS1
    uniprot: UniProtKB:P42826
  comment: 'Xylulose is a pentose sugar and a fermentable carbon source in S. cerevisiae. While xylulose
    is not abundant in nature, many organisms produce it as an intermediate in metabolism of xylose, the
    most naturally abundant sugar after glucose. In many xylose-utilizing species of yeast, degradation
    of xylose proceeds through its conversion to xylulose, phosphorylation to xylulose-5-phosphate, and
    subsequent metabolism in the pentose phosphate pathway. Although enzyme activities for all necessary
    steps in xylose utilization have been detected in S. cerevisiae, the conversion of xylose to xylulose
    does not occur at a rate sufficient for growth on xylose in this species. As a consequence, S. cerevisiae
    can utilize xylulose but not xylose for growth and carbon in vivo. S. cerevisiae ferments xylulose
    at a rate ten times lower than for glucose. The rate-limiting step of xylulose utilization is catalyzed
    by xylulokinase (Xks1p), which phosphorylates xylulose for subsequent incorporation into the pentose
    phosphate pathway. XKS1 expression in S. cerevisiae is generally low and is not induced in the presence
    of xylose or xylulose. While some studies show that overexpressing XKS1 improves growth on xylulose,
    others report that XKS1 overexpression is toxic when cells are grown on xylulose as the sole carbon
    source. References: |CITS:[20171088]||CITS: [18555359]||CITS: [16348083]||CITS: [15184173]||CITS:
    [10981687]||CITS: [9595677]|'
