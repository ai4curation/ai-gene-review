  comment: 'Pantothenate (vitamin B5) is a metabolic precursor to the essential cofactor coenzyme A. It
    is synthesized de novo in plants, eubacteria, archaea, and many fungi, but not in animals who instead
    must acquire it from the environment. S. cerevisiae is able to synthesize pantothenate de novo, however
    some laboratory strains still require pantothenate supplementation in order to achieve optimal growth.
    Synthesis of pantothenate requires two precursors: pantoate and -alanine. The source of -alanine for
    this pathway varies by organism; whereas bacteria produce -alanine in one-step via the decarboxylation
    of aspartate, S. cerevisiae derives -alanine in two steps from spermine, a polyamine produced in the
    methionine salvage pathway. In the S. cerevisiae route, spermine is oxidized by amine oxidase (Fms1p)
    to form 3-aminopropanal, which is subsequently converted to -alanine by an aldehyde dehydrogenase
    (Ald2p or Ald3p). Pantoate is synthesized from 2-ketoisovalerate (2-KIV), an intermediate in the biosynthesis
    of branched-chain amino acids. This occurs in two steps in S. cerevisiae: hydroxymethylation of 2-KIV
    via Ecm31p to form ketopantoate, and reduction of ketopantoate to pantoate via Pan5p. After its production,
    pantoate can be condensed with -alanine in a reaction catalyzed by pantothenate synthetase (Pan6p)
    to form pantothenate. Pantothenate may then go on to react with cysteine and ATP in a five-step pathway
    leading up to the synthesis of coenzyme A. References: |CITS:[15565250]||CITS: [11154694]||CITS: [10373490]||CITS:
    [12586697]|'
