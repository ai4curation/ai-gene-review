PWYQT-4432:
  all_genes:
  - *id357
  - *id358
  comment: 'The tripeptide glutathione (GSH: L-γ-glutamyl-L-cysteinylglycine) is a prevalent intracellular
    thiol that is able to act as a cellular redox buffer due to its low redox potential (as reviewed in
    |CITS: [12702279]|). GSH is involved in many biological processes including: protein and DNA synthesis;
    amino acid transport; enzyme regulation; protection of cells against reactive oxygen compounds and
    free radicals, xenobiotics and heavy metals (as reviewed in |CITS: [12702279]|). GSH can also be used
    as a source of sulfur and cysteine in |CITS: [1674526], [10514563]|. Although GSH biosynthesis is
    well characterized in yeast, the pathway(s) of GSH degradation are not yet fully characterized. Plants
    and animals are known to metabolize GSH via the γ-glutamyl cycle, but the presence of this complete
    cycle in yeast and other microorganisms is still open to debate |CITS: [5076], [JASPERS85]|. Saccharomyces
    cerevisiae is believed to hydrolyze GSH to its constitutive amino acids glutamate, cysteine and glycine
    in two steps catalyzed by the vacuolar-membrane-bound enzymes, γ-glutamyl transpeptidase (Ecm38p)
    and cysteinylglycine dipeptidase (CGase), respectively |CITS: [JASPERS85], [6143574], [11672438]|.
    Ecm38p catalyzes the cleavage and transfer of the γ-glutamyl moiety from GSH to an acceptor amino
    acid (or its hydrolysis to glutamate) and the release of cysteinylglycine |CITS: [JASPERS85]|. Cellular
    levels of Ecm38p are low in the presence of ammonium ions as the sole nitrogen source, but they are
    increased in the presence of other nitrogen sources, such as amino acids and urea |CITS: [6102906]|.
    Ecm38p production is derepressed during nitrogen starvation |CITS: [9202464]|. CGase is proposed to
    hydrolyze the cysteinylglycine to the amino acids cysteine and glycine. Although enzymatic activity
    for CGase was observed in S. cerevisiae |CITS: [JASPERS85]|, the open reading frame for CGase has
    yet to be identified in S. cerevisiae. S. cerevisiae also has been proposed to have an alternative
    pathway for degrading GSH that involves a novel GSH degradosomal protein complex comprised of the
    three gene products Dug1p, Dug2p, and Dug3p |CITS: [17179087]|. '
  name: glutathione degradation
