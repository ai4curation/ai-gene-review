  all_genes:
  - *id057
  - *id049
  - *id050
  - *id051
  comment: 'In S. cerevisiae, citrulline is a metabolic intermediate in the latter, cytosolic half of
    the arginine biosynthesis pathway. Citrulline production requires two intermediates: ornithine, the
    product of the first five steps of arginine biosynthesis in the mitochondrion, and carbamoyl phosphate,
    which is synthesized in the cytosol from ATP, CO2, and the amide group of glutamine via carbamoyl
    phosphate synthetase (Cpa1p/Cpa2p). After ornithine is transported from the mitochondrion to the cytosol
    by Ort1p, ornithine carbamoyltransferase (Arg3p) catalyzes the transfer of the carbamoyl group from
    carbamoyl phosphate to the -amino group of ornithine to form citrulline. References: |CITS: [22419079]||CITS:
    [205532]||CITS: [2945985]|'
