  comment: 'Many organisms possess sulfur salvage pathways that enable recovery of the reduced sulfur
    atom in metabolites of S-adenosylmethionine (AdoMet) after AdoMet is consumed in a metabolic reaction.
    The methionine salvage pathway, also known as the 5-methylthioadenosine (MTA) cycle, is one such example.
    The MTA cycle regenerates methionine from the AdoMet metabolite 5-methylthioadenosine/MTA, which is
    formed predominantly as a byproduct of polyamine biosynthesis. The methionine salvage pathway is present
    in all types of organisms, and may have evolved to reuse sulfur after its costly assimilation into
    the cell. In the MTA cycle, four carbon atoms from the ribose moiety (C-2 through C-5) of MTA give
    rise to the carbon skeleton of methionine while the methylthiol group is conserved. The preferred
    amino group donor for the transamination reaction at the final step of pathway varies by organism;
    in S. cerevisiae, branched-chain and aromatic amino acids are both preferred donors. This step occurs
    via the branched-chain transaminases Bat1p and Bat2p or the aromatic amino acid transaminases Aro8p
    and Aro9p. The less-used donors for this reaction in S. cerevisiae are lysine, proline, glutamate,
    and glutamine. In addition to methionine, the MTA cycle may also serve as a source of purines, as
    adenine is cleaved off from MTA during the first reaction of the cycle. References: |CITS:[9409150]||CITS:
    [19946895]||CITS: [16530730]||CITS: [18625006]|'
  name: methionine salvage pathway
  pmids:
