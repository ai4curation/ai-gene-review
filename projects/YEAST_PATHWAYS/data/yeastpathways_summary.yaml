  comment: 'Folates are heterocyclic compounds based on a pteroic acid skeleton conjugated to one or more
    glutamate molecules. The biologically active form of folate is tetrahydrofolate (THF), whose metabolic
    derivatives serve as cofactors that carry and chemically activate one-carbon (1C) units at different
    levels of oxidation (methyl-THF, methylene-THF, etc.) The 1C units carried by these folate cofactors
    are utilized in one-carbon metabolism for the biosynthesis of various compounds including methionine,
    thymidylate, and purines. S. cerevisiae and many other microorganisms are able to synthesize tetrahydrofolate
    de novo, unlike humans who must acquire it from the environment. In the folate biosynthesis pathway,
    dihydrofolate synthetase (Fol3p in S. cerevisiae) adds an initial glutamate molecule to the p-aminobenzoic
    acid moiety of 7,8-dihydropteroate to form 7,8-dihydrofolate. This compound is then reduced by dihydrofolate
    reductase (Dfr1p) to tetrahydrofolate, which can subsequently be converted to a 1C unit-carrying THF
    derivative. The folates produced in this pathway are subject to further glutamylation by folylpolyglutamate
    synthetase (Met7p), which catalyzes ATP-dependent extension of the glutamate side chain to yield folate
    polyglutamates. Polyglutamylation is thought to increase the affinity of intracellular folates for
    folate-dependent enzymes and prevent their efflux out of cells and organelles. Lending to the importance
    of polyglutamylation for folate coenzyme function, fol3 null mutants require folinic acid supplementation
    for growth and met7 null mutants are respiratory-deficient and auxotrophic for methionine. References:
    |CITS:[3665922]||CITS: [18804690]||CITS: [16700064]||CITS: [10799479]||CITS: [(SCOTT)]|'
  name: folate polyglutamylation
