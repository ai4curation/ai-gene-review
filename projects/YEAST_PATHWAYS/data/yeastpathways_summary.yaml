  comment: 'Sulfur is found in many important biological compounds, including the amino acids methionine
    and cysteine, the coenzymes biotin and coenzyme A, and other metabolites such as glutathione. Although
    most of these compounds contain reduced sulfur, in nature the major form of inorganic sulfur available
    to many microorganisms is sulfate. In order to use sulfate to synthesize organic sulfur compounds,
    particularly sulfur amino acids and their derivatives, plants and many microorganisms import and reduce
    sulfate via the sulfate assimilation pathway. In S. cerevisiae, the sulfate assimilation pathway consists
    of sulfates uptake via Sul1p and Sul2p, activation to adenylate compounds, reduction to sulfide, and
    subsequent incorporation into carbon chains. The importance of activating sulfate to adenylyl sulfate
    (APS) and phosphoadenylyl sulfate (PAPS) stems from the fact that physiological reducing agents (e.g.
    NADPH, NADH) are not large enough in E0'' to reduce sulfate directly. Adenylation lowers sulfate''s
    electropotential, enabling cells to circumvent what would otherwise be an endergonic reaction. After
    its conversion to PAPS, sulfate is reduced to sulfite by PAPS reductase (Met16p) and again to sulfide
    by sulfite reductase (Met5p and Met10p). The subsequent incorporation of sulfide into a carbon chain
    varies by organism; in S. cerevisiae, sulfide can react with O-acetylhomoserine via Met17p to form
    homocysteine, the major intermediate in the biosynthesis and interconversion of methionine and cysteine.
    In plants and enteric bacteria, sulfide can react with O-acetylserine to form cysteine directly. The
    induction of all genes involved in the S. cerevisiae sulfate assimilation pathway depends upon the
    leucine-zipper transcriptional activator Met4p. Met4p induces MET gene expression in cysteine-limiting
    conditions, while under cysteine-rich conditions Met4p transcriptional activity is negatively regulated
    by the ubiquitin ligase SCF(Met30). Furthermore, sulfur transport is inhibited in this organism by
    intracellular sulfate and sulfur metabolites such as APS and cysteine. References: |CITS: [9409150]||CITS:
    [16102596]||CITS: [22419079]||CITS: [BIOCHEMISTRYSULFURCYCLE]|'
  name: sulfate assimilation pathway
  pmids:
