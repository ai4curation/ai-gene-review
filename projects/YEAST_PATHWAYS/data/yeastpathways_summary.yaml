  comment: 'In the dolichol pathway of N-linked glycosylation, an oligosaccharide consisting of two N-acetylglucosamine
    (GlcNAc), nine mannosyl, and three glucosyl residues (abbreviated GlcNAc2Man9Glc3) is assembled on
    the lipid carrier dolichol-pyrophosphate (Dol-PP). This assembly is catalyzed by several groups of
    glycosyltransferases, each using a different nucleotide-activated or Dol-P-bound sugar as their donor
    substrate. One such substrate is Dol-P-glucose, which provides glucose residues for assembly of the
    terminal Glc3 cap on the lipid-linked oligosaccharide (LLO). In S. cerevisiae, Dol-P-glucose is synthesized
    from glucose-6-phosphate (G6P) in three steps: conversion of G6P to glucose-1-phosphate by phosphoglucomutase
    (Pgm1p or Pgm2p), formation of UDP-glucose from glucose-1-phosphate and UTP via UDP-glucose pyrophosphorylase
    (Ugp1p), and transfer of glucose from UDP-glucose to Dol-P by UDP-glucose:dolichyl-phosphate glucosyltransferase
    (Alg5p). After its production, Dol-P-glucose may serve as substrate for the glycosyltransferases Alg6p,
    Alg8p, and Die2p/Alg10p within the lumen of the endoplasmic reticulum (ER). These enzymes catalyze
    the sequential addition of three glucose residues, each derived from a molecule of Dol-P-glucose,
    to the growing LLO during the final steps of LLO biosynthesis. References: |CITS:[23751184]||CITS:
    [9878760]|'
