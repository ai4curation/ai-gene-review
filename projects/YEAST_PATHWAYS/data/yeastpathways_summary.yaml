  comment: 'Folates are heterocyclic compounds based on a pteroic acid skeleton conjugated to one or more
    glutamate molecules. The biologically active form of folate is tetrahydrofolate (THF), whose metabolic
    derivatives serve as cofactors that carry and chemically activate one-carbon (1C) units at different
    levels of oxidation (methyl-THF, methylene-THF, etc.) The 1C units carried by these folate cofactors
    are utilized in one-carbon metabolism for the biosynthesis of various compounds including methionine,
    thymidylate, and purines. S. cerevisiae and many other microorganisms are able to synthesize tetrahydrofolate
    de novo, unlike humans who must acquire it from the environment. In the folate biosynthesis pathway,
    chorismate is converted to p-aminobenzoic acid (PABA) and coupled to a GTP-derived pteridine moiety
    to form 7,8-dihydropteroate. Dihydrofolate synthetase (encoded by FOL3 in S. cerevisiae) subsequently
    adds a glutamate molecule to form 7,8-dihydrofolate, which is reduced by dihydrofolate reductase (Dfr1p)
    to tetrahydrofolate. Tetrahydrofolate can then be converted to one of the various 1C unit-carrying
    folate cofactors. Many of these cofactor forms, which differ in the position and the oxidation state
    of the 1C unit, mediate one-carbon transfer reactions in a specific biosynthetic pathway and can be
    enzymatically interconverted to one another. Furthermore, the folates produced in this pathway are
    subject to further glutamylation by folylpolyglutamate synthetase (Met7p), which catalyzes ATP-dependent
    extension of the glutamate side chain to yield folate polyglutamates. Polyglutamylation is thought
    to increase the affinity of intracellular folates for folate-dependent enzymes and prevent their efflux
    out of cells and organelles. References: |CITS:[3665922]||CITS: [18804690]||CITS: [16700064]||CITS:
    [10799479]||CITS: [(SCOTT)]|'
