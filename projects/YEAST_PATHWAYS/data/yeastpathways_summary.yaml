  comment: 'Glycolysis consists of ten reactions that can be conceptually split into an energy investment
    and phase and an energy-producing phase. In the initial energy investment phase, 2 molecules of ATP
    are consumed to convert glucose into fructose-1,6-bisphosphate. In the downstream energy producing
    phase, fructose-1,6-bisphosphate is then broken down into two 3-carbon sugars that are each converted
    into a molecule of pyruvate. 2 ATP and 1 NADH are produced for each 3-carbon sugar converted to pyruvate,
    therefore glycolysis nets 2 ATP, 2 NADH, and 2 pyruvate molecules for each glucose fed through the
    pathway. In S. cerevisiae, further degradation of pyruvate can occur via respiration or fermentation.
    The respiration pathway involves the complete oxidation of pyruvate to CO2 via pyruvate dehydrogenase
    and the TCA cycle, yielding ATP and reduced cofactors (e.g. NADH) that can be oxidized in the mitochondria
    to produce more ATP. In the fermentation pathway, pyruvate is decarboxylated by pyruvate decarboxylase
    to acetaldehyde, which is then reduced to ethanol by alcohol dehydrogenase. The respiratory pathway
    in S. cerevisiae yields approximately 16 ATP per glucose, whereas the fermentation pathway results
    in a net gain of only two ATP per glucose. Despite the greater ATP-to-glucose ratio afforded by the
    respiration pathway, S. cerevisiae nevertheless ferments glucose in the presence of oxygen when this
    sugar is abundant in the growth medium. This phenomenon- the fermentation of sugar under aerobic conditions-
    is referred to as the Crabtree effect. In the respiratory pathway, pyruvate dehydrogenase (PDH) converts
    pyruvate to acetyl-CoA in the mitochondrion. However, because S. cerevisiae is unable to transport
    acetyl-CoA from the mitochondrion to the cytoplasm, this organism utilizes an alternative, cytosolic
    pathway known as the PDH bypass to generate cytosolic acetyl-CoA from pyruvate by using acetate as
    an intermediate. The PDH bypass involves the concerted action of pyruvate decarboxylase, which converts
    pyruvate to acetaldehyde; acetaldehyde dehydrogenase, which oxidizes acetaldehyde to acetate; and
    acetyl-CoA synthetase, which ligates acetate with coenzyme A to form acetyl-CoA. The PDH bypass is
    the source of the acetate that accumulates in S. cerevisiae cultures when shifted from glucose limitation
    to glucose excess. References: |CITS:[11152939]||CITS: [25988158]||CITS: [9123965]||CITS: [10919763]||CITS:
    [10234824]|'
