PWY3O-0:
  all_genes:
  - *id146
  - *id147
  comment: 'Fructose is a six-carbon ketose that can be used as a fermentable carbon source in S. cerevisiae.
    Utilization of fructose begins with its uptake via hexose transporter (Hxt) family proteins. Of the
    20 different Hxt-related proteins in S. cerevisiae, Hxt1p-4p, 6p, and 7p are the most important for
    glucose, fructose, and mannose uptake. Once inside the cell, fructose is phosphorylated to fructose-6-phosphate
    (F6P) by the hexokinases Hxk1p and Hxk2p. Although both kinases can catalyze this reaction, only HXK2
    is expressed when fructose is the carbon source. HXK1 expression occurs in the presence of non-fermentable
    carbon sources or galactose. F6P, in addition to being an intermediate in glycolysis, may also be
    utilized in yeast to synthesize UDP-N-acetyl-D-glucosamine, a building block for major structural
    components of the fungal cell wall. References: |CITS: [16408321]||CITS: [9299703]||CITS: [7732723]|'
