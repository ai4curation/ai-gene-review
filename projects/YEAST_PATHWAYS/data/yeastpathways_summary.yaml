  comment: 'Purine and pyrimidine nucleotides serve many diverse and essential roles in the cell. They
    are precursors to DNA, RNA, and many important metabolites (e.g. CDP-diacylglycerol). In addition,
    nucleotides can be used as an energy source (primarily as ATP), signaling molecules, and cofactor
    components (e.g. coenzyme A). De novo purine nucleotide biosynthesis in yeast involves the 10-step
    production of the purine nucleotide inosine monophosphate (IMP), the common precursor to both adenosine
    monophosphate (AMP) and guanosine monophosphate (GMP). Synthesis of IMP begins with a reaction catalyzed
    by amidophosphoribosyltransferase (Ade4p) between PRPP (5-phosphoribosylpyrophosphate), glutamine,
    and water. Glutamine displaces the pyrophosphate group of PRPP, converting PRPP to phosphoribosylamine.
    The amino group of phosphoribosylamine subsequently reacts with a carboxyl group of glycine via Ade5,7p,
    forming the amide bond of phosphoribosylglycinamide. In the third reaction of the pathway, a tetrahydrofolate
    cofactor donates a one-carbon unit at the oxidation level of formate to the -amino group of phosphoribosylglycinamide.
    This forms phosphoribosyl-N-formylglycinamide, which reacts with an amino group from glutamine via
    Ade6p to form phosphoribosylformylglycinamidine. In three ATP-dependent steps, this product then undergoes
    closure of the imidazole ring by Ade5,7p, carboxylation by Ade2p, and condensation with aspartate
    by Ade1p. Adenylosuccinate lyase (Ade13p) subsequently catalyzes cleavage with release of fumarate
    to form aminoimidazole carboxamide ribonucleotide (AICAR). In the final two steps, Ade16p or Ade17p
    introduce a formyl group to the amino group on the imidazole ring, then condense the formyl carbon
    with the nitrogen from the amide group. This results in closure of the 6-membered ring and yields
    the purine nucleotide IMP. The incorporation of an aspartate group to IMP, followed by cleavage with
    the loss of fumarate, results in the conversion IMP to AMP. These reactions are catalyzed by adenylosuccinate
    synthetase (Ade12p) and adenylosuccinate lyase (Ade13p), respectively. Oxidation of IMP, on the other
    hand, converts it to xanthosine monophosphate (XMP). XMP can be amidated (using glutamine as the donor)
    to form GMP in a reaction catalyzed by GMP synthase (Gua1p). References: |CITS:[22419079]||CITS: [(JONES)]||CITS:
    [10877846]|'
