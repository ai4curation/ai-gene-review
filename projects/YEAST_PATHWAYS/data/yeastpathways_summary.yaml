  comment: 'In most organisms, the primary mode of fatty acid catabolism is -oxidation. The -oxidation
    cycle catalyzes the complete oxidation of a fatty acid molecule, removing two carbon atoms (in the
    form of acetyl-CoA) with each turn of the cycle. The subcellular location in which -oxidation occurs
    varies by organism; in bacteria, -oxidation occurs in the cytoplasm, whereas in mammalian cells it
    occurs in both the mitochondria and the peroxisome. In contrast, -oxidation in S. cerevisiae, plants,
    and most other fungi occurs exclusively in the peroxisome. -oxidation begins with the activation of
    a fatty acid with coenzyme A, producing an acyl-CoA. In S. cerevisiae, the uptake of free fatty acids
    as well as their activation with coenzyme A occurs via the acyl-CoA synthases Fat1p and Faa1p-Faa4p.
    The acyl-CoA molecule is then oxidized, introducing a double bond between C2 (the -carbon) and C3
    (the -carbon). This step is catalyzed by acyl-CoA oxidase, encoded by POX1 in yeast. In the third
    step, the double bond is hydrated, leading to the formation of a hydroxyl group on C3. The stereochemistry
    of the 3-hydroxyacyl-CoA intermediate is specific to the type of -oxidation pathway. In fungal peroxisomes,
    -oxidation proceeds via (3R)-hydroxy intermediates; in contrast, mitochondrial -oxidation in mammals
    proceeds via the (3S) enantiomer. In the fourth step, the hydroxyl group is oxidized to a carbonyl
    group, forming a 3-ketoacyl-CoA intermediate. Steps 3-4 are both catalyzed by the multifunctional
    enzyme Fox2p in S. cerevisiae. Lastly, the 3-ketoacyl-CoA intermediate undergoes thiolytic cleavage
    between C2 and C3, yielding one acetyl-CoA and an acyl-CoA molecule shortened by two carbon atoms.
    This step is catalyzed by 3-ketoacyl-CoA thiolase, encoded by POT1 in S. cerevisiae. References: |CITS:[17028011]||CITS:
    [24520995]||CITS: [12697341]|'
