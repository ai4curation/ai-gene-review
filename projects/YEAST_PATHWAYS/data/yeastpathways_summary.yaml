  comment: 'The metabolic interconversion of cysteine and homocysteine via formation of a cystathionine
    intermediate is known as the transsulfuration pathway. While the transsulfuration pathway proceeds
    in only one direction in many bacteria and fungi, S. cerevisiae encodes for both a forward and reverse
    version of the pathway and is able to convert cysteine and homocysteine to one or the other reversibly.
    In the forward pathway, cysteine reacts with O-acetylhomoserine in a reaction catalyzed by cystathionine
    -synthase to form cystathionine. Cystathionine is then cleaved by cystathionine -lyase, yielding pyruvate,
    ammonia, and homocysteine. In S. cerevisiae, cystathionine -synthase and -lyase are thought to be
    encoded by STR2 and STR3 respectively, due to their similarity to the aforementioned enzymes in other
    organisms and the inability of str2 or str3 null mutants to utilize cysteine as a sole sulfur source.
    In the reverse pathway, cystathionine -synthase (Cys4p) catalyzes the condensation of homocysteine
    and serine to form cystathionine. Cystathionine -lyase (Cys3p) then catalyzes hydrolysis of cystathionine
    to produce cysteine, -ketobutyrate, and ammonia. The presence of two transsulfuration pathways in
    S. cerevisiae enables the cell to acquire methionine from cysteine and vice-versa by using homocysteine
    as an intermediate. Homocysteine derived from cysteine in the forward transsulfuration pathway can
    be converted to methionine, while homocysteine derived from methionine can be converted to cysteine
    via the reverse transsulfuration pathway. This enables S. cerevisiae to utilize methionine or cysteine
    as a sole source of sulfur. References: |CITS:[9409150]||CITS: [10821189]||CITS: [14967036]||CITS:
    [24291053]|'
