  - *id349
  comment: 'Purine bases (guanine, adenine, etc.) acquired from the environment or formed as a product
    of nucleic acid degradation can be recycled for purine nucleotide synthesis via purine salvage pathways.
    In the salvage pathway for guanine, guanine is converted to guanosine monophosphate (GMP) by hypoxanthine-guanine
    phosphoribosyltransferase (HPRT). Alternatively, guanine can be converted to xanthine by guanine deaminase.
    In S. cerevisiae, these enzymes are encoded by HPT1 and GUD1, respectively. Xanthine itself can be
    salvaged to form XMP by xanthine phosphoribosyltransferase (Xpt1p in yeast) and further converted
    to GMP by GMP synthase (Gua1p). S. cerevisiae mutants defective in the de novo GMP biosynthesis pathway
    are viable when supplied with guanine, demonstrating that the salvage pathway can act as a sufficient
    source of guanylic nucleotides in this organism. Because overproduction or starvation of purine nucleotides
    is deleterious to cells, the intracellular pool of these compounds must be carefully balanced. Purine
    salvage appears to be an important factor in this regard. Deletion of HPT1 in S. cerevisiae leads
    to de-repression of enzymes involved in the de novo pathway, resulting in constitutively active purine
    nucleotide biosynthesis. On the other hand, overexpression of feedback-insensitive mutant hpt1 in
    the presence of guanine leads to guanylic nucleotide overaccumulation and massive cell death. Notably,
    deficiency of HPRT activity in humans results in increased production of purine nucleotides and is
    also regarded as the cause of Lesch-Nyhan syndrome. References: |CITS:[17052198]||CITS: [15565584]||CITS:
    [10217799]||CITS: [12746440]||CITS: [9335580]||CITS: [18245832]||CITS: [18067674]|'
  name: salvage pathways of guanine, xanthine and their nucleosides
