  comment: 'Saccharomyces cerevisiae can grow on acetoin and 2,3-butanediol as the sole carbon and energy
    sources, indicating S. cerevisiae''s ability to degrade these metabolites |CITS: [10938079]|. Acetoin
    and 2,3-butanediol are both by-products of alcoholic fermentation by S. cerevisiae and other wine
    yeasts. Various lines of evidence suggest that Bdh1p catalyzes the first step in 2,3-butanediol degradation,
    the oxidation of 2,3-butanediol to acetoin |CITS: [10938079]|. However, S. cerevisiae mutants with
    a disrupted BDH1 gene can still grow on 2,3-butanediol as the sole carbon and energy source, indicating
    that there are other enzymes that can metabolize 2,3-butanediol |CITS: [10938079]|). How acetoin is
    further degraded in S. cerevisiae is not yet known. Many prokaryotes have a multienzyme complex, acetoin
    dehydrogenase , that is similar to pyruvate dehdrogenase and transforms acetoin into acetaldehyde
    and acetyl-CoA, which can enter the glyoxylate and TCA cycle (as reported in |CITS: [11306064]|).'
