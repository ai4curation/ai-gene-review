  comment: 'Xylose is a pentose sugar and the second most abundant monosaccharide in nature. Because of
    the high abundance of xylose in wood and dry plant matter, engineering organisms for efficient fermentation
    of xylose to biofuel ethanol is of major industrial interest. Degradation of xylose in yeasts and
    filamentous fungi generally proceeds through its conversion to xylulose, phosphorylation to xylulose-5-phosphate,
    and subsequent metabolism in the pentose phosphate pathway. Although enzyme activities for all necessary
    steps in xylose utilization have been detected in S. cerevisiae, the conversion of xylose to xylulose
    does not occur in this organism at a rate sufficient for growth on xylose. As a consequence, S. cerevisiae
    can utilize xylulose but not xylose for growth and carbon in vivo. In xylose-utilizing yeasts, conversion
    of xylose to xylulose occurs in two steps: reduction of xylose to xylitol by xylose reductase, and
    oxidation of xylitol to xylulose by xylitol dehydrogenase. In S. cerevisiae, the first step can be
    catalyzed by the unspecific aldose reductase Gre3p while the second step can be catalyzed by the xylitol
    dehydrogenase Xyl2p. Overexpression of both GRE3 and XYL2 enables S. cerevisiae to grow on xylose
    as the sole carbon source. Wild type S. cerevisiae cells accumulate xylitol when cultured on xylose,
    suggesting that S. cerevisiae metabolizes xylose to xylitol and little further in vivo. This may be
    due to the NAD+ requirement for xylitol dehydrogenase; NADH is thought to accumulate due to xylitol
    dehydrogenase activity and create a cofactor imbalance severe enough to obstruct to continuous conversion
    of xylitol to xylulose. References: |CITS:[20171088]||CITS: [18555359]||CITS: [7747971]||CITS: [10486580]||CITS:
    [15184173]|'
