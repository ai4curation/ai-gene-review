PWY3O-592:
  all_genes:
  - *id192
  comment: The glutathione/glutaredoxin and thioredoxin systems help maintain the reduced environment
    of the cell and play a significant role in defending the cell against oxidative stress. They also
    have been proposed to play a role in DNA synthesis, protein folding and regulation, and sulfur metabolism
    |CITS:[11169096],[2668278]|. Glutaredoxins and thioredoxins are small heat-stable proteins that can
    reduce disulfides by way of conserved cysteines. Glutaredoxins catalyze reductions of intracellular
    disulfides or glutathione-mixed disulfides in a coupled system with glutathione, NADPH and glutathione
    reductase. Unlike the thioredoxin system where oxidized thioredoxin disulfide is reduced directly
    by thioredoxin reductase with electrons from NADPH, oxidized glutaredoxin is reduced by glutathione
    with electrons donated by NADPH |CITS:[2668278]|. Yeast, similar to bacteria, plants, and humans have
    monothiol and dithiol glutaredoxins with the conserved active site motif Cys-Pro-Tyr-Cys and Cys-Gly-Phe-Ser,
    respectively |CITS:[11898418]|. Monothiol glutaredoxins (Grx-SH) catalyze the reduction of thiol-glutathione
    mixed disulfides (Protein-S-S-G) only, while dithiol glutaredoxins (Grx-(SH)2) reduce both protein
    disulfides (Protein-S2) and GSH-mixed disulfides (Protein-S-S-G) |CITS:[11898418]|. Five glutaredoxins
    have been identified in S. cerevisiae, two dithiol glutaredoxins, Grx1p and Grx2p, and three monothiol
    glutaredoxins, Grx3p, Grx4p, and Grx5p |CITS:[11898418]|. All five glutaredoxins participate in the
    response against oxidative stress |CITS:[9571241][10567543]|. GRX1 and GRX2 mutants are sensitive
    to the oxidants superoxide anions and hydrogen peroxide respectively, suggesting that they have different
    roles in protecting the cells |CITS:[9571241]|. The defensive roles of Grx1p and Grx2p may overlap
    with those of the cytosolic thioredoxins, Trx1p and Trx2p as at least one Grx1p/Grx2p glutaredoxin
    or one Trx1p/Trx2p thioredoxin is required for yeast cell viability |CITS:[10844700]|. Although GRX3
    and GRX4 mutants do not have strong sensitivity to oxidants, mutants lacking GRX5 do. GRX5 mutants
    also have increased protein oxidative damage, growth defects in minimal medium, and inability for
    respiratory growth |CITS:[10567543]|. Grx5p has also been found to be a mitochondrial glutaredoxin
    required for the activity of iron/sulfur enzymes |CITS:[11950925]|.
