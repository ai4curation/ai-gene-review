  comment: 'Tetrapyrroles are a group of molecules that contain of four pyrrole rings linked together
    by single-atom bridges in a cyclic or linear arrangement. Biologically important cyclic tetrapyrroles,
    such as chlorophyll, cobalamin, heme, and siroheme, coordinate a metal ion in their central cavity
    and function as cofactors in numerous biological processes. Heme, which coordinates an iron atom,
    functions in oxygen sensing and utilization. To synthesize heme and other tetrapyrrole-derived compounds,
    S. cerevisiae utilizes a common biosynthetic pathway that leads up to the formation of the first macrocyclic
    intermediate, uroporphyrinogen-III, upon which the pathways diverge. In the heme biosynthetic route,
    four carboxyl groups are removed sequentially from the acetate side chains of uroporphyrinogen-III
    by uroporphyrinogen decarboxylase (Hem12p) to form coproporphyrinogen III. Decarboxylation of two
    of the carboxyethyl side chains of coproporphyrinogen III by coproporphyrinogen III oxidase (Hem13p)
    then forms protoporphyrinogen IX, which is subsequently oxidized by protoporphyrinogen oxidase (Hem14p)
    to yield protoporphyrin IX. In the final step, a ferrous ion is inserted into protoporphyrin IX by
    ferrochelatase (Hem15p), forming the end-product heme. References: |CITS:[11212295]||CITS: [2180703]||CITS:
    [2838478]||CITS: [7798202]||CITS: [2185242]|'
