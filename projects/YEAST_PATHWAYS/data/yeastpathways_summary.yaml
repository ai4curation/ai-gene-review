  comment: 'Yeast and most other microorganisms initiate the degradation of galactose via the enzymes
    of the Leloir pathway, which convert galactose into glucose-6-phosphate for subsequent entry into
    glycolysis. In the yeast Leloir pathway, galactokinase (Gal1p) phosphorylates galactose to galactose-1-phosphate.
    Galactokinase is specific for the -anomer of galactose; if the galactose substrate is in the -form,
    then it must first be converted to the -form through the mutarotase activity of Gal10p. After its
    conversion to galactose-1-phosphate, galactose is subsequently swapped with a glucose moiety from
    UDP-glucose via Gal7p, forming UDP-galactose and glucose-1-phosphate. The glucose-1-phosphate product
    can then be converted to glucose-6-phosphate, a substrate of glycolysis, via phosphoglucomutase (Pgm2p
    or Pgm1p). On the other hand, the UDP-galactose product- which contains carbon from the original galactose
    substrate- can be converted to UDP-glucose via the epimerase activity of Gal10p. The glucose unit
    of this UDP-glucose molecule may then be converted to glucose-6-phosphate during a second round of
    the Leloir pathway. In S. cerevisiae, the genes involved in the Leloir pathway- GAL1, GAL7, and GAL10-
    are transcriptionally regulated in response to galactose by Gal4p, Gal80p, and Gal3p. Gal4p functions
    as a transcriptional activator of GAL genes, whereas Gal80p functions to inhibit this activity by
    binding to Gal4p in the absence of galactose. In the presence of galactose, Gal3p binds to Gal80p
    in an ATP-dependent manner and relieves inhibition of Gal4p, resulting in GAL gene expression. References:
    |CITS:[18779058]||CITS: [8119301]|'
