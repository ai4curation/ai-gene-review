    orf: YGL067W
    symbol: NPY1
    uniprot: UniProtKB:P53164
  comment: 'In some organisms, the metabolism of extracellular nicotinamide adenine dinucleotide (NAD+)
    plays an important role in purine salvage and uptake. In humans, for instance, extracellular NAD+
    generated via cell lysis or other means can be salvaged for adenine through the following steps: 1)
    cleavage of NAD+ to AMP and nicotinamide mononucleotide (NMN) by NAD+ pyrophosphatase, 2) cleavage
    of AMP to release adenosine via 5-nucleotidase, 3) transport of extracellular adenosine into the cell
    via adenosine transporters, and 4) regeneration of adenine nucleotides from adenosine via phosphorylation.
    This process has been implicated human immune cell activation. Extracellular metabolism of NMN, but
    not NAD+, is known to occur in S. cerevisiae. This occurs via Pho5p, the major secreted acid phosphatase
    in yeast. Pho5p catalyzes the conversion of exogenous NMN in the periplasm to nicotinamide riboside
    (NR), a NAD+ precursor that can be imported into the cell and converted back to NAD+ via salvage pathways.
    Deletion of PHO5 prevents growth of a mutant disrupted in the NAD+ biosynthesis pathway on medium
    containing NMN. In addition to Pho5p, two other enzymes are known to play a role in catabolizing extracellular
    nucleotides in S. cerevisiae: the nucleotide pyrophosphatases/phosphodiesterases Npp1p and Npp2p.
    Both yeast enzymes belong to a superfamily of alkaline phosphatases that also includes extracellular
    5-nucleotidases from mammals. References: |CITS: [BOGAN2010]||CITS: [19416965]||CITS: [16278456]|'
  name: periplasmic NAD degradation
