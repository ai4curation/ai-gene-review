YEAST-4AMINOBUTMETAB-PWY:
  all_genes:
  - *id186
  - *id188
  comment: 'The non-protein amino acid gamma-aminobutyrate (GABA) plays an important role in mammalian
    neurotransmission, plant development, and in S.cerevisiae, nitrogen utilization and oxidative stress
    tolerance |CITS: [11031268]|, |CITS:[3888627]|. In yeast, GABA accumulation occurs either through
    permease-mediated uptake by Uga4p, Put4p, and Gap1p, or it is produced intracellularly via glutamate
    degradation by the glutamate decarboxylase Gad1p |CITS: [11031268]|, |CITS: [3888627]|. The presence
    of GABA causes an increase in expression of the genes UGA1 and UGA2, which encode the enzymes responsible
    for degrading GABA into succinate |CITS:[3888627]|. This GABA-induced upregulation is mediated by
    the transcriptional activators Uga3p and Uga35p/Dal81p |CITS:[2653828]|. These transcription factors
    bind to upstream activation sites in the promoters of GABA-regulated genes known as the UAS-GABA |CITS:[12235130]|,
    |CITS: [2653828]|. Levels of UGA2 transcript are also upregulated under conditions of oxidative stress
    |CITS:[11031268]|. S.cerevisiae cells in which GABA degradation is blocked are more sensitive to oxidative
    stress and can no longer grow on GABA as their sole nitrogen source |CITS:[11031268]|, |CITS:[3888627]|.'
