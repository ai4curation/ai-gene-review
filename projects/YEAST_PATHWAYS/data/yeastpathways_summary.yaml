  comment: Chitin, a linear polymer of N-acetyl glucosamine (GlcNAc) residues joined by beta-(1,4) linkages,
    is a minor but essential structural component of fungal cell walls. The majority (90%) of chitin in
    the cell wall is synthesized by chitin synthase III (CSIII), one of the three chitin synthases in
    S. cerevisiae (as reviewed in |CITS:[8257107]|). Each of the three chitin synthases (CSI, CSII, and
    CSIII) are nonessential, but the lack of all three leads to cell lethality (|CITS:[2050738]|). The
    genes encoding the catalytic subunits of CSI, CSII, and CSIII are CHS1, CHS2, and CHS3, respectively.
    Skt5p (Chs4/Cal2/Csd4) has been shown to physically interact with Chs3p, and is indispensable for
    its enzymatic activity in vivo (|CITS:[ 17142567]|). Chitin is deacetylated to form chitosan, a component
    of the yeast spore wall (ascospore).
