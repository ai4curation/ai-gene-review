  comment: 'Biotin (vitamin H) is an essential vitamin for all organisms. It is a cofactor for many carboxylases,
    including those involved in fatty acid biosynthesis, gluconeogenesis, and amino acid metabolism. The
    ability to synthesize biotin varies among strains of S. cerevisiae; many isolates, including the reference
    genome strain S288c, do not encode a complete biotin biosynthesis pathway and are incapable of growth
    in medium lacking biotin. In biotin-producing strains such as A364a, the genes involved in the full
    pathway have been putatively identified as BIO1 through BIO6. Strain S288c retains only BIO2 through
    BIO4 and is a biotin auxotroph; if both BIO1 and BIO6 are expressed in this strain, it regains biotin
    prototrophy. The four steps of the biotin biosynthesis pathway have been elucidated in bacteria. First,
    KAPA synthase catalyzes the decarboxylative condensation of alanine and pimeloyl-CoA to form 7-keto-8-aminopelargonic
    acid (KAPA). Second, KAPA receives an amino group from S-adenosylmethionine via DAPA aminotransferase
    to form 7,8-diaminopelargonic acid (DAPA). Third, dethiobiotin synthetase catalyzes the ATP-dependent
    formation of dethiobiotin from DAPA and CO2. Lastly, biotin synthase inserts a sulfur atom between
    carbons C6 and C9 on dethiobiotin, forming biotin. The enzymes that catalyze these four reactions
    in S. cerevisiae are encoded by BIO6, BIO3, BIO4, and BIO2, respectively. Additionally, the KAPA precursor
    pimeloyl-CoA is presumed to be synthesized in yeast by the putative pimeloyl-CoA synthetase Bio1p.
    References: |CITS: [12658511]||CITS: [18073433]||CITS: [16269718]||CITS: [10333520]||CITS: [8117110]|'
