PWY3O-3:
  all_genes:
  - *id290
  comment: 'Phosphatidylinositol (PI) is an essential myo-inositol-containing phospholipid in all eukaryotes.
    It is the third most abundant phospholipid found in the membranes of S. cerevisiae and a precursor
    to phosphoinositides, inositol polyphosphates, and complex sphingolipids. PI and its metabolites are
    involved in a variety of biological processes including signal transduction, nuclear mRNA export,
    vesicle trafficking, and synthesis of the lipid anchor glycosylphosphatidylinositol. PI is synthesized
    at the endoplasmic reticulum from cytidine diphosphate diacylglycerol (CDP-DAG) and inositol in a
    reaction catalyzed by PI synthase (Pis1p). Synthesis of PI is increased by exogenously supplied inositol
    or zinc depletion. When cells are grown in inositol, PI synthase activity is greatly stimulated while
    phosphatidylserine synthase (Cho1p), which competes with Pis1p for their common substrate, CDP-DAG,
    is inhibited. Under conditions of zinc depletion, the transcription factor Zap1p binds to a zinc-responsive
    cis-acting element (UAS-ZRE) in the PIS1 promoter and increases PI synthase expression. Increased
    PI synthesis through zinc depletion or inositol supplementation leads to reduced CDP-DAG levels as
    well as its precursor, phosphatidic acid (PA). This PA level drop causes the Opi1p repressor to translocate
    to the nucleus, where it subsequently represses the transcription of many UAS-INO-containing phospholipid
    biosynthetic genes. Thus, in addition to its role in the biosynthesis of many important metabolites,
    PI synthesis indirectly contributes to the transcriptional regulation of phospholipid metabolism through
    its effect on intracellular PA level. References: |CITS:[15967713]||CITS: [2002005]||CITS: [9885152]||CITS:
    [22345606]|'
  name: phosphatidylinositol biosynthesis
