  comment: 'The tripeptide glutathione (GSH: L-γ-glutamyl-L-cysteinylglycine) is a prevalent intracellular
    thiol that is able to act as a cellular redox buffer due to its low redox potential (as reviewed in
    |CITS: [12702279]|). GSH is involved in many biological processes including: protein and DNA synthesis;
    amino acid transport; enzyme regulation; protection of cells against reactive oxygen compounds and
    free radicals, xenobiotics and heavy metals (as reviewed in |CITS: [12702279]|). GSH can also be used
    as a source of sulfur and cysteine in |CITS: [1674526], [10514563]|. Plants and animals metabolize
    GSH via the γ-glutamyl cycle. Whether or not this complete cycle exists in yeast and other microorganisms
    is open to debate |CITS: [5076], [JASPERS85]|. The two enzymes catalyzing the synthesis of GSH from
    its constituent amino acids, γ-glutamylcysteine synthetase (Gsh1p) and GSH synthetase (Gsh2p), are
    present in yeast (as reviewed in |CITS: [12702279]|). Yeast was also found to have γ-glutamyl transpeptidase
    (Ecm38p) and cysteinylglycine dipeptidase (CGase) |CITS: [JASPERS85]|, two vacuolar-membrane-bound
    enzymes that are proposed to catalyze the complete hydrolysis of GSH to its constitutive amino acids
    |CITS: [6143574], [11672438]|. Although enzymatic activity for CGase was observed in S. cerevisiae
    |CITS: [JASPERS85]|, the open reading frame for CGase has yet to be identified in S. cerevisiae. The
    presence of the remaining two γ-glutamyl cycle enzymes, γ-glutamyl cyclotransferase and 5-oxoprolinase,
    is still in question |CITS: [5076], [JASPERS85]|, suggesting that yeast may only have a truncated
    γ-glutamyl cycle. S. cerevisiae also has been proposed to have an alternative pathway for degrading
    GSH that involves a novel GSH degradosomal protein complex comprised of the three gene products Dug1p,
    Dug2p, and Dug3p |CITS: [17179087]|.'
  name: superpathway of glutathione metabolism (truncated γ-glutamyl cycle)
