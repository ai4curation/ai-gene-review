  comment: 'Phosphatidic acid (PA) is a central intermediate in the biosynthesis of phospholipids and
    triacylglycerols. In S. cerevisiae, de novo synthesis of PA occurs primarily through two acylation
    pathways: the glycerol-3-phosphate (G3P) pathway and the dihydroxyacetone phosphate (DHAP) pathway.
    In both routes of PA synthesis, G3P and DHAP are converted to lysophosphatidic acid (LPA) and subsequently
    acylated to PA by 1-acyl-sn-G3P acyltransferases (Slc1p, Ale1p, and Loa1p). G3P/DHAP acyltransferases
    (Sct1p and Gpt2p) catalyze the first step in both pathways, acylating G3P to LPA or DHAP to 1-acyl-DHAP.
    Further conversion of 1-acyl-DHAP to LPA occurs via a NADPH-dependent reaction catalyzed by 1-acyl-DHAP
    reductase (Ayr1p). After its formation from LPA, PA can be cleaved to diacylglycerol by phosphatidate
    phosphatases (Pah1p, Dpp1p, Lpp1p, and App1p) for the biosynthesis of triacylglycerols. Alternatively,
    PA can be converted by CDP-DAG synthases (Cds1p and Tam41p) to cytidine diphosphate diacylglycerol
    (CDP-DAG), the precursor to all major phospholipids in S. cerevisiae. The universal route of PA biosynthesis
    is the G3P pathway, which exists in prokaryotes, plants, yeast, and mammalian cells. In contrast,
    the DHAP pathway is present only in yeast and mammals. Aside from these de novo pathways, PA synthesis
    may also occur through alternative routes such as phosphorylation of diacylglycerol by DAG kinase
    (Dgk1p in yeast) and hydrolysis of phosphatidylcholine by phospholipase D (Spo14p in yeast). References:
    |CITS:[24520995]||CITS: [17726007]||CITS: [22090344]||CITS: [10542045]|'
