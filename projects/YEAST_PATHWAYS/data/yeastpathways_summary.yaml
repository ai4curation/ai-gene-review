  comment: 'The mevalonate (MVA) pathway synthesizes the two common precursors to all isoprenoids: isopentenyl
    pyrophosphate (IPP) and its isomer, dimethylallyl pyrophosphate (DMAPP). The MVA pathway exists largely
    in eukaryotes and archaebacteria and is one of two pathways for IPP and DMAPP biosynthesis found in
    nature. The other pathway, the methylerythritol phosphate (MEP) pathway, exists mainly in eubacteria
    and higher plants. Yeasts and other fungi employ the MVA pathway for isoprenoid production. In S.
    cerevisiae, the MVA pathway begins with the condensation of two molecules of acetyl-CoA by acetoacetyl-CoA
    thiolase (Erg10p). This reaction forms acetoacetyl-CoA, which reacts with a third molecule of acetyl-CoA
    via 3-hydroxy-3-methylglutaryl-CoA (HMG-CoA) synthase (Erg13p) to form HMG-CoA. In turn, HMG-CoA is
    converted to mevalonate by HMG-CoA reductase in two NADPH-dependent reduction steps. This reaction
    is catalyzed by two isozymes in S. cerevisiae: Hmg1p and Hmg2p. Depending on culture conditions, Hmg1p
    accounts for around 83% of HMG-CoA reductase activity in wild type cells. After sequential phosphorylation
    of MVA to MVA-5-diphosphate via MVA kinase (Erg12p) and phospho-MVA kinase (Erg8), MVA-5-diphosphate
    is decarboxylated in an ATP-dependent manner by MVA pyrophosphate decarboxylase (Mvd1p) to yield IPP.
    IPP can then go to be isomerized to DMAPP via isopentenyl diphosphate:dimethylallyl diphosphate isomerase
    (Idi1p). The addition of IPP units to DMAPP produces short-chain prenyl diphosphates that serve as
    precursors to many essential metabolites. For example, DMAPP can be sequentially condensed with two
    molecules of IPP to form farnesyl pyrophosphate (FPP). FPP can undergo a long series of conversion
    steps in the sterol biosynthesis pathway to produce ergosterol, an important contributor to membrane
    integrity and the major sterol in S. cerevisiae. In addition to sterols, FPP is a precursor to many
    other primary metabolites including dolichols, ubiquinones, carotenoids, and polyprenols for protein
    prenylation. References: |CITS:[23451776]||CITS: [24520995]||CITS: [3526336]||CITS: [19744247]||CITS:
    [24227704]|'
