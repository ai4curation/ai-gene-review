YEAST-SALV-PYRMID-DNTP:
  all_genes:
  - *id544
  - *id413
  - *id543
  comment: 'The deoxynucleotides required for DNA synthesis can either be made de novo, or they can be
    salvaged from endogenous degradation processes |CITS: 10501935||CITS: 2189783|. If the required substrates
    are available, the salvage pathways of pyrimidine deoxyribonucleotides are preferred over de novo
    synthesis pathways for pyrimidine biosynthesis |CITS:12111094|. As with many of the metabolic pathways
    of S. cerevisiae, the pathways for the salvage of pyrimidine deoxyribonucleotides are regulated by
    a variety of processes, including transcription regulation |CITS: 11292850||CITS: 12570998|. Saccharomyces
    cerevisiae contains three enzymes (Urk1p, Urh1p, and Cdd1p) that are able to salvage deoxycytidine
    in vitro |CITS: 12111094|. However of these three enzymes, only Urk1p and Urh1p have been shown to
    metabolize deoxycytidine in vivo |CITS: 12111094|. In vitro Cdd1p has been shown to deaminate deoxycytidine
    to form deoxyuridine, however the biological significance of this is doubtful |CITS:10501935||CITS:12111094|.
    Evidence that Cdd1p is not important for deoxypyrimidine salvage comes from the observation that fyc1
    urh1 urk1 triple mutants are resistant to 5-fluorodeoxycytidine, indicating that these cells are not
    able to metabolize deoxycytidine |CITS:12111094|. Also deoxyuridine does not allow growth of ura-
    strains, indicating that deoxyuridine cannot be utilized as a sole source of pyrimidines in S. cerevisiae
    |CITS:12111094|.'
