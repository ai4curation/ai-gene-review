  comment: 'The polyol glycerol has several biological roles in yeast. In carbon metabolism, glycerol
    is a major byproduct of ethanol fermentation and can be used as a sole source of carbon under aerobic
    conditions. In osmoregulation, glycerol acts as a key osmolyte during hyperosmotic stress and is the
    primary compatible solute in S. cerevisiae. Biosynthesis of glycerol, as a NADH-consuming process,
    also plays an important role in maintaining cytosolic redox balance during anaerobic conditions by
    oxidizing excess NADH to NAD. Consistent with these functions, S. cerevisiae cells defective in glycerol
    biosynthesis are sensitive to osmotic stress and do not exhibit anaerobic growth. Glycerol is produced
    from the reduction of dihydroxyacetone phosphate via glycerol-3-phosphate dehydrogenase, consuming
    NADH and forming glycerol-3-phosphate. In S. cerevisiae, glycerol-3-phosphate dehydrogenase is encoded
    by both GPD1 and GPD2. GPD1 is induced by osmotic stress and is thought to play a role in osmoregulation,
    while GPD2 is induced under anaerobic conditions and may be involved in redox balancing. Glycerol-3-phosphate
    is subsequently dephosphorylated by glycerol-3-phosphatase, producing glycerol. There are two genes
    encoding for glycerol-3-phosphatase in S. cerevisiae: GPP1, which is constitutively expressed, and
    GPP2, which is induced during hyperosmotic stress. References: |CITS:[9451815]||CITS: [10978547]||CITS:[8196651]||CITS:
    [9171333]||CITS: [8662716]|'
  name: glycerol biosynthesis
