  comment: 'Under aerobic conditions, S. cerevisiae is able to utilize glycerol as a sole carbon and energy
    source. Glycerol degradation is a two-step process; the first step of glycerol phosphorylation occurs
    in the cytosol, then glycerol-3-phosphate enters the motichondrion where the second step of conversion
    to dihydroxyacetone is catalyzed |CITS:[191434]|. Dihydroxyacetone is then returned to the cytosol
    where it enters into either glycolysis or gluconeogenesis. The genes encoding the enzymes catalyzing
    glycerol catabolism, GUT1 and GUT2, are carbon source regulated; gene expression is repressed when
    cells are grown on fermentable carbon sources such as glucose and upregulated on non-fermentable carbon
    sources such as glycerol or ethanol |CITS:[191434]|, |CITS:[10536147]|, |CITS:[11142398]|. On non-fermentable
    carbon sources, GUT1 transcription is induced by the transcriptional activators Adr1p, Ino2p and Ino4p
    |CITS:[10536147]|, while GUT2 regulation requires the protein kinase Snf1p and the transcriptional
    activating Hap2p/Hap3p/Hap4p/Hap5p complex |CITS:[11142398]|. Conversely, the negative regulator Opi1p
    facilitates GUT1 and GUT2 repression |CITS:[10536147]|, |CITS:[11142398]|. '
  name: glycerol degradation
  pmids:
