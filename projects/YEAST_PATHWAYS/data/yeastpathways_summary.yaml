  comment: 'Purine and pyrimidine nucleotides serve many diverse and essential roles in the cell. They
    are precursors to DNA, RNA, and many important metabolites (e.g. CDP-diacylglycerol). In addition,
    nucleotides can be used as an energy source (primarily as ATP), signaling molecules, and cofactor
    components (e.g. coenzyme A). In S. cerevisiae, the initial steps of de novo pyrimidine biosynthesis
    are catalyzed by the bifunctional carbamoylphosphate synthetase/aspartate transcarbamylase Ura2p.
    In the first step, Ura2p catalyzes the synthesis of carbamoylphosphate from CO2, ATP, and glutamine.
    In the second, Ura2p condenses carbamoylphosphate with aspartate to yield ureidosuccinate/carbamoyl-L-aspartate.
    Third, dihydroorotase (Ura4p) catalyzes closure of the pyrimidine ring of ureidosuccinate to form
    dihydroorotate (DHO). DHO, in turn, is oxidized to orotic acid (OA), condensed with phosphoribosyl
    pyrophosphate to form orotidine 5-monophosphate, and finally decarboxylated to yield UMP. These three
    steps are catalyzed by Ura1p, Ura5p/Ura10p, and Ura3p, respectively. UMP may then undergo further
    processing to form other pyrimidines. The de novo pyrimidine pathway is regulated at both the enzymatic
    and transcriptional levels. Ura2p, which catalyzes the first committed step of the pathway, is subject
    to end product feedback inhibition by UTP. Transcription of URA2 is repressed by UTP and uracil. Furthermore,
    transcription of URA2 and several other genes in the pathway is upregulated in response to pyrimidine
    starvation. Upregulation of URA1, URA3, and URA4 during pyrimidine starvation depends upon the zinc
    finger transcription factor Ppr1p. Two intermediates in the pyrimidine pathway regulate the transcriptional
    activity of Ppr1p: DHO and OA. At low concentrations, these intermediates convert Ppr1p into its active
    state, resulting in transcription of URA genes. High concentrations of DHO and OA, however, inhibit
    Ppr1p activity in vitro. References: |CITS:[22419079]||CITS: [(JONES]||CITS: [2283036]||CITS: [9858611]|'
  name: de novo biosynthesis of pyrimidine ribonucleotides
  pmids:
