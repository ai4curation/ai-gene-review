PWY-3322:
  all_genes:
  - &id319
    orf: YDL215C
    symbol: GDH2
    uniprot: UniProtKB:P33327
  comment: 'In S. cerevisiae cells, the amino group of glutamate and the amide group of glutamine are
    the source of nitrogen for all other macromolecules |CITS: [1975578]|. In order to provide ammonia
    for the synthesis of glutamine during growth on glutamate-yielding nitrogen sources, cells degrade
    glutamate into ammonia. The main pathway for S. cerevisiae glutamate degradation is catalyzed by the
    NAD dependent glutamate dehydrogenase encoded by GDH2 |CITS:[1975578]|. Transcriptional regulation
    of GDH2 is dependent upon six different sequence elements present in the promoter |CITS:[1682801]|.
    Two elements behave as upstream activation sites (UAS) while the remaining four sites inhibit the
    effects of the two UASs |CITS: [1652057]|. One UAS has been shown to activate transcription during
    growth on nonfermentable carbon sources or on limiting amounts of glucose |CITS:[1652057]|. The other
    UAS is under the control of nitrogen catabolite repression (NCR) |CITS: [4394512]|. Under nitrogen-poor
    conditions, GDH2 expression is upregulated by the transcriptional activator Gln3p and the co-activator
    Hfi1p |CITS:[1990286]|, |CITS:[8416910]|, |CITS:[10048020]|. Conversely, in the presence of an optimal
    nitrogen source such as glutamine, GDH2 transcription is repressed by the transcription factor Ure2p
    |CITS:[1990286]|. Unrelated to NCR, GDH2 gene expression is regulated by ammonia concentrations. An
    increase in intracellular ammonia leads to a decrease in GDH2 expression |CITS:[12851403]| but an
    increase in extracellular ammonia leads to an increase in GDH2 transcription and Gdh2p activity |CITS:[7592450]|.
    Gdh2p enzyme activity also appears to be regulated by phosphorylation through cAMP-dependent and cAMP-independent
    protein kinases and subsequent proteolysis |CITS:[6319381]|, |CITS:[7009211]|. '
  name: glutamate degradation IX
  pmids:
