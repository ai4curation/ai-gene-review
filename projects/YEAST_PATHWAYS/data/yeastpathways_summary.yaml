  comment: 'S. cerevisiae, as a Crabtree-positive yeast, predominantly ferments pyruvate to ethanol in
    high glucose conditions. When glucose or other preferred carbon sources are depleted, S. cerevisiae
    switches to aerobic respiration and utilizes ethanol as carbon source instead, a phenomenon known
    as diauxic shift. Ethanol degradation is a three-step pathway that begins with the oxidation of ethanol
    to acetaldehyde by alcohol dehydrogenase (ADH). Aldehyde dehydrogenase (ALD) then converts acetaldehyde
    to acetate, which acetyl-CoA synthetase (ACS) subsequently ligates with coenzyme A to produce acetyl-CoA.
    Alcohol and aldehyde dehydrogenase each have several isozymes in S. cerevisiae. Of the alcohol dehydrogenases
    involved in catalyzing interconversion between ethanol and acetaldehyde, the cytosolic enzyme Adh2p
    is thought to preferentially catalyze ethanol oxidation to acetaldehyde due to its relatively low
    Km for ethanol. ADH2 is glucose-repressed and activated by Cat8p and Adr1p. The oxidation of acetaldehyde
    to acetate is catalyzed by both cytosolic and mitochondrial aldehyde dehydrogenase, of which the main
    isoforms (Ald6p and Ald4p, respectively) are important for growth on ethanol. References: |CITS:[9123965]||CITS:
    [20863251]||CITS: [25326522]||CITS: [18479436]||CITS: [15864308]||CITS: [11495982]||CITS: [9392076]||CITS:
    [9675847]|'
