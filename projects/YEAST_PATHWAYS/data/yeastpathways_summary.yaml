  comment: 'In S. cerevisiae, the main pathway for glutamate degradation is catalyzed by the glutamate
    dehydrogenase encoded by GDH2 |CITS: [1975578]|. However, glutamate can also by degraded into gamma-aminobutyrate
    (GABA) by the glutamate decarboxylase Gad1p and then converted into succinate by the enzymes encoded
    by UGA1 and UGA2 |CITS: [11031268]|. Glutamate degradation by this pathway and expression of its genes
    have been shown to be important for oxidative stress tolerance. Conditions of oxidative stress elevate
    the transcript levels of GAD1 and UGA2 |CITS: [11031268]|. UGA1 and UGA2 expression is also upregulated
    in the presence of GABA which is mediated by the transcriptional activators Uga3p and Uga35p/Dal81p
    |CITS: [3888627]|, |CITS:[2653828]|. These transcription factors bind to upstream activation sites
    in the promoters of GABA-regulated genes known as the UAS-GABA |CITS: [12235130]|, |CITS:[2653838]|.
    Regulation of Gad1p is suggested to be linked to calcium levels as the protein is able to bind calmodulin
    |CITS:[11031268]|. S. cerevisiae cells in which this pathway is blocked are more sensitive to oxidative
    stress and can no longer grow on GABA as their sole nitrogen source |CITS: [11031268]|, |CITS: [3888627]|].'
  name: glutamate degradation I
  pmids:
