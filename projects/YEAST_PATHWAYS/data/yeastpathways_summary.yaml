  comment: 'Aspartate, inorganic sulfur, and a methyl group from one-carbon metabolism can be used by
    S. cerevisiae cells to synthesize methionine de novo. Here, the four-carbon chain of methionine comes
    from aspartate, which undergoes a three-step conversion to homoserine followed by acetylation to O-acetylhomoserine.
    The sulfur of methionine is acquired from inorganic sulfate, which is reduced to sulfide via the sulfate
    assimilation pathway and incorporated into the carbon chain of O-acetyl-L-homoserine to form homocysteine.
    To synthesize methionine, homocysteine receives a methyl group from 5-methyltetrahydrofolate (5-methyl-THF)
    in a reaction catalyzed by methionine synthase (Met6p). 5-methyl-THF is a folate coenzyme that exists
    in both monoglutamated and polyglutamated forms, however only the latter can be used by Met6p as the
    methyl donor for this reaction. In addition to inorganic sulfur, cysteine can also be used as a sulfur
    source for methionine biosynthesis in S. cerevisiae. This occurs through the transsulfuration pathway,
    where cysteine reacts with O-acetylhomoserine to form cystathionine. Cleavage of cystathionine produces
    homocysteine, which can undergo conversion to methionine or reverse-transsulfuration to regenerate
    cysteine. The transsulfuration pathway enables S. cerevisiae to exchange sulfur between methionine,
    homocysteine, and cysteine. References: |CITS:[9409150]||CITS: [16700064]|'
  name: superpathway of methionine biosynthesis
