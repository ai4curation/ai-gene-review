  comment: 'Tetrapyrroles, such as heme, siroheme, chlorophyll, and cobalamin (vitamin B12) function as
    cofactors in a variety of essential biological processes. Tetrapyrroles are comprised of four pyrrole
    rings linked together by single-carbon bridges in a linear or cyclic fashion. The cyclic tetrapyrroles
    heme and siroheme contain an iron-atom coordinated in their central cavity and function in respiration
    and sulfur assimilation, respectively. Saccharomyces cerevisiae synthesize heme and siroheme de novo
    via a common pathway up to the intermediate uroporphyrinogen III; oxidative decarboxylation of uroporphyrinogen
    III leads to the synthesis of heme while its methylation leads to siroheme synthesis. The first committed
    precursor in the biosynthesis of tetrapyrroles is the 5-carbon compound 5-aminolevulinic acid (ALA)
    |CITS: [2077690]|. Animals, fungi, apicomplexan protozoa (such as the malaria parasite Plasmodium
    falciparum) and photosynthetic bacteria, synthesize ALA from succinyl CoA and glycine |CITS: [2789025][15144063]|,
    while higher plants and other bacteria (including Escherichia coli) synthesize ALA from glutamate
    |CITS: [2789025][2077690]|. In Saccharomyces cerevisiae, HEM1 encodes for ALA synthase, the enzyme
    catalyzing the first committed step in the biosynthesis of tetrapyrroles |CITS: [6381051]|. Pyridoxal
    5''-phosphate is an essential factor for Hem1p |CITS: [6381051]|. The second step, the condensation
    of ALA to form the pyrrole porphobilinogen, is catalyzed by ALA dehydratase (also known as porphobilinogen
    synthase; EC 4.2.1.24), a homo-octameric enzyme encoded by HEM2 |CITS: [2204246]|. Hem3p and Hem4p
    catalyze the third and fourth steps, respectively. HEM3 encodes for porphobilinogen deaminase (also
    known as hydroxymethylbilane synthase; EC 2.5.1.61), the enzyme catalyzing the condensation of four
    molecules of 4-porphobilinogen to form the linear tetrapyrrole hydroxymethylbilane |CITS: [1508149]|,
    and HEM4 encodes for uroporphyrinogen III synthase (UROS; EC 4.2.1.75), the enzyme catalyzing the
    cyclization of hydroxymethylbilane and rearrangement of the fourth pyrrole to form the important intermediate
    uroporphyrinogen III |CITS: [7597845]|. In the absence of UROS, the linear tetrapyrrole hydroxymethylbilane
    undergoes non-enzymatic cyclization without rearrangement of the fourth pyrrole ring to form uroporphyrinogen
    I, which is not an intermediate in the synthesis of biological tetrapyrroles. Uroporphyrinogen III
    is a major branch point intermediate leading to biosynthesis of different tetrapyrrole-derived compounds,
    such as siroheme, heme, cobalamin (vitamin B12), and the methanogenic coenzyme F430 |CITS: [2077690]|.
    S. cerevisiae is not believed to synthesize cobalamin de novo |CITS: [9003798][10051442]|. '
