  comment: 'Under conditions where optimal sources of nitrogen are unavailable, S. cerevisiae is able
    to utilize arginine as its sole nitrogen source. Arginine catabolism begins in the cytosol with the
    hydrolysis of arginine to proline |CITS:[14263163]|, |CITS: [1592829]|. Under aerobic condition, the
    arginine and proline degradation pathways converge; resulting in the conversion of proline to L-glutamate
    in the mitochondria |CITS: [6997271]|. The utilization of arginine as nitrogen source is repressed
    if better nitrogen compounds such as ammonia, asparagine or glutamine are present. This is known as
    nitrogen catabolite repression (NCR) |CITS:[10640599]|. The CAR1, PUT1 and PUT2 genes are subject
    to the effect of this repression which is mediated by the negative regulator Ure2p |CITS:[8622686]|,
    |CITS: [7891726]|. In the presence of arginine and the absence of a preferred nitrogen sources, NCR
    is released by the GATA transcriptional activators Gln3p and Gat1p |CITS: [7568152]|, |CITS: [8816501]|,
    |CITS:[12796300]|. The genes encoding the arginine degradation enzymes are also regulated by factors
    not involved in NCR. The CAR genes are activated by the globally acting transcription factors Rap1p
    and Abf1p |CITS: [10559172]|, |CITS: [8816501]| and repressed by the Ume6p-Sin2p-Rpd3p complex |CITS:
    [10809695]|. The presence of arginine induces CAR1 and CAR2 expression by the regulators Arg80p, Arg81p,
    and Mcm1p |CITS:[9065690]|, |CITS:[11119723]|. Similarly, the presence of proline leads to the upregulation
    of the proline degradation enzymes PUT1 and PUT2 by the transcription factor Put3p |CITS: [10629046]|.
    Also unrelated to NCR, CAR2 expression is induced by allophanate, a degradation product of urea, as
    well as the two positive regulators Dal181p, Dal82p |CITS:[10559172]|. '
