  comment: 'Purine and pyrimidine nucleotides serve many diverse and essential roles in the cell. They
    are precursors to DNA, RNA, and many important metabolites (e.g. CDP-diacylglycerol). In addition,
    nucleotides can be used as an energy source (primarily as ATP), signaling molecules, and cofactor
    components (e.g. coenzyme A). In yeast and most eukaryotes, purine nucleotides levels are maintained
    via a combination of de novo synthesis and salvage pathways. The salvage pathways utilize purine bases
    and nucleosides taken up from the environment or formed from metabolism to synthesize purine nucleoside
    monophosphates. Compared to the de novo pathway, where 5-phosphoribosyl-1-pyrophosphate (PRPP) is
    converted to the adenylic/guanylic nucleotide precursor inosine 5-monophosphate (IMP) over many ATP-consuming
    steps, the salvage pathways synthesize IMP, GMP, and AMP directly from PRPP and a purine base via
    the action of purine phosphoribosyltransferases. When purines are abundant in the growth medium, the
    salvage pathways are the preferred routes of purine nucleotide synthesis. In S. cerevisiae, most of
    the ADE genes responsible for de novo synthesis of IMP and AMP are repressed in response to extracellular
    adenine, whereas extracellular guanine strongly represses the IMD genes responsible for the rate-limiting
    step of GMP synthesis. Adenine limitation, on the other hand, results in derepression of ADE genes
    and active de novo purine biosynthesis. Adenine-repressible transcriptional activation of ADE genes
    is mediated by the transcription factors Bas1p and Pho2p. References: |CITS:[22419079]||CITS: [17052198]||CITS:
    [(JONES)]||CITS: [1495962]||CITS: [9822821]|'
