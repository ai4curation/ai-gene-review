  comment: 'Glycogen, a branched polymer of glucose, is a storage molecule whose accumulation is under
    rigorous control in many cells |CITS:11152943|. Glycogen metabolism increases in response to a wide
    variety of environmental stresses, including heat stress or exposure to sodium chloride, hydrogen
    peroxide, copper sulfate, high levels of ethanol, or weak organic acids, such as sorbate or benzoate
    |CITS:11152943|. Glycogen metabolism also increases in response to conditions of nutrient starvation,
    such as limited nitrogen, carbon, phosphorous, or sulfur, and during diauxic growth on glucose |CITS:11152943|.
    In Saccharomyces cerevisiae, glycogen biosynthesis involves three processes: nucleation, elongation,
    and branching (also known as ramification) |CITS:11152943|. The formation of glycogen begins when
    either Glg1p or Glg2p uses UDP-glucose to self-glucosylate to produce a short alpha (1,4)-glucosyl
    chain covalently attached to one of their internal tyrosine residues |CITS:8900126|. After the self-glucosylation
    of Glg1p or Glg2p, glycogen synthase is able to extend the linear alpha (1,4)-glucosyl chains of glycogen
    by catalyzing the formation of alpha (1,4)-glucosidic bonds from UDP- glucose at the non-reducing
    ends |CITS:1908457|. Branches can be added into the glycogen molecule by Glc3p, which is the glycogen
    branching enzyme (EC:2.4.1.18) in S. cerevisiae |CITS:1634552|. No enzyme that releases the glycogen
    chain from Glg1p or Glg2p has been identified |CITS:11152943|. Thus far, none of the phenotypes seen
    in S. cerevisiae glycogen catabolism mutants correspond to the mammalian glycogen storage diseases
    associated with mutations in human genes involved in glycogen metabolism |CITS:11152943|.'
  name: glycogen biosynthesis
