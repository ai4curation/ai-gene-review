  comment: 'The first committed step of riboflavin biosynthesis in S. cerevisiae is the conversion of
    GTP to 2,5-diamino-6-(ribosylamino)-4-(3H)-pyrimidinone 5-phosphate (DRAP) via GTP cyclohydrolase
    II (Rib1p). DRAP is then converted to 5-amino-6-ribitylamino-2,4-(1H,3H)-pyrimidinedione 5-phosphate
    in two steps: reduction of the ribosyl side chain of DRAP by Rib7p, followed by deamination of the
    pyrimidine ring via Rib2p. These two steps occur in the reverse order relative to the riboflavin synthesis
    pathway in bacteria, where deamination of DRAP precedes reduction. The product of the Rib2p reaction
    is then dephosphorylated and condensed via lumazine synthase (Rib4p) with 4-dihydroxy-2-butanone-4-phosphate,
    a metabolite of ribulose-5-phosphate. This condensation reaction results in the formation of 6,7-dimethyl-8-(1-D-ribityl)-lumazine.
    In the final step of the pathway, one molecule of 6,7-dimethyl-8-(1-D-ribityl)-lumazine donates a
    four-carbon moiety to a second molecule via riboflavin synthase (Rib5p), transforming the xylene ring
    of 6,7-dimethyl-8-(1-D-ribityl)-lumazine into the isoalloxazine ring of riboflavin. Riboflavin may
    then go on to be phosphorylated by riboflavin kinase (Fmn1p) to form FMN, and FMN itself can be converted
    to FAD via FAD synthetase (Fad1p). References: |CITS:[24373875]||CITS: [7814407]|'
