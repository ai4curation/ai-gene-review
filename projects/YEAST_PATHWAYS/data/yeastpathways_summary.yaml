PROUT-PWY:
  all_genes:
  - *id046
  comment: 'Although proline is the least-preferred nitrogen source for many lab strains of S. cerevisiae,
    it is the most abundant source of nitrogen in grapes, the natural environment of wild yeast |CITS:
    [10629046]|. When other sources of nitrogen like ammonia, asparagine or glutamine are unavailabe,
    S. cerevisiae degrade proline into glutmate via the proline utilization pathway in the mitochondria
    |CITS:[387737]|, |CITS:[387738]|. This degradation is catalyzed by proline oxidase and delta 1-pyrroline-5-carboxylate
    dehydrogenase, which are encoded by the nuclear genes PUT1 and PUT2 respectively |CITS: [3537723]|,
    |CITS: [ 6358862]|. Both PUT1 and PUT2 are positively regulated by the transcriptional activator Put3p
    |CITS:[14517252]|. Although Put3p is bound constitutively to the promoters of PUT1 and PUT2, transcriptional
    upregulation only occurs in the presense of proline and absence of a preferred nitrogen source |CITS:[10629046]|,
    |CITS:[1986247]|. PUT1 is also positively regulated by the GATA factors Gln3p and Nil1p/Gat1p |CITS:
    [7891726]|, |CITS:[12796300]|. The presence of a good nitrogen source, such as ammonia or glutamine,
    supresses the proline utilization pathway-an effect known as nitrogen catabolite repression (NCR)
    |CITS: [10640599]|. The transcription factors responsible for PUT1 and PUT2 repression by NCR are
    Ure2p, Dal80p, and Nil2p |CITS:[8416910]|, |CITS:[9171427]|.'
