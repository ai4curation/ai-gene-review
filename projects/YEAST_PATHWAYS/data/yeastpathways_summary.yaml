  comment: Inositol phosphates (IPs) are an important class of signaling molecules that regulate cellular
    processes such as transcription, mRNA export, DNA repair, chromatin remodeling, glucose-induced calcium
    signaling, telomere elongation, vacuolar biogenesis, the stress response, cell wall synthesis and
    phosphate homeostasis (reviewed in |CITS:[16781889]| and |CITS:[16429326]|). The water-soluble IPs
    are derived from the lipid, phosphatidylinositol 4,5-bisphosphate (PIP2, PI(4,5)P2, PtdIns 4,5-P2).
    Plc1p hydrolyses PIP2 to inositol 1,4,5-trisphosphate (IP3) and diacylglycerol, releasing IP3 from
    the membrane |CITS:[8395015]|. IP3 is then sequentially phosphorylated to inositol tetrakisphosphate
    (IP4) and inositol pentakisphosphate (IP5) by the inositol polyphosphate multikinase (IPMK) Arg82p
    |CITS:[10720331][11311242][10683435]| and reviewed in |CITS:[16781889]|. IP5 is further phosphorylated
    to inositol hexakisphosphate (IP6, phytate) by Ipk1p or to the inositol pyrophosphate diphosphoinositol
    tetrakisphosphate (PP-IP4) by Arg82p or Kcs1p |CITS:[10960485][10827188][11311242]| and reviewed in
    |CITS:[16781889]|. The fully phosphorylated ring of IP6 is further phosphorylated to the inositol
    pyrophosphates diphosphoinositol pentakisphosphate (PP-IP5, IP7) and bis-diphosphoinositol tetrakisphosphate
    (2[PP]-IP4, [PP]2-IP4, IP8) |CITS:[17412958][11956213][10574768]| reviewed in |CITS:[16781889]| and
    |CITS:[16429326]|. Two different forms of PP-IP5 have been identified, 5-PP-IP7 synthesized by Kcs1p
    and 4- or 6-PP-IP7 synthesized by Vip1p (the exact phosphorylation position has yet to be determined)
    |CITS:[17412958]|. Kcs1p and Vip1p are believed to work in concert to form [PP]2-IP4; the PP-IP5 product
    produced by one enzyme is converted to [PP]2-IP4 by the other enzyme |CITS:[17412958]|. [PP]2-IP4
    was shown to be dephosphorylated to PP-IP5 and PP-IP5 to IP6 by the phosphatase Ddp1p, but the particular
    isomer(s) are not yet known |CITS:[10419486]|.
