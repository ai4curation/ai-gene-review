  comment: 'The electron transport chain is the final step of the respiratory pathway, carried out by
    several large multisubunit enzyme complexes embedded in the mitochondrial inner membrane. The net
    effect of the electron transport chain is to transfer electrons from NADH to molecular oxygen, coupled
    to transport of protons across the mitochondrial inner membrane. The proton transport creates an electrochemical
    gradient across the membrane, which is then used to power ATP synthesis by the mitochondrial inner
    membrane F1F0 ATP synthase as well as transport of metabolites across the membrane |CITS: [11245784]|.
    NADH:ubiquinone oxidoreductase (NADH dehdrogenase) catalyzes the oxidation of NADH by ubiquinone,
    generating ubiquinol and NAD+ |CITS: [11245784][1900238]|. In Saccharomyces cerevisiae, Candida glabata
    and Schizosaccharomyces pombe, a single-subunit enzyme provides this activity (Ndi1p in S. cerevisiae).
    In many other fungi, mammals, insects, and plants, this activity resides in a multisubunit complex,
    Complex I, which transports a proton across the mitochondrial inner membrane concomitantly with NADH
    oxidation |CITS: [11245784]|. The succinate dehydrogenase complex (Complex II) catalyzes the oxidation
    of succinate by ubiquinone to fumarate, generating ubiquinol and fumarate. This reaction does not
    result in transfer of a proton across the mitochondrial inner membrane. In S. cerevisiae the complex
    is composed of the flavoprotein subunit Sdh1p, the iron-sulfur protein subunit Sdh2p, the cytochrome
    b subunit Sdh3p, and the membrane anchor subunit Sdh4p |CITS: [14672929]|. The ubiquinol generated
    by NADH dehydrogenase and Complex II is oxidized to ubiquinone by ubiquinol-cytochrome-c reductase
    (Complex III; cytochrome bc1 complex) in a stepwise electron transfer through the complex that results
    in the reduction of cytochrome c and the transfer of a proton across the mitochondrial membrane |CITS:
    [12788490]|. The cytochrome c that is reduced in this step is the product of the CYC1 gene. The final
    step in the electron transport chain is catalyzed by Complex IV, cytochrome c oxidase, which oxidizes
    cytochrome c while reducing oxygen to water with the concomitant transport of a proton across the
    mitochondrial inner membrane |CITS: [1665335][7851399]|.'
