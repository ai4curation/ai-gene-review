  comment: 'Alanine is an essential component of protein (as L-alpha-alanine). alt1 null mutations demonstrated
    that under respiratory conditions, the alanine aminotransferase encoded by ALT1 plays a central role
    in arginine biosynthesis and degradation in Saccharomyces cerevisiae |CITS: [19396236]|. Under fermentative
    conditions, Saccharomyces cerevisiae appears to synthesize alanine by an alternative pathway that
    is independent of Alt1p, but it degrades alanine by the same Alt1p-dependent pathway as used during
