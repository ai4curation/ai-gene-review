  comment: 'Mannose is a fermentable six-carbon monosaccharide that can be utilized for carbon and energy
    in S. cerevisiae. It is also required for many important mannosylation reactions in the cell, including
    those involved in N-linked and O-linked glycosylation of proteins and synthesis of the lipid anchor
    glycosylphosphatidylinositol. In S. cerevisiae, utilization of mannose begins with its phosphorylation
    to mannose-6-phosphate (M6P) by hexokinase (Hxk1p or Hxk2p) or glucokinase (Glk1p). Although all three
    proteins can phosphorylate mannose, only HXK2 is highly expressed when yeast cells are grown on mannose
    as a carbon source. M6P can either be converted to GDP-mannose to support mannosylation reactions
    in the cell, or converted to fructose-6-phosphate (F6P) to fuel glycolysis. The conversion of M6P
    to F6P is reversible and catalyzed in both directions by mannose-6-phosphate isomerase (Pmi40p). When
    yeast cells are grown on mannose as the sole carbon source, PMI40 transcription increases 12-fold,
    likely in order to provide sufficient levels of F6P for glycolysis. In the absence of mannose, Pmi40p
    activity becomes is essential for growth, as it enables S. cerevisiae to synthesize M6P from glucose
    or other carbon sources of F6P. References: |CITS:[9878752]||CITS: [17361015]||CITS: [8403984]||CITS:
    [7732723]||CITS: [1377774]|'
  name: mannose degradation
