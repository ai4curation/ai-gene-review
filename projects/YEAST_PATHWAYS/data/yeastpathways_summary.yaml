  comment: 'Methylglyoxal is toxic compound that is formed as a by-product of glycolysis from triose phosphates
    through the action of triose-phosphate isomerase. One route by which methylglyoxal can be catabolized
    is a glyoxalase system in which methylglyoxal is condensed with glutathione to give S-D-lactoylglutathione
    by the action of glyoxalase I (GLO1) |CITS: [8824231]|, and the glutathione thiolester is then hydrolyzed
    to lactic acid and glutathione by glyoxalase II (GLO2 and GLO4) |CITS: [9261170]|. The GLO2 gene is
    expressed on both glucose and glycerol and the active Glo2p protein is localized in the cytoplasm.
    The GLO4 gene is only active on glycerol and the active Glo4p is localized in the mitochondrial matrix
    |CITS: [9261170]|. Deletion of either GLO1 or GLO2 and GLO4 results in increased sensitivity to exogenous
    methylglyoxal |CITS: [8824231]||CITS: [9261170]|.'
