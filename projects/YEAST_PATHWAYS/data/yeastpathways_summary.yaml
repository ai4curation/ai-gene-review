  comment: 'Deoxyribonucleoside triphosphates (dNTPs) are the monomeric building blocks of DNA. In all
    cellular organisms, synthesis of the four canonical dNTPs (dATP, dGTP, dCTP, dTTP) required for DNA
    replication and repair involves the action of ribonucleotide reductase, which converts ribonucleotides
    to their corresponding deoxy- forms by substituting their 2-hydroxyl group with a hydrogen atom. S.
    cerevisiae contains a class Ia RNR that is composed of two large and two small subunits. RNR2 and
    RNR4 encode the small subunits, while the large subunits are encoded by either RNR1 (major isoform)
    or RNR3 (minor isoform). Budding yeast RNR accepts ribonucleoside diphosphates (e.g. ADP, UDP) as
    substrate and converts them to their corresponding deoxy- forms (e.g. dADP, dUDP). These dNDPs can
    then be phosphorylated by NDP kinase (Ynk1p) to yield dNTPs. In contrast to the class I RNRs in yeast
    and other eukaryotes, class II and class III RNRs found in archaea and many bacteria can produce dNTPs
    directly by using NTPs as substrates. In S. cerevisiae, the only dNDP that cannot be synthesized directly
    by RNR is dTDP. Synthesis of thymine-containing nucleotides requires dUMP, which can be formed via
    the removal of pyrophosphate from dUTP by dUTP pyrophosphatase (Dut1p). dTMP is synthesized from dUMP
    when the latter molecule receives a methyl group from 5,10-methylene-tetrahydrofolate via thymidylate
    synthase (Cdc21p). The subsequent phosphorylation of dTMP by thymidylate kinase (Cdc8p) yields dTDP,
    which can be phosphorylated once more by Ynk1p to yield the end product dTTP. References: |CITS:[16756507]||CITS:
    [9759483]||CITS: [1659321]||CITS: [8223452]||CITS: [6287238]||CITS: [6088527]|'
