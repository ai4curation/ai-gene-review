  comment: 'In eukaryotes, metabolism is compartmented and does not occur homogenously throughout the
    cell. As a consequence, membrane-impermeable metabolites produced in one cellular compartment often
    cannot support biochemical pathways in another compartment unless they are transferred to the site
    of action. Several mechanisms exist in eukaryotes for the translocation of acetyl-coenzyme A (acetyl-CoA)
    between cellular compartments. The carnitine shuttle, which uses carnitine to carry activated acetyl
    from coenzyme A across intracellular membranes, is one such example. In S. cerevisiae, acetyl-CoA
    can be generated in the peroxisome via fatty acid -oxidation and in the cytoplasm via degradation
    of non-fermentable carbon sources. The carnitine shuttle plays an important role in transporting the
    activated acetyl generated from these processes into mitochondria for further metabolism in the TCA
    cycle. The carnitine shuttle begins with the transfer of an acetyl group from acetyl-CoA to carnitine
    via carnitine acetyltransferase (CAT), forming acetyl-carnitine. There are several CATs in S. cerevisiae:
    Cat2p, localized in peroxisomes and mitochondria; Yat1p, localized on the outer mitochondrial membrane;
    and Yat2p, localized in the cytosol. After its formation, acetyl-carnitine is transported into the
    mitochondrion via carnitine acylcarnitine translocase (Crc1p). Mitochondrial CAT (Cat2p) then catalyzes
    the reverse transfer of the acetyl group from acetyl-carnitine to coenzyme A, regenerating acetyl-CoA
    and carnitine inside the mitochondrion. References: |CITS:[20889721]||CITS: [18427809]||CITS: [11329169]|'
  name: carnitine shuttle
  pmids:
