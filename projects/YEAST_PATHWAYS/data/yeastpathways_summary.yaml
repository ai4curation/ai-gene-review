CYSTEINE-SYN2-PWY:
  all_genes:
  - &id084
    orf: YAL012W
    symbol: CYS3
    uniprot: UniProtKB:P31373
  - &id085
    orf: YGR155W
    symbol: CYS4
    uniprot: UniProtKB:P32582
  comment: 'Cysteine is a proteinogenic amino acid and sulfur source in S. cerevisiae. As a thiol-containing
    amino acid, cysteine plays an important role in stabilizing protein structure via disulfide bridges
    and possesses numerous biochemical properties that can facilitate enzyme catalysis. It is also involved
    in the biosynthesis of glutathione, a tripeptide that acts as a cellular redox buffer. S. cerevisiae
    synthesizes cysteine through the reverse transsulfuration pathway, which converts homocysteine to
    cysteine via the formation of a cystathionine intermediate. This takes place over two steps: In the
    first, cystathionine -synthase (Cys4p) catalyzes a -displacement reaction where the thiol group of
    homocysteine displaces the hydroxyl group of serine to produce cystathionine. In the second, cystathionine
    -lyase (Cys3p) catalyzes an ,-elimination reaction where cystathionine is hydrolyzed to produce cysteine,
    -ketobutyrate, and ammonia. References: |CITS:[9409150]||CITS: [12480511]||CITS: [12702279]||CITS:
    [14967036]||CITS: [24291053]|'
