  comment: 'The tricarboxylic acid (TCA) cycle is a catabolic pathway that functions to generate energy
    and reduced cofactors from the oxidative decarboxylation of acetyl (C2) units. It occupies a central
    role in the metabolism of aerobic organisms, enabling the production of energy from carbohydrates,
    fatty acids, amino acids, and potentially any other molecule that can be converted or broken down
    to acetyl-CoA. In addition to its role in catabolism, the TCA cycle can also serve a biosynthetic
    role, as several intermediates in the pathway (e.g. oxaloacetate, succinate) provide carbon for the
    synthesis of amino acids or other biological compounds. The glyoxylate cycle is similar to the TCA
    cycle in that both pathways share the same initial steps, namely the conversion of oxaloacetate and
    acetyl-CoA to the six-carbon molecule isocitrate. Here the pathways diverge- instead of catalyzing
    the decarboxylation of isocitrate, the glyoxylate cycle catalyzes the cleavage of isocitrate to the
    4-carbon molecule succinate and the 2-carbon molecule glyoxylate. Glyoxylate is then condensed with
    another molecule of acetyl-CoA to form the 4-carbon molecule malate. These two steps are catalyzed
    by isocitrate lyase and malate synthase, respectively. Malate can then be converted back to oxaloacetate
    for another round through the pathway. Ultimately, the glyoxylate cycle leads to the net condensation
    of acetyl units into 4-carbon molecules, whereas the TCA cycle results in the net dissimilation of
    acetyl carbons as CO2. The existence of both pathways in S. cerevisiae enables this organism to utilize
    acetyl units not only for energy (via the TCA cycle), but also for the synthesis of 4-carbon precursors
    (via the glyoxylate cycle). Consequently, S. cerevisiae is able to use C2 carbon sources (e.g. ethanol,
    acetate) and fatty acids as sole sources of carbon. The key enzymes of the glyoxylate cycle- isocitrate
    lyase and malate synthase- are encoded in S. cerevisiae by ICL1 and MLS1, respectively. Both ICL1
    and MLS1 are highly induced by ethanol, acetate, and fatty acids; furthermore, disruption of either
    gene results in a growth defect on these carbon sources. Whereas the TCA cycle exists in virtually
    all aerobic organisms, the glyoxylate cycle is unique to plants, fungi, and other microorganisms such
    as E. coli. References: |CITS: [20889721]||CITS: [23966945]||CITS: [1551398]||CITS: [1454530]|'
