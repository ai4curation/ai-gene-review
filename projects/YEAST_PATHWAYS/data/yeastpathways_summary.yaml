  comment: 'Please note. There is a history of disagreement regarding the name of the 5-carbon product.
    It has been called D-erythroascorbic acid (D-erythroascorbate) in the literature |CITS: [17097644][17151466][10094636][11281285]|.
    However, in May 2008, the International Union of Biochemistry and Molecular Biology (IUBMB) changed
    the name from D-erythroascorbic acid to dehydro-D-arabinono-1,4-lactone because D-erythroascorbic
    acid is a 6-carbon compound (CAS registry number: 5776-48-7; formula: C6H8O6), and not a 5-carbon
    compound as indicated in the literature (see http://www.chemqmul.ac.uk/iubmb/enzyme/EC1/1/3/37.html.)
    Based on IUBMB''s advice ChEBI changed the name of the compound from D-erythroascorbic acid to dehydro-D-arabinono-1,4-lactone
    as well (see http://www.ebi.ac.uk/chebi/searchFreeText.do?searchString=17803).'
