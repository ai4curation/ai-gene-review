  comment: The glyoxylate cycle, also called the glyoxylate shunt, is present in fungi, plants, and bacteria,
    but not in mammals. The cycle is essential for growth on two-carbon compounds such as ethanol and
    acetate, and plays an anaplerotic role in the provision of precursors for biosynthesis. The glyoxylate
    cycle is comprised of many of the same reactions as the TCA cycle, but it does not include the two
    decarboxylation reactions. As a result, two-carbon substrates, which enter the cycle as acetyl-CoA,
    can be converted to four-carbon compounds, which in turn can be further metabolized to create sugars
    and other essential organic compounds. Although several of the reactions of the glyoxylate and TCA
    cycle are identical, many of them are catalyzed by different isozymes in different cellular compartments.
    The glyoxylate cycle occurs in the peroxisome and cytoplasm, while the TCA cycle occurs in the mitochondria.
    Utilization of two-carbon compounds by yeast also requires the TCA cycle and gluconeogenesis, which
    are coordinately regulated with the glyoxylate cycle. The succinate provided by the glyoxylate cycle
    enters the TCA cycle where it is converted to malate; malate then reenters the cytoplasm where it
    is converted to oxaloacetate and eventually to glucose via gluconeogenesis. The key enzymes of the
    glyoxylate cycle, isocitrate lyase and malate synthase, as well as malate dehydrogenase, are regulated
    in yeast in response to the carbon source of the growth medium. Synthesis of these enzymes is repressed
    in cells grown on glucose and derepressed in media lacking glucose (as reported in |CITS:[5345986]|.
    Although S. cerevisiae is rarely found in human hosts, phagocytosis of S. cerevisiae by mammalian
    macrophages results in the induction of genes encoding glyoxylate cycle enzymes; this is thought to
    be a response to the nutrient-poor environment of the phagolysosome |CITS:[12455685][11452311]|.
  name: glyoxylate cycle
