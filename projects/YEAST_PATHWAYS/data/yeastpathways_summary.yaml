  comment: 'In yeast and most eukaryotes, purine nucleotides levels are maintained via a combination of
    de novo synthesis and salvage pathways. The salvage pathways utilize purine bases and nucleosides
    taken up from the environment or formed from metabolism to synthesize purine nucleoside monophosphates.
    Compared to the de novo pathway, where 5-phosphoribosyl-1-pyrophosphate (PRPP) is converted to the
    adenylic/guanylic nucleotide precursor inosine 5-monophosphate (IMP) over many ATP-consuming steps,
    the salvage pathways synthesize IMP, GMP, and AMP directly from PRPP and a purine base via the action
    of purine phosphoribosyltransferases. There are three main phosphoribosyltransferases involved in
    purine salvage in S. cerevisiae: i) Hpt1p, which produces GMP and IMP from guanine and hypoxanthine,
    respectively; ii) Apt1p, which synthesizes AMP from adenine; and iii) Xpt1p, which synthesizes XMP
    from xanthine. XMP can be further converted to GMP via the GMP synthase Gua1p. The salvage pathways
    represent the preferred route of synthesis when purines are abundant in the growth medium. In S. cerevisiae,
    most of the ADE genes responsible for de novo synthesis of IMP and AMP are repressed by extracellular
    adenine, whereas extracellular guanine strongly represses the IMD genes responsible for the rate-limiting
    step of GMP synthesis. References: |CITS:[17052198 ]||CITS: [9864350]||CITS: [10217799]||CITS: [22419079]|'
  name: salvage pathways of adenine, hypoxanthine and their nucleosides
