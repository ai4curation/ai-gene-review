  comment: 'While Saccharomyces cerevisiae can use most amino acids as their sole nitrogen source, they
    can only use a few amino acids as a carbon source to support growth |CITS:[Large86][Cooper82]|. This
    is in contrast to most eukaryotes and some fungi, which can metabolize amino acids completely, utilizing
    them as sole sources of carbon and nitrogen |CITS:[Stryer88][Large 86]|. S. cerevisiae degrade the
    aromatic amino acids (tyrosine, phenylalanine, and tryptophan) and branched-chain amino acids (valine,
    leucine, and iso-leucine) via the Ehrlich pathway |CITS:[Sentheshanmuganathan60][10989420]|. This
    pathway is comprised of the following steps: 1) deamination of the amino acid to the corresponding
    alpha-keto acid; 2) decarboxylation of the resulting alpha-keto acid to the respective aldehyde; and,
    3) reduction of the aldehyde to form the corresponding long chain or complex alcohol, known as a fusel
    alcohol or fusel oil |CITS:[10989420][Large 86]|. Fusel alcohols are important flavor and aroma compounds
    in yeast-fermented food products and beverages (as reported in |CITS:[9546164]|. Both the constitutive
    aromatic aminotransferase I (ARO8p) and the inducible aromatic aminotransferase II (ARO9p) can catalyze
    the initial reaction in tyrosine degradation |CITS:[ 6763508]|. In vitro studies demonstrated that
    Aro9p is active with phenylpyruvate, pyruvate, or p-hydroxyphenylpyruvate, but not 2-oxoglutarate
    as the amino acceptor, while Aro8p is active with phenylpyruvate, pyruvate, or 2-oxoglutarate |CITS:[6763508]|.
    Aro9p is induced by aromatic amino acids and is subject to nitrogen regulation |CITS:[6763508][10207060]|. '
  name: L-tyrosine degradation III
