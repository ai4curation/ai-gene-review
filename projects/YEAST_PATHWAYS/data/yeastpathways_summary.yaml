    Pdc5p, Pdc6p, Thi3p, and Aro10p) |CITS:[9546164][10753893]| and the final step can be catalyzed by
    any one of six alcohol dehydrogenases (Adh1p, Adh2p, Adh3p, Adh4p, Adh5p, and Sfa1p) |CITS:[12499363]|.'
