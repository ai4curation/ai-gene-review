PWY3O-5268:
  all_genes:
  - *id378
  comment: 'Unsaturated fatty acids are essential for all eukaryotes; they are key components of cellular
    membranes and are used for energy storage. While most eukaryotes can synthesize polyunsaturated fatty
    acids, Saccharomyces cerevisiae can only form monounsaturated fatty acids, primarily |FRAME: CPD-9245|
    (16:l) and |FRAME: OLEATE-CPD| (18:1) (|FRAME: PWY3O-1801| and |FRAME: PWY3O-5268|). The monounsaturated
    fatty acids, palmitoleate (16:l) and oleate (18:1) are formed by the introduction of a single carbon
    - carbon double bond into the saturated fatty acyl-CoA, palmitoyl and stearoyl-CoA, respectively.
    OLE1 encodes the sole S. cerevisiae delta-9 fatty acid desaturase, an ER membrane-bound protein that
    is required for the production of monounsaturated fatty acids |CITS: [1978720]|. Ole1p catalyzes the
    formation of a double bond between carbons 9 and 10 (denoted by delta-9) in the cis configuration.
    Other fungi and eukaryotes have additional fatty acid desaturases that can produce double bonds in
    the delta12 and delta15 position. The Ole1p sequence is similar to homologs in rat and human (SCD1)
    over the majority of the protein, including a cluster of histidine residues that coordinate the binding
    of a diiron-oxo prosthetic group within the catalytic site (reviewed in |CITS: [16920014]|). The rat
    and yeast proteins are similar enough that exogenously expressed rat protein can rescue an ole1 null
    mutant |CITS: [1978720]|. However, Ole1p has an additional C-terminal, 113 amino acid extension (relative
    to the rat protein), which encodes a cytochrome b5-like domain not found in mammalian desaturases.
    In animal cells, cytochrome b5 is thought to be the electron donor for fatty acid desaturation. In
    contrast, the yeast cytochrome b5 (Cyb5) is dispensable for the synthesis of unsaturated fatty acids
    because Ole1p contains inherent electron donor activity. The rat protein is unable to rescue an ole1
    cyb5 double mutant |CITS:[8530368]|. OLE1 is highly regulated at the levels of both transcription
    and mRNA stability (reviewed in |CITS: [16920014 ]| and |CITS: [17087771]|). OLE1 transcription is
    decreased in response to high fatty acid levels |CITS: [2687232][1556107]| and increased in response
    to low oxygen |CITS: [10318903]| and low temperature |CITS: [11855848]|. Much of the transcriptional
    regulation is mediated by two homologous ER membrane-bound transcription factors, Spt23p and Mga2p.
    In response to stimuli, both Spt23p and Mga2p are activated by ubiquitin-dependent processing into
    their soluble forms, and then targeted to the nucleus |CITS: [9927444][11007476] [11557770]|. Independent
    of the transcriptional regulation, OLE1 mRNA is also stabilized under fatty acid free conditions and
    destabilized when fatty acids are added to the growth medium |CITS: [8824209]|. Mga2p, but not Spt23p,
    contributes to the regulation of OLE1 mRNA stability |CITS: [15220333]|.'
