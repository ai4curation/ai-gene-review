  comment: 'Threonine degradation can occur via several routes in the budding yeast S. cerevisiae. In
    the first route, threonine is deaminated to produce ammonia and -ketobutyrate. This reaction is catalyzed
    by the so-called ""catabolic threonine (and serine) deaminase Cha1p or the biosynthetic threonine
    deaminase Ilv1p. Cha1p enables S. cerevisiae to produce ammonia from the catabolism of serine or threonine,
    consequently enabling the use of either amino acid as a sole source of nitrogen. In contrast, Ilv1p
    is thought to serve a mainly biosynthetic role by degrading threonine to -ketobutyrate, the initial
    substrate for isoleucine biosynthesis. CHA1 is transcriptionally induced by serine and threonine,
    whereas ILV1 is regulated by general control of amino acid biosynthesis. The second route of threonine
    degradation occurs via threonine aldolase, encoded by GLY1 in S. cerevisiae. Threonine aldolase directly
    cleaves threonine to form glycine and acetaldehyde. Disruption of GLY1 leads to strongly reduced growth
    in minimal media lacking glycine, suggesting that threonine catabolism via threonine aldolase is the
    major source of glycine in S. cerevisiae. The third, putative route of threonine degradation in S.
    cerevisiae is the NAD-dependent oxidation of threonine to 2-amino-3-oxobutanoate. In many organisms,
    this reaction is catalyzed by threonine dehydrogenase (TDH). The existence of this enzyme in S. cerevisiae
    is uncertain, however low levels of TDH activity have been reported in one study (see Murata et al.,
    1986). S. cerevisiae also lacks 2-amino-3-ketobutyrate CoA ligase (KBL), the enzyme responsible for
    converting the product of TDH (2-amino-3-oxobutanoate) to glycine. Because 2-amino-3-oxobutanoate
    is unstable, the fate of this product in S. cerevisiae is presumed to be spontaneous decarboxylation
    to aminoacetate. References: |CITS:[2841185]||CITS: [3289762]||CITS: [8132653]||CITS: [3086094]||CITS:
    [3117785]|'
