  - *id146
  - *id147
  comment: 'The first step of glycolysis is the irreversible phosphorylation of glucose at C6. In S. cerevisiae,
    this reaction is catalyzed by the hexokinases Hxk1p and Hxk2p and the glucokinase Glk1p. Any single
    one of these enzymes is sufficient for growth on glucose, however Hxk2p appears to be the main glucose-phosphorylating
    isoenzyme. While HXK2 is expressed in glucose, both HXK1 and GLK1 are glucose-repressed, and expression
    of GLK1 and HXK1 occurs at significant levels only in the presence of non-fermentable carbon sources
    or galactose. Hxk2p is thought to have dual functions depending on localization: cytosolic Hxk2p is
    a glycolytic enzyme, whereas nuclear Hxk2p is a transcriptional regulator involved in glucose-induced
    repression of HXK1 and GLK1 and glucose-induced expression of HXK2. In addition to glucose-mediated
    transcriptional regulation, the hexokinase step of glycolysis is also subject to allosteric control.
    Yeast hexokinase is strongly inhibited by high ATP concentrations and competitively inhibited by trehalose-6-phosphate.
    Enzyme regulation of hexokinase is thought to play an important role in the control of glycolytic
    flux in S. cerevisiae. References: |CITS:[12007644]||CITS: [7732723]||CITS: [3882419]||CITS: [8354408]|'
  name: glucose-6-phosphate biosynthesis
