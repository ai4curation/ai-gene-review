  comment: 'In S. cerevisiae, the TCA cycle intermediate oxaloacetate can be converted to threonine in
    six steps. In the first step, oxaloacetate receives an amino group from glutamate via aspartate aminotransferase
    (Aat1p/Aat2p) to form aspartate. Aspartate is then converted by aspartate kinase (Hom3p) to L-4-aspartyl
    phosphate, which in turn is sequentially reduced by aspartate semialdehyde dehydrogenase (Hom2p) and
    homoserine dehydrogenase (Hom6p) to form homoserine. Homoserine is subsequently phosphorylated by
    homoserine kinase (Thr1p) and finally converted to threonine via threonine synthase (Thr4p). Threonine
    itself, if not utilized for protein synthesis, can be further metabolized to isoleucine or cleaved
    to produce glycine. Two intermediates in this pathway represent important crossroads in amino acid
    metabolism: aspartate and homoserine. Aspartate can be utilized for the synthesis of asparagine, arginine,
    and homoserine, and homoserine can be utilized for the synthesis of sulfur-containing amino acids
    and threonine. The flow of aspartate and homoserine into threonine biosynthesis appears to be largely
    modulated by threonine levels: threonine allosterically inhibits aspartate kinase (Hom3p) and competitively
    inhibits homoserine kinase (Thr1p). Of the two enzyme activities, aspartate kinase activity likely
    plays a larger role in controlling flux, as yeast strains that possess a Hom3p variant insensitive
    to feedback inhibition by threonine accumulate over twenty times more threonine than the wild type.
    Unlike yeast, mammals lack a threonine biosynthesis pathway and must acquire threonine from the environment.
    To exploit this difference for medical purposes, efforts have been made to identify potential antifungal
    agents from compounds that inhibit the enzymes involved in threonine biosynthesis in yeast. References:
    |CITS:[(JONES)]||CITS: [9163906]||CITS: [25408465]||CITS: [1847111]||CITS: [6821505]|'
  name: superpathway of threonine biosynthesis
