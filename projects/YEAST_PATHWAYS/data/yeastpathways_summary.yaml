  comment: 'Under conditions where optimal sources of nitrogen are unavailable, S. cerevisiae is able
    to utilize arginine as its sole nitrogen source. Arginine catabolism occurs in the cytosol with the
    hydrolysis of arginine to proline, releasing three nitrogen atoms that can be used by the cell |CITS:
    [14263163]|, |CITS: [1592829]|. In the absence of oxygen, the proline ring is unable to be further
    degraded |CITS: [1592829]|. The utilization of arginine as a nitrogen source is repressed if better
    nitrogen compounds such as ammonia, asparagine or glutamine are present. This is known as nitrogen
    catabolite repression (NCR) |CITS: [10640599]|. The CAR1 gene is subject to the effect of this repression
    which is mediated by the negative regulator Ure2p |CITS: [8622686]|, |CITS: [7891726]|. In the presence
    of arginine and the absence of a preferred nitrogen source, NCR is released by the GATA transcriptional
    activators Gln3p and Gat1p |CITS:[7568152]|, |CITS: [8816501]|, |CITS: [12796300]|. Unrelated to NCR,
    the presence of arginine also induces CAR1 and CAR2 expression by the regulators Arg80p, Arg81p and
    Mcm1p |CITS:[9065690]|, |CITS: [11119723]|. The CAR genes are also activated by the globally acting
    transcription factors Rap1p and Abf1p |CITS: [10559172]|, |CITS: [8816501]|. Conversely, CAR1 and
    CAR2 experssion is repressed by the Ume6p-Sin2p-Rpd3p complex |CITS: [10809695]|. Additionally, CAR2
    expression is unduced by the two positive regulators Dal81p and Dal82p as well as allophanate, a degradation
    product of urea |CITS:[10559172]|. Wild type S. cerevisiae cells normally synthesize proline by a
    pathway involving the gene products of PRO1, PRO2, and PRO3. However, strains that are mutant for
    pro1 and pro2 are able to bypass the early steps of proline biosynthesis and satisfy their requirement
    for proline via the arginine degradation pathway. Although the pro mutants can grow both anaerobically
    and aerobically, they cannot grow on optimal nitrogen sources due to the repression of the genes necessart
    for arginine and ornithine degradation to glutamate semialdehyde |CITS:[2824433]|. '
  name: L-arginine degradation VI (arginase 2 pathway)
