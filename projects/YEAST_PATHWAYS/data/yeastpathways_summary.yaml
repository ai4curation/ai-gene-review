  comment: 'Phosphatidylethanolamine (PE) is a major structural component of cellular membranes and one
    of the most abundant phospholipids in eukaryotes. The roles of PE in the cell are many: it contributes
    to membrane architecture, influences the structure and activity of integral and peripheral membrane
    proteins, is required for mitochondrial function in yeast, and plays important roles in cell division
    and autophagy. In addition, PE donates the phosphoethanolamine required for the biosynthesis of glycosylphosphatidylinositol,
    a lipid anchor involved in attaching proteins to the cell surface. In S. cerevisiae, the major route
    of PE synthesis involves the production and decarboxylation of phosphatidylserine. Alternatively,
    S. cerevisiae can synthesize PE from free ethanolamine via the CDP-ethanolamine branch of the Kennedy
    pathway. This route consists of three steps: 1) phosphorylation of ethanolamine to phosphoethanolamine
    by ethanolamine kinase (Eki1p) or choline kinase (Cki1p), 2) activation of phosphoethanolamine to
    CDP-ethanolamine by phosphoethanolamine cytidylyltransferase (Ect1p), and 3) transfer of a phosphoethanolamine
    moiety from CDP-ethanolamine to diacylglycerol by 1,2-diacylglycerol ethanolaminephosphotransferase
    (Ept1p). The other branch of the Kennedy pathway, the CDP-choline pathway, analogously incorporates
    choline into phosphatidylcholine (PC). The Kennedy pathway is not essential in yeast. Nevertheless,
    it plays an important role in PE and PC synthesis when the preferred de novo pathways are disrupted
    or repressed. This stands in contrast to mammalian cells, where the Kennedy pathway represents the
    major route of synthesis and is essential for mammalian development. References: |CITS:[20503434]||CITS:
    [17428789]||CITS: [11294902]||CITS: [21275641]||CITS: [9370323]||CITS: [17612623]|'
