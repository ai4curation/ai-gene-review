  comment: Biosynthesis of the aromatic amino acids tyrosine, phenylalanine, and tryptophan proceeds via
    a common pathway to chorismate, at which point the pathway branches. One branch proceeds to tryptophan
    and the other to phenylalanine and tyrosine |CITS:[Jones]|. Aromatic amino acid biosynthesis in S.
    cerevisiae is controlled by a combination of feedback inhibition, activation of enzyme activity, and
    regulation of enzyme synthesis |CITS:[Jones][1943992]|. The carbon flow through the pathways are regulated
    primarily at the initial step and the branching points by the terminal end-products. The initial step
    of chorismate biosynthesis can be catalyzed by either isoenzyme Aro3p or Aro4p; Aro3p is inhibited
    by phenylalanine, and Aro4p by tyrosine |CITS:[Jones][1943992]|. The first step in the phenylalanine-tyrosine
    branch is feedback inhibited by tyrosine and activated by tryptophan |CITS:[1943992]|, and the first
    step in the tryptophan branch is feedback inhibited by tryptophan. Most of the genes encoding for
    the aromatic amino acid biosynthetic enzymes are regulated by the transcriptional activator GCN4.
