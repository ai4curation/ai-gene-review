  comment: 'Many organisms possess sulfur salvage pathways that enable recovery of the reduced sulfur
    atom in metabolites of S-adenosylmethionine (AdoMet) after AdoMet is consumed in a metabolic reaction.
    The methionine salvage pathway, also known as the 5-methylthioadenosine (MTA) cycle, is one such example.
    The MTA cycle regenerates methionine from the AdoMet metabolite 5-methylthioadenosine/MTA, which is
    formed predominantly as a byproduct of polyamine biosynthesis. The methionine salvage pathway is present
    in all types of organisms, and may have evolved to reuse sulfur after its costly assimilation into
    the cell. In S. cerevisiae, biosynthesis of the polyamines spermidine and spermine account for over
    98% of MTA produced by the cell. In the polyamine pathway, decarboxylated AdoMet (derived from methionine)
    is converted to MTA after losing an aminopropyl group to putrescine via spermidine synthase (Spe3p).
    This converts putrescine to spermidine, which can likewise react with decarboxylated AdoMet via spermine
    synthase (Spe4p) to form spermine and another molecule of MTA. The MTA produced by these two reactions
    can then enter the MTA cycle to be converted back to methionine. References: |CITS:[9409150]||CITS:
    [19946895]||CITS: [16530730]||CITS: [9073064]||CITS: [9573363]|'
  name: superpathway of methionine salvage pathway
