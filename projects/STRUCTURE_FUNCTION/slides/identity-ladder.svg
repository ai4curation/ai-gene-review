<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#15201e">Which evidence to trust as sequence identity falls</text>
  <!-- axis -->
  <line x1="80" y1="110" x2="880" y2="110" stroke="#15201e" stroke-width="2"/>
  <g font-size="13" fill="#56655f" text-anchor="middle">
    <text x="80" y="96">100%</text><text x="560" y="96">40%</text><text x="660" y="96">30%</text><text x="760" y="96">20%</text><text x="880" y="96">0%</text>
  </g>
  <g stroke="#15201e" stroke-width="2"><line x1="560" y1="104" x2="560" y2="116"/><line x1="660" y1="104" x2="660" y2="116"/><line x1="760" y1="104" x2="760" y2="116"/></g>
  <!-- bands -->
  <rect x="80" y="130" width="480" height="110" fill="#e6f4ea"/>
  <rect x="560" y="130" width="100" height="110" fill="#e8f1ee"/>
  <rect x="660" y="130" width="100" height="110" fill="#fdf1e4"/>
  <rect x="760" y="130" width="120" height="110" fill="#fbeeec"/>
  <g font-size="14" text-anchor="middle" fill="#15201e">
    <text x="320" y="170" font-weight="bold">sequence transfer generally safe</text>
    <text x="610" y="164" font-weight="bold">verify</text><text x="610" y="184">domain,</text><text x="610" y="202">motif</text>
    <text x="710" y="164" font-weight="bold">structure</text><text x="710" y="184">essential</text>
    <text x="820" y="164" font-weight="bold">structure +</text><text x="820" y="184">local motif;</text><text x="820" y="202">expect</text><text x="820" y="220">divergence</text>
  </g>
  <!-- cases -->
  <g font-size="13">
    <line x1="664" y1="240" x2="664" y2="300" stroke="#0e6b66" stroke-width="2"/><circle cx="664" cy="240" r="5" fill="#0e6b66"/>
    <text x="664" y="318" text-anchor="middle" font-weight="bold" fill="#0e6b66">cds1 vs Cys synthases</text><text x="664" y="336" text-anchor="middle" fill="#15201e">24%; IBA biosynthesis row REMOVE</text>
    <line x1="850" y1="240" x2="850" y2="400" stroke="#1d8a4b" stroke-width="2"/><circle cx="850" cy="240" r="5" fill="#1d8a4b"/>
    <text x="850" y="418" text-anchor="middle" font-weight="bold" fill="#1d8a4b">sponge FGF</text><text x="850" y="436" text-anchor="middle" fill="#15201e">11.8% to chicken FGF4</text>
    <rect x="788" y="240" width="56" height="10" fill="#1d68b3" opacity="0.8"/>
    <line x1="816" y1="250" x2="760" y2="370" stroke="#1d68b3" stroke-width="2"/>
    <text x="700" y="388" text-anchor="middle" font-weight="bold" fill="#1d68b3">DUF4246 → 2OG oxygenase</text><text x="700" y="406" text-anchor="middle" fill="#15201e">8–15% to Foldseek hits</text>
  </g>
  <rect x="80" y="440" width="560" height="60" rx="10" fill="#f1f5f4"/>
  <text x="100" y="466" font-size="14" fill="#15201e">Identity is not the whole story: lanM shares the EF-hand fold</text>
  <text x="100" y="486" font-size="14" fill="#15201e">with calmodulin, and its lanthanide selectivity is chemistry no tool sees.</text>
</svg>
