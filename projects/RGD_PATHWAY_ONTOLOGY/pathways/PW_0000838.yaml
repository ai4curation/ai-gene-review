title: tamoxifen pharmacokinetics pathway
description: Tamoxifen (TAM, TX), an non-steroidal anti-estrogen, is one of the most commonly used drugs
  for the treatment and prevention of breast cancer. Estrogen is involved in the growth and development
  of breast cancers; estrogen mediated transcription is constitutively active in more than 50% of cases.
  Initially considered an antagonist, TAM is currently classified as a selective estrogen receptor modulator
  (SERM). It binds competitively to the estrogen receptors (ERs) acting as an antagonist in breastcancer
  cells and as a partial agonist in bone and the cardiovascular system. Members of the cytochrome P 450
  (CYP) phase I and of phase II biotransformation pathways are responsible for the metabolism of the drug
  in human liver microsomes (HLM) and rat hepatic cytosol. TAM is extensively metabolized and both primary
  and secondary metabolites have higher potencies than the parent compound. Primary metabolites include
  alpha-OH-TAM and DMT or 4-OH-TAM (see DMT and 4-OH-TAM CYPs, respectively - red indicates the presence
  of both rat and human enzymes, blue is for human only). DMT and 4-OH-TAM are further metabolized to
  the secondary metabolite endoxifen (see endoxifen CYPs). TAM metabolites are substrates for several
  phase II conjugating enzymes and subjects to sulfonation or glucuronidation by sulfotransferases (SULT)
  and UDP-glycosyltransferases (UGT), respectively, with UGT providing the major conduit. Phase II biotransformation
  results in more hydrophilic compounds that are easier to eliminate via the bile or urine. However, some
  can also form toxic DNA adducts, such as for instance the O-sulfonated alpha-OH-TAM. Sulfonation involves
  the conjugation of PAPS to an O-, N- or S- acceptor group with O-sulfonation being the major reaction.
  Glucuronidation involves the formation of O-, N-, S- or C-linked products using UDPGA as a donor and
  all UGT enzymes can form O-glucuronides. In humans, there are four SULT (SULT1, 2, 4 and 6) and four
  UGT (UGT1, 2, 3 and 8) families, respectively. SULT2A1 and SULT1A1 sulfonate alpha-OH- and 4-OH-TAM,
  respectively. UGT1A4 is the primary enzyme involved in the glucuronidation of TAM and 4-OH-TAM; several
  others are involved in the transformation of 4-OH-TAM and endoxifen (see the two UGT entries). Polymorphisms
  in CYP and UGTs enzymes have been reported. The impact on enzymatic activity ranges from decreased to
  insignificant and to increased. Recently, it has been reported that multidrug efflux transporter ABCB1
  is involved in the disposition of endoxifen; higher expression of the transporter has been observed
  in advanced tumors.
