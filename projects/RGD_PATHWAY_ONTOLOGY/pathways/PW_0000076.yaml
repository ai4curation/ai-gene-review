title: urea cycle pathway
description_xrefs:
- GO:0000076
description: The urea cycle, the first known metabolic cycle, was elucidated by Krebs and Henseleit in
  1932. It is composed of seven gene products, and operates predominantly in mammals to eliminate excess
  nitrogen arising from the breakdown of amino acids through the synthesis in the liver of urea, which
  is then excreted, while the amino acid carbon skeletons are converted to glucose or glycogen. Mitochondrial
  carbamoyl-phosphate synthetase (Cps1) condenses ammonia from amino acid catabolism, the first of urea's
  two nitrogens, and HCO3- to form input molecule carbamoyl phosphate in a reaction requiring two ATP.
  A related enzyme, CpsII or Cad, uses glutamine as its nitrogen donor and participates in pyrimidine
  biosynthesis. N-acetylglutamate transferase (Nags) converts Acetyl CoA and glutamate into N-acetylglutamate
  (NAG), an allosteric activator of Cps1. Nags deficiency leads to hyperammonemia, as Cps1 is inactive
  in the absence of NAG. Ornithine transcarbamoylase (Otc) then transfers the carbamoyl moiety of carbamoyl
  phosphate to ornithine to form citrulline in the mitochondrion, which is then exported to the cytosol.
  Otc deficiency can result in orotic aciduria. Argininosuccinate synthetase (Ass1) carries out the first
  step in the generation of arginine from citrulline. This is the ATP-dependent linking of citrulline
  and aspartate, carrying the second urea nitrogen, to form argininosuccinate. The second step is the
  cleavage of this product by argininosuccinate lyase (Asl) to generate arginine and fumarate. Ass1 and
  Asl along with nitric oxide synthase (Nos) form an abbreviated version of the cycle called the arginine-citrulline
  cycle, responsible for generating the key signaling molecule nitric oxide during the conversion of arginine
  back to citrulline. The final reaction of the urea cycle is carried out by the enzyme arginase. There
  are two isoenzymes; cytosolic arginase I (Arg1) is found in the liver and is the enzyme involved in
  the urea cycle. Arginase II is found in mitochondria of peripheral tissues such as the kidney and small
  intestine. Arginase I hydrolyzes arginine to regenerate ornithine and release for excretion the relatively
  nontoxic urea, bearing its two nitrogens. The ornithine is then imported into the mitochondrion in exchange
  for citrulline via the mitochondrial ornithine transporter, Ornt1 or Slc25a15, for another cycle. Slc25a15
  defects can result in ornithine translocase deficiency, or hyperornithinemia-hyperammonemia-homocitrullinemia
  syndrome (HHH syndrome). As stated above, the first cycle enzyme Cps1 is activated by N-acetyl glutamate,
  whose level is directly related to the rate of amino acid breakdown. Thus, the increased nitrogen from
  elevated amino acid degradation is effectively dealt with by increased generation of easily eliminated
  urea by the urea cycle.
