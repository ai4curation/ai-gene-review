title: steroid hormone biosynthetic pathway
description_xrefs:
- GO:0006694
- KEGG:map00140
description: 'Steroid hormones play important roles in metabolism, growth and differentiation and in reproductive
  functions. The synthesis and release of steroid hormones are highly regulated by the hypothalamus-pituitary-adrenal
  axis. The precursor of all steroid hormones is cholesterol which is derived from diet or via de novo
  synthesis from acetyl-CoA. The chronic steroidogenic response involves the change in the expression
  of steroidogenic genes while the acute response involves the quick delivery of cholesterol to the site
  of the first enzymatic reaction. The rapid flux of cholesterol from the outer (OMM) to the inner (IMM)
  mitochondrial membrane is mediated by the StAR protein. The IMM is the site where Cyp11a1, the enzyme
  catalyzing the first and rate-limiting step in the steroid biosynthetic pathway, is located. Overall
  there are two major classes of enzymes: the heme-containing cytochrome P450 and the hydroxysteroid dehydrogenase
  enzymes. The members of the P450 superfamily that participate in the pathway are membrane-bound mitochondrial
  or endoplasmic reticulum (microsome) enzymes that utilize NADPH as an electron donor. Two proteins mediate
  the mitochondrial electron transfer - the flavin-containing Fdxr and the iron-sulfur Fdx1; only one
  protein mediates the microsomal electron transfer - the P450 (cytochrome) oxidoreductase Por with two
  flavin cofactors. Dehydrogenases are membrane-bound mitochondrial or microsomal enzymes that utilize
  NAD or NADPH depending on whether the reaction is oxidation or reduction. The 27-carbon cholesterol
  is converted to the C 21 pregnenolone in a series of three chemical reactions that together constitute
  the step catalyzed by Cyp11a1. From this point, the pathway diverges into the individual branches that
  lead to the synthesis of particular types of steroids at specific adrenal and gonadal locations. Pregnenolone
  is converted to progesterone, itself an important hormone, or to 17OH-pregnenolone by Hsd3b1 or Hsd3b2,
  and Cyp17a1, respectively. In the adrenal zona glomerulosa, progesterone is converted to the C 21 mineralocorticoid
  aldosterone via a number of steps in the aldosterone biosynthetic pathway. Either progesterone or 17OH-pregnenolone
  can lead to the formation of the C 21 glucocorticoid cortisol in the cortisol biosynthetic pathway in
  zona fasciculata. Cyp17a1 catalyzes both 17-hydroxylation and 17,20 lyase reactions. The lyase activity
  of the enzyme accounts for the formation of the C 19 androgen dehydroepiandrosterone DHEA in the zona
  reticularis. In the testosterone biosynthetic pathway, DHEA is converted to testosterone in the testis;
  in the beta-estradiol biosynthetic pathway, testosterone is converted to the C 18 estrogen estradiol
  in the ovaries.'
