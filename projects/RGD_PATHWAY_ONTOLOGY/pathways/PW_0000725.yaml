title: potassium channel inhibitors pharmacodynamics pathway
description: Nateglinide and repaglinide are used as blockers of the ATP-sensitive potassium channels
  (K ATP ) to promote insulin secretion and lower blood glucose levels in patients with type 2 diabetes
  mellitus (T2D). I n response to elevated levels of circulating glucose; insulin is secreted from the
  pancreatic beta cells. This effect is counteracted by glucagon when the glucose levels are low - the
  two hormones act to maintain glucose homeostasis. The secretion of insulin from the islets of Langerhans
  is biphasic; the first and better understood phase is completely lost in diabetic patients while the
  second is severely impaired . The first phase is largely dependent on the K ATP channels. In normal
  individuals, glucose is rapidly taken up by the beta cells and metabolized. The resulting increase in
  ATP concentration triggers closure of K ATP channels leading to membrane depolarization and opening
  of voltage-gated calcium channels. The increase in calcium concentration induces fusion of the insulin-granules
  with the plasma membrane and SNARE-mediated insulin exocytosis. Insulin binding to its receptor sets
  in motion the insulin pathway which in turn activates downstream signaling pathways to regulate glucose
  transport, insulin expression and a range of other gene expression and cellular events. Uptake, metabolism
  and release of the drug are generally referred to as the pharmacokinetics of the drug while the action
  exerted on the target and the subsequent events are generally referred to as its pharmacodynamics. Nateglinide
  and repaglinide potentiate the closure of the K ATP channels; they have similar pharmacodynamic profiles
  with some differences in the interaction with and the effect upon the K ATP channels. Both drugs depend
  on glucose and do not seem to exert any effect in the fasted state; nateglinide action appears to be
  the more sensitive one to increased glucose concentration. The drugs are loosely categorized as members
  of the meglitinide family by virtue of functional rather than structural relationships. Meglitinide
  is the non-sulfonylurea portion of glibenclamide molecule - the regulatory subunits of K ATP channel
  are receptors for sulfonylureas. Repaglinide is the benzoic acid derivative of meglitinide; nateglinide
  is a D-phenylalanine derivative. The drugs have been administered alone as well as in combination with
  other drugs and appear to be safe for patients with renal impairment. Studies indicate that they have
  similar actions in humans and in animal models investigated. An advantage of these drugs is the fact
  that they don¿t appear to give rise to hypoglycemic effects, most likely due to their rapid uptake,
  metabolism and release. A disadvantage is that their metabolism appears to be carried out in a species-specific
  manner thus making in difficult to study adverse drug effects using animal models. [To access the PharmGKB
  diagram page click here ]
