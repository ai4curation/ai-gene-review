title: paracetamol pharmacokinetics pathway
description: Paracetamol or N-acetyl-p-aminophenol (APAP), also known as acetaminophen or by its trade
  in the USA as Tylenol, is a widely used analgesic and antipyretic drug. However, overdose of paracetamol
  - accidental or intentional - is associated with hepatotoxicity and a leading cause of liver failure.
  APAP metabolism occurs in the liver where it is primarily subject to glucuronidation and sulfation by
  members of phase II biotransformation enzymes. To a lesser extent, it is also metabolized by membersof
  the cytochrome P450 phase I biotransformation enzymes. The products are taken up by various liver basolateral
  and canalicular efflux transporters and eliminated via excretion. Glucuronidation is catalyzed by UDP-glucuronosyl
  transferases whose members have been classified into four families. From studies carried out in humans,
  the UGT1A1 and UGT1A6 appear to be critical for the APAP modification with APAP-glucuronides accounting
  for more than 50% of the administered drug. Sulfation is catalyzed by sulfotransferases whose members
  are also classified into four families. SULT1A1, SULT1A3/A4 and SULT1E1 are the enzymes responsible
  for APAP metabolism in human liver microsomes, accounting for ~30% of the administered drug. ~10% of
  administered APAP is metabolized by cytochrome P450 enzymes of which Cyp2e1 appears to be the primary
  contributor. The product of the reaction is the reactive metabolite N-acetyl-p-benzoquinone imine (NAPQI).
  NAPQI is a soft electrophile that readily interacts with nucleophilic groups, including nucleophilic
  sulfhydryl groups such as the cysteine thiol of glutathione (GSH). The glutathione conjugation occurs
  spontaneously but can also be achieved enzymatically. Overdose of APAP results in excess NAPQI which
  can deplete cells of the powerful GSH antioxidant. GSH depletion is believed to underlie the strong
  hepatotoxic effect of excessive paracetamol use. Phase I APAP metabolism has been studied in rodents
  and to some extent in humans while phase II information mostly comes from human data. This is important
  as there are differences in the metabolism these enzymes carry out between humans, rats and mice. The
  products of phase I and II biotransformation are taken up by various liver efflux transporters and eliminated
  via excretion. Studies in rodents using transport-deficient models, indicate that efflux of sulfated
  and glucuronidated metabolites across the canalicular hepatocyte membrane involves Abcc2, known as Mrp2
  and Abcg2, known as Bcrp transporters. The basolateral transport system is less clear, but Abcc3, known
  as Mrp3 and Abcc4, known as Mrp4, appear to be the transporters playing an important role. The induction
  of basolateral and canalicular efflux transporters shows similar patterns in both APAP-treated rodents
  and in samples from patients with APAP overdose. Paracetamol overdose causes oxidative stress, mitochondrial
  dysfunction and hepatocyte necrosis. It can also be nephrotoxic and cause renal failure, although to
  a lesser extent. N-acetylcysteine is being as an antidote and several plant extracts are being assessed
  for their potential therapeutic effects in rat animal models.
