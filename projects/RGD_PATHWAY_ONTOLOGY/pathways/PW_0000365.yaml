title: melanocortin system pathway
description: The melanocortin peptides - a collective term for the alpha-, beta- and gamma-melanocyte-stimulating
  hormones and the adenocorticotropin hormone (ACTH) - are derived from the sequential processing of the
  pro-opiomelanocortin (POMC) gene product. They bind to specific G-protein coupled melanocortin receptors
  (Mcr) to elicit a range of responses that include anti-inflammatory and immunomodulatory effects, regulation
  of energy homeostasis and feeding behavior and induction of melanogenesis. The five Mc receptors have
  rather distinct expression patterns. MC1R (human gene shown) is expressed in skin and also immune cells;
  in addition to its role in melanogenesis studies have shown that it may also function in inflammation
  and immunoregulation. Mc3r and 4, expressed in the central nervous system (CNS) and the brain are known
  regulators of energy homeostasis. Mc3r, also expressed in other tissues and Mc5r in peripheral, play
  a role in inflammation and immunity. Mc2r is the only receptor that exclusively binds the ACTH peptide;
  the others appear to bind all POMC derived peptides but with distinct affinities. A distinguishing feature
  of the system is the presence of natural antagonists. Asip acts as an antagonist of MC1R while Agrp
  is an antagonist of Mc3r and Mc4r. As the exclusive ACTH binder, Mc2r is an important effector of the
  hypothalamus-pituitary-adenal (HPA) axis which responds to various stresses and whose end effect is
  the stimulation of glucocorticoid synthesis. Activation of HPA axis leads to release of corticotropin-releasing
  hormone (CRH) from the hypothalamus. CRH signaling activates protein kinase A (PKA) pathway leading
  to expression of POMC gene and the release of ACTH. Melanocortin receptors couple to G alphas family
  of heterotrimeric G proteins that stimulates adenylyl cyclases; cAMP production activates PKA pathway.
  Mc2r requires an additional factor - Mrap, which assists in the trafficking of the receptor to the cell
  surface. Mrap binding the other receptors appears to have an inhibitory effect (not shown). A second
  Mrap-related human protein - MRAP2, appears to promote similar inhibitory effects on the receptors,
  except for Mc2r; its exact role in the function of Mc2r remains to be established. Other accessory proteins
  include Atrn and the Atrn-related, Atrnl. Atrn may act as a co-receptor for Asip while Atrnl is a binding
  partner for Mc4r. An intracellular protein that may also be involved in the inhibition of MC1R signaling
  (and possibly Mc4r) is Mgrn1. Some syndecans may act as co-receptors for Agrp (not shown). ACTH-mediated
  pathway is subject to inhibition by the negative feedback loop provided by the cortisol signaling pathway.
  The nuclear glucocorticoid receptor forms a complex with a mediator of POMC expression, the orphan nuclear
  receptor Nr4a1. The complex is stabilized by Smarca4 and recruits Hdac2 to silence gene expression.
