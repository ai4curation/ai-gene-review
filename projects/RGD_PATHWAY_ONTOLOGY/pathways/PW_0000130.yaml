title: nucleotide excision repair pathway
description: DNA lesions, induced by endogenous or exogenous agents, affect the faithful replication of
  the genome resulting in genetic aberrations that can be deleterious to the cell and organism. Multiple
  systems have evolved to detect single and double-strand DNA lesions, initiate signals that can be amplified
  and propagated, and set in motion effectors that can impinge upon DNA repair and checkpoint, various
  signaling and/or regulatory pathways, as necessary. Together, this vast response mechanism is known
  as the DNA Damage Response (DDR) pathway whose elements may operate collectively with shared components.
  The nucleotide excision repair (NER) pathway, is a versatile single-strand DNA repair pathway and part
  of DDR. It targets various, structurally unrelated DNA modifications that result in distortion of the
  double helix. NER is subdivided into two sub-pathways that differ in the first step of lesion recognition.
  The transcription-coupled TC-NER is involved in the repair of lesions within the transcribed strand
  of active genes whereas the global genome GG-NER is involved in the repair of lesions throughout the
  genome. The two converge into the core of NER leading to cleavage of the damaged strand on either side
  of the lesion and excision of a stretch of about 24-32 nucleotides followed by re-synthesis of the missing
  DNA stretch and ligation. In TC-NER, the stalled RNA polymerase II (PolrII) complex acts as the damage
  sensor recruiting TC-NER specific factors of which Cackayne syndrome CSA and CSB, the Ercc8 and Ercc6
  genes, play essential, but partially understood roles. Ercc6 binds stalled PolrII while Ercc8 interacts
  with Ercc6, Hmgn1, Xab2 and the Gtf2h2 subunit of TFIIH. Ercc6 has DNA-dependent ATPase activity, recruits
  histone acetyltransferases and in vitro, has chromatin remodeling activity. In GG-NER, lesions are recognized
  by Xpc within the Xpc-Rad23b-centrin2 complex and certain types of lesions by the UV-DDB complex (Ddb1-Ddb2-containing
  E3-ubiquitin ligase complex). The UV-DDB complex is thought to recognize nucleosomes containing the
  DNA lesion, play a role in chromatin modification. The C-terminus of Xpc interacts with Ercc3 and both
  termini are used in the interaction with Gtf2h1; the two are subunits of TFIIH. The mammalian TFIIH
  is a ten subunits complex and a component of the multi-protein pre-initiation complex (PIC) of RNA polymerase
  II transcription. TFIIH, primarily a Pol II factors, may also be involved in transcription by pol I
  and III. Ercc3 and another TFIIH subunit, Ercc2, known are XPB and XPD, respectively, are ATP-dependent
  helicases that open the damaged DNA, melting a region spanning ~30 nucleotides around the lesion. It
  is believed that DNA unwinding requires the helicase activity of Ercc2 and the ATPase activity of Ercc3
  with the latter being regulated by Xpc. Subsequently, the Rpa trimeric complex together with Xpa are
  recruited; Rpa associates with single-stranded damaged DNA while Xpa, in addition to Rpa, also interacts
  with Xpc. Rpa stimulates recruitment of incision endonucleases Ercc4/XPF-Ercc1 complex and Ercc5/XPG.
  Ercc4-Ercc1 and Ercc5 cleave at the 5' and 3' to the lesion, respectively followed by release of Xpc
  and TFIIH. Rpa also interacts with and stimulates several DNA polymerases. Recruitment of Rfc complex,
  Pcna and DNA polymerase leads to release of Ercc4/XPF and initiation of repair synthesis which precedes
  the 3', Ercc5 mediated cleavage. Once Ercc5 is released, Rpa and the excised DNA fragment are also released.
  DNA synthesis s carried out by DNA polymerases delta, epsilon or kappa, depending on the state of the
  cell. Pcna is a trimeric clamp - a ring-shaped structure known to increase the processivity of replicative
  DNA polymerases and also needed in repair. Clamp assembly relies on the ATP-dependent action of the
  clamp loader ¿ the pentameric Rfc complex. The strand is sealed by DNA ligase Lig1 or Lig3-Xrcc1 complex.
  Post translational modifications (PMT) of molecules involved in NER and of histones, affect the proceedings
  of the pathway. Histone are components of chromatin whose relatively relaxed or compacted structure
  promotes or impedes access to DNA, respectively. Chromatin modification/remodeling is an integral part
  of DDR pathway. The ¿access-repair-restore¿ is the proposed model of DNA repair in the context of chromatin.
  Some NER proteins can modify chromatin and/or interact with modifiers or remodelers. Components of NER
  can also play a role in transcription, irrespective of genotoxic damage. In humans, inborn defects in
  several NER proteins, have been associated with skin cancer-prone and premature aging-like diseases.
