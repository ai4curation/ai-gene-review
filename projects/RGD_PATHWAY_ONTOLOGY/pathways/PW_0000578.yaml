title: scatter factor/hepatocyte growth factor signaling pathway
description_xrefs:
- GO:0048012
description: Scatter factor/hepatocyte growth factor (Sf/Hgf) signaling pathway is a central regulator
  of invasive growth, a complex multi-step program required for embryonic and organ development as well
  as wound healing in adult cells but also characteristic of cancer progression. Met - the receptor for
  Hgf has first been identified in the 1980s as on oncogene. Both the ligand and the receptor are heterodimers
  that result from the processing of precursor molecules. Binding of Hgf leads to receptor autophosphorylation
  of tyrosine residues within the activation loop of the kinase domain and of two C-terminal located tyrosines
  that are essential for the interaction of receptor with adapters such as Grb2 and Gab1 or with downstream
  signaling molecules. Gab1 - a member of the Gab family of adapters that couple signaling via many receptors
  to their downstream effectors - appears to be the only Gab member to interact with Met and the main
  adapter protein for the pathway. Interestingly, it is in response to Hgf and not other growth factors
  that Gab1 experiences prolonged phosphorylation. Receptor phosphorylated Gab1 can recruit a number of
  other proteins; several, including the p85alpha regulatory subunit of PI3K (Pik3r1), Plcg1 or Shc1 can
  also be recruited by the activated receptor. Gab1 can interact with Grb2 raising the possibility that
  Gab1 is recruited to the receptor either directly or indirectly. Activated Gab1 also recruits Ptpn11
  (known as Shp2); Ptpn11 or Grb2-Sos via Ras can activate the Raf/Mek/Erk MAPK signaling pathway. Pik3r1
  recruitment directly by Met or indirectly through Gab1 triggers the PI3K-Akt pathway and the survival
  response. Hgf signaling can also transduce to members of Ras superfamily such as Rap1 via Gab1-dependent
  activation of Crkl adapter. Phosphorylation of a serine residue within the juxtamembrane domain of the
  receptor downregulates the kinase activity; within the same domain, a tyrosine residue is recognized
  by Cbl ubiquitin ligase. Ubiquitination of the receptor leads to its endocytosis and degradation. Overexpression
  or mutations in ligand and/or receptor resulting in deregulated signaling have been linked to numerous
  forms of cancers including bladder, breast, colorectal, kidney, lung, ovarian and prostate as well as
  melanoma and brain tumors.
