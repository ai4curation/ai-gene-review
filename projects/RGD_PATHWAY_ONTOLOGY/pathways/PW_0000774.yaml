title: cortisol biosynthetic pathway
description_xrefs:
- GO:0034651
- KEGG:map00140
description: 'Glucocorticoid hormones affect carbohydrate (e.g. gluconeogenesis), protein and lipid metabolism,
  and influence the inflammatory response. Cortisol, or hydrocortisone, the main C 21 glucocorticoid,
  is primarily synthesized in the cortex of the adrenal gland. Like all steroid hormones, glucocorticoids
  are derived from cholesterol; their biosynthesis is tightly regulated by the hypothalamus-pituitary-gonadal
  axis. The chronic steroidogenic response involves the change in the expression of steroidogenic genes
  while the acute response involves the quick delivery of cholesterol to the site of the first enzymatic
  reaction. The rapid flux of cholesterol from the outer to the inner mitochondrial membrane (IMM) is
  mediated by the StAR protein. The IMM is the site where Cyp11a1, the enzyme catalyzing the first and
  rate-limiting step in the steroid biosynthetic pathway, is located. Overall there are two major classes
  of enzymes: the heme-containing cytochrome P450 and the hydroxysteroid dehydrogenase enzymes. The members
  of P450 superfamily that participate in the pathway are membrane-bound mitochondrial or endoplasmic
  reticulum (microsome) enzymes that utilize NADPH as an electron donor. Two proteins mediate the mitochondrial
  electron transfer - the flavin containing Fdxr and the iron-sulfur Fdx1; only one protein mediates the
  microsomal electron transfer - the P450 (cytochrome) oxidoreductase Por with two flavin cofactors. Dehydrogenases
  are membrane-bound mitochondrial or microsomal enzymes that utilize NAD or NADPH depending on whether
  the reaction is oxidation or reduction. The 27-carbon cholesterol is converted to the C 21 pregnenolone
  in a series of three chemical reactions that together constitute the step catalyzed by Cyp11a1. Cyp17a1
  catalyzes the conversion of pregnenolone to 17OH-pregnenolone. Isoforms Hsd3b1 and 2 can aditionally
  generate progesterone from pregnenolone. Cyp17a1 can also convert progesterone to 17OH-progesterone,
  and 17OH-pregnenolone can be converted to 17OH-progesterone by Hsd3b1 or Hsd3b2. Cyp21a1 acts on 17OH-progesterone
  to generate 11-deoxycortisol. This is transformed into cortisol by the P450 enzyme Cyp11b1 in the zona
  fasciculata, or middle zone of the adrenal gland cortex.'
