title: homocysteine metabolic pathway
description: Homocysteine (Hcy) metabolism is at the cross-roads of several pathways; Hcy itself is a
  byproduct in the de novo pathway of methionine metabolic cycle. The first reaction of the methionine
  cycle produces S-adenosylmethionine, also known as AdoMet or SAM, which is the major methyl donor for
  nucleic acids, proteins, lipids and small molecules. The methyltransfer reaction, carried by a large
  number of methyltransferases (MTs) generates S-adenosylhomocysteine (SAH), the precursor of Hcy and
  also apotent inhibitor of MTs. SAH is reversibly hydrolyzed to homocysteine (Hcy) and adenosine by Ahcy.
  Under equilibrium conditions the production of SAH is favored; however, rapid removal of Hcy and adenosine
  products, prompts the reaction towards Hcy. Hcy can be methylated to methionine via the cobalamine-dependent
  and -independent pathways. The first is the predominant reaction in most tissues and is carried out
  by methionine synthase (Mtr). In the course of the reaction, the cobalamin (Cbl) co-factor can get oxidized
  rendering the enzyme inactive; reductive methylation carried out by Mtrr restores the functional enzyme
  (Mtr). The requirement for the 1 carbon (1C) donor 5-methyl tetrahydrofolate and the generation of tetrahydrofolate
  (THF) in the reaction, engages folate metabolism whose components are the folate cycle and the folate
  mediated one-carbon metabolic pathways. The cobalamin-independent, betaine-dependent pathway is the
  major route of Hcy remethylation in the liver. The choline derived betaine is the methyl donor in the
  reaction catalyzed by the zinc metalloprotein Bhmt with dimethylglycine (DMG) as a by-product. DMG exerts
  strong feedback inhibition upon Bhmt activity. DMG and sarcosine, the monomethyl glycine derived from
  the AdoMet-dependent reaction catalyzed by Gnmt, are 1C donors for the production of active folates
  in mitochondria. Interestingly, Gnmt can interact with 4S polycyclic aromatic hydrocarbons (PAH) which
  are potential carcinogens; the possible role of Gnmt in cellular detoxification and thus the presence
  of a second and distinct function, renders it a candidate moonlight protein. The other route of Hcy
  metabolism is the transsulfuration pathway which results in the production of cysteine and other metabolites
  downstream of it. AdoMet inhibits the folate-dependent Hcy methylation and activates the first enzyme
  in the transsulfuration pathway. This way, Hcy metabolism is channeled to remethylation when methionine/AdoMet
  levels are low, whereas when methionine/AdoMet levels are high, it is channeled to transsulfuration.
  The remethylation pathways converge on the methionine cycle and lead to homocysteine production; the
  transsulfuration pathway irreversibly degrades Hcy. The diagram presents an overview of Hcy metabolism.
  The transsulfuration pathway is presented separately. The pathways of methionine, homocysteine and folate
  metabolism are intimately interconnected. Defects in enzymes within these pathways have been associated
  with several disorders and conditions.
