title: pyruvate metabolic pathway
description_xrefs:
- GO:0006090
- KEGG:map00620
description: The pyruvate metabolic pathway, the sum of biochemical reactions involving pyruvate, is at
  the intersection of pathways important for glucose and energy homeostasis. Reaction 10 at the end of
  glycolysis, carried out by pyruvate kinases, converts phosphoenolpyruvate (PEP) to ATP and pyruvate
  which can be converted to acetyl-CoA or anaerobically to lactate (considered the end of anaerobic glycolysis).
  Pyruvate, and to a much lesser extent acetyl-CoA, can also be derived from the breakdown of several
  amino acids, or, in the case of acetyl-CoA, from fatty acid oxidation. Acetyl-CoA is the only precursor
  of the citric acid cycle pathway (TCA or Krebs cycle) that completes the oxidation of all metabolic
  fuels. Alternatively, pyruvate is converted to oxaloacetate (OAA) by pyruvate carboxylase. OAA can have
  several fates; it can serve as a precursor of PEP in gluconeogenesis, an intermediate in the TCA cycle,
  or part of a shuttle termed 'pyruvate cycling' with possible implications for glucose-stimulated insulin
  secretion. The conversion of pyruvate to OAA, carried out by pyruvate carboxylase, or its irreversible
  decarboxylation to acetyl-CoA, carried out by the pyruvate dehydrogenase complex PDC (described in detail
  below), are important reactions involving pyruvate. The PDC consists of E1 pyruvate dehydrogenase alpha
  (Pdha) and beta (Pdhb), E2 - dihydrolipoamide S-acetyltransferase (Dlat) and E3 - dihydrolipoamide dehydrogenase
  (Dld) enzymes that carry out the five steps of the overall reaction, the regulatory pyruvate dehydrogenase
  kinases (Pdk) and phosphatases (Pdp) and a protein known as E3bp (Pdhx). A model for the complex suggests
  a symmetric core composed of multiple copies of E2 and Pdhx to which multiple copies of E1 and E3, several
  homo or hetero Pdk dimers and Pdp heterodimers are attached. E1 carries out the rate-limiting step in
  the PDC-catalyzed reactions. Step 1 involves the TPP-dependent decarboxylation of pyruvate followed
  by acetylation of the lipoyl moiety of E2 in step 2. E2 catalyzes the reaction of step 3 yielding acetyl-CoA.
  In step 4, the lipoamide group of E2 is restored by E3; E3 is reoxidized in step 5. Pdk(s) inhibit E1
  activity; Pdp(s) dephosphorylate the modified serines and restore it. Pdk and Pdp activities are in
  turn regulated by nutritional states or tissue demands 'sensed' as concentration/ratios of metabolites
  or by the control these states exert on their transcription.
