title: angiotensin ii signaling pathway via at2 receptor
description: Angiotensin II (AgtII), the product of Ace action in the renin-angiotensin pathway, is probably
  the most potent of the biologically active peptides the system generates. Overall AgtII elicits distinct
  responses through signaling via receptor type 1 and 2, Agtr1 and Agtr2, respectively. Signaling via
  receptor type 1 is by far the better understood system. The Agtr1 mediated pathway is involved in vasoconstriction,
  proliferation, hormone release and fluid homeostasis. The powerful but potentiallyharmful effects elicited
  by Agtr1 can be counterbalanced by the Agtr2 mediated signaling. The pathway mediated by receptor type
  2 promotes vasodilation and natriuresis and exerts anti-inflammatory and anti-proliferative effects.
  It may also stimulate the production of nitric oxide (NO), cyclic GMP (cGMP) and bradykinin (not shown).
  Synthetic Agtr1 receptor antagonists, such as the frequently prescribed Losartan, are used as antihypertensive
  agents. Agtr2 can exert a comparable effect which may be overshadowed by the rather low level of expression
  the receptor has. Agtr2 is highly expressed in the fetus but declines abruptly in the neonatal period,
  except for a number of tissues. The receptor continues to be expressed in the adult kidney, heart, adrenal
  cortex and other specific sites including certain areas of the brain. Both receptors are seven transmembrane
  G-coupled protein (GPCR) receptors but the exhibit low sequence homology - 34%. They employ distinct
  heterotrimeric G proteins and both, particularly Agtr2, can elicit signals in the absence of G protein
  coupling. While the detailed molecular mechanisms of Agtr2 mediated signaling are still elusive, available
  data point to a number of aspects. The G protein coupled signaling engages the Gnai2 and 3 of the Galphai
  family. Activation of phosphotyrosine phosphatases proceeds in both a G protein- dependent and independent
  manner and leads to inhibition of the extracellular signal-regulated Raf/Mek/Erk MAP kinase signaling.
  For instance, activation of Dusp1 (known as Mkp-1) is G-protein dependent, whereas the activation of
  Ptpn6 (Known as Shp-1) is G-protein independent. The essential difference between Agtr1 and Agtr2 effects
  on this MAP kinase pathway may be one of the mechanisms thereby Agtr2 opposes some of Agrt1 actions.
  Several binding partners have been identified of which Mtus1, known as Atip1 is the best characterized
  and may be involved in receptor trafficking and intracellular signaling independent of coupling to heterotrimeric
  G proteins. Several transcripts have been identified for the human MTUS1 that results from alternative
  splicing and promoter usage. In addition to Mtus1, a number of other Agtr2 interacting partners have
  been identified that include Erbb3, Plzf, Cnk1, Nhe6, and Timp3 and which contact the same C-terminal
  intracellular region of the receptor. Overall, the Agtr2-protein interactions appear to confer a tumor
  suppressing function.
