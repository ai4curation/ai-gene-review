title: altered wnt signaling, canonical pathway
description: Wnt signaling pathways initiated by the Wnt family of secreted glycoproteins play important
  roles in the control of embryonic development, tissue regeneration, cell polarity, proliferation and
  cell fate determination. The canonical, beta-catenin dependent pathway is the best understood system.
  Altered canonical Wnt signaling has been implicated in several conditions, primarily tumorigenesis and
  bone malformations. Hyperactive Wnt signaling is found in more than 90% of colorectal cancer (CRC).
  Inaddition to mutations in components of the pathway, aberrant splicing of these components has recently
  been associated with neoplasms, including CRC. The role mutations in core components of the pathway
  play in colorectal cancer has been extensively reviewed and will be summarized here. In the normal Wnt
  signaling, the level and thus the functioning of beta-catenin - the core component of the canonical
  Wnt pathway - are highly regulated. In the absence of Wnt signal, beta-catenin is recruited to a multi-protein
  complex known as the 'destruction complex' comprising Apc, Axin and kinases where it is phosphorylated
  and targeted for degradation. The interaction of Wnt ligands with receptors and recruitment of Dvl (disheveled)
  eventually lead to destabilization of the complex and translocation of beta-catenin to the nucleus where
  in conjunction with the Tcf/Lef effector complex transcription factors and recruited co-activators,
  it turns on the expression of target genes. To access the diagram for the normal canonical Wnt signaling,
  click here . Apc gene is mutated in both the sporadic and the inherited form of colorectal cancer; frameshift,
  nonsense or splice-site mutations result in a truncated Apc protein. Axin1 and 2 loss-of-function mutations
  in colorectal cancer have been reported but they are relatively rare. Beta-catenin mutations cluster
  in a region of the amino-terminus; they either result in a deletion of an N-terminal fragment or disrupt
  the phosphorylation of key residues within this region. Mutated beta-catenin has been found in colorectal
  cancer and with a lower frequency in other types of cancer. For instance, mutations in beta-catenin
  have been associated with type 1 endometrial cancer. Apc, Axins and beta-catenin mutations result in
  a constitutively active beta-catenin in the nucleus leading to deregulated expression of Wnt target
  genes. Other mutations involve the Lrp5 receptor and link to osteoarthritis and low bone mass syndrome
  as well as eye defects. Mutations in some of the Wnt ligands and/or frizzled receptors (not shown) have
  been associated with renal failure, cardiovascular and neurodegenerative diseases. A member of Tcf family,
  Tcf72l, known as Tcf-4 is a strong susceptibility locus for type 2 diabetes. Mutated genes are color
  coded.
