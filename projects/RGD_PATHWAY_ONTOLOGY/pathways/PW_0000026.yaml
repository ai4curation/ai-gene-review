title: citric acid cycle pathway
description_xrefs:
- GO:0006099
- KEGG:map00020
description: 'The citric acid cycle, also known as the Krebs or tricarboxylic acid cycle (TCA), is considered
  a hub of cellular fuel metabolism. It consists of a series of eight reactions that oxidize the acetyl
  group of acetyl-CoA - the only precursor of the cycle - to two molecules of CO 2 while conserving the
  liberated energy in the reduced NADH and FADH 2 compounds. The stored electrons are passed to oxygen
  via the electron transport chain and the generated electrochemical gradient is used to drive the ATP
  synthesis. The acetyl-CoA necessary to initiate the cycle is derived from pyruvate or from fatty acids
  and amino acid degradation. The cycle intermediates can also be derived from or fueled into other pathways.
  Oxaloacetate, alpha-ketoglutarate, succinyl-CoA and fumarate can be derived from the degradation of
  various amino acids. Oxaloacetate can be used for the biosynthesis of glucose and amino acids, alpha-ketoglutarate
  for the biosynthesis of amino acids and citrate provides the source for the cytosolic acetyl CoA in
  the fatty acids biosynthetic pathway. One round of the cycle gives rise to three molecules of NADH and
  one of FADH 2 (colored gold and as applicable, numbered); there is also one molecule of GTP or ATP produced
  (not shown). The oxaloacetate consumed in the first step is regenerated in the last step; the cycle
  can go on for as long as there are acetyl groups available. One turn of the cycle generates ~10 ATP
  molecules. Glucose oxidation requires two rounds of the cycle (glycolysis yields two pyruvate molecules
  whose oxidation produces two acetyl-CoAs). More rounds of the TCA cycle are necessary to complete oxidation
  of fatty acids since their carbon skeletons are larger than that of glucose. The flux of the cycle is
  controlled by the availability of substrates, product inhibition and competitive feedback inhibition.
  The cycle takes place in the mitochondrion. Since the metabolites are present in both mitochondria and
  cytosol, the identification of rate-limiting steps is more difficult. The estimated free energy changes
  for the reactions point to three enzymes likely to function far from equilibrium: citrate synthase (step
  1), isocitrate dehydrogenase (step 3) and oxoglutarate dehydrogenase (step 4) - the unidirectional reaction
  arrows in the diagram. Click to get to the entry for the molecule of the month, October 2012, at the
  Protein Data Bank which is dedicated to the structures of proteins/complexes in the eight reactions
  of the cycle.'
