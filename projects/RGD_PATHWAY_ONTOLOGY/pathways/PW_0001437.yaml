title: titanium dioxide nanoparticle response pathway
description: 'Nanoparticles (NP) are increasingly being in used in a wide range of applications, including
  biomedical and environmental. The potential hazard they may present is the focus of current nanotoxicology
  research. Among the nanoparticles with a broad spectrum of applications and known cellular responses
  are the carbon nanotubes, nano-titanium dioxide (TiO 2 ) and nano-cerium oxide. TiO 2 is a widely used
  pigment found in many consumer products that include cosmetics and sunscreens, toothpaste, food products
  (FDA approved) and prosthetic implants. TiO 2 exists in three mineral forms: anatase, rutile and brookite;
  anatase and rutile have a tetragonal crystalline structure, brookite is orthorhombic. Anatase has high
  photocatalytic activity under UV light (an application of photocatalysis is the oxidation of organic
  pollutants in waste waters). The major routes of TiO 2 . NP exposure are inhalation and the skin. Studies
  conducted in parallel in mice and rats show similar patterns of lung neutrophilia in the two rodents
  and dependent on the form of TiO 2 used. Intravenous and/or intraperitoneal administration leads to
  accumulation of TiO 2 in the liver, spleen, kidney and lung but at different levels. Under various types
  of toxicity conditions, pulmonary toxicity in response to TiO 2 is observed. It is believed that the
  observed pulmonary inflammation caused by TiO 2 relates to oxidative stress and the expression of inflammatory
  cytokines. The in vivo studies show DNA strand breaks, chromosomal damage, endocrine and reproductive
  systems-related issues. TiO 2 , in its anatase form can interact with DNA in rat and mouse liver cells,
  either by inserting itself in-between DNA base pairs or binding to DNA nucleotide with three DNA oxygen
  or nitrogen atoms and two phosphorus. In vitro studies in human cell lines point to the genotoxic and
  cytotoxic effects of TiO 2 . Results show impairment of DNA repair pathways, induction of oxidative
  stress and intrinsic apoptosis via activation of p53 signaling. P53 tumor suppressor transcription factor
  is a master regulator at the hub of many signaling and regulatory networks. TiO 2 activates both the
  intrinsic and extrinsic apoptotic pathways via increased expression of Bax and Casp3 and of Fas and
  Casp8, respectively. TiO 2 has also been shown to induce inflammatory responses via Toll-like receptor
  signaling involving Tlr4. Toll-like receptors represent a large family of pattern recognition receptors
  (PRR) that respond to a diverse array of exogenous and endogenous molecules. There are 10 known Toll-like
  receptors in mammals of which receptors 1 to 9 are conserved. All rely on adaptor proteins to initiate
  downstream events of which Myd88 represent the main adaptor protein. Thus, downstream events take place
  in an Myd88-dependent or independent manner. Tlr4 is the only receptor that employs both routes, albeit
  with different kinetics. Of note, TiO 2 activation of Tlr4 is independent of Lbp and Cd14 - the proteins
  needed to facilitate LPS (lipopolysaccharide) binding by the Tlr4-Ly96 complex. In human keratinocytes,
  TiO 2 diminishes mitochondrial function and affects carbohydrate, amino acids and polyamine metabolism.
  It has to be mentioned that the literature points to contradictory and conflicting results and data
  regarding both the toxicity and the particle size effects of TiO 2 emphasizing the need for further
  experimental assessment. In addition, there may be variation in the responses of different species.'
