title: losartan-gene, gene-chemical, gene-gene interaction pathway
description: Losartan is a selective and competitive antagonist of angiotensin II receptor type 1 used
  in the treatment of hypertension of heart failure. One of several antagonists collectively known as
  ARBs, losartan is the first marketed and the most frequently prescribed one. In addition to its specific
  role - see the losartan drug pathway here or from the diagram page, losartan directly or indirectly
  interacts with a large array of other genes. In turn and in a manner similar to the chemical, each gene
  can interact with many compounds. Detailed information on chemical-gene, gene-chemical interactions
  is collected by and made available at the Comparative Toxicogenomics Database (CTD). CTD data is imported
  in RGD via a pipeline and mapping to Chemical Entities of Biological interest (ChEBI) ontology terms.
  The expanded interaction pathway for losartan interacting genes offered here, provides additional information
  for selected genes. The selected genes are those that harbor nonsynonymous variants, single nucleotide
  polymorphism(s) (SNPs), in rat strains that have been sequenced. Of the 117 rat genes that in some fashion
  interact with losartan, 60 have nonsynonymous SNPs. For a subset of these genes, the SNPs are predicted
  by PolyPhen to be possibly or probably damaging. This latter set is presented in the diagram and the
  individual genes link to the rat gene report page. The highlighted genes are those for which the damaging
  SNP is unique to a particular strain with the strain specified on the bottom of the gene. Each of these
  losartan-interacting genes can also interact with other drugs or chemical substances, as mentioned.
  The top ten interacting chemicals for genes and the top ten interacting genes for drug/chemicals is
  the default graphical presentation of these objects at CTD. Links are provided to the CTD entries for
  the genes with deleterious variants by the small molecule (green) indicating top-gene for that gene.
  This can be of potential interest for researchers in the toxicogenomics field, as some of these compounds
  may be toxins and other potentially hazardous substances. For instance, lipopolysaccharide (LPS) of
  Gram-negative bacteria, is the top interacting compound of Vcam1, cocaine is the top one for Fos, carbon
  tetrachloride is the top one for Tgfb1, while the tetrachlorodibenzodioxin is the top compound for Vegfc.
  A link for the top ten losartan-interacting genes is also provided. The link from both the entry for
  the losartan interacting genes with nonsynonymous SNPs and for the genes whose SNPs are predicted as
  damaging are to pages that provide additional links. For instance, all genes have been put into the
  Gene Annotator tool selecting the rat as a species and disease, pathway, phenotype and chemicals for
  ontology annotations and the result is provided as link. A second Gene Annotator search included several
  external databases such Pfam, PharmGKB and PRINTS and the link is to the result page for this search.
  The pages contain additional links, including one to the Variant Visualizer tool. From all the sites
  accessed, the user can choose to continue the trip and explore the resources and additional information
  offered within.
