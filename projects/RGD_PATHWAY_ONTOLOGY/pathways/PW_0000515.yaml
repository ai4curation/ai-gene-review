title: interleukin-10 signaling pathway
description: 'Interleukin-10 (Il-10) is a prominent member of the interleukin 10 family of cytokines which
  also includes interleukin 28A, 28B and 29 known as interferon type III or lambda. In addition to the
  mammalian proteins, several viral homologues are also known. The many biological actions of Il-10 impinge
  upon the release of immune mediators and antigen presentation with an overall anti-inflammatory effect;
  interestingly it is Il-10 and not the other members of the family that appear to promote such effects.
  Il10 acts primarily on monocytes/macrophages keeping a balance between the responses of T helper (Th)1
  and Th2 cell. More specifically, it inhibits the release of pro-inflammatory mediators, suppressing
  Th1 responses while stimulating the Th2 ones. The broad spectrum of biological effects Il10 exerts,
  relies on the coordinated regulation of expression of hundreds of genes. Expression experiments point
  to ~1,600 up-regulated and ~1,300 down-regulated genes as a result of Il10 signaling which engages the
  Jak-Stat intracellular pathway. There are two Il10 receptors - Il10ra and Il10rb; Il10ra is primarily
  expressed in immune cells whereas the expression of Il10rb is ubiquitous. Unlike Il10ra which is specific
  for Il10, Il10rb is part of receptor complexes for other members of the interleukin-10 family. Upon
  binding to Il10ra, the cytokine undergoes conformational changes that facilitate the association of
  Il-10/Il10ra complex with Il10rb; by itself, Il10rb is unable to associate with Il10. The Il-10/Il10-receptors
  complex activates members of the Janus kinase family: Jak1, which associates with Il10ra and Tyk2 which
  associates with Il10rb. Subsequently, the kinases phosphorylate two tyrosine residues in Il10ra resulting
  in the recruitment of Stat3 via its SH2 ( src homology 2 ) domain followed by its own Jak-mediated phosphorylation.
  Stat1, and in some cell types Stat5 can also be activated in response to Il10. Activated homo- and heterodimers
  of Stat translocate to the nucleus to regulate the transcription of many genes, including Socs3 which
  binds to and inhibits the activity of Jak kinases and may mediate the termination of Il10 effects. Stat3
  is also essential for the expression of Il10 downstream of pro-inflammatory cytokines such as 1l-6 and
  Il-12 (with other Stats also contributing). Pathogenic microorganisms can also induce Il-10 downstream
  of Toll-like receptors (TLR) such as Tlr2; many TLRs are targets for Il-10 mediated suppression. At
  times, pathogens mediate Il10 induction to use the production of selected cytokines as a virulence strategy
  to promote their survival within the host. Interestingly, despite intense research on the Il10 system,
  the molecular mechanisms underlying its many biological actions remain elusive. For instance, how does
  a C-terminal region achieve its crucial role in the inhibition of release of pro-inflammatory mediators
  or what are the roles played by other kinases which Il10 activates - are among the questions still awaiting
  answers.'
