title: interleukin-1 signaling pathway
description_xrefs:
- GO:0070498
description: 'Interleukin 1 is a member of the interleukin-1 family of cytokines that plays important
  roles in innate and adaptive immunity and which has been associated with acute and chronic inflammation.
  Interleukin 1 (alpha and beta) signaling involves the same receptor but there are differences between
  the localization, processing and function of the two cytokines. Il1b is considered the more potent cytokine
  while 1a can be active in its precursor form, can be membrane-associated and active and can alsotranslocate
  to the nucleus to affect gene expression. The receptors are characterized by the presence of an extracellular
  immunoglobulin domain and an intracellular Toll/IL-1 receptor ( TIR ) domain. It is the presence of
  TIR domain that confers the shared characteristics of Il1 and Toll-like receptors (TLR) signaling. Upon
  ligand binding, the receptor undergoes conformational changes leading to recruitment of a co-receptor
  which then allows the complex to assemble with Myd88 and Tollip adapters followed by recruitment of
  Irak kinases (Tollip may also be involved in the internalization of the receptor). Irak4 undergoes auto-phosphorylation
  and then phosphorylates Irak1 and 2 which is followed by recruitment of Traf6, a ubiquitin E3 ligase.
  Traf6 and its upstream Irak1 partner are important for the assembly of a complex containing Map3k7 (Tak1)
  which can prompt NF-kappaB and MAPK signaling. A three-step mechanism has been proposed: phosphorylated
  Irak1 recruits Traf6 to the receptor complex and the two then dissociate to interact with a pre-formed
  Map3k7-Tab(s) complex on the membrane. A Traf6-Map3k7-Tab1-Tab2 complex translocates to the cytoplasm
  where the E3 ligase activity of Traf6 along with the E2 Ube2n and Ube2v1 enzymes are involved in K63-linked
  poly-ubiquitination events followed by activation of Map3k7. The sequence of events and mechanisms of
  Traf6-dependent poly-ubiquitination are not fully resolved. Irak1 is also subject to K63-poly-ubiquitination
  by the Pellino family members which it phosphorylates. However, Irak1 is also subject to Il1 triggered
  proteosomal degradation which depends on K48-linked poly-ubiquitination. Activated Map3k7 phosphorylates
  members of IKK complex which in turn activates NF-kappaB signaling; Map3k7 is also the upper MAP3K tier
  of JNK and p38 MAPK cascades. Processing of Il-1beta is accomplished by caspase 1 within a complex known
  as the inflammasome which includes members of Nod-like receptor (NLR) family, intracellular sensors
  of bacterial and nonbacterial danger. To-date, the NLRP3 inflammasome is the better characterized one
  and several mechanisms have been proposed for its activation. NLRP1 inflammasome is another complex
  that may also contain caspase-5 and a third complex includes AIM2 - a member of the HIN-200 protein
  family that appears to be the sensor of cytosolic double-stranded DNA. Il-1alpha is processed by calpain
  but it is not clear which member or members of the family are involved in the process. The actions of
  Il1 are tightly regulated; the mechanisms include the presence of an endogenous receptor antagonist
  and of a decoy receptor. Another regulator is SIGIRR, also a member of the family; it has broader roles
  as it controls signaling by interleukin-1 and the other members of the family as well as signaling by
  Toll-like receptors.'
