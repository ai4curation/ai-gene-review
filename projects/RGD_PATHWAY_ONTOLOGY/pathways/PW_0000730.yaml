title: warfarin pharmacokinetics pathway
description: Warfarin, trade name Coumadin, is a widely-used oral anticoagulant drug for the prevention
  of thrombosis and venous and arterial thromboembolism. It is a synthetic derivative of coumarin-derived
  dicoumarol. Warfarin is present as a racemic mixture of R and S enantiomers, both active, though not
  equally, and both metabolized via different routes. The S-warfarin is 3 to 5 times more potent than
  the R-enantiomer. Warfarin is metabolized, mainly in the liver, by several cytochrome P450 phase I biotransformation
  enzymes, depending on the enantiomeric form and producing a number of metabolites. S-warfarin is primarily
  metabolized to 7-hydroxywarfarin by CYP2C9 and to a lesser extent to 6-hydroxywarfarin by the same enzyme.
  R-warfarin is preferentially metabolized by CYP3A4 to 10-hydroxywarfarin, but other family members,
  such as CYP1A1 and A2, and CYP2C8, C18 or C19, can also target it. 4-, 7-, and 6- and 8-hydroxywarfarin
  metabolites are formed by CYP2C18; CYP1A1, A2 and CYP2C8; CYP1A1, A2 and CYP2C19, respectively. The
  two main enzymes of phase I warfarin biotransformation - CYP2C9 and CYP3A4, are highlighted. 7- and
  10-hydroxywarfarin, the two main metabolites of S- and R-warfarin, respectively, act as inhibitors of
  CYP2C9. Of the phase II biotransformation enzymes, several (UDP)-glucuronosyltransferases (UGTs) process
  the warfarin metabolites, with various specificities. UGT1A10 glucuronidates 4-, 6-, 7-, and 8-hydroxywarfarin,
  while UGT1A8 metabolizes 7- and 8-hydroxywarfarin. The two UGTs are extrahepatic intestinal enzymes.
  Of the hepatic enzymes, UGT1A1 glucuronidates 6-, 7- and 8-hydroxywarfarin while UGT1A9 only metabolizes
  8-hydroxywarfarin. In addition to having the broadest specificity, the extrahepatic UGT1A10 has the
  highest activity - the enzyme is highlighted. Warfarin itself is not subject to the glucuronidation
  reaction indicating that conjugation of the drug is dependent upon its oxidation. Of all metabolites,
  4-hydroxywarfarin is the least modified while 10-hydroxywarfarin does not appear to be subject to glucuronidation.
  Currently, little is known about sulfonation of warfarin or its derivatives; sulfonation is another
  type of phase II biotransformation reaction. Warfarin and metabolites are primarily excreted in urine.
  The biotransformation enzymes, in particular cytochrome P450 members, have a rather broad specificity
  and are largely not well conserved through evolution. Many of the pharmacokinetics studies have been
  carried out in human liver microsomes and/or with recombinant human proteins; the human genes are listed
  (and color coded blue). To access the ontology report for annotations, GViewer and download, click here
