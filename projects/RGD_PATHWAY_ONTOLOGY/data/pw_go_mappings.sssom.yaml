# RGD Pathway Ontology -> GO candidate mappings (SSSOM) -- GENERATED, DO NOT HAND-EDIT.
# Regenerate with projects/RGD_PATHWAY_ONTOLOGY/scripts/analyze_rgd_pathways.py and
# validate with: just validate-rgd-mappings

mapping_set_id: https://w3id.org/ai4curation/ai-gene-review/mappings/pw2go
mapping_set_title: RGD Pathway Ontology to GO biological process candidate mappings
mapping_set_description: 'Candidate PW -> GO mappings generated by projects/RGD_PATHWAY_ONTOLOGY/scripts/analyze_rgd_pathways.py
  from GO ids cited in PW definitions, GO ids cited on RGD pathway pages, and exact normalized label/synonym
  matches, plus the hand-curated rows of data/pw_go_curated.sssom.yaml. Only the curated rows are curator-verified.
  curation_rule records why each row exists and any QA finding: pw2go:src/PW_DEFINITION_XREF: the GO id
  is cited as a definition source of the PW term. pw2go:src/RGD_PAGE_GO_XREF: the GO id is the ''associated
  GO term'' on the term''s RGD pathway page. pw2go:src/LEXICAL_MATCH: normalized PW label or exact synonym
  equals a GO label or exact synonym. pw2go:src/CURATED_MAPPING: hand-curated in data/pw_go_curated.sssom.yaml;
  broadMatch, relatedMatch and sssom:NoTermFound rows are recorded but not used for GO-CAM or module matching.
  pw2go:src/PATHWAY_TO_PROCESS: the lexical match needed the PW ''pathway'' wording rewritten as a GO
  process; match_string holds the normalized form that matched. pw2go:qa/OBSOLETE_TARGET: the GO term
  is obsolete; see_also lists GO''s replaced_by terms, if any. pw2go:qa/MISSING_TARGET: the GO id does
  not resolve in the GO release used. pw2go:qa/NOT_BIOLOGICAL_PROCESS: the GO term is not a biological
  process, so it is not used for matching. pw2go:qa/ID_ECHO: the GO local id equals the PW local id (likely
  a typo on the RGD page). pw2go:qa/PAGE_XREF_DISAGREES: the page xref is neither equal to, nor an ancestor
  or descendant of, the term''s other GO mappings, which are listed in the other slot as conflicts_with=<GO
  id>; the row is not used for matching.'
