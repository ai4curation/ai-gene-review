# Hand-recorded verdicts; check the sample with scripts/sample_def_xref_spot_check.py --check.
description: 'Spot check of PW definition citations (pw2go:src/PW_DEFINITION_XREF) as PW -> GO mappings.
  Each sampled pair was judged by comparing the PW definition with the GO definition in the pinned PW
  and GO releases named in summary.yaml. verdict is the SSSOM predicate the pair deserves (object relative
  to subject). Of 50 pairs, 48 hold as closeMatch or exactMatch and 2 cite a narrower GO term (narrowMatch);
  none is wrong or unrelated. On this result analyze_rgd_pathways.py writes unflagged definition citations
  as skos:closeMatch, and writes each pair listed here with its verdict. Matching is unchanged: these
  rows were already used for GO-CAM and module matching.'
