- reactome_id: R-HSA-8981637
  resolution_status: resolved
  resolution_bucket: reactome_defined_set_overbroad
  resolution_summary: >-
    Reactome's RHOA GAP reaction is valid for the supported ARHGAP6,
    ARHGAP21, ARHGAP23, and ARHGAP29 rows, but the defined executor set
    over-includes GAP-dead ARHGAP11B.
  resolution_follow_up: >-
    Remove ARHGAP11B from the RHOA GAP executor set; keep the supported
    GO:0005096 exports because GO no longer has substrate-specific Rho/Rac GAP
    children to refine to.
- reactome_id: R-HSA-1454916
  resolution_status: resolved
  resolution_bucket: reactome_family_overbroad
  resolution_summary: >-
    The MRP organic-anion family event supports ABCC6 but over-includes
    atypical ABCC members CFTR and ABCC9; CFTR also carried an obsolete
    pump-like anion-transport term.
  resolution_follow_up: >-
    Split CFTR and ABCC9 out of the organic-anion transporter executor set or
    prevent TAS MF export to nontransporting channel and channel-regulator
    members.
- reactome_id: R-HSA-1482635
  resolution_status: resolved
  resolution_bucket: mixed_overbroad_set_and_wrong_mf
  resolution_summary: >-
    The 2-acyl-LPG reaction is real for LPGAT1 and plausibly LPCAT1, but the
    Reactome LPGAT set over-includes LPCAT4 and GO:0047144 names the LPA
    acceptor rather than lysophosphatidylglycerol.
  resolution_follow_up: >-
    Remove LPCAT4 from the 2-acyl-LPG executor set and replace LPGAT1's MF
    export with a lysophospholipid- or LPG-specific acyltransferase term.
- reactome_id: R-HSA-75885
  resolution_status: resolved
  resolution_bucket: reactome_family_overbroad
  resolution_summary: >-
    The LPA-to-PA event is supported for AGPAT2 and LPCAT1, but direct human
    LPCAT4 biochemistry contradicts LPA acylation by LPCAT4.
  resolution_follow_up: >-
    Remove LPCAT4 from the AGPAT/LPAAT executor set; no GO term refinement is
    needed for the accepted LPA acyltransferase rows.
