<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">No free lipoate: the octanoyl chain is built on the protein</text>
  <!-- E. coli route -->
  <text x="30" y="82" font-size="15" font-weight="600" fill="#0e6b66">E. coli direct route</text>
  <g font-size="14" text-anchor="middle" fill="#15201e">
    <rect x="30" y="100" width="170" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="115" y="132">octanoyl-ACP</text><text x="115" y="152" font-size="12" fill="#56655f">fatty acid synthesis</text>
    <rect x="300" y="100" width="210" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="405" y="132">octanoyl-lipoyl domain</text><text x="405" y="152" font-size="12" fill="#56655f">(on E2 / GcvH)</text>
    <rect x="620" y="100" width="210" height="70" rx="10" fill="#dcefec" stroke="#0e6b66"/><text x="725" y="132" font-weight="600">lipoyl domain</text><text x="725" y="152" font-size="12" fill="#56655f">2 S inserted at C6, C8</text>
  </g>
  <g stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"><path d="M202 135 L296 135"/><path d="M512 135 L616 135"/></g>
  <g font-size="13" font-weight="600" fill="#0e6b66" text-anchor="middle"><text x="249" y="124">LipB</text><text x="564" y="124">LipA</text></g>
  <!-- Bsub relay -->
  <text x="30" y="232" font-size="15" font-weight="600" fill="#0e6b66">B. subtilis GcvH relay (PMID:21338420, PMID:21338421)</text>
  <g font-size="14" text-anchor="middle" fill="#15201e">
    <rect x="30" y="250" width="150" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="105" y="282">octanoyl-ACP</text>
    <rect x="260" y="250" width="170" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="345" y="282">octanoyl-GcvH</text>
    <rect x="510" y="250" width="190" height="70" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="605" y="282">octanoyl-E2 domains</text>
    <rect x="780" y="250" width="150" height="70" rx="10" fill="#dcefec" stroke="#0e6b66"/><text x="855" y="282" font-weight="600">lipoyl-E2</text>
  </g>
  <g stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"><path d="M182 285 L256 285"/><path d="M432 285 L506 285"/><path d="M702 285 L776 285"/></g>
  <g font-size="13" font-weight="600" fill="#0e6b66" text-anchor="middle"><text x="219" y="274">LipM</text><text x="469" y="274">LipL</text><text x="739" y="274">LipA</text></g>
  <g font-size="11.5" fill="#56655f" text-anchor="middle"><text x="219" y="306">octanoylates</text><text x="469" y="306">transfers</text><text x="739" y="306">sulfurates</text></g>
  <path d="M30 360 L930 360" stroke="#8fa39c"/>
  <text x="30" y="394" font-size="15" fill="#15201e">Every step modifies a lipoyl domain. The experimental readout is almost always</text>
  <text x="30" y="418" font-size="15" fill="#15201e">the lipoylation state of carrier proteins, which is why curators used both terms for the same enzymes.</text>
  <text x="30" y="456" font-size="14" fill="#56655f">4 of the 12 experimental rows sit on B. subtilis lipM, lipL and gcvH; none of the three is reviewed here yet.</text>
  <text x="30" y="480" font-size="14" fill="#56655f">Module: modules/endogenous_protein_lipoylation.yaml is grounded on GO:0009249.</text>
</svg>
