<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d8a4b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7657a3"/></marker>
  </defs>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">The IEP leap: abundance moved, therefore it takes part?</text>
  <!-- left: bystander -->
  <text x="40" y="84" font-size="16" font-weight="600" fill="#7657a3">Bystander (rat Gstt1)</text>
  <g font-size="13" fill="#15201e">
    <rect x="40" y="104" width="130" height="36" rx="6" fill="#f4f7f6" stroke="#8fa39c"/><text x="105" y="127" text-anchor="middle">salicylic acid</text>
    <rect x="40" y="150" width="130" height="36" rx="6" fill="#f4f7f6" stroke="#8fa39c"/><text x="105" y="173" text-anchor="middle">selenium</text>
    <rect x="40" y="196" width="130" height="36" rx="6" fill="#f4f7f6" stroke="#8fa39c"/><text x="105" y="219" text-anchor="middle">vitamin E</text>
    <rect x="40" y="242" width="130" height="36" rx="6" fill="#f4f7f6" stroke="#8fa39c"/><text x="105" y="265" text-anchor="middle">xenobiotic</text>
  </g>
  <g stroke="#56655f" stroke-width="1.5" fill="none" marker-end="url(#g)">
    <path d="M170 122 L240 185"/><path d="M170 168 L240 190"/><path d="M170 214 L240 195"/><path d="M170 260 L240 200"/>
  </g>
  <rect x="245" y="165" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="320" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">Gstt1 mRNA ↑</text>
  <text x="320" y="208" text-anchor="middle" font-size="12" fill="#56655f">one induction paper each</text>
  <rect x="245" y="300" width="150" height="56" rx="8" fill="#ffffff" stroke="#0e6b66"/>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">same enzyme,</text>
  <text x="320" y="342" text-anchor="middle" font-size="12" fill="#15201e">same GST activity</text>
  <path d="M320 221 V296" stroke="#56655f" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="40" y="400" font-size="13" fill="#15201e">IEP rows: 4 sibling "response to X" terms</text>
  <text x="40" y="420" font-size="13" fill="#15201e">Verdict on all 4: <tspan font-weight="600" fill="#7657a3">MARK_AS_OVER_ANNOTATED</tspan></text>
  <text x="40" y="440" font-size="12" fill="#56655f">true, but reads as a stimulus specialist</text>
  <line x1="480" y1="70" x2="480" y2="470" stroke="#dcefec" stroke-width="2"/>
  <!-- right: agent -->
  <text x="520" y="84" font-size="16" font-weight="600" fill="#1d8a4b">Agent (worm hsp-16.2)</text>
  <rect x="520" y="165" width="120" height="56" rx="6" fill="#f4f7f6" stroke="#8fa39c"/><text x="580" y="198" text-anchor="middle" font-size="13" fill="#15201e">heat</text>
  <path d="M640 193 H690" stroke="#56655f" stroke-width="1.5" marker-end="url(#g)"/>
  <rect x="695" y="165" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="770" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">HSP-16.2 made</text>
  <text x="770" y="208" text-anchor="middle" font-size="12" fill="#56655f">small heat-shock protein</text>
  <path d="M770 221 V296" stroke="#1d8a4b" stroke-width="2" marker-end="url(#k)"/>
  <rect x="695" y="300" width="150" height="56" rx="8" fill="#ffffff" stroke="#1d8a4b"/>
  <text x="770" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">holds unfolded</text>
  <text x="770" y="342" text-anchor="middle" font-size="12" fill="#15201e">proteins (sHSP)</text>
  <text x="520" y="400" font-size="13" fill="#15201e">IEP row: response to heat</text>
  <text x="520" y="420" font-size="13" fill="#15201e">Verdict: <tspan font-weight="600" fill="#1d8a4b">ACCEPT</tspan></text>
  <text x="520" y="440" font-size="12" fill="#56655f">being made when hot is the job itself</text>
  <text x="40" y="495" font-size="13" fill="#56655f">GO's test: is the product "required for the response to occur"? The induction experiment does not answer it.</text>
</svg>
