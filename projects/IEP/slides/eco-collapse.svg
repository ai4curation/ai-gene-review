<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker></defs>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">Why 1,110 CC rows break GORULE:0000006</text>
  <!-- ECO classes -->
  <rect x="80" y="80" width="330" height="56" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="245" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">ECO:0000270</text>
  <text x="245" y="123" text-anchor="middle" font-size="12" fill="#56655f">expression pattern evidence → IEP</text>
  <rect x="80" y="190" width="330" height="56" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="245" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">ECO:0000284</text>
  <text x="245" y="233" text-anchor="middle" font-size="12" fill="#56655f">protein expression evidence</text>
  <rect x="540" y="80" width="330" height="56" rx="8" fill="#ffffff" stroke="#1d8a4b"/>
  <text x="705" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">ECO:0000314</text>
  <text x="705" y="123" text-anchor="middle" font-size="12" fill="#56655f">direct assay evidence → IDA</text>
  <rect x="310" y="310" width="340" height="66" rx="8" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="480" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">ECO:0000279</text>
  <text x="480" y="357" text-anchor="middle" font-size="12" fill="#15201e">qualitative western immunoblotting</text>
  <g stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M400 310 L260 250"/><path d="M245 190 V140"/><path d="M570 310 L690 140"/>
  </g>
  <text x="240" y="290" font-size="12" fill="#56655f">is_a</text><text x="652" y="240" font-size="12" fill="#56655f">is_a (direct parent)</text>
  <!-- outcome -->
  <rect x="40" y="410" width="420" height="72" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="56" y="436" font-size="14" font-weight="600" fill="#bd3a30">GAF pipeline picks IEP</text>
  <text x="56" y="458" font-size="13" fill="#15201e">a synaptosome/PSD localization assay lands</text>
  <text x="56" y="476" font-size="13" fill="#15201e">in a BP-only code: 1,110 of 1,147 CC violations</text>
  <rect x="500" y="410" width="420" height="72" rx="8" fill="#e9f5ee" stroke="#1d8a4b"/>
  <text x="516" y="436" font-size="14" font-weight="600" fill="#1d8a4b">Proposed fix: choose parent by aspect</text>
  <text x="516" y="458" font-size="13" fill="#15201e">CC annotation → IDA, as GORULE:0000006</text>
  <text x="516" y="476" font-size="13" fill="#15201e">itself says. No curation needed.</text>
</svg>
