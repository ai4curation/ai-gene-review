<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">% of reviewed rows ACCEPTed, by evidence code</text>
  <rect x="620" y="24" width="14" height="14" fill="#8fa39c"/><text x="640" y="36" font-size="13" fill="#15201e">% ACCEPT</text>
  <rect x="740" y="24" width="14" height="14" fill="#0e6b66"/><text x="760" y="36" font-size="13" fill="#15201e">% term in core_functions</text>
  <!-- scale: 100% = 600 px from x=110 -->
  <g font-size="14" fill="#15201e">
    <text x="40" y="80">TAS</text><rect x="110" y="66" width="443" height="14" fill="#8fa39c"/><rect x="110" y="80" width="337" height="10" fill="#0e6b66"/><text x="560" y="80">73.9 / 56.2</text>
    <text x="40" y="125">IBA</text><rect x="110" y="111" width="434" height="14" fill="#8fa39c"/><rect x="110" y="125" width="305" height="10" fill="#0e6b66"/><text x="551" y="125">72.3 / 50.8</text>
    <text x="40" y="170">IDA</text><rect x="110" y="156" width="416" height="14" fill="#8fa39c"/><rect x="110" y="170" width="263" height="10" fill="#0e6b66"/><text x="533" y="170">69.3 / 43.9</text>
    <text x="40" y="215">IEA</text><rect x="110" y="201" width="304" height="14" fill="#8fa39c"/><rect x="110" y="215" width="176" height="10" fill="#0e6b66"/><text x="421" y="215">50.6 / 29.4</text>
    <text x="40" y="260">IMP</text><rect x="110" y="246" width="290" height="14" fill="#8fa39c"/><rect x="110" y="260" width="197" height="10" fill="#0e6b66"/><text x="407" y="260">48.3 / 32.8</text>
    <text x="40" y="305">IGI</text><rect x="110" y="291" width="272" height="14" fill="#8fa39c"/><rect x="110" y="305" width="160" height="10" fill="#0e6b66"/><text x="389" y="305">45.3 / 26.6</text>
    <text x="40" y="350">ISO</text><rect x="110" y="336" width="199" height="14" fill="#8fa39c"/><rect x="110" y="350" width="97" height="10" fill="#0e6b66"/><text x="316" y="350">33.1 / 16.2</text>
    <text x="40" y="395" font-weight="600" fill="#bd3a30">IEP</text><rect x="110" y="381" width="135" height="14" fill="#bd3a30"/><rect x="110" y="395" width="60" height="10" fill="#0e6b66"/><text x="252" y="395" font-weight="600" fill="#bd3a30">22.5 / 10.0</text>
    <text x="40" y="440">IPI</text><rect x="110" y="426" width="64" height="14" fill="#8fa39c"/><rect x="110" y="440" width="26" height="10" fill="#0e6b66"/><text x="181" y="440">10.7 / 4.3</text>
  </g>
  <text x="560" y="300" font-size="14" fill="#15201e">IEP's missing ACCEPTs went to</text>
  <text x="560" y="322" font-size="14" fill="#15201e"><tspan font-weight="600" fill="#0e6b66">KEEP_AS_NON_CORE: 55.6%</tspan>, the highest</text>
  <text x="560" y="344" font-size="14" fill="#15201e">share of any code. True but peripheral.</text>
  <text x="560" y="380" font-size="13" fill="#56655f">IPI is low because of protein binding.</text>
  <text x="40" y="490" font-size="13" fill="#56655f">Source: projects/IEP/iep-corpus-survey.md (repo AI reviews; IEP n = 550 rows).</text>
</svg>
