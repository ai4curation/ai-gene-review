# Per-organism flags for failing pathway terms.
# O = suspect over-annotation (organism appears to lack the ligand or receptor the term names,
#     or the receptor class itself is contested in that lineage).
# G = misapplied or generic term (another lineage's term, a regulation-type subterm, or a generic parent).
# X = no host protein ligand in this organism, where the term itself does not say so
#     (e.g. a generic adenylate cyclase GPCR term that in yeast is glucose sensing).
# A flag takes precedence over a term label in curated/term_labels.yaml, so the same term can
# be X in one organism and O in another (e.g. LPS signaling: X in vertebrates, O in worm).
# Manual judgement (Claude Code, Oct and Nov 2026); the O calls rest on background knowledge,
# not checked data.
organism_flags:
  human:
  - term: GO:0008063
    name: Toll signaling pathway
    category: G
    note: Drosophila Toll pathway term applied to human IRAK/MYD88; TLR terms are the human equivalents.
  - term: GO:0033626
    name: positive regulation of integrin activation by cell surface receptor linked signal transduction
    category: G
    note: A regulation term that sits under the pathway branch; only CDH17 and P2RY12 annotated.
  - term: GO:1990117
    name: B cell receptor apoptotic signaling pathway
    category: G
    note: Annotated genes (BAX, NFKBIZ) are downstream apoptosis machinery.
  - term: GO:0038097
    name: positive regulation of mast cell activation by Fc-epsilon receptor signaling pathway
    category: G
    note: Single NR4A3 annotation to a regulation-flavoured subterm.
  fly:
  - term: GO:0031663
    name: lipopolysaccharide-mediated signaling pathway
    category: O
    note: Flies do not sense LPS through a TLR4-like route.
  - term: GO:0034142
    name: toll-like receptor 4 signaling pathway
    category: O
    note: No TLR4 orthology in flies.
  - term: GO:0048011
    name: neurotrophin TRK receptor signaling pathway
    category: O
    note: Flies have no Trk receptors.
  - term: GO:0033211
    name: adiponectin-activated signaling pathway
    category: O
    note: Flies have AdipoR but no adiponectin.
  - term: GO:0038158
    name: granulocyte colony-stimulating factor signaling pathway
    category: O
    note: Flies have no G-CSF.
  - term: GO:0038180
    name: nerve growth factor signaling pathway
    category: O
    note: Flies have no NGF.
  pombe:
  - term: GO:0007166
    name: cell surface receptor signaling pathway
    category: G
    note: Used directly on wsc1, a cell-wall stress sensor with no protein ligand.
  - term: GO:0007189
    name: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    category: X
    note: Glucose sensing through the git3 GPCR; glucose is the ligand.
  yeast:
  - term: GO:0007188
    name: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
    category: X
    note: Glucose sensing through Gpr1/Gpa2 and cAMP; glucose is the ligand.
  - term: GO:0007189
    name: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    category: X
    note: Glucose sensing through Gpr1/Gpa2 and cAMP; glucose is the ligand.
  - term: GO:0007193
    name: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    category: G
    note: Only IRA1 and IRA2, Ras GTPase-activating proteins of the Ras/cAMP branch; no receptor or ligand.
  - term: GO:0007166
    name: cell surface receptor signaling pathway
    category: G
    note: Used directly on BPH1 and LEM3.
  - term: GO:0033209
    name: tumor necrosis factor-mediated signaling pathway
    category: O
    note: Yeast has no TNF or TNF receptor; the single gene is BPH1.
  mouse:
  - term: GO:0038112
    name: interleukin-8-mediated signaling pathway
    category: O
    note: Mice have no CXCL8 gene; only the receptors Cxcr1 and Cxcr2 carry this term.
  rat:
  - term: GO:0038112
    name: interleukin-8-mediated signaling pathway
    category: O
    note: Rats have no CXCL8 gene; only the receptors Cxcr1 and Cxcr2 carry this term.
  worm:
  - term: GO:0007168
    name: receptor guanylyl cyclase signaling pathway
    category: X
    note: C. elegans receptor guanylyl cyclases are mostly sensory (salt, CO2, temperature); no natriuretic peptide is known.
  - term: GO:0007224
    name: smoothened signaling pathway
    category: O
    note: C. elegans has no Smoothened or Hedgehog.
  - term: GO:0033211
    name: adiponectin-activated signaling pathway
    category: O
    note: C. elegans has AdipoR homologues (paqr-1, paqr-2) but no adiponectin.
  - term: GO:0038180
    name: nerve growth factor signaling pathway
    category: O
    note: C. elegans has no NGF.
  - term: GO:0034142
    name: toll-like receptor 4 signaling pathway
    category: O
    note: C. elegans has no TLR4 orthologue.
  - term: GO:0031663
    name: lipopolysaccharide-mediated signaling pathway
    category: O
    note: C. elegans does not sense LPS through a TLR4-like route.
  arabidopsis:
  - term: GO:0007186
    name: G protein-coupled receptor signaling pathway
    category: O
    note: Plants have heterotrimeric G proteins, but a canonical plant GPCR is contested (the receptor role of GCR1 is disputed).
  - term: GO:0007188
    name: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
    category: O
    note: Plant heterotrimeric G-protein genes; a canonical plant GPCR is contested.
  - term: GO:0007189
    name: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    category: O
    note: Plant heterotrimeric G-protein genes; a canonical plant GPCR is contested.
  - term: GO:0007200
    name: phospholipase C-activating G protein-coupled receptor signaling pathway
    category: G
    note: Only diacylglycerol kinases (DGK1-7), neither receptors nor ligands; IEA rows only.
  - term: GO:0002220
    name: innate immune response activating cell surface receptor signaling pathway
    category: G
    note: Generic parent mixing the chitin receptors CERK1 and LYK3 (ligand chitin) with the intracellular NLRs RPS2 and RPS5.
  dicty:
  - term: GO:0007259
    name: cell surface receptor signaling pathway via JAK-STAT
    category: G
    note: Dictyostelium has STATs but no JAK; its STATs respond to cAMP and DIF, small molecules.
  - term: GO:0007200
    name: phospholipase C-activating G protein-coupled receptor signaling pathway
    category: X
    note: Dictyostelium GPCR chemotaxis responds to cAMP and folate.
  - term: GO:0007193
    name: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    category: X
    note: Dictyostelium GPCR chemotaxis responds to cAMP and folate.
  - term: GO:0007168
    name: receptor guanylyl cyclase signaling pathway
    category: X
    note: Guanylyl cyclase signaling downstream of cAMP chemotaxis.
  - term: GO:0007224
    name: smoothened signaling pathway
    category: O
    note: Dictyostelium has no Hedgehog ligand.
  - term: GO:0033209
    name: tumor necrosis factor-mediated signaling pathway
    category: O
    note: Dictyostelium has no TNF.
  - term: GO:0007219
    name: Notch signaling pathway
    category: O
    note: Dictyostelium has presenilins but no Notch or DSL ligand.
