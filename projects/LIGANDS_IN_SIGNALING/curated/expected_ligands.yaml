# Expected protein ligands per pathway term, by lineage (vertebrate symbols are matched
# case-insensitively in human, mouse, rat and zebrafish; the other lineages each have one
# organism: fly, worm, budding yeast, fission yeast, Arabidopsis, Dictyostelium).
# Used by scripts/triage.py when no other species passes the term.
# Manual judgement (Claude Code, Oct 2026). This is the prior knowledge that should move
# into curated modules: each entry is a candidate ligand step.
