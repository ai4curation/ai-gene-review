<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">Same organelle, same pipeline: vagueness predicts the flag</text>
  <!-- mitochondrion -->
  <ellipse cx="330" cy="280" rx="270" ry="160" fill="#fbf1e6" stroke="#b8620f" stroke-width="4"/>
  <ellipse cx="330" cy="280" rx="248" ry="140" fill="#e8f1ee" stroke="#0e6b66" stroke-width="3"/>
  <path d="M110 280 Q140 180 170 280 Q200 380 230 280 Q260 180 290 280 Q320 380 350 280 Q380 180 410 280 Q440 380 470 280 Q500 180 530 280" fill="none" stroke="#0e6b66" stroke-width="3"/>
  <text x="330" y="222" text-anchor="middle" font-size="14" fill="#15201e">matrix</text>
  <!-- labels -->
  <g font-size="13">
    <line x1="560" y1="170" x2="640" y2="120" stroke="#b8620f"/>
    <text x="645" y="112" font-size="14" font-weight="600" fill="#b8620f">outer membrane</text>
    <text x="645" y="130" fill="#56655f">GO:0005741 (rat Tp53 MODIFY target)</text>
    <line x1="560" y1="330" x2="640" y2="380" stroke="#0e6b66"/>
    <text x="645" y="376" font-size="14" font-weight="600" fill="#0e6b66">SL-0168 inner membrane</text>
    <text x="645" y="394" fill="#15201e">10% issue rate (n=21)</text>
    <line x1="330" y1="228" x2="640" y2="250" stroke="#8fa39c" stroke-dasharray="4 3"/>
    <text x="645" y="246" font-size="14" font-weight="600" fill="#0e6b66">SL-0170 matrix</text>
    <text x="645" y="264" fill="#15201e">6% issue rate (n=16)</text>
  </g>
  <!-- vague -->
  <rect x="620" y="430" width="310" height="66" rx="10" fill="#fbeceb" stroke="#bd3a30"/>
  <text x="775" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#bd3a30">SL-0171 "Mitochondrion membrane"</text>
  <text x="775" y="478" text-anchor="middle" font-size="13" fill="#15201e">which one? 36% issue rate (n=14)</text>
  <path d="M620 450 Q560 460 520 400" fill="none" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M620 470 Q560 470 480 420" fill="none" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="40" y="490" font-size="13" fill="#56655f">Precise terms still fail, but informatively: a wrong sub-compartment can be corrected.</text>
</svg>
