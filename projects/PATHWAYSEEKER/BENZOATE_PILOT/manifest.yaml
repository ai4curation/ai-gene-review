title: PathwaySeeker Benzoate Pilot
scope: >-
  Pilot integration of real PathwaySeeker output for a benzoate/catechol target
  pathway. The input is the public PathwaySeeker example output from
  pnnl/PathwaySeeker. The target pathway is the benzoate-to-catechol and
  catechol ortho-cleavage route used in the first pilot. The integration result
  is allowed to be negative or partial.

target_pathway:
  name: Benzoate to catechol and catechol ortho-cleavage
  expected_reactions:
    - id: R05621
      label: benzoate 1,2-dioxygenation
    - id: R00813
      label: dihydrodiol dehydrogenation to catechol
    - id: R00817
      label: catechol ortho-cleavage to cis,cis-muconate
    - id: R06989
      label: muconate cycloisomerization
    - id: R06990
      label: muconolactone isomerization
    - id: R02991
      label: 3-oxoadipate enol-lactone hydrolysis
  target_compounds:
    - id: C00180
      label: Benzoate
    - id: C06321
      label: (1R,6S)-1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate
    - id: C00090
      label: Catechol
    - id: C02480
      label: cis,cis-Muconate
    - id: C14610
      label: (S)-5-oxo-2,5-dihydrofuran-2-acetate
    - id: C03586
      label: 3-oxoadipate enol-lactone
    - id: C00846
      label: 3-oxoadipate

integration_implications:
  - >-
    A real PathwaySeeker import must distinguish exact target-pathway reactions
    from looser compound-neighborhood reactions. Compound adjacency alone should
    not seed GO annotations.
  - >-
    Missing target reactions are meaningful evidence. The importer should record
    absent or partial pathway support instead of backfilling from KEGG modules.
  - >-
    The public example data uses JGI Trave1 protein identifiers and KO-derived
    proteomics evidence, so it cannot directly update the P. putida KT2440 gene
    reviews without an organism-specific protein mapping.
  - >-
    Proteomics-only PathwaySeeker hits should be represented as pathway evidence
    or prediction candidates, not accepted GO annotations, unless literature or
    curated review support is added.
