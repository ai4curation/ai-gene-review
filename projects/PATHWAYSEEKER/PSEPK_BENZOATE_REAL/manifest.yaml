title: PathwaySeeker PSEPK Benzoate Real-Omics Pilot
organism: PSEPK
taxon:
  id: NCBITaxon:160488
  label: Pseudomonas putida KT2440
scope: >-
  One-pathway pilot for integrating PathwaySeeker-compatible graph artifacts with
  AI Gene Review. The real omics input is the public MetaboLights MTBLS1715
  processed metabolomics table for P. putida KT2440 grown with
  [U-13C6]-glucose plus unlabeled benzoate. KEGG supplies reaction topology;
  it is not counted as omics evidence. AIGR gene reviews supply reviewed gene
  anchors.
source_data:
  metabolights_accession: MTBLS1715
  metabolights_url: https://www.ebi.ac.uk/metabolights/MTBLS1715
  pride_accession: PXD013605
  pride_url: https://www.ebi.ac.uk/pride/archive/projects/PXD013605
  publication:
    id: PMID:33273114
    doi: 10.1073/pnas.2016380117
    title: Hierarchical routing in carbon metabolism favors iron-scavenging strategy in iron-deficient soil Pseudomonas species
sample_context_compounds:
  - id: C00031
    label: D-Glucose
    source: MTBLS1715 sample factor value
  - id: C00180
    label: Benzoate
    source: MTBLS1715 sample factor value
