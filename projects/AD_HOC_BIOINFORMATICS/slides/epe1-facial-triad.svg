<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">JmjC demethylases hold Fe(II) with a facial triad: His · Asp/Glu · His</text>
  <!-- active -->
  <g transform="translate(40,70)">
    <rect width="420" height="300" rx="14" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="210" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d8a4b">Active JmjC demethylase (e.g. KDM2A)</text>
    <circle cx="210" cy="160" r="34" fill="#b8620f"/>
    <text x="210" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Fe²⁺</text>
    <g font-size="18" font-weight="bold" fill="#15201e">
      <rect x="40" y="70" width="84" height="40" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="82" y="96" text-anchor="middle">His</text>
      <rect x="296" y="70" width="84" height="40" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="338" y="96" text-anchor="middle">Asp/Glu</text>
      <rect x="168" y="238" width="84" height="40" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="210" y="264" text-anchor="middle">His</text>
    </g>
    <g stroke="#1d8a4b" stroke-width="4">
      <line x1="118" y1="110" x2="184" y2="140"/><line x1="302" y1="110" x2="236" y2="140"/><line x1="210" y1="238" x2="210" y2="194"/>
    </g>
    <text x="210" y="296" text-anchor="middle" font-size="15" fill="#56655f">+ 2-oxoglutarate → hydroxylates methyl-lysine</text>
  </g>
  <!-- Epe1 -->
  <g transform="translate(500,70)">
    <rect width="420" height="300" rx="14" fill="#fbeeec" stroke="#bd3a30"/>
    <text x="210" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#bd3a30">S. pombe Epe1 JmjC domain</text>
    <circle cx="210" cy="160" r="34" fill="none" stroke="#b8620f" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="210" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8620f">Fe²⁺?</text>
    <g font-size="18" font-weight="bold" fill="#15201e">
      <rect x="40" y="70" width="84" height="40" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="82" y="96" text-anchor="middle">H297</text>
      <rect x="296" y="70" width="84" height="40" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="338" y="96" text-anchor="middle">E299</text>
      <rect x="168" y="238" width="84" height="40" rx="8" fill="#bd3a30"/><text x="210" y="264" text-anchor="middle" fill="#ffffff">Y370</text>
    </g>
    <g stroke="#1d8a4b" stroke-width="4">
      <line x1="118" y1="110" x2="184" y2="140"/><line x1="302" y1="110" x2="236" y2="140"/>
    </g>
    <line x1="210" y1="238" x2="210" y2="198" stroke="#bd3a30" stroke-width="4" stroke-dasharray="5 5"/>
    <text x="210" y="296" text-anchor="middle" font-size="15" fill="#56655f">Tyr at the third ligand, as in dead PHF2</text>
  </g>
  <!-- outcome -->
  <rect x="40" y="396" width="880" height="100" rx="12" fill="#dcefec"/>
  <text x="480" y="428" text-anchor="middle" font-size="18" font-weight="bold" fill="#0e6b66">Review outcome for Epe1: 7 catalytic / metal rows REMOVE, heterochromatin rows ACCEPT</text>
  <text x="480" y="458" text-anchor="middle" font-size="14" fill="#15201e">histone demethylase (IBA) · H3K9 (IDA, EXP) · H3K36/K36me2 demethylase · dioxygenase · oxidoreductase · metal ion binding (IEA)</text>
  <text x="480" y="482" text-anchor="middle" font-size="14" fill="#56655f">Residues checked against Epe1-uniprot.txt (O94603, 948 aa); triad from the blinded OpenScientist report</text>
</svg>
