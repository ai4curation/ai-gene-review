<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">Engineered chitin sensor: receptor pairing rebuilds GFP</text>
<text x="30" y="58" font-size="13" fill="#56655f">Boone et al. 2025, Plant Biotechnol J (doi:10.1111/pbi.70523), as summarized on the project page</text>
<g font-size="13">
<!-- left panel: no chitin -->
<text x="220" y="95" text-anchor="middle" font-weight="bold" fill="#15201e" font-size="15">No chitin</text>
<rect x="40" y="200" width="360" height="30" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="160" y="252" fill="#56655f">plasma membrane</text>
<!-- LYK5 -->
<rect x="100" y="140" width="40" height="60" rx="18" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="120" y="130" text-anchor="middle" fill="#0e6b66" font-weight="bold">LYK5</text>
<rect x="114" y="200" width="12" height="30" fill="#0e6b66"/>
<rect x="100" y="230" width="40" height="30" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="120" y="250" text-anchor="middle" fill="#15201e" font-size="11">Int-N</text>
<rect x="100" y="262" width="40" height="30" rx="4" fill="#b7e4c7" stroke="#1d8a4b"/><text x="120" y="282" text-anchor="middle" fill="#15201e" font-size="11">GFP-N</text>
<!-- CERK1 -->
<rect x="300" y="140" width="40" height="60" rx="18" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="320" y="130" text-anchor="middle" fill="#0e6b66" font-weight="bold">CERK1</text>
<rect x="314" y="200" width="12" height="30" fill="#0e6b66"/>
<rect x="300" y="230" width="40" height="30" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="320" y="250" text-anchor="middle" fill="#15201e" font-size="11">Int-C</text>
<rect x="300" y="262" width="40" height="30" rx="4" fill="#b7e4c7" stroke="#1d8a4b"/><text x="320" y="282" text-anchor="middle" fill="#15201e" font-size="11">GFP-C</text>
<text x="320" y="312" text-anchor="middle" fill="#bd3a30">Y428F kinase-dead</text>
<text x="220" y="350" text-anchor="middle" fill="#56655f">halves apart: no fluorescence</text>
<!-- arrow -->
<line x1="430" y1="210" x2="500" y2="210" stroke="#0e6b66" stroke-width="3"/><polygon points="500,202 515,210 500,218" fill="#0e6b66"/>
<text x="472" y="195" text-anchor="middle" fill="#0e6b66" font-weight="bold">+ chitin</text>
<!-- right panel -->
<text x="740" y="95" text-anchor="middle" font-weight="bold" fill="#15201e" font-size="15">Chitin bound</text>
<rect x="540" y="200" width="390" height="30" fill="#e8f1ee" stroke="#8fa39c"/>
<g stroke="#7657a3" stroke-width="4" fill="none"><path d="M700 120 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8"/></g>
<text x="770" y="115" fill="#7657a3" font-weight="bold">chitin</text>
<rect x="690" y="140" width="40" height="60" rx="18" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="660" y="160" text-anchor="end" fill="#0e6b66" font-weight="bold">LYK5</text>
<rect x="734" y="140" width="40" height="60" rx="18" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="800" y="160" fill="#0e6b66" font-weight="bold">CERK1</text>
<rect x="704" y="200" width="12" height="30" fill="#0e6b66"/><rect x="748" y="200" width="12" height="30" fill="#0e6b66"/>
<rect x="690" y="230" width="84" height="30" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="732" y="250" text-anchor="middle" fill="#15201e" font-size="11">intein splices</text>
<rect x="690" y="270" width="84" height="44" rx="10" fill="#1d8a4b"/><text x="732" y="297" text-anchor="middle" fill="#ffffff" font-weight="bold">GFP</text>
<g stroke="#1d8a4b" stroke-width="2"><line x1="782" y1="292" x2="812" y2="292"/><line x1="778" y1="275" x2="802" y2="258"/><line x1="778" y1="309" x2="802" y2="326"/><line x1="682" y1="292" x2="652" y2="292"/></g>
<text x="732" y="350" text-anchor="middle" fill="#1d8a4b" font-weight="bold">heterodimer → trans-splicing → fluorescence</text>
<!-- footer -->
<rect x="40" y="400" width="890" height="90" rx="10" fill="#ffffff" stroke="#8fa39c"/>
<text x="55" y="426" fill="#15201e" font-weight="bold">Why the curation matters</text>
<text x="55" y="448" fill="#15201e">The readout is only as specific as the receptor pair: CERK1 and LYK5 chitin binding and pairing,</text>
<text x="55" y="468" fill="#15201e">and the kinase-dead CERK1 isolating dimerization from downstream signalling.</text>
</g>
</svg>
