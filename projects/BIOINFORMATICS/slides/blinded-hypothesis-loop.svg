<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker></defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">Two independent routes to the same curation question</text>
  <!-- source -->
  <rect x="30" y="200" width="190" height="110" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="125" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e6b66">Review row</text>
  <text x="125" y="256" text-anchor="middle" font-size="14" fill="#15201e">"gene G has</text>
  <text x="125" y="274" text-anchor="middle" font-size="14" fill="#15201e">function F"</text>
  <text x="125" y="296" text-anchor="middle" font-size="12" fill="#56655f">e.g. Epe1 · GO:0032452</text>
  <!-- local route -->
  <rect x="300" y="80" width="260" height="120" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="430" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#15201e">Local bioinformatics</text>
  <text x="430" y="134" text-anchor="middle" font-size="13" fill="#15201e">target + active controls</text>
  <text x="430" y="154" text-anchor="middle" font-size="13" fill="#15201e">residue map · AlphaFold · panel</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#56655f">G-bioinformatics/RESULTS.md</text>
  <!-- OS route -->
  <rect x="300" y="310" width="260" height="120" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="430" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#15201e">OpenScientist run</text>
  <text x="430" y="364" text-anchor="middle" font-size="13" fill="#15201e">seed context only</text>
  <text x="430" y="384" text-anchor="middle" font-size="13" fill="#15201e">verdict + evidence table</text>
  <text x="430" y="412" text-anchor="middle" font-size="12" fill="#56655f">G-hypotheses/&lt;slug&gt;/openscientist.md</text>
  <!-- blind wall -->
  <line x1="300" y1="255" x2="560" y2="255" stroke="#bd3a30" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="430" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#bd3a30">RESULTS.md withheld from the prompt</text>
  <!-- compare -->
  <rect x="640" y="200" width="150" height="110" rx="12" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="715" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e6b66">Compare</text>
  <text x="715" y="262" text-anchor="middle" font-size="13" fill="#15201e">converge ·</text>
  <text x="715" y="280" text-anchor="middle" font-size="13" fill="#15201e">refine · contradict</text>
  <!-- action -->
  <rect x="830" y="210" width="110" height="90" rx="12" fill="#bd3a30"/>
  <text x="885" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">action +</text>
  <text x="885" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">file: ref</text>
  <g stroke="#56655f" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M220,235 C260,200 270,150 298,145"/>
    <path d="M220,275 C260,310 270,365 298,370"/>
    <path d="M560,140 C610,150 620,210 638,235"/>
    <path d="M560,370 C610,360 620,300 638,280"/>
    <path d="M790,255 L828,255"/>
  </g>
  <text x="480" y="470" text-anchor="middle" font-size="15" fill="#15201e">Epe1: both routes converge on REMOVE; the blinded run also found the real defect (Tyr370).</text>
  <text x="480" y="494" text-anchor="middle" font-size="15" fill="#15201e">pmp20: runs agree on REMOVE for thioredoxin peroxidase, but one refines the local reading (1-Cys Prx).</text>
</svg>
