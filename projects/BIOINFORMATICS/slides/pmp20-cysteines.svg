<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">pmp20 against three active Prx5-type controls</text>
<text x="480" y="62" text-anchor="middle" font-size="14" fill="#56655f">Bars drawn to scale (3 px per residue); data from pmp20-bioinformatics/results/main/</text>
<text x="30" y="125" font-size="14" font-weight="bold" fill="#15201e" textLength="190" lengthAdjust="spacingAndGlyphs">tpx1, S. pombe (O74887)</text>
<rect x="230" y="109" width="576" height="22" rx="4" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="814" y="125" font-size="12" fill="#56655f">192 aa</text>
<rect x="368" y="101" width="8" height="38" fill="#1d8a4b"/><text x="372" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d8a4b">C48</text>
<rect x="732" y="101" width="8" height="38" fill="#0e6b66"/><text x="736" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e6b66">C169</text>
<text x="30" y="205" font-size="14" font-weight="bold" fill="#15201e" textLength="190" lengthAdjust="spacingAndGlyphs">PRDX5, human (P30044)</text>
<rect x="230" y="189" width="642" height="22" rx="4" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="880" y="205" font-size="12" fill="#56655f">214 aa</text>
<rect x="524" y="181" width="8" height="38" fill="#1d8a4b"/><text x="528" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d8a4b">C100</text>
<rect x="836" y="181" width="8" height="38" fill="#0e6b66"/><text x="840" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e6b66">C204</text>
<text x="30" y="285" font-size="14" font-weight="bold" fill="#15201e" textLength="190" lengthAdjust="spacingAndGlyphs">Aspf3/Prx5, A. fumigatus (O43099)</text>
<rect x="230" y="269" width="504" height="22" rx="4" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="742" y="285" font-size="12" fill="#56655f">168 aa</text>
<rect x="408" y="261" width="8" height="38" fill="#1d8a4b"/><text x="412" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d8a4b">C61</text>
<rect x="318" y="261" width="8" height="38" fill="#0e6b66"/><text x="322" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e6b66">C31</text>
<text x="30" y="375" font-size="14" font-weight="bold" fill="#bd3a30" textLength="190" lengthAdjust="spacingAndGlyphs">pmp20, S. pombe (O14313)</text>
<rect x="230" y="359" width="468" height="22" rx="4" fill="#fbeeec" stroke="#bd3a30"/>
<text x="706" y="375" font-size="12" fill="#56655f">156 aa</text>
<rect x="354" y="351" width="8" height="38" fill="#1d8a4b"/><text x="358" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d8a4b">C43</text>
<line x1="322" y1="320" x2="294" y2="358" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 4"/>
<text x="294" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#bd3a30">V22</text>
<line x1="840" y1="240" x2="666" y2="358" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 4"/>
<text x="666" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#bd3a30">I146</text>
<line x1="736" y1="160" x2="736" y2="356" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 4"/><text x="742" y="354" font-size="12" fill="#bd3a30">gap</text>
<rect x="30" y="432" width="16" height="16" fill="#1d8a4b"/><text x="54" y="445" font-size="14" fill="#15201e">peroxidatic Cys (Cp): kept in pmp20 as C43</text>
<rect x="430" y="432" width="16" height="16" fill="#0e6b66"/><text x="454" y="445" font-size="14" fill="#15201e">resolving Cys (Cr): aligns to V22, I146 or a gap</text>
<text x="30" y="480" font-size="14" fill="#56655f">27-protein Prx5 panel: 23 have Cp + Cr, 4 are Cp-only, pmp20 among them.</text>
<text x="30" y="500" font-size="14" fill="#56655f">Cp-only is also the normal 1-Cys peroxiredoxin layout, so this supports the negative assay rather than replacing it.</text>
</svg>