<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#56655f"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#bd3a30"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">Genome-level coherence: is every required part annotated somewhere?</text>
<!-- left: GAF -->
<rect x="30" y="70" width="200" height="300" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="130" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">EcoCyc GAF</text>
<text x="130" y="116" font-size="12" text-anchor="middle" fill="#56655f">E. coli MG1655</text>
<g font-size="11" fill="#15201e"><rect x="50" y="134" width="160" height="22" rx="4" fill="#ffffff" stroke="#8fa39c"/><text x="60" y="149">protein 1 → GO terms</text>
<rect x="50" y="162" width="160" height="22" rx="4" fill="#ffffff" stroke="#8fa39c"/><text x="60" y="177">protein 2 → GO terms</text>
<rect x="50" y="190" width="160" height="22" rx="4" fill="#ffffff" stroke="#8fa39c"/><text x="60" y="205">...</text></g>
<text x="130" y="240" font-size="22" text-anchor="middle" font-weight="bold" fill="#0e6b66">4,120</text>
<text x="130" y="258" font-size="11" text-anchor="middle" fill="#56655f">directly annotated terms</text>
<text x="130" y="300" font-size="22" text-anchor="middle" font-weight="bold" fill="#0e6b66">5,493</text>
<text x="130" y="318" font-size="11" text-anchor="middle" fill="#56655f">present after is_a + part_of</text>
<text x="130" y="332" font-size="11" text-anchor="middle" fill="#56655f">closure (true-path rule)</text>
<line x1="232" y1="220" x2="286" y2="220" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
<!-- middle: rule -->
<rect x="290" y="70" width="330" height="300" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
<text x="455" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">For each GO axiom  C has_part F</text>
<text x="455" y="116" font-size="12" text-anchor="middle" fill="#56655f">743 asserted pairs in go.obo</text>
<rect x="320" y="140" width="270" height="44" rx="6" fill="#dcefec" stroke="#0e6b66"/>
<text x="455" y="160" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">denitrification pathway</text>
<text x="455" y="176" font-size="11" text-anchor="middle" fill="#56655f">GO:0019333 · present in genome</text>
<line x1="455" y1="186" x2="455" y2="244" stroke="#bd3a30" stroke-width="2" marker-end="url(#r)"/>
<text x="465" y="220" font-size="12" fill="#bd3a30" font-weight="bold">has_part</text>
<rect x="320" y="248" width="270" height="44" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2" stroke-dasharray="6 4"/>
<text x="455" y="268" font-size="13" text-anchor="middle" font-weight="bold" fill="#bd3a30">nitrous-oxide reductase activity</text>
<text x="455" y="284" font-size="11" text-anchor="middle" fill="#56655f">GO:0050304 · on no protein</text>
<text x="455" y="320" font-size="12" text-anchor="middle" fill="#15201e">C present → dependency activated</text>
<text x="455" y="338" font-size="12" text-anchor="middle" fill="#15201e">F absent → violation (a curation lead)</text>
<line x1="622" y1="220" x2="676" y2="220" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
<!-- right: score -->
<rect x="680" y="70" width="250" height="300" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="805" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">Coherence score</text>
<text x="805" y="160" font-size="44" text-anchor="middle" font-weight="bold" fill="#0e6b66">86.8%</text>
<text x="805" y="190" font-size="12" text-anchor="middle" fill="#56655f">1 − unsatisfied / activated</text>
<text x="805" y="232" font-size="15" text-anchor="middle" fill="#15201e"><tspan font-weight="bold">129</tspan> activated</text>
<text x="805" y="256" font-size="15" text-anchor="middle" fill="#bd3a30"><tspan font-weight="bold">17</tspan> unsatisfied</text>
<text x="805" y="300" font-size="11" text-anchor="middle" fill="#56655f">asserted has_part only:</text>
<text x="805" y="315" font-size="11" text-anchor="middle" fill="#56655f">a lower bound on detectable</text>
<text x="805" y="330" font-size="11" text-anchor="middle" fill="#56655f">violations</text>
<!-- other criteria -->
<text x="30" y="410" font-size="14" font-weight="bold" fill="#15201e">The other two criteria (not built yet)</text>
<rect x="30" y="424" width="440" height="62" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="6 4"/>
<text x="46" y="448" font-size="13" font-weight="bold" fill="#15201e">Completeness</text>
<text x="46" y="468" font-size="12" fill="#56655f">every essential function (minimal-genome set) present?</text>
<rect x="490" y="424" width="440" height="62" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="6 4"/>
<text x="506" y="448" font-size="13" font-weight="bold" fill="#15201e">Consistency</text>
<text x="506" y="468" font-size="12" fill="#56655f">no functions from disjoint lineages (GO taxon constraints)?</text>
<text x="30" y="506" font-size="11" fill="#56655f">Snapshot: EcoCyc GAF + go.obo rerun 2026-10-04; asserted has_part pairs only.</text>
</svg>
