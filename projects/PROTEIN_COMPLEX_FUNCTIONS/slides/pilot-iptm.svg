    <text x="40" y="174">PSMB5:PSMA1</text><rect x="330" y="160" width="115" height="18" fill="#8fa39c"/><text x="451" y="174">0.230</text>
    <text x="501" y="174" fill="#56655f" font-size="12">T60 9.7 Å from PSMA1</text>
    <text x="40" y="212">PSMB5:PSMA1</text><rect x="330" y="198" width="181" height="18" fill="#0e6b66"/><text x="517" y="212">0.362</text>
    <text x="567" y="212" fill="#56655f" font-size="12">T60 30 Å from PSMA1</text>
    <text x="40" y="250">COX2:SCO1:SCO2 (C, domains)</text><rect x="330" y="236" width="194" height="18" fill="#8fa39c"/><text x="530" y="250">0.389</text>
    <text x="40" y="288">COX2:SCO1:SCO2 (C, domains)</text><rect x="330" y="274" width="195" height="18" fill="#0e6b66"/><text x="531" y="288">0.390</text>
    <text x="581" y="288" fill="#56655f" font-size="12">CxxxC ~50 Å from CuA</text>
    <text x="40" y="326">COX2:SCO1 (A)</text><rect x="330" y="312" width="79" height="18" fill="#8fa39c"/><text x="415" y="326">0.158</text>
    <text x="465" y="326" fill="#56655f" font-size="12">CxxxC 13.8 Å from CuA</text>
    <text x="40" y="364">COX2:SCO1 (A) apo</text><rect x="330" y="350" width="292" height="18" fill="#0e6b66"/><text x="628" y="364">0.583</text>
    <text x="678" y="364" fill="#56655f" font-size="12">CxxxC 52.5 Å from CuA</text>
    <text x="40" y="402">COX2:SCO1 (A) + 3 Cu</text><rect x="330" y="388" width="316" height="18" fill="#0e6b66"/><text x="652" y="402">0.632</text>
    <text x="702" y="402" fill="#56655f" font-size="12">CxxxC 51.3 Å from CuA</text>
  </g>
  <text x="40" y="456" font-size="13" fill="#15201e">High ipTM without the right geometry is not evidence: the best-scoring runs never bring SCO1 to CuA.</text>
  <text x="40" y="478" font-size="12" fill="#56655f">From the project notes and results files in projects/PROTEIN_COMPLEX_FUNCTIONS/ (2026-05-20 to 2026-05-30).</text>
</svg>
