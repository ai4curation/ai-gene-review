  <rect x="740" y="24" width="14" height="14" fill="#0e6b66"/><text x="760" y="36" font-size="13">ESMFold2</text>
  <!-- scale: ipTM 1.0 = 500px from x=330 -->
  <line x1="580" y1="56" x2="580" y2="440" stroke="#bd3a30" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="586" y="70" font-size="12" fill="#bd3a30">provisional threshold 0.5</text>
  <g font-size="13" fill="#15201e">
    <text x="40" y="98">CYC1:UQCRFS1</text><rect x="330" y="84" width="120" height="18" fill="#8fa39c"/><text x="456" y="98">0.241</text>
