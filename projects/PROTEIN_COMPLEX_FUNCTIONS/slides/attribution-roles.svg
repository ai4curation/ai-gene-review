<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker></defs>
  <text x="40" y="38" font-size="18" font-weight="600" fill="#0e6b66">Same complex, different roles: Complex III (cytochrome bc1)</text>
  <!-- membrane -->
  <rect x="40" y="250" width="560" height="60" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="50" y="300" font-size="12" fill="#56655f">inner mitochondrial membrane</text>
  <!-- core structural -->
  <rect x="80" y="90" width="200" height="150" rx="16" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.6"/>
  <text x="180" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">UQCRC1 · UQCRC2</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#56655f">core structural proteins</text>
  <!-- active -->
  <rect x="300" y="110" width="130" height="200" rx="12" fill="#e9f5ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="365" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">CYC1</text>
  <text x="365" y="170" text-anchor="middle" font-size="12" fill="#56655f">heme c1</text>
  <rect x="440" y="130" width="130" height="180" rx="12" fill="#e9f5ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="505" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">UQCRFS1</text>
  <text x="505" y="190" text-anchor="middle" font-size="12" fill="#56655f">Rieske Fe-S</text>
  <path d="M505 126 C480 80 410 76 385 104" stroke="#1d8a4b" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="445" y="74" text-anchor="middle" font-size="13" fill="#1d8a4b">e⁻ transfer</text>
  <!-- assembly -->
  <rect x="120" y="380" width="420" height="60" rx="10" fill="#f6efe6" stroke="#b8620f" stroke-dasharray="6 4"/>
  <text x="330" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">BCS1L · LYRM7 · TTC19</text>
  <text x="330" y="426" text-anchor="middle" font-size="12" fill="#15201e">assembly, insertion, turnover; not in the active enzyme</text>
  <path d="M330 380 V320" stroke="#b8620f" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- legend / export -->
  <g font-size="13" fill="#15201e">
    <text x="640" y="90" font-size="15" font-weight="600" fill="#0e6b66">Proposed GO-CAM relation → GPAD</text>
    <rect x="640" y="110" width="290" height="70" rx="8" fill="#e9f5ee" stroke="#1d8a4b"/>
    <text x="656" y="134" font-weight="600">has active member</text>
    <text x="656" y="156">export contributes_to MF</text>
    <text x="656" y="172" fill="#56655f">CYC1, UQCRFS1</text>
    <rect x="640" y="195" width="290" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="656" y="219" font-weight="600">has accessory/structural member</text>
    <text x="656" y="241">no MF export (CC, BP only)</text>
    <text x="656" y="257" fill="#56655f">UQCRC1, UQCRC2</text>
    <rect x="640" y="280" width="290" height="70" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="656" y="304" font-weight="600">has member</text>
    <text x="656" y="326">role unknown: no MF by default</text>
    <rect x="640" y="365" width="290" height="75" rx="8" fill="#f6efe6" stroke="#b8620f"/>
    <text x="656" y="389" font-weight="600">not in the mature complex</text>
    <text x="656" y="411">assembly / maturation terms</text>
    <text x="656" y="427" fill="#56655f">BCS1L, LYRM7, TTC19</text>
  </g>
  <text x="40" y="490" font-size="13" fill="#56655f">Schematic, not to scale. Roles as described in projects/PROTEIN_COMPLEX_FUNCTIONS.md.</text>
</svg>
