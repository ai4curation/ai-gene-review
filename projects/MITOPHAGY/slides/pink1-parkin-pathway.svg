<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">PINK1-Parkin mitophagy: a damage signal written in phospho-ubiquitin</text>
  <!-- damaged mitochondrion -->
  <ellipse cx="250" cy="330" rx="200" ry="110" fill="#e8f1ee" stroke="#8fa39c" stroke-width="4"/>
  <path transform="translate(0,22)" d="M110 330 C150 280 180 380 220 330 C260 280 290 380 330 330 C360 290 380 360 400 330" fill="none" stroke="#8fa39c" stroke-width="3"/>
  <text x="250" y="422" font-size="15" fill="#56655f" text-anchor="middle">damaged, depolarised mitochondrion</text>
  <!-- PINK1 on OMM -->
  <rect x="80" y="205" width="100" height="32" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="130" y="226" font-size="16" text-anchor="middle" fill="#15201e" font-weight="bold">PINK1</text>
  <text x="60" y="190" font-size="13" fill="#56655f">1. stabilised on outer membrane (TOMM)</text>
  <!-- pUb -->
  <circle cx="240" cy="210" r="15" fill="#ffffff" stroke="#b8620f" stroke-width="3"/><text x="240" y="215" font-size="12" text-anchor="middle" fill="#b8620f" font-weight="bold">pUb</text>
  <line x1="180" y1="221" x2="222" y2="214" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Parkin -->
  <rect x="290" y="130" width="110" height="32" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="345" y="151" font-size="16" text-anchor="middle" fill="#15201e" font-weight="bold">PRKN</text>
  <text x="290" y="120" font-size="13" fill="#56655f">2. Parkin recruited, activated</text>
  <line x1="254" y1="200" x2="296" y2="164" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Ub chains on OMM proteins -->
  <g fill="#ffffff" stroke="#b8620f" stroke-width="2.5">
    <circle cx="370" cy="232" r="10"/><circle cx="388" cy="216" r="10"/><circle cx="406" cy="200" r="10"/>
  </g>
  <line x1="355" y1="163" x2="372" y2="218" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="130" y="266" font-size="13" fill="#56655f">3. Ub chains on outer-membrane</text>
  <text x="130" y="282" font-size="13" fill="#56655f">proteins (e.g. MFN2); VCP extracts</text>
  <!-- receptors -->
  <rect x="470" y="170" width="230" height="36" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="585" y="194" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">OPTN · CALCOCO2 · SQSTM1</text>
  <text x="585" y="224" font-size="13" text-anchor="middle" fill="#56655f">TAX1BP1 · NBR1 (Ub-binding receptors)</text>
  <line x1="416" y1="196" x2="466" y2="190" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="470" y="160" font-size="13" fill="#56655f">4. receptors bind Ub chains</text>
  <!-- TBK1 -->
  <rect x="520" y="258" width="100" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="570" y="278" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">TBK1</text>
  <line x1="570" y1="258" x2="570" y2="232" stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="630" y="278" font-size="13" fill="#56655f">phosphorylates receptors</text>
  <!-- phagophore -->
  <path d="M760 110 A120 140 0 0 1 760 390" fill="none" stroke="#0e6b66" stroke-width="10"/>
  <path d="M760 110 A120 140 0 0 1 760 390" fill="none" stroke="#dcefec" stroke-width="4"/>
  <g fill="#0e6b66"><circle cx="820" cy="150" r="8"/><circle cx="858" cy="215" r="8"/><circle cx="862" cy="290" r="8"/><circle cx="825" cy="355" r="8"/></g>
  <text x="700" y="80" font-size="15" fill="#0e6b66" font-weight="bold">phagophore</text>
  <text x="700" y="98" font-size="13" fill="#0e6b66">LC3 / GABARAP (ATG8 family)</text>
  <line x1="700" y1="188" x2="848" y2="212" stroke="#1d68b3" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- alternative receptors -->
  <rect x="440" y="360" width="230" height="36" rx="6" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  <text x="555" y="384" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">BNIP3L · BNIP3 · FUNDC1</text>
  <text x="440" y="416" font-size="13" fill="#56655f">PINK1/Parkin-independent: outer-membrane LIR receptors</text>
  <text x="440" y="432" font-size="13" fill="#56655f">(PHB2 on the inner membrane)</text>
  <line x1="430" y1="370" x2="410" y2="360" stroke="#8fa39c" stroke-width="2"/>
  <line x1="670" y1="372" x2="852" y2="296" stroke="#1d68b3" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="40" y1="480" x2="80" y2="480" stroke="#1d68b3" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="90" y="485" font-size="14" fill="#15201e">LIR binding to ATG8-family proteins</text>
  <circle cx="380" cy="480" r="9" fill="#ffffff" stroke="#b8620f" stroke-width="2.5"/><text x="396" y="485" font-size="14" fill="#15201e">ubiquitin (pUb = phospho-ubiquitin, the PINK1 product)</text>
</svg>
