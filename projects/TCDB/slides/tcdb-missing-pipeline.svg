<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <text x="30" y="36" font-size="21" font-weight="700" fill="#15201e">A missing pipeline, not a missing mapping</text>

  <!-- rows -->
  <g font-size="14" fill="#15201e">
    <text x="30" y="84" font-weight="700">EC number</text>
    <rect x="170" y="62" width="160" height="34" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="250" y="84" text-anchor="middle">ec2go</text>
    <line x1="330" y1="79" x2="386" y2="79" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="390" y="62" width="180" height="34" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="480" y="84" text-anchor="middle">GO_REF:0000003</text>
    <line x1="570" y1="79" x2="626" y2="79" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="630" y="62" width="150" height="34" rx="6" fill="#1d8a4b"/><text x="705" y="84" text-anchor="middle" fill="#ffffff" font-weight="700">GAF annotation</text>

    <text x="30" y="138" font-weight="700">RHEA reaction</text>
    <rect x="170" y="116" width="160" height="34" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="250" y="138" text-anchor="middle">rhea2go</text>
    <line x1="330" y1="133" x2="386" y2="133" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="390" y="116" width="180" height="34" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="480" y="138" text-anchor="middle">GO_REF:0000116</text>
    <line x1="570" y1="133" x2="626" y2="133" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="630" y="116" width="150" height="34" rx="6" fill="#1d8a4b"/><text x="705" y="138" text-anchor="middle" fill="#ffffff" font-weight="700">GAF annotation</text>

    <text x="30" y="192" font-weight="700">TC number</text>
    <rect x="170" y="170" width="160" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="250" y="192" text-anchor="middle">TC xref on 170 terms</text>
    <line x1="330" y1="187" x2="386" y2="187" stroke="#bd3a30" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="390" y="170" width="180" height="34" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="5 4"/><text x="480" y="192" text-anchor="middle" fill="#bd3a30" font-weight="700">no tc2go pipeline</text>
    <text x="630" y="192" fill="#bd3a30">→ no annotation</text>
  </g>
  <rect x="800" y="62" width="130" height="142" rx="8" fill="#fbeceb" stroke="#bd3a30"/>
  <text x="865" y="100" text-anchor="middle" font-size="30" font-weight="700" fill="#bd3a30">50.6%</text>
  <text x="865" y="124" text-anchor="middle" font-size="12" fill="#15201e">of 8,758 reviewed</text>
  <text x="865" y="140" text-anchor="middle" font-size="12" fill="#15201e">TCDB-linked entries</text>
  <text x="865" y="156" text-anchor="middle" font-size="12" fill="#15201e">have no transporter-</text>
  <text x="865" y="172" text-anchor="middle" font-size="12" fill="#15201e">activity GO term</text>

  <line x1="30" y1="232" x2="930" y2="232" stroke="#8fa39c" stroke-dasharray="4 4"/>
  <text x="30" y="264" font-size="19" font-weight="700" fill="#15201e">Which TC level can safely carry the GO term? Example: MFS sugar porters</text>

  <!-- hierarchy -->
  <g font-size="14" fill="#15201e">
    <rect x="30" y="286" width="150" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="105" y="306" text-anchor="middle" font-weight="700">2.A</text><text x="105" y="324" text-anchor="middle" font-size="12" fill="#56655f">porters (subclass)</text>
    <line x1="180" y1="309" x2="216" y2="309" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
    <rect x="220" y="286" width="170" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="305" y="306" text-anchor="middle" font-weight="700">2.A.1 MFS</text><text x="305" y="324" text-anchor="middle" font-size="12" fill="#56655f">49 substrate MF terms</text>
    <line x1="390" y1="309" x2="426" y2="309" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="286" width="220" height="46" rx="6" fill="#fbeceb" stroke="#bd3a30" stroke-width="2"/>
    <text x="540" y="306" text-anchor="middle" font-weight="700">2.A.1.1 sugar porters</text><text x="540" y="324" text-anchor="middle" font-size="12" fill="#bd3a30">GO:0005351 on 35/88 → narrowMatch</text>
    <line x1="650" y1="309" x2="686" y2="309" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
    <rect x="690" y="286" width="240" height="46" rx="6" fill="#e6effa" stroke="#1d68b3" stroke-width="2"/>
    <text x="810" y="306" text-anchor="middle" font-weight="700">2.A.1.1.10 system</text><text x="810" y="324" text-anchor="middle" font-size="11" fill="#1d68b3">GO:0005364 maltose → GAP_CANDIDATE</text>
  </g>
  <text x="690" y="354" font-size="12" fill="#56655f">member P15685 has only the general</text>
  <text x="690" y="370" font-size="12" fill="#56655f">carbohydrate:proton symporter term</text>

  <rect x="30" y="394" width="900" height="100" rx="8" fill="#e8f1ee" stroke="#1d8a4b"/>
  <text x="50" y="422" font-size="16" font-weight="700" fill="#1d8a4b">Safe: the single TC system</text>
  <text x="50" y="446" font-size="14" fill="#15201e">70 of the 80 JUSTIFIED leads are 5-level systems, e.g. 3.A.2.1.1 → GO:0046933 proton-motive-force-driven ATP synthase (8/8)</text>
  <text x="50" y="470" font-size="14" fill="#15201e">Some families are mono-specific too: 2.A.69 auxin efflux carrier → GO:0010329 (PIN1, hand-backed exemplar)</text>
</svg>
