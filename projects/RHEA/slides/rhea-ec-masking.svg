<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="36" font-size="21" font-weight="700" fill="#15201e">Two routes from one enzyme to GO</text>

  <!-- enzyme -->
  <rect x="30" y="70" width="190" height="120" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#15201e">UniProt enzyme</text>
  <text x="125" y="122" text-anchor="middle" font-size="13" fill="#15201e">catalytic activity line</text>
  <text x="125" y="146" text-anchor="middle" font-size="13" fill="#0e6b66">EC 1.1.1.256</text>
  <text x="125" y="166" text-anchor="middle" font-size="13" fill="#1d68b3">RHEA reaction id</text>

  <line x1="220" y1="100" x2="296" y2="100" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="300" y="78" width="180" height="44" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="390" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">ec2go</text>
  <text x="390" y="114" text-anchor="middle" font-size="12" fill="#56655f">GO_REF:0000003</text>

  <line x1="220" y1="160" x2="296" y2="160" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="300" y="138" width="180" height="44" rx="6" fill="#e6effa" stroke="#1d68b3"/>
  <text x="390" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">rhea2go</text>
  <text x="390" y="174" text-anchor="middle" font-size="12" fill="#56655f">GO_REF:0000116</text>

  <line x1="480" y1="100" x2="556" y2="125" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="480" y1="160" x2="556" y2="135" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="560" y="100" width="370" height="60" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="575" y="124" font-size="14" font-weight="700" fill="#15201e">Same GO term either way (usually)</text>
  <text x="575" y="146" font-size="12" fill="#56655f">Exception: RHEA splits EC 1.1.1.256 by cofactor</text>

  <!-- reaction-level stacked bar -->
  <text x="30" y="236" font-size="17" font-weight="700" fill="#15201e">4,904 reactions with both a rhea2go term and an EC</text>
  <rect x="30" y="252" width="769" height="40" fill="#8fa39c"/>
  <rect x="799" y="252" width="21" height="40" fill="#b8620f"/>
  <rect x="820" y="252" width="82" height="40" fill="#1d68b3"/>
  <text x="40" y="278" font-size="15" font-weight="700" fill="#ffffff">4,324 (88%) same GO term as ec2go: RHEA adds nothing</text>
  <text x="809" y="312" font-size="13" fill="#b8620f" text-anchor="end">118 differ</text>
  <text x="902" y="332" font-size="13" fill="#1d68b3" text-anchor="end">462 EC has no ec2go: RHEA only route</text>

  <!-- term-level -->
  <text x="30" y="372" font-size="17" font-weight="700" fill="#15201e">4,744 GO terms reachable through rhea2go</text>
  <rect x="30" y="388" width="730" height="40" fill="#8fa39c"/>
  <rect x="760" y="388" width="142" height="40" fill="#1d68b3"/>
  <text x="40" y="414" font-size="15" font-weight="700" fill="#ffffff">3,972 (84%) also reachable via ec2go</text>
  <text x="832" y="414" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">772 RHEA-only</text>

  <text x="30" y="470" font-size="14" fill="#15201e">And the other side: <tspan font-weight="700" fill="#bd3a30">2,731 of 7,635 enzymatic reactions (36%)</tspan> have no rhea2go target at all.</text>
  <text x="30" y="494" font-size="13" fill="#56655f">Counts from rhea_ec_specificity.py over rhea2go, ec2go and the RHEA REST API (GO release 2026-05-19).</text>
</svg>
