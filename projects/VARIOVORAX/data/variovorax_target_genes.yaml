project: VARIOVORAX
description: >
  Curated target gene inventory for Variovorax rhizosphere plant-microbe signaling
  (iad auxin catabolism operon, acdS ethylene stress buffering, amiE amide hydrolysis)
  and metal recovery/homeostasis (iron/siderophore hydroxylases and trafficking,
  PQQ-dependent mineral/REE bioleaching, polyphosphate sequestration, czc RND efflux,
  and organosulfur mobilization).
strains:
  - code: VARPS
    taxon_id: NCBITaxon:543728
    name: Variovorax paradoxus S110
    proteome: UP000001552
  - code: VARPD
    taxon_id: NCBITaxon:34073
    name: Variovorax paradoxus
    proteome: UP000019090
batches:
