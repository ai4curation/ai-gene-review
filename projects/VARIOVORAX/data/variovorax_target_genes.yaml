project: VARIOVORAX
description: >
  Curated target gene inventory for Variovorax rhizosphere plant-microbe signaling
  (iad auxin catabolism operon, acdS ethylene stress buffering, amiE amide hydrolysis)
  and metal homeostasis/organosulfur metabolism (cytosolic YggX-family iron trafficking,
  periplasmic PQQ-dependent glucose oxidation, polyphosphate synthesis, HME-RND cation efflux,
  and organosulfur mobilization).
strains:
