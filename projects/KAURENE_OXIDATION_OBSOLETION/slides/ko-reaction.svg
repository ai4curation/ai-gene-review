<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">One enzyme, three oxidations of the C19 (4-methyl) carbon</text>
  <g font-size="15" fill="#15201e" text-anchor="middle">
    <rect x="30" y="170" width="170" height="90" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="115" y="206" font-weight="600">ent-kaurene</text><text x="115" y="232" font-size="13" fill="#56655f">–CH3</text>
    <rect x="265" y="170" width="170" height="90" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="350" y="206" font-weight="600">ent-kaurenol</text><text x="350" y="232" font-size="13" fill="#56655f">–CH2OH</text>
    <rect x="500" y="170" width="170" height="90" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="585" y="206" font-weight="600">ent-kaurenal</text><text x="585" y="232" font-size="13" fill="#56655f">–CHO</text>
    <rect x="735" y="170" width="195" height="90" rx="12" fill="#dcefec" stroke="#0e6b66"/>
    <text x="832" y="206" font-weight="600">ent-kaurenoic acid</text><text x="832" y="232" font-size="13" fill="#56655f">–COOH</text>
  </g>
  <g stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"><path d="M202 215 L261 215"/><path d="M437 215 L496 215"/><path d="M672 215 L731 215"/></g>
  <g font-size="12" fill="#0e6b66" text-anchor="middle"><text x="232" y="200">O2</text><text x="467" y="200">O2</text><text x="702" y="200">O2</text></g>
  <!-- enzyme bar -->
  <rect x="200" y="300" width="535" height="70" rx="12" fill="#0e6b66"/>
  <text x="467" y="330" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">ent-kaurene oxidase (CYP701 P450; KO / GA3, CYP701A6)</text>
  <text x="467" y="354" text-anchor="middle" font-size="14" fill="#dcefec">GO:0052615 ent-kaurene oxidase activity · EC 1.14.14.86</text>
  <path d="M30 420 L930 420" stroke="#8fa39c" stroke-width="1.4"/>
  <text x="30" y="450" font-size="14" fill="#bd3a30" font-weight="600">Obsolete GO:0010241 named exactly this span as a process.</text>
  <text x="30" y="474" font-size="14" fill="#15201e">Its content is the MF above plus membership in GO:0009686 gibberellin biosynthetic process,</text>
  <text x="30" y="496" font-size="14" fill="#15201e">where this is the first cytochrome P450-mediated step (PMID:9671797).</text>
</svg>
