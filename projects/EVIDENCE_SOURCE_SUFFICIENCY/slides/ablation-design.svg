<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker></defs>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#15201e">From "what was cited" to "what suffices": the blind ablation</text>
  <rect x="30" y="170" width="200" height="150" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="130" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e6b66">ACCEPT annotation</text>
  <text x="130" y="228" text-anchor="middle" font-size="13" fill="#15201e">30 human genes,</text>
  <text x="130" y="246" text-anchor="middle" font-size="13" fill="#15201e">484 ACCEPT rows,</text>
  <text x="130" y="264" text-anchor="middle" font-size="13" fill="#15201e">stratified by aspect</text>
  <text x="130" y="296" text-anchor="middle" font-size="12" fill="#56655f">seed 20260614</text>
  <g font-size="14">
    <rect x="310" y="70" width="230" height="80" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="425" y="104" text-anchor="middle" font-weight="bold" fill="#15201e">abstract only</text><text x="425" y="126" text-anchor="middle" font-size="12" fill="#56655f">cited papers' abstracts</text>
    <rect x="310" y="205" width="230" height="80" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="425" y="239" text-anchor="middle" font-weight="bold" fill="#15201e">deep-research only</text><text x="425" y="261" text-anchor="middle" font-size="12" fill="#56655f">the gene's DR report</text>
    <rect x="310" y="340" width="230" height="80" rx="10" fill="#e8f1ee" stroke="#8fa39c"/><text x="425" y="374" text-anchor="middle" font-weight="bold" fill="#15201e">review only</text><text x="425" y="396" text-anchor="middle" font-size="12" fill="#56655f">reviews in its reference list</text>
  </g>
  <g stroke="#56655f" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M230,220 C270,180 280,120 308,112"/><path d="M230,245 L308,245"/><path d="M230,270 C270,310 280,370 308,378"/>
    <path d="M540,110 C590,120 600,220 638,235"/><path d="M540,245 L638,245"/><path d="M540,380 C590,370 600,270 638,255"/>
  </g>
  <rect x="640" y="185" width="170" height="120" rx="12" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="725" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e6b66">blinded agent</text>
  <text x="725" y="240" text-anchor="middle" font-size="12" fill="#15201e">no original decision,</text>
  <text x="725" y="258" text-anchor="middle" font-size="12" fill="#15201e">no full text, judge</text>
  <text x="725" y="276" text-anchor="middle" font-size="12" fill="#15201e">from the bundle alone</text>
  <line x1="810" y1="245" x2="838" y2="245" stroke="#56655f" stroke-width="2.5" marker-end="url(#a)"/>
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <rect x="842" y="182" width="100" height="26" rx="5" fill="#1d8a4b"/><text x="892" y="200" text-anchor="middle">ACCEPT</text>
    <rect x="842" y="214" width="100" height="26" rx="5" fill="#b8620f"/><text x="892" y="232" text-anchor="middle">UNDECIDED</text>
    <rect x="842" y="246" width="100" height="26" rx="5" fill="#bd3a30"/><text x="892" y="264" text-anchor="middle">REJECT</text>
    <rect x="842" y="278" width="100" height="26" rx="5" fill="#d5ddda"/><text x="892" y="296" text-anchor="middle" fill="#15201e">NO_SOURCE</text>
  </g>
  <text x="480" y="470" text-anchor="middle" font-size="14" fill="#15201e">Sufficiency = P(ACCEPT | source available). Source-only judging makes this a conservative floor.</text>
  <text x="480" y="494" text-anchor="middle" font-size="14" fill="#56655f">Retrospective check: abstract 92.8% vs blind 85.7%, a +7 point optimism gap.</text>
</svg>
