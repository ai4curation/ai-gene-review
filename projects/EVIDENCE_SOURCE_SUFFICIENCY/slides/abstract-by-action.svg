<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#15201e">Abstract-only support, by review action (human census, observed usage)</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#56655f">Share of annotations whose section-tagged support is title/abstract only; ~5% of snippets carry a section tag</text>
<text x="316" y="132" text-anchor="end" font-size="16" font-weight="bold" fill="#15201e">ACCEPT</text>
<rect x="330" y="100" width="540" height="48" fill="#f1f5f4"/><rect x="330" y="100" width="382.3" height="48" fill="#1d8a4b"/>
<text x="720.3" y="131" font-size="16" font-weight="bold" fill="#15201e">70.8%</text>
<text x="316" y="212" text-anchor="end" font-size="16" font-weight="bold" fill="#15201e">MARK_AS_OVER_ANNOTATED</text>
<rect x="330" y="180" width="540" height="48" fill="#f1f5f4"/><rect x="330" y="180" width="438.5" height="48" fill="#7657a3"/>
<text x="776.5" y="211" font-size="16" font-weight="bold" fill="#15201e">81.2%</text>
<text x="316" y="292" text-anchor="end" font-size="16" font-weight="bold" fill="#15201e">MODIFY</text>
<rect x="330" y="260" width="540" height="48" fill="#f1f5f4"/><rect x="330" y="260" width="253.3" height="48" fill="#b8620f"/>
<text x="591.3" y="291" font-size="16" font-weight="bold" fill="#15201e">46.9%</text>
<text x="316" y="372" text-anchor="end" font-size="16" font-weight="bold" fill="#15201e">REMOVE</text>
<rect x="330" y="340" width="540" height="48" fill="#f1f5f4"/><rect x="330" y="340" width="90.2" height="48" fill="#bd3a30"/>
<text x="428.2" y="371" font-size="16" font-weight="bold" fill="#15201e">16.7%</text>
<text x="480" y="440" text-anchor="middle" font-size="15" fill="#15201e">Confirming or demoting a term leans on abstracts; overturning one leans on full text.</text>
<text x="480" y="466" text-anchor="middle" font-size="14" fill="#56655f">REMOVE support is 92.8% primary research. Usage is not sufficiency: this is a census, not a test.</text>
</svg>