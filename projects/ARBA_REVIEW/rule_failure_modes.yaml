# Failure-mode classification of the 76 ARBA rule reviews in rules/arba/.
#
# Each entry is a curator judgement made by reading the rule review's
# description, review_summary and action_rationale. `action` is copied from the
# review. `primary` is the failure that decides the verdict; `secondary` lists
# other defects the review documents. Modes are defined in `modes` below.
#
# Selection caveat: these rules were mostly chosen because GO curators had
# flagged them (several reviews cite geneontology/go-annotation issues), so the
# distribution here describes flagged rules, not ARBA as a whole.

modes:
  # --- consequent is wrong for some or all matched proteins ---
  HETEROGENEOUS_CONSEQUENT: >-
    Condition sets pool unrelated families under one term that fits only some
    of them; for the rest the term is wrong-branch (e.g. kinases annotated to
    phosphatidylinositol biosynthesis).
  SUBSTRATE_OR_CARGO: >-
    The protein is what the process acts on (cargo, substrate, degraded
    object), not what performs it.
  ACTIVITY_MISMATCH: >-
    A specific activity that the family does not have, or two distinct
    activities conflated under one term.
  NONCATALYTIC_HOMOLOG: >-
    Catalytic activity assigned to family members that have lost it
    (pseudoenzymes, cofactors).
  MECHANISM_OVEREXTENDED: >-
    A mechanism characterized in one lineage is applied to taxa where it is
    absent or unproven.
  SPURIOUS_SIGNATURE: >-
    The signature is not diagnostic of the function; the association looks
    data-mined (low containment, generic domains, zero matches).
  # --- consequent true but of little value ---
  TOO_GENERAL: >-
    The term is true for the matched proteins but so general it adds nothing
    (keyword-level classes such as Transferase, Hydrolase, Kinase).
  TOO_SPECIFIC: >-
    The term claims more than the evidence supports (direction, location, a
    precise sub-process).
  # --- rule construction ---
  MEGA_RULE: >-
    Tens to thousands of OR'd condition sets; impossible to audit, and the
    source of most HETEROGENEOUS_CONSEQUENT and TOO_GENERAL output.
  LOGIC_ERROR: >-
    AND over signatures that rarely co-occur, nested or identical conditions,
    or conditions that match no protein.
  ARBITRARY_TAXON: >-
    Taxon restrictions with no biological rationale (Primates, Mus, Homo) or
    inconsistent across condition sets of one rule.
  REDUNDANT_WITH_INTERPRO2GO: >-
    Every condition set is already covered by an InterPro2GO mapping to the
    same term.
  STALE: >-
    The consequent is obsolete, or the rule is withdrawn but still referenced.
  # --- not a failure ---
  SOUND: The rule, or its core, is correct; any defects are cosmetic.
  NOT_ASSESSED: The review could not assess the rule.

