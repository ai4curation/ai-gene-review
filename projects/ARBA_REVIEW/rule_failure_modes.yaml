# Rule-level findings of the ARBA rule reviews in rules/arba/.
# Generated by rule_failure_modes.py from the reviews' structured fields; do not edit.
# A finding is present exactly when the review records the field that defines it.
# Selection caveat: most of these rules were chosen because GO curators had flagged
# them, so the distribution describes flagged rules, not ARBA as a whole.
findings:
  WITHDRAWN: UniProt no longer serves the rule (rule.withdrawn).
  OBSOLETE_CONSEQUENT: The asserted term is obsolete (annotation_assessments[].consequent_obsolete).
  WRONG_PROTEINS: Named proteins are wrongly annotated (annotation_assessments[].incorrect_examples).
  HETEROGENEOUS: The best curated term of some units lies outside the consequent (biological_meaning HETEROGENEOUS).
  UMBRELLA_TERM: True, but units carry more specific descendant terms (biological_meaning TRUE_BUT_UNINFORMATIVE).
  EMITS_NOTHING: Every condition set is covered by a rule for a more specific term (sets_covered_by_more_specific_rule
    equals the number of sets).
  SETS_DO_NO_WORK: Some condition sets are redundant or match nothing (parsimony REDUNDANT or OVERLY_COMPLEX).
  TAXON_SCOPE: The taxon restriction does not follow the biology (taxonomic_scope other than APPROPRIATE).
  NOT_EXAMINED: The review reaches no verdict (action UNDECIDED).
  NONE: 'No finding: accurate, coherent and parsimonious.'
