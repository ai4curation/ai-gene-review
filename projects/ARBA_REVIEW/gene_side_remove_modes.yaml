# Manual failure-mode classification of every ARBA (GO_REF:0000117) annotation
# that a gene review marked REMOVE. Each entry was assigned by reading the
# review's reason (see gene_side_rows.tsv). Keys are "<org>/<gene>|<GO id>".
# gene_side_failures.py uses these in place of its keyword heuristic for
# REMOVE rows, and reports any REMOVE row missing from this file.

modes:
  WRONG_ACTIVITY: The protein does not have this activity (wrong reaction, wrong substrate, or wrong enzyme class).
  NONCATALYTIC_HOMOLOG: The family has the activity but this member has lost it.
  ROLE_CONFUSION: >-
    The protein binds, makes, regulates or is acted on by the molecule or
    activity, and is annotated as performing the step itself.
  WRONG_PROCESS: The protein's real activity is used in a different process.
  WRONG_DIRECTION: The regulation sign is opposite to the evidence.
  WRONG_PARALOG: The function belongs to a paralog or a different subfamily.
  WRONG_TAXON: The process does not exist in the organism's lineage.
  WRONG_LOCATION: The location is contradicted by the protein's topology or experiments.
  TERM_MISREAD: The term's definition does not mean what the rule assumed (e.g. visual perception for an eye-development factor).
  SPURIOUS_SIGNATURE: The annotation comes from a false domain prediction or a rule artefact.
  INDIRECT: The protein affects the process only indirectly.
  UNSUPPORTED: No evidence for the organism, or experiments argue against it.
  TOO_GENERAL: Removed as uninformative rather than wrong.
  TOO_SPECIFIC: Claims more than computational inference can support.
  OBSOLETE_OR_PSEUDOGENE: The term is obsolete or the gene is a pseudogene.

