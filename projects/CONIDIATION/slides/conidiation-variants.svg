<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M5,0 L5,10" stroke="#bd3a30" stroke-width="3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">One module, two implementations (EXACTLY_ONE taxon variant)</text>

  <!-- tier labels -->
  <g font-size="12" fill="#56655f">
    <text x="24" y="104">gating</text>
    <text x="24" y="176">activation</text>
    <text x="24" y="248">master switch</text>
    <text x="24" y="320">mid / stage</text>
    <text x="24" y="392">maturation</text>
    <text x="24" y="464">structural output</text>
  </g>

  <!-- Aspergillus column -->
  <text x="325" y="64" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e6b66">Aspergillus nidulans (21 genes)</text>
  <rect x="150" y="80" width="350" height="40" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="325" y="105" font-size="13" text-anchor="middle" fill="#15201e">FadA / SfaD / GpgA → cAMP–PKA · FlbA (RGS) damps</text>
  <rect x="150" y="152" width="350" height="40" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="325" y="177" font-size="13" text-anchor="middle" fill="#15201e">FluG signal · FlbB / FlbC / FlbD / FlbE TFs · SfgA</text>
  <rect x="235" y="224" width="180" height="40" rx="8" fill="#0e6b66"/>
  <text x="325" y="249" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">BrlA (C2H2 TF)</text>
  <rect x="235" y="296" width="180" height="40" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="325" y="321" font-size="13" text-anchor="middle" fill="#15201e">AbaA (TEA/ATTS TF)</text>
  <rect x="150" y="368" width="350" height="40" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="325" y="393" font-size="13" text-anchor="middle" fill="#15201e">WetA · VosA / VelB / VeA velvet · LaeA</text>
  <rect x="150" y="440" width="350" height="40" rx="8" fill="#fff4e8" stroke="#b8620f"/>
  <text x="325" y="465" font-size="13" text-anchor="middle" fill="#15201e">RodA / DewA hydrophobins · wA PKS → yA laccase</text>

  <line x1="325" y1="122" x2="325" y2="148" stroke="#bd3a30" stroke-width="3" marker-end="url(#r)"/>
  <line x1="325" y1="194" x2="325" y2="220" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <line x1="325" y1="266" x2="325" y2="292" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <line x1="325" y1="338" x2="325" y2="364" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <line x1="325" y1="410" x2="325" y2="436" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>

  <!-- Neurospora column -->
  <text x="735" y="64" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e6b66">Neurospora crassa (9 genes)</text>
  <rect x="560" y="80" width="350" height="40" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="735" y="105" font-size="13" text-anchor="middle" fill="#15201e">WC-1 / WC-2 light · FRQ clock · ACON-2 (cAMP PDE)</text>
  <rect x="645" y="224" width="180" height="40" rx="8" fill="#0e6b66"/>
  <text x="735" y="249" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">FL (Zn2Cys6 TF)</text>
  <rect x="645" y="296" width="180" height="40" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="735" y="321" font-size="13" text-anchor="middle" fill="#15201e">ACON-3 (MedA family)</text>
  <rect x="560" y="440" width="350" height="40" rx="8" fill="#fff4e8" stroke="#b8620f"/>
  <text x="735" y="465" font-size="13" text-anchor="middle" fill="#15201e">EAS / CCG-2 hydrophobin · CON-6 · CON-10</text>

  <line x1="735" y1="122" x2="735" y2="220" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <line x1="735" y1="266" x2="735" y2="292" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <path d="M735,338 L735,436" stroke="#bd3a30" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <text x="745" y="392" font-size="12" fill="#bd3a30">ACON-3 → con step not yet cited</text>

  <text x="24" y="508" font-size="12" fill="#56655f">Largely non-orthologous genes, same logic. Arrows are simplified; the Neurospora variant has no separate activation or maturation box here.</text>
</svg>
