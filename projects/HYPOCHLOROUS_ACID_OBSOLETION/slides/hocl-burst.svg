<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">Where HOCl comes from: one enzymatic step at the end of the respiratory burst</text>
  <!-- phagosome -->
  <ellipse cx="480" cy="270" rx="430" ry="170" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <text x="480" y="130" font-size="13" text-anchor="middle" fill="#56655f">neutrophil phagosome</text>
  <!-- membrane NOX -->
  <rect x="70" y="220" width="120" height="60" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="130" y="246" font-size="14" text-anchor="middle" font-weight="600" fill="#15201e">NADPH oxidase</text>
  <text x="130" y="266" font-size="12" text-anchor="middle" fill="#56655f">(CYBB / NOX2)</text>
  <g font-size="16" fill="#15201e" font-weight="600">
    <text x="270" y="256">O2•−</text>
    <text x="440" y="256">H2O2</text>
    <text x="780" y="256">HOCl</text>
  </g>
  <g stroke="#15201e" stroke-width="1.8" fill="none">
    <path d="M192 250 L258 250" marker-end="url(#a)"/>
    <path d="M320 250 L426 250" marker-end="url(#a)"/>
    <path d="M492 250 L766 250" marker-end="url(#a)" stroke="#0e6b66" stroke-width="3"/>
  </g>
  <text x="372" y="238" font-size="13" text-anchor="middle" fill="#56655f">SOD</text>
  <!-- MPO box -->
  <rect x="540" y="176" width="180" height="50" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="630" y="198" font-size="14" text-anchor="middle" font-weight="600" fill="#0e6b66">MPO (heme peroxidase)</text>
  <text x="630" y="216" font-size="12" text-anchor="middle" fill="#15201e">EC 1.11.2.2 · RHEA:43232</text>
  <text x="600" y="280" font-size="13" fill="#15201e">+ Cl− + H+</text>
  <text x="600" y="300" font-size="13" fill="#56655f">→ HOCl + H2O</text>
  <!-- verdict -->
  <rect x="600" y="330" width="250" height="84" rx="10" fill="#ffffff" stroke="#7657a3" stroke-width="1.5"/>
  <text x="614" y="354" font-size="13" font-weight="600" fill="#7657a3">A single reaction is a function</text>
  <text x="614" y="374" font-size="12.5" fill="#56655f">OLS: GO:0002149 and GO:0002150</text>
  <text x="614" y="392" font-size="12.5" fill="#56655f">"represent a MF term"</text>
  <text x="40" y="490" font-size="12.5" fill="#56655f">Chain from the project page: NADPH oxidase → O2•− → SOD → H2O2 → MPO → HOCl. Schematic.</text>
</svg>
