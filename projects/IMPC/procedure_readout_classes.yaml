# Hand-curated map from IMPReSS procedure names (as they appear in IMPC
# genotype-phenotype calls) to a coarse readout class. Rules are tried in order;
# the first regex that matches the procedure name wins. The classes say what was
# measured, not what it means:
#   CELL_POPULATION   counts or proportions of cell types (blood counts, flow
#                     cytometry). The finest readout IMPC routinely makes.
#   TISSUE_HISTOLOGY  microscopy of fixed tissue sections.
#   CIRCULATING_ANALYTE  a molecule measured in blood or urine.
#   ORGAN_PHYSIOLOGY  an organ or system's performance in a live animal.
#   BEHAVIOUR         a behavioural or sensory-motor test.
#   GROSS_MORPHOLOGY  external or imaged anatomy, body composition, weights.
#   EMBRYO_MORPHOLOGY gross or imaged anatomy of embryos and placentas.
#   SURVIVAL_FERTILITY  viability, lethality and breeding outcomes.
# No IMPC adult or embryo procedure measures a molecular activity, a transcript
# profile or a subcellular location; the lacZ reporter screens expression and is
# not a phenotype call, so it does not appear in genotype-phenotype data.
rules:
  - {pattern: "immunophenotyping|FACs", readout_class: CELL_POPULATION}
  - {pattern: "haematology|hematology", readout_class: CELL_POPULATION}
  - {pattern: "histopathology", readout_class: TISSUE_HISTOLOGY}
  - {pattern: "clinical chemistry|plasma chemistry|insulin blood|urinalysis|immunoglobulin|anti-nuclear", readout_class: CIRCULATING_ANALYTE}
  - {pattern: "viability|fertility|age monitoring", readout_class: SURVIVAL_FERTILITY}
  - {pattern: "embryo|placenta|microCT E", readout_class: EMBRYO_MORPHOLOGY}
  - {pattern: "ECG|electrocardiogram|echo|auditory brain|ERG|lung mechanics|plethysmography|breathing|calorimetry|food efficiency|IPGTT|glucose tolerance|grip|rotarod", readout_class: ORGAN_PHYSIOLOGY}
  - {pattern: "open.field|light-dark|dark-light|startle|fear|sleep|hole-?board|y-maze|tail suspension|hot plate|von frey|hargreaves|formalin|electroconvulsive|^modified shirpa$|^shirpa", readout_class: BEHAVIOUR}
  - {pattern: "gross pathology|dysmorphology|eye morphology|slit lamp|ophthalmoscop|OCT|x-ray|microct|dexa|body composition|minispec|body ?weight|organ weight|heart weight|heart dissection", readout_class: GROSS_MORPHOLOGY}
