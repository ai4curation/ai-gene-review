<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Two routes for APP, and the genes that act on it</text>

  <!-- membrane -->
  <rect x="24" y="250" width="700" height="44" fill="#e8f1ee"/>
  <line x1="24" y1="250" x2="724" y2="250" stroke="#8fa39c" stroke-width="2"/>
  <line x1="24" y1="294" x2="724" y2="294" stroke="#8fa39c" stroke-width="2"/>
  <text x="30" y="243" font-size="12" fill="#56655f">lumen / outside</text>
  <text x="30" y="312" font-size="12" fill="#56655f">cytosol</text>
  <text x="640" y="277" font-size="12" fill="#56655f">membrane</text>

  <!-- LEFT: non-amyloidogenic -->
  <text x="60" y="70" font-size="16" font-weight="bold" fill="#1d8a4b">Non-amyloidogenic</text>
  <!-- APP ectodomain -->
  <rect x="150" y="110" width="26" height="140" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="140" y="104" font-size="13" text-anchor="end" fill="#15201e">APP</text>
  <!-- TM + C-tail -->
  <rect x="156" y="250" width="14" height="44" fill="#0e6b66"/>
  <rect x="156" y="294" width="14" height="46" rx="4" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <!-- alpha cut -->
  <line x1="136" y1="222" x2="192" y2="222" stroke="#1d8a4b" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="196" y="206" width="150" height="32" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="271" y="227" font-size="13" text-anchor="middle" fill="#15201e">ADAM10 (α-secretase)</text>
  <text x="200" y="140" font-size="13" fill="#1d8a4b">sAPPα released</text>
  <!-- products -->
  <text x="60" y="380" font-size="13" fill="#15201e">C83 stub → γ-secretase →</text>
  <text x="60" y="400" font-size="13" font-weight="bold" fill="#1d8a4b">p3  +  AICD</text>

  <!-- RIGHT: amyloidogenic -->
  <text x="420" y="70" font-size="16" font-weight="bold" fill="#bd3a30">Amyloidogenic</text>
  <rect x="470" y="110" width="26" height="140" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="460" y="104" font-size="13" text-anchor="end" fill="#15201e">APP</text>
  <!-- Abeta region highlighted -->
  <rect x="476" y="196" width="14" height="54" fill="#bd3a30" opacity="0.8"/>
  <rect x="476" y="250" width="14" height="30" fill="#bd3a30" opacity="0.8"/>
  <rect x="476" y="280" width="14" height="14" fill="#0e6b66"/>
  <rect x="476" y="294" width="14" height="46" rx="4" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <!-- beta cut -->
  <line x1="456" y1="196" x2="512" y2="196" stroke="#bd3a30" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="516" y="178" width="140" height="32" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="586" y="199" font-size="13" text-anchor="middle" fill="#15201e">BACE1 (β-secretase)</text>
  <!-- gamma cut -->
  <line x1="456" y1="280" x2="512" y2="280" stroke="#7657a3" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="520" y="140" font-size="13" fill="#bd3a30">sAPPβ released</text>
  <text x="420" y="380" font-size="13" fill="#15201e">C99 stub → γ-secretase →</text>
  <text x="420" y="400" font-size="13" font-weight="bold" fill="#bd3a30">Aβ peptide  +  AICD</text>

  <!-- gamma-secretase complex -->
  <rect x="24" y="428" width="700" height="72" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
  <text x="40" y="452" font-size="14" font-weight="bold" fill="#7657a3">γ-secretase: intramembrane protease acting on both stubs</text>
  <circle cx="60" cy="480" r="13" fill="#7657a3"/><text x="80" y="485" font-size="13" fill="#15201e">PSEN1 / PSEN2 (catalytic aspartates)</text>
  <circle cx="345" cy="480" r="10" fill="#dcefec" stroke="#7657a3" stroke-width="2"/><text x="362" y="485" font-size="13" fill="#15201e">NCSTN</text>
  <circle cx="440" cy="480" r="10" fill="#dcefec" stroke="#7657a3" stroke-width="2"/><text x="457" y="485" font-size="13" fill="#15201e">APH1A / APH1B</text>
  <circle cx="590" cy="480" r="10" fill="#dcefec" stroke="#7657a3" stroke-width="2"/><text x="607" y="485" font-size="13" fill="#15201e">PSENEN</text>

  <!-- RIGHT PANEL: downstream -->
  <rect x="748" y="56" width="188" height="444" rx="8" fill="#e8f1ee"/>
  <text x="762" y="82" font-size="14" font-weight="bold" fill="#0e6b66">Around the pathway</text>
  <text x="762" y="112" font-size="13" font-weight="bold" fill="#15201e">APP sorting</text>
  <text x="762" y="130" font-size="12" fill="#56655f">SORL1, BIN1, PICALM,</text>
  <text x="762" y="146" font-size="12" fill="#56655f">CD2AP (endocytosis)</text>
  <text x="762" y="180" font-size="13" font-weight="bold" fill="#15201e">Lipid / apolipoprotein</text>
  <text x="762" y="198" font-size="12" fill="#56655f">APOE, CLU, LRP1,</text>
  <text x="762" y="214" font-size="12" fill="#56655f">ABCA1, ABCA7</text>
  <text x="762" y="248" font-size="13" font-weight="bold" fill="#15201e">Microglial sensing</text>
  <text x="762" y="266" font-size="12" fill="#56655f">TREM2, PLCG2, INPP5D,</text>
  <text x="762" y="282" font-size="12" fill="#56655f">CD33, CR1, ABI3, SPI1,</text>
  <text x="762" y="298" font-size="12" fill="#56655f">MS4A4A, MS4A6A</text>
  <text x="762" y="332" font-size="13" font-weight="bold" fill="#15201e">Tau / kinases</text>
  <text x="762" y="350" font-size="12" fill="#56655f">MAPT, GSK3B,</text>
  <text x="762" y="366" font-size="12" fill="#56655f">CDK5, CDK5R1</text>
  <text x="762" y="400" font-size="13" font-weight="bold" fill="#15201e">Adaptors / signalling</text>
  <text x="762" y="418" font-size="12" fill="#56655f">FERMT2, CASS4, EPHA1</text>
  <text x="762" y="470" font-size="11" fill="#56655f">34 genes in all;</text>
  <text x="762" y="486" font-size="11" fill="#56655f">grouping follows the project page</text>
</svg>
