<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">GSDMD:TMEM106A, a trans-spliced chimera (mouse macrophages)</text>
<g font-size="13">
<!-- chromosomes -->
<text x="30" y="80" fill="#56655f">two separate loci</text>
<line x1="30" y1="110" x2="300" y2="110" stroke="#8fa39c" stroke-width="8" stroke-linecap="round"/>
<rect x="110" y="98" width="110" height="24" rx="3" fill="#0e6b66"/><text x="165" y="115" fill="#ffffff" text-anchor="middle" font-weight="bold">Gsdmd</text>
<line x1="30" y1="180" x2="300" y2="180" stroke="#8fa39c" stroke-width="8" stroke-linecap="round"/>
<rect x="130" y="168" width="110" height="24" rx="3" fill="#b8620f"/><text x="185" y="185" fill="#ffffff" text-anchor="middle" font-weight="bold">Tmem106a</text>
<!-- looping -->
<path d="M225 110 C 300 110, 300 180, 240 180" stroke="#1d68b3" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
<text x="310" y="140" fill="#1d68b3" font-weight="bold">inflammation induces</text>
<text x="310" y="158" fill="#1d68b3">interchromosomal contact</text>
<text x="310" y="176" fill="#56655f">(chromatin conformation capture)</text>
<!-- trans-splicing -->
<line x1="500" y1="145" x2="560" y2="145" stroke="#0e6b66" stroke-width="3"/><polygon points="560,138 574,145 560,152" fill="#0e6b66"/>
<text x="580" y="120" fill="#15201e" font-weight="bold">RNA trans-splicing</text>
<text x="580" y="140" fill="#56655f">no DNA rearrangement</text>
<!-- chimeric mRNA -->
<rect x="580" y="160" width="190" height="26" fill="#0e6b66"/><rect x="770" y="160" width="150" height="26" fill="#b8620f"/>
<text x="675" y="178" fill="#ffffff" text-anchor="middle">GSDMD pore-forming part</text>
<text x="845" y="178" fill="#ffffff" text-anchor="middle">out-of-frame</text>
<text x="845" y="206" fill="#b8620f" text-anchor="middle">not canonical TMEM106A</text>
<!-- membrane -->
<rect x="30" y="330" width="900" height="36" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="40" y="390" fill="#56655f">plasma membrane</text>
<!-- pore: canonical GSDMD-NT subunits -->
<g fill="#dcefec" stroke="#0e6b66" stroke-width="2">
<rect x="430" y="300" width="22" height="96" rx="6"/><rect x="456" y="300" width="22" height="96" rx="6"/><rect x="560" y="300" width="22" height="96" rx="6"/><rect x="586" y="300" width="22" height="96" rx="6"/>
</g>
<text x="519" y="418" text-anchor="middle" fill="#0e6b66" font-weight="bold">canonical GSDMD-NT pore</text>
<!-- chimera -->
<rect x="622" y="300" width="22" height="96" rx="6" fill="#0e6b66"/><rect x="622" y="396" width="22" height="30" rx="6" fill="#b8620f"/>
<text x="655" y="283" fill="#15201e" font-weight="bold">chimeric protein</text>
<text x="655" y="301" fill="#15201e">binds canonical GSDMD-NT,</text>
<text x="655" y="319" fill="#15201e">accelerates pore formation</text>
<path d="M722 206 C 722 250, 640 250, 634 296" stroke="#8fa39c" stroke-width="2" fill="none"/><polygon points="627,292 634,304 641,292" fill="#8fa39c"/>
<text x="740" y="232" fill="#56655f">translated; upregulated</text>
<text x="740" y="248" fill="#56655f">by inflammasome priming</text>
<!-- IL-1b -->
<circle cx="508" cy="250" r="6" fill="#bd3a30"/><circle cx="530" cy="236" r="6" fill="#bd3a30"/><circle cx="520" cy="215" r="6" fill="#bd3a30"/>
<line x1="519" y1="340" x2="519" y2="265" stroke="#bd3a30" stroke-width="2"/><polygon points="512,268 519,255 526,268" fill="#bd3a30"/>
<text x="360" y="230" fill="#bd3a30" font-weight="bold">IL-1β release,</text>
<text x="360" y="248" fill="#bd3a30">pyroptosis</text>
<!-- in vivo -->
<rect x="30" y="440" width="900" height="60" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="45" y="465" fill="#15201e"><tspan font-weight="bold">In vivo:</tspan> loss protects against lethal sepsis but weakens antibacterial defence;</text>
<text x="45" y="485" fill="#15201e">overexpression improves host protection but raises sepsis lethality. (PMID:42686912)</text>
</g>
</svg>
