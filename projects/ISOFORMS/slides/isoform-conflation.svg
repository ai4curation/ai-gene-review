<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker></defs>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">One gene, opposite products</text>
  <!-- Splicing: BCL2L1 -->
  <text x="40" y="80" font-size="15" font-weight="600" fill="#15201e">Alternative splicing · BCL2L1</text>
  <g>
    <rect x="40" y="100" width="60" height="26" fill="#dcefec" stroke="#0e6b66"/><text x="70" y="118" text-anchor="middle" font-size="12">exon 1</text>
    <rect x="110" y="100" width="80" height="26" fill="#dcefec" stroke="#0e6b66"/><text x="133" y="118" text-anchor="middle" font-size="12">exon 2</text>
    <rect x="160" y="100" width="30" height="26" fill="#f6efe6" stroke="#b8620f"/>
    <rect x="200" y="100" width="70" height="26" fill="#dcefec" stroke="#0e6b66"/><text x="235" y="118" text-anchor="middle" font-size="12">exon 3</text>
    <text x="175" y="146" text-anchor="middle" font-size="11" fill="#b8620f">xL-only segment (alt. 5' splice site)</text>
  </g>
  <path d="M150 155 L90 200" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M200 155 L260 200" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="205" width="150" height="62" rx="8" fill="#e9f5ee" stroke="#1d8a4b"/>
  <text x="95" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">Bcl-xL</text>
  <text x="95" y="252" text-anchor="middle" font-size="12" fill="#1d8a4b">anti-apoptotic</text>
  <rect x="190" y="205" width="150" height="62" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="265" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">Bcl-xS</text>
  <text x="265" y="252" text-anchor="middle" font-size="12" fill="#bd3a30">pro-apoptotic</text>
  <!-- Cleavage: POMC -->
  <text x="520" y="80" font-size="15" font-weight="600" fill="#15201e">Proteolytic cleavage · POMC</text>
  <rect x="520" y="100" width="400" height="26" fill="#e8f1ee" stroke="#0e6b66"/>
  <rect x="640" y="100" width="70" height="26" fill="#dcefec" stroke="#0e6b66"/><rect x="640" y="100" width="28" height="26" fill="#e9f5ee" stroke="#1d8a4b"/><text x="654" y="118" text-anchor="middle" font-size="10">α</text>
  <text x="690" y="118" text-anchor="middle" font-size="11">ACTH</text>
  <rect x="840" y="100" width="80" height="26" fill="#fbe9e7" stroke="#bd3a30"/><text x="880" y="118" text-anchor="middle" font-size="11">β-endorphin</text>
  <text x="720" y="146" text-anchor="middle" font-size="11" fill="#56655f">PC1/3, PC2 cleave the 267-aa precursor</text>
  <path d="M654 155 L610 200" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M880 155 L840 200" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="520" y="205" width="170" height="62" rx="8" fill="#e9f5ee" stroke="#1d8a4b"/>
  <text x="605" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">α-MSH</text>
  <text x="605" y="252" text-anchor="middle" font-size="12" fill="#1d8a4b">anorexigenic (MC4R)</text>
  <rect x="750" y="205" width="170" height="62" rx="8" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="835" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">β-endorphin</text>
  <text x="835" y="252" text-anchor="middle" font-size="12" fill="#bd3a30">orexigenic opioid</text>
  <!-- merge -->
  <path d="M180 270 C260 330 380 350 430 370" stroke="#7657a3" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M720 270 C660 330 560 350 530 370" stroke="#7657a3" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <rect x="250" y="370" width="460" height="70" rx="10" fill="#f3eff8" stroke="#7657a3" stroke-width="1.6"/>
  <text x="480" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#7657a3">Gene-level GO annotation</text>
  <text x="480" y="422" text-anchor="middle" font-size="13" fill="#15201e">both functions land on one gene record</text>
  <text x="40" y="478" font-size="13" fill="#15201e">Review response: record the tested isoform (<tspan font-family="Menlo, monospace">isoform</tspan>), NOT rows (<tspan font-family="Menlo, monospace">negated</tspan>),</text>
  <text x="40" y="498" font-size="13" fill="#15201e">name the distinct products (<tspan font-family="Menlo, monospace">functional_isoforms</tspan>), and mark conflated rows over-annotated.</text>
</svg>
