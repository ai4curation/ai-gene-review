cross_isolate:
  description: 'A single PMID cited by CACAO rows on gene products from more than one taxon. The Gag review
    found four rows giving this isolate experimental codes for prototype-foamy-virus experiments, where
    ISS is the right code. Taxon count alone is a poor screen: the widest reference here spans 25 taxa
    and is a comparative study that legitimately annotates each. The candidate set is therefore references
    spanning 2-4 taxa whose organism names look like isolates of one species group; each still needs the
    paper read, since a paper may genuinely assay two of them.'
