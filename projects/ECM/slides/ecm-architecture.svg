<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="tb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0 L5 10" stroke="#bd3a30" stroke-width="3"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Ten ECM genes, placed in the matrix they build or regulate</text>
  <!-- epithelial cells -->
  <g fill="#e8f1ee" stroke="#8fa39c" stroke-width="2">
    <rect x="30" y="60" width="130" height="70" rx="10"/><rect x="170" y="60" width="130" height="70" rx="10"/><rect x="310" y="60" width="130" height="70" rx="10"/>
  </g>
  <text x="235" y="100" font-size="13" text-anchor="middle" fill="#56655f">cells</text>
  <!-- basement membrane -->
  <rect x="30" y="140" width="410" height="110" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="40" y="160" font-size="13" fill="#0e6b66" font-weight="bold">BASEMENT MEMBRANE</text>
  <path d="M45 190 L425 190" stroke="#56655f" stroke-width="3"/><text x="430" y="186" font-size="11" fill="#56655f" text-anchor="end">laminin network</text>
  <path d="M45 232 L90 215 L135 232 L180 215 L225 232 L270 215 L315 232 L360 215 L405 232" fill="none" stroke="#56655f" stroke-width="3"/><text x="430" y="246" font-size="11" fill="#56655f" text-anchor="end">collagen IV network</text>
  <g font-size="13" font-weight="bold" fill="#15201e">
    <rect x="70" y="197" width="60" height="22" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="100" y="213" text-anchor="middle">NID1</text>
    <rect x="175" y="197" width="70" height="22" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="210" y="213" text-anchor="middle">HSPG2</text>
    <rect x="290" y="197" width="60" height="22" rx="4" fill="#ffffff" stroke="#0e6b66"/><text x="320" y="213" text-anchor="middle">AGRN</text>
  </g>
  <text x="30" y="272" font-size="12" fill="#56655f">NID1 bridges laminin and collagen IV.</text><text x="30" y="288" font-size="12" fill="#56655f">HSPG2 (perlecan) and AGRN (agrin): basement-membrane proteoglycans.</text>
  <!-- interstitial matrix -->
  <rect x="480" y="60" width="450" height="330" rx="6" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <text x="490" y="80" font-size="13" fill="#56655f" font-weight="bold">INTERSTITIAL MATRIX</text>
  <!-- collagen fibrils -->
  <g stroke="#8fa39c" stroke-width="10" stroke-linecap="round"><line x1="510" y1="120" x2="900" y2="120"/><line x1="510" y1="160" x2="900" y2="160"/></g>
  <text x="905" y="145" font-size="11" fill="#56655f" text-anchor="end">collagen I fibrils</text>
  <g font-size="13" font-weight="bold" fill="#15201e">
    <rect x="560" y="129" width="54" height="22" rx="11" fill="#ffffff" stroke="#0e6b66"/><text x="587" y="145" text-anchor="middle">DCN</text>
    <rect x="650" y="129" width="60" height="22" rx="11" fill="#ffffff" stroke="#0e6b66"/><text x="680" y="145" text-anchor="middle">EPYC</text>
    <rect x="750" y="129" width="68" height="22" rx="11" fill="#ffffff" stroke="#0e6b66"/><text x="784" y="145" text-anchor="middle">SPARC</text>
  </g>
  <text x="510" y="192" font-size="12" fill="#56655f">DCN, EPYC: small leucine-rich proteoglycans; SPARC binds collagen</text>
  <!-- FN1 fibril -->
  <path d="M510 235 C560 215 600 255 650 235 C700 215 740 255 790 235" fill="none" stroke="#1d68b3" stroke-width="5"/>
  <text x="800" y="240" font-size="14" font-weight="bold" fill="#1d68b3">FN1</text>
  <text x="510" y="268" font-size="12" fill="#56655f">fibronectin fibrils: cell adhesion, migration, wound healing</text>
  <!-- SPOCK -->
  <rect x="510" y="295" width="130" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="575" y="315" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">SPOCK1 · 3</text>
  <rect x="740" y="295" width="80" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="780" y="315" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">MMPs</text>
  <line x1="640" y1="310" x2="735" y2="310" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#tb)"/>
  <rect x="610" y="345" width="90" height="30" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="655" y="365" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">SPOCK2</text>
  <line x1="640" y1="345" x2="600" y2="329" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#tb)"/>
  <text x="710" y="364" font-size="12" fill="#b8620f">counter-inhibitor of SPOCK1/3</text>
  <!-- phases legend -->
  <g font-size="13" fill="#15201e">
    <text x="30" y="340" font-weight="bold" fill="#0e6b66">Review phases</text>
    <text x="30" y="364">Phase 1: AGRN, HSPG2, EPYC</text>
    <text x="30" y="386">Phase 2: SPOCK1, SPOCK2, SPOCK3 (testicans)</text>
    <text x="30" y="408">Phase 3: NID1, FN1, DCN, SPARC</text>
  </g>
  <text x="30" y="490" font-size="13" fill="#56655f">Roles from the project notes and gene reviews. Red bar: inhibition.</text>
</svg>
