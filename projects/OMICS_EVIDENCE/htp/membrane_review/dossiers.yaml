  evidence_type: HDA
  current_action: MARK_AS_OVER_ANNOTATED
  current_summary: 'ACAP1 was identified in the membrane fraction of the YTS natural-killer cell line by two-dimensional LC-MS/MS,
    one of 1843 proteins. The native context is right - ACAP1 is tissue-enhanced in bone marrow and lymphoid tissue, so an
    NK-like line is a reasonable place to find it, and detection at protein level is not in doubt. What the experiment cannot
    do is say which membrane, and in this instance it argues against itself. The authors treated the isolated membranes specifically
    to strip peripheral proteins, and describe the surviving non-integral fraction as proteins that would be predicted to
    be transiently associated with membranes. ACAP1 is precisely such a protein: peripheral, cytoplasmic-side, recruited on
    demand by ARF6-GTP and otherwise soluble. So it is in this dataset as a member of the class the method was trying to remove,
    and the term it produced - an unspecified bilayer - conveys none of what is actually known about where the protein sits.
    Marked over-annotated for lack of specificity, not because the detection is doubted. GO:0055038 recycling endosome membrane,
    already on the gene, is the statement this row should have been.'
  current_reason: Unspecified membrane from a proteomic fractionation that by design cannot resolve which membrane, and that
    was attempting to deplete exactly the peripheral class ACAP1 belongs to. A more specific and better-supported compartment
    term is already present.
