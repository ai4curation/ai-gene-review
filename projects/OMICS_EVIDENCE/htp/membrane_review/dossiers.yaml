  current_summary: PMID:19946888 is a membrane proteome study of NK cells that identified 1843 proteins from isolated membrane
    fractions. DNAJB6 was detected in this high-throughput proteomic analysis. However, DNAJB6 has no transmembrane domains
    and is not known to be a membrane protein. The detection likely reflects association with membrane-proximal complexes
    or contamination of membrane fractions with cytoplasmic proteins. The study itself notes that approximately 60% of identified
    proteins were not predicted membrane proteins but were "largely involved in cellular processes and molecular functions
    that could be predicted to be transiently associated with membranes."
  current_reason: DNAJB6 is a soluble cytoplasmic/nuclear protein with no transmembrane domains. Detection in a membrane proteome
    study (PMID:19946888) likely reflects cytoplasmic contamination of membrane fractions or transient association. The study
    itself acknowledges that ~60% of identified proteins are not integral membrane proteins. No other evidence supports membrane
    localization for DNAJB6. UniProt lists cytoplasm and nucleus as subcellular locations, not membrane.
