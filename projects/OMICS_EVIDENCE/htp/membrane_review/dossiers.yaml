  current_summary: Membrane, from an NK-cell membrane proteome. True but subsumed by plasma membrane.
  current_reason: 'The paper isolated membranes and ''treated with reagents that have been reported to remove peripheral membrane
    proteins'', so recovering AHNAK - a peripheral, cytosol-facing protein with no transmembrane segment and no lipid anchor
    in UniProt''s feature table - says it resisted that treatment, not that it is an integral membrane protein. The general
    term is kept rather than MODIFYed to GO:0005886, and the rule this review applies is: refine a term when the same experiment
    that produced the row identifies the more specific entity, and keep it when the term is general because the assay itself
    cannot discriminate. The two GO:0005515 rows moved to GO:0044548 qualify because those experiments name S100A10; a bulk
    membrane preparation names no membrane, so replacing this row with plasma membrane would assert something PMID:19946888
    did not show. AHNAK''s plasma-membrane localisation is certain, but it is carried by the five rows that measured it.'
