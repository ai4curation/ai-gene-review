  evidence_type: HDA
  current_action: KEEP_AS_NON_CORE
  current_reason: 'The protein was catalogued in the exosome fraction of human parotid saliva by shotgun proteomics, and the
    detection is coherent rather than incidental: HGNC''s alias name for the gene is skin and saliva secreted protein 1, the
    Human Protein Atlas calls expression group-enriched in blood vessel, salivary gland and skin, and the only functional
    paper reports the same salivary-gland and skin distribution. Verified as a descendant of GO:0005576, so this row and the
    extracellular-region row are consistent rather than competing, with this one strictly more specific. It is retained for
    that reason. Non-core rather than core, on two grounds. The first is what the evidence is: a single HDA detection in one
    large-scale dataset, which the HDA code already encodes as such, and an exosome preparation from a secretory fluid co-purifies
    abundant soluble secreted proteins routinely. The second is decisive, and it is about what a core location asserts. Every
    measurement of what this peptide does was made on free peptide added to a bacterial culture or injected into an animal,
    and the paper''s own SUMO-fusion control - activity abolished by an N-terminal tag and restored on cleavage - argues that
    the functional species is free soluble peptide rather than peptide packaged in a vesicle. Nothing shows the peptide acting
    in or on an exosome lumen. Listing it among core locations would therefore assert a compartment of action that no experiment
    supports, so the core location is GO:0005576 alone. The wider practice agrees: across the merged human reviews GO:0070062
    is kept non-core or marked over-annotated about eight times for every acceptance, and it appears in core_functions.locations
    in only two genes, both with genuine exosome biology. One limitation stated plainly: the cached copy of this paper does
    not include the protein catalogue in which C5orf46 appears, so no sentence of it is quoted about this gene and the row
    is assessed on its provenance. That provenance was checked, and the check came back clean rather than damning. Fully paginated,
    the reference carries 396 annotations over 396 distinct entities, all to GO:0070062, all HDA, all assigned by UniProt
    - one entity, one annotation, one localisation term - and no functional or phenotype term appears anywhere in it. That
    is a proteomic inventory, not the pattern in which one experiment''s phenotype is projected across a set of proteins.'
