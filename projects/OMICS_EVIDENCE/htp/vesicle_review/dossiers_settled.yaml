  term: GO:0070062 extracellular exosome
  reference: PMID:23533145
  reference_title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  evidence_type: HDA
  current_action: KEEP_AS_NON_CORE
  current_reason: ITIH2 is an abundant plasma protein, and its detection in exosome preparations may reflect plasma contamination
    rather than bona fide exosomal localization. Exosomes are secreted in biological fluids that also contain plasma proteins,
    making it difficult to distinguish true exosomal components from co-purifying plasma proteins in HDA studies. While ITIH2
    may be present in exosomal fractions, this does not represent a core functional localization. The primary and functionally
    relevant localization of ITIH2 is in plasma and the ECM where it stabilizes hyaluronan. This annotation should be kept
    but marked as non-core.
