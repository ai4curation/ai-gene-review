  current_action: KEEP_AS_NON_CORE
  current_reason: 'The reference-projection test shows this PMID annotates 1046 distinct gene products with GO:0070062 and
    nothing else, all HDA, all assigned by UniProt. That is a bulk import, not 1046 independent findings; ADIRF is not mentioned
    anywhere in the paper''s narrative and the row derives from a supplementary identification list. One count I could not
    reconcile and am recording rather than explaining away: the paper''s text says close to 900 proteins were identified in
    the two pools, while GOA imported 1046 entities from it, and the identifications live in a supplemental table absent from
    the cached text. ADIRF''s presence outside the cell is independently real and better supported than the exosome-specific
    claim: it is measured in human serum by ELISA at microgram-per-millilitre concentrations across 139 patients (PMID:33737617)
    and detected as an intact protein by top-down mass spectrometry in lipoaspirate fluid (PMID:26719138). Neither is in GOA.
    That corroboration is why this row is kept rather than marked over-annotated. It supports the parent - GO:0070062 is a
    verified descendant of GO:0005576 extracellular region - and not the exosome mechanism, which requires release by multivesicular-body
    fusion and has never been tested for ADIRF. I did not propose GO:0005576 separately because this row already entails it.
    The protein has no signal peptide and no transmembrane segment, so the export route is unknown; that is filed as a knowledge
    gap.'
