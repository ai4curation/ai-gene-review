  evidence_type: HDA
  current_action: MARK_AS_OVER_ANNOTATED
  current_reason: Not removed, because the detection is a real measurement and the annotation honestly carries the HDA code
    that says so. Marked over-annotated because "located_in extracellular exosome" reads as a statement about where the protein
    resides and functions, which this evidence does not support. ARHGAP23 has no signal peptide and no transmembrane segment
    in its UniProt record, is a 1491-residue protein whose every characterized pool is on the inner face of a membrane or
    in the cytoplasm, and the study reports no enrichment, no orthogonal validation and no secretion route for it. The generic
    caution about large mass-spectrometry inventories applies with particular force to a protein that is Tdark in Pharos and
    has no orthogonal localization data outside the handful of papers reviewed here. Retaining it as over-annotated keeps
    the observation visible to anyone who later finds a reason for it, without letting it stand alongside the experimentally
    grounded localizations proposed below.
