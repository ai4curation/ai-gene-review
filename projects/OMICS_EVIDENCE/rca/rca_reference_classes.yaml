# Curated analysis-type calls for references behind RCA annotations in GOA.
# Read by rca_source_catalog.py; a call here overrides the title keyword rules.
# Covers every reference with >=5 RCA rows (QuickGO download of 2026-10-05), each judged
# from its PubMed abstract (and, for proteomics papers, from what GOA asserts from it).
#
# Classes:
#   proteomics               MS identification/quantification of a fraction, tissue or organelle   [omics]
#   interactomics            co-complex / affinity-purification / co-fractionation MS               [omics]
#   transcriptomics          expression profiling                                                  [omics]
#   genetic_screen           genome-scale mutant/phenotype screens                                 [omics]
#   other_omics              other high-throughput experimental data (e.g. fusion-reporter screens) [omics]
#   proteome_scale_prediction genome/proteome-wide *computational* prediction (classifier, motif,
#                            domain scan); any experiment in the paper is validation of a subset
#   family_or_genome_survey  sequence analysis of one gene family or one genome's repertoire
#   pathway_or_metabolic_model pathway database / metabolic reconstruction
#   single_gene_study        cloning/characterisation of one gene, operon or a few paralogs
#   unresolved               could not determine what the reference is

GO_REF:0000123:
  class: pathway_or_metabolic_model
  title: YeastPathways to GO-CAM conversion
  note: >-
    SGD pathway GO-CAMs exported to GAF; WITH/FROM = SGD_PWY:*. A curated pathway
    model is not a computational analysis of large-scale data; IC or TAS-like pathway
    evidence would describe it better than RCA. Treated as a quirk, not studied here.
PMID:20660476:
  class: proteome_scale_prediction
  note: >-
    SVM classifier for mitochondrial localization (T. brucei MitoCarta); RNA-seq in the
    same paper measures expression, not location. All 1,039 rows are CC mitochondrion.
PMID:30358795:
  class: proteome_scale_prediction
  note: >-
    Zinc proteome "identified using a bioinformatics analysis that combined global
    domain searches with local motif searches"; mass spectrometry in the same paper
    measured abundance only. The GO term (zinc ion binding) comes from the prediction.
PMID:21166475:
  class: proteomics
  note: >-
    LC-MS/MS of the Arabidopsis cytosolic fraction. All 436 GOA rows are
    NOT|located_in cytosol, i.e. assertions about proteins *outside* the robust set.
