  evidence:
    summary: 'All 20 source rows and the core synthesis were re-reviewed. PMID:36244454 was read in full: ER-luminal
      proximity labeling and microsomal enrichment support a principal tested ER pool, but cytosolic TTR mistargeting
      is not localization of HSPA13 itself and the experiment does not establish exclusive residence. PMID:33672238
