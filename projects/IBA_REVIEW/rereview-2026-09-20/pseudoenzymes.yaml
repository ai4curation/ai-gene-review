  - original_index: 36
    term_id: GO:0090625
    term_label: siRNA-mediated gene silencing by mRNA destabilization
    evidence_type: IDA
    original_reference_id: PMID:15260970
    negated: true
    previous_action: ACCEPT
    action: UNDECIDED
    outcome: changed
    rationale: Live QuickGO (2026-09-21) retains this BHF-UCL NOT|involved_in IDA row citing PMID:15260970,
      contrary to the new OpenScientist report's claim that no such negative annotation exists. GO:0090625
      explicitly defines siRNA-directed target cleavage and cites PMID:15260970; its name alone cannot
      be read as a generic deadenylation process. The cached 2004 paper is abstract-only and establishes
      AGO2-specific endonuclease activity, which can support a cleavage-scoped negative. Full-text PMID:19838187
      independently shows that tethered human AGO4 can promote biphasic deadenylation in mouse NIH3T3
      cells; this establishes decay capacity but does not directly test natural guide-dependent recruitment
      or contradict a cleavage-specific NOT. Keep the original negation and UNDECIDED pending clarification
      of intended term scope and access to the original assay details. The report's blanket recommendation
      to move all negative claims to molecular function is not adopted.
