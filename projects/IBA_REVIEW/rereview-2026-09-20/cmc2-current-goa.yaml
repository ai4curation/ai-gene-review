date: '2026-10-01'
scope: Full-gene re-review of yeast CMC2 after a current GOA refresh in the IBA campaign.
genes:
- gene_file: genes/yeast/CMC2/CMC2-ai-review.yaml
  status: reviewed
  scope: full_gene
  outcome: Refreshed CMC2 against current GOA, confirmed that all 12 live source
    rows were already represented, backfilled exact PAINT and UniProt-SubCell
    supporting entities, fetched the hidden PTHR22977 PAINT family, and added
    structured propagation review to the sole IBA row. Removed the C-terminal
    GFP nucleus call and marked the companion cytoplasm row as over-annotated.
  counts:
    original_annotations_assessed: 12
    original_source_rows_preserved: 12
    final_rows: 12
    final_active_rows: 12
    final_retired_rows: 0
    final_actions:
      ACCEPT: 6
      KEEP_AS_NON_CORE: 4
      MARK_AS_OVER_ANNOTATED: 1
      REMOVE: 1
  source_preservation: Every historical source assertion remains represented in
    the refreshed review; no rows were retired or removed.
  evidence:
    cached_primary_pmids:
    - '19703468'
    - '20220131'
    - '22984289'
    - '24769239'
    cached_background_pmids:
    - '14562095'
    - '38612624'
    paint_nodes:
    - PANTHER:PTN001884832
    literature_search:
      query: PubMed exact CMC2/Cmc2/YBL059C-A mentions in yeast from 2024-2026
      result: Newer yeast COX-assembly and respiratory-chain papers did not change
        the Cmc2-specific annotation review.
    assessment: The sole CMC2 IBA is a sound but generic mitochondrial localization
      propagated from a PTHR22977 PAINT node seeded by yeast Cmc1/Cmc2 and human
      CMC1/CMC2. The more specific mitochondrial intermembrane space and inner
      membrane rows remain the primary localization calls.
  current_goa_refresh:
    prior_review_rows: 12
    current_goa_rows: 12
    newly_seeded_live_rows_reviewed: 0
    refreshed_rows:
    - Backfilled the PANTHER:PTN001884832 source on the live IBA row.
    - Backfilled UniProtKB-SubCell sources on the mitochondrial inner membrane
      and intermembrane space IEA rows.
    - Changed the PMID:14562095 C-terminal GFP nucleus HDA row to REMOVE based
      on evidence that GFP tags can interfere with IMS import and mistarget IMS
      proteins.
    - Changed the companion GO:0005737 cytoplasm HDA row to MARK_AS_OVER_ANNOTATED
      because it is an entailed but overbroad parent of mitochondrial localization.
    retired_rows_by_term: {}
  adjudication:
  - term_id: GO:0005634
    term_label: nucleus
    action: REMOVE
    reason: Genome-wide C-terminal GFP localization is contradicted by tag-free
      mitochondrial intermembrane-space evidence and is likely to reflect impaired
      IMS import of the fusion protein.
  - term_id: GO:0005737
    term_label: cytoplasm
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0005737 is an entailed but overbroad parent of Cmc2's mitochondrial
      intermembrane-space localization, and the C-terminal GFP signal adds no
      independent support for a stable functional cytoplasmic pool.
  follow_up_changes:
  - pr: 3731
    summary: Reclassified the GO:0005737 cytoplasm row from REMOVE to MARK_AS_OVER_ANNOTATED
