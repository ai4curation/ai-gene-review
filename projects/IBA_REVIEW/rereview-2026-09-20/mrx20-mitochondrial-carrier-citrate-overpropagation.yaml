      PTHR45788 PAINT places citrate transporter activity at PTN000640552, a
      eukaryotic mitochondrial-carrier node whose characterized descendants
      include SLC25A1/CTP1 citrate carriers. MRX20 belongs to PTHR45788:SF5, an
