      - source_id: UniProtKB:P53007
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P79110
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
evidence:
- type: paint
  path: interpro/panther/PTHR45788/PTHR45788-paint.tsv
  summary: >-
    PTN000640552 carries the two citrate IBD assertions; PTN002909487 carries the
    broad mitochondrion IBD assertion.
- type: panther_entries
  path: interpro/panther/PTHR45788/PTHR45788-entries.csv
  summary: >-
    The P43617/MRX20 entry is classified in PTHR45788:SF5, whose reviewed
    entries are the same uncharacterized YFR045W carrier in four Saccharomyces
    strain assemblies. Budding-yeast CTP1 and mammalian SLC25A1 are instead in
    the characterized PTHR45788:SF4 tricarboxylate-carrier branch.
- type: literature
  reference_id: PMID:40836422
  summary: >-
    A 2025 yeast SLC25 review still lists Mrx20/YFR045W with unknown human
    homolog, abundance, and physiological role.
recommended_follow_up:
- >-
  Ask PAINT whether the GO:0071913 and GO:0006843 IBD assertions should be
  moved from PTN000640552 to the characterized tricarboxylate/citrate carrier
  branch, excluding the uncharacterized Saccharomyces PTHR45788:SF5 branch.
