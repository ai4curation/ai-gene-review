    original_reference_id: GO_REF:0000033
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: confirmed
    rationale: >-
      The biological-process row follows the same PTN000640552
      over-propagation as the citrate transporter activity. MRX20 is likely a
      mitochondrial inner-membrane solute carrier, but its transported substrate
      is unknown and citrate movement has not been shown for the YFR045W
      PTHR45788:SF5 branch.
    propagation_review:
