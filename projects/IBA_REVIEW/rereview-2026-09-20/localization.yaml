    term: GO:0004521
    label: RNA endonuclease activity
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: PIWIL1 has conserved RNA endonuclease activity that cleaves guide-complementary targets. This molecular-function
      call does not imply that mammalian PIWIL1 executes a canonical ping-pong amplification cycle.
  - index: 3
    term: GO:0034587
    label: piRNA processing
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: ACCEPT
    reason: The accepted primary piRNA processing annotations already establish participation in this parent
      process. A more specific annotation does not falsify a broader IBA, and piRNA binding is not a cross-aspect
      replacement for this biological process. The PAINT assertion at PTN002339693 is compatible with the conserved
      PIWI contribution to piRNA biogenesis. PMID:38491008 describes MIWI recruitment to the intermitochondrial
      cement for piRNA processing followed by loading-dependent transfer to chromatoid bodies, providing ortholog
      mechanistic support beyond the annotation hierarchy.
