- gene_file: genes/worm/wago-1/wago-1-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 15
  review_method: All existing annotation terms/actions were screened against gene biology and their rationales;
    challenged calls received focused primary-source and ontology checks. Abstract-only evidence was not treated
    as proof that an experiment was absent. This is not a claim that every cited publication was accessible
    in full.
  outcome: Withdrew nuclear exclusion based only on cytoplasmic enrichment. Incorporated the restored existing
    OpenScientist report on cytoplasmic P-granule function versus nuclear HRDE-1, guide specificity, non-slicer
    mechanism and interacting helicases. Retained disputed endonuclease/miRNA transfers with source-node metadata.
  changes:
  - index: 0
    term: GO:0005634
    label: nucleus
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: UNDECIDED
    reason: Direct studies support P-granule localization and a cytoplasmic silencing role. Those positive
      results do not alone establish absence from every nuclear context. The nuclear IBA from PTN001875625
      is left unresolved pending lineage-specific localization assessment; the separate WAGO catalytic-loss
      argument does not establish a localization loss. The existing OpenScientist report explicitly separates
      cytoplasmic WAGO-1/P-granule surveillance from nuclear HRDE-1/NRDE silencing. This supports the canonical
      compartment distinction but does not supply direct exclusion evidence for every possible nuclear WAGO-1
      pool; no duplicate OpenScientist query was launched.
  - index: 1
    term: GO:0005737
    label: cytoplasm
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: Cytoplasmic localization is accurate - WAGO-1 localizes to cytoplasmic P granules (PMID:19800275,
      PMID:24684931). This is a valid parent term for the more specific P granule localization. Retaining as
      it provides broader context.
  - index: 2
    term: GO:0004521
    label: RNA endonuclease activity
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: REMOVE
    reason: WAGO-1 lacks the catalytic tetrad required for RNA endonuclease (slicer) activity. This is a known
      distinguishing feature of the WAGO subfamily. The protein likely recruits other endonucleases for target
      degradation rather than performing cleavage itself. This annotation is an over-annotation based on ancestral
      function that has been lost in this subfamily.
  - index: 3
    term: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: This annotation accurately captures WAGO-1's primary biological function. WAGO-1 participates in
      a regulatory ncRNA-mediated silencing pathway using endogenous 22G-RNAs. Experimental evidence from PMID:19800275
      demonstrates this function directly.
  - index: 4
    term: GO:0016442
    label: RISC complex
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: WAGO-1 is the core Argonaute component of a small RNA-mediated silencing complex. It associates
      with 22G-RNAs and interacts with RDE-12 (PMID:24684931) and ZNFX-1 (PMID:29775580) as part of the silencing
      machinery. RISC complex appropriately describes this functional complex.
  - index: 5
    term: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: This is a valid broader annotation. P granules are cytoplasmic ribonucleoprotein granules, and
      WAGO-1 localizes to P granules (PMID:19800275, PMID:24684931). The IBA annotation is consistent with
      experimental data.
  - index: 6
    term: GO:0035198
    label: miRNA binding
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: MODIFY
    new_action: MODIFY
    reason: WAGO-1 binds 22G-RNAs (endogenous siRNAs), not miRNAs. The miRNA binding annotation is an over-generalization
      from other Argonaute family members. The appropriate term is siRNA binding (GO:0035197), which accurately
      describes binding to the 21-23 nt small interfering RNAs that WAGO-1 associates with.
  - index: 7
    term: GO:0003727
    label: single-stranded RNA binding
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: WAGO-1 binds single-stranded 22G-RNAs as guide RNAs for target recognition. This is a core molecular
      function of Argonaute proteins. The annotation is appropriate though more specific terms like siRNA binding
      would also be accurate.
  - index: 11
    term: GO:0017151
    label: DEAD/H-box RNA helicase binding
    evidence_type: IPI
    reference: PMID:24684931
    old_action: ACCEPT
    new_action: ACCEPT
    reason: This is a well-supported experimental annotation. PMID:24684931 directly demonstrated physical
      interaction between WAGO-1 and RDE-12 (P90897), a DEAD-box RNA helicase. This interaction is functionally
      important for RNAi and endo-siRNA pathways.
  - index: 12
    term: GO:0043186
    label: P granule
    evidence_type: IDA
    reference: PMID:19800275
    old_action: ACCEPT
    new_action: ACCEPT
    reason: Direct experimental evidence (IDA) demonstrating P granule localization. This is a core cellular
      component annotation supported by primary literature. P granule localization is essential for WAGO-1's
      function in germline surveillance.
  evidence:
    primary_references:
    - PMID:19800275
    - PMID:24684931
    paint_tracing: PTHR22891 PAINT cache confirms nucleus PTN001875625, slicer PTN008584027 and miRNA-binding
      PTN001113179. Specific WAGO functional divergence supports the latter two disagreements.
  adjudication:
    second_opinion_questions:
    - Whether target-specific observations justify a stronger decision about nucleus than UNDECIDED; existing
      report establishes the canonical cytoplasmic versus HRDE-1 nuclear partition without exclusion of every
      possible pool.
    new_request_coordinator: null
    existing_openscientist_report: genes/worm/wago-1/wago-1-deep-research-openscientist.md
    existing_findings_incorporated: true
  validation:
    command: just validate worm wago-1
    status: passed
