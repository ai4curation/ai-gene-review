- gene_file: genes/worm/prg-1/prg-1-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 27
  review_method: All existing annotation terms/actions were screened against gene biology and their rationales;
    challenged calls received focused primary-source and ontology checks. Abstract-only evidence was not treated
    as proof that an experiment was absent. This is not a claim that every cited publication was accessible
    in full.
  outcome: 'Restored reported slicer/hydrolase activity as non-core; distinguished catalytic capacity from
    dispensability in major silencing assays. Withdrew nuclear and piRNA-processing exclusions pending role-specific
    adjudication, and updated outdated suggested experiments. Focused OpenScientist report and five primary
    full texts incorporated. Nuclear location and piRNA processing remain UNDECIDED: positive granule localization
    is nonexclusive, and the primary PARN-1 paper does not establish the report''s normal trimming-on-PRG-1
    model.'
  changes:
  - index: 0
    term: GO:0005634
    label: nucleus
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: UNDECIDED
    reason: PRG-1 enrichment in cytoplasmic-face P granules is directly established, including loading-dependent
      localization in PMID:41529195. This does not exclude a minor, transient or condition-dependent nuclear
      pool. The focused OpenScientist report identifies no direct nuclear-pool quantitation; its inference
      that a positive UniProt cytoplasm record (ECO:0000256) or P-granule IDA contradicts nucleus localization
      is not valid exclusion evidence. The broad ancestral assertion at PTN001875625 remains unresolved, rather
      than refuted or eligible for a NOT annotation.
  - index: 2
    term: GO:0004521
    label: RNA endonuclease activity
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: MARK_AS_OVER_ANNOTATED
    new_action: KEEP_AS_NON_CORE
    reason: PMID:22700655 reports recombinant PRG-1 slicing in vitro; PMID:34428467 explicitly recognizes this
      activity while finding it dispensable for limiting RNAi inheritance. The prior claim that no direct assay
      existed was incorrect. Retain the molecular activity while keeping the recruitment-dependent germline
      silencing mechanism distinct.
  - index: 3
    term: GO:0034587
    label: piRNA processing
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: MARK_AS_OVER_ANNOTATED
    new_action: UNDECIDED
    reason: The focused report supports noncatalytic participation by proposing that PRG-1 holds precursors
      during PARN-1 trimming. However, PMID:26919432 full text instead models trimming prior to or independently
      of PRG-1 loading and shows that untrimmed piRNAs become stable on PRG-1 in parn-1 mutants. It suggests
      PRG-1 or other factors might limit trimming, without demonstrating that mechanism. PMID:34469728 shows
      trimming/methylation protect against tailing; PMID:38244197 shows PRG-1-bound untrimmed piRNAs and anti-piRNAs
      in trimming-defective mutants. These are substantive precursor-binding observations but do not establish
      the report's normal maturation sequence. A direct positioning or assembly role would qualify without
      PRG-1 catalysis; neither conserved PIWI processing participation nor a PRG-1-specific loss is resolved
      here.
