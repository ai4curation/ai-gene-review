    label: nucleus
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: KEEP_AS_NON_CORE
    reason: PMID:28634417 reports both cytoplasmic and nuclear PIWIL1 immunostaining in 13 of 110 colorectal
      carcinomas. This peer-reviewed tissue evidence supports a context-dependent nuclear pool without making
      the nucleus the principal germline location. The IBA is an ancestral localization assertion, not an assertion
