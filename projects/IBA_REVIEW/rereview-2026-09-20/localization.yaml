    label: regulatory ncRNA-mediated gene silencing
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: PIWIL1 is the piRNA-guided effector for transposon and mRNA regulation. Target cleavage and recruitment
      of mRNA-decay machinery provide direct post-transcriptional mechanisms; this broad silencing term does
      not require PIWIL1 itself to catalyze DNA methylation.
