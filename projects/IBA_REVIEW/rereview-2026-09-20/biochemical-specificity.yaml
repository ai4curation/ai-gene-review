- gene_file: genes/human/EIF4E2/EIF4E2-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 44
  outcome: Restored all five challenged initiation-factor, initiation-process and eIF4F rows using
    the experimentally demonstrated hypoxic EIF4E2/eIF4A/eIF4G3 complex. Revised the
    description/core functions to include both activation and repression. Distinguished prevention
    of new initiation from release of stalled ribosomes.
  changes:
  - row_index: 1
    term:
      id: GO:0003743
      label: translation initiation factor activity
    evidence_type: IBA
    from_action: MODIFY
    to_action: ACCEPT
    reason: PTHR11960 places initiation-factor, initiation-process and eIF4F-complex assertions at
      PTN000238660. The prior review generalized inability to recruit canonical eIF4G1 into
      inability to recruit any eIF4G. Primary studies PMID:22678294 and PMID:26854219 demonstrate
      hypoxic translation and assembly of eIF4E2 with eIF4A and eIF4G3 (eIF4FH), together with
      functional depletion and polysome evidence. The GO eIF4F definition is not restricted to the
      EIF4E1/EIF4G1 paralog combination. These activities coexist with GIGYF-dependent repression,
      so the repressor function does not justify rejecting the inherited initiation role.
  - row_index: 2
    term:
      id: GO:0006413
      label: translational initiation
    evidence_type: IBA
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: PTHR11960 places initiation-factor, initiation-process and eIF4F-complex assertions at
      PTN000238660. The prior review generalized inability to recruit canonical eIF4G1 into
      inability to recruit any eIF4G. Primary studies PMID:22678294 and PMID:26854219 demonstrate
