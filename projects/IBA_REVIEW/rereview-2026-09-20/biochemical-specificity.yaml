    because the report itself acknowledges no NAD+ kinetics. Restored the mitochondrial REMOVE after
    verifying the ALDH1L2-specific additional targeting leader against primary literature and the
    rat ALDH1L1 N terminus. Retained actual NADP-dependent free-aldehyde chemistry as non-core and
    principal cytosolic location as core; corrected assay-complex identity and description.
  changes:
  - row_index: 0
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    evidence_type: IBA
    from_action: MODIFY
    to_action: UNDECIDED
    reason: The PAINT GO:0004029 assertion is at PTN000192666 and includes mouse Aldh1l1 among
      experimental descendants. NADP+ preference alone does not prove complete loss of NAD+
      turnover, and the NADP-specific term is a different cofactor reaction rather than a more
      specific child of the NAD+ reaction. The available rat studies establish NADP-dependent
      chemistry. Leave this cofactor-specific assertion unresolved pending intact-enzyme NAD+/NADP+
      comparisons and inspection of the ortholog evidence; do not diagnose paralog error from family
      breadth. The independent OpenScientist report recommends rejection, but its own limitations
      explicitly acknowledge the absence of NAD+ kinetics rather than a formal negative result.
      PMID:17302434 explains NADP preference through a phosphate contact; this also does not
      establish zero NAD+ turnover. Retain UNDECIDED after adjudication, pending a direct cofactor
      assay.
  - row_index: 1
    term:
      id: GO:0005739
      label: mitochondrion
    evidence_type: IBA
    from_action: REMOVE
    to_action: REMOVE
    reason: 'The mitochondrial IBD at PTN008524390 in PTHR11699 is supported by human ALDH1L2 (Q3SY69).
      The independent report adds a concrete targeting comparison: rat ALDH1L1 begins MKIAVIGQSL and lacks
      the additional N-terminal segment present in ALDH1L2. This was checked against the P28037 sequence
      and the primary full-text paralog comparison in PMID:20498374, which characterizes an additional
      22-residue ALDH1L2 leader and demonstrates mitochondrial localization of its fusion construct. PMID:21238436
