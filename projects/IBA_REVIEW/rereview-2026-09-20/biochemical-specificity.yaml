- gene_file: genes/human/CAPG/CAPG-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 40
  outcome: Retained the severing challenge using direct negative human assays and the existing
    report's domain-homology caveat. Preserved inherited CNS development as non-core, improved Ran
    binding specificity, and removed an incorrect assignment to the distinct alpha/beta capping
    heterodimer.
  changes:
  - row_index: 3
    term:
      id: GO:0051014
      label: actin filament severing
    evidence_type: IBA
    from_action: REMOVE
    to_action: REMOVE
    reason: PTHR11977 places severing at ancestral node PTN000240164. Human CAPG recombinant protein
      was assayed as a calcium-sensitive capping protein and explicitly did not sever preformed
      filaments (PMID:1322908). This target-specific functional distinction challenges retention
      along the CAPG branch. The existing OpenScientist report agrees and acknowledges that homology
      to the gelsolin N-terminal half is insufficient; domain count alone would not establish loss
      because other three-domain gelsolin fragments can sever.
  - row_index: 5
    term:
      id: GO:0007417
      label: central nervous system development
    evidence_type: IBA
    from_action: KEEP_AS_NON_CORE
    to_action: KEEP_AS_NON_CORE
    reason: PTHR11977 places central nervous system development at PTN008334354, with rat and
      zebrafish experimental descendants. No CAPG-specific loss of this inherited developmental role
      was established. The annotation is retained as a phylogenetic inference; generic involvement
      of actin in development is not itself target-specific experimental evidence.
  - row_index: 6
    term:
      id: GO:0030031
      label: cell projection assembly
    evidence_type: IBA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: CAPG is concentrated at ruffles of leading lamellipodia in activated macrophages and
      regulates actin dynamics at the cell cortex. Cell projection assembly is a direct functional
      consequence of CAPG's actin-capping activity at the membrane-cytoplasm interface.
  - row_index: 8
    term:
      id: GO:0001726
      label: ruffle
    evidence_type: IEA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: UniProt subcellular location data indicates CAPG localization to ruffles, which is
      consistent with its function as an actin-capping protein at the leading edge of activated
      macrophages.
  - row_index: 10
    term:
      id: GO:0005634
      label: nucleus
    evidence_type: IEA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: Nuclear localization of CAPG is well-documented. PMID:18266911 demonstrates CAPG nuclear
      import via NTF2/Ran, and nuclear CAPG may have functional roles in invasion and
      transcriptional regulation.
  - row_index: 12
    term:
      id: GO:0030027
      label: lamellipodium
    evidence_type: IEA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: Lamellipodium localization is directly relevant to CAPG's function as an actin-capping
      protein. It regulates barbed-end dynamics at the cortex and leading edge.
  - row_index: 17
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    from_action: REMOVE
    to_action: REMOVE
    reason: "\"Protein binding\" provides no functional insight. More specific terms should be used to
      describe CAPG's protein interactions."
  - row_index: 22
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    from_action: REMOVE
    to_action: MODIFY
    reason: The primary study identifies Ran as an interaction partner and reports binding to the
      NTF2-Ran complex. Small GTPase binding describes the Ran interaction more informatively than
      generic protein binding without asserting GTPase activity for CAPG.
  - row_index: 23
    term:
      id: GO:0005634
      label: nucleus
    evidence_type: IDA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: PMID:18266911 directly demonstrates CAPG nuclear import and characterizes the mechanism
      involving NTF2, Ran, and NUP62.
  - row_index: 38
    term:
      id: GO:0051016
      label: barbed-end actin filament capping
    evidence_type: TAS
    from_action: ACCEPT
    to_action: ACCEPT
    reason: PMID:1322908 is the primary reference establishing CAPG as a barbed-end capping protein.
      The TAS annotation is well-supported by the original biochemical characterization.
  - row_index: 39
    term:
      id: GO:0008290
      label: F-actin capping protein complex
    evidence_type: TAS
    from_action: ACCEPT
    to_action: REMOVE
    reason: QuickGO defines GO:0008290 as a heterodimer consisting of alpha and beta subunits.
      PMID:1322908 characterizes the cloned human 38.4-kDa gelsolin-family capping polypeptide; its
      ability to cap actin does not make it a subunit of the CAPZA/CAPZB-type heterodimer. The
      original capping activity remains accepted, but this named complex is a different molecular
      entity.
