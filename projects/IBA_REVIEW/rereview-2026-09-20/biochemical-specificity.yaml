  outcome: Retained the human ceramide-kinase challenge with corrected mouse-Agk/fly-Mulk
    phylogenetic grounding; restored a secondary plasma-membrane inference and softened separate
    lipid biosynthesis claims to UNDECIDED. Verified fusion-specific Reactome cytosol evidence.
  changes:
  - row_index: 0
    term:
      id: GO:0001729
      label: ceramide kinase activity
    evidence_type: IBA
    from_action: REMOVE
    to_action: REMOVE
    reason: The PAINT ceramide-kinase IBD is at PTN008994514, supported by mouse Agk and fly Mulk,
      not a transfer directly from a CERK-only clade. This is real conflicting ortholog evidence.
      The challenge rests on the direct human AGK assay in PMID:15939762 and the negative MuLK
      follow-up in PMID:16269826, rather than donor count or generic family membership. The existing
      OpenScientist report reaches the same activity conclusion but misidentifies the phylogenetic
      transfer as CERK-to-AGK; that explanation is not adopted. Retain removal for the tested human
      substrate specificity, recognizing that differences among orthologs and assay conditions
      underlie the disagreement.
  - row_index: 1
    term:
      id: GO:0004143
      label: ATP-dependent diacylglycerol kinase activity
    evidence_type: IBA
    from_action: ACCEPT
    to_action: ACCEPT
    reason: AGK directly phosphorylates diacylglycerol to phosphatidic acid in the human study and
      UniProt records EC 2.7.1.107 for this activity.
  - row_index: 3
    term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IBA
    from_action: REMOVE
    to_action: KEEP_AS_NON_CORE
    reason: The GOA source names PTN000270644 in PTHR12358; the current PAINT slice differs and
      should not be replaced by a CERK-specific localization node. PMID:15939762 reports less AGK in
      the plasma-membrane fraction, not its absence. Mitochondrial enrichment and TIM22
      incorporation do not exclude a smaller or condition-dependent pool. Retain this localization
      as non-core, with biochemical fractionation providing compatibility rather than proof of an
      exclusive plasma-membrane population.
  - row_index: 4
    term:
      id: GO:0046513
      label: ceramide biosynthetic process
    evidence_type: IBA
    from_action: REMOVE
    to_action: UNDECIDED
    reason: PTHR12358 places this process at PTN008994514. The prior review treated absence of
      ceramide kinase activity as sufficient to exclude ceramide biosynthesis, but phosphorylation
      consumes the named lipid and is not equivalent to its formation. The existing OpenScientist
      report evaluates substrate kinase activity and does not separately establish loss of the
      ancestral biosynthetic role. A pathway-specific assessment of the source process annotations
      and AGK biology is needed before removing this IBA.
