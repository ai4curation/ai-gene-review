  - original_row: 8
    term: GO:0045663
    evidence_type: IBA
    old_action: KEEP_AS_NON_CORE
    action: ACCEPT
    assessment: The matching mouse Akirin1 primary studies directly connect its overexpression to earlier MyoD expression
      and enhanced terminal myogenesis. The target inherits the positive PTN002665250 assertion, and the direct
      C2C12 experiments in PMID:23516508 support the same promyogenic capacity under glucocorticoid stress. These
      are active gene-regulatory effects, not merely the consequences of generic viability. Muscle differentiation
      is a well-supported biological role and is retained as core with its ortholog-inference scope.
  - original_row: 9
    term: GO:1902723
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: The original dismissal treated positive proliferation under glucocorticoid rescue as a universal
      sign. Mouse Akirin1 source PMID:18255059 instead reports earlier cell-cycle withdrawal during differentiation,
      and the actual target descends from the negative-proliferation IBD at PTN002665250. Independently, goat Akirin1
      overexpression reduces proliferation markers and EdU/CCK-8 outcomes in PMID:40211850. These results can coexist
      with improved proliferation in the distinct C2C12 dexamethasone experiment of PMID:23516508. Retain the inherited
      capacity with state and assay limits; the evidence does not imply constitutive suppression in every muscle-cell
      context.
