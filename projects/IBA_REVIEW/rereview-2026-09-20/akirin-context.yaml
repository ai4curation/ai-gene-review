  - original_row: 5
    term: GO:0010592
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: Mouse Q99LF1 is Akirin1/Mighty, not Akirin2. Its experimentally curated source annotations cite
      PMID:19406121, whose abstract reports increased macrophage and myoblast chemotaxis with PI3K-dependent actin
      reorganization and lamellipodia formation. The target lies below the matching PTN002665250 IBD. Nuclear localization
      does not preclude regulation of cytoskeletal behavior, and viable knockout animals do not refute a cellular
      capacity. Retain the conserved inference without representing it as a direct human experiment or an identified
      actin-binding mechanism. Complete source article access remains unavailable, limiting mechanistic detail rather
      than overturning the positive evidence.
