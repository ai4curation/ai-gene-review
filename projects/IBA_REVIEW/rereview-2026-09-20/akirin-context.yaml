  - original_row: 18
    term: GO:1902725
    evidence_type: IEA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: GO:1902725 negatively regulates GO:0014816, which defines acquisition of satellite-cell features.
      The old review conflated this with a satellite-derived myoblast differentiating into a myotube. The exact
      mouse Q99LF1 MGI IMP source is PMID:18255059. Related primary work in the Dyer 2006 thesis describes reduced
      reserve-cell populations and reduced Sca-1/CD34 in Mighty-overexpressing C2C12 cultures alongside increased
      myotube fusion. This is consistent with the standing curator-supported transfer; the positive myogenesis result
      does not contradict it. The original journal full text remains unavailable and reserve-cell markers are not
      lineage tracing, so the precise mechanism remains a follow-up, not a confident reversal of the annotation.
