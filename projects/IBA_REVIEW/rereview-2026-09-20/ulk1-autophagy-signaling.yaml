    term: GO:0061709
    label: reticulophagy
    evidence: IBA
    reference: GO_REF:0000033
    old_action: KEEP_AS_NON_CORE
    new_action: KEEP_AS_NON_CORE
    reason: The PAINT Atg1/ULK assertion supports participation in selective ER turnover. ULK1 can execute
      initiation machinery recruited in this context without serving as the ER cargo receptor. The conditional
      role is retained as noncore; different ER degradation routes can have different requirements.
