  - index: 0
    term: GO:0005737
    label: cytoplasm
    evidence: IBA
    reference: GO_REF:0000033
    old_action: MARK_AS_OVER_ANNOTATED
    new_action: ACCEPT
    reason: The broad location is supported by target microscopy and the cytoplasmic autophagy-initiation mechanism.
      More specific cytosolic, endosomal and autophagic-membrane pools coexist; their presence does not make
      the parent location an over-annotation.
  - index: 1
    term: GO:0000045
    label: autophagosome assembly
    evidence: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: ULK1 phosphorylates components of the autophagy-initiation system, coordinating PI3KC3-C1 activation
      and membrane assembly. This is direct execution and regulation of canonical autophagosome biogenesis;
      it does not assert that every selective-autophagy route universally requires ULK1.
  - index: 2
    term: GO:0000423
    label: mitophagy
    evidence: IBA
    reference: GO_REF:0000033
    old_action: KEEP_AS_NON_CORE
    new_action: KEEP_AS_NON_CORE
    reason: The inherited mitophagy role is consistent with deployment of ULK machinery in mitochondrial sequestration.
      ULK1 contributes phosphorylation/assembly work, rather than being consumed as cargo. This is retained
      as a conditional selective-autophagy role without asserting that all mitophagy or macroautophagy routes
      require ULK1.
  - index: 3
    term: GO:0010506
    label: regulation of autophagy
    evidence: IBA
    reference: GO_REF:0000033
    old_action: KEEP_AS_NON_CORE
    new_action: ACCEPT
    reason: mTOR/AMPK inputs and ULK1 phosphorylation of autophagy machinery control initiation and flux. A
      broad regulation term does not require equal positive and negative effects and is appropriate to the
      core kinase mechanism.
  - index: 4
    term: GO:0042594
    label: response to starvation
    evidence: IBA
    reference: GO_REF:0000033
    old_action: ACCEPT
    new_action: ACCEPT
    reason: Starvation activates conserved Atg1/ULK autophagy machinery. Human nutrient-withdrawal experiments
      support the inherited response, while paralog usage and regulatory details can differ among organisms.
