  outcome: Full re-review of 139 original ULK1 assertions, preserving source metadata; 102 review rows and
    81 actions changed. Restored broad and conditional annotations using primary membrane/neuronal/kinase evidence,
    current GO and PAINT node records. Four obsolete source membrane terms redirected to GO:7770114. Retained
    structurally demonstrated ULK1C:PI3KC3-C1 association with precise component scope. Corrected TBC1D14-versus-small-GTPase
    reasoning and retained uncertainty. Consolidated kinase core with ATG101 and restrained stoichiometric
    interpretation. Awaiting existing ATG2A nuclear-microautophagy adjudication coverage before any new research.
    No NEW annotations or duplicate reports.
  review_rows_changed: 102
  action_changes: 81
