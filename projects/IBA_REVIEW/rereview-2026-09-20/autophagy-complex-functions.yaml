    reason: PTN000426471 carries the pexophagy IBD grounded in yeast VPS15 evidence. As a PI3KC3
      scaffold and activator, PIK3R4 can perform essential membrane-building work during selective
      autophagy without recognizing peroxisomal cargo itself. A shared core-machinery role is not
      grounds to replace pexophagy with general assembly. Target-specific evidence and the pending
      PIK3C3/PI3KC3 pexophagy adjudication are needed before a final call.
