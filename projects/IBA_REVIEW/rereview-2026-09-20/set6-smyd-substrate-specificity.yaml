    rationale: >
      SET6 is Set5's same-organism SMYD paralog and lies under the same
      PTN008534456 ancestor, but SET6 itself has no known histone substrate or
      direct methyltransferase assay. The histone substrate class is therefore
      too specific for the target; GO:0016279 is the defensible inherited term.
    propagation_review:
