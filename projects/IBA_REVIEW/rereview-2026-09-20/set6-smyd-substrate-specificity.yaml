    term_label: protein-lysine N-methyltransferase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    action: ACCEPT
    outcome: confirmed
    rationale: >
      The PTHR12197 SMYD-family ancestor supports broad SET-domain
      protein-lysine methyltransferase activity, and SET6 retains the catalytic
      NHSC pocket and C-terminal tyrosine that are lost in inactive yeast Set3/Set4.
