  outcome:
    actions:
      ACCEPT: 3
      KEEP_AS_NON_CORE: 2
      MARK_AS_OVER_ANNOTATED: 1
      REMOVE: 1
    core_functions: >
      Retained SET6 as a putative, likely catalytically competent
      protein-lysine methyltransferase of the SMYD subfamily while leaving its
      substrate, activity, localization, and biological role as open knowledge gaps.
    new_annotations: 0
    iba_alignment: >
      Reviewed all three live SET6 IBA rows against the current PTHR12197 PAINT
      cache. GO:0016279 protein-lysine N-methyltransferase activity and
      GO:0005634 nucleus both descend from PTN008534456 and are acceptable as,
      respectively, a putative core MF and a non-core plausible location. The
      histone-specific GO:0042054 IBA also descends from PTN008534456 but is
      over-specific for SET6 because no SET6 substrate is known.
  changes:
