  - original_row: 2
    term: GO:0031410
    evidence_type: IBA
    old_action: ACCEPT
    action: ACCEPT
    assessment: The actual target lineage passes through the positive PTN002919572 IBD. Donor vesicle-localization
      evidence supports that ancestral judgment. Direct AGFG2 secretion experiments provide compatible functional
      context but did not themselves image target localization, so the location remains an inherited assertion.
  - original_row: 3
    term: GO:0001675
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: O95081 descends from the experimentally grounded PTN002919572 assertion. Mouse Hrb promotes proacrosomal-vesicle
      docking/fusion, an active assembly contribution. Neither the number of descendants supplying experiments,
      the existence of a closer unassayed ortholog, nor salivary enrichment refutes the ancestral capacity. No target-specific
      loss was established; this is phylogenetic evidence rather than a direct human AGFG2 germ-cell assay.
  - original_row: 4
    term: GO:0007289
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: The positive IBD at PTN002919572 is ancestral to AGFG2. Mouse Hrb-deficient spermatids show altered
      nuclear shaping; PMID:16765935 explicitly includes hrb-null cells despite its H1T2 title. Its preserved early
      H1T2 polarity marker does not refute every role in nuclear differentiation. Abstract-only access limits mechanistic
      detail and does not invalidate the curator-supported ancestral assertion.
  - original_row: 5
    term: GO:0045109
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: Actual descent from PTN002919572 supports the capacity. The mouse source experiment connects Hrb
      loss to deficient keratin-5 organization in the acroplaxome. A vesicle-trafficking protein can contribute
      to filament organization without being a filament polymerization enzyme. Neither the donor count nor incomplete
      target experimentation establishes loss; the detailed molecular route remains unresolved.
  - original_row: 6
    term: GO:0005096
    evidence_type: IEA
    old_action: MARK_AS_OVER_ANNOTATED
    action: UNDECIDED
    assessment: 'The target retains Arg75 but carries Thr89 at the aligned ASAP3 Asp484 site. PMID:23433073 predicts
      reduced AGFG activity from conserved-site divergence; these sequence observations warrant scrutiny of InterPro:IPR001164
      transfer. They do not prove inactivity: the same paper reports loss of the Asp-homologous site across GIT
      proteins, while PMID:10788515 directly measures GIT1/GIT2 GAP activity. R75Q secretion rescue/overexpression
      in PMID:34369554 is not a GTP-hydrolysis assay and is reported as data not shown. A focused neutral adjudication
      will distinguish target biochemical evidence, altered catalytic mechanisms and absent assays.'
  - original_row: 7
    term: GO:0016020
    evidence_type: HDA
    old_action: KEEP_AS_NON_CORE
    action: ACCEPT
    assessment: The NK-cell membrane-proteome HDA is consistent with a vesicle-trafficking protein. The abstract
      explicitly includes transiently associated proteins; no transmembrane segment or covalent lipid anchor is
      required for peripheral membrane binding. High throughput limits spatial/mechanistic detail but does not make
      the broad location non-core or erroneous. The source supports membrane association without a specific plasma-membrane
      claim.
  - original_row: 8
    term: GO:0045055
    evidence_type: IMP
    old_action: NEW
    action: NEW
    assessment: Direct human endothelial perturbation and siRNA-resistant expression place AGFG2 in the release
      machinery for VWF-containing granules. AGFG2 is a trafficking cofactor, not the cargo consumed/released by
      the process; overexpression promotes release, supporting active regulatory participation beyond generic necessity.
      The precise effector interaction and fusion step remain unisolated. Cargo delivery and morphology are largely
      preserved but modest VWF-processing changes preclude an unqualified claim of normal maturation. Role comparators
      RAB11FIP1/2/5 carry regulated-exocytosis annotations; no existing developmental-process ancestor/descendant
      or GO-CAM target assertion duplicates this proposal.
  - original_row: 9
    term: GO:0044794
    evidence_type: IMP
    old_action: NEW
    action: NEW
    assessment: Human HRBL supports Nef- and Vpu-mediated CD4 removal, with independent Hrbl/Eps15 synergy in a
      Rev-dependent reporter. CD4 is the removed substrate, whereas AGFG2 assists the host trafficking machinery
      exploited by viral proteins. GO:0044794 covers promotion of a viral process and does not require a measurable
      replication advantage; PMID:25496667 found no significant replication reduction after HRBL depletion. Trafficking/cytoskeletal
      host factors CAV2 and CFL1 provide role-matched GO comparators. Retain this single broad proposal, without
      asserting direct RNA transport, an identified molecular adaptor mechanism, or redundant viral subprocess terms.
      The Affinage narrative supports dual Nef/Vpu activity, but its contradictory table and localization/paralog
      conflations are not used as evidence.
