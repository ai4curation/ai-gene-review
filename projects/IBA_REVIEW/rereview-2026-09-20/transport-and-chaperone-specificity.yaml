  outcome: Replaced confident MTOC/plus-end challenges with explicit uncertainty; retained native spindle-assembly
    rejection grounded in postmeiotic expression and stage-resolved null analysis.
  changes:
  - row_index: 0
    term: GO:0005815
    evidence_type: IBA
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: UNDECIDED
    reason: PTHR10623 places the MTOC IBD at eukaryotic ancestor PTN000065701. GO:0005815 includes structures that
      nucleate and anchor microtubules and is not restricted to mitotic centrosomes. Mst27D functions postmeiotically
      near the dense complex and basal-body region; this timing therefore cannot alone reject MTOC localization.
      The direct study establishes microtubule and nuclear-envelope association, while distinguishing dense-complex
      scaffolding from actual MTOC membership requires focused adjudication.
  - row_index: 3
    term: GO:0031110
    evidence_type: IBA
    from_action: UNDECIDED
    to_action: UNDECIDED
    reason: The current PTN000065701 IBD retains this process. PMID:37428798 demonstrates bundling and discusses
      stabilization or growth as possible consequences, but the analyzed experiments do not isolate polymerization/depolymerization
      kinetics. Bundling could contribute structurally to regulation, so an absence of catalytic or direct kinetic
      evidence is not a demonstration of loss. A focused assessment of dynamic effects is pending.
  - row_index: 4
    term: GO:0035371
    evidence_type: IBA
    from_action: MODIFY
    to_action: UNDECIDED
    reason: PTN000065701 carries the ancestral plus-end localization and binding assertions. GO:0051010 requires
      binding to the plus end, and GO:0035371 identifies the growing plus end; neither definition requires preferential
      comet-like tracking. PMID:37428798 establishes lattice-wide binding and loss of Eb1-like preference, which
      does not automatically exclude any end binding. The comet-forming construct is the isolated C-terminal fragment
      lacking the N-terminal CH domain, not a C-terminal truncation retaining that domain; the authors propose heterodimerization
      with endogenous EB-family proteins. Neither the fragment result nor the lack of preference settles full-length
      inherited capacity.
  - row_index: 6
    term: GO:0051010
    evidence_type: IBA
    from_action: MODIFY
    to_action: UNDECIDED
    reason: PTN000065701 carries the ancestral plus-end localization and binding assertions. GO:0051010 requires
      binding to the plus end, and GO:0035371 identifies the growing plus end; neither definition requires preferential
      comet-like tracking. PMID:37428798 establishes lattice-wide binding and loss of Eb1-like preference, which
      does not automatically exclude any end binding. The comet-forming construct is the isolated C-terminal fragment
      lacking the N-terminal CH domain, not a C-terminal truncation retaining that domain; the authors propose heterodimerization
      with endogenous EB-family proteins. Neither the fragment result nor the lack of preference settles full-length
      inherited capacity.
  - row_index: 7
    term: GO:0051225
    evidence_type: IBA
    from_action: REMOVE
    to_action: REMOVE
    reason: 'The spindle-assembly IBD at PTN000065701 describes ancestral EB-family biology. PMID:37428798 provides
      target-specific developmental divergence: endogenous Mst27D accumulation begins after meiosis, and null-mutant
      analysis detects no earlier abnormalities but severe spermatid nuclear-elongation defects. This combination
      of native timing and stage-resolved perturbation challenges retention of the ancestral spindle-assembly role,
      rather than simply relying on absent target experiments or distant experimental descendants.'
  - row_index: 8
    term: GO:0051233
    evidence_type: IBA
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: MARK_AS_OVER_ANNOTATED
    reason: PTN000065701 carries the spindle-midzone IBD. Endogenous Mst27D begins accumulating after meiosis and
      localizes to the spermatid nuclear envelope/dense complex (PMID:37428798). This target-specific timing and
      distribution challenge a native spindle-midzone assignment; a microtubule-organizing center is a different
      and broader structure and is being assessed separately. Retain a cautious over-annotation call rather than
      claiming that all possible ectopic or low-level spindle association has been excluded.
