  evidence:
  - source: PMID:33845046
    reviewed: Full primary transport results and substrate/ATPase interpretation. Purified ABCD4 transports cobalamin
      in proteoliposomes; this validates broad transport assertions but does not assay every possible fatty-acid
      substrate.
    excerpt: ABCD4 transports cobalamin from the inside to the outside of liposomes in a manner that is dependent
      on ATPase activity
  - source: PMID:27456980; PMID:19010322
    reviewed: Full 2016 primary localization/escort results plus 2009 primary abstract; targeting architecture and
      direct negative peroxisome localization support rejecting native peroxisomal membrane/import.
    excerpt: ABCD4 does not localize to peroxisomes
  - source: PMID:14533738
    reviewed: Primary abstract explicitly includes GFP-labelled human ABCD4/PMP69 fragments. The old rejection cannot
      be based on a title naming ABCD1; fragment localization need not predict full-length location.
    excerpt: Green fluorescent protein-labeled fragments of human peroxisomal membrane protein 69
  - source: PMID:9302272; PMID:27456980
    reviewed: The older peroxisomal assignment is a real conflicting report. The 2016 paper explicitly revisits
      antibody detection in rat hepatic peroxisomes and contrasts human full-length ER/lysosome targeting. Retained
      removal for native human location while acknowledging historical assay/species limits.
  - source: Reactome:R-HSA-5223313; Reactome:R-HSA-5683325; Reactome:R-HSA-9758881; Reactome:R-HSA-9758890; Reactome:R-HSA-9759206
