  changes:
  - row_index: 0
    term: GO:0005778
    evidence_type: IBA
    from_action: REMOVE
    to_action: REMOVE
    reason: PTHR11384 places the peroxisomal-membrane IBD at PTN004256010. Target-specific localization and targeting
      experiments, rather than donor number or absent fatty-acid assays, challenge inheritance of that compartment
      in ABCD4. PMID:19010322 reports full-length P70R-HA in the ER rather than peroxisomes and identifies its divergent
      N-terminal targeting architecture; PMID:27456980 establishes endogenous ER/lysosome localization and LMBD1-dependent
      lysosomal delivery. These findings support rejecting native peroxisomal-membrane localization while preserving
      the two experimental NOT annotations.
  - row_index: 1
    term: GO:0042626
    evidence_type: IBA
    from_action: MODIFY
    to_action: ACCEPT
    reason: Purified ABCD4 reconstituted in liposomes catalyzes ATP-dependent cobalamin translocation (PMID:33845046);
      localization experiments establish ER and lysosomal membranes (PMID:27456980). The broad transporter, transport
      and membrane terms are true core properties alongside the more specific vitamin-B12 transporter annotation.
      Greater specificity does not make these existing parent-level assertions over-annotations.
  - row_index: 2
    term: GO:0005324
    evidence_type: IBA
    from_action: REMOVE
    to_action: UNDECIDED
    reason: The relevant IBD is at PTN004256010 in PTHR11384. Direct B12 transport establishes one substrate, but
      is not a negative assay for every fatty-acid transport activity. Likewise, an ER/lysosomal protein can in
      principle affect peroxisome organization or lipid metabolism without being a peroxisomal resident. The previous
      removal conflated these distinct claims. Retain uncertainty pending focused evaluation of ancestral process
      evidence, target-specific substrate tests and pathway participation.
