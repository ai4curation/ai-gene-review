    substantive_assessment: 'All 11 annotation rows were reassessed against the source studies and PAINT
      nodes. The source NOT flag is preserved. Broad glycosyltransferase, hexosyltransferase and glycosphingolipid/carbohydrate
      capacity is retained as non-core: PMID:23378701 reports "very weak activity even in the CHO cell
      transfection experiment", using a reconstructed human coding sequence, while PMID:18630988 tested
      chimeras and human-like substitutions. Neither proves robust endogenous human flux. The same 2008
      work documents rat Y252N loss and failure of reverse human substitutions, so these are substantive
      contradictory experiments, not absence-of-assay objections. LacNAc versus lactosylceramide acceptor
      scope remains unresolved. Live QuickGO GO:0047276 specifically requires Gal-beta1,4-GlcNAc; observing
      iGb3 production from lactosylceramide does not itself exclude alternative substrates. Golgi/vesicle
      inference is not refuted by the catalytic disagreements.


      PAINT PTHR10462: PTN000049004 supplies Golgi, vesicle and glycosyltransferase assertions; PTN000049131
      supplies glycosphingolipid biosynthesis. No localization loss was found. Focused neutral report
      has now been incorporated critically; see adjudication record below. No duplicate report launched.
      All global cached OpenScientist query/body matches were checked and none were found for this gene.'
