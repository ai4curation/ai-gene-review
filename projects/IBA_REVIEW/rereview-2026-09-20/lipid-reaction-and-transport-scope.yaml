    notes_file: genes/human/ATP13A1/ATP13A1-notes.md
    substantive_assessment: 'All 29 annotation rows were reassessed; source isoform metadata remains intact.
      Broad membrane, nucleotide binding, transport and P-type-transporter annotations were restored.
      Live GO:0140358 defines the phosphorylated-aspartate transport cycle and does not require an ion
      substrate. Ion-specific correction remains supported by the actual Spf1 substrate-pocket geometry
      and ATP13A1 extraction experiment (PMID:32973005), not merely by discovery of a different primary
      function. PMID:24392018 expressly states "can not prove that Spf1 is the direct transporter of Mn2+".
      Calcium homeostasis is separately retained as a non-core inherited process; no target-specific loss
      was shown. Generic protein binding was removed as uninformative without disputing interactions.


      The existing hypothesis report kgap-atp13a1-dislocase-vs-topogenesis was read substantively and
      incorporated. Its central point that the old hypothesis "draws a false dichotomy regarding biological
      function" is supported by primary evidence: PMID:36283413 establishes productive topogenesis and
      protection from ERAD, PMID:38723633 describes human ABCG2 folding, and PMID:40498833 supports atypical
      signal-sequence correction coupled to SEC61. Description, activity reviews and core synthesis now
      include both quality control and productive topogenesis. Caveat: the 2025 cryo-EM structures are
      of human ATP13A1, not a resolved ATP13A1-SEC61 handoff complex; the paper states "It remains to
      be characterized how ATP13A1 engages SEC61". PMID:42208892 measures purified yeast Spf1 substrate-stimulated
      ATPase activity, not complete reconstituted dislocation: "ATP hydrolysis in this in vitro system
      remains an indirect readout of substrate engagement." The report''s stronger reconstitution framing
      is not adopted. MAVS studies PMID:37043539 and PMID:35543156 provide client context but do not require
      manufacturing new process annotations.


      Original ion-IBA sources are PTN001944130 (GO:0019829) and PTN000643319 (GO:0015662), recovered
      from GOA WITH/FROM. Current PTHR45630 PAINT retains protein dislocation, calcium homeostasis and
      membrane/transport but lacks those ion assertions. This version difference is documented without
      inventing the reason for change. Calcium mechanistic follow-up is human expert work; the existing
      report already flags it, so no duplicate report requested.'
