  evidence:
    notes_file: genes/rat/Pnlip/Pnlip-notes.md
    substantive_assessment: 'All 33 annotation rows were reassessed. Broad lipase, carboxylic ester hydrolase
      and lipid metabolism terms were restored, and extracellular localization is recognized as a core
      property of a secreted digestive enzyme. Description was rewritten as standalone biology, removing
      workflow commentary. Retinyl ester core support now quotes the actual rat/mouse enzyme separation
      study PMID:10769148 rather than a generic UniProt triglyceride sentence.


      The six IBA assertions trace to PTN000906454 in PTHR11610. PMID:8656075 explicitly describes phospholipids
      as "a substrate poorly hydrolyzed by PL"; that positive comparator evidence contradicts the old
      rationale that only PLRP2 can hydrolyze them. Exact sn-1 chemistry remains unresolved because the
      accessible source is abstract-only. Lipoprotein-lipase GO:0004465 really does require lipoprotein-bound
      TG (live QuickGO), but primary intestinal secretion alone does not prove that Pnlip cannot use that
      substrate. HDL remodeling requires its own pathway evidence. The live fatty-acid biosynthesis definition
      concerns formation of fatty acid, so excluding hydrolytic release requires checking the GO process
      convention, not assuming de novo synthase scope. These three IBA disputes and exact PLA1 capacity
      are pending focused adjudication. Cholesterol homeostasis remains non-core; it is not equated with
      cholesterol ester hydrolysis.


      The positive lipase-regulation ISO was traced from rat GOA to human PNLIP UniProtKB:P16233, then
      live QuickGO to CACAO IDA PMID:9631512. The abstract reports colipase dependence and interfacial
      activation; without its full context, REMOVE would overrule an experimental donor on incomplete
      evidence. It is now UNDECIDED. Root received the source as an explicitly post-launch lead. Human
      source follow-up is recorded without expanding this bounded batch to its folder. Experimental post-embryonic-development
      interpretations also remain unresolved because full text was inaccessible. In contrast PMID:15181189
      and PMID:17010228 report actual activity/secretion changes with dietary lipid and leptin, supporting
      non-core response annotations. No pre-existing OpenScientist query/body match was found; report
      request is coordinated by root.'
