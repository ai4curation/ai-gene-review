  scope: full_gene
  status: awaiting_adjudication
  all_annotations_reviewed: true
  original_annotation_count: 9
  final_annotation_count: 9
  original_source_assertions_preserved: 9
  action_changes: 3
  changes:
  - index: 1
    term_id: GO:0008137
    evidence: IBA
    old_action: MODIFY
    new_action: MODIFY
    reason: Modern chloroplast NDH biochemistry identifies reduced ferredoxin as the immediate electron donor
      and plastoquinone as acceptor; the complex lacks the NADH-oxidizing module. GO:0016655 still explicitly
      requires NAD(P)H, so the previous broader replacement does not correct the donor mismatch. GO:0016730
      accommodates an iron-sulfur protein donor. Apply the replacement with contributes_to for this subunit
      of the enzyme; original source qualifiers are preserved here.
  - index: 2
    term_id: GO:0022904
    evidence: IBA
    old_action: MODIFY
    new_action: UNDECIDED
    reason: The GO definition does not restrict this process to mitochondria. Tobacco ndhJK/ndhCJK mutants
      and PTOX inhibition support NDH participation in chlororespiratory electron flow, while independent work
      demonstrates energy-conserving proton pumping. Whether the full GO process is sufficiently supported
      for this inherited Populus assertion, including oxygen-coupled energy conservation where required, is
      under shared adjudication. Current target descent from the positive ancestral node is verified; photosynthetic
      specialization alone is not evidence of loss.
  - index: 3
    term_id: GO:0045271
    evidence: IBA
    old_action: MODIFY
    new_action: MODIFY
    reason: The chloroplast complex has a ferredoxin-input architecture and a plastoquinone-reduction site,
      distinct from the NADH-entry complex specified by GO:0045271. GO:0010598 explicitly allows ferredoxin
      as the possible donor despite its historical NAD(P)H label. This structural and reaction-level distinction
      does not rule out chlororespiration.
  - index: 4
    term_id: GO:0008137
    evidence: IEA
