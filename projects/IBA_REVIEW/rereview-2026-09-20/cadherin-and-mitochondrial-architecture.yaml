  evidence:
  - reference_id: PMID:18454199
    finding: Full genetics, rescue, ultrastructure, growth, oxidative-stress and cell-death results read.
      Genetic rescue does not directly measure restored hydrolysis. Normalized cristae decrease corrected
      to 66.2% relative to inner-boundary membrane length.
    excerpt: It seems likely that they restore the ability of the G2 threonine to interact properly with
      GTP or make the conformational changes that occur during GTP hydrolysis.
  - reference_id: PMID:18722182
    finding: Mitochondrial fusion phenotypes and negative cell-death assays directly include eat-3. Sensitized
      ced-3 experiments reinforce the negative apoptosis conclusion; not merely a paper-title/abstract
      inference.
    excerpt: Analysis of fzo-1(tm1133); ced-3(n2438) animals and eat-3(ad426); ced-3(n2438) animals did
      not reveal a significant decrease or increase in the number of extra cells compared with ced-3(n2438)
      animals
  - reference_id: PMID:21248201
    finding: Paper named for MOMA-1 also directly assays EAT-3 as an IMS/inner-membrane control; 88% in
      mitochondrial pellet and protease protection. This does not establish impossibility of additional
      precursor/isoform contexts.
  - reference_id: PMID:19703904
    finding: Full yeast Mgm1 liposome-binding, mutagenesis, GTPase and complementation evidence provides
      family support for broad lipid binding.
  - reference_id: PMID:28628083
    finding: Human OPA1-cardiolipin fusion reconstitution supports related family mechanism; abstract
      only, explicitly not a worm assay.
  - reference_id: PMID:23226476
    finding: Fetched/verified title and abstract concern hCG-driven mouse reproductive dysfunction/tumorigenesis.
      Withdrawn from review.additional_reference_ids as an unrelated supporting citation; was not a GOA
      original_reference_id.
  - reference_id: file:worm/eat-3/eat-3-deep-research-falcon.md
    finding: Read substantive report and checked primary sources. Do not reproduce its overstatement of
      measured rescued GTPase activity or incorrect length units.
  - reference_id: file:worm/eat-3/eat-3-hypotheses/microtubule-and-peroxisome-capacities/openscientist.md
    finding: Read full report; ancestral placement recovered, topology/domain concerns retained, categorical
      loss not established.
    excerpt: this reasoning does not *prove* that EAT-3 can never, under any engineered or stress condition,
      contact a microtubule or a peroxisome.
