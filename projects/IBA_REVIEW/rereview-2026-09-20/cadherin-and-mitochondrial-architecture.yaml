    report: genes/worm/eat-3/eat-3-hypotheses/microtubule-and-peroxisome-capacities/openscientist.md
    assessment: DISPUTED
    reason: Full report read. Correctly emphasizes mitochondrial fusion/topology and recovers the relevant
      ancestral nodes. However, both challenged nodes are ancestors of the OPA1 node, not transfers from
      an exclusively separate DRP1 clade. Missing conventional dynamin modules and absence of target experiments
      do not establish loss of all binding or process capacities. No target negative assay or executable
      tree/domain artifact was supplied.
