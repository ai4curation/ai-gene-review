  evidence:
  - reference_id: PMID:22413011
    finding: Human MCF-7 inhibitory-antibody and RNAi experiments directly support adhesive participation.
      Homotypic contact phenotype is distinct from molecular homophily; the latter also has purified ortholog
      ectodomain support.
    excerpt: RNAi treatment significantly reduced the ability of MCF-7 cells to participate in homotypic
      adhesion.
  - reference_id: PMID:30747484
    finding: Human HEK293T transwell and hanging-drop assays link CDH23 to aggregation and migration;
      beta-catenin colocalization does not prove binding.
    excerpt: Overall, the transwell assay and hanging‐drop assay jointly indicated that silencing of Cdh23
      expression resulted in decreased cell aggregation and enhanced cell migration.
  - reference_id: PMID:31729176
    finding: Mouse NP_075859.2 EC1-2 homodimer biochemistry, conserved interface and human A549-cell binding
      oppose heterophilic-only exclusion. Ortholog construct scope retained.
  - reference_id: PMID:12485990
    finding: Isolated PDZ2 binding supports two generic-binding modifications. Classical beta-catenin
      motifs absent; lack of catenin staining is specifically unpublished growing-hair-bundle evidence.
  - reference_id: PMID:17234811
    finding: Full results separate CDH23 family genetics from PMCA2 calcium-clearance assays. A structural
      channel contribution would not require a pump MF.
    excerpt: Whether the tripolar complex has any role in the function of PMCA2 is an open question.
  - reference_id: PMID:16679490
    finding: CDH23 patient genotypes in Usher cohort support auditory, vestibular and retinal roles; retinal
      cellular mechanism remains secondary.
  - reference_id: PMID:22879593
    finding: Abstract explicitly demonstrates exon 68 homodimerization and three harmonin interfaces. Full-text
      fetch and PMC web attempt failed; no exclusion is based on missing full text.
  - reference_id: PMID:30747484
    finding: Focused report falsely says no catenin mentions; primary explicitly describes colocalization,
      proposes a MAGI-1 bridge and separates canonical signaling. Binding/complex remain unresolved.
    excerpt: Using HEK293T cells expressing GFP‐labeled Cdh23, we demonstrated the formation of a homogeneous
      and continuous cell–cell junction by Cdh23 and its co‐localization with β‐catenin.
