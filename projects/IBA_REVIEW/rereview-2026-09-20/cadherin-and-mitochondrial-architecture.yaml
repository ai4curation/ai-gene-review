    report: genes/human/CDH23/CDH23-hypotheses/catenin-neuronal-and-calcium-process-scope/openscientist.md
    assessment: DISPUTED
    reason: Full report read. Correctly distinguishes colocalization from binding and identifies the PMCA2
      assay context. However, its repeated claim that PMID:30747484 contains no catenin mentions is contradicted
      by the full-text Results and Discussion. Absence of human neuronal experiments does not refute the
      inherited process, and a structural contributor need not itself pump calcium.
  primary_reference_ids_reviewed:
