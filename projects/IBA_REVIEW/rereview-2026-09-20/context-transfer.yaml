  outcome: Replaced the SLIT-source-based axon-guidance exclusion with uncertainty informed by direct noncanonical
    Notch guidance biology; restored supported FIH inhibitor activity and core parent annotations; awaits neutral
    human guidance adjudication. The focused report is complete and incorporated with correction of falsely named
    Notch source genes; biological conservation remains UNDECIDED.
  changes:
  - original_index: 2
    current_index: 2
    term: GO:0007411
    label: axon guidance
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: UNDECIDED
    reason: The PTN002911625 source is SLIT-grounded, but this does not disprove an independent NOTCH1 guidance
      mechanism. Primary Drosophila studies establish Notch/Disabled/Trio/Rac-dependent axon patterning, with cleavage
      and tyrosine requirements separable from cell-fate signaling (PMID:18062953, PMID:21246649, PMID:29343637).
      Mammalian studies establish neurite morphology and synaptic-protein effects (PMID:10465425, PMID:27040987),
      which neither directly demonstrate nor refute directional guidance. The focused OpenScientist report is incorporated,
      but its supposed fly/mouse Notch WITH/FROM donors are actually SLIT genes on verified identifiers, and its
      STRING absence is not a loss experiment. Human conservation and the correct ancestral basis remain unresolved;
      retain UNDECIDED rather than treating an unproven report recommendation as settled.
  - original_index: 80
    current_index: 80
    term: GO:0004857
    label: enzyme inhibitor activity
    evidence_type: IEA
    reference: GO_REF:0000107
    old_action: UNDECIDED
    new_action: KEEP_AS_NON_CORE
    reason: PMID:17573339 experimentally shows Notch ankyrin-repeat substrates competing with HIF for FIH/HIF1AN
      and proposes their natural inhibitor function; PMID:18299578 further supports Notch-FIH sequestration and
      hypoxia-pathway cross-talk. The transferred enzyme-inhibitor function therefore has a mechanistic basis, but
      its physiological importance is context dependent and separate from canonical Notch signaling.
  - original_index: 90
    current_index: 90
    term: GO:0010467
    label: gene expression
    evidence_type: IEA
    reference: GO_REF:0000107
    old_action: KEEP_AS_NON_CORE
