- gene_file: genes/human/ABRAXAS1/ABRAXAS1-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 50
  review_method: All annotation terms/actions and existing evidence rationales were screened, including description/core
    consistency; disputed claims received focused primary, ontology, PAINT and available OpenScientist checks. This
    does not claim that all cited papers were accessible in full.
  outcome: Withdrew three spindle/microtubule exclusions based on nuclear enrichment, missing target assays or single-paralog
    support; incorporated the existing OpenScientist report with source-mechanism evidence and explicit uncertainty.
  changes:
  - original_index: 1
    current_index: 1
    term: GO:0008017
    label: microtubule binding
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
    new_action: UNDECIDED
    reason: PAINT places this assertion at PTN001272083 with ABRAXAS2/Q15018 experimental support. PMID:26195665
      directly establishes BRISC/ABRO1 microtubule association and NuMA-dependent spindle regulation. ABRAXAS1 assembles
      the distinct BRCA1-A complex, which makes functional divergence plausible, but its major nuclear DNA-repair
      role is not proof of exclusive localization or absence of mitotic activity. The existing OpenScientist report
      conflates lack of target assays with refutation and relies on donor identity without demonstrating target-specific
      loss. Retain uncertainty until mitotic localization, binding, or functional comparison resolves inheritance.
  - original_index: 2
    current_index: 2
    term: GO:0008608
    label: attachment of spindle microtubules to kinetochore
    evidence_type: IBA
    reference: GO_REF:0000033
    old_action: REMOVE
