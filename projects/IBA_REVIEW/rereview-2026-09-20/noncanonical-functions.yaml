- gene: DAPPU/DpuGr29
  gene_file: genes/DAPPU/DpuGr29/DpuGr29-ai-review.yaml
  status: reviewed
  scope: full_gene
  outcome: Focused report critically incorporated after the completed full-gene review; actual ancestry
    supports non-core courtship retention, while taste mechanism remains unresolved and the authored channel
    NEW remains withdrawn.
  annotation_count: 9
  final_annotation_count: 8
  annotations:
  - original_index: 0
    term_id: GO:0008049
    term_label: male courtship behavior
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    negated: false
    previous_action: REMOVE
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: The actual PTHR21143 tree places exact E9FXF3/DAPPUDRAFT_346859 below the positive arthropod
      PTN001080220 courtship IBD, with no on-lineage negative assertion. PMID:19383158 establishes a Daphnia-specific
      expansion rather than one-to-one dipteran orthology, but does not demonstrate loss of the deeper
      ancestral capacity. The focused report did not inspect the tree and rejects the term primarily from
      absent target experiments and insect-only donors; those arguments do not overturn IBA. Retain the
      positive inferred role as behavioral context while leaving the target ligand, tissue, circuit and
      direction of courtship modulation unestablished. Neither cyclical parthenogenesis nor the BP/MF
      distinction excludes this role.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001080220
        source_status: SUPPORTS_TRANSFER
        comment: Actual target leaf PTN002326688 descends from the positive arthropod node. The known
          Daphnia receptor expansion does not itself establish ancestral functional loss; accepted as
          inferred behavioral capacity without specifying a ligand or circuit.
  - original_index: 1
    term_id: GO:0007635
    term_label: chemosensory behavior
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    negated: false
    previous_action: ACCEPT
    action: ACCEPT
    outcome: changed
    rationale: Chemosensory behavior (GO:0007635) is defined as "behavior that is dependent upon the sensation
      of chemicals." GRs are established chemoreceptors across arthropods. Daphnia pulex has an expanded
      GR repertoire (58 genes) and relies heavily on chemosensory detection for predator avoidance (kairomone
      detection), food finding, and environmental sensing. The phylogenetic inference from Drosophila
      GRs to Daphnia GRs for this general chemosensory function is well-supported, as the fundamental
      role of GRs as chemoreceptors mediating behavioral responses is conserved across arthropods.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001080220
        source_status: SUPPORTS_TRANSFER
        comment: Exact target lineage is below this positive IBD. Retained as a conserved inference; direct
          Daphnia expression or behavioral assays are not claimed.
  - original_index: 2
    term_id: GO:0030424
    term_label: axon
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    negated: false
    previous_action: UNDECIDED
    action: ACCEPT
    outcome: changed
    rationale: PAINT places this localization at PTN000475107 on the chemoreceptor family tree. A divergent
      ligand repertoire does not itself demonstrate loss of neuronal membrane distribution. The previous
      rationale required target-specific expression and discounted soma localization for low informativeness;
      neither challenges the ancestral location inference. The exact tissue distribution remains unmeasured,
      so this is explicitly accepted as IBA rather than as direct Daphnia microscopy.
    propagation_review:
      root_cause: NO_FAILURE_CORE
