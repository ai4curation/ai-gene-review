  - original_index: 5
    term_id: GO:0005886
    term_label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    negated: false
    previous_action: ACCEPT
    action: ACCEPT
    outcome: changed
    rationale: The target is a multipass membrane chemoreceptor with eight Phobius-predicted segments
      in its current sequence record and a 7TM-chemoreceptor domain assignment. Exact helix counting can
      differ among prediction models; it does not weaken the family-supported cell-surface localization.
      This is a conserved inference, not direct target imaging.
  - original_index: 6
    term_id: GO:0016020
    term_label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    negated: false
    previous_action: ACCEPT
    action: ACCEPT
    outcome: confirmed
    rationale: The annotation is accurate - DpuGr29 contains the 7TM chemoreceptor domain (IPR013604)
      which is a multi-pass transmembrane domain. While GO:0016020 (membrane) is a more general term than
      GO:0005886 (plasma membrane), both annotations are appropriate. The IEA annotation based on InterPro
      domain mapping is well-supported by structural predictions showing 7-8 transmembrane helices.
  - original_index: 7
    term_id: GO:0050909
    term_label: sensory perception of taste
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    negated: false
    previous_action: MODIFY
    action: UNDECIDED
    outcome: changed
    rationale: GO:0050909 concerns direct chemical detection, usually by contact with chemoreceptor cells;
      it does not imply terrestrial life. The primary Daphnia paper explicitly discusses both contact
      taste and detection of dissolved chemicals. DpuGr29 belongs to a lineage-expanded clade without
      an established ligand or expression site, so the InterPro family mapping cannot presently resolve
      taste versus another chemical sense. Generalizing solely because Daphnia is aquatic was unjustified.
      The focused report recommends a generic taste inference but supplies no new evidence resolving contact
      versus another chemosensory modality, and the inspected PAINT ancestry does not carry a taste assertion.
      This remains an unresolved family-to-modality mapping, not a demonstrated loss.
  - original_index: 8
    term_id: GO:0099094
    term_label: ligand-gated monoatomic cation channel activity
    evidence_type: ISS
    original_reference_id: file:DAPPU/DpuGr29/DpuGr29-deep-research-falcon.md
    negated: false
    previous_action: NEW
    action: null
    outcome: withdrawn
    rationale: Authored cation-channel proposal withdrawn because exact target ion-channel mechanism/selectivity
      is unresolved; retained as a question, not an annotation assertion.
