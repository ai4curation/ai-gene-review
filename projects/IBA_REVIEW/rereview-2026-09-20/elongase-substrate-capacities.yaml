    term: GO:0042761
    evidence_type: IBA
    old_action: ACCEPT
    action: ACCEPT
    assessment: Human ELOVL2 catalyzes C22-to-C24 PUFA elongation as well as C20-to-C22 (PMID:12371743). C24
      products meet GO:0042761, whose definition requires more than 22 carbons in the aliphatic tail; C22 alone
      would not. The previous C22-C24 shorthand obscured this boundary.
  - original_row: 4
    term: GO:0030148
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    assessment: 'The target inherits the positive PTN000125390 assertion. PUFA preference is compatible with
      sphingolipid synthesis: mammalian testis contains VLC-PUFA-bearing ceramides, and PMID:38485951 connects
      ELOVL2-dependent elongation to this route while distinguishing the subsequent CerS3 acyl-transfer step.
      This is conserved pathway participation, not a claim that ELOVL2 catalyzes ceramide synthesis or that
      the AdipoR2 knockout is an ELOVL2-only assay. Full PMID:20937905 also reports CERS2 association with
      all seven ELOVLs; its ELOVL1-focused functional result does not exclude ELOVL2.'
  - original_row: 5
    term: GO:0034626
    evidence_type: IBA
    old_action: ACCEPT
    action: ACCEPT
    assessment: Human ELOVL2 expression directly supports C20/C22 polyunsaturated elongation (PMID:12371743);
      full PMID:20937905 assays corroborate strong C20:4-CoA elongation. Polyunsaturated means at least two
      carbon-carbon double bonds; preference does not by itself establish absence of other substrate classes.
  - original_row: 6
    term: GO:0019367
    evidence_type: IBA
    old_action: MARK_AS_OVER_ANNOTATED
    action: UNDECIDED
    assessment: The actual human target descends from the positive ancestral IBD. Full PMID:20937905 Figure
      1B shows no significant ELOVL2 signal over vector for tested saturated C16-C26 substrates or C18:1, in
      contrast to strong C20:4 activity. This is a concrete target-specific assay limitation, but a finite
      panel, especially one monounsaturated substrate, does not establish universal loss across each substrate
      class. PMID:19575253 reports preference, not categorical exclusion; its full tables remain inaccessible.
      A focused neutral review is requested before deciding whether the ancestral class-level capacity should
      be retained or rejected.
