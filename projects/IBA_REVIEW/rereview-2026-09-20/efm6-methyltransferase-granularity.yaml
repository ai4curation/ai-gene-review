    rationale: >
      PTN000378681 transfers the broad protein methyltransferase parent from the
      PTHR14614 root. That placement is valid for Efm6 because the target is an
      experimentally established protein-lysine methyltransferase, but the row is
      intentionally less specific than the eEF1A-Lys390 activity demonstrated for
      S. cerevisiae Efm6. The more informative GO:0016279 protein-lysine
      N-methyltransferase activity term is already present in GOA and is directly
      supported by Jakobsson et al. 2015.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
