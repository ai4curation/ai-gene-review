        source_status: SUPPORTS_TRANSFER
  evidence:
  - source: interpro/panther/PTHR14614/PTHR14614-paint.tsv
    assessment: >
      The cached PAINT export places GO:0008276 at PTN000378681, the broad PTHR14614
      root seeded by characterized yeast and metazoan protein methyltransferases. More
      specific lysine-methyltransferase terms are placed only on deeper clades, so the
      EFM6 IBA reflects a deliberately broad ancestral assertion rather than an erroneous
      substrate-specific transfer.
  - source: interpro/panther/PTHR14614/PTHR14614-entries.csv
    assessment: >
      P53970/EFM6 is assigned to PTHR14614:SF152, the EFM6-specific subfamily, while
      the full PTHR14614 family spans EFM2, EFM3, EFM7, RKM5, HPM1/METTL18, METTL21,
      METTL23, and related protein methyltransferase branches with different substrate
      proteins and methylated residue classes. That heterogeneity explains why the
      root IBA is a protein-methyltransferase parent term.
  - source: PMID:26115316
    assessment: >
      Jakobsson et al. 2015 directly establish Ynl024c/Efm6 as the enzyme required for
      eEF1A Lys390 methylation in vivo and able to methylate eEF1A in vitro, confirming
      that the target is a protein methyltransferase while providing enough resolution
      to prefer protein-lysine N-methyltransferase activity.
  searched_publications:
  - query: '"EFM6" "YNL024C" eEF1A Lys390 methyltransferase 2024 2025 2026'
    result: >
      No newer direct Saccharomyces cerevisiae EFM6 primary paper was found. Public hits
      were the 2015 defining PLoS ONE article, older follow-on EFM-family papers,
      database pages, and background-only mentions that did not change the PTHR14614
      granularity decision.
