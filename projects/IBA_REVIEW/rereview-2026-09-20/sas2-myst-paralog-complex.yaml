      The current PAINT export keeps both SAS2 IBA rows at PTN007449682: a
      correct GO:0046972 H4K16 acetyltransferase IBD and a NuA4 component IBD
      seeded by fly, mouse, and human KAT5/TIP60 descendants.
  - source: interpro/panther/PTHR10615/PTHR10615-entries.csv
    assessment: >
      Yeast Sas2 is currently assigned to PTHR10615:SF219 with KAT5/TIP60
      NuA4 seeds, yeast Esa1 is assigned to PTHR10615:SF218, and the human,
      mouse, rat, and fly KAT8/MOF proteins are in PTHR10615:SF82.
  - source: PMID:12626510
    assessment: >
      Sutton et al. directly showed that the Sas2/Sas4/Sas5 SAS complex has HAT
      activity and acetylates H4K16 and H3K14 on free histones.
  - source: PMID:11731480
    assessment: >
      Meijsing and Ehrenhofer-Murray identified the nuclear Sas2/Sas4/Sas5 SAS-I
      complex and its interactions with Cac1/CAF-I and Asf1, supporting SAS-complex
      membership and the generic protein-binding row removals.
  - source: PMID:22020126
    assessment: >
      Yuan et al. support the newly live EXP row for broad
      protein-lysine-acetyltransferase activity by establishing autoacetylation-
      dependent yeast Sas2 catalytic activity.
