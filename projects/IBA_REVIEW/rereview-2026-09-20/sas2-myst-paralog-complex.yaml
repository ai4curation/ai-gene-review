  annotations:
  - original_index: 0
    term_id: GO:0046972
    term_label: histone H4K16 acetyltransferase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    previous_action: ACCEPT
    action: ACCEPT
    outcome: confirmed
    rationale: >
      The current PAINT assertion is placed at PANTHER:PTN007449682 and transfers
      H4K16 acetyltransferase activity from fungal, fly, mouse, and human
      descendants. S. cerevisiae Sas2 itself has direct biochemical evidence for
      SAS-complex H4K16 acetylation, so the inherited molecular function remains
      core.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN007449682
        source_status: SUPPORTS_TRANSFER
  - original_index: 2
    term_id: GO:0035267
    term_label: NuA4 histone acetyltransferase complex
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    previous_action: REMOVE
    action: REMOVE
    outcome: confirmed
    rationale: >
      The NuA4 component IBD is also placed at PANTHER:PTN007449682. Its extant
      seeds are KAT5/TIP60-like NuA4 descendants in PTHR10615:SF219, the same
      subfamily that currently contains budding-yeast Sas2, while the real yeast
      NuA4 catalytic subunit Esa1 sits in SF218 and receives its PAINT IBAs from
      PTN004172926. The unsafe transfer is therefore a Sas2 subfamily placement
      problem; the remedy is to re-place Sas2 toward SF82/KAT8 or assert an
      IRD/NOT on the yeast Sas2 branch for GO:0035267, not just to restrict
      PTN007449682.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN007449682
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
