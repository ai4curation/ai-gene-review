  - annotation_index: 11
    term: GO:0061060
    from_action: NEW
    to_action: NEW
    rationale: Retain the pre-existing proposal for negative regulation of peptidoglycan recognition protein
      signaling. The PGRPLB ortholog in Anopheles coluzzii directly restrains systemic CEC1 induction
      after blood feeding. The protein itself is inferred to perform the ligand-cleavage step, satisfying
      participation rather than merely serving as a substrate. The direct mosquito result and conserved
      amidase mechanism support the existing proposal; the old reviewer-authored IBA metadata has been
      corrected to ISS with the close-ortholog primary reference, rather than claiming that this proposed
      term was found on PTN002475783.
  - annotation_index_before_edit: 12
    term: GO:0045824
    from_action: NEW
    to_action: deleted_redundant_proposal
    rationale: Deleted only the old reviewer-authored NEW proposal because its meaning is retained more
      specifically or as an existing-row replacement. All GOA source rows remain intact.
  evidence:
  - reference: PMID:28494453
    finding: Anopheles coluzzii, formerly A. gambiae M form, has two predicted PGRPLB membrane isoforms.
      Knockdown increased systemic fat-body CEC1 without affecting the measured local midgut response.
      This is direct ortholog perturbation evidence, not target-specific biochemical kinetics.
  - reference: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
    finding: Read mechanistic account and limitations. Much discussion comes from PGRP-LD/PGRPLC or family
      literature; primary PGRPLB experiments now distinguish the actual role.
