    immune wording and removed a redundant old NEW proposal.
  changes:
  - annotation_index: 0
    term: GO:0005615
    from_action: MODIFY
    to_action: UNDECIDED
    rationale: GOA traces this IBA to PTN002475783 in PTHR11022. The current PAINT snapshot places extracellular
      region at this node, whereas the older row specifies extracellular space. PMID:28494453 describes
      two Anopheles coluzzii PGRPLB isoforms differing in predicted transmembrane domains, but does not
      experimentally establish secretion, ectodomain release, or complete exclusion from extracellular
      space. Membrane prediction is insufficient to replace an inherited extracellular annotation categorically.
      Keep the original location unresolved pending isoform-resolved localization assessment.
  - annotation_index: 1
    term: GO:0006955
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    rationale: An amidase that removes immune-stimulating peptidoglycan performs a regulatory step in
      immunity; it need not activate an immune response to participate. The PTHR11022 ancestral immune-response
      placement at PTN002475783 is consistent with direct PGRPLB knockdown in Anopheles coluzzii, a member
      of the Anopheles gambiae complex formerly designated its M form. The primary experiment supports
      restraint of systemic responses, rather than the previous claim of reduced local midgut CEC1 expression.
  - annotation_index: 3
    term: GO:0016019
    from_action: MODIFY
    to_action: UNDECIDED
    rationale: PTN002475783 carries the peptidoglycan immune receptor IBD. GO:0016019 requires binding
      peptidoglycan and transmitting a signal to initiate innate immunity. Amidase activity and negative
      regulation do not by themselves establish this signal-initiation function, but specialization as
      an amidase also does not prove loss of an ancestral receptor function. PMID:28494453 assays immune
      regulation, not receptor coupling. Withdraw the confident replacement by binding alone and leave
      this mechanistic question for focused adjudication.
  - annotation_index: 4
    term: GO:0050830
    from_action: MODIFY
    to_action: KEEP_AS_NON_CORE
    rationale: PTN002475783 places defense response to Gram-positive bacterium in the ancestral PGRP clade.
      The previous replacement with Gram-negative defense treated DAP-type peptidoglycan as exclusive
      to Gram-negative bacteria; some Gram-positive bacteria also contain this chemotype. No target-specific
      loss of the inherited defense role was established. Anopheles coluzzii PGRPLB directly modulates
      systemic immunity, although that study does not isolate a Gram-positive challenge. Retain the IBA
      as an inference, without claiming a mosquito-specific Gram-positive experiment.
  - annotation_index: 5
    term: GO:0002376
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    rationale: An amidase that removes immune-stimulating peptidoglycan performs a regulatory step in
      immunity; it need not activate an immune response to participate. The PTHR11022 ancestral immune-response
