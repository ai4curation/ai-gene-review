- gene_file: genes/human/LPIN3/LPIN3-ai-review.yaml
  status: awaiting_adjudication
  scope: full_gene
  annotation_count: 12
  final_annotation_count: 12
  outcome: Restored nuclear localization, coactivation and PolII activation; retained fatty-acid catabolism
    as non-core. Insulin response remains unresolved after examining condition- and species-specific results.
  changes:
  - annotation_index: 0
    term: GO:0005634
    from_action: MODIFY
    to_action: ACCEPT
    rationale: PTHR12181 places nuclear localization at PTN000256565. The annotation is reviewed for location,
      not its machine-supplied relationship wording. A conserved polybasic region and the separate UniProt-derived
      nuclear annotation are consistent with this localization; no LPIN3-specific exclusion was established.
  - annotation_index: 2
    term: GO:0009062
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: KEEP_AS_NON_CORE
    rationale: The ancestral placement at PTN000256565 represents more than an inference from PAP chemistry.
      LPIN3 PAP activity supplies biosynthetic DAG, but this specialization does not exclude a separate
      inherited transcriptional role influencing fatty-acid catabolism. No target-specific loss of that
      role was identified. Retain the process as an inference pending the focused report; the PAP reaction
      itself is not evidence of fatty-acid breakdown.
  - annotation_index: 4
    term: GO:0003713
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    rationale: PTHR12181 places transcription coactivation and positive regulation of RNA polymerase II
      transcription at PTN000953144. Published assays directly establish coactivation in other lipins,
      and LPIN3 retains the LXXIL motif and inferred nuclear localization. These facts do not independently
      prove LPIN3 coactivation, but there is no demonstrated LPIN3-specific loss that would overturn the
      curated ancestral placement. The previous over-annotation judgment relied on missing direct experiments.
      Retain the IBA while the focused assessment examines functional divergence.
  - annotation_index: 5
    term: GO:0032869
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: UNDECIDED
    rationale: PTN000953144 is the current ancestral insulin-response IBD. PMID:28982975 directly finds
      no acute insulin/Torin-dependent phosphorylation of mouse lipin-3, rather than demonstrating absence
      of every insulin-related function of human LPIN3. Conversely, PMID:18245816 finds that insulin suppresses
      dex-induced mouse Lpin3 mRNA while having no effect alone. Expression responsiveness does not by
      itself establish a gene-product function in the process. These condition-specific results require
      assessment of which role the IBD inherits; neither a blanket rejection nor direct human experimental
      support is justified.
  - annotation_index: 6
    term: GO:0045944
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    rationale: PTHR12181 places transcription coactivation and positive regulation of RNA polymerase II
      transcription at PTN000953144. Published assays directly establish coactivation in other lipins,
      and LPIN3 retains the LXXIL motif and inferred nuclear localization. These facts do not independently
      prove LPIN3 coactivation, but there is no demonstrated LPIN3-specific loss that would overturn the
      curated ancestral placement. The previous over-annotation judgment relied on missing direct experiments.
      Retain the IBA while the focused assessment examines functional divergence.
  evidence:
  - reference: PMID:17158099
    finding: Direct recombinant lipin-3 PAP1 activity with magnesium and phosphatidate specificity under
      tested conditions.
  - reference: PMID:28982975
    finding: 'Full primary paper uses mouse lipin-3: no acute insulin/Torin-dependent phosphorylation,
      distinct polybasic-domain regulation, not a test excluding all human LPIN3 insulin roles.'
  - reference: PMID:18245816
    finding: 'Full primary result: insulin alone did not affect mouse Lpin3 mRNA, but suppressed dex-induced
      transcript increase. Expression responsiveness alone does not establish participation of the product
      in an insulin-response process.'
  - reference: PMID:19717560
    finding: Coactivation experiments concern lipin-1/2; missing LPIN3 assay is not a demonstrated evolutionary
      loss.
  - reference: PMID:27344312; PMID:24634820; PMID:30507612
    finding: Human adipocyte and mouse single/double-knockout evidence supports PAP/glycerolipid functions
      with compensation and species/paralog limits.
