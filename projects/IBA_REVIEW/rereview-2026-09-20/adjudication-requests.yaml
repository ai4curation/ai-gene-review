- organism: POPTR
  gene: ndhD
  slug: chlororespiratory-capacity-and-subunit-quinone-binding
  term_ids:
  - GO:0009060
  - GO:0022904
  - GO:0048039
  hypothesis: Populus chloroplast NDH subunits ndhB1 (P0CD34), ndhB2 (P0CD35), ndhD (A4GYW6) and ndhK
    (A4GYR4) retain respiratory electron transport and aerobic respiration through chlororespiration.
    Separately, NdhD itself binds ubiquinone. Evaluate each hypothesis against term definitions and full
    primary studies. Current exact target leaves descend from PTN000511884 (both NdhB copies), PTN000511780
    (NdhD) and PTN000242188 (NdhK); donor count is irrelevant. Chloroplast localization does not itself
    exclude respiration. PMID:27066014 compares tobacco ndhJK/ndhCJK mutants and PTOX inhibition under
    heat stress; PMID:28559282 demonstrates NDH proton pumping and discusses ATP-generating chlororespiration.
    Establish which respiratory steps and energy conservation are demonstrated rather than proposed, and
    whether conservation supports the Populus inference. Modern NDH uses ferredoxin and lacks the NADH-oxidizing
    module; that electron-donor correction is distinct from respiratory process scope. For NdhD binding,
    PMID:39856350 places the plastoquinone pocket in NdhA/H/K, with antiporter-like NdhD elsewhere in the
    membrane arm. Does any direct, structural or ancestral evidence establish NdhD quinone binding? Whole-complex
    substrate specificity alone does not establish physical binding by every subunit; do not automatically
    substitute generic quinone binding.
  cache_check: Exact accessions, genes and family ids plus chloroplast NDH and ferredoxin/plastoquinone
    query search of the global OpenScientist cache returned no matches. Existing five gene reviews, notes,
    family reviews and primary research were examined first. One shared request covers all four NDH genes.
