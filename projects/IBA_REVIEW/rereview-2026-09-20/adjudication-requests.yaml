policy: Neutral function hypotheses; no prior review action supplied. Read the actual GO definitions,
  separate target evidence from phylogenetic inference, and do not equate missing experiments with refutation.
  Each GO claim needs a separate judgment, even when related claims share a report. Repository hypotheses
  were searched before selection; BAIAP2L2's epithelial report does not adjudicate nuclear localization.
  Provider cache hits require inspection before new runs.
