      descendants; this is not a pairwise cAR1 transfer.
    cache: interpro/panther/PTHR23112/PTHR23112-paint.tsv
  adjudication:
  - terms:
    - GO:0007189
    hypothesis: Does CAR4 retain adenylate-cyclase-activating GPCR signaling inherited
      from PTN000560943, or does target-specific receptor divergence establish loss
      of this output? Assess cyclase measurements independently of the well-established
      phosphatase/GSK3 pathway.
    status: completed_report_incorporated
    report: file:DICDI/carD/carD-hypotheses/function-hypothesis-go-0007189/openscientist.md
    finding: The report correctly identifies the unpublished 1997 statement and cAR1/2/3
      assay scope, but misframes absence of a direct CAR4 assay and a different pathway
      output as proof of paralog carry-over. Actual IBD PTN000560943 includes fungal
      and Dictyostelium descendants.
    remaining_research_question: Direct target-specific functional assays could strengthen
      or refute these inherited roles; their current absence does not warrant rejecting
      the IBA. No duplicate report requested.
