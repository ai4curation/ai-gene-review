audit_date: '2026-09-20'
reviewer: annotation-reviewer subagent (Codex, GPT-6)
method: All 359 seeded annotation rows across these ten genes were read and assessed,
  including their review rationale and cited primary evidence. All source-paper abstracts
  were inspected and available relevant full-text sections were examined for contested
  claims. UniProt records, actual GO definitions, PAINT IBD/IRD rows and the existing
  SpiA OpenScientist report were considered. This is an evidence-based full-gene review,
  not a keyword scan. Incomplete experimental evidence is marked explicitly. Machine-provided
  annotation fields and row counts were preserved.
genes:
- gene_file: genes/DICDI/carD/carD-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 23
  outcome: Retained adenylate-cyclase-activating signaling as non-core after the focused
    report established no target-specific loss. Preserved unpublished-observation
    and receptor-assay boundaries; GSK3 antagonism is not evidence against another
    output.
  changes:
  - annotation_index: 2
    term: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    evidence: IBA
    reference: GO_REF:0000033
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: UNDECIDED
    rationale: PTHR23112-paint.tsv places GO:0007189 at PTN000560943 (taxon 2759),
      supported by PomBase:SPCC1753.02c and dictyBase:DDB_G0273397/DDB_G0277829. This
      is an ancestral-function judgment, not a pairwise cAR1 transfer. PMID:12408804
      establishes the CAR4/GSK3 branch but does not test loss of cyclase coupling.
      The 1997 primary study (PMCID:PMC316452) explicitly entertains cyclase activation
      by all cARs, partly using unpublished observations. The old over-annotation
      verdict therefore exceeded the evidence; focused adjudication is needed to distinguish
      a retained secondary output from receptor divergence.
  - annotation_index: 10
    term: GO:0035589
    label: G protein-coupled purinergic nucleotide receptor signaling pathway
    evidence: IEA
    reference: GO_REF:0000108
    from_action: REMOVE
    to_action: ACCEPT
    rationale: QuickGO defines GO:0035589 by extracellular purine-nucleotide activation
      and does not restrict it to ATP/ADP-binding P2Y receptors. cAMP is a purine
      nucleotide, and CAR4 is a G protein-linked cAMP receptor. The old removal incorrectly
      substituted a narrower P2-receptor interpretation for the ontology definition;
      retain the logical inference.
  - annotation_index: 19
    term: GO:0030154
    label: cell differentiation
    evidence: IMP
    reference: PMID:7958880
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    rationale: The car4-null phenotype directly establishes this role, which is the
      principal characterized biological purpose of the late-stage receptor and is
      already included in the core-function synthesis. Retain as core rather than
      treating cell differentiation as an incidental downstream phenotype.
  - annotation_index: 2
    term: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    evidence: IBA
    reference: GO_REF:0000033
    from_action: UNDECIDED
    to_action: KEEP_AS_NON_CORE
    rationale: PTHR23112 places GO:0007189 at PTN000560943 with fungal and Dictyostelium
      experimental descendants. The focused OpenScientist report confirms that published
      receptor-comparison assays directly tested cAR1/cAR2/cAR3, while the 1997 extension
      to all cARs explicitly includes unpublished observations. That distinction is
      valid, and the observation is not treated as a published CAR4 assay. However,
      the report finds no CAR4-specific loss and incorrectly treats target experimental
      absence and a different signaling branch as sufficient to diagnose paralog carry-over.
      GSK3 antagonism does not imply inhibition or loss of adenylyl cyclase. Retain
      the curated ancestral inference as non-core; direct CAR4 cyclase activity remains
      unverified.
    phase: focused_report_incorporation
  evidence:
  - reference: PMID:7958880
    finding: Direct cAR4-null and receptor study supports cell-surface GPCR signaling
      and cell-type differentiation.
  - reference: PMID:12408804
    finding: CAR4/GSK3 regulation establishes one signaling output without testing
      loss of adenylate-cyclase coupling.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC316452/
    finding: The primary paper discusses cyclase activation through cARs, partly using
      unpublished observations; it prevents treating the GSK3 branch as exclusive.
  - reference: https://www.ebi.ac.uk/QuickGO/term/GO:0035589
    finding: 'The term is not limited to P2Y/ATP/ADP receptors: extracellular purine
      nucleotides include cAMP.'
  - reference: file:DICDI/carD/carD-hypotheses/function-hypothesis-go-0007189/openscientist.md
    finding: The report correctly identifies the unpublished 1997 statement and cAR1/2/3
      assay scope, but misframes absence of a direct CAR4 assay and a different pathway
      output as proof of paralog carry-over. Actual IBD PTN000560943 includes fungal
      and Dictyostelium descendants.
    report_assessment: DISPUTED for rejection rationale; substantive source findings
      incorporated with exact excerpts
  paint:
