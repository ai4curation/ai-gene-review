- gene_file: genes/DICDI/pten/pten-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 73
  outcome: Full-gene re-review and focused report incorporation completed. Cell-cycle
    regulation retained as non-core; nucleus remains UNDECIDED because report does
    not establish target loss. Human follow-up remains for import conservation/localization,
    not another duplicate report.
  changes:
  - annotation_index: 1
    term: GO:0051726
    label: regulation of cell cycle
    evidence: IBA
    reference: GO_REF:0000033
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: KEEP_AS_NON_CORE
    rationale: The PAINT assertion is at PTN000959472 in PTHR12305 and includes fly,
      rodent and human experimental descendants. Regulation of the cell cycle is not
      restricted to mammalian tumor suppression, and cytokinesis is a cell-cycle process
      rather than evidence excluding that parent scope. Target experiments establish
      PTEN-dependent cytokinesis and density-dependent inhibition of proliferation.
      Retain as a non-core regulatory context; the exact division-stage mechanism
      and relation to the ancestral assertion remain suitable for focused adjudication.
  - annotation_index: 2
    term: GO:0005634
    label: nucleus
    evidence: IBA
    reference: GO_REF:0000033
    from_action: REMOVE
    to_action: UNDECIDED
    rationale: PTHR12305-paint.tsv places the nuclear IBD at PTN000959472 with mouse,
      human and worm experimental descendants (including WB:WBGene00000913). The prior
      assertion that nuclear PTEN is mammal-specific was therefore inaccurate. Plasma-membrane/cytosol
      imaging establishes those pools but does not exclude a condition-dependent nuclear
      pool. No target-specific loss of nuclear targeting was demonstrated. Withdraw
      the confident removal and seek focused adjudication of the ancestral placement
      and Dictyostelium localization evidence.
  evidence:
  - reference: PMID:19515202
    finding: pten-null cells become multinucleated and show defective myosin II accumulation
      at the furrow, directly supporting a division-control context.
  - reference: PMID:38940195
    finding: AprA inhibition of proliferation requires PTEN/CnrN and altered phosphoinositides;
      this is direct target evidence for proliferation regulation.
  - reference: PMID:12062103
    finding: PTEN-GFP surface localization at the cell rear establishes a membrane
      pool; it does not exclude conditional nuclear localization.
  - reference: https://www.ebi.ac.uk/QuickGO/term/GO:0051726
    finding: Cell-cycle regulation includes progression through division; it is not
      restricted to mammalian tumor suppression.
  - reference: file:DICDI/pten/pten-hypotheses/nuclear-localization-and-cell-cycle/openscientist.md
    finding: Report critically incorporated; unverified alignment/import-site lead
      retained as follow-up, but provenance/term-absence/exclusivity claims are disputed.
    exact_excerpt: the exact single-residue call is low-confidence
  - reference: PMID:17218261
    finding: Human nuclear-import defect is conditional and can be rescued by forced
      monoubiquitination; ortholog residue analogy does not demonstrate Dictyostelium
      exclusion.
    exact_excerpt: their mutation leads to a constitutive shuttling defect that can
      be overcome by forced mono-ubiquitination.
  - reference: PMID:15809030
    finding: Abstract describes lines lacking both enzymatic activities, unlike the
      report genotype assertion.
    exact_excerpt: 'Cell lines lacking both of

      these enzymatic activities fail to modulate PI(3,4,5)P3 levels'
  paint:
    family: PTHR12305
    nodes:
    - PTN000959472
    - PTN000266847
    finding: Nuclear IBD descendants include worm as well as mammals; cell-cycle IBD
      also has fly support. The prior mammal-only premise was false.
    cache: interpro/panther/PTHR12305/PTHR12305-paint.tsv
  adjudication:
