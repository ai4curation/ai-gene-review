- gene_file: genes/DICDI/rasC/rasC-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 67
  outcome: Preserved RasC GTPase/TORC2 signaling and experimental secondary localizations.
    Strengthened cytokinesis rejection with a direct Ras-paralog comparison; macropinocytosis
    remains unresolved. Improved informative binding terms and left inaccessible specific
    actin phenotypes unresolved. Focused report incorporated critically; claim remains
    UNDECIDED and requires human follow-up because the report did not resolve the
    decisive evidence.
  changes:
  - annotation_index: 3
    term: GO:0000281
    label: mitotic cytokinesis
    evidence: IBA
    reference: GO_REF:0000033
    from_action: REMOVE
    to_action: REMOVE
    rationale: PTHR24070-paint.tsv places GO:0000281 at PTN001177391 from experimental
      Dictyostelium descendants DDB_G0292996, DDB_G0292998 and DDB_G0293434. The challenge
      concerns propagation across the RasC branch, not the number of donors. PMID:20833893
      directly compares rasG, rasC/rasG and RasD-rescued strains and finds no RasC
      contribution to the cytokinesis phenotype, while RasD substitutes for RasG.
      This target-specific paralog comparison provides positive evidence of functional
      divergence beyond the relatively normal rasC single knockout.
  - annotation_index: 4
    term: GO:0044351
    label: macropinocytosis
    evidence: IBA
    reference: GO_REF:0000033
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: UNDECIDED
    rationale: PTHR24070-paint.tsv places GO:0044351 at PTN001177391. The earlier
      review treated this process annotation as necessarily a positive-regulation
      claim and used increased liquid-phase endocytosis to refute it. The term itself
      denotes macropinocytic uptake, and the effects of RasC may be indirect, inhibitory
      or condition-dependent. Published work reports both increased/normal uptake
      and a lesser fluid-uptake defect in different contexts. Adjudication must distinguish
      RasC action in macropinocytic machinery from regulation or compensation before
      judging the ancestral placement.
  - annotation_index: 16
    term: GO:0031932
    label: TORC2 complex
    evidence: IDA
    reference: PMID:31263268
    from_action: KEEP_AS_NON_CORE
    to_action: KEEP_AS_NON_CORE
    rationale: The experiment establishes a regulated RasC-RacE-mTORC2 signaling assembly.
      Retain this dynamic regulatory association as non-core relative to the defining
      TORC2 subunits; the existing TORC2 binding and activation annotations capture
      the central RasC role.
  - annotation_index: 25
    term: GO:0005515
    label: protein binding
    evidence: IPI
    reference: PMID:31263268
    from_action: KEEP_AS_NON_CORE
    to_action: MODIFY
    rationale: The cited experiment identifies the TORC2 interaction underlying RasC-dependent
      kinase activation. Replace generic protein binding with TORC2 complex binding,
      consistent with the independent direct annotation already present.
  - annotation_index: 29
    term: GO:0005515
    label: protein binding
    evidence: IPI
    reference: PMID:24986648
    from_action: KEEP_AS_NON_CORE
    to_action: MODIFY
    rationale: The yeast two-hybrid and pull-down experiments identify a kinase interaction,
      supporting protein kinase binding. This molecular interaction alone does not
      establish a cytokinesis role for RasC.
  - annotation_index: 30
    term: GO:0005515
    label: protein binding
    evidence: IPI
    reference: PMID:26424797
    from_action: KEEP_AS_NON_CORE
    to_action: MODIFY
    rationale: Binding to a defined phosphatase-complex subunit supports protein phosphatase
      binding, which is more informative than generic protein binding. This preserves
      the measured interaction and its regulatory context.
  - annotation_index: 31
    term: GO:0005515
    label: protein binding
    evidence: IPI
    reference: PMID:27172998
    from_action: KEEP_AS_NON_CORE
    to_action: MODIFY
    rationale: The cited experiment identifies the TORC2 interaction underlying RasC-dependent
      kinase activation. Replace generic protein binding with TORC2 complex binding,
      consistent with the independent direct annotation already present.
  - annotation_index: 32
    term: GO:0005515
    label: protein binding
    evidence: IPI
    reference: PMID:29109256
    from_action: KEEP_AS_NON_CORE
    to_action: REMOVE
    rationale: The cited interaction is retained as evidence in this review, but the
      generic protein binding term does not describe the GTPase molecular-switch function.
      Removal concerns the uninformative annotation, not the validity of the reported
      interaction; no unsupported replacement function is inferred from binding alone.
  - annotation_index: 34
    term: GO:0005811
    label: lipid droplet
    evidence: HDA
    reference: PMID:24036346
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: KEEP_AS_NON_CORE
    rationale: An experimental lipid droplet annotation reports localization and does
      not require demonstration of a dedicated RasC function in that compartment.
      The prior review inferred contamination from RasC membrane anchoring without
      target-specific evidence. The primary plasma-membrane role does not exclude
      a secondary compartment. Retain the curated observation as non-core and distinguish
      it from the best-characterized signaling location.
  - annotation_index: 39
