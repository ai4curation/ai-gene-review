- gene_file: genes/DICDI/regA/regA-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 31
  outcome: 'Restored broad signal transduction for the phosphorelay-regulated PDE.
    Withdrew categorical rejection of cGMP phosphodiesterase activity: a selectivity
    lower bound and cGMP competition do not independently prove presence or absence
    of weak catalysis. Focused report incorporated critically; claim remains UNDECIDED
    and requires human follow-up because the report did not resolve the decisive evidence.'
  changes:
  - annotation_index: 1
    term: GO:0047555
    label: 3',5'-cyclic-GMP phosphodiesterase activity
    evidence: IBA
    reference: GO_REF:0000033
    from_action: REMOVE
    to_action: UNDECIDED
    rationale: PTHR11347-paint.tsv places the cGMP phosphodiesterase IBD at PTN001682918.
      The earlier review treated approximately 200-fold cAMP selectivity as proving
      absence of all cGMP activity. The primary kinetic summary (PMID:12429832) reports
      a lower bound on selectivity; the later recombinant-complex study (PMID:34063491)
      calls RegA dual-specific and directly shows cGMP competition, but the displacement
      assay does not independently establish cGMP hydrolysis. cAMP is the clearly
      established physiological substrate. Withdraw the categorical removal pending
      adjudication of the actual cGMP turnover data; do not infer catalysis from binding
      alone.
  - annotation_index: 8
    term: GO:0007165
    label: signal transduction
    evidence: IEA
    reference: GO_REF:0000002
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    rationale: RegA accepts phosphate through its receiver domain and changes cAMP
      turnover as the output of the RdeA-RegA signaling system. The term is broad,
      but breadth and coexistence with more specific terms do not make this an over-annotation.
  evidence:
  - reference: PMID:10488068
    finding: RegA is a receiver-domain/cAMP-PDE response regulator, supporting the
      retained signaling function.
  - reference: PMID:17040207
    finding: RegA is the cytosolic cAMP-specific PDE that regulates intracellular
      cAMP.
  - reference: PMID:12429832
    finding: The primary kinetic summary gives a greater-than selectivity bound, not
      a demonstrated exact 200-fold cGMP/cAMP turnover ratio. Fetched and inspected
      primary full text.
  - reference: PMID:34063491
    finding: The recombinant RegA-RD study reports cGMP competition in a fluorescent
      displacement assay; binding/competition alone is not a direct cGMP turnover
      measurement. Fetched and inspected primary full text.
