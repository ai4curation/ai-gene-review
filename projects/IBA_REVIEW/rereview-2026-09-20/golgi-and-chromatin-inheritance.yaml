- gene_file: genes/yeast/FUN19/FUN19-ai-review.yaml
  status: awaiting_adjudication
  scope: full_gene
  annotation_count: 11
  final_annotation_count: 11
  outcome: Restored supported inherited functions after reading actual ancestor placement and correcting
    false domain/compartment requirements. Mechanistic follow-up remains open, without treating it as
    negative evidence.
  changes:
  - row_index: 0
    term:
      id: GO:0005634
      label: nucleus
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    reason: The actual PTHR12374 tree places Fun19/PTN000271934 below the eukaryotic nuclear assertion
      at PTN000271860 and the fungal chromatin-complex clade. No target-specific loss of nuclear targeting
      is established. Lack of a direct target localization assay is not a reason to demote an otherwise
      supported phylogenetic core location.
  - row_index: 1
    term:
      id: GO:0006338
      label: chromatin remodeling
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: GO:0006338 is a dynamic reorganization process, not a requirement that every participant be
      an ATPase. Actual descent from PTN000271860 is verified, and the current node includes Laf1 as well
      as Ada2 evidence. The retained Rpd3L-Expanded association provides a compatible deacetylase-complex
      context. Lack of an ATPase or Ada2 ZZ/SANT domains does not refute this broader process.
  - row_index: 2
    term:
      id: GO:0003713
      label: transcription coactivator activity
    from_action: REMOVE
    to_action: ACCEPT
    reason: The actual tree retains the positive coactivator assertion from PTN000271860 in the Fun19
      branch. Fun19 differs from Ada2 in ZZ/SANT architecture and the fungal clade carries a curated loss
      of SAGA-type membership, but neither establishes loss of every coactivation mechanism. Coactivator
      activity can be supplied by different chromatin complexes; absence of a target assay or a donor
      in the same terminal subfamily is not a negative result. Restore the inherited assertion and seek
      a focused assessment of functional directionality and conserved interfaces without assuming that
      the SAGA loss propagates to all regulatory functions.
  - row_index: 3
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: The term does not specify transcriptional activation or SAGA membership. The current tree
      retains this process at PTN000271860 across the Fun19 clade while separately recording loss of SAGA-type
      membership. Broad transcriptional regulation remains compatible with its SWIRM and inferred Rpd3-family
      complex context.
  - row_index: 4
    term:
      id: GO:0070210
      label: Rpd3L-Expanded complex
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: The actual target lineage descends from the fungal PTN000271931 assertion seeded by Laf1/Laf2.
      The GO definition explicitly describes a Saccharomyces cerevisiae complex, contradicting the earlier
      claim that this term is fission-yeast-specific. The same node has an IRD loss of SAGA-type complex
      GO:0070461; it does not negate Rpd3L-Expanded membership. Preserve the supported complex inference
      without asserting a direct Fun19 purification.
  - row_index: 5
    term:
      id: GO:0003682
      label: chromatin binding
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    reason: The current ancestral chromatin-binding assertion and retained SWIRM domain are concordant.
      PMID:16461455 directly assays related Swi3/Rsc8 SWIRM modules, not Fun19, and supports the domain
      mechanism without being misrepresented as a target assay. Missing Fun19-specific measurement does
      not by itself make the inherited function non-core.
  - row_index: 6
    term:
      id: GO:0010468
      label: regulation of gene expression
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: This existing ARBA assertion is consistent with the independently curated chromatin-binding,
      Pol-II-regulation and Rpd3-family complex inferences. Breadth does not make a biologically compatible
      existing term an over-annotation. It remains a computational inference, not an experimental target
      result.
  - row_index: 7
    term:
      id: GO:0045893
      label: positive regulation of DNA-templated transcription
    from_action: REMOVE
    to_action: ACCEPT
    reason: The inter-ontology assertion derives from GO:0003713. Since actual ancestry retains coactivator
      activity and no activation-specific loss has been established, the earlier removal of this derived
      assertion loses its stated basis. Restore it with the same inferential limits and include directionality
      in the focused mechanistic follow-up.
