  changes:
  - row_index: 0
    term:
      id: GO:0005829
      label: cytosol
    from_action: KEEP_AS_NON_CORE
    to_action: ACCEPT
    reason: The actual PTHR21575 tree places Q06673/PTN001853777 below PTN000491103. The inherited cytosol
      assertion is consistent with the curated high-throughput cytoplasmic GFP localization. A location
      can represent the core biology even when the molecular mechanism is not established.
  - row_index: 1
    term:
      id: GO:0016020
      label: membrane
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: GO:0016020 includes proteins attached to a lipid bilayer, not only integral membrane proteins.
      Lack of a transmembrane helix or signal peptide therefore does not refute it. Actual descent from
      PTN000491103 is verified; a cytoplasmic GFP pool does not exclude dynamic peripheral membrane association.
      Retain the inherited assertion rather than treat a broad valid parent as over-annotation.
  - row_index: 2
    term:
      id: GO:0007030
      label: Golgi organization
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: Actual descent from PTN000491103 is verified. The ancestral assertion includes experimental
      fission-yeast SPAC17A5.16/Hid1 evidence; PMID:40899782 documents its Golgi phenotype and substantial
      ECM30 sequence divergence. That divergence and unstacked budding-yeast Golgi motivate mechanistic
      follow-up, but GO:0007030 encompasses organization beyond stacking, so they do not demonstrate loss
      of the broad function. Target Gap1 sorting and Ubp15 complex evidence is compatible with trafficking.
      Missing target experiments and metazoan dense-core-vesicle specialization do not negate this separately
      asserted conserved process.
  - row_index: 3
    term:
      id: GO:0000138
      label: Golgi trans cisterna
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: PTN001853777 lies below the actual PTN000491103 Golgi-cisterna assertion. Budding-yeast cisternae
      need not form a stacked apparatus for a trans-Golgi compartment to exist, and the cytoplasmic GFP
      result is not an exclusion assay. PMID:40899782 provides a target-divergence lead for focused follow-up,
      not direct evidence that Ecm30 cannot associate with this compartment. The annotation remains phylogenetic,
      not a direct yeast localization measurement.
  - row_index: 4
    term:
      id: GO:0005797
      label: Golgi medial cisterna
    from_action: MARK_AS_OVER_ANNOTATED
    to_action: ACCEPT
    reason: The current tree confirms descent from the ancestral medial-Golgi assertion at PTN000491103.
      Unstacked Golgi morphology does not abolish cisternal maturation compartments, and primary cytoplasmic
      localization does not establish exclusivity. Specific target sequence divergence is recorded for
      adjudication, but no demonstrated functional or localization loss justifies rejecting the inherited
      annotation.
