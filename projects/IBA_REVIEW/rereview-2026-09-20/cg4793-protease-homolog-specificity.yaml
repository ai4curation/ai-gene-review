  - source: PMID:30367934
    assessment: Full text read. Cao and Jiang classify SPs versus SPHs by presence or
      absence of the His-Asp-Ser catalytic triad, supporting the pseudoenzyme judgment
      for CG4793 but not assigning its direct immune partner.
  - source: PMID:33644706
    assessment: Full text read. Kr et al. show that two independent CG4793 RNAi
