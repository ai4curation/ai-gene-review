  - source: interpro/panther/PTHR24256/PTHR24256-paint.tsv
    assessment: Refetching with Q8IP30 recovers PTN000668109, whose IKR loss row prunes
      the non-negated GO:0004252 IBD from PTN001207268. PTN001207268 still carries
      extracellular-region and proteolysis IBDs; this supports extracellular transfer to
      CG4793, but the broad proteolysis placement is only partly resolved by the paired
