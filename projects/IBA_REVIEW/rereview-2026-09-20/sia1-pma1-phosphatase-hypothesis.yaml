    original_reference_id: PMID:9450541
    action: MODIFY
    outcome: confirmed
    rationale: >
      The SIA1 deletion phenotype supports a requirement for glucose-triggered
      Pma1 activation, but SIA1 does not perform proton transport; the process
      assertion should be moved to regulation of proton transport.
