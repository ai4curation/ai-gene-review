      PTN001286392 still carries the DCR2-seeded phosphoprotein phosphatase
      activity IBD, supporting the annotation as a plausible family-level
      hypothesis but not an experimentally established core SIA1 function.
  changes:
  - term_id: GO:0004721
    term_label: phosphoprotein phosphatase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    action: KEEP_AS_NON_CORE
    outcome: confirmed
    rationale: >
      Current PAINT places this phosphatase assertion on PTN001286392 from the
      experimentally annotated yeast DCR2 seed. SIA1 has the
      metallophosphatase fold, but SIA1-specific catalytic activity and
      substrates remain untested, so the IBA is retained as a non-core family
      hypothesis.
    propagation_review:
