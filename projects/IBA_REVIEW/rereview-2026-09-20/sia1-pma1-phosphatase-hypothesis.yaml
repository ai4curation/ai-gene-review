    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    action: KEEP_AS_NON_CORE
    outcome: confirmed
    rationale: >
      The InterPro2GO assertion is a very broad parent term from the
      calcineurin-like metallophosphatase domain. It is consistent with the
      fold but carries the same unverified activity assumption as the IBA row.
  - term_id: GO:1902600
