about: 'Rows of the tree re-read that need a curator. adjudicate: the reading calls for a judgement, the verifier
  disagreed, or the edit could not be placed; nothing was changed. not_read: no reading was returned. applied_with_note:
  the row was edited (a quote and a sentence, or a corrected reason), and the reader noted something the edit does
  not settle, often a verdict or failure mode that no longer fits. A note was written from the row as it stood before
  the edit, so it can describe something the edit has since changed, such as a row without any supported_by. contradicted_and_left
  marks an adjudicate row on which reader and verifier agree that the review states something the tree contradicts
  and nothing was edited; such a row is corrected by hand before its batch is pushed, so the count is normally 0.'
