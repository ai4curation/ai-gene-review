    including every fungal hexokinase and glucokinase and vertebrate GCK. Vertebrate HK1 and HK2 bind porin/VDAC
    through the first N-terminal residues, which fungal hexokinases and the single-domain GCK lack. Gene reviews:
    S. cerevisiae HXK1 and HXK2, S. pombe hxk1 and hxk2 and human GCK mark it over-annotated, and S. cerevisiae
    GLK1 removes it; only human HK1 accepts it. At minimum the fungal hexokinase clade and GCK need an IRD. Neither
    lineage is a whole subfamily (the fungal hexokinases share SF16 with Arabidopsis HXK1), so no subfamily is listed.
    Plant mitochondrial association was taken from the PAINT seed and not re-checked here. In the PANTHER 19.0 tree
    the two seeds bracket this Eukaryota node, human HK2 in SF4 and the Brassica seed in SF79.'
  verifier:
