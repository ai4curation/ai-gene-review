- family: PTHR11588
  node: PANTHER:PTN000172659
  term: GO:0005874
  negated: true
  kind: node
  action: LOSS_CONTRADICTED
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  tree_sentence: In the PANTHER 19.0 tree the loss sits on a Eukaryota speciation node with 133 leaves in 98 species
    and 4 subfamilies (SF7, SF62, SF79, SF381), and it stops the microtubule term asserted at PTN000172598; the
    clade is one leaf smaller than the review states, which does not change what the loss covers.
  false_claims:
  - '''the gamma-tubulin clade (134 leaves; subfamilies SF7, SF62, SF79, SF381)'': the listing gives the node 133
    leaves in 98 species and 4 subfamilies.'
  reason_replacement: 'This IRD stops the tubulin-root IBD for microtubule (PTN000172598, seeded by alpha and beta
    tubulins) from descending into the gamma-tubulin clade (133 leaves; subfamilies SF7, SF62, SF79, SF381). The
    curator''s intent is clear and biologically right in one sense: gamma-tubulin is not a lattice-forming tubulin,
    and the node instead carries IBDs for gamma-tubulin complex, spindle pole and microtubule nucleator activity.
    But GO:0005874 is a cellular component, and the location is retained. The gamma-tubulin ring complex caps microtubule
    minus ends, and GO:0036449 microtubule minus-end is part_of GO:0005874. Gamma-tubulin is also recruited along
    the length of existing microtubules for branching nucleation: by augmin on human spindle microtubules, and along
    cortical microtubules in plants. Independent IDA annotations from four groups (TAIR, FlyBase, UniProt, MGI)
    in human, mouse, Arabidopsis and fly record exactly this association. The loss of a lattice role belongs in
    the MF row (structural constituent of cytoskeleton, assessed below), not as a NOT on the microtubule location.
    The mouse IDAs (PMID:14667810, PMID:18347012) are abstract-only and were not checked, but the case does not
    rest on them. In the PANTHER 19.0 tree the IRD sits on a Eukaryota speciation node with 133 leaves in 98 species
    and 4 subfamilies, and it stops the term asserted at PTN000172598.'
  note: The review says the node carries an IBD for spindle pole; the listing's IBDs on this node are GO:0000070,
    GO:0000212, GO:0000931, GO:0005634, GO:0005819, GO:0007020, GO:0007052 and GO:0140490, without labels in the
    dossier. A curator should confirm whether GO:0005819 is spindle rather than spindle pole and adjust the wording
    if so. The dossier gives no seed positions for the stopped assertion, so the claim that it is seeded by alpha
    and beta tubulins at the family root was not checked.
  verifier:
    agrees: true
  outcome: applied
- family: PTHR11588
  node: PANTHER:PTN000172725
  term: GO:0005737
  negated: true
  kind: node
  action: LOSS_CONTRADICTED
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  tree_sentence: In the PANTHER 19.0 tree the loss sits on a Viridiplantae speciation node with 62 leaves in 40
    species and 2 subfamilies, 59 leaves in SF7 and 3 in SF381, and it stops the cytoplasm term asserted at PTN000172598;
    the clade is not wholly SF7 as the review states, though the loss is plant-specific as described.
  false_claims:
  - '''the Viridiplantae gamma-tubulin clade (62 leaves, all in SF7 TUBULIN GAMMA CHAIN ...)'': the listing gives
    the node 2 subfamilies, SF7 TUBULIN GAMMA CHAIN (59 leaves) and SF381 TUBULIN GAMMA CHAIN (3 leaves).'
  reason_replacement: This IRD stops the tubulin-root IBD for cytoplasm (PTN000172598) from descending into the
    Viridiplantae gamma-tubulin clade (62 leaves, 59 in SF7 TUBULIN GAMMA CHAIN and 3 in SF381 TUBULIN GAMMA CHAIN,
    including Arabidopsis TUBG1 and TUBG2). Animal and fungal gamma-tubulins still inherit the term. There is no
    biological basis for a plant-specific loss of cytoplasmic localisation. Plant gamma-tubulin nucleates acentrosomal
    microtubules from the cell cortex, along cortical microtubules, at the nuclear surface, and on the spindle and
    phragmoplast. All of these sites are cytoplasmic. Immunogold electron microscopy and FLIP in Arabidopsis directly
    show gamma-tubulin with microtubules in the cytoplasm and moving within it, which supports the UniProt IDA.
    The TAIR HDA rows (phragmoplast and mitochondrial proteome surveys) add weaker, abstract-only support. The IRD
    looks like a localisation over-correction, perhaps aimed at the plant protein's additional nuclear-envelope
    and nuclear pools, and should be removed. In the PANTHER 19.0 tree the IRD sits on a Viridiplantae speciation
    node with 62 leaves in 40 species and 2 subfamilies (SF7 and SF381), and it stops the term asserted at PTN000172598.
  note: The dossier does not show which subfamily holds Arabidopsis TUBG1 and TUBG2, nor confirm that animal and
    fungal gamma-tubulins still inherit cytoplasm; those statements are kept from the original unverified.
  verifier:
    agrees: true
  outcome: applied
