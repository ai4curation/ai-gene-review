    the seeds sit in 1 of the node''s 3 branches.'
  reason_replacement: 'The seeds are PIAS1 (vertebrate) and Su(var)2-10 (insect). Their last common ancestor in
    this tree is the Bilateria node PTN000081717, one step below the eumetazoan PIAS node where PAINT placed the
    term, so the placement sits one step above the seeds'' ancestor. The JAK-STAT role is well supported in both
    lineages. The nematode branch is the problem: C. elegans has no JAK, and its STAT STA-1 works through a JAK-independent
    pathway. GEI-17 (leaf PTN000081832, under the ecdysozoan node PTN000081830) therefore inherits regulation of
    a receptor-JAK-STAT pathway that its organism lacks. An IRD for the C. elegans/nematode lineage, or a NOT annotation
    on GEI-17, is recommended. No subfamily is named as affected because SF94 contains both GEI-17 and the valid
    seed Su(var)2-10; GEI-17 is instead recorded as a member exception on the GO:0046426 term assessment, anchored
    to this node. In the PANTHER 19.0 tree the node is a Eumetazoa speciation node with 111 leaves, both seeds sit
    in one of its three branches, and their common ancestor is the Bilateria node PTN000081717 (109 leaves), 1 step
    below the PAINT node.'
