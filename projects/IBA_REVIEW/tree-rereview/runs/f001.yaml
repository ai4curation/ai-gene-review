  false_claims:
  - 'The node joins the Bilateria clade (PTN000024431) with the Dictyostelium presenilin duplication (PTN000024497:
    psenA and psenB): the two branches below the node are PTN000810910, a Metazoa-Choanoflagellida speciation node
    of 70 leaves, and PTN000024495, an Amoebozoa speciation node of 5 leaves in 3 species. The Bilateria node PTN000024431
    (68 leaves) is 3 steps below the PAINT node, not a direct branch, and the non-bilaterian side holds more than
    the two Dictyostelium paralogs.'
  reason_replacement: 'In the PANTHER 19 tree, PTN000024430 is the SPECIATION node PANTHER calls "Unikonts". Its
    two branches are the Metazoa-Choanoflagellida node PTN000810910 (70 leaves in 34 species) and the Amoebozoa
    node PTN000024495 (5 leaves in 3 species), the side that holds the Dictyostelium presenilins. PAINT gives no
    taxon for it. All seven seeds are bilaterian (fly, mouse, human, worm, zebrafish), so they support the Bilateria
    node PTN000024431 and not this one. Placing the term here makes the Dictyostelium presenilins inherit Notch
    signaling. Dictyostelium has no Notch, and McMains et al. describe its gamma-secretase signaling as having arisen
    perhaps independently of Notch. Recommended fix: move the IBD to PTN000024431 (Bilateria), or add an IRD covering
    the Amoebozoa branch. C. elegans SPE-4 (SF25) also inherits the term, through the Bilateria node, with no supporting
    evidence. That needs a separate pruning decision at the SPE-4 leaf. Only SF21 is listed as affected: the other
    Dictyostelium member, psenB, is in the mixed subfamily SF13 with fly Psn and worm SEL-12, so SF13 cannot be
    marked as affected. In the PANTHER 19.0 tree the seeds all sit in one branch, their common ancestor is the Bilateria
    node PTN000024431 (68 leaves), 3 steps below the PAINT node, and SF21 holds 2 of the node''s 75 leaves and none
    of the seeds.'
  note: The verdict and the recommended move to PTN000024431 are confirmed by the tree. An IRD at PTN000024497 alone
    may not cover all 5 Amoebozoa leaves; the dossier does not show where PTN000024497 sits relative to PTN000024495.
    Two leaves of the Metazoa-Choanoflagellida branch lie outside the Bilateria node.
  verifier:
    agrees: false
    problem: The reading, tree_sentence and false claim are right, but reason_replacement changes something the
      row does not contradict. The original fix was 'or add an IRD at PTN000024497' (the psenA/psenB duplication).
      The row only contradicts PTN000024497 being a direct branch of the node, not its existence or that it holds
      psenA and psenB. The replacement swaps this for 'an IRD covering the Amoebozoa branch', and the reader's own
      note admits the dossier does not show where PTN000024497 sits. The replacement should keep the PTN000024497
      IRD option, correcting only the claim that it is a direct branch of the node, and should keep psenA and psenB
      named rather than the looser 'the Dictyostelium presenilins'.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
