- family: PTHR11801
  node: PANTHER:PTN000927860
  term: GO:0007259
  negated: false
  kind: node
  action: TOO_DEEP
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree this Unikonts node lies 2 steps above the seeds' Bilateria common ancestor,
    with the Eumetazoa node between them, and the affected SF65, SF50, SF49 and SF68 descend from it with none of
    the seeds, so the placement reaches non-bilaterian STATs without evidence.
  false_claims:
  - the placement is one ancestral speciation deeper than the seeds -- the tree puts the seeds' common ancestor
    PTN000210449 (Bilateria) 2 steps below this Unikonts node, with the Eumetazoa speciation PTN000927862 between
    them, so the placement is two speciations deeper
  reason_replacement: 'PAINT records no taxon; the PANTHER 19 tree places PTN000927860 at the Unikonts speciation,
    the common ancestor of the Eumetazoa clade (PTN000927862) and the Dictyostelium STAT clade (PTN001370513). All
    seeds are bilaterian (fly Stat92E, mammalian, rat and zebrafish STATs), so the lowest node they support is Bilateria
    (PTN000210449); the placement is two ancestral speciations deeper than the seeds (Unikonts above Eumetazoa above
    Bilateria) and reaches organisms without JAK. Dictyostelium has no orthologs of the animal tyrosine kinases;
    its STATs are activated by TKL kinases (Pyk2 for STATc) or via the cAMP receptor cAR1 (STATa). C. elegans has
    no JAK homolog and its STATs act JAK-independently. PANTHER''s own JAK family (PTHR45807) has no member in C.
    elegans, C. briggsae, P. pacificus, Dictyostelium or Nematostella. The canonical pathway was assembled in Bilateria.
    GOA confirms the term reaches Dictyostelium dstD and C. elegans sta-1 and sta-2. Recommended fix: move the IBD
    to PTN000210449 (Bilateria) and place an IRD on the nematode STAT duplication node PTN000210629, which covers
    SF49, SF68 and the sta-1 clade. Affected subfamilies are the Dictyostelium SF65 and SF50 and the nematode SF49
    and SF68; the root catch-all SF43 also holds affected members (Dictyostelium dstD, C. elegans sta-1, P. pacificus,
    Nematostella and Trichoplax STATs) but cannot be named as a unit because it also holds the valid Stat92E seed.
    For the Dictyostelium proteins GO:0097696 (cell surface receptor signaling pathway via STAT), the JAK-agnostic
    parent, is the correct process term. The evolutionary reviews agree with this placement: STAT-like proteins
    with coiled-coil, DNA-binding and SH2 domains were present by the divergence of the amoebozoa, and the four
    Dictyostelium STATs form a distinct clade, but the canonical receptor-JAK-STAT pathway was assembled only in
    Bilateria, before the protostome-deuterostome split (PMID:24058787, PMID:24058748; quotes on the GO:0007259
    term assessment). In the PANTHER 19.0 tree the 12 resolved seeds sit in one branch whose common ancestor, the
    Bilateria node PTN000210449, is 2 steps below this Unikonts node, and SF65, SF50, SF49 and SF68 descend from
    the node with none of the seeds.'
  note: One seed (ZFIN:ZDB-GENE-980526-68) is not a leaf of the 19.0 tree; the verdict does not depend on it.
  verifier:
    agrees: false
    problem: The reading REASON_CONTRADICTED, the false claim (one speciation deeper, where the tree shows Unikonts,
      then Eumetazoa PTN000927862, then Bilateria PTN000210449, two steps) and the reason_replacement are all sound.
      The tree_sentence misleads, though. It lists SF65, SF50, SF49 and SF68 as having none of the seeds and concludes
      that the placement therefore reaches non-bilaterian STATs. SF49 and SF68 are the nematode subfamilies, and
      nematodes are bilaterian. The assessment itself treats them as needing a separate IRD below the Bilateria
      node, not as something the depth of the node causes. The sentence should not tie all four affected subfamilies
      to a non-bilaterian reach.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
