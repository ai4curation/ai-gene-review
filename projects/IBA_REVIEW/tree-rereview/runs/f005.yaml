    node down, and the seeds include steroid-metabolizing AKR1C members, which weakens the idea that the term belongs
    only on aldose-reductase branches.
  verifier:
    agrees: false
    problem: The reading NOT_A_TREE_ARGUMENT is acceptable, but the sentence overstates. It claims that lowering
      the node to the seeds would not exclude the AKR1C4, AKR1D1 or ARA1 subfamilies. The row says only that the
      seed common ancestor covers 1167 of 1191 leaves, and that SF165, SF211 and SF503 descend from the root with
      no seeds. It does not say where those subfamilies sit relative to the seed clade. SF503 has only 2 leaves
      and could lie wholly among the 24 leaves outside it, and SF211 (20 leaves) could too. The sentence also never
      states that the affected subfamilies descend from the node with none of the seeds.
    fixed:
      tree_reading: NOT_A_TREE_ARGUMENT
      quote_sentences:
      - 1
      - 3
      tree_sentence: In the PANTHER 19.0 tree the 17 seeds sit in one branch whose common ancestor, covering 1167
        of the 1191 leaves, is 5 steps below the node, and SF165, SF211 and SF503 descend from the node with none
