    so a mitochondrial-matrix location is not established as a site of its function. The row is marked as over-annotated
    rather than removed, since an organellar pool cannot be strictly excluded and this is an evolutionary inference,
    not a demonstrably wrong IEA. The row is not a transfer from a separate sub-branch that lacks human evidence.
    In the PANTHER 19.0 tree FDPS is itself a seed of node PTN000897621, its own experimental annotation being among
    the evidence for the node, and the other seeds (rat Fdps and a fly gene) are 2 one-to-one orthologs of FDPS
    in the same clade, with 0 duplications on the path.
  note: 'The review has no experimental row for this term (other rows: none) although the tree extract lists the
    human protein as a seed; the human experimental annotation behind the seed is not in the dossier and should
