  tree_sentence: In the PANTHER 19.0 tree GTPBP3 is itself a seed and the other seeds are 3 one-to-one orthologs
    and 2 orthologs across later duplications of GTPBP3, sitting in 2 of the 2 branches below the root, so the term
    is not carried over from the bacterial branch alone.
  false_claims:
  - '''PAINT transfer of cytoplasm (is_active_in) from the bacterial MnmE branch'': the seeds sit in 2 of the 2
    branches below the node; GTPBP3 is itself a seed and 3 of the other seeds share its own branch, including one-to-one
    orthologs from zebrafish, yeast (MSS1) and Trypanosoma.'
  - '''cytosolic activity is correct for the bacterial branch but the eukaryotic GTPBP3/MSS1 descendants act in
    mitochondria'' as the account of the node''s evidence: yeast MSS1 (SGD:S000004625) and human GTPBP3 are themselves
    seeds for cytoplasm, alongside E. coli MnmE.'
  reason_replacement: For human GTPBP3 the compartment in which the enzyme is active is the mitochondrion (also
    annotated by IBA, IDA and EXP). The only cytoplasmic pool is a minor splice isoform not involved in tRNA modification,
    so asserting activity in the cytoplasm (is_active_in) for the gene product is an over-annotation, whereas the
    gene's own experimental cytoplasm row records only that the isoform is located there. The row is not a transfer
    from the bacterial MnmE branch alone. In the PANTHER 19.0 tree GTPBP3 is itself a seed of the family-root node,
    and the other seeds are 3 one-to-one orthologs (zebrafish, yeast MSS1, Trypanosoma) and 2 orthologs across later
    duplications (E. coli MnmE and YfjP), in both branches below the node.
  note: The review keeps its own EXP and IEA cytoplasm rows as KEEP_AS_NON_CORE while marking the IBA over-annotated;
    the stated ground for the difference is the is_active_in qualifier and the isoform, which is why this is not
    read as VERDICT_UNSUPPORTED. The propagation_review source notes (bacterial-branch origin) need the same correction.
    COMPARTMENT_OR_COMPLEX_MISMATCH still fits.
  verifier:
    agrees: false
    problem: 'The reading and the first false claim are right: seeds sit in both branches, with GTPBP3 itself and
      three one-to-one orthologs among them. The second false claim is not contradicted. ''Cytosolic activity is
      correct for the bacterial branch but the eukaryotic GTPBP3/MSS1 descendants act in mitochondria'' is a statement
      about where the proteins act. MSS1 and GTPBP3 being seeds of a cytoplasm row does not contradict it: the dossier
      does not say which term each seed carries, and a mitochondrial annotation can seed cytoplasm because mitochondrion
      is part of cytoplasm in GO. The reason_replacement also adds ''the gene''s own experimental cytoplasm row
      records only that the isoform is located there''; the dossier does not give that row''s qualifier.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
