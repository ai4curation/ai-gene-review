    problem: The reading can stand, but the first false claim is not contradicted by the tree. The review's 'Distinct
      PANTHER node from the cytosolic FPPS node (PTN000162949)' only says the node differs from another node, and
      the dossier says nothing about PTN000162949. The review's 'distinct PANTHER sub-branch supported by fly/rat
      orthologs' never places FDPS outside the node, and it calls the fly and rat seeds orthologs, which the tree
      confirms (2 one-to-one orthologs). The only contradicted statement is 'not by the human protein' (self_seed=True).
      The reason_replacement also adds 'not established as a site of its function', which the original does not
