  false_claims:
  - '''at PANTHER:PTN005273574 (GRB2 clade of PTHR46037)'' and ''at the GRB2-clade node'': PTN005273574 is the family
    root, a speciation node at Unikonts with 99 leaves in 29 species and 6 subfamilies; GRB2 is 14 steps below it
    across 1 duplication.'
  - '''the propagation is faithful'' / ''a faithful ortholog transfer'': the two seeds (human GRB2 and its one-to-one
    mouse ortholog) have their common ancestor at a Euarchontoglires node covering 4 leaves, 12 steps below the
    PAINT node, so the node reaches far beyond the GRB2 orthologs that carry the evidence.'
  reason_replacement: The WITH/FROM is only mouse Grb2 and human GRB2; no CSN subunit family is involved. GRB2 is
    a 25 kDa SH3-SH2-SH3 adaptor, not one of the eight canonical CSN subunits (COPS1-COPS8), so a part_of COP9 signalosome
    assertion over-states what is documented (association), and says nothing about GRB2's adaptor function. The
    source assertion is over-scoped. Handled as over-annotation, consistent with the mouse Grb2 review; not removed
    because the source is experimental (IDA) and its full text is not available here. PANTHER:PTN005273574 is not
    a GRB2-only clade. In the PANTHER 19.0 tree it is the family root, a speciation node at Unikonts with 99 leaves
    and 6 subfamilies, and GRB2 is 14 steps below it across 1 duplication; the seeds, GRB2 itself and its one-to-one
    mouse ortholog, share an ancestor 12 steps below the node, so the term was also placed well above its evidence.
  failure_modes_add:
  - GRANULARITY_MISMATCH
  note: The verdict stands on the term-scope argument and matches the review's own IDA and IEA rows on this term.
    The added failure mode is a suggestion only; the tree shows the node is placed 12 steps above the seed ancestor,
    which adds a too-deep placement concern the review did not state.
  verifier:
