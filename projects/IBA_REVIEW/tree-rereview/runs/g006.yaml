  tree_sentence: In the PANTHER 19.0 tree the PAINT node is the family root at Unikonts with 99 leaves and 6 subfamilies,
    not a GRB2-only clade; the seeds, GRB2 itself and a one-to-one ortholog, share an ancestor 12 steps below it,
