- gene: ARATH/LCYB
  term: GO:0005739
  negated: false
  kind: overruled
  action: REMOVE
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 4
  - 5
  tree_sentence: In the PANTHER 19.0 tree the 6 seeds, all orthologs across later duplications, sit in both branches
    below the node and 2 of them share LCYB's own branch, so LCYB is not outside the seeded clade; the removal holds
    only on the direct evidence of a plastid location.
  false_claims:
  - The target is outside the clade that inherited the mitochondrial ubiquinone function -- the seeds sit in both
    branches below the node, the node is their common ancestor, and 2 seeds share LCYB's own branch (PTN008123702).
  false_claim_fields:
  - reason
  reason_replacement: LCYB is a chloroplast/plastid enzyme, not a mitochondrial protein. This IBA derives from PANTHER's
    HMM placement of Q38933 in the COQ6 family (PTHR43876) on the basis of a shared FAD/NAD fold; the plant lycopene
    cyclase has functionally and compartmentally diverged from the ancestral COQ6 monooxygenase. There is strong
    target-specific evidence of a plastid location (transit peptide, curated UniProt subcellular location, and all
    experimental studies). Over-propagated IBA removed on biological grounds; the correct location is already annotated
    as chloroplast. In the PANTHER 19.0 tree the 6 seeds, all orthologs across later duplications, sit in both branches
    below the node and 2 of them share LCYB's own branch, so LCYB is not outside the seeded clade; the removal rests
    on the plastid evidence.
  note: The two seeds on LCYB's branch are trypanosome proteins (Q582J7, Q38ER6) not named in the review summary's
    donor list.
  verifier:
    agrees: true
  outcome: applied
