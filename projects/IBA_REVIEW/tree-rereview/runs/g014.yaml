  reason_replacement: There is direct negative genetic evidence for the target in its own species. Hüttner et al.
    tested mns1 mns2 against two independent membrane-anchored ERAD substrates (BRI1-5, BRI1-9), and the dwarf phenotypes
    were not suppressed; the authors conclude MNS1-MNS3 are dispensable for this ERAD. The plant glycan degradation
    signal is made by ER-resident MNS4/MNS5. MNS1 is a Golgi enzyme of regular glycan maturation. Most seeds of
    the root ERAD IBD are ER-type enzymes, but one seed (human MAN1A1) lies in MNS1's own clade, so the removal
    rests on the target-specific genetic evidence rather than on node placement. In the PANTHER 19.0 tree the 7
    seeds sit in both branches below the root node and 1 of them, an ortholog across later duplications, shares
    MNS1's own branch.
  note: False claims also sit in the summary and propagation_review, which the script does not rewrite; a curator
    should correct them.
