  - 5
  tree_sentence: In the PANTHER 19.0 tree the 7 seeds sit in both branches below the root node and 1 of them, an
    ortholog across later duplications, shares MNS1's own branch, so a member of MNS1's clade is among the seeds;
    the removal rests on the Arabidopsis genetic evidence, not on placement.
  false_claims:
  - None of the seeds comes from the Golgi clade PTN000201534 that contains MNS1 / no Golgi-clade member is a seed
    -- 1 seed (human MAN1A1, ortholog across later duplications) joins MNS1 at PTN000201534 and shares MNS1's own
    branch below the node.
  - The ERAD term belongs to the ER-type/EDEM branches and was over-propagated from the root to the Golgi clade
    -- the seeds sit in both branches below the root, including MNS1's own branch.
  false_claim_fields:
  - summary
  - propagation_review
