  false_claims:
  - The review removes the IBA row while accepting the IMP row for the same term and saying the claim remains biologically
    valid for yeast Tom22. In the tree TOM22 is itself the only seed of this row, so the IBA rests on that same
    accepted experimental annotation, and the review gives no term-scope or qualifier reason that separates the
