    agrees: false
    problem: The reading fits the self-seed clause of VERDICT_UNSUPPORTED literally and the tree_sentence facts
      are correct (only seed 1 of 1, 8 steps below the family root, 0 duplications), but the corrections fail. (1)
      false_claims[0] is not a statement the review makes; it is the reader's description of the ACCEPT/REMOVE inconsistency,
      and the review nowhere denies that TOM22 is a seed. (2) false_claims[1] quotes a real claim (the row is stale
      as a PAINT propagation), but the tree does not contradict it. paint_losses_on_path=none shows only that no
      IRD is recorded; an IBD withdrawn at PTN004364609 would leave no loss on the path, and the reader's own wording
      is 'does not confirm'. Unconfirmed is not contradicted. (3) reason_replacement drops the review's conclusion
      from that ground (should not be accepted as-is) although the tree does not contradict it, and adds two arguments
      that are not in the dossier (rows sharing a term must carry consistent actions; staleness is not evidence
      against the claim). (4) The proposed ACCEPT therefore rests on an unverified assumption; if current PTHR12504
      PAINT has dropped GO:0008320 at the node, as the review reports from the snapshot, REMOVE agrees with PAINT.
      What is missing is the current PAINT state at PTN004364609, so this is closer to CANNOT_TELL and needs a curator;
      no fixed reading is given.
