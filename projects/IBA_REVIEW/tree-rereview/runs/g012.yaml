  - '"this GO_REF:0000033 row is now stale as a PAINT propagation". The tree extract lists no PAINT loss on the
    path to TOM22, so the dossier does not confirm that PAINT has withdrawn the term for this gene.'
  reason_replacement: 'Upstream go-annotation issue #6466 raised the concern that "tom40 is the channel, we don''t
    know the MF of tom22" and suggested removing this IBA propagation. The molecular-function contribution is nevertheless
    annotated to yeast Tom22 by SGD as an experimental IMP (PMID:10519552), and that claim is sound because (a)
    it carries the `contributes_to` qualifier, which indicates a subunit-level contribution to a complex-level activity,
    not a claim that Tom22 independently translocates substrate; (b) Tom22 is required for tight control of channel
    gating and the higher-order organisation that sustains import; and (c) the parallel human TOMM22 review reaches
    the same biological conclusion about the `contributes_to` semantics while still accepting its PTHR12504 IBA
    row. Tom40 should retain `enables GO:0008320` while Tom22 retains `contributes_to GO:0008320`. The review found
    that the PTHR12504 PAINT snapshot it consulted does not carry GO:0008320 at PTN004364609; the tree extract records
    no PAINT loss on the path, so this is not confirmed here, and staleness of the propagation record is in any
    case not evidence against the claim. Rows that share a term must carry consistent actions, so this row is kept
    in line with the accepted IMP row. In the PANTHER 19.0 tree TOM22 is itself the only seed of this row, 8 steps
    below the family-root node with no duplication on the path, so the IBA for yeast Tom22 rests on the gene''s
    own experimental annotation.'
  proposed_action: ACCEPT
  note: The original ground for REMOVE is that the cached GOA row is stale relative to current PAINT, which is neither
    a term-scope nor a qualifier reason and cannot be verified from the dossier (no loss on path, so PAINT_ALREADY_REMOVED
    does not apply). If a curator confirms the term is gone from current PAINT, the row will drop out of GOA on
    its own; REMOVE in the review conflicts with the ACCEPT on the IMP row for the same term. Separately, the term
    is placed at the family root 8 steps above its single seed, which is the propagation concern raised upstream
    and affects other family members more than TOM22 itself.
