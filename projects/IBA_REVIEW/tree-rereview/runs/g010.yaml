  reason_replacement: 'In fungi, G1/S control through SBF/MBF is a lineage-specific innovation. The DNA-binding
    subunits came from a viral KilA-N protein at the base of the fungal lineage, and no homologs exist outside fungi.
    Animals, nematodes included, run G1/S transcription through E2F/DP-Rb. The PTN000917496 IBD is placed deep enough
    to take in a sporadic metazoan chromodomain/ankyrin lineage that cannot form an MBF/SBF complex: there is no
    partner DNA-binding subunit, and CEC-10 lacks the KilA-N domain itself. Pairwise similarity between CEC-10 and
    the six yeast seeds is weak and confined to ankyrin or low-complexity stretches. No cell-cycle phenotype or
    expression pattern has been reported for cec-10. The process cannot be inherited from this node. The problem
    is node depth and lineage, not paralogy: in the PANTHER 19.0 tree the six seeds are orthologs across later duplications
    of cec-10, joining it at the Opisthokont speciation node itself with no duplication on the path from the node
    to cec-10; their common ancestor is a duplication node after Fungi before Dikarya, two steps below the PAINT
    node, cec-10 lies outside that clade, and the nearest seed shares 14% identity with it.'
  failure_modes_remove:
