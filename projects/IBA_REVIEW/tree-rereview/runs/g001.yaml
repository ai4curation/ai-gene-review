- gene: DANRE/fgf8a
  term: GO:0005737
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: SUPPORTS
  quote_sentences:
  - 1
  - 2
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree the term sits at the family root, a duplication node before Eumetazoa
    with 502 leaves and 38 subfamilies, and the 12 other seeds are all paralogs of fgf8a, including FGF1, FGF2,
    Fgf13 and Fgf14, which agrees with a family-wide transfer from differently localised paralogs; the gene is also
    itself a seed.
  note: The gene is itself a seed, which the review does not acknowledge; its propagation_review marks the node
    SUPPORTS_SOURCE_BUT_NOT_TARGET. The review has no experimental row on GO:0005737, so the self-seed is presumably
    an experimental row on a descendant term (possibly the lysosome observation from PMID:15498491 that the review
    discusses and discounts as not a site of activity); the dossier does not say which. The reason should state
    that fgf8a's own annotation is among the seeds and why it does not support activity in the cytoplasm.
  verifier:
    agrees: false
    problem: SUPPORTS overstates the agreement. The tree facts show fgf8a is itself a seed (self_seed=True, target_in_seed_clade=True),
      so the node's evidence includes fgf8a's own experimental annotation and is not only a transfer from paralogs.
      That is at odds with the propagation_review's SUPPORTS_SOURCE_BUT_NOT_TARGET, which treats the target as not
      a source. The entry's own note says the reason needs amending, which does not fit a SUPPORTS reading. The
      verdict actually rests on grounds the tree cannot settle (signal peptide, and lysosomes being the only direct
      evidence and not a site of activity), so NOT_A_TREE_ARGUMENT is the reading that fits; the same reader used
      it for the parallel PolG2 row. If the unacknowledged self-seed is counted as contradicted, it would be REASON_CONTRADICTED.
      Separately, tree_sentence appends "the gene is also itself a seed" without saying how it bears on the verdict,
      and "differently localised" is the review's claim, not a tree fact. The counts and seed names are accurate.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
