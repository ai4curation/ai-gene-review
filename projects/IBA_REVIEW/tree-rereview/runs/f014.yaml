  tree_sentence: In the PANTHER 19.0 tree PTN001139778 is an Archaea-Eukaryota node of 161 leaves, and the three
    seeds meet at the Eukaryota node PTN000567862 only 2 steps below it. SF13 and SF10 lie below the node with no
    seeds, so excluding them needs pruning rather than a lower node.
  note: The seed MRCA PTN000567862 itself covers SF10 and SF13 (see the GO:0160157 row), so moving the term down
    to the seeds' common ancestor would not exclude the PDH E2 subfamilies; NEEDS_PRUNING may describe the fix better
    than TOO_DEEP.
  verifier:
    agrees: false
    problem: 'The assessment says PTN001139778 is the parent of the whole eukaryotic E2 clade (161 leaves). The
      listing contradicts this. The node''s direct branches are a horizontal-transfer node of 160 leaves and a single
      leaf. The eukaryotic clade is PTN000567862, which has 159 leaves, not 161, and sits 2 steps below the node
      (summary sentence 3). So a tree statement in the assessment is contradicted, and NOT_A_TREE_ARGUMENT hides
      that. The verdict still stands on the assessment''s other ground: SF13 (3 leaves) and SF10 (6 leaves) lie
      below the node and hold no seeds. That makes the right reading REASON_CONTRADICTED, not NOT_A_TREE_ARGUMENT.
      The tree_sentence also overreaches when it says excluding them needs pruning rather than a lower node. That
      conclusion rests on PTN000567862 covering SF10 and SF13, which this row''s lines do not state; the note takes
      it from the GO:0160157 row. It also argues against the assessment''s own TOO_DEEP verdict instead of reporting
      what the tree shows.'
