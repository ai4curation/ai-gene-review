  tree_sentence: In the PANTHER 19.0 tree the node is the root of the SDHAF2 family and the single seed (1 of 1
    resolved) is a one-to-one ortholog of SDHAF2, so the term was not transferred from catalytic subunits and the
    over-annotation lies in the assembly-factor seed annotation itself.
  false_claims:
  - 'Review summary: ''This is an over-annotation transferred by IBA from the catalytic subunits''. Tree: the only
    seed is yeast SDH5 (SGD:S000005432), the SDH assembly factor 2 and a one-to-one ortholog of SDHAF2 in family
    PTHR12469; no catalytic SDH subunit is a seed or a member of this family.'
  reason_replacement: SDH (Complex II) is a TCA-cycle enzyme, but SDHAF2 is an assembly factor and does not itself
    carry out TCA-cycle chemistry; it acts upstream by enabling SDHA flavinylation and maturation rather than participating
    in the cycle. The IBA is not transferred from the catalytic subunits. In the PANTHER 19.0 tree the node is the
    root of the SDHAF2 family and its single seed is yeast SDH5, a one-to-one ortholog of SDHAF2 and itself the
    assembly factor, so the transfer is phylogenetically sound and the over-annotation lies in the yeast seed annotation,
    which conflates being required for a TCA-cycle enzyme with taking part in the cycle.
  note: 'ROLE_CONFLATION still fits, but root_cause PROPAGATION_BAD does not: the source is the one-to-one yeast
    ortholog, so the issue is the seed annotation, not the propagation. The review has no reason text; the contradicted
    claim is in the summary.'
  verifier:
    agrees: true
  outcome: applied
