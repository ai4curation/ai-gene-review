- gene: human/SDHAF2
  term: GO:0006121
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree the node is the root of the SDHAF2 family with 2 subfamilies, SDHAF2 is
    itself a seed and the other seed is a one-to-one ortholog, so the term was not propagated from catalytic SDH
    subunits and the over-annotation lies in the assembly-factor seed annotations themselves.
  false_claims:
  - 'Review summary: ''Over-annotation propagated by IBA from the catalytic SDH subunits in the shared PANTHER family''.
    Tree: the family is PTHR12469 (SDHAF2 / EMI5 homolog) and the 2 seeds are SDHAF2 itself (self seed) and yeast
    SDH5 (SGD:S000005432), a one-to-one ortholog and itself the assembly factor; no catalytic SDH subunit is among
    the seeds or in this family.'
  reason_replacement: This term describes the catalytic electron-transport activity of mature Complex II, not the
    function of an assembly factor. SDHAF2 is required for SDH assembly and activity but does not itself carry out
    succinate-to-ubiquinone electron transport; its role is captured by the Complex II assembly and protein-FAD
    linkage terms. The IBA is not propagated from the catalytic SDH subunits. In the PANTHER 19.0 tree the node
    is the root of the SDHAF2 family, and its seeds are SDHAF2 itself and yeast SDH5, a one-to-one ortholog, so
    the transfer is phylogenetically sound and the over-annotation lies in the seed annotations of the assembly
    factors, which conflate being required for Complex II with performing its electron transport.
  note: 'ROLE_CONFLATION still fits, but root_cause PROPAGATION_BAD does not: the transfer is from the gene itself
    and its one-to-one yeast ortholog, so the problem is at the source (seed annotations), not in propagation. The
    gene is a self seed, yet the review lists only an IEA row besides the IBA for this term; a curator should check
    which experimental annotation on SDHAF2 seeds the node and that it is reviewed consistently. The review has
    no reason text; the contradicted claim is in the summary.'
  verifier:
    agrees: true
  outcome: applied
