- gene: human/SPINK5
  term: GO:0030154
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: SUPPORTS
  quote_sentences:
  - 1
  - 2
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree the node is a duplication node before Eumetazoa spanning 14 subfamilies,
    SPINK5 lies 13 steps below it across 2 duplications, and besides SPINK5 itself the seeds are 2 orthologs across
    later duplications and 3 paralogs, which agrees with the reading that the term was placed above divergent follistatin-like
    lineages.
  note: SPINK5 is itself a seed, and the review has no separate experimental row on GO:0030154; it dismisses its
    own evidence as expression as a differentiation marker. A curator should find which SPINK5 experimental annotation
    seeds the node and check that its verdict matches. The two Drosophila seeds (orthologs across later duplications,
    3 duplications between) are not discussed by the review, and 1 of 7 seeds did not resolve to the tree.
  verifier:
    agrees: false
    problem: 'SUPPORTS over-reads the tree. The follistatin seeds are indeed paralogs joining at the node, but the
      tree does not show the function confined to lineages SPINK5 lies outside: the seeds sit in 3 of the 3 branches
      below the node (so the node is their common ancestor, not placed above its evidence), SPINK5 is itself a seed,
      and 2 further seeds (the Drosophila orthologs across later duplications) share SPINK5''s own branch. The verdict
      therefore depends on grounds the tree cannot settle - the absence of activin binding and the review''s dismissal
      of SPINK5''s own evidence as marker expression - which is the self-seed case the definitions assign to NOT_A_TREE_ARGUMENT.
      The sentence''s conclusion that the tree agrees the term was placed above divergent follistatin lineages claims
      more than the tree shows, and the quotes omit sentence 4, which carries the branch distribution.'
    fixed:
      tree_reading: NOT_A_TREE_ARGUMENT
      quote_sentences:
      - 1
      - 4
      - 5
      - 6
      tree_sentence: In the PANTHER 19.0 tree the seeds sit in 3 of the 3 branches below a duplication node before
        Eumetazoa, and besides SPINK5 itself they are 2 orthologs across later duplications and 3 paralogs. The
        verdict rests on missing activin binding and on how the SPINK5 evidence is read, not on placement.
  outcome: applied
  outcome_detail: applied as corrected by the verifier
