  - 5
  - 6
  - 7
  tree_sentence: In the PANTHER 19.0 tree the node is a speciation node at Eubacteria and CDK5RAP1 is 19 steps below
    it across 0 duplications and 1 horizontal-transfer node. CDK5RAP1 is itself a seed and the other seed, E. coli
    MiaB, is a one-to-one ortholog at 39% identity, not a paralog.
  false_claims:
  - The propagation_review says of E. coli MiaB (P0AEI1) that its location does not transfer to a mitochondrial
    paralog. By the tree P0AEI1 is a one-to-one ortholog of CDK5RAP1, joined at a speciation node at Eubacteria
    with 0 duplications on the path (1 horizontal-transfer node).
  - 'The summary says the cytosol inference is seeded by E. coli MiaB. The tree shows 2 seeds: E. coli MiaB and
    human CDK5RAP1 itself, whose own experimental annotation is among the evidence for the node (the review does
    acknowledge this in its source list).'
  reason_replacement: Cytosol is the ancestral compartment for bacterial MiaB, but the vertebrate CDK5RAP1 clade
    gained a mitochondrial transit peptide and acts on mitochondrial tRNAs (PMID:25738458, PMID:28981754). The cytosolic
    signal for human CDK5RAP1 comes from an MTS-less variant whose activity outside mitochondria was refuted. The
    deep-node assertion does not fit this lineage. In the PANTHER 19.0 tree the node is a speciation node at Eubacteria,
    19 steps above CDK5RAP1 across 0 duplications and 1 horizontal-transfer node; the seeds are human CDK5RAP1 itself
    and E. coli MiaB, which is a one-to-one ortholog of CDK5RAP1 at 39% identity and not a paralog. The objection
    is therefore to carrying a bacterial compartment across the acquisition of mitochondrial targeting in the eukaryotic
    lineage, not to a paralog transfer.
  failure_modes_add:
  - LINEAGE_OR_TAXON_MISMATCH
  note: The paralog wording is in the propagation_review source note for UniProtKB:P0AEI1, not in review.reason;
    that note should be reworded to ortholog. The IDA row on the same term (PMID:22422838) carries the same action.
  verifier:
    agrees: false
    problem: 'The reading REASON_CONTRADICTED and the first false claim hold: the propagation_review note calls
      CDK5RAP1 a mitochondrial paralog of E. coli MiaB, while the tree has P0AEI1 as a one-to-one ortholog with
      0 duplications. The second false claim is not one. The summary says the row is seeded by E. coli MiaB but
      does not say it is the only seed, and the review lists UniProtKB:Q96SZ6 as a source and discusses the human
      cytosol IDA, as the entry itself concedes. It should be dropped from false_claims. The reason_replacement
      also says the mitochondrial targeting was acquired in the eukaryotic lineage, where the review says the vertebrate
      CDK5RAP1 clade gained the transit peptide; the dossier does not support the wider wording. The contradicted
      paralog wording is in the propagation_review source note, not in review.reason, so the replacement reason
      does not remove it. Adding LINEAGE_OR_TAXON_MISMATCH is not required by the tree facts; the existing COMPARTMENT_OR_COMPLEX_MISMATCH
      already covers the argument.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
