- family: PTHR45971
  node: PANTHER:PTN002915557
  term: GO:1901981
  negated: false
  kind: node
  action: TOO_DEEP
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree PTN002915557 is a Eukaryota speciation node one level below the family
    root, not the root itself, and the single Pacer seed sits 17 steps below it, so the term is placed far above
    its only evidence.
  false_claims:
  - Placing it at the family root -- the listing gives PTN002915557 as a speciation node at Eukaryota at depth 1,
    not the family root.
  reason_replacement: The only seed is vertebrate Pacer, from lipid-binding data in the discovery paper, and the
    binding region is not mapped. Rubicon-lineage members have no lipid-binding evidence. Rubicon-EGFP was not pulled
    down by PtdIns(3)P beads, and the Rubicon RH structure shows a FYVE-like zinc cluster without the basic residues
    needed for PI(3)P recognition. Pacer is described as a vertebrate-specific innovation, so lipid binding is best
    read as a Pacer-lineage property. Placing it at the Eukaryota node PTN002915557, one level below the family
    root, makes Rubicon, fly Rubicon and worm RUB-1 inherit it without support. All four Rubicon-lineage reviews
    mark the IBA as over-annotated, and the Pacer reviews refine it to PI3P binding. In the PANTHER 19.0 tree the
    single Pacer seed sits 17 steps below this node, so the term is placed far above its only evidence.
  verifier:
    agrees: true
  outcome: applied
