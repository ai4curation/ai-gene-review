  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree PTN002371879 is a duplication node before Eumetazoa with 415 leaves at
    depth 4, and the seeds sit in 4 of its 9 branches so it is their common ancestor; all seven named subfamilies
    descend from it and hold no seed, which supports pruning them.
  false_claims:
  - PTN002371879 is the Eumetazoa duplication node just below the root of the PTHR24044 tree; the listing places
    it at depth 4, a duplication after Metazoa-Choanoflagellida and before Eumetazoa, not directly below the root.
  reason_replacement: 'PTN002371879 is a duplication node after Metazoa-Choanoflagellida and before Eumetazoa, at
    depth 4 in the PTHR24044 tree (PANTHER treeinfo API, version 19); it spans 415 of the 426 leaves, i.e. essentially
    the whole family. PAINT records no taxon for the row. Seeds come from four of the five major clades beneath
    it -- Delta/Jagged (PTN009076542), DNER (PTN009076572), NOTCH2NL/Weary (PTN009076580) and NOTCH4 (PTN009076609)
    -- so placing the term at their common ancestor is the parsimonious PAINT choice, and the node is not simply
    too deep. But the term then descends to groups with no evidence and different functions: SNED1 (SF411), attractin-like
    1 (SF487), Drosophila Crumbs (SF506), DLK2 (SF423) and the uncharacterised nematode EGF proteins. It also descends
    to receptors (NOTCH4, LIN-12), for which Notch binding means a receptor-receptor interaction, not a ligand activity.
    The node is therefore NOT a ligand-specific anchor: a module that needs a Delta/Jagged ancestry anchor should
    cite the Delta clade PTN001170801 (with the LIN-12 caveat) or the unannotated DSL clade PTN009076542, not this
    node. This node is absent from the PTHR45836 tree; its rows in PTHR45836-paint.tsv and PTHR24049-paint.tsv come
    from InterPro''s HMM classification of some descendants (NOTCH4, DLL1) into those families. In the PANTHER 19.0
    tree the seeds sit in 4 of the node''s 9 branches, so it is their common ancestor, and all seven named subfamilies
    descend from it and hold no seed, which supports pruning them.'
  verifier:
    agrees: true
  outcome: applied
