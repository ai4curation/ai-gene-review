- family: PTHR24103
  node: PANTHER:PTN007774218
  term: GO:0061630
  negated: false
  kind: node
  action: NEEDS_PRUNING
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree PTN007774218 is a duplication node after Bilateria with 964 leaves, not
    the family root, and the 32 seeds sit in 2 of its 3 branches; all six named subfamilies descend from it and
    hold no seed, which supports pruning them.
  false_claims:
  - Placing RING E3 activity at the root of the TRIM tree; the listing shows PTN007774218 is a duplication node
    after Bilateria and before Chordata at depth 4, not the family root.
  reason_replacement: 'Placing RING E3 activity at PTN007774218, the duplication node after Bilateria and before
    Chordata that holds 964 of the family''s 994 leaves, is defensible. The 32 seeds (12 mouse, 20 human) include
    many members with independent in vitro evidence (TRIM21, TRIM27, TRIM11, TRIM26, TRIM62), and the family-wide
    screen detected activity for most RING-containing members. The node is too inclusive, however, and GOA shows
    the IBA reaching proteins with no RING domain at all: TRIM14, TRIM44, pyrin/MEFV, TRIML2 and BSPRY. None of
    these has experimental ligase evidence, and none matches the C3HC4 RING consensus (site ring_c3hc4). Each needs
    an IRD/NOT at its own clade. TRIM51 also inherits the term despite direct evidence that it is a pseudoligase,
    and it has no experimental ligase annotation of its own. Three seeds, TRIM6, TRIM15 and TRIM22, were later characterised
    as pseudoligases (PMID:40216791). Their experimental annotations come from earlier cell-based studies, so the
    conflict between those annotations and the in vitro result should be resolved by gene-level curators. They are
    not listed for pruning here. The assertion does not depend on these three seeds. In the PANTHER 19.0 tree the
    32 seeds sit in 2 of the node''s 3 branches, so it is their common ancestor, and all six named subfamilies descend
    from it and hold no seed, which supports pruning them.'
  verifier:
    agrees: false
    problem: 'The reading REASON_CONTRADICTED is right: the listing puts the node at depth 4, so it is not the family
      root. The false claim and the reason_replacement are also sound. But the tree_sentence count of 32 seeds comes
      only from the listing summary sentence [2] (Seeds: 32 of 32 resolved), because the tree lines list just 20
      seeds. quote_sentences is [1,3] and leaves out sentence 2, so it should be [1,2,3].'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
