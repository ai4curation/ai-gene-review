  - 'The reason implies that PNK-4, not PNK-1, is the C. elegans counterpart of PANK4: by the tree pnk-1 sits in
    PTHR12280:SF20 as a one-to-one ortholog of human PANK4 through the kinase-like domain.'
  reason_replacement: The 4'-phosphopantetheine phosphatase activity of PANK4 resides in its C-terminal DUF89 phosphatase
    domain, fused to the kinase-like domain. PNK-1 is 449 residues and aligns with human PANK4 only over PANK4 residues
