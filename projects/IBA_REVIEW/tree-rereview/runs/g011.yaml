- gene: yeast/HDA1
  term: GO:0005737
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - paralog_claim_without_duplication
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 4
  - 5
  tree_sentence: In the PANTHER 19.0 tree the 19 seeds are orthologs across later duplications of HDA1 and sit in
    2 of the 2 branches below the node, with 0 duplications on the path to HDA1, so the placement is sound and no
    paralog transfer is involved; the qualifier objection is not a tree question.
  false_claims:
  - 'Failure mode WRONG_ORTHOLOG_OR_PARALOG: all 19 seeds are orthologs of HDA1 (across later duplications), they
    bracket the node from both of its branches, and there are 0 duplications on the path from the PAINT node to
    HDA1. The label also conflicts with the review''s own text, which calls the donors orthologs and the node placement
    considered.'
  reason_replacement: 'The compartment itself is plausible and the IBA-overturn bar is not met, so the term is retained
    rather than removed: there is no HDA1-specific evidence of divergence from, or loss of, the ancestral shuttling
    capacity of this subfamily, and absence of a positive cytoplasmic localization study for HDA1 is not evidence
    against one. What is not established is the is_active_in qualifier, which asserts that HDA1 executes its molecular
    function in the cytoplasm, not merely that it can be present there. The cytoplasmic activity that anchors this
    node in the donors is HDAC6 alpha-tubulin deacetylation, executed by a class IIb-specific architecture (tandem
    catalytic domains plus a ZnF-UBP domain) that HDA1 does not possess, while class IIa shuttling is governed by
    14-3-3-binding phosphosites that are likewise not an evident HDA1 feature. HDA1''s only established molecular
    function, histone deacetylation as the catalytic subunit of the nuclear HDA1 complex with HDA2 and HDA3, is
    chromatin-associated and therefore nuclear. The falcon deep-research synthesis independently judged the cytoplasm
    call weak or incorrect for HDA1 itself, noting that the cytosolic relocalization under hypoxia was reported
    for the partners HDA2/HDA3 rather than for HDA1. MARK_AS_OVER_ANNOTATED keeps the compartment while flagging
    the activity claim as unsupported; a located_in qualifier would be the accurate form of this annotation. This
    is a qualifier objection and not a wrong-ortholog or paralog transfer: in the PANTHER 19.0 tree all 19 seeds
    are orthologs of HDA1 across later duplications, they sit in both branches below the Eukaryota node, and no
    duplication lies on the path from the node to HDA1.'
  failure_modes_add:
  - COMPARTMENT_OR_COMPLEX_MISMATCH
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: Only the failure-mode label is contradicted; the prose of the reason is unchanged and consistent with the
    tree.
  verifier:
    agrees: false
    problem: 'The only false claim is the WRONG_ORTHOLOG_OR_PARALOG label, and the tree does not contradict it under
      the reading rule: a paralog claim is contradicted only by ortholog seeds with no duplication between them,
      whereas all 19 seeds are orthologs across later duplications (one_to_one_orthologs=0; the nearest has 1 duplication
      between, the others shown 1 or 2). The reader left the same configuration uncontradicted for NCL1. The review''s
      argument that the donors'' cytoplasmic activity rests on class IIb and IIa specific features is compatible
      with diverged co-orthologs. That the label conflicts with the review''s own text (donors called orthologs,
      node source SUPPORTS_TRANSFER, root cause TERM_SCOPING_PROBLEM) is an internal inconsistency for a note, not
      a tree contradiction. Everything the review says about placement and seeds (19 donors, orthologs, considered
      node placement) agrees with the tree, and the verdict rests on the is_active_in qualifier, so the reading
      is NOT_A_TREE_ARGUMENT and no reason replacement or failure-mode change is warranted by the tree. The tree_sentence
      facts themselves are correct.'
    fixed:
      tree_reading: NOT_A_TREE_ARGUMENT
      quote_sentences:
      - 1
      - 2
      - 4
      - 5
      tree_sentence: In the PANTHER 19.0 tree the 19 seeds are orthologs across later duplications of HDA1 and sit
        in 2 of the 2 branches below the Eukaryota speciation node, with 0 duplications on the path to HDA1, so
        the seeds bracket the node as the review accepts. The objection is to the is_active_in qualifier, which
        the tree cannot settle.
  outcome: applied
  outcome_detail: applied as corrected by the verifier
