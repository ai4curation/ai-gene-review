- gene: DROME/rgn
  term: GO:0005802
  negated: false
  kind: overruled
  action: REMOVE
  flags:
  - paralog_claim_without_duplication
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 4
  - 5
  tree_sentence: In the PANTHER 19.0 tree all 4 seeds are orthologs of rgn (2 one-to-one) with no duplication on
    the path, at 11 to 13% identity. Their common ancestor is a Euarchontoglires node 10 steps below the PAINT node
    and rgn is outside that clade, so the term was placed far above its mammalian evidence.
  false_claims:
  - 'propagation_review failure mode WRONG_ORTHOLOG_OR_PARALOG: by the tree the seeds are 2 one-to-one orthologs
    and 2 orthologs across later duplications of rgn, joining it at a Bilateria speciation node, with 0 duplications
    on the path from the PAINT node to rgn.'
  reason_replacement: PANTHER:PTN000575073 is the single annotated node of PTHR23211 and its IBD for trans-Golgi
    network is seeded by vertebrate TGN38/TGOLN2 proteins, which are type I membrane proteins whose trans-Golgi
    residence and recycling depend on a single transmembrane segment and the cytoplasmic YQRL tyrosine sorting motif.
    Although M9PFV8 is classified in the same PANTHER subfamily (PTHR23211:SF0), it has no transmembrane segment
    and no C-terminal tyrosine motif (the UniProt record carries no transmembrane feature; our hydropathy scan found
    none after the signal peptide), and its domain architecture (signal peptide, C-type lectin-like domain, charged
    disordered tail) is unlike TGN38. Local alignment of Rgn to the TGOLN2 and TGN38 seeds is confined to the compositionally
    biased disordered region and is not distinguishable from composition-matched shuffled controls, whereas Rgn's
    lectin-like domain aligns clearly to PTHR22803 C-type lectins. The target therefore lacks the determinants of
    the propagated compartment, and no experiment places Rgn in the trans-Golgi network. Transit of a signal-peptide
    protein through the Golgi would not justify an is_active_in assertion. In the PANTHER 19.0 tree the seeds are
    not paralogs of rgn; all 4 are placed as orthologs (2 one-to-one) with no duplication on the path, but at only
    11 to 13% identity in the family alignment, and their common ancestor is a Euarchontoglires node 10 steps below
    the PAINT node with rgn outside that clade, so the term was propagated from mammalian evidence to a Eukaryota-level
    node.
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: The review in effect disputes PANTHER's placement of rgn in the TGN38 family (lectin domain, no similarity
    above shuffles); the tree as given calls the seeds orthologs, so the dispute should be stated explicitly as
    a disagreement with the tree. The depth of the node above the seeds is an additional tree-based ground the review
    does not use.
  verifier:
    agrees: false
    problem: 'Quotes only: tree_sentence relies on "11 to 13% identity", but quote_sentences [1,2,4,5] carry no
      identity figure. Sentence [6] gives the 13% for the nearest seed, and the 11 and 12% values appear only in
      the seed list. Add [6], or rest the sentence on the 13% of the nearest seed. The reading, false claim, reason_replacement
      and the other facts (4 orthologs, 2 one-to-one, 0 duplications on the path, seed ancestor at Euarchontoglires
      10 steps below the node, rgn outside that clade) check out.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
- gene: DROME/rgn
  term: GO:0030140
  negated: false
