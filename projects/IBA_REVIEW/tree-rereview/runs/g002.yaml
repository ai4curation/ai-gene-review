  - 5
  tree_sentence: In the PANTHER 19.0 tree the single seed, mouse Tgoln2, is an ortholog of rgn across later duplications
    at 12% identity, with no duplication on the path from the node to rgn. The seed leaf is 13 steps below the PAINT
    node, so the term was placed far above its one mouse annotation.
  false_claims:
  - 'propagation_review failure mode WRONG_ORTHOLOG_OR_PARALOG: by the tree the single seed MGI:105079 is an ortholog
    across later duplications of rgn, joining it at a Bilateria speciation node, with 0 duplications on the path
    from the PAINT node to rgn.'
  reason_replacement: The same node (PANTHER:PTN000575073) propagates trans-Golgi network transport vesicle localization
    seeded by mouse TGN38 (MGI:105079). That localization reflects TGN38 cycling between the trans-Golgi network
    and the plasma membrane as an integral membrane protein, driven by its cytoplasmic tyrosine motif. Rgn has no
    transmembrane segment and no tyrosine sorting motif, its architecture is a signal peptide plus C-type lectin-like
    domain plus charged disordered tail, and no sequence conservation with the seeds was detected above shuffled
    controls. No experiment places Rgn in TGN-derived vesicles. In the PANTHER 19.0 tree the seed is not a paralog
    of rgn; it is placed as an ortholog across later duplications with no duplication on the path to rgn, but at
    only 12% identity in the family alignment, and the single seed leaf lies 13 steps below the Eukaryota-level
    PAINT node, so the term was propagated from one mouse annotation to a much deeper node.
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: Same situation as the GO:0005802 row; the disagreement with PANTHER's family placement should be stated
    explicitly.
  verifier:
    agrees: false
    problem: '(1) Reading: the only seed, MGI:105079, is an "ORTHOLOG across later duplications" with 1 duplication
      between it and rgn (one_to_one_orthologs=0). Under the stated rule a paralog claim is contradicted only by
      ortholog seeds with no duplication between them and the gene, so WRONG_ORTHOLOG_OR_PARALOG is not shown to
      be contradicted on this row. That differs from the GO:0005802 row, which has 2 one-to-one seeds. The zero
      duplications cited are on the node-to-gene path, not between seed and gene. By the definitions this row is
      NOT_A_TREE_ARGUMENT (missing transmembrane segment and sorting motif), with the ortholog placement and node
      depth in note, and failure_modes_remove is then not justified. (2) Quotes: tree_sentence states "mouse" and
      "12% identity", which are only in sentence [6]; quote_sentences [1,2,4,5] omit it.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
