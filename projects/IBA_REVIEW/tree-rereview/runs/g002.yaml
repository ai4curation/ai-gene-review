- gene: DROME/mam
  term: GO:0000775
  negated: false
  kind: overruled
  action: REMOVE
  flags:
  - paralog_claim_without_duplication
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree both seeds are orthologs of mam with no duplication on the path, fission
    yeast mis18 being a one-to-one ortholog in the same subfamily. The alignment to mis18 covers only 10% of mam
    at 8% identity, so the verdict rests on the missing Mis18 domain and on disputing the placement, not on paralogy.
  false_claims:
  - 'propagation_review failure mode WRONG_ORTHOLOG_OR_PARALOG (the seeds are the wrong orthologs or paralogs of
    mam): by the tree the two seeds are 1 one-to-one ortholog and 1 ortholog across later duplications of mam, with
    0 duplications on the path from the node to mam and mam inside the seed clade.'
  reason_replacement: PTHR16431 places Drosophila Mastermind in the same family as the Mis18 CENP-A licensing proteins
    (fission yeast mis18, human MIS18A and OIP5/Mis18-beta). The centromeric IBD is seeded only by Mis18 proteins.
    Drosophila Mam is a MamL-1 domain Notch coactivator with no Mis18 domain and no evidence of centromere association;
    Drosophila CENP-A (CID) deposition is instead attributed to CAL1. The annotation is therefore treated as a family-assignment
    artefact, not an inherited function. In the PANTHER 19.0 tree this is not a paralog transfer, since both seeds
    are orthologs of mam with no duplication on the path and fission yeast mis18 is placed as a one-to-one ortholog
    in the same subfamily (PTHR16431:SF1); the objection is to that placement itself, because the family alignment
    between mam and mis18 covers only 10% of mam at 8% identity, and the node sits 2 steps above the common ancestor
    of the seeds.
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: The review disputes PANTHER's placement of mam in the Mis18 family; that is an argument with the tree and
    should be made explicitly (domain evidence), since the tree as given calls mam a one-to-one ortholog of mis18.
    FUNCTIONAL_DIVERGENCE remains as the failure mode.
  verifier:
    agrees: true
  outcome: applied
