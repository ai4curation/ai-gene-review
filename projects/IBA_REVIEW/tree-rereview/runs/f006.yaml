- family: PTHR12080
  node: PANTHER:PTN008532944
  term: GO:0030101
  negated: false
  kind: node
  action: NEEDS_PRUNING
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  tree_sentence: In the PANTHER 19.0 tree the node is a Euteleostomi speciation node with 42 leaves in 19 species
    and 3 subfamilies, so it covers more than human, mouse and rat CD2 and CD48. The pruning rests on the rodent
    signalling data, not on the tree.
  false_claims:
  - The node's descendants are CD2 and CD48 in human, mouse and rat; the listing shows the node has 42 leaves in
    19 species and 3 subfamilies, including SF125 CD48 ANTIGEN-LIKE.
  reason_replacement: The node's descendants include CD2, CD48 and CD48-like proteins, among them human, mouse and
    rat CD2 and CD48. The term is right for human CD48, the ligand that triggers activating 2B4 signalling on human
    NK cells, and for CD2 as an NK-cell receptor. It is wrong for mouse Cd48. In mouse, 2B4 ligation by CD48 inhibits
    NK lysis (PMID:15123744), and deleting the Slam locus, including Cd48, enhances NK activation, with the inhibition
    mapping to 2B4 (PMID:27573813). The positive term should therefore not descend to rodent Cd48. Mouse Cd48 is
    re-annotated to regulation of natural killer cell activation, plus negative regulation of NK cell mediated cytotoxicity.
    Rat is left unresolved because no rat data exist. The divergence lies in rodent 2B4 signalling rather than in
    CD48 itself, so this is a lineage-specific sign inversion and not a loss of binding. No affected_subfamilies
    entry is given, because the pruning is rodent-specific within SF134 and human CD48 correctly keeps the term.
    In the PANTHER 19.0 tree the node is a Euteleostomi speciation node with 42 leaves in 19 species and 3 subfamilies.
  verifier:
    agrees: true
  outcome: applied
- family: PTHR12080
  node: PANTHER:PTN000249437
  term: GO:0038023
  negated: false
  kind: node
  action: NEEDS_PRUNING
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree the node is not the family root but a duplication node after Deuterostomia
    before Euteleostomi with 353 leaves, and the 3 seeds sit in 2 of its 6 branches, so the node is their common
    ancestor. The PSG/CEACAM argument rests on GOA and function.
  false_claims:
  - in GOA the root node also delivers this IBA; the listing shows PTN000249437 is a duplication node at depth 5,
    not the family root (the root is PTN008989435).
  reason_replacement: Signaling receptor activity is correct for the SLAM-related receptors and CD2. PAINT already
    prunes it from the CD48 and VSTM5 clades with NOT annotations. However, in GOA this node, a duplication node
    after Deuterostomia before Euteleostomi, also delivers this IBA to 27 rodent PSG/CEACAM proteins and human CEACAM21,
    which UniProt now classifies in PTHR44427 (see PTHR12080-iba-descendants.tsv). Pregnancy-specific glycoproteins
    are secreted, so a signaling receptor annotation is not appropriate for them. Those proteins should be re-rooted
    in their own family tree rather than inherit SLAM-family terms. CD58 does not receive this IBA in GOA, which
    is consistent with its ligand role. In the PANTHER 19.0 tree the node has 353 leaves in 20 species and the 3
    seeds sit in 2 of its 6 branches, so the node is their common ancestor.
  verifier:
    agrees: true
  outcome: applied
