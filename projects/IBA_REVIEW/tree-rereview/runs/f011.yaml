- family: PTHR31814
  node: PANTHER:PTN000781523
  term: GO:0005777
  negated: false
  kind: node
  action: NEEDS_PRUNING
  tree_reading: VERDICT_UNSUPPORTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree this Eukaryota node holds 76 leaves, and its single seed, Arabidopsis
    PMK, sits 16 steps below in SF2, which holds 71 of the node's leaves. Pruning SF2 would remove the seed's own
    subfamily, so the placement problem is depth, not a clade to exclude.
  false_claims:
  - SF2 is named as the subfamily to prune from a placement that otherwise holds; SF2 holds 71 of the node's 76
    leaves and the only seed, Arabidopsis PMK.
  proposed_action: TOO_DEEP
  note: The supporting quote from the ERG8 review calls PTN000781523 a plant sub-node; the listing shows a Eukaryota
    speciation node with Unikont and Bikont branches.
  verifier:
    agrees: false
    problem: 'The false claim is real: SF2, the named affected subfamily, holds 71 of the node''s 76 leaves and
      the only seed. But VERDICT_UNSUPPORTED is the wrong reading. The assessment rests on its own functional ground,
      that the fungal mevalonate pathway enzymes are cytosolic, and the tree does not contradict that. A NEEDS_PRUNING
      verdict also still fits the tree, because the Unikonts branch (PTN000781524, 18 leaves) holds no seed while
      the seed, Arabidopsis PMK, is a bikont. The right reading is REASON_CONTRADICTED, with a replacement that
      drops SF2 as the clade to prune. The sentence''s claim that the problem is depth, not a clade to exclude,
      and the proposed switch to TOO_DEEP go beyond what the row shows. The tree supports a depth problem and a
      seedless clade equally.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
