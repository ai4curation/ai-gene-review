- gene: human/NDUFA9
  term: GO:0006744
  negated: false
  kind: overruled
  action: REMOVE
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 4
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree the seeds are 2 paralogs of NDUFA9, their common ancestor is an Ascomycota
    node 6 steps below the family root where the term was placed, and NDUFA9 is outside that clade, so the term
    reached NDUFA9 from too deep a node across 2 duplications.
  false_claims:
  - Propagation_review describes PomBase:SPCC1840.09 as a 'Fission yeast Complex I-related family member' whose
    term 'conflates acting on ubiquinone with synthesizing it', and the summary says the propagation 'likely conflated
    acts on ubiquinone with makes ubiquinone' - the two seeds are S. pombe coq11 (ubiquinone biosynthesis protein)
    and S. cerevisiae COQ11, in subfamily SF16, paralogs of NDUFA9 joined at a pre-eukaryotic duplication with 22%
    identity; the term is not a conflation at the source but a transfer from a paralogous subfamily via the family
    root.
  reason_replacement: 'Biologically wrong process for NDUFA9. NDUFA9/Complex I reduces ubiquinone as part of electron
    transport (GO:0006120), and does not participate in ubiquinone biosynthesis. No literature supports a biosynthetic
    role. The seeds are not Complex I subunits whose annotation confuses using ubiquinone with making it: in the
    PANTHER 19.0 tree both seeds are fungal COQ11 proteins of a different subfamily that are paralogs of NDUFA9
    (22% identity), their common ancestor is an Ascomycota node 6 steps below the LUCA family root where the term
    was placed, and NDUFA9 lies outside that clade, 23 steps below the root across 2 duplications and 1 horizontal-transfer
    node. The term was therefore propagated from too deep a node into a paralogous subfamily.'
  failure_modes_add:
  - WRONG_ORTHOLOG_OR_PARALOG
  failure_modes_remove:
  - ROLE_CONFLATION
  note: The tree strongly supports the REMOVE; only the stated mechanism of the error is wrong. The root_cause TERM_SCOPING_PROBLEM
    would be better as a propagation problem (node placed too deep).
  verifier:
    agrees: true
  outcome: applied
