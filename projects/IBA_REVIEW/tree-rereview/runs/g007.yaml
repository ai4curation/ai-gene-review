- gene: human/MTIF2
  term: GO:0005737
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 4
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree MTIF2 is itself a seed and the other seeds are 4 one-to-one orthologs,
    1 ortholog across later duplications and 8 paralogs, 12 of them in MTIF2's own branch below the family root,
    so the term does not rest only on cytosolic and bacterial members.
  false_claims:
  - '''The is_active_in cytoplasm assertion reflects the cytosolic and bacterial members of the broad family node''
    - MTIF2 is itself a seed and 4 other seeds are one-to-one orthologs in the mitochondrial IF-2 subfamily (bovine
    MTIF2 at 87% identity, S. pombe mti2, yeast IFM1, a P. falciparum protein); 12 of the other seeds share MTIF2''s
    own branch below the root.'
  reason_replacement: 'Mitochondria are formally part of the cytoplasm in GO, so the statement is not false, but
    mtIF2 is confined to mitochondria. The is_active_in cytoplasm assertion sits at the root of the broad IF-2/eIF5B
    family and is uninformative for the mitochondrial subfamily, which separately carries the correct mitochondrion
    IBA. It does not reflect only the cytosolic and bacterial members: in the PANTHER 19.0 tree MTIF2 is itself
    a seed and the other seeds are 4 one-to-one orthologs, 1 ortholog across later duplications (E. coli infB) and
    8 paralogs, 12 of them in MTIF2''s own branch below the family root, so the mitochondrial subfamily''s own evidence
    is part of what supports the node and the objection is to the breadth of the term only.'
  note: The self and ortholog seeds presumably carry mitochondrial (descendant) terms. The corrected reason is a
    pure granularity argument (true but uninformative), which under CLAUDE.md is MODIFY or TOO_GENERAL rather than
    MARK_AS_OVER_ANNOTATED; COMPARTMENT_OR_COMPLEX_MISMATCH is doubtful once the mitochondrial seeds are recognised,
    GRANULARITY_MISMATCH stays.
  verifier:
    agrees: false
    problem: 'The false claim is not really made by the review. The review says the cytoplasm assertion ''reflects
      the cytosolic and bacterial members of the broad family node''; it does not say the term rests only on them,
      and the reader had to add ''only'' (in false_claims, tree_sentence and reason_replacement) to obtain a contradiction.
      The tree facts fit what the review does say: the node is the LUCA family root over 11 subfamilies, bacterial
      E. coli infB is among the seeds, and 8 further seeds are paralogs. The propagation_review shows the intended
      meaning, ''cytoplasm fits those members, but for the mitochondrial IF-2 subfamily it only restates mit...'',
      which concedes that the mitochondrial subfamily''s own location lies under the term and does not deny that
      MTIF2 and its orthologs contribute. The stated ground is granularity (''not false'', ''uninformative'', GRANULARITY_MISMATCH),
      an objection to the term and not to the transfer, with the gene itself a seed and no same-term row kept. That
      is NOT_A_TREE_ARGUMENT, and no reason rewrite is warranted. Also, the tree_sentence uses ''12 of them in MTIF2''s
      own branch'' as if it showed non-cytosolic seeds; sharing one of the two root branches says nothing about
      compartment.'
    fixed:
      tree_reading: NOT_A_TREE_ARGUMENT
      quote_sentences:
      - 1
      - 5
      - 6
      tree_sentence: In the PANTHER 19.0 tree the node is the family root, MTIF2 is itself a seed and the other
        seeds are 4 one-to-one orthologs, 1 ortholog across later duplications and 8 paralogs. MTIF2 and its orthologs
        thus contribute evidence alongside the other family members, and the verdict rests on the breadth of the
        term, which the tree cannot settle.
  outcome: applied
  outcome_detail: applied as corrected by the verifier
