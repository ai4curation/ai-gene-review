- gene: human/MEFV
  term: GO:0010468
  negated: false
  kind: overruled
  action: MARK_AS_OVER_ANNOTATED
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 5
  - 6
  - 7
  tree_sentence: In the PANTHER 19.0 tree MEFV is itself a seed and the other seeds are 1 one-to-one ortholog and
    7 paralogs, so the term is not only a transfer from other TRIM proteins and experimental annotation on pyrin
    itself is among the evidence for the node.
  false_claims:
  - '''This generic term is a TRIM-family phylogenetic over-propagation'' - the seeds include MEFV itself and the
    mouse Mefv one-to-one ortholog (53% identity) alongside 7 TRIM paralogs, so the term is not solely propagated
    from other TRIM family members.'
  - '''there is no specific experimental evidence that pyrin regulates gene expression'' - the tree records MEFV
    as a seed, meaning its own experimental annotation is among the evidence for the node.'
  reason_replacement: This generic term is propagated from a TRIM-family node, but not only from paralogs. Pyrin's
    characterized roles are post-translational (caspase-1 activation, autophagic degradation of inflammasome components),
    and the broad term regulation of gene expression overstates them. In the PANTHER 19.0 tree MEFV is itself a
    seed and the other seeds are 1 one-to-one ortholog (mouse Mefv) and 7 paralogs, so experimental annotation on
    pyrin and its mouse ortholog is among the evidence for the node; the verdict therefore rests on the scope of
    the term and on which MEFV annotation seeds it, not on an absence of evidence or on a paralog-only transfer.
  note: The review has no experimental row on GO:0010468 itself, so the self-seed annotation is presumably to a
    descendant term carried by MEFV; a curator should identify it and check that the action on that row is consistent
    with this one. No propagation_review on this row.
  verifier:
    agrees: false
    problem: The reading REASON_CONTRADICTED and the tree_sentence hold, but the corrections do not. (1) reason_replacement
      ends by saying the verdict rests 'on which MEFV annotation seeds it'. The review states no such ground and
      the dossier does not identify the seeding annotation (no same-term row is listed), so this adds an unresolved
      question to the reason as if it were an argument; it belongs in note only. The replacement should end on the
      term-scope ground the review does state (characterized roles are post-translational, the term is generic).
      (2) The first false claim is overstated. The review says 'TRIM-family phylogenetic over-propagation' and 'propagated
      across the TRIM family'; it never says the term comes solely from paralogs, and the tree shows a node spanning
      33 subfamilies with 7 of the 8 other seeds being TRIM paralogs, which fits that wording. Only the second claim
      ('no specific experimental evidence that pyrin regulates gene expression', against self_seed=True) is really
      contradicted, so the correction should be limited to that sentence and to the word over-propagation as applied
      to MEFV itself.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
