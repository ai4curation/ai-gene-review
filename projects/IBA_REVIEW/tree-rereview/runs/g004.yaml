- gene: human/ARGLU1
  term: GO:0005739
  negated: false
  kind: overruled
  action: REMOVE
  flags:
  - paralog_claim_without_duplication
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree the single seed CGD:CAL0000179812 is an ortholog across later duplications
    of ARGLU1, joining it at a speciation node at Opisthokonts, and ARGLU1 lies below the family root across 0 duplications.
    The seed is not a paralog, though it aligns at only 19% identity over 86 columns.
  false_claims:
  - 'Summary: TLO16 is a telomere-associated Mediator-tail paralog rather than an ARGLU1 ortholog. Tree: the seed
    CGD:CAL0000179812 is in the same subfamily (SF1) and is an ortholog across later duplications of ARGLU1, joining
    it at a speciation node at Opisthokonts; there are 0 duplications on ARGLU1''s path to the node.'
  - 'Reason: the entire donor pool is a single architecturally divergent fungal paralog. Tree: the single seed is
    an ortholog across later duplications, not a paralog.'
  - 'Propagation review failure mode WRONG_ORTHOLOG_OR_PARALOG. Tree: the only seed is an ortholog and no duplication
    lies on the path from the node to ARGLU1.'
  reason_replacement: 'The committed PANTHER node audit makes this measurable rather than argumentative. Node PTN001271790
    propagates both nucleoplasm and mitochondrion to exactly the same 111 gene products across 64 NCBI taxa, so
    the two terms differ only in their donor pools. For nucleoplasm, three gene products in the set hold the term
    by their own experimental evidence and all three are reviewed ARGLU1 orthologs. For mitochondrion, exactly one
    does: CGD:CAL0000179812, which resolves to the unreviewed TrEMBL entry A0A1D8PRM3, Tlo16p of Candida albicans,
    holding GO:0005739 by a single IDA from PMID:22923044. Every one of the 111 mitochondrion rows names that same
    accession, so the annotation of the entire eukaryotic ARGLU1 family, including plants, green algae, Selaginella,
    Marchantia, Trichoplax, Daphnia and all vertebrates, traces to that one protein. Two facts finish the argument.
    First, TLO16 is architecturally divergent from ARGLU1: InterPro assigns it IPR021017 Mediator complex subunit
    Med2 (Pfam PF11214) and the AH/BAR superfamily in addition to the shared IPR033371, whereas human ARGLU1 carries
    IPR033371 and nothing else. Second, its own source paper reports the mitochondrial localisation as a property
    of one clade of a Candida-specific expansion from one or two ancestral copies to fourteen, with the other two
    clades nuclear. A localisation that is not even uniform across one lineage-specific family within one species
    cannot support a pan-eukaryotic node. Human ARGLU1 has no mitochondrial evidence of any kind, no targeting sequence,
    and four experimentally supported cellular component terms that are all nuclear. Noted deliberately: 213 merged
    reviews in this repository carry a GO:0005739 IBA row and their modal verdict is ACCEPT, so this REMOVE diverges
    from the corpus; it does so because in this case the entire donor pool is a single architecturally divergent
    fungal protein from a lineage-specific expansion. The PANTHER 19.0 tree does not place that protein as a paralog:
    the seed is an ortholog across later duplications of ARGLU1, joining it at a speciation node at Opisthokonts
    with 0 duplications on ARGLU1''s own path, so the objection is to the seed''s lineage-specific localisation
    and its weak alignment (19% identity over 86 columns, 32% of ARGLU1), with the term placed at the family root
    3 steps above that single seed, not to paralogy.'
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: The 1 duplication between the seed and ARGLU1 is on the seed's side, consistent with the Candida TLO expansion
    the review describes; the verdict stands on the remaining LINEAGE_OR_TAXON_MISMATCH and COMPARTMENT_OR_COMPLEX_MISMATCH
    grounds. The review counts 111 gene products under the node; the tree extract has 116 leaves.
  verifier:
    agrees: false
    problem: 'The claimed contradiction does not meet the reader''s own rule that a paralog claim is contradicted
      only by ortholog seeds with no duplication between them and the gene. The single seed CGD:CAL0000179812 is
      an ORTHOLOG across later duplications with 1 duplication between it and ARGLU1. That duplication is on the
      seed''s side, as the entry''s own note concedes, which is the lineage-specific Candida expansion the review
      describes. So none of the three false_claims is contradicted by the tree. False claim 3 also says no duplication
      lies on the path, which is true only of ARGLU1''s own path from the node, not of the seed-to-gene relation.
      Removing WRONG_ORTHOLOG_OR_PARALOG and rewriting the reason is therefore not warranted. The tree agrees with
      the review''s placement argument: the term sits at the family root 3 steps above a single seed, ARGLU1 is
      outside the seed''s clade (target_in_seed_clade=False), and the seed aligns at 19% identity over 86 columns.
      The reading should be SUPPORTS, with the tree''s ortholog label stated in the sentence.'
    fixed:
      tree_reading: SUPPORTS
      quote_sentences:
      - 1
      - 4
      - 5
      - 6
      tree_sentence: In the PANTHER 19.0 tree the term sits at the family root, 3 steps above the single seed, an
        ortholog across later duplications of ARGLU1 at 19% identity over 86 aligned columns. This agrees with one
        weakly aligned seed carrying the term to the whole family, though the tree calls that seed an ortholog,
        not a paralog.
  outcome: applied
  outcome_detail: applied as corrected by the verifier
