  reason_replacement: All three seeds are JAK2 (mouse Jak2, rat Jak2, human JAK2), so the assertion belongs within
    the JAK2 clade (clade node PTN002910276), not on the euteleostome duplication polytomy. As placed, JAK1, TYK2
    and JAK3 all inherit GH-receptor JAK-STAT signaling. JAK1 and TYK2 have separate support for GH-receptor association
    (they are seeds for GO:0005131 at this node), so their inheritance can be kept as non-core. The JAK1 gene reviews
    already do this. JAK3 has none. The recommended fix is to move the IBD to PTN002910276 and, if JAK1/TYK2 participation
    is wanted, add it through their own experimental annotations. In the PANTHER 19.0 tree the seeds' lowest common
    ancestor is PTN000700647, a Euarchontoglires node 7 steps below PTN002521566, and SF3 JAK3 descends from the
    node with no seeds.
  note: Moving the IBD to the JAK2 clade node rather than the seeds' MRCA is a curator choice the tree permits;
    the error is only the claim that PTN002910276 is the lowest covering node.
