  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree the single NuoG seed sits 5 steps below this Eubacteria node and lies
    in SF10, while SF14 holds 21 of the 33 leaves and no seed, so SF14 is the subfamily to exclude and SF10 is the
    seeded NuoG lineage.
  false_claims:
  - Listing PTHR43105:SF10 as an affected subfamily to prune, while the reason says the assertion must be confined
    to the NuoG lineage; the tree places the only seed, E. coli NuoG, in SF10 (SF10 holds 1 of the seeds).
  reason_replacement: Seeded only by E. coli NuoG, but the node's 33 leaves include, besides bacterial NuoG, E.
    coli formate dehydrogenase H FdhF (P07658), formate dehydrogenase FdhA (P61159), Methanosarcina formylmethanofuran
    dehydrogenase subunits B (fmdB/fwdB, e.g. Q8TIH1) and uncharacterised paralogs (yjgC, yrhE, MJ0006). Those are
    Mo/W-pterin enzymes with no NADH dehydrogenase function, so the assertion must be confined to the NuoG lineage.
    For NuoG itself the term is true only as a contribution to complex I activity (GO:0008137). In the PANTHER 19.0
    tree the single NuoG seed sits 5 steps below this Eubacteria node and lies in SF10, while SF14 holds 21 of the
    33 leaves and no seed, so SF14 is the subfamily to exclude and SF10 is the seeded NuoG lineage.
  note: A curator should remove SF10 from affected_subfamilies, since it holds the seed.
  verifier:
    agrees: true
  outcome: applied
