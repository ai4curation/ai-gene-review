  tree_sentence: In the PANTHER 19.0 tree PTN000190705 is an Opisthokont node of 99 leaves whose four seeds, all
    in SF9, share an ancestor at Bilateria 3 steps below it, so the D-xylulose reductase subfamilies inherit the
