- family: PTHR11309
  node: PANTHER:PTN000885245
  term: GO:0071679
  negated: false
  kind: node
  action: TOO_DEEP
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree the node is a Eumetazoa speciation node with 33 leaves, all in SF35, while
    both seeds sit in one branch whose common ancestor is PTN002601731, a Euteleostomi speciation node covering
    22 leaves, 5 steps below; that node is a descendant of the PAINT node, not its sibling.
  false_claims:
  - the sibling node PTN002601731 shows that such a node already exists for this clade -- PTN002601731 is not a
    sibling of PTN000885245 but a descendant, the common ancestor of the two seeds, a Euteleostomi speciation node
    5 steps below the PAINT node.
  reason_replacement: Both seeds are vertebrates, and the process itself presupposes a centralized nervous system
    with a midline that axons cross. Placing it at Eumetazoa propagates a vertebrate neuroanatomical process to
    cnidarian and protostome descendants of this node, including Drosophila Smoothened, where no commissural guidance
    role of this kind is described. A vertebrate-scoped node would carry the same evidence without the over-reach;
    the descendant node PTN002601731 shows that such a node already exists for this clade. No subfamilies are named
    as affected because the Smoothened subfamily PTHR11309:SF35 itself spans both vertebrates and invertebrates,
    so the over-propagation is within a subfamily rather than across subfamilies. In the PANTHER 19.0 tree the PAINT
    node is a speciation node at Eumetazoa with 33 leaves, all in SF35, and both seeds sit in one branch whose common
    ancestor is PTN002601731, a speciation node at Euteleostomi covering 22 leaves, 5 steps below the PAINT node.
  verifier:
    agrees: true
  outcome: applied
