- family: PTHR11109
  node: PANTHER:PTN000121833
  term: GO:0006729
  negated: false
  kind: node
  action: TOO_DEEP
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree the node is the family root at LUCA with 163 leaves, and all five seeds
    sit in one branch whose common ancestor is PTN000121836, a Unikonts node covering 62 leaves, 3 steps below;
    three seeds (fly, worm, Dictyostelium) are in SF7, so SF11 alone does not hold the evidence.
  false_claims:
  - The term belongs on the animal branch (SF11) -- only human and chicken GCH1 are in SF11 (21 leaves); the Drosophila
    Pu and C. elegans cat-4 seeds are animal members in SF7, and the Dictyostelium gchA seed is also in SF7, so
    the animal branch is not SF11 and the evidence is not confined to animals.
  - affected subfamily SF7 treated as the fungal and bacterial folate branch -- SF7 holds 3 of the 5 seeds of this
    assertion (125 of the node's 163 leaves), so it cannot be excluded as a whole.
  reason_replacement: 'Tetrahydrobiopterin biosynthesis sits at the family-wide node, so it reaches the fungal and
    bacterial enzymes, which feed folate synthesis. The S. cerevisiae FOL2 and S. pombe reviews mark it over-annotated;
    human GCH1 accepts it. The term cannot simply be restricted to SF11, because the seeds are not confined to it:
    human and chicken GCH1 are in SF11, but Drosophila Pu, C. elegans cat-4 and Dictyostelium gchA are in SF7, the
    same subfamily that holds most of the family (125 of 163 leaves), so no subfamily boundary separates the tetrahydrobiopterin-making
    members from the folate-feeding ones. In the PANTHER 19.0 tree the node is the family root at LUCA with 163
    leaves, and all five seeds sit in one branch whose common ancestor is PTN000121836, a speciation node at Unikonts
    covering 62 leaves, 3 steps below the root, so the term sits above its evidence and should be placed no higher
    than that node.'
  note: affected_subfamilies names SF7, which contains three of the seeds; a curator should replace it with a clade-level
    description. The row does not show whether the fungal members lie below the Unikonts seed ancestor, so moving
    the term there may still need a fungal exclusion.
  verifier:
    agrees: true
  outcome: applied
