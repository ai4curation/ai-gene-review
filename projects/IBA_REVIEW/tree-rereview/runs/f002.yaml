  tree_sentence: In the PANTHER 19.0 tree the node is the family root, a duplication before Eukaryota with 622 leaves,
    and the six seeds, including Dictyostelium eloA, sit in 3 of the 5 branches below it, so the root is their common
    ancestor; the objection therefore rests on the fungal members lacking the function, not on seed position.
  note: The seeds bracket the root (seed_mrca_steps_below_node 0), so the term is not above its evidence in the
    tree sense; NEEDS_PRUNING of the fungal clades may describe the problem better than TOO_DEEP. A Dictyostelium
    seed (eloA, SF134) sits beside the animal seeds, which bears on the statement that the term fits only some animal
    paralogs.
  verifier:
    agrees: false
    problem: The NOT_A_TREE_ARGUMENT reading hides a contradiction about the seeds. The assessment says the term
      fits only some animal paralogs. But one of the six seeds is Dictyostelium eloA (SF134, 6 steps below the node),
      a non-animal member with evidence for the term. That seed is in the review's own seed list and in the tree
      facts. The seeds also sit in 3 of the 5 branches below the root (seed_mrca_steps_below_node 0), so the term
      does not sit above its evidence as TOO_DEEP claims. The fungal reviews marking the term over-annotated are
      a separate ground that still stands, so the row reads as REASON_CONTRADICTED. The reason needs correcting,
      so this cannot be fixed by changing only the sentence. The note sees the Dictyostelium seed but does not act
      on it.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
