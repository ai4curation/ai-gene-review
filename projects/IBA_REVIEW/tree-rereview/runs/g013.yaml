        and the seeds are 5 orthologs across later duplications and 1 paralog; the nearest, the Arabidopsis class-III
        enzyme AT5G43940, joins ADH1 at a duplication node, consistent with class P arising by duplication from
        class III.
  outcome: applied
  outcome_detail: applied as corrected by the verifier
