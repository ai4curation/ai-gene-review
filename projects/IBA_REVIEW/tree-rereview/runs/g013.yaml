    agrees: false
    problem: The tree_sentence miscounts the seeds. It says 5 seeds share ADH1's branch and that 'they are 5 orthologs
      across later duplications and 1 paralog', which puts 6 seeds into a group of 5. Sentence [5] gives 5 orthologs
      and 1 paralog for all 6 seeds. frmA joins ADH1 at the root PTN000191653, so it sits in the other branch and
      is not among the 5 that share ADH1's branch. The SUPPORTS reading itself is right.
    fixed:
      tree_reading: SUPPORTS
      quote_sentences:
      - 1
      - 3
      - 4
      - 5
      - 6
