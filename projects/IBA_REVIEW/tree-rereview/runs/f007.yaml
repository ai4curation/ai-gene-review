  quote_sentences:
  - 1
  - 3
  tree_sentence: In the PANTHER 19.0 tree both seeds sit in one branch, their common ancestor PTN000419439 at Opisthokonts
    two steps below this Eukaryota root, so the seeds do not bracket the root, and the tree facts do not show where
    the Mastermind leaves sit.
  false_claims:
  - Placing Mis18 function at the eukaryotic root is supported by the fission-yeast and mammalian seeds; the two
    seeds share a common ancestor PTN000419439 at Opisthokonts, two steps below the Eukaryota root, so they do not
    bracket the root.
  reason_replacement: The fission-yeast and mammalian seeds support Mis18 function in the opisthokont clade below
    this node. However, the dipteran Mastermind branch inside SF1 inherits the term. Drosophila mam (P21519) currently
    carries IBA involved_in CENP-A containing chromatin assembly with PTN001046424 in with/from. mam has no Mis18
    domain and no centromere role. It is a Notch coactivator, misplaced in this tree. The fix is an IRD/NOT (or
    reclassification) on the dipteran Mastermind clade. affected_subfamilies is deliberately left empty, because
    SF1 also holds S. pombe mis18, a seed that must keep the term. Applicability is decided by the mis18_zn site
    instead. In the PANTHER 19.0 tree both seeds sit in one branch, their common ancestor PTN000419439 at Opisthokonts
    two steps below this Eukaryota root, so the seeds do not by themselves bracket the root.
  note: The pruning verdict rests on mam lacking the Mis18 domain, which the tree cannot settle; the curator may
    also wish to consider whether the root placement is too deep.
  verifier:
    agrees: true
  outcome: applied
