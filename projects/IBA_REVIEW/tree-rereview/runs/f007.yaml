    common ancestor PTN008558589 two steps below, while the export ATPase subfamilies SF9, SF62 and SF81 descend
    from the node with none of the seeds, consistent with TOO_DEEP.
  note: The reason describes plant P00827/P19366 among the seeds of the F1-beta clade; they are not seeds of this
    assertion (seeds are SPAC222.12c, S000003882, P06576, P0ABB4). This does not affect the tree argument.
  verifier:
    agrees: false
    problem: The SUPPORTS reading hides a contradiction about the seeds. The assessment says the F1-beta child holds
      every seed, including human P06576 and plant P00827/P19366. That names P00827 and P19366 as seeds of this
      assertion. The row's seed list and its tree facts give only four seeds (SPAC222.12c, S000003882, P06576, P0ABB4),
      all in SF71, and neither plant protein is one of them. The reader's note admits this and treats it as harmless
      to the tree argument. But a contradicted statement about where the seeds sit, with the verdict still standing
      on the correct seed placement and the SF9/SF62/SF81 export-ATPase branch, is the definition of REASON_CONTRADICTED.
      It is not SUPPORTS. The plant seed claim should be listed as a false claim, and reason_replacement should
      drop it and keep the rest of the argument. The tree_sentence itself is accurate.
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
