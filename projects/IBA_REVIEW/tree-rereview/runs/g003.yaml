  tree_sentence: In the PANTHER 19.0 tree all 6 seeds are one-to-one orthologs of cab4 and 0 duplications lie on
    the path from the family root, so this is not a paralog transfer; the nearest seed aligns over only 37% of cab4
    and 21% of the seed, which is compatible with the domain-architecture argument.
  false_claims:
  - 'propagation_review failure mode WRONG_ORTHOLOG_OR_PARALOG (the transfer is from the wrong ortholog or a paralog):
    the tree relates all 6 seeds to cab4 as one-to-one orthologs, with 0 duplications on the path from the family
    root at LUCA to cab4.'
  reason_replacement: 'Domain architecture excludes dephospho-CoA kinase activity: cab4 has a single cytidylyltransferase-like
    PPAT domain (Pfam PF01467) and no CoaE/DPCK domain, and DPCK in S. pombe is provided by cab5. The IBA is a family-level
    over-propagation from bifunctional COASY and standalone CoaE donors to a PPAT-only member. This is not a paralog
    transfer: in the PANTHER 19.0 tree the node is the family root at LUCA, all 6 seeds are one-to-one orthologs
    of cab4, and 0 duplications lie on the path; the nearest seed, human COASY, aligns over only 37% of cab4 and
    21% of the seed, which is compatible with cab4 sharing only part of the bifunctional seed''s architecture. The
    verdict therefore rests on the absent kinase domain, not on evolutionary placement.'
  failure_modes_add:
  - PSEUDO_OR_SUBACTIVITY_LOSS
  failure_modes_remove:
  - WRONG_ORTHOLOG_OR_PARALOG
  note: The review text itself makes no paralog claim; only the failure-mode label is contradicted. The REMOVE stands
    on the missing DPCK domain (a domain-level question; residue_claims_not_applicable would apply if PSEUDO_OR_SUBACTIVITY_LOSS
    is adopted).
  verifier:
    agrees: true
  outcome: applied
