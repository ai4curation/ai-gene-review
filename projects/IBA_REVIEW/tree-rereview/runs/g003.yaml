- gene: SCHPO/mid1
  term: GO:0031106
  negated: false
  kind: overruled
  action: REMOVE
  flags:
  - overruled_though_gene_is_a_seed
  tree_reading: REASON_CONTRADICTED
  quote_sentences:
  - 1
  - 2
  - 5
  - 6
  tree_sentence: In the PANTHER 19.0 tree mid1 is 1 step below the Opisthokonts node across 0 duplications, is itself
    a seed, and the other seeds are 2 orthologs across later duplications of mid1, so the row is not a transfer
    from a paralog and stands or falls with the verdict on the gene's own experimental row.
  false_claims:
  - '''The phylogenetic propagation conflates the two pombe anillins'' / ''mis-propagation across the anillin family
    and a mid1/mid2 conflation'': the seeds of this row are mid1 itself plus 2 orthologs across later duplications
    (fly scra and worm ani-1); no paralog of mid1 is among them and 0 duplications lie on the path from the node
    to mid1.'
  - '''No experimental support for mid1 in septin ring organization'' as a description of the IBA''s grounding:
    mid1 is itself a seed, so its own experimental annotation (the IMP row from PMID:15385632 that this review removes)
    is among the evidence for the node.'
  reason_replacement: 'Septin ring organization is the established role of the paralog mid2 (SPCC18B5.04); mid1
    organizes the contractile actomyosin ring and division-site nodes, and this review does not accept mid1''s own
    IMP row for this term (PMID:15385632, removed in this review). The IBA is not, however, a propagation from mid2
    or a conflation made by the tree: in the PANTHER 19.0 tree the node is a speciation node at Opisthokonts, mid1
    is 1 step below it across 0 duplications and is itself a seed, and the other seeds are 2 orthologs across later
    duplications of mid1 (Drosophila scra and C. elegans ani-1, at 11% and 9% identity). For mid1 the IBA therefore
    restates its own experimental annotation, and it is removed only because, and only to the extent that, that
    IMP row is removed.'
  note: The whole verdict now hinges on the REMOVE of mid1's own IMP row. CLAUDE.md warns against removing an experimental
    annotation as a paralog mis-attribution without reading the full text; if the IMP row cannot be verified, both
    rows should be UNDECIDED. No supported_by is given on this row.
  verifier:
    agrees: false
    problem: 'The reading REASON_CONTRADICTED and both false claims hold (mid2 is not a seed; mid1 is itself a seed,
      so its own IMP row is among the evidence). The fault is in tree_sentence and reason_replacement, which overstate
      what the tree shows. mid1 is 1 of 3 seeds, not the only one: fly scra and worm ani-1 also seed the node, from
      the other branch below it (summary sentence 4, not quoted). So the tree does not show that the row ''stands
      or falls with the verdict on the gene''s own experimental row'', nor that ''the IBA restates its own experimental
      annotation'' and ''is removed only because, and only to the extent that, that IMP row is removed''. That condition
      is not stated by the review and not supported by the dossier: with mid1''s IMP row removed, the node is still
      seeded by two animal anillins, and the REMOVE then needs the divergence argument against them. The replacement
      drops that still-uncontradicted part of the original (propagation across the anillin family over-annotates
      mid1; the tree shows these seeds are orthologs across 2 later duplications at 11% and 9% identity) instead
      of keeping it. The sentence should say the row rests on mid1''s own annotation together with 2 distant animal
      ortholog seeds, and the replacement reason should keep the family-divergence ground beside the removal of
      the IMP row. The reason needs rewriting, so no fixed entry is given.'
  outcome: adjudicate
  outcome_detail: the verifier disagrees with the reading
