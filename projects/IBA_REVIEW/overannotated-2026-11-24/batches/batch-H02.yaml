- gene_file: genes/human/CRISP1/CRISP1-ai-review.yaml
  rows:
  - go_id: GO:0060090
    go_label: molecular adaptor activity
    family: PTHR10334
    ibd_node: PTN000036124
    tree_reading: >-
      IBD at PTN000036124 (1510 of the family's 1515 leaves), one seed, mouse Glipr1l1
      (MGI:MGI:1916536 = Q9DAG6). The seed's lineage runs PTN000036362 > PTN008497699 (7) >
      PTN008497695 (19) > PTN008497694 (22 leaves, the vertebrate GLIPR1L1 clade). CRISP1 is leaf
      PTN002470029 in the CRISP clade PTN002569636 (70 leaves) and first joins the seed at
      PTN008497685 (92 leaves). The IBD node's two children are PTN000036125 (1320 leaves, holds
      both seed and target) and PTN008304532 (190 leaves, GLIPR2 and cnidarian members, no seed).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008497694
    evidence_checked:
    - QuickGO Q9DAG6 GO:0060090 with descendants returned one experimental row, enables, IDA, PMID:31672133 (UniProt)
    - seed leaf located in the PTHR10334 tree and its ancestors listed to confirm PTN008497694 is a 22-leaf clade holding Glipr1l1
    review_edited: false
    notes: >-
      The existing reason (from the 2026-11-21 pass) already names the node, the seed clade and the
      join node, and its node ids and clade sizes match the tree. No family review exists for PTHR10334.
