- gene_file: genes/human/DTYMK/DTYMK-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR10344
    ibd_node: PTN000038987
    tree_reading: >-
      IBD at PTN000038987 (137 leaves), two seeds, one in each child clade. Yeast CDC8
      (SGD:S000003818 = P00572) is in PTN000038988 (35 leaves, with the fly, worm and other animal
      enzymes). Arabidopsis ZEU1 (AT5G59440 = Q0WW55) is in PTN007434965 (102 leaves), the child
      that holds human DTYMK (leaf PTN002470193), and joins it at PTN008498144 (90 leaves). The only
      loss in the family for a location is NOT mitochondrion at PTN000819740, not this term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO P00572 GO:0005634 with descendants returned located_in nucleus, IDA, PMID:6094555 (SGD)
    - QuickGO Q0WW55 GO:0005634 with descendants returned located_in nucleoplasm (GO:0005654), IDA, PMID:18036198 (TAIR and UniProt)
    - publications/PMID_6094555.md is abstract only; its title names subcellular localization of the yeast enzyme, the abstract text read does not reach the localization result
    review_edited: true
    notes: >-
      The earlier reason rested on the lack of a nuclear localization signal and a Reactome
      description as cytosolic, which are not grounds. The Reactome supporting_text quote was
      removed from the row because it no longer supports the action. PTHR10344 has a family review
      but it does not assess this term.
- gene_file: genes/human/CEPT1/CEPT1-ai-review.yaml
  rows:
  - go_id: GO:0005794
    go_label: Golgi apparatus
    family: PTHR10414
    ibd_node: PTN000045767
    tree_reading: >-
      IBD at PTN000045767 (110 leaves), three seeds. The node has two children, PTN000823739 (67
      leaves, holds CEPT1 and CHPT1) and PTN000823784 (43 leaves, the SELENOI clade). Human CHPT1
      (Q8WUD6) and mouse Chpt1 (MGI:MGI:2384841 = Q8C025) join CEPT1 at PTN000045771 (43 leaves),
      the CHPT1 and CEPT1 duplication node. Fly CG7149 (FBgn0031948 = Q8T0S3) joins CEPT1 only at
      the IBD node, so it is in the other child PTN000823784. The CEPT1 clade PTN002572453 (21
      leaves, CEPT1 orthologs from human to gar) holds no seed. CEPT1 itself seeds the ER membrane
      IBD at the same node.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002572453
    evidence_checked:
    - QuickGO Q8WUD6 GO:0005794 with descendants returned Golgi membrane, is_active_in, IDA, PMID:12221122 (UniProt)
    - QuickGO Q8C025 returned Golgi apparatus, located_in, IDA, PMID:20018880 (MGI)
    - GO API for FB:FBgn0031948 returned Golgi apparatus IDA (FlyBase); the QuickGO query by UniProt accession returned only the IBA, so the fly row is keyed on the FlyBase id
    - publications/PMID_12221122.md (abstract only) states that brefeldin A relocalizes CPT1 but not CEPT1 and that marker co-staining and fractionation put CPT1 in the Golgi and CEPT1 in the ER and nuclear membranes
    review_edited: true
    notes: >-
      The earlier reason called all three seeds CHPT1-lineage; the fly seed is in the other child
      clade, which was corrected in the reason and in the propagation_review comment. The earlier
      reviewer named REMOVE as the close alternative. The negative for CEPT1 comes from the same
      paper that seeds CHPT1 and is stated in its abstract; the full text was not read.
- gene_file: genes/human/CASP10/CASP10-ai-review.yaml
  rows:
  - go_id: GO:0043525
    go_label: positive regulation of neuron apoptotic process
    family: PTHR10454
    ibd_node: PTN000047947
    tree_reading: >-
      CASP10 is leaf PTN002470826 in PTHR10454 (UniProt cross-references PTHR48169, where it is not
      a leaf, so treeview.py prints nothing for it; the lineage was read from the PTHR10454 tree
      directly). IBD at PTN000047947 (342 leaves), six seeds across both child clades. Rat Casp3,
      Casp6 and Casp8 are in PTN000048300 (213 leaves), the child holding CASP10; rat Casp8
      (RGD:620945) joins CASP10 at PTN008499707 (30 leaves, CASP8, CASP10 and CFLAR). Mouse Casp9 and
      rat Casp2 are in PTN000047948 (129 leaves). PAINT records NOT IRD for this term at
      PTN000047958 (6 leaves, CFLAR) and PTN002572970 (24 leaves, CASP14), neither on CASP10's lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO with descendants, Q9JHX4 (rat Casp8) involved_in IMP PMID:10197541 (RGD); P55213 (rat Casp3) IMP PMID:18404518; O35397 (rat Casp6) IMP PMID:11433428; P55215 (rat Casp2) IMP PMID:12067235; Q8C3Q9 (mouse Casp9) acts_upstream_of_or_within IMP and IGI PMID:11092819 and PMID:11150333
    - the ced-3 seed (WB:WBGene00000417) could not be resolved to a leaf of the PTHR10454 tree
    review_edited: true
    notes: >-
      The seed papers were not read; the seed rows are IMP or IGI on caspases, which carry out
      apoptosis, so they were taken as sound. The earlier reason was that CASP10's own literature
      is about death receptors, which is an absence of neuronal data. The same term is
      KEEP_AS_NON_CORE in the CASP12 review.
- gene_file: genes/human/CASP12/CASP12-ai-review.yaml
  rows:
  - go_id: GO:0070269
    go_label: pyroptotic inflammatory response
    family: PTHR10454
    ibd_node: PTN002573059
    tree_reading: >-
      IBD at PTN002573059 (28 leaves, human members CASP4, CASP5 and CASP12), four seeds. Zebrafish
      caspa and caspb are in the 6-leaf fish child PTN002573075. Human CASP4 (P49662) and mouse
      Casp4 (MGI:MGI:107700) are in the mammalian child PTN002235052 (22 leaves) and join CASP12
      (leaf PTN002470817) at PTN001312152 (19 leaves). The CASP12 clade PTN001312223 (7 leaves)
      holds no seed and carries no PAINT record.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO with descendants, P70343 (mouse Casp4) IMP and IDA rows from six papers; P49662 (human CASP4) IDA PMID:31268602, PMID:32109412, PMID:34671164; Q504J1 (caspb) IDA and IMP PMID:30076291; Q9I9L7 (caspa) IGI PMID:32332700
    - the CASP12 review carries an experimental NOT enables cysteine-type endopeptidase activity (IKR, PMID:12054529), accepted, and removes the positive IBA for that activity
    review_edited: false
    notes: >-
      The node is soundly seeded and CASP12 is inside it, so the ground is on the target. The seeds
      take part in pyroptosis by cleaving gasdermin, and human CASP12 has an experimental
      key-residue loss of the protease activity and is described as a dominant-negative modulator
      of caspase-1. The existing reason says this (a catalysis-dependent process on an inactive
      pseudo-caspase) and was left as written; it names no node but states nothing wrong about the
      tree. A PAINT loss was not requested because the loss of catalysis is documented for the
      human protein and rodent caspase-12 was not examined here. Whether the non-catalytic protein
      still modulates pyroptosis in human cells is what would settle the row.
- gene_file: genes/human/CASP4/CASP4-ai-review.yaml
  rows:
  - go_id: GO:0072558
    go_label: NLRP1 inflammasome complex
    family: PTHR10454
    ibd_node: PTN002573059
    tree_reading: >-
      CASP4 is leaf PTN002470819 in PTHR10454 (UniProt cross-references PTHR47901, where it is not a
      leaf). IBD at PTN002573059 (28 leaves, human members CASP4, CASP5 and CASP12; CASP1 is not
      below this node), three seeds in both child clades. Zebrafish caspa and caspb are in the
      6-leaf fish child PTN002573075. Human CASP5 (P51878) is in the mammalian child PTN002235052
      (22 leaves) and joins CASP4 at PTN000048076 (8 leaves, primate CASP4 and CASP5).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO with descendants, P51878 part_of IDA PMID:12191486 (UniProt); Q9I9L7 (caspa) IDA and IPI PMID:30150286 (ComplexPortal); Q504J1 (caspb) IPI PMID:30150286 (ComplexPortal)
    - publications/PMID_12191486.md (abstract only) says the inflammasome comprises caspase-1, caspase-5, Pycard/Asc and NALP1 and does not mention caspase-4
    - QuickGO term definition of GO:0072558 names NLRP1 and caspase-1 or caspase-5
    review_edited: true
    notes: >-
      The earlier reason said the node spans a CASP1/4/5 clade and cited the PTHR47901 PAINT file;
      in the pinned tree the node is in PTHR10454 and CASP1 is not below it. The remaining grounds
      (no CASP4 data, definition wording) are not grounds under the protocol. This is the closest
      call in the batch. A reader who takes the definition's list of caspases as exclusive would
      keep MARK_AS_OVER_ANNOTATED on TARGET_DOUBT. The CASP12 review already keeps the same term as
      non-core.
  - go_id: GO:0043525
    go_label: positive regulation of neuron apoptotic process
    family: PTHR10454
    ibd_node: PTN000047947
    tree_reading: >-
      IBD at PTN000047947 (342 leaves), six seeds across both child clades. Mouse Casp9 and rat
      Casp2 are in PTN000047948 (129 leaves), the child holding CASP4; Casp9 joins CASP4 at
      PTN008945551 (72 leaves) and Casp2 at PTN008945549 (92 leaves). Rat Casp3, Casp6 and Casp8 are
      in the other child PTN000048300 (213 leaves). NOT IRD for this term at PTN000047958 (CFLAR)
      and PTN002572970 (CASP14); none on the CASP4, CASP5 and CASP12 clade.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO seed rows as listed for CASP10
    - publications/PMID_15123740.md (full text) shows caspase-4 siRNA reducing ER-stress and amyloid-beta induced death of SK-N-SH human neuroblastoma cells
    review_edited: true
    notes: >-
      The earlier reason argued that an inflammatory caspase would not inherit a neuronal apoptosis
      role. The target's own knockdown data in a neuroblastoma line agree with the term, and the
      review already keeps GO:1904646 and GO:0097193 as non-core from the same paper. A
      supporting_text quote from PMID:15123740 was added to the row.
- gene_file: genes/human/GALK2/GALK2-ai-review.yaml
  rows:
  - go_id: GO:0004335
    go_label: galactokinase activity
    family: PTHR10457
    ibd_node: PTN000048421
    tree_reading: >-
      IBD at the family root PTN000048421 (297 leaves), nine seeds. Human GALK2 (leaf PTN002470828)
      is itself a seed. It sits in the child PTN000825318 (235 leaves); fly Galk joins it at
      PTN000048426 (33 leaves) and yeast and Candida GAL1 at PTN000048425 (52 leaves). Human, mouse
      and rat GALK1 and E. coli galK are in the other child PTN008499778 (62 leaves). PAINT records
      NOT IRD for this term at PTN004160598 (41 leaves, the plant galacturonokinase clade).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO Q01415 GO:0004335 returned IDA PMID:7542884 (UniProt) and TAS PMID:8798585
    - the GALK2 review marks its own IDA and TAS rows on this term over-annotated, citing weak galactose phosphorylation at millimolar concentration next to strong GalNAc kinase activity
    - interpro/panther/PTHR10457/PTHR10457-review.yaml assesses this node NEEDS_PRUNING and lists GALK2 as a weak seed
    review_edited: false
    notes: >-
      The target being its own seed is not the ground; the ground is direct biochemistry on the
      target showing a weak side activity, which the review treats the same way on all four rows
      for the term. Reason left as written. The tree puts vertebrate GALK2 with fly Galk and the
      fungal GAL1 enzymes, apart from GALK1, which the existing reason does not mention; it states
      nothing wrong.
  - go_id: GO:0006012
    go_label: galactose metabolic process
    family: PTHR10457
    ibd_node: PTN000048421
    tree_reading: >-
      IBD at PTN000048421 (297 leaves), eleven seeds, GALK2 not among them. The fungal seeds (S.
      cerevisiae GAL1 and GAL3, S. pombe gal1, Candida GAL1, A. nidulans) join GALK2 at
      PTN000048425 (52 leaves) and fly Galk at PTN000048426 (33 leaves); GALK1 and E. coli galK are
      in the other child of the root.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO with descendants for the seeds, for example P51570 (GALK1) IMP PMID:15024738 and Q9R0N0 (mouse Galk1) IMP PMID:10915771
    - family review assesses the node NEEDS_PRUNING and lists GALK2 as a member exception
    review_edited: false
    notes: >-
      The process row follows the activity row. The doubt is the target's own substrate
      preference, so no PAINT change is named. An in vivo test of galactose flux in GALK2-deficient
      cells would settle it.
- gene_file: genes/human/CXCR4/CXCR4-ai-review.yaml
  rows:
  - go_id: GO:0016493
    go_label: C-C chemokine receptor activity
    family: PTHR10489
    ibd_node: PTN001628461
    tree_reading: >-
      IBD at PTN001628461 (525 leaves), a polytomy with 19 child clades and 19 seeds. CXCR4 is in
      the child PTN002573776 (25 leaves, CXCR4 orthologs), which holds no seed; every seed joins
      CXCR4 only at the IBD node. The seeds are C-C receptors (CCR1 to CCR10 from human and mouse),
      CXCR3 and mouse Ackr2, in their own child clades, for example PTN002573801 (103 leaves, CCR1,
      CCR2, CCR3, CCR5, CX3CR1), PTN008500077 (60 leaves, CCR4, CCR8), PTN002573910 (CCR9, CXCR6),
      PTN002573736 (CCR10), PTN002573880 (CCR7) and PTN007442914 (CCR6). No loss is recorded for the
      term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002573801
    evidence_checked:
    - QuickGO with descendants for all located seeds; each C-C receptor carries IDA or IMP for the term, for example P51681 (CCR5) IDA PMID:10383387 and P32246 (CCR1) IDA PMID:10734056
    - the CXCR4 review cites a viral C-C chemokine antagonist structure (PMID:25612609) and notes that the C-C chemokines tested in the original SDF-1 paper were inactive
    review_edited: false
    notes: >-
      The existing reason is node-aware and correct about the tree. Because the node is a
      polytomy, there is no single node below it that holds all the C-C receptors; the IBD has to
      be re-asserted on each C-C receptor clade, and PTN002573801 is only the largest of them.
      REMOVE is the near alternative, since CXCL12 is the only chemokine agonist described for
      CXCR4, but the review's evidence is a small set of inactive C-C chemokines and one
      antagonist, which is short of showing that no C-C chemokine signals through it.
