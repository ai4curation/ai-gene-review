- gene_file: genes/human/LRRK2/LRRK2-ai-review.yaml
  rows:
  - go_id: GO:0010508
    go_label: positive regulation of autophagy
    family: PTHR45752
    ibd_node: PTN000568664
    tree_reading: >-
      IBD at PTN000568664 (14 leaves, 14 species), the amniote LRRK2 node, with 2 seeds: human LRRK2
      itself and mouse Lrrk2. Children are PTN000585173 (12 mammalian LRRK2 leaves, target and both seeds
      here) and PTN001510137 (chicken and anole LRRK2). The family has 1137 leaves; the node is the LRRK2
      orthologue group, so placement is tight. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000568664
    evidence_checked:
    - >-
      QuickGO GO:0010506 with descendants: human LRRK2 (Q5S007) has GO:0010508 IMP PMID:22012985 (UniProt),
      GO:0010506 IMP PMID:24211199, GO:0016242 negative regulation of macroautophagy IMP PMID:19640926
      and GO:1902902 negative regulation of autophagosome assembly IMP PMID:23916833 (ParkinsonsUK-UCL).
      Mouse Lrrk2 (Q5S006) has GO:0010508 IMP PMID:20457918 (BHF-UCL).
    - >-
      publications/PMID_22012985.md (full text): autophagy induction measured after overexpression of
      LRRK2. PubMed abstract of PMID:20457918 (doi 10.1073/pnas.1004676107): aged Lrrk2 knockout kidneys
      show an impaired autophagy-lysosomal pathway with altered LC3-II and p62.
    - No family review exists for PTHR45752.
    review_edited: true
    notes: >-
      Action unchanged; reason rewritten. The old reason (downstream effect, not core) is not a ground.
      The ground is at the seeds: one is an overexpression phenotype and the other a late degradative
      phenotype in knockout tissue, and the same human protein carries experimental rows for negative
      regulation of macroautophagy, so the sign is not established. The IEA, IMP and ISS rows on the same
      term keep the same action and their old one-line reasons were left as they were. The undirected
      parent GO:0010506 is what the evidence supports; PAINT could re-seed at that term.
