- gene_file: genes/human/SLC25A22/SLC25A22-ai-review.yaml
  rows:
  - go_id: GO:0015183
    go_label: L-aspartate transmembrane transporter activity
    family: PTHR45678
    ibd_node: PTN000640306
    tree_reading: >-
      IBD at PTN000640306 (147 leaves, 51 species) with 7 seeds: human SLC25A12 and SLC25A13, three rodent
      ids (MGI:1926080, RGD:1305181, RGD:1565889), fly FBgn0028646 and yeast AGC1.
      The target lineage runs PTN001183050 (63 leaves, glutamate carrier clade with SLC25A22 and SLC25A18)
      to PTN002903837 (118 leaves), where it joins the animal aspartate-glutamate carrier clade PTN001183073
      (55 leaves) that holds SLC25A12 and SLC25A13. PTN000640307 (131 leaves) adds the 13-leaf fungal branch
      PTN001183094 that holds yeast AGC1.
      No seed is in the glutamate carrier clade. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001183073
    evidence_checked:
    - >-
      QuickGO GO:0015183 exact, experimental codes, human, mouse, rat, fly, yeast: 14 rows, of which the
      family member is yeast AGC1 (Q12482) IDA PMID:14622413; the query returns hits. By accession, Q9H936,
      Q9H1K4 (SLC25A18), Q9D6M3 and Q9DB41 carry only the IBA for this term.
    - >-
      publications/PMID_11897791.md is abstract only (no PMC copy found through Europe PMC); it calls the
      two proteins isoforms of the glutamate/H+ symporter and does not report aspartate as a tested
      non-substrate.
    - >-
      interpro/panther/PTHR45678/PTHR45678-review.yaml rates this node TOO_DEEP and asks for a move to
      PTN000640307, which takes the term off the fungal ODC clade but leaves it on the glutamate carriers.
    review_edited: false
    notes: >-
      Upheld, short of REMOVE because the only reconstitution paper could not be read in full, so a tested
      absence of aspartate transport is not in hand. The move named here goes one step further than the
      family review: to the animal AGC clade PTN001183073. Yeast AGC1 then falls outside and keeps its own
      IDA; the alternative that keeps one node is the family review's PTN000640307 plus a loss on
      PTN001183050. The identities of the MGI and RGD seed ids were not resolved individually; no glutamate
      carrier accession carries an experimental row for the term.
  - go_id: GO:0015810
    go_label: aspartate transmembrane transport
    family: PTHR45678
    ibd_node: PTN000640306
    tree_reading: >-
      IBD at PTN000640306 (147 leaves) with 5 seeds: human SLC25A12 and SLC25A13, mouse MGI:1354721, fly
      FBgn0028646 and yeast AGC1. Same topology as the activity row: the glutamate carrier clade PTN001183050
      (63 leaves, target here) holds no seed; the animal AGC clade is PTN001183073 (55 leaves).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001183073
    evidence_checked:
    - >-
      QuickGO GO:0015810 exact, experimental codes, five taxa: 16 rows; family members are SLC25A12 (O75746)
      IDA PMID:11566871, PMID:19641205, PMID:24515575, SLC25A13 (Q9UJS0) IDA PMID:11566871, mouse Slc25a13
