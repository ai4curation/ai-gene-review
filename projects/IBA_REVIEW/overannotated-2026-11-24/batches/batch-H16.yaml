genes:
- gene_file: genes/human/PAX4/PAX4-ai-review.yaml
  rows:
  - go_id: GO:0007423
    go_label: sensory organ development
    family: PTHR45636
    ibd_node: PTN008693041
    tree_reading: >-
      IBD at PTN008693041 (85 leaves, 31 species) with 12 seeds. Its two children are PTN008693042 (55
      leaves, deuterostome Pax4/6/10 clade, target here) and PTN002900598 (30 leaves, protostome ey, toy,
      eyg, toe, sv, vab-3). Seeds sit in both children; in the target's child they are Pax6-lineage genes
      (human PAX6, mouse and rat Pax6, Xenopus pax6.L, zebrafish pax6 genes), zebrafish pax10 and one Pax4,
      rat Pax4. Human PAX4 (leaf PTN002518875) sits in the mammalian PAX4 clade PTN000676639 (12 leaves),
      which joins the mammalian PAX6 clade PTN000676654 (11 leaves) at PTN000676674 (23 leaves). No loss
      is recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN008693041
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants: rat Pax4 (O88436) carries GO:0060041 IEP PMID:19012751
      (RGD) and nothing else experimental under GO:0007423; rat Pax6 (P63016) returns GO:0060041 IEP from
      the same paper, so the query shape returns hits.
    - >-
      publications/PMID_19012751.md quotes already in the review (expression undetectable in fetal eye,
      highest in adult, authors argue against a developmental role).
    - No family review file exists for PTHR45636.
    review_edited: false
    notes: >-
      The only seed in the PAX4 clade is an expression-pattern (IEP) row that the seed paper itself reads
      as arguing against a developmental role; all other seeds are Pax6, Pax10 or protostome eyeless-type
      genes. The existing reason is node-aware and states this. No single move fixes the node, because in
      this tree the Pax6 genes are spread over several clades under PTN002900580; the practical request
      is to RGD about the rat Pax4 IEP row and, if PAINT agrees, a loss on the mammalian PAX4 clade
      PTN000676639.
  - go_id: GO:0060041
    go_label: retina development in camera-type eye
    family: PTHR45636
    ibd_node: PTN002900580
    tree_reading: >-
      IBD at PTN002900580 (46 leaves, 19 species) with 6 seeds: mouse Pax6, rat Pax6, rat Pax4 and three
      zebrafish genes (pax6a, pax6b, pax10). Children are PTN009179984 (36 leaves, tetrapod PAX4 and PAX6,
      target here) and PTN009180006 (10 leaves, ray-finned fish pax6 and pax10). Within the target's child
      the mammalian PAX4 clade PTN000676639 (12 leaves) holds one seed, rat Pax4, and the mammalian PAX6
      clade PTN000676654 (11 leaves) holds mouse and rat Pax6.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN002900580
    evidence_checked:
    - >-
      QuickGO O88436 GO:0060041: involved_in IEP PMID:19012751 (RGD) is the rat Pax4 seed row. P63016
      (rat Pax6) carries the same IEP from the same paper.
    - publications/PMID_19012751.md and PMID_24951566.md quotes in the review.
    review_edited: false
    notes: >-
      Upheld. The one seed in the PAX4 clade is an IEP (postnatal photoreceptor expression), which shows
      expression and not participation; the Pax6 seeds are sound for Pax6. The review reason already names
      the node and the seed. Same PAINT remark as the sensory organ row.
- gene_file: genes/human/CRYAB/CRYAB-ai-review.yaml
  rows:
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      IBD at PTN000897708 (293 leaves, 33 species) with 7 seeds, all Drosophila small heat shock proteins
      (Hsp22, Hsp23, Hsp26, Hsp27, l(2)efl, CG14207/HspB8, CG7409). Children are PTN001354880 (279 leaves,
      bilaterian sHSPs, target and all seeds here) and PTN000897825 (14 leaves, Nematostella only). CRYAB
      is leaf PTN002479717 under PTN009180241 (109 leaves, 20 species). No vertebrate seed and
      no loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN000897708
    evidence_checked:
    - >-
      QuickGO GO:0042026 exact, taxon 7227, experimental codes: 10 rows, all involved_in IDA by FlyBase
      from PMID:16572729 (Hsp22, Hsp23, Hsp26, Hsp27) and PMID:26705243 (Hsp23, Hsp26, Hsp27, l(2)efl,
      HspB8, CG7409). P02511 with the same term returns only the IBA.
    - >-
      publications/PMID_16572729.md (full text): luciferase heat-denatured in the presence of each sHSP,
      then refolded in rabbit reticulocyte lysate with ATP. publications/PMID_26705243.md (full text):
      sHSPs assist HSP70-dependent refolding in cells.
    - No family review file exists for PTHR45640.
    review_edited: false
    notes: >-
      Upheld on the ground the review already states: the seed assays show the sHSP holding a client in
      a refoldable state while the lysate or cellular HSP70 machinery does the refolding. Whether that
      counts as participation in protein refolding is a term-scope question the review records as open
      upstream, and the four Drosophila seed reviews in this repository read it the other way. Human HSPB1
      and CRYAB show the same holdase behaviour (PMID:19464326), so the call is uniform across the family
      and not a statement that the vertebrate branch differs. If the scope question is settled against
      holdases, the fix is REMOVE_IBD at PTN000897708; if for them, this row and its siblings become
      KEEP_AS_NON_CORE. No PAINT request until then.
