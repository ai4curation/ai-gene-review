      HFA1. Children are PTN000429608 (71 leaves, target here) and PTN001051012 (2 Dictyostelium leaves).
      Inside the target's child the vertebrate ACACA clade is PTN002906395 (24 leaves) and the ACACB clade
      is PTN002906379 (17 leaves); they join at PTN001447645 (41 leaves). Yeast HFA1 sits in the fungal
      branch under PTN001050997 (16 leaves). No seed is in the ACACA clade. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002906379
    evidence_checked:
    - >-
      QuickGO GO:0005739 with descendants: human ACACA (Q13085) and rat Acaca (P11497) carry only the IBA;
      mouse Acaca (Q5SWU9) also has located_in HDA PMID:18614015 (MGI), a mitochondrial proteome row that
      is not a seed.
    - >-
      interpro/panther/PTHR45728/PTHR45728-review.yaml rates the node NEEDS_PRUNING (seeds are HFA1 and
      ACACB; cytosolic ACC paralogues inherit the term) and asks for losses on yeast ACC1 and the ACACA
