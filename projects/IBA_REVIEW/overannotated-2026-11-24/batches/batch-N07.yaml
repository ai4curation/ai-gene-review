- gene_file: genes/worm/mut-7/mut-7-ai-review.yaml
  rows:
  - go_id: GO:0008310
    go_label: single-stranded DNA 3'-5' DNA exonuclease activity
    family: PTHR13620
    ibd_node: PTN008550068
    tree_reading: >-
      IBD at PTN008550068 (866 of the family's 868 leaves) with four seeds. Human EXD2 (Q9NVH0) is in the
      deuterostome EXD2 clade PTN000341342 (24 leaves), sister of the protostome clade PTN002670856 (12
      leaves) that holds mut-7 (leaf PTN000341331) and fly Nbr; the two join at PTN000341341 (36 leaves).
      Fly WRNexo (FB:FBgn0038608, Q9VE86) is in PTN008348282 (59 leaves) and joins only at PTN008550069
      (864 leaves). Arabidopsis RICE1 (AT3G11770, Q9SF21) and RICE2 (AT5G06450, Q9FNG3) are in PTN007618336
      (741 leaves) and join at PTN000341338 (802 leaves). So the seeds bracket the target. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id and taxon. EXD2 Q9NVH0 enables IDA PMID:26807646 and EXP PMID:31127291 (UniProt);
      RICE1 Q9SF21 and RICE2 Q9FNG3 IDA PMID:28463111 (TAIR); fly WRNexo Q9VE86 IDA PMID:22562358 (FlyBase).
    - >-
      publications/PMID_39188014.md (full text cached). The methods test MUT-7 on a 28-mer ssRNA; no DNA
      substrate is reported. The review quotes its statement that the Nibbler EXO domain is specific to
      single-stranded RNA.
    - batch-N02 of the REMOVE pass read the same tree for the mut-7 rows GO:0000724 and GO:0005759.
    review_edited: false
    notes: >-
      The node is soundly seeded and mut-7 is inside the seeded part of the tree, so this is not a
      placement problem. The doubt is on the target's own subfamily. Its fly member Nibbler is described
      as RNA-specific and MUT-7 has been assayed only on RNA. That is short of showing loss, because no
      DNA substrate was tested on MUT-7. An assay of recombinant MUT-7 on single-stranded DNA would settle
      it; if it is inactive, the fix would be a loss on the MUT-7 and Nibbler clade PTN007618331 (11
      leaves). The existing reason says this and was left alone.
