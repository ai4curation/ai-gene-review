      seeded clade. No loss recorded for this term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: ACCEPT
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005319 with descendants. ABCA1 O95477 carries IDA and EXP rows on GO:0140326
      ATPase-coupled intramembrane lipid carrier activity, GO:0090554 phosphatidylcholine floppase activity
      and related terms (PMID:24097981, PMID:16702602, PMID:28373057); ABCA3 Q99758 EXP on GO:0140326 (four
      papers); ABCA4 P78363 and ABCA7 Q8IZY2 EXP and IDA on GO:0140326 and floppase terms.
    - >-
      QuickGO ontology. GO:0005319 is defined as directly binding a specific lipid and delivering it to an
      acceptor molecule or a specific location; its is_a ancestors query shows GO:0140326 is_a GO:0140303
      intramembrane lipid carrier activity is_a GO:0005319.
