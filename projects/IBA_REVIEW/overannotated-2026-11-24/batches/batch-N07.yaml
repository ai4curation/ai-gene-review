- gene_file: genes/worm/dyf-6/dyf-6-ai-review.yaml
  rows:
  - go_id: GO:0031514
    go_label: motile cilium
    family: PTHR13376
    ibd_node: PTN000332669
    tree_reading: >-
      IBD at the family root PTN000332669 (51 leaves) with one seed, mouse Ift46 (MGI:MGI:1923818, Q9DB07).
      Children are PTN001001369 (37 leaves, animals plus Monosiga and a chytrid; seed and target here) and
      PTN007612876 (14 leaves, protists and plants). The seed lies in PTN000332671 (24 leaves) and joins
      dyf-6 (leaf PTN000332701) at PTN000332670 (33 leaves). dyf-6 is in the nematode clade PTN009008724
      (4 leaves, C. elegans, C. briggsae, Pristionchus). No loss recorded.
    ground: LINEAGE
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN009008724
    evidence_checked:
    - QuickGO Q9DB07 x GO:0031514 returns located_in IDA PMID:17312020 (MGI), an ISO on the same paper and the IBA.
    - >-
      PubMed abstract of PMID:17312020 (doi 10.1083/jcb.200608041). Chlamydomonas and mouse IFT46; the
      Chlamydomonas null has short paralyzed flagella. The seed is sound for organisms with motile cilia.
    - >-
      The gene review itself. DYF-6 acts in amphid and phasmid sensory cilia, with an IMP row on
      GO:1905515 non-motile cilium assembly and accepted GO:0005929 cilium rows (IEA, NAS).
    review_edited: true
    notes: >-
      The earlier reason was already a lineage argument (C. elegans has no motile cilia), which under the
      protocol is a REMOVE ground and not an over-annotation, so the action moved to REMOVE. The seed and the
      node are sound; the fix is a loss on the nematode clade. worm/bbs-2 handles the same term with MODIFY to
      GO:0097730 non-motile cilium, which is also defensible; REMOVE was chosen here because the review
      already keeps cilium on two rows and the motile-cilium claim itself is false for the worm. Fly IFT46
      (Q9VJ72) is in the same animal clade and was not assessed. Reconciliation: The worm bbs-2 review was
      aligned to this call. Its motile cilium IBA row (family PTHR32465, IBD at the root PTN000795297, seeds
      human BBS2 and mouse Bbs2) moved from MODIFY to non-motile cilium to REMOVE on the same LINEAGE ground,
      with a loss on its nematode clade PTN001286766 as the fix. Both reviews keep cilium on other rows, and
      the seeds of neither row support the sibling term non-motile cilium, so the two worm reviews now handle
      the term the same way. The bbs-2 row has no record of its own in this pass because it was not marked as
      an over-annotation.
- gene_file: genes/worm/sec-16A.1/sec-16A.1-ai-review.yaml
  rows:
  - go_id: GO:0012507
    go_label: ER to Golgi transport vesicle membrane
    family: PTHR13402
    ibd_node: PTN000333928
    tree_reading: >-
      IBD at PTN000333928 (161 leaves) with one seed, yeast SEC16 (SGD:S000006006, P48415). Children are
      PTN000333929 (68 leaves, animals and fungi; target here) and PTN007613878 (93 leaves, plants and
      protists). The seed lies in the fungal clade PTN001002188 (15 leaves) and joins sec-16A.1 (leaf
      PTN000333990) at PTN000333930 (66 leaves). The same node carries GO:0070971 endoplasmic reticulum
      exit site with 7 seeds. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001002188
    evidence_checked:
    - QuickGO P48415 x GO:0012507 returns located_in IDA PMID:7593161 (SGD) plus the IBA.
    - >-
      The gene review quotes PMID:21478858 and PMID:23840591, which place worm SEC-16 at ER exit sites;
      quotes left as they are.
    review_edited: false
    notes: >-
      The single seed is in the fungal clade and the animal clade holds none. The reason rests on worm
      data that place SEC-16 stably at exit sites and on the metazoan protein being an exit-site scaffold
      and not a vesicle component, which is doubt on the target's branch short of loss. The
      propagation_review names the node and the seed. Left alone. The yeast paper was not read.
