genes:
- gene_file: genes/worm/atg-5/atg-5-ai-review.yaml
  rows:
  - go_id: GO:0034727
    go_label: piecemeal microautophagy of the nucleus
    family: PTHR13040
    ibd_node: PTN000315667
    tree_reading: >-
      IBD at the family root PTN000315667 (111 leaves) with one seed, yeast ATG5 (SGD:S000006070, Q12380).
      Children are PTN000315668 (51 leaves, animals, fungi, amoebozoa; target here) and PTN007600606 (60
      leaves, plants and protists). The seed lies in the fungal clade PTN000990030 (14 leaves) and joins
      worm atg-5 (leaf PTN000315700) at PTN000315669 (48 leaves). No loss recorded on the lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000990031
    evidence_checked:
    - QuickGO Q12380 x GO:0034727 returns involved_in IMP PMID:18701704 (SGD) plus the IBA, so the query shape returns hits.
    review_edited: false
    notes: >-
      Same call as human ATG5 in batch H08. The reason names the root node and the yeast seed and argues from
      the fungal nucleus-vacuole junction. Left alone. Reconciliation: The move target for this node is now
      the budding yeast clade PTN000990031 (4 leaves: S. cerevisiae, E. gossypii, C. albicans, Y. lipolytica)
      in every batch record on it, replacing the fungal clade PTN000990030. The cached PTHR13040 tree confirms
      the point made in batch N20: PTN000990030 contains the fission yeast pair, and the fission yeast review
      marks the same row as an over-annotation, so a move to the fungal clade would leave the term where a
      review doubts it. PTN000990031 is the smallest clade around the single S. cerevisiae seed that is named
      on the tree. The action and ground are unchanged; the gene review names no move target and was not
      edited.
