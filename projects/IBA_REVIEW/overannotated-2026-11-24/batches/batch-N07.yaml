- gene_file: genes/worm/unc-57/unc-57-ai-review.yaml
  rows:
  - go_id: GO:0098978
    go_label: glutamatergic synapse
    family: PTHR14167
    ibd_node: PTN000070016
    tree_reading: >-
      IBD at PTN000070016 (89 leaves, the endophilin-A node) with four seeds (RGD:620578, MGI:MGI:700009,
      RGD:708456, RGD:620276), all rodent. Children are PTN008554470 (78 leaves, vertebrate SH3GL1, SH3GL2
      and SH3GL3; holds the seeds) and PTN002680757 (11 leaves, protostomes; holds unc-57 with fly EndoA).
      The protostome clade holds no seed. The same node carries GO:0098793 presynapse with 5 seeds. No
      loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Sh3gl2 O35179, Sh3gl1 O35964 and Sh3gl3 O35180 carry
      is_active_in IDA PMID:17088211 (SynGO); mouse Sh3gl2 Q62420 carries IDA and IMP PMID:25771685 (SynGO).
    - >-
      Fly EndoA Q8T390, in the target's clade, has no experimental row on GO:0098978 but has located_in
      IDA GO:0061174 type I terminal bouton (PMID:27720484, FlyBase) and IMP rows on synaptic vesicle
      endocytosis; the fly larval neuromuscular junction is glutamatergic.
    - genes/worm/unc-57/unc-57-uniprot.txt, tissue specificity, expressed in neurons and posterior intestine.
    review_edited: true
    notes: >-
      The seeds are all in the vertebrate child clade, but the protocol needs a biological reason to doubt
      the sister clade and there is none. The fly ortholog works at a glutamatergic synapse and the worm
      protein is a pan-neuronal presynaptic protein. The earlier reason was that the synapse type had not
      been examined in the worm, which is not a ground. Moved to KEEP_AS_NON_CORE, since the synapse type
      is peripheral to the presynaptic endocytic function. The UniProt quote on the row is unchanged.
