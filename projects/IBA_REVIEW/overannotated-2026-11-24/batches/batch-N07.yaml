- gene_file: genes/worm/sma-2/sma-2-ai-review.yaml
  rows:
  - go_id: GO:0070411
    go_label: I-SMAD binding
    family: PTHR13703
    ibd_node: PTN000344419
    tree_reading: &smad_tree >-
      IBD at the family root PTN000344419 (252 leaves) with five seeds, all human, spread over all four
      child clades. SMAD1 (Q15797) is in PTN001008883 (82 leaves, BMP R-Smads; holds sma-2, sma-3 and
      daf-14); SMAD2 (Q15796) is in PTN001008908 (58 leaves; holds daf-8); SMAD6 (O43541) and SMAD7
      (O15105) are in the inhibitory-Smad clade PTN001008964 (56 leaves); SMAD4 (Q13485) is in the
      co-Smad clade PTN001008930 (56 leaves; holds sma-4 and daf-3). The inhibitory-Smad clade
      PTN001008964 has a C. elegans member, tag-68 (G5EDS9, subfamily PTHR13703:SF54), with fly Dad. No
      loss for this term is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked: &smad_ev
    - >-
      QuickGO by accession and GO id. SMAD6 O43541, SMAD7 O15105, SMAD2 Q15796 and SMAD4 Q13485 each
      carry enables IPI PMID:9256479 (BHF-UCL); SMAD1 Q15797 carries IPI PMID:9436979 (BHF-UCL).
    - >-
      Clade membership of the four child clades listed from the cached PANTHER tree. C. elegans tag-68
      (G5EDS9) is a leaf of PTN001008964 beside Drosophila Dad.
    - >-
      Human reviews for comparison. SMAD2 and SMAD4 keep the same IBA as KEEP_AS_NON_CORE and SMAD3 as
      ACCEPT.
    review_edited: true
    notes: &smad_notes >-
      The earlier reason said that no C. elegans member of the family falls in the inhibitory-Smad
      subfamilies, so the partner is missing from the lineage. The tree does not bear that out: tag-68
      is in the inhibitory-Smad clade. With the partner present, the node seeded in every child clade and
      the target inside a seeded clade, nothing is left to ground an over-annotation. The row moves to
      KEEP_AS_NON_CORE, the action the human SMAD2 and SMAD4 reviews use. No worm experiment on binding
      to TAG-68 was found or looked for beyond the review. worm/daf-3, daf-8 and daf-14 carry the same IBA
      and are outside this todo; if their reviews use the same reason they need the same correction.
