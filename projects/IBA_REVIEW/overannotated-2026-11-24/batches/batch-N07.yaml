- gene_file: genes/worm/fis-1/fis-1-ai-review.yaml
  rows:
  - go_id: GO:0008289
    go_label: lipid binding
    family: PTHR13247
    ibd_node: PTN000326738
    tree_reading: &fis_tree >-
      IBD at the family root PTN000326738 (152 leaves) with one seed, human FIS1 (Q9Y3D6). Children are
      PTN000997454 (54 leaves, animals and fungi; holds the seed and both worm paralogs fis-1 and fis-2)
      and PTN007607555 (98 leaves, plants and protists). The seed joins the worm proteins at PTN000326740
      (36 leaves). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &fis_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN000326738
    evidence_checked: &fis_ev
    - QuickGO Q9Y3D6 x GO:0008289 with descendants returns enables EXP PMID:14623186, assigned by DisProt, plus the IBA.
    - >-
      DisProt API record for Q9Y3D6. Region 121-145 carries IDPO disorder, GO:0060090 molecular adaptor
      activity and GO:0008289 lipid binding, all with NMR evidence from PMID:14623186.
    - >-
      PubMed abstract of PMID:14623186 (doi 10.1016/j.jmb.2003.09.064), the NMR structure of human Fis1. It
      reports that the C-terminal tail containing a transmembrane segment appears disordered. No lipid
      binding assay is described in the abstract.
    review_edited: true
    notes: >-
      Action unchanged. The old reason led with "no experimental support in worm", which is not a ground,
      and did not name the seed. Rewritten around the seed. The DisProt row describes the disordered
      transmembrane tail, which is membrane anchoring and not a lipid-binding function, so the IBD has
      nothing else under it. The seed row on human FIS1 should be queried with DisProt. Only the abstract
      of the seed paper was read; the DisProt region record is what shows which residues the term was
      assigned to.
