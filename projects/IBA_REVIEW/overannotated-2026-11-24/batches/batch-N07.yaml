    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001047612
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Cplx2 P84087 part_of IDA PMID:11751907 (RGD); mouse Cplx1 P63040
      part_of IDA PMID:15126625 (UniProt); rat Cplx1 P63041 has ISO and IEA only in the current data.
    - >-
      PubMed abstract of PMID:11751907 (doi 10.1074/jbc.M109507200). Structural, kinetic and thermodynamic
      analysis of complexin binding to the assembled ternary SNARE complex, 1 to 1, about 10 nM, with no
      binding to individual SNAREs or the binary complex.
    - >-
      PubMed abstract of PMID:15126625 (doi 10.1242/jcs.01041). Complexin I expression and function in
      insulin-secreting cells; the abstract reports no complex composition data.
    - >-
      QuickGO definition of GO:0031201. A stable ternary complex consisting of a four-helix bundle, usually
      one R-SNARE and three Q-SNAREs.
