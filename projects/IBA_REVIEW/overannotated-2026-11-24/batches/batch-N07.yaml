      at the seeds. The rat seed shows complexin binding the already assembled bundle, which is what
      SNARE binding (GO:0000149, IBD at the same node, accepted in the review) says; the GO complex is
      defined as the SNARE bundle itself. Whether a tightly bound accessory protein counts as part_of the
      complex is a convention that the annotating groups should be asked about before the IBD is removed,
