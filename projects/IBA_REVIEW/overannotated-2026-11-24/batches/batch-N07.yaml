      term. The node is soundly seeded and ced-7 is inside it, so the row moves to ACCEPT, consistent with
      the accepted lipid transport and ATPase-coupled transmembrane transporter rows. A more specific
      descendant was not proposed because the lipid moved by CED-7 is inferred genetically. The
      core_functions block still names ABC-type transporter activity and was not touched.
