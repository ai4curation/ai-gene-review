genes:
- gene_file: genes/DROME/CycA__P14785/CycA__P14785-ai-review.yaml
  rows:
  - go_id: GO:0005815
    go_label: microtubule organizing center
    family: PTHR10177
    ibd_node: PTN007424001
    tree_reading: >-
      IBD at PTN007424001 (439 leaves, 50 species) with seven seeds on both sides of its first split. The
      B-type cyclin child PTN008939442 (143 leaves) holds human CCNB1 and CCNB2, yeast CLB2 and S. pombe
      cdc13. The other child PTN000808716 (296 leaves) holds the target and the remaining seeds, human CCNF,
      rat Ccne1 (RGD:2294, P39949) and S. pombe crs1 (SPBC2G2.09c, O43008). CycA is in the A-type cyclin
      clade PTN000020367 (74 leaves, 31 species, which carries its own IBD for the cyclin A2-CDK2 complex),
      then PTN000808656 (75), PTN008302335 (266), PTN008939485 (294) and PTN000808716. No seed is inside
      PTN000020367. No loss is recorded for the term on the lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008939442
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005815 with descendants. Rat Ccne1 P39949 carries located_in centrosome
      IDA PMID:15514162 (RGD). Human CCNA2 P20248 and CCNA1 P78396 carry only the IBA, so the query shape
      returns positives and the A-type clade has no experimental row.
    - >-
      QuickGO cellular component rows for CycA P14785. Experimental rows are nucleus, cytoplasm, cytosol,
      fusome, spectrosome, male germ cell nucleus and synapse. None is a centrosome or spindle pole term.
    - >-
      Batch H01 (human CCND1, same node) for where CCNF, Ccne1 and crs1 join, and its QuickGO reading of
      the seven seed rows. UniProt cross-references for RGD:2294 (Ccne1) and SPBC2G2.09c (crs1).
    - The row quotes PMID:1531147 (cyclin B around centrosomes, cyclin A on chromosomes, same embryos).
    review_edited: true
    notes: >-
      Action unchanged. The summary and the propagation comment said the node is seeded only by B-type
      cyclins and cyclin F and named a rat cyclin B; the rat seed is cyclin E1, crs1 is not a mitotic B-type
      cyclin, and three seeds sit in the target's own child of the node. Summary, reason and comment were
      rewritten to state the tree. The call rests on the unseeded A-type clade together with the side by
      side fly imaging, which is doubt and not a tested absence. Same ground and same named move as batch
      H01 for CCND1; the move covers the B-type clade only, and the cyclin F and cyclin E clades need their
      own IBDs. Batch N10 kept yeast CLB5 because a seed sits next to it; CycA has no seed in its clade.
      The suggested_questions entry in the review still said "seeded only by B-type cyclins and cyclin F"
      when this batch closed. Reconciliation: it was reworded afterwards to list the seeds as this record
      reads them. No human cyclin A centrosome annotation exists in GO; if a
      paper showing an A-type cyclin at the centrosome is curated, the row becomes KEEP_AS_NON_CORE.
- gene_file: genes/DROME/mtSSB/mtSSB-ai-review.yaml
  rows:
  - go_id: GO:0008047
    go_label: enzyme activator activity
    family: PTHR10302
    ibd_node: PTN000033807
    tree_reading: >-
      IBD at the family root PTN000033807 (347 leaves, 122 species) with one seed, E. coli SSB (P0AGE0).
      The root has two children. The seed is in PTN008942658 (58 leaves, 37 species, bacterial SSBs). The
      target is in the other child PTN000033809 (289 leaves, 86 species, mitochondrial and plant organellar
      SSBs), which carries its own IBDs for mitochondrial nucleoid and positive regulation of mitochondrial
      DNA replication but none for this term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008942658
    evidence_checked:
    - >-
      QuickGO GO:0008047 with descendants. E. coli SSB P0AGE0 carries enables IMP PMID:18591666 (UniProt);
      human SSBP1 Q04837 and fly mtSSB P54622 carry only the IBA.
    - >-
      publications/PMID_18591666.md, the structural study of E. coli SSB stimulation of exonuclease I.
    - >-
      QuickGO for mtSSB P54622. It carries involved_in GO:1900264 positive regulation of DNA-directed DNA
      polymerase activity IMP PMID:14754882 (UniProt).
    - >-
      interpro/panther/PTHR10302/PTHR10302-review.yaml assesses this node UNRESOLVED (single bacterial
      seed, root placement reaches the organellar branches).
    - treeview on ECOLI ssb for the seed's lineage.
    review_edited: false
    notes: >-
      Upheld. The single seed is in the bacterial child and the target in the organellar child, so the
      root placement carries a bacterial partner-stimulation activity across the deepest split in the
      family. On the target, the row quotes PMID:26446790 that stimulation of Pol gamma is mainly through
      organization of the template DNA, which is not binding to and activating an enzyme as GO:0008047
      is defined. The stimulation itself is captured by the experimental GO:1900264 row. The existing
      reason names the seed and gives this target evidence, so the file was left alone. The summary is a
      bare label and names no node; it misstates nothing.
- gene_file: genes/DROME/CSN5__Q9XZ58/CSN5__Q9XZ58-ai-review.yaml
  rows:
  - go_id: GO:0140492
    go_label: metal-dependent deubiquitinase activity
    family: PTHR10410
    ibd_node: PTN000045368
    tree_reading: >-
      IBD at PTN000045368 (512 leaves, 101 species) with six seeds. The node has four large children.
      CSN5 is in PTN000045369 (122 leaves, 97 species, the CSN5 clade, which carries its own IBDs for COP9
      signalosome and deNEDDylase activity), and one seed, human COPS5 (Q92905), is in that same child.
      COPS5 joins the target lineage at PTN000045372 (34 leaves). Human PSMD14 (O00487) and yeast RPN11
      are in PTN000045438 (152 leaves), human EIF3H (O15372) is in PTN000045506 (120 leaves), and the
      BRCC3 seeds (human P46736, mouse MGI:2389572) are in PTN000045567 (118 leaves). No loss recorded
      for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0140492 with descendants. Human COPS5 Q92905 carries enables IDA PMID:19246649 (assigned
      by FlyBase). Mouse Brcc3 P46737 (MGI:2389572) carries IDA PMID:23246432; human EIF3H O15372 IDA
      PMID:32269044.
    - >-
      PubMed abstract of PMID:19246649. CSN5 knockdown and a JAMM-domain deletion raise ubiquitinated
      HSP70 in exosomes from 293 cells. The abstract describes cell-based readouts; the full text was
      not read.
    - >-
      QuickGO molecular function rows for fly CSN5 Q9XZ58. The experimental catalytic row is GO:0140758
      metal-dependent deNEDDylase activity IDA PMID:12737805 (FlyBase).
    - interpro/panther/PTHR10410/PTHR10410-review.yaml has no entry for this term.
    review_edited: false
    notes: >-
      Upheld on a target ground. The CSN5 clade is not seedless, since human COPS5 is a seed inside it,
      so depth alone does not carry the call. The doubt is on the subfamily. The characterised substrate
      of the CSN5 active site, in fly and elsewhere, is NEDD8 on cullins, which GO places in a sibling
      term, and the one seed in the clade rests on a single cell-based study. The existing reason says
      this, names both nodes and acknowledges the COPS5 donor, so the file was left alone. Whether
      PMID:19246649 shows cleavage of a ubiquitin conjugate by CSN5 is a question for the curators of
      that row; a direct assay of CSN or CSN5 on ubiquitin and NEDD8 conjugates side by side would settle
      it. No PAINT change is requested on doubt alone.
- gene_file: genes/DROME/Dcp-1/Dcp-1-ai-review.yaml
  rows:
  - go_id: GO:0043525
    go_label: positive regulation of neuron apoptotic process
    family: PTHR10454
    ibd_node: PTN000047947
    tree_reading: &casp_tree >-
      IBD at PTN000047947 (342 leaves, 32 species) with six seeds across both child clades. The target's
      child PTN000048300 (213 leaves) holds the rat Casp3, Casp6 and Casp8 seeds (per batch H02); mouse
      Casp9 and rat Casp2 are in PTN000047948 (129 leaves). Dcp-1 (leaf PTN000048194) and DrICE (leaf
      PTN000048195) are sister leaves under the fly-only node PTN000741924, inside PTN002573002 (24
      leaves, 6 species), a child of PTN000048300. PAINT records NOT IRD for this term at
      PTN000047958 and PTN002572970; neither is on the lineage of the fly caspases.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Batch H02 QuickGO reading of the seeds (IMP or IGI rows on rat Casp3, Casp6, Casp8, Casp2 and
      mouse Casp9). QuickGO GO:0051402 neuron apoptotic process with descendants for Dcp-1 O02002 and
      DrICE O01382 returns no experimental row.
    - >-
      publications/PMID_21120926.md. Programmed death of the vCrz peptidergic neurons requires both ice
      and dcp-1. The review already carries an IDA programmed cell death row from this paper.
    - interpro/panther/PTHR10454/PTHR10454-review.yaml has no entry for this term.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The earlier reason was that a neuron-specific term is too
      narrow for a general effector caspase, which is a statement about scope and not a ground. The node
      is seeded on both sides, the target is inside the seeded clade, and the row's own quote shows a
      neuronal death requirement for dcp-1 in the fly. Consistent with batch H02, which moved human
      CASP10 and CASP4 to KEEP_AS_NON_CORE on the same node. propagation_review was reset to
      NO_FAILURE_NON_CORE. Whether an executioner caspase should carry a positive regulation term at all
      is a GO convention question that applies equally to the seeds and is not judged here.
