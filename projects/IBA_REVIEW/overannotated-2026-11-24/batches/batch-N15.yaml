- gene_file: genes/DROME/Mst27D/Mst27D-ai-review.yaml
  rows:
  - go_id: GO:0005815
    go_label: microtubule organizing center
    family: PTHR10623
    ibd_node: PTN000065701
    tree_reading: &mst_tree >-
      IBDs at the family root PTN000065701 (259 leaves, 99 species). The root has two children, the
      metazoan and fungal EB clade PTN000065702 (122 leaves), which holds the target, and PTN007450224
      (137 leaves, plants and protists). Mst27D (leaf PTN000065810) is one of six D. melanogaster leaves
      under the fly-only node PTN000065806, with Eb1 and CG18190. Seeds for the three terms sit on both
      sides of the root (human MAPRE1, mouse, worm, yeast and S. pombe members in PTN000065702; Arabidopsis
      and Giardia members in PTN007450224), and for GO:0051010 two seeds, fly Eb1 (FBgn0027066) and CG18190
      (FBgn0034403), are sister leaves of the target. No PAINT loss for any of the three terms exists in
      the family.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      The row quotes PMID:37428798 (full text cached). In spermatids the basal body region is largely
      devoid of Mst27D-EGFP, and the dense-complex bundle does not seem to be nucleated by the basal body.
    - Rereview batch 03 (2026-11-21) for the position of the fly-only node and the Eb1 sister leaf.
    review_edited: false
    notes: >-
      Upheld on target evidence. The node is soundly seeded and the target is inside the seeded clade. The fly
      data place native Mst27D on the nuclear envelope and the dense-complex bundle and largely away from the
      basal body. That is short of a tested loss, because where the dense-complex microtubules are nucleated
      is not known and the nuclear envelope where Mst27D sits could be a non-centrosomal organizing site.
      Finding the nucleation site of the dense-complex bundle would settle it. The reason names the node and
      gives this evidence; left alone. Reconciliation: Rechecked for a clear negative and none was found: the
      quoted paper says the basal body region is largely devoid of the tagged protein, which is not a
      statement of absence from every microtubule organizing center, and the nucleation site of the
      dense-complex bundle is unknown. The row stays as it is.
  - go_id: GO:0035371
    go_label: microtubule plus-end
    family: PTHR10623
    ibd_node: PTN000065701
    tree_reading: *mst_tree
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix: &mst_fix
      paint_action: ADD_IRD
      target_node_id: PTN000065810
    evidence_checked:
    - >-
      The row quotes PMID:37428798. In the same assay Eb1-EGFP formed moving comets while full-length
      Mst27D-EGFP and the Mst27D CH domain grafted onto the Eb1 C-terminus bound along the whole
      microtubule. Comets appeared only with an isolated C-terminal fragment lacking the microtubule
      binding domain, which the authors put down to possible heterodimerization with endogenous Eb1.
    - history/genes/DROME/Mst27D records the earlier decision to separate loss of plus-end preference
      from absent capacity.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE. The reason already concluded that plus-end
      localization is a trait Mst27D has lost, on a direct test with the sister paralog as positive
      control and a domain swap that maps the loss, which is evidence of loss and not doubt. The earlier
      review held back because a lattice binder also touches plus ends and a fragment can ride on Eb1;
      the term asserts the plus end as the site where the protein is active, and the full-length protein
      shows no enrichment there. The previous pass kept REMOVE for spindle assembly and spindle midzone
      on this gene with the same leaf-level loss. The reason was rewritten to name the fly-only node and
      the ground.
  - go_id: GO:0051010
    go_label: microtubule plus-end binding
    family: PTHR10623
    ibd_node: PTN000065701
    tree_reading: *mst_tree
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix: *mst_fix
    evidence_checked:
    - Same PMID:37428798 domain-swap and live-imaging evidence as the plus-end location row.
    - >-
      The review MODIFYs the IEA microtubule binding row to GO:0099609 microtubule lateral binding, which
      is where the inherited binding activity is recorded.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE, with the matching location row. Two seeds are sister
      leaves of the target, so the node is as well placed as it could be and the loss is specific to
      this leaf of a fly-specific expansion. The CH domain itself was tested and binds the lattice
      without plus-end preference.
- gene_file: genes/DROME/PolG2/PolG2-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR10745
    ibd_node: PTN000078673
    tree_reading: >-
      IBD at the family root PTN000078673 (184 leaves, 117 species) with 13 seeds. The root's children are
      PTN000078682 (173 leaves, eukaryotic glycyl-tRNA synthetases and the Pol gamma accessory subunits),
      which holds the target, and PTN000078772 (11 leaves, bacterial glyQS). PolG2 is in the accessory
      subunit clade PTN002473373 (27 leaves, 26 species), which carries IBDs for gamma DNA polymerase
      complex and mitochondrial DNA replication and a PAINT loss of glycine-tRNA ligase activity. Three of
      the cytoplasm seeds are in that clade (human POLG2 Q9UHN1, Xenopus polg2 Q9W6G7 and FBgn0004407,
      which is fly PolG2 itself; treeview reports the target as not a seed because it compares UniProt
      accessions only).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005737 with is_a and part_of descendants. Human POLG2 Q9UHN1, Xenopus polg2 Q9W6G7 and
      fly PolG2 Q9VJV8 carry no row on cytoplasm itself; their experimental rows under it are
      mitochondrion (PolG2 IDA PMID:10506144), mitochondrial matrix and mitochondrial nucleoid. Human
      GARS1 P41250 carries cytoplasm EXP rows, so the query shape returns direct hits where they exist.
    - UniProt cross-reference for FBgn0004407 resolves to Q9VJV8 (PolG2).
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The earlier reason read cytoplasm as cytosol and called it a
      transient precursor location. In GO the mitochondrion is part of the cytoplasm, the accessory
      subunit seeds are mitochondrial rows, and one of them is the target's own. The term is true and
      uninformative beside the accepted mitochondrion and mitochondrial matrix rows, which is the
      TOO_GENERAL case of the README. The PMID:10506144 quote was kept verbatim. No family review exists
      for PTHR10745.
- gene_file: genes/DROME/nudE/nudE-ai-review.yaml
  rows:
  - go_id: GO:0005813
    go_label: centrosome
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: &nude_tree >-
      IBD at the family root PTN000100519 (82 leaves, 47 species). Fly nudE (leaf PTN000100585) is in the
      protostome clade PTN002589161 (10 leaves, 8 species, with worm nud-2), whose sister under the
      bilaterian node PTN000100522 (64 leaves) is the deuterostome clade PTN002589136 (54 leaves). The
      vertebrate NDE1 and NDEL1 proteins join at PTN000100525 inside that clade (node id from batch N05).
      The fungal clade PTN000858805 carries a PAINT loss (NOT IRD) of centrosome. The centrosome IBD has
      four seeds and the microtubule nucleation IBD one, all vertebrate.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix: &nude_move
      paint_action: MOVE_IBD
      target_node_id: PTN000100525
    evidence_checked:
    - >-
      Batch N05 QuickGO reading of the seeds (mouse Nde1 and Ndel1, rat Ndel1, human NDE1, all IDA
      centrosome rows); fly nudE has no experimental centrosome row.
    - >-
      publications/PMID_19417004.md (full text). The authors state that their immunolocalization of the
      endogenous protein shows no accumulation of NudE near centrosomes in neuroblasts or spermatocytes,
      while NudE is seen at kinetochores, on kinetochore microtubules and at the nuclear envelope.
    - >-
      interpro/panther/PTHR10921/PTHR10921-review.yaml assesses the node TOO_DEEP and asks for the IBD
      to be restricted to the vertebrate clade.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE. The protostome clade has no seed and the one direct
      test in it, on the target itself, was negative in two cell types, which the README treats as a
      misplaced IBD and not an over-annotation. Batch N05 kept worm nud-2 over-annotated on the same node
      because worm centrosomal absence was not itself tested; for the fly protein it was. The IEA row on
      the same term (UniProt subcellular location by similarity) was changed to REMOVE with it for
      consistency. The family review says "The fly and worm reviews mark the IBA over-annotated", which
      is now out of date for the fly; the family review was not edited. A loss at the protostome node
      PTN002589161 would be the alternative fix if the IBD stays at the root.
  - go_id: GO:0007020
    go_label: microtubule nucleation
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: *nude_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *nude_move
    evidence_checked:
    - >-
      Batch N05 reading of the single seed, a mouse row annotated with acts_upstream_of_or_within and
      propagated as involved_in from the family root.
    - >-
      The row quotes PMID:25908857 (mixed axonal microtubule polarity without NudE) and PMID:19417004.
      The family review assesses the node TOO_DEEP and the vertebrate effect as indirect.
    review_edited: false
    notes: >-
      Upheld, same ground and fix as worm nud-2 in batch N05. One vertebrate seed whose own qualifier
      concedes indirectness, placed at the family root. The fly microtubule phenotypes are read as
      downstream of dynein-dependent transport and are not a test of nucleation, so this stays an
      over-annotation and is not a removal. The reason names the node and gives the target evidence;
      left alone.
- gene_file: genes/DROME/E-spl-m8-HLH/E-spl-m8-HLH-ai-review.yaml
  rows:
  - go_id: GO:0009952
    go_label: anterior/posterior pattern specification
    family: PTHR10985
    ibd_node: PTN000105428
    tree_reading: >-
      IBD at PTN000105428 (400 of the 406 leaves in the family) with sixteen seeds. Its children are the
      HEY clade PTN007475037 (93 leaves) and PTN000862345 (307 leaves), which holds the target.
      E(spl)m8 (leaf PTN000105694) is one of seven E(spl) bHLH genes under the fly-only node PTN000105691,
      inside the protostome clade PTN002590978 (49 leaves, 9 species), a child of PTN000105429 (296
      leaves). One seed, worm lin-22 (G5EF76), is in that protostome clade and joins the target lineage
      at PTN008958111 (42 leaves). Fly hairy (P14003) and deadpan join lower, at PTN002250848 (25 leaves),
      and are not seeds. The other fifteen seeds are mouse, zebrafish and chick Hes and her genes outside
      the protostome clade. No loss is recorded for this term on the lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0009952 with descendants. Worm lin-22 G5EF76 carries IMP PMID:9247331 (WormBase). Fly
      hairy P14003 carries periodic partitioning by pair rule gene TAS rows, a descendant term, and no
      experimental code that PAINT uses as a seed.
    - >-
      QuickGO biological process rows for E(spl)m8 P13098. Experimental rows are mesoderm development,
      sensory organ precursor cell fate determination, compound eye development, dendrite morphogenesis
      and negative regulation of gene expression; none is an axis or segmentation term.
    - Batches H03 (BHLHE40) and N01 (mouse Hes6, Hes7) on the same node.
    review_edited: true
    notes: >-
      Action unchanged. The summary and reason described the support as vertebrate segmentation-clock
      genes only; a worm seed sits in the target's own protostome clade and the fly pair-rule gene hairy
      is a close relative, so the text was rewritten to state the tree. The call holds because the seven
      E(spl) genes are a fly-specific expansion with no seed, they act as Notch targets in lateral
      inhibition, and fly segmentation does not use Notch. That is doubt and not a tested absence. As in
      batch H03, no single node can be named for a move, since the seeded clades are several. The
      propagation comment already mentioned the worm gene and was left as written.
- gene_file: genes/DROME/Sirt1/Sirt1-ai-review.yaml
  rows:
  - go_id: GO:0005637
    go_label: nuclear inner membrane
    family: PTHR11085
    ibd_node: PTN000872223
    tree_reading: &sirt_tree >-
      IBD at PTN000872223 (35 leaves, 33 species, the SIRT1 node of the 505-leaf family) with one seed,
      human SIRT1 (Q96EB6). The node's children are PTN000872224 (34 leaves), holding both the target and
      the seed, and a single other leaf. Fly Sirt1 (leaf PTN000119332) joins the seed at PTN000119302 (33
      leaves, 31 species), so the clade is close to single copy. No loss recorded on the lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005637 for human SIRT1 Q96EB6, which carries located_in IDA PMID:15469825 (UniProt).
      Fly Sirt1 Q9VK34 has experimental nucleus, nucleoplasm, chromosome and cytoplasm rows and only the
      IBA for this term.
    - Batch N05 (worm sir-2.1, same node) could not read the seed paper beyond its abstract; not re-read here.
    - interpro/panther/PTHR11085/PTHR11085-review.yaml does not assess this term.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, consistent with worm sir-2.1 in batch N05. The earlier grounds
      were a single seed and the absence of a fly study, neither of which is a ground, and the claim that
      the association has no invertebrate counterpart was untested. propagation_review reset to
      NO_FAILURE_NON_CORE. If a reader of the seed paper finds the IDA rests on perinuclear staining, the
      fix is at the seed.
  - go_id: GO:0033553
    go_label: rDNA heterochromatin
    family: PTHR11085
    ibd_node: PTN000872223
    tree_reading: *sirt_tree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
