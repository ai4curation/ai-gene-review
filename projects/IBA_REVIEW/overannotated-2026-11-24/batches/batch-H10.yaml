  - go_id: GO:0031629
    go_label: synaptic vesicle fusion to presynaptic active zone membrane
    family: PTHR19305
    ibd_node: PTN000447754
    tree_reading: >-
      Same node and same single seed as the priming row. Fly Snap25 in PTN002712521 (13 leaves) joins
      at PTN000447806 (68 leaves); human SNAP23 is in PTN009037782 (22 leaves), sister to the SNAP25
      clade PTN002712515 (23 leaves).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000447806
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly Snap25 (P36975) has IDA PMID:21316453 (FlyBase).
    review_edited: false
    notes: Same reading as the priming row.
- gene_file: genes/human/HSPA13/HSPA13-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR19375
    ibd_node: PTN002500132
    tree_reading: >-
      IBD at PTN002500132 (326 leaves) with 15 seeds. Ten are in the cytosolic HSP70 clade
      PTN009039116 (214 leaves; HSPA8, HSPA1A, HSPA1B, HSPA1L, HSPA6, HSPA7, mouse Hspa2, worm hsp-1,
      two chicken proteins) and five in the fungal SSA clade PTN001065099 (57 leaves). Human HSPA13
      is in PTN001064948 (22 leaves), a third child of PTN009039106 (266 leaves) beside PTN009039116
      and the HSPA14 clade PTN001065003 (30 leaves), and holds no seed. Separate IBDs for nucleus sit
      at the BiP node PTN001834223 and at PTN002500146.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001064948
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human HSPA8 (P11142) has IDA PMID:20176811 for nucleus plus
      nucleoplasm rows; the query returned 18 hits. Human HSPA13 (P48723) was queried the same way.
    - >-
      interpro/panther/PTHR19375/PTHR19375-review.yaml assesses the nucleus IBD at PTN002500132 as
      SOUND for the cytosolic HSC70 branch and leaves HSPA13 as a member-level question.
    review_edited: false
    notes: >-
      The reason rests on positive evidence that HSPA13 is an ER protein with a signal peptide
      (proximity labelling in the ER lumen), which is a real ground, and names the node. The seeds
      are sound; the node simply spans an ER-targeted clade. The loss at PTN001064948 is the clean fix
      if curators take the ER-lumenal topology as settled; the review keeps a topology question open
      (binding of cytosolic BAG6 and ubiquilin proteins in vitro), which is why the row is not a
      removal.
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR19375
    ibd_node: PTN002500132
    tree_reading: >-
      IBD at PTN002500132 (326 leaves) with 15 seeds, in three clades. Cytosolic HSP70s in
      PTN009039116 (214 leaves), fungal SSA and sks2 proteins in PTN001065099 (57 leaves) and human
      HSPA14 in PTN001065003 (30 leaves). The HSPA13 clade PTN001064948 (22 leaves) is the only child
      of PTN009039106 without a seed. A separate cytosol IBD sits at PTN000751549 (26 leaves, E. coli
      seeds).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001064948
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human HSPA8 (P11142) has IDA PMID:21231916 for cytosol; 19 hits
      returned.
    - Family review as for the nucleus row (cytosol at this node assessed SOUND for the branch).
    review_edited: false
    notes: >-
      Same reading as the nucleus row. The existing reason is specific about what the HSPA13 evidence
      shows and what it leaves open.
- gene_file: genes/human/HSPA14/HSPA14-ai-review.yaml
  rows:
  - go_id: GO:0016887
    go_label: ATP hydrolysis activity
    family: PTHR19375
    ibd_node: PTN000452648
    tree_reading: >-
      IBD at PTN000452648 (1707 leaves, one node below the family root) with 22 seeds spread over the
      family. Cytosolic HSP70s in PTN009039116, fungal SSA and SSB proteins in PTN001065099, BiP
      orthologs in PTN001834223, mitochondrial HSP70s in PTN000452554, E. coli HscA and HscC in
      PTN009039410, a trypanosome protein, and human HSPA13 in PTN001064948. The HSPA14 clade
      PTN001065003 (30 leaves) holds no seed for this term. No loss for the term on the target
      lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Seed list resolved to leaves and clades with the cached tree. The review's own quotes from
      PMID:21245388 (already in the file, validated) say the hydrolysis question cannot be answered
      conclusively and that mRAC function needs ATP binding but not hydrolysis.
    - >-
      interpro/panther/PTHR19375/PTHR19375-review.yaml treats divergent members such as HSPA13 as
      member-level questions and does not assess HSPA14 for this term.
    review_edited: false
    notes: >-
      Soundly seeded node, with doubt specific to the target (near-background turnover, hydrolysis
      mutants that still complement). Doubt alone does not support a PAINT loss. The experiment that
      would settle it is a single-turnover ATPase assay on purified HSPA14 with and without DNAJC2.
      The IEA row on the same term carries the same action.
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR19375
    ibd_node: PTN000452648
    tree_reading: >-
      IBD at PTN000452648 (1707 leaves) with eight seeds. Six cytosolic HSP70s in PTN009039116 (HSPA8,
      HSPA1A, HSPA1B, HSPA1L, HSPA2, HSPA6), yeast SSA1 in PTN001065099 and yeast SSC1 in the
      mitochondrial clade PTN000452554. None in the HSPA14 clade PTN001065003 (30 leaves). PAINT
      records NOT IRD for this term at PTN001065099 (57 leaves), which is off the target lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Yeast SSA1 (P10591) has IDA PMID:18706386 and PMID:9674429 (SGD).
      Human HSPA14 (Q0VDF9) has only the IBA.
    review_edited: false
    notes: >-
      The reason says the IBD is on the target path and that the recorded loss is elsewhere, which
      matches the tree, and gives a target ground (HSPA14 is the cofactor subunit of the
      ribosome-associated complex and acts on nascent chains, not in recovery of denatured proteins).
      Note that the recorded loss is on the clade that contains the SSA1 seed, which looks
      inconsistent on PAINT's side and is worth a query.
- gene_file: genes/human/HSPA5/HSPA5-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR19375
    ibd_node: PTN001834223
    tree_reading: >-
      IBD at PTN001834223 (271 leaves), the BiP clade, with five seeds, all BiP orthologs. Human
      HSPA5 itself (leaf PTN002500185), mouse and rat Hspa5 (joining at PTN000452728, 8 leaves),
      S. pombe bip1 (joining at PTN002321823, 57 leaves) and rice BIP1 (in PTN007673797, 196 leaves,
      joining at the node itself). The same node carries the ER lumen, ER chaperone complex, UPR and
      ERAD IBDs. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human HSPA5 (P11021) has HDA PMID:19946888 on
      membrane; rat Hspa5 (P06761) has IDA PMID:23444373 on membrane (MGI); mouse Hspa5 (P20029) has
      IDA PMID:22837305 on plasma membrane.
    - >-
      interpro/panther/PTHR19375/PTHR19375-review.yaml assesses the node as SOUND and calls the
      gene-side issue one of granularity.
    review_edited: true
    notes: >-
      The target is its own seed and the node is sound, so nothing is over-annotated. The term is true
      and imprecise, and the review accepts GO:0005789 endoplasmic reticulum membrane on direct
      evidence, which entails it. Both rows on the term (IBA and the HDA seed row) moved from
      MARK_AS_OVER_ANNOTATED to TOO_GENERAL together. The family review still says the granularity
      point supports a gene-level over-annotation call; that sentence no longer matches and should be
      updated when the family review is next edited. Its suggestion that PAINT replace membrane with
      ER membrane at the node stands.
- gene_file: genes/human/GCK/GCK-ai-review.yaml
  rows:
  - go_id: GO:0008865
    go_label: fructokinase activity
    family: PTHR19443
    ibd_node: PTN004516717
    tree_reading: >-
      IBD at the family root PTN004516717 (506 leaves) with 13 seeds. Human GCK is itself a seed (leaf
      PTN002500356) and rat Gck joins it at PTN000455416 (6 leaves). Other seeds are rat Hk1, Hk2 and
      Hk3 (joining at PTN000455353, 109 leaves), fly Hex-A and Hex-C, two S. pombe hexokinases and an
      Aspergillus enzyme (joining at PTN000455352, 189 leaves). Three Arabidopsis seeds could not be
      mapped to leaves. PAINT records losses for the term at PTN000455552 (76 leaves), PTN007675417
      (24 leaves) and two single leaves, none on the target lineage.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human GCK (P35557) has EXP PMID:7742312 (UniProt); rat Gck
      (P17712) has IDA PMID:6477520 and PMID:7742312.
    - >-
      The review quotes UniProt kinetics for PMID:7742312, a Km for fructose of 240 mM.
    - interpro/panther/PTHR19443/PTHR19443-review.yaml leaves the term's scope UNRESOLVED.
    review_edited: false
    notes: >-
      The target is one of its own seeds, and the review judges that seed row (in vitro turnover at a
      Km far above any physiological fructose concentration) an activity of unknown relevance, with
      the same action on the EXP, IBA and IEA rows. That is the seed-overreach case for the GCK seeds
      only. The node as a whole is sound for hexokinases, so no change to the IBD is asked for.
  - go_id: GO:0019158
    go_label: mannokinase activity
    family: PTHR19443
    ibd_node: PTN002714980
    tree_reading: >-
      IBD at PTN002714980 (21 leaves), the vertebrate glucokinase clade, with two seeds, human GCK
      (the target) and rat Gck (joining at PTN000455416, 6 leaves). Separate mannokinase IBDs sit at
      PTN002715014 (38 leaves, HK1 seeds) and PTN001066695 (33 leaves, fungal seeds).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human GCK (P35557) has EXP PMID:7742312; rat Gck (P17712) has IDA
      PMID:7742312 (UniProt).
    review_edited: false
    notes: >-
      Target is its own seed and the IBD is placed on its own clade, so the tree raises no question.
      The call is about the seed row. The kinetics are substantial (the review computes a kcat over Km
      for mannose close to that for glucose), so this is the weaker of the two GCK calls and
      KEEP_AS_NON_CORE would also be defensible; the review's tiering (measured activity, physiological
      use not shown) is applied consistently to the EXP, IBA and IEA rows and was left as it is.
