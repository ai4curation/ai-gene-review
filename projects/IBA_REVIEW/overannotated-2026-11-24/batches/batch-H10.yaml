- gene_file: genes/human/LZTFL1/LZTFL1-ai-review.yaml
  rows:
  - go_id: GO:0005929
    go_label: cilium
    family: PTHR21635
    ibd_node: PTN000493255
    tree_reading: >-
      IBD at the family root PTN000493255 (36 leaves) with one seed, mouse Lztfl1, which joins the
      target lineage at PTN000493264 (6 leaves), so it is the target's own ortholog. Human LZTFL1 is
      leaf PTN002502547. The root's other child, PTN007697896 (6 protist leaves), has no seed. The
      node also carries cytoplasm and negative regulation of protein localization to cilium.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Mouse Lztfl1 (Q9JHQ5) has located_in IDA
      PMID:34023333 (MGI). Human LZTFL1 (Q9NQ48) has no experimental row; the GOA file shows the IBA and
      an Ensembl IEA from the mouse row.
    - >-
      PubMed abstract of PMID:34023333. The protein is cytoplasmic and vesicular in round spermatids
      and present in the developing flagella of elongated spermatids.
    - >-
      publications/PMID_22072986.md, full text. A figure legend states that LZTFL1 localizes to the
      cytoplasm but not cilia or basal body, and the text places the BBSome interaction in the
      cytoplasm.
    review_edited: false
    notes: >-
      The seed is sound and is the target's ortholog, which would normally mean keeping the row. What
      holds the over-annotation is direct evidence on the human protein that it is absent from primary
      cilia where it was looked for, against a mouse observation in the sperm flagellum, so the
      location is conditional on cell type. The existing reason cites the human study but not the
      mouse seed; the two are compatible and the verdict stands on the human evidence. The IEA row on
      the same term carries the same action. Staining of human sperm or of a ciliated epithelium
      would settle it. No family review.
