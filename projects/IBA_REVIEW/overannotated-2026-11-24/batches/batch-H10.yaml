- gene_file: genes/human/RPUSD2/RPUSD2-ai-review.yaml
  rows:
  - go_id: GO:0000455
    go_label: enzyme-directed rRNA pseudouridine synthesis
    family: PTHR21600
    ibd_node: PTN002727951
    tree_reading: >-
      IBD at the family root PTN002727951 (701 leaves) with eight seeds. E. coli RluE and RluF are in
      PTN000492312 (44 leaves) and RsuA in PTN004550285 (18 leaves), both children of the root. E. coli
      RluA, RluC and RluD are in PTN008370768 (147 leaves), joining the target lineage at PTN008577970
      (584 leaves). Yeast Pus5 is in PTN004550368 (94 leaves), joining at PTN008577971 (437 leaves).
      Yeast Pus9 is in the fungal clade PTN000824406 (19 leaves, with RIB2 and Pus6), which is sister
      to the animal RPUSD2 clade PTN000824389 (34 leaves, target here, with worm and fly members)
      under PTN000046898 (53 leaves). No loss recorded for the term.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000824389
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Yeast PUS9 (Q12069) and PUS5 (Q06244) each have IDA PMID:25219674
      (UniProt); E. coli RluA (P0AA37) has IMP PMID:10383384 (EcoCyc). Human RPUSD2 (Q8IZ73) has only
      the IBA.
    - >-
      publications/PMID_41136621.md, full text. Knockout cells were profiled across noncoding RNA with
      reads mapped to rRNA references; RPUSD2-dependent sites are reported in tRNA only, RPUSD4
      knockdown reduced the 16S mitochondrial rRNA site, and the discussion states that eukaryotic
      RPUSD2 has lost its activity towards rRNAs.
    - >-
      interpro/panther/PTHR21600/PTHR21600-review.yaml assesses the node TOO_DEEP for this term.
    - PubMed abstract of PMID:25219674 (the Pus5 and Pus9 seed paper); it does not name either enzyme.
    review_edited: true
    notes: >-
      The earlier reason had the evidence and stopped short of removal because it is an absence in
      cell lines. Two knockout profiles that include rRNA, with the authors' statement of loss on the
      lineage, are evidence on the target that the function is gone, which is the removal case, so
      the action changed. The loss is asked for on the animal RPUSD2 clade; the evidence is human, and
      a curator may prefer a node lower in that clade. Two things were not resolved. Yeast RIB2, in
      the fungal sister clade, still carries the same IBA as over-annotated (not a gene of this batch).
      And the Pus9 seed row could not be checked: Pus9 is described in the family review as a
      mitochondrial tRNA enzyme, and whether PMID:25219674 shows an rRNA site for it needs the full
      text, so it is noted here as a query on the seed and nothing is claimed.
