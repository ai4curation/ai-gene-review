genes:
- gene_file: genes/human/FIBCD1/FIBCD1-ai-review.yaml
  rows:
  - go_id: GO:0031012
    go_label: extracellular matrix
    family: PTHR19143
    ibd_node: PTN000441162
    tree_reading: >-
      IBD at PTN000441162 (1051 of the family's 1053 leaves) with six seeds. All six join the target
      lineage at PTN008362456 (199 leaves) and sit in three of its child clades, human and bovine
      MFAP4 in PTN002709609 (47 leaves), human and mouse tenascin-N in PTN002709624 (15 leaves), mouse
      and rat tenascin-R in PTN002709630 (21 leaves). Human FIBCD1 (leaf PTN002498970) is in a fourth
      child clade, PTN002709788 (24 leaves), which holds no seed. The other child clades of the IBD
      node (angiopoietin-like, fibrinogen gamma and others) hold no seed either. No loss recorded for
      the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008362456
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human MFAP4 (P55083) has HDA rows on GO:0031012 (PMID:20551380,
      PMID:25037231, BHF-UCL) and an IDA to microfibril; the query returned hits, so its shape is sound.
      Human FIBCD1 (Q8N539) returned only the IBA.
    - >-
      Seed MOD ids resolved to UniProt accessions through the UniProt xref search and located on the
      tree (RGD:3886 Tnr Q05546, MGI:2665790 Tnn Q80Z71, MGI:99516 Tnr Q8BYI9).
    - >-
      interpro/panther/PTHR19143/PTHR19143-review.yaml does not assess this node and term.
    review_edited: true
    notes: >-
      Action unchanged. The reason already argued from the tree and from FIBCD1 being a type II
      transmembrane receptor. The summary said the seeds include angiopoietin-like and FGL proteins,
      which they do not, so the summary and the propagation comment were corrected. Moving the IBD to
      PTN008362456 takes it off about 850 leaves that have no seed but still covers the FIBCD1 clade; taking
      it off FIBCD1 as well would need a loss at PTN002709788, which the membrane-anchor argument
      alone does not establish.
- gene_file: genes/human/ABCE1/ABCE1-ai-review.yaml
  rows:
  - go_id: GO:0006413
    go_label: translational initiation
    family: PTHR19248
    ibd_node: PTN000443727
    tree_reading: >-
      IBD at the family root PTN000443727 (184 leaves) with two seeds, both inside the eukaryotic
      child clade PTN000443728 (177 leaves) that holds the target. Fly pix joins the target lineage at
      PTN000443731 (35 leaves) and yeast RLI1 at PTN000443730 (50 leaves). The other child clade,
      PTN000443801 (7 archaeal leaves), has no seed. The same node carries the IBD for translational
      termination. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000443727
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly pix (Q9VSS1) has IMP PMID:17392269 (FlyBase); yeast RLI1
      (Q03195) has IMP PMID:15277527 and IMP PMID:15660134 (SGD). Human ABCE1 (P61221) has only the
      IBA.
    - >-
      PubMed abstracts of the three seed papers (not in publications/). All rest on depletion, with
      loss of polysomes and co-purification with eIF3, eIF5 and eIF2; PMID:15660134 reports a
      ribosomal subunit export defect and translational arrest. All predate the finding that the
      protein splits post-termination ribosomes.
    - >-
      PubMed abstract of PMID:33289941, which finds ABCE1 on native 43S and 48S initiation complexes
      and says its functional role there remains largely enigmatic.
    review_edited: false
    notes: >-
      The seeds are mutant phenotypes that a recycling defect also produces, since failure to split
      80S ribosomes starves initiation of free subunits. That is the ground the existing reason
      states (an indirect effect through recycling), though it names no seed. The request to PAINT is
      a query more than a demand, because ABCE1 is physically present on 43S complexes and a direct
      role has not been excluded.
- gene_file: genes/human/OLIG2/OLIG2-ai-review.yaml
  rows:
  - go_id: GO:0007423
    go_label: sensory organ development
    family: PTHR19290
    ibd_node: PTN000446010
    tree_reading: >-
      IBD at the family root PTN000446010 (415 leaves) with 21 seeds. Every seed located joins the
      target lineage at PTN008568921 (377 leaves), that is, none lies in the OLIG clade PTN008568922
      (87 leaves) that holds human OLIG2. The seeds are atonal, neurogenin, NeuroD and BHLHE22 and
      BHLHE23 proteins. PAINT already records NOT IRD for this term at PTN008568918 (34 leaves, the
      other child of the root).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human NEUROG1 (Q92886) has IGI rows to inner ear
      terms (PMID:23419067); mouse Atoh1 (P48985) has IMP and IDA rows to inner ear and hair cell terms
      (MGI). Human OLIG2 (Q13516) and OLIG3 (Q7RTU3) return only IBA.
    - >-
      All 21 seed ids resolved to tree leaves; each joins at PTN008568921.
    review_edited: false
    notes: >-
      The reason was already rewritten against the tree and names the node, the seeded clades and the
      existing loss. No single move takes the term off the OLIG clade, because the seeds lie in four
      sister clades under PTN008568921; a loss at PTN008568922 would need evidence beyond the absence
      of data. No family review.
- gene_file: genes/human/SNAP23/SNAP23-ai-review.yaml
  rows:
  - go_id: GO:0016082
    go_label: synaptic vesicle priming
    family: PTHR19305
    ibd_node: PTN000447754
    tree_reading: >-
      IBD at PTN000447754 (128 leaves) with one seed, fly Snap25, which sits in the invertebrate clade
      PTN002712521 (13 leaves; fly Snap24 and Snap25, worm ric-4 and aex-4) and joins the target
      lineage at PTN000447806 (68 leaves). Its sister PTN000447807 (55 leaves) holds the vertebrate
      duplicates, the SNAP23 clade PTN009037782 (22 leaves, target here) and the SNAP25 clade
      PTN002712515 (23 leaves), which carries its own IBDs. The IBD node also covers the SNAP47 clade
      PTN001062139 (22 leaves) and the SNAP29 clade PTN001062123 (33 leaves), neither with a seed.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000447806
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly Snap25 (P36975) has IDA PMID:19706552 (FlyBase) for this
      term. Human SNAP23 (O00161) has only the IBA.
    - >-
      Child clades of PTN000447754, PTN000447806, PTN000447807 and PTN000447809 listed from the cached
      tree.
    review_edited: false
    notes: >-
      The reason is sound and states the tree correctly (single fly seed, node above the vertebrate
      SNAP23 and SNAP25 duplication, synaptic role kept by SNAP25). Moving the IBD to PTN000447806
      removes SNAP47 and SNAP29 but still reaches SNAP23, for which a loss at PTN009037782 would be the
