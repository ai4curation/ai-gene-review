- gene_file: genes/human/HLA-DPA1/HLA-DPA1-ai-review.yaml
  rows:
  - go_id: GO:0023026
    go_label: MHC class II protein complex binding
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: >-
      IBD at the family root PTN000460629 (293 leaves) with four seeds, the HLA-DM and HLA-DO chains.
      HLA-DMA is in PTN009040967 (17 leaves) and joins the target lineage at PTN009040948 (120
      leaves); HLA-DOA is in PTN000460799 (35 leaves) and joins at PTN008366811 (59 leaves); HLA-DMB
      is in the child clade PTN009041005 (42 leaves) and HLA-DOB in the beta-chain clade PTN008572173
      (113 leaves). Human HLA-DPA1 is leaf PTN002500595 in the alpha-chain clade PTN008572149 (138
      leaves). No classical alpha or beta chain is a seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009040967
    evidence_checked:
    - >-
      QuickGO by accession and GO id. HLA-DMA (P28067) and HLA-DMB (P28068) each have IDA
      PMID:22733780, PMID:23260142 and PMID:9075930; HLA-DOA (P06340) and HLA-DOB (P13765) have IDA
      PMID:22733780 (all UniProt).
    - >-
      Other reviews carrying the term were listed. B2M removes the same IBA; CD4 and CD74 accept
      experimental rows.
    - interpro/panther/PTHR19944/PTHR19944-review.yaml does not assess this term.
    review_edited: false
    notes: >-
      The reason is right about the seeds and about the node mixing complex subunits with proteins
      that bind the complex in trans. The move needs four placements, on the DMA clade PTN009040967,
      the DOA clade PTN000460799, and the DMB and DOB clades inside PTN009041005 and PTN008572173; one
      id is given in paint_fix. A case could be made for REMOVE (a subunit is not a binder of its own
      complex), and B2M's row is REMOVE, but B2M is not part of the complex at all while the DP alpha
      chain contacts other class II molecules in the CD74 nonamer, so the softer call was left.
- gene_file: genes/human/TRAPPC5/TRAPPC5-ai-review.yaml
  rows:
  - go_id: GO:1990070
    go_label: TRAPPI protein complex
    family: PTHR20902
    ibd_node: PTN000467346
    tree_reading: >-
      IBD at the family root PTN000467346 (125 leaves) with one seed, yeast TRS31, in the fungal clade
      PTN001075272 (15 leaves), which joins the target lineage at PTN000467348 (48 leaves). Human
      TRAPPC5 is leaf PTN002501028 in the sister part of that clade. The root's other child,
      PTN007682021 (74 leaves, plants and protists), has no seed. The node also carries TRAPPII and
      TRAPPIII complex IBDs.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001075272
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Yeast TRS31 (Q03337) has IDA and IPI PMID:11239471 (SGD,
      ComplexPortal).
    - >-
      The review's quotes from PMID:21525244 and PMID:27066478 (in the file, validated) say a TRAPP I
      equivalent has not been found in mammalian cells.
    review_edited: false
    notes: >-
      The reason does not name the node but rests on a real ground, published doubt that the complex
      exists outside yeast. With one fungal seed and that doubt, the assertion belongs on the fungal
      clade. If the absence in mammals were taken as established this would be a lineage removal; the
