genes:
- gene_file: genes/rat/Trpc7/Trpc7-ai-review.yaml
  rows:
  - go_id: GO:0007338
    go_label: single fertilization
    family: PTHR10117
    ibd_node: PTN008494066
    tree_reading: >-
      IBD at PTN008494066 (92 leaves) with two seeds. Worm spe-41 (WB:WBGene00004976, G5EF09) is
      in the 7-leaf nematode child PTN008494077. Mouse Trpc2 (MGI:109527, Q9R244) is in the other
      child PTN000012232 (85 leaves) and joins Trpc7 at PTN008494067 (79 leaves), whose four
      children are the TRPC6 clade PTN002561492 (22 leaves), the TRPC7 clade PTN002561517 (19,
      target here), the TRPC2 clade PTN002561507 (18, the seed) and the TRPC3 clade PTN002561502
      (20). The TRPC3, TRPC6 and TRPC7 clades hold no seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002561507
    evidence_checked:
    - >-
      QuickGO, Q9R244 (mouse Trpc2) with GO:0007338 and descendants. Returns
      acts_upstream_of_or_within GO:0007340 acrosome reaction, IMP, PMID:11331878 (MGI).
    - >-
      QuickGO, G5EF09 (spe-41). Returns involved_in GO:0007338, IMP, PMID:12914694 (WB), a
      sperm-sterile mutant.
    - >-
      PubMed abstracts of PMID:11331878 and PMID:12914694 read; both concern sperm-expressed
      channels (Trp2 in ZP3-evoked Ca2+ entry, TRP-3 in sperm-egg interaction).
    review_edited: false
    notes: >-
      Both seeds are sperm channels, one per child clade, so the node is bracketed on paper, but
      the vertebrate seed is TRPC2 alone, a paralog with a specialised expression, and its three
      sister clades have nothing. The review reason names both seeds and says they are outside
      the TRPC3/6/7 subfamily, which matches the tree, so the file was left alone. The move named
      here covers the vertebrate seed; the worm seed needs its own IBD in PTN008494077.
  - go_id: GO:0015279
    go_label: store-operated calcium channel activity
    family: PTHR10117
    ibd_node: PTN000012230
    tree_reading: >-
      IBD at the family root PTN000012230 (238 leaves) with eight seeds. Human TRPC3 (Q13507)
      and mouse Trpc6 (MGI:109523, Q61143) join Trpc7 at PTN008494067 (79 leaves, the
      TRPC2/3/6/7 clade). Worm spe-41 joins at PTN008494066 (92 leaves). Human TRPC1, human and
      bovine TRPC4, mouse Trpc1 and mouse Trpc4 join at PTN000012233 (223 leaves). The TRPC7
      clade PTN002561517 (19 leaves) holds no seed. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id for the seeds. TRPC3 IDA PMID:10611319; Trpc6 IDA PMID:8646775; TRPC1 IDA
      PMID:11139478 and PMID:15016832; TRPC4 IDA and IMP; spe-41 IDA and IMP PMID:12914694.
    - >-
      Review quotes for the target, PMID:10488066 (no effect on thapsigargin-induced entry) and
      PMID:15342342 (store-operated only when stably expressed), left as they are.
    review_edited: false
    notes: >-
      The node is soundly seeded and the nearest seeds, TRPC3 and Trpc6, are sister paralogs of
      TRPC7, so the ground is on the target and not on the tree. TRPC7's own data show the
      activity is conditional on the expression system. The reason says this. What would settle
      it is a store-depletion recording of endogenous TRPC7 with STIM1 or Orai1 removed.
  - go_id: GO:0070679
    go_label: inositol 1,4,5 trisphosphate binding
    family: PTHR10117
    ibd_node: PTN000012230
    tree_reading: >-
      IBD at the family root PTN000012230 (238 leaves) with six seeds. Human TRPC3 and TRPC6 and
      mouse Trpc2 join Trpc7 at PTN008494067 (79 leaves); human TRPC1, mouse Trpc4 and mouse
      Trpc5 join at PTN000012233 (223 leaves). The TRPC7 clade PTN002561517 holds no seed. No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id for all six seeds (Q13507, Q9Y210, P48995, Q9QX29, Q9R244, Q9QUQ5). Each
      carries one experimental row, enables GO:0070679, IDA, PMID:14505576, assigned by BHF-UCL.
    - >-
      PubMed abstract of PMID:14505576 (Homer binds TRPC family channels and is required for
      gating of TRPC1 by IP3 receptors). It describes a physical association of TRPC1 with the
      IP3 receptor through Homer and does not mention binding of the IP3 ligand by any TRPC.
      Not cached; full text not read.
    review_edited: false
    notes: >-
      All six seeds come from one paper whose abstract is about coupling to the IP3 receptor
      protein, which is a different thing from binding IP3. That is a seed on the wrong term if
      the full text bears it out (pattern 20); on an abstract alone it is a query on the six
      BHF-UCL rows and the row stays over-annotated instead of REMOVE. The rat Trpc6 review
      already records the same query as a suspected source defect on the human TRPC6 row. If the
      seeds are withdrawn the IBD at PTN000012230 goes with them, so no separate PAINT change is
      asked for here.
- gene_file: genes/rat/Ttpa/Ttpa-ai-review.yaml
  rows:
  - go_id: GO:0042360
    go_label: vitamin E metabolic process
    family: PTHR10174
    ibd_node: PTN002563498
    tree_reading: >-
      IBD at PTN002563498 (19 leaves, the vertebrate TTPA clade) with one seed, mouse Ttpa
      (MGI:1354168, Q8BWP5), which joins rat Ttpa at PTN000595394 (2 leaves) inside the tetrapod
      child PTN008494956 (16 leaves). The other child PTN002563502 is three fish leaves. No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002563498
    evidence_checked:
    - >-
      QuickGO, Q8BWP5 with GO:0042360. Four IMP rows, three acts_upstream_of_or_within from MGI
      (PMID:11076932, PMID:11095717, PMID:16014812, knockout alleles) and one involved_in from
      BHF-UCL (PMID:19923370). Papers not read.
    - >-
      QuickGO, P49638 (human TTPA). Only the IBA and a Reactome TAS, no experimental row.
    review_edited: false
    notes: >-
      The target sits next to its seed, so the tree is not the issue. The seed rows are knockout
      phenotypes (tissue and plasma tocopherol levels) on a transfer protein that catalyses no
      reaction on vitamin E, and three of the four are already qualified as upstream effects,
      which PAINT projects as involved_in. The reason states this and names the node. Vitamin
      transport and lipid transfer activity at the same node carry the real function. The ISO
      rows on the same term carry the same action.
