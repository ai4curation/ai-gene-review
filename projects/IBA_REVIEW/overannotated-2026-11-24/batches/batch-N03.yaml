- gene_file: genes/rat/Slc13a2/Slc13a2-ai-review.yaml
  rows:
  - go_id: GO:0071285
    go_label: cellular response to lithium ion
    family: PTHR10283
    ibd_node: PTN008496849
    tree_reading: >-
      IBD at PTN008496849 (25 leaves) with two seeds, rat Slc13a2 itself (RGD:61920, P70545) and
      human SLC13A2 (Q13183), which joins the target at PTN000031909 (6 leaves). Both are in the
      vertebrate child PTN002568138 (21 leaves); the other child PTN002568146 is four Ciona
      leaves. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN008496849
    evidence_checked:
    - >-
      QuickGO, P70545 with GO:0071285. involved_in, IDA, PMID:9691021, UniProt (the rat cloning
      paper). Q13183 the same term by IDA, PMID:10894787, UniProt.
    - >-
      The review's UniProt quote, that Li+ decreases succinate transport by competing at a cation
      binding site.
    review_edited: false
    notes: >-
      The target is one of its own seeds (treeview prints False because the seed is listed by
      its RGD id). That is not a reason to doubt the IBA; the ground is that both seed rows
      record inhibition of transport by Li+ in an uptake assay, which is a property of the
      transporter's cation site and not a cellular response. The review marks its own IDA row
      the same way and its propagation comment names the node and both seeds, so nothing was
      edited. The family review PTHR10283 has no entry for this term.
