- gene_file: genes/rat/Acot1/Acot1-ai-review.yaml
  rows:
  - go_id: GO:0000038
    go_label: very long-chain fatty acid metabolic process
    family: PTHR10824
    ibd_node: PTN000793330
    tree_reading: >-
      IBD at PTN000793330 (38 leaves) with five seeds, all in the child PTN001286270 (36 leaves)
      that holds the target. Human ACOT1 (Q86TX2) and ACOT2 (P49753) join rat Acot1 at
      PTN000793333 (12 leaves); mouse Acot5 (MGI:2384969) and Acot3 (MGI:2159619) join at
      PTN000793337 (8 leaves); human ACOT4 (Q8N9L9) joins at PTN008506777 (33 leaves). The other
      child PTN001327436 is two sauropsid leaves. No loss recorded for this term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id for the five seeds. Each has one experimental row, involved_in
      GO:0000038, IDA, PMID:16940157, HGNC-UCL.
    - >-
      publications/PMID_16940157.md is abstract only; it does not give the chain lengths
      assayed.
    - >-
      QuickGO term record for GO:0000038. The definition requires an aliphatic tail of more
      than 22 carbons.
    - >-
      The review's UniProt quotes for the rat enzyme (C12-C20 preference; eicosanoyl-CoA the
      longest curated substrate).
    review_edited: false
    notes: >-
      The node is seeded all round the target, including by its human ortholog, so this is not
      a placement problem and the review says so. The ground is on the target and its seeds
      together. Every curated substrate of rat Acot1 and of human ACOT1 stops at C20, which is
      long-chain under the current GO definition, and all five seed rows come from one paper
      whose substrate range could not be read here. If the full text shows activity above C22
      for ACOT1 or ACOT2, the row becomes KEEP_AS_NON_CORE; if it shows the assays stopped at
      C20, the five seed rows are on the wrong term and the IBD should go.
- gene_file: genes/rat/Elovl7/Elovl7-ai-review.yaml
  rows:
  - go_id: GO:0030148
    go_label: sphingolipid biosynthetic process
    family: PTHR11157
    ibd_node: PTN000125390
    tree_reading: >-
      IBD at the family root PTN000125390 (622 leaves) with six seeds. Human ELOVL1 (Q9BW60) and
      mouse Elovl1 (MGI:1858959) join rat Elovl7 at PTN000125498 (42 leaves), whose two children
      are the ELOVL1 clade PTN002597128 (21 leaves, both seeds) and the ELOVL7 clade PTN002597135
      (21 leaves, target, no seed). Yeast ELO2 and ELO3 and two Candida genes (FEN1, FEN12) are
      in another root child, PTN004237254 (211 leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002597128
    evidence_checked:
    - >-
      QuickGO, Q9BW60 with GO:0030148, IMP PMID:20937905 (UniProt); Q9JLJ5 (mouse Elovl1) IMP
      PMID:20253178, plus ceramide biosynthetic process IMP PMID:23689133.
    - >-
      The review's UniProt quote for the target, little or no activity toward C22:0-, C24:0- or
      C26:0-CoA.
    - >-
      Family review PTHR11157, which lists this node and term as UNRESOLVED and notes that
      ELOVL5, rat Elovl7 and yeast ELO1 mark it over-annotated.
    review_edited: false
    notes: >-
      The animal seeds are the sister paralog ELOVL1, which makes the C24 to C26 acyl chains that go into
      sphingolipids; ELOVL7 does not elongate those substrates, which is the biological reason to doubt the
      term in its clade. The reason and the propagation comment state the seeds correctly. Batch H03 asked for
      the move to PTN000125473 (160 leaves) for ELOVL5; that node contains PTN000125498 and so would still
      deliver the term to ELOVL7. The narrower node named here is the one that fits both rows. The fungal
      seeds need their own IBD inside PTN004237254. Reconciliation: Checked on the cached PTHR11157 tree:
      PTN000125473 does contain PTN000125498 and both of its children. Batches H03 (human ELOVL5) and N05
      (worm elo-6) now name PTN002597128 as well. The human ELOVL7 review keeps this IBA as non-core and was
      outside this pass, so the rat and human ELOVL7 rows still differ.
- gene_file: genes/rat/Rnase1/Rnase1-ai-review.yaml
  rows:
  - go_id: GO:0050830
    go_label: defense response to Gram-positive bacterium
    family: PTHR11437
    ibd_node: PTN008517922
    tree_reading: >-
      IBD at PTN008517922 (203 leaves) with ten seeds. Human RNASE3, RNASE6, RNASE7 and RNASE8
      and mouse Rnase6 join rat Rnase1 at PTN002478983 (129 leaves), whose children are the
      RNASE1 clade PTN000893253 (25 leaves, target, no seed), PTN000153600 (91 leaves, RNase 2,
      3, 6 and relatives) and the RNASE4 clade PTN000153693 (13 leaves). Human ANG joins at
      PTN007505704 (164 leaves), chicken P30374 at PTN000153526 (174 leaves), two zebrafish
      RNases at PTN002605927 (201 leaves) and zebrafish rnasel4 at the IBD node itself, from the
      2-leaf child PTN008968100. No loss recorded for the term on the target lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, Q9H1E1 (RNASE7) with GO:0042742 and descendants. Returns many IDA rows for
      GO:0050830 and GO:0050829, which confirms the query shape returns hits.
    - >-
      Same query for A5HAK2 (zebrafish rnasel4). IDA rows for GO:0050830 and GO:0050829
      (PMID:17347156, PMID:21050179, ZFIN).
    - >-
      Same query for human RNASE1 (P07998), bovine RNase A (P61823) and mouse Rnase1 (P00683).
      Each returns one hit, the IBA; no experimental antibacterial row on any RNase 1.
    - >-
      PubMed searches for a direct bactericidal assay of RNase 1 returned nothing usable; no
      paper was read on this point.
    review_edited: false
    notes: >-
      The weakest upheld call in the batch. Seeds sit on both sides of the target (fish and
      chicken outgroups, angiogenin, and the RNase 2/3/6/7/8 clade), so the node is not placed
      too deep in the usual sense, and the propagation comment in the review that says it is
      overstates that; the seed list it gives is correct. What stands is doubt on the RNase 1
      clade. It is the pancreatic digestive branch, its characterised extracellular role is RNA
      clearance, and none of the three heavily studied RNase 1 proteins carries an experimental
      antibacterial annotation while their paralogs carry many. That comparator pattern is a
      lead and not proof of loss, so no PAINT change is asked for. A bactericidal assay of
      recombinant RNase 1 beside RNase 7 would settle it. If it kills, the row is
      KEEP_AS_NON_CORE; if it does not, the row is REMOVE with a loss at PTN000893253.
- gene_file: genes/rat/Pecam1/Pecam1-ai-review.yaml
  rows:
  - go_id: GO:0006955
    go_label: immune response
    family: PTHR11481
    ibd_node: PTN008518992
    tree_reading: >-
      IBD at PTN008518992 (333 leaves) with nine seeds. Its child PTN000159462 (332 leaves) has
      the PECAM1 clade PTN002607980 (23 leaves, target) and PTN002607994 (302 leaves, Fc
      receptors and related receptors) among its children. Eight seeds (mouse Fcgr1, Fcgr2,
      Fcgr3 and MGI:1924977, human FCGR3A, FCGR1A and FCER1A, macaque FCGR3A) are outside the
      PECAM1 clade and join the target at PTN000159462. The ninth is rat Pecam1 itself
      (RGD:61927), the only seed in PTN002607980. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002607994
    evidence_checked:
    - >-
      QuickGO, Q3SWT0 (rat Pecam1) with GO:0006955 and descendants. One experimental row,
      involved_in GO:0071346 cellular response to type II interferon, IEP, PMID:18466611, RGD.
    - >-
      QuickGO ancestors of GO:0071346 include GO:0006955; ancestors of diapedesis, neutrophil
      extravasation, monocyte extravasation and cellular extravasation do not.
    - >-
      Same query for human PECAM1 (P16284) and mouse Pecam1 (Q08481). Only the IBA.
    - >-
      Same query for Q9CX63 (MGI:1924977). IMP rows for mast cell terms, so the query returns
      hits.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. It said the term adds no information, which is not a
      ground, and its propagation comment said rat Pecam1's seed rows were its leukocyte
      migration terms. Those terms are not under immune response. The row Pecam1 brings to this
      node is an IEP for interferon-gamma response, which the review already marks
      over-annotated as an expression readout. So the PECAM1 clade has no evidence of taking
      part in an immune response, and the rest of the seeds are Fc receptors in the sister
      clade. The move takes the IBD to that clade; the Pecam1 IEP seed should not seed it.
