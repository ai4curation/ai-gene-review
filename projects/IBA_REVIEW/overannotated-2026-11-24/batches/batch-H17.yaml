genes:
- gene_file: genes/human/TERF2/TERF2-ai-review.yaml
  rows:
  - go_id: GO:0098505
    go_label: G-rich strand telomeric DNA binding
    family: PTHR46833
    ibd_node: PTN002929876
    tree_reading: >-
      IBD at PTN002929876 (22 leaves, 20 species), the vertebrate TERF2 clade, with one seed, human TERF2
      (Q15554) itself. Two child clades, PTN002502798 (19 leaves, tetrapod TERF2, holding the target)
      and PTN002929882 (3 leaves, fish). No loss recorded for the term on the lineage.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002929876
    evidence_checked:
    - >-
      QuickGO by accession and GO id, Q15554 on GO:0098505, returned three rows, the IBA, an ARBA IEA and
      the seed, enables IDA PMID:17694070 (BHF-UCL).
    - >-
      QuickGO by reference PMID:17694070 shows the same term given by IDA to TERF1 (P54274), TERF2 (Q15554)
      and TERF2IP (Q9NYB0), next to process rows on NBN, ATM and RAD50 for TRF1 regulation. One
      term on every telomere protein in the paper is the pattern 20 signature.
    - >-
      publications/PMID_17694070.md is abstract only (full_text_available false) and PubMed has no PMC
      id for it. The abstract is about MRN and ATM control of TRF1 binding to telomeres and mentions
      an in vitro telomeric DNA interaction assay for TRF1 only. GO:0098505 is defined in QuickGO as
      binding to G-rich, single-stranded, telomere-associated DNA.
    review_edited: true
    notes: >-
      Action unchanged. The IBA reason said the IBA likely reflects other family members; the sole
      seed is the target, so the reason was rewritten. The over-reach is at the seed row (an assay of
      association with telomeric repeats read as single-strand G-strand binding is the likely
      explanation), but the full text could not be read, so it stays a query and the IDA row keeps
      the same action. If the seed row is corrected upstream the IBD goes with it. No family review
      exists for PTHR46833. No source_defects entry was added; a CHECK query to BHF-UCL on the three
      GO:0098505 rows from this paper would be the upstream route.
- gene_file: genes/human/SENP6/SENP6-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR46896
    ibd_node: PTN002930416
    tree_reading: >-
      IBD at PTN002930416 (60 leaves, 36 species) with five seeds. Child clade PTN002930418 (52 leaves)
      holds the target together with animal SENP6 and SENP7 and four of the seeds, mouse Senp6 (MGI:1922075),
      mouse Senp7 (MGI:1913565), fly velo and pira. Child clade PTN002930461 (8 leaves, fungal Ulp2) holds
      the fifth, S. pombe ulp2. The vertebrate SENP6 node PTN002930429 (17 leaves) carries only kinetochore
      and spindle process IBDs. No loss recorded for cytoplasm.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:0005737 with descendants for each seed. Mouse Senp6 (Q6P7W0) has is_active_in IDA rows
      to presynaptic cytosol and postsynaptic cytosol, PMID:33113832 (SynGO); mouse Senp7 (Q8BUH8) has cytoplasm
      IDA PMID:28095500 (UniProt) and the same SynGO rows; fly velo cytosol IDA PMID:34330981; fly pira cytoplasm
      IDA PMID:22699913; S. pombe ulp2 cytoplasmic stress granule IDA PMID:24818994. Human SENP6 (Q9GZR1) returned
      only the IBA, so the query shape returns hits where they exist.
    - >-
      PubMed abstract of PMID:33113832, structured illumination microscopy of SENP1, SENP6 and SENP7 in cultured
      hippocampal neurons, partial colocalisation with synaptophysin and drebrin. Alliance gene pages confirm
      MGI:1922075 is Senp6 and MGI:1913565 is Senp7.
    - >-
      Gene review quote from PMID:17000875 (kept), SUSP1 is nucleoplasmic with minimal distribution to the
      cytoplasm. interpro/panther/PTHR46896/PTHR46896-review.yaml does not assess this node; it quotes PMID:24818994
      for a small cytoplasmic proportion of S. pombe Ulp2.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason argued that human SENP6 is not a donor
      and that the term rests on other clade members, which is not a ground and misses that the mouse
      ortholog is a seed. The ground that holds is target doubt, direct imaging of the human protein
      showing minimal cytoplasmic signal against a mouse seed that is a colocalisation in neurons annotated
      is_active_in. A reviewer who weighs the SynGO row more heavily could defend KEEP_AS_NON_CORE.
- gene_file: genes/human/KASH5/KASH5-ai-review.yaml
  rows:
  - go_id: GO:0000781
    go_label: chromosome, telomeric region
    family: PTHR47300
    ibd_node: PTN002933398
    tree_reading: >-
      IBD at the family root PTN002933398 (18 leaves, 15 species) with one seed, mouse Kash5 (MGI:2687329).
      Child clade PTN008715913 (16 leaves, tetrapod KASH5) holds both the target and the seed; the other
      child PTN005340584 is two spotted gar leaves. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002933398
    evidence_checked:
    - >-
      QuickGO, mouse Kash5 (Q80VJ8) on GO:0000781, located_in IDA PMID:22826121 (UniProt) plus the IBA and
      a SubCell IEA.
    - >-
      Gene review quotes from PMID:22826121 (full text cached), KASH5 is telomere-associated in early
      meiosis and SUN1 associates with telomeres on the opposite side of the nuclear envelope.
    review_edited: false
    notes: >-
      Reason already names the node, states that the target is a true ortholog inside the clade and
      puts the over-reach at the seed, immunofluorescence colocalisation of an outer nuclear membrane
      protein with telomeres across the nuclear envelope, propagated as is_active_in. Left alone.
  - go_id: GO:0000800
    go_label: lateral element
    family: PTHR47300
    ibd_node: PTN002933398
    tree_reading: >-
      Same node and clades as the telomeric region row. IBD at PTN002933398 (18 leaves), one seed, mouse
      Kash5, in the target's child clade PTN008715913 (16 leaves).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002933398
    evidence_checked:
    - >-
      QuickGO, Q80VJ8 on GO:0000800, located_in IDA PMID:24062341 (MGI) plus the IBA.
    - >-
      publications/PMID_24062341.md (full text cached). Spermatocyte spreads double labelled for KASH5 and
      SCP3; KASH5 localizes to the tips of SCP3-positive synaptonemal complexes and, by SIM, forms rings
      at the tips of SCP3 axial strands. SCP3 is used as the axis marker, KASH5 is not shown to be an axis
      component.
    review_edited: false
    notes: >-
      Reason is node-aware and states the seed evidence (foci at the ends of SCP3 axes, which is telomere
      attachment at the nuclear envelope). Left alone.
  - go_id: GO:0007015
    go_label: actin filament organization
    family: PTHR47300
    ibd_node: PTN002933398
    tree_reading: >-
      Same node and clades. IBD at PTN002933398 (18 leaves), one seed, mouse Kash5, in the target's child
      clade PTN008715913 (16 leaves).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002933398
    evidence_checked:
    - >-
      QuickGO, Q80VJ8 on GO:0007015, involved_in IMP PMID:26842404 (UniProt) plus the IBA.
    - >-
      publications/PMID_26842404.md (full text cached). Cytoplasmic actin mesh density was measured after
      SUN1 or KASH5 depletion in mouse oocytes because asymmetric division failed; the F-actin mesh level
      was decreased. A knockdown phenotype, no assay of KASH5 acting on actin.
    review_edited: false
    notes: >-
      Reason states the seed assay and why it does not show participation, and the propagation review
      names the node. Left alone.
  - go_id: GO:0051653
    go_label: spindle localization
    family: PTHR47300
    ibd_node: PTN002933398
    tree_reading: >-
      Same node and clades. IBD at PTN002933398 (18 leaves), one seed, mouse Kash5, in the target's child
      clade PTN008715913 (16 leaves).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002933398
    evidence_checked:
    - >-
      QuickGO, Q80VJ8 on GO:0051653, involved_in IDA PMID:26842404 (UniProt) plus the IBA.
    - >-
      publications/PMID_26842404.md (full text cached). The only statement on spindle position is an
      inference, that because the F-actin mesh was decreased in SUN1 or KASH5 depleted oocytes the
      spindle migration would also be affected. Spindle migration was not measured.
    review_edited: false
    notes: >-
      Reason already says the spindle effect was inferred from the actin phenotype. The seed row is coded
      IDA where the text is a conditional inference from a knockdown; the review calls it knockdown data,
      which matches the paper. Left alone.
- gene_file: genes/human/CIRBP/CIRBP-ai-review.yaml
  rows:
  - go_id: GO:0000398
    go_label: mRNA splicing, via spliceosome
    family: PTHR48034
    ibd_node: PTN000391532
    tree_reading: >-
      IBD at PTN000391532 (374 leaves, 84 species) with five seeds, all inside the target's child clade
      PTN000391533 (247 leaves); the other child PTN008282947 (127 leaves, plants and protists) has none.
      The target sits in the CIRBP and RBM3 clade PTN008483167 (45 leaves). Its sister at PTN009224850
      (113 leaves) is the RBMX clade PTN002690247 (68 leaves), which holds the two rat seeds (RGD:1565256
      Rbmx, RGD:1306751 RBMX-like). TRA2A and TRA2B are in PTN008483171 (50 leaves) and join at PTN004472736
      (167 leaves); fly tra2 joins at PTN002690243 (214 leaves). Nucleolin joins further out at PTN004472692
      (228 leaves). No loss for this term in the family; the only process IBD inside the 247-leaf clade
      is regulation of translation at the RBM3 node PTN002554641.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:0000398 with descendants. TRA2B (P62995) and TRA2A (Q13595) involved_in IDA PMID:9546399
      (UniProt); fly tra2 (P19018) IDA PMID:1518835 and PMID:8334698; rat Rbmx (Q4V898) IMP to mRNA splice site
      recognition PMID:19282290 (RGD); rat Rbmxrtl (P84586) IDA to the same term, same paper.
    - >-
      QuickGO on GO:0008380 RNA splicing with descendants for human CIRBP (Q14011), human RBM3 (P98179),
      mouse Cirbp (P60824) and mouse Rbm3 (O89086), each returned only the IBA. The same query shape
      returned the experimental rows for the seeds.
    - >-
      Alliance gene pages for the two RGD seed ids, RGD:1565256 is Rbmx and RGD:1306751 is Rbmxl1, not
      Tra2 as the earlier reason and the project note said.
    - >-
      PubMed search for CIRBP or CIRP with splicing or spliceosome in title or abstract, 31 hits; the
      first 15 by relevance are about splicing of the Cirbp transcript itself or unrelated, none reports
      CIRBP as a splicing regulator.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason called PTN008729690 the CIRBP subfamily
      node (it is the family root, 406 leaves), named the rat seeds as Tra2, and described the term
      as crossing a divergence boundary. On the tree CIRBP is nested among the seeds with the RBMX clade
      as sister, so there is no NODE_TOO_DEEP ground for this gene and no IBD move would take the term
      off it. What remains is doubt on a well studied subfamily with no splicing evidence, which is
      a weak ground; KEEP_AS_NON_CORE is the alternative reading and a later reviewer may prefer it.
      The IBD is too deep for other branches (nucleolin, and the plant and protist clade PTN008282947),
      where MOVE_IBD to PTN002690243 would apply, but that does not affect CIRBP. The CIRBP section of
      projects/IBA_REVIEW.md and interpro/panther/PTHR48034/PTHR48034-review.md repeat the wrong node
      and the rat Tra2 naming, and recommend an IRD at PTN008729690, which is the family root; they
      were not edited. An IRD on PTN008483167 would need evidence of loss that is not available.
  - go_id: GO:0005681
    go_label: spliceosomal complex
    family: PTHR48034
    ibd_node: PTN000391532
    tree_reading: >-
      IBD at PTN000391532 (374 leaves) with three seeds, TRA2B, human RBMX and RGD:1306751 (rat RBMX-like),
      all in the target's child clade PTN000391533 (247 leaves). Human RBMX is in PTN002690247 (68 leaves),
      the sister of the CIRBP and RBM3 clade PTN008483167 (45 leaves) at PTN009224850 (113 leaves); TRA2B
      joins at PTN004472736 (167 leaves). No loss for this term in the family.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:0005681 with descendants. RBMX (P38159) part_of IDA to catalytic step 2 spliceosome
      PMID:11991638 and to supraspliceosomal complex PMID:19282290 (UniProt); TRA2B (P62995) part_of IMP
      PMID:25689357 (CAFA); rat Rbmxrtl (P84586) supraspliceosomal complex IDA PMID:19282290. CIRBP, RBM3
      and mouse Cirbp returned only the IBA.
    - >-
      Gene review quote from PMID:22365833 (kept), more than 200 proteins copurify with spliceosomes.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten for the same tree errors as the splicing row. The TRA2B seed
      is an IMP for a complex membership term from CAFA, which is a weak seed, but RBMX carries two direct
      rows, so the node is not unseeded. Same caveat as above, the ground is doubt and KEEP_AS_NON_CORE
      is the alternative.
- gene_file: genes/human/ABCG2/ABCG2-ai-review.yaml
  rows:
  - go_id: GO:0160244
    go_label: sulfite export across plasma membrane
    family: PTHR48041
    ibd_node: PTN002710469
    tree_reading: >-
      IBD at PTN002710469 (32 leaves, 19 species), the vertebrate ABCG2 clade inside a 1376-leaf family,
      with one seed, mouse Abcg2 (MGI:1347061). Child clade PTN008729993 (27 leaves, tetrapod ABCG2 and
      rodent Abcg3) holds the target and the seed; the other child PTN002710478 is five fish leaves.
      No loss recorded. The placement is sound, target and seed are orthologs.
    ground: BAD_SEED
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002710469
    evidence_checked:
    - >-
      QuickGO, mouse Abcg2 (Q7TMS5) on GO:0160244, acts_upstream_of_or_within IDA PMID:30042379 (MGI) plus the IBA.
      QuickGO by exact term, the only experimental rows on GO:0160244 anywhere are this one and four
      S. pombe TAS rows.
    - >-
      QuickGO by reference PMID:30042379, four MGI rows on Abcg2, all with extension has_input CHEBI:43355,
      to GO:0160244, GO:1902358 sulfate transmembrane transport, GO:0015419 ABC-type sulfate transporter activity
      and GO:0009404 toxin metabolic process. OLS gives CHEBI:43355 as indoxyl sulfate.
    - >-
      Full text of PMID:30042379 (PMC6057959 through Europe PMC, and publications/PMID_30042379.md fetched
      by validation). ATP-dependent transport of indoxyl sulfate in membrane vesicles from HEK293A cells
      expressing human ABCG2, and reduced indoxyl sulfate excretion in Abcg2 knockout mice with CKD.
      The word sulfite does not occur in the text; supplementary files were not read.
    - >-
      QuickGO term record, GO:0160244 is the directed movement of sulfite out of the cell (definition
      references PMID:17322211 and PMID:30859719).
    review_edited: true
    notes: >-
      MARK_AS_OVER_ANNOTATED changed to REMOVE. The earlier reason argued from the absence of evidence
      on human ABCG2 and guessed at an ancestral or paralog activity; the seed is the mouse ortholog
      and its paper is about an organic sulfate ester, not sulfite. Added source_defects (WRONG_TERM,
      MGI, CONFIRMED, DELETE_ROW), a supported_by quote and the reference. The same paper's sulfate
      transport and ABC-type sulfate transporter rows on mouse Abcg2 have the same problem and are
      mentioned in the defect. The review's suggested question and suggested experiment on sulfite export
      were left in place and now read as answered by the seed check. No family review for PTHR48041.
- gene_file: genes/human/MTHFD1L/MTHFD1L-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR48099
    ibd_node: PTN000002250
    tree_reading: >-
      IBD at the family root PTN000002250 (389 leaves, 136 species) with five seeds, none in the MTHFD1L
      clade. Human MTHFD1 and mouse Mthfd1 are in PTN002878475 (24 leaves) and meet the target lineage
      at PTN000002272 (44 leaves), the MTHFD1 and MTHFD1L duplication; yeast ADE3 joins at PTN000002266
      (135 leaves), Leishmania Q4Q9F9 at PTN000002252 (328 leaves) and E. coli FolD is in the other root
      child PTN000002429 (37 leaves). The MTHFD1L clade is PTN002878462 (20 leaves, with NOT IRD records
      for folate cycle and cyclohydrolase activity) and inside it PTN000002274 (15 leaves) carries IBD
      mitochondrion seeded by human MTHFD1L and mouse Mthfd1l. A NOT IRD for cytosol exists at PTN000002329
      (the MTHFD2 and MTHFD2L clade, which joins the target lineage at PTN008294747); none on the MTHFD1L
      clade.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000002274
    evidence_checked:
    - >-
      interpro/panther/PTHR48099/PTHR48099-paint.tsv, IBD mitochondrion at PTN000002274 seeded by MGI:1924836
      and Q6UB35; IRD NOT cytosol at PTN000002329. Alliance gene page confirms seed MGI:1342005 is Mthfd1.
    - >-
      publications/PMID_12937168.md (full text cached). Subfractionated CHO cells expressing the human
      cDNA, with glutamate dehydrogenase and lactate dehydrogenase as fraction markers, show the 107 kDa
      protein in the mitochondrial fraction and not the cytoplasmic one; the authors conclude it localizes
      exclusively to mitochondria.
    - >-
      QuickGO on GO:0005829 with descendants for human MTHFD1L (Q6UB35) and mouse Mthfd1l (Q3V3R1), only
      the IBA on each.
    - >-
      interpro/panther/PTHR48099/PTHR48099-review.yaml assesses the root cytosol IBD as NEEDS_PRUNING, naming
      the MTHFD1L subfamily SF12, and the PTN000002329 loss as LOSS_SUPPORTED.
    review_edited: true
    notes: >-
      MARK_AS_OVER_ANNOTATED changed to REMOVE. The earlier reason itself said the gene is exclusively
      mitochondrial and kept the row only because the family tree is legitimate; a location shown not
      to hold for the target is wrong for it, and PAINT has already made the same call for the MTHFD2
      clade. ADD_IRD is placed at PTN000002274, the node where PAINT asserts mitochondrion from experimental
      seeds; PTN002878462 (20 leaves), where the other MTHFD1L losses sit, is the wider alternative if
      the curator judges the fish and other basal members mitochondrial too. Agrees with the family
      review.
- gene_file: genes/human/MMUT/MMUT-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR48101
    ibd_node: PTN000601447
    tree_reading: >-
      IBD at PTN000601447 (47 leaves, 42 species) with two seeds, human MMUT (the target) and C. elegans
      mmcm-1, both in child clade PTN000601448 (38 leaves, eukaryotes). The other child PTN000601492 is
      nine bacterial mutases. PTN000601448 carries IBD mitochondrion from the same two seeds. No loss
      recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:0005737 with descendants. Human MMUT (P22033) located_in cytoplasm IDA PMID:28943303 (UniProt),
      mitochondrion IDA (same paper), HTP and TAS, mitochondrial matrix IDA PMID:24458 and Reactome TAS.
      Worm mmcm-1 (Q23381) is_active_in mitochondrion IDA PMID:16843692 and HDA PMID:20188671, no row to cytoplasm
      itself.
    - >-
      Gene review, every mitochondrion and mitochondrial matrix row is ACCEPT; UniProt record has a transit
      peptide feature.
    review_edited: true
    notes: >-
      Not an over-annotation. The node is seeded by the target and the worm ortholog, and PAINT put
      the general term at the node that includes bacteria and mitochondrion one node down, which is
      a deliberate placement. Mitochondrion is part of cytoplasm in GO, so the term is true of MMUT
      and entailed by its accepted mitochondrial rows (pattern 22, true and general). The earlier reason
      argued the term is less informative, which is the TOO_GENERAL case. The IEA (GO_REF:0000044) and
      IDA (PMID:28943303) rows on the same term were changed to TOO_GENERAL as well for action consistency.
      No family review for PTHR48101.
