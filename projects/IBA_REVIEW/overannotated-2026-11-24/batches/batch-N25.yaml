genes:
- gene_file: genes/ARATH/ASK8/ASK8-ai-review.yaml
  rows:
  - go_id: GO:0030154
    go_label: cell differentiation
    family: PTHR24057
    ibd_node: PTN000624299
    tree_reading: >-
      IBD at the family root PTN000624299 (528 leaves, 99 species) with 11 seeds. Children are PTN000624300 (91
      leaves, animal GSK3A and GSK3B, fly sgg, worm gsk-3, yeast) and PTN007767143 (437 leaves, protists and
      plants), which holds ASK8 (leaf PTN000623376). Read with a helper, the smallest node holding ASK8 and the
      only plant seed, BIN2/ASK7 (Q39011, AT4G18710), is PTN000622182 (375 leaves); the human GSK3B, yeast RIM11
      and Dictyostelium gskA seeds join ASK8 only at the root. The only other process IBD in the target's child
      is brassinosteroid mediated signaling pathway at PTN001527578. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000624299
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human GSK3B (P49841) carries GO:0001837 epithelial to
      mesenchymal transition IMP PMID:15448698 and GO:0031175 neuron projection development IDA PMID:19830702;
      yeast RIM11 (P38615) GO:0030437 ascospore formation IMP PMID:10679022; BIN2 (Q39011) GO:0048765 root hair
      cell differentiation IGI PMID:24771765 with acts_upstream_of_or_within; Dictyostelium gskA (P51136)
      GO:0030154 IMP PMID:7813009 with acts_upstream_of_or_within; mouse Gsk3b (Q9WV60) several rows, all
      acts_upstream_of_or_within; fly sgg (P18431) GO:0030707 and GO:0048477 IMP. ASK8 (Q96287) has the IBA only.
    - >-
      interpro/panther/PTHR24057/PTHR24057-review.yaml rates this node UNRESOLVED for the term, on the ground that
      each seed kinase regulates a lineage-specific fate decision and does not perform differentiation, and
      leaves the call to gene reviews.
    review_edited: false
    notes: >-
      The seeds are eleven unrelated lineage-specific processes (EMT, sporulation, root hair fate, oogenesis,
      stalk and spore fate), most recorded as acts_upstream_of_or_within, and the only thing they share is the
      GO parent. The root IBD turns that parent into involved_in for every GSK3 in eukaryotes, including
      unicellular Giardia and Paramecium leaves. The plant seed BIN2 is a group II kinase 375 leaves away from
      the group III ASK8. The written reason opens with the absence of evidence on ASK8 but its working ground
      is that the seed roles are context specific, so the file was left alone.
- gene_file: genes/ARATH/GAI/GAI-ai-review.yaml
  rows:
  - go_id: GO:0003700
    go_label: DNA-binding transcription factor activity
    family: PTHR31636
    ibd_node: PTN000780710
    tree_reading: >-
      IBD at PTN000780710 (2365 leaves, 38 species), the root of the whole GRAS family, dated 20170228, with three
      seeds, Medicago RAM1 (G7L166), RGA (AT2G01570) and SCR (AT3G54220). The node has nine child clades; GAI
      (leaf PTN000781247, SF271) is in PTN007897709 (179 leaves), whose DELLA node PTN004849723 (29 leaves) carries
      the gibberellin IBDs. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000780710
    evidence_checked:
    - >-
      interpro/panther/PTHR31636/PTHR31636-review.yaml rates the node WRONG_NODE and recommends withdrawing the
      IBD, because DELLA and SHR-SCR proteins have no DNA-binding domain and act through DNA-binding partners.
    - >-
      Same-term rows in the reviews of the seeds and their partners, read from the files. RGA (TAS, ISS and IBA),
      SCR (IMP and two ISS) and SHR (TAS and two ISS) all carry MODIFY.
    - >-
      GAI carries GO:0003713 transcription coactivator activity IDA PMID:25035403 with action ACCEPT, the
      replacement its five GO:0003700 rows already proposed.
    review_edited: true
    notes: >-
      The term is not an over-statement of something GAI does. GAI does not bind DNA, and the review already named
      the activity it has. That is a lateral correction, which the other GRAS reviews record as MODIFY, so the IBA
      row and the four same-term rows (TAS PMID:10421366, ISS PMID:11487693, PMID:11118137 and PMID:9237632) were
      changed from MARK_AS_OVER_ANNOTATED to MODIFY with the replacement they already carried. Quotes untouched.
- gene_file: genes/ARATH/BKI1/BKI1-ai-review.yaml
  rows:
  - go_id: GO:0010423
    go_label: negative regulation of brassinosteroid biosynthetic process
    family: PTHR33312
    ibd_node: PTN004993342
    tree_reading: >-
      IBD at PTN004993342 (63 leaves, 31 species) with one seed, AT5G42750, which is BKI1 itself (Q9FMZ0, leaf
      PTN002117910). Children are PTN004993343 (18 leaves, monocots) and PTN007993754 (45 leaves, eudicots) with
      the target. The family root PTN002117904 (277 leaves) carries kinase inhibitor activity. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN004993342
    evidence_checked:
    - >-
      QuickGO by accession and GO id. BKI1 carries the term once experimentally, IMP PMID:16857903 (TAIR) with the
      qualifier acts_upstream_of_or_within, and once as the involved_in IBA whose with field is AT5G42750.
    review_edited: false
    notes: >-
      The only seed is the target's own phenotype row, which the curator qualified as upstream. The IBD restates
      it as involved_in and spreads it to 63 leaves. BKI1 inhibits the BRI1 kinase; any effect on biosynthetic
      genes is the feedback output of the signalling pathway. The existing reason says this and names the node.
      The IMP row stays KEEP_AS_NON_CORE; the two rows differ in qualifier, which the review explains.
- gene_file: genes/ARATH/SSU3/SSU3-ai-review.yaml
  rows:
  - go_id: GO:0009098
    go_label: L-leucine biosynthetic process
    family: PTHR43345
    ibd_node: PTN002879868
    tree_reading: >-
      IBD at the family root PTN002879868 (106 leaves, 74 species) with three seeds, M. tuberculosis leuD
      (P9WK95), E. coli leuD (P30126) and Arabidopsis SSU1 (AT2G43090, Q9ZW85). Children are PTN002879869 (25
      bacterial and archaeal leaves) and PTN000912602 (81 leaves) with the target. SSU3 (leaf PTN000186632) sits
      in PTN005159301 (4 leaves, SSU3 and three Brassica orthologs), inside PTN005159298 (11 leaves, 3 species),
      which holds the SSU2, SSU3 and SSU1 groups of Arabidopsis and Brassica. There is no node that holds SSU2
      and SSU3 without SSU1. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Clade membership of PTN005159301, PTN005159298, PTN005159297 and PTN005159295 listed from the cached tree
      with a helper.
    - >-
      The row quotes PMID:24608865 twice, once that SSU2 and SSU3 play no substantial role in Leu biosynthesis and
      once that residual Leu biosynthesis occurs by the participation of SSU2 and/or SSU3; quotes left as they are.
    - >-
      interpro/panther/PTHR43345/PTHR43345-review.yaml rates the node NEEDS_PRUNING and asks for IRDs on the SSU2
      and SSU3 branches and on the methanogen HacB branch.
    review_edited: false
    notes: >-
      The seed SSU1 is in the same 11-leaf Brassicaceae clade, so the node is soundly seeded next to the target.
      The ground is evidence on SSU3 itself, a weak and conditional contribution to leucine synthesis that shows
      only when SSU1 is depleted, which is doubt and not loss. The family review goes further and asks for a loss;
      if PAINT agrees, the SSU3 node is PTN005159301 and SSU2 needs its own, since the tree gives no shared node.
      The existing reason states the divergence and the residual role and was left alone.
- gene_file: genes/ARATH/FTSH12__Q9SAJ3/FTSH12__Q9SAJ3-ai-review.yaml
  rows:
  - go_id: GO:0004222
    go_label: metalloendopeptidase activity
    family: PTHR43655
    ibd_node: PTN008683692
    tree_reading: >-
      IBD at the family root PTN008683692 (266 leaves, 101 species) with two seeds, human AFG3L2 (Q9Y4W6) and
      SPG7 (Q9UQ90). Children are PTN008683693 (264 leaves) with the target and both seeds, and two single
      bacterial ftsH leaves. FTSH12 (leaf PTN000554352) is in PTN001130034 (33 leaves, 29 species), below
      PTN000554085 (263 leaves), which carries the m-AAA complex and mitochondrial protein processing IBDs. No
      loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      The row quotes PMID:30309901 (only FtsH12 keeps the zinc binding site, and the motif is dispensable for its
      essential function) and PMID:33216923 (normal proteolytic maturation of imported proteins irrespective of
      FTSH12 abundance); quotes left as they are.
    - >-
      interpro/panther/PTHR43655/PTHR43655-review.yaml gives the term scope UNRESOLVED for FTSH12 on the same
      evidence.
    - >-
      Batch N10 of the REMOVE pass upheld the removal of the two PTN000554085 terms from FTSH12 and named
      PTN001130034 as its clade.
    review_edited: false
    notes: >-
      The seeds are sound and the catalytic site is retained in FTSH12, so there is no loss to record. The doubt
      is on the target, where the H769Y zinc-site mutant complements the knockout and no proteolytic activity or
      substrate has been found. A peptidase assay of FTSH12 or of the Ycf2/FtsHi complex would settle it. The
      existing reason states this and names the node.
- gene_file: genes/ARATH/ARR5/ARR5-ai-review.yaml
  rows:
  - go_id: GO:0006355
    go_label: regulation of DNA-templated transcription
    family: PTHR43874
    ibd_node: PTN008123536
    tree_reading: >-
      IBD at PTN008123536 (1245 of 1247 leaves) with four seeds, rice RR22 (Q5SML5) and Arabidopsis PRR9
      (AT2G46790), PRR7 (AT5G02810) and PRR5 (AT5G24470). Children are PTN008685974 (66 leaves), PTN001981823 (599
      leaves) with the target, and PTN000724199 (580 leaves). Read with a helper, RR22 joins ARR5 only at the IBD
      node, and the three PRR seeds join it at PTN001982700 (598 leaves). ARR5 (leaf PTN000724216) is inside
      PTN008685986 (403 leaves), the type-A clade, which holds no seed for the term; ARR8 joins ARR5 at
      PTN008123267 (390 leaves) and ARR4 at PTN005186799 (97 leaves). PTN005186793 (101 leaves) carries the
      cytokinin-activated signaling IBD. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008685986
    evidence_checked:
    - >-
      Seed positions read from the cached tree by accession (Q5SML5, Q8L500, Q93WK5, Q6LA42), with ARR1 (Q940D0),
      ARR8 (O80365) and ARR4 (O82798) as markers.
    - >-
      interpro/panther/PTHR43874/PTHR43874-review.yaml rates the node NEEDS_PRUNING for the term and recommends an
      IRD at PTN008685986. Batch N11 of the REMOVE pass named the same node for the two DNA-binding terms on ARR5.
    - >-
      The row quotes PMID:11574878 (ARR4 to ARR7 described as transcription repressors in a feedback loop) and
      PMID:16965536 (type-A regulators act at the level of the histidine phosphotransfer proteins).
    review_edited: false
    notes: >-
      The seeds are sound for the DNA-binding type-B and PRR clades. The type-A clade has no seed and no output
      domain, and its effect on transcription runs through the phosphorelay, so the term overstates ARR5 without
      being false in the loose sense the TAS row (acts_upstream_of_or_within) records. The seeds sit in two
      different clades, so the IBD cannot be moved to one node; the fix that fits is the family review's loss on
      the type-A clade. The existing reason rests on domain architecture and was left alone.
- gene_file: genes/ARATH/APG__Q9LU14/APG__Q9LU14-ai-review.yaml
  rows:
  - go_id: GO:0008610
    go_label: lipid biosynthetic process
    family: PTHR45642
    ibd_node: PTN005219546
    tree_reading: &gdsl_tree >-
      IBD at the family root PTN005219546 (960 leaves, 51 species) with one seed, P. aeruginosa EstA (O33407).
      Children are PTN005219547 (952 leaves, plant, algal and fungal GDSL proteins), which holds the target, and
      PTN005220548 (8 leaves, 5 bacterial species), which holds the seed. The target's lineage passes through
      PTN008693276 (892 leaves). The root also carries carboxylic ester hydrolase activity. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &gdsl_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN005219546
    evidence_checked: &gdsl_ev
    - >-
      Batch N12 of the REMOVE pass read the seed in QuickGO (O33407 GO:0008610 IMP PMID:17631636, UniProt) and
      the genes/PSEAE/estA review, which marks that IMP row over-annotated after a full-text read (an estA
      deletion makes little rhamnolipid, and no step of rhamnolipid synthesis needs an esterase).
    - >-
      The row carries a GO_CENTRAL source defect that asks for the IBD to be withdrawn from PTN005219546.
    review_edited: false
    notes: >-
      The single seed is a necessity phenotype read as participation, in a bacterial clade of 8 leaves, and the
      root IBD carries it to 952 eukaryotic leaves. Batch N12 removed the term from two bacterial members that
      have a characterised, different activity. This plant member has no characterised activity at all, so nothing
      on the target shows the term false, and the over-annotation call fits. The existing reason names the node
      and the seed and was left alone.
