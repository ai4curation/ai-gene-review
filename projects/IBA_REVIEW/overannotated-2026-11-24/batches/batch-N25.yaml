- gene_file: genes/ARATH/JAG/JAG-ai-review.yaml
  rows:
  - go_id: GO:0010093
    go_label: specification of floral organ identity
    family: PTHR45730
    ibd_node: PTN005241684
    tree_reading: >-
      IBD at PTN005241684 (41 leaves, 27 species) with two seeds, AT1G68480, which is JAG itself (Q6S591, leaf
      PTN001237677), and rice SL1 (Q9LG97). Children are PTN005241686 (40 leaves), which holds JAG and SL1, and a
      single Amborella leaf. The node also carries stamen development. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession. Rice SL1 carries GO:0010094 specification of carpel identity and GO:0010097
      specification of stamen identity, both IMP PMID:19453444 (UniProt), which are children of the term. JAG
      carries the term as IMP PMID:14973281 (TAIR) with acts_upstream_of_or_within, plus the IBA.
    - >-
      publications/PMID_14973281.md is abstract only. It describes jag plants with abnormally shaped lateral
      organs and says nothing of changed organ identity.
    review_edited: true
    notes: >-
      Action unchanged. The node is soundly seeded by the rice gene, whose mutant has homeotic changes, and JAG is
      in the seeded clade and is the other seed. The doubt is on JAG, whose mutant organs keep their identity and
      whose own row is qualified as upstream by the curator. The propagation comment said the node had not been
      inspected and the reason did not mention the rice seed, so both were rewritten to state the tree. The IMP
      row on the same term keeps the same action.
- gene_file: genes/ARATH/SUR1/SUR1-ai-review.yaml
  rows:
  - go_id: GO:0004838
    go_label: L-tyrosine:2-oxoglutarate transaminase activity
    family: PTHR45744
    ibd_node: PTN000202983
    tree_reading: &sur1_tree >-
      IBD at PTN000202983 (293 of 300 leaves, 77 species). Children are PTN000202984 (37 leaves, animal TAT, with
      the human, mouse, rat, fly and worm seeds) and PTN008160331 (256 leaves, protists and plants) with the
      target. SUR1 (leaf PTN001368372) is in PTN005243494 (6 leaves, SUR1 and five Brassica orthologs), inside
      PTN000203027 (45 leaves, 3 species, a Brassicaceae expansion). That 45-leaf clade also holds the seed TAT
      (AT5G36160, Q9LVY1) and the CORI3 pair PTN005243512 (CORI3 and At4g23590), on which PAINT records an IRD for
      both GO:0004838 and GO:0006572. The other plant seed, AT5G53970 (Q9FN30), joins SUR1 at PTN005243319 (244
      leaves).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked: &sur1_ev
    - >-
      Clade membership and the two IRD records read from the cached tree and interpro/panther/PTHR45744 paint
      table (PTN005243512, GO:0004838 dated 20260530 and GO:0006572 dated 20220303).
    - >-
      The row quotes PMID:23073363 (a SUR1-like enzyme from Taraxacum with no in vitro tyrosine aminotransferase
      activity) and PMID:14871316 (SUR1 as the C-S lyase of glucosinolate biosynthesis); quotes left as they are.
    review_edited: false
    notes: >-
      The node is soundly seeded and one seed is in SUR1's own 45-leaf clade. The doubt is on the SUR1 subfamily,
      which works as a C-S lyase, and rests on a homolog assay from another species, not on SUR1. PAINT has
      already judged the same kind of divergence real for the neighbouring CORI3 pair, which is the precedent for
      a loss at PTN005243494 if a tyrosine aminotransferase assay of SUR1 comes out negative. The existing reason
      states the divergence without misplacing the gene.
  - go_id: GO:0006572
    go_label: L-tyrosine catabolic process
    family: PTHR45744
    ibd_node: PTN000202983
    tree_reading: *sur1_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked: *sur1_ev
    review_edited: false
    notes: >-
      Follows the activity row. Five seeds, the same two Arabidopsis genes plus fly, mouse and human TAT. The
      process is in doubt on SUR1 for the same reason the activity is.
- gene_file: genes/ARATH/LYK4/LYK4-ai-review.yaml
  rows:
  - go_id: GO:0071219
    go_label: cellular response to molecule of bacterial origin
    family: PTHR45927
    ibd_node: PTN001988303
    tree_reading: >-
      IBD at PTN001988303 (36 leaves, 24 species) with one seed, AT2G23770, which is LYK4 itself (O64825, leaf
      PTN001564422). Children are PTN008172410 (13 leaves) and PTN001988305 (23 leaves) with the target. The
      family root PTN001232170 (292 leaves) carries the parent term response to molecule of bacterial origin. No
      loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001988303
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. LYK4 carries GO:0071219 as IEP PMID:22744984 (UniProt) and
      as the IBA whose with field is AT2G23770. No other experimental row under GO:0002237.
    - >-
      The row quotes PMID:22744984 (the LYK1 and LYK4 mutations have a negligible impact on flg22 or elf26
      signaling); quote left as it is.
    review_edited: false
    notes: >-
      The only seed is an expression row on the target, LYK4 transcript induced by flg22, and the same paper found
      no effect of the lyk4 mutation on flagellin or EF-Tu signalling. Induction of a transcript is not
      participation in the response, and the IBD spreads it over 36 leaves. The IEP row carries the same action.
      The existing reason names the seed and its evidence type.
- gene_file: genes/ARATH/LYK5/LYK5-ai-review.yaml
  rows:
  - go_id: GO:0002237
    go_label: response to molecule of bacterial origin
    family: PTHR45927
    ibd_node: PTN001232170
    tree_reading: >-
      IBD at the family root PTN001232170 (292 leaves, 38 species) with two seeds, LYK4 (AT2G23770, O64825) and
      Medicago NFP (Q0GXS4). Children are PTN001563697 (291 leaves) and one Marchantia leaf. Read with a helper,
      LYK5 (leaf PTN001563698) joins LYK4 at PTN008701129 (134 leaves) and joins NFP only at PTN001563697. NFP sits
      in PTN005260948 (4 leaves, Medicago and soybean NFR5), inside PTN001988223 (40 leaves, 28 species). The
      family's three Arabidopsis leaves are LYK2, LYK4 and LYK5; CERK1 is not in this family. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN005260948
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. NFP (Q0GXS4) carries GO:0002237 IMP PMID:12753588
      (UniProt); LYK4 carries only the child term GO:0071219 as IEP PMID:22744984; LYK5 (O22808) carries the IBA
      only.
    - UniProt record Q0GXS4 read for identity (NFP, Nod factor perception protein, PTHR45927:SF2).
    - >-
      The row quotes PMID:25340959 (untreated lyk5-2 plants have wild-type resistance to Pst DC3000); quote left
      as it is.
    review_edited: true
    notes: >-
      Action unchanged. One seed is the Nod factor receptor of legumes, a sound row for a rhizobial signal, and
      the other is the LYK4 expression row judged above. The root IBD carries the legume symbiosis reading to
      every LysM pseudokinase, LYK5 among them, whose ligand is fungal chitin and whose mutant has normal basal
      resistance to bacteria. The written reason said the node includes CERK1 and left the second donor untraced;
      CERK1 is not a leaf of this family and the donor is NFP, so the reason and the propagation comments were
      rewritten. The move names the legume NFP and NFR5 clade; the wider ortholog clade PTN001988223 is the
      alternative if PAINT wants the non-legume orthologs covered.
- gene_file: genes/ARATH/VRN5/VRN5-ai-review.yaml
  rows:
  - go_id: GO:0140006
    go_label: histone H3 reader activity
    family: PTHR46286
    ibd_node: PTN008198652
    tree_reading: >-
      IBD at the family root PTN008198652 (166 leaves, 36 species) with one seed, AT4G30200 (VEL1/VIL2). Children
      are PTN005294067 (163 leaves, angiosperm VEL proteins), which holds the seed and the target, and three
      Selaginella leaves. VRN5 (leaf PTN000497504) is in PTN000497502 (63 leaves, 33 species) and joins the
      VIN3 and VEL1 groups only at PTN005294067. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Batch N13 of the REMOVE pass read the seed (VIL2 Q9SUM4 GO:0062072 IDA PMID:20837520) and the full text of
      PMID:36174674, where the VIN3 superdomain binds no H3 tail by ITC or NMR and the authors could not
      reproduce the earlier pull-down. It upheld the removal from VIN3 with a loss at the VIN3 clade.
    - >-
      The row quotes PMID:36174674 and PMID:40858112 (in VRN5 the PHD superdomain packs against the FNIII domain
      and binds the PRC2 core); quotes left as they are.
    review_edited: false
    notes: >-
      VIN3 was removed because the negative binding data are on VIN3 itself. VRN5 was not assayed, so what stands
      against the term is evidence on the subfamily's shared superdomain and on what the module does in VRN5,
      which is doubt and not shown loss. A histone tail binding assay of the VRN5 superdomain would settle it.
      The existing reason says the VRN5 module was not assayed and was left alone.
- gene_file: genes/ARATH/LHP1/LHP1-ai-review.yaml
  rows:
  - go_id: GO:0043565
    go_label: sequence-specific DNA binding
    family: PTHR47240
    ibd_node: PTN005337474
    tree_reading: >-
      IBD at the family root PTN005337474 (64 leaves, 34 species) with one seed, AT5G17690, which is LHP1 itself
