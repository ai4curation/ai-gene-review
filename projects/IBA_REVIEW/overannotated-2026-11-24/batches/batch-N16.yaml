- gene_file: genes/DROME/orb__Q9VCN7/orb__Q9VCN7-ai-review.yaml
  rows:
  - go_id: GO:0008135
    go_label: translation factor activity, RNA binding
    family: PTHR12566
    ibd_node: PTN000286163
    tree_reading: >-
      IBD at the family root PTN000286163 (118 leaves) with two seeds, mouse Cpeb3 (MGI:MGI:2443075, Q7TN99)
      and human CPEB3 (Q8NE35). Children are PTN000971208 (81 leaves, the CPEB2, CPEB3, CPEB4 and Orb2 side;
      holds both seeds) and PTN000971189 (37 leaves, the CPEB1 side; holds Orb at leaf PTN000286204). The
      CPEB1 child clade holds no seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000971208
    evidence_checked:
    - >-
      QuickGO Q7TN99 x GO:0008135 returns enables IDA PMID:22153079 and PMID:24155305 (UniProt);
      Q8NE35 returns enables IDA PMID:22711986 (UniProt).
    - interpro/panther/PTHR12566/PTHR12566-review.yaml has no node assessment for this term.
    review_edited: false
    notes: >-
      Both seeds sit in the sister child clade. The reason names the root node, places the donors in the
      CPEB3 subfamily and gives the biological doubt (Orb acts through 3-prime UTR binding and poly(A)
      polymerase recruitment). Left alone.
  - go_id: GO:0043005
    go_label: neuron projection
    family: PTHR12566
    ibd_node: PTN000286163
    tree_reading: >-
      IBD at the family root PTN000286163 (118 leaves) with six seeds spread over both child clades. Fly
      Orb2 (FB:FBgn0264307), mouse and human CPEB3 and CPEB4-side members are in PTN000971208 (81 leaves);
      rat Cpeb1 (P0C279) is in the target's child clade PTN000971189 (37 leaves). PAINT records NOT IRD
      for neuron projection and for synapse at PTN001758165 inside the 81-leaf clade.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P0C279 x GO:0043005 with descendants returns located_in IDA growth cone GO:0030426
      (PMID:19864575, RGD), so the target's own child clade is seeded.
    - >-
      publications/PMID_21900268.md, quoted on the row, says orb has no known somatic functions or
      expression outside of the germline.
    review_edited: false
    notes: >-
      Node placement is sound, since both child clades hold seeds. The doubt is on the target. In flies the
      neuronal CPEB is the paralog Orb2 and Orb is described as germline-restricted. That is a statement
      of nothing known, short of a demonstrated absence from neurons, so it stays an over-annotation and
      not a removal. Showing that Orb protein is absent from larval and adult neurons would settle it and
      would justify a loss on the Orb leaf, for which the NOT IRD at PTN001758165 is a precedent. The
      reason states the germline ground. Left alone.
