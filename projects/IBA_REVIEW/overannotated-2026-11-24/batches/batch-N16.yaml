- gene_file: genes/DROME/didum/didum-ai-review.yaml
  rows:
  - go_id: GO:0006897
    go_label: endocytosis
    family: PTHR13140
    ibd_node: PTN008546178
    tree_reading: >-
      IBD at PTN008546178 (251 leaves) with seven seeds. Children are PTN008546179 (231 leaves, animal
      myosins of several classes; holds didum) and PTN000993598 (20 leaves, fungal class V). Human, pig,
      chicken and mouse MYO6 seeds are in the class VI clade PTN002295786 (44 leaves), which joins didum
      only at PTN008546179. Mouse Myo7a and the zebrafish seed (ZFIN:ZDB-GENE-020709-1, myo7aa) are in
      the class VII clade PTN002295382 (39 leaves), joining didum at PTN008345533 (149 leaves). Yeast MYO2 (SGD:S000005853) is in the fungal child. didum sits in the
      animal class V clade PTN000321198 (81 leaves, MYO5A, MYO5B, MYO5C and invertebrate orthologs), which
      holds no seed. PAINT records NOT IRD for endocytosis at PTN008546224 (S. pombe myo51 and its S.
      japonicus ortholog) in the fungal clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002295786
    evidence_checked:
    - >-
      QuickGO GO:0006897 with descendants. Human MYO6 Q9UM54 involved_in IMP PMID:15247260 (UniProt).
      Mouse Myo7a P97479 has only acts_upstream_of_or_within IMP on phagocytosis and phagolysosome
      assembly (PMID:12743369, MGI). Yeast MYO2 P19524 has IMP on receptor-mediated endocytosis
      GO:0006898 (PMID:37647159, SGD). didum A1Z6Z8 has only the IBA.
    review_edited: false
    notes: >-
      No seed in the 81-leaf animal class V clade, and the fly protein's documented cargo is exocytic and
      recycling traffic toward the plasma membrane. The reason names the node and the seed classes and
      gives this doubt. Left alone. The move needs a second IBD on the Myo7a clade PTN002295382 if its
      phagocytosis seed is kept, and the yeast MYO2 seed would need its own placement in the fungal clade.
