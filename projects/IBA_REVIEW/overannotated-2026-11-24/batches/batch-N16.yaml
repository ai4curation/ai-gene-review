    ibd_node: PTN000286163
    tree_reading: >-
      IBD at the family root PTN000286163 (118 leaves) with one seed, mouse Cpeb2 (MGI:MGI:2442640, Q812E0),
      in the child clade PTN000971208 (81 leaves). Orb is in the other child, PTN000971189 (37 leaves, CPEB1
      side), which holds no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000971208
    evidence_checked:
