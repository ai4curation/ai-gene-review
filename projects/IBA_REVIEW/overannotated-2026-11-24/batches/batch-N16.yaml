- gene_file: genes/DROME/mus81/mus81-ai-review.yaml
  rows:
  - go_id: GO:0000712
    go_label: resolution of meiotic recombination intermediates
    family: PTHR13451
    ibd_node: PTN000335543
    tree_reading: >-
      IBD at PTN000335543 (134 leaves) with three seeds, all in the child clade PTN000335544 (60 leaves,
      animals, fungi and amoebozoa) that holds fly mus81; the other child PTN007614664 (74 leaves, plants
      and protists) holds none. S. pombe mus81 (P87231) and S. cerevisiae MUS81 (Q04149) are in the fungal
      clade PTN001003088 (16 leaves), joining the fly at PTN000335545 (51 leaves). C. elegans mus-81
      (P91153) is in PTN001003075 (4 leaves) and joins the fly at the protostome node PTN000335574 (9
      leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0000712. P87231 has IDA, IMP and IGI from PMID:11719193 (PomBase); Q04149 has IGI
      PMID:18691964 (SGD); P91153 has IGI PMID:23901331 (WB) and PMID:29879106 (UniProt); fly Q9V3T1
      has only the IBA.
    - >-
      publications/PMID_17603121.md, quoted on the row. The fly study found no role for MUS81-MMS4 in
      meiotic crossing over and says its sample could not rule out a role in a subset of crossovers.
    review_edited: false
    notes: >-
      The node is soundly seeded and the fly sits inside the seeded clade, next to the worm seed, so
      placement is not the problem. The doubt is direct evidence on the target that the function is
      absent or minor, short of showing loss. A larger crossover sample in mus81 and mms4 mutants, alone
      and with mei-9, would settle it; if no contribution is found the fix would be a loss on the fly
      leaf. The reason states this. Left alone.
  - go_id: GO:0031573
    go_label: mitotic intra-S DNA damage checkpoint signaling
    family: PTHR13451
    ibd_node: PTN000335543
    tree_reading: >-
      IBD at PTN000335543 (134 leaves) with one seed, S. pombe mus81 (PomBase:SPCC4G3.05c, P87231), in
      the fungal clade PTN001003088 (16 leaves). That clade joins fly mus81 at PTN000335545 (51 leaves),
      two nodes below the IBD node; the animal side and the 74-leaf plant and protist child PTN007614664
      hold no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001003088
    evidence_checked:
    - QuickGO P87231 x GO:0031573 returns involved_in IMP PMID:19037101 (PomBase).
    - >-
      publications/PMID_19037101.md (full text cached; abstract and introduction read). mus81 deletion
      mutants fail to slow replication after MMS; the paper places Mus81 among proteins downstream of
      Cds1 required for checkpoint-dependent slowing.
    - >-
      publications/PMID_28369583.md, quoted on the row, reports that fly Mus81 may exacerbate problems
      caused by HU.
    review_edited: false
    notes: >-
      One fungal seed, asserted for all eukaryotes. The fly data give the reason to doubt the animal
      branch. The reason also argues that the seed is an effector downstream of the checkpoint kinase
      and not a signalling component; the seed row is an IMP for the slowing phenotype and was not
      overruled here, so the ground recorded is placement. The reason does not misstate the tree. Left
      alone.
