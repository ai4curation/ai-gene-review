- gene_file: genes/DROME/Blm/Blm-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR13710
    ibd_node: PTN000344873
    tree_reading: >-
      IBD at the family root PTN000344873 (756 leaves) with six seeds. Children are PTN000344874 (717
      leaves, eukaryotic RecQ helicases; holds Blm) and PTN004433494 (39 leaves, bacterial RecQ; holds the
      E. coli seed P15043). Within the eukaryotic child the seeds are human RECQL4 (O94761) and fly RecQ4
      (FB:FBgn0040290, Q9VSE6) in the RecQ4 clade PTN002299856 (80 leaves), human RECQL5 (O94762) in
      PTN009012067 (41 leaves), a trypanosome protein (Q57TU4) in PTN007621599 (125 leaves), and mouse
      Blm (MGI:MGI:1328362, O88700). Mouse Blm lies in PTN000345006 (33 leaves) and joins fly Blm (leaf
      PTN000345046) at the animal BLM node PTN000345005 (51 leaves). PAINT records NOT IRD for cytoplasm
      at PTN007621582 (17 fungal leaves). A separate IBD for nucleus sits at PTN001415789 (270 leaves).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      UniProt cross-references. MGI:1328362 is mouse Blm (O88700), not a RECQL5 or RECQL4 gene;
      FBgn0040290 is fly RecQ4 (Q9VSE6).
    - >-
      QuickGO GO:0005737 with descendants. Mouse Blm O88700 located_in IDA PMID:17982445 (MGI); fly
      RecQ4 Q9VSE6 located_in IDA PMID:18755177 (FlyBase); human RECQL4 O94761 located_in EXP
      PMID:15317757 (UniProt); E. coli recQ P15043 located_in IDA PMID:2164680 (EcoliWiki); trypanosome
      Q57TU4 IDA GO_REF:0000109 and HTP PMID:36804636; human RECQL5 O94762 has only NAS and IEA under
      this accession; fly Blm Q9VGI8 and human BLM P54132 have only the IBA.
    - >-
      PubMed abstract of PMID:17982445 (doi 10.1038/ncb1664), on telomere lengthening in mouse oocytes
      and cleavage embryos. The abstract does not mention Blm; the paper was not read.
    - genes/human/BLM/BLM-ai-review.yaml keeps the same IBA as KEEP_AS_NON_CORE.
    review_edited: true
    notes: >-
      The earlier reason said the seeds were bacterial RecQ and RECQL5 and RECQL members. The seed
      listed as MGI:1328362 is mouse Blm, in the same animal BLM clade as the target, so the target is
      inside a seeded clade and the reason misstated the tree. Nothing on fly Blm argues against a
      cytoplasmic pool (purification from nuclear extracts shows where it works, not where it is
      absent), so no ground holds and the row moves to KEEP_AS_NON_CORE, as on human BLM. The
      propagation_review block describing a bad propagation was removed and the supported_by quote kept
      unchanged. The mouse seed is a located_in observation from a paper read as abstract only; whether
      a location seen in oocytes should seed is_active_in for a nuclear helicase is a fair question for
      PAINT, but it was not judged here.
- gene_file: genes/DROME/Fadd/Fadd-ai-review.yaml
  rows:
  - go_id: GO:0097191
    go_label: extrinsic apoptotic signaling pathway
    family: PTHR15077
    ibd_node: PTN008354262
    tree_reading: >-
      IBD at PTN008354262 (29 leaves) with two seeds, human FADD (Q13158) and mouse Fadd
      (MGI:MGI:109324, Q61160). Children are PTN002688311 (24 leaves; holds both seeds and fly Fadd,
      which pairs with one other leaf at PTN002688328) and PTN009022604 (5 Trichoplax leaves). The same
      node carries the IBDs for death receptor binding and CD95 death-inducing signaling complex. No
      loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Treeview seed list and clade membership as above; the seeds are the vertebrate FADD orthologs.
    - >-
      The row's own citations (PMID:33824334, PMID:12176339, PMID:11703941, all cached) on the absence
      of a death-domain TNF receptor in flies, Dredd-independent Eiger killing and Imd-dependent death.
    review_edited: false
    notes: >-
      The node is soundly seeded and the fly is inside the seeded child clade. The doubt is on the fly
      lineage. No death-domain receptor of the CD95 type exists in flies, which is why the two sibling
      IBA rows from this node (death receptor binding, CD95 DISC) are REMOVE in the review, while a
      receptor-initiated Fadd and Dredd dependent death through PGRP-LC and Imd has not been excluded.
      Testing whether Imd-pathway activation kills cells in a Fadd and Dredd dependent, Relish
      independent way would settle it. The reason names the node and states this. Left alone.
- gene_file: genes/DROME/Vhl/Vhl-ai-review.yaml
  rows:
  - go_id: GO:0003714
    go_label: transcription corepressor activity
    family: PTHR15160
    ibd_node: PTN000389241
    tree_reading: >-
      IBD at PTN000389241 (32 leaves, bilaterian VHL) with one seed, human VHL (P40337). Children are
      PTN000389242 (23 leaves, vertebrates; holds the seed) and PTN002689241 (9 leaves, protostomes;
      holds fly Vhl at leaf PTN004469213 with nematodes, mosquito, beetle, Daphnia, tick and leech). The
      protostome clade holds no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000389242
    evidence_checked:
    - QuickGO P40337 x GO:0003714 returns enables IEP PMID:11641274 assigned by DisProt, plus the IBA.
    - >-
      PubMed abstract of PMID:11641274 (doi 10.1101/gad.924501). It reports that VHL binds FIH-1 and
      functions as a transcriptional corepressor of HIF-1alpha transactivation by recruiting histone
      deacetylases. Abstract only.
    review_edited: true
    notes: >-
      Action unchanged. The reason was that a corepressor activity is not the conserved core function
      and has no fly evidence, neither of which is a ground. Rewritten to name the node, the single
      vertebrate seed and its evidence, and the unseeded protostome clade. The seed row carries an
      expression-pattern code (IEP) on a molecular function, which the annotating group may want to
      check; the paper was read as abstract only. The IEA row GO:0045892 derived from this IBA keeps
      MARK_AS_OVER_ANNOTATED and was not touched.
  - go_id: GO:0006355
    go_label: regulation of DNA-templated transcription
    family: PTHR15160
    ibd_node: PTN000389241
    tree_reading: >-
      IBD at PTN000389241 (32 leaves) with two seeds, human VHL (P40337) and rat Vhl (RGD:3960, Q64259),
      both in the vertebrate child clade PTN000389242 (23 leaves). Fly Vhl is in the protostome child
      PTN002689241 (9 leaves), which holds no seed.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000389241
    evidence_checked:
    - >-
      QuickGO GO:0006355 exact. Human P40337 involved_in IMP PMID:15824735 (BHF-UCL). Rat Q64259
      involved_in IDA PMID:1966765 (RGD, dated 2005).
    - >-
      PubMed abstract of PMID:15824735 (doi 10.1038/sj.onc.1208649), a microarray comparison of VHL-null
      and VHL-wild-type renal carcinoma cell lines that lists differentially expressed genes.
    - >-
      PubMed record of PMID:1966765 (doi 10.1101/sqb.1990.055.01.006). Its title is on the GABA-A
      receptor family and it dates from 1990. No abstract is available.
    review_edited: true
    notes: >-
      Action unchanged. The reason already said the transcriptional effects are indirect; it now names
      the node, the two seeds, what each seed row rests on and where the fly sits. The human seed is an
      expression phenotype of VHL loss read as participation. The rat seed cites a paper whose title is
      on an unrelated subject, which is a query for RGD (requested change CHECK), since only the PubMed
      record was read. Human VHL also carries IDA rows on negative regulation of transcription by RNA
      polymerase II from the corepressor paper, so a curator who keeps a transcription term for
      vertebrates would move it to PTN000389242; either way it should not reach the protostome clade.
