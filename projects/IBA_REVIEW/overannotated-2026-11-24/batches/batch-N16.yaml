- gene_file: genes/DROME/NtR/NtR-ai-review.yaml
  rows:
  - go_id: GO:0005892
    go_label: acetylcholine-gated channel complex
    family: PTHR18945
    ibd_node: PTN000435923
    tree_reading: &ntr_tree >-
      PANTHER places NtR (Q9W288, leaf PTN000436309, subfamily SF430) deep inside the nicotinic receptor
      part of PTHR18945. Its lineage runs through PTN009034980 (33 leaves), PTN002498480 (67),
      PTN002707760 (84), PTN001825467 (108 leaves; IBD for acetylcholine-gated cation channel activity, 3
      fly seeds), PTN000435923 (455 leaves; IBD for acetylcholine-gated channel complex, 49 seeds),
      PTN001054960 (986 leaves; IBD for cholinergic synaptic transmission, 23 seeds) and PTN000434994
      (991 leaves; IBD for calcium ion transport, 8 seeds). No loss is recorded on the lineage. UniProt
      cross-references the protein to PTHR36695, where the tree does not hold it as a leaf.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &ntr_fix
      paint_action: NONE
    evidence_checked: &ntr_ev
    - >-
      Treeview lineage for Q9W288 in PTHR18945 (above). The four IBD nodes are densely seeded and the
      target is nested inside them, so the seeds were not re-queried.
    - >-
      interpro/panther/PTHR18945/PTHR18945-review.yaml discusses NtR at each of these nodes and
      attributes the propagation to a disputed family placement, not to a node error; it quotes this
      gene review.
    - >-
      The row's own evidence, the residue comparison in genes/DROME/NtR/NtR-bioinformatics (loop C
      vicinal cysteines replaced by M412 and M413, M2 intermediate-ring glutamate replaced by S460) and
      the independent Cys-loop tree cited in NtR-family-evidence.md.
    review_edited: false
    notes: &ntr_notes >-
      The nodes are sound and NtR is inside them as PANTHER draws the tree, so nothing is wrong with the
      IBD placement. The doubt is on the target, namely sequence evidence that it has lost the
      acetylcholine-binding and cation-selectivity hallmarks, and an independent phylogeny that puts it
      outside the nicotinic groups. That is short of showing loss. Non-alpha subunits also lack the
      loop C cysteine pair and still assemble into receptors, and no ligand or electrophysiology data
      exist for NtR. Heterologous expression of NtR alone and with fly nicotinic subunits, with
      acetylcholine and ion-substitution recordings, would settle it. The family review holds that the
      remedy is PANTHER's family assignment (the member index pins Q9W288 to PTHR36695) and not a loss
      below these nodes; if PANTHER keeps NtR in PTHR18945, a loss on the NtR leaf would be needed for
      each of the four terms (pattern 19, one loss per term). The reason states the
      target-specific evidence and says donor count is not the objection. Left alone, and the family
      review quotes this file.
