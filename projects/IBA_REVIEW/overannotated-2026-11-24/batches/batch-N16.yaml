    review_edited: false
    notes: >-
      The reason already says a single donor is not weak support and rests on the donor sitting in a
      different subfamily from the CPEB1 side. Left alone. PTN000971208 is the seeded child of the IBD node;
      a curator may prefer the CPEB2 node further down.
  - go_id: GO:0045202
    go_label: synapse
    family: PTHR12566
    ibd_node: PTN000286163
    tree_reading: >-
      IBD at the family root PTN000286163 (118 leaves) with eight seeds in both child clades. Rat Cpeb1
      (P0C279) and mouse Cpeb1 (P70166) are in the target's child clade PTN000971189 (37 leaves); Orb2 and
      the CPEB2, CPEB3 and CPEB4 seeds are in PTN000971208 (81 leaves). NOT IRD for synapse is recorded at
      PTN001758165 inside the 81-leaf clade.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
