- gene_file: genes/SCHPO/trm402/trm402-ai-review.yaml
  rows:
  - go_id: GO:0006364
    go_label: rRNA processing
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves, 99 species) with one seed, MGI:MGI:1919431 (mouse Nsun4). Its
      tree leaf is C4P6S0 (leaf PTN001867281), which sits in the mammalian NSUN2 clade PTN004568572 (13
      leaves) inside the Trm4/NSUN2 clade PTN000516078 (57 leaves), where trm402 (leaf PTN000516125)
      also sits. Human NSUN4 (Q96CB9) is in PTN008374330 (15 leaves) under PTN000516152 (49 leaves),
      which hangs off the family root PTN000516075 (204 leaves) and is not under the IBD node.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008374330
    evidence_checked:
    - >-
      QuickGO GO:0006364 with descendants. Mouse Nsun4 canonical protein Q9CZ57 has one experimental
      row, involved_in GO:0031167 rRNA methylation IMP PMID:24516400 (UniProt). The tree leaf C4P6S0
      has only IBA and ISO rows. O13935 has only the IBA.
    - >-
      Batch H11 (human NSUN2) read the UniProt records of C4P6S0 (SHTAP, a testis product of the Nsun4
      locus) and Q9CZ57 (NSUN4) and the abstract of PMID:24516400; not repeated here.
    - >-
      The trm402 review already removes GO:1902775 mitochondrial large ribosomal subunit assembly,
      which comes from the same seed and node, on this ground.
    review_edited: true
    notes: >-
      The earlier reason kept the row as an over-annotation because the node had not been audited. On
      the tree the sole seed is mapped to a leaf in the wrong clade, the assayed protein belongs to a
      clade outside the node, and nothing else under the node supports the term. Changed to REMOVE,
      consistent with human NSUN2 (batch H11) and with the GO:1902775 row of this review. History
      record added.
  - go_id: GO:0009383
    go_label: rRNA (cytosine-C5-)-methyltransferase activity
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves) with two seeds, MGI:MGI:1919431 (mouse Nsun4) and Arabidopsis
      AT2G22400. The node's children are PTN000516077 (62 leaves, the Trm4/NSUN2 side; target here)
      and PTN007710015 (91 leaves, plants and protists). The mouse seed's leaf C4P6S0 sits in the
      mammalian NSUN2 clade PTN004568572 (13 leaves) inside PTN000516077; the Arabidopsis seed (leaf
      PTN000516151, Q8L601) is in PTN007710015. Human NSUN4 (Q96CB9) is in PTN008374330 (15 leaves),
      outside the IBD node.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN007710015
    evidence_checked:
    - >-
      QuickGO GO:0009383. Q9CZ57 has enables IMP PMID:24516400 (FlyBase as assigning group); C4P6S0 has
      only IBA and ISO; Arabidopsis TRM4B F4IJH8 has IMP PMID:37334828 (TAIR).
    - >-
      Batch H11 noted that the abstract of PMID:37334828 does not mention rRNA m5C or TRM4B; the paper
      was not read here.
    - >-
      The row quotes PMID:30646830 (Trm4b methylates tRNA C49 sites).
    review_edited: true
    notes: >-
      Same reading and fix as human NSUN2 in batch H11. With the mouse seed mapped to the wrong leaf,
      the Trm4/NSUN2 side of the node holds no real seed for an rRNA substrate, and what remains is
      one plant seed in the sister clade. Changed to REMOVE; the node's source status in the
      propagation_review was changed from UNRESOLVED to SOURCE_BAD to match the rRNA processing row.
      The tree lists the Arabidopsis leaf under accession Q8L601 while QuickGO holds the experimental
      row on F4IJH8; both are the At2g22400 locus as far as the seed id shows, and this was not chased.
- gene_file: genes/SCHPO/cdc42/cdc42-ai-review.yaml
  rows:
  - go_id: GO:0019901
    go_label: protein kinase binding
    family: PTHR24072
    ibd_node: PTN008604840
    tree_reading: >-
      IBD at PTN008604840 (193 leaves, 52 species, the Cdc42-like clade of the 1443-leaf small GTPase
      family) with four seeds, fly Cdc42 (FB:FBgn0010341), mouse Cdc42 (MGI:MGI:106211), rat Cdc42
      (RGD:71043) and human CDC42 (P60953). Children are PTN008604841 (186 leaves; seeds and target)
      and PTN007770872 (7 leaves, Trichomonas and Paramecium, no seed). Human CDC42 and fission yeast
      cdc42 (leaf PTN000633147, in the fungal clade PTN001177978 of 15 leaves) join at PTN008604842
      (184 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P60953 x GO:0019901 with descendants returns enables IDA PMID:19039103 (BHF-UCL) and IPI
      rows with UniProtKB:Q13177 (PMID:8625410), UniProtKB:Q5S007 (PMID:21048939) and
      UniProtKB:Q9HC98 (PMID:20873783) plus the IBA. Q01112 has only the IBA. The query shape returns hits.
    - >-
      Gene review. The row quotes PMID:7597098 (physical and functional interaction between Shk1 and
      Cdc42), the review accepts protein serine/threonine kinase activator activity by IDA
      (PMID:9660818), and core_functions lists binding and activation of the PAK kinases Shk1 and Shk2.
    review_edited: true
    notes: >-
      The earlier reason said the binding is real and conserved and that a more informative term is
      annotated separately. That is not an over-annotation ground. The node is soundly seeded, the
      target is inside the seeded clade, and the target's own literature shows PAK binding. The
      kinase activator term is not a descendant of protein kinase binding, so TOO_GENERAL does not
      apply; the binding serves the core activator function and is kept as non-core, the same call as
      mouse Actb in batch N01. Other PTHR24072 rows judged earlier (RHOJ endocytosis, Rac1
      cytoskeleton, rho-1 cytosol) are different terms and nodes. History record added.
