- gene_file: genes/SCHPO/dcr1/dcr1-ai-review.yaml
  rows:
  - go_id: GO:0003723
    go_label: RNA binding
    family: PTHR14950
    ibd_node: PTN000383725
    tree_reading: >-
      IBD at PTN000383725 (103 leaves, 42 species, the Dicer clade of a 492-leaf family) with six
      seeds. Fly Dcr-1 and Dcr-2, zebrafish dicer1, human DICER1 and mouse Dicer1 are in the animal
      child clade PTN001029377 (72 leaves). The sixth seed is PomBase:SPCC188.13c, which is dcr1 itself
      (treeview reports the target as not a seed only because the seed is listed by its PomBase id),
      in the fungal child clade PTN001029438 (31 leaves; target leaf PTN001429865). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - genes/SCHPO/dcr1/dcr1-uniprot.txt carries SPCC188.13c, so the target is a seed of the node.
    - >-
      QuickGO Q09884 x GO:0003723 with descendants returns the IBA and enables GO:0003725
      double-stranded RNA binding IDA PMID:21847092 (PomBase). Human DICER1 carries GO:0003725 by IDA
      and IMP and pre-miRNA and miRNA binding rows; fly Dcr-1 carries GO:0003727 and GO:0070883 by IDA.
      The seeds are descendants of RNA binding and the node asserts their common parent.
    review_edited: true
    notes: >-
      The earlier reason was that the term is subsumed by the IDA row, which is redundancy and not an
      over-annotation ground. The node is seeded on both sides and the target is one of its seeds. The
      term is true and less specific than the row's own evidence supports, so the action is MODIFY to
      GO:0003725, which the row already listed as its replacement and the review accepts by IDA. A
      propagation_review block was added because validation asks for one on a modified IBA. History
      record added. The PTHR14950 folder has a review in Markdown only; it was not consulted for
      node verdicts.
- gene_file: genes/SCHPO/hxk1/hxk1-ai-review.yaml
  rows:
  - go_id: GO:0001678
    go_label: intracellular glucose homeostasis
    family: PTHR19443
    ibd_node: PTN000455350
    tree_reading: &hxk_homeo >-
      IBD at PTN000455350 (505 leaves, 93 species) with five seeds. Mouse and rat Gck and human and
      mouse HKDC1 are in the vertebrate hexokinase clade PTN000455353 (109 leaves) and join the fungal
      enzymes at PTN000455352 (189 leaves). Arabidopsis HXK1 (AT4G29130, Q42525) is in the other child
      of the IBD node, PTN007675299 (314 leaves, plants and protists). S. pombe hxk1 (leaf
      PTN000455541) and hxk2 (leaf PTN000455517) are in the fungal clade PTN000455506 (51 leaves),
      which holds no seed. PAINT records NOT IRD for the term at PTN000455552 and PTN007675417, both
      inside the plant clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &hxk_fix
      paint_action: MOVE_IBD
      target_node_id: PTN000455353
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Mouse Gck P52792 has involved_in IMP PMID:8530440
      (UniProt) and acts_upstream_of_or_within IMP PMID:7553875 (MGI); human HKDC1 Q2TB90 has IDA
      PMID:30517626 (UniProt). Q09756 and P50521 have only the IBA and an InterPro IEA.
    - >-
      Batch N12 checked the remaining seeds for the same node (rat Gck IMP PMID:16443775, mouse Hkdc1
      IMP, Arabidopsis HXK1 IMP for the descendant glucose mediated signaling pathway).
    - >-
      interpro/panther/PTHR19443/PTHR19443-review.yaml notes that the fungal reviews mark or remove this
      term, as expected given the lineage split.
    review_edited: false
    notes: >-
      Same reading as S. cerevisiae GLK1, HXK1 and HXK2 in batch N12. The seeds bracket the fungal clade
      (animal and plant), so the ground is biological. Every seed is a glucose sensor in a specialised
      setting, PAINT has already pruned the term from two plant clades, and nothing in the fungal
      clade carries it. The written reason is short, but the summary names the node and the
      propagation_review lists the donors and says no fungal hexokinase is among them, so the glucose
      homeostasis row was left as written. The IEA row on the same term carries the same action.
  - go_id: GO:0032473
    go_label: cytoplasmic side of mitochondrial outer membrane
    family: PTHR19443
    ibd_node: PTN000455350
    tree_reading: &hxk_mom >-
      IBD at PTN000455350 (505 leaves) with two seeds, human HK2 (P52789) in the vertebrate hexokinase
      clade PTN000455353 (109 leaves) and Brassica M4FD55 (leaf PTN004517031) in the plant and protist
      clade PTN007675299 (314 leaves). S. pombe hxk1 and hxk2 are in the fungal clade PTN000455506 (51
      leaves), which holds no seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *hxk_fix
    evidence_checked: &hxk_mom_ev
    - >-
      QuickGO by accession and GO id. HK2 P52789 has is_active_in IDA PMID:18350175 and M4FD55 IDA
      PMID:21896887, both assigned by GO_Central. Q09756 and P50521 each have the IBA and an IC row
      from PomBase (GO_REF:0000111, inferred from GO:0004396 hexokinase activity).
    - >-
      interpro/panther/PTHR19443/PTHR19443-review.yaml scopes the term as true of vertebrate HK1 and
      HK2 and asserted for plants through the Brassica seed, and not true of fungal hexokinases.
    review_edited: true
    notes: >-
      Same reading as the S. cerevisiae enzymes in batch N12. Action unchanged. The reason called the
      location a mammalian one, which left out the Brassica seed, so it was rewritten to name the
      node, both seeds, their clades and the unseeded fungal clade. The summary is unchanged. The IC
      row from PomBase on the same term keeps the same action; it is a curator inference from the
      activity, not an observation, and the review's HDA cytosol row is the only location evidence on
      the protein. The plant seed would need its own IBD in PTN007675299 if the record is moved.
      History record added.
