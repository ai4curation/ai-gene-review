- gene_file: genes/SCHPO/atg101/atg101-ai-review.yaml
  rows:
  - go_id: GO:0019901
    go_label: protein kinase binding
    family: PTHR13292
    ibd_node: PTN000329035
    tree_reading: >-
      IBD at the family root PTN000329035 (106 leaves, 86 species) with two seeds, fly Atg101
      (FB:FBgn0030960, Q9VWQ1) and worm epg-9 (WB:WBGene00022078, Q95XH2). Children are PTN000999009
      (45 leaves; seeds and target) and PTN007609020 (61 leaves, plants and protists, no seed). Both
      seeds are in the animal clade PTN000329037 (28 leaves) and join each other at PTN000329063 (6
      leaves). The target (leaf PTN000329074) is in the fungal clade PTN000999027 (13 leaves) and
      joins the seeds at PTN000329036 (43 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly Atg101 Q9VWQ1 has enables IPI PMID:24895579 (FlyBase) with
      FB:FBgn0260945; worm epg-9 Q95XH2 has enables IPI PMID:22885670 (WB) with WB:WBGene00006786
      (unc-51, per the epg-9 review). Human ATG101 Q9BSB4 has only the IBA.
    - >-
      genes/SCHPO/atg101/atg101-goa.tsv. The PomBase and IntAct protein binding IPI rows from
      PMID:26030876 and PMID:28976798 all name Atg13 (SPAC4F10.07c, O36019) as the partner; none
      names Atg1.
    - >-
      publications/PMID_28976798.md, abstract only (PMC returned no full text for PMC5788547,
      doi 10.1080/15548627.2017.1382782). Pairwise coprecipitation shows Atg101 binds the HORMA domain
      of Atg13 and does not bind Atg17. The abstract does not say whether Atg101 binds Atg1.
    review_edited: false
    notes: >-
      The seeds are sound direct-interaction rows with the Atg1 or UNC-51 kinase, and the worm epg-9
      review accepts the term. The ground is on the target. PomBase curators who read both fission
      yeast interaction papers recorded Atg13 as the only partner, and Atg13 is not a kinase. The two
      deep-research files in the gene folder disagree on whether Nanji et al. saw a contact with the
      Atg1 C-terminal domain, and the review quotes both; the full text could not be read here, so the
      point stays open. That is doubt short of loss, with no PAINT change. A pairwise binding assay of
      purified Atg101 with Atg1 in the absence of Atg13 would settle it. Left as written.
- gene_file: genes/SCHPO/mtl16/mtl16-ai-review.yaml
  rows:
  - go_id: GO:0010608
    go_label: post-transcriptional regulation of gene expression
    family: PTHR13393
    ibd_node: PTN000333540
    tree_reading: >-
      IBD at PTN000333540 (100 leaves, 87 species) with three seeds, human METTL16 (Q86W50), mouse
      Mettl16 (MGI:MGI:1914743, Q9CQG2) and worm mett-10 (WB:WBGene00014228, Q09357). All three are in
      the animal clade PTN001001951 (38 leaves). The target (leaf PTN000333588) is in the fungal clade
      PTN001001968 (11 leaves), the sister of the animal clade under PTN000333542 (49 leaves). The
      other parts of the node, PTN001001984 (3 Dictyostelium leaves) and PTN008347324 (48 leaves,
      plants and protists), hold no seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001001951
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human METTL16 has involved_in IDA PMID:28525753 (UniProt), mouse
      Mettl16 IDA PMID:29262316 (UniProt), worm mett-10 IDA PMID:33930289 (UniProt). O42662 has only
      the IBA, with descendants included.
    - >-
      The row quotes PMID:34050143, the S. pombe study. sam1 mRNA, the MAT2A ortholog, is unchanged in
      the mtl16 deletion, and the MAT2A 3' UTR hairpins are not conserved outside vertebrates.
    - interpro/panther/PTHR13393/PTHR13393-review.yaml does not assess this node for this term.
    review_edited: false
    notes: >-
      The seeds are sound and record the SAM-responsive control of SAM synthetase transcripts in
      animals. They all sit in the animal clade, and the fungal sister clade has direct evidence from
      the target that the circuit is not there. The existing reason says this and names the donors.
      It is kept as an over-annotation and not a removal because the S. pombe result tests one target
      transcript, not every regulatory use of the enzyme. Left as written.
