genes:
- gene_file: genes/SCHPO/atg5/atg5-ai-review.yaml
  rows:
  - go_id: GO:0034727
    go_label: piecemeal microautophagy of the nucleus
    family: PTHR13040
    ibd_node: PTN000315667
    tree_reading: >-
      IBD at the family root PTN000315667 (111 leaves, 93 species) with one seed, yeast ATG5
      (SGD:S000006070, Q12380). The root has children PTN000315668 (51 leaves, animals, fungi and
      amoebozoa; target here) and PTN007600606 (60 leaves, plants and protists). The seed and the target
      are both in the fungal clade PTN000990030 (14 leaves) and join at PTN000315705 (11 leaves,
      ascomycetes), whose children are PTN000315706 (9 leaves, budding yeasts and filamentous
      ascomycetes; holds the seed) and the fission yeast pair PTN008545246 (2 leaves; target, leaf
      PTN000315713). The seed's own budding yeast clade is PTN000990031 (4 leaves, S. cerevisiae,
      E. gossypii, C. albicans, Y. lipolytica). No loss recorded on the lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000990031
    evidence_checked:
    - >-
      QuickGO Q12380 x GO:0034727 returns involved_in IMP PMID:18701704 (SGD) plus the IBA; O74971 has
      only the IBA. The query shape returns hits.
    - >-
      PMID:18701704 was read as an abstract in earlier batches of this pass (batch-H03); it places the
      process at budding yeast nucleus-vacuole junctions and reports that atg mutants block it.
    - >-
      The row quotes the gene's deep-research file for S. pombe (a nucleoplasmic reporter is degraded in
      an Atg5-dependent manner, read there as macroautophagy). That primary paper was not read here.
    review_edited: false
    notes: >-
      Same record as human ATG5 (batch H08) and worm atg-5 (batch N07), which asked for the IBD to move to the
      fungal clade PTN000990030. Fission yeast sits inside that clade, so for this target the placement has to
      be narrower. One budding yeast seed for a process defined at the Nvj1 and Vac8 nucleus-vacuole junction
      is carried across all fungi; the existing reason gives the fission yeast side (nuclear cargo turnover
      there is reported as macroautophagic, no microautophagic route shown) and names the root node and the
      seed. It is doubt and not loss, since nothing shows that fission yeast lacks the process. Left as
      written. The move to the 4-leaf budding yeast clade is the narrowest placement the seed supports;
      whether the filamentous ascomycetes in PTN000315706 should keep it is a question for the PAINT curator.
      Reconciliation: Confirmed on the cached PTHR13040 tree; batches H08 (human ATG5) and N07 (worm atg-5)
      now name PTN000990031 as well.
