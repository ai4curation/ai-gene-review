- gene_file: genes/human/NSUN2/NSUN2-ai-review.yaml
  rows:
  - go_id: GO:0009383
    go_label: rRNA (cytosine-C5-)-methyltransferase activity
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves) with 2 seeds, MGI:MGI:1919431 (mouse Nsun4) and Arabidopsis AT2G22400
      (TRM4B). The node has two child clades, PTN000516077 (62 leaves, NSUN2 with fly Nsun2, yeast Ncl1/Trm4,
      fission yeast Trm4a and Trm4b) and PTN007710015 (91 leaves, plants and protists, holding TRM4B). The
      leaf carrying the mouse Nsun4 gene is C4P6S0, and it sits inside the mammalian NSUN2 clade PTN004568572
      (13 leaves) beside mouse and human NSUN2. Human NSUN4 (Q96CB9) and rat Nsun4 are in PTN000516152
      (49 leaves, with NSUN3), which hangs off the family root PTN000516075 and is not under the IBD node.
      That clade has its own IBD for this term at PTN008374330.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN007710015
    evidence_checked:
    - >-
      QuickGO GO:0009383. Mouse Nsun4 canonical protein Q9CZ57 has enables IMP PMID:24516400 (FlyBase as
      assigning group); the tree leaf C4P6S0 has only IBA and ISO. Arabidopsis TRM4B F4IJH8 has IMP PMID:37334828
      (TAIR). Human NSUN4 Q96CB9 has EXP rows (Reactome) and an IBA from PTN008374330. Mouse and human NSUN2
      have only the IBA.
    - >-
      UniProt C4P6S0 is SHTAP_MOUSE, sperm head and tail associated protein, 806 residues, gene Nsun4, MGI:1919431,
      described as isoforms 3 and 4 of the locus whose isoforms 1 and 2 are Q9CZ57. UniProt Q9CZ57 is NSUN4_MOUSE,
      381 residues, PANTHER PTHR22808:SF3 (NSUN4 subfamily), the same subfamily as human NSUN4.
    - >-
      PubMed abstract of PMID:24516400 (NSUN4 methylates 12S rRNA C911 in conditional Nsun4 knockout mice).
      PubMed abstract of PMID:37334828, a paper on pyrimidine catabolism and 5-methyluridine in Arabidopsis
      RNA; the abstract does not mention rRNA m5C or TRM4B.
    - interpro/panther/PTHR22808/PTHR22808-review.yaml does not assess this node for this term.
    review_edited: true
    notes: >-
      The earlier review kept the row as an over-annotation because the tree had not been inspected. Read
      on the tree, the mouse seed is a gene-to-leaf mapping problem: the experiments are on the canonical
      NSUN4 protein, the leaf for that gene is a long testis isoform that PANTHER places with NSUN2, and
      the real NSUN4 clade is outside the node. The second seed is in the sister clade. Two points for
      PAINT. The mouse Nsun4 seed should be dropped from this node (the NSUN4 clade already has its IBD),
      and what remains is one plant seed, so the IBD belongs in the plant clade at most. The Arabidopsis
      seed row may itself deserve a look (abstract only, recorded as a query, not asserted).
  - go_id: GO:0006364
    go_label: rRNA processing
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves) with 1 seed, MGI:MGI:1919431 (mouse Nsun4). Its tree leaf C4P6S0 sits
      inside the mammalian NSUN2 clade PTN004568572 (13 leaves). Human and rat NSUN4 are in PTN000516152
      (49 leaves), outside the IBD node; the NSUN4 ortholog clade there is PTN008374330 (15 leaves).
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008374330
    evidence_checked:
    - >-
      QuickGO GO:0006364 with descendants for Q9CZ57. One experimental row, involved_in rRNA methylation
      (GO:0031167) IMP PMID:24516400 (UniProt).
    - UniProt records for C4P6S0 and Q9CZ57 and the PubMed abstract of PMID:24516400, as above.
    review_edited: true
    notes: >-
      Sole seed mapped to a leaf in the wrong clade; nothing else under the node supports the term. NSUN2
      substrates mapped so far are tRNA, vault RNA and mRNA.
  - go_id: GO:1902775
    go_label: mitochondrial large ribosomal subunit assembly
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves) with 1 seed, MGI:MGI:1919431 (mouse Nsun4), whose tree leaf C4P6S0
      sits inside the mammalian NSUN2 clade PTN004568572 (13 leaves). Human and rat NSUN4 are in PTN000516152,
      outside the IBD node; the NSUN4 ortholog clade there is PTN008374330 (15 leaves).
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008374330
    evidence_checked:
    - QuickGO GO:1902775 for Q9CZ57. involved_in IMP PMID:24516400 (UniProt).
    - >-
      PubMed abstract of PMID:24516400. The NSUN4 and MTERF4 complex is required to assemble the small and
      large subunits into a monosome.
    - >-
      The review's existing quote from PMID:31276587, that NSUN2 inactivation has no profound effect on
      mitochondrial tRNA stability and oxidative phosphorylation in differentiated cells, kept verbatim.
    review_edited: true
    notes: Misplaced IBD plus evidence against the term on the target itself.
- gene_file: genes/human/ZDHHC23/ZDHHC23-ai-review.yaml
  rows:
  - go_id: GO:0005783
    go_label: endoplasmic reticulum
    family: PTHR22883
    ibd_node: PTN000525256
    tree_reading: >-
      IBD at the family root PTN000525256 (1972 leaves) with 28 seeds across its eight child clades. ZDHHC23
      (leaf PTN002505107) is in PTN000525804 (482 leaves). Three human seeds, ZDHHC6, ZDHHC19 and ZDHHC22,
      and fly seeds such as CG5196 join the target at PTN008583665 (178 leaves). The ZDHHC23 clade itself
      is PTN008583751 (31 leaves), with fly GABPI as the insect ortholog; it holds no ER seed and carries
      an IBD for protein localization to plasma membrane. No loss is recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN008583751
    evidence_checked:
    - >-
      QuickGO GO:0005783 with descendants. ZDHHC6 (Q9H6R6), ZDHHC19 (Q8WVZ1) and ZDHHC22 (Q8N966) have IDA
      rows from PMID:16647879 (and more for ZDHHC6); fly CG5196 (Q9VG80) has IDA rows PMID:18719403 and
      PMID:21383842; fly GABPI (Q9VQK9) returned no hit.
    - >-
      QuickGO GO:0005794 with descendants for fly GABPI. Golgi apparatus IDA PMID:18719403 and Golgi membrane
      IDA PMID:19139268 and PMID:21598021 (FlyBase).
    - PubMed title of PMID:18719403, the Drosophila protein palmitoylome survey of DHHC proteins.
    - The review's quotes from PMID:22399288 (zDHHC23 at the Golgi and TGN in HEK293 cells), unchanged.
    review_edited: true
    notes: >-
      Action unchanged. The reason said current PANTHER places ZDHHC22 in another family so it is not a
      sister of the target; in the PAINT tree ZDHHC22 is a leaf and a seed and joins ZDHHC23 at PTN008583665.
      That sentence was corrected and the fly GABPI evidence added. Root organelle rule applied. The organelle
      claim does not hold for this clade on the data available (both characterised members are Golgi proteins),
      and ER residence has not been excluded, so the row stays an over-annotation. No PAINT fix follows from
      doubt alone. An ER marker co-stain of endogenous ZDHHC23 would settle it. target_node_id names the
      clade the doubt applies to.
- gene_file: genes/human/AGO3/AGO3-ai-review.yaml
  rows:
  - go_id: GO:0031054
    go_label: pre-miRNA processing
    family: PTHR22891
    ibd_node: PTN000527278
    tree_reading: >-
      IBD at PTN000527278 (95 leaves), the vertebrate AGO1 to AGO4 clade, with 6 seeds, human AGO1, AGO2,
      AGO3 and AGO4, mouse Ago2 and zebrafish ago2. AGO3 (leaf PTN002505251) is itself a seed. The AGO2
      clade is PTN002739870 (22 leaves) and meets the AGO3 lineage at PTN000527280 (90 leaves). No loss
      is recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002739870
    evidence_checked:
    - >-
      QuickGO GO:0031054. AGO1 (Q9UL18), AGO3 (Q9H9G7) and AGO4 (Q9HCK5) each have one experimental row,
      IDA PMID:19966796 (BHF-UCL). AGO2 (Q9UKV8) has IDA rows from PMID:16424907, PMID:17671087, PMID:18178619
      and PMID:19966796; mouse Ago2 (Q8CJG0) IDA PMID:16357216.
    - >-
      publications/PMID_19966796.md, full text read (ATP-dependent human RISC assembly pathways). The paper
      assays loading and unwinding of small-RNA duplexes by Flag-tagged AGO1 to AGO4 and states that human
      RISC assembly is uncoupled from dicing. A pre-miRNA-like hairpin is used only to show that dicing is
      not required.
    - interpro/panther/PTHR22891/PTHR22891-review.md does not cover this node.
    review_edited: true
    notes: >-
      Action unchanged on the IBA, IEA and IDA rows. The IBA reason was rewritten to say where the over-reach
      starts. The AGO1, AGO3 and AGO4 seeds come from one RISC-loading paper that does not show pre-miRNA
      processing by an Argonaute; the AGO2 seeds rest on other papers and were not questioned. The seed
      rows on AGO1, AGO3 and AGO4 are BHF-UCL annotations; the full text was read, so the over-reach is
      stated, but no source defect was filed from this pass.
  - go_id: GO:0003727
    go_label: single-stranded RNA binding
    family: PTHR22891
    ibd_node: PTN000527276
    tree_reading: >-
      IBD at PTN000527276 (203 leaves) with 9 seeds, human AGO1 to AGO4, worm alg-1 and alg-2 (WBGene00000105,
      WBGene00000106), fly AGO1 and AGO2 (FBgn0262739, FBgn0087035) and fission yeast ago1. The node has two
      child clades, PTN001113179 (178 leaves, holding the target and the human seeds) and the fungal clade
      PTN001113253 (25 leaves). AGO3 is itself a seed. No loss is recorded for this term; a NOT IRD for RNA
      endonuclease activity exists at PTN002739864.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: ACCEPT
    paint_fix:
      paint_action: NONE
      target_node_id: PTN000527276
    evidence_checked:
    - >-
      QuickGO GO:0003727. AGO1, AGO2, AGO3 and AGO4 each have enables IDA PMID:19966796 (BHF-UCL).
    - >-
      publications/PMID_19966796.md, full text. All four AGO proteins unwound a mismatched small-RNA duplex,
      leaving the single-stranded guide in the mature complex.
    - >-
      QuickGO ancestors of GO:0035198 miRNA binding are GO:0061980 regulatory RNA binding, GO:0003723 and
      upward; GO:0003727 is not among them.
    - interpro/panther/PTHR22891/PTHR22891-review.md lists GO:0003727 at PTN000527276 as correct.
    review_edited: true
    notes: >-
      The earlier reason was that the term is too generic, which is not a ground, and it had been applied
      to AGO3's own IDA row as well. The IBA, IEA (GO_REF:0000117) and IDA (PMID:19966796) rows on this
      term were all changed to ACCEPT to stay consistent. TOO_GENERAL was not available because miRNA binding
      does not entail single-stranded RNA binding in GO. The double-stranded RNA binding rows from the same
      paper were not in the todo and were left as they are.
