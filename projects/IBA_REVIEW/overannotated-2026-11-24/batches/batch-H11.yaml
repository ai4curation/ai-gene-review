genes:
- gene_file: genes/human/LPAR1/LPAR1-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR22750
    ibd_node: PTN002733616
    tree_reading: >-
      IBD at PTN002733616 (461 leaves) with 7 seeds. The node has three child clades, the CNR1 clade PTN009051851
      (18 leaves), PTN000507967 (422 leaves, holding the target and the lysophospholipid and melanocortin
      receptors) and the GPR119 clade PTN009051990 (21 leaves). Human LPAR1 (leaf PTN002503546) is itself a
      seed; its own LPA receptor clade is PTN002733659 (24 leaves). No loss is recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
      target_node_id: PTN002733616
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005737 with descendants (query shape returned experimental hits for every
      seed). LPAR1 (Q92633) located_in endosome and colocalizes_with endocytic vesicle, IDA PMID:19306925
      (UniProt); LPAR2 (Q9HBW0) endocytic vesicle IDA, same paper; CNR2 (P34972) endoplasmic reticulum IDA
      PMID:28364261 (CACAO); S1PR4 (O95977) mitochondrion IDA GO_REF:0000052 (HPA); mouse Cnr1 (P47746)
      mitochondrion and mitochondrial outer membrane rows (MGI, UniProt); pig GPR3 (F1STP7) cytoplasm IDA
      PMID:22685609 (AgBase); zebrafish mc2r (Q7ZTA2, ZDB-GENE-030502-2) cytoplasm IDA PMID:20138960 (ZFIN).
    - QuickGO ancestors of GO:0005768 endosome include GO:0005737 (is_a and part_of).
    - The review keeps endosome IDA (PMID:19306925) as KEEP_AS_NON_CORE and has a NEW early endosome row.
    review_edited: true
    notes: >-
      The earlier reason said the intracellular pools are membrane compartments and therefore not cytoplasm,
      which is wrong in GO. For LPAR1 the IBA is its own endosome rows rolled up to the parent, so it is
      true and entailed by those rows. The node itself is a pooled set of unrelated organelle observations
      (see MC1R and MC4R below); a REMOVE_IBD request there is recorded on those rows, not here, because
      this row does not rest on the node being wrong.
- gene_file: genes/human/MC1R/MC1R-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR22750
    ibd_node: PTN002733616
    tree_reading: >-
      IBD at PTN002733616 (461 leaves) with 7 seeds (CNR2, LPAR2, LPAR1, pig GPR3, S1PR4, mouse Cnr1, zebrafish
      mc2r). MC1R (leaf PTN002503561) sits in the MC1R clade PTN002733711 (24 leaves), which hangs directly
      under PTN000507968 (373 leaves) and holds no seed. The one melanocortin seed is zebrafish mc2r, outside
      the MC1R clade. No loss is recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002733616
    evidence_checked:
    - >-
      QuickGO for every seed, as listed under LPAR1. The seven seeds are rows on four different organelles
      (endosome and endocytic vesicle after internalisation, ER, mitochondrion) plus two plain cytoplasm
      IDA rows; none is a human melanocortin receptor. Human MC1R, MC2R, MC3R, MC4R and MC5R carry only the
      IBA for this term.
    - >-
      PubMed titles for the two cytoplasm seeds. PMID:22685609 is on GPR3 in porcine oocyte meiotic arrest;
      PMID:20138960 is on accessory proteins in the function of zebrafish mc2r. Abstracts and full texts
      not read; the seed rows are not disputed, only what they add up to at this depth.
    review_edited: true
    notes: >-
      Action unchanged. Reason rewritten because it said ER, Golgi and endosomes are not cytoplasm, which
      is wrong in GO, and named no seeds. Ground is seed over-reach of the transit and retention kind
      (IBA_REVIEW pattern 21) together with a node placed far above any one of its seeds; NODE_TOO_DEEP
      applies equally. REMOVE_IBD is asked for because the seeds share no organelle, so no single seeded
      clade exists to move the IBD to.
