- gene_file: genes/human/CHMP7/CHMP7-ai-review.yaml
  rows:
  - go_id: GO:0009898
    go_label: cytoplasmic side of plasma membrane
    family: PTHR22761
    ibd_node: PTN000509454
    tree_reading: >-
      IBD at PTN000509454 (344 leaves) with 2 seeds, human CHMP4B and CHMP4A. Both lie in the CHMP4 clade
      PTN001101736 (86 leaves). Vertebrate and other animal CHMP7 form PTN009052135 (25 leaves), and the two
      clades meet at PTN008581213 (111 leaves). The fungal and protist Chm7 proteins form a separate clade,
      PTN008581269 (9 leaves), which already carries NOT IRD for GO:0009898, GO:0005771, GO:0006900 and
      GO:0032511. The animal CHMP7 clade has no such loss.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001101736
    evidence_checked:
    - >-
      QuickGO GO:0009898 for Q9H444 (CHMP4B) and Q9BY43 (CHMP4A). Both located_in IDA PMID:18209100 (UniProt);
      CHMP4C (Q96CF2) has only the IBA.
    - >-
      publications/PMID_18209100.md (full text cached), title on plasma membrane deformation by circular
      arrays of ESCRT-III protein filaments. Title and header read only.
    - interpro/panther/PTHR22761 has no family review.
    review_edited: false
    notes: >-
      The written reason (CHMP7 evidence is at the reforming nuclear envelope; plasma membrane context comes
      from the wider ESCRT inference) is consistent with the tree and was left. The existing IRD on the
      fungal Chm7 clade is the precedent; an ADD_IRD at PTN009052135 would be the alternative to moving the
      IBD, but nothing shows the animal CHMP7 branch had and lost the location.
- gene_file: genes/human/ASGR1/ASGR1-ai-review.yaml
  rows:
  - go_id: GO:0006955
    go_label: immune response
    family: PTHR22802
    ibd_node: PTN001105054
    tree_reading: >-
      IBD at PTN001105054 (654 leaves) with 9 seeds. FCER2 and mouse Cd209b lie in PTN009053187 (120 leaves),
      CLEC4D and mouse Clec4e in PTN009053172 (64 leaves); both join the target at PTN008582225 (320 leaves).
      Three fly lectins and a zebrafish gene are further seeds. ASGR1 (leaf PTN002503970) is in PTN009053161
      (55 leaves, with ASGR2, CLEC10A, CLEC17A and fish relatives), which holds no seed. No loss is recorded.
      An IBD for antifungal innate immune response exists at PTN001866951 inside the CLEC4 clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009053172
    evidence_checked:
    - >-
      QuickGO GO:0006955 with descendants. FCER2 (P06734) IDA rows PMID:2167225 and PMID:7544003; CLEC4D
      (Q8WXI8) antifungal innate immune response IDA PMID:23911656.
    - >-
      QuickGO GO:0002376 with descendants for twelve members of PTN009053161 (human ASGR1, ASGR2, CLEC10A,
      CLEC17A; mouse Asgr1, Asgr2, Clec10a, Mgl2; rat Asgr1, Asgr2, Clec10a; zebrafish asgr1a). Each returned
      one hit, the IBA; no experimental row. The same query shape returned experimental rows for FCER2.
    - interpro/panther/PTHR22802/PTHR22802-review.yaml marks this node NEEDS_PRUNING for ASGR1 and ASGR2.
    review_edited: false
    notes: >-
      The reason was already rewritten against the tree in the earlier pass and is accurate. The seeds are
      in several clades, so one MOVE_IBD does not cover them; the CLEC4 clade PTN009053172 is named as the
      first target and a second IBD at PTN009053187 would be needed for FCER2 and CD209. Pruning the whole
      55-leaf clade PTN009053161 would be wrong, since CLEC10A and CLEC17A are leukocyte lectins.
