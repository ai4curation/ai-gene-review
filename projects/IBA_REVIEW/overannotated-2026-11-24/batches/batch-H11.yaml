- gene_file: genes/human/DCDC2/DCDC2-ai-review.yaml
  rows:
  - go_id: GO:0005815
    go_label: microtubule organizing center
    family: PTHR23004
    ibd_node: PTN000543880
    tree_reading: >-
      IBD at PTN000543880 (79 leaves) with 1 seed, Dictyostelium discoideum dcx (DDB_G0277115, Q550F6). The
      node has two child clades, the animal clade PTN001124053 (77 leaves, with DCDC2, DCDC2B and DCDC2C)
      and PTN001124077 (2 leaves, the two Dictyostelium dcx proteins). The seed is in the two-leaf clade.
      The DCDC2 clade PTN002744418 (20 leaves) carries IBDs for axoneme, kinocilium and cilium assembly.
      No loss is recorded.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001124077
    evidence_checked:
    - >-
      QuickGO GO:0005815 with descendants. Dictyostelium dcx (Q550F6) located_in IDA PMID:21034843 (dictyBase);
      human DCDC2 (Q9UHG0) has only the IBA.
    - >-
      publications/PMID_25557784.md (full text). DCDC2 localises to the ciliary axoneme and spindle microtubules
      and is stated to be excluded from the basal body in interphase and from the mitotic spindle poles in
      metaphase and anaphase.
    - publications/PMID_21034843.md is abstract only; the seed row was not questioned.
    review_edited: true
    notes: >-
      The earlier review had the node and the evidence right and stopped at MARK_AS_OVER_ANNOTATED. With the
