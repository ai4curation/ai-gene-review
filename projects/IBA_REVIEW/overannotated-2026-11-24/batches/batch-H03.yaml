- gene_file: genes/human/CHST3/CHST3-ai-review.yaml
  rows:
  - go_id: GO:0006044
    go_label: obsolete N-acetylglucosamine metabolic process
    family: PTHR10704
    ibd_node: PTN002473209
    tree_reading: >-
      IBD at the family root PTN002473209 (207 leaves) with six seeds, human CHST2, CHST4, CHST5,
      CHST6, CHST7 and MGI:MGI:1931825. The root has two children, the 205-leaf eukaryote clade
      PTN000842280 holding the target and the human seeds, and a 2-leaf bacterial clade. Inside it
      CHST3 is in PTN002581850 (24 leaves), which carries its own IBDs for chondroitin
      6-sulfotransferase activity and chondroitin sulfate proteoglycan biosynthesis. The five human
      seeds join CHST3 only at PTN007456579 (137 leaves), from the sister clades PTN002581871 (CHST2),
      PTN002581838 (CHST4, CHST5, CHST6) and PTN002581862 (CHST7).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002473209
    evidence_checked:
    - >-
      QuickGO over the CHST3 clade PTN002581850 for GO:0001517 (the GlcNAc 6-O-sulfotransferase
      activity the obsolete process stood for) returns one row, the Reactome TAS on human CHST3; no
      experimental seed in the clade.
    - The GO label lookup in the treeview output marks GO:0006044 as obsolete.
    review_edited: false
    notes: >-
      The written reason already names the root node, the seed clades and the CHST3 clade, and they
      match the tree. The term is obsolete, so PAINT has to drop the IBD whatever the chemistry.
- gene_file: genes/human/HMOX2/HMOX2-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR10720
    ibd_node: PTN007456885
    tree_reading: >-
      IBD at the family root PTN007456885 (67 leaves, 40 species) with three seeds, human HMOX2
      (P30519, the target), RGD:2806 and CGD:CAL0000188588. The root has two children. The target is
      in PTN000076492 (53 leaves, HMOX1 and HMOX2); the Candida albicans seed HMX1 (Q5AB97) is in the
      other child, PTN000076412 (14 leaves). No PAINT loss for the term. The target is itself a seed.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P30519 x GO:0005886 returns IDA PMID:15528406 (UniProt, located_in) and the Reactome
      TAS; Q5AB97 returns IDA PMID:19824013 (CGD); rat Hmox2 P23711 returns only an ISO from the
      human protein.
    - >-
      publications/PMID_15528406.md (abstract only) states that HO-2 is part of the BK channel
      complex and enhances channel activity in normoxia.
    review_edited: true
    notes: >-
      The earlier call rested on the plasma membrane being peripheral to the ER membrane core and
      context-specific, which is not a ground. The target is its own seed with an IDA row, and the
      seed paper reports an activity at the channel complex. The IBA, the IDA and the Reactome TAS
      rows on this term were all moved to KEEP_AS_NON_CORE so that same-term rows stay consistent,
      and the IBA propagation_review was updated. The rat seed has no experimental row in current
      GOA. No family review exists for PTHR10720.
- gene_file: genes/human/ABHD2/ABHD2-ai-review.yaml
  rows:
  - go_id: GO:0051793
    go_label: medium-chain fatty acid catabolic process
    family: PTHR10794
    ibd_node: PTN000082647
    tree_reading: >-
      IBD at PTN000082647 (118 of the 347 leaves in the family) with two seeds, yeast EHT1
      (SGD:S000000381, P38295) and YMR210W (SGD:S000006016, MGL2, Q03649). The node has two
      children, PTN007462382 (111 leaves) holding the target and both seeds, and the amoebozoan clade
      PTN007462386 (7 leaves). Inside PTN007462382 the seeds are in the fungal clade PTN000846623
      (18 leaves) and ABHD2 is in the sister animal clade PTN000846579 (93 leaves), which holds no
      seed. No PAINT loss for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000846623
    evidence_checked:
    - >-
      QuickGO P38295 x GO:0051793 returns IMP PMID:16361250 (SGD); Q03649 returns only the IBA, so
      the YMR210W seed has no experimental row in current GOA.
    - >-
      PubMed abstract of PMID:16361250 (doi 10.1074/jbc.M512028200) describes EHT1 and EEB1 as
      acyl-CoA:ethanol O-acyltransferases and esterases for medium-chain fatty acid ethyl esters in
      yeast and says YMR210W does not seem to play an important role.
    review_edited: true
    notes: >-
      Action unchanged. The summary called PTN000082647 the family root, which it is not, and the
      reason said only that the term crossed Opisthokonta; both were corrected to state the seed and
      target clades. No family review exists for PTHR10794.
- gene_file: genes/human/VAPB/VAPB-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR10809
    ibd_node: PTN000087323
    tree_reading: >-
      IBD at the family root PTN000087323 (685 leaves) with five seeds, human VAPA (Q9P0L0), yeast
      SCS2 (SGD:S000000922), fission yeast scs2 (PomBase:SPAC17C9.12), fly Vap33 (FB:FBgn0029687) and
      Arabidopsis AT5G54110. The root has two children. VAPB is in PTN000087324 (119 leaves) together
      with VAPA, which joins it at PTN001651224 (53 leaves), fly Vap33 at PTN000087326 (96 leaves)
      and the two yeast seeds at PTN000087325 (117 leaves). The plant seed is in the other child,
      PTN007465473 (566 leaves). The target is not a seed.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO x GO:0005886: VAPA Q9P0L0 IDA PMID:10523508 (located_in), yeast SCS2 P40075 IDA
      PMID:25420878 (located_in), fly Vap33 Q9W4N8 IDA PMID:18555774 (located_in); fission yeast
      scs2 O60119 has only the IBA; VAPB O95292 has only the IBA.
    - >-
      PubMed abstract of the yeast seed paper PMID:25420878 (doi 10.1007/s00018-014-1786-x) is about
      ORP-VAP complexes at membrane contact sites, with VAPs described as ER anchors.
    - >-
      publications/PMID_10523508.md (abstract only) is titled on VAP-33 at an intracellular vesicle
      population and with occludin at the tight junction. publications/PMID_18555774.md (full text)
      mentions the cell surface only for receptors that bind the secreted MSP domain.
    review_edited: false
    notes: >-
      The seeds are located_in observations on ER tail-anchored proteins, and at least the yeast one
      comes from a study of ER-plasma membrane contact sites; PAINT turns them into is_active_in
      plasma membrane for the whole family. That is the ground the existing reason states (cortical
      ER at contact sites). Its sentence that no study places VAPB itself in the plasma membrane is
      not a ground, but the reason does not rest on it. The seed papers were read as abstracts except
      the fly one, so no REMOVE_IBD is asked for; the question for PAINT is whether contact-site
      located_in rows should seed an is_active_in IBD. The family review does not cover this term.
- gene_file: genes/human/IDI1/IDI1-ai-review.yaml
  rows:
  - go_id: GO:0009240
    go_label: isopentenyl diphosphate biosynthetic process
    family: PTHR10885
    ibd_node: PTN000853999
    tree_reading: >-
      IBD at PTN000853999 (169 of the 181 leaves in the family) with one seed, Arabidopsis IPP1
      (AGI_LocusCode:AT5G16440, Q38929). The node has two children, PTN008312508 (167 leaves) holding
      the target and the seed, and a 2-leaf archaeal clade. Inside it the seed is in the plant clade
      PTN007468838 (88 leaves) and IDI1 is in the sister clade PTN000094421 (66 leaves), joined at
      PTN000094420 (154 leaves). No PAINT loss for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN007468838
    evidence_checked:
    - >-
      QuickGO Q38929 x GO:0009240 returns one experimental row, IMP PMID:18319397 (TAIR,
      acts_upstream_of_or_within).
    - >-
      PubMed abstract of PMID:18319397 (doi 10.1105/tpc.107.053926) describes the two Arabidopsis
      IPP isomerases as converting IPP to DMAPP in plastids, mitochondria and cytosol.
    - >-
      interpro/panther/PTHR10885/PTHR10885-review.yaml assesses this node and term as TOO_DEEP and
      asks for the root IBD to be replaced by plant and other MEP-pathway placements.
    review_edited: false
    notes: >-
      The existing reason names the node and the plant seed and gives the biological reason for
      doubt (in the mevalonate pathway IPP is the substrate of IDI1, made by MVD). The single seed is
      an acts_upstream_of_or_within IMP. A REMOVE would be defensible on pathway logic, but nothing
      experimental shows the animal enzyme cannot run DMAPP to IPP, so the call stays. The family
      review says the human reviews keep the row as non-core; they mark it over-annotated.
