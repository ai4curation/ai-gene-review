- gene_file: genes/human/ACOX3/ACOX3-ai-review.yaml
  rows:
  - go_id: GO:0005504
    go_label: fatty acid binding
    family: PTHR10909
    ibd_node: PTN000097533
    tree_reading: >-
      IBD at the family root PTN000097533 (414 leaves) with two seeds, RGD:628684 and RGD:69245. The
      root has four children. ACOX3 is in PTN000097643 (239 leaves), which also holds rat Acox3
      (Q63448), the target's ortholog and one of the proteins carrying the experimental rows. No
      PAINT loss for the term. The target is not a seed.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO x GO:0005504: rat Acox3 Q63448 IDA PMID:8026493 and IDA PMID:8654595 (RGD); rat Acox2
      P97562 IDA PMID:8654595 (RGD); rat Acox1 P07872 and human ACOX3 O15254 have no experimental
      row.
    - >-
      publications/PMID_8026493.md and PMID_8654595.md are abstract only. Both describe oxidase
      assays on CoA esters (2-methylpalmitoyl-CoA, 2-methylpentadecanoyl-CoA, inhibition by
      3-methylheptadecanoyl-CoA); neither abstract mentions binding of a free fatty acid.
    - >-
      interpro/panther/PTHR10909/PTHR10909-review.yaml leaves this node and term UNRESOLVED and
      records that ACOX enzymes bind acyl-CoA.
    review_edited: false
    notes: >-
      The rat ortholog is a seed, so this is not a missing-evidence case. The ground is the term on
      the seeds: the two seed papers, as far as their abstracts go, assay acyl-CoA substrates, which
      is fatty-acyl-CoA binding and not fatty acid binding. The full texts were not read, so this is
      a CHECK query for RGD and no REMOVE_IBD is asked for. If the full text shows a free fatty acid
      ligand the row should become KEEP_AS_NON_CORE. The same-term IEA row keeps the same action.
- gene_file: genes/human/SPINK5/SPINK5-ai-review.yaml
  rows:
  - go_id: GO:0030154
    go_label: cell differentiation
    family: PTHR10913
    ibd_node: PTN000099219
    tree_reading: >-
      IBD at PTN000099219 (210 of the 223 leaves in the family) with nine seeds, including human
      SPINK5 itself (Q9NQ38), FST (P19883) and FSTL3 (O95633). The node has three children. SPINK5 is
      in PTN000857287 (93 leaves, with agrin, TMEFF and SPINK members); FST and FSTL3 are in
      PTN001657053 (42 leaves), which carries its own IBDs for activin and BMP signalling regulation.
      UniProt now places SPINK5 in PTHR47499, where it is not a leaf; the tree read is PTHR10913.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q9NQ38 x GO:0030154 with descendants returns IDA PMID:12915442 for GO:0009913
      epidermal cell differentiation and three TAS rows from the same paper (UniProt). That IDA is
      the target's contribution to the seed list.
    - >-
      The review marks that IDA row MARK_AS_OVER_ANNOTATED and quotes the paper, LEKTI is a marker of
      epithelial differentiation, so the seed is an expression marker and not participation.
    review_edited: false
    notes: >-
      The target is its own seed, which would normally argue for keeping the row, but the review
      judges that seed row itself an over-reading of an expression pattern, and the remaining seeds
      in other child clades are follistatins acting through activin binding. The reason says both
      and names the node. The SPINK5 row should be dropped from the seed list; the other six MOD
      seeds were not located on the tree, so no node is named for a move. The family review does
      not cover this term.
- gene_file: genes/human/ATG7/ATG7-ai-review.yaml
  rows:
  - go_id: GO:0034727
    go_label: piecemeal microautophagy of the nucleus
    family: PTHR10953
    ibd_node: PTN000102341
    tree_reading: >-
      IBD at PTN000102341 (112 leaves, the ATG7 clade of the 1090-leaf family) with one seed, yeast
      ATG7 (SGD:S000001214, P38862). The node has two children, PTN000102342 (54 leaves) holding the
      target and the seed, and PTN007473297 (58 leaves, plants and protists). Inside PTN000102342 the
      seed is in the fungal clade PTN000859988 (15 leaves) and human ATG7 in the sister clade
      PTN000859973 (36 leaves), joined at PTN000102343 (51 leaves). The lineage carries PAINT losses
      for nucleotidyltransferase and thiosulfate-cyanide sulfurtransferase activity but none for
      this term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000859988
    evidence_checked:
    - QuickGO P38862 x GO:0034727 returns IMP PMID:18701704 (SGD).
    - >-
      PubMed abstract of PMID:18701704 (doi 10.1091/mbc.e08-04-0363) states that the process occurs
      in S. cerevisiae at nucleus-vacuole junctions and that atg mutants block the terminal vacuole
      enclosure and fusion stages.
    review_edited: false
    notes: >-
      The reason names the node and the yeast seed and gives the reason for doubt outside fungi (the
      process is defined at nucleus-vacuole junctions). One fungal IMP seed three nodes below the
      IBD; the animal clade holds no seed. The family review does not cover this term.
- gene_file: genes/human/MOCS3/MOCS3-ai-review.yaml
  rows:
  - go_id: GO:0004792
    go_label: thiosulfate-cyanide sulfurtransferase activity
    family: PTHR10953
    ibd_node: PTN000102040
    tree_reading: >-
      IBD at the family root PTN000102040 (1090 leaves) with one seed, yeast UBA4 (SGD:S000001153,
      P38820). The root has two children, the 1049-leaf clade PTN000102041 holding the target and
      the seed, and a 41-leaf bacterial clade. MOCS3 and UBA4 join at PTN000102537 (52 leaves), with
      the seed in the fungal clade PTN000860032 (17 leaves) and MOCS3 in the sister clade
      PTN000860017 (35 leaves). A PAINT loss (NOT IRD) for this term exists on the ATG7 lineage,
      none on the MOCS3 lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P38820 x GO:0004792 returns IDA PMID:19864628 (SGD); O95396 has only the IBA.
    - >-
      PubMed abstract of PMID:19864628 (doi 10.1073/pnas.0900729106) is a protein microarray study
      of S-nitrosylation; it mentions the rhodanese family but no thiosulfate-cyanide assay on Uba4.
    - >-
      The review's quote from PMID:17459099 states that in humans thiosulfate is not the
      physiologic sulfur donor for MOCS3.
    - >-
      interpro/panther/PTHR10953/PTHR10953-review.yaml assesses this node and term as TOO_DEEP and
      places the activity on the rhodanese-domain MOCS3/UBA4/MoeZ lineage.
    review_edited: false
    notes: >-
      Ground is on the target: the isolated rhodanese-like domain transfers sulfur to cyanide in
      vitro at a low rate and thiosulfate is not the physiological donor, an in vitro activity of
      unknown relevance. The review has no reason field for this row; the summary carries the
      argument. Separately the IBD is too deep (family root, one seed) as the family review says,
      and the single seed paper looks like a possible wrong-term seed (an S-nitrosylation array
      study). That is a lead from the abstract only, a CHECK query for SGD.
- gene_file: genes/human/BHLHE40/BHLHE40-ai-review.yaml
  rows:
  - go_id: GO:0009952
    go_label: anterior/posterior pattern specification
    family: PTHR10985
    ibd_node: PTN000105428
    tree_reading: >-
      IBD at PTN000105428 (400 of the 406 leaves in the family) with sixteen seeds. The node has two
      children, PTN007475037 (93 leaves, the HEY clade) and PTN000862345 (307 leaves) holding the
      target. BHLHE40 is in PTN002590934 (22 leaves) and BHLHE41 in PTN002590915 (21 leaves); both
      are children of PTN001334346 (230 leaves), as are the HES7 clade PTN004213612 and the HES1
      clade PTN002590956. Worm lin-22 joins only at PTN000105429 (296 leaves). The lineage shows no
      PAINT loss for this term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO over the BHLHE40 clade PTN002590934 and the BHLHE41 clade PTN002590915 for
      GO:0009952 with descendants returns no experimental row in either.
    - >-
      The same query over PTN001334346 returns 37 experimental rows, all on HES and her genes (mouse
      Hes7, Hes1, Hes3, zebrafish her1, her4.1, her5, her6, her11, her12, her15.1, hes6, Xenopus
      hes7.1, chick hairy1), mostly somitogenesis and midbrain-hindbrain boundary terms.
