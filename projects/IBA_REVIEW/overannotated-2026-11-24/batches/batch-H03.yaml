genes:
- gene_file: genes/human/CGAS/CGAS-ai-review.yaml
  rows:
  - go_id: GO:0071360
    go_label: cellular response to exogenous dsRNA
    family: PTHR10656
    ibd_node: PTN002579681
    tree_reading: >-
      IBD at PTN002579681 (23 leaves, 19 species, the vertebrate cGAS clade) with one seed, mouse Cgas
      (MGI:MGI:2442261, Q8C6L5). The node has two children; human CGAS and the mouse seed are both in
      the tetrapod clade PTN008308866 (19 leaves), the other child is the fish clade PTN002579684
      (4 leaves). No PAINT loss for the term on the lineage. The target is not a seed.
    ground: BAD_SEED
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002579681
    evidence_checked:
    - >-
      QuickGO Q8C6L5 x GO:0071360 returns IMP PMID:23258413 and IDA PMID:24077100, PMID:28214358,
      PMID:28363908 (all UniProt); the same query shape on Q8N884 returns only the IBA and the IEA.
    - >-
      publications/PMID_23258413.md (full text) states that knockdown of cGAS did not affect IRF3
      activation by Sendai virus, an RNA virus, and that biotinylated RNA did not bind cGAS. The
      other three seed papers are titled on cGAMP transfer and cGAS-DNA binding.
    - QuickGO ontology search confirms GO:1990786 cellular response to dsDNA exists and is not obsolete.
    review_edited: true
    notes: >-
      The earlier reason already said the seed was a stimulus term-selection error but kept the row
      as over-annotated. A term that the seed paper itself contradicts is wrong for the gene, so the
      IBA and the same-term Ensembl Compara IEA row were both changed to REMOVE. The four mouse
      UniProt rows are candidate source defects (dsRNA written for dsDNA); only PMID:23258413 was
      read in full, so the other three are a CHECK query. No family review exists for PTHR10656.
- gene_file: genes/human/DNAH10/DNAH10-ai-review.yaml
  rows:
  - go_id: GO:0051959
    go_label: dynein light intermediate chain binding
    family: PTHR10676
    ibd_node: PTN000743491
    tree_reading: >-
      IBD at the family root PTN000743491 (422 leaves, 57 species) with three seeds, human DYNC1H1
      (Q14204), MGI:MGI:103147 and RGD:71042. The root has eleven child clades. DNAH10 is in
      PTN002241869 (23 leaves, the DNAH10 orthologs). The cytoplasmic dynein 1 clade PTN000072732
      (46 leaves) holds DYNC1H1 and its mouse and rat orthologs. No PAINT loss for the term in the
      lineage. UniProt now places DNAH10 in PTHR22878, where it is not a leaf; the tree read is the
      PTHR10676 tree the IBD comes from.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000072732
    evidence_checked:
    - >-
      QuickGO over all 422 family members for GO:0051959 returns three experimental rows, human
      DYNC1H1 IPI PMID:25272277, mouse Dync1h1 IPI PMID:16496424 and rat Dync2h1 IPI PMID:12432068.
      None is in an axonemal heavy chain clade.
    - >-
      The review's own quotes (PMID:36792588, PMID:40898283) state that DNAH10 was not affected by
      loss of DNALI1 and that the IDAf complex comprises intermediate, light and heavy chains.
    - >-
      Sibling reviews: DNAH5 carries REMOVE for the same IBA and IEA rows on the same ground (upheld
      in rereview-2026-11-21 batch-03); DNAH1, a DNALI1-associated heavy chain, carries ACCEPT.
    review_edited: true
    notes: >-
      The earlier reason gave evidence that the I1/f arm has no light intermediate chain partner,
      which is evidence against the function in this branch and not just doubt, so the row moves to
      REMOVE like the outer arm heavy chains. The InterPro IEA row on the same term was changed to
      REMOVE too. A strict move to PTN000072732 also drops the term from the dynein-2 clade
      PTN002472914, where rat Dync2h1 has an IPI row; PAINT would need a second IBD there.
