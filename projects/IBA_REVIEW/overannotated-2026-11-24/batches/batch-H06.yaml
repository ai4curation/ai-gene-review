genes:
- gene_file: genes/human/GGT1/GGT1-ai-review.yaml
  rows:
  - go_id: GO:0031179
    go_label: peptide modification
    family: PTHR11686
    ibd_node: PTN002618274
    tree_reading: >-
      IBD at PTN002618274 (31 leaves, the vertebrate GGT1 clade) with one seed, RGD:2683 (rat
      Ggt1). The node has two child clades. GGT1 is in PTN008524021 (21 leaves, tetrapod GGT1 with
      human GGT2P and GGT3P), which also holds the rat seed; the sister PTN002618284 (10 leaves) is
      fish ggt1. No PAINT loss for the term on the lineage.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002618274
    evidence_checked:
    - >-
      QuickGO, rat Ggt1 P07314, GO:0031179 and descendants, returned the IBA and one IDA row from
      PMID:11601992 (RGD).
    - QuickGO, human GGT1 P19440, same query, returned only the IBA.
    - >-
      PubMed abstract of PMID:11601992. A steady-state kinetic study of purified rat kidney GGT
      transferring the gamma-glutamyl group of synthetic L-glutamyl gamma-anilides to Gly-Gly.
      Abstract only.
    - >-
      interpro/panther/PTHR11686/PTHR11686-review.yaml lists this node and term as UNRESOLVED,
      citing the gene review.
    review_edited: true
    notes: >-
      The action stands but the old reason rested on the term being general, which is not a
      ground. Rewritten to rest on the seed, an in vitro transpeptidation assay with artificial
      donors read as a biological process. The seed judgement is from the abstract, so the PAINT
      request is a query to RGD about the IDA row, not a confirmed defect.
- gene_file: genes/human/LEP/LEP-ai-review.yaml
  rows:
  - go_id: GO:0006629
    go_label: lipid metabolic process
    family: PTHR11724
    ibd_node: PTN002620302
    tree_reading: >-
      IBD at PTN002620302 (24 leaves, the family root in the lineage listing, vertebrate leptins)
      with two seeds, MGI:104663 (mouse Lep) and RGD:3000 (rat Lep). LEP is in the child clade
      PTN008328383 (21 leaves, tetrapod LEP) together with both seeds; the sister PTN002620317 (3
      leaves) is fish leptin. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002620302
    evidence_checked:
    - >-
      QuickGO, mouse Lep P41160, GO:0006629 and descendants. Six MGI experimental rows, all with
      the qualifier acts_upstream_of_or_within (IMP PMID:12815040 to GO:0006629, IGI PMID:22958918
      to fatty acid beta-oxidation, IGI PMID:15995171, IDA PMID:12114517, IGI PMID:28069950, IMP
      PMID:16513828).
    - >-
      QuickGO, rat Lep P50596, same query. Two RGD IDA rows with involved_in, GO:0009062 fatty acid
      catabolic process (PMID:12058043) and GO:0060587 regulation of lipoprotein lipid oxidation
      (PMID:21068181); the rest are ISO from mouse.
    - >-
      PubMed abstract of PMID:12815040. SCD4 expression in hearts of leptin-deficient ob/ob mice
      and its repression by leptin treatment.
    review_edited: false
    notes: >-
      The existing reason (leptin regulates lipid metabolism through LEPR signalling and does not
      take part in the reactions) is the seed-overreach argument, and the propagation_review
      already names the node and both rodent seeds, so the file was left alone. The mouse seeds are
      upstream-effect rows that PAINT projects as involved_in. The rat IDA papers were not read.
  - go_id: GO:0032868
    go_label: response to insulin
    family: PTHR11724
    ibd_node: PTN002620302
    tree_reading: >-
      IBD at PTN002620302 (24 leaves) with two seeds, UniProtKB:P50595 (bovine LEP) and MGI:104663
      (mouse Lep). LEP and both seeds are in the child clade PTN008328383 (21 leaves); the sister
      PTN002620317 is fish leptin. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002620302
    evidence_checked:
    - >-
      QuickGO, bovine LEP P50595, GO:0032868 and descendants, returned an IDA row from
      PMID:12881203 (AgBase).
    - >-
      QuickGO, mouse Lep P41160, same query, returned IMP acts_upstream_of_or_within GO:0032868
      from PMID:16141392 and IDA acts_upstream_of_or_within GO:0032869 from PMID:29519872 (MGI).
    - >-
      PubMed abstract of PMID:12881203. Insulin infusion raised plasma leptin and adipose leptin
      mRNA in periparturient dairy cows.
    - >-
      PubMed abstract of PMID:16141392. VGF ablation lowers glucose and insulin in obese mouse
      models including ob/ob.
    review_edited: true
    notes: >-
      Action stands. The old reason called the IBA an Ensembl Compara ortholog transfer, which
      misstates the source; rewritten to name the PAINT node and what each seed shows (leptin
      levels responding to insulin, and altered insulin physiology in leptin deficiency). Both
      papers read as abstracts.
- gene_file: genes/human/MAN1B1/MAN1B1-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR11742
    ibd_node: PTN002482736
    tree_reading: >-
      IBD at PTN002482736 (158 leaves) with two seeds, UniProtKB:Q9UKM7 (human MAN1B1 itself) and
      CGD:CAL0000181785. MAN1B1 is in the child clade PTN002482737 (99 leaves, animal and fungal
      MAN1B1 orthologs); the sister PTN007533099 (59 leaves) is plant and protist. The family root
      PTN000201533 carries the endoplasmic reticulum IBD. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      treeview reports the target is itself a seed. The review holds the gene's own membrane IDA
      row (PMID:18003979) and an endoplasmic reticulum membrane IDA row from the same paper, plus
      EXP (PMID:10409699) and IEA rows for endoplasmic reticulum membrane, all ACCEPT.
    review_edited: true
    notes: >-
      The term is true and rests on the gene's own experimental row, so it is not an
      over-annotation. Bare membrane beside accepted endoplasmic reticulum membrane rows is the
      TOO_GENERAL case named in the README. For consistency the four other rows on GO:0016020 (IEA,
      HDA, IDA, TAS) were changed from MARK_AS_OVER_ANNOTATED to TOO_GENERAL too; only their action
      line changed. The existing proposed_replacement_terms (GO:0005789) were kept.
- gene_file: genes/human/STAT2/STAT2-ai-review.yaml
  rows:
  - go_id: GO:0006952
    go_label: defense response
    family: PTHR11801
    ibd_node: PTN000927860
    tree_reading: >-
      IBD at PTN000927860 (180 leaves) with ten seeds, one of which is UniProtKB:P52630 (human
      STAT2 itself); the others include human STAT1 (P42224), mouse Stat1, Stat2 and Stat3, rat
      Stat3 and Stat5b, fly Stat92E, a worm STAT and a zebrafish STAT. STAT2 is in the child clade
      PTN000927862 (170 leaves, the animal STATs); the sister PTN001370513 (10 leaves) is
      Dictyostelium. The STAT2 clade PTN002623821 (20 leaves) carries its own IBDs for ISGF3
      complex and type I interferon-mediated signaling pathway. No loss recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, human STAT2 P52630, GO:0006952 and descendants. Returned the IBA, an IMP row to
      GO:0051607 defense response to virus (PMID:23391734, UniProt), and IMP rows to type I
      interferon-mediated signaling pathway.
    - >-
      QuickGO, mouse Stat2 Q9WVL2, same query. Experimental rows are IMP to GO:0060337
      (PMID:24598055, PMID:28165510) and GO:0060339.
    - >-
      interpro/panther/PTHR11801/PTHR11801-review.yaml scopes GO:0006952 to subfamilies that
      include SF41 (STAT2).
    review_edited: true
    notes: >-
      The old reason was that the term is a general parent, which is not a ground for
      over-annotation. STAT2 is its own seed and its experimental row is the specific descendant
      GO:0051607, already ACCEPT in the review, so the IBA is refined to that term (MODIFY). A
      propagation_review block was added to the row because validation asks for one on a modified
      IBA.
- gene_file: genes/human/SLC26A1/SLC26A1-ai-review.yaml
  rows:
  - go_id: GO:0140900
    go_label: chloride:bicarbonate antiporter activity
    family: PTHR11814
    ibd_node: PTN008330351
    tree_reading: >-
      IBD at PTN008330351 (204 leaves) with eleven seeds. Its child clades are PTN002273826 (201
      leaves, the vertebrate SLC26 radiation, which holds the target) and PTN001371029 (3 Ciona
      leaves). PTN002273826 splits into seven clades, PTN002624460 (SLC26A3 and SLC26A8, 44),
      PTN002624466 (SLC26A1, 20), PTN002624439 (SLC26A6, 28), PTN002624472 (SLC26A4, 26),
      PTN002624481 (SLC26A2, 27), PTN002624454 (SLC26A9, 18) and PTN002624492 (SLC26A5 and SLC26A7,
      38). The seeds resolve to SLC26A3 (human, mouse), SLC26A4 (human, mouse, rat), SLC26A6 (human,
      mouse), SLC26A7 (human, mouse), mouse Slc26a9 and rat Slc26a5, so five of the seven clades are
      seeded and the SLC26A1 and SLC26A2 clades are not. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0140900 for human Q9H2B4, mouse P58735 and rat P45380 SLC26A1. Each returned
      only the IBA.
    - >-
      Positive controls for the query shape. Mouse Slc26a3 Q9WVC8 returned IDA rows
      (PMID:10428871, PMID:21976599), mouse Slc26a6 Q8CIW6 IDA and IMP rows, mouse Slc26a4 Q9R155,
      Slc26a7 Q8R2Z3 and Slc26a9 Q8BU91 IDA rows, rat Slc26a5 Q9EPH0 an IDA row.
    - MOD seed ids resolved through mygene.info (MGI and RGD to symbols).
    - >-
      interpro/panther/PTHR11814/PTHR11814-review.yaml assesses this node and term as SOUND and
      lists three of the eleven seeds.
    review_edited: true
    notes: >-
      Action stands, on the unseeded SLC26A1 clade plus the target-specific data already cited
      (PMID:27125215, sulfate exchange modes and divergent chloride handling). The old reason did
      not state the tree and the node comment said placement had not been examined; both now do.
      No single PAINT move fixes it. The seeded and unseeded clades are siblings in one polytomy,
      so the remedy would be five separate IBDs on the seeded clades, or losses on the SLC26A1 and
      SLC26A2 clades if a curator judges the activity lost there; neither is shown. The family
      review's SOUND call does not consider the SLC26A1, SLC26A2 and SLC26A8 branches.
