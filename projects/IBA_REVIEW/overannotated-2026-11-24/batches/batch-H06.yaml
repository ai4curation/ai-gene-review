- gene_file: genes/human/SLC12A4/SLC12A4-ai-review.yaml
  rows:
  - go_id: GO:0016324
    go_label: apical plasma membrane
    family: PTHR11827
    ibd_node: PTN002274228
    tree_reading: >-
      IBD at the family root PTN002274228 (411 leaves) with ten seeds. Nine are Na-coupled
      cotransporters, human SLC12A1, SLC12A2 and SLC12A3, mouse Slc12a1, Slc12a2 and Slc12a3, rat
      Slc12a1 and Slc12a3 and zebrafish slc12a1, all in PTN008527820 (190 leaves). The tenth is C.
      elegans kcc-3 (WBGene00019289) in PTN002625170 (19 leaves), the invertebrate branch of the
      KCC clade PTN000930407 (105 leaves). The vertebrate KCC clade PTN000214905 (80 leaves) splits
      into SLC12A5 (PTN002625134), SLC12A4 (PTN002625156), SLC12A7 (PTN002625146) and SLC12A6
      (PTN002625126) and holds no seed. No PAINT loss for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008527820
    evidence_checked:
    - >-
      QuickGO by GO:0016324 and by GO:0016323 for human Q9UP95 and mouse Q9JIS8 and rat Q63632
      Slc12a4. No experimental row for either term; only the IBA.
    - >-
      QuickGO, C. elegans kcc-3 Q09573, GO:0016324, returned a located_in IDA row from
      PMID:27062922 (WormBase). PubMed abstract, KCC-3 localizes to a glial microdomain around AFD
      receptive endings.
    - >-
      QuickGO, mouse Slc12a6 Q924N4, returned NOT located_in GO:0016324 by IDA from PMID:11246162
      (MGI), which also serves as the positive control for the query shape.
    - Seed ids resolved through mygene.info and placed in the tree by accession.
    review_edited: true
    notes: >-
      Action stands. The old reason called the term a KCC family-level call, which misstates the
      node (the SLC12 family root, seeded almost entirely by NKCC and NCC). Rewritten. The doubt for
      KCC1 is indirect (UniProt by-similarity basolateral role, expression in non-polarized cells),
      so it stays an over-annotation and not a removal. Moving the IBD to PTN008527820 keeps nine
      seeds; the worm kcc-3 row would then stand on its own.
- gene_file: genes/human/SLC12A5/SLC12A5-ai-review.yaml
  rows:
