    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008527820
    evidence_checked:
    - >-
      QuickGO by GO:0016324 for human Q9H2X9, mouse Q91V14 and rat Q63633 Slc12a5. No experimental
      row.
    - Seed placement and controls as for SLC12A4.
    review_edited: false
    notes: >-
      The existing reason already says the node is seeded by epithelial cation-chloride
      cotransporters (NKCC2, NCC) and that KCC2 is a neuronal transporter, which matches the tree
