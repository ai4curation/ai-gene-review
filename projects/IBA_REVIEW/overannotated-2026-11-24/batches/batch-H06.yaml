- gene_file: genes/human/SLC26A3/SLC26A3-ai-review.yaml
  rows:
  - go_id: GO:0015116
    go_label: sulfate transmembrane transporter activity
    family: PTHR11814
    ibd_node: PTN000929279
    tree_reading: >-
      IBD at PTN000929279 (389 leaves) with 18 seeds from fungi (two budding yeast, two fission
      yeast, one Aspergillus), fly, worm, zebrafish, chicken and mammals, including human SLC26A2
      (P50443), SLC26A6 (Q9BXS9), SLC26A7 (Q8TE54) and SLC26A8 (Q96RN1). SLC26A3 sits in
      PTN002624460 (44 leaves) with SLC26A8, inside the vertebrate radiation PTN002273826 (201
      leaves) that also holds the SLC26A2, SLC26A6 and SLC26A7 seeds. SLC26A3 itself and its mouse
      and rat orthologs are not seeds. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, human P40879, mouse Q9WVC8 and rat Q924C9 SLC26A3, GO:0015116 and descendants. Only
      the IBA and an InterPro IEA to GO:0008271; no experimental row.
    - >-
      PubMed abstract of PMID:12651923. Human DRA in oocytes mediates Cl-/Cl- and Cl-/HCO3-
      exchange, with oxalate transport low and sulfate transport undetectable.
    - >-
      interpro/panther/PTHR11814/PTHR11814-review.yaml assesses the node as SOUND.
    review_edited: false
    notes: >-
      The existing reason is already node-aware (names PTN000929279, PTN002273826 and the sister
      paralog SLC26A8) and rests on conflicting direct data on the gene (sulfate transport reported
      in PMID:7744840 and PMID:9473459, undetectable in PMID:12651923). Those two earlier papers
      were not re-read. A sulfate flux measurement on human SLC26A3 with matched controls would
      settle it.
  - go_id: GO:1902358
    go_label: sulfate transmembrane transport
    family: PTHR11814
    ibd_node: PTN000212046
    tree_reading: >-
      IBD at PTN000212046 (370 leaves) with 19 seeds, the process counterpart of the activity IBD
      one node above, with the same spread (fungi, fly, zebrafish, mammals, including human
      SLC26A2, SLC26A6, SLC26A7, SLC26A8 and SLC26A11 Q86WA9). SLC26A3 is in PTN002624460 inside
      PTN002273826, alongside seeded paralog clades; it and its orthologs are not seeds. No loss
      recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, human P40879, mouse Q9WVC8 and rat Q924C9, GO:1902358 and descendants. Only the IBA
      and an InterPro IEA.
    - PubMed abstract of PMID:12651923, as above.
    review_edited: false
    notes: >-
      Same judgement as the activity row; the existing reason is node-aware and the IEA row on the
      term carries the same action.
- gene_file: genes/human/PKLR/PKLR-ai-review.yaml
  rows:
  - go_id: GO:0032869
    go_label: cellular response to insulin stimulus
    family: PTHR11817
    ibd_node: PTN000212861
    tree_reading: >-
      IBD at PTN000212861 (51 leaves, vertebrate PKLR plus PKM) with one seed, RGD:3336 (rat Pklr).
      The node has two child clades, PTN008982094 (19 leaves, PKLR, holding human PKLR and the rat
      seed) and PTN002624646 (32 leaves, PKM). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000212861
    evidence_checked:
    - >-
      QuickGO, rat Pklr P12928, GO:0032869 and GO:0032868 with descendants. One experimental row,
      IDA to GO:0032869 from PMID:9395079 (RGD).
    - >-
      PubMed abstract of PMID:9395079. Insulin and cAMP act at different levels on transcription
      of the L-type pyruvate kinase gene in cultured rat hepatocytes.
    - >-
