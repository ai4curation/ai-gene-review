      IBD at PTN000241531 (285 leaves) with four seeds: ST8SIA2 and ST8SIA4 in clade
      PTN002485601, ST8SIA3 in clade PTN008334478, and mouse St8sia6 (MGI:2386797, Q8K4T1) in
      clade PTN008987884 (24 leaves), which is inside PTN002485590 (67 leaves), the clade that
      holds ST8SIA1. Seeds therefore sit on three sides of the node and one is inside the target
      clade.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO: ST8SIA2, ST8SIA3, ST8SIA4 IDA GO:0009311 from PMID:10766765; mouse St8sia6 IDA
      from PMID:11980897 (BHF-UCL).
