- gene_file: genes/human/SLC39A12/SLC39A12-ai-review.yaml
  rows:
  - go_id: GO:0140410
    go_label: >-
      monoatomic cation:bicarbonate symporter activity
    family: PTHR12191
    ibd_node: PTN000953562
    tree_reading: >-
      IBD at PTN000953562 (188 leaves, the LIV-1 family) with four seeds, human ZIP8 (Q9C0K1)
      and ZIP14 (Q15043) and their rodent orthologs. ZIP8 is in clade PTN002638854 (22 leaves)
      and ZIP14 in PTN002638862 (20 leaves). Both are children of PTN008337079 (79 leaves), an
      unresolved node whose four children are the ZIP12 clade PTN002638809 (19 leaves, target),
      ZIP8, ZIP4 (PTN002638816, 18 leaves) and ZIP14. ZIP6, ZIP10 and the rest of the family
      join only at PTN000257245 (167 leaves) or above and have no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002638854
    evidence_checked:
    - >-
      QuickGO: ZIP8 IDA GO:0140410 from six papers (UniProt), ZIP14 IDA from PMID:31699897.
    - >-
      SLC39A12 UniProt record: catalytic activity given as Zn(2+)(in) = Zn(2+)(out), RHEA:29351,
      by similarity; the IBA is the only symporter annotation.
    review_edited: false
    notes: >-
      Borderline. The IBD at the family root is clearly too deep, but the tree does not resolve
      ZIP8 and ZIP14 as sisters, so a move to their common node PTN008337079 would still cover
      ZIP12 and ZIP4. The fix recorded here is one IBD per seeded clade (PTN002638854 and
      PTN002638862), which is what the evidence supports for a transport stoichiometry. The
      doubt on ZIP12 itself is only the UniProt by-similarity reaction, so a direct
      bicarbonate-dependence assay on ZIP12 would settle it either way.
