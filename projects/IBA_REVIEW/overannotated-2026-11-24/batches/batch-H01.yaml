- gene_file: genes/human/DUSP5/DUSP5-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR10159
    ibd_node: PTN001605855
    tree_reading: >-
      IBD at PTN001605855 (500 leaves) with 16 seeds across its child clades. The child holding the target,
      PTN008938957 (95 leaves), contains the inducible nuclear MKPs; under PTN002562847 (81 leaves) the
      DUSP5 clade PTN002562861 (21 leaves) sits beside the DUSP2, DUSP4 and DUSP1 clades. Two seeds are
      inside PTN002562847, human DUSP1 and Xenopus dusp1-a, both in the DUSP1 clade PTN002562870 (23 leaves).
      The other seeds (DUSP6, DUSP7, DUSP10, DUSP16, rat Dusp6, mouse Dusp9, fly Mkp3, yeast MSG5 and
      SDP1, S. pombe pmp1, trypanosome and Arabidopsis members) join only at the IBD node. The DUSP5 clade
      has no seed. PTN000806857 (86 leaves, on the target lineage) carries an IBD for nucleus.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:0005737 and descendants for all seeds, e.g. DUSP1 located_in IDA PMID:7593328, DUSP6
      IDA PMID:8670865 and PMID:9788880, DUSP7 EXP PMID:9788880, S. pombe pmp1 is_active_in IDA PMID:16291757,
      yeast MSG5 IDA PMID:17952059.
    - >-
      Gene review quotes on the target: PMID:25519881 (DUSP5 localizes solely to the nucleus), PMID:15713638
      and PMID:28053233 (nuclear inactivator and anchor of ERK).
    review_edited: false
    notes: >-
      The seeds are sound and the node placement is ordinary for a location shared by most of the family.
      The ground is evidence on the target: DUSP5 carries a functional NLS and is reported as exclusively
      nuclear, so is_active_in cytoplasm is doubtful for it. That reported restriction rests on tagged
      or induced protein, so it is treated as doubt and not as loss. Fractionation of endogenous DUSP5
      with an ERK-binding mutant as control would settle it. Existing reason names the node and the cytoplasmic
      MKP seeds; left alone.
