genes:
- gene_file: genes/human/CCS/CCS-ai-review.yaml
  rows:
  - go_id: GO:0019430
    go_label: removal of superoxide radicals
    family: PTHR10003
    ibd_node: PTN000000113
    tree_reading: >-
      IBD at the family root PTN000000113 (456 leaves) with 10 seeds. Eight are catalytic SOD1 and SOD3
      enzymes (human, bovine, mouse, rat, yeast, worm, fly Sod3). Two are copper chaperones inside the
      CCS clade PTN008300250 (96 leaves), which holds human CCS (leaf PTN002467124): fly Ccs joins the
      target lineage at PTN000000119 (29 leaves) and yeast CCS1 at PTN008300252 (40 leaves). PTN008300250
      already carries NOT IRD GO:0004784 superoxide dismutase activity and IBD GO:0016532 copper chaperone
      activity. A NOT IRD for GO:0019430 exists elsewhere in the family at PTN008300295 (fly Sodq clade).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008300250
    evidence_checked:
    - >-
      QuickGO by accession and GO id for every model-organism leaf under the node. Fly Ccs (E1JH26) has
      involved_in IDA PMID:18948262 (UniProt); yeast CCS1 (P40202) has involved_in IDA PMID:9295278 (ComplexPortal,
      the same reference and term given to yeast SOD1). SOD1 and SOD3 seeds carry IDA or IMP rows (the
      query returned hits, so the query shape is sound).
    - >-
      publications/PMID_18948262.md (full text cached), title on instability of Drosophila SOD1 in mutants
      deficient for its copper chaperone; PMID_9295278.md abstract only.
    - >-
      interpro/panther/PTHR10003/PTHR10003-review.yaml asks for an IRD at PTN008300250 for this term.
    review_edited: true
    notes: >-
      Action unchanged. Reason rewritten because it said the IBA comes from catalytic SODs only; two seeds
      are CCS proteins whose evidence shows necessity for SOD1 activity, not participation. The ADD_IRD
      is preferred over REMOVE_IBD because the eight SOD seeds are sound; the two chaperone seed rows
      (yeast CCS1 ComplexPortal, fly Ccs UniProt) are the over-reach. The NAS row on human CCS keeps the
      same action.
- gene_file: genes/human/CASQ1/CASQ1-ai-review.yaml
  rows:
  - go_id: GO:0030018
    go_label: Z disc
    family: PTHR10033
    ibd_node: PTN000004019
    tree_reading: >-
      IBD at PTN000004019 (46 leaves), the node joining the CASQ1 clade PTN002559189 (22 leaves, target
      here) and the CASQ2 clade PTN002559177 (24 leaves). Four seeds, in both clades: zebrafish casq1a
      and casq1b in PTN002559189; mouse and rat Casq2 in PTN002559177. The same node carries IBDs for
      SR lumen and terminal cisterna. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000004019
    evidence_checked:
    - >-
      QuickGO, all located_in IDA on GO:0030018: zebrafish casq1a (A0A0R4IKE0) and casq1b (F6P0J3) PMID:26585961
      (ZFIN); mouse Casq2 (O09161) PMID:19383796 (MGI); rat Casq2 (P51868) PMID:11053140 (BHF-UCL).
    - >-
      PubMed abstracts. PMID:26585961 says skeletal Casqs were found primarily at the sarcomere Z-line
      level where terminal cisternae of the SR are located. PMID:19383796 and PMID:11053140 describe Casq2
      in cardiac junctional SR and dyads by immunolabelling. None was read in full.
    - >-
      interpro/panther/PTHR10033/PTHR10033-review.yaml marks this node UNRESOLVED pending the source images.
    review_edited: true
    notes: >-
      Action unchanged. Reason rewritten to name the node and seeds; the old text cited rat fractionation,
      which is not the seed evidence. The over-reach is adjacency at light-microscope resolution propagated
      as is_active_in (pattern 21 type). Seed papers abstract-only, so the seed rows are a query for ZFIN,
      MGI and BHF-UCL, not confirmed defects.
- gene_file: genes/human/GUSB/GUSB-ai-review.yaml
  rows:
  - go_id: GO:0005102
    go_label: signaling receptor binding
    family: PTHR10066
    ibd_node: PTN000007266
    tree_reading: >-
      IBD at PTN000007266 (14 leaves, 11 placental mammal species) with one seed, human GUSB itself. Children
      are PTN008493212 (6 leaves, primates and rodents, target here) and PTN000007307 (8 leaves, bovine,
      pig, horse, cat, dog).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000007266
    evidence_checked:
    - >-
      QuickGO. Human GUSB (P08236) enables IPI PMID:20028034 (AgBase); bovine GUSB (A3KMY8) enables IPI
      PMID:21672540 (AgBase), not listed as a seed.
    - >-
      Gene review IPI row for PMID:20028034 (cached, full text) with UniProtKB:P08169, the cation-independent
      mannose 6-phosphate receptor; GUSB is used there as an M6P-bearing ligand.
    review_edited: true
    notes: >-
      Action unchanged, consistent with the IPI seed row on the same term (also MARK_AS_OVER_ANNOTATED).
      Reason rewritten; it had leaned on the term being an uninformative binding term. The target being
      its own seed is not the ground; the seed evidence (cargo recognition by a sorting receptor through
      the glycan) is.
  - go_id: GO:0030246
    go_label: carbohydrate binding
    family: PTHR10066
    ibd_node: PTN001600419
    tree_reading: >-
      IBD at PTN001600419 (46 of the family's 47 leaves) with one seed, rat Gusb, which is in the same
      child clade PTN000007257 (45 leaves) as human GUSB and joins the target lineage at PTN008493212
      (6 leaves). The other child is a single Sulfolobus leaf.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001600419
    evidence_checked:
    - QuickGO. Rat Gusb (P06760) enables IDA PMID:8702598 (RGD) on GO:0030246.
    - >-
      QuickGO by reference PMID:8702598 returns 27 RGD IDA rows. Each enzyme assayed gets an activity
      term plus a ligand-binding term (carbohydrate binding for Gusb, Fuca1, Hexb, Gaa; galactoside binding
      for Gla, Glb1; D-mannose binding for Man2b1, Manba; peptide binding for the cathepsins, Anpep, Thop1).
    - >-
      PubMed abstract of PMID:8702598 (cached copy is abstract only). It surveys rat mannose 6-phosphate
      glycoproteins with an MPR probe and assays 16 lysosomal enzyme activities. No lectin or sugar-binding
      assay on GUSB is described.
    review_edited: true
    notes: >-
      Action unchanged. The old reason (subsumed by the activity term) was a redundancy argument, which
      is not a ground; rewritten to the seed. The RGD practice across the paper is a deliberate pattern,
      so this is recorded as a query for RGD, and the REMOVE_IBD depends on RGD agreeing that the binding
      rows restate catalysis. If RGD keeps the row, the IBA would be KEEP_AS_NON_CORE (true, trivially,
      of a glycosidase).
- gene_file: genes/human/PMS1/PMS1-ai-review.yaml
  rows:
  - go_id: GO:0006298
    go_label: mismatch repair
    family: PTHR10073
    ibd_node: PTN000008161
    tree_reading: >-
      IBD at the family root PTN000008161 (367 leaves) with 14 seeds. Children are the eukaryotic clade
      PTN000008162 (337 leaves, target here) and the bacterial MutL clade PTN000008416 (30 leaves, E.
      coli mutL seed). Human PMS1 sits in the deuterostome PMS1 clade PTN000008324 (22 leaves), which
      also holds mouse Pms1 (leaf PTN000008304), a seed listed as MGI:1202302. Human PMS2 joins the target
      lineage at PTN004123131 (48 leaves); yeast PMS1 and S. pombe pms1 at PTN000008286 (84 leaves); MLH1,
      MLH3 and yeast MLH2 at PTN000008319 (335 leaves). PTN000008324 carries NOT IRD for MutLalpha complex
      only.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      UniProt cross-reference MGI:1202302 resolves to mouse Pms1; QuickGO shows acts_upstream_of_or_within
      IMP PMID:9500552 (MGI) on accession F6V3H0. The tree leaf uses Q8K119, so a query on the leaf accession
      alone misses it.
    - >-
      PubMed abstract of PMID:9500552 (mice deficient in Mlh1, Pms1 and Pms2; different tumour susceptibilities
      and mutational spectra). Not read in full.
    - >-
      QuickGO for the other seeds, e.g. yeast MLH2 IMP PMID:10679328, human PMS2 IDA PMID:10871409.
    - >-
      Gene review quotes PMID:16143102 (reconstituted human reaction uses MutLalpha) and PMID:10748105.
    review_edited: true
    notes: >-
      Action unchanged. Reason rewritten to place the claim on the tree. The family review (PTHR10073)
      proposes ADD_IRD at PTN000008324 on the grounds that nothing in that clade shows repair; that is
      wrong, because mouse Pms1 is a seed inside it, and an IRD there would contradict a seed. The doubt
      is about the human protein's contribution, so no PAINT fix follows. A repair assay with purified
      human MutLbeta would settle it. If the mouse IMP is taken at face value the row could be argued
      to KEEP_AS_NON_CORE; kept over-annotated for consistency with the IEA and TAS rows on the same term.
