- gene_file: genes/human/RLBP1/RLBP1-ai-review.yaml
  rows:
  - go_id: GO:1902936
    go_label: phosphatidylinositol bisphosphate binding
    family: PTHR10174
    ibd_node: PTN000019344
    tree_reading: >-
      IBD at PTN000019344 (271 leaves) with three seeds. The CRALBP clade PTN008302321 (25 leaves, target
      here) and the clavesin clade PTN000019350 (40 leaves, seeds human CLVS1 and CLVS2) are the two children
      of PTN001300707 (65 leaves). Mouse Ttpa, the third seed, is in PTN000019447 (162 leaves), the sister
      of PTN000019348 (92 leaves) under PTN000019347 (254 leaves). The seeds bracket the target. No loss
      recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO on GO:1902936 and descendants. CLVS1 and CLVS2 enable GO:0080025 phosphatidylinositol-3,5-bisphosphate
      binding, IDA PMID:19651769 (UniProt); mouse Ttpa enables GO:0005546 and GO:0043325, IDA PMID:23599266
      (UniProt).
    - >-
      PubMed abstract of PMID:19651769 (membrane mimic assay with the clavesin 1 Sec14 domain identifies
      PI(3,5)P2 as a specific lipid partner).
    - >-
      PubMed abstract of PMID:19390642 (lipid-immunoblot shows CRALBP binding to acidic lipids, PA > PI(3,4,5)P3
      > PS > PI(4,5)P2; acidic lipids release 11-cis-retinal). Found by a PubMed search; not in publications/,
      not read in full.
    review_edited: true
    notes: >-
      The earlier ground was that no experimental evidence supports the term for CRALBP, which is a non-ground
      and also untrue. Target inside a soundly seeded clade, nothing against the term on the target, function
      peripheral to retinoid carriage, so KEEP_AS_NON_CORE. PMID:19390642 is cited in the reason without
      a quote because it is not cached; fetching it and adding it to references is a follow-up.
- gene_file: genes/human/CCNB1/CCNB1-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR10177
    ibd_node: PTN000019791
    tree_reading: >-
      IBD at PTN000019791 (2313 of the family's 2318 leaves) with 16 seeds. Human CCNB1 sits in the animal
      B-type clade PTN008302328 (106 leaves; CCNB1, CCNB2, CCNO, worm cyb, fly CycB), which holds no seed.
      Its sister under PTN008939442 (143 leaves) is the fungal B-type clade PTN008302383 (37 leaves),
      which holds the seeds yeast CLB5 and CLB6 (S. pombe cig1 and cig2 there also carry experimental
      rows). The D, E and A cyclin seeds (human CCND1, CCND2, CCNE1, rat Ccnd3, mouse Ccnd1, fly CycE
      and CycA, worm cyd-1 and cye-1) are in PTN000808716 (296 leaves), the other child of PTN007424001
      (439 leaves). Yeast and Candida Cln cyclins and Arabidopsis CYCD3-1 join higher still. PTN000808611
      and PTN000808639 carry IBDs for positive regulation of G1/S.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000808716
    evidence_checked:
    - >-
      QuickGO on GO:0000082 and descendants for all model-organism leaves under the node, e.g. CCND1 IDA
      PMID:19412162, CCNE1 IMP PMID:23083510, yeast CLB5 and CLB6 IMP and IGI PMID:8253070, Candida CLN3
      IEP PMID:10330142, rat Ccnd3 IEP PMID:7926809. No experimental row on any leaf of PTN008302328.
    review_edited: false
    notes: >-
      The seeds are sound; the node is near the family root and covers the animal mitotic B-type cyclins,
      where nothing shows a G1/S role and the biology (cyclin B1 drives G2/M with CDK1) gives reason to
      doubt it. One MOVE_IBD cannot carry all seeds: PTN000808716 takes the D, E and A cyclins, and the
      fungal S-phase B-type cyclins (PTN008302383), the Cln cyclins and the plant D cyclins need their
      own IBDs. The existing reason names the node and the divergence; it does not mention the fungal
      Clb5/Clb6 seeds in the sister clade but misstates nothing, so the file was left alone.
