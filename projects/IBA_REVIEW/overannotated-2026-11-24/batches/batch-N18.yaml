- gene_file: genes/DROME/Hsp22/Hsp22-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      IBD at PTN000897708 (293 leaves, 33 species) with seven seeds, all vertebrate small heat shock proteins
      (human HSPB6, CRYAA, HSPB2, HSPB1 and CRYAB, one mouse and one zebrafish gene). Children are PTN001354880
      (279 leaves, bilaterian sHSPs, holds the target and the seeds) and PTN000897825 (14 Nematostella leaves).
      Hsp22 is leaf PTN000163333 in a Drosophila-only clade PTN001692891 (9 leaves, 1 species). The same node
      carries cytoplasm (25 seeds), response to heat and protein refolding. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO with descendants. HSPB1 P04792 located_in nucleus IDA PMID:19464326; CRYAB P02511 IDA PMID:19464326
      and PMID:20587334; Hsp22 P02515 returns only the IBA.
    - >-
      The review accepts mitochondrial matrix IDA PMID:10896659 for Hsp22 and quotes the paper for mitochondrial
      localisation in S2 cells and after expression in mammalian cells.
    - No family review exists for PTHR45640.
    review_edited: false
    notes: >-
      The node is soundly seeded and the target is inside the seeded clade, so the ground is on the target.
      Hsp22 carries a mitochondrial targeting sequence and is imaged in the matrix, a compartment that argues
      against a nuclear site of action; the review also records an old nuclear-fraction signal for a 22 kDa
      species that predates paralog-specific reagents, which is why the row is doubt and not a removal. The
      reason names the node and gives this evidence. Left alone. If the curators accept the matrix import
      as excluding the nucleus, the form would be a loss at the Hsp22 leaf PTN000163333.
- gene_file: genes/DROME/Toll-6/Toll-6-ai-review.yaml
  rows:
  - go_id: GO:0008201
    go_label: heparin binding
    family: PTHR45836
    ibd_node: PTN002911633
    tree_reading: >-
      IBD at PTN002911633 (96 leaves, 29 species) with four seeds, fly Slit (FB:FBgn0264089), human SLIT2
      (O94813) and two mouse genes. Children are PTN000689994 (88 leaves, vertebrate Slits and relatives)
      and PTN001224992 (8 leaves, 6 species, holds the target). The target's clade holds nematode slt-1,
      fly sli (the fly seed), two Anopheles genes, a Daphnia gene and Toll-6, which pairs with one Anopheles
      gene at PTN000687709 (2 leaves). The same node carries Roundabout binding (5 seeds). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO. Fly sli P24014 and human SLIT2 O94813 each enable GO:0008201 by IDA from PMID:17062560.
    - >-
      interpro/panther/PTHR45836/PTHR45836-review.yaml rates this node SOUND (seeded from Slits and Nogo receptors)
      and notes the Toll-6 members are untested.
    - >-
      rereview-2026-11-21 batch N13 upheld REMOVE of Roundabout binding on Toll-6 from the same node, with
      an IRD requested at PTN000687709.
    review_edited: false
    notes: >-
      The node is sound and one seed is in the target's own child clade, so the ground is on the target.
      Toll-6 is a Toll receptor (LRR ectodomain, transmembrane segment, TIR domain; UniProt assigns it to
      PTHR24366) sitting in the Slit clade, a placement the review calls doubtful. Unlike Roundabout binding,
      which is specific to Slit, heparin binding is a property LRR ectodomains can have, so the review keeps
      it as doubt and does not remove it. The reason names the node, the seeds and the placement. Left alone.
      A heparin-binding assay on the Toll-6 ectodomain would settle it. No PAINT fix on doubt alone; if the
      Toll-6 pair is taken out of the Slit clade the row goes with it.
- gene_file: genes/DROME/Rubicon/Rubicon-ai-review.yaml
  rows:
  - go_id: GO:1901981
    go_label: phosphatidylinositol phosphate binding
    family: PTHR45971
    ibd_node: PTN002915557
    tree_reading: >-
      IBD at PTN002915557 (74 leaves, 46 species) with one seed, human RUBCNL (Pacer, Q9H714). Children are
      PTN000268914 (53 leaves, animal Rubicon and Pacer, holds the target and the seed) and PTN009190352
      (21 leaves, plants and Paramecium). Fly Rubicon is leaf PTN000269070 in the invertebrate branch PTN001748575
      (6 leaves). The treeview lineage of human RUBCNL runs through PTN002915559 and PTN000269022; the Pacer
      node PTN002915558 named as the move target is taken from the family review and batches H16, N02 and
      N09. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002915558
    evidence_checked:
    - >-
      QuickGO with descendants. RUBCNL Q9H714 enables phosphatidylinositol-3-phosphate, -4-phosphate and
      -5-phosphate binding (GO:0032266, GO:0070273, GO:0010314) by IDA from PMID:28306502 (UniProt).
    - >-
      interpro/panther/PTHR45971/PTHR45971-review.yaml rates the node TOO_DEEP and asks for the move to the
      Pacer node PTN002915558, quoting that Rubicon is not known to bind phospholipids specifically.
    review_edited: false
    notes: >-
      Same node, ground and fix as human RUBCN (H16), mouse Rubcn (N02) and worm Y56A3A.16 (N09). The reason
      names the node and the single Pacer seed and gives the negative evidence on the Rubicon lineage. Left
      alone. I did not see PTN002915558 in my own treeview output, which printed only the first ten nodes
      of the RUBCNL lineage that I asked for; the id is the one the earlier batches read.
- gene_file: genes/DROME/ptc/ptc-ai-review.yaml
  rows:
  - go_id: GO:0005119
    go_label: smoothened binding
    family: PTHR46022
    ibd_node: PTN000847539
    tree_reading: >-
      IBD at PTN000847539 (56 leaves, 32 species) with two seeds, human PTCH1 (Q13635) and PTCH2 (Q9Y6C5).
      Children are PTN000083879 (55 leaves, holds the target and both seeds) and one Nematostella leaf. Fly
      ptc is leaf PTN000083971 in the invertebrate branch PTN000083963 (11 leaves). The same node carries
      hedgehog receptor activity (6 seeds), hedgehog family protein binding and negative regulation of smoothened
      signaling. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. PTCH1 Q13635 enables GO:0005119 IPI PMID:9811851 and PMID:11278759 (BHF-UCL); PTCH2 Q9Y6C5
      IPI PMID:9811851. Fly ptc P18502 returns only the IBA.
    - >-
      PMID:9811851 abstract through PubMed (doi 10.1073/pnas.95.23.13630). PTCH and PTCH2 bind hedgehog family
      members and can form a complex with SMO.
    - >-
      genes/human/PTCH1/PTCH1-ai-review.yaml keeps the same IBA and the IPI rows as KEEP_AS_NON_CORE, on the
      same mechanistic tension.
    - The fly review quotes PMID:17284519 for co-immunoprecipitation of Patched and Smoothened in Drosophila.
    review_edited: true
    notes: >-
      MARK_AS_OVER_ANNOTATED changed to KEEP_AS_NON_CORE. The earlier reason accepted the node placement and
      the fly co-immunoprecipitation, and objected that a binding term invites the reading that association
      is the mechanism of inhibition. That is a concern about how the term is read, not a doubt about the
      seeds, the node or the target. The seeds are IPI rows, the target is in the seeded clade and has its
      own association data, so the row is kept, as non-core because inhibition is catalytic and indirect.
      propagation_review rewritten to NO_FAILURE_NON_CORE. The three quotes were kept unchanged. History
      record added.
