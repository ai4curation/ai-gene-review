- gene_file: genes/DROME/CG4860/CG4860-ai-review.yaml
  rows:
  - go_id: GO:0046359
    go_label: butyrate catabolic process
    family: PTHR43884
    ibd_node: PTN000097838
    tree_reading: >-
      IBD at PTN000097838 (46 leaves, 38 species) with one seed, rat Acads (RGD:620514). Children are PTN000857015
      (43 leaves, animal and fungal SCAD, holds the target and the seed) and PTN008453685 (3 leaves). CG4860
      is in a Drosophila-only pair PTN000097873 (2 leaves, 1 species); the fly paralog Arc42 (Q9VDT1) is
      listed next to it in the same child clade and is probably the other leaf of that pair, which I did
      not confirm. The same node carries short-chain fatty acyl-CoA dehydrogenase activity
      and beta-oxidation IBDs with 3 seeds each. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO. Rat Acads P15651 involved_in GO:0046359 IDA PMID:3968063 (RGD).
    - >-
      The review quotes PMID:40519079 for the fly knockout (no rise in C4 acylcarnitine in homozygous CG4860
      mutants) and assigns the C4 phenotype to Arc42.
    - interpro/panther/PTHR43884/PTHR43884-review.yaml has no entry for GO:0046359.
    review_edited: false
    notes: >-
      The node is soundly seeded and the target is inside the seeded clade, so the ground is on the target,
      a direct knockout that fails to show the C4 signature and a paralog that does. That is doubt short
      of loss, since acylcarnitine profiles do not exclude a minor contribution. The reason states this.
      Left alone. A substrate panel on recombinant CG4860 would settle it.
- gene_file: genes/DROME/Dic4/Dic4-ai-review.yaml
  rows:
  - go_id: GO:0015116
    go_label: sulfate transmembrane transporter activity
    family: PTHR45618
    ibd_node: PTN000756618
    tree_reading: &dic4_tree >-
      IBD at PTN000756618 (178 leaves, 86 species) with two seeds, fly Dic1 (FB:FBgn0027610) and Dic3 (FB:FBgn0033248).
      Children are PTN000640848 (62 leaves, SLC25A10 and the fly Dic paralogs, holds the target and both seeds)
      and PTN008457085 (116 leaves, plants). Dic4 is leaf PTN000640888, and that leaf carries six NOT IRD
      records for the dicarboxylate terms (malate, succinate and oxaloacetate transport and transporter activity).
      No loss is recorded for the phosphate, sulfate or thiosulfate terms.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked: &dic4_ev
    - >-
      QuickGO exact. Dic1 Q9Y166 and Dic3 A1Z787 each carry sulfate and thiosulfate transmembrane transporter
      activity and phosphate ion transmembrane transport by IDA from PMID:21130726 (FlyBase).
    - >-
      The review quotes PMID:32842667 for Dic4 (no homo- or hetero-exchange after reconstitution; inability
      to transport dicarboxylates or phosphate attributed to lost contact-point residues).
    - >-
      interpro/panther/PTHR45618/PTHR45618-review.yaml treats the Dic4 result as a panel-limited negative
      and proposes no pruning.
    review_edited: false
    notes: >-
      The reason is node-aware (names the node, the seeds and the leaf-level losses) and rests on a negative
      reconstitution of Dic4 itself, kept short of removal because a refolded protein and a limited panel
      cannot exclude transport. Left alone. This sits close to TARGET_LOSS. The PAINT curator accepted the
      same negative assay as loss for the six dicarboxylate terms on this leaf, so by pattern 19 an IRD at
      PTN000640888 for the five remaining anion terms would be the consistent form if the curators read
      the assay the same way; I did not request it because the family review and the gene review both hold
      that the assay does not show loss.
