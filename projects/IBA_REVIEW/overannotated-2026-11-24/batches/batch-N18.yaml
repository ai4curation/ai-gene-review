- gene_file: genes/DROME/na/na-ai-review.yaml
  rows:
  - go_id: GO:0032224
    go_label: positive regulation of synaptic transmission, cholinergic
    family: PTHR46141
    ibd_node: PTN000799098
    tree_reading: &na_tree >-
      IBD at the family root PTN000799098 (38 leaves, 33 species) with one seed, C. elegans nca-2 (WB:WBGene00003558,
      G5EDM1). Children are PTN000004235 (35 leaves, bilaterian NALCN, holds the target and the seed), PTN000799121
      (2 Nematostella leaves) and PTN000799127 (1 Trichoplax leaf). Fly na is leaf PTN000004280. The same
      root carries monoatomic cation channel activity (2 seeds) and plasma membrane. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked: &na_ev
    - >-
      QuickGO. nca-2 G5EDM1 involved_in GO:0032224 and GO:0032230, each IGI PMID:18336069 (WB); unc-77 isoforms
      carry the same IGI rows. A taxon-wide query for GO:0032224 in C. elegans returned 37 rows, so the
      query shape returns positives.
    - >-
      PMID:18336069 abstract through PubMed (doi 10.1371/journal.pbio.0060055). Loss of NCA activity reduces
      synaptic transmission at neuromuscular junctions; synaptic calcium transients fall in loss-of-function
      and rise in gain-of-function mutants; the authors propose the channel carries depolarisation to synapses.
      Full text not read.
    - No family review exists for PTHR46141 and no other review in the repository carries these rows.
    review_edited: true
    notes: >-
      MARK_AS_OVER_ANNOTATED changed to KEEP_AS_NON_CORE. The earlier reason called the seed an indirect
      excitability phenotype and noted the lack of fly evidence. The second is not a ground. On the first,
      the seed paper measures transmission and synaptic calcium directly and gives the channel a role in
      getting depolarisation to the synapse, and a regulation term covers exactly that kind of contribution,
      so I did not read it as a phenotype taken for participation. Single seed, target in the seeded clade,
      no loss, nothing on fly NA against it. Non-core because it follows from the sodium leak, and the
      transmitter in the term reflects which worm synapses were recorded. A reader who holds that
      transmitter-specific regulation terms should not be carried from one worm synapse to all animals
      would uphold this as SEED_OVERREACH with REMOVE_IBD at PTN000799098; I judged that the regulation
