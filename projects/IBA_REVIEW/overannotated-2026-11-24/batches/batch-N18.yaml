genes:
- gene_file: genes/DROME/pll/pll-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR24419
    ibd_node: PTN000784925
    tree_reading: >-
      IBD at the family root PTN000784925 (196 leaves, 88 species) with seven seeds. Children are PTN002401140
      (150 leaves, holds the target) and PTN001282058 (46 leaves, plant haspins, holds the Arabidopsis seed).
      Pelle is leaf PTN000701454 in the invertebrate clade PTN000701449 (11 leaves, 8 species), which joins
      the vertebrate IRAKs at PTN000701353 (73 leaves). PTN002401141 (87 leaves, the IRAK and Pelle clade)
      carries NOT IRD for histone H3T3 kinase activity and mitotic cell cycle. The seeds are human, mouse
      and fly haspin outside that clade, plant haspin, and human IRAK1, human IRAK3 and mouse Irak3 in the
      vertebrate IRAK clade. No seed is in PTN000701449. No loss is recorded for nucleus.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005634 with descendants. IRAK1 P51617 located_in nucleoplasm IDA GO_REF:0000052
      (HPA); IRAK3 Q9Y616 located_in nucleus IDA PMID:17379480 and EXP PMID:29686383; Pelle Q05652 and Tube
      P22812 return only the IBA.
    - Batch H13 (human IRAK4, same node) for the haspin seeds and the position of the vertebrate seeds.
    - interpro/panther/PTHR24419/PTHR24419-review.yaml has no node assessment for nucleus.
    review_edited: true
    notes: >-
      Action unchanged, text rewritten. The earlier summary called the root a node of IRAK and plant or yeast
      kinases and the reason rested on no study placing Pelle in the nucleus. The text now states the tree
      (four haspin seeds beyond a clade where PAINT records loss of the haspin functions, three vertebrate
      IRAK seeds in the sister clade, none in the Pelle and Tube clade) and the membrane imaging of Pelle.
      No single PAINT move fits, since the seeds sit in the haspin clades and at the IRAK1 and IRAK3 nodes;
      batch H13 reached the same conclusion for IRAK4 and named no fix. History record added.
- gene_file: genes/DROME/tub/tub-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR24419
    ibd_node: PTN000784925
    tree_reading: >-
      Same record as Pelle. IBD at the family root PTN000784925 (196 leaves) with seven seeds, four haspins
      and three vertebrate IRAK rows. Tube is in PTN000701453 (3 leaves, 2 species) with Pelle, inside the
      invertebrate clade PTN000701449 (11 leaves), which holds no seed. The vertebrate IRAK seeds are in
      the sister clade under PTN000701353 (73 leaves).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO. Tube P22812 with GO:0005634 and descendants returns only the IBA.
    - Seed rows as listed under Pelle.
    review_edited: false
    notes: >-
      The reason already names the root, its size and its seeds, gives the imaging of Tube at the plasma
      membrane and in the cytosol, and records the one report of nuclear entry with Dorsal in transfected
      cells (PMID:7867932, cited in prose). That report is why the row is doubt and not a removal. Left
      alone. Same call as Pelle; no single PAINT move fits.
- gene_file: genes/DROME/unc80/unc80-ai-review.yaml
  rows:
  - go_id: GO:0005261
    go_label: monoatomic cation channel activity
    family: PTHR31781
    ibd_node: PTN001589593
    tree_reading: >-
      IBD at the family root PTN001589593 (32 leaves, 30 species) with one seed, C. elegans unc-80 (WB:WBGene00006812).
      Children are PTN001589594 (31 leaves, animal UNC80, holds the target and the seed) and a single Cryptococcus
      leaf PTN001589636. The same root carries IBDs for sodium channel complex (2 seeds), sodium ion transmembrane
      transport and monoatomic cation homeostasis. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001589593
    evidence_checked:
    - >-
      QuickGO by accession and GO id. C. elegans unc-80 Q9XV66 enables GO:0005261 IMP PMID:17825559 (UniProt);
      its sodium channel complex row is IBA only.
    - >-
      PMID:17825559 abstract through PubMed (doi 10.1016/j.cub.2007.08.036). A suppressor screen in synaptojanin
      mutants; unc-80 is described as required for the proper localization of the NCA-1 and NCA-2 channel
      subunits. Full text not read.
    - The review quotes PMID:34929720 for UNC80 as a HEAT-repeat protein docked on the NALCN pore subcomplex.
    review_edited: false
    notes: >-
      The seed row is a mutant phenotype with the enables qualifier on a non-pore subunit. The reason already
      names the node and the seed and says the activity belongs to the pore, with the contribution kept
      on a contributes_to row. Left alone. The ISS row on the same term carries the same action. The seed
      paper was read as an abstract, so REMOVE_IBD is a request to re-read the seed row.
  - go_id: GO:0055080
    go_label: monoatomic cation homeostasis
    family: PTHR31781
    ibd_node: PTN001589593
    tree_reading: >-
      Same node and seed as the channel activity row. IBD at the family root PTN001589593 (32 leaves), one
      seed, C. elegans unc-80, in the same child clade PTN001589594 (31 leaves) as fly unc80.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001589593
    evidence_checked:
    - QuickGO. Q9XV66 involved_in GO:0055080 IMP PMID:17825559 (UniProt).
    - >-
      PMID:17825559 abstract through PubMed. It reports locomotion, vesicle and electrophysiological suppression
      and channel localization; no ion level measurement is mentioned.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason was that there is no evidence the complex maintains
      cation homeostasis, without naming the node or the seed. It now states the tree and what the seed
      row is. The call rests on the abstract, so it is weaker than the channel activity row, and REMOVE_IBD
      is a request to re-read the seed. If the full paper shows a measured ion imbalance the row becomes
      KEEP_AS_NON_CORE. The ISS row on the same term keeps the same action and refers to this reason. History
      record added.
- gene_file: genes/DROME/CG18528/CG18528-ai-review.yaml
  rows:
  - go_id: GO:0030488
    go_label: tRNA methylation
    family: PTHR42714
    ibd_node: PTN000182687
    tree_reading: >-
      IBD at the family root PTN000182687 (149 leaves, 118 species) with one seed, E. coli MnmE (P25522).
      Children are PTN005127204 (53 leaves, GTPBP3 and eukaryotic orthologs, holds the target) and PTN001361281
      (96 leaves, mostly bacterial, holds the seed). The same root carries tRNA wobble uridine modification
      (3 seeds). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000182687
    evidence_checked:
    - >-
      Batch H14 (human GTPBP3, same node) recorded the seed row as acts_upstream_of_or_within GO:0030488 IMP
      PMID:6427754 (EcoCyc) and read the abstract, in which trmE mutants lack the whole side chain and are
      set apart from the methylation-deficient trmC mutants. Not re-queried here.
    - The gene review names the seed P25522 in its propagation_review.
    review_edited: false
    notes: >-
      Same verdict and fix as human GTPBP3 in batch H14. The reason makes the term-scope argument (the reaction
      is an aminomethylation and the later methyl transfer is done by another enzyme) and names the seed.
