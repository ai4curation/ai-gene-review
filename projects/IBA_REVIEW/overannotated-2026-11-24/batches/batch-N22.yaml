genes:
- gene_file: genes/PSEAE/PA5208/PA5208-ai-review.yaml
  rows:
  - go_id: GO:0071978
    go_label: bacterial-type flagellum-dependent swarming motility
    family: PTHR36536
    ibd_node: PTN002194937
    tree_reading: >-
      IBD at PTN002194937 (5 leaves, 5 species) with one seed, the target itself (Q9HTY2). The node is a
      five-way split into single leaves, Vibrio cholerae VC_2441, Coxiella burnetii CBU_0015, Shewanella
      oneidensis SO_3770, Haemophilus influenzae HI_1603 and the target (leaf PTN002443140). It sits under
      PTN002194925 (10 leaves) in a 16-leaf family. No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002194937
    evidence_checked:
    - >-
      QuickGO Q9HTY2 x GO:0071978 returns the IBA and one IMP, PMID:17158671 (PseudoCAP), the only seed.
    - >-
      The review's IMP row for the same term is MARK_AS_OVER_ANNOTATED, with quotes from the full-text cache
      of PMID:17158671 (a mini-Tn5 swarming screen, mutant with a slight growth defect).
    - Batch N08 of the REMOVE pass moved this row from REMOVE to MARK_AS_OVER_ANNOTATED with the same fix.
    review_edited: false
    notes: >-
      The seed is a screen phenotype of a PhoU-like protein with a growth defect, a phenotype read as
      participation. The IBA and the IMP carry the same action. The reason names the node, the single seed
      and the two non-flagellated leaves, and the GO_CENTRAL source defect asks for the IBD to be withdrawn.
      Left as written.
- gene_file: genes/PSEAE/ligD/ligD-ai-review.yaml
  rows:
  - go_id: GO:0006269
    go_label: DNA replication, synthesis of primer
    family: PTHR42705
    ibd_node: PTN001627042
    tree_reading: >-
      IBD at the family root PTN001627042 (15 leaves, 10 species) with one seed, M. tuberculosis LigD
      (P9WNV3). Two children. PTN005127089 (2 leaves, Monosiga and Gossypium) and PTN000048875 (13 leaves,
      8 bacterial species plus one Ricinus leaf), which holds both the seed and the target (leaf
      PTN002235299, under PTN005127091, 6 leaves). No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001627042
    evidence_checked:
    - QuickGO P9WNV3 x GO:0006269 returns the IBA and one IDA, PMID:16023671 (MTBBASE).
    - >-
      publications/PMID_16023671.md (abstract only), "Domain structure of a NHEJ DNA repair ligase from
      Mycobacterium tuberculosis". The abstract reports a DNA-dependent RNA primase activity of the
      polymerase domain in vitro, in a paper about an NHEJ repair ligase.
    review_edited: false
    notes: >-
      The seed evidence is an in vitro primase activity of the LigD polymerase domain, coded to a process
      term that is part of DNA replication. Nothing shows LigD priming replication; it acts with Ku in
      double-strand break repair. The activity is covered by the GO:0003887 IBD at the same node and the role
      by GO:0006303. The target is in the seed's own clade, so no narrower node would help; the fix is to
      withdraw the IBD. Only the seed abstract was read, so the request stays a query, as the review's
      GO_CENTRAL defect (CHECK, PROBABLE) already records. Reason is node-aware. Left as written.
- gene_file: genes/PSEAE/liuE/liuE-ai-review.yaml
  rows:
  - go_id: GO:0046951
    go_label: ketone body biosynthetic process
    family: PTHR42738
    ibd_node: PTN000031222
    tree_reading: >-
      IBD at the family root PTN000031222 (183 leaves, 100 species) with five seeds, human HMGCL (P35914),
      chicken HMGCL (P35915), human HMGCLL1 (Q8TB92), rat RGD:620554 and fly FBgn0031877. All the seeds read
      by accession (P35914, P35915, Q8TB92, rat P97519, fly Q9VM58) sit inside PTN000031226 (52 leaves, 32
      species, vertebrates plus nematodes and arthropods), which lies under PTN000031223 (167 leaves). The
      target (leaf PTN002448903) is a direct single-leaf child of PTN001616205 (171 leaves), beside the
      Coxiella and Xanthomonas leaves, outside PTN000031223. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000031226
    evidence_checked:
    - >-
      QuickGO P35914, P35915, Q8TB92 x GO:0046951 returns IDA rows from PMID:22847177, PMID:22865860 and
      PMID:9200711 (UniProt); Q9I2A0 has only the IBA.
    - >-
      GO definition of GO:0046951 read from QuickGO. It covers formation of acetoacetate, 3-hydroxybutyrate
      or acetone via HMG-CoA cleavage, so the term is not false for an HMG-CoA lyase by the letter.
    - The review quotes PMID:19459965 for the role of LiuE in leucine and acyclic terpene catabolism.
    review_edited: false
    notes: >-
      All seeds are animal enzymes in one 52-leaf clade and the IBD is at the root, five nodes above them, so
      it reaches bacterial, fungal and plant lyases whose acetoacetate is a catabolic intermediate. Because
      the GO definition is met literally, this is an over-annotation and not a lineage removal. The move to
      PTN000031226 keeps every seed. The reason states the seed lineage and the node. Left as written.
- gene_file: genes/PSEAE/phaG/phaG-ai-review.yaml
  rows:
  - go_id: GO:0009102
    go_label: biotin biosynthetic process
    family: PTHR43194
    ibd_node: PTN002455972
    tree_reading: &phag_tree >-
      IBD at PTN002455972 (17 leaves, 10 species) with one seed, E. coli BioH (P13001). Three children.
      PTN008679522 (5 leaves, with B. subtilis RsbQ), PTN008679523 (2 Deinococcus leaves) and PTN002877172
      (10 leaves), which holds the seed and the target. Inside it PTN005150639 (6 leaves) splits into
      PTN005150642 (3 leaves, the E. coli, Salmonella and Yersinia BioH), PTN005150641 (2 leaves, 1 species,
      P. aeruginosa RhlA and PhaG, the target at leaf PTN002251180) and one Shewanella leaf. No loss recorded
      for either term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN005150642
    evidence_checked:
    - >-
      QuickGO P13001 x GO:0009102 returns IDA PMID:11904168 (UniProt) and IMP PMID:20693992 (EcoCyc,
      acts_upstream_of_or_within); Q51553 has only the IBA.
    - >-
      The review quotes PMID:36689471 (deletion of PA0502, the dedicated PAO1 BioH, gives biotin auxotrophy)
      and PMID:10713430 (PhaG knockout lowers PHA from gluconate).
    - >-
      interpro/panther/PTHR43194/PTHR43194-review.yaml assesses this node and term TOO_DEEP, naming the RsbQ
      branch, and lists Q51553 as a member exception.
    review_edited: false
    notes: >-
      The seed sits in the enterobacterial BioH clade PTN005150642 and the IBD is three nodes above it. The
      target is in the sister pair PhaG and RhlA, two P. aeruginosa proteins with other characterized
      chemistry, and PAO1 needs a separate BioH for biotin synthesis. That is strong doubt on the target's
      branch but, as the review and the family review both say, short of a negative assay on PhaG, so the row
      stays over-annotated and is not removed. The review states the descent correctly but does not say that
      the seed is in the sister clade of the PhaG and RhlA pair; that fact is recorded here. Left as written.
  - go_id: GO:0090499
