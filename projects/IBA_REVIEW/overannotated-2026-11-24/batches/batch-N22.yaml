- gene_file: genes/PSEAE/davT/davT-ai-review.yaml
  rows:
  - go_id: GO:0009450
    go_label: GABA catabolic process
    family: PTHR43206
    ibd_node: PTN000944876
    tree_reading: >-
      IBD at the family root PTN000944876 (87 leaves, 65 species) with three seeds, E. coli GabT (P22256), fly
      FBgn0036927 and S. pombe SPAC19D5.07. Two children. PTN000241229 (75 leaves, eukaryotes plus two
      actinobacterial leaves) and PTN000241468 (12 leaves, 11 bacterial species), which holds the target.
      Inside it PTN000241472 (7 leaves, 6 species) holds E. coli GabT (the seed) and Salmonella GabT, E. coli
      PuuE and a Yersinia leaf, single Shewanella and Xanthomonas leaves, and the target (leaf PTN002456200),
      the only P. aeruginosa member. No loss recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P22256 x GO:0009450 returns IMP PMID:374339 (EcoCyc, acts_upstream_of_or_within) plus IBA and
      IEA; Q9I6M4 has only the IBA. The query shape returns hits.
    - >-
      PubMed search for gabT or PA0266 in P. aeruginosa found PMID:18192388. publications/PMID_18192388.md
      (abstract only; PMC and Europe PMC did not serve the full text) states that GabD, GabT and PA5313 were
      identified for GABA utilization and that a PA5313 gabT double mutant has a growth defect on GABA.
    - >-
      KEGG pae:PA0265 has SYMBOL gabD, and STRING gives 208964.PA0266 and 208964.PA0265 the preferred names
      gabT and gabD. The paper's own locus tags were not read.
    review_edited: true
    notes: >-
      The earlier reason was that GABA had not been tested on PA0266, which is not a ground, and the tree
      argues the other way, since the E. coli GabT seed is in the target's own 7-leaf clade. PA0266 is also
      the PAO1 gabT, with abstract-level genetic evidence for GABA utilization that the review had not found.
      Action changed to KEEP_AS_NON_CORE. The IEA row GO:0034386 4-aminobutyrate:2-oxoglutarate transaminase
      activity in the same review said the same thing and was changed to KEEP_AS_NON_CORE with it.
      PMID:18192388 was added to the references. The family review PTHR11986 quotes the old summary sentence
      of this row; the sentence is kept verbatim inside the new reason so the quote still resolves, but that
      family review (and PTHR43353 for DavD) still says GABA has not been tested on any DavT or DavD protein
      and needs a follow-up. The P. putida davT review carries the same old judgement and was not touched.
      Treeview places this leaf in PTHR43206 while the UniProt cross-reference and the family review use
      PTHR11986.
- gene_file: genes/PSEAE/davD/davD-ai-review.yaml
  rows:
  - go_id: GO:0004777
    go_label: succinate-semialdehyde dehydrogenase (NAD+) activity
    family: PTHR43353
    ibd_node: PTN008681047
    tree_reading: &davd_tree >-
      IBDs at PTN008681047 (162 leaves, 103 species). The activity has seven seeds (human P51649, E. coli GabD
      P25526, rat, mouse, fly, Arabidopsis AT1G79440 and yeast UGA2), the process three (yeast UGA2, P51649,
      P25526). The node has two children, PTN009169241 (159 leaves) with every seed read and the target, and
      PTN009169257 (3 Firmicutes leaves). The target (leaf PTN002458567) is in PTN000192661 (6 leaves, 5
      species) with E. coli GabD and AldA, Salmonella GabD and single Shewanella and Vibrio leaves, under
      PTN000192659 (8 leaves) and PTN008681065 (64 leaves, which also holds the Arabidopsis seed). Human
      ALDH5A1 and yeast UGA2 are in PTN000192582 (85 leaves). No loss recorded for either term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P25526 with descendants of GO:0009013 returns GO:0004777 IDA PMID:20174634 (UniProt),
      GO:0009013 IDA (PMID:18474219, PMID:2254272, PMID:7011797) and GO:0036243 IDA and EXP; Q9I6M5 has only
      the IBA.
    - >-
      publications/PMID_18192388.md (abstract only) states that the succinic-semialdehyde dehydrogenase
      activity of GabD and its induction by GABA were demonstrated in vitro. KEGG gives PA0265 the symbol
      gabD. The cofactor is not stated in the abstract.
    review_edited: true
    notes: >-
      The earlier reason was that succinate semialdehyde had not been tested on PA0265. The seed E. coli GabD
      is in the target's own 6-leaf clade and the PAO1 GabD has abstract-level in vitro SSADH activity, so no
      ground holds. Kept as non-core, because the NAD+ form is taken from the tree and the characterized
      DavD reaction uses NADP+. The IEA parent row GO:0009013 succinate-semialdehyde dehydrogenase [NAD(P)+]
      activity was changed to KEEP_AS_NON_CORE with it, since it could not stay over-annotated above a kept
      child; the sentence the PTHR43353 family review quotes from that row is kept verbatim. The family
      review's statements on DavD and the P. putida davD review were not touched and need a follow-up.
  - go_id: GO:0009450
    go_label: GABA catabolic process
    family: PTHR43353
    ibd_node: PTN008681047
    tree_reading: *davd_tree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P25526 x GO:0009450 returns IDA PMID:7011797 (UniProt) and three IMP rows with
      acts_upstream_of_or_within; P38067 IMP (SGD); P51649 IDA PMID:9683595.
    - >-
      publications/PMID_18192388.md (abstract only), GabD, GabT and PA5313 identified for GABA utilization,
      and GabD activity induced by GABA.
    review_edited: true
    notes: >-
      Process twin of the activity row. The earlier reason said no study tests a role in GABA catabolism,
      which PMID:18192388 contradicts at abstract level. The same-term IEA row (GO_REF:0000002) was changed to
      KEEP_AS_NON_CORE with the IBA.
- gene_file: genes/PSEAE/fleN/fleN-ai-review.yaml
  rows:
  - go_id: GO:0009898
    go_label: cytoplasmic side of plasma membrane
    family: PTHR43384
    ibd_node: PTN000344128
    tree_reading: >-
      IBD at the family root PTN000344128 (149 leaves, 75 species) with one seed, E. coli MinD (P0AEZ3). Two
      children. PTN008681234 (90 leaves) holds the seed, inside PTN008681235 (62 leaves) and PTN005161362 (10
      leaves, the proteobacterial MinD proteins plus one Dictyostelium leaf); it also holds 52 eukaryotic (mostly plant)
      MinD leaves and a 28-leaf archaeal clade. PTN001786560 (59 leaves, 26 species, FlhG, FleN, BcsQ, TadZ
      and others) holds the target (leaf PTN002458857, under PTN000344142, 15 leaves) and no seed. No loss
      recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN005161362
    evidence_checked:
    - >-
      QuickGO P0AEZ3 x GO:0009898 returns located_in IDA PMID:10220403 and PMID:10540287 (EcoCyc) plus the
      IBA, which is is_active_in.
    - >-
      The review quotes PMID:36622167 (a FleN fluorescent fusion equally distributed in cells) and
      PMID:34669473 (the C-terminal region is disordered in the FleN dimer).
    review_edited: false
    notes: >-
      The single seed is in the sister child and its membrane binding depends on a C-terminal amphipathic
      helix that drives Min oscillation. The target's child holds no seed, and the one localization result
      on FleN is a diffuse fusion, with the C-terminus used for FleQ contact. A diffuse fusion does not rule
      out transient membrane association, and other FlhG orthologs do bind membrane, so this stays an
      over-annotation and not a removal. PTN005161362 is the tightest node that keeps the seed with its
      proteobacterial orthologs; PTN008681235 would also take in the plastid MinD proteins, which sit at the
      chloroplast envelope and not the plasma membrane. The reason rests on target evidence. Left as written.
- gene_file: genes/PSEAE/phnB/phnB-ai-review.yaml
  rows:
  - go_id: GO:0002047
    go_label: phenazine biosynthetic process
    family: PTHR43418
    ibd_node: PTN000230115
    tree_reading: >-
      IBD at PTN000230115 (7 leaves, 7 species) with one seed, the target itself (P09786). Children are
      PTN001729070 (3 leaves, the Salmonella and E. coli TrpGD and Yersinia TrpG), three single TrpG leaves
      (Vibrio, Shewanella, Haemophilus) and the target (leaf PTN002459381). No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000230115
    evidence_checked:
    - QuickGO P09786 x GO:0002047 returns the IBA and one IMP, PMID:2153661 (PseudoCAP), the only seed.
    - >-
      The review's IMP row is MARK_AS_OVER_ANNOTATED with quotes from PMID:23449919 (anthranilate from PhnAB
      feeds PQS, which induces the phenazine operons) and PMID:21454481 (PhzE makes the phenazine precursor
      from chorismate).
    - Batch N09 of the REMOVE pass upheld REMOVE for E. coli trpD on the same node, with the same fix.
    review_edited: false
    notes: >-
      Own-seed row. The seed is a pigment phenotype that acts through anthranilate supply to a signal, not a
      step of phenazine synthesis, and the IBA takes the same action as the IMP. Reason is node-aware and the
      GO_CENTRAL defect asks for the IBD to be withdrawn. Left as written.
- gene_file: genes/PSEAE/clpV1/clpV1-ai-review.yaml
  rows:
  - go_id: GO:0044183
    go_label: protein folding chaperone
    family: PTHR43572
    ibd_node: PTN002461480
    tree_reading: >-
      IBD at the family root PTN002461480 (489 leaves, 55 species) with one seed, M. tuberculosis ClpC1
      (P9WPC9). Two children. PTN000181417 (472 leaves, eukaryotic and mostly plant) and PTN000181392 (17
      leaves, 14 bacterial species), which holds both the seed and the target. Inside it the seed is in
      PTN008112444 (11 leaves, actinobacterial and Firmicutes ClpC and ClpE), and the target (leaf
      PTN002461526) is a single-leaf child of PTN000181392 beside a 3-leaf cyanobacterial clade and single
      Leptospira and Chlamydia leaves. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008112444
    evidence_checked:
    - QuickGO P9WPC9 x GO:0044183 returns the IBA and one IMP, PMID:19016865 (MTBBASE).
    - >-
      PubMed abstract of PMID:19016865 (not in the publications cache). Recombinant ClpC1 has ATPase
      activity and prevented protein aggregation in vitro.
    - >-
      The row quotes the UniProt InterPro line IPR017729 ATPase_T6SS_ClpV1. Batch N10 of the REMOVE pass
      upheld REMOVE for the Arabidopsis SMXL clade on the same IBD.
    review_edited: true
    notes: >-
      Action stands, text rewritten. The old summary said the term came from the ClpA/ClpB clade, which is
      not what the tree shows; the family is ClpC, ClpD and ClpE with ClpC1 as the only seed. The new summary
      and reason give the node, the seed and where ClpV1 sits. The ground is doubt on the target, a dedicated
      T6SS sheath-disassembly ATPase with its own signature, where sheath remodelling is not assistance of
      folding. It is not a removal, unlike the SMXL co-repressors, because ClpV1 keeps an ATP-driven
      protein-remodelling activity and nothing tests aggregation prevention. Moving the IBD to PTN008112444
      would take the term off ClpV1 and the plant clade together. PMID:19016865 is mentioned in the reason
      but not quoted, so it was not added to the cache.
- gene_file: genes/PSEAE/PA4088/PA4088-ai-review.yaml
  rows:
  - go_id: GO:0042286
    go_label: glutamate-1-semialdehyde 2,1-aminomutase activity
    family: PTHR43713
    ibd_node: PTN000241400
    tree_reading: >-
      IBD at PTN000241400 (15 leaves, 12 species) with two seeds, E. coli HemL (P23893) and the target itself
      (Q9HWU0). Children are PTN000241405 (10 leaves, 8 gammaproteobacterial species, with both seeds), a
      2-leaf Bradyrhizobium clade and three single hemL leaves. Inside PTN000241405 the target (leaf
      PTN002463963) is in PTN002463962 (3 leaves, 1 species) with PA5523 and the P. aeruginosa HemL
      (P48247). No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO returns P23893 IDA PMID:1643048 and PMID:2045363 (EcoCyc); Q9HWU0 EXP PMID:29684343
      (PseudoCAP) plus the IBA; P48247 IBA and IEA only.
    - >-
      The review's EXP row is MARK_AS_OVER_ANNOTATED with quotes from the abstract of PMID:29684343 (a
      crystal structure of the product of the uncharacterized pa4088 gene) and identity figures from the
      gene's bioinformatics RESULTS.md (27 percent to HemL enzymes against 66 percent between HemL orthologs).
    review_edited: false
    notes: >-
      The E. coli seed is sound. The doubt is on the target, one of three P. aeruginosa copies from a
      species-specific duplication whose sister is the canonical HemL, and whose own seed row cites a
      structure paper with no assay in the abstract. No node separates PA4088 from HemL, so there is no move
      to ask for; the PAINT-side action would be to drop Q9HWU0 as a seed, which none of the listed actions
      expresses. An aminomutase assay on purified PA4088, or complementation of a hemL mutant, would settle
      it. The reason and summary state the topology. Left as written.
- gene_file: genes/PSEAE/gmd/gmd-ai-review.yaml
  rows:
  - go_id: GO:0042351
    go_label: "'de novo' GDP-L-fucose biosynthetic process"
    family: PTHR43715
    ibd_node: PTN008684430
    tree_reading: >-
      IBD at PTN008684430 (154 leaves, 98 species) with five eukaryotic seeds, human GMDS (O60547),
      Trypanosoma Q387W4, fly FBgn0031661, Dictyostelium DDB_G0284553 and Arabidopsis AT3G51160. The node has
      seven children. PTN009171938 (59 leaves) holds the human, fly, Trypanosoma and Dictyostelium members
      and E. coli Gmd; PTN009171928 (86 leaves, plants and one Chloroflexus leaf) holds both Arabidopsis
      members. The target (leaf PTN002463995) is in a third child, PTN008684448 (3 leaves, 3 species, with
      Xanthomonas Gmd and Yersinia Prt), which holds no seed. No loss recorded for the term.
    ground: LINEAGE
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002463995
    evidence_checked:
    - >-
      QuickGO O60547 IDA PMID:9525924 (UniProt), Q387W4 IDA PMID:17640865 (GeneDB,
      acts_upstream_of_or_within); Q51366, Q8PCU6 and Q9RCC9 have only the IBA.
    - >-
      GO definition from QuickGO. The term is the route from GDP-D-mannose to GDP-L-fucose requiring both
      GDP-mannose 4,6-dehydratase and GDP-L-fucose synthase (EC 1.1.1.271).
    - >-
      UniProt search for EC 1.1.1.271 or InterPro IPR028614 returns nothing for P. aeruginosa PAO1 (taxon
      208964) and nothing for Xanthomonas campestris ATCC 33913 (taxon 190485), and returns Fcl (P32055) for
      E. coli K-12 and a Fcl entry for Yersinia pestis, so the query shape returns positives. PAO1 has Rmd
      (Q9HTB6, EC 1.1.1.281).
    - The row quotes PMID:19459932 (P. aeruginosa GMD produces GDP-D-rhamnose).
    review_edited: true
    notes: >-
      The written reason already said the term is wrong for this gene, which is a removal and not an
      over-annotation. The process as GO defines it needs GDP-L-fucose synthase, PAO1 has none, and the
      4-keto intermediate goes to GDP-D-rhamnose. Unlike liuE and ketone bodies in this batch, the definition
      is not met even literally. Action changed to REMOVE on lineage grounds, reason extended with the tree
      and the proteome check, root cause set to PROPAGATION_BAD. The loss is pinned to the P. aeruginosa
      leaf, because Yersinia in the same 3-leaf clade has a GDP-L-fucose synthase; Xanthomonas campestris
