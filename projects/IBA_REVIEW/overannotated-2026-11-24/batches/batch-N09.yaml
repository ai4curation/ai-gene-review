genes:
- gene_file: genes/worm/wts-1/wts-1-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      IBD at PTN002390470 (56 leaves, 35 species) with two seeds, human LATS2 (Q9NRM7) and mouse Lats2
      (MGI:1354386). Children are PTN001219864 (55 leaves, target and seeds) and one choanoflagellate leaf
      PTN001220369. Both seeds are in the vertebrate LATS2 clade PTN004697711 (21 leaves), inside PTN000683381
      (44 leaves). wts-1 (leaf PTN000683454) is in the protostome clade PTN002807449 (9 leaves), which joins
      the seeded clade at PTN000683380 (53 leaves) and holds no seed for this term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004697711
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human LATS2 Q9NRM7 involved_in IDA PMID:12853976 (UniProt);
      mouse Lats2 Q7TSJ6 involved_in IDA PMID:15343267 (UniProt); wts-1 O45797 carries only the IBA.
    - >-
      The review quotes PMID:19605499 (the wts-1 phenotype was not caused by cell proliferation or apoptosis
      defects) and the UniProt function note; quotes left as they are.
    review_edited: false
    notes: >-
      Same node, ground and fix as human LATS1 in batch H13. The worm statement is about the cause of the
      larval arrest phenotype and is not a test of G1/S control, so it supports doubt and not loss; the row
      was not raised to REMOVE. The existing reason and propagation_review name the node and the two vertebrate
      LATS2 seeds, so the file was left alone.
  - go_id: GO:0043065
    go_label: positive regulation of apoptotic process
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      Same node (56 leaves). One seed, Drosophila wts (FB:FBgn0011739, Q9VA38), which sits in the same 8-leaf
      protostome clade PTN000683448 as wts-1 (seed under PTN001219879, 5 leaves; target under PTN002390473,
      3 leaves). No vertebrate seed and no loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. Fly wts Q9VA38 involved_in IGI PMID:12202036 (FlyBase); wts-1 O45797 and human LATS1 O95835
      carry only the IBA.
    - Review quotes from PMID:19605499 and the UniProt function note (does not appear to regulate apoptosis and proliferation).
    review_edited: false
    notes: >-
      The seed is next to the target, so the node placement is not the problem. The call rests on evidence
      on the worm gene (the mutant phenotype is not caused by apoptosis defects, and UniProt curators record
      no apoptosis role), which is doubt short of loss. A cell-death count in wts-1 mutants in a lineage with
      programmed deaths would settle it. Reason is target-based and names the seed; left alone.
  - go_id: GO:0046620
    go_label: regulation of organ growth
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      Same node (56 leaves). One seed, mouse Lats2 (MGI:1354386), in the vertebrate clade PTN000683381 (44
      leaves). wts-1 is in the protostome clade PTN002807449 (9 leaves), which holds no seed for this term
      (fly wts carries only the IBA). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. Mouse Lats2 Q7TSJ6 acts_upstream_of_or_within IMP PMID:21512031 (MGI); fly wts Q9VA38 and wts-1
      carry only the IBA.
    - Review quotes PMID:41746831 (classical Hippo phenotypes such as tissue overgrowth are absent) and PMID:19605499.
    review_edited: false
    notes: >-
      Organ growth control by Warts is well known in flies, so I did not ask for the IBD to be moved to
      vertebrates; the single mouse seed is thin but the node is biologically plausible for bilaterians.
      The ground is the worm evidence that Hippo overgrowth phenotypes are absent and that the wts-1 phenotype
      is not a proliferation defect. Reason is target-based; left alone.
- gene_file: genes/worm/sma-10/sma-10-ai-review.yaml
  rows:
  - go_id: GO:0038023
    go_label: signaling receptor activity
    family: PTHR24373
    ibd_node: PTN002809265
    tree_reading: >-
      IBD at the family root PTN002809265 (725 leaves, 37 species) with six seeds, human TLR3 (O15455), CD180
      (Q99467), RTN4RL1 (Q86UN2), RTN4RL2 (Q86UN3), rat Rtn4rl2 (RGD:727797) and fly Toll-7 (FB:FBgn0034476).
      sma-10 (leaf PTN000687983) is in a 13-leaf clade PTN009094627 (nematodes, arthropods, sea urchin, amphioxus,
      Ciona, one anole leaf) that holds no seed. It joins every seed only at PTN009094323 (674 leaves), where
      the five vertebrate seeds are in the sister PTN001317665 (652 leaves) and Toll-7 is in PTN009094324
      (7 leaves). The vertebrate LRIG proteins are also in the 652-leaf clade, not with sma-10. No loss recorded
      for the term.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008615554
    evidence_checked:
    - >-
      Seed annotations as recorded in batch H13 and rereview batch H03 (QuickGO by GO id with descendants,
      TLR3 GO:0004888 IDA PMID:12471095, CD180 GO:0001875 IDA PMID:12714520, RTN4RL1 and RTN4RL2 GO:0038023
      IDA PMID:12694398, rat Rtn4rl2 IMP PMID:15673660, Toll-7 GO:0004888 IDA PMID:31088910). Not re-queried
      here.
    - >-
      Seed and target positions read from the cached PTHR24373 tree (helper using the same library calls
      as treeview.py); members of PTN009094627 listed.
    - >-
      The sma-10 review carries type I and type II TGF-beta receptor binding by IPI (PMID:20502686) and positive
      regulation of the pathway by IDA as its core function.
    - No family review exists for PTHR24373.
    review_edited: true
    notes: >-
      Moved to REMOVE for consistency with human LRIG1, LRIG2, LRIG3 (rereview batch H03) and LRRC32 (batch
      H13), which lose the same row from the same root node on MISPLACED_IBD. The family is defined by leucine-rich
      repeats, the seeds are confined to the Toll-like and Nogo-receptor-like subclades, and what is established
      for SMA-10 is a different function, binding and regulating the BMP receptors. As in H03 the seeds lie
      in more than one child clade, so one target node is named (the TLR3 clade PTN008615554, 11 leaves) and
      the IBD needs to be split across the seeded subclades. Summary, reason and propagation_review rewritten;
      quotes untouched. History record history/genes/worm/sma-10/2026-11-24T065117Z-claude-code-6d4b3f.yaml.
- gene_file: genes/worm/let-23/let-23-ai-review.yaml
  rows:
  - go_id: GO:0030182
    go_label: neuron differentiation
    family: PTHR24416
    ibd_node: PTN000698827
    tree_reading: &let23_tree >-
      IBD at PTN000698827 (107 leaves, 30 species), the EGFR/ErbB node, with eight seeds. Children are PTN008618339
      (94 leaves, vertebrate EGFR, ERBB2, ERBB3, ERBB4, holding the seven vertebrate seeds) and PTN002814641
      (13 leaves, protostomes), which holds let-23 (leaf PTN000698945) and the eighth seed, Drosophila Egfr
      (FB:FBgn0003731, P04412). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Fly Egfr P04412 carries involved_in IMP rows on GO:0001751
      (PMID:16377567), GO:0043703 (PMID:7833286, PMID:8929534), GO:0045465 (PMID:9806926) and GO:0046530 (PMID:11245584),
      all FlyBase. let-23 P24348 carries only the IBA.
    - interpro/panther/PTHR24416/PTHR24416-review.yaml has no assessment of this node.
    review_edited: true
    notes: >-
      The earlier reason was that the term is not established for worm LET-23. With a seed in the target's
      own protostome clade and nothing on the worm gene arguing against it, that is not a ground. Kept as
      non-core because the known neuronal role of LET-23 (ALA-dependent quiescence) is post-developmental.
  - go_id: GO:0043066
    go_label: negative regulation of apoptotic process
    family: PTHR24416
    ibd_node: PTN000698827
    tree_reading: *let23_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. Fly Egfr P04412 involved_in GO:0043066 IMP PMID:16326394, PMID:17055987, PMID:23579691 (FlyBase).
      let-23 P24348 carries only the IBA, and nothing on GO:0043065 or GO:0012501 with descendants.
    - >-
      PubMed search (LIN-3 EGF programmed cell death egl-1 let-23) returned PMID:25144461; abstract read. It
      reports that loss of LIN-3 or LET-23 reduced the death of specific cells and that excess signaling increased
      cell deaths, through LET-60, MPK-1 and LIN-1 activation of egl-1.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The old reason listed other LET-23 outputs and called the term
      lineage-specific, although fly Egfr is a seed in the target's own clade. The ground is now the worm
      study showing the opposite sign for the cells it tested. Not raised to REMOVE, because a pro-death
      role in specific lineages does not exclude a protective role elsewhere. PMID:25144461 was added to
      references with a verbatim abstract quote; validation fetched publications/PMID_25144461.md. History
      record history/genes/worm/let-23/2026-11-24T065117Z-claude-code-ef6892.yaml covers both rows.
- gene_file: genes/worm/dyf-11/dyf-11-ai-review.yaml
  rows:
  - go_id: GO:0070507
    go_label: regulation of microtubule cytoskeleton organization
    family: PTHR31363
    ibd_node: PTN000773545
    tree_reading: >-
      IBD at the family root PTN000773545 (50 leaves, 42 species) with three seeds, human TRAF3IP1 (Q8TDR0),
      mouse Traf3ip1 (MGI:1921269) and zebrafish traf3ip1 (ZFIN:ZDB-GENE-040426-1146). Children are PTN001264281
      (34 leaves, animals plus a chytrid, target and seeds) and PTN007871820 (16 leaves, kinetoplastids,
      Giardia, Chlamydomonas, plants). All three seeds are in the vertebrate clade PTN002832389 (21 leaves)
      inside PTN001264284 (24 leaves, deuterostomes). dyf-11 (leaf PTN000773553) is in the protostome clade
      PTN000773552 (7 leaves), which joins the seeds at PTN000773546 (31 leaves) and holds no seed. No loss
      recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002832389
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human Q8TDR0 and mouse Q149C2 involved_in GO:0070507
      IMP PMID:26487268 (UniProt); zebrafish Q6PGZ3 the same by UniProt plus GO:0031113 IMP (ZFIN). dyf-11
      Q17595 carries the IBA and an ARBA IEA.
    - >-
      PubMed abstract of PMID:26487268. TRAF3IP1 mutations reveal IFT54 as a negative regulator of microtubule
      stability via MAP4, described as a role beyond the cilium, in patient cells and zebrafish.
    - No family review exists for PTHR31363.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The old reason said the family node's microtubule activity is axoneme
      assembly and that the term is over-general; the seeds are in fact for an extraciliary role shown in
      one vertebrate study, and the IBD is at the eukaryote-wide root. The doubt for DYF-11 is its expression,
      restricted to ciliated sensory neurons under DAF-19 control. The IEA row on the same term keeps the
      same action and was not edited. History record history/genes/worm/dyf-11/2026-11-24T065117Z-claude-code-727d3d.yaml.
- gene_file: genes/worm/ift-20/ift-20-ai-review.yaml
  rows:
  - go_id: GO:0005813
    go_label: centrosome
    family: PTHR31978
    ibd_node: PTN001278113
    tree_reading: >-
      IBD at PTN001278113 (34 leaves, 30 species) with two seeds, human IFT20 (Q8IY31) and mouse Ift20 (MGI:1915585).
      Children are PTN001278114 (32 leaves, bilaterians, target and seeds) and two single leaves (Nematostella,
      Trichoplax). Inside, both seeds are in PTN001278115 (25 leaves, deuterostomes) and ift-20 (leaf PTN001278132)
      is in the protostome clade PTN002841877 (7 leaves), which holds no seed. The other IFT20 location terms
      (ciliary base, basal body, non-motile cilium) are asserted one level higher at PTN001278111. No loss
      recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001278115
    evidence_checked:
    - >-
      QuickGO. Human IFT20 Q8IY31 located_in IDA PMID:16775004 (MGI); mouse Ift20 Q61025 located_in IDA PMID:19253336
      and PMID:19654211 (MGI). ift-20 Q8TA52 carries only the IBA.
    - Review quote from PMID:33997658 on basal body positioning in ift-20 null worms; left as it is.
    - No family review exists for PTHR31978.
    review_edited: false
    notes: >-
      The seeds are sound for mammalian cells. The reason to doubt the protostome branch is stated in the
      review, worm ift-20 is expressed in postmitotic ciliated sensory neurons, where the centriole-derived
      structure is the ciliary basal body, which is annotated separately. The propagation_review names the
      node and both mammalian seeds. Left alone. A centrosome term may still hold for other protostomes with
      dividing ciliated cells, so the move is a request to look, not a claim of absence.
- gene_file: genes/worm/bbs-2/bbs-2-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR32465
    ibd_node: PTN000795297
    tree_reading: >-
      IBD at the family root PTN000795297 (39 leaves, 39 species) with three seeds, human BBS2 (Q9BXC9),
      mouse Bbs2 (MGI:2135267) and the Trypanosoma brucei ortholog (Q584V4). Children are PTN001286745 (33
      leaves, animals, holding bbs-2 at leaf PTN000795310 and the human and mouse seeds) and PTN007961225
      (6 leaves, protists and Chlamydomonas, holding the trypanosome seed). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human BBS2 located_in GO:0060170 ciliary membrane IDA
      PMID:19081074 (ComplexPortal); mouse Bbs2 Q9CWF6 located_in GO:0016020 IDA PMID:22139371 (MGI); T. brucei
      Q584V4 located_in GO:0020018 and GO:0030669 IPI PMID:26721397 (GeneDB). bbs-2 Q19640 carries only the
      IBA.
    - No family review exists for PTHR32465.
    review_edited: true
    notes: >-
      The old reason (too broad to be informative, a cytoplasmic protein that associates transiently) is
      not a ground. The node is seeded in both children, the seeds are on different membranes, which explains
      the general term, and the BBSome is a membrane coat. Not TOO_GENERAL, since no other row of the review
      is a membrane term that entails it, and not MODIFY, since nothing on worm BBS-2 supports ciliary membrane
      specifically. History record history/genes/worm/bbs-2/2026-11-24T065118Z-claude-code-35fbe9.yaml.
- gene_file: genes/worm/cec-10/cec-10-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR43828
    ibd_node: PTN000917496
    tree_reading: >-
      IBD at PTN000917496 (53 leaves, 17 species) with one seed, budding yeast Swi6 (SGD:S000004172, P09959).
      Children are PTN002887935 (2 leaves, cec-10 and a Nematostella protein) and PTN000917498 (51 leaves,
      fungal Swi4, Mbp1, Res1, Res2, Swi6, Cdc10 and Xbp1-like proteins). The seed is in the Swi6/Cdc10 clade
      PTN002466251 (13 leaves) inside the fungal child; the target's two-leaf child has no seed. No loss
      recorded for cytoplasm.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002466251
    evidence_checked:
    - QuickGO. Yeast Swi6 P09959 located_in GO:0005737 IDA PMID:12697814 and PMID:8590795 (SGD); cec-10 Q9N4L7 only the IBA.
    - >-
      interpro/panther/PTHR43828/PTHR43828-review.yaml assesses this node as TOO_DEEP for cytoplasm and asks
      for MOVE_IBD to PTN002466251.
