- gene_file: genes/worm/hsp-12.6/hsp-12.6-ai-review.yaml
  rows:
  - go_id: GO:0009408
    go_label: response to heat
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      IBD at PTN000897708 (293 leaves, 33 species) with 16 seeds, Drosophila sHSPs, chicken HSPB1 (Q00649),
      a zebrafish gene and five C. elegans genes (the hsp-16 genes and sip-1). Children are PTN001354880 (279
      leaves, target and seeds) and 14 Nematostella leaves. hsp-12.6 (leaf PTN000163280) is in the nematode
      hsp-12 clade PTN000897763 (17 leaves), which holds no seed; the worm hsp-16 and sip-1 seeds are in
      its sister PTN000897777 (29 leaves) under PTN008458195 (57 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0009408 exact, experimental codes, taxon 6239 (70 hits) and 7227 (72 hits). Worm hsp-16.1,
      hsp-16.2, hsp-16.41 and hsp-16.48 are IEP PMID:1550963 (hsp-16.2 also PMID:28198373) and sip-1 IMP PMID:24844228;
      fly Hsp22, Hsp23, Hsp26, Hsp27, Hsp67Ba, Hsp67Bc, l(2)efl and CG7409 are IDA PMID:26705243. hsp-12.6
      has no experimental row.
    - >-
      Review quote from PMID:9139746 (expression limited to the first larval stage and not significantly up-regulated
      by a wide range of stressors); left as it is.
    review_edited: false
    notes: >-
      The worm seeds are expression-based (heat induction), and the same kind of data on HSP-12.6 is negative,
      with no chaperone activity in vitro either. That is evidence on the gene and its subfamily, short of
      a loss of function test. If PAINT wanted to act, an IRD at the hsp-12 clade PTN000897763 would be the
      form, but no heat-survival phenotype has been tested, so no fix is requested. Reason is target-based;
      left alone.
- gene_file: genes/worm/hsp-16.1/hsp-16.1-ai-review.yaml
  rows:
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: &hsp16_tree >-
      IBD at PTN000897708 (293 leaves, 33 species) with 7 seeds, all Drosophila small heat shock proteins.
      Children are PTN001354880 (279 leaves, bilaterian sHSPs, target and all seeds) and PTN000897825 (14
      Nematostella leaves). The worm hsp-16 genes are in the nematode clade PTN000897777 (29 leaves). No worm
      or vertebrate seed and no loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &hsp16_fix
      paint_action: NONE
      target_node_id: PTN000897708
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly Hsp22 P02515 involved_in IDA PMID:16572729 (FlyBase), the query shape
      returning a hit; hsp-16.1 P34696 carries only the IBA. Seed assays as read in full by batch H16 (luciferase
      heat-denatured with each sHSP and refolded by reticulocyte lysate with ATP, PMID:16572729; sHSPs assisting
      HSP70-dependent refolding in cells, PMID:26705243).
    review_edited: false
    notes: &hsp16_notes >-
      Same call as human CRYAB, HSPB1, HSPB2 and HSPB6 in batch H16. The seed assays show the sHSP holding
