genes:
- gene_file: genes/BOVIN/CSN2/CSN2-ai-review.yaml
  rows:
  - go_id: GO:0004869
    go_label: cysteine-type endopeptidase inhibitor activity
    family: PTHR11500
    ibd_node: PTN000161175
    tree_reading: >-
      IBD at the family root PTN000161175 (14 leaves, 12 species) with two seeds, human CSN2 (P05814)
      and bovine CSN2 (P02666, the target itself). Children are the eutherian beta-casein clade
      PTN000161176 (13 leaves, holds the target leaf PTN007510552 and both seeds) and one Monodelphis
      leaf PTN000161189. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. P02666 and P05814 each carry enables IDA PMID:12788072 (assigned
      by CAFA) beside the IBA.
    - >-
      The row and the same-term IDA row quote PMID:12788072 (beta-casein and a synthetic L133-Q151
      peptide inhibited cysteine proteases); quotes left as they are. No family review exists for
      PTHR11500.
    review_edited: false
    notes: >-
      Same call as human CSN2 (batch H05), mouse Csn2 (N01) and rat Csn2 (N03). The target is its own
      seed, which is not a reason to doubt the IBA; the over-annotation is in the seed rows, one in
      vitro reverse-zymography study on a protein that is itself a protease substrate, with no
      inhibition shown under physiological conditions. The review marks its own IDA row the same way
      and the reason says so and names the node. As in H05, no PAINT change is asked for while the two
      IDA rows stand; the question belongs with the seed rows.
- gene_file: genes/MAIZE/LOC541800/LOC541800-ai-review.yaml
  rows:
  - go_id: GO:0010039
    go_label: response to iron ion
    family: PTHR31645
    ibd_node: PTN001270331
    tree_reading: >-
      IBD at PTN001270331 (150 of the 529 leaves in the family, 35 species) with two seeds, Arabidopsis
      YSL1 (AT4G24120, Q6R3L0) and YSL2 (AT5G24380, Q6R3K9). Children are a 2-leaf Amborella node
      PTN004854106 and PTN004854110 (148 leaves), which splits into the monocot clade PTN004854111 (58
      leaves, holds the target leaf PTN002836644 and the Swiss-Prot YS1 entry Q9AY27 as its 2-leaf
      sister) and the eudicot clade PTN007900412 (90 leaves, holds both seeds, YSL1 under PTN002527333
      and YSL2 under PTN002058171). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001270331
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. YSL1 Q6R3L0 acts_upstream_of_or_within IEP
      PMID:16297069 (TAIR); YSL2 Q6R3K9 acts_upstream_of_or_within IEP PMID:15753101 (TAIR); YSL3
      Q2EF88 only the IBA. The query shape returns hits.
    - The review quotes PMID:15107503 and PMID:11201743 (Ys1 mRNA and protein rise under iron deficiency).
    - No family review exists for PTHR31645.
    review_edited: false
    notes: >-
      Both seeds are expression-pattern rows that TAIR itself qualifies as acts_upstream_of_or_within,
      and the IBD turns them into involved_in for 150 leaves. A transcript regulated by iron status is a
      readout of the response, not a step in it. The existing reason says exactly this and names the
      seeds and node, so the file was left alone. The removal applies to this term only; the plasma
      membrane IBD at the same node is unaffected.
  - go_id: GO:0048316
    go_label: seed development
    family: PTHR31645
    ibd_node: PTN001270331
    tree_reading: >-
      Same node (150 leaves). Two seeds, Arabidopsis YSL1 (AT4G24120, Q6R3L0) and YSL3 (AT5G53550,
      Q2EF88), both in the eudicot clade PTN007900412 (90 leaves); the target is in the monocot clade
      PTN004854111 (58 leaves). The two clades are sisters under PTN004854110 (148 leaves). No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001270331
    evidence_checked:
    - >-
      QuickGO. YSL1 and YSL3 each carry acts_upstream_of_or_within IGI PMID:20625001 (TAIR); YSL2 only
      the IBA.
    - >-
      The review quotes PMID:16815956 (the ysl1 ysl3 double mutant has reduced fertility due to
      defective anther and embryo development) and PMID:19549626. PMID:20625001 itself was not read.
    review_edited: false
    notes: >-
      The seeds are one double-mutant interaction, qualified acts_upstream_of_or_within by TAIR, in
      which loss of metal-nicotianamine delivery to seeds impairs fertility. That is a nutritional
      consequence of transport read as participation in a developmental programme. The existing reason
      makes this argument and names the seeds. Its propagation_review comment speaks of the base of the
      whole YSL clade; the node covers 150 of the 529 leaves in the family, which is close enough to
      what it means (the clade holding YSL1 to YSL3 and the grass YS1 group) that the text was left.
- gene_file: genes/MAIZE/LOC541855/LOC541855-ai-review.yaml
  rows:
  - go_id: GO:0000162
    go_label: L-tryptophan biosynthetic process
    family: PTHR43406
    ibd_node: PTN000034360
    tree_reading: >-
      IBD at the family root PTN000034360 (151 leaves, 80 species) with three seeds, E. coli TrpA
      (P0A877), P. aeruginosa TrpA (P07344) and Arabidopsis TSA1 (AT3G54640, Q42529). Children are a
      9-leaf archaeal and Aquifex clade PTN002880790 and PTN000034377 (142 leaves), which holds the
      target and the seeds. ZmTSAlike (leaf PTN002880805) is in PTN009169760 (2 maize leaves) under the
      grass node PTN002880802 (8 leaves, 6 species) and PTN001618102 (51 leaves), inside the plant node
      PTN008681542 (110 leaves), which carries the chloroplast IBD. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. E. coli TrpA has IDA PMID:8797836 (ComplexPortal) and
      acts_upstream_of_or_within IMP PMID:8463331 (EcoliWiki); P. aeruginosa TrpA has IDA PMID:3127651
      (PseudoCAP); Arabidopsis TSA1 has IDA PMID:7476868 (UniProt). The seeds are sound.
    - >-
      The row quotes PMID:18430213 (ZmTSAlike inactive with IGP with or without the beta subunit, no
      ZmTSAlike peptides in the native complex, and the authors leave open a cytosolic TSA role).
    - >-
      interpro/panther/PTHR43406/PTHR43406-review.yaml rates the node SOUND with BX1 as the expected
      exception and does not consider ZmTSAlike.
    - >-
      rereview-2026-11-21 batch-N09 upheld REMOVE for the activity row GO:0004834 and the chloroplast
      row on this gene on TARGET_LOSS grounds (ADD_IRD at the leaf PTN002880805).
    review_edited: false
    notes: >-
      The ground is evidence on the target itself, a negative in vitro assay and absence from the
      native complex, which the authors and the review treat as short of showing that the protein has
      no part in tryptophan synthesis (catalytic residues retained, cytosolic role under untested
      conditions left open). The review removes the complex activity term, which was tested directly
      and failed, and holds the process term and the IEA lyase activity at over-annotation; that split
      is coherent and the reason names the node, so the file was left alone. No PAINT change follows
      from doubt. An in vivo test, a ZmTSAlike mutant in a tsa background or indole production from
      the cytosolic protein, would settle it; if it comes out negative the loss requested for
      GO:0004834 at the leaf should cover this term too.
- gene_file: genes/MAIZE/LOC541641/LOC541641-ai-review.yaml
  rows:
  - go_id: GO:0010029
    go_label: regulation of seed germination
    family: PTHR43719
    ibd_node: PTN008117964
    tree_reading: >-
      IBD at PTN008117964 (165 of the 772 leaves in the family, 36 species) with three seeds,
      Arabidopsis AHK3 (AT1G27320, Q9C5U1), AHK4 (AT2G01830, Q9C5U0) and AHK2 (AT5G35750, Q9C5U2).
      Children are PTN008684526 (159 leaves, holds the target and all three seeds) and a 6-leaf
      Selaginella clade PTN008118067. ZmHK2 (leaf PTN002885772) is in the AHK3 orthologue clade
      PTN005179416 (53 leaves), where it joins the AHK3 seed; AHK2 and AHK4 are in the sister clade
      PTN008684534 (105 leaves). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN008117964
    evidence_checked:
    - >-
      QuickGO by accession and GO id. AHK2, AHK3 and AHK4 each carry acts_upstream_of_or_within IMP
      PMID:16361392 (TAIR).
    - >-
      publications/PMID_16361392.md (abstract only). Receptor mutant seeds germinate faster with a
      reduced light requirement, among shoot, leaf senescence, seed size and root phenotypes of the
      same mutants.
    - The row quotes PMID:24585212 and the gene's deep-research file. No family review exists for PTHR43719.
    review_edited: false
    notes: >-
      The target sits with its orthologue seed, so the node is not too deep; the call rests on the
      seeds. All three are one mutant study of a pleiotropic hormone receptor family, which TAIR
      qualifies as acts_upstream_of_or_within and the IBD turns into involved_in. The existing reason
      gives this ground (a phenotype-level outcome of losing cytokinin signalling) and names the seeds.
      It also mentions the absence of maize data and the monocot-dicot split, which are not grounds,
      but the seed argument carries it, so the row was left as written. Contrast with the cold row
      below, where the seed evidence shows the receptors relaying the stimulus.
  - go_id: GO:0070417
    go_label: cellular response to cold
    family: PTHR43719
    ibd_node: PTN008117964
    tree_reading: >-
      Same node (165 leaves). Two seeds, Arabidopsis AHK2 (AT5G35750, Q9C5U2) and AHK3 (AT1G27320,
      Q9C5U1). ZmHK2 is in the AHK3 orthologue clade PTN005179416 (53 leaves) together with the AHK3
      seed, across the monocot-dicot speciation with no duplication between them; AHK2 is in the
      sister clade PTN008684534 (105 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. AHK2 and AHK3 each carry involved_in IMP PMID:20463025 (UniProt);
      AHK4 only the IBA.
    - >-
      publications/PMID_20463025.md (full text cached; abstract read). Cold induces type-A ARR genes,
      AHK2 and AHK3 mediate that induction without a change in cytokinin content, and ahk2 ahk3 and
      ahk3 ahk4 mutants show enhanced freezing tolerance.
    review_edited: true
    notes: >-
      The earlier reason rested on the absence of cold data for ZmHK2 and on the monocot-dicot split.
      Neither is a ground. The seeds show the receptors transmitting the cold signal to response
      regulator expression, which is participation and not only a phenotype, and the target is the
      orthologue of one of them. Changed to KEEP_AS_NON_CORE (a stress context of receptor signalling,
      not the core function). Summary, reason, supported_by and propagation_review rewritten;
      PMID:20463025 was added to the review's references (the publication file was already cached).
      The deep-research quote was kept verbatim; the PMID:15064375 quote on functional differentiation
      of the ZmHKs was dropped from this row because it no longer supports the action.
- gene_file: genes/MONBE/MBCDH12/MBCDH12-ai-review.yaml
  rows:
  - go_id: GO:0016477
    go_label: cell migration
    family: PTHR24027
    ibd_node: PTN008601603
    tree_reading: &cdh_tree >-
      IBD at the family root PTN008601603 (580 leaves, 33 species). The root has two children, the
      metazoan clade PTN009075361 (579 leaves, 32 species), which holds every seed, and the single
      Monosiga brevicollis leaf PTN001932226, which is the target. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &cdh_fix
      paint_action: MOVE_IBD
      target_node_id: PTN009075361
    evidence_checked:
    - >-
      Ten seeds, vertebrate cadherins (among them human CDH13 P55290, CDH5 P33151, DCHS1 Q96JQ0 and
      chick CDH7 Q90763). QuickGO with descendants on two of them. CDH13 has IDA PMID:14729458 on
      GO:0030335 and GO:0043542 (BHF-UCL); CDH5 has IDA PMID:15572031 and IMP PMID:31934175 on
      descendant terms (ARUK-UCL). The other eight were not queried.
    - The row quotes PMID:22837400. No family review exists for PTHR24027.
    review_edited: false
    notes: >-
      The target is the lone outgroup leaf of a root whose other child is all of Metazoa, so the IBD
      reaches it only because it was placed one node too high. The seeds are migration of animal cells
      within tissues, and the choanoflagellate protein has divergent repeats, an SH2 tail and no
      catenin-binding domain. Nothing shows it lacks a role in cell movement, so this is doubt and
      not loss. The reason already says the root placement turns an animal process into an ancestral
      claim. Left as written. The rereview-2026-11-21 pass handled the catenin rows on this gene as
      removals; those rest on the missing cytoplasmic domain, which these three terms do not need.
  - go_id: GO:0045296
    go_label: cadherin binding
    family: PTHR24027
    ibd_node: PTN008601603
    tree_reading: *cdh_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *cdh_fix
    evidence_checked:
    - >-
      Three seeds, chick CDH2 (P10288), human CDH13 (P55290) and mouse Cdh9 (MGI:107433). QuickGO
      exact. CDH13 enables IDA PMID:10601632 (BHF-UCL); chick CDH2 enables IMP PMID:11970959 (AgBase).
      The mouse seed was not queried.
    - >-
      The row quotes PMID:22837400 and the gene's bioinformatics RESULTS.md (cadherin-like repeats
      divergent).
    review_edited: false
    notes: >-
      Same tree. Trans binding between vertebrate cadherin ectodomains is carried to a protein whose
      repeats lack the calcium-binding motifs and the cadherin signature. The reason gives the
      divergence and its propagation_review names the root placement. Left as written. A binding
      assay with the recombinant ectodomain would settle it.
  - go_id: GO:0098609
    go_label: cell-cell adhesion
    family: PTHR24027
    ibd_node: PTN008601603
    tree_reading: *cdh_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *cdh_fix
    evidence_checked:
    - >-
      Twenty-two seeds, all vertebrate cadherins. QuickGO exact on human CDH1 P12830 returns
      involved_in IDA PMID:16338932 (BHF-UCL). The others were not queried.
    - The row quotes PMID:18273011 and PMID:22837400.
    review_edited: false
    notes: >-
      Same tree. I considered a removal on lineage grounds, since M. brevicollis is strictly
      unicellular, and did not make it. Cell-cell adhesion is not confined to multicellular organisms
      (mating and transient contacts count), other choanoflagellates form colonies, and the review's
      own source lists gamete recognition among the possible roles. The reason states this and the
      root placement. The same-term IEA row carries the same action. Left as written.
- gene_file: genes/MONBE/MONBRDRAFT_1233/MONBRDRAFT_1233-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      IBD at PTN002390470 (56 leaves, 35 species) with two seeds, human LATS2 (Q9NRM7) and mouse Lats2
      (MGI:1354386). Children are the animal clade PTN001219864 (55 leaves, 34 species, holds both
      seeds) and the single Monosiga leaf PTN001220369, which is the target. Batches H13 and N09 place
      both seeds in the vertebrate LATS2 clade PTN004697711 (21 leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004697711
    evidence_checked:
    - QuickGO exact. Human LATS2 Q9NRM7 involved_in IDA PMID:12853976 (UniProt).
    - >-
      The row quotes DOI:10.1101/2024.07.13.603360 (S. rosetta warts knockouts proliferate more
      slowly, the reverse of the animal loss-of-function phenotype).
    - >-
      interpro/panther/PTHR24356 has a review.md only, no structured family review. Batches H13 (human
      LATS1) and N09 (worm wts-1) judged the same record NODE_TOO_DEEP with the same fix.
    review_edited: false
    notes: >-
      Same record, ground and fix as LATS1 and wts-1. The target is the outgroup leaf of the node, and
      both seeds are vertebrate LATS2. The choanoflagellate evidence (opposite proliferation phenotype
      in S. rosetta, eroded Hippo pathway in M. brevicollis) is doubt and not loss, since G1/S control
      was not tested. The reason names the node and the seeds. Left as written. PTN004697711 was read
      from the earlier batches and not from this gene's treeview, which lists only its own lineage.
  - go_id: GO:0043065
    go_label: positive regulation of apoptotic process
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      Same node (56 leaves). One seed, Drosophila wts (FB:FBgn0011739, Q9VA38), inside the animal clade
      PTN001219864 (55 leaves). The target is the other child, the single Monosiga leaf PTN001220369.
      No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001219864
    evidence_checked:
    - QuickGO exact. Fly wts Q9VA38 involved_in IGI PMID:12202036 (FlyBase).
    - >-
      The row quotes PMID:38729842 (choanoflagellate Yorkie and Sd/TEAD interaction unclear;
      M. brevicollis may have lost Hippo regulation of Yorkie).
    - Batch N09 judged the same record TARGET_DOUBT for worm wts-1, which sits next to the fly seed.
    review_edited: false
    notes: >-
      For the worm the seed is a close relative; here the target is the lone leaf outside the animal
      clade. The fly mechanism runs through Yorkie and an anti-apoptotic programme of growing tissue,
      and M. brevicollis Yorkie lacks the Warts sites. Moving the IBD to the animal clade is the
      smallest change that stops the transfer; whether one fly seed should cover all animals is a
      separate question raised in N09. The reason names the node and seed and gives the target
      evidence. Left as written.
- gene_file: genes/PARTE/A0BFB4/A0BFB4-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR24348
    ibd_node: PTN000681272
    tree_reading: &atg1_tree >-
      IBD at PTN000681272 (494 of the 635 leaves in PTHR24348, 94 species). Its children are
      PTN000681273 (134 leaves, 53 species; ULK1, ULK2, ULK3 and fungal ATG1, holds human ULK1 and
      ULK2, yeast ATG1 and A. fumigatus atg1) and PTN007795585 (360 leaves, 41 species), which holds
      the target. Under PTN007795585 the target (leaf PTN002805316) is one of 257 leaves of
      PTN007795752, a clade made up of Paramecium tetraurelia only, which with three Phytophthora
      leaves forms PTN001218730 (260 leaves) and joins the clade PTN000681408 (88 leaves,
      holds Arabidopsis ATG1A Q94C95) at PTN008401646 (348 leaves). UniProt and the current PANTHER HMM
      place A0BFB4 in PTHR44167, where it is not a leaf. No loss recorded for any of the five terms.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &atg1_fix
      paint_action: NONE
    evidence_checked: &atg1_ev
    - >-
      QuickGO exact, by accession. ULK1 O75385 has GO:0000045 IDA PMID:19225151 and PMID:28890335,
      GO:0000407 IDA PMID:19597335 and GO:0005776 IDA PMID:17595159 and PMID:22456507; yeast ATG1
      P53104 has GO:0000045 IDA PMID:18725539 and IMP PMID:22778255 and PMID:9224897, and GO:0000407
      IDA (three papers); Arabidopsis ATG1A Q94C95 has GO:0005776 IDA PMID:21984698. For GO:0016020 and
      GO:0010506 the exact term returns no experimental row on these three; the seeds carry descendant
      terms, which were not listed.
    - >-
      The rows quote PMID:28123910 (ciliate Atg1-like kinase-domain proteins all lack the Atg1
      C-terminal domain, and ciliates lack Atg13, Atg17, FIP200 and Atg101) and the gene's
      bioinformatics RESULTS.md (1 of 200 bootstrap replicates groups A0BFB4 with ATG1/ULK).
    - >-
      interpro/panther/PTHR24348/PTHR24348-review.yaml assesses these node records for the ULK3
      subfamily only (NEEDS_PRUNING or UNRESOLVED) and does not consider the Paramecium expansion.
    review_edited: false
    notes: &atg1_note >-
      The seeds are canonical Atg1/ULK kinases and are sound. The target is one of 257 paralogs in a
      single-species expansion that the tree grafts beside the clade holding Arabidopsis ATG1A. A kinase family of that size in
      one ciliate cannot all be autophagy-initiation kinases, the proteins lack the C-terminal module
      through which Atg1 joins its complex and reaches the phagophore, the complex partners are absent
      from ciliates, and the placement in this family is itself contested by the HMM. That is evidence
      on the target's subfamily, and strong, but the source paper leaves open whether any of these
      kinases acts in ciliate autophagy, so the rows stay over-annotations and are not removals. The
      existing reasons give exactly this evidence and name the node. Left as written. I did not ask
      for the IBD to move to PTN000681273, because that would also strip the clade of Arabidopsis ATG1A, which
      is a seed for the autophagosome term. If a PAINT curator judges the divergence settled, the
      pruning point is the Paramecium-only node PTN007795752 (or PTN001218730 with the three
      Phytophthora leaves), for all five terms at once. The family review should take up this clade.
  - go_id: GO:0000045
    go_label: autophagosome assembly
    family: PTHR24348
    ibd_node: PTN000681272
    tree_reading: *atg1_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *atg1_fix
    evidence_checked: *atg1_ev
    review_edited: false
    notes: *atg1_note
  - go_id: GO:0010506
    go_label: regulation of autophagy
    family: PTHR24348
    ibd_node: PTN000681272
    tree_reading: *atg1_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *atg1_fix
    evidence_checked: *atg1_ev
    review_edited: false
    notes: *atg1_note
