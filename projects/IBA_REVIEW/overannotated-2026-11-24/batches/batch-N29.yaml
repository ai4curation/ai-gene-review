    ibd_node: PTN000681272
    tree_reading: *atg1_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *atg1_fix
    evidence_checked: *atg1_ev
    review_edited: false
    notes: *atg1_note
  - go_id: GO:0005776
