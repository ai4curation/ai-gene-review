    notes: *atg1_note
- gene_file: genes/MYCTU/cysM/cysM-ai-review.yaml
  rows:
  - go_id: GO:0004124
    go_label: cysteine synthase activity
    family: PTHR10314
    ibd_node: PTN008497439
    tree_reading: >-
      IBD at PTN008497439 (25 leaves, 17 species) with one seed, E. coli CysM (P16703). Children are
      PTN008497440 (10 leaves, Trichomonas and Nitrosopumilus) and the bacterial clade PTN002569131
      (15 leaves, 15 species), which holds both the seed and the target (leaf PTN002232520, under
      PTN002569131 through PTN008497441, 4 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO exact. E. coli CysM P16703 enables IDA PMID:16546401 (EcoCyc). The seed is sound.
    - >-
      The row quotes PMID:18842002 (more than 500-fold preference for O-phosphoserine over
      O-acetylserine), the gene's source-analysis note on PMID:18799456 (no cysteine detected from OAS
      and sodium sulfide), PMID:16104727 and PMID:17567578.
    - >-
