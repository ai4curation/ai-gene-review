- gene_file: genes/CHICK/DER/DER-ai-review.yaml
  rows:
  - go_id: GO:0006006
    go_label: glucose metabolic process
    family: PTHR44252
    ibd_node: PTN001211870
    tree_reading: >-
      IBD at the family root PTN001211870 (50 leaves, 32 species) with three seeds, human DCXR
      (Q7Z4W1), mouse Dcxr (MGI:1915130, Q91X52) and rat Dcxr (RGD:620031, Q920P0). Children are
      PTN001211871 (49 leaves) and one Monosiga leaf. Chicken DER (leaf PTN001962763) pairs with a
      second chicken entry (A0A8V1AB26) at PTN009175093 and with Anolis DCXR at PTN001548964 (3
      leaves), and joins all three seeds at the amniote node PTN001211873 (27 leaves, 15 species); the
      seeds are in its mammalian part PTN002545639 (24 leaves, DCXR and Cbr2). Worm dhs-21 joins only
      at PTN000671468 (47 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human DCXR, mouse Dcxr and rat Dcxr each carry involved_in IDA
      PMID:11882650 (UniProt).
    - >-
      publications/PMID_11882650.md (abstract only). The purified recombinant enzymes interconvert
      xylitol and L-xylulose, and the abstract identifies them with L-xylulose reductase, which is
      involved in the uronate cycle of glucose metabolism; it adds that the kidney localization
      suggests a further role.
    - >-
      publications/PMID_7358641.md (abstract only). The chicken liver enzyme reduces D-erythrulose
      and was highly specific to it; which other substrates were tested is not stated.
    - >-
      genes/human/DCXR/DCXR-ai-review.yaml keeps this term KEEP_AS_NON_CORE on its IBA, IDA and IEA
      rows. This gene's own L-xylulose reductase and xylulose metabolic process IBA rows are
      KEEP_AS_NON_CORE.
    - >-
      interpro/panther/PTHR44252/PTHR44252-review.yaml exists and has no assessment of this term.
    review_edited: true
    notes: >-
      The earlier reason rested on the donors being in a sister subfamily (SF2 against SF3), on the
      link being indirect, on the term being broad and on the absence of chicken data. In the tree
      DER is not across a subfamily divide from the seeds; it is the bird and reptile counterpart of
      the mammalian DCXR and Cbr2 clade, inside the 27-leaf amniote node with all three seeds. The
      seeds are sound, and the claim stands or falls with the inherited L-xylulose reductase
      activity, which this review already keeps as non-core in spite of the D-erythrulose specificity
      reported in 1980. Keeping one and marking the other over-annotated was inconsistent, so the row
      moved to KEEP_AS_NON_CORE, matching the human DCXR review. The PMID:11882650 quote on kidney
      localization was replaced by the uronate cycle sentence from the same abstract; the PMID:7358641
      quote is unchanged. A substrate panel including L-xylulose on recombinant chicken DER would
      settle the remaining doubt for all three rows together.
