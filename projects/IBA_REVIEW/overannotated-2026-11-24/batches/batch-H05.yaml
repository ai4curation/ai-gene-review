- gene_file: genes/human/CSN2/CSN2-ai-review.yaml
  rows:
  - go_id: GO:0004869
    go_label: cysteine-type endopeptidase inhibitor activity
    family: PTHR11500
    ibd_node: PTN000161175
    tree_reading: >-
      The IBD sits at the family root PTN000161175 (14 leaves, 12 species), whose children are the
      eutherian beta-casein clade PTN000161176 (13 leaves, holding the target) and one Monodelphis
      leaf. The two seeds are human CSN2 (P05814, the target itself) and bovine CSN2 (P02666), both
      inside PTN000161176. No loss is recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P05814 and P02666 GO:0004869, each one IDA from PMID:12788072 (assigned by CAFA) beside
      the IBA.
    - >-
      The row quotes PMID:12788072 (beta-casein and a synthetic L133-Q151 peptide inhibited cysteine
      proteases); quote left as it is. No family review exists for PTHR11500.
    review_edited: false
    notes: >-
      Upheld. The gene is its own seed, which is not a reason to doubt the IBA; the over-annotation
      is in the seed rows, one in vitro reverse-zymography study with no evidence of inhibition under
      physiological conditions, and the review marks its own IDA row the same way. The reason states
      this. No PAINT change is asked for: while the two IDA rows stand, propagating them within
      beta-casein orthologs is what PAINT is meant to do, and the question belongs with the seed rows.
- gene_file: genes/human/LAMP3/LAMP3-ai-review.yaml
  rows:
  - go_id: GO:0072594
    go_label: establishment of protein localization to organelle
    family: PTHR11506
    ibd_node: PTN000897064
    tree_reading: >-
      The IBD sits at the family root PTN000897064 (151 leaves, 4 seeds). Three seeds are LAMP2
      (human P13473, mouse and rat Lamp2), in the LAMP2 clade, where PAINT separately asserts the
      child term GO:0061740 at PTN002608933 (20 leaves); their common ancestor with LAMP3 is
      PTN002479610 (117 leaves). The fourth seed is human LAMP1 (P11279), in PTN002608925 (24
      leaves). LAMP3 is in PTN002608921 (17 leaves); it shares the 62-leaf node PTN000897066 with
      LAMP1 and CD68 (PTN008519345, 21 leaves) and its own clade holds no seed. No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002608925
    evidence_checked:
    - >-
      QuickGO by GO:0072594 with descendants. P11279, IMP PMID:23632890 (UniProt) on the term itself.
      P13473 and P17047, IMP PMID:27628032 on GO:0061740 protein targeting to lysosome involved in
      chaperone-mediated autophagy. P17046, IMP and IGI PMID:18644871 (MGI) on the same child term.
      Q9UQV4 (target), only the IBA.
    - >-
      publications/PMID_23632890.md is abstract-only; title "LAMP1/CD107a is required for efficient
      perforin delivery to lytic granules". No family review exists for PTHR11506.
    review_edited: true
    notes: >-
      Action unchanged, reason and summary rewritten. The earlier text named only LAMP2 as the source
      and missed the LAMP1 seed, which sits in the sibling clade of LAMP3. The general term at the
      root joins two paralog-specific roles (LAMP-2A as the CMA receptor, LAMP1 in perforin delivery)
      and spreads the result to LAMP3, CD68 and LAMP5. The LAMP2 clade already has the specific term,
      so the general one could move to the LAMP1 clade PTN002608925. The LAMP1 seed was not disputed
      (abstract only).
- gene_file: genes/human/FDPS/FDPS-ai-review.yaml
  rows:
  - go_id: GO:0005759
    go_label: mitochondrial matrix
    family: PTHR11525
    ibd_node: PTN000897621
    tree_reading: >-
      The IBD sits at PTN000897621 (34 leaves, 30 species), an animal FPPS node four levels below the
      family root PTN000162949 (174 leaves, which carries the cytosol IBD). Its children are
      PTN000897622 (33 leaves, holding the target) and one Monosiga leaf. The three seeds are human
      FDPS itself (P14324), rat Fdps (common ancestor with the target at the 6-leaf node PTN000162958)
      and Drosophila Fpps (common ancestor at PTN000162952, 31 leaves). No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0005739 with descendants. Rat Fdps P05369, mitochondrial matrix located_in IDA
      PMID:8119922 (RGD). Human P14324 and fly Q7KN61, only the IBA today; a search by reference
      finds the FlyBase IDA from PMID:17198737 on the fly accession A1Z8J1, and the UniProt entry
      for P14324 carries the cross-reference line for GO:0005759 with IDA:FlyBase.
    - >-
      PubMed abstracts (neither paper is in publications/). PMID:8119922, FPP synthase activity in
      rat liver mitochondria, trypsin-sensitive only after sonication, localized to the matrix, 13%
      of hepatic capacity. PMID:17198737, one of two human FPS mRNAs encodes an isoform with a
      66-residue N-terminal extension that targets it to mitochondria; functional proof for the
      Drosophila enzyme.
    - >-
      genes/human/FDPS/FDPS-uniprot.txt, VAR_SEQ 1..66 missing in isoform 2, so the displayed
      419-residue sequence is the long isoform.
    - >-
      Family review interpro/panther/PTHR11525/PTHR11525-review.yaml assesses the node as UNRESOLVED
      and quotes the first sentence of this row's summary.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The earlier text said the IBA came from fly and rat
      orthologs and was not supported for the human protein; the target is itself a seed, the rat
      ortholog has a direct matrix IDA, and the human long isoform is reported to be targeted to
      mitochondria. Kept as non-core because the cytosolic pool dominates. The first sentence of the
      summary was left verbatim because the family review quotes it. The family review's UNRESOLVED
      assessment for this node could now be SOUND; it also says FDPS marks the row over-annotated,
      which is no longer true, and that file was not edited. Both papers were read as abstracts only.
- gene_file: genes/human/CKB/CKB-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11547
    ibd_node: PTN000167125
    tree_reading: &ck_tree >-
      The IBD sits at the family root PTN000167125 (182 leaves, 44 species), whose children are
      PTN000899913 (175 leaves) and PTN000167317 (7 bacterial mcsB leaves). The three seeds are
      chicken CKB (P05122), chicken CKM (P00565) and mouse Ckm (P07310), all inside the 61-leaf
      cytosolic creatine kinase node PTN008972977. Chicken CKB shares the 17-leaf node PTN000167164
      with human CKB; mouse Ckm shares the 6-leaf node PTN000167139 and chicken CKM the 16-leaf node
      PTN001356285 with human CKM. PAINT blocks the term for the mitochondrial creatine kinases with
      a NOT IRD at PTN000899952.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000167125
    evidence_checked: &ck_evidence
    - >-
      QuickGO by GO:0005576 with descendants. P05122 and P00565, located_in IDA PMID:8525081 (AgBase).
      P07310, located_in IDA PMID:24177035 (MGI). P12277 (human CKB), ISS and extracellular exosome
      HDA rows. P06732 (human CKM), no experimental row.
    - >-
      The earlier pass read the PubMed abstracts (plasma creatine kinase isoenzymes in fowl; a
      dysferlin and myoferlin dystrophy study reporting creatine kinase levels). Not re-read.
    - No family review exists for PTHR11547.
    review_edited: false
    notes: >-
      Upheld. The seeds are located_in rows on the targets' own orthologs and record enzyme found in
      plasma, released from tissue, which PAINT propagates as is_active_in. A leak location is true
      as an observation and is not where the kinase works (pattern 21). The reason already states
      this with the nodes. The fix that follows from the ground is to drop the is_active_in IBD; the
      earlier pass asked only for a narrower IBD at PTN008972977, which would still leave the term on
      CKB and CKM. The seed papers were not read in full, so this is a request to check, not a
      finding that the located_in rows are wrong.
- gene_file: genes/human/CKM/CKM-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
