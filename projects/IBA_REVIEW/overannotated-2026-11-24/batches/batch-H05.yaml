    evidence_checked:
    - QuickGO Q9GZV9 and Q9EPC2 GO:0030334 with descendants, only the IBA.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. It rested on absence of evidence alone. Same ground as the
      neurogenesis row.
- gene_file: genes/human/FGF7/FGF7-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: false
    notes: >-
      Upheld. Mouse Fgf7, the target's ortholog in the 6-leaf node PTN000160271, is a seed through a
      Golgi apparatus located_in IDA, a secretory transit location propagated as is_active_in. The
      reason already states this with the node ids.
  - go_id: GO:0022008
    go_label: neurogenesis
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves, 16 seeds), with seeds on both sides
      of the root split. Three are in the FGF7/FGF10/FGF22/FGF3 clade PTN008519124 (87 leaves) with
      FGF7: zebrafish fgf22 (Q1XG76), zebrafish fgf3 (P48802) and mouse Fgf10 (O35565). The only
      PAINT loss for the term is at the FGF homologous factor node PTN000160077.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0022008 with descendants. Q1XG76, IMP PMID:37783119 (ZFIN) on forebrain generation
      of neurons and gliogenesis. P48802, IMP and IGI rows (ZFIN) on positive regulation of neuron
      differentiation, neuron fate specification and oligodendrocyte differentiation. O35565, IMP
      PMID:19607792 (UniProt) on radial glial cell differentiation. P21781 and P36363 (mouse Fgf7),
      only the IBA.
    - The row quotes PMID:20505669 (FGF7 as a presynaptic organizer of inhibitory synapses); quote kept.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The earlier reason said neurogenic roles belong to other
      FGF subfamilies, which the tree contradicts (three seeds in FGF7's own clade), and otherwise
      rested on FGF7 having no demonstrated role, which is absence of data. Nothing on FGF7 argues
      against the term, and FGF7 does act on developing neurons. Peripheral to its epithelial
      mitogen role, so KEEP_AS_NON_CORE, like its regulation of cell migration IBA.
- gene_file: genes/human/FGF8/FGF8-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
