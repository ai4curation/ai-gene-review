genes:
- gene_file: genes/human/FGF10/FGF10-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: &fgf_cyto_tree >-
      The IBD sits at the family root PTN000160075 (504 leaves, 32 species, 13 seeds), whose children
      are PTN007510376 (69 leaves, FGF8/FGF17/FGF18) and PTN000896506 (435 leaves, everything else).
      Seeds located with a script over the treeview loaders. Cytosolic residents: human FGF1, chicken
      FGF2 and worm let-756 (common ancestor with the secreted FGFs at PTN002479514, 427 leaves), and
      FGF13, mouse Fgf13 and Fgf14, zebrafish fgf11 and fgf11b in the FGF homologous factor clade
      (common ancestor with FGF19/FGF21/FGF23 at PTN008971209, 277 leaves). Seeds on secreted FGFs:
      mouse Fgf7, Fgf22 and Fgf3 in the FGF7/FGF10/FGF22/FGF3 clade PTN008519124 (87 leaves; mouse Fgf7
      shares the 6-leaf node PTN000160271 with human FGF7), and rat Fgf18 and zebrafish fgf8a in
      PTN007510376 (fgf8a shares the 27-leaf node PTN002608342 with human FGF8, Fgf18 the 60-leaf node
      PTN000896584). No seed is in the 185-leaf node PTN008519134 that holds FGF19, FGF21 and FGF23.
      PAINT records nucleus IBDs at PTN000160077 and PTN000896537 and NOT extracellular region IRDs at
      PTN000160077 and PTN002608270; no loss is recorded for cytoplasm.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: &fgf_cyto_evidence
    - >-
      QuickGO by GO:0005737 with descendants for each secreted-FGF seed (the same query shape returns
      experimental rows for every seed checked). Mouse Fgf7 P36363 and Fgf22 Q9ESS2, Golgi apparatus
      located_in IDA PMID:12837279 (MGI). Mouse Fgf3 P05524, cytoplasm and Golgi apparatus located_in
      IDA PMID:7591288 (MGI). Zebrafish fgf8a O57341, lysosome located_in IDA PMID:15498491 (ZFIN).
      Rat Fgf18 O88182, cytoplasm located_in IDA PMID:16756958 (UniProt). Worm let-756 Q11184,
      cytoplasm located_in IDA PMID:16487967 (WB). Human FGF8 P55075 and mouse Fgf8 P37237, no
      experimental row. Seed papers not read in full.
    - The earlier pass (rereview-2026-11-21 batch-07) recorded the rows for the cytosolic seeds; not repeated.
    - No family review exists for PTHR11486.
    review_edited: false
    notes: >-
      Upheld. Three seeds are in FGF10's own 87-leaf clade, so the tree gives no ground to remove,
      and all three are located_in rows on secreted ligands (Golgi, producing-cell cytoplasm) that
      PAINT propagates as is_active_in. That is a transit location used as a seed (IBA_REVIEW.md
      pattern 21). The written reason already says this and names the nodes. The fix is to lower the
      IBD to the clades of cytosolic residents, PTN000160077 and PTN000896537 (the format takes one id).
- gene_file: genes/human/FGF19/FGF19-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: false
    notes: &fgf_endocrine_cyto >-
      Upheld. No seed is in the 185-leaf node PTN008519134 that holds the endocrine FGFs; the nearest
      are the signal-peptide-less FGF homologous factors. The row is over-annotated and not removed
      because the same root record is seeded by Golgi and lysosome rows on other secreted FGFs, so
      in the transit sense the term is as true of an endocrine FGF as of FGF7 (pattern 21 says these
      are not removals). The existing reason states the clade without seeds and the target nodes for
      the move. A reader who takes is_active_in strictly could make these REMOVE on MISPLACED_IBD
      grounds without contradicting the tree.
- gene_file: genes/human/FGF21/FGF21-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: false
    notes: *fgf_endocrine_cyto
  - go_id: GO:0008284
    go_label: positive regulation of cell population proliferation
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves, 31 seeds). Three seeds are in the
      FGF19/FGF21 clade PTN002608284 (37 leaves): mouse Fgf21 (Q9JJN1), whose common ancestor with
      human FGF21 is the 6-leaf node PTN000160408, human FGF19 (common ancestor PTN008519127, 27
      leaves) and zebrafish fgf19 (common ancestor PTN002608284). PAINT records losses for the term
      at the FGF homologous factor node PTN000160077 and at the leaf PTN000160186, none in the
      endocrine clade.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q9JJN1 GO:0008284, acts_upstream_of_or_within IGI PMID:18187602 (MGI). O95750, the same
      IGI. Q9NSA1 (target), only the IBA.
    - >-
      The row quotes PMID:18187602 (proliferation of FGFR1c/BaF3 transfectants expressing beta-Klotho)
      and PMID:15902306 (FGF-21 mitogenically inactive on FGF-sensitive lines and primary cells, no
      growth in transgenic mice); quotes left as they are.
    review_edited: false
    notes: >-
      Upheld. The target's own ortholog is a seed, so the placement is sound, and the doubt is on the
      gene: direct tests found FGF21 non-mitogenic in ordinary FGF-responsive cells and in vivo, and
      the seed row is a reconstituted BaF3 receptor-activation readout with the weaker qualifier.
      That is weak or conditional function, short of loss. The reason already says so with node ids.
      An experiment in a cell type that expresses beta-Klotho natively would settle it.
  - go_id: GO:0022008
    go_label: neurogenesis
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves, 16 seeds), with seeds on both sides
      of the root split (FGF8 family in PTN007510376; FGF2, Fgf10, Fgf5, Fgf13, Fgf20, fgf3, fgf16,
      fgf22, bnl in PTN000896506). One seed, zebrafish fgf19 (A0A0R4IN60), is in the FGF19/FGF21 clade
      PTN002608284 (37 leaves), in its 5-leaf fish child PTN002608290; FGF21 is in the other child,
      PTN000160451 (32 leaves), which holds no seed. The only PAINT loss for the term is at the FGF
      homologous factor node PTN000160077.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO A0A0R4IN60 GO:0022008 with descendants, acts_upstream_of_or_within IMP rows from
      PMID:16256099 and PMID:18089288 (ZFIN) on neuron fate specification, oligodendrocyte
      differentiation, positive regulation of neurogenesis and retinal ganglion cell axon guidance.
      Q9NSA1, Q9JJN1 and O95750, only the IBA.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason ended on absence of data ("plausible,
      unverified"), which is not a ground. The ground that holds is NODE_TOO_DEEP for this branch.
      The seeds are heparan-sulfate-bound developmental FGFs, the 32-leaf child that holds FGF21 has
      no seed, and FGF21's low heparan sulfate affinity and beta-Klotho dependence give a biological
      reason to doubt the transfer. No single node carries the seeds, so no MOVE_IBD target is named.
      A close call with KEEP_AS_NON_CORE, since one seed sits in the sister fish clade; FGF7, whose
      own clade holds three seeds and which has no co-receptor restriction, was moved to
      KEEP_AS_NON_CORE in this batch.
  - go_id: GO:0030334
    go_label: regulation of cell migration
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves, 12 seeds): FGF1, FGF2 (human and
      mouse), FGF4, FGF7, FGF10 (human and mouse), rat Fgf9, FGF16, FGF18, zebrafish fgf3 and fgf8a.
      None is in the FGF19/FGF21 clade PTN002608284 (37 leaves). The nearest, FGF4, Fgf9 and FGF16,
      share the 182-leaf node PTN008519135 with FGF21. PAINT losses for the term are at PTN000160077
      and the leaf PTN000160186.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO Q9NSA1, Q9JJN1 and O95750 GO:0030334 with descendants, only the IBA.
    review_edited: true
    notes: >-
      Action unchanged, the end of the reason rewritten. It concluded from "not shown" alone. The
      ground is that the seeds lie in the paracrine clades, the endocrine clade has none, and the
      co-receptor dependence and low heparan sulfate affinity of FGF21 give reason to doubt the
      transfer. Seeds are spread over several clades, so no single MOVE_IBD target is named.
- gene_file: genes/human/FGF23/FGF23-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: false
    notes: *fgf_endocrine_cyto
  - go_id: GO:0008284
    go_label: positive regulation of cell population proliferation
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: &fgf23_tree >-
      The IBD sits at the family root PTN000160075 (504 leaves). FGF23 is in the clade PTN002608225
      (23 leaves), one of seven children of PTN008519135 (182 leaves); the others are PTN002608309
      (FGF9, 19 leaves), PTN002608284 (FGF19/FGF21, 37), PTN002608212 (FGF4/FGF6, 39), PTN002608237
      (FGF5, 19), PTN002608313 (FGF16, 21) and PTN002608319 (FGF20, 24). No seed for proliferation,
      neurogenesis or cell migration is in the FGF23 clade. Proliferation (31 seeds) has seeds in the
      six sibling clades (FGF4, FGF6, FGF5, Fgf9, Fgf16, Fgf20, FGF19, Fgf21, fgf19); neurogenesis (16
      seeds) in four (Fgf5, fgf16, Fgf20, fgf19); cell migration (12 seeds) in three (FGF4, Fgf9,
      FGF16). PAINT losses for these terms are only at PTN000160077 (FGF homologous factors) and the
      leaf PTN000160186.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO Q9GZV9, Q9EPC2 (mouse) and Q8VI82 (rat) GO:0008284 with descendants, only the IBA.
    - >-
      The row quotes PMID:18282132 (FGF23 overexpression suppressed nodule formation and
      mineralization but not osteoprogenitor proliferation); quote left as it is.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten to say where FGF23 sits. The placement is not wrong on the
      tree (six of seven sibling clades are seeded); the ground is the direct test on the gene in
      which proliferation was unaffected. Proliferation of Klotho-expressing cells in response to
      FGF23 was not searched for, so the doubt is not called a loss.
  - go_id: GO:0022008
    go_label: neurogenesis
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf23_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO Q9GZV9 and Q9EPC2 GO:0022008 with descendants, only the IBA.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. It rested on "no evidence" and said the developmental roles
      are not shared by the endocrine subfamily, which misstates the tree, since zebrafish fgf19 is a
      seed. The ground now stated is NODE_TOO_DEEP for the FGF23 clade, with alpha-Klotho dependence
      as the biological reason for doubt. Seeds are spread over several clades, so no MOVE_IBD target
      is named.
  - go_id: GO:0030334
    go_label: regulation of cell migration
