- gene_file: genes/yeast/THI22/THI22-ai-review.yaml
  rows:
  - go_id: GO:0008972
    go_label: phosphomethylpyrimidine kinase activity
    family: PTHR20858
    ibd_node: PTN000466159
    tree_reading: &thi22_tree >-
      IBD at the family root PTN000466159 (119 leaves) with children PTN000466160 (77 leaves, fungi, plants
      and other eukaryotes, target here) and the bacterial ThiD clade PTN008573130 (42 leaves, E. coli thiD
      P76422 seed). The yeast seeds THI20 (SGD:S000005416) and THI21 (SGD:S000006179) are the target's own
      paralogs in the three-leaf S. cerevisiae node PTN000466169. No loss recorded for either term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. THI20 Q08224 has IDA and IGI PMID:15614489, IGI PMID:10383756 and EXP
      PMID:15967475; THI21 Q08975 has IDA and IGI PMID:15614489 and IGI PMID:10383756. THI22 Q06490 has only
      the IBA and an InterPro IEA.
    - >-
      genes/yeast/THI22/THI22-uniprot.txt CAUTION states that no hydroxymethylpyrimidine phosphate kinase
      activity could be demonstrated for this protein, and FUNCTION (ECO:0000269, PMID:10383756) that it is
      not required for thiamine biosynthesis.
    review_edited: false
    notes: >-
      The node is soundly seeded and THI22 is inside the seeded clade, so the call rests only on evidence
      about the target; the one study that tested the three paralogs found the activity for two and not for
      THI22. That is doubt short of loss, since the catalytic residues are kept and the negative is a
      complementation result. The existing reason says exactly this and names the node. Purified THI22
      assayed for HMP-P kinase activity would settle it.
  - go_id: GO:0009228
    go_label: thiamine biosynthetic process
    family: PTHR20858
    ibd_node: PTN000466159
    tree_reading: *thi22_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. THI20 Q08224 IMP PMID:10383756 and THI21 Q08975 IGI PMID:10383756
      (SGD); THI22 Q06490 has the IBA, an IEA and an IEP PMID:10383756 (induction on thiamine limitation).
    - UniProt FUNCTION line for THI22, as above.
    review_edited: false
    notes: >-
      Same ground as the kinase row. The IEP and IEA rows on the same term carry the same action, so the
      term is consistent across the review.
- gene_file: genes/yeast/AGX1/AGX1-ai-review.yaml
  rows:
  - go_id: GO:0004760
    go_label: L-serine:pyruvate transaminase activity
    family: PTHR21152
    ibd_node: PTN000475663
    tree_reading: >-
      IBD at the family root PTN000475663 (157 leaves) with five seeds. Human AGXT (P21549), rat Agxt, fly
      and Thermotoga TM_1400 (Q9X1C0) are in the child PTN000475681 (64 leaves). Yeast AGX1 is in the other
      child PTN009044129 (93 leaves), inside the fungal clade PTN001080485 (11 leaves). The one seed on the
      target side is Arabidopsis AGT1 (Q56YA5), which joins the AGX1 lineage at PTN002501494 (80 leaves).
      PAINT already records a loss of this term (and of alanine:glyoxylate transaminase activity) at
      PTN002326790 inside PTN009044129, on a branch that does not hold AGX1.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Arabidopsis AGT1 Q56YA5 has IDA PMID:11309139 (TAIR) and EXP
      PMID:23098902 (UniProt); yeast AGX1 P43567 has only the IBA.
    - >-
      publications/PMID_16226833.md (abstract only) states that YFL030w is an alanine:glyoxylate
      aminotransferase highly specific for its amino donor and acceptor substrates. The substrate panel is
      in the full text, which was not read.
    - interpro/panther/PTHR21152/PTHR21152-review.yaml assesses this node and term as UNRESOLVED.
    review_edited: false
    notes: >-
      The node is seeded on both sides of the root, so depth is not the ground. The call rests on the
      authors' statement about the yeast enzyme itself, which argues against the serine:pyruvate reaction
      without showing the assay; that is doubt, not loss, and the existing reason says so and names the
      node. The serine and pyruvate rates from the 2005 paper's substrate table would settle it; if they are
      at background, the row becomes a removal with a loss on the fungal clade PTN001080485.
- gene_file: genes/yeast/RIB2/RIB2-ai-review.yaml
  rows:
  - go_id: GO:0000455
    go_label: enzyme-directed rRNA pseudouridine synthesis
    family: PTHR21600
    ibd_node: PTN002727951
    tree_reading: >-
      IBD at the family root PTN002727951 (701 leaves) with eight seeds. E. coli RluE and RluF are in the
      child PTN000492312 (44 leaves) and RsuA in the child PTN004550285 (18 leaves). On the target side
      (PTN008577970, 584 leaves) E. coli RluA, RluC and RluD are in PTN008370768 (147 leaves) and yeast Pus5
      in PTN004550368 (94 leaves, joining at PTN008577971). The eighth seed, yeast Pus9 (Q12069), is the
      sister leaf of RIB2 in the two-leaf node PTN000046941, inside the fungal clade PTN000824406 (19
      leaves) that is sister to the animal RPUSD2 clade under PTN000046898 (53 leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008370768
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Pus9 Q12069 has IDA PMID:25219674 (UniProt) on GO:0000455; RIB2 Q12362
      has only the IBA.
    - >-
      QuickGO by reference PMID:25219674. UniProt gives GO:0000455 by IDA to Pus5 and Pus9 from this paper,
      next to tRNA pseudouridine(32) synthase activity (EXP) for Pus9.
    - >-
      publications/PMID_25219674.md (full text cached, supplementary tables not). The main text names Pus9
      six times; the only site it assigns to Pus9 is position 32 of mitochondrial aspartate tRNA, and the
      only enzyme-directed rRNA site it names is the Pus5 site in mitochondrial 21S rRNA.
    - interpro/panther/PTHR21600/PTHR21600-review.yaml assesses the node TOO_DEEP for this term.
    review_edited: false
    notes: >-
      Kept as over-annotated. The rRNA enzymes are in clades away from RIB2, and the one seed next to it,
      Pus9, looks like a seed on the wrong term, since the main text of its paper gives Pus9 a tRNA site and
      no rRNA site. That is recorded as a query on the UniProt Pus9 row and not as a confirmed defect,
      because the supplementary site tables were not read. Human RPUSD2 in batch H10 was moved to REMOVE on
      knockout profiling of the human enzyme; nothing comparable profiles rRNA in a rib2 mutant, so RIB2
      stays short of removal. The IBD should move to the clades with rRNA seeds, the largest being
      PTN008370768 (RluA, RluC, RluD), with separate placements at PTN000492312, PTN004550285 and
      PTN004550368. The existing reason names the seed groups and the tRNA specificity of Rib2 and is
      quoted by the family review, so the file was left alone.
- gene_file: genes/yeast/SPA2/SPA2-ai-review.yaml
  rows:
  - go_id: GO:0120105
    go_label: mitotic actomyosin contractile ring, intermediate layer
    family: PTHR21601
    ibd_node: PTN004550576
    tree_reading: &spa2_tree >-
      IBD at the family root PTN004550576 (23 leaves, 19 species) with one seed, S. pombe spa2 (O42869,
      PomBase:SPAC3G9.05), in the two-leaf Schizosaccharomyces node PTN008578053. S. cerevisiae SPA2 and
      SPH1 form the two-leaf node PTN000492373 inside PTN000492371 (10 leaves); the seed clade and
      PTN000492371 join at PTN000492370 (12 leaves). The root also covers a fly, a choanoflagellate and the
      Paramecium and Chlamydomonas clade PTN008578055 (4 leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &spa2_fix
      paint_action: MOVE_IBD
      target_node_id: PTN008578053
    evidence_checked:
    - >-
      QuickGO by accession and GO id. S. pombe spa2 O42869 has is_active_in IDA PMID:28914606 (PomBase);
      S. cerevisiae SPA2 P23201 has only the IBA.
    - The row quotes PMID:29601579 on budding-yeast Spa2 at the cleavage site; quotes left as they are.
    review_edited: false
    notes: >-
      The existing reason was written against the tree in the removal pass and states the node, the seed
      clade and the sister clade correctly. Budding-yeast Spa2 reaches the cleavage site and binds Hof1 and
      Cyk3 but does not constrict with Myo1, and the budding-yeast ring has not been resolved into layers,
      so the sublayer claim is unsupported and not contradicted.
- gene_file: genes/yeast/SPH1/SPH1-ai-review.yaml
  rows:
  - go_id: GO:0005078
    go_label: MAP kinase scaffold activity
    family: PTHR21601
    ibd_node: PTN004550576
    tree_reading: >-
      IBD at the family root PTN004550576 (23 leaves) with one seed, S. cerevisiae SPA2 (P23201,
      SGD:S000003944), which is the sister leaf of SPH1 in the two-leaf node PTN000492373. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. SPA2 P23201 has IDA and IMP PMID:12361575 (SGD); SPH1 Q06160 has only
      the IBA.
    - >-
      The row quotes PMID:23924898 (sph1 deletion does not change Slt2 or Mkk1 localisation at bud tips,
      while spa2 and pea2 deletions do) and PMID:9443897 (two-hybrid binding of Mkk1, Mkk2 and Ste7).
    review_edited: false
    notes: >-
      The seed is the target's own paralog, so the node cannot be faulted for SPH1 on placement. The call
      rests on a direct test on the target, where tethering of the MAPK module was looked for and not
      found; with Spa2 present in the sph1 mutant this is doubt and not proof of loss, so no PAINT change
      follows. The root placement is a separate matter for the non-fungal members. A test of Slt2 and Mkk1
      localisation in spa2 deletion cells that express extra Sph1 would settle it.
  - go_id: GO:0120105
    go_label: mitotic actomyosin contractile ring, intermediate layer
    family: PTHR21601
    ibd_node: PTN004550576
    tree_reading: *spa2_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *spa2_fix
    evidence_checked:
    - QuickGO. S. pombe spa2 O42869 is_active_in IDA PMID:28914606 (PomBase) is the only seed row.
    - The row quotes PMID:9443897 for Sph1 at the bud neck before cytokinesis.
    review_edited: false
    notes: Same node and ground as SPA2; the reason is node-aware and consistent with the SPA2 review.
- gene_file: genes/yeast/SBP1/SBP1-ai-review.yaml
  rows:
  - go_id: GO:0006364
    go_label: rRNA processing
    family: PTHR23003
    ibd_node: PTN000543777
    tree_reading: >-
      IBD at PTN000543777 (107 leaves, 48 species) with two seeds. Zebrafish nucleolin (F1R6L6, leaf
      PTN000610795, ZFIN:ZDB-GENE-030131-6986) is in the animal child clade PTN009058375 (64 leaves), in
      the 23-leaf node PTN002744330 that otherwise holds hnRNP M. Yeast MRD1 (Q06106, SGD:S000006316) is in
      the fungal child clade PTN008587029 (43 leaves) with SBP1, in the three-leaf S. cerevisiae node
      PTN000543858 beside HRB1 and GBP2; MRD1 and SBP1 join at PTN009058392 (13 leaves). SBP1 pairs with
      RNP1 at PTN009058393. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000543777
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. MRD1 Q06106 has IMP PMID:11884397 (SGD) on three
      rRNA cleavage terms under GO:0006364; SBP1 P10080 and RNP1 P32385 have only the IBA.
    - >-
      QuickGO by taxon 7955 and GO id. Zebrafish nucleolin F1R6L6 has IMP PMID:24077883 on GO:0006364; the
      ZFIN gene page for ZDB-GENE-030131-6986 is titled nucleolin.
    - >-
      The row quotes PMID:2121740, where SSB-1 was found in a nucleolar snRNP with snR10 and its
      involvement in rRNA processing was inferred from that association.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier text said MRD1 was absent from the family member
      table and described the seeds as other RRM-family evidence; MRD1 is a leaf of this tree and sits in
      SBP1's own 13-leaf clade. With that corrected the call still holds on node depth. Each seed is a
      dedicated ribosome biogenesis factor that the tree places as a single leaf among mRNA-binding
      proteins (GBP2 and HRB1 beside MRD1, hnRNP M beside nucleolin), so there is no seeded clade to move
      the IBD to and the node should carry no IBD for this term. SBP1's own nucleolar snRNP association is
      suggestive and unconfirmed, which is why the row is not a removal. A pre-rRNA processing analysis of
      an sbp1 deletion strain would settle it.
- gene_file: genes/yeast/JIP4/JIP4-ai-review.yaml
  rows:
  - go_id: GO:0005681
    go_label: spliceosomal complex
    family: PTHR23148
    ibd_node: PTN000567596
    tree_reading: &jip4_tree >-
      IBD at the family root PTN000567596 (108 leaves, 80 species). The root has children PTN000567597 (49
      leaves, target here) and PTN007737720 (59 leaves, plants and protists, no seed). Inside the target's
      child, the animal SRRM1 clade PTN000567599 (36 leaves) holds every seed (human SRRM1, mouse Srrm1,
      fly Srrm1) and is sister to the fungal clade PTN001139592 (9 leaves, JIP4 here) under PTN000567598
      (45 leaves). No loss recorded for either term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &jip4_fix
      paint_action: MOVE_IBD
      target_node_id: PTN000567599
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human SRRM1 Q8IYB3 has IPI PMID:39068178
      (ComplexPortal) and IDA PMID:11991638 on a catalytic step 2 spliceosome term; mouse Srrm1 Q52KI8 has
      IDA PMID:11555636 (MGI). JIP4 Q03361 has only the IBA.
    - >-
      genes/yeast/JIP4/JIP4-uniprot.txt lists Pfam JIP4_N and JIP4_helical and the InterPro
      Ser/Arg_repetitive_matrix family, and no PWI domain entry.
    review_edited: false
    notes: >-
      All seeds are animal SRRM1 proteins and the IBD sits two nodes above them at the family root. JIP4
      is in the fungal sister clade and lacks the PWI domain through which SRm160 acts, and it is not among
      the purified yeast spliceosome components, so the doubt is about a branch with no evidence and a
      different domain make-up, not a shown loss. The existing reason names the node, the seeds and the
      domain difference correctly.
  - go_id: GO:0048024
    go_label: regulation of mRNA splicing, via spliceosome
    family: PTHR23148
    ibd_node: PTN000567596
    tree_reading: *jip4_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *jip4_fix
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Fly Srrm1 Q9VU43 (FB:FBgn0036340) has IDA
      PMID:28801530 (FlyBase) on GO:0000381, regulation of alternative mRNA splicing, the single seed.
    review_edited: false
    notes: Same node and ground as the spliceosomal complex row; one fly seed in the animal clade.
- gene_file: genes/yeast/ADK2/ADK2-ai-review.yaml
  rows:
  - go_id: GO:0009142
    go_label: nucleoside triphosphate biosynthetic process
    family: PTHR23359
    ibd_node: PTN008598552
    tree_reading: >-
      IBD at PTN008598552 (97 leaves, 55 species), the AK3 and AK4 node of the 1042-leaf adenylate kinase
      family, with one seed, rat Ak3 (RGD:619885, P29411). Children are PTN002360963 (88 leaves, animal
      AK3 and AK4 and the fungal clade with ADK2) and a protist clade PTN008598560 (9 leaves). The same node
      carries IBDs for nucleoside triphosphate adenylate kinase activity and AMP metabolic process. No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN008598552
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Rat Ak3 P29411 has IDA PMID:5484813 (RGD) on
      GO:0006756 AMP phosphorylation, not on GO:0009142; rat Ak4 Q9WUS0 and yeast ADK2 P26364 have only the
      IBA.
    - >-
      QuickGO ontology paths. GO:0006756 AMP phosphorylation is_a GO:0006754 ATP biosynthetic process is_a
      GO:0009142, which is how the seed reaches the IBD term.
    review_edited: false
    notes: >-
      The seed row is an enzyme assay annotated to AMP phosphorylation, which is what a GTP:AMP
      phosphotransferase does (AMP to ADP, with GTP to GDP). The IBD takes an ancestor of that term that
      says a nucleoside triphosphate is made; the reaction consumes one and makes two diphosphates, so the
      claim comes from the ontology path and not from the experiment. The existing reason states this for
      the reaction. AMP metabolic process at the same node already carries the supported process.
- gene_file: genes/yeast/KDX1/KDX1-ai-review.yaml
  rows:
  - go_id: GO:0051726
    go_label: regulation of cell cycle
    family: PTHR24056
    ibd_node: PTN001172579
    tree_reading: &kdx1_tree >-
      IBD at PTN001172579 (24 leaves, 15 species), the fungal Cdc28/Cdc2 node of the 2533-leaf CDK family
      PTHR24056. Children are PTN001172585 (23 leaves, target and all seeds) and a single Batrachochytrium
      leaf. The KDX1 leaf PTN000623199 is paired with CDC28 (P00546) at PTN007766994 (2 leaves, 1 species).
      The lineage above carries the CDK activity and CDK holoenzyme IBDs at PTN000623980 and G2/M
      transition at PTN000623979, which this review already removes for KDX1. No loss on the KDX1 leaf.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix: &kdx1_fix
      paint_action: ADD_IRD
      target_node_id: PTN000623199
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Seeds are CDKs or their activating kinase, for
      example Candida CDC28 P43063 IGI PMID:7830719 on GO:0051726, S. pombe csk1 P36615 EXP PMID:10226032
      on GO:0010971, A. nidulans nimX Q00646 IMP PMID:7962194; KDX1 P36005 has only IBA rows.
    - >-
      genes/yeast/KDX1/KDX1-uniprot.txt cross-references PANTHER PTHR24055 MITOGEN-ACTIVATED PROTEIN KINASE,
      not the CDK family. The review's GO:0004693 row documents the pseudokinase evidence.
    - >-
      projects/IBA_REVIEW/rereview-2026-11-21/batches/batch-N05.yaml upheld removal of the three sibling
      IBAs (GO:0000307, GO:0000086, GO:0004693) on TARGET_LOSS with a loss on the same leaf.
    review_edited: true
    notes: >-
      Moved to REMOVE. The earlier reason rested on a report finding no KDX1 experiment, which is an
      absence argument, and kept the row because SBF, a KDX1 partner, has a G1/S role. That is a property
      of the partner. On the tree the term is the cell-cycle role of the fungal CDK clade, and KDX1 is an
      SLT2-type MAP kinase pseudokinase that the tree misplaces as the sister of CDC28, so the row fails
      for the same reason as the G2/M, CDK activity and CDK complex rows in the same review. History
      record added.
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR24056
    ibd_node: PTN001172579
    tree_reading: *kdx1_tree
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix: *kdx1_fix
    evidence_checked:
    - >-
      QuickGO by accession and GO id. CDC28 P00546 (SGD:S000000364) has IDA PMID:2142620 (SGD) on
      GO:0000082; the other two seeds are S. pombe cdc2 and Candida CDC28.
    - Same UniProt cross-reference and N05 record as the regulation of cell cycle row.
    review_edited: true
    notes: >-
      Moved to REMOVE on the same ground. The G1/S function of the seeds is CDK catalysis at Start, which a
      catalytically inactive MAP kinase paralog cannot carry. Both rows now agree with the G2/M row.
- gene_file: genes/yeast/POF1/POF1-ai-review.yaml
  rows:
  - go_id: GO:0016887
    go_label: ATP hydrolysis activity
    family: PTHR31285
    ibd_node: PTN000778915
    tree_reading: >-
      IBD at the family root PTN000778915 (65 leaves, 58 species) with one seed, SGD:S000000552, which is
      POF1 itself (the treeview seed test compares UniProt accessions and so reports False). The root has
      children PTN000778916 (64 leaves, fungi, plants and protists) and one Methanosarcina leaf. The same
      node carries the nicotinamide-nucleotide adenylyltransferase IBD. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000778915
    evidence_checked:
