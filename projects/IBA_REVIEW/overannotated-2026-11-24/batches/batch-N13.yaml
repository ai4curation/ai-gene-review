genes:
- gene_file: genes/yeast/INM1/INM1-ai-review.yaml
  rows:
  - go_id: GO:0007165
    go_label: signal transduction
    family: PTHR20854
    ibd_node: PTN000465134
    tree_reading: &inm_tree >-
      IBD at the family root PTN000465134 (282 leaves, 130 species) with one seed, human IMPA1 (P29218).
      The root has two children, PTN000465258 (240 leaves, 100 species, animals, plants, fungi and protists) and the bacterial
      SuhB clade PTN000465365 (42 leaves). Human IMPA1 sits in the animal IMPA1 and IMPA2 clade PTN001073901
      (74 leaves); yeast INM1 and INM2 are in the fungal sister clade PTN001073928 (19 leaves), and the two
      join at PTN000465261 (93 leaves). No seed in the fungal clade and no loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &inm_fix
      paint_action: MOVE_IBD
      target_node_id: PTN001073901
    evidence_checked:
    - >-
      QuickGO by accession and GO id (descendants included). Human IMPA1 P29218 carries involved_in IMP
      PMID:1377913 (UniProt) on GO:0007165; yeast INM1 P38710 carries only the IBA. The query shape returned
      the IMP row, so the empty yeast result is real.
    - >-
      PubMed abstract of PMID:1377913 (not in publications/). It reports cDNA cloning of the human and rat
      brain enzyme and characterisation of the recombinant human enzyme, and describes the role of the
      enzyme as providing inositol for resynthesis of phosphatidylinositol. Full text not read, so the seed
      row itself is not disputed here.
    - >-
      interpro/panther/PTHR20854/PTHR20854-review.yaml assesses this node and term as UNRESOLVED and quotes
      the summary of this gene review row.
    review_edited: false
    notes: >-
      The call holds on node depth. One animal seed carries the term to the family root, which covers the
      bacterial SuhB clade and plants as well as fungi. In yeast the two IMPases supply inositol and are
      limiting for IP3 levels (PMID:10096091, PMID:12593845, quoted in the row), which is a metabolic supply
      role and not a relay step, so the row stays over-annotated and is not removed. The written summary
      names the single seed and the role argument and does not misstate the tree; it is quoted by the family
      review, so the file was left alone. The IBD belongs no deeper than the animal clade PTN001073901.
