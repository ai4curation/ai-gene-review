- gene_file: genes/human/IDO1/IDO1-ai-review.yaml
  rows:
  - go_id: GO:0034354
    go_label: "'de novo' NAD+ biosynthetic process from L-tryptophan"
    family: PTHR28657
    ibd_node: PTN002009580
    tree_reading: >-
      IBD at PTN002009580 (64 leaves, 38 species), dated 20181018, with one seed, budding yeast BNA2 (SGD:S000003839).
      Children are PTN002009609 (42 leaves, animal IDO1 and IDO2, target here, no seed) and PTN002009581
      (22 leaves, fungal, holding BNA2). The same node carries IBDs for indoleamine 2,3-dioxygenase activity,
      L-tryptophan catabolic process and cytoplasm. The term is now obsolete in GO. No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002009581
    evidence_checked:
    - >-
      QuickGO ontology service. GO:0034354 is obsolete (comment says it was obsoleted because it represents
      a specific pathway) and lists no replacement. QuickGO annotation queries on the obsolete id return
      nothing, for BNA2 as for any gene, so the seed row could not be read there; the yeast BNA2 review
      in this repository records an IGI row on the term.
    - >-
      PubMed abstract of PMID:30478397, which reports that macrophage NAD+ derives substantially from kynurenine
      pathway metabolism of tryptophan and that innate immune challenge activates the upstream pathway while
      suppressing conversion of quinolinate to NAD+.
    - >-
      interpro/panther/PTHR28657/PTHR28657-review.yaml marks this node SOUND and says IDO1 keeps the term
      as non-core.
    review_edited: false
    notes: >-
      The existing reason names the node and the single fungal seed and gives the divergence (in yeast
      Bna2 is the only entry enzyme of the route, in mammals hepatic TDO2 carries the constitutive flux
      and IDO1 acts in induced, extrahepatic settings). That is a statable NODE_TOO_DEEP ground and the
      row was left. It is a close call. IDO1 does catalyse the first reaction of the route and macrophages
      make NAD+ from tryptophan (PMID:30478397, abstract only, which does not name IDO1), so KEEP_AS_NON_CORE
      would also be defensible if the term were live; with the term obsolete, a kept action has no valid
      target. Other reviews remap this obsolete term to GO:0009435 (HAAO, yeast BNA genes) or accept it
      (KMO, KYNU, AFMID, QPRT), so the pathway genes are not treated uniformly. The family review's statement
      that IDO1 keeps the term as non-core does not match the gene review. For PAINT the record needs re-terming
      in any case because the term is obsolete.
