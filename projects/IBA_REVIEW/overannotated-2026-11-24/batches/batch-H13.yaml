genes:
- gene_file: genes/human/F12/F12-ai-review.yaml
  rows:
  - go_id: GO:0005791
    go_label: rough endoplasmic reticulum
    family: PTHR24264
    ibd_node: PTN002545596
    tree_reading: >-
      IBD at PTN002545596 (36 leaves, 17 species) with one seed, mouse Hgfac (MGI:1859281, Q9R098). The
      node has two children. PTN008611596 (16 leaves) is the F12 clade and holds human F12 (leaf PTN002545599)
      and no seed. PTN008611602 (20 leaves) is the HGFAC clade and holds the seed. No loss is recorded for
      the term on the lineage.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002545596
    evidence_checked:
    - >-
      QuickGO by accession and GO id (descendants included). Mouse Hgfac Q9R098 has located_in IDA PMID:12923239
      (MGI), with a part_of hepatocyte extension; mouse F12 Q80YC5 has only the IBA. The query returned
      hits, so its shape is sound.
    - >-
      The existing review reason, which cites PMID:12923239 Methods, Results and Discussion (immunogold labelling
      of hepatocyte rough ER; antibodies that cannot tell active from precursor HGFA). Not re-read here.
    review_edited: false
    notes: >-
      The existing reason already names the node, the single seed and why a biosynthetic precursor seen
      in the rough ER does not support is_active_in for a secreted protease (pattern 21). The seed also sits
      in the sister clade, so the node is one level above its only seed as well; removing the IBD covers
      both points. The seed row itself (located_in) is a fair observation and is not a source defect.
- gene_file: genes/human/KLK2/KLK2-ai-review.yaml
  rows:
  - go_id: GO:0003073
    go_label: regulation of systemic arterial blood pressure
    family: PTHR24271
    ibd_node: PTN000668785
    tree_reading: >-
      IBD at PTN000668785 (56 leaves, 11 species) with two seeds, mouse Klk1b1 (MGI:892019, P00755) and
      mouse Klk1b26 (MGI:891981, P36369). Children are PTN009089198 (42 leaves, primates and rodents, target
      here) and PTN000668834 (14 leaves, bovine, pig, horse, cat, dog). Inside PTN009089198 the split is
      PTN000668786 (31 leaves, primate KLK1 plus the rodent Klk1 expansion PTN000668800) against PTN008611750
      (11 leaves, the primate KLK2 and KLK3 clade PTN002385819 plus four rat genes). Both seeds are leaves
      of the mouse expansion PTN001956429 (15 leaves) inside PTN000668786. Human KLK2 is in PTN008399278
      (3 leaves) under PTN002385819, a clade with no seed. No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000668786
    evidence_checked:
    - >-
      Alliance API for the two MGI ids (Klk1b1, Klk1b26). QuickGO by GO id with descendants for mouse,
      rat and human kallikreins (253 hits for the term overall, so the query works). Klk1b1 has acts_upstream_of_or_within
      IMP PMID:11226291 (MGI) on GO:0003073; Klk1b26 has acts_upstream_of_or_within IDA PMID:16585392 (MGI)
      on the descendant GO:0002035.
    - >-
      publications/PMID_16585392.md (abstract only), a paper on prorenin-converting enzyme in myocardium.
      PMID:11226291 is not cached and was not read.
    review_edited: false
    notes: >-
      The existing reason states the ground in biological terms (the blood pressure role belongs to KLK1
      and the rodent glandular kallikreins, hK2 is a prostate enzyme acting on seminal zymogens) and does
      not misstate the tree, so it was left. The same over-reach reaches KLK3 (PSA) in the same seedless
      clade PTN008611750, and the carnivore and ungulate clade PTN000668834. MOVE_IBD to PTN000668786 keeps
      the term on KLK1 and the rodent expansion.
- gene_file: genes/human/CYP19A1/CYP19A1-ai-review.yaml
  rows:
  - go_id: GO:0032355
    go_label: response to estradiol
    family: PTHR24291
    ibd_node: PTN002801056
    tree_reading: >-
      IBD at PTN002801056 (30 leaves, 20 species), the aromatase clade, with three seeds. Children are PTN008612342
      (25 leaves, tetrapod CYP19A1, target here, holding the rat seed RGD:2457) and PTN002801066 (5 leaves,
      fish, holding zebrafish cyp19a1a and cyp19a1b, the two ZFIN seeds). The same node carries IBDs for
      aromatase activity, female gonad development and endoplasmic reticulum. No loss is recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002801056
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Cyp19a1 P22443 has involved_in IEP PMID:21115103 (RGD); zebrafish
      cyp19a1a O42145 has acts_upstream_of_or_within IDA PMID:19095286 (ZFIN); zebrafish cyp19a1b A0A8M9PGW6
      has acts_upstream_of_or_within IDA PMID:18041942 and PMID:19095286 (ZFIN).
    - >-
      PubMed abstracts of the three seed papers. PMID:21115103 measures aromatase mRNA and immunoreactivity
      in rat hippocampus after estradiol. PMID:19095286 measures induction of cyp19b and other estrogen-responsive
      transcripts by permethrin enantiomers and estradiol. PMID:18041942 reports that cyp19a1b is itself
      induced by estradiol. None was read in full.
    review_edited: true
    notes: >-
      Action unchanged. The old reason said the term was propagated across the aromatase and P450 group;
      the node is the aromatase clade itself and the target is inside the seeded clade, so the reason was
      rewritten to put the over-reach at the seeds, which record the gene as a transcriptional target
      of estradiol (expression readouts), not the enzyme taking part in a response. Seed rows are a query
      for RGD and ZFIN, since the papers were read as abstracts only.
- gene_file: genes/human/CYP27B1/CYP27B1-ai-review.yaml
  rows:
  - go_id: GO:0042369
    go_label: vitamin D catabolic process
    family: PTHR24291
    ibd_node: PTN001547847
    tree_reading: >-
      IBD at PTN001547847 (13 leaves, 13 species), the CYP27B1 clade, with two seeds, rat Cyp27b1 (RGD:69192)
      and mouse Cyp27b1 (MGI:1098274). Children are PTN008399983 (12 leaves, mammal CYP27B1, holding the
      target and both seeds) and the single lizard leaf PTN001547858. The same node carries IBDs for vitamin
      D3 biosynthetic process and response to vitamin D, and its parent PTN002801025 (16 leaves) carries
      calcidiol 1-monooxygenase activity. No loss is recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001547847
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Mouse Cyp27b1 O35084 has involved_in IDA PMID:9295274 (BHF-UCL); rat
      Cyp27b1 O35132 has involved_in IDA PMID:9333115 (BHF-UCL). QuickGO by reference shows the same two
      papers give each ortholog calcidiol 1-monooxygenase activity (IDA).
    - >-
      PubMed abstracts of PMID:9295274 and PMID:9333115 (the latter cached, abstract only). Both are the
      cloning papers; the assay is expression of the cDNA and detection of 1-alpha,25-dihydroxyvitamin D3
      produced from 25-hydroxyvitamin D3.
    review_edited: true
    notes: >-
      Action unchanged. The old summary said the term was inferred from family members with CYP24A1-type
      activity; the node is the CYP27B1 clade and the seeds are the Cyp27b1 orthologs themselves, so the
      reason was rewritten. The seed rows appear to read consumption of calcidiol as vitamin D catabolism
      (pattern 20 shape), but the papers were read as abstracts only, so this is a query for BHF-UCL, not
      a confirmed defect, and the row is not moved to REMOVE. The IEA row on the same term (Ensembl transfer
      from mouse O35084, itself a seed) keeps the same action and its summary and reason were corrected
      in the same way.
- gene_file: genes/human/CYP39A1/CYP39A1-ai-review.yaml
  rows:
  - go_id: GO:0008395
    go_label: steroid hydroxylase activity
    family: PTHR24304
    ibd_node: PTN001211310
    tree_reading: >-
      IBD at PTN001211310 (82 leaves, 29 species) with seven seeds, human CYP39A1 (the target, Q9NYL5),
      CYP7A1 (P22680) and CYP7B1 (O75881), mouse Cyp39a1, Cyp7b1 and Cyp7a1, and rat Cyp7a1. Children are
      PTN002387346 (73 leaves, animal CYP7A1, CYP7B1 and CYP39A1, holding the target and every seed) and
      PTN001211317 (9 leaves, fungal, no seed). Inside the target clade PAINT also records cholesterol 7-alpha-monooxygenase
      activity at PTN008612934. No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants for Q9NYL5. The target's own experimental row is
      enables GO:0033782 24S-hydroxycholesterol 7-alpha-hydroxylase activity, EXP, PMID:25201972 (UniProt).
      QuickGO ontology service confirms GO:0008395 is an is_a ancestor of GO:0033782.
    - >-
      Alliance API for the MGI and RGD seed ids. interpro/panther/PTHR24304/PTHR24304-review.yaml lists
      this node as UNRESOLVED (outside the fungal branch it reviewed).
    review_edited: true
    notes: >-
      The old reason was that the term is a correct broad ancestor subsumed by a specific term, which is
      not an over-annotation ground. The target is one of its own seeds and the term is true, so the row
      moves to MODIFY with GO:0033782, which the gene already carries with EXP evidence. The fungal clade
      PTN001211317 has no seed for this term; that is a question for those genes, not for this row.
- gene_file: genes/human/ULK3/ULK3-ai-review.yaml
  rows:
  - go_id: GO:0000423
    go_label: mitophagy
    family: PTHR24348
    ibd_node: PTN000681273
    tree_reading: >-
      IBD at PTN000681273 (134 leaves, 53 species) with three seeds. Children are PTN000681274 (119 leaves,
      target here) and PTN004694168 (15 leaves, Entamoeba and Dictyostelium, no seed). Inside PTN000681274,
      PTN001218713 (20 leaves, fungal Atg1) holds the fission yeast atg1 seed, and PTN008614178 (98 leaves)
      splits into PTN002805372 (32 leaves, the ULK3 and fly Aduk clade, target here, no seed) and PTN001967027
      (66 leaves, ULK1, ULK2, STK35 and unc-51), which holds mouse Ulk1 and fly Atg1. The node also carries
      IBDs for reticulophagy, response to starvation and piecemeal microautophagy of the nucleus. No loss
      is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002805372
    evidence_checked:
    - >-
      QuickGO by GO id with descendants, filtered to Atg1 and ULK symbols (179 hits for the term in the
      taxa queried). Mouse Ulk1 O70405 involved_in IMP PMID:21855797 (ParkinsonsUK-UCL); fly Atg1 involved_in
      IMP PMID:36323236 (FlyBase); fission yeast atg1 Q9Y7T4 involved_in IMP PMID:27737912 (PomBase). Human
      ULK3 has only the IBA.
    - >-
      interpro/panther/PTHR24348/PTHR24348-review.yaml marks this node NEEDS_PRUNING and asks for ADD_IRD
      at PTN002805372, the same fix.
    review_edited: false
    notes: >-
      The existing reason names the node, says the seeds are canonical Atg1 and ULK1 kinases, and gives
      the target evidence that keeps this short of removal (PMID:28877478, ULK3 overexpression induces autophagy
      with a reduced mitochondrial network). The seeds bracket the ULK3 clade (fungal Atg1 outside, ULK1
      and fly Atg1 in the sister clade), so a move of the IBD would need two nodes and the loss at PTN002805372
      is the cleaner request. The sibling selective-autophagy IBAs on ULK3 are REMOVE in the review; mitophagy
      differs only by the overexpression result.
- gene_file: genes/human/AURKA/AURKA-ai-review.yaml
  rows:
  - go_id: GO:0032133
    go_label: chromosome passenger complex
    family: PTHR24350
    ibd_node: PTN000681967
    tree_reading: >-
      IBD at PTN000681967 (318 leaves, 101 species) with nine seeds. Children are PTN000681968 (112 leaves,
      opisthokont and amoebozoan Auroras, target here) and PTN007797141 (206 leaves, plants and protists,
      holding the trypanosome seed Q384J7). Inside PTN000681968 the seeds are budding yeast IPL1 and fission
      yeast ark1 (fungal clade PTN001219041), Dictyostelium aurK (PTN000681958), fly aurB and worm air-2
      (PTN002806162), and human AURKB, mouse Aurkb and Xenopus aurkb-a in the vertebrate AURKB and AURKC
      clade PTN002806146 (35 leaves). Human AURKA sits in the vertebrate AURKA clade PTN004696469 (25 leaves,
      no seed), the sister of PTN002806146 under the duplication node PTN000681971 (60 leaves). No loss
      is recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id with descendants, filtered to Aurora symbols (109 hits). AURKB, Aurkb, aurkb-a, aurB,
      air-2, IPL1, ark1, aurK and trypanosome AUK1 all carry part_of IDA or IPI rows; AURKC has TAS. No
      Aurora A carries the term except by IBA.
    - >-
      publications/PMID_19357306.md (abstract only, the source of the INCENP and BIRC5 IPI rows on AURKA).
      It reports that the G198N substitution is what lets Aurora-A join INCENP and survivin.
    - >-
      PubMed abstract of PMID:29187526, which reports that Aurora A associates with INCENP during mitosis
      and that INCENP can drive it to centromeres.
    review_edited: true
    notes: >-
      Action unchanged. The old reason was two UniProt location quotes with no argument, so it was rewritten
      to state the tree and the doubt. The row was not moved to REMOVE because an INCENP-bound pool of Aurora
      A is reported (PMID:29187526), so loss of the association is not shown; it is not accepted because
      CPC membership of wild-type Aurora A is not shown either. If a PAINT curator judges the divergence
      settled, the request would be ADD_IRD at PTN004696469, but doubt alone does not support it. Both
      papers abstract-only.
- gene_file: genes/human/LATS1/LATS1-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR24356
    ibd_node: PTN002390470
    tree_reading: >-
      IBD at PTN002390470 (56 leaves, 35 species) with two seeds, human LATS2 (Q9NRM7) and mouse Lats2 (MGI:1354386).
      Children are PTN001219864 (55 leaves, target here) and a single choanoflagellate leaf PTN001220369.
      Several levels down, PTN002807431 (41 leaves) is the vertebrate duplication, with the LATS2 clade
      PTN004697711 (21 leaves, both seeds) and the LATS1 clade PTN002807436 (20 leaves, target, no seed).
      The node also covers fly wts, worm wts-1 and cnidarian and placozoan leaves. No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004697711
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human LATS2 Q9NRM7 involved_in IDA PMID:12853976 (UniProt); mouse
      Lats2 Q7TSJ6 involved_in IDA PMID:15343267 (UniProt). Human LATS1 O95835 and mouse Lats1 Q8BYR2 have
      only the IBA.
    review_edited: false
    notes: >-
      The existing reason already says the seeds are LATS2 only and gives the LATS1 evidence (mitotic progression
      and the G1 tetraploidy checkpoint, PMID:15122335) that makes the term doubtful for the LATS1 branch
      without showing absence. The IBD is placed at the animal-wide Warts node, five nodes above the LATS2
      clade that holds both seeds (pattern 18). Seed papers were not read.
- gene_file: genes/human/LRIG3/LRIG3-ai-review.yaml
  rows:
  - go_id: GO:0007605
    go_label: sensory perception of sound
    family: PTHR24373
    ibd_node: PTN009094493
    tree_reading: >-
      IBD at PTN009094493 (34 leaves, 16 species) with two seeds, mouse Lrig1 (MGI:107935) and mouse Lrig2
      (MGI:2443718). Children are PTN009094494 (33 leaves, target and both seeds) and one medaka leaf.
      Inside, PTN001555946 (32 leaves) splits into PTN000688154 (12 leaves, LRIG1, holding the Lrig1 seed)
      and PTN001223520 (20 leaves), where the LRIG2 clade PTN000689191 (10 leaves, holding the Lrig2 seed)
      is sister to the LRIG3 clade PTN000689526 (8 leaves, target, no seed). No loss is recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and by GO id with descendants (760 hits for the term overall). Mouse Lrig1 P70193
      and Lrig2 Q52KR2 each have acts_upstream_of_or_within IMP PMID:24086156 (MGI). No Lrig3 carries the
      term except by IBA.
    - >-
      publications/PMID_24086156.md, full text cached and read for every mention of Lrig3 with auditory,
      hearing, ABR or DPOAE. It states that Lrig3 mutant mice exhibit normal auditory responses and that
      no auditory phenotypes were detected in Lrig3 mutant mice (both citing an earlier study), and that
      Lrig1 and Lrig3 double mutants die at or before birth.
    review_edited: true
    notes: >-
      Action unchanged. The old reason said no experiment shows that LRIG3 lacks an auditory role; the seed
      paper itself reports normal hearing in Lrig3 mutants, so the reason was rewritten around that and
      two verbatim quotes were added. Not moved to REMOVE because Lrig1 and Lrig3 are redundant in ear morphogenesis
      and the double mutant cannot be tested, so a normal single mutant is not loss. If MGI or PAINT read
      the single-mutant result as sufficient, the fix would be ADD_IRD at PTN000689526. The primary Lrig3
      knockout paper cited there was not read.
- gene_file: genes/human/LRRC32/LRRC32-ai-review.yaml
  rows:
  - go_id: GO:0038023
    go_label: signaling receptor activity
    family: PTHR24373
    ibd_node: PTN002809265
    tree_reading: >-
      IBD at PTN002809265 (725 leaves, 37 species), the root of the leucine-rich repeat family, with six
      seeds. Human TLR3 and CD180 are in PTN008615505 (227 leaves); human RTN4RL1 and RTN4RL2 and rat Rtn4rl2
      are in PTN002519943 (160 leaves); fly Toll-7 is in PTN009094324 (7 leaves). Human LRRC32 (leaf PTN002551563)
      is in PTN009094411 (158 leaves), the sister of PTN002519943 under PTN009094327 (318 leaves), and no
      seed lies in PTN009094411. PAINT asserts TGF-beta binding for the GARP clade at PTN001555458 (15 leaves).
      No loss is recorded for the term.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008615505
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. TLR3 O15455 has GO:0004888 IDA PMID:12471095 and
      GO:0038187 IDA rows; CD180 Q99467 has GO:0001875 IDA PMID:12714520; RTN4RL1 Q86UN2 and RTN4RL2 Q86UN3
      have GO:0038023 IDA PMID:12694398; rat Rtn4rl2 Q80WD1 has IMP PMID:15673660; fly Toll-7 Q7KIN0 has GO:0004888
      IDA PMID:31088910. LRRC32 Q14392 has only the IBA.
    - >-
      genes/human/LRRC32/LRRC32-uniprot.txt topology lines: signal 1 to 19, extracellular 20 to 627, transmembrane
      628 to 648, cytoplasmic 649 to 662.
    - >-
      projects/IBA_REVIEW/rereview-2026-11-21/batches/batch-H03.yaml, where the same row on LRIG1 and LRIG3
      was upheld as REMOVE on MISPLACED_IBD.
    review_edited: true
    notes: >-
      The old reason already said GARP does not transduce a signal, which is a statement that the term is
      wrong, not that it is over-stated. With the IBD at the family root, no seed in the target's 158-leaf
      clade, a 14-residue cytoplasmic tail and a characterized docking role covered by accepted rows, the
      row moves to REMOVE, consistent with LRIG1 and LRIG3. The move of the IBD needs three nodes, not one.
      PTN008615505 is given for the TLR3 and CD180 seeds (a lower node may fit better); the Nogo receptor-like
      seeds need a node at or below PTN002519943 and Toll-7 a node at or below PTN009094324. Seed papers
      were not read.
- gene_file: genes/human/TLR3/TLR3-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR24373
    ibd_node: PTN001224703
    tree_reading: >-
      IBD at PTN001224703 (676 leaves, 33 species), three nodes below the family root, with 23 seeds. Children
      are PTN009094323 (674 leaves, target here) and a two-leaf sea anemone clade. The seeds are cell-surface
      LRR proteins from many subclades (LRRTM1, LRRTM3, LRRTM4, RTN4RL1, RTN4RL2, LRRC15, GP1BA, LRRC32, LRIG1,
      LINGO1, CD180, ELFN1, ELFN2, VASN, fly Toll-7, worm sma-10) and human TLR3 itself (O15455). The TLR3
      clade is PTN008615554 (11 leaves). PAINT records NOT IRD for plasma membrane at PTN008615507, PTN008615548
      and PTN009094619 inside the same clade. TLR1, TLR2, TLR4, TLR5 and TLR6 are not leaves of this family;
      the only human TLR-type leaves are TLR3 and CD180.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. TLR3 O15455 carries is_active_in IDA PMID:27830702 (UniProt, part_of
      keratinocyte extension), located_in TAS PMID:9435236, and the IBA and an IEA.
    - >-
      Alliance API for the MGI, RGD and WormBase seed ids; treeview member list (800 members) searched
      for human TLR symbols.
    - >-
      The review's existing quotes from PMID:21266579 and PMID:16144834 on endosomal signalling, not re-read.
    review_edited: true
    notes: >-
      Action unchanged. The old reason attributed the IBA to the surface receptors TLR1, TLR2, TLR4, TLR5
      and TLR6 and said the node was not recovered; both statements were wrong for this tree and were replaced.
      TLR3 is one of its own seeds, so the placement is not at fault and the ground is the evidence on TLR3
      that signalling arises from endosomes. This sits close to KEEP_AS_NON_CORE; it stays over-annotated
      because the qualifier is is_active_in and to match the IDA and IEA rows on the term, which were not
      changed (the TAS located_in row is KEEP_AS_NON_CORE, a pre-existing consistency warning). The review's
      treatment of the IDA row rests on a cached text that lacks the localisation statement and may deserve
      a second look. A PAINT curator who agrees could add an IRD at PTN008615554, as was done for three
      other clades, but doubt alone does not support the request.
- gene_file: genes/human/IRAK3/IRAK3-ai-review.yaml
  rows:
  - go_id: GO:0008063
    go_label: Toll signaling pathway
    family: PTHR24419
    ibd_node: PTN000701353
    tree_reading: >-
      IBD at PTN000701353 (73 leaves, 28 species) with two seeds, fly pll (FBgn0010441) and fly tub (FBgn0003882).
      Children are PTN000701378 (62 leaves, vertebrate IRAK1, IRAK2, IRAK3 and IRAK4, target here, no seed)
      and PTN000701449 (11 leaves, arthropod and nematode Pelle, Tube and pik-1, both seeds). The same node
      carries IBDs for lipopolysaccharide-mediated signaling, cytokine-mediated signaling and plasma membrane.
      No loss is recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000701449
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Fly pll Q05652 has 11 experimental involved_in rows (IMP, IGI, FlyBase)
      and tub P22812 has 8. QuickGO for the exact term in human and mouse returns 28 rows, all IBA, IEA or
      ISO on IRAK1 to IRAK4, MYD88, TRAF3 and PALM3 except one IMP on PALM3, so no vertebrate IRAK carries
      the term from an experiment.
    - >-
      QuickGO ontology service for the definition of GO:0008063 (signals initiated by a ligand binding
      to the receptor Toll).
    - >-
      The same row in genes/human/IRAK1, IRAK2, IRAK4 and MYD88, all MODIFY to GO:0002755.
    review_edited: true
    notes: >-
      The old reason accepted the ancestral role and objected only to the fly-specific term, which is a
      case for a lateral MODIFY, not for over-annotation. Changed to MODIFY with GO:0002755, which IRAK3
      carries by TAS (ACCEPT), matching IRAK1, IRAK2, IRAK4 and MYD88. The mouse Irak3 and horse IRAK3 reviews
      still mark the same row as over-annotated and could be aligned by their own reviewers. For PAINT the
