genes:
- gene_file: genes/ECOLI/prpC/prpC-ai-review.yaml
  rows:
  - go_id: GO:0006099
    go_label: tricarboxylic acid cycle
    family: PTHR11739
    ibd_node: PTN000201223
    tree_reading: >-
      IBD at the family root PTN000201223 (270 leaves, 123 species) with four seeds, S. cerevisiae CIT1
      (SGD:S000005284) and CIT3 (SGD:S000006205), S. pombe cit1 (PomBase:SPAC6C3.04) and P. aeruginosa PrpC
      (Q9I5E3). The root has children PTN000201301 (249 leaves, holds the target and all four seeds) and
      PTN000201309 (21 leaves, 13 species, bacterial plus Halobacterium, no seed). The target
      (leaf PTN000201330) and the Pseudomonas seed join at PTN000201328 (7 leaves) inside the 2-methylcitrate
      synthase clade PTN002621568 (12 leaves), which carries its own IBDs for propionate catabolic process and
      2-methylcitrate synthase activity. The yeast seeds join at PTN000201222 (242 leaves). PAINT records a
      NOT IRD for mitochondrial matrix at PTN001713951 (8 leaves) on the target lineage; no loss for this term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id. Q9I5E3 carries GO:0006099 by IDA from PMID:7626013 (PseudoCAP) plus IBA and IEA; P31660
      (target) has only the IBA and an IEA; CIT1 P00890 has IMP PMID:2661555. The query shape returns hits.
    - >-
      publications/PMID_7626013.md (abstract only). Purification of the large hexameric (CSI) and small
      dimeric (CSII) citrate synthases of P. aeruginosa, shown to differ kinetically, immunologically and in
      regulation. No test of the small enzyme's part in the cycle.
    - >-
      The review's quotes from PMID:9579066 (the 2-methylcitrate synthase is induced during growth on
      propionate while the hexameric citrate synthase is constitutive) and PMID:8508809 (the dimeric enzyme
      of a gltA revertant).
    - interpro/panther/PTHR11739/PTHR11739-review.yaml assesses this node record UNRESOLVED.
    review_edited: true
    notes: >-
      Action unchanged. The target is inside the seeded clade and one seed is its own ortholog, so the
      ground is not placement. It is the evidence on E. coli PrpC, a propionate-induced enzyme with citrate
      synthase as a minor activity that can stand in for GltA only in a gltA revertant, together with the
      fact that the in-clade seed row is an isoenzyme purification. The earlier reason and comment spoke of
      eukaryotic donors only and left the Pseudomonas PrpC seed out, so both were extended with the node, the
      seeds and what that seed measured. Same ground as S. cerevisiae CIT2 in batch N12 (conditional
      contribution, doubt and not loss). The IEA row on the term keeps the same action. What would settle it
      is the share of citrate made by PrpC in wild-type cells growing on propionate. History record added.
- gene_file: genes/ECOLI/metB/metB-ai-review.yaml
  rows:
  - go_id: GO:0004123
    go_label: cystathionine gamma-lyase activity
    family: PTHR11808
    ibd_node: PTN000211591
    tree_reading: >-
      IBD at PTN000211591 (109 leaves, 74 species) with six seeds. Its children are PTN008527405 (87 leaves,
      eukaryotic cystathionine gamma-lyases, holding human CTH P32929, mouse Cth, yeast CYS3 and Aspergillus
      C8VM61, with a NOT IRD for the term at the fungal node PTN000928751) and PTN001720865 (22 leaves,
      bacterial). Inside the bacterial clade the cystathionine gamma-synthase IBD sits at PTN000211711 (19
      leaves), which splits into PTN007540728 (7 leaves, Chloroflexus, actinobacteria and Firmicutes, holding
      the two bacterial seeds M. tuberculosis MetB P9WGB7 and B. subtilis MccB O05394) and PTN001720873 (11
      leaves, proteobacterial MetB, holding the target leaf PTN001370847 and no seed).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001720873
    evidence_checked:
    - >-
      QuickGO by GO id. P9WGB7 enables GO:0004123 IDA PMID:15576367 (MTBBASE); O05394 IDA PMID:17056751; human
      CTH three IDA rows; P00935 (target) only the IBA. The query shape returns hits.
    - >-
      The review's quotes from PMID:19370061 (gamma-synthase and beta-lyase make up bacterial
      transsulfuration, gamma-lyase is the second enzyme of the fungal and animal reverse pathway) and
      PMID:14503880 (the competing gamma-elimination of E. coli CGS acts on O-succinylhomoserine).
    - >-
      interpro/panther/PTHR11808/PTHR11808-review.yaml assesses the node NEEDS_PRUNING and proposes ADD_IRD at
      PTN001720873.
    review_edited: false
    notes: >-
      The seeds are sound and sit in the eukaryotic clade and in the Gram-positive and actinobacterial half
      of the bacterial clade. The target's proteobacterial MetB clade has no seed, and E. coli has no reverse
      transsulfuration and degrades cystathionine with the beta-lyase MetC. No measurement of cystathionine
      gamma-cleavage by E. coli MetB was found, so this is doubt about an unseeded branch and not shown loss,
      which is why the row stays an over-annotation while the sibling L-cysteine biosynthesis row is a
      removal. The existing reason names the node, the seeds and the branch, so the file was left alone. The
      seeds lie in two separate clades, so no single MOVE_IBD covers them; the fix given is the family
      review's.
- gene_file: genes/ECOLI/paaF/paaF-ai-review.yaml
  rows:
  - go_id: GO:0006635
    go_label: fatty acid beta-oxidation
    family: PTHR11941
    ibd_node: PTN000941828
    tree_reading: >-
      IBD at the family root PTN000941828 (560 leaves, 115 species, the whole crotonase family) with four
      seeds, human ECHS1 (P30084), rat Echs1 (RGD:69330), mouse Eci1 (MGI:94871) and RGD:61892. The root has
      children PTN000235142 (487 leaves, holds the target) and PTN001733184 (73 leaves, bacterial, including
      E. coli PaaG). The target is a single leaf (PTN000235251) attached directly to PTN008986584 (477
      leaves), beside Chloroflexus Caur_0101, M. tuberculosis EchA8 and the 474-leaf clade PTN000234547 that
      holds ECHS1 (in PTN000235143, 88 leaves). PAINT records an IRD loss of the term on a Drosophila branch
      (PTN000234849, from the family review).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000235143
    evidence_checked:
    - >-
      QuickGO by GO id. Human ECHS1 P30084 involved_in GO:0006635 IDA PMID:26251176 plus TAS rows; P76082
      (target) only the IBA. The query shape returns hits.
    - >-
      The review's quotes from PMID:22961985 (the PaaF and PaaG active sites are adapted to the Paa pathway
      intermediates, and no PaaF, PaaH, PaaJ complex equivalent to the beta-oxidation complex was found).
    - >-
      interpro/panther/PTHR11941/PTHR11941-review.yaml assesses the node TOO_DEEP and quotes the same PaaF
      paper.
    review_edited: false
    notes: >-
      Same record, ground and fix as human AUH in batch H06. Four mammalian seeds carry a process to the
      root of a 560-leaf superfamily, and the target is a lone bacterial leaf outside the ECHS1 clade with
      direct evidence that it serves phenylacetate catabolism. The move needs a second target for the Eci1
      seed (PTN000234959 in batch H06). The existing reason gives the target evidence and says why it is not
      a removal (crotonase hydratases often take short acyl-CoAs in vitro). It does not say that the node is
      the family root, but it does not misstate the tree, so the file was left alone.
- gene_file: genes/ECOLI/nadD/nadD-ai-review.yaml
  rows:
  - go_id: GO:0000309
    go_label: nicotinamide-nucleotide adenylyltransferase activity
    family: PTHR12039
    ibd_node: PTN000247701
    tree_reading: >-
      IBD at the family root PTN000247701 (184 leaves, 113 species) with ten seeds, all eukaryotic (human
      NMNAT1, NMNAT2 and NMNAT3, three mouse genes, two yeast genes, fly and Arabidopsis). The root has
      children PTN000247702 (166 leaves, eukaryotic NMNATs, holds every seed) and PTN000247818 (18 leaves,
      18 species, bacterial NadD, holds the target leaf PTN001382211 and no seed). The root also carries the
      nicotinate-nucleotide adenylyltransferase IBD (7 seeds). No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000247702
    evidence_checked:
    - >-
      QuickGO by GO id. Human NMNAT1 Q9HAN9 enables GO:0000309 by IDA (PMID:11027696, PMID:16118205) and EXP
      (PMID:17402747); P0A752 (target) only the IBA. The query shape returns hits.
    - >-
      The review's quote from PMID:10894752, that E. coli NadD adenylylates nicotinate mononucleotide at
      least 20 times faster than nicotinamide mononucleotide.
    - interpro/panther/PTHR12039/PTHR12039-review.yaml was checked; it does not ask for a change to this record.
    review_edited: false
    notes: >-
      All ten seeds are in the eukaryotic child clade and the bacterial NadD clade has none, across the
      oldest split in the family. The direct kinetics on the target give the reason to doubt, a measured
      activity at least 20-fold below the physiological one, which is weak activity and not loss, so the row
      is an over-annotation and not a removal. The existing reason names the node, where the seeds are and
      the kinetics. Left alone.
- gene_file: genes/ECOLI/hscA/hscA-ai-review.yaml
  rows:
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR19375
    ibd_node: PTN000452648
    tree_reading: &hsca_tree >-
      IBD at PTN000452648 (1707 leaves, 138 species, all of Hsp70 below the family root PTN009039104). Its
      children are PTN000452649 (1542 leaves, mostly eukaryotic Hsp70s) and PTN009039410 (165 leaves,
      bacterial DnaK, plastid Hsp70, HscC and HscA). The target (leaf PTN000453433) is in the HscA clade
      PTN002714305 (8 leaves, 8 proteobacteria), sister to PTN000452642 (18 leaves, DnaK and YegD) under
      PTN000751549 (26 leaves). The eight protein refolding seeds are six human Hsp70s (P0DMV8, P0DMV9, P11142, P17066,
      P34931, P54652) and two yeast genes (SGD:S000003806, SGD:S000000004), none of them in the HscA clade. The eighteen protein folding
      chaperone seeds are animal and fungal Hsp70s plus E. coli DnaK (P0A6Y8), which is in PTN000452642, the
      sister of the HscA clade. No loss recorded for either term on the target lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked: &hsca_ev
    - >-
      QuickGO by GO id. HSPA8 P11142 involved_in GO:0042026 IDA (PMID:21231916, PMID:25719862); DnaK P0A6Y8
      enables GO:0044183 IDA PMID:10380927 (EcoCyc); HscA P0A6Z1 has only the IBA for both terms. The query
      shape returns hits.
    - >-
      The review's quotes on the target. PMID:9852006 (Hsc66 suppressed aggregation of rhodanese and citrate
      synthase), the module audit note that Hsc66 could not assist refolding of denatured luciferase where the
      DnaK system could, and PMID:22782893 (HscA binds and stabilizes the disordered state of IscU and acts
      as a holdase).
    - >-
      interpro/panther/PTHR19375/PTHR19375-review.yaml treats HscA (SF176) as a specialized IscU-directed
      ATPase and says no HscA-specific loss is asserted.
    review_edited: false
    notes: >-
      The node is soundly seeded and the target is inside it, so placement is not the ground. The ground is
      direct evidence on Hsc66, a negative luciferase refolding assay in which the DnaK system was positive,
      and holdase behaviour toward its one physiological client IscU. That is doubt on the target and its
      specialized subfamily, short of loss, as the reason itself says. Same call as yeast SSQ1, the
      mitochondrial Fe-S cluster Hsp70, in batch N12. The reason is built on the target experiments and the
      comment names the node. Left alone. A refolding assay with an Isc-pathway client, with and without
      HscB, would settle it.
  - go_id: GO:0044183
    go_label: protein folding chaperone
    family: PTHR19375
    ibd_node: PTN000452648
    tree_reading: *hsca_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked: *hsca_ev
    review_edited: false
    notes: >-
      Same ground as the protein refolding row. The closest seed is E. coli DnaK in the sister clade
      PTN000452642, and the head-to-head assay cited by the review is the one in which DnaK reactivated
      luciferase and Hsc66 did not. The IEA protein folding row carries the same action. GO has no holdase
      term to move the row to, so no replacement is offered. Left alone.
- gene_file: genes/ECOLI/rfbC/rfbC-ai-review.yaml
  rows:
  - go_id: GO:0000271
    go_label: polysaccharide biosynthetic process
    family: PTHR21047
    ibd_node: PTN000471580
    tree_reading: >-
      IBD at the family root PTN000471580 (38 leaves, 30 species) with three seeds, M. tuberculosis RmlC
      (P9WH11), P. aeruginosa RmlC (Q9HU21) and S. typhimurium RfbC (P26394). The root has children
      PTN000471594 (25 leaves, 21 species, holds all three seeds and the target leaf PTN001464550, and
      carries its own IBDs for the epimerase activity and dTDP-rhamnose biosynthetic process) and
      PTN000471581 (13 leaves, archaea, nematodes, Trichomonas, Listeria, no seed). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000471580
    evidence_checked:
    - >-
      QuickGO by GO id with descendants. P9WH11 IGI PMID:16472764 (UniProt, with A0QSK5); Q9HU21 IDA
      PMID:17046787 (UniProt) and, on descendants, IDA GO:0009103 and IDA GO:0009244 PMID:11065359; P26394 IDA
      PMID:17046787 for GO:0000271 and GO:0009103; P37745 (target) ISS from P26394 plus the IBA.
    - >-
      Batch N21 (PSEAE rmlC, same node) read PMID:17046787 as an abstract, a structure and mechanism study of
      the epimerase reaction.
    - >-
      interpro/panther/PTHR21047/PTHR21047-review.yaml assesses this IBD WRONG_NODE and asks for it to be
      withdrawn.
    review_edited: false
    notes: >-
      Same record, ground and fix as P. aeruginosa rmlC in batch N21. The target is inside the seeded clade,
      so the over-annotation starts at the seeds. They are enzymology and complementation rows on an
      epimerase that makes the dTDP-rhamnose donor, annotated to the polymer process. Making the donor is
      not a step of polymer formation, and dTDP-rhamnose biosynthetic process is accepted as the process the
      enzyme performs. The ISS row on the same term carries the same action. The reason and comment name the
      node and the seed-side ground. Left alone. The seed papers were not read in full, so REMOVE_IBD is a
      request to re-read the seed rows.
- gene_file: genes/ECOLI/tolC/tolC-ai-review.yaml
  rows:
  - go_id: GO:0015288
    go_label: porin activity
    family: PTHR30026
    ibd_node: PTN002011530
    tree_reading: >-
      IBD at the family root PTN002011530 (75 leaves, 24 species) with one seed, the target itself (P02930).
      The root has children PTN001574482 (74 leaves, bacterial outer membrane factors, holds the target leaf
      PTN000768922) and a single Trichoplax leaf PTN002011532. The same root carries IBDs for efflux pump
      complex (2 seeds) and efflux transmembrane transporter activity (1 seed). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002011530
    evidence_checked:
    - >-
      QuickGO by GO id. P02930 enables GO:0015288 IDA PMID:7688606 (EcoCyc) plus the IBA, so the target is
      the only seed and the IBA rests on the review's own IDA row.
    - >-
      publications/PMID_7688606.md (abstract only). Purified TolC oligomers in planar lipid bilayers form
      ion-permeable channels of 80 pS in 1 M KCl, against 1500 pS for the general diffusion pores of the E.
      coli outer membrane, with a peptide binding site; the authors conclude TolC acts as an outer membrane
      channel for peptides.
    - >-
      QuickGO term definition of GO:0015288, transfer of substances under 1000 Da across a membrane by a
      beta-barrel protein of the outer membrane.
    review_edited: false
    notes: >-
      The gene is its own and only seed, so the IBA and the IDA row are one judgement, and the review marks
      both the same way. The seed assay is a bilayer conductance measurement that shows a channel and, in
      its own words, one unlike the general diffusion pores; the review reads porin activity as general
      diffusion permeability, which a duct held shut until a partner opens it does not provide, and keeps
      the transport claim on the efflux rows. The reason already says the placement is fine and the
      over-reach is at the seed term. Left alone. REMOVE_IBD follows only if the seed row is moved to a
      channel or efflux term first; a reader who takes the GO definition structurally (any outer membrane
      beta-barrel channel) could keep both rows as non-core, and that is a call on the IDA row, not on the
      tree.
- gene_file: genes/ECOLI/kdpC/kdpC-ai-review.yaml
  rows:
  - go_id: GO:0008556
    go_label: P-type potassium transmembrane transporter activity
    family: PTHR30042
    ibd_node: PTN001247299
    tree_reading: >-
      IBD at the family root PTN001247299 (19 leaves, 19 species) with one seed, the target itself (P03961).
      The root has children PTN004738422 (18 leaves, bacterial KdpC plus one Gossypium sequence, holds the
      target leaf PTN000769312) and the Halobacterium leaf PTN001247300. The root also carries IBDs for
      potassium ion transmembrane transport, plasma membrane and the potassium-transporting ATPase complex.
      No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id. P03961 enables GO:0008556 by IDA from PMID:8499455 and PMID:9789555 (EcoCyc) plus the
      IBA and an IEA.
    - >-
      The review's quotes. PMID:8499455 (ATP-driven potassium uptake by the Kdp-ATPase in vesicles),
      PMID:9789555 (labelling of KdpA and KdpB but not KdpC in the purified complex), PMID:28636601 (K+ moves
      through KdpA and ATP energy is harnessed by KdpB) and PMID:34272288 (KdpC and KdpF as accessory
      subunits that stabilize the partnership).
    - interpro/panther/PTHR30042/PTHR30042-review.yaml assesses this node record SOUND.
    review_edited: false
    notes: >-
      The gene is its own seed and the two IDA rows carry the same action as the IBA. The seed rows are
      assays of the assembled KdpFABC pump recorded with enables on an accessory subunit that neither forms
      the ion path nor hydrolyses ATP. The review keeps the activity as contributes_to in core_functions and
      files a WRONG_QUALIFIER source defect on each row. The reason is node-aware and says the dispute is
      the relation, not membership of the lineage. Left alone. The wanted fix is the contributes_to
      qualifier on the seed rows and on the IBD, which is not one of the PAINT actions; removing the IBD
      would lose a true contribution, so none is requested.
- gene_file: genes/ECOLI/nrdG/nrdG-ai-review.yaml
  rows:
  - go_id: GO:0015949
    go_label: nucleobase-containing small molecule interconversion
    family: PTHR30352
    ibd_node: PTN001576428
    tree_reading: >-
      IBD at PTN001576428 (16 leaves, 15 species, the NrdG clade) with one seed, the target itself (P0A9N8).
      Its children are PTN001576430 (7 leaves, gammaproteobacterial NrdG, holds the target leaf
      PTN001576432), PTN002018022 (6 leaves, Firmicutes) and three single leaves (Bacteroides, Fusobacterium,
      Thermotoga). The node also carries the anaerobic ribonucleoside-triphosphate reductase complex IBD; the
      glycyl-radical enzyme activating activity IBD is at the family root PTN001251485 (79 leaves). No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001576428
    evidence_checked:
    - >-
      QuickGO by GO id. P0A9N8 carries GO:0015949 by IMP with acts_upstream_of_or_within from PMID:8954104
      (EcoliWiki) and by NAS from the same paper (ComplexPortal), plus the IBA.
    - >-
      The review's quotes from PMID:8954104 (knock-out mutants of either nrdD or nrdG cannot grow under
      strict anaerobiosis) and PMID:10531327 (protein alpha binds and reduces ribonucleotides, protein beta
      introduces the glycyl radical on protein alpha).
    review_edited: false
    notes: >-
      The gene is its own and only seed. The seed row is a growth phenotype with the upstream qualifier,
      which PAINT restates as involved_in for the clade. NrdG activates the reductase and catalyses no step
      of nucleotide interconversion, so the phenotype shows necessity and not participation. The reason
      names the node and the seed row and says exactly this; the IMP and NAS rows carry the same action.
      Left alone. No family review exists for PTHR30352.
- gene_file: genes/ECOLI/tatC/tatC-ai-review.yaml
  rows:
  - go_id: GO:0009977
    go_label: proton motive force dependent protein transmembrane transporter activity
    family: PTHR30371
    ibd_node: PTN000769484
    tree_reading: >-
      IBD at the family root PTN000769484 (129 leaves, 76 species) with one seed, the target itself (P69423).
      The root has children PTN000769490 (92 leaves, bacterial and plastid TatC, holds the target leaf
      PTN000769502) and PTN001251682 (37 leaves, mitochondrial-genome and archaeal TatC). The root also
      carries IBDs for protein transport by the Tat complex and the TAT protein transport complex. No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO id. P69423 enables GO:0009977 IDA PMID:11350936 (EcoCyc) plus the IBA.
    - >-
      The review's quote from PMID:11350936 (in vitro Tat transport requires TatABC, an intact membrane
      potential and the twin-arginine motif) and the UniProt function text (TatC with TatB forms the
      receptor for Tat signal peptides).
    - interpro/panther/PTHR30371/PTHR30371-review.yaml assesses this node record SOUND.
    review_edited: false
    notes: &tat_note >-
      The gene is its own seed and its IDA row on the term carries the same action. The seed assay is
      transport by the reconstituted three-subunit system, recorded with enables on one subunit. The review
      keeps the activity as contributes_to in core_functions, gives the subunit its own activity where one
      is known, and files a WRONG_QUALIFIER source defect. The reason names the node and its seed and places
      the dispute on the relation. Left alone. The wanted fix is the contributes_to qualifier on the seed
      row and the IBD, which is not one of the PAINT actions; removing the IBD would lose a true
      contribution, so none is requested. tatA, tatB and tatC are judged the same way in this batch.
- gene_file: genes/ECOLI/ampD/ampD-ai-review.yaml
  rows:
  - go_id: GO:0009276
    go_label: Gram-negative-bacterium-type cell wall
    family: PTHR30417
    ibd_node: PTN002019137
    tree_reading: >-
      IBD at PTN002019137 (18 leaves, 11 species) with three seeds, all from P. aeruginosa. The node has two
      children. PTN001252283 (10 leaves) is the AmiD and AmpDh clade and holds AmpDh2 (Q9HT86), AmpDh3
      (Q9I5D1) and E. coli AmiD. PTN002825391 (8 leaves, 8 species) is the AmpD clade and holds the target
      (leaf PTN000769056) and the third seed, P. aeruginosa AmpD (G3XCW9, leaf PTN002411577); the two join at
      PTN000769052 (7 leaves), and the target's nearest clade is PTN002019142 (3 leaves, E. coli, Salmonella,
      Yersinia). P. aeruginosa and E. coli each have a member in both child clades, so the split is a
      duplication. The amidase activity and peptidoglycan turnover IBDs are at the family root PTN001252273
      (37 leaves). No loss recorded for the term.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001252283
    evidence_checked:
    - >-
      QuickGO by GO id with descendants. Q9HT86 and Q9I5D1 located_in GO:0009276 by IDA from PMID:23510438
      (PseudoCAP). G3XCW9 located_in GO:0009276 by IMP from PMID:9835532 (PseudoCAP); the full annotation list
      for G3XCW9 also has located_in cytoplasm (IEA from the UniProt location). P13016 (target) and E. coli
      AmiD P75820 have only the IBA. The query shape returns hits.
    - >-
      PubMed abstract of PMID:9835532 (doi 10.1128/AAC.42.12.3296). Cloning of P. aeruginosa ampD and ampE
