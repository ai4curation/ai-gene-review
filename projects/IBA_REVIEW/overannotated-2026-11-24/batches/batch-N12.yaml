genes:
- gene_file: genes/yeast/CIT1/CIT1-ai-review.yaml
  rows:
  - go_id: GO:0005975
    go_label: carbohydrate metabolic process
    family: PTHR11739
    ibd_node: PTN000201223
    tree_reading: >-
      IBD at the family root PTN000201223 (270 leaves) with one seed, human CS (O75390), which is
      in the 249-leaf child clade PTN000201301 with CIT1 and joins the CIT1 and CIT2 pair at
      PTN000201226 (62 leaves). The other child, PTN000201309 (21 leaves), is bacterial and
      archaeal. The same node carries the citrate synthase activity IBD (19 seeds) and the TCA
      cycle IBD (4 seeds). No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000201223
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: O75390 carries GO:0005975 by IDA from PMID:9543345
      (UniProt) plus the IBA. The same query shape returns hits, so the single seed is real.
    - >-
      QuickGO by reference PMID:9543345: three UniProt IDA rows on O75390 dated 2007 (citrate
      synthase activity, carbohydrate metabolic process, mitochondrial matrix).
    - >-
      PubMed abstract of PMID:9543345 (doi 10.1023/a:1006839831141): citrate synthase activity
      and content measured in human heart from infancy to adulthood. Nothing on carbohydrate
      metabolism. Abstract only.
    - >-
      QuickGO ancestors (is_a, part_of) of GO:0006099 tricarboxylic acid cycle do not include
      GO:0005975, so the term is not a parent of the accepted TCA cycle rows.
    review_edited: true
    notes: >-
      Action stands, reason rewritten. The earlier reason was "uninformative over-general
      process", which is not a ground. The summary was left verbatim because the PTHR11739
      family review quotes it. S. pombe cit1 keeps the same IBA as non-core according to the
      family review; that review was not in this batch.
- gene_file: genes/yeast/CIT2/CIT2-ai-review.yaml
  rows:
  - go_id: GO:0005759
    go_label: mitochondrial matrix
    family: PTHR11739
    ibd_node: PTN000201222
    tree_reading: >-
      IBD at PTN000201222 (242 leaves) with three seeds. Human CS (O75390) and mouse Cs are in
      the child clade PTN000201224 (145 leaves) that holds CIT2, and Yarrowia Q6C793 joins CIT2
      at PTN000921802 (5 leaves). CIT2 (leaf PTN000201270) and CIT1 are a same-species pair at
      PTN000201269 (2 leaves). PAINT records NOT IRD for the term at PTN001713951 inside the
      12-leaf clade PTN002621568 (bacterial methylcitrate synthases), off the target lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Gene review: peroxisome rows EXP PMID:2181273 and IDA PMID:16877773, PMID:25982115 are
      accepted; two HDA mitochondrion rows are kept as non-core; the review quotes
      PMID:16877773 for a cryptic N-terminal signal for both peroxisomes and mitochondria.
    - QuickGO seeds not re-queried beyond O75390 (IDA mitochondrial matrix, PMID:9543345).
    - Family review PTHR11739 assesses this node NEEDS_PRUNING at the CIT2 paralog.
    review_edited: false
    notes: >-
      Soundly seeded node with the target inside the seeded clade; the ground is the direct
      evidence that Cit2p is the peroxisomal isozyme with a C-terminal SKL. Kept as an
      over-annotation and not a removal because the review keeps two mitochondrial proteome
      detections and a cryptic mitochondrial targeting capacity is reported. If curators take
      the peroxisomal location as exclusive, the loss belongs on the CIT2 leaf PTN000201270.
      Import of endogenous Cit2p into purified mitochondria (protease protection) would settle
      it.
  - go_id: GO:0005975
    go_label: carbohydrate metabolic process
    family: PTHR11739
    ibd_node: PTN000201223
    tree_reading: >-
      IBD at the family root PTN000201223 (270 leaves) with one seed, human CS (O75390), which
      joins CIT2 at PTN000201226 (62 leaves) inside the 249-leaf child clade PTN000201301. No
      loss recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000201223
    evidence_checked:
    - >-
      QuickGO ancestors of GO:0006097 glyoxylate cycle: the term is_a GO:0005975 carbohydrate
      metabolic process (direct is_a path returned by the paths endpoint).
    - Gene review row GO:0006097 glyoxylate cycle (RCA) is ACCEPT, core process.
    - >-
      Seed check as for CIT1: O75390 IDA from PMID:9543345, an enzyme activity measurement in
      heart (abstract).
    review_edited: true
    notes: >-
      For Cit2p the term is true and general, and the accepted glyoxylate cycle row entails it,
      so the row is TOO_GENERAL and not an over-annotation. The seed is still weak, which is why
      the PAINT fix is the same as for CIT1 and CIT3, where the term is not entailed by anything
      (the TCA cycle is not under carbohydrate metabolic process in GO). The three yeast citrate
      synthases therefore differ on this row for an ontology reason, not a tree reason.
  - go_id: GO:0006099
    go_label: tricarboxylic acid cycle
    family: PTHR11739
    ibd_node: PTN000201223
    tree_reading: >-
      IBD at the family root PTN000201223 (270 leaves) with four seeds, all in the 249-leaf
      child clade PTN000201301. CIT1 (SGD:S000005284) is the same-species sister of CIT2 at
      PTN000201269 (2 leaves), CIT3 (SGD:S000006205) joins at PTN000201264 (23 leaves),
      S. pombe cit1 and Pseudomonas prpC (Q9I5E3, joining at PTN000201222, 242 leaves) are
      further out. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: CIT1 (P00890) IMP PMID:2661555 and CIT3 (P43635) IDA
      PMID:17570335 for GO:0006099.
    - >-
      Gene review: quotes PMID:2181273 (Cit2p is peroxisomal and participates in the glyoxylate
      cycle) and PMID:3023912 (either citrate synthase suffices for the metabolic roles tested).
    review_edited: false
    notes: >-
      Soundly seeded, target inside the seeded clade next to its own sister. The ground is on
      the target, namely the duplication that sent Cit2p to the peroxisome and the glyoxylate
      cycle. It is doubt and not loss, because Cit2p can supply citrate when Cit1p is missing.
      The IEA row on the same term carries the same action. The written reason is short but
      rests on the target evidence, so it was left alone.
