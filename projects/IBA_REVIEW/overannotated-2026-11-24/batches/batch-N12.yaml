- gene_file: genes/yeast/IDP3/IDP3-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR11822
    ibd_node: PTN000214284
    tree_reading: >-
      IBD at PTN000214284 (223 leaves) with six seeds. IDP3 (leaf PTN001721998) is in the child
      clade PTN000214285 (62 leaves). The yeast seed IDP1 (SGD:S000002224) joins IDP3 at
      PTN001722085 (5 leaves, 2 species), and IDP2 is the same-species sister at PTN001721997
      (2 leaves). The other child PTN007541840 (161 leaves) holds the Arabidopsis seed. PAINT
      has a peroxisome IBD at PTN002483519 (58 leaves) on the target lineage and a cytosol IBD
      at PTN000930158. No loss recorded for mitochondrion.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: IDP1 (P21954) IDA PMID:15001388 and three HDA rows for
      mitochondrion.
    - >-
      Gene review: three HDA mitochondrion rows on IDP3 are MARK_AS_OVER_ANNOTATED as probable
      peroxisomal co-purification; the review quotes PMID:19854152 and PMID:9452501 for IDP3
      being the peroxisomal isozyme.
    - Family review PTHR11822 assesses the node NEEDS_PRUNING for the IDP2 and IDP3 subfamily.
    review_edited: false
    notes: >-
      The existing reason already names the node, the 5-leaf Saccharomycetaceae clade and the
      target evidence (PTS1, no presequence, dedicated mitochondrial paralog), and keeps the IBA
      in line with the HDA rows. Root organelle term, so the question is only whether the
      organelle claim holds, and the review's reading is that it probably does not. Left as it
      is.
- gene_file: genes/yeast/GPM3/GPM3-ai-review.yaml
  rows:
  - go_id: GO:0004619
    go_label: phosphoglycerate mutase activity
    family: PTHR11931
    ibd_node: PTN002630707
    tree_reading: >-
      IBD at PTN002630707 (253 leaves) with eleven seeds, in the 237-leaf child clade
      PTN002630708 that holds GPM3 (leaf PTN002630874). The yeast seed GPM1 (SGD:S000001635)
      joins GPM3 at PTN002630869 (7 leaves); GPM2 is the same-species sister at PTN002630872 (2
      leaves). PAINT records NOT IRD for this term at PTN008530338 (the BPGM clade), off the
      target lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO id with descendants: GPM1 (P00950) IDA PMID:1386023 and IMP PMID:3033435.
    - >-
      Gene review quotes PMID:9544241: higher expression of GPM3 partially complemented gpm1
      defects without restoring detectable enzymatic activity.
    - Family review PTHR11931 assesses the node NEEDS_PRUNING for the GPM3 subfamily.
    review_edited: false
    notes: >-
      Soundly seeded node, target inside the seeded clade; the ground is the direct assay on
      GPM3 (no detectable activity, yet partial complementation when overexpressed, catalytic
      histidines conserved). That is doubt short of loss, as the summary says. The BPGM loss is
      a precedent for pruning a paralog clade here; a loss on the GPM2 and GPM3 pair
      (PTN002630872) would be the request if curators accept the 1998 assay as showing loss.
      A sensitive coupled assay on purified Gpm3p would settle it. The IEA row carries the same
      action.
  - go_id: GO:0061621
    go_label: obsolete canonical glycolysis
    family: PTHR11931
    ibd_node: PTN002630707
    tree_reading: >-
      IBD at PTN002630707 (253 leaves) with four seeds (UniProtKB P18669 and P62707,
      MGI:1933118 and FB:FBgn0014869; no yeast gene among them). GPM3 is in the 237-leaf child
      clade PTN002630708. PAINT
      records NOT IRD for this term at PTN008530338 (BPGM clade). The term is obsolete in GO.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - treeview label lookup marks GO:0061621 as obsolete.
    - >-
      Gene review quotes PMID:9544241: deleting GPM2, GPM3 or both gave no growth lesion on
      several carbon sources and no change in key intermediary metabolites.
    review_edited: false
    notes: >-
      Follows the activity row. The term is also obsolete, so the PAINT record needs replacing
      whatever is decided about GPM3 (glycolytic process is the usual successor).
- gene_file: genes/yeast/PAH1/PAH1-ai-review.yaml
  rows:
  - go_id: GO:0009062
    go_label: fatty acid catabolic process
    family: PTHR12181
    ibd_node: PTN000256565
    tree_reading: >-
      IBD at PTN000256565 (93 leaves) with two seeds, mouse Lpin1 (MGI:1891340, Q91ZP3) in the
      91-leaf child clade PTN000256566 that holds PAH1 (leaf PTN000256668, in the 15-leaf clade
      PTN000953173), and Dictyostelium DDB_G0271730 (Q75JA1) in the 2-leaf sister
      clade PTN000953256. No fungal seed.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000256565
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: mouse Lpin1 (Q91ZP3) returns only the IBA for
      GO:0009062, no experimental row. The same query shape returns its IMP row for
      GO:0019432, so the empty result is not a query artefact.
    - QuickGO: Dictyostelium Q75JA1 IDA GO:0009062 from PMID:39512784 (dictyBase).
    - >-
      PubMed abstract of PMID:39512784 (doi 10.17912/micropub.biology.001296): the LPIN2 mutant
      has under 17 percent of the major neutral lipid; a lipid synthesis phenotype.
    review_edited: false
    notes: >-
      Same node and finding as human LPIN1 and LPIN2 in batch H07, kept consistent. The yeast
      reason argues from the mouse mechanism (coactivation with PPAR-alpha, absent from yeast),
      which is a lineage argument about a seed whose experimental row is no longer in GOA; it
      is sound as far as it goes and was left alone. With neither seed showing fatty acid
      breakdown the row could also be read as a removal; it is kept as an over-annotation to
      match the human rows, and removing the IBD settles both.
- gene_file: genes/yeast/SET6/SET6-ai-review.yaml
  rows:
  - go_id: GO:0042054
    go_label: histone methyltransferase activity
    family: PTHR12197
    ibd_node: PTN008534456
    tree_reading: >-
      IBD at the family root PTN008534456 (316 leaves) with seven seeds, all in the 297-leaf
      child clade PTN002486656 that holds SET6 (leaf PTN000258004). Yeast Set5 (SGD:S000001250,
      P38890) joins SET6 at PTN008991418 (36 leaves); human SMYD3 (Q9H7B4) joins at PTN002486657
      (146 leaves). The node also carries the protein-lysine N-methyltransferase IBD (6 seeds).
      Narrower histone IBDs (H3K4, H3K36) sit on other clades. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: Set5 (P38890) EXP GO:0042054 PMID:22343720 (UniProt);
      SMYD3 (Q9H7B4) IMP GO:0140939 PMID:25738358.
    - >-
      publications/PMID_37252976.md (full text): few putative protein methyltransferases remain
      in yeast, reproducibly detected methylation sites have a known enzyme or are likely Hmt1
      substrates, and Set6 is modelled as targeting one currently unknown substrate.
    - publications/PMID_31642774.md: Set5 and Set6 are SMYD homologs with histone and non-histone targets in mammals.
    - No family review for PTHR12197.
    review_edited: true
    notes: >-
      Action stands, reason rewritten. The earlier reason was that nothing shows SET6 itself
      uses histones, which is absence of data. The tree gives the row good support (the nearest
      characterised paralog is a histone H4 methyltransferase), so this is the weakest uphold in
      the batch; KEEP_AS_NON_CORE would be defensible. It was kept as an over-annotation because
      the yeast-specific survey argues the remaining unassigned sites are not the known histone
      marks, and because the accepted protein-lysine N-methyltransferase row from the same node
      carries the supported claim. No PAINT change is asked for.
- gene_file: genes/yeast/ARG82/ARG82-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR12400
    ibd_node: PTN000963625
    tree_reading: >-
      IBD at PTN000963625 (350 leaves) with eleven seeds. ARG82 (leaf PTN000274255) is in the
      child clade PTN000274018 (229 leaves) with the ITPK and IP6K enzymes, not in the animal
      IPMK clade PTN002645143 (121 leaves). Human ITPKB, ITPKC, IP6K1 and IP6K3 join ARG82 at
      PTN000274020 (204 leaves). Two seeds are fungal, namely S. pombe arg82 (SPAC607.04,
      Q9US14), the ortholog, in ARG82's own clade PTN000274252 (11 leaves), and S. pombe
      SPCC970.08 (O74561) in the sister Kcs1 clade PTN000274261 (11 leaves); the two clades
      join at PTN008339362 (22 leaves). The nucleus IBD (14 seeds) sits at the same node.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: S. pombe arg82 (Q9US14) and SPCC970.08 (O74561) each
      carry cytosol by HDA (PomBase) and cytoplasm by EXP (UniProt) from PMID:16823372, the
      ORFeome localization study. ARG82 (P07250) has no experimental cytoplasm row, only RCA
      cytosol.
    - UniProt search confirms Q9US14 is arg82 SPAC607.04 and O74561 is SPCC970.08.
    - >-
      Gene review: nucleus rows EXP PMID:16123124, IDA PMID:10720331 and PMID:3311884 are
      accepted; the RCA cytosol row is MARK_AS_OVER_ANNOTATED.
    review_edited: true
    notes: >-
      Action stands, tree statement corrected. The earlier text said the donors were not IPMK
      orthologs and that Arg82 sits on a nuclear IPMK branch; in the PANTHER tree the fission
      yeast ortholog is itself a seed and the animal IPMK clade is the other child of the node.
      The ground is the direct S. cerevisiae evidence (nuclear in every study), against seeds
      that for the fungal clade come from one genome-wide screen. The first clause of the
      summary is quoted by the PTHR12400 family review and was kept verbatim; the words after
      it were corrected. KEEP_AS_NON_CORE would be the alternative if a cytoplasmic pool were
      shown. Separately, PAINT's NOT IRD for inositol hexakisphosphate kinase activity at
      PTN000963723 (31 leaves) covers the Kcs1 clade as well as the Arg82 clade, although KCS1
      (SGD:S000002424) is a seed of that activity's IBD at PTN000274018; the loss looks one node
      too broad and belongs on PTN000274252.
- gene_file: genes/yeast/KCS1/KCS1-ai-review.yaml
  rows:
  - go_id: GO:0000824
    go_label: inositol-1,4,5,6-tetrakisphosphate 3-kinase activity
    family: PTHR12400
    ibd_node: PTN000963723
    tree_reading: >-
      IBD at PTN000963723 (31 leaves, fungal) with one seed, ARG82 (SGD:S000002580). ARG82 is in
      PTN000274252 (11 leaves); KCS1 (leaf PTN000274264) is in the sister clade PTN000274261 (11
      leaves); they join at PTN008339362 (22 leaves), and the IBD sits one node above that. The
      same node carries NOT IRD for inositol hexakisphosphate kinase activity, whose IBD is at
      PTN000274018 with KCS1 among its seeds.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000274252
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: ARG82 (P07250) IDA PMID:10574768 and PMID:10720331 and
      EXP PMID:10683435 for GO:0000824. KCS1 (Q12494) has no experimental row for it.
    - >-
      Gene review quotes PMID:10683435 (arg82 cells accumulate InsP3 170-fold) and PMID:11956213
      (Kcs1p phosphorylates a wider range of substrates than appreciated).
    review_edited: false
    notes: >-
      Pattern 18. The seed is sound and sits in the Arg82 clade; the node also covers the Kcs1
      clade, where the biology differs (IP6 and IP5 pyrophosphorylation). Kept as an
      over-annotation and not a removal because overexpressed Kcs1 partly bypasses arg82. The
      summary names the node and the single seed and was left alone. The loss of IP6 kinase
      activity recorded at this same node would strip KCS1 of its own demonstrated activity and
      should move to PTN000274252 as well.
  - go_id: GO:0008440
    go_label: inositol-1,4,5-trisphosphate 3-kinase activity
    family: PTHR12400
    ibd_node: PTN000963723
    tree_reading: >-
      Same record shape as GO:0000824. IBD at PTN000963723 (31 leaves) with one seed, ARG82, in
      PTN000274252 (11 leaves); KCS1 is in the sister clade PTN000274261 (11 leaves).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000274252
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: ARG82 (P07250) IMP PMID:10683435 (SGD) and an RCA row
      for GO:0008440.
    - Gene review quotes PMID:10683435 and PMID:10827188.
    review_edited: false
    notes: >-
      Same reading as the tetrakisphosphate row. The ARG82 seed here is an IMP for a molecular
      function, which is the kind of seed to check, but ARG82 also has IDA rows for the related
      kinase terms, so the seed is not in question.
  - go_id: GO:0046854
    go_label: phosphatidylinositol phosphate biosynthetic process
    family: PTHR12400
    ibd_node: PTN000274018
    tree_reading: >-
      IBD at PTN000274018 (229 leaves) with six seeds. ARG82 (SGD:S000002580) is in
      PTN000274252 (11 leaves), sister of the Kcs1 clade PTN000274261. The other five seeds are
      human ITPKA, ITPKB, ITPKC, IP6K1 and IP6K2; ITPKB, ITPKC and IP6K1 were located and join
      the fungal clade at PTN000274020 (204 leaves). No loss
      recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000274252
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: ARG82 IDA PMID:16123124 (SGD, also IDA for
      GO:0016303 1-phosphatidylinositol-3-kinase activity); ITPKA IDA PMID:12747803 and
      PMID:1847047; ITPKB IDA PMID:12747803; ITPKC IDA PMID:11085927 and PMID:12747803; IP6K1
      and IP6K2 IDA PMID:10574768 (all UniProt). KCS1 has only the IBA.
    - >-
      PubMed abstract of PMID:12747803 (doi 10.1042/BJ20021963): localization and calcium
      effects of the three human Ins(1,4,5)P3 3-kinases, enzymes that make the soluble
      Ins(1,3,4,5)P4.
    - >-
      publications/PMID_10574768.md (abstract only): synthesis of diphosphoinositol
      pentakisphosphate by the InsP6 kinase family.
    - >-
      PubMed abstract of PMID:16123124 (doi 10.1073/pnas.0506184102): inositol polyphosphate
      multikinase has phosphoinositide 3-kinase activity. This is the one seed that rests on
      lipid chemistry.
    - QuickGO term definition of GO:0046854 covers formation of phosphatidylinositol phosphate, a lipid.
    review_edited: true
    notes: >-
      Action stands, reason added. Five of the six seed rows appear to place soluble inositol
      phosphate kinase assays under the lipid term (pattern 20), judged from abstracts, so this
      goes to UniProt as a query and not a confirmed defect. The summary lists the donors
      incompletely (it omits IP6K1 and IP6K2 and names IPMK); it is quoted by the PTHR12400
      family review, so it was left verbatim and the new reason gives the seeds as the tree has
      them. The fix asked for is to keep the term on the Arg82 clade only. Consistent with the
      other reviews named in the family review (S. pombe arg82 and SPCC970.08 over-annotated,
      human IP6K3 MODIFY to inositol phosphate biosynthetic process).
- gene_file: genes/yeast/VPS74/VPS74-ai-review.yaml
  rows:
  - go_id: GO:0043001
    go_label: Golgi to plasma membrane protein transport
    family: PTHR12704
    ibd_node: PTN000294961
    tree_reading: >-
      IBD at PTN000294961 (73 leaves) with one seed, human GOLPH3 (Q9H4A6), in the metazoan
      child clade PTN000976689 (58 leaves). VPS74 (leaf PTN000295030) is in the fungal child
      clade PTN000976707 (15 leaves), which holds no seed for the term. The node also carries
      IBDs for Golgi vesicle budding (1 seed), cargo adaptor activity, PI4P binding and others.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000976689
    evidence_checked:
    - QuickGO by GO id with descendants: GOLPH3 (Q9H4A6) IMP PMID:19837035 (UniProt and CACAO).
    - >-
      Gene review quotes PMID:19837035 (GOLPH3 acts through MYO18A; S. cerevisiae has no MYO18A
      ortholog) and PMID:18410729 (secreted protein profile of the mutant).
    - No family review for PTHR12704.
