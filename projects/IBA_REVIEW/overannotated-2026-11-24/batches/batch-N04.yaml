genes:
- gene_file: genes/rat/Chrna10/Chrna10-ai-review.yaml
  rows:
  - go_id: GO:0050910
    go_label: detection of mechanical stimulus involved in sensory perception of sound
    family: PTHR18945
    ibd_node: PTN002707806
    tree_reading: >-
      IBD at PTN002707806 (25 leaves, the alpha10 subunit group), one seed, mouse Chrna10 (MGI:3609260).
      Children are the tetrapod clade PTN009034849 (20 leaves, holds rat Chrna10 and the mouse seed) and
      the fish clade PTN002707813 (5 leaves). The node also carries a NOT IRD for serotonin-gated channel
      activity; no loss is recorded for the focus term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002707806
    evidence_checked:
    - >-
      QuickGO by GO id and mouse taxon returns acts_upstream_of_or_within IMP PMID:18077337 (MGI) on
      mouse Chrna10 (accession F7DAA1) and the same row on Chrna9. The canonical mouse accession B2RX82
      and human Q9GZZ6 return only the IBA, so a query by those accessions alone looks empty.
    - >-
      interpro/panther/PTHR18945/PTHR18945-review.yaml assesses this node as WRONG_NODE (the seed's
      auditory phenotype supports efferent modulation, not sound detection).
    - Human CHRNA10 in batch H09 has the same verdict and fix.
    review_edited: false
    notes: >-
      The seed is a knockout phenotype at the efferent olivocochlear synapse, annotated acts_upstream_of_or_within
      and turned by the IBD into involved_in a mechanotransduction term. The existing rat reason states
      this role-scope ground and does not misstate the tree. Its propagation_review says the IBD placement
      was not reconstructed; the seed is identified here. Left unedited, as the human file was.
- gene_file: genes/rat/Hspa5/Hspa5-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR19375
    ibd_node: PTN001834223
    tree_reading: >-
      IBD at PTN001834223 (271 leaves), the BiP clade, with five seeds, all BiP orthologs, namely mouse
      Hspa5 (MGI:95835), human HSPA5 (P11021), S. pombe bip1, rice Q6Z7B0 and rat Hspa5 itself (RGD:2843;
      treeview prints the target as not a seed because it matches UniProt accessions only). Children
      are PTN008570541 (75 leaves, animals and fungi, holds the target) and PTN007673797 (196 leaves,
      plants and protists). The same node carries the ER lumen, ER chaperone complex, UPR and ERAD IBDs.
      No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Rat Hspa5 (P06761) located_in membrane IDA PMID:23444373;
      human HSPA5 (P11021) membrane HDA PMID:19946888 and ER membrane IDA PMID:11181571; mouse Hspa5
      (P20029) ER membrane IDA PMID:22589549 and plasma membrane IDA PMID:22837305.
    - interpro/panther/PTHR19375/PTHR19375-review.yaml assesses the node as SOUND.
    - Human HSPA5 in batch H10 moved both rows on this term to TOO_GENERAL.
    review_edited: true
    notes: >-
      The target is its own seed and the node is sound, so nothing is over-annotated. The term is true
      and does not say which membrane; the rat review accepts GO:0005789 endoplasmic reticulum membrane
      (ISO rows), which entails it. Both rows on the term, the IBA and the IDA seed row (PMID:23444373),
      moved from MARK_AS_OVER_ANNOTATED to TOO_GENERAL together. The IDA reason no longer says the paper
      lacks a membrane observation, because only its abstract is cached.
- gene_file: genes/rat/Por/Por-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR19384
    ibd_node: PTN000453956
    tree_reading: >-
      IBD at the family root PTN000453956 (491 leaves) with six seeds, human MTRR (Q9UBK8), human NOS2
      (P35228), human NDOR1 (Q9UHB4), yeast TAH18, human POR (P16435) and rat Nos2 (RGD:3185). Children
      are PTN008570778 (18 leaves, CysJ and protist members) and PTN000453763 (473 leaves, holds the target).
      Rat Por lies in the animal POR clade PTN001066059 (39 leaves), sister of the NOS clade PTN001066032
      (69 leaves) under PTN002322100 (108 leaves). The only seed inside the POR clade is human POR.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human POR (P16435) located_in cytosol IDA GO_REF:0000052 (HPA
      immunofluorescence); rat Nos2 (Q06518) cytosol IDA PMID:12085352 (UniProt). Rat Por (P00388) has
      only the IBA, an Ensembl IEA and an RGD ISO, both from human POR.
    - UniProt cross-reference search confirms RGD:3185 is rat Nos2.
    - >-
      interpro/panther/PTHR19384/PTHR19384-review.yaml leaves this node UNRESOLVED and calls is_active_in
      cytosol for a membrane-anchored, cytosol-facing enzyme a convention question.
    review_edited: false
    notes: >-
      The seeds for the soluble members (MTRR, NDOR1, TAH18, NOS2) are sound. The one seed in the POR
      clade is a Human Protein Atlas immunofluorescence call, which cannot separate the cytosolic face
      of the ER membrane from the cytosol, for a protein with an N-terminal membrane anchor. The existing
      reason names the node, the seeds and the HPA basis, so the file was left alone. No node-level fix
      is named, because the family review treats this as a convention question; if PAINT agrees that an
      ER-anchored enzyme should not carry cytosol, the fix would be to drop P16435 as a seed and add a
      loss at the POR clade. Rat Por also has IEA and ISO rows on the term with the same action.
- gene_file: genes/rat/Ube2d2b/Ube2d2b-ai-review.yaml
  rows:
  - go_id: GO:0070979
    go_label: protein K11-linked ubiquitination
    family: PTHR24068
    ibd_node: PTN002374325
    tree_reading: >-
      IBD at PTN002374325 (23 leaves, a mammalian UBE2D group) with one seed, human UBE2D3 (P61077). Children
      are PTN000631216 (22 leaves, holds the seed and rat Ube2d2b) and one platypus leaf. The same node
      carries an IBD for K48-linked ubiquitination from the same seed. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002374325
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human UBE2D3 (P61077) involved_in GO:0070979 IDA PMID:20061386 (UniProt);
      the K48 row (GO:0070936) is IDA from the same paper.
    - >-
      interpro/panther/PTHR24068/PTHR24068-review.yaml assesses the node as WRONG_NODE for this term. It
      describes PMID:20061386 as an E3-free in vitro linkage survey that shows linkage promiscuity for
      the UbcH5 group. publications/PMID_20061386.md is cached with full text; I did not re-read it.
    review_edited: false
    notes: >-
      The target sits in the seeded clade, so placement is not the issue. The seed is an in vitro activity
      without an E3, of unknown physiological relevance, which is the SEED_OVERREACH case. The existing
      reason and propagation_review name the node, the seed and the assay. One thing for a later reader.
      The K48 IBA from the same node, seed and paper is ACCEPT in this review, and the K6, K27, K29 and
      K63 ISO rows are KEEP_AS_NON_CORE, so the review treats one survey's linkages differently by term.
      K48 has independent support for UBE2D enzymes and K11 has the dedicated UBE2S route, which is the
      stated basis; I left that as it is.
- gene_file: genes/rat/Rac1/Rac1-ai-review.yaml
  rows:
  - go_id: GO:0005856
    go_label: cytoskeleton
    family: PTHR24072
    ibd_node: PTN001530052
    tree_reading: >-
      IBD at PTN001530052 (731 leaves) with five seeds, mouse Rac1 (MGI:97845), Dictyostelium racG, human
      RAC2 (P15153), human RAC1 (P63000) and human RAC3 (P60763). Children are PTN007770528 (291 leaves,
      Rac, RhoG, RhoBTB and amoebozoan members, holds the target) and PTN007770550 (440 leaves, plant Rop
      and protist members). Rat Rac1 is the ortholog of two of the seeds. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001530052
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005856 with descendants. Human RAC1 and RAC2 carry colocalizes_with
      GO:0005884 actin filament IDA PMID:19625648 (UniProt); human RAC3 part_of GO:0031941 filamentous
      actin IDA PMID:16525025 (MGI); mouse Rac1 (P63001) located_in GO:0000242 pericentriolar material
      IDA PMID:23533177 (MGI).
    - >-
      Dictyostelium racG (Q9GPS0, from the dictyBase cross-reference) returned no experimental row under
      cytoskeleton with an exact-term query; its cellular-component rows from PMID:16950926 include filopodium
      (GO:0030175). I could not tell which row PAINT used for it.
    - >-
      Human RAC1 review, same row, is MODIFY to cell cortex and lamellipodium. The PTHR24072 rows in batch
      H12 are for RHOJ and a different term.
    review_edited: true
    notes: >-
      Action unchanged. The seeds are colocalisation with actin (qualifier colocalizes_with), an actin
      structure and the pericentriolar material; PAINT generalised them to the common parent and asserted
      is_active_in. That is over-reach at the seeds, and the target is inside the seeded clade, so the
      earlier wording that the Rho-family node places the location was replaced with the seed facts.
      Not consistent with the human RAC1 review, which uses MODIFY; I did not follow it because cell cortex
      and lamellipodium are not descendants of cytoskeleton, so that MODIFY is not a refinement. The
      two should be reconciled.
- gene_file: genes/rat/Cyp2a1/Cyp2a1-ai-review.yaml
  rows:
  - go_id: GO:0008392
    go_label: arachidonate epoxygenase activity
    family: PTHR24300
    ibd_node: PTN002549507
    tree_reading: >-
      IBD at PTN002549507 (219 leaves) with one seed, rat Cyp2b12 (RGD:620088). Children are PTN004690349
      (133 leaves, CYP2B, CYP2A and related, holds the target and the seed), PTN008612759 (25 leaves, CYP2F
      and Cyp2t), PTN009090251 (3 leaves), PTN008612754 (19 Xenopus and Anolis leaves) and PTN009090280
      (39 leaves, CYP2E1 and chicken CYP2H). The seed lies in the CYP2B clade PTN004690355 (32 leaves)
      and Cyp2a1 in the CYP2A clade PTN007792516 (31 leaves); the two lineages meet at PTN002802065 (87
      leaves). PTN000670779 (29 leaves) inside the CYP2A clade carries its own coumarin metabolic process
      IBD.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004690355
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Cyp2b12 (P33272) enables GO:0008392 IDA PMID:9535921 (RGD) and
      involved_in GO:0019373 IDA from the same paper.
    - >-
      PubMed title of PMID:9535921 names CYP2B12 as a keratinocyte-specific epoxygenase that metabolizes
      arachidonic acid. Not cached; abstract not read further.
    - No family review exists for PTHR24300 and no human batch covers it.
    review_edited: true
    notes: >-
      Pattern 18. One seed in the CYP2B clade and an IBD five nodes above it (PTN004690355, PTN002802065,
      PTN001548519, PTN009090209, PTN004690349, PTN002549507), covering CYP2A, CYP2F and CYP2E branches
      with no seed. Action unchanged; the reason was rewritten because it argued from the lack of Cyp2a1-specific
      evidence and its propagation_review said the node membership had not been checked. Not REMOVE, since
      nothing shows the CYP2A branch lacks the activity.
  - go_id: GO:0019373
    go_label: epoxygenase P450 pathway
    family: PTHR24300
    ibd_node: PTN002549507
    tree_reading: >-
      Same node, seed and clades as the GO:0008392 row. IBD at PTN002549507 (219 leaves), one seed, rat
      Cyp2b12, in the CYP2B clade PTN004690355 (32 leaves); the target is in the CYP2A clade PTN007792516
      (31 leaves). A separate IBD for this term for the CYP2C branch is mentioned in the review at PTN009090372;
      it is not on the target's lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004690355
    evidence_checked:
    - QuickGO. Rat Cyp2b12 (P33272) involved_in GO:0019373 IDA PMID:9535921 (RGD).
    review_edited: true
    notes: The process counterpart of the activity row; same ground, same fix, same rewritten reason.
- gene_file: genes/rat/Cyp2d10/Cyp2d10-ai-review.yaml
  rows:
  - go_id: GO:0019369
    go_label: arachidonate metabolic process
    family: PTHR24300
    ibd_node: PTN000670525
    tree_reading: >-
      IBD at PTN000670525 (53 leaves, the tetrapod CYP2D node) with one seed, rat Cyp2d4 (RGD:620640, Q64680).
      Children are PTN000670526 (40 leaves, mammals and Anolis, holds the target and the seed) and PTN009090425
      (13 Xenopus leaves). The seed and rat Cyp2d10 share the rodent clade PTN002802011 (12 leaves, mouse
      and rat CYP2D paralogs only). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000670525
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Cyp2d4 (Q64680) involved_in GO:0019369 IDA PMID:10945868 (RGD)
      and enables GO:0008391 arachidonate monooxygenase activity IDA from the same paper. Human CYP2D6
      (P10635) and rat Cyp2d10 carry only the IBA.
    - >-
      PubMed abstract of PMID:10945868 (not cached). Recombinant P450 2D18 supports omega-hydroxylation
      and epoxygenation of arachidonic acid; the abstract says the data suggest a possible role.
    review_edited: true
    notes: >-
      Action unchanged, ground changed. The earlier reason called the node deep and argued from the absence
      of Cyp2d10 data. The tree shows the opposite of a deep placement, since target and seed share a
      12-leaf clade, so on placement alone the row would be kept. What holds the over-annotation is the
      seed, a reconstituted in vitro activity of a promiscuous P450 annotated to a process. Only the abstract
      was read, hence not REMOVE. Summary, reason and one propagation_review comment rewritten.
- gene_file: genes/rat/Plk2/Plk2-ai-review.yaml
  rows:
  - go_id: GO:0000776
    go_label: kinetochore
    family: PTHR24345
    ibd_node: PTN000679870
    tree_reading: >-
      IBD at PTN000679870 (132 leaves) with four seeds, mouse Plk1 (MGI:97621), human PLK1 (P53350), fly
      polo and S. pombe plo1. Below it, PTN000679871 (128 leaves) splits into the fungal clade PTN001217810
      (15 leaves) and PTN001217740 (113 leaves); PTN000757484 (111 leaves) then splits into the PLK1 clade
      PTN008613836 (45 leaves, with human and mouse PLK1 and fly polo) and the PLK2, PLK3 and PLK5 clade
      PTN008613829 (66 leaves, 25 species, with one Nematostella leaf at its base). Rat Plk2 is in the PLK2 clade PTN008613833
      (18 leaves), which has no seed for this term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008613829
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human PLK1 (P53350) located_in kinetochore IDA from seven papers;
      mouse Plk1 (Q07832) IDA PMID:25533956; fly polo (P52304) IDA from four papers. All real localisations.
    - Lineage of fly polo (P52304) and worm plk-1 (P34331) read from the tree; both are in PTN008613836.
    - No family review for PTHR24345; no human PLK2 review.
    review_edited: false
    notes: >-
      Seeds are sound and sit in the PLK1 clade and the fungal single-polo clade. The PLK2, PLK3 and PLK5
      clade arose by duplication and holds none; PLK2 is a G1/S centriolar and neuronal kinase. Because
      the seeds span the fungal outgroup the IBD cannot simply move down, so the fix named is a loss at
      PTN008613829; that is a proposal for a PAINT curator to weigh, since absence from kinetochores has
      not been shown for PLK2. The existing reason already names the node and says the seeds are PLK1-type.
  - go_id: GO:0000922
    go_label: spindle pole
    family: PTHR24345
    ibd_node: PTN000679870
    tree_reading: >-
      Same node as the kinetochore row, seven seeds, rat Plk1 (RGD:3352), S. pombe plo1, mouse Plk1, fly
      polo, Dictyostelium PLK (in the outgroup child PTN008613846, 4 leaves), human PLK1 and S. cerevisiae
      CDC5. All are PLK1-type or single-polo kinases; none is in the PLK2, PLK3 and PLK5 clade PTN008613829
      (66 leaves). That clade carries its own centrosome IBD at PTN008613829 (2 seeds) and the PLK2 clade
      PTN008613833 a centriole IBD.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008613829
    evidence_checked:
    - >-
      QuickGO. Rat Plk1 (Q62673) located_in spindle pole IDA PMID:12784254; human PLK1 IDA PMID:18331714
      and PMID:21041660; yeast CDC5 (P32562) IDA PMID:10594031.
    review_edited: false
    notes: >-
      As for kinetochore. PLK2 is at centrioles in G1 and S, which the centrosome and centriole IBDs inside
      the clade already capture; a mitotic spindle pole location is the PLK1 function. The reason says
      the donors are PLK1, Polo and Cdc5 type and gives the PLK2 localisation; left alone.
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR24345
    ibd_node: PTN007795324
    tree_reading: >-
      IBD at PTN007795324 (292 leaves) with 13 seeds. Children are PTN008401444 (60 leaves, PLK4 and TBCK)
      and PTN000679869 (232 leaves, holds the target). Seeds lie on every major branch, including two
      inside the PLK2, PLK3 and PLK5 clade PTN008613829 (66 leaves), human PLK3 (Q9H4B4), which joins the
      PLK2 lineage at PTN009091768 (43 leaves), and mouse Plk5 (MGI:3026984). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005634 with descendants. Human PLK3 located_in nucleus IDA PMID:19490146
      and PMID:21098032 and nucleolus IDA PMID:17264206; mouse Plk5 (Q4FZD7) nucleolus IDA PMID:20100802;
      mouse Plk4 (Q64702) nucleolus IDA PMID:17891141. Human PLK2 (Q9NYY3) and rat Plk2 have no experimental
      nuclear row; mouse Plk2 (P53351) has a Reactome TAS nucleoplasm row.
    - UniProt cross-reference search confirms MGI:101783 is Plk4 and MGI:3026984 is Plk5.
    review_edited: true
    notes: >-
      The earlier reason said no donor lies near PLK2 and that no nuclear localisation is known for Plk2.
      The first is wrong on the tree and the second is not a ground. Soundly seeded, target inside the
      seeded clade, nothing against the term, so KEEP_AS_NON_CORE. The propagation_review block was removed
      from the row; the two supported_by quotes were kept verbatim (they are YAML anchors used by other
      rows).
  - go_id: GO:0007052
    go_label: mitotic spindle organization
    family: PTHR24345
    ibd_node: PTN000679870
    tree_reading: >-
      IBD at PTN000679870 (132 leaves) with four seeds, worm plk-1 (in the PLK1 clade PTN008613836), A.
      nidulans plkA (C8VMZ9, fungal clade PTN001217810), and mouse Plk2 (MGI:1099790) and human PLK2 (Q9NYY3),
      both in the PLK2 clade PTN008613833 (18 leaves) with rat Plk2. The target's orthologs are two of
      the four seeds.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008613833
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human PLK2 involved_in GO:0007052 IDA PMID:19001868
      (UniProt); mouse Plk2 IMP PMID:12897130 (UniProt); A. nidulans plkA acts_upstream_of_or_within a
      descendant term IMP PMID:15659171. The worm seed could not be queried by its WormBase id.
    - >-
      publications/PMID_19001868.md (abstract only). The paper is about centriole duplication and Plk2 at
      centrioles; the review quotes its sentence on abnormal spindles after Plk2 siRNA. PMID_12897130.md
      (abstract only) is titled on mitotic catastrophe in paclitaxel-exposed cells after Plk2 silencing.
    review_edited: false
    notes: >-
      The PLK1-type seeds are sound. The two PLK2 seeds are a knockdown and a drug-sensitised phenotype,
      which show that spindles go wrong without Plk2 and not that Plk2 organises the spindle; the first
      paper attributes the effect to centriole duplication. The reason says this and names both PLK2
      seed papers, so the file was left alone on this row. The fix follows the batch H01 precedent, a loss
      at the PLK2 clade and not removal of the IBD, with the two PLK2 seed rows to be re-examined by UniProt.
      Both seed papers were read at abstract level only. The four ISO and ISS rows on the term carry
      the same action.
- gene_file: genes/rat/Gamt/Gamt-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR32379
    ibd_node: PTN001282244
    tree_reading: >-
      IBD at the family root PTN001282244 (94 leaves) with one seed, S. cerevisiae Rmt2 (SGD:S000002873,
      Q03305). Children are PTN001285366 (47 leaves, animals and fungi) and PTN001285390 (47 leaves, plants
      and algae). Inside PTN001285366 the seed is in the fungal RMT2 clade PTN001285370 (18 leaves) and
      rat Gamt in the animal GAMT clade PTN001285367 (29 leaves), which carries the creatine biosynthesis
      and guanidinoacetate N-methyltransferase IBDs. The root also carries a cytoplasm IBD (2 seeds).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001285370
    evidence_checked:
    - >-
      QuickGO. Yeast Rmt2 (Q03305) located_in nucleus HDA PMID:14562095 and PMID:22842922 and IDA PMID:17448464
      (SGD). Human GAMT (Q14353) has only the IBA.
    - UniProt cross-reference search confirms SGD:S000002873 is RMT2.
    - The review quotes its deep-research file for GAMT in the rat liver cytosolic fraction.
    review_edited: true
    notes: >-
      Pattern 18. The single seed is a fungal protein arginine methyltransferase, two nodes below the IBD
      and on the other side of the animal and fungal split from GAMT, a small-molecule enzyme with a cytosolic
      fractionation result. Action unchanged; the reason was rewritten because it argued only from the
      absence of direct support, and a wrong sentence (nucleus and cytosol mutually exclusive) was deleted
      from a propagation_review comment. Not consistent with the human GAMT review, which keeps the same
      row as KEEP_AS_NON_CORE on the grounds that substrate specialisation of the donor does not show
      loss of the compartment. That file was not in a human batch. I kept the over-annotation call because
      the tree places the only seed in the sister clade; the two reviews should be reconciled.
- gene_file: genes/rat/Acsm4/Acsm4-ai-review.yaml
  rows:
  - go_id: GO:0006633
    go_label: fatty acid biosynthetic process
    family: PTHR43605
    ibd_node: PTN001944787
    tree_reading: >-
      IBD at the family root PTN001944787 (94 leaves) with two seeds, mouse Acsm1 (MGI:2152200) and mouse
      Acsm3 (MGI:99538). Children are PTN008683229 (89 leaves, holds the target and both seeds) and PTN008683228
      (5 Dictyostelium and Sulfolobus leaves). The same node carries IBDs for fatty-acyl-CoA synthase
      activity, acyl-CoA metabolic process and fatty acid ligase activity. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001944787
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Mouse Acsm1 (Q91VA0) and Acsm3 (Q3UNX5) each carry acts_upstream_of_or_within
