genes:
- gene_file: genes/yeast/INP53/INP53-ai-review.yaml
  rows:
  - go_id: GO:0052658
    go_label: inositol-1,4,5-trisphosphate 5-phosphatase activity
    family: PTHR11200
    ibd_node: PTN002597976
    tree_reading: >-
      IBD at PTN002597976 (79 leaves, the synaptojanin node of the 446-leaf family) with four seeds, rat Synj1
      (RGD:69434), rat Synj2 (RGD:69436), human SYNJ1 (O43426) and S. pombe syj1 (PomBase:SPBC2G2.02, O43001).
      The node's children are PTN002597977 (77 leaves), holding INP53 (leaf PTN000128229) and all four seeds,
      and a 2-leaf Dictyostelium clade. INP53 joins the pombe seed at PTN000128223 (17 leaves) and the animal
      seeds at PTN002597977. INP53 and INP52 form the 2-leaf node PTN000128227, and INP51 joins them at
      PTN001341482 (7 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0052658 on O43001, O43426, O55207 and Q62910. All four seeds carry enables IDA rows
      (syj1 PMID:11348594 and PMID:15316017, PomBase; SYNJ1 PMID:33349335 and PMID:40969890, UniProt; rat
      Synj2 PMID:9388224 and rat Synj1 PMID:8552192, RGD).
    - >-
      publications/PMID_11094088.md (full text). Purified recombinant Inp52 was assayed against
      Ins(1,4,5)P3, Ins(1,3,4,5)P4 and PtdIns(4,5)P2, with 5-phosphatases I and II as positive controls. No
      hydrolysis of the two soluble substrates was seen. The same paper summarises Inp51, Inp52 and Inp53
      as each specifically hydrolysing PtdIns(4,5)P2, citing earlier work.
    - publications/PMID_10224048.md and PMID_9565610.md are abstract-only and do not report a soluble-substrate assay.
    - Family review PTHR11200 does not assess this term. batch-N05 moved worm unc-26 on the same node to KEEP_AS_NON_CORE.
    review_edited: true
    notes: >-
      The node is soundly seeded and the target is inside the seeded clade, so the earlier wording (soluble
      IP3 hydrolysis untested for the yeast synaptojanins) was not a ground and was also wrong; the paralog
      Inp52 was tested and was negative. The reason now rests on that assay and names the nodes. A direct
      negative exists only for Inp52, so INP53 stays an over-annotation and is not removed. If the Inp52
      result is taken to cover the pair, the PAINT fix would be a loss at PTN000128227; I did not request it
      on one paralog's data. INP51 and INP52 carry the same IBA with the old wording and are outside this
      batch; INP52 in particular has a direct negative and could be a REMOVE.
- gene_file: genes/yeast/LEE1/LEE1-ai-review.yaml
  rows:
  - go_id: GO:0061630
    go_label: ubiquitin protein ligase activity
    family: PTHR11224
    ibd_node: PTN000131854
    tree_reading: >-
      IBD at the family root PTN000131854 (233 leaves) with three seeds, human MKRN1 (Q9UHC7), human MKRN3
      (Q13064) and mouse Mkrn2 (MGI:1914277). The root has two children, PTN000131855 (113 leaves, animals and
      fungi) and PTN007497136 (120 leaves, plants and protists). All three seeds and LEE1 (leaf PTN000131961)
      are in PTN000131855, inside PTN000131856 (110 leaves). LEE1 sits in the fungal node PTN000881045 (18
      leaves), and within it in PTN000881046 (15 leaves). No loss recorded.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000881046
    evidence_checked:
    - >-
      QuickGO by GO:0061630 with descendants. MKRN1 IDA PMID:19536131 (FlyBase), MKRN3 EXP PMID:34692086 and
      PMID:38705397 (UniProt), mouse Mkrn2 Q9ERV1 IDA PMID:28378844 (UniProt). The node is soundly seeded.
    - >-
      genes/yeast/LEE1/LEE1-uniprot.txt. Two C3H1 zinc fingers (87-114, 123-145), InterPro MKRN-like and CCCH
      signatures only, no RING signature.
    - >-
      UniProt REST for the members of PTN000881045. None of 14 members of PTN000881046 with a current record
      (Q02799, Q75A57, Q6CEV7, Q5B7N3, Q4WWE7, Q7RWD0, A7ERF9, P41000, B6JY76, A0A1D8PKD4, O74463, Q5KJH2,
      A0A0D1CR28, E3L8X9) has a RING signature (IPR001841, IPR013083, IPR017907, IPR018957, PS50089, PS00518);
      Q0V006 returned no record. Q4WHU2 also has none. The two remaining leaves of PTN000881045, Ustilago
      A0A0D1E4Z6 and Batrachochytrium F4NW81, have a RING, as do MKRN1 and worm lep-2.
    - No family review exists for PTHR11224.
    review_edited: true
    notes: >-
      The earlier review argued correctly that LEE1 has no RING domain but stopped at MARK_AS_OVER_ANNOTATED.
      Absence of the whole catalytic domain across the 15-leaf fungal node is evidence that the branch lacks
      the activity, which is a removal with a loss request, not an over-annotation. The same-term IEA row
      (GO_REF:0000002, InterPro MKRN-like) was changed to REMOVE with it for action consistency. Q4WHU2 is
      outside PTN000881046 and also lacks a RING, so the loss may sit one node higher for that paralog; the
      15-leaf node is the largest one checked as uniformly RING-less.
  - go_id: GO:0016567
    go_label: protein ubiquitination
    family: PTHR11224
    ibd_node: PTN000131854
    tree_reading: >-
      IBD at the family root PTN000131854 (233 leaves) with one seed, human MKRN1 (Q9UHC7), in the same root
      child PTN000131855 (113 leaves) as LEE1. LEE1 sits in the fungal node PTN000881046 (15 leaves) inside
      PTN000881045 (18 leaves). No loss recorded.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000881046
    evidence_checked:
    - >-
      QuickGO by GO:0016567 with descendants on Q9UHC7. MKRN1 carries GO:0000209 protein polyubiquitination
      IDA PMID:19536131 (FlyBase), a descendant of the term, from the same paper as its ligase activity row.
    - RING signature survey of the fungal node as for GO:0061630 above.
    review_edited: true
    notes: >-
      The process is the consequence of the RING ligase activity and goes with it (pattern 19, a loss should be
      asked for on every term the lost function implies). The IEA row on the child term GO:0000209 protein
      polyubiquitination was changed from MARK_AS_OVER_ANNOTATED to REMOVE for consistency.
- gene_file: genes/yeast/ATG18/ATG18-ai-review.yaml
  rows:
  - go_id: GO:0000422
    go_label: autophagy of mitochondrion
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with two seeds, S. cerevisiae ATG21 (SGD:S000006021) and
      Drosophila Atg18a (FB:FBgn0035850). The root's children are PTN000132137 (144 leaves) and PTN000132247
      (275 leaves, the WDR45 and Hsv2 side). Both seeds and ATG18 (leaf PTN000132229) are in PTN000132137.
      ATG18 joins the ATG21 seed at the 4-leaf node PTN000132224 (ATG18 and ATG21 of S. cerevisiae and
      Eremothecium) and the fly seed at PTN000132139 (87 leaves, the Atg18, WIPI1 and WIPI2 node). No loss
      recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0000422 with descendants. ATG21 Q02887 IMP PMID:19793921 (SGD). Fly Atg18a M9PER1 carries
      GO:0000423 mitophagy IMP PMID:23873149 and PMID:30571977 and IDA PMID:40801807 (FlyBase). ATG18 P43601
      has only the IBA.
    - >-
      publications/PMID_19793921.md (full text). All 28 ATG knockout strains were screened by Om45-GFP
      processing; the core ATG genes were essential for mitophagy and ATG20, 21 and 24 were required for
      efficient mitophagy. ATG18 is not named in the sentence (the supplemental figure was not available).
    - publications/PMID_15155809.md (full text) states that Atg18 is required for all types of autophagy.
    - >-
      interpro/panther/PTHR11227/PTHR11227-review.yaml assesses this node as TOO_DEEP with REMOVE_IBD and
      says the fungal Atg18 and Atg21/Hsv2 branches should not inherit the term.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The old reason said the root spans divergent paralogs and named no
      clade. On the tree the target shares a 4-leaf node with one seed and the ortholog node with the other,
      and Atg18 is the core PROPPIN of budding yeast autophagy, so the row is true and is kept as non-core
      like the review's pexophagy and nucleophagy rows. I disagree with the family review on this point; it
      groups Atg21 with Hsv2, but ATG21 is in the Atg18 child of the root and is itself a seed. The root
      placement is still too deep for the PTN000132247 side (see HSV2), where MOVE_IBD to PTN000132139
      applies.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a (FB:FBgn0035850, leaf
      PTN000132220), in the root child PTN000132137 (144 leaves). ATG18 (leaf PTN000132229) is in the same
      child and joins the seed at PTN000132139 (87 leaves, the Atg18, WIPI1 and WIPI2 node). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO:0061723 with descendants. Fly Atg18a Q9VSF0 IMP PMID:24265594 (FlyBase). ATG18 has only the IBA.
    - >-
      publications/PMID_24265594.md (full text). Knockdown of core autophagy genes, Atg18 among them, blocked
      autophagy in larval muscle, and the authors conclude the core machinery is required for glycogen
      autophagy.
    - >-
      PubMed abstract of PMID:38832010 (budding yeast). Glycogen is sequestered by autophagy after prolonged
      nitrogen starvation and during sporulation through the receptor Atg45. Abstract only.
    - publications/PMID_15155809.md states that Atg18 is required for all types of autophagy.
    - The PTHR11227 family review assesses the node as TOO_DEEP with REMOVE_IBD.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The seed is the fly member of the target's own ortholog node and
      its evidence is a core-machinery requirement, which carries to the yeast core PROPPIN now that glycogen
      autophagy is described in budding yeast. No yeast experiment tests Atg18 in glycophagy directly, and a
      stricter reader could keep the over-annotation on that ground; I did not, since absence of data on the
      target is not a ground. Root placement is too deep for the other root child (see HSV2).
- gene_file: genes/yeast/ATG21/ATG21-ai-review.yaml
  rows:
  - go_id: GO:0000425
    go_label: pexophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae ATG18 (SGD:S000001917, leaf
      PTN000132229). ATG21 (leaf PTN000132226) is in the same root child PTN000132137 (144 leaves) and joins the
      seed at the 4-leaf node PTN000132224. No loss recorded.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000132229
    evidence_checked:
    - QuickGO by GO:0000425 with descendants. ATG18 P43601 IMP PMID:11739783 (SGD). ATG21 has only the IBA.
    - >-
      publications/PMID_15155809.md (full text). Fox3 degradation was completely blocked in atg18 deletion
      cells and proceeded in atg21 deletion cells at a rate similar to wild type; the discussion says atg21 cells are
      fully capable of degrading peroxisomes.
    - The PTHR11227 family review assesses the node as TOO_DEEP and proposes MOVE_IBD to PTN000132229.
    review_edited: true
    notes: >-
      The earlier row argued only that the root is too broad. The function was tested on the target and is
      absent, so the row is a removal. The ground is recorded as TARGET_LOSS because the evidence is on the
      target; the fault on the tree is a single-seed IBD at the root, and the fix agrees with the family
      review. A loss at the ATG21 node PTN000132225 would be the alternative if the IBD stayed where it is.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a (leaf PTN000132220).
      ATG21 (leaf PTN000132226) joins the seed at PTN000132139 (87 leaves) and its paralog ATG18 at PTN000132224
      (4 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO:0061723 with descendants. Fly Atg18a IMP PMID:24265594 (FlyBase) is the only experimental row among the PROPPINs queried.
    - >-
      publications/PMID_15155809.md (full text). Nonspecific autophagy (Pho8-delta-60) is essentially normal
      and pexophagy is normal in atg21 deletion cells; Atg21 is needed for prApe1 import.
    - publications/PMID_18769150.md (abstract). The function of Atg21 is described as restricted to the Cvt pathway.
    - publications/PMID_19793921.md. ATG21 is required for efficient mitophagy.
    review_edited: true
    notes: >-
      Upheld, on a target ground and not the node ground the old text gave. The old summary called this the
      Atg21/Hsv2 branch; ATG21 is in the Atg18 child of the root with the seed, and Hsv2 is in the other
      child. Atg21 is the Cvt-specialised paralog, dispensable for nonspecific autophagy and pexophagy, so a
      glycophagy role is doubtful but untested. A glycogen autophagy assay in atg21 deletion cells would
      settle it.
- gene_file: genes/yeast/HSV2/HSV2-ai-review.yaml
  rows:
  - go_id: GO:0000422
    go_label: autophagy of mitochondrion
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with two seeds, S. cerevisiae ATG21 and Drosophila
      Atg18a, both in the root child PTN000132137 (144 leaves), joining at PTN000132139 (87 leaves). HSV2 (leaf
      PTN000132322) is in the other root child PTN000132247 (275 leaves), where it joins human WDR45 and WDR45B
      at PTN000132249 (85 leaves). That child holds no seed for the term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000132139
    evidence_checked:
    - >-
      QuickGO by GO:0000422 with descendants on P43601, Q02887, P50079, Q9Y4P8, Q5MNZ9, Q9Y484 and Q5MNZ6. Only
      ATG21 has an experimental row (IMP PMID:19793921); HSV2, WDR45 and WDR45B have only the IBA.
    - publications/PMID_15155809.md. No strong phenotype had been found for Ygr223c (Hsv2).
    - >-
      publications/PMID_42135946.md (abstract and figure legends). Hsv2 is required for autophagy of large
      cargo such as fatty acid synthase and ribosomes; mitophagy and pexophagy are not reported.
    - The PTHR11227 family review assesses the node as TOO_DEEP (REMOVE_IBD).
    review_edited: true
    notes: >-
      Upheld. The old text called HSV2 part of an Atg21/Hsv2 branch; on the tree ATG21 is a seed in the other
      root child. Reason rewritten to name the clades. The family review asks for REMOVE_IBD and re-adding
      lower; moving to PTN000132139, the join of the two seeds, has the same effect for this target.
  - go_id: GO:0000425
    go_label: pexophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae ATG18 (leaf PTN000132229),
      in the root child PTN000132137 (144 leaves). HSV2 is in the other root child PTN000132247 (275 leaves),
      which holds no seed. No loss recorded.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000132229
    evidence_checked:
    - QuickGO by GO:0000425 with descendants on the same seven PROPPINs. Only ATG18 has an experimental row (IMP PMID:11739783, SGD).
    - >-
      publications/PMID_15155809.md (full text). Pexophagy (Fox3 degradation) is blocked in atg18 deletion
      cells and normal in atg21 deletion cells, and the authors add that the ygr223c (hsv2) deletion strain
      was not defective in pexophagy, citing unpublished data.
    - The PTHR11227 family review proposes MOVE_IBD to PTN000132229.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The target's root child has no seed, and the one statement in the
      literature on the gene is a negative. The negative is unpublished data reported in a paper, so it is
      weaker than the Atg21 result shown in that paper's figure; together with the seedless branch I judged
      it enough for a removal. Same fix as the family review.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a (leaf PTN000132220),
      in the root child PTN000132137 inside PTN000132139 (87 leaves). HSV2 is in the other root child
      PTN000132247 (275 leaves), which holds no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000132139
    evidence_checked:
    - QuickGO by GO:0061723 with descendants on the same PROPPINs plus fly Atg18a. Only Atg18a has an experimental row (IMP PMID:24265594).
    - publications/PMID_15155809.md and PMID_42135946.md as for the mitophagy row.
    - The PTHR11227 family review assesses the node as TOO_DEEP (REMOVE_IBD).
    review_edited: true
    notes: >-
      Upheld; reason rewritten to name the clades. The move target keeps the term on the Atg18, WIPI1 and
      WIPI2 node, consistent with keeping it on yeast ATG18.
- gene_file: genes/yeast/HSC82/HSC82-ai-review.yaml
  rows:
  - go_id: GO:0032991
    go_label: protein-containing complex
    family: PTHR11528
    ibd_node: PTN000163629
    tree_reading: >-
      IBD at PTN000163629 (452 leaves, the cytosolic Hsp90 node under the 643-leaf family root) with nine seeds,
      all animal (human HSP90AA1 and HSP90AB1, chicken HSP90AA1, rat and mouse Hsp90aa1 and Hsp90ab1, fly Hsp83,
      worm hsp-90). The node's children are PTN000163630 (119 leaves), holding HSC82 (leaf PTN000163756) and the
      seeds, and PTN007512371 (333 leaves, plants and protists). Inside PTN000163630, PTN000163631 (115 leaves)
      splits into the animal node PTN000898052 (100 leaves) and the fungal node PTN000898156 (15 leaves), where
      HSC82 and HSP82 form the 2-leaf node PTN000163754. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0032991 with descendants on P15108 and P02829. Neither yeast protein has an experimental
      complex row; both have only the IBA.
    - QuickGO ontology lookup. GO:0101031 protein folding chaperone complex is current and its definition covers heat shock protein assemblies.
    - >-
      Other reviews on this node. Human HSP90AA1 uses MODIFY to GO:0101031 (and GO:1990565) for the IBA and its
      IDA row; worm hsp-90 uses ACCEPT.
    - The row's own quotes (deep-research file) on the Hsc82 homodimer and Sti1, Cpr6, Sba1, Cdc37 and Sgt1 complexes were kept unchanged.
    - No family review yaml exists for PTHR11528.
    review_edited: true
    notes: >-
      The old reason said the term is true but uninformative, which is a reason to refine and not an
      over-annotation. No other row on the review carries a complex term, so TOO_GENERAL does not apply.
      MODIFY to protein folding chaperone complex follows the human HSP90AA1 row on the same node. The two
      deep-research quotes on this row were already listed as known non-verbatim quotes in
      conf/local_quote_baseline.yaml; they were not touched.
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR11528
    ibd_node: PTN000163629
    tree_reading: >-
      IBD at PTN000163629 (452 leaves) with seven seeds. Six are vertebrate (human HSP90AA1 and HSP90AB1, chicken
      HSP90AA1 P11501, RGD:1303075, RGD:631409, MGI:96250) in the animal node PTN000898052 (100 leaves). The
      seventh, Candida albicans HSP90 (CGD:CAL0000201062, P46598), is in the fungal node PTN000898156 (15 leaves)
      with HSC82. The 333-leaf plant and protist child PTN007512371 has no seed.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000898052
    evidence_checked:
    - >-
      QuickGO by GO:0005886 with descendants. C. albicans HSP90 located_in IDA PMID:19824013 (CGD); HSC82
      located_in HDA PMID:16622836 (SGD); HSP90AA1 EXP PMID:11276205; HSP90AB1 EXP PMID:20599762 and HPA IDA;
      chicken HSP90AA1 IDA PMID:17522206 (AgBase); rat Hsp90aa1 and Hsp90ab1 IDA rows on apical, basolateral
      and brush border membrane (PMID:15497505).
    - >-
      PubMed abstracts. PMID:19824013 is a proteomic analysis of a C. albicans plasma membrane fraction
      (214 membrane proteins identified). PMID:16622836 is the S. cerevisiae plasma membrane proteome.
      PMID:17522206 shows chicken Hsp90 on the cell surface by biotinylation and immunofluorescence.
    - The HSC82 review keeps its own HDA plasma membrane row as MARK_AS_OVER_ANNOTATED; the two rows stay consistent.
    review_edited: true
    notes: >-
      Upheld. In the fungal branch the term rests on membrane fraction proteomics of a very abundant cytosolic
      protein (the Candida seed and HSC82's own HDA row), which shows it was found in the fraction and not
      that it acts there. The animal seeds record a real cell-surface pool. The old reason gave only the
      missing targeted evidence; it was rewritten to name the seeds and nodes. Abstracts only were read for
      the seed papers, so the Candida seed is not disputed as a located_in row; the objection is to
      spreading it as is_active_in. Moving the IBD to the animal node leaves the Candida row as a leaf
      observation.
  - go_id: GO:0048471
    go_label: perinuclear region of cytoplasm
    family: PTHR11528
    ibd_node: PTN000163629
    tree_reading: >-
      IBD at PTN000163629 (452 leaves) with five seeds (RGD:631409 rat Hsp90aa1, MGI:96247, MGI:96250, fly Hsp83
      FBgn0001233, worm hsp-90 WBGene00000915), all in the animal node PTN000898052 (100 leaves). HSC82 is in
      the sister fungal node PTN000898156 (15 leaves), which holds no seed, and the node also covers the
      333-leaf plant and protist child with no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000898052
    evidence_checked:
    - >-
      QuickGO by GO:0048471 with descendants. Experimental rows on fly Hsp83 (IDA PMID:22902557), mouse
      Hsp90aa1 and Hsp90ab1 (IDA PMID:24286867), rat Hsp90aa1 (IDA PMID:20796173) and worm hsp-90 (IDA
      PMID:12950278). No fungal Hsp90 has an experimental row; HSC82 and HSP82 have only the IBA.
    - HSP82 review rows. GFP imaging of Hsp82 (PMID:27385335) shows a prominent cytosolic distribution, and an IDA nucleus row is kept as non-core.
    review_edited: true
    notes: >-
      Upheld. Seeds are all animal and the node is two splits above them. The old reason already said the
      donors were metazoan; it was rewritten to name the nodes and the fix. The same move would also take the
      term off the plant and protist clade.
- gene_file: genes/yeast/HSP82/HSP82-ai-review.yaml
  rows:
  - go_id: GO:0032991
    go_label: protein-containing complex
    family: PTHR11528
    ibd_node: PTN000163629
    tree_reading: >-
