genes:
- gene_file: genes/worm/sph-1/sph-1-ai-review.yaml
  rows:
  - go_id: GO:0030672
    go_label: synaptic vesicle membrane
    family: PTHR10306
    ibd_node: PTN000033897
    tree_reading: >-
      IBD at PTN000033897 (99 of the family's 103 leaves) with four seeds, rat Synpr (RGD:708366), rat Syp
      (RGD:3802), mouse Syp (MGI:MGI:98467) and RGD:1359569. The node has two children. The vertebrate
      synaptophysin, synaptoporin and SYPL clade PTN008304255 (93 leaves, 23 species) holds the seeds. sph-1
      (leaf PTN000034015) is in the protostome clade PTN002569018 (6 leaves, one per species), which has no
      seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008304255
    evidence_checked:
    - >-
      QuickGO over the 99 leaves of PTN000033897 for GO:0030672 and descendants. Experimental rows are on rat
      Syp P07825 (IDA PMID:12181340 RGD, IDA PMID:3923488 SynGO, IDA PMID:23792689), rat Synpr P22831 (IDA
      PMID:2206533 SynGO) and mouse Syp Q62277 (IDA PMID:12805290, PMID:15071120, PMID:29490264 MGI). None is
      in PTN002569018.
    - RGD REST lookup. RGD:708366 is Synpr and RGD:3802 is Syp. RGD:1359569 was not looked up.
    - >-
      The review quotes PMID:16698939 that worm synaptophysin is mostly localized to the muscles of the
      pharynx and anal sphincter while synaptogyrin is pan-neuronal.
    review_edited: false
    notes: >-
      The seeds are sound and all sit in the vertebrate child clade; the protostome child that holds sph-1 is
      unseeded and the worm protein is expressed mostly in muscle, which is the biological reason for doubt.
      The existing reason and propagation_review already say the node is seeded by vertebrate synaptophysin
      and give the tissue ground, so the file was left alone. No family review exists for PTHR10306.
- gene_file: genes/worm/lon-1/lon-1-ai-review.yaml
  rows:
  - go_id: GO:0060090
    go_label: molecular adaptor activity
    family: PTHR10334
    ibd_node: PTN000036124
    tree_reading: >-
      IBD at PTN000036124 (1510 of the family's 1515 leaves) with one seed, mouse Glipr1l1 (MGI:MGI:1916536,
      Q9DAG6). The node's children are PTN000036125 (1320 leaves, holding seed and target) and PTN008304532
      (190 leaves, no seed). The seed's lineage runs through PTN008497695 (19 leaves) into the vertebrate
      GLIPR1L1 clade named in batch H02, PTN008497694 (22 leaves). lon-1 (leaf PTN000036529) is in a nematode
      clade PTN008943133 (19 leaves, C. elegans, C. briggsae, P. pacificus) inside the protostome clade
      PTN008943131 (48 leaves) and joins the seed at PTN008943080 (163 leaves).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008497694
    evidence_checked:
    - QuickGO Q9DAG6 GO:0060090 with descendants returned one experimental row, enables, IDA, PMID:31672133 (UniProt).
    - >-
      PubMed abstract of PMID:31672133 (doi 10.1186/s12915-019-0701-1). GLIPR1L1 is in sperm-surface complexes
      with IZUMO1 and its loss impairs the acrosome reaction and IZUMO1 redistribution.
    - Join node of Q09566 and Q9DAG6 computed from the cached PTHR10334 tree.
    review_edited: true
    notes: >-
      Same ground and same PAINT fix as the six human CAP proteins in batch H02. The earlier reason rested on
      there being no evidence that LON-1 bridges two molecules and named no node; it was rewritten to state
      the single seed, its clade and the join node. The propagation_review comment was updated to match. The
      action did not change.
- gene_file: genes/worm/unc-13/unc-13-ai-review.yaml
  rows:
  - go_id: GO:0030672
    go_label: synaptic vesicle membrane
    family: PTHR10480
    ibd_node: PTN000049880
    tree_reading: >-
      IBD at PTN000049880 (80 of the family's 81 leaves) with one seed, rat Unc13c (RGD:628592, Q62770). The
      node has two children. The vertebrate UNC13A, UNC13B and UNC13C clade PTN000049881 (70 leaves) holds the
      seed, in the Unc13c branch PTN002573574 (21 leaves). unc-13 (leaf PTN000049973) is in the protostome clade
      PTN002573606 (10 leaves), which has no seed. The same node carries IBDs for presynaptic membrane, synaptic
      vesicle priming and neuromuscular junction, which the review accepts. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000049881
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Unc13c Q62770 carries located_in IDA PMID:9895278 (ParkinsonsUK-UCL);
      rat Unc13a Q62768 and Unc13b Q62769 and mouse Unc13a and Unc13b carry only the IBA. RGD REST confirms
      RGD:628592 is Unc13c.
    - >-
      PubMed abstract of PMID:9895278. Subcellular brain fractions show the novel Munc13 proteins enriched in
      synapses and Munc13-3 concentrated in presynaptic terminals. The abstract does not name the vesicle
      membrane; the full text was not read.
    - >-
      The review's own rows. presynaptic active zone IDA PMID:15976086 and presynaptic membrane IBA are accepted,
      and the reason cites immunogold localization of UNC-13 to the presynaptic plasma membrane region.
    review_edited: false
    notes: >-
      One located_in seed on one of three vertebrate paralogs, asserted with is_active_in across the split to
      the protostome clade, where the worm protein is placed at the active zone plasma membrane. The existing
      reason states that target ground and names the node, so the file was left alone. The smallest clade
      holding the seed is the Unc13c branch PTN002573574; the fix names the vertebrate clade as the widest
      defensible placement. Whether the seed fractionation resolves vesicle membrane from active zone membrane
      is a lead from the abstract only. No family review exists for PTHR10480.
- gene_file: genes/worm/ddb-1/ddb-1-ai-review.yaml
  rows:
  - go_id: GO:0035861
    go_label: site of double-strand break
    family: PTHR10644
    ibd_node: PTN000068364
    tree_reading: >-
      IBD at PTN000068364 (53 leaves) with one seed, S. pombe ddb1 (PomBase:SPAC17H9.10c, O13807). The node's
      children are PTN000068365 (49 leaves), which holds both ddb-1 (leaf PTN000068412) and the seed, and a
      4-leaf amoebozoan clade PTN000068426. ddb-1 and the seed join at PTN000068365. The same node carries IBDs
      for DNA repair and proteasome-mediated ubiquitin-dependent protein catabolic process. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO O13807 GO:0035861 returned is_active_in IDA PMID:27098497 (PomBase); worm ddb-1 Q21554 and human
      DDB1 Q16531 carry only the IBA.
    - Batch H02 moved human DDB1 on the same node and seed to KEEP_AS_NON_CORE after reading the seed abstract.
    review_edited: true
    notes: >-
      The earlier reason was that no worm evidence places DDB-1 at double-strand breaks, which is not a ground.
      The target is the single worm DDB1 inside the seeded clade and nothing argues against the term. Same call
      as human DDB1 in H02. The row had no supporting_text. The module modules/nrf_oxidative_stress_response.yaml
      cites this review only for its core function, which was not touched.
- gene_file: genes/worm/mtm-9/mtm-9-ai-review.yaml
  rows:
  - go_id: GO:0010507
    go_label: negative regulation of autophagy
    family: PTHR10807
    ibd_node: PTN002246859
    tree_reading: >-
      IBD at PTN002246859 (50 leaves) with one seed, human MTMR9 (Q96QG7). The node's children are PTN000086907
      (48 leaves, the MTMR9 and MTMR9L clade, holding both mtm-9 leaf PTN000086958 and the seed) and single
      Nematostella and Trichoplax leaves. mtm-9 joins the seed at PTN000086907, which carries PAINT losses of
      both phosphatase activities. The seed's partner MTMR8 (Q96EF0) joins MTMR6 and MTMR7 at PTN002474126
      (56 leaves); worm mtm-6 (G5ED68) is in the protostome clade PTN002585037 (12 leaves) and joins the three
      at PTN000087020 (70 leaves).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q96QG7 GO:0010507 returned involved_in IPI PMID:22647598 (UniProt) with UniProtKB:Q96EF0-1
      (MTMR8). Human MTMR8 Q96EF0 and MTMR6 Q9Y217 carry no row to the term.
    - >-
      publications/PMID_22647598.md (abstract only; PMC returned no full text). The abstract states that the
      MTMR6/R9 complex inhibits stress-induced apoptosis and the MTMR8/R9 complex inhibits autophagy.
    - >-
      interpro/panther/PTHR10807/PTHR10807-review.yaml leaves the term UNRESOLVED and says autophagy phenotypes
      must not be transferred as one package with binding and regulation.
    review_edited: true
    notes: >-
      The node is not too deep for the target, which sits in the seeded clade. The ground is that the seed
      evidence is partner-dependent by its own abstract (MTMR8/MTMR9, not MTMR6/MTMR9) and the worm partner
      MTM-6 is not the counterpart of MTMR8 in particular. The earlier reason leaned on no autophagy phenotype
      being reported and on subfamily numbers, and said the seed acts through MTMR6/MTMR8; it was rewritten.
      Autophagic flux in mtm-9 and mtm-6 mutants would settle it. A PAINT curator could add the partner as
      context, but no node change follows.
- gene_file: genes/worm/lon-2/lon-2-ai-review.yaml
  rows:
  - go_id: GO:0045202
    go_label: synapse
    family: PTHR10822
    ibd_node: PTN000088172
    tree_reading: >-
      IBD at PTN000088172 (92 leaves) with six seeds. Mouse Gpc1, Gpc4 and Gpc6 and rat Gpc4 and Gpc6 are in the
      vertebrate child clade PTN000850491 (86 leaves). The sixth seed, fly dally-like (FB:FBgn0041604, Q9VUG1),
      is in the other child, the protostome clade PTN000088356 (6 leaves, one per species), together with lon-2
      (leaf PTN004200685); the two join at PTN000088356. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for GO:0045202 and descendants. Mouse Gpc1 Q9QZF2, Gpc4 P51655 and Gpc6 Q9R087 carry is_active_in
      EXP and IDA PMID:16452087 (SynGO); mouse Gpc4 and rat Gpc6 A0A096MJY1 carry glutamatergic synapse rows
      (SynGO); fly dlp Q9VUG1 carries located_in synapse IDA PMID:16476662 and neuromuscular junction IDA from
      three papers (FlyBase). lon-2 Q18530 has only the IBA.
    - >-
      PubMed abstract of PMID:16476662 (doi 10.1016/j.neuron.2006.01.026). Syndecan and Dallylike are synaptic
      proteins at the fly neuromuscular junction and Dlp regulates active zone form and function through LAR.
    - >-
      genes/worm/lon-2/lon-2-deep-research-wormbase.md and -falcon.md. lon-2 activity is required in the
      hypodermis, and its guidance role is cell non-autonomous from epidermal cells.
    review_edited: true
    notes: >-
      The node is seeded in both child clades, including the target's own, so depth is not the ground. The call
      holds, narrowly, on the target. LON-2 is a hypodermal product whose known sites of action are the
      hypodermal surface and the substrate under migrating axons. That is short of evidence of absence from
      synapses; a reviewer who reads the fly seed as sufficient could defend KEEP_AS_NON_CORE. The earlier
      reason said synaptic glypicans are vertebrate, and the propagation_review named the wrong node
      (PTN002247069, the root, in place of PTN000088172); both were corrected. No family review exists.
  - go_id: GO:1905475
    go_label: regulation of protein localization to membrane
    family: PTHR10822
    ibd_node: PTN002247069
    tree_reading: >-
      IBD at the family root PTN002247069 (158 leaves) with two seeds, rat Gpc4 (RGD:1359399) and rat Gpc6
      (RGD:1593308). Both are in the vertebrate GPC1, GPC2, GPC4 and GPC6 clade PTN000850491 (86 leaves) and join
      each other at PTN000088291 (83 leaves). lon-2 joins them at PTN000088172 (92 leaves), one node below
      PTN000088350 (156 leaves, which adds the GPC3 and GPC5 branch) and two below the root. PAINT also carries
      IBDs for the specific descendant term GO:0098696 at PTN000088293 and PTN002247070 inside the vertebrate
      clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000088291
    evidence_checked:
    - >-
      QuickGO for GO:1905475 and descendants, rat. Gpc4 (F7F698) and Gpc6 (A0A096MJY1) carry GO:0098696
      regulation of neurotransmitter receptor localization to postsynaptic specialization membrane, IDA and IMP,
      PMID:22722203 (SynGO). No other glypican queried (mouse, fly dally and dlp, worm gpn-1 and lon-2, human)
      has an experimental row.
    - RGD REST lookup. RGD:1359399 is Gpc4 and RGD:1593308 is Gpc6.
    review_edited: true
    notes: >-
      Sound seeds for a synapse-specific function of two vertebrate paralogs, generalized to the parent term and
      placed at the family root, three nodes above their join. The target's protostome clade has no seed for
      this term and LON-2's known role is extracellular modulation of BMP and netrin signaling. The earlier
      reason opened with no evidence that LON-2 regulates protein localization; it was rewritten around the
      node. Since PAINT already holds the specific term inside the vertebrate clade, removing the root IBD
      would lose nothing.
- gene_file: genes/worm/nud-2/nud-2-ai-review.yaml
  rows:
  - go_id: GO:0005813
    go_label: centrosome
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: &nud2_root >-
      IBD at the family root PTN000100519 (82 leaves). nud-2 (leaf PTN000100583) is in the protostome clade
      PTN002589161 (10 leaves, with fly nudE Q9VT70). Its sister under the bilaterian node PTN000100522 (64
      leaves) is the deuterostome clade PTN002589136 (54 leaves), inside which vertebrate NDE1 and NDEL1 join
      at PTN000100525 (50 leaves). Fungal NudE proteins are in PTN000858805 (10 leaves), which carries a PAINT
      loss (NOT IRD) of centrosome.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &nud2_move
      paint_action: MOVE_IBD
      target_node_id: PTN000100525
    evidence_checked:
    - >-
      QuickGO for GO:0005813 and descendants. All four seeds are vertebrate, mouse Nde1 Q9CZA6 (IDA
      PMID:11163258, PMID:15473967), mouse Ndel1 Q9ERR1 (IDA, six papers), rat Ndel1 Q78PB6 (IDA PMID:17035248)
      and human NDE1 Q9NXR1 (IDA PMID:21399614, PMID:21529752). Fly nudE and worm nud-2 have no experimental
      row.
    - >-
      interpro/panther/PTHR10921/PTHR10921-review.yaml assesses the node TOO_DEEP and quotes PMID:19417004 that
      fly NudE does not accumulate near centrosomes in neuroblasts or spermatocytes.
    - The review quotes PMID:35817834 and PMID:29192061 on where NUD-2 is seen and on normal centrosome behaviour in the null.
    review_edited: false
    notes: >-
      Seeds all in the vertebrate clade; the one direct test in the target's own protostome clade (fly) was
      negative and worm imaging places NUD-2 in the nucleus, spindle region and kinetochores. That is close to
      a MISPLACED_IBD removal, but worm centrosomal absence was not itself tested, so the over-annotation call
      is kept. The existing reason gives the target evidence and does not misstate the tree; left alone. The
      family review asks for the same restriction but had no node id; PTN000100525 is the vertebrate NDE1 and
      NDEL1 join.
  - go_id: GO:0007020
    go_label: microtubule nucleation
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: *nud2_root
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *nud2_move
    evidence_checked:
    - >-
      QuickGO. The single seed is mouse Nde1 Q9CZA6, acts_upstream_of_or_within, IDA, PMID:11163258 (MGI). No
      other family member queried has an experimental row.
    - >-
      Family review assesses the node TOO_DEEP and notes NudE proteins have no nucleating activity; the effect
      is on recruitment of nucleation factors to the centrosome.
    review_edited: false
    notes: >-
      One mouse seed annotated with acts_upstream_of_or_within, propagated by PAINT as involved_in from the
      family root. The seed's own qualifier concedes indirectness, so SEED_OVERREACH also applies. The worm null
      assembles spindles normally (PMID:29192061, quoted in the row). The reason states that evidence; left
      alone.
  - go_id: GO:0007100
    go_label: mitotic centrosome separation
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: *nud2_root
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *nud2_move
    evidence_checked:
    - >-
      QuickGO. The single seed is mouse Ndel1 Q9ERR1, acts_upstream_of_or_within, IMP and IGI, PMID:17060449
      (MGI).
    - >-
      The row quotes PMID:29192061. Centrosome separation occurs with essentially identical kinetics in nud-2
      null embryos and controls, while LIS-1 depletion blocks it; the review description adds that NUD-2 becomes
      essential when LIS-1 is reduced.
    review_edited: false
    notes: >-
      Direct evidence on the target that the function is conditional, visible only when LIS-1 is limiting, which
      is the TARGET_DOUBT case. The node is also too deep (one vertebrate seed at the family root), hence the
      move. Reason already states this; left alone.
  - go_id: GO:0016477
    go_label: cell migration
    family: PTHR10921
    ibd_node: PTN000100522
    tree_reading: >-
      IBD at PTN000100522 (64 leaves, the bilaterian node) with three seeds. Fly nudE (FB:FBgn0036059, Q9VT70)
      is in the protostome child clade PTN002589161 (10 leaves) together with nud-2. Mouse Nde1 and Ndel1 are in
      the sister deuterostome clade PTN002589136 (54 leaves). The node is seeded on both sides of its split. No
      loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for GO:0016477 and descendants. Fly nudE Q9VT70 involved_in border follicle cell migration IMP
      PMID:22808215 (FlyBase); mouse Nde1 Q9CZA6 neuron migration IMP PMID:11163258; mouse Ndel1 Q9ERR1 cell
      migration IMP PMID:18331715 and neuron migration IGI PMID:16107726 (MGI).
    - Family review assesses this node SOUND and calls the worm over-annotation an absence-of-evidence argument.
    review_edited: true
    notes: >-
      The earlier reason was that no worm data implicate NUD-2 in cell migration. The node is seeded in the
      target's own clade and nothing on NUD-2 argues against the term, so it is kept as non-core. The PMID:27697906
      quote was kept verbatim as context for what the worm studies cover. propagation_review was reset from
      UNRESOLVED to NO_FAILURE_NON_CORE.
  - go_id: GO:0051642
    go_label: centrosome localization
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: >-
      IBD at the family root PTN000100519 (82 leaves) with two seeds. Fly nudE (FB:FBgn0036059) is in the
      protostome clade PTN002589161 (10 leaves) together with nud-2; mouse Ndel1 is in the deuterostome clade
      PTN002589136 (54 leaves). Both sit under the bilaterian node PTN000100522 (64 leaves); the root also
      covers the fungal clade PTN000858805 (10 leaves) and protists.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. Fly nudE Q9VT70 involved_in IMP PMID:19417004 (FlyBase); mouse Ndel1 Q9ERR1
      acts_upstream_of_or_within IMP PMID:18331715 (MGI).
    - >-
      The row quotes PMID:29192061, that in contrast to LIS-1, NUD-2 is largely dispensable for the
      dynein-dependent pulling forces that position centrosomes and pronuclei during the first embryonic
      division.
    review_edited: false
    notes: >-
      Unlike the other root rows, a seed sits in the target's own clade, so depth is not the ground for the
      worm. The ground is the direct worm result that NUD-2 is largely dispensable for centrosome positioning.
      The family review asks to move this IBD to PTN000100522 for the sake of the fungal clade; that move would
      not take the term off nud-2, so no fix is named for this row. Reason is target-based and accurate; left
      alone.
- gene_file: genes/worm/atg-7/atg-7-ai-review.yaml
  rows:
  - go_id: GO:0034727
    go_label: piecemeal microautophagy of the nucleus
    family: PTHR10953
