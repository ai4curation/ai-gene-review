      this term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000859988
    evidence_checked:
    - Batch H03 (human ATG7) records QuickGO P38862 GO:0034727 IMP PMID:18701704 (SGD) and the seed abstract; not repeated.
    - Join nodes of G5EBK4 with P38862 and with O95352 computed from the cached PTHR10953 tree.
    review_edited: false
    notes: >-
      Same node, seed, ground and fix as human ATG7 in batch H03. The process is defined at yeast
      nucleus-vacuole junctions; one fungal seed, animal clade unseeded. The existing reason names the node and
      the seed and gives that reason for doubt; left alone.
- gene_file: genes/worm/lgg-1/lgg-1-ai-review.yaml
  rows:
  - go_id: GO:0050811
    go_label: GABA receptor binding
    family: PTHR10969
    ibd_node: PTN000861087
    tree_reading: >-
      IBD at PTN000861087 (61 leaves, the GABARAP and GABARAPL1 node) with two seeds, human GABARAP (O95166)
      and rat Gabarap (RGD:61911, P60517). The node's children are PTN000103619 (59 leaves) and single
      Nematostella and Trichoplax leaves. Inside PTN000103619 both seeds are in the vertebrate clade
      PTN000103656 (50 leaves); lgg-1 (leaf PTN000103718) is in the protostome clade PTN002590206 (9 leaves) and
      joins the seeds at PTN000103619. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000103656
    evidence_checked:
    - >-
      QuickGO GO:0050811. Human GABARAP O95166 enables IPI PMID:9892355 with UniProtKB:P18507 (GABRG2); rat
      Gabarap P60517 enables IPI PMID:15601949 with RGD:62259; lgg-1 Q09490 has only the IBA.
    - Seed lineages printed from the cached PTHR10969 tree; both pass through PTN000103656 (50 leaves).
    - Family review lists the node as UNRESOLVED (not examined, outside its fungal scope).
    review_edited: false
    notes: >-
      The row was already rewritten in the 2026-11-21 pass with the node, both seeds, their clade and the
      unseeded protostome clade, and its node ids and sizes match the tree. The biological reason for doubt is
      that both seeds bind the gamma 2 subunit of the vertebrate GABA(A) receptor, a partner with no stated worm
      counterpart. Left alone.
- gene_file: genes/worm/lgg-2/lgg-2-ai-review.yaml
  rows:
  - go_id: GO:0008017
    go_label: microtubule binding
    family: PTHR10969
    ibd_node: PTN000861057
    tree_reading: >-
      IBD at PTN000861057 (60 leaves, the animal LC3 node) with one seed, rat Map1lc3b (RGD:621315, Q62625). The
