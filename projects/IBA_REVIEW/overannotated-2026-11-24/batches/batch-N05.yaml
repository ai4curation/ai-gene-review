      (SGD:S000001214, P38862). The node's children are PTN000102342 (54 leaves), holding target and seed, and
      PTN007473297 (58 leaves, plants and protists). atg-7 (leaf PTN000102374) is in the animal clade
      PTN000859973 (36 leaves) with human ATG7, which it joins at PTN000102344 (34 leaves); it joins the yeast
