- gene_file: genes/human/GTPBP2/GTPBP2-ai-review.yaml
  rows:
  - go_id: GO:0006414
    go_label: translational elongation
    family: PTHR43721
    ibd_node: PTN001500717
    tree_reading: >-
      IBD at the family root PTN001500717 (421 leaves) with nine seeds, among them mouse Gtpbp2 (MGI:1860138),
      mouse Eefsec (MGI:2137092), human EEFSEC (P57772) and human and bovine mitochondrial EF-Tu (P49411,
      P49410). Children are PTN001897444 (378 leaves, holding the target) and PTN009172040 (43 leaves, bacterial
      and plastid EF-Tu). On the target's lineage PTN001136517 (36 leaves, the GTPBP2 clade) carries a NOT
      IRD for GO:0003746 translation elongation factor activity. No loss is recorded for GO:0006414.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO with descendants of GO:0006414. Mouse Gtpbp2 (Q3UJK4) carries acts_upstream_of_or_within GO:0072344
      rescue of stalled cytosolic ribosome IMP PMID:25061210 (MGI); human GTPBP2 (Q9BX10) carries NOT enables
      GO:0003746 IDA PMID:30108131 (FlyBase). Both queries also returned the IBA.
    - >-
      QuickGO ontology paths. GO:0072344 is_a GO:0002182 cytoplasmic translational elongation is_a GO:0006414;
      its definition calls it a process of cytosolic translational elongation.
    - >-
      interpro/panther/PTHR43721/PTHR43721-review.yaml marks this node UNRESOLVED because the GTPBP2 clade
      is stopped for the activity and not for the process.
    review_edited: true
    notes: >-
      Not an over-annotation. The target's own ortholog is a seed, and what it shows is a descendant of the
      term, so the general term is true and the row's own evidence supports the specific one. MODIFY to GO:0072344.
      The loss of elongation factor activity (the IRD and the NOT IDA) is consistent with this, since ribosome
      rescue is the part of elongation GTPBP2 takes. The family review's worry that the process should be
      pruned with the activity does not follow once the Gtpbp2 seed is read. A more specific IBD for GO:0072344
      at PTN001136517 would serve the clade better than the root term, but that is an addition, not one of
      the listed fixes. PMID:25061210 was not read; the seed row is taken as annotated.
- gene_file: genes/human/AIFM2/AIFM2-ai-review.yaml
  rows:
  - go_id: GO:0043065
    go_label: positive regulation of apoptotic process
    family: PTHR43735
    ibd_node: PTN002464370
    tree_reading: >-
      IBD at PTN002464370 (69 leaves) with three seeds, human AIFM2 itself (Q9BRQ8), yeast AIF1 (SGD:S000005357)
      and a Candida albicans gene (CGD:CAL0000195769). Children are PTN002464371 (35 leaves, animal AIFM2,
      holding the target) and PTN002464427 (34 fungal leaves, holding yeast AIF1 and the Candida members).
      The same node carries IBDs for negative regulation of ferroptosis, apoptotic mitochondrial changes
      and mitochondrial membrane. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002464427
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human AIFM2 (Q9BRQ8) involved_in IDA PMID:11980907 (UniProt); yeast AIF1
      (P52923) involved_in IMP PMID:15381687 (SGD). The Candida seed was not queried.
    - >-
      The gene review quotes PMID:11980907 (overexpression of AMID induced cell death with apoptotic morphology)
      and marks that IDA row over-annotated as well.
    - No family review exists for PTHR43735.
    review_edited: false
    notes: >-
      The only seed in the animal clade is the target's own overexpression result, which the review judges
      over-annotated on the same row, so IBA and IDA are judged together and stay consistent. The fungal
      seeds are a separate matter and were not examined beyond their evidence codes. If the human seed row
      is withdrawn the IBD belongs on the fungal clade, hence MOVE_IBD. The reason does not name the node
      but rests on a real ground (overexpression of unknown relevance, disputed function) and does not misstate
      the tree, so the file was left alone.
- gene_file: genes/human/PLD6/PLD6-ai-review.yaml
  rows:
  - go_id: GO:0048477
    go_label: oogenesis
    family: PTHR43856
    ibd_node: PTN000478649
    tree_reading: >-
      IBD at PTN000478649 (31 leaves) with two seeds, fly zuc (FB:FBgn0261266) and mouse Pld6 (MGI:2687283).
      Children are PTN002466603 (22 deuterostome leaves, holding the target and mouse Pld6) and PTN002888337
      (9 protostome leaves, holding fly zuc). The same node carries IBD piRNA processing. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002888337
    evidence_checked:
    - >-
      QuickGO with descendants of GO:0048477. Fly zuc (Q9VKD7) carries oogenesis HMP PMID:1783295 and TAS PMID:10449356
      and GO:0030717 IMP PMID:9732269 (FlyBase). Mouse Pld6 (Q5SWZ9) carries no oogenesis row; its only row
      under the term is GO:0030719 P granule organization IMP PMID:21397848 (UniProt).
    - >-
      The gene review quotes PMID:21397847 (MitoPLD null females showed no discernible phenotype and were fertile)
      and PMID:28115634 (oocyte piRNA level down to 50 percent, milder than in males).
    - No family review exists for PTHR43856.
    review_edited: false
    notes: >-
      Target-specific evidence on the mouse ortholog argues that the oogenesis role is not conserved in mammals,
      short of showing loss in human. The mouse seed counts toward this node only through a P granule organization
      row from a paper on male germ cells, so the deuterostome clade has no oogenesis evidence of its own and
      the IBD would sit better on the protostome clade. The reason is node-aware; file left alone.
  - go_id: GO:0051321
    go_label: meiotic cell cycle
    family: PTHR43856
    ibd_node: PTN000478648
    tree_reading: >-
      IBD at PTN000478648 (35 leaves) with two seeds, fly zuc (FB:FBgn0261266) and mouse Pld6 (MGI:2687283).
      Children are PTN001082598 (34 leaves, animals and Monosiga, holding the target and both seeds) and
      PTN002888344 (one Dictyostelium leaf). The same node carries IBD cardiolipin phospholipase D activity.
      No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000478648
    evidence_checked:
    - >-
      QuickGO with descendants of GO:0051321. Mouse Pld6 (Q5SWZ9) involved_in meiotic cell cycle IMP PMID:21397847
      and IMP PMID:21397848 (UniProt). Fly zuc (Q9VKD7) carries GO:0030717 IMP PMID:9732269 (FlyBase).
    - >-
      The gene review quotes PMID:21397848 (meiotic arrest, DNA damage and male sterility characteristic of
      mice lacking piRNAs).
    review_edited: false
    notes: >-
      Both seeds are mutant phenotypes that follow from piRNA loss; the reason says so (necessity is not participation).
      The IEA and ISS rows on the same term carry the same action. File left alone.
- gene_file: genes/human/HSD17B12/HSD17B12-ai-review.yaml
  rows:
  - go_id: GO:0005783
    go_label: endoplasmic reticulum
    family: PTHR43899
