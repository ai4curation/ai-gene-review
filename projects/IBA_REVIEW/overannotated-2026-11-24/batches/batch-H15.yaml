genes:
- gene_file: genes/human/CDK5RAP1/CDK5RAP1-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR43020
    ibd_node: PTN000228824
    tree_reading: >-
      IBD at PTN000228824 (117 leaves) with two seeds, E. coli MiaB (P0AEI1) and human CDK5RAP1 itself
      (Q96SZ6). The node has twelve child clades; eleven are bacterial MiaB clades (E. coli MiaB sits in
      PTN000228834, 14 leaves) and one, PTN009166388 (86 leaves), is the eukaryotic CDK5RAP1 clade that
      holds the target. Inside it PTN000228777 (85 leaves) carries IBD mitochondrion and IBD mitochondrial
      tRNA modification, and three NOT IRD records for other terms. No loss is recorded for cytosol.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000228777
    evidence_checked:
    - >-
      QuickGO by accession and GO id. E. coli MiaB (P0AEI1) has located_in cytosol IDA PMID:18304323 (EcoCyc).
      Human CDK5RAP1 (Q96SZ6) has is_active_in cytosol IDA PMID:22422838 (FlyBase). Both queries also returned
      the IBA row, so the query shape returns hits.
    - >-
      The gene review's own IDA row for PMID:22422838 quotes the paper: the cytoplasmic signal is from overexpressed
      variant 2, which lacks the mitochondrial import signal; PMID:28981754 is quoted for ms2i6A being confined
      to mitochondrial tRNA.
    - No family review exists for PTHR43020.
    review_edited: false
    notes: >-
      The written reason already names the node, both seeds and what each shows, so the file was left alone.
      The human seed is the over-reach (an MTS-less overexpressed variant, annotated is_active_in); the bacterial
      seed is sound, and cytosol is the ancestral bacterial location. A loss at the eukaryotic node PTN000228777,
      where mitochondrion is already asserted, would stop the term for the mitochondrial clade without touching
      the bacterial clades. The human IDA row carries the same action in the review.
- gene_file: genes/human/KHK/KHK-ai-review.yaml
  rows:
  - go_id: GO:0005979
    go_label: regulation of glycogen biosynthetic process
    family: PTHR43085
    ibd_node: PTN001634026
    tree_reading: >-
      IBD at PTN001634026 (27 leaves) with one seed, mouse Khk (MGI:1096353). Children are PTN000061856
      (24 leaves, animals and two fungi, holding both the target and the mouse seed) and PTN000833144 (3
      Dictyostelium leaves). The same node carries IBDs for ketohexokinase activity, fructose metabolic
      process and cytoplasm. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001634026
    evidence_checked:
    - >-
      QuickGO for mouse Khk (P97328) and GO:0005979 returned one experimental row, acts_upstream_of_or_within
      IMP PMID:22371574 (MGI), plus the IBA.
    - >-
      PubMed abstract of PMID:22371574 (knockout mice lacking fructokinase isoforms and fructose-induced metabolic
      syndrome); not cached locally and not read in full. The abstract does not mention glycogen.
    - No family review exists for PTHR43085.
    review_edited: false
    notes: >-
      The seed is a knockout phenotype recorded with acts_upstream_of_or_within, and the IBD turns it into
      involved_in regulation for the whole clade. The review's reason (a downstream metabolic consequence
      of fructose phosphorylation, not a regulatory activity of the kinase) is that ground, and its propagation_review
      names the node and the mouse seed, so the file was left alone.
- gene_file: genes/human/MAP3K20/MAP3K20-ai-review.yaml
  rows:
  - go_id: GO:0007059
    go_label: chromosome segregation
    family: PTHR43289
    ibd_node: PTN002878623
    tree_reading: >-
      IBD at PTN002878623 (16 leaves) with one seed, human NEK6 (Q9HC98). Children are PTN008680335 (14
      leaves, NEK6 of tetrapods plus the target) and PTN002878632 (2 fish nek6 leaves). The target leaf
      PTN002535043 is the sister of human NEK6 in the two-leaf, one-species node PTN008680336, inside
      PTN002878625 (4 leaves, 3 species). Every other leaf under the IBD node is a NEK6 ortholog. No loss
      recorded.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002535043
    evidence_checked:
    - >-
      QuickGO for NEK6 (Q9HC98) and GO:0007059 returned involved_in IDA PMID:14563848 (UniProt). PubMed abstract
      of PMID:14563848 read (Nek6 required for mitotic progression, metaphase arrest on inhibition).
    - >-
      genes/human/MAP3K20/MAP3K20-uniprot.txt cross-references PTHR44329:SF288, not PTHR43289.
    - >-
      interpro/panther/PTHR44329/PTHR44329-review.yaml notes that PANTHER 19 grafts the human MAP3K20 leaf into
      a Homininae NEK6 clade of PTHR43289 at maximal branch length, that its mouse, rat, cow, Xenopus and
      zebrafish orthologs are PTHR44329:SF288, and treats the placement as an artefact.
    review_edited: true
    notes: >-
      A misplaced leaf, not a real loss. TARGET_LOSS is the nearest ground, as for earlier misplaced-leaf
      cases in the REMOVE pass. The term was inferred for NEK6 and reaches MAP3K20 only through the graft,
      so over-annotation understated the problem. The durable fix is removing the MAP3K20 leaf from the PTHR43289
      tree; within PAINT the available action is a loss at the leaf. Reason rewritten and propagation_review
      added. The cytosol IBA from the same node is accepted in the review on MAP3K20's own evidence and was
      not touched.
  - go_id: GO:0030071
    go_label: regulation of mitotic metaphase/anaphase transition
    family: PTHR43289
    ibd_node: PTN002878623
    tree_reading: >-
      Same node and same single seed as the chromosome segregation row. IBD at PTN002878623 (16 leaves), seed
      human NEK6 (Q9HC98); the target leaf PTN002535043 is the sister of human NEK6 in the one-species node
      PTN008680336 and is the only non-NEK6 leaf under the node.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002535043
    evidence_checked:
    - QuickGO for NEK6 (Q9HC98) and GO:0030071 returned involved_in IDA PMID:14563848 (UniProt).
    - MAP3K20 UniProt record and the PTHR44329 family review, as for the row above.
    review_edited: true
    notes: Same misplaced-leaf case as GO:0007059. Reason rewritten and propagation_review added.
- gene_file: genes/human/MTIF2/MTIF2-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR43381
    ibd_node: PTN001897651
    tree_reading: >-
      IBD at the family root PTN001897651 (376 leaves) with 14 seeds, among them human MTIF2 itself (P46199),
      bovine MTIF2 (P46198), human eIF5B (O60841) and E. coli IF2 (P0A705). Children are PTN002458788 (343
      leaves, eukaryotic eIF5B and organellar IF2, holding the target) and PTN000562019 (33 bacterial infB
      leaves, with its own IBD cytosol). Inside the target's lineage PTN000561956 (50 leaves) carries IBD
      mitochondrion (4 seeds) and IBD mitochondrial translational initiation. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO with descendants of GO:0005737. Human MTIF2 (P46199) carries located_in mitochondrion IDA (HPA)
      and HTP PMID:34800366 and is_active_in mitochondrial matrix IC PMID:36629253; bovine MTIF2 (P46198)
      carries located_in mitochondrion IDA PMID:12095986; human eIF5B (O60841) carries located_in cytoplasm
      IDA PMID:12426392.
    - >-
      interpro/panther/PTHR43381/PTHR43381-review.yaml assesses this node SOUND (cytoplasm true of every lineage
      in the GO sense, specific compartments asserted on lineage nodes).
    review_edited: true
    notes: >-
      The node is soundly seeded, the target is one of its seeds and nothing argues against the term, so
      this is not an over-annotation. The term is true only because mitochondrion is part of cytoplasm and
      is entailed by the accepted mitochondrion IBA from PTN000561956, hence TOO_GENERAL. The old reason said
      the assertion reflects the cytosolic and bacterial members, which misstated the seed list. The family
      review quotes a different sentence of this gene review, which was not touched.
- gene_file: genes/human/ALDH3A1/ALDH3A1-ai-review.yaml
  rows:
  - go_id: GO:0004028
    go_label: 3-chloroallyl aldehyde dehydrogenase activity
    family: PTHR43570
    ibd_node: PTN002882967
    tree_reading: >-
      IBD at PTN002882967 (39 leaves) with two seeds, rat Aldh3a1 (RGD:2088) and rat Aldh3a2 (RGD:61866).
      Children are PTN009170804 (33 leaves, tetrapod ALDH3A1 and ALDH3A2, holding the target and both seeds)
      and PTN002882976 (6 fish leaves). Within the target's lineage PTN000746370 (28 leaves) splits into
      the ALDH3A1 clade PTN000193127 (14 leaves, target and rat Aldh3a1) and the ALDH3A2 clade PTN000193153
      (14 leaves, rat Aldh3a2). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002882967
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Aldh3a1 (P11883) enables IDA PMID:2831537 (RGD); rat Aldh3a2 (P30839)
      enables IDA PMID:1717467 (RGD); mouse Aldh3a1 (P47739) has only ISO from RGD:2088 and an ARBA IEA.
    - >-
      PubMed abstracts. PMID:2831537 is the cloning of a cDNA for tumor-associated aldehyde dehydrogenase,
      which directs synthesis of a functional enzyme in bacteria. PMID:1717467 is the cloning and expression
      of rat liver microsomal aldehyde dehydrogenase. Neither mentions 3-chloroallyl aldehyde. Not read in
      full.
    - interpro/panther/PTHR43570/PTHR43570-review.yaml does not assess this node.
    review_edited: true
    notes: >-
      Action unchanged. The old reason rested on the absence of a measurement on the human enzyme, which
      is not a ground, and called the node euteleostome ALDH3 without saying what the seeds are. Rewritten
      to name the node, the two RGD seed rows and their papers. This looks like pattern 20 (a seed annotated
      to a term its paper does not show; here a specific xenobiotic reaction used for general aldehyde dehydrogenase
      activity). Abstracts only, so the seed rows are a query for RGD and the row is not removed.
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR43570
    ibd_node: PTN008111916
    tree_reading: >-
      IBD at the family root PTN008111916 (352 leaves) with seven seeds. Children are PTN008451627 (341 leaves,
      holding the target and the seeds) and PTN008112064 (11 bacterial leaves). The target sits in the ALDH3A1
      clade PTN000193127 (14 leaves), sister of the ALDH3A2 clade PTN000193153 (14 leaves) under PTN000746370.
      The only seed inside PTN000193127 is mouse Aldh3a1 (MGI:1353451, P47739). An IBD for plasma membrane
      exists elsewhere in the family at PTN002882954. No loss recorded.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000193127
    evidence_checked:
    - >-
      QuickGO with descendants of GO:0016020. Mouse Aldh3a1 (P47739) located_in membrane IDA PMID:25286108
      (MGI); mouse Aldh3a2 (P47740) located_in membrane IDA PMID:25286108 (MGI) and peroxisomal membrane IDA;
      rat Aldh3a2 (P30839) ER membrane IDA PMID:1717467; T. brucei Q583M9 mitochondrial outer membrane IDA.
      Human ALDH3A1 (P30838) has no experimental membrane row; its cellular-component rows are three cytosol
      IDAs, one ER IDA (LIFEdb fusion) and extracellular rows.
    - >-
      QuickGO by reference PMID:25286108. The same paper gives mouse Aldh3a1 located_in cytoplasm IDA (MGI),
      cytosol IDA (UniProt) and membrane IDA (MGI).
    - >-
      PMID:25286108, author manuscript from the Hokkaido University repository (linked by Europe PMC), read
      for the fractionation result. It says cytosolic ALDH3A1 was detected in the soluble fraction and ALDH3A2
      in the membrane fraction, and the discussion says ALDH3A1 was found to be a soluble protein while the
      other ALDH3 subfamily members were membrane proteins. The PubMed abstract does not state this.
    - >-
      interpro/panther/PTHR43570/PTHR43570-review.yaml assesses the node SOUND on the grounds that yeast HFD1
      retains the IBA; it does not consider the ALDH3A1 clade.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE, together with the Ensembl IEA row on the same term (transferred
      from the same mouse row). The node is sound for the anchored members; the single seed in the target's
      clade contradicts its own paper, and the paper is direct evidence that the ALDH3A1 clade is soluble.
      The mouse Aldh3a1 membrane IDA (MGI, PMID:25286108) should go to MGI as a seed-side correction; it
      is recorded in the row's propagation_review as SOURCE_BAD but not as a source_defects entry, because
      that slot describes the human row's own source. The manuscript read is the accepted author version,
      not the published PDF. The family review's SOUND verdict for this node should gain a pruning note for
      PTN000193127.
