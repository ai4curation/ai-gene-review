- gene_file: genes/human/CACYBP/CACYBP-ai-review.yaml
  rows:
  - go_id: GO:0019005
    go_label: SCF ubiquitin ligase complex
    family: PTHR13164
    ibd_node: PTN000322962
    tree_reading: >-
      IBD at the family root PTN000322962 (47 leaves) with one seed, mouse Cacybp (MGI:MGI:1270839,
      Q9CXW3). Children are PTN000994851 (33 leaves, animals; target and seed here) and PTN004407259
      (14 leaves, protists). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000322962
    evidence_checked:
    - QuickGO Q9CXW3 x GO:0019005 returns part_of IMP PMID:15996101, assigned by CAFA.
    - >-
      PubMed abstract of PMID:15996101 (doi 10.1021/bi0502689), cached abstract only. An NMR study
      of SIP domain structure that maps its Siah-1 and Skp1 interaction sites and speaks of an
      SCF-type complex. It shows binding to Skp1, not membership of a cullin-1 complex.
    - >-
      publications/PMID_11389839.md (abstract only) describes Skp1 as a component of
      Skp1-Cullin-F box complexes; no cullin is reported in the Siah-1, SIP, Skp1, Ebi complex.
    review_edited: false
    notes: >-
      The reason argues from the composition of the Siah1 complex against the definition of the
      term, which is the substance of the seed over-reach, and the IEA row carries the same action.
      Left alone. Seed paper read as abstract only, so the mouse row is a query for the annotating
      group, not a confirmed defect.
  - go_id: GO:0007507
    go_label: heart development
    family: PTHR13164
    ibd_node: PTN000322964
    tree_reading: >-
      IBD at PTN000322964 (32 leaves, bilaterian orthologs) with two seeds, one in each child clade.
      Rat Cacybp (RGD:1303146, Q6AYK6) is in PTN001407883 (27 leaves, chordates; target here) and
      Drosophila CG3226 (FB:FBgn0029882, Q9W3Y3) in PTN002663030 (5 leaves, protostomes).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000322964
    evidence_checked:
    - >-
      QuickGO. Q6AYK6 x GO:0007507 returns IEP PMID:16440310 (RGD), plus IDA on the child term
      GO:0055007 cardiac muscle cell differentiation from the same paper. Q9W3Y3 returns IMP
      PMID:22398840 (FlyBase).
    - >-
      PubMed abstracts. PMID:16440310 (doi 10.1002/jcb.20710) reports developmental regulation in
      postnatal rat heart and overexpression effects in H9C2 cells and primary cardiomyocytes.
      PMID:22398840 (doi 10.1007/s00438-012-0684-x) reports that deletion of CG3226 causes
      cardiomyopathy in adult flies. The second is cached with full text but only the abstract was read.
    review_edited: true
    notes: >-
      Action unchanged. The reason was "no direct evidence links CACYBP to heart development", which
      is not a ground. Rewritten to name the node and both seeds and to say why an expression
      pattern and an adult cardiomyopathy phenotype do not show participation. The IEA row on the
      same term keeps the same action and was not touched.
- gene_file: genes/human/ATG2B/ATG2B-ai-review.yaml
  rows:
  - go_id: GO:0032266
    go_label: phosphatidylinositol-3-phosphate binding
    family: PTHR13190
    ibd_node: PTN000324023
    tree_reading: >-
      IBD at the family root PTN000324023 (122 leaves) with one seed, yeast ATG2 (SGD:S000005186,
      P53855). Children are PTN000324024 (66 leaves; target, ATG2A and the seed here) and
      PTN007606173 (56 leaves, plants and protists). The seed is in the fungal clade PTN000995663 (14
      leaves) and joins human ATG2B and ATG2A at PTN000324025 (62 leaves). No loss for the term on
      the lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO P53855 x GO:0032266 returns enables IDA PMID:27498190 (SGD); Q96BY7 and Q2TAZ0 have only the IBA.
    - >-
      PubMed abstract of PMID:27498190 (doi 10.1016/j.biocel.2016.08.007). The Atg2 fragment 1074-1447
      contains an APT1 domain that binds phosphatidylinositol phosphates, especially PI3P.
    - >-
      publications/PMID_28820312.md (abstract only) says ATG2B bound liposomes independently of
      PtdIns3P or WDR45, which shows PI3P is not needed for membrane binding, not that it is not bound.
    - genes/human/ATG2A/ATG2A-ai-review.yaml accepts the same IBA from the same node, citing the same seed.
    review_edited: true
    notes: >-
      The earlier reason was absence of an ATG2B-specific headgroup binding assay, which is not a
      ground. The seed is a direct binding assay, the target is inside the seeded clade, and nothing on
      ATG2B argues against the term. Kept as non-core because the defining activity of ATG2B is lipid
      transfer. ATG2A uses ACCEPT for the same row; the two differ only in core versus non-core.
