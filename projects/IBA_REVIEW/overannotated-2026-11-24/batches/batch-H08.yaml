- gene_file: genes/human/ATG9A/ATG9A-ai-review.yaml
  rows:
  - go_id: GO:0034727
    go_label: piecemeal microautophagy of the nucleus
    family: PTHR13038
    ibd_node: PTN000315580
    tree_reading: >-
      IBD at the family root PTN000315580 (144 leaves) with one seed, yeast ATG9 (SGD:S000002308,
      Q12142). The root has two children, PTN000315581 (71 leaves, animals, fungi, amoebozoa; target
      here) and PTN007600571 (73 leaves, plants and protists). The seed lies in the fungal clade
      PTN000989980 (16 leaves) and joins the target at PTN000315582 (69 leaves); human ATG9A and
      ATG9B are in the sister animal clade PTN000989962 (53 leaves), which holds no seed. No loss is
      recorded on the lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000989980
    evidence_checked:
    - QuickGO Q12142 x GO:0034727 returns IMP PMID:18701704 (SGD), so the query shape returns hits.
    - >-
      PMID:18701704 abstract was read in an earlier batch of this pass (batch-H03, ATG7 row); it
      places the process at yeast nucleus-vacuole junctions and reports that atg mutants block it.
    review_edited: false
    notes: >-
      The reason does not name the node, but the propagation_review on the row names PTN000315580 and
      the yeast seed and gives the lineage ground (no nucleus-vacuole junction counterpart in
      mammals), so the file was left alone. No family review exists for PTHR13038.
