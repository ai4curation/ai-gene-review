- gene_file: genes/human/AMN1/AMN1-ai-review.yaml
  rows:
  - go_id: GO:0019005
    go_label: SCF ubiquitin ligase complex
    family: PTHR13318
    ibd_node: PTN002547163
    tree_reading: >-
      IBD at the family root PTN002547163 (1694 leaves) with 14 seeds, all F-box and LRR proteins.
      Human AMN1 is not on an outlying branch. It sits in an 11-leaf vertebrate clade PTN002665840
      whose sister is the FBXL14 clade PTN002665800 (15 leaves), the two joining at PTN009008118 (26
      leaves). The zebrafish seeds fbxl14a and fbxl14b are in that sister clade. FBXL15, FBXL7 (human,
      mouse, fly) join AMN1 at PTN009008112 (162 leaves); the plant, yeast and FBXL5 seeds are farther
      out. No loss is recorded for the term on the lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q5RH13 and Q6TGX5 x GO:0019005 return part_of IPI PMID:11976951 (ZFIN); human FBXL14
      has only the IBA.
    - >-
      genes/human/AMN1/AMN1-bioinformatics/RESULTS.md, the donor table and the F-box comparison; all
      six SF254 members are 249 to 258 residues with no F-box, and only AMN1 residues 2-28 align to
      part of the FBXL15 F-box.
    - >-
      PubMed abstract of PMID:30273335 (doi 10.1371/journal.pgen.1007691). Yeast Amn1, which is not a
      leaf of this family, induces proteolysis of Ace2 through the ubiquitin proteasome system, so a
      protein of this kind acting in substrate delivery without a canonical F-box is not excluded.
    review_edited: false
    notes: >-
      The doubt is structural (the SKP1-binding F-box is absent in the whole AMN1 clade) and there is
      no experiment, so it stops short of showing loss and the action stands. The reason says the IBD
      is placed above the split between the F-box receptors and the AMN1 clade; the tree shows more,
      that AMN1 is nested inside the F-box proteins as the sister of FBXL14, which reads as a
      duplicate that lost the F-box. If a curator accepts the domain loss, the fix would be an IRD
      for this term and GO:0031146 at PTN002665840. The reason also counts seeds reclassified to
      PTHR13382 in UniProt as weakening the inference; Q8W104 and Q8BH16 are leaves of the PTHR13318
      tree in the pinned snapshot, so that point carries no weight. File left alone because the
      stated ground (no F-box) is sound.
  - go_id: GO:0031146
    go_label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
    family: PTHR13318
    ibd_node: PTN002547163
    tree_reading: >-
      IBD at the family root PTN002547163 (1694 leaves) with 8 seeds. The nearest to the target are
      human FBXL15, human and mouse FBXL7 and mouse Fbxl2, which join AMN1 at PTN009008112 (162
      leaves); rice D3 joins at PTN001502181 (1127 leaves) and FBXL5, SKP2A and FBL17 only at the
      root. The AMN1 clade PTN002665840 (11 leaves) and its sister FBXL14 clade hold no seed for
      this term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Seed positions read from the tree by accession (Q9H469, Q9UJT9, Q5BJ29, Q8BH16, Q5VMP0, Q9UKA1, Q9LPL4, Q8W104).
    - genes/human/AMN1/AMN1-bioinformatics/RESULTS.md as for the complex row.
    review_edited: false
    notes: Same judgement and same caveats as the GO:0019005 row.
