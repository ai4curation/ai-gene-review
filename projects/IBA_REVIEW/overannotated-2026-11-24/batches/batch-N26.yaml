- gene_file: genes/HORSE/DUSP5/DUSP5-ai-review.yaml
  rows:
  - go_id: GO:0001706
    go_label: endoderm formation
    family: PTHR10159
    ibd_node: PTN000017039
    tree_reading: >-
      IBD at PTN000017039 (84 leaves, 23 species) with one seed, zebrafish dusp4 (ZDB-GENE-040426-709, Q7SZF3).
      Children are PTN001300103 (83 leaves, seed and target) and one sea urchin leaf. The seed is in the DUSP4
      clade PTN002562877 (21 leaves); horse DUSP5 (F7ALT2, leaf PTN001300107) is in the DUSP5 clade PTN002562861
      (21 leaves); the two join at PTN002562847 (81 leaves, 20 species), the vertebrate duplication node that
      also holds the DUSP1 and DUSP2 clades. No loss recorded for the term.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002562877
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants, Q7SZF3. Two acts_upstream_of_or_within IMP rows from
      PMID:18719100 (ZFIN, each with a morpholino in WITH) on GO:0001706, two more on GO:0001714, and the IBA
      as involved_in.
    - Lineages of F7ALT2 and Q7SZF3 read from the cached PTHR10159 tree.
    - >-
      projects/IBA_REVIEW/rereview-2026-11-21/batches/batch-01.yaml upheld REMOVE for human DUSP5 on this node
      with the same move.
    review_edited: true
    notes: >-
      The horse row and the human row describe the same record on the same tree and carried different actions.
