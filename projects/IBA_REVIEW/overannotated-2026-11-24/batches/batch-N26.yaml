- gene_file: genes/DANRE/sox9a/sox9a-ai-review.yaml
  rows:
  - go_id: GO:0007507
    go_label: heart development
    family: PTHR45803
    ibd_node: PTN002910118
    tree_reading: >-
      IBD at PTN002910118 (27 leaves, 20 species), the vertebrate SOX9 node, with four seeds, human SOX9
      (P48436), chicken SOX9 (P48434), mouse Sox9 (MGI:98371) and zebrafish sox9b (ZDB-GENE-001103-2, Q9DFH1).
      Children are PTN000030548 (23 tetrapod leaves, three seeds) and PTN002910129 (4 leaves, gar, medaka and
      the two zebrafish copies). The target sox9a (Q9DFH2, leaf PTN000030581) and the seed sox9b are the two
      leaves of the single-species node PTN000814308. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Review quotes PMID:23775563 (sox9a knockdown did not cause cardiac malformations or epicardium defects;
      sox9b is required for proepicardium, epicardium and valve formation) and PMID:15689370 (ancestral
      functions partitioned between the Sox9 co-orthologs).
    - >-
      Seed rows were not re-queried in QuickGO; the cardiac role of SOX9 in the tetrapod seeds is not what the
      review disputes.
    - No family review file for PTHR45803.
    review_edited: false
    notes: >-
      Sound node, with the sister paralog itself a seed, so the ground can only be on the target. It is a
      negative morpholino result on sox9a in the same study that found the sox9b requirement, which is doubt
      short of loss, and the reason says why (morpholino negatives are not conclusive). A sox9a mutant scored
      for epicardium and valves, alone and with sox9b, would settle it; a clean negative would make the row a
      REMOVE with a loss on leaf PTN000030581. File left alone.
