- gene_file: genes/DANRE/cryaa/cryaa-ai-review.yaml
  rows:
  - &cry
    go_id: GO:0042026
    go_label: protein refolding
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      IBD at PTN000897708 (293 leaves, 33 species) with seven seeds, all Drosophila small heat shock protein
      genes (FBgn0001223, FBgn0001224, FBgn0001225, FBgn0001226, FBgn0011296, FBgn0031037, FBgn0035817).
      Children are PTN001354880 (279 leaves, bilaterian sHSPs, seeds and target) and PTN000897825 (14
      Nematostella leaves). The zebrafish alpha-crystallins sit under the vertebrate node PTN009180241 (109
      leaves, 20 species); cryaa is leaf PTN000163136 in the CRYAA clade PTN002900910 (23 leaves). No
      vertebrate seed and no loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN000897708
    evidence_checked:
    - >-
      Batch H16 (human CRYAB and HSPB1, same node) read the seed papers. All ten seed rows are involved_in IDA
      by FlyBase from PMID:16572729 and PMID:26705243, in which the sHSP holds heat-denatured luciferase and
      the refolding is done by reticulocyte lysate or cellular HSP70 with ATP. Not re-read here.
    - >-
      Review quotes on the target (PMID:15692462, PMID:22479631 for cryaa and cryaba; PMID:16420472 for cryabb)
      report prevention of chemically induced aggregation only.
    - No family review file for PTHR45640.
    review_edited: false
    notes: >-
      Same call as human CRYAB and HSPB1 in batch H16 and the other sHSPs judged since. The seed assays show a
      holdase keeping a client refoldable while other chaperones refold it, and the review reason says so and
      names the node. As in H16, no PAINT request is made while the scope of the term for holdases is open; if
      it is settled against holdases the fix is REMOVE_IBD at PTN000897708, and if for them the row becomes
      KEEP_AS_NON_CORE. File left alone.
- gene_file: genes/DANRE/cryaba/cryaba-ai-review.yaml
  rows:
