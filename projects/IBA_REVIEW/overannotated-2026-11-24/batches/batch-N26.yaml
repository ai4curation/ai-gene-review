- gene_file: genes/DANRE/tlr21/tlr21-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR24365
    ibd_node: PTN002808045
    tree_reading: >-
      IBD at the family root PTN002808045 (255 leaves, 34 species) with twelve seeds (UniProtKB O60602,
      Q15399, Q9GL65, O00206, O60603 and Q9Y2C9, five MGI genes and one FlyBase gene, FBgn0262473), which the
      review describes as cell-surface TLRs and Drosophila Toll. Children are PTN004700156 (250
      leaves, all seeds and the target) and PTN008615068 (5 leaves, Plasmodium and Paramecium). The target is
      leaf PTN001223134 in the TLR11, TLR12 and TLR21 clade PTN009093876 (13 leaves, 9 species) inside the
      vertebrate TLR node PTN002808083 (179 leaves). No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      Seed list read from the treeview focus record; the seed rows were not re-queried one by one, since the
      surface location of TLR2, TLR4 and Toll is not in question.
    - >-
      Review quotes PMID:24282308 twice (most zebrafish TLR9 and TLR21 imaged in the endoplasmic reticulum;
      activation blocked by an inhibitor of endosomal acidification). The review also carries an accepted IDA
      row for endoplasmic reticulum from the same paper.
    - No family review file for PTHR24365.
    review_edited: false
    notes: >-
      The ground is evidence on the gene itself. Imaging puts the bulk of the receptor in the ER and its
      signalling is endosomal, which argues against the surface as its place of action without excluding a
      surface pool, so this is doubt and not loss. No PAINT fix follows from one imaging study in transfected
      cells. Surface labelling of endogenous or tagged tlr21 in zebrafish cells would settle it. A curator could
      consider a loss for the nucleic acid sensing TLRs as a group, but that is a family question beyond this
      row. File left alone.
- gene_file: genes/DANRE/naa50/naa50-ai-review.yaml
  rows:
  - go_id: GO:0061733
    go_label: protein-lysine-acetyltransferase activity
    family: PTHR42919
    ibd_node: PTN001133613
    tree_reading: >-
      IBD at PTN001133613 (215 leaves, 104 species) with three seeds, human NAA50 (Q9GZZ1) and Arabidopsis
      AT5G11340 (leaf Q9LFM3) and AT1G72030. Children are PTN000558165 (205 leaves, eukaryotes, all seeds and
      the target) and PTN008676970 (10 archaeal and Aquifex leaves). The target is leaf PTN000558190 and joins
      human NAA50 at PTN002873078 (21 leaves); the two Arabidopsis leaves found in the tree (Q9LFM3 and GNAT10
      Q9C7G6) are in the plant side PTN008091255 (137 leaves) and join the target only at PTN000558165. The NatA
      complex and cohesion IBDs are at PTN000558165, the N-terminal acetyltransferase IBD at PTN001133612 (255
      leaves). No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001133613
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human NAA50 enables GO:0061733 IDA PMID:19744929 and
      histone H4 acetyltransferase activity IDA PMID:19744929 (UniProt).
    - >-
      QuickGO by GO id with descendants, taxon 3702, experimental codes. At5g11340 (F4JWH4) IDA PMID:32461302;
      GNAT10 (Q9C7G6) EXP PMID:32633465. Neither Arabidopsis paper was read here, and the mapping of locus
      AT1G72030 to GNAT10 was not confirmed.
    - >-
      Review quotes PMID:19744929 (autoacetylation of three lysines in vitro; histone H4 as an in vitro
      substrate) and the UniProt function note that the relevance of the N-epsilon activity is unclear.
    review_edited: true
    notes: >-
      Action unchanged. The human seed is an in vitro activity of unknown relevance on the same lineage as the
      target, which is the over-annotation tier for a measured but unestablished activity, and the reason
      already argues this. Two statements of the tree were wrong and were corrected. The summary and the
      propagation_review named PTN000558165 as the node for this term; the IBD is one node higher, at
      PTN001133613. The ISS row on the same term keeps the same action. The row for the N-terminal
      acetyltransferase IBA in the same review also names PTN000558165 in its summary although its
      supporting entity is PTN001133612; that row is outside this pass and was not touched. History record
      added. Reconciliation: the summary of that row was corrected afterwards to name PTN001133612 (255
      leaves, five seeds, read from the tree); its action is unchanged.
- gene_file: genes/DANRE/ucp2/ucp2-ai-review.yaml
  rows:
  - go_id: GO:1990845
    go_label: adaptive thermogenesis
    family: PTHR45618
    ibd_node: PTN001183920
    tree_reading: >-
      IBD at PTN001183920 (72 leaves, 28 species) with one seed, mouse Ucp1 (MGI:98894, P12242), which sits in
      the UCP1 clade PTN002898094 (19 leaves). The target is leaf PTN000642209 in PTN002898116 (37 leaves, 20
      species, UCP2 and UCP3), which joins the UCP1 clade at PTN000642160 (64 leaves). Children of the IBD node
      are PTN000642157 (71 leaves) and one Nematostella leaf. The same node carries the IBD for response to
      cold. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002898094
    evidence_checked:
    - Lineages of Q9W720 and P12242 read from the cached PTHR45618 tree.
    - >-
      Batch H15 (human UCP2, same node) found mouse Ucp1 involved_in adaptive thermogenesis IMP PMID:27027295
      and PMID:9139827; not re-queried here.
    - >-
      Review quotes PMID:10524261 (the paper that cloned zebrafish and carp UCP2 and concluded its function is
