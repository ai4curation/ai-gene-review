- gene_file: genes/DANRE/olfm3a/olfm3a-ai-review.yaml
  rows:
  - &olfm3
    go_id: GO:0007165
    go_label: signal transduction
    family: PTHR23192
    ibd_node: PTN000573635
    tree_reading: >-
      IBD at the family root PTN000573635 (287 leaves, 31 species) with three seeds, human MYOC (Q99972), mouse
      Myoc (MGI:1202864) and mouse Olfm1 (MGI:1860437, O88998). Children are PTN000573638 (273 leaves, holding
      latrophilins and all olfactomedins) and PTN000573947 (14 invertebrate leaves). The seeds sit in two
      separate paralog clades, MYOC in PTN002754680 (23 leaves) and OLFM1 in PTN002754652 (23 leaves). Both
      zebrafish olfm3 copies are in a third, the OLFM3 clade PTN002754639 (23 leaves, 20 species), and the three
      clades join at PTN009064346 (218 leaves, 20 species). No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002754680
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Human MYOC carries non-canonical Wnt signaling IMP
      PMID:19188438 and regulation terms by IDA (PMID:17984096, PMID:23629661, PMID:21656515); mouse Myoc
      carries ERBB2-ERBB3 signaling pathway IDA PMID:23897819; mouse Olfm1 carries neuronal signal transduction
      (GO:0023041) IDA PMID:22923615. None carries the bare term experimentally.
    - >-
      Review quotes PMID:37591201 (noelins assemble with AMPA receptor ectodomains) and PMID:16115881 (optimedin
      function still unclear).
    - interpro/panther/PTHR23192/PTHR23192-review.yaml does not assess this node for the term.
    review_edited: false
    notes: >-
      The three seeds are annotated to three different pathways (Wnt, ErbB, Nogo receptor) in two paralog
      clades, and the umbrella term was placed at a root that also covers latrophilin receptors, gliomedin,
      OLFM4 and the invertebrate members. That is a common ancestor term over unrelated seed mechanisms, not a
      function shown to be ancestral, and nothing shows it for the OLFM3 clade. The fix is to keep each
      specific pathway on its own clade; the target node names the MYOC clade, and the Olfm1 term would go on
      PTN002754652. The reason names the root placement and the seeds; its remark that no seed is an OLFM3 is
      not a ground by itself, but the tree ground stands. File left alone.
