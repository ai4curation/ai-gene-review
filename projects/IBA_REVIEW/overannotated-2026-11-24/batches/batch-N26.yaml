genes:
- gene_file: genes/DANRE/tusc2b/tusc2b-ai-review.yaml
  rows:
  - go_id: GO:0006954
    go_label: inflammatory response
    family: PTHR15453
    ibd_node: PTN002693339
    tree_reading: >-
      IBD at PTN002693339 (21 leaves, 17 species) with one seed, mouse Tusc2 (MGI:1931086). Children are
      PTN009025190 (16 tetrapod leaves, holding the seed) and PTN002693344 (5 leaves, gar, medaka and the two
      zebrafish copies), which holds the target leaf PTN000397121. The mitochondrion and membrane potential
      IBDs sit higher, at the family root PTN001035705 (29 leaves). No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002693339
    evidence_checked:
    - >-
      QuickGO by accession and GO id, Q9WVF8 with GO:0006954. One experimental row, acts_upstream_of_or_within
      IMP PMID:22513871 (MGI, with allele MGI:3706236), and the IBA.
    - >-
      Review quotes PMID:22513871 (more peritoneal granulocytes in untreated knockout mice) and PMID:24328503
      (authors attribute the phenotype to mitochondrial calcium handling); read in the validated supported_by
      block.
    - No family review file for PTHR15453.
    review_edited: false
    notes: >-
      The seed is a knockout phenotype that MGI itself qualified as acts_upstream_of_or_within, and PAINT turned
      it into involved_in across the vertebrate clade. The review reason already says this and its
      propagation_review names the node. File left alone.
- gene_file: genes/DANRE/agxtb/agxtb-ai-review.yaml
  rows:
  - go_id: GO:0005777
    go_label: peroxisome
    family: PTHR21152
    ibd_node: PTN000475539
    tree_reading: >-
      IBD at PTN000475539 (43 leaves, 35 species) with two seeds, human AGXT (P21549) and rat Agxt (RGD:2073,
      P09139). The target is leaf PTN000475564 in the fish clade PTN002722145 (5 leaves, gar, two medaka and
      the two zebrafish copies agxta Q6DG86 and agxtb Q6PHK4), which joins the tetrapod seeds inside
      PTN002722140 (23 leaves). The two zebrafish copies sit in different 2-leaf nodes under PTN000475561
      (4 leaves), so the duplication is teleost-specific. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human AGXT has IDA and EXP rows for peroxisome from nine papers; rat
      Agxt has IDA PMID:10739960, PMID:14561759 and PMID:3900009.
    - >-
      Review quotes PMID:35295584 (agxtb lacks a PTS1 and has an N-terminal MTS), the agxta bioinformatics
      results (C-terminus SKA) and PMID:15911627 (ancillary internal targeting information in human AGT).
    - >-
      interpro/panther/PTHR21152/PTHR21152-review.yaml has an assessment of PTN000475539 for peroxisome that
      quotes this row's summary.
    review_edited: false
    notes: >-
      The node and seeds are sound and the target is inside the seeded clade, so the ground is on the target,
      a missing C-terminal PTS1 with a retained presequence. That is sequence evidence short of loss, because
      AGT import can use internal signals and neither zebrafish protein has been imaged, and the reason says
      exactly this. An imaging experiment on agxtb would settle it; if it is only mitochondrial the row
      becomes a REMOVE with a loss on leaf PTN000475564. The ISS row on the same term carries the same action.
- gene_file: genes/DANRE/exoc3l2a/exoc3l2a-ai-review.yaml
  rows:
  - go_id: GO:0000149
    go_label: SNARE binding
    family: PTHR21292
    ibd_node: PTN000480155
    tree_reading: >-
      IBD at the family root PTN000480155 (193 leaves, 93 species) with one seed, yeast Sec6 (SGD:S000001330,
      P32844). Children are PTN000480156 (132 leaves, opisthokonts and relatives) and PTN007689601 (61 leaves,
      plants and protists). Sec6 sits in a fungal clade PTN001083668 (15 leaves) that joins the animal lineage
      at PTN000480157 (129 leaves). The target is leaf PTN009045145 in the vertebrate EXOC3L2 clade
      PTN004537761 (39 leaves), which joins vertebrate EXOC3 (clade PTN002723790, 20 leaves, human O60645) only
      at PTN000480161 (101 leaves, 20 species, also holding EXOC3L1, EXOC3L4 and TNFAIP2). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001083668
    evidence_checked:
    - >-
      QuickGO by accession and GO id (descendants), P32844. Sec6 enables SNARE binding IDA and IPI from
      PMID:15835919 and PMID:22114349 (SGD, IPI with S000003241).
    - >-
      Review quotes its own bioinformatics results (19.7 to 21.9 percent identity to human EXOC3 and the other
      paralogs) and PMID:21566143 (EXOC3L2 co-precipitates with EXOC4).
    - No family review file for PTHR21292.
    review_edited: false
    notes: >-
      One fungal seed carried to the root of a family in which the vertebrate lineage duplicated into EXOC3
      and four EXOC3-like paralogs. The target is not the Sec6 ortholog but a diverged paralog whose only
      studied interaction is with the exocyst core, so the term is unsupported on its branch without being
      contradicted. The move is named on the fungal clade because that is where the evidence is; a curator
      who judges animal EXOC3 proper to have kept the Sec6 interaction could instead prune the EXOC3-like
      clades. The reason already names the node and its span. File left alone.
- gene_file: genes/DANRE/prom1a/prom1a-ai-review.yaml
  rows:
  - go_id: GO:0060219
    go_label: camera-type eye photoreceptor cell differentiation
    family: PTHR22730
    ibd_node: PTN002733197
    tree_reading: >-
      IBD at PTN002733197 (22 leaves, 20 species), the vertebrate PROM1 node, with two seeds, mouse Prom1
      (MGI:1100886, O54990) and human PROM1 (O43490). Children are PTN008580801 (17 tetrapod leaves, both
      seeds) and PTN002733200 (5 leaves, gar, two medaka, zebrafish prom1b A0A8M9QBM3 and the target prom1a
      Q9W735, leaf PTN000506650). No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Mouse Prom1 involved_in IMP PMID:19228982 (UniProt); human PROM1
      involved_in IMP PMID:18654668 (BHF-UCL).
    - >-
      Review quotes PMID:31362982 (prom1b, rather than prom1a, plays an important role in zebrafish
      photoreceptors) and its own scRNA-seq reanalysis (both copies in rods and cones, prom1b three to four
      times higher).
    - No family review file for PTHR22730.
    review_edited: false
    notes: >-
      Sound node, target inside the seeded clade, and the ground is evidence on the gene. The authors assign
      the photoreceptor role to the paralog, while prom1a is still transcribed in photoreceptors, so this is
      doubt short of loss. A prom1a single mutant and the double mutant scored for outer segments would settle
      it; a clean single mutant with no enhancement of the prom1b phenotype would make the row a REMOVE with a
      loss on leaf PTN000506650. File left alone.
- gene_file: genes/DANRE/dnajc6__A0A8M9Q6X2/dnajc6__A0A8M9Q6X2-ai-review.yaml
  rows:
  - go_id: GO:0014069
