genes:
- gene_file: genes/worm/lmp-1/lmp-1-ai-review.yaml
  rows:
  - go_id: GO:0072594
    go_label: establishment of protein localization to organelle
    family: PTHR11506
    ibd_node: PTN000897064
    tree_reading: >-
      IBD at the family root PTN000897064 (151 leaves, 34 species) with four seeds, human LAMP1 (P11279),
      human LAMP2 (P13473), mouse Lamp2 (MGI:96748) and rat Lamp2 (RGD:2990). The root has two children,
      PTN000897065 (149 leaves, holding the target) and a 2-leaf Monosiga clade PTN004265105. LMP-1
      (leaf PTN000161780) sits in PTN000161777 (11 leaves, 7 species) under PTN008519356 (18 leaves),
      which joins the LAMP1 and LAMP2 seeds only at PTN000161673 (146 leaves). The seeds' own last common
      ancestor is PTN002479610 (117 leaves), which does not contain LMP-1. Human LAMP1 is in PTN002608925
      (24 leaves). PAINT separately asserts the child term GO:0061740 at the LAMP2 node PTN002608933.
      No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002608925
    evidence_checked:
    - >-
      QuickGO by GO:0072594 with descendants. P11279 LAMP1 has IMP PMID:23632890 (UniProt) on the term
      itself. P13473 LAMP2 and rat P17047 have IMP PMID:27628032 on GO:0061740; mouse P17046 has IMP and
      IGI PMID:18644871 (MGI) on GO:0061740. Mouse and rat Lamp1 (P11438, P14562) carry only
      IBA, IEA and ISO rows.
    - No family review exists for PTHR11506. Human LAMP3 was judged on the same record in batch-H05.
    review_edited: false
    notes: >-
      Same call as human LAMP3 (batch-H05). The general term at the root joins two paralog-specific
      vertebrate roles (LAMP-2A in chaperone-mediated autophagy, LAMP1 in perforin delivery) and spreads
      them to the nematode branch. The LAMP2 seeds already have the specific term at PTN002608933, so
      the general term can move to the LAMP1 clade PTN002608925, the same target as in batch-H05 (node
      id and size read from the LAMP1 lineage with a helper built on the treeview loaders). The existing
      reason names the root placement and both seed roles, so the file was left alone.
- gene_file: genes/worm/drp-1/drp-1-ai-review.yaml
  rows:
  - go_id: GO:0005874
    go_label: microtubule
    family: PTHR11566
    ibd_node: PTN000170013
    tree_reading: >-
      IBD at the family root PTN000170013 (1039 leaves, 101 species) with three seeds, human DNM2
      (P50570), C. elegans dyn-1 (WBGene00001130) and Arabidopsis DRP1A (AT5G42080). The root has three
      children, PTN000902162 (820 leaves, holding DRP-1 and the plant seed), PTN008520579 (154 leaves,
      classical dynamins and Mx, holding the two animal seeds) and PTN002611582 (65 leaves). DRP-1 (leaf
      PTN000170126) is in the animal Drp1 node PTN000170088 (39 leaves) with human DNM1L, under
      PTN002480309 (42 leaves, the mitochondrial fission IBD node). No loss is recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0005874 with descendants. P50570 DNM2 located_in IDA PMID:15731758 and PMID:21525035
      (UniProt). P39055 dyn-1 located_in GO:0005876 spindle microtubule IDA PMID:12498685 (WB). P42697
      DRP1A located_in IDA PMID:15923323 (TAIR). O00429 DNM1L colocalizes_with IDA PMID:9472031
      (ParkinsonsUK-UCL). Q8WQC9 drp-1 has only the IBA.
    - >-
      interpro/panther/PTHR11566/PTHR11566-review.yaml assesses the node as NEEDS_PRUNING for the
      intramitochondrial OPA1 clade only and says the evidence elsewhere supports no further loss.
    - genes/human/DNM1L review keeps the same IBA as KEEP_AS_NON_CORE. Lineage of human DNM1L read with treeview.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The old reason was that no C. elegans evidence exists and
      that Drp1 proteins work at mitochondria, neither of which is a ground. Seeds are on both sides of
      the root split and the mammalian ortholog in the same 39-leaf node has its own microtubule row.
      Yeast DNM1 and VPS1 still carry MARK_AS_OVER_ANNOTATED on this record and are outside this batch.
  - go_id: GO:0008017
    go_label: microtubule binding
    family: PTHR11566
    ibd_node: PTN000170013
    tree_reading: >-
      IBD at the family root PTN000170013 (1039 leaves) with one seed, Drosophila shibire
      (FBgn0003392), which per the family tree check lies in the classical dynamin clade PTN000170172
      (128 leaves) inside the root child PTN008520579 (154 leaves). DRP-1 is in the other large child
      PTN000902162 (820 leaves), in the animal Drp1 node PTN000170088 (39 leaves) with human DNM1L. No
      loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0008017 with descendants. P27619 shi enables IDA PMID:11076973 (FlyBase). O00429
      DNM1L and P39055 dyn-1 carry only the IBA on this term.
    - >-
      publications/PMID_11076973.md (full text). The paper isolates microtubule and actin associated
      proteins from embryo extracts and lists Dynamin among those identified.
    - >-
      PTHR11566 family review. Scope of GO:0008017 is UNRESOLVED and the node assessment declines a move
      to PTN000170172 because DNM1L has contextual microtubule co-pelleting.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, for consistency with human DNM1L in the same ortholog node
      (KEEP_AS_NON_CORE). A stricter reader could uphold NODE_TOO_DEEP with MOVE_IBD to PTN000170172,
      since the one seed is in the other child of the root. I did not, because the branch holding the
      target has the DNM1L microtubule data and nothing on DRP-1 argues against binding. The old reason
      (the function does not require microtubule binding) is not a ground.
- gene_file: genes/worm/dyn-1/dyn-1-ai-review.yaml
  rows:
  - go_id: GO:0005874
    go_label: microtubule
    family: PTHR11566
    ibd_node: PTN000170013
    tree_reading: >-
      IBD at the family root PTN000170013 (1039 leaves) with three seeds, human DNM2, Arabidopsis DRP1A
      and C. elegans dyn-1 itself (WBGene00001130). DYN-1 (leaf PTN000170310) is in the classical dynamin
      clade PTN000170172 (128 leaves, 32 species), under PTN000902093 (130 leaves, synapse IBDs) and
      PTN008520579 (154 leaves, plasma membrane IBD). The treeview line "target is itself a seed" prints
      False only because the seed is listed by its WormBase id. No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0005874 with descendants. P39055 dyn-1 located_in GO:0005876 spindle microtubule
      IDA PMID:12498685 (WB). P50570 DNM2 located_in IDA PMID:15731758 and PMID:21525035. P42697 DRP1A
      located_in IDA PMID:15923323.
    - >-
      publications/PMID_12498685.md is abstract-only, and PubMed Central returned no full text for
      PMC3690653. The abstract places worm dynamin at cleavage furrow membranes and the midbody and
      the spindle midzone result in mammalian cells.
    - Human DNM1 and DNM2 reviews keep the same IBA as KEEP_AS_NON_CORE.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The old reason called the seeds an in vitro property and
      cited UniProt "by similarity". All three seeds are located_in IDA rows, and the gene is one of
      them. Being its own seed is not a reason for doubt. Kept as non-core and not ACCEPT because the
      review leaves its own spindle microtubule IDA row UNDECIDED (full text not available). That IDA
      row was not touched. The propagation_review on the row was rewritten to NO_FAILURE_NON_CORE.
  - go_id: GO:0008017
    go_label: microtubule binding
    family: PTHR11566
    ibd_node: PTN000170013
    tree_reading: >-
      IBD at the family root PTN000170013 (1039 leaves) with one seed, Drosophila shibire
      (FBgn0003392). The family tree check gives PTN000170172 (128 leaves) as the last common ancestor
      of shibire, dyn-1, DNM1 and DNM2, and DYN-1 sits in that node, so the target is inside the clade
      that holds the seed. No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO:0008017 with descendants. P27619 shi enables IDA PMID:11076973 (FlyBase). P39055 dyn-1 has only the IBA.
    - >-
      publications/PMID_11076973.md (full text), a screen of microtubule and actin associated proteins
      from Drosophila embryo extracts in which Dynamin is among the proteins identified.
    - Human DNM1 and DNM2 reviews keep this IBA as KEEP_AS_NON_CORE.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. A single seed in the target's own clade is not weak
      support, and the old text ("no worm evidence") was a non-ground. A SEED_OVERREACH reading is
      possible (the seed evidence is co-fractionation from an extract, not a purified binding assay),
      but I did not overrule the FlyBase IDA from that alone, and the human classical dynamins are kept
      on the same seed. The PTHR11566 family review quotes the sentence "An in vitro activity with no
      demonstrated in vivo role for classical dynamins" from this row. The sentence is kept verbatim at
      the start of the new reason. The family review's statement that the worm and human reviews
      dispute the relevance of this term is now out of date.
- gene_file: genes/worm/ben-1/ben-1-ai-review.yaml
  rows:
  - go_id: GO:0000278
    go_label: mitotic cell cycle
    family: PTHR11588
    ibd_node: PTN000172598
    tree_reading: >-
      IBD at the tubulin superfamily root PTN000172598 (1703 leaves, 101 species) with 14 seeds from
      worm, fly, budding yeast, fission yeast and Aspergillus, covering alpha, beta and gamma tubulins.
      The root has seven children. BEN-1 (leaf PTN000172983) is in the beta tubulin child PTN004272809
      (755 leaves, 101 species), in a nematode node PTN002612461 (30 leaves, 8 species) under
      PTN001358283 (133 leaves). Other children are alpha tubulin PTN000173086 (438 leaves), gamma
      PTN000172659 (134 leaves), and the delta, epsilon and other small clades. No loss is recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO Q18817 x GO:0000278 with descendants returns only the IBA.
    - >-
      The row quotes PMID:42247472 (ben-1 largely restricted to cholinergic and glutamatergic neurons)
      and PMID:2592410 (deletion strains fully benzimidazole resistant). Both files are in publications/
      and the quotes were left as they are.
    - PTHR11588 family review has no entry for GO:0000278.
    - Fly betaTub56D and betaTub97EF reviews keep the same IBA as KEEP_AS_NON_CORE.
    review_edited: false
    notes: >-
      Upheld on evidence about the target. The node is soundly seeded and a beta tubulin is inside the
      seeded clade, so the tree gives no ground. The doubt is the isotype's expression, which the review
      documents as largely post-mitotic neuronal, with TBB-1 and TBB-2 supplying the mitotic pool. That
      is short of showing BEN-1 is absent from spindles. An isotype-specific tag imaged in dividing
      germline or embryonic cells would settle it. This is close to the KEEP_AS_NON_CORE call made for
      the fly minor beta tubulins, and a later reader could reasonably align them. The reason is
      node-aware and names the expression evidence, so the file was left alone.
- gene_file: genes/worm/snf-12/snf-12-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR11616
    ibd_node: PTN000177662
    tree_reading: >-
      IBD at the family root PTN000177662 (783 leaves, 48 species) with 45 seeds from fly, mouse, rat,
      human and worm. The root's children are PTN000177664 (780 leaves, holding the target) and a 3-leaf
      bacterial clade. SNF-12 (leaf PTN000178450) is in PTN002267127 (49 leaves, 8 species, with its own
      L-amino acid transporter IBD) under PTN000907238 (205 leaves). No loss is recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO O45813 x GO:0005886 with descendants returns only the IBA.
    - >-
      The row quotes PMID:31995031 (SNF-12::GFP did not colocalise with plasma membrane lipid or
      endosomal markers and is in a yet-to-be defined apical membrane compartment). Quotes left as they are.
    - The 45 seed annotations were not looked up one by one. No family review exists for PTHR11616.
    review_edited: false
    notes: >-
      Upheld. The node is well seeded and the target is inside it, so the ground is direct localization
      evidence on SNF-12, which is the review's stated reason. It is short of showing loss because the
      compartment is apical and undefined. If later work shows the compartment is not continuous with
      the plasma membrane, the row becomes a REMOVE with an IRD on the leaf.
  - go_id: GO:1903804
    go_label: glycine import across plasma membrane
    family: PTHR11616
    ibd_node: PTN000907238
    tree_reading: >-
      IBD at PTN000907238 (205 leaves, 34 species) with four seeds. Human SLC6A5 (GlyT2) and fly Ntl
      (FBgn0267326, in the 32-leaf node PTN008975238) join the target only at PTN001359843 (200
      leaves). Mouse and rat Slc6a9 (GlyT1) join it at PTN002267193 (152 leaves). SNF-12 is in
      PTN002267127 (49 leaves, 8 species), which has its own IBD for L-amino acid transmembrane
      transporter activity. Inside the 200-leaf child PAINT also asserts proline transport
      (PTN002614390), beta-alanine transport and carnitine transport (PTN008325641), so the node
      spans clades with different substrates.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:1903804. Q9Y345 SLC6A5 IDA PMID:16751771; mouse Slc6a9 P28571 IMP PMID:28495915;
      rat Slc6a9 P28572 IDA PMID:12091465; fly Ntl Q9VLY6 IMP PMID:21298005.
    - Seed leaves located in the tree with a helper built on the treeview loaders.
    - The row quotes PMID:26716073 (substrate of SNF-12 not identified) and PMID:31995031; left as they are.
    review_edited: false
    notes: >-
      Upheld. A substrate-specific term sits on a 205-leaf node whose descendants PAINT itself annotates
      with other substrates. The three seed groups (GlyT1, GlyT2, fly Ntl) do not share a node below
      PTN001359843, so the fix is one IBD per seeded clade and no single target id is given, as for
      SLC6A8 in batch-H05. No evidence shows that SNF-12 cannot carry glycine (its substrate is
      unknown), so this is not a REMOVE.
- gene_file: genes/worm/pdr-1/pdr-1-ai-review.yaml
  rows:
  - go_id: GO:0005783
    go_label: endoplasmic reticulum
    family: PTHR11685
    ibd_node: PTN000188399
    tree_reading: &pdr1_tree >-
      IBD at the parkin node PTN000188399 (33 leaves, 21 species), ten nodes below the family root
      PTN000188395 (1503 leaves). Its two children are PTN008523776 (27 leaves, vertebrates, holding
      human PRKN, mouse Prkn and the rat seed) and PTN008523785 (6 leaves, protostomes, holding PDR-1,
      C. briggsae pdr-1, fly park and three other arthropod leaves). Every seed is in the vertebrate
      child. No loss is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &pdr1_fix
      paint_action: MOVE_IBD
      target_node_id: PTN008523776
    evidence_checked:
    - >-
      QuickGO by GO:0005783. Human PRKN O60260 located_in IDA PMID:12150907 (ParkinsonsUK-UCL) and EXP
      PMID:19501131 (UniProt); mouse Prkn Q9WVS6 EXP PMID:11122330 (UniProt); rat Prkn Q9JK66 has only
      ISS, IEA and ISO rows now.
    - >-
      publications/PMID_12150907.md and PMID_19501131.md are abstract-only, so the seed rows were not
      disputed.
    - Human PRKN keeps the term as KEEP_AS_NON_CORE on its own experimental rows. Fly park marks it over-annotated.
    review_edited: false
    notes: >-
      Upheld. The split under the node is a speciation, so this is a judgement that a minor pool of a
      soluble cytosolic ligase, seen in mammalian cells, should not be carried to the protostome branch
      where the two studied members (fly park, worm pdr-1) are reported in the cytosol and on
      mitochondria. It is not evidence of absence. The reason names the node, the seeds and the
      cross-phylum transfer, so the file was left alone. The row's text lists human and rat seeds. The
      current PAINT record also lists mouse Prkn.
  - go_id: GO:0005794
    go_label: Golgi apparatus
    family: PTHR11685
    ibd_node: PTN000188399
    tree_reading: *pdr1_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *pdr1_fix
    evidence_checked:
    - >-
      QuickGO by GO:0005794. Human PRKN O60260 located_in IDA PMID:17097639 (UniProt). Rat Prkn Q9JK66
      has only IEA and ISO rows now, so the record rests on one experimental row.
    - publications/PMID_17097639.md is abstract-only (parkin as an E3 for ataxin-2); seed not disputed.
    review_edited: false
    notes: Same reading as the endoplasmic reticulum row. Two seeds, both in the vertebrate child.
- gene_file: genes/worm/rps-3/rps-3-ai-review.yaml
  rows:
  - go_id: GO:2001235
    go_label: positive regulation of apoptotic signaling pathway
    family: PTHR11760
    ibd_node: PTN000924666
    tree_reading: >-
      IBD at PTN000924666 (50 leaves, 34 species) with one seed, human RPS3 (P23396). Its children are
      PTN000924667 (49 leaves, animals, holding both the seed and the target) and a single Monosiga
      leaf PTN000924685. RPS-3 (leaf PTN000205097) is in PTN000205096 (7 leaves) under PTN000205063 (47
      leaves). The structural constituent of ribosome IBD is at the family root PTN000205057 (362 leaves).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000924666
    evidence_checked:
    - >-
      QuickGO P23396 x GO:2001235 with descendants. IDA PMID:14988002 (UniProt) on the term, and IMP
      PMID:22510408 on GO:1902231.
    - >-
      publications/PMID_14988002.md abstract (abstract-only file). It reports that transient expression
      of GFP-rpS3 activates caspase-8 and caspase-3 and sensitizes cytokine-induced apoptosis.
    review_edited: false
    notes: >-
      Upheld. The single seed row is an IDA from an overexpression experiment, as the abstract itself
      states, which is the README case of an overexpression activity of unknown relevance spread by the
      IBD to every animal ribosomal protein S3. The reason says this and names the node. The human
      review keeps its own IDA row as non-core.
- gene_file: genes/worm/sta-1/sta-1-ai-review.yaml
  rows:
  - go_id: GO:0042127
    go_label: regulation of cell population proliferation
    family: PTHR11801
    ibd_node: PTN000927860
    tree_reading: >-
      IBD at PTN000927860 (180 leaves, 36 species) with 12 seeds. The children are PTN000927862 (170
      leaves, animal STATs, holding STA-1 and the vertebrate, zebrafish and fly seeds) and PTN001370513
      (10 leaves, Dictyostelium, holding the dictyBase seed). STA-1 (leaf PTN000210632) is in the
      nematode node PTN000210629 (8 leaves, 3 species) under PTN000210449 (164 leaves). The same node
      carries the defense response and JAK-STAT IBDs. No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      interpro/panther/PTHR11801/PTHR11801-review.yaml assesses this node record as SOUND (seeds on both
      sides, lowest node covering them, term does not presuppose JAK).
    - sta-2 and the human STAT reviews keep the same IBA as KEEP_AS_NON_CORE. Seed rows not looked up one by one.
    - The row quotes PMID:16873887 (STA-1 not required for viability); quote kept verbatim.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The old reason was that no study links STA-1 to
      proliferation, which is absence of data. The propagation_review was changed from UNRESOLVED to
      NO_FAILURE_NON_CORE. The family review's closing paragraph says the sta-1 review marks this term
      over-annotated, which is now out of date.
- gene_file: genes/worm/sta-2/sta-2-ai-review.yaml
  rows:
  - go_id: GO:0000978
    go_label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    family: PTHR11801
    ibd_node: PTN000210448
    tree_reading: >-
      IBD at the family root PTN000210448 (225 leaves, 70 species) with eight seeds (human STAT1 and
      STAT3, five mouse Stats, fly Stat92E). The children are PTN008527027 (183 leaves, holding the
      target and the seeds) and the plant STAT-type clade PTN004306971 (42 leaves). STA-2 (leaf
      PTN000210630) is in the nematode node PTN000210629 (8 leaves, 3 species) with STA-1. No loss is
      recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      The row's own evidence. PMID:24058748 quote (no DNA binding to a STAT consensus motif in a
      mammalian culture system), the UniProt cross-references (STA-2 lacks PF02864, which STA-1
      carries) and the OpenScientist analysis in the gene folder.
    - >-
      PTHR11801 family review. The term is FAMILY_WIDE with STA-2 recorded as an unresolved case
      and an IRD recommended only for the plant clade.
    review_edited: false
    notes: >-
      Upheld. The node is well seeded and STA-2 is inside the seeded clade, so the ground is evidence
      on the target, namely a divergent DNA-binding region and a reported failure to bind a consensus
      motif (data not shown in the source). That is short of showing loss, since STA-2 does regulate
      transcription. An EMSA or ChIP on STA-2 would settle it. The reason states all of this.
- gene_file: genes/worm/egl-44/egl-44-ai-review.yaml
  rows:
  - go_id: GO:0048568
    go_label: embryonic organ development
    family: PTHR11834
    ibd_node: PTN000931329
    tree_reading: >-
      IBD at PTN000931329 (95 leaves, 35 species) with two seeds, MGI:101876 (mouse Tead1, P30051) and
      MGI:104904 (mouse Tead2, P48301). Its children are PTN000931330 (94 leaves, with the hippo
      signaling IBD) and one Monosiga leaf. The two seeds share the vertebrate node PTN000746867 (35
      leaves). EGL-44 (leaf PTN000216778) is in the protostome node PTN002625702 (10 leaves, nematodes,
      arthropods and Helobdella), which joins the vertebrate TEADs at PTN000216670 (92 leaves). No loss
      is recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000746867
    evidence_checked:
    - >-
      UniProt cross-references. MGI:101876 is Tead1 (P30051) and MGI:104904 is Tead2 (P48301). Mouse
      Tead4 (Q62296) is MGI:106907 and is not a seed.
    - >-
      QuickGO by GO:0048568 with descendants. Tead1 and Tead2 each carry acts_upstream_of_or_within IGI
      PMID:18332127 (MGI) on GO:0003143 embryonic heart tube morphogenesis and GO:0030903 notochord
      development, with the other gene and MGI:103262 in the with column. Tead4 carries only the IBA.
    - Seed leaves located in the tree with a helper built on the treeview loaders.
    review_edited: true
    notes: >-
      Action unchanged, summary and reason rewritten. The earlier text named the seeds as Tead1 and
      Tead4. The second seed is Tead2. The reason now states the node, the seed clade and the seed
      evidence (double-mutant IGI rows with the upstream qualifier), and source labels were added to
