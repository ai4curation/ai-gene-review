      term about organs, which is the plainest sign it is too deep. Human TEAD1 keeps the IBA as
      non-core, which fits a move to the vertebrate node.
- gene_file: genes/worm/daf-11/daf-11-ai-review.yaml
  rows:
  - go_id: GO:0001653
    go_label: peptide receptor activity
    family: PTHR11920
