genes:
- gene_file: genes/ECOLI/pstB/pstB-ai-review.yaml
  rows:
  - go_id: GO:0005315
    go_label: phosphate transmembrane transporter activity
    family: PTHR43423
    ibd_node: PTN002459520
    tree_reading: >-
      IBD at PTN002459520 (5 leaves, 5 species, inside a 112-leaf family) with one seed, UniProtKB:P0AAH0,
      which is pstB itself. The node's children are PTN002459522 (4 leaves, Xanthomonas, Salmonella, Yersinia
      and E. coli PstB; target leaf PTN000655976) and the single Bradyrhizobium leaf PTN002459521. The same
      node carries an IBD for phosphate ion transmembrane transport from the same seed. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002459520
    evidence_checked:
    - >-
      QuickGO P0AAH0 x GO:0005315 with descendants returns enables IDA PMID:3881386 (EcoCyc), the IBA, an
      InterPro IEA and a UniProt IEA for GO:0015415. The query shape returns hits.
    - >-
      The review's quote from PMID:3881386 shows the seed paper reports the nucleotide sequence of the four
      pst genes. No family review exists for PTHR43423.
    review_edited: false
    notes: >-
      The target is its own seed, and the IDA, IBA and IEA rows on the term carry the same action. The seed row
      gives the whole PstSACB transporter's activity to the cytoplasmic ATPase subunit with the enables
      qualifier; PstB hydrolyses ATP and does not form the translocation path, and the review keeps the
      contribution in core_functions. The reason says this and names the node. Left as written. The fix belongs
      at the seed row (contributes_to in place of enables); REMOVE_IBD is the request for the enables record
      until the seed is requalified. The process IBD from the same node is accepted.
- gene_file: genes/ECOLI/gph/gph-ai-review.yaml
  rows:
  - go_id: GO:0006281
    go_label: DNA repair
    family: PTHR43434
    ibd_node: PTN001052204
    tree_reading: >-
      IBD at the family root PTN001052204 (113 leaves, 53 species) with one seed, UniProtKB:P32662, which is
      gph itself. The root's children are PTN001291474 (80 leaves, bacterial, holding the target leaf
      PTN001052181) and PTN001448182 (33 leaves, archaea and eukaryotes). PAINT already records a loss for
      this term (NOT IRD GO:0006281) at PTN001822758 inside the bacterial child, off the target's lineage.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001052204
    evidence_checked:
    - >-
      QuickGO P32662 x GO:0006281 with descendants returns acts_upstream_of_or_within IMP PMID:13129953
      (EcoCyc) and the IBA.
    - >-
      The gene review read PMID:13129953 in full and quotes it; the gph mutant has unchanged susceptibility to
      the oxidising agents and accumulates 2-phosphoglycolate.
    - >-
      interpro/panther/PTHR43434/PTHR43434-review.yaml assesses this node NEEDS_PRUNING for the term and
      gives the same reading of the seed.
    review_edited: false
    notes: >-
      The single seed is a mutant phenotype with the acts_upstream_of_or_within qualifier, and PAINT asserts
      involved_in from it across a root that reaches archaea and eukaryotes. The paper shows salvage of a
      repair by-product, with no change in damage or survival. The IMP and IBA rows carry the same action and
      the reason names the seed and what it shows. Left as written. The existing IRD on a sibling clade shows
      a curator has already judged the term not to hold family-wide.
- gene_file: genes/ECOLI/nuoM/nuoM-ai-review.yaml
  rows:
  - go_id: GO:0048039
    go_label: ubiquinone binding
    family: PTHR43507
    ibd_node: PTN000511780
    tree_reading: >-
      IBD at the family root PTN000511780 (163 leaves, 92 species) with one seed, UniProtKB:P0AFE8, which is
      nuoM itself. The root's children are PTN008682297 (30 leaves, bacterial NuoM, holding the target leaf
      PTN000511850) and PTN000511781 (133 leaves, mitochondrial ND4 and chloroplast NdhD). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000511780
    evidence_checked:
    - QuickGO P0AFE8 x GO:0048039 with descendants returns enables IDA PMID:12730198 (EcoCyc) and the IBA.
    - >-
      The gene review quotes PMID:12730198 (an azido-ubiquinone photoaffinity probe labelled NuoM),
      PMID:23417064 (no cofactors in the membrane arm) and PMID:18590697 (NuoM mutants keep bound ubiquinone).
    - >-
      interpro/panther/PTHR43507/PTHR43507-review.yaml lists this node and term as UNRESOLVED and raises the
      same doubt for chloroplast NdhD.
    review_edited: false
    notes: >-
      The target is its own seed and the IDA and IBA rows carry the same action. The seed is an in vitro
      cross-linking result whose interpretation (NuoM houses the quinone site) was superseded by structures
      that place the site at the NuoCD, NuoB and NuoH interface. The IBD carries it to every ND4 and NdhD. The
      reason states the seed, its assay and the later evidence. Left as written.
- gene_file: genes/ECOLI/rfbA/rfbA-ai-review.yaml
  rows:
  - go_id: GO:0000271
    go_label: polysaccharide biosynthetic process
    family: PTHR43532
    ibd_node: PTN000501124
    tree_reading: >-
      IBD at PTN000501124 (22 of the family's 25 leaves) with three seeds, S. typhimurium RmlA (P26393),
      E. coli RffH (P61887) and M. tuberculosis RmlA (P9WH13). The node has six children. PTN002460962 (10
      leaves) holds the target (leaf PTN001096497) and the Salmonella and RffH seeds; PTN008110993 (6 leaves)
      holds the M. tuberculosis seed. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000501124
    evidence_checked:
    - >-
      QuickGO GO:0000271 with descendants for P26393, P9WH13, P61887 and P37744. P26393 involved_in IDA
      PMID:8382158 (UniProt); P61887 involved_in IDA PMID:7559340 (UniProt) and acts_upstream_of_or_within
      O antigen biosynthetic process EXP PMID:7559340 (EcoCyc); P9WH13 involved_in IDA PMID:9084178 and IMP
      PMID:17784859 (UniProt). RfbA has only the IBA and an O antigen IEA.
    - >-
      interpro/panther/PTHR43532/PTHR43532-review.yaml assesses the IBD WRONG_NODE and asks for it to be
      withdrawn.
    - The seed papers were not read.
    review_edited: true
    notes: >-
      Action unchanged. The call follows the family review and batch N21 (PSEAE rmlC, the next enzyme of the
      same pathway), that making the dTDP-sugar donor is not a step of polymer formation, with dTDP-rhamnose
      biosynthetic process accepted as the process. The propagation_review comment said the seeds show
      necessity (loss of O antigen); most of the seed rows are IDA, so the comment was rewritten to give the
      seeds, their evidence codes and the clade RfbA shares with two of them. The family review carries the
      same wording about necessity and is worth correcting. Because the seed papers were not read, REMOVE_IBD
      is a request to re-read the seed rows. History record added.
- gene_file: genes/ECOLI/aroD/aroD-ai-review.yaml
  rows:
  - go_id: GO:0046279
    go_label: 3,4-dihydroxybenzoate biosynthetic process
    family: PTHR43699
    ibd_node: PTN000472499
    tree_reading: >-
      IBD at the family root PTN000472499 (20 leaves, 20 species) with two seeds, UniProtKB:P05194 (aroD
      itself) and S. typhimurium AroD (P58687). Both are in the bacterial child PTN000472501 (12 leaves; target
      leaf PTN001078590); the other child PTN002463531 (8 leaves) is archaeal and has no seed. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000472499
    evidence_checked:
    - >-
      QuickGO GO:0046279 for P05194 and P58687. P05194 involved_in IDA PMID:13198937 and PMID:7592767
      (UniProt); P58687 involved_in IDA PMID:21087925 and PMID:23341204 (UniProt); both also carry an ARBA IEA.
    - >-
      The gene review holds both E. coli IDA rows; PMID:7592767 is quoted for 3-dehydroshikimate as the
      product, and PMID:13198937 is cached as a citation only. The Salmonella papers were not read.
    - >-
      interpro/panther/PTHR43699/PTHR43699-review.yaml assesses the IBD WRONG_NODE on the same ground.
    review_edited: false
    notes: >-
      The target is its own seed and all four rows on the term (two IDA, IBA, IEA) carry the same action. The
      seed assays measure dehydration of 3-dehydroquinate to 3-dehydroshikimate; making 3,4-dihydroxybenzoate
      needs a 3-dehydroshikimate dehydratase that the review's notes record as absent from E. coli K-12. That
      reads as a seed annotated to the wrong process (pattern 20), but the IDA rows are curator rows whose
      papers were not read in full, so they are not overruled and the row stays an over-annotation and not a
      removal. The reason names the node, both seeds and what was measured. Left as written.
- gene_file: genes/ECOLI/puuA/puuA-ai-review.yaml
  rows:
  - go_id: GO:1901704
    go_label: L-glutamine biosynthetic process
    family: PTHR43785
    ibd_node: PTN000464978
    tree_reading: >-
      IBD at PTN000464978 (27 leaves, 17 species, in a 150-leaf family) with one seed, B. subtilis GlnA
      (P12425). The node has seven children. The seed is in PTN008120031 (11 leaves, with the actinomycete
      GlnA2 and GlnA3). PuuA (leaf PTN001073683) is in PTN002465159 (11 leaves), inside the PuuA and PauA
      clade PTN001839150 (10 leaves), which carries its own IBD for polyamine catabolic process and holds no
      seed for this term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008120031
    evidence_checked:
    - >-
      QuickGO GO:1901704 with descendants for P12425 and P78061. GlnA involved_in IMP PMID:8093698 (CACAO)
      plus IBA and IEA; PuuA has only the IBA and an InterPro IEA.
    - >-
      interpro/panther/PTHR43785/PTHR43785-review.yaml lists the node UNRESOLVED, pending an assay of PuuA or a
      PauA enzyme with ammonium.
    review_edited: false
    notes: >-
      The seed is a true glutamine synthetase in a sister clade; the target's clade ligates glutamate to
      putrescine and PAINT itself places polyamine catabolism there. Nothing shows PuuA cannot use ammonium, so
      this is doubt and not loss. The reason names the node, the seed and the PuuA and PauA clade. Left as
      written. PTN008120031 is the child that holds the seed; it also holds gamma-glutamylpolyamine synthetases
      (Streptomyces GlnA2 and GlnA3), so the curator may want a narrower node still.
- gene_file: genes/ECOLI/recD/recD-ai-review.yaml
  rows:
  - go_id: GO:1903775
    go_label: regulation of DNA double-strand break processing
    family: PTHR43788
    ibd_node: PTN008452915
    tree_reading: &recd_tree >-
      IBD at PTN008452915 (51 leaves, 47 species) with two seeds, human HELB (Q8NG08) and mouse Helb
      (MGI:MGI:2152895). The node has two children. Both seeds are in PTN008685111 (25 leaves, the HELB
      clade). RecD (leaf PTN000854246) is in PTN000095219 (26 leaves, bacterial RecD and RecD2), which carries
      its own IBDs for exodeoxyribonuclease V complex and DNA recombination and holds no seed for this term.
      No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008685111
    evidence_checked: &recd_ev
    - >-
      QuickGO for Q8NG08, Q6NVF4 and P04993 on GO:1903775 and GO:2000042. Human HELB and mouse Helb each carry
      involved_in IMP PMID:26774285 (UniProt) for both terms; RecD has only the IBAs.
    - >-
      interpro/panther/PTHR43788/PTHR43788-review.yaml assesses both IBDs TOO_DEEP and quotes PMID:26774285
      for HELB inhibiting EXO1 and BLM-DNA2.
    review_edited: false
    notes: >-
      The seeds are sound for HELB, which restrains resection from outside the resection machinery. RecD is a
      motor subunit of the resecting enzyme. It does tune the holoenzyme (the review quotes UniProt on
      stimulating the RecB nuclease), so a regulatory reading is not excluded and the row stays an
      over-annotation and not a removal. The reason and propagation_review name the node and the seeds. Left
      as written. The review removes the DNA replication IBA from the same node, where there is nothing on
      RecD to support the term.
  - go_id: GO:2000042
    go_label: negative regulation of double-strand break repair via homologous recombination
    family: PTHR43788
    ibd_node: PTN008452915
    tree_reading: *recd_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008685111
    evidence_checked: *recd_ev
    review_edited: false
    notes: >-
      Same node and seeds as the row above. The family review calls the sign wrong for RecD because RecBCD
      initiates recombinational repair. The gene review's own quotes point the other way for the subunit
      (UniProt, RecD negatively regulates the RecA-loading ability of RecBCD, and recD nulls stay
      recombination proficient), so a negative regulatory role inside the enzyme is not excluded. That is doubt
      and not evidence that the term is wrong, so the over-annotation call holds and a removal would overreach.
      Left as written.
- gene_file: genes/ECOLI/rbsA/rbsA-ai-review.yaml
  rows:
  - go_id: GO:0015147
    go_label: L-arabinose transmembrane transporter activity
    family: PTHR43790
    ibd_node: PTN001953353
    tree_reading: >-
      IBD at PTN001953353 (17 leaves, 6 species) with one seed, E. coli AraG (P0AAF3). The node's children are
      PTN001953354 (13 leaves; holds both the seed and the target) and PTN002465268 (4 Bradyrhizobium leaves).
      Inside PTN001953354 the seed is in the AraG pair PTN001953348 (2 leaves, E. coli and Y. pestis araG) and
      RbsA (leaf PTN000656443) is in PTN001953357 (9 leaves) with AlsA; the two join at PTN005182433 (11
      leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001953348
    evidence_checked:
    - >-
      QuickGO GO:0015147 with descendants for P0AAF3 and P04983. AraG enables EXP PMID:2656640 (EcoCyc) and a
      UniProt IEA for the ABC-type L-arabinose term; RbsA has only the IBA.
    - Lineages of P0AAF3 and P04983 computed from the cached PTHR43790 tree.
    - >-
      interpro/panther/PTHR43790/PTHR43790-review.yaml assesses the node TOO_DEEP and scopes the term to the
      AraG subfamily.
    review_edited: false
    notes: >-
      The seed is in the target's child clade, so the row was looked at closely (pattern 18). The seed is a
      paralog across a duplication, AraG against the RbsA and AlsA branch, and the substrate of an ABC importer
      is set by its binding protein and permease. Everything known for RbsABC is D-ribose, but no assay rules
      out L-arabinose, so this is doubt and not a shown loss. The seed row also gives the transporter's
      activity to the ATPase subunit, as in pstB. The reason names the seed and the ribose clade; the family
      review quotes it. Left as written.
- gene_file: genes/ECOLI/paaJ/paaJ-ai-review.yaml
  rows:
  - go_id: GO:0006635
    go_label: fatty acid beta-oxidation
    family: PTHR43853
    ibd_node: PTN001823071
    tree_reading: >-
      IBD at the family root PTN001823071 (204 leaves, 98 species) with five seeds. Human ACAA1 (P09110), mouse
      and rat Acaa1 and yeast POT1 are in the eukaryotic child PTN000432379 (170 leaves). E. coli FadA (P21151)
      is in the bacterial child PTN002466580 (34 leaves) with the target. PaaJ (leaf PTN001291485) is in a
      4-leaf clade PTN001052867 and joins FadA at PTN008685866 (10 leaves), inside a clade of FadA and PcaF
      enzymes (PTN000432481, 16 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0006635 with descendants for P21151, P09110, P27796 and P0C7L2. FadA involved_in IDA
      PMID:368024 (ComplexPortal) and acts_upstream_of_or_within IMP PMID:12535077 (EcoCyc); ACAA1 IMP
      PMID:2365812 and PMID:2882519 (UniProt); POT1 IMP PMID:12819196 (SGD). PaaJ has only the IBA.
    - >-
      interpro/panther/PTHR43853/PTHR43853-review.yaml leaves the node UNRESOLVED; it notes that a dedicated
      aromatic-substrate thiolase does not exclude a secondary fatty-acyl role and that no assay rules one out.
    - Lineages of P21151 and P0C7L2 computed from the cached PTHR43853 tree.
    review_edited: false
    notes: >-
      The node is soundly seeded on both sides of the root, and FadA is a close paralog of PaaJ, so this is
      not a placement problem. The doubt is on the target's subfamily. PaaJ is the PcaF-type 3-oxoadipyl-CoA
      thiolase of the paa operon, cleaves ring-derived dicarboxylic intermediates, and does not form a
      beta-oxidation complex with PaaF and PaaH (the row's quote from PMID:22961985). No experiment shows it
      cannot cleave fatty 3-oxoacyl-CoAs. The reason states this and names the seeds. Left as written. What
      would settle it is PaaJ activity on straight-chain 3-oxoacyl-CoAs, or growth of a fadA fadI strain on
      fatty acids with paaJ expressed. If that is negative the fix is an IRD on the PaaJ and PcaF branch.
- gene_file: genes/ECOLI/dgcZ/dgcZ-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR45138
    ibd_node: PTN002895351
    tree_reading: >-
      IBD at PTN002895351 (199 leaves, 26 species) with six seeds, all E. coli diguanylate cyclases. DgcN
      (P46139), DgcJ (P76237) and DgcQ (P76330) are in the child PTN002895352 (20 leaves); DgcI (P75801) is in
      PTN008690381 (19 leaves); CdgI (P76236) and DgcF (P76147) are in the target's child PTN002554534 (152
      leaves) and in the same 6-leaf E. coli clade PTN002895515 as DgcZ (leaf PTN002246699). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005886 with descendants for the six seeds and P31129. Each seed carries located_in IDA
      PMID:15919996 (EcoCyc) plus a UniProt subcellular-location IEA; DgcZ has only the IBA.
    - Lineages of the six seeds and of P31129 computed from the cached PTHR45138 tree.
    - >-
      publications/PMID_27402625.md (full text). DgcZ is evenly distributed in the cytoplasm in transition
      phase and at one cell pole in stationary phase; the only membrane statement about a partner is that the
      FrdA and FrdB fusions label the whole membrane and do not follow DgcZ. The UniProt record lists no
      transmembrane segment.
    review_edited: false
    notes: >-
      Two seeds sit in the target's own 6-leaf clade, so the node is not too deep for it and the ground is on
      the target. The tree is built on the shared GGDEF domain while the N-terminal sensor and membrane
      domains differ between members; the seeds are membrane proteins and DgcZ is a soluble zinc-sensor
      cyclase seen in the cytoplasm and at a pole. That argues against a membrane site of action without
      excluding a peripheral association at the pole. The reason names the node and the target data and does
      not misstate the seeds. Left as written. Membrane fractionation of native DgcZ would settle it; if it is
      soluble the fix is an IRD on the DgcZ leaf.
- gene_file: genes/ECOLI/ptsI/ptsI-ai-review.yaml
  rows:
  - go_id: GO:0015764
    go_label: N-acetylglucosamine transport
    family: PTHR46244
    ibd_node: PTN000532509
    tree_reading: >-
      IBD at the family root PTN000532509 (43 leaves, 25 species) with one seed, P. aeruginosa PA3760
      (Q9HXN5). The root's child PTN008196399 (28 leaves) holds both seed and target. The seed (clade
      PTN002341767, 2 leaves) and ptsI (leaf PTN000532533) are both in PTN001879016 (14 leaves, enzyme I
      proteins and multiphosphoryl fusions). The EI(Ntr) proteins (ptsP) join one node up at PTN009195473 (21
      leaves). The other root children (Gram-positive enzyme I, 10 leaves, and smaller clades) hold no seed.
      No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0015764 with descendants for Q9HXN5, P08839 and P0AA04. PA3760 involved_in IMP PMID:18833300
      (PseudoCAP); EI has only the IBA; HPr has no row.
    - >-
      Lineages of P08839, Q9HXN5 and P37177 (PtsP) computed from the cached PTHR46244 tree.
    - >-
      interpro/panther/PTHR46244/PTHR46244-review.yaml assesses the node TOO_DEEP because it covers EI(Ntr)
      and enzyme I proteins of unrelated sugars.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The earlier reason conceded the claim is true
      (the general enzyme I feeds the N-acetylglucosamine Enzyme II through HPr) and marked the row because
      the general PTS proteins usually carry only GO:0009401 and one sugar out of many looked arbitrary. That
      is about how specific the term is and is not one of the three grounds; the target is inside the seeded
      clade and nothing on E. coli EI argues against the term. It is non-core because EI is not specific for
      this sugar. propagation_review set to NO_FAILURE_NON_CORE, a dated note appended to ptsI-notes.md, and a
      history record added. The family-level TOO_DEEP verdict still stands for PtsP (its review removes the
      row); moving the IBD to the seed's own clade PTN002341767 would take the term off ptsI as well, which is
      a PAINT choice between a narrow sugar-specific placement and none. Xanthomonas FruB carries the same IBA
      as over-annotated; FruB is a fructose-specific fusion, so that call does not have to follow this one.
- gene_file: genes/ECOLI/paaH/paaH-ai-review.yaml
