  rows:
  - go_id: GO:0048188
    go_label: Set1C/COMPASS complex
    family: PTHR19861
    ibd_node: PTN000458398
    tree_reading: >-
      IBD at PTN000458398 (175 leaves, 95 species) with five seeds, human WDR82 (Q6UXN9), yeast SWD2
      (SGD:S000001501, P36104), fly Wdr82 (FB:FBgn0032030), fission yeast swd2 (PomBase:SPBC18H10.06c) and a
      Dictyostelium gene. All five are in the child PTN000458399 (67 leaves, animals, fungi and amoebozoa).
      APRF1 (leaf PTN000458476) is in the other child PTN007677391 (108 leaves, plants and protists), which
      holds no seed. Inside it the APRF1 clade PTN000458474 (43 leaves) and the clade of its paralog S2LB
      (At5g66240, Q8RXD8; PTN000458471, 43 leaves) join at PTN001836717 (96 leaves). PAINT records a loss of
      this term (NOT IRD GO:0048188) at PTN008571759, the fission yeast paralog SPAC824.04 pair, next to an
      IBD for the mRNA cleavage and polyadenylation specificity factor complex.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0048188 with descendants for Q9LYK6, Q6UXN9 and P36104. SWD2 part_of IPI and IDA rows from
      several papers (SGD, ComplexPortal, UniProt); WDR82 part_of IDA PMID:17998332 and PMID:18838538 (UniProt)
      and IPI PMID:23508102 (ComplexPortal); APRF1 has only the IBA.
    - >-
      Seed and paralog lineages computed from the cached PTHR19861 tree.
    - >-
      The row quotes PMID:38851185, read in full by the gene review, which has S2LB working through COMPASS
      and APRF1 with the 3' processing machinery.
    - interpro/panther/PTHR19861/PTHR19861-review.yaml has no node entry for this term.
    review_edited: false
    notes: >-
      The seeds are sound and the node also reaches a seedless plant clade, but the ground is on the target.
      Plants duplicated the gene, and the direct comparison puts COMPASS with S2LB and the termination branch
      with APRF1. The review does not claim APRF1 is absent from COMPASS (it complements yeast swd2 and has
      undecided H3K4 methylation rows), so this is partial divergence and not a shown loss. The reason names
      the node and the paralog evidence. Left as written. The fission yeast loss on the paralog that went to
      the cleavage and polyadenylation complex is the precedent for the same split; if APRF1 is shown not to
      be a COMPASS subunit the fix is an IRD at PTN000458474. Moving the IBD to the seeded child would also
      strip S2LB, where the term is probably right.
