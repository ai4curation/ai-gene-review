      already cited elsewhere in the same review tested it on Inp52 and found none, with a positive control, which
      is direct evidence that the activity is absent on this leaf. The node and its seeds are sound, so the fix is
      a loss and not a move. It is named on the Inp52 leaf PTN000128228 because Inp52 is the only one of the three
      yeast enzymes with a direct assay read here; if the cited earlier work shows the same for Inp51 and Inp53,
      the loss belongs at PTN001341482 (7 leaves). Quote added, propagation_review added, history record added.
      The INP53 review keeps its row over-annotated for want of a direct assay, which is consistent with this.
