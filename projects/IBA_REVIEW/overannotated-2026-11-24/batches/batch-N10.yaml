genes:
- gene_file: genes/yeast/CLB2/CLB2-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR10177
    ibd_node: PTN000019791
    tree_reading: >-
      IBD at PTN000019791 (2313 of the family's 2318 leaves) with 16 seeds. Clb2 (leaf PTN000020180) pairs with
      Clb1 in PTN000020177 (3 leaves with the Eremothecium ortholog). Its sister under the 6-leaf duplication node
      PTN000808799 is PTN000020169, which holds the yeast seeds Clb5 and Clb6. The Cln3 seed joins only at the IBD
      node (other side, PTN002468700, 562 leaves); the D, E and A cyclin seeds (human CCND1, CCND2, CCNE1, fly
      CycE and CycA, worm cyd-1 and cye-1) are in PTN000808716 (296 leaves) and join Clb2 at PTN007424001 (439
      leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000808716
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Clb5 (P30283) carries IMP and IGI rows from PMID:8253070 and IMP from
      PMID:8319908; Clb6 (P32943) IMP and IGI from PMID:8253070 and IGI from PMID:8319908; Cln3 (P13365) IMP and
      IGI from PMID:19823668. Clb2 (P24869) and Clb1 (P24868) carry only the IBA.
    - The row quotes PMID:8455600 (Clb1 and Clb2 expressed from late S phase to mitosis); quote left as it is.
    review_edited: false
    notes: >-
      Same call and same named move as human CCNB1 in batch H01. The seeds are sound and one pair of them, Clb5 and
      Clb6, is the sister clade of Clb1 and Clb2, so the node is not unseeded near the target. The ground is that a
      near-root node carries the term across the duplication into the mitotic pair, where the timing of Clb2
      expression and its opposition to the G1 program give reason to doubt it. Loss is not shown, since B-type
      cyclins can drive S phase when Clb5 and Clb6 are missing. The move to PTN000808716 covers the D, E and A
      cyclins only; the fungal S-phase cyclins need their own IBD at PTN000020169, and the Cln and plant D cyclins
      theirs. The existing reason names the node and the divergence and was left alone.
  - go_id: GO:0007089
    go_label: traversing start control point of mitotic cell cycle
    family: PTHR10177
    ibd_node: PTN000808767
    tree_reading: &start_tree >-
      IBD at PTN000808767 (24 leaves, fungal B-type cyclins) with one seed, S. pombe cig2 (PomBase:SPAPB2B4.03,
      P36630). cig2 pairs with its S. japonicus ortholog in PTN008495036 (2 leaves), whose sister in PTN008302386
      (4 leaves) is the cdc13 pair. That clade joins the S. cerevisiae cyclins at PTN001607597 (17 leaves). The IBD
      is two nodes above, so it reaches cdc13, Clb1, Clb2, Clb5, Clb6, Candida Clb2 and Aspergillus nimE. The
      S. cerevisiae clade PTN000808799 (6 leaves) splits into the Clb5/Clb6 clade PTN000020169 and the Clb1/Clb2
      clade PTN000020177. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &start_fix
      paint_action: MOVE_IBD
      target_node_id: PTN008495036
    evidence_checked:
    - >-
      QuickGO by accession and GO id. cig2 (P36630) carries involved_in IGI PMID:9552380 (PomBase); cdc13 (P10815),
      Clb2 and Clb5 carry only the IBA. The gene product search resolves SPAPB2B4.03 to cig2.
    - >-
      publications/PMID_9552380.md is a 1996 review chapter (Martin-Castellanos and Moreno), abstract only. The cig2
      review in this repository accepts the IGI row.
    review_edited: true
    notes: >-
      Action unchanged. The summary, reason and propagation comment named cdc13 as the only seed and argued from the
      engineered single-cyclin strain; the seed is cig2. The text was rewritten to name the seed and its position
      and to rest the call on the node placement, and the SOURCE_EVIDENCE_WEAK failure mode was dropped. History
      record added.
- gene_file: genes/yeast/CLB5/CLB5-ai-review.yaml
  rows:
  - go_id: GO:0005815
    go_label: microtubule organizing center
    family: PTHR10177
    ibd_node: PTN007424001
    tree_reading: >-
      IBD at PTN007424001 (439 leaves) with seven seeds in both child clades. Clb5 (leaf PTN000020172) is in the
      B-type child PTN008939442 (143 leaves) with four seeds. S. cerevisiae Clb2 (SGD:S000006323) joins Clb5 at
      PTN000808799 (6 leaves), S. pombe cdc13 at PTN001607597 (17 leaves), human CCNB1 and CCNB2 at PTN008939442.
      Human CCNF, rat Ccne1 (RGD:2294) and S. pombe crs1 are in the other child PTN000808716 (296 leaves). No loss
      recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005815 and descendants. Clb2 located_in spindle pole body IDA PMID:12972503 (SGD);
      cdc13 is_active_in mitotic spindle pole body and other SPB terms (PomBase, several papers); CCNB1 and CCNB2
      centrosome IDA (UniProt); CCNF centrosome and centriole IDA. S. pombe cig2, the S-phase counterpart of Clb5,
      carries mitotic spindle pole body HDA PMID:16823372 but is not a seed. Clb5 carries only the IBA.
    - >-
      PubMed search for Clb5 at the spindle pole body. No localization paper found; PMID:16236795 (abstract read
      through the PubMed tool) reports that Clb5 binds Kar9 and that clb5 mutants lose the Kar9 asymmetry between
      the two SPBs. doi 10.1091/mbc.e05-06-0565.
    review_edited: true
    notes: >-
      The earlier reason was that no SPB enrichment of Clb5 has been reported, which is missing evidence, and the
      nuclear staining it quotes does not exclude a pool at an organelle embedded in the nuclear envelope. With the
      sister paralog a seed in the same 6-leaf clade the term is kept, as non-core because the core site of
      Clb5-Cdc28 action is the nucleus. The summary also misnamed three seeds (rat cyclin B for rat cyclin E1,
      and it placed crs1 and cyclin F among the mitotic B-type cyclins); corrected. PMID:16236795 is not in the
      publications cache and is cited in the reason as prose only. Batch H01 kept human CCND1 over-annotated on the
      same node because the D-type lineage has no seed below PTN008302335; Clb5 differs in having a seed next door.
      History record added.
  - go_id: GO:0007089
    go_label: traversing start control point of mitotic cell cycle
    family: PTHR10177
    ibd_node: PTN000808767
    tree_reading: *start_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *start_fix
    evidence_checked:
    - QuickGO as for CLB2. cig2 IGI PMID:9552380 is the only experimental row among the node's members.
    - >-
      The row quotes PMID:8319908 (clb5 clb6 cells delay replication; ectopic CLB5 bypasses the Clns) and
      PMID:7954792 (Sic1 inhibits Clb but not Cln kinase); quotes left as they are.
    review_edited: false
    notes: >-
      Clb5 is the closest functional counterpart of the seed, so this is the harder of the two rows on this node.
      The call still holds on two grounds the reason already gives. The seed is two nodes below the IBD, and on the
      target the feedback loop that defines the term is run by Cln3, Cln1 and Cln2, with Clb5-Cdc28 held inactive
      by Sic1 until after Start; clb5 clb6 cells pass Start on schedule. S. pombe has no Cln-type Start cyclins,
      which is why the term fits cig2. The summary and comment name cig2 and the node correctly; left alone.
- gene_file: genes/yeast/CLN3/CLN3-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR10177
    ibd_node: PTN000019791
    tree_reading: >-
      IBD at PTN000019791 (2313 leaves) with 32 seeds in four of its five child clades. Cln3 (leaf PTN000020175) is
      in PTN002468700 (562 leaves). Its nearest seeds are the paralogs Cln1 and Cln2 (SGD:S000004812 and
      SGD:S000006177), which sit in PTN000808774 (4 leaves) and join Cln3 at PTN000808771 (7 leaves). A trypanosome
      seed (Q381B4) joins at PTN002468700. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005737 and descendants. Cln1 located_in cytoplasm IDA PMID:11080155; Cln2 IDA from
      PMID:10611233, PMID:11080155, PMID:11509671 and PMID:11792824 and IMP from PMID:11509671. Cln3 has no
      experimental cytoplasmic row in GOA; the review proposes endoplasmic reticulum as a NEW row from PMID:17560371.
    - >-
      The row quotes PMID:11509671 (Cln3 needs nuclear localization for its normal roles; Cln3 without its NLS is
      less active in Cln3 assays) and PMID:17560371 (ER retention in early G1); quotes left as they are.
    review_edited: false
    notes: >-
      The node is soundly seeded and Cln3 is inside the seeded clade, next to Cln1 and Cln2, so the ground is on the
      target. The PAINT relation is is_active_in, and the evidence on Cln3 is that its cytoplasmic pool is an
      ER-bound retention state and that the protein must be nuclear to act. That is a transit or holding location
      of the kind pattern 21 describes, so the row stays over-annotated and is not removed. The summary calls
      PTN000019791 the G1-cyclin node; it is the near-root cyclin node, but the propagation_review names the node
      id correctly and the argument does not depend on the label, so the file was left alone. The review keeps
      a cytosolic role in vacuole fusion as regulation only; if that role were shown to be direct the row would
      become KEEP_AS_NON_CORE.
- gene_file: genes/yeast/GUT1/GUT1-ai-review.yaml
  rows:
  - go_id: GO:0006641
    go_label: triglyceride metabolic process
    family: PTHR10196
    ibd_node: PTN000023394
    tree_reading: >-
      IBD at PTN000023394 (189 leaves) with two seeds, human GK (P32189) and mouse Gk (MGI:106594, Q64516), both in
      the animal glycerol kinase clade PTN000810472 (63 leaves). That clade joins the fungal clade PTN000810495 (19
      leaves, holding Gut1) at PTN000023436 (82 leaves); the IBD is three nodes above that join and also covers the
      GK5 clade and a 68-leaf plant and protist clade PTN007425724. PAINT records a loss of this term (NOT IRD) at
      PTN002565401 inside the target's child clade PTN002229998, on a branch that does not hold Gut1.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000810472
    evidence_checked:
    - >-
      QuickGO by accession, GO:0006641 and descendants. Human GK involved_in GO:0006641 IMP PMID:8651297 (BHF-UCL)
      and triglyceride biosynthetic process TAS (Reactome); mouse Gk triglyceride biosynthetic process IMP
      PMID:9302256 (MGI). Gut1 (P32190) carries only the IBA.
    - >-
      Abstracts of both seed papers. PMID:8651297 (cached, abstract only) reports GK mutations in patients with
      isolated glycerol kinase deficiency; PMID:9302256 (PubMed) reports the Gyk knockout mouse with
      hyperglycerolaemia, raised free fatty acids and altered fat metabolism.
    review_edited: false
    notes: >-
      Both seeds are mutant-phenotype rows from the animal enzyme, where glycerol recycling feeds hepatic and
      adipose triglyceride synthesis. The IBD sits three nodes above them. In yeast GUT1 is glucose-repressed and
      needed only for growth on glycerol, as the row quotes, so the biology gives reason to doubt the term on the
      fungal branch without showing loss. The seeds may also over-read a deficiency phenotype as participation, but
      only abstracts were read and Reactome places GK in triglyceride biosynthesis, so no seed defect is claimed.
      The existing reason (precursor supply is not participation, seeds are mammalian) fits this reading; left
      alone. No entry for this term in the PTHR10196 family review.
- gene_file: genes/yeast/PHO91/PHO91-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR10283
    ibd_node: PTN000031793
    tree_reading: >-
      IBD at the family root PTN000031793 (302 leaves) with nine seeds. Seven are animal SLC13 transporters in the
      child PTN000031794 (264 leaves). The other two are yeast Pho87 and Pho90 (SGD:S000000633 and SGD:S000003734),
      which sit in PTN000815053 (4 leaves) and join Pho91 (clade PTN000815055, 3 leaves, with its Eremothecium and
      Candida orthologs) at the duplication node PTN000031962 (7 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005886 and descendants. Pho87 (P25360) and Pho90 (P39535) located_in plasma membrane
      IDA PMID:21143198 (SGD). Pho91 (P27514) carries only the IBA; its experimental location in the review is
      fungal-type vacuole membrane IDA.
    - >-
      The row quotes PMID:41324358 (Pho91 does not support growth as sole Pi transporter; untagged Pho91 co-enriches
      with vacuolar proteins) and PMID:18165238 (Rsp5-dependent endocytic turnover); quotes left as they are.
    review_edited: false
    notes: >-
      The node is soundly seeded and the sister paralogs are seeds, so the ground is evidence on the target that the
      Pho91 branch has moved to the vacuolar membrane after the duplication, with endocytic turnover as the only
      sign of a plasma membrane pool. That is short of showing absence, so the row stays over-annotated. If absence
      of untagged Pho91 from the plasma membrane were shown directly the row would be a REMOVE with a loss at
      PTN000815055. The reason states the tree correctly (root node, Pho87 and Pho90 as seeds); left alone.
  - go_id: GO:0006797
    go_label: polyphosphate metabolic process
    family: PTHR10283
    ibd_node: PTN000815044
    tree_reading: >-
      IBD at PTN000815044 (32 leaves) with three seeds, all from S. cerevisiae and all inside the 7-leaf node
      PTN000031962. They are Pho91 itself (SGD:S000005296), Pho87 and Pho90. The node also covers a 12-leaf protist
      clade PTN007430422. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000815044
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Pho91 (P27514), Pho87 (P25360) and Pho90 (P39535) each carry involved_in IMP
      PMID:17804816 (SGD); no other evidence.
    - >-
      The same-term IMP row of this review quotes PMID:17804816 (Pho91 as a vacuolar phosphate exporter) and is also
      marked over-annotated; quotes left as they are.
    review_edited: false
    notes: >-
      Pho91 is one of its own seeds (treeview prints False because the seed is listed by its SGD id), which is not a
      reason to doubt the IBA. The ground is the seed rows. All three are polyphosphate-level phenotypes of
      phosphate transporter mutants from one paper, a change in the substrate pool read as participation in
      polyphosphate synthesis or breakdown, which is the work of the VTC complex and the polyphosphatases. The
      review marks its own IMP row the same way, so the rows are consistent, and the reason names the node and the
      seeds. Left alone. The seed rows are a query for SGD and not a confirmed defect; the full text of
      PMID:17804816 was not read here.
- gene_file: genes/yeast/AHP1/AHP1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR10430
    ibd_node: PTN000046537
    tree_reading: &ahp1_tree >-
      IBD at PTN000046537 (66 leaves). Its child PTN000046538 (62 leaves) splits into the animal PRDX5 clade
      PTN000824064 (35 leaves), which holds every seed (human PRDX5, rat Prdx5, fly Prx5), and the fungal clade
      PTN002234779 (27 leaves), which holds Ahp1 and has no seed. PAINT already records a loss of both mitochondrion
      and peroxisome (NOT IRD) at PTN000824099 (13 leaves), the pmp20 half of the fungal clade; Ahp1 is in the other
      half, PTN000824083 (13 leaves).
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &ahp1_fix
      paint_action: MOVE_IBD
      target_node_id: PTN000824064
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005739 and descendants. Ahp1 (P38013) and S. pombe pmp20 (O14313) carry only the IBA.
      Ahp1 has cytoplasm IDA and cytosol HDA rows in the review.
    - The PTHR10430 family review lists this node and term as UNRESOLVED and notes the IRD at PTN000824099.
    review_edited: false
    notes: >-
      Pattern 18. All three seeds are in the animal clade and the IBD is one node above the split from the fungal
      clade. The mitochondrial form of animal PRDX5 depends on an N-terminal presequence that Ahp1 lacks, and
      Ahp1 is seen in the cytoplasm, so the biology gives reason to doubt the term on the fungal branch. Under the
      root organelle policy an unsupported synthesis row is marked over-annotated, which the reason says. The loss
      PAINT recorded on the pmp20 clade is a precedent for the same request on the Ahp1 half. The reason does not
      list which clade holds the seeds, but it does not misstate the tree; left alone.
  - go_id: GO:0005777
    go_label: peroxisome
    family: PTHR10430
    ibd_node: PTN000046537
    tree_reading: *ahp1_tree
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *ahp1_fix
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005777 and descendants. Human PRDX5 (P30044) located_in peroxisome IDA PMID:10521424
      and peroxisomal matrix EXP rows; the second seed is rat Prdx5 (RGD:71007). Ahp1 and pmp20 carry only the IBA.
    review_edited: false
    notes: >-
      Same tree as the mitochondrion row; both seeds are in the animal clade. The doubt is weaker here, because
      Ahp1 ends in a PTS1-like tripeptide and the Candida boidinii homologue is peroxisomal, which the reason
      records, so a condition-dependent peroxisomal pool is not excluded and the row is rightly not removed. The
      family review says AHP1 keeps this term as non-core; the gene review now marks it over-annotated, so that
      sentence of the family review is out of date.
- gene_file: genes/yeast/HDA1/HDA1-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR10625
    ibd_node: PTN000065904
    tree_reading: >-
      IBD at PTN000065904 (342 leaves) with 20 seeds in both child clades. In the target's child PTN008949302 (152
      leaves) the human seeds HDAC4, HDAC5, HDAC6, HDAC7, HDAC9 and HDAC10 are all in the animal class II clade
      PTN002900301 (134 leaves). Its sister under PTN001318896 (148 leaves) is the fungal clade PTN000835771 (14
      leaves), which holds Hda1 and S. pombe clr3 and has no seed. The rice and trypanosome seeds are in the other
      child PTN008143307 (190 leaves); the Arabidopsis, fly and rodent seeds were not placed individually. No loss recorded for this term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession, GO:0005737 and descendants. Hda1 (P53973) and clr3 (P56523) carry only the IBA. Under
      GO:0005634 and descendants, clr3 has is_active_in nucleus HDA PMID:16823372, nucleolus IDA PMID:11884604 and
      nucleus EXP PMID:17289569; Hda1 has HDA1 complex rows and a UniProt keyword nucleus IEA.
    review_edited: false
    notes: >-
      The seeds are sound and sit on both sides of the node, so the placement above the fungal clade is not a
      pattern 18 error and no single move is named. The doubt is on the subfamily. The fungal clade has no
      cytoplasmic observation, the genome-wide localization of S. pombe clr3 found it in the nucleus only, and the
      reason gives the structural argument that the features behind cytoplasmic activity in the seeds (the HDAC6
      tubulin deacetylase architecture, the 14-3-3 shuttling sites of class IIa) are absent from Hda1. The reason
      also says that absence of a localization study is not evidence against the term, which is right; what holds
      the call is the architecture argument and the clr3 result, the second of which the review does not cite.
      Left alone.
- gene_file: genes/yeast/YML6/YML6-ai-review.yaml
  rows:
  - go_id: GO:0006417
    go_label: regulation of translation
    family: PTHR10746
    ibd_node: PTN000078778
    tree_reading: >-
      IBD at the family root PTN000078778 (212 leaves) with one seed, E. coli uL4 (P60723), in the bacterial child
      PTN000078848 (34 leaves). Yml6 is in the other child PTN000078780 (178 leaves), the mitochondrial and
      chloroplast uL4 clade, which carries its own IBD for mitochondrial large ribosomal subunit and no seed for
      this term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000078848
    evidence_checked:
    - >-
      QuickGO by accession, GO:0006417 and descendants. E. coli rplD (P60723) carries negative regulation of
      translation IMP PMID:13130133 (CAFA) and translation repressor activity IDA PMID:6996835 and IMP
      PMID:13130133. It has no experimental row on GO:0006417 itself, so the IBD generalises the seed's child term.
    review_edited: false
    notes: >-
      Pattern 18 at the root. The seed's function is autogenous repression of the S10 operon, which depends on the
      bacterial operon leader and has no counterpart for a nuclear-encoded mitochondrial protein. The reason names
      both nodes, the seed and the biology; left alone.
- gene_file: genes/yeast/SIR3/SIR3-ai-review.yaml
  rows:
  - go_id: GO:0003688
    go_label: DNA replication origin binding
    family: PTHR10763
    ibd_node: PTN000080056
    tree_reading: >-
      IBD at PTN000080056 (242 leaves) with four seeds. Sir3 itself (SGD:S000004434, leaf PTN000080103) and its
      whole-genome-duplication paralog Orc1 (SGD:S000004530, leaf PTN000080104) form the 2-leaf node PTN000080102;
      Plasmodium ORC1 (Q8I615) joins at PTN000080057 (120 leaves, the ORC1 clade); yeast Cdc6 (SGD:S000003730) is
      in the other child PTN000080129 (122 leaves). PAINT records a loss on the Sir3 leaf for a different term,
      GO:0005664 nuclear origin of replication recognition complex (NOT IRD at PTN000080103).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Sir3 (P06701) enables IDA PMID:29795547 (SGD, with an extension); Orc1
      (P54784) IDA PMID:16824194; Cdc6 (P09119) IDA PMID:16824194 and PMID:9288745; Plasmodium ORC1 IDA
      PMID:19633266.
    - >-
      The review's own IDA row quotes PMID:29795547 (Sir2 and Sir3 ChIP signal on nucleosomes adjacent to origins)
      and is marked over-annotated; quotes left as they are.
    review_edited: false
    notes: >-
      Sir3 is one of its own seeds (listed by SGD id). The Orc1, Cdc6 and Plasmodium seeds are sound origin-binding
      rows; the overreach is the Sir3 seed, a chromatin immunoprecipitation result that places Sir3 on nucleosomes
      next to origins, read as binding of origin DNA. The review marks that IDA row and this IBA alike, so the rows
      are consistent, and its propagation comment already says the target is a seed. No PAINT fix is named. The
      other three seeds justify the IBD, and a loss on the Sir3 leaf (as PAINT already has for the ORC complex,
      and as batch 03 of the removal pass asked for DNA replication initiation) cannot be added while Sir3 carries
      its own experimental row for the term. The fix starts at the SGD row, which the review raises as a
      term-scope question.
- gene_file: genes/yeast/HSP10/HSP10-ai-review.yaml
  rows:
  - go_id: GO:0046872
    go_label: metal ion binding
    family: PTHR10772
    ibd_node: PTN000080668
    tree_reading: >-
      IBD at the family root PTN000080668 (398 leaves) with one seed, M. tuberculosis GroES (P9WPE5), in the
      bacterial child PTN008505467 (45 leaves). Yeast Hsp10 is in the other child PTN000080669 (353 leaves), which
      has no seed for this term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008505467
    evidence_checked:
    - QuickGO by accession and GO id. P9WPE5 enables metal ion binding IDA PMID:11807250 (MTBBASE); nothing else.
    review_edited: false
    notes: >-
      This row was moved from REMOVE to MARK_AS_OVER_ANNOTATED in the removal pass (batch 03) with the same move
      named. Its reason states the node, both child clades and the single crystallographic seed; nothing to change.
- gene_file: genes/yeast/SWI2/SWI2-ai-review.yaml
  rows:
  - go_id: GO:0031507
    go_label: heterochromatin formation
    family: PTHR10799
    ibd_node: PTN004198564
    tree_reading: >-
