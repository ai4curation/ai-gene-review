- gene_file: genes/human/SERPINH1/SERPINH1-ai-review.yaml
  rows:
  - go_id: GO:0004867
    go_label: serine-type endopeptidase inhibitor activity
    family: PTHR11461
    ibd_node: PTN000156127
    tree_reading: >-
      IBD at PTN000156127 (475 leaves) with 24 seeds. SERPINH1 is in the child clade PTN001689409
      (468 leaves) and, further down, in PTN008970209 (459 leaves), which has eleven child clades.
      The HSP47 clade PTN002606963 (27 leaves, SERPINH1 orthologs and fish serpinh2) is one of
      them and holds no seed; the seeds are in the SERPINE1, SERPINE2, SERPING1, SERPINF2,
      SERPINI1 and clade B groups. PAINT records a loss of this term at PTN000156704 (a SERPINB13
      clade), and on the HSP47 clade itself it records a loss of extracellular region and IBDs for
      endoplasmic reticulum and collagen fibril organization.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002606963
    evidence_checked:
    - >-
      QuickGO, GO:0004867 and its parent GO:0004866 with descendants, human SERPINH1 P50454
      carries a TAS row from PMID:1309665 (PINC) and no experimental row; mouse P19324 and rat
      P29457 carry none.
    - >-
      publications/PMID_27838364.md and publications/PMID_21683254.md (reviews from the Nagata
      laboratory) both state that Hsp47 has no serine protease inhibitory activity; quotes added
      to the review.
    - >-
      publications/PMID_1309665.md is abstract only and reports sequence similarity to the serpin
      family, with no inhibition experiment.
    - interpro/panther/PTHR11461/PTHR11461-paint.tsv for the loss records.
    review_edited: true
    notes: >-
      The earlier reason already said HSP47 lacks the activity, which is a claim that the term is
      false and not that it is over-stated; with no seed in the HSP47 clade and published
      statements of no inhibitory activity this is a removal with a PAINT loss. The IEA and TAS
      rows on the same term were changed to REMOVE with it. The TAS source was read as an abstract
      only, so the removal of that row rests on the later literature and not on a reading of the
      1992 paper. The two reviews are secondary statements; the primary assay behind them was not
      traced. PMID:21683254 and PMID:27838364 were added to the references list.
- gene_file: genes/human/TPH1/TPH1-ai-review.yaml
  rows:
  - go_id: GO:0043005
    go_label: neuron projection
    family: PTHR11473
    ibd_node: PTN000158467
    tree_reading: >-
      IBD at PTN000158467 (56 leaves) with two seeds. Its child clades are PTN002607590 (47
