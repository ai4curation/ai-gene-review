genes:
- gene_file: genes/human/BAX/BAX-ai-review.yaml
  rows:
  - go_id: GO:0043066
    go_label: negative regulation of apoptotic process
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      IBD at the family root PTN000135648 (246 leaves) with 23 seeds. The root has five child
      clades. BAX is in PTN000883411 (73 leaves, the MCL1, BAX and BCL2A1 group), inside the BAX
      clade PTN008515428 (22 leaves). Most seeds are pro-survival members in other clades (BCL2,
      BCL2L1, BCL2L2 in PTN000883460; BCL2L10 in PTN008515446) or in the sister MCL1 and BCL2A1
      clades. One seed, mouse Bax (MGI:99702), lies in the BAX clade. PAINT records losses of this
      term only inside the BOK clade (PTN000135883, PTN002600738).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, mouse Bax Q07813, GO:0043066 and descendants, returned two MGI rows, both
      acts_upstream_of_or_within, GO:0043524 by IDA from PMID:8625820 and GO:2001234 by IGI from
      PMID:18436203.
    - QuickGO, human BAX Q07812, same query, returned only the IBA.
    - >-
      Positive control for the query shape, MCL1 Q07820, returned its IDA row to GO:0043066 from
      PMID:20041405.
    review_edited: false
    notes: >-
      The existing reason already names the root node, the BAX clade and the mouse Bax seed and
      rests on what that seed shows (overexpression rescue of NGF-deprived neurons), so the file
      was left alone. No single PAINT move fixes it, because sound seeds sit in four of the five
      child clades. A loss on the BAX clade PTN008515428 would be the fix only if MGI's two Bax
      rows stopped being used as seeds.
- gene_file: genes/human/BCL2L1/BCL2L1-ai-review.yaml
  rows:
  - go_id: GO:0043065
    go_label: positive regulation of apoptotic process
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      IBD at the family root PTN000135648 (246 leaves) with 17 seeds. BCL2L1 is in the child clade
      PTN000883460 (80 leaves, the BCL2L1, BCL2 and BCL2L2 group). Two seeds are BCL2L1 orthologs
      in that clade, rat Bcl2l1 (RGD:2200) and mouse Bcl2l1 (MGI:88139). The other seeds are BAX,
      BAK1, BOK, MCL1 and ced-9 relatives in the other child clades.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, rat Bcl2l1 P53563, GO:0043065 and descendants, returned an RGD IMP row from
      PMID:22158476 and an ISO row from MGI:88139 whose with-field also names PR:Q64373-2.
    - >-
      UniProt Q64373 alternative products, Q64373-2 is Bcl-X(S). The mouse experimental row itself
      is keyed to the isoform and is not returned by QuickGO for the gene accession.
    - RGD REST lookup, RGD:2200 is Bcl2l1.
    - >-
      PMID:22158476 abstract (PubMed) is about Bim and cAMP-induced apoptosis and does not name
      Bcl-x; the rat IMP row could not be checked beyond its evidence code.
    review_edited: true
    notes: >-
      The earlier reason called the row an isoform conflation. The tree shows the term is seeded
      on BCL2L1's own orthologs, with the mouse seed keyed to Bcl-xS, and the review's own human
      evidence (PMID:8358789) shows Bcl-xS is pro-apoptotic, so the term is true of the gene
      through one isoform and is kept as non-core. A supporting_text entry that only read
      'provider: perplexity' was removed from the row.
- gene_file: genes/human/MCL1/MCL1-ai-review.yaml
  rows:
  - go_id: GO:0015267
    go_label: channel activity
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      IBD at the family root PTN000135648 (246 leaves) with three seeds, human BCL2, BAX and BAK1,
      in three different child clades (PTN000883460, PTN000883411, PTN008318549). MCL1 is in
      PTN000883411 (73 leaves), in the MCL1 clade PTN002600668 (25 leaves); BAX is in the same
      child clade, in the sister group. No loss of this term is recorded in the family.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, GO:0015267 and descendants, BCL2 P10415 and BAX Q07812 each carry an IDA row from
      PMID:9219694 (BHF-UCL); BAK1 Q16611 carries an IDA row to GO:0015288 from PMID:22006182.
    - QuickGO, MCL1 Q07820 and BCL2L1 Q07817, same query, returned only the IBA.
    - >-
      publications/PMID_9219694.md is abstract only (Inhibition of Bax channel-forming activity by
      Bcl-2).
    review_edited: false
    notes: >-
      The existing reason is already node-aware and rests on the pro-survival seed being channel
      formation by purified BCL2 in artificial membranes. Left alone. The effector seeds (BAX,
      BAK1) are sound; the doubt is confined to what the BCL2 seed shows for pro-survival members.
- gene_file: genes/human/ERCC3/ERCC3-ai-review.yaml
  rows:
  - go_id: GO:0048568
    go_label: embryonic organ development
    family: PTHR11274
    ibd_node: PTN000138607
    tree_reading: >-
      IBD at PTN000138607 (11 leaves, 11 species, the eutherian ERCC3 orthologs) with a single
      seed, rat Ercc3 (RGD:1307139). The node has two child clades, PTN000138608 (6 leaves, primates
      and rodents, holding the target and the seed) and PTN000138617 (5 leaves). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000138607
    evidence_checked:
    - >-
      QuickGO, rat Ercc3 Q4G005, GO:0048568 and descendants, returned one RGD row, involved_in by
      IEP from PMID:11425516.
    - QuickGO, mouse P49135 and human P19447, same query, returned only the IBA.
    review_edited: false
    notes: >-
      The only seed is an expression-pattern (IEP) row, which shows when the gene is expressed and
      not that the product takes part in organ development. The existing reason says this and
      names the node. Left alone.
- gene_file: genes/human/VWF/VWF-ai-review.yaml
  rows:
  - go_id: GO:0005201
    go_label: extracellular matrix structural constituent
    family: PTHR11339
    ibd_node: PTN000885756
    tree_reading: >-
      IBD at PTN000885756 (289 leaves) with two seeds. Below it, PTN008965568 (287 leaves) splits
      into PTN008965569 (41 leaves) and PTN000886007 (246 leaves, mucins, SCO-spondin, zonadhesin,
      FCGBP and others). PTN008965569 leads to PTN008965570 (39 leaves), which splits into the
      otogelin-like clade PTN002602322 (18 leaves) and the VWF clade PTN002602369 (21 leaves). One
      seed is mouse Otogl in PTN002602322 and the other is mouse Muc2 in PTN000886007. The VWF
      clade has no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002602322
    evidence_checked:
    - >-
      QuickGO, GO:0005201 and descendants, mouse Otogl F7A4A7 carries an IMP row from
      PMID:31776257 and mouse Muc2 Q80Z19 an IDA row from PMID:35337837.
    - >-
      QuickGO, mouse Vwf Q8CIZ8 and human VWF P04275 carry only RCA rows (matrisome proteomics);
      mouse Muc6, Muc5b, Muc5ac, Otog, Zan, Fcgbp returned no experimental row.
    review_edited: false
    notes: >-
      The existing reason names the node and argues from VWF's role as an adhesive bridge and not
      a load-bearing matrix component; it does not misstate the tree, so it was left alone. The
      two seeds are in different clades (a gel-forming mucin and an otogelin-like protein of the
      tectorial membrane), so the move needs two placements, PTN002602322 for Otogl and the Muc2
      clade inside PTN000886007. The three RCA rows on the same term carry the same action.
- gene_file: genes/human/NME1/NME1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR11349
    ibd_node: PTN000142925
    tree_reading: >-
      IBD at PTN000142925 (374 leaves, eukaryotic NDK node) with seven seeds. NME1 is in the child
      clade PTN000142926 (139 leaves), then in the vertebrate node PTN001347048 (88 leaves), whose
      four child clades are NME3 (PTN002603031, 17 leaves), NME1 (PTN007501863, 22 leaves), NME4
      (PTN002603023, 20 leaves) and NME2 (PTN002603037, 29 leaves). Seeds NME3 and NME4 are in
      their own clades; rat Nme1 (RGD:70497) is in the NME1 clade and rat Nme2 (RGD:619877) in the
      NME2 clade; yeast YNK1, Dictyostelium ndkM and Arabidopsis NDPK3 are outside the vertebrate
      node. The only loss recorded for the term is at PTN002260148 (Gloeobacter).
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, GO:0005739 and descendants, rat Nme1 Q05982 carries part_of GO:0005741 by IDA from
      PMID:22817458 (CACAO); rat Nme2 P19804 carries located_in GO:0031966 by IDA from
      PMID:11831846 (RGD); mouse Nme1 P15532 and Nme2 Q01768 carry HDA rows (PMID:18614015,
      PMID:14651853); human NME1 P15531 and NME2 P22392 carry only the IBA.
    - >-
      PMID:22817458 abstract (PubMed), cytosolic NDPK added to isolated rat liver mitochondria,
      less than 9 percent of activity bound, bound isozyme identified as NDPK alpha, a homolog of
      human NDPK-B.
    - >-
      PMID:11831846 abstract (PubMed), beta-cell fractionation, nm23-H1 predominantly soluble,
      nm23-H2 soluble and membranous, nm23-H4 the mitochondrial isoform.
    - interpro/panther/PTHR11349/PTHR11349-review.yaml node assessment for PTN000142925 (NEEDS_PRUNING).
    review_edited: true
    notes: >-
      The earlier reason said the NME1 and NME2 branch has no mitochondrial pool and did not
      retain the location, which overlooks that rat Nme1 and Nme2 are two of the seven seeds and
      sit in this branch. The reason now rests on what those two seeds show (in vitro binding to
      isolated mitochondria, crude fractionation). Under the root organelle policy the row stays
      over-annotated because the organelle claim does not hold on that evidence. The family review
      asks for an IRD on the NME1 and NME2 clades; as the tree stands that loss would contradict
      the two rat seeds, so the first step is a check of those rows (the rat Nme1 row may belong
      to Nme2 by the abstract's own isozyme naming). Only abstracts were read for both seed papers.
- gene_file: genes/human/SLC16A5/SLC16A5-ai-review.yaml
  rows:
  - go_id: GO:0016323
    go_label: basolateral plasma membrane
    family: PTHR11360
    ibd_node: PTN008516700
    tree_reading: >-
      IBD at PTN008516700 (132 leaves) with six seeds. Two levels down, PTN008516702 (120 leaves)
      has six child clades, MCT4 (PTN002603643, 23 leaves), MCT1 (PTN002603626, 27 leaves), MCT3
      (PTN002603634, 16 leaves), MCT6 (PTN002603603, 23 leaves, holding SLC16A5), MCT2
      (PTN002603597, 22 leaves) and PTN002603661 (9 leaves). The seeds are human SLC16A3 in the
      MCT4 clade, rat Slc16a1 in the MCT1 clade, and human, mouse, rat and chicken SLC16A8 in the
      MCT3 clade. The MCT6 clade has no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002603634
    evidence_checked:
    - >-
      QuickGO, GO:0016323 and descendants, SLC16A3 O15427 (IDA PMID:21199217, PMID:31791063),
      SLC16A8 O95907 (IDA, IMP), chicken SLC16A8 Q90632 (EXP), rat Slc16a1 P53987 (IDA
      PMID:10564700, PMID:18619525), mouse Slc16a8 O35308 (IDA), rat Slc16a8 O70461 (EXP).
    - >-
      QuickGO, SLC16A5 O15375, mouse G5E8K6 and rat D4A3B5, GO:0016323 returned only the IBA and
      GO:0016324 (apical) returned nothing.
    - >-
      PMID:21199217 abstract, MCT3 and MCT4 carry basolateral sorting signals in their C-terminal
      tails, MCT1 lacks one and its polarity follows CD147 and varies between epithelia.
    - >-
      PubMed search for MCT6 or SLC16A5 localisation returned five papers; PMID:23935065 abstract
      reports anti-MCT6 staining of the luminal side of human small-intestinal epithelium.
    review_edited: true
    notes: >-
      The earlier reason rested on the term not having been established for MCT6 and named the
      wrong node (PTN002260587, the plasma membrane node). The reason now locates the seeds. The
      seeds are in three sibling clades, so the move needs three placements (PTN002603634 MCT3,
      PTN002603643 MCT4, PTN002603626 MCT1); for MCT1 the seed paper itself says polarity varies.
      Not changed to REMOVE, because luminal staining in one tissue does not exclude a basolateral
      pool elsewhere. PMID:23935065 is not in the publications cache, so no quote was added.
- gene_file: genes/human/SLCO1C1/SLCO1C1-ai-review.yaml
  rows:
  - go_id: GO:0015125
    go_label: bile acid transmembrane transporter activity
    family: PTHR11388
    ibd_node: PTN000147526
    tree_reading: >-
      IBD at PTN000147526 (43 leaves) with two seeds. The node has two child clades, the OATP1A
      clade PTN008517262 (25 leaves, SLCO1A2 and the rodent Slco1a genes) and the OATP1C1 clade
      PTN008967049 (18 leaves, holding the target). Seed RGD:70985 is rat Slco1a5 in the OATP1A
      clade. Seed RGD:628660 is rat Slco1c1, the target's ortholog, in the OATP1C1 clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008517262
    evidence_checked:
    - RGD REST lookup, RGD:628660 is Slco1c1 and RGD:70985 is Slco1a5.
    - >-
      QuickGO, GO:0015125 and descendants, rat Slco1c1 Q9EPZ7 carries an RGD IDA row from
      PMID:11981753; rat Slco1a5 O88397 an RGD IDA row from PMID:11093941; rat Slco1a1 P46720 and
      Slco1a4 O35913 carry no experimental row; human SLCO1C1 and mouse Slco1c1 only the IBA.
    - >-
      QuickGO by reference PMID:11981753 returned two rows in total, both on rat Slco1c1
      (GO:0015125 and GO:0015721, IDA, RGD).
    - >-
      PMID:11981753 abstract (PubMed), uptake of sulfolithocholyltaurine by Oatp1 and Oatp2 cloned
      from rat liver and expressed in HeLa cells. UniProt lists Oatp2 as a synonym of rat Slco1a4
      (O35913) and Oatp14, Bsat1 for Slco1c1 (Q9EPZ7).
    - >-
      PMID:12351693 abstract, human OATP-F substrates are T4, reverse T3, T3, BSP,
      estrone-3-sulfate and estradiol-17beta-glucuronide; no bile acid is mentioned.
    review_edited: true
    notes: >-
      The earlier reason said the node captures the promiscuous bile-salt carriers and not
      OATP1C1; in fact one of the two seeds is rat Slco1c1 itself. That seed looks mis-keyed (the
      paper's abstract is about Oatp1 and Oatp2, and the paper has no rows on Slco1a1 or Slco1a4),
      but only the abstract was read, so it is recorded in the review as a SUSPECTED source defect
      for RGD with requested_change CHECK, not as an established error. The MOVE_IBD to the OATP1A
      clade is conditional on RGD's answer. If the Slco1c1 row is confirmed in the full text, the
      term is seeded on the target's ortholog and this row should become KEEP_AS_NON_CORE.
  - go_id: GO:0015721
    go_label: bile acid and bile salt transport
    family: PTHR11388
    ibd_node: PTN000147526
    tree_reading: >-
      Same node and seeds as the GO:0015125 row. IBD at PTN000147526 (43 leaves), seeds rat
      Slco1a5 (RGD:70985) in the OATP1A clade PTN008517262 and rat Slco1c1 (RGD:628660) in the
      target's clade PTN008967049.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008517262
    evidence_checked:
    - >-
      QuickGO by reference PMID:11981753, rat Slco1c1 Q9EPZ7 carries involved_in GO:0015721 by
      IDA (RGD); see the GO:0015125 row for the abstract.
    review_edited: true
    notes: >-
      Same finding and same conditions as the GO:0015125 row. The source defect is recorded once,
      on the GO:0015125 row, and names both RGD rows.
- gene_file: genes/human/SLCO4A1/SLCO4A1-ai-review.yaml
  rows:
  - go_id: GO:0016323
    go_label: basolateral plasma membrane
    family: PTHR11388
    ibd_node: PTN002261135
    tree_reading: >-
      IBD at PTN002261135 (366 leaves) with 13 seeds. Two child clades, PTN000147522 (215 leaves,
      the OATP1, 2, 3 and 5 groups, holding most seeds) and PTN002604626 (151 leaves, holding the
      target). Inside the target's child clade, PTN007504175 (77 leaves) splits into PTN000147769
      (46 leaves, SLCO4C1 and SLCO6 members, with the seed rat Slco4c1, RGD:1303048) and the
      SLCO4A1 clade PTN002261138 (31 leaves), which has no seed. Fly seeds also sit in the
      151-leaf clade. PAINT records a loss of this term at PTN000147917 (fly Oatp33Ea) and an IBD
      for apical plasma membrane at PTN002604687 in the other child clade.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, GO:0016323 and descendants, SLCO3A1 Q9UIG8 (EXP), SLCO2B1 O94956 (EXP), fly Oatp30B
      Q9VLB3 (IDA) carry experimental rows; SLCO4A1 Q96BD0, mouse Q8K078 and rat Q99N01 carry only
      the IBA, and nothing for GO:0016324.
    - RGD REST lookup, RGD:1303048 is Slco4c1 and RGD:69300 is Slco1b2.
    review_edited: false
    notes: >-
      The existing reason rests on evidence about the gene itself (uptake assayed at the
      microvillous, maternal-facing membrane of placental syncytiotrophoblast), which is a
      TARGET_DOUBT ground, and it does not misstate the tree. Left alone. Polarity in this family
      is paralog and tissue specific (PAINT itself has an apical IBD and a basolateral loss inside
      the family), and the nearest seed is the kidney paralog SLCO4C1 in the sister clade. A
      domain-resolved localisation of OATP4A1 in a polarised epithelium other than placenta would
      settle it.
- gene_file: genes/human/TAS2R16/TAS2R16-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR11394
    ibd_node: PTN000149628
    tree_reading: >-
      IBD at PTN000149628 (449 leaves) with seven seeds, all human TAS2Rs, and the target Q9NYV7
      is itself a seed. Two child clades, PTN001287872 (345 leaves, holding the target and the
      other seeds) and PTN000149807 (104 leaves, Xenopus only).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO, TAS2R16 Q9NYV7, GO:0016020 and descendants, EXP plasma membrane and IDA external
      side of plasma membrane (both PMID:16720576), five Reactome TAS plasma membrane rows, IC
      membrane (PMID:20022913).
    - >-
      QuickGO, seeds TAS2R42 Q7RTR8 and TAS2R60 P59551 carry IDA rows to membrane from
      PMID:20022913.
    review_edited: true
    notes: >-
      Not an over-annotation, the term is true, soundly seeded and the target is a seed. It is
      general, and the review already accepts GO:0005886 plasma membrane on direct evidence and as
      an IBA row, so the action is TOO_GENERAL (the project's action for membrane when a specific
      membrane is asserted elsewhere; the README's list of outcomes does not name it, MODIFY to
      GO:0005886 would be the nearest listed alternative). The IC and IEA rows on the same term
      were changed from MARK_AS_OVER_ANNOTATED to TOO_GENERAL to keep the three rows consistent.
