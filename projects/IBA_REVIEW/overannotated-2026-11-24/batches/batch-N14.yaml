- gene_file: genes/yeast/MSC2/MSC2-ai-review.yaml
  rows:
  - go_id: GO:0005794
    go_label: Golgi apparatus
    family: PTHR45755
    ibd_node: PTN000169412
    tree_reading: >-
      IBD at PTN000169412 (182 leaves, 96 species) with 10 seeds, among them human SLC30A5 (Q8TAD4) and
      SLC30A7 (Q8NEW0), mouse and rat ids, fly FBgn0037875, two Dictyostelium ids, Arabidopsis Q9SI03,
      Trypanosoma Q381T0 and S. pombe cis4 (PomBase:SPAC17D4.03c). Children are PTN000169508 (87 leaves,
      holds the target, the human seeds, the Dictyostelium seeds and cis4) and PTN008161940 (95 leaves,
      plants and protists, holds the Arabidopsis and Trypanosoma seeds). The rodent and fly seed ids were
      not placed individually. MSC2 and cis4 share the fungal
      clade PTN000901628 (16 leaves, 14 species), a child-side branch of PTN000169509 (80 leaves). So a
      seed sits in the target's own fungal clade. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005794 with descendants. Human SLC30A5 Q8TAD4 has is_active_in GO:0000139
      IDA PMID:11904301 and located_in IDA PMID:10330022, PMID:17349999 and HPA; SLC30A7 Q8NEW0 has located_in
      IDA PMID:17349999 and others; S. pombe cis4 Q9HGQ3 has is_active_in GO:0000139 IDA PMID:18199682; MSC2
      Q03455 carries only IBAs. The query returned the seed rows, so the empty MSC2 result is real.
    - >-
      The row quotes PMID:15277543 (Msc2 colocalises with an ER marker and shows the ER magnesium shift;
      some protein may be in later compartments, perhaps the Golgi) and PMID:18199682 for Cis4. Accepted
      rows of the review place Msc2 in the ER (IDA PMID:15277543, HDA PMID:26928762).
    - >-
      interpro/panther/PTHR45755/PTHR45755-review.yaml describes the cis-Golgi function as directly
      supported for Cis4 and Zrg17 and does not assess this node.
    review_edited: false
    notes: >-
      Upheld. The node is soundly seeded and the fungal clade that holds MSC2 holds a seed, so the tree
      gives no ground. The ground is evidence on the target. Msc2 is experimentally an ER membrane protein
      whose zinc transport serves the ER lumen, and Golgi function was unaffected in msc2 mutants, while
      fractionation leaves a possible minor post-ER pool. That is a relocalised site of action in the
      budding-yeast lineage short of a shown absence, so not a REMOVE. The reason already says this and
      names the node. What would settle it is imaging of endogenous Msc2 against cis-Golgi markers.
  - go_id: GO:0031410
    go_label: cytoplasmic vesicle
    family: PTHR45755
    ibd_node: PTN000169412
    tree_reading: >-
      IBD at PTN000169412 (182 leaves) with four seeds, mouse MGI:1913750, human SLC30A5 (Q8TAD4) and two
      Dictyostelium ids (DDB_G0269332, DDB_G0291141). All four are in child PTN000169508 (87 leaves), the
      animal seeds in PTN000169509 (80 leaves) and the Dictyostelium seeds in the 7-leaf amoebozoan clade
      PTN000901648. The other child PTN008161940 (95 leaves, plants and protists) holds none. MSC2 is in
      the fungal clade PTN000901628 (16 leaves) inside PTN000169509, which holds no seed for this term.
      No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0031410 with descendants. Human SLC30A5 has located_in GO:0012507 ER to
      Golgi transport vesicle membrane IDA PMID:15525635, GO:0030141 secretory granule IDA PMID:10330022
      and GO:0030667 secretory granule membrane IDA PMID:11904301; the two Dictyostelium proteins have
      located_in GO:0055037 recycling endosome IDA PMID:30404827; mouse Slc30a5 Q8R4H9 returned only ISS
      and ISO rows under this accession.
    - The row quotes PMID:15277543 and PMID:11058603 for the ER and nuclear envelope location of Msc2.
    review_edited: false
    notes: >-
      Upheld, same ground as the Golgi row. The seeds are secretory granules, transport vesicles and
      recycling endosomes of animal and amoebozoan relatives, and the IBD is one node above the clade
      that holds them all (PTN000169508), so it also reaches the plant clade. For Msc2 the evidence is an
      ER resident with no vesicular observation. The reason states the target evidence and that transit
      through vesicles cannot be excluded. If PAINT acts, the placement that fits the seeds is
      PTN000169508; that would not take the term off MSC2, so no node change is requested for this row.
  - go_id: GO:1990674
    go_label: Golgi cis cisterna membrane
    family: PTHR45755
    ibd_node: PTN000169508
    tree_reading: >-
      IBD at PTN000169508 (87 leaves, 52 species) with three seeds, human SLC30A5 (Q8TAD4), human SLC30A7
      (Q8NEW0) and rat RGD:1307873. Children are PTN000169509 (80 leaves, animals and fungi, holds the
      target and all three seeds) and the 7-leaf amoebozoan clade PTN000901648. MSC2 and S. pombe cis4 are
      in the fungal clade PTN000901628 (16 leaves) inside PTN000169509; cis4 is not a seed of this node.
      No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO. SLC30A5 Q8TAD4 and SLC30A7 Q8NEW0 each carry located_in GO:1990674 IDA PMID:15525635
      (UniProt); cis4 Q9HGQ3 carries GO:1990674 only by IBA and GO:0000139 Golgi membrane by IDA
      PMID:18199682; MSC2 only the IBA.
    - The row quotes PMID:15277543 (ER location of Msc2) and PMID:18199682 (Cis4 at the cis-Golgi).
    review_edited: true
    notes: >-
      Action unchanged, text corrected. The summary, reason and propagation comment said the node is
      grounded in Cis4 and mammalian donors. The PAINT record has three mammalian seeds only; Cis4 is in
      the target's fungal clade but is not a seed. The ground is the same target doubt as for the Golgi
      row, an experimentally ER-resident protein with a possible minor later pool, and the reason now says
      so. Quotes untouched.
- gene_file: genes/yeast/MRX20/MRX20-ai-review.yaml
  rows:
  - go_id: GO:0071913
    go_label: citrate secondary active transmembrane transporter activity
    family: PTHR45788
    ibd_node: PTN000640552
    tree_reading: &mrx_tree >-
      IBDs for both terms sit at PTN000640552 (74 leaves, 51 species). Children are PTN000640554 (67 leaves,
      holds the target and every seed) and PTN008698155 (7 leaves, Paramecium, Marchantia, a diatom and
      Phytophthora). PTN000640554 splits into the animal clade PTN005249550 (43 leaves, SLC25A1) and the
      fungal clade PTN001182688 (24 leaves). Inside the fungal clade, PTN001182708 (8 leaves, 4 budding
      yeast species) splits into PTN002378234 (4 leaves, MRX20 YFR045W and its Eremothecium, Candida and
      Yarrowia orthologs) and PTN001182693 (4 leaves, CTP1 and its orthologs). Seeds of the activity are
      bovine (P79110), rat (RGD:3703) and human (P53007) SLC25A1; the process adds fly FBgn0037912 and yeast
      CTP1 (SGD:S000000495). So MRX20 is inside the seeded node and is the sister paralog of a seed across
      a budding-yeast duplication. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &mrx_fix
      paint_action: NONE
    evidence_checked:
    - >-
      Tree walked with the treeview loader for PTN000640554, PTN001182688, PTN000640605 and PTN000640614,
      and lineages of P38152 (CTP1), P53007 (SLC25A1) and P43617 (MRX20).
    - >-
      Gene review. SGD rows on MRX20 are ISS PMID:10930523 to mitochondrial transport and inner membrane
      and an ND molecular function row; no experimental row. The notes record that no substrate assay
      exists.
    - No family review exists for PTHR45788. Batch H16 judged only the mitochondrion row of human SLC25A1.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason called this family-level propagation into an
      uncharacterised subfamily, which is absence of data, and the summary described the subfamily as
      Saccharomyces strains only. On the tree the IBD placement is sound and MRX20 is inside it. What
      gives ground for doubt is the duplication at PTN001182708: CTP1, the characterised citrate carrier,
      is the sister copy and accounts for the ancestral role, MRX20 is the unmeasured copy, and SGD
      curators deliberately gave it only a generic transporter term and a no-data row. This is the weakest
      ground in the batch. If the reviewer of the whole pass reads duplication plus curator restraint as
      absence of data, the consistent alternative is MODIFY to GO:0022857, which the row already proposes
      as its replacement. No PAINT change follows from doubt; a reconstituted citrate transport assay
      would settle it.
  - go_id: GO:0006843
    go_label: mitochondrial citrate transmembrane transport
    family: PTHR45788
    ibd_node: PTN000640552
    tree_reading: *mrx_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *mrx_fix
    evidence_checked:
    - Same tree walk and review rows as the activity row.
    review_edited: true
    notes: >-
      Same node and ground as the activity row; here the sister paralog CTP1 is itself one of the five
      seeds. Reason rewritten to say so.
- gene_file: genes/yeast/EAT1/EAT1-ai-review.yaml
  rows:
  - go_id: GO:0006629
    go_label: lipid metabolic process
    family: PTHR46118
    ibd_node: PTN002919262
    tree_reading: &abhd_tree >-
      IBD at PTN002919262 (64 leaves, 49 species) with one seed, yeast IMO32 (SGD:S000003263, P53219).
      Children are PTN000106239 (58 leaves, animal ABHD11 and fungal members, holds the seed and both
      yeast paralogs) and PTN005279615 (6 leaves, Paramecium, Plasmodium and a diatom). EAT1 (leaf
      PTN002451218) lies in the fungal clade PTN000863355 (14 leaves, 13 species). The same node carries
      the carboxylic ester hydrolase activity IBD. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &abhd_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN002919262
    evidence_checked:
    - >-
