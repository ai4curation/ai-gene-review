genes:
- gene_file: genes/yeast/ARO10/ARO10-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR43452
    ibd_node: PTN001056938
    tree_reading: >-
      IBD at PTN001056938 (30 leaves, 13 species, fungi) with three seeds, all S. cerevisiae. QuickGO shows
      which they are, PDC1 (SGD:S000004034, P06169), PDC5 (SGD:S000004124, P16467) and THI3 (SGD:S000002238,
      Q07471). The node has children PTN000438912 (28 leaves, holds the target and all three seeds) and
      PTN001056957 (2 basidiomycete leaves). Inside PTN000438912 the target and the seeds first share
      PTN000438914 (14 leaves, 4 yeast species). ARO10 is in its child PTN001056939 (4 leaves, the ARO10
      orthologs); the seeds are in the other child PTN001056943 (10 leaves), all three inside the
      S. cerevisiae-only clade PTN002535504 (4 leaves, THI3, PDC1, PDC5, PDC6). So the IBD sits five nodes
      above the clade that holds every seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002535504
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005634 with descendants. PDC1 P06169 located_in HDA PMID:14562095 and IDA
      PMID:16850348 (SGD); PDC5 P16467 the same two rows; THI3 Q07471 HDA PMID:14562095, IDA PMID:16194233
      and IDA PMID:16850348. ARO10 Q06408 and PDC6 P26263 carry only the IBA. The query returned the
      experimental rows for the seeds, so the empty ARO10 result is real.
    - >-
      Gene review. ARO10 has cytoplasm HDA PMID:14562095 and cytosol HDA PMID:26928762, both accepted, and
      no nuclear observation in either screen.
    - >-
      interpro/panther/PTHR43452/PTHR43452-review.yaml rates this node UNRESOLVED (nucleus is function
      bearing for THI3 only; nuclear enrichment of Pdc1 and Pdc5 has no known role).
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason was one line saying the nuclear location is
      not supported for ARO10, which is absence of data. The ground on the tree is that all three seeds
      are S. cerevisiae paralogs in one species-specific 4-leaf clade, across the ARO10 and PDC
      duplication at PTN000438914, and the same two localisation screens that put Pdc1 and Pdc5 in the
      nucleus scored Aro10 as cytoplasmic. That is doubt, not a tested absence, so the row is not a
      REMOVE. Consistent with the earlier removal of pyruvate decarboxylase activity from ARO10 across
      the same duplication (rereview batch N10).
- gene_file: genes/yeast/THI3/THI3-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR43452
    ibd_node: PTN008451158
    tree_reading: >-
      IBD at the family root PTN008451158 (247 leaves, 60 species) with one seed, yeast PDC1
      (SGD:S000004034). Children are PTN008451159 (246 leaves, holds the target and the seed) and a single
      Gloeobacter leaf. THI3 (leaf PTN000438920) is in the S. cerevisiae-only clade PTN002535504 (4 leaves)
      with PDC1, PDC5 and PDC6, so the seed is its closest paralog. PAINT records a loss (NOT IRD) of
      GO:0004737 pyruvate decarboxylase activity on the THI3 leaf PTN000438920; the cytosol IBD from the
      same root is not pruned there. A nucleus IBD sits at PTN001056938 and THI3 is one of its seeds.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0005829 with descendants. PDC1 P06169 located_in IDA PMID:2665820 (SGD)
      plus eight YeastPathways RCA rows; THI3 Q07471 carries only the IBA and one RCA (PWY3O-4109). THI3
      nucleus rows are HDA PMID:14562095, IDA PMID:16194233 and IDA PMID:16850348.
    - >-
      The row quotes PMID:22904058 (no decarboxylation activity for Thi3 with any substrate tested) and the
      UniProt subcellular location (nucleus).
    - >-
      interpro/panther/PTHR43452/PTHR43452-review.yaml rates the node NEEDS_PRUNING with THI3 as the one
      member-level exception.
    review_edited: false
    notes: >-
      Upheld. The seed is sound and THI3 sits beside it, so the node is not at fault. The doubt is on
      the target. PAINT has already recorded that Thi3 lost the decarboxylase activity that the cytosol
      location goes with (pattern 19 of IBA_REVIEW.md, a loss that stops one term and lets a related one
      through), and three experimental rows place Thi3 in the nucleus where it acts with Thi2 and Pdc2. A
      positive nuclear location is not a tested absence from the cytosol, so this is not a REMOVE. The RCA
      row on the same term carries the same action. The summary already states this and the family review
      quotes PMID:22904058 alongside it, so the file was left alone. If PAINT prunes, the leaf
      PTN000438920 is where the existing activity loss sits.
- gene_file: genes/yeast/DAL1/DAL1-ai-review.yaml
  rows:
  - go_id: GO:0006145
    go_label: purine nucleobase catabolic process
    family: PTHR43668
    ibd_node: PTN000909483
    tree_reading: >-
      IBD at the family root PTN000909483 (134 leaves, 104 species) with two seeds, Arabidopsis ALN
      (AT4G04955) and Aspergillus nidulans allantoinase (Q5B4C7). Children are PTN000182356 (100 leaves,
      eukaryotic allantoinases plus Streptomyces allB; holds the target and both seeds) and PTN002462789
      (34 leaves, bacterial pyrC and allB). PAINT records a loss (NOT IRD) of this term and of GO:0000256
      at PTN000182407 inside the bacterial clade. DAL1 and the A. nidulans seed are both fungal leaves of
      PTN000182356. No loss recorded on the yeast branch.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO:0006145 with descendants. A. nidulans Q5B4C7 acts_upstream_of_or_within
      IMP PMID:21419234 and PMID:5680610 (AspGD); Arabidopsis ALN Q94AP0 acts_upstream_of_or_within IMP
      PMID:23940254 (TAIR); yeast DAL1 P32375 only the IBA. Both seed rows use the weaker qualifier and the
      IBA is propagated as involved_in.
    - >-
      PubMed abstract of PMID:15951822 (Wong and Wolfe 2005, not in publications/). It says the DAL cluster
      formed together with a reorganisation of the purine degradation pathway, which switched to importing
      allantoin instead of urate and eliminated urate oxidase in the S. cerevisiae lineage.
    - >-
      interpro/panther/PTHR43668/PTHR43668-review.yaml rates the node NEEDS_PRUNING for the same reason and
      quotes the summary and reason of this row.
    review_edited: false
    notes: >-
      Upheld on evidence about the target lineage. The seeds are sound for organisms that degrade purines
      through urate, and the target is inside the seeded clade next to the fungal seed. In the
      S. cerevisiae lineage the upstream half of the route is gone (PMID:15951822), so Dal1 degrades
      imported allantoin and takes no part in breaking down a purine nucleobase. The same abstract still
      calls the yeast pathway a reorganised purine degradation pathway, so the term is narrowed, not shown
      false, and the row stays over-annotated instead of REMOVE. The reason states exactly this and is
      quoted by the family review, so the file was left alone. No PAINT change follows from doubt; a loss
      on the Saccharomyces branch would be the form if curators agree.
- gene_file: genes/yeast/OAC1/OAC1-ai-review.yaml
  rows:
  - go_id: GO:0022857
    go_label: transmembrane transporter activity
    family: PTHR45618
    ibd_node: PTN002515516
    tree_reading: >-
      IBD at the family root PTN002515516 (700 leaves, 97 species) with 29 seeds from animals, plants,
      fungi and protists. The root has six children; the target is in PTN008457094 (36 leaves, 25 species,
      fungal OAC1 and protist carriers). One of the seeds is SGD:S000001603, which the UniProt record of
      P32332 shows is OAC1 itself (treeview reports the target as not a seed only because the seed is
      listed by its SGD id). No loss recorded for the term on the target lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      genes/yeast/OAC1/OAC1-uniprot.txt carries DR SGD S000001603, so the target is a seed of the node.
    - >-
      Gene review. OAC1 has accepted IDA rows from PMID:10428783 and PMID:18682385 for oxaloacetate,
      sulfate, malonate and isopropylmalate transmembrane transporter activity, all descendants of
      GO:0022857, and the IEA row on GO:0055085 transmembrane transport is already TOO_GENERAL.
    - >-
      interpro/panther/PTHR45618/PTHR45618-review.yaml rates this node SOUND and notes that the OAC1 review
      marked the row as uninformative, not as false.
    review_edited: true
    notes: >-
      The earlier reason was that the term is superseded by specific IDA activities, which is redundancy
      and not an over-annotation ground. The node is soundly seeded, the target is one of its seeds, and
      the term is true. It is imprecise on its own (it names no substrate) and the accepted substrate
      specific rows entail it, so the action is TOO_GENERAL, the same as the transmembrane transport row of
      the review. Other PTHR45618 members judged in batches H15 and N04 were different terms.
- gene_file: genes/yeast/PPH21/PPH21-ai-review.yaml
  rows:
  - go_id: GO:0000082
    go_label: G1/S transition of mitotic cell cycle
    family: PTHR45619
    ibd_node: PTN000911598
    tree_reading: >-
      IBD at PTN000911598 (5 leaves, 4 species, Saccharomycetales) with two seeds, PPH21 (SGD:S000002292)
      and PPH22 (SGD:S000002347). Children are PTN000911599 (4 leaves, PPH21, PPH22, Eremothecium and
      Candida orthologs) and a single Yarrowia leaf. The target is one of the two seeds. The broader
      GO:0000278 mitotic cell cycle IBD sits higher, at PTN001705142 (347 leaves, 5 seeds). No loss
      recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000911598
    evidence_checked:
    - >-
      QuickGO by accession and GO:0000082 with descendants. PPH21 P23594 and PPH22 P23595 each carry two
      IGI rows from PMID:12518319 (SGD), with SGD:S000001780 (HAL3) and SGD:S000002205 (SIT4), and the IBA.
      No other experimental row.
    - >-
      The review quotes the abstract of PMID:12518319. The genes were recovered as multicopy suppressors of
      the G1/S arrest of a conditional sit4 hal3 strain.
    review_edited: false
    notes: >-
      Upheld. The node is placed correctly for its seeds, so the over-annotation starts at the seeds. They
      are multicopy suppression of an arrest caused by loss of another phosphatase, which shows that extra
      PP2A catalytic subunit can stand in for Sit4 and not that Pph21 carries out a step of the G1/S
      transition. The review reason already names the node, both seeds, the evidence code and assay, and
      treats the IGI and ARBA rows on the term alike, and it defers to the curators' reading of the full
      text by not removing. Left alone. The PAINT request is to drop this IBD and let the mitotic cell
      cycle IBD at PTN001705142 stand.
- gene_file: genes/yeast/ODC1/ODC1-ai-review.yaml
  rows:
  - go_id: GO:0043490
    go_label: malate-aspartate shuttle
    family: PTHR45678
    ibd_node: PTN000640306
    tree_reading: &odc_tree >-
      IBD at PTN000640306 (147 leaves, 51 species) with five seeds, human SLC25A12 (O75746) and SLC25A13
      (Q9UJS0), two mouse ids (MGI:1926080, MGI:1354721) and fly FBgn0028646. Children are PTN008695198
      (145 leaves) and a 2-leaf Dictyostelium clade. ODC1 and ODC2 are in PTN002903833 (14 leaves, 13
      species, the fungal 2-oxodicarboxylate carriers plus a Monosiga leaf), a child of PTN008695198. Human
      SLC25A12 runs through PTN001183073 (55 leaves, 33 species, animal aspartate-glutamate carriers),
      PTN002903837 (118 leaves) and PTN000640307 (131 leaves) before joining at PTN008695198. Every seed is
      an animal aspartate-glutamate carrier; the ODC clade holds none. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &odc_fix
      paint_action: MOVE_IBD
      target_node_id: PTN001183073
    evidence_checked:
    - >-
      QuickGO by accession and GO:0043490 with descendants. SLC25A12 O75746 and SLC25A13 Q9UJS0 each carry
      involved_in IDA PMID:11566871 (UniProt) and IGI PMID:37647199 (FlyBase); ODC1 Q03028, ODC2 Q99297 and
      yeast AGC1 Q12482 carry only the IBA.
    - >-
      treeview on human SLC25A12 for the lineage of the seeds; rereview batch N12 for the position of the
      ODC clade, which this run of treeview confirms.
    - >-
      The row quotes PMID:11013234. Reconstituted Odc1p and Odc2p exchange 2-oxoglutarate and 2-oxoadipate,
      with malate a weaker counter-substrate.
    review_edited: false
    notes: >-
      Upheld. The seeds are the aspartate-glutamate arm of the shuttle and all sit in the animal AGC clade.
      The ODC clade is a separate branch with its own characterised substrates. Unlike the aspartate and
      glutamate transporter activities from the same node, which were removed in the earlier pass, the
      shuttle also needs a 2-oxoglutarate and malate exchanger, and the ODCs carry both substrates, so the
      process is unverified for them and not excluded. That is why the row is over-annotated and not a
      REMOVE. The summary names the AGC seeding and this argument, so the file was left alone. Moving the
      IBD to PTN001183073 matches batch H16; the wider alternative PTN000640307 used in rereview batch N12
      keeps yeast AGC1 but also the glutamate carrier clade.
