      evidence on embigin is of a different kind, a monocarboxylate transporter ancillary protein whose
      adhesion effects are heterotypic and act from the muscle side of the neuromuscular junction. That
      gives reason to doubt the neural adhesion terms without showing their absence, so the over-annotation
      holds and REMOVE is not warranted. The reasons name the node and the kind of members that seed it and
      are right on the tree. No single MOVE_IBD target exists because the seeds sit in several clades that
      meet only at or near the IBD node; a PAINT fix would be to restate the IBD on the seeded clades and
      leave the embigin clade PTN002560472 (and the basigin clade) out. Left alone.
