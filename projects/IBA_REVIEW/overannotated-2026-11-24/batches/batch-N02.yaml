- gene_file: genes/mouse/Hspd1/Hspd1-ai-review.yaml
  rows:
  - go_id: GO:0032755
    go_label: positive regulation of interleukin-6 production
    family: PTHR45633
    ibd_node: PTN002900230
    tree_reading: >-
      IBD at PTN002900230 (34 leaves, vertebrate HSPD1) with two seeds, human HSPD1 (P10809) and rat Hspd1
      (RGD:621314). Children are PTN008692923 (31 tetrapod leaves, holding mouse Hspd1 and both seeds) and
      PTN002900239 (3 fish leaves). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002900230
    evidence_checked:
    - >-
      QuickGO GO:0032755 exact for P63038, P10809, P63039. Human HSPD1 involved_in IDA PMID:16148103 (BHF-UCL);
      rat Hspd1 IMP PMID:23447644 (RGD); mouse Hspd1 only ISO.
    - >-
      The review quotes PMID:18256040 (LPS-free Hsp60 did not induce IL-6, IL-12 or TNF in APC) and
      PMID:15371451 (TNF induction lost after endotoxin removal).
    - batch-H15 upheld the same row for human HSPD1 on the same ground.
    review_edited: false
    notes: >-
      The ground is that the cytokine-inducing activity of recombinant Hsp60 is attributable to bound
      endotoxin, shown in mouse cells. The reason opens by noting that the seeds are rat and human, not
      mouse, which is not itself a ground, but the action rests on the endotoxin evidence and the tree
      statement is correct. As in H15, REMOVE_IBD is conditional on the rat seed paper (PMID:23447644), which
      reports an effect of endogenous released HSP60 and was not read. The IEA and ISO rows carry the same
      action. Left alone.
- gene_file: genes/mouse/Pax4/Pax4-ai-review.yaml
  rows:
  - go_id: GO:0007423
    go_label: sensory organ development
    family: PTHR45636
    ibd_node: PTN008693041
    tree_reading: >-
      IBD at PTN008693041 (85 leaves) with 12 seeds. Children are PTN008693042 (55 leaves, the Pax4, Pax6 and
      Pax10 clade, holding the target) and PTN002900598 (30 protostome leaves with eyeless, twin of eyeless,
      eyegone and vab-3). Mouse Pax4 (leaf PTN000676648) is in the mammalian PAX4 clade PTN000676639 (12
      leaves), which PANTHER joins to mammalian PAX6 at PTN000676674 (23 leaves). The seeds in the target's
      child clade are Pax6 genes (human, mouse, rat, Xenopus, zebrafish), zebrafish pax10 and one Pax4, rat
      Pax4 (RGD:620433). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0007423 with descendants for rat Pax4 (O88436). The only row is involved_in GO:0060041 IEP
      PMID:19012751 (RGD).
    - >-
      The review quotes PMID:19012751 (Pax4 expression highest in the adult argues against a role in
      development), PMID:24951566 (Pax4 of mammals and teleosts not implicated in eye development) and
      PMID:40614820 (no extra-pancreatic features in PAX4-null patients).
    - No family review exists for PTHR45636. The human PAX4 review carries the same action.
    review_edited: false
    notes: >-
      The node is soundly seeded by Pax6 genes on both sides, and the only seed in the Pax4 lineage is an
      expression pattern whose own authors argue against a developmental role. The review's ground is on the
      Pax4 subfamily (no eye phenotype in any ortholog, a comparative statement that Pax4 is not implicated,
      human nulls without extra-pancreatic features) and it says why this is doubt and not loss (postnatal
      photoreceptor maturation untested, nulls die neonatally). The reason is node-aware and correct on the
      tree. The seed-side point, that the rat Pax4 IEP should not seed the IBD, is already recorded as a
      source defect on the IEA row. Left alone.
  - go_id: GO:0060041
    go_label: retina development in camera-type eye
    family: PTHR45636
    ibd_node: PTN002900580
    tree_reading: >-
      IBD at PTN002900580 (46 leaves) with six seeds, mouse Pax6 (MGI:97490), rat Pax6 (RGD:3258), zebrafish
      pax6a, pax6b and pax10, and rat Pax4 (RGD:620433). Children are PTN009179984 (36 tetrapod leaves,
      holding mammalian PAX4 and PAX6 and the target) and PTN009180006 (10 ray-finned fish leaves). Within
      PTN009179984 the mammalian PAX4 clade PTN000676639 (12 leaves) is joined to mammalian PAX6 at
      PTN000676674 (23 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Same QuickGO result as the sensory organ development row; the rat Pax4 seed row is IEP PMID:19012751 (RGD).
    - >-
      The review quotes PMID:19012751 (Pax4 not detectable in the foetal eye, levels rise postnatally) and
      PMID:24951566.
    review_edited: false
    notes: >-
      Same reading as the sensory organ development row. The review's statement that PANTHER separates PAX4
      from PAX6 below this node in tetrapods (PTN000676674) and again in fishes (PTN009180006) matches the
      tree. The one Pax4 seed is an IEP that the review already disputes as a source defect. Left alone.
- gene_file: genes/mouse/Npc1/Npc1-ai-review.yaml
  rows:
  - go_id: GO:0030299
    go_label: intestinal cholesterol absorption
    family: PTHR45727
    ibd_node: PTN000083973
    tree_reading: >-
      IBD at PTN000083973 (61 leaves) with three seeds. Children are PTN000083996 (46 leaves, holding the
