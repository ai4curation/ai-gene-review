genes:
- gene_file: genes/mouse/Ghr/Ghr-ai-review.yaml
  rows:
  - go_id: GO:0008284
    go_label: positive regulation of cell population proliferation
    family: PTHR23036
    ibd_node: PTN008588089
    tree_reading: >-
      IBD at PTN008588089 (359 leaves) with 17 seeds. The node has fourteen child clades of class I cytokine
      receptors. Mouse Ghr (leaf PTN000547471) is in child clade PTN002745520 (33 leaves), which joins the
      growth hormone receptor orthologs and a CSF2RA group; human CSF2RA (P15509), a seed, joins the Ghr
      lineage at PTN009059071 (23 leaves), inside PTN002745520. Other seeds lie in sibling clades (CRLF1 in PTN004596323,
      OSMR in PTN002745584, IL6ST in PTN002745596, IL6R in PTN002745550 and others). PTN002745520 itself
      carries the growth hormone receptor activity and signaling IBDs. No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
      target_node_id: PTN008588089
    evidence_checked:
    - >-
      QuickGO GO:0008284 with descendants for P16882, P10912, P15509, P05710, P16471. CSF2RA (P15509) involved_in
      GO:0070665 IDA PMID:18692472 (ComplexPortal); rat Prlr (P05710) GO:0030890 IMP PMID:8650199 and
      PMID:9447986 (RGD); nothing experimental on mouse or human GHR. The query returned hits, so the empty
      result for Ghr is not a query fault.
    - batch-H11 judged the same node for human LEPR and moved it to KEEP_AS_NON_CORE.
    - No family review exists for PTHR23036.
    review_edited: true
    notes: >-
      The earlier reason was that the term is downstream physiology and not the receptor's own step, which
      makes a row non-core, not over-annotated. The propagation_review also said the tree structure was not
      available; it is, and the node comment was corrected. Unlike LEPR, the Ghr child clade holds a seed
      (CSF2RA). Consistent with H11.
- gene_file: genes/mouse/Gas7/Gas7-ai-review.yaml
  rows:
  - go_id: GO:0005905
    go_label: clathrin-coated pit
    family: PTHR23065
    ibd_node: PTN000552124
    tree_reading: &gas7_tree >-
      IBD at PTN000552124 (80 leaves). Children are the deuterostome clade PTN001128826 (70 leaves) and
      the protostome fcho-1 clade PTN002747285 (10 leaves). Inside PTN001128826, PTN009060357 (69 leaves)
      joins the GAS7 clade PTN001890901 (25 leaves, which carries its own IBD for neuron projection
      morphogenesis) and the FCHO1, FCHO2 and SGIP1 clade PTN001496827 (44 leaves). The vertebrate seeds
      (human FCHO1 O14526, human FCHO2 Q0JRZ9, mouse Fcho1 MGI:3505790) are all in PTN001496827; the worm
      fcho-1 seed (clathrin-dependent endocytosis only) is in PTN002747285. The GAS7 clade holds no seed
      for any of the four clathrin terms. No loss is recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005905 with descendants for O14526, Q0JRZ9, Q8K285, Q3UQN2, Q60780, O60861. FCHO1 is_active_in
      IDA PMID:20448150 and located_in IDA PMID:22484487; FCHO2 located_in IDA PMID:21762413 and PMID:22484487;
      mouse Fcho2 IDA PMID:20448150 and PMID:21762413. Nothing on GAS7.
    - The review quotes PMID:31628328 (GAS7 F-BAR forms flat two-dimensional sheets) and the UniProt domain table.
    - interpro/panther/PTHR23065/PTHR23065-review.yaml has no assessment of this node.
    review_edited: false
    notes: &gas7_notes >-
      The seeds are sound and sit in the sister clade of GAS7 inside the vertebrate clade, with the protostome
      fcho-1 as outgroup, so on the tree GAS7 descends from an FCHO-like ancestor and the question is whether
      it kept the role. The review's ground is on the target, the absence of the mu-homology domain that
      links FCHO proteins to the adaptor machinery and a different F-BAR assembly mode. That is architecture
      and mechanism, not a localisation or endocytosis experiment on GAS7, so it is doubt and not loss and the
      action stays. The reason says the function was propagated too deep; the tree reads better as a
      possible loss in the GAS7 clade, for which the PAINT request would be a loss on PTN001890901 once
      GAS7 is shown absent from coated pits. That is a nuance, not a misstatement of clade membership, so
      the file was left alone. The same reading applies to all four clathrin rows.
  - go_id: GO:0030136
    go_label: clathrin-coated vesicle
    family: PTHR23065
    ibd_node: PTN000552124
    tree_reading: *gas7_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Treeview seed list for this term is human FCHO2 (Q0JRZ9) alone, in PTN001496827.
    - Same review evidence as the clathrin-coated pit row.
    review_edited: false
    notes: *gas7_notes
  - go_id: GO:0048268
    go_label: clathrin coat assembly
    family: PTHR23065
    ibd_node: PTN000552124
    tree_reading: *gas7_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Treeview seed list for this term is human FCHO2 (Q0JRZ9) and human FCHO1 (O14526), both in PTN001496827.
    - Same review evidence as the clathrin-coated pit row.
    review_edited: false
    notes: *gas7_notes
  - go_id: GO:0072583
    go_label: clathrin-dependent endocytosis
    family: PTHR23065
    ibd_node: PTN000552124
    tree_reading: *gas7_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0072583 with descendants for O14526, Q0JRZ9, Q9TXS0, Q60780, O60861, O55148. FCHO1 IMP PMID:20448150
      and PMID:32098969 (UniProt); FCHO2 IMP PMID:20448150 and PMID:21762413 (UniProt); worm fcho-1 IMP
      PMID:25303366 (WB). Nothing on GAS7.
    - Same review evidence as the clathrin-coated pit row.
    review_edited: false
    notes: *gas7_notes
- gene_file: genes/mouse/Cftr/Cftr-ai-review.yaml
  rows:
  - go_id: GO:0140359
    go_label: ABC-type transporter activity
    family: PTHR24223
    ibd_node: PTN009085477
    tree_reading: >-
      IBD at the family root PTN009085477 (1669 leaves) with 28 seeds across the ABCC transporters. Mouse
      Cftr (leaf PTN000658676) is in the CFTR ortholog clade PTN002795422 (27 leaves), sister of the ABCC4
      clade PTN002795437 (40 leaves) under PTN004682292 (67 leaves). PTN002795422 carries its own IBDs for
      intracellularly ATP-gated chloride channel activity, chloride transmembrane transport, bicarbonate
      transport and water transport. No loss for GO:0140359 is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002795422
    evidence_checked:
    - >-
      QuickGO GO:0140359 with descendants for mouse, rat and human CFTR (P26361, P34158, P13569), all evidence
      codes. Only the IBA and the InterPro IEA on each; no experimental row.
    - >-
      projects/IBA_REVIEW/rereview-2026-11-21/batches/batch-H03.yaml upheld REMOVE for the same IBA on human
      CFTR on TARGET_LOSS grounds with ADD_IRD at PTN002795422, citing the term definition (a primary
      active transporter that uses ATP hydrolysis to drive transport).
    - The review quotes UniProt P26361 (ATP gates the channel; anion flow is passive).
    - No family review exists for PTHR24223.
    review_edited: true
    notes: >-
      The earlier reason already said the term implies ATP-driven transport and CFTR gates passive flow,
      which is a statement that the term is false for the target, not that it over-states a true claim. The
      human review removes the row and the removal held on re-review, so the mouse row was brought into line.
      The InterPro IEA row on the same term was changed to REMOVE as well, for action consistency.
  - go_id: GO:0016323
    go_label: basolateral plasma membrane
    family: PTHR24223
    ibd_node: PTN002384279
    tree_reading: >-
      IBD at PTN002384279 (79 leaves) with four seeds, RGD:620266 (rat Abcc4), RGD:2332 (rat Cftr), human
      ABCC4 (O15439) and MGI:2443111 (mouse Abcc4). Children are PTN002517178 (74 leaves, holding the target)
      and a 5-leaf sea urchin clade PTN001954404. Rat Cftr (P34158) is the sister leaf of mouse Cftr under
      PTN000658675 (2 leaves) inside the CFTR clade PTN002795422 (27 leaves); the ABCC4 seeds are in the
      sister clade PTN002795437 (40 leaves). PTN002795422 also carries an apical plasma membrane IBD. No
      loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
      target_node_id: PTN002384279
    evidence_checked:
    - >-
      UniProt cross-reference search. RGD:2332 is rat Cftr (P34158), RGD:620266 is rat Abcc4, MGI:2443111 is
      mouse Abcc4.
    - >-
      QuickGO GO:0016323 with descendants for P34158, P26361, P13569, O15439. Rat Cftr located_in IDA
      PMID:16575514 (RGD); human ABCC4 EXP PMID:11106685 and PMID:12883481 (UniProt), IDA PMID:25986174 and
      PMID:31791063 (ARUK-UCL).
    - >-
      PubMed abstract of PMID:16575514 (doi 10.1007/s00795-006-0312-0). Immunohistochemistry of rat common bile
      duct; CFTR immunoreactivity on the microvilli and along the basolateral membrane of brush cells. Abstract
      only.
    - The human CFTR review keeps the same IBA as KEEP_AS_NON_CORE on sweat duct staining (PMID:1720311).
    review_edited: true
    notes: >-
      The earlier reason said the seed carrying the term is human ABCC4 and that the basolateral domain is
      that paralog's property. One of the four seeds is the rat ortholog of the target, with a direct
      localisation, so the reason misread the tree and the target's own clade is seeded. Changed to
      KEEP_AS_NON_CORE, as in the human review. The ISO row on the same term (a transfer of the same rat
      row) was changed with it. The UniProt apical-membrane quote was removed from both rows, since it does
      not support a kept basolateral row; PMID:16575514 is cited by id only and is not cached.
- gene_file: genes/mouse/Agtr1a/Agtr1a-ai-review.yaml
  rows:
  - go_id: GO:0006954
    go_label: inflammatory response
    family: PTHR24228
    ibd_node: PTN002796070
    tree_reading: >-
      IBD at PTN002796070 (24 leaves), the type-1 angiotensin II receptor clade, with two seeds, MGI:87964
      and MGI:87965. Children are the tetrapod clade PTN000659737 (18 leaves), which holds mouse Agtr1a
      (leaf PTN000659751), mouse Agtr1b and human AGTR1, and a 6-leaf fish clade PTN002796077. Both seeds are
      mouse genes in PTN000659737 and one is the target itself. The same node carries IBDs for angiotensin
      type I receptor activity, regulation of blood pressure and kidney development. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002796070
    evidence_checked:
    - >-
      QuickGO GO:0006954 with descendants for P29754, P29755, P30556. Mouse Agtr1a and Agtr1b each
      acts_upstream_of_or_within IGI PMID:19404405 (MGI); nothing experimental on human AGTR1.
    - >-
      publications/PMID_19404405.md (full text). Mice lacking AT1A, AT1B and AT2 and their wild-type controls
      were infused with angiotensin-(1-7); inflammatory cell infiltration was induced in both without
      difference between genotypes, "showing that this effect is AT1 and AT2 independent".
    - batch-H12 has only GPR75 for this family; human AGTR1 has no review in the repository.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason was that the gene is better described by
      receptor and blood-pressure terms than by a generic inflammatory-response transfer, which is not a
      ground. The ground is the seeds, two IGI rows from one paper whose experiment is a negative result
      for the AT1 receptors. The review's propagation_review already said so for the self-seed; the reason
      now says it too and the node comment, which claimed the node was absent from the local cache, was
      corrected. REMOVE_IBD is conditional on MGI agreeing that the IGI rows should be negated or withdrawn;
      the review's IGI row carries that query as a source defect. Not changed to REMOVE, because AT1
      signalling promoting inflammation is well described elsewhere (the paper's own introduction says so)
      and the IGI row on the same term stays MARK_AS_OVER_ANNOTATED.
- gene_file: genes/mouse/Fyn/Fyn-ai-review.yaml
  rows:
  - go_id: GO:0005102
    go_label: signaling receptor binding
    family: PTHR24418
    ibd_node: PTN002521528
    tree_reading: >-
      IBD at PTN002521528 (372 leaves) with 14 seeds, among them MGI:95602 (mouse Fyn, the target), human FYN
      (P06241), SRC (P12931), LCK (P06239), LYN (P07948) and FGR (P09769). Children are PTN009099589 (366
      leaves, holding the target) and a 6-leaf Monosiga clade PTN008618518. Mouse Fyn (leaf PTN000701098) is
      in the FYN clade PTN002815143 (22 leaves). Two NOT IKR records for GO:0005102 sit at PTN002815290 and
      PTN004704408 elsewhere in the family, neither on the Fyn lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
      target_node_id: PTN002521528
    evidence_checked:
    - >-
      Gene review rows. Fyn carries G protein-coupled receptor binding by IPI (PMID:23169819) and, by IEA or
      ISO, T cell receptor binding, CD4 and CD8 receptor binding, ephrin receptor binding, peptide hormone
      receptor binding, growth factor receptor binding and type 5 metabotropic glutamate receptor binding,
      all KEEP_AS_NON_CORE. Each is a descendant of GO:0005102.
    - >-
      Sibling reviews. Human SRC and LCK ACCEPT the same IBA; mouse Src keeps it as KEEP_AS_NON_CORE.
    - interpro/panther/PTHR24418 has a Markdown review only, no node assessments.
    review_edited: true
    notes: >-
      The earlier reason, that the term is overly broad relative to the specific receptor-binding terms
      already annotated, is the definition of TOO_GENERAL and not of an over-annotation. The node is sound
      and the target is one of its seeds. The IEA and ISO rows on the term were changed with the IBA. The
      action differs from the ACCEPT on human SRC and LCK because the Fyn review keeps a full set of
      specific descendants; the verdict on the claim is the same (true).
- gene_file: genes/mouse/Irak3/Irak3-ai-review.yaml
  rows:
  - go_id: GO:0008063
    go_label: Toll signaling pathway
    family: PTHR24419
    ibd_node: PTN000701353
    tree_reading: >-
      IBD at PTN000701353 (73 leaves) with two seeds, Drosophila pelle (FBgn0010441) and tube (FBgn0003882).
      Children are the vertebrate IRAK clade PTN000701378 (62 leaves, IRAK1, IRAK2, IRAK3 and IRAK4), which
      holds mouse Irak3 (leaf PTN000701391, IRAK3 clade PTN002815516 of 14 leaves), and the invertebrate
      clade PTN000701449 (11 leaves), which holds both seeds. The same node carries IBDs for
      lipopolysaccharide-mediated signaling pathway and cytokine-mediated signaling pathway. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
      target_node_id: PTN000701353
    evidence_checked:
    - >-
      QuickGO GO:0008063 exact for pelle (Q05652) and tube (P22812). Many IMP and IGI rows from FlyBase
      (for example PMID:8808632, PMID:12351681), so the seeds are sound for the fly pathway.
    - >-
      QuickGO term records. GO:0008063 is defined as signaling initiated by ligand binding to the receptor
      Toll; GO:0002755 MyD88-dependent toll-like receptor signaling pathway is current.
    - >-
      Human IRAK3 review. The same IBA is MODIFY to GO:0002755, with the same tree reading, and records the
      same replacement on IRAK1, IRAK2, IRAK4 and MYD88.
    - >-
      interpro/panther/PTHR24419/PTHR24419-review.yaml exists but has no node assessment for GO:0008063.
    review_edited: true
    notes: >-
      The earlier reason said the transfer is formally consistent with the clade but names the wrong
      receptor system, and that the mammalian terms on the gene capture the function. That describes a term
      to be replaced, not a claim that goes beyond the evidence. Changed to MODIFY with the replacement used
      in the human review; the two existing quotes (IRAK-M regulates TLR signaling, IRAK-M Myddosome) support
      it and were kept. The PAINT question, whether a fly-receptor term should be asserted above the
      vertebrate and invertebrate split, is a term choice for the PAINT curators and no node change is asked.
