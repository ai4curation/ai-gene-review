      PTN008460378; Drosophila Npc1b (FBgn0261675) is in PTN002906349, where it is paired with Npc1a by a
      fly-specific duplication (PTN000084051, 4 leaves). The NPC1 clade holds no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008460378
    evidence_checked:
