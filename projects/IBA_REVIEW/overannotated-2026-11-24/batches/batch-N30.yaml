genes:
- gene_file: genes/PLAF7/CDPK1/CDPK1-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR24349
    ibd_node: PTN000681419
    tree_reading: >-
      IBD at the family root PTN000681419 (2382 leaves, 92 species) with 23 seeds. The root has two
      children, PTN000681610 (2044 leaves) and PTN008614216 (338 leaves, 40 species), which holds the
      target. Seventeen seeds are in PTN000681610 (human MKNK1, MKNK2 and CAMK4, mouse Camk4, six
      Arabidopsis CPKs, the Medicago and rice CCaMKs, fly Lk6, worm mnk-1, a zebrafish, a Dictyostelium and
      a Trypanosoma kinase). Six are in the target's child and join its lineage only at PTN008614216:
      human MAPKAPK2, MAPKAPK3 and MAPKAPK5, mouse Mapkapk2 and Mapkapk5 and worm mak-2. Below that node the
      target's lineage is PTN008614221 (263 leaves, 7 species), PTN001967748 (205 leaves, 2 species) and
      PTN002519244 (6 leaves, P. falciparum only), none of which holds a seed. No PAINT loss for the term
      on the lineage; a plasma membrane IBD exists at PTN007796649 inside the other child.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005634 with descendants for P49137, Q16644, Q8IW41 and P62344. MAPKAPK2 located_in IDA
      PMID:20932473 plus HPA nucleoplasm; MAPKAPK3 EXP PMID:26744326 plus HPA nucleoplasm; MAPKAPK5 HPA
      nucleoplasm IDA; CDPK1 has only the IBA. The query shape returns hits.
    - >-
      Seed placement computed from the cached PTHR24349 tree, MOD seed ids resolved to accessions through
      UniProt cross-references.
    - >-
      The review's quotes from PMID:15491359 (N-myristoylation and basic cluster anchor the kinase to
      membranes) and PMID:23548171 (plasma membrane in replicating and invasive forms), and its six IDA
      and one EXP plasma membrane rows.
    - No family review exists for PTHR24349 (entries, metadata and paint files only).
    review_edited: false
    notes: >-
      The node is soundly seeded and the nearest seeds (the MAPKAPK clade) are real nuclear kinases, but
      they are animal proteins, and the 263-leaf protist clade that holds CDPK1 has no seed. On the target the evidence is positive for another site (acylated,
      plasma membrane and parasitophorous vacuole in every stage examined) and no study reports a nuclear
      pool. That is doubt on the target and not a demonstrated absence, so the row stays over-annotated and
      is not removed. The reason says this and names the node in its propagation comment. Left as written.
      Nuclear location is a property of individual subfamilies in this family, so no single node would
      take a moved IBD; the same root node was judged misplaced for calmodulin binding in the removal pass.
- gene_file: genes/PLAF7/CRT/CRT-ai-review.yaml
  rows:
  - go_id: GO:0034635
    go_label: glutathione transport
    family: PTHR31326
    ibd_node: PTN001263463
    tree_reading: >-
      IBD at the family root PTN001263463 (118 leaves, 46 species) with four seeds: the target itself
      (Q8IBZ9) and Arabidopsis CLT1 (AT5G19380), CLT2 (AT4G24460) and CLT3 (AT5G12170). The root has two
      children, PTN002043102 (7 leaves, invertebrate animals, no seed) and PTN008417897 (111 leaves, 42
      species), which holds the target, a Phytophthora and a Chlamydomonas protein and the plant CLT
      proteins. The target leaf PTN001583067 pairs with one other leaf under PTN001583066 (2 leaves). No
      loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0034635 with descendants for Q8IBZ9 and A1L4X0. PfCRT involved_in IDA PMID:23256874
      (GeneDB) and the IBA; Arabidopsis CLT2 acts_upstream_of_or_within IDA PMID:20080670 (TAIR).
    - >-
      The review's quotes from PMID:23256874 (mutant pfcrt alleles of chloroquine-resistant parasites
      transport GSH in oocytes) and PMID:32764664 (glutathione screened, peptides identified as the
      substrates).
    - No family review exists for PTHR31326.
    review_edited: false
    notes: >-
      The target is one of its own seeds, which is not a reason to doubt the IBA; the review marks the
      seed row (IDA) and the IBA with the same action and for the same stated reason, that the measured
      glutathione transport belongs to resistance-conferring mutant alleles and the later substrate study
      of the protein found peptides. That is evidence on the gene that the function is conditional, which
      is the TARGET_DOUBT ground. The plant seeds are in the target's own 111-leaf child clade, not on a
      separate branch of the tree as a reader might take from the reason's wording, but the reason does
      not state where they sit and rests on the target evidence, so it was left as written. Removing the
      P. falciparum seed would not change the IBA (the three CLT seeds still carry the node), so no PAINT
      fix is named; the question for the seed row is whether an allele-specific activity should be
      annotated to the reference protein.
- gene_file: genes/ANOGA/PGRPLB/PGRPLB-ai-review.yaml
  rows:
  - go_id: GO:0016019
    go_label: peptidoglycan immune receptor activity
    family: PTHR11022
    ibd_node: PTN002475783
    tree_reading: >-
      IBD at PTN002475783 (120 leaves, 27 species) with five seeds. Four are human PGLYRP1 to PGLYRP4 in the
      child clade PTN008314965 (84 leaves, deuterostomes). The fifth, fly PGRP-LC (FBgn0035976, Q9GNK5), is
      in the arthropod child PTN000867042 (36 leaves) that holds the target, and joins the target lineage
      at PTN008959208 (27 leaves); it sits in the receptor branch PTN008959211 (8 leaves, PGRP-LC, LE, LF,
      LA, LD and mosquito PGRPLC). The target is in PTN008959209 (3 leaves: fly PGRP-LB, mosquito PGRPLB
      and a Tribolium protein), which holds no seed. PAINT already records NOT IRD for this term at
      PTN008959207 (4 leaves) and on the fly PGRP-LF (PTN000111783) and PGRP-LA (PTN000111770) leaves.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008959209
    evidence_checked:
    - >-
      QuickGO GO:0016019 with descendants. Fly PGRP-LC IMP PMID:15142531 (FlyBase) and TAS; human PGLYRP1
      and PGLYRP2 IDA PMID:11461926 (UniProt); fly PGRP-LB (Q8INK6) has only the IBA.
    - >-
      QuickGO, all annotations of fly PGRP-LB Q8INK6. N-acetylmuramoyl-L-alanine amidase activity IDA
      (PMID:16618604, PMID:34066955) and negative regulation of peptidoglycan recognition protein signaling
      pathway IDA and IMP (PMID:16618604, PMID:26513145, PMID:27851910).
    - >-
      QuickGO term definition of GO:0016019, combining with a peptidoglycan and transmitting the signal to
      initiate an innate immune response.
    - >-
      interpro/panther/PTHR11022/PTHR11022-review.yaml assesses this node SOUND for GO:0016019 on the
      ground that peptidoglycan recognition is conserved across the fold.
    - PMID:11461926 is not in the publications cache and was not read.
    review_edited: false
    notes: >-
      The one seed with signalling evidence is PGRP-LC, in a sister branch of the arthropod clade. The
      target's 3-leaf PGRP-LB clade contains a characterised member, fly PGRP-LB, whose experimental
      annotations are amidase activity and negative regulation of the pathway that PGRP-LC starts, which is
      reason to doubt receptor activity on this branch. No experiment tests receptor activity on PGRP-LB
      directly, so the row stays over-annotated and is not removed. The reason already rests on this
      (catalytic PGRP-LB versus the PGRP-LC receptor) and was left as written. The paint fix is a
      suggestion that follows PAINT's own precedent of IRDs for this term on non-signalling arthropod
      PGRPs; if curators add it, the gene review row becomes a REMOVE. The family review's SOUND verdict
      for this term treats peptidoglycan binding as receptor activity; the term definition requires
      signal initiation and PAINT's three existing losses show the curators do not read it family-wide
      either. Whether the human seed rows (IDA, PMID:11461926) show signal initiation and
      not only peptidoglycan binding was not checked.
- gene_file: genes/DICDI/drkA/drkA-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR23257
    ibd_node: PTN001148170
    tree_reading: >-
      IBD at PTN001148170 (1488 leaves, 86 species) with 26 seeds. The node has six child clades; the
      target is in PTN009067562 (369 leaves, 77 species). Three seeds are on the target's side: worm dlk-1
      joins the target lineage at PTN007745040 (121 leaves), and Dictyostelium gbpC and rckA join it at
      PTN004623322 (25 leaves, 2 Dictyostelium species), the clade that also holds drkA, drkB, roco5 and
      kxcB (these four form PTN002758693, 4 leaves). Arabidopsis EDR1 joins at PTN009067562. The other 22
      seeds (KSR1, KSR2, MOS, RIPK3, drkC, splB, pyk3, roco6, roco7 and others) are in other children of
      the node. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005737 and GO:0016020 with descendants for Q8MVR1, Q54XQ2, Q54TA1, Q54H46 and Q54H45.
      gbpC located_in cytoplasm and cell cortex IDA PMID:22119747; rckA cytoplasm and cell cortex IDA
      PMID:12686622; drkC phagocytic vesicle membrane and macropinosome IDA PMID:17664333 (dictyBase);
      drkA and drkB have only the IBA and a UniProt membrane IEA.
    - >-
      UniProt features. drkB Q54H45 has a signal peptide (1-24) and one transmembrane segment (346-366);
      drkC Q54TA1 has a signal peptide, an extracellular domain and one transmembrane segment (424-444).
    - No family review exists for PTHR23257.
    review_edited: true
    notes: >-
      Action unchanged. The node is soundly seeded and two seeds sit in the target's own 25-leaf clade, so
      the earlier wording, that the term reflected soluble family members and not this subfamily, did not
      match the tree, and the claim that cytoplasm mis-describes a membrane protein overlooked that one
      seed (drkC) is a receptor-like kinase whose evidence is a location on internal membranes, which are
      part of the cytoplasm in GO. The doubt that remains is on the target: a predicted type I
      transmembrane topology (signal peptide and one transmembrane helix, shared with drkB) and no
      localization. If DrkA is at the plasma membrane the term is not true of it; if it is on an internal
      membrane the term is true and general. Summary, reason and propagation comment rewritten to say
      this. Localization of DrkA would settle it. History record
      history/genes/DICDI/drkA/2026-11-26T185600Z-claude-code-025fed.yaml.
- gene_file: genes/HELPY/ureA/ureA-ai-review.yaml
  rows:
  - go_id: GO:0009039
    go_label: urease activity
    family: PTHR33569
    ibd_node: PTN002129956
    tree_reading: >-
      IBD at the family root PTN002129956 (44 leaves, 38 species) with two seeds. S. pombe ure1
      (SPAC1952.11c, O00084) is in the child clade PTN002129957 (32 leaves, eukaryotic single-chain
      ureases). M. tuberculosis UreB (P9WFE9) is in the other child PTN002129976 (12 leaves, 11 bacterial
      species), which holds the target; the target's nearer node is PTN002129987 (5 leaves). No loss
      recorded. The same node carries an IBD for urea catabolic process.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002129957
    evidence_checked:
    - >-
      QuickGO GO:0009039 with descendants for P9WFE9, O00084 and P14916. M. tuberculosis UreB enables IDA
      PMID:7559354 (UniProt); S. pombe ure1 EXP PMID:24177583 and IDA PMID:8742356 (PomBase); H. pylori
      UreA has the IBA and a UniProt rule IEA only.
    - >-
      interpro/panther/PTHR33569/PTHR33569-review.yaml assesses the node TOO_DEEP for this term and names
      P9WFE9 as a beta subunit; enables belongs only to the fungal single-chain clade.
    - PMID:7559354 is not in the publications cache and was not read.
    review_edited: true
    notes: >-
      Action unchanged. The earlier reason called the mycobacterial donor a single-chain eukaryotic-type
      urease in which one polypeptide enables the activity. It is the separate beta subunit of a
      three-chain bacterial urease and sits in UreA's own clade, so the bacterial seed row is itself an
      enables annotation of the assembled enzyme's activity on a non-catalytic chain (IDA; the paper was not read, so this is a query for the seed
      row and not a confirmed defect). Reason and propagation comment rewritten to place both seeds. The
      IEA row on the same term carries the same action and was not edited. With the M. tuberculosis seed
      requalified to contributes_to, the IBD belongs on the single-chain clade. History record
      history/genes/HELPY/ureA/2026-11-26T185600Z-claude-code-4936b2.yaml.
- gene_file: genes/PANTR/TAS2R38/TAS2R38-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR11394
    ibd_node: PTN000149628
    tree_reading: >-
      IBD at PTN000149628 (449 leaves, 17 species) with seven seeds, all human TAS2Rs, among them human
      TAS2R38 (P59533), the ortholog of the target. Two child clades, PTN001287872 (345 leaves, holding the
      target Q697L5 and the seeds) and PTN000149807 (104 leaves, Xenopus only). The target is not itself a
      seed. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      batch-H04 in this folder, which checked the seeds in QuickGO for the human orthologs TAS2R16 and
      TAS2R38 (IDA plasma membrane on TAS2R38, IDA membrane rows on TAS2R42 and TAS2R60 from PMID:20022913)
      and moved both human rows to TOO_GENERAL.
    - >-
      The chimpanzee review accepts GO:0005886 plasma membrane on an IEA row, which entails membrane.
    - No family review exists for PTHR11394.
    review_edited: true
    notes: >-
      Not an over-annotation. The term is true, soundly seeded and the target is inside the seeded clade;
      the earlier reason itself said it was true and only subsumed by plasma membrane, which is the
      definition of TOO_GENERAL. Changed to match the human ortholog. The IEA row on the same term was
      changed from MARK_AS_OVER_ANNOTATED to TOO_GENERAL to keep the two rows consistent. History record
      history/genes/PANTR/TAS2R38/2026-11-26T185600Z-claude-code-45f1fb.yaml.
- gene_file: genes/PHYPA/GT47A/GT47A-ai-review.yaml
  rows:
  - go_id: GO:0009834
    go_label: plant-type secondary cell wall biogenesis
    family: PTHR11062
    ibd_node: PTN000869123
    tree_reading: >-
      IBD at PTN000869123 (138 leaves, 38 species) with two seeds, Arabidopsis IRX10 (AT1G27440) and IRX10L
      (AT5G61840). The node's children are a single Marchantia leaf (PTN008511366) and PTN008511352 (137
      leaves), whose own children are the moss target leaf PTN000869124 and PTN007483392 (136 leaves, 36
      species, seed plants from Amborella on), which holds both seeds. No loss recorded. The same node
      carries the glucuronoxylan biosynthetic process IBD.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN007483392
    evidence_checked:
    - >-
      QuickGO GO:0009834 with descendants for Q9FZJ1 and Q940Q8. IRX10 and IRX10L each
      acts_upstream_of_or_within IMP PMID:18980662 (TAIR).
    - >-
      interpro/panther/PTHR11062/PTHR11062-review.yaml assesses the node TOO_DEEP for this term (right for
      vascular plants, reaches the two bryophytes).
    - >-
      The review's quotes from PMID:23286876 (bryophyte conducting tissue does not form thickened walls;
      the gt47a knockout has no phenotype and no change in wall sugars).
    review_edited: false
    notes: >-
      Both seeds sit in the sister clade of the moss leaf, and the two bryophyte leaves are the only
      members the node adds beyond that clade. The target evidence (expression in expanding tissue, no
      wall phenotype) gives reason to doubt the process without excluding it in every moss cell type, so
      the row is over-annotated and not removed. The reason names the node, the bryophyte reach and the
      target data. Left as written; the ISS row on the same term carries the same action.
- gene_file: genes/SHEON/acnD/acnD-ai-review.yaml
  rows:
  - go_id: GO:0030350
    go_label: iron-responsive element binding
    family: PTHR11670
    ibd_node: PTN000186700
    tree_reading: >-
      IBD at the family root PTN000186700 (245 leaves, 102 species) with nine seeds. Eight (human, mouse and
      rat ACO1 and IREB2, bovine ACO1, fly Irp-1A) are in the child PTN000186701 (222 leaves). The ninth, M.
      tuberculosis Acn (O53166), is in the other child PTN008523494 (23 leaves) and joins the target lineage
      at PTN000186788 (22 leaves); it sits in PTN007525429 (8 leaves), a sister of PTN002268880 (12 leaves)
      that holds the target. Inside PTN002268880 the target is in PTN002617363 (5 leaves), beside the AcnA
      clade PTN000186793 (7 leaves); neither holds a seed. PAINT records NOT IRD for the term on two
      leaves, PTN000186764 and PTN000186767.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000186704
    evidence_checked:
    - >-
      QuickGO GO:0030350 with descendants for O53166. M. tuberculosis Acn enables IDA PMID:17384188
      (MTBBASE) and the IBA.
    - >-
      Seed placement and the children of PTN008523494, PTN000186788 and PTN002268880 computed from the
      cached PTHR11670 tree; PTN000186704 confirmed as a 55-leaf node holding the animal IREB2 and ACO1
      proteins.
    - >-
      interpro/panther/PTHR11670/PTHR11670-review.yaml assesses the node TOO_DEEP (the gain belongs at the
      eukaryotic IRP clade).
    - >-
      rereview-2026-11-21 batch-08, which moved this row from REMOVE to MARK_AS_OVER_ANNOTATED and wrote
      the present reason.
    review_edited: false
    notes: >-
      The reason was written against the tree in the removal pass and every node and clade size in it
      matches what the tree shows now. It states the ground (root placement, no seed in the AcnD subclade,
      canonical iron-responsive elements being an animal motif, catalytic divergence not showing loss of
      RNA binding). Left as written. The move target follows the earlier batch and the family review; the
      M. tuberculosis seed would then need its own record. The family review prose still says the AcnD
      review removes the term.
- gene_file: genes/SYNY3/argG/argG-ai-review.yaml
  rows:
  - go_id: GO:0000050
    go_label: urea cycle
    family: PTHR11587
    ibd_node: PTN000172504
    tree_reading: >-
      IBD at the family root PTN000172504 (162 leaves, 123 species) with two seeds, human ASS1 (P00966) and
      rat Ass1 (RGD:2163). Both are in the child PTN000172505 (134 leaves, 95 species), within its
      eukaryotic subclade PTN000172506 (127 leaves); the other subclade there is archaeal (PTN000172572, 7
      leaves). The target is in the other root child PTN000172575 (28 leaves, 28 bacterial species), which
      holds no seed. PAINT records NOT IRD for the term at PTN002612332 (5 leaves, protostomes) inside the
      seeded child.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000172506
    evidence_checked:
    - >-
      QuickGO GO:0000050 with descendants for P00966. Human ASS1 involved_in IMP PMID:18473344 and
      PMID:27287393 (UniProt).
    - >-
      interpro/panther/PTHR11587/PTHR11587-review.yaml assesses the node TOO_DEEP (mammalian seeds only,
      reaches bacterial ArgG) and the protostome IRD LOSS_SUPPORTED.
    - >-
      The review's quotes from PMID:29632414 and PMID:31914412 (the cyanobacterial cycle returns ornithine
      through the ArgZ arginine dihydrolase and releases ammonia) and PMID:10648527 (an arginase step
      inferred from labelling).
    review_edited: false
    notes: >-
      The classic one-node-above-the-seeds placement, with the whole bacterial clade unseeded. On the
      target the evidence is that the characterised return step releases ammonia, while an older tracer
      study inferred a urea-producing step, so the urea-producing closure is unestablished and not
      excluded; the row stays over-annotated and is not removed. The reason rests on that pathway
      evidence and its propagation comment names the node and where the term does hold. Left as written
      (the family review quotes this row's summary). The move target is the eukaryotic subclade that holds
      both seeds; it still contains plants and the protostome clade PAINT has already pruned, so a
      curator may prefer a narrower node.
- gene_file: genes/XANCP/fruB/fruB-ai-review.yaml
  rows:
  - go_id: GO:0015764
    go_label: N-acetylglucosamine transport
    family: PTHR46244
    ibd_node: PTN000532509
    tree_reading: >-
      IBD at the family root PTN000532509 (43 leaves, 25 species) with one seed, P. aeruginosa PA3760
      (Q9HXN5). Seed and target are both in the root child PTN008196399 (28 leaves) and in PTN001879016 (14
      leaves, 9 species), whose children are PTN008196398 (2 leaves, the target and a Chloroflexus
      protein), PTN002341767 (2 leaves, PA3760 and P. aeruginosa fruI), PTN001879021 (7 leaves,
      enterobacterial ptsI, ptsA and fryA) and three single ptsI leaves. The EI(Ntr) proteins join at
      PTN009195473 (21 leaves). No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002341767
    evidence_checked:
    - >-
      QuickGO GO:0015764 with descendants for Q9HXN5 and P45597. PA3760 involved_in IMP PMID:18833300
      (PseudoCAP); FruB has only the IBA.
    - >-
      interpro/panther/PTHR46244/PTHR46244-review.yaml assesses the node TOO_DEEP for this term (a
      substrate-specific process on the bacterial root from one seed).
    - >-
      batch-N24 in this folder, which moved the same IBA on E. coli ptsI to KEEP_AS_NON_CORE because the
      general enzyme I feeds every sugar-specific Enzyme II, the N-acetylglucosamine one included.
    - >-
      The review's quote from PMID:7496537 (the fruB mutant confirms the role in fructose transport and
      phosphorylation).
    review_edited: false
    notes: >-
      Differs from the E. coli ptsI verdict for a reason the biology gives. The general enzyme I serves all
      PTS sugars, so the term is true of it and non-core. FruB is a fused, sugar-specific relay (its own
      EIIA and HPr domains pass the phosphate to the fructose permease FruA), X. campestris has a separate
      general ptsI (Q8P705, elsewhere in the 28-leaf clade), and nothing shows FruB feeding the
      N-acetylglucosamine system, so here the substrate-specific term claims more than is shown. The seed
      and the target share the 14-leaf node but sit in different 2-leaf clades. The reason states the
      seed, the family review's TOO_DEEP verdict and the target evidence, and leaves coupling through
      free HPr open. Left as written. The move target is the seed's 2-leaf clade, which also holds the
      fructose protein fruI, so the seed leaf alone may be the right extent.
