- gene_file: genes/mouse/Dnmt1/Dnmt1-ai-review.yaml
  rows:
  - go_id: GO:0003677
    go_label: DNA binding
    family: PTHR10629
    ibd_node: PTN000066774
    tree_reading: >-
      IBD at PTN000066774 (282 of the family's 283 leaves) with two seeds, mouse Dnmt1 itself (MGI:MGI:94912)
      and human DNMT1 (P26358). Children are PTN000066775 (276 leaves, holding the target and both seeds)
      and the archaeal clade PTN004174425 (6 leaves). The same node carries IBDs for DNA (cytosine-5-)-methyltransferase
      activity (8 seeds). No loss recorded on the lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0003677 with descendants. Mouse Dnmt1 P13864 carries enables IDA PMID:11399088 (MGI) on DNA
      binding and IDA PMID:20573698 (MGI) on GO:0008327 methyl-CpG binding; human DNMT1 P26358 carries IDA
      PMID:18754681 (UniProt) on DNA binding.
    - >-
      publications/PMID_11399088.md (abstract only), three independent DNA-binding sites, catalytic domain
      prefers hemimethylated CpG and the zinc-binding domain methylated CpG. publications/PMID_21163962.md
      (full text), mouse DNMT1-DNA structure with the CXXC domain bound to unmethylated CpG.
    - >-
      QuickGO ontology, GO:0008327 methyl-CpG binding and GO:0045322 unmethylated CpG binding are both is_a
      descendants of GO:0003677.
    - genes/human/DNMT1 review, which MODIFYs its GO:0003677 rows to the same two terms.
    review_edited: true
    notes: >-
      The old reason was "Term is too general", which is not an over-annotation ground; the node is soundly
      seeded and the target is its own seed. Changed to MODIFY with GO:0008327 and GO:0045322, matching the
      human review. The IEA, ISO and IDA rows on the same term carried the same action and reason and were
      changed with it. PMID:21163962 was added to the review's references (already cached). No family review
      exists for PTHR10629.
- gene_file: genes/mouse/Hes6/Hes6-ai-review.yaml
  rows:
  - go_id: GO:0009952
    go_label: anterior/posterior pattern specification
    family: PTHR10985
    ibd_node: PTN000105428
    tree_reading: >-
      IBD at PTN000105428 (400 of 406 leaves) with sixteen seeds. Children are the HEY clade PTN007475037
      (93 leaves) and PTN000862345 (307 leaves) holding the target. The Hes6 clade is PTN002590942 (22 leaves),
      a child of PTN001334346 (230 leaves); it splits into the fish branch PTN002590944 (5 leaves), which
      holds the seed zebrafish hes6 (Q6P0J1), and the tetrapod branch PTN008958059 (17 leaves) holding mouse
      Hes6 (leaf PTN000105522) with no seed. Other seeds are in the Hes7 clade PTN004213612 (mouse Hes7, Xenopus
      hes7.1, zebrafish her1, her5, her11), the Hes1 clade PTN002590956 and elsewhere under PTN001334346;
      worm lin-22 joins at PTN000105429 (296 leaves). No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0009952 with descendants over the model-organism leaves under the node (39 experimental
      rows). Zebrafish hes6 Q6P0J1 has IMP and IGI rows on GO:0001756 somitogenesis (PMID:15905406, PMID:16545363,
      PMID:20637625, PMID:29624170; ZFIN). No experimental row on mouse, rat or human Hes6.
    - >-
      The review's quote from PMID:16534784 (Hes6 null mice show no detectable defect in the inner ear,
      as in other tissues), unchanged.
    - interpro/panther/PTHR10985/PTHR10985-review.yaml has no assessment of this term.
    review_edited: false
    notes: >-
      The target's own ortholog clade is seeded (zebrafish hes6), so the node is not too deep for Hes6. The
      call holds on gene-level evidence, a viable Hes6 null mouse with no reported patterning defect,
      which is doubt short of loss (redundancy with Hes7 is possible). The reason already says only zebrafish
      Hes6 has a segmentation-clock role and cites the null mouse, so it was left alone, although its opening
      clause (mouse Hes6 is not a seed) is not itself a ground. A somite analysis of Hes6 null or Hes6 Hes7
      compound mutants would settle it. Batch H03 judged BHLHE40 under the same node as NODE_TOO_DEEP; the
      DEC clades hold no seed, whereas the Hes6 clade does, hence the different ground.
- gene_file: genes/mouse/Hes7/Hes7-ai-review.yaml
  rows:
  - go_id: GO:0050767
    go_label: regulation of neurogenesis
    family: PTHR10985
    ibd_node: PTN000105428
    tree_reading: >-
      IBD at PTN000105428 (400 leaves) with fifteen seeds. The target is in the Hes7 clade PTN004213612 (23
      leaves), a child of PTN001334346 (230 leaves). That clade splits into the fish branch PTN008958076
      (6 leaves), which holds the seeds zebrafish her5 (ZFIN:ZDB-GENE-990415-90) and her11 (ZFIN:ZDB-GENE-040824-4),
      and the tetrapod Hes7 branch PTN007475022 (17 leaves) holding mouse Hes7 (leaf PTN000105548) with no
      seed for the term. Other seeds are mouse and rat Hes1 (PTN002590956), mouse Hes5 (PTN007475000), mouse
      Hes3 (PTN008313919), Xenopus hes2, and fly dpn and E(spl) genes joining at PTN000105429 (296 leaves).
      PAINT records a NOT IRD for this term at PTN000105659, the HES4 clade (9 leaves).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0050767 with descendants over the model-organism leaves under the node (35 experimental
      rows). Zebrafish her5 Q90467 IMP PMID:12620984, PMID:15056616, PMID:15590746 and her11 Q6W4T8 IMP PMID:15590746
      (ZFIN). No experimental neurogenesis row on mouse Hes7 Q8BKT2.
    - UniProt Q90467 and Q6W4T8 cross-references, to confirm the ZFIN ids of her5 and her11 against the seed list.
    - The review's quote from PMID:11260262 (Hes7 specifically expressed in presomitic mesoderm), unchanged.
    review_edited: true
    notes: >-
      Action unchanged. The summary said the term is inherited from the neural Hes paralogs; two seeds sit
      in the fish branch of the Hes7 clade itself. Summary and reason rewritten to state the tree and to
      rest on the target evidence (PSM-restricted expression, segmentation-only phenotype), which is divergence
      short of loss. An IRD on the tetrapod Hes7 branch PTN007475022 would be the fix if loss were shown;
      not requested on doubt alone.
- gene_file: genes/mouse/Vwf/Vwf-ai-review.yaml
  rows:
  - go_id: GO:0005201
    go_label: extracellular matrix structural constituent
    family: PTHR11339
    ibd_node: PTN000885756
    tree_reading: >-
      IBD at PTN000885756 (289 leaves) with two seeds. Its child PTN008965568 (287 leaves) splits into PTN008965569
      (41 leaves) and PTN000886007 (246 leaves, mucins and others). The VWF clade is PTN002602369 (21 leaves,
      mouse Vwf leaf PTN000886024), sister to the otogelin-like clade PTN002602322 (18 leaves) under PTN008965570
      (39 leaves). One seed is mouse Otogl (F7A4A7) in PTN002602322, the other mouse Muc2 (Q80Z19) in PTN000886007.
      The VWF clade has no seed and carries its own IBDs for blood coagulation and cell-substrate adhesion.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002602322
    evidence_checked:
    - >-
      QuickGO GO:0005201 with descendants over all 289 leaves under the node. Experimental or author-statement
      rows on mouse Otogl (IMP PMID:31776257, UniProt), mouse Muc2 (IDA PMID:35337837, UniProt), human MUC5AC
      (TAS) and MUC6 (NAS). None in the VWF clade; the review's own rows on Vwf are RCA matrisome rows.
    review_edited: false
    notes: >-
      Same call as human VWF in batch H04. The reason argues from VWF acting as an adhesive bridge and
      not as a load-bearing matrix component and does not misstate the tree, so the file was left alone.
      The two seeds are in different clades, so the move needs a second placement for Muc2 inside PTN000886007;
      PTN002602322 is the one nearest the target. The RCA rows on the same term carry the same action.
- gene_file: genes/mouse/Ang2/Ang2-ai-review.yaml
  rows:
  - go_id: GO:0050830
    go_label: defense response to Gram-positive bacterium
    family: PTHR11437
    ibd_node: PTN008517922
    tree_reading: >-
      IBD at PTN008517922 (203 leaves) with ten seeds. Children are PTN002605927 (201 leaves, target here)
      and PTN008968100 (2 leaves, zebrafish rnasel4 and a Xenopus leaf). Human RNASE3, RNASE6, RNASE7, RNASE8
      and mouse Rnase6 are in PTN000153545 (130 leaves) and join the target lineage at PTN007505704 (164
      leaves); chicken P30374 joins at PTN000153526 (174 leaves). The angiogenin clade is PTN000153659 (19
      leaves); inside it mouse Ang2 (leaf PTN000153669) sits in the mouse-only cluster PTN000153668 (6 leaves;
      Ang, Ang2, Ang3, Ang4, Ang5, Ang6), and human ANG joins at PTN000153661 (13 leaves). No loss recorded
      for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0050830 with descendants over all 203 leaves (18 experimental rows, so the query shape
      returns hits). Mouse Ang P21570 carries involved_in IDA PMID:12548285 (UniProt); human RNASE3, RNASE6,
      RNASE7, RNASE8, mouse Rnase6, chicken P30374 and zebrafish rnasel2, rnasel3, rnasel4 carry IDA rows;
      human RNASE2 carries NOT involved_in IMP PMID:23992292. Human ANG P03950 has no experimental row.
    - >-
      PubMed abstract of PMID:12548285 (doi 10.1038/ni888, not in publications/), which reports that mouse
      Ang4 is bactericidal against intestinal microbes and that mouse Ang1 and human angiogenin are microbicidal
      against systemic bacterial and fungal pathogens. Full text not read.
    - No family review exists for PTHR11437.
    review_edited: true
    notes: >-
      The old reason held that no angiogenin-subfamily member has experimental Gram-positive evidence and
      said the mouse Ang row could not be checked. Checked, mouse Ang carries an IDA for this exact term
      and sits in the same six-leaf mouse cluster as Ang2, so the target is inside a seeded clade and nothing
      on Ang2 argues against the term. Changed to KEEP_AS_NON_CORE, as the review already does for the sibling
      antibacterial terms seeded at PTN000153659; the ISO row on the same term was changed with it. The
      node itself is broad (RNASE2 has a NOT row, and the pancreatic RNase clades inherit the term), which
      is a family-level question outside this row.
- gene_file: genes/mouse/Csn2/Csn2-ai-review.yaml
  rows:
