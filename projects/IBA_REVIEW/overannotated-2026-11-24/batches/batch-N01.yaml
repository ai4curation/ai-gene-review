- gene_file: genes/mouse/Actb/Actb-ai-review.yaml
  rows:
  - go_id: GO:0019901
    go_label: protein kinase binding
    family: PTHR11937
    ibd_node: PTN007551913
    tree_reading: >-
      IBD at PTN007551913 (83 leaves, 17 species) with two seeds, rat Actb (RGD:628837, P60711) and human
      ACTB (P60709). Children are PTN000233037 (14 leaves, holding mouse Actb, leaf PTN000233372) and PTN000748531
      (69 leaves). Rat Actb is the sister leaf of mouse Actb (they join at PTN001377838, 2 leaves); the tree
      places human ACTB P60709 in PTN000748531. No loss recorded for this term on the lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0019901 with descendants over all 83 leaves. Rat Actb P60711 enables IPI PMID:12700184 (RGD);
      human ACTB P60709 enables IPI PMID:24327345 (ARUK-UCL). No other experimental row.
    - UniProt P60711 cross-reference, to resolve RGD:628837 to rat Actb.
    - >-
      PubMed abstract of PMID:12700184 (doi 10.1095/biolreprod.103.016881), Fer kinase immunoprecipitation
      from testis bringing down actin with N-cadherin and catenins. Full text not read.
    - genes/human/ACTB review, which keeps the same IBA and the DYRK1A IPI row as non-core.
    review_edited: true
    notes: >-
      The old reason was that the term is indirect or generic relative to the structural role of actin,
      which is a reason for non-core, not for over-annotation. The node is seeded on both sides and the
      target's sister leaf is a seed. Changed to KEEP_AS_NON_CORE, matching human ACTB; the IEA row and the
      two ISO rows on the same term carried the same text and were changed with it. The propagation comment
      said RGD:628837 could not be resolved; it is rat Actb. The seeds are co-immunoprecipitations and
      may reflect association through a complex and not direct binding; that was not judged from abstracts.
