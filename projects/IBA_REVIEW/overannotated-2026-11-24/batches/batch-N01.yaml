    go_label: cysteine-type endopeptidase inhibitor activity
    family: PTHR11500
    ibd_node: PTN000161175
    tree_reading: >-
      IBD at the family root PTN000161175 (14 leaves, 12 species), whose children are the eutherian beta-casein
      clade PTN000161176 (13 leaves, holding mouse Csn2, leaf PTN000161184) and one Monodelphis leaf. The
      two seeds are human CSN2 (P05814) and bovine CSN2 (P02666), both inside PTN000161176. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. P05814 and P02666 each carry enables IDA PMID:12788072 (assigned by
      CAFA) beside the IBA.
    - >-
      The row quotes PMID:12788072 (beta-casein and a synthetic L133-Q151 peptide inhibited cysteine proteases);
      quote left as it is. No family review exists for PTHR11500.
