- gene_file: genes/PSEAE/rmlC/rmlC-ai-review.yaml
  rows:
  - go_id: GO:0000271
    go_label: polysaccharide biosynthetic process
    family: PTHR21047
    ibd_node: PTN000471580
    tree_reading: >-
      IBD at the family root PTN000471580 (38 leaves, 30 species) with three seeds, the target (Q9HU21), M.
      tuberculosis RmlC (P9WH11) and S. typhimurium RfbC (P26394). The root has two children. PTN000471594 (25
      leaves, 21 species, bacterial) holds all three seeds and the target (leaf PTN002325967) and carries its own
      IBDs for the epimerase activity and dTDP-rhamnose biosynthetic process; PTN000471581 (13 leaves, archaea,
