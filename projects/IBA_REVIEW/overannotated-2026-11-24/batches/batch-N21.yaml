genes:
- gene_file: genes/PSEAE/braD/braD-ai-review.yaml
  rows:
  - go_id: GO:0015192
    go_label: L-phenylalanine transmembrane transporter activity
    family: PTHR11795
    ibd_node: PTN000765102
    tree_reading: &brad_tree >-
      IBD at PTN000765102 (18 leaves, 16 species) with one seed, E. coli LivH (P0AEX7). The node has seven
      children. PTN000765106 (7 leaves, 6 species) holds the seed, Salmonella and Yersinia LivH, and both
      P. aeruginosa members, the target braD (leaf PTN002273395) and PA4912, which form the pair
      PTN002273393 (2 leaves, 1 species) inside PTN000765110 (5 leaves). The other six children (Gram-positive,
      Deinococcus, cyanobacterial and three single leaves) hold no seed. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P0AEX7 x GO:0015192 returns enables IDA PMID:14702302 (EcoCyc) plus the IBA; P21627 x GO:0015192
      returns only the IBA. The same query shape returns hits, so the empty experimental result on braD is real.
    - >-
      publications/PMID_1400443.md and PMID_6767701.md (both abstract only) give the LIV-I substrate range in
      proteoliposomes and the BraC binding specificity as branched-chain amino acids plus alanine and threonine;
      neither abstract mentions phenylalanine.
    review_edited: false
    notes: >-
      The seed is sound and sits in the target's own child clade, so there is no node error. The doubt is on
      the target. In this importer the periplasmic binding protein sets specificity, E. coli has two (LivJ, LivK)
      and P. aeruginosa one (BraC), whose published range has no phenylalanine. That is absence of a report in
      abstracts, not a negative assay, so it stays an over-annotation and not a removal. A phenylalanine uptake
      or competition assay on BraC-dependent LIV-I proteoliposomes would settle it. The written reason says this.
  - go_id: GO:0015823
    go_label: phenylalanine transport
    family: PTHR11795
    ibd_node: PTN000765102
    tree_reading: *brad_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P0AEX7 x GO:0015823 returns acts_upstream_of_or_within IDA PMID:14702302 (EcoCyc) and involved_in
      NAS PMID:14702302 (ComplexPortal) plus the IBA.
    review_edited: false
    notes: Process twin of the activity row, same seed, same paper and same reading. Left as written.
- gene_file: genes/PSEAE/nuh/nuh-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR12304
    ibd_node: PTN000266727
    tree_reading: >-
      IBD at the family root PTN000266727 (201 leaves, 79 species) with two seeds, Arabidopsis AT1G05620 and
      AT2G36310. The root has two children. PTN000749155 (174 leaves, eukaryote-rich) holds both seeds;
      PTN008536039 (27 leaves, 17 species, mostly bacterial with E. coli RihA, RihB and RihC) holds the target
      (leaf PTN002285007, under PTN000266828, 21 leaves) and no seed. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      genes/PSEAE/nuh/nuh-uniprot.txt carries FT SIGNAL 1..30 with evidence ECO:0000256|SAM:SignalP, a
      sequence-analysis prediction.
    - >-
      interpro/panther/PTHR12304/PTHR12304-review.yaml assesses the cytosol IBD at this node SOUND on the
      fungal recipients; batch N01 of the REMOVE pass read the same root for yeast URH1.
    review_edited: false
    notes: >-
      Both seeds are in the sister child, but the bacterial child is made of cytoplasmic Rih-type hydrolases,
      so the node placement is not the problem and no PAINT fix is asked for. The doubt is specific to Nuh, a
      predicted Sec signal peptide that would put the mature enzyme outside the cytoplasm. A prediction is
      short of evidence of loss, so the row stays over-annotated. A fractionation or PhoA fusion experiment
      would settle it. The written reason names the node, the seeds and the signal peptide. Left as written.
- gene_file: genes/PSEAE/PA0845/PA0845-ai-review.yaml
  rows:
  - go_id: GO:0042759
    go_label: long-chain fatty acid biosynthetic process
    family: PTHR12670
    ibd_node: PTN004377481
    tree_reading: >-
      IBD at the family root PTN004377481 (156 leaves, 78 species) with two seeds, each a single-leaf child of
      the root, the target PA0845 (Q9I596, leaf PTN002290561) and M. tuberculosis Rv0669c (O06769,
      PTN000975177). The third child PTN000292660 (154 leaves, 76 species) holds every eukaryotic member and no
      seed. No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN004377481
    evidence_checked:
    - >-
      The gene review's IDA row on the same term (PMID:9603946, UniProt) is the target's own seed row; its quoted
      abstract sentence describes reversible cleavage and synthesis of the ceramide N-acyl linkage by the purified
      enzyme, an in vitro ceramidase assay.
    - >-
      Batch H07 (human ASAH2, same node) recorded the M. tuberculosis seed as IDA PMID:20139604 (MTBBASE) and
      reached SEED_OVERREACH with REMOVE_IBD at this node.
    review_edited: false
    notes: >-
      The target is itself a seed, which is not a reason to doubt the IBA; the over-annotation is in the seed
      row, where a fatty acid released by amide hydrolysis is read as fatty acid biosynthesis. The IBA and the
      IDA row carry the same action and the review records the defect on the IDA row. Consistent with H07.
      Left as written.
- gene_file: genes/PSEAE/dadA2/dadA2-ai-review.yaml
  rows:
  - go_id: GO:0055130
    go_label: D-alanine catabolic process
    family: PTHR13847
    ibd_node: PTN008552203
    tree_reading: >-
      IBD at PTN008552203 (10 leaves, 8 species) with one seed, E. coli DadA (P0A6J5). The node has three
      children. PTN000354646 (7 leaves, 6 species) holds the seed and both P. aeruginosa paralogs; the target
      dadA2 (Q9HU99, leaf PTN002302698) and dadA1 (Q9HTQ0) form the single-species pair PTN002302697 (2 leaves).
      PTN002676331 (2 Bradyrhizobium leaves) and PTN002676332 (Neisseria) hold no seed. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P0A6J5 x GO:0055130 returns involved_in IMP PMID:6113535 (EcoCyc) plus IEA and the IBA; Q9HTQ0
      (dadA1) and Q9HU99 (dadA2) carry no experimental row for the term.
    - >-
      The review quotes PMID:21378189 that DadA (PA5304, dadA1) is solely responsible for the broad D-amino
      acid dehydrogenase activity, read in the validated supported_by block.
    - >-
      interpro/panther/PTHR13847/PTHR13847-review.yaml assesses the node SOUND for the term.
    review_edited: false
    notes: >-
      Sound seed in the target's own child clade, so no node fix. The doubt is the within-species duplication,
      where loss of dadA1 alone abolishes growth on D-alanine, so DadA2 does not carry the process under the
      tested conditions. That is short of showing DadA2 cannot oxidise D-alanine. Substrate profiling of
      purified DadA2, or a dadA1 mutant expressing dadA2 from a strong promoter, would settle it. The written
      reason names the node, the single seed and the paralog evidence. Left as written.
- gene_file: genes/PSEAE/PA5089/PA5089-ai-review.yaml
  rows:
  - go_id: GO:0009395
    go_label: phospholipid catabolic process
    family: PTHR18896
    ibd_node: PTN004499769
    tree_reading: &pld_tree >-
      IBD at the family root PTN004499769 (713 leaves, 91 species) with four seeds, Arabidopsis AT1G55180 and
      AT3G05630 and rat Pld1 (RGD:3349) and Pld2 (RGD:3350). The root has two children. PTN001051923 (711
      leaves, 90 species, eukaryotic PLDs) holds all four seeds; PTN002315530 (2 leaves, 1 species) is the
      P. aeruginosa pair pldA (Q9HYC2, leaf PTN002315531) and PA5089 (Q9HU94, leaf PTN002315532) and holds no
      seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &pld_fix
      paint_action: MOVE_IBD
      target_node_id: PTN001051923
    evidence_checked:
    - >-
      QuickGO P70496 (rat Pld1) x GO:0009395 returns involved_in IMP PMID:16459925 (RGD) plus the IBA; Q9HYC2
      and Q9HU94 carry only the IBA.
    - >-
      The review quotes PMID:24832454 that PldB targets the periplasm of prokaryotic cells, read in the
      validated supported_by block.
    review_edited: false
    notes: >-
      Pattern 18. All seeds are in the eukaryotic child and the IBD is asserted one node above, where it reaches
      the two secreted type VI effectors. The chemistry is phospholipid hydrolysis, so the term is not false,
      but nothing shows these toxins take part in the producer's own phospholipid catabolism, which is what the
      seeds show for the eukaryotic enzymes. The written reason states where the seeds sit and why the process
      reading does not carry over. Left as written.
