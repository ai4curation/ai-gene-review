    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000471580
    evidence_checked:
    - >-
      The gene review's own IDA row on the term (PMID:17046787, UniProt, abstract only) is the target's seed
      row; the paper is a structure and mechanism study of the epimerase reaction.
    - >-
      interpro/panther/PTHR21047/PTHR21047-review.yaml assesses this IBD WRONG_NODE and asks for it to be
