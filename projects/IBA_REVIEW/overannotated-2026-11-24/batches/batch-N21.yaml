    go_label: L-cysteine biosynthetic process
    family: PTHR30126
    ibd_node: PTN002824317
    tree_reading: >-
      IBD at PTN002824317 (10 leaves, 9 species) with one seed, the target itself (G3XCU6, leaf PTN002409706).
      The node has two children, PTN000776198 (9 leaves, CysB of eight gammaproteobacteria and Xanthomonas plus
