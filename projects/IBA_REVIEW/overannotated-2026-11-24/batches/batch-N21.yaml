- gene_file: genes/PSEAE/wbpL/wbpL-ai-review.yaml
  rows:
  - go_id: GO:0044038
    go_label: cell wall macromolecule biosynthetic process
    family: PTHR22926
    ibd_node: PTN000531998
    tree_reading: &wbpl_tree >-
      IBD at the family root PTN000531998 (121 leaves, 76 species) with two seeds, E. coli WecA (P0AC78) and
      T. maritima WecA (Q9X1N5). The root has two children, PTN001116596 (7 archaeal leaves, no seed) and
      PTN000532004 (114 leaves), which holds both seeds, the target and the MraY members. Inside it the WecA
      branch PTN000532005 (35 leaves, own IBD for lipopolysaccharide biosynthetic process seeded by WecA, WbpL
      and T. maritima WecA) has eleven children. WbpL (G3XD50, leaf PTN002341394) and E. coli WecA share the
      9-leaf proteobacterial clade PTN000532025; T. maritima WecA is in the Thermotoga pair PTN000532010; the
      TagO and mycobacterial members are in PTN007718051 (11 leaves) and are not seeds. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &wbpl_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN000531998
    evidence_checked:
    - >-
      QuickGO all rows for P0AC78. GO:0044038 and GO:0071555 are involved_in IDA PMID:11700352 (UniProt); the
      same paper gives located_in GO:0009276 Gram-negative-bacterium-type cell wall IDA and GO:0009103 IDA.
      EcoCyc annotates the same protein to GO:0009246 enterobacterial common antigen biosynthetic process.
    - >-
      QuickGO all rows for Q9X1N5. GO:0044038, GO:0071555, GO:0009103 and located_in GO:0009276 are all IDA
      PMID:18723618 (UniProt).
    - >-
      PubMed abstracts. PMID:11700352 reports that WecA mutants fail to complement O7 LPS synthesis and that
      membrane extracts fail to transfer GlcNAc into a lipid fraction. PMID:18723618 reports overproduction,
      purification and kinetics of the transferase. Neither is cached in publications/ and no full text was
      read.
    - >-
      QuickGO ontology. GO:0009276 is defined as the peptidoglycan layer of the Gram-negative envelope. The
      ancestors of GO:0009243 O antigen biosynthetic process and GO:0009246 do not include GO:0044038 or
      GO:0071554 cell wall organization or biogenesis.
    - >-
      interpro/panther/PTHR22926/PTHR22926-review.yaml assesses both IBDs SOUND and records this gene review as
      the one dissent, left to adjudicate.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The old reason said the cell-wall term fits the MraY-like members and
      not the WbpL branch, which misstates the tree; both seeds are WecA enzymes in WbpL's own branch and no MraY
      or TagO member is a seed. So this is not a node placed too deep. The over-annotation starts at the two
      seed rows, which give an inner-membrane transferase of O antigen and ECA primers a cell-wall process term
      and a cell-wall location from transferase papers. In GO the Gram-negative cell wall is the peptidoglycan
      layer and LPS biosynthesis is not under the cell-wall term, so the rows read an outer-membrane glycan as a
      cell-wall macromolecule. This disagrees with the family review's SOUND, whose argument rests on GO:0009276
      being wider than peptidoglycan; its definition says it is not. The seed papers were read as abstracts
      only, so the REMOVE_IBD is a query for the PAINT curators and the UniProt seed rows should be checked
      first. If the IBD is withdrawn, the TagO, mycobacterial and MraY members would need the term from their
      own evidence.
  - go_id: GO:0071555
    go_label: cell wall organization
    family: PTHR22926
    ibd_node: PTN000531998
    tree_reading: *wbpl_tree
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *wbpl_fix
    evidence_checked:
    - Same lookups as the GO:0044038 row; the two terms share seeds, papers and evidence codes.
    review_edited: true
    notes: Same reading as GO:0044038. Action unchanged, reason rewritten to state where the seeds sit.
- gene_file: genes/PSEAE/lolD/lolD-ai-review.yaml
  rows:
  - go_id: GO:0055085
    go_label: transmembrane transport
    family: PTHR24220
    ibd_node: PTN000655654
    tree_reading: >-
      IBD at the family root PTN000655654 (294 leaves, 49 species) with three seeds, E. coli NikD (P33593), E.
      coli YejF (P33916) and M. tuberculosis Rv2688c (P9WQL7). The root has four children, PTN002383615 (52
      leaves), PTN002383688 (32 leaves, with its own oligopeptide transmembrane transport IBD), PTN009085280 (30
      leaves) and PTN000656271 (180 leaves), which holds the target (leaf PTN002383677) and no seed for the term.
      Inside it the lineage runs through PTN000656661 (140 leaves) and PTN009085290 (31 leaves) to the LolD node
      PTN000656700 (15 leaves, 12 species), which carries IBDs for lipoprotein localization to outer membrane
      and protein localization to outer membrane seeded by E. coli and P. aeruginosa LolD. No loss recorded for
      the term in the family.
    ground: TARGET_LOSS
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000656700
    evidence_checked:
    - >-
      The review quotes PMID:17350955 that the reconstituted P. aeruginosa LolCDE released lipoproteins to a
      LolA homologue in the presence of ATP, read in the validated supported_by block.
    - >-
      interpro/panther/PTHR24220/PTHR24220-review.yaml rates this node and term NEEDS_PRUNING for LolD and FtsE,
      quoting PMID:10783239 that LolCDE is not involved in the transmembrane transport of substrates.
    - >-
      Batch N06 of the REMOVE pass upheld REMOVE for the same row on E. coli lolD on TARGET_LOSS with ADD_IRD at
      PTN000656700. Seed annotations were not re-queried; the transmembrane claim for the three seeds is not in
      dispute.
    review_edited: true
    notes: >-
      The earlier reason already said the lipoproteins are not carried across the membrane, which is a statement
      that the term is wrong for LolD, not that it claims a little too much. The mechanism is shown on the
      target's own complex and on the E. coli ortholog in the same LolD node, and the E. coli review removes the
      identical row. Changed to REMOVE for consistency. The target's 180-leaf child also holds genuine
      transporters, so the fix is a loss at the LolD node, not a move of the IBD. The companion GO:0022857 IBA
      is MODIFY and was left alone.
- gene_file: genes/PSEAE/pfeA/pfeA-ai-review.yaml
  rows:
  - go_id: GO:0042912
    go_label: colicin transmembrane transporter activity
    family: PTHR30069
    ibd_node: PTN000763909
    tree_reading: >-
      IBD at PTN000763909 (3 leaves, 3 species) with one seed, E. coli FepA (P05825). The node has two children,
      PTN002012591 (2 leaves, E. coli and S. typhimurium FepA, holds the seed) and the target leaf PTN002409317
