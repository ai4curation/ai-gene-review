genes:
- gene_file: genes/human/MTRNR2L1/MTRNR2L1-ai-review.yaml
  rows:
  - go_id: GO:0048019
    go_label: receptor antagonist activity
    family: PTHR33895
    ibd_node: PTN002141596
    tree_reading: >-
      IBD at the family root PTN002141596 (PTHR33895, 24 leaves, 4 species). Its two children are PTN005029346 (23
      leaves: 13 human, 9 chimpanzee, 1 gorilla), which holds the target, MT-RNR2 humanin (Q8IVG9) and every human
      MTRNR2L locus, and PTN002141597, a single mouse leaf (Gm20594). The record has one seed, UniProtKB:Q8IVG9
      (humanin), which lies in the target's own child clade. No loss record appears on the target's lineage.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id: Q8IVG9 carries enables GO:0048019 IDA PMID:15153530 (UniProt) and also GO:0048018
      receptor ligand activity IDA PMID:19386761. The exact-term human query for GO:0048019 returned 9 experimental
      hits, so the query shape returns positives.
    - >-
      publications/PMID_15153530.md (abstract only): humanin uses FPRL1 as a functional receptor and competes with
      amyloid beta 42 for it.
    - >-
      genes/human/MTRNR2L1/MTRNR2L1-ai-review.yaml: the existing reason names the node, accepts the placement for
      humanin, and gives locus-specific residue and expression grounds.
    review_edited: false
    notes: >-
      Seed and target share a clade, so this is not a placement problem. The doubt is on the target: a nuclear copy
      of the mitochondrial humanin ORF for which no peptide has been detected and which differs from humanin at
      positions the existing reason lists. No PAINT fix follows from that doubt; detecting the endogenous peptide
      and testing it in the FPRL1 competition assay would settle it. Separate query on the seed: the abstract describes
      humanin as an FPRL1 agonist that competes with amyloid beta, which fits receptor ligand activity better than
      receptor antagonist activity, but the paper was not read in full so the seed is not overruled.
  - go_id: GO:1900118
    go_label: negative regulation of execution phase of apoptosis
    family: PTHR33895
    ibd_node: PTN002141596
    tree_reading: >-
      IBD at the family root PTN002141596 (PTHR33895, 24 leaves, 4 species). Its two children are PTN005029346 (23
      leaves: 13 human, 9 chimpanzee, 1 gorilla), which holds the target, MT-RNR2 humanin (Q8IVG9) and every human
      MTRNR2L locus, and PTN002141597, a single mouse leaf (Gm20594). The record has one seed, UniProtKB:P0CJ72
      (MTRNR2L5), a paralog in the target's own child clade.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id: P0CJ72 carries involved_in GO:1900118 IMP PMID:19477263 (UniProt); Q8IVG9
      (humanin) has only the IBA for this term.
    - >-
      publications/PMID_19477263.md (abstract only): synthetic HN5 peptide protects against staurosporine-induced
      apoptosis and the Thr13 to Ile variant protects less.
    - >-
      genes/human/MTRNR2L1/MTRNR2L1-ai-review.yaml: the existing reason names the seed and its assay and gives locus-specific
      residue and expression grounds.
    review_edited: false
    notes: >-
      Upheld on doubt about the target, not on the seed or the node: the seed assay used a synthesised peptide,
      no peptide from this locus has been observed, and the existing reason records which humanin positions this
      locus has changed. The doubt is weakest for loci that differ from humanin only at Leu12, the change the active
      HN5 peptide also carries (MTRNR2L1, MTRNR2L8), and a later pass could reasonably move those to KEEP_AS_NON_CORE
      if peptide evidence appears. MTRNR2L5, the seed, keeps this row as ACCEPT and is not in this todo list for
      this term.
