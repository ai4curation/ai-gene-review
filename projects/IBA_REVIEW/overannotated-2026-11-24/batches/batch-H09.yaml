genes:
- gene_file: genes/human/AFAP1L2/AFAP1L2-ai-review.yaml
  rows:
  - go_id: GO:0006954
    go_label: inflammatory response
    family: PTHR14338
    ibd_node: PTN002682769
    tree_reading: >-
      IBD at PTN002682769 (23 leaves, the AFAP1L2 ortholog group), one seed, human AFAP1L2 itself
      (Q8N4X5). Children are the tetrapod clade PTN002682770 (20 leaves, holds the target) and the fish
      clade PTN002682777 (3 leaves). No loss recorded for the term in the family.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002682769
    evidence_checked:
    - >-
      QuickGO Q8N4X5 x GO:0006954 returns the IBA and one experimental row, involved_in IDA PMID:17412687
      (HGNC-UCL).
    - >-
      The review quotes PMID:17412687 for that row; the assay is reduced IL-8 and IL-6 release after XB130
      siRNA in a bronchial epithelial cell line.
    - interpro/panther/PTHR14338/PTHR14338-review.yaml has no assessment of this term.
    review_edited: false
    notes: >-
      The existing reason is node-aware and states the ground (the seed is a cell-line cytokine readout
      annotated to an organismal process; the cytokine production rows carry the supported claim). The
      IDA seed row carries the same action. Being its own seed is not used as an argument.
  - go_id: GO:0045893
    go_label: positive regulation of DNA-templated transcription
    family: PTHR14338
    ibd_node: PTN002682769
    tree_reading: >-
      Same node as above, PTN002682769 (23 leaves), single seed human AFAP1L2 (Q8N4X5); target in the
      20-leaf tetrapod child PTN002682770, fish in PTN002682777.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002682769
    evidence_checked:
    - >-
      The seed row is the human IDA from PMID:17412687, quoted in the review; an SRE and AP-1 luciferase
      reporter gain when XB130 is overexpressed with c-Src in HEK293 cells.
    review_edited: false
    notes: >-
      Overexpression reporter readout far downstream of a cytoplasmic adaptor; the existing reason says
      so and names the node. Left as written.
- gene_file: genes/human/GIGYF2/GIGYF2-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR14445
    ibd_node: PTN002683636
    tree_reading: >-
      IBD at PTN002683636 (21 leaves, vertebrate GIGYF2), one seed, mouse Gigyf2 (MGI:2138584). Children
      are PTN008555786 (17 leaves, tetrapods, holds both the human target and the mouse seed) and the
      fish clade PTN002683640 (4 leaves). The same node carries IBDs for perikaryon, proximal dendrite,
      vesicle and IGF receptor signaling from the same mouse work. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q6Y7W8 (mouse Gigyf2) x GO:0016020 returns located_in IDA PMID:20670374 (ParkinsonsUK-UCL)
      plus the IBA.
    - >-
      publications/PMID_20670374.md (abstract only) states that in brain GIGYF2 was tightly associated
      with membrane in the S3 fraction and was present in Rab4 and Grb10 positive endosomes.
    review_edited: true
    notes: >-
      The earlier reason was that GIGYF2 has no transmembrane domain, which is not a ground; the term
      covers peripheral association, the seed is a direct fractionation result on the 1:1 ortholog, and
      the review already keeps endosome and vesicle from the same paper. No more specific membrane term
      is on another row, so not TOO_GENERAL. The IEA (GO_REF:0000107) and HDA (PMID:19946888) rows on the
      same term were moved to KEEP_AS_NON_CORE as well for consistency. PAINT propagates the located_in
      seed as is_active_in; that qualifier point is not pursued here.
- gene_file: genes/human/CDK5RAP3/CDK5RAP3-ai-review.yaml
  rows:
  - go_id: GO:0012505
    go_label: endomembrane system
    family: PTHR14894
    ibd_node: PTN000382540
    tree_reading: >-
      IBD at the family root PTN000382540 (87 leaves), one seed, human CDK5RAP3 itself (Q96JB5).
      Children are PTN001028757 (40 leaves, animals, choanoflagellate and Dictyostelium; holds the
      target) and PTN007641670 (47 leaves, plants, kinetoplastids, Paramecium). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q96JB5 x GO:0012505 with descendants returns three is_active_in IDA rows for GO:0005789
      endoplasmic reticulum membrane (PMID:36543799, PMID:38383785, PMID:38383789; UniProt), the IEA for
      the same term and the IBA. So the seed evidence is ER membrane and the curator generalised it.
    review_edited: true
    notes: >-
      The earlier reason already said the term is subsumed by ER membrane; that is TOO_GENERAL, not an
      over-annotation. The review accepts GO:0005789 on the experimental rows. Whether the root is the
      right node for the plant and protist clade is not something the human row depends on.
- gene_file: genes/human/FBXO22/FBXO22-ai-review.yaml
  rows:
  - go_id: GO:0048742
    go_label: regulation of skeletal muscle fiber development
    family: PTHR14939
    ibd_node: PTN002686773
    tree_reading: >-
      IBD at PTN002686773 (20 leaves, vertebrate FBXO22), one seed, mouse Fbxo22 (MGI:1926014). Children
      are PTN008557171 (17 leaves, tetrapods, holds the human target and the mouse seed) and the fish
      clade PTN002686777 (3 leaves). The node also carries IBDs for SCF complex, SCF-dependent
      catabolism and ligase-substrate adaptor activity. No loss recorded.
    ground: BAD_SEED
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002686773
    evidence_checked:
    - >-
      QuickGO Q78JE5 (mouse Fbxo22) x GO:0048742 returns acts_upstream_of_or_within IMP PMID:19319192
      (MGI) plus the IBA.
    - >-
      PubMed metadata for PMID:19319192; title "Inhibition of atrogin-1/MAFbx mediated MyoD proteolysis
      prevents skeletal muscle atrophy in vivo" (doi 10.1371/journal.pone.0004973). The abstract is
      entirely about MAFbx (atrogin-1), which is Fbxo32.
    - >-
      Europe PMC full text XML for PMC2656614, searched as text; zero occurrences of Fbxo22, FBXO22,
      Fbx22, Fbxo32 or FBXO32; every F-box construct and the shRNA are named MAFbx.
    - >-
      QuickGO by reference PMID:19319192 returns 23 rows; ten on mouse Fbxo22 (GO:0048742, GO:0000209,
      GO:0006913, GO:0009267, GO:0010830, GO:0032436, GO:2000060, GO:0005515, GO:0005634, GO:0005737),
      none on Fbxo32. QuickGO Q9CPU7 (mouse Fbxo32, accession from UniProt search) x GO:0048742 returns
      no rows.
    review_edited: true
    notes: >-
      The earlier reason argued from missing evidence on FBXO22 and named no node. The seed is on the
      wrong gene, so the row is a REMOVE, with source_defects for MGI (repoint the rows to Fbxo32,
      MGI:1914981) and GO_CENTRAL (remove the IBD). Not checked and outside this todo; other FBXO22
      content that may trace to the same mis-assigned paper or to a similar mix-up, namely the UniProt
      by-similarity statement on sarcomeric protein turnover quoted on the GO:0032436 IBA row and the
      Z disc IEA row. A later pass on this gene should trace those.
- gene_file: genes/human/ZBP1/ZBP1-ai-review.yaml
  rows:
  - go_id: GO:0060340
    go_label: positive regulation of type I interferon-mediated signaling pathway
    family: PTHR14966
    ibd_node: PTN008557399
    tree_reading: >-
      IBD at PTN008557399 (13 leaves), one seed, mouse Zbp1 (MGI:1927449). Children are the mammal clade
      PTN008353919 (12 leaves, holds the human target and the mouse seed) and a single Xenopus leaf
      PTN008557400. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN008557399
    evidence_checked:
    - >-
      QuickGO Q9QY24 (mouse Zbp1) x GO:0060340 returns acts_upstream_of_or_within IMP PMID:17618271 (MGI),
      an InterPro IEA and the IBA.
    - >-
      publications/PMID_17618271.md and PMID_18771559.md are cached and quoted in the review; the first
      reports DAI-dependent induction of interferon genes, the second that human ZBP1 knockdown does not
      reduce IFN-beta responses in human cells.
    review_edited: false
    notes: >-
      Two grounds, both stated in the existing reason. The seed measures interferon production, not
      signaling downstream of the interferon receptor (seed over-reach by term choice), and there is
      human-specific negative evidence (TARGET_DOUBT). The reason is node-aware and does not dispute the
      placement. Left as written; the IEA row carries the same action.
- gene_file: genes/human/AMN/AMN-ai-review.yaml
  rows:
  - go_id: GO:0043235
    go_label: signaling receptor complex
    family: PTHR14995
    ibd_node: PTN001029969
    tree_reading: >-
      IBD at the family root PTN001029969 (31 leaves), two seeds, human AMN itself (Q9BXJ7) and fly
      Amnionless (FBgn0025686, Q9VPN2). Both sit in the child PTN000384906 (30 leaves, bilaterians); the
      other child is a single Trichoplax leaf PTN001029984. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001029969
    evidence_checked:
    - >-
      QuickGO Q9BXJ7 x GO:0043235 returns part_of IPI PMID:30523278 (ComplexPortal) plus the IBA; Q9VPN2
      returns part_of IPI PMID:34738617 (FlyBase) plus the IBA.
    review_edited: false
    notes: >-
      Both seeds record membership of the cubam complex with cubilin, an endocytic cargo receptor, under a
      term defined for signaling receptors. The complex membership is real and is carried by cargo
      receptor activity and the endocytosis rows; the over-reach is the term chosen at the seeds, which
      the existing reason states. The human IPI seed row carries the same action. The better upstream fix
      is a cubam or endocytic receptor complex term on the two seed rows, after which the IBD would
      follow.
- gene_file: genes/human/CD52/CD52-ai-review.yaml
  rows:
  - go_id: GO:0007204
    go_label: positive regulation of cytosolic calcium ion concentration
    family: PTHR15029
    ibd_node: PTN000385637
    tree_reading: >-
      IBD at PTN000385637 (11 leaves), one seed, human CD52 itself (P31358). Children are PTN001030421
      (6 leaves, primates and rodents, holds the target) and PTN000385643 (5 leaves, cow, pig, horse,
      cat, dog). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000385637
    evidence_checked:
    - >-
      The seed is the human IDA from PMID:8223854, quoted in the review; calcium flux in monocytes after
      F(ab')2 cross-linking of anti-CDw52, which the paper attributes to GPI-anchored proteins in general.
    review_edited: false
    notes: >-
      Antibody cross-linking is an artificial stimulus and the paper itself reads the result as a
      property of the GPI anchor. The existing reason names the node, the seed and the assay, and says
      explicitly that being its own seed is not the problem. Left as written.
- gene_file: genes/human/STBD1/STBD1-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR15048
    ibd_node: PTN000386078
    tree_reading: >-
      IBD at the family root PTN000386078 (80 leaves), two seeds, human STBD1 itself (O95210) and rat
      Stbd1 (RGD:1311800). Both sit in the child PTN007643118 (21 leaves, vertebrates plus four fungi),
      which holds the target; the other child PTN008354159 (59 leaves, Paramecium, Chlamydomonas, land
      plants) has no seed. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      The review's IDA row for membrane cites PMID:20810658 and its EXP and IEA rows accept GO:0005789
      endoplasmic reticulum membrane; the seeds were read from the treeview output.
    review_edited: true
    notes: >-
      The earlier reason said in so many words that the IBA is sound and the objection is granularity
      only. With ER membrane accepted on other rows that is TOO_GENERAL. The IDA row on the same term
      (PMID:20810658) was moved to TOO_GENERAL too. The 59-leaf plant and protist child gets a membrane
      term from two vertebrate seeds; that is a question for the family, not for the human row.
- gene_file: genes/human/BNIP3L/BNIP3L-ai-review.yaml
  rows:
  - go_id: GO:0043653
    go_label: mitochondrial fragmentation involved in apoptotic process
    family: PTHR15186
    ibd_node: PTN001032684
    tree_reading: >-
      IBD at the family root PTN001032684 (64 leaves, Eumetazoa), one seed, human BNIP3 (Q12983). BNIP3
      sits in the vertebrate BNIP3 clade PTN002689498 (25 leaves); the target sits in the NIX clade
      PTN002689506 (28 leaves); the two join at PTN000795991 (53 leaves). The root also covers fly and
      worm members and a Nematostella leaf. PAINT records a NOT IRD for GO:0000423 mitophagy at
      PTN002689506, the NIX clade.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002689498
    evidence_checked:
    - >-
      QuickGO Q12983 x GO:0043653 returns involved_in IDA PMID:20436456 (BHF-UCL) plus the IBA; O60238
      (target) returns the IBA only.
    - >-
      interpro/panther/PTHR15186/PTHR15186-review.yaml assesses this node as TOO_DEEP and describes the
      term as at most a vertebrate BNIP3 property.
    review_edited: false
    notes: >-
      The single seed is in the sister paralog clade and the review quotes evidence that NIX-dependent
      clearance does not run through the apoptotic machinery, which is doubt short of loss. The existing
      reason names the node and the seed. Separately, the NOT IRD for mitophagy on the NIX clade
      PTN002689506 looks wrong, since NIX is the best characterised mitophagy receptor in the family; it
      is outside this todo and is flagged for whoever maintains the family review.
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR15186
    ibd_node: PTN001032684
    tree_reading: >-
      IBD at the family root PTN001032684 (64 leaves), three seeds, rat Bnip3 (RGD:620800, Q9ET45), human
      BNIP3 (Q12983) and human BNIP3L itself (O60238). The two BNIP3 seeds are in PTN002689498 (25
      leaves) and the target in PTN002689506 (28 leaves). The vertebrate node PTN000795991 (53 leaves)
      carries a separate IBD for GO:0005635 nuclear envelope seeded by O60238 and Q12983.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO O60238 x GO:0005634 with descendants returns no experimental nucleus row; the experimental
      rows are located_in IDA GO:0005635 nuclear envelope (PMID:10381623, UniProt) and an HPA nuclear
      speck IDA. Q12983 likewise has an IDA for nuclear envelope (PMID:7954800) and only ISS and IEA rows
      for nucleus and nucleoplasm, taken from rat Q9ET45.
    - >-
      interpro/panther/PTHR15186/PTHR15186-review.yaml assesses the nucleus IBD as TOO_DEEP, to sit no
      deeper than PTN000795991.
    review_edited: true
    notes: >-
      For NIX the term is true only as the parent of nuclear envelope, which the review keeps on IDA, IEA
      and IBA rows. That is a granularity verdict, so TOO_GENERAL. The family-level point (a
      nucleoplasmic observation on rat Bnip3 asserted at the Eumetazoa root) stands in the family review
      and is not needed to judge the human row.
- gene_file: genes/human/INSIG1/INSIG1-ai-review.yaml
  rows:
  - go_id: GO:0032869
    go_label: cellular response to insulin stimulus
    family: PTHR15301
    ibd_node: PTN001033847
    tree_reading: >-
      IBD at the family root PTN001033847 (52 leaves), one seed, rat Insig1 (RGD:708457, Q08755). The
      child PTN001033848 (49 leaves) holds both the INSIG1 and INSIG2 paralogs, the seed and the target;
      the other children are Trichoplax (PTN009024120, 2 leaves) and Nematostella (PTN001033855, 1 leaf).
      No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001033847
    evidence_checked:
    - >-
      QuickGO Q08755 x GO:0032869 returns involved_in IEP PMID:19299314 (RGD) plus the IBA. The only
      experimental support is an expression-pattern code.
    review_edited: false
    notes: >-
      An IEP shows that insulin changes the transcript level, not that the protein acts in the response.
      The existing reason names the node, the seed and its evidence code.
- gene_file: genes/human/INSIG2/INSIG2-ai-review.yaml
  rows:
  - go_id: GO:0032869
    go_label: cellular response to insulin stimulus
    family: PTHR15301
    ibd_node: PTN001033847
    tree_reading: >-
      Same record as for INSIG1. IBD at the root PTN001033847 (52 leaves), single seed rat Insig1
      (RGD:708457, Q08755), an INSIG1 ortholog; INSIG2 (Q9Y5U4) is in the same 49-leaf child
      PTN001033848. The node separating the INSIG1 and INSIG2 groups was not read out.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001033847
    evidence_checked:
    - QuickGO Q08755 x GO:0032869 returns IEP PMID:19299314 (RGD) plus the IBA, as for INSIG1.
    review_edited: false
    notes: >-
      Same ground as INSIG1. The review adds that insulin represses the liver Insig-2a transcript, the
      opposite sign to INSIG1, which is a further reason not to read the expression result as a shared
      protein function.
- gene_file: genes/human/FBXO43/FBXO43-ai-review.yaml
  rows:
  - go_id: GO:0007088
    go_label: regulation of mitotic nuclear division
    family: PTHR15493
    ibd_node: PTN001036144
    tree_reading: >-
      IBD at the family root PTN001036144 (48 leaves), three seeds, human FBXO5 (Q9UKT4), Xenopus fbxo5-a
      (Q90Z80) and zebrafish ZDB-GENE-030131-4027. The FBXO5 (EMI1) clade is PTN002693890 (21 leaves) and
      the FBXO43 (EMI2) clade, with the target, is PTN002693896 (20 leaves); they join at PTN000398159
      (41 leaves). PTN002693890 already carries FBXO5-only IBDs (negative regulation of mitotic
      metaphase/anaphase transition, spindle, positive regulation of G2/M) and a NOT IRD for G1/S
      transition.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002693890
    evidence_checked:
    - >-
      QuickGO Q9UKT4 x GO:0007088 with descendants returns three IDA rows for GO:0045841 negative
      regulation of mitotic metaphase/anaphase transition (PMID:11988738, PMID:15148369, PMID:16921029);
      Q0V967 (zebrafish fbxo5) returns an IMP for GO:0045839 (PMID:18480162). Q4G163 (target) returns
      only the IBA and an InterPro IEA.
    - >-
      The zebrafish seed id was not resolved to an accession by lookup; Q0V967 is the zebrafish fbxo5
      leaf in the FBXO5 clade and carries the matching experimental row, so it is taken to be that seed.
    review_edited: false
    notes: >-
      All experimental seeds are EMI1 orthologs and the target is the meiotic paralog EMI2. The existing
      reason says the term is over-propagated from the mitotic paralog; it does not name the node but
      does not misstate the tree. Nothing was found or looked for that shows EMI2 lacks any mitotic
      role, so this is doubt, not loss; over-annotation is the right level.
- gene_file: genes/human/TAC3/TAC3-ai-review.yaml
  rows:
  - go_id: GO:0045777
    go_label: positive regulation of blood pressure
    family: PTHR15536
    ibd_node: PTN002694376
    tree_reading: >-
      IBD at the family root PTN002694376 (20 leaves), the family's only PAINT record, one seed, rat Tac3
      (RGD:3809, P08435). Children are the tetrapod clade PTN008560134 (16 leaves, holds the target and
      the rat seed) and the fish clade PTN002694381 (4 leaves). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002694376
    evidence_checked:
    - QuickGO P08435 x GO:0045777 returns involved_in IDA PMID:2478257 (RGD) plus the IBA.
    - >-
      The review quotes PMID:2478257 (intracerebroventricular NK3 agonist injection in rats, pressor
      response reduced by vasopressin receptor blockade) and PMID:10866201.
    - interpro/panther/PTHR15536/PTHR15536-review.yaml assesses the node as WRONG_NODE on the same reading.
