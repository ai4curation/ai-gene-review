- gene_file: genes/human/IL17RD/IL17RD-ai-review.yaml
  rows:
  - go_id: GO:0030368
    go_label: interleukin-17 receptor activity
    family: PTHR15583
    ibd_node: PTN001436609
    tree_reading: >-
      IBD at the family root PTN001436609 (135 leaves), three seeds, human IL17RA (Q96F46), mouse Il17ra
      (MGI:107399, Q60943) and human IL17RC (Q8NAC3). All three sit under PTN008560355 (97 leaves),
      within PTN000400325 (100 leaves). The target sits in the IL17RD clade PTN008560351 (26 leaves),
      which is the sister of PTN000400325 under PTN000400326 (126 leaves). No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008560355
    evidence_checked:
    - >-
      Lineages of Q8NFM7, Q96F46, Q8NAC3 and Q60943 read from the cached PTHR15583 tree with the same
      library the treeview script uses.
    - >-
      The review quotes PMID:19079364 (IL-17RD described as an orphan receptor associated with IL-17R)
      and PMID:33436016.
    review_edited: false
    notes: >-
      Seeds are confined to the IL17RA and IL17RC side of the first duplication; nothing shows cytokine
      binding by IL17RD, which acts as an accessory or regulatory subunit and as an FGF signaling
      inhibitor. Doubt, not shown loss, so over-annotation and not REMOVE. The existing reason is
      node-aware. The IEA row carries the same action.
- gene_file: genes/human/LAT/LAT-ai-review.yaml
  rows:
  - go_id: GO:0006954
    go_label: inflammatory response
    family: PTHR15586
    ibd_node: PTN008356078
    tree_reading: >-
      IBD at PTN008356078 (12 leaves), one seed, mouse Lat (MGI:1342293, O54957). Children are the
      placental clade PTN000400393 (11 leaves, holds the target and the seed) and a platypus leaf
