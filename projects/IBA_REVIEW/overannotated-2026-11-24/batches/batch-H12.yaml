genes:
- gene_file: genes/human/AHNAK2/AHNAK2-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR23348
    ibd_node: PTN001156025
    tree_reading: >-
      IBD at the family root PTN001156025 (67 leaves) with 4 seeds. Its child PTN000598113 (66 leaves) holds
      every chordate member; the other child is one Trichomonas leaf. Three seeds are periaxins (human PRX,
      mouse and rat Prx) in clade PTN002763386 (20 leaves), which joins the AHNAK2 lineage at PTN000598143
      (56 leaves). The fourth is mouse Ahnak in clade PTN000598166 (12 leaves), which joins at PTN008387346
      (19 leaves). The AHNAK2 clade PTN000598146 (7 leaves) has no seed. So seeds bracket AHNAK2 on both
      sides (sister AHNAK, outgroup PRX). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Mouse Prx (O55103) located_in EXP PMID:10671475 and IDA PMID:15282162;
      mouse Ahnak (E9Q616) located_in IDA PMID:21940993. The query returned hits, so its shape is sound.
    - >-
      publications/PMID_21940993.md (abstract only). The nuclear species is the small 17-kDa AHNAK isoform,
      and a small 17-kDa periaxin isoform likewise shuttles to the nucleus.
    review_edited: false
    notes: >-
      The tree alone would support the term, since both the sister and the outgroup are seeded. The call holds
      on evidence about the target, which the existing reason states. In the seeds the nuclear pool is a small
      N-terminal isoform, no such isoform is annotated for AHNAK2, and HPA immunofluorescence for AHNAK2 shows
      cytosol and plasma membrane only. The reason also argues from the absence of an AHNAK2 ortholog among the
      donors, which is not a ground, but the action does not depend on it, so the file was left alone. An
      experiment that would settle it is detection of a small AHNAK2 transcript and its protein in nuclear
      fractions.
  - go_id: GO:0043484
    go_label: regulation of RNA splicing
    family: PTHR23348
    ibd_node: PTN001156025
    tree_reading: >-
      IBD at the family root PTN001156025 (67 leaves). PAINT lists two seeds, mouse Ahnak and mouse Prx. Mouse
      Ahnak sits in clade PTN000598166 (12 leaves), joining the AHNAK2 lineage at PTN008387346 (19 leaves).
      Mouse Prx sits in clade PTN002763386 (20 leaves). The AHNAK2 clade PTN000598146 (7 leaves) has no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000598166
    evidence_checked:
    - >-
      QuickGO by accession and by term for mouse (GO:0043484, taxon 10090, 173 hits). Mouse Ahnak (E9Q616) has
      involved_in IDA PMID:21940993 (UniProt). Mouse Prx (O55103) now carries the term by IBA only, so one
      live experimental seed remains.
    - >-
      publications/PMID_21940993.md (abstract only). The small AHNAK isoform sets up a positive feedback loop on
      splicing of its own locus; a small periaxin isoform is said to regulate mRNA splicing similarly.
    review_edited: false
    notes: >-
      The existing reason already names the seeds and the mechanism (a locus-autonomous loop run by a small
      nuclear isoform that AHNAK2 is not known to make). With a single live seed in the AHNAK clade, the root
      placement is not supported, and moving the IBD to PTN000598166 keeps it where it was shown.
- gene_file: genes/human/DMP1/DMP1-ai-review.yaml
  rows:
  - go_id: GO:0030198
    go_label: extracellular matrix organization
    family: PTHR23400
    ibd_node: PTN000600550
    tree_reading: >-
      IBD at the family root PTN000600550 (15 leaves), which is the DMP1 clade. One seed, mouse Dmp1
      (MGI:94910). Human DMP1 is in child PTN000600551 (14 leaves) with the seed; the other child is one
      Anolis leaf. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000600550
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Mouse Dmp1 (O55188) acts_upstream_of_or_within GO:0030198 IDA
      PMID:18757743 (MGI).
    - >-
      QuickGO by reference PMID:18757743 (190 rows). The same term with the same qualifier and code is given to
      33 mouse proteins; Dmp1 also receives extracellular matrix binding and positive regulation of
      cell-substrate adhesion from it.
    - >-
      publications/PMID_18757743.md (abstract only). A transcriptome-wide screen of secreted proteins for
      matrix-associated behaviour by in vitro assays.
    review_edited: true
    notes: >-
      Action unchanged. The reason was rewritten because it argued only from DMP1 biology and did not say that
      the node is the DMP1 clade itself or what the seed is. The seed row is the over-reach, one term applied
      across a screening paper (pattern 20), read at abstract depth. The InterPro IEA row on the same term
      keeps the same action and its reason was brought into line.
- gene_file: genes/human/SLC2A1/SLC2A1-ai-review.yaml
  rows:
  - go_id: GO:0032868
    go_label: response to insulin
    family: PTHR23503
    ibd_node: PTN007759196
    tree_reading: >-
      IBD at PTN007759196 (27 leaves), the GLUT1 clade, not a node shared with GLUT4. Two seeds, chicken
      SLC2A1 (P46896) and rat Slc2a1 (RGD:3704), both in child PTN008599994 (18 leaves) together with human
      SLC2A1. The other child, PTN002766877 (9 leaves), is fish. A separate IBD for cellular response to insulin
      stimulus sits at PTN001528471 elsewhere in the family.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Chicken SLC2A1 (P46896) involved_in IDA PMID:22859751 (AgBase); rat
      Slc2a1 (P11167) involved_in IEP PMID:12399425 (RGD). Human and mouse carry only IBA and IEA.
    - >-
      PubMed abstracts. PMID:22859751 reports that insulin raised GLUT-1 mRNA and protein and 2-deoxyglucose
      uptake in chicken embryonic myoblasts and says GLUT-1 is not considered insulin-responsive in mammals
      (https://doi.org/10.2527/jas.2012-5100). PMID:12399425 reports GLUT-1 content and surface membrane
      abundance in undernourished rat heart under insulin (https://doi.org/10.1210/en.2002-220258).
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason called this an over-propagation of a GLUT4
      function, which misstates the tree; the node is the GLUT1 clade and both seeds are GLUT1 orthologs. The
      call holds because the seed rows record insulin-dependent changes in GLUT1 amount or surface content
      (one is IEP) and mammalian GLUT1 uptake is largely insulin-independent. I did not ask for REMOVE_IBD
      because the rat abstract does describe insulin-stimulated GLUT1 translocation, and only abstracts were
      read. The Ensembl IEA row on the same term keeps the same action with a matching reason.
- gene_file: genes/human/SLC2A2/SLC2A2-ai-review.yaml
  rows:
  - go_id: GO:0005903
    go_label: brush border
    family: PTHR23503
    ibd_node: PTN002766848
    tree_reading: >-
      IBD at PTN002766848 (23 leaves), the GLUT2 clade. Two seeds, mouse and rat Slc2a2, both in child
      PTN008599992 (20 leaves) with human SLC2A2, joining its lineage at PTN000627536 (6 leaves). The other
      child is 3 fish leaves. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Rat Slc2a2 (P12336) located_in IDA PMID:12095416 (RGD), plus a brush
      border membrane IDA PMID:17272350; mouse Slc2a2 (P14246) located_in IDA PMID:15601832 (MGI).
    - >-
      PubMed abstract PMID:12095416 (https://doi.org/10.1042/BJ20020393). GLUT2 is described as transiently
      expressed in the rat jejunal brush-border membrane, with insertion promoted by luminal glucose or GLP-2.
      PMID:15601832 (https://doi.org/10.1128/MCB.25.1.78-87.2005) is a study of Rsc1A1 knockout mice; its
      abstract does not mention GLUT2 location.
    review_edited: false
    notes: >-
      The seeds are the target's own orthologs and the placement is sound, so this is not a tree problem. The
      call holds as TARGET_DOUBT in the README sense of a conditional function. The rat seed paper itself
      describes apical GLUT2 as transient and induced, while the steady-state epithelial location is
      basolateral, and the IBA asserts is_active_in. The existing reason says this and names the rodent seeds,
      so the file was left alone. KEEP_AS_NON_CORE would also be defensible; I kept the earlier call because
      the conditional nature is documented in the seed evidence.
- gene_file: genes/human/SLC2A5/SLC2A5-ai-review.yaml
  rows:
  - go_id: GO:0055056
    go_label: D-glucose transmembrane transporter activity
    family: PTHR23503
    ibd_node: PTN008599990
    tree_reading: >-
      IBD at PTN008599990 (240 leaves) with 18 seeds. Its child PTN004643970 (233 leaves) holds class I and
      class II GLUTs; the other child is 7 sea urchin leaves. Seeds lie on both sides of the class split.
      GLUT1, GLUT2, GLUT3, GLUT4 and GLUT14 are in the class I clade PTN008599991 (115 leaves). In the class
      II clade PTN000628027 (118 leaves), which holds GLUT5, human GLUT11 and human and mouse GLUT9 join the
      GLUT5 lineage at PTN001920995 (104 leaves) and human GLUT7 at PTN000627425 (21 leaves). The GLUT5 clade
      PTN000627437 (13 leaves) carries its own IBDs for fructose transport. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under the node (term and descendants). 20 leaves carry experimental rows,
      including SLC2A11 (Q9BYW1) IDA from three papers, SLC2A9 human and mouse IDA, and SLC2A7 (Q6PXP3) with
      both an IDA (PMID:29548810) and a NOT IDA (PMID:28083649).
    - >-
      publications/PMID_1634504.md. Human GLUT5 in oocytes is selective for fructose and its fructose
      transport is not inhibited by cytochalasin B. The UniProt record says 2-deoxyglucose uptake is of low
      efficiency.
    review_edited: true
    notes: >-
      Action unchanged. The summary, reason and node comment were corrected because they said the node is
      driven by GLUT1 to GLUT4; class II members GLUT11, GLUT9 and GLUT7 are seeds too, so the placement is
      sound and the ground is the evidence on GLUT5. The TAS row on the same term keeps the same action and
      was not touched.
  - go_id: GO:0070837
    go_label: dehydroascorbic acid transport
    family: PTHR23503
    ibd_node: PTN008599990
    tree_reading: >-
      IBD at PTN008599990 (240 leaves) with 8 seeds. Every experimental row found is on a class I member
      (GLUT1, GLUT2, GLUT3, GLUT14 of human, mouse and rat), all inside PTN000627584 (101 leaves), which is
      below the class I clade PTN008599991 (115 leaves). The class II clade PTN000628027 (118 leaves), which
      holds GLUT5, has no seed. No loss recorded.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000627584
    evidence_checked:
    - >-
      QuickGO for every leaf under the node (term and descendants). 10 leaves carry experimental rows, all
      class I, mostly IDA from PMID:18668520, PMID:23396969, PMID:28971850 and PMID:9228080.
    - >-
      publications/PMID_9228080.md. In Xenopus oocytes GLUT1 and GLUT3 transported dehydroascorbic acid and
      GLUT2, GLUT5 and SGLT1 did not.
    - >-
      publications/PMID_23396969.md (abstract only). A panel of GLUT2 and GLUT5-12 in oocytes; only GLUT2 and
      GLUT8 transported it.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE. The seeds all sit in one clade two nodes below the IBD
      and GLUT5 has two tested negatives, which the row already quoted. That is evidence the target lacks
      the function, which the README treats as a misplaced IBD. No other row on this term in the review.
  - go_id: GO:0098708
    go_label: D-glucose import across plasma membrane
    family: PTHR23503
    ibd_node: PTN008599990
    tree_reading: >-
      IBD at PTN008599990 (240 leaves) with 8 seeds. The experimental rows found are on GLUT1, GLUT2, GLUT3
      and GLUT4 of human, rat, mouse and zebrafish, all in the class I clade PTN008599991 (115 leaves). The
      class II clade PTN000628027 (118 leaves) holding GLUT5 has no seed for this process, although the
      matching activity term is seeded there.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under the node (term and descendants). 8 leaves carry experimental rows, all
      class I (IMP, IGI and IDA rows from ARUK-UCL, RGD, ZFIN, MGI, UniProt).
    - The GLUT5 evidence listed for GO:0055056 above.
    review_edited: true
    notes: >-
      Action unchanged. Summary, reason and node comment corrected to state where the seeds sit. I did not ask
      for MOVE_IBD because glucose transporter activity is seeded in class II, so import by those members is
      a fair inference; the doubt is specific to GLUT5.
- gene_file: genes/human/SLC2A9/SLC2A9-ai-review.yaml
  rows:
  - go_id: GO:0070837
    go_label: dehydroascorbic acid transport
    family: PTHR23503
    ibd_node: PTN008599990
    tree_reading: >-
      Same IBD as the SLC2A5 row. IBD at PTN008599990 (240 leaves); every experimental row found is on a class
      I member inside PTN000627584 (101 leaves). GLUT9 is in the class II clade PTN000628027 (118 leaves),
      in its own clade PTN002766889 (21 leaves), with no seed. No loss recorded.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000627584
    evidence_checked:
    - QuickGO for every leaf under the node, as for SLC2A5. All 10 leaves with experimental rows are class I.
    - >-
      publications/PMID_23396969.md (abstract only). GLUT2 and GLUT5-12 tested in oocytes; only GLUT2 and GLUT8
      transported dehydroascorbic acid.
    - The row also quotes PMID:36749388, where GLUT9 transported urate but not vitamin C.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED to REMOVE. The earlier reason itself said the target's own direct
      evidence refutes the term, which is a removal, not an over-annotation. No other row on this term.
- gene_file: genes/human/USP36/USP36-ai-review.yaml
  rows:
  - go_id: GO:0042981
    go_label: regulation of apoptotic process
    family: PTHR24006
    ibd_node: PTN002541928
    tree_reading: >-
      IBD at PTN002541928 (131 leaves) with 2 seeds. Child PTN000607281 (118 leaves) holds USP36 and the
      USP17 expansion; child PTN002768047 (13 leaves) is a protostome clade holding fly scny. Seed Q0WX57 is
      human USP17L30 (subfamily SF651), which joins the USP36 lineage at PTN002767976 (114 leaves). The
      USP36 ortholog clade PTN002767977 (20 leaves) has no seed. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002541928
    evidence_checked:
    - >-
      QuickGO for every leaf under the node (term and descendants). Fly scny (Q9VRP5) involved_in GO:0042981
      IMP PMID:19217892 (FlyBase). Human USP17L30 (Q0WX57) involved_in GO:1904037 IMP PMID:17109758
      (UniProt); USP17L6P (Q6QN14) has a NOT on GO:1904035 from the same paper.
    - >-
      PubMed abstracts. PMID:19217892 (https://doi.org/10.1016/j.ydbio.2009.02.005) reports apoptosis with
      reduced DIAP1 in loss-of-function mutants and infers a role from the deubiquitinase domain.
      PMID:17109758 (https://doi.org/10.1186/1471-2164-7-292) reports apoptosis on overexpression of USP17
      family members.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier text called Q0WX57 an Arabidopsis protein; it is human
      USP17L30. It also said the donors are not USP36 orthologs without placing them on the tree. Both seed
      rows are cell-death phenotypes of altered deubiquitinase dosage, read at abstract depth, so the PAINT
      request should be treated as a query on the two seed rows.
- gene_file: genes/human/CDK16/CDK16-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR24056
    ibd_node: PTN000623091
    tree_reading: >-
      IBD at the family root PTN000623091 (2533 leaves) with 80 seeds. CDK16 is in child PTN002373304 (204
      leaves), which holds CDK5, Pho85 and the PCTAIRE and PFTAIRE kinases. Inside that child the nuclear
      seeds are CDK5 of human, mouse and rat, yeast PHO85, fission yeast pef1 and Dictyostelium cdk5 (joining
      at PTN002373305, 186 leaves), Plasmodium CRK2, and mouse Cdk14 (joining at PTN001172734, 128 leaves).
      The PCTAIRE clade PTN000623763 (61 leaves) that holds CDK16 has no nuclear seed, and the CDK16 group
      node PTN004656776 (17 leaves) carries IBDs for synaptic vesicle and exocytosis instead.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under PTN002373304 with the exact term. 8 leaves carry experimental nucleus rows;
      none is a PCTAIRE kinase.
    - >-
      QuickGO for CDK16 (Q00536), all non-electronic rows. Locations are cytoplasm IDA PMID:22798068, cytosol
      and plasma membrane IDA (HPA), plasma membrane IDA and EXP PMID:19524571 and PMID:22184064, and
      cytoplasmic side of plasma membrane IDA PMID:22184064. No nucleus row.
    review_edited: false
    notes: >-
      The call holds on evidence about the PCTAIRE subfamily. CDK16 is cytoplasmic and is recruited to the
      plasma membrane by membrane-anchored cyclin Y, and no PCTAIRE member is a nuclear seed. The existing
      reason says this and attributes the nuclear seeds to other branches, which the tree confirms. No loss
      is shown, so no PAINT change is requested; a fractionation or imaging study of endogenous CDK16 with
      and without cyclin Y would settle it.
- gene_file: genes/human/SLC22A17/SLC22A17-ai-review.yaml
  rows:
  - go_id: GO:0022857
    go_label: transmembrane transporter activity
    family: PTHR24064
    ibd_node: PTN008392514
    tree_reading: >-
      IBD at the family root PTN008392514 (1824 leaves) with 55 seeds from animals, plants, fungi and
      bacteria. SLC22A17 is in child PTN002781848 (1820 leaves). Its own clade PTN008392667 (17 leaves) carries
      an IBD for siderophore transport seeded by mouse Slc22a17, and the enclosing clade PTN009078772 (62
      leaves) has no experimental transporter activity row on any leaf.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under PTN009078772 (term and descendants). 115 rows returned, none experimental.
      The same query shape returned experimental rows for other families in this batch.
    - >-
      QuickGO for the SLC22A17 clade and GO:0015891. Mouse Slc22a17 (Q9D9E0) involved_in IMP PMID:16377569.
    - >-
      interpro/panther/PTHR24064/PTHR24064-review.yaml scopes GO:0022857 as FAMILY_WIDE and true of every
      characterized member.
    review_edited: false
    notes: >-
      Upheld on the existing reason. SLC22A17 is characterized as the lipocalin-2 endocytic receptor, no
      solute it carries across the membrane is known, and its 62-leaf neighbourhood has no transporter seed.
      That is doubt, not loss, so no PAINT change is requested. The family review's FAMILY_WIDE scope is
      about characterized transporters and does not conflict, but it could note this receptor branch. A
      transport assay of SLC22A17 with candidate organic cations would settle it. The IEA and TAS rows on
      the same term carry the same action.
- gene_file: genes/human/RHOJ__Q9H4E5/RHOJ__Q9H4E5-ai-review.yaml
  rows:
  - go_id: GO:0006897
    go_label: endocytosis
    family: PTHR24072
    ibd_node: PTN008604842
    tree_reading: >-
      IBD at PTN008604842 (184 leaves) with 3 seeds, all Cdc42. Child PTN001178183 (169 leaves) holds RHOJ and
      the metazoan Cdc42 group; child PTN001177978 (15 leaves) is fungal Cdc42. Mouse and human CDC42 join
      the RHOJ lineage at PTN004661971 (86 leaves) and fly Cdc42 at PTN000632905 (102 leaves). No RHOJ or
      RHOQ leaf is a seed. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under the node (term and descendants). Mouse Cdc42 (P60766)
      acts_upstream_of_or_within GO:0006897 IMP PMID:24792215; human CDC42 (P60953) GO:0006911 IMP
      PMID:26465210; fly Cdc42 (P40793) GO:0006909 IMP PMID:22634526. Two of the three are phagocytosis rows.
    - >-
      publications/PMID_12960428.md (full text cached). TCL knockdown leaves transferrin internalization
      unaffected and blocks passage from Rab5-positive vesicles to early endosomes.
    review_edited: false
    notes: >-
      The existing reason is node-aware and rests on a direct experiment on the target showing the uptake step
      is intact and the defect is after internalization. That is evidence the function is partly diverged,
      so the over-annotation call stands.
- gene_file: genes/human/RAB1B/RAB1B-ai-review.yaml
  rows:
  - go_id: GO:0012505
    go_label: endomembrane system
    family: PTHR24073
    ibd_node: PTN001292747
    tree_reading: >-
      IBD at the Rab family root PTN001292747 (1950 leaves) with 81 seeds. RAB1B is inside it, below the
      Rab1 group nodes that carry IBDs for Golgi apparatus and endoplasmic reticulum (PTN000634320, 140
      leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: TOO_GENERAL
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      The RAB1B review itself. Golgi membrane, endoplasmic reticulum membrane and endoplasmic reticulum-Golgi
      intermediate compartment membrane rows are ACCEPT; Golgi apparatus and endoplasmic reticulum are
      KEEP_AS_NON_CORE.
    review_edited: true
    notes: >-
      The earlier reason said the term is true and the transfer valid, and objected only that it is
      uninformative. That is TOO_GENERAL, not over-annotation. No other row on this term.
  - go_id: GO:0043025
    go_label: neuronal cell body
    family: PTHR24073
    ibd_node: PTN001178334
    tree_reading: >-
      IBD at PTN001178334 (59 leaves), the Rab1 group, with 2 seeds listed (fly RabX6, rat Rab1a). Child
      PTN000634936 (56 leaves) holds RAB1B and all the experimental rows. Rat Rab1a joins the RAB1B lineage at
      the vertebrate node PTN002785366 (38 leaves); fly RabX6 and fly Rab1 join at PTN000634936. No loss
      recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO for every leaf under the node. Rat Rab1A (Q6NYB7) located_in IDA PMID:8573789 (RGD); fly RabX6
      (M9PE35) located_in IDA PMID:22844416; fly Rab1 (O18332) located_in HDA PMID:22000105.
    - >-
      PubMed abstract PMID:8573789 (https://doi.org/10.1091/mbc.6.10.1315). In cultured rat hippocampal
      neurons rab1 and other intermediate compartment markers were found predominantly in the cell body.
    review_edited: true
    notes: >-
      The earlier objection was to the is_active_in qualifier for a cell-type location. The seed study places
      Rab1 with the early secretory compartments of the neuron, which are in the cell body, so the qualifier
      fits what Rab1 does. The target is inside the seeded clade and nothing argues against it, so the row is
      kept as non-core. Abstract only for the rat seed; the fly seed papers were not read.
- gene_file: genes/human/DNAJB13/DNAJB13-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR24078
    ibd_node: PTN001180662
    tree_reading: >-
