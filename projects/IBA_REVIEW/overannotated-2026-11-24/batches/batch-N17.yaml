- gene_file: genes/DROME/Moe/Moe-ai-review.yaml
  rows:
  - go_id: GO:1902966
    go_label: positive regulation of protein localization to early endosome
    family: PTHR23281
    ibd_node: PTN001150648
    tree_reading: &moe_tree >-
      IBD at PTN001150648 (136 leaves, 35 species) with three seeds, human RDX (P35241), EZR (P15311) and
      MSN (P26038). Children are PTN000589933 (132 leaves, ERM plus Merlin, target here) and PTN001150720
      (4 Monosiga leaves). Inside PTN000589933 the ERM clade is PTN008596478 (91 leaves), which holds all
      three seeds and fly Moe (leaf PTN000590083, in the protostome group PTN002760686, 12 leaves). Merlin
      is in the sister clade PTN001150649 (per batch H11). No loss recorded for the term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:1902966. RDX, EZR and MSN each have involved_in IGI PMID:21148287 (UniProt), with the other
      two ERM proteins as partners.
    - >-
      publications/PMID_21148287.md (full text cached). ERM proteins bind the HOPS subunit Vps11, and
      depleting ERM proteins or HOPS makes EGFR accumulate in early endosomes and delays Rab7 recruitment.
    - >-
      The human EZR, MSN and RDX reviews ACCEPT this term on their IBA and IGI rows. The family review
      PTHR23281 assesses the node NEEDS_PRUNING for Merlin only.
    - >-
      The row's earlier quote from PMID:25065756 (phospho-Moe is regulated by endocytosis), which concerns
      regulation of Moe and does not test this function.
    review_edited: true
    notes: >-
      The earlier reason was that there is no Drosophila evidence and that the role is mammalian-specific.
      Neither is a ground. The seeds are sound, Moe is the single fly co-ortholog of all three seeds inside
      the seeded ERM clade, and nothing on Moe argues against the role. Moved to KEEP_AS_NON_CORE, since
      endosome maturation is peripheral to the cortical linker function. The quote from PMID:25065756 was
      taken off the row and a quote from the seed paper put in its place, with PMID:21148287 added to the
      references list. Batch H11 upheld the same term on human NF2 as too deep for the Merlin clade, which
      is consistent, because Moe is on the ERM side.
  - go_id: GO:2000643
    go_label: positive regulation of early endosome to late endosome transport
    family: PTHR23281
    ibd_node: PTN001150648
    tree_reading: *moe_tree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:2000643. EZR has involved_in IMP and IGI, RDX and MSN IGI, all PMID:21148287 (UniProt).
    - publications/PMID_21148287.md, as for GO:1902966.
    review_edited: true
    notes: Same seeds, same paper and same change as GO:1902966.
- gene_file: genes/DROME/crb/crb-ai-review.yaml
  rows:
  - go_id: GO:0005112
    go_label: Notch binding
    family: PTHR24044
    ibd_node: PTN002371879
    tree_reading: >-
      IBD at PTN002371879 (415 of 426 leaves, 34 species) with 17 seeds. The node has nine children. The
      Delta, Serrate and Jagged ligands (human DLL1, DLL4, JAG1, JAG2, fly Dl and Ser) are all in
      PTN009076542 (132 leaves); NOTCH2NLB is in PTN009076580 (134 leaves). The target is in PTN009076609
