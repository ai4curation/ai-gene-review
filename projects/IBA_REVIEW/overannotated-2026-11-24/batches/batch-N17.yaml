genes:
- gene_file: genes/DROME/Datp/Datp-ai-review.yaml
  rows:
  - go_id: GO:0006167
    go_label: AMP biosynthetic process
    family: PTHR21340
    ibd_node: PTN000482012
    tree_reading: &datp_tree >-
      IBD at the family root PTN000482012 (55 leaves, 47 species) with one seed, worm ndx-4
      (WB:WBGene00003581, Q9U2M7). The root has two children. PTN001084988 (40 leaves, eukaryotes and
      archaea) holds the seed, human NUDT2 and the target (leaf PTN000482053); PTN000482056 (15 bacterial
      leaves) holds no seed. No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &datp_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN000482012
    evidence_checked:
    - >-
      QuickGO Q9U2M7 x GO:0006167 returns involved_in IDA PMID:11738085 and PMID:12475970 (WB) plus the IBA.
      The seed rows are in vitro hydrolase assays in which AMP and ATP are the products of Ap4A cleavage.
    - >-
      interpro/panther/PTHR21340/PTHR21340-review.yaml assesses the node WRONG_NODE for this term and asks
      for the IBD to be withdrawn or replaced by diadenosine tetraphosphate catabolic process.
    review_edited: false
    notes: >-
      Same call as human NUDT2 (batch H10) and mouse Nudt2 (batch N01). A reaction product read as a
      biosynthetic process. The row names the node, the single seed and why the seed does not show
      participation. Left as written.
  - go_id: GO:0006754
    go_label: ATP biosynthetic process
    family: PTHR21340
    ibd_node: PTN000482012
    tree_reading: *datp_tree
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *datp_fix
    evidence_checked:
    - >-
      QuickGO Q9U2M7 x GO:0006754 returns involved_in IDA PMID:11738085 and PMID:12475970 (WB) plus the IBA.
    - The family review assesses the node WRONG_NODE for this term on the same reasoning.
    review_edited: false
    notes: >-
      Same seed, same papers and same reading as the AMP row. ATP released from a micromolar dinucleotide
      pool is a product of catabolism. Left as written.
- gene_file: genes/DROME/RluA-1/RluA-1-ai-review.yaml
  rows:
  - go_id: GO:0000455
    go_label: enzyme-directed rRNA pseudouridine synthesis
    family: PTHR21600
    ibd_node: PTN002727951
    tree_reading: >-
      IBD at the family root PTN002727951 (701 leaves) with eight seeds. The root has four children,
      PTN008577970 (584 leaves, target here), PTN000492312 (44 leaves, holds E. coli RluE P75966),
      PTN004550285 (18 leaves, holds E. coli RsuA P0AA43) and PTN008578041 (55 leaves, RPUSD3 and RPUSD4,
      no seed listed). The target leaf PTN000046932 sits in a fly-only pair PTN000046930 (2 leaves, RluA-1
      and RluA-2) inside the animal RPUSD2 clade PTN000824389 (34 leaves), whose sister under PTN000046898
      (53 leaves) is the fungal clade that holds yeast Pus9 (as read in batches H10 and N13). No loss
      recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008370768
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Yeast Pus9 Q12069 has involved_in IDA PMID:25219674 (UniProt); E. coli
      RluA P0AA37 has acts_upstream_of_or_within IMP PMID:10383384 (EcoCyc); fly RluA-1 Q9VKV0 has only the
      IBA.
    - >-
      Batch N13 read the cached full text of PMID:25219674 and found the only site it assigns to Pus9 is in
      mitochondrial tRNA; batch H10 read PMID:41136621, quoted on this row, for the statement that
      eukaryotic RPUSD2 has lost activity towards rRNA.
    - interpro/panther/PTHR21600/PTHR21600-review.yaml assesses the node TOO_DEEP for this term (per H10 and N13).
    review_edited: false
    notes: >-
      Consistent with yeast RIB2 in batch N13. Human RPUSD2 was moved to REMOVE in batch H10 because knockout
      profiling of the human enzyme covered rRNA and found no site. Nothing comparable exists for the fly
      enzyme, whose substrates are unmapped and which belongs to a fly-specific duplicate pair, so the row
      stays an over-annotation. The move target PTN008370768 (RluA, RluC, RluD, 147 leaves) is taken from the
      N13 reading, with separate placements at PTN000492312, PTN004550285 and the Pus5 clade. If a curator
      accepts the human evidence as a loss on the whole animal RPUSD2 clade (ADD_IRD at PTN000824389, as
      asked in H10), this row becomes a removal. The existing reason names the node, the seed groups and
      the subfamily divergence. Left as written.
- gene_file: genes/DROME/AGO3/AGO3-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR22891
    ibd_node: PTN001875625
    tree_reading: >-
      IBD at PTN001875625 (951 leaves, 94 species) with 27 seeds, one node below the family root. Its
      children are PTN007716312 (123 leaves, the PIWI clade, target here) and PTN000527275 (828 leaves, the
      AGO clade). Inside the PIWI clade, AGO3 (leaf PTN001113306) is in PTN002740005 (17 leaves, with worm
      prg-1), which joins the vertebrate PIWIL clade PTN000527527 (73 leaves) at PTN000527526 (90 leaves).
      The seeds human PIWIL2, PIWIL3 and PIWIL4 and mouse Piwil2 and Piwil4 are in that 73-leaf sister
      clade. Fly Piwi, also a seed, is in the other branch PTN009055085 (6 leaves) and joins at PTN002339693
      (96 leaves). No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005634 with descendants. Fly Piwi Q9VKM1 has eleven is_active_in IDA rows (FlyBase); mouse
      Piwil4 Q8CGT6 has located_in IDA PMID:18922463 and four more; mouse Piwil2 Q8CDG1 has located_in IDA
      PMID:27856912 (MGI). AGO3 Q7PLK0 returns the IBA only.
    - >-
      The review's quote from PMID:22902557 (Aub and AGO3 localize to the cytoplasm and are enriched in
      perinuclear nuage) and the gene's seven experimental cytoplasm rows and sixteen P granule rows.
    - No family review exists for PTHR22891.
    review_edited: false
    notes: >-
      The node is seeded on both sides and in the target's own sister clade, so depth is not the ground. The
      ground is on the target. Every localization study of AGO3 places it in cytoplasm and nuage, and the
      nuclear arm of the fly pathway is carried by Piwi. A positive cytoplasmic location does not exclude a
      nuclear pool (the reading taken for worm wago-4 in the removal pass), so this is doubt and not loss.
      Showing that AGO3 is excluded from germline nuclei would justify a loss on the AGO3 clade
      PTN002740005 or lower. The reason is short, but it names the node, the seeds and the target ground.
      Left as written.
- gene_file: genes/DROME/aub/aub-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR22891
    ibd_node: PTN001875625
    tree_reading: >-
      IBD at PTN001875625 (951 leaves) with 27 seeds. Aub (leaf PTN000527625) is the sister leaf of fly Piwi
      (leaf PTN000527624) in the fly-only node PTN000527623 (2 leaves, 1 species), inside PTN009055085
      (6 leaves), which joins the AGO3 and vertebrate PIWIL branch at PTN002339693 (96 leaves) within the
      PIWI child clade PTN007716312 (123 leaves). Piwi (FB:FBgn0004872) is a seed. No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005634 with descendants. Piwi Q9VKM1 has eleven is_active_in IDA rows (FlyBase); Aub O76922
      returns the IBA only.
    - >-
      The review's quote from PMID:22902557 and the gene's thirteen experimental cytoplasm rows and its
      P granule rows.
    review_edited: true
    notes: >-
      Action unchanged. The source comment said Aub and Ago3 form a cytoplasmic sub-lineage, which misstates
      the tree. Aub's sister is Piwi, the nuclear seed, and AGO3 is in a different branch of the PIWI clade.
      The reason and comment were rewritten to say that the node is sound, that the nearest seed is the
      fly paralog, and that the doubt is whether Aub kept the nuclear location after the fly duplication.
      Nuclear exclusion of Aub in germline cells would justify a loss on the Aub leaf PTN000527625.
- gene_file: genes/DROME/tim/tim-ai-review.yaml
  rows:
  - go_id: GO:0003677
    go_label: DNA binding
    family: PTHR22940
    ibd_node: PTN000533813
    tree_reading: >-
      IBD at the family root PTN000533813 (116 leaves, 94 species) with one seed, fission yeast swi1
      (PomBase:SPBC216.06c, Q9UUM2). Children are PTN000533814 (64 leaves, opisthokonts, holds the seed and
      the target) and PTN007719621 (52 leaves, plants and protists, no seed). swi1 is in the fungal clade
      PTN001118094 (15 leaves) and joins the target lineage at PTN000533815 (62 leaves). Fly tim (leaf
      PTN000533820) is in the arthropod TIM clade PTN008585096 (14 leaves), which separates from the
      timeout and vertebrate TIMELESS clade PTN000533822 (30 leaves) at the animal duplication PTN008585095
      (44 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q9UUM2 x GO:0003677 with descendants returns enables IDA PMID:22952839 (DNA binding) and IDA
      PMID:20924116 (Y-form and double-stranded DNA binding), all PomBase.
    - >-
      The row's quotes, the UniProt curated function text that fly TIM does not appear to bind DNA and the
      gene's own tree analysis, read in the review.
    - The removal pass (rereview batch N04) upheld REMOVE on the four replication rows from the same node, with ADD_IRD at PTN008585096.
    review_edited: false
    notes: >-
      The seed is a sound biochemical assay and sits in the target's child clade, so the ground is the
      target. Fly tim is the circadian paralog on the far side of the animal duplication, its replication
      roles are judged lost, and the curated statement on DNA binding is hedged. That is doubt short of
      loss, which is what the reason says, with the node and the duplication named correctly. A direct
      DNA-binding assay on fly TIM would settle it and, if negative, the loss belongs on PTN008585096 with
      the replication terms.
- gene_file: genes/DROME/IKKbeta/IKKbeta-ai-review.yaml
  rows:
  - go_id: GO:0033209
    go_label: tumor necrosis factor-mediated signaling pathway
    family: PTHR22969
    ibd_node: PTN000540281
    tree_reading: >-
      IBD at PTN000540281 (52 leaves, 28 species) with three seeds, human IKBKB (O14920), human CHUK (O15111)
      and mouse Chuk (MGI:MGI:1338071). The node has two children. PTN002743414 (43 leaves, deuterostome
      IKK-alpha and IKK-beta) holds all three seeds. PTN002743432 (9 leaves, 6 species, protostomes) holds
      the target (leaf PTN000540336) and no seed. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002743414
    evidence_checked:
    - >-
      QuickGO GO:0033209 with descendants. IKBKB O14920 has involved_in IMP PMID:12656673, PMID:15084260 and
      PMID:25816133; CHUK O15111 has IMP PMID:12656673; mouse Chuk Q60680 has TAS PMID:30755793 (MGI). Fly
      IKKbeta Q9VEZ5 returns the IBA only.
    - interpro/panther/PTHR22969/PTHR22969-review.yaml has no node assessment for this term.
    review_edited: false
    notes: >-
      All seeds are in the sister child clade and the biology gives reason to doubt the transfer. Fly
      IKKbeta is the kinase of the Imd pathway acting on Relish, and the fly TNF Eiger signals mainly
      through JNK. That is not evidence that IKKbeta is excluded from Eiger signaling, so the row is an
      over-annotation and not a removal. The source comment names the node and the vertebrate seeds. Left
      as written.
- gene_file: genes/DROME/dlg1/dlg1-ai-review.yaml
  rows:
  - go_id: GO:0098609
    go_label: cell-cell adhesion
    family: PTHR23119
    ibd_node: PTN001136892
    tree_reading: >-
      IBD at PTN001136892 (176 leaves, 35 species) with two seeds, human DLG1 (Q12959) and human SCRIB
      (Q14160). Children are PTN000563692 (173 leaves, holds both seeds and the target) and PTN001136957
      (3 Monosiga leaves). Human DLG1 is in PTN000563570 (80 leaves) and joins the fly dlg1 lineage (leaf
      PTN000563694, in PTN002750690, 15 leaves) at the DLG node PTN000563569 (95 leaves). SCRIB is in
      PTN002508426 (75 leaves) and joins at PTN000563692. No loss recorded for the term.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0098609 with descendants. DLG1 Q12959 has involved_in IDA PMID:14699157 (UniProt); SCRIB
      Q14160 has involved_in IGI PMID:16344308 (UniProt); fly dlg1 P31007 returns the IBA only.
    - >-
      publications/PMID_14699157.md (abstract only). hDlg co-localizes and associates with E-cadherin, and
      RNAi against hDlg alters adherens junction integrity. The abstract concludes that hDlg may be a
      determinant in E-cadherin-mediated adhesion.
    - >-
      The row's quotes from PMID:9144922 (dlg loss removes septate junctions and gives what appear to be
      ectopic adherens junctions) and PMID:9390515 (Dlg controls localization of Fas2).
    - No family review exists for PTHR23119.
    review_edited: false
    notes: >-
      The node is seeded on the target's own branch (human DLG1 is the DLG-clade seed), so depth is not the
      ground. The DLG1 seed could be read as a knockdown phenotype taken for participation, but only the
      abstract was read, so no seed overreach is claimed. The ground kept is on the target. In dlg mutant
      discs cells stay attached through ectopic adherens-like junctions, and what Dlg is shown to do is
      organize septate junctions and localize the adhesion molecule Fas2, roles the review keeps under
      septate junction assembly and the localization terms. A close call. A cell aggregation or
      junctional adhesion assay in dlg mutant tissue would settle whether the row should be kept as
      non-core instead. The reason states the target evidence and the comment names the node and seeds.
      Left as written.
- gene_file: genes/DROME/mod/mod-ai-review.yaml
  rows:
  - go_id: GO:0000381
    go_label: regulation of alternative mRNA splicing, via spliceosome
    family: PTHR23147
    ibd_node: PTN009063129
    tree_reading: &mod_tree >-
      PTHR23147 has 1449 leaves. Modulo (P13469, leaf PTN002512498, subfamily SF22) is placed in a fly-only
      node PTN008591610 (3 leaves, with SC35 Q9V3T8 and maca Q9VF55) inside the SRSF2 clade PTN000567448
      (43 leaves, human SRSF2 in its 30-leaf side PTN000567449), within PTN009063180 (165 leaves), one of
      eight children of PTN000567445 (1447 leaves). The splicing IBD is at the root PTN009063129 with 11
      seeds, among them fly SC35 (FB:FBgn0265298), human SRSF6 (child PTN002751717), RBM4 (child
      PTN008591723) and SRSF12 (child PTN000567446). The nuclear speck IBD is at PTN000567445 with 30
      seeds, among them fly SC35 and human SRSF2 (Q01130) in the target's own child clade. PAINT records
      NOT IRD for both terms at PTN001924395 (93 leaves, the RBM19 and Mrd1 clade).
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0000381 with descendants. Fly SC35 Q9V3T8 and human SRSF2 Q01130 now return only the IBA,
      so the experimental row behind the SC35 seed was not found; Modulo P13469 returns the IBA only.
    - >-
      PANTHER gene lookup for P13469 returns family PTHR23147 and subfamily SF22 (serine/arginine-rich
      splicing factor 2), confirming the tree placement. genes/DROME/mod/mod-uniprot.txt cross-references
      PTHR24012 instead.
    - No family review exists for PTHR23147.
    review_edited: true
    notes: >-
      Action unchanged. The earlier reason said the transfer rested only on shared RRM ancestry within a very
      large family and that Modulo belongs to a nucleolin-like lineage. On the tree PAINT uses, Modulo is
      one of three fly leaves with SC35, inside the SRSF2 clade, so by the tree it is in a seeded clade.
      The reason and source comment were rewritten to say so and to put the doubt where it belongs. Modulo
      has four RRMs, an acidic N-terminus and no RS domain, UniProt assigns it to another PANTHER family,
      and no study reports a splicing role. The placement of a 542-residue nucleolin-like protein beside
      the 195-residue class SR protein SC35 deserves a look by PANTHER. If it is an artefact, the fix is a
      loss on the Modulo leaf PTN002512498 for the SR-protein terms. A splicing readout in mod mutants
      would settle the biology.
  - go_id: GO:0016607
    go_label: nuclear speck
    family: PTHR23147
    ibd_node: PTN000567445
    tree_reading: *mod_tree
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0016607 with descendants. Human SRSF2 Q01130 has located_in IDA PMID:12799190 (UniProt) and
      three MGI IDA rows; fly SC35 Q9V3T8 returns only the IBA; Modulo P13469 returns the IBA only.
    - >-
      The row's quotes from PMID:9718368 and PMID:23028777, which place Modulo at the nucleolus and on
      chromatin.
    review_edited: true
    notes: >-
      Action unchanged. Reason and comment rewritten to state that Modulo sits next to the seed SC35 in the
      tree, so the node is not the problem, and that the ground is the target. The localization studies
      report nucleolus and chromatin and no speckle pattern, without a speckle marker, which is doubt and
      not exclusion. Co-staining Modulo with a speckle marker would settle it.
- gene_file: genes/DROME/NT1/NT1-ai-review.yaml
  rows:
  - go_id: GO:0021556
    go_label: central nervous system formation
    family: PTHR23199
    ibd_node: PTN002354018
    tree_reading: &spz_tree >-
      IBD at PTN002354018 (83 leaves, 5 arthropod species) with two seeds, fly NT1 (FB:FBgn0261526, B7TB45)
      and fly spz5 (FB:FBgn0035379, Q9VZX1). The node has four children. Both seeds are in PTN001506121
      (63 leaves), spz5 at leaf PTN000574503 and NT1 at leaf PTN001292307 with spz inside PTN001143247
      (54 leaves). The other children, PTN002354071 (5 leaves, spz6), PTN008593060 (2 leaves) and
      PTN004616822 (13 leaves, spz3 and spz4), hold no seed. The treeview flag says the target is not a
      seed because the seeds are listed by FlyBase id; each target is one of the two seeds. No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &spz_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN002354018
    evidence_checked:
    - >-
      QuickGO B7TB45 x GO:0021556 returns involved_in IMP PMID:19018662 (FlyBase) plus the IBA. The
      FlyBase id FBgn0261526 is NT1 in genes/DROME/NT1/NT1-uniprot.txt.
    - >-
      publications/PMID_19018662.md is full text. The review quotes it for DNT1 null embryos having wild
      type apoptosis levels and no axon guidance defects at stages 13 and 14, and for no massive CNS
      neuronal death on loss of DNT1, spz, Toll or DNT2.
    - No family review exists for PTHR23199 (paint table only).
    review_edited: false
    notes: >-
      The gene is its own seed and the review marks the IMP seed row over-annotated on the same reading, so
      the two rows are consistent. The seed is a mutant phenotype (late neuronal apoptosis, motor axon
      misrouting) curated to formation of the CNS, which forms in the mutants. The row names the node, the
      seeds and the paper. Left as written. The seed rows are FlyBase IMP annotations and the review
      already treats them as over-annotations and not as errors.
- gene_file: genes/DROME/spz5/spz5-ai-review.yaml
  rows:
  - go_id: GO:0021556
    go_label: central nervous system formation
    family: PTHR23199
    ibd_node: PTN002354018
    tree_reading: *spz_tree
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *spz_fix
    evidence_checked:
    - QuickGO Q9VZX1 x GO:0021556 returns involved_in IMP PMID:19018662 (FlyBase) plus the IBA.
    - >-
      The review's quotes from the full text of PMID:19018662 (some DNT2 mutant embryos with abnormal
      morphology and CNS defects, mild projection defects, no massive CNS neuronal death).
    review_edited: false
    notes: >-
      Same reading as NT1. spz5 (DNT2) is its own seed and its IMP row carries the same action. The DNT2
      phenotype is a little stronger than the DNT1 one, with a minority of embryos showing CNS defects, but
