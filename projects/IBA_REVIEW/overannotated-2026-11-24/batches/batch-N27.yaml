      IBD at the family root PTN000132136 (419 leaves) with two seeds, S. cerevisiae ATG21 (SGD:S000006021,
      leaf PTN000132226) and Drosophila Atg18a (FB:FBgn0035850, leaf PTN000132220). Root children are
      PTN000132137 (144 leaves, holding the target and both seeds) and PTN000132247 (275 leaves, the WDR45 and
      Hsv2 side, no seed). Candida ATG18 (leaf PTN000881196) pairs with Candida ATG21 at PTN000881194 (2
      leaves, 1 species); that pair is sister to the S. cerevisiae and Eremothecium Atg18 and Atg21 group
      PTN000132224 (4 leaves) under PTN000881193 (6 leaves, 3 species), inside the fungal clade PTN000881190
      (20 leaves). It joins the fly seed at PTN000132139 (87 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0000422 with descendants. ATG21 Q02887 involved_in IMP PMID:19793921 (SGD). Fly Atg18a
      M9PER1 carries GO:0000423 mitophagy by IMP PMID:23873149 and PMID:30571977 and IDA PMID:40801807
      (FlyBase).
    - >-
      publications/PMID_19793921.md states that ATG20, 21 and 24 were also required for efficient mitophagy.
    - >-
      PubMed search for Candida albicans mitophagy with ATG18, ATG11 or ATG32 returned one paper on Atg11
      (PMID:31284951, abstract only); none tests Atg18 in mitophagy.
    - >-
      interpro/panther/PTHR11227/PTHR11227-review.yaml assesses the node as TOO_DEEP with REMOVE_IBD.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, consistent with S. cerevisiae ATG18 (batch N11) and S. pombe atg18
      (batch N19). The old reason said the root spans divergent paralogs and named an Atg21/Hsv2 branch that
      the tree does not show. The target is inside the seeded fungal clade and is the core PROPPIN of the
      macroautophagy machinery the review accepts. The PANTHER tree pairs the two Candida paralogs with each
      other and not with their S. cerevisiae namesakes, so it does not say which Candida gene is orthologous
      to which yeast gene; the calls here follow the gene names. The root placement is still too deep for
      PTN000132247 (see HSV2).
  - go_id: GO:0000425
    go_label: pexophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae ATG18 (SGD:S000001917,
      leaf PTN000132229), in the root child PTN000132137 (144 leaves). Candida ATG18 (leaf PTN000881196) is
      in the Candida pair PTN000881194, sister to the group PTN000132224 that holds the seed, under
      PTN000881193 (6 leaves). The other root child PTN000132247 (275 leaves) has no seed. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0000425 with descendants. ATG18 P43601 involved_in IMP PMID:11739783 (SGD) and the IBA.
    - >-
      publications/PMID_15155809.md (full text). Peroxisome degradation in atg21 deletion cells was similar to
      wild type, and atg21 cells are described as fully capable of degrading peroxisomes.
    - >-
      PubMed search for Candida albicans pexophagy returned six papers; the two that are cached and cited in
      the review (PMID:38132782 full text, PMID:37913846 abstract) do not test Atg18 in pexophagy.
    - The PTHR11227 family review assesses the node as TOO_DEEP and proposes MOVE_IBD to PTN000132229.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, as for S. pombe atg18 in batch N19. The seed is the budding yeast
      protein the target is named for and sits in the sister group of the Candida pair. The same-term IEA row
      (GO_REF:0000107, from S. cerevisiae ATG18) was changed to KEEP_AS_NON_CORE with it. The family review's
      move to the S. cerevisiae ATG18 leaf would take the term off this protein; a placement that keeps Atg18
      orthologs and excludes Atg21 cannot be drawn on this tree, because the Candida pair is resolved as a
      Candida-specific duplication. Reconciliation: One fix is now named for pexophagy on this node across
      batches N11, N19, N27 and N28: move the IBD from the root to the Atg18, WIPI1 and WIPI2 node
      PTN000132139 and add a loss at the Atg21 node PTN000132225 (S. cerevisiae and Eremothecium Atg21, read
      from the cached tree). PTN000132139 is the smallest node that holds the S. cerevisiae Atg18 seed
      together with every member whose review keeps the term: fungal Atg18 orthologs under PTN000132222, worm
      atg-18 and human WIPI2, whose review cites knockout cells with blocked pexophagy. The move takes the
      term off the Hsv2 and WDR45 root child PTN000132247. The earlier target, the Atg18 leaf PTN000132229,
      would have removed the term from those kept members. The family review still names PTN000132229 and was
      not edited in this pass. The row stays KEEP_AS_NON_CORE and is inside the target node.
  - go_id: GO:0044804
    go_label: nucleophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with three seeds, S. cerevisiae ATG21
      (SGD:S000006021), HSV2 (SGD:S000003455) and ATG18 (SGD:S000001917). ATG18 and ATG21 are in the root
      child PTN000132137 (144 leaves), in the group PTN000132224 that is sister to the Candida pair
      PTN000881194 under PTN000881193 (6 leaves). HSV2 is in the other root child PTN000132247 (275 leaves).
      The root is seeded on both sides. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0044804 with descendants. ATG18 P43601 IMP PMID:22768199 for nucleophagy and IMP
      PMID:18701704 for GO:0034727; ATG21 Q02887 IMP PMID:18701704 for GO:0034727; HSV2 P50079 IMP
      PMID:18769150 for GO:0034727 (all SGD).
    - The PTHR11227 family review assesses the node as TOO_DEEP with REMOVE_IBD.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, as for S. pombe atg18 in batch N19. Seeds sit in both root children
      and two of them in the sister group of the Candida pair. The same-term IEA row (GO_REF:0000107) was
      changed to KEEP_AS_NON_CORE with it. The IEA row for the child term GO:0034727 piecemeal microautophagy
      of the nucleus was left MARK_AS_OVER_ANNOTATED; it is a narrower claim and not in this todo. Batch N15
      upheld the over-annotation for fly Atg18a on this node because the animal clade has no seed; that
      reason does not apply to a fungal Atg18.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a (FB:FBgn0035850, leaf
      PTN000132220), in the metazoan clade PTN000881175 (67 leaves). Candida ATG18 is in the sister fungal
      clade PTN000881190 (20 leaves), which has no seed for this term. The two join at PTN000132139
      (87 leaves), three nodes below the IBD. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by GO:0061723 with descendants. Fly Atg18a (M9PER1 and Q9VSF0) involved_in IMP PMID:24265594
      (FlyBase) is the only experimental row.
    - >-
      PubMed search for Candida albicans with glycophagy or glycogen autophagy returned no papers.
    - The PTHR11227 family review assesses the node as TOO_DEEP with REMOVE_IBD.
    review_edited: true
    notes: >-
      Upheld, reason rewritten to name the clades. This follows S. pombe atg18 (batch N19) and not S.
      cerevisiae ATG18 (batch N11, kept as non-core on budding yeast literature that has no counterpart in C.
      albicans). The move target is the one named in N19; N11 named PTN000132139, which would leave the term
      on fungal Atg18 proteins. If the coordinator prefers N11's node this row becomes KEEP_AS_NON_CORE.
      Reconciliation: One reading is now used for glycophagy on this node across batches N11, N19, N27 and
      N28: the IBA-level fix is to move the IBD from the root to the Atg18, WIPI1 and WIPI2 node PTN000132139,
      as batch N11 named. The single fly seed is a requirement for the core autophagy machinery, the fungal
      Atg18 proteins are the orthologs of that seed inside PTN000132139, and nothing on them argues against
      the role, so the absence of a glycogen autophagy study in a given fungus is not a ground. The narrower
      target PTN000881175 (the metazoan clade) is withdrawn because it would take the term off S. cerevisiae
      ATG18, which is kept, and a kept row and a fix that removes it cannot both stand. The row moves from
      MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE by descent from the target node, as the original note
      anticipated, and the gene review was edited to match.
