- gene_file: genes/HORSE/CADM1/CADM1-ai-review.yaml
  rows:
  - go_id: GO:0051606
    go_label: detection of stimulus
    family: PTHR45889
    ibd_node: PTN002913382
    tree_reading: >-
      IBD at PTN002913382 (26 leaves, 20 species), the vertebrate CADM1 node, with 2 seeds, human CADM1
      (Q9BY67) and mouse Cadm1 (MGI:MGI:1889272). Children are PTN008700081 (20 tetrapod leaves, holding
      both seeds and the horse leaf PTN009188440) and PTN002913388 (6 fish leaves). The target is not a seed.
      No loss recorded for the term.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002913382
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human CADM1 Q9BY67 and mouse Cadm1 Q8R5M8 each carry involved_in IDA
      PMID:15811952 (UniProt) for GO:0051606, plus ISS, ISO and IEA copies of each other.
    - >-
      The review quotes PMID:15811952 (NK cells and CD8+ T cells recognize Necl-2 through CRTAM), validated in
      the supported_by block. CADM1 is the ligand that is detected; the CRTAM-bearing lymphocyte detects.
    - No family review file for PTHR45889.
    review_edited: false
    notes: >-
      Same call as human CADM1 in batch H16. Placement is tight and the horse protein is inside the seeded
      tetrapod clade, so the over-reach is in the two seed rows, where the detected ligand was annotated to
      the detecting process. The reason and propagation_review already say this and name the node. File left
      alone.
- gene_file: genes/CANAL/IDI1/IDI1-ai-review.yaml
  rows:
  - go_id: GO:0009240
    go_label: isopentenyl diphosphate biosynthetic process
    family: PTHR10885
    ibd_node: PTN000853999
    tree_reading: >-
      IBD at PTN000853999 (169 of 181 leaves) with one seed, Arabidopsis IPP1 (AGI_LocusCode:AT5G16440,
      Q38929, leaf PTN001329577), in the plant and protist clade PTN007468838 (88 leaves). Candida IDI1 (leaf
      PTN002587483) is in the opisthokont clade PTN000094422 (64 leaves). The two join at PTN000094420
      (154 leaves), three nodes below the IBD. The node's other child is a 2-leaf archaeal clade
      PTN002587496. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN007468838
    evidence_checked:
    - >-
      QuickGO Q38929 with GO:0009240 returns one experimental row, acts_upstream_of_or_within IMP
      PMID:18319397 (TAIR), and the IBA.
    - >-
      interpro/panther/PTHR10885/PTHR10885-review.yaml exists; batches H03, N10 and N19 judged human IDI1 and
      IDI2, yeast IDI1 and S. pombe idi1 on the same node.
    review_edited: false
    notes: >-
      Same call and same move as batches H03, N10 and N19. In the mevalonate pathway isopentenyl diphosphate
      is the substrate of the isomerase, made by the diphosphomevalonate decarboxylase, so the term fits the
      plastid context of the single plant seed and not the fungal enzyme. The summary and propagation comment
      name the node, the seed and the pathway argument. File left alone.
