genes:
- gene_file: genes/worm/ndx-4/ndx-4-ai-review.yaml
  rows:
  - go_id: GO:0006167
    go_label: AMP biosynthetic process
    family: PTHR21340
    ibd_node: PTN000482012
    tree_reading: &ndx4_tree >-
      IBD at the family root PTN000482012 (55 leaves) with one seed, WB:WBGene00003581, which is ndx-4
      itself (Q9U2M7, leaf PTN000482050; treeview does not flag it because the seed is listed by its
      WormBase id). The leaf sits in PTN002724443 (6 leaves) inside the child clade PTN001084988 (40 leaves,
      eukaryotes and archaea). The root's other child PTN000482056 (15 bacterial leaves) has no seed. The
      root also carries the Ap4A hydrolase activity IBD (three seeds). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &ndx4_fix
      paint_action: REMOVE_IBD
      target_node_id: PTN000482012
    evidence_checked:
    - >-
      QuickGO by accession and GO id (Q9U2M7, P50583). ndx-4 carries involved_in IDA PMID:11738085 and
      PMID:12475970 (WB) on GO:0006167; human NUDT2 has no experimental row.
    - >-
      The review's quote from PMID:11738085 (Ap4A hydrolysis producing AMP and ATP as products) is the
      seed evidence, an in vitro hydrolase assay. The review marks the two IDA rows on the same term
      MARK_AS_OVER_ANNOTATED as well, so the rows are consistent.
    - Family review PTHR21340 and batches H10 (human NUDT2) and N01 (mouse Nudt2) reach the same reading.
    review_edited: false
    notes: >-
      The target is its own seed, which is not a ground by itself. The ground is that the seed rows read
      the product of a catabolic reaction as participation in AMP biosynthesis. The reason says this and
      names the node and the seed. Left as written.
  - go_id: GO:0006754
    go_label: ATP biosynthetic process
    family: PTHR21340
    ibd_node: PTN000482012
    tree_reading: *ndx4_tree
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *ndx4_fix
    evidence_checked:
    - >-
      Same node and seed as the AMP row. The review's own IDA rows on GO:0006754 (PMID:11738085,
      PMID:12475970) are MARK_AS_OVER_ANNOTATED; the quote from PMID:11738085 is unchanged.
    review_edited: false
    notes: Same reading as the AMP row; ATP is the other product of the same cleavage.
- gene_file: genes/worm/anc-1/anc-1-ai-review.yaml
  rows:
  - go_id: GO:0019894
    go_label: kinesin binding
    family: PTHR21524
    ibd_node: PTN002726706
    tree_reading: >-
      IBD at PTN002726706 (15 leaves; the family root PTN009047163 has 19) with one seed, fly klar
      (FB:FBgn0001316, Q9Y0E4, leaf PTN000488208). The node has two children. PTN000747784 (8 leaves,
      vertebrate SYNE2) has no seed. PTN001470247 (7 leaves) holds both the seed and the target; inside it
      klar sits in the arthropod clade PTN002502263 (4 leaves) and anc-1 (leaf PTN000748218) in the nematode
      clade PTN007694783 (3 leaves). No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002502263
    evidence_checked:
    - >-
      QuickGO GO:0019894 with descendants for Q9Y0E4 and Q9N4M4. klar enables IDA PMID:25049271 (FlyBase);
      anc-1 has only the IBA.
    - >-
      publications/PMID_25049271.md is cached with full text. The review's quote (no Klar and Khc
      coprecipitation in alleles lacking the alpha and beta isoforms) is from it and is unchanged.
    - No family review exists for PTHR21524.
    review_edited: false
    notes: >-
      The seed is a coimmunoprecipitation from ovary lysate tied to particular Klar isoforms. The family
      is built on the short KASH region, and the review argues that ANC-1 anchors nuclei without a
      demonstrated motor requirement while kinesin-1 is recruited to worm nuclei by UNC-83. That is doubt on
      the target short of loss. The reason and propagation_review name the node, the seed and the fact
      that ANC-1 is inside the family, so the file was left alone. A move to the arthropod clade is the
      conservative request; vertebrate nesprin-2 is reported in the literature to bind kinesin light
      chain, which was not checked here and would be an argument for PAINT to seed the vertebrate clade
      separately.
- gene_file: genes/worm/ric-3/ric-3-ai-review.yaml
  rows:
  - go_id: GO:0043005
    go_label: neuron projection
    family: PTHR21723
    ibd_node: PTN000496889
    tree_reading: >-
      IBD at the family root PTN000496889 (42 leaves) with one seed, WB:WBGene00004363, which is ric-3
      itself (Q22472, leaf PTN000496914; listed by WormBase id). The target sits in the protostome child
      clade PTN002331045 (10 leaves); the other child PTN001857449 (32 leaves, deuterostome RIC3 and
      CCDC107) has no seed. The root also carries endoplasmic reticulum (one seed) and protein folding
      chaperone (two seeds). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000496889
    evidence_checked:
    - >-
      The review's own IDA row on GO:0043005 (PMID:11867529, located_in) is the seed. Its quote says weak
      GFP fluorescence is also seen in neuronal processes; the same paper puts the protein mainly in cell
      bodies, and PMID:19899809 is quoted for ER residence.
    - No family review exists for PTHR21723.
    review_edited: false
    notes: >-
      Pattern 21. The seed is a located_in observation of weak signal in processes and the IBA turns it
      into is_active_in for the whole family, vertebrate RIC3 and CCDC107 included. The review keeps the
      located_in IDA as non-core and marks only the is_active_in IBA over-annotated, and says why. The
      reason is tree-aware (own seed, family node). Left as written.
