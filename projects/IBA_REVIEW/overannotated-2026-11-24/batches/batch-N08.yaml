- gene_file: genes/worm/rrf-1/rrf-1-ai-review.yaml
  rows:
  - go_id: GO:0031380
    go_label: nuclear RNA-directed RNA polymerase complex
    family: PTHR23079
    ibd_node: PTN000554964
    tree_reading: >-
      IBD at the family root PTN000554964 (328 leaves) with one seed, fission yeast rdp1
      (PomBase:SPAC6F12.09, O14227, leaf PTN000554987) in the fungal clade PTN001130746 (22 leaves). It
      joins the target lineage at PTN000554966 (46 leaves); rrf-1 (leaf PTN000554974) is in the animal
      clade PTN001130721 (24 leaves) with ego-1, rrf-2 and rrf-3. The root's other child PTN007731923
      (276 leaves, plants and protists) has no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001130746
    evidence_checked:
    - >-
      QuickGO GO:0031380 with descendants for O14227, G5ECM1 and G5EBQ3. rdp1 part_of IDA PMID:15607976
      (PomBase); neither worm RdRP has an experimental row.
    - >-
      The review's quote from PMID:16271877 (only EGO-1 needed for H3K9me2 on unpaired meiotic DNA) and
      its IDA row for mutator focus (PMID:22713602) are the target-side evidence. Unchanged.
    - No family review exists for PTHR23079.
    review_edited: false
    notes: >-
      The seed is sound for the fission yeast RDRC. The node carries a nuclear, heterochromatin-linked
      complex to every eukaryotic RdRP from one fungal seed, and RRF-1's characterised complex is in
      cytoplasmic perinuclear foci. The evidence stops short of showing RRF-1 is absent from any nuclear
      complex, so this stays an over-annotation and not a removal. The propagation_review names the node
      and seed. Left as written.
- gene_file: genes/worm/sma-6/sma-6-ai-review.yaml
  rows:
  - go_id: GO:0007399
    go_label: nervous system development
    family: PTHR23255
    ibd_node: PTN000583887
    tree_reading: >-
      IBD at PTN000583887 (118 leaves; type I receptors and TGFBR2) with five seeds. The node has two
      children. PTN000583888 (103 leaves, deuterostome TGFBR1, TGFBR2, ACVR1B and relatives) holds the
      rodent seeds (MGI:98728 Tgfbr1, MGI:98729 Tgfbr2, RGD:621789). PTN002758359 (15 leaves, protostomes)
      holds the target and the two fly seeds; sma-6 (leaf PTN000584053) joins fly tkv (FB:FBgn0003716)
      and babo (FB:FBgn0011300) at PTN007744893 (13 leaves), and its nearest worm paralog daf-1 at
      PTN009067440 (5 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0007399 with descendants by accession. Fly babo A1Z7L8 IMP on axon guidance
      (PMID:17119021), neuron remodeling (PMID:12581521, PMID:21685919) and neuron development
      (PMID:16437159); fly tkv Q9VMT1 IMP on R8 cell fate specification (PMID:28853393); mouse Tgfbr2
      Q62312 IMP on brain development (PMID:12975342); mouse Tgfbr1 Q64729 IMP on a neuron fate term
      (PMID:15744664). sma-6 Q09488 has only the IBA.
    - >-
      The review's own IMP row from PMID:12679110 (ectopic ray cell contacts in sma-6 mutants, kept as
      non-core) records the DBL-1 pathway role in sensory ray identity.
    - No family review exists for PTHR23255.
    review_edited: true
    notes: >-
      The earlier reason rested on the absence of a shown nervous system role in the worm and named the
      family root PTN002758232 as the source node, which is not where the IBD sits. The node is seeded
      in both child clades, the two fly seeds are in the target's own protostome clade, and the worm
      pathway patterns sensory rays, so nothing argues against the term for SMA-6. It is broad and
      peripheral to body size control, hence non-core. Summary, reason and propagation_review rewritten;
      the PMID:11784045 quote kept verbatim and the PMID:12679110 quote copied verbatim from the review's
      own IMP row.
- gene_file: genes/worm/cdc-14/cdc-14-ai-review.yaml
  rows:
  - go_id: GO:0000226
    go_label: microtubule cytoskeleton organization
    family: PTHR23339
    ibd_node: PTN000596948
    tree_reading: >-
      IBD at PTN000596948 (105 leaves) with two seeds. Its children are PTN000596949 (84 leaves, animals
      and fungi, target here) and PTN007752835 (21 leaves, protists and plants, no seed). Inside
      PTN000596949 yeast CDC14 (SGD:S000001924, Q00684) sits in the fungal clade PTN001155263 (15 leaves)
      and the other seed is cdc-14 itself (WB:WBGene00000383, P81299, leaf PTN000597032) in the animal
      clade PTN001155233 (69 leaves). The two join at PTN000596949. No loss recorded.
    ground: BAD_SEED
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001155263
    evidence_checked:
    - >-
      QuickGO GO:0000226 with descendants by accession. cdc-14 P81299 IMP PMID:12213836 (UniProt, and WB
      on the child term GO:0051256); yeast CDC14 Q00684 IMP PMID:12737806 on GO:0051229 (SGD). Human
      CDC14A and CDC14B have no experimental row.
    - >-
      The review removes the worm IMP row on the same term, quoting PMID:21723944 (the cytokinesis
      lethality after cdc-14 RNAi was due to off-target effects; no evidence for a role in mitosis).
    - No family review exists for PTHR23339.
    review_edited: true
    notes: >-
      The only seed in the animal clade is the target's own RNAi row, which the review judges contradicted
      by null alleles and removes. Keeping the IBA as merely over-annotated contradicted that verdict on
      the same term. With the worm seed set aside the term rests on yeast CDC14 in the fungal clade, so the
      PAINT request is to move the IBD there, and the WB and UniProt IMP rows from PMID:12213836 are the
      seed to query. Summary, reason and propagation_review rewritten; quotes untouched.
  - go_id: GO:0007096
    go_label: regulation of exit from mitosis
    family: PTHR23339
    ibd_node: PTN000596948
    tree_reading: >-
      IBD at PTN000596948 (105 leaves) with three seeds, yeast CDC14 (Q00684), Candida CDC14 (Q59NH8)
      and fission yeast clp1 (Q9P7H1), all in the fungal clade PTN001155263 (15 leaves). cdc-14 (leaf
      PTN000597032) is in the animal clade PTN001155233 (69 leaves), which has no seed for the term; the
      two clades join at PTN000596949 (84 leaves). The node's other child PTN007752835 (21 leaves, protists
      and plants) has no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: &cdc14_fix
      paint_action: MOVE_IBD
      target_node_id: PTN001155263
    evidence_checked:
    - >-
      QuickGO GO:0007096 with descendants by accession. Yeast CDC14 IMP PMID:10219244 (SGD); Candida CDC14
      IMP PMID:16507592 (CGD); clp1 IGI, IMP and EXP on GO:0031536 (PomBase). No animal member queried
      (worm cdc-14, human CDC14A, CDC14B) has an experimental row.
    - The review's quote from PMID:21723944 (no evidence for a cdc-14 role in mitosis), unchanged.
    review_edited: false
    notes: >-
      All seeds are fungal and the IBD sits two nodes above them. The worm null alleles give target-side
      doubt but a missing null phenotype does not show the phosphatase takes no part, so this stays an
      over-annotation. The reason says the seeds are fungal, that cdc-14 is inside the node and what the
      target evidence is. Left as written.
  - go_id: GO:0032467
    go_label: positive regulation of cytokinesis
    family: PTHR23339
    ibd_node: PTN000596948
    tree_reading: >-
      Same node. Two seeds, yeast CDC14 (Q00684) and fission yeast clp1 (Q9P7H1), both in the fungal clade
      PTN001155263 (15 leaves); cdc-14 is in the animal clade PTN001155233 (69 leaves) with no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix: *cdc14_fix
    evidence_checked:
    - >-
      QuickGO GO:0032467 with descendants by accession. Yeast CDC14 IMP PMID:25371407 on the term and IMP,
      IGI PMID:26085509 on GO:1903501 (SGD); clp1 IMP PMID:15128870 and EXP PMID:29343550 on child terms
      (PomBase). No animal member queried has an experimental row.
    review_edited: false
    notes: Same reading as GO:0007096. Left as written.
- gene_file: genes/worm/unc-17/unc-17-ai-review.yaml
  rows:
  - go_id: GO:0015311
    go_label: monoamine:proton antiporter activity
    family: PTHR23506
    ibd_node: PTN001519357
    tree_reading: >-
      IBD at PTN001519357 (259 leaves) with eight seeds. Its children are PTN001921560 (256 leaves, target
      here) and PTN001921532 (3 archaeal leaves, no seed). The seeds lie in three branches of PTN001921560.
      Human SLC18A1 and SLC18A2, bovine SLC18A2 and the rodent VMAT genes are in the VMAT clade PTN000607052
      (93 leaves). Human SLC18B1 (Q6NT16) is in PTN008600153 (98 leaves). Human SLC18A3 (Q16572, VAChT)
      is in the deuterostome VAChT clade PTN000607169 (26 leaves), the sister of the protostome clade
      PTN002767250 (7 leaves) that holds unc-17 (leaf PTN002362800); the two join at the VAChT node
      PTN000607168 (33 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0015311 with descendants by accession. Human SLC18A3 Q16572 enables IDA PMID:25355561
      (UniProt); human SLC18B1 Q6NT16 IDA from the same paper; human SLC18A2 Q05940 IDA PMID:23363473,
      PMID:8643547, PMID:8860238; human SLC18A1 P54219 IDA PMID:8643547; bovine SLC18A2 Q27963 IDA
      PMID:8307150. unc-17 P34711 has only the IBA.
    - >-
      publications/PMID_25355561.md is cached with full text. It reports that purified VMAT2, VAChT and
      SLC18B1 reconstituted in proteoliposomes all took up serotonin; the sentence is quoted in the row.
    - >-
      genes/human/SLC18A3/SLC18A3-ai-review.yaml keeps both the IDA and the IBA on this term as
      KEEP_AS_NON_CORE.
    - No family review exists for PTHR23506.
    review_edited: true
    notes: >-
      The earlier reason said the monoamine substrate class belongs to the VMAT branch only and that the
      seeds were VMATs. One of the eight seeds is human VAChT, in the sister clade of unc-17 under the
      VAChT node, so the tree does not support a paralog over-propagation reading. The seed is an in
      vitro reconstitution, so the activity is peripheral, which is what KEEP_AS_NON_CORE says and what
      the human review decided. Summary, reason, supported_by and propagation_review rewritten, and
      PMID:25355561 added to the references list (publication file already cached).
- gene_file: genes/worm/unc-75/unc-75-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR24012
    ibd_node: PTN000609546
    tree_reading: >-
      IBD at PTN000609546 (281 leaves) with 13 seeds. Its children are PTN009074445 (159 leaves, animal
      CELF proteins, target here) and PTN008600802 (122 leaves, plants and protists, holding the
      Plasmodium seed Q8IDB7 and the two Arabidopsis seeds by taxon). Inside the CELF clade PTN008600785
      (144 leaves), human CELF1 (Q92879) and chicken CELF2 (Q7T2T1) are in the CELF1 and CELF2 clade
      PTN002539198 (55 leaves), and human CELF3 (Q5SZQ8) is in PTN000609613 (89 leaves, CELF3 to CELF6),
      the clade that also holds unc-75 (leaf PTN000609729, in the nematode group PTN008600797 of 8 leaves).
      No loss recorded.
    ground: TARGET_DOUBT
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005737 with descendants by accession. Human CELF3 Q5SZQ8 located_in IDA PMID:17725984
      (UniProt); chicken CELF2 Q7T2T1 IDA PMID:15226369 (AgBase) and EXP PMID:15830352; human CELF1 Q92879
      IDA on cytoplasmic stress granule PMID:18164289. unc-75 G5EE68 has only the IBA and an IEA.
    - >-
      The review's quote from PMID:12906792 (localizes to dynamic nuclear speckles) is the target-side
      evidence. Unchanged.
    - No family review exists for PTHR24012.
    review_edited: false
    notes: >-
      The node is well seeded, with a seed (human CELF3) in the target's own CELF3 to CELF6 clade, so the
      placement is not the problem. The ground is on the target. UNC-75 has been localised and is nuclear,
      in speckles, and the row asserts is_active_in cytoplasm. That is doubt short of loss, since
      shuttling has not been excluded. The reason states the localisation evidence. Its remark that UNC-75
      is not among the donors is not a ground, but the conclusion does not rest on it, so the file was
      left alone. The IEA row on the same term carries the same action.
  - go_id: GO:0006376
    go_label: mRNA splice site recognition
    family: PTHR24012
    ibd_node: PTN002769006
    tree_reading: >-
      IBD at PTN002769006 (148 leaves, animal CELF proteins plus one Monosiga leaf) with five seeds, human
      CELF1 (Q92879) and CELF2 (O95319) and three mouse Celf genes. The two human seeds are in the CELF1
      and CELF2 clade PTN002539198 (55 leaves); unc-75 is in the sister clade PTN000609613 (89 leaves,
      CELF3 to CELF6), joining at PTN008600785 (144 leaves). The same node carries the IBD for regulation
      of alternative mRNA splicing, via spliceosome (seven seeds). No loss recorded.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002769006
    evidence_checked:
    - >-
      QuickGO GO:0006376 with descendants by accession. Human CELF1 and CELF2 involved_in IDA PMID:11158314
      (UniProt); mouse Celf1 P28659 and Celf2 Q9Z0H4 acts_upstream_of_or_within IDA PMID:11158314 (MGI).
      Every experimental row found comes from that one paper.
    - >-
      PubMed abstract of PMID:11158314 (not in publications/). CELF proteins bound muscle-specific
      splicing enhancer RNAs in vitro and activated enhancer-dependent exon inclusion of cTNT minigenes.
      Abstract only.
    review_edited: false
    notes: >-
      The seed assay is binding to intronic enhancers and a minigene exon-inclusion readout, which is
      regulation of alternative splicing, already asserted at the same node by its own IBD. The seed rows
      put that under the spliceosome's splice site recognition term. Read from the abstract only, so the
      request to UniProt and MGI is a query about the term, not a confirmed error. The reason and
      propagation_review state this and name the node. Left as written.
  - go_id: GO:1990904
    go_label: ribonucleoprotein complex
    family: PTHR24012
    ibd_node: PTN002768817
    tree_reading: >-
      IBD at PTN002768817 (1213 leaves, nine child clades) with five seeds, all poly(A)-binding proteins.
      Human PABPC1 (P11940), PABPC4 (Q13310) and yeast PAB1 (P04147) all sit in PTN000610046 (200 leaves)
      inside the child PTN000610044 (677 leaves). unc-75 is in a different child, PTN000609546 (281
      leaves, CELF and relatives), which has no seed for the term. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000610046
    evidence_checked:
    - >-
      Lineages of P11940, Q13310 and P04147 read from the cached PTHR24012 tree; all three meet the
      target lineage only at the IBD node. The fly (FB:FBgn0265297) and fission yeast (SPAC57A7.04c) seeds
      are named in the review as pAbp and the fission yeast PABP and were not placed separately.
    review_edited: false
    notes: >-
      The seeds are sound for PABPs and the IBD sits at a node that spans most RRM proteins in the
      family. The reason names the node and the PABP seeds and says the CELF branch has no support.
      Its last sentence (any RNA-binding protein forms an RNP) is not a ground, but the tree argument
      stands without it. Left as written.
- gene_file: genes/worm/mup-4/mup-4-ai-review.yaml
  rows:
  - go_id: GO:0005201
    go_label: extracellular matrix structural constituent
    family: PTHR24039
    ibd_node: PTN000620536
    tree_reading: >-
      IBD at PTN000620536 (176 leaves) with two seeds. Its children are PTN009076344 (156 leaves,
