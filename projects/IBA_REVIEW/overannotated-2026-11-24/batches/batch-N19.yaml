    - >-
      QuickGO GO:0034625 with descendants. IDA rows on eloA Q54CJ4 (PMID:18621026, dictyBase), ELOVL1 (PMID:20166112), ELOVL3
      (PMID:20937905) and ELOVL5 (PMID:20427700). No experimental row on S. cerevisiae Elo1 P39540 for this term.
