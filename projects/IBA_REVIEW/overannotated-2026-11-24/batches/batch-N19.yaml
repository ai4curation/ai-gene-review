- gene_file: genes/SCHPO/atg18/atg18-ai-review.yaml
  rows:
  - go_id: GO:0000422
    go_label: autophagy of mitochondrion
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves). The root's children are PTN000132137 (144 leaves) and PTN000132247
      (275 leaves, the WDR45 and Hsv2 side). atg18 (leaf PTN000132238) is in PTN000132137, in a Schizosaccharomyces clade
      PTN002257653 (4 leaves, with its paralog Q9P6N1) that joins S. cerevisiae Atg18 and Atg21 at the fungal node PTN000132222
      (16 leaves). The fungal clade PTN000881190 (20 leaves) is sister to the metazoan clade PTN000881175 (67 leaves) under
      PTN000132139 (87 leaves). Two seeds, S. cerevisiae Atg21 (inside PTN000132222) and Drosophila Atg18a (inside PTN000881175).
      No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0000422 with descendants. Atg21 Q02887 IMP PMID:19793921 (SGD). atg18 Q9HDZ7 carries mitophagy GO:0000423
      by IC from PomBase. No row was returned for the fly seed under Q9VSF0, although the same query shape returns its glycophagy
      row.
    - Batch N11 changed S. cerevisiae ATG18 to KEEP_AS_NON_CORE on the same row.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The old reason said the root spans divergent paralogs and named no clade. The
      target is in the 16-leaf fungal node with one seed, it is required for macroautophagy in fission yeast, and the review
      already accepts the child term mitophagy by IC, so marking the parent term over-annotated was inconsistent. The root
      placement is still too deep for PTN000132247 (see HSV2 in batch N11, MOVE_IBD to PTN000132139). The fly seed row could
      not be confirmed in QuickGO.
  - go_id: GO:0000425
    go_label: pexophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves). The root's children are PTN000132137 (144 leaves) and PTN000132247
      (275 leaves, the WDR45 and Hsv2 side). atg18 (leaf PTN000132238) is in PTN000132137, in a Schizosaccharomyces clade
      PTN002257653 (4 leaves, with its paralog Q9P6N1) that joins S. cerevisiae Atg18 and Atg21 at the fungal node PTN000132222
      (16 leaves). The fungal clade PTN000881190 (20 leaves) is sister to the metazoan clade PTN000881175 (67 leaves) under
      PTN000132139 (87 leaves). One seed, S. cerevisiae Atg18 (leaf PTN000132229), inside PTN000132222. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0000425 with descendants. Atg18 P43601 IMP PMID:11739783 (SGD). Nothing on atg18.
    - >-
      Batch N11 removed the row from S. cerevisiae ATG21 on a tested negative and from HSV2, and asked to move the IBD to
      the Atg18 leaf PTN000132229.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. The seed is in the target's 16-leaf fungal node and the target is a
      core PROPPIN of fission yeast autophagy; pexophagy is untested in fission yeast, which is not a ground.
      The tension is with batch N11, whose fix moves the IBD to the S. cerevisiae Atg18 leaf and would take
      the term off atg18. atg18 predates the Atg18 and Atg21 duplication, so a placement at PTN000132222 with
      a loss on the Atg21 node would serve both calls. A stricter reader could keep the over-annotation on the
      ground that the only paralog pair tested split on this function. Reconciliation: One fix is now named
      for pexophagy on this node across batches N11, N19, N27 and N28: move the IBD from the root to the
      Atg18, WIPI1 and WIPI2 node PTN000132139 and add a loss at the Atg21 node PTN000132225 (S. cerevisiae
      and Eremothecium Atg21, read from the cached tree). PTN000132139 is the smallest node that holds the S.
      cerevisiae Atg18 seed together with every member whose review keeps the term: fungal Atg18 orthologs
      under PTN000132222, worm atg-18 and human WIPI2, whose review cites knockout cells with blocked
      pexophagy. The move takes the term off the Hsv2 and WDR45 root child PTN000132247. The earlier target,
      the Atg18 leaf PTN000132229, would have removed the term from those kept members. The family review
      still names PTN000132229 and was not edited in this pass. The row stays KEEP_AS_NON_CORE and is inside
      the target node.
  - go_id: GO:0044804
    go_label: nucleophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves). The root's children are PTN000132137 (144 leaves) and PTN000132247
      (275 leaves, the WDR45 and Hsv2 side). atg18 (leaf PTN000132238) is in PTN000132137, in a Schizosaccharomyces clade
      PTN002257653 (4 leaves, with its paralog Q9P6N1) that joins S. cerevisiae Atg18 and Atg21 at the fungal node PTN000132222
      (16 leaves). The fungal clade PTN000881190 (20 leaves) is sister to the metazoan clade PTN000881175 (67 leaves) under
      PTN000132139 (87 leaves). Three seeds, S. cerevisiae Atg18 and Atg21 (inside PTN000132222) and Hsv2 (in the other
      root child PTN000132247). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0044804 with descendants. Atg18 P43601 IMP PMID:22768199 and, for the child term GO:0034727, IMP PMID:18701704;
      Atg21 Q02887 IMP PMID:18701704 (GO:0034727); Hsv2 P50079 IMP PMID:18769150 (GO:0034727).
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED. Seeds sit in both root children and two of them in the target's 16-leaf fungal
      node, so the root placement is sound for this term and the target is inside the seeded clade. The old reason named
      no clade. Non-core because it is a cargo-specific process.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves). The root's children are PTN000132137 (144 leaves) and PTN000132247
      (275 leaves, the WDR45 and Hsv2 side). atg18 (leaf PTN000132238) is in PTN000132137, in a Schizosaccharomyces clade
      PTN002257653 (4 leaves, with its paralog Q9P6N1) that joins S. cerevisiae Atg18 and Atg21 at the fungal node PTN000132222
      (16 leaves). The fungal clade PTN000881190 (20 leaves) is sister to the metazoan clade PTN000881175 (67 leaves) under
      PTN000132139 (87 leaves). One seed, Drosophila Atg18a (leaf PTN000132220), in the metazoan clade PTN000881175. The
      fungal clade PTN000881190 that holds atg18 has no seed for this term. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO GO:0061723 for Q9VSF0. Atg18a IMP PMID:24265594 (FlyBase).
    - >-
      Batch N11 kept the row as non-core on S. cerevisiae ATG18, citing glycogen autophagy through Atg45 in budding yeast,
      and asked to move the IBD to PTN000132139 for HSV2.
    review_edited: true
    notes: >-
      Upheld, reason rewritten to name the clades. This departs from batch N11 on purpose: the budding yeast
      row was kept on budding yeast literature that has no counterpart in fission yeast, where glycogen
      autophagy has not been described, and on the tree the single seed is in the metazoan sister of the
      fungal clade. The move named here is narrower than the one in N11 (PTN000132139) and would take the term
      off S. cerevisiae ATG18 as well; if the coordinator prefers N11's node, this row becomes
      KEEP_AS_NON_CORE by descent. I did not search the literature for fission yeast glycophagy beyond the
      review's own sources. Reconciliation: One reading is now used for glycophagy on this node across batches
      N11, N19, N27 and N28: the IBA-level fix is to move the IBD from the root to the Atg18, WIPI1 and WIPI2
      node PTN000132139, as batch N11 named. The single fly seed is a requirement for the core autophagy
      machinery, the fungal Atg18 proteins are the orthologs of that seed inside PTN000132139, and nothing on
      them argues against the role, so the absence of a glycogen autophagy study in a given fungus is not a
      ground. The narrower target PTN000881175 (the metazoan clade) is withdrawn because it would take the
      term off S. cerevisiae ATG18, which is kept, and a kept row and a fix that removes it cannot both stand.
      The row moves from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE by descent from the target node, as the
      original note anticipated, and the gene review was edited to match.
