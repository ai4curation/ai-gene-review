      (TAIR, acts_upstream_of_or_within) and IDA (UniProt).
    - Tree joins computed for both seeds and the target.
    - >-
      Removal re-review batch 06 handled other branches of the same IBD with losses (HutG clade PTN001683871, cyanobacterial
