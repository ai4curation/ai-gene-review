- gene_file: genes/SCHPO/spa1/spa1-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR10279
    ibd_node: PTN001616256
    tree_reading: >-
      IBD at the family root PTN001616256 (82 leaves) with three seeds, MGI:MGI:1858170, human OAZ3 (Q9UMX2) and RGD:3219.
      The root has two children. The metazoan clade PTN000814807 (74 leaves, OAZ1, OAZ2 and OAZ3) holds human OAZ3, mouse
      Oaz3 (Q9R109) and rat Oaz1 (P54370), the three proteins that carry experimental nucleus rows. spa1 (leaf PTN001616259)
      is in the fungal clade PTN001616257 (8 leaves, one per species), which holds no seed. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000814807
    evidence_checked:
    - >-
      QuickGO GO:0005634 with descendants. Rat Oaz1 P54370 located_in IDA PMID:12941943 (RGD); human OAZ3 Q9UMX2 located_in
      HDA PMID:21630459 (UniProt) and nucleoplasm IDA (HPA); mouse Oaz3 Q9R109 IDA PMID:15642376 (MGI). The MGI and RGD
      seed ids were matched to these proteins by their experimental rows, not looked up by id.
    - >-
      Family review interpro/panther/PTHR10279 rates the node UNRESOLVED and calls the fungal branch untested.
    review_edited: false
    notes: >-
      Pattern 18 at the root. All seeds are located_in observations on mammalian antizymes, propagated as is_active_in to
      a fungal clade with no seed. The existing reason and propagation comment name the node and the mammalian origin; the
      summary sentence is quoted by the family review. Left alone. The biological ground is modest (mammalian antizyme shuttling
      is the only basis, and spa1 has not been localized), so a localization of spa1 would settle it.
