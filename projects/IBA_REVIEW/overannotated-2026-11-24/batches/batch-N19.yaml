    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0005737 with descendants. BAP1 Q92560 located_in cytoplasm IDA (PMID:18757409, PMID:19188440, PMID:24703950)
      and EXP PMID:19815555; UCHL5 Q9Y5K5 located_in cytosol IDA PMID:18922472 and HPA. No experimental cytoplasm row on
      uch2 Q9UUB6.
    - >-
      The review quotes PMID:20838651 (Uch2 among the DUBs scored exclusively nuclear) and PMID:10872838 (GFP-Uch2 predominantly
      at the nuclear periphery).
    review_edited: false
    notes: >-
      The node is soundly seeded on the target's side of the root, so this is not a placement problem. The ground is on
      the target: three localisation studies place Uch2 in the nucleus and at the nuclear periphery and the targeted census
      calls it exclusively nuclear. That is short of a shown loss (a minor proteasome-bound cytoplasmic pool is not excluded,
