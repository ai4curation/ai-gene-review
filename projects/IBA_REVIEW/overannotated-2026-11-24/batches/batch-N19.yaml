- gene_file: genes/SCHPO/SPAC17A5.13/SPAC17A5.13-ai-review.yaml
  rows:
  - go_id: GO:0006729
    go_label: tetrahydrobiopterin biosynthetic process
    family: PTHR11109
    ibd_node: PTN000121833
    tree_reading: >-
      IBD at the family root PTN000121833 (163 leaves) with five seeds. Human GCH1 (P30793), chicken GCH1 (P50141), fly
      Punch (P48596) and worm cat-4 (Q19980) are in the animal clade PTN000874050 (45 leaves); Dictyostelium gchA (Q94465)
      is in the 2-leaf clade PTN000874087. SPAC17A5.13 (leaf PTN000121897) is in the fungal clade PTN000874071 (15 leaves),
      which holds no seed; it joins the animals at PTN000121837 (60 leaves) and Dictyostelium at PTN000121836 (62 leaves).
      Above that the IBD covers plants and a 29-leaf bacterial clade PTN008961311. No loss recorded.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000874050
    evidence_checked:
    - Tree joins computed for the five seed proteins and the target.
    - >-
      Batch N10 made the same call for S. cerevisiae FOL2. The family review rates the node TOO_DEEP.
    review_edited: false
    notes: >-
      Same reading as FOL2 in batch N10, including its caveat: the fungal clade is nested between the animal and Dictyostelium
