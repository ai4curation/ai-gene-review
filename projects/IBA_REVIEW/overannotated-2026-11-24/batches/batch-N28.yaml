- gene_file: genes/BACSU/acoL/acoL-ai-review.yaml
  rows:
  - go_id: GO:0006103
    go_label: 2-oxoglutarate metabolic process
    family: PTHR22912
    ibd_node: PTN000530299
    tree_reading: >-
      IBD at the family root PTN000530299 (304 leaves) with four seeds, E. coli LpdA (P0A9P0), yeast LPD1
      (SGD:S000001876, P09624), human DLD (P09622) and rat Dld (RGD:735073, Q6P6R2). The root's children are an
      8-leaf archaeal clade PTN001115503 and PTN001877408 (296 leaves), which holds the target and all seeds.
      Under PTN001877408 the seeds are in two children, E. coli LpdA in PTN000530377 (18 leaves) and the three
      eukaryotic seeds in PTN002740624 (237 leaves). AcoL (leaf PTN000530745) is in a third child, PTN007717617
      (27 leaves, bacterial), which holds no seed; it joins B. subtilis BfmBC (P54533, the branched-chain
      2-oxoacid dehydrogenase E3) at the 4-leaf node PTN000530744. A fourth child, PTN001115358 (9 leaves), is
      the soluble transhydrogenase SthA clade. No loss recorded for the term.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002740624
    evidence_checked:
    - >-
      QuickGO by accession and GO id (exact). Yeast LPD1 has IMP PMID:3528755 (SGD) and IDA PMID:25165143
      (ComplexPortal); rat Dld has IDA PMID:3571202 (RGD); E. coli LpdA has acts_upstream_of_or_within IMP
      PMID:4197899 and IGI PMID:6311808 with sucA and sucB (EcoliWiki); human DLD has NAS PMID:36854377
      (ComplexPortal) and no experimental row for the exact term.
    - >-
      interpro/panther/PTHR22912/PTHR22912-review.yaml rates the node SOUND for the housekeeping E3s and notes
      that the acetoin-system E3 reviews mark the term over-annotated; it quotes this row's summary.
    - Review quotes PMID:20508247 and PMID:10368162, read in the validated supported_by block.
    review_edited: false
    notes: >-
      The seeds are housekeeping E3s that serve the 2-oxoglutarate dehydrogenase complex, and they are sound.
      The root placement also covers the SthA transhydrogenase clade and the 27-leaf clade of AcoL, BfmBC and
      related E3s, none of which is seeded. AcoL is encoded in the acetoin operon and B. subtilis has a separate
      housekeeping PdhD, which is reason to doubt the term without showing loss. The move needs two nodes
      because the seeds sit in two children of PTN001877408; PTN002740624 for the eukaryotic seeds and
      PTN000530377 for E. coli LpdA. The reason already names the node and the seeds, and the family review
      quotes the summary, so the file was left alone.
- gene_file: genes/BACSU/pgcA/pgcA-ai-review.yaml
  rows:
  - go_id: GO:0006166
    go_label: purine ribonucleoside salvage
    family: PTHR45745
    ibd_node: PTN001860097
    tree_reading: >-
      IBD at the family root PTN001860097 (110 leaves) with one seed, yeast PRM15 (SGD:S000004891, Q03262). The
      root has two children, PTN002907318 (85 leaves, eukaryotic PGM2 and PGM2L1 with the yeast seed) and
      PTN000501514 (25 leaves, bacterial), which holds PgcA (leaf PTN000501515) and no seed. PAINT records NOT
      IRD for this term at PTN002907319 inside the eukaryotic child. The pinned snapshot labels the term
      obsolete.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002907318
    evidence_checked:
    - QuickGO by accession and GO id, Q03262 with GO:0006166. One experimental row, IMP PMID:23670538 (SGD).
    - >-
      interpro/panther/PTHR45745/PTHR45745-review.yaml rates the root placement UNRESOLVED for the bacterial
      phosphoglucomutases.
    - Review quotes PMID:23103740 and PMID:15640167, read in the validated supported_by block.
    review_edited: false
    notes: >-
      The single seed is in the eukaryotic child and the bacterial child has none. Bacteria use a separate
      phosphopentomutase family (DeoB) for ribose 1-phosphate recycling, and PgcA is the dedicated glucose
      1-phosphate mutase, so the biology gives reason to doubt the term on this branch; nothing was measured on
      PgcA. The reason already argues from the root placement and the fungal seed. QuickGO now labels the term
      obsolete, which the review does not mention; the row will disappear from GOA when PAINT drops the term.
  - go_id: GO:0008973
    go_label: phosphopentomutase activity
    family: PTHR45745
    ibd_node: PTN001860097
    tree_reading: >-
      IBD at the family root PTN001860097 (110 leaves) with two seeds, yeast PRM15 (SGD:S000004891) and human
      PGM2 (Q96G03), both in the eukaryotic child PTN002907318 (85 leaves). PgcA is in the other child,
      PTN000501514 (25 leaves, bacterial), which holds no seed.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002907318
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human PGM2 has IDA PMID:17804405 (UniProt); yeast PRM15 has IDA and IMP
      PMID:23103740 and IMP PMID:23670538 (SGD).
    - Review quotes PMID:23103740 and PMID:31589605, read in the validated supported_by block.
    review_edited: false
    notes: >-
      Both seeds are sound enzyme assays in the eukaryotic child. PgcA was assayed on glucose 1-phosphate and
      glucosamine 1-phosphate only, and some pentose activity is plausible for a phosphohexomutase, so this is
      doubt on an unseeded branch and not a shown loss. The reason names the node and both seeds. Left alone.
- gene_file: genes/BACSU/divIVA/divIVA-ai-review.yaml
  rows:
  - go_id: GO:0009273
    go_label: peptidoglycan-based cell wall biogenesis
    family: PTHR35794
    ibd_node: PTN008058477
    tree_reading: >-
      IBD at PTN008058477 (13 of the 16 leaves in the family) with one seed, Mycobacterium tuberculosis Wag31
      (P9WMU1). The node has two children. The seed is in PTN002441648 (2 leaves, with Streptomyces coelicolor
      SCO2077). B. subtilis DivIVA (leaf PTN002184054) is in PTN002184039 (11 leaves, DivIVA and GpsB of
      Clostridium, Streptococcus, Staphylococcus, Listeria and Bacillus), which holds no seed. No loss recorded.
    ground: MISPLACED_IBD
    verdict: ACTION_CHANGED
    new_action: REMOVE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002441648
    evidence_checked:
    - >-
      QuickGO by accession and GO id, P9WMU1 with GO:0009273 (exact, and descendants of GO:0071554). One
      experimental row, involved_in IMP PMID:18310019 (MTBBASE), and the IBA.
    - >-
      publications/PMID_18296522.md (abstract only). DivIVA from Streptomyces or Mycobacterium localized to the
      poles of DivIVA-depleted C. glutamicum and restored polar peptidoglycan synthesis, in contrast to DivIVA
      from B. subtilis or S. pneumoniae, which localized at the septum.
    - No family review file for PTHR35794.
    review_edited: true
    notes: >-
      Changed to REMOVE. The earlier text already said that the actinobacterial proteins direct polar
      peptidoglycan synthesis and that the B. subtilis protein does not, and kept the row on the grounds that
      the term was too broad. On the tree the only seed is in the actinobacterial child and the target's child
      has none, and the cited paper tested the target protein against the seed's clade for exactly this
      function. The test is heterologous and read from the abstract, so a stricter reader could keep the
      over-annotation on NODE_TOO_DEEP grounds; the PAINT fix is the same either way. GpsB, in the target's
      child, does regulate peptidoglycan synthases, but it is not a seed and the row is on DivIVA. A
      propagation_review block was added because the validator asks for one on a removed IBA. History record
      added.
- gene_file: genes/BACSU/dgcK/dgcK-ai-review.yaml
  rows:
  - go_id: GO:0043709
    go_label: cell adhesion involved in single-species biofilm formation
    family: PTHR45138
    ibd_node: PTN002895351
    tree_reading: >-
      IBD at PTN002895351 (199 leaves, 26 species) with one seed, E. coli DgcZ (P31129, leaf PTN002246699). The
      node has five children and both the seed and DgcK (leaf PTN002895402) are in PTN002554534 (152 leaves).
      Inside it the seed is in PTN002895443 (91 leaves) and DgcK is in PTN008135597 (24 leaves, with Bacillus,
      Listeria, Clostridium and Staphylococcus cyclases), which holds no seed; they join at PTN002554534. PAINT
      records NOT IRD for this term at PTN008135598 inside PTN002554534, not on the lineage of DgcK.
    ground: SEED_OVERREACH
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002895351
    evidence_checked:
    - >-
      QuickGO by accession and GO id, P31129 with GO:0043709. One experimental row,
      acts_upstream_of_or_within IMP PMID:19460094 (EcoCyc), and the IBA.
    - Review quotes PMID:28536559 on the unknown EPS, read in the validated supported_by block.
    - No family review file for PTHR45138.
    review_edited: true
    notes: >-
      Same call and same fix as P. aeruginosa dgcP and wspR in batch N22. The earlier reason argued only from
      what is not established for DgcK; it now leads with the seed (an upstream mutant phenotype turned into
      involved_in for 199 cyclases) and the position of DgcK in an unseeded 24-leaf clade, and keeps the
      target-level points. Action unchanged. History record added.
- gene_file: genes/NEUCR/NCU06005/NCU06005-ai-review.yaml
  rows:
  - go_id: GO:0006641
    go_label: triglyceride metabolic process
    family: PTHR10196
    ibd_node: PTN000023394
    tree_reading: >-
      IBD at PTN000023394 (189 leaves) with two seeds, human GK (P32189) and mouse Gk (MGI:MGI:106594, Q64516),
      both in the animal glycerol kinase clade PTN000810472 (63 leaves). That clade joins the fungal clade
      PTN000810495 (19 leaves), which holds NCU06005 (leaf PTN000023511) and yeast GUT1, at PTN000023436
      (82 leaves); the IBD is three nodes above that join and also covers a 68-leaf plant and protist clade
      PTN007425724. PAINT records NOT IRD for this term at PTN002565401 inside the target's root child
      PTN002229998 (121 leaves), not on the target's lineage.
    ground: NODE_TOO_DEEP
    verdict: OVER_ANNOTATION_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000810472
    evidence_checked:
    - >-
      QuickGO by accession and GO id. Human GK has IMP PMID:8651297 (BHF-UCL) for the exact term. Mouse Gk has
      no experimental row for the exact term; with descendants it has IMP PMID:9302256 (MGI) for triglyceride
      biosynthetic process GO:0019432.
    - >-
      interpro/panther/PTHR10196/PTHR10196-review.yaml exists; it quotes only the UniProt record of this gene.
    - Review quotes PMID:6284716 on the Neurospora glycerol dissimilatory system.
    review_edited: false
    notes: >-
      Same call and same move as yeast GUT1 in batch N10. Both seeds are mutant phenotypes of the animal enzyme,
      where glycerol recycling feeds triglyceride synthesis; the fungal clade has no seed and the Neurospora
      enzyme belongs to an inducible glycerol catabolic system. The summary names the seeds and the
      propagation_review names the node, so the file was left alone.
- gene_file: genes/NEUCR/apg-10/apg-10-ai-review.yaml
  rows:
  - go_id: GO:0000422
    go_label: autophagy of mitochondrion
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with two seeds, S. cerevisiae ATG21 (SGD:S000006021,
      leaf PTN000132226) and Drosophila Atg18a (FB:FBgn0035850, leaf PTN000132220). The root's children are
      PTN000132137 (144 leaves) and PTN000132247 (275 leaves, the WDR45 and Hsv2 side). apg-10 (leaf
      PTN000132235) and both seeds are in PTN000132137. apg-10 is in the 5-leaf node PTN002257652 and joins the
      ATG21 seed at the fungal node PTN000132223 (12 leaves; the seed-side child is PTN000881192, 7 leaves) and
      the fly seed at PTN000132139 (87 leaves; fungal clade PTN000881190, 20 leaves, against metazoan clade
      PTN000881175, 67 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. Q02887 (ATG21) has IMP PMID:19793921 (SGD) for
      GO:0000422. M9PER1 (Atg18a) has IMP PMID:23873149 and PMID:30571977 and IDA PMID:40801807 (FlyBase) for
      the child term mitophagy GO:0000423. The FB: identifier form is not accepted by the QuickGO query; the
      accession form returns the rows.
    - >-
      interpro/panther/PTHR11227/PTHR11227-review.yaml rates the root placement TOO_DEEP (REMOVE_IBD) for
      this term.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, following fission yeast atg18 in batch N19 and budding yeast ATG18 in
      batch N11. The old reason said the root spans divergent paralogs and named no clade. The target is in the
      12-leaf fungal node with one seed and is the Atg18 ortholog, so the row is kept as non-core. The root
      placement is still too deep for PTN000132247 (see HSV2 in batch N11, MOVE_IBD to PTN000132139), which
      would leave the term on this target. History record added.
  - go_id: GO:0000425
    go_label: pexophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae ATG18 (SGD:S000001917,
      leaf PTN000132229). apg-10 (leaf PTN000132235) joins the seed at the fungal node PTN000132223
      (12 leaves), with the seed in the 7-leaf child PTN000881192 and apg-10 in the 5-leaf child PTN002257652.
      Both are in the root child PTN000132137 (144 leaves). No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by accession and GO id, P43601 with GO:0000425. IMP PMID:11739783 (SGD).
    - >-
      interpro/panther/PTHR11227/PTHR11227-review.yaml rates the placement TOO_DEEP and asks for MOVE_IBD to
      the S. cerevisiae Atg18 leaf PTN000132229.
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, same reading as fission yeast atg18 in batch N19. The seed is in
      the target's 12-leaf fungal node and the target is the Atg18 ortholog; pexophagy is untested for it,
      which is not a ground. The tension noted in N19 applies here too. The family review and batch N11 move
      the IBD to the S. cerevisiae Atg18 leaf because Atg21 was tested and is not needed, which would take the
      term off this target; apg-10 predates the Atg18 and Atg21 duplication (they join at the 4-leaf node
      PTN000132224), so a placement at PTN000132223 with a loss on the Atg21 node would serve both calls. A
      stricter reader could keep the over-annotation on that ground. Reconciliation: One fix is now named for
      pexophagy on this node across batches N11, N19, N27 and N28: move the IBD from the root to the Atg18,
      WIPI1 and WIPI2 node PTN000132139 and add a loss at the Atg21 node PTN000132225 (S. cerevisiae and
      Eremothecium Atg21, read from the cached tree). PTN000132139 is the smallest node that holds the S.
      cerevisiae Atg18 seed together with every member whose review keeps the term: fungal Atg18 orthologs
      under PTN000132222, worm atg-18 and human WIPI2, whose review cites knockout cells with blocked
      pexophagy. The move takes the term off the Hsv2 and WDR45 root child PTN000132247. The earlier target,
      the Atg18 leaf PTN000132229, would have removed the term from those kept members. The family review
      still names PTN000132229 and was not edited in this pass. The row stays KEEP_AS_NON_CORE and is inside
      the target node.
  - go_id: GO:0044804
    go_label: nucleophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with three seeds, all S. cerevisiae, ATG21
      (SGD:S000006021), HSV2 (SGD:S000003455, leaf PTN000132322) and ATG18 (SGD:S000001917). ATG18 and ATG21
      join apg-10 at the fungal node PTN000132223 (12 leaves) inside the root child PTN000132137 (144 leaves);
      HSV2 is in the other root child PTN000132247 (275 leaves) and joins only at the root. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id with descendants. ATG18 has IMP PMID:22768199 for GO:0044804 and IMP
      PMID:18701704 for the child term GO:0034727; ATG21 has IMP PMID:18701704 and HSV2 has IMP PMID:18769150,
      both for GO:0034727 (SGD).
    - interpro/panther/PTHR11227/PTHR11227-review.yaml rates the root placement TOO_DEEP (REMOVE_IBD).
    review_edited: true
    notes: >-
      Changed from MARK_AS_OVER_ANNOTATED, same reading as fission yeast atg18 in batch N19. Seeds sit in both
      root children and two of them in the target's 12-leaf fungal node. All three seeds are budding yeast
      proteins, which is why batch N15 upheld the over-annotation for Drosophila Atg18a in the unseeded animal
      clade; that reason does not apply inside the fungal clade. Non-core because it is a cargo-specific
      process.
  - go_id: GO:0061723
    go_label: glycophagy
    family: PTHR11227
    ibd_node: PTN000132136
    tree_reading: >-
      IBD at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a (FB:FBgn0035850, leaf
      PTN000132220), in the metazoan clade PTN000881175 (67 leaves). apg-10 (leaf PTN000132235) is in the
      sister fungal clade PTN000881190 (20 leaves), which holds no seed for this term; the two join at
      PTN000132139 (87 leaves), three nodes below the IBD. No loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO by accession and GO id, M9PER1 with GO:0061723, IMP PMID:24265594 (FlyBase). A QuickGO search of
      the term in Drosophila (taxon 7227) shows the same paper gives the term to Atg1, Atg2, Atg3, Atg5, Atg6,
      Atg9, Atg12, Atg16 and Atg17, so the seed is a core-machinery requirement.
    - interpro/panther/PTHR11227/PTHR11227-review.yaml rates the root placement TOO_DEEP (REMOVE_IBD).
    - The gene folder has no deep research file; the notes file does not mention glycogen autophagy.
    review_edited: true
    notes: >-
      Upheld with the same move as fission yeast atg18 in batch N19, and the reason was rewritten to name the
      clades. The single seed is in the metazoan sister of the fungal clade. Batch N11 kept the row on budding
      yeast ATG18 on budding yeast literature, which does not reach Neurospora. If the coordinator prefers the
      N11 node (PTN000132139), this row becomes KEEP_AS_NON_CORE. Reconciliation: One reading is now used for
      glycophagy on this node across batches N11, N19, N27 and N28: the IBA-level fix is to move the IBD from
      the root to the Atg18, WIPI1 and WIPI2 node PTN000132139, as batch N11 named. The single fly seed is a
      requirement for the core autophagy machinery, the fungal Atg18 proteins are the orthologs of that seed
      inside PTN000132139, and nothing on them argues against the role, so the absence of a glycogen autophagy
      study in a given fungus is not a ground. The narrower target PTN000881175 (the metazoan clade) is
      withdrawn because it would take the term off S. cerevisiae ATG18, which is kept, and a kept row and a
      fix that removes it cannot both stand. The row moves from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE by
      descent from the target node, as the original note anticipated, and the gene review was edited to match.
