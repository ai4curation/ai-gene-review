    tree_reading: >-
      IBD at PTN002932538 (38 leaves, 15 fungal species) with one seed, S. cerevisiae RVS167 (SGD:S000002796,
      P39743, leaf PTN000035314), in the Saccharomycotina clade PTN002240760 (7 leaves, Saccharomyces,
