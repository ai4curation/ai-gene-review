genes:
- gene_file: genes/BACSU/fabL/fabL-ai-review.yaml
  rows:
  - go_id: GO:0016616
    go_label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    family: PTHR42760
    ibd_node: PTN002449287
    tree_reading: >-
      IBD at the family root PTN002449287 (477 leaves, 130 species) with 12 seeds. The root has four
      children; FabL (leaf PTN001215015) is in PTN008675556 (77 leaves), inside PTN002449355 (34 leaves),
      PTN001962586 (10 leaves) and PTN009164833 (2 leaves, FabL with H. pylori HP_1014). One seed, E. coli
      KduD (P37769), shares the 34-leaf node PTN002449355 with the target; the other located seeds (FabG
      P0AEK2, HSD17B8 Q92506, CBR4 Q8N4T8, SrlD P05707, FabG3 P9WGT1, PF3D7_0922900 Q8I2S7, YghA P0AG84)
      are in other children of the root. The 10-leaf node also holds B. subtilis DhbA, a CH-OH
      dehydrogenase. No PAINT loss for the term anywhere in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001215015
    evidence_checked:
    - treeview and seed placement for BACSU fabL read in full (helper located each UniProtKB seed in the
      tree).
    - Review rows GO:0141148 (EXP, ACCEPT) and GO:0004318 (IDA) show the assayed reaction is reduction
      of the enoyl C=C bond (CH-CH donor, EC 1.3.1.104), not a CH-OH oxidoreduction.
    - Family review interpro/panther/PTHR42760/PTHR42760-review.yaml rates this node and term SOUND from
      OAR1 and oar2 only; it does not consider FabL.
    review_edited: false
    notes: The seeded clade is right for the term and the target is inside it, so this is a loss on the
      FabL branch, not a misplaced IBD. The loss is pinned to the FabL leaf because its 10-leaf neighbours
      include genuine CH-OH dehydrogenases (DhbA) and HP_1014 is uncharacterised. The existing reason names
      the node and the divergent chemistry and was left as written. The family review entry would read
      NEEDS_PRUNING once FabL is taken into account.
- gene_file: genes/BACSU/ymfI/ymfI-ai-review.yaml
  rows:
  - go_id: GO:0030497
    go_label: fatty acid elongation
    family: PTHR42760
    ibd_node: PTN001211919
    tree_reading: >-
      IBD at PTN001211919 (179 leaves, 66 species) with two seeds, E. coli FabG (P0AEK2) and Salmonella
      FabG (P0A2C9). Both seeds are in the child PTN002533682 (41 leaves), within PTN001213118 (11 leaves
      of proteobacterial fabG) and PTN005128927 (3 leaves). YmfI (leaf PTN001214414) is in another child,
      PTN008086219 (28 leaves), inside PTN001962566 (12 Firmicute leaves) and PTN005128819 (3 B. subtilis
      leaves). The 12-leaf Firmicute node also holds B. subtilis FabG (P51831). No PAINT loss for the term
      in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001214414
    evidence_checked:
    - treeview and seed placement for BACSU ymfI; members of PTN001962566, PTN008086219, PTN001213118 and
      PTN001549918 listed.
    - The review quotes PMID:28787546 (YmfI reduces EF-P-bound 5-aminopentanone; FabG is essential while
      ymfI mutants grow almost normally).
    - Family review PTHR42760-review.yaml rates this node and term TOO_DEEP (from the BenD/XylL reviews).
    review_edited: false
    notes: The family review asks for the IBD to move down to the FabG branch. That would also strip
      the term from the Firmicute FabG proteins in YmfI's own 12-leaf clade, so the fix named here is the
      narrower one, a loss at the YmfI leaf; the two are compatible if the IBD is moved and re-seeded. The
      review's reason places YmfI in PTHR42879:SF2 from the UniProt cross-reference, whereas the pinned
      tree has it as PTHR42760:SF40; the node id it cites (PTN001211919) is correct, so the file was left
      as written.
- gene_file: genes/PLAF7/ATP4/ATP4-ai-review.yaml
  rows:
  - go_id: GO:0006813
    go_label: potassium ion transport
    family: PTHR42861
    ibd_node: PTN000643667
    tree_reading: &atp4k >-
      IBD at PTN000643667 (42 leaves, 21 species), the ENA-type clade, with three seeds: S. cerevisiae
      ENA1 (SGD:S000002447, P13587), ENA2 (SGD:S000002446, Q01896) and S. pombe cta3 (SPBC839.06,
      P22189). All three are in the fungal child PTN009165381 (29 leaves). PfATP4 (leaf PTN001185421) is
      in the other child, PTN008088838 (13 leaves; Leishmania, Trypanosoma, Phytophthora, Physcomitrella,
      Marchantia, Plasmodium), within PTN009165383 (11 leaves) and PTN008676254 (5 leaves, PfATP4 with
      four Phytophthora leaves). The same node carries Na+ transport IBDs and IRD losses for the Ca2+
      terms.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001185421
    evidence_checked:
    - QuickGO by GO id with descendants. ENA1 and ENA2 carry GO:0006813 IMP and GO:0008556 IMP
      (PMID:11932440, SGD); cta3 carries GO:0008556 IDA (PMID:11932440, PomBase). The same query shape
      returned hits, so the seeds are real.
    - The review quotes PMID:29986883 (PfATP4-associated ATPase activity unaffected by K+ from 0 to 150
      mM).
    - No family review exists for PTHR42861.
    review_edited: false
    notes: The seeds are all fungal and the target is across the first split of the node, so moving the
      IBD to PTN009165381 would also be defensible. The verdict rests on the direct K+ insensitivity of
      PfATP4, so the fix is given as a loss at the PfATP4 leaf; nothing is known here about K+ use by the
      Phytophthora or bryophyte members.
  - go_id: GO:0008556
    go_label: P-type potassium transmembrane transporter activity
    family: PTHR42861
    ibd_node: PTN000643667
    tree_reading: *atp4k
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001185421
    evidence_checked:
    - Same seeds and QuickGO results as the GO:0006813 row (GO:0008556 IMP on ENA1 and ENA2, IDA on
      cta3).
    - PMID:29986883 quote in the review (no K+ effect on PfATP4-associated ATPase activity).
    review_edited: false
    notes: Same reading and fix as the GO:0006813 row.
  - go_id: GO:0006874
    go_label: intracellular calcium ion homeostasis
    family: PTHR42861
    ibd_node: PTN002450634
    tree_reading: >-
      IBD at PTN002450634 (400 leaves, 98 species) with 14 seeds, all SERCA, SPCA and PMCA-type Ca2+ pumps
      (human ATP2A1, ATP2A2, ATP2A3 and ATP2C1 located in the tree; the rest are MOD ids). PfATP4 reaches
      this node through PTN001533987 (399 leaves) and the ENA clade PTN000643667 (42 leaves). PAINT already
      records IRD losses at PTN000643667 for GO:0070588 calcium ion transmembrane transport and GO:0005388
      P-type calcium transporter activity (both 20260530), but none for GO:0006874, so the homeostasis
      term still descends into the ENA clade.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000643667
    evidence_checked:
    - treeview lineage for PLAF7 ATP4 with all PAINT records; seed placement helper.
    - The review quotes PMID:23414762 and PMID:29986883 (no demonstrated Ca2+ transport; activity
      insensitive to Ca2+).
    review_edited: false
    notes: The PAINT curators have already pruned the two Ca2+ transport terms for the whole ENA clade;
      the process term was left behind. The loss belongs at the same node.
