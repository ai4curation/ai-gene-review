- gene_file: genes/ARATH/D14/D14-ai-review.yaml
  rows:
  - go_id: GO:1901601
    go_label: strigolactone biosynthetic process
    family: PTHR43039
    ibd_node: PTN005141523
    tree_reading: >-
      IBD at PTN005141523 (52 leaves, 32 species), the D14 clade, with two seeds: rice D14 (Q10QA5), in
      the monocot child PTN005141524 (17 leaves), and AT3G03990, which is Arabidopsis D14 itself, in the
      other child PTN008094125 (35 leaves). The target is therefore one of the two seeds (treeview prints
      False only because the seed is given as an AGI code). No PAINT loss for the term in the family.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN005141523
    evidence_checked:
    - QuickGO by GO id. Q10QA5 carries GO:1901601 IMP (PMID:19542179, UniProt) and Q9SQR3 carries
      GO:1901601 IMP (PMID:22422982, UniProt).
    - publications/PMID_22422982.md is the carlactone paper (Alder et al.); its abstract assigns the
      pathway to D27, CCD7 and CCD8.
    - The review quotes PMID:22357928 and PMID:30643123 (D14 needed for strigolactone responses; D14
      hydrolysis deactivates the hormone).
    - No family review exists for PTHR43039.
    review_edited: false
    notes: Both seeds annotate the strigolactone receptor to the biosynthetic process on mutant
      phenotypes. The review removes the Arabidopsis IMP row as well, so the IBA and the experimental row
      it rests on carry the same action. That IMP removal was made without the full text of
      PMID:22422982 (the review says so); the receptor role of D14 is well established, but a later
      reader may prefer UNDECIDED on the IMP row, in which case this IBA should follow it. The written
      reason names rice D14 as the source and does not say that Arabidopsis D14 is the second seed.
- gene_file: genes/PSEAE/PA1611/PA1611-ai-review.yaml
  rows:
  - go_id: GO:0009927
    go_label: histidine phosphotransfer kinase activity
    family: PTHR43047
    ibd_node: PTN001976860
    tree_reading: >-
      IBD at PTN001976860 (330 leaves, 86 species) with two seeds. E. coli RcsD (P39838) is in the child
      PTN001976675 (130 leaves), inside PTN002453528 (13 leaves) and PTN005141961 (2 leaves, RcsD with
      Salmonella YojN). Yeast SLN1 (SGD:S000001409, P39928) is in the other child PTN008677845 (200
      leaves), inside PTN001976595 (173 leaves). PA1611 (leaf PTN002401443) is also in PTN001976595,
      through PTN008094258 (133 leaves) and PTN008677859 (113 leaves). No PAINT loss for the term in the
      family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN005141961
    evidence_checked:
    - GO:0009927 definition from QuickGO, "Serves as a phospho-His intermediate enabling the transfer
      of phospho group between a hybrid kinase and a response regulator."
    - QuickGO by GO id. RcsD carries GO:0009927 IDA (PMID:11309126, EcoCyc); SLN1 carries GO:0009927 IDA
      and IMP (PMID:12455952, SGD).
    - publications/PMID_12455952.md abstract. Sln1p transfers phosphate from its receiver aspartate to
      Ypd1p, which then passes it to Ssk1p and Skn7p. The Hpt intermediate in that relay is Ypd1p, not
      Sln1p.
    - The review records the PA1611 domain content (HAMP, HisKA, HATPase_c, REC, no HPt) and the
      separate Hpt protein HptB (PMID:32939285).
    - No family review exists for PTHR43047.
    review_edited: false
    notes: The term as defined needs an HPt domain. RcsD has one; SLN1 and PA1611 are hybrid kinases
      that hand phosphate to a separate Hpt protein, so the SLN1 seed is the hybrid-kinase side of the
      relay and does not support the term for HPt-less members. The review left the SLN1 seed
      unresolved; the abstract read here settles what that annotation describes. The IBD is moved to the
      RcsD node; TorS-type members of PTN002453528 may also carry an HPt domain, which was not checked.
