- gene_file: genes/ECOLI/epd/epd-ai-review.yaml
  rows:
  - go_id: GO:0004365
    go_label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
    family: PTHR43148
    ibd_node: PTN001652504
    tree_reading: &epd >-
      IBDs at the family root PTN001652504 (186 leaves, 73 species). Epd (leaf PTN000089781) is itself a
      seed. It sits in PTN000851394 (6 leaves, 6 species, the epd orthologs of Shewanella, Vibrio,
      Pseudomonas, Salmonella, Yersinia and E. coli), inside PTN001652559 (9 leaves, which adds three
      gap/gapA genes) and PTN000089775 (15 leaves). The other located seeds (B. subtilis GapA and GapB,
      M. tuberculosis Gap, Thermotoga Gap, M. genitalium GapA, Synechocystis Gap2) are elsewhere under
      PTN008679046 (174 leaves). No PAINT loss for either term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000851394
    evidence_checked:
    - treeview and seed placement for ECOLI epd; members of PTN000851394, PTN001652559 and PTN000089775
      listed.
    - The review quotes PMID:7751290 (the gapB-encoded enzyme is an E4PDH and not a second GA3PDH) and
      PMID:9182530 (glyceraldehyde 3-phosphate oxidation at least 2000-fold less efficient).
    - Family review PTHR43148-review.yaml rates this node and term NEEDS_PRUNING for SF3.
    review_edited: false
    notes: Epd is a seed through its own IDA row, which the review also removes as noise-level activity
      under the promiscuous-activity tiers, so the IBA and the row it rests on carry the same action.
      The loss is placed at the 6-leaf epd node, not the 15-leaf node, because the larger nodes include
      genes named gap and gapA.
  - go_id: GO:0006006
    go_label: glucose metabolic process
    family: PTHR43148
    ibd_node: PTN001652504
    tree_reading: *epd
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000851394
    evidence_checked:
    - The two seeds are B. subtilis GapB (O34425) and Epd itself (P0A9B6).
    - The review quotes PMID:7751290 and PMID:9696782 (Epd acts in PLP biosynthesis).
    - Family review rates this node and term NEEDS_PRUNING for SF3.
    review_edited: false
    notes: Same reading and fix as the GO:0004365 row. Epd should also be dropped as a seed.
- gene_file: genes/SCHPO/uga1/uga1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR43206
    ibd_node: PTN000241230
    tree_reading: &uga >-
      IBD at PTN000241230 (63 leaves, 51 species) with six seeds: human ABAT (P80404) and bovine ABAT
      (Q9BGI0), located in the vertebrate part of PTN000241233 (60 leaves), plus rat, mouse, fly and
      Dictyostelium MOD ids. The fungal members form PTN000945006 (16 leaves, 14 species), with the
      ascomycetes in PTN000241274 (12 leaves) holding both S. cerevisiae UGA1 and S. pombe uga1. No seed
      is in the fungal clade and no PAINT loss for the term is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: UNDECIDED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - QuickGO by GO id. S. pombe uga1 (O13837) carries GO:0005829 cytosol HDA (PMID:16823372) and
      GO:0005759 mitochondrial matrix IC (GO_REF:0000111, PomBase, dated 20260316 in the GOA file).
      Human ABAT carries GO:0005739 by IDA and HTP.
    - The review's own GO:0005759 IC row is UNDECIDED and its GO:0005829 HDA row is ACCEPT.
    - Family review PTHR43206-review.yaml rates this node and term NEEDS_PRUNING for the fungal clade,
      citing the yeast UGA1 review.
    review_edited: true
    notes: Root organelle term on a synthesis row. The earlier REMOVE rested on one genome-wide YFP
      screen and the lack of an obvious presequence, while a PomBase curator asserts mitochondrial matrix
      for this gene and the review leaves that row undecided. Removing the parent while the child is
      undecided was inconsistent, and the organelle claim is not demonstrably wrong for S. pombe. Action
      changed to UNDECIDED and the reason rewritten; history record added. If the PomBase matrix row is
      later judged wrong, this row should go to REMOVE with a loss at the fungal node, as for yeast UGA1.
- gene_file: genes/yeast/UGA1/UGA1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR43206
    ibd_node: PTN000241230
    tree_reading: *uga
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000241277
    evidence_checked:
    - QuickGO by GO id. Yeast UGA1 (P17649) carries GO:0005829 cytosol IDA (PMID:23740823, SGD) and no
      experimental mitochondrial annotation.
    - The review quotes PMID:23740823 (yeast UGA1 lacks a mitochondrial targeting peptide and is
      localized in the cytosol).
    - Family review rates this node and term NEEDS_PRUNING for the fungal clade.
    review_edited: false
    notes: Root organelle term, but the organelle claim fails for this gene on a targeted study, which
      projects/ORGANELLES.md allows to be removed as an over-propagation. The loss is pinned to the UGA1
      leaf, not to the fungal node PTN000945006 the family review points at, because the S. pombe
      ortholog is unresolved (see the SCHPO uga1 row in this batch, now UNDECIDED). The two fungal rows
      therefore no longer carry the same action; the difference is the PomBase matrix assertion on uga1.
- gene_file: genes/BACSU/thiI/thiI-ai-review.yaml
  rows:
  - go_id: GO:0052837
    go_label: thiazole biosynthetic process
    family: PTHR43209
    ibd_node: PTN001804941
    tree_reading: >-
      IBD at the family root PTN001804941 (25 leaves, 22 species) with one seed, P. aeruginosa ThiI
      (Q9HU66). The root has an archaeal and Trichomonas child PTN001804942 (11 leaves) and a bacterial
      child PTN001804955 (14 leaves). Inside the bacterial child the seed is in PTN000769419 (6 leaves,
      the gammaproteobacterial ThiI of Shewanella, Vibrio, Pseudomonas, Salmonella, Yersinia and E.
      coli), and B. subtilis ThiI (leaf PTN001804964) is in the sister PTN008100960 (7 leaves,
      Firmicutes with Mycoplasma and Coxiella). No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000769419
    evidence_checked:
    - QuickGO by GO id. Q9HU66 carries GO:0052837 IDA (PMID:9209060, PseudoCAP); E. coli ThiI (P77718)
      has no experimental row for the term.
    - The review quotes PMID:22773787 (B. subtilis ThiI and NifZ needed for 4-thiouridine but not
      thiamine) and records the archaeal result from PMID:22904325.
    - No family review exists for PTHR43209.
    review_edited: false
    notes: The seed and the other rhodanese-domain ThiI proteins are confined to the 6-leaf
      gammaproteobacterial node; the Firmicute and archaeal branches lack the domain and have direct
