  - go_id: GO:0015813
    go_label: L-glutamate transmembrane transport
    family: PTHR11958
    ibd_node: PTN002278999
    tree_reading: >-
      IBD at PTN002278999 (220 leaves, 36 species), 15 seeds (mammalian EAAT orthologs incl. P43003,
      P43004, P43005, P48664, bovine P46411 and Q95135). Children: PTN000943351 (218 leaves, target and
