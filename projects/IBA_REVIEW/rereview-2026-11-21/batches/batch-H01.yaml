- gene_file: genes/human/SLC39A4/SLC39A4-ai-review.yaml
  rows:
  - go_id: GO:0140410
    go_label: monoatomic cation:bicarbonate symporter activity
    family: PTHR12191
    ibd_node: PTN000953562
    tree_reading: >-
      IBD at the family root PTN000953562 (188 leaves, 33 species), 4 seeds: human SLC39A8 (Q9C0K1) and
      SLC39A14 (Q15043), rat Slc39a8 (RGD:1308236), mouse Slc39a8 (MGI:1914797). All seeds sit in two
      vertebrate clades, ZIP8 PTN002638854 (22 leaves) and ZIP14 PTN002638862 (20 leaves). Those two are
      children of the unresolved node PTN008337079 (79 leaves), whose other children are ZIP4
      PTN002638816 (18 leaves, the target) and ZIP12 PTN002638809 (19 leaves). Above that the IBD also
      covers ZIP6/ZIP10/ZIP5 (PTN004341746, 83 leaves), an invertebrate clade PTN008534409 (16 leaves)
      and a diatom leaf, none of which has a seed. This is the only record for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002638854
    evidence_checked:
    - 'QuickGO by goId with descendants: Q9C0K1 SLC39A8 IDA (PMID:22898811, PMID:27166256, PMID:27466201,
      PMID:28481222, PMID:29453449, PMID:31699897); Q15043 SLC39A14 IDA PMID:31699897; mouse Slc39a8 IDA
      (PMID:16638970 and others); SLC39A4 IBA only.'
    - 'genes/human/SLC39A4/SLC39A4-uniprot.txt: CATALYTIC ACTIVITY Zn(2+) uniport, pH optimum 5, and
      "Extracellular acidification stimulated SLC39A4-dependent Zn(2+) uptake" with ECO:0000269
      PubMed:31979155.'
    - No family review exists for PTHR12191.
    review_edited: false
    notes: The move needs two IBDs, one on the ZIP8 clade PTN002638854 and one on the ZIP14 clade
      PTN002638862 (the format holds one node id). Placing a single IBD at their common ancestor
      PTN008337079 would still cover ZIP4 and ZIP12 and would then need an IRD on PTN002638816. The
      evidence against bicarbonate symport in ZIP4 is curated UniProt text on acid-stimulated uptake, not
      a direct bicarbonate-dependence assay that I read; publications/PMID_31979155.md is not cached.
- gene_file: genes/human/AGK/AGK-ai-review.yaml
  rows:
  - go_id: GO:0001729
    go_label: ceramide kinase activity
    family: PTHR12358
    ibd_node: PTN008994514
    tree_reading: >-
      IBD at PTN008994514 (34 leaves, 30 species), the AGK ortholog clade, 2 seeds: mouse Agk
      (MGI:1917173, Q9ESW4) and fly Mulk (FBgn0260750, Q9VL10). Children: PTN000961571 (33 leaves, holds
      the target, the mouse seed at leaf PTN000270762 and fly Mulk) and one Monosiga leaf PTN000961479.
      The same node carries IBDs for GO:0047620, GO:0004143, GO:0046513 and GO:0042721 and an IRD for
      GO:0008481 sphingosine kinase activity. The target and its seeds are orthologs in one clade; no
      duplication separates them, and no loss for GO:0001729 is recorded in the family (other IBDs for
      the term sit on the CERK nodes PTN002644025 and PTN008536831).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: NONE
      target_node_id: PTN008994514
    evidence_checked:
    - 'QuickGO by goId with descendants: mouse Agk Q9ESW4 IDA PMID:15252046 (MGI); human AGK only ISS
      (from Q9ESW4), IEA and IBA; fly Mulk Q9VL10 IDA PMID:22069480 (FlyBase).'
    - 'publications/PMID_15939762.md (full text): human AGK lysates phosphorylated only monoacylglycerols
      and diacylglycerols, not ceramide; the paper notes the bacterially expressed enzyme of Waggoner et
      al. 2004 did phosphorylate ceramide. publications/PMID_16269826.md (abstract only): no evidence for
      ceramide phosphorylation by the multiple lipid kinase. publications/PMID_15252046.md (abstract
      only): MuLK phosphorylates diacylglycerol, ceramide and 1-acylglycerol.'
    - No family review file for PTHR12358 mentions this node (grep returned nothing).
    review_edited: false
    notes: >-
      Hardest call in the batch. The ground is direct negative assays on the human protein (two papers),
      not a tree argument: the positive seed is the one-to-one mouse ortholog, so a human-specific loss
      is not what the tree suggests, and I cannot name a node for an IRD. The disagreement is really
      between assay systems (bacterially expressed mouse enzyme positive, mammalian-expressed human
      enzyme negative), which the existing reason already says. The row was left REMOVE because the two
      other rows on the same term (ISS from mouse Agk, IEA) are REMOVE on the same evidence and the
      reason is node-aware. If the coordinator prefers to treat a contested in vitro activity as
      MARK_AS_OVER_ANNOTATED, all three rows should move together. PAINT-side, the useful request is to
      re-examine the mouse seed (PMID:15252046) and the indirect fly evidence (PMID:22069480, C1P levels
      after overexpression) rather than to prune a node; a NOT annotation on human AGK from PMID:15939762
      would block the IBA at the leaf.
