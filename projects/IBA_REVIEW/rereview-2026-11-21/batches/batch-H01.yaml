- gene_file: genes/human/ACTR10/ACTR10-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR11937
    ibd_node: PTN008986520
    tree_reading: >-
      IBD at PTN008986520 (127 leaves, 66 species), 4 seeds. Children: PTN008986521 (85 leaves) and
      PTN008986536 (42 leaves, kinetoplastid actin-like proteins and plant actins; holds the T. brucei
      seed Q57ZL0). PTN008986521 splits into PTN000232945 (48 leaves, the ARP11/ACTR10 clade, carrying
      IBD GO:0005869 dynactin complex and GO:0007018; target is here) and PTN008986528 (37 leaves), which
      holds the other three seeds: yeast and Candida ARP9 under PTN000940625 (3 leaves, with IBDs for
      SWI/SNF and RSC complexes) and mouse Actl7a under PTN000233236 (12 leaves, with IBDs for male germ
      cell nucleus and acrosomal vesicle). No seed lies in the ARP11 clade and no loss for GO:0005634 is
      recorded on it.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000232945
    evidence_checked:
    - 'QuickGO by goId with descendants: Q05123 yeast ARP9 nucleus IDA PMID:11011149; Q9QY84 mouse Actl7a
      nucleus EXP PMID:12672658, PMID:21278383, IDA PMID:36734600; Q57ZL0 nucleus IDA PMID:28727848;
      Q5A9X7 Candida ARP9 only RSC-type complex IDA PMID:33151931 (a descendant); ACTR10 human/mouse,
      yeast ARP10 (Q04549) and fly Arp10 have no experimental nuclear annotation.'
    - Family review PTHR11937-review.yaml has no assessment of this node.
    review_edited: false
    notes: Existing reason is node-aware (names PTN008986520 as deeper than the ARP11 nodes PTN000232945
      and PTN000232947) and rests on the ARP11 clade being the cytoplasmic dynactin pointed-end subunit.
      The seeds are each tied to a clade-specific nuclear role (chromatin remodellers, testis ARP), so an
      alternative fix is to move the IBD down to the seeded clades; the IRD on the ARP11 clade is the
      smaller change. Evidence of exclusion from the nucleus is indirect (UniProt location, HPA, dynactin
      being cytoplasmic), not a direct negative assay.
- gene_file: genes/human/SLC1A4/SLC1A4-ai-review.yaml
