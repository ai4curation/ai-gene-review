    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000252524
    evidence_checked:
    - 'QuickGO by goId with descendants: Q05892 COQ11 IMP PMID:25631044 (SGD); O74482 coq11 IDA
      PMID:37156397 (PomBase); Q16795 NDUFA9 IBA only.'
    - PubMed abstract of PMID:25631044 read (Coq11 identified as a coenzyme Q biosynthetic protein in the
