- gene_file: genes/human/NDUFA9/NDUFA9-ai-review.yaml
  rows:
  - go_id: GO:0006744
    go_label: ubiquinone biosynthetic process
    family: PTHR12126
    ibd_node: PTN000252522
    tree_reading: >-
      IBD at the family root PTN000252522 (258 leaves, 105 species), 2 seeds: yeast COQ11 (Q05892) and S.
      pombe coq11 (O74482). Root children: PTN000950817 (251 leaves) and a 7-leaf bacterial clade
      PTN000252602. Under PTN007559687 (247 leaves) the family splits into PTN000252524 (135 leaves, the
      COQ11 branch; both seeds are in its fungal subclade PTN000950818, 12 leaves; the rest, PTN007559643,
      123 leaves, is mostly plants and protists) and PTN000252548 (112 leaves, 90 species, the NDUFA9
