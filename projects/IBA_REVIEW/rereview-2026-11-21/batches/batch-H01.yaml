genes:
- gene_file: genes/human/CH25H/CH25H-ai-review.yaml
  rows:
  - go_id: GO:0036197
    go_label: zymosterol biosynthetic process
    family: PTHR11863
    ibd_node: PTN002275159
    tree_reading: >-
      IBD at PTN002275159 (72 leaves, 26 species) with one seed, mouse Msmo1 (MGI:1913484). The node has
      two children: the single Trichoplax leaf PTN000933385 and PTN002484044 (71 leaves), which splits
      into PTN000221349 (32 leaves; the MSMO1 clade, holding human MSMO1 Q15800 and the seed mouse Msmo1
      Q9CRA4, subfamily SF225) and PTN000221314 (39 leaves; CH25H and CH25H-like, subfamily SF213). The
      target's clade carries its own function IBDs (GO:0008395 at PTN000221316, 36 leaves; GO:0001567 at
      PTN002627316, 22 leaves, seeded by mouse Ch25h and human CH25H). The only seed sits across the
      PTN002484044 duplication from the target. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000221349
    evidence_checked:
    - 'QuickGO by goId (same query shape returned hits): Q9CRA4 mouse Msmo1 GO:0036197 IMP PMID:23125191
      and PMID:35128409 (MGI); human MSMO1 has only IBA and IEA; CH25H has IBA only.'
    - Family review interpro/panther/PTHR11863/PTHR11863-review.yaml read; it does not assess this node
      for GO:0036197.
    review_edited: false
    notes: Existing reason is node-aware (names PTN002275159, the Msmo1 seed and the separate CH25H node
      PTN002627316) and rests on divergence of the CH25H subfamily. The sibling IBD GO:0006695 cholesterol
      biosynthetic process on the same node has the same placement problem but is not a row in this
      review.
  - go_id: GO:0000254
    go_label: C-4 methylsterol oxidase activity
    family: PTHR11863
    ibd_node: PTN000221246
    tree_reading: >-
      IBD at PTN000221246 (391 leaves, 94 species), 8 seeds. Seeds sit in three places: human MSMO1 and
      mouse Msmo1 in PTN000221349 (32 leaves); yeast and Candida ERG25 in the fungal clade PTN000933387
      (35 leaves); Arabidopsis SMO1 and SMO2 genes in the plant-containing child PTN008528842 (204
      leaves). The target is in the other child PTN000221247 (187 leaves), in PTN000221314 (39 leaves),
      the sister of the MSMO1 clade under the duplication node PTN002484044 (71 leaves). The target's
      clade has replacement MF IBDs: GO:0008395 steroid hydroxylase activity at PTN000221316 (36 leaves)
      and GO:0001567 cholesterol 25-hydroxylase activity at PTN002627316 (22 leaves, seeds mouse Ch25h and
      human CH25H). So the IBD node itself is well seeded on both sides of the root split and the
      activity is ancestral; the CH25H clade is a neofunctionalised paralog inside it. No IRD for
      GO:0000254 is recorded anywhere in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000221316
    evidence_checked:
    - 'QuickGO by goId: Q15800 MSMO1 EXP PMID:21285510 (Reactome) and TAS; Q9CRA4 Msmo1 IMP PMID:23125191,
      PMID:35128409; P53045 ERG25 IDA PMID:12880870, PMID:8663358, IMP PMID:8552601; O95992 CH25H and
      Q9Z0F5 Ch25h carry IBA only.'
    - Family review PTHR11863-review.yaml states C4 methylsterol oxidase activity is not a family-wide
      grant and is not supported for CH25H (scope UNRESOLVED).
    review_edited: false
    notes: Existing reason is node-aware and rests on substrate and position divergence of the CH25H
      subfamily (cholesterol has no C-4 methyl group). IRD proposed at PTN000221316, the node where PAINT
      already asserts the replacement steroid hydroxylase activity; a curator could place it one node up
      at PTN000221314 (39 leaves, the whole sister clade of MSMO1) or, conservatively, at PTN002627316.
- gene_file: genes/human/ACTG2/ACTG2-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11937
    ibd_node: PTN004322804
    tree_reading: >-
      IBD at PTN004322804 (30 leaves, 17 species), one seed RGD:621676 (rat Acta2, P62738). The node is a
      duplication with two children: PTN008986283 (16 leaves, the ACTG2 orthologs, holding the target)
      and PTN008333081 (14 leaves, the ACTA2 orthologs, holding the seed at leaf PTN001377896). The only
      other GO:0005576 record in the family is this one. Deeper nodes on the target's lineage carry
      GO:0015629 actin cytoskeleton (PTN002631484, 993 leaves) and GO:0005200 (root).
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008333081
    evidence_checked:
    - 'QuickGO by goId with descendants (query returned 11 hits): rat Acta2 P62738 has GO:0005604 basement
      membrane IDA PMID:30476341 (RGD) plus the IBA; ACTG2 human and rat have only the IBA and HDA
      proteomics rows (PMID:23580065, PMID:23533145, PMID:22516433).'
    - Family review interpro/panther/PTHR11937/PTHR11937-review.yaml has no assessment of this node.
    review_edited: true
    notes: Action unchanged. Reason rewritten because it rested partly on the single seed and on the seed
      gene also receiving the IBA; CIRCULAR_PROPAGATION removed from failure_modes. The seed annotation
      itself (alpha-SMA as a peritubular-cell marker annotated to basement membrane) is doubtful for any
      actin, so a curator may prefer REMOVE_IBD at PTN004322804 over moving it to the ACTA2 clade; I could
      not read the full text of PMID:30476341 so did not claim BAD_SEED.
- gene_file: genes/human/ACTR10/ACTR10-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR11937
    ibd_node: PTN008986520
    tree_reading: >-
      IBD at PTN008986520 (127 leaves, 66 species), 4 seeds. Children: PTN008986521 (85 leaves) and
      PTN008986536 (42 leaves, kinetoplastid actin-like proteins and plant actins; holds the T. brucei
      seed Q57ZL0). PTN008986521 splits into PTN000232945 (48 leaves, the ARP11/ACTR10 clade, carrying
      IBD GO:0005869 dynactin complex and GO:0007018; target is here) and PTN008986528 (37 leaves), which
      holds the other three seeds: yeast and Candida ARP9 under PTN000940625 (3 leaves, with IBDs for
      SWI/SNF and RSC complexes) and mouse Actl7a under PTN000233236 (12 leaves, with IBDs for male germ
      cell nucleus and acrosomal vesicle). No seed lies in the ARP11 clade and no loss for GO:0005634 is
      recorded on it.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000232945
    evidence_checked:
    - 'QuickGO by goId with descendants: Q05123 yeast ARP9 nucleus IDA PMID:11011149; Q9QY84 mouse Actl7a
      nucleus EXP PMID:12672658, PMID:21278383, IDA PMID:36734600; Q57ZL0 nucleus IDA PMID:28727848;
      Q5A9X7 Candida ARP9 only RSC-type complex IDA PMID:33151931 (a descendant); ACTR10 human/mouse,
      yeast ARP10 (Q04549) and fly Arp10 have no experimental nuclear annotation.'
    - Family review PTHR11937-review.yaml has no assessment of this node.
    review_edited: false
    notes: Existing reason is node-aware (names PTN008986520 as deeper than the ARP11 nodes PTN000232945
      and PTN000232947) and rests on the ARP11 clade being the cytoplasmic dynactin pointed-end subunit.
      The seeds are each tied to a clade-specific nuclear role (chromatin remodellers, testis ARP), so an
      alternative fix is to move the IBD down to the seeded clades; the IRD on the ARP11 clade is the
      smaller change. Evidence of exclusion from the nucleus is indirect (UniProt location, HPA, dynactin
      being cytoplasmic), not a direct negative assay.
- gene_file: genes/human/SLC1A4/SLC1A4-ai-review.yaml
  rows:
  - go_id: GO:0005313
    go_label: L-glutamate transmembrane transporter activity
    family: PTHR11958
    ibd_node: PTN000238242
    tree_reading: >-
      IBD at PTN000238242 (234 leaves, 41 species), 15 seeds: EAAT1-5 orthologs from human, mouse and rat
      plus fly (FBgn0026439) and worm (WBGene00001620). Children: PTN002278999 (220 leaves, holds target
      and the vertebrate seeds) and PTN004328791 (14 leaves, green plants and algae). Inside, the
      vertebrate duplication node PTN002632789 (139 leaves) has seven children: ASCT1 PTN002632762 (20
      leaves, target), ASCT2 PTN002632768 (20), SLC1A3 PTN002632799 (23), SLC1A6 PTN002632753 (22), SLC1A7
      PTN002632790 (22), SLC1A1 PTN002632777 (23) and PTN008531521 (9). The ASCT1 node PTN002632762
      carries its own IBDs (alanine, serine, threonine, aspartate transporter activity) and an IRD for
      GO:0015501 glutamate:sodium symporter activity, a child of GO:0005313. No IRD for GO:0005313
      itself exists in the family (the only record for the term is the IBD).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002632762
    evidence_checked:
    - 'QuickGO by goId with descendants: P43003 SLC1A3 GO:0005313 IDA PMID:7521911 and GO:0005314 IDA/IMP;
      P43007 SLC1A4 carries GO:0005313 only as IBA and TAS PMID:21757002; mouse Slc1a4 IBA only.'
    - Review row quotes PMID:8340364 (ASCT1 expression did not induce L-glutamate transport); quote left
      untouched and passes reference validation.
    - No family review file for PTHR11958 mentions the node (grep returned nothing).
    review_edited: true
    notes: Action unchanged. One sentence of the reason was replaced because it said this was not a
      lineage-specific loss, while the tree shows a loss on the ASCT1 clade that PAINT already records
      for the child term. The TAS row on the same term is also REMOVE, so the actions are consistent.
      The same IRD is needed on the ASCT2 node PTN002632768 for consistency with its existing losses.
  - go_id: GO:0015813
    go_label: L-glutamate transmembrane transport
    family: PTHR11958
    ibd_node: PTN002278999
    tree_reading: >-
      IBD at PTN002278999 (220 leaves, 36 species), 15 seeds (mammalian EAAT orthologs incl. P43003,
      P43004, P43005, P48664, bovine P46411 and Q95135). Children: PTN000943351 (218 leaves, target and
      seeds) and PTN002279026 (2 fungal leaves). PAINT already records IRD losses for GO:0015813 at
      PTN002632768 (ASCT2 clade, 20 leaves) and PTN002632810 (3 leaves), but not at the ASCT1 clade
      PTN002632762 (20 leaves), although that node has the IRD for GO:0015501.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002632762
    evidence_checked:
    - 'QuickGO exact goId: P43007 SLC1A4 has GO:0015813 as IBA only; Q15758 SLC1A5 has only an IEA (its
      IBA is blocked by the IRD).'
    - Review row quotes PMID:8340364 negative glutamate transport result for ASCT1.
    review_edited: false
    notes: Reason is sound (direct negative data on the target, glutamate transport not retained in the
      ASCT branch). The PAINT gap is an omission, since the curator pruned the sister ASCT2 clade for the
      same term and pruned ASCT1 for the MF child term only.
