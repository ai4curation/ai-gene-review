      problem. The single seed annotation rests on the 2002 report of covalent Hub1 conjugation, which
      the 2003 study contradicts, and the whole Hub1/UBL5 family lacks the di-glycine tail, so the node
      has no sound seed for a term defined by covalent attachment. The fix is at SGD (a CHECK on the
      HUB1 IDA row), and the IBD goes with it. The existing reason argues the same biology from the
      target side (no di-Gly motif, non-covalent action); its propagation_review labels the yeast seed
      SUPPORTS_SOURCE_BUT_NOT_TARGET, which understates the seed problem but does not change the action.
      The sibling IBD GO:0036211 protein modification process on the same node likely rests on the same
      paper; not a row here.
