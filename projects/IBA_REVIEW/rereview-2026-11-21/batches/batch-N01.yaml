- gene_file: genes/DROME/CG32086__Q8IQG0/CG32086__Q8IQG0-ai-review.yaml
  rows:
  - go_id: GO:0061891
    go_label: calcium ion sensor activity
    family: PTHR12086
    ibd_node: PTN004335498
    tree_reading: >-
      IBD at PTN004335498 (32 leaves, 28 species), one seed, human EFHB Q8N7U6. Children: PTN008533080
      (28 leaves, animal EFHB orthologs, holding both the seed and the target) and PTN008335381 (4
      leaves, Paramecium and Chlamydomonas). The target leaf PTN001739720 sits in PTN001739718, a
      fly-only node of 3 leaves (Q8IQG0, Q7KUG5, Q8MST3), sister to a Tribolium leaf under PTN008533081
      (4 leaves), inside PTN004335499 (24 leaves). So seed and target are in the same orthologous
      clade and the node placement itself is not at fault. No loss recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001739718
    evidence_checked:
    - 'QuickGO by GO id: Q8N7U6 EFHB GO:0061891 IMP PMID:30481768 (UniProt) plus IBA.'
    - 'genes/DROME/CG32086__Q8IQG0/CG32086__Q8IQG0-bioinformatics/RESULTS.md: human EFHB has one PROSITE
      PS00018 EF-hand loop; Q8IQG0 and the two fly SF12 paralogs Q7KUG5 and Q8MST3 have none, with
      non-acidic residues at loop positions 1 and 3 and an insertion.'
    review_edited: false
    notes: Reason rests on target-specific loss of the calcium-binding loop, shown by the gene's own
      sequence analysis; the remark that the seed is a single study is context, not the ground. IRD
      placed at the fly-only node because all three fly paralogs lack the loop per RESULTS.md; whether
      Tribolium (PTN004335501) keeps it was not checked.
- gene_file: genes/worm/pnk-1/pnk-1-ai-review.yaml
  rows:
  - go_id: GO:0004594
    go_label: pantothenate kinase activity
    family: PTHR12280
    ibd_node: PTN000957942
    tree_reading: >-
      This row is a negated IBA (NOT enables). The positive IBD sits at the root PTN000957942 (311
      leaves, 11 seeds); the NOT comes from an IKR loss at PTN000957966 (37 leaves, 28 species), the
      node that also carries IBD GO:0016791 seeded by human PANK4. Under it PTN000264418 (35 leaves)
      splits into PTN008337963 (21 leaves, chordate PANK4 incl. human Q9NVE7) and PTN002641599 (14
      leaves, protostomes), which holds the target in the nematode-only node PTN000957977 (3 leaves:
      C. elegans, C. briggsae and Pristionchus pnk-1). The other worm paralog pnk-4 (Q18580) is far
      away, under PTN004347316 (65 leaves), which carries its own NOT IKR for GO:0004594. So removing
      the NOT row means the loss at PTN000957966 is placed too high for the nematode pnk-1 clade.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_LOSS
      target_node_id: PTN008337963
    evidence_checked:
    - 'publications/PMID_30927326.md quotes in the review: the inactivating Glu138Val and Arg207Trp
      substitutions define the catalytically deficient PANK4 variant, while plant and fungal PANK4 is
      active.'
    - genes/worm/pnk-1/pnk-1-bioinformatics/RESULTS.md (PNK-1 keeps E214 and R281); PMID:42523442 quotes
      on pnk-1 lethality with CoA rescue and pnk-4 not acting as a kinase.
    - Children of PTN000264418, PTN002641599 and PTN000957976 and the pnk-4 and PANK4 lineages read
      from the same tree cache with a helper built on treeview.py.
    - 'interpro/panther/PTHR12280/PTHR12280-review.yaml assesses the IKR at PTN000957966 as UNRESOLVED:
      the loss of the catalytic pair is shown only for amniote PANK4, and frog PANK4 keeps both residues
      with low kinase activity. It does not discuss the nematode pnk-1 clade.'
    review_edited: false
    notes: >-
      The README grounds are written for positive IBDs; here the misplaced record is the IKR loss, so
      MISPLACED_IBD is used in the sense of LOSS_TOO_BROAD and the fix is MOVE_LOSS (family-review
      vocabulary). PTN008337963 is the largest node that still excludes pnk-1; the review says the
      inactivating substitutions are amniote-specific, so a curator may place the loss lower. The
      inventory lists the root IBD node for this row because the todo format has one node per row. The
      existing reason is tree-aware (names both nodes, cites retained catalytic residues and genetics),
      and the review adds the positive activity as a NEW IC row. No edit.
  - go_id: GO:0016791
    go_label: phosphatase activity
    family: PTHR12280
    ibd_node: PTN000957966
    tree_reading: >-
      IBD at PTN000957966 (37 leaves, 28 species), one seed, human PANK4 Q9NVE7. Children: PTN008535620
      (36 leaves, holding seed and target) and a Monosiga leaf PTN000957989. Seed is in the chordate
      clade PTN008337963 (21 leaves); target is in the protostome sister PTN002641599 (14 leaves), in
      the nematode node PTN000957977 (3 leaves). Its sister PTN000957981 (Daphnia, Ixodes) and the
      Helobdella clade PTN002641600 (9 leaves) complete the 14.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000957977
    evidence_checked:
    - 'QuickGO by GO id with descendants (2 hits): Q9NVE7 PANK4 GO:0016791 EXP PMID:27322068 (Reactome)
      plus IBA.'
    - interpro/panther/PTHR12280/PTHR12280-review.yaml calls the PTN000957966 phosphatase IBD sound for
      the PANK4 clade and notes the activity sits in the DUF89 domain.
    - 'UniProt REST (Pfam cross-references and length): H2KYP7 449 aa, A8XG37 445 aa, A0A2A6C4Z0 458 aa
      carry PF03630 Fumble only; human PANK4 Q9NVE7 (773 aa), worm pnk-4 Q18580 (755 aa) and Daphnia
      E9HA67 (771 aa) carry PF03630 plus PF01937 (the DUF89/ARMT1-like phosphatase domain). Four
      Helobdella leaves checked (T1FVH8, T1FVH6, T1FG29, T1ENI4; 481-524 aa) are Fumble only.'
    review_edited: false
    notes: Reason rests on absence of the phosphatase domain in PNK-1, confirmed here for all three
      nematode leaves, so the IRD goes on the nematode node. Daphnia in the sister node keeps the domain,
      so the loss is not at PTN002641599; the Helobdella paralogs would need their own check.
