- gene_file: genes/yeast/SUR2/SUR2-ai-review.yaml
  rows:
  - go_id: GO:0042284
    go_label: sphingolipid delta-4 desaturase activity
    family: PTHR11863
    ibd_node: PTN000933245
    tree_reading: >-
      IBD at PTN000933245 (15 leaves, 14 species, fungal Sur2 clade), one seed, S. pombe sur2
      (PomBase:SPBC887.15c, O94298). Children: PTN000221171 (12 leaves, ascomycetes, holding both the
      target P38992 and the seed) and PTN000933256 (3 basidiomycete leaves). Above it PTN000933267 (201
      leaves) carries GO:0102772 sphingolipid C4-monooxygenase activity (3 seeds) and GO:0046520. No
      loss recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000221174
    evidence_checked:
    - 'QuickGO by GO id: O94298 sur2 GO:0042284 IGI PMID:22542487 (PomBase, with SGD:S000002705) plus
      IBA; P38992 SUR2 has GO:0102772 IMP PMID:9556590 and no experimental GO:0042284.'
    - 'publications/PMID_22542487.md (abstract only): trypanosomatid genes were expressed in an S.
      cerevisiae sur2 deletion mutant "which lacks C4-hydroxylase activity", with "the Schyzosaccharomyces
      pombe sphingolipid desaturase (SpSLdes)" as positive control.'
    - 'PubMed PMID:12633877 abstract (doi:10.1016/s0014-5793(03)00163-7): the S. pombe dihydroceramide
      delta-4 desaturase is SPBC3b8.07c (dsd1, O59715), which QuickGO shows with GO:0042284 IDA.'
    - publications/PMID_9556590.md quotes in the review (SYR2 required for 4-hydroxylation).
    review_edited: false
    notes: >-
      REMOVE rests on target evidence: S. cerevisiae Sur2 is the C4-hydroxylase and the sur2 mutant used
      as the desaturase-free host in the seed paper. Lead, not proven: the single seed may be a
      wrong-gene annotation, since the "S. pombe sphingolipid desaturase" of PMID:22542487 is probably
      dsd1 (a DEGS-family protein, not in PTHR11863) and not sur2. Full text not read, so this is a CHECK
      query for PomBase; if confirmed the fix is REMOVE_IBD at PTN000933245 (BAD_SEED) and not a leaf
      IRD. The review's propagation_review says the donor was not inspected; left as is.
