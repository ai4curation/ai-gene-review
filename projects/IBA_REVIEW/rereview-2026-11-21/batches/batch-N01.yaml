genes:
- gene_file: genes/HORSE/CH25H/CH25H-ai-review.yaml
  rows:
  - go_id: GO:0000254
    go_label: C-4 methylsterol oxidase activity
    family: PTHR11863
    ibd_node: PTN000221246
    tree_reading: >-
      IBD at PTN000221246 (391 leaves, 94 species), 8 seeds (mouse Msmo1, yeast ERG25, human MSMO1
      Q15800, Candida ERG25, four Arabidopsis SMO genes). The node has two children: PTN008528842 (204
      leaves, plant-rich) and PTN000221247 (187 leaves), which holds the target. The target leaf
      PTN001373708 (subfamily SF213) sits under PTN002627316 (22 leaves, IBD GO:0001567 cholesterol
      25-hydroxylase activity, 2 seeds), PTN000221316 (36 leaves, IBD GO:0008395 steroid hydroxylase
      activity) and PTN000221314 (39 leaves), which joins the MSMO1 side only at PTN002484044 (71
      leaves). So the IBD node is well seeded on both sides of its split and the target clade carries
      replacement MF IBDs of its own. No IRD for GO:0000254 is recorded in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000221316
    evidence_checked:
    - The batch-H01 record for human CH25H (same family, same node) lists the QuickGO seed check by GO id
      (MSMO1 EXP, Msmo1 IMP, ERG25 IDA and IMP; CH25H and Ch25h IBA only); not repeated here.
    - Family review interpro/panther/PTHR11863/PTHR11863-review.yaml says C4 methylsterol oxidase
      activity is not a family-wide grant.
    review_edited: false
    notes: Existing reason is node-aware (names PTN000221246, the donors and the CH25H node PTN002627316)
      and rests on substrate divergence of the CH25H clade. Same verdict and fix as human CH25H in
      batch-H01.
  - go_id: GO:0036197
    go_label: zymosterol biosynthetic process
    family: PTHR11863
    ibd_node: PTN002275159
    tree_reading: >-
      IBD at PTN002275159 (72 leaves, 26 species), one seed, mouse Msmo1 (MGI:1913484). Children: the
      single Trichoplax leaf PTN000933385 and PTN002484044 (71 leaves), which holds both the CH25H clade
      PTN000221314 (39 leaves, with the target) and the MSMO1 clade with the seed. The target's clade
      carries GO:0008395 at PTN000221316 and GO:0001567 at PTN002627316. No PAINT loss for the term.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000221349
    evidence_checked:
    - 'batch-H01 human CH25H record: Q9CRA4 mouse Msmo1 GO:0036197 IMP PMID:23125191 and PMID:35128409;
      CH25H IBA only. target_node_id PTN000221349 (32 leaves, MSMO1 clade) is taken from that record,
      which read it from the treeview of the same node.'
    review_edited: false
    notes: Existing reason names the node and the single Msmo1 seed and rests on divergence, not on donor
      count.
- gene_file: genes/mouse/Ch25h/Ch25h-ai-review.yaml
  rows:
