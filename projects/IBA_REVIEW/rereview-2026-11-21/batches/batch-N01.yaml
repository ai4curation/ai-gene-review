  - go_id: GO:0036197
    go_label: zymosterol biosynthetic process
    family: PTHR11863
    ibd_node: PTN002275159
    tree_reading: >-
      IBD at PTN002275159 (72 leaves), single seed mouse Msmo1; target in PTN002484044 (71 leaves) within
      the CH25H clade PTN000221314 (39 leaves), sister to the MSMO1 clade that holds the seed.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000221349
    evidence_checked:
    - Seed annotation as in batch-H01 (Msmo1 IMP PMID:23125191, PMID:35128409).
    review_edited: false
    notes: Flagged tier 2 (donor_count) by the scan, but the reason explicitly says the single seed is not
      the problem and argues node placement. No edit needed.
- gene_file: genes/yeast/SUR2/SUR2-ai-review.yaml
  rows:
  - go_id: GO:0042284
    go_label: sphingolipid delta-4 desaturase activity
    family: PTHR11863
    ibd_node: PTN000933245
    tree_reading: >-
      IBD at PTN000933245 (15 leaves, 14 species, fungal Sur2 clade), one seed, S. pombe sur2
      (PomBase:SPBC887.15c, O94298). Children: PTN000221171 (12 leaves, ascomycetes, holding both the
      target P38992 and the seed) and PTN000933256 (3 basidiomycete leaves). Above it PTN000933267 (201
      leaves) carries GO:0102772 sphingolipid C4-monooxygenase activity (3 seeds) and GO:0046520. No
      loss recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000221174
    evidence_checked:
    - 'QuickGO by GO id: O94298 sur2 GO:0042284 IGI PMID:22542487 (PomBase, with SGD:S000002705) plus
      IBA; P38992 SUR2 has GO:0102772 IMP PMID:9556590 and no experimental GO:0042284.'
    - 'publications/PMID_22542487.md (abstract only): trypanosomatid genes were expressed in an S.
      cerevisiae sur2 deletion mutant "which lacks C4-hydroxylase activity", with "the Schyzosaccharomyces
      pombe sphingolipid desaturase (SpSLdes)" as positive control.'
    - 'PubMed PMID:12633877 abstract (doi:10.1016/s0014-5793(03)00163-7): the S. pombe dihydroceramide
      delta-4 desaturase is SPBC3b8.07c (dsd1, O59715), which QuickGO shows with GO:0042284 IDA.'
    - publications/PMID_9556590.md quotes in the review (SYR2 required for 4-hydroxylation).
    review_edited: false
    notes: >-
      REMOVE rests on target evidence: S. cerevisiae Sur2 is the C4-hydroxylase and the sur2 mutant used
      as the desaturase-free host in the seed paper. Lead, not proven: the single seed may be a
      wrong-gene annotation, since the "S. pombe sphingolipid desaturase" of PMID:22542487 is probably
      dsd1 (a DEGS-family protein, not in PTHR11863) and not sur2. Full text not read, so this is a CHECK
      query for PomBase; if confirmed the fix is REMOVE_IBD at PTN000933245 (BAD_SEED) and not a leaf
      IRD. The review's propagation_review says the donor was not inspected; left as is.
- gene_file: genes/DICDI/gcA/gcA-ai-review.yaml
  rows:
  - go_id: GO:0007168
    go_label: receptor guanylyl cyclase signaling pathway
    family: PTHR11920
    ibd_node: PTN000229249
    tree_reading: >-
      IBD at PTN000229249 (518 leaves, 45 species), 6 seeds (human NPR1 P16066 and NPR2 P20594, two rat
      genes, worm WBGene00000907, fly FBgn0266136). Children: PTN007548636 (150 leaves, protists and one
      Mycobacterium leaf; Trichomonas 78, Chlamydomonas 61) and PTN001728742 (368 leaves). PTN001728742
      splits into PTN002629594 (364 leaves, 36 species, metazoan; holds NPR1, NPR2 and Gyc76C) and
      PTN007548635 (4 leaves, Dictyostelium only), which splits into PTN000938100 (acgA, 2 leaves) and
      PTN000937906 (gcA, 2 leaves, the target). PAINT already records NOT IRD GO:0007168 at PTN000938100
      but nothing at PTN000937906, so the target still inherits the term.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002629594
    evidence_checked:
    - 'QuickGO by GO id (8 hits): P16066 NPR1 GO:0007168 IDA PMID:1672777 and TAS; P20594 NPR2 IDA
      PMID:1672777 and IMP PMID:26980729.'
    - Children of PTN001728742 and PTN007548635 listed with a helper built on treeview.py (same tree
      cache and IBD snapshot).
    - No family review exists at interpro/panther/PTHR11920/.
    review_edited: true
    notes: Action unchanged. Reason extended with the tree reading, and the seed label for
      UniProtKB:P16066 corrected from GUCY2C to NPR1 (the tree and QuickGO both show NPR1). A smaller
      alternative fix is ADD_IRD at PTN000937906, mirroring the existing loss on acgA; MOVE_IBD is
      preferred because the 150-leaf protist clade has no receptor cyclase seed either. The TAS row on
      the same term (PMID:15473840) is MARK_AS_OVER_ANNOTATED; not a todo row and left alone.
  - go_id: GO:0001653
    go_label: peptide receptor activity
    family: PTHR11920
    ibd_node: PTN000229249
    tree_reading: >-
      IBD at PTN000229249 (518 leaves), 5 seeds (human NPR2 and NPR1, rat RGD:69322, mouse MGI:97372, fly
      FBgn0266136), all animal genes; the human and fly seeds are in the metazoan clade PTN002629594
      (364 leaves). The target is in the Dictyostelium clade PTN007548635 (4 leaves), sister to it under
      PTN001728742. No loss for GO:0001653 anywhere on the Dictyostelium side; the acgA clade
      PTN000938100 has IBD GO:0004016 adenylate cyclase activity and NOT IRD GO:0004383.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002629594
    evidence_checked:
    - 'QuickGO by GO id with descendants (10 hits): NPR1 and NPR2 carry GO:0016941 natriuretic peptide
      receptor activity IDA PMID:1660465, PMID:1672777.'
    - publications quoted in the review (PMID:11522784) describe the 12-TM, two-cyclase-domain topology.
    review_edited: true
    notes: Action unchanged; reason extended with the tree reading.
