    family: PTHR13042
    ibd_node: PTN000315756
    tree_reading: >-
      IBD at the family root PTN000315756 (127 leaves, 86 species), one seed, yeast HUB1
      (SGD:S000007251, Q6Q546). Children: PTN000315757 (58 leaves, 45 species; animals and fungi,
      holding the target P91302 under PTN000315759, 39 leaves) and PTN007600650 (69 leaves; plants and
      protists, no seed). The same root carries IBDs for nucleus, cytosol, GO:0000398 mRNA splicing via
      spliceosome (2 seeds) and GO:0036211 protein modification process (1 seed). No loss recorded.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000315756
    evidence_checked:
    - 'QuickGO by GO id, yeast taxon, exact term (27 hits): HUB1 Q6Q546 GO:0031386 IDA PMID:11923536
      (SGD, 2013) plus IBA. It is the only experimental row behind the node.'
    - 'PubMed PMID:11923536 abstract (doi:10.1126/science.1069989): reports Hub1 as a posttranslational
      modifier conjugated to Sph1 and Hbt1.'
    - 'PubMed PMID:14608371 abstract (doi:10.1038/sj.embor.7400025): HUB1 "lacks a C-terminal tail
      bearing a glycine residue"; its SDS-resistant adducts "are not formed through covalent C-terminal
      conjugation of HUB1 to substrates" and persist when the C-terminus is altered or ATP is depleted.'
    - 'QuickGO ontology: GO:0031386 is defined as a function of a protein "that is covalently attached"
      to another protein.'
    - No family review file for PTHR13042.
