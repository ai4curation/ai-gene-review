      Same node and topology as horse CH25H above: IBD at PTN000221246 (391 leaves), 8 seeds on both
      sides of the root split; target Q9Z0F5 is in child PTN000221247 (187 leaves), inside PTN002627316
      (22 leaves), where it is itself one of the two seeds of the GO:0001567 cholesterol 25-hydroxylase
      IBD. No IRD for GO:0000254 in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
