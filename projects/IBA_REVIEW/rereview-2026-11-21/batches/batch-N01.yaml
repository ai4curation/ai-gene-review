- gene_file: genes/ECOLI/paaG/paaG-ai-review.yaml
  rows:
  - go_id: GO:0006635
    go_label: fatty acid beta-oxidation
    family: PTHR11941
    ibd_node: PTN000941828
    tree_reading: >-
      IBD at PTN000941828, the family root (560 leaves, 115 species), 4 seeds: human ECHS1 P30084, rat
      Echs1 (RGD:69330), mouse Eci1 (MGI:94871), rat Eci1 (RGD:61892). Children: PTN000235142 (487
      leaves, 101 species) and PTN001733184 (73 leaves, 18 species, bacteria only), which holds the
      target P77467 (via PTN002631820, 14 leaves) next to fabM, pksI and caiD-like leaves. All four seeds
      sit inside PTN000234547 (474 leaves) within PTN000235142: ECHS1 under PTN000235143 (88 leaves),
      Eci1 under PTN000234959 (50 leaves). No seed and no other PAINT record exists in the target's
      73-leaf bacterial clade. No loss recorded for the term.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000234547
    evidence_checked:
    - 'QuickGO by GO id (25 hits): ECHS1 P30084 IDA PMID:26251176; rat Echs1 P14604 IMP PMID:12379132;
      rat Eci1 P23965 IDA PMID:11781327; mouse Eci1 P42125 IMP PMID:11916962.'
    - Seed lineages read from the same tree cache with a helper built on treeview.py; MGI/RGD ids mapped
      to Eci1/Echs1 through the co-seeded IBDs in the pinned IBD.gaf (GO:0004165 at PTN000234961) and
      the QuickGO symbols.
    - publications/PMID_22961985.md quotes already in the review (octanoyl conformations not possible in
      PaaG).
