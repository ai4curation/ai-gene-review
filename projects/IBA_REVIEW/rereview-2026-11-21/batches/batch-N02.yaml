- gene_file: genes/worm/dct-1/dct-1-ai-review.yaml
  rows:
  - go_id: GO:0043653
    go_label: mitochondrial fragmentation involved in apoptotic process
    family: PTHR15186
    ibd_node: PTN001032684
    tree_reading: >-
      IBD at the family root PTN001032684 (64 leaves, 31 species), one seed, human BNIP3 Q12983. The root
      is a Nematostella leaf plus PTN000390197 (63 leaves). Inside it the seed sits in the vertebrate
      BNIP3 clade PTN002689498 (25 leaves), which separates from the BNIP3L/NIX clade PTN002689506 (28
      leaves) at PTN000795991 (53 leaves); that deuterostome side reaches PTN000390198 (56 leaves). The
      target dct-1 Q09969 (leaf PTN000390273) is in the protostome clade PTN000390271 (7 leaves: three
      nematodes, fly BNIP3, Anopheles, Tribolium, Daphnia). PAINT records a loss in the family for another
      term only (NOT IRD GO:0000423 mitophagy at PTN002689506), none for this term.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002689498
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned hits): Q12983 BNIP3 GO:0043653 IDA
      PMID:20436456 (BHF-UCL) is the only experimental row; O55003 mouse Bnip3 has an ISO from it; O60238
      BNIP3L and Q09969 dct-1 carry the IBA only.'
    - Family review PTHR15186-review.yaml assesses the node TOO_DEEP ("At most a vertebrate BNIP3 (SF4)
      property") and records MARK_AS_OVER_ANNOTATED for fly BNIP3 and the NIX clade.
    - genes/DROME/BNIP3/BNIP3-ai-review.yaml carries MARK_AS_OVER_ANNOTATED on the same IBA.
    - Gene review rows on dct-1, GO:0006915 apoptotic process IMP (KEEP_AS_NON_CORE) and GO:0043065 IBA
      (KEEP_AS_NON_CORE), show the review does not treat an apoptotic role as excluded.
    review_edited: true
    notes: Tier 2 lead confirmed. The earlier REMOVE rested on the single seed and on the absence of worm
      data; the one positive worm observation it cited (fragmented networks on loss of dct-1) comes from
      failed mitophagy and does not test apoptotic fragmentation. Nothing shows loss or divergence in the
      target, and mitochondrial fragmentation during apoptosis is not absent from nematodes as a lineage, so
      no README ground applies. The node placement is doubtful, which is the MARK_AS_OVER_ANNOTATED case.
      The family review's statement that worm DCT-1 warrants REMOVE on the loss phenotype is, in my
      reading, not supported for the same reason; not edited here. History record
      history/genes/worm/dct-1/2026-11-21T213342Z-claude-code-a6bb94.yaml.
