genes:
- gene_file: genes/worm/mut-7/mut-7-ai-review.yaml
  rows:
  - go_id: GO:0000724
    go_label: double-strand break repair via homologous recombination
    family: PTHR13620
    ibd_node: PTN008550068
    tree_reading: >-
      IBD at PTN008550068 (866 of the family's 868 leaves, 91 species) with one seed, human EXD2 Q9NVH0.
      The seed's lineage is PTN008348238 (22 leaves) < PTN000341343 (23) < PTN000341342 (24 leaves, the
      deuterostome EXD2 clade: vertebrates, Ciona, Branchiostoma, sea urchin). The target mut-7 P34607
      (leaf PTN000341331) sits in the sister clade PTN002670856 (12 leaves: C. elegans and C. briggsae
      mut-7 and ZK1098.3, Drosophila Nbr and Exd2, Anopheles, Daphnia, Ixodes, Helobdella); the two meet
      at PTN000341341 (36 leaves). Above that the node still has to climb through PTN002299009 (61),
      PTN000341338 (802) and PTN008550069 (864) to reach the IBD node. One seed in a 24-leaf clade carries
      a process term to 866 leaves. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000341342
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned hits): Q9NVH0 EXD2 GO:0000724 IDA
      PMID:26807646 (UniProt) is the only experimental annotation behind the node; P34607 mut-7 has the
      IBA only.'
    - No family review exists for PTHR13620 (interpro/panther/PTHR13620 absent).
    - Gene review quotes PMID:39188014 (Nibbler/MUT-7 EXO domain specific to single-stranded RNA) and
      PMID:22713602 (Mutator foci); quotes are in the review and were not re-fetched.
    review_edited: false
    notes: Existing reason names the node and the sole EXD2 seed and rests on the RNA specialisation of
      MUT-7, so it was left unchanged. Its phrase "paralog lineage" is loose (in this tree the EXD2 clade
      PTN000341342 and the protostome clade holding mut-7 are sisters under PTN000341341), but the claim
      that the seed is outside the target's clade is correct.
  - go_id: GO:0005759
    go_label: mitochondrial matrix
    family: PTHR13620
    ibd_node: PTN002299009
    tree_reading: >-
      IBD at PTN002299009 (61 leaves, 42 species), 2 seeds: human EXD2 Q9NVH0 and FB:FBgn0037901 (fly Exd2
      Q9VGN7). The node has two children, PTN000341340 (56 leaves, holding the target and both seeds) and
      PTN009011099 (5 Dictyostelium leaves). Human EXD2 is in PTN000341342 (24 leaves, deuterostome EXD2
      clade); fly Exd2 is in the target's protostome clade PTN002670856 (12 leaves), inside PTN007618331
      (11 leaves), where it pairs with fly Nbr (own branch PTN000341375, 3 leaves, under PTN001006804, 7
      leaves). mut-7 P34607 pairs with C. briggsae mut-7 at PTN000341328 (2 leaves), sister of the
      ZK1098.3 pair PTN002299014 (2 leaves) under PTN001784238 (4 leaves, a nematode duplication). So the
      seeds bracket the target and the node is soundly seeded; the question is loss in the mut-7 branch.
      No PAINT loss for the term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000341328
    evidence_checked:
    - 'QuickGO by goId with descendants: Q9NVH0 EXD2 GO:0005759 EXP PMID:29335528 (UniProt), plus
      GO:0005741 mitochondrial outer membrane IDA PMID:29599527 and PMID:31127291; Q9VGN7 fly Exd2
      GO:0005759 IDA PMID:29335528 (FlyBase); Q9VIF1 Nbr and P34607 mut-7 carry the IBA only for
      GO:0005739 and descendants.'
    - Gene review rows on mut-7 itself, GO:0005829 cytosol IDA (two rows) and GO:0005634 nucleus IDA, with
      the quoted PMID:15653635 (nuclear and cytosolic complexes) and PMID:22713602 (perinuclear germline
      Mutator foci).
    - No family review exists for PTHR13620.
    review_edited: false
    notes: Existing reason rests on the experimentally established compartments of MUT-7 (cytosol, nucleus,
      perinuclear Mutator foci), which is evidence on the gene, and it names the node; left unchanged. The
      IRD is proposed at the mut-7 pair PTN000341328 because the nematode duplication at PTN001784238
      separates mut-7 from ZK1098.3, on which nothing was checked. Fly Nbr, a cytoplasmic small-RNA
      trimming nuclease in the same 11-leaf clade, probably needs the same loss but is not in this batch.
- gene_file: genes/SCHPO/rqh1/rqh1-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR13710
    ibd_node: PTN000344873
    tree_reading: >-
      IBD at the family root PTN000344873 (756 leaves, 129 species), 6 seeds. The root splits into the
      bacterial clade PTN004433494 (39 leaves, holding the seed E. coli RecQ P15043) and PTN000344874 (717
      leaves, holding the target and the other seeds). Inside the 717-leaf clade the seeds are human RECQL4
      O94761 (branch PTN002299856, 80 leaves, joining the target's lineage only at PTN004433490, 715
      leaves), Trypanosoma Q57TU4 (branch PTN007621599, 125 leaves, joining at PTN001415789, 270 leaves)
      and human RECQL5 O94762 (branch PTN009012067, 41 leaves, joining at PTN009012066, 138 leaves); the
      fly and mouse seeds are given as FB:FBgn0040290 and MGI:MGI:1328362. The target rqh1 Q09811 (leaf
      PTN000345063) is in the fungal Sgs1/Rqh1 clade PTN000345050 (15 leaves), inside the BLM/Sgs1 clade
      PTN008348787 (97 leaves), which holds no seed. PAINT already records one loss for this term, NOT IRD
      at PTN007621582 (17 leaves, Puccinia and S. japonicus SF145), so the curator has pruned this term in
      another fungal branch. The nucleus IBD sits lower, at PTN001415789 (270 leaves, 10 seeds).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008550688
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned experimental hits for P15043 recQ IDA
      PMID:2164680, O88700 mouse Blm IDA PMID:17982445, O94762 RECQL5 NAS and HPA IDA): Q09811 rqh1,
      P35187 Sgs1 and P54132 BLM each return only the IBA.'
    - Gene review quote from PMID:12724426 ("Rqh1 localized to the nucleus throughout the cell cycle"),
      and its experimental rows GO:0005634 EXP, GO:0000228 IDA, GO:0005730 IDA, GO:0035861 IDA.
    - interpro/panther/PTHR13710/PTHR13710-review.md treats this propagation as a true over-propagation
      for Rqh1 (cross-subfamily, seeds in RECQL1/RECQL4/RECQL5 siblings) and removes it.
    review_edited: false
    notes: Flagged tier 1 (absence of evidence) by the reason scan, but the reason rests on a direct
      localisation result for the gene (nuclear throughout the cell cycle) and on the seeds lying in
      sibling RecQ subfamilies, which the tree confirms, so it was left unchanged. The IRD is proposed at
      PTN008550688 (rqh1 plus its S. japonicus ortholog, 2 leaves) because the direct evidence is on Rqh1
      only; mouse Blm in the same 97-leaf clade does carry a cytoplasm IDA, so a loss for the whole
      BLM/Sgs1 clade would not be justified.
- gene_file: genes/ECOLI/hemW/hemW-ai-review.yaml
  rows:
  - go_id: GO:0006779
    go_label: porphyrin-containing compound biosynthetic process
    family: PTHR13932
    ibd_node: PTN000358281
    tree_reading: >-
      IBD at the family root PTN000358281 (140 leaves, 102 species), 4 seeds. The root splits into
      PTN008552838 (35 leaves, the RSAD1 clade, no seed) and PTN000358280 (105 leaves, all four seeds and
      the target). Inside PTN000358280 two seeds are HemN enzymes in the HemN clade PTN000358335 (16
      leaves, SF6): P. aeruginosa hemN P77915 and Synechocystis hemN P74132; that node carries the IBD for
      GO:0051989 coproporphyrinogen dehydrogenase activity. The other two seeds are HemW-subfamily (SF5)
      proteins in PTN008552848 (85 leaves): B. subtilis hemW P54304 (branch PTN007629324, 9 leaves) and
      Synechocystis hemW P73245 (branch PTN008552849, 49 leaves). The target E. coli hemW P52062 (leaf
      PTN000358332) is in the same 85-leaf clade, in PTN000358325 (17 leaves, proteobacterial HemW). So
      the target is not outside the seeded clade: two seeds share its HemW clade. No PAINT loss for the
      term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000358335
    evidence_checked:
    - 'QuickGO by goId with descendants: P54304 GO:0006779 IMP PMID:10498703 (UniProt); P73245 GO:0006783
      heme biosynthetic process IMP PMID:20194361; P74132 GO:0006783 IMP PMID:20194361; P77915 GO:0006783
      IMP PMID:9767567; P52062 hemW has IBA, IEA and an ISS from Q9CGF7.'
    - 'PubMed abstract of PMID:20194361 (doi:10.1093/pcp/pcq023): of the two HemN-like Synechocystis
      proteins only Sll1876 showed coproporphyrinogen oxidase activity, and "There was no detectable
      phenotype in Deltasll1917"; which of the two is P73245 was not confirmed against UniProt here, but
      P73245 is the SF5 HemW-type protein in the tree.'
    - 'PubMed abstract of PMID:10498703 (doi:10.1128/JB.181.19.5922-5929.1999): a B. subtilis hemN hemZ
      double mutant grew normally aerobically and anaerobically.'
    - publications/PMID_29282292.md (E. coli HemW is a heme chaperone) and the UniProt CC FUNCTION line
      quoted in the review (no coproporphyrinogen III dehydrogenase activity in vitro).
    - Family review PTHR13932-review.yaml assesses the node TOO_DEEP and places the process at
      PTN000358335.
    review_edited: true
    notes: Action unchanged, reason rewritten. The earlier summary and reason said the node's evidence
      came from HemN-type enzymes and that HemW is outside the clade performing the step; the tree shows
      two of the four seeds are HemW-subfamily proteins in the target's own clade PTN008552848. The
      REMOVE now rests on the direct evidence for E. coli HemW itself. PAINT fix is a move to the HemN
      node PTN000358335, which also requires the two HemW seed annotations (P54304, P73245) to be
      re-examined at source; batch-H02 gave PTN000358280 for RSAD1, which would not take the term off
      E. coli HemW. The IEA and ISS rows on the same term stay REMOVE and were not touched.
