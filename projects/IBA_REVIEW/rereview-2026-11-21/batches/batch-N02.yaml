- gene_file: genes/worm/jmjd-3.1/jmjd-3.1-ai-review.yaml
  rows:
  - go_id: GO:0000978
    go_label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    family: PTHR14017
    ibd_node: PTN000361179
    tree_reading: >-
      IBD at PTN000361179 (110 of 118 leaves, 52 species), 2 seeds given as MGI:MGI:1095419 and
      MGI:MGI:894810 (mouse Kdm6a O70546 and Uty P79457 by their QuickGO annotations). Both seeds sit in
      the vertebrate KDM6 clade PTN000361194 (51 leaves, which also holds KDM6B); their own common
      ancestor is PTN009015954 (17 leaves, the KDM6A/UTY clade). The target jmjd-3.1 Q95QK3 (leaf
      PTN000361267) is in the sister clade PTN002678913 (26 leaves: nematode jmjd-3.1/3.2/3.3 and utx-1,
      fly Utx, other arthropods, Helobdella); the two clades meet at PTN000361193 (77 leaves), where the
      H3K27 demethylase IBD sits. The IBD for this term is placed five nodes above that, at a node whose
      other child PTN009015966 (12 leaves) is Trichomonas, Thalassiosira and Phytophthora. No PAINT loss
      for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009015954
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned hits): O70546 Kdm6a GO:0000978 IDA
      PMID:22949634 (MGI); P79457 Uty GO:0000978 IDA PMID:22949634 (MGI); Q5NCY0 Kdm6b, O15550 KDM6A and
      O15054 KDM6B carry the IBA only. The whole node rests on one paper about two mouse paralogs.'
    - publications/PMID_22949634.md is not cached, so what assay the two MGI IDA rows record was not
      read; whether the seeds are themselves sound was not established.
    - No family review exists for PTHR14017.
    review_edited: false
    notes: Tier 3 (no node cited). The existing reason does not name the node but rests on a real
      ground for the target (no sequence-specific DNA-binding domain; recruitment through transcription
      factors such as UNC-3, PMID:25124442), and the tree supports it, so the file was left alone. The same
      review accepts GO:0031490 chromatin DNA binding from the same node (one seed, mouse Kdm6a IDA
      PMID:23658530); that row is outside this batch, but its node placement has the same weakness and a
      later pass may want to look at it.
- gene_file: genes/mouse/Acd/Acd-ai-review.yaml
  rows:
  - go_id: GO:0042162
    go_label: telomeric repeat DNA binding
    family: PTHR14487
    ibd_node: PTN002683935
    tree_reading: >-
      IBD at PTN002683935 (19 of the family's 20 leaves, 18 species), 3 seeds: MGI:MGI:87873 (mouse Acd,
      the target itself), human ACD Q96AP0 and ZFIN:ZDB-GENE-081022-45 (zebrafish tpp1/acd A0A1D5NT19).
      The node has two children: PTN008555897 (16 leaves, tetrapod ACD, holding the target Q5EE38 at leaf
      PTN000375513 and the human seed) and PTN002683939 (3 fish leaves, holding the zebrafish seed). The
      seeds therefore cover both children and the placement follows them; the question is whether the
      seed annotations are sound. No PAINT loss for the term in the family.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002683935
    evidence_checked:
    - 'QuickGO by goId with descendants: Q96AP0 ACD GO:0042162 IDA PMID:23685356 (BHF-UCL); Q5EE38 mouse
      Acd IDA PMID:23685356 (BHF-UCL); A0A1D5NT19 zebrafish acd IDA PMID:21311760 (ZFIN).'
    - 'publications/PMID_23685356.md (full text cached): the assay is a telomeric-DNA pull-down from
      nuclear extracts, and the paper''s own introduction says only TRF1, TRF2 and POT1 bind telomeric DNA
      directly.'
    - 'PMID:21311760 full text (PMC3032778, Europe PMC, doi:10.1371/journal.pone.0016440): the zebrafish
      evidence is telomere localisation by ChIP ("zfTPP1 could localize to the telomeric chromatin"), not
      a DNA-binding assay on the protein.'
    - Gene review quotes PMID:18185984, PMID:31216472 and PMID:35201900 (purified TPP1 does not bind DNA;
      no DNA contact in the cryo-EM structure); not re-fetched.
    - Family review PTHR14487-review.yaml assesses this node WRONG_NODE for the term, on the same
      evidence.
    review_edited: false
    notes: The target is itself a seed (inventory target_is_seed True; treeview prints False only because
      the seed is given as an MGI id). The IBA and the mouse IDA row it rests on are both REMOVE in the
      review and were judged together; the IDA is a whole-extract pull-down contradicted by direct assays
      on purified TPP1. All three seeds turn out to be indirect (two pull-downs, one ChIP), so the fix is
      at the seeds and the IBD goes with them.
