      QuickGO GO:0008783: seeds as for the other PTHR11358 rows (P60651 IDA PMID:3081491,
      Q57757 EXP PMID:22439800, Q5JI38 IMP PMID:20675472, P46637 and Q9ZPF5 IDA PMID:28716421);
