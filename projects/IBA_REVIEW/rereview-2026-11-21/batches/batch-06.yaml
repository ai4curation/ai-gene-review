- gene_file: genes/yeast/PXA1/PXA1-ai-review.yaml
  rows:
  - go_id: GO:0007031
    go_label: peroxisome organization
    family: PTHR11384
    ibd_node: PTN004256010
    tree_reading: >-
      The IBD sits at PTN004256010 (239 leaves). Its two seeds are human ABCD3 (P28288) and
      human ABCD1 (P33897). Both lie in PTN008966961 (115 leaves), which splits into
      PTN000890262 (35 leaves, the ABCD3 clade) and PTN000147193 (80 leaves). PTN000147193
      splits into PTN000890213 (54 leaves, metazoan ABCD1/ABCD2, holding the ABCD1 seed) and
      PTN008966979 (26 leaves, 13 fungal species), which is the PXA1 clade PTN000890228 (13
      leaves) plus the PXA2 clade PTN000890245 (13 leaves). So the fungal clade holding the
      target has no seed, and it sits below the common ancestor of the two seeds, so the IBD
      cannot be moved to a node that keeps both seeds and excludes yeast. No PAINT loss for
      the term is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008966979
    evidence_checked:
    - >-
      QuickGO GO:0007031 with descendants: P28288 IDA PMID:9425230 and IMP PMID:9765053 (UniProt);
      P33897 IDA PMID:9425230 and NAS PMID:8441467; P41909 only the IBA.
    - >-
      publications/PMID_9425230.md and PMID_9765053.md (abstracts only): both report that
      overexpressing ALDP or PMP70 restores peroxisome biogenesis in PEX-defective cells. That
      is suppression by overexpression, not a requirement for the transporter in organelle
      assembly.
    - >-
      publications/PMID_8876235.md (abstract only) contains the review's quote that the yeast
      protein is associated with peroxisomes but not required for their assembly.
    - The family review marks this node and term UNRESOLVED and calls the term doubtful even for ABCD1-3.
    review_edited: false
    notes: >-
      Upheld on the yeast-specific evidence that peroxisomes assemble without Pxa1p/Pxa2p,
      against seeds confined to mammalian paralogs. The stronger fix may be at the seeds: both
      rest on overexpression suppression, and if PAINT curators agree those do not show
      participation, REMOVE_IBD at PTN004256010 would replace the IRD. The existing reason is
      sound and was left alone.
