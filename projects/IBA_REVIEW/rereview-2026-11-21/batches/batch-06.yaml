- gene_file: genes/PSEAE/gbuA/gbuA-ai-review.yaml
  rows:
  - go_id: GO:0047972
    go_label: guanidinopropionase activity
    family: PTHR11358
    ibd_node: PTN004253691
    tree_reading: >-
      The IBD sits at PTN004253691 (34 leaves, 24 species), which also carries the
      guanidinobutyrase IBD and NOT IRD losses of agmatinase activity and putrescine
      biosynthesis. Its children are the single leaf PTN002260450 (P. aeruginosa GpuA Q9I6K2,
      one of the two seeds) and PTN000888137 (33 leaves), which holds the target GbuA
      (Q9I3S3, leaf PTN002260452) together with 32 animal AGMAT sequences including the other
      seed, human AGMAT (Q9BSE5). On the target's lineage the next node up from the leaf is
      PTN004253692 (31 leaves). The two seeds therefore bracket the target, and no node
      contains both seeds while excluding it.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002260452
    evidence_checked:
    - >-
      QuickGO GO:0047972: Q9I6K2 EXP PMID:21600989; Q9BSE5 IDA PMID:36543883; Q9I3S3 only the
      IBA.
    - >-
      The review quotes PMID:12029055 (no activity of purified GbuA with 3-guanidinopropionate)
      and the UniProt function comment; not re-read here.
    review_edited: false
    notes: >-
      Direct negative assay on the target. The review already records the topology and asks
      for a leaf-level NOT in a source_defects entry.
