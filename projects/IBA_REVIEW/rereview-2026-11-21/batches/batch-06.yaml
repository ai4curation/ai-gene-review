- gene_file: genes/human/CRY1/CRY1-ai-review.yaml
  rows:
  - go_id: GO:0043153
    go_label: entrainment of circadian clock by photoperiod
    family: PTHR11455
    ibd_node: PTN002479144
    tree_reading: >-
      The IBD sits at PTN002479144 (278 leaves, 81 species), whose children are PTN000155850
      (139 leaves, animal cryptochromes and 6-4 photolyases) and PTN000155946 (139 leaves,
      plant cryptochromes and fungal photolyases). The three seeds are Drosophila cry (O77059,
      FBgn0025680) and mouse Cry1 (P97784, MGI:1270841) and Cry2 (Q9R194, MGI:1270859), all in
      PTN000155850. The mouse seeds sit with the human target inside PTN000894457 (73 leaves,
      the animal cryptochrome clade that carries the negative regulation of transcription IBD
      and the photolyase loss), in the vertebrate CRY1/CRY2 clade PTN000894458 (51 leaves).
      The target Q16526 is therefore the direct ortholog of a seed. No PAINT loss for the term
      is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: UNDECIDED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO GO:0043153 (and the parent GO:0009648 with descendants): P97784 (mouse Cry1) IMP
      PMID:23616524 (UniProt) plus IBA and IEA; O77059 (fly cry) IMP and IGI rows from
      PMID:14960620, PMID:15258584, PMID:16361445, PMID:22306971, PMID:28489826, PMID:28840790
      (FlyBase); Q16526 only IBA, ISS and IEA.
    - >-
      PubMed abstract of PMID:23616524 (doi 10.1523/JNEUROSCI.4950-12.2013): circadian period
      in Cry1- and Cry2-deficient mice carrying Fbxl3 Afh; entrainment is not mentioned in the
      abstract. Full text could not be retrieved (the PMC efetch returned front matter only),
      so what the UniProt curator based the entrainment IMP on was not seen.
    - >-
      The earlier removal quoted a review sentence (PMID:23133559) that mammalian CRY is not
      required for photo-entrainment.
    - No family review file exists for PTHR11455.
    review_edited: true
    notes: >-
      No ground holds. The seeds include the target's own mouse ortholog, there is no
      human-specific loss, and the node placement follows from having both insect and mouse
      seeds. The earlier reason is in effect a bad-seed claim against the mouse IMP rows, and
      it cannot be sustained from an abstract. The IBA row, and the IEA and ISS rows on the
      same term for consistency, were changed from REMOVE to UNDECIDED. If the full text of
      PMID:23616524 turns out to contain no photic entrainment phenotype, the correction
      belongs at the mouse rows and the PAINT node (REMOVE_IBD or a move to the insect
      photoreceptor clade), and these rows can be revisited then; if it does, KEEP_AS_NON_CORE
      would be the natural action.
