- gene_file: genes/human/AFP/AFP-ai-review.yaml
  rows:
  - go_id: GO:0031667
    go_label: response to nutrient levels
    family: PTHR11385
    ibd_node: PTN000147344
    tree_reading: >-
      The IBD sits at the family root PTN000147344 (91 leaves, 19 species), the only process
      term placed at the root. Its children are PTN002604574 (20 leaves, vitamin D-binding
      protein GC, holding the rat Gc seed P04276) and PTN002604542 (71 leaves: ALB, AFP, AFM).
      Inside the latter, human ALB (P02768) and rat Alb (P02770) sit in PTN008319942 (19 leaves)
      and chicken ALB (P19121) in PTN001348322 (6 leaves), all under PTN000147346 (60 leaves);
      human AFP (P02771) is in PTN000147350 (22 leaves) under PTN002604543 (54 leaves), which
      also holds mammalian ALB. So the seeds straddle the root split, which explains the root
      placement, and AFP is not separated from the ALB seeds by any node that lacks a seed. No
      PAINT loss is recorded.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000147344
    evidence_checked:
    - >-
      QuickGO GO:0031667 with descendants: P02768 (human ALB) IDA GO:0009267 PMID:16245148 and
      IDA GO:0072732 PMID:16153637; P02770 (rat Alb) IEP GO:0007584 PMID:20227002, other rows
      ISS or ISO; P04276 (rat Gc) IEP GO:0031667 PMID:12144717 (RGD); P19121 (chicken ALB) IDA
      GO:0033189 PMID:2746374 (AgBase), other rows ISS; P02771 (AFP) only the IBA.
    - >-
      QuickGO ontology ancestors confirm GO:0033189, GO:0007584, GO:0009267 and GO:0072732 are
      all is_a descendants of GO:0031667.
    - >-
      PubMed abstracts of PMID:12144717 (doi 10.1079/BJNBJN2002611: plasma vitamin D binding
      protein concentration falls with protein and energy deficiency in growing rats) and
      PMID:2746374 (doi 10.1093/jn/119.6.932: vitamin A status and Newcastle disease virus
      infection in chickens; plasma retinol and morbidity). Neither is cached in publications/.
    - >-
      The review's quotes from PMID:16245148, PMID:16153637 and PMID:20227002 (cached) were
      left as they are.
    - No family review exists for PTHR11385.
    review_edited: true
    notes: >-
      Upheld, but the earlier text misstated the seed evidence: it said no experimental
      evidence was found for rat Gc (there is an IEP for the term itself) and treated the
      chicken ALB vitamin A IDA as unrelated (it is a descendant term). Summary, reason and two
      source comments were corrected; the action stands because all five seed papers either
      are not about the protein's response (rice promoter, drug-induced calcium release) or
      record its plasma concentration as an outcome. The two newly counted papers were judged
      from abstracts only, so this BAD_SEED call is weaker than a full-text reading would
      give; a curator who regards an IEP concentration readout as valid support for a
      'response to' term would instead keep the node and mark the AFP row
      MARK_AS_OVER_ANNOTATED. A reference finding elsewhere in the AFP file still calls the
      rat albumin IEP the only experimental row on an endogenous protein in the donor set;
      it lies outside the row and was not edited.
