    tree_reading: >-
      The IBD sits at the family root PTN000153359 (175 leaves, 97 species), with children
      PTN000153421 (94 leaves, mitochondrial ND1 and alpha-proteobacterial nuoH; holds the
      human MT-ND1 seed P03886 and the Drosophila mt:ND1 seed P18929) and PTN000893185 (81
      leaves). PTN000893185 has eight children: several bacterial nuoH clades, including
      PTN000153412 (11 leaves) with the E. coli nuoH seed P0AFD4, and PTN002478970 (57
      leaves), which is Gloeobacter ndhA plus PTN004258287 (56 leaves), itself Synechocystis
      ndhA plus PTN008517892 (55 leaves, 28 land plant species, plastid ndhA, holding the
      target A4GYX1). So seeds lie on both sides of the root split, and the plastid clade is an
      unseeded branch nested among bacterial respiratory complex I subunits. No PAINT loss is
      recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008517892
    evidence_checked:
    - >-
      QuickGO GO:0009060 with descendants: P0AFD4 IMP PMID:9495756 (EcoCyc); P03886 IMP
      GO:0006120 PMID:1959619 and NAS rows; P18929 IDA GO:0006120 PMID:36952377 (ComplexPortal)
      and IC; A4GYX1 only the IBA.
    - >-
      interpro/panther/PTHR11432/PTHR11432-review.yaml assesses the node as NEEDS_PRUNING, with
      pruning at the plastid clade; it names no target node.
    - >-
      The review quotes the UniProt record: chloroplast thylakoid membrane location and
      electron transfer to quinones in the photosynthetic chain.
    review_edited: false
    notes: >-
      Compartment and chain replaced: the plastid NDH complex works in the thylakoid
      photosynthetic electron transport chain. The IRD target is the land plant plastid clade
      only; the two cyanobacterial leaves (Synechocystis, Gloeobacter) are left outside it
      because cyanobacterial NDH-1 also serves respiration, which was not checked here. The
      existing reason is brief but states the divergence and was left alone.
