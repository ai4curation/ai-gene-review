- gene_file: genes/DANRE/polb/polb-ai-review.yaml
  rows:
  - go_id: GO:0006303
    go_label: double-strand break repair via nonhomologous end joining
    family: PTHR11276
    ibd_node: PTN000138687
    tree_reading: >-
      The IBD sits at PTN000138687 (187 leaves, 86 species), one step below the family root.
      Its child PTN000138688 (186 leaves) splits into PTN000138689 (123 leaves) and
      PTN007500947 (63 leaves, plants and protists, holding the Arabidopsis POLL seed Q9FNY4).
      PTN000138689 splits into PTN001345182 (86 leaves: POLL, POLM, DNTT; holds the human POLL
      seed Q9UGP5 and the S. pombe pol4 seed Q09693) and PTN008515861 (37 leaves, the pol beta
      clade, which carries the base-excision repair IBD). Inside the pol beta clade,
      PTN000884937 (35 leaves) splits into PTN000884938 (30 leaves: metazoan POLB plus
      Monosiga, holding zebrafish polb Q6DRD3 and human POLB) and the 5-leaf fungal clade
      PTN008965049, which holds the fourth seed, S. cerevisiae POL4 (P25615). So the seeds
      span all major branches, and one of them is in the target's own 37-leaf clade, as the
      sister of the metazoan pol beta group. No PAINT loss for the term is recorded anywhere
      on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000884938
    evidence_checked:
    - >-
      QuickGO by GO id with descendants: P25615 (POL4) IDA and IMP PMID:10438542, IDA
      PMID:15342630 (SGD); Q09693 (pol4) IDA PMID:25106870 (PomBase); Q9FNY4 (POLL)
      acts_upstream_of_or_within IMP PMID:23660835 (TAIR); Q9UGP5 (POLL) IMP PMID:19806195, IDA
      PMID:30250067 (UniProt). All four seeds carry experimental rows.
    - >-
      Same query for P06746 (human POLB), Q8K409 (mouse), P06766 (rat) and Q6DRD3 (zebrafish):
      only the IBA. No metazoan pol beta carries an experimental NHEJ row.
    - No family review exists for PTHR11276.
    review_edited: true
    notes: >-
      The node placement is defensible phylogenetically (seeds on every major branch), so
      this is not a misplaced IBD. The ground is loss in the metazoan pol beta clade: those
      proteins consist only of the 8-kDa lyase domain and the polymerase domain and lack the
      N-terminal BRCT module that the seeded members (POLL, Pol4) use to join the end-joining
      complex. The earlier reason said there was no experimental descendant on the pol beta
      branch and that budding yeast has no pol beta orthologue; the tree places yeast POL4
      inside the pol beta clade, so the reason and propagation_review were rewritten to state
      the tree correctly. Action unchanged. The BRCT absence is taken from the review's own
      summary (UniProt record and PMID:22018137); it was not re-derived here.
- gene_file: genes/DROME/smo/smo-ai-review.yaml
  rows:
  - go_id: GO:0071679
    go_label: commissural neuron axon guidance
    family: PTHR11309
    ibd_node: PTN000885245
    tree_reading: >-
      The IBD sits at PTN000885245 (33 leaves, 30 species), the Smoothened node, whose children
      are PTN000139395 (31 leaves) and a 2-leaf Nematostella clade PTN000885254.
      PTN000139395 splits into PTN000139396 (25 leaves, deuterostomes) and PTN002601740 (6
      leaves, protostomes: Drosophila smo P91682, Anopheles, Tribolium, Daphnia, Ixodes,
      Helobdella). Both seeds, zebrafish smo (Q5RH73) and rat Smo (P97698), sit inside
      PTN002601731 (22 leaves, vertebrates) within the deuterostome child. The target is in
      the protostome child, across the protostome/deuterostome speciation. PTN002601731
      already carries its own process IBD (GO:0007417 central nervous system development).
      No PAINT loss for the term is recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002601731
    evidence_checked:
    - >-
      QuickGO Q5RH73 GO:0071679: acts_upstream_of_or_within IMP PMID:11566855 (ZFIN, two rows)
      plus the IBA. P97698: involved_in IMP PMID:19946319 (RGD) plus the IBA.
    - >-
      QuickGO P91682 GO:0071679, and GO:0007411 axon guidance with descendants: only this IBA
      (the same query shape returned the experimental rows for the two seeds).
    - >-
      interpro/panther/PTHR11309/PTHR11309-review.yaml assesses this node and term as TOO_DEEP
      and names PTN002601731 as the vertebrate-scoped node.
    review_edited: false
    notes: >-
      Drosophila does have commissural axons, so this is not a LINEAGE ground. The ground is
      placement: both seeds are vertebrate, one with the weaker acts_upstream_of_or_within
      qualifier, and the Shh floor-plate guidance role they describe has no reported fly
      counterpart. The existing reason already argues from node placement and names
      PTN002601731, so the review was left alone.
- gene_file: genes/human/FZD10/FZD10-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11309
    ibd_node: PTN002259328
    tree_reading: >-
      The IBD sits at PTN002259328 (156 leaves, 32 species), which also carries NOT IRD losses
      of GO:0042813 Wnt receptor activity and GO:0005886 plasma membrane. Its children are
      PTN008965249 (155 leaves) and one Nematostella leaf (PTN000885387). PTN008965249 splits
      into PTN000139776 (101 leaves, the secreted Frizzled-related proteins) and PTN002601801
      (54 leaves, seven-transmembrane Frizzleds including FZD10 Q9ULW2 and FZD9 O00144). All
      five seeds (human SFRP1 Q8N474, human SFRP2 Q96HF1, bovine SFRP1 O19116, dog SFRP2
      Q863H1, mouse Sfrp2 P97299 as MGI:108078) sit under PTN002601726 (88 leaves) inside
      PTN000139776. The target is in the other child, across the duplication that separated
      the SFRPs from the FZD9/FZD10 receptors.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000139776
    evidence_checked:
    - >-
      QuickGO GO:0005576 with descendants: Q8N474 IDA PMID:10980594, PMID:17500071,
      PMID:9192640; Q96HF1 IDA PMID:10980594; O19116 IDA PMID:18156211; Q863H1 IDA
      PMID:14709558; P97299 IDA PMID:10654605, PMID:10980594, PMID:9391078. Seeds are sound.
    - QuickGO Q9ULW2 and O00144 (FZD9) GO:0005576 with descendants, only the IBA.
    - >-
      The family review marks the two losses at PTN002259328 as LOSS_TOO_BROAD with MOVE_LOSS to
      PTN000139776 and records that the node also contains FZD9, FZD10 and invertebrate
      Frizzleds. Its GO:0005576 row is still UNRESOLVED pending the tree.
    review_edited: true
    notes: >-
      The earlier reason called PTN002259328 the sFRP1/sFRP2 clade. It is not: it is the
      common ancestor of the SFRP clade and the FZD9/FZD10 receptor clade. The reason and
      propagation_review comment were rewritten to say so; action unchanged. The family
      review's UNRESOLVED assessment of the GO:0005576 IBD can now be settled the same way as
      its two loss rows (move to PTN000139776).
- gene_file: genes/BACSU/hutG/hutG-ai-review.yaml
  rows:
  - go_id: GO:0008783
    go_label: agmatinase activity
    family: PTHR11358
    ibd_node: PTN000144486
    tree_reading: >-
      The IBD sits at the family root PTN000144486 (156 leaves, 101 species), whose
      children are a 2-leaf Paramecium clade and PTN008966328 (154 leaves). PTN008966328 has
      three children: PTN008966329 (143 leaves, subfamily SF26 and the arginases), a 3-leaf
      bacterial clade PTN007502608, and PTN001683871 (8 leaves, all subfamily SF35 HutG:
      Chloroflexus, S. aureus, B. subtilis hutG P42068, Fusobacterium, Shewanella, Vibrio,
      P. aeruginosa PA3175 Q9HZ59, Salmonella). All six agmatinase seeds sit inside
      PTN008966330 (135 leaves) under PTN008966329: E. coli speB P60651, M. jannaschii speB
      Q57757, T. kodakaraensis TK0882 Q5JI38, Arabidopsis ARGAH1 P46637 and ARGAH2 Q9ZPF5 (the
      CGD seed was not located by accession). No seed is in the HutG clade. PAINT already
      records NOT IRD losses of GO:0008783 at PTN000144531 and PTN004253691 and of GO:0009446
      at PTN004253691, so pruning diverged branches under this root IBD is established
      practice in this family; none covers PTN001683871.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001683871
    evidence_checked:
    - >-
      QuickGO GO:0008783: P60651 IDA PMID:3081491 (EcoCyc); Q57757 EXP PMID:22439800; Q5JI38
      IMP PMID:20675472; P46637 and Q9ZPF5 IDA PMID:28716421. Seeds are sound.
    - QuickGO P42068 GO:0008783, only the IBA.
    - >-
      interpro/panther/PTHR11358/PTHR11358-review.yaml assesses the node as NEEDS_PRUNING and
      says SF35 should be blocked; it names no target node.
    - >-
      The gene review carries formimidoylglutamase activity (GO:0050415) by experimental
      evidence as the core function.
    review_edited: false
    notes: >-
      Loss by neofunctionalisation of the whole 8-leaf HutG clade (substrate changed to
      N-formimidoyl-L-glutamate). No direct negative agmatine assay is cited for this protein;
      the ground is the subfamily-wide substrate change, which the existing reason states.
  - go_id: GO:0009446
    go_label: putrescine biosynthetic process
    family: PTHR11358
    ibd_node: PTN000144486
    tree_reading: >-
      Same node and topology as the agmatinase row: IBD at the family root PTN000144486 (156
      leaves) with two seeds, Arabidopsis ARGAH1 (P46637) and ARGAH2 (Q9ZPF5), both deep inside
      PTN008966330 (135 leaves). The target is in the 8-leaf HutG clade PTN001683871, which holds no seed. A NOT IRD loss of
      GO:0009446 already exists at PTN004253691 (the guanidino acid hydrolase clade).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001683871
    evidence_checked:
    - >-
      QuickGO GO:0009446: P46637 IDA PMID:28716421; Q9ZPF5 IDA PMID:28716421 plus
      acts_upstream_of_or_within IDA and IGI from the same paper.
    - The review quotes the UniProt catalytic activity (products formamide and L-glutamate).
    review_edited: false
    notes: Follows the agmatinase row; the products of the HutG reaction exclude putrescine.
