      paint_action: MOVE_IBD
      target_node_id: PTN001944607
    evidence_checked: *pvdj_ev
    review_edited: false
    notes: *pvdj_note
  - go_id: GO:0047527
    go_label: 2,3-dihydroxybenzoate-serine ligase activity
    family: PTHR45527
    ibd_node: PTN002378853
    tree_reading: *pvdj_tree
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001944607
    evidence_checked: *pvdj_ev
    review_edited: false
    notes: *pvdj_note
- gene_file: genes/DANRE/pax6a/pax6a-ai-review.yaml
  rows:
  - go_id: GO:0003309
    go_label: type B pancreatic cell differentiation
    family: PTHR45636
    ibd_node: PTN002900580
    tree_reading: >-
      IBD at PTN002900580 (46 leaves, 19 species) with four seeds: MGI:97488, MGI:97490, RGD:3258 and
      ZFIN:ZDB-GENE-001031-1. Children: PTN009179984 (36 tetrapod leaves, PAX4, PAX6 and Pax10) and
      PTN009180006 (10 fish leaves), which holds the target. pax6a is leaf PTN000676679 inside
      PTN002388700 (3 zebrafish leaves: Pax6.2 A0A0R4IQL7, pax10 and pax6a), PTN000676673 (5 leaves, with
      two medaka leaves) and PTN002900590 (7 leaves, with two gar leaves). No PAINT loss is recorded for
      the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000676679
    evidence_checked:
    - 'Gene review row: PMID:18282108 quotes (only pax6b is expressed in the pancreas; pax6a is not
      induced in the pancreas of the sunrise mutant) and PMID:18485195 quotes (pax6a enhancers A and C
      inactive in the pancreas through divergence of PDX1-binding elements).'
    - 'The review identifies ZFIN:ZDB-GENE-001031-1 as pax6b and treats MGI:97490 and RGD:3258 as Pax6;
      batch-H04 (human PAX4, same node) read the same seed list. The target is not among the seeds: its
      ZFIN id as listed in the mouse Pax4 forebrain row is ZDB-GENE-990415-200.'
    review_edited: false
    notes: The scan flagged redundancy, but the reason is a loss by expression partition after the
      teleost duplication, shown on the target itself, and it accepts the node placement for vertebrate
      Pax6. The loss is pinned to the pax6a leaf; the two other zebrafish leaves in PTN002388700 were not
      assessed and pax6b, the seed, must stay outside the loss.
- gene_file: genes/mouse/Pax4/Pax4-ai-review.yaml
  rows:
  - go_id: GO:0007420
    go_label: brain development
    family: PTHR45636
    ibd_node: PTN008693041
    tree_reading: >-
      IBD at PTN008693041 (85 leaves, 31 species), 6 seeds (FB:FBgn0005558, MGI:97490, RGD:3258,
      ZFIN:ZDB-GENE-001031-1, ZFIN:ZDB-GENE-990415-200 in the row's WITH list). Mouse Pax4 (P32115) is
      in the tetrapod child PTN009179984 (36 leaves) of PTN002900580 (46 leaves), in the same clade as
      the PAX4 and PAX6 leaves of mammals. No Pax4 gene is a seed for this term (MGI:97488, Pax4, seeds
      only the pancreatic beta cell IBD), and no PAINT loss is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000676639
    evidence_checked:
    - 'Gene review row: PMID:40614820 (no extra-pancreatic features in patients with complete PAX4
      loss), PMID:10364449 (Pax4 and Pax6 cannot substitute for each other), PMID:24951566
      (lineage-specific Pax4 roles).'
    - 'batch-H04 judged human PAX4 on the same node and term: REMOVE_UPHELD, ADD_IRD at PTN000676639
      (the mammalian PAX4 clade, 12 leaves). The same action and node are taken here.'
    review_edited: false
    notes: Follows batch-H04 for the human ortholog. The reason is node-aware and rests on divergence
      evidence for the Pax4 lineage; PTN000676639 is the node id the row's own propagation_review names
      for the mammalian Pax4 clade and the one batch-H04 read from the tree.
  - go_id: GO:0030900
    go_label: forebrain development
    family: PTHR45636
    ibd_node: PTN002900580
    tree_reading: >-
      IBD at PTN002900580 (46 leaves, 19 species), 4 seeds, all Pax6 genes (MGI:97490, RGD:3258,
      ZFIN:ZDB-GENE-001031-1, ZFIN:ZDB-GENE-990415-200). Children: PTN009179984 (36 tetrapod leaves
      holding PAX4, PAX6 and Pax10, including the target) and PTN009180006 (10 fish leaves). PAX4 and
      PAX6 separate only below this node, so a Pax6-seeded IBD reaches Pax4.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000676639
    evidence_checked:
    - 'Gene review row: PMID:24951566 quote on the 2R origin of Pax4, Pax6 and Pax10; the cited tree
      path file names the same child nodes treeview shows.'
    - 'batch-H04, human PAX4, same node and term: REMOVE_UPHELD, MISPLACED_IBD, ADD_IRD at
      PTN000676639.'
    review_edited: false
    notes: Same action and PAINT target as batch-H04. With the tree as drawn the IBD cannot be moved to
      a Pax6-only node above the PAX4 branch point, so the workable fix is a loss on the PAX4 clade.
- gene_file: genes/worm/hsp-12.3/hsp-12.3-ai-review.yaml
  rows:
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      IBD at PTN000897708 (293 leaves, 33 species), 7 seeds, all FlyBase genes (Drosophila small heat
      shock proteins). Children: PTN001354880 (279 leaves, holding the target) and PTN000897825 (14
      Nematostella leaves). hsp-12.3 is leaf PTN000163283 in PTN000897764, an 8-leaf clade holding only
      hsp-12.1, hsp-12.2, hsp-12.3 and hsp-12.6 of C. elegans and C. briggsae; that clade sits in
      PTN000897763 (17 leaves, with 9 Pristionchus leaves) and PTN000163277 (106 nematode leaves). No
      PAINT loss is recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000897764
    evidence_checked:
    - 'genes/worm/hsp-12.3/hsp-12.3-goa.tsv: NOT enables GO:0051082 unfolded protein binding, IDA,
      PMID:9744800 (WB).'
    - 'Gene review row: PMID:9744800 quote that Hsp12.2 and Hsp12.3 appear devoid of in vitro
      chaperone-like abilities.'
    - 'QuickGO by goId: Drosophila Hsp27 P02518 GO:0042026 IDA PMID:16572729 and PMID:26705243
      (FlyBase), so the query shape returns positives and the fly seeds are experimental.'
    review_edited: false
    notes: Direct negative assay on the target and a curated NOT row. Three of the four members of the
      Caenorhabditis Hsp12 clade (12.2, 12.3, 12.6) were assayed and lack chaperone activity, so the loss
      is placed on the clade PTN000897764; hsp-12.1 was not assayed, and a curator may prefer leaf-level
      losses. batch-H04 placed a loss for the same IBD on the alphaA-crystallin clade on the same kind of
      evidence. No family review file exists for PTHR45640.
- gene_file: genes/worm/hsp-12.6/hsp-12.6-ai-review.yaml
  rows:
  - go_id: GO:0042026
    go_label: protein refolding
    family: PTHR45640
    ibd_node: PTN000897708
    tree_reading: >-
      Same IBD as hsp-12.3: PTN000897708 (293 leaves, 33 species), 7 FlyBase seeds. hsp-12.6 is leaf
      PTN000163280, paired with its C. briggsae ortholog at PTN000163279 (2 leaves), inside the 8-leaf
      Caenorhabditis Hsp12 clade PTN000897764. No PAINT loss is recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000897764
    evidence_checked:
    - 'genes/worm/hsp-12.6/hsp-12.6-goa.tsv: NOT enables GO:0051082 unfolded protein binding, IDA,
      PMID:9139746 (WB).'
    - 'Gene review row: PMID:9139746 quote that HSP12.6 does not function as a molecular chaperone in
      vitro.'
    review_edited: false
    notes: Same ground and PAINT node as hsp-12.3. The review notes in vivo protective effects of
      hsp-12.6 (lifespan, polyglutamine aggregation); these do not show refolding and the row was left as
      written.
- gene_file: genes/PSEAE/PA4921/PA4921-ai-review.yaml
  rows:
  - go_id: GO:0008610
    go_label: lipid biosynthetic process
    family: PTHR45642
    ibd_node: PTN005219546
    tree_reading: &gdsl_tree >-
      IBD at the family root PTN005219546 (960 leaves, 51 species) with one seed, P. aeruginosa EstA
      (O33407). Children: PTN005219547 (952 leaves, plant, algal and fungal GDSL proteins) and
      PTN005220548 (8 leaves, 5 bacterial species), which holds the seed and both targets. Inside it,
      ChoE (Q9HUP2, leaf PTN002336221) is in PTN008693335 (3 leaves), and EstA and VC_A0218 are in
      PTN008693336 (5 leaves), with VC_A0218 in PTN005220549 (3 leaves, with Salmonella SseJ and
      Xanthomonas EstA). No PAINT loss is recorded for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN005219546
    evidence_checked: &gdsl_ev
    - 'QuickGO by goId for O33407 (3 hits): GO:0008610 IMP PMID:17631636 (UniProt), GO:0009247 IMP
      PMID:17631636 (PseudoCAP), plus the IBA.'
    - 'genes/PSEAE/estA review: the IMP seed row is MARK_AS_OVER_ANNOTATED after a full-text read of
      PMID:17631636 (the authors find no step of rhamnolipid synthesis needing an esterase, and rhlB and
      rhlC are downregulated in the mutant), and a GO_CENTRAL source defect asks for the IBD to be
      withdrawn from PTN005219546.'
    review_edited: false
    notes: The only seed is a necessity phenotype that the seed gene's own review rejects as
      participation, and the target has a different characterised activity (cholinesterase). The reason
      states this and cites the node. The estA review suggests a narrower IBD seeded by Salmonella SseJ on
      PTN005220549; that clade does not contain ChoE.
- gene_file: genes/VIBCH/VC_A0218/VC_A0218-ai-review.yaml
  rows:
  - go_id: GO:0008610
    go_label: lipid biosynthetic process
    family: PTHR45642
    ibd_node: PTN005219546
    tree_reading: *gdsl_tree
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN005219546
    evidence_checked: *gdsl_ev
    review_edited: false
    notes: Same seed defect as PA4921, and the target is a characterised secreted phospholipase
      (hydrolysis, the opposite direction). The reason is long but node-aware and explicitly declines to
      argue from donor count. VC_A0218 is inside PTN005220549, the clade where the estA review suggests a
      SseJ-seeded IBD might be placed; if PAINT does that, VC_A0218 would need its own check, since no
      acyltransferase assay exists for it.
