genes:
- gene_file: genes/worm/mes-1/mes-1-ai-review.yaml
  rows:
  - go_id: GO:0004674
    go_label: protein serine/threonine kinase activity
    family: PTHR44535
    ibd_node: PTN001970126
    tree_reading: >-
      IBD at the family root PTN001970126 (52 leaves, 27 species) with one seed, human NEK9 (Q8TD19).
      Its children are PTN002391249 (51 leaves: vertebrate NEK8 and NEK9, their amphioxus and sea urchin
      relatives, and the nematode leaves) and a single Phytophthora leaf PTN002893522. MES-1 is leaf
      PTN000685655, inside PTN002390935 (2 leaves, C. elegans mes-1 and B0198.3) and PTN000685661
      (3 leaves, with C. briggsae CBG16200), which join a Helobdella leaf at PTN002893517 (4 leaves)
      before meeting the NEK8/NEK9 clades at PTN002549629 (50 leaves). No PAINT loss is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IKR
      target_node_id: PTN000685655
    evidence_checked:
    - 'Gene review row: residue claims from mes-1-bioinformatics (HRD Asp replaced by Arg832, DFG Asp
      replaced by Asn860, no glycine-rich loop) and the PMID:11003841 quote that MES-1 lacks residues
      conserved in all kinases and is predicted not to have kinase activity.'
    - Seed list and clade membership read from treeview; they match the row (sole seed Q8TD19).
    review_edited: false
    notes: The reason already rests on loss of the catalytic residues on the MES-1 branch and names the
      node and its seed. The loss is pinned to the MES-1 leaf because the residues of the C. elegans
      paralog B0198.3 and of C. briggsae CBG16200 were not examined; if they share the substitutions the
      loss belongs at PTN002390935 or PTN000685661. The row's own source_defects asks for an IKR.
- gene_file: genes/PSEAE/PA3177/PA3177-ai-review.yaml
  rows:
  - go_id: GO:0043709
    go_label: cell adhesion involved in single-species biofilm formation
    family: PTHR45138
    ibd_node: PTN002895351
    tree_reading: >-
      IBD at PTN002895351 (199 leaves, 26 species) with one seed, E. coli DgcZ (P31129). The node has
      five children; both the seed and the target are in PTN002554534 (152 leaves) and, further down, in
      PTN002554543 (65 leaves, 8 species). There DgcZ is in PTN002895515 (6 leaves) and PA3177 (leaf
      PTN002554550) is in PTN002895498, a clade of 10 P. aeruginosa diguanylate cyclases (PA0290, PA2870,
      PA3177, PA1851, PA4332, PA3343, dgcP, PA1107, PA0169, wspR). PAINT already records NOT IRD for this
      term at PTN008135598 (8 Chloroflexus leaves) and at two single leaves, PTN005206082 and
      PTN005206083.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002554550
    evidence_checked:
    - 'QuickGO annotation search by goId for P31129 and GO:0043709 (2 hits, so the query shape returns
      positives): IMP PMID:19460094 (EcoCyc) with qualifier acts_upstream_of_or_within, plus the IBA.'
    - 'Gene review row: PMID:30082282 quote that inactivation of PA3177 had no effect on attachment and
      biofilm formation.'
    - 'Sibling reviews in the same 10-leaf P. aeruginosa clade: wspR carries the node-level GO_CENTRAL
      defect for this IBD; PA2870, PA3343 and PA1107 have the same IBA as MODIFY.'
    review_edited: false
    notes: The reason scan flagged donor count, but the written reason rests on a direct negative
      result on the gene (deletion attaches and forms biofilm like wild type) and on the seed being an
      upstream regulator; the single seed is mentioned in the summary as a fact, not as the ground. The
      paralogs in the same clade keep the term in modified form, so the loss is pinned to the PA3177
      leaf. A curator may prefer the broader fix requested in the wspR review (withdraw the IBD at
      PTN002895351 or restate it as positive regulation), which would also cover this row.
- gene_file: genes/PSEAE/pvdJ/pvdJ-ai-review.yaml
  rows:
  - go_id: GO:0009239
    go_label: enterobactin biosynthetic process
    family: PTHR45527
    ibd_node: PTN002378853
    tree_reading: &pvdj_tree >-
      IBD at PTN002378853 (6 leaves, 4 species) with one seed, E. coli EntF (P11454). Three children:
      PTN001944607 (2 leaves, E. coli and Salmonella entF), a single Xanthomonas campestris leaf
      PTN001944606 (Q8P449, named entF), and PTN005148629 (3 leaves, all P. aeruginosa: ambB, PA1221 and
      pvdJ), which holds the target (leaf PTN002378925). No PAINT loss is recorded for the term.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001944607
    evidence_checked: &pvdj_ev
    - 'QuickGO by goId for P11454 (queries return hits): GO:0009239 IMP PMID:9485415 (EcoCyc,
      acts_upstream_of_or_within); GO:0009366 IDA PMID:9485415 (EcoCyc); GO:0047527 EXP PMID:216414 and
      IDA PMID:9485415 (UniProt).'
    - 'Gene review: pvdJ has IMP for GO:0002049 pyoverdine biosynthetic process (ACCEPT) and the row
      quotes PMID:15271355 on the pyoverdine NRPSs.'
    review_edited: false
    notes: &pvdj_note >-
      The seed sits in the enterobacterial EntF clade and the target in a P. aeruginosa-only sister
      clade whose three members make other products (pyoverdine for PvdJ, AMB for AmbB). NRPS product
      identity is set by each enzyme's own modules, so the enterobactin-specific terms belong on the EntF
      clade. The move target excludes the Xanthomonas leaf because its product was not checked; a curator
      who confirms it makes enterobactin could instead add a loss at PTN005148629. The existing reasons
      state this ground; left unchanged.
