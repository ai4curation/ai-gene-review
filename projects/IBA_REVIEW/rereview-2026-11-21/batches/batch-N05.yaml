    review_edited: false
    notes: Same verdict and fix as human SLC18A3 in batch-H03. The reason's closing clause (no experimental
      composition data) is an absence argument, but the row rests on the cargo versus subunit point made
      for the AP-1 row and its propagation_review names the node, so it was not rewritten.
- gene_file: genes/DANRE/col1a1a/col1a1a-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR24023
    ibd_node: PTN002771199
    tree_reading: >-
      IBD at PTN002771199 (5 leaves, 3 species) with one seed, zebrafish col1a1a itself
      (ZFIN:ZDB-GENE-030131-9102). Children are PTN008601364 (4 leaves, the two zebrafish and two medaka
      type I alpha chains, holding the target leaf PTN000615872) and a single gar leaf PTN002770995.
      The node lies inside PTN002770836 (43 leaves) of the 872-leaf collagen family, whose root carries
      GO:0031012 extracellular matrix with 49 seeds. No other cytoplasm record on the lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002771199
    evidence_checked:
    - 'QuickGO by GO id: col1a1a Q6U1J5 located_in GO:0005737 IDA PMID:19757382 (ZFIN) is the only
      experimental annotation behind the node. A reference query for PMID:19757382 with GO:0005737
      returns 5 hits (four grhl1 entries and col1a1a).'
    - publications/PMID_19757382.md (full text available) searched for collagen, col1a1 and cytoplasm.
      Collagen appears once, as a keratinocyte marker in double fluorescent in situ hybridizations
      with grhl1 (Fig. 2 C,E); the word cytoplasm does not occur. The paper reports col1a1 transcript
      staining, not protein localization.
    - Family review interpro/panther/PTHR24023/PTHR24023-review.yaml exists; grep finds no assessment of
      GO:0005737 at this node.
    review_edited: false
    notes: The target is the node's own seed, so the IBA and the IDA were read together. The seed evidence
      is an mRNA in situ, which cannot place the protein, and the review's reason says so and names the
      node. The review marks the IDA row MARK_AS_OVER_ANNOTATED (because the figures could not be
      inspected) and the IBA REMOVE. The two actions differ in strength but agree in direction (neither
      keeps the claim), and the IBA additionally asserts is_active_in for a secreted matrix protein. The
      full text supports going further on the IDA row (a source defect to ZFIN, transcript localization
      annotated as protein location), which is outside this row and was not edited.
