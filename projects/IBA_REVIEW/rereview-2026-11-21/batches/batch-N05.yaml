    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000607168
    evidence_checked:
    - batch-H03 records rat Slc18a3 Q62666 part_of GO:0030122 IDA PMID:14724281 (RGD) as the only
