- gene_file: genes/yeast/ADK2/ADK2-ai-review.yaml
  rows:
  - go_id: GO:0004017
    go_label: AMP kinase activity
    family: PTHR23359
    ibd_node: PTN000599576
    tree_reading: >-
      IBD at the family root PTN000599576 (1042 leaves, 137 species) with 29 seeds. Children are
      PTN000599577 (1007 leaves, holding the target) and a prokaryotic clade PTN000600096 (35 leaves).
      The target leaf PTN000600049 is in the fungal ADK2 clade PTN000600047 (10 leaves) inside the
      AK3-type clade PTN008598552 (97 leaves, 55 species), which carries its own IBDs for GO:0046899
      nucleoside triphosphate adenylate kinase activity (3 seeds) and GO:0005759 mitochondrial matrix.
      PAINT already records IRD NOT GO:0004017 at PTN000599579 (UMP/CMP kinases), PTN002764060 (AK4)
      and PTN002764136, but not for AK3 or ADK2. Three of the 29 seeds lie inside PTN008598552, fly Ak3
      (FB:FBgn0042094, Q9VGU6), rat Ak3 (RGD:619885, P29411) and Aspergillus nidulans ADK2 Q5BGS1, the
      last in the same 10-leaf fungal clade as the target.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008598552
    evidence_checked:
    - Review quotes PMID:8537371 on the purified yeast protein (GTP:AMP and ITP:AMP activity, ATP not
      accepted as donor), direct biochemical evidence on the target.
    - 'QuickGO by GO id for the three seeds inside the AK3 clade: Q5BGS1 IDA PMID:2040420 (AspGD);
      P29411 IDA PMID:5484813 (RGD) beside a NOT enables GO:0004017 ISO (RGD); Q9VGU6 IDA PMID:19416704
      (FlyBase). According to PubMed, PMID:2040420 (doi 10.1016/0378-1097(91)90146-2) describes
      mitochondrial and cytosolic adenylate kinase isoenzymes in A. nidulans extracts by activity
      staining, before the genes were known, and PMID:19416704 (doi 10.1016/j.cbpb.2009.01.006) is
      about fly AK2; neither abstract shows ATP:AMP activity of the AK3-type protein. Full texts were
      not read.'
    - Family review interpro/panther/PTHR23359/PTHR23359-review.yaml assesses this node and term as
      NEEDS_PRUNING and recommends an IRD for GO:0004017 at PTN008598552, with the rat Ak3 seed to be
      checked first.
    review_edited: false
    notes: Existing reason rests on target-specific biochemistry and its propagation_review names both the
      root node and the AK3 subclade PTN008598552, so it was left as is. The fix node follows the family
      review. The three seeds inside the AK3 clade are a lead, not a finding. They should be checked
      before the IRD is added (the family review mentions only the rat one; the A. nidulans ADK2 and fly
      Ak3 seeds are additional). If any is a sound ATP:AMP measurement, the loss should be narrowed to
      the fungal ADK2 clade PTN000600047 or the yeast leaf.
- gene_file: genes/rat/Slc18a2/Slc18a2-ai-review.yaml
  rows:
  - go_id: GO:0005335
    go_label: serotonin:sodium:chloride symporter activity
    family: PTHR23506
    ibd_node: PTN000607052
    tree_reading: >-
      IBD at PTN000607052 (93 leaves, 32 species; the vesicular monoamine transporter clade) with 2
      seeds, rat Slc18a1 (RGD:3693, Q01818) and worm cat-1 (WB:WBGene00000295, Q9GNP0). Children are
      PTN000607053 (75 leaves, deuterostome VMAT1 and VMAT2, holding the target leaf PTN000607121 and the
      rat seed under PTN000607055, 63 leaves) and the protostome clade PTN002767280 (18 leaves, holding
      cat-1). So each child has one seed. The same node carries GO:0015842 aminergic neurotransmitter
      loading into synaptic vesicle, and GO:0015311 monoamine:proton antiporter activity is placed
      higher at PTN001519357 (259 leaves, 8 seeds). No PAINT loss for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000607052
    evidence_checked:
    - 'QuickGO by GO id: Slc18a1 Q01818 enables GO:0005335 IDA PMID:16926160 (RGD); cat-1 Q9GNP0
      enables GO:0005335 IDA PMID:9870940 (WB); Slc18a2 Q01827 IBA only.'
    - publications/PMID_16926160.md (abstract only) is a study of G-protein regulation of vesicular
      monoamine uptake by VMAT1 and VMAT2. The review quotes PMID:1438304 that uptake by the rat
      transporter is abolished by a protonophore and a V-ATPase inhibitor, and UniProt Q01827 describes
      an electrogenic monoamine/proton antiporter.
    - No family review exists for PTHR23506.
    review_edited: false
    notes: Existing reason is node-aware and argues that both seed annotations use the wrong term, serotonin
      uptake by a vesicular proton antiporter recorded under the Na+/Cl- symport activity of the plasma
      membrane SLC6 transporters. The seeds do show serotonin transport; what is wrong is the coupling
      mechanism in the term, which the mechanism established on the target and family contradicts. The
      full texts of the two seed papers were not read, so the request to RGD and WormBase should be a
      re-typing query (to GO:0015311 or a serotonin transport term). The IBD goes with it.
