    tree_reading: >-
      Same node, seed and topology as GO:0030121 above. IBD at PTN000607168 (33 leaves) with one seed,
      rat Slc18a3 (RGD:62072), in the deuterostome child PTN000607169 (26 leaves); the target is in the
