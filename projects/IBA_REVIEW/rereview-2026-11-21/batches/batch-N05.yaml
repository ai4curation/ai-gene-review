- gene_file: genes/PSEAE/rppH/rppH-ai-review.yaml
  rows:
  - go_id: GO:0000290
    go_label: deadenylation-dependent decapping of nuclear-transcribed mRNA
    family: PTHR23114
    ibd_node: PTN000561806
    tree_reading: >-
      IBD at the family root PTN000561806 (141 leaves, 109 species), 4 seeds (worm dcap-2
      WBGene00003582, fly DCP2 FBgn0036534, yeast DCP2 S000005062, fission yeast dcp2 SPAC19A8.12). The
      root has two children: PTN000561807 (130 leaves, 98 species, eukaryotic Dcp2 proteins, holding
      all four seeds) and PTN001500664 (11 leaves, 11 species, all bacterial rppH, holding the target
      leaf PTN002350419). PTN001500664 carries its own MF IBD GO:0034353 mRNA 5'-triphosphate
      diphosphatase activity (2 seeds). No PAINT loss for GO:0000290 is recorded in the family.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000561807
    evidence_checked:
    - QuickGO by GO id for yeast DCP2 P53550 GO:0000290 returned 6 hits (query shape confirmed
      positive); the seeds are the eukaryotic decapping enzymes named in the tree.
    - Treeview child clades of PTN000561806 read in full; the bacterial clade PTN001500664 has no
      eukaryotic member.
    review_edited: false
    notes: Existing reason is node-aware (names PTN000561806, the eukaryotic seeds and the bacterial
      subclade PTN001500664) and rests on the term describing a eukaryote-only pathway (no cap, no
      deadenylation-dependent decay in bacteria). The seeds sit only in the eukaryotic child, so
      moving the IBD to PTN000561807 fixes all 11 bacterial leaves at once; the review's own
      source_defects entry asks for the same thing.
- gene_file: genes/SCHPO/Epe1/Epe1-ai-review.yaml
  rows:
  - go_id: GO:0032452
    go_label: histone demethylase activity
    family: PTHR23123
    ibd_node: PTN000564171
    tree_reading: >-
      IBD at the family root PTN000564171 (184 leaves, 53 species) with 13 seeds (yeast JHD1
      SGD:S000000853, human KDM2A Q9Y2K7, KDM2B Q8NHM5, PHF8 Q9UPP1, PHF2 O75151, KDM7A Q6ZMT4, and
      mouse, fly, worm and zebrafish members). Children are PTN000564172 (177 leaves, 47 species,
      holding the target and the seeds) and a plant and protist clade PTN008381285 (7 leaves). The
      target leaf PTN000564307 sits with the S. japonicus ortholog (PTN008591201, 2 leaves) in the
      fungal JHD1 clade PTN000564301 (9 leaves), which also holds the seed yeast JHD1 P40034. PAINT
      already records losses for this term in the family, IRD NOT GO:0032452 and NOT GO:0032454 at
      the FBXL19 clade PTN008591189 (21 leaves), but none on the Epe1 branch.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IKR
      target_node_id: PTN000564307
    evidence_checked:
    - 'QuickGO by GO id with descendants for O94603 (3 hits): NOT enables GO:0141052 histone H3
      demethylase activity IDA PMID:16362057 (PomBase), enables GO:0051864 histone H3K36 demethylase
      activity ISO GO_REF:0000024 (PomBase), and the IBA. The GO:0032454 IDA and EXP rows from
      PMID:25838386 that the local GOA snapshot and the review still hold return 0 hits, so PomBase
      has withdrawn them.'
    - QuickGO for yeast JHD1 P40034 (same query shape, 4 hits) GO:0051864 IDA PMID:16362057 and IMP
      PMID:17369256, which confirms the query returns positives and that the nearest seed is a
      direct in vitro demethylase assay.
    - Review row read in full; it quotes PMID:32195666 (no mass shift with purified Epe1) and the
      UniProt caution on Tyr370 replacing the third iron-binding His.
    review_edited: false
    notes: Existing reason is node-aware (names PTN000564171) and rests on target-specific evidence, the
      non-canonical Fe(II) triad (H297, E299, Y370) and undetected activity of purified Epe1 in two
      studies. PomBase now carries an experimental NOT for the child term GO:0141052 from the Tsukada
      2006 assay, which supports the loss; IKR at the Epe1 leaf is named because the argument is a
      key-residue substitution, and whether the S. japonicus ortholog shares Tyr370 was not checked, so
      the 2-leaf node PTN008591201 is not named. Two things for a later reader. (1) The review keeps
      GO:0032454 IDA/EXP rows as UNDECIDED and discusses the parent/child tension at length; live
      GOA no longer has those rows, so that tension has been resolved upstream in favour of this
      REMOVE and the review's GOA snapshot is stale (not edited here, outside this row). (2) PomBase
      also has an ISO to GO:0051864 from JHD1 beside its own NOT on the parent GO:0141052, an
      upstream inconsistency worth a query.
- gene_file: genes/worm/lys-1/lys-1-ai-review.yaml
  rows:
  - go_id: GO:0007165
    go_label: signal transduction
    family: PTHR23208
    ibd_node: PTN000574946
    tree_reading: >-
      IBD at PTN000574946 (59 of the 62 leaves of PTHR23208, 12 species) with one seed, Dictyostelium
      cf50-1 (dictyBase:DDB_G0273175, Q556R7). Children are PTN000574947 (53 leaves, 9 species,
      holding both the target and the seed) and PTN008382983 (6 leaves, Paramecium and plants). Inside
      PTN000574947 the seed leaf PTN001506314 lies in the Dictyostelium-only clade PTN001143558 (7
      leaves), within PTN001143554 (14) and PTN000574977 (21); the target leaf PTN000574966 lies in
      the nematode lysozyme clade PTN001143527 (26 leaves, 3 species, own IBD GO:0045087 innate
      immune response with 3 seeds), within PTN001143524 (32). PAINT places the other BP terms taken
      from the same seed (glucose homeostasis, cell motility, cell-cell adhesion) at PTN001143558,
      not at PTN000574946. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001143558
    evidence_checked:
    - 'UniProt xref lookup maps dictyBase:DDB_G0273175 to Q556R7 (cf50-1). QuickGO for Q556R7 (21 hits):
      acts_upstream_of_or_within GO:0007165 IMP PMID:12117815 (dictyBase), with GO:0042593, GO:0048870
      and GO:0098609 IMP from the same group of papers and GO:0003796 lysozyme activity IDA PMID:39909204.'
    - No family review exists for PTHR23208.
    review_edited: true
    notes: Action unchanged. The earlier reason argued that no experimental or sequence feature supports
      signalling for LYS-1 (absence of evidence) and its propagation_review called the source weak. The
      reason, summary and propagation_review were rewritten to the tree ground, the counting-factor seed
      sits in a Dictyostelium-only clade across several nodes from the nematode lysozymes. History
      record added.
