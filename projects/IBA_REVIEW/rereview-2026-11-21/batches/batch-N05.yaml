    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002755175
    evidence_checked:
    - 'QuickGO by GO id: Tgoln1 Q62313 located_in GO:0005802 IDA (PMID:12488345, PMID:21187406,
      PMID:22841714, PMID:27655914; 7 hits), human TGOLN2 O43493 IDA (PMID:18166528, PMID:22456507,
      PMID:23386608), rat Ttgn1 P19814 IDA PMID:21471008.'
    - Family review interpro/panther/PTHR23211/PTHR23211-review.yaml rates functional coherence UNKNOWN
      and makes no node assessment; it does not contradict this reading.
