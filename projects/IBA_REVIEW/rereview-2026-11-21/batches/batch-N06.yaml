- gene_file: genes/CHICK/TLR15/TLR15-ai-review.yaml
  rows:
  - go_id: GO:0042497
    go_label: triacyl lipopeptide binding
    family: PTHR24365
    ibd_node: PTN002808136
    tree_reading: >-
      IBD at PTN002808136 (32 leaves, 19 species) with two seeds, human TLR2 (O60603) and mouse Tlr2
      (MGI:1346060, Q9QUN7). Children are PTN008615033 (28 leaves, tetrapod TLR2 and the target) and
      PTN002808153 (4 fish leaves). The PANTHER tree places chicken TLR15 inside the TLR2 clade
      PTN000687558 (23 leaves), in the 3-leaf chicken node PTN001970669 with TLR2-1 (Q9DD78) and TLR2-2
      (Q9DGB6), under the sauropsid node PTN001555334 (5 leaves, with two Anolis leaves). So in this tree
      the target is drawn as a chicken TLR2 paralog. No PAINT loss for the term on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001970417
    evidence_checked:
    - 'QuickGO goId=GO:0042497: human TLR2 IDA PMID:17889651 (MGI), mouse Tlr2 IDA PMID:17889651 (MGI).'
    - Review quotes PMID:21383168 (di- and triacylated lipopeptides were tested and "a high dose of
      purified microbial TLR ligands did not activate TLR15"), PMID:36605191 (single-domain ectodomain;
      distinct vertebrate subfamily) and PMID:16495540; read in the validated supported_by block.
    - No family review file for PTHR24365.
    review_edited: false
    notes: The loss rests on a direct negative ligand test on the target, so it holds whatever the true
      phylogeny. The existing reason says there is no clade through which the TLR2 specificity could be
      inherited; that is a statement about the published phylogenies, and it differs from the PANTHER
      tree, which nests TLR15 beside chicken TLR2-1 and TLR2-2. The review was left unedited because its
      propagation_review names the node correctly and the second count carries the verdict. The IRD is
      placed on the TLR15 leaf PTN001970417, since its two sisters in PTN001970669 are genuine TLR2
      copies.
