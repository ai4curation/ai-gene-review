- gene_file: genes/ECOLI/lolD/lolD-ai-review.yaml
  rows:
  - go_id: GO:0055085
    go_label: transmembrane transport
    family: PTHR24220
    ibd_node: PTN000655654
    tree_reading: >-
      IBD at the family root PTN000655654 (294 leaves, 49 species) with three seeds, E. coli NikD
      (P33593), E. coli YejF (P33916) and M. tuberculosis Rv2688c (P9WQL7). The root has four children:
      PTN002383615 (52 leaves, holds Rv2688c), PTN002383688 (32 leaves, holds NikD and YejF), PTN009085280
      (30 leaves, no seed) and PTN000656271 (180 leaves, no seed), which holds the target. Inside it the
      target lineage is PTN000656661 (140 leaves), PTN009085290 (31 leaves) and the LolD node PTN000656700
      (15 leaves, 12 species), which carries its own IBDs for lipoprotein localization to outer membrane
      and protein localization to outer membrane. No PAINT loss for the term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000656700
    evidence_checked:
    - Review quotes PMID:10783239 that LolCDE "is not involved in the transmembrane transport of
      substrates"; read in the validated supported_by block.
    - Family review interpro/panther/PTHR24220/PTHR24220-review.yaml rates this node and term
      NEEDS_PRUNING for LolD (SF689) and FtsE (SF470) on the same quote.
    - Seed annotations not re-queried; the transmembrane claim for NikD, YejF and Rv2688c is not in
      dispute.
    review_edited: false
    notes: Existing reason is node-aware (deep node, LolD clade does not move substrate across the
      bilayer). The target's 180-leaf child also holds genuine exporters, so the fix is a loss on the LolD
      node, not a move of the IBD. The companion GO:0022857 IBA on the same gene is MODIFY to lipoprotein
      releasing activity, which is consistent with removing the process term.
- gene_file: genes/worm/dcar-1/dcar-1-ai-review.yaml
  rows:
  - go_id: GO:0008188
    go_label: neuropeptide receptor activity
    family: PTHR24243
    ibd_node: PTN002797693
    tree_reading: &dcartree >-
      IBD at PTN002797693 (24 leaves, 9 species) with five seeds, C. elegans nmur-2 (WBGene00019616,
      O17239) and Drosophila CapaR, PK2-R1, PK2-R2 and PK1-R. The node has two children: PTN000663831 (22
      leaves; nematode nmur-1, nmur-2 and dcar-1 plus the insect, Daphnia and Ixodes Capa and pyrokinin
      receptors) and PTN008610499 (2 Helobdella leaves). All seeds and the target are in PTN000663831.
      Within its nematode part PTN004683722 (8 leaves), the dcar-1 pair PTN001544255 (C. elegans and C.
      briggsae) is sister to the nmur-2 pair PTN000663855 under PTN008610489 (4 leaves, 2 species), a
      Caenorhabditis-specific duplication. No PAINT loss on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001544255
    evidence_checked:
    - 'QuickGO goId=GO:0008188 with descendants: nmur-2 O17239 IDA and IPI PMID:19133232 (WB); CapaR IPI
      PMID:12177421 and PMID:12459185 (FlyBase); PK1-R and PK2-R1 IPI rows on the child term GO:0036401;
      dcar-1 G5EDI0 IBA only.'
    - UniProt O17239 cross-references WBGene00019616 (nmur-2), confirming the worm seed.
    - Review quotes PMID:25086774 (HPLA as an endogenous ligand; DHCA a potent ligand in vivo and in
      Xenopus oocyte assays). The cached full text has no mention of a neuropeptide ligand for DCAR-1.
    - Family review PTHR24243-review.yaml does not assess this node.
    review_edited: true
    notes: Action unchanged, reason rewritten. The old reason called the source the broad class A GPCR
      family and leaned on the lack of DCAR-1-specific support; the IBD is in fact on the 24-leaf
      neuromedin U and pyrokinin receptor clade and dcar-1 is nested in it beside a seed. The removal now
      rests on divergence of a lineage-specific paralog whose identified ligands are small aromatic
      acids. Caveat for a PAINT curator, also stated in the reason. No one has tested DCAR-1 against
      neuromedin-like peptides, so the loss is inferred from ligand replacement, not from a negative
      assay.
  - go_id: GO:0007218
    go_label: neuropeptide signaling pathway
    family: PTHR24243
    ibd_node: PTN002797693
    tree_reading: *dcartree
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001544255
    evidence_checked:
    - 'QuickGO goId=GO:0007218 with descendants: nmur-2 IDA PMID:19133232 (WB), CapaR IDA PMID:12177421
      (FlyBase); dcar-1 IBA only.'
    - Review quotes PMID:25086774 (HPLA acts through DCAR-1 in the epidermal innate immune response).
