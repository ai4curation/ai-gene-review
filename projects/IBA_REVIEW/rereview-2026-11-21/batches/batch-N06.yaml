- gene_file: genes/PLAF7/CDPK1/CDPK1-ai-review.yaml
  rows:
  - go_id: GO:0005516
    go_label: calmodulin binding
    family: PTHR24349
    ibd_node: PTN000681419
    tree_reading: >-
      IBD at the family root PTN000681419 (2382 leaves, 92 species) with three seeds, Arabidopsis CRK1
      (AT2G41140, O80673), Arabidopsis CRK3 (AT2G46700, Q9ZUZ2) and P. falciparum PK2 (PF3D7_1238900,
      Q8I534). The root has two children: PTN000681610 (2044 leaves) and PTN008614216 (338 leaves). All
      three seeds are in PTN000681610, with smallest common node PTN004694781 (1948 leaves); CRK1 and CRK3
      share PTN008614248 (1799 leaves) and PK2 is in PTN007795927 (112 leaves). The target is in the
      other child, on the lineage PTN002519244 (6 leaves, P. falciparum only), PTN001967748 (205 leaves, 2
      species), PTN008614221 (263 leaves), PTN008614216 (338 leaves, which also holds the MAPKAPK5 clade
      PTN009092397). No seed in the target's child and no PAINT loss on the lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004694781
    evidence_checked:
    - 'QuickGO goId=GO:0005516 with descendants for Q8I534 and P62344: PK2 IDA PMID:18762219 (GeneDB);
      CDPK1 IBA only. UniProt confirms Q8I534 is PF3D7_1238900 protein kinase 2 and maps the two AGI
      codes to O80673 and Q9ZUZ2.'
    - Review quotes PMID:8142371 (kinase activated by Ca2+ alone) and PMID:23204525 (the calmodulin-like
      domain binds the junction domain of the same polypeptide).
    - No family review file for PTHR24349.
    review_edited: false
    notes: Existing reason already states that calmodulin binding belongs to the CaMK and CRK branches and
      not to the clade holding CDPK1, and adds target evidence that the fused calmodulin-like domain
      replaces exogenous calmodulin. The move target is the smallest node holding all three seeds; it is
      still very large (1948 leaves) and includes canonical plant CDPKs, so a PAINT curator may prefer
      separate IBDs on the CRK and PK2 clades. That was not examined further.
- gene_file: genes/DROME/aurB/aurB-ai-review.yaml
  rows:
  - go_id: GO:0005813
    go_label: centrosome
    family: PTHR24350
    ibd_node: PTN001219008
    tree_reading: >-
      IBD at PTN001219008 (86 leaves, 35 species) with five seeds, all Aurora A-type, namely human AURKA
      (O14965), mouse Aurka (MGI:894678), rat Aurka (RGD:628895), Xenopus aurka-a (Q91820) and C. elegans
      air-1 (WBGene00000098). Its children are PTN001219009 (85 leaves) and one Monosiga leaf. Under
      PTN000681969 (83 leaves) the tree splits into a deuterostome clade PTN000681970 (63 leaves; AURKA,
      AURKB and AURKC all inside, holding four seeds) and a protostome clade PTN002806162 (20 leaves). In
      the protostome clade the A and B kinases arise by separate duplications; nematode air-1 and air-2
      pair under PTN001219020 (4 leaves), and insect aurB (PTN004696477, 3 leaves; fly, Anopheles,
      Tribolium) is sister to insect aurA (PTN002806163, 5 leaves) under PTN001219027 (8 leaves). So no
      single child clade holds only A-type kinases, and the target's 3-leaf branch has no seed. No PAINT
      loss for the term on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004696477
    evidence_checked:
    - 'QuickGO goId=GO:0005813 with descendants for the B-type members Q96GD4 (AURKB), Q9UQB9 (AURKC),
      O70126 (mouse Aurkb), O01427 (air-2), Q9VKN7 (fly aurB): no experimental row, IBA only. Same query
      shape returns IDA rows for fly aurA Q9VGF9 (PMID:21402878, PMID:11827981), air-1 G5EDL3
      (PMID:21572421) and AURKA, so the query can return positives.'
    - publications/PMID_11266459.md (full text) Results, "Aurora B Is a Chromosome Passenger Protein"
      section; a specific antibody finds the protein undetectable in interphase, on condensing
      chromosomes in prophase, at centromeres in metaphase, then on the central spindle and the midbody.
    - interpro/panther/PTHR24350/PTHR24350-review.md describes centrosome and spindle pole as the Aurora A
      specialisation; it does not assess this node.
    review_edited: true
    notes: Action unchanged, reason rewritten. The old reason said Aurora B is not reported at
      centrosomes, which read as absence of evidence. The ground is subfunctionalisation of the insect B
      branch, supported by a complete imaged cell-cycle distribution on the target, direct centrosome
      evidence on the sister A paralog, and no experimental centrosome row on any B-type member. The same
      loss would apply to the other B branches (air-2 at PTN001967789; vertebrate AURKB and AURKC), which
      are outside this todo. The gene's spindle pole IBA (node PTN000681968, which has a mouse Aurkb seed)
      is UNDECIDED in the review and was not touched; the two rows differ because the centrosome node has
      A-type seeds only.
- gene_file: genes/DROME/Akt1/Akt1-ai-review.yaml
  rows:
  - go_id: GO:0043536
    go_label: positive regulation of blood vessel endothelial cell migration
    family: PTHR24356
    ibd_node: PTN001219338
    tree_reading: &akttree >-
      IBD at PTN001219338 (42 leaves, 23 species) with two seeds, human AKT1 (P31749) and human AKT3
      (Q9Y243). Its children are PTN000682343 (41 leaves) and one Trichoplax leaf. PTN000682343 splits
      into PTN008402163 (33 leaves; the vertebrate AKT1, AKT2 and AKT3 clade PTN000682345 of 32 leaves
      plus one Ciona leaf) and the protostome clade PTN000682442 (8 leaves; C. elegans akt-1 and akt-2
      and C. briggsae akt-1 under PTN000682443, and fly Akt1 with Anopheles, Daphnia and Ixodes leaves
      under PTN001220054). Both seeds are in the vertebrate clade PTN000682345, where their smallest
      common node is the AKT1 and AKT3 node PTN008614881 (23 leaves); the fly and worm targets are in the
      unseeded protostome clade. No PAINT loss for the term on the lineage.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000682345
    evidence_checked:
    - 'QuickGO goId=GO:0043536 for P31749 and Q9Y243: AKT1 IDA PMID:20011604 (DFLAT), AKT3 IDA
      PMID:28254819 (BHF-UCL).'
    - interpro/panther/PTHR24356/PTHR24356-review.md has no entry for this term.
    review_edited: false
    notes: Blood vessel endothelium is a vertebrate structure, so the term cannot apply in Drosophila.
      Existing reason names the node, the human seeds and the lineage ground. The move target is the
      vertebrate AKT clade (32 leaves), since the ground is the lineage; the seeds alone would support
      the narrower AKT1 and AKT3 node PTN008614881, and whether AKT2 shares the role was not examined.
