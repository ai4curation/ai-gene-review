      IBD at the family root PTN001191022 (120 leaves, 75 species) with two seeds, Arabidopsis ACBP1
      (AT5G53470) and ACBP2 (AT4G27780). The root has two children: PTN008606516 (54 leaves, 34 species;
      metazoan and Dictyostelium ACBD6-like proteins, holding the target) and PTN007775323 (66 leaves, 41
      species; plants and protists). No seed is in the target's child clade and no PAINT loss for the
      term is on the lineage. Per batch-H03 (human ACBD6, same node) both seeds sit in the 7-leaf
      Brassicaceae node PTN001152722 inside PTN007775323.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001152722
    evidence_checked:
    - treeview for rat Acbd6 (Q5RJK8) read in full; the leaf lineage runs PTN000650609 up through
      PTN001191023 (51 leaves) and PTN008606516 (54 leaves) to the root.
    - Family review interpro/panther/PTHR24119/PTHR24119-review.yaml assesses PTN001191022 for this term
      as over-propagation of plant transmembrane ACBP localization onto soluble animal ACBD6.
    - Seed annotations taken from batch-H03, which queried QuickGO by GO id (ACBP1 and ACBP2 IDA rows);
      not re-queried here.
    - The review quotes PMID:12650615 (fusions lacking the transmembrane domain lose membrane targeting).
    review_edited: false
    notes: Same action and PAINT target node as batch-H03 for human ACBD6. Root organelle term, but the
      organelle claim itself fails for the soluble ACBD6 clade, which projects/ORGANELLES.md allows to be
      removed as an over-propagation. Existing reason names the seeds, the node and the missing
      transmembrane helix.
