- gene_file: genes/DANRE/flvcr2a/flvcr2a-ai-review.yaml
  rows:
  - go_id: GO:0097037
    go_label: heme export
    family: PTHR10924
    ibd_node: PTN000858905
    tree_reading: &flvcr_tree >-
      The IBD is at PTN000858905 (77 leaves, 32 species) with one seed, human FLVCR1 (Q9Y5Y0).
      FLVCR1 sits in the vertebrate FLVCR1 clade PTN002589204 (20 leaves, 19 species), which
      carries its own IBDs (mitochondrion, erythrocyte differentiation). FLVCR2 and zebrafish
      flvcr2a sit in the sister vertebrate FLVCR2 clade PTN002589196 (25 leaves, 19 species).
      The two clades meet at PTN000100651 (45 leaves, 19 species), a duplication within
      vertebrates. No seed for heme export lies in the FLVCR2 clade and no loss is recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002589204
    evidence_checked: &flvcr_ev
    - QuickGO Q9Y5Y0 GO:0097037 returned UniProt IMP PMID:15369674 (the seed) and its IBA.
    - QuickGO Q9UPI3 under heme transport returned UniProt IDA GO:0015232 PMID:20823265 and only the IBA for GO:0097037.
    - Gene review quotes PMID:20823265 that earlier work shows FLVCR2 does not export heme.
    - MRCA of FLVCR1 orthologs (human, zebrafish, gar) computed from the cached tree is PTN002589204.
    review_edited: false
    notes: >-
      Also target-specific divergence for the FLVCR2 clade (the human 14q construct did not
      export heme in the assay that defined FLVCR1 export). Existing reason names the node and
      the paralog split. Left as is. No family review exists for PTHR10924.
