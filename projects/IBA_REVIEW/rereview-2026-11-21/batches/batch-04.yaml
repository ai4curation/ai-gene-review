- gene_file: genes/DROME/Tap42/Tap42-ai-review.yaml
  rows:
  - go_id: GO:0031929
    go_label: TOR signaling
    family: PTHR10933
    ibd_node: PTN000101130
    tree_reading: >-
      The IBD is at the family root PTN000101130 (126 leaves, 100 species) with one seed,
      Arabidopsis TAP46 (AT5G53000, Q8LDQ4), in the plant and protist clade PTN007472380
      (65 leaves). Fly Tap42 (Q9VJZ5, leaf PTN000101180) is in the opisthokont clade
      PTN000101131 (61 leaves) together with yeast TAP42 and mammalian IGBP1. Its nearest node
      is PTN000101179 (fly plus Anopheles). No loss is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000101180
    evidence_checked:
    - QuickGO Q8LDQ4 GO:0031929 returned UniProt IMP PMID:21216945 (the seed); Q04372 (yeast TAP42) carries only NAS PMID:15689491 from ComplexPortal plus the IBA; Q9VJZ5 and P78318 carry only the IBA.
    - Gene review quotes PMID:15802506 that Tap42 disruption causes none of the growth, metabolism or S6 kinase defects of TOR inactivation, and cites PMID:17570358 to the same effect.
    review_edited: false
    notes: >-
      The root placement is reasonable (plant seed plus the classic yeast role in the sister
      clade), so the fix is a loss, not a move. The loss evidence is on D. melanogaster only, so
      the IRD is named at the leaf PTN000101180; whether it extends to PTN000101179 or further is
      not established. Existing reason is a target-specific loss argument. Left as is. No family
      review exists for PTHR10933.
- gene_file: genes/ECOLI/moeB/moeB-ai-review.yaml
  rows:
  - go_id: GO:0004792
    go_label: thiosulfate-cyanide sulfurtransferase activity
    family: PTHR10953
    ibd_node: PTN000102040
    tree_reading: &rhod_tree >-
      The IBD is at the family root PTN000102040 (1090 leaves, 134 species) with one seed, yeast
      Uba4 (SGD:S000001153, P38820). Uba4 sits in the MOCS3/Uba4 clade PTN000102537 (52 leaves,
      50 species; MRCA of Uba4 and human MOCS3) inside the eukaryotic E1 clade PTN000102041
      (1049 leaves). E. coli MoeB and ThiF sit in the bacterial clade PTN008957377 (41 leaves)
      on the other side of the root. PAINT already records an IRD for this term at
      PTN000102043 inside the E1 clade, but none on the bacterial lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000102537
    evidence_checked: &rhod_ev
    - QuickGO P38820 GO:0004792 returned SGD IDA PMID:19864628 (the seed) and its IBA.
    - GO:0004792 definition read from QuickGO.
    - PTHR10953-review.yaml assesses the node TOO_DEEP because the activity lies in the C-terminal rhodanese domain that single-domain MoeB and ThiF lack.
    review_edited: false
    notes: Existing reason names the node, the seed and the domain architecture. Left as is.
  - go_id: GO:0008146
    go_label: sulfotransferase activity
    family: PTHR10953
    ibd_node: PTN000102608
    tree_reading: &sulfo_tree >-
      The IBD is at the bacterial node PTN000102608 (39 leaves, 27 species) with one seed,
      M. tuberculosis MoeZ (P9WMN7). MoeZ sits in PTN007473439 (11 leaves, 7 species:
      actinobacterial, Chloroflexus and Firmicutes members). E. coli MoeB and ThiF sit in the
      sister clade PTN000102622 (21 leaves, 13 species). The seed is the only experimental
      support for the term anywhere in the family.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000102608
    evidence_checked: &sulfo_ev
    - QuickGO P9WMN7 under transferase activity returned MTBBASE IDA GO:0008146 PMID:16104727 (the seed), a Reactome TAS for GO:0016782, and IBAs.
    - publications/PMID_16104727.md (full text available) states that MoeZ has been shown to transfer sulfur onto CysO, forming a protein thiocarboxylate. That is sulfur transfer, not sulfate transfer.
    - GO:0008146 definition read from QuickGO (transfer of a sulfate group from PAPS to a hydroxyl acceptor).
    - PTHR10953-review.yaml assesses this node WRONG_NODE on the same ground.
    review_edited: false
    notes: >-
      The seed annotation uses a sulfotransferase term for a sulfurtransferase result; the full
      text was read, so the bad-seed call does not rest on an abstract. Even with a corrected
      term the seed clade PTN007473439 is separate from the MoeB/ThiF clade PTN000102622.
      Existing reason states both points. Left as is.
