genes:
- gene_file: genes/CANAL/EAF3/EAF3-ai-review.yaml
  rows:
  - go_id: GO:1990841
    go_label: promoter-specific chromatin binding
    family: PTHR10880
    ibd_node: PTN000093963
    tree_reading: >-
      The IBD is at the family root PTN000093963 (210 leaves, 95 species) with two seeds,
      AT1G02740 and AT4G37280 (Arabidopsis MRG2 Q4V3E2 and MRG1 Q94C32). Both seeds sit in the
      child clade PTN007468577 (78 leaves, plants and protists); their MRCA is PTN002474695
      (68 leaves, 36 species, all plants). Fungal Eaf3 sits in the other child clade
      PTN000093964 (132 leaves, opisthokonts), under the fungal node PTN000853816 that carries
      its own Rpd3S complex IBD. No seed for this term lies in the opisthokont clade and no loss
      is recorded for it.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002474695
    evidence_checked:
    - QuickGO by GO id for Q94C32 and Q4V3E2 returned an IPI from TAIR (PMID:25211338) on each, plus IBA and IEA rows.
    - treeview.py lineage and child clades; MRCA of the two seeds computed from the cached PANTHER tree.
    - PTHR10880-review.yaml assesses the node TOO_DEEP and proposes MOVE_IBD to PTN008955946.
    review_edited: false
    notes: >-
      The family review's target PTN008955946 (26 leaves) holds MRG2 but not MRG1 in this tree;
      MRG1 is under PTN000094128. The node that holds both seeds is PTN002474695. The seed IPI
      records a CONSTANS-dependent role at the FT promoter, a plant mechanism. Existing reason is
      node-aware and was left as is.
