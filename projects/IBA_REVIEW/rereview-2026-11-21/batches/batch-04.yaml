- gene_file: genes/worm/znfx-1/znfx-1-ai-review.yaml
  rows:
  - go_id: GO:0031380
    go_label: nuclear RNA-directed RNA polymerase complex
    family: PTHR10887
    ibd_node: PTN000094858
    tree_reading: >-
      The IBD is at PTN000094858 (134 leaves, 61 species) with one seed, S. pombe hrr1
      (SPCC1739.03, O74465). hrr1 is in the fungal clade PTN000094927 (13 leaves, 7 species).
      ZNFX-1 (E9P860) is in PTN008312639 (82 leaves, 33 species) with the metazoan ZNFX1
      proteins. The two meet at PTN000094860 (95 leaves). The node also spans a plant and
      protist clade PTN007469435 (34 leaves) with no seed.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000094927
    evidence_checked:
    - QuickGO O74465 GO:0031380 returned PomBase IDA PMID:15607976 (the seed) and its IBA.
    - QuickGO E9P860 under cellular_component returned UniProt EXP cytoplasm (PMID:29775580) and no nuclear experimental row.
    - GO definition read from QuickGO; it describes the S. pombe RDRC (RdRP, a helicase, a Pap25-domain protein).
    review_edited: false
    notes: >-
      Target-specific evidence also applies: ZNFX-1 is experimentally cytoplasmic (perinuclear
      Z granules) and meets the RdRP EGO-1 there, so the nuclear complex is excluded for the
      worm protein. The existing reason argues from that compartment evidence and does not
      misstate the tree, so it was left as is. No family review exists for PTHR10887.
- gene_file: genes/DROME/nudE/nudE-ai-review.yaml
  rows:
  - go_id: GO:0005871
    go_label: kinesin complex
    family: PTHR10921
    ibd_node: PTN000100519
    tree_reading: &nude_tree >-
      The IBD is at the family root PTN000100519 (82 leaves, 47 species) with one seed, rat
      Ndel1 (RGD:621235, Q78PB6). The root splits into PTN000100520 (79 leaves, all animal,
      fungal and amoebozoan NudE/NDE1/NDEL1 members including the seed and every target) and a
      3-leaf Paramecium clade. No other member carries experimental support for the term and
      no loss is recorded.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000100519
    evidence_checked: &nude_ev
    - QuickGO Q78PB6 GO:0005871 returned RGD IDA PMID:17202468 plus the IBA; no other experimental row.
    - publications/PMID_17202468.md (full text available) states that DISC1 links kinesin-1 to the NUDEL/LIS1/14-3-3 epsilon complex and serves as the cargo receptor, so Ndel1 is cargo, not a kinesin subunit.
    - GO:0005871 definition read from QuickGO (a complex that includes a dimer of kinesin superfamily molecules).
    - Query shape confirmed positive (exact GO:0005871 with experimental evidence returns 46 hits).
    - PTHR10921-review.yaml assesses this node WRONG_NODE and recommends removing the IBD.
    review_edited: false
    notes: >-
      The existing reason mentions a single rat report, but its ground is that the seed
      describes cargo transport, which is a bad-seed argument. Left as is.
