- gene_file: genes/BACSU/rnhC/rnhC-ai-review.yaml
  rows:
  - go_id: GO:0032299
    go_label: ribonuclease H2 complex
    family: PTHR10954
    ibd_node: PTN000102672
    tree_reading: >-
      The IBD is at the family root PTN000102672 (178 leaves, 140 species) with three seeds:
      human RNASEH2A (O75792), yeast RNH201 (SGD:S000005016, P53942) and mouse Rnaseh2a
      (MGI:1916974, Q9CWY8). All three are in the eukaryote and archaeal clade PTN000102674
      (135 leaves); their MRCA is PTN000102677 (49 leaves, animals and fungi) and the eukaryotic
      node above it is PTN000102673 (125 leaves). B. subtilis RnhC (P94541) is in the bacterial
      clade PTN000102752 (43 leaves, 35 species), which holds bacterial rnhB and rnhC and no
      seed.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000102677
    evidence_checked:
    - QuickGO for the three seeds returned IDA and IPI rows for GO:0032299 (O75792 PMID:21177858; P53942 PMID:14734815 and PMID:22004424; Q9CWY8 PMID:19923215).
    - GO:0032299 definition read from QuickGO (a protein complex whose catalytic subunit is of the RNase H2 class, for example yeast Rnh201, Rnh202 and Rnh203).
    - Clade composition of PTN000102674, PTN000102673 and PTN000102677 read from the cached tree.
    review_edited: false
    notes: >-
      The heterotrimeric RNase H2 complex is a eukaryotic assembly; bacterial RNase HII and HIII
      act as single polypeptides, so the term does not apply to the bacterial clade
      (MISPLACED_IBD applies equally). PTN000102677 is the seed MRCA; a PAINT curator may prefer
      the eukaryotic node PTN000102673. The existing reason argues from the complex definition
      and the single-polypeptide HIII enzyme and does not misstate the tree. Left as is. No
      family review exists for PTHR10954.
- gene_file: genes/worm/lgg-1/lgg-1-ai-review.yaml
  rows:
  - go_id: GO:0050811
    go_label: GABA receptor binding
    family: PTHR10969
    ibd_node: PTN000861087
    tree_reading: >-
      The IBD is at PTN000861087 (61 leaves, 32 species), the eumetazoan GABARAP and GABARAPL1
      node, with two seeds: human GABARAP (O95166) and rat Gabarap (RGD:61911, P60517). Both
      are in the vertebrate clade PTN000103656 (50 leaves, 22 species), within the GABARAP
      branch (their MRCA is PTN000103688). LGG-1 (Q09490) is in the protostome clade
      PTN002590206 (9 leaves: nematode lgg-1, fly Atg8a and Atg8b, mosquito, beetle, tick,
      leech). The two clades meet at PTN000103619 through a speciation; the vertebrate GABARAP
      and GABARAPL1 duplication (PTN000103659, 40 leaves, 16 species) lies below that. No loss
      is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000103659
    evidence_checked:
    - QuickGO O95166 GO:0050811 returned UniProt IPI PMID:9892355 with P18507 (GABRG2, confirmed in UniProt); P60517 returned RGD IPI PMID:15601949 with RGD:62259 (Gabrg2, confirmed through the RGD API) plus ISO; Q9H0R8 (GABARAPL1) has only ISS; Q09490 has only the IBA.
    - PubMed search "(lgg-1 OR GABARAP) AND elegans AND (GABA receptor OR unc-49)" returned 5 papers, none testing an LGG-1 and GABA receptor interaction.
    - PTHR10969-review.yaml lists this node as UNRESOLVED (not audited).
    review_edited: true
    notes: >-
      The earlier REMOVE rested only on the absence of C. elegans data and on the GABARAP name,
      neither of which is a ground. LGG-1 is the direct protostome counterpart of GABARAP with
      no evidence of loss, so the row cannot be removed; the binding is to the vertebrate gamma 2
      subunit and is untested outside vertebrates, so the depth of the node is doubtful and the
      row is marked as over-annotated, non-core. The MOVE_IBD target is a suggestion for a
      narrower placement, not a demonstrated error. History record
      history/genes/worm/lgg-1/2026-11-21T204945Z-claude-code-9feee2.yaml.
- gene_file: genes/ANOGA/PGRPLC/PGRPLC-ai-review.yaml
  rows:
  - go_id: GO:0008745
    go_label: N-acetylmuramoyl-L-alanine amidase activity
    family: PTHR11022
    ibd_node: PTN002475783
    tree_reading: >-
      The IBD is at PTN002475783 (120 leaves, 27 species) with seven seeds: human PGLYRP2,
      three zebrafish genes and three fly genes (FBgn0033327, FBgn0043578, FBgn0037906). PGRPLC
      (A7UTA1) is in the arthropod clade PTN000867042 (36 leaves), in the receptor branch
      PTN008314959 (4 leaves: fly PGRP-LC, PGRP-LF, PGRP-LE and mosquito PGRPLC), inside
      PTN008959211 (8 leaves, adding PGRP-LD and PGRP-LA) and PTN004221089 (10 leaves). PAINT
      records an IRD for this term at PTN008959207 (4 leaves), which is a different branch and
      does not cover PGRPLC.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008314959
    evidence_checked:
    - Zinc-ligand alignment rerun (projects/IBA_REVIEW/msa/catalytic_residue_check.py, pgrp case) against PGLYRP2 H410/H522/C530. PGRPLC has A310/H421/S429, fly PGRP-LC has L383/S494/F504, fly PGRP-LE has L205/H314/S322; catalytic controls PGRP-LB and PGRP-SC1a keep H/H/C.
    - PTHR11022-review.yaml assesses the node NEEDS_PRUNING on the same residue evidence.
    review_edited: false
    notes: >-
      Root placement is defensible (catalytic members in vertebrates and insects), so the fix is
      a loss on the receptor branch. PGRP-LF in PTN008314959 was not in the alignment; PGRP-LA
