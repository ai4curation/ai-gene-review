- gene_file: genes/yeast/ASP1/ASP1-ai-review.yaml
  rows:
  - go_id: GO:0030287
    go_label: cell wall-bounded periplasmic space
    family: PTHR43828
    ibd_node: PTN000194670
    tree_reading: IBD at PTN000194670 (16 leaves, fungal asparaginases), four seeds, all SGD ids. The S. cerevisiae leaves
      form one clade, PTN008121762 (5 leaves, 1 species), an unresolved group of ASP1 P38986 (leaf PTN000194678) and
      the four ASP3 copies (P0CX79, P0CZ17, P0CX78, P0CX77). The remaining 11 leaves (A. gossypii, C. albicans, Aspergillus,
      Sclerotinia, Phaeosphaeria and four S. pombe paralogs in PTN000194681) hold no seed. So all experimental support
      is from the ASP3 copies of one species, and ASP1 is their within-species paralog.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000194678
    evidence_checked:
    - 'QuickGO by goId: ASP3-1 P0CZ17 GO:0030287 located_in IDA PMID:238936 (SGD).'
    - ASP1 SGD id is S000002729 (UniProt DR line); the seeds are S000004145, S000004147, S000004148 and S000004150,
      so the target is not a seed. I did not resolve each seed id to an ASP3 copy individually.
    review_edited: false
    notes: 'ASP1 is the intracellular asparaginase I and ASP3 the secreted, cell-wall asparaginase II; the review cites
      target-specific cloning and localization. The IBD is also deep for its support (16 leaves from one species''
      tandem copies), so a curator may prefer MOVE_IBD to PTN008121762 plus the IRD on the ASP1 leaf. The ASP3 copies
      have no node of their own that excludes ASP1, which is why the fix is given at the leaf. Note that in the pinned
      tree the asparaginase clade and the Swi4/Swi6/Yar1 ankyrin clade are both inside PTHR43828 (root PTN000194668),
      and PAINT already records IRD losses of asparaginase terms at PTN000917496.'
