genes:
- gene_file: genes/VIBCH/nspC/nspC-ai-review.yaml
  rows:
  - go_id: GO:0008836
    go_label: diaminopimelate decarboxylase activity
    family: PTHR43727
    ibd_node: PTN000159906
    tree_reading: IBD at the family root PTN000159906 (116 leaves), four seeds (Q58497, P19572, P9WIU7, P00861, all
      LysA). The root has two children, PTN000159907 (66 leaves) and PTN005180238 (50 leaves). NspC Q9KRL4 (leaf PTN001691018)
      is in PTN005180238, inside PTN000159921 (7 leaves, all subfamily SF1, the nspC/napC carboxynorspermidine decarboxylases
      of Vibrio, Geobacter, Helicobacter, Deinococcus, Bacteroides, Synechocystis and Streptococcus). Its sister under
      PTN005180238 is PTN000159925 (43 leaves, SF2 LysA, holding seed P9WIU7). No PAINT loss is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000159921
    evidence_checked:
    - 'QuickGO by goId, exact term: E. coli lysA P00861 GO:0008836 EXP PMID:11856852, PMID:18508763 and IDA PMID:10625645,
      PMID:14343156 (the same query shape returns hits, so the empty result on other genes is real).'
    - Family review interpro/panther/PTHR43727 marks this node NEEDS_PRUNING for SF1 and quotes PMID:19196710 (V. vulnificus
      NspC has no activity with meso-diaminopimelate); it names no node for the IRD.
    review_edited: false
    notes: Reason is already node-aware and rests on subfamily divergence. PTN000159921 is the smallest node that holds
      exactly the seven SF1 leaves.
  - go_id: GO:0009085
    go_label: L-lysine biosynthetic process
    family: PTHR43727
    ibd_node: PTN000159906
    tree_reading: Same node and same topology as the GO:0008836 row. One seed, M. tuberculosis lysA P9WIU7, which lies
      in the SF2 LysA clade PTN000159925 (43 leaves); the target lies in the sister SF1 clade PTN000159921 (7 leaves).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000159921
    evidence_checked:
    - 'QuickGO by goId: P9WIU7 GO:0009085 IDA PMID:8440471 (MTBBASE).'
    - Family review marks the node NEEDS_PRUNING for SF1 for this term as well.
    review_edited: false
    notes: Follows the molecular-function row. V. cholerae has its own LysA in SF2 per the gene review.
- gene_file: genes/SCHPO/pan5/pan5-ai-review.yaml
