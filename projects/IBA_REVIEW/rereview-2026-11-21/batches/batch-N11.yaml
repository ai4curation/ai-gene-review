      clade PTN001856878 (S. cerevisiae CBS2 and its A. gossypii ortholog, subfamily SF4), which is the sister of the
      PAN5 pair PTN009172288 under PTN000496352 (4 leaves), a duplication inside Saccharomycetaceae. S. pombe pan5 Q9HDU6
      (leaf PTN000496359, SF2) branches much higher, as the sister of PTN000496350 (14 leaves) under PTN000496349
      (15 leaves). The seeded clade is therefore two leaves out of 18, and pan5 is not in it.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001856878
    evidence_checked:
    - 'QuickGO by goId: CBS2 P14905 GO:0005739 IDA PMID:1745228 and HDA PMID:16823961; S. cerevisiae PAN5 P38787 carries
      IBA only.'
    - pan5 PomBase id SPBPB2B2.09c is not in the seed list.
    - Family review interpro/panther/PTHR43765 marks the node TOO_DEEP and says the term should be restricted to the
      CBS2 branch (SF4).
    review_edited: false
    notes: Reason is node-aware (names PTN001093729 and CBS2 as a divergent paralog) and cites S. pombe localisation
      data. Same verdict and target node as the S. cerevisiae PAN5 row in this batch.
