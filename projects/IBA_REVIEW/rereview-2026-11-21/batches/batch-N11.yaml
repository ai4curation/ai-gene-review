- gene_file: genes/SCHPO/cdc10/cdc10-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR43828
    ibd_node: PTN000917496
    tree_reading: IBD at PTN000917496 (53 leaves), one seed SGD:S000004172 (Swi6). The node has two children, a metazoan
      pair PTN002887935 (2 leaves) and the fungal clade PTN000917498 (51 leaves). Inside the latter, PTN005185109 (49
      leaves) splits into four clades, Xbp1-like PTN002466249 (10), the DNA-binding Swi4/Mbp1/Res1/Res2 clade PTN000917500
      (20), the Yar1 clade PTN008121755 (6) and the Swi6/Cdc10 clade PTN002466251 (13). Cdc10 P01129 (leaf PTN000572571,
      in PTN008685716, 2 leaves) and Swi6 P09959 (in PTN001365219, 8 leaves) are the two branches of PTN001365218 (10
      leaves). The target is therefore in the seeded orthogroup.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002466251
    evidence_checked:
    - 'QuickGO by goId: Swi6 P09959 GO:0005737 located_in IDA PMID:12697814 and PMID:8590795; cdc10 P01129 GO:0005737
      is_active_in HDA PMID:16823372 (PomBase) plus the IBA.'
    - 'Gene review: the HDA cytoplasm row for the same term is KEEP_AS_NON_CORE, so REMOVE on the IBA contradicted
      a kept row.'
    - cdc10 PomBase id SPBC336.12c is not a seed for this term (it seeds three other IBDs at the node).
    review_edited: true
    notes: The earlier reason argued that Swi6 shuttling is lineage-specific and that the SWI6 review keeps the row
      only because Swi6 is the donor. Neither is a loss shown for Cdc10, which is the ortholog of the seed and has its
      own HDA observation. The row is kept as a non-core location. The IBD is still too deep for the DNA-binding, Yar1
      and metazoan clades, hence MOVE_IBD to the Swi6/Cdc10 clade; that move would keep this IBA.
- gene_file: genes/SCHPO/res1/res1-ai-review.yaml
