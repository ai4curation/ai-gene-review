      (13 leaves). Res1 P33520 (leaf PTN000917513) lies in a different child of PTN005185109, the DNA-binding Swi4/Mbp1/Res1/Res2
      clade PTN000917500 (20 leaves), in the fission yeast Res branch PTN000917512 (4 leaves). That clade holds no seed
      for the term.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002466251
    evidence_checked:
    - 'QuickGO by goId: res1 P33520 GO:0005737 has the IBA only (the same query returns the HDA rows for cdc10 and
      res2, so the absence is real); Swi6 P09959 IDA PMID:12697814, PMID:8590795.'
