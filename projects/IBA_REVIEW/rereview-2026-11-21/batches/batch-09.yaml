genes:
- gene_file: genes/human/AKR1C4/AKR1C4-ai-review.yaml
  rows:
  - go_id: GO:0047086
    go_label: ketosteroid monooxygenase activity
    family: PTHR11732
    ibd_node: PTN000199026
    tree_reading: >-
      The IBD sits at PTN000199026 (109 leaves, 17 species) with three seeds, human AKR1C1
      (Q04828), AKR1C2 (P52895) and AKR1C3 (P42330). The node has four children. All three seeds
      and the target AKR1C4 (P17516) sit in the same child, PTN000199027 (57 leaves, 13 species);
      the other children are PTN008979283 (31 leaves), PTN008979329 (3 leaves) and the AKR1D1 clade
      PTN008979332 (18 leaves). No PAINT loss for the term is recorded on the lineage. So this is
      not a misplaced IBD relative to the target; target and seeds are close paralogs.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000199026
    evidence_checked:
    - 'QuickGO Q04828, P52895, P42330 with goId=GO:0047086: each carries one experimental row, IDA
      PMID:21232532 assigned by UniProt, plus the IBA. P17516 and P51857 carry only the IBA.'
    - 'QuickGO ontology GO:0047086: definition is O2 + NADPH + progesterone = H2O + NADP+ +
      testosterone acetate, xref EC 1.14.13.54 (a Baeyer-Villiger oxygen insertion).'
    - 'publications/PMID_21232532.md (abstract only): an mRNA and immunohistochemistry expression
      study in endometriosis that speaks of the 20alpha-HSD and 3alpha/beta-HSD (reductive) activities
      of AKR1C1-3. The abstract reports no oxygen-insertion assay.'
    - 'interpro/panther/PTHR11732/PTHR11732-review.yaml: marks this node record NEEDS_PRUNING for the
      AKR1C4 and AKR1D1 subfamilies.'
    review_edited: false
    notes: >-
      All three seeds rest on one UniProt IDA from a paper whose abstract describes carbonyl reduction
      of progesterone, not the EC 1.14.13.54 monooxygenase reaction; aldo-keto reductases are hydride
      transfer enzymes with no oxygenase chemistry. The term looks like a mis-chosen GO term at the
      seeds (ketosteroid reduction was meant). Full text was not read, so the seed defect is probable,
      not confirmed. The family review treats it as pruning for two subfamilies; the tree reading
      suggests the whole IBD should go, since the target shares the seeds' clade. The existing reason
      is node-aware and argues from reaction chemistry, so the review was left alone.
- gene_file: genes/human/AKR1D1/AKR1D1-ai-review.yaml
  rows:
  - go_id: GO:0047086
    go_label: ketosteroid monooxygenase activity
    family: PTHR11732
    ibd_node: PTN000199026
    tree_reading: >-
      Same IBD at PTN000199026 (109 leaves, 17 species), seeds AKR1C1, AKR1C2 and AKR1C3, all in
      child PTN000199027 (57 leaves). The target AKR1D1 (P51857) sits in a different child, the
      18-leaf, 17-species AKR1D1 clade PTN008979332 (one ortholog per species from Xenopus to human),
      across the duplication at PTN000199026. No PAINT loss for the term on the lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000199026
    evidence_checked:
    - Same QuickGO, GO definition and PMID:21232532 checks as for AKR1C4 above.
    - 'The AKR1D1 row quotes PMID:21232532 verbatim; the abstract lists AKR1D1 only as the
      5beta-reductase whose mRNA was negligible.'
    review_edited: false
    notes: >-
      Two grounds apply: the seed annotation is probably a mis-chosen term (see AKR1C4), and AKR1D1
      is in a separate, functionally distinct clade (steroid 5beta-reductase acting on the C4-C5 double
      bond) from all three seeds. If PAINT kept the IBD, it would have to move to PTN000199027. The
      existing reason names the node and the divergence; left alone.
- gene_file: genes/ECOLI/prpC/prpC-ai-review.yaml
  rows:
  - go_id: GO:0005975
    go_label: carbohydrate metabolic process
    family: PTHR11739
    ibd_node: PTN000201223
    tree_reading: >-
      The IBD sits at the family root PTN000201223 (270 leaves, 123 species) with one seed, human
      citrate synthase CS (O75390). The root has two children, PTN000201301 (249 leaves) and
      PTN000201309 (21 leaves, bacterial and archaeal). Seed and target are both in PTN000201301.
      On the target lineage, PrpC sits in the 12-leaf, 11-species clade PTN002621568, which carries
      its own IBDs for GO:0050440 2-methylcitrate synthase activity and GO:0019543 propionate
      catabolic process; that clade joins the rest at PTN000201222 (242 leaves), which carries the
      mitochondrial matrix IBD, with a mitochondrial matrix loss (NOT IRD) at PTN001713951 on the
      PrpC lineage. No loss is recorded for GO:0005975.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002621568
    evidence_checked:
    - 'QuickGO O75390 GO:0005975 (with descendants): IDA PMID:9543345 (UniProt) plus the IBA. PubMed
      esummary title of PMID:9543345: Human mitochondrial function during cardiac growth and development.'
    - QuickGO P31660 GO:0005975, only the IBA.
    - 'interpro/panther/PTHR11739/PTHR11739-review.yaml: the node record is UNRESOLVED, described as
      uninformative for citrate synthase (yeast reviews mark it over-annotated, S. pombe keeps it non-core).'
    review_edited: false
    notes: >-
      The single seed row is a general process term on human CS from a cardiac development paper
      (not read), projected to 270 leaves including bacteria and archaea. For PrpC the ground is
      subfamily divergence: PAINT itself marks PTN002621568 as the 2-methylcitrate synthase clade
      working in propionate catabolism, an organic acid pathway. A cleaner PAINT fix may be removing
      the root IBD altogether (the term is weak for the whole family), but that is a judgement on
      the seed that was not made here. The existing reason names both nodes and argues from the
      subclade function; left alone.
- gene_file: genes/ARATH/MNS1/MNS1-ai-review.yaml
  rows:
  - go_id: GO:0036503
    go_label: ERAD quality control pathway
    family: PTHR11742
    ibd_node: PTN000201533
    tree_reading: >-
      The IBD sits at the family root PTN000201533 (365 leaves, 94 species) with seven seeds. The
      root has two children: the ER-type clade PTN002482736 (158 leaves, 88 species) and the Golgi
      clade PTN000201534 (207 leaves, 79 species; carries the Golgi membrane IBD). Human MAN1B1
      (Q9UKM7), chicken MAN1B1 (A0A8V1ABV1), mouse Man1b1 (A2AJ15), S. cerevisiae MNS1 (P32906) and
      MNL2 (Q12205) and S. pombe SPAC2E1P5.01c (Q9P7C3) are all in PTN002482736. The seventh seed,
      human MAN1A1 (P33908), is in the Golgi clade, in its animal child PTN000201535 (99 leaves).
      The target is in the other child, PTN007533136 (108 leaves: 23 Trichomonas, 3 Thalassiosira,
      1 Phytophthora and an 81-leaf streptophyte clade PTN008525833 holding Arabidopsis MNS1 and
      MNS2). No seed lies in PTN007533136 and no PAINT loss for the term is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008525833
    evidence_checked:
    - 'QuickGO P33908 GO:0036503: IDA PMID:27108681 (UniProt), also GO:1904382 IDA from the same paper.
      PubMed esummary title: Mannosidase IA is in Quality Control Vesicles and Participates in
      Glycoprotein Targeting to ERAD.'
    - 'QuickGO Q9UKM7: IDA PMID:10521544, IMP PMID:18003979, IMP PMID:21062743. A0A8V1ABV1: IMP
      PMID:25092655. A2AJ15: IMP PMID:15294975 (acts_upstream_of_or_within). P32906: IMP PMID:8905927.
      Q12205: IGI PMID:21971548. Q9P7C3: IMP PMID:16079177 on the child term GO:0097466.'
    - QuickGO Q9C512 GO:0036503, only the IBA.
    - 'The review row quotes PMID:24737672 (MNS1 to MNS3 dispensable for ERAD of BRI1-5 and BRI1-9);
      quotes left as they were.'
    - PTHR11742-review.yaml has no assessment of the GO:0036503 record.
    review_edited: true
    notes: >-
      The earlier summary and source comment said no Golgi-clade member is a seed. That was wrong:
      MAN1A1 is a seed inside PTN000201534. The REMOVE still holds on direct negative genetic evidence
      in the target species, and the text now states the seed positions correctly. The suggested
      question in the review (block at the Golgi node PTN000201534) would be too broad, since MAN1A1
      has experimental ERAD evidence inside that node; the loss belongs at the plant clade. The
      negative evidence is from Arabidopsis only, so the IRD node PTN008525833 (all streptophytes)
      is the widest reasonable placement and a PAINT curator may prefer a narrower one.
- gene_file: genes/human/STAT2/STAT2-ai-review.yaml
  rows:
  - go_id: GO:0043434
    go_label: response to peptide hormone
    family: PTHR11801
    ibd_node: PTN000210451
    tree_reading: >-
      The IBD sits at PTN000210451 (147 leaves, 22 species), two nodes above the vertebrate STAT
      radiation PTN000210452 (143 leaves); the extra leaves are two Branchiostoma (PTN008981615) and
      two more in PTN008329888. Under PTN000210452 the paralog clades are STAT2 PTN002623821 (20
      leaves, carrying the ISGF3 complex and type I interferon signalling IBDs), STAT1 PTN002623830
      (22), STAT3 PTN002623841 (27), STAT4 PTN002623838 (17) and STAT5/STAT6 PTN002623856 (57).
      The eight seeds are STAT3 (human P40763, mouse, rat), STAT5A/B (human P51692, mouse, rat) and
      rat Stat1. None lies in the STAT2 clade. No PAINT loss for the term on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002623821
    evidence_checked:
    - 'QuickGO with descendants: human STAT3 P40763 has IDA GO:0060396 (PMID:10925297) and IDA GO:0060397
      (PMID:12552091); human STAT5B P51692 IDA GO:0060397 (PMID:12552091); mouse Stat3 P42227 IDA GO:0060397
      (PMID:8923468); mouse Stat5a P42230 IDA GO:0043434 (PMID:12388746) and GO:0060397 (PMID:8702683);
      mouse Stat5b P42232 IDA GO:0060397 (PMID:8923468); rat Stat3 P52631 IEP GO:0043434 (PMID:17911393).'
    - Human STAT1 P42224 and mouse Stat1 P42225 carry only the IBA. The rat Stat1 seed (RGD:3771) could
      not be queried by its RGD id (empty result) and was not checked.
    - 'interpro/panther/PTHR11801/PTHR11801-review.yaml: node record NEEDS_PRUNING for SF41 (STAT2), with
      an IRD at PTN002623821 recommended; STAT4 and STAT6 left outside the confirmed scope.'
    review_edited: true
    notes: >-
      The seeds are sound and the node placement is defensible for the STAT3/STAT5 branches; the ground
      is specialisation of the STAT2 paralog on the type I/III interferon receptor (no peptide hormone
      input is known). The old reason called the IBA an electronic inference and named no node, so it
      was rewritten to the tree-based argument. Action unchanged. The divergence argument rests on
      the absence of any known hormone input, not on a negative experiment; this is the weakest of
      the upheld grounds in this batch.
- gene_file: genes/worm/sta-1/sta-1-ai-review.yaml
  rows:
  - go_id: GO:0007259
    go_label: cell surface receptor signaling pathway via JAK-STAT
    family: PTHR11801
    ibd_node: PTN000927860
    tree_reading: >-
      The IBD sits at PTN000927860 (180 leaves, 36 species) with 13 seeds: vertebrate STATs (human STAT1,
      STAT2, STAT3, STAT6; mouse, rat and zebrafish members) and Drosophila Stat92E (FBgn0016917). The
      node has two children: PTN000927862 (170 leaves, holding all seeds and the target) and a
      Dictyostelium-only clade PTN001370513 (10 leaves). sta-1 sits in the nematode clade PTN000210629
      (8 leaves: sta-1, sta-2 and T12G3.2 of C. elegans with C. briggsae and Pristionchus orthologs),
      which joins the insect Stat92E clade at PTN000210627 (14 leaves) and then PTN002623881 (16)
      before PTN000210449 (164). No seed lies in PTN000210629 and no loss is recorded.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000210629
    evidence_checked:
    - 'QuickGO Q24151 (Stat92E) GO:0007259: ten experimental rows from FlyBase (IDA PMID:16094372,
      IGI with hopscotch FBgn0004864 PMID:8608595 and others), so the query shape returns hits and the
      fly seed is sound.'
    - 'The review quotes PMID:28874466 (no conserved JAK homolog in C. elegans) and PMID:24058787; quotes
      not re-verified here beyond their presence in the review.'
    - 'PTHR11801-review.yaml term assessment: GO:0007259 scope SUBFAMILY_ONLY, not applicable to the
      nematode subfamilies; the Dictyostelium gene reviews replace it with GO:0097696.'
    review_edited: false
    notes: >-
      Lineage ground: nematodes have no JAK, so the JAK-STAT pathway named by the term does not exist
      in the target lineage. The existing reason already says the IBD placement is sound for the
      seeds and that the fix is an IRD on the nematode branch. The same root-side node also reaches
      the Dictyostelium clade PTN001370513, which has no JAK either; that needs its own loss. A
      MODIFY to the parent GO:0097696 was considered and not made: STA-1 activation runs through
      SID-3 and DRH-1, not an identified cell surface receptor.
- gene_file: genes/worm/sta-2/sta-2-ai-review.yaml
  rows:
  - go_id: GO:0007259
    go_label: cell surface receptor signaling pathway via JAK-STAT
    family: PTHR11801
    ibd_node: PTN000927860
    tree_reading: >-
      Same IBD at PTN000927860 (180 leaves) as for sta-1. sta-2 (Q20977) sits in the same 8-leaf nematode
      clade PTN000210629, in its 3-leaf subclade PTN002273440 (C. elegans and C. briggsae sta-2 and a
      Pristionchus ortholog); sta-1 is in the sister 5-leaf subclade PTN000927892. All 13 seeds are
      vertebrate STATs or fly Stat92E, outside PTN000210629. No loss recorded.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000210629
    evidence_checked:
    - Same QuickGO check of the fly seed as for sta-1.
    - 'The review quotes PMID:21575913, PMID:26716073 and PMID:24058748 for the JAK-independent activation
      of STA-2 through SNF-12 and hemidesmosomes.'
    - PTHR11801-review.yaml excludes nematode subfamily SF49 from the term's scope.
    review_edited: false
    notes: >-
      Same lineage ground as sta-1 (no JAK in nematodes). The reason argues from the absence of JAK
      and the alternative activation route, and the propagation comment names the node and the IRD;
      left alone. One IRD at PTN000210629 covers both paralogs.
- gene_file: genes/ECOLI/metB/metB-ai-review.yaml
  rows:
  - go_id: GO:0019344
    go_label: L-cysteine biosynthetic process
    family: PTHR11808
    ibd_node: PTN000211591
    tree_reading: >-
      The IBD sits at PTN000211591 (109 leaves, 74 species) with four seeds. The node has two children:
      PTN008527405 (87 leaves, the eukaryotic gamma-lyase clade with human CTH P32929, yeast CYS3 and
      Emericella nidulans C8VM61) and PTN001720865 (22 leaves, bacterial and archaeal). The fourth
      seed, M. tuberculosis MetB (P9WGB7), is in the target's child clade: both sit under PTN000211711
      (19 leaves, which carries the cystathionine gamma-synthase IBD seeded by these same two
      proteins). Below that node the M. tuberculosis enzyme is in PTN007540728 (7 leaves, with B.
      subtilis MccB) and E. coli MetB is in PTN001720873 (11 leaves, proteobacterial MetB plus
      Halobacterium, Helicobacter and Neisseria members; no seed). A NOT IRD for this term already
      exists inside the eukaryotic clade at PTN000928751.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001720873
    evidence_checked:
    - 'QuickGO GO:0019344: P9WGB7 IMP PMID:15576367 (MTBBASE); PubMed title: Functional demonstration of
      reverse transsulfuration in the Mycobacterium tuberculosis complex. C8VM61 IMP PMID:19685245
      (acts_upstream_of_or_within). CYS3 P31373 IMP PMID:10509018 and PMID:8366024. CTH P32929 IDA PMID:10212249
      and PMID:19428278. B. subtilis MccB O05394 only the IBA.'
    - 'PTHR11808-review.yaml: node record NEEDS_PRUNING with proposed ADD_IRD at PTN001720873, chosen
      because PTN000211711 also holds the M. tuberculosis seed.'
    review_edited: true
    notes: >-
      The ground is that the reverse trans-sulfuration route to cysteine is absent from E. coli, where
      MetB consumes cysteine on the forward route. The earlier text described the seeds as gamma-lyases
      only and the whole bacterial gamma-synthase branch as wrongly covered; M. tuberculosis MetB is a
      seed in that branch, so summary, reason and comment were corrected. Whether every member of
      PTN001720873 lacks reverse trans-sulfuration was not checked; the IRD node follows the family
      review.
