      PTN000214357 (2 leaves). No PAINT loss recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000214358
    evidence_checked:
    - 'QuickGO GO:0005777 exact: human IDH1 O75874 IDA PMID:10521434; yeast IDP3 P53982 IDA PMID:9452501;
      Emericella C8VIX5 IDA PMID:11483612.'
