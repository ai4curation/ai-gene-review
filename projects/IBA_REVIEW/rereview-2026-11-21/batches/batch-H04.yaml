- gene_file: genes/human/IZUMO1/IZUMO1-ai-review.yaml
  rows:
  - go_id: GO:0007339
    go_label: binding of sperm to zona pellucida
    family: PTHR35540
    ibd_node: PTN008053906
    tree_reading: >-
      IBD at the family root PTN008053906 (17 leaves, 13 species), dated 20250624, one seed, rat Izumo1
      (RGD:1565454, UniProtKB:Q6AY06). Children: PTN002179603 (16 leaves, tetrapod IZUMO1 including the
      target, mouse Izumo1 and the rat seed) and the single zebrafish leaf PTN008053908. No PAINT loss
      for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN008053906
    evidence_checked:
    - 'QuickGO by goId: rat Izumo1 Q6AY06 GO:0007339 involved_in IMP PMID:35096839 (UniProt); mouse
      Izumo1 Q9D9J7 has only IBA and ISO from the rat row; human has IBA and Ensembl IEA.'
    - 'PubMed abstract of PMID:35096839 (not in publications/): title "Sperm IZUMO1 Is Required for
      Binding Preceding Fusion With Oolemma in Mice and Rats"; Izumo1 knockout rat spermatozoa failed to
      bind to the oolemma. The abstract reports no zona pellucida binding defect, so the seed term looks
      mis-chosen (oolemma binding annotated as zona binding).'
    - Mouse knockout quote in the row (PMID:15759005) says null sperm bind and penetrate the zona.
    review_edited: false
    notes: The row's propagation_review says the rat descendant evidence was not inspected. It now has
      been, from the abstract only; the single seed is an oolemma-binding phenotype, which strengthens
      the REMOVE and points the fix at the rat IMP row. Reason left unchanged because it already rests
      on the contradicting knockout phenotype. A full-text read of PMID:35096839 would be needed before
      filing the seed as a confirmed wrong-term defect.
