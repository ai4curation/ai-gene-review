- gene_file: genes/human/CALCOCO2/CALCOCO2-ai-review.yaml
  rows:
  - go_id: GO:0016605
    go_label: PML body
    family: PTHR31915
    ibd_node: PTN001591386
    tree_reading: >-
      IBD at PTN001591386 (14 leaves, 13 species) with one seed, human CALCOCO2 itself (UniProtKB:Q13137).
      The node has two children: PTN001591387 (12 leaves, mammalian CALCOCO2 including the target) and
      PTN009129908 (2 leaves, chicken and anole). The same node carries the xenophagy, autophagosome and
      autophagosome maturation IBDs, each also seeded once. No PAINT loss for the term in the lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001591386
    evidence_checked:
    - 'QuickGO by goId for Q13137 (query shape returned hits): GO:0016605 located_in IDA PMID:7540613
      (assigned by MGI) plus the IBA. That IDA is the only seed.'
    - publications/PMID_9230084.md contains the quoted sentence that NDP52-specific sera gave mainly
      cytoplasmic staining and no nuclear-dot pattern; the review removes the IDA row on that later
      direct re-test.
    review_edited: false
    notes: Target is its own seed, so the IBA and the IDA are judged together and both are REMOVE. The
      written reason rests on the later contradicting localisation study, a real ground; it does not
      name the node but states nothing wrong about the tree, so the file was left alone.
