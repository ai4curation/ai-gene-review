    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002141605
    evidence_checked:
    - 'QuickGO by goId for P0CJ72: GO:1900118 involved_in IMP PMID:19477263 (UniProt) plus the IBA.'
