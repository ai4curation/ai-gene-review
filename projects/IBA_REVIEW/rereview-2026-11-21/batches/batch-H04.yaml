- gene_file: genes/human/PCSK1/PCSK1-ai-review.yaml
  rows:
  - go_id: GO:0016020
    go_label: membrane
    family: PTHR42884
    ibd_node: PTN002451026
    tree_reading: >-
      IBD at the family root PTN002451026 (305 leaves, 64 species), 13 seeds. Children: PTN002451107
      (13 bacterial leaves, holding the mycosin seeds O05458, O05461, O53695 and NalP Q9JXM7) and
      PTN002451027 (292 leaves) holding the target and the eukaryotic seeds (human furin P09958, PCSK7
      Q16549, PCSK2 P16519, bovine furin Q28193 and others). The PC1/3 clade is PTN001647685 (29 leaves,
      25 species, PCSK1 orthologs from vertebrates to arthropods and leech); it carries PAINT IRD losses
      for GO:0000139 Golgi membrane and GO:0005802 trans-Golgi network (IBDs at PTN000082856, 248
      leaves) but no loss for membrane. The nearest seed is PCSK2, whose clade PTN000082858 (35 leaves)
      joins the PC1/3 lineage at PTN002451028 (230 leaves).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO by goId with descendants: PCSK2 P16519 GO:0016020 located_in IDA PMID:8034613 (BHF-UCL);
      furin P09958 has many experimental membrane-descendant rows; human, mouse and rat PCSK1 have only
      the IBA.'
    - publications/PMID_8034613.md (abstract only) is the proPC2 membrane association paper.
    - 'PubMed abstracts: PMID:12950171 reports that the 86 and 64 kDa forms of PC3 interact with secretory
      granule membranes and are lipid-raft associated; PMID:17240044 reports that residues 617-638 confer
      raft association and sorting to granules. Neither is in publications/.'
    - interpro/panther/PTHR42884/PTHR42884-review.yaml read; it discusses the Golgi membrane pattern
      but does not assess the membrane IBD at the root.
    review_edited: true
    notes: The earlier reason was that PC1/3 is a soluble lumenal enzyme and the term reflects furin and
      bacterial members. That is not a loss shown on the tree or in the literature; PC1/3 membrane
      association is reported, and the curators pruned only the Golgi-specific terms. Changed to
      KEEP_AS_NON_CORE (true, general, peripheral). Not MODIFY to secretory granule membrane because
      the row's own evidence does not reach it. The UniProt subcellular location quote was removed from
      the row since it no longer supports the stated reason. PMID:12950171 and PMID:17240044 are cited
      in the reason prose only; they are not cached and were not added to the references list. History
      record history/genes/human/PCSK1/2026-11-21T212027Z-claude-code-bced93.yaml.
