genes:
- gene_file: genes/human/CSF2RA/CSF2RA-ai-review.yaml
  rows:
  - go_id: GO:0004903
    go_label: growth hormone receptor activity
    family: PTHR23036
    ibd_node: PTN002745520
    tree_reading: >-
      IBD at PTN002745520 (33 leaves, 18 species), seeds human GHR P10912, mouse Ghr (MGI:95708) and rat
      Ghr (RGD:2687). Children are PTN000547462 (27 leaves) and the fish ghr clade PTN002745529 (6 leaves).
      Inside PTN000547462 the tree nests the CSF2RA clade PTN001495076 (11 leaves, 7 species, mammalian
      CSF2RA only) as sister of the mammalian GHR clade PTN000547464 (12 leaves, all three seeds) under
      PTN009059071 (23 leaves); platypus GHR joins at PTN000547463 (24 leaves) and bird and lizard GHR
      (PTN001495184, 3 leaves) at PTN000547462. So every other member of the IBD node is a GHR ortholog
      and the 11-leaf CSF2RA clade is the only non-GHR group below it. No PAINT loss for the term in the
      family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001495076
    evidence_checked:
    - 'QuickGO by goId (query returned 6 hits for P10912): human GHR GO:0004903 IDA PMID:1549776,
      PMID:2825030, PMID:8943276 (UniProt); CSF2RA P15509 carries IBA only.'
    - CSF2RA review rows and description read; GM-CSF binding with common beta is the documented ligand
      specificity (PMID:2555171, PMID:1702217, PMID:27396825 cited in the existing reason).
    - No family review exists for PTHR23036.
    review_edited: false
    notes: Existing reason is node-aware and rests on ligand-specific divergence of the CSF2RA clade. The
      IBD cannot simply be moved to the mammalian GHR clade because fish, bird and lizard GHR orthologs sit
      outside it; an IRD on the CSF2RA clade is the smaller change. The placement of CSF2RA inside the
      tetrapod GHR clade looks like a tree artefact, which a PAINT curator may want to flag.
  - go_id: GO:0060396
    go_label: growth hormone receptor signaling pathway
    family: PTHR23036
    ibd_node: PTN002745520
    tree_reading: >-
      Same node and topology as GO:0004903 above. IBD at PTN002745520 (33 leaves) with four seeds (human
      GHR P10912, pig GHR P19756, mouse Ghr MGI:95708, rat Ghr RGD:2687), all in the mammalian GHR clade
      PTN000547464 (12 leaves). The target sits in the sister CSF2RA clade PTN001495076 (11 leaves).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001495076
    evidence_checked:
    - 'QuickGO by goId with descendants (21 hits): human GHR GO:0060396 IDA PMID:1549776, PMID:15690087,
      PMID:2825030, PMID:8943276 and IMP PMID:7565946; rat Ghr IDA PMID:8063815; mouse Ghr GO:0060397 IDA
      PMID:8702683.'
    review_edited: false
    notes: Existing reason is node-aware and argues from the distinct ligand and receptor complex of
      CSF2RA.
  - go_id: GO:0070195
    go_label: growth hormone receptor complex
    family: PTHR23036
    ibd_node: PTN002745520
    tree_reading: >-
      Same node and topology as GO:0004903 above. IBD at PTN002745520 (33 leaves) with one seed, human GHR
      P10912, in the mammalian GHR clade PTN000547464 (12 leaves). The target sits in the sister CSF2RA
      clade PTN001495076 (11 leaves).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001495076
    evidence_checked:
    - 'QuickGO by goId (11 hits): human GHR GO:0070195 IDA PMID:8137822 (BHF-UCL), IDA PMID:1549776,
      PMID:8943276, PMID:9571026 (CAFA), IPI PMID:1549776 (ComplexPortal).'
    review_edited: false
    notes: CSF2RA assembles with CSF2RB in the GM-CSF receptor complex, a different complex from the GH
      receptor dimer. The single seed is sound for GHR; the fault is the reach of the node over the
      CSF2RA clade.
- gene_file: genes/human/MYL2/MYL2-ai-review.yaml
  rows:
  - go_id: GO:0042694
    go_label: muscle cell fate specification
    family: PTHR23049
    ibd_node: PTN002746142
    tree_reading: >-
      IBD at PTN002746142 (25 leaves, 20 species; the vertebrate MYL2 clade) with one seed, mouse Myl2
      (MGI:97272). Children are PTN008588327 (20 leaves, tetrapod MYL2, holding both the target and the
      seed P51667) and the fish clade PTN002746147 (5 leaves). The target and the seed are orthologs in
      the same child clade, so the row stands or falls with the seed. No PAINT loss for the term on the
      lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002746142
    evidence_checked:
    - 'QuickGO by goId (2 hits): mouse Myl2 P51667 GO:0042694 acts_upstream_of_or_within IMP PMID:1379240
      (MGI) is the only experimental annotation; human MYL2 has IBA only.'
    - publications/PMID_1379240.md (abstract only) is the 1992 MLC-2 luciferase transgenic promoter study;
      its title and abstract concern cis-regulatory control of MLC-2 gene expression, not a function of
      the MLC-2 protein.
    - Family review interpro/panther/PTHR23049/PTHR23049-review.yaml has no assessment of this node and
      term.
    review_edited: false
    notes: The bad-seed call rests on the title and abstract of a promoter-reporter paper, which predates
      any Myl2 loss-of-function allele; the full text was not read. The seed carries the weaker
      acts_upstream_of_or_within qualifier while the IBA asserts involved_in. The fix belongs at the MGI
      seed annotation, and the IBD goes with it.
- gene_file: genes/human/LPCAT4/LPCAT4-ai-review.yaml
  rows:
  - go_id: GO:0042171
    go_label: lysophosphatidic acid acyltransferase activity
    family: PTHR23063
    ibd_node: PTN001128751
    tree_reading: >-
      IBD at PTN001128751 (83 leaves, 33 species), seeds human LPCAT2 Q7L5N7 and rat RGD:1311599. Below
      it PTN000551857 (66 leaves) splits into three paralog clades: LPCAT1 PTN002746840 (21 leaves),
      LPCAT4 PTN002746836 (20 leaves, 18 species, holding the target) and LPCAT2/LPCAT2B PTN002746846 (25
      leaves, holding the LPCAT2 seed). The LPCAT4 clade holds no seed. No PAINT loss for the term in the
      family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002746836
    evidence_checked:
    - 'QuickGO by goId with descendants (34 hits across six accessions): human LPCAT2 Q7L5N7 GO:0003841
      IDA PMID:20363836; rat Lpcat1 Q1HAQ0 GO:0003841 IDA PMID:16864775; LPCAT4 orthologs (Q643R3, Q6NVG1,
      D3ZR52) carry IBA, IEA and Reactome TAS only.'
    - 'publications/PMID_18458083.md abstract read: LPEAT2 (LPCAT4) "lacked appreciable acylating activity
      toward glycerol 3-phosphate, lysophosphatidic acid, lysophosphatidylinositol, and diacylglycerol".'
    - Family review PTHR23063-review.yaml assesses this node and term as NEEDS_PRUNING for SF7 (LPCAT4).
    review_edited: false
    notes: REMOVE rests on a direct negative assay on the human protein. The review treats the GO:0003841
      Reactome TAS rows on the same gene as MODIFY to the lysophospholipid class actually acylated, which
      is consistent with removing the LPA-specific parent here. Which gene RGD:1311599 names was not
      resolved by id; the rat experimental annotation found was on Lpcat1.
- gene_file: genes/human/PDZD7/PDZD7-ai-review.yaml
  rows:
  - go_id: GO:0032426
    go_label: stereocilium tip
    family: PTHR23116
    ibd_node: PTN000563297
    tree_reading: >-
      IBD at PTN000563297 (78 leaves, 28 species), seeds mouse Whrn (MGI:2682003) and rat Whrn
      (RGD:631330). Children are the harmonin (USH1C) clade PTN001136698 (30 leaves) and PTN000563296 (48
      leaves). Inside the latter, PTN000767241 (43 leaves) splits into the PDZD7 clade PTN001897737 (19
      leaves, 17 species, holding the target) and the whirlin clade PTN004608638 (24 leaves, 20 species,
      holding both seeds). The same node carries GO:0002142 stereocilia ankle link complex (2 seeds). No
      PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004608638
    evidence_checked:
    - 'QuickGO by goId (18 hits across six accessions): mouse Whrn Q80VW5 located_in IDA PMID:24334608,
      PMID:31448880 (MGI); rat Whrn Q810W9 IDA PMID:23055499 (UniProt); mouse Pdzd7, human PDZD7 and mouse
      Ush1c carry IBA only.'
    - PDZD7 review row read; its quotes place PDZD7 at the ankle link region above the stereociliary
      base.
    - No family review exists for PTHR23116.
    review_edited: false
    notes: Existing reason is node-aware (names the node and both whirlin seeds). Both seeds sit in the
      whirlin clade across the PTN000767241 duplication from PDZD7, and neither PDZD7 nor harmonin has an
      experimental tip annotation, so the IBD belongs on the whirlin clade.
- gene_file: genes/human/BMPR2/BMPR2-ai-review.yaml
  rows:
  - go_id: GO:0005024
    go_label: transforming growth factor beta receptor activity
    family: PTHR23255
    ibd_node: PTN001147423
    tree_reading: >-
      IBD at PTN001147423 (50 leaves, 29 species; the type II BMPR2/AMHR2 clade plus one Nematostella
      leaf), seeds zebrafish bmpr2a and bmpr2b (ZFIN:ZDB-GENE-070618-2 and -1), rat RGD:70964 and human
      AMHR2 Q16671. Below it PTN009067343 (42 leaves) splits into the AMHR2 clade PTN009067344 (19 leaves)
      and the BMPR2 clade PTN002758287 (22 leaves, holding the target and the two zebrafish seeds); the
      invertebrate daf-4/wit clade PTN008384216 (6 leaves) joins at PTN000583784. The same node carries
      GO:0030509 BMP signaling pathway. No PAINT loss for the term on the lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001147423
    evidence_checked:
    - 'QuickGO by goId with descendants (14 hits): zebrafish bmpr2a A0A8M2BD77 and bmpr2b Q288P2
      GO:0005024 IDA PMID:18222420 (ZFIN); human AMHR2 Q16671 GO:0005026 IDA PMID:10854429; rat Amhr2
      Q62893 GO:0005026 IDA PMID:11376112; human, mouse and rat BMPR2 carry IBA only.'
    - 'PubMed abstract of PMID:18222420 read: it describes bmpr2a and bmpr2b as "two new type II receptors
      for BMPs in zebrafish" that "induce a classical Smad1/5/8 response to BMP binding"; no TGF-beta
      ligand is involved.'
    - 'QuickGO term record for GO:0005024: the comment says the term "should only be used when the
      receptor binds the ligand TGFbeta". GO:0098821 BMP receptor activity is a sibling under GO:0004675,
      not a descendant.'
    review_edited: false
    notes: Every seed is a BMP or AMH type II receptor annotated to the TGF-beta-specific term or its type
      II child, so the node has no seed that binds TGF-beta. The BMPR2 seeds should carry GO:0098821 and
      the IBD should be replaced by that term on the BMPR2 clade PTN002758287. The existing reason states
      the term-scope ground and says it did not reconstruct the tree; it does not misstate it, so the
      review was left as is. GO:0098821 is already ACCEPTed on the gene by IEA and ISS rows.
