    go_label: RNA endonuclease activity
    family: PTHR22891
    ibd_node: PTN008584027
    tree_reading: >-
      IBD at the family root PTN008584027 (952 leaves, 95 species), 18 seeds. The nematode Argonaute
      clade PTN002505254 (63 leaves, 3 species) has five children and is mixed: PTN008584059 (19 leaves)
