      repressor), and that the root placement extends the term to 64 animal leaves with no seed. The
      existing reason states the paralog split (SF3 against SF56) and the divergent cytoplasmic biology;
      its last clause ("neither the cached literature nor UniProt supports") is absence wording but not
      what the reason rests on, so the row was left unchanged. MOVE_IBD to PTN001124014 leaves the
      Ustilago seed needing its own placement. A curator who wants positive evidence of loss on Sbp1
      itself could read this as MARK_AS_OVER_ANNOTATED.
