- gene_file: genes/ARATH/HEN1/HEN1-ai-review.yaml
  rows:
  - go_id: GO:0034587
    go_label: piRNA processing
    family: PTHR21404
    ibd_node: PTN000483941
    tree_reading: >-
      IBD at PTN000483941 (85 leaves, 76 species), 4 seeds: worm henn-1, fly Hen1, zebrafish henmt1,
      mouse Henmt1. The node has two children. PTN000483942 (37 leaves, 37 species) is the animal
      HENMT1 clade and holds all four seeds. PTN007691822 (48 leaves, 39 species) holds the target with
      the plant HEN1 proteins plus Trypanosoma, Trichomonas, Paramecium and Chlamydomonas members, and
      has no seed for this term. No PAINT loss is recorded for the term.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000483942
    evidence_checked:
    - 'QuickGO by GO id with descendants for P34283, Q568P9, Q8CAE2, Q9C5Q8: worm henn-1 IMP
      PMID:22536158, mouse Henmt1 IDA PMID:17652135, zebrafish henmt1 IMP PMID:20859253 (on GO:0140990);
      Arabidopsis HEN1 carries the IBA only.'
    - tv.py kids PTN000483942 confirms fly Hen1 (Q7K175) is in the animal clade.
    review_edited: false
    notes: Existing reason is short but rests on a real ground (piRNAs are an animal pathway; all seeds are
      animal) and its propagation_review names the node and the seed distribution. Left unchanged.
- gene_file: genes/SCHPO/mid1/mid1-ai-review.yaml
  rows:
  - go_id: GO:0031106
    go_label: septin ring organization
    family: PTHR21538
    ibd_node: PTN001853010
    tree_reading: >-
      IBD at PTN001853010 (106 leaves, 36 species), 3 seeds: WB:WBGene00013038, PomBase:SPCC4B3.15 and
      FB:FBgn0261385 (scra, anillin). SPCC4B3.15 is mid1 itself (genes/SCHPO/mid1/mid1-uniprot.txt), so
      the target is one of the seeds, although treeview prints "is itself a seed: False" because it
      compares the UniProt accession. The node has two children: the single leaf PTN001853011 (mid1) and
      PTN001089542 (105 leaves: anillins, rhotekins and related). PAINT already records NOT IRD for this
      term at PTN002726905 (rhotekin clade). The paralog mid2 (Q9P7Y8, SPAPYUG7.03c) is not a member of
      PTHR21538.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: UNDECIDED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO P78953 GO:0031106: IBA plus PomBase IMP PMID:15385632. QuickGO Q9P7Y8 (mid2): IDA
      PMID:12654901 and IMP PMID:12668659, nothing from PMID:15385632. QuickGO Q9V4P1 (scra): IMP
      PMID:15930114 and PMID:20237160.'
    - 'QuickGO by reference PMID:15385632 (24 rows): the four septins and mid1 are annotated, mid2 is
      not.'
    - publications/PMID_15385632.md is marked full text but holds only the abstract, introduction, part
      of the methods and the discussion (no results); it names Mid2p 16 times and mid1 never. The PubMed
      MCP returned no PMC full text for PMC532033, and a direct PMC fetch returned a bot page.
    - UniProt Q9P7Y8 gives mid2 ORF SPAPYUG7.03c; the old review text had SPCC18B5.04.
    review_edited: true
    notes: >-
      The old reason (no experimental support, mid1/mid2 conflated by propagation) misread the tree: mid1
      is its own seed and mid2 is not in the family. The real question is whether the PomBase IMP was
      keyed to mid1 in place of mid2. The annotation pattern makes that likely, but the results section
      was not readable, so under the wrong-gene rule it is a query, not a finding. Both the IBA row and
      the IMP row it rests on were set to UNDECIDED (the IMP row had been REMOVE on a "verified full
      text" claim that the cache does not support); this second row is outside the todo list and was
      edited because the two are judged together. The PMID:15385632 reference finding was reworded. If
      PomBase moves the row to mid2, the PAINT fix is MOVE_IBD to PTN001089542. just validate still
      reports one error on a PMID:30853434 quote that predates this change.
- gene_file: genes/SCHPO/spa2/spa2-ai-review.yaml
  rows:
  - go_id: GO:0005078
    go_label: MAP kinase scaffold activity
    family: PTHR21601
    ibd_node: PTN004550576
    tree_reading: >-
      IBD at PTN004550576 (23 leaves, 19 species), the family root, one seed, S. cerevisiae SPA2
      (SGD:S000003944). Children: PTN000492368 (19 leaves: fungi, a fly and a choanoflagellate member)
      and PTN008578055 (4 leaves, Paramecium and Chlamydomonas). Inside the fungal part, S. pombe spa2
      (leaf PTN000492380) is in PTN008578053 (2 leaves, S. pombe and S. japonicus), and the seed is in
      PTN001091461 (5 leaves, 4 species, the budding-yeast branch that also carries the bud tip and bud
      neck IBDs); the two join at PTN000492370 (12 leaves). No PAINT loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001091461
    evidence_checked:
    - Row quotes from PMID:25428987 (no physical or genetic interaction of S. pombe Spa2 with MAP kinases)
      and PMID:40931936 (Pek1 not at tips and unaffected in spa2 deletion; SHD binds Gyp3) read in the
      review; not re-fetched.
    - interpro/panther/PTHR21601/PTHR21601-review.yaml assesses this node and term as TOO_DEEP and asks
      for the IBD to move to the budding-yeast Spa2 branch.
    review_edited: false
    notes: Existing reason is node-aware and rests on direct negative data on the target. The family review
      names no target node; PTN001091461 is the budding-yeast branch holding the seed. Because the family
      review also doubts the term for SPH1, the curator may prefer the SPA2 leaf.
- gene_file: genes/yeast/SPA2/SPA2-ai-review.yaml
  rows:
  - go_id: GO:0120105
    go_label: mitotic actomyosin contractile ring, intermediate layer
    family: PTHR21601
    ibd_node: PTN004550576
    tree_reading: >-
      IBD at the family root PTN004550576 (23 leaves, 19 species), one seed, S. pombe spa2
      (PomBase:SPAC3G9.05). The seed is in PTN008578053 (2 leaves, Schizosaccharomyces). SPA2 (leaf
      PTN000492375) and its paralog SPH1 are in PTN000492373 (2 leaves) inside the budding-yeast branch
      PTN001091461 (5 leaves), sister side of PTN000492370 (12 leaves). The root also covers
      PTN008578055 (Paramecium, Chlamydomonas) and a fly and a choanoflagellate leaf with no data. No
      PAINT loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008578053
    evidence_checked:
    - 'QuickGO term lookup: GO:0120105 is defined generically (region between the proximal layer and the
      actin filament layer, containing the accessory protein network), not by organism.'
    - 'publications/PMID_29601579.md (full text): Spa2 forms a ring at the cleavage site, co-localises
      with Myo1 early but does not constrict with it, and binds Cyk3 and Hof1 directly.'
    - Family review PTHR21601 assesses the node as TOO_DEEP and says both budding-yeast reviews remove
      the row.
    review_edited: true
    notes: >-
      The old REMOVE said the cleavage-site role is not membership in the S. pombe layer. That shows the
      layer has not been mapped in budding yeast, not that the term is false; the target binds the
      budding-yeast counterparts of the proteins that define the layer. Node placement is doubtful, so
      MARK_AS_OVER_ANNOTATED. The retired GO:0005826 row on the same gene stays REMOVE and was not
      touched (no consistency warning). The family review sentence "both budding-yeast reviews remove
      the IBA" is now out of date; not edited here.
- gene_file: genes/yeast/SPH1/SPH1-ai-review.yaml
  rows:
  - go_id: GO:0120105
