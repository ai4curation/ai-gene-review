- gene_file: genes/SCHPO/trm402/trm402-ai-review.yaml
  rows:
  - go_id: GO:0002127
    go_label: tRNA wobble base cytosine methylation
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves, 99 species), one seed, S. cerevisiae NCL1 (SGD:S000000120). The
      target leaf PTN000516125 sits in PTN008582549 (2 leaves, 2 species) inside PTN001481177 (4 leaves, 2
      species, the Schizosaccharomyces Trm4a/Trm4b pair), which joins the budding-yeast Trm4 branch at
      PTN000516116 (13 leaves). So the seed and the target are close relatives separated by a
      Schizosaccharomyces duplication. No PAINT loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000516125
    evidence_checked:
    - Row quote from PMID:30646830 (Trm4b methylates C34 in vitro but not in vivo; the duplication is
      recent) read in the review.
    review_edited: false
    notes: Reason is node-aware and rests on paralog-resolved in vivo data. The loss is placed on the S.
      pombe leaf because the evidence is for S. pombe only; PTN008582549 would extend it to S. japonicus.
      The ISO row on the same term carries the same action.
  - go_id: GO:1902775
    go_label: mitochondrial large ribosomal subunit assembly
    family: PTHR22808
    ibd_node: PTN000516076
    tree_reading: >-
      IBD at PTN000516076 (153 leaves), one seed, MGI:1919431 (Nsun4). In the tree that gene id belongs
      to leaf PTN001867281, UniProt C4P6S0, which sits in PTN000516078 (57 leaves, the Trm4/NSUN2 clade
      that also holds the target), next to a pig leaf and the NSUN2 orthologs. C4P6S0 is SHTAP, a testis
      product of the Nsun4 locus. The NSUN4 methyltransferase orthologs (human Q96CB9) form PTN008374330
      (15 leaves, 15 species) under PTN000516152, outside PTN000516076; mouse Q9CZ57 is not a leaf.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008374330
    evidence_checked:
    - 'QuickGO GO:1902775 for Q9CZ57, C4P6S0, Q96CB9: the experimental row is Q9CZ57 IMP PMID:24516400;
      C4P6S0 has only IBA and ISO; human NSUN4 has five IDA rows.'
    - UniProt C4P6S0 is "Sperm head and tail associated protein", gene Nsun4, synonym Shtap, 806 aa, with
      Q9CZ57 listed as external isoforms 1 and 2.
    - tv.py lineage for C4P6S0 and Q96CB9 in PTHR22808.
    review_edited: true
    notes: >-
      The seed annotation is sound for NSUN4 but reaches this node through a different product of the
      same locus, so the node has no valid seed for the term. The old reason said the PAINT node was
      unaudited; reason and source comment rewritten. PTN008374330 is strictly outside the current IBD
      node, so the fix is removal at PTN000516076 plus a new IBD on the NSUN4 clade; MOVE_IBD is the
      nearest vocabulary term. The family review PTHR22808 does not mention C4P6S0; worth adding there.
      Human NSUN2 receives the same rows.
