    tree_reading: >-
      Same node as SPA2: IBD at the root PTN004550576 (23 leaves), one S. pombe seed in PTN008578053 (2
      leaves). SPH1 (Q06160) is the paralog of SPA2 in PTN000492373 (2 leaves, 1 species), inside
