  rows:
  - go_id: GO:0071028
    go_label: nuclear mRNA surveillance
    family: PTHR23003
    ibd_node: PTN000543777
    tree_reading: >-
      IBD at PTN000543777 (107 leaves, 48 species), 3 seeds: yeast GBP2 and HRB1 and Ustilago RRM75
      (A0A0D1DZT6). Children: PTN009058375 (64 leaves, animal MYEF2 and hnRNP M side, no seed) and
      PTN008587029 (43 leaves, fungi). Inside the fungal child, GBP2 and HRB1 sit with MRD1 in
      PTN001124014 (7 leaves, 3 species; it also holds a C. albicans leaf named SBP1, Q5ANP6), which
      carries an IBD for poly(A)+ mRNA export. SBP1 (leaf
      PTN002744293) sits with RNP1 and RRT5 in PTN004592451 (6 leaves, 3 species); the two groups join
      at PTN009058392 (13 leaves, 3 species). The Ustilago seed is in PTN009058402 (10 leaves) and joins
      at PTN002542609 (40 leaves). No PAINT loss recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001124014
    evidence_checked:
    - 'QuickGO GO:0071028: GBP2 and HRB1 IMP PMID:24452287 (SGD), RRM75 IGI PMID:37776379; SBP1 IBA
      only.'
    - Row quote from PMID:39617253 (Sbp1 binds 5'UTRs and represses translation initiation) read in the
      review.
    review_edited: false
    notes: >-
      The closest call among the upheld rows. The seeds bracket SBP1 inside the fungal clade, so the
      inference is not a transfer across an unseeded branch. The ground is that the 13-leaf
      Saccharomycetes clade is a set of functionally distinct RRM paralogs (Mrd1 in rRNA processing,
