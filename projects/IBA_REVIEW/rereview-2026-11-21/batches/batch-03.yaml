      PTN008308144 (subfamily SF219). mof (O02193, SF82) is in PTN008308198, below PTN000834919, which
      carries its own IBDs for MSL complex and NSL complex. The family's only other PAINT record for the
      term is a separate IBD at PTN008502147 (52 leaves, a plant clade seeded by two Arabidopsis genes);
      no loss is recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008308144
    evidence_checked:
    - >-
      QuickGO annotation search by geneProductId and goId with goUsage=descendants; the query shape returned
      experimental hits for the seeds, so empty results on targets are real.
    - >-
      Q92993 KAT5: IDA PMID:10966108, PMID:14966270, PMID:27153538 for GO:0035267. Q960X4 Tip60: IDA PMID:15528408,
      IPI PMID:32432549. Q8CHK4 Kat5: IDA PMID:32542325.
    - 'O02193 mof: only the IBA row for GO:0035267.'
    review_edited: false
    notes: >-
      Existing reason already names the node and the Tip60 versus MOF/KAT8 split; left unchanged. No PTHR10615
