- gene_file: genes/human/ARFGEF3/ARFGEF3-ai-review.yaml
  rows:
  - go_id: GO:0005085
    go_label: guanyl-nucleotide exchange factor activity
    family: PTHR10663
    ibd_node: PTN008950430
    tree_reading: >-
      IBD at the family root PTN008950430 (932 leaves) with 19 seeds, including human ARFGEF1 (Q9Y6D6)
      and ARFGEF2 (Q9Y6D5). ARFGEF3 (Q5TH69) is in the BIG3 clade PTN007453461 (28 leaves, 27 species),
      sister to the ARFGEF1/2 clade PTN002240728 (58 leaves) under PTN008950442. Human and mouse Arfgef3
      share the node PTN000070693 (6 leaves, primates and rodents). No PAINT loss for the term is recorded
      on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000070693
    evidence_checked:
    - >-
      Review's residue_claims: glutamic finger Glu replaced by Asn692 in Q5TH69 and Ser688 in mouse Q3UGY8,
      17 of 17 active donors carry Glu (ARFGEF3-bioinformatics/sec7_catalytic_check.py). Not re-run here.
    review_edited: false
    notes: >-
      The loss is demonstrated for human and mouse, so the IRD target given is the smallest node holding
      both. It probably arose at the base of the BIG3 clade (PTN007453461 or PTN008308935); that needs
      the other members' Sec7 sequences checked before a deeper IRD is requested. Existing reason is node-aware;
      unchanged.
