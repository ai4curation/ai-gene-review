- gene_file: genes/worm/che-3/che-3-ai-review.yaml
  rows:
  - go_id: GO:0060294
    go_label: cilium movement involved in cell motility
    family: PTHR10676
    ibd_node: PTN000743491
    tree_reading: >-
      che-3 (Q19542) is in the nematode node PTN007454641 (3 leaves: C. elegans, C. briggsae, P. pacificus)
      inside the dynein-2 clade PTN002472914 (31 leaves). The IBD is at the family root PTN000743491 (422
      leaves). The 16 seeds are axonemal heavy chains; no dynein-2 member is a seed. PAINT records NOT
      IRD for this term on the dynein 1 clade PTN000072732 only.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002472914
    evidence_checked:
    - >-
      QuickGO annotation search by geneProductId and goId with goUsage=descendants; the query shape returned
      experimental hits for the seeds, so empty results on targets are real.
    - 'Q19542 che-3: IBA only for GO:0060294. Dynein-2 members of fly, mouse and human: IBA only.'
    - Review cites PMID:10790327 for che-3 expression and function in sensory cilia.
    review_edited: false
    notes: >-
      Two grounds agree: C. elegans has only non-motile sensory cilia, and the dynein-2 subfamily is the
      IFT motor in every lineage. The IRD is therefore requested for the whole dynein-2 clade, as for
      human DYNC2H1. The written reason states the lineage ground without naming nodes; it is sound, so
      the review was not edited. One supporting_text on this row ('model: Edison Scientific Literature')
      is not evidence for anything and should be dropped in a later pass.
  - go_id: GO:0097729
    go_label: 9+2 motile cilium
    family: PTHR10676
    ibd_node: PTN000743491
    tree_reading: >-
      che-3 (Q19542) is in the nematode node PTN007454641 (3 leaves: C. elegans, C. briggsae, P. pacificus)
      inside the dynein-2 clade PTN002472914 (31 leaves). The IBD is at the family root PTN000743491 (422
      leaves). The 28 seeds are axonemal heavy chains. PAINT records NOT IRD for this term on the dynein
      1 clade PTN000072732. The dynein-2 clade keeps the term, which is reasonable for species whose motile
      cilia use IFT.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN007454641
    evidence_checked:
    - >-
      QuickGO annotation search by geneProductId and goId with goUsage=descendants; the query shape returned
      experimental hits for the seeds, so empty results on targets are real.
    - >-
      Q19542 che-3: IBA only for GO:0097729; the gene's IDA GO:0097730 non-motile cilium row (PMID:10790327)
      is accepted in the review.
    - 'Q45VK7 and Q0E8P6: IBA only.'
    review_edited: false
    notes: >-
      C. elegans has no 9+2 motile cilium, so the loss is placed on the nematode node, not on the whole
      dynein-2 clade (the human DYNC2H1 review accepts this IBA). The nematode node includes P. pacificus,
      assumed to share the absence of motile cilia; PAINT should confirm before placing the IRD there
      instead of on the Caenorhabditis node PTN000073195.
