genes:
- gene_file: genes/human/AGT/AGT-ai-review.yaml
  rows:
  - go_id: GO:0004867
    go_label: serine-type endopeptidase inhibitor activity
    family: PTHR11461
    ibd_node: PTN008970140
    tree_reading: >-
      The IBD sits at PTN008970140 (279 leaves, 21 species), whose children are PTN008970141 (278
      leaves, the vertebrate SERPINA-type clade, holding the target) and a single Branchiostoma leaf
      PTN000894661. The nine seeds (SERPINA1, SERPINA5, SERPINA9, bovine SERPINA3-1 and SERPINA3-3,
      rodent Serpina1, Serpina1b, Serpina5, Serpinc1) are all in PTN008970141. AGT sits inside it in
      the 23-leaf angiotensinogen clade PTN008518321 (20 mammal, bird, reptile and Xenopus AGT leaves
      in PTN008518322 plus 3 fish leaves in PTN002606916), which carries its own IBDs for GO:0038166
      and GO:0042981. The only PAINT loss for GO:0004867 in the family is a NOT IRD at PTN000156704,
      the 11-leaf SERPINB13 clade, under the other inhibitor IBD at PTN000156127.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008518321
    evidence_checked:
    - QuickGO P01009 GO:0004867, IDA PMID:15795238 (MGI) and NAS, plus IBA and IEA.
    - QuickGO P05154 GO:0004867, ten IDA rows (UniProt).
    - QuickGO Q86WD7 GO:0004867, IDA PMID:15489334.
    - >-
      QuickGO P01019 GO:0004867, only IBA, IEA and a TAS from PMID:3397061 (the review removes all
      three consistently).
    - >-
      The review row quotes PMID:20927107 and PMID:30563843 for the non-inhibitory status and the
      lost S-to-R transition; quotes not re-read here.
    - No family review exists for PTHR11461.
    review_edited: false
    notes: >-
      The existing reason already names the node, calls the seeds sound and asks for an IRD at the
      angiotensinogen node, so the review was left alone. The loss evidence is for mammalian AGT;
      whether the three fish leaves in PTN002606916 share it was not checked, so the IRD could be
      placed at PTN008518322 instead if the curator prefers the tetrapod clade.
- gene_file: genes/mouse/Serpinh1/Serpinh1-ai-review.yaml
  rows:
  - go_id: GO:0004867
    go_label: serine-type endopeptidase inhibitor activity
    family: PTHR11461
    ibd_node: PTN000156127
    tree_reading: >-
      The IBD sits at PTN000156127 (475 leaves, 23 species) with 24 seeds, which the treeview lists
      as clade B, E, F, G and I type inhibitory serpins (for example P30740 SERPINB1, P05121
      SERPINE1, P05155 SERPING1, P08697 SERPINF2, Q99574 SERPINI1). Serpinh1 sits in the 27-leaf
      SERPINH clade PTN002606963 (19 tetrapod SERPINH1 leaves in PTN008970212 and 8 fish leaves in
      PTN008322136), which carries its own IBDs for GO:0005783 endoplasmic reticulum and GO:0030199
      collagen fibril organization and an existing NOT IRD for GO:0005576 extracellular region. No
      seed of the inhibitor IBD is in PTN002606963. PAINT already blocks GO:0004867 inside this IBD
      for the SERPINB13 clade PTN000156704 (NOT IRD, 11 leaves) but not for the SERPINH clade.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002606963
    evidence_checked:
    - Seed list read from treeview; node.py listing of PTN002606963 members and children.
    - >-
      The review row quotes PMID:27838364, PMID:21683254 and PMID:12685865, each stating that HSP47
      has no serine protease inhibitory activity; quotes not re-read here.
    - No family review exists for PTHR11461.
    review_edited: false
    notes: >-
      The reason rests on documented loss of inhibitor activity in HSP47 (a collagen chaperone), which
      is a target-clade loss. It also mentions that no experimental row supports the term, which is
      not a ground on its own but is not what the removal rests on. Left alone.
- gene_file: genes/worm/C28G1.2/C28G1.2-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11461
    ibd_node: PTN000156123
    tree_reading: >-
      The IBD sits near the family root at PTN000156123 (1371 of 1373 leaves, 81 species) with 51
      seeds, all vertebrate, Drosophila, Anopheles or Arabidopsis serpins; none is a nematode protein.
      C28G1.2 sits in the Caenorhabditis duplication clade PTN002479232 (18 leaves, 9 C. elegans and 9
      C. briggsae, holding srp-1, srp-2, srp-3, srp-6, srp-7, srp-8), whose parent PTN002479231 (28
      leaves) adds a 10-leaf Pristionchus clade PTN008322203 and carries an IBD for GO:0004867 with
      one WormBase seed. The only PAINT loss for GO:0005576 in the family is the NOT IRD at
      PTN002606963, which is the 27-leaf vertebrate SERPINH1 (HSP47) clade, not clade B.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002479232
    evidence_checked:
    - QuickGO P01009 GO:0005576, IDA PMID:25645918, IMP and HDA rows; the root seeds are secreted serpins.
    - node.py PTHR11461 GO:0005576, two records only (IBD at PTN000156123, NOT IRD at PTN002606963).
    - node.py listing of PTN002606963, all SERPINH1, serpinh2 and fish HSP47-like leaves.
    - >-
      The review row quotes PMID:25786854 (nematode serpins lack a signal peptide, GFP fusions
      cytoplasmic and not secreted) and PMID:14739286; quotes not re-read here.
    review_edited: true
    notes: >-
      Action unchanged. The summary, reason, source comment and one suggested question called
      PTN002606963 the vertebrate clade B node; it is the SERPINH1 (HSP47) clade. Corrected, and the
      reason now names PTN002479232 as the node for the NOT. The loss evidence is from C. elegans
      clade members (SRP-2 and paralog GFP fusions); C28G1.2 itself is unlocalized and lacks a
      predicted signal peptide. The Pristionchus sister clade was not assessed, so the fix is
      placed at the Caenorhabditis node, not at PTN002479231.
- gene_file: genes/worm/srp-2/srp-2-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11461
    ibd_node: PTN000156123
    tree_reading: >-
      Same IBD as for C28G1.2, at PTN000156123 (1371 leaves, 51 seeds, none nematode). srp-2 sits
      in the 2-leaf C. elegans and C. briggsae srp-2 pair PTN001351861 inside the Caenorhabditis
      clade PTN002479232 (18 leaves), under PTN002479231 (28 leaves, with a 10-leaf Pristionchus
      clade). The only PAINT loss for GO:0005576 in the family is at PTN002606963, the vertebrate
      SERPINH1 (HSP47) clade.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002479232
    evidence_checked:
    - Same tree lookups as for C28G1.2.
    - >-
      The review row quotes PMID:25786854 three times (no signal peptide by three predictors, not
      secreted by a conventional or unconventional route, obligate intracellular serpin); quotes not
      re-read here. The gene carries a NEW cytosol IDA row from the same paper.
    review_edited: true
    notes: >-
      Action unchanged; direct experimental evidence of non-secretion on the target. The reason, the
      source comment and one suggested question called PTN002606963 the vertebrate clade B node; it
      is the SERPINH1 (HSP47) clade. Corrected. The IEA row on the same term is also REMOVE, so the
      actions stay consistent.
- gene_file: genes/yeast/CTT1/CTT1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR11465
    ibd_node: PTN000157252
    tree_reading: >-
      The IBD sits at PTN000157252 (102 leaves, 54 species), whose children are PTN000157253 (86
      leaves, animals, fungi and others, holding the target) and PTN008322296 (16 leaves,
      Paramecium, Phytophthora and early plants). It has one seed, SGD:S000002664 (CTA1). Inside
      the fungal node PTN000894898 (29 leaves, 13 species) there are three children: PTN000894828
      (14 leaves, the catalase A clade with CTA1, Candida CAT1 and S. pombe ctt1), PTN004262183 (12
      leaves, the catalase T clade with CTT1, two Yarrowia leaves and filamentous fungal leaves) and
      PTN002262901 (3 leaves). The seed and the target are in different children of that fungal
      duplication. No PAINT loss is recorded for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000894828
    evidence_checked:
    - >-
      QuickGO P15202 GO:0005739 with descendants, one experimental row, GO:0005759 mitochondrial
      matrix IDA PMID:14998369 (SGD), plus the IBA.
    - QuickGO P04040 GO:0005739 with descendants, only the IBA (human catalase is not a seed).
    - >-
      QuickGO P06115 GO:0005737 with descendants, cytoplasm HDA PMID:14562095 and cytosol RCA, and
      the mitochondrion and peroxisome IBAs only.
    - >-
      Family review interpro/panther/PTHR11465/PTHR11465-review.yaml has a node assessment for
      PTN000157252 GO:0005739 noting that the term reaches cytosolic CTT1 and is kept by CTA1 and
      S. pombe cta1.
    review_edited: true
    notes: >-
      Action unchanged. The old reason was one line that leaned on the single-donor list and on the
      absence of Ctt1 evidence, and the source comment wrongly said the node was grounded by animal
      catalases as well. Rewritten to state the tree ground: one seed in the catalase A clade, the
      IBD 4 nodes higher, the target in the sister catalase T clade.
  - go_id: GO:0005777
    go_label: peroxisome
    family: PTHR11465
    ibd_node: PTN000157252
    tree_reading: >-
      Same node, PTN000157252 (102 leaves), with seven seeds, human, bovine, mouse and rat CAT, worm
      WBGene00000831, Dictyostelium DDB_G0274595 and yeast CTA1, so the peroxisomal state is
      supported across animals, Dictyostelium and fungi. A second peroxisome IBD sits at the plant
      node PTN000157342 (133 leaves). CTT1 sits in the fungal catalase T clade PTN004262183 (12
      leaves), sister to the catalase A clade PTN000894828 (14 leaves) under the fungal node
      PTN000894898. No PAINT loss is recorded for the term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004262183
    evidence_checked:
    - >-
      QuickGO P15202 GO:0005777 with descendants, GO:0005782 peroxisomal matrix IDA PMID:1986244
      (SGD).
    - QuickGO P06115 GO:0005777 with descendants, only the IBA.
    - >-
      The review row quotes the UniProt record (subcellular location cytoplasm; catalase A is the
      peroxisomal form) and notes the C-terminus lacks a PTS1.
    - Family review PTHR11465 has a node assessment for PTN000157252 GO:0005777 saying the same.
    review_edited: true
    notes: >-
      Action unchanged. The old reason said the peroxisomal location belongs to the paralog Cta1,
      which misreads the node: the seeds span animals and Dictyostelium, so the location is
      ancestral and it is the catalase T lineage that lost it. Rewritten. The loss evidence is for
      S. cerevisiae Ctt1 only; whether the other 11 leaves of PTN004262183 lack a peroxisomal signal
      was not checked, so the curator may prefer the 3-leaf node PTN002262902.
