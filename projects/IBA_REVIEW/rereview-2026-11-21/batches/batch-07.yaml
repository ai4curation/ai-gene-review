- gene_file: genes/yeast/CTT1/CTT1-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR11465
    ibd_node: PTN000157252
    tree_reading: >-
      The IBD sits at PTN000157252 (102 leaves, 54 species), whose children are PTN000157253 (86
      leaves, animals, fungi and others, holding the target) and PTN008322296 (16 leaves,
      Paramecium, Phytophthora and early plants). It has one seed, SGD:S000002664 (CTA1). Inside
      the fungal node PTN000894898 (29 leaves, 13 species) there are three children: PTN000894828
      (14 leaves, the catalase A clade with CTA1, Candida CAT1 and S. pombe ctt1), PTN004262183 (12
      leaves, the catalase T clade with CTT1, two Yarrowia leaves and filamentous fungal leaves) and
      PTN002262901 (3 leaves). The seed and the target are in different children of that fungal
      duplication. No PAINT loss is recorded for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000894828
    evidence_checked:
    - >-
      QuickGO P15202 GO:0005739 with descendants, one experimental row, GO:0005759 mitochondrial
      matrix IDA PMID:14998369 (SGD), plus the IBA.
    - QuickGO P04040 GO:0005739 with descendants, only the IBA (human catalase is not a seed).
    - >-
      QuickGO P06115 GO:0005737 with descendants, cytoplasm HDA PMID:14562095 and cytosol RCA, and
      the mitochondrion and peroxisome IBAs only.
    - >-
      Family review interpro/panther/PTHR11465/PTHR11465-review.yaml has a node assessment for
      PTN000157252 GO:0005739 noting that the term reaches cytosolic CTT1 and is kept by CTA1 and
      S. pombe cta1.
    review_edited: true
    notes: >-
      Action unchanged. The old reason was one line that leaned on the single-donor list and on the
      absence of Ctt1 evidence, and the source comment wrongly said the node was grounded by animal
      catalases as well. Rewritten to state the tree ground: one seed in the catalase A clade, the
      IBD 4 nodes higher, the target in the sister catalase T clade.
  - go_id: GO:0005777
    go_label: peroxisome
    family: PTHR11465
    ibd_node: PTN000157252
    tree_reading: >-
      Same node, PTN000157252 (102 leaves), with seven seeds, human, bovine, mouse and rat CAT, worm
      WBGene00000831, Dictyostelium DDB_G0274595 and yeast CTA1, so the peroxisomal state is
      supported across animals, Dictyostelium and fungi. A second peroxisome IBD sits at the plant
      node PTN000157342 (133 leaves). CTT1 sits in the fungal catalase T clade PTN004262183 (12
      leaves), sister to the catalase A clade PTN000894828 (14 leaves) under the fungal node
      PTN000894898. No PAINT loss is recorded for the term in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004262183
    evidence_checked:
    - >-
      QuickGO P15202 GO:0005777 with descendants, GO:0005782 peroxisomal matrix IDA PMID:1986244
      (SGD).
    - QuickGO P06115 GO:0005777 with descendants, only the IBA.
    - >-
      The review row quotes the UniProt record (subcellular location cytoplasm; catalase A is the
      peroxisomal form) and notes the C-terminus lacks a PTS1.
    - Family review PTHR11465 has a node assessment for PTN000157252 GO:0005777 saying the same.
    review_edited: true
    notes: >-
      Action unchanged. The old reason said the peroxisomal location belongs to the paralog Cta1,
      which misreads the node: the seeds span animals and Dictyostelium, so the location is
      ancestral and it is the catalase T lineage that lost it. Rewritten. The loss evidence is for
      S. cerevisiae Ctt1 only; whether the other 11 leaves of PTN004262183 lack a peroxisomal signal
      was not checked, so the curator may prefer the 3-leaf node PTN002262902.
- gene_file: genes/human/TYRP1/TYRP1-ai-review.yaml
  rows:
  - go_id: GO:0004503
    go_label: tyrosinase activity
    family: PTHR11474
    ibd_node: PTN000895596
    tree_reading: >-
      The IBD sits at PTN000895596 (130 leaves, 28 species), whose children are PTN000895597 (129
      leaves, holding TYR, TYRP1 and DCT clades) and one Monosiga leaf PTN000895649. Its three seeds
      are human TYR (P14679), mouse Tyr (MGI:98880) and human TYRP1 itself (P17643), so the target
      is its own seed. TYRP1 sits in the 25-leaf vertebrate TYRP1 clade PTN002607660, which carries
      its own IBDs for melanosome, melanosome organization and melanocyte differentiation. PAINT
      already blocks the term for the DCT clade with a NOT IRD at PTN002607650 (which carries the
      dopachrome isomerase IBD), but not for the TYRP1 clade.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002607660
    evidence_checked:
    - >-
      QuickGO P17643 GO:0004503, one experimental row, IDA PMID:21291857 (UniProt), plus the IBA.
      This is the row that makes TYRP1 a seed.
    - >-
      publications/PMID_21291857.md (full text cached). The passage reads that western blot showed
      reduced tyrosinase protein and enzyme assays showed tyrosinase activity in GIPC and
      APPL-knockdown cells, and that TRP1 and TRP2 levels did not change. The assay is of cellular
      tyrosinase in melanoma cell lysates, not of TYRP1.
    - QuickGO P14679 GO:0004503, IDA PMID:11092760 and EXP PMID:28661582; P11344 EXP PMID:1537333. The TYR seeds are sound.
    - QuickGO P07147 (mouse Tyrp1) GO:0004503, only ISS, ISO, IEA and IBA, all derived from human TYRP1.
    - The review row quotes PMID:28661582 (two zinc ions in the active site, purified domain without tyrosine hydroxylase or DOPA oxidase activity); quotes not re-read here.
    - No family review exists for PTHR11474.
    review_edited: false
    notes: >-
      Two grounds combine. The TYRP1 seed is a bad seed (the IDA measures lysate tyrosinase after
      GIPC or APPL knockdown), and the review removes that IDA row together with the IBA, so the
      two are judged consistently. Independently, the crystal structure paper gives target-specific
      loss evidence. The existing reason states the loss; it does not name the node or mention that
      TYRP1 is a seed, but it rests on a valid ground, so it was left alone. The upstream fix has
      two parts, removing the P17643 IDA from PMID:21291857 at UniProt and adding the IRD at the
      TYRP1 clade. The loss evidence is for human TYRP1; older reports of DHICA oxidase activity for
      mouse Tyrp1 were not examined.
- gene_file: genes/human/FGF10/FGF10-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: &fgf_cyto_tree >-
      The IBD sits at the family root PTN000160075 (504 leaves, 32 species), whose children are
      PTN007510376 (69 leaves, the FGF8/FGF17/FGF18 and egl-17 clade) and PTN000896506 (435 leaves,
      everything else). The 13 seeds fall in five places. Cytosolic residents without a signal
      peptide, human FGF1 and chicken FGF2 in the FGF1/FGF2 clade PTN000896537 (45 leaves), and human
      FGF13, mouse Fgf13 and Fgf14 and zebrafish fgf11 and fgf11b in the FGF homologous factor clade
      PTN000160077 (91 leaves). Secreted FGFs in the FGF7/FGF10/FGF22/FGF3 clade PTN008519124 (87
      leaves), mouse Fgf7, Fgf22 and Fgf3. Secreted FGFs in the FGF8 clade, rat Fgf18 and zebrafish
      fgf8a. And worm let-756. PAINT separately records nucleus IBDs at PTN000160077 and PTN000896537
      and NOT extracellular region IRDs at PTN000160077 and PTN002608270. The 185-leaf clade
      PTN008519134 (FGF4, FGF5, FGF6, FGF9, FGF16, FGF20, FGF19, FGF21, FGF23) holds no seed; its
      sister under PTN008971209 (277 leaves) is the FGF homologous factor clade PTN008322752.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: &fgf_cyto_evidence
    - >-
      Seeds mapped to UniProt through UniProt cross-reference search and located in the tree with
      a local script over the treeview loaders.
    - >-
      QuickGO GO:0005737 with descendants for each seed. FGF1 P05230, cytosol IDA PMID:12746488.
      Chicken FGF2 P48800, five cytosol IDA rows (AgBase). FGF13 Q92913, cytoplasm EXP PMID:10644718.
      Mouse Fgf13 P70377, cytoplasm IDA PMID:21817159 and EXP rows, cytosol IDA. Mouse Fgf14 P70379,
      cytosol IDA PMID:10644718. Zebrafish fgf11 and fgf11b, cytoplasm IDA PMID:41052555.
    - >-
      Seeds from secreted FGFs. Mouse Fgf7 P36363 and Fgf22 Q9ESS2, Golgi apparatus IDA PMID:12837279
      (abstract, tagged FGF-22 in transfected cells was present within the cell and at the cell
      surface). Zebrafish fgf8a O57341, lysosome IDA PMID:15498491 (title, endocytosis controls
      spreading of Fgf8). Mouse Fgf3 P05524, cytoplasm IDA PMID:7591288. Rat Fgf18 O88182, cytoplasm
      IDA PMID:16756958. Worm let-756 Q11184, cytoplasm IDA PMID:16487967. Full texts not read.
    - No family review exists for PTHR11486.
    review_edited: true
    notes: >-
      The earlier reason said the node was driven by FGF1, FGF2 and the intracellular FGFs. That
      misstates the seed list, which also holds six located_in rows on secreted FGFs, three of them
      in FGF10's own 87-leaf clade. With seeds on both sides of every duplication the REMOVE has no
      MISPLACED_IBD ground, and there is no loss. FGF10 is also reported in the cytoplasm and nuclei
      of urothelial cells after uptake (its nucleus IDA rows are kept as non-core). The claim is
      true as a transit or uptake location and wrong as a site of activity, so the action is
      MARK_AS_OVER_ANNOTATED. The PAINT request is to lower the cytoplasm IBD to the two clades of
      cytosolic residents, PTN000160077 and PTN000896537 (the format takes one target id).
- gene_file: genes/human/FGF19/FGF19-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: true
    notes: &fgf_endocrine_note >-
      A close call. No seed sits in the 185-leaf secreted clade that holds the endocrine FGFs, so a
      MISPLACED_IBD reading is available, and the earlier reason took it. It was not upheld because
      the same node is seeded by Golgi and lysosome rows on other secreted FGFs, which shows the
      curator placed cytoplasm at the root to cover secretory transit, and in that sense the term
      is as true of an endocrine FGF as of FGF7. Removing it for FGF19, FGF21 and FGF23 while
      marking it over-annotated for FGF7 and FGF10 would turn on which paralog happened to be
      stained, not on biology. All five are therefore MARK_AS_OVER_ANNOTATED, and the earlier
      summary, which named only FGF1, FGF2 and intracellular FGFs as donors, was corrected. A
      maintainer who reads is_active_in strictly could restore REMOVE for the three endocrine genes
      on MISPLACED_IBD grounds without contradicting the tree.
- gene_file: genes/human/FGF21/FGF21-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: *fgf_cyto_tree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000160077
    evidence_checked: *fgf_cyto_evidence
    review_edited: true
    notes: *fgf_endocrine_note
  - go_id: GO:0008284
    go_label: positive regulation of cell population proliferation
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves) with 31 seeds spread over most
      subfamilies. Three are in the FGF19/FGF21 clade PTN002608284 (37 leaves): mouse Fgf21 (Q9JJN1),
      whose common ancestor with human FGF21 is the 6-leaf mammalian FGF21 node PTN000160408, human
      FGF19 (O95750) and zebrafish fgf19 (A0A0R4IN60). PAINT records losses for this term at the FGF
      homologous factor node PTN000160077 and at the Ciona leaf PTN000160186, none in the endocrine
      clade.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO Q9JJN1 GO:0008284, IGI PMID:18187602 (MGI) with qualifier acts_upstream_of_or_within,
      plus the IBA. O95750, IGI PMID:18187602 (MGI). A0A0R4IN60, IMP PMID:16256099 (ZFIN). Q9NSA1
      (the target), only the IBA; the query shape returned experimental rows for the seeds.
    - >-
      publications/PMID_18187602.md (full text cached). FGF21 had no mitogenic effect on BaF3 cells
      expressing FGFR1c alone and stimulated proliferation of FGFR1c/BaF3 transfectants expressing
      beta-Klotho. The proliferation is the readout of a reconstituted receptor-activation assay.
    - >-
      publications/PMID_15902306.md (full text cached). FGF-21 mitogenically inactive on several
      FGF-sensitive cell lines and primary cells; no hyperplasia or tumors in transgenic or infused
      mice.
    review_edited: true
    notes: >-
      The earlier reason treated the non-mitogenicity paper as target-specific loss evidence, and
      it is real evidence. But the mouse ortholog of the target is itself an experimental seed of
      this node, from a paper showing FGF21-driven proliferation once beta-Klotho is supplied, so
      the 2005 negative result is explained by missing co-receptor and the term cannot be called
      lost. The seed row is a reconstituted assay with the weaker qualifier, and FGF21 is not a
      physiological mitogen, so the row is marked over-annotated, not kept. One verbatim quote from
      PMID:18187602 was added to supported_by. No PAINT change is requested; an IRD on the FGF21
      clade would contradict its own seed.
  - go_id: GO:0022008
    go_label: neurogenesis
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves) with 16 seeds, among them FGF8 family
      members, mouse and chicken Fgf2, mouse Fgf10, Fgf5 and Fgf13, rat Fgf20, zebrafish fgf3, fgf16
      and fgf8a and Drosophila bnl. One seed, zebrafish fgf19 (A0A0R4IN60), is in the FGF19/FGF21
      clade PTN002608284 (37 leaves) with the target; it sits in the 5-leaf fish child PTN002608290
      and FGF21 in the 32-leaf child PTN000160451. The only PAINT loss for the term is at the FGF
      homologous factor node PTN000160077.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO A0A0R4IN60 GO:0022008 with descendants, IMP rows from PMID:16256099 and PMID:18089288
      (ZFIN) on neuron, oligodendrocyte and retinal ganglion cell terms, qualifier
      acts_upstream_of_or_within.
    - QuickGO Q9NSA1 and Q9JJN1 GO:0022008 with descendants, only the IBA.
    - The review row quotes PMID:23933984 and PMID:25130400 for adult neuroendocrine action; not re-read.
    review_edited: true
    notes: >-
      The earlier reason was that no evidence shows FGF21 generates neurons, which is absence of
      data, plus an unsupported statement that the endocrine clade diverged from the developmental
      role (its nearest seed, fgf19, is in that clade). No loss, no misplaced node, no bad seed.
      The term stays plausible and unverified for a metabolic hormone, so MARK_AS_OVER_ANNOTATED.
  - go_id: GO:0030334
    go_label: regulation of cell migration
    family: PTHR11486
    ibd_node: PTN000160075
    tree_reading: >-
      The IBD sits at the family root PTN000160075 (504 leaves) with 12 seeds, FGF1, FGF2 (human and
      mouse), FGF4, FGF7, FGF10 (human and mouse), rat Fgf9, FGF16, FGF18, zebrafish fgf3 and fgf8a.
      None is in the FGF19/FGF21 clade PTN002608284. The nearest, FGF4, Fgf9 and FGF16, share the
      182-leaf node PTN008519135 with FGF21. PAINT losses for the term are at the FGF homologous
      factor node PTN000160077 and the Ciona leaf PTN000160186.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - Seeds located with the local script; QuickGO Q9NSA1 and Q9JJN1 GO:0030334 with descendants, only the IBA.
    - The review row cites PMID:15902306 (non-mitogenic) and PMID:17550778 (fasting induction), neither of which tests migration.
    review_edited: true
    notes: >-
      The earlier reason was the absence of evidence for a motogenic role, which is not a ground.
      Seeds sit on both sides of the deepest split and in the 182-leaf node that holds the endocrine
      clade, so the placement is not shown to be wrong, and nothing shows a loss. Plausible and
      unverified, so MARK_AS_OVER_ANNOTATED.
