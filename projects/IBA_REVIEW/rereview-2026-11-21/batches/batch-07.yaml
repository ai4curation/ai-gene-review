- gene_file: genes/human/CKB/CKB-ai-review.yaml
  rows:
  - go_id: GO:0005576
    go_label: extracellular region
    family: PTHR11547
    ibd_node: PTN000167125
    tree_reading: &ck_tree >-
      The IBD sits at the family root PTN000167125 (182 leaves, 44 species), whose children are
      PTN000899913 (175 leaves, eukaryotic phosphagen kinases) and PTN000167317 (7 bacterial mcsB
      leaves). The three seeds are chicken CKB (P05122), chicken CKM (P00565) and mouse Ckm
      (MGI:88413), all inside the 61-leaf cytosolic creatine kinase node PTN008972977. Chicken CKB
      shares the 17-leaf node PTN000167164 with human CKB; mouse Ckm shares the 6-leaf node
      PTN000167139 and chicken CKM the 16-leaf node PTN001356285 with human CKM. PAINT blocks the
      term for the mitochondrial creatine kinases with a NOT IRD at PTN000899952 (58 leaves, which
      carries the mitochondrion IBD).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008972977
    evidence_checked: &ck_evidence
    - >-
      QuickGO P05122 GO:0005576, located_in IDA PMID:8525081 (AgBase). P00565, the same IDA. P07310
      (mouse Ckm), located_in IDA PMID:24177035 (MGI).
    - >-
      PubMed abstracts. PMID:8525081 separates creatine kinase isoenzymes in plasma and tissues of
      domestic fowl. PMID:24177035 is a dysferlin and myoferlin muscular dystrophy study reporting
      increasing creatine kinase levels. Full texts not read.
    - QuickGO P12277 GO:0005576, ISS (AgBase) and extracellular exosome HDA rows; P06732, only IEA and IBA.
    - No family review exists for PTHR11547.
    review_edited: true
    notes: >-
      The earlier reason was that the extracellular region is not a site of creatine kinase
      activity. That is true, but the seeds are experimental located_in rows on the orthologs of
      the targets themselves, recording enzyme in plasma, and the PAINT curator kept the term for
      the cytosolic isozymes while blocking the mitochondrial ones. None of the four grounds
      applies. Calling the seeds wrong would overrule two curation groups on full texts that were
      not read, so that claim is not made. Plasma creatine kinase is a real observation and not a
      functional location, so the row is MARK_AS_OVER_ANNOTATED, which also matches the existing
      ISS row for the term. A narrower IBD at the cytosolic creatine kinase node would stop the
      term reaching arginine kinases and bacterial McsB, which is the only PAINT change suggested.
