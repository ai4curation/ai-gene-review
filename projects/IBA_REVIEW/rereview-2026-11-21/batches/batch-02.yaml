genes:
- gene_file: genes/ARATH/BGLU26/BGLU26-ai-review.yaml
  rows:
  - go_id: GO:0071472
    go_label: cellular response to salt stress
    family: PTHR10353
    ibd_node: PTN002570733
    tree_reading: >-
      The IBD sits at PTN002570733 (95 leaves, 8 species). Its two seeds, BGLU21 (Q9C525,
      AT1G66270) and BGLU22 (Q9C8Y9, AT1G66280), both sit in PTN004151662, a 5-leaf
      Brassicaceae clade that also holds BGLU23 (the ER-body PYK10 group). That clade is one of
      13 children of the 75-leaf Brassicaceae polytomy PTN004151663. The target BGLU26 sits in
      a different child, the 2-leaf clade PTN007436022 (BGLU26 plus one Brassica napus
      ortholog). The node carrying the IBD is two further levels above the polytomy and also
      covers a 4-leaf Vitis clade (PTN002570734) and Juglans, Citrus, Manihot and Ricinus
      members. No PAINT loss for the term is recorded on the lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004151662
    evidence_checked:
    - >-
      QuickGO geneProductId=Q9C525 goId=GO:0071472: one experimental row,
      acts_upstream_of_or_within, IEP, PMID:19965874 (TAIR), plus the IBA.
    - QuickGO Q9C8Y9 GO:0071472, the same IEP row from PMID:19965874, plus the IBA.
    - QuickGO O64883 GO:0071472, only the IBA (the query shape returned hits for the two seeds).
    - No family review exists for PTHR10353.
    review_edited: false
    notes: >-
      Both seeds are expression-pattern (IEP) rows with the weaker
      acts_upstream_of_or_within qualifier, in one paralog group, yet the IBD asserts
      involved_in for 95 leaves across 13 sister paralog clades. The existing reason already
      says the process is specific to the ER-body subclade, so the review was left alone.
- gene_file: genes/SACS2/lacS/lacS-ai-review.yaml
  rows:
  - go_id: GO:0008378
    go_label: galactosyltransferase activity
    family: PTHR10353
    ibd_node: PTN008498319
    tree_reading: >-
      The IBD sits at PTN008498319 (61 leaves, 43 species), which has two children. The single
      seed, Arabidopsis SFR2 (Q93Y07, AT3G06510), sits in PTN008498320 (57 leaves, 40 species,
      mostly land plants and streptophyte algae, with two Trichomonas leaves). The target lacS
      sits in the other child, PTN000820160 (4 leaves: lacS, Dictyoglomus turgidum Dtur_0462,
      and Thermococcus kodakaraensis TK1827 and TK1761). The same node PTN008498319 also
      carries a NOT IRD (loss) for GO:0008422 beta-glucosidase activity with one seed, while
      the family root PTN000039458 carries the beta-glucosidase IBD.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008498320
    evidence_checked:
    - >-
      QuickGO Q93Y07 GO:0008378 with descendants: IDA GO:0008378 from PMID:20798281 and
      PMID:25100720 (TAIR), and EXP GO:0046480 from the same two papers (UniProt). The seed is
      sound.
    - QuickGO P22498 GO:0008378 with descendants, only the IBA.
    - The review row quotes PMID:25100720 and PMID:20798281 for SFR2 and PMID:16348503 and PMID:9860840 for lacS hydrolysis; not re-read here.
    - No family review exists for PTHR10353.
    review_edited: false
    notes: >-
      The beta-glucosidase loss (NOT IRD) at PTN008498319 is misplaced in the same way and
      should move to PTN008498320 with the IBD, since lacS is an experimentally shown
      beta-glycosidase. The existing reason is node-aware.
- gene_file: genes/human/SLC10A4/SLC10A4-ai-review.yaml
  rows:
  - go_id: GO:0015721
    go_label: bile acid and bile salt transport
    family: PTHR10361
    ibd_node: PTN000040761
    tree_reading: >-
      The IBD sits at PTN000040761 (139 leaves, 23 species), seeded by RGD:3681 and RGD:3682
      (rat Slc10a1 and Slc10a2). The target sits in the 118-leaf child PTN001309645, in the
      SLC10A4 orthologue clade PTN002570911 (19 leaves, 17 species, tetrapod plus fish
      slc10a4), which is one of three children of PTN007436551 (66 leaves) beside the SLC10A5
      clade PTN002570932 and the SLC10A1 clade PTN002570905. PAINT already records a NOT IRD
      for this term at PTN008305092, which is not on the SLC10A4 lineage, so no loss covers the
      target.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002570911
    evidence_checked:
    - >-
      QuickGO Q96EP9 GO:0008508: NOT|enables, IMP, PMID:23589386 (UniProt). QuickGO Q96EP9
      GO:0015721 returns the IBA with PTN000040761, RGD:3681 and RGD:3682.
    - >-
      interpro/panther/PTHR10361/PTHR10361-review.yaml scopes GO:0008508 at PTN000040761 as
      RESIDUE_DETERMINED and names SLC10A4 as carrying the GOA NOT despite an intact sodium
      site.
    - The review row quotes PMID:26084360, PMID:18355966, PMID:17106928 and PMID:23589386 for absent bile salt transport; not re-read here.
    review_edited: false
    notes: >-
      Experimental negative evidence on the gene and its rat ortholog across four expression
      systems. The loss is placed at the whole SLC10A4 orthologue clade because the cited
      negatives include the rat protein; the fish members are untested.
- gene_file: genes/DROME/CG33116/CG33116-ai-review.yaml
  rows:
  - go_id: GO:0005794
    go_label: Golgi apparatus
    family: PTHR10414
    ibd_node: PTN000045767
    tree_reading: >-
      The IBD sits at PTN000045767 (110 leaves, 35 species) with seeds Q8WUD6 (human CHPT1),
      MGI:2384841 (mouse Chpt1) and FB:FBgn0031948 (CG7149, shown in the tree as dCCS3,
      Q8T0S3). CHPT1 and Chpt1 sit in the 67-leaf child PTN000823739 (CHPT1 and CEPT1). The
      target sits in the other child, PTN000823784 (43 leaves, SELENOI/EPT1 lineage). Inside
      it, PTN000045885 (4 leaves, Drosophila and Anopheles) splits into PTN000045886 (dCCS3
      plus an Anopheles leaf) and PTN000045889 (CG33116 plus an Anopheles leaf), so the fly
      seed is the target's paralog across a duplication older than the Drosophila and
      Anopheles split. No Golgi loss is recorded on the lineage; PTN000823784 carries a NOT
      IRD for GO:0004142 only.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000045889
    evidence_checked:
    - >-
      QuickGO Q9VIU4 GO:0005783 with descendants: located_in GO:0005783, IDA, PMID:23449981
      (FlyBase), plus the ER membrane IBA.
    - >-
      QuickGO Q8T0S3 GO:0005794 with descendants returns only the IBA under the UniProtKB id;
      the FlyBase experimental row for FBgn0031948 is not served under that accession, so the
      seed row itself was not seen. UniProt Q8T0S3 cross-references FlyBase FBgn0031948
      (CG7149).
    - >-
      The review row quotes PMID:23449981: dCCS1 (CG33116) exclusively ER, dCCS3 partially
      Golgi, in the same experiment.
    - interpro/panther/PTHR10414/PTHR10414-review.yaml has no assessment of the Golgi term.
    review_edited: false
    notes: >-
      The review says the duplication is specific to the fly lineage, quoting the paper; the
      tree places it before the Drosophila and Anopheles split. That does not change the
      verdict. The SELENOI branch as a whole is ER, so a curator may prefer to move the Golgi
      IBD to PTN000823739 and annotate dCCS3 on its own evidence.
- gene_file: genes/human/CASP12/CASP12-ai-review.yaml
  rows:
  - go_id: GO:0004197
    go_label: cysteine-type endopeptidase activity
    family: PTHR10454
    ibd_node: PTN000047947
    tree_reading: >-
      The IBD sits at PTN000047947 (342 leaves, 32 species) with 28 seeds across both children
      (PTN000048300, 213 leaves, and PTN000047948, 129 leaves, which holds the target). The
      target leaf PTN002470817 sits in the inflammatory caspase clade PTN002573059 (28
      leaves). PAINT records a NOT IRD for the term at PTN000047958 in the other child, so the
      curators do prune pseudo-caspases in this family, but nothing is recorded on the CASP12
      lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IKR
      target_node_id: PTN002470817
    evidence_checked:
    - >-
      QuickGO Q6UXS9 GO:0004197: NOT|enables, IKR, PMID:12054529 (ParkinsonsUK-UCL), beside
      the IBA from PTN000047947.
    - interpro/panther/PTHR10454/PTHR10454-review.yaml does not mention CASP12 or this node.
    review_edited: false
    notes: >-
      The loss is placed at the human leaf because the curated key-residue negation is for
      the human protein; whether other primates in PTN000048066 share it was not checked.
- gene_file: genes/worm/ced-3/ced-3-ai-review.yaml
  rows:
  - go_id: GO:0008047
    go_label: enzyme activator activity
    family: PTHR10454
    ibd_node: PTN002235080
    tree_reading: >-
      The IBD sits at PTN002235080 (13 leaves, 8 species) with two seeds, WB:WBGene00000417
      and FB:FBgn0020381. Its children are PTN008945568 (3 leaves: ced-3 of C. elegans, C.
      briggsae and Pristionchus) and PTN008499725 (10 arthropod leaves including Drosophila
      Dredd, Q8IRY7). WBGene00000417 is ced-3 itself, so the target is a seed of the node
      (treeview prints "is itself a seed: False" only because the seed is given as a WormBase
      id). No loss is recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - >-
      QuickGO P42573 GO:0008047 with descendants: GO:0140608 IDA PMID:19575016 and IMP
      PMID:18776901, GO:0008656 IMP PMID:24065769 (all UniProt), plus the IBA.
    - QuickGO Q8IRY7 GO:0008047 with descendants, GO:0008656 IMP PMID:9740659 (UniProt), plus the IBA.
    - >-
      The gene review marks all three experimental activator rows on ced-3 MODIFY to
      GO:0016540 protein autoprocessing.
    - interpro/panther/PTHR10454/PTHR10454-review.yaml does not assess this node or term.
    review_edited: true
    notes: >-
      The earlier REMOVE argued term scoping (cleavage is not a separate activator function),
      which is not a tree ground, and it contradicted the treatment of the experimental rows
      this IBA rests on. The IBA now takes the same action and replacement as those rows. No
      PAINT change follows from the tree; if the UniProt activator rows on ced-3 and Dredd
      were revised upstream the IBD would lose its seeds.
- gene_file: genes/human/CXCR3/CXCR3-ai-review.yaml
  rows:
  - go_id: GO:0016493
    go_label: C-C chemokine receptor activity
    family: PTHR10489
    ibd_node: PTN001628461
    tree_reading: >-
      The IBD sits at PTN001628461 (525 of the family's 533 leaves, 20 species) with 19 seeds.
      The node's children include clades with no C-C receptor in them: PTN002573743 (59
      leaves: angiotensin and apelin receptors, CXCR1, CXCR2), PTN002573776 (25 leaves,
      CXCR4), and the target's clade PTN002573864 (37 leaves), which splits into PTN008946198
      (28 leaves: bradykinin receptors PTN008500055, GPR25 PTN008946208, and the CXCR3
      orthologue clade PTN008500087 with 18 leaves) and a 9-leaf fish clade. The CC receptor
      seeds sit in other children (for example CCR1 in PTN002573801, CCR7 in PTN002573880,
      CCR6 in PTN007442914, CCR4 and CCR8 in PTN008500077). The seed list also names P49682,
      human CXCR3 itself. No loss is recorded on the lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001628461
    evidence_checked:
    - >-
      QuickGO P49682 GO:0016493 with descendants: enables, IDA, PMID:12782716 (UniProt),
      which is why CXCR3 is a seed, plus the IBA.
    - >-
      The gene review marks that IDA row MODIFY to C-X-C chemokine receptor activity after
      reading PMID:12782716 in full: the paper tested CC chemokines and found none active.
    - QuickGO O88410 (mouse Cxcr3) GO:0016493 with descendants returns only IBA, IEA and ISO rows, no experimental row.
    - interpro/panther/PTHR10489/PTHR10489-review.yaml treats CXCR3 as a C-X-C receptor and does not assess this IBD.
    review_edited: false
    notes: >-
      Two grounds hold together. The node is far too deep for a ligand-class term, and the
      target's own seed row is a mis-typed ligand class (bad seed), which the review handles
      by MODIFY on the IDA row. REMOVE on the IBA and MODIFY on the IDA both reject the C-C
      claim, so they are consistent. C-C receptors sit in at least six separate child clades,
      so no single node can receive a moved IBD; the IBD should be removed at PTN001628461
      and re-asserted per C-C clade, and P49682 dropped as a seed.
  - go_id: GO:0019957
    go_label: C-C chemokine binding
    family: PTHR10489
    ibd_node: PTN001628461
    tree_reading: >-
      Same node as the row above: PTN001628461 (525 leaves) with 11 seeds, here not including
      P49682. The seeds are CC receptors in other child clades plus P61073 (CXCR4, in
      PTN002573776). The target sits in PTN002573864 (37 leaves: bradykinin receptors, GPR25
      and CXCR3), in the CXCR3 orthologue clade PTN008500087 (18 leaves), which holds no seed.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001628461
    evidence_checked:
    - QuickGO P49682 GO:0019957 with descendants returns only the IBA.
    - QuickGO O88410 GO:0019957 with descendants returns only the IBA.
    - >-
      The review row quotes PMID:9064356, PMID:12782716 and PMID:10201891 for the absence of
      CC chemokine activity on human CXCR3.
    review_edited: false
    notes: >-
      Target-specific negative evidence also holds (TARGET_LOSS would serve equally). Mouse
      Cxcr3 responds to CCL21 according to the review, so a loss node for the whole CXCR3
      clade PTN008500087 would be wrong for mouse; removing the over-deep IBD is the cleaner
      fix.
