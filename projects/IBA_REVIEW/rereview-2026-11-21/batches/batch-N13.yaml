genes:
- gene_file: genes/DROME/Toll-6/Toll-6-ai-review.yaml
  rows:
  - go_id: GO:0048495
    go_label: Roundabout binding
    family: PTHR45836
    ibd_node: PTN002911633
    tree_reading: >-
      IBD at PTN002911633 (96 leaves, 29 species), 5 seeds, all Slit proteins (human SLIT1 O75093, SLIT2
      O94813, SLIT3 O75094, mouse MGI:1315203, fly sli FBgn0264089). Children: PTN000689994 (88 leaves,
      vertebrate SLIT1/SLIT3 plus LGR4, LGR6, IGFALS and other LRR proteins) and PTN001224992 (8 leaves, 6
      species: nematode slt-1, fly sli P24014, two Anopheles leaves, Daphnia, and the target). The target
      leaf PTN000687633 sits under PTN000687709 (2 leaves, 2 species), then PTN002911678 (4 leaves, 2
      species, the Drosophila plus Anopheles pairs of sli and Toll-6) and PTN002911677 (5 leaves). So the
      tree places Toll-6 as the sister of fly Slit inside the invertebrate Slit clade, with the sli seed in
      the same 4-leaf node. No IRD for the term is recorded in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000687709
    evidence_checked:
    - 'QuickGO by GO id (descendants): SLIT1 O75093 GO:0048495 IPI PMID:15207848; sli P24014 IPI
      PMID:17062560 and PMID:18359766; Toll-6 Q9VUN0 IBA only. The query shape returns experimental hits,
      so the Toll-6 negative is real.'
    - interpro/panther/PTHR45836/PTHR45836-review.yaml assesses PTN002911633 GO:0048495 as NEEDS_PRUNING
      and lists SF8 (Toll-6) among the branches that need an IRD.
    - Treeview header shows Q9VUN0 also maps to PTHR24366 but is not a leaf there; the review quotes the
      UniProt DR PANTHER line PTHR24366:SF96.
    review_edited: false
    notes: Existing reason is node-aware (names PTN002911633 and its Slit seeds) and rests on divergence of
      the Toll-6 branch (Toll receptor architecture with a TIR domain, Spaetzle-family ligands), not on
      donor count or absence of data. The IRD target is the 2-leaf Toll-6 node (fly plus Anopheles), the
      narrowest node that excludes fly sli.
- gene_file: genes/mouse/Notch1/Notch1-ai-review.yaml
  rows:
  - go_id: GO:0007411
    go_label: axon guidance
    family: PTHR45836
    ibd_node: PTN002911625
    tree_reading: >-
      IBD at the family root PTN002911625 (131 leaves, 32 species), 10 seeds, all in child PTN002911632 (97
      leaves, the Slit/LRR clade: SLIT1-3 O75093, O94813, O75094, mouse MGI:1315202/1315203/1315205, fly
      sli, worm slt-1 WBGene00004854, two ZFIN genes). The other child, PTN001933897 (34 leaves, 17
      species), is the Notch receptor clade and holds the target (leaf PTN001525706, SF12) with human
      NOTCH1-3, mouse Notch1/Notch3 and invertebrate Notch leaves; its own PAINT records are Notch
      signaling pathway, signaling receptor complex, plasma membrane and cell surface, and none of the 10
      axon-guidance seeds is in it. No loss for the term is recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002911632
    evidence_checked:
    - 'QuickGO by GO id (descendants): SLIT1, SLIT2, SLIT3 GO:0007411 IDA PMID:11748139 plus more specific
      guidance terms; mouse Notch1 Q01705 and human NOTCH1 P46531 return the IBA only.'
    - interpro/panther/PTHR45836/PTHR45836-review.yaml assesses PTN002911625 GO:0007411 as TOO_DEEP and
      says the term belongs at PTN002911632 and should not descend into PTN001933897.
    review_edited: false
    notes: The reason text does not name the node, but the row's propagation_review names PTN002911625 and
      the SLIT seed set, and the stated ground (seeds in the Slit clade, target in the Notch clade across
      the root duplication) matches the tree. Left unedited.
- gene_file: genes/ECOLI/recA/recA-ai-review.yaml
  rows:
  - go_id: GO:0004520
    go_label: DNA endonuclease activity
    family: PTHR45900
    ibd_node: PTN000534381
    tree_reading: >-
      IBD at the family root PTN000534381 (196 leaves, 77 species), one seed, M. tuberculosis RecA P9WHJ3.
      Children: PTN000534697 (160 leaves, eukaryotic organellar RecA homologs) and PTN000534715 (36 leaves,
      35 species, bacterial RecA), which holds both the seed and the target (leaf PTN000534731). No loss
      for the term is recorded. The seed and target are in the same bacterial clade, so the question is the
      seed, not the placement.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000534381
    evidence_checked:
    - 'QuickGO by GO id: P9WHJ3 GO:0004520 IDA PMID:11850426; E. coli P0A7G6 IBA only.'
    - interpro/panther/PTHR45900/PTHR45900-review.yaml (quoted in the row) attributes the P9WHJ3
      endonuclease activity to the PI-MtuI intein excised from the RecA precursor and says no RecA
      recombinase is an endonuclease.
    review_edited: false
    notes: Existing reason is node-aware and rests on the seed's activity belonging to the intein, which is
      not inherited with the recombinase. The source_defects entry on the row already requests deletion of
      the IBD.
- gene_file: genes/ANOGA/DNAAF1/DNAAF1-ai-review.yaml
  rows:
  - go_id: GO:0007368
    go_label: determination of left/right symmetry
    family: PTHR45973
    ibd_node: PTN002915666
    tree_reading: >-
      IBD at PTN002915666 (32 leaves, 25 species), 2 seeds (human DNAAF1 Q8NEP3, zebrafish
      ZDB-GENE-031114-4). Children: PTN002915667 (27 leaves, 21 species, deuterostomes only: vertebrates,
      Ciona, amphioxus, sea urchin), which holds both seeds, and PTN002915697 (5 leaves, 4 species:
      Drosophila dtr, the Anopheles target, Tribolium, two Phytophthora leaves), which holds the target
      (leaf PTN001317607). The same node also carries axoneme, axoneme assembly and dynein complex binding.
      No loss for the term is recorded.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002915667
    evidence_checked:
    - 'QuickGO by GO id (descendants): zebrafish dnaaf1 Q7ZV84 GO:0007368 IMP (PMID:18385425, PMID:18784369,
      PMID:9334285) and heart looping IMP; human DNAAF1 heart looping and related left/right terms IMP
      (PMID:19944400, PMID:19944405); fly dtr Q8INT5 IBA only.'
    review_edited: false
    notes: Existing reason names the node and both seeds and rests on lineage (cilia-driven left/right
      patterning at a vertebrate organizer; insect motile axonemes limited to sperm and chordotonal
      neurons). The target's clade also contains Phytophthora, an oomycete, which makes the lineage point
      stronger. No family review exists for PTHR45973.
