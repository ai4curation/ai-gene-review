- gene_file: genes/DROME/drk/drk-ai-review.yaml
  rows:
  - go_id: GO:0008180
    go_label: COP9 signalosome
    family: PTHR46037
    ibd_node: PTN005273574
    tree_reading: >-
      IBD at the family root PTN005273574 (100 leaves, 29 species), 2 seeds: mouse Grb2 (MGI:95805) and
      human GRB2 (P62993). Children: PTN002400928 (99 leaves, 28 species: GRB2, GRAP, GRAP2, SLA and the
      invertebrate adaptors), which holds both seeds and the target (leaf PTN002401037, under PTN002401025,
      7 leaves, 6 species), and a single Entamoeba leaf PTN001650387. PAINT already records one loss for
      the term inside the 99-leaf clade, NOT IRD GO:0008180 at PTN002917303. Human GRB2 reaches the root
      through 13 intermediate nodes, none of which carries the term, so the curator placed a term seeded
      only by mammalian GRB2 at the root of the whole adaptor family.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN005273574
    evidence_checked:
    - 'QuickGO by GO id: GRB2 P62993 and Grb2 Q60631 GO:0008180 IDA PMID:22561606 (the only experimental
      rows); drk Q08012 and sem-5 P29355 IBA only.'
    - 'publications/PMID_22561606.md (abstract only, no PMC copy per the PubMed id converter): a Tespa1
      thymocyte study; the abstract says Tespa1 associates with PLC-gamma1 and Grb2 and is a component of
      the TCR signalosome. COP9 is not mentioned.'
    - 'QuickGO by reference PMID:22561606 (17 rows): GO:0008180 part_of IDA, assigned by UniProt, on
      TESPA1, Tespa1-associated Lat, PLCG1, GRB2, Grb2 and Themis. The whole TCR signalosome set carries
      the term.'
    - 'QuickGO term record GO:0008180: defined as the complex that catalyzes deneddylation of proteins;
      "signalosome" is a broad synonym.'
    review_edited: true
    notes: Action unchanged, reason rewritten. The earlier reason (GRB2 adaptors are not COPS subunits) was
      true but did not look at the node or its seeds. The rewritten reason states that both seeds come from
      one TCR signalosome paper annotated to the COP9 term, and says that this rests on the abstract and
      the annotation pattern, not the full text. The human and mouse GRB2 reviews hold the same IBA and the
      IDA seed rows at MARK_AS_OVER_ANNOTATED because the full text was unavailable; they are seeds and
      carry the experimental row, so they were judged with it. For the fly and worm adaptors there is no
      experimental row, and a T cell receptor complex cannot be ancestral to them on either reading of the
      seed, so REMOVE stands. A coordinator may want the GRB2/Grb2 rows revisited in the light of the
      by-reference query, and a source defect (WRONG_TERM, UniProt) raised on the seed rows. History
      record history/genes/DROME/drk/2026-11-21T220453Z-claude-code-5bb41d.yaml.
