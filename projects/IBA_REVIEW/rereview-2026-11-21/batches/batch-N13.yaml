- gene_file: genes/ECOLI/ptsP/ptsP-ai-review.yaml
  rows:
  - go_id: GO:0015764
    go_label: N-acetylglucosamine transport
    family: PTHR46244
    ibd_node: PTN000532509
    tree_reading: >-
      IBD at the family root PTN000532509 (43 leaves, 25 species), one seed, P. aeruginosa PA3760 (Q9HXN5).
      The root has five children; the target and the seed are both in PTN008196399 (28 leaves, 13 species)
      and both under PTN009195473 (21 leaves), where they part: the target leaf PTN000532526 is in the
      PtsP / EI(Ntr) clade PTN000532524 (7 leaves, 7 species: ptsP of E. coli, Salmonella, Yersinia,
      Pseudomonas, Shewanella, Vibrio, Coxiella), and the seed leaf PTN002341768 is in PTN001879016 (14
      leaves: sugar-PTS enzyme I and multiphosphoryl proteins, ptsI, ptsA, fryA, fruB), where it pairs with
      P. aeruginosa fruI at PTN002341767 (2 leaves). The same root also carries GO:0008965
      phosphoenolpyruvate-protein phosphotransferase activity. No loss for the term is recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002341767
    evidence_checked:
    - 'QuickGO by GO id: PA3760 Q9HXN5 GO:0015764 IMP PMID:18833300; E. coli ptsP P37177 IBA only.'
    - interpro/panther/PTHR46244/PTHR46244-review.yaml assesses PTN000532509 GO:0015764 as TOO_DEEP and
      says the term belongs at most on the clade of N-acetylglucosamine PTS multiphosphoryl proteins that
      contains the seed.
    - Lineages of Q9HXN5, P37177 and P08839 read from the cached PTHR46244 tree with the same library
      calls treeview.py uses (helper bN13/lin.py), because the seed has no gene folder for treeview.
    review_edited: false
    notes: Existing reason is node-aware (names the root node and the single PA3760 seed) and rests on the
      EI(Ntr) branch running a separate phosphorelay to NPr with no sugar transport, supported by a quote
      from PMID:10473571. It mentions that there is only one seed, but as a fact about where the term
      should sit, not as the ground. The move target is the narrowest node holding the seed (PA3760 plus
      its P. aeruginosa paralog fruI); a PAINT curator could argue for the 14-leaf sugar-PTS enzyme I
      clade PTN001879016 instead, since general enzyme I takes part in every PTS sugar uptake, but either
      choice excludes the PtsP clade.
- gene_file: genes/ARATH/VIN3/VIN3-ai-review.yaml
  rows:
  - go_id: GO:0140006
    go_label: histone H3 reader activity
    family: PTHR46286
    ibd_node: PTN008198652
    tree_reading: >-
      IBD at the family root PTN008198652 (166 leaves, 36 species), one seed, AT4G30200 (VIL2/VEL1,
      Q9SUM4). Children: PTN005294067 (163 leaves, angiosperm VEL proteins), holding the seed and the
      target, and PTN008198760 (3 Selaginella leaves). The target leaf PTN000497512 is in PTN005294201 (6
      leaves, 3 species: Arabidopsis VIN3 and Brassica orthologs); the seed leaf PTN000497513 is in the
      sister clade PTN005294205 (7 leaves, VIL2 and Brassica orthologs); the two join at PTN005294200 (17
      leaves, 3 species, Brassicaceae). VIL1/VRN5 (Q9LHF5) branches off at PTN005294067. The root also
      carries vernalization response, chromatin silencing complex and constitutive heterochromatin
      formation. No loss for the term is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN005294201
    evidence_checked:
    - 'QuickGO by GO id (descendants): VIL2 Q9SUM4 GO:0062072 IDA PMID:20837520 (a child of the reader
      term); VIN3 Q9FIE3 and VIL1 Q9LHF5 IBA only.'
    - 'publications/PMID_36174674.md (full text): ITC of At VIN3 residues 116-307 and 150-208 and of date
      palm VIN3 with H3K4me2 shows no binding while the OBE1 control binds at 1.9 uM; NMR with three H3
      peptides shows no perturbation; the section is headed "The VEL PHD superdomain is not a histone H3
      reader" and the authors could not reproduce binding with the construct used in the earlier
      pull-down work.'
    review_edited: false
    notes: REMOVE rests on direct negative experimental data for the target protein itself, which is the
      strongest form of target-specific ground. The last sentence of the written reason says VIN3 is
      "outside the clade that inherited H3-reader activity"; in the tree VIN3 is inside the IBD clade (the
      IBD is at the family root), so that sentence states the desired outcome, not the topology. Not
      edited, since the ground itself is sound. The IRD target is the VIN3 ortholog clade. The paper argues
      the result holds for the PHD superdomain of all VEL proteins, which would make the seed row disputed
      and the fix REMOVE_IBD at PTN008198652; only VIN3 (Arabidopsis and date palm) was assayed, so the
      narrower fix is recorded here and the wider one left to the PAINT curator. No family review exists.
