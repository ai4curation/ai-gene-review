    go_label: protein insertion into mitochondrial inner membrane
    family: PTHR46208
    ibd_node: PTN002340064
    tree_reading: >-
      IBD at PTN002340064 (52 leaves), one seed, yeast TOM70 (S000005065). Target in the 2-leaf Acl4 pair
