- gene_file: genes/yeast/ACL4/ACL4-ai-review.yaml
  rows:
  - go_id: GO:0005741
    go_label: mitochondrial outer membrane
    family: PTHR46208
    ibd_node: PTN002340064
    tree_reading: >-
      IBD at PTN002340064 (52 leaves, 48 species), 6 seeds (yeast TOM70 S000005065 and TOM71 S000001159,
      fly Tom70, worm tomm-70, human TOMM70 O94826, rat Tomm70). Children: PTN002505353 (33 leaves, 33
      species, animal TOMM70 one per species) and PTN001876631 (19 leaves, 15 species, fungal), which holds
      the target with yeast TOM70 and TOM71. The target leaf PTN007580962 pairs with Eremothecium AGL170W
      at PTN008705427 (2 leaves, 2 species), which joins TOM70, TOM71 and Eremothecium ABR131W at
      PTN008705426 (5 leaves, 2 species). So the tree places Acl4 as a Saccharomycetaceae duplicate of
      Tom70/Tom71. No loss for the term is recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008705427
    evidence_checked:
    - 'QuickGO by GO id (descendants): TOM70 P07213 GO:0005741 IDA PMID:16689936, PMID:9774667, HDA
      PMID:16407407; TOM71 P38825 IDA PMID:16689936, PMID:8663394; ACL4 Q03771 IBA only.'
    - 'QuickGO ACL4 Q03771: cytoplasm IDA PMID:26447800, EXP PMID:25936803, HDA PMID:14562095; nucleus IDA
      PMID:25936803 and PMID:26447800.'
    review_edited: false
    notes: Existing reason names the node and the TOM70-type seeds and rests on divergence of the Acl4
      branch (no N-terminal outer membrane anchor, experimentally cytoplasmic and nuclear, dedicated Rpl4
      chaperone). One IRD on the 2-leaf Acl4 node covers all four terms.
  - go_id: GO:0008320
    go_label: protein transmembrane transporter activity
    family: PTHR46208
    ibd_node: PTN002340064
    tree_reading: >-
      IBD at PTN002340064 (52 leaves), one seed, yeast TOM70 (S000005065), which sits in the target's
      5-leaf node PTN008705426 but on the other side of the duplication from the Acl4 pair PTN008705427 (2
      leaves, 2 species). Topology as for GO:0005741 above. No loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008705427
    evidence_checked:
    - 'QuickGO by GO id (descendants): TOM70 P07213 GO:0008320 IMP PMID:2177474 (contributes_to); TOM71 ISS
      only; ACL4 IBA only.'
    review_edited: false
    notes: The reason says no target evidence ties Acl4 to a translocase, which alone is not a ground, but
      it also states the positive divergence (soluble Rpl4 escort to the nucleus, not membrane transport)
      and the propagation_review names the node. Left unedited.
  - go_id: GO:0030150
    go_label: protein import into mitochondrial matrix
    family: PTHR46208
    ibd_node: PTN002340064
    tree_reading: >-
      IBD at PTN002340064 (52 leaves), 2 seeds (rat Tomm70 RGD:1303049 in the animal child PTN002505353 and
      yeast TOM70 S000005065 in the fungal child PTN001876631), so the node is seeded on both sides.
