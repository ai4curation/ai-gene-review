- gene_file: genes/human/PIK3CA/PIK3CA-ai-review.yaml
  rows:
  - go_id: GO:0005944
    go_label: phosphatidylinositol 3-kinase complex, class IB
    family: PTHR10048
    ibd_node: PTN000799659
    tree_reading: 'IBD at PTN000799659 (53 leaves, 23 species), one seed, human PIK3CG (P48736). Below it PTN007418409
      (51 leaves) is a duplication with two children: PTN008493059 (26 leaves, PIK3CG, holding the seed) and PTN008936925
      (25 leaves, PIK3CA, holding the target). PIK3CB and PIK3CD are outside the node, in PTN008300849 (46 leaves).'
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008493059
    evidence_checked:
    - Tree lineages of human PIK3CA, PIK3CB, PIK3CD and PIK3CG read from the cached PTHR10048 tree.
    - 'interpro/panther/PTHR10048/PTHR10048-review.yaml: node assessed TOO_DEEP for this term, agreeing with the
      verdict.'
    review_edited: true
    notes: Action unchanged. Reason and source comment rewritten because the comment said the node groups PIK3CA/B/D
      with PIK3CG; PIK3CB and PIK3CD are not under PTN000799659. The family review lists SF33 (beta) and SF35 (delta)
      as affected subfamilies for this node, which the tree does not support; only SF107 (alpha) inherits the term.
      History record added.
- gene_file: genes/rat/Emb/Emb-ai-review.yaml
  rows:
  - go_id: GO:0070593
    go_label: dendrite self-avoidance
    family: PTHR10075
    ibd_node: PTN001296633
    tree_reading: 'IBD at PTN001296633 (338 leaves, 32 species), four seeds. Fly Dscam1, mouse Dscam and mouse Dscaml1
      are in child PTN008493410 (39 leaves, Dscam). Fly turtle (tutl) is in PTN002560448 (80 leaves) inside child
      PTN001313559 (257 leaves). Embigin is also in PTN001313559 but in a different subclade: PTN002560472 (14 vertebrate
      leaves) inside PTN008937352 (144 leaves, with basigin, neuroplastin, contactins, ROBO3, CHL1 and myotilin).
      The third child of the node, PTN008937336 (42 leaves), holds nexilin.'
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN008493410
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA):
      tutl Q967D7 IMP PMID:19783736; mouse Dscam Q9ERC8 and Dscaml1 Q4VA61 IMP PMID:19945391; fly Dscam1 IDA PMID:17482551
      and IMP.'
    - Tree lineages of Dscam, Dscaml1, Dscam1, tutl and the members of PTN008937352.
    review_edited: true
    notes: Action unchanged. The node covers intracellular sarcomeric proteins (myotilin, nexilin), which shows
      the IBD is too deep; embigin is a two-Ig basigin-family protein. Summary and comment named Sidekick-type and
      Dscam2 seeds that are not seeds; rewritten. The turtle seed needs its own node if the IBD is moved to the
      Dscam clade. FBgn0010473 was matched to tutl through the QuickGO with/from list on the tutl IBA row, not through
      a FlyBase lookup. History record added.
- gene_file: genes/human/P3R3URF/P3R3URF-ai-review.yaml
  rows:
  - go_id: GO:0019221
    go_label: cytokine-mediated signaling pathway
    family: PTHR10155
    ibd_node: PTN008494619
    tree_reading: IBD at PTN008494619 (64 leaves, 29 species), one seed MGI:2385459. The P3R3URF leaves form a 7-leaf
      mammalian clade PTN007422731 that the tree places as sister to the SOCS5 clade PTN000044039 (12 leaves) under
      PTN008494623 (19 leaves), inside the SOCS4/SOCS5 child PTN004128473 (62 leaves). The experimentally annotated
      mouse gene under the node is Socs5 (O54928).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN007422731
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA):
      Socs5 O54928 GO:0019221 IDA PMID:12242343; Socs4 Q91ZA6 IBA only.'
    - 'Gene review: P3R3URF is a 95-aa upstream-ORF product with no SH2 domain and no SOCS box.'
    review_edited: false
    notes: 'The P3R3URF clade is a tree-building artifact inside the SOCS5 branch: a uORF microprotein of the PIK3R3
      locus that lacks the domains the term depends on. Reason already states this. An IRD at PTN007422731 covers
      all seven P3R3URF leaves; the better fix is removing the clade from the family. interpro/panther/PTHR10155
      has only a review .md, no node assessment for this node.'
