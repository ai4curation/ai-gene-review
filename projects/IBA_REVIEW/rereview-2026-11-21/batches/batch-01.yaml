- gene_file: genes/human/CCND1/CCND1-ai-review.yaml
  rows:
  - go_id: GO:0005815
    go_label: microtubule organizing center
    family: PTHR10177
    ibd_node: PTN007424001
    tree_reading: IBD at PTN007424001 (439 leaves, 50 species), seven seeds on both sides of the node. Child PTN008939442
      (143 leaves) holds human CCNB1, CCNB2 and the fission and budding yeast mitotic cyclins. Child PTN000808716
      (296 leaves) holds human CCNF (in PTN008495099, 26 leaves) and the cyclin A/E/D clade PTN008302335 (266 leaves),
      where rat cyclin E1 (RGD:2294) sits in PTN000808611 (62 leaves) and cyclin D1 in PTN000808639 (82 leaves).
      The D-type clade has no seed and no experimental MTOC annotation.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
      target_node_id: PTN007424001
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA)
      (GO:0005815 and descendants): CCNB1 GO:0005813 IDA PMID:12524548; CCNB2 IDA PMID:21399614; cdc13 spindle pole
      body rows; CLB2 GO:0005816 IDA; rat Ccne1 P39949 GO:0005813 IDA PMID:15514162; nothing in PTN000808639.'
    - 'RGD REST lookup: RGD:2294 = Ccne1.'
    - 'interpro/panther/PTHR10177/PTHR10177-review.yaml: no assessment of this node or term.'
    review_edited: true
    notes: 'Earlier reason said the target is outside the clade where the behaviour arose and that MTOC association
      is attested only in mitotic cyclins. The tree contradicts both: cyclin F and cyclin E1 seeds are in the target''s
      own child clade. What remains is absence of evidence for D-type cyclins, so the row is kept as an over-annotation.
      No single PAINT move fixes it; a curator could add an IRD at PTN000808639 only with evidence of loss, which
      I did not find. History record added.'
- gene_file: genes/worm/sel-12/sel-12-ai-review.yaml
  rows:
  - go_id: GO:0034205
    go_label: amyloid-beta formation
    family: PTHR10202
    ibd_node: PTN000024430
    tree_reading: 'IBD at PTN000024430 (75 leaves, 37 species), six seeds: fly Psn, mouse Psen1, human PSEN1 and
      PSEN2, zebrafish psen1 and psen2. The node has two children, PTN000810910 (70 leaves, animal presenilins,
      holding all seeds and the target) and PTN000024495 (5 leaves, Dictyostelium and Entamoeba). sel-12 is in PTN004133473
      (9 leaves, 3 nematode species, with hop-1 and spe-4), inside the protostome clade PTN000024485 (16 leaves)
      that also holds the fly seed.'
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004133473
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA):
      fly Psn O02194 IMP PMID:12110170 and IDA PMID:20421416; sel-12 and hop-1 IBA only.'
    - Gene review quote from PMID:8265668 that APL-1 does not contain the beta-amyloid peptide.
    - 'interpro/panther/PTHR10202/PTHR10202-review.yaml: node assessed UNRESOLVED, as a policy question about an
      enzyme with the capacity but no endogenous substrate.'
    review_edited: false
    notes: 'Upheld on the lineage ground the review already states: the worm has no APP with an amyloid-beta region,
      so the process does not occur there. The family review leaves the node unresolved because the same argument
      applies to the fly seed (fly APPL also lacks the region) and to Dictyostelium; that is a term-scope question
      for GO and PAINT, and if it is settled in favour of capacity the worm row would become KEEP_AS_NON_CORE. The
      PANTHER API was unavailable when I re-checked the membership of PTN004133473; its size and species count are
      from the treeview lineage, and its nematode-only membership is inferred from the member list of its parent
      PTN000024485.'
