genes:
- gene_file: genes/rat/Syt4/Syt4-ai-review.yaml
  rows:
  - go_id: GO:0061891
    go_label: calcium ion sensor activity
    family: PTHR10024
    ibd_node: PTN000001283
    tree_reading: IBD at PTN000001283 (469 leaves, 34 species). Its four seeds (rat Syt1 RGD:3803, mouse Syt1 MGI:99667,
      worm snt-1 and snt-3) all sit in PTN000740739 (152 leaves), which carries a second IBD for the same term and
      lies inside child clade PTN000797569 (186 leaves). Rat Syt4 (leaf PTN000001435) is in a different child, PTN001597973
      (112 leaves), inside PTN000001972 (65 leaves; Syt4 and Syt11). Vertebrate Syt4 (PTN002558687, 21 leaves) and
      Syt11 (PTN002558694, 22 leaves) join at PTN001294197 (43 leaves, 20 species); fly Syt4 sits apart in the protostome
      clade PTN002558702 (11 leaves). No PAINT loss for the term is recorded in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001294197
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA):
      P21707 rat Syt1 EXP PMID:24001110; P46096 mouse Syt1 IDA PMID:21521611; worm snt-1 IMP PMID:29760174, snt-3
      IMP PMID:33570571; rat and mouse Syt4 carry IBA only.'
    - 'Gene review row: cites PMID:15311271 and PMID:20688915 quotes that rat Syt4 is not a Ca2+ sensor while fly
      Syt4 is; quotes left untouched.'
    - 'RGD REST lookup: RGD:3803 = Syt1.'
    review_edited: false
    notes: Reason already rests on target-specific loss (Asp to Ser in C2A, inhibition of fusion) and is node-aware.
      The IRD node is the vertebrate Syt4/Syt11 duplication node; the loss was read for Syt4 from the review's evidence,
      and I did not check Syt11 residues myself, so a curator may prefer the Syt4-only node PTN002558687. Fly Syt4
      keeps the activity, so the loss must not go above PTN001294197.
  - go_id: GO:0099502
    go_label: calcium-dependent activation of synaptic vesicle fusion
    family: PTHR10024
    ibd_node: PTN004120656
    tree_reading: 'IBD at PTN004120656 (106 leaves) with one seed, MGI:1859545. The node has two children: PTN000001972
      (65 leaves, Syt4 and Syt11, holding the target) and PTN001293931 (41 leaves, Syt7). The only mouse gene under
      the node with an experimental annotation for the term is Syt7 (Q9R0N7), in PTN001293931, so the seed is in
      the sibling clade and the target clade has none.'
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001293931
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA):
      GO:0099502 exact, mouse: Syt7 Q9R0N7 IMP and IDA PMID:24267651 (SynGO); Syt4 P40749 and Syt11 Q9R0N3 IBA only.'
    - 'Gene review row: PMID:20688915 and PMID:12135783 quotes (rat Syt4 inhibitory; no Syt IV signal at synaptic
      vesicles).'
    review_edited: false
    notes: Both a misplaced IBD and a target-specific loss. MGI:1859545 was matched to Syt7 by elimination (the
      only experimentally annotated mouse leaf under the node), not by an MGI lookup. The existing reason is sound
      and names the node.
- gene_file: genes/DROME/Diap1/Diap1-ai-review.yaml
  rows:
  - go_id: GO:0051726
    go_label: regulation of cell cycle
    family: PTHR10044
    ibd_node: PTN000005168
    tree_reading: IBD at PTN000005168 (138 leaves, 35 species), three seeds. Fission yeast bir1 (SPCC962.02c) is
      in the 5-leaf fungal child PTN004121721. Human BIRC2 (Q13490) and mouse Birc5 (MGI:1203517) are both in the
      vertebrate clade PTN002559437 (93 leaves) inside the other child PTN000953271 (133 leaves). Diap1 is in the
      arthropod clade PTN000799454 (16 leaves, 5 species), sister to PTN000005233 (113 leaves) under PTN000005232;
      it holds no seed and no experimental cell-cycle annotation. Fly Deterin and Bruce are not in this family tree;
      the only fly leaves are Diap1 and Diap2.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN004121721
    evidence_checked:
    - 'QuickGO annotation search by goId (query shape confirmed to return hits: e.g. mouse Syt1 GO:0061891 IDA)
      (GO:0051726 and descendants over all 138 leaves): bir1 GO:1902412 IMP PMID:19570910; Birc5 GO:0007346 IMP
      PMID:19644667; BIRC2 GO:0051726 IDA PMID:15665297. Nothing in PTN000799454.'
    - PubMed esummary titles for the three seed papers; MGI marker page confirms MGI:1203517 = Birc5.
    review_edited: true
    notes: Earlier reason rested on the role not being established for the fly protein, which is absence of data.
      Seeds lie in both children of the node, so the placement follows PAINT practice, but two of three seeds are
      survivin-class chromosomal-passenger proteins and the third is a single vertebrate cIAP1 observation, so propagation
      to RING-bearing arthropod IAPs is doubtful. The PAINT fix needs two target nodes (PTN004121721 for the fungal
      Bir1 clade and PTN002559437 for the vertebrate seeds); only the first fits the single target_node_id slot.
      History record added.
