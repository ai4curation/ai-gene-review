      Q7SZF3). PTN002562847 (81 leaves) below it has four paralog children: PTN002562850 (16, DUSP2), PTN002562861
      (21, DUSP5, holding the target), PTN002562877 (21, DUSP4, holding the seed) and PTN002562870 (23, DUSP1).'
