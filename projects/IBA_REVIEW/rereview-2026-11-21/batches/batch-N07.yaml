      IBD at PTN000764469 (7 leaves, 6 species) with one seed, E. coli P37306 (AllK; the tree labels the
      leaf arcC), in PTN002019024 (3 leaves: P37306 and the two Salmonella carbamate kinases Q8ZK34 and
