genes:
- gene_file: genes/PSEAE/phuR/phuR-ai-review.yaml
  rows:
  - go_id: GO:0015344
    go_label: siderophore uptake transmembrane transporter activity
    family: PTHR30069
    ibd_node: PTN004738955
    tree_reading: >-
      IBD at the family root PTN004738955 (149 leaves, 21 species) with four seeds, all P. aeruginosa:
      Q9HVC0 PA4675 (SF42, in PTN004738963, 7 leaves), Q9HWM5 PA4156, Q05098 pfeA and Q9I527 pirA (all
      three in PTN002012590, 29 leaves, under PTN001247782, 32 leaves). The smallest clade holding all
      four is PTN002824128 (145 leaves), which also holds the target. phuR Q9HV88 (leaf PTN002427879,
      SF29) sits in PTN004738988 (11 leaves, all SF29: hmbR of Neisseria, two Xanthomonas, four
      Haemophilus, two Vibrio and one Shewanella receptor, plus the target), which joins the three-seed clade only at
      PTN008624012 (68 leaves). PAINT already carries a NOT IRD for this term at PTN004739012 (7 leaves,
      the BtuB cobalamin receptors, SF53), so substrate-specific pruning of this root IBD is established
      practice in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004738988
    evidence_checked:
    - 'QuickGO by goId with descendants: Q9HVC0 IMP PMID:16549659, Q9HWM5 IMP PMID:21546589, Q05098
      IMP PMID:8419284, Q9I527 IMP PMID:15899402 (all PseudoCAP) for GO:0015344. The seeds are sound.'
    - Gene review carries GO:0015232 heme transmembrane transporter activity and GO:0015886 heme
      transport IMP PMID:10658665 on phuR (ACCEPT), with the quote on loss of growth on haem and
      haemoglobin in the phuR deletion.
    - No family review file for PTHR30069 (only entries and metadata).
    review_edited: false
    notes: >-
      Existing reason is node-aware (root node, seeds in other subfamilies, 145-leaf clade
      PTN002824128) and rests on the substrate of the haem receptor subfamily. It asks for one
      node-level request shared with hasR; hasR is not in this batch and its position in the tree was
      not read here, so the IRD named here covers the SF29 PhuR/HmbR clade only. The
      existing PAINT IRD on the BtuB clade is the model for the fix.
  - go_id: GO:0044718
    go_label: siderophore transmembrane transport
    family: PTHR30069
    ibd_node: PTN004738955
    tree_reading: >-
      IBD at the root PTN004738955 (149 leaves) with one seed, E. coli cirA P17315 (SF53, lineage
      PTN000763914, 9 leaves < PTN002012590, 29 leaves < PTN001247782, 32 leaves). The target phuR is in
      PTN004738988 (11 leaves, SF29 haem receptors); seed and target meet at PTN008624012 (68 leaves).
      PAINT carries a NOT IRD for this term at PTN004739012 (7 leaves, BtuB clade).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN004738988
    evidence_checked:
    - 'QuickGO by goId: P17315 cirA GO:0044718 IMP PMID:2139424 (EcoCyc, acts_upstream_of_or_within) is
      the only seed annotation.'
    - Same phuR haem-uptake evidence as the GO:0015344 row.
    review_edited: false
    notes: Process counterpart of the GO:0015344 row; same clade and same fix. Reason left unchanged.
- gene_file: genes/PSEAE/ccmC/ccmC-ai-review.yaml
  rows:
  - go_id: GO:0004096
    go_label: catalase activity
    family: PTHR30071
    ibd_node: PTN001247822
    tree_reading: >-
      IBD at the family root PTN001247822 (143 leaves, 59 species) with one seed, the target itself
      (Q9I3N5, leaf PTN002409360, SF1). The root has two children: PTN008624028 (57 leaves, plastid and
      cyanobacterial CcsA) and PTN009109956 (86 leaves, holding the target under PTN008624020, 66 leaves).
      No other seed and no PAINT loss for the term anywhere in the family.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001247822
    evidence_checked:
    - 'QuickGO by goId: Q9I3N5 GO:0004096 IMP PMID:16824107 (PseudoCAP) is the only experimental
      annotation behind the node.'
    - The gene review judges the IMP seed row REMOVE as well, quoting PMID:18174132 (catalase production
      undetectable in the ccmC mutant) and PMID:14663086 (reduced resistance mediated by haem-containing
      catalases). The seed records loss of another enzyme's activity in a haem-delivery mutant.
    - Family review PTHR30071-review.yaml assesses this node record UNRESOLVED because the seed paper
      could not be inspected; it also states that catalase activity is not part of CcmC biochemistry.
    review_edited: false
    notes: >-
      Target is its own seed, so the IBA and the IMP row were judged together; both stay REMOVE. The
      reason rests on the seed being a mutant phenotype of haem supply, not on the donor count that the
      summary mentions in passing. Left unchanged.
- gene_file: genes/SHEON/ccmC/ccmC-ai-review.yaml
  rows:
  - go_id: GO:0004096
    go_label: catalase activity
    family: PTHR30071
    ibd_node: PTN001247822
    tree_reading: >-
      Same record as PSEAE ccmC: IBD at the root PTN001247822 (143 leaves), single seed P. aeruginosa
      ccmC Q9I3N5. The target Q8EK42 is in the same root child PTN009109956 (86 leaves) as the seed. No
      other seed, no PAINT loss for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001247822
    evidence_checked:
    - 'QuickGO by goId: Q9I3N5 GO:0004096 IMP PMID:16824107 (PseudoCAP), the only seed annotation.'
    - PSEAE ccmC review (this batch) for the phenotype quotes behind the seed.
    review_edited: false
    notes: >-
      Existing reason traces the seed and argues it is a phenotype-derived molecular function; that is
      a bad-seed ground. Its remark that a molecular function can never be established from a mutant
      phenotype is broader than needed, but the verdict does not depend on it. Left unchanged.
- gene_file: genes/ECOLI/fruB/fruB-ai-review.yaml
  rows:
  - go_id: GO:0090563
    go_label: protein-phosphocysteine-sugar phosphotransferase activity
    family: PTHR30181
    ibd_node: PTN001249496
    tree_reading: >-
      IBD at the family root PTN001249496 (13 leaves, 8 species) with one seed, E. coli mtlA P00550
      (SF2), whose lineage is PTN002014760 (4 leaves, the MtlA permeases of E. coli, Salmonella, Yersinia
      and Vibrio) < PTN000766163 (10 leaves). The target fruB P69811 (SF3) is in the sister clade
