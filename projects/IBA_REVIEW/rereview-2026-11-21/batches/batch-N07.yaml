- gene_file: genes/PSEAE/spuE/spuE-ai-review.yaml
  rows:
  - go_id: GO:0015847
    go_label: putrescine transport
    family: PTHR30222
    ibd_node: PTN008624361
    tree_reading: >-
      IBD at PTN008624361 (35 leaves, 10 species) with two seeds: E. coli potF P31133 (in PTN002524385,
      6 leaves < PTN002410366, 15 leaves < PTN000766942, 19 leaves) and E. coli potD P0AFK9 (in
      PTN002410383, 9 leaves). The target spuE Q9I6J0 (leaf PTN002410380) is in PTN002410372 (6 leaves,
      all P. aeruginosa, with spuD) < PTN002015567 (9 leaves) < PTN002410366. The seeds span both sides of
      the node, so the placement is sound; the question is the SpuE leaf only. No loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002410380
    evidence_checked:
    - 'QuickGO by goId: P31133 potF GO:0015847 IDA PMID:8416922 (EcoCyc).'
    - Gene review quotes UniProt CC FUNCTION for SpuE (binds spermidine, does not bind putrescine,
      cadaverine or spermine) and PMID:22300763 (SpuE binds spermidine exclusively).
    - No family review file for PTHR30222.
    review_edited: false
    notes: >-
      Reason is short but states a target-specific ground (the binding protein sets the substrate and
      SpuE does not bind putrescine). SpuE works in the SpuDEFGH importer alongside the putrescine
      binder SpuD; the putrescine step is done by SpuD. The existing source defect is graded PROBABLE
      for that reason. Left unchanged.
  - go_id: GO:0019810
    go_label: putrescine binding
    family: PTHR30222
    ibd_node: PTN008624361
    tree_reading: >-
      IBD at PTN008624361 (35 leaves) with three seeds: spuD Q9I6J1 (leaf PTN002410379, in the same
      6-leaf P. aeruginosa clade PTN002410372 as the target), potF P31133 and potD P0AFK9. The target is
      the sister-clade paralog of the seed spuD inside PTN002410372. No loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IKR
      target_node_id: PTN002410380
    evidence_checked:
    - 'QuickGO by goId: Q9I6J1 spuD GO:0019810 IDA PMID:22300763 (PseudoCAP).'
    - Gene review quotes PMID:22300763 twice (SpuE binds spermidine exclusively; Trp271 to Phe gives
      SpuE putrescine affinity), which is direct negative evidence on the target and names the residue.
    review_edited: false
    notes: IKR rather than IRD because the paper ties the loss to Trp271. Reason left unchanged.
