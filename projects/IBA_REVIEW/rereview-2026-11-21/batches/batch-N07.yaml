- gene_file: genes/PSEAE/ampD/ampD-ai-review.yaml
  rows:
  - go_id: GO:0009276
    go_label: Gram-negative-bacterium-type cell wall
    family: PTHR30417
    ibd_node: PTN002019137
    tree_reading: >-
      IBD at PTN002019137 (18 leaves, 11 species) with three P. aeruginosa seeds: the target ampD G3XCW9
      itself (leaf PTN002411577, SF4), ampDh3 Q9I5D1 and ampDh2 Q9HT86. The node has two children.
      PTN002825391 (8 leaves, one per species) is the AmpD orthologue clade holding the target and E. coli
      ampD P13016. PTN001252283 (10 leaves) holds both other seeds (both under PTN002825394, 9 leaves)
      with E. coli amiD P75820. So the two sound seeds are in one child and the target, whose own seed
      row is wrong, is in the other. No loss recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN001252283
    evidence_checked:
    - 'QuickGO by goId: Q9HT86 ampDh2 and Q9I5D1 ampDh3 GO:0009276 IDA PMID:23510438 (PseudoCAP);
      the target seed row is IMP PMID:9835532 (PseudoCAP).'
    - Gene review judges the IMP seed row REMOVE (complementation of beta-lactamase expression does
      not localise the protein) and quotes PMID:23510438 (AmpD is the cytoplasmic protease) and the
      UniProt cytoplasm location of E. coli AmpD.
    - Family review PTHR30417-review.yaml assesses the record NEEDS_PRUNING with ADD_IRD at
      PTN002019142.
    review_edited: false
    notes: >-
      Target is its own seed; IBA and IMP row judged together and both stay REMOVE. Ground is a bad
      seed on the target plus misplacement of the IBD above the AmpD/AmiD split. The family review says
      no descendant node isolates the periplasmic clade from AmpD and so proposes an IRD at PTN002019142;
      the tree read here shows PTN002019142 is only 3 leaves (Salmonella, Yersinia, E. coli AmpD), while
      the whole AmpD clade is PTN002825391 (8 leaves) and the periplasmic seeds are isolated in
      PTN001252283. The family review should be corrected on that point; if an IRD is preferred to a
      move, its node is PTN002825391. Gene review reason left unchanged.
