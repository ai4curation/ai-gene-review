- gene_file: genes/rat/Tmem86b/Tmem86b-ai-review.yaml
  rows:
  - go_id: GO:0047826
    go_label: D-lysine 5,6-aminomutase activity
    family: PTHR31885
    ibd_node: PTN000785233
    tree_reading: >-
      IBD at PTN000785233 (9 leaves, 9 species, mammalian TMEM86B), 1 seed (human TMEM86B Q8N661).
      Children are PTN000785234 (5 leaves: human, chimp, gorilla, mouse, rat; holds seed and
      target) and PTN001275839 (4 leaves: cow, pig, horse, dog). The same node carries IBD
      GO:0047408 alkenylglycerophosphocholine hydrolase activity (2 seeds). The family root
      PTN008641082 (80 leaves) carries hydrolase activity and membrane.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000785233
    evidence_checked:
    - QuickGO by GO id for Q8N661 GO:0047826 returned 2 hits, the IBA and an IDA from UniProt
      citing PMID:21515882; this IDA is the only seed.
    - publications/PMID_21515882.md has full text (full_text_available true); it is the
      lysoplasmalogenase purification and cloning paper and a search for "aminomutase" and
      "5.4.3" returns nothing.
    - QuickGO term lookup, GO:0047826 definition is the D-lysine to 2,5-diaminohexanoate
      rearrangement; not obsolete.
