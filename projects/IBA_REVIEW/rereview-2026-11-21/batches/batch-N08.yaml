- gene_file: genes/ECOLI/ptsO/ptsO-ai-review.yaml
  rows:
  - go_id: GO:0009401
    go_label: phosphoenolpyruvate-dependent sugar phosphotransferase system
    family: PTHR33705
    ibd_node: PTN002135312
    tree_reading: >-
      IBD at PTN002135312 (35 leaves, 25 species), 2 seeds (S. coelicolor HPr O50515, E. coli HPr
