genes:
- gene_file: genes/yeast/IPT1/IPT1-ai-review.yaml
  rows:
  - go_id: GO:0070916
    go_label: inositol phosphoceramide synthase complex
    family: PTHR31310
    ibd_node: PTN001263009
    tree_reading: >-
      IBD at PTN001263009 (17 leaves, 14 species), 1 seed (yeast AUR1, SGD:S000001487). Children are
      PTN000770386 (14 leaves, ascomycetes, holding both target and seed) and PTN001263024 (3
      basidiomycete leaves). Inside PTN000770386 the node PTN002041779 (12 leaves) splits into the
      IPT1 clade PTN002416579 (3 leaves: S. cerevisiae IPT1, C. albicans IPT1, Sclerotinia
      SS1G_02388) and the AUR1 clade PTN000770387 (9 leaves, holding the seed AUR1 P36107 and
      C. albicans AUR1). S. pombe aur1 sits outside both, in PTN008632007 (2 leaves). No PAINT loss
      for the term is recorded in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002416579
    evidence_checked:
    - QuickGO by GO id for AUR1 P36107 GO:0070916 returned 3 hits (IPI PMID:19726565 from SGD with
      Kei1 S000002775 and from ComplexPortal, plus the IBA); the same query shape for IPT1 P38954
      with descendants returned only the IBA.
    - interpro/panther/PTHR31310/PTHR31310-review.yaml marks this node and term NEEDS_PRUNING for
      SF8 (Ipt1), in agreement.
    review_edited: false
    notes: The seed and the target are paralogs split at PTN002041779; Ipt1 is the M(IP)2C synthase,
      a different enzyme from the Aur1 catalytic subunit of the Aur1-Kei1 complex. The existing
      reason states this (paralog complex membership) without naming the node; it is sound, so the
      review was left alone. An IRD on the three-leaf IPT1 clade is preferred to moving the IBD to
      PTN000770387, because a move would also strip S. pombe aur1 and the basidiomycete leaves,
      which sit outside the seeded clade in this tree but are IPC synthase orthologs by name.
- gene_file: genes/ARATH/AT1G06680/AT1G06680-ai-review.yaml
  rows:
  - go_id: GO:0048564
    go_label: photosystem I assembly
    family: PTHR31407
    ibd_node: PTN001584458
    tree_reading: >-
      IBD at PTN001584458 (582 leaves, 40 species), 1 seed (PPD1, AT4G15510, O23403). The node has
      nine child clades, each with a Chlamydomonas member and angiosperm members, so they are
      paralogous PsbP-domain lineages older than the split of green algae and land plants. The seed
      PPD1 lies in PTN002833348 (52 leaves, 40 species). The target PsbP1 (Q42029) lies in a
      different child, PTN001584499 (80 leaves, 39 species), which holds the authentic PSBP
      proteins (spinach PSBP P12302, wheat PSBP Q00434). No PAINT loss for the term is recorded on
      the lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002833348
    evidence_checked:
    - QuickGO by GO id for PPD1 O23403 GO:0048564 returned 3 hits (IMP PMID:23221595 and
      PMID:25008325 from TAIR, plus the IBA), so the seed is sound for its own clade.
    - interpro/panther/PTHR31407 has a paint.tsv (row PTN001584458 GO:0048564 IBD, seed
      AT4G15510) but no family review.
    review_edited: true
    notes: Tier 1 lead. The action stands, but the written reason rested on the deep-research file
      giving no support for a PSI role. The reason was rewritten to state the tree ground (seed in
      PTN002833348, target in PTN001584499, PsbP1 is a PSII oxygen-evolving complex subunit). The
      propagation_review block was already node-aware and was not changed.
