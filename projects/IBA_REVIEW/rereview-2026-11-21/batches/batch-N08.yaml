      UniProt IDA; the IBD goes with it.
- gene_file: genes/ECOLI/fepE/fepE-ai-review.yaml
  rows:
  - go_id: GO:0004713
    go_label: protein tyrosine kinase activity
    family: PTHR32309
    ibd_node: PTN000794252
    tree_reading: >-
      IBD at PTN000794252 (62 leaves, 23 species), 2 seeds (E. coli Wzc P76387 and Etk P38134).
      The target sits in child PTN002088227 (26 leaves, proteobacteria), then PTN001284344 (18
      leaves), then PTN004940537 (11 enterobacterial leaves). PTN004940537 has four children:
      the FepE clade PTN002427071 (3 leaves, holding the target), the WzzE clade PTN002088229
      (3 leaves), the WzzB clade PTN002427078 (2 leaves) and PTN002088232 (3 leaves: E. coli
      Etk, E. coli Wzc, Salmonella Wzc), which holds both seeds. The other children of
      PTN000794252 are Gram-positive, cyanobacterial, Bacteroides and planctomycete clades with
      no seed. No PAINT loss recorded.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002088232
    evidence_checked:
    - QuickGO by GO id, P76387 GO:0004713 IDA PMID:10348860 (EcoCyc) and P38134 GO:0004713 IDA
      PMID:10369665 (EcoCyc); FepE P26266 with descendants has only the IBA.
    - No family review exists for PTHR32309; paint.tsv row confirms the two seeds.
    review_edited: true
    notes: Action stands. Summary and reason had attributed the IBA to the PANTHER family name
      ("TYROSINE-PROTEIN KINASE"), which is not how an IBA arises; both were corrected to name the
      IBD node, the seeds and the seeded three-leaf clade. The ground is the domain architecture
      (PCP-1 proteins end shortly after TM2 and lack the cytoplasmic Walker A/B kinase domain of
      PCP-2a) together with the seeds being confined to PTN002088232.
