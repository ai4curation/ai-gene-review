- gene_file: genes/PSEAE/pilM/pilM-ai-review.yaml
  rows:
  - go_id: GO:0044096
    go_label: type IV pilus
    family: PTHR32432
    ibd_node: PTN001286216
    tree_reading: >-
      IBD at PTN001286216 (23 leaves, 20 species), 1 seed, which is the target itself (G3XD28).
      The target sits in PTN001596234 (8 leaves) inside PTN001286219 (11 leaves), which also
      holds a three-leaf eutJ clade PTN002089606 (Salmonella eutJ, E. coli eutJ, a Yersinia
      protein). Other children of the IBD node are cyanobacterial, planctomycete and single
      leaves including Fusobacterium and Listeria. The node also carries IBD GO:0043107 type IV
      pilus-dependent motility with the same single seed.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001286216
    evidence_checked:
    - QuickGO by GO id, G3XD28 GO:0044096 returned the IBA and one located_in IMP PMID:7565110
      from PseudoCAP; that IMP is the only seed.
    - QuickGO term lookup, GO:0044096 is defined as the surface filament. The review holds an EXP
      cytoplasm row (PMID:19857645) and quotes that PilM is cytoplasmic and docks on the inner
      membrane.
    - interpro/panther/PTHR32432/PTHR32432-review.yaml marks this node and term UNRESOLVED (mixed
      PilM and EutJ branch); not in conflict with withdrawing the IBD.
    review_edited: false
    notes: Target is its own seed, so the IBA and the IMP row were judged together; both are REMOVE
      in the review and stay consistent. The seed is a location claim made from a no-pili mutant
      phenotype, and direct localisation puts PilM in the cytoplasm on the inner membrane, which
      excludes the fibre. Caveat, the full text of PMID:7565110 was not available to the earlier
      reviewer or to this one; the REMOVE rests on the contradicting localisation data, not on
      the unread paper.
- gene_file: genes/PSEAE/np20/np20-ai-review.yaml
  rows:
  - go_id: GO:1900376
    go_label: regulation of secondary metabolite biosynthetic process
    family: PTHR33202
    ibd_node: PTN002112386
    tree_reading: >-
      IBD at the family-level node PTN002112386 (83 leaves, 37 species), 2 seeds: the target
      itself (Q9HT74) and P. aeruginosa Fur (Q03456). Children are PTN002431802 (5 leaves,
      archaeal fur genes and one Ricinus sequence) and PTN002112394 (78 leaves, bacterial Fur,
      Zur and PerR). Target and Fur both descend from PTN002112472 (21 leaves): the target through
      the Zur clade PTN002112473 (9 leaves), Fur through PTN002112483 (12 leaves), which carries
      its own IBD GO:1900705 negative regulation of siderophore biosynthetic process.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002112386
    evidence_checked:
    - QuickGO by GO id with descendants, Q9HT74 has the IBA and IMP PMID:12426334 (PseudoCAP) on
      GO:1900376; Q03456 has only GO:1900705 (IMP PMID:8885270 and its IBA from PTN002112483), so
      Fur seeds this node through a descendant term that PAINT already places at the Fur node.
    - publications/PMID_12426334.md (full text) states the np20 mutant came from a
      pyocyanin-deficiency screen and that np20 mutations reduced transcription of
      quorum-sensing-controlled genes.
    review_edited: true
    notes: Target is its own seed, so the IBA and the IMP row were judged together. The earlier
      REMOVE on both rested on the phenotype being indirect, which is weak evidence, not a wrong
      annotation and not divergence on the tree. The phenotype was observed and nothing
      contradicts it, so both rows were changed to MARK_AS_OVER_ANNOTATED (the same action the
      corpus gives the comparable PA5208 screen IMP), and the PSEUDOCAP source defect on the IMP
      row was lowered from DELETE_ROW/PROBABLE to CHECK/SUSPECTED. The node placement is still
      wrong for the family, an 83-leaf Fur superfamily node resting on one indirect Zur phenotype
      plus a Fur term already asserted at PTN002112483, hence REMOVE_IBD.
