- gene_file: genes/human/ACD/ACD-ai-review.yaml
  rows:
  - go_id: GO:0042162
    go_label: telomeric repeat DNA binding
    family: PTHR14487
    ibd_node: PTN002683935
    tree_reading: >-
      IBD at PTN002683935 (19 leaves, 18 species; root PTN008555896 has 20 leaves), 3 seeds: human ACD
      Q96AP0 (the target), mouse Acd (MGI:87873, Q5EE38) and zebrafish tpp1 (ZFIN:ZDB-GENE-081022-45,
      A0A1D5NT19). The node has two children: PTN008555897 (16 leaves, tetrapod ACD, holding the target
      and the mouse seed) and PTN002683939 (3 leaves, fish, holding the zebrafish seed). So the node is
      seeded on both sides and the placement follows the seeds; the question is whether the seed
      annotations are right. The same node carries shelterin complex, telomere capping and two other
      process IBDs that are not in dispute.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002683935
    evidence_checked:
    - 'QuickGO by goId: Q96AP0 IDA PMID:23685356 (BHF-UCL); Q5EE38 IDA PMID:23685356 (BHF-UCL, same
      paper); A0A1D5NT19 IDA PMID:21311760 (ZFIN).'
    - publications/PMID_23685356.md (full text cached) describes SILAC pull-downs of HeLa nuclear extract
      on polymerized TTAGGG oligonucleotides and states that three shelterin members bind telomeric DNA
      directly (TRF1, TRF2, POT1); TPP1 is recovered as a shelterin partner.
    - 'PubMed abstract of PMID:21311760 (zebrafish TPP1, doi:10.1371/journal.pone.0016440): reports
      zebrafish TPP1, POT1 and TIN2 homologues, their domain interactions and knockdown phenotypes; the
      abstract reports no direct DNA-binding assay. Full text not read.'
    - Gene review quotes PMID:31216472 (purified TPP1-S and TPP1-L do not bind DNA) and PMID:35201900
      (cryo-EM, TPP1 does not contact the DNA).
    - Family review PTHR14487-review.yaml assesses the node WRONG_NODE and the term NOT_APPLICABLE.
    review_edited: false
    notes: The target is its own seed, so the IBA and the IDA row from PMID:23685356 are judged together;
      both are REMOVE in the review, with the IEA. The human and mouse seeds rest on one whole-extract
      pull-down that cannot separate direct from shelterin-mediated binding, and direct assays on the
      purified human protein are negative. The zebrafish seed was checked at abstract depth only; its
      basis in the full text was not read, so the REMOVE_IBD is firm for the tetrapod clade and a query
      for the fish seed.
- gene_file: genes/human/LRCH4/LRCH4-ai-review.yaml
  rows:
  - go_id: GO:0016605
    go_label: PML body
    family: PTHR16083
    ibd_node: PTN002699689
    tree_reading: >-
      IBD at PTN002699689 (18 leaves, 15 species) inside PTHR16083 (697 leaves), one seed, the target
      itself (human LRCH4 O75427). Children: PTN008357723 (14 leaves, mammalian LRCH4 orthologs, holding
      the target) and PTN009029354 (4 leaves, fish). No other GO:0016605 record on the lineage up to the
      root PTN009029340, and no other PAINT record at all on the target's lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002699689
    evidence_checked:
    - 'QuickGO by goId: O75427 LRCH4 GO:0016605 located_in IDA PMID:16449650 (assigned by MGI) is the only
      experimental annotation; SAP25 Q8TEE9 returns 0 hits for GO:0016605.'
    - publications/PMID_16449650.md is the SAP25 paper (title "Identification and characterization of
      SAP25, a novel component of the mSin3 corepressor complex"); a grep of the cached text finds SAP25
      and no mention of LRCH4.
    - No family review exists for PTHR16083.
    review_edited: false
    notes: The single seed is an IDA on the target that cites a paper about a different protein, SAP25,
      so the node has no sound experimental basis. The existing reason says exactly this and explicitly
      does not treat the self-seed as circular; left unchanged. The IDA row is REMOVE in the same review.
- gene_file: genes/human/ABHD10/ABHD10-ai-review.yaml
  rows:
  - go_id: GO:0004553
    go_label: hydrolase activity, hydrolyzing O-glycosyl compounds
    family: PTHR16138
    ibd_node: PTN004490000
    tree_reading: >-
      IBD at PTN004490000 (30 leaves, 28 species; root PTN004490001 has 31), one seed, the target itself
      (human ABHD10 Q9NUJ1). Children: PTN001043684 (28 leaves, holding the target and all metazoan
      ABHD10 orthologs) and PTN008563538 (2 green-algal leaves). Inside the target's clade PTN001043685
      (27 leaves) carries the IBDs for GO:0008474 palmitoyl-(protein) hydrolase activity (2 seeds) and
      mitochondrion. No PAINT loss for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN004490000
    evidence_checked:
    - 'QuickGO by goId: Q9NUJ1 GO:0004553 IDA PMID:22294686 (BHF-UCL), TAS Reactome:R-HSA-5694563, and
      the IBA; no other family member has an experimental annotation to the term.'
    - Gene review quotes PMID:22294686 (recombinant ABHD10 deglucuronidates the acyl glucuronide AcMPAG
      and not the phenolic O-glucuronide MPAG); the activity is the carboxylic ester hydrolysis
      GO:0102390, which the review keeps.
    - Family review PTHR16138-review.yaml says the seed IDA and this IBD should both be retracted.
    review_edited: false
    notes: Target is its own seed; the IDA row on the same term is MODIFY (to the acyl-glucuronide
      esterase term) in the review, i.e. the review holds the O-glycosyl term wrong for the gene on every
      row, which is consistent with removing the IBA projected from that seed. Existing reason names the
      node and the seed; left unchanged.
- gene_file: genes/human/AZGP1/AZGP1-ai-review.yaml
  rows:
  - go_id: GO:0001916
    go_label: positive regulation of T cell mediated cytotoxicity
    family: PTHR16675
    ibd_node: PTN002497567
    tree_reading: >-
      IBD at PTN002497567 (273 leaves, 13 species), 10 seeds. The node has two children: a platypus-only
      clade PTN000422772 (10 leaves) and PTN008564975 (263 leaves), which has three children:
      PTN000422452 (168 leaves, the classical and non-classical class I heavy chains HLA-A, -B, -C, -E,
      -F, -G and rodent H2), PTN008564976 (76 leaves, the ULBP/RAET1 NKG2D ligands, with its own IBD for
      GO:0042267) and PTN000422425 (19 leaves, the AZGP1 clade, holding the target; 13 placental AZGP1 in
      PTN000422426 plus 6 opossum leaves in PTN001445120). Every leaf with an experimental annotation to
      the term is in PTN000422452. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000422452
    evidence_checked:
    - 'QuickGO, all 273 leaves under PTN002497567 queried by goId with descendants and experimental
      evidence codes: 8 leaves returned (P01889, P01901, P04439, P06339, P13747, P14427, P14431, P30511),
      all in PTN000422452; none in the AZGP1 clade or the ULBP clade.'
    - Gene review quotes PMID:10206894 (ZAG does not bind beta2-microglobulin and its groove holds a
      nonpeptidic compound) and PMID:11425849 (fatty acid binding).
    - Family review PTHR16675-review.yaml lists AZGP1 (SF289) as diverged_from_family and names
      GO:0001916, GO:0002476, GO:0002486 and GO:0006955 as over-propagated onto AZGP1.
    review_edited: false
    notes: Existing reason rests on structural divergence of ZAG (no beta2m, no peptide, secreted) and the
      propagation_review names the node; left unchanged. An alternative, narrower fix is ADD_IRD at
      PTN000422425, but the seeds all sitting in one of three sister clades makes MOVE_IBD the cleaner
      request.
  - go_id: GO:0002476
    go_label: antigen processing and presentation of endogenous peptide antigen via MHC class Ib
    family: PTHR16675
    ibd_node: PTN002497567
    tree_reading: >-
      Same node and topology as GO:0001916: IBD at PTN002497567 (273 leaves), 6 seeds; target in the AZGP1
      clade PTN000422425 (19 leaves), a sister of the class I heavy chain clade PTN000422452 (168 leaves)
      and of the ULBP clade PTN008564976 (76 leaves) under PTN008564975. Every experimentally annotated
      leaf is in PTN000422452.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000422452
    evidence_checked:
    - 'QuickGO, 273 leaves under PTN002497567 by goId with descendants, experimental codes: 5 leaves
      (P06339, P13747 HLA-E, P14431, P17693 HLA-G, P30511 HLA-F), all in PTN000422452.'
    - Gene review quotes PMID:10206894 (no beta2m binding, nonpeptidic groove ligand).
    review_edited: false
    notes: Existing reason rests on real divergence evidence for the target; left unchanged.
  - go_id: GO:0002486
    go_label: antigen processing and presentation of endogenous peptide antigen via MHC class I via ER pathway,
      TAP-independent
    family: PTHR16675
    ibd_node: PTN002497567
    tree_reading: >-
      Same node and topology as GO:0001916: IBD at PTN002497567 (273 leaves), 3 seeds (HLA-A P04439, HLA-B
      P01889, HLA-C P10321), all in the class I heavy chain clade PTN000422452 (168 leaves); the target is
      in the sister AZGP1 clade PTN000422425 (19 leaves).
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000422452
    evidence_checked:
    - 'QuickGO, 273 leaves under PTN002497567 by goId with descendants, experimental codes: 3 leaves
      (P01889, P04439, P10321), all in PTN000422452.'
    - Gene review quotes PMID:10206894.
    review_edited: false
    notes: Existing reason rests on real divergence evidence for the target; left unchanged.
  - go_id: GO:0006955
    go_label: immune response
    family: PTHR16675
    ibd_node: PTN002703355
    tree_reading: >-
      IBD at PTN002703355 (586 leaves, 20 species; root PTN007661439 has 589), 19 seeds spread over many
      clades (HLA class I, CD1C, MICA, ULBP1-3, RAET1E/G, mouse and rat genes), so the node itself is
      well seeded on several sides. The target's lineage runs PTN000422425 (19 leaves, AZGP1 clade) <
      PTN008564975 (263) < PTN002497567 (273) < PTN000422357 (353) < PTN000422356 (398) < PTN000422283
      (467) < PTN000422282 (533) < PTN002703355. PAINT already records a loss for this term in the family:
      NOT IRD GO:0006955 at PTN000422361 (the HFE clade), so there is precedent for pruning a
      non-immune class I-like lineage. No leaf of the AZGP1 clade has an experimental annotation.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000422425
    evidence_checked:
    - 'QuickGO, the 19 leaves under PTN000422425 by goId GO:0006955 with descendants, experimental codes:
      0 leaves (the same query shape returned hits for other clades of this family).'
    - PAINT file interpro/panther/PTHR16675/PTHR16675-paint.tsv has the IRD row for GO:0006955 at
      PTN000422361.
    - Gene review quotes PMID:10206894 and PMID:11425849; family review marks SF289 diverged_from_family.
    review_edited: false
    notes: The absence of annotation is not the ground. The ground is that the AZGP1 lineage lost the two
      features the immune functions of this family depend on (beta2m pairing and a peptide or lipid
      antigen presenting groove used for receptor recognition) and became a secreted lipid-mobilising
      factor. IRD target is the whole AZGP1 clade PTN000422425; a curator who doubts the six opossum
      leaves could place it at PTN000422426 (13 placental leaves). Existing reason left unchanged.
  - go_id: GO:0009897
    go_label: external side of plasma membrane
    family: PTHR16675
    ibd_node: PTN002703355
    tree_reading: >-
      IBD at PTN002703355 (586 leaves), 12 seeds (mouse class I and class I-like genes and human HFE
      Q30201, which sits in PTN009032185, 34 leaves, joining the target only at PTN000422357, 353 leaves).
      The target is in the AZGP1 clade PTN000422425 (19 leaves). The same root node also carries the IBD
      for GO:0005576 extracellular region, which the review accepts for AZGP1. No leaf of the AZGP1 clade
      has an experimental annotation to the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000422425
    evidence_checked:
    - 'QuickGO, the 19 leaves under PTN000422425 by goId GO:0009897 with descendants, experimental codes:
      0 leaves.'
    - Gene review quotes the UniProt record (signal peptide 1..20; subcellular location Secreted) and
      PMID:10206894; AZGP1 has no transmembrane segment and no beta2m partner to hold it at the membrane.
    review_edited: false
    notes: Membrane-anchored family members are type I membrane proteins; ZAG is a soluble secreted chain,
      so the compartment is replaced by extracellular region in this lineage. Existing reason left
      unchanged.
- gene_file: genes/human/B2M/B2M-ai-review.yaml
  rows:
  - go_id: GO:0002503
    go_label: peptide antigen assembly with MHC class II protein complex
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: &b2mtree >-
      IBD at the family root PTN000460629 (293 leaves, 20 species), a C1-set Ig domain family. The root
      has three children: PTN008572149 (138 leaves; class II alpha chains HLA-DRA, -DPA1, -DMA, -DOA and
      immunoglobulin constant region leaves), PTN008572173 (113 leaves; class II beta chains HLA-DRB,
      -DQB, -DPB, -DOB) and PTN009041005 (42 leaves), which holds the target. Inside PTN009041005 the
      tetrapod B2M clade PTN000460891 (20 leaves) is sister to the HLA-DMB clade PTN008366805 (16 leaves)
      under PTN008572169 (36 leaves), with a fish b2m clade PTN002717031 (6 leaves) outside. Seeds for
      the class II terms sit in all three root children (class II alpha, class II beta, and HLA-DMB or
      mouse H2-DMb1 in PTN008366805); none is a B2M leaf. No PAINT loss is recorded in the family.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000460891
    evidence_checked: &b2mev
    - 'QuickGO, the 42 leaves under PTN009041005 queried by goId with descendants and experimental codes
      for each of the seven terms: the only leaves returned are HLA-DMB P28068 and mouse H2-DMb1 P35737
      in PTN008366805; no B2M leaf has an experimental annotation to any of them.'
    - 'Seed positions read with the tree helper: P01903, P28067, P20036, P06340 in PTN008572149; P01911,
      P13762, P79483, Q30154, P04440, P01920, P13765 in PTN008572173; P28068 in PTN008366805.'
    - Family review PTHR19944-review.yaml describes SF62 (B2M) as the class I light chain lineage and
      scopes the class II terms away from it.
    review_edited: false
    notes: B2M is the light chain of class I and class I-like heterodimers and is not a subunit of class
      II or HLA-DM; the term names the class II complex. The IBD cannot simply be moved because seeds sit
      on all three root children, so the fix is a loss on the B2M clade (and the same on the fish b2m
      clade PTN002717031). Existing reason names the node and the complex mismatch; left unchanged.
  - go_id: GO:0005765
    go_label: lysosomal membrane
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: *b2mtree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO P61769 and mouse P01887 by goId GO:0005764 and GO:0005770 with descendants: only the IBA
      itself. P61769 by GO:0005768 endosome with descendants: Reactome TAS rows for early endosome
      membrane, early endosome lumen and recycling endosome membrane.'
    - 'Seeds for this term (HLA-DRA, DRB1, DRB3, DRB4, DRB5, DMA, DMB, mouse H2-DMa and H2-DMb) are all
      class II or HLA-DM chains; nearest to the target is HLA-DMB in the sister clade PTN008366805.'
    - The same gene review keeps early endosome membrane and phagocytic vesicle membrane (Reactome TAS)
      as KEEP_AS_NON_CORE for B2M bound to class I heavy chains.
    review_edited: true
    notes: The earlier reason (B2M does not traffic in class II complexes, and has no membrane anchor)
      describes the seeds and does not exclude the compartment; B2M reaches endosomal membranes bound to
      class I and class I-like heavy chains, as the review accepts on other rows. No loss, misplacement
      that the term is wrong for, bad seed or lineage ground can be stated, so the row is no longer
      asserted false. The node placement is doubtful for B2M and no B2M-specific evidence was read, hence
      MARK_AS_OVER_ANNOTATED and not a keep. No PAINT change is requested for this term on B2M.
  - go_id: GO:0019886
    go_label: antigen processing and presentation of exogenous peptide antigen via MHC class II
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: *b2mtree
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000460891
    evidence_checked: *b2mev
    review_edited: false
    notes: Class II presentation is performed by the class II heterodimer; B2M is not part of it. Existing
      reason left unchanged.
  - go_id: GO:0023026
    go_label: MHC class II protein complex binding
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: *b2mtree
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000460891
    evidence_checked: *b2mev
    review_edited: false
    notes: Seeds are HLA-DM and HLA-DO chains (P28067, P28068, P06340, P13765), which bind class II as
      their function; B2M binds class I heavy chains. Existing reason left unchanged.
  - go_id: GO:0031902
    go_label: late endosome membrane
    family: PTHR19944
    ibd_node: PTN000460629
    tree_reading: *b2mtree
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO P61769 by goId GO:0005770 late endosome with descendants: only the IBA. By GO:0005768
      endosome with descendants: Reactome TAS rows for early endosome membrane, early endosome lumen and
      recycling endosome membrane.'
    - Seeds for this term are HLA-DRA, DRB1, DRB3, DRB4, DRB5, DMA and DMB, all class II or HLA-DM.
