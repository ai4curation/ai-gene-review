genes:
- gene_file: genes/human/RSAD1/RSAD1-ai-review.yaml
  rows:
  - go_id: GO:0006779
    go_label: porphyrin-containing compound biosynthetic process
    family: PTHR13932
    ibd_node: PTN000358281
    tree_reading: >-
      IBD at the family root PTN000358281 (140 leaves, 102 species), 4 seeds. The root has two children.
      PTN008552838 (35 leaves, 32 species) holds the target with the metazoan RSAD1 orthologs, Dictyostelium
      rsad1 and a few bacterial leaves (Bradyrhizobium Q89WK6, Bacteroides Q8A5S0). PTN000358280 (105
      leaves, 71 species) holds all four seeds: Synechocystis hemN P74132, P. aeruginosa hemN P77915,
      B. subtilis hemW P54304 and Synechocystis hemW P73245; it also holds E. coli hemN P32131 and E. coli
      hemW P52062 (lineage PTN000358332 < PTN000358325 < PTN008552848 < PTN000358280). No seed sits in
      the target's child clade, and no PAINT loss for the term is recorded in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000358280
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned hits for every seed): P54304 GO:0006779 IMP
      PMID:10498703 (UniProt); P74132 GO:0006783 heme biosynthetic process IMP PMID:20194361; P77915
      GO:0006783 IMP PMID:9767567; P73245 GO:0006783 IMP PMID:20194361; P32131 E. coli hemN has IBA and
      IEA only.'
    - Family review interpro/panther/PTHR13932/PTHR13932-review.yaml assesses this node TOO_DEEP and
      proposes the HemN SF6 node PTN000358335 (16 leaves) as the right placement.
    review_edited: false
    notes: Existing reason argues with the node placement and cites direct absence of coproporphyrinogen
      dehydrogenase activity in a HemW protein, so it was left unchanged. MOVE_IBD target given here is
      PTN000358280, the root child that contains every seed, which is the most that the seed positions
      alone license; the family review argues for the narrower PTN000358335 because two of the four seeds
      are HemW proteins whose mutant phenotypes need not reflect a biosynthetic step. Either placement
      takes the term off RSAD1.
- gene_file: genes/human/ARID4A/ARID4A-ai-review.yaml
  rows:
  - go_id: GO:0000976
    go_label: transcription cis-regulatory region binding
    family: PTHR13964
    ibd_node: PTN000359478
    tree_reading: >-
      IBD at the family root PTN000359478 (119 leaves, 45 species) with one seed, human ARID5B Q14865. The
      root splits into the fungal SWI1/sol1 clade PTN001017926 (14 leaves) and PTN001017882 (105 leaves),
      which is a Trichoplax leaf plus PTN000359480 (104 leaves). PTN000359480 has two children:
      PTN009015189 (51 leaves, the ARID5A/ARID5B clade, holding the seed; ARID5B lineage passes
      PTN009015192, 45 leaves) and PTN000359479 (53 leaves, the ARID4A/ARID4B clade, holding the target).
      ARID4A and ARID4B separate at PTN009015213 (41 leaves). The only seed is across the PTN000359480
      split from the target. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009015189
    evidence_checked:
    - 'QuickGO by goId: Q14865 ARID5B GO:0000976 IDA PMID:21532585 (UniProt) is the only experimental
      annotation behind the node; P29374 ARID4A carries GO:0003677 IDA PMID:15640446 and the IBA only.'
    - 'QuickGO ontology: GO:0000976 is_a GO:1990837 sequence-specific double-stranded DNA binding and
      GO:0043565, so the term asserts sequence specificity.'
    - Gene review quotes PMID:15640446 and PMID:34506790 (ARID4A ARID domain binds DNA with no sequence
      preference); quotes are in the review and were not re-fetched.
    - Family review PTHR13964-review.yaml assesses the node TOO_DEEP with MOVE_IBD to PTN009015192.
    review_edited: false
    notes: Existing reason is node-aware (names PTN000359478 and the sole ARID5B seed) and rests on direct
      evidence of sequence-nonspecific binding by the target's ARID domain. Target node here is the
      ARID5 child of the split, PTN009015189; the family review names PTN009015192 (45 leaves) inside it.
- gene_file: genes/human/ARID4B/ARID4B-ai-review.yaml
  rows:
  - go_id: GO:0000976
    go_label: transcription cis-regulatory region binding
    family: PTHR13964
    ibd_node: PTN000359478
    tree_reading: >-
      Same record as for ARID4A: IBD at root PTN000359478 (119 leaves), one seed, human ARID5B Q14865, in
      PTN009015189 (51 leaves, ARID5 clade). ARID4B Q4LE39 (leaf PTN002493494) is in the sister clade
      PTN000359479 (53 leaves, ARID4 clade), in PTN002678192 (22 leaves), the ARID4B side of the
      ARID4A/ARID4B split at PTN009015213 (41 leaves). No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009015189
    evidence_checked:
    - 'QuickGO by goId: Q14865 ARID5B GO:0000976 IDA PMID:21532585 is the only seed annotation.'
    - Gene review quotes PMID:15640446 (five of seven ARID subfamilies bind DNA without sequence
      preference) and PMID:33675746 (ARID4B Tudor domain DNA binding); ARID4B carries GO:0003677 EXP and
      IMP PMID:33675746 rows.
    - Family review PTHR13964-review.yaml, node assessment TOO_DEEP, MOVE_IBD to PTN009015192.
    review_edited: false
    notes: Existing reason and propagation_review name the node and the sole seed and argue divergence of
      the ARID4 clade; left unchanged.
- gene_file: genes/human/ACD/ACD-ai-review.yaml
  rows:
  - go_id: GO:0042162
    go_label: telomeric repeat DNA binding
    family: PTHR14487
    ibd_node: PTN002683935
    tree_reading: >-
      IBD at PTN002683935 (19 leaves, 18 species; root PTN008555896 has 20 leaves), 3 seeds: human ACD
      Q96AP0 (the target), mouse Acd (MGI:87873, Q5EE38) and zebrafish tpp1 (ZFIN:ZDB-GENE-081022-45,
      A0A1D5NT19). The node has two children: PTN008555897 (16 leaves, tetrapod ACD, holding the target
      and the mouse seed) and PTN002683939 (3 leaves, fish, holding the zebrafish seed). So the node is
      seeded on both sides and the placement follows the seeds; the question is whether the seed
      annotations are right. The same node carries shelterin complex, telomere capping and two other
      process IBDs that are not in dispute.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002683935
    evidence_checked:
    - 'QuickGO by goId: Q96AP0 IDA PMID:23685356 (BHF-UCL); Q5EE38 IDA PMID:23685356 (BHF-UCL, same
      paper); A0A1D5NT19 IDA PMID:21311760 (ZFIN).'
    - publications/PMID_23685356.md (full text cached) describes SILAC pull-downs of HeLa nuclear extract
      on polymerized TTAGGG oligonucleotides and states that three shelterin members bind telomeric DNA
      directly (TRF1, TRF2, POT1); TPP1 is recovered as a shelterin partner.
    - 'PubMed abstract of PMID:21311760 (zebrafish TPP1, doi:10.1371/journal.pone.0016440): reports
      zebrafish TPP1, POT1 and TIN2 homologues, their domain interactions and knockdown phenotypes; the
      abstract reports no direct DNA-binding assay. Full text not read.'
    - Gene review quotes PMID:31216472 (purified TPP1-S and TPP1-L do not bind DNA) and PMID:35201900
      (cryo-EM, TPP1 does not contact the DNA).
    - Family review PTHR14487-review.yaml assesses the node WRONG_NODE and the term NOT_APPLICABLE.
    review_edited: false
    notes: The target is its own seed, so the IBA and the IDA row from PMID:23685356 are judged together;
      both are REMOVE in the review, with the IEA. The human and mouse seeds rest on one whole-extract
      pull-down that cannot separate direct from shelterin-mediated binding, and direct assays on the
      purified human protein are negative. The zebrafish seed was checked at abstract depth only; its
      basis in the full text was not read, so the REMOVE_IBD is firm for the tetrapod clade and a query
      for the fish seed.
- gene_file: genes/human/LRCH4/LRCH4-ai-review.yaml
  rows:
  - go_id: GO:0016605
    go_label: PML body
    family: PTHR16083
    ibd_node: PTN002699689
    tree_reading: >-
      IBD at PTN002699689 (18 leaves, 15 species) inside PTHR16083 (697 leaves), one seed, the target
      itself (human LRCH4 O75427). Children: PTN008357723 (14 leaves, mammalian LRCH4 orthologs, holding
      the target) and PTN009029354 (4 leaves, fish). No other GO:0016605 record on the lineage up to the
      root PTN009029340, and no other PAINT record at all on the target's lineage.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN002699689
    evidence_checked:
    - 'QuickGO by goId: O75427 LRCH4 GO:0016605 located_in IDA PMID:16449650 (assigned by MGI) is the only
      experimental annotation; SAP25 Q8TEE9 returns 0 hits for GO:0016605.'
    - publications/PMID_16449650.md is the SAP25 paper (title "Identification and characterization of
      SAP25, a novel component of the mSin3 corepressor complex"); a grep of the cached text finds SAP25
      and no mention of LRCH4.
    - No family review exists for PTHR16083.
    review_edited: false
    notes: The single seed is an IDA on the target that cites a paper about a different protein, SAP25,
      so the node has no sound experimental basis. The existing reason says exactly this and explicitly
      does not treat the self-seed as circular; left unchanged. The IDA row is REMOVE in the same review.
- gene_file: genes/human/ABHD10/ABHD10-ai-review.yaml
  rows:
  - go_id: GO:0004553
    go_label: hydrolase activity, hydrolyzing O-glycosyl compounds
    family: PTHR16138
    ibd_node: PTN004490000
    tree_reading: >-
      IBD at PTN004490000 (30 leaves, 28 species; root PTN004490001 has 31), one seed, the target itself
      (human ABHD10 Q9NUJ1). Children: PTN001043684 (28 leaves, holding the target and all metazoan
      ABHD10 orthologs) and PTN008563538 (2 green-algal leaves). Inside the target's clade PTN001043685
      (27 leaves) carries the IBDs for GO:0008474 palmitoyl-(protein) hydrolase activity (2 seeds) and
      mitochondrion. No PAINT loss for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN004490000
    evidence_checked:
    - 'QuickGO by goId: Q9NUJ1 GO:0004553 IDA PMID:22294686 (BHF-UCL), TAS Reactome:R-HSA-5694563, and
      the IBA; no other family member has an experimental annotation to the term.'
    - Gene review quotes PMID:22294686 (recombinant ABHD10 deglucuronidates the acyl glucuronide AcMPAG
      and not the phenolic O-glucuronide MPAG); the activity is the carboxylic ester hydrolysis
      GO:0102390, which the review keeps.
    - Family review PTHR16138-review.yaml says the seed IDA and this IBD should both be retracted.
    review_edited: false
    notes: Target is its own seed; the IDA row on the same term is MODIFY (to the acyl-glucuronide
      esterase term) in the review, i.e. the review holds the O-glycosyl term wrong for the gene on every
      row, which is consistent with removing the IBA projected from that seed. Existing reason names the
      node and the seed; left unchanged.
