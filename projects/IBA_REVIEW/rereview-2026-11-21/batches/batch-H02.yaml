genes:
- gene_file: genes/human/RSAD1/RSAD1-ai-review.yaml
  rows:
  - go_id: GO:0006779
    go_label: porphyrin-containing compound biosynthetic process
    family: PTHR13932
    ibd_node: PTN000358281
    tree_reading: >-
      IBD at the family root PTN000358281 (140 leaves, 102 species), 4 seeds. The root has two children.
      PTN008552838 (35 leaves, 32 species) holds the target with the metazoan RSAD1 orthologs, Dictyostelium
      rsad1 and a few bacterial leaves (Bradyrhizobium Q89WK6, Bacteroides Q8A5S0). PTN000358280 (105
      leaves, 71 species) holds all four seeds: Synechocystis hemN P74132, P. aeruginosa hemN P77915,
      B. subtilis hemW P54304 and Synechocystis hemW P73245; it also holds E. coli hemN P32131 and E. coli
      hemW P52062 (lineage PTN000358332 < PTN000358325 < PTN008552848 < PTN000358280). No seed sits in
      the target's child clade, and no PAINT loss for the term is recorded in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000358280
    evidence_checked:
    - 'QuickGO by goId with descendants (query shape returned hits for every seed): P54304 GO:0006779 IMP
      PMID:10498703 (UniProt); P74132 GO:0006783 heme biosynthetic process IMP PMID:20194361; P77915
      GO:0006783 IMP PMID:9767567; P73245 GO:0006783 IMP PMID:20194361; P32131 E. coli hemN has IBA and
      IEA only.'
    - Family review interpro/panther/PTHR13932/PTHR13932-review.yaml assesses this node TOO_DEEP and
      proposes the HemN SF6 node PTN000358335 (16 leaves) as the right placement.
    review_edited: false
    notes: Existing reason argues with the node placement and cites direct absence of coproporphyrinogen
      dehydrogenase activity in a HemW protein, so it was left unchanged. MOVE_IBD target given here is
      PTN000358280, the root child that contains every seed, which is the most that the seed positions
      alone license; the family review argues for the narrower PTN000358335 because two of the four seeds
      are HemW proteins whose mutant phenotypes need not reflect a biosynthetic step. Either placement
      takes the term off RSAD1.
- gene_file: genes/human/ARID4A/ARID4A-ai-review.yaml
  rows:
  - go_id: GO:0000976
    go_label: transcription cis-regulatory region binding
    family: PTHR13964
    ibd_node: PTN000359478
    tree_reading: >-
      IBD at the family root PTN000359478 (119 leaves, 45 species) with one seed, human ARID5B Q14865. The
      root splits into the fungal SWI1/sol1 clade PTN001017926 (14 leaves) and PTN001017882 (105 leaves),
      which is a Trichoplax leaf plus PTN000359480 (104 leaves). PTN000359480 has two children:
      PTN009015189 (51 leaves, the ARID5A/ARID5B clade, holding the seed; ARID5B lineage passes
      PTN009015192, 45 leaves) and PTN000359479 (53 leaves, the ARID4A/ARID4B clade, holding the target).
      ARID4A and ARID4B separate at PTN009015213 (41 leaves). The only seed is across the PTN000359480
      split from the target. No PAINT loss for the term in the family.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN009015189
    evidence_checked:
    - 'QuickGO by goId: Q14865 ARID5B GO:0000976 IDA PMID:21532585 (UniProt) is the only experimental
      annotation behind the node; P29374 ARID4A carries GO:0003677 IDA PMID:15640446 and the IBA only.'
    - 'QuickGO ontology: GO:0000976 is_a GO:1990837 sequence-specific double-stranded DNA binding and
      GO:0043565, so the term asserts sequence specificity.'
    - Gene review quotes PMID:15640446 and PMID:34506790 (ARID4A ARID domain binds DNA with no sequence
      preference); quotes are in the review and were not re-fetched.
    - Family review PTHR13964-review.yaml assesses the node TOO_DEEP with MOVE_IBD to PTN009015192.
    review_edited: false
    notes: Existing reason is node-aware (names PTN000359478 and the sole ARID5B seed) and rests on direct
      evidence of sequence-nonspecific binding by the target's ARID domain. Target node here is the
      ARID5 child of the split, PTN009015189; the family review names PTN009015192 (45 leaves) inside it.
- gene_file: genes/human/ARID4B/ARID4B-ai-review.yaml
  rows:
  - go_id: GO:0000976
    go_label: transcription cis-regulatory region binding
    family: PTHR13964
