      the bilaterian clade PTN000433866 (32 leaves) splits into the deuterostome clade PTN000433867 (24
      leaves, both seeds, which join at the mammalian node PTN000433874) and the protostome clade
      PTN002707184 (8 leaves, the target). No PAINT loss for the term on the lineage.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000433867
