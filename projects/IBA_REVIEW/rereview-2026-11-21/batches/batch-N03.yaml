- gene_file: genes/SCHPO/ccr1/ccr1-ai-review.yaml
  rows:
  - go_id: GO:0005829
    go_label: cytosol
    family: PTHR19384
    ibd_node: PTN000453956
    tree_reading: &cprtree >-
      IBD at the family root PTN000453956 (491 leaves, 112 species), 6 seeds (human MTRR Q9UBK8, NOS2
      P35228, NDOR1 Q9UHB4, POR P16435, yeast TAH18 SGD:S000006252, rat RGD:3185). Children: PTN008570778
      (18 leaves) and PTN000453763 (473 leaves, holding the target and the seeds read here). The
      microsomal CPR lineage is PTN000453822 (133 leaves): it splits into PTN001066031 (109 leaves,
      animal POR with the human POR seed, and the NOS clade) and PTN001066079 (24 leaves), in which the
      fungal CPR clade PTN002322168 (19 leaves) holds both S. pombe ccr1 and S. cerevisiae NCP1. MTRR,
      NDOR1 and TAH18 are in other branches of PTN008570781 (468 leaves). No PAINT loss for cytosol.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002322168
    evidence_checked:
    - 'QuickGO by goId GO:0005829: P16435 human POR IDA GO_REF:0000052 (HPA); Q12181 TAH18 IDA
      PMID:19194512; P36587 ccr1 IBA only.'
    - 'QuickGO by goId GO:0005783 with descendants: ccr1 GO:0005783 HDA PMID:16823372 and GO:0005789 ISS;
      NCP1 GO:0005789 EXP PMID:14562095 and PMID:9468503.'
    - genes/SCHPO/ccr1/ccr1-uniprot.txt has a transmembrane helix at 6..26 and the 27..678 domain
      cytoplasmic (HAMAP rule).
    - interpro/panther/PTHR19384/PTHR19384-review.yaml rates this node assertion UNRESOLVED and calls it a
      convention question, noting that human POR is itself a seed.
    review_edited: false
    notes: Upheld on the compartment ground that the fungal CPRs are anchored in the ER membrane, with direct
      evidence on the NCP1 ortholog in the same 19-leaf clade (soluble only when the anchor is deleted). This
      is the least clear-cut REMOVE in the batch. The catalytic domain does face the cytosol, the family
      review leaves the question open, and one seed (human POR, HPA immunofluorescence) is itself a
      membrane-anchored CPR. A curator who reads is_active_in cytosol as acceptable for a cytosol-facing
      anchored enzyme would mark the row over-annotated instead.
