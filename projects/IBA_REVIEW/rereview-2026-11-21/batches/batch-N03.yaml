- gene_file: genes/yeast/SSZ1/SSZ1-ai-review.yaml
  rows:
  - go_id: GO:0005634
    go_label: nucleus
    family: PTHR19375
    ibd_node: PTN002500132
    tree_reading: >-
      IBD at PTN002500132 (326 leaves, 50 species), 15 seeds. Children: PTN009039105 (269 leaves, animal
      Hsp70s, with the HSPA8 and HSPA1A seeds) and PTN001065099 (57 leaves, fungal), which holds the
      target. Inside PTN001065099 the clade PTN008364147 (55 leaves) holds the SSA proteins (seeds yeast
      SSA1 P10591 and S. pombe ssa1 and ssa2, under PTN001065100, 27 leaves), the SSB proteins and the
      Ssz1 clade PTN002321669 (12 leaves, with the target leaf PTN000453341 and S. pombe ssz1 P87142).
      PTN001065099 carries NOT IRD GO:0042026 protein refolding, and PTN002321669 carries IBDs for
      translational frameshifting and cytoplasmic translation; no loss for nucleus.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: KEEP_AS_NON_CORE
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO by goId GO:0005634 with descendants: P87142 S. pombe ssz1 HDA PMID:16823372 (PomBase),
      inside the Ssz1 clade; P38788 yeast SSZ1 IBA only; P32527 ZUO1 GO:0005730 IMP PMID:20368619 (the
      query shape returns hits).'
    - interpro/panther/PTHR19375/PTHR19375-review.yaml rates the PTN002500132 nucleus IBD SOUND.
    - Seed lineages read from the tree for P10591, Q10265, O59855, P11142, P0DMV8.
    review_edited: true
    notes: The earlier reason was that no Ssz1-specific evidence of nuclear residence exists and that Ssz1 is
      a specialised paralog. The node is seeded inside the target's own fungal clade and the fission yeast
      ortholog has an experimental nucleus annotation, so nothing supports a loss. Kept as a non-core
      location; the supported_by quote that called the row an over-annotation was removed. History record
      history/genes/yeast/SSZ1/2026-11-21T213037Z-claude-code-0f2df2.yaml.
  - go_id: GO:0016887
