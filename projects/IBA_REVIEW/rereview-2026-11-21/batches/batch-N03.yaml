    tree_reading: >-
      IBD at PTN000452648 (1707 leaves, 138 species), 22 seeds across bacterial DnaK and eukaryotic
      Hsp70s. Children: PTN000452649 (1542 leaves, holding the target) and PTN009039410 (165 leaves,
      DnaK). The target leaf PTN000453341 is in the Ssz1 clade PTN002321669 (12 leaves, 12 fungal
      species), under PTN001065099 (57 leaves), where PAINT already records NOT IRD GO:0042026 protein
      refolding. No loss for GO:0016887 on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002321669
    evidence_checked:
    - 'The gene review quotes PMID:17901048: "We now find that Ssz1 is not an ATPase in vitro" (the cached
      quote has a line break inside it).'
    - The IEA row on the same term is also REMOVE in the review; consistent.
    - Seed annotations not re-queried; the node is not in dispute for canonical Hsp70s.
    review_edited: false
    notes: Direct negative assay on the target. The loss is placed on the Ssz1 clade; the evidence in hand is
