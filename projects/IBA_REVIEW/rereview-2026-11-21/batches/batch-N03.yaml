genes:
- gene_file: genes/DROME/mam/mam-ai-review.yaml
  rows:
  - go_id: GO:0000775
    go_label: chromosome, centromeric region
    family: PTHR16431
    ibd_node: PTN001046424
    tree_reading: &mamtree >-
      IBD at the family root PTN001046424 (58 leaves, 35 species), 2 seeds (S. pombe mis18,
      PomBase:SPCC970.12, and mouse Mis18a, MGI:1913828). The root splits into PTN001046425 (55 leaves),
      which holds every MIS18A, OIP5 and fungal mis18 leaf and also the target, and PTN008564578 (3
      protist and algal leaves). The target leaf PTN004494011 sits in the two-leaf node PTN000338507
      (fly mam and Anopheles A7UVM2), inside PTN008564575 (3 leaves, with a Helobdella leaf), inside
      PTN004494007 (47 leaves). The seeds and the target are in the same child of the root, so the tree
      as drawn gives no topological reason to exclude the target; the problem is that the Mastermind
      sequence is a leaf of the Mis18 family at all. No PAINT loss for the term on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000338507
    evidence_checked:
    - genes/DROME/mam/mam-uniprot.txt carries Pfam PF09596 MamL-1 and InterPro IPR019082 Mastermind-like_N,
      PANTHER PTHR16431:SF1; no Mis18 or Yippee signature.
    - interpro/panther/PTHR16431/PTHR16431-review.yaml rates both node assertions NEEDS_PRUNING, says the
      dipteran Mastermind proteins have no Mis18 domain and that their placement is a classification
      artefact, and asks for an IRD or reclassification of the dipteran Mastermind clade.
    - Seed annotations not re-queried; the node is not in dispute for the Mis18 proteins.
    review_edited: false
    notes: Ground is that the target is not a Mis18 protein (domain architecture), i.e. a misplaced leaf, recorded
      here as target-specific divergence. Existing reason names the node, the seeds and the missing domain.
      Whether Anopheles A7UVM2 in PTN000338507 is also a Mastermind fragment was not checked; if it is not,
      the IRD belongs on the fly leaf PTN004494011 alone.
  - go_id: GO:0034080
    go_label: CENP-A containing chromatin assembly
    family: PTHR16431
    ibd_node: PTN001046424
    tree_reading: *mamtree
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000338507
    evidence_checked:
    - Same checks as the GO:0000775 row (same node, same two seeds, same family review assessment).
    review_edited: false
    notes: Same reasoning as GO:0000775.
- gene_file: genes/worm/vps-15/vps-15-ai-review.yaml
  rows:
  - go_id: GO:0004674
    go_label: protein serine/threonine kinase activity
    family: PTHR17583
    ibd_node: PTN000426471
    tree_reading: >-
      IBD at the family root PTN000426471 (118 leaves, 100 species), one seed, yeast VPS15
      (SGD:S000000301). The root splits into PTN007662609 (61 leaves, plants and protists) and
      PTN000426472 (57 leaves). The target leaf PTN000681367 is in the metazoan PIK3R4 clade PTN001049133
      (39 leaves, with human PIK3R4), under PTN000426473 (54 leaves), whose other child is the fungal
      Vps15 clade holding the seed (per the batch-H02 reading of the same node). No PAINT loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001049133
    evidence_checked:
    - 'QuickGO P22219 (yeast VPS15) by goId GO:0004674: IDA PMID:7989323 (SGD), plus IBA and IEA.'
    - The gene review quotes PMID:39913640 (human VPS15 pseudokinase domain binds GTP, no ATP or ADP
      detected) and the gene's own bioinformatics RESULTS.md (worm VPS-15 keeps the arginine gatekeeper,
      R101).
    - batch-H02 upheld the same row for human PIK3R4 with the same fix node.
    - No family review exists for PTHR17583.
    review_edited: false
    notes: The single seed is in the sister fungal clade and the structural evidence is on the metazoan clade
      the target belongs to, so the row also fits the misplaced-node pattern. The reason mentions that no
      worm kinase assay exists, but it rests on the conserved GTP-specific gatekeeper, not on that absence;
      left unchanged.
- gene_file: genes/DROME/rad50/rad50-ai-review.yaml
  rows:
  - go_id: GO:0007004
    go_label: telomere maintenance via telomerase
    family: PTHR18867
    ibd_node: PTN000429848
    tree_reading: >-
      IBD at the family root PTN000429848 (110 leaves, 89 species), one seed, human RAD50 (Q92878). The
      root splits into PTN000429849 (51 leaves, animals and fungi, holding both the seed and the target)
      and PTN007664302 (59 leaves, plants and protists). The target leaf PTN000429897 is in the two-leaf
      dipteran node PTN000429896 (fly and Anopheles), inside the arthropod node PTN001051202 (5 leaves)
      and the ecdysozoan node PTN000429892 (9 leaves). No PAINT loss for the term on the lineage.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000429896
    evidence_checked:
    - 'QuickGO Q92878 by goId GO:0007004: IDA PMID:9705271 (UniProt) plus the IBA. Q9W252 (fly rad50): IBA
      only.'
    - 'The gene review quotes PMID:15296751: "Since Drosophila telomeres are not added by a telomerase".'
    - No family review exists for PTHR18867.
    review_edited: false
    notes: The process does not exist in Drosophila (retrotransposon telomeres), so the term cannot apply.
      PTN000429896 is the smallest node holding the fly leaf with another dipteran; whether Anopheles and
      the other arthropods in PTN001051202 also lack telomerase was not checked, so the loss may belong
      on a different node.
- gene_file: genes/DROME/Septin2/Septin2-ai-review.yaml
  rows:
  - go_id: GO:0003924
    go_label: GTPase activity
    family: PTHR18884
    ibd_node: PTN000430171
    tree_reading: >-
      IBD at the family root PTN000430171 (540 leaves, 54 species), 5 seeds (fly pnut FBgn0013726 and
      Septin1 FBgn0011710, yeast CDC3 SGD:S000001149 and CDC10 SGD:S000000595, human SEPTIN4 O43236).
      The target leaf PTN000430528 is in PTN002706156 (10 leaves, with fly Septin5 and worm unc-61),
      inside PTN000430388 (110 leaves), which also holds human SEPTIN6. The fly and human seeds sit in
      the sister group PTN009034114 (164 leaves) under PTN009034072 (279 leaves); the yeast seeds branch
      deeper (PTN009034170 and PTN000430230). So no seed lies in the SEPT6-class clade PTN000430388. No
      PAINT loss for the term on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000430388
    evidence_checked:
    - 'The gene review holds an accepted NOT IDA row for GO:0003924 from PMID:25355953 and quotes it:
      "Sep2 protein, on the other hand, did not possess any noticeable GTPase activity (Table 1)."'
    - Seed lineages read from the tree for P40797 (pnut), P42207 (Septin1), O43236, P32457, P25342 and
      Q14141 (SEPTIN6).
    - No family review exists for PTHR18884.
    review_edited: false
    notes: Direct negative assay on the target. PTN000430388 is the clade that joins Sep2 with SEPTIN6; the
      evidence in hand is on fly Sep2 only, so a curator may prefer the smaller node PTN002706156. The IDA
      row on the same term from PMID:8636235 (whole-complex assay) is also REMOVE in the review; consistent.
- gene_file: genes/DROME/mle/mle-ai-review.yaml
  rows:
  - go_id: GO:0005730
    go_label: nucleolus
    family: PTHR18934
    ibd_node: PTN008360574
    tree_reading: >-
      IBD at PTN008360574 (40 leaves, 35 species), 2 seeds (human DHX9 Q08211 and mouse Dhx9
      MGI:108177). Children: PTN001053532 (34 leaves, animal DHX9/MLE, holding the target and both seeds)
