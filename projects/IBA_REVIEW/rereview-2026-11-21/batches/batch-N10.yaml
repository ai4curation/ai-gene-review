- gene_file: genes/POPTR/ndhD/ndhD-ai-review.yaml
  rows:
  - go_id: GO:0009060
    go_label: aerobic respiration
    family: PTHR43507
    ibd_node: PTN000511780
    tree_reading: >-
      IBD at the family root PTN000511780 (163 leaves, 92 species), three seeds: Drosophila mt:ND4
      (FB:FBgn0262952, P18931), human MT-ND4 (P03905) and E. coli nuoM (P0AFE8). Children: PTN008682297
      (30 leaves, bacterial nuoM, holds the E. coli seed) and PTN000511781 (133 leaves). Inside the
      latter, PTN001865568 (131 leaves) splits into PTN000511783 (44 leaves, mitochondrial ND4 of
      animals and fungi, holds the human and fly seeds) and PTN008682270 (87 leaves), which splits into
      PTN008682285 (28 leaves, plant mitochondrial nad4) and PTN008682271 (59 leaves). PTN008682271 is
      PTN008682278 (7 leaves, cyanobacterial ndhD plus one Klebsormidium leaf) plus PTN008682272 (52
      leaves, land plant plastid ndhD, holding the target). The plastid clade is unseeded. No PAINT
      loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008682272
    evidence_checked:
    - 'QuickGO by goId (descendants): P0AFE8 IMP PMID:9495756 (EcoCyc); P03905 IMP GO:0006120
      PMID:15250827, PMID:8344246, PMID:8644732 (UniProt); P18931 IDA GO:0006120 PMID:36952377
      (ComplexPortal); A4GYW6 only the IBA.'
    - The row quotes PMID:27066014 and PMID:28559282 and the gene's own OpenScientist report, which
      separates NDH plastoquinone reduction from the PTOX oxygen-consuming step.
    - interpro/panther/PTHR43507/PTHR43507-review.yaml rates this node UNRESOLVED for the term, citing
      chlororespiration, and withdrew an earlier IRD recommendation pending the ndhD adjudication that
      the gene review now cites.
    review_edited: false
    notes: >-
      Same action and same kind of target (the land plant plastid clade) as batch-06 took for
      POPTR ndhA on its own family node. The complex moved to the thylakoid photosynthetic chain with
      ferredoxin as donor. The family review still lists the node as UNRESOLVED because plastid NDH
      feeds chlororespiration; the gene review answered that question after the family review was
      written, so the family review is out of date on this point rather than in conflict. The
      cyanobacterial clade PTN008682278 is left outside the loss because cyanobacterial NDH-1 also
      serves respiration.
  - go_id: GO:0048039
    go_label: ubiquinone binding
    family: PTHR43507
    ibd_node: PTN000511780
    tree_reading: >-
      IBD at the family root PTN000511780 (163 leaves), one seed, E. coli nuoM (P0AFE8), in the
      bacterial child clade PTN008682297 (30 leaves). The target sits in the other child, PTN000511781
      (133 leaves), in the land plant plastid ndhD clade PTN008682272 (52 leaves), nested with
      cyanobacterial ndhD (PTN008682278, 7 leaves) inside PTN008682271 (59 leaves). No PAINT loss
      recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008682272
    evidence_checked:
    - 'QuickGO by goId: P0AFE8 GO:0048039 IDA PMID:12730198 (EcoCyc); the target has only the IBA.'
    - The row quotes PMID:39856350 that the plastoquinone pocket of spinach plastid NDH is formed by
      NdhA, NdhH and NdhK.
    - The family review rates the node UNRESOLVED for this term for the same reason the gene review
      gives.
    review_edited: false
    notes: >-
      The plastid complex reduces plastoquinone, and the structure places the quinone pocket away from
      NdhD, so ubiquinone binding does not hold for the plastid clade. The loss could arguably be
      placed one node up at PTN008682271 to take in the cyanobacterial leaves, which also use
      plastoquinone; that was not checked, so the plastid clade is named. Reason is node-aware; file
      left alone.
- gene_file: genes/PSEAE/mcpB/mcpB-ai-review.yaml
  rows:
  - go_id: GO:0005886
    go_label: plasma membrane
    family: PTHR43531
    ibd_node: PTN002079588
    tree_reading: >-
      IBD at PTN002079588 (76 leaves, 12 species), five seeds, all E. coli transmembrane chemoreceptors
      (P02942 tsr, P05704, P07017 tar, P07018 tap, P50466). The node has four children: PTN002079804
      (3 leaves, Bacillus cereus), PTN001280306 (6 leaves, Thermotoga), PTN001280280 (10 leaves,
      Leptospira) and PTN002079591 (57 leaves, 9 species), which holds both the E. coli seeds and the
      target. Inside it the target leaf PTN002460952 sits in PTN000788989 (37 leaves, 7 species). The
      family root PTN008110985 (83 leaves) lies one node above the IBD. No PAINT loss recorded for the
      term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002460952
    evidence_checked:
    - The row quotes PMID:14987771 (hydropathy plot shows no membrane-spanning regions in TlpG, a
      synonym of McpB) and PMID:21255112 (Aer-2 is a soluble haem-based sensor).
    - interpro/panther/PTHR43531/PTHR43531-review.yaml treats the plasma membrane IBD at PTN002079588
      as sound for the clade and names McpB as a single soluble exception inside it.
    - Seed locations were not re-queried; the five seeds are the canonical E. coli inner membrane
      chemoreceptors and the node placement is not in dispute.
    review_edited: false
    notes: >-
      Seeds and target share the 57-leaf clade, so this is a leaf-level loss of the membrane anchor,
      not a misplaced IBD. The reason ends with a sentence about absence of evidence, but its ground is
      the missing transmembrane segments and the soluble protein, which is direct evidence on the
      target, so the file was left alone.
- gene_file: genes/ARATH/SMXL6/SMXL6-ai-review.yaml
  rows:
  - &smxl
    go_id: GO:0044183
    go_label: protein folding chaperone
    family: PTHR43572
    ibd_node: PTN002461480
    tree_reading: >-
      IBD at the family root PTN002461480 (489 leaves, 55 species), one seed, M. tuberculosis ClpC1
      (P9WPC9), in the bacterial child clade PTN000181392 (17 leaves, ClpC/ClpE). The other child,
      PTN000181417 (472 leaves, 41 species), is eukaryotic and mostly plant. Inside it PTN005169834
      (467 leaves) has three children: PTN008682784 (52 leaves, plant ClpD), PTN008682785 (58 leaves,
      plant ClpC) and PTN008682795 (357 leaves), which carries its own nucleus IBD seeded by five Arabidopsis
      loci and rice D53 (Q2RBP2) and holds SMAX1, SMXL2, SMXL6, SMXL7, SMXL8 and D53. SMXL6 and
      SMXL7 share PTN000181326 (10 leaves); SMXL8 joins them at PTN002883034 (52 leaves). No PAINT loss
      recorded for the term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008682795
    evidence_checked:
    - 'QuickGO by goId: P9WPC9 GO:0044183 IMP PMID:19016865 (MTBBASE).'
    - Lineages of SMAX1 (Q9FHH2), SMXL2 (Q9M0C5), SMXL6, SMXL7 and SMXL8 read with a helper over the
      cached tree; all meet at or below PTN002883039 (353 leaves) inside PTN008682795.
    - The row quotes PMID:26546446 on TPR2-dependent transcriptional repression by the D53-like SMXLs.
    review_edited: false
    notes: >-
      The SMAX1/SMXL/D53 clade is a neofunctionalised paralog clade of the plastid ClpC/ClpD
      chaperones: nuclear EAR-motif co-repressors that are themselves substrates of SCF(MAX2). The
      reason mixes this divergence argument with a statement that no chaperone activity has been shown,
      which alone would not be a ground; the divergence argument carries it. The evidence of loss is
      the change of role and compartment, not a negative chaperone assay. The IRD target is the whole
      clade under the nucleus IBD, PTN008682795, which also takes in four Physcomitrella leaves
      (PTN005170402). No interpro/panther/PTHR43572 review exists.
