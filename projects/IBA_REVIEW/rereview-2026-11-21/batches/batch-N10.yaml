genes:
- gene_file: genes/yeast/ARO10/ARO10-ai-review.yaml
  rows:
  - go_id: GO:0004737
    go_label: pyruvate decarboxylase activity
    family: PTHR43452
    ibd_node: PTN008451158
    tree_reading: >-
      IBD at the family root PTN008451158 (247 leaves, 60 species), three seeds, all S. cerevisiae:
      PDC1 (SGD:S000004034, P06169), PDC5 (SGD:S000004124, P16467) and PDC6 (SGD:S000003319, P26263).
      The target and the seeds share the ancestor PTN000438914 (14 leaves, 4 yeast species), whose two
      children are PTN001056939 (4 leaves: ARO10 of S. cerevisiae, Eremothecium, Candida albicans and a
      Yarrowia leaf) and PTN001056943 (10 leaves: PDC1, PDC5, PDC6, THI3 and their Eremothecium, Candida
      and Yarrowia relatives). So the seeds sit in the sister clade across a duplication. PAINT already
      records a loss of this term (NOT IRD) on the THI3 leaf PTN000438920 in the seeded clade; no loss is
      recorded on the ARO10 branch.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001056939
    evidence_checked:
    - 'QuickGO by goId (descendants): PDC1 P06169 IDA PMID:23423327 and PMID:2404950; PDC5 P16467 IDA
      PMID:2185016 and PMID:23423327; PDC6 P26263 IMP PMID:1744053 and IDA PMID:23423327 (all SGD). ARO10
      Q06408 carries only the IBA and a Rhea IEA.'
    - The row quotes PMID:22904058 that Aro10 cannot decarboxylate pyruvate and that only Pdc1, Pdc5 and
      Pdc6 decarboxylated pyruvate in cell extracts.
    - interpro/panther/PTHR43452/PTHR43452-review.yaml says the same of this node and asks for an IRD on
      the ARO10 branch; it names no node.
    review_edited: false
    notes: >-
      Direct experimental evidence of loss on the target. The reason is short and names no node but
      states the real ground, so the file was left alone. The loss is shown for S. cerevisiae Aro10
      only; PTN001056939 is the ARO10 ortholog clade, and the conservative alternative is the leaf
      PTN000438916, as PAINT did for THI3.
- gene_file: genes/ECOLI/gyrA/gyrA-ai-review.yaml
  rows:
  - &atp
    go_id: GO:0005524
    go_label: ATP binding
    family: PTHR43493
    ibd_node: PTN001607041
    tree_reading: >-
      IBD at the family root PTN001607041 (105 leaves, 75 species), two seeds: M. tuberculosis GyrA
      (P9WG47) and P. falciparum apicoplast gyrase A (Q8I0X3). Children: PTN001607042 (7 leaves,
      Daphnia, Plasmodium, Thalassiosira, Chlamydomonas, Halobacterium; holds the Plasmodium seed) and
      PTN000018855 (98 leaves, 70 species; bacterial GyrA and ParC and plant organellar GYRA; holds the
      M. tuberculosis seed and the target). The whole family is the type IIA topoisomerase A subunit
      (GyrA/ParC). No PAINT loss recorded for the term.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001607041
    evidence_checked:
    - 'QuickGO by goId: P9WG47 GO:0005524 IDA PMID:11266418 (MTBBASE); Q8I0X3 IDA PMID:17220464 (GeneDB);
      E. coli gyrA P0AES4, E. coli parC P0AFI2 and P. aeruginosa parC Q9HUK1 carry only IBA and IEA rows.'
    - publications/PMID_11266418.md (abstract only) measures quinolone inhibition of the supercoiling
      activity of reconstituted M. tuberculosis gyrase; it describes no ATP-binding assay on GyrA.
    - PubMed abstract of PMID:17220464 (doi 10.1128/EC.00357-06) reports intrinsic ATPase activity of
      PfGyrB and DNA cleavage with the N-terminal domain of PfGyrA; the ATP-handling subunit it
      describes is GyrB.
    review_edited: false
    notes: >-
      Both seed annotations read, from their abstracts, as holoenzyme or B-subunit results placed on
      the A subunit. The full texts were not read, so the seed defect is PROBABLE, not confirmed. The
      ATP-binding GHKL domain of gyrase and topoisomerase IV lies in the B subunit (GyrB/ParE), which
      is a separate family. The existing reason states this subunit argument and cites the node, so
      the file was left alone. No interpro/panther/PTHR43493 review exists.
