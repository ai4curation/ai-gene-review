- gene_file: genes/PSEAE/PA4178/PA4178-ai-review.yaml
  rows:
  - go_id: GO:0006744
    go_label: ubiquinone biosynthetic process
    family: PTHR43591
    ibd_node: PTN001297884
    tree_reading: &pa4178tree >-
      IBD at PTN001297884 (136 leaves, 108 species), the UbiE/COQ5 clade inside the 655-leaf
      methyltransferase family. Children: PTN005171867 (121 leaves, eukaryotic COQ5, holding the
      human, yeast, fly, worm and fission yeast seeds), PTN009171051 (12 leaves, gammaproteobacteria)
      and three single ubiE leaves. PTN009171051 splits into PTN000010544 (10 leaves, ubiE, holding the
      E. coli seed P0A887 and P. aeruginosa's own ubiE Q9HUC0) and PTN005171939 (2 leaves: PA4178 and
      Shewanella SO_4069). So PA4178 is a paralog branch beside the gammaproteobacterial ubiE clade,
      in a species that keeps a separate ubiE. No PAINT loss recorded for either term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN005171939
    evidence_checked:
    - The row quotes PMID:26677219 that EftM exclusively methylates lysine 5 of EF-Tu.
    - Lineages of PA4178, E. coli ubiE P0A887, human COQ5 Q5HYK3 and yeast COQ5 P49017 read with a
      helper over the cached tree.
    - interpro/panther/PTHR43591/PTHR43591-review.yaml assesses the node's two IBDs for the SF24
      UbiE/COQ5 members and does not mention PA4178.
    review_edited: false
    notes: >-
      The existing source_defects entry says the tree was not inspected. It now has been: PA4178 is
      inside the IBD node, on a two-leaf paralog branch, so the fix is a loss on that branch
      (PTN005171939) and not a re-placement of the gene. The Shewanella partner leaf is
      uncharacterised; the conservative alternative is the leaf PTN002226945. The written reason does
      not misstate the tree and was left alone.
  - go_id: GO:0008425
    go_label: 2-methoxy-6-polyprenyl-1,4-benzoquinol methyltransferase activity
    family: PTHR43591
    ibd_node: PTN001297884
    tree_reading: *pa4178tree
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN005171939
    evidence_checked:
    - 'Seeds of this IBD read from the tree: SGD:S000004578 (yeast COQ5), Q5HYK3 (human COQ5) and
      P0A887 (E. coli UbiE); seed annotations were not re-queried because the node is not in dispute.'
    - The row quotes PMID:26677219 that EftM exclusively methylates lysine 5 of EF-Tu.
    review_edited: false
    notes: Same branch and same fix as the GO:0006744 row. Reason is brief but states the divergence.
- gene_file: genes/SCHPO/SPBC3H7.04/SPBC3H7.04-ai-review.yaml
  rows:
  - go_id: GO:0005737
    go_label: cytoplasm
    family: PTHR43595
    ibd_node: PTN002461864
    tree_reading: >-
      IBD at the family root PTN002461864 (58 leaves, 37 species), five seeds. Children: PTN000150211
      (20 leaves, bacterial SodA, holding E. coli P00448 and B. subtilis P54375) and PTN002461865 (38
      leaves, eukaryotic and archaeal, holding the target). The other three seeds are in the target's
      own fungal clade PTN000150161 (17 leaves): S. cerevisiae RSM26 (SGD:S000003862, P47141) and MRP1
      (SGD:S000002755, P10662) and N. crassa NCU07386 (Q7S2H6). The target's nearest relative is its
      S. pombe paralog SPBC16A3.14 at PTN001685679 (4 leaves). No PAINT loss recorded.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MODIFY
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO by goId GO:0005737 with descendants: RSM26 P47141 and MRP1 P10662 carry GO:0005739
      mitochondrion (HDA PMID:16823961, PMID:24769239) and GO:0005763 mitochondrial small ribosomal
      subunit (IDA PMID:11278769); N. crassa Q7S2H6 carries GO:0005739 (EXP PMID:33056988); B. subtilis
      P54375 carries GO:0005737 (EXP); E. coli P00448 carries GO:0005737 (IDA).'
    - 'QuickGO ancestors of GO:0005739 over is_a and part_of include GO:0005737: the mitochondrion is
      part of the cytoplasm.'
    - UniProt cross-references confirm SGD:S000003862 is RSM26 (P47141) and SGD:S000002755 is MRP1
      (P10662), not SOD2.
    review_edited: true
    notes: >-
      The earlier REMOVE rested on two errors: that the seeds were superoxide dismutase paralogs
      (three of five are mitoribosomal proteins in the target's own clade) and that mitochondrion is
      not under cytoplasm in GO (it is, by part_of). The term is true but general, so the row is now
      MODIFY to GO:0005763 mitochondrial small ribosomal subunit, which the clade seeds support by IDA
      and the review already accepts on its NAS and ISO rows. PAINT's root IBD is not wrong; a more
      specific mitochondrion IBD at PTN000150161 would serve the fungal clade better, but that is an
      addition the paint_action vocabulary does not cover.
- gene_file: genes/BACSU/ytcI/ytcI-ai-review.yaml
  rows:
  - &fas
    go_id: GO:0004321
    go_label: fatty-acyl-CoA synthase activity
    family: PTHR43605
    ibd_node: PTN001944787
    tree_reading: >-
      IBD at the family root PTN001944787 (94 leaves, 34 species), dated 20170228, one seed, rat Acsm4
      (RGD:727928, Q7TN78). Children: PTN008683228 (5 leaves, Dictyostelium and Sulfolobus) and
      PTN008683229 (89 leaves, 31 species), which holds B. subtilis ytcI (leaf PTN000644730) and the
      mammalian ACSM clades, including the rat seed leaf PTN000644674 and mouse Acsm4 PTN000644673
      (sisters under PTN000644672). The same root carries GO:0015645 fatty acid ligase activity with
      8 seeds. No PAINT loss recorded.
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN001944787
    evidence_checked:
    - 'QuickGO by goId: rat Acsm4 Q7TN78 GO:0004321 enables IDA PMID:12709059 (RGD), plus the IBA.'
    - The rows quote PMID:12709059 that recombinant O-MACS showed acyl-CoA synthetase activity for
      fatty acid activation, the ligase reaction (EC 6.2.1), not the EC 2.3.1.86 fatty acid synthase
      reaction the term defines.
    review_edited: false
    notes: >-
      Same action and PAINT fix as batch-H04 took for human ACSM4 on this node. The reasons are
      node-aware and a source_defects entry is already filed; nothing to change.
- gene_file: genes/mouse/Acsm4/Acsm4-ai-review.yaml
  rows:
  - *fas
- gene_file: genes/rat/Acsm4/Acsm4-ai-review.yaml
  rows:
  - <<: *fas
    notes: >-
      Rat Acsm4 is itself the only seed (RGD:727928 is Q7TN78; the treeview seed flag reads False
      because it matches UniProt accessions only). The IBA and the IDA row it rests on were judged
      together: the review removes both, with an RGD source defect on the IDA row and a GO_CENTRAL
      defect on the IBD. Same action and PAINT fix as batch-H04 took for human ACSM4.
- gene_file: genes/POPTR/atpB/atpB-ai-review.yaml
  rows:
  - go_id: GO:0000325
    go_label: plant-type vacuole
    family: PTHR43607
    ibd_node: PTN000389877
    tree_reading: >-
      The gene's UniProt family is PTHR15184 (ATP synthase), where A4GYR7 is not a leaf. The IBA comes
      from PTHR43607 (166 leaves, V-type ATPase catalytic subunit A family), where a leaf labelled
      atpB|A4GYR7 (PTN001807779) sits in the Populus-only node PTN008683261 (5 leaves) beside four
      nuclear poplar loci (POPTR_010G116600, POPTR_010G253500, POPTR_008G126600, POPTR_008G005000).
      The IBD is at PTN000389877 (77 leaves, 40 species, plant V-ATPase subunit A plus one
      Chlamydomonas leaf), one seed, cotton V-ATPase catalytic subunit A (P31405). No PAINT loss
      recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO by goId with descendants: P31405 carries GO:0009705 plant-type vacuole membrane IDA
      PMID:9536073 (AgBase). A4GYR7 returned no row for the term in QuickGO at the time of the query.'
    - genes/POPTR/atpB/atpB-uniprot.txt gives the PANTHER cross-reference PTHR15184:SF71 and the
      chloroplast thylakoid membrane location; the record is the 498-residue plastid-encoded CF1 beta
      subunit.
    - batches/withdrawn-upstream.yaml already lists this gene's GO:0005774 row as withdrawn because
      A4GYR7 is not a leaf of PTHR15184.
    review_edited: false
    notes: >-
      None of the four grounds fits cleanly. The seed and the node are sound for V-ATPase subunit A.
      The fault is that a leaf of the V-ATPase A tree carries the accession of the chloroplast F1 beta
      subunit, so the plastid protein inherits a vacuolar location; TARGET_LOSS is recorded as the
      nearest ground because the target's own compartment excludes the ancestral one. No PAINT node
      change is asked for: the fix is in the PANTHER leaf-to-accession mapping for PTN001807779, which
      should be checked. The same mapping gives this gene its other IBA rows from PTHR43607
      (GO:0046961, GO:1902600), which the review keeps and which were outside this batch. The written
      reason is correct as far as it goes and was left alone.
- gene_file: genes/ARATH/FTSH12__Q9SAJ3/FTSH12__Q9SAJ3-ai-review.yaml
  rows:
  - go_id: GO:0005745
    go_label: m-AAA complex
    family: PTHR43655
    ibd_node: PTN000554085
    tree_reading: &ftshtree >-
      IBD at PTN000554085 (263 leaves, 98 species), two nodes below the family root. Children:
      PTN000554086 (107 leaves, 52 species), which holds every human, mouse, fly, worm and
      S. cerevisiae leaf of the family and so all seeds (AFG3L2 Q9Y4W6, SPG7 Q9UQ90, yeast AFG3 and
      YTA12, and the mouse, fly and worm orthologs), and PTN008115526 (156 leaves, 46 species:
      kinetoplastid, alveolate and plant), which holds the target. Inside the latter, PTN002462659
      (134 leaves) splits into PTN001130034 (33 leaves, land plant FTSH12 orthologs plus a Marchantia
      leaf) and PTN001130038 (101 leaves, plant mitochondrial FTSH3/FTSH10 type). No PAINT loss
      recorded for either term.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001130034
    evidence_checked:
    - Species filter over the cached tree confirmed that every leaf from the seed species lies in
      PTN000554086; lineages of FTSH12, AFG3L2, SPG7, yeast AFG3 and YTA12, and Arabidopsis FTSH3 and
      FTSH10 read with a helper.
    - The row quotes PMID:33216923 (FtsH12 in the inner chloroplast envelope) and PMID:30309901
      (stable 2-MD Ycf2/FtsHi complex).
    - interpro/panther/PTHR43655/PTHR43655-review.yaml covers FTSH12 terms but has no assessment of
      this node for the term.
    review_edited: true
    notes: >-
      Action unchanged. The reason was rewritten because it placed FTSH12 outside the mitochondrial
      m-AAA lineage, while the PANTHER tree puts the FTSH12 clade as sister to the plant mitochondrial
      FTSH3/FTSH10 clade. The plastid-origin statement is now attributed to PMID:30309901 and the tree
      placement is stated beside it. The seeds are confined to the opisthokont child, so a MOVE_IBD to
      PTN000554086 would also remove the term from the plant mitochondrial m-AAA proteases, which
      probably deserve it; a loss at the FTSH12 clade is the narrower fix.
  - go_id: GO:0034982
    go_label: mitochondrial protein processing
    family: PTHR43655
