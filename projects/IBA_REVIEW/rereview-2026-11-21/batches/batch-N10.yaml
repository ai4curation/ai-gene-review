- gene_file: genes/POPTR/ndhD/ndhD-ai-review.yaml
  rows:
  - go_id: GO:0009060
    go_label: aerobic respiration
    family: PTHR43507
    ibd_node: PTN000511780
    tree_reading: >-
      IBD at the family root PTN000511780 (163 leaves, 92 species), three seeds: Drosophila mt:ND4
      (FB:FBgn0262952, P18931), human MT-ND4 (P03905) and E. coli nuoM (P0AFE8). Children: PTN008682297
      (30 leaves, bacterial nuoM, holds the E. coli seed) and PTN000511781 (133 leaves). Inside the
      latter, PTN001865568 (131 leaves) splits into PTN000511783 (44 leaves, mitochondrial ND4 of
      animals and fungi, holds the human and fly seeds) and PTN008682270 (87 leaves), which splits into
      PTN008682285 (28 leaves, plant mitochondrial nad4) and PTN008682271 (59 leaves). PTN008682271 is
      PTN008682278 (7 leaves, cyanobacterial ndhD plus one Klebsormidium leaf) plus PTN008682272 (52
      leaves, land plant plastid ndhD, holding the target). The plastid clade is unseeded. No PAINT
      loss recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008682272
    evidence_checked:
    - 'QuickGO by goId (descendants): P0AFE8 IMP PMID:9495756 (EcoCyc); P03905 IMP GO:0006120
      PMID:15250827, PMID:8344246, PMID:8644732 (UniProt); P18931 IDA GO:0006120 PMID:36952377
      (ComplexPortal); A4GYW6 only the IBA.'
    - The row quotes PMID:27066014 and PMID:28559282 and the gene's own OpenScientist report, which
      separates NDH plastoquinone reduction from the PTOX oxygen-consuming step.
    - interpro/panther/PTHR43507/PTHR43507-review.yaml rates this node UNRESOLVED for the term, citing
      chlororespiration, and withdrew an earlier IRD recommendation pending the ndhD adjudication that
      the gene review now cites.
    review_edited: false
    notes: >-
      Same action and same kind of target (the land plant plastid clade) as batch-06 took for
      POPTR ndhA on its own family node. The complex moved to the thylakoid photosynthetic chain with
      ferredoxin as donor. The family review still lists the node as UNRESOLVED because plastid NDH
      feeds chlororespiration; the gene review answered that question after the family review was
      written, so the family review is out of date on this point rather than in conflict. The
      cyanobacterial clade PTN008682278 is left outside the loss because cyanobacterial NDH-1 also
      serves respiration.
  - go_id: GO:0048039
    go_label: ubiquinone binding
    family: PTHR43507
    ibd_node: PTN000511780
    tree_reading: >-
      IBD at the family root PTN000511780 (163 leaves), one seed, E. coli nuoM (P0AFE8), in the
      bacterial child clade PTN008682297 (30 leaves). The target sits in the other child, PTN000511781
      (133 leaves), in the land plant plastid ndhD clade PTN008682272 (52 leaves), nested with
      cyanobacterial ndhD (PTN008682278, 7 leaves) inside PTN008682271 (59 leaves). No PAINT loss
      recorded.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008682272
    evidence_checked:
    - 'QuickGO by goId: P0AFE8 GO:0048039 IDA PMID:12730198 (EcoCyc); the target has only the IBA.'
    - The row quotes PMID:39856350 that the plastoquinone pocket of spinach plastid NDH is formed by
      NdhA, NdhH and NdhK.
    - The family review rates the node UNRESOLVED for this term for the same reason the gene review
      gives.
    review_edited: false
    notes: >-
      The plastid complex reduces plastoquinone, and the structure places the quinone pocket away from
      NdhD, so ubiquinone binding does not hold for the plastid clade. The loss could arguably be
      placed one node up at PTN008682271 to take in the cyanobacterial leaves, which also use
      plastoquinone; that was not checked, so the plastid clade is named. Reason is node-aware; file
      left alone.
