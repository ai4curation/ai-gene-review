- gene_file: genes/yeast/GDH2/GDH2-ai-review.yaml
  rows:
  - go_id: GO:0005739
    go_label: mitochondrion
    family: PTHR11606
    ibd_node: PTN000176229
    tree_reading: 'The IBD sits at PTN000176229 (243 leaves, 100 species) with 8 seeds. It has three child
      clades: PTN000176232 (69 leaves, animal GLUD clade, holding the human GLUD1/GLUD2, mouse Glud1 and
      two Drosophila seeds), PTN008521670 (6 leaves, no seed) and PTN008521671 (168 leaves), which holds
      the target together with the two Arabidopsis seeds (AT5G07440, AT5G18170) and the Trypanosoma brucei
      seed Q38EX6. Seeds therefore sit on both sides of the node and the placement is sound by descent.
      Inside PTN008521671 the target is in PTN000176374 (17 leaves: Monosiga, 14 fungi including S. cerevisiae
      GDH2, C. albicans GDH2, S. pombe gdh2 and N. crassa gdh-1, and two Dictyostelium glud2), which holds
      no seed for this term. No PAINT loss for the term is recorded on the lineage.'
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
    evidence_checked:
    - 'QuickGO P33327,A0A1D8PI00,Q9USN5,P00365,Q38EX6,P00367 GO:0005739 with descendants (25 hits): GLUD1
      IDA from PMID:15578726 and PMID:19448744 plus HPA; Q38EX6 IDA from PMID:18242729 (GeneDB); yeast
      GDH2 two HDA located_in rows (PMID:14576278, PMID:16823961, SGD); S. pombe gdh2 only an IC mitochondrial
      matrix row; C. albicans and N. crassa only the IBA.'
    - 'QuickGO A0A1D8PI00 all annotations: CGD IDA located_in cytosol (PMID:34460867) and cytoplasm (PMID:37917600);
      no experimental mitochondrion row.'
    - 'Gene review: IDA cytosol row from PMID:6343120 (abstract-only), two HDA mitochondrion rows already
      KEEP_AS_NON_CORE.'
    - Family review PTHR11606 assesses the node UNRESOLVED and notes that S. pombe gdh2 keeps the row
      as non-core.
    - publications/PMID_14576278.md and PMID_16823961.md are abstract-only; the proteome tables were not
      read.
    review_edited: true
    notes: The earlier reason rested on a lineage claim plus 'no target evidence for activity in mitochondria'.
      The fungal subclade is experimentally cytosolic in two species, but the same review keeps two independent
      mitochondrial proteome detections of Gdh2 on this term, so loss of the organelle location is not
      shown and REMOVE conflicted with those rows. Changed to KEEP_AS_NON_CORE (root organelle policy,
      same-term consistency), with the is_active_in qualifier named as the unproven part. An IRD at PTN000176374
      would need the HDA detections to be resolved first. The PTHR11606 family review prose still says
      this review removes the row; not edited.
- gene_file: genes/rat/Pnlip/Pnlip-ai-review.yaml
  rows:
  - go_id: GO:0006633
    go_label: fatty acid biosynthetic process
    family: PTHR11610
    ibd_node: PTN000906454
    tree_reading: The IBD sits at PTN000906454 (147 leaves, 20 species) with 3 seeds. Its four child clades
      are PTN002614064 (21 leaves, LIPC; seed human LIPC P11150), PTN002614080 (21 leaves, LIPG; no seed),
      PTN002614072 (27 leaves, LPL; seeds human LPL P06858 and bovine LPL P11151) and PTN002613997 (78
      leaves, the pancreatic lipase clade PNLIP, PNLIPRP1, PNLIPRP2, PNLIPRP3), which holds the target
      and no seed. No PAINT loss for the term on the lineage.
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: REMOVE_IBD
      target_node_id: PTN000906454
    evidence_checked:
    - 'QuickGO P06858,P11150,P11151,P27657,P11152,Q06000 GO:0006633 (14 hits): human LPL IDA PMID:182536
      and IC PMID:3973011 (BHF-UCL); human LIPC IDA PMID:182536; bovine LPL IDA PMID:18635818; rat Pnlip
      only the IBA.'
    - 'publications/PMID_182536.md, PMID_18635818.md, PMID_3973011.md: all abstract-only; titles and abstracts
      describe postheparin hepatic lipase and LPL lipolysis assays (VLDL triglyceride hydrolysis), no
      biosynthesis assay is described in what is cached. Full text not read.'
    - Family review PTHR11610 assesses this node WRONG_NODE (the seeds show fatty acid release, not biosynthesis)
      and scopes the term NOT_APPLICABLE family-wide.
    review_edited: false
    notes: Stated against the tree, the seeds are confined to the vascular LPL and LIPC clades and the
      target's digestive clade PTN002613997 has none, across the duplication at PTN000906454; the term
      is wrong for a luminal triglyceride hydrolase. The existing reason goes further and calls the seeds
      themselves over-scoped (lipolytic release read as biosynthesis), in line with the family review;
      that is a suspected BAD_SEED which I could only check at abstract level, so REMOVE_IBD is the family
      review's fix, and the minimum fix is restricting the IBD to PTN002614072 and PTN002614064. Reason
      left as written.
  - go_id: GO:0004465
    go_label: lipoprotein lipase activity
    family: PTHR11610
    ibd_node: PTN000906454
    tree_reading: 'The IBD sits at PTN000906454 (147 leaves) with 4 seeds: mouse Lpl, rat Lpl, human LPL
      P06858 and bovine LPL P11151, all in the child clade PTN002614072 (27 leaves, LPL). The target is
      in a different child, PTN002613997 (78 leaves, pancreatic lipases). The other two children, PTN002614064
      (LIPC) and PTN002614080 (LIPG), hold no seed.'
    ground: MISPLACED_IBD
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN002614072
    evidence_checked:
    - 'QuickGO P06858,P11150,P11151,P27657,P11152,Q06000,P16233 GO:0004465 (34 hits): multiple IDA/IMP
      rows on human, bovine, mouse and rat LPL; LIPC, human PNLIP and rat Pnlip carry only the IBA.'
    - Family review PTHR11610 assesses the node TOO_DEEP and scopes the term to SF3 (LPL) only.
    review_edited: false
    notes: All four seeds are LPL orthologs in one child clade; the activity is defined on lipoprotein-borne
      triglyceride. The existing reason names the node and the LPL-only seeds; left alone.
