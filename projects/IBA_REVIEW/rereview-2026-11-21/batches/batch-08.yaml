  - go_id: GO:0016812
    go_label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in cyclic amides
    family: PTHR11647
    ibd_node: PTN000182670
    tree_reading: 'The IBD sits at PTN000182670 (229 leaves, 85 species) with 9 seeds: E. coli hyuA Q46806
      in PTN007521671 (6 leaves) and eight in PTN004281511 (220 leaves): human, mouse and rat DPYS, Arabidopsis
      PYD2, Dictyostelium pyd2, Drosophila CRMP and C. elegans dhp-1 and dhp-2. Below it PTN000182450
      (213 leaves) carries the IBDs for dihydropyrimidinase activity and pyrimidine nucleobase catabolism.
      The vertebrate CRMP/DPYSL paralogs sit under PTN008326282 (130 leaves, 20 species), which has no
      seed for the term. The target''s own clade PTN002616339 (21 leaves) already carries PAINT NOT IKR
      losses for GO:0004157 dihydropyrimidinase activity and GO:0006208, but no loss for the parent term
      GO:0016812, which is why it still propagates.'
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IKR
      target_node_id: PTN002616339
    evidence_checked:
    - 'treeview lineage: NOT IKR GO:0004157 and NOT IKR GO:0006208 at PTN002616339.'
    - Family review PTHR11647 assesses the GO:0016812 node NEEDS_PRUNING for the same reason (PAINT negates
      only the specific dihydropyrimidinase term in the CRMP clades).
    - Review row quotes the UniProt CAUTION (lacks conserved metal-binding residues), PMID:28044206 (CRMPs
      have lost the enzymatic active site) and PMID:23373749 (CRMP-5 has no detectable amidohydrolase
      activity); not re-read here.
    - Seed annotations not re-queried in QuickGO; they are dihydropyrimidinases and a hydantoinase and
      are not disputed.
    review_edited: false
