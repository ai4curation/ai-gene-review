      12 seeds: SLC6A5, SLC6A7, SLC6A9, SLC6A14, fly NAAT1 and Ntl) and PTN007519465 (192 leaves, holding
      the target; 4 seeds, all GABA transporter 1: human, mouse and rat SLC6A1 and C. elegans snf-11).
      Those four seeds all sit in PTN008325658 (69 leaves) under PTN004278412 (173 leaves); its sister
      clades there are the SERT clade PTN002481010 (42 leaves), PTN008975219 (21 leaves, SLC6A3), PTN000746001
      (35 leaves, carrying the dopamine:sodium symporter IBD and holding SLC6A2 under PTN000178374) and
      PTN008975218 (6 leaves), none with a seed for this term. The target SLC6A2 is in PTN000178374 (25
      leaves, norepinephrine:sodium symporter IBD).'
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000746001
    evidence_checked: &id001
    - 'QuickGO P30531,P23975,Q01959,P31645 GO:0006865 with descendants (18 hits): SLC6A1 has GABA transport
      rows (GO:0051939 IDA PMID:10973981; GO:0005332 IDA/IMP) which are descendants of the term; SLC6A2,
      SLC6A3 and SLC6A4 carry only the IBA.'
    - MOD seed ids were resolved to tree leaves through UniProt cross-references (all 34 mapped).
    - No family review exists for PTHR11616.
    review_edited: false
    notes: Within the target's 192-leaf child the only seeds are GABA transporters (GABA counts as an
      amino acid in GO); the monoamine transporter clades are a neofunctionalised branch whose substrates
      are biogenic amines. PTN000746001 is the catecholamine transporter node (NET plus the 10-leaf sister
      PTN002614337) and already carries PAINT's dopamine:sodium symporter IBD. The reason names the node
      and the divergence; its closing 'no experimental evidence' clause is secondary. Left alone.
