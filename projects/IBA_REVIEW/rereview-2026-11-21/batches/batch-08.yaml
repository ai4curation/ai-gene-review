  - go_id: GO:0030350
    go_label: iron-responsive element binding
    family: PTHR11670
    ibd_node: PTN000186700
    tree_reading: The IBD sits at the family root PTN000186700 (245 leaves, 102 species) with 9 seeds.
      Eight (human, mouse, rat ACO1 and IREB2, bovine ACO1, Drosophila Irp-1A) are in the child PTN000186701
      (222 leaves), all within PTN000186704 (55 leaves, the animal IRP clade); the 160-leaf clade PTN007525311
      beside it has no seed. The ninth seed, M. tuberculosis Acn O53166, is in the other child PTN008523494
      (23 leaves) > PTN000186788 (22) > PTN007525429 (8 leaves), a sister of PTN002268880 (12 leaves)
      that holds the target. PTN002268880 and the AcnD subclade PTN002617363 hold no seed. PAINT records
      NOT IRD losses for this term elsewhere in the family (PTN000186764 C. elegans, PTN000186767 Drosophila),
      per the family review.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: MOVE_IBD
      target_node_id: PTN000186704
    evidence_checked:
    - 'QuickGO O53166,Q8EJW3,P21399 GO:0030350 with descendants (8 hits): M. tuberculosis Acn IDA PMID:17384188
      (MTBBASE); human ACO1 IDA/IMP; AcnD only the IBA.'
    - 'PubMed abstract of PMID:17384188 fetched: apo-Acn binds mammalian IRE-like sequences and predicted
      IRE-like sequences in M. tuberculosis trxC and ideR UTRs in gel shifts.'
    - 'GO:0030350 definition from QuickGO: binding to an iron-responsive element, a regulatory sequence
      in the UTRs of mRNAs encoding many iron-binding proteins.'
    - Family review PTHR11670 assesses the node TOO_DEEP (gain belongs at the eukaryotic IRP clade) and
      does not discuss the M. tuberculosis seed.
    - 'Sibling reviews: genes/ECOLI/acnA and genes/SALTY/acnA both MODIFY this IBA to GO:0003730 mRNA
      3''-UTR binding.'
    review_edited: true
    notes: REMOVE did not hold. The stated grounds were absence of RNA-binding data on AcnD (not a ground)
      and that IREs are eukaryotic, which overlooks the bacterial seed in a sister clade and the documented
      apo-AcnA RNA binding in proteobacteria. Catalytic divergence of AcnD does not show loss of apo-protein
      RNA binding, and nothing tests it. The term is plausible, unverified, and placed too deep, so MARK_AS_OVER_ANNOTATED;
      MODIFY to GO:0003730 as in the acnA reviews was not used because AcnD has no RNA-binding evidence
      of its own. Proposed PAINT fix follows the family review (move to the animal IRP clade); the M.
      tuberculosis seed would then need its own narrower record or a different term. The PTHR11670 family
      review prose still says this review removes the term; not edited.
