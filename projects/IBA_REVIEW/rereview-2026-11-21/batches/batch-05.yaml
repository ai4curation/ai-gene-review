      of PTN000129522 are also dsRBD-only proteins, that node is the right place for the
      IRD, in line with the MRPL44 and MRPL3 precedents; this was not verified here.
- gene_file: genes/DROME/Buffy/Buffy-ai-review.yaml
  rows:
  - go_id: GO:0005741
    go_label: mitochondrial outer membrane
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      The IBD sits at the BCL2 family root PTN000135648 (246 leaves, 34 species) with 11
      seeds (mouse, rat and human BCL2, BCL2L1, BAX, BAK1 and BOK genes, and worm ced-9).
      Buffy (Q8T8Y5, leaf PTN000135896) is not a seed. It sits in the child clade
      PTN000883439 (40 leaves, the BOK clade, which holds the human BOK seed Q9UMX3), in the
      insect group PTN002600738 (7 leaves). There the fly paralogs separate: PTN000135895 (4
      leaves) splits into PTN000135894 (Debcl with its Anopheles ortholog) and PTN008515456
      (Buffy with its Anopheles ortholog). PAINT already records five losses at
      PTN002600738, all biological process terms (GO:0001836, GO:0043066, GO:0097192,
      GO:0043065, GO:0008630); none is for a cellular component.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000135896
    evidence_checked:
    - Review row quotes PMID:17205077 (abstract-only in the cache) that DEBCL localises predominantly to mitochondria and BUFFY to the endoplasmic reticulum; the same review keeps a direct IDA row for endoplasmic reticulum from that paper.
    - QuickGO, human BOK Q9UMX3, GO:0005741 with descendants returns EXP PMID:27076518, so the query shape returns positives and the seed in Buffy's child clade is sound. The same query for Debcl Q9V9C8 returns the IBA only.
    - QuickGO cellular_component rows for Buffy Q8T8Y5 currently return only this IBA and a UniProt IEA for membrane. The IDA rows for mitochondrion (PMID:12853472) and endoplasmic reticulum (PMID:17205077) that the review carries from its GOA snapshot are not returned today; their present status was not resolved.
    review_edited: false
    notes: >-
      Upheld on a direct localisation result on the target that puts it in a different
      compartment from its paralog, with a stated sequence basis (the C-terminal basic
      residues that send Debcl to mitochondria are absent from Buffy). The reason already
      names the node and the Buffy/Debcl split, so the review was left unchanged. The loss
      is pinned to the fly leaf because the evidence is on fly Buffy only; PTN008515456
      would also cover the untested Anopheles ortholog. One tension remains inside the
      review: it keeps an IDA mitochondrion row (PMID:12853472) as non-core while removing
      the outer membrane IBA. Both papers are abstract-only here, so which localisation the
      2003 paper actually showed could not be checked.
- gene_file: genes/human/BAK1/BAK1-ai-review.yaml
  rows:
  - go_id: GO:0043066
    go_label: negative regulation of apoptotic process
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      The IBD sits at the BCL2 family root PTN000135648 (246 leaves) with 23 seeds. The root
      has five child clades: PTN000883460 (80 leaves: BCL2, BCL2L1, BCL2L2, ced-9),
      PTN008515446 (27 leaves: BCL2L10), PTN008318549 (26 leaves: BAK1), PTN000883411 (73
      leaves: MCL1, BAX, BCL2A1) and PTN000883439 (40 leaves: BOK, Buffy, Debcl). Most seeds
      are pro-survival genes in the first, second and fourth clades. BAK1 (Q16611) is itself
      a seed and is the only seed inside the BAK clade PTN008318549. The same root node also
      carries an IBD for GO:0043065 positive regulation of apoptotic process (17 seeds), and
      PAINT has NOT IRD records for GO:0043066 at PTN002600738 (insect Buffy/Debcl) and
      PTN000135883 (zebrafish bok).
    ground: BAD_SEED
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008318549
    evidence_checked:
    - QuickGO, BAK1 Q16611, GO:0043066 with descendants returns the IBA plus two ComplexPortal IDA rows from PMID:15901672 (GO:0090201 and GO:1901029). The same query shape returns 25 rows for BCL2 P10415, including many direct IDA and IMP rows.
    - publications/PMID_15901672.md title is "Proapoptotic Bak is sequestered by Mcl-1 and Bcl-xL, but not Bcl-2, until displaced by BH3-only proteins", so BAK is the restrained partner in the complexes those rows describe.
    - Mouse Bak1 O08734 has only ISO rows under the term; rat Bak1 F7EQF3 has none.
    review_edited: true
    notes: >-
      Action unchanged, reason rewritten. The earlier reason spoke of a pro/anti-apoptotic
      split that the tree does not have as a single branch, and did not say that BAK1 is
      itself a seed. The removal now rests on the seed being a complex-level annotation in
      which BAK is the target of restraint; this review already removes both IDA rows, so
      the three rows are judged together and stay consistent. The PAINT loss at
      PTN008318549 only makes sense once BAK1 is dropped from the seed list, which is a
      ComplexPortal-side question (whether a complex function should be projected onto the
      sequestered subunit). If those IDA rows are later restored, this row must be
      revisited. History record added.
- gene_file: genes/human/BAX/BAX-ai-review.yaml
  rows:
  - go_id: GO:0043066
    go_label: negative regulation of apoptotic process
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      Same root IBD as for BAK1: PTN000135648 (246 leaves), 23 seeds. BAX (Q07812, leaf
      PTN002477640) is not a seed. It sits in the BAX clade PTN008515428 (22 leaves, 17
      species), one of three groups under PTN008318541 (67 leaves) together with the MCL1
      clade PTN002600668 (25 leaves) and the BCL2A1 clade PTN002600722 (20 leaves), all
      inside the root child clade PTN000883411 (73 leaves). So the tree does not separate
      BAX from the pro-survival members by a single split. One seed lies inside the BAX
      clade, mouse Bax (MGI:99702, Q07813).
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
      target_node_id: PTN008515428
    evidence_checked:
    - UniProt Q07813 cross-references MGI:99702 (mouse Bax), which is in the seed list.
    - QuickGO, mouse Bax Q07813, GO:0043066 with descendants returns acts_upstream_of_or_within GO:0043524 IDA PMID:8625820 and GO:2001234 IGI PMID:18436203 (both MGI). Human BAX Q07812 returns the IBA only.
    - publications/PMID_8625820.md abstract (Middleton et al. 1996) reports that overexpression of Bax rescued sensory neurons deprived of nerve growth factor. PMID:18436203 is not cached and was not read.
    review_edited: true
    notes: >-
      Changed from REMOVE because none of the four grounds can be stated against the tree:
      an ortholog inside the BAX clade carries experimental rows under the term, so there is
      no target loss, the IBD is not misplaced with respect to BAX, and the seed records a
      real observation. The observation is an overexpression effect in cultured neurons
      annotated acts_upstream_of_or_within, which makes the row an over-annotation for
      human BAX and not a function to keep. No PAINT change is requested: a loss at
      PTN008515428 would contradict the mouse Bax seed, and whether such context-specific
      acts_upstream_of_or_within rows should seed an involved_in IBD is a question for the
      PAINT curators. PMID:8625820 was added to the review's references with a
      supported_by quote. History record added. BAK1 and BAX now carry different actions
      for this term; that follows from the different seed evidence in their clades.
- gene_file: genes/human/MCL1/MCL1-ai-review.yaml
  rows:
  - go_id: GO:0015267
    go_label: channel activity
    family: PTHR11256
    ibd_node: PTN000135648
    tree_reading: >-
      The IBD sits at the family root PTN000135648 (246 leaves) with 3 seeds: human BCL2
      (P10415, in child clade PTN000883460), BAX (Q07812, in PTN000883411) and BAK1 (Q16611,
      in PTN008318549). MCL1 (Q07820) is not a seed. It sits in the MCL1 clade PTN002600668
      (25 leaves), sister to the BAX clade PTN008515428 under PTN008318541 (67 leaves), so a
      seed lies in the target's own child clade of the root and another seed (BCL2) is a
      pro-survival protein. No loss of the term is recorded anywhere in the family.
    ground: NONE
    verdict: ACTION_CHANGED
    new_action: MARK_AS_OVER_ANNOTATED
    paint_fix:
      paint_action: NONE
      target_node_id: PTN000135648
    evidence_checked:
    - QuickGO, GO:0015267 with descendants: BCL2 P10415 IDA PMID:9219694; BAX Q07812 IDA PMID:9219694; BAK1 Q16611 IDA GO:0015288 PMID:22006182; MCL1 Q07820 the IBA only.
    - The BCL2 review in this repo keeps the same term as KEEP_AS_NON_CORE on the strength of channel formation by purified BCL2 in artificial membranes (PMID:9219694, PMID:9144199); BCL2L1 has it as MODIFY, BAX and BAK1 as ACCEPT, Buffy as KEEP_AS_NON_CORE.
    - The MCL1 deep-research files were searched for channel or pore measurements on MCL1; none found.
    review_edited: true
    notes: >-
      The earlier REMOVE rested on MCL1 not being known as a channel and on the term
      belonging to the pro-apoptotic side (failure mode REGULATORY_SIGN_INVERSION). The seed
      list refutes the second point (BCL2 is a seed) and the first is absence of data, which
      is what an IBA is for. No evidence of loss in MCL1 was found, so the row cannot be a
      REMOVE. MARK_AS_OVER_ANNOTATED was chosen over KEEP_AS_NON_CORE because the activity
      is untested on MCL1 and the pro-survival seed evidence is an in vitro measurement of
      uncertain relevance. A reviewer who weighs corpus consistency with BCL2 and Buffy
      more heavily could reasonably prefer KEEP_AS_NON_CORE. History record added.
