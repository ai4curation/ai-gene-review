genes:
- gene_file: genes/ARATH/APS1/APS1-ai-review.yaml
  rows:
  - go_id: GO:0004020
    go_label: adenylylsulfate kinase activity
    family: PTHR11055
    ibd_node: PTN000114732
    tree_reading: >-
      The IBD sits at the family root PTN000114732 (357 leaves, 100 species) with 10 seeds
      (bacterial CysC, yeast MET14, worm pps-1, mouse and human PAPSS, Arabidopsis APK
      kinases). APS1 (Q9LIK9, SF46) is not a seed. On its lineage, node PTN001666201
      (274 leaves) splits into PTN008511165 (112 leaves, 39 species, the land-plant and
      Klebsormidium ATP sulfurylases, SF37/SF41/SF46/SF65/SF75) and PTN008511181 (162 leaves,
      the plant APS kinases SF63/SF44 that hold the Arabidopsis APK seeds). No IRD or IKR for
      GO:0004020 is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008511165
    evidence_checked:
    - APS1-uniprot.txt Pfam lines list PF01747 ATP-sulfurylase and PF14306 PUA_2 only, no APS kinase domain (quotes already in the review row).
    - interpro/panther/PTHR11055/PTHR11055-review.yaml node assessment for PTN000114732 asks for an IRD on the plant ATP sulfurylase clade; the tree shows that clade is PTN008511165.
    review_edited: false
    notes: >-
      The existing reason is node-aware and rests on domain architecture, so the review was
      left unchanged. The family review names the affected subfamilies but no target node;
      PTN008511165 is the smallest node holding all plant ATP sulfurylases and none of the
      APK kinases.
- gene_file: genes/yeast/CNE1/CNE1-ai-review.yaml
  rows:
  - go_id: GO:0005509
    go_label: calcium ion binding
    family: PTHR11073
    ibd_node: PTN000117401
    tree_reading: >-
      The IBD sits at the family root PTN000117401 (411 leaves, 97 species) with 7 seeds
      (mouse and rat calreticulin/calnexin, human CALR P27797, worm crt-1 and cnx-1, S. pombe
      cnx1 SPAC3C7.11c). The root splits into PTN000117402 (234 leaves, calreticulins) and
      PTN000117503 (177 leaves, calnexins), which holds CNE1. CNE1 (P27825) is not a seed; it
      sits in the fungal calnexin clade PTN000870724 (15 leaves), whose only seed is S. pombe
      cnx1 in the sister clade PTN000117584 (4 leaves). CNE1's own node PTN000870726 has 2
      leaves (S. cerevisiae CNE1 and a Candida albicans ortholog). PAINT already records one
      loss of this term in the family: NOT IRD GO:0005509 at PTN002594615 (13 leaves, CALR3).
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000117580
    evidence_checked:
    - publications/PMID_7814381.md abstract contains "Ca2+ binding activity has not been detected for Cne1p." (the quote the review row carries).
    - CNE1-goa.tsv has the IBA and an InterPro IEA row for GO:0005509, no experimental row; both review rows are REMOVE, so actions are consistent.
    review_edited: false
    notes: >-
      The loss evidence is a direct negative assay on Cne1p only, so the fix is placed on the
      CNE1 leaf PTN000117580 rather than on PTN000870726 (which would also cover the
      untested Candida ortholog). The CALR3 IRD at PTN002594615 is a precedent for a
      member-specific loss of this term.
- gene_file: genes/yeast/FCY1/FCY1-ai-review.yaml
  rows:
  - go_id: GO:0008835
    go_label: diaminohydroxyphosphoribosylaminopyrimidine deaminase activity
    family: PTHR11079
    ibd_node: PTN002254009
    tree_reading: >-
      The IBD sits at PTN002254009 (158 leaves, 83 species) with one seed, E. coli RibD
      (P25539). That node splits into PTN000118315 (28 leaves, 27 bacterial species, the RibD
      clade that holds the seed) and PTN008512018 (130 leaves), which holds FCY1. Inside
      PTN008512018 the target sits in PTN008315906 (13 leaves), whose fungal half
      PTN000871231 (8 leaves, SF190) carries its own IBD for GO:0004131 cytosine deaminase
      activity; the sister PTN002594837 (114 leaves) holds the plant PYRR riboflavin
      deaminases (e.g. Arabidopsis PYRR Q9STY4) and fungal SF162/SF195 members. FCY1 is not
      a seed. No loss of GO:0008835 is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000871231
    evidence_checked:
    - Review row cites the RIB2 UniProt record (yeast DRAP deaminase is Rib2) and FCY1's characterised cytosine deaminase activity; PAINT itself places a cytosine deaminase IBD (2 seeds) at PTN000871231.
    - interpro/panther/PTHR11079/PTHR11079-review.yaml assesses PTN002254009 as NEEDS_PRUNING with an IRD on the SF190 branch, which agrees with the tree.
    review_edited: false
    notes: >-
      Not a misplaced IBD: the node also covers the plant PYRR clade, where the riboflavin
      deaminase activity is expected, so the fix is a loss on the fungal cytosine deaminase
      clade rather than moving the IBD. The review summary mentions RibD being the only
      donor, but only descriptively; the reason rests on divergence. The family review
      quotes that summary verbatim, so it was left untouched.
- gene_file: genes/DROME/Sirt1/Sirt1-ai-review.yaml
  rows:
  - go_id: GO:0031509
    go_label: subtelomeric heterochromatin formation
    family: PTHR11085
    ibd_node: PTN000872222
    tree_reading: >-
      The IBD sits at PTN000872222 (61 leaves, 53 species) with 2 seeds, S. cerevisiae SIR2
      (SGD:S000002200) and S. pombe sir2 (SPBC16D10.07c). Below it, PTN000119301 (51 leaves)
      splits by speciation into PTN000872240 (16 leaves, 14 fungal species, holding both
      seeds) and PTN000872223 (35 leaves, 33 species, metazoan SIRT1 plus Monosiga), which
      holds fly Sirt1 (Q9VK34, leaf PTN000119332). No seed lies in the metazoan clade, and no
      loss of the term is recorded anywhere on the lineage. Sirt1 is not a seed.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000119332
    evidence_checked:
    - QuickGO by term id GO:0031509 returns IMP rows for SIR2 P06700 (PMID:11950950, PMID:1913809, PMID:9501103) and EXP/IGI rows for S. pombe sir2 O94640 (PMID:16079916, PMID:32295063), so the query shape returns positives and the seeds are sound.
    - Same query for fly Sirt1 Q9VK34 and human SIRT1 Q96EB6 (with descendants) returns the IBA only.
    - Review row quotes PMID:12086602 that dSir2 "is not required for silencing at telomeres", a direct negative result on the target.
    review_edited: false
    notes: >-
      The existing reason already names the node, the fungal-only seeds and the direct fly
      evidence, so it was left unchanged. The loss is pinned to the fly leaf because the
      negative evidence is on the fly gene only. A curator may prefer MOVE_IBD to
      PTN000872240 (the fungal clade holding both seeds), since no metazoan member has an
      experimental annotation for the term; that would need a check that mammalian SIRT1
      has no such role, which was not done here.
