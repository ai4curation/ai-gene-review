- gene_file: genes/yeast/ELO1/ELO1-ai-review.yaml
  rows:
  - go_id: GO:0034626
    go_label: fatty acid elongation, polyunsaturated fatty acid
    family: PTHR11157
    ibd_node: PTN000125390
    tree_reading: >-
      The IBD sits at the family root PTN000125390 (622 leaves, 96 species) with 9 seeds.
      Human ELOVL2, ELOVL5 and ELOVL7 and chicken ELOVL2 sit in PTN000125391 (272 leaves),
      human ELOVL3 in PTN000125611 (130 leaves), and the Trypanosoma brucei elongase Q57X51
      in PTN004237247 (3 leaves); the mouse and rat seeds are vertebrate ELOVL genes. None
      of the seeds lies in the fourth large child clade PTN004237254 (211 leaves: fungal,
      plant and Dictyostelium elongases), which holds ELO1 (P39540, leaf PTN000125727) inside the
      fungal clade PTN000876904 (32 leaves, 15 species). The three S. cerevisiae paralogs and two Eremothecium gossypii genes form PTN001340738 (5 leaves, 2 species). ELO1 is not a seed for this
      term and no loss is recorded on the lineage.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000125727
    evidence_checked:
    - QuickGO GO:0034626 returns experimental rows for the seeds checked (T. brucei Q57X51 IMP PMID:16923389; human ELOVL3 Q9HB03 IDA PMID:20937905; human ELOVL2 Q9NXB9 IDA PMID:12371743 and PMID:20937905), so the query shape returns positives; the same query for S. cerevisiae ELO1 P39540 returns the IBA only.
    - interpro/panther/PTHR11157/PTHR11157-review.yaml assesses this node as TOO_DEEP for the term and notes all five fungal reviews remove it.
    - Review row cites the substrate studies for the yeast elongases (saturated and monounsaturated substrates) and the absence of PUFA synthesis in S. cerevisiae.
    review_edited: false
    notes: >-
      The ground is that S. cerevisiae makes no polyunsaturated fatty acids (single delta-9
      desaturase), so the process has no substrate in the organism. This is a property of these
      yeasts, not of fungi as a whole: other fungi in PTN000876904 (for example Neurospora and
      Yarrowia) do make PUFAs, so the loss is pinned to the S. cerevisiae leaf rather than to
      the fungal clade. The family review's alternative, moving the IBD down to the animal ELOVL
      branches, would need separate IBDs for the trypanosome seed and for ELOVL3, because the
      seeds span three child clades of the root. The existing reason is sound (pathway absent in
      the organism) and was left unchanged. PTN001340738 would cover all three paralogs with one
      IRD but also the two Eremothecium genes, whose PUFA status was not checked.
