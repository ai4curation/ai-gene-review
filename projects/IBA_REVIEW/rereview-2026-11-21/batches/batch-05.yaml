- gene_file: genes/yeast/INP51/INP51-ai-review.yaml
  rows:
  - go_id: GO:0043813
    go_label: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    family: PTHR11200
    ibd_node: PTN000878771
    tree_reading: >-
      The IBD sits at PTN000878771 (20 leaves, 14 species, fungal synaptojanin-like
      phosphatases) with 3 seeds: S. pombe SPBC2G2.02, S. cerevisiae INP52 (SGD:S000005050)
      and INP53 (SGD:S000005635). Within it, PTN001341482 (7 leaves, 3 species) splits by
      duplication into PTN000878773 (4 leaves: INP52, INP53 and their Eremothecium and
      Candida orthologs, SF257), which holds the two budding yeast seeds, and PTN008317426
      (3 leaves: INP51 P40559 with its Eremothecium and Candida orthologs, SF269). INP51 is
      not a seed and no loss is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN008317426
    evidence_checked:
    - QuickGO GO:0043813: INP52 P50942 and INP53 Q12271 each carry IDA PMID:10224048; INP51 P40559 carries the IBA only.
    - INP51-uniprot.txt CC FUNCTION (experimental evidence tags) reads "Does not utilize phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2)"; publications/PMID_10224048.md title names the SAC1-like domains of SAC1, INP52 and INP53 only.
    review_edited: false
    notes: >-
      The row has a summary and no separate reason, but the summary states target-specific
      divergence against the named node, so it was left unchanged. The loss is proposed at
      the INP51 paralog clade PTN008317426 because the seeds sit on the other side of the
      duplication; direct evidence exists for S. cerevisiae INP51 only, so the leaf
      PTN000128238 is the conservative alternative.
- gene_file: genes/ARATH/DRB1/DRB1-ai-review.yaml
  rows:
  - go_id: GO:0004525
    go_label: ribonuclease III activity
    family: PTHR11207
    ibd_node: PTN000129453
    tree_reading: >-
      The IBD sits at the family root PTN000129453 (330 leaves, 126 species) with 5 seeds:
      E. coli rnc (P0A7Y0), human DROSHA (Q9NRR4), a worm gene (WBGene00009163), S. pombe
      SPBC119.11c and S. cerevisiae S000004852. The root splits into the bacterial rnc clade
      PTN000129531 (35 leaves) and PTN000129454 (295 leaves). Inside the latter, PTN000129455
      (100 leaves) holds DROSHA, RNT1, pac1 and the MRPL44/MRPL3 mitoribosomal proteins, and
      PTN007495241 (195 leaves, 42 species, plants and protists) holds DRB1 (O04492, SF1,
      leaf PTN001341990) and has no seed for this term. Within it DRB1 sits in
      PTN000129522 (101 leaves, 34 species), sister to PTN001676747 (33 leaves, with
      Arabidopsis NFD2, SF0). PAINT already records two losses of this term for
      non-catalytic members: NOT IRD at PTN001025433 (33 leaves, MRPL44) and at PTN001025446
      (14 leaves, fungal MRPL3). DRB1 is not a seed.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN001341990
    evidence_checked:
    - Review row cites PMID:18632569 (recombinant HYL1 accelerates DCL1-mediated cleavage; cleavage is assigned to DCL1) and the absence of an RNase III catalytic domain in HYL1.
    - node listing confirms the two existing IRDs for GO:0004525 at PTN001025433 and PTN001025446, both seeded from PTN000129453, which the review reason mentions only generically.
    review_edited: false
    notes: >-
      The existing reason is node-aware, says donor count is not the issue, and rests on
      domain architecture, so it was left unchanged. The loss is pinned to the DRB1 leaf
      because the domain architecture was checked for DRB1 only. If the other 100 members
      of PTN000129522 are also dsRBD-only proteins, that node is the right place for the
      IRD, in line with the MRPL44 and MRPL3 precedents; this was not verified here.
