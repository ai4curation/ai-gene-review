- gene_file: genes/yeast/LSC1/LSC1-ai-review.yaml
  rows:
  - go_id: GO:0004776
    go_label: succinate-CoA ligase (GDP-forming) activity
    family: PTHR11117
    ibd_node: PTN000122012
    tree_reading: >-
      The IBD sits at PTN000122012 (187 leaves, 129 species) with 6 seeds: rat, pig and human
      SUCLG1, Dictyostelium, and E. coli and Pseudomonas SucD. LSC1 (P53598, leaf
      PTN000122063) is not a seed. It sits in the fungal clade PTN000874203 (21 leaves, 15
      species, all fungi including S. pombe SPAC16E8.17c), inside the eukaryotic
      mitochondrial clade PTN000122014 (150 leaves). No seed for this term lies in
      PTN000874203 and no loss is recorded on the lineage. The ADP-forming IBD at the same
      node is not in question and LSC1 has its own IDA/IMP rows for it.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000874203
    evidence_checked:
    - Review row quotes PMID:9874242 "The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis", a direct assay on the target enzyme, and PMID:9765290 that nucleotide specificity resides in the beta subunit.
    - node listing confirms PTN000874203 is on LSC1's lineage and holds only fungal alpha subunits (21 leaves), as the review reason states.
    review_edited: false
    notes: >-
      The existing reason is node-aware (names PTN000874203), says explicitly that it is not a
      donor-count argument, and states the limits of the qualitative assay. Left unchanged.
      The loss at the 21-leaf fungal node rests on direct assay for S. cerevisiae only and on
      the absence of a G-type beta gene for the other fungi; a curator who wants only assayed
      loss would place it at the LSC1 leaf PTN000122063 instead.
- gene_file: genes/human/PUS3/PUS3-ai-review.yaml
  rows:
  - go_id: GO:1990481
    go_label: mRNA pseudouridine synthesis
    family: PTHR11142
    ibd_node: PTN000124732
    tree_reading: >-
      The IBD sits at the family root PTN000124732 (514 leaves, 141 species) with 4 seeds:
      yeast PUS1 (SGD:S000006133), yeast PUS2 (SGD:S000003031), human PUS1 (Q9Y606) and yeast
      DEG1 (SGD:S000001895). The first three sit in the PUS1 clade PTN000124736 (180 leaves);
      DEG1 (P31115) sits with human PUS3 (Q9BZE2, leaf PTN002476728) in the PUS3 clade
      PTN000124846 (115 leaves), within its opisthokont half PTN000124847 (56 leaves, 53
      species). So the target's own orthologous clade is seeded, by its yeast ortholog.
      PUS3 is not a seed and no loss is recorded on the lineage.
    ground: TARGET_LOSS
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN002476728
    evidence_checked:
    - QuickGO GO:1990481 by UniProt accession: yeast PUS1 Q12211 IMP (PMID:25192136, PMID:25219674), PUS2 P53167 IMP (PMID:25192136), DEG1 P31115 IMP (PMID:25192136), human PUS1 Q9Y606 IDA (PMID:31477916, PMID:35051350); human PUS3 Q9BZE2 has the IBA only. Queries by SGD id returned nothing, so the accession form was used.
    - publications/PMID_25192136.md reports novel Pus3 targets in yeast (20 mRNA, 1 ncRNA), so the DEG1 seed is sound.
    - PubMed abstract of PMID:38996458 (Lin et al. 2024, Mol Cell, doi:10.1016/j.molcel.2024.06.013) states PUS1 and PUS3 were deleted in HEK293 cells, Pseudo-seq was run, and "we found no evidence that human PUS3 modifies mRNAs". This is the primary source behind the deep-research statements the review row quotes.
    review_edited: false
    notes: >-
      Upheld on a direct negative result on the human gene (knockout plus transcriptome-wide
      mapping), not on absence of data. It is a closer call than most: the yeast ortholog
      DEG1 is an experimental seed, the human result comes from one cell line, and a
      negative Pseudo-seq cannot exclude low-stoichiometry or condition-specific sites. The
      loss is therefore pinned to the human leaf only. The review row cites the two
      deep-research files rather than PMID:38996458 itself; the reason is not a non-ground
      and does not misstate the tree, so it was not edited, but a later pass should add
      the primary paper (publications/PMID_38996458.md is cached) to references and
      supported_by.
- gene_file: genes/SCHPO/elo1/elo1-ai-review.yaml
  rows:
  - go_id: GO:0034626
    go_label: fatty acid elongation, polyunsaturated fatty acid
    family: PTHR11157
    ibd_node: PTN000125390
    tree_reading: >-
      The IBD sits at the family root PTN000125390 (622 leaves, 96 species) with 9 seeds.
      Human ELOVL2, ELOVL5 and ELOVL7 and chicken ELOVL2 sit in PTN000125391 (272 leaves),
      human ELOVL3 in PTN000125611 (130 leaves), and the Trypanosoma brucei elongase Q57X51
      in PTN004237247 (3 leaves); the mouse and rat seeds are vertebrate ELOVL genes. None
      of the seeds lies in the fourth large child clade PTN004237254 (211 leaves: fungal,
      plant and Dictyostelium elongases), which holds elo1 (Q7LKX0, leaf PTN000125739) inside the
      fungal clade PTN000876904 (32 leaves, 15 species). Its node PTN000125738 (3 leaves, 2 species) holds the two S. pombe paralogs and one S. japonicus gene. elo1 is not a seed for this
      term and no loss is recorded on the lineage.
    ground: LINEAGE
    verdict: REMOVE_UPHELD
    paint_fix:
      paint_action: ADD_IRD
      target_node_id: PTN000125738
    evidence_checked:
    - QuickGO GO:0034626 returns experimental rows for the seeds checked (T. brucei Q57X51 IMP PMID:16923389; human ELOVL3 Q9HB03 IDA PMID:20937905; human ELOVL2 Q9NXB9 IDA PMID:12371743 and PMID:20937905), so the query shape returns positives; the same query for S. cerevisiae ELO1 P39540 and S. pombe elo2 Q9UTF7 (elo1 Q7LKX0 was not queried separately; its GOA row in the review is the IBA) returns the IBA only.
    - interpro/panther/PTHR11157/PTHR11157-review.yaml assesses this node as TOO_DEEP for the term and notes all five fungal reviews remove it.
    - Review row reason (no PUFAs in fission yeast, animal specificity over-propagated) read against the tree; it is consistent with it.
    review_edited: false
    notes: >-
      The ground is that S. pombe makes no polyunsaturated fatty acids (single delta-9
      desaturase), so the process has no substrate in the organism. This is a property of these
      yeasts, not of fungi as a whole: other fungi in PTN000876904 (for example Neurospora and
      Yarrowia) do make PUFAs, so the loss is pinned to the Schizosaccharomyces node
      PTN000125738 rather than to the fungal clade. The family review's alternative, moving the
      IBD down to the animal ELOVL branches, would need separate IBDs for the trypanosome seed
      and for ELOVL3, because the seeds span three child clades of the root. The existing reason
      is sound and was left unchanged. Including the S. japonicus gene under the loss assumes it
      shares the S. pombe lipid profile, which was not checked; the two S. pombe leaves
      PTN000125739 and PTN000125740 are the conservative targets.
