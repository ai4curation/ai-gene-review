<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d8a4b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7657a3"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">The nitrogen cycle and its marker enzymes</text>
  <!-- species nodes -->
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#15201e">
    <rect x="100" y="238" width="100" height="40" rx="20" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/><text x="150" y="264">NH₃/NH₄⁺</text>
    <rect x="345" y="98" width="90" height="36" rx="18" fill="#e8f1ee" stroke="#8fa39c"/><text x="390" y="122">NH₂OH</text>
    <rect x="755" y="98" width="90" height="36" rx="18" fill="#e8f1ee" stroke="#8fa39c"/><text x="800" y="122">NO₂⁻</text>
    <rect x="865" y="238" width="80" height="40" rx="20" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/><text x="905" y="264">NO₃⁻</text>
    <rect x="660" y="398" width="80" height="36" rx="18" fill="#e8f1ee" stroke="#8fa39c"/><text x="700" y="422">NO</text>
    <rect x="515" y="398" width="90" height="36" rx="18" fill="#e8f1ee" stroke="#8fa39c"/><text x="560" y="422">N₂O</text>
    <rect x="345" y="398" width="90" height="36" rx="18" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/><text x="390" y="422">N₂</text>
    <rect x="225" y="318" width="90" height="36" rx="18" fill="#e8f1ee" stroke="#8fa39c"/><text x="270" y="342">N₂H₄</text>
  </g>
  <!-- nitrification (green) -->
  <path d="M170 238 Q 220 130 342 116" fill="none" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="210" y="150" font-size="12" fill="#1d8a4b" font-weight="600">amoABC</text>
  <path d="M437 112 L752 112" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="590" y="104" text-anchor="middle" font-size="12" fill="#1d8a4b" font-weight="600">hao (+ cyt c-554)</text>
  <path d="M846 108 Q 900 110 905 234" fill="none" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="890" y="160" font-size="12" fill="#1d8a4b" font-weight="600">nxrAB</text>
  <text x="590" y="70" text-anchor="middle" font-size="13" fill="#1d8a4b">nitrification (oxidative, aerobic)</text>
  <!-- denitrification (red) -->
  <path d="M880 280 Q 830 250 810 138" fill="none" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="820" y="220" text-anchor="end" font-size="12" fill="#bd3a30" font-weight="600">narG / napA</text>
  <path d="M790 136 Q 760 300 712 396" fill="none" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="772" y="330" font-size="12" fill="#bd3a30" font-weight="600">nirS | nirK</text>
  <path d="M658 416 L608 416" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="633" y="455" text-anchor="middle" font-size="12" fill="#bd3a30" font-weight="600">norBC</text>
  <path d="M513 416 L438 416" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="476" y="455" text-anchor="middle" font-size="12" fill="#bd3a30" font-weight="600">nosZ</text>
  <text x="640" y="480" text-anchor="middle" font-size="13" fill="#bd3a30">denitrification (anaerobic respiration)</text>
  <!-- fixation (purple) -->
  <path d="M345 424 Q 180 430 150 282" fill="none" stroke="#7657a3" stroke-width="2.5" marker-end="url(#p)"/>
  <text x="150" y="420" font-size="12" fill="#7657a3" font-weight="600">nifHDK</text>
  <text x="150" y="436" font-size="11" fill="#7657a3">fixation</text>
  <!-- DNRA + assimilation (blue) -->
  <path d="M770 134 Q 480 200 204 252" fill="none" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="470" y="232" text-anchor="middle" font-size="12" fill="#1d68b3" font-weight="600">nrfA (DNRA) · nirA / nirB (assimilation)</text>
  <!-- anammox (orange) -->
  <path d="M190 280 Q 200 330 222 334" fill="none" stroke="#b8620f" stroke-width="2.2" marker-end="url(#o)"/>
  <path d="M780 136 Q 520 300 318 334" fill="none" stroke="#b8620f" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <path d="M292 354 Q 320 390 350 404" fill="none" stroke="#b8620f" stroke-width="2.2" marker-end="url(#o)"/>
  <text x="470" y="318" font-size="12" fill="#b8620f" font-weight="600">anammox: hzsABG</text>
  <text x="330" y="378" font-size="12" fill="#b8620f" font-weight="600">hdh</text>
  <!-- GS/GOGAT, urea -->
  <path d="M110 238 L70 160" stroke="#56655f" stroke-width="2" marker-end="url(#k)"/>
  <text x="40" y="150" font-size="12" fill="#15201e">Gln / Glu</text>
  <text x="18" y="200" font-size="11" fill="#56655f">glnA, gltB</text>
  <text x="40" y="330" font-size="12" fill="#15201e">urea</text>
  <path d="M70 322 L112 282" stroke="#56655f" stroke-width="2" marker-end="url(#k)"/>
  <text x="30" y="350" font-size="11" fill="#56655f">ureC</text>
</svg>
