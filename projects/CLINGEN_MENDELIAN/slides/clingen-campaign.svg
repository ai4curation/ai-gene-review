<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">From ClinGen export to one reviewed gene per PR</text>

  <!-- pipeline -->
  <g font-size="13" fill="#15201e">
    <rect x="24" y="64" width="190" height="62" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
    <text x="36" y="88" font-weight="bold">ClinGen export</text>
    <text x="36" y="108" font-size="12" fill="#56655f">3,679 curations, 3,038 genes</text>

    <rect x="24" y="150" width="190" height="62" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
    <text x="36" y="174" font-weight="bold">Keep positive tiers</text>
    <text x="36" y="194" font-size="12" fill="#56655f">drop Disputed, Refuted, NKDR</text>

    <rect x="24" y="236" width="190" height="62" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
    <text x="36" y="260" font-weight="bold">Normalise to HGNC</text>
    <text x="36" y="280" font-size="12" fill="#56655f">2,876 genes, 3,385 associations</text>

    <rect x="24" y="322" width="190" height="62" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="36" y="346" font-weight="bold">One PR per gene</text>
    <text x="36" y="366" font-size="12" fill="#56655f">review, validate, check</text>

    <rect x="24" y="408" width="190" height="62" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="36" y="432" font-weight="bold">Coordinator ticks</text>
    <text x="36" y="452" font-size="12" fill="#56655f">only after verified merge</text>
  </g>
  <g stroke="#1d8a4b" stroke-width="2.5">
    <line x1="119" y1="128" x2="119" y2="144"/><line x1="119" y1="214" x2="119" y2="230"/>
    <line x1="119" y1="300" x2="119" y2="316"/><line x1="119" y1="386" x2="119" y2="402"/>
  </g>
  <g fill="#1d8a4b">
    <polygon points="119,149 113,139 125,139"/><polygon points="119,235 113,225 125,225"/>
    <polygon points="119,321 113,311 125,311"/><polygon points="119,407 113,397 125,397"/>
  </g>

  <!-- tier bars -->
  <text x="270" y="80" font-size="15" font-weight="bold" fill="#15201e">Genes by strongest positive ClinGen classification</text>
  <g font-size="13" fill="#15201e">
    <text x="360" y="118" text-anchor="end">Definitive</text>
    <rect x="370" y="102" width="520" height="24" fill="#0e6b66"/>
    <text x="880" y="119" text-anchor="end" fill="#ffffff" font-weight="bold">2,086</text>
    <text x="360" y="158" text-anchor="end">Strong</text>
    <rect x="370" y="142" width="17.4" height="24" fill="#0e6b66"/>
    <text x="394" y="159">70</text>
    <text x="360" y="198" text-anchor="end">Moderate</text>
    <rect x="370" y="182" width="87" height="24" fill="#0e6b66"/>
    <text x="464" y="199">349</text>
    <text x="360" y="238" text-anchor="end">Limited</text>
    <rect x="370" y="222" width="92.5" height="24" fill="#8fa39c"/>
    <text x="470" y="239">371</text>
  </g>
  <text x="370" y="270" font-size="12" fill="#56655f">Limited associations are candidates, not established causation. Total 2,876 genes.</text>

  <!-- progress -->
  <text x="270" y="318" font-size="15" font-weight="bold" fill="#15201e">Progress, 2026-09-26</text>
  <rect x="270" y="334" width="620" height="28" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1"/>
  <rect x="270" y="334" width="3" height="28" fill="#1d8a4b"/>
  <text x="280" y="353" font-size="12" fill="#56655f">14 of 2,876 gene PRs merged and recorded (0.5%): the sliver at the left edge</text>
  <g font-size="13" fill="#15201e">
    <text x="270" y="396" font-weight="bold">Merged:</text>
    <text x="336" y="396">A4GALT → ACADVL (14 genes, 607 annotations)</text>
    <text x="270" y="420" font-weight="bold">Next batch:</text>
    <text x="358" y="420">ABCC8 → ACTA2, open or awaiting recording</text>
    <text x="270" y="444" font-weight="bold">Already reviewed elsewhere:</text>
    <text x="470" y="444">747 of the 2,876 genes on 2026-09-27 (audited, not assumed done)</text>
    <text x="270" y="468" font-weight="bold">Separate workflows:</text>
    <text x="418" y="468">35 RNA genes, 4 other HGNC loci</text>
  </g>
</svg>
