- id: TPV-007
  go_term:
    id: GO:0021987
    label: cerebral cortex development
  constraint: never_in_taxon
  taxon:
    id: NCBITaxon:8782
    label: Aves
  existing_go_constraint:
  - constraint: only_in_taxon
    taxon:
      id: NCBITaxon:33213
      label: Bilateria
  evidence:
  - reference_id: PMID:23027930
    supporting_text: Our findings establish that the layer 4 input and the layer 5 output cell types
      are conserved across the amniotes, but are organized into very different architectures, forming
      nuclei in birds, cortical areas in reptiles, and cortical layers in mammals.
  - reference_id: PMID:26154980
    supporting_text: the six-layered neocortex structure could hardly be more dissimilar in appearance
      from the nuclear organization that is so conspicuous in the dorsal telencephalon of birds and other
      reptiles
  blocks:
  - gene: BTBD3
    protein: UniProtKB:F1NI11
    organism: Gallus gallus
    evidence: IBA
    source_node: PANTHER:PTN002908884
  - gene: KIF14
    protein: UniProtKB:A0A8V0YLM5
    organism: Gallus gallus
    evidence: IBA
    source_node: PANTHER:PTN002790778
  - gene: NTRK2
    protein: UniProtKB:Q91987
    organism: Gallus gallus
    evidence: ISS
    source_id: UniProtKB:P15209
  - description: 1,756 IEAs on bird proteins (1,521 TreeGrafter, 212 Ensembl Compara, 23 InterPro2GO)
  would_wrongly_block: []
  notes: 9,287 exact-term annotations in QuickGO on 2026-11-05, 1,759 in Aves; the 24 is_a/part_of
    descendants of GO:0021987 would also be excluded in birds. GO defines the cerebral cortex as "the
    outer layered region of the telencephalon"; the avian dorsal pallium is nuclear, not layered.
    Reptiles have cortical areas, so the constraint is never_in_taxon Aves rather than only_in_taxon
    Mammalia. Hippocampus development (GO:0021766) is not under GO:0021987 and is unaffected.
    GO:0021987 is part_of GO:0021543 pallium development, which stays available for birds, and the
    homology of avian pallial regions to neocortex is debated (PMID:39946453 argues for convergence),
    so this is the least certain of the four RAR proposals. The strongest argument against a hard
    constraint is the main clause of the PMID:23027930 quote, that the layer 4 and layer 5 cell types are
    conserved across amniotes, so only the layered architecture, not the cell types, is absent from
    birds. Uberon (checked 2026-11-06) puts no only_in or never_in constraint on UBERON:0000956
    cerebral cortex; it asserts present_in_taxon NCBITaxon:117569 (Hyperoartia), with a note on
    convergent lamination in hagfishes, so Uberon also treats the cortex by its layered structure.
  conservative_alternative:
    constraint: none
    rationale: Leave GO:0021987 unconstrained and fix the bird annotations at their sources instead,
      moving them to GO:0021543 pallium development (the PAINT node PTN002908884, the TreeGrafter and
      Ensembl Compara rows). This avoids GO taking a position on avian pallial homology, at the cost
      of no automatic block on future bird annotations.
  in_repo_agreement:
  - genes/CHICK/BTBD3/BTBD3-ai-review.yaml (MODIFY to GO:0021543 pallium development)
  status: PROPOSED
  source: projects/RAR_MISANNOTATION.md (Wei et al. 2020, PMID:32470107, Table S4)
