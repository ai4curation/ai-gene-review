    NEEDS_PRUNING)
  status: ACCEPTED
  submission:
    tracker_issue: https://github.com/geneontology/go-ontology/issues/32689
    submitted: 2026-10-05
    resolved: 2026-11-03
    resolution: >-
      Added as is_a: neverin:6231 (Nematoda) on GO:0046425, with a term_tracker_item pointing
      to #32689. The same commit renamed GO:0046425 to "regulation of cell surface receptor
      signaling pathway via JAK-STAT" (old label kept as an exact synonym) and renamed
      GO:0046426 and GO:0046427 likewise, under go-ontology#14167. The regulation children
      carry no constraint of their own and inherit this one by is_a. go_term.label above is
