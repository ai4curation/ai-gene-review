  source: interpro/panther/PTHR10782/PTHR10782-review.yaml
- id: TPV-003
  go_term:
    id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  constraint: only_in_taxon
  taxon:
    id: NCBITaxon:33208
    label: Metazoa
  conservative_alternative:
    constraint: never_in_taxon
    taxon:
      id: NCBITaxon:33083
      label: Dictyostelia
    rationale: Blocks only the slime-mould STAT IBAs. Metazoa is preferred because JAKs arise
      in animals (PANTHER roots PTHR45807 at Eumetazoa and places a JAK in Trichoplax), so
      any non-animal JAK-STAT annotation is suspect. Bilateria would be tighter but would
      exclude the placozoan JAK.
  existing_go_constraint: null
  evidence:
  - reference_id: PMID:24058787
    supporting_text: The first bona fide JAK-like protein is represented in the basal metazoan
      porifera lineage
  - reference_id: PMID:16596165
    supporting_text: The human kinases are in the Jak, RSK, Trio, and GCN2 families, of which
      only GCN2 (IfkA) is found in Dictyostelium
  - reference_id: PMID:22699506
    supporting_text: There are no orthologs of the animal tyrosine kinases
  blocks:
  - gene: dstA
    protein: UniProtKB:O00910
    organism: Dictyostelium discoideum
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: dstB
    protein: UniProtKB:Q70GP4
    organism: Dictyostelium discoideum
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: dstC
    protein: UniProtKB:Q54BD4
    organism: Dictyostelium discoideum
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: dstD
    protein: UniProtKB:Q86I20
    organism: Dictyostelium discoideum
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - description: further Dictyostelium STATs
    proteins:
    - UniProtKB:Q54B81
    - UniProtKB:Q54GL9
    - UniProtKB:Q54WB7
    - UniProtKB:F0ZVN4
    - UniProtKB:F1A659
    - UniProtKB:F0Z7T3
    organisms:
    - Dictyostelium discoideum (Q54B81, Q54GL9, Q54WB7)
    - Dictyostelium purpureum (F0ZVN4, F1A659, F0Z7T3)
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - description: 13 fungal, 2 plant and 1 bacterial TreeGrafter IEAs from PTHR45807 nodes
    evidence: IEA
  would_wrongly_block:
  - term: GO:0007260 tyrosine phosphorylation of STAT protein
    reason: GO:0007260 is part_of GO:0007259, but Dictyostelium STATc is tyrosine phosphorylated
      without a JAK, by the TKL kinase Pyk2 (PMID:22699506). If the constraint propagates
      over part_of, it would forbid a correct annotation.
  - term: GO:0042531 (positive regulation of tyrosine phosphorylation of STAT protein)
    reason: Cholera toxin subunits (UniProtKB:P01555, P01556; Vibrio cholerae) carry IDA annotations
      that would conflict if the constraint propagates through regulates and part_of.
  prerequisites:
  - kind: ONTOLOGY_CHANGE
    term:
      id: GO:0007260
      label: tyrosine phosphorylation of STAT protein
    change: Remove the part_of GO:0007259 link, keeping GO:0007260 under GO:0097696 cell surface
      receptor signaling pathway via STAT.
    reason: Dictyostelium STATc is tyrosine phosphorylated without a JAK (PMID:22699506),
      so an only_in_taxon Metazoa constraint on GO:0007259 would wrongly forbid GO:0007260
      in Dictyostelium if it propagates over part_of.
    status: NOT_REQUESTED
    notes: >-
      Overtaken: GO applied the constraint without this change. GO:0007260 is already listed
      for obsoletion in go-ontology#27064, which would remove the conflict. If it is not
      obsoleted, request the re-parenting on #27064.
  in_repo_agreement:
  - interpro/panther/PTHR11801/PTHR11801-review.yaml (PTN000927860 TOO_DEEP; Dictyostelium
    subfamilies excluded)
  - interpro/panther/PTHR45807/PTHR45807-review.yaml (family rooted at Eumetazoa)
  - genes/DICDI/statA and genes/DICDI/statC (JAK-STAT IBA modified to GO:0097696)
  status: ACCEPTED
  submission:
    tracker_issue: https://github.com/geneontology/go-ontology/issues/32689
    submitted: 2026-10-05
    resolved: 2026-11-03
    resolution: >-
      Added as is_a: onlyin:33208 (Metazoa) on GO:0007259, alongside the TPV-001 neverin:6231,
      merged in go-ontology#32861. The GO:0007260 prerequisite below was not part of the
      change.
    commits:
    - https://github.com/geneontology/go-ontology/commit/fed722deb9e08f121365216c338db4cc08fac3e0
    pull_requests:
    - https://github.com/geneontology/go-ontology/pull/32861
    notes: >-
      The constraint was first missed (only neverin:6231 landed in 98389d1). A reviewer caught
      this and it was added in a second commit. GO accepted the Metazoa constraint without
      the GO:0007260 prerequisite. The automated review on #32861 says GO:0007260 "is
      `part_of` GO:0007259, so it now inherits only-in Metazoa too" and that "GO:0007260
      is already an obsoletion candidate, though, so this may resolve itself". GO:0007260
      is listed for obsoletion in go-ontology#27064 (open), but OLS still shows it as live.
      If it stays live, any Dictyostelium annotation to it now violates the constraint.
  source: projects/IBA_REVIEW.md section 14 (statA/statC) and interpro/panther/PTHR11801/PTHR11801-review.yaml
