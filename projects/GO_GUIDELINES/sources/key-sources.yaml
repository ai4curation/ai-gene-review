  - id: wiki:QCQA discussion GOC meeting Cambridge 2017-10
    title: QCQA discussion GOC meeting Cambridge 2017-10
    url: https://wiki.geneontology.org/index.php/QCQA_discussion_GOC_meeting_Cambridge_2017-10
    relevance: 4
    method: haiku
    rationale: Opinion piece on QC for GO covering centralised annotation documentation, senior-curator training and checking
      after guideline changes, and random checks to catch over-annotation; it argues general QC practice though it is not
      official policy.
  - id: wiki:RECEPTORS
    title: RECEPTORS
    url: https://wiki.geneontology.org/index.php/RECEPTORS
    relevance: 4
    method: haiku
    rationale: 'Records ontology-structure decisions for the whole receptor class: receptor activity moved directly under
      molecular function, signaling vs cargo receptor split, and the x-activated receptor naming convention to separate gene
      product names from activities. Page is marked STARTED/DONE in parts and is a 2014 snapshot.'
  - id: wiki:Receptor signaling proteins
    title: Receptor signaling proteins
    url: https://wiki.geneontology.org/index.php/Receptor_signaling_proteins
    relevance: 4
    method: haiku
    rationale: Records the decision that GO:0005057 receptor signaling protein activity is for downstream signal transducers,
