  - id: drive:Working Groups/IEA WG - 2025-10/Rating of IEA annotation pipelines .xlsx#1_3ibdFbFeJbqFwwXnSPT5XKYfpQxjK3LeaFet-r6hCE
    title: Rating of IEA annotation pipelines .xlsx
