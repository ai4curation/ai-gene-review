    relevance: 4
    method: haiku
    rationale: 'Dmel curator review recommending UniPathway2GO be dropped: the UniPathway mapping has not been maintained
      since 2015, about 24 GO terms in the mapping are obsolete with no replacements, and the errors arrive via ARBA/UniRule.
      Records a pipeline-level decision with a general argument about stale IEA mappings.'
  - id: drive:Working Groups/IEA WG - 2025-10/UNIPATHWAY2GO/Impact of UniPathway2GO removal on different species.pptx
    title: Impact of UniPathway2GO removal on different species.pptx
    url: https://drive.google.com/open?id=1-GVFrhcBsbllEj_DqrRk5RY7Un5PUm9zzuJIZIOdbLM
    relevance: 4
    method: haiku
    rationale: Working-group impact analysis recommending sunsetting the UniPathway2GO IEA mapping, with a per-species gap
      assessment and a policy that protein ubiquitination is a mapping artefact to be handled as MF-BP rather than BP.
  - id: drive:Working Groups/MOD Imports/GOC-MGI Imports Update.pptx
    title: GOC-MGI Imports Update.pptx
    url: https://drive.google.com/open?id=1VFPxudcQgndYi_qFNze6ZP9211WG9l4mzioZOHURHD8
    relevance: 4
    method: haiku
    rationale: 'Import specification for MGI annotations into GO-CAM: binding ''with'' becomes has_input, regulation targets
      become has_input, and chain relations are expanded. These are adopted conversion rules and QC steps for a class of annotations.'
  - id: drive:Working Groups/MOD Imports/MGI imports/Integrate remainder of MGI pipeline into the GO pipeline/Rat ISO/Copy
      of MGI_ISO_rat filters.docx
    title: Copy of MGI_ISO_rat filters.docx
    url: https://drive.google.com/open?id=1lx65V8ikyofnkDdwojm6fhHZ801ET1Z9
    relevance: 4
    method: haiku
    rationale: Written filter rules for generating mouse ISO annotations from rat annotations (evidence and term exclusions,
      no extension import, required GO_REF); a documented propagation convention.
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED - DNA-binding transcription factor activity annotation
      guidelines.docx
    title: ARCHIVED - DNA-binding transcription factor activity annotation guidelines.docx
    url: https://drive.google.com/open?id=1o06rwrGwx8Fw_fqw3ldsrGlM0ot21Q137yQ95ySpasc
    relevance: 4
    method: haiku
    rationale: 'Archived folder. Guideline for DNA-binding transcription factor activity: child terms of GO:0000981, one activity
      unit per target with indirectly regulates relations, and nuclear receptors handled with is small molecule activator
      of. Superseded by current guidance but carries reusable conventions.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED - How to annotate complexes in GO-CAM.docx
    title: ARCHIVED - How to annotate complexes in GO-CAM.docx
    url: https://drive.google.com/open?id=1Ex6a2iqUkDVXnDyRH-uJG0jK_LckvhyR
    relevance: 4
    method: haiku
    rationale: 'Archived folder, moved to the Noctua User Guide. Guidance on complex enablers: use a subunit''s own activity
      when known, the complex GO term when the carrying subunit is unknown, and the complex CC term when the activity is emergent
      across members.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED - Molecular adaptor activity.docx
    title: ARCHIVED - Molecular adaptor activity.docx
    url: https://drive.google.com/open?id=1IG35hUqcsstSYLnDG9WGer_RqUZxnIRXpuzgc-8hJVA
    relevance: 4
    method: haiku
    rationale: 'Archived folder. Molecular adaptor guideline: enables molecular adaptor activity with has input for the bound
      molecules, and directly positively regulates or constitutively upstream of relations. Its content is repeated in the
      reviewed MF guidelines copy, which is the current version.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED - Ubiquitination-related MFs.docx
    title: ARCHIVED - Ubiquitination-related MFs.docx
    url: https://drive.google.com/open?id=12F-Tg0yoxPczgoWmM3QgR_gKT-5lUR-d1BS6kitinjU
    relevance: 4
    method: haiku
    rationale: Archived folder. E3 ligase guideline with enabler patterns for a ligase alone, a ligase with substrate adaptor
      and scaffold, and the causal relations used for each (indirectly negatively regulates, directly provides input for).
      Reviewer flags remain open, so it is a draft-quality reference.
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED Molecular carrier activity.docx
    title: ARCHIVED Molecular carrier activity.docx
    url: https://drive.google.com/open?id=1GudhqemiFHPLbCO1SXmGwXYdH8kwegIN3H8uCV5EsgA
    relevance: 4
    method: haiku
    rationale: 'Archived folder. Guideline for molecular carrier activity in both editors: carrier enables carrier activity,
      linked by has input and has output, with a reviewer request for clear carrier versus transfer rules. Reference only.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED Protein sequestering activity.docx
    title: ARCHIVED Protein sequestering activity.docx
    url: https://drive.google.com/open?id=1lqDXopYiS1Sh0I9fEvOGceiZYxNEmg6O8_wklOaBeKc
    relevance: 4
    method: haiku
    rationale: 'Archived folder. Guideline for molecular sequestering activity: child protein sequestering activity, has input
      for the sequestered molecule, directly negatively regulates relation, and a required has primary input in the standard
      editor. Reference only.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED SP-GOCAM-guidelines-2025-02-06.docx
    title: ARCHIVED SP-GOCAM-guidelines-2025-02-06.docx
    url: https://drive.google.com/open?id=1_Dc148JPDCOCKZM2Q_Dw2iSg48hMGJ7IxvmI-5KGo3E
    relevance: 4
    method: haiku
    rationale: Archived folder. A 2025 SP GO-CAM guideline covering receptor, adaptor, sequestering and E3 ligase activity
      units, with substantive conventions. Its own header says the MF section must be compared with the official GOC guidelines,
      so the reviewed MF guideline supersedes it.
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED Transporter activity annotation guidelines.docx
    title: ARCHIVED Transporter activity annotation guidelines.docx
    url: https://drive.google.com/open?id=1h26nq-KExaYZKuBVKqJ2yWkK06dCWUQelZkTI262_PA
    relevance: 4
    method: haiku
    rationale: 'Archived folder. Transporter guideline: child terms of transmembrane transporter activity, has primary input,
      and has target start and end location, with a note that transports or maintains localization of should be retired. Reference
      only.'
  go-wiki:
  - id: wiki:11 MAR 2014 PAINT Conference Call
    title: 11 MAR 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/11_MAR_2014_PAINT_Conference_Call
    relevance: 5
    method: opus
    rationale: 'Spells out the PAINT propagation logic for positive vs NOT annotations: NOT propagates only to the annotated
      term, never to parents; mixed positive/NOT at the same or more general level ignores the NOT; positive general terms
      still propagate into a clade where a specific term is stopped. Historical (2014) but a self-contained statement of the
      NOT-propagation rules, so kept at 5.'
  - id: wiki:5 May 2020 PAINT Conference Call
    title: 5 May 2020 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/5_May_2020_PAINT_Conference_Call
    relevance: 5
    method: opus
    rationale: 'States PAINT policy for GAF 2.2 qualifiers: PAINT ignores gp2term qualifiers (except NOT) when deciding whether
      an experimental annotation supports an IBD, and IBD/IBA defaults are involved_in (BP), is_active_in (CC), enables or
      contributes_to (MF). Current-era (2020) explicit policy, kept at 5.'
  - id: wiki:Annotating binding
    title: Annotating binding
    url: https://wiki.geneontology.org/index.php/Annotating_binding
    relevance: 5
    method: opus
    rationale: 'Annotation guideline on binding: MF binding terms are for biologically meaningful interactions, IPI with partner
      in with/from is required for GO:0005515, has_input captures the physiological partner (with/from for the assayed one),
      prefer specific binding child terms, and do not annotate substrate/cofactor binding. Marked PROPOSAL 2020 / TO BE REVIEWED,
      but it is the guideline page itself, so 5.'
  - id: wiki:Annotating downstream processes
    title: Annotating downstream processes
    url: https://wiki.geneontology.org/index.php/Annotating_downstream_processes
    relevance: 5
    method: opus
    rationale: 'Annotation guideline: annotate the gene product''s direct activity rather than downstream consequences of
      core processes (RNA Pol II, spliceosome examples), request specific ''X involved in Y'' terms, treat ligand availability
      as regulation of the signaling pathway, and revise downstream annotations as knowledge improves. Guideline page flagged
      TO BE REVIEWED against newer acts_upstream_of relations; still 5.'
  - id: wiki:Annotating from phenotypes
    title: Annotating from phenotypes
    url: https://wiki.geneontology.org/index.php/Annotating_from_phenotypes
    relevance: 5
    method: opus
    rationale: 'Core guideline for phenotype-based BP annotation: annotations reflect normal function, ''required for'' is
      not ''involved in'', beware read-outs, pleiotropy and high-level phenotypes, use acts_upstream_of_or_within when mechanism
      is unknown, regulation needs MF-level evidence, and revisit old IMP annotations. Current guideline (reviewed 2018),
      clearly 5.'
  - id: wiki:Annotating regulation
    title: Annotating regulation
    url: https://wiki.geneontology.org/index.php/Annotating_regulation
    relevance: 5
    method: opus
    rationale: 'Guideline on choosing a process term versus its regulation term: define process boundaries, annotate the parent
      process (acts_upstream_of_or_within) when unsure, consider allele type and assay for IMP, do not annotate pathway members
      that activate the next step as regulators, and limiting components are not regulators. Guideline page marked TO BE REVIEWED,
      but states practice, so 5.'
  - id: wiki:Annotation Assigned by
    title: Annotation Assigned by
    url: https://wiki.geneontology.org/index.php/Annotation_Assigned_by
    relevance: 5
    method: opus
    rationale: 'Draft documentation of the assigned_by (GAF col 15) convention: credit the group that made the annotation
      decision; InterPro2GO is assigned_by InterPro; SPKW2GO, SPSL2GO, HAMAP2GO are UniProtKB; EC2GO credits the source dataset,
      with matching GO_REFs. Self-contained convention document, though a 2014 draft and partly dated (SPKW annotations since
      retired), so kept at 5 with that caveat.'
  - id: wiki:Annotation Conf. Call 2016-03-22
    title: Annotation Conf. Call 2016-03-22
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-03-22
    relevance: 5
    method: opus
    rationale: Contains the full approved text of GO_REF:0000111 (IC annotations supported by at least one ISS annotation;
      with/from must list all supporting GO ids) and the matching website documentation, approved on this call; also discusses
      restricting has_participant to legacy data. Establishes an evidence/reference convention (2016, still current), kept
      at 5.
  - id: wiki:Annotation Conf. Call 2019-11-19
    title: Annotation Conf. Call 2019-11-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-11-19
    relevance: 5
    method: opus
    rationale: 'Gives explicit reannotation rules for the ''activated by''/''inhibited by'' extensions: endogenous direct
      regulators become a binding annotation that directly_positively/negatively_regulates the activity, binding-term extensions
      become has_input, competitive inhibitors/decoys directly negatively regulate the downstream activity, and unknown mechanisms
      are no longer captured. Self-contained rule set (2019), kept at 5.'
  - id: wiki:Annotation Conf. Call 2020-02-04
    title: Annotation Conf. Call 2020-02-04
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-02-04
    relevance: 5
    method: opus
    rationale: Records the ontology-editor decision that curators annotate to 'binding' with has_input ChEBI rather than requesting
      new pre-composed chemical binding terms, and that 'directly regulates' is only used between activities of different
      gene products; also has_direct_input to has_input and occurs_at to occurs_in. Explicit policy statements (2020); the
      binding-term criteria were left for future review, so possibly partly superseded.
  - id: wiki:Annotation Conf. Call 2021-08-03
    title: Annotation Conf. Call 2021-08-03
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2021-08-03
    relevance: 5
    method: opus
    rationale: 'States the guidelines from the RHEA ontology jamboree: create enzyme terms only for characterised reactions
      (annotate L-amino acid/D-sugar forms by default), GO MF specificity matches enzyme specificity not every substrate,
      and NAD(P) terms mean cofactor unknown with narrow xrefs to NAD and NADP reactions. Explicit current MF term/annotation
      conventions, kept at 5.'
  - id: wiki:Annotation Conf. Call 2024-03-12
    title: Annotation Conf. Call 2024-03-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-03-12
    relevance: 5
    method: opus
    rationale: 'Sets out current do-not-annotate subset policy: gocheck_do_not_annotate and do_not_manually_annotate merged
      into one subset (warning rule GORULE:0000008, Noctua and PAINT to block, QuickGO filter to be removed) and a new obsoletion_candidate
      subset and warning rule. Self-contained current policy statement, kept at 5.'
  - id: 'wiki:Annotation Extension field: Supplying temporal location information to a GO annotation'
    title: 'Annotation Extension field: Supplying temporal location information to a GO annotation'
    url: https://wiki.geneontology.org/index.php/Annotation_Extension_field%3A_Supplying_temporal_location_information_to_a_GO_annotation
    relevance: 5
    method: opus
    rationale: Guideline page on using exists_during in the annotation extension to record the cell-cycle or developmental
      stage at which a CC localization is observed, with S. pombe worked examples and a pointer to the BP occurs_in CC pattern.
      A documented extension convention; archived wiki (2014) and cell-cycle phase terms used are now obsolete, but the content
      is guidance, so 5.
  - id: 'wiki:Annotation Extension: Capturing cell and tissue types'
    title: 'Annotation Extension: Capturing cell and tissue types'
    url: https://wiki.geneontology.org/index.php/Annotation_Extension%3A_Capturing_cell_and_tissue_types
    relevance: 5
    method: opus
    rationale: 'Guideline for adding cell, tissue and anatomy context in extensions: part_of for CC and occurs_in for BP/MF,
      pipe/comma syntax, the rule that context does not imply exclusivity, and that immortalized cell lines are not evidence
      of cell-type context, with worked TLR4/Wnt7a examples. A standing guideline page (edited 2021), so 5.'
  - id: wiki:Annotation Relations
    title: Annotation Relations
    url: https://wiki.geneontology.org/index.php/Annotation_Relations
    relevance: 5
    method: opus
    rationale: Current reference page (edited 2026) defining GO-CAM contextual and causal relations and the standard gp2term
      relations per aspect, including default relations, when to use enables vs contributes to, involved in vs acts upstream
      of (or within) with directionality, and that colocalizes with is being deprecated. Authoritative current relation-use
      guidance, so 5.
  - id: 'wiki:Annotation consistency : ChIP experiments'
    title: 'Annotation consistency : ChIP experiments'
    url: https://wiki.geneontology.org/index.php/Annotation_consistency_%3A_ChIP_experiments
    relevance: 5
    method: opus
    rationale: Current guideline (reviewed 2023) that ChIP supports localization to chromatin (or a child) but not direct
      DNA binding unless the study is premised on direct binding (e.g. known motif). A concise, explicit evidence-interpretation
      rule, so 5.
  - id: wiki:Apoptosis Curation Manual
    title: Apoptosis Curation Manual
    url: https://wiki.geneontology.org/index.php/Apoptosis_Curation_Manual
    relevance: 5
    method: opus
    rationale: Curation manual for cell death terms giving a decision tree from cell death down to apoptotic signaling and
      execution phases, rules for choosing extrinsic vs intrinsic pathways, restricting direct annotation to 'apoptotic process'
      when the phase is unknown, and adding cell type as an extension rather than using cell-type-specific terms where ISS
      would be lost. Explicit curator guideline (edited 2023), so 5.
  - id: wiki:Binding Guidelines
    title: Binding Guidelines
    url: https://wiki.geneontology.org/index.php/Binding_Guidelines
    relevance: 5
    method: opus
    rationale: Guideline that binding implied by an enzyme or transporter MF should not be co-annotated, binding is annotated
      only when binding is shown, with/col 16 target rules (only the direct target), and QC rules for GO:0005515 (no NOT,
      interactor in with, reciprocal IPI, no ISS). An explicit convention page; archived (2014) and some items marked UNRESOLVED,
      but the core rules stand, so 5.
  - id: wiki:Causally upstream of or within
    title: Causally upstream of or within
    url: https://wiki.geneontology.org/index.php/Causally_upstream_of_or_within
    relevance: 5
    method: opus
    rationale: Current relation guideline (reviewed 2023) stating that 'causally upstream of or within' must not be used directly
      in extensions or GO-CAMs and that a more specific child relation should always be chosen. Short but explicit policy,
      so 5.
  - id: wiki:Causally upstream of or within, negative effect
    title: Causally upstream of or within, negative effect
    url: https://wiki.geneontology.org/index.php/Causally_upstream_of_or_within%2C_negative_effect
    relevance: 5
    method: opus
    rationale: Current relation guideline (reviewed 2023) for linking an MF to a BP when a negative effect is shown but the
      mechanism is unknown, with the rule to use the mechanistic 'causally upstream of, negative effect' relation when the
      mechanism is known. Documented relation-use convention (no examples given), so 5.
  - id: wiki:Causally upstream of or within, positive effect
    title: Causally upstream of or within, positive effect
    url: https://wiki.geneontology.org/index.php/Causally_upstream_of_or_within%2C_positive_effect
    relevance: 5
    method: opus
    rationale: Current relation guideline (reviewed 2023) for linking an MF to a BP when a positive effect is shown but the
      mechanism is unknown, directing curators to mechanistic relations when the mechanism is known. Documented relation-use
      convention (no examples given), so 5.
  - id: wiki:Causally upstream of, negative effect
    title: Causally upstream of, negative effect
    url: https://wiki.geneontology.org/index.php/Causally_upstream_of%2C_negative_effect
    relevance: 5
    method: opus
    rationale: Current GO-CAM relation guideline (reviewed 2023) for MF-to-MF negative causal links of unknown mechanism,
      GO-CAM-only, with what-not-to-capture pointing to more specific relations and a note that curators should usually be
      able to pick a more specific one. Explicit relation-use guidance, though thin on examples, so 5.
  - id: wiki:Causally upstream of, positive effect
    title: Causally upstream of, positive effect
    url: https://wiki.geneontology.org/index.php/Causally_upstream_of%2C_positive_effect
    relevance: 5
    method: opus
    rationale: Current GO-CAM relation guideline (reviewed 2023) for MF-to-MF positive causal links of unknown mechanism,
      GO-CAM-only, directing use of more specific causal relations when the mechanism is known. Explicit relation-use guidance,
      though without examples, so 5.
  - id: wiki:Chromatin remodeling manual
    title: Chromatin remodeling manual
    url: https://wiki.geneontology.org/index.php/Chromatin_remodeling_manual
    relevance: 5
    method: opus
    rationale: Current annotation guideline (reviewed 2025) mapping chromatin processes (replication-dependent assembly/disassembly,
      heterochromatin formation, transcription-coupled remodeling, DNA repair) and MFs (histone chaperone, modifier, reader
      activities) to GO terms, including the rule that proteins with both reader and writer activity get both MFs and a table
      linking histone marks to BPs. Explicit domain curation manual, so 5.
  - id: wiki:Colocalizes with
    title: Colocalizes with
    url: https://wiki.geneontology.org/index.php/Colocalizes_with
    relevance: 5
    method: opus
    rationale: Relation guidance stating that 'colocalizes with' is no longer advised and existing annotations are under review,
      and that if a CC is where the activity occurs the correct relation is 'is active in', even for transient localization.
      Explicit practice decision on a gp2term relation; review date 2018 but consistent with the current Annotation Relations
      page, so 5.
  - id: 'wiki:Column 16: Function x Process x Component extensions'
    title: 'Column 16: Function x Process x Component extensions'
    url: https://wiki.geneontology.org/index.php/Column_16%3A_Function_x_Process_x_Component_extensions
    relevance: 5
    method: opus
    rationale: 'Guideline on GO IDs in extensions: part_of for function-in-process, occurs_in for process-in-component, prefer
      pre-composed terms or request new terms, don''t restate entailed links, and add redundant plain annotation lines. A
      documented convention, though archived (2014) and partly superseded by GO-CAM and current extension practice, so 5 with
      an out-of-date caveat.'
  - id: 'wiki:Column 16: linking GO functions, processes, and components in one annotation'
    title: 'Column 16: linking GO functions, processes, and components in one annotation'
    url: https://wiki.geneontology.org/index.php/Column_16%3A_linking_GO_functions%2C_processes%2C_and_components_in_one_annotation
    relevance: 5
    method: opus
    rationale: Shorter restatement of the col 16 GO-ID extension convention (co-annotation loses information, part_of for
      function-in-process, don't restate entailed kinase/phosphorylation links, add redundant lines). Guideline content, but
      archived (2014) and a near-duplicate of the longer Function x Process x Component page, so 5 with a duplicate/out-of-date
      note.
  - id: wiki:Constitutively upstream of
    title: Constitutively upstream of
    url: https://wiki.geneontology.org/index.php/Constitutively_upstream_of
    relevance: 5
    method: opus
    rationale: Current GO-CAM relation guideline (reviewed 2023, edited 2026) defining 'constitutively upstream of' for required
      but non-regulatory upstream activities (e.g. palmitoylation of NRAS by Zdhhc9), with what to capture and not capture
      and a worked GO-CAM. Explicit relation-use convention, so 5.
  - id: wiki:Contributes to
    title: Contributes to
    url: https://wiki.geneontology.org/index.php/Contributes_to
    relevance: 5
    method: opus
    rationale: 'Current guideline (reviewed 2023, edited 2026) on the contributes_to qualifier: only for irreducible molecular
      machines, a three-question checklist, worked examples (ATP citrate lyase, RNA Pol II core, ATP synthase) and out-of-scope
      rules (single catalytic subunit or homomer uses enables; regulatory subunits get regulator activity; unknown catalytic
      subunit gets no MF). Core annotation policy, so 5.'
  - id: wiki:Contributing GO Annotations
    title: Contributing GO Annotations
    url: https://wiki.geneontology.org/index.php/Contributing_GO_Annotations
    relevance: 5
    method: opus
    rationale: 'Current GOC policy (reviewed September 2026) on contributing annotations: same evidence standards for all
      sets, large-scale/LLM sets only within pre-agreed frameworks with manual curator review, LLM-assisted associations reviewed
      by curators use experimental evidence codes, GAF 2.2 and GO rules conformance, and how to request corrections. Consortium
      policy directly on point, so 5.'
  - id: wiki:Development
    title: Development
    url: https://wiki.geneontology.org/index.php/Development
    relevance: 5
    method: opus
    rationale: 'GO editors'' guideline for development terms: the standard x development / morphogenesis / formation / structural
      organization / maturation part_of structure, standard textual definitions, and how development differs from morphogenesis,
      maturation and metamorphosis (with imaginal-disc exception). Agreed 2003, page last edited 2018 and still the reference
      convention; a substantive guideline document.'
  - id: wiki:Directly negatively regulates
    title: Directly negatively regulates
    url: https://wiki.geneontology.org/index.php/Directly_negatively_regulates
    relevance: 5
    method: opus
    rationale: 'Official GO-CAM relation guideline: use ''directly negatively regulates'' only between activities in direct
      succession with a known mechanism (effect on the enabler, or removal of an activator); do not capture constitutive upstream
      activities. Current, reviewed February 2023 by named curators.'
  - id: wiki:Directly positively regulates
    title: Directly positively regulates
    url: https://wiki.geneontology.org/index.php/Directly_positively_regulates
    relevance: 5
    method: opus
    rationale: 'Official GO-CAM relation guideline: ''directly positively regulates'' links successive MFs with no intervening
      activity where the upstream activity enhances the downstream enabler; constitutive upstream activity is not captured.
      Current, reviewed February 2023, with EGF/MAPK examples.'
  - id: wiki:Elements of an annotation
    title: Elements of an annotation
    url: https://wiki.geneontology.org/index.php/Elements_of_an_annotation
    relevance: 5
    method: opus
    rationale: 'Core current annotation guideline (reviewed 2026-03) covering annotation subject, relations, extensions, evidence,
      reference and assigned_by, with a detailed NOT policy: NOT propagates down, use only when a property would be expected,
      not for negative/inconclusive results or with extensions, and IKR for sequence-based NOTs.'
  - id: wiki:Enables
    title: Enables
    url: https://wiki.geneontology.org/index.php/Enables
    relevance: 5
    method: opus
    rationale: 'Official gene-product-to-term relation guideline: ''enables'' when the gene product performs the MF itself;
      accessory subunits should not get the MF but adaptor or regulator activity instead, with contributes_to for multi-subunit
      activities. Current documentation (reviewed 2018).'
  - id: wiki:Guide to GO Evidence Codes
    title: Guide to GO Evidence Codes
    url: https://wiki.geneontology.org/index.php/Guide_to_GO_Evidence_Codes
    relevance: 5
    method: opus
    rationale: 'Canonical current guide to GO evidence codes: categories, ECO mappings, the principle that evidence codes
      are not quality measures, multiple annotations with different codes from one paper, and the decision tree. Core annotation
      guideline (last edit 2025).'
  - id: wiki:Guidelines for GO textual definitions
    title: Guidelines for GO textual definitions
    url: https://wiki.geneontology.org/index.php/Guidelines_for_GO_textual_definitions
    relevance: 5
    method: opus
    rationale: 'Ontology editors'' guideline for textual definitions: genus-differentia form, no plurals/circularity/categorizers,
      design-pattern standard definitions, and definition cross-reference rules (PMID preferred, RHEA/EC for enzymes, no Reactome).
      Tagged ''BEING REVIEWED'' but reviewed April 2024; current.'
  - id: wiki:Guidelines for catalytic activity terms
    title: Guidelines for catalytic activity terms
    url: https://wiki.geneontology.org/index.php/Guidelines_for_catalytic_activity_terms
    relevance: 5
    method: opus
    rationale: 'Detailed current editor guideline for catalytic activity terms: in vivo substrate specificity, scope of positional/histone
      terms, bi-directional and multi-step reactions, criteria for obsoleting/merging, labels from EC, ''='' reaction definitions,
      EC/RHEA hierarchy, and GO''s NAD(P) convention (annotate both NAD and NADP terms if both used).'
  - id: wiki:Guidelines for checkpoints
    title: Guidelines for checkpoints
    url: https://wiki.geneontology.org/index.php/Guidelines_for_checkpoints
    relevance: 5
    method: opus
    rationale: 'Explicit annotation rule: do not annotate to checkpoint terms from mutations that activate the checkpoint
      (arrest shows the checkpoint works), only from mutations that inactivate it; repair genes go to ''response to checkpoint''
      terms. Short but complete, reusable policy for a class of terms.'
  - id: wiki:Guidelines for logical definitions
    title: Guidelines for logical definitions
    url: https://wiki.geneontology.org/index.php/Guidelines_for_logical_definitions
    relevance: 5
    method: opus
    rationale: 'Current (2026) ontology editors'' guideline for logical definitions: genus plus minimal necessary-and-sufficient
      differentiae, no OR, other relations as asserted superclasses, alignment with textual definitions, design-pattern examples,
      and has_part some binding for MF. Directly states editorial policy.'
  - id: wiki:Guidelines for new Binding terms
    title: Guidelines for new Binding terms
    url: https://wiki.geneontology.org/index.php/Guidelines_for_new_Binding_terms
    relevance: 5
    method: opus
    rationale: 'Brief but explicit editor policy: subclasses of GO:0005515 protein binding must represent general protein
      classes, not specific proteins, and new protein-containing complex binding terms must correspond to a protein-containing
      complex subclass. Current (2024).'
  - id: wiki:Guidelines for new Biological Processes
    title: Guidelines for new Biological Processes
    url: https://wiki.geneontology.org/index.php/Guidelines_for_new_Biological_Processes
    relevance: 5
    method: opus
    rationale: 'Editors'' guideline for new BP terms: discrete beginning and end in the definition, the is_a vs part_of test
      (does the whole parent process occur?), draft metabolic primary input/output rules, and disease/mutant processes out
      of scope. Partly an index of topic links, but the rules stated are real current policy.'
  - id: wiki:Guidelines for new Molecular Functions
    title: Guidelines for new Molecular Functions
    url: https://wiki.geneontology.org/index.php/Guidelines_for_new_Molecular_Functions
    relevance: 5
    method: opus
    rationale: 'Editors'' guideline for new MF terms: MF and BP must be orthogonal, ''activity'' suffix, in vivo substrate
      specificity, has_part for compound functions, regulator scope, NAD(P) convention and out-of-scope items. Current (reviewed
      2024) though it retains an older ''TO BE REVIEWED'' section on binding and grouping terms.'
  - id: wiki:Guidelines for using ChEBI terms
    title: Guidelines for using ChEBI terms
    url: https://wiki.geneontology.org/index.php/Guidelines_for_using_ChEBI_terms
    relevance: 5
    method: opus
    rationale: Ontology convention that GO uses the ChEBI major microspecies at pH 7.3, how to find it via RHEA/ChEBI, the
      build check and allow-list, and how to fix failures. Current editor policy (reviewed 2024, edited 2026).
  - id: wiki:Guidelines from Annotation Camp
    title: Guidelines from Annotation Camp
    url: https://wiki.geneontology.org/index.php/Guidelines_from_Annotation_Camp
    relevance: 5
    method: opus
    rationale: Workshop-derived annotation guidelines on downstream/indirect processes (annotate core processes, remove indirect
      ones as knowledge grows), avoiding redundant binding annotations, with/from vs extension usage, 'response to' term use
      and IEP vs IDA. Explicit guidance, but historical (c. 2007-2010) and partly superseded, e.g. its advice to request 'X
      involved in Y' terms conflicts with current practice.
  - id: wiki:Happens during
    title: Happens during
    url: https://wiki.geneontology.org/index.php/Happens_during
    relevance: 5
    method: opus
    rationale: 'Current annotation-extension guideline for happens_during: used only for temporal phases (biological phase
      or life stage), no longer for attaching a process of unclear relation (use part_of when it is part of the process),
      and exists_during for components. States the convention directly with examples.'
  - id: wiki:Has input
    title: Has input
    url: https://wiki.geneontology.org/index.php/Has_input
    relevance: 5
    method: opus
    rationale: 'Current guideline for the has_input extension/GO-CAM relation: specific molecular target of an MF or BP with
      a resolvable ID, direct physical interaction not required, separate annotations for different substrates, distinction
      from with/from, and what not to capture (redundant with term, currency chemicals, analogs, cofactors). Reviewed 2021.'
  - id: wiki:Has output
    title: Has output
    url: https://wiki.geneontology.org/index.php/Has_output
    relevance: 5
    method: opus
    rationale: 'Current guideline for the has_output extension: capture specific products more specific than the term, multiple
      outputs only for one reaction, and do not capture currency chemicals or products already in the definition, with worked
      examples. Reviewed 2021.'
  - id: wiki:Inferred by Curator (IC)
    title: Inferred by Curator (IC)
    url: https://wiki.geneontology.org/index.php/Inferred_by_Curator_%28IC%29
    relevance: 5
    method: opus
    rationale: 'Evidence-code guideline for IC: used when an annotation is inferred from other GO annotations, WITH/FROM must
      hold the supporting GO ID(s), comma for AND and pipe for OR, and GO_REF:0000036 when several sources are combined. Current
      policy (reviewed 2018) though its example terms are now obsolete.'
  - id: wiki:Inferred from Direct Assay (IDA)
    title: Inferred from Direct Assay (IDA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Direct_Assay_%28IDA%29
    relevance: 5
    method: opus
    rationale: 'Current evidence-code guideline for IDA: IDA vs IMP for heterologous/overexpression experiments, IPI rather
      than IDA when the binding partner can be identified, IDA for complex isolation via tagged subunit, and GORULEs forbidding
      IDA on binding/protein binding and WITH entries on IDA.'
  - id: wiki:Inferred from Electronic Annotation (IEA)
    title: Inferred from Electronic Annotation (IEA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Electronic_Annotation_%28IEA%29
    relevance: 5
    method: opus
    rationale: Current evidence-code guideline for IEA listing the GOC-sanctioned pipelines (EC, HAMAP, InterPro2GO, RHEA,
      UniProt keywords and subcellular locations, TreeGrafter, Ensembl Compara, ARBA), mandatory GO_REF and WITH/FROM, ISS/ISO
      when reviewed by a curator, and the IEA age rule. Notes that several mappings are under review (2026-03).
  - id: wiki:Inferred from Experiment (EXP)
    title: Inferred from Experiment (EXP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Experiment_%28EXP%29
    relevance: 5
    method: opus
    rationale: 'Evidence-code guideline: EXP is the parent experimental code and curators should use the specific IDA/IPI/IMP/IGI/IEP
      codes instead; no WITH/FROM for EXP. Short but directly prescriptive and current.'
  - id: wiki:Inferred from Expression Pattern (IEP)
    title: Inferred from Expression Pattern (IEP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Expression_Pattern_%28IEP%29
    relevance: 5
    method: opus
    rationale: Evidence-code guideline restricting IEP to Biological Process terms (GORULE:0000006), only for normal expression
      patterns, with a list of overexpression, localisation and binding cases that should use IDA, IMP or IPI instead. Current
      policy.
  - id: wiki:Inferred from Genetic Interaction (IGI)
    title: Inferred from Genetic Interaction (IGI)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Genetic_Interaction_%28IGI%29
    relevance: 5
    method: opus
    rationale: 'Detailed current evidence-code guideline for IGI: when to use IGI vs IMP (multiple vs single perturbation),
      suppression/enhancement/synthetic, co-transfection and complementation cases, WITH/FROM rules (pipe vs comma), reciprocal
      annotations, and cases that must not use IGI (same-gene rescue, miRNA reporter assays).'
  - id: wiki:Inferred from Genomic Context (IGC)
    title: Inferred from Genomic Context (IGC)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Genomic_Context_%28IGC%29
    relevance: 5
    method: opus
    rationale: 'Official IGC evidence-code page: when operon, synteny and pathway/genome-scale reconstruction justify IGC,
      that process annotations require the whole process to be present in the organism, and WITH/FROM conventions (neighbour
      genes or pathway ID; GO_REF for unpublished methods). Current (reviewed 2018, edited 2025); a guideline document, so
      5.'
  - id: wiki:Inferred from High Throughput Direct Assay (HDA)
    title: Inferred from High Throughput Direct Assay (HDA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_High_Throughput_Direct_Assay_%28HDA%29
    relevance: 5
    method: opus
    rationale: 'Official HDA evidence-code policy: which assays qualify, proteomics criteria (peptide FDR <1%, at least 2
      unique peptides, purification quality checks) and fluorescence-localisation screens, with low-throughput validation
      annotated as IDA in addition. Current guideline (reviewed 2018); 5.'
  - id: wiki:Inferred from High Throughput Experiment (HTP)
    title: Inferred from High Throughput Experiment (HTP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_High_Throughput_Experiment_%28HTP%29
    relevance: 5
    method: opus
    rationale: 'Official HTP evidence-code policy: what counts as high-throughput data, same quality standard as low-throughput,
      <1% false-positive target, annotate the conclusion not the assay, subsets allowed, no minimum dataset size, no WITH/FROM.
      Current consortium guideline; 5.'
  - id: wiki:Inferred from High Throughput Mutant Phenotype (HMP)
    title: Inferred from High Throughput Mutant Phenotype (HMP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_High_Throughput_Mutant_Phenotype_%28HMP%29
    relevance: 5
    method: opus
    rationale: 'Official HMP evidence-code policy: never annotate a primary RNAi screen, require off-target controls, replicates,
      Z-factor >= 0.5 and independent validation, and check that the phenotype directly supports the term. Current guideline
      (reviewed 2018); 5.'
  - id: wiki:Inferred from Key Residues (IKR)
    title: Inferred from Key Residues (IKR)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Key_Residues_%28IKR%29
    relevance: 5
    method: opus
    rationale: 'Official IKR evidence-code page: every IKR row carries NOT, WITH/FROM is mandatory for GO_REF-based IKR, and
      an experimental NOT (IDA) is used instead or as well when lack of activity is assayed, with a caution about family exceptions
      (WNK1). Current guideline; 5.'
  - id: wiki:Inferred from Mutant Phenotype (IMP)
    title: Inferred from Mutant Phenotype (IMP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Mutant_Phenotype_%28IMP%29
    relevance: 5
    method: opus
    rationale: 'Official IMP evidence-code policy: allele and perturbation comparisons (including inhibitors and RNAi), IMP
      versus IDA for overexpression/transfection, IMP plus an extension when gene A''s mutation informs gene B, and WITH/FROM
      for allele IDs. Current (edited 2026); 5.'
  - id: wiki:Inferred from Physical Interaction (IPI)
    title: Inferred from Physical Interaction (IPI)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Physical_Interaction_%28IPI%29
    relevance: 5
    method: opus
    rationale: 'Official IPI evidence-code policy: an interactor ID is required in WITH/FROM, IPI must not be used for catalytic
      activity, unidentified-partner binding uses IDA, and the GORULE checks are listed. Current guideline, though it cites
      obsolete GO:0043234 and the reciprocal protein-binding rule may be dated; 5.'
  - id: wiki:Inferred from Reviewed Computational Analysis (RCA)
    title: Inferred from Reviewed Computational Analysis (RCA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Reviewed_Computational_Analysis_%28RCA%29
    relevance: 5
    method: opus
    rationale: 'Official RCA evidence-code page: RCA is for integrated analysis of large-scale or multi-type data; sequence-only
      analysis uses ISS, unreviewed predictions use IEA, single experimental results use IPI/IGI/IEP. Current; notes the code
      label was renamed to ''automatically integrated combinatorial evidence''. Guideline, so 5.'
  - id: wiki:Inferred from Sequence Alignment (ISA)
    title: Inferred from Sequence Alignment (ISA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Sequence_Alignment_%28ISA%29
    relevance: 5
    method: opus
    rationale: 'Official ISA evidence-code policy: the match protein must be experimentally characterised (to stop transitive
      annotation errors), curator review of the alignment, ISO when orthology is established, mandatory WITH, IEA for any
      automated step, with worked examples. Current; 5.'
  - id: wiki:Inferred from Sequence Model (ISM)
    title: Inferred from Sequence Model (ISM)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Sequence_Model_%28ISM%29
    relevance: 5
    method: opus
    rationale: 'Official ISM evidence-code policy: manually reviewed model hits (HMM, PROSITE, InterPro, tRNAscan) use ISM,
      automated hits use IEA, and curators must judge how functionally specific a model is (e.g. CUB domain is uninformative).
      Gives WITH rules per model type. Current; 5.'
  - id: wiki:Inferred from Sequence Orthology (ISO)
    title: Inferred from Sequence Orthology (ISO)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Sequence_Orthology_%28ISO%29
    relevance: 5
    method: opus
    rationale: 'Official ISO evidence-code policy: orthology criteria, mandatory WITH naming experimentally supported orthologs
      (all paralogs where one-to-many), GO_REF use (e.g. MGI GO_REF:0000096), updating annotations when orthology predictions
      change, and IEA for bulk transfer. Current; 5.'
  - id: wiki:Inferred from Sequence or structural Similarity (ISS)
    title: Inferred from Sequence or structural Similarity (ISS)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Sequence_or_structural_Similarity_%28ISS%29
    relevance: 5
    method: opus
    rationale: 'Core ISS evidence-code policy: ISS as umbrella for ISA/ISM/ISO, mandatory WITH whose gene product must have
      experimental or IC support, GO_REF:0000024 for curator analyses, a caution about transferring from HTP-based annotations,
      and GORULE checks. Current (reviewed 2024); 5.'
  - id: wiki:LncRNA GO annotation manual
    title: LncRNA GO annotation manual
    url: https://wiki.geneontology.org/index.php/LncRNA_GO_annotation_manual
    relevance: 5
    method: opus
    rationale: 'Current annotation guideline (edited 2025) for lncRNAs: decision tree for miRNA sponge/inhibitor versus target-directed
      miRNA degradation, evidence rules for GO:0140869 and has_input/occurs_in extensions, and worked annotations per activity
      class (adaptor, sequestering, condensate scaffold). Curator SOP; 5.'
  - id: wiki:Localizes
    title: Localizes
    url: https://wiki.geneontology.org/index.php/Localizes
    relevance: 5
    method: opus
    rationale: 'Annotation-extension documentation for the localizes relation (and the directly_/indirectly_localizes subtypes):
      it names the entity whose location a localization or transport process establishes, with column-16 examples. A documented
      convention, though old (2014) and from the GAF column-16 era; 5.'
  - id: wiki:Located in
    title: Located in
    url: https://wiki.geneontology.org/index.php/Located_in
    relevance: 5
    method: opus
    rationale: 'Gene-product-to-term relation guideline: located_in links a gene product to a cellular anatomical entity where
      it is detected; complexes use part_of and active locations use is_active_in. A brief but direct current rule (2024),
      although the examples and review sections are empty and the headings wrongly say has_input; 5.'
  - id: wiki:Manager 09Feb11
    title: Manager 09Feb11
    url: https://wiki.geneontology.org/index.php/Manager_09Feb11
    relevance: 5
    method: haiku
    rationale: Records a managers' consortium decision not to obsolete terms when definition edits will not make existing
      annotations incorrect, with annotators using curator reports to refine annotations. This is an explicit policy for handling
      definition changes.
  - id: wiki:Membrane proteins
    title: Membrane proteins
    url: https://wiki.geneontology.org/index.php/Membrane_proteins
    relevance: 5
    method: opus
    rationale: 'GO editors'' convention page (edited 2026): CC terms describe locations, so integral and peripheral membrane
      protein are only non-exact synonyms. Location is expressed as side of membrane or embedded in membrane, monotopic proteins
      go to GO:0098552, and type I/II classes are not CC terms. A short current convention that directly guides CC annotation;
      5.'
  - id: wiki:MicroRNA GO annotation manual
    title: MicroRNA GO annotation manual
    url: https://wiki.geneontology.org/index.php/MicroRNA_GO_annotation_manual
    relevance: 5
    method: opus
    rationale: 'Current annotation guideline (edited 2026) for the miRNA processing machinery and miRNA gene silencing: annotate
      miRNA roles only from IDA (mimic) or IMP (inhibition) and never IEP, put no miRNA/mRNA IDs in extensions on core processing
      proteins, use ribonuclease III activity for DROSHA/DICER1, and only AGO2 cleaves. A curator SOP; 5.'
  - id: wiki:Multi-species processes
    title: Multi-species processes
    url: https://wiki.geneontology.org/index.php/Multi-species_processes
    relevance: 5
    method: opus
    rationale: 'Annotation guideline for gene products acting on other organisms: use the multi-organism process and other-organism
      CC nodes, dual taxon IDs, host/symbiont nomenclature, and request ''in host'' terms rather than annotating to normal
      host terms. The content is guidance, but the page is flagged TO BE REVIEWED and is largely superseded (GO:0051704 node
      restructured, dual taxon deprecated); scored on content.'
  - id: wiki:No biological Data available (ND) evidence code
    title: No biological Data available (ND) evidence code
    url: https://wiki.geneontology.org/index.php/No_biological_Data_available_%28ND%29_evidence_code
    relevance: 5
    method: opus
    rationale: 'Current evidence-code guideline: ND only on the three root terms with GO_REF:0000015, means a curator looked
      and found nothing, papers lacking GO-relevant data still warrant ND, a NOT annotation needs a positive (ND root) annotation,
      and root-term relations (involved_in/enables/is_active_in). Current (reviewed 2018, edited 2020); a direct guideline,
      so 5.'
  - id: wiki:Non-catalytic Molecular Functions
    title: Non-catalytic Molecular Functions
    url: https://wiki.geneontology.org/index.php/Non-catalytic_Molecular_Functions
    relevance: 5
    method: opus
    rationale: Annotation guideline that each gene product should have at least one term per aspect and that MF annotation
      should aim beyond binding/protein binding, listing the non-catalytic MF terms to use instead (carrier, adaptor, sequestering,
      cargo receptor, chaperones, structural, complex stabilizing, etc.) with definitions. Current (edited 2025); direct guidance,
      5.
  - id: wiki:Non-traceable Author Statement (NAS)
    title: Non-traceable Author Statement (NAS)
    url: https://wiki.geneontology.org/index.php/Non-traceable_Author_Statement_%28NAS%29
    relevance: 5
    method: opus
    rationale: 'Evidence-code guideline for NAS: use when an author statement has no results or cited reference (including
      uncited database records), with a worked CELF3 example, and the rules that cited statements use TAS and inferences from
      other annotations plus common knowledge use IC. Current guideline (reviewed 2018), so 5.'
  - id: wiki:Obsoleting an Existing Ontology Term
    title: Obsoleting an Existing Ontology Term
    url: https://wiki.geneontology.org/index.php/Obsoleting_an_Existing_Ontology_Term
    relevance: 5
    method: opus
    rationale: 'Editor SOP for obsoletion: check annotation and ontology/subset usage, open an annotation review request,
      notify with a 7-day window, handle xrefs, use replaced_by vs consider, and the standard list of obsoletion reasons (e.g.
      pre-composed terms better as GO-CAM, phenotypes, assays). Current (edited 2026-08); a documented procedure directly
      affecting annotation, so 5.'
  - id: wiki:Occurs in
    title: Occurs in
    url: https://wiki.geneontology.org/index.php/Occurs_in
    relevance: 5
    method: opus
    rationale: 'Annotation-extension guideline for occurs_in: nested locations as compound extensions, separate annotations
      for distinct locations, do not repeat locations implied by the term, and only use occurs_in on a BP when all its steps
      occur there; domain/range and worked examples. Current (reviewed 2021); direct guidance, 5.'
  - id: wiki:PAINT annotation guidelines
    title: PAINT annotation guidelines
    url: https://wiki.geneontology.org/index.php/PAINT_annotation_guidelines
    relevance: 5
    method: opus
    rationale: 'PAINT curation SOP: only experimental annotations support IBD, NOT/loss via experiment, IKR or IRD, criteria
      for propagating from single papers or HTP data, MRCA-based node choice options, conservative BP propagation, and terms
      never to propagate (protein binding, redundant one-step BPs). Current published guideline (Gaudet et al. 2011); 5.'
  - id: wiki:Part of relation
    title: Part of relation
    url: https://wiki.geneontology.org/index.php/Part_of_relation
    relevance: 5
    method: opus
    rationale: 'Relation guideline: part of links MF to BP, BP to BP and anatomy to anatomy (GO-CAM and extensions), gene
      products to protein-containing complexes in standard annotation, and gene products to cellular anatomical entities must
      use located in/is active in instead. Current (reviewed 2023); direct guidance, 5.'
  - id: wiki:Principles for creating a GO term
    title: Principles for creating a GO term
    url: https://wiki.geneontology.org/index.php/Principles_for_creating_a_GO_term
    relevance: 5
    method: opus
    rationale: 'Editor principles for term creation: aspect definitions, terms represent activities not gene products (''class''
      wording when a product name is unavoidable), no anatomical qualifiers in MF/BP, spelling/style rules, and dependent-term
      rules (X metabolism if X biosynthesis exists). Marked ''being reviewed'' but substantive and current; 5.'
  - id: wiki:Principles for term obsoletion
    title: Principles for term obsoletion
    url: https://wiki.geneontology.org/index.php/Principles_for_term_obsoletion
    relevance: 5
    method: opus
    rationale: 'Policy on when to obsolete: a change of meaning needs a new ID, label/definition rewording does not, incorrect
      annotations are not a reason to obsolete (notify the submitter), editors should be conservative, and obsolete terms
      may be restored. Current editor policy; 5.'
  - id: wiki:Protein complexes
    title: Protein complexes
    url: https://wiki.geneontology.org/index.php/Protein_complexes
    relevance: 5
    method: opus
    rationale: 'Current GO editors'' page defining protein-containing complex: acceptable versus non-acceptable experimental
      evidence (no simple IP, pull-down, colocalization or 2-hybrid), in/out of scope (no transient enzyme-substrate, no partial
      complexes, no stoichiometry), species-agnostic naming and definitions, and capable_of / capable_of_part_of links. Reviewed
      2023, edited 2025; includes some PROPOSED definitions. A documented convention, keep 5.'
  - id: wiki:Provides input for
    title: Provides input for
    url: https://wiki.geneontology.org/index.php/Provides_input_for
    relevance: 5
    method: opus
    rationale: 'Current GO-CAM relation guideline (reviewed 2023, edited 2026): use provides_input_for between successive
      MFs only when the intermediate is a macromolecule or not in ChEBI; otherwise connect via has_output/has_input with the
      ChEBI entity. Explicit capture and not-capture rules with an example, keep 5.'
  - id: wiki:RefG Princeton April 12-13 2010
    title: RefG Princeton April 12-13 2010
    url: https://wiki.geneontology.org/index.php/RefG_Princeton_April_12-13_2010
    relevance: 5
    method: opus
    rationale: 'Workshop page whose first section is an explicit PAINT propagation SOP: annotate most specific term and propagate
      as deep as justified, account for every experimental annotation, do not propagate protein binding/binding/enzyme binding,
      scoping rules for BP relative to MF/CC and targets, and NOT/rapid-divergence handling with mandatory notes. Historical
      (2010) and superseded by later PAINT SOPs, but it states the guidance directly; keep 5.'
  - id: wiki:Removes input for
    title: Removes input for
    url: https://wiki.geneontology.org/index.php/Removes_input_for
    relevance: 5
    method: opus
    rationale: 'Current GO-CAM relation guideline (reviewed Feb 2023): use removes_input_for when an upstream activity modifies
      the same target site so the downstream activity loses its input (histone/ubiquitin code, CpG methylation), not for inducible
      regulatory substrate removal. Clear capture/not-capture rules with examples, keep 5.'
  - id: wiki:SiRNA GO annotation manual
    title: SiRNA GO annotation manual
    url: https://wiki.geneontology.org/index.php/SiRNA_GO_annotation_manual
    relevance: 5
    method: opus
    rationale: 'Current (2025) curation manual for siRNA-mediated silencing: annotate proteins even when no siRNA identifier
      exists, choose mRNA-destabilization vs translation-inhibition terms by whether mRNA levels fall, MF only for identifiable
      siRNAs, and rules for facultative/pericentric heterochromatin, siRNA-directed DNA methylation and TE silencing terms,
      plus a decision tree. Keep 5.'
  - id: wiki:Species-Specific Terms
    title: Species-Specific Terms
    url: https://wiki.geneontology.org/index.php/Species-Specific_Terms
    relevance: 5
    method: opus
    rationale: 'Ontology convention (2018 copy of a GO website page): when a concept differs by organism, subclasses are distinguished
      by structure/composition (e.g. fungal-type vs plant-type cell wall), not by taxon; sensu is deprecated; taxon constraints
      exist. Short but a direct documented convention, keep 5 (taxon-check file location is out of date).'
  - id: wiki:Tips to Produce High Quality Annotations
    title: Tips to Produce High Quality Annotations
    url: https://wiki.geneontology.org/index.php/Tips_to_Produce_High_Quality_Annotations
    relevance: 5
    method: opus
    rationale: 'Current (reviewed Nov 2025) annotation best-practice page: curate pathway/gene-centrically, annotate core
      function only, capture the conclusion not the assay (e.g. wound-healing assay is not wound healing), annotate normal
      function, check term parentage, remove outdated annotations, and AI-suggested associations need manual review and then
      take experimental codes. Keep 5.'
  - id: wiki:Traceable Author Statement (TAS)
    title: Traceable Author Statement (TAS)
    url: https://wiki.geneontology.org/index.php/Traceable_Author_Statement_%28TAS%29
    relevance: 5
    method: opus
    rationale: 'Evidence-code guideline (reviewed 2018): TAS is for author statements attributed to a cited source, no with/from,
      not for textbook common knowledge (use IC), NAS for uncited statements, and remove TAS once an experimental annotation
      to the same term exists. Keep 5.'
  - id: wiki:Transmembrane Proteins
    title: Transmembrane Proteins
    url: https://wiki.geneontology.org/index.php/Transmembrane_Proteins
    relevance: 5
    method: opus
    rationale: 'Annotation guideline allowing experimental membrane localization plus predicted TM domains to support ''integral
      to membrane'' children, with a caution on N-terminal single TM segments acting as signal peptides, and a pipeline plan
      for legacy annotations. The guidance is direct, but out of date: GO:0016021 and the integral-to-X-membrane terms have
      since been obsoleted.'
  - id: wiki:08 FEB 2011 RefGen Phone Conference (Archived)
    title: 08 FEB 2011 RefGen Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/08_FEB_2011_RefGen_Phone_Conference_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived call that establishes that PAINT annotations are ISS-like phylogenetic inferences and debates when
      curation should go beyond triangulation, with the decision to justify manual curation over a precomputed script. This
      clarifies a general practice for IBA-style propagation.
  - id: wiki:1 Jun 2021 PAINT Conference Call
    title: 1 Jun 2021 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/1_Jun_2021_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: 'Sets out how taxon constraints apply to PAINT objects: experimental annotations valid for IBD evidence unless
      they violate a constraint, IBDs obsoleted on violation or loss of evidence, and TCVs blocking IBA propagation. This
      documents an explicit validation rule.'
  - id: wiki:10 July 2024 PAINT Conference Call
    title: 10 July 2024 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/10_July_2024_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Decides that do-not-annotate terms should be labelled so they are filtered from curation and automated updates,
      and that the 505 affected families are re-curated before the PANTHER 19 transition, a decision recorded for a class
      of terms.
  - id: wiki:10 June 2014 PAINT Conference Call
    title: 10 June 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/10_June_2014_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Records the group decision that a well-conserved family with only single-species evidence can be propagated,
      and debates whether drug-binding (FK506) should be annotated as a binding activity at all. This is a general practice
      question about compound binding terms.
  - id: wiki:10 June 2026 PAINT Conference Call
    title: 10 June 2026 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/10_June_2026_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Records the decision that IPI, IGI and HGI are removed from the curation window and PAINT-curated IPI/IGI rows
      are recurated as EXP, because GAF 2.2 requires the with/from column for those codes; a decision for a class of evidence
      codes.
  - id: wiki:10 MAY 2011 RefGen Phone Conference (Archived)
    title: 10 MAY 2011 RefGen Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/10_MAY_2011_RefGen_Phone_Conference_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived call restating the PAINT evidence-code definitions and pruning convention, plus the 'response to'
      definition change; the guidance is repeated from the April 2011 call and the 'response to' decision remains unconfirmed.
  - id: wiki:10 NOV 2009 RefGen Phone Conference (Archived)
    title: 10 NOV 2009 RefGen Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/10_NOV_2009_RefGen_Phone_Conference_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived call that proposes a standard review procedure for PAINT-generated ISS annotations (consistency with
      known gene biology, justified inference from the source relationship, feedback to the PAINT curator). This is a general
      SOP for handling phylogenetic inferences.
  - id: wiki:10 November 2020 PAINT Conference Call
    title: 10 November 2020 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/10_November_2020_PAINT_Conference_Call
    relevance: 4
    method: opus
    rationale: PAINT call minutes that briefly confirm default IBD/IBA qualifiers (BP involved_in, MF enables, CC is_active_in,
      complexes part_of) and note contradictory-NOT handling; the rest is taxon-ID mismatches, species naming and with/from
      length logistics. Historical minutes (2020) recording a decision made in a ticket rather than a guideline document,
      so 4.
  - id: wiki:11 Feb 2026 PAINT Conference Call
    title: 11 Feb 2026 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/11_Feb_2026_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Decides that CC and BP terms after a horizontal transfer node are blocked from PAINT propagation using a clade
      rule, and proposes renaming extracellular space to intercellular space to avoid unicellular/multicellular confusion;
      the HGT blocking rule is a general propagation policy.
  - id: wiki:12 APR 2011 RefGen Phone Conference (Archived)
    title: 12 APR 2011 RefGen Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/12_APR_2011_RefGen_Phone_Conference_%28Archived%29
    relevance: 4
    method: opus
    rationale: Archived Reference Genome call that lists the PAINT evidence codes (IBA, IBD, IKR/IMR, IRD, pruning) and 'response
      to' annotation advice (avoid high-level response-to terms, use IEP for expression readouts). Archived minutes; the evidence-code
      definitions and response-to guidance now live in official documentation, so downgraded to 4.
  - id: wiki:13 March 2024 PAINT Conference Call
    title: 13 March 2024 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/13_March_2024_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Classifies three causes of taxon-constraint violations (IBDs above an only-in taxon, propagation through never-in
      constraints, horizontal transfer) and sets the approach to never-in constraints and HGT blocking, a general QC practice
      for PAINT.
  - id: wiki:16 December 2014 PAINT Conference Call
    title: 16 December 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/16_December_2014_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Works through three NOT-annotation scenarios (term only, term plus all parents, term plus some parents) on
      PTHR10024 and a taxon-constraint failure case; a substantive discussion of how NOT scope should apply across the ontology.
  - id: wiki:18 November 2014 PAINT Conference Call
    title: 18 November 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/18_November_2014_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Records that STOP is no longer used in PAINT, that IRD-coded NOT can express weaker evidence, and works through
      NOT scope scenarios (term only, some parents, all parents) for a conserved calcium-dependent exocytosis term; a general
      NOT-annotation policy discussion.
  - id: wiki:2 June 2015 PAINT Conference Call
    title: 2 June 2015 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/2_June_2015_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: 'Records a general organelle rule: do not propagate mitochondrial localisation into plants, annotate ribosomal
      parts to the root and mitochondrial parts only in non-plant eukaryotes, reasoning that organelle identity is hard to
      resolve across lineages.'
  - id: wiki:20 January 2015 PAINT Conference Call
    title: 20 January 2015 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/20_January_2015_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Records PAINT design decisions on allowing partial loss of function at an ancestor node (a general NOT-propagation
      rule) and on curator-overridable constraint checks at save time, with a NOT-annotation case on PTHR10130 explained as
      a software issue.
  - id: wiki:2010 GO camp Annotation of HTP data
    title: 2010 GO camp Annotation of HTP data
    url: https://wiki.geneontology.org/index.php/2010_GO_camp_Annotation_of_HTP_data
    relevance: 4
    method: haiku
    rationale: Sets out criteria for recognising high-throughput papers, SGD's practice of tagging HTP data, and caution about
      downstream BP annotations from HTP screens. It also proposes an evidence-code split into reviewed and non-reviewed experimental
      and computational classes, which is a general practice question.
  - id: wiki:2010 GO camp Annotation of complexes issues
    title: 2010 GO camp Annotation of complexes issues
    url: https://wiki.geneontology.org/index.php/2010_GO_camp_Annotation_of_complexes_issues
    relevance: 4
    method: haiku
    rationale: Discusses when complex terms should be created, what counts as membership evidence, and when to annotate at
      complex level versus subunits (for example, function-centric generic complexes versus characterised complexes with ISS
      propagation). These are general practice questions for complex annotation.
  - id: wiki:2010 GO camp Use of Regulation issues
    title: 2010 GO camp Use of Regulation issues
    url: https://wiki.geneontology.org/index.php/2010_GO_camp_Use_of_Regulation_issues
    relevance: 4
    method: haiku
    rationale: Sets the guidance for choosing regulation of-process terms versus the process term, including annotating to
      the less specific parent when uncertain, and records the discussion on why regulates is not part_of. This is a standing
      rule for regulation terms.
  - id: wiki:2010 GO camp binding documentation issues
    title: 2010 GO camp binding documentation issues
    url: https://wiki.geneontology.org/index.php/2010_GO_camp_binding_documentation_issues
    relevance: 4
    method: haiku
    rationale: Substantial discussion of column 16 (with/target) usage for binding and catalytic annotations, including the
      rule that an identifier implied by the GO term (e.g. ATP for ATP binding) must not be added, and that only direct targets
      go in column 16. The minutes reach general practice beyond one case.
  - id: wiki:2010 GO camp downstream effect
    title: 2010 GO camp downstream effect
    url: https://wiki.geneontology.org/index.php/2010_GO_camp_downstream_effect
    relevance: 4
    method: haiku
    rationale: Records curator practice on annotating downstream or secondary effects (development, ageing, signalling, mutant
      screens, sparse-data genes) and argues that splicing-defect translation phenotypes should not yield translation terms.
      It is a cross-group survey that establishes when to avoid over-annotation.
  - id: wiki:2010 GO-camp Response to terms issues
    title: 2010 GO-camp Response to terms issues
    url: https://wiki.geneontology.org/index.php/2010_GO-camp_Response_to_terms_issues
    relevance: 4
    method: haiku
    rationale: Proposes an annotation policy that high-level 'response to' terms (e.g. response to stimulus, response to stress)
      should not be used directly for annotation and that microarray experiments should not be annotated to 'response to'
      terms, with QC suggestions. It is a proposal from a camp working group, not a ratified consortium decision.
  - id: wiki:2010 Stanford Meeting Minutes
    title: 2010 Stanford Meeting Minutes
    url: https://wiki.geneontology.org/index.php/2010_Stanford_Meeting_Minutes
    relevance: 4
    method: haiku
    rationale: Consortium minutes where the group argues that annotation sets should be consistent regardless of when each
      annotation was made, rather than using cut-off dates for a new annotation policy, plus discussion of PAINT and reference
      genome curation. A general practice position with reuse beyond one case.
  - id: wiki:20101213 HasPartMeetingAgenda
    title: 20101213 HasPartMeetingAgenda
    url: https://wiki.geneontology.org/index.php/20101213_HasPartMeetingAgenda
    relevance: 4
    method: haiku
    rationale: Working through when has_part links license propagation of annotations, including the rule that annotations
      cannot propagate from a parent process to a has_part child, and whether curators must consider has_part when choosing
      terms. This is a general practice question with a stated answer for propagation.
  - id: wiki:2013 Bar Harbor GOC Meeting Agenda
    title: 2013 Bar Harbor GOC Meeting Agenda
    url: https://wiki.geneontology.org/index.php/2013_Bar_Harbor_GOC_Meeting_Agenda
    relevance: 4
    method: haiku
    rationale: Action items fix conventions for Requires_regulator and Requires_regulation_by (annotate forward only, re-examine
      9 annotations), require evidence-code prioritisation for redundancy, and set a routine for Jenkins annotation checks;
      several are general conventions.
  - id: wiki:2017 Cambridge GOC Meeting Agenda
    title: 2017 Cambridge GOC Meeting Agenda
    url: https://wiki.geneontology.org/index.php/2017_Cambridge_GOC_Meeting_Agenda
    relevance: 4
    method: haiku
    rationale: Agenda proposing a general qualifier for legacy biological-process annotations and a single convention for
      regulation (involved_in regulation_of versus involved_in regulates), with a fallback when no named regulation class
      exists; a general relations convention.
  - id: wiki:2017 Cambridge GOC Signalling Workshop
    title: 2017 Cambridge GOC Signalling Workshop
    url: https://wiki.geneontology.org/index.php/2017_Cambridge_GOC_Signalling_Workshop
    relevance: 4
    method: haiku
    rationale: Records agreed items that every signalling term should have a defined start and end and that GO-CAM models
      should show pathway membership, regulators and upstream causality; a practice agreement for a whole class of terms.
  - id: wiki:20th GO Consortium Meeting Action Items
    title: 20th GO Consortium Meeting Action Items
    url: https://wiki.geneontology.org/index.php/20th_GO_Consortium_Meeting_Action_Items
    relevance: 4
    method: haiku
    rationale: Records the guideline that comprehensive curation means reading all papers when few exist and a review when
      many, that comprehensiveness is not invalidated by newer papers, and documents GAF column changes; a documented annotation-practice
      convention.
  - id: wiki:20th GO Consortium Meeting Minutes
    title: 20th GO Consortium Meeting Minutes
    url: https://wiki.geneontology.org/index.php/20th_GO_Consortium_Meeting_Minutes
    relevance: 4
    method: haiku
    rationale: Minutes record the electron transport working group's proposal that function-process links should be made only
      with part_of or for single-step processes, and discuss automatic MF-BP link mining; a general position on how function
      and process terms should be linked.
  - id: wiki:25 FEB 2014 PAINT Phone Conference call
    title: 25 FEB 2014 PAINT Phone Conference call
    url: https://wiki.geneontology.org/index.php/25_FEB_2014_PAINT_Phone_Conference_call
    relevance: 4
    method: haiku
    rationale: 'Discusses propagation under NOT: a positive general term should propagate to proteins carrying a NOT on a
      specific child (PTHR10125 and RNA polymerase families), and a fixed beta73 rule that any term can propagate when a positive
      annotation exists; a general NOT-propagation issue.'
  - id: wiki:26 August 2014 PAINT Conference Call
    title: 26 August 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/26_August_2014_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Decides to exclude high-throughput papers by a threshold on annotations per GO term with a manually curated
      exclusion list, and keeps inter-ontology-link propagation after weighing explicit annotation; a recorded policy for
      HTP data in PAINT.
  - id: wiki:3 Aug 2021 PAINT Conference Call
    title: 3 Aug 2021 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/3_Aug_2021_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Argues that most taxon constraints should be only_in relations to ancestors, so removing an IBD on a deuterostome
      node should be replaced by a child-of-Euteleostomi placement; a general point about how taxon constraints are structured.
  - id: wiki:31 Aug 2021 PAINT Conference Call
    title: 31 Aug 2021 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/31_Aug_2021_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Records the decision to propagate IBA to leaves with conflicting NOT annotations, with curator blocking via
      IKR or IRD, and discusses the concerns this raises for review effort and community pushback; a general class-level policy
      on IBA conflicts.
  - id: wiki:4 June 2019 PAINT Conference Call
    title: 4 June 2019 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/4_June_2019_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Sets action items to remove protein binding from propagatable terms, treat IKR like IDA, and filter IBAs to
      leaves with any NOT annotation, and asks for ECO codes for IKR; these decisions apply to a class of terms and evidence.
  - id: wiki:4 November 2014 PAINT Conference Call
    title: 4 November 2014 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/4_November_2014_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Settles a general practice that transmembrane receptors may take GO:0009897 external side of plasma membrane
      or GO:0016021 integral component of membrane, with the curator inferring the term from biological knowledge rather than
      reading out the assay.
  - id: wiki:5th Oct 2022 PAINT Conference call
    title: 5th Oct 2022 PAINT Conference call
    url: https://wiki.geneontology.org/index.php/5th_Oct_2022_PAINT_Conference_call
    relevance: 4
    method: haiku
    rationale: Proposes outputting only the most specific term IBA in GAF generation to remove redundant annotations, with
      a rule that NOT IBAs keep the more generic term; a general IBA export convention.
  - id: wiki:7 Jan 2020 PAINT Conference Call
    title: 7 Jan 2020 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/7_Jan_2020_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: Proposes one ID space per species (AspGD versus UniProt IDs) and records that taxon constraint checks must
      consider descendant nodes, with a plan that includes a NOT-type taxon constraint and TCV evidence code.
  - id: wiki:7 May 2019 PAINT Conference Call
    title: 7 May 2019 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/7_May_2019_PAINT_Conference_Call
    relevance: 4
    method: haiku
    rationale: 'Records two added PAINT SOP points: small duplications (S. pombe, C. elegans, insects, plants) may differ
      in function, and specific substrate terms for enzymes and transporters should be propagated conservatively; a documented
      curation convention.'
  - id: wiki:8 Feb 2022 PAINT Conference Call
    title: 8 Feb 2022 PAINT Conference Call
    url: https://wiki.geneontology.org/index.php/8_Feb_2022_PAINT_Conference_Call
    relevance: 4
    method: opus
    rationale: Minutes recording PAINT decisions that IBAs may propagate despite a conflicting experimental NOT (curators
      file tickets), discussion that many MGI/human NOTs are isoform-specific, and a plan to use domain/active-site data for
      automatic STOP; also family prioritisation logistics. Operational decisions in minutes rather than a guideline, so 4.
  - id: wiki:Action items from March 2010 GOC meeting
    title: Action items from March 2010 GOC meeting
    url: https://wiki.geneontology.org/index.php/Action_items_from_March_2010_GOC_meeting
    relevance: 4
    method: haiku
    rationale: 'Assigns action items that set general annotation policy directions: a documented protein binding rule (GO:0005515),
      ECO as the evidence code source, and user guidance on IEA and RCA subsets.'
  - id: wiki:Acts on population of
    title: Acts on population of
    url: https://wiki.geneontology.org/index.php/Acts_on_population_of
    relevance: 4
    method: haiku
    rationale: 'Documents the usage of the acts_on_population_of relation: the RO definition, the domain and range, a worked
      IMP annotation example, and the rule for folding it into a parent term such as hematopoietic stem cell population proliferation.
      This is a documented convention for a standard relation.'
  - id: wiki:Acts upstream of
    title: Acts upstream of
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of
    relevance: 4
    method: haiku
    rationale: Defines acts upstream of as the case where the mechanism is known and the activity precedes but is not part
      of the process, and says curators should prefer the positive or negative child. This is a general relation convention.
  - id: wiki:Acts upstream of or within
    title: Acts upstream of or within
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of_or_within
    relevance: 4
    method: haiku
    rationale: Defines when to use the acts upstream of or within relation (mechanism unknown, mutant phenotype reported)
      and states that curators should choose a positive or negative child term. This is a general convention for gene product
      to process relations.
  - id: wiki:Acts upstream of or within, negative effect
    title: Acts upstream of or within, negative effect
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of_or_within%2C_negative_effect
    relevance: 4
    method: haiku
    rationale: States the usage rule for the negative-effect child (mechanism unknown, net negative effect) with a miRNA worked
      example. The guidance applies generally, though the examples are case-level.
  - id: wiki:Acts upstream of or within, positive effect
    title: Acts upstream of or within, positive effect
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of_or_within%2C_positive_effect
    relevance: 4
    method: haiku
    rationale: States the usage rule for the positive-effect child (mechanism unknown, net positive effect) and gives worked
      examples with GO-CAM models. It is a general convention for choosing this relation.
  - id: wiki:Acts upstream of, negative effect
    title: Acts upstream of, negative effect
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of%2C_negative_effect
    relevance: 4
    method: haiku
    rationale: Defines the negative-effect upstream relation (known mechanism, prevents the process) and gives examples covering
      translational repression and silencing complexes. It is a general convention, though some examples are open questions.
  - id: wiki:Acts upstream of, positive effect
    title: Acts upstream of, positive effect
    url: https://wiki.geneontology.org/index.php/Acts_upstream_of%2C_positive_effect
    relevance: 4
    method: haiku
    rationale: Gives the definition of the positive-effect upstream relation (known mechanism, required for the process to
      occur) with Ras lipidation and glycine transport examples. It clarifies when this relation applies in general.
  - id: wiki:Adding Term Comments
    title: Adding Term Comments
    url: https://wiki.geneontology.org/index.php/Adding_Term_Comments
    relevance: 4
    method: opus
    rationale: Ontology-editor SOP for wording term comments, including the standard 'should not be used for direct annotation'
      text and the deprecated 'do not manually annotate' variant, plus Protege steps. Current (reviewed 2024) but it governs
      ontology editing, only indirectly annotation practice, so downgraded to 4.
  - id: wiki:Adding or Deleting Asserted Subclasses
    title: Adding or Deleting Asserted Subclasses
    url: https://wiki.geneontology.org/index.php/Adding_or_Deleting_Asserted_Subclasses
    relevance: 4
    method: haiku
    rationale: 'Editor SOP for ontology structure: remove asserted is_a parents that the logical definition already infers,
      and move terms only within the same ontology. This is an ontology-structure principle that curators rely on, though
      aimed at editors rather than annotators.'
  - id: wiki:Adding, Editing, Deleting Taxon Restrictions
    title: Adding, Editing, Deleting Taxon Restrictions
    url: https://wiki.geneontology.org/index.php/Adding%2C_Editing%2C_Deleting_Taxon_Restrictions
    relevance: 4
    method: haiku
    rationale: Explains the taxon-constraint conventions ('only in' and 'never in' subclass axioms) and how to check with
      the reasoner whether a constraint is already inferred before adding it. This is a general ontology QC practice for taxon
      constraints.
  - id: wiki:Annotating ligand-receptor pathways
    title: Annotating ligand-receptor pathways
    url: https://wiki.geneontology.org/index.php/Annotating_ligand-receptor_pathways
    relevance: 4
    method: haiku
    rationale: Diagram-based convention on which process terms to assign to ligands, receptors, signalling molecules and targets
      in a pathway. It is practical but partial, marked TO BE REVIEWED, and covers one pathway class.
  - id: wiki:Annotation 29Apr10
    title: Annotation 29Apr10
    url: https://wiki.geneontology.org/index.php/Annotation_29Apr10
    relevance: 4
    method: haiku
    rationale: Discusses whether IMP can be used for chemical inhibition (rapamycin/Tor1p) and concludes that inhibitor-based
      annotation is unwise unless the chemical is very specific, to be highlighted in evidence-code documentation. This is
      a general practice point on IMP usage.
  - id: wiki:Annotation Advocacy
    title: Annotation Advocacy
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy
    relevance: 4
    method: haiku
    rationale: '2014-era annual report recording annotation-call consensus on general practice: enzyme regulator activity
      should be used by curator judgement with a proposed definition, apoptosis annotations must reflect involvement not assay
      read-outs, and Jenkins hard/soft QC reports. This reaches general conventions beyond single cases.'
  - id: wiki:Annotation Advocacy Progress Report December 2010
    title: Annotation Advocacy Progress Report December 2010
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_Progress_Report_December_2010
    relevance: 4
    method: haiku
    rationale: Describes the annotation call process and the hard versus soft QC check policy (hard checks filter, soft checks
      flag for review), plus column 16 cell-type rules and GO Camp guideline areas. It states general QC and documentation
      policy.
  - id: wiki:Annotation Advocacy Q2 2014
    title: Annotation Advocacy Q2 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_Q2_2014
    relevance: 4
    method: haiku
    rationale: Records decisions on which annotation-extension relations are valid (stop has_indirect_input and not_* relations,
      not_dependent_on renamed independent_of) and on with/from field cardinality. These are general practice decisions for
      extensions.
  - id: wiki:Annotation Advocacy progress report for 2010
    title: Annotation Advocacy progress report for 2010
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_progress_report_for_2010
    relevance: 4
    method: haiku
    rationale: Near-duplicate of the December 2010 progress report, with the same hard and soft QC check policy, GO Camp guideline
      areas and column 16 documentation. It states general QC policy.
  - id: wiki:Annotation Advocacy progress report for 2012
    title: Annotation Advocacy progress report for 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_progress_report_for_2012
    relevance: 4
    method: opus
    rationale: An in-progress 2012 annual report that lists QC checks introduced that year (IC needs GO id in with/from, IDA
      has none, ND only to roots, IKR requires NOT, binding/IPI needs a partner) plus notes on part-terms and extensions.
      It reports rules rather than establishing them and is out of date (many rules since revised as GO rules), so 4.
  - id: wiki:Annotation Advocacy progress report for 2013
    title: Annotation Advocacy progress report for 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_progress_report_for_2013
    relevance: 4
    method: haiku
    rationale: Records consensus that IEP expression annotations imply no protein-versus-gene inference, that apoptosis annotations
      were recurated to top-level terms, and that with/from identifier types are constrained per evidence code. These decisions
      apply to classes of annotations.
  - id: wiki:Annotation Advocacy progress report for 2014
    title: Annotation Advocacy progress report for 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Advocacy_progress_report_for_2014
    relevance: 4
    method: haiku
    rationale: 'Records annotation-consistency decisions and new QC rules: every annotation needs a PMID or GO_REF, RCAs older
      than a year are removed, do_no_annotate terms are flagged, and binding GO:0005488 is tagged do_not_annotate. These are
      documented conventions, though the report is mostly a summary.'
  - id: wiki:Annotation Call August 12, 2014
    title: Annotation Call August 12, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_August_12%2C_2014
    relevance: 4
    method: haiku
    rationale: 'Sets practice for biological phase terms (GO:0044848, do_no_annotate): use happens_during, and precompose
      only when the process is unusual in that phase. Also introduces the causally_upstream_of extension relation.'
  - id: wiki:Annotation Call December 9, 2014
    title: Annotation Call December 9, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_December_9%2C_2014
    relevance: 4
    method: opus
    rationale: Annotation call agenda containing draft checkpoint-term guidelines (no checkpoint annotation from mutations
      that activate the checkpoint; only sensors and signalling components; repair genes go to 'response to' terms) and a
      request that NOT-only gene products also get a positive annotation; plus E1/E2/E3 reannotation advice. Checkpoint text
      was deferred ('will be discussed next year'), so this is minutes of draft guidance, 4.
  - id: wiki:Annotation Call July 22 2014
    title: Annotation Call July 22 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_July_22_2014
    relevance: 4
    method: haiku
    rationale: Records consensus on column 16 relations (dependent_on, exists_during), that cell cycle phase must not be used
      for manual annotations, and that IPI can be used without a with entry for complexes. These decisions generalise to classes
      of terms and evidence.
  - id: wiki:Annotation Call July 8, 2014
    title: Annotation Call July 8, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_July_8%2C_2014
    relevance: 4
    method: haiku
    rationale: 'Sets QC practice: every annotation must carry a PMID or GO_REF, and internal MOD references alone are not
      allowed; RCA annotations get a one-year shelf life, with the old-RCA counts per source. Applies across groups.'
  - id: wiki:Annotation Call November 11, 2014
    title: Annotation Call November 11, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_November_11%2C_2014
    relevance: 4
    method: haiku
    rationale: 'Establishes general practice for ChIP-derived annotations: chromatin CC annotation with SO/gene extensions
      via coincident_with is acceptable, and ChIP does not support direct DNA or chromatin binding MF terms. Applies beyond
      one case.'
  - id: wiki:Annotation Call October 28, 2014
    title: Annotation Call October 28, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_October_28%2C_2014
    relevance: 4
    method: opus
    rationale: 'GOC meeting report in call minutes that briefly notes decisions: pipe=OR/comma=AND in with/from to match col
      16, an ''implicated in'' idea for process-vs-regulation ambiguity, ECO term request process, catabolism/biosynthesis
      scoping. Minutes that merely mention decisions in one line each, several later superseded, so 4.'
  - id: wiki:Annotation Call September 9, 2014
    title: Annotation Call September 9, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Call_September_9%2C_2014
    relevance: 4
    method: haiku
    rationale: Covers the do_not_annotate handling of the 'binding' term GO:0005488 (27 direct annotations with ChEBI in the
      with field, so granular terms should be used) and a request for Jenkins reports on loss of specificity after parentage
      changes. Both apply generally.
  - id: wiki:Annotation Conf. Call 2015-08-25
    title: Annotation Conf. Call 2015-08-25
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-08-25
    relevance: 4
    method: haiku
    rationale: Continues the col-16 relation review with an in_presence_of example and the part_of versus happens_during choice
      for physiological context. Reasoning is reusable across annotations, though it ties to specific papers.
  - id: wiki:Annotation Conf. Call 2015-09-22
    title: Annotation Conf. Call 2015-09-22
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-09-22
    relevance: 4
    method: haiku
    rationale: Records that dependent_on, in_absence_of and in_presence_of should not be used in col-16 by groups without
      protein2GO, and lists obsoleted relations still in use. Also covers a yeast consistency exercise on the mitotic telomere
      term.
  - id: wiki:Annotation Conf. Call 2015-10-13
    title: Annotation Conf. Call 2015-10-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-10-13
    relevance: 4
    method: haiku
    rationale: Proposes that MOD gene identifiers be used in col-16 and the with field, and discusses the ID spaces the GOC
      accepts. Also records a decision not to add a 'do not automatically annotate' property.
  - id: wiki:Annotation Conf. Call 2015-10-27
    title: Annotation Conf. Call 2015-10-27
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-10-27
    relevance: 4
    method: haiku
    rationale: Discusses IGI for rescue experiments, IEP for expression-based annotation, and whether development and morphogenesis
      terms are secondary phenotypes. Reusable criteria for evidence codes in zebrafish phenotype work.
  - id: wiki:Annotation Conf. Call 2015-11-10
    title: Annotation Conf. Call 2015-11-10
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-11-10
    relevance: 4
    method: haiku
    rationale: Points groups to deprecated annotation extension guidance (dependent_on, in_presence_of, in_absence_of) and
      asks them to record gaps. Also starts agreement on which ID spaces are used in extensions.
  - id: wiki:Annotation Conf. Call 2015-11-24
    title: Annotation Conf. Call 2015-11-24
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2015-11-24
    relevance: 4
    method: haiku
    rationale: Records the consensus that ChIP experiments do not justify a specific DNA-binding term, citing earlier published
      TF annotation guidelines. Also covers how to capture downstream targets and secondary phenotypes.
  - id: wiki:Annotation Conf. Call 2016-01-12
    title: Annotation Conf. Call 2016-01-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-01-12
    relevance: 4
    method: haiku
    rationale: Sets the plan for monthly consistency exercises and records recommended re-annotation of dependent_on cases
      (direct annotations with contributes_to). Also covers abstract-only annotation as a practice question.
  - id: wiki:Annotation Conf. Call 2016-01-26
    title: Annotation Conf. Call 2016-01-26
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-01-26
    relevance: 4
    method: opus
    rationale: Minutes recording the decision that protein-family binding terms will not be added/kept and binding goes to
      protein binding with the partner in with/from or has_input, plus cross-species binding handling; the rest is an annotation
      consistency exercise. Records a decision in minutes, since superseded by the binding guideline pages, so 4.
  - id: wiki:Annotation Conf. Call 2016-02-08
    title: Annotation Conf. Call 2016-02-08
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-02-08
    relevance: 4
    method: haiku
    rationale: 'Reviews a draft of revised IGI documentation: IGI versus IMP chosen by whether the comparison is against several
      perturbations or one, and the with/from pipe and comma rules. Reaches a general practice, though it is still a draft.'
  - id: wiki:Annotation Conf. Call 2016-02-09
    title: Annotation Conf. Call 2016-02-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-02-09
    relevance: 4
    method: haiku
    rationale: Continues the IGI documentation review (IGI versus IMP, with/from separators, co-transfection as functional
      interaction). Same general content as the February 8 call.
  - id: wiki:Annotation Conf. Call 2016-02-23
    title: Annotation Conf. Call 2016-02-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-02-23
    relevance: 4
    method: haiku
    rationale: Revised IGI documentation adds an example of when not to use IGI (rescue of a mutant phenotype by the same
      gene), and opens a call for cell-line annotation guidelines. Both are general practice points.
  - id: wiki:Annotation Conf. Call 2016-03-08
    title: Annotation Conf. Call 2016-03-08
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-03-08
    relevance: 4
    method: haiku
    rationale: Announces new ontology-request guidelines (CONTRIBUTING.md, insufficient-info tag) and proposes IC annotations
      from ISS annotations. The request guidelines describe how curators should submit term requests.
  - id: wiki:Annotation Conf. Call 2016-04-26
    title: Annotation Conf. Call 2016-04-26
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-04-26
    relevance: 4
    method: haiku
    rationale: Covers IDA versus IEP for an isoform-agnostic antibody result, an ECO code for high-throughput annotations,
      and announces that dependent_on, requires_substance and localization_dependent_on are now obsolete. Obsolescence notices
      are a practice change.
  - id: wiki:Annotation Conf. Call 2016-05-24
    title: Annotation Conf. Call 2016-05-24
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-05-24
    relevance: 4
    method: haiku
    rationale: 'Opens guidance on mRNA expression annotation: mRNA level is not protein or transcription level, and regulation
      of transcription needs evidence of promoter binding. Cites published TF curation guidelines.'
  - id: wiki:Annotation Conf. Call 2016-07-11
    title: Annotation Conf. Call 2016-07-11
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-07-11
    relevance: 4
    method: haiku
    rationale: Drafts a revised protein binding guideline that separates direct interactions from the normal biological role,
      and surveys how groups differ. Also covers membrane CC terms and the consistency schedule.
  - id: wiki:Annotation Conf. Call 2016-07-26
    title: Annotation Conf. Call 2016-07-26
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-07-26
    relevance: 4
    method: opus
    rationale: Minutes reporting that the protein binding guideline (PPIs annotated only when they inform normal biological
      role) was posted to the GO website, plus a FlyBase LEGO model consistency exercise discussing directly_inhibits semantics.
      Reports rather than establishes the guideline, so 4.
  - id: wiki:Annotation Conf. Call 2016-08-09
    title: Annotation Conf. Call 2016-08-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-08-09
    relevance: 4
    method: haiku
    rationale: Discusses membrane child-term CC annotations and the general problem of chain-of-evidence annotations, which
      combine experimental results with motifs or domains. Also covers the LEGO/Noctua training schedule.
  - id: wiki:Annotation Conf. Call 2016-11-22
    title: Annotation Conf. Call 2016-11-22
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2016-11-22
    relevance: 4
    method: haiku
    rationale: 'Sets LEGO modelling practice for a zebrafish paper: every gene product needs a molecular function (root if
      needed), TAS can mark information known but not shown, and single-paper versus multi-paper modelling is left to curators.'
  - id: wiki:Annotation Conf. Call 2017-02-14
    title: Annotation Conf. Call 2017-02-14
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-02-14
    relevance: 4
    method: haiku
    rationale: Explains which relations and qualifiers are used in GAF, GPAD and LEGO, and proposes new BP qualifiers (acts_upstream_of_or_within
      and children) to replace the default involved_in. This is a general proposal on how to describe gene-process relations.
  - id: wiki:Annotation Conf. Call 2017-03-14
    title: Annotation Conf. Call 2017-03-14
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-03-14
    relevance: 4
    method: haiku
    rationale: Sets an action plan for checking whether involved_in is still right for IMP annotations, with principles for
      qualifiers (defining process boundaries, regulation versus process). Also covers single-step BP obsoletion review.
  - id: wiki:Annotation Conf. Call 2017-04-11
    title: Annotation Conf. Call 2017-04-11
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-04-11
    relevance: 4
    method: haiku
    rationale: Covers redundant F-P inter-ontology links, tracking PAINT disputes on github, and a proposal to remove terms
      that name specific gene products. Governance-level points that apply across annotation.
  - id: wiki:Annotation Conf. Call 2017-05-09
    title: Annotation Conf. Call 2017-05-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-05-09
    relevance: 4
    method: opus
    rationale: Discussion of CC annotation principles (CC records where the gene product acts; secretory transit and relocalization
      need positive evidence of function) and colocalizes_with usage, with options such as a new is_active_in qualifier left
      unresolved; also PTM-dependent binding proposal. Substantial but unresolved discussion in minutes, so 4.
  - id: wiki:Annotation Conf. Call 2017-05-23
    title: Annotation Conf. Call 2017-05-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-05-23
    relevance: 4
    method: haiku
    rationale: 'Sets conventions for Noctua relations: adjacent_to qualifies a relation between two entities, enabled_by links
      an entity to an MF, and each protein-binding MF needs a check of whether it is part of each process.'
  - id: wiki:Annotation Conf. Call 2017-06-13
    title: Annotation Conf. Call 2017-06-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-06-13
    relevance: 4
    method: haiku
    rationale: 'Records Corvallis action items: an expanded qualifier list for GAF/GPAD, transferring documentation off the
      wiki, and a request for consortium-wide curation documentation. Also covers HTP evidence codes and GO slims.'
  - id: wiki:Annotation Conf. Call 2017-07-11
    title: Annotation Conf. Call 2017-07-11
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-07-11
    relevance: 4
    method: haiku
    rationale: 'Lays out a workflow for signaling pathway annotation: define what is in the pathway, review existing annotations,
      check ontology definitions, then build a GO-CAM. Guidelines are to be published on github.'
  - id: wiki:Annotation Conf. Call 2017-07-25
    title: Annotation Conf. Call 2017-07-25
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-07-25
    relevance: 4
    method: opus
    rationale: Minutes summarising the adopted modification-dependent protein binding approach (terms for common PTMs, parent
      term otherwise, PTM targets not annotated to the modification process) in a few lines; most of the page is the AGR GO
      slim methodology and signaling project status. Mentions a decision documented elsewhere, so 4.
  - id: wiki:Annotation Conf. Call 2017-09-12
    title: Annotation Conf. Call 2017-09-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-09-12
    relevance: 4
    method: haiku
    rationale: Records that receptor agonist activity (GO:0048018) is renamed receptor ligand activity with a new definition
      and its signal transduction relations removed. Also reviews inconsistent use of receptor activator activity.
  - id: wiki:Annotation Conf. Call 2017-10-24
    title: Annotation Conf. Call 2017-10-24
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-10-24
    relevance: 4
    method: opus
    rationale: Minutes noting that manual annotation to uninformative high-level terms (e.g. transport) is strongly discouraged,
      with an action to review such annotations and work through PomBase's do-not-manually-annotate list; otherwise TF refactor
      and meeting follow-ups. QC action item in minutes, later formalised in GO rules/subsets, so 4.
  - id: wiki:Annotation Conf. Call 2017-11-14
    title: Annotation Conf. Call 2017-11-14
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2017-11-14
    relevance: 4
    method: haiku
    rationale: Repeats the high-level term policy for transport annotations and sets the term-request information checklist.
      Also covers Noctua attribution through users.yaml.
  - id: wiki:Annotation Conf. Call 2018-01-09
    title: Annotation Conf. Call 2018-01-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-01-09
    relevance: 4
    method: haiku
    rationale: 'Lists protein complex working-group proposals: guidelines for contributes_to, colocalizes_with for CC complex
      terms, and inferring MF for complex members. Frames general relation-policy questions.'
  - id: wiki:Annotation Conf. Call 2018-02-27
    title: Annotation Conf. Call 2018-02-27
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-02-27
    relevance: 4
    method: haiku
    rationale: Sets annotation review priorities (incorrect annotations, obsolete terms, uninformative high-level terms, grouping
      terms with more granular children), and raises when to capture a causal relation. A general prioritisation policy.
  - id: wiki:Annotation Conf. Call 2018-03-13
    title: Annotation Conf. Call 2018-03-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-03-13
    relevance: 4
    method: haiku
    rationale: Covers HTP proteomics annotation standards, including whether a combined evidence code and GO_REF are needed,
      and the UniProt versus UniProtKB prefix in with/from. Also reviews RCA usage by group.
  - id: wiki:Annotation Conf. Call 2018-03-27
    title: Annotation Conf. Call 2018-03-27
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-03-27
    relevance: 4
    method: opus
    rationale: Minutes recording that the proposed one-year restriction on RCA annotations will not be a rule (paper-based
      RCA kept if consistent with the definition), plus discussion of an evidence code for HTP-plus-validation and single-reference
      conventions. Narrow evidence-code decision in minutes, so 4.
  - id: wiki:Annotation Conf. Call 2018-06-12
    title: Annotation Conf. Call 2018-06-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-06-12
    relevance: 4
    method: haiku
    rationale: Establishes that downstream targets (Myc, cyclin D) are not annotated to canonical Wnt signaling and that Wnt
      ligands cannot be sorted into canonical and non-canonical from the pathway alone. Applies beyond one pathway.
  - id: wiki:Annotation Conf. Call 2018-07-10
    title: Annotation Conf. Call 2018-07-10
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-07-10
    relevance: 4
    method: haiku
    rationale: Points to the transmembrane protein CC guideline and proposes GOA automatically remove ND annotations when
      experimental or sequence evidence exists, with a review caveat for HTP. Sets ND practice for all groups.
  - id: wiki:Annotation Conf. Call 2018-08-14
    title: Annotation Conf. Call 2018-08-14
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-08-14
    relevance: 4
    method: haiku
    rationale: Discusses automatic deletion of ND annotations when granular evidence exists, and how protein binding ND cases
      are handled. Also covers doubled IBA plus EXP annotations and PAINT circular transfer.
  - id: wiki:Annotation Conf. Call 2018-11-13
    title: Annotation Conf. Call 2018-11-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-11-13
    relevance: 4
    method: opus
    rationale: Minutes recording that root ND annotations are not auto-removed when experimental annotations exist (curators
      who made the ND should remove it; flag for review), with an unresolved proposal to split MF into binding and molecular
      activity for ND; also review-priority labels. Decision plus open proposal in minutes, so 4.
  - id: wiki:Annotation Conf. Call 2018-12-18
    title: Annotation Conf. Call 2018-12-18
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2018-12-18
    relevance: 4
    method: haiku
    rationale: Records that Rhea reactions become the authoritative source for GO catalytic activity terms, and covers GO-CAM
      relations for reaction participants and phenotype annotation guidelines. A policy decision about the source of activity
      terms.
  - id: wiki:Annotation Conf. Call 2019-02-12
    title: Annotation Conf. Call 2019-02-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-02-12
    relevance: 4
    method: haiku
    rationale: Requires a Rhea xref and a PMID or other identifier when requesting enzymatic activity terms, and asks whether
      bioRxiv preprints are acceptable references. Both are convention-level questions.
  - id: wiki:Annotation Conf. Call 2019-07-09
    title: Annotation Conf. Call 2019-07-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-07-09
    relevance: 4
    method: haiku
    rationale: 'Sets general binding conventions: convert IDA homodimerization rows to IPI with the annotated entity as With,
      and recommend upgrading or removing IC/NAS/TAS rows for oligomerization terms; also asks for InterPro2GO issue tagging.'
  - id: wiki:Annotation Conf. Call 2019-08-13
    title: Annotation Conf. Call 2019-08-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-08-13
    relevance: 4
    method: haiku
    rationale: Reviews annotation extension relations for MF and GO-CAM, proposing which relations (part_of, occurs_in, has_input,
      happens_during) to keep and which to discontinue; a general relations policy.
  - id: wiki:Annotation Conf. Call 2019-08-20
    title: Annotation Conf. Call 2019-08-20
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-08-20
    relevance: 4
    method: haiku
    rationale: Works out whether happens_during can apply to 'response to' terms, arguing they should be treated as biological
      phases or handled with part_of; a reusable rule for extension relations.
  - id: wiki:Annotation Conf. Call 2019-09-10
    title: Annotation Conf. Call 2019-09-10
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-09-10
    relevance: 4
    method: haiku
    rationale: Sets GitHub review-ticket assignee guidelines and continues the happens_during discussion for GO-CAM relations,
      so it carries relation-use guidance.
  - id: wiki:Annotation Conf. Call 2019-09-24
    title: Annotation Conf. Call 2019-09-24
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-09-24
    relevance: 4
    method: opus
    rationale: Agenda listing the work-in-progress GO-CAM ShEx relation whitelist per aspect (definitely in, restricted, out
      for now, definitely out; chained relations excluded) with open questions on GPAD output. Status update on a spec still
      being decided, no minutes; later superseded by the published GO-CAM shapes, so 4.
  - id: wiki:Annotation Conf. Call 2019-10-22
    title: Annotation Conf. Call 2019-10-22
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2019-10-22
    relevance: 4
    method: haiku
    rationale: Reviews the 'contributes to' guidelines and answers whether RNA polymerase II subunits that do not contribute
      to catalysis should carry the relation; a general practice for contributes_to.
  - id: wiki:Annotation Conf. Call 2020-01-28
    title: Annotation Conf. Call 2020-01-28
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-01-28
    relevance: 4
    method: haiku
    rationale: Sets out the aim to model regulation through enabled activities and capture bona fide regulatory molecules
      but not cofactors, using the 'activated by' sample model as the general question for small-molecule effects.
  - id: wiki:Annotation Conf. Call 2020-04-07
    title: Annotation Conf. Call 2020-04-07
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-04-07
    relevance: 4
    method: opus
    rationale: Minutes reporting removal of ChEBI role references from GO logical definitions (cofactor/coenzyme/drug terms
      reclassified, drug to xenobiotic) with links to annotation review tickets, and the GAF 2.2 / GPAD 2.0 proposals with
      default gp2term relations. Mentions decisions and proposals detailed elsewhere, so 4.
  - id: wiki:Annotation Conf. Call 2020-04-21
    title: Annotation Conf. Call 2020-04-21
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-04-21
    relevance: 4
    method: haiku
    rationale: Follows up the ChEBI role removal with reasoning, sets GAF 2.2 default relations and a convention for protein
      entries shared by several genes; applies beyond one case.
  - id: wiki:Annotation Conf. Call 2020-06-23
    title: Annotation Conf. Call 2020-06-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-06-23
    relevance: 4
    method: opus
    rationale: Brief minutes on reannotating gene products from drug-role chemical terms to more general chemical classes
      plus extensions, with the reminder to annotate normal evolved biology; remainder is GitHub digests and GAF 2.2 logistics.
      Short recommendation in minutes, so 4.
  - id: wiki:Annotation Conf. Call 2020-09-15
    title: Annotation Conf. Call 2020-09-15
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-09-15
    relevance: 4
    method: haiku
    rationale: Sets the default gp2term relation for non-compliant GAF 2.2 annotations by aspect and the handling of contributor
      ORCIDs for former curators; general conventions.
  - id: wiki:Annotation Conf. Call 2020-11-03
    title: Annotation Conf. Call 2020-11-03
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-11-03
    relevance: 4
    method: opus
    rationale: Minutes noting the GAF 2.2 spec guidance for root-node relations (BP involved_in, MF enables, CC is_active_in)
      and that groups should apply gp2term relations per the spec; otherwise outages, meetings and an interacting-taxon has_input
      proposal. Mentions spec guidance documented elsewhere, so 4.
  - id: wiki:Annotation Conf. Call 2020-12-01
    title: Annotation Conf. Call 2020-12-01
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-12-01
    relevance: 4
    method: opus
    rationale: Minutes listing PAINT GAF 2.2 default relations (involved_in, enables, is_active_in, part_of for complexes;
      also contributes_to, colocalizes_with) and noting curators may upgrade gp2term relations on ISS/ISO review; interacting-taxon
      counts. Reports conventions rather than establishing them, so 4.
  - id: wiki:Annotation Conf. Call 2020-12-15
    title: Annotation Conf. Call 2020-12-15
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2020-12-15
    relevance: 4
    method: haiku
    rationale: Restates root-node relation guidance and PAINT defaults and collects each Protein2GO group's default relation;
      reinforces an established convention.
  - id: wiki:Annotation Conf. Call 2021-01-19
    title: Annotation Conf. Call 2021-01-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2021-01-19
    relevance: 4
    method: haiku
    rationale: Decides to replace regulation-style relations such as regulates expression of with has_input, with an action
      to review other has_input uses on regulatory BP extensions; a general relations decision.
  - id: wiki:Annotation Conf. Call 2021-09-07
    title: Annotation Conf. Call 2021-09-07
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2021-09-07
    relevance: 4
    method: haiku
    rationale: Announces that exists_during and activated_by are being retired in favour of new Protein2GO relations, and
      proposes obsoleting the methotrexate terms with a rationale; decisions for a class of terms.
  - id: wiki:Annotation Conf. Call 2021-11-02
    title: Annotation Conf. Call 2021-11-02
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2021-11-02
    relevance: 4
    method: haiku
    rationale: Records the feedback that has_input and has_output capture specific biological entities and gives ChEBI-use
      advice; applies to a class of extension use.
  - id: wiki:Annotation Conf. Call 2022-02-01
    title: Annotation Conf. Call 2022-02-01
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-02-01
    relevance: 4
    method: haiku
    rationale: Sets the goal of a core relation set and a change of transports or maintains localization of to has_primary_input,
      and records the aging miniproject's concern about phenotype-based predictions; general ontology and annotation principles.
  - id: wiki:Annotation Conf. Call 2022-04-19
    title: Annotation Conf. Call 2022-04-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-04-19
    relevance: 4
    method: haiku
    rationale: Sets out that the With/From same-species rule is only a warning for now and asks for interactor documentation
      to be checked against has_input extensions; a practice decision for a class of rows.
  - id: wiki:Annotation Conf. Call 2022-05-24
    title: Annotation Conf. Call 2022-05-24
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-05-24
    relevance: 4
    method: haiku
    rationale: Records the position that capturing membrane protein topology is no longer GO annotation scope and proposes
      obsoleting membrane CC terms; a policy for a class of CC terms.
  - id: wiki:Annotation Conf. Call 2022-07-19
    title: Annotation Conf. Call 2022-07-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-07-19
    relevance: 4
    method: haiku
    rationale: Keeps GO:0009897 external side of plasma membrane after deciding on membrane CC terms and points curators to
      the spreadsheet; a decision for a class of CC terms.
  - id: wiki:Annotation Conf. Call 2022-08-23
    title: Annotation Conf. Call 2022-08-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-08-23
    relevance: 4
    method: haiku
    rationale: Explains that extrinsic component of membrane terms are obsoleted with 'consider' because curators cannot tell
      membrane from membrane-associated; a documented convention for ambiguous CC terms.
  - id: wiki:Annotation Conf. Call 2022-08-30
    title: Annotation Conf. Call 2022-08-30
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-08-30
    relevance: 4
    method: haiku
    rationale: Repeats the extrinsic component of membrane obsoletion rationale with the 'consider' parent, reflecting a decision
      already recorded for a class of CC terms.
  - id: wiki:Annotation Conf. Call 2022-09-06
    title: Annotation Conf. Call 2022-09-06
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-09-06
    relevance: 4
    method: haiku
    rationale: Continues the extrinsic component of membrane obsoletion rationale and the consider-to-parent approach for
      the same class of CC terms.
  - id: wiki:Annotation Conf. Call 2022-11-01
    title: Annotation Conf. Call 2022-11-01
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-11-01
    relevance: 4
    method: haiku
    rationale: Proposes obsoleting terms with REPLACED BY rather than merging them, a general ontology-maintenance convention,
      and works through a transcription coactivator and a cortical protein curation question.
  - id: wiki:Annotation Conf. Call 2022-11-29
    title: Annotation Conf. Call 2022-11-29
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2022-11-29
    relevance: 4
    method: haiku
    rationale: Adopts a new SOP to stop merging terms and only obsolete them with replaced_by, and raises whether contributor
      assignment on ISS rows should follow changes to the source experimental annotation; a general convention.
  - id: wiki:Annotation Conf. Call 2023-01-10
    title: Annotation Conf. Call 2023-01-10
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-01-10
    relevance: 4
    method: haiku
    rationale: Agrees that three months is sufficient before obsoleting ontology terms with many annotations, and proposes
      homeostasis and detoxification annotation guidance for essential versus toxic ions; general practice.
  - id: wiki:Annotation Conf. Call 2023-01-17
    title: Annotation Conf. Call 2023-01-17
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-01-17
    relevance: 4
    method: haiku
    rationale: Repeats the three-month obsoletion rule and the homeostasis versus detoxification proposal, and adds the regulation
      of MF process obsoletion project with per-group annotation counts.
  - id: wiki:Annotation Conf. Call 2023-03-14
    title: Annotation Conf. Call 2023-03-14
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-03-14
    relevance: 4
    method: haiku
    rationale: Adopts the SOP of obsoleting rather than merging terms (obsolete plus replaced_by), and notes automatic MF-MF
      relation updates to GO-CAM models; a general ontology-maintenance convention.
  - id: wiki:Annotation Conf. Call 2023-05-09
    title: Annotation Conf. Call 2023-05-09
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-05-09
    relevance: 4
    method: haiku
    rationale: Argues that annotation reviews should be limited to cases needing a human in the loop, with automatic migration
      after obsoletion and GAF slices (fool-proof versus everything); a general annotation-quality policy.
  - id: wiki:Annotation Conf. Call 2023-05-16
    title: Annotation Conf. Call 2023-05-16
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-05-16
    relevance: 4
    method: haiku
    rationale: Repeats the automation-of-annotation-review proposal, including migrating colocalizes_with to located_in when
      that relation is obsoleted, and the metrics for curation work.
  - id: wiki:Annotation Conf. Call 2023-05-23
    title: Annotation Conf. Call 2023-05-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-05-23
    relevance: 4
    method: opus
    rationale: 'Minutes with two one-line decisions: External2GO and HTP CC annotations use ''located in'', and terms due
      for obsoletion get a do-not-annotate subset tag; otherwise outages, reports and project status. Minutes that merely
      state decisions, so 4.'
  - id: wiki:Annotation Conf. Call 2023-05-30
    title: Annotation Conf. Call 2023-05-30
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-05-30
    relevance: 4
    method: haiku
    rationale: Confirms the located_in decision for CC relations is now in the files and that obsolete terms in extensions
      will be reported; applies the 2023-05-23 policy.
  - id: wiki:Annotation Conf. Call 2023-06-20
    title: Annotation Conf. Call 2023-06-20
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-06-20
    relevance: 4
    method: haiku
    rationale: Notes that annotations to response to growth factor or response to hormone should usually go to the signaling
      pathway itself, and proposes obsoleting such terms or marking them do-not-annotate; a general practice point.
  - id: wiki:Annotation Conf. Call 2023-07-11
    title: Annotation Conf. Call 2023-07-11
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-07-11
    relevance: 4
    method: opus
    rationale: Minutes noting that only RO relations in the 'valid for annotation extension' subset will be allowed (gorel
      chains like regulates_o_occurs_in being removed) and that only SMADs and their TF partners belong under SMAD signal
      transduction. Brief decisions within status minutes, so 4.
  - id: wiki:Annotation Conf. Call 2023-11-28
    title: Annotation Conf. Call 2023-11-28
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-11-28
    relevance: 4
    method: haiku
    rationale: Discusses retiring the colocalizes_with gp2term relation and a clean-up strategy for about 2000 experimental
      CC annotations; a general relations policy with a ticket to avoid it for complexes.
  - id: wiki:Annotation Conf. Call 2023-12-12
    title: Annotation Conf. Call 2023-12-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-12-12
    relevance: 4
    method: haiku
    rationale: Continues the colocalizes_with retirement plan with UniProt counts and a divide-and-conquer strategy, and covers
      how groups handle retraction publications; general practice points.
  - id: wiki:Annotation Conf. Call 2023-12-19
    title: Annotation Conf. Call 2023-12-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2023-12-19
    relevance: 4
    method: haiku
    rationale: Repeats the colocalizes_with clean-up strategy with term-level counts and asks for review of the GO rules spreadsheet;
      general relation policy context.
  - id: wiki:Annotation Conf. Call 2024-01-16
    title: Annotation Conf. Call 2024-01-16
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-01-16
    relevance: 4
    method: haiku
    rationale: Asks whether bioRxiv preprints may be used for annotation, confirms the practice for ISS references (PMID versus
      GO_REF:0000024), and discusses interacting taxon for protein binding; general reference practice.
  - id: wiki:Annotation Conf. Call 2024-01-23
    title: Annotation Conf. Call 2024-01-23
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-01-23
    relevance: 4
    method: haiku
    rationale: Sets the feedback that involved-in annotations for 'x signaling involved in y' should be made to both terms
      rather than as an extension, and explains reasoner-created annotations to the compound term; a practice rule for a class
      of terms.
  - id: wiki:Annotation Conf. Call 2024-01-30
    title: Annotation Conf. Call 2024-01-30
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-01-30
    relevance: 4
    method: haiku
    rationale: Proposes changing has_input and has_output extensions to has_primary_input and has_primary_output so that only
      the main substrate or chemical is captured, plus the signaling-term replacement discussion; a relations policy.
  - id: wiki:Annotation Conf. Call 2024-02-13
    title: Annotation Conf. Call 2024-02-13
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-02-13
    relevance: 4
    method: haiku
    rationale: Introduces currency chemicals from Reactome as a curation aid for has_primary_input and clarifies the ISS reference
      documentation; general annotation practice.
  - id: wiki:Annotation Conf. Call 2024-02-20
    title: Annotation Conf. Call 2024-02-20
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-02-20
    relevance: 4
    method: haiku
    rationale: Proposes unfolding part_of BP extensions in Protein2GO so that involved-in annotations propagate to the parent
      process, which follows from transitivity of part_of; a general convention.
  - id: wiki:Annotation Conf. Call 2024-03-19
    title: Annotation Conf. Call 2024-03-19
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-03-19
    relevance: 4
    method: haiku
    rationale: Agrees to unfold part_of BP extensions in Protein2GO (about 13k new annotations) and removes the QuickGO filter
      on do-not-annotate terms; decisions with general consequences.
  - id: wiki:Annotation Conf. Call 2024-10-01
    title: Annotation Conf. Call 2024-10-01
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-10-01
    relevance: 4
    method: haiku
    rationale: Proposes dropping the rule that IC annotations cannot be made from HTP-evidenced annotations and asks whether
      HTP evidence guidelines need review; a general evidence-code practice question.
  - id: wiki:Annotation Conf. Call 2024-11-12
    title: Annotation Conf. Call 2024-11-12
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2024-11-12
    relevance: 4
    method: opus
    rationale: 'Records a proposal for protein-containing complexes in GO-CAM: only GO complex ids, complexes as enablers
      only for emergent functions or when subunit activities are unknown, and assign MFs to individual subunits otherwise;
      context relation still TBD. Detailed but explicitly a proposal with open actions in minutes, so 4.'
  - id: wiki:Annotation Conf. Call 2025-09-02
    title: Annotation Conf. Call 2025-09-02
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_2025-09-02
    relevance: 4
    method: haiku
    rationale: Documents the contributes_to qualifier for complex members that enable emergent functions and the involved-in
      BP and is-active-in CC convention in GPAD output; a general convention, though stated as a release note.
  - id: wiki:Annotation Conf. Call April 23, 2013
    title: Annotation Conf. Call April 23, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_April_23%2C_2013
    relevance: 4
    method: haiku
    rationale: States that curators should not annotate to top-level terms but may use broad terms when they are the best
      available, and sets rules for creating precomposed apoptosis terms; a general annotation convention.
  - id: wiki:Annotation Conf. Call August 13, 2013
    title: Annotation Conf. Call August 13, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_August_13%2C_2013
    relevance: 4
    method: haiku
    rationale: Agrees to integrate direct interaction data as protein binding with the partner in the With column, map to
      granular terms where possible, and start with IntAct; decisions on binding practice.
  - id: wiki:Annotation Conf. Call July 23, 2013
    title: Annotation Conf. Call July 23, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_July_23%2C_2013
    relevance: 4
    method: haiku
    rationale: Proposes consolidating protein binding pipelines into the GAF with assigned-by and ECO codes, and records that
      there were no serious objections; a consortium-level convention for protein binding.
  - id: wiki:Annotation Conf. Call July 9, 2013
    title: Annotation Conf. Call July 9, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_July_9%2C_2013
    relevance: 4
    method: opus
    rationale: 2013 call proposing no direct annotation to 'enzyme binding' (annotate the most specific enzyme-binding term,
      add such terms on demand), with discussion of protein oligomerization and consolidating protein-binding annotations.
      Proposals and discussion, now largely superseded, so 4.
  - id: wiki:Annotation Conf. Call November 26, 2013
    title: Annotation Conf. Call November 26, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_November_26%2C_2013
    relevance: 4
    method: haiku
    rationale: Discusses whether histone kinase terms should name a residue and how to capture a regulator's activity in column
      16, with worked examples where activated_by fails for protein complexes.
  - id: wiki:Annotation Conf. Call October 22, 2013
    title: Annotation Conf. Call October 22, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call_October_22%2C_2013
    relevance: 4
    method: opus
    rationale: Meeting minutes (2013, archived) recording the Col-16 tutorial outcome that gene products should be annotated
      in the forward direction only (requires_regulator-type reverse relations to be re-examined; only chemicals annotated
      'in reverse'), plus an unresolved proposal restricting has_direct_input to MF. Minutes that record a decision rather
      than a guideline document, and the has_direct_input point is still under discussion, so downgraded to 4.
  - id: wiki:Annotation Conf. Call, April 10, 2012
    title: Annotation Conf. Call, April 10, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_April_10%2C_2012
    relevance: 4
    method: haiku
    rationale: 'Discusses annotation_extension (col-16) quality: which relations file to use, which data is inappropriate
      for the field, and how to improve quality across groups. The GAF config contact-email housekeeping is administrative.'
  - id: wiki:Annotation Conf. Call, April 28, 2015
    title: Annotation Conf. Call, April 28, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_April_28%2C_2015
    relevance: 4
    method: haiku
    rationale: Works through whether co-transfection of two constructs counts as IGI, and how to represent an antagonistic
      regulation effect. The discussion reaches general criteria for IGI versus IDA and when col-16 is the right place for
      such context.
  - id: wiki:Annotation Conf. Call, August 11, 2015
    title: Annotation Conf. Call, August 11, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_August_11%2C_2015
    relevance: 4
    method: haiku
    rationale: Discusses how to rehouse data from obsoleted relations (requires_substance, independent_of, localization_dependent_on)
      and gives the mitophagy example where a new term replaces independent_of. Many entries are marked as obsoleted relationships.
  - id: wiki:Annotation Conf. Call, August 9, 2011
    title: Annotation Conf. Call, August 9, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_August_9%2C_2011
    relevance: 4
    method: opus
    rationale: Minutes (2011, archived) recording consensus that composite IC annotations put all supporting GO IDs in the
      with field and cite a procedural GO_REF, that new IPI annotations require a with-field ID, and that curators should
      not do guilt-by-association IPI BP annotations. Substantive decisions but recorded as call minutes with actions (later
      formalised as GO_REF:0000036 and QC rules), so 4.
  - id: wiki:Annotation Conf. Call, December 13, 2011
    title: Annotation Conf. Call, December 13, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_December_13%2C_2011
    relevance: 4
    method: opus
    rationale: 'Agenda-only page (2011, archived) listing proposed QC checks: IC rows need a GO ID in with, IDA rows must
      have none, ND to root nodes only, ND references as GO_REF, plus contributes_to and protein-binding cleanup items. The
      checks are posed for feedback, not decided here, so downgraded to 4.'
  - id: wiki:Annotation Conf. Call, January 10, 2012
    title: Annotation Conf. Call, January 10, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_10%2C_2012
    relevance: 4
    method: haiku
    rationale: Discusses whether IC-evidenced annotations can be propagated to related species via ISS, a general propagation-practice
      question. The minutes record broad support for enabling it and concern about lowering ISS quality.
  - id: wiki:Annotation Conf. Call, January 14, 2014
    title: Annotation Conf. Call, January 14, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_14%2C_2014
    relevance: 4
    method: haiku
    rationale: 'Discusses guidelines for enzyme regulator activity (GO:0030234): whether direct binding is required, and whether
      regulation can be inferred from an ortholog. Also covers histone kinase residue-named terms and dropping species GAFs
      owned by other groups.'
  - id: wiki:Annotation Conf. Call, January 22, 2013
    title: Annotation Conf. Call, January 22, 2013
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_22%2C_2013
    relevance: 4
    method: haiku
    rationale: Records the consensus on IEP for protein versus gene expression, and that UniProt accession annotations should
      not be read as gene, RNA or protein. Applies generally to Protein2GO users.
  - id: wiki:Annotation Conf. Call, January 24, 2012
    title: Annotation Conf. Call, January 24, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_24%2C_2012
    relevance: 4
    method: opus
    rationale: Minutes (2012, archived) announcing GOC-agreed QC filters (IC with GO ID in with; IDA without; ND to root only
      and no PMID; binding/IPI need a with partner; post-2012 IPI without with filtered) and agreeing IKR may be used outside
      PAINT and to proceed with ISC. Decisions are real but recorded as call minutes, with some IKR details left as action
      items, so 4.
  - id: wiki:Annotation Conf. Call, January 27, 2015
    title: Annotation Conf. Call, January 27, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_27%2C_2015
    relevance: 4
    method: haiku
    rationale: Records the ECO presentation and the point that IPI used as guilt-by-association is not direct evidence, whereas
      IPI for binding terms is direct. Settles how IPI should be read for process annotations.
  - id: wiki:Annotation Conf. Call, January 28, 2014
    title: Annotation Conf. Call, January 28, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_January_28%2C_2014
    relevance: 4
    method: haiku
    rationale: Continues the enzyme regulator activity guidance (binding and regulation in the same experiment, IC combination)
      and the annotation of process targets (collagen catabolism). Raises the general question of how to annotate substrates.
  - id: wiki:Annotation Conf. Call, July 12, 2011
    title: Annotation Conf. Call, July 12, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_July_12%2C_2011
    relevance: 4
    method: haiku
    rationale: Follow-up that confirms soft QC checks, the high_level_annotation_qc subsetdef (only in subset, not comment),
      the transcription jamboree, and an adoption call for a GO annotation guidance page. Applies across groups.
  - id: wiki:Annotation Conf. Call, July 14, 2015
    title: Annotation Conf. Call, July 14, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_July_14%2C_2015
    relevance: 4
    method: haiku
    rationale: Sets new ECO codes for inferred annotations (manual versus electronic inference) and TermGenie templates. Also
      covers the miRNA annotation guidelines and whether regulation of localization should map to regulation of activity.
  - id: wiki:Annotation Conf. Call, July 24, 2012
    title: Annotation Conf. Call, July 24, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_July_24%2C_2012
    relevance: 4
    method: haiku
    rationale: 'Sets the rule for annotations to cell fraction terms: remove if any other CC annotation exists, otherwise
      map to cellular_component with ND. Also covers annotation extension documentation review.'
  - id: wiki:Annotation Conf. Call, July 28, 2015
    title: Annotation Conf. Call, July 28, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_July_28%2C_2015
    relevance: 4
    method: haiku
    rationale: Explains which annotation extension relations (dependent_on, independent_of, in_presence_of) cause OWL and
      pipeline problems, and records examples of obsoleted localization_dependent_on. The discussion of relation usage applies
      generally.
  - id: wiki:Annotation Conf. Call, June 12, 2012
    title: Annotation Conf. Call, June 12, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_June_12%2C_2012
    relevance: 4
    method: haiku
    rationale: Sets hard QC rules for IKR (NOT qualifier required; GO_REF:0000047 needs a with/from ID) and the decision to
      obsolete cell fraction terms. Both apply to all groups.
  - id: wiki:Annotation Conf. Call, June 24, 2014
    title: Annotation Conf. Call, June 24, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_June_24%2C_2014
    relevance: 4
    method: opus
    rationale: 'Minutes (2014, archived) listing extension relations to stop using (not_dependent_on renamed independent_of;
      requires_regulator family as reverse annotation; has_participant never acceptable; has_indirect_input replaced; not_*
      relations hidden) and summarising action items from the AE meeting, plus an enzyme-regulator-vs-BP consistency exercise.
      Several items are posed as questions (''Is it agreed that we can obsolete these?'') and need vetting, so meeting record
      rather than guideline: 4.'
  - id: wiki:Annotation Conf. Call, June 28, 2011
    title: Annotation Conf. Call, June 28, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_June_28%2C_2011
    relevance: 4
    method: opus
    rationale: Minutes (2011, archived) agreeing soft QC checks requiring non-null with for IC and MF IPI annotations, and
      noting the high_level_annotation_qc subset of terms not for direct annotation (behavior, response to stimulus, etc.).
      Decisions are recorded as actions in minutes; the term-subset policy has since evolved (gocheck_do_not_annotate), so
      4.
  - id: wiki:Annotation Conf. Call, June 9, 2015
    title: Annotation Conf. Call, June 9, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_June_9%2C_2015
    relevance: 4
    method: haiku
    rationale: Covers the GAF 2.1 pipe and comma specification, and the ion channel ontology overhaul (selective versus non-selective
      channel terms, with synonym rules). Both affect how terms are used.
  - id: wiki:Annotation Conf. Call, Mar 22, 2011
    title: Annotation Conf. Call, Mar 22, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_Mar_22%2C_2011
    relevance: 4
    method: haiku
    rationale: Covers adopting the 'response to' guideline agreed at the Geneva annotation camp and proposed hard QC checks.
      Also discusses whether pipes or commas separate identifiers in the with field, a convention question.
  - id: wiki:Annotation Conf. Call, March 11, 2014
    title: Annotation Conf. Call, March 11, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_March_11%2C_2014
    relevance: 4
    method: haiku
    rationale: Records a practice discussion on IEP for differential expression experiments and whether to annotate BP terms
      from them, with a case that tests the 'defense response' rule. Also covers a chromatin SO-term question and the E2/E3
      change.
  - id: wiki:Annotation Conf. Call, March 13, 2012
    title: Annotation Conf. Call, March 13, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_March_13%2C_2012
    relevance: 4
    method: haiku
    rationale: Covers the ISC evidence code naming and the 'chain of evidence' concern, with a decision to defer. Also begins
      guidelines for filtering redundant annotations from the consortium GAF.
  - id: wiki:Annotation Conf. Call, March 27, 2012
    title: Annotation Conf. Call, March 27, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_March_27%2C_2012
    relevance: 4
    method: opus
    rationale: Minutes (2012, archived) agreeing IKR changes (no phylogenetic requirement, with/from mandatory with GO_REF,
      NOT qualifier always present) and defining a non-redundant annotation as unique GO ID + gene product + evidence + with/from
      + reference, with col 16/17 considered informative. Also debates IEA parent/child filtering without resolution; decisions
      recorded in minutes, so 4.
  - id: wiki:Annotation Conf. Call, May 12, 2015
    title: Annotation Conf. Call, May 12, 2015
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_May_12%2C_2015
    relevance: 4
    method: opus
    rationale: Minutes (2015, archived) agreeing that ISS transfers may carry annotation extensions only case-by-case with
      curator judgement, presenting the revised 'stable' protein complex definition and exclusion criteria, ion channel selective/non-selective
      overhaul, and a readout-vs-participation note for cytochrome c release. Useful guidance but recorded as call agenda/minutes
      with action items, so 4.
  - id: wiki:Annotation Conf. Call, May 13, 2014
    title: Annotation Conf. Call, May 13, 2014
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_May_13%2C_2014
    relevance: 4
    method: haiku
    rationale: Discusses how to cite multiple identifiers in the with field for IPI (comma versus pipe, with complex-based
      and separate-binding examples). Also covers E2/E3 changes and the extracellular CC branch.
  - id: wiki:Annotation Conf. Call, May 8, 2012
    title: Annotation Conf. Call, May 8, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_May_8%2C_2012
    relevance: 4
    method: haiku
    rationale: Documents the GAF inference procedure (assigned_by=GOC, redundancy rules) and the cycling problem caused by
      MOD clearing of GOC annotations, with the workaround. Also covers a comment on cell fraction terms.
  - id: wiki:Annotation Conf. Call, November 22, 2011
    title: Annotation Conf. Call, November 22, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_November_22%2C_2011
    relevance: 4
    method: opus
    rationale: Agenda (2011, archived) laying out proposed QC checks (IC with GO ID, IDA without, ND root-only, ND references
      as GO_REF) with counts and SQL for finding violations, and the integral_to qualifier proposal. Proposals for discussion
      with possible actions, not decisions, so downgraded to 4.
  - id: wiki:Annotation Conf. Call, November 27, 2012
    title: Annotation Conf. Call, November 27, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_November_27%2C_2012
    relevance: 4
    method: haiku
    rationale: Decides that x-part terms (nuclear_part) are equivalent to x for standard annotation and are added to the high-level
      not-for-annotation set. Also raises cardinality of col-17 for multiple isoform IDs.
  - id: wiki:Annotation Conf. Call, October 25, 2011
    title: Annotation Conf. Call, October 25, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_October_25%2C_2011
    relevance: 4
    method: haiku
    rationale: Proposes limiting the protein binding child terms (gene-specific, family, dependence, domain, complex binding)
      and using protein families instead. This is a general policy question for how to choose among overlapping binding terms.
  - id: wiki:Annotation Conf. Call, September 13, 2011
    title: Annotation Conf. Call, September 13, 2011
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_September_13%2C_2011
    relevance: 4
    method: opus
    rationale: Minutes (2011, archived) approving the GO_REF:0000036 text for composite IC annotations (supporting GO IDs
      from the same gene in with, supporting annotations not IC) with a CUP9 worked example, and agreeing to extend the protein-binding
      IPI/with QC rule to GO:0005488 binding. Decisions recorded in minutes rather than the guideline itself, so 4.
  - id: wiki:Annotation Conf. Call, September 25, 2012
    title: Annotation Conf. Call, September 25, 2012
    url: https://wiki.geneontology.org/index.php/Annotation_Conf._Call%2C_September_25%2C_2012
    relevance: 4
    method: haiku
    rationale: Asks which explicit relations (actively_involved_in versus involved_in) are acceptable for retrofitting existing
      MF and BP annotations in the GPAD qualifier column. Establishes the question of how strong a participation claim is.
  - id: wiki:Annotation Extension Relation:in absence of
    title: Annotation Extension Relation:in absence of
    url: https://wiki.geneontology.org/index.php/Annotation_Extension_Relation%3Ain_absence_of
    relevance: 4
    method: haiku
    rationale: 'Deprecation page for in_absence_of, with the same principle as independent_of: the relation specifies conditions
      and carries a hidden negation, so it cannot be expressed in OWL and does not fold. Applies to extension-relation choice
      generally. Marked DEPRECATED.'
  - id: wiki:Annotation Extension Relation:independent of
    title: Annotation Extension Relation:independent of
    url: https://wiki.geneontology.org/index.php/Annotation_Extension_Relation%3Aindependent_of
    relevance: 4
    method: haiku
    rationale: Deprecation page for independent_of, giving the general principle that extensions should not encode conditions
      under which an annotation holds, because this hides negation and does not fold. Applies to extension-relation choice
      generally. Marked DEPRECATED.
  - id: wiki:Annotation Extension Relation:results in acquisition of features of
    title: Annotation Extension Relation:results in acquisition of features of
    url: https://wiki.geneontology.org/index.php/Annotation_Extension_Relation%3Aresults_in_acquisition_of_features_of
    relevance: 4
    method: haiku
    rationale: 'Usage page for the results_in_acquisition_of_features_of extension relation, with worked IDA examples (Ren
      cell differentiation, MCP4 cell shape) and a ''folding'' convention: a new folded term is created with is_a to the unfolded
      parent and the extension is dropped, plus pipe-joined multiple extensions. Reusable modelling guidance for results_in_*
      relations.'
  - id: wiki:Annotation Extension meeting 2014-06-16
    title: Annotation Extension meeting 2014-06-16
    url: https://wiki.geneontology.org/index.php/Annotation_Extension_meeting_2014-06-16
    relevance: 4
    method: opus
    rationale: 'Meeting minutes (2014, archived) reaching decisions on extension relations: has_input for MF and BP only,
      has_output restricted to BP, occurs_in vs occurs_at definitions, happens_during required for phase terms, has_regulation_target
      for regulation BPs vs has_direct_input for inhibitor MFs, plus unresolved TF relation questions. Rich decisions but
      in minutes form with many items still open, so downgraded to 4.'
  - id: wiki:Annotation QC
    title: Annotation QC
    url: https://wiki.geneontology.org/index.php/Annotation_QC
    relevance: 4
    method: haiku
    rationale: Taxonomy of annotation errors (omission, ISS with-column, over-annotation of ISS to process, varying granularity
      across orthologs, incorrect annotations) with causes and remedies, plus questions on IPI, colocalizes_with, binding
      terms and ribosomal proteins. Substantial general QC guidance.
  - id: wiki:Annotation Redundancy Specification
    title: Annotation Redundancy Specification
    url: https://wiki.geneontology.org/index.php/Annotation_Redundancy_Specification
    relevance: 4
    method: haiku
    rationale: Formal definition of when one annotation is redundant with another, using gene product, class expression with
      column 16, negation, and evidence subsumption (IDA under EXP, moreReliableThan). Gives QC convention for deduplication
      and says redundancy is context dependent.
  - id: wiki:Annotation Review Request
    title: Annotation Review Request
    url: https://wiki.geneontology.org/index.php/Annotation_Review_Request
    relevance: 4
    method: opus
    rationale: 'Curator SOP (reviewed 2022) for the annotation review request process: how requestors set up the spreadsheet
      and GitHub ticket, how curators record Changed/Removed/Checked after re-reading the paper, and prioritisation. It documents
      a QC workflow but contains no guidance on which terms or evidence to use, so downgraded to 4.'
  - id: 'wiki:Annotation consistency : ISS Usage'
    title: 'Annotation consistency : ISS Usage'
    url: https://wiki.geneontology.org/index.php/Annotation_consistency_%3A_ISS_Usage
    relevance: 4
    method: haiku
    rationale: Records the policy that ISS to a complex term is acceptable when all conserved components are shown to be members,
      cited with GO_REF:0000024, and that complex definitions should list members. A documented convention, though it is short.
      Archived category.
  - id: 'wiki:Annotation consistency: HTP'
    title: 'Annotation consistency: HTP'
    url: https://wiki.geneontology.org/index.php/Annotation_consistency%3A_HTP
    relevance: 4
    method: haiku
    rationale: Archived debate on whether to add an HTP evidence tag; the recorded 2008 position rejects a volume-based tag
      and argues that source-level filtering suffices, a stance applicable to high-throughput annotation generally.
  - id: 'wiki:Annotation consistency: IEA, ISS, IC Usage Discussion'
    title: 'Annotation consistency: IEA, ISS, IC Usage Discussion'
    url: https://wiki.geneontology.org/index.php/Annotation_consistency%3A_IEA%2C_ISS%2C_IC_Usage_Discussion
    relevance: 4
    method: haiku
    rationale: 'Discusses general practice for IEA, ISS and IC: which electronic mappings (InterPro2GO, keyword2GO, EC2GO
      and others) are reliable enough to display, when to convert IEA to ISS, and the root-annotation problem. Archived category,
      but the content is broadly applicable guidance.'
  - id: wiki:Annotation guidelines for annotating complexes as annotation objects
    title: Annotation guidelines for annotating complexes as annotation objects
    url: https://wiki.geneontology.org/index.php/Annotation_guidelines_for_annotating_complexes_as_annotation_objects
    relevance: 4
    method: opus
    rationale: 'Draft guidelines for annotating macromolecular complexes as annotation objects (stable IntAct/PRO IDs in col
      2, no chemogenomics-inferred complexes, ISO from mouse complexes with the source ID in with, IMP with the deleted subunit
      in with, no heme binding for haemoglobin complex). Marked ''TO BE REVIEWED'' and several points are questions (''Discuss
      further?''), so a WIP policy rather than settled guidance: 4.'
  - id: wiki:Annotation of Alternate Spliceforms
    title: Annotation of Alternate Spliceforms
    url: https://wiki.geneontology.org/index.php/Annotation_of_Alternate_Spliceforms
    relevance: 4
    method: haiku
    rationale: Archived page, superseded by GAF_Spliceform_Column_Proposal; sets out whether to annotate gene identifiers
      or gene products and how spliceform-specific function should be recorded.
  - id: wiki:Annotation set inference and validation (Archived)
    title: Annotation set inference and validation (Archived)
    url: https://wiki.geneontology.org/index.php/Annotation_set_inference_and_validation_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived formal specification of GO annotation QC defining hard and soft rule violations and which must be
      filtered before release; a real standard, but archived and superseded by later QC pages.
  - id: wiki:Annotations to Cell Fraction-type terms
    title: Annotations to Cell Fraction-type terms
    url: https://wiki.geneontology.org/index.php/Annotations_to_Cell_Fraction-type_terms
    relevance: 4
    method: haiku
    rationale: 'Archived proposal on cell-fraction CC terms (microsome, membrane fraction, synaptosome) with a general rule
      set: remove duplicates of in vivo locations, map each fraction term to a specific CC term, and use ECO:0000004 cell
      fractionation evidence. MGI applied the mappings, so it documents a class-level convention that was partly adopted.'
  - id: wiki:April2011 Annotation Advocacy Report
    title: April2011 Annotation Advocacy Report
    url: https://wiki.geneontology.org/index.php/April2011_Annotation_Advocacy_Report
    relevance: 4
    method: haiku
    rationale: Short announcement that PAINT evidence codes IBA, IBD, IKR and IRD are documented and that groups may use them
      instead of ISS. It establishes a convention for evidence codes for phylogenetically inferred annotations.
  - id: wiki:Are multi-organism process and cellular process disjoint?
    title: Are multi-organism process and cellular process disjoint?
    url: https://wiki.geneontology.org/index.php/Are_multi-organism_process_and_cellular_process_disjoint%3F
    relevance: 4
    method: haiku
    rationale: Ontology-structure proposal to remove the disjointness between cellular process and multi-organism process
      so that cellular multi-organism terms can exist, with taxon-constraint consequences for viral annotations.
  - id: wiki:Binding Terms Conference Call Information
    title: Binding Terms Conference Call Information
    url: https://wiki.geneontology.org/index.php/Binding_Terms_Conference_Call_Information
    relevance: 4
    method: haiku
    rationale: Working-group record of whether GO should capture catalytic binding (ATP binding, substrate versus product)
      and the action to form a group; substantive but unresolved, framing a general binding-term question.
  - id: wiki:Binding Terms Survey Comments
    title: Binding Terms Survey Comments
    url: https://wiki.geneontology.org/index.php/Binding_Terms_Survey_Comments
    relevance: 4
    method: haiku
    rationale: Community survey comments on removing catalytic-substrate binding annotations and redefining x-binding terms.
      The discussion covers ubiquitin-E2 and Argonaute cases and the annotate-to-experiment principle. It is substantial discussion
      of a general practice but reaches no recorded decision.
  - id: wiki:Binding Terms minutes June 09
    title: Binding Terms minutes June 09
    url: https://wiki.geneontology.org/index.php/Binding_Terms_minutes_June_09
    relevance: 4
    method: haiku
    rationale: Minutes arguing that consistency is a principle rather than a rule and that curators should annotate to the
      experiment (use binding only when binding is shown), with a note that existing binding annotations should be kept unless
      wrong; general binding-term practice, no final ruling.
  - id: wiki:Binding and column 16
    title: Binding and column 16
    url: https://wiki.geneontology.org/index.php/Binding_and_column_16
    relevance: 4
    method: haiku
    rationale: Advises that column 16 can add a specific substrate or target to a general term and that a parallel protein
      binding annotation is redundant with it; a general practice point on binding annotations and extensions.
  - id: wiki:Binding terms working group
    title: Binding terms working group
    url: https://wiki.geneontology.org/index.php/Binding_terms_working_group
    relevance: 4
    method: opus
    rationale: Working-group page (2009) iterating draft binding guidelines (avoid redundant substrate binding annotations,
      annotate to the experiment, in vivo relevance) with dated revisions, reviewer objections and a list of open questions
      for GOC. It is a proposal record rather than final guidance (superseded by the Binding Guidelines page), so downgraded
      to 4.
  - id: wiki:CJM EBI Visit September 2008
    title: CJM EBI Visit September 2008
    url: https://wiki.geneontology.org/index.php/CJM_EBI_Visit_September_2008
    relevance: 4
    method: haiku
    rationale: 'Records meeting decisions on ontology structure: MF-to-BP linking limited to cellular-level processes, and
      the decision to map GO molecular_function under BFO process via GO:0003674 is_a BFO:function, with the rationale that
      GO MF is an ontology of processes in the BFO sense. The visible text is truncated (8.8k chars), so later sections were
      not assessed.'
  - id: wiki:Cascades
    title: Cascades
    url: https://wiki.geneontology.org/index.php/Cascades
    relevance: 4
    method: haiku
    rationale: 'Records a class-level naming decision: the cascade wording was removed from intracellular signalling terms
      that do not amplify a signal, and ''x signal transduction'' synonyms were added. It also records how signal-transduction
      terms are structured with has_part and the open question of where a cascade starts and stops.'
  - id: wiki:Cell Cycle
    title: Cell Cycle
    url: https://wiki.geneontology.org/index.php/Cell_Cycle
    relevance: 4
    method: haiku
    rationale: 'Explains the GO cell-cycle design: physical processes separated from temporal phases to avoid true-path problems
      across organisms, and why cytokinesis sits under cell division rather than cell cycle.'
  - id: wiki:Cell Cycle Content Meeting Feb 2013
    title: Cell Cycle Content Meeting Feb 2013
    url: https://wiki.geneontology.org/index.php/Cell_Cycle_Content_Meeting_Feb_2013
    relevance: 4
    method: haiku
    rationale: 'Meeting record deciding cell-cycle structure: phases versus processes, which terms are not for annotation
      (phase transitions tagged as subset), and a definition of cell cycle versus its regulation.'
  - id: wiki:Cell Cycle Content Meeting follow-up 27 March 2013
    title: Cell Cycle Content Meeting follow-up 27 March 2013
    url: https://wiki.geneontology.org/index.php/Cell_Cycle_Content_Meeting_follow-up_27_March_2013
    relevance: 4
    method: haiku
    rationale: Decisions on how phases relate to processes (part_of versus happens_during/starts_during/ends_during) and on
      logical definitions for transitions, with reusable ontology-modelling principles.
  - id: wiki:Cell-type specific GO terms
    title: Cell-type specific GO terms
    url: https://wiki.geneontology.org/index.php/Cell-type_specific_GO_terms
    relevance: 4
    method: haiku
    rationale: Discusses whether cell-type-specific process terms should enter GO versus using column 16, and records general
      conventions (keep 'X differentiation' pre-composed, do not describe the experiment in c16, c16 redundancy is harmless).
  - id: wiki:Cellular component disjoint classes
    title: Cellular component disjoint classes
    url: https://wiki.geneontology.org/index.php/Cellular_component_disjoint_classes
    relevance: 4
    method: haiku
    rationale: 'Establishes a practice for adding disjoint_from axioms to the GO cellular_component hierarchy: add them methodically,
      keep set-disjointness distinct from spatial disjointness, and test for violations. It is a general ontology-structure
      principle, although the page is still a working draft.'
  - id: wiki:Cellular component vs cellular location
    title: Cellular component vs cellular location
    url: https://wiki.geneontology.org/index.php/Cellular_component_vs_cellular_location
    relevance: 4
    method: haiku
    rationale: Discusses whether GO cellular component terms denote locations or structures and weighs options (reinterpret,
      add cell location branch, or use spatial qualifiers), setting a principle for how CC terms are used in annotation.
  - id: wiki:Chemical terms in GO
    title: Chemical terms in GO
    url: https://wiki.geneontology.org/index.php/Chemical_terms_in_GO
    relevance: 4
    method: haiku
    rationale: Working rules for making chemical terms internally consistent before ChEBI alignment, including that part_of
      does not become is_a, that MF-BP links carry metabolism, that every chemical with a role must also be classified by
      structure, and when to use an and-derivative term. These are general practices for a class of terms.
  - id: wiki:Collaboration with MIT GO-Engineering
    title: Collaboration with MIT GO-Engineering
    url: https://wiki.geneontology.org/index.php/Collaboration_with_MIT_GO-Engineering
    relevance: 4
    method: haiku
    rationale: Post-meeting analysis of GO terms flagged as too specific by information-content metrics, with three general
      causes (general term lacking annotation, missing children, suboptimal placement) and the placement principle that a
      term should sit under its most specific biological parent. These clarify placement practice beyond the single case.
  - id: wiki:Column 16 discussion 12-12-09
    title: Column 16 discussion 12-12-09
    url: https://wiki.geneontology.org/index.php/Column_16_discussion_12-12-09
    relevance: 4
    method: opus
    rationale: 'Minutes of a 2009 call agreeing col 16 conventions: CL with part_of for CC and occurs_in for BP/MF, no exclusivity
      implied, no cell-type inference from immortalized lines, pipe/comma syntax, has_input default for biochemical targets,
      and curator-checked ISS transfer of col 16. Foundational but minutes from an early stage, with some advice (has_output
      for transcription targets, has_participant use) since superseded, so 4.'
  - id: wiki:Core Consortium annotation activities - 2012
    title: Core Consortium annotation activities - 2012
    url: https://wiki.geneontology.org/index.php/Core_Consortium_annotation_activities_-_2012
    relevance: 4
    method: haiku
    rationale: 'States consortium requirements for annotation groups: GAF 2.0 submissions, gp2protein and gp2rna identifier
      mapping files, evidence-ontology adoption, and update responsibility reverting to the GOC. Page is in the Annotation
      Archived category, so the guidance is superseded and only historical.'
  - id: wiki:Currency chemicals
    title: Currency chemicals
    url: https://wiki.geneontology.org/index.php/Currency_chemicals
    relevance: 4
    method: haiku
    rationale: Documented convention listing currency chemicals (ATP, H2O, NAD+ and others) that are not treated as primary
      inputs or outputs of reactions, which governs how MF has_input/output is annotated.
  - id: wiki:DKP Sept 20, 2021- annotation documentation
    title: DKP Sept 20, 2021- annotation documentation
    url: https://wiki.geneontology.org/index.php/DKP_Sept_20%2C_2021-_annotation_documentation
    relevance: 4
    method: haiku
    rationale: Records which annotation extension relations are retained, redirected or removed from P2GO (for example has_input,
      has_output, occurs_in) and notes that has_participant is 'not for direct annotation'; a decision on the relation set
      for annotation.
  - id: wiki:Data Dissemination
    title: Data Dissemination
    url: https://wiki.geneontology.org/index.php/Data_Dissemination
    relevance: 4
    method: haiku
    rationale: 'Guideline page defining the filters for incorporating MOD and other external annotations into GOA files: drop
      unmapped IDs, drop rows without PubMed IDs, require the attribution to match the submitting MOD to avoid cyclic redundancy,
      and ignore IEA, ISS and ND. This is a documented dissemination convention rather than guidance on making annotations,
      so 4 not 5.'
  - id: wiki:December 9th 2010
    title: December 9th 2010
    url: https://wiki.geneontology.org/index.php/December_9th_2010
    relevance: 4
    method: haiku
    rationale: 'Signaling working-group minutes settling class-level term conventions: ''x signaling pathway involved in y''
      becomes ''involved in regulation of y'', ''cascade'' should not imply amplification, and pathway nomenclature is retained.
      These decisions apply to a whole class of signaling terms.'
  - id: wiki:Detection and Response to stimulus
    title: Detection and Response to stimulus
    url: https://wiki.geneontology.org/index.php/Detection_and_Response_to_stimulus
    relevance: 4
    method: haiku
    rationale: Documents GO's standard structure and definitions for stimulus detection and response terms, including the
      rule that 'perception of' is limited to organisms with neural processing while 'sensing' is synonymous with 'detection
      of'.
  - id: wiki:Disjoint Documentation
    title: Disjoint Documentation
    url: https://wiki.geneontology.org/index.php/Disjoint_Documentation
    relevance: 4
    method: haiku
    rationale: Documents the top process-ontology disjointness constraints and the rule that a term may descend from several
      disjoint parents only via part_of; an ontology-structure convention curators rely on.
  - id: wiki:Disjoint from
    title: Disjoint from
    url: https://wiki.geneontology.org/index.php/Disjoint_from
    relevance: 4
    method: haiku
    rationale: Defines the disjoint_from tag and what it does and does not mean (not spatial, not annotation exclusion), with
      current and planned uses; a documented convention.
  - id: wiki:Diuresis and Natiuresis call, Thursday 24th March 2011
    title: Diuresis and Natiuresis call, Thursday 24th March 2011
    url: https://wiki.geneontology.org/index.php/Diuresis_and_Natiuresis_call%2C_Thursday_24th_March_2011
    relevance: 4
    method: haiku
    rationale: Sets renal terminology conventions (absorption, secretion and excretion defined by direction of transport)
      and proposes restructuring diuresis and natriuresis under regulation terms; a general definitional convention applicable
      beyond these two terms.
  - id: wiki:Downstream effect - Sc CDC8
    title: Downstream effect - Sc CDC8
    url: https://wiki.geneontology.org/index.php/Downstream_effect_-_Sc_CDC8
    relevance: 4
    method: haiku
    rationale: Discusses whether gene products acting upstream of a process (e.g. thymidylate kinase in DNA replication) should
      be annotated to regulation terms, and the consistency and PAINT transfer consequences of changing that rule; a general
      practice question.
  - id: wiki:Draft Proposal
    title: Draft Proposal
    url: https://wiki.geneontology.org/index.php/Draft_Proposal
    relevance: 4
    method: haiku
    rationale: Proposal for a separate taxon-constraint mapping file with valid_for, specific_to and relevant_to relations,
      recording the working group's reasoning about capturing taxonomic applicability of terms. Not yet signed off, but it
      sets out a general practice for taxon information.
  - id: wiki:Edit in real time
    title: Edit in real time
    url: https://wiki.geneontology.org/index.php/Edit_in_real_time
    relevance: 4
    method: opus
    rationale: 'Binding Working Group draft (2010) of proposed binding guidelines: do not co-annotate binding implied by catalysis/transport,
      prefer protein-binding child terms over GO:0005515, with/from vs extension usage, and QC rules (no NOT on GO:0005515,
      no ISS for protein binding). It is a proposal with struck-through edits, later folded into other pages and partly outdated,
      so it is not itself established guidance.'
  - id: wiki:Editor Guide to has part
    title: Editor Guide to has part
    url: https://wiki.geneontology.org/index.php/Editor_Guide_to_has_part
    relevance: 4
    method: opus
    rationale: 'Short editor note on has_part vs part_of transitivity: a process with has_part a function must include it,
      but is_a children of the function need not be parts. A genuine ontology-structure principle (2018) but terse, with confusingly
      labelled toy graphs, so it falls short of a full guideline.'
  - id: wiki:Editors cross-product implementation plan
    title: Editors cross-product implementation plan
    url: https://wiki.geneontology.org/index.php/Editors_cross-product_implementation_plan
    relevance: 4
    method: haiku
    rationale: Plan and Q&A for editing cross-product files, concluding that cross-product terms are always instantiated in
      the ontology 'within reason' and not for arbitrary combinations; an ontology-editing policy.
  - id: wiki:Electron transport mf-bp Sept 2007 onwards.
    title: Electron transport mf-bp Sept 2007 onwards.
    url: https://wiki.geneontology.org/index.php/Electron_transport_mf-bp_Sept_2007_onwards.
    relevance: 4
    method: haiku
    rationale: Compares three ways to model function-process links for photosynthesis (sensu-style process terms, one process
      with part_of functions, or mining co-annotation) and records the discussion; a general modelling principle for function-process
      links.
  - id: wiki:Electronically curated flag
    title: Electronically curated flag
    url: https://wiki.geneontology.org/index.php/Electronically_curated_flag
    relevance: 4
    method: haiku
    rationale: Archived proposal for separating manual versus electronic curation from evidence codes, with Chris Mungall's
      reasoned response that a new GAF flag is logically equivalent to ECO cross-product terms; general evidence-model guidance.
      Page is marked Archived.
  - id: wiki:Email discussions
    title: Email discussions
    url: https://wiki.geneontology.org/index.php/Email_discussions
    relevance: 4
    method: haiku
    rationale: Archived debate fixing what ISS means (curator-judged sequence-based evidence, experimentally characterised
      with-column donors) versus RCA and IEA; general practice on with-column use. Page is in the Annotation Archived category.
  - id: wiki:Email sum up on ND
    title: Email sum up on ND
    url: https://wiki.geneontology.org/index.php/Email_sum_up_on_ND
    relevance: 4
    method: haiku
    rationale: Records the policy debate on requiring ND as the only evidence code for unknown annotations and the argument
      that evidence codes should describe only method; general guidance on ND usage.
  - id: wiki:Email sum up on RCA
    title: Email sum up on RCA
    url: https://wiki.geneontology.org/index.php/Email_sum_up_on_RCA
    relevance: 4
    method: haiku
    rationale: Curator analysis setting the general rule that purely sequence-based analyses should use ISS (not RCA), with
      a recommendation to narrow the RCA scope and remove text-mining; applies to a whole class of evidence-code decisions.
  - id: wiki:Email synopsis
    title: Email synopsis
    url: https://wiki.geneontology.org/index.php/Email_synopsis
    relevance: 4
    method: haiku
    rationale: Records the general IMP vs IGI boundary decision (single-gene mutation or allele comparison should use IMP,
      with the mutant allele in the with column), a rule that applies across many annotations.
  - id: wiki:Enabled by
    title: Enabled by
    url: https://wiki.geneontology.org/index.php/Enabled_by
    relevance: 4
    method: haiku
    rationale: Brief GO-CAM relation page defining enabled_by as the inverse of enables and stating its use for all MF-to-gene
      associations in models; documents a relation convention with one example.
  - id: wiki:Ensembl Compara annotation projection
    title: Ensembl Compara annotation projection
    url: https://wiki.geneontology.org/index.php/Ensembl_Compara_annotation_projection
    relevance: 4
    method: haiku
    rationale: Documents the propagation rule for Compara projections (one-to-one orthologs only, manually curated IDA/IEP/IGI/IMP/IPI
      terms projected as IEA with the Ensembl ID in with), a reusable convention for orthology-based propagation.
  - id: wiki:Evidence code for 'ISS from IC evidence'
    title: Evidence code for 'ISS from IC evidence'
    url: https://wiki.geneontology.org/index.php/Evidence_code_for_%27ISS_from_IC_evidence%27
    relevance: 4
    method: haiku
    rationale: Documents the ISC code decision for transferring IC-evidenced terms to homologues via a donor in the with field,
      and the meeting consensus against separate ISA/ISO IC codes; a general rule for propagating IC annotations.
  - id: wiki:Evidence codes documentation- to do
    title: Evidence codes documentation- to do
    url: https://wiki.geneontology.org/index.php/Evidence_codes_documentation-_to_do
    relevance: 4
    method: haiku
    rationale: 'Archived Evidence Code Committee correspondence on general rules: ND as the only code for unknown root-node
      annotations, IMP vs IGI for single mutants, with-column usage for ISS, and RCA scope; substantive practice discussion.'
  - id: wiki:Evidence for Inferences based on Ontology links
    title: Evidence for Inferences based on Ontology links
    url: https://wiki.geneontology.org/index.php/Evidence_for_Inferences_based_on_Ontology_links
    relevance: 4
    method: haiku
    rationale: Argues that MF-BP and BP-CC inter-ontology link inferences should not reuse the source evidence code (e.g.
      IMP for a mitochondrial CC term) and proposes a new code for them; general guidance on evidence for ontology-derived
      inferences.
  - id: wiki:Exists during
    title: Exists during
    url: https://wiki.geneontology.org/index.php/Exists_during
    relevance: 4
    method: haiku
    rationale: Annotation extension usage guide for exists_during with worked examples of cellular component annotations qualified
      by cell cycle stage and the folding/unfolding convention; documents a general pattern for CC annotation. Notes a possible
      replacement relation but is not marked obsolete.
  - id: wiki:Extending evidence codes
    title: Extending evidence codes
    url: https://wiki.geneontology.org/index.php/Extending_evidence_codes
    relevance: 4
    method: haiku
    rationale: Archived analysis of mixed axes in legacy evidence codes (reviewed status, computational method, high-throughput)
      and a proposal to disentangle them, with notes on mapping legacy IEAs; general evidence-code design guidance. Page is
      marked Archived.
  - id: wiki:Extension of Protein2GO to non-UniProtKB Identifiers
    title: Extension of Protein2GO to non-UniProtKB Identifiers
    url: https://wiki.geneontology.org/index.php/Extension_of_Protein2GO_to_non-UniProtKB_Identifiers
    relevance: 4
    method: haiku
    rationale: Meeting record fixing which identifier type to use per entity kind for annotation subjects (UniProt for proteins,
      RNAcentral for ncRNAs, IntAct for complexes) and how complexes appear in GAF/GPAD; a reusable identifier convention.
      Page is marked Annotation Archived.
  - id: wiki:Extensions/substance by role
    title: Extensions/substance by role
    url: https://wiki.geneontology.org/index.php/Extensions/substance_by_role
    relevance: 4
    method: haiku
    rationale: Ontology-modelling principle that GO process inputs must be material entities defined by CHEBI roles (GOCHE
      classes), with the rule that biological contexts are defined directly with GO processes; governs how has_input is used
      in logical definitions.
  - id: wiki:Extensions/x-attribute
    title: Extensions/x-attribute
    url: https://wiki.geneontology.org/index.php/Extensions/x-attribute
    relevance: 4
    method: haiku
    rationale: Explains the convention for regulation-of-attribute terms (regulates a bio-attribute with occurs_in) and the
      rationale for modelling counts and qualities as attributes, a general pattern for regulation terms.
  - id: wiki:Extensions/x-multi-organism
    title: Extensions/x-multi-organism
    url: https://wiki.geneontology.org/index.php/Extensions/x-multi-organism
    relevance: 4
    method: haiku
    rationale: Documents the logical-definition convention for multi-species regulation terms (regulates and regulates_process_in
      with organism roles), including decided synonym practice and open issues; a documented ontology-structure convention
      for host-pathogen process terms.
  - id: wiki:FP-regulates-GOfriends-email
    title: FP-regulates-GOfriends-email
    url: https://wiki.geneontology.org/index.php/FP-regulates-GOfriends-email
    relevance: 4
    method: haiku
    rationale: Consortium announcement of inter-ontology regulates links between BP and MF, with guidance that tools which
      ignore relation types can misreport calcium-channel regulators as channels. Marked Deprecated, so the announced plan
      is historical, though the guidance on relation-aware querying still applies.
  - id: wiki:Fate of "transcription regulator activity" and its remaining child terms
    title: Fate of "transcription regulator activity" and its remaining child terms
    url: https://wiki.geneontology.org/index.php/Fate_of_%22transcription_regulator_activity%22_and_its_remaining_child_terms
    relevance: 4
    method: haiku
    rationale: Ontology proposal arguing that MF terms defined only by process are essentially BP terms and should be obsoleted
      with an equivalent BP term for transfer, and that unreviewed transfers should go to BP; a general principle for MF/BP
      redundancy. Proposal, not an adopted decision.
  - id: wiki:Fate of terms referring to general/nonspecific/basal versus specific transcription
    title: Fate of terms referring to general/nonspecific/basal versus specific transcription
    url: https://wiki.geneontology.org/index.php/Fate_of_terms_referring_to_general/nonspecific/basal_versus_specific_transcription
    relevance: 4
    method: haiku
    rationale: Ontology proposal recording the decision to obsolete and merge general vs specific transcription terms, with
      the principle that MF terms defined only by the process affected are really BP information. The reasoning applies to
      a whole class of terms, which is a general ontology-structure principle.
  - id: wiki:Finished Work
    title: Finished Work
    url: https://wiki.geneontology.org/index.php/Finished_Work
    relevance: 4
    method: haiku
    rationale: 'Records decisions on sensu-qualified terms: merge sensu-specific children into the non-sensu parent (cell
      polarity, chromosome organisation) and one parent with cell-type children (pigment). Establishes a general practice
      for sensu terms, though only the first part of the long page was read.'
  - id: wiki:Folding and Unfolding
    title: Folding and Unfolding
    url: https://wiki.geneontology.org/index.php/Folding_and_Unfolding
    relevance: 4
    method: opus
    rationale: Explains folding/unfolding between precomposed GO terms and term-plus-extension expressions, with a brief convention
      that curators request a new GO term rather than an extension when a term-extension pair will be used repeatedly or no
      suitable relation exists. Mostly conceptual/technical exposition (2019) with legacy extension-relation links; the guidance
      part is short.
  - id: wiki:Function-Process Use Cases
    title: Function-Process Use Cases
    url: https://wiki.geneontology.org/index.php/Function-Process_Use_Cases
    relevance: 4
    method: haiku
    rationale: Reasons through when a molecular function term implies a process term (ALL-SOME reading up the graph), so a
      function must not be linked to a process it does not always participate in; a general principle for function-process
      links.
  - id: wiki:Further comment
    title: Further comment
    url: https://wiki.geneontology.org/index.php/Further_comment
    relevance: 4
    method: haiku
    rationale: Argues that the IMP versus IGI decision should depend only on whether one or more genes are mutated, not on
      which gene is annotated; a general decision rule for choosing between these codes, with supporting replies from Val
      Wood and Ashburner.
  - id: wiki:Further comments on filling with field for ISS
    title: Further comments on filling with field for ISS
    url: https://wiki.geneontology.org/index.php/Further_comments_on_filling_with_field_for_ISS
    relevance: 4
    method: haiku
    rationale: Records the consortium position that evidence codes follow the method, not the with-column content, and that
      ISS with-column rules are not relaxed; a policy on method-based evidence codes with a method-tracking file as the resolution.
  - id: wiki:GAF Col17 GeneProducts
    title: GAF Col17 GeneProducts
    url: https://wiki.geneontology.org/index.php/GAF_Col17_GeneProducts
    relevance: 4
    method: haiku
    rationale: GAF 2.0 proposal that col 2 must be a canonical entity (gene or one-to-one protein) and that alternate spliceforms
      go in col 17, with the non-redundancy rule. This is an annotation-practice standard, though framed as a file-format
      specification.
  - id: wiki:GAF Taxonomy Reasoning
    title: GAF Taxonomy Reasoning
    url: https://wiki.geneontology.org/index.php/GAF_Taxonomy_Reasoning
    relevance: 4
    method: haiku
    rationale: 'Documents a general QC rule: propagate annotations up the GO DAG over is_a and part_of and check only_in taxon
      constraints, so IEA rows such as lactation in chicken are flagged as invalid. This is a reusable consistency-check procedure
      applicable to any GAF.'
  - id: wiki:GO 18th Consortium Meeting Action Items
    title: GO 18th Consortium Meeting Action Items
    url: https://wiki.geneontology.org/index.php/GO_18th_Consortium_Meeting_Action_Items
    relevance: 4
    method: haiku
    rationale: Action items include making sensu terms organism-specific by name while keeping GO definitions formal and species-independent,
      and adding cross-product information via editor training; a naming and definition convention for a class of terms.
  - id: wiki:GO 18th Consortium Meeting Minutes Day 2
    title: GO 18th Consortium Meeting Minutes Day 2
    url: https://wiki.geneontology.org/index.php/GO_18th_Consortium_Meeting_Minutes_Day_2
    relevance: 4
    method: haiku
    rationale: Settles that all ontology editors must load the cross-product files and that cross-product information should
      be entered during curation rather than added by reasoner runs afterwards; a general workflow policy with an action.
  - id: wiki:GO Central (GOC) QC Procedure
    title: GO Central (GOC) QC Procedure
    url: https://wiki.geneontology.org/index.php/GO_Central_%28GOC%29_QC_Procedure
    relevance: 4
    method: haiku
    rationale: Describes the GO Central QC procedure, distinguishing filters that drop annotations from warnings that are
      only reported, and points to the GO rules reports; this is QC practice, though the page itself is short and mostly links
      out.
  - id: wiki:GO Consortium Meeting 2007
    title: GO Consortium Meeting 2007
    url: https://wiki.geneontology.org/index.php/GO_Consortium_Meeting_2007
    relevance: 4
    method: haiku
    rationale: Records the policy problem that GOA annotations are lost when MOD files are filtered by taxon, and proposes
      that taxon filtering should not drop annotations that a member group has not integrated; a general policy discussion.
  - id: wiki:GO textbook approach for annotation
    title: GO textbook approach for annotation
    url: https://wiki.geneontology.org/index.php/GO_textbook_approach_for_annotation
    relevance: 4
    method: haiku
    rationale: 'Strategy for annotation: cover biology topic by topic in textbook order, break each area into subprocesses
      with manageable target lists, and couple annotation tightly to ontology development. This is a general annotation-campaign
      practice applicable beyond one case.'
  - id: wiki:GO-CAM August 23, 2017
    title: GO-CAM August 23, 2017
    url: https://wiki.geneontology.org/index.php/GO-CAM_August_23%2C_2017
    relevance: 4
    method: haiku
    rationale: Substantial discussion of when a cellular component annotation should be made, including HTP localization versus
      well-studied genes, and whether CC should use different qualifiers. It frames a general annotation-practice question
      and lists stakeholder considerations.
  - id: wiki:GO-CAM August 9th, 2017
    title: GO-CAM August 9th, 2017
    url: https://wiki.geneontology.org/index.php/GO-CAM_August_9th%2C_2017
    relevance: 4
    method: haiku
    rationale: 'Records the policy for GPAD output qualifiers and inferred annotations: complex members get contributes_to,
      subfunctions of compound MFs get enables, and regulation terms are dropped from the qualifier list. These are decisions
      for a class of relations and apply beyond one case.'
  - id: wiki:GO-CAM Conference Call - 2019-02-19
    title: GO-CAM Conference Call - 2019-02-19
    url: https://wiki.geneontology.org/index.php/GO-CAM_Conference_Call_-_2019-02-19
    relevance: 4
    method: opus
    rationale: Meeting agenda/minutes recording the rules used to convert MOD GPAD annotations into one-gene GO-CAM models
      (MF enabled_by, CC part_of/colocalizes_with, BP relation from gp2term, reference preference PMID>GO_REF>DOI). These
      are import-pipeline decisions recorded in minutes rather than a curator guideline document, so downgraded to 4.
  - id: wiki:GO-CAM Conference Call - 2019-03-19
    title: GO-CAM Conference Call - 2019-03-19
    url: https://wiki.geneontology.org/index.php/GO-CAM_Conference_Call_-_2019-03-19
    relevance: 4
    method: haiku
    rationale: Discusses the MOD import SOP and rules, including whether HTP annotations, has_regulation_target and unextended
      regulation annotations are imported, with answers recorded; a general import convention.
  - id: wiki:GO-CAM Conference Call - 2019-05-21
    title: GO-CAM Conference Call - 2019-05-21
    url: https://wiki.geneontology.org/index.php/GO-CAM_Conference_Call_-_2019-05-21
    relevance: 4
    method: haiku
    rationale: States that each MF including binding terms should carry enabled_by when the entity is known, and discusses
      whether multimerisation MF and BP terms add value in GO-CAM; a modelling principle applied to examples.
  - id: wiki:GO-CAM Noctua Call 2018-03-14
    title: GO-CAM Noctua Call 2018-03-14
    url: https://wiki.geneontology.org/index.php/GO-CAM_Noctua_Call_2018-03-14
    relevance: 4
    method: haiku
    rationale: Discusses how annotation extension relations such as has_regulation_target should be handled in GO-CAM, and
      proposes revising conventional annotations to fit the GO-CAM representation; a general modelling-practice question with
      a stated direction.
  - id: wiki:GO-CAM Noctua Call 2018-06-13
    title: GO-CAM Noctua Call 2018-06-13
    url: https://wiki.geneontology.org/index.php/GO-CAM_Noctua_Call_2018-06-13
    relevance: 4
    method: haiku
    rationale: Records that complex activities must distinguish emergent functions from subunits that enable the complex's
      activity, and debates how the annotation extension whitelist should filter per-MOD output; a general modelling principle
      with a stated distinction.
  - id: wiki:GO-CAM November 8th, 2017
    title: GO-CAM November 8th, 2017
    url: https://wiki.geneontology.org/index.php/GO-CAM_November_8th%2C_2017
    relevance: 4
    method: haiku
    rationale: 'Records the attribution convention for GPAD Assigned By: group values come from users.yaml, the first group
      is the default, and imported function-companion annotations keep their original providedBy. This is a documented policy
      that applies to all Noctua curators.'
  - id: wiki:GO-CAM Working Group Call 2018-07-17
    title: GO-CAM Working Group Call 2018-07-17
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-07-17
    relevance: 4
    method: haiku
    rationale: 'Documents the reference policy for models: PMID preferred, then DOI, then MOD paper ID, with GO_REFs allowed;
      also raises how activities mediated by intervening processes should be modelled. A general policy statement.'
  - id: wiki:GO-CAM Working Group Call 2018-07-24
    title: GO-CAM Working Group Call 2018-07-24
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-07-24
    relevance: 4
    method: haiku
    rationale: Works out that transcription factor activities are part_of regulation of transcription because regulation terms
      are processes and the reasoner cannot infer it from regulates links; a general MF-BP relation principle with figures.
  - id: wiki:GO-CAM Working Group Call 2018-07-31
    title: GO-CAM Working Group Call 2018-07-31
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-07-31
    relevance: 4
    method: opus
    rationale: 'Working-group minutes recording GO-CAM modelling decisions: TF activity part_of regulation of transcription,
      MFs linked to BPs by part_of/causal relations not regulates, leave TF input blank when direct regulation is unknown,
      and prefer the known MF over the root. Decisions in minutes, some later superseded (has_direct_input since obsoleted),
      so 4.'
  - id: wiki:GO-CAM Working Group Call 2018-08-21
    title: GO-CAM Working Group Call 2018-08-21
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-08-21
    relevance: 4
    method: haiku
    rationale: Extends the MF part_of regulation rule to any regulatory entity and reviews the existing has_input MF extensions,
      cataloguing their legitimate uses (regulatory effects, necessary subunits, binding inputs).
  - id: wiki:GO-CAM Working Group Call 2018-08-28
    title: GO-CAM Working Group Call 2018-08-28
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-08-28
    relevance: 4
    method: haiku
    rationale: Proposes replacing has_direct_input with has_input and reviewing has_input extensions that imply indirect or
      unknown proximity; the proposal targets a class of relations and is itself pending.
  - id: wiki:GO-CAM Working Group Call 2018-09-18
    title: GO-CAM Working Group Call 2018-09-18
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-09-18
    relevance: 4
    method: haiku
    rationale: Weighs whether Noctua should keep the full ECO evidence set or the traditional GO codes, and restates the has_input
      proposal; evidence-code practice is debated, with the decision deferred to the next call.
  - id: wiki:GO-CAM Working Group Call 2018-09-25
    title: GO-CAM Working Group Call 2018-09-25
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-09-25
    relevance: 4
    method: opus
    rationale: Working-group minutes recording the direct vs indirect transcription-regulation modelling rule (has input on
      MF and BP only for direct regulation) and a proposal to obsolete has_direct_input; other options still 'under discussion'.
      Meeting record of decisions in progress rather than a guideline, so 4.
  - id: wiki:GO-CAM Working Group Call 2018-10-23
    title: GO-CAM Working Group Call 2018-10-23
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-10-23
    relevance: 4
    method: opus
    rationale: 'Minutes that mostly cover logistics (gitter room, FAQ, roadmap, schedule) but record the settled key point
      for transcription models: include the target via has input on both MF and BP only for direct regulation. A decision
      mentioned in minutes rather than a guideline document, so 4.'
  - id: wiki:GO-CAM Working Group Call 2018-11-27
    title: GO-CAM Working Group Call 2018-11-27
    url: https://wiki.geneontology.org/index.php/GO-CAM_Working_Group_Call_2018-11-27
    relevance: 4
    method: haiku
    rationale: Sets guidance on when to use the root MF versus a known MF (use best judgement, bring in existing annotations
      via the form, keep models updated), applicable to any gene with multiple functions.
  - id: wiki:GO-CAM ectopic meeting July 19th 2017
    title: GO-CAM ectopic meeting July 19th 2017
    url: https://wiki.geneontology.org/index.php/GO-CAM_ectopic_meeting_July_19th_2017
    relevance: 4
    method: haiku
    rationale: Records GO-CAM inference-rule discussion (contributes_to from part_of+enables, MF-to-part propagation, has_input
      rule) and strategies such as never putting enables/complex links in extensions; decisions are partly provisional ('may
      have to revisit').
  - id: wiki:GO-CHEBI-Agenda
    title: GO-CHEBI-Agenda
    url: https://wiki.geneontology.org/index.php/GO-CHEBI-Agenda
    relevance: 4
    method: haiku
    rationale: Agrees that GOCHE 'X and derivative' terms should be renamed 'X-containing compound' and mapped to ChEBI parents,
      after discussing what derivative means chemically; a naming convention applied to a whole class of terms.
  - id: wiki:GO-MIT meeting notes
    title: GO-MIT meeting notes
    url: https://wiki.geneontology.org/index.php/GO-MIT_meeting_notes
    relevance: 4
    method: haiku
    rationale: Workshop notes establishing that is_a and part_of are distinct classification axes in GO, so partitions or
      sub-ontologies must be used for granularity; an ontology-structure principle.
  - id: wiki:GOA, September 2009
    title: GOA, September 2009
    url: https://wiki.geneontology.org/index.php/GOA%2C_September_2009
    relevance: 4
    method: haiku
    rationale: Records a decision to stop generating CC annotations from SPKW2GO and use only SPSL2GO, because keywords lack
      host-organism location terms. This is a policy for a class of mappings that downstream groups must apply.
  - id: wiki:GOCHE meeting 2011-11-09
    title: GOCHE meeting 2011-11-09
    url: https://wiki.geneontology.org/index.php/GOCHE_meeting_2011-11-09
    relevance: 4
    method: haiku
    rationale: Decides to handle conjugate acid and base forms through a new relation R, and to standardise GO term names
      and synonyms for conjugate forms; a general convention for chemical entities in GO.
  - id: wiki:General Gene Ontology Principles
    title: General Gene Ontology Principles
    url: https://wiki.geneontology.org/index.php/General_Gene_Ontology_Principles
    relevance: 4
    method: haiku
    rationale: 'In-progress editor guide stating ontology principles: every term needs an is_a parent, equivalence axioms,
      genus-differentia structure, and terms describe functions rather than specific gene products. It is a general principle
      statement, but the page is a draft.'
  - id: wiki:General guidance to submit annotations to the GO consortium
    title: General guidance to submit annotations to the GO consortium
    url: https://wiki.geneontology.org/index.php/General_guidance_to_submit_annotations_to_the_GO_consortium
    relevance: 4
    method: opus
    rationale: Partially merged SOP page marked 'TO BE REVIEWED' about how outside groups can contribute annotations (via
      UniProt-GOA, GitHub annotation tracker), noting InterPro2GO as the only externally recognised IEA source. Much content
      is outdated (ESTs, microarrays, UniGene) and concerns submission logistics more than annotation practice, so 4.
  - id: wiki:Guidelines for creating a GO term
    title: Guidelines for creating a GO term
    url: https://wiki.geneontology.org/index.php/Guidelines_for_creating_a_GO_term
    relevance: 4
    method: haiku
    rationale: Editor procedure for creating a term in Protégé, including asserted-view use, the required name, ID and definition
      fields, and xref entry. Its procedural steps are tool-specific, but it sets conventions for term creation.
  - id: wiki:Guidelines for creating relationships between terms
    title: Guidelines for creating relationships between terms
    url: https://wiki.geneontology.org/index.php/Guidelines_for_creating_relationships_between_terms
    relevance: 4
    method: haiku
    rationale: Editor guidance on asserting subclass relations via the Subclass-of field and logical definitions, including
      checking inferred parents with the reasoner. It is practical ontology-structure guidance, but brief.
  - id: wiki:Guidelines for database cross references
    title: Guidelines for database cross references
    url: https://wiki.geneontology.org/index.php/Guidelines_for_database_cross_references
    relevance: 4
    method: haiku
    rationale: Editor guideline distinguishing definition xrefs from general term xrefs (mappings) and when GO should maintain
      them. The page is marked TO BE COMPLETED, so coverage is partial.
  - id: wiki:Guidelines for new Cellular Components
    title: Guidelines for new Cellular Components
    url: https://wiki.geneontology.org/index.php/Guidelines_for_new_Cellular_Components
    relevance: 4
    method: haiku
    rationale: Short editors' guideline stating what belongs in the CC ontology (structures and complexes, not individual
      proteins or nucleic acids, not anatomy); it is a real convention but thin and mostly links out to complex-ID pages.
  - id: wiki:Has part
    title: Has part
    url: https://wiki.geneontology.org/index.php/Has_part
    relevance: 4
    method: haiku
    rationale: Proposal to stop using has_part in the ontology and in standard annotations and GO-CAM, except for complex
      members, with reasons; it sets out a general practice for a relation class but is an unreviewed proposal.
  - id: wiki:IC to/from ISS annotations
    title: IC to/from ISS annotations
    url: https://wiki.geneontology.org/index.php/IC_to/from_ISS_annotations
    relevance: 4
    method: haiku
    rationale: Discussion of whether IC-evidenced annotations can be propagated to related organisms via ISS, a question that
      recurs in GOC discussions. It addresses a general evidence-propagation practice, though the excerpt does not show the
      outcome.
  - id: wiki:Immunology Revisions
    title: Immunology Revisions
    url: https://wiki.geneontology.org/index.php/Immunology_Revisions
    relevance: 4
    method: haiku
    rationale: Records the November 2005 GO Content Meeting consensus on the high-level structure of immune system process
      terms, including the immune and inflammatory response relationship to defense response, after 725 new terms were added.
      This is a structural decision for a class of terms, though stated briefly.
  - id: wiki:Incorporation of PAINT annotations (Retired)
    title: Incorporation of PAINT annotations (Retired)
    url: https://wiki.geneontology.org/index.php/Incorporation_of_PAINT_annotations_%28Retired%29
    relevance: 4
    method: haiku
    rationale: Explicitly marked Retired and PAINT Archived; records the 2011 decision that IAS, IMR and IRD lacked evidence-code
      documentation so IAS should be mapped to ISS and GO_REF:0000033 used for integrated PAINT rows, which is a consortium
      decision that has since been superseded by the PAINT evidence codes.
  - id: wiki:Incorporation of PAINT annotations for your species (Retired)
    title: Incorporation of PAINT annotations for your species (Retired)
    url: https://wiki.geneontology.org/index.php/Incorporation_of_PAINT_annotations_for_your_species_%28Retired%29
    relevance: 4
    method: haiku
    rationale: Explicitly marked Retired and PAINT Archived; it records the 2011 policy that UniProt-GOA would retrieve PAINT
      annotations for PomBase, ZFIN, SGD and MGI from the MOD GAF files, which is a general consortium decision but is superseded.
  - id: wiki:Indirectly negatively regulates
    title: Indirectly negatively regulates
    url: https://wiki.geneontology.org/index.php/Indirectly_negatively_regulates
    relevance: 4
    method: haiku
    rationale: 'Gives the GO-CAM usage rule for the ''indirectly negatively regulates'' relation: when to use it, when a regulation-of-process
      term must be added to show the omitted module, and what intervening activities need not be modelled. This applies beyond
      a single case.'
  - id: wiki:Indirectly positively regulates
    title: Indirectly positively regulates
    url: https://wiki.geneontology.org/index.php/Indirectly_positively_regulates
    relevance: 4
    method: haiku
    rationale: 'Gives the same GO-CAM modelling rule for the positive counterpart: conditions for use (indirect, understood
      mechanism, conditional), the module-omission convention, and what need not be modelled. Both rule pages are reviewed
      together.'
  - id: wiki:Inferred from Biological aspect of Ancestor (IBA)
    title: Inferred from Biological aspect of Ancestor (IBA)
    url: https://wiki.geneontology.org/index.php/Inferred_from_Biological_aspect_of_Ancestor_%28IBA%29
    relevance: 4
    method: opus
    rationale: 'Thin evidence-code page: IBA is phylogenetic inference from an ancestral node, WITH/FROM is mandatory and
      normally a PANTHER PTN node ID, with links to the phylogenetic annotation overview. The ''when not to use'' and QC sections
      are empty, so it gives only one brief rule; downgraded to 4.'
  - id: wiki:Inferred from High Throughput Expression Pattern (HEP)
    title: Inferred from High Throughput Expression Pattern (HEP)
    url: https://wiki.geneontology.org/index.php/Inferred_from_High_Throughput_Expression_Pattern_%28HEP%29
    relevance: 4
    method: haiku
    rationale: Gives the rule that expression-level data alone is weak for process annotation, and lists two questions a curator
      must answer (direct correlation with the process, and independent supporting evidence) before using HEP. The guidance
      applies to any expression-based dataset.
  - id: wiki:Inferred from High Throughput Genetic Interaction (HGI)
    title: Inferred from High Throughput Genetic Interaction (HGI)
    url: https://wiki.geneontology.org/index.php/Inferred_from_High_Throughput_Genetic_Interaction_%28HGI%29
    relevance: 4
    method: haiku
    rationale: Defines HGI usage (genetic interactions, co-transfection, functional complementation) and the With/From requirement
      for stable interactor identifiers, with comma and pipe conventions for multi-perturbation experiments. It is a general
      convention, though much of it restates the IGI rules.
  - id: wiki:InterPro2GO Session October 4th 2011
    title: InterPro2GO Session October 4th 2011
    url: https://wiki.geneontology.org/index.php/InterPro2GO_Session_October_4th_2011
    relevance: 4
    method: opus
    rationale: 'Agenda and minutes of a GOA/InterPro meeting that reached some InterPro2GO practices: contributes_to for complex-subunit
      mappings, BP ''translation'' for all ribosomal proteins, NOT versus blacklists for pseudokinases, and the domain-versus-whole-protein
      mapping plan. Meeting minutes recording decisions, not a guideline, and historical (2011; several terms and the plans
      are superseded), so downgraded to 4.'
  - id: wiki:Intracellular signal transduction
    title: Intracellular signal transduction
    url: https://wiki.geneontology.org/index.php/Intracellular_signal_transduction
    relevance: 4
    method: haiku
    rationale: 'Records consortium decisions on naming and structuring intracellular signaling terms: removing cascade from
      non-amplifying terms, using VIA and has_part for cell-surface linkage, and the cassette/module proposal for defining
      where signalling starts and stops.'
  - id: wiki:Involved in
    title: Involved in
    url: https://wiki.geneontology.org/index.php/Involved_in
    relevance: 4
    method: haiku
    rationale: Defines the 'involved in' relation as used between a gene product and a biological process, where its molecular
      function plays an integral role, and gives worked examples that separate ubiquitination-driven processes from the regulatory
      cases. This is a general modelling convention for the relation.
  - id: wiki:Isa complete Discussion Items
    title: Isa complete Discussion Items
    url: https://wiki.geneontology.org/index.php/Isa_complete_Discussion_Items
    relevance: 4
    method: haiku
    rationale: 'Curator discussion settling naming and modelling conventions for the process ontology: ''xxx metabolism''
      renamed ''xxx metabolic process'', how to distinguish cell-cell docking from adhesion, and whether a ''cell maintenance''
      term is a stem-cell term. These apply to whole classes of terms.'
  - id: wiki:Jamboree 18 July 2008-minutes
    title: Jamboree 18 July 2008-minutes
    url: https://wiki.geneontology.org/index.php/Jamboree_18_July_2008-minutes
    relevance: 4
    method: haiku
    rationale: 'Action items and discussion on annotation practice: homooligomerisation should be annotated to the protein
      complex term rather than as a homo-oligomer, IDA is questioned for ''response to heat'' measurements, and ''coenzyme
      binding'' is restricted to activity. These are general annotation rules reached by consensus.'
  - id: wiki:January 10th 2011
    title: January 10th 2011
    url: https://wiki.geneontology.org/index.php/January_10th_2011
    relevance: 4
    method: haiku
    rationale: 'Records the committed decision to remove the process/pathway split in signalling and to rephrase ''x signaling
      pathway involved in y'' as ''involved in regulation of y''. It also states general conventions: no regulation-of-regulation
      terms, and global processes link to a more specific regulated process. This is a decision that applies to a whole class
      of terms.'
  - id: wiki:July 18th 2011
    title: July 18th 2011
    url: https://wiki.geneontology.org/index.php/July_18th_2011
    relevance: 4
    method: haiku
    rationale: Records the decision to split receptor activity into signaling and cargo receptors, keep GO:0004872 as the
      generic term, and treat ligand-gated channels as signalling receptors. It also states that binding alone during endocytosis
      should be annotated to the generic term. These are general practice rules for a class of molecules.
  - id: wiki:LEGO April 4, 2016
    title: LEGO April 4, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_April_4%2C_2016
    relevance: 4
    method: opus
    rationale: LEGO call agenda/notes recording agreement on a strict reading of 'regulates' (excluding parts, moved under
      causally_upstream_of_or_within) and discussion of a provisional implicated_in qualifier and GAF gp2term qualifiers.
      Minutes with provisional decisions later superseded by the GAF 2.2 relations, not a guidance document; downgraded to
      4.
  - id: wiki:LEGO January 5, 2015
    title: LEGO January 5, 2015
    url: https://wiki.geneontology.org/index.php/LEGO_January_5%2C_2015
    relevance: 4
    method: haiku
    rationale: 'Modelling discussion settles a general principle: activities on small molecules are beyond GO scope, so the
      gene product that binds the metabolite (Pho81 with IP7) carries the function. Substantial discussion reaching general
      practice.'
  - id: wiki:LEGO June 27, 2016
    title: LEGO June 27, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_June_27%2C_2016
    relevance: 4
    method: haiku
    rationale: Post-training follow-up that records consensus that causal relations (regulates, causally upstream of) should
      be exported as the annotations curators normally make, and that multiple evidence for one assertion should yield separate
      GAF lines; a general output convention.
  - id: wiki:LEGO June 6, 2016
    title: LEGO June 6, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_June_6%2C_2016
    relevance: 4
    method: haiku
    rationale: Discusses how to represent causal chains of processes and the new direct regulation relations (directly activates,
      directly inhibits, provides direct input) and their intended usage, which is general guidance on relation choice.
  - id: wiki:LEGO May 16, 2016
    title: LEGO May 16, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_May_16%2C_2016
    relevance: 4
    method: haiku
    rationale: 'Covers general GAF/GPAD rules: folding regulates relations into extra annotations, isoform/proteoform annotation
      handling, and whether causally_upstream_of relations should yield conventional BP annotations, which the curators treat
      as established practice from mutant phenotypes.'
  - id: wiki:LEGO May 2, 2016
    title: LEGO May 2, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_May_2%2C_2016
    relevance: 4
    method: haiku
    rationale: Meeting discussion of how far upstream causal chains should be captured in GAF/GPAD output (Wnt secretion model);
      the group settles a general default of including everything in the model and pruning later, and a convention for attribution
      via a curator xref. Reusable policy reasoning for causally-upstream annotations.
  - id: wiki:LEGO May 23, 2016
    title: LEGO May 23, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_May_23%2C_2016
    relevance: 4
    method: haiku
    rationale: Records a practice question on whether protein binding in Noctua should use has_input or the With/From column,
      and whether ECO IGI codes should be refined to show pathway membership; both bear on general annotation conventions
      for protein binding and genetic interactions.
  - id: wiki:LEGO May 9, 2016
    title: LEGO May 9, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_May_9%2C_2016
    relevance: 4
    method: haiku
    rationale: Discusses the principle of recording causally upstream processes in GAF/GPAD, the qualifier proposal for expressing
      activity-to-process relations, and the need for separate GAF lines per evidence; these are general annotation-output
      practices, not one case only.
  - id: wiki:LEGO October 24, 2016
    title: LEGO October 24, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_October_24%2C_2016
    relevance: 4
    method: haiku
    rationale: Settles that when a causal chain links processes, the evidence on the edge relating the two processes should
      support the annotation to the downstream term, and that IMP-type evidence may reflect more than the phenotype; a general
      practice decision for causal-chain annotation.
  - id: wiki:LEGO October 31, 2016
    title: LEGO October 31, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_October_31%2C_2016
    relevance: 4
    method: haiku
    rationale: Proposes that a ligand complex with a secreted and membrane-bound member should be split so occurs_in is stated
      per member, avoiding an extracellular-space CC row curators would not normally make; a general modelling rule for complexes,
      with a model-review example.
  - id: wiki:LEGO September 26, 2016
    title: LEGO September 26, 2016
    url: https://wiki.geneontology.org/index.php/LEGO_September_26%2C_2016
    relevance: 4
    method: haiku
    rationale: Records the consensus that anything asserted in a model is included in GAF/GPAD output, raises the question
      of migrating legacy IDA and IMP annotations to part_of or causally upstream relations, and proposes has_part for protein
      complex members; general policy for legacy and complex annotation.
  - id: wiki:LEGO Specification Proposal
    title: LEGO Specification Proposal
    url: https://wiki.geneontology.org/index.php/LEGO_Specification_Proposal
    relevance: 4
    method: haiku
    rationale: Proposal that defines the annoton unit and usage rules for active entity (AND/OR/NOR), root MF term for unspecified
      function and one MF per activity; a specification that governs how models are built.
  - id: wiki:Logical Definitions
    title: Logical Definitions
    url: https://wiki.geneontology.org/index.php/Logical_Definitions
    relevance: 4
    method: haiku
    rationale: Explains the genus-differentia (cross-product) method for logical definitions and the convention that inferable
      is_a lines must remain in the public go.obo, which is an ontology-structure principle curators rely on; it is 2007-era
      planning material with a 2022 edit, not explicitly marked obsolete.
  - id: wiki:MF-BP inferences
    title: MF-BP inferences
    url: https://wiki.geneontology.org/index.php/MF-BP_inferences
    relevance: 4
    method: haiku
    rationale: 'Documents the rules of the MF-to-BP inference script: a process annotation is inferred from a part_of link
      to an existing molecular function annotation, uniqueness is by term and evidence code, and no inference is made when
      a child process carries the same evidence code. A documented propagation convention.'
  - id: wiki:Manager 12Jan11
    title: Manager 12Jan11
    url: https://wiki.geneontology.org/index.php/Manager_12Jan11
    relevance: 4
    method: opus
    rationale: 'Managers'' minutes recording two decisions: terms are not obsoleted for definition changes that leave annotations
      correct (curators use the def-diff reports), and the undocumented PAINT codes IAS/IDS/IMR/IRD are loaded as ISS for
      now. Minutes rather than guidance, and the evidence-code part is superseded by IBA/IKR/IRD; downgraded to 4.'
  - id: wiki:Manager 16April2014
    title: Manager 16April2014
    url: https://wiki.geneontology.org/index.php/Manager_16April2014
    relevance: 4
    method: haiku
    rationale: Sets out the open With/From syntax decisions (pipe vs comma for multiple IMP, IGI and IEA values, taxon column)
      and their downstream effects; a general annotation-format convention under discussion.
  - id: wiki:Manager 16October2013
    title: Manager 16October2013
    url: https://wiki.geneontology.org/index.php/Manager_16October2013
    relevance: 4
    method: haiku
    rationale: Debates whether ND root-node annotations may coexist with protein binding in Protein2GO, and whether protein
      binding is a biochemical activity or a component function; a general policy question for a class of annotations.
  - id: wiki:Manager 17Nov10
    title: Manager 17Nov10
    url: https://wiki.geneontology.org/index.php/Manager_17Nov10
    relevance: 4
    method: opus
    rationale: 'Managers'' minutes recording the first hard QC rules to go into production: no NOT with GO:0005515, protein
      binding only by IPI with a WITH, and IEP only for BP (the IEP rule was later dropped). Most of the page is per-GAF error-count
      dumps and admin. A recorded decision in minutes, not a guideline; downgraded to 4.'
  - id: wiki:Manager 18December2013
    title: Manager 18December2013
    url: https://wiki.geneontology.org/index.php/Manager_18December2013
    relevance: 4
    method: haiku
    rationale: Proposes keeping protein-complex annotations out of the GAF and in GPAD because users assume all GAF entries
      are gene products; a format convention with a rationale.
  - id: wiki:Manager 1July2015
    title: Manager 1July2015
    url: https://wiki.geneontology.org/index.php/Manager_1July2015
    relevance: 4
    method: haiku
    rationale: Records decisions on IEA for inter-ontology inference (ECO term in GPAD, GO ID in With/From), a process for
      obsoleting relationships, and minting DOIs for GO_REFs, which set general practice beyond one case.
  - id: wiki:Manager 20Dec2012
    title: Manager 20Dec2012
    url: https://wiki.geneontology.org/index.php/Manager_20Dec2012
    relevance: 4
    method: haiku
    rationale: Asks how far GO should support non-standard annotation of chemical action (OAE drug terms) and where else it
      would live; a general scope question for a class of terms.
  - id: wiki:Manager 20November2013
    title: Manager 20November2013
    url: https://wiki.geneontology.org/index.php/Manager_20November2013
    relevance: 4
    method: haiku
    rationale: Drafts GO_REF:0000058 to define what the With/From column holds for phenotype-based biological process annotations,
      and records an action to document paper IDs for IMP With entries, which is a reusable convention.
  - id: wiki:Manager 23March11
    title: Manager 23March11
    url: https://wiki.geneontology.org/index.php/Manager_23March11
    relevance: 4
    method: haiku
    rationale: Discusses why promoter-binding terms are obsoleted (no workable definition of promoter), proposes a response_to
      approach, and debates whether column 16 should be populated; these bear on general term-design and column-16 practice.
  - id: wiki:Manager 2Jun10
    title: Manager 2Jun10
    url: https://wiki.geneontology.org/index.php/Manager_2Jun10
    relevance: 4
    method: haiku
    rationale: Requires that GAF submitters with non-central identifiers also supply a gp2protein file, and proposes QC checks
      drawn from inter-ontology links; both are general annotation-practice decisions.
  - id: wiki:Manager 5November2014
    title: Manager 5November2014
    url: https://wiki.geneontology.org/index.php/Manager_5November2014
    relevance: 4
    method: haiku
    rationale: Answers how to represent curated annotations transferred between bacterial strains (ISS rather than IDA for
      non-orthologs, strain ID in the taxon column, strain-level annotation allowed); a general convention for strain-level
      annotation.
  - id: wiki:Manager 6November2013
    title: Manager 6November2013
    url: https://wiki.geneontology.org/index.php/Manager_6November2013
    relevance: 4
    method: haiku
    rationale: Discusses how to make phenotype-based BP annotations (PO-to-GO mapping) rules-based, and whether a GO_REF should
      document combinatorial evidence and With/From entities; a general method question with action items.
  - id: wiki:Manager 9Jun10
    title: Manager 9Jun10
    url: https://wiki.geneontology.org/index.php/Manager_9Jun10
    relevance: 4
    method: haiku
    rationale: Sets the interim convention of GO_REF:0000033 in the DB:Reference field for PAINT annotations and the rule
      that the PANTHER ID comes first in the With field; this is a convention for a whole class of annotations.
  - id: wiki:Manager Call 2015-05-18
    title: Manager Call 2015-05-18
    url: https://wiki.geneontology.org/index.php/Manager_Call_2015-05-18
    relevance: 4
    method: haiku
    rationale: Debates which ID types may fill column 2 and column 16 (gene versus protein, UniProt versus MOD IDs) and whether
      to map to gene level; a substantial general identifier discussion that reaches no conclusion yet.
  - id: wiki:Manager Call 2015-10-21
    title: Manager Call 2015-10-21
    url: https://wiki.geneontology.org/index.php/Manager_Call_2015-10-21
    relevance: 4
    method: haiku
    rationale: Asks which identifier types go in column 2 and in annotation extensions and whether isoforms or transcripts
      can be captured, with a proposed decision tree; a general identifier-convention question.
  - id: wiki:Manager Call 2015-11-04
    title: Manager Call 2015-11-04
    url: https://wiki.geneontology.org/index.php/Manager_Call_2015-11-04
    relevance: 4
    method: opus
    rationale: 'Managers'' agenda/minutes: extension targets use MOD/UniProtKB/Ensembl gene IDs (Ensembl transcript only for
      isoform-specific targets), has_regulation_target is remapped, Reactome annotations stay TAS, and ChIP is annotated to
      chromatin CC rather than chromatin binding (minutes note this consensus was undocumented). Minutes with partly unresolved
      decisions; downgraded to 4.'
  - id: wiki:Manager Call 2015-12-16
    title: Manager Call 2015-12-16
    url: https://wiki.geneontology.org/index.php/Manager_Call_2015-12-16
    relevance: 4
    method: opus
    rationale: Managers' minutes reaching a consensus that MOD IDs and UniProtKB (plus RNAcentral) represent genes in column
      2 and extensions, and that Ensembl, NCBI Gene and HGNC IDs are not used, with FAQs. HGNC was left open and the final
      text was moved to a Google doc. A recorded decision in minutes; downgraded to 4.
  - id: wiki:Manager Call 2016-06-1
    title: Manager Call 2016-06-1
    url: https://wiki.geneontology.org/index.php/Manager_Call_2016-06-1
    relevance: 4
    method: haiku
    rationale: Compares identifier-space options for gene and gene-product IDs in GAF and GPAD (granular isoform and PRO IDs
      versus canonical IDs) with cost-benefit reasoning; a general convention under debate.
  - id: wiki:Manager Call 2016-06-15
    title: Manager Call 2016-06-15
    url: https://wiki.geneontology.org/index.php/Manager_Call_2016-06-15
    relevance: 4
    method: haiku
    rationale: 'Continues the GAF/GPAD identifier-space debate: whether to output a digested GAF with canonical IDs, how complex
      members map, and whether AE and With IDs need guidelines; open questions on a class of annotation fields.'
  - id: wiki:Manager Call 2016-07-06
    title: Manager Call 2016-07-06
    url: https://wiki.geneontology.org/index.php/Manager_Call_2016-07-06
    relevance: 4
    method: haiku
    rationale: Tentatively allows any ID in annotation extensions provided GPI files exist, and debates propagating complex-level
      BP and CC annotations to subunits via contributes_to; a general extension-ID and complex-propagation practice.
  - id: wiki:Manager Call 2016-07-20
    title: Manager Call 2016-07-20
    url: https://wiki.geneontology.org/index.php/Manager_Call_2016-07-20
    relevance: 4
    method: haiku
    rationale: Proposes a complex-annotation guideline and separates compound complex activity, specific subunit activity
      and unknown subunit involvement, with contributes_to versus a weaker qualifier as options; a propagation rule for complexes.
  - id: wiki:Manager Call 2017-02-15
    title: Manager Call 2017-02-15
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-02-15
    relevance: 4
    method: haiku
    rationale: Argues that new qualifiers or relations are needed for conventional, PAINT and LEGO annotation and that guidelines
      must be written per area of biology, with cell cycle as the model; a general annotation-practice direction.
  - id: wiki:Manager Call 2017-04-05
    title: Manager Call 2017-04-05
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-04-05
    relevance: 4
    method: haiku
    rationale: Proposes rules for active contributing groups (yearly updates, a GitHub monitor) and a GOC right to take over
      unmaintained annotations, plus a dispute time limit; a governance convention for contributed annotations.
  - id: wiki:Manager Call 2017-04-19
    title: Manager Call 2017-04-19
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-04-19
    relevance: 4
    method: haiku
    rationale: Lists scope rules the GO should state for annotation (no secretory-pathway annotation for secreted proteins,
      whether internalised receptors and host proteins hijacked by viruses are annotated); scope principles to review.
  - id: wiki:Manager Call 2017-05-17
    title: Manager Call 2017-05-17
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-05-17
    relevance: 4
    method: haiku
    rationale: Proposes applying involved_in or causally_upstream_of as the default qualifier to legacy annotations and writing
      Noctua-centric guidelines, with the rationale that involved_in should not be the default; a consortium direction on
      qualifier practice.
  - id: wiki:Manager Call 2017-07-05
    title: Manager Call 2017-07-05
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-07-05
    relevance: 4
    method: haiku
    rationale: Plans signalling annotation strategy and BP qualifier guidelines with examples for positive and negative directionality,
      and a legacy-annotation SOP; a practice proposal for qualifiers.
  - id: wiki:Manager Call 2017-07-19
    title: Manager Call 2017-07-19
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-07-19
    relevance: 4
    method: haiku
    rationale: Sets next steps for qualifier guidance and a process for stale annotations that asks each group to name a contact,
      with GOC taking over unresponsive groups' annotations; a governance rule under discussion.
  - id: wiki:Manager Call 2017-10-18
    title: Manager Call 2017-10-18
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-10-18
    relevance: 4
    method: haiku
    rationale: Reviews qualifier decisions, including implementing causally upstream of or within with children causally upstream
      of and involved in, plus open multiple-qualifier, CC qualifier and complex proposals; qualifier-scheme decisions for
      a class of annotations.
  - id: wiki:Manager Call 2017-11-15
    title: Manager Call 2017-11-15
    url: https://wiki.geneontology.org/index.php/Manager_Call_2017-11-15
    relevance: 4
    method: haiku
    rationale: Sets out an SOP for maintaining annotations of inactive projects (GOA for non-MOD species, MODs for their own
      species) and creates a GO_Central group and QA group; governance for orphaned annotation sources.
  - id: wiki:Manager Call 2018-02-21
    title: Manager Call 2018-02-21
    url: https://wiki.geneontology.org/index.php/Manager_Call_2018-02-21
    relevance: 4
    method: haiku
    rationale: Asks for a shared plan for cross-species annotation propagation (PAINT, InterPro2GO, Ensembl and do-not-annotate
      subsets) and proposes a single reference-ID hierarchy (PMID, DOI, then MOD or GO_REF); a general propagation and reference
      convention.
  - id: wiki:Manager Call 2018-03-01
    title: Manager Call 2018-03-01
    url: https://wiki.geneontology.org/index.php/Manager_Call_2018-03-01
    relevance: 4
    method: haiku
    rationale: Sets guidelines and examples for the expanded set of relations (acts upstream of, regulates, involved in) and
      a mechanism for groups to propose new rules; a relation-usage convention under development.
  - id: wiki:Manager Call 2018-09-05
    title: Manager Call 2018-09-05
    url: https://wiki.geneontology.org/index.php/Manager_Call_2018-09-05
    relevance: 4
    method: opus
    rationale: 'Managers'' agenda recording the plan for pre-composed terms: X-binding terms are decomposed to binding plus
      has_input, IPI-with rows convert to IDA with the WITH moved to an extension, and compound terms are split, with open
      options and question marks. A consortium decision recorded in minutes, partly tentative; downgraded to 4.'
  - id: wiki:Manager Call 2018-09-19
    title: Manager Call 2018-09-19
    url: https://wiki.geneontology.org/index.php/Manager_Call_2018-09-19
    relevance: 4
    method: haiku
    rationale: Repeats the pre-composed binding term decomposition policy from 2018-09-05 and adds Noctua as a teaching tool;
      the policy is restated rather than new.
  - id: wiki:Manager Call 2019-02-13
    title: Manager Call 2019-02-13
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-02-13
    relevance: 4
    method: haiku
    rationale: Proposes an SOP for curating bioRxiv preprints (only published source, cite preprint accession, re-review when
      peer-reviewed); a proposed curation practice pending approval.
  - id: wiki:Manager Call 2019-03-13
    title: Manager Call 2019-03-13
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-03-13
    relevance: 4
    method: haiku
    rationale: Discusses whether to filter PAINT annotations where a gene's IBA duplicates its own experimental annotation
      (same-protein circular rows), weighing the support argument against user confusion.
  - id: wiki:Manager Call 2019-03-20
    title: Manager Call 2019-03-20
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-03-20
    relevance: 4
    method: haiku
    rationale: Records the decision that circular same-protein PAINT annotations will not be removed, leaving filtering to
      databases; a general policy on redundant IBA rows.
  - id: wiki:Manager Call 2019-05-01
    title: Manager Call 2019-05-01
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-05-01
    relevance: 4
    method: haiku
    rationale: Proposes a working definition of a GO-CAM (at least one causal relation between two activities) for automatically
      separating GO-CAMs from standard annotation sets, a practice-level definition.
  - id: wiki:Manager Call 2019-05-22
    title: Manager Call 2019-05-22
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-05-22
    relevance: 4
    method: haiku
    rationale: States a proposed process for authoritative-group data (SynGO loaded directly, filtered from MOD files like
      PAINT) and asks the default state for conflicting duplicate-namespace annotations, a general provenance policy.
  - id: wiki:Manager Call 2019-11-6
    title: Manager Call 2019-11-6
    url: https://wiki.geneontology.org/index.php/Manager_Call_2019-11-6
    relevance: 4
    method: haiku
    rationale: Records the convention to import MOD annotations as a literal translation of existing relations (keeping results-in
      relations for now), a general import policy.
  - id: wiki:Manager Call 2020-03-11
    title: Manager Call 2020-03-11
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-03-11
    relevance: 4
    method: haiku
    rationale: Proposes keeping asserted acts-upstream-of annotations out of the GAF and doing a one-time GAF update with
      the full gp2term relation set, a general export-practice policy.
  - id: wiki:Manager Call 2020-03-18
    title: Manager Call 2020-03-18
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-03-18
    relevance: 4
    method: haiku
    rationale: Consensus that qualifier loss from SGD must be fixed at source rather than ignored by PAINT, and that qualifier
      use needs a guideline; also decides one GPI line per protein sequence.
  - id: wiki:Manager Call 2020-04-08
    title: Manager Call 2020-04-08
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-04-08
    relevance: 4
    method: haiku
    rationale: Records decisions on the GAF2.2 relation qualifier change (timeline, no parallel old and new files, warning
      in advance) and how indirect relations affect enrichment.
  - id: wiki:Manager Call 2020-06-17
    title: Manager Call 2020-06-17
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-06-17
    relevance: 4
    method: haiku
    rationale: Decides to change the evidence-code rule rather than the code for inferred annotations so that ontology traversal
      works like other relations, for GOC-provenance annotations; a general convention.
  - id: wiki:Manager Call 2020-09-09
    title: Manager Call 2020-09-09
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-09-09
    relevance: 4
    method: haiku
    rationale: Argues the biologically relevant entity for SARS-CoV-2 GPI rows is the chain and that BP annotations lack empirical
      grounds for excluding regulates; a convention-level direction.
  - id: wiki:Manager Call 2020-09-23
    title: Manager Call 2020-09-23
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-09-23
    relevance: 4
    method: haiku
    rationale: Agrees default GAF2.2 relations for annotations lacking upstream relations (enables for MF, acts upstream of
      or within for BP, located in and part of for CC), a standing convention.
  - id: wiki:Manager Call 2020-10-28
    title: Manager Call 2020-10-28
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-10-28
    relevance: 4
    method: haiku
    rationale: Records a decision on which relation to use for asserted root annotations to biological process and cellular
      component within GAF 2.2 defaults, plus gp2term retrofitting and slim-tool SOP actions; a general annotation-relation
      convention.
  - id: wiki:Manager Call 2020-11-04
    title: Manager Call 2020-11-04
    url: https://wiki.geneontology.org/index.php/Manager_Call_2020-11-04
    relevance: 4
    method: opus
    rationale: 'Managers'' minutes recording decisions for GAF 2.2: root BP/CC annotations use involved_in and is_active_in,
      gp2term relations are not harmonised across orthologs or within a gene for now, and IBA/ISS rows with a more specific
      relation are not redundant. Decisions recorded in minutes alongside project admin; downgraded to 4.'
  - id: wiki:Managers 10Oct07
    title: Managers 10Oct07
    url: https://wiki.geneontology.org/index.php/Managers_10Oct07
    relevance: 4
    method: haiku
    rationale: States the naming convention to use biologist-friendly term names, with the friendly name moved to a synonym
      when two terms would share a name; a general term-naming practice.
  - id: wiki:Managers 14Feb07
    title: Managers 14Feb07
    url: https://wiki.geneontology.org/index.php/Managers_14Feb07
    relevance: 4
    method: haiku
    rationale: Sets the practice of one GO_REF per content meeting cited from structured term comments, and the use of definition
      dbxrefs to credit individual curators, with the known limitations stated; this is a documented convention.
  - id: wiki:Managers 16Dec09
    title: Managers 16Dec09
    url: https://wiki.geneontology.org/index.php/Managers_16Dec09
    relevance: 4
    method: haiku
    rationale: Records the principle that GO uses a metabolic/biochemical view of complex molecules where ChEBI uses a structural
      view, so carbohydrate classification cannot simply be adopted wholesale; a general classification-policy point, though
      unresolved.
  - id: wiki:Managers 18June08
    title: Managers 18June08
    url: https://wiki.geneontology.org/index.php/Managers_18June08
    relevance: 4
    method: haiku
    rationale: Agrees to create specific process terms where needed, linking functions to specific process terms and putting
      biology before term names, a general ontology-modelling principle for mf-bp links.
  - id: wiki:Managers 20Dec06
    title: Managers 20Dec06
    url: https://wiki.geneontology.org/index.php/Managers_20Dec06
    relevance: 4
    method: haiku
    rationale: Designs the structured term-comment convention for crediting expert input (GO_REF-linked contributions, abstracts
      for content meetings), a documented convention for recording term provenance.
  - id: wiki:Managers 24Sep08
    title: Managers 24Sep08
    url: https://wiki.geneontology.org/index.php/Managers_24Sep08
    relevance: 4
    method: haiku
    rationale: Works through how the new GAF gene product identifier column should be filled for isoform-specific annotations
      (null versus copying the gene id), a general annotation-file convention for a class of rows.
  - id: wiki:Managers 2June06
    title: Managers 2June06
    url: https://wiki.geneontology.org/index.php/Managers_2June06
    relevance: 4
    method: opus
    rationale: '2006 managers'' minutes where two policies are decided with rationale: references need not be PubMed IDs if
      a MOD curates and stores large-scale data (gold-standard criteria), and an ISS must be rechecked when its source annotation
      is found wrong. The rest is admin. Historical minutes recording decisions; downgraded to 4.'
  - id: wiki:Managers 3Jan07
    title: Managers 3Jan07
    url: https://wiki.geneontology.org/index.php/Managers_3Jan07
    relevance: 4
    method: haiku
    rationale: Agrees the standard comment syntax 'This term was [added/improved] by [GO_REF]' for capturing expert input
      on terms, a documented convention; also reports the is_a-complete release.
  - id: wiki:Managers 4Nov09
    title: Managers 4Nov09
    url: https://wiki.geneontology.org/index.php/Managers_4Nov09
    relevance: 4
    method: haiku
    rationale: Records the decision to annotate only to molecular function where the MF-BP link implies the BP annotation,
      and to continue adding MF-BP links with written motivation; this is a general annotation-practice decision for a class
      of terms.
  - id: wiki:Manger 19November2014
    title: Manger 19November2014
    url: https://wiki.geneontology.org/index.php/Manger_19November2014
    relevance: 4
    method: haiku
    rationale: 'Managers'' decision on annotation attribution: GO-funded curators annotate for GO_Central without the usual
      authoritative-source approvals, and MOD curators switch source when curating outside their MOD; this is a general practice
      on provenance and redundancy for a class of annotations.'
  - id: wiki:May 10th 2010
    title: May 10th 2010
    url: https://wiki.geneontology.org/index.php/May_10th_2010
    relevance: 4
    method: haiku
    rationale: Establishes that receptor and pathway terms should describe a function or event rather than a gene product,
      and that promiscuous receptor-ligand cases are handled by multiple annotations; also decides to keep both steroid hormone
      receptor and mediated pathway terms. This is a general practice for a class of terms.
  - id: wiki:Mechanisms for reducing annotation redundancy
    title: Mechanisms for reducing annotation redundancy
    url: https://wiki.geneontology.org/index.php/Mechanisms_for_reducing_annotation_redundancy
    relevance: 4
    method: haiku
    rationale: Substantial discussion of what annotation redundancy is, its sources (multiple references, evidence codes,
      orthology transfer, IEA plus manual), and proposed filtering rules such as an evidence-code precedence order and IEA
      filtering; it is explicitly a discussion document with no agreed method, so it clarifies practice without establishing
      policy.
  - id: wiki:Meeting Minutes 2
    title: Meeting Minutes 2
    url: https://wiki.geneontology.org/index.php/Meeting_Minutes_2
    relevance: 4
    method: haiku
    rationale: 'Decides how regulation terms are created and where inter-ontology links live: new terms versus realising the
      link via the parent, and interontology links kept in an editors-only file; general ontology-design practice for a class
      of terms.'
  - id: wiki:Membranes and Envelopes
    title: Membranes and Envelopes
    url: https://wiki.geneontology.org/index.php/Membranes_and_Envelopes
    relevance: 4
    method: opus
    rationale: 'GO editors'' standard for envelope versus membrane versus inner/outer membrane terms: their structure, standard
      definitions and the intermembrane space synonym, with the nuclear envelope rename history. Ontology-structure documentation
      that curators rely on, but it addresses term design rather than annotation practice directly; downgraded to 4.'
  - id: wiki:MiRNA AAAannotations
    title: MiRNA AAAannotations
    url: https://wiki.geneontology.org/index.php/MiRNA_AAAannotations
    relevance: 4
    method: haiku
    rationale: 'Annotator-by-annotator worked review of a miR-29b paper that settles general questions: not annotating artificial
      disease-model data, when cell-type and tissue extensions should be used, whether miRNA-regulation terms need a miRNA-specific
      MF term, and IDA versus IMP choice for pre-miR experiments; marked Archived in its categories and truncated in the batch
      file.'
  - id: wiki:Mining Process Function Links from Annotations
    title: Mining Process Function Links from Annotations
    url: https://wiki.geneontology.org/index.php/Mining_Process_Function_Links_from_Annotations
    relevance: 4
    method: haiku
    rationale: Method for inferring part_of and has_part function-process links from co-annotation statistics, with the explicit
      rule that p(F given P) need not approach 1 because a process has many parts; this is general guidance on what co-annotation
      evidence can and cannot support.
  - id: wiki:Minutes Heart Development workshop (Archived)
    title: Minutes Heart Development workshop (Archived)
    url: https://wiki.geneontology.org/index.php/Minutes_Heart_Development_workshop_%28Archived%29
    relevance: 4
    method: haiku
    rationale: 'Workshop agreements on cross-Bilateria terms: merge hemolymph into blood circulation, keep controversial heart-field
      and asymmetry claims out of GO while allowing child terms, and annotators not using controversial terms in disputed
      organisms. Archived; general term-design practice.'
  - id: wiki:Minutes annotation approaches stanford 2012
    title: Minutes annotation approaches stanford 2012
    url: https://wiki.geneontology.org/index.php/Minutes_annotation_approaches_stanford_2012
    relevance: 4
    method: haiku
    rationale: Workshop discussion of student annotation (CACAO), external second-pair-of-eyes review, banning some terms
      and evidence codes for students, and whether students should request terms; reaches general points on annotation QC
      and crowd-curation practice.
  - id: wiki:Minutes from May 13th 2010 call
    title: Minutes from May 13th 2010 call
    url: https://wiki.geneontology.org/index.php/Minutes_from_May_13th_2010_call
    relevance: 4
    method: haiku
    rationale: 'Survey-based decisions on ''response to'' versus ''cellular response to'' terms and IDA versus IMP: direct
      annotators to cellular terms, clarify evidence codes, and split ''what does the change'' from ''what is changed'' in
      definitions. Reaches general practice for response terms.'
  - id: wiki:Misused terms
    title: Misused terms
    url: https://wiki.geneontology.org/index.php/Misused_terms
    relevance: 4
    method: haiku
    rationale: Sets out a general practice for annotations to protein or chemical production terms (most are wrong and should
      be updated to regulation of the process, to production, or to a signaling pathway), plus the rule that only machinery
      terms should be used for secretion and that protein biosynthesis should map to translation; applies to a class of terms.
  - id: wiki:Muscle biology - Alex Diehl - Muscle Plasticity and "Response to" terms
    title: Muscle biology - Alex Diehl - Muscle Plasticity and "Response to" terms
    url: https://wiki.geneontology.org/index.php/Muscle_biology_-_Alex_Diehl_-_Muscle_Plasticity_and_%22Response_to%22_terms
    relevance: 4
    method: haiku
    rationale: Argues that a biological quality such as plasticity cannot be a process name, so terms become 'regulation of
      X' with is_a links to regulation of biological quality, and that 'response to' terms need precise involvement wording.
      A naming principle for a class of terms; archived.
  - id: wiki:Muscle biology - David Hill - Muscle Plasticity
    title: Muscle biology - David Hill - Muscle Plasticity
    url: https://wiki.geneontology.org/index.php/Muscle_biology_-_David_Hill_-_Muscle_Plasticity
    relevance: 4
    method: haiku
    rationale: 'Sets general principles for plasticity terms: use plasticity terms only for gene products that change, model
      stimulus terms as regulation of plasticity, add only normal (not pathological) processes, and have experts define vague
      terms like ''strenuous'' before use to avoid misannotation across species. Archived 2007 page.'
  - id: wiki:NAS discussion
    title: NAS discussion
    url: https://wiki.geneontology.org/index.php/NAS_discussion
    relevance: 4
    method: haiku
    rationale: Evidence-code committee thread concluding NAS rows should not carry GO IDs or Reactome IDs in the 'with' field,
      since the source supplies the evidence and authors do not state GO-term claims. A decision on a class of evidence rows;
      archived 2007 discussion.
  - id: wiki:Negatively regulates
    title: Negatively regulates
    url: https://wiki.geneontology.org/index.php/Negatively_regulates
    relevance: 4
    method: haiku
    rationale: 'Usage guideline for the negatively regulates relation between BP terms: applies when the mechanism is understood,
      the regulation is via positive effect on the enabler, and the process is non-constitutive, and directs curators to the
      directly or indirectly child relations. Marked WIP and the GO-CAM section is empty, so the guidance is thin.'
  - id: wiki:New documentation for IKR
    title: New documentation for IKR
    url: https://wiki.geneontology.org/index.php/New_documentation_for_IKR
    relevance: 4
    method: opus
    rationale: 'Draft proposal for expanded IKR documentation and a new IKR GO_REF: NOT required, WITH required for GO_REF-based
      IKR, experimental NOT used where available, with HPT, neuroligin/PAINT and Drosophila serine-protease examples. It is
      a proposal superseded by the official IKR page and the GO_REF id is a placeholder; downgraded to 4.'
  - id: wiki:Noctua MOD Imports
    title: Noctua MOD Imports
    url: https://wiki.geneontology.org/index.php/Noctua_MOD_Imports
    relevance: 4
    method: opus
    rationale: 'Rules for converting MOD GPAD annotations into GO-CAMs: one model per gene, BP via root MF part_of, protein-binding
      with/from to has_input, extension cardinality limits and regulation-term conversions. The page itself says rules are
      still under revision and several sections are empty (2019); it is a pipeline conversion spec rather than curator guidance,
      so 4.'
  - id: wiki:Noctua to Standard Annotation Conversion Table
    title: Noctua to Standard Annotation Conversion Table
    url: https://wiki.geneontology.org/index.php/Noctua_to_Standard_Annotation_Conversion_Table
    relevance: 4
    method: haiku
    rationale: Conversion convention between GO-CAM relations and GPAD gene product-to-term and extension relations for MF
      to location, input, output, phase, and part-of-BP links. It states that extensions are output only when primary and
      extension evidence match. The page is marked work in progress with the table kept in a Google doc.
  - id: wiki:Non 1:1 receptor:ligand binding
    title: Non 1:1 receptor:ligand binding
    url: https://wiki.geneontology.org/index.php/Non_1%3A1_receptor%3Aligand_binding
    relevance: 4
    method: haiku
    rationale: 'Records a decision for a class of terms: growth factor receptor activity terms were renamed to ''-ACTIVATED
      receptor activity'' and linked with has_part to ligand binding, so that cross-talk ligands are not implied. This is
      a general naming and modelling convention for ligand-restricted receptor terms, with a 2012 worked set of VEGF-PDGFR
      terms.'
  - id: wiki:October2010 Annotation Advocacy Report
    title: October2010 Annotation Advocacy Report
    url: https://wiki.geneontology.org/index.php/October2010_Annotation_Advocacy_Report
    relevance: 4
    method: opus
    rationale: A 2010 group progress report that mentions two hard QC checks circulated for approval (reference column format;
      ND only on root nodes with GO_REF:0000015) alongside documentation and jamboree updates. It reports proposals rather
      than establishing them, and the ND rule is now codified in GO rule 11 and the ND page; historical, downgraded to 4.
  - id: wiki:Old version of working group wiki
    title: Old version of working group wiki
    url: https://wiki.geneontology.org/index.php/Old_version_of_working_group_wiki
    relevance: 4
    method: haiku
    rationale: Old version (title says so) of the binding-terms working group discussion. It contains a substantial general
      debate on whether substrate-binding terms should be removed from catalytic and transporter annotations, with cons and
      pros and member responses, and no final decision on the page. The page is explicitly old, so use the current binding
      guidance in preference.
  - id: wiki:Ontology Development Progress Report December 2008
    title: Ontology Development Progress Report December 2008
    url: https://wiki.geneontology.org/index.php/Ontology_Development_Progress_Report_December_2008
    relevance: 4
    method: haiku
    rationale: Records the decision to add regulates, positively_regulates and negatively_regulates relations in place of
      part_of for regulatory processes, with the rule that each regulation term must be a subtype of regulation of biological
      process and carry a regulates link; a general convention applied across a class of terms.
  - id: wiki:Ontology Development Progress Report December 2009
    title: Ontology Development Progress Report December 2009
    url: https://wiki.geneontology.org/index.php/Ontology_Development_Progress_Report_December_2009
    relevance: 4
    method: haiku
    rationale: Documents the extension of regulates relations to MF and BP-MF links and the consistency rule for regulation-of-function
      terms (valid subtype plus regulates link); a recorded convention for a class of terms.
  - id: wiki:Ontology Structure
    title: Ontology Structure
    url: https://wiki.geneontology.org/index.php/Ontology_Structure
    relevance: 4
    method: haiku
    rationale: 'Records ontology-structure decisions: is_a completeness, disjoint_from declarations for root terms, and keeping
      inter-ontology links in separate files because annotation propagation expectations differ; general practice for links
      across ontologies.'
  - id: wiki:Ontology meeting 2011-08-31
    title: Ontology meeting 2011-08-31
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2011-08-31
    relevance: 4
    method: haiku
    rationale: Records a consensus that regulation of metabolism by regulation of transcription terms are direct and may continue
      to be added, plus a request to extend the cross-product relation set; a decision applied to a class of terms.
  - id: wiki:Ontology meeting 2011-09-14
    title: Ontology meeting 2011-09-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2011-09-14
    relevance: 4
    method: haiku
    rationale: Plans default gene-product-to-term relations for GAF 2.1 (part_of for CC, participates_in for BP, actively_participates_in
      for MF) and discusses involved_in; a proposed annotation-relation convention, not yet final.
  - id: wiki:Ontology meeting 2011-12-7
    title: Ontology meeting 2011-12-7
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2011-12-7
    relevance: 4
    method: haiku
    rationale: Settles how bidirectional enzyme reactions are handled for process/function links (union term with child reactions,
      or change = to ->, case by case); a convention for a whole class of enzyme terms.
  - id: wiki:Ontology meeting 2012-03-14
    title: Ontology meeting 2012-03-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-03-14
    relevance: 4
    method: haiku
    rationale: Records the working fix for regulation-by-regulation directionality (a results_in relation chained with regulates)
      after the reasoner lost the by construct; a reusable modelling pattern for a class of terms.
  - id: wiki:Ontology meeting 2012-04-18
    title: Ontology meeting 2012-04-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-04-18
    relevance: 4
    method: haiku
    rationale: Records decisions on column-16 relationships (obsoleting has_downstream_target, has_upstream_target and similar,
      keeping others, disjointness to avoid ambiguity); a relation-policy decision for a class of relations.
  - id: wiki:Ontology meeting 2012-08-22
    title: Ontology meeting 2012-08-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-08-22
    relevance: 4
    method: haiku
    rationale: 'Records the roles consensus: create a role term only when the role is well characterised and part_of a process,
      and do not create a function term when the mechanism is unknown; a general rule for a class of terms.'
  - id: wiki:Ontology meeting 2012-09-26
    title: Ontology meeting 2012-09-26
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-09-26
    relevance: 4
    method: haiku
    rationale: Decides to move x transport terms out from under transmembrane transport parents (option 2, to keep definitions
      stable for annotators); a placement policy applied to a whole class of transport terms.
  - id: wiki:Ontology meeting 2012-10-18
    title: Ontology meeting 2012-10-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-10-18
    relevance: 4
    method: haiku
    rationale: Records the good-practice rule never to use uptake in names for processes inside an organelle, and sets cell-junction
      placement and part-of semantics; explicit naming and modelling conventions.
  - id: wiki:Ontology meeting 2012-11-08
    title: Ontology meeting 2012-11-08
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-11-08
    relevance: 4
    method: haiku
    rationale: Decides that ChEBI role terms stay in the cross-product file and may be used by TermGenie, and that new terms
      need a logical definition up front; general policy on ChEBI roles.
  - id: wiki:Ontology meeting 2012-11-29
    title: Ontology meeting 2012-11-29
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-11-29
    relevance: 4
    method: haiku
    rationale: Sets the approach for translation-child TPVs (remove offending xps, use disjointness axioms) and calls for
      a SOP to document decisions as tickets; a documentation convention applicable to all decisions.
  - id: wiki:Ontology meeting 2012-12-06
    title: Ontology meeting 2012-12-06
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2012-12-06
    relevance: 4
    method: haiku
    rationale: Decides metal ion terms keep ion in the name with cation synonyms and xps, and sets TermGenie free-form restrictions
      on regulation of biological quality descendants; explicit naming and submission rules.
  - id: wiki:Ontology meeting 2013-01-31
    title: Ontology meeting 2013-01-31
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-01-31
    relevance: 4
    method: haiku
    rationale: 'Settles practice for single-step process terms: curators need not annotate to the process when the function
      is known, since MF-BP interontology links infer it; notes processes can be multi-step.'
  - id: wiki:Ontology meeting 2013-03-21
    title: Ontology meeting 2013-03-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-03-21
    relevance: 4
    method: haiku
    rationale: Sets constraints on annotation-extension relations (common/advanced/complex subsets) and flags interpro2go
      errors reaching the do-not-annotate anti-slim; general annotation-practice decisions.
  - id: wiki:Ontology meeting 2013-05-09
    title: Ontology meeting 2013-05-09
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-05-09
    relevance: 4
    method: haiku
    rationale: States the go-basic convention (DAG-assuming software must consume go-basic) and the cycle policy; a QC principle
      for ontology releases.
  - id: wiki:Ontology meeting 2013-05-30
    title: Ontology meeting 2013-05-30
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-05-30
    relevance: 4
    method: haiku
    rationale: 'Strategy for no-longer-inferrable links: keep only deliberately asserted links, and regulation-branch terms
      must be inferable; also the catabolic/biosynthetic definition question.'
  - id: wiki:Ontology meeting 2013-08-08
    title: Ontology meeting 2013-08-08
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-08-08
    relevance: 4
    method: haiku
    rationale: 'Policy: when a class has only one subtype, redefine it or create a new subtype (new terms chosen as safer);
      also how annotations propagate up has_part links.'
  - id: wiki:Ontology meeting 2013-12-19
    title: Ontology meeting 2013-12-19
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2013-12-19
    relevance: 4
    method: haiku
    rationale: Proposes annotating multi-organism processes with a dual-taxon column in GPAD; a proposed annotation practice
      for a class of processes.
  - id: wiki:Ontology meeting 2014-08-07
    title: Ontology meeting 2014-08-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2014-08-07
    relevance: 4
    method: haiku
    rationale: Decides regulation-of-pathway terms should be post-composed with causally_upstream_of in annotation extensions
      rather than new monolithic terms; general practice for a class of terms.
  - id: wiki:Ontology meeting 2014-12-02
    title: Ontology meeting 2014-12-02
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2014-12-02
    relevance: 4
    method: haiku
    rationale: Decides to obsolete DNA methyltransferase binding from the TG queue and plans handling of existing enzyme-binding
      terms; policy for a class of binding terms.
  - id: wiki:Ontology meeting 2015-02-12
    title: Ontology meeting 2015-02-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2015-02-12
    relevance: 4
    method: haiku
    rationale: Decides to include protein families in enzyme-binding terms and asks how families are defined; a recorded decision
      for a class of terms.
  - id: wiki:Ontology meeting 2015-12-17
    title: Ontology meeting 2015-12-17
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2015-12-17
    relevance: 4
    method: haiku
    rationale: Records the decision to use the IC evidence code for annotations inferred from annotation extensions, and agrees
      that regulation property chains (negatively + negatively = positively regulates) must be added. Both are general practice
      decisions.
  - id: wiki:Ontology meeting 2016-01-07
    title: Ontology meeting 2016-01-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-01-07
    relevance: 4
    method: haiku
    rationale: Discusses whether doubly-labelled edges may be asserted and how go-basic should handle them, and proposes a
      regional-part definition pattern ('X that part_of some X'). Ontology-structure principles that curators rely on.
  - id: wiki:Ontology meeting 2016-01-21
    title: Ontology meeting 2016-01-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-01-21
    relevance: 4
    method: haiku
    rationale: Decides to obsolete the 22 'negative regulation of X by negative regulation of Y' terms and not to create more
      such terms, and rejects the 'DNA methylation is_a regulation of gene expression, epigenetic' classification. Establishes
      a class-level policy on complex regulation terms.
  - id: wiki:Ontology meeting 2016-01-28
    title: Ontology meeting 2016-01-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-01-28
    relevance: 4
    method: haiku
    rationale: Agrees to avoid naming activities for gene products and to write guidance on enzyme-specific activity terms,
      recording the reasoning. Also decides to stop requesting production/secretion terms and records a design-pattern guidance
      location.
  - id: wiki:Ontology meeting 2016-02-25
    title: Ontology meeting 2016-02-25
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-02-25
    relevance: 4
    method: haiku
    rationale: Works through how specific activity terms should be (e.g. Lys63-specific deubiquitinase) and why co-annotating
      one activity to two terms is problematic. Reaches a general question about MF term specificity.
  - id: wiki:Ontology meeting 2016-03-17
    title: Ontology meeting 2016-03-17
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-03-17
    relevance: 4
    method: haiku
    rationale: Discusses how to define cytoplasmic versus cytosolic transport and proposes a sanity check against annotations,
      and sets out the 'nature of biological_process' question on disease terms. Both bear on general term-scope practice.
  - id: wiki:Ontology meeting 2016-03-24
    title: Ontology meeting 2016-03-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-03-24
    relevance: 4
    method: haiku
    rationale: Establishes that the general 'has_participant' relation is acceptable in annotation extensions, with the rule
      that any extension relation question is an ODP question. A general convention on extension relations.
  - id: wiki:Ontology meeting 2016-04-07
    title: Ontology meeting 2016-04-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-04-07
    relevance: 4
    method: haiku
    rationale: Identifies that the GOC inference pipeline annotated gene products to a 'do not annotate directly' term and
      assigns the fix, establishing that pipelines must not annotate to such terms. A general QC rule.
  - id: wiki:Ontology meeting 2016-04-21
    title: Ontology meeting 2016-04-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-04-21
    relevance: 4
    method: haiku
    rationale: Agrees new transport, localization and establishment definitions and debates merging vesicular transport branches
      via a carrier relation, including when 'occurs in' should be used. Ontology-structure principles for transport terms.
  - id: wiki:Ontology meeting 2016-04-28
    title: Ontology meeting 2016-04-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-04-28
    relevance: 4
    method: haiku
    rationale: Rejects 'non-physiological chemical response' terms (ouabain, dizocilpine) and directs CTD-derived data to
      ticketed discussion. Also records that protein complex terms require examples from multiple species before acceptance.
      Both set general term-acceptance policy.
  - id: wiki:Ontology meeting 2016-05-05
    title: Ontology meeting 2016-05-05
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-05-05
    relevance: 4
    method: haiku
    rationale: Decides not to add residue-specific kinase terms and that primary term names should be what biologists use,
      with other names as synonyms. Also merges ubiquitin-ligase terms, establishing general naming practice.
  - id: wiki:Ontology meeting 2016-05-12
    title: Ontology meeting 2016-05-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-05-12
    relevance: 4
    method: opus
    rationale: Ontology call minutes recording that terms referring to protein families (e.g. in binding/regulation requests)
      will no longer be added, with targets captured in annotation extensions instead; also discusses cell-cell signaling
      grouping terms. Meeting minutes that record a decision rather than a guideline document, so 4.
  - id: wiki:Ontology meeting 2016-07-21
    title: Ontology meeting 2016-07-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-07-21
    relevance: 4
    method: haiku
    rationale: States the convention that an is_a should not be asserted where a logical definition exists and the reasoner
      supplies it, and discusses IRI and relation conventions for slims. The assertion-versus-inference rule is general editing
      practice.
  - id: wiki:Ontology meeting 2016-07-28
    title: Ontology meeting 2016-07-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-07-28
    relevance: 4
    method: haiku
    rationale: Examines how AE and LEGO inference feed GAF annotations, including the IC evidence code versus retained evidence
      code for inter-ontology links, and proposes unifying the inference method. Substantial general discussion of annotation
      inference.
  - id: wiki:Ontology meeting 2016-08-18
    title: Ontology meeting 2016-08-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-08-18
    relevance: 4
    method: haiku
    rationale: Proposes adding inter-ontology links to go-basic and stopping central materialization of inferred annotations,
      and discusses which resources depend on it. Establishes a general direction for inferred annotation practice.
  - id: wiki:Ontology meeting 2016-08-25
    title: Ontology meeting 2016-08-25
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-08-25
    relevance: 4
    method: haiku
    rationale: Agrees to a preliminary plan to merge modified-protein binding terms into 'protein binding' with a do-not-annotate
      comment directing curators to the bound structure. A general practice for protein-binding annotation.
  - id: wiki:Ontology meeting 2016-09-22
    title: Ontology meeting 2016-09-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-09-22
    relevance: 4
    method: haiku
    rationale: Decides not to create high-level multicellular-population terms and to map fungal processes to existing terms,
      with Dicty axiomatisation discussed. General guidance on hierarchy design for taxon-specific processes.
  - id: wiki:Ontology meeting 2016-09-29
    title: Ontology meeting 2016-09-29
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-09-29
    relevance: 4
    method: haiku
    rationale: Decides to remove all EC xrefs containing dashes, to review multi-EC terms, and not to add dash-free EC terms
      to new terms, after explaining how EC2GO over-annotates. A documented convention that prevents a class of wrong mappings.
  - id: wiki:Ontology meeting 2016-10-06
    title: Ontology meeting 2016-10-06
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-10-06
    relevance: 4
    method: opus
    rationale: Minutes agreeing a moratorium on new modified-protein and protein-family binding terms and that GO will not
      categorise gene products by protein family (use extensions/queries instead), with action items for a proposal. Decision
      recorded in minutes, not a guideline itself; 4.
  - id: wiki:Ontology meeting 2016-10-13
    title: Ontology meeting 2016-10-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-10-13
    relevance: 4
    method: haiku
    rationale: Documents a standard procedure for merging terms in OBO-Edit and Protege, including checking inferences and
      retaining the old ID as a synonym. An SOP-style practice for ontology editing and QC.
  - id: wiki:Ontology meeting 2016-10-20
    title: Ontology meeting 2016-10-20
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2016-10-20
    relevance: 4
    method: haiku
    rationale: Records that the protein-complex inference pilot is cancelled and inferred classification returns to the ontology,
      with no means yet to specify species-independent complexes. Establishes a decision on how complexes are represented.
  - id: wiki:Ontology meeting 2017-07-07
    title: Ontology meeting 2017-07-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2017-07-07
    relevance: 4
    method: haiku
    rationale: Works through the meaning of targeting, localization and transport, and proposes annotation comments that say
      which gene products to annotate to each process term. Also asks that obsoletion checks cover annotations, logical definitions
      and external ontologies.
  - id: wiki:Ontology meeting 2017-07-21
    title: Ontology meeting 2017-07-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2017-07-21
    relevance: 4
    method: haiku
    rationale: Asks curators to use the more specific autophagy/CVT process terms rather than grouping terms, and sets out
      vitamin and cofactor curation through ChEBI roles. Also asks for an owner and metadata file per GO slim, a general practice
      for slims.
  - id: wiki:Ontology meeting 2017-11-13
    title: Ontology meeting 2017-11-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2017-11-13
    relevance: 4
    method: haiku
    rationale: Decides to always assert SubClass links alongside logical definitions ('Yes -> TO DOCUMENT') and prefers the
      less granular MF parent in transporter equivalence axioms. General editing conventions for equivalence axioms.
  - id: wiki:Ontology meeting 2017-11-20
    title: Ontology meeting 2017-11-20
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2017-11-20
    relevance: 4
    method: haiku
    rationale: Discusses when to create cellular component assembly, biogenesis or morphogenesis terms and proposes moving
      asserted-parent removal guidance to its own section. Establishes guidance on structuring a class of CC terms and on
      documenting asserted parents.
  - id: wiki:Ontology meeting 2018-03-12
    title: Ontology meeting 2018-03-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-03-12
    relevance: 4
    method: haiku
    rationale: 'Records principles for naming and defining protein complexes: location, function and composition, with one
      complex term rather than one per species. A general convention for complex terms.'
  - id: wiki:Ontology meeting 2018-04-30
    title: Ontology meeting 2018-04-30
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-04-30
    relevance: 4
    method: haiku
    rationale: 'Sets slim governance: any editor may update any slim, slims are declared in subsets.yaml, and the distinction
      between slim and subset is raised. Also raises whether precomposed terms requested by SynGO should be added. General
      policy for slims and term precomposition.'
  - id: wiki:Ontology meeting 2018-06-25
    title: Ontology meeting 2018-06-25
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-06-25
    relevance: 4
    method: haiku
    rationale: Sets out that GO must sanity-check and maintain Reactome and Rhea xrefs, and that molecular function logical
      definitions should be direction-neutral and use ChEBI names. Establishes a general approach to aligning MF definitions
      with external reactions.
  - id: wiki:Ontology meeting 2018-07-02
    title: Ontology meeting 2018-07-02
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-07-02
    relevance: 4
    method: haiku
    rationale: Proposes an obsoletion-notice annotation property for terms slated for removal, and resurrecting lamina reticularis
      because external anatomy ontologies still use it. A general policy for handling contested obsoletions.
  - id: wiki:Ontology meeting 2018-09-24
    title: Ontology meeting 2018-09-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-09-24
    relevance: 4
    method: haiku
    rationale: Decides that transcription factor binding terms specifying distal or proximal regions are obsoleted, with region
      captured by SO terms or extensions. A general rule on putting location detail in extensions rather than term names.
  - id: wiki:Ontology meeting 2018-10-01
    title: Ontology meeting 2018-10-01
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2018-10-01
    relevance: 4
    method: haiku
    rationale: Explains that the regulates inference chain wrongly turns regulation of DNA-binding TF activity into regulation
      of DNA binding, and that this holds for all MF except binding. Identifies a class-level structural problem with a general
      implication.
  - id: wiki:Ontology meeting 2019-03-04
    title: Ontology meeting 2019-03-04
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2019-03-04
    relevance: 4
    method: opus
    rationale: Minutes recording the convention that a compound named as input or output of a pathway makes it a metabolism
      of that compound, intermediates do not, and currency chemicals are handled separately (GH 16943); plus regulates_o_part_of
      removal plans. Minutes mentioning a decision; 4.
  - id: wiki:Ontology meeting 2019-03-11
    title: Ontology meeting 2019-03-11
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2019-03-11
    relevance: 4
    method: haiku
    rationale: Plans removal of regulates-over-part_of inferences, noting many annotations will change at class level, with
      the inference-then-strip approach. Explains a general logical problem with regulation terms and its annotation impact.
  - id: wiki:Ontology meeting 2019-03-18
    title: Ontology meeting 2019-03-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2019-03-18
    relevance: 4
    method: haiku
    rationale: Gives a rule of thumb for when regulation of process 1 can be inferred as regulation of process 2, based on
      whether 1 is a step regulated by a part of 2. A reusable test for regulation inference chains.
  - id: wiki:Ontology meeting 2019-11-04
    title: Ontology meeting 2019-11-04
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2019-11-04
    relevance: 4
    method: haiku
    rationale: Obsoletes the protein oligomerization terms because their use did not match 'protein-containing complex assembly',
      and proposes a single cell/anatomical structure relation for AEs. Establishes practice on protein-x-merization terms
      and extension relations.
  - id: wiki:Ontology meeting 2020-01-13
    title: Ontology meeting 2020-01-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-01-13
    relevance: 4
    method: haiku
    rationale: Discusses what may be cited in definition xrefs (reserving them for stable publications, curator initials,
      EC, Rhea, InterPro) and what the dbxref file should record, a general convention question.
  - id: wiki:Ontology meeting 2020-01-27
    title: Ontology meeting 2020-01-27
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-01-27
    relevance: 4
    method: haiku
    rationale: Sets the direction of aligning ontology logical definitions, ShEx shapes and annotation relations, and retiring
      GOREL relations in favour of RO, with 'results in division of' noted as using 'occurs in' or 'has input' instead.
  - id: wiki:Ontology meeting 2020-02-03
    title: Ontology meeting 2020-02-03
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-02-03
    relevance: 4
    method: haiku
    rationale: Records a pilot replacing 'occurs in' with 'has input' in cell division logical definitions and the policy
      of moving to RO-only relations, which shapes how curators should annotate cell-division terms.
  - id: wiki:Ontology meeting 2020-04-06
    title: Ontology meeting 2020-04-06
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-04-06
    relevance: 4
    method: haiku
    rationale: 'Sets an annotation practice for chemical-dependent processes: always use the xenobiotic term and specify the
      chemical through logical refs so the hierarchy is inferred, avoiding double annotation.'
  - id: wiki:Ontology meeting 2020-07-13
    title: Ontology meeting 2020-07-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-07-13
    relevance: 4
    method: haiku
    rationale: Proposes obsoleting the BP 'regulation of molecular activity' branch because single-step processes are MFs
      and the terms break is_a regulation transitivity, with annotation counts by evidence code to judge impact.
  - id: wiki:Ontology meeting 2020-08-24
    title: Ontology meeting 2020-08-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-08-24
    relevance: 4
    method: haiku
    rationale: Proposes replacing the obsolete GOREL 'has agent' extension with RO 'process has causal agent' across annotation
      extensions, with a list of affected terms and a rule for when logical definitions should use it.
  - id: wiki:Ontology meeting 2020-11-02
    title: Ontology meeting 2020-11-02
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-11-02
    relevance: 4
    method: haiku
    rationale: Examines the MF definition standard (the design-pattern form versus the 'an X that Y' guideline from the ontotip)
      and lists existing verb-initial definitions, a general definition-writing convention.
  - id: wiki:Ontology meeting 2020-11-23
    title: Ontology meeting 2020-11-23
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-11-23
    relevance: 4
    method: haiku
    rationale: Works through compound functions (ontology is_a overloading, two is_a parents) and the has_part unintuitiveness,
      a modelling principle for how MF terms are structured and used in annotation.
  - id: wiki:Ontology meeting 2020-12-14
    title: Ontology meeting 2020-12-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2020-12-14
    relevance: 4
    method: haiku
    rationale: Discusses xrefs on obsolete or merged terms, whether 'process has causal agent' o 'in taxon' should change,
      and why root Cellular Component annotations violate ShEx, as general annotation-validity principles.
  - id: wiki:Ontology meeting 2021-01-25
    title: Ontology meeting 2021-01-25
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-01-25
    relevance: 4
    method: haiku
    rationale: 'Records resolutions for compound MFs: molecules with ATPase activity are_a ATPase, DNA-binding TFs via has_part,
      sequestering activity via protein sequestering activity, each a pattern applicable to a class of terms.'
  - id: wiki:Ontology meeting 2021-02-22
    title: Ontology meeting 2021-02-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-02-22
    relevance: 4
    method: haiku
    rationale: Discusses whether ShEx should align with ontology relations and whether to merge grouping terms under GO:0015318,
      and records the root Cellular Component annotation position (keep current practice).
  - id: wiki:Ontology meeting 2021-03-01
    title: Ontology meeting 2021-03-01
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-03-01
    relevance: 4
    method: haiku
    rationale: Records the decision to keep annotating to root Cellular Component and ND with ShEx changed to permit it, and
      raises process has causal agent for extrasynaptic signalling, a general extension-use question.
  - id: wiki:Ontology meeting 2021-03-15
    title: Ontology meeting 2021-03-15
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-03-15
    relevance: 4
    method: haiku
    rationale: Records the Rhea policy of not waiting for public Rhea reactions and the rule to obsolete clearly wrong unannotated
      terms immediately with an announcement, both general curation policies.
  - id: wiki:Ontology meeting 2021-03-22
    title: Ontology meeting 2021-03-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-03-22
    relevance: 4
    method: haiku
    rationale: Revisits the Rhea policy and the MDR transporter MF term question (broad specificity transporter), plus a proposal
      on protein complexes as anatomical entities, affecting a class of terms.
  - id: wiki:Ontology meeting 2021-04-05
    title: Ontology meeting 2021-04-05
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-04-05
    relevance: 4
    method: haiku
    rationale: Records the decision on the MDR transporter term ('broad specificity transporter') and the ribosome-as-organelle
      question, and gives a standard-URL/PURL guideline for references.
  - id: wiki:Ontology meeting 2021-04-19
    title: Ontology meeting 2021-04-19
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-04-19
    relevance: 4
    method: haiku
    rationale: Sets the purpose of Rhea in GO and argues for directional reactions, with the rule to map a directional kinase
      or dehydrogenase term to the directional reaction, a general reaction-mapping convention.
  - id: wiki:Ontology meeting 2021-06-14
    title: Ontology meeting 2021-06-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-06-14
    relevance: 4
    method: haiku
    rationale: Explains the ATPase split into a class term and an activity term, the do-not-annotate status of GO:0016887,
      and how to re-house direct ATPase annotations, a class-level re-annotation policy.
  - id: wiki:Ontology meeting 2021-06-21
    title: Ontology meeting 2021-06-21
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-06-21
    relevance: 4
    method: haiku
    rationale: Records a DO NOT ANNOTATE flag for x-region terms and agrees that secondary metabolism triads should not always
      be created, to be documented case by case.
  - id: wiki:Ontology meeting 2021-06-28
    title: Ontology meeting 2021-06-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-06-28
    relevance: 4
    method: haiku
    rationale: Proposes always using NAD(P) for enzymes that accept either cofactor, mapped as NarrowMatch to both Rhea reactions,
      with a curation comment on what annotation to it means.
  - id: wiki:Ontology meeting 2021-08-02
    title: Ontology meeting 2021-08-02
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-08-02
    relevance: 4
    method: opus
    rationale: 'Minutes summarising Rhea jamboree decisions: MF terms match enzyme specificity (no per-substrate terms), NAD(P)
      means unknown cofactor with both NAD and NADP children, create only characterized enantiomer terms; also no EC xrefs
      on CC terms. Useful class-wide conventions but recorded as minutes; 4.'
  - id: wiki:Ontology meeting 2021-08-23
    title: Ontology meeting 2021-08-23
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-08-23
    relevance: 4
    method: haiku
    rationale: Records the decision to add do-not-annotate to NAD(P) grouping terms when every known enzyme has a defined
      specificity, flagged as needing documentation, and a synonym-scope check.
  - id: wiki:Ontology meeting 2021-08-30
    title: Ontology meeting 2021-08-30
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-08-30
    relevance: 4
    method: haiku
    rationale: Lists documentation to review on new-term creation and xref guidelines, and states that 'gene expression of
      x' classes should not be named as biological processes, a general naming principle.
  - id: wiki:Ontology meeting 2021-09-27
    title: Ontology meeting 2021-09-27
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-09-27
    relevance: 4
    method: opus
    rationale: Minutes with the decision to obsolete response-to-drug/non-endogenous chemical terms (e.g. methotrexate) after
      6-12 months notice, and the NAD(P) grouping-term do-not-annotate decision flagged as needing documentation. The do_not_manually_annotate
      subset discussed was later removed (2024-03-11), so partly superseded; 4.
  - id: wiki:Ontology meeting 2021-11-01
    title: Ontology meeting 2021-11-01
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2021-11-01
    relevance: 4
    method: haiku
    rationale: Debates annotating with 'has primary input' while the ontology uses 'has input', proposing has primary input
      and has participant as the convention, which governs how reaction participants are annotated.
  - id: wiki:Ontology meeting 2022-01-24
    title: Ontology meeting 2022-01-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-01-24
    relevance: 4
    method: haiku
    rationale: Decides to remove 'conforms to dp' when obsoleting or merging terms, to make localization and metabolic process
      disjoint, and to use 'has direct input' for transport, all general ontology-editing conventions.
  - id: wiki:Ontology meeting 2022-01-31
    title: Ontology meeting 2022-01-31
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-01-31
    relevance: 4
    method: haiku
    rationale: Sets the decision to use has primary input for transport and transporter activity and the priorities for GO-RHEA,
      taxon constraints and design-pattern enforcement, with an aging text-mining concern about phenotype-based predictions.
  - id: wiki:Ontology meeting 2022-05-16
    title: Ontology meeting 2022-05-16
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-05-16
    relevance: 4
    method: haiku
    rationale: Accepts provisional EC xrefs and records the NAD/NADP grouping rule (parent flagged do not annotate, xrefs
      only on the specific children, GOC:curators as def xref), with a new catalytic-activity principles doc.
  - id: wiki:Ontology meeting 2022-05-23
    title: Ontology meeting 2022-05-23
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-05-23
    relevance: 4
    method: haiku
    rationale: Reviews the definition-xref guideline, proposing that GOC:mtg_ dbxrefs for meeting-created definitions be dropped
      in favour of PMIDs, and clarifies which databases are valid xref targets.
  - id: wiki:Ontology meeting 2022-07-18
    title: Ontology meeting 2022-07-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-07-18
    relevance: 4
    method: haiku
    rationale: Decides to remove links from modulation of a process in another organism to the normal process branch, because
      they break physiological correctness and block taxon constraints, a general rule for multi-organism terms.
  - id: wiki:Ontology meeting 2022-08-22
    title: Ontology meeting 2022-08-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-08-22
    relevance: 4
    method: haiku
    rationale: Confirms the MF guideline that substrate-specific terms such as hypoxia-inducible factor-asparagine oxygenase
      activity are out of scope and records adding this as an example in the Out of scope section.
  - id: wiki:Ontology meeting 2022-09-26
    title: Ontology meeting 2022-09-26
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-09-26
    relevance: 4
    method: haiku
    rationale: Decides that 'directly' stays in the label of directly provides input for and asks for an RO ticket on directly
      activates and inhibits, and covers obsoleting nested regulation terms, a relation-naming policy.
  - id: wiki:Ontology meeting 2022-10-24
    title: Ontology meeting 2022-10-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-10-24
    relevance: 4
    method: haiku
    rationale: Sets the BP refactoring aim of separating cellular from organism-level processes and proposes obsoleting merged
      terms in favour of REPLACED BY, a convention on obsoletion versus merge.
  - id: wiki:Ontology meeting 2022-10-31
    title: Ontology meeting 2022-10-31
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-10-31
    relevance: 4
    method: haiku
    rationale: Asks whether ShEx is the source of truth for ontology rules and raises the obsoletion-versus-merge convention
      again with mailing-list consultation, touching how the editing rules are documented.
  - id: wiki:Ontology meeting 2022-11-28
    title: Ontology meeting 2022-11-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2022-11-28
    relevance: 4
    method: haiku
    rationale: Introduces obsoletion ticket templates with an editor checklist, asks whether merges are still allowed, and
      proposes that chemical homeostasis use the monoatomic ion level, a convention for obsoletion practice.
  - id: wiki:Ontology meeting 2023-03-13
    title: Ontology meeting 2023-03-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-03-13
    relevance: 4
    method: haiku
    rationale: States that logical definitions should do most of the work rather than asserted classes and asks when merging
      is acceptable versus obsoletion, general ontology-editing principles.
  - id: wiki:Ontology meeting 2023-05-08
    title: Ontology meeting 2023-05-08
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-05-08
    relevance: 4
    method: haiku
    rationale: Records the GOC decision to add an annotation type 'can be replaced by' so annotations transfer to a non-identical
      term on obsoletion, and sets ontology priorities including the BP refactor.
  - id: wiki:Ontology meeting 2023-05-15
    title: Ontology meeting 2023-05-15
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-05-15
    relevance: 4
    method: haiku
    rationale: Records a new QC check that obsolete IDs in slims cause a Travis error (editors must remove subsets when obsoleting)
      and the annotation review template including regulation children.
  - id: wiki:Ontology meeting 2023-09-18
    title: Ontology meeting 2023-09-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-09-18
    relevance: 4
    method: haiku
    rationale: Proposes a guideline that signalling pathways must be described molecularly rather than at cell level, which
      would put cell-cell signalling terms out of scope, applying to a whole class of terms.
  - id: wiki:Ontology meeting 2023-09-25
    title: Ontology meeting 2023-09-25
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-09-25
    relevance: 4
    method: haiku
    rationale: Weighs whether cell x to cell y signalling is a biological process relevant to GO, with examples of orthogonality
      to signalling pathways, and sets up a pros and cons table for has input versus has primary input.
  - id: wiki:Ontology meeting 2023-10-09
    title: Ontology meeting 2023-10-09
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-10-09
    relevance: 4
    method: opus
    rationale: 'Minutes recording decisions: link only valid EC terms with BROAD/NARROW xrefs, xrefs may stay on obsolete
      terms, drop ''Formerly EC'' history; create separate directional MF terms when opposite reactions occur physiologically
      via different enzymes. Ontology-editing conventions in minutes (xref rule later revisited 2025); 4.'
  - id: wiki:Ontology meeting 2023-11-13
    title: Ontology meeting 2023-11-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-11-13
    relevance: 4
    method: haiku
    rationale: Reports that computed taxon constraints are now in go-plus, asks whether redundant asserted constraints should
      be removed, and assigns an SOP for reviewing and suggesting new taxon constraints.
  - id: wiki:Ontology meeting 2023-11-27
    title: Ontology meeting 2023-11-27
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-11-27
    relevance: 4
    method: opus
    rationale: Minutes recording consensus to obsolete 'modification of host process by symbiont/virus' terms in favour of
      'in another organism' terms with replaced_by (no annotation review needed), and raising MetaCyc/Rhea-only mapping. Decision
      for a class of terms recorded in minutes; 4.
  - id: wiki:Ontology meeting 2023-12-11
    title: Ontology meeting 2023-12-11
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2023-12-11
    relevance: 4
    method: haiku
    rationale: Proposes GOC:EC and GOC:RHEA placeholders in def and synonym xrefs so only the xref list is maintained, with
      a synonym sync check decided, a general xref-maintenance convention.
  - id: wiki:Ontology meeting 2024-01-08
    title: Ontology meeting 2024-01-08
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-01-08
    relevance: 4
    method: haiku
    rationale: Sets 2024 objectives including design pattern review, with transport axes (mechanism, substrate, location)
      and signalling receptor activity by ligand input, applying general classification principles across many terms.
  - id: wiki:Ontology meeting 2024-01-22
    title: Ontology meeting 2024-01-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-01-22
    relevance: 4
    method: haiku
    rationale: Agrees rules for stress-activated MAPK terms (define by members, use the community label, add systematic synonym
      and curator note not to annotate to mismatched labels) and a regulation closure for taxon constraints via regulates
      in other organism.
  - id: wiki:Ontology meeting 2024-01-29
    title: Ontology meeting 2024-01-29
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-01-29
    relevance: 4
    method: haiku
    rationale: Proposes switching annotations to has primary input and records the protein-complex guideline that complexes
      should be species-agnostic, not separate cytoplasmic, mitochondrial or plastid versions.
  - id: wiki:Ontology meeting 2024-02-12
    title: Ontology meeting 2024-02-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-02-12
    relevance: 4
    method: haiku
    rationale: Notes that subset membership triggers obsoletion announcements, sets an approach for automatic exact-match
      mapping via reciprocal 1:1 links with BROAD and NARROW otherwise, and rules gasoreceptor activity out of scope.
  - id: wiki:Ontology meeting 2024-03-11
    title: Ontology meeting 2024-03-11
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-03-11
    relevance: 4
    method: opus
    rationale: 'Minutes recording subset decisions: keep do_not_annotate as a warning enforced in Noctua/PAINT, add an obsoletion_candidate
      subset for early notice, and fold do_not_manually_annotate into do_not_annotate. Directly relevant to annotators but
      a decision in minutes; 4.'
  - id: wiki:Ontology meeting 2024-03-18
    title: Ontology meeting 2024-03-18
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-03-18
    relevance: 4
    method: opus
    rationale: Minutes with the decision that for ChEBI-driven relabelling of ambiguous chemical terms the more common enantiomer
      is assumed, creating the other on request; the EC-xref-on-obsolete-terms question is left open. Class-wide term convention
      recorded in minutes; 4.
  - id: wiki:Ontology meeting 2024-04-22
    title: Ontology meeting 2024-04-22
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-04-22
    relevance: 4
    method: haiku
    rationale: Asks when to change enzyme definitions to match EC or Rhea and whether GOC:pz definition xrefs survive, proposes
      a guideline change, and raises whether a leaf EC can be a parent of MF terms.
  - id: wiki:Ontology meeting 2024-04-29
    title: Ontology meeting 2024-04-29
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-04-29
    relevance: 4
    method: haiku
    rationale: Continues the definition xref review and asks whether chemicals or MFs belong in logical definitions for metabolic
      processes, a general logical-definition practice question.
  - id: wiki:Ontology meeting 2024-05-13
    title: Ontology meeting 2024-05-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-05-13
    relevance: 4
    method: haiku
    rationale: Agrees by email that starts with and ends with should not go in logical definitions, with counts of their use,
      and asks the editing team to decide the general guideline for chemicals and catalytic activities in LDs.
  - id: wiki:Ontology meeting 2024-06-10
    title: Ontology meeting 2024-06-10
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-06-10
    relevance: 4
    method: opus
    rationale: Minutes with a DECISION that logical definitions of metabolic-process terms use only chemicals (has primary
      input/output), with participant MFs asserted separately and the GO parent as genus for pathway variants; also proposed
      new metabolic process definitions. Decision in minutes; 4.
  - id: wiki:Ontology meeting 2024-06-17
    title: Ontology meeting 2024-06-17
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-06-17
    relevance: 4
    method: haiku
    rationale: Substantial discussion of textual definition templates for metabolic, biosynthetic and catabolic processes,
      plus EC label alignment rules that apply beyond one term.
  - id: wiki:Ontology meeting 2024-07-01
    title: Ontology meeting 2024-07-01
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-07-01
    relevance: 4
    method: haiku
    rationale: Decides to follow the protein-containing complex textual definition guideline rather than bespoke defs, and
      discusses the granularity rule for regulator activity terms.
  - id: wiki:Ontology meeting 2024-08-19
    title: Ontology meeting 2024-08-19
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-08-19
    relevance: 4
    method: haiku
    rationale: Discusses how to pre-compute inherited taxon constraints for display and when to create part-of BP terms, and
      raises the scope question for small molecule sensor activity.
  - id: wiki:Ontology meeting 2024-08-26
    title: Ontology meeting 2024-08-26
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-08-26
    relevance: 4
    method: haiku
    rationale: Records the xref policy that exact and narrow matches stay in xrefs for legacy tools, with a new mapping-type
      property, and assigns documentation of xref versus property content.
  - id: wiki:Ontology meeting 2024-09-30
    title: Ontology meeting 2024-09-30
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-09-30
    relevance: 4
    method: haiku
    rationale: Discusses whether 'expression of specific genes' terms should mean signalling ending with x, and flags that
      participants in pathways need written guidelines.
  - id: wiki:Ontology meeting 2024-10-07
    title: Ontology meeting 2024-10-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-10-07
    relevance: 4
    method: haiku
    rationale: Proposes a guideline that two MFs or a common readout do not by themselves equate a process unless there is
      a branch point, and encourages start and end reactions in logical definitions.
  - id: wiki:Ontology meeting 2024-10-28
    title: Ontology meeting 2024-10-28
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-10-28
    relevance: 4
    method: haiku
    rationale: Decides to keep current logical definitions for homoserine-type pathways and to align phosphoglycerate mutase
      activity with RHEA, updating the catalytic activity out-of-scope documentation.
  - id: wiki:Ontology meeting 2024-12-09
    title: Ontology meeting 2024-12-09
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2024-12-09
    relevance: 4
    method: haiku
    rationale: Points to a draft guideline for cross-reference types (exact, broad, narrow) and to the documentation section
      that needs improving, which is general xref practice.
  - id: wiki:Ontology meeting 2025-01-27
    title: Ontology meeting 2025-01-27
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-01-27
    relevance: 4
    method: haiku
    rationale: Raises the granularity question for tRNA modification BP terms, whether CC should appear in MF and BP terms,
      and pyruvate do-not-annotate; these are general term-creation questions.
  - id: wiki:Ontology meeting 2025-02-10
    title: Ontology meeting 2025-02-10
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-02-10
    relevance: 4
    method: haiku
    rationale: Decides to keep catalytic activity terms for DNA-acting enzymes as they are and discusses OR in logical definitions
      and biosynthesis vs salvage, all with general implications.
  - id: wiki:Ontology meeting 2025-02-24
    title: Ontology meeting 2025-02-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-02-24
    relevance: 4
    method: haiku
    rationale: Records a do-not-annotate decision for pyruvate metabolic process and proposes anchoring reaction definitions
      on RHEA; the decision applies to one grouping term.
  - id: wiki:Ontology meeting 2025-03-10
    title: Ontology meeting 2025-03-10
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-03-10
    relevance: 4
    method: haiku
    rationale: States the general rule that OR is not allowed in logical definitions and agrees to move salvage pathways under
      biosynthesis, both of which govern how processes are structured.
  - id: wiki:Ontology meeting 2025-03-17
    title: Ontology meeting 2025-03-17
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-03-17
    relevance: 4
    method: haiku
    rationale: Documents the decision to keep ENZYME as xref source of truth and flags reaction-specificity rules as needing
      documentation; also records reverting automatic namespace assignment.
  - id: wiki:Ontology meeting 2025-03-24
    title: Ontology meeting 2025-03-24
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-03-24
    relevance: 4
    method: opus
    rationale: Minutes recording the DECISION to remove regulation relations from MF terms (go-basic positively_regulates
      links), and raising when to create BP/CC terms and reaction specificity. One clear decision in minutes; 4.
  - id: wiki:Ontology meeting 2025-03-31
    title: Ontology meeting 2025-03-31
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-03-31
    relevance: 4
    method: opus
    rationale: Minutes recording the DECISION that 'broad specificity' MF terms are not maintainable (no LD can express them),
      so grouping terms such as polyamine oxidase keep an EC narrow xref; guideline edit assigned. Class-wide reaction-specificity
      decision in minutes; 4.
  - id: wiki:Ontology meeting 2025-04-14
    title: Ontology meeting 2025-04-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-04-14
    relevance: 4
    method: opus
    rationale: Minutes recording the decision that part-reaction (has part/part of) links for complexes catalysing multiple
      MFs are added when clear, without editors searching extensively; other items deferred. Decision in minutes; 4.
  - id: wiki:Ontology meeting 2025-05-19
    title: Ontology meeting 2025-05-19
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-05-19
    relevance: 4
    method: haiku
    rationale: Proposes obsoleting most children of regulator activity, citing the MF guideline section, and discusses how
      to represent a non-specific transporter's substrate in spermidine transport.
  - id: wiki:Ontology meeting 2025-07-07
    title: Ontology meeting 2025-07-07
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-07-07
    relevance: 4
    method: haiku
    rationale: 'Lays out the metabolic process refactoring plan: restrict logical definitions to chemicals, align BPs with
      MetaCyc, clarify single-step BP validity and remove UM-BBD xrefs.'
  - id: wiki:Ontology meeting 2025-07-14
    title: Ontology meeting 2025-07-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-07-14
    relevance: 4
    method: haiku
    rationale: Continues the metabolic refactoring with a rule to obsolete metabolic BP terms that have no xref and no annotations,
      and revisits RHEA chemical participant rules.
  - id: wiki:Ontology meeting 2025-08-11
    title: Ontology meeting 2025-08-11
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-08-11
    relevance: 4
    method: haiku
    rationale: Agrees to be less aggressive obsoleting microbially relevant terms, especially for non-model microbes, and
      to bring in NCBI prokaryote curators and CDD mappings.
  - id: wiki:Ontology meeting 2025-09-08
    title: Ontology meeting 2025-09-08
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-09-08
    relevance: 4
    method: haiku
    rationale: Works through where tRNA aminoacylation and amino-acid activation terms should sit in the process tree, with
      reasoning about pre-translation processes that generalises to similar terms.
  - id: wiki:Ontology meeting 2025-09-29
    title: Ontology meeting 2025-09-29
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-09-29
    relevance: 4
    method: haiku
    rationale: Raises a consistency rule for reaction directionality representation with an action to document the exception,
      and records the tRNA aminoacylation decision made in the ticket.
  - id: wiki:Ontology meeting 2025-11-03
    title: Ontology meeting 2025-11-03
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-11-03
    relevance: 4
    method: haiku
    rationale: Discusses checking term usage before obsoletion, auto-adding exact xrefs, and a principle that cholesterol-pathway
      variants are captured in GO-CAMs rather than extra BP terms.
  - id: wiki:Ontology meeting 2025-11-10
    title: Ontology meeting 2025-11-10
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-11-10
    relevance: 4
    method: haiku
    rationale: Records interim guidance that cell migration uses 'results in movement of' pending a branch review, and tracks
      the RHEA-based KEGG and MetaCyc xref import rules.
  - id: wiki:Ontology meeting 2025-12-15
    title: Ontology meeting 2025-12-15
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2025-12-15
    relevance: 4
    method: haiku
    rationale: Asks whether terms with both is_a and a second relation to the same parent should be blocked by a check, and
      proposes changes to cytoplasmic and cell cortex region definitions.
  - id: wiki:Ontology meeting 2026-01-12
    title: Ontology meeting 2026-01-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-01-12
    relevance: 4
    method: haiku
    rationale: Proposes obsoleting specific MetaCyc pathway terms and keeping general amino-acid catabolic and biosynthetic
      terms, and reports the narrow-xref errors for Rhea subclass reactions.
  - id: wiki:Ontology meeting 2026-01-26
    title: Ontology meeting 2026-01-26
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-01-26
    relevance: 4
    method: haiku
    rationale: Action points to eliminate regulation-of-regulation terms and move intracellular pH terms under cellular process,
      addressing when pH regulation is homeostasis.
  - id: wiki:Ontology meeting 2026-04-13
    title: Ontology meeting 2026-04-13
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-04-13
    relevance: 4
    method: haiku
    rationale: Asks whether has part relations should be removed from the ontology (not used by tools or inference, disallowed
      in GO-CAM BP and MF) and proposes merging import terms.
  - id: wiki:Ontology meeting 2026-04-20
    title: Ontology meeting 2026-04-20
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-04-20
    relevance: 4
    method: haiku
    rationale: Decides to explore whether mRNA targets can be represented in the ontology and continues the has part and import-into-cell
      rationalisation questions.
  - id: wiki:Ontology meeting 2026-04-27
    title: Ontology meeting 2026-04-27
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-04-27
    relevance: 4
    method: haiku
    rationale: Reports the ChEBI 7.3 check and its chebi-allow exception list, and proposes do_not_annotate for protein binding;
      it also continues the has part question.
  - id: wiki:Ontology meeting 2026-09-14
    title: Ontology meeting 2026-09-14
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-09-14
    relevance: 4
    method: haiku
    rationale: Discusses whether signalling-phase terms can be part_of apoptosis (upstream versus execution) and records the
      convention that a term_tracker_item is replaced with the driving issue; also restricts Reactome xrefs to BPs.
  - id: wiki:Ontology meeting 2026-10-12
    title: Ontology meeting 2026-10-12
    url: https://wiki.geneontology.org/index.php/Ontology_meeting_2026-10-12
    relevance: 4
    method: haiku
    rationale: Records the obsoletion procedure (the announcement reason becomes the obsoletion reason) and a decision to
      announce only major obsoletions to go-friends; an ontology-governance convention.
  - id: wiki:Ontology workshop Jan 2013
    title: Ontology workshop Jan 2013
    url: https://wiki.geneontology.org/index.php/Ontology_workshop_Jan_2013
    relevance: 4
    method: haiku
    rationale: Editor workshop agreeing that editors perform ChEBI-driven inference and review the inferred links before release,
      plus guidance on adding disjointness axioms during normal editing; ontology-editing workflow practice.
  - id: wiki:Outstanding Action Items from 17th GOC Meeting, Cambridge UK
    title: Outstanding Action Items from 17th GOC Meeting, Cambridge UK
    url: https://wiki.geneontology.org/index.php/Outstanding_Action_Items_from_17th_GOC_Meeting%2C_Cambridge_UK
    relevance: 4
    method: haiku
    rationale: Action-item tracker that states a consortium policy that TAS is no longer used for consistency measures and
      reference genome annotators should prefer experimental evidence codes, alongside tracker status for other items.
  - id: wiki:Over all goals for the meeting are available here
    title: Over all goals for the meeting are available here
    url: https://wiki.geneontology.org/index.php/Over_all_goals_for_the_meeting_are_available_here
    relevance: 4
    method: haiku
    rationale: 'Meeting goals and prep for annotation-process proposals: annotation-group completeness tracking, a QC working
      group with authority to reject contributed annotations, and adherence and information-content metrics. Sets general
      annotation QC practice.'
  - id: wiki:Overview of Function-Process regulates links
    title: Overview of Function-Process regulates links
    url: https://wiki.geneontology.org/index.php/Overview_of_Function-Process_regulates_links
    relevance: 4
    method: haiku
    rationale: Documents the convention for adding 'regulates' relations within MF and between BP and MF, with explicit guidance
      that tools ignoring relation types will conflate regulators with the regulated activity. Applies to annotation querying
      practice beyond one case.
  - id: wiki:PAINT - Apoptosis (Archived)
    title: PAINT - Apoptosis (Archived)
    url: https://wiki.geneontology.org/index.php/PAINT_-_Apoptosis_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Project report on annotating families to execution phase of apoptosis. It draws general lessons on readout
      versus process confusion, process versus regulation-of-process misreadings, and over-annotation, and proposes guidelines
      and a curation-review workflow. Marked Archived.
  - id: wiki:PAINT GAF production
    title: PAINT GAF production
    url: https://wiki.geneontology.org/index.php/PAINT_GAF_production
    relevance: 4
    method: haiku
    rationale: 'Defines how PAINT GAF columns are populated as a practice convention: IBA as the only code, IRD terms not
      exported to descendants, IKR giving NOT with IBA, and the PTN-plus-leaf With/From format. Applies generally to PAINT-derived
      annotations. Some sections are flagged with question marks as unfinished.'
  - id: wiki:PAMGO ML modifications
    title: PAMGO ML modifications
    url: https://wiki.geneontology.org/index.php/PAMGO_ML_modifications
    relevance: 4
    method: haiku
    rationale: Argues that protein secretion system terms name a complex rather than a process and should be replaced by process
      terms, citing the obsoletion of GO:0008014; a reusable naming principle for thing-versus-process terms.
  - id: wiki:PAMGO The Other Organism String
    title: PAMGO The Other Organism String
    url: https://wiki.geneontology.org/index.php/PAMGO_The_Other_Organism_String
    relevance: 4
    method: haiku
    rationale: Debates whether symbiotic process terms should say by other organism, by organism, host or symbiont, and cites
      the BP guideline on host and symbiont wording; a general naming convention for symbiosis terms.
  - id: wiki:PAMGO conference calls
    title: PAMGO conference calls
    url: https://wiki.geneontology.org/index.php/PAMGO_conference_calls
    relevance: 4
    method: haiku
    rationale: Minutes record a GOC announcement that regulatory processes are not necessarily part_of the processes they
      regulate, plus a consensus to collapse 'induction' and 'up-regulation' terms as synonyms of positive regulation, a reusable
      term-structure decision. Excerpt is truncated.
  - id: wiki:PIs response to priority list
    title: PIs response to priority list
    url: https://wiki.geneontology.org/index.php/PIs_response_to_priority_list
    relevance: 4
    method: haiku
    rationale: Consortium position that documenting the initial annotation process as a standard operating procedure for new
      genomes is the top outreach priority, with the outline of what such a document should cover. Guidance applicable beyond
      one genome.
  - id: wiki:PTHR11559
    title: PTHR11559
    url: https://wiki.geneontology.org/index.php/PTHR11559
    relevance: 4
    method: haiku
    rationale: Archived PAINT list resolving whether acetylcholinesterase should sit under cholinesterase, and recording a
      curator ruling that mechanism-based function definitions such as serine hydrolase activity are valid. Establishes a
      convention for a class of terms. Marked PAINT Archived; the ChEBI-based answer is dated 2011.
  - id: wiki:PiRNA GO annotation manual
    title: PiRNA GO annotation manual
    url: https://wiki.geneontology.org/index.php/PiRNA_GO_annotation_manual
    relevance: 4
    method: haiku
    rationale: Curator-facing annotation manual for piRNAs covering biology and the scope of piRNA terms; a documented convention
      for one ncRNA class, though the visible text is mostly background biology.
  - id: wiki:Planned changes to the IEA GO REFs cited by UniProtKB.
    title: Planned changes to the IEA GO REFs cited by UniProtKB.
    url: https://wiki.geneontology.org/index.php/Planned_changes_to_the_IEA_GO_REFs_cited_by_UniProtKB.
    relevance: 4
    method: haiku
    rationale: Announces the consortium decision on which GO_REF to cite for UniProtKB keyword and subcellular-location IEA
      annotations, and plans GO_REFs for transformed IEA rows. Page is marked Archived and the planned changes were partly
      superseded.
  - id: wiki:Plant term
    title: Plant term
    url: https://wiki.geneontology.org/index.php/Plant_term
    relevance: 4
    method: haiku
    rationale: Records ontology design decisions for plant female gametophyte terms, including not creating regulation terms
      for ovule development and not using differentiation for meiotic megasporocyte formation; a principle applicable to a
      class of terms.
  - id: wiki:Positively regulates
    title: Positively regulates
    url: https://wiki.geneontology.org/index.php/Positively_regulates
    relevance: 4
    method: opus
    rationale: 'Usage guidance for ''positively regulates'': conditions for a causal positive effect on a downstream enabler,
      and that curators should use the directly/indirectly child relations to indicate proximity. Page is marked WIP with
      an empty GO-CAM section and references a branch deprecated in 2023; partial guidance, 4.'
  - id: wiki:Principles for merging terms
    title: Principles for merging terms
    url: https://wiki.geneontology.org/index.php/Principles_for_merging_terms
    relevance: 4
    method: opus
    rationale: Short editor page listing when terms are merged (same meaning, too close for consistent annotation, unnecessary
      parent/child distinction), warning that merges can create false annotations (especially NOT), and proposing obsoletion
      with replaced_by/consider instead. Brief and the key recommendation is still marked 'to propose'; 4.
  - id: wiki:Procedure to check subset coverage
    title: Procedure to check subset coverage
    url: https://wiki.geneontology.org/index.php/Procedure_to_check_subset_coverage
    relevance: 4
    method: haiku
    rationale: Step-by-step QuickGO procedure for checking maximum annotation coverage of a GO subset, aspect by aspect, to
      judge whether a draft subset is acceptable. A general QC practice for subset design.
  - id: wiki:Projects update meeting 2024-04-09
    title: Projects update meeting 2024-04-09
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2024-04-09
    relevance: 4
    method: haiku
    rationale: States that genes are outside GO scope and function belongs to the gene product that performs it, not to a
      protein-coding gene entity; a practice principle, though the page questions its context.
  - id: wiki:Projects update meeting 2024-12-18
    title: Projects update meeting 2024-12-18
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2024-12-18
    relevance: 4
    method: haiku
    rationale: Proposes that GPI and GAF type fields may differ, with GO annotating the active gene product (protein-coding
      gene as protein) and discouraging ambiguous gene or gene product types; a general data-model policy for annotation objects.
  - id: wiki:Projects update meeting 2025-11-19
    title: Projects update meeting 2025-11-19
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2025-11-19
    relevance: 4
    method: haiku
    rationale: Sets the rule that models with causal relations between molecular functions are not split as standard annotations
      and defines non-standard annotations against GO-CAM; a general classification decision for annotation models.
  - id: wiki:Projects update meeting 2026-03-18
    title: Projects update meeting 2026-03-18
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2026-03-18
    relevance: 4
    method: haiku
    rationale: Lists five categories of standard annotations that do not display in the editor, each with a proposed general
      strategy (flatten nested extensions, clone multi-MF or multi-BP cases, pick one evidence code); policy-level guidance
      on modelling.
  - id: wiki:Projects update meeting 2026-04-01
    title: Projects update meeting 2026-04-01
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2026-04-01
    relevance: 4
    method: haiku
    rationale: Repeats the 2026-03-18 remainder categories with model examples and an MGI cleanup strategy, reinforcing general
      standard-annotation handling; much overlaps the earlier meeting.
  - id: wiki:Projects update meeting 2026-06-02
    title: Projects update meeting 2026-06-02
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2026-06-02
    relevance: 4
    method: haiku
    rationale: Proposes defining standard annotations in parallel with the GO-CAM definition and lists the four criteria (evidence
      consistency, multiple part_of from MFs, causal edges between MFs, edges without evidence); a general criteria framework.
  - id: wiki:Projects update meeting 2026-06-10
    title: Projects update meeting 2026-06-10
    url: https://wiki.geneontology.org/index.php/Projects_update_meeting_2026-06-10
    relevance: 4
    method: opus
    rationale: 'GO managers meeting minutes on converting Noctua standard-annotation models: answers that causally_upstream_of_or_within
      is allowed, that the BP-to-CC check applies to extensions only for now, and that extension criteria #7-9 are not checked.
      Current (2026), but these are meeting notes recording interim QC-criteria decisions for a conversion pipeline, not a
      guideline document, so downgraded to 4.'
  - id: wiki:Proposal for fate of "transcription" and corresponding regulation terms
    title: Proposal for fate of "transcription" and corresponding regulation terms
    url: https://wiki.geneontology.org/index.php/Proposal_for_fate_of_%22transcription%22_and_corresponding_regulation_terms
    relevance: 4
    method: haiku
    rationale: Records the decision to merge rather than obsolete grouping terms, citing the risk of mis-moving IEA annotations
      and the reannotation cost. Gives a general rule for handling high-level terms used as annotation targets.
  - id: wiki:Proposal for integral to qualifier (Archived)
    title: Proposal for integral to qualifier (Archived)
    url: https://wiki.geneontology.org/index.php/Proposal_for_integral_to_qualifier_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived proposal for an integral_to qualifier stating that a gene product is required for a process or constitutes
      a component, with discussion of how this would fix redundancy and propagation; the proposal was not adopted, so it is
      guidance only in the sense of a recorded design discussion.
  - id: wiki:Proposal to obsolete "promoter binding" and child terms
    title: Proposal to obsolete "promoter binding" and child terms
    url: https://wiki.geneontology.org/index.php/Proposal_to_obsolete_%22promoter_binding%22_and_child_terms
    relevance: 4
    method: haiku
    rationale: Records the decision to obsolete promoter binding and motif-specific children, with the rule that annotations
      should not be transferred wholesale to core promoter binding and should be reviewed. Covers how to reannotate after
      obsoletion. Executed 2011.
  - id: wiki:Proposal to obsolete children of "transcription factor binding"
    title: Proposal to obsolete children of "transcription factor binding"
    url: https://wiki.geneontology.org/index.php/Proposal_to_obsolete_children_of_%22transcription_factor_binding%22
    relevance: 4
    method: haiku
    rationale: States the policy that GO does not represent binding to each individual transcription factor partner, and directs
      curators to annotation extension column 16 for specific partners. Also covers reannotation of obsoleted terms.
  - id: wiki:Proposals to overhaul transcription in GO - 2010
    title: Proposals to overhaul transcription in GO - 2010
    url: https://wiki.geneontology.org/index.php/Proposals_to_overhaul_transcription_in_GO_-_2010
    relevance: 4
    method: haiku
    rationale: Sets out the general principle that function and process terms should not overlap, and that curators annotate
      only the process term when the molecular mechanism is unknown. Also covers promoter and transcription factor binding
      structure. Long page, truncated in the batch.
  - id: wiki:Protein Binding clean up
    title: Protein Binding clean up
    url: https://wiki.geneontology.org/index.php/Protein_Binding_clean_up
    relevance: 4
    method: opus
    rationale: Phase I proposal (last edit 2019) to obsolete gene-product-specific protein binding children, with the criterion
      that such terms are replaceable by an informative parent term plus the interactor in the with field, and a per-term
      list of replacements. It states a reusable criterion for future binding-term requests, but it is a proposal and mostly
      a term list with SQL, so 4.
  - id: wiki:Protein Complex Conference Call July15, 2015
    title: Protein Complex Conference Call July15, 2015
    url: https://wiki.geneontology.org/index.php/Protein_Complex_Conference_Call_July15%2C_2015
    relevance: 4
    method: haiku
    rationale: Archived call on which inferred complex annotations (ISS or ISO versus none) should export to GO, and on annotating
      binding to small-molecule components of complexes; reaches a general practice point on complex binding terms.
  - id: wiki:Protein Complex Conference Call June19, 2015
    title: Protein Complex Conference Call June19, 2015
    url: https://wiki.geneontology.org/index.php/Protein_Complex_Conference_Call_June19%2C_2015
    relevance: 4
    method: haiku
    rationale: Archived call on whether IntAct complexes should be annotated to GO complex terms, the IPI with-column problem
      for subunits, and BP inferred from MF for complexes; discusses general practice without a final policy text.
  - id: wiki:QC procedures from contributing groups
    title: QC procedures from contributing groups
    url: https://wiki.geneontology.org/index.php/QC_procedures_from_contributing_groups
    relevance: 4
    method: haiku
    rationale: 'Documents the GOA pipeline QC filters: unmapped identifiers, obsolete terms with no replacement, do_not_(manually_)annotate
