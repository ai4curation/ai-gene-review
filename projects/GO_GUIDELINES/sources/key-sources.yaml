description: Every receipted item scored 4 or 5 for relevance to GO annotation best practice, across the GO Drive, GO wiki,
  papers and go-annotation. Slim copy of the full receipts (kept locally in receipts/, not in git). See SOURCES.md.
sources:
  go-annotation-issues:
  - id: issue:1390
    title: 'GOC to decide what is HTP data '
    url: https://github.com/geneontology/go-annotation/issues/1390
    relevance: 5
    method: opus
    rationale: 'Records the GOC decision on what counts as HTP data: hypothesis-driven work is not HTP even if large, exploratory
      screens are, and lists the characteristics of HTP papers (same workflow over many genes, automated, open-ended, tabular
      datasets, false positives). The guideline text is quoted in full, keep 5; it is now part of the HTP evidence-code guide.'
  - id: issue:1775
    title: Should HTP annotations be allowed sequence-based transfer methods
    url: https://github.com/geneontology/go-annotation/issues/1775
    relevance: 5
    method: opus
    rationale: HTP working-group decision that HTP-evidenced annotations may be propagated by ISS/ISA/ISO/IBA, with no new
      codes, case-by-case manual review and no automated pipelines, followed by the ISS wiki update and P2GO change. States
      the rule and its documentation, keep 5.
  - id: issue:1940
    title: Review annotations to co-localizes_with GO:0032991 protein-containing complex  & children
    url: https://github.com/geneontology/go-annotation/issues/1940
    relevance: 5
    method: opus
    rationale: 'Protein Complex WG decision that colocalizes_with is not allowed on protein-containing complex terms, with
      the 9 May 2018 summary of replacements: remove if no interaction evidence, use an x complex binding term, or protein-containing
      complex binding with the complex ID in with or has_direct_input. Debate on colocalization evidence follows. Explicit
      rule and alternatives, keep 5.'
  - id: issue:2131
    title: 'Question about proposed GO rule: IPI should not be used with catalytic activity molecular function terms'
    url: https://github.com/geneontology/go-annotation/issues/2131
    relevance: 5
    method: opus
    rationale: 'Records adoption of gorule-0000007: IPI must not be used for catalytic activity MF terms, scoped to is_a children
      of catalytic activity (enzyme regulator terms excluded after discussion), with non-compliant annotations filtered. A
      consortium evidence-code rule adoption, keep 5.'
  - id: issue:2521
    title: Review annotations to GO:0051259 'protein complex oligomerization' and children
    url: https://github.com/geneontology/go-annotation/issues/2521
    relevance: 5
    method: opus
    rationale: Consortium annotation-review ticket announcing the decision that oligomerization/stoichiometry of protein interactions
      is out of GO scope, with GO:0051259 and children to be obsoleted, InterPro2GO mappings removed and crystallography-based
      annotations deleted. It states a scope policy for a class of terms directly; the detailed review guidelines are in a
      linked Google doc. Historical (terms since obsoleted) but the scope rule still applies.
  - id: issue:2584
    title: Review annotations using extension 'occurs_at'
    url: https://github.com/geneontology/go-annotation/issues/2584
    relevance: 5
    method: opus
    rationale: Consortium decision deprecating the occurs_at extension relation, with explicit per-pattern replacement rules
      (GO CC/CL to occurs_in, SO motif to has_input on a binding term, Pfam removed, promoter/enhancer SO under discussion)
      and follow-up clarifications (occurs_in for histone-modifier locations, no SO regions on target proteins). Directly
      establishes extension-relation practice; parts on transcription-regulation extensions were left pending GREEKC input.
      Historical but still the basis of current usage.
  - id: issue:3166
    title: 'obsoletion: drug binding'
    url: https://github.com/geneontology/go-annotation/issues/3166
    relevance: 5
    method: opus
    rationale: 'Obsoletion of ''drug binding'' with explicit annotation advice agreed at an annotation call: annotate the
      biologically relevant ligand when a compound is a proxy, make BP annotations for inhibitor-manipulated pathways only
      if the gene normally participates, do not annotate binding for gain-of-function drug interactions, and review ''response
      to x'' terms. A consortium decision stating rules for a class of binding annotations; current.'
  - id: issue:6085
    title: Review Noctua annotations using some IEA sources
    url: https://github.com/geneontology/go-annotation/issues/6085
    relevance: 5
    method: opus
    rationale: 'States a rule change: IEA annotations from UniProt-Keywords, UniProt-SubCell and UniPathway may no longer
      be used as evidence in Noctua, and affected annotations must be re-supported or generalised. Brief but a direct, current
      (2025) consortium policy on evidence sources, so 5.'
  - id: issue:1
    title: Incorrect annotations to viral terms.
    url: https://github.com/geneontology/go-annotation/issues/1
    relevance: 4
    method: haiku
    rationale: Concludes that GO process terms such as viral entry and viral life cycle should not be applied to host gene
      products, a general rule for a class of pathogen-process terms. Discussion reaches a practice applicable beyond the
      single example.
  - id: issue:10
    title: genes associated to nerve growth factor binding
    url: https://github.com/geneontology/go-annotation/issues/10
    relevance: 4
    method: haiku
    rationale: 'Settles a general synonym convention: legacy ''X receptor ligand'' and ''neurotrophin'' synonyms are kept
      because they aid search, and the GO function guidelines were updated with a synonym-types section. Applies beyond the
      single term.'
  - id: issue:1000
    title: Re-house annotations (GO:0008633 activation of pro-apoptotic
    url: https://github.com/geneontology/go-annotation/issues/1000
    relevance: 4
    method: haiku
    rationale: Re-housing guidance for obsoleting GO:0008633 that states GO activation terms must refer to starting an inactive
      process, with suggested targets for caspase activation and regulation; applies to the general class of activation-term
      annotations.
  - id: issue:1005
    title: 'SPKW: meiosis'
    url: https://github.com/geneontology/go-annotation/issues/1005
    relevance: 4
    method: haiku
    rationale: Establishes that a paper saying a gene is activated during meiosis does not license annotation to meiosis,
      and clarifies that the GO meiosis term denotes meiotic division rather than the developmental phase; a general rule
      for reading literature wording into process terms.
  - id: issue:1011
    title: P22449 hnf4a negative regulation of protein import into nucl
    url: https://github.com/geneontology/go-annotation/issues/1011
    relevance: 4
    method: haiku
    rationale: Argues that a translocation assay supports negative regulation of protein import into nucleus rather than regulation
      of translocation, because regulating the step implies earlier steps are normal; a general principle for choosing between
      a step-level and a process-level regulation term.
  - id: issue:1020
    title: IPR020612 mapping to root term
    url: https://github.com/geneontology/go-annotation/issues/1020
    relevance: 4
    method: haiku
    rationale: States the GO Consortium rule that root-term annotations use only ND evidence, and InterPro removes root-term
      mappings from entries with a sanity check before release; applies to any mapping onto root terms.
  - id: issue:1042
    title: Annot. to GO:0010421 hydrogen peroxide-mediated programmed
    url: https://github.com/geneontology/go-annotation/issues/1042
    relevance: 4
    method: haiku
    rationale: Discusses whether bacterial killing of neighbouring cells within a species is cell death (single-organism process)
      or cell killing (for other cells), and asks the editors to decide; reaches a general distinction for annotating death
      processes.
  - id: issue:1056
    title: Annotations to GO:0006917 'induction of apoptosis'
    url: https://github.com/geneontology/go-annotation/issues/1056
    relevance: 4
    method: haiku
    rationale: 'Guidance for re-housing annotations to induction of apoptosis: annotate to apoptotic process when no mechanism
      is described, and move mechanism-specific annotations to more precise terms, with a merge deadline; sets practice for
      a whole class of induction terms.'
  - id: issue:11
    title: is antibody x-reaction an ISS?
    url: https://github.com/geneontology/go-annotation/issues/11
    relevance: 4
    method: opus
    rationale: 2004 ticket recording annotation-camp consensus that antibody cross-reactivity is not sufficient for ISS (epitopes
      too small, not a direct similarity measure). A clear general evidence-code ruling, but only a brief thread note, so
      4.
  - id: issue:1107
    title: O13703 mapping to lipid transport KW:KW-0445
    url: https://github.com/geneontology/go-annotation/issues/1107
    relevance: 4
    method: haiku
    rationale: Debates whether a process that moves membranes (vesicle-mediated endocytosis) counts as lipid transport when
      a lipid dye is incidentally transported, and asks for this to be written into annotation guidelines. Substantial discussion
      of a general annotation-scope practice.
  - id: issue:1113
    title: complete and ref in sync for GOA human?
    url: https://github.com/geneontology/go-annotation/issues/1113
    relevance: 4
    method: haiku
    rationale: Explains that Ensembl projects GO terms only from the canonical transcript and protein, so non-canonical UniProt
      accessions lack projected annotations, and asks whether this pattern is widespread. Substantial discussion of a general
      projection policy.
  - id: issue:1116
    title: "\tUniProtKB-KW:KW-0415 karyogamy"
    url: https://github.com/geneontology/go-annotation/issues/1116
    relevance: 4
    method: haiku
    rationale: Debates whether an upstream nuclease effect on karyogamy counts as indirect involvement and whether regulation
      terms or phenotype-only HTP data should yield a GO annotation. Reaches a general principle on indirect and regulatory
      effects.
  - id: issue:1134
    title: mappings to UniProtKB-KW:KW-0234 DNA repair
    url: https://github.com/geneontology/go-annotation/issues/1134
    relevance: 4
    method: haiku
    rationale: Argues that about fifty DNA repair keyword mappings in S. pombe are indirect upstream effects (chromatin remodelling,
      checkpoint) and should map to more specific checkpoint or regulation terms, not repair. Substantial discussion of a
      general pattern of over-propagation from keywords.
  - id: issue:1156
    title: Annotations to 'beta-amyloid formation' (GO:0034205)
    url: https://github.com/geneontology/go-annotation/issues/1156
    relevance: 4
    method: haiku
    rationale: Documents a term-definition clarification for beta-amyloid formation (APP cleavage, not fibril formation) and
      asks curators to rehouse direct annotations to positive regulation or amyloid fibril formation. Establishes a convention
      for a class of Alzheimer-related terms.
  - id: issue:1166
    title: GEF should not be annotated to GO:0005096 - GTPase activator activity
    url: https://github.com/geneontology/go-annotation/issues/1166
    relevance: 4
    method: haiku
    rationale: Establishes that GEF activity alters nucleotide binding affinity rather than catalysis, so GTPase activator
      (GO:0005096) is wrong and GTPase regulator is reserved for direct catalytic-rate control. This is a general term-usage
      principle applied across a family, and the KW-0343 mapping is cleaned for all GEFs.
  - id: issue:1204
    title: '''response to acid'' terms - recuration needed please'
    url: https://github.com/geneontology/go-annotation/issues/1204
    relevance: 4
    method: opus
    rationale: GO editors' notice that 'response to acid chemical' and its cellular child were redefined (chemical structure
      vs low pH) and added to the do-not-manually-annotate subset, with per-group recuration requests. A decision for a small
      class of terms with rehousing guidance in definitions, so 4.
  - id: issue:1226
    title: Remove extracellular annotations where cell was experimentally lysed
    url: https://github.com/geneontology/go-annotation/issues/1226
    relevance: 4
    method: haiku
    rationale: Discussion of whether extracellular annotations from experimentally lysed cells are valid, weighing location
      of action against PomBase's practice of annotating to sequestration or transport locations. Sets out a general principle
      about the intent of cellular location annotations that applies beyond this case.
  - id: issue:1237
    title: UniProtKB-KW:KW-0762 carbohydrate metabolism
    url: https://github.com/geneontology/go-annotation/issues/1237
    relevance: 4
    method: haiku
    rationale: Discussion of keyword KW-0762 carbohydrate metabolism applied to carbohydrate-derivative transporters, noting
      that organic substance metabolic process is not for direct annotation and proposing a grouping term. Raises a general
      mapping-granularity problem that applies to over a million entries.
  - id: issue:1253
    title: 'oxygen binding IEA IPR012292 '
    url: https://github.com/geneontology/go-annotation/issues/1253
    relevance: 4
    method: haiku
    rationale: 'States a general practice: reaction substrates encoded in the reaction (oxygen binding for a dioxygenase)
      are not usually annotated. The reinstatement explains when a substrate term can still be justified (globin domain, PMID:10922365),
      which carries over to other cases.'
  - id: issue:1269
    title: miRNA annotation guidelines
    url: https://github.com/geneontology/go-annotation/issues/1269
    relevance: 4
    method: haiku
    rationale: Comments on the miRNA annotation guidelines lead to a replacement decision tree for Table 2 and to extension
      usage for regulators of miRNA levels. Also raises a term-definition fix for gene silencing by miRNA.
  - id: issue:1319
    title: PAINT annotations and "contributes to" rpb4 as an e.g
    url: https://github.com/geneontology/go-annotation/issues/1319
    relevance: 4
    method: haiku
    rationale: Asks whether contributes_to qualifiers should be propagated by PAINT without confirmation, and whether the
      practice should be reviewed. The discussion covers how the contributes_to qualifier was used for the RNA polymerase
      subcomplex, a practice-level question.
  - id: issue:1327
    title: Query about IGI evidence code guidelines
    url: https://github.com/geneontology/go-annotation/issues/1327
    relevance: 4
    method: haiku
    rationale: Disputes a revised IGI guideline and proposes wording on when IGI should not be used (gene B affecting gene
      A) versus IMP with column 16 and the extension. Also raises the WITH field convention for subunit information and the
      need to agree documentation changes on calls.
  - id: issue:1342
    title: 'Annotations to ion channels '
    url: https://github.com/geneontology/go-annotation/issues/1342
    relevance: 4
    method: haiku
    rationale: Records an ontology change distinguishing selective from non-selective ion channels and discusses whether to
      re-annotate about 2,600 EXP annotations. Establishes a decision about a class of terms.
  - id: issue:1344
    title: Ensembl pipeline propagation issues
    url: https://github.com/geneontology/go-annotation/issues/1344
    relevance: 4
    method: haiku
    rationale: Argues that Ensembl pipeline propagation of developmental and response-to-substance terms to GART should not
      occur, and proposes a not-suitable-for-orthology-propagation flag. Establishes a general propagation practice question
      with a proposed mechanism.
  - id: issue:1364
    title: "\tIPR028419 actin filament organization \t(and IPR001837 actin binding)"
    url: https://github.com/geneontology/go-annotation/issues/1364
    relevance: 4
    method: haiku
    rationale: Discussion concludes it is safer not to annotate downstream processes regulated by signalling molecules unless
      broadly conserved, a general practice for cross-species IEA propagation of signalling-related processes.
  - id: issue:1367
    title: 'viral process Source: UniProtKB-KW human proteins  mapped'
    url: https://github.com/geneontology/go-annotation/issues/1367
    relevance: 4
    method: haiku
    rationale: Debates whether host proteins may carry viral process annotations and recalls a decision that host proteins
      co-opted for a parasitic process may be annotated, a general policy for host-pathogen annotation.
  - id: issue:1375
    title: matrix human SMC1A not splicing
    url: https://github.com/geneontology/go-annotation/issues/1375
    relevance: 4
    method: haiku
    rationale: Explains that Reactome GAF generation previously propagated a pathway BP term to all proteins including substrates,
      and the bottom-up fix that addresses the actor versus acted-upon distinction, a general mapping practice.
  - id: issue:1380
    title: Ortholog relevance displayed on CGD/AspGD pages
    url: https://github.com/geneontology/go-annotation/issues/1380
    relevance: 4
    method: haiku
    rationale: Discusses how IEA annotations transferred between fungal species are context dependent, and states the procedure
      of transferring only from 1:1 orthologs, a general transfer policy.
  - id: issue:1381
    title: UniProtKB - A6NFY7 (SDHF1_HUMAN)
    url: https://github.com/geneontology/go-annotation/issues/1381
    relevance: 4
    method: haiku
    rationale: Discusses whether NAS is acceptable for speculative claims in a paper, quoting the NAS guideline and the rule
      that the paper need not contain experimental support, a general evidence-code practice.
  - id: issue:1382
    title: UniProtKB - P53384 cellular component annotation
    url: https://github.com/geneontology/go-annotation/issues/1382
    relevance: 4
    method: haiku
    rationale: Applies the HTP proteomics guideline (at least two unique peptides) to decide that high-throughput exosome
      annotations from a non-curatable paper should be deleted, a general HTP evidence practice.
  - id: issue:1386
    title: 'Check attribution to InterPro in GAF '
    url: https://github.com/geneontology/go-annotation/issues/1386
    relevance: 4
    method: haiku
    rationale: Establishes that InterPro should be the attribution (column 15) for InterPro-derived annotations regardless
      of who runs the pipeline, a documented attribution convention.
  - id: issue:1393
    title: "\tIPR003011 DNA repair /cohesin"
    url: https://github.com/geneontology/go-annotation/issues/1393
    relevance: 4
    method: haiku
    rationale: Sets the general rule that checkpoint activity giving time for repair is indirect and not annotated, while
      regulation of a repair process by modulating it or direct repair roles is annotated, with discussion of how involved
      a protein must be.
  - id: issue:1395
    title: Remove constraint on IEP only applying to BP
    url: https://github.com/geneontology/go-annotation/issues/1395
    relevance: 4
    method: haiku
    rationale: Debates whether to lift the rule that IEP-based inference applies only to biological process terms, and how
      inferred annotations are evidenced (GOC or ECO inference codes). Concerns a general class of inter-ontology inference
      rules.
  - id: issue:1396
    title: Matrix example, cohesin complex
    url: https://github.com/geneontology/go-annotation/issues/1396
    relevance: 4
    method: haiku
    rationale: Introduces the Matrix tool for finding indirect pleiotropic annotations via proposed NO OVERLAP rules between
      process terms, a general QC method for annotation consistency.
  - id: issue:1407
    title: ECO for siRNA expt?
    url: https://github.com/geneontology/go-annotation/issues/1407
    relevance: 4
    method: haiku
    rationale: Records a convention that siRNA knockdown or reduced expression is annotated as IMP, with ECO:0000019 RNAi
      evidence noted as a possible alternative. A documentation update was requested for the evidence guidance.
  - id: issue:1419
    title: ND code should only be used for root terms
    url: https://github.com/geneontology/go-annotation/issues/1419
    relevance: 4
    method: haiku
    rationale: Establishes the rule that the no-biological-data (ND) evidence code is only for root terms and records its
      implementation as a GO rule, a policy-level decision.
  - id: issue:1427
    title: Add inter-ontology links to go-basic and stop materializing inferred annotations from inter-ontology links
    url: https://github.com/geneontology/go-annotation/issues/1427
    relevance: 4
    method: haiku
    rationale: Argues that inter-ontology links (MF part_of BP, BP occurs_in CC) belong in go-basic and that materialised
      inferences should be dropped. Covers how inferred annotations should be displayed and evidenced, a general ontology-structure
      and annotation principle.
  - id: issue:1449
    title: F-P links enquiry
    url: https://github.com/geneontology/go-annotation/issues/1449
    relevance: 4
    method: haiku
    rationale: Quotes the documented pipeline rule that predictions are redundant only when they predict the same class with
      the same evidence code and reference, explaining how the GOC pipeline decides what to export.
  - id: issue:1450
    title: sperm mobilization or fertilization?
    url: https://github.com/geneontology/go-annotation/issues/1450
    relevance: 4
    method: haiku
    rationale: Discusses whether causally upstream processes such as sperm motility should be annotated directly to fertilization,
      and records that causally_upstream_of could express the relation, a general practice on indirect process annotation.
  - id: issue:1452
    title: Obsolete IDs in Slims - filter annotations
    url: https://github.com/geneontology/go-annotation/issues/1452
    relevance: 4
    method: haiku
    rationale: Records the ontology-meeting decision that obsolete terms in slims are acceptable but annotations to them should
      be filtered, a general policy on obsolete terms in annotation releases.
  - id: issue:1454
    title: P23258 annotation  to GO:0000086
    url: https://github.com/geneontology/go-annotation/issues/1454
    relevance: 4
    method: haiku
    rationale: Identifies downward propagation of process terms from a process to components many steps removed as a systematic
      problem and describes a strategy to break it, a general practice on over-propagation.
  - id: issue:1463
    title: Working group to finalize transcription decision tree
    url: https://github.com/geneontology/go-annotation/issues/1463
    relevance: 4
    method: haiku
    rationale: Working group to build a decision tree for expression and transcription annotation, including whether reporter
      assays or DNA-binding evidence supports annotation to DNA binding or contributes-to. Sets general criteria for a class
      of transcription-factor annotations.
  - id: issue:1466
    title: Using IDA and has_input for protein binding annotations
    url: https://github.com/geneontology/go-annotation/issues/1466
    relevance: 4
    method: haiku
    rationale: Proposes using IDA with has_input rather than the with field for protein-binding annotations, weighing cardinality,
      multi-species interactions and downstream tools. Raises a general convention question for binding annotations.
  - id: issue:1469
    title: Guidelines for annotating papers containing High ThroughPut (HTP) experiments
    url: https://github.com/geneontology/go-annotation/issues/1469
    relevance: 4
    method: haiku
    rationale: Working group on annotating high-throughput experiments, proposing HTP evidence codes (HMP, HDA, HPI, HGI,
      HEP) and questioning whether metabolomic profiles support metabolic process annotations. Defines general criteria for
      a class of HTP data.
  - id: issue:1480
    title: Evidence code documentation update for IDA
    url: https://github.com/geneontology/go-annotation/issues/1480
    relevance: 4
    method: haiku
    rationale: Agreed that IDA may be used when a term is supported by experimental results combined with sequence analysis,
      such as transmembrane protein localisation. Raises the need for combinatorial evidence codes and an IDA documentation
      update.
  - id: issue:1487
    title: GOC-OWL inference pipeline concerns (evidence transfer)
    url: https://github.com/geneontology/go-annotation/issues/1487
    relevance: 4
    method: haiku
    rationale: 'Critiques GOC-OWL inferred annotations: IC evidence wrongly applied, contributes_to with CC terms, duplicates
      of manual rows, and occurs_in inference that depends on how the relation was used. Raises general evidence-transfer
      and relation-usage principles.'
  - id: issue:1500
    title: should we really use "colocalizes_with" with  cc complex terms
    url: https://github.com/geneontology/go-annotation/issues/1500
    relevance: 4
    method: haiku
    rationale: Discusses whether colocalizes_with should be used for complex terms, with the documented rule that transient
      or peripheral association may be annotated this way. Raises a general question on GFP colocalisation versus binding,
      and suggests new complex-binding terms.
  - id: issue:1507
    title: Annotating human gene to viral processes
    url: https://github.com/geneontology/go-annotation/issues/1507
    relevance: 4
    method: haiku
    rationale: Establishes that host proteins co-opted by viruses should not be annotated to viral process terms, since the
      host protein does not perform viral transcription or translation. Discusses a general practice for host-virus annotation.
  - id: issue:1512
    title: Large set of various annotations for human  RPS27A  & UBA52  (Ubiquitin-ribosomal proteins)
    url: https://github.com/geneontology/go-annotation/issues/1512
    relevance: 4
    method: haiku
    rationale: Discusses annotations of ubiquitin-ribosomal fusion proteins that inherit annotations meant for free ubiquitin,
      and how to represent cleaved or tandem fusion products. Establishes a general principle for polyprotein and fusion annotation.
  - id: issue:1514
    title: please check your GGT GO:0003840 gamma-glutamyltransferase activity
    url: https://github.com/geneontology/go-annotation/issues/1514
    relevance: 4
    method: haiku
    rationale: States that GO annotation should use only physiologically relevant reactions, so an in vitro transferase activity
      with an EC number should not be annotated; general practice applicable beyond one gene family.
  - id: issue:1517
    title: New qualifiers for biological processes - including how to deal with legacy annotations
    url: https://github.com/geneontology/go-annotation/issues/1517
    relevance: 4
    method: opus
    rationale: Thread leading to the GOC Cambridge decision to implement gene-product-to-BP qualifiers (acts_upstream_of_or_within,
      involved_in, regulation variants), with a default-qualifier post-process and documentation/training plans. A consortium
      decision, but mostly an implementation plan and partly superseded (the final qualifier set differs and a later comment
      asks if it is out of date), so 4.
  - id: issue:1519
    title: EC:2.3.2.2 > GO:gamma-glutamyltransferase activity mapping
    url: https://github.com/geneontology/go-annotation/issues/1519
    relevance: 4
    method: haiku
    rationale: Establishes that EC-to-GO mappings for non-physiological reactions should be removed while the EC number is
      kept, and that GO annotation concerns only physiologically relevant reactions.
  - id: issue:1526
    title: Some direct annotations to GO:0098609 cell-cell adhesion should be moved down to GO:009874
    url: https://github.com/geneontology/go-annotation/issues/1526
    relevance: 4
    method: haiku
    rationale: Establishes that broad terms such as cell-cell adhesion are not wrong but should be replaced by more specific
      child terms, and discusses flagging broad terms as not for manual annotation; general practice on term granularity.
  - id: issue:1531
    title: Examples for New qualifier to capture roles in both a general and a specific process
    url: https://github.com/geneontology/go-annotation/issues/1531
    relevance: 4
    method: haiku
    rationale: Discusses how to annotate a protein with both a general and a specific process or substrate term, including
      parent-versus-child semantics and the proposed has_input resolution; a general practice question for annotation extensions.
  - id: issue:1532
    title: regulation and causality
    url: https://github.com/geneontology/go-annotation/issues/1532
    relevance: 4
    method: haiku
    rationale: Examines whether causally_upstream_of should be annotated, using PomBase regulation data, and argues about
      the scope and burden of causal qualifiers. Establishes general criteria for when indirect causal relations should be
      recorded.
  - id: issue:1581
    title: RCA QC check?
    url: https://github.com/geneontology/go-annotation/issues/1581
    relevance: 4
    method: haiku
    rationale: Decides not to implement the one-year deletion rule for RCA annotations, recommending periodic review instead,
      and keeps RCA annotations backed by published analyses. Records a general consortium decision on an evidence code.
  - id: issue:1586
    title: Glycoprotein binding
    url: https://github.com/geneontology/go-annotation/issues/1586
    relevance: 4
    method: haiku
    rationale: Implements the GOC decision that binding to a modified protein with unknown dependency uses plain protein binding,
      merging glycoprotein binding; establishes the modification-dependent binding naming convention.
  - id: issue:1592
    title: MAPK cascade- Signaling Project
    url: https://github.com/geneontology/go-annotation/issues/1592
    relevance: 4
    method: haiku
    rationale: Decides that a MAPK scaffold is part of the pathway rather than an upstream regulator, citing the tethering-versus-allosteric-activation
      distinction. Gives a general rule for scaffold proteins, with a separate regulator annotation where it allosterically
      activates.
  - id: issue:1596
    title: general question about localization/transport within a signalling pathway - MAPK import into nucleus
    url: https://github.com/geneontology/go-annotation/issues/1596
    relevance: 4
    method: haiku
    rationale: Raises the general question of how to annotate localisation of pathway components within a signalling pathway
      (autonomous transport vs required recruitment) and the role of karyopherins; a practice question with broad applicability.
  - id: issue:1621
    title: '''Representing biologists'' view of biology (integral to membrane)'
    url: https://github.com/geneontology/go-annotation/issues/1621
    relevance: 4
    method: haiku
    rationale: Records a decision to allow IDA plus IEA-supported combinations for integral membrane terms, weighing evidence-code
      fidelity against PAINT propagation. Sets a general practice for multi-evidence terms, though the thread is partly truncated.
  - id: issue:1626
    title: annotations to mature ribosome assembly
    url: https://github.com/geneontology/go-annotation/issues/1626
    relevance: 4
    method: haiku
    rationale: 'States a general practice: computational predictions (CAFA) must not be annotated with IC evidence, and the
      ribosome-assembly over-annotation is traced to that convention. Applies beyond this one term.'
  - id: issue:1631
    title: pombe annotation to delete ARUK-UCL from PMID:28242692
    url: https://github.com/geneontology/go-annotation/issues/1631
    relevance: 4
    method: haiku
    rationale: Explicitly states that phenotypes do not equal GO processes and that indirect phenotypes (e.g. spindle pole
      body separation caused by nuclear envelope defects) should not be annotated as processes. A reusable principle.
  - id: issue:1635
    title: update annotation guidelines for Molecular Function
    url: https://github.com/geneontology/go-annotation/issues/1635
    relevance: 4
    method: haiku
    rationale: Requests revision of MF guidelines on compound functions, arguing that some multi-part activities are valid
      MF terms when they are dependent on each other. Corrects a general ontology-structure guideline.
  - id: issue:1639
    title: Relations to describe gene product - component annotation
    url: https://github.com/geneontology/go-annotation/issues/1639
    relevance: 4
    method: haiku
    rationale: Debates which relations (part_of, is_active_in, localizes_to, enables_activity_in) should express gene product
      to cellular component links, a general CC relation policy that is discussed but not settled in the visible text.
  - id: issue:1648
    title: improving specificity by banning high level terms
    url: https://github.com/geneontology/go-annotation/issues/1648
    relevance: 4
    method: haiku
    rationale: Proposes a 'do not annotate' flag for overly general terms such as transport, where a more specific child should
      always be possible, and coordinates a group-by-group review. A practice decision for a class of terms.
  - id: issue:1650
    title: Proposal for guidelines for using contributes_to
    url: https://github.com/geneontology/go-annotation/issues/1650
    relevance: 4
    method: haiku
    rationale: Substantial discussion of when contributes_to is appropriate for non-catalytic complex subunits (function of
      the complex versus regulator), with a call for new annotation guidelines and examples such as ORC, MCM and proteasome.
  - id: issue:1655
    title: Review HTP annotations
    url: https://github.com/geneontology/go-annotation/issues/1655
    relevance: 4
    method: haiku
    rationale: Working-group review of HTP annotation criteria (unique peptides, FDR, paper-level annotation counts, new HTP
      evidence codes), establishing how high-throughput papers should be handled across groups.
  - id: issue:1659
    title: 'Implement a check for terms for which curators should always use a more specific child term. (“Do not manually
      annotate”) '
    url: https://github.com/geneontology/go-annotation/issues/1659
    relevance: 4
    method: opus
    rationale: Action item to implement gorule-0000008, a check for 'do not manually annotate' terms where curators should
      use a more specific child, starting as a soft check. The thread is about implementing and documenting the rule; the
      guidance itself lives in the rule file, so 4.
  - id: issue:1660
    title: 'Odorant binding or odorant transport? '
    url: https://github.com/geneontology/go-annotation/issues/1660
    relevance: 4
    method: haiku
    rationale: Asks whether odorant-binding proteins count as transport and cites the carrier versus transporter distinction
      (carriers are non-transporter MF involved in transport). Raises a general MF-class question about binding carriers.
  - id: issue:1662
    title: inferring MFs from annotations to complex portal IDs to individual complex participants
    url: https://github.com/geneontology/go-annotation/issues/1662
    relevance: 4
    method: haiku
    rationale: 'Breakout proposals on whether MF can be inferred from complex annotations to subunits: remove contributes_to,
      do not annotate emerging function to members, use complex portal IDs, which are general rules for complex subunit MF
      annotation.'
  - id: issue:1670
    title: Interested in submitting a GO annotation for non-model organism
    url: https://github.com/geneontology/go-annotation/issues/1670
    relevance: 4
    method: haiku
    rationale: 'States the consortium''s general approach for non-model organisms: work with UniProt identifiers and existing
      InterPro2GO and automated pipelines, and check existing UniProt coverage before manual curation. A practice policy.'
  - id: issue:1687
    title: Relation to use for regulation terms
    url: https://github.com/geneontology/go-annotation/issues/1687
    relevance: 4
    method: opus
    rationale: Records the 2017 GOC decision that 'gene product involved_in regulation of X' uses the default involved_in
      relation, ending with a pointer to the Involved_in wiki page. Most of the thread is off-topic discussion of documentation
      tracking, so 4.
  - id: issue:169
    title: query IEP usage
    url: https://github.com/geneontology/go-annotation/issues/169
    relevance: 4
    method: haiku
    rationale: Proposes restricting IEP to process annotation and discusses when it is valid, including tightly co-regulated
      clusters versus expression-only inference. Substantial discussion reaching a general evidence-code restriction.
  - id: issue:1690
    title: Definitions and example use cases for relations would be very helpful
    url: https://github.com/geneontology/go-annotation/issues/1690
    relevance: 4
    method: haiku
    rationale: Asks for definitions and examples distinguishing regulates, directly_regulates and causally_upstream_of (and
      within), which led to a wiki page on annotation relations; general relation-usage guidance.
  - id: issue:1691
    title: 'Review annotation for GPCR '
    url: https://github.com/geneontology/go-annotation/issues/1691
    relevance: 4
    method: haiku
    rationale: Discusses general choices for cAMP regulation versus pathway terms, stating a ligand is part of the pathway
      so it is annotated to the pathway term rather than its regulation. Guidance that generalises across GPCR annotations.
  - id: issue:170
    title: query usage of ND/Suggested consistency check
    url: https://github.com/geneontology/go-annotation/issues/170
    relevance: 4
    method: haiku
    rationale: 'Clarifies the ND evidence code: ND records that a curator searched and found nothing, while TAS or NAS only
      attribute an author''s statement of unknown function. Discussion reaches a general practice for all unknown-term annotations.'
  - id: issue:1700
    title: 'Annotation review : protein import into the nucleus'
    url: https://github.com/geneontology/go-annotation/issues/1700
    relevance: 4
    method: haiku
    rationale: Establishes the principle that specific protein-import terms should be obsoleted because nuclear proteins share
      one import mechanism, with dedicated terms only for distinct mechanisms, and discusses extension relations for regulation
      targets.
  - id: issue:1712
    title: Review annotations to 'cAMP biosynthetic process'
    url: https://github.com/geneontology/go-annotation/issues/1712
    relevance: 4
    method: haiku
    rationale: States a general rule that ligands are part of the adenylate cyclase-activating pathway and are annotated to
      the pathway term, not its regulation. Applies to all ligands of that receptor class.
  - id: issue:1720
    title: 'Annotation review: GO:0006351 transcription, DNA-templated'
    url: https://github.com/geneontology/go-annotation/issues/1720
    relevance: 4
    method: haiku
    rationale: Proposes making transcription DNA-templated a do-not-annotate term, requiring the promoter type and initiation
      or elongation to be specified, and discusses where transcription starts and ends. Consortium-level term-usage policy.
  - id: issue:1761
    title: Human DNA Polymerase Alpha is involved in DNA double strand break repair
    url: https://github.com/geneontology/go-annotation/issues/1761
    relevance: 4
    method: haiku
    rationale: Confirms that a NOT annotation and a positive annotation to the same term may coexist, and proposes editing
      NOT rows to specific child terms rather than deleting them. A stated NOT-qualifier policy.
  - id: issue:1772
    title: UniProtKB uses "UniProt" as assignee
    url: https://github.com/geneontology/go-annotation/issues/1772
    relevance: 4
    method: haiku
    rationale: States the convention that UniProtKB is the database prefix for identifiers and UniProt is the assigned_by
      group, with the xref synonym change and its fallout; a documented naming convention.
  - id: issue:1773
    title: Annotation standards for HTP proteomics experiments
    url: https://github.com/geneontology/go-annotation/issues/1773
    relevance: 4
    method: haiku
    rationale: Identifies open standards for proteomics annotation (purification versus enrichment, missing or high FDR, too
      many contaminants) and debates how far author justification can override guideline criteria.
  - id: issue:1774
    title: Annotation of foward genetic screens with HMP
    url: https://github.com/geneontology/go-annotation/issues/1774
    relevance: 4
    method: haiku
    rationale: Decides that large genetic screens need case-by-case review of methods and intent before using HTP codes, since
      high annotation counts alone do not make a paper high-throughput; general guidance for IMP and IGI.
  - id: issue:1796
    title: Proposal for curating extracellular matrix proteins from proteomics experiments
    url: https://github.com/geneontology/go-annotation/issues/1796
    relevance: 4
    method: haiku
    rationale: Proposes a general method for curating ECM proteomics (matrisome-based filtering, RCA use, and splitting core
      versus associated ECM terms), which bears on how to treat contaminated enrichment datasets.
  - id: issue:1801
    title: Review RCA evidence code
    url: https://github.com/geneontology/go-annotation/issues/1801
    relevance: 4
    method: haiku
    rationale: Reviews RCA evidence code use and documentation, concluding that RCA was misused for function predictions and
      should be removed or reassigned; establishes policy on what this code is for.
  - id: issue:1807
    title: Ensembl Plants annotation transfer to S. cerevisiae???
    url: https://github.com/geneontology/go-annotation/issues/1807
    relevance: 4
    method: haiku
    rationale: Establishes practice that annotations must not be transferred from non-fungal species to fungi (and that response-to
      terms should be excluded from transfer), and calls for taxon constraints and a do-not-propagate mechanism; applies to
      a whole class of transfers.
  - id: issue:1808
    title: SPKW to covalent chromatin modification
    url: https://github.com/geneontology/go-annotation/issues/1808
    relevance: 4
    method: haiku
    rationale: Applies the annotation-conventions guideline that when unsure whether a gene product regulates or performs
      a process, annotate to the parent term, to decide keyword-to-GO mapping for chromatin organization.
  - id: issue:1839
    title: human autophagy annotations over-inflated/ U2AF2 etc
    url: https://github.com/geneontology/go-annotation/issues/1839
    relevance: 4
    method: haiku
    rationale: Establishes practice that annotations from an RNAi screen should be restricted to follow-up genes, with IMP
      for low-throughput confirmed proteins and HMP for others; a general practice for high-throughput screen annotation.
  - id: issue:1869
    title: how ontology issues over-inflation of annotation affects GO analyses
    url: https://github.com/geneontology/go-annotation/issues/1869
    relevance: 4
    method: haiku
    rationale: Identifies two recurring over-annotation error types (target genes annotated to a process, experimental readouts)
      and proposes systematic review of species slims; a general annotation-quality practice applicable across species.
  - id: issue:1876
    title: Guidelines for ISS protein binding
    url: https://github.com/geneontology/go-annotation/issues/1876
    relevance: 4
    method: haiku
    rationale: Debates the general rule that ISS to protein binding is disallowed because the with field cannot capture the
      partner, and weighs alternatives such as has_input extensions and species-specific capture; applies beyond one gene.
  - id: issue:1879
    title: Redundant annotations accumulating
    url: https://github.com/geneontology/go-annotation/issues/1879
    relevance: 4
    method: haiku
    rationale: Sets a principle not to filter experimental annotations while deciding that redundant IEA, ISS and similar
      rows can be dropped when experimental support exists, and says guidelines are to follow for redundancy.
  - id: issue:1886
    title: '"regulation of cell size"'
    url: https://github.com/geneontology/go-annotation/issues/1886
    relevance: 4
    method: haiku
    rationale: Argues that genes merely affecting cell size in screens should not get regulation of cell size annotations,
      and discusses mechanism-based versus screen-based process annotation, a general practice question.
  - id: issue:1887
    title: Review direct annotations to 'biological regulation'
    url: https://github.com/geneontology/go-annotation/issues/1887
    relevance: 4
    method: opus
    rationale: Notice that 'biological regulation' and the generic (positive/negative) regulation of biological process terms
      become not-for-direct-annotation, with groups removing or replacing annotations and fixing InterPro2GO and UniRule mappings.
      A decision for a class of terms plus clean-up, so 4.
  - id: issue:1891
    title: symbiont process
    url: https://github.com/geneontology/go-annotation/issues/1891
    relevance: 4
    method: haiku
    rationale: Debates whether human genes should carry symbiont process and viral life cycle annotations, and whether part_of
      children should be regulates instead; reaches a general conclusion that many symbiont process terms are misplaced, applicable
      to a class of terms.
  - id: issue:1925
    title: 'Annotation review: IGI + ISS with a protein-containing complex in the ''with'' field'
    url: https://github.com/geneontology/go-annotation/issues/1925
    relevance: 4
    method: haiku
    rationale: Sets a rule that ISS annotations to complex IDs are acceptable once orthology of each subunit is checked, and
      debates whether IGI can describe a complex-dependent effect; general evidence-code practice for complex with-fields.
  - id: issue:1932
    title: Provide a 'high confidence'/ 'fool-proof' GAF
    url: https://github.com/geneontology/go-annotation/issues/1932
    relevance: 4
    method: haiku
    rationale: Discusses draft criteria for a high-confidence GAF (exclude HTP, NOT, contributes_to, colocalizes_with, candidate
      functions, IEA and IBA trade-offs), a substantial general QC and filtering policy debate.
  - id: issue:1953
    title: "PANTHER:PTN000109455\t"
    url: https://github.com/geneontology/go-annotation/issues/1953
    relevance: 4
    method: haiku
    rationale: Establishes that in vitro-only substrate evidence (histone methylation) does not support a physiological substrate
      annotation, and that known-irrelevant in vivo substrates are not annotated. A general practice applicable to kinase
      and methyltransferase assays.
  - id: issue:1955
    title: PANTHER:PTN001052033
    url: https://github.com/geneontology/go-annotation/issues/1955
    relevance: 4
    method: haiku
    rationale: Discusses causally upstream versus regulatory process annotation, concluding that generic perturbation phenotypes
      (cell cycle delay in many gene products) do not justify a cell cycle regulation term. Explicitly framed as a general
      discussion point.
  - id: issue:1979
    title: Review annotations to GO:0009190 cyclic nucleotide biosynthetic process
    url: https://github.com/geneontology/go-annotation/issues/1979
    relevance: 4
    method: haiku
    rationale: Establishes that cGAS, which makes a cyclic nucleotide, should not be annotated as a regulator of the viral
      life cycle, because the cyclic nucleotide is the regulator and the enzyme acts only upstream. A general convention for
      enzyme-product-signalling cases.
  - id: issue:1988
    title: 'Mechanism for whitelisting and blacklisting/flagging annotations and papers '
    url: https://github.com/geneontology/go-annotation/issues/1988
    relevance: 4
    method: haiku
    rationale: Decides on a mechanism to blacklist or flag papers and annotations and whitelist checked outliers, with the
      managers' decision to create a TSV in GitHub and to treat it as a hard check. Consortium QC policy.
  - id: issue:2019
    title: SHANK3 'duplicated' annotation
    url: https://github.com/geneontology/go-annotation/issues/2019
    relevance: 4
    method: haiku
    rationale: Decides that PAINT should not give two annotations to the same node that differ only by qualifier (colocalizes_with),
      and asks for a PAINT check to prevent it. Stated consortium convention on duplicate qualifier rows.
  - id: issue:2022
    title: Review annotations to GO:0097722 "sperm motility"
    url: https://github.com/geneontology/go-annotation/issues/2022
    relevance: 4
    method: haiku
    rationale: Decides that the grouping term sperm motility should not be annotated because its children split by taxon,
      and corrects direct annotations to flagellated sperm motility. Reusable do-not-annotate grouping-term convention.
  - id: issue:2025
    title: annotation checks from ND removal pile
    url: https://github.com/geneontology/go-annotation/issues/2025
    relevance: 4
    method: haiku
    rationale: Argues that IEP cannot support biosynthesis process terms and that response-to terms give false process annotations,
      leading to a general question of whether IEP should be used for process annotation at all; substantial guidance.
  - id: issue:2033
    title: ' PTN000081399 not 3''-phospho-5''-adenylyl sulfate transmembrane transport/er'
    url: https://github.com/geneontology/go-annotation/issues/2033
    relevance: 4
    method: haiku
    rationale: Concludes that transporter substrate specificity should not be transferred from mammals to yeast without a
      clear 1:1 relationship, and proposes type-specific transfer rules for transporters. A general practice for propagating
      transporter substrates.
  - id: issue:2042
    title: Doubled up IBA+EXP annotations (from Karen Christie)
    url: https://github.com/geneontology/go-annotation/issues/2042
    relevance: 4
    method: haiku
    rationale: Establishes that PAINT IBA annotations which are self-referential, with the target in its own with field, should
      not exist, and that review status is read from with-field usage. Explicit convention for IBA with/from.
  - id: issue:2045
    title: ' Automatic reports of ND-evidenced annotations'
    url: https://github.com/geneontology/go-annotation/issues/2045
    relevance: 4
    method: haiku
    rationale: Discusses a proposed automatic deletion of ND annotations when EXP, HTP, ISS or IGC annotations exist in the
      same aspect, with debate on whether protein binding justifies removal. Substantive policy discussion on ND handling.
  - id: issue:2046
    title: Missing 'DNA binding' annotations for some transcription factors
    url: https://github.com/geneontology/go-annotation/issues/2046
    relevance: 4
    method: haiku
    rationale: Discusses the 2012 transcription annotation guideline requiring DNA binding annotation for TFs, and whether
      ISS and IEA evidence should count. Establishes practice for TF DNA-binding annotation across a class of proteins.
  - id: issue:2047
    title: (regulation of) cell-cell adhesion - what relations to use to indicate cell types?
    url: https://github.com/geneontology/go-annotation/issues/2047
    relevance: 4
    method: haiku
    rationale: Requests guidelines on which annotation extension relations (occurs_in, has_agent, regulates_o_has_agent) link
      cell-cell adhesion terms to cell types, with cross-resource comparison of usage; a general relation-usage question.
  - id: issue:2076
    title: Annotation review - check use of has_input for MF annotations
    url: https://github.com/geneontology/go-annotation/issues/2076
    relevance: 4
    method: haiku
    rationale: Debates when has_input versus has_direct_input is correct for MF extensions and whether GO-CAM's has_input
      convention conflicts with conventional annotation practice. Sets a relation-convention question for a whole class of
      MF annotations, without a final ruling.
  - id: issue:2097
    title: '"protein binding" via PAINT/IBA'
    url: https://github.com/geneontology/go-annotation/issues/2097
    relevance: 4
    method: haiku
    rationale: Establishes that GO:0005515 protein binding should not be propagated or made via PAINT, and that the mass IBA
      protein binding annotations are to be removed; a general practice on the uninformative protein binding term.
  - id: issue:2109
    title: PTN000021568 CalpC NOT calcium-dependent cysteine-type endopeptidase activity
    url: https://github.com/geneontology/go-annotation/issues/2109
    relevance: 4
    method: haiku
    rationale: Discusses that NOT annotations should block contradictory propagated positives and that PAINT should use IRK
      rather than IRD when a catalytic residue loss is known; a general propagation practice.
  - id: issue:211
    title: protein import into nucleus (GO:0006606)
    url: https://github.com/geneontology/go-annotation/issues/211
    relevance: 4
    method: haiku
    rationale: Applies the rule that process terms go to gene products that facilitate the process, not to substrates, and
      points to colocalizes_with for proteins that move between organelles. Restates a general convention with a specific
      qualifier use.
  - id: issue:2126
    title: Notification for removal of annotations of protein-containing complexes and children used to annotate Protein Complexes
    url: https://github.com/geneontology/go-annotation/issues/2126
    relevance: 4
    method: opus
    rationale: Protein Complex WG decision that Complex Portal IDs should not be the subject of GO annotations (they are cross-references);
      individual subunits are annotated instead, with groups removing 28 annotations. A clear but brief policy within a clean-up
      ticket, so 4.
  - id: issue:2130
    title: 'Proteins annotated to DNA-binding transcription factor activity (GO:0003700) should NOT be also annotated to  catalytic
      activity (GO:0003824)  '
    url: https://github.com/geneontology/go-annotation/issues/2130
    relevance: 4
    method: haiku
    rationale: Establishes that proteins with DNA-binding transcription factor activity should generally not also carry catalytic
      activity, since enzymatic activity usually indicates a cofactor role, with exceptions reasoned per gene; a general annotation
      consistency principle.
  - id: issue:2133
    title: Curation Doubt on GO:0008656
    url: https://github.com/geneontology/go-annotation/issues/2133
    relevance: 4
    method: haiku
    rationale: Clarifies that GO terms do not specify substrates, so self-activation (e.g. caspase autoprocessing) is a valid
      molecular function annotation, and discusses whether the term examples should be extended; a general MF practice.
  - id: issue:2149
    title: PANTHER:PTN000484343
    url: https://github.com/geneontology/go-annotation/issues/2149
    relevance: 4
    method: haiku
    rationale: Concludes that complex assembly is over-annotated for subunits that are required for complex assembly and that
      such annotations should be reannotated to protein localization; a general caution about the assembly process term for
      complex subunits.
  - id: issue:2171
    title: PANTHER:PTN000320077
    url: https://github.com/geneontology/go-annotation/issues/2171
    relevance: 4
    method: haiku
    rationale: Establishes that PAINT should not propagate response to terms, and removes indirect process annotations keeping
      only direct complex II assembly; a stated general policy on response to terms.
  - id: issue:2204
    title: 'Review direct annotations to ''cell population proliferation'' '
    url: https://github.com/geneontology/go-annotation/issues/2204
    relevance: 4
    method: haiku
    rationale: Discusses the proposal to make cell proliferation do_not_annotate versus requiring annotation extensions, converging
      on extensions being the preferred route and a possible rule requiring one. General practice for a class of broad process
      terms.
  - id: issue:2213
    title: Review annotations to 'protein-containing complex assembly' by IMP
    url: https://github.com/geneontology/go-annotation/issues/2213
    relevance: 4
    method: haiku
    rationale: Argues that protein-containing complex assembly should not be annotated to complex members whose knockout merely
      prevents complex formation, a general caution on the assembly term for complex subunits.
  - id: issue:2219
    title: PANTHER:PTN000456925 Septate junction
    url: https://github.com/geneontology/go-annotation/issues/2219
    relevance: 4
    method: haiku
    rationale: Discusses whether single-source circular IBA annotations (gene evidencing itself) should be allowed and whether
      a more-than-one-evidence rule is needed; a general propagation policy question with the consortium practice on circular
      IBAs.
  - id: issue:2232
    title: Annotations to Complex Portal ACs where evidence spread across several expts in same paper
    url: https://github.com/geneontology/go-annotation/issues/2232
    relevance: 4
    method: opus
    rationale: 'Protein Complex WG call decision (Jan 2019): when transferring an annotation from subunits to a complex where
      the evidence is spread over several experiments, use the inferred code ECO:0005547. A narrow one-line ruling for a class
      of complex annotations, so 4.'
  - id: issue:2237
    title: clarify docs on NOT
    url: https://github.com/geneontology/go-annotation/issues/2237
    relevance: 4
    method: opus
    rationale: 'Documentation-clarification thread on the NOT qualifier: removes the contradictory ''not found in the nucleus''
      example (NOT is not used for negative/inconclusive results) and notes that NOT is used in PAINT via IKR, with the wiki
      updated. The guidance itself lives on the wiki; the issue records the clarification rather than stating the full policy,
      so 4. Current in substance; the wiki pages cited are legacy.'
  - id: issue:2250
    title: SPAC18B11.03c PAINT annotation "response to drug"
    url: https://github.com/geneontology/go-annotation/issues/2250
    relevance: 4
    method: haiku
    rationale: States that PAINT does not usually propagate response to terms (with stated exceptions such as starvation),
      removes the propagated response to drug term, and notes the more specific steroid terms are too risky to propagate;
      a general propagation convention.
  - id: issue:2280
    title: 'How to represent binding of a gene product in LEGO:'
    url: https://github.com/geneontology/go-annotation/issues/2280
    relevance: 4
    method: haiku
    rationale: Design discussion on modelling gene-product binding, weighing has_input on both partners against enables plus
      has_input, and whether protein binding should carry a multiprotein restriction. Relevant modelling guidance for binding
      annotations, not finalised.
  - id: issue:2290
    title: Review annotations to GO:0005198 structural molecule activity
    url: https://github.com/geneontology/go-annotation/issues/2290
    relevance: 4
    method: haiku
    rationale: Concludes that structural molecule activity should be annotated only when the activity was tested, otherwise
      only to a cellular component, and that protein-binding bridging should replace it where appropriate; a general MF practice
      for structural molecule activity.
  - id: issue:2295
    title: 'Review guidelines for manual annotations (ISA/ISM/ISS) using protein familes resources in ''with'' '
    url: https://github.com/geneontology/go-annotation/issues/2295
    relevance: 4
    method: haiku
    rationale: Asks whether manual ISS/ISA/ISM annotations using protein family resources in the with field are subject to
      the one-year expiry and whether the eco-usage constraint should change. Open policy question, with a practice argument
      for ISM use on large families.
  - id: issue:2311
    title: Review annotations to GO:0005215 transporter activity
    url: https://github.com/geneontology/go-annotation/issues/2311
    relevance: 4
    method: haiku
    rationale: Makes GO:0005215 transporter activity a do-not-annotate term and tracks review of existing annotations, a recorded
      consortium decision for a broad class of terms.
  - id: issue:2325
    title: Annotations to "cell"
    url: https://github.com/geneontology/go-annotation/issues/2325
    relevance: 4
    method: haiku
    rationale: Establishes that direct annotations to the over-general cell term are not useful, and clarifies that GOC F-to-C
      propagated cellular-component annotations should not inherit the original evidence code; a general practice beyond one
      case.
  - id: issue:2326
    title: 'Should NOT annotations allow Annotation Extensions ? '
    url: https://github.com/geneontology/go-annotation/issues/2326
    relevance: 4
    method: haiku
    rationale: Asks what NOT annotations with annotation extensions mean and whether they should be allowed; the reply states
      NOT is not permitted for extensions and is enforced by error logs. Establishes a rule on combining NOT with extensions.
  - id: issue:2349
    title: some proposed changes and clarifications
    url: https://github.com/geneontology/go-annotation/pull/2349
    relevance: 4
    method: haiku
    rationale: Documents the GPAD/GPI with/from convention that a comma means AND for multi-entity interactions (IGI, IPI)
      while pipes mean OR, with links to the documentation; a general convention clarified.
  - id: issue:2374
    title: annotation of non-helicase subunits of chromatin remodeller  to helicase  PANTHER:PTN000233752/ PANTHER:PTN000234048
    url: https://github.com/geneontology/go-annotation/issues/2374
    relevance: 4
    method: opus
    rationale: 'Case on IBA contributes_to helicase activity for Arp subunits of INO80, which leads to the clarified contributes_to
      convention: use it for emergent complex functions (e.g. RNA polymerase), annotate only the catalytic subunit when one
      exists, and remove the PAINT propagations. Discussion that reaches a general rule for complex-subunit MF annotation,
      but it is an issue thread, not the guideline text, so 4. Current (guidelines clarified in 2019).'
  - id: issue:2377
    title: use of qualifier with BP annotations
    url: https://github.com/geneontology/go-annotation/issues/2377
    relevance: 4
    method: haiku
    rationale: Asks for guidelines on BP qualifiers (involved_in versus acts_upstream_of and the positive/negative variants)
      and how extensions map to GPAD outputs. Substantial open discussion of general qualifier practice, not resolved.
  - id: issue:2378
    title: PANTHER:PTN000156123 Serpins without activity
    url: https://github.com/geneontology/go-annotation/issues/2378
    relevance: 4
    method: haiku
    rationale: Clarifies that the IKR evidence code is used for phylogenetic divergence analyses and proposes distinct ECO
      terms for PAINT versus manual divergence reasoning; a general evidence-code practice.
  - id: issue:2382
    title: PTN001501163 - colocalizes_with ionotropic glutamate receptor complex
    url: https://github.com/geneontology/go-annotation/issues/2382
    relevance: 4
    method: haiku
    rationale: Removes colocalizes_with complex terms, then debates whether single-annotation PAINT propagations should be
      allowed, with curators arguing for context-dependent rules. Substantial general discussion of propagation from single
      evidence.
  - id: issue:2417
    title: 'Matrix: amino acid metabolism/chromatin remodelling 6'
    url: https://github.com/geneontology/go-annotation/issues/2417
    relevance: 4
    method: haiku
    rationale: Discusses whether 'causally upstream of' should be used for a general metabolic prerequisite, with PomBase's
      policy of not using causal relations and an open question about its boundaries; a general practice debate.
  - id: issue:2425
    title: 'Matrix:  amino acid metabolism/protein targeting 2 (targeted to peroxisome)'
    url: https://github.com/geneontology/go-annotation/issues/2425
    relevance: 4
    method: haiku
    rationale: Explains the GAF-generation problem where both mediators and cargo of peroxisomal targeting get the process
      term, notes target molecules as process participants is pervasive, and proposes a fix to remove the process term from
      the Reactome pathway; a general modelling convention issue.
  - id: issue:2431
    title: 'Matrix: amino acid metabolism/transmembrane transport 4'
    url: https://github.com/geneontology/go-annotation/issues/2431
    relevance: 4
    method: haiku
    rationale: Gives criteria for when folate-generating or interconversion processes qualify for 'provides required input
      for' and why constitutive processes do not qualify for regulation terms; a general answer to the upstream-dependency
      question raised in several Matrix issues.
  - id: issue:2446
    title: 'Matrix: Sc:KTI11 electron transfer activity (tRNA metabolism/energy generation)'
    url: https://github.com/geneontology/go-annotation/issues/2446
    relevance: 4
    method: haiku
    rationale: Establishes that GO electron transfer activity (GO:0009055) should not be used for electron carriers that are
      not transporters, and that such cases default to oxidoreductase activity; a reusable convention for a class of iron-sulfur
      electron carrier annotations.
  - id: issue:2453
    title: 'Matrix: tRNA metabolism/transmembrane transport'
    url: https://github.com/geneontology/go-annotation/issues/2453
    relevance: 4
    method: haiku
    rationale: 'Clarifies GO usage: tRNA import into mitochondrion covers targeting as well as transmembrane transport, and
      transmembrane import requires crossing a membrane, so the term was misplaced under transmembrane transport and an ontology
      fix was requested; a general principle for the scope of import terms.'
  - id: issue:2456
    title: 'Matrix: tRNA metabolism/ nucleocytoplasmic transport'
    url: https://github.com/geneontology/go-annotation/issues/2456
    relevance: 4
    method: haiku
    rationale: Establishes that nuclear retention phenotypes from processing mutants do not show a transport role, so processing
      defects should be annotated to processing terms rather than nucleocytoplasmic transport; a general lesson on inferring
      process from retention phenotypes.
  - id: issue:2469
    title: 'Matrix: Eif4c mitochondrion organization / cytoplasmic translation'
    url: https://github.com/geneontology/go-annotation/issues/2469
    relevance: 4
    method: haiku
    rationale: States that positive regulation of cell population proliferation should not be annotated directly and that
      only child terms should indicate growth of a specific cell type, and that a mitochondrial depolarization readout does
      not support mitochondrion organization; a general convention for proliferation and readout terms.
  - id: issue:2510
    title: 'Matrix: DNA replication/cytoskeleton organization'
    url: https://github.com/geneontology/go-annotation/issues/2510
    relevance: 4
    method: haiku
    rationale: Argues that a phenotypic readout (siRNA reduced DNA synthesis) cannot support a regulation-of-replication annotation
      because many cell cycle blocks give the same phenotype; the 'distinguish readout' principle applies beyond this one
      case.
  - id: issue:2522
    title: Review annotations to GO:0032459 'regulation of protein oligomerization' and children
    url: https://github.com/geneontology/go-annotation/issues/2522
    relevance: 4
    method: haiku
    rationale: Companion consortium review of regulation of protein oligomerization terms restating the stoichiometry-out-of-scope
      decision and pointing to the guideline document; applies the same general policy to a second term family.
  - id: issue:2527
    title: '  nuclear division  cannot be part of "cell division" - how to make annotations consistent?'
    url: https://github.com/geneontology/go-annotation/issues/2527
    relevance: 4
    method: haiku
    rationale: Discusses how nuclear division should be consistently a child of cell division in annotation, since mitosis-only
      annotations are not automatically propagated; this is a general consistency issue about parent-child term annotation
      practice.
  - id: issue:2570
    title: What annotations have value?
    url: https://github.com/geneontology/go-annotation/issues/2570
    relevance: 4
    method: haiku
    rationale: Discusses when a regulation term is appropriate versus acts_upstream_of, with curators arguing that regulation
      should require mechanistic evidence of control. General practice on regulation terms, though the boundary is left open.
  - id: issue:2576
    title: ECO and with/from inheritance for DNA binding proteins
    url: https://github.com/geneontology/go-annotation/issues/2576
    relevance: 4
    method: haiku
    rationale: Discusses how the with/from requirement inherited through ECO for IPI-type DNA binding evidence (ChIP-qPCR)
      should be handled, and whether the ECO hierarchy or DNA identifiers should carry it; a general evidence-code practice
      issue.
  - id: issue:2582
    title: Change annotations using 'has_direct_input' to 'has_input' extensions
    url: https://github.com/geneontology/go-annotation/issues/2582
    relevance: 4
    method: haiku
    rationale: Changes has_direct_input extensions to has_input to match GO-CAM specifications across groups. A relation convention
      change, though mostly bulk tracking.
  - id: issue:2583
    title: Review annotations using extension 'part_of'
    url: https://github.com/geneontology/go-annotation/issues/2583
    relevance: 4
    method: haiku
    rationale: Restates the GO-CAM rule that part_of links only biological processes and gives replacement rules for CL, UBERON
      and GO CC part_of patterns. Documented relation policy with per-pattern guidance.
  - id: issue:2585
    title: Review annotations using extension 'happens_during' but NOT a biological phase
    url: https://github.com/geneontology/go-annotation/issues/2585
    relevance: 4
    method: haiku
    rationale: Establishes that happens_during is for biological phases only and then debates response-to terms, which are
      not clearly processes. Enforces a GO-CAM rule and raises an open general question on response-to processes.
  - id: issue:2586
    title: Review annotations to protein dimerization activity (GO:0046983)
    url: https://github.com/geneontology/go-annotation/issues/2586
    relevance: 4
    method: haiku
    rationale: Sets out how to revise protein dimerization activity annotations by evidence code, with IDA lacking with/from,
      NAS and TAS requiring experimental re-coding or deletion; a general evidence-to-action convention for stoichiometry
      terms.
  - id: issue:2587
    title: Review annotations using extension 'has_regulation_target'  for MF
    url: https://github.com/geneontology/go-annotation/issues/2587
    relevance: 4
    method: haiku
    rationale: Decides to replace has_regulation_target with has_input, with PomBase dissenting and keeping its display labels
      locally. A relation simplification decision with a documented dissent.
  - id: issue:2598
    title: 'Review annotations using extension ''regulates_transcription_of'' '
    url: https://github.com/geneontology/go-annotation/issues/2598
    relevance: 4
    method: haiku
    rationale: Proposes removing regulates_transcription_of with has_input as replacement, and raises an open question about
      the identifier namespace for regulated genes. A relation policy with an unresolved design point.
  - id: issue:2618
    title: 'Review annotations using extension ''has_agent'' '
    url: https://github.com/geneontology/go-annotation/issues/2618
    relevance: 4
    method: haiku
    rationale: Debates how to express has_agent cell-type context in cell-cell adhesion and secretion annotations, concluding
      chain relations can be modelled in GO-CAM but not exported to GPAD. Substantial discussion of expressivity limits for
      a class of annotations.
  - id: issue:2628
    title: Reference given is in russian
    url: https://github.com/geneontology/go-annotation/issues/2628
    relevance: 4
    method: haiku
    rationale: Reports a Russian-language reference annotated from its abstract and states the policy that annotations are
      not made from abstracts. A short but explicit statement of abstract-only curation practice.
  - id: issue:2664
    title: contributes_to DNA-directed DNA polymerase activity PTN000295225 (PTHR12708), PTN000045935 (PTHR10416)
    url: https://github.com/geneontology/go-annotation/issues/2664
    relevance: 4
    method: haiku
    rationale: Establishes a general rule that when a catalytic subunit is known only the catalytic subunit gets the catalytic
      activity, while non-catalytic complex members get contributes_to or other function terms; applies to a class of complex
      subunits, not one case.
  - id: issue:2677
    title: 'Review annotations using extension ''exists_during'' '
    url: https://github.com/geneontology/go-annotation/issues/2677
    relevance: 4
    method: haiku
    rationale: Debates replacing exists_during CC extensions with occurs_in or located_in and whether phases need happens_during,
      with curators disagreeing on the intended meaning. Substantial open discussion of a general relation practice.
  - id: issue:2682
    title: ' Review annotations to protein homodimerization activity (GO:0042803)'
    url: https://github.com/geneontology/go-annotation/issues/2682
    relevance: 4
    method: haiku
    rationale: Sets per-evidence-code review actions for protein homodimerization (IMP needs wild-type check, IC and TAS removed
      unless experimental support exists, NAS removed), a general practice for x-merization annotation review.
  - id: issue:2683
    title: Review annotations to protein heterodimerization activity (GO:0046982)
    url: https://github.com/geneontology/go-annotation/issues/2683
    relevance: 4
    method: haiku
    rationale: 'Sets evidence-code-specific policy for protein heterodimerization: IDA annotations to be moved to protein
      binding with an interaction accession in With/From, IMP checked for wild-type, TAS and NAS removed; generalizable across
      the x-merization terms.'
  - id: issue:2684
    title: Review annotations to 'regulation of protein x-merization activity' and children
    url: https://github.com/geneontology/go-annotation/issues/2684
    relevance: 4
    method: haiku
    rationale: Gives per-evidence-code actions for regulation of x-merization terms (move to regulation of protein complex
      assembly or remove), and raises how to represent regulation in GO-CAM; applicable to a class of regulation terms.
  - id: issue:2710
    title: 'IPR011701 add MF: transmembrane transporter activity ? '
    url: https://github.com/geneontology/go-annotation/issues/2710
    relevance: 4
    method: haiku
    rationale: States a documented convention that GO terms are generally not assigned to InterPro homologous superfamily
      entries, while adding transmembrane transporter activity to family entries; a rule about InterPro2GO mapping practice.
  - id: issue:2711
    title: Review human annotations for ALB UniProtKB:P02768
    url: https://github.com/geneontology/go-annotation/issues/2711
    relevance: 4
    method: haiku
    rationale: 'Broad review of ALB annotations raising general over-annotation concerns: high-throughput papers yielding
      uninformative terms, a binding-annotation glut with no specific function, and whether regulation of a process should
      be used versus a causal relation.'
  - id: issue:2718
    title: 'Review annotations using extension ''activated_by'' '
    url: https://github.com/geneontology/go-annotation/issues/2718
    relevance: 4
    method: haiku
    rationale: Proposes removing activated_by and debates binding and cofactor cases, with child terms such as ATP-sensitive
      calcium-release channel activity offered as an alternative. Substantial general discussion on how to record activators
      and cofactors.
  - id: issue:2720
    title: GO:0052042    positive regulation by symbiont of host programmed cell death
    url: https://github.com/geneontology/go-annotation/issues/2720
    relevance: 4
    method: haiku
    rationale: Settles how the symbiont-side 'positive regulation by symbiont of host programmed cell death' term is used,
      with taxon constraints (never in metazoa or plant) instead of annotation; a general decision for a class of symbiont
      terms.
  - id: issue:2760
    title: PANTHER:PTN000126179
    url: https://github.com/geneontology/go-annotation/issues/2760
    relevance: 4
    method: haiku
    rationale: Debates whether contributes_to may be used for non-catalytic E3 adaptor subunits (SKP1, F-box) and where the
      published guideline wiki and docs are outdated. Settles on ubiquitin ligase-substrate adaptor activity and molecular
      adaptor activity for such subunits, a practice that applies to a class of complex members.
  - id: issue:2771
    title: Change to ECO-to-GO Evidence Code mapping
    url: https://github.com/geneontology/go-annotation/issues/2771
    relevance: 4
    method: haiku
    rationale: Consortium notice that ECO changes move an EMSA term into the affinity branch, so it maps to IPI rather than
      IDA in the ECO-GO mapping; a documented change to evidence-code mapping that affects all annotations using it.
  - id: issue:2820
    title: Dubious experimental annotations to behavior in human
    url: https://github.com/geneontology/go-annotation/issues/2820
    relevance: 4
    method: haiku
    rationale: Argues that behavior annotations in humans (adult behavior, feeding behavior) are uninformative or should be
      do_not_annotate, that GO should express mechanism rather than phenotype, and that rat ISOs should not infer affect;
      general practice on behavior terms.
  - id: issue:2827
    title: Review annotations to GO:0098772 molecular function regulator
    url: https://github.com/geneontology/go-annotation/issues/2827
    relevance: 4
    method: haiku
    rationale: Announces a do-not-annotate flag on molecular function regulator (GO:0098772) and states that MF should not
      be used when the activity is unknown, with BP regulation terms used instead. This is a general annotation-practice decision
      for a class of terms, and it raises the Noctua versus GO export inconsistency.
  - id: issue:2853
    title: general transcription initiation factor activity (GO:0140223)
    url: https://github.com/geneontology/go-annotation/issues/2853
    relevance: 4
    method: haiku
    rationale: Quotes the usage guidance distinguishing general transcription factors (constitutive initiation machinery)
      from DNA-binding regulators, a convention applicable across GTF annotations.
  - id: issue:2866
    title: Annotation object types
    url: https://github.com/geneontology/go-annotation/issues/2866
    relevance: 4
    method: haiku
    rationale: Agrees a standard GPI object-type convention (protein-coding gene rather than transcript, gene or protein)
      for GeneDB entities, a documented practice applicable beyond this case.
  - id: issue:2921
    title: InterPro2GO for Carbohydrate kinase PfkB (IPR011611)
    url: https://github.com/geneontology/go-annotation/issues/2921
    relevance: 4
    method: haiku
    rationale: Explains why InterPro does not add GO terms to very large family entries and how EC xrefs derive from Swiss-Prot
      members, clarifying a general mapping practice.
  - id: issue:2929
    title: cell component annotation for transmembrane proteins
    url: https://github.com/geneontology/go-annotation/issues/2929
    relevance: 4
    method: opus
    rationale: 'Answers whether transmembrane proteins with domains in several compartments get several CC terms: the recommendation
      is a single annotation to the appropriate child of ''integral component of membrane''. It is a curator reply, the requested
      documentation was never written (issue left open), and GO:0016021 ''integral component of membrane'' has since been
      obsoleted, so the specific advice is out of date; 4.'
  - id: issue:2933
    title: Review annotations to transcription, DNA templated and children
    url: https://github.com/geneontology/go-annotation/issues/2933
    relevance: 4
    method: haiku
    rationale: Sets the policy that the transcription DNA-templated term and children should be used only for RNA polymerase
      and GTF annotations, with the rest moved to regulation terms.
  - id: issue:2942
    title: MMS19 is not  indirectly upstream of  transcription, and isn't regulatory
    url: https://github.com/geneontology/go-annotation/issues/2942
    relevance: 4
    method: haiku
    rationale: States that proteins required for maturation of a process's members are not normally annotated to that process,
      a general principle on indirect annotations, though the thread settles on keeping the term.
  - id: issue:2959
    title: Change Ensembl IDs in AE field to UniProt IDs
    url: https://github.com/geneontology/go-annotation/issues/2959
    relevance: 4
    method: haiku
    rationale: Records the agreed convention that UniProt IDs represent gene or protein by context, isoform IDs denote proteins,
      and extension ids should be changed from Ensembl to UniProt.
  - id: issue:2972
    title: Cdx2 and Pou5f1 revise annotations for transcription project
    url: https://github.com/geneontology/go-annotation/issues/2972
    relevance: 4
    method: haiku
    rationale: Establishes that coTF activity needs evidence the activity does not involve DNA binding, and that proteins
      with a characterised DNA-binding domain take dbTF, a general practice rule.
  - id: issue:2985
    title: NTNU P12755 SKI is this a dbTF or a coTF
    url: https://github.com/geneontology/go-annotation/issues/2985
    relevance: 4
    method: haiku
    rationale: Settles whether InterPro-only DNA-binding annotations can support dbTF status and whether EMSA with nuclear
      extract and ChIP are equivalent evidence for sequence-specific DNA binding, with a dbTF versus coTF decision for SKI
      and SKIL. The reasoning on what evidence establishes DNA binding applies to a class of transcription factors.
  - id: issue:2997
    title: Q03989 | ARID5A  and Q14865 ARID5B not dbTFs
    url: https://github.com/geneontology/go-annotation/issues/2997
    relevance: 4
    method: haiku
    rationale: Sets the strategy that ARID proteins binding DNA non-specifically are coTFs, and raises the general question
      of how specific DNA binding must be to count as dbTF evidence.
  - id: issue:3
    title: use of NOT
    url: https://github.com/geneontology/go-annotation/issues/3
    relevance: 4
    method: haiku
    rationale: Establishes that NOT must not be used for negative results such as 'not required for' a process, and that the
      qualifier documentation should make this explicit. Clarifies NOT qualifier policy for a general class of negative evidence.
  - id: issue:3002
    title: TAF annotations to GO:0051123 'RNA polymerase II preinitiation complex assembly'
    url: https://github.com/geneontology/go-annotation/issues/3002
    relevance: 4
    method: haiku
    rationale: Settles that complex-assembly BP terms can apply to assembly chaperones but not to subunits being assembled,
      with term definitions revised, a general rule for assembly annotations.
  - id: issue:3007
    title: Review NTNU annotations to RCOR1, RCOR2, and RCOR3
    url: https://github.com/geneontology/go-annotation/issues/3007
    relevance: 4
    method: haiku
    rationale: Sets the general rule that computational dbTF evidence must be disputed to InterPro when inconsistent with
      experimental coTF evidence, and that mappings absent from InterPro cannot support annotation.
  - id: issue:3008
    title: Is KDM5A, P29375, a coTF or a dbTF?
    url: https://github.com/geneontology/go-annotation/issues/3008
    relevance: 4
    method: haiku
    rationale: 'Re-examines KDM5A as dbTF versus coTF and sets out the bar for dbTF status: gene-specific effects cannot prove
      dbTF status because coregulators show the same pattern, and sequence-specific binding needs strong evidence. It cites
      curator guidance on ARID-domain coregulators and explains how such calls are made.'
  - id: issue:3086
    title: "Change \tMGI:99918  Mecp2 dbTF annotation to coTF annotation"
    url: https://github.com/geneontology/go-annotation/issues/3086
    relevance: 4
    method: haiku
    rationale: Discussion sets the practice that DNA binding must give a genomic address to count as dbTF, so methyl-CpG binders
      are coTF/corepressors; applies to a class of MeCP2-type proteins.
  - id: issue:3110
    title: Arid proteins not dbTFs
    url: https://github.com/geneontology/go-annotation/issues/3110
    relevance: 4
    method: haiku
    rationale: Agreed dbTF-discussion decision that AT-hook proteins are not dbTFs, with the instruction to use GO:0003680
      AT DNA binding and coregulator terms; establishes a rule for a class of ARID and AT-hook annotations.
  - id: issue:3122
    title: "P62633\tCNBP not dbTF"
    url: https://github.com/geneontology/go-annotation/issues/3122
    relevance: 4
    method: haiku
    rationale: Records the agreed decision that G-quadruplex binding proteters such as CNBP should not be annotated to dbTF
      terms because no sequence-specific motif exists; a rule for a class of structure-binding proteins.
  - id: issue:3124
    title: PCBP family not dbTFs
    url: https://github.com/geneontology/go-annotation/issues/3124
    relevance: 4
    method: haiku
    rationale: Family-level agreement that PCBP proteins (KH-domain RNA binders) are not dbTFs and that their ssDNA or CCCC-repeat
      binding does not qualify; sets a decision for a whole family.
  - id: issue:3125
    title: THAP family remove annotations
    url: https://github.com/geneontology/go-annotation/issues/3125
    relevance: 4
    method: haiku
    rationale: Family-level review of THAP proteins concludes that dbTF annotation needs direct DNA-binding evidence, with
      per-member verdicts; a worked family-wide decision on the evidence bar.
  - id: issue:3135
    title: 'NR0B1/DAX1 (P51843): is binding to double-strand a really key feature for classifying a protein as DbTF?'
    url: https://github.com/geneontology/go-annotation/issues/3135
    relevance: 4
    method: haiku
    rationale: Decides that binding a DNA hairpin or single-stranded DNA is not evidence for dbTF status, since dbTFs need
      double-stranded sequence-specific binding, and directs curators to the DNA hairpin binding term. This is a general criterion
      for classifying DNA-binding proteins.
  - id: issue:3168
    title: Q6ZN28 | MACC1 Not dbTF change to coTF
    url: https://github.com/geneontology/go-annotation/issues/3168
    relevance: 4
    method: haiku
    rationale: States the general rule that nuclear-extract EMSA and ChIP cannot confirm DNA binding unless the protein has
      a recognised DNA-binding domain, and sets the coactivator term instead; applies beyond MACC1.
  - id: issue:3194
    title: PTN000897489 (PTHR11523)
    url: https://github.com/geneontology/go-annotation/issues/3194
    relevance: 4
    method: haiku
    rationale: Discusses whether contributes_to with a catalytic activity is right for non-catalytic beta subunits, and whether
      regulators should be annotated to regulates rather than involved in; a general question for many transporter subunit
      families.
  - id: issue:3231
    title: ZNF609 and ZNF608
    url: https://github.com/geneontology/go-annotation/issues/3231
    relevance: 4
    method: haiku
    rationale: States the working criterion that a protein with a single zinc finger and weak experimental DNA-binding evidence
      is not classed as a dbTF. A decision recorded for a class of proteins, with curators asking for the reasoning to be
      documented.
  - id: issue:3235
    title: "Q9NX58\tLYAR is this a dbTF"
    url: https://github.com/geneontology/go-annotation/issues/3235
    relevance: 4
    method: haiku
    rationale: Establishes that nuclear-extract binding (EMSA, supershift) does not demonstrate direct sequence-specific DNA
      binding because binding may be indirect. An evidence standard applied to a whole class of experiments.
  - id: issue:3237
    title: LYAR not a dbTF
    url: https://github.com/geneontology/go-annotation/issues/3237
    relevance: 4
    method: haiku
    rationale: Duplicate of 3235 restating that nuclear-extract evidence does not establish direct DNA binding for dbTF annotation.
      Reiterates the evidence standard.
  - id: issue:3242
    title: Leveraging a 'contributes to' annotation for an ISA?
    url: https://github.com/geneontology/go-annotation/issues/3242
    relevance: 4
    method: haiku
    rationale: Asks whether a contributes_to qualifier can be carried into an ISS/ISA inference; curators agree qualifiers
      are preserved in PAINT and that the practice should be documented. Applies across inferred annotations generally.
  - id: issue:3246
    title: ProtInc GO annotations to delete
    url: https://github.com/geneontology/go-annotation/issues/3246
    relevance: 4
    method: haiku
    rationale: Debates bulk deletion of redundant PINC annotations and proposes permanently filtering TAS, NAS and IC rows
      where a supported source exists. Substantial discussion of a general redundancy-filtering policy.
  - id: issue:3250
    title: "TFDP3 Q5H9I0 - remove GO:0000981\t DNA-binding transcription factor activity, RNA polymerase II-specific"
    url: https://github.com/geneontology/go-annotation/issues/3250
    relevance: 4
    method: haiku
    rationale: Records a decision to remove MF DNA-binding mappings from InterPro domains for TFDP3, and raises whether a
      whole TFClass family should be removed when one member is not a dbTF. A practice question applicable across families.
  - id: issue:328
    title: IPR000649
    url: https://github.com/geneontology/go-annotation/issues/328
    relevance: 4
    method: haiku
    rationale: Establishes that salvage terms are not children of the corresponding biosynthesis terms but sit directly under
      metabolism, and that any parentage change should be made consistently. States an ontology structure convention applied
      across a class of terms.
  - id: issue:3282
    title: Product of the upstream open reading frame (uORF) of DDIT3/CHOP not a dbTF
    url: https://github.com/geneontology/go-annotation/issues/3282
    relevance: 4
    method: haiku
    rationale: Explains that PANTHER keeps only 1:1 MOD-to-UniProtKB mappings, so IBA export skips alternative UniProt accessions
      sharing one MGI ID. Clarifies a general PAINT export rule for duplicate or isoform records.
  - id: issue:3283
    title: 'PANTHER:PTN002668854 (PTHR13482) '
    url: https://github.com/geneontology/go-annotation/issues/3283
    relevance: 4
    method: haiku
    rationale: Concludes that non-catalytic complex subunits should not carry contributes_to catalytic terms and should use
      enzyme regulator or protein-RNA adaptor terms instead. States a convention for complex members that applies across families.
  - id: issue:3314
    title: interspecies protein binding - exported from IntAct
    url: https://github.com/geneontology/go-annotation/issues/3314
    relevance: 4
    method: haiku
    rationale: States the GO policy that interspecies protein binding annotations are allowed only for physiological interactions,
      and that IntAct should put the partner ID in the with column. A policy applicable to all interaction-derived annotations.
  - id: issue:3387
    title: Ybx3 is NOT a dbTF
    url: https://github.com/geneontology/go-annotation/issues/3387
    relevance: 4
    method: haiku
    rationale: Records the lab rule that EMSA with nuclear extracts is rejected as dbTF evidence unless other evidence exists,
      and that CSD factors bind single-stranded nucleic acids. An evidence standard applicable across the class.
  - id: issue:3413
    title: "PTN000317629  not GO:0003714\t transcription corepressor activity  - PTHR13082"
    url: https://github.com/geneontology/go-annotation/issues/3413
    relevance: 4
    method: haiku
    rationale: Substantial discussion of whether coregulators can act through repressor complexes without direct DNA-TF binding,
      plus the principle that single-entity PAINT transfers should generally not be propagated.
  - id: issue:3414
    title: PTHR13831 - PTN000352669
    url: https://github.com/geneontology/go-annotation/issues/3414
    relevance: 4
    method: haiku
    rationale: Discussion of whether histone chaperones and modifiers can be classed as coregulators, a class-level decision
      about applying the co-regulator term.
  - id: issue:3494
    title: PTN000458477
    url: https://github.com/geneontology/go-annotation/issues/3494
    relevance: 4
    method: haiku
    rationale: Establishes that activator or inhibitor activities are linked to their target activity by regulates relations
      rather than annotated as regulation of a process; applies beyond this case.
  - id: issue:3510
    title: UCL review contributes_to annotations
    url: https://github.com/geneontology/go-annotation/issues/3510
    relevance: 4
    method: haiku
    rationale: Records decisions on contributes_to annotations for non-catalytic transporter subunits, choosing ATPase activator
      and adaptor terms with example extensions; a class-level convention.
  - id: issue:3514
    title: '"Interacting species" should be captured as an extension with the "has input" relation'
    url: https://github.com/geneontology/go-annotation/issues/3514
    relevance: 4
    method: haiku
    rationale: Proposes migrating interacting-species annotations from the interacting taxon field to an annotation extension
      with has_input, and debates the cost to groups that do not use extensions. Sets out a general recommendation for interspecies
      interaction terms and the trade-off against tool support.
  - id: issue:3528
    title: PTN000138598 PTN001020335  PTN000158239 mappings to 'response to' terms
    url: https://github.com/geneontology/go-annotation/issues/3528
    relevance: 4
    method: haiku
    rationale: Records a policy that PomBase does not annotate response-to terms and that cross-species response-to inferences
      are unsafe; a class-level convention.
  - id: issue:3539
    title: human annotations  to receptor-mediated endocytosis overinflated
    url: https://github.com/geneontology/go-annotation/issues/3539
    relevance: 4
    method: haiku
    rationale: Establishes that endocytic receptors can take part in receptor-mediated endocytosis but cargo should not, a
      general principle for applying process terms to ligands and cargo.
  - id: issue:3541
    title: "Necdin NDN MGI:97290\uFEFF"
    url: https://github.com/geneontology/go-annotation/issues/3541
    relevance: 4
    method: haiku
    rationale: Records that regulation-of-MF terms are being removed and that complex members are annotated as coregulators;
      a class-level policy.
  - id: issue:3595
    title: Mouse MGI:2140950 (Q91YI6) Tent2 is active in the cytoplasm
    url: https://github.com/geneontology/go-annotation/issues/3595
    relevance: 4
    method: haiku
    rationale: Discussion of whether a localization claim should be is_active_in or located_in when the location of activity
      is not shown; a general qualifier practice.
  - id: issue:3616
    title: V-ATPase subunit ATPase annotations in PAINT - should be 'contributes to'
    url: https://github.com/geneontology/go-annotation/issues/3616
    relevance: 4
    method: haiku
    rationale: Establishes that subunits of an irreducible molecular machine such as the V-ATPase take contributes_to for
      compound terms like proton-transporting ATPase activity, rotational mechanism, and contrasts this with accessory subunits.
      It also finds the public contributes_to docs out of date and asks for them to be aligned with the wiki.
  - id: issue:3663
    title: PMID:19826040
    url: https://github.com/geneontology/go-annotation/issues/3663
    relevance: 4
    method: haiku
    rationale: Decision to remove regulation-of-checkpoint terms because checkpoint signalling is itself the regulation, with
      reasoning on phenotype-level miRNA annotations; a class-level convention.
  - id: issue:3664
    title: Review annotations to GO:0007050 cell cycle arrest & children
    url: https://github.com/geneontology/go-annotation/issues/3664
    relevance: 4
    method: haiku
    rationale: Records a decision to merge cell cycle arrest terms and gives replacement terms or the causally upstream of
      relation for their EXP annotations; a class-level policy.
  - id: issue:3712
    title: PMID:15496587 SAP30B (reviewing unknowns)
    url: https://github.com/geneontology/go-annotation/issues/3712
    relevance: 4
    method: haiku
    rationale: States that cell death and proliferation readouts are frequently misleading and that inappropriate-expression
      phenotypes do not justify a process annotation; a general caution for common terms.
  - id: issue:3729
    title: direct annotations to cell death terms
    url: https://github.com/geneontology/go-annotation/issues/3729
    relevance: 4
    method: haiku
    rationale: Records that cell death is a do-not-annotate term and that pro-survival direct annotations should be reviewed;
      a class-level policy for a generic term.
  - id: issue:3770
    title: HPRT1 (UniProtKB:P00492) should not be annotated to guanine salvage and hypoxanthine salvage
    url: https://github.com/geneontology/go-annotation/issues/3770
    relevance: 4
    method: haiku
    rationale: Debates whether substrate-to-product salvage terms (guanine/hypoxanthine salvage) should carry an enzyme that
      acts one step downstream, arguing from the term definitions that salvage terms end at the base. This reaches a general
      convention for salvage-pathway annotation.
  - id: issue:3814
    title: Fix annotations to 'symbiont'-specific terms
    url: https://github.com/geneontology/go-annotation/issues/3814
    relevance: 4
    method: haiku
    rationale: Asks whether host proteins should carry 'modulation by symbiont of host' terms and reviews many such terms,
      with a PAINT-removal and evidence-check approach. Reaches a general question about symbiont-host term use.
  - id: issue:3819
    title: Review annotations to regulation of motor activity & children
    url: https://github.com/geneontology/go-annotation/issues/3819
    relevance: 4
    method: haiku
    rationale: Works through how to annotate regulatory and structural light chains of motors (regulator, contributes_to,
      or the process) and decides that ATPase regulator activity sits under the enzyme regulator branch, because has_part
      catalytic activity does not make regulates transitive. This sets reusable conventions for regulatory subunits.
  - id: issue:3845
    title: PomBase histone demethylases
    url: https://github.com/geneontology/go-annotation/issues/3845
    relevance: 4
    method: haiku
    rationale: Discusses whether family members with no experimental data can be annotated to the parent histone demethylase
      activity term, since specificity may vary across family members. Reaches a general practice for annotating family members
      to parent terms.
  - id: issue:385
    title: M28 family peptidase mappings
    url: https://github.com/geneontology/go-annotation/issues/385
    relevance: 4
    method: opus
    rationale: InterPro2GO case on M28 family (IPR003137) peptidase mapping, where the InterPro curator states the general
      policy that enzyme annotations are not removed because a family has a few catalytically inactive members; inactive members
      are annotated manually. A general rule stated inside a 2007 case comment rather than a guideline, so 4; still reflects
      InterPro2GO practice.
  - id: issue:3865
    title: Torsin (IPR010448)
    url: https://github.com/geneontology/go-annotation/issues/3865
    relevance: 4
    method: haiku
    rationale: 'Decides how to annotate torsins whose ATPase activity needs cofactors: the group states that a gene product
      needing another to carry out a composite function can take contributes_to, and that cofactors take ATPase activator
      activity. Reaches a general practice for cofactor-dependent activities.'
  - id: issue:3885
    title: Review annotations to GO:0010964 regulation of heterochromatin assembly by small RNA and GO:0060906 negative regulation
      of heterochromatin assembly by small RNA
    url: https://github.com/geneontology/go-annotation/issues/3885
    relevance: 4
    method: haiku
    rationale: Debates whether taxon constraints (never_in_taxon) should be inherited across regulates relations, and the
      consequences for symbiont regulation of host processes. Reaches a general rule for taxon constraint inheritance.
  - id: issue:390
    title: 'spkw: Fe-S cluster vs. iron binding'
    url: https://github.com/geneontology/go-annotation/issues/390
    relevance: 4
    method: haiku
    rationale: Records the GOA decision to keep iron ion binding for keyword-derived annotations while adding exception rules
      for co-assigned iron-sulfur cluster binding. Sets a general rule for applying keyword-to-GO mappings that overlap.
  - id: issue:3932
    title: PTN001236278 positive regulation of transcription by RNA polymerase II - PTHR47636
    url: https://github.com/geneontology/go-annotation/issues/3932
    relevance: 4
    method: haiku
    rationale: Records the agreed convention to use 'regulation of transcription' rather than positive or negative regulation
      for dbTFs and coTFs, and discusses inhibitor-of-inhibitor logic. A general annotation convention, though not fully settled.
  - id: issue:4
    title: component annotations and transient association
    url: https://github.com/geneontology/go-annotation/issues/4
    relevance: 4
    method: haiku
    rationale: Resolves how transient association of components should be annotated, with colocalizes_with documented as the
      qualifier for it. Sets a general practice for distinguishing stable complex membership from transient association.
  - id: issue:4000
    title: PTN000564171  transcription coregulator activity ?
    url: https://github.com/geneontology/go-annotation/issues/4000
    relevance: 4
    method: opus
    rationale: PAINT question on whether Epe1 fits 'transcription coregulator activity'; the TF-curation expert sets out coTF
      criteria (recruitment by a DNA-bound dbTF, by histone-mark reading, or by another coTF) citing the 2021 BBA guidelines,
      and also offers a stricter reading. Useful clarification of a class of MF terms, but the thread ends unresolved on the
      definition mismatch and it is case discussion, so 4.
  - id: issue:403
    title: possible Interpro and Uniprot map. probs for GTPase activat.
    url: https://github.com/geneontology/go-annotation/issues/403
    relevance: 4
    method: haiku
    rationale: Explains why GEF activity should not map to GTPase activator activity and why GDP-dissociation inhibitors are
      not GTPase activators, using the mechanism of GTP hydrolysis. Reusable reasoning for a class of regulator terms.
  - id: issue:4040
    title: changing associated GO BP term for IPR031120
    url: https://github.com/geneontology/go-annotation/issues/4040
    relevance: 4
    method: haiku
    rationale: Debates whether a chromatin-assembly chaperone should get regulation of transcription, weighing indirect upstream
      effects, co-transcriptional reassembly and pleiotropy against coTF status. Reaches a general principle on indirect effects
      and coTF evidence.
  - id: issue:4042
    title: protein phosphorylation annotations - review single step BP
    url: https://github.com/geneontology/go-annotation/issues/4042
    relevance: 4
    method: haiku
    rationale: Discusses how to annotate phosphorylation phenotypes from mutants, concluding these are outside the normal-role
      scope of GO annotation and belong to MOD phenotype curation. Reaches a general scope principle.
  - id: issue:4052
    title: BMP secretion
    url: https://github.com/geneontology/go-annotation/issues/4052
    relevance: 4
    method: haiku
    rationale: Discusses whether BMP secretion and its child terms should remain or become production terms, and sets out
      when secretion terms (needing evidence of regulated secretion) versus production terms (synthesis plus secretion, indistinguishable
      in assays) should be used for ligands. This is a general practice for a class of ligand terms.
  - id: issue:4190
    title: 'ARBA: ARBA00026310 (annotations to BP modification terms are being removed)'
    url: https://github.com/geneontology/go-annotation/issues/4190
    relevance: 4
    method: haiku
    rationale: Establishes that BP modification terms are being removed from annotation and discusses whether ARBA-based function-prediction
      IEAs are acceptable under GO practice. Reaches a general policy for propagated IEAs and removed BP branches.
  - id: issue:4192
    title: PTN000409964 
    url: https://github.com/geneontology/go-annotation/issues/4192
    relevance: 4
    method: haiku
    rationale: Debates whether a within-pathway factor should be annotated to regulation of elongation or to the process itself,
      and whether regulation terms should be used for parts of a process. Reaches a general practice question on regulation
      terms.
  - id: issue:4239
    title: 'SMAD signaling needs consistent annotation '
    url: https://github.com/geneontology/go-annotation/issues/4239
    relevance: 4
    method: haiku
    rationale: Establishes a practice question on whether SMAD signal transduction is an intracellular cassette, and how ligands
      and receptors should be annotated versus regulation terms, with a proposed consistent convention applicable to all signaling
      cassettes.
  - id: issue:4412
    title: Review annotations to [NON PROGRAMMED cell death terms]
    url: https://github.com/geneontology/go-annotation/issues/4412
    relevance: 4
    method: haiku
    rationale: Obsoletes non-programmed cell death terms (cell death, necrotic cell death, oncosis) and moves annotations
      to programmed descendants, stating that only programmed death mechanisms should be annotated and pathogenic mutations
      should not be annotated to cell death. This is a general rule for a class of death terms, with slim and phenotype-ontology
      consequences.
  - id: issue:4554
    title: PTN000325119 GO:0003713 | transcription coactivator activity
    url: https://github.com/geneontology/go-annotation/issues/4554
    relevance: 4
    method: haiku
    rationale: Sets out the general criteria for coactivator and corepressor molecular function, including recruitment via
      a DNA-bound transcription factor and the distinction from general transcription factor activity; the reasoning applies
      across many genes.
  - id: issue:4573
    title: 'Incorrect UniProt KW mapping:  SPAC1F7.03'
    url: https://github.com/geneontology/go-annotation/issues/4573
    relevance: 4
    method: haiku
    rationale: Asks whether UniProt keyword-derived Golgi mappings should be removed where the Golgi is only a transit compartment,
      and sets out the policy that transit is not where the protein is active, with secreted-protein retention and sequestration
      handled separately. It also debates whether KW-based GO relations should default to located_in rather than is_active_in.
  - id: issue:4582
    title: GO:0046929 in non-eukaryotes
    url: https://github.com/geneontology/go-annotation/issues/4582
    relevance: 4
    method: haiku
    rationale: States the rule that single-organism processes such as negative regulation of neurotransmitter secretion are
      not used for toxins or viruses, which should use the symbiont-host terms, and explains the taxon constraint in terms
      of where the process occurs.
  - id: issue:4605
    title: 'gpad/gpi2.0 specs: Allowed relations for extensions'
    url: https://github.com/geneontology/go-annotation/issues/4605
    relevance: 4
    method: haiku
    rationale: Specifies the allowed relations for GPAD 2.0 extensions, restricting them to the Relations Ontology valid_for_go_annotation_extension
      subset, a documented convention for extension relations.
  - id: issue:4606
    title: question about transposons and dubious genes (clarification required)
    url: https://github.com/geneontology/go-annotation/issues/4606
    relevance: 4
    method: haiku
    rationale: Raises whether transposon and dubious gene annotations should be submitted, proposes entity-type labelling
      to allow filtering, and notes that domesticated transposons function as genes; a general policy question about which
      entities to annotate.
  - id: issue:4607
    title: Review annotations to GO:0019787 ubiquitin-like protein transferase activity and children
    url: https://github.com/geneontology/go-annotation/issues/4607
    relevance: 4
    method: haiku
    rationale: Argues that ubiquitin-like transferase grouping terms encode the type of ubiquitin-like moiety, not the substrate,
      and that they are retained beneath the substrate-capturing has_input extension; a general principle on grouping terms
      and modification-type terms.
  - id: issue:4697
    title: PTN008708268 (PTHR46426)
    url: https://github.com/geneontology/go-annotation/issues/4697
    relevance: 4
    method: haiku
    rationale: Argues against propagating an MF via PAINT on a single IMP annotation while a human IDA conflicts, and notes
      IDA is over-used by curators regardless of method; this is a general propagation and evidence-code practice point.
  - id: issue:4750
    title: Review annotations to GO:0005844 polysome and GO:0042788 polysomal ribosome
    url: https://github.com/geneontology/go-annotation/issues/4750
    relevance: 4
    method: haiku
    rationale: Explains why polysome and polysomal ribosome terms are invalid (singular-entity principle, mRNA included, multiple
      ribosomes) and that part_of or translation-interacting proteins should go to cytoplasm; a general term-design principle.
  - id: issue:4881
    title: GPAD/GPI spec fixes
    url: https://github.com/geneontology/go-annotation/issues/4881
    relevance: 4
    method: haiku
    rationale: Records a managers' decision that the GPAD/GPI spec does not permit extra properties beyond the defined set,
      and clarifies single-valued property semantics; a documented format convention.
  - id: issue:5116
    title: Review annotations to GO:0043621 protein self-association and  GO:0032840 intramolecular proline-rich ligand binding
    url: https://github.com/geneontology/go-annotation/issues/5116
    relevance: 4
    method: haiku
    rationale: Decides to stop capturing self-association and homomultimerization terms because they say little about function
      and overlap with interaction curation; a documented scope decision for a class of terms.
  - id: issue:5160
    title: PMID:12485443 and others used for lipid metabolism (annotating readouts)
    url: https://github.com/geneontology/go-annotation/issues/5160
    relevance: 4
    method: haiku
    rationale: States that IMP readouts of phenotypes (lipid profiling, expression changes) are not suitable for GO annotation
      of direct gene roles, pointing to the phenotype-annotation guidelines and GO handbook.
  - id: issue:5254
    title: Should contributes_to be  included with PAINT annotations?
    url: https://github.com/geneontology/go-annotation/issues/5254
    relevance: 4
    method: haiku
    rationale: Clarifies that PAINT can only propagate primary annotations as made, including their contributes_to qualifiers,
      and that the choice of which to propagate is the PAINT curator's; a general practice on qualifier propagation.
  - id: issue:5327
    title: Review annotations to GO:0004697 diacylglycerol-dependent serine/threonine kinase activity
    url: https://github.com/geneontology/go-annotation/issues/5327
    relevance: 4
    method: haiku
    rationale: Decides to make a general diacylglycerol-dependent kinase term do-not-annotate and to annotate to its more
      specific calcium-dependent or calcium-independent children; a general practice for a class of general terms.
  - id: issue:5411
    title: Ensembl IEA pipeline
    url: https://github.com/geneontology/go-annotation/issues/5411
    relevance: 4
    method: haiku
    rationale: Argues that the Ensembl IEA pipeline ignores relations, so involved_in becomes acts_upstream_of_or_within and
      propagates downstream effects to human genes, and asks that only core relations transfer. The thread discusses which
      relations should propagate and why, which is a general propagation and relation-deepening policy question.
  - id: issue:5432
    title: EC mapping to histone H2AS1 kinase activity (GO:0044024)
    url: https://github.com/geneontology/go-annotation/issues/5432
    relevance: 4
    method: haiku
    rationale: States that broadMatch cross-references must not be used in automated pipelines and that the export should
      filter them; a general mapping-practice rule with consequences for IEA annotations.
  - id: issue:5530
    title: "GO:0006696\t ergosterol biosynthetic process IBA with PTN000825284"
    url: https://github.com/geneontology/go-annotation/issues/5530
    relevance: 4
    method: haiku
    rationale: Discusses whether the mevalonate pathway belongs under ergosterol biosynthesis and refers to a GO editorial
      call decision on pathway-term scope, which generalises beyond this one gene.
  - id: issue:5546
    title: ALANYL-TRNA SYNTHETASE (PTHR11777)-FBgn0027094
    url: https://github.com/geneontology/go-annotation/issues/5546
    relevance: 4
    method: haiku
    rationale: Discussion that when cytosolic and mitochondrial members are mixed in a tree, not propagating the cellular
      component is correct; states a general propagation practice for mixed-localisation families.
  - id: issue:5574
    title: "GO:0022627\t cytosolic small ribosomal subunit IBA with S000003286 , PTN000325517"
    url: https://github.com/geneontology/go-annotation/issues/5574
    relevance: 4
    method: haiku
    rationale: Debates whether located_in or part_of is allowed for a non-ribosomal translation factor and cites the located_in
      guidance and the unresolved complex-versus-organelle classification of the ribosome; general practice on relations to
      complexes.
  - id: issue:5590
    title: Incorrect annotations to CHAC1 and CHAC2 from Reactome annotation
    url: https://github.com/geneontology/go-annotation/issues/5590
    relevance: 4
    method: haiku
    rationale: Argues that a loose Reactome BP mapping to a synthesis-plus-recycling pathway is not propagatable and that
      GO start/end rules exclude post-synthesis steps; generalisable guidance on mapping predicate and process boundaries.
  - id: issue:5591
    title: Propagate uniprot caution warnings to GO annotations (example from PARK7 gene)
    url: https://github.com/geneontology/go-annotation/issues/5591
    relevance: 4
    method: haiku
    rationale: Proposes propagating UniProt caution notes to GO annotations and mining them for NOT annotations, with an example
      where a paper was superseded by a later one. It raises a general question of how to handle retracted or contested evidence
      that is rarely negated in GO.
  - id: issue:5595
    title: Review mouse tp53 annotation to GO:0019661 glucose catabolic process to lactate via pyruvate
    url: https://github.com/geneontology/go-annotation/issues/5595
    relevance: 4
    method: haiku
    rationale: 'Proposes guidelines for regulation BP annotations: the MF must directly regulate a process activity and cannot
      be linked by acts upstream of or within; a general practice proposal, though not yet adopted.'
  - id: issue:5619
    title: Review annotations to GO:0006090 pyruvate metabolic process
    url: https://github.com/geneontology/go-annotation/issues/5619
    relevance: 4
    method: haiku
    rationale: Discusses making pyruvate metabolic process do-not-annotate and moving annotations to descendants, and argues
      that splitting pathways into synthetic and catabolic parts loses information; general term-policy discussion.
  - id: issue:5691
    title: "GO:0048254\t snoRNA localization IBA with PTN001782010 , Q9NWK9"
    url: https://github.com/geneontology/go-annotation/issues/5691
    relevance: 4
    method: haiku
    rationale: Discussion that localization terms should generally not be PAINTed because they read as phenotypes rather than
      processes, with a curator proposal to avoid localization as a PAINT process; general practice.
  - id: issue:5694
    title: 'Difference between GO:0042406: extrinsic component of endoplasmic reticulum membrane and GO:0098554:cytoplasmic
      side of endoplasmic reticulum membrane'
    url: https://github.com/geneontology/go-annotation/issues/5694
    relevance: 4
    method: haiku
    rationale: Asks how to choose between extrinsic component of ER membrane and cytoplasmic side of ER membrane for enzymes
      on the cytosolic face, and the reply explains the is_a structure of the two hierarchies. It gives a reusable rule for
      membrane-associated proteins, with a request for diagrams.
  - id: issue:5743
    title: 'AI Transcription Factor review: NOTCH1 (human)'
    url: https://github.com/geneontology/go-annotation/issues/5743
    relevance: 4
    method: haiku
    rationale: AI-generated review of NOTCH1 transcription factor annotations, followed by curator discussion that coactivators
      need direct, necessary DNA binding to take dbTF-style DNA binding terms, and a split between GO:0003700, GO:0003712
      and GO:0000976 for coregulators. The curator debate sets a general principle for coregulator DNA binding.
  - id: issue:5750
    title: 'NAD/NADP: More specific annotations requested'
    url: https://github.com/geneontology/go-annotation/issues/5750
    relevance: 4
    method: haiku
    rationale: Establishes that NAD(P)-generic grouping terms become do-not-annotate, with annotations moved to NAD- or NADP-specific
      terms; a term-level policy decision applicable to a class of terms.
  - id: issue:5772
    title: Update GPI entity types to match the GO website
    url: https://github.com/geneontology/go-annotation/issues/5772
    relevance: 4
    method: haiku
    rationale: Lists the allowed entity types for GPI annotations (PR protein, GO complex, SO gene types, ncRNA, pseudogene),
      a documented convention for the GPI format.
  - id: issue:5824
    title: Review annotations to GO:0000032 cell wall mannoprotein biosynthetic process GO:0031506 cell wall glycoprotein
      biosynthetic process
    url: https://github.com/geneontology/go-annotation/issues/5824
    relevance: 4
    method: haiku
    rationale: Substantial discussion of whether pre-composed terms like 'cell wall mannoprotein biosynthetic process' should
      be replaced by co-annotation to separate process terms or by subclasses, and whether an MF-linked BP can carry a 'involved
      in' label. This addresses a general practice for a class of terms.
  - id: issue:5840
    title: "GO:0102306\t benzil reductase [(S)-benzoin-forming] activity IEA with ARBA00085615"
    url: https://github.com/geneontology/go-annotation/issues/5840
    relevance: 4
    method: haiku
    rationale: Debates whether to annotate enzyme activity to a non-physiological (synthetic) substrate even when Rhea/EC
      support it, concluding that physiological relevance matters and moving annotations up a level. Establishes a general
      practice for enzyme and transporter substrates.
  - id: issue:5845
    title: 'Incorrect Rhea mapping: ??'
    url: https://github.com/geneontology/go-annotation/issues/5845
    relevance: 4
    method: haiku
    rationale: Discusses whether a secondary activity measured only in overexpression at about 0.3 percent of the physiological
      rate should yield a GO annotation or mapping, and whether to annotate promiscuous activities that GO curators would
      normally skip. This is a general practice question for measured but minor activities.
  - id: issue:5902
    title: "GO:0006139\t nucleobase-containing compound metabolic process IEA with ARBA00026572"
    url: https://github.com/geneontology/go-annotation/issues/5902
    relevance: 4
    method: haiku
    rationale: Proposes do-not-annotate flags for very broad metabolic process terms that receive tens of thousands of ARBA
      IEA annotations, arguing they are not useful when only a few experimental annotations exist. This addresses a general
      policy for over-general terms.
  - id: issue:6018
    title: 'ARBA: Annotations to vacuolar carboxypeptidase'
    url: https://github.com/geneontology/go-annotation/issues/6018
    relevance: 4
    method: haiku
    rationale: Traces odd ARBA-driven annotations for vacuolar carboxypeptidase to a single mouse IMP paper spread by FunFam
      and Panther propagation, and proposes tightening FunFam rules to MF only and obsoleting an 'amide catabolic process'
      grouping term. Establishes general propagation practice across a class of over-propagation.
  - id: issue:6062
    title: Review annotations to specific aa metabolic process terms
    url: https://github.com/geneontology/go-annotation/issues/6062
    relevance: 4
    method: haiku
    rationale: Proposes replacing obsolete specific amino acid metabolic process terms with biosynthetic or catabolic terms,
      and raises general questions about where enzymes like NAGS, ω-amidase and MTRR-type methionine synthesis should be captured.
      Addresses how a class of metabolic terms should be annotated.
  - id: issue:613
    title: IPR000994
    url: https://github.com/geneontology/go-annotation/issues/613
    relevance: 4
    method: haiku
    rationale: Substantial discussion of whether IEA root-node annotations (cellular process) should be made from InterPro
      mappings and when ND may be used, reaching a general curator practice applicable beyond this one domain.
  - id: issue:614
    title: EBI:KW-0133 (cell shape)
    url: https://github.com/geneontology/go-annotation/issues/614
    relevance: 4
    method: haiku
    rationale: Establishes that a mutant cell-shape phenotype does not justify a 'regulation of' term, since regulation requires
      a role in determining the process; this is a general practice for regulation annotations.
  - id: issue:615
    title: KW-0687 ribonucleoprotein complex
    url: https://github.com/geneontology/go-annotation/issues/615
    relevance: 4
    method: haiku
    rationale: Debates whether overly broad IEA annotations to ribonucleoprotein complex should be kept, reaching a general
      decision that correct but uninformative electronic annotations are retained and filtering is a browser concern.
  - id: issue:6183
    title: x involved in y with annotations
    url: https://github.com/geneontology/go-annotation/issues/6183
    relevance: 4
    method: haiku
    rationale: 'Settles a practice for obsoleting involved-in-immune-response terms: replace with the parent and move annotations
      upward, not extensions. This is a general convention for a class of terms.'
  - id: issue:6196
    title: flavin adenine dinucleotide binding (GO:0050660) annotation to covalently flavinylated Dmgdh
    url: https://github.com/geneontology/go-annotation/issues/6196
    relevance: 4
    method: haiku
    rationale: Establishes that covalent flavinylation should not be captured by FAD binding or protein flavinylation processes,
      and that cofactor biosynthesis targets model the causal link. Generalises to how binding MF terms from cofactor chemistry
      should be handled.
  - id: issue:6279
    title: 'InterPro2GO issue: A0A0D4BT04 and A0A0D4BT98 should not be annotated to microfibril (InterPro:IPR008673)'
    url: https://github.com/geneontology/go-annotation/issues/6279
    relevance: 4
    method: haiku
    rationale: Sets the practice that a homologous-superfamily InterPro2GO mapping must not add GO terms to members lacking
      the activity, and the mapping is removed. This is a general rule for superfamily-based propagation.
  - id: issue:6310
    title: GO-CAM annotation reviews for MF occurs in protein-containing complex
    url: https://github.com/geneontology/go-annotation/issues/6310
    relevance: 4
    method: haiku
    rationale: Sets the convention that a molecule should be part_of a complex rather than MF occurs_in a protein-containing
      complex, and discusses using supramolecular complex and kinetochore as locations. Applies generally across GO-CAM models.
  - id: issue:6331
    title: "InterPro2GO issue: GO:0006801\t superoxide metabolic process IEA with IPR036423\tGO_REF:0000002"
    url: https://github.com/geneontology/go-annotation/issues/6331
    relevance: 4
    method: haiku
    rationale: Establishes that a homologous-superfamily InterPro2GO mapping should not carry a GO term when some members
      lack the activity, and that the mapping should be removed and a Pfam entry added. Generalises the superfamily propagation
      rule.
  - id: issue:6333
    title: 'ARBA2GO issue: GO:0048468 | cell development | IEA with ARBA00028665'
    url: https://github.com/geneontology/go-annotation/issues/6333
    relevance: 4
    method: haiku
    rationale: Proposes a do-not-annotate flag for a generic ARBA target term (cellular developmental process) and discusses
      taxon restrictions for ARBA rules. Shows a general convention for over-general ARBA targets.
  - id: issue:6357
    title: Consistency of SDHA/SDH1 MF annotations
    url: https://github.com/geneontology/go-annotation/issues/6357
    relevance: 4
    method: haiku
    rationale: Concludes that complex subunits should contribute to the complex enzyme activity rather than to individual
      substeps, and discusses enables versus contributes to. Sets a general convention for complex-subunit MF annotation.
  - id: issue:6393
    title: Review mouse annotations under "neuroblast proliferation"
    url: https://github.com/geneontology/go-annotation/issues/6393
    relevance: 4
    method: haiku
    rationale: Substantial discussion of how to annotate neuroblast terms across fly and vertebrate usage, proposing separation
      of division and differentiation branches and taxon-specific term naming, which is a general term-structure convention.
  - id: issue:6401
    title: 'Obsoletion with replacement: children of peroxisome matrix targeting signal binding'
    url: https://github.com/geneontology/go-annotation/issues/6401
    relevance: 4
    method: haiku
    rationale: Records a decision to obsolete a class of signal-sequence binding terms and replace them with their parent
      because the exact signal sequence is beyond GO scope; this states a general granularity principle for a term class.
  - id: issue:6466
    title: 'PAINT issue: PTN004364609 GO:0008320 | transmembrane protein transporter activity  for Tom40'
    url: https://github.com/geneontology/go-annotation/issues/6466
    relevance: 4
    method: haiku
    rationale: Records a modelling convention agreed in GO-CAM discussion that complex subunits such as TOM components are
      broken down into their own MFs rather than given contributes_to for the transport activity; a general practice for complex
      members.
  - id: issue:6468
    title: Evidence query MGI | O75629
    url: https://github.com/geneontology/go-annotation/issues/6468
    relevance: 4
    method: haiku
    rationale: Settles that overexpression or knockdown experiments assessing molecular function can be IDA, while biological
      process claims from gain- and loss-of-function genetics should be IMP, and the curators agree to clarify the IMP and
      IDA wiki pages. This is a general evidence-code decision that the guidelines were unclear on.
  - id: issue:6484
    title: Review annotations to GO:1903608 protein localization to cytoplasmic stress granule
    url: https://github.com/geneontology/go-annotation/issues/6484
    relevance: 4
    method: haiku
    rationale: Records a class-level decision that co-localisation or stress-granule component evidence cannot support an
      involved_in process term and should become located_in, applying across eight annotations to an obsoleted localisation-process
      term.
  - id: issue:6507
    title: 'PAINT issue: Deepen annotations to GO:0000027 | ribosomal large subunit assembly |'
    url: https://github.com/geneontology/go-annotation/issues/6507
    relevance: 4
    method: haiku
    rationale: Discussion establishes that PAINT must keep a general parent term to allow propagation across horizontal gene
      transfer from bacteria, so mitochondrial-specific terms are not propagated to bacterial sequences; a general practice
      for PAINT nodes.
  - id: issue:6512
    title: 'Annotation review: EXP annotations to GO:1903747, GO:1903748, GO:1903749 (regulation of protein localization to
      mitochondrion)'
    url: https://github.com/geneontology/go-annotation/issues/6512
    relevance: 4
    method: haiku
    rationale: 'Sets out guidance for re-annotating EXP annotations away from obsoleted regulation-of-mitochondrial-protein-localisation
      terms: regulate the actual process, or remove readouts and phenotypes. This is a general re-annotation practice for
      an obsoleted term class.'
  - id: issue:6525
    title: Review annotations to AA activation terms (with replacement)
    url: https://github.com/geneontology/go-annotation/issues/6525
    relevance: 4
    method: haiku
    rationale: Establishes that compartment is not a molecular-function distinction so cytosolic and mitochondrial tRNA ligase
      activities take one MF annotation, and gives a 1:1 BP-to-MF obsoletion mapping with one stated exception; applies to
      a whole term class.
  - id: issue:6528
    title: Review annotations to GO:0043041 amino acid activation for nonribosomal peptide biosynthetic process and GO:0043042
      amino acid adenylylation by nonribosomal peptide synthase
    url: https://github.com/geneontology/go-annotation/issues/6528
    relevance: 4
    method: haiku
    rationale: Decides that BP-in-MF terms for amino acid activation for NRPS should be obsoleted onto a single MF with no
      replaced_by because BP to MF is not valid, and corrects references after full-text reading; a general pattern for MF-in-BP
      terms.
  - id: issue:6570
    title: 'ARBA2GO issue:  14-3-3 protein binding (GO:0071889)'
    url: https://github.com/geneontology/go-annotation/issues/6570
    relevance: 4
    method: haiku
    rationale: States a policy that IEA annotations should not be made to binding terms and requests that the whole 14-3-3
      binding branch be blocked from ARBA annotation, a general rule for binding-term propagation.
  - id: issue:6625
    title: Review annotations to GO:0097734 extracellular exosome biogenesis, GO:0071971 extracellular exosome assembly, GO:0140112
      extracellular vesicle biogenesis and related terms
    url: https://github.com/geneontology/go-annotation/issues/6625
    relevance: 4
    method: haiku
    rationale: Records a class-level decision to obsolete exosome biogenesis and assembly terms and to replace them with secretion
      or vesicle budding terms according to what each paper shows, giving a general replacement principle for an obsoleted
      term class.
  - id: issue:6645
    title: Review annotations to 13 planar polarity terms (go-ontology#32697)
    url: https://github.com/geneontology/go-annotation/issues/6645
    relevance: 4
    method: haiku
    rationale: Records the consortium decision to obsolete 13 compound planar-polarity terms because developmental or location
      context is better captured by GO-CAM or annotation extensions; a general practice for compound context terms.
  - id: issue:735
    title: definition vs intended use of GO:0030170
    url: https://github.com/geneontology/go-annotation/issues/735
    relevance: 4
    method: haiku
    rationale: Substantial discussion of whether GO should annotate covalent cofactor binding and whether the vitamin-binding
      definition should change, reaching a general position that physical features of a protein are not GO annotations.
  - id: issue:758
    title: 'taxon violation: GO:0051289 "protein homotetramerization"'
    url: https://github.com/geneontology/go-annotation/issues/758
    relevance: 4
    method: haiku
    rationale: Argues that basic protein-property terms such as homotetramerization should not carry taxon restrictions, and
      that inherited restrictions from parent terms should be removed; a general principle for taxon-constraint practice.
  - id: issue:761
    title: 'taxon violation: GO:0032259 " methylation"'
    url: https://github.com/geneontology/go-annotation/issues/761
    relevance: 4
    method: haiku
    rationale: 'Explains that a taxon violation for methylation is an ontology-structure problem: a generic term plus a cellular
      child is needed so only the cellular term sits under cellular process. This is a reusable principle for the taxon-rule
      and graph design.'
  - id: issue:764
    title: 'problem with taxon rule for GO:0052085 '
    url: https://github.com/geneontology/go-annotation/issues/764
    relevance: 4
    method: haiku
    rationale: Records a decision to remove the cellular-organisms taxon restriction from several viral-relevant high-level
      terms (response to stimulus, cellular process, localization, developmental process) because viruses also do these; a
      class-level policy outcome.
  - id: issue:765
    title: GO:0006487 is ambiguous
    url: https://github.com/geneontology/go-annotation/issues/765
    relevance: 4
    method: opus
    rationale: Case on GO:0006487 N-linked glycosylation annotated to glycosylated proteins; the reply states the principle
      that a BP annotation asserts participation in the process and annotating targets of a process is erroneous. The principle
      is general and current, but it appears as a comment in an error report (2010), not as a guideline, so 4.
  - id: issue:783
    title: DPAGT1 is GO:0031227 or GO:0005789, not GO:0016021
    url: https://github.com/geneontology/go-annotation/issues/783
    relevance: 4
    method: haiku
    rationale: Clarifies the GO definition of integral to membrane (GO:0016021, any membrane) versus plasma membrane, and
      states that a specific ER membrane annotation requires published experimental evidence on the human protein; a reusable
      policy on evidence and term choice.
  - id: issue:800
    title: InterPro:IPR001373
    url: https://github.com/geneontology/go-annotation/issues/800
    relevance: 4
    method: haiku
    rationale: Establishes that InterPro entries typed as domains map only to the domain-specific function and not the whole
      protein, and corrects the APC2 cullin-RING parent. A stated mapping guideline that generalises beyond this case.
  - id: issue:803
    title: InterPro:IPR006855
    url: https://github.com/geneontology/go-annotation/issues/803
    relevance: 4
    method: haiku
    rationale: Debates whether InterPro-to-GO mappings should include terms that apply to only some matched family members;
      the consortium view is that mappings must always be true and a major rule change needs consortium consultation. A general
      mapping-policy discussion.
  - id: issue:82
    title: IPR001930 -> proteolysis and peptidolysis
    url: https://github.com/geneontology/go-annotation/issues/82
    relevance: 4
    method: haiku
    rationale: Settles that the proteolysis definition covers hydrolysis of peptide bonds without requiring destruction, so
      peptidases can map to proteolysis and peptidolysis. Establishes a general mapping practice for all peptidases.
  - id: issue:832
    title: SP kW-0811 via matrix
    url: https://github.com/geneontology/go-annotation/issues/832
    relevance: 4
    method: haiku
    rationale: Discusses the meaning of translocation versus transport and whether nuclear pore complex transport should be
      mapped to protein transmembrane transport; the curators set out a convention that translocation implies crossing a membrane
      or monolayer, a reusable term-usage principle.
  - id: issue:877
    title: muscle atrophy ; GO:0014889
    url: https://github.com/geneontology/go-annotation/issues/877
    relevance: 4
    method: haiku
    rationale: Records the rule that the muscle atrophy term (GO:0014889) is only for atrophy as a normal physiological process,
      not disease, and removes disease-state and indirect annotations accordingly; a class-level term-use policy.
  - id: issue:9
    title: question on GO:0030254
    url: https://github.com/geneontology/go-annotation/issues/9
    relevance: 4
    method: opus
    rationale: 2004 question on type III secretion system; the answer states that BP terms are used only for gene products
      that actively participate, not for those transported or acted upon, and internal-only annotations must be excluded from
      GO submissions. Core participation principle stated in a reply; closed as postponed and superseded by later meetings,
      so 4.
  - id: issue:924
    title: colmn 16 post compose or precompose ?
    url: https://github.com/geneontology/go-annotation/issues/924
    relevance: 4
    method: opus
    rationale: 'Records a group decision to request precomposed ''X involved in Y'' terms when they can be defined, otherwise
      post-compose with the ''during'' extension (example: ascospore wall assembly during(response to stress)). Decision noted
      in a case thread, closed out-of-date; GO has since moved away from precomposed ''involved in'' terms, so the guidance
      is outdated; 4.'
  - id: issue:943
    title: ChIP annotation? DNA sequence-specific chromatin binding
    url: https://github.com/geneontology/go-annotation/issues/943
    relevance: 4
    method: opus
    rationale: Discussion concluding that ChIP evidence cannot support MF DNA- or chromatin-binding terms (binding may be
      indirect); the acceptable annotation is to CC 'chromatin' (or child) with an SO term in the extension, recorded on the
      ChIP consistency wiki page in 2014. The convention is general but established in an issue thread with an open follow-up
      question, so 4; the wiki page is legacy.
  - id: issue:964
    title: Interpro:IPR020966
    url: https://github.com/geneontology/go-annotation/issues/964
    relevance: 4
    method: haiku
    rationale: Records the decision that response-to terms such as response to aluminium ion are unsafe in InterPro mappings
      unless mechanistic detail exists, and that GO fission yeast annotation would use phenotypes instead; a general policy
      on response-to terms.
  - id: issue:980
    title: SP_KW:KW-0313 glucose metabolism
    url: https://github.com/geneontology/go-annotation/issues/980
    relevance: 4
    method: haiku
    rationale: Discussion of whether UniProt keyword mappings that lack GO granularity (glucose metabolism vs regulation of
      glucose metabolism) should be kept; the group settles on erring toward incompleteness for KW2GO mappings and relying
      on manual curation, a general practice for all KW-derived annotations.
  - id: issue:991
    title: 'Children of GO:0006916 anti-apoptosis: re-house annotations'
    url: https://github.com/geneontology/go-annotation/issues/991
    relevance: 4
    method: haiku
    rationale: Obsoletion of ill-defined regulation-of-anti-apoptosis children with explicit re-mapping advice (use apoptotic
      process terms, do not map to induction of apoptosis); sets practice for re-housing annotations away from ill-defined
      regulation terms of a class.
  - id: issue:995
    title: GO:0008624 induction of apoptosis by extracellular signal
    url: https://github.com/geneontology/go-annotation/issues/995
    relevance: 4
    method: haiku
    rationale: Guidance for re-housing annotations from the obsoleting term GO:0008624 to intrinsic versus extrinsic apoptotic
      signalling terms by the type of extracellular signal, with definitions and examples; applies to the whole class of induction-type
      terms.
  go-annotation-repo-files: []
  go-drive:
  - id: drive:Annotation/Annotation Reviews/Review - Protein oligomerization/Protein oligomerization obsoletion - proposal.docx
    title: Protein oligomerization obsoletion - proposal.docx
    url: https://drive.google.com/open?id=1JxzNwl1fr5Fj-IJy_Fo1lLfAlAQB8IxPDwwYKxIXBZo
    relevance: 5
    method: opus
    rationale: Proposal to obsolete the protein (homo/hetero)oligomerization BP and MF terms, with explicit annotation rules
      for the whole class of terms. A gene product that mediates assembly goes to protein-containing complex assembly (GO:0065003)
      with a has_output complex extension. Assembled subunits instead get the CC complex term or a structural or bridging
      MF, and the annotation is removed if nothing fits. It is labelled a proposal, but it sets class-wide guidance (the terms
      were later obsoleted), so 5 stands.
  - id: drive:Annotation/Annotation guidelines/Annotation relations - Guidelines for P2GO.xlsx
    title: Annotation relations - Guidelines for P2GO.xlsx
    url: https://drive.google.com/open?id=1DXdjAuNf7u8CKXYlgW5kyzPgq7vnp-Aai0S5Sh63guc
    relevance: 5
    method: opus
    rationale: Usage table for every gene-product-to-term relation. contributes_to is only for irreducible complex activities;
      acts upstream of (or within) and its positive/negative children cover BP roles whose mechanism is unknown; is_active_in
      and located_in are used for CC. Complex membership must be part_of, and non-members get protein-containing complex binding
      instead. colocalizes_with is marked deprecated. It is current, direct curator guidance.
  - id: drive:Annotation/Annotation guidelines/Use of relations for GO annotation - GP2term and extensions.pptx
    title: Use of relations for GO annotation - GP2term and extensions.pptx
    url: https://drive.google.com/open?id=128U6g91Iv2ej9pcgTSGOowbhjp4GwGXmE4gDTiue1Cc
    relevance: 5
    method: opus
    rationale: 'Training deck from September 2021 on GP2term relations: the defaults for each aspect, when to use contributes_to,
      involved_in versus acts upstream of (or within), and is_active_in versus located_in. It also covers annotation extensions
      (has_input, has_output, occurs_in) and when to add them. It is current guidance stated directly.'
  - id: drive:Documentation/Best Practices for predicting GO data .docx
    title: Best Practices for predicting GO data .docx
    url: https://drive.google.com/open?id=1z-6rNJ4tg3M-Ant-2kqDXohPZUlkw9GEZ5qlNZDYj18
    relevance: 5
    method: opus
    rationale: 'Guidelines for external groups that publish GO predictions: use authoritative GO/GOA data and the latest ontology
      release; avoid obsolete, do-not-annotate and obsoletion-candidate terms; use the precise relations (enables, involved_in,
      is_active_in); respect taxon constraints and NOT annotations; avoid redundant predictions to ancestor terms. It is a
      draft with comments and unfilled sections (''Add section'') of what became the GO website page /docs/guidelines-external/.
      It states the guidance directly, so 5 stands; the published web page is the canonical version.'
  - id: drive:GO-CAM and Noctua/GO-CAM modeling guidelines.docx
    title: GO-CAM modeling guidelines.docx
    url: https://drive.google.com/open?id=1DS2ObQc1EVcQKAHjKNt-0jzFCSSVLDQ4Osm-1dsTwdA
    relevance: 5
    method: opus
    rationale: 'Core GO-CAM modelling rules. Activities are the nodes, and each activity has one location and one part_of
      BP. has_input names the target. Choose the most specific causal relation: causally upstream of, then provides input
      for, then regulates, then directly regulates. ''Regulates'' requires a known control mechanism, and a gene product gets
      a separate activity node only when the term, target, location, process or timing differs. It states the convention directly,
      though open reviewer comments show it was still being refined.'
  - id: drive:GO-CAM and Noctua/GO-CAM specifications/Copy of MF guidelines for GO-CAM.docx
    title: Copy of MF guidelines for GO-CAM.docx
    url: https://drive.google.com/open?id=1DWvc_g5yH4S8-Tc2rPtaAyPOIkYzITagK1sXysj0CY4
    relevance: 5
    method: opus
    rationale: GO-CAM activity-unit guidelines for signaling receptors, coreceptors and molecular adaptors. A ligand has_input
      its receptor, never the reverse, and directly positively regulates the receptor. The receptor's input is its effector,
      not its ligand. A small-molecule ligand is linked with is small molecule activator/inhibitor. It is current, reviewed
      guidance with a revision history. It is a 'Copy of', so the original 'MF guidelines for GO-CAM' document is the canonical
      copy; the WIP Standard annotation guidelines are an earlier draft of the same content.
  - id: drive:GO-CAM and Noctua/GO-CAM specifications/GO-CAM Curation Documentation.docx
    title: GO-CAM Curation Documentation.docx
    url: https://drive.google.com/open?id=18ihslb7prB6CWtu2yjF-pMHZBTY1-AdXJAu-ZyuyXS4
    relevance: 5
    method: opus
    rationale: GO-CAM curation guide covering the activity as the primary modelling unit, activity units, evidence on each
      relation, GO term granularity, avoiding redundancy with extensions, handling protein binding, and GO-ECO mappings. It
      is established curator documentation for building and reviewing models.
  - id: drive:GO-CAM and Noctua/Noctua_Development/Noctua Visual Pathway Editor - VPE/New Causal Relations Decision Tree for
      VPE.pptx
    title: New Causal Relations Decision Tree for VPE.pptx
    url: https://drive.google.com/open?id=1ODFtV2aEeUeOUDs8dupre-3hUJchLFMMu-kChPKR1Oc
    relevance: 5
    method: opus
    rationale: Curator-agreed decision tree (2022-12-20) for choosing a GO-CAM causal relation between two activities. First
      pick the relationship type (regulation, provides input for, constitutively upstream, removes input for, undetermined),
      then the direction of effect, then directness, which yields a specific RO relation. It is current guidance and the adopted
      outcome of the 2022 causal relations review.
  - id: drive:GOC Meetings/2016-11 - GOC USC/UCL_Expression_Transcription_Decision_Tree_2016.pptx
    title: UCL_Expression_Transcription_Decision_Tree_2016.pptx
    url: https://drive.google.com/open?id=0B_c5g4FezmhfSzV5OERKcHJ1MUk
    relevance: 5
    method: opus
    rationale: UCL (Huntley and Kramarz) decision tree for annotating gene products that regulate gene expression or transcription.
      It routes by assay type (reporter assay, nuclear run-on, mRNA levels) and by evidence of sequence-specific DNA binding
      to BP or MF transcription terms with their extensions. It states the guidance directly. It is the 2016 version, superseded
      by the 2017 TranscriptionProgress revision, and some terms (nuclear chromatin, the old TF activity terms) are now obsolete.
  - id: drive:GOC Meetings/2017-06 - GOC Corvalis/TranscriptionProgress.pptx
    title: TranscriptionProgress.pptx
    url: https://drive.google.com/open?id=0B_c5g4FezmhfNENjNk5RbjJwQUk
    relevance: 5
    method: opus
    rationale: Transcription working-group guidelines, 2017 revision. Use regulation of gene expression when the only evidence
      is a change in mRNA levels, and regulation of RNA Pol II transcription only when there is evidence of transcriptional
      regulation. A full decision tree maps assay type, DNA-binding evidence and ChIP evidence to six annotation patterns
      (has_direct_input, contributes_to, coincident_with); it does not apply to histones or signaling molecules. It states
      adopted guidance, though some of its terms and relations are now outdated. Duplicate of the .pptx.pptx copy with the
      same score; this file, with slide numbering, is the canonical copy.
  - id: drive:GOC Meetings/2017-06 - GOC Corvalis/TranscriptionProgress.pptx.pptx
    title: TranscriptionProgress.pptx.pptx
    url: https://drive.google.com/open?id=1C5DPbCHhvS8wJF8-xk4fh4jl9NF0GAtxTVBJgB4GUK4
    relevance: 5
    method: opus
    rationale: Duplicate of TranscriptionProgress.pptx with the same 2017 transcription guidelines and decision tree (regulation
      of gene expression versus regulation of RNA Pol II transcription by assay type and DNA-binding evidence, with extension
      patterns). It gets the same score as its twin. The single .pptx is the canonical copy, and parts of the content are
      dated.
  - id: drive:GOC Meetings/2017-10 - GOC Cambridge/Annotation_best_practices-Gaudet.pdf
    title: Annotation_best_practices-Gaudet.pdf
    url: https://drive.google.com/open?id=0B8fqtupTOdsSWXlvOFZxWTNwSkk
    relevance: 5
    method: opus
    rationale: 'Gaudet''s talk on best practice for literature-based GO annotation: what an annotation asserts (the normal
      in vivo role), focusing on the research hypothesis, and annotating the conclusion rather than the assay, with worked
      examples (DDFB, FOXL2). It is foundational practice guidance, and the talk is based on the published best-practice paper.'
  - id: drive:GOC Meetings/2020 - GO-CAM Jamboree/Regulation Notes.docx
    title: Regulation Notes.docx
    url: https://drive.google.com/open?id=1mAIocbi6UvG_zbfCrWOUrneia3vl2XkjVPM39tmSx40
    relevance: 5
    method: opus
    rationale: 'Documented GO-CAM convention (2020 Jamboree) on when to use ''regulates'' between two MFs: successive activities
      with direct state change (MAPKK->MAPK), binding that activates a downstream activity of the same product, and specificity
      factors controlling gene expression (TFs, miRNAs); and when not to (trafficking-related PTM enzymes). A guideline document
      stating rules directly; current as GO-CAM practice.'
  - id: drive:GOC Meetings/2020-05 GOC - Paris Virtual/2021-05 - GOC Presentations/Contributes_to.pptx
    title: Contributes_to.pptx
    url: https://drive.google.com/open?id=1g-2M8XQuINGN6eKVT0Sqm1OsudF_kM2D4jemv-izTks
    relevance: 5
    method: opus
    rationale: Complex working group deck (2020) establishing that MF goes to the subunit that performs it, non-participating
      subunits are not given contributes_to, and contributes_to is reserved for irreducible molecular machines (shared active
      site, ATP synthase, complex II, heteromeric channels), with Paul Thomas's post-meeting summary of the rule. A proposal
      deck whose rule was adopted in the Contributes_to wiki guideline; partly refined by the 2025 GO-CAM complex rules.
  - id: drive:GOC Meetings/2025-05 GOC meeting/Monday GO-CAM workshop/GO-CAM guidelines.pptx
    title: GO-CAM guidelines.pptx
    url: https://drive.google.com/open?id=1vF8JCnUM_JqkxgAvVHHl6ntyXpk3tY4y_NAjRjZ3WJE
    relevance: 5
    method: opus
    rationale: 'Current (2025) consortium rules for annotating protein-containing complexes in GO-CAM: assign MFs to individual
      subunits in a causal flow, use the complex as enabler with ''has part'' for emergent activities, complex as enabler
      without parts when the active subunit is unknown, and the GPAD export mapping to enables/contributes_to. A guideline
      document stating explicit rules.'
  - id: drive:OLD LEGACY DRIVE FILES -- WARNING/Chris Unorganized/Documentation/Best Practices for predicting GO data .docx
    title: Best Practices for predicting GO data .docx
    url: https://drive.google.com/open?id=1z-6rNJ4tg3M-Ant-2kqDXohPZUlkw9GEZ5qlNZDYj18
    relevance: 5
    method: opus
    rationale: 'Guideline for external resources predicting GO annotations: use current ontology, avoid obsolete/do-not-annotate
      terms, use precise relations (enables, involved_in, is_active_in; contributes_to rarely), respect taxon constraints,
      no ''regulation of'' for process participants, respect NOT annotations, keep a blocklist (exosome, apoptosis), do not
      exclude IEA/IBA in evaluation. Draft with placeholder sections and comment threads in the OLD LEGACY folder; the canonical
      version is the published geneontology.org /docs/guidelines-external/ page.'
  - id: drive:OLD LEGACY DRIVE FILES -- WARNING/Chris Unorganized/old-GOC-minutes/evCode-proposals.doc
    title: evCode-proposals.doc
    url: https://drive.google.com/open?id=12ksXkxcceb_IVRxejxC0DOSU9Wt7Bk70
    relevance: 5
    method: opus
    rationale: 'Evidence Code Proposals draft (Jan 2007 Cambridge GOC) defining how IMP, IGI, IDA, IPI and other codes are
      applied: evidence codes are not quality measures, author intent decides IMP vs IDA for transfection, with-field semantics
      for IGI. A guideline document, archived and superseded by current GO/ECO evidence-code documentation.'
  - id: drive:OLD LEGACY DRIVE FILES -- WARNING/Chris Unorganized/old-GOC-minutes/evCode-summary.doc
    title: evCode-summary.doc
    url: https://drive.google.com/open?id=1qZm_e_wnfu_yUAg7qbwrJpYwyRRNqD_7
    relevance: 5
    method: opus
    rationale: 'Summary of the 2007 evidence-code documentation changes: codes are not quality indicators, grouping into experimental/computational/author/curator,
      IMP vs IDA by author intent, TAS narrowed to cited statements, retreat from the 2006 ISS ''with'' restriction, RCA spot-checking,
      IGC added. Records consortium decisions directly; archived and superseded by current docs.'
  - id: drive:OLD LEGACY DRIVE FILES -- WARNING/LEGACY Gene Ontology/Annotation-FROZEN_ Sabrina, Kimberly, Dustin, Helen,
      GO, Penelope, Giulia/HTP_WorkingGroup-Helen/HTP_Guidelines_condensed_version.docx
    title: HTP_Guidelines_condensed_version.docx
    url: https://drive.google.com/open?id=19DNZL21UDZWT9Q1NKocpl8XUIEQtH-25
    relevance: 5
    method: opus
    rationale: 'Condensed GO guideline for annotating high-throughput data: HTP/HMP/HGI/HDA/HEP codes mapped to LTP equivalents,
      the same quality standard as LTP (most HTP papers should not be annotated, curators may decline unreliable sets), never
      annotate primary RNAi screens, and proteomics/localization guidance. A guideline document in a FROZEN legacy folder;
      the published GO HTP documentation is the canonical version.'
  - id: drive:OLD LEGACY DRIVE FILES -- WARNING/LEGACY Gene Ontology/Annotation-FROZEN_ Sabrina, Kimberly, Dustin, Helen,
      GO, Penelope, Giulia/HTP_WorkingGroup-Helen/Paper_biocuration/HTP_paper_draft.docx
    title: HTP_paper_draft.docx
    url: https://drive.google.com/open?id=1AponRUpFx9mPAdVOpsRdklxOvjAaPPc4
    relevance: 5
    method: opus
    rationale: 'Draft of the consortium paper ''Annotation of high throughput data using the Gene Ontology'' (Attrill et al.),
      setting out the HTP annotation framework: HTP evidence codes, false-positive handling, quality criteria for when HTP
      studies may be annotated. An annotation-method paper; this is a legacy draft, and the published Database 2019 paper
      is the canonical version.'
  - id: drive:Ontology/Multiorganisms/Multi-species terms - documentation to review.docx
    title: Multi-species terms - documentation to review.docx
    url: https://drive.google.com/open?id=12_2bJFup0Wn9TVYlysfbxFz8YERibJ4OXDB8GRowueU
    relevance: 5
    method: opus
    rationale: 'Wiki-derived documentation of multi-species process annotation: request terms in the multi-organism node rather
      than annotating host processes directly, direction-explicit term names, two-taxon taxon column, host = larger and symbiont
      = smaller organism, standard definition templates, worked examples. Marked ''TO BE REVIEWED'' and out of date, since
      the multi-organism process node was later refactored and obsoleted; content is guideline-level, so 5 with that caveat.'
  - id: drive:Ontology/Signaling_Modules/Intracellular_Signaling_Guidelines.docx
    title: Intracellular_Signaling_Guidelines.docx
    url: https://drive.google.com/open?id=1ukxL3vKfLbV4NAiGSeGg3EbpLKijfXXOr0npHeUYLI4
    relevance: 5
    method: opus
    rationale: 'Draft guideline defining intracellular signaling cassettes (start/end set by the first activated component),
      with annotation rules: members annotated to both cassette and pathway, cassette part_of pathway, ligand/receptor/upstream
      components to ''positive regulation of'' the cassette, downstream targets not annotated to the cassette; per-cassette
      scope notes (SMAD, PI3K/PKB, NF-kB, NO-cGMP). Status: current draft with open comments; it states policy directly, so
      it stays at 5.'
  - id: drive:Outreach/Presentations - introduction to GO (training materials)/2017-09-12_BC2-Gaudet-2.pptx
    title: 2017-09-12_BC2-Gaudet-2.pptx
    url: https://drive.google.com/open?id=1m9v6KbdXs32ihzMjqGJYQpuK1Qf49Gh-
    relevance: 5
    method: opus
    rationale: '2017 GOC training talk stating literature-curation best practices: annotate the conclusion not the assay (e.g.
      rubidium vs potassium, histone as a non-physiological kinase substrate), interpret results against the research hypothesis,
      curate gene-by-gene rather than paper-by-paper, beware indirect phenotypes, and the ''GO commandments'' on consistency
      and removing obsolete annotations. Status: older training material derived from the GO Handbook chapter but still consistent
      with current practice. It is an earlier, shorter version of the 2017-10_02 deck, which is the fuller canonical copy.'
  - id: drive:Outreach/Presentations - introduction to GO (training materials)/2017-10_02 GOC_annotation_best_practices-Gaudet.pptx
    title: 2017-10_02 GOC_annotation_best_practices-Gaudet.pptx
    url: https://drive.google.com/open?id=1gprg-s8gU070iiWD3QbpazOsuEf8Tjhd
    relevance: 5
    method: opus
    rationale: 'GOC curator training deck on literature-based annotation best practice: annotate the conclusion not the assay,
      focus on the research hypothesis, phenotype relevance (no IMP to a process without cellular or molecular support, e.g.
      Tmem234), gene-by-gene curation, removing annotations based on invalidated hypotheses, membrane-part CC conventions,
      and QC approaches (consistency exercises, taxon constraints, co-occurrence). Status: 2017 training material, still consistent
      with current guidance. This is the fuller canonical version of the BC2 deck.'
  - id: drive:Papers and presentations/nature accepted version.docx
    title: nature accepted version.docx
    url: https://drive.google.com/open?id=1ZIYCORgZUGSCTsA_QvKde7HV0UxPbFQQtK9BqImvGXg
    relevance: 5
    method: opus
    rationale: 'Accepted manuscript of the PAN-GO paper (Feuermann et al., ''A compendium of human gene functions derived
      from evolutionary modeling''). It describes the PAINT explicit evolutionary-modelling method: review all experimental
      GO evidence across a PANTHER family tree, select maximally informative non-redundant terms, and place gain and loss
      of each function on tree branches to produce IBA annotations. It is an annotation-method paper establishing how IBAs
      are made. Status: accepted version; the published Nature article is the canonical source, and this docx and the PDF
      item are copies of the same manuscript.'
  - id: drive:Papers and presentations/nature accepted version.pdf
    title: nature accepted version.pdf
    url: https://drive.google.com/open?id=1orCHKRivACLddQTBQd3kJsF6MK3Z3X9V
    relevance: 5
    method: opus
    rationale: 'PDF copy of the same PAN-GO accepted manuscript as the .docx item. It describes the PAINT evolutionary-modelling
      method that is the basis of IBA annotations: family-wide evidence review, informative term selection, and explicit gain/loss
      placement on tree branches. It gets the same score as its duplicate; the published Nature article is the canonical version.'
  - id: drive:Working Groups/IEA WG - 2025-10/AI_GO_Predictions/Draft Working Group Policy Statement.docx
    title: Draft Working Group Policy Statement.docx
    url: https://drive.google.com/open?id=1leeuPb1WDgyORZHrxhapW9HKLTPrCi6xsMi-KaZNCIQ
    relevance: 5
    method: opus
    rationale: 'Draft IEA-WG policy: the GOC does not accept AI-generated annotations, except pre-approved datasets meeting
      benchmarks; all AI-assisted associations need manual review by a trained curator and must follow GO guidelines (with
      an experimental evidence code once reviewed). It lists nine failure modes as de facto annotation requirements: taxon
      constraints, paralog divergence, do-not-annotate terms, redundancy, legacy science, re-adding removed annotations, IEA
      training feedback loops. Status: working draft whose header says ''Check this instead / Ignore below'', apparently superseded
      by the ''Updating contributing new GO annotations'' text. It still states policy, so it stays at 5.'
  - id: drive:Working Groups/IEA WG - 2025-10/AI_GO_Predictions/Updating contributing new GO annotations.docx
    title: Updating contributing new GO annotations.docx
    url: https://drive.google.com/open?id=1ELFV19lLbGGDtvw-BZrqo4cT7xgaUFJ4eOd2K-tjvcs
    relevance: 5
    method: opus
    rationale: 'Replacement text for the geneontology.org ''contributing to GO'' page: the same evidence standards apply to
      every annotation set, no unsolicited sets are accepted, contributors must maintain their sets, large-scale or LLM-derived
      sets are only considered under a pre-agreed framework with curator evaluation, and LLM-assisted associations must be
      manually reviewed and then get experimental codes. It also gives GAF 2.2 requirements (precise valid terms respecting
      taxon constraints, precise evidence code, GO rules). Status: current; the Fall 2026 WG deck reports this update as done.'
  - id: drive:Working Groups/IEA WG - 2025-10/GOcurators_KW2GOannouncement.pptx
    title: GOcurators_KW2GOannouncement.pptx
    url: https://drive.google.com/open?id=1QoTlEdEPLu5qteDKynRQsf0SiClWEJzNK3rjQgp23xk
    relevance: 5
    method: opus
    rationale: 'IEA working group decision to retire the UniProt KW2GO pipeline, scored against the WG rubric. Reasons: multi-hop
      provenance (ARBA to keyword to GO), keyword scope misaligned with GO (regulation vs process), high error rate, redundancy
      with Rhea2GO/PAINT/ARBA, and metal-ion ''binding'' cofactor terms that are not real MFs. It is a recorded consortium
      decision with rationale that applies to the whole class of keyword-derived IEAs. Status: decision implemented (kept
      only for viruses per the Fall 2026 deck).'
  - id: drive:Working Groups/IEA WG - 2025-10/IEA WG GOC meeting Fall 2026.pptx
    title: IEA WG GOC meeting Fall 2026.pptx
    url: https://drive.google.com/open?id=1cEmQivoBNbojaN6IjcDmQd74-VjEuYY4MmSMC2l1M9I
    relevance: 5
    method: opus
    rationale: 'IEA WG final report with per-pipeline decisions: KW2GO retired except for viruses; SubCell/Rhea/EC2GO replaced
      by direct mappings for Swiss-Prot and stopped for TrEMBL as multi-hop; UniPathway2GO retired; InterPro2GO, ARBA and
      UniRule kept and disputed. It also covers concerns about orthology mass transfer, a GO-compliance requirement for groups
      whose curation is mapped directly, and the protein-binding recommendation (stop the IntAct IPI import, mark top-level
      binding terms do-not-annotate). Status: current consortium recommendations and decisions.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/ARCHIVED - Signaling receptor activity .docx
    title: ARCHIVED - Signaling receptor activity .docx
    url: https://drive.google.com/open?id=1dZKucnM45V05MYJUkpuf3Epje6mZRxRv3-62Y5JwAHw
    relevance: 5
    method: opus
    rationale: 'GO-CAM guideline for signaling receptors. A protein ligand enables receptor ligand activity and has_input
      the receptor, not the reverse; the receptor has_input its effector, not its ligand; links are directly positively regulates.
      Small-molecule ligands are linked with ''is small molecule activator/inhibitor'', and coreceptors (coreceptor activity,
      e.g. IL2) are handled separately; it also notes how standard annotation differs. Status: archived, with content moved
      to the GO-CAM MF guidelines (reviewed 2026-03-10). The current canonical copy is in those guidelines, but the content
      is guideline text, so it stays at 5.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/Chromatin remodeling annotation guidelines.pptx
    title: Chromatin remodeling annotation guidelines.pptx
    url: https://drive.google.com/open?id=15fDBhmO54zSJms25aV5nX3kgSwsHMnWgdSuPdo-ukyw
    relevance: 5
    method: opus
    rationale: 'Curator guideline on chromatin terms: histone chaperone, modifier and reader MFs, a table mapping each histone
      mark to MF and BP terms, and the rule that short-term dynamic transcription regulation is not ''epigenetic regulation
      of gene expression'' without evidence of stability over cell divisions. It also says histones themselves go to chromatin
      organization rather than remodeling processes, since they are the targets, and lists expected proteins per BP. Status:
      archived; its slides say the content moved to a Google Doc, which is the canonical current copy.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/Transcription Factors Annotation Guidelines.docx
    title: Transcription Factors Annotation Guidelines.docx
    url: https://drive.google.com/open?id=1bqCxx7QUblrc9q4PIynbJzoCXv248UWBxJa7fguJyXs
    relevance: 5
    method: opus
    rationale: 'GO guideline for transcription regulators: separates GTFs, dbTFs and coTFs with recommended MF/BP/CC terms
      for each, requires experimental evidence of sequence-specific DNA binding plus target regulation for dbTF activity,
      sets has_input conventions, and gives a four-question checklist (hypothesis, domain/ortholog support, consistency with
      other annotations, results). Activator plus repressor annotations are noted as not inconsistent. Status: archived (last
      updated 2023-10-24) and replaced by the published guideline paper (Gaudet et al. 2021, BBA Gene Regulatory Mechanisms),
      which is canonical; some term labels here are outdated.'
  - id: drive:ZZZ-archived/Archived annotation guidelines/Transcription coregulator activity.docx
    title: Transcription coregulator activity.docx
    url: "https://drive.google.com/open?id=1Wq-_3w6F2L_CGvneQT8n-pv-Ekk_i2_QpUZJeO_kvxI\t1lNJkuoJask1SYt8CgVcBFr3CQ_7D72lp"
    relevance: 5
    method: opus
    rationale: 'GO-CAM activity-unit guideline for transcription coregulators: MF is a child of GO:0003712, has_input is the
      regulated transcription factor, the occurs_in context is the nucleus, the link to the TF is directly positively/negatively
      regulates, and the link to target-gene products is indirectly regulates. Status: archived, with no review date filled
      in; the current version presumably sits in the GO-CAM MF guidelines. The content itself is guideline text, so it stays
      at 5.'
  - id: drive:AI Evaluation/AI annotation validation tool.docx
    title: AI annotation validation tool.docx
    url: https://drive.google.com/open?id=1gSN-KRYZ0w08jmVosrmqktu_mbD4NWh64FQOyKO8XpM
    relevance: 4
    method: haiku
    rationale: 'Draft spec for pre-screening IEA and AI annotation submissions: checks for over-annotation, process conflation
      and taxon restrictions against AmiGO; a QC rule set that states submission policy. Draft, modified 2026-09.'
  - id: drive:Annotation/Annotation QC/GO_rules feedback/Copy 2 of Feedback on GO rules - Sylvain.xlsx
    title: Copy 2 of Feedback on GO rules - Sylvain.xlsx
    url: https://drive.google.com/open?id=18eOiwiw9POgXdbrnQUlRdyRBxptk50R31bs-y6B-how
    relevance: 4
    method: haiku
    rationale: Swiss-Prot group's feedback on the rules, including a general position that homology propagation is acceptable
      among closely related species, that self-referential ISS annotations should be filtered, and that the protein-binding
      NOT rule could be a warning. Each comment decides a class of rules.
  - id: drive:Annotation/Annotation QC/GO_rules feedback/Copy 3 of Feedback on GO rules - Helen.xlsx
    title: Copy 3 of Feedback on GO rules - Helen.xlsx
    url: https://drive.google.com/open?id=1AiEBQGA37oyyoFmDYNexYOlDIwqPHnMvAESIVqgjxFM
    relevance: 4
    method: haiku
    rationale: 'FlyBase group''s feedback on the GO rule set, with rationale for class-level decisions: no extensions on NOT
      annotations, reciprocal protein-binding checks should not be implemented, and regulation-of reports are a project rather
      than a check. Its suggested checks include NOT conflicts and duplicate annotations.'
  - id: drive:Annotation/Annotation QC/GO_rules feedback/Feedback on GO rules - DO NOT EDIT .xlsx
    title: Feedback on GO rules - DO NOT EDIT .xlsx
    url: https://drive.google.com/open?id=1QCB5QjPc-UqxCJ3TQX8EsXqmvYkZsc1nortivI-icN0
    relevance: 4
    method: haiku
    rationale: Master catalogue of GO QC rules (gorule-0000001 to 0000061) with implemented, partly implemented and proposed
      status, and decisions such as not implementing global checks yet. It records the rule-level conventions the consortium
      has adopted.
  - id: drive:Annotation/Annotation Reviews/Annotation Relations usage review/Review- Annotation extensions/Reviewing MF annotations
      to meet GO-CAM specs.docx
    title: Reviewing MF annotations to meet GO-CAM specs.docx
    url: https://drive.google.com/open?id=1Y7EiQxNsJ1SRRXBoQRuQLVNQGc0m8wn51AV8osSvTVQ
    relevance: 4
    method: haiku
    rationale: Table of the extension patterns allowed for MF annotations and which combinations pass the GO-CAM spec; a documented
      rule set for MF extensions.
  - id: drive:Annotation/Annotation Reviews/Annotation Relations usage review/Review- Annotation extensions/Ticket_status_20200510.docx
    title: Ticket_status_20200510.docx
    url: https://drive.google.com/open?id=1yKZGceZlyWK4lA6vtsXb4Qi9Y9aUdJllmefVNOWoPis
    relevance: 4
    method: haiku
    rationale: 'Step-by-step SOP for reviewing annotation-extension relations: confirm the ShEx rule, import, diagnose failures,
      and document correct usage; a documented review procedure.'
  - id: drive:Annotation/Annotation Reviews/Annotation Relations usage review/Review-Annotation qualifiers/Draft GOC GAF 2.2
      documentation for gp2term relations.docx
    title: Draft GOC GAF 2.2 documentation for gp2term relations.docx
    url: https://drive.google.com/open?id=1Jbpm1l5xjSabywE6ulIflujcESkdkQvlVI7bECgLbtw
    relevance: 4
    method: haiku
    rationale: Draft FAQ for GAF 2.2 explaining the explicit gene product to term relation (qualifier) change and its use;
      documents the convention for consumers.
  - id: drive:Annotation/Annotation Reviews/Annotation Relations usage review/Review-Annotation qualifiers/Heuristics for
      gp2term relations.docx
    title: Heuristics for gp2term relations.docx
    url: https://drive.google.com/open?id=1GSLdTrBVdSyaWU4R0L3M0Y-rrNRW22aoYFBh_nwAwC0
    relevance: 4
    method: haiku
    rationale: Heuristics for deriving gene product to term relations (enables, involved_in) from ontology part_of links and
      evidence codes; a reusable mapping convention.
  - id: drive:Annotation/Annotation Reviews/Annotation Relations usage review/Review-Annotation qualifiers/Legacy Annotations
      and New Qualifiers.docx
    title: Legacy Annotations and New Qualifiers.docx
    url: https://drive.google.com/open?id=1VJx9mJMvWfUEVF9vCmwhDY2NwgvHsWf3tRgKFluZLa8
    relevance: 4
    method: opus
    rationale: 'Background and proposal paper on gene-product-to-term qualifiers: it defines the GAF qualifiers (colocalizes_with,
      contributes_to, NOT) and GPAD relations, and argues for new BP qualifiers that cover uncertain or upstream roles (the
      2014 Barcelona action item), which GO-CAM later made necessary. It discusses and proposes rather than stating final
      policy. It is now historical: colocalizes_with is deprecated and the acts_upstream_of relations were adopted later.
      Downgraded from 5.'
  - id: drive:Annotation/Annotation Transfer/MGI external GO annotations pipeline.docx
    title: MGI external GO annotations pipeline.docx
    url: https://drive.google.com/open?id=1nIbYR06Ru-oIoLJgwh8bosd_JUdIkJpp
    relevance: 4
    method: opus
    rationale: Specification of MGI's ISO transfer pipeline from human GOA and RGD to mouse. Excluded are binding and protein
      binding terms, rows with IEA/ISO/ISS/ISA/RCA evidence and rows without a PMID. A NOT row blocks transfer within its
      HomoloGene class, only 1:1 orthologs get BP, and IEA filters follow. These are concrete propagation rules, but they
      document one MOD's pipeline rather than consortium curator guidance. Duplicate of the .docx.docx copy with the same
      score; this .docx is the cleaner, apparently canonical copy (the double extension looks like a conversion artifact)
      and also carries the IEA section. Downgraded from 5.
  - id: drive:Annotation/Annotation Transfer/MGI external GO annotations pipeline.docx.docx
    title: MGI external GO annotations pipeline.docx.docx
    url: https://drive.google.com/open?id=1KC9RSUW_HVQYhhpgK9GNvN8grD2tWvUtS6BQaAvbZVs
    relevance: 4
    method: opus
    rationale: Duplicate of 'MGI external GO annotations pipeline.docx' with the same ISO orthology transfer rules (term and
      evidence-code exclusions, NOT blocking within HomoloGene classes, BP only for 1:1 orthologs). It is a pipeline specification
      for one MOD, so it gets the same score as its twin. The single .docx is the canonical copy. Downgraded from 5.
  - id: drive:Annotation/Annotation guidelines/ Archived Documentation files/Archived File_Formats documentation/Archived
      file formats documentation/GPAD format spec- annotations.docx
