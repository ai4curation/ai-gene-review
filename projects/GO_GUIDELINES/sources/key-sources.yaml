  - id: wiki:QCQA call 2017-11-29
    title: QCQA call 2017-11-29
    url: https://wiki.geneontology.org/index.php/QCQA_call_2017-11-29
    relevance: 4
    method: haiku
    rationale: Sets the pragmatic target of 90 percent correct annotations with errors judged at branch level, distinguishes
      incorrect annotations from errors of omission, and recommends reviewing older annotations when curating new papers;
      general QC policy.
  - id: wiki:QCQA call 2018-10-02
    title: QCQA call 2018-10-02
    url: https://wiki.geneontology.org/index.php/QCQA_call_2018-10-02
    relevance: 4
    method: haiku
    rationale: Records decisions to keep x catabolic process annotations when a cell degrades x, and to maintain an exclusion
      list of retracted or predatory-journal papers; these are general annotation-policy decisions.
  - id: wiki:QCQA call 2018-11-01
    title: QCQA call 2018-11-01
    url: https://wiki.geneontology.org/index.php/QCQA_call_2018-11-01
    relevance: 4
    method: haiku
    rationale: Sets IMP guideline review as a priority and enumerates redundancy types (identical EXP, inferred versus EXP,
      TAS and NAS special case), a conceptual account of redundancy that curators apply.
  - id: wiki:QCQA call 2018-11-13
    title: QCQA call 2018-11-13
    url: https://wiki.geneontology.org/index.php/QCQA_call_2018-11-13
    relevance: 4
    method: haiku
    rationale: Records decisions that reciprocal IGI annotations are not required, that IPI should not be used with catalytic
      activity MF terms, and that a duplicate-annotation rule is not implemented; these settle general practice for classes
      of terms.
  - id: wiki:QCQA call 2019-05-14
    title: QCQA call 2019-05-14
    url: https://wiki.geneontology.org/index.php/QCQA_call_2019-05-14
    relevance: 4
    method: haiku
    rationale: Lists redundancy types (identical EXP from different sources, inferred versus EXP, TAS and NAS special case)
      and states that users need no automated annotations when EXP exists, a general redundancy policy.
  - id: wiki:QCQA call 2019-06-09
    title: QCQA call 2019-06-09
    url: https://wiki.geneontology.org/index.php/QCQA_call_2019-06-09
    relevance: 4
    method: haiku
    rationale: Proposes limiting response-to annotations by deprecating IEP or disallowing IEP and ISS/ISO/IEA in the response-to
