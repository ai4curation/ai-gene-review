      keywords are applied and concludes that two-step ARBA-to-KW-to-GO assignments should be questioned and that little support
      exists for keeping the KW2GO pipeline. This reaches a general practice position on electronic pipelines, not just one
      case.'
  - id: drive:Working Groups/IEA WG - 2025-10/Mechanisms for decreasing erroneous & overkill of annotations.xlsx
    title: Mechanisms for decreasing erroneous & overkill of annotations.xlsx
    url: https://drive.google.com/open?id=10xAYIWTCFyN2bzxBnijErWf9CTsuX5N4jBI7GVLB9KM
    relevance: 4
    method: haiku
    rationale: IEA working group list of QC mechanisms for electronic pipelines (block pipelines, do not propagate acts_upstream_of_or_within,
      review binding terms, NOT-aware logic blocks, block higher-level terms when a specific one exists); general practice,
      though presented as suggestions rather than adopted rules.
  - id: drive:Working Groups/IEA WG - 2025-10/Ranking Doc.docx
    title: Ranking Doc.docx
    url: https://drive.google.com/open?id=1v39HBYdiRwRgPTWbDc3EyelQrwuiv_53TKBkATmU2SY
    relevance: 4
    method: haiku
    rationale: Working draft defining the criteria for judging electronic pipelines (responsivity, currentness, conformance,
      one-hop provenance, explainability, GO_REF documentation, uniqueness); applies beyond one case but is unfinished discussion
      notes.
  - id: drive:Working Groups/IEA WG - 2025-10/Rating of IEA annotation pipelines .xlsx
    title: Rating of IEA annotation pipelines .xlsx
    url: "https://drive.google.com/open?id=1_3ibdFbFeJbqFwwXnSPT5XKYfpQxjK3LeaFet-r6hCE\t1GrGJ-rZiwKgrmxGqic2Jw2x9Jwo0rsWx"
