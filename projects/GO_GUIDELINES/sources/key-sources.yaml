    method: haiku
    rationale: 'Removal-impact report for UniPathway2GO in Streptomyces rhizosphaericus that states a general method: GO_REF:0000120
      merged rows are excluded from sole-source loss because co-listed pipelines still fire, and sole-source rows are classed
      exact/descendant/ancestor/unique. Revised_prompt version, 2026-04-23.'
  - id: drive:Working Groups/IEA WG - 2025-10/UNIPATHWAY2GO/Dmel/Review of Dmel UniPathway2GO annotations (March 2026).docx
    title: Review of Dmel UniPathway2GO annotations (March 2026).docx
