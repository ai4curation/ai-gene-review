  - id: drive:Working Groups/IEA WG - 2025-10/KW2GOREVIEW/Some KW2GO (and ARBA) observations.pptx
    title: Some KW2GO (and ARBA) observations.pptx
    url: https://drive.google.com/open?id=1dXqAbrOtkX78-tLZ2V5EFf6YBFWknugPK2jsCHT0hAU
