    url: https://wiki.geneontology.org/index.php/Ref_Gen_pub_draft_%28Retired%29
    relevance: 4
    method: opus
    rationale: Retired draft paper describing the Reference Genome project; contains a short list of stricter annotation standards
      (experimental codes preferred, ISS only from experimentally supported sequences, no NAS, no new TAS). Archived/historical
      and mostly project description, so the guidance is a small part; downgraded to 4.
  - id: wiki:RefG Bar Harbor May 20-21 2010
    title: RefG Bar Harbor May 20-21 2010
    url: https://wiki.geneontology.org/index.php/RefG_Bar_Harbor_May_20-21_2010
    relevance: 4
    method: haiku
    rationale: 'Meeting action items that set general annotation practice: improve NOT guidelines, require valid PubMed or
