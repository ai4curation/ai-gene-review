    url: https://wiki.geneontology.org/index.php/Regulation_Implementation_Plan
    relevance: 4
    method: haiku
    rationale: 'Lays out the procedure for regulation terms: reasoner-generated cross-products sorted into RoMF/RoBQ/unassignable,
      biologist review, redundant is_a removal and QC before commit.'
  - id: wiki:Regulation cross-products
    title: Regulation cross-products
    url: https://wiki.geneontology.org/index.php/Regulation_cross-products
    relevance: 4
    method: haiku
    rationale: Documents the convention for regulation-of terms as cross-products (regulation process plus a 'regulates' target),
      with reasoner use; the header marks parts as out of date.
  - id: wiki:Relation composition
    title: Relation composition
    url: https://wiki.geneontology.org/index.php/Relation_composition
    relevance: 4
    method: haiku
    rationale: Sets out composition rules for is_a, part_of and regulates, and explains why annotations do or do not propagate
      over part_of, a general principle for propagation and tool behaviour. Partly unfinished (TODO for examples, last edit
      2019) but not marked obsolete.
  - id: wiki:Relations
    title: Relations
    url: https://wiki.geneontology.org/index.php/Relations
    relevance: 4
    method: haiku
    rationale: 'Documents standing conventions for relations used in GO: OBO_REL is deprecated, new relations use BFO or RO
      IDs, and annotation-extension relations are being migrated to OWL importing RO. Much of it is ontology infrastructure,
      but the conventions apply to all annotation-extension use.'
  - id: wiki:Removing 'unknown' terms
    title: Removing 'unknown' terms
    url: https://wiki.geneontology.org/index.php/Removing_%27unknown%27_terms
    relevance: 4
    method: opus
    rationale: Two-sentence 2006 announcement that the 'unknown' BP/MF/CC terms were removed, on the principle that the ontology
      describes what exists and lack of knowledge belongs at the annotation level. A real consortium decision, but historical
      and a stub that does not describe the replacement practice (root term + ND), so 4.
  - id: wiki:Requesting a New Complex ID from ComplexPortal
    title: Requesting a New Complex ID from ComplexPortal
    url: https://wiki.geneontology.org/index.php/Requesting_a_New_Complex_ID_from_ComplexPortal
    relevance: 4
    method: haiku
    rationale: 'Submission guidelines for complex terms: required participants, PMIDs, and the GO annotations a complex should
      carry (CC, central MF, BP), giving a reusable convention for annotating complexes.'
  - id: wiki:Response to and signaling
    title: Response to and signaling
    url: https://wiki.geneontology.org/index.php/Response_to_and_signaling
    relevance: 4
    method: haiku
    rationale: Records a structural decision that signaling pathway terms should be children of response-to terms and that
      ligands therefore inherit cellular response annotations, a decision meant for a class of terms. The page still lists
      the is_a versus part_of question as open.
  - id: wiki:Response to x annotation guidelines
    title: Response to x annotation guidelines
    url: https://wiki.geneontology.org/index.php/Response_to_x_annotation_guidelines
    relevance: 4
    method: haiku
    rationale: Substantial discussion of when response-to terms should be used for gene products (mechanism versus expression
      changes), with recommendations for a survey and a clearer definition. Page is in the Deprecated category, but the reasoning
      about this class of terms still applies.
  - id: wiki:Responses to MGI from Karen
    title: Responses to MGI from Karen
    url: https://wiki.geneontology.org/index.php/Responses_to_MGI_from_Karen
    relevance: 4
    method: haiku
    rationale: 'Evidence Code Committee positions: the old evidence-code reliability hierarchy is not valid, ISS was reverted
      from requiring a with-organism experiment, TAS and NAS should be replaced by primary citations, and predicted snoRNA
      annotations can be treated as experimental-based. Substantial general discussion of evidence code usage, though in correspondence
      form.'
  - id: wiki:Restoring an Obsolete Ontology Term
    title: Restoring an Obsolete Ontology Term
    url: https://wiki.geneontology.org/index.php/Restoring_an_Obsolete_Ontology_Term
    relevance: 4
    method: haiku
    rationale: 'Editor SOP for reinstating an obsolete term: notification, label and definition edits, replaced_by and consider
      removal, reasoner run. It is ontology-maintenance procedure rather than annotation practice, but it is an explicit curator
      SOP. Last reviewed 2019.'
  - id: wiki:Results of survey
    title: Results of survey
    url: https://wiki.geneontology.org/index.php/Results_of_survey
    relevance: 4
    method: haiku
    rationale: 'Community survey results that set practice for a class of cases: enzyme targets go in column 16 (has_input)
      rather than an IPI with-field, catalytic activity should not take IPI, and binding child terms are kept. Also records
      the QC-related dispute over protein binding children.'
  - id: wiki:Reviewing papers
    title: Reviewing papers
    url: https://wiki.geneontology.org/index.php/Reviewing_papers
    relevance: 4
    method: haiku
    rationale: 'Guidelines for reviewing papers that use GO, covering source-data interpretation: DAG-aware analysis, ISS
      only from experimentally supported sources, awareness of NOT and contributes_to qualifiers, and handling ND root annotations.
      It is a general reviewer SOP, though the page is a 2019 draft with partial sections.'
  - id: wiki:Rolling build of the Gene Ontology
    title: Rolling build of the Gene Ontology
    url: https://wiki.geneontology.org/index.php/Rolling_build_of_the_Gene_Ontology
    relevance: 4
    method: haiku
    rationale: States the convention that the rolling ontology build is uncited and unversioned, so analyses should use the
      archived official release; a general usage policy for GO versions.
  - id: wiki:SO:Composite Terms
    title: SO:Composite Terms
    url: https://wiki.geneontology.org/index.php/SO%3AComposite_Terms
    relevance: 4
    method: haiku
    rationale: Documents the cross-product (genus-differentia) method for composite SO terms, with modular quality hierarchies
      and has_quality, as a general ontology-structure practice.
  - id: wiki:Scripts to ensure PAINT data integrity (Archived)
    title: Scripts to ensure PAINT data integrity (Archived)
    url: https://wiki.geneontology.org/index.php/Scripts_to_ensure_PAINT_data_integrity_%28Archived%29
    relevance: 4
    method: haiku
    rationale: 'QC checklist for PAINT-generated GAFs: replace IAS with IBA, report IBA rows on obsolete terms or with obsolete
      WITH genes, and flag tree topology changes. These are general QC rules, though the page is marked PAINT Archived and
      the IAS step was a one-time operation.'
  - id: wiki:See this document
    title: See this document
    url: https://wiki.geneontology.org/index.php/See_this_document
    relevance: 4
    method: haiku
    rationale: Discussion on evidence code hierarchy, when to use IEA versus ISS, whether TAS and NAS should be dropped, and
      what the WITH field asserts. These are general practice arguments, though they are proposals rather than adopted policy.
  - id: wiki:Sensu Plans
    title: Sensu Plans
    url: https://wiki.geneontology.org/index.php/Sensu_Plans
    relevance: 4
    method: haiku
    rationale: 'Proposal for handling sensu ambiguity: linguistic clashes resolved by context markers in name or synonym fields,
      and non-linguistic cases; a general convention for organism-specific term meanings, though not yet adopted.'
  - id: wiki:September2011 Annotation Advocacy Report
    title: September2011 Annotation Advocacy Report
    url: https://wiki.geneontology.org/index.php/September2011_Annotation_Advocacy_Report
    relevance: 4
    method: haiku
    rationale: Records the agreed QC rule that protein binding annotations need IPI with the interactor in the with field,
      and a GO_REF for the IC evidence code; a documented annotation-practice decision applicable across genes.
  - id: wiki:Signaling Curation Manual
    title: Signaling Curation Manual
    url: https://wiki.geneontology.org/index.php/Signaling_Curation_Manual
    relevance: 4
    method: opus
    rationale: 'Signaling curation guide: use cell-cell signaling when the sending/receiving cell types are known, avoid direct
      annotation to signal transduction, ligands get receptor agonist/antagonist activity and never signal transducer activity,
      annotate receptors to the most granular ligand+mechanism term, ligand-withdrawal goes to regulation. Substantive guidance,
      but flagged under construction (2018) and citing obsolete terms and SourceForge, so 4.'
  - id: wiki:Signaling nomenclature
    title: Signaling nomenclature
    url: https://wiki.geneontology.org/index.php/Signaling_nomenclature
    relevance: 4
    method: haiku
    rationale: Defines the signaling, signal transduction, signaling pathway and signaling cascade scope rules (what each
      includes or excludes); a documented convention for a class of terms.
  - id: wiki:Single GP Process (Archived)
    title: Single GP Process (Archived)
    url: https://wiki.geneontology.org/index.php/Single_GP_Process_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived proposal (Archived page, Annotation Archived category) for an 'all parts' qualifier that lets annotations
      propagate to has-part children; a propagation and qualifier design, though superseded by later GO-CAM approaches and
      not current policy.
  - id: wiki:SourceForge meeting 2014-10-22
    title: SourceForge meeting 2014-10-22
    url: https://wiki.geneontology.org/index.php/SourceForge_meeting_2014-10-22
    relevance: 4
    method: haiku
    rationale: 'Meeting outlining strategy for ontology requests: priority ordering, handling complex terms by annotating
      individual terms and modelling them in Noctua via LEGO, and curators recording interim terms; general practice for complex
      annotation cases.'
  - id: wiki:SourceForge meeting 2015-03-11
    title: SourceForge meeting 2015-03-11
    url: https://wiki.geneontology.org/index.php/SourceForge_meeting_2015-03-11
    relevance: 4
    method: haiku
    rationale: Records the resolution that protein family binding terms are not to be allowed in enzyme binding term design,
      and the policy communication decision; a general term-admission rule.
  - id: wiki:Sporulation Meeting Notes
    title: Sporulation Meeting Notes
    url: https://wiki.geneontology.org/index.php/Sporulation_Meeting_Notes
    relevance: 4
    method: haiku
    rationale: Curator discussion of removing sensu-tagged sporulation terms for bacteria and fungi and reorganising the branch;
      reaches a general practice that species-specific process terms should not be split by taxon when the process varies
      within the taxon.
  - id: wiki:Submit GO annotations
    title: Submit GO annotations
    url: https://wiki.geneontology.org/index.php/Submit_GO_annotations
    relevance: 4
    method: haiku
    rationale: 'Guidance for groups submitting bulk GAF annotations: minimum fields (stable IDs, GO term, evidence code, reference,
      taxon), the species-owner expectation, gp2protein and xrefs requirements, and advice to compare IEAs with GOA. It is
      a documented submission policy applicable beyond one case, but the step-by-step GAF and GPAD sections are empty and
      the page is marked UNDER REVIEW.'
  - id: wiki:Summary Email thread on NAS
    title: Summary Email thread on NAS
    url: https://wiki.geneontology.org/index.php/Summary_Email_thread_on_NAS
    relevance: 4
    method: haiku
    rationale: Archived (Archived annotation category) email thread settling that NAS annotations should not use GO IDs or
      Reactome IDs in the with field, with the evidence committee reasoning; a documented evidence-code convention, though
      superseded in places.
  - id: wiki:Summary of ISS with (blank) proposal
    title: Summary of ISS with (blank) proposal
    url: https://wiki.geneontology.org/index.php/Summary_of_ISS_with_%28blank%29_proposal
    relevance: 4
    method: haiku
    rationale: Proposes a controlled way to record a method or program name in the WITH column of ISS annotations (a GO_CM
      collection with accession, method name, developing reference and classification), reaching a general practice for all
      ISS rows where no database identifier exists. Written as a proposal, not an adopted policy, and it is not marked obsolete.
  - id: wiki:Synonyms
    title: Synonyms
    url: https://wiki.geneontology.org/index.php/Synonyms
    relevance: 4
    method: opus
    rationale: Editor guide on synonym scopes (exact, broad, narrow, related), when to keep old names and abbreviations as
      synonyms, and rules such as ligand is not a synonym of binding and x complex is not a synonym of x. It is a documented
      convention, but for ontology editing rather than annotation practice, so 4.
  - id: wiki:Taxon IDs and subspecies
    title: Taxon IDs and subspecies
    url: https://wiki.geneontology.org/index.php/Taxon_IDs_and_subspecies
    relevance: 4
    method: haiku
    rationale: Discussion of what a taxon ID on an annotation asserts, using E. coli strain IDs. Records recommendations (use
      the highest species taxid, or a specific strain only where the source is that strain) and the arbitrariness of the chosen
      level. Substantial discussion reaching a general practice for strain-level annotation.
  - id: wiki:Taxon-GO Checks and Commentary - Part 1
    title: Taxon-GO Checks and Commentary - Part 1
    url: https://wiki.geneontology.org/index.php/Taxon-GO_Checks_and_Commentary_-_Part_1
    relevance: 4
    method: haiku
    rationale: Triage of checking-script violations that teaches how to decide whether a taxon rule or an annotation is wrong
      (e.g. senescence, gastrulation, phycobilisome, multi-organism process terms that should include viruses). Discussion
      reaches general practice for resolving taxon-constraint conflicts.
  - id: wiki:Taxon-GO Checks and Commentary - Part 4
    title: Taxon-GO Checks and Commentary - Part 4
    url: https://wiki.geneontology.org/index.php/Taxon-GO_Checks_and_Commentary_-_Part_4
    relevance: 4
    method: haiku
    rationale: General discussion of processes used both by cellular organisms and by invading viruses and whether to duplicate
      terms as 'cellular X' and 'X' (e.g. cellular methylation). Establishes a general design question for annotating host
      and viral processes.
  - id: wiki:Taxon-GO Checks and Commentary - Response to GOA - Part 5
    title: Taxon-GO Checks and Commentary - Response to GOA - Part 5
    url: https://wiki.geneontology.org/index.php/Taxon-GO_Checks_and_Commentary_-_Response_to_GOA_-_Part_5
    relevance: 4
    method: haiku
    rationale: 'Responses to GOA flags that set general practice: broad terms such as response to stimulus, localization,
      developmental process and cellular process are no longer restricted to cellular organisms because viruses use them.
      Also records creating union taxon terms and generic versus cellular term pairs (DNA replication).'
  - id: wiki:Taxon-GO Proposal 2007
    title: Taxon-GO Proposal 2007
    url: https://wiki.geneontology.org/index.php/Taxon-GO_Proposal_2007
    relevance: 4
    method: haiku
    rationale: Meeting minutes debating whether taxon constraints (valid_for, specific_to, relevant_to) belong in GO at all,
      and whether slims and taxon categories should live outside the ontology file. Substantial discussion of general principles
      for representing taxon-term relations, including the caution that organism-level evidence cannot support broader taxon
      claims.
  - id: wiki:Transcription jamboree
    title: Transcription jamboree
    url: https://wiki.geneontology.org/index.php/Transcription_jamboree
    relevance: 4
    method: haiku
    rationale: Archived (category Annotation Archived) record of the electronic transcription jamboree, with consensus on
      when RNA Pol II terms may be used without explicit mention, avoiding indirect-effect terms, promoter and enhancer usage,
      and composite annotations across two papers. Records decisions that apply beyond single cases.
  - id: wiki:Transmembrane transporters
    title: Transmembrane transporters
    url: https://wiki.geneontology.org/index.php/Transmembrane_transporters
    relevance: 4
    method: haiku
    rationale: Argues which 'x transport' terms should take transmembrane transport as direct parent to avoid redundant x
      transmembrane transport terms, citing the transport and transmembrane transport definitions. A structural decision for
      a term class; last edited 2017.
  - id: wiki:Transport and transporters
    title: Transport and transporters
    url: https://wiki.geneontology.org/index.php/Transport_and_transporters
    relevance: 4
    method: haiku
    rationale: Documents the standard structure and definitions for localization and transport terms (establishment of localization,
      x transport, x import/export, sequestering), a convention for a term class; still carries a TO DO to reconcile with
      the transporter standards page.
  - id: wiki:Transporter terms standard definitions
    title: Transporter terms standard definitions
    url: https://wiki.geneontology.org/index.php/Transporter_terms_standard_definitions
    relevance: 4
    method: haiku
    rationale: Establishes a standard graph pattern and standard definition template for transporter terms (X transmembrane
      transporter, uptake, efflux, active, primary active), a convention applying to a whole class of terms. Last edited 2017.
  - id: wiki:Uberon
    title: Uberon
    url: https://wiki.geneontology.org/index.php/Uberon
    relevance: 4
    method: haiku
    rationale: States which anatomy ontology to use for cross-products and c16 annotation extensions per organism (Uberon
      for human and chicken, WBbt for C. elegans, FBbt for Drosophila) and the composite-ontology approach. A documented convention,
      last edited 2014.
  - id: wiki:Usage of terms describing protein or chemical production
    title: Usage of terms describing protein or chemical production
    url: https://wiki.geneontology.org/index.php/Usage_of_terms_describing_protein_or_chemical_production
    relevance: 4
    method: haiku
    rationale: 'Establishes a general practice for a class of terms: when to use the ''production'' terms for measured mediator
      appearance without a known mechanism, and when to use ''positive regulation of biosynthesis'' instead, with a worked
      example and the GO-discuss rationale.'
  - id: wiki:Use of ND for root annotations
    title: Use of ND for root annotations
    url: https://wiki.geneontology.org/index.php/Use_of_ND_for_root_annotations
    relevance: 4
    method: opus
    rationale: Archived 2007 email excerpt recording consensus that annotations to the root terms must use ND, justified as
      a statement about the curation process (gene looked at, nothing known) rather than a software shortcut, with an action
      to update ND docs. A real decision still reflected in current ND guidance, but it is an archived email thread rather
      than the guideline, so 4.
  - id: wiki:Utilization
    title: Utilization
    url: https://wiki.geneontology.org/index.php/Utilization
    relevance: 4
    method: haiku
    rationale: Records the standardised definition and parentage for the utilization-term class (series of processes, is_a
      biological_process, has_part links to detection, transport and metabolism), a documented convention for a class of terms.
  - id: wiki:Viral term WebEx meeting august 21 2009
    title: Viral term WebEx meeting august 21 2009
    url: https://wiki.geneontology.org/index.php/Viral_term_WebEx_meeting_august_21_2009
    relevance: 4
    method: haiku
    rationale: Records the decision to use general host-virus process terms without separate virus and host child terms, annotating
      both genes to the same term, and the reasoning about gene-product/term relations as sentences. A general practice decision.
  - id: wiki:Viral term WebEx meeting june 3 2009
    title: Viral term WebEx meeting june 3 2009
    url: https://wiki.geneontology.org/index.php/Viral_term_WebEx_meeting_june_3_2009
    relevance: 4
    method: haiku
    rationale: Minutes deciding viral terms should sit under the multi-organism process node as 'process by symbiont in host',
      and that host gene products annotated to viral processes is not abnormal, which the notes say differs from existing
      policy. A general decision for a class of terms.
  - id: wiki:Virus terms (Completed 2012)
    title: Virus terms (Completed 2012)
    url: https://wiki.geneontology.org/index.php/Virus_terms_%28Completed_2012%29
    relevance: 4
    method: haiku
    rationale: Records agreed ontology principles for viral terms (viruses classed as organisms, virus-host interactions as
      symbiotic, viral processes regarded as normal for both partners) and the structuring debate, which applies to a class
      of terms. The mailing list is marked deprecated, but the page itself is not marked archived.
  - id: wiki:Why isn't interleukin in GO?
    title: Why isn't interleukin in GO?
    url: https://wiki.geneontology.org/index.php/Why_isn%27t_interleukin_in_GO%3F
    relevance: 4
    method: haiku
    rationale: 'Explains why a named cytokine class is not a GO term: interleukins are not a homologous family, unlike chemokines
      and interferons, so a naming group alone does not justify a class. A general principle for deciding when to create a
      term; 2018 edit.'
  - id: wiki:With field
    title: With field
    url: https://wiki.geneontology.org/index.php/With_field
    relevance: 4
    method: opus
    rationale: Documents which evidence codes require or allow a with/from value, that pipes should mean n-ary interactions
      only for IPI/IGI, a table of divergent per-MOD interpretations, and related QC rules. Useful convention material, but
      partly a survey of inconsistent practice and dated (2010-2014 plans), so 4.
  - id: wiki:XP:biological process xp anatomy
    title: XP:biological process xp anatomy
    url: https://wiki.geneontology.org/index.php/XP%3Abiological_process_xp_anatomy
    relevance: 4
    method: haiku
    rationale: States the policy of using Uberon for metazoan anatomy and PO for plant-specific processes in cross-products,
      with species-centric anatomy ontology choices. A documented convention for a term class.
  - id: wiki:XP:biological process xp cellular component
    title: XP:biological process xp cellular component
    url: https://wiki.geneontology.org/index.php/XP%3Abiological_process_xp_cellular_component
    relevance: 4
    method: haiku
    rationale: Documents the cross-product convention of defining biological process terms by an organelle-fission parent
      plus a results_in_division_of relation to a cellular component. This is a reusable ontology-modelling convention that
      bears on how process terms are defined.
  - id: wiki:XP:biological process xp molecular function
    title: XP:biological process xp molecular function
    url: https://wiki.geneontology.org/index.php/XP%3Abiological_process_xp_molecular_function
    relevance: 4
    method: haiku
    rationale: Documents the convention of logically defining single-step biological process terms using molecular function
      differentia (intersection_of has_part some activity). This is a reusable ontology-structure principle for process terms.
  - id: wiki:XP:biological process xp regulation
    title: XP:biological process xp regulation
    url: https://wiki.geneontology.org/index.php/XP%3Abiological_process_xp_regulation
    relevance: 4
    method: haiku
    rationale: Documents the standard grammar that derives regulation cross-products from the 'negative/positive regulation
      of P' naming, and the batch reasoner fixes applied to GO links. A general convention for regulation terms; last edited
      2009.
  - id: wiki:XP:molecular function xp protein
    title: XP:molecular function xp protein
    url: https://wiki.geneontology.org/index.php/XP%3Amolecular_function_xp_protein
    relevance: 4
    method: haiku
    rationale: Shows how PRO-based logical definitions let a binding annotation be inferred and deepened to a specific partner
      class (FIGF and VEGFR2 binding) when GO has only a general term. A general inference approach for binding annotations,
      with its limits noted.
  papers:
  - id: DOI:10.1101/2020.04.21.045195
    title: 'Term Matrix: A novel Gene Ontology annotation quality control system based on ontology term co-annotation patterns'
    url: https://doi.org/10.1101/2020.04.21.045195
    relevance: 5
    method: opus
    rationale: 'Preprint of the Term Matrix paper: an annotation QC method using rules for mutually exclusive biological processes
      to find co-annotation errors and trace them to curation, ontology or pipeline sources (107 rules). An annotation-QC
      method paper; superseded by the published Open Biology version (PMID:32875947), which should be preferred.'
  - id: PMID:18460184
    title: 'Gene Ontology annotations: what they mean and where they come from.'
    url: https://europepmc.org/article/MED/18460184
    relevance: 5
    method: opus
    rationale: Explains what a GO annotation asserts and how curators translate experimental results into annotations, aimed
      at clarifying annotation semantics for both curators and users. A foundational annotation-practice paper (2008); conceptually
      current, though specific conventions have evolved.
  - id: PMID:21873635
    title: Phylogenetic-based propagation of functional annotations within the Gene Ontology consortium.
    url: https://europepmc.org/article/MED/21873635
    relevance: 5
    method: opus
    rationale: 'Describes the PAINT phylogenetic annotation method: curators place gains and losses of function on PANTHER
      family trees from experimental annotations, with its guidelines, strengths and limitations. Core method paper for IBA/IBD
      propagation; current in principle.'
  - id: PMID:22301074
    title: 'Manual GO annotation of predictive protein signatures: the InterPro approach to GO curation.'
    url: https://europepmc.org/article/MED/22301074
    relevance: 5
    method: opus
    rationale: InterPro's protocol for manually mapping GO terms to InterPro entries, including assigning terms by domain
      function rather than family function, handling taxonomic constraints and cases with no suitable term. A curation SOP
      for InterPro2GO propagation; still the basis of current practice.
  - id: PMID:23842463
    title: A guide to best practices for Gene Ontology (GO) manual annotation.
    url: https://europepmc.org/article/MED/23842463
    relevance: 5
    method: opus
    rationale: GOC guide to best practices for manual GO annotation, setting out the consortium's conventions for creating
      manual annotations. A direct guideline document (2013); some specifics superseded by later documentation but core conventions
      current.
  - id: PMID:23981286
    title: 'Gene Ontology annotation of sequence-specific DNA binding transcription factors: setting the stage for a large-scale
      curation effort.'
    url: https://europepmc.org/article/MED/23981286
    relevance: 5
    method: opus
    rationale: Guidelines and a standardized protocol for annotating sequence-specific DNA-binding transcription factors with
      GO terms based on decisive experimental evidence. A curation SOP for a class of proteins (2013); the term structure
      was later refactored (see PMID:34461313), so partly superseded.
  - id: PMID:24885854
    title: A method for increasing expressivity of Gene Ontology annotations using a compositional approach.
    url: https://europepmc.org/article/MED/24885854
    relevance: 5
    method: opus
    rationale: 'Defines GO annotation extensions: their content, structure and relations for capturing targets, locations,
      cell types and stages, with usage examples. Establishes annotation practice for extensions (2014); relation set has
      since evolved but the framework is current.'
  - id: PMID:26215368
    title: Representing virus-host interactions and other multi-organism processes in the Gene Ontology.
    url: https://europepmc.org/article/MED/26215368
    relevance: 5
    method: opus
    rationale: Introduces GO classes for virus-host and other multi-organism processes and gives annotation guidelines for
      describing two interacting organisms. A direct annotation-practice paper (2015); the multi-organism branch has since
      been restructured, so parts are out of date.
  - id: PMID:26917558
    title: Guidelines for the functional annotation of microRNAs using the Gene Ontology.
    url: https://europepmc.org/article/MED/26917558
    relevance: 5
    method: opus
    rationale: 'GOC guidelines for functional annotation of microRNAs: ontology additions, evidence standards and curator
      guidelines, with the full curation manual on the GO wiki. A guideline document (2016); current in principle.'
  - id: PMID:27812934
    title: Best Practices in Manual Annotation with the Gene Ontology.
    url: https://europepmc.org/article/MED/27812934
    relevance: 5
    method: opus
    rationale: 'Best practices for manual GO annotation from literature: term selection, translating experimental assays into
      annotations, and common difficulties. A direct curation-guidance chapter (2017); current.'
  - id: PMID:30715275
    title: Annotation of gene product function from high-throughput studies using the Gene Ontology.
