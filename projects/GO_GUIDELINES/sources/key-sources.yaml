    relevance: 4
    method: haiku
    rationale: Working-group minutes and action points recording decisions on electronic pipelines, including removing multi-jump
      IEAs and requiring direct sources, which reach general practice for propagated annotations.
  - id: drive:Working Groups/IEA WG - 2025-10/IEA working group formal doc.docx
