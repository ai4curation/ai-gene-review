    url: https://wiki.geneontology.org/index.php/RefGenProgress_2008-06-18_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived summary stating the general rule that annotating a gene to both protein binding and complex when the
      two are redundant (GRIN1) is incorrect, plus the difficulty of annotating to a process versus its regulation; a general
      practice point.
  - id: wiki:RefGenProgress 2009-02 (Archived)
    title: RefGenProgress 2009-02 (Archived)
    url: https://wiki.geneontology.org/index.php/RefGenProgress_2009-02_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Records decisions on PAINT-derived ISS evidence, ambiguity of colocalizes_with and contributes_to qualifiers,
      and a jamboree note that IEP evidence must concern the annotated gene's own expression, not its targets. The page is
      marked Archived.
  - id: wiki:RefGenProgress 2009-07 (Archived)
    title: RefGenProgress 2009-07 (Archived)
    url: https://wiki.geneontology.org/index.php/RefGenProgress_2009-07_%28Archived%29
    relevance: 4
    method: haiku
    rationale: 'Jamboree action items that record general practice: propagating experimental annotations from other organisms
      when reference-genome data are scarce, whether functional assays inform localization, and improving ISS documentation.
      The page is marked Archived.'
  - id: wiki:RefGenome10Feb09 Phone Conference (Archived)
    title: RefGenome10Feb09 Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/RefGenome10Feb09_Phone_Conference_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived call on PAINT ISS annotation of ancestral nodes and on the meaning of contributes_to and colocalizes_with
      qualifiers, with a recorded decision to fix the documentation; direct qualifier-usage policy.
  - id: wiki:RefGenome9Dec08 Phone Conference (Archived)
    title: RefGenome9Dec08 Phone Conference (Archived)
    url: https://wiki.geneontology.org/index.php/RefGenome9Dec08_Phone_Conference_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Archived call on the tree-based PANTHER annotation process, stating that protein binding GO:0005515 and protein
      C-terminal binding must never be propagated and that the propagation process needs documentation; a general propagation
      rule.
  - id: wiki:Reference Genome August 2010 (Archived)
    title: Reference Genome August 2010 (Archived)
    url: https://wiki.geneontology.org/index.php/Reference_Genome_August_2010_%28Archived%29
    relevance: 4
    method: haiku
    rationale: Documents the addition of evidence codes IRD (rapid divergence) and IMD (motif divergence) for NOT annotations
      and the rapid_divergence qualifier, which the filter script needed. This is a reusable evidence-code convention, and
