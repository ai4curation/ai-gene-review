  - id: drive:Working Groups/IEA WG - 2025-10/UNIPATHWAY2GO/Bacteria/Revised_prompt/unipathway_loss_report_Streptomyces_rhizosphaericus.md
    title: unipathway_loss_report_Streptomyces_rhizosphaericus.md
