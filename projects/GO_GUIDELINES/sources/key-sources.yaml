  - id: PMID:27812932
    title: The Gene Ontology and the Meaning of Biological Function.
    url: https://europepmc.org/article/MED/27812932
    relevance: 4
    method: haiku
    rationale: Discusses the meaning of biological function and the biological model underlying GO annotations, including
      how annotation statements should be read; conceptual guidance applicable across annotation.
  - id: PMID:27812933
    title: Primer on the Gene Ontology.
    url: https://europepmc.org/article/MED/27812933
    relevance: 4
    method: haiku
    rationale: Primer explaining GO structure and how to interpret GO annotations, including evidence and qualifiers; substantial
      general guidance on proper annotation interpretation.
  - id: PMID:27812937
    title: How Does the Scientific Community Contribute to Gene Ontology?
    url: https://europepmc.org/article/MED/27812937
    relevance: 4
    method: haiku
    rationale: Reviews how the research community has contributed to GO development and annotation, including what worked
      and what did not, and gives advice on engaging researchers in curation.
  - id: PMID:27812938
    title: Evaluating Computational Gene Ontology Annotations.
    url: https://europepmc.org/article/MED/27812938
    relevance: 4
    method: haiku
    rationale: Overview of strategies to evaluate computational GO annotations, including bias from incomplete databases and
      use of targeted experimental annotations; substantial general QC guidance.
  - id: PMID:27812939
    title: Evaluating Functional Annotations of Enzymes Using the Gene Ontology.
    url: https://europepmc.org/article/MED/27812939
    relevance: 4
    method: haiku
    rationale: A chapter on using GO to evaluate enzyme annotations, identifying misannotation and deciding how far annotation
      transfer by sequence similarity can be trusted, which applies to general annotation-transfer practice.
  - id: PMID:27812944
    title: 'Gene Ontology: Pitfalls, Biases, and Remedies.'
    url: https://europepmc.org/article/MED/27812944
    relevance: 4
    method: opus
    rationale: Discusses pitfalls and biases in GO (incompleteness, qualifiers, transitivity of relations, enrichment biases)
      with remedies. Mainly guidance for interpreting and using annotations rather than making them, so 4; current.
  - id: PMID:27812948
    title: 'The Evidence and Conclusion Ontology (ECO): Supporting GO Annotations.'
    url: https://europepmc.org/article/MED/27812948
    relevance: 4
    method: haiku
    rationale: Describes ECO for documenting evidence types and whether a human or computer made each GO annotation, and how
      this supports QC pipelines. It documents evidence-recording conventions used for GO annotations.
  - id: PMID:27812951
    title: The Vision and Challenges of the Gene Ontology.
    url: https://europepmc.org/article/MED/27812951
    relevance: 4
    method: haiku
    rationale: Lewis on the vision and challenges of the GO Consortium, covering keeping GO current and accurately tracking
      evidence over time; substantial general discussion of annotation practice goals.
  - id: PMID:27899567
    title: Expansion of the Gene Ontology knowledgebase and resources.
    url: https://europepmc.org/article/MED/27899567
    relevance: 4
    method: haiku
    rationale: GO Consortium 2017 update covering evidence codes, quality improvements and annotation tools; reports consortium-level
      annotation practice decisions.
  - id: PMID:28025345
    title: 'Large-scale inference of gene function through phylogenetic annotation of Gene Ontology terms: case study of the
      apoptosis and autophagy cellular processes.'
    url: https://europepmc.org/article/MED/28025345
    relevance: 4
    method: opus
    rationale: Applies PAINT to apoptosis and autophagy, finding that most experimental annotations describe indirect effects,
      phenotypes or HTP results and only a small fraction are propagated, and showing how feedback improves trees, annotations
      and GO. A case study with reusable lessons on which annotations represent core function, not a guideline itself, so
      4.
  - id: PMID:28732468
    title: 'NoGOA: predicting noisy GO annotations using evidences and sparse representation.'
    url: https://europepmc.org/article/MED/28732468
    relevance: 4
    method: haiku
    rationale: NoGOA predicts noisy GO annotations by weighting entries by evidence-code error rates estimated from archived
      GOA files. It is an annotation QC study with explicit evidence-code reliability guidance.
  - id: PMID:30395331
    title: 'The Gene Ontology Resource: 20 years and still GOing strong.'
    url: https://europepmc.org/article/MED/30395331
    relevance: 4
    method: haiku
    rationale: GO Consortium report on monthly release DOIs, the molecular function refactoring, QA for out-of-date annotations,
      and evidence codes for high-throughput data; consortium policy and practice.
  - id: PMID:31548717
    title: Gene Ontology Causal Activity Modeling (GO-CAM) moves beyond GO annotations to structured descriptions of biological
      functions and systems.
    url: https://europepmc.org/article/MED/31548717
    relevance: 4
    method: opus
    rationale: Introduces GO-CAM, linking GO annotations into causal activity models with defined relations. Establishes the
      modelling framework but, as a perspective without detailed curation conventions (no abstract in the item), it is less
      a guideline than the annotation-practice papers, so 4.
  - id: PMID:32470107
    title: Detecting Gene Ontology misannotations using taxon-specific rate ratio comparisons.
    url: https://europepmc.org/article/MED/32470107
    relevance: 4
    method: haiku
    rationale: Detects GO misannotations by comparing annotation rate ratios across taxa and finds many errors are IBA propagations;
      a QC method that clarifies a general source of propagation error.
  - id: PMID:33290552
    title: 'The Gene Ontology resource: enriching a GOld mine.'
    url: https://europepmc.org/article/MED/33290552
    relevance: 4
    method: haiku
    rationale: GO Consortium annual report on GO-CAM framework, review of 20,000 experimental annotations and consistency
      with other ontologies; reports consortium annotation policy and practice.
  - id: PMID:34823464
    title: Automatic consistency assurance for literature-based gene ontology annotation.
    url: https://europepmc.org/article/MED/34823464
    relevance: 4
    method: haiku
    rationale: Formalises four types of GO annotation inconsistency and proposes automated consistency checking for curation;
      general QC practice.
  - id: PMID:34986598
    title: 'ECO: the Evidence and Conclusion Ontology, an update for 2022.'
    url: https://europepmc.org/article/MED/34986598
    relevance: 4
    method: haiku
    rationale: ECO 2022 update describes evidence-code ontology changes and their use for tracking annotation provenance and
      quality control in GO and other resources. It documents evidence conventions widely applied to annotation.
  - id: PMID:35419584
    title: An evidence-based lexical pattern approach for quality assurance of Gene Ontology relations.
    url: https://europepmc.org/article/MED/35419584
    relevance: 4
    method: haiku
    rationale: Lexical-pattern QA method that finds missing and erroneous GO is_a and part_of relations, with expert validation
      and submission to GO; ontology-structure QC practice.
  - id: PMID:35758780
    title: Exploring automatic inconsistency detection for literature-based gene ontology annotation.
    url: https://europepmc.org/article/MED/35758780
    relevance: 4
    method: haiku
    rationale: Defines and detects types of literature-to-GO annotation inconsistency for QC; general consistency-assurance
      practice applicable beyond one case.
  - id: PMID:36866529
    title: The Gene Ontology knowledgebase in 2023.
    url: https://europepmc.org/article/MED/36866529
    relevance: 4
    method: opus
    rationale: Consortium overview of the GO knowledgebase in 2023 (ontology, annotations, GO-CAM), its QA processes and advice
      to users. A broad status report rather than curation guidance, so 4; current.
  - id: PMID:37554559
    title: 'Black sheep, dark horses, and colorful dogs: a review on the current state of the Gene Ontology with respect to
      iron homeostasis in <i>Arabidopsis thaliana</i>.'
    url: https://europepmc.org/article/MED/37554559
    relevance: 4
    method: haiku
    rationale: Reviews inconsistent GO iron-homeostasis terms, argues for evidence-code-based curation and completing ortholog
      groups; applicable guidance on GO term curation consistency.
  - id: PMID:40114175
    title: New and revised gene ontology biological process terms describe multiorganism interactions critical for understanding
      microbial pathogenesis and sequences of concern.
    url: https://europepmc.org/article/MED/40114175
    relevance: 4
    method: haiku
    rationale: Defines and revises GO biological process terms for multiorganism pathogenic functions, a recorded term-development
      decision applicable to a class of host-exploitation processes.
  - id: PMID:40489355
    title: Structural Changes in Gene Ontology Reveal Modular and Complex Representations of Biological Function.
    url: https://europepmc.org/article/MED/40489355
    relevance: 4
    method: haiku
    rationale: Documents the 2019 curator-driven restructuring of the GO cellular component branch and its alignment with
      CARO and GO-CAM, a recorded ontology-design decision that bears on general practice.
  - id: PMID:40996702
    title: A review on Gene Ontology evaluations.
    url: https://europepmc.org/article/MED/40996702
    relevance: 4
    method: haiku
    rationale: Review of evaluations of GO vocabulary, structure and annotations across multiple viewpoints, summarizing general
      knowledge about ontology architecture and annotation quality.
  - id: PMID:41413728
    title: The Gene Ontology knowledgebase in 2026.
    url: https://europepmc.org/article/MED/41413728
    relevance: 4
    method: opus
    rationale: GO Consortium 2026 NAR update reporting ontology/annotation revisions (metabolism, host-pathogen, ECM, chromatin,
      ncRNA), the functionome v2 reviewed human annotation set, GO-CAM scale-up, and current recommendations on AI use in
      GO. Current, but it is mainly a status report of changes rather than a guideline document; only the AI recommendations
      section states practice directly, so downgraded to 4.
  - id: PMID:41495476
    title: GOFlowLLM-curating miRNA literature with large language models and flowcharts.
    url: https://europepmc.org/article/MED/41495476
    relevance: 4
    method: haiku
    rationale: GOFlowLLM automates GO curation by following curation flowcharts, with curator agreement on terms, reasoning
      and evidence. It establishes a general approach to flowchart-guided, evidence-linked annotation and QC of curation decisions.
  - id: PMID:41906130
    title: 'Go Big or go home: a new gene ontology subset that improves plant gene function prediction.'
    url: https://europepmc.org/article/MED/41906130
    relevance: 4
    method: haiku
    rationale: Curatorial method to derive taxon-constrained GO subsets by traversing the graph to the most specific term
      compatible with plant biology rather than discarding terms, a reusable convention for taxon-applicability of GO terms.
  - id: PMID:43002602
    title: How far can you borrow? Divergence limits of cross-species Gene Ontology enrichment in non-model organisms.
    url: https://europepmc.org/article/MED/43002602
    relevance: 4
    method: haiku
    rationale: Systematic benchmark and decision protocol for when borrowed cross-species GO annotations can be trusted in
      enrichment, giving general guidance on proper use and interpretation of transferred GO annotations.
