  - id: wiki:Regulates
    title: Regulates
    url: https://wiki.geneontology.org/index.php/Regulates
    relevance: 4
    method: opus
    rationale: 'GO-CAM relation page for ''regulates'': use only when the mechanism acting on the downstream enabler is understood
      and the process is non-constitutive, and prefer the directly/indirectly positively/negatively regulates children. Marked
      WIP with an empty standard-annotation section and a note on the regulation-of-MF branch being deprecated, so downgraded
      to 4.'
  - id: wiki:Regulation Implementation Plan
