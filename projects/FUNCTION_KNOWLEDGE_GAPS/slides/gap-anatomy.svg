<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">KnowledgeGap: an unknown with provenance</text>
  <!-- central object -->
  <rect x="330" y="70" width="330" height="300" rx="14" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="495" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">KnowledgeGap</text>
  <g font-size="13" fill="#15201e">
    <text x="350" y="130"><tspan font-weight="600">gap_statement</tspan> + boundary</text>
    <text x="345" y="160" font-size="12.5"><tspan font-weight="600">gap_kind</tspan>: BIOLOGY · CURATION · ONTOLOGY</text>
    <text x="350" y="190"><tspan font-weight="600">dark_aspect</tspan>: MF · BP · CC · WHOLLY</text>
    <text x="364" y="208" fill="#56655f">or RESIDUAL_SUBGAP</text>
    <text x="350" y="238"><tspan font-weight="600">status</tspan>: OPEN → NARROWING →</text>
    <text x="364" y="256" fill="#56655f">CLOSING → RESOLVED</text>
    <text x="350" y="286"><tspan font-weight="600">provenance</tspan>: verbatim quotes,</text>
    <text x="364" y="304" fill="#56655f">checked like supported_by</text>
    <text x="350" y="334"><tspan font-weight="600">proposed_terms</tspan> for ontology gaps</text>
  </g>
  <!-- attach levels -->
  <g font-size="14" fill="#15201e">
    <rect x="30" y="80" width="230" height="44" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="145" y="107" text-anchor="middle">whole gene</text>
    <rect x="30" y="140" width="230" height="44" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="145" y="167" text-anchor="middle">one existing annotation</text>
    <rect x="30" y="200" width="230" height="44" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="145" y="227" text-anchor="middle">a core function</text>
    <rect x="30" y="260" width="230" height="44" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="145" y="287" text-anchor="middle">a whole module</text>
    <rect x="30" y="320" width="230" height="44" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="145" y="347" text-anchor="middle">one module step</text>
  </g>
  <g stroke="#0e6b66" stroke-width="1.6">
    <path d="M262 102 L326 180" marker-end="url(#a)"/><path d="M262 162 L326 200" marker-end="url(#a)"/><path d="M262 222 L326 220" marker-end="url(#a)"/><path d="M262 282 L326 240" marker-end="url(#a)"/><path d="M262 342 L326 260" marker-end="url(#a)"/>
  </g>
  <!-- examples -->
  <g transform="translate(685 80)" font-size="13" fill="#15201e">
    <text font-size="14" font-weight="600" fill="#0e6b66">Worked examples</text>
    <text y="30"><tspan font-weight="600">CFAP300</tspan> biology gap:</text>
    <text y="48" fill="#56655f">dynein preassembly factor, activity unknown</text>
    <text y="80"><tspan font-weight="600">RAB9A</tspan> residual sub-gap:</text>
    <text y="98" fill="#56655f">its GEF and GAP are unidentified</text>
    <text y="130"><tspan font-weight="600">POLE4</tspan> ontology gap:</text>
    <text y="148" fill="#56655f">a structural subunit GO can't describe</text>
    <text y="180"><tspan font-weight="600">TMEM65</tspan> contested gap:</text>
    <text y="198" fill="#56655f">IDA and NOT|IDA on the same term</text>
  </g>
  <text x="30" y="420" font-size="14" fill="#15201e">Aggregated by <tspan font-family="Menlo, monospace">scripts/aggregate_knowledge_gaps.py</tspan> into the Structured Knowledge-Gap Register.</text>
  <text x="30" y="448" font-size="14" fill="#15201e">Rule: provenance must be a verified primary source or a checkable repo fact, never an unverified deep-research summary.</text>
</svg>
