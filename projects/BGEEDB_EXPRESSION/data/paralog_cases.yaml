# Paralog cases for scripts/paralogs.py (Pilot B). Authored inputs, not results.
#
# Each case names a PANTHER family, the PAINT node (PTN) whose IBD propagates
# the terms under test (read from the IBA WITH/FROM column of a member's GOA
# record), and the sub-clades to compare. Leaves are read from the PANTHER
# treeinfo service, never typed by hand.
#
# `context` replaces GO anatomy when the term has none (gluconeogenesis has no
# logical definition naming a tissue). Here it is the set of GTEx tissues where
# the pathway-satisfiability engine finds the gluconeogenesis module satisfiable
# (modules/experimental/gluconeogenesis-context/RESULTS.md: "SATISFIABLE in
# exactly: Liver, Kidney_Cortex, Small_Intestine_Terminal_Ileum"), mapped to
# UBERON by exact label.
cases:
  - id: PAX4_PAX6
    family: PTHR45636
    ibd_node: PTN002900580
    ibd_node_note: >-
      Euteleostomi speciation node above every PAX4/PAX6 split in the PANTHER
      19 tree; the source of PAX6's IBA rows for retina development in
      camera-type eye, forebrain development and type B pancreatic cell
      differentiation (PAX6-goa.tsv WITH/FROM).
    terms:
      - GO:0060041  # retina development in camera-type eye
      - GO:0030900  # forebrain development
      - GO:0003309  # type B pancreatic cell differentiation
    clades:
      PAX6 (mammals): PTN000676654
      PAX4 (mammals): PTN000676639
    species: [human, mouse]
  - id: G6PC
    family: PTHR12591
    ibd_node: PTN000971890
    ibd_node_note: >-
      Source of the gluconeogenesis and glucose-6-phosphatase activity IBA rows
      on G6PC1 and G6PC3 (their GOA WITH/FROM).
    terms:
      - GO:0006094  # gluconeogenesis
    context:
      label: tissues where the gluconeogenesis module is satisfiable (GTEx, pathway satisfiability)
      anatomy:
        - UBERON:0002107  # liver
        - UBERON:0001225  # cortex of kidney
        - UBERON:0002108  # small intestine
    species: [human, mouse]
