<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" class="viz" role="img" aria-label="Share of annotations whose anatomy is among the gene's top Bgee tissues, by reviewer action">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; --s1:#2a78d6;
         --ord1:#1c5cab; --ord2:#86b6ef; --dot:#8a8984; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#383835; --s1:#3987e5;
           --ord1:#9ec5f4; --ord2:#5598e7; --dot:#8a8984; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--ink); }
  .muted { fill: var(--ink2); }
</style>
<rect width="640" height="330" fill="var(--surface)"/>
<text x="56" y="24" font-size="15" font-weight="600">Expression agrees with annotations, but not with reviewers' verdicts</text>
