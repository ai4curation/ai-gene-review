<line x1="56" x2="620" y1="129.3" y2="129.3" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="133.3" font-size="11" text-anchor="end" class="muted">40%</text>
<line x1="56" x2="620" y1="64.0" y2="64.0" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="68.0" font-size="11" text-anchor="end" class="muted">60%</text>
<g><title>ACCEPT: 46% enriched (n=2886); shuffled pairs 26%</title><path d="M99.5,260.0 V113.1 Q99.5,109.1 103.5,109.1 H149.5 Q153.5,109.1 153.5,113.1 V260.0 Z" fill="var(--s1)"/><rect x="89.5" y="89.08" width="74" height="170.92000000000002" fill="transparent"/></g>
