<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">Three problems, kept in separate layers</text>
<g>
<rect x="30" y="70" width="280" height="330" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="170" y="104" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">1. Family recognition</text>
<text x="170" y="130" font-size="12" text-anchor="middle" fill="#56655f">owned by the predictor</text>
<text x="50" y="170" font-size="13" fill="#15201e">Is this operon a CRISPR-Cas,</text>
<text x="50" y="188" font-size="13" fill="#15201e">CBASS or Thoeris system?</text>
<text x="50" y="224" font-size="12" fill="#56655f">Today: the prokaryotic immunity</text>
<text x="50" y="240" font-size="12" fill="#56655f">predictor. Later possibly DefenseFinder,</text>
<text x="50" y="256" font-size="12" fill="#56655f">PADLOC, CasFinder or learned models.</text>
<rect x="340" y="70" width="280" height="330" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="480" y="104" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">2. Stable identity</text>
<text x="480" y="130" font-size="12" text-anchor="middle" fill="#0e6b66">this project</text>
<text x="360" y="170" font-size="13" fill="#15201e">Many strings, one family:</text>
<g font-size="12" fill="#56655f"><text x="370" y="196">CRISPR · CRISPR/Cas · CRISPR cas</text><text x="370" y="214">R-M · RM · restriction modification</text><text x="370" y="232">Abi · abortive infection system</text></g>
<text x="360" y="266" font-size="13" fill="#15201e">→ DEFENSE_FAMILY:&lt;NAME&gt;</text>
<rect x="650" y="70" width="280" height="330" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="790" y="104" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">3. GO term policy</text>
<text x="790" y="130" font-size="12" text-anchor="middle" fill="#0e6b66">this project</text>
<text x="670" y="170" font-size="13" fill="#15201e">Per family: which GO term,</text>
<text x="670" y="188" font-size="13" fill="#15201e">which relation, automatic or</text>
<text x="670" y="206" font-size="13" fill="#15201e">review-only, and why.</text>
<text x="670" y="242" font-size="12" fill="#56655f">Versioned in registry.yaml,</text>
<text x="670" y="258" font-size="12" fill="#56655f">so any predictor gets the</text>
<text x="670" y="274" font-size="12" fill="#56655f">same policy.</text>
</g>
<text x="30" y="450" font-size="13" fill="#15201e">Mixing all three inside one predictor or database parser turns GO policy into ad hoc conditionals.</text>
<text x="30" y="472" font-size="12" fill="#56655f">Source: projects/PROKARYOTIC_IMMUNITY_TERM_PREDICTION.md; src/ai_gene_review/defense_go/registry.yaml</text>
</svg>
