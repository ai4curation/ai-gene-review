<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Evidence tiers for assigning a transporter, and where ABCD3 stands</text>
  <text x="32" y="64" font-size="15" fill="#56655f">Most resolved black box events should draw on at least two tiers</text>
  <g font-size="14">
    <rect x="32" y="86" width="640" height="68" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="48" y="112" font-weight="bold" fill="#15201e">Tier 1 · Direct reconstitution</text>
    <text x="48" y="136" font-size="13" fill="#56655f">purified transporter in proteoliposomes moves the substrate</text>
    <rect x="32" y="164" width="640" height="68" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
    <text x="48" y="190" font-weight="bold" fill="#15201e">Tier 2 · Loss of function with metabolite accumulation</text>
    <text x="48" y="214" font-size="13" fill="#56655f">patient or knockout accumulates substrate on the source side</text>
    <rect x="32" y="242" width="640" height="68" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
    <text x="48" y="268" font-weight="bold" fill="#15201e">Tier 3 · Structural mechanism</text>
    <text x="48" y="292" font-size="13" fill="#56655f">substrate bound in the pathway; alternating-access states</text>
    <rect x="32" y="320" width="640" height="68" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
    <text x="48" y="346" font-weight="bold" fill="#15201e">Tier 4 · Phylogenetic inference</text>
    <text x="48" y="370" font-size="13" fill="#56655f">ortholog activity transferred by ISS / IBA</text>
    <rect x="32" y="398" width="640" height="68" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="48" y="424" font-weight="bold" fill="#15201e">Tier 5 · Computational prediction</text>
    <text x="48" y="448" font-size="13" fill="#56655f">domains, classifiers, docking: candidates only</text>
  </g>
  <!-- ABCD3 column -->
  <text x="700" y="106" font-size="15" font-weight="bold" fill="#0e6b66">ABCD3 bile-acid CoA import</text>
  <text x="700" y="130" font-size="13" fill="#56655f">not shown for bile-acid substrates</text>
  <text x="700" y="140" font-size="11" fill="#56655f">(ABCD1-4 ATPase: PMID:29397936)</text>
  <circle cx="712" cy="198" r="12" fill="#1d8a4b"/><text x="712" y="203" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">✓</text>
  <text x="732" y="194" font-size="13" fill="#15201e">deficient patient: C27</text>
  <text x="732" y="211" font-size="13" fill="#15201e">intermediates (PMID:25168382)</text>
  <circle cx="712" cy="276" r="12" fill="#1d8a4b"/><text x="712" y="281" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">✓</text>
  <text x="732" y="272" font-size="13" fill="#15201e">cryo-EM with DHCA-CoA,</text>
  <text x="732" y="289" font-size="13" fill="#15201e">THCA-CoA (PMID:39223112)</text>
  <circle cx="712" cy="354" r="12" fill="#1d8a4b"/><text x="712" y="359" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">✓</text>
  <text x="732" y="350" font-size="13" fill="#15201e">ISS/IBA bile acid and</text>
  <text x="732" y="367" font-size="13" fill="#15201e">transporter rows accepted</text>
  <text x="700" y="490" font-size="13" fill="#15201e">Tiers 2, 3 and 4 converge</text>
</svg>
