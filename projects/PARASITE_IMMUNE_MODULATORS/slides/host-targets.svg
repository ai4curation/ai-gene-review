<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <!-- bat saliva -->
  <rect x="20" y="20" width="250" height="480" rx="16" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="36" y="46" font-size="14" font-weight="bold" fill="#56655f">VAMPIRE BAT SALIVA</text>
  <text x="36" y="64" font-size="11" fill="#56655f">reviewed DESRO entries (UniProt)</text>
  <g font-size="12.5" fill="#15201e">
    <text x="36" y="104"><tspan font-weight="bold">K9IJK6</tspan> t-plasminogen activator</text>
    <text x="36" y="124"><tspan font-weight="bold">K9IMD0</tspan> lactotransferrin (Draculin)</text>
    <text x="36" y="144"><tspan font-weight="bold">K9IZA2</tspan> Kunitz inhibitor 2</text>
    <text x="36" y="164"><tspan font-weight="bold">K9IYM3</tspan> C1 inhibitor-like serpin</text>
    <text x="36" y="184"><tspan font-weight="bold">K9IUF6</tspan> ADAMTS1</text>

    <text x="36" y="236"><tspan font-weight="bold">K9J287</tspan> DNase I-like 1</text>
    <text x="36" y="256"><tspan font-weight="bold">K9IIP0</tspan> TSG-6 (TNFAIP6)</text>
    <text x="36" y="276"><tspan font-weight="bold">K9IFY6</tspan> CCL28-like chemokine</text>
    <text x="36" y="296"><tspan font-weight="bold">K9IWR0</tspan> lymphotoxin-alpha</text>
    <text x="36" y="316"><tspan font-weight="bold">K9J2R0</tspan> DPP4</text>

    <text x="36" y="368"><tspan font-weight="bold">K9IFT7</tspan> beta-defensin 1</text>
    <text x="36" y="388"><tspan font-weight="bold">K9IWH5</tspan> lysozyme (LYZ)</text>

    <text x="36" y="440"><tspan font-weight="bold">K9IWC0</tspan> natriuretic peptide</text>
    <text x="36" y="460"><tspan font-weight="bold">K9IWX5</tspan> CAP/CRISP protein</text>
  </g>
  <!-- brackets and arrows -->
  <g stroke="#0e6b66" stroke-width="2" fill="none">
    <path d="M262 90 v100"/><path d="M262 222 v100"/><path d="M262 354 v40"/><path d="M262 426 v40"/>
  </g>
  <g stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)">
    <line x1="262" y1="140" x2="442" y2="140"/><line x1="262" y1="272" x2="442" y2="272"/><line x1="262" y1="374" x2="442" y2="374"/><line x1="262" y1="446" x2="442" y2="446"/>
  </g>
  <!-- host processes -->
  <rect x="430" y="20" width="510" height="480" rx="16" fill="#fbf3ea" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="446" y="46" font-size="14" font-weight="bold" fill="#56655f">PREY (HOST): what the saliva is thought to act on</text>
  <g font-size="13">
    <rect x="444" y="108" width="480" height="64" rx="8" fill="#ffffff" stroke="#0e6b66"/>
    <text x="460" y="132" font-weight="bold" fill="#15201e">Hemostasis: keep blood flowing</text>
    <text x="460" y="152" font-size="11.5" fill="#56655f">fibrinolysis, protease inhibition of the clotting cascade</text>
    <rect x="444" y="240" width="480" height="64" rx="8" fill="#ffffff" stroke="#0e6b66"/>
    <text x="460" y="264" font-weight="bold" fill="#15201e">Inflammation and immune cells</text>
    <text x="460" y="284" font-size="11.5" fill="#56655f">NET-degrading DNases, TSG-6, chemokine and cytokine homologues</text>
    <rect x="444" y="344" width="480" height="60" rx="8" fill="#ffffff" stroke="#0e6b66"/>
    <text x="460" y="368" font-weight="bold" fill="#15201e">Microbes at the wound</text>
    <text x="460" y="388" font-size="11.5" fill="#56655f">antimicrobial peptides and enzymes</text>
    <rect x="444" y="416" width="480" height="60" rx="8" fill="#ffffff" stroke="#0e6b66"/>
    <text x="460" y="440" font-weight="bold" fill="#15201e">Vessel tone and other</text>
    <text x="460" y="460" font-size="11.5" fill="#56655f">vasoactive peptide; CAP superfamily of uncertain target</text>
  </g>
  <text x="446" y="66" font-size="11" fill="#56655f">Our grouping, from the page background and UniProt names: hypotheses, not GO calls.</text>
</svg>
