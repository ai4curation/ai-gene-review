<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>

  <!-- left: hypothesis -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#15201e">Hypothesis</text>
  <text x="40" y="62" font-size="14" fill="#56655f">An InterPro entry lumps several Pfams, so its term</text>
  <text x="40" y="80" font-size="14" fill="#56655f">must be general. Each Pfam might carry a sharper one.</text>
  <rect x="60" y="110" width="340" height="60" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="230" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#15201e">InterPro entry</text>
  <text x="230" y="156" text-anchor="middle" font-size="13" fill="#0e6b66">interpro2go: general term</text>
  <g font-size="13" fill="#15201e" text-anchor="middle">
    <rect x="60" y="220" width="100" height="40" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="110" y="245">Pfam A</text>
    <rect x="180" y="220" width="100" height="40" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="230" y="245">Pfam B</text>
    <rect x="300" y="220" width="100" height="40" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="350" y="245">Pfam C</text>
  </g>
  <g stroke="#8fa39c" stroke-width="1.5"><line x1="110" y1="220" x2="180" y2="170"/><line x1="230" y1="220" x2="230" y2="170"/><line x1="350" y1="220" x2="280" y2="170"/></g>
  <g font-size="12" fill="#1d68b3" text-anchor="middle">
    <text x="110" y="282">specific term a?</text><text x="230" y="282">specific term b?</text><text x="350" y="282">specific term c?</text>
  </g>

  <!-- right: reality -->
  <line x1="480" y1="30" x2="480" y2="300" stroke="#8fa39c" stroke-dasharray="4 4"/>
  <text x="510" y="40" font-size="20" font-weight="700" fill="#15201e">What the files show</text>
  <text x="510" y="62" font-size="14" fill="#56655f">pfam2go header: "generated from data supplied by</text>
  <text x="510" y="80" font-size="14" fill="#56655f">InterPro for the InterPro2GO mapping"</text>
  <rect x="540" y="110" width="160" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="620" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">interpro2go</text>
  <rect x="760" y="110" width="160" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="840" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">pfam2go</text>
  <line x1="700" y1="138" x2="756" y2="138" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="728" y="128" text-anchor="middle" font-size="11" fill="#0e6b66">projected</text>
  <g font-size="15" fill="#15201e">
    <text x="540" y="206">9,871 pfam2go assertions (integrated families)</text>
    <rect x="540" y="218" width="380" height="22" fill="#1d8a4b"/>
    <rect x="918" y="218" width="2" height="22" fill="#bd3a30"/>
    <text x="540" y="262" font-size="14"><tspan font-weight="700" fill="#1d8a4b">9,844</tspan> identical to the entry's term</text>
    <text x="540" y="282" font-size="14"><tspan font-weight="700" fill="#bd3a30">0</tspan> more specific · 1 more general · 1 different · 25 release skew</text>
  </g>

  <!-- bottom: where precision can come from -->
  <line x1="40" y1="316" x2="920" y2="316" stroke="#8fa39c"/>
  <text x="40" y="348" font-size="20" font-weight="700" fill="#15201e">Where new Pfam mappings could add value: member verification</text>
  <rect x="40" y="366" width="410" height="130" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="60" y="392" font-size="16" font-weight="700" fill="#1d8a4b">Propose (5 families)</text>
  <text x="60" y="416" font-size="14" fill="#15201e">PF02431 Chalcone → chalcone isomerase</text>
  <text x="60" y="436" font-size="14" fill="#15201e">reviewed members all catalytic (CFI1_ARATH)</text>
  <text x="60" y="460" font-size="13" fill="#56655f">non-catalytic CHIL proteins sit in a different</text>
  <text x="60" y="478" font-size="13" fill="#56655f">Pfam (PF16035), which is why InterPro cannot map it</text>
  <rect x="490" y="366" width="430" height="130" rx="8" fill="#fbeceb" stroke="#bd3a30" stroke-width="2"/>
  <text x="510" y="392" font-size="16" font-weight="700" fill="#bd3a30">Reject (4 families)</text>
  <text x="510" y="416" font-size="14" fill="#15201e">PF13561 adh_short_C2 → enoyl-ACP reductase?</text>
  <text x="510" y="436" font-size="14" fill="#15201e">FabG (3-oxoacyl-ACP reductase) is in the</text>
  <text x="510" y="456" font-size="14" fill="#15201e">same Pfam as FabI</text>
  <text x="510" y="480" font-size="13" fill="#56655f">named for a function, members heterogeneous</text>
</svg>
