# Curated map from Arabidopsis thaliana pathways to repository modules.
#
# Hand-maintained input to scripts/arath_pathway_gaps.py, which checks every
# module id and gene folder named here against the repository and writes
# ARATH-pathway-gaps.yaml. Keep judgments here and computed facts in the output.
#
# Per pathway:
#   kegg:            KEGG ath maps the pathway falls under (several pathways can
#                    share a broad map, e.g. ath00500 starch and sucrose).
#   modules:         modules whose stated scope covers the pathway.
#   related_modules: modules that cover only one step, or the same chemistry in
#                    another lineage (e.g. a bacterial version). Informational;
#                    they do not count as coverage.
#   arath_genes:     reviewed folders under genes/ARATH/ that act in the pathway.
#   notes:           why the mapping is what it is.
#
# Pathway list: KEGG ath maps (https://rest.kegg.jp/list/pathway/ath, retrieved
# 2026-10-19) plus well-known plant processes that KEGG has no map for. It is
# not exhaustive; AraCyc/PMN has not been compared.

reference:
  kegg_list_url: https://rest.kegg.jp/list/pathway/ath
  kegg_retrieved: '2026-10-19'

# KEGG ath maps deliberately not mapped: global overviews, and maps that KEGG
# generates for Arabidopsis from shared orthologs but that describe animal or
# pathogen biology.
kegg_out_of_scope:
  overview: [ath01100, ath01110, ath01200, ath01210, ath01212, ath01230, ath01232,
    ath01240, ath01250, ath01310, ath01320]
  non_plant_biology: [ath00531, ath00540, ath00543, ath00601, ath00603, ath00604,
    ath00261, ath03250, ath03272, ath04082, ath04081, ath04517, ath04518, ath04519,
    ath04145, ath04148, ath04820, ath04620, ath04382, ath05100, ath04142]

