# Hand decisions for the vision-disorder scope. build_scope.py applies its mechanical
# rule first and then these; every entry here carries the reason shown on the page.

# dismech entries admitted although their disease_term is unbound or sits outside
# MONDO:0024458 "disorder of visual system".
admit_outside_visual_branch:
  BBSome-Related_Retinitis_Pigmentosa: no disease_term bound; non-syndromic retinitis pigmentosa caused by BBSome genes
  BEST1_Bestrophinopathies: no disease_term bound; every phenotype is ocular
  U4_and_U6_snRNA_Gene-Related_Retinitis_Pigmentosa: no disease_term bound; every phenotype is ocular
  Retinal_Arterial_Tortuosity: MONDO files it under vascular disease only; every phenotype is ocular
  Leber-like_Hereditary_Optic_Neuropathy_Autosomal_Recessive_1: MONDO files it under complex I deficiency only
  Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect: entry category is the free-text value 'Disease'
  CFAP418-related_Retinal_Ciliopathy: MONDO files it under ciliopathy only

# Disorders of eye movement or of the eyelids and adnexa: not disorders of the visual pathway.
motility_or_adnexal:
  - Congenital_Fibrosis_of_the_Extraocular_Muscles
  - Duane_Retraction_Syndrome
  - Duane_Retraction_Syndrome_3_With_Or_Without_Deafness
  - Blepharophimosis_Ptosis_and_Epicanthus_Inversus_Syndrome
  - Oculopharyngeal_Muscular_Dystrophy
  - Blepharocheilodontic_Syndrome_1

# Entries the phenotype-share threshold would decide wrongly. MIXED means a
# non-syndromic disease whose entry also carries a recognised syndromic arm.
force_in:
  Aniridia:
    class: NONSYNDROMIC
    reason: "isolated aniridia (PAX6); the WAGR and WT1 material is a contiguous-deletion differential"
  CAPN5-Related_Vitreoretinopathy:
    class: NONSYNDROMIC
    reason: "eye-limited disease; hearing loss and developmental delay are reported in a few carriers of particular alleles"
  ornithine_aminotransferase_deficiency:
    class: NONSYNDROMIC
    reason: "gyrate atrophy; the clinical disease is chorioretinal and hyperornithinaemia is its biochemical marker"
  Retinitis_Pigmentosa_59:
    class: NONSYNDROMIC
    reason: "non-syndromic retinitis pigmentosa; the neurological phenotypes in the entry belong to other DHDDS disorders and need checking"
  Hereditary_Hyperferritinemia_With_Congenital_Cataracts:
    class: NONSYNDROMIC
    reason: "cataract is the only clinical manifestation; hyperferritinaemia is a laboratory finding"
  Familial_Progressive_Retinal_Dystrophy-iris_Coloboma-congenital_Cataract_Syndrome:
    class: NONSYNDROMIC
    reason: "MONDO calls it a syndrome but every feature is ocular"
  Stickler_Syndrome_Type_1_Nonsyndromic_Ocular:
    class: NONSYNDROMIC
    reason: "the ocular-only COL2A1 presentation"
  Cataract_40:
    class: NONSYNDROMIC
    reason: "X-linked cataract without the Nance-Horan features"
  Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect:
    class: NONSYNDROMIC
    reason: "retinal dystrophy; acne and one patent ductus are incidental"
  Isolated_Anophthalmia-Microphthalmia_Syndrome:
    class: MIXED
    reason: "MONDO concept is isolated anophthalmia or microphthalmia; several listed genes (SOX2, OTX2) usually cause syndromic disease"
  FLVCR1-Related_Retinopathy:
    class: MIXED
    reason: "non-syndromic retinitis pigmentosa and posterior column ataxia with retinitis pigmentosa in one gene-level entry"
  Autosomal_Recessive_Optic_Atrophy_OPA7_Type:
    class: MIXED
    reason: "optic atrophy, with auditory or peripheral neuropathy in some patients"
  Leber_Hereditary_Optic_Neuropathy:
    class: MIXED
    reason: "eye-limited in most carriers, extra-ocular features in a minority; maternal (mtDNA) inheritance plus recessive DNAJC30"
  Optic_Atrophy_15:
    class: MIXED
    reason: "isolated optic atrophy and a more severe neurological presentation"
  RCBTB1-Related_Retinopathy:
    class: MIXED
    reason: "retinal dystrophy with or without extra-ocular anomalies"
  Optic_Atrophy_13_With_Retinal_And_Foveal_Abnormalities:
    class: MIXED
    reason: "optic atrophy is constant; renal and other features occur in a minority"
  NDP_Related_Vitreoretinopathy:
    class: MIXED
    reason: "eye-limited X-linked vitreoretinopathies together with Norrie disease"
  Optic_Atrophy_3:
    class: MIXED
    reason: "optic atrophy and cataract; extrapyramidal signs in some families"
  Retinitis_Pigmentosa_With_or_Without_Situs_Inversus:
    class: MIXED
    reason: "retinitis pigmentosa in all patients; situs inversus or ciliary dyskinesia in some"
  Leber-like_Hereditary_Optic_Neuropathy_Autosomal_Recessive_1:
    class: MIXED
    reason: "optic neuropathy in most patients; a Leigh-like presentation in a minority"
  CFAP418-related_Retinal_Ciliopathy:
    class: MIXED
    reason: "isolated cone-rod dystrophy or retinitis pigmentosa at one end, Bardet-Biedl syndrome at the other"

force_out:
  Uveal_Melanoma: neoplasm; its germline records are cancer predisposition
  Retinoblastoma: neoplasm
  Microcornea-Myopic_Chorioretinal_Atrophy: telecanthus and ear anomalies are part of the definition
  Pre-descemet_Corneal_Dystrophy: the STS-linked form is X-linked ichthyosis with a corneal sign
  Leber_Congenital_Amaurosis_with_Early-Onset_Deafness: deafness is part of the definition
  Choroideremia-Deafness-Obesity_Syndrome: contiguous gene deletion syndrome
  RTN4IP1-Related_Optic_Atrophy: the entry is dominated by the ataxia, intellectual disability and seizure presentation
  BMP4-Related_Ocular_Growth_Disorder: syndromic microphthalmia (pituitary, digits, brain)
  Inherited_Retinal_Dystrophy: umbrella grouping of more than 280 genes, not an entry to align gene by gene
  Corneal_Dystrophy: umbrella entry with no gene record
