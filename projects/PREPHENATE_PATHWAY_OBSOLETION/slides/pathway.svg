<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- obsolete superpathway envelope -->
  <rect x="16" y="40" width="928" height="460" rx="18" fill="none" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="36" y="66" font-size="13" font-weight="600" fill="#bd3a30">obsolete GO:0009095 covered this whole span</text><text x="920" y="66" text-anchor="end" font-size="12" fill="#56655f">plant arogenate route shown</text>
  <!-- phe branch envelope -->
  <rect x="560" y="86" width="370" height="130" rx="14" fill="#dcefec" stroke="#0e6b66"/>
  <text x="575" y="108" font-size="12.5" font-weight="600" fill="#0e6b66">GO:0009094 L-phenylalanine biosynthetic process</text>
  <rect x="560" y="304" width="370" height="130" rx="14" fill="#dcefec" stroke="#0e6b66"/>
  <text x="575" y="426" font-size="12.5" font-weight="600" fill="#0e6b66">GO:0006571 L-tyrosine biosynthetic process</text>
  <!-- metabolites -->
  <g font-size="16" font-weight="600" fill="#15201e" text-anchor="middle">
    <rect x="30" y="240" width="140" height="44" rx="22" fill="#e8f1ee" stroke="#8fa39c"/><text x="100" y="268">chorismate</text>
    <rect x="260" y="240" width="140" height="44" rx="22" fill="#e8f1ee" stroke="#8fa39c"/><text x="330" y="268">prephenate</text>
    <rect x="450" y="240" width="130" height="44" rx="22" fill="#e8f1ee" stroke="#8fa39c"/><text x="515" y="268">arogenate</text>
    <rect x="790" y="130" width="130" height="44" rx="22" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="855" y="158">L-Phe</text>
    <rect x="790" y="346" width="130" height="44" rx="22" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="855" y="374">L-Tyr</text>
  </g>
  <path d="M172 262 L256 262" stroke="#15201e" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M402 262 L446 262" stroke="#15201e" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M582 252 C 680 230, 700 170, 786 154" stroke="#15201e" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
  <path d="M582 272 C 680 294, 700 354, 786 368" stroke="#15201e" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
  <!-- enzymes -->
  <rect x="130" y="300" width="170" height="58" rx="8" fill="#1d68b3"/>
  <text x="215" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">chorismate mutase</text>
  <text x="215" y="344" text-anchor="middle" font-size="12" fill="#ffffff">e.g. Mtb Rv0948c</text>
  <path d="M215 298 L215 266" stroke="#1d68b3" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="330" y="140" width="190" height="58" rx="8" fill="#1d68b3"/>
  <text x="425" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">prephenate aminotransferase</text>
  <text x="425" y="184" text-anchor="middle" font-size="12" fill="#ffffff">Arabidopsis PAT · Petunia PPA-AT</text>
  <path d="M425 200 L425 258" stroke="#1d68b3" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="575" y="134" font-size="12.5" fill="#15201e">step: arogenate dehydratase</text>
  <text x="575" y="404" font-size="12.5" fill="#15201e">step: arogenate dehydrogenase</text>
  <!-- note -->
  <text x="30" y="410" font-size="13" fill="#56655f">Both annotated enzyme steps sit</text>
  <text x="30" y="428" font-size="13" fill="#56655f">before the Phe/Tyr branch point,</text>
  <text x="30" y="446" font-size="13" fill="#56655f">so picking one branch needs</text>
  <text x="30" y="464" font-size="13" fill="#56655f">in-vivo evidence for that product.</text>
</svg>
