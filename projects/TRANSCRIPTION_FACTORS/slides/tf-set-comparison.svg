<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">Three lists of human transcription factors, and where they disagree</text>
<text x="30" y="88" font-size="13.5" fill="#15201e">GOA GO:0003700</text>
<rect x="230" y="70" width="378" height="26" rx="3" fill="#dcefec" stroke="#0e6b66"/>
<text x="616" y="88" font-size="13" fill="#56655f">1,448</text>
<text x="30" y="128" font-size="13.5" fill="#15201e">UniProt KW-0805</text>
<rect x="230" y="110" width="620" height="26" rx="3" fill="#dcefec" stroke="#0e6b66"/>
<text x="858" y="128" font-size="13" fill="#56655f">2,376</text>
<text x="30" y="168" font-size="13.5" fill="#15201e">GREEKC curated</text>
<rect x="230" y="150" width="378" height="26" rx="3" fill="#dcefec" stroke="#0e6b66"/>
<text x="616" y="168" font-size="13" fill="#56655f">1,449</text>
<text x="30" y="212" font-size="13" fill="#56655f">KW-0805 is deliberately broader: it covers every transcription regulator, not only the sequence-specific DNA binders.</text>
<line x1="30" y1="240" x2="930" y2="240" stroke="#8fa39c"/>
<text x="30" y="268" font-size="15" font-weight="bold" fill="#0e6b66">GOA vs UniProt keyword</text>
<rect x="30" y="280" width="379" height="34" fill="#56655f"/>
<text x="220" y="302" font-size="12.5" fill="#ffffff" text-anchor="middle">1,053</text>
<text x="220" y="332" font-size="12" fill="#56655f" text-anchor="middle">UniProt only</text>
<rect x="409" y="280" width="476" height="34" fill="#0e6b66"/>
<text x="647" y="302" font-size="12.5" fill="#ffffff" text-anchor="middle">1,323</text>
<text x="647" y="332" font-size="12" fill="#56655f" text-anchor="middle">both</text>
<rect x="885" y="280" width="45" height="34" fill="#1d68b3"/>
<text x="908" y="302" font-size="12.5" fill="#ffffff" text-anchor="middle">125</text>
<text x="908" y="332" font-size="12" fill="#56655f" text-anchor="middle">GOA only</text>
<text x="30" y="356" font-size="12.5" fill="#15201e">The 1,053 UniProt-only proteins are coactivators and general factors, correctly absent from dbTF. The 125 GOA-only are keyword gaps.</text>
<text x="30" y="404" font-size="15" font-weight="bold" fill="#0e6b66">GOA vs GREEKC curated set</text>
<rect x="30" y="416" width="30" height="34" fill="#b8620f"/>
<text x="45" y="438" font-size="12.5" fill="#ffffff" text-anchor="middle">50</text>
<text x="45" y="468" font-size="12" fill="#56655f" text-anchor="middle">GREEKC only</text>
<rect x="60" y="416" width="833" height="34" fill="#1d8a4b"/>
<text x="476" y="438" font-size="12.5" fill="#ffffff" text-anchor="middle">1,385</text>
<text x="476" y="468" font-size="12" fill="#56655f" text-anchor="middle">agree, 95.6%</text>
<rect x="893" y="416" width="37" height="34" fill="#bd3a30"/>
<text x="912" y="438" font-size="12.5" fill="#ffffff" text-anchor="middle">62</text>
<text x="912" y="468" font-size="12" fill="#56655f" text-anchor="middle">GOA only</text>
<text x="30" y="496" font-size="12.5" fill="#15201e">Seven of the 62 GOA-only proteins were reviewed. All seven were over-annotated.</text>
<text x="30" y="514" font-size="11.5" fill="#56655f">Bottom bar omits 14 GREEKC isoform IDs (64 to 50); the GOA comparison file holds 1,447 IDs, not 1,448.</text>
</svg>