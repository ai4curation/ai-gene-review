<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">How a secreted guidance cue became a transcription factor</text>

  <!-- PAINT node -->
  <rect x="330" y="66" width="300" height="52" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="480" y="88" font-size="14" font-weight="bold" fill="#15201e" text-anchor="middle">PAINT node PTN000180816</text>
  <text x="480" y="107" font-size="12.5" fill="#bd3a30" text-anchor="middle">dbTF activity placed here</text>

  <path d="M480 118 V146 M200 146 H760 M200 146 V178 M760 146 V178" stroke="#8fa39c" stroke-width="1.5" fill="none"/>

  <!-- left family: POU -->
  <rect x="60" y="178" width="280" height="150" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="200" y="202" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">PTHR11636 POU DOMAIN</text>
  <text x="200" y="222" font-size="12.5" fill="#56655f" text-anchor="middle">POU2F1, POU1F1, POU5F1, POU4F1-3 …</text>
  <rect x="96" y="238" width="208" height="26" rx="3" fill="#e8f1ee" stroke="#8fa39c"/>
  <rect x="140" y="238" width="60" height="26" fill="#dcefec" stroke="#0e6b66"/>
  <rect x="212" y="238" width="52" height="26" fill="#dcefec" stroke="#0e6b66"/>
  <text x="170" y="256" font-size="10.5" fill="#0e6b66" text-anchor="middle">POU</text>
  <text x="238" y="256" font-size="10.5" fill="#0e6b66" text-anchor="middle">homeo</text>
  <path d="M110 292 q40 -16 80 0 q40 16 80 0" stroke="#0e6b66" stroke-width="2" fill="none"/>
  <path d="M110 302 q40 -16 80 0 q40 16 80 0" stroke="#0e6b66" stroke-width="2" fill="none"/>
  <text x="200" y="320" font-size="12" fill="#56655f" text-anchor="middle">binds a cis-regulatory site: the function is real here</text>

  <!-- right family: netrin -->
  <rect x="620" y="178" width="280" height="150" rx="8" fill="#fdf1f0" stroke="#bd3a30" stroke-width="1.5"/>
  <text x="760" y="202" font-size="14" font-weight="bold" fill="#bd3a30" text-anchor="middle">PTHR10574 NETRIN / LAMININ</text>
  <text x="760" y="222" font-size="12.5" fill="#56655f" text-anchor="middle">NTN1, NTN3 and relatives</text>
  <rect x="656" y="238" width="208" height="26" rx="3" fill="#ffffff" stroke="#8fa39c"/>
  <rect x="664" y="238" width="70" height="26" fill="#f6faf9" stroke="#8fa39c"/>
  <rect x="742" y="238" width="52" height="26" fill="#f6faf9" stroke="#8fa39c"/>
  <text x="699" y="256" font-size="10.5" fill="#56655f" text-anchor="middle">laminin N</text>
  <text x="768" y="256" font-size="10.5" fill="#56655f" text-anchor="middle">EGF</text>
  <text x="836" y="256" font-size="10.5" fill="#56655f" text-anchor="middle">NTR</text>
  <circle cx="700" cy="298" r="12" fill="#e8f1ee" stroke="#8fa39c"/>
  <path d="M716 298 H800" stroke="#8fa39c" stroke-width="2"/><polygon points="800,292 812,298 800,304" fill="#8fa39c"/>
  <text x="760" y="322" font-size="12" fill="#bd3a30" text-anchor="middle">secreted; no DNA-binding domain at all</text>

  <text x="352" y="252" font-size="13" fill="#15201e">two different</text>
  <text x="352" y="272" font-size="13" fill="#15201e">PANTHER families,</text>
  <text x="352" y="292" font-size="13" fill="#15201e">one shared node</text>

  <!-- result -->
  <line x1="30" y1="360" x2="930" y2="360" stroke="#8fa39c"/>
  <text x="30" y="390" font-size="15" font-weight="bold" fill="#15201e">What the reviews did</text>
  <rect x="30" y="404" width="112" height="24" rx="4" fill="#bd3a30"/>
  <text x="86" y="421" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">REMOVE</text>
  <text x="152" y="421" font-size="13" fill="#15201e">NTN1 and NTN3: dbTF activity (GO:0000981) and cis-regulatory DNA binding (GO:0000978), both IBA</text>
  <rect x="30" y="438" width="112" height="24" rx="4" fill="#b8620f"/>
  <text x="86" y="455" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">MODIFY</text>
  <text x="152" y="455" font-size="13" fill="#15201e">HDAC4, RPS3, RFXAP: to GO:0003713 transcription coactivator activity, which is what they actually do</text>
  <text x="30" y="492" font-size="13" fill="#56655f">The regulation-of-transcription rows on the netrins were left UNDECIDED rather than removed, since an indirect role is not excluded.</text>
</svg>
