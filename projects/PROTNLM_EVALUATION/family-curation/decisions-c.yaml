PTHR12514:
  preferred_name: ENY2/Sus1 transcription and mRNA export adaptors
  coherence: COHERENT
  summary: ENY2/Sus1 proteins couple transcription and nuclear mRNA export through membership in
    SAGA and TREX-2. Within SAGA they support the histone H2B deubiquitination module; within TREX-2
    they help connect export machinery to the nuclear pore. These are small noncatalytic complex
    subunits, so SAGA membership does not confer intrinsic histone acetyltransferase or deubiquitinase
    activity.
  reason: The curated InterPro entry and the ENY2/Sus1 member inventory consistently identify the
    same dual complex-associated function in fungi and animals. Individual developmental phenotypes
    and gene targets are more restricted than this conserved molecular role.
  terms:
  - GO:0006406
  - GO:0000124
PTHR12563:
  preferred_name: GPAT/DAPAT lipid acyltransferases
  coherence: HETEROGENEOUS
  summary: This family contains glycerol-3-phosphate acyltransferases and dihydroxyacetone phosphate
    acyltransferases, which initiate different branches of glycerolipid synthesis. Human GPAM/GPAT1
    transfers an acyl group to glycerol-3-phosphate at the mitochondrial outer membrane. Its experimentally
    determined membrane association uses an amphipathic surface rather than the transmembrane topology
    formerly proposed.
  reason: The member inventory includes bacterial PlsB, mitochondrial GPAT1/GPAT2 and DAPAT proteins.
    Shared acyl transfer does not establish identical acceptor specificity, organelle localization
    or acyl-chain preference. The GPAT1 structure supports GPAM inference but does not establish
    the same substrate preference for every family member.
  terms:
  - GO:0016747
  pmids:
  - '36522428'
PTHR12566:
  preferred_name: CPEB translational regulators
  coherence: COHERENT
  summary: CPEB proteins bind regulatory elements in mRNA 3-prime untranslated regions and control
    translation through cytoplasmic polyadenylation and repression mechanisms. Their conserved RNA-binding
    region combines RNA recognition motifs with a zinc-binding domain. Orb and the CPEB paralogs
    have different mRNA targets and developmental deployments, while the shared activity is post-transcriptional
    regulation rather than transcription factor activity.
  reason: The curated family definition and the CPEB1–4/Orb2 membership support conserved RNA-dependent
    translational control. Opposite regulatory outcomes on different targets do not represent loss
    of the underlying function; exact target RNAs and germline or neuronal roles must remain member-specific.
  terms:
  - GO:0045182
  - GO:0006417
PTHR12618:
  preferred_name: PHD/RING-containing Asr1-related proteins
  coherence: UNKNOWN
  summary: This group contains PHD/RING-containing proteins including human PHD and RING finger domain-containing
    protein 1, pombe Asr1 and a yeast protein catalogued as Atg36. Their shared annotation emphasizes
    protein interaction and zinc-binding domains, but the available family description explicitly
    leaves function unresolved. A RING-like domain alone does not establish a particular ubiquitin
    ligase substrate or autophagy receptor role.
  reason: The curated InterPro description calls the function unknown, and the sampled member inventory
    spans PHD/RING and Atg36 annotations. The proposed Asr1 connection to RNA polymerase II ubiquitylation
    needs a clade and domain-architecture comparison before it can be generalized to this entire
    group.
PTHR12632:
  preferred_name: NF-YA/Hap2 CCAAT-binding complex subunits
  coherence: COHERENT
  summary: NF-YA/Hap2 proteins form the sequence-recognition component of the heteromeric CCAAT-binding
    transcription factor. DNA binding and transcriptional regulation depend on assembly with the
    other NF-Y subunits. Fungal iron and oxidative-stress responses and plant developmental functions
    represent deployment of this conserved transcriptional machinery in different regulatory networks.
  reason: The inventory consistently contains NF-YA or Hap2 proteins. The relevant conserved property
    is CCAAT-binding complex participation, not a particular iron-responsive circuit or an ability
    to bind promoter DNA as an isolated polypeptide.
  terms:
  - GO:0006355
PTHR12654:
  preferred_name: GBA2 nonlysosomal glucosylceramidases
  coherence: MOSTLY_COHERENT
  summary: GBA2 proteins hydrolyze glucosylceramide outside the lysosomal GBA pathway. Human isoform-expression
    experiments show strong activity and altered ceramide balance for isoform 1, whereas the other
    tested isoforms had activity near background. An assignment of the family therefore supports
    a glycosphingolipid-metabolism hypothesis but is insufficient to declare every alternative protein
    record catalytically active.
  reason: The available member inventory is consistently GBA2, but experimentally demonstrated isoform
    differences preclude an unconditional activity grant to every protein sequence. The 799-residue
    fly CG33090 sequence requires an isoform and domain-completeness check before human isoform results
    are transferred to it.
  pmids:
  - '33261081'
PTHR12728:
  preferred_name: Rpf2 large-subunit ribosome assembly factors
  coherence: COHERENT
  summary: Rpf2 proteins are conserved Brix-domain ribosome assembly factors. Together with Rrs1
    and ribosomal proteins, they participate in incorporation and maturation of the large-subunit
    ribonucleoprotein particle. Their role is RNA binding and preribosome assembly rather than peptide
    synthesis or an intrinsic rRNA-processing nuclease reaction.
  reason: The curated InterPro entry specifically identifies Rpf2 rather than all Brix-domain proteins,
    and the sampled members are Rpf2 orthologs. Large-subunit assembly is transferable within that
    group; precise pre-rRNA intermediate names can differ among organisms.
  terms:
  - GO:0000027
PTHR12959:
  preferred_name: PIGT/Gpi16 GPI transamidase subunits
  coherence: COHERENT
  summary: PIGT/Gpi16 proteins are components of the endoplasmic-reticulum GPI transamidase complex
    that attaches glycosylphosphatidylinositol anchors to proteins. Complex membership explains participation
    in the attachment reaction, while the catalytic chemistry belongs to the assembled machinery
    and its catalytic subunit. PIGT is not a generic soluble protease simply because the complex
    processes a protein precursor.
  reason: The family definition and PIGT/Gpi16 inventory support a conserved complex-subunit role
    across the sampled eukaryotes. Intrinsic protease activity must not be transferred from the catalytic
    GPI-transamidase subunit to this family.
  terms:
  - GO:0016255
  - GO:0042765
PTHR13131:
  preferred_name: Cystinosin cystine transporters
  coherence: COHERENT
  summary: Cystinosins are membrane proteins that export cystine from the lysosomal or vacuolar lumen.
    The experimentally annotated Drosophila Ctns record supports a cystine/proton transport function
    and a role in maintaining cysteine availability during fasting. Effects on mTORC1, autophagy
    and metabolism follow from this transport role and are not independent transport substrates.
  reason: Curated InterPro describes the cystinosin group, including yeast ERS1, and the fly record
    cites direct experimental evidence for lysosomal cystine export. Transport is a defensible conserved
    family function; mammalian disease phenotypes and particular starvation signaling outputs are
    lineage-specific extensions.
PTHR13205:
  preferred_name: Polyprenol kinases including dolichol kinase
  coherence: MOSTLY_COHERENT
  summary: Dolichol kinases phosphorylate the polyprenol carrier used in protein glycosylation and
    GPI-anchor synthesis, using CTP as donor. The integrated InterPro group also includes plant phytol
    kinases involved in tocopherol biosynthesis. The lipid substrate and metabolic pathway therefore
    need to be resolved independently of the shared membrane-associated kinase architecture.
  reason: The sampled PANTHER entries are dolichol kinases, whereas the integrated polyprenol-kinase
    definition spans dolichol and phytol phosphorylation. Sec59 is supported as a dolichol-kinase
    ortholog by curated UniProt inference to budding-yeast Sec59; extension of that substrate to
    unsampled plant branches remains unresolved.
PTHR13283:
  preferred_name: KRIT1 and FRMD8 FERM-domain adaptors
  coherence: HETEROGENEOUS
  summary: This family includes KRIT1, a Rap1-associated component of the cerebral cavernous malformation
    signaling machinery, and FRMD8-related proteins. KRIT1 stabilizes cell junctions and contributes
    to endothelial polarity through regulated protein interactions. The common FERM-domain architecture
    supports adaptor functions but does not make the FRMD8 branch a vascular CCM component.
  reason: Both KRIT1 and FRMD8 are present in the member inventory. Endothelial-junction stabilization,
    CCM signaling and the specific Rap1 interaction should be assigned to characterized KRIT1 orthologs
    rather than the family root.
PTHR13393:
  preferred_name: RlmF/METTL16 and related SAM-dependent methyltransferases
  coherence: HETEROGENEOUS
  summary: Members include bacterial rRNA methyltransferase RlmF, eukaryotic METTL16/U6 RNA methyltransferases
    and proteins catalogued as psilocybin synthases. METTL16-dependent U6 modification connects RNA
    methylation to splicing; vertebrate MAT2A regulation is an additional regulatory deployment.
    Neither a U6 substrate nor RNA methylation itself follows automatically from this broad PANTHER
    assignment.
  reason: The member inventory contains RlmF, METTL16 and small-molecule methyltransferases, whereas
    the integrated InterPro prose emphasizes the first two groups. Substrate class and RNA target
    therefore require subfamily-level evidence. Fungal NCU11362 should be compared with the METTL16
    branch, not bacterial RlmF or specialized-metabolite enzymes. SF0 itself contains RlmF, METTL16
    and PsiM entries, so this boundary cannot be represented by granting a substrate-specific term
    to SF0.
  terms:
  - GO:0008168
PTHR13408:
  preferred_name: RPC4/C53 RNA polymerase III subunits
  coherence: COHERENT
  summary: RPC4/C53 proteins are noncatalytic subunits of RNA polymerase III. They help organize
    the transcription complex and its initiation, termination and reinitiation behavior through association
    with other polymerase subunits. Participation in RNA synthesis does not mean that an isolated
    RPC4 protein catalyzes phosphodiester-bond formation.
  reason: The sampled entries consistently identify RPC4, and the curated InterPro entry assigns
    this group to polymerase III. Complex membership and transcription by polymerase III are transferable;
    generic RNA polymerase catalytic activity is not an intrinsic activity of this subunit.
  terms:
  - GO:0005666
  - GO:0006383
PTHR13667:
  preferred_name: Fritz/WDPCP polarity and ciliogenesis effectors
  coherence: COHERENT
  summary: Fritz/WDPCP proteins organize cytoskeletal and membrane-associated machinery involved
    in cell polarity and ciliogenesis. Mammalian WDPCP participates in the CPLANE machinery that
    recruits intraflagellar transport components, while fly Fritz is associated with patterned wing-cell
    protrusions. These are related cellular organization functions, not evidence for a catalytic
    activity encoded by the WD-repeat fold.
  reason: The family inventory is confined to Fritz/WDPCP orthologs. The common scaffold/effector
    role is coherent, but a cilium-specific process is not an unconditional description of every
    tissue or lineage in which these proteins act.
PTHR13980:
  preferred_name: Spt16 FACT histone chaperones
  coherence: COHERENT
  summary: Spt16 is the large subunit of FACT, a histone chaperone that reorganizes nucleosomes while
    preserving chromatin integrity. Its amino-terminal aminopeptidase-like fold binds histones H3
    and H4. Structural and biochemical work on pombe Spt16 establishes a nonenzymatic histone-binding
    function for that fold, rather than aminopeptidase catalysis.
  reason: The family members are Spt16 orthologs, and direct pombe structural evidence separates
    the conserved histone-binding module from the ancestral-looking enzyme fold. FACT participation
    is a strong family-level assignment; peptidase activity is not supported by the fold resemblance.
  terms:
  - GO:0035101
  pmids:
  - '18579787'
PTHR14338:
  preferred_name: AFAP actin-associated signaling adaptors
  coherence: HETEROGENEOUS
  summary: AFAP1, AFAP1L1 and AFAP1L2/XB130 are PH-domain-containing adaptor proteins associated
    with actin and membrane signaling. Their interaction regions recruit different signaling partners
    rather than catalyzing a shared chemical reaction. AFAP1L2 evidence for signal transduction should
    be interpreted in the context of that paralog's architecture and partners.
  reason: The inventory contains all three AFAP paralog groups. Membrane recruitment and adaptor
    architecture are shared, but direct actin interactions, kinase partnerships and downstream signaling
    outputs are not interchangeable between AFAP1 and XB130.
PTHR14440:
  preferred_name: Rpa49 RNA polymerase I accessory subunits
  coherence: COHERENT
  summary: Rpa49 is an accessory subunit of RNA polymerase I that supports efficient ribosomal DNA
    transcription. The polymerase can retain activity when Rpa49 is deleted, indicating a stimulatory
    and organizational role rather than independent RNA polymerase catalysis. Its conserved function
    is linked to the specialized rRNA transcription machinery.
  reason: The family inventory consistently identifies Rpa49. The curated InterPro description and
    yeast deletion analyses support polymerase-I-associated transcriptional efficiency; they do not
    support assigning catalytic RNA polymerase activity to isolated Rpa49.
PTHR14495:
  preferred_name: SHLD2 shieldin DNA-repair subunits
  coherence: COHERENT
  summary: SHLD2 is a component of shieldin, a DNA-end protection complex acting in double-strand-break
    repair. Its DNA-associated and complex-assembly functions regulate access of repair machinery
    to damaged DNA. Shieldin participation is mechanistically distinct from DNA synthesis, helicase
    activity or nuclease activity.
  reason: The available family members are SHLD2 orthologs and the curated family description identifies
    the same shieldin complex. Specific immunological outcomes such as antibody class switching require
    the relevant vertebrate context and should not be elevated to a universal family function.
PTHR14773:
  preferred_name: DRS1-related WD-repeat DNA-associated proteins
  coherence: UNKNOWN
  summary: DRS1-related proteins are WD-repeat proteins associated in database descriptions with
    DNA-damage recognition and modified-DNA binding. For the Arabidopsis member, the retrieved 5-hydroxymethylcytosine-reader
    statement is generated by ARBA. That statement does not establish recognition of 5hmC by the
    plant protein or justify transferring a mammalian epigenetic mechanism to the family.
  reason: The available family description is unchecked LLM-generated text and the decisive Arabidopsis
    functional statement has ARBA provenance. Direct evidence distinguishing damaged-DNA recognition,
    ordinary DNA binding and 5hmC recognition is needed before a coherent family activity can be
    assigned. The WD-repeat architecture alone does not resolve that question.
PTHR15245:
  preferred_name: Symplekin/Pta1 RNA 3-prime processing scaffolds
  coherence: COHERENT
  summary: Symplekin and Pta1 are scaffolding components of eukaryotic RNA 3-prime-end processing
    machinery. They organize cleavage/polyadenylation factors and associated regulatory components.
    Historical names referring to pre-tRNA processing do not define an intrinsic endonuclease reaction
    for the family.
  reason: The inventory links animal symplekin with fungal Pta1 and the curated pombe record supports
    cleavage/polyadenylation-complex membership by orthology. The conserved scaffolding role is coherent;
    catalytic cleavage and poly(A) polymerization belong to other components.
PTHR15256:
  preferred_name: DGCR2-related membrane adhesion proteins
  coherence: UNKNOWN
  summary: DGCR2 is a membrane-associated adhesion protein implicated by mammalian studies in early
    cortical development. The fly CG42404 protein belongs to the same PANTHER group, but the retrieved
    family evidence does not identify its interaction partners or a conserved Reelin-dependent mechanism.
    A developmental phenotype in vertebrate cortex does not by itself define a transferable molecular
    activity.
  reason: The curated InterPro description is based on mammalian DGCR2 functions, while the fly branch
    lacks equivalent functional characterization in the supplied sources. Conserved adhesion versus
    a different membrane-interaction role remains unresolved; schizophrenia association is not a
    family function.
PTHR15921:
  preferred_name: Pcf11 transcription-termination and RNA-processing factors
  coherence: COHERENT
  summary: Pcf11 couples RNA polymerase II termination to pre-mRNA 3-prime-end processing through
    interactions with the polymerase and cleavage/polyadenylation machinery. Its function depends
    on a multidomain protein and association with factors such as Clp1. A short fragment matching
    part of Pcf11 cannot be assumed to carry all functions of the intact protein.
  reason: The curated InterPro family is functionally specific for Pcf11 across animals, fungi and
    plants. The benchmark fly record C0P8M6 is only 86 amino acids, so the gene-family assignment
    is meaningful but full termination-factor activity on that exact sequence is unresolved until
    its relationship to the complete isoform is established.
PTHR16515:
  preferred_name: Diverse C2H2 zinc-finger regulatory proteins
  coherence: HETEROGENEOUS
  summary: This broad group contains multiple zinc-finger transcription regulators, including Krueppel-like
    proteins, PLAG proteins and PRDM proteins. Some branches carry additional chromatin-regulatory
    domains, whereas others primarily recognize DNA through zinc-finger arrays. Drosophila Dati has
    a demonstrated role in specific neuronal circuits, but this behavior is not a family-wide property.
  reason: The member inventory spans unrelated regulatory deployments and distinct domain architectures.
    Histone methyltransferase activity from a PRDM branch cannot be transferred to Dati, and DNA-target
    specificity cannot be inferred from a generic zinc-finger match.
  pmids:
  - '25291190'
PTHR18896:
  preferred_name: Classical phospholipase D lipid-signaling enzymes
  coherence: MOSTLY_COHERENT
  summary: Classical phospholipase D proteins hydrolyze glycerophospholipids to phosphatidic acid
    and a released head group. The family includes animal PLD1/PLD2 and multiple plant PLD classes
    with different regulatory and membrane-interaction features. Lipid hydrolysis is the common mechanistic
    theme, while stimulus dependence, preferred substrates and cellular signaling outputs vary.
  reason: The curated InterPro definition supports phospholipase D chemistry and the inventory contains
    classical plant and animal PLDs. Exact substrate and regulatory claims should be restricted to
    the characterized paralog. No member-specific catalytic-residue loss is established by these
    sources.
PTHR18901:
  preferred_name: Diverse HAD-like phosphatases and phosphomutases
  coherence: HETEROGENEOUS
  summary: This HAD-like family contains pseudouridine-5-prime-phosphatases, glycerol-3-phosphatases,
    carbohydrate phosphatases and beta-phosphoglucomutase. The shared fold supports phosphate-group
    chemistry but does not specify the physiological substrate or distinguish hydrolysis from intramolecular
    phosphate transfer. Human HDHD1/PUDP is experimentally selective for pseudouridine 5-prime-phosphate.
  reason: The member inventory directly contradicts any single-substrate family assignment. For fly
    CG5565, a pseudouridine-phosphatase hypothesis requires placement with characterized PUDP proteins
    and assessment of substrate-recognition features; a HAD-domain match is insufficient.
  pmids:
  - '20722631'
PTHR18934:
  preferred_name: DEAH-related nucleic-acid helicases
  coherence: HETEROGENEOUS
  summary: This family spans DEAH-related helicases with roles in RNA processing, genome defense
    and other nucleic-acid transactions, as well as viral proteins. Distinct accessory domains and
    interaction partners determine substrate choice and biological deployment. The YTHDC2 branch
    couples helicase activity to modified-RNA recognition, but that specialization is not shared
    by all family members.
  reason: The inventory includes DHX8, DHX30, DHX36, TDRD9, spindle-E and viral NPH-II-like proteins.
    Neither a meiotic role nor m6A recognition follows from the helicase-family assignment of fly
    CG8915; those require the appropriate accessory-domain and orthology evidence.
  pmids:
  - '29033321'
PTHR19143:
  preferred_name: Fibrinogen-domain extracellular interaction proteins
  coherence: HETEROGENEOUS
  summary: This family groups proteins carrying a fibrinogen C-terminal interaction domain, including
    ficolins, fibroleukin, microfibril-associated proteins and angiopoietin-related proteins. Their
    functions range from ligand recognition to extracellular structural and signaling roles. The
    domain name does not imply that every member contributes to fibrin clot formation.
  reason: The member inventory contains distinct secreted-protein architectures and functional groups.
    Carbohydrate specificity, complement activation and vascular signaling cannot be transferred
    indiscriminately to fly CG10359. The unchecked generated InterPro summary is treated as a source
    lead rather than proof of those activities.
PTHR19303:
  preferred_name: CENP-B and transposon-derived DNA-binding proteins
  coherence: HETEROGENEOUS
  summary: CENP-B-related proteins illustrate evolutionary recruitment of transposon-derived DNA-binding
    machinery into host chromatin regulation. Pombe Cbh1 binds centromeric repeat DNA, and related
    pombe proteins participate in retrotransposon silencing and genome organization. The broader
    group also includes other domesticated transposon-derived regulators, so centromere binding and
    active transposition are separate hypotheses.
  reason: Direct Cbh1 binding experiments and pombe retrotransposon-surveillance studies support
    host DNA-binding functions, while the inventory includes multiple Tigger-derived and PDC2 proteins.
    Shared ancestry does not establish retained transposase activity. The generated InterPro passage
    about chaetoglobosin synthesis is not used as biological evidence for this family.
  pmids:
  - '9237993'
  - '18094683'
PTHR19847:
  preferred_name: DCAF11/WDR23 ubiquitin-ligase substrate adaptors
  coherence: MOSTLY_COHERENT
  summary: DCAF11/WDR23-related proteins are WD-repeat adaptors associated with CUL4-DDB1 ubiquitin-ligase
    regulation. Their proposed role is substrate recruitment rather than ubiquitin-transfer chemistry
    intrinsic to the adaptor. A particular SKN-1-dependent stress response or manganese-neuron phenotype
    does not define the whole family.
  reason: The member inventory is dominated by DCAF11/WDR23-related proteins. The independently retrieved
    canonical worm WDR23 record cites direct studies of lifespan, manganese responses and SKN-1 regulation,
    and human DCAF11 has experimental sources for a possible CUL4-DDB1 substrate-receptor role. These
    support the adaptor lineage, while exact substrate specificity and transfer of worm phenotypes
    to every member remain unresolved.
PTHR19861:
  preferred_name: Swd2/WDR82 RNA and chromatin complex adaptors
  coherence: MOSTLY_COHERENT
  summary: Swd2/WDR82 proteins are WD-repeat components of Set1/COMPASS-associated transcription
    and chromatin machinery. Fungal proteins can also participate in RNA 3-prime processing complexes.
    Their presence in a histone methyltransferase complex does not confer methyltransferase catalysis
    on the WD-repeat protein itself.
  reason: The curated InterPro entry supports Set1/COMPASS participation across fungi and animals,
    but the family includes duplicated fungal proteins whose complex assignments need distinction.
    The fly CG3515 assignment supports this adaptor lineage without establishing every fungal RNA-processing
    function in flies.
PTHR19876:
  preferred_name: Coatomer, LIS1 and other WD-repeat interaction proteins
  coherence: HETEROGENEOUS
  summary: This PANTHER group combines coatomer subunits with LIS1/NudF, mitochondrial-division factors
    and Crt10-related proteins. These proteins use related interaction scaffolds in distinct cellular
    machines. Budding-yeast Crt10 recruits a cullin-E3 ligase pathway to nonfunctional large-subunit
    rRNA decay rather than acting as a COPI coat subunit.
  reason: The member inventory contains COPI alpha/beta-prime, LIS1 and Mdv1 proteins, and experimental
    Crt10 work supports a separate rRNA-quality-control role. The official coatomer name is not a
    safe family-wide functional label and does not establish Golgi trafficking for pombe Crt10.
  pmids:
  - '25534857'
PTHR19970:
  preferred_name: eL39 large-ribosomal-subunit proteins
  coherence: COHERENT
  summary: eL39 is a small structural protein of the eukaryotic large ribosomal subunit. Its location
    in the assembled ribosome supports translation and influences the environment encountered by
    a nascent chain. Its short length is normal for this ribosomal protein family and is not itself
    evidence of a truncated nonfunctional protein.
  reason: The inventory consistently contains eL39 and closely related paralogs, and a Neurospora
    ribosome structure provides organism-relevant structural context. Broad structural-ribosome participation
    is supported; individual paralog-specific developmental or translational phenotypes require separate
    evidence.
PTHR20837:
  preferred_name: CC2D2A/CC2D2B ciliary-associated proteins
  coherence: MOSTLY_COHERENT
  summary: CC2D2A participates in the transition-zone machinery that maintains the ciliary membrane
    as a distinct signaling compartment. Disruption of the complex alters cilia formation and receptor
    retention. The family also contains CC2D2B-related proteins, whose presence does not by itself
    establish the same transition-zone role.
  reason: Direct mammalian complex studies support CC2D2A-dependent organization of the ciliary diffusion
    barrier. The member inventory includes the CC2D2B paralog, so a blanket grant of every CC2D2A
    function is premature without comparative localization and domain evidence for that branch.
  pmids:
  - '22179047'
PTHR20898:
  preferred_name: DUF1091/Daedalus-related proteins
  coherence: UNKNOWN
  summary: This group contains small DUF1091-domain proteins, including fly CG33453. The available
    sequence-domain assignments establish a conserved protein family but do not identify a biochemical
    reaction, interaction partner or organelle-specific mechanism. The Daedalus-related name is not
    a functional assay.
  reason: There is no integrated InterPro functional description or experimental reference in the
    available target evidence, and the 174-residue target is annotated with DUF1091. Functional coherence
    cannot be resolved from an uncharacterized-domain label; a conserved-domain alignment and experimentally
    characterized ortholog are needed.
PTHR21255:
  preferred_name: Tctex-type dynein light chains
  coherence: HETEROGENEOUS
  summary: Tctex-type proteins are small noncatalytic dynein-associated subunits with distinct roles
    in cytoplasmic and ciliary transport assemblies. DYNLT2B/TCTEX1D2 is an accessory component of
    dynein-2 required for efficient retrograde intraflagellar transport. ATP-driven motility belongs
    to the dynein motor machinery rather than the light chain itself.
  reason: The member inventory contains several Tctex paralogs, and direct TCTEX1D2 experiments define
    its dynein-2 specialization. Rhodopsin-binding observations for Tctex-1 cannot be used to assign
    that cargo or a photoreceptor-specific role to DYNLT2B or every family member.
  pmids:
  - '29742051'
PTHR21467:
  preferred_name: PPP4R4 phosphatase regulatory subunits
  coherence: COHERENT
  summary: PPP4R4 is a putative regulatory subunit of protein phosphatase 4. Its family identity
    supports a phosphatase-associated regulatory role rather than an intrinsic phosphoprotein-hydrolysis
    reaction. The catalytic subunit and the regulatory component should remain distinct in functional
    annotation.
  reason: Both the curated InterPro description and the small available member inventory identify
    PPP4R4 orthologs. The limited functional characterization warrants retaining the qualifier on
    its regulatory role and withholding substrate-specific PP4 functions until the relevant holoenzyme
    has been demonstrated.
PTHR21575:
  preferred_name: HID1-family Golgi and secretory-pathway proteins
  coherence: MOSTLY_COHERENT
  summary: HID1-family proteins participate in Golgi and secretory-pathway organization, including
    dense-core-vesicle cargo sorting in characterized animal systems. The family extends to fungi,
    which lack the same neuroendocrine secretory context. Conserved intracellular trafficking is
    a better transfer hypothesis than dauer regulation or neuronal secretion across the whole family.
  reason: The curated InterPro entry describes HID1 conservation but the member inventory also includes
    fungal Ecm30 and multiple pombe Hid proteins. The animal dense-core-vesicle mechanism requires
    branch-specific interpretation rather than automatic transfer to all fungal members.
PTHR21600:
  preferred_name: RluA-related RNA pseudouridine synthases
  coherence: HETEROGENEOUS
  summary: RluA-related enzymes isomerize uridine to pseudouridine in RNA, but family branches act
    on different rRNAs, tRNAs and other RNA substrates. The inventory includes RluC, RluD, TruC and
    organellar RNA-modification proteins. Fly RluA-1 and RluA-2 have experimentally demonstrated
    neuronal phenotypes without those phenotypes identifying their modified RNA nucleotide.
  reason: RNA class, modification position and compartment differ among the named member groups.
    The fly nociception study describes the proteins as putative pseudouridine synthases and does
    not establish a specific tRNA or mRNA target. The ARBA-derived target positions in the fly UniProt
    record are not independent substrate evidence.
  pmids:
  - '33028630'
PTHR21646:
  preferred_name: Diverse ubiquitin-specific proteases
  coherence: HETEROGENEOUS
  summary: Ubiquitin-specific proteases remove ubiquitin from proteins and ubiquitin chains, with
    paralog-specific substrate selection and regulatory interactions. USP8/UBPY acts on endosomal
    ubiquitin dynamics and receptor trafficking. Its deubiquitination can facilitate receptor down-regulation,
    so ubiquitin removal should not be equated universally with stabilization of the target protein.
  reason: The inventory spans USP4, USP5, USP8, USP13, USP20, USP22 and other paralogs. Shared ubiquitin-processing
    chemistry does not justify transferring an EGFR substrate, an endosomal localization or a particular
    linkage preference to every family member.
  pmids:
  - '16520378'
PTHR21738:
  preferred_name: Rrp36 small-subunit ribosome biogenesis factors
  coherence: COHERENT
  summary: Rrp36 proteins participate in early pre-rRNA processing and small-ribosomal-subunit biogenesis.
    They are preribosomal assembly factors rather than structural constituents of the mature ribosome.
    A requirement for cleavage at an early processing step does not establish intrinsic nuclease
    activity.
  reason: The inventory consistently identifies Rrp36 orthologs and the curated InterPro description
    supports early pre-rRNA processing. Pombe orthology supports the same maturation pathway, while
    direct cleavage chemistry should remain assigned to the relevant catalytic component.
PTHR22594:
  preferred_name: Aspartyl/asparaginyl tRNA synthetase-related proteins
  coherence: HETEROGENEOUS
  summary: This group joins related class-II aminoacyl-tRNA synthetases with aspartate or asparagine
    specificity. Human mitochondrial DARS2 directly catalyzes aspartylation of tRNA and is distinct
    from the cytosolic translation machinery. Similar catalytic architecture does not establish the
    same amino acid, tRNA substrate or cellular compartment for every member.
  reason: The official family definition explicitly spans Asp/Asn ligases, while biochemical characterization
    establishes DARS2 as mitochondrial AspRS. A DARS2 annotation should be scoped to the mitochondrial
    AspRS lineage rather than transferred across the amino-acid specificity boundary. DARS2 can also
    be assayed for misacylation of tRNA-Asn; that is a separate substrate question and does not make
    it an asparagine-activating enzyme.
  pmids:
  - '15779907'
PTHR22726:
  preferred_name: OMA1 and bacterial membrane-associated metalloproteases
  coherence: HETEROGENEOUS
  summary: OMA1 is a mitochondrial membrane metalloprotease involved in stress-responsive protein
    processing. Mammalian OMA1 cleaves OPA1 and participates in pathways that couple mitochondrial
    damage to cellular responses. Related bacterial proteins act in outer-membrane protein quality
    control, providing a distinct substrate and compartment context.
  reason: The inventory contains OMA1, YggG/LoiP/YcaL and beta-barrel assembly-enhancing proteases.
    Shared metalloprotease ancestry does not transfer OPA1 processing, DELE1 signaling or a mitochondrial
    location to bacterial members. Exact catalytic-residue claims require an anchored sequence analysis
    beyond the family name.
  pmids:
  - '20038677'
PTHR22808:
  preferred_name: Ncl1/Trm4-related RNA cytosine methyltransferases
  coherence: HETEROGENEOUS
  summary: These SAM-dependent RNA methyltransferases modify the C5 position of cytosine in RNA.
    Substrate RNA and nucleotide specificity differ between NOP/NOL and tRNA-directed branches. Directly
    annotated pombe Trm402 experiments support tRNA C49/C50 methylation and additional sites in tRNA-Asp,
    rather than an automatic C34 assignment from a related enzyme name.
  reason: The integrated family description establishes RNA C5-methylation chemistry but not one
    universal RNA target. The experimentally sourced Trm402 record distinguishes its tRNA-site spectrum
    and Trm4 paralog specificity. A C34-specific prediction requires direct target-site evidence
    and cannot be validated by the broad family label.
PTHR22883:
  preferred_name: DHHC protein S-acyltransferases
  coherence: MOSTLY_COHERENT
  summary: DHHC-family proteins catalyze protein S-acylation at membranes. Distinct paralogs act
    on different protein substrates and membrane compartments. Human ZDHHC23 has evidence for palmitoylation-dependent
    regulation of KCNMA1 localization, which is a specific substrate relationship rather than a universal
    property of DHHC enzymes.
  reason: The curated InterPro entry and member inventory support a common S-acyltransferase lineage,
    but the family includes many paralogs with different targets and acyl-chain preferences. A blanket
    palmitate-only or synaptic-substrate rule is not justified without subfamily evidence, and a
    missing catalytic motif must be demonstrated on a complete sequence before claiming inactivity.
PTHR22896:
  preferred_name: CABLES cyclin-dependent kinase-associated regulators
  coherence: MOSTLY_COHERENT
  summary: CABLES proteins associate with cyclin-dependent kinases and regulate cell-cycle or cell-death
    pathways. They serve as interaction and regulatory proteins, and their naming as kinase substrates
    does not indicate that they are themselves protein kinases. CABLES1 and CABLES2 have distinct
    documented interaction contexts.
  reason: The curated InterPro entry supports a related regulatory role for CABLES1 and CABLES2.
    Specific mammalian p53 interactions and tumor phenotypes are not sufficient to assign identical
    pathways to the fly ortholog or all family members.
PTHR22969:
  preferred_name: IKK/TBK1-related serine-threonine kinases
  coherence: HETEROGENEOUS
  summary: IKK-related kinases share protein-phosphorylation machinery but act in distinct signaling
    circuits. Canonical IKK subunits, TBK1 and IKK-epsilon differ in partners and substrates. Fly
    IKK-epsilon has direct evidence for regulation of actin turnover and polarized morphogenesis,
    showing that an immune-pathway-only family description is incomplete.
  reason: The member inventory contains canonical IKK alpha/beta and TBK1/IKK-epsilon branches, and
    fly experiments define a nonapoptotic cytoskeletal role. Mammalian interferon signaling or I-kappa-B
    phosphorylation should not be projected onto every fly IKK-related kinase from the family name.
  pmids:
  - '16887350'
PTHR23023:
  preferred_name: FMO-related flavin-dependent oxidative enzymes
  coherence: HETEROGENEOUS
  summary: FMO-related proteins catalyze diverse oxidative reactions, including heteroatom oxygenation
    and specialized-metabolite transformations. The family includes trimethylamine oxidases, thiol-oxidizing
    enzymes and proteins catalogued as brominating enzymes. Yeast FMO experiments link thiol oxidation
    to endoplasmic-reticulum redox balance, but that substrate and pathway are not a default for
    all fungal homologs.
  reason: The member inventory spans several substrate classes and specialized reactions. The Neurospora
    NCU06296 assignment supports investigation of flavin-dependent oxidation, while a specific dimethylaniline,
    trimethylamine or glutathione substrate remains unestablished without subfamily and biochemical
    evidence.
  pmids:
  - '10077572'
PTHR23031:
  preferred_name: Rhophilin Rho-associated cytoskeletal adaptors
  coherence: COHERENT
  summary: Rhophilin proteins bind Rho-family signaling proteins and organize downstream cytoskeletal
    interactions. Characterized vertebrate RHPN1 and RHPN2 connect Rho signaling to actin-associated
    structures. Their role as Rho effectors is distinct from GTP hydrolysis or nucleotide exchange
    catalyzed by other parts of the signaling system.
  reason: The curated InterPro entry supports a conserved Rhophilin interaction scaffold. Podocyte
    filtration and interactions of an isolated domain with HIV nucleocapsid are specialized observations
    that do not define fly Rhp or the family as a whole.
PTHR23049:
  preferred_name: Myosin regulatory light chains
  coherence: HETEROGENEOUS
  summary: Myosin regulatory light chains modulate actomyosin assemblies through association with
    myosin heavy chains and regulatory phosphorylation. The group contains muscle-specific and nonmuscle
    paralogs with different expression and contractile contexts. The light chain is not the ATPase
    motor, and an EF-hand-like fold does not establish equivalent calcium sensing by every paralog.
  reason: The inventory includes cardiac, smooth-muscle and nonmuscle regulatory light chains. MYL10
    has little direct functional evidence in the retrieved human record, so neither a cardiac-contraction
    function nor a particular myosin partner follows from its family assignment alone.
PTHR23068:
  preferred_name: DNMT3/DRM methyltransferases and noncatalytic relatives
  coherence: HETEROGENEOUS
  summary: This family includes active DNMT3 DNA methyltransferases together with regulatory relatives
    such as DNMT3L and inactive DRM proteins. DNMT3L recognizes chromatin and stimulates methyltransferase
    partners without supplying an independent DNA-methylation active site. The group also contains
    proteins catalogued as PWWP2B, underscoring that shared domains do not ensure conserved methyltransferase
    activity.
  reason: Human DNMT3A and DNMT3L occupy different verified subfamilies, and the DNMT3A–DNMT3L structure
    distinguishes catalytic and regulatory subunits. Active plant DRM branches and inactive relatives
    add further boundaries. DNA methylation as a biological process may involve a regulator even
    when intrinsic DNA methyltransferase activity is absent.
  pmids:
  - '17713477'
PTHR23122:
  preferred_name: MPP/CASK MAGUK interaction scaffolds
  coherence: HETEROGENEOUS
  summary: MPP-like and CASK-like MAGUK proteins assemble membrane-associated interaction complexes
    using conserved PDZ, SH3 and guanylate-kinase-like modules. Fly Metro stabilizes a perisynaptic
    complex with Dlg and DLin-7 through L27-domain interactions. The guanylate-kinase-like domain
    is an interaction module and does not establish GMP phosphorylation.
  reason: The inventory includes MPP/PALS and CASK/LIN-2 proteins with different amino-terminal architectures.
    A kinase-domain property of CASK cannot be transferred to Metro, while guanylate-kinase catalysis
    must not be inferred from the MAGUK acronym. Synaptic and epithelial polarity complexes also
    require member-specific assignment.
  pmids:
  - '20427642'
PTHR23211:
  preferred_name: TGN38-related membrane trafficking proteins
  coherence: UNKNOWN
  summary: This group is named for trans-Golgi network membrane proteins and includes the fly rgn
    record. The available target evidence establishes a PANTHER association but does not demonstrate
    equivalent cargo recognition or a shared signaling mechanism. The exact relationship between
    the long fly protein and characterized TGN38/TGN46-like proteins requires domain and topology
    comparison.
  reason: There is no integrated functional InterPro description or direct experimental source for
    the target in the available dossier. A TGN-family name alone is inadequate to determine conserved
    localization or function for the 808-residue fly sequence, so family-wide biological coherence
    remains unresolved.
PTHR23415:
  preferred_name: NIP7 and CKS proteins grouped by PANTHER
  coherence: HETEROGENEOUS
  summary: This PANTHER group combines NIP7 ribosome-biogenesis proteins with cyclin-dependent kinase
    regulatory subunits. NIP7 supports large-subunit pre-rRNA processing, whereas CKS proteins regulate
    kinase-associated cell-cycle machinery. These roles are biologically distinct despite their grouping
    under one family identifier.
  reason: The inventory contains both NIP7 and CKS1/CKS2 entries. The pombe Nip7 record supports
    the ribosome-biogenesis branch by curated orthology, but neither a CKS function for Nip7 nor
    a ribosome-assembly function for every CKS protein follows from this family assignment.
PTHR23423:
  preferred_name: OST-alpha/TMEM184/Hfl1 membrane proteins
  coherence: HETEROGENEOUS
  summary: This membrane-protein group includes OST-alpha transporters, TMEM184 proteins and fungal
    Hfl1. Characterized mammalian OST-alpha works with OST-beta in organic-solute transport, while
    Hfl1 recruits Atg8 during vacuolar membrane-protein turnover. A membrane-transport name therefore
    does not specify a conserved substrate or even the same cellular mechanism for every member.
  reason: The curated InterPro description explicitly spans solute transport and vacuolar turnover
    proteins. Fly CG6836 is described as a probable transporter by similarity, so bile-acid transport
    requires additional subfamily and substrate evidence rather than transfer from a mammalian intestinal
    model.
PTHR24061:
  preferred_name: Class-C GPCR ligand-recognition proteins
  coherence: HETEROGENEOUS
  summary: This group links class-C receptor proteins whose extracellular ligand-recognition regions
    support distinct sensory functions. Calcium-sensing, glutamate-responsive and vomeronasal receptors
    cannot be assigned each other's ligands from shared receptor architecture. For mouse Vmn2r73,
    receptor-family placement is a starting point for investigating vomeronasal signaling, not proof
    of a particular pheromone or peptide ligand.
  reason: The integrated InterPro entry is broader than one ligand-defined receptor group. An extracellular
    ligand-binding-domain match does not independently establish a complete seven-transmembrane signaling
    receptor on the exact submitted sequence. Vmn2r73-specific ligand recognition and receptor completeness
    remain the relevant boundaries.
