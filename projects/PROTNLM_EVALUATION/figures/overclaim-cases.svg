<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Three ways a prediction claims more than its sequence supports</text>

  <!-- case 1: missing catalytic region -->
  <text x="30" y="76" font-size="14.5" font-weight="bold" fill="#0e6b66">Missing catalytic region</text>
  <text x="30" y="96" font-size="12.5" fill="#56655f">WHEAT/A0A3B6GK97, patatin, 302 aa as deposited</text>
  <rect x="30" y="108" width="250" height="26" rx="4" fill="#e8f1ee" stroke="#8fa39c"/>
  <rect x="60" y="108" width="120" height="26" fill="#dcefec" stroke="#0e6b66"/>
  <text x="120" y="126" font-size="11.5" fill="#0e6b66" text-anchor="middle">patatin fold</text>
  <rect x="280" y="108" width="72" height="26" rx="4" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="4 3"/>
  <text x="316" y="126" font-size="11.5" fill="#bd3a30" text-anchor="middle">Ser absent</text>
  <text x="30" y="158" font-size="12.5" fill="#15201e">predicted <tspan font-weight="bold">lipase activity</tspan> → NPI</text>
  <text x="30" y="178" font-size="12.5" fill="#15201e">predicted <tspan font-weight="bold">lipid catabolic process</tspan> → UNC</text>

  <!-- case 2: taxon -->
  <text x="380" y="76" font-size="14.5" font-weight="bold" fill="#0e6b66">Impossible in the organism</text>
  <text x="380" y="96" font-size="12.5" fill="#56655f">WHEAT/F6LAX4, PP2A scaffold subunit</text>
  <path d="M400 150 q14 -34 28 0" stroke="#1d8a4b" stroke-width="2" fill="none"/>
  <path d="M414 150 V116" stroke="#1d8a4b" stroke-width="2"/>
  <path d="M414 126 q16 -12 24 -2" stroke="#1d8a4b" stroke-width="2" fill="none"/>
  <circle cx="500" cy="132" r="14" fill="#dcefec" stroke="#0e6b66"/>
  <path d="M514 132 H540" stroke="#8fa39c" stroke-width="2"/>
  <text x="548" y="128" font-size="24" fill="#bd3a30">✕</text>
  <text x="578" y="128" font-size="12.5" fill="#15201e">neuron projection</text>
  <text x="578" y="146" font-size="12.5" fill="#15201e">neuronal cell body</text>
  <text x="380" y="178" font-size="12.5" fill="#15201e">both <tspan font-weight="bold">NPI</tspan>; heterodimerization on the same protein is LSP</text>

  <!-- case 3: family without specifics -->
  <text x="30" y="242" font-size="14.5" font-weight="bold" fill="#0e6b66">Family transfer carries the core, not the context</text>
  <text x="30" y="262" font-size="12.5" fill="#56655f">WHEAT/A0A3B6RKV1, JmjC protein, phmmer hit to Arabidopsis JMJ22</text>
  <rect x="30" y="276" width="190" height="42" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="125" y="294" font-size="12.5" fill="#15201e" text-anchor="middle">JMJ22, characterised</text>
  <text x="125" y="311" font-size="12" fill="#56655f" text-anchor="middle">5 experimental terms</text>
  <path d="M220 297 H268" stroke="#8fa39c" stroke-width="2"/><polygon points="268,291 280,297 268,303" fill="#8fa39c"/>
  <rect x="284" y="264" width="240" height="30" rx="4" fill="#ffffff" stroke="#1d8a4b" stroke-width="1.8"/>
  <text x="404" y="284" font-size="12.5" fill="#15201e" text-anchor="middle">epigenetic regulation → COR</text>
  <rect x="284" y="302" width="240" height="30" rx="4" fill="#ffffff" stroke="#56655f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="404" y="322" font-size="12.5" fill="#15201e" text-anchor="middle">gibberellin, light, germination → UNC</text>
  <text x="548" y="284" font-size="12.5" fill="#56655f">The relative's core activity transfers.</text>
  <text x="548" y="304" font-size="12.5" fill="#56655f">Its regulatory context does not.</text>

  <line x1="30" y1="368" x2="930" y2="368" stroke="#8fa39c"/>
  <text x="30" y="396" font-size="13.5" fill="#15201e">Ontology overlap does not settle any of these. An exact GOA match can still be less precise than a supported alternative,</text>
  <text x="30" y="418" font-size="13.5" fill="#15201e">and a prediction with no is_a or part_of path to an existing annotation can still be right: STRCO/Q9KZ33's sigma-factor</text>
  <text x="30" y="440" font-size="13.5" fill="#15201e">activity supports the predicted transcription initiation even though the closure comparison reports no overlap.</text>
</svg>
