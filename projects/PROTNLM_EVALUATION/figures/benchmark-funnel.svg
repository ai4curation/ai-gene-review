<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-label="Funnel from UniProtKB to the ProtNLM2 benchmark cohorts"><title>Funnel from UniProtKB to the ProtNLM2 benchmark cohorts</title>
<style>
.t { fill: var(--fig-ink, #15201e); font-family: "Source Sans 3", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.m { fill: var(--muted, #56655f); }
.b { font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.box { fill: var(--fig-fill, #e8f1ee); stroke: var(--fig-line, #8fa39c); stroke-width: 1.2; }
.ours { fill: var(--accent, #0e6b66); }
.ours-t { fill: var(--surface, #ffffff); }
.link { fill: var(--fig-fill, #e8f1ee); opacity: .55; }
.rule { stroke: var(--rule, #d6dfdb); stroke-width: 1; fill: none; }
.brk { stroke: var(--fig-line, #8fa39c); stroke-width: 1.5; fill: none; }
.brk-ours { stroke: var(--accent, #0e6b66); stroke-width: 2; fill: none; }
.acc { fill: var(--accent, #0e6b66); }
.census { fill: var(--accept, #1d8a4b); }
.hand { fill: var(--modify, #b8620f); }
.rule-c { fill: var(--new, #1d68b3); }
.off { fill: var(--over, #7657a3); }
.chip-t { fill: var(--surface, #ffffff); font-weight: 600; }
.c-COR { fill: var(--accept, #1d8a4b); } .c-CNN { fill: var(--keep, #4f7c3a); }
.c-LSP { fill: var(--accent, #0e6b66); } .c-UNC { fill: var(--undecided, #6b6f76); }
.c-NPI { fill: var(--remove, #bd3a30); } .c-PLI { fill: var(--over, #7657a3); }
.c-REP { fill: var(--modify, #b8620f); }
</style>
<text x="940.0" y="24.0" class="t m" font-size="12" text-anchor="end">bar width on a log scale</text><polygon class="link" points="305.0,80 605.0,80 605.0,106 305.0,106"/><polygon class="link" points="305.0,146 605.0,146 536.3,172 373.7,172"/><polygon class="link" points="373.7,212 536.3,212 528.6,238 381.4,238"/><rect class="box" x="305.0" y="40" width="300.0" height="40" rx="3"/><text x="455.0" y="66.0" class="t b num" font-size="17" text-anchor="middle">150,006,383</text><text x="20.0" y="58.0" class="t b" font-size="15" text-anchor="start">UniProtKB</text><text x="20.0" y="76.0" class="t m" font-size="12.5" text-anchor="start">release 2026_03</text><rect class="box" x="305.0" y="106" width="299.9" height="40" rx="3"/><text x="455.0" y="132.0" class="t b num" font-size="17" text-anchor="middle">149,430,635</text><text x="20.0" y="124.0" class="t b" font-size="15" text-anchor="start">Unreviewed (TrEMBL)</text><text x="20.0" y="142.0" class="t m" font-size="12.5" text-anchor="start">Swiss-Prot is the other 575,748</text><rect class="box" x="373.7" y="172" width="162.5" height="40" rx="3"/><text x="455.0" y="198.0" class="t b num" font-size="17" text-anchor="middle">26,856</text><text x="20.0" y="190.0" class="t b" font-size="15" text-anchor="start">ProtNLM2 public pilot</text><text x="20.0" y="208.0" class="t m" font-size="12.5" text-anchor="start">416 taxa</text><rect class="box" x="381.4" y="238" width="147.2" height="40" rx="3"/><text x="455.0" y="264.0" class="t b num" font-size="17" text-anchor="middle">10,268</text><text x="20.0" y="256.0" class="t b" font-size="15" text-anchor="start">With GO or function text</text><text x="20.0" y="274.0" class="t m" font-size="12.5" text-anchor="start">the rest: names, locations, keywords</text><rect class="ours" x="411.3" y="304" width="87.5" height="40" rx="3"/><text x="455.0" y="330.0" class="t b num ours-t" font-size="17" text-anchor="middle">242</text><text x="20.0" y="322.0" class="t b" font-size="15" text-anchor="start">Our prediction targets</text><text x="20.0" y="340.0" class="t m" font-size="12.5" text-anchor="start">186 reviewed; 86 outside the set above</text><path class="brk" d="M640 110 h8 V208 h-8"/><text x="660.0" y="139.0" class="t b" font-size="13.5" text-anchor="start">Chosen upstream</text><text x="660.0" y="156.0" class="t m" font-size="12.5" text-anchor="start">released by UniProt: ~400 most-searched</text><text x="660.0" y="172.0" class="t m" font-size="12.5" text-anchor="start">species, TrEMBL only; how entries were</text><text x="660.0" y="188.0" class="t m" font-size="12.5" text-anchor="start">picked is not documented</text><path class="brk" d="M640 242 h8 V274 h-8"/><text x="660.0" y="246.0" class="t b" font-size="13.5" text-anchor="start">Set by the model&#x27;s output</text><text x="660.0" y="263.0" class="t m" font-size="12.5" text-anchor="start">ProtNLM2 emitted GO or function text</text><text x="660.0" y="279.0" class="t m" font-size="12.5" text-anchor="start">for only these records</text><path class="brk-ours" d="M640 308 h8 V340 h-8"/><text x="660.0" y="320.0" class="t b acc" font-size="13.5" text-anchor="start">Chosen by us</text><text x="660.0" y="337.0" class="t m" font-size="12.5" text-anchor="start">a species census, or hand-picked</text><line class="rule" x1="20" y1="378" x2="940" y2="378"/><text x="20.0" y="400.0" class="t m" font-size="12.5" text-anchor="start">Targets outside the GO/function set: 37 served by the API but not on the list (28 S. pombe, 9 fly), and 49 listed with only names, locations or keywords.</text><text x="20.0" y="418.0" class="t m" font-size="12.5" text-anchor="start">Counts: UniProt 2026_03; API fetched 2026-10-19; reviews frozen at 2026-09-27; 1 listed record not served by the API.</text></svg>
