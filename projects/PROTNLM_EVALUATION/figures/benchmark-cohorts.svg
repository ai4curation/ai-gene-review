<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-label="Selection method and size of each ProtNLM2 benchmark cohort"><title>Selection method and size of each ProtNLM2 benchmark cohort</title>
<style>
.t { fill: var(--fig-ink, #15201e); font-family: "Source Sans 3", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.m { fill: var(--muted, #56655f); }
.b { font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.box { fill: var(--fig-fill, #e8f1ee); stroke: var(--fig-line, #8fa39c); stroke-width: 1.2; }
.ours { fill: var(--accent, #0e6b66); }
.ours-t { fill: var(--surface, #ffffff); }
.link { fill: var(--fig-fill, #e8f1ee); opacity: .55; }
.rule { stroke: var(--rule, #d6dfdb); stroke-width: 1; fill: none; }
.brk { stroke: var(--fig-line, #8fa39c); stroke-width: 1.5; fill: none; }
.brk-ours { stroke: var(--accent, #0e6b66); stroke-width: 2; fill: none; }
.acc { fill: var(--accent, #0e6b66); }
.census { fill: var(--accept, #1d8a4b); }
.hand { fill: var(--modify, #b8620f); }
.rule-c { fill: var(--new, #1d68b3); }
.off { fill: var(--over, #7657a3); }
.chip-t { fill: var(--surface, #ffffff); font-weight: 600; }
.c-COR { fill: var(--accept, #1d8a4b); } .c-CNN { fill: var(--keep, #4f7c3a); }
.c-LSP { fill: var(--accent, #0e6b66); } .c-UNC { fill: var(--undecided, #6b6f76); }
.c-NPI { fill: var(--remove, #bd3a30); } .c-PLI { fill: var(--over, #7657a3); }
</style>
<text x="410.0" y="40.0" class="t m b" font-size="12" text-anchor="end">Records</text><text x="530.0" y="40.0" class="t m b" font-size="12" text-anchor="end">GO/function</text><text x="610.0" y="40.0" class="t m b" font-size="12" text-anchor="end">Picked</text><text x="640.0" y="40.0" class="t m b" font-size="12" text-anchor="start">How picked</text><text x="940.0" y="40.0" class="t m b" font-size="12" text-anchor="end">GO claims</text><line class="rule" x1="20" y1="48" x2="940" y2="48"/><text x="20.0" y="70.0" class="t b" font-size="14.5" text-anchor="start">ARGO-50</text><text x="20.0" y="88.0" class="t m" font-size="12.5" text-anchor="start">whole pilot, 14 taxon groups</text><text x="410.0" y="70.0" class="t num" font-size="14" text-anchor="end">26,856</text><text x="530.0" y="70.0" class="t num" font-size="14" text-anchor="end">10,268</text><text x="610.0" y="70.0" class="t b num" font-size="14" text-anchor="end">50</text><rect class="hand" x="640" y="55" width="82" height="19" rx="3"/><text x="645.0" y="69.0" class="t chip-t" font-size="11.5" text-anchor="start">Hand-picked</text><text x="640.0" y="88.0" class="t m" font-size="12" text-anchor="start">stratified by taxon group and output type</text><text x="940.0" y="70.0" class="t num" font-size="14" text-anchor="end">77</text><line class="rule" x1="20" y1="100" x2="940" y2="100"/><text x="20.0" y="120.0" class="t b" font-size="14.5" text-anchor="start">HORSE40</text><text x="20.0" y="138.0" class="t m" font-size="12.5" text-anchor="start">Equus caballus</text><text x="410.0" y="120.0" class="t num" font-size="14" text-anchor="end">404</text><text x="530.0" y="120.0" class="t num" font-size="14" text-anchor="end">184</text><text x="610.0" y="120.0" class="t b num" font-size="14" text-anchor="end">40</text><rect class="hand" x="640" y="105" width="82" height="19" rx="3"/><text x="645.0" y="119.0" class="t chip-t" font-size="11.5" text-anchor="start">Hand-picked</text><text x="640.0" y="138.0" class="t m" font-size="12" text-anchor="start">informative claims and biological diversity</text><text x="940.0" y="120.0" class="t num" font-size="14" text-anchor="end">89</text><line class="rule" x1="20" y1="150" x2="940" y2="150"/><text x="20.0" y="170.0" class="t b" font-size="14.5" text-anchor="start">FLY41</text><text x="20.0" y="188.0" class="t m" font-size="12.5" text-anchor="start">Drosophila melanogaster</text><text x="410.0" y="170.0" class="t num" font-size="14" text-anchor="end">94</text><text x="530.0" y="170.0" class="t num" font-size="14" text-anchor="end">41</text><text x="610.0" y="170.0" class="t b num" font-size="14" text-anchor="end">41</text><rect class="census" x="640" y="155" width="49" height="19" rx="3"/><text x="645.0" y="169.0" class="t chip-t" font-size="11.5" text-anchor="start">Census</text><text x="640.0" y="188.0" class="t m" font-size="12" text-anchor="start">every record with GO or function text</text><text x="940.0" y="170.0" class="t num" font-size="14" text-anchor="end">50</text><line class="rule" x1="20" y1="200" x2="940" y2="200"/><text x="20.0" y="220.0" class="t b" font-size="14.5" text-anchor="start">NEUROSPORA20</text><text x="20.0" y="238.0" class="t m" font-size="12.5" text-anchor="start">Neurospora crassa</text><text x="410.0" y="220.0" class="t num" font-size="14" text-anchor="end">51</text><text x="530.0" y="220.0" class="t num" font-size="14" text-anchor="end">16</text><text x="610.0" y="220.0" class="t b num" font-size="14" text-anchor="end">20</text><rect class="census" x="640" y="205" width="49" height="19" rx="3"/><text x="645.0" y="219.0" class="t chip-t" font-size="11.5" text-anchor="start">Census</text><text x="640.0" y="238.0" class="t m" font-size="12" text-anchor="start">all 16 GO/function records, plus 4 localization cases</text><text x="940.0" y="220.0" class="t num" font-size="14" text-anchor="end">21</text><line class="rule" x1="20" y1="250" x2="940" y2="250"/><text x="20.0" y="270.0" class="t b" font-size="14.5" text-anchor="start">POMBE20</text><text x="20.0" y="288.0" class="t m" font-size="12.5" text-anchor="start">S. pombe, not on the list</text><text x="410.0" y="270.0" class="t num" font-size="14" text-anchor="end">28</text><text x="530.0" y="270.0" class="t num" font-size="14" text-anchor="end">20</text><text x="610.0" y="270.0" class="t b num" font-size="14" text-anchor="end">20</text><rect class="off" x="640" y="255" width="115" height="19" rx="3"/><text x="645.0" y="269.0" class="t chip-t" font-size="11.5" text-anchor="start">Census, off-list</text><text x="640.0" y="288.0" class="t m" font-size="12" text-anchor="start">Swiss-Prot, from the pre-release export</text><text x="940.0" y="270.0" class="t num" font-size="14" text-anchor="end">32</text><line class="rule" x1="20" y1="300" x2="940" y2="300"/><text x="20.0" y="320.0" class="t b" font-size="14.5" text-anchor="start">MOD_EVOLUTION20</text><text x="20.0" y="338.0" class="t m" font-size="12.5" text-anchor="start">7 model species</text><text x="410.0" y="320.0" class="t num" font-size="14" text-anchor="end">1,105</text><text x="530.0" y="320.0" class="t num" font-size="14" text-anchor="end">409</text><text x="610.0" y="320.0" class="t b num" font-size="14" text-anchor="end">20</text><rect class="hand" x="640" y="305" width="82" height="19" rx="3"/><text x="645.0" y="319.0" class="t chip-t" font-size="11.5" text-anchor="start">Hand-picked</text><text x="640.0" y="338.0" class="t m" font-size="12" text-anchor="start">evolutionary questions: substrate, catalysis, complexes</text><text x="940.0" y="320.0" class="t num" font-size="14" text-anchor="end">19</text><line class="rule" x1="20" y1="350" x2="940" y2="350"/><text x="20.0" y="370.0" class="t b" font-size="14.5" text-anchor="start">DONKEY40</text><text x="20.0" y="388.0" class="t m" font-size="12.5" text-anchor="start">Equus asinus</text><text x="410.0" y="370.0" class="t num" font-size="14" text-anchor="end">254</text><text x="530.0" y="370.0" class="t num" font-size="14" text-anchor="end">133</text><text x="610.0" y="370.0" class="t b num" font-size="14" text-anchor="end">40</text><rect class="rule-c" x="640" y="355" width="82" height="19" rx="3"/><text x="645.0" y="369.0" class="t chip-t" font-size="11.5" text-anchor="start">Ranked rule</text><text x="640.0" y="388.0" class="t m" font-size="12" text-anchor="start">most GO terms; needs TreeGrafter and horse IBA</text><text x="940.0" y="370.0" class="t m num" font-size="12.5" text-anchor="end">69 (post-snapshot)</text><text x="20.0" y="416.0" class="t m" font-size="12" text-anchor="start">Records and GO/function are counts in the released pool the cohort was drawn from. Overlapping cohort members are counted once in project totals.</text></svg>
