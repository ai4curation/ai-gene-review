<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d68b3"/></marker>
  </defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">The radical-pair compass in a cryptochrome</text>
  <!-- protein outline -->
  <path d="M60,90 C200,60 520,60 620,110 C700,150 700,300 620,340 C520,390 200,390 80,340 C20,300 10,140 60,90 z" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="80" y="118" font-size="13" fill="#56655f">cryptochrome (photolyase-homology domain)</text>
  <!-- light -->
  <path d="M150,40 L170,70 L158,70 L178,100" fill="none" stroke="#1d68b3" stroke-width="3"/>
  <text x="186" y="58" font-size="13" fill="#1d68b3">blue light</text>
  <!-- FAD -->
  <rect x="120" y="190" width="110" height="60" rx="10" fill="#b8620f"/><text x="175" y="216" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">FAD</text><text x="175" y="236" font-size="12" text-anchor="middle" fill="#fff">excited</text>
  <!-- Trp chain -->
  <g font-size="14" text-anchor="middle" fill="#15201e">
    <circle cx="300" cy="220" r="26" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="300" y="225">Trp A</text>
    <circle cx="390" cy="220" r="26" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="390" y="225">Trp B</text>
    <circle cx="480" cy="220" r="26" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/><text x="480" y="225">Trp C</text>
    <circle cx="570" cy="220" r="26" fill="#ffffff" stroke="#0e6b66" stroke-width="2" stroke-dasharray="4 3"/><text x="570" y="225">Trp D</text>
  </g>
  <line x1="566" y1="252" x2="240" y2="252" stroke="#1d68b3" stroke-width="2" marker-end="url(#e)"/>
  <text x="400" y="272" font-size="13" text-anchor="middle" fill="#1d68b3">electron hops along the tryptophan chain to FAD</text>
  <text x="570" y="180" font-size="12" text-anchor="middle" fill="#56655f">tetrad in CRY4</text>
  <!-- radical pair -->
  <text x="370" y="315" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">FAD•⁻ + TrpH•⁺  spin-correlated radical pair</text>
  <!-- singlet/triplet -->
  <rect x="720" y="120" width="210" height="60" rx="8" fill="#ffffff" stroke="#0e6b66"/><text x="825" y="146" font-size="14" text-anchor="middle" fill="#15201e">singlet ⇄ triplet</text><text x="825" y="166" font-size="12" text-anchor="middle" fill="#56655f">interconversion</text>
  <line x1="680" y1="220" x2="716" y2="160" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="815" y="215" font-size="13" text-anchor="end" fill="#15201e">weak magnetic field</text><text x="815" y="233" font-size="13" text-anchor="end" fill="#15201e">(Earth-strength)</text><text x="815" y="251" font-size="13" text-anchor="end" fill="#15201e">shifts the balance</text>
  <line x1="825" y1="182" x2="825" y2="290" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <rect x="720" y="296" width="210" height="60" rx="8" fill="#0e6b66"/><text x="825" y="322" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">signalling-state yield</text><text x="825" y="342" font-size="12" text-anchor="middle" fill="#dcefec">changes with field direction</text>
  <!-- evidence strip -->
  <text x="30" y="410" font-size="16" font-weight="bold" fill="#15201e">Evidence summarized on the project page</text>
  <g font-size="13" fill="#15201e">
    <rect x="30" y="424" width="215" height="72" rx="6" fill="#dcefec"/><text x="42" y="446" font-weight="bold">Robin CRY4</text><text x="42" y="464">field effect in vitro; Trp</text><text x="42" y="480">mutants map the pairs (2021)</text>
    <rect x="258" y="424" width="215" height="72" rx="6" fill="#dcefec"/><text x="270" y="446" font-weight="bold">Monarch CRY1</text><text x="270" y="464">needed for light-dependent</text><text x="270" y="480">inclination sensing (2021)</text>
    <rect x="486" y="424" width="215" height="72" rx="6" fill="#ffffff" stroke="#bd3a30"/><text x="498" y="446" font-weight="bold">Fly CRY</text><text x="498" y="464">behaviour (2008) not replicated</text><text x="498" y="480">at scale (2023): contested</text>
    <rect x="714" y="424" width="215" height="72" rx="6" fill="#dcefec"/><text x="726" y="446" font-weight="bold">MagLOV (engineered)</text><text x="726" y="464">ODMR in living bacteria</text><text x="726" y="480">at room temperature (2026)</text>
  </g>
</svg>
