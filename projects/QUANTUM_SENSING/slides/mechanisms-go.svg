<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fa39c"/></marker></defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">GO already names all three mechanisms</text>
  <text x="30" y="56" font-size="13" fill="#56655f">Children of GO:0050958 magnetoreception (checked in OLS), matched to the mechanisms on the project page</text>
  <rect x="330" y="80" width="300" height="56" rx="8" fill="#0e6b66"/><text x="480" y="104" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">GO:0050958 magnetoreception</text><text x="480" y="124" font-size="12" text-anchor="middle" fill="#dcefec">parent process</text>
  <line x1="420" y1="138" x2="160" y2="196" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="138" x2="480" y2="196" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="138" x2="800" y2="196" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="13" fill="#15201e">
    <rect x="30" y="200" width="280" height="130" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="44" y="224" font-weight="bold" font-size="14">GO:0050977</text><text x="44" y="242">magnetoreception by sensory</text><text x="44" y="258">perception of chemical stimulus</text>
    <text x="44" y="284" fill="#0e6b66" font-weight="bold">Radical pair ("chemical compass")</text><text x="44" y="302">cryptochromes; quantum spin</text><text x="44" y="318">chemistry. Strongest evidence.</text>
    <rect x="340" y="200" width="280" height="130" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
    <text x="354" y="224" font-weight="bold" font-size="14">GO:0050979</text><text x="354" y="242">magnetoreception by sensory</text><text x="354" y="258">perception of mechanical stimulus</text>
    <text x="354" y="284" fill="#b8620f" font-weight="bold">Magnetite torque</text><text x="354" y="302">magnetotactic bacteria; fish</text><text x="354" y="318">tissues. Classical, not quantum.</text>
    <rect x="650" y="200" width="280" height="130" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
    <text x="664" y="224" font-weight="bold" font-size="14">GO:0050978</text><text x="664" y="242">magnetoreception by sensory</text><text x="664" y="258">perception of electrical stimulus</text>
    <text x="664" y="284" fill="#56655f" font-weight="bold">Induction</text><text x="664" y="302">aquatic animals moving in a field;</text><text x="664" y="318">not protein-specific.</text>
  </g>
  <rect x="30" y="360" width="900" height="130" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="50" y="388" font-size="15" font-weight="bold" fill="#15201e">What existing reviews say (made for other projects)</text>
  <g font-size="13" fill="#15201e">
    <text x="50" y="414">Fly CRY: GO:0050958 magnetoreception and response to magnetism, 4 IMP rows</text>
    <rect x="720" y="400" width="150" height="22" rx="4" fill="#56655f"/><text x="795" y="416" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">KEEP_AS_NON_CORE</text>
    <text x="50" y="442">Arabidopsis CRY1: response to magnetism, 2 rows (IDA, IMP)</text>
    <rect x="720" y="428" width="150" height="22" rx="4" fill="#56655f"/><text x="795" y="444" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">KEEP_AS_NON_CORE</text>
    <text x="50" y="470">Human CRY1, CRY2: no magnetoreception annotations</text>
  </g>
</svg>
