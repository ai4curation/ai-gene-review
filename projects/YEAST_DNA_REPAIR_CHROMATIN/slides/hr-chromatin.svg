<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker></defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#15201e">A double-strand break has to be repaired inside chromatin</text>
  <text x="30" y="60" font-size="15" fill="#56655f">Recombination steps (top) and the chromatin factors that open and restore nucleosomes (bottom). Green = reviewed.</text>
  <!-- step 1: break -->
  <g transform="translate(40,90)">
    <text x="85" y="0" font-size="15" font-weight="bold" text-anchor="middle" fill="#15201e">1 Break sensed</text>
    <line x1="0" y1="40" x2="75" y2="40" stroke="#15201e" stroke-width="4"/><line x1="95" y1="40" x2="170" y2="40" stroke="#15201e" stroke-width="4"/>
    <line x1="0" y1="50" x2="75" y2="50" stroke="#15201e" stroke-width="4"/><line x1="95" y1="50" x2="170" y2="50" stroke="#15201e" stroke-width="4"/>
    <rect x="58" y="24" width="54" height="42" rx="8" fill="#fff2e6" stroke="#b8620f" stroke-width="2" opacity="0.9"/>
    <text x="85" y="50" font-size="12" text-anchor="middle" fill="#15201e">MRX</text>
    <text x="85" y="90" font-size="12" text-anchor="middle" fill="#56655f">MRE11 · RAD50 · XRS2</text>
    <text x="85" y="106" font-size="12" text-anchor="middle" fill="#56655f">+ SAE2; checkpoint RAD9, DUN1</text>
  </g>
  <line x1="220" y1="140" x2="258" y2="140" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 2: resection -->
  <g transform="translate(265,90)">
    <text x="95" y="0" font-size="15" font-weight="bold" text-anchor="middle" fill="#15201e">2 Resection</text>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#15201e" stroke-width="4"/><line x1="110" y1="40" x2="190" y2="40" stroke="#15201e" stroke-width="4"/>
    <line x1="0" y1="50" x2="40" y2="50" stroke="#15201e" stroke-width="4"/><line x1="150" y1="50" x2="190" y2="50" stroke="#15201e" stroke-width="4"/>
    <text x="95" y="90" font-size="12" text-anchor="middle" fill="#56655f">3′ single-stranded tails</text>
  </g>
  <line x1="465" y1="140" x2="503" y2="140" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 3: filament -->
  <g transform="translate(510,90)">
    <text x="95" y="0" font-size="15" font-weight="bold" text-anchor="middle" fill="#15201e">3 Rad51 filament</text>
    <line x1="0" y1="45" x2="190" y2="45" stroke="#15201e" stroke-width="3"/>
    <g fill="#dcefec" stroke="#0e6b66" stroke-width="1.5">
      <circle cx="20" cy="45" r="11"/><circle cx="44" cy="45" r="11"/><circle cx="68" cy="45" r="11"/><circle cx="92" cy="45" r="11"/><circle cx="116" cy="45" r="11"/><circle cx="140" cy="45" r="11"/><circle cx="164" cy="45" r="11"/>
    </g>
    <text x="95" y="90" font-size="12" text-anchor="middle" fill="#56655f">RAD51, loaded by RAD52</text>
    <text x="95" y="106" font-size="12" text-anchor="middle" fill="#56655f">with RAD55–RAD57</text>
  </g>
  <line x1="710" y1="140" x2="748" y2="140" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 4: invasion -->
  <g transform="translate(755,90)">
    <text x="85" y="0" font-size="15" font-weight="bold" text-anchor="middle" fill="#15201e">4 Strand invasion</text>
    <line x1="0" y1="35" x2="170" y2="35" stroke="#8fa39c" stroke-width="4"/>
    <line x1="0" y1="58" x2="170" y2="58" stroke="#8fa39c" stroke-width="4"/>
    <path d="M20,75 C60,75 60,46 100,46 L150,46" fill="none" stroke="#0e6b66" stroke-width="4"/>
    <text x="85" y="100" font-size="12" text-anchor="middle" fill="#56655f">RAD54 translocase</text>
    <text x="85" y="116" font-size="12" text-anchor="middle" fill="#56655f">into the donor duplex</text>
  </g>
  <!-- chromatin layer -->
  <rect x="30" y="250" width="900" height="240" rx="12" fill="#f5faf8" stroke="#8fa39c" stroke-dasharray="6 4"/>
  <text x="50" y="278" font-size="16" font-weight="bold" fill="#0e6b66">Chromatin layer: every step needs nucleosomes moved, evicted or rebuilt</text>
  <!-- nucleosome string -->
  <path d="M60,340 C90,300 120,380 150,340 S210,300 240,340 S300,380 330,340" fill="none" stroke="#15201e" stroke-width="2"/>
  <g fill="#e8f1ee" stroke="#56655f" stroke-width="1.5"><ellipse cx="105" cy="340" rx="24" ry="18"/><ellipse cx="195" cy="340" rx="24" ry="18"/><ellipse cx="285" cy="340" rx="24" ry="18"/></g>
  <text x="195" y="390" font-size="12" text-anchor="middle" fill="#56655f">nucleosomes over the break</text>
  <!-- factors -->
  <rect x="390" y="300" width="160" height="80" rx="8" fill="#e6f4ec" stroke="#1d8a4b" stroke-width="2"/>
  <text x="470" y="326" font-size="16" font-weight="bold" text-anchor="middle" fill="#15201e">FACT</text>
  <text x="470" y="346" font-size="13" text-anchor="middle" fill="#1d8a4b">SPT16 · POB3</text>
  <text x="470" y="366" font-size="12" text-anchor="middle" fill="#56655f">H2A–H2B chaperone</text>
  <rect x="570" y="300" width="160" height="80" rx="8" fill="#e6f4ec" stroke="#1d8a4b" stroke-width="2"/>
  <text x="650" y="326" font-size="16" font-weight="bold" text-anchor="middle" fill="#15201e">CHD1</text>
  <text x="650" y="346" font-size="13" text-anchor="middle" fill="#1d8a4b">reviewed</text>
  <text x="650" y="366" font-size="12" text-anchor="middle" fill="#56655f">nucleosome spacing</text>
  <rect x="750" y="300" width="160" height="80" rx="8" fill="#e6f4ec" stroke="#1d8a4b" stroke-width="2"/>
  <text x="830" y="326" font-size="16" font-weight="bold" text-anchor="middle" fill="#15201e">SWI/SNF</text>
  <text x="830" y="346" font-size="13" text-anchor="middle" fill="#1d8a4b">SWI1</text>
  <text x="830" y="366" font-size="12" text-anchor="middle" fill="#56655f">nucleosome remodeling</text>
  <line x1="340" y1="340" x2="384" y2="340" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="50" y="430" font-size="14" fill="#15201e">Not yet reviewed: MRX, SAE2, RAD51/52/54/55/57, checkpoint kinases, mismatch repair (MSH2, MSH6, MLH1, PMS1),</text>
  <text x="50" y="452" font-size="14" fill="#15201e">RAD3, REV3 and ribonucleotide reductase (RNR1–4).</text>
</svg>
