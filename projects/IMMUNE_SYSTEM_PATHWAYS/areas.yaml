# Scope of the IMMUNE_SYSTEM_PATHWAYS umbrella project.
#
# Each area is one immune pathway family. `modules` are existing module slugs
# under modules/; `projects` are existing project slugs that already work in the
# area; `go` lists the GO biological process terms that ground the area;
# `genes` are human HGNC symbols that anchor the pathway (sensor/receptor,
# adaptor, kinase or enzyme, effector, key negative regulator). The gene lists
# are a scoping choice, not an exhaustive membership list.
#
# Regenerate the coverage tables with:
#   uv run python projects/IMMUNE_SYSTEM_PATHWAYS/scripts/coverage.py

areas:
  - id: tlr
    label: Toll-like receptor signaling
    go:
      - {id: GO:0002224, label: "toll-like receptor signaling pathway"}
    modules: [toll_like_receptor_signaling]
    genes: [TLR2, TLR3, TLR4, TLR5, TLR7, TLR9, MYD88, TICAM1, IRAK4, IRAK1, TRAF6, MAP3K7]
  - id: nlr_inflammasome
    label: NLR signaling and inflammasomes
    go:
      - {id: GO:0035872, label: "nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway"}
    modules: [nlr_signaling]
    projects: [NLRP3_INFLAMMASOME, CHIMERIC_MRNA_IMMUNITY]
    genes: [NOD1, NOD2, RIPK2, NLRP3, NLRP1, NLRC4, AIM2, PYCARD, CASP1, CASP4, GSDMD, IL1B, IL18]
  - id: cytosolic_nucleic_acid
    label: Cytosolic nucleic-acid sensing (RIG-I/MDA5, cGAS-STING)
    go:
      - {id: GO:0039529, label: "RIG-I signaling pathway"}
      - {id: GO:0140896, label: "cGAS/STING signaling pathway"}
    modules: [rig_i_signaling]
    projects: [CGAS_STING_PATHWAY, KW_1110_TRAF_KW2GO]
    genes: [RIGI, IFIH1, MAVS, CGAS, STING1, TBK1, IKBKE, IRF3, IRF7, TREX1, IFI16]
  - id: interferon
    label: Interferon signaling
    go:
      - {id: GO:0060337, label: "type I interferon-mediated signaling pathway"}
      - {id: GO:0060333, label: "type II interferon-mediated signaling pathway"}
    modules: [type_i_interferon_signaling, type_ii_interferon_signaling, jak_stat_signaling]
    genes: [IFNB1, IFNG, IFNAR1, IFNAR2, IFNGR1, IFNGR2, JAK1, JAK2, TYK2, STAT1, STAT2, IRF9, SOCS1]
  - id: nfkb_tnf
    label: NF-kappaB and TNF signaling
    go:
      - {id: GO:0007249, label: "canonical NF-kappaB signal transduction"}
      - {id: GO:0033209, label: "tumor necrosis factor-mediated signaling pathway"}
    modules: [nfkb_canonical_signaling, tnf_signaling]
    genes: [TNF, TNFRSF1A, TRADD, RIPK1, TRAF2, CHUK, IKBKB, IKBKG, NFKBIA, NFKB1, RELA, TNFAIP3]
  - id: cytokine
    label: Interleukin and chemokine signaling
    go:
      - {id: GO:0019221, label: "cytokine-mediated signaling pathway"}
    modules: [il1_signaling, il6_signaling, chemokine_signaling, jak_stat_signaling]
    projects: [AUTOIMMUNE]
    genes: [IL1R1, IL1RAP, IL6, IL6R, IL6ST, IL2, IL2RA, IL7R, IL10, IL23R, STAT3, STAT4, STAT5B, SOCS3, CXCL8, CXCR2, CCR5]
  - id: tcr
    label: T cell receptor signaling and co-stimulation
    go:
      - {id: GO:0050852, label: "T cell receptor signaling pathway"}
    modules: [t_cell_receptor_signaling]
    projects: [AUTOIMMUNE]
    genes: [CD3D, CD3E, CD247, LCK, ZAP70, LAT, LCP2, PLCG1, NFATC1, CD4, CD8A, CD28, CTLA4, PDCD1, PTPN22]
  - id: bcr_fc
    label: B cell receptor and Fc receptor signaling
    go:
      - {id: GO:0050853, label: "B cell receptor signaling pathway"}
    modules: [b_cell_receptor_signaling, fc_epsilon_receptor_signaling, fc_gamma_receptor_signaling]
    genes: [CD79A, CD79B, SYK, BTK, BLNK, PLCG2, PIK3CG, FCER1A, MS4A2, FCER1G, FCGR2A, FCGR3A]
  - id: antigen_presentation
    label: Antigen processing and presentation
    go:
      - {id: GO:0019882, label: "antigen processing and presentation"}
    genes: [HLA-A, B2M, TAP1, TAP2, TAPBP, ERAP1, HLA-DRA, CD74, CIITA]
  - id: complement
    label: Complement activation
    go:
      - {id: GO:0006956, label: "complement activation"}
    genes: [C1QA, C1R, C1S, MBL2, MASP2, C2, C4A, C3, CFB, CFD, C5, C9, CFH, CD55, CD59]
  - id: lymphocyte_effector
    label: Lymphocyte diversification and cytotoxicity
    go:
      - {id: GO:0002250, label: "adaptive immune response"}
    genes: [RAG1, RAG2, DNTT, AICDA, PRF1, GZMB, KLRK1, NCR1]
  - id: phagocyte_antimicrobial
    label: Phagocyte killing and antimicrobial effectors
    go:
      - {id: GO:0045087, label: "innate immune response"}
    genes: [CYBB, NCF1, MPO, ELANE, LYZ, LTF, CAMP, DEFA1]
