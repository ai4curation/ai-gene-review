# Pre-registered OpenScientist batch for the TreeGrafter evaluation.
# Frozen 2026-10-14 before any report was read. Each entry is one blinded
# function hypothesis ("GENE has TERM"), run with
# templates/treegrafter_function_hypothesis.md in --as-function-hypothesis
# mode. review_action_at_selection is the gene review's action on that
# TreeGrafter (GO_REF:0000118) row at commit 1b7f8f330; compare reports
# against these, not against later actions.
# record_slug (one entry, DDO) selects the review row when the term alone is
# ambiguous: DDO has two GO:0019478 rows, and the run tests the TreeGrafter one.
batch: openscientist-controls-2026-10-14
selected_at_commit: 1b7f8f330
template: templates/treegrafter_function_hypothesis.md
groups:
  undecided: TreeGrafter rows the review left UNDECIDED; the run should help decide them.
  accepted_control: TreeGrafter rows that were the only source for the term and were accepted.
  rule_test: Rows that test a propagation rule or a TreeGrafter-versus-other-pipeline call.
hypotheses:
  - {organism: PSEPK, gene: PP_1969, term: "GO:0061798", label: "GTP 3',8'-cyclase activity", group: undecided, review_action_at_selection: UNDECIDED, why: MoaA paralog in PTHR22960, the family with a fusion-seeded root IBD}
  - {organism: PSEPK, gene: PP_2482, term: "GO:0061798", label: "GTP 3',8'-cyclase activity", group: undecided, review_action_at_selection: UNDECIDED, why: second MoaA paralog in PTHR22960}
