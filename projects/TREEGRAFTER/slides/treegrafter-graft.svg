<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d68b3"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">How a TreeGrafter annotation is made, and where it goes wrong</text>
<!-- tree -->
<g stroke="#15201e" stroke-width="2.5" fill="none">
<path d="M60,280 H120"/>
<path d="M120,160 V400"/>
<path d="M120,160 H220"/><path d="M120,400 H220"/>
<path d="M220,110 V210"/><path d="M220,110 H400"/><path d="M220,210 H400"/>
<path d="M220,350 V450"/><path d="M220,350 H400"/><path d="M220,450 H400"/>
</g>
<circle cx="120" cy="280" r="9" fill="#0e6b66"/>
<text x="108" y="266" font-size="12" text-anchor="end" fill="#0e6b66" font-weight="bold">family node</text>
<circle cx="220" cy="160" r="9" fill="#0e6b66"/>
<circle cx="220" cy="400" r="9" fill="#0e6b66"/>
<text x="230" y="150" font-size="12" fill="#0e6b66" font-weight="bold">subfamily A (PTN)</text>
<text x="230" y="392" font-size="12" fill="#0e6b66" font-weight="bold">subfamily B (PTN)</text>
<g font-size="12" fill="#15201e"><text x="406" y="114">curated reference gene (IBA)</text><text x="406" y="214">curated reference gene (IBA)</text><text x="406" y="354">curated reference gene (IBA)</text><text x="406" y="454">curated reference gene (IBA)</text></g>
<!-- node GO tags -->
<rect x="44" y="296" width="150" height="40" rx="5" fill="#dcefec" stroke="#0e6b66"/>
<text x="119" y="313" font-size="11" text-anchor="middle" fill="#15201e">coarse family terms,</text>
<text x="119" y="328" font-size="11" text-anchor="middle" fill="#15201e">cytoplasm, membrane</text>
<rect x="232" y="166" width="150" height="34" rx="5" fill="#dcefec" stroke="#0e6b66"/>
<text x="307" y="187" font-size="11" text-anchor="middle" fill="#15201e">specific activity X</text>
<!-- query grafted -->
<path d="M360,110 L360,74" stroke="#1d68b3" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
<rect x="250" y="44" width="150" height="30" rx="15" fill="#1d68b3"/>
<text x="325" y="64" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">query protein</text>
<text x="410" y="64" font-size="12" fill="#1d68b3">grafted by HMM score, then inherits the node's GO terms as IEA (GO_REF:0000118)</text>
<!-- failure modes box -->
<rect x="610" y="120" width="320" height="360" rx="10" fill="#ffffff" stroke="#8fa39c"/>
<text x="626" y="148" font-size="15" font-weight="bold" fill="#15201e">306 down-graded annotations</text>
<g font-size="13">
<rect x="626" y="166" width="14" height="14" fill="#b8620f"/><text x="648" y="178" font-weight="bold" fill="#15201e">Granularity  47%</text>
<text x="648" y="196" font-size="12" fill="#56655f">right subfamily, but a node-level or</text>
<text x="648" y="211" font-size="12" fill="#56655f">sibling term (e.g. FAS term on PKS)</text>
<rect x="626" y="232" width="14" height="14" fill="#7657a3"/><text x="648" y="244" font-weight="bold" fill="#15201e">Generic / out of context  36%</text>
<text x="648" y="262" font-size="12" fill="#56655f">cytosol, membrane, identical protein</text>
<text x="648" y="277" font-size="12" fill="#56655f">binding; pathways the host lacks</text>
<rect x="626" y="298" width="14" height="14" fill="#bd3a30"/><text x="648" y="310" font-weight="bold" fill="#15201e">Mis-placement  13%</text>
<text x="648" y="328" font-size="12" fill="#56655f">grafted onto the wrong subfamily</text>
<text x="648" y="343" font-size="12" fill="#56655f">(aprA, mdh, mqo1-3, dapE)</text>
<rect x="626" y="364" width="14" height="14" fill="#56655f"/><text x="648" y="376" font-weight="bold" fill="#15201e">Pseudo-enzyme  1%</text>
<text x="648" y="394" font-size="12" fill="#56655f">4 annotations on 2 proteins</text>
<text x="648" y="424" font-size="12" fill="#56655f">Unclassified 3% (curation queue)</text>
</g>
<text x="626" y="462" font-size="12" fill="#0e6b66" font-weight="bold">Placement usually right; the term is wrong.</text>
<!-- mis-placement arrow illustration -->
<path d="M400,66 C600,70 610,330 572,348" stroke="#bd3a30" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
<text x="492" y="240" font-size="12" fill="#bd3a30">mode 4: should</text>
<text x="492" y="255" font-size="12" fill="#bd3a30">have been B</text>
</svg>
