date: '2026-09-24'
scope: Re-review of TreeGrafter (IEA / GO_REF:0000118) annotations currently recorded as REMOVE or MARK_AS_OVER_ANNOTATED,
  batch 03 (Pseudomonas putida KT2440, acoA through dapF). Scope is the flagged rows only, not a full-gene
  re-review; other annotations were left alone except where a flagged decision required otherwise.
genes:
- gene: PSEPK/acoA
  gene_file: genes/PSEPK/acoA/acoA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0004739
    term_label: pyruvate dehydrogenase (acetyl-transferring) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Rejection stands on a substrate mismatch, not on family-level doubt. PMID:7813883 identifies
      acoA as E1 alpha of the P. putida acetoin-cleaving system, co-induced with 2,3-butanediol dehydrogenase
      during growth on acetoin; the pyruvate-specific activity propagated from PTN002264059 follows the
      shared thiamine-diphosphate E1 fold. The review already asserts the qualifier-correct complex-level
      activity (GO:0016624) separately, so no coverage is lost.
  - term_id: GO:0006086
    term_label: pyruvate decarboxylation to acetyl-CoA
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Same substrate mismatch at the process level: the acoABC operon encodes acetoin cleavage,
      and the correct acetoin-catabolic process is asserted separately in the review. Retained.'
- gene: PSEPK/alr
  gene_file: genes/PSEPK/alr/alr-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained: this is the case rule 2 exempts, a generic location incompatible with the protein.
      Q88GJ9 carries a cleaved N-terminal signal peptide (SIGNAL 1..24), UniProt gives SUBCELLULAR LOCATION:
      Periplasm, and activity was experimentally enriched in the periplasmic fraction.'
  - term_id: GO:0030632
    term_label: D-alanine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: 'Relaxed. The previous reason ("remove this over-transferred process annotation") carried
      no positive contrary evidence for the chemistry, and the chemistry is in fact possible: UniProt
      records measured alanine kinetics for this enzyme (KM 12.62 mM and kcat 7.33 s-1 with L-alanine),
      so it can form D-alanine. What the evidence refutes is the physiological biosynthetic role - catalytic
      efficiency for L-Lys and L-Arg is orders of magnitude higher, and PMID:30008699 found no peptidoglycan
      difference between wild type and the alr deletion. That is over-attribution, which is what MARK_AS_OVER_ANNOTATED
      records.'
- gene: PSEPK/amaC
  gene_file: genes/PSEPK/amaC/amaC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0042802
    term_label: identical protein binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: 'Relaxed. The UniProt entry states "SUBUNIT: Homodimer" (ARBA00011738) and class-I PLP-dependent
      aminotransferases build their active sites across the subunit interface, so self-association is
      a real property of AmaC rather than something the propagation over-attributes. The term is uninformative
      next to L-tyrosine:2-oxoglutarate transaminase activity, which is exactly what non-core status records.'
