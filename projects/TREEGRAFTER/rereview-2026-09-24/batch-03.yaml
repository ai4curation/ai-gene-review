- gene: PSEPK/cbcW
  gene_file: genes/PSEPK/cbcW/cbcW-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005275
    term_label: amine transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. This rejection is a qualifier correction, not a denial of the chemistry: CbcW
      is the six-pass permease subunit only, and translocation additionally requires the CbcV ATPase and
      a periplasmic substrate-binding protein (PMID:19919675), so the enables qualifier misattributes
      a complex-level activity to one subunit. The review already carries the same term with contributes_to
      on a separate row, so nothing is lost. Reason text strengthened with the PMID:19919675 evidence;
      action unchanged.'
  - term_id: GO:0015226
    term_label: carnitine transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained, same qualifier-correction logic and with a sharper specificity argument: the
      CbcXWV core transports choline and betaine but not carnitine, and carnitine selectivity comes from
      the CaiX binding protein (PMID:19919675). The contributes_to row for the same term is retained.
      Reason text strengthened; action unchanged.'
- gene: PSEPK/clpV
  gene_file: genes/PSEPK/clpV/clpV-ai-review.yaml
  status: reviewed
