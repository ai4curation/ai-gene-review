  annotations:
  - term_id: GO:0034605
    term_label: cellular response to heat
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained on an architecture and locus argument, which rule 1 admits. ClpV1/TssH1 carries
      the ClpV-specific N-domain and sits in the K1 type VI secretion locus, where its established job
      is ATP-driven disassembly of the contracted TssBC sheath; the heat-response term rides in on general
      ClpA/ClpB AAA+ family membership, and ClpV is not a heat-shock disaggregase.
- gene: PSEPK/dapE
  gene_file: genes/PSEPK/dapE/dapE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0006526
    term_label: L-arginine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained on a subfamily assignment that is explicit in the record rather than merely inferred:
      Q88MP5 carries HAMAP-Rule MF_01690 DapE, NCBIfam TIGR01246 dapE_proteo, CDD cd03891 M20_DapE_proteobac
      and InterPro IPR005941 DapE_proteobac, and is assigned EC 3.5.1.18 in the lysine/DAP pathway. The
      arginine-biosynthetic process rides in from the related ArgE branch of the same M20A peptidase family.'
  - term_id: GO:0008777
    term_label: acetylornithine deacetylase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained for the same reason at the activity level. GO:0008777 is hydrolysis of N2-acetyl-L-ornithine
      to acetate and L-ornithine; the DapE-specific signatures above and the assigned EC 3.5.1.18 establish
      N-succinyl-LL-diaminopimelate as the physiological substrate, and ArgE-type acetylornithine deacetylation
      belongs to the sister subfamily.
