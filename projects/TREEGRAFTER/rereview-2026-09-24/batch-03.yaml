- gene: PSEPK/argG
  gene_file: genes/PSEPK/argG/argG-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0000050
    term_label: urea cycle
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained on an organism-level pathway absence, which rule 1 admits. GO:0000050 requires
      arginine to be cleaved to urea and ornithine, regenerating the cycle; the KT2440 proteome metadata
      contains no arginase/EC 3.5.3.1, so the cycle cannot close. ArgG performs the biosynthetic argininosuccinate
      synthase step, which the review retains via GO:0004055 and GO:0006526 from the same PAINT node PTN000172504
      - so the rejection is specific to the ureagenic process, not a challenge to the node.
- gene: PSEPK/aroQ-III
  gene_file: genes/PSEPK/aroQ-III/aroQ-III-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0019631
    term_label: quinate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Retained. The term is not false chemistry - type-II dehydroquinases catalyse the same dehydration
      in the biosynthetic and the quinate-catabolic contexts - but assigning the catabolic pathway to
      this particular paralog attributes more than the evidence supports, which is what MARK_AS_OVER_ANNOTATED
      is for (rule 4). Q88IJ6 is assigned by HAMAP-Rule MF_00169 to chorismate biosynthesis step 3/7,
      and KT2440 carries three type-II DHQase paralogs whose relative catabolic flux is unresolved. Note
      that this folder and genes/PSEPK/aroQ cover the same protein, Q88IJ6.
