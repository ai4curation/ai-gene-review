- gene: PSEPK/benB
  gene_file: genes/PSEPK/benB/benB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0019380
    term_label: 3-phenylpropionate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MODIFY
    outcome: changed
    rationale: 'Changed to MODIFY (rule 3). The essence of the propagation is sound - BenB is the beta
      subunit of a ring-hydroxylating dioxygenase acting in an aromatic-acid catabolic pathway - and only
      the substrate is wrong: PMID:12534466 and PMID:11053377 place the ben genes in the benzoate branch
      feeding catechol and the beta-ketoadipate pathway, not the hca 3-phenylpropionate route. The replacement
      term was also corrected: GO:0043640 benzoate catabolic process via hydroxylation, named in the previous
      review, is obsolete in the current ontology (QuickGO, checked 2026-09-24), so the proposed replacement
      is now GO:0043639 benzoate catabolic process. The separate IC row still carrying obsolete GO:0043640
      was left untouched as out of scope and is flagged here.'
- gene: PSEPK/benD
  gene_file: genes/PSEPK/benD/benD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0030497
    term_label: fatty acid elongation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained on a chemistry mismatch. GO:0030497 is the sequential two-carbon extension of
      a fatty acyl chain; BenD is an SDR-family cis-dihydrodiol dehydrogenase that oxidises benzoate cis-dihydrodiol
      to catechol in the benABCD locus. The shared SDR fold is the whole basis of the propagation, and
      nothing in the KT2440 evidence links PP_3164 to fatty acid metabolism.
