    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Relaxed to ACCEPT. GO:0016491 is a true ancestor of the choline dehydrogenase activity
      BetA is established to carry, and the intermediate descendants (GO:0016614, GO:0008812) are already
      present on other rows, so the parent is redundant but not an over-attribution - being broad is not
      being wrong (rule 2/3). The core function remains choline dehydrogenase activity.
