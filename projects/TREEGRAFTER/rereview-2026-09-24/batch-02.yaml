- gene: PSEPK/PP_2528
  gene_file: genes/PSEPK/PP_2528/PP_2528-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0004124
    term_label: cysteine synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: >-
      Downgraded because the activity cannot be excluded on architectural grounds.
      GO:0004124 (O3-acetyl-L-serine + H2S = L-cysteine + acetate) differs from the
      accepted GO:0003961 reaction by a single methylene in the substrate, and
      fold-type I trans-sulfuration enzymes of this family (Pfam PF01053, InterPro
      IPR000277) are known to accept O-acetylserine as an alternative substrate -
      which is why PANTHER names the family PTHR43797 homocysteine/cysteine synthase
      and InterPro IPR006235 covers both sulfhydrylases together. What the evidence
      does establish is the preferred reaction: the accession is named
      O-acetylhomoserine (thiol)-lyase with EC 2.5.1.49 and sits in methionine-pathway
      context. The call therefore attributes an unsupported physiological role rather
      than something demonstrably false. Noted that the organism's canonical cysteine
      synthase is a CysK/CysM fold-type II enzyme from a different family.
- gene: PSEPK/PP_3157
  gene_file: genes/PSEPK/PP_3157/PP_3157-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0042578
