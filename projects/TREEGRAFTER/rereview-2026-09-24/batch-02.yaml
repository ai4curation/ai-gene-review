date: '2026-09-24'
scope: >-
  Batch 02 of the TreeGrafter rejection re-review. Covers only the flagged
  TreeGrafter rows (IEA / GO_REF:0000118) that were recorded as REMOVE or
  MARK_AS_OVER_ANNOTATED; other annotations in these genes were not
  re-adjudicated.
genes:
- gene: NICAT/NaODC_candidate_DCOR
  gene_file: genes/NICAT/NaODC_candidate_DCOR/NaODC_candidate_DCOR-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      The rejection rested on UniProt's "SUBCELLULAR LOCATION: Plastid,
      chloroplast" line being preferred over cytoplasm, but the two are not
      alternatives: QuickGO confirms GO:0005737 is an ancestor of GO:0009507
      (chloroplast is_a plastid, part_of cytoplasm), so the plastid assignment
      entails the TreeGrafter call. The plastid line is itself an ARBA
      rule-based inference (ECO:0000256|ARBA:ARBA00004229), not experimental
      evidence, and the protein is a soluble class-II PLP-dependent
      decarboxylase (Pfam PF02784/PF00278, PLP-lysine at K96, active only as a
      homodimer) with no transmembrane segment. A broad-but-true compartment is
      not grounds for removal; kept as non-core because GO:0009507 carries the
      informative location.
