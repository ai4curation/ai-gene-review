- gene: PSEPK/PP_0312
  gene_file: genes/PSEPK/PP_0312/PP_0312-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0033539
    term_label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: >-
      The syntenic evidence is real but does not meet the bar for removal. PP_0312's
      partner is the DgcAB dimethylglycine dehydrogenase system, and the analogous
      four-gene locus is genetically required for dimethylglycine degradation in
      Chromohalobacter (PMID:32631860) - positive evidence for a different
      assignment. It is not evidence that the protein cannot act in beta-oxidation:
      that pathway is present in KT2440, and electron-transfer flavoproteins are
      routinely shared between dehydrogenase partners, so a role in the DMG locus
      does not exclude the propagated one. The annotation therefore attributes more
      pathway membership than the KT2440 evidence supports without being
      demonstrably false, which is the definition of over-annotation rather than
      removal. No reconstitution of the KT2440 proteins with either partner has been
      reported.
- gene: PSEPK/PP_1084
  gene_file: genes/PSEPK/PP_1084/PP_1084-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0033554
    term_label: cellular response to stress
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      The term's definition - any process changing the state or activity of a cell in
      response to a stress stimulus - describes what this peroxiredoxin does; UniProt
