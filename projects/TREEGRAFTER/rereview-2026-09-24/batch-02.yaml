- gene: PSEAI/merA
  gene_file: genes/PSEAI/merA/merA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0003955
    term_label: NAD(P)H dehydrogenase (quinone) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Wrong electron acceptor, verified against the term definition: GO:0003955 is
      NAD(P)H + H+ + a quinone = NAD(P)+ + a quinol, while MerA catalyzes Hg(2+) +
      NADPH = Hg(0) + NADP+ + H+ (EC 1.16.1.1, RHEA:23856, experimentally
      characterized in PubMed:6412751), delivering electrons through a redox-active
      active-site disulfide and a C-terminal cysteine pair to a bound metal ion. The
      NAD(P)H-binding half of the chemistry is real and is what the class-I pyridine
      nucleotide-disulfide oxidoreductase node propagates; no quinone reductase
      activity is attributed to MerA, and GO:0016152 is already carried. Reason text
      strengthened; action unchanged.
- gene: PSEPK/PP_0094
  gene_file: genes/PSEPK/PP_0094/PP_0094-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
