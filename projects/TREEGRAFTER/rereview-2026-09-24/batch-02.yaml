- gene: PSEPK/accD
  gene_file: genes/PSEPK/accD/accD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0009329
    term_label: acetate CoA-transferase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: ACCEPT
    outcome: changed
    rationale: >-
      The rejection read the term's label rather than its definition, and the
      definition is decisive in the opposite direction. GO defines GO:0009329 as "A
      heterotetrameric enzyme complex made up of two alpha subunits and two beta
      subunits. Part of the acetyl-CoA carboxylase complex. Catalyzes the transfer of
      a carboxyl group to form malonyl-CoA" - the AccA/AccD carboxyltransferase
      component, which is exactly what this protein belongs to as the zinc-binding
      beta subunit. The ontology structure confirms it: GO:0009329 is part_of
      GO:0009317 acetyl-CoA carboxylase complex, GO:0009317's own definition names
      "the acetate CoA-transferase complex" as one component of the E. coli
      heterohexamer, and the sole child of GO:0009329 is GO:0032283 plastid acetate
      CoA-transferase complex, the plant chloroplast accD subcomplex. The TreeGrafter
      call is thus more specific than the InterPro-derived GO:0009317 already carried.
      Flagged upstream as an ontology defect rather than an annotation error: the
      label collides with acetate CoA-transferase (EC 2.8.3.8), and the term still
      carries a capable_of axiom to GO:0008775 acetate CoA-transferase activity that
      contradicts its own definition.
