- gene: NICAT/NaPMT1.1
  gene_file: genes/NICAT/NaPMT1.1/NaPMT1.1-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0004766
    term_label: spermidine synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      A genuine chemistry mismatch, not a family-level complaint. QuickGO defines
      GO:0004766 as S-adenosylmethioninamine + putrescine = 5'-methylthioadenosine
      + spermidine - an aminopropyl transfer from decarboxylated SAM (EC 2.5.1.16).
      PMT1 catalyzes putrescine + SAM = N-methylputrescine + S-adenosyl-L-
      homocysteine (EC 2.1.1.53, RHEA:15037), a methyl transfer from
      undecarboxylated SAM giving a different product. PMT arose by duplication of
      spermidine synthase and keeps the fold (PF01564/PF17284), which explains the
      family-node transfer, while PANTHER's own subfamily call for this protein is
      PTHR11558:SF53 putrescine N-methyltransferase 1. Reason text strengthened
      with the two reaction equations and the subfamily evidence; action unchanged.
  - term_id: GO:0008295
    term_label: spermidine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Spermidine is not a product of PMT1: the enzyme's output is
      N-methylputrescine, and making spermidine requires the aminopropyl transfer
      PMT1 no longer performs, so this is a different pathway rather than a
      broad-but-true parent of the real one. UniProt places the protein in nicotine
      biosynthesis, and GO:0042179 already carries the correct process. Reason
      strengthened accordingly; action unchanged.
- gene: NICAT/NaPMT1.2
  gene_file: genes/NICAT/NaPMT1.2/NaPMT1.2-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
