    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Backed by positive contrary evidence, not by family-level doubt. QuickGO
      gives GO:0010436 as catalysis of the oxidative cleavage of carotenoids;
      NOV1 is a stilbene cleavage oxygenase characterized structurally with
      resveratrol bound (PMID:27911781), cleaving the central interphenyl
