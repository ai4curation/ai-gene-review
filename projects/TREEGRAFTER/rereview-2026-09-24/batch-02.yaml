    term_label: spermidine synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Identical reasoning to the PMT1 paralog: the propagated term's defined
      reaction is an aminopropyl transfer from decarboxylated SAM yielding
      spermidine (EC 2.5.1.16), whereas PMT2 performs a SAM-dependent methyl
      transfer yielding N-methylputrescine (EC 2.1.1.53, RHEA:15037). The retained
      spermidine-synthase fold explains the PTHR11558 family-node transfer;
      PANTHER's subfamily call is putrescine N-methyltransferase. Reason text
      strengthened with the reaction contrast; action unchanged.
  - term_id: GO:0008295
    term_label: spermidine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      PMT2's product is N-methylputrescine, committing putrescine to the
      pyrrolidine branch of nicotine biosynthesis; spermidine formation needs
      chemistry the enzyme does not perform. This is a distinct pathway inherited
      from the spermidine-synthase ancestor at the family node, not an ancestor of
      the gene's real process, and GO:0042179 carries the correct assignment.
      Reason strengthened; action unchanged.
- gene: NOVAD/Saro_0802
  gene_file: genes/NOVAD/Saro_0802/Saro_0802-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
