    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      A true ancestor, which rule 2 and rule 3 treat as acceptable rather than as an
