date: '2026-09-24'
scope: >-
  TreeGrafter annotations (IEA / GO_REF:0000118) in this batch that were recorded as
  REMOVE or MARK_AS_OVER_ANNOTATED, re-examined against the gene's UniProt record, GOA
  table, notes and deep-research files, and the QuickGO term definitions and is_a
  ancestry. Flagged rows only (scope: treegrafter_rejections); other annotations in the
  same genes were not re-adjudicated.
genes:
- gene: PSEPK/mraY
  gene_file: genes/PSEPK/mraY/mraY-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0044038
    term_label: cell wall macromolecule biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      The rejection rested only on redundancy with GO:0009252, which the audit rules
      exclude as grounds. QuickGO confirms GO:0044038 is a direct is_a ancestor of
      GO:0009252 peptidoglycan biosynthetic process, already carried by MraY from
      UniRule/UniPathway, and its definition (formation of a macromolecule destined to
      form part of a cell wall) is satisfied by MraY's transfer of
      phospho-MurNAc-pentapeptide to undecaprenyl phosphate to form lipid I. Nothing in
      the target's chemistry, architecture or location conflicts with the term.
  - term_id: GO:0071555
    term_label: cell wall organization
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      Assembly of the peptidoglycan sacculus is a genuine downstream consequence of
      MraY's lipid I synthesis, and UniProt files the protein under cell wall
      biogenesis/degradation, so the term is true rather than wrong. It is not an is_a
      ancestor of GO:0009252, and MraY's own step is the substrate-level transferase
      reaction, so it is kept as a real but non-core process. This matches the treatment
      of the same term on murJ in this organism.
- gene: PSEPK/mscL
  gene_file: genes/PSEPK/mscL/mscL-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006811
    term_label: monoatomic ion transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      QuickGO confirms GO:0006811 is a direct is_a ancestor of GO:0034220 monoatomic ion
      transmembrane transport, which MscL already carries from UniRule, and its
      definition (directed movement of monoatomic ions by means of a transporter or
      pore) describes what a stretch-gated large-conductance pore does. UniProt records
      a channel that opens in response to stretch forces in the membrane lipid bilayer,
      and the deep-research note that MscL is size-selective rather than solute-specific
      means it passes ions along with larger solutes, not that it excludes ions. The
      rejection was redundancy-based only, so it is relaxed.
- gene: PSEPK/murG
  gene_file: genes/PSEPK/murG/murG-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0016757
    term_label: glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      QuickGO confirms GO:0016757 is a direct is_a ancestor of GO:0050511
      undecaprenyldiphospho-muramoylpentapeptide beta-N-acetylglucosaminyltransferase
      activity, already carried by MurG, and UniProt describes transfer of a GlcNAc
      moiety from UDP-GlcNAc to lipid I. Per audit rule 3 an ancestor whose specific
      descendant is already annotated is accepted rather than rejected as redundant.
- gene: PSEPK/murJ
  gene_file: genes/PSEPK/murJ/murJ-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0034204
    term_label: lipid translocation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      The QuickGO definition (translocation, or flipping, of lipid molecules from one
      monolayer of a membrane bilayer to the opposite monolayer) is precisely the MurJ
      flippase reaction UniProt records: transport of lipid-linked peptidoglycan
      precursors from the inner to the outer leaflet of the cytoplasmic membrane. The
      term names the mechanism that the substrate-specific GO:0015836 leaves implicit,
      so it is true and complementary rather than an over-annotation.
- gene: PSEPK/mutS
  gene_file: genes/PSEPK/mutS/mutS-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0003690
    term_label: double-stranded DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      QuickGO confirms GO:0003690 is a direct is_a ancestor of GO:0030983 mismatched DNA
      binding, which MutS already carries from UniRule/InterPro. UniProt states the
      protein is involved in the repair of mismatches in DNA and possibly carries out
      the mismatch recognition step; recognizing a mismatch within duplex DNA entails
      binding double-stranded DNA. The rejection cited only the availability of the more
      informative descendant, which is not grounds under the audit rules.
- gene: PSEPK/mvaB
  gene_file: genes/PSEPK/mvaB/mvaB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0046951
    term_label: ketone body biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      Retained, with the reason text strengthened from the evidence. The QuickGO
      definition describes formation of the ketone bodies acetoacetate,
      D-3-hydroxybutyrate or acetone, a coordinated ketogenic programme, so it attributes
      a whole-pathway physiology to an enzyme on the strength of one product. MvaB's
      chemistry does yield acetoacetate, making the term not false, but the pathway
      context on record for Q88H25 is degradative: UniProt assigns it to metabolic
      intermediate metabolism, (S)-3-hydroxy-3-methylglutaryl-CoA degradation,
      acetoacetate from (S)-3-hydroxy-3-methylglutaryl-CoA, step 1/1 (UniPathway
      UPA00896/UER00863), and the characterized close ortholog LiuE acts in the
      leucine/isovalerate catabolic route (notes, PMID:19459965). P. putida KT2440 has no
      described ketone-body physiology and the supported process term GO:0006552
      L-leucine catabolic process is already carried, so this is a genuine
      over-annotation rather than a redundancy-only rejection.
