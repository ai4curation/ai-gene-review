- gene: PSEPK/ubiC
  gene_file: genes/PSEPK/ubiC/ubiC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Relaxed per audit rule 2. Chorismate pyruvate-lyase is a small soluble enzyme with no transmembrane
      segment or signal peptide acting on the soluble metabolite chorismate, so its bacterial compartment is the
      cytosol (GO:0005829, the organelle-free part of the cytoplasm). The row is true and more informative than
      its GO:0005737 parent; redundancy with the parent is not grounds for rejection.
- gene: PSEPK/ubiD
  gene_file: genes/PSEPK/ubiD/ubiD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Relaxed per audit rule 2. UbiD is a peripheral inner-membrane enzyme acting from the cytoplasmic
      face on the UbiA-generated prenylated intermediate, and GO:0005737 covers the cell contents excluding the
