    term_label: transferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: Relaxed. UbiA transfers an all-trans polyprenyl group to 4-hydroxybenzoate, so GO:0016740 transferase
      activity is a true root-level ancestor of the accepted GO:0008412. A correct general parent is not an over-annotation;
