    term_label: identical protein binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: 'Relaxed. UniProt Q88NM1 records SUBUNIT: Homodimer, and class-I PLP-dependent aminotransferases
      assemble their active sites across the dimer interface, so identical protein binding is a true statement about
      this protein rather than an over-reach. It remains an uninformative interaction term describing quaternary
      structure, so it is kept as non-core beside the core L-tyrosine:2-oxoglutarate transaminase activity instead
      of being flagged as an over-annotation.'
- gene: PSEPK/tyrS
  gene_file: genes/PSEPK/tyrS/tyrS-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
