date: '2026-09-24'
scope: TreeGrafter annotations (IEA / GO_REF:0000118) currently recorded as REMOVE or MARK_AS_OVER_ANNOTATED, re-examined
  for whether the rejection stands; flagged rows only, not a full-gene re-review
genes:
- gene: PSEPK/tolC
  gene_file: genes/PSEPK/tolC/tolC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0015288
    term_label: porin activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: 'QuickGO defines porin activity as transfer of substances under 1000 Da through a channel whose transmembrane
      portion consists exclusively of beta-strands. Q88EE6 is an outer membrane factor (UniProt: OMF, TC 1.B.17
      family), whose channel-tunnel is a trimeric beta-barrel continuous with a long alpha-helical periplasmic barrel,
      gated and recruited by an inner-membrane partner, and used in KT2440 to export the giant adhesin LapA rather
      than to permit nonspecific small-solute diffusion. The generic conduit character is real so the row is not
      false, but the term attributes a diffusion-porin mechanism and architecture this protein lacks. Rejection
      stands; reason strengthened with the definition and the family/architecture evidence.'
- gene: PSEPK/trmB
  gene_file: genes/PSEPK/trmB/trmB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0043527
    term_label: tRNA methyltransferase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: GO:0043527 asserts membership of a multimeric tRNA methyltransferase complex. The GOA row propagates
      from PANTHER:PTN002361431 in PTHR23417, a family that mixes bacterial KdtA and TrmB with the eukaryotic Trm8/Trm82
      heterodimeric m7G46 methyltransferase from which the complex term derives. UniProt Q88CS7 is described by
      HAMAP MF_01057 as a single-chain tRNA (guanine-N(7))-methyltransferase with no partner-subunit SUBUNIT statement,
      and no P. putida complex evidence is available. The catalytic and process rows are accepted separately; only
      the complex-membership claim over-reaches. Rejection stands; reason strengthened with the PANTHER node and
      the single-subunit bacterial architecture.
- gene: PSEPK/trpC
  gene_file: genes/PSEPK/trpC/trpC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0004640
    term_label: phosphoribosylanthranilate isomerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: A genuine domain-architecture mismatch, not a bare family-propagation objection. UniProt Q88QR6 (HAMAP
      MF_00134, 277 aa) carries only the indole-3-glycerol-phosphate synthase TIM-barrel domain and EC 4.1.1.48;
      there is no TrpF/PRAI domain. GO:0004640 is a distinct reaction (N-(5-phospho-beta-D-ribosyl)anthranilate
      to CdRP) performed in Pseudomonas by a separate trpF gene, and the annotation reflects the bifunctional TrpC(F)
      architecture of other lineages. Existing reason already states this evidence; no change.
- gene: PSEPK/tyrB
  gene_file: genes/PSEPK/tyrB/tyrB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
