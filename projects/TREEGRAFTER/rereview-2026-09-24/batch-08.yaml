- gene: PSEPK/zwf
  gene_file: genes/PSEPK/zwf/zwf-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0009051
    term_label: pentose-phosphate shunt, oxidative branch
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: Relaxed. GO:0009051 is defined as the branch of the pentose-phosphate shunt oxidizing glucose 6-phosphate
      to ribulose 5-phosphate with NADP+ reduction, which is exactly the reaction of the accepted glucose-6-phosphate
      dehydrogenase activity (GO:0004345, with NADP binding also accepted). Participation follows from the enzyme's
      own chemistry rather than from a whole-pathway inference, so rejection is not warranted. PMID:33727391 shows
      zwfA and zwfB carry most of the measurable KT2440 activity, making this paralog's in vivo contribution minor
      but not absent, hence non-core rather than accepted as core.
- gene: SALSP/mcr-4
  gene_file: genes/SALSP/mcr-4/mcr-4-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009244
    term_label: lipopolysaccharide core region biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: GO:0009244 is defined as formation of the LPS core region, the roughly ten-saccharide inner/outer
      core oligosaccharide. MCR-family enzymes are phosphoethanolamine transferases acting on the lipid A moiety
      (the record's core function is GO:0043838 phosphatidylethanolamine:Kdo2-lipid A phosphoethanolamine transferase
      activity), adding pEtN to lipid A phosphates to reduce polymyxin binding; they neither assemble nor extend
      the core oligosaccharide. The protein does act on LPS, so the row is not wholly false, but it places the biosynthetic
      role in the wrong LPS sub-structure. Rejection stands; reason strengthened with the term definition.
- gene: SPHPI/Q53353
  gene_file: genes/SPHPI/Q53353/Q53353-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0010436
    term_label: carotenoid dioxygenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Directly contradicted by the gene's own experimental evidence. LSD-I is an IDA-annotated lignostilbene
      alpha,beta-dioxygenase (GO:0050054, PMID:7763880 and DOI:10.1271/bbb1961.53.2757), cleaving the interphenyl
      double bond of lignostilbene to two vanillins (EC 1.13.11.43). QuickGO shows GO:0050054 is not a descendant
      of GO:0010436 (its ancestors run through GO:0016702 / GO:0051213), so the carotenoid term is a distinct substrate
      class, not a coarser parent. A TreeGrafter propagation from the mixed-specificity CCO/SCO superfamily. No
      change.
  - term_id: GO:0016121
    term_label: carotene catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Same substrate-class error on the process side. GO:0016121 is breakdown of carotenes (hydrocarbon
      carotenoids); LSD-I's characterized process is lignin/stilbene catabolism, annotated by IDA (GO:0046274, PMID:7763880
      and DOI:10.1271/bbb1961.53.2757). The experimental record contradicts a carotene substrate rather than merely
      failing to confirm it. No change.
