- gene: STAAU/lytN
  gene_file: genes/STAAU/lytN/lytN-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008932
    term_label: lytic endotransglycosylase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'A mechanism and architecture mismatch, verified against the QuickGO definition: GO:0008932 is non-hydrolytic
      endolytic cleavage of the MurNAc-GlcNAc glycosidic bond with concomitant 1,6-anhydro bond formation. LytN
      has no transglycosylase fold; its catalytic module is a CHAP domain (with LysM) shown to act as an N-acetylmuramoyl-L-alanine
      amidase and a D-alanyl-glycine endopeptidase, dependent on Cys266/His329 (PMID:21784864) - hydrolysis of amide
      and peptide bonds, not glycosidic transglycosylation. The row comes from subfamily assignment to PTHR33734:SF22.
      No change.'
- gene: STAWA/cfr
  gene_file: genes/STAWA/cfr/cfr-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0030488
    term_label: tRNA methylation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'A substrate mismatch rather than a coarse term. Cfr''s characterized substrate is 23S rRNA: it methylates
      C8 of A2503 (PMID:19144912), and the record''s rRNA methyltransferase, rRNA base methylation and rRNA binding
      rows are accepted. The tRNA specificity in this radical-SAM family belongs to the paralogous RlmN (C2 of A2503
      in 23S rRNA and of A37 in tRNA); no tRNA substrate is reported for Cfr in UniProt or the cited literature.
      Rejection stands; reason strengthened to name the paralog that carries the tRNA activity.'
- gene: THLAR/TFP
  gene_file: genes/THLAR/TFP/TFP-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005634
    term_label: nucleus
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: 'Relaxed from REMOVE. The rejection rested on absence of evidence, which audit rule 1 does not accept:
      the Falcon deep-research report states that explicit subcellular localization of TaTFP was not reported in
      the primary literature, and the gene notes record that direct localization is not experimentally established
      (even the accepted cytosol row is an inference from where myrosinase-generated aglucones become available).
      TaTFP is a small soluble Kelch beta-propeller homodimer with no targeting signal, so a nuclear pool is not
      architecturally excluded the way it would be for a membrane or secreted protein. The row cannot be adjudicated
      either way on the available evidence.'
