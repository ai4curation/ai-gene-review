- gene: PSEPK/ubiX
  gene_file: genes/PSEPK/ubiX/ubiX-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0016831
    term_label: carboxy-lyase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Positive contrary evidence supports the rejection. UbiX is a flavin prenyltransferase that makes
      the prenylated FMN cofactor (accepted GO:0106141); the decarboxylation of 4-hydroxy-3-polyprenylbenzoate is
      performed by the partner protein UbiD. PMID:26083743 states that despite structural and biochemical characterization
      no decarboxylase activity has been detected for UbiX. The TreeGrafter row confuses cofactor supply with the
      partner's reaction. No change.
