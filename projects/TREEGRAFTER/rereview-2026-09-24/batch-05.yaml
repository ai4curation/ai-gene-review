date: '2026-09-24'
scope: 'Batch 05 of the TreeGrafter rejection re-review: 25 flagged IEA/GO_REF:0000118 rows marked REMOVE or MARK_AS_OVER_ANNOTATED
  across 21 Pseudomonas putida KT2440 (PSEPK) genes, gshB through mqo3. Flagged rows only, not full-gene re-reviews.'
genes:
- gene: PSEPK/gshB
  gene_file: genes/PSEPK/gshB/gshB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0016879
    term_label: ligase activity, forming carbon-nitrogen bonds
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'GO:0004363 glutathione synthase activity is_a GO:0016879 in the current ontology (QuickGO ancestor
      query), so the propagated term is a true parent of the ATP-grasp C-N ligase reaction GshB catalyses (gamma-L-glutamyl-L-cysteine
      + glycine + ATP, EC 6.3.2.3, UniProt Q88D35). Rule 3 applies: the specific child is already carried by the
      UniRule row, and redundancy with it is not over-annotation.'
- gene: PSEPK/guaD
  gene_file: genes/PSEPK/guaD/guaD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0019239
    term_label: deaminase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'GO:0008892 guanine deaminase activity is_a GO:0019239 (QuickGO ancestors: GO:0016810, GO:0016814,
      GO:0019239), so the broad term correctly describes the hydrolytic deamination guanine + H2O = xanthine + NH4+
      (EC 3.5.4.3) that UniProt and PANTHER PTHR11271 assign to Q88D35. A true ancestor whose child is carried elsewhere
      is redundancy, not over-annotation.'
  - term_id: GO:0046098
    term_label: guanine metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: GO:0006147 guanine catabolic process is_a GO:0046098 (QuickGO), so the propagated parent is true
      of the reaction; it is only less informative about direction than the UniRule child row. No contrary evidence
      exists, so the rejection does not stand.
- gene: PSEPK/hisA
  gene_file: genes/PSEPK/hisA/hisA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0000162
    term_label: L-tryptophan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. This is a paralog-family mis-transfer with positive contrary evidence, not a bare family-propagation
      objection: Q88R42 is assigned the monofunctional bacterial HisA branch (InterPro IPR006063 HisA_bact_arch,
      IPR044524 Isoase_HisA-like; PANTHER PTHR43090:SF2 ProFAR isomerase) with EC 5.3.1.16 and the histidine pathway
      only, and KT2440 encodes a separate reviewed TrpF (TRPF_PSEPK, N-(5-phosphoribosyl)anthranilate isomerase)
      that performs the tryptophan-pathway isomerization. The bifunctional PriA arrangement that would justify the
      tryptophan term is absent here.'
- gene: PSEPK/hisD
  gene_file: genes/PSEPK/hisD/hisD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: 'Rule 2: cytosol on a soluble bacterial enzyme is true, not an over-annotation. P59400 is an NAD-dependent
      histidinol dehydrogenase with no signal peptide or transmembrane segment, and UniProt places the histidine-biosynthesis
      enzymes in the cytoplasm; in a cell without organelles the soluble pool is cytosolic. Kept non-core because
      the location is peripheral to the catalytic core function.'
- gene: PSEPK/hmgC
  gene_file: genes/PSEPK/hmgC/hmgC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0004364
    term_label: glutathione transferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Retained. Q88E49 is a GST-zeta fold protein (InterPro IPR005955 GST_Zeta) whose net reaction is EC
      5.2.1.2 maleylacetoacetate isomerization, with glutathione acting as a regenerated catalytic cofactor rather
      than a co-substrate transferred to an acceptor, which is what GO:0004364 defines (RX + glutathione = S-substituted
      glutathione + halide). The term is not flatly false for a GST-fold enzyme, so MARK_AS_OVER_ANNOTATED rather
      than REMOVE remains the right call.
  - term_id: GO:0006749
    term_label: glutathione metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: 'Retained. Glutathione is consumed and regenerated within each catalytic cycle, so HmgC does not
      do any of the work of glutathione synthesis, degradation or homeostasis; its process is homogentisate/tyrosine
      catabolism, already captured by the GO:1902000 and GO:0006559 rows. Rule 4 case: attributes more than the
      cofactor requirement supports.'
- gene: PSEPK/hutF
  gene_file: genes/PSEPK/hutF/hutF-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0019239
    term_label: deaminase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: 'Retained, reason strengthened. Unlike the guaD row, this term is NOT an is_a ancestor of the gene
      activity: QuickGO places GO:0050416 formimidoylglutamate deiminase activity under GO:0016813 (hydrolases acting
      on C-N bonds in linear amidines), while GO:0019239 is a separate branch under GO:0016810 defined as removal
      of an amino group. HutF cleaves a formimidoyl amidine, so the term names the wrong chemistry class, most plausibly
      transferred from the guanine-deaminase members of PANTHER PTHR11271, to which HutF matches via the amidohydrolase
      subfamily PTHR11271:SF48. Ammonia is still released, so the term is over-annotated rather than removable.'
- gene: PSEPK/ilvH
  gene_file: genes/PSEPK/ilvH/ilvH-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: Rule 2. IlvH (Q88DY9) is a small soluble ACT-domain regulatory subunit of the cytoplasmic IlvI-IlvH
      acetohydroxy-acid synthase with no membrane-targeting features, so cytosol is a correct location; overlap
      with the broader cytoplasm row is redundancy. Kept non-core as the location is not what distinguishes its
      function.
- gene: PSEPK/infC
  gene_file: genes/PSEPK/infC/infC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0016020
    term_label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained, reason strengthened. Q88K26 has no signal peptide or transmembrane segment and HAMAP MF_00080
      assigns IF-3 to the cytoplasm; the graft explains the error, since PANTHER PTHR10938 matches subfamily PTHR10938:SF0,
      mitochondrial IF-3, which acts on membrane-associated mitoribosomes. That organellar association does not
      transfer to a soluble bacterial initiation factor. The sibling TreeGrafter cytosol row from the same PTN node
      stays ACCEPT, so the rejection is specific to the membrane statement.
- gene: PSEPK/kdsC
  gene_file: genes/PSEPK/kdsC/kdsC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008781
    term_label: N-acylneuraminate cytidylyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Clear chemistry mismatch: GO:0008781 is CTP + N-acylneuraminate = CMP-N-acylneuraminate
      + diphosphate, whereas Q88P96 is a HAD-family phosphatase (EC 3.1.3.45, InterPro IPR010023 KdsC_fam, Rhea
      11500) hydrolysing KDO-8-phosphate. PANTHER PTHR21485 is explicitly the mixed CMAS/KdsC family and the matched
      subfamily PTHR21485:SF3 is the NeuA cytidylyltransferase branch, so this is a within-family paralog transfer
      to a protein that lacks the transferase chemistry.'
- gene: PSEPK/leuB
  gene_file: genes/PSEPK/leuB/leuB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: Rule 2. UniProt records Q88LE5 as a cytoplasmic homodimeric NAD-dependent dehydrogenase with no membrane
      features, so cytosol is a true location for the soluble enzyme and overlap with the cytoplasm row is redundancy
      rather than error. Kept non-core.
- gene: PSEPK/liuC
  gene_file: genes/PSEPK/liuC/liuC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008300
    term_label: isoprenoid catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Pathway-absent-from-organism case under rule 1: the liu genes serve both leucine/isovalerate
      and acyclic-terpene catabolism in P. aeruginosa, but the cached PMID:16820476 states that P. fluorescens,
      but not P. putida, could grow on acyclic terpenes (citronellol and citronellate). KT2440 therefore lacks the
      terpene-utilisation context, and the retained GO:0006552 leucine catabolism row captures what LiuC actually
      does.'
- gene: PSEPK/lolD
  gene_file: genes/PSEPK/lolD/lolD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0022857
    term_label: transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MODIFY
    outcome: changed
    rationale: 'Relaxed. The rejection rested on LolD being the peripheral nucleotide-binding subunit, but GO annotates
      ABC ATPase subunits with transporter activity by convention: the characterised E. coli ortholog LolD (P75957)
      carries GO:0022857 by IBA from PANTHER:PTN000655654 in current GOA, and UniProt gives Q88KY4 the translocase
      class EC 7.6.2.-. The term is unspecific rather than false, so it is refined to the ABC-type child GO:0140359
      ABC-type transporter activity (verified via QuickGO; is_a GO:0022857), exerted as part of the LolCDE complex.'
  - term_id: GO:0055085
    term_label: transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Distinct from the row above: GO:0055085 requires a solute to be transported across the
      lipid bilayer, whereas LolCDE mechanically extracts a lipid-anchored lipoprotein from the outer leaflet of
      the inner membrane and hands it to periplasmic LolA; the cargo never crosses the bilayer. This is a definitional
      mismatch rather than a class-membership question, so the mechanism-based rejection stands.'
- gene: PSEPK/lpdV
  gene_file: genes/PSEPK/lpdV/lpdV-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0006103
    term_label: 2-oxoglutarate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Paralog-specific mis-transfer with positive evidence: P. putida maintains distinct E3
      components, and PMID:1902462 identifies LPD-val as the specific E3 of the branched-chain keto acid dehydrogenase
      complex, with Q88EP9 encoded at the 3-prime end of the bkd operon. The 2-oxoglutarate dehydrogenase complex
      is served by the separate LPD-glc paralog, so the propagated process belongs to that gene.'
- gene: PSEPK/mazG
  gene_file: genes/PSEPK/mazG/mazG-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0046047
    term_label: TTP catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: 'Softened. GO:0046047 is defined for ribosylthymine triphosphate, which is not a normal constituent
      of the bacterial nucleotide pool, and the physiological thymidine species dTTP is already recorded by GO:0046076
      from the same PANTHER node. But nothing in the MazG architecture excludes the ribo-substrate, characterised
      MazG enzymes are broad-specificity NTP pyrophosphohydrolases, and the E. coli ortholog P0AEY3 carries GO:0046047
      by IBA alongside its other NTP rows, so REMOVE overstated the case: the term attributes more than the evidence
      supports rather than being demonstrably wrong.'
- gene: PSEPK/mdh
  gene_file: genes/PSEPK/mdh/mdh-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0004459
    term_label: L-lactate dehydrogenase (NAD+) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Substrate mismatch within the shared LDH/MDH superfamily: Q88Q44 carries EC 1.1.1.37,
      the malate/oxaloacetate reaction in UniProt, and InterPro IPR011275 Malate_DH_type3, while GO:0004459 is (S)-lactate
      + NAD+ = pyruvate + NADH. The graft comes from PANTHER PTHR43128:SF16 L-lactate dehydrogenase, and KT2440
      extract assays measured malate, not lactate, dehydrogenase activity.'
  - term_id: GO:0006089
    term_label: lactate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained. Follows directly from the same incorrect LDH-superfamily graft; the enzyme acts at the
      malate/oxaloacetate node of the TCA cycle (UniProt keyword GO:0006099) and not on lactate.
- gene: PSEPK/moaA
  gene_file: genes/PSEPK/moaA/moaA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0061799
    term_label: cyclic pyranopterin monophosphate synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: 'Retained. Adjacent-step mismatch confirmed against the term definition: GO:0061799 is (8S)-3,8-cyclo-7,8-dihydroguanosine
      5-triphosphate = cyclic pyranopterin phosphate + diphosphate, which is the MoaC reaction; Q88E69 is the radical-SAM
      GTP 3,8-cyclase (EC 4.1.99.22, HAMAP MF_01225) that makes the substrate MoaC consumes, and KT2440 encodes
      a separate MoaC carrying that name. The correct activity GO:0061798 is already accepted on another row.'
- gene: PSEPK/mobA
  gene_file: genes/PSEPK/mobA/mobA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:1902758
    term_label: bis(molybdopterin guanine dinucleotide)molybdenum biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'Relaxed. The rejection read the single-MGD reaction equation as excluding the bis-MGD product, but
      bis-MGD is assembled by successive MobA guanylyl transfers onto Mo-MPT, and GO records that contribution on
      MobA itself: the E. coli ortholog MobA (P32173) carries GO:1902758 with experimental IMP evidence (PMID:1648082,
      per QuickGO) plus an IBA at PANTHER:PTN001452269. Q88HA3 has the same EC 2.7.7.77 assignment and MobA family
      signature (InterPro IPR013482), so the propagated process describes work this protein performs.'
- gene: PSEPK/moeA
  gene_file: genes/PSEPK/moeA/moeA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: Rule 2. Cytosol is part of the cytoplasm, so the broader term is true of Q88L14, a soluble molybdopterin
      molybdotransferase with no membrane features acting in the cytoplasmic Moco pathway. Redundancy with the cytosol
      row from the same PTN node is not an over-annotation; both are retained as non-core.
- gene: PSEPK/mqo1
  gene_file: genes/PSEPK/mqo1/mqo1-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0047545
    term_label: (S)-2-hydroxyglutarate dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Retained, reason strengthened with a comparator. Q88PU7 carries the MQO-specific signatures (InterPro
      IPR006231, Pfam Mqo, HAMAP MF_00212, EC 1.1.5.4, reaction (S)-malate + a quinone = a quinol + oxaloacetate),
      whereas the term names a C5 substrate and a different acceptor chemistry. The characterised E. coli malate:quinone
      oxidoreductase Mqo (P33940) carries GO:0008924 by IDA and has no 2-hydroxyglutarate dehydrogenase annotation
      at all, so the term tracks the L2HGDH members that give PANTHER PTHR43104 its name rather than any property
      of the MQO proteins.
