date: '2026-09-24'
scope: >-
  Re-review of TreeGrafter (IEA / GO_REF:0000118) annotations currently rejected
  (REMOVE or MARK_AS_OVER_ANNOTATED) in Pseudomonas putida KT2440 gene reviews:
  mupP (2 rows), nicD, nicR, nspC, and the shared fatty acid beta-oxidation row
  on paaF, paaH and paaJ. Each rejection was tested against the QuickGO term
  definition, the gene's UniProt record (catalytic activity, domains, family and
  subfamily assignments, subcellular location), its GOA evidence, notes and
  deep-research files, and cached full text where available. All eight
  rejections were confirmed; four review.reason texts were rewritten to state
  the positive contrary evidence instead of resting on "family-level
  propagation".
genes:
- gene: PSEPK/mupP
  gene_file: genes/PSEPK/mupP/mupP-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006281
    term_label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Rejection confirmed on architecture and phenotype grounds; reason text
      strengthened. GO:0006281 is "the process of restoring DNA after damage".
      MupP is a 223-residue HAD-superfamily sugar-phosphate phosphatase
      (CbbY/CbbZ/Gph/YieH family, MupP subfamily) with a determined reaction
      (EC 3.1.3.105; MurNAc-6P + H2O = MurNAc + phosphate; Km 310 uM) and a
      Mg2+-dependent HAD active site (Asp9 nucleophile, Asp11 proton donor). It
      has no nuclease, glycosylase, helicase or DNA-binding module, and the
      deletion phenotype is metabolic (>18-fold MurNAc-6P accumulation, reduced
      UDP-MurNAc/UDP-GlcNAc, fosfomycin hypersensitivity), not a DNA-damage
      phenotype. The term rides on the broad PTHR43434 phosphoglycolate
      phosphatase node (PANTHER:PTN002459629), whose DNA-repair association
      derives from other HAD members; no step of DNA repair is performed by this
      protein.
  - term_id: GO:0008967
    term_label: phosphoglycolate phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Rejection confirmed by a direct experimental exclusion of the named
      chemistry; reason text strengthened and the supporting quotation added.
      The characterizing study (PMID:28351914, full text cached) states that
      2-phosphoglycolate is unlikely to be a substrate of PP_1764 because
      P. putida encodes a much closer Gph ortholog, PP_0416 (46% identity),
      while PP_1764 is only ~29% identical to E. coli Gph. MupP's own substrate
      panel (MurNAc-1P, GlcNAc-1P, GlcNAc-6P, GlcN-6P, Glc-1P, Glc-6P) gave
      detectable turnover only with MurNAc-6P and, >100-fold more slowly,
      GlcNAc-6P. This is a wrong-reaction transfer from the PTHR43434
      phosphoglycolate-phosphatase node, not a too-coarse parent, so REMOVE is
      correct; the true parent GO:0016791 phosphatase activity is already
      carried and accepted on a separate row.
- gene: PSEPK/nicD
  gene_file: genes/PSEPK/nicD/nicD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0016020
    term_label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Rejection confirmed; the existing reason already states the evidence, so
      the review file was not edited. GO:0016020 is "a lipid bilayer along with
      all the proteins and protein complexes embedded in it and attached to it".
      NicD is a 268-residue soluble alpha/beta-hydrolase (Pfam PF00561
      Abhydrolase_1, Gene3D 3.40.50.1820, domain 28-251) with no transmembrane
      segment, signal peptide, lipid anchor or UniProt subcellular-location
      line, and its deformylase activity (EC 3.5.1.106) was assayed in soluble
      crude extracts. The term comes from the PANTHER:PTN001661081
      monoacylglycerol-lipase node, whose membrane association reflects
      lipid-acting relatives rather than this cytosolic pathway enzyme, so the
      location is incompatible rather than merely broad (README rule 2).
- gene: PSEPK/nicR
  gene_file: genes/PSEPK/nicR/nicR-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0006950
    term_label: response to stress
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Rejection confirmed; the existing reason already cites the evidence, so
      the review file was not edited. NicR is a 158-residue single-domain
      MarR-family winged-helix repressor whose regulatory role is experimentally
      characterized in two papers: it represses the nicCDEFTP and nicXR operons
      of the aerobic nicotinate degradation pathway, repression is relieved by
      the pathway intermediate 6-hydroxynicotinate, and its disruption phenotype
      is altered growth on nicotinate as carbon source. The effector is a
      catabolic intermediate, not a stressor, and the regulon is a degradation
      pathway, not a stress response; GO:0006950 arrives from the generic
      PANTHER:PTN008652328 MarR/SlyA node, where the stress association belongs
      to oxidant- and antibiotic-responsive relatives. Its correct regulatory
      terms (GO:0001217, GO:0045892) are proposed on the other rows of this
      gene.
- gene: PSEPK/nspC
  gene_file: genes/PSEPK/nspC/nspC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008836
    term_label: diaminopimelate decarboxylase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Rejection confirmed; the existing reason is already evidence-based and
      records a propagation_review, so the review file was not edited.
      GO:0008836 names the reaction meso-2,6-diaminopimelate = L-lysine + CO2.
      Q88IS0 is placed by PANTHER in subfamily PTHR43727:SF1
      (carboxynorspermidine/carboxyspermidine decarboxylase), not the LysA
      subfamily of the same PTHR43727 parent from which PANTHER:PTN001691018
      transfers; InterPro assigns IPR005730 Nsp decarboxylase; UniProt assigns
      EC 4.1.1.96 with both Rhea reactions (carboxyspermidine = spermidine +
      CO2, RHEA:34095; carboxynorspermidine = norspermidine + CO2, RHEA:34099)
      and the NspC subfamily; and PP_2929 is adjacent to the CASDH candidate
      PP_2928, matching the paired dehydrogenase/decarboxylase organisation of
      the alternative polyamine route. This is a wrong-paralog transfer of a
      different substrate and reaction, so REMOVE stands; the correct parent
      GO:0016831 carboxy-lyase activity is accepted on another row.
- gene: PSEPK/paaF
  gene_file: genes/PSEPK/paaF/paaF-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006635
    term_label: fatty acid beta-oxidation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      Rejection confirmed on substrate grounds; reason text rewritten so it no
      longer rests on "family transfer" alone. GO:0006635 is defined as a
      process that "results in the complete oxidation of a long-chain fatty
      acid". PaaF (PP_3284) is encoded in the phenylacetate catabolic locus and
      acts as a crotonase-superfamily enoyl-CoA hydratase (EC 4.2.1.17) on the
      CoA-thioester of a short dicarboxylic enoyl intermediate produced by ring
      opening of phenylacetyl-CoA; KT2440 carries a separate fad complement for
      true fatty-acid beta-oxidation. The chemistry is beta-oxidation-like but
      the substrate is not a long-chain fatty acid, so the term attributes more
      than the evidence supports. MARK_AS_OVER_ANNOTATED rather than REMOVE
      because crotonase-superfamily hydratases can be acyl-CoA promiscuous and
      no assay excludes a minor contribution.
- gene: PSEPK/paaH
  gene_file: genes/PSEPK/paaH/paaH-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006635
    term_label: fatty acid beta-oxidation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      Rejection confirmed on substrate grounds; reason text rewritten with the
      term definition and the target's own substrate. PaaH (PP_3282) is named
      3-hydroxyadipyl-CoA dehydrogenase (EC 1.1.1.35) and acts on the 3-hydroxy
      dicarboxylic CoA-ester of the ring-opened phenylacetyl-CoA skeleton;
      adipyl-CoA is not a long-chain fatty acyl-CoA, and GO:0006635 requires
      complete oxidation of a long-chain fatty acid. The gene's GOA already
      carries GO:0010124 phenylacetate catabolic process for the physiological
      pathway. MARK_AS_OVER_ANNOTATED rather than REMOVE because
      3-hydroxyacyl-CoA dehydrogenase chemistry is genuinely shared with
      beta-oxidation and no assay excludes a minor fatty-acyl contribution.
- gene: PSEPK/paaJ
  gene_file: genes/PSEPK/paaJ/paaJ-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006635
    term_label: fatty acid beta-oxidation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      Rejection confirmed on substrate grounds; reason text rewritten with the
      term definition and the UniProt reaction. PaaJ (PP_3280) is the
      3-oxoadipyl-CoA/3-oxo-5,6-dehydrosuberyl-CoA thiolase of the paa locus
      (succinyl-CoA + acetyl-CoA = 3-oxoadipyl-CoA + CoA, EC 2.3.1.174,
      RHEA:19481) and acts on dicarboxylic CoA-esters from phenylacetyl-CoA ring
      opening, not on long-chain fatty acyl-CoAs as GO:0006635 requires. The
      same TreeGrafter node (PANTHER:PTN001291485) also supplied GO:0010124
      phenylacetate catabolic process, which is retained as the physiological
      pathway. MARK_AS_OVER_ANNOTATED rather than REMOVE because thiolytic C-C
      cleavage is shared chemistry and no assay rules out a minor fatty-acyl-CoA
      activity.
