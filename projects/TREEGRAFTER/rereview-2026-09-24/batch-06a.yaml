date: '2026-09-24'
scope: 'Batch 06a of the TreeGrafter rejection re-review: six P. putida KT2440 complex I (nuo) subunits
  carrying TreeGrafter GO:0003954 NADH dehydrogenase activity (plus nuoM GO:0048039 ubiquinone binding),
  and the TreeGrafter cytosol rows on the soluble enzymes murB and pdxB. Scope is the flagged IEA / GO_REF:0000118
  rows only (scope: treegrafter_rejections); other annotations were not re-adjudicated.'
genes:
- gene: PSEPK/murB
  gene_file: genes/PSEPK/murB/murB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'MurB (Q88LM5) is a soluble FAD-dependent UDP-N-acetylenolpyruvoylglucosamine reductase;
      UniProt (HAMAP MF_00037) SUBCELLULAR LOCATION: Cytoplasm, no TRANSMEM or SIGNAL features. QuickGO
      GO:0005829 cytosol = part of the cytoplasm without organelles; in a bacterium this is where a soluble
      cytoplasmic enzyme resides, and GOA carries the parent GO:0005737 cytoplasm (UniRule) which the
      review ACCEPTs. Previous reason was only redundancy with the parent term, which README rule 2 says
      is not an over-annotation. Changed to ACCEPT; notes file updated.'
- gene: PSEPK/nuoE
  gene_file: genes/PSEPK/nuoE/nuoE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0003954
    term_label: NADH dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MODIFY
    outcome: changed
    rationale: 'QuickGO: GO:0003954 (NADH + H+ + acceptor = NAD+ + reduced acceptor) is an is_a ancestor
      of GO:0008137 NADH dehydrogenase (ubiquinone) activity, the reaction catalysed by the assembled
      13-subunit NDH-1 complex of which NuoE is an obligate component (UniProt SUBUNIT/FUNCTION). NuoE
      carries a single [2Fe-2S] cluster and no FMN or NADH-binding site; NADH oxidation occurs at the
      FMN of NuoF, so the subunit does not enable the generic reaction on its own; but the TreeGrafter
      inference (PANTHER node in GOA WITH/FROM) is too coarse and mis-qualified rather than false. README
      rule 3: too-coarse ancestor of the real activity is MODIFY, not a rejection. Proposed replacement
      GO:0008137 with a contributes_to qualifier, matching how the sibling Nuo reviews treat their UniProt-sourced
      GO:0008137 rows and the core_functions contributes_to entry.'
