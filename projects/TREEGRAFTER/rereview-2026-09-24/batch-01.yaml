      it in the PepV subfamily rather than the ArgE subfamily.
- gene: HETGA/Cgas
  gene_file: genes/HETGA/Cgas/Cgas-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:2000042
    term_label: negative regulation of double-strand break repair via homologous recombination
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Direct species-specific contradiction, the strongest ground for REMOVE.
      PMID:41066557 reports that naked mole-rat cGAS lacks the suppressive function
      of the human and mouse orthologs and instead potentiates homologous recombination
