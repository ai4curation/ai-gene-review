- gene: DESRO/K9IWR0
  gene_file: genes/DESRO/K9IWR0/K9IWR0-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0043123
    term_label: positive regulation of canonical NF-kappaB signal transduction
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: The stated reason was only that the pathway is not directly evidenced
      in Desmodus, which is absence of a target experiment rather than contrary evidence.
      UniProt identifies K9IWR0 as lymphotoxin-alpha (PANTHER PTHR11471:SF31 LYMPHOTOXIN-ALPHA,
      Pfam PF00229, InterPro IPR002960 TNF_beta) signalling through TNFRSF1A, TNFRSF1B
      and TNFRSF14, and the propagation is from the lymphotoxin-alpha node PANTHER:PTN000158030.
      Canonical NF-kappaB activation is the principal output of that receptor engagement,
      which the review already accepts as cytokine activity and TNF receptor binding.
  - term_id: GO:2001238
    term_label: positive regulation of extrinsic apoptotic signaling pathway
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Same reasoning. Lymphotoxin-alpha engages the death-domain receptor TNFR1,
      and the UniProt FUNCTION record states it is cytotoxic for a wide range of tumor
      cells in vitro and in vivo, which is the receptor-initiated extrinsic route the
      term names. The rejection rested only on the lack of a bat-specific assay.
