    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Structural evidence supports the rejection rather than a bare family
      objection. The squid complexin-SNARE crystal structure shows a complexin helix
      binding antiparallel to the exterior of the assembled four-helix bundle (PMID:12004067);
