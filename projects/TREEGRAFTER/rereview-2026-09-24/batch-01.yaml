genes:
- gene: 9CAUD/I7J3R9
  gene_file: genes/9CAUD/g022/g022-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0006302
    term_label: double-strand break repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: The rejection rested on the absence of a phage-specific repair experiment
      and on the expectation that phage polymerases serve replication only. Neither
      is positive contrary evidence. The propagation is from the family A polymerase
      node PANTHER:PTN000015309, and family A polymerases supply the gap-filling synthesis
      step of DNA repair, so the polymerase chemistry required by the term is present.
      Relaxed to MARK_AS_OVER_ANNOTATED, which states what the evidence actually supports,
      namely that a whole repair process is attributed to an enzyme whose demonstrated
      role in this genome is viral genome replication (GO:0039693, accepted).
- gene: 9POAL/NCGR_LOCUS27674
  gene_file: genes/9POAL/NCGR_LOCUS27674/NCGR_LOCUS27674-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0005504
    term_label: fatty acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Not a bare family-propagation objection. The rejection is architectural
      and specific, namely that the binding function belongs to the C-terminal CHI-fold/FAP
      domain (Pfam PF16035, positions 555-650) of what the review establishes as a
      chimeric gene model, while the gene product being reviewed is the N-terminal
      UMP-CMP kinase. The 714 AA length is 2-3.5x any characterized UMP-CMP kinase
      and no natural ADK-CHI fusion is reported. The rejection is consistent with the
      review's treatment of the other CHI-domain-derived row (GO:0016872).
- gene: 9PRIM/A0A8C9H4D2
  gene_file: genes/9PRIM/A0A8C9H4D2/A0A8C9H4D2-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0007165
    term_label: signal transduction
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: The QuickGO definition restricts signal transduction to reception of
      a signal and its conveyance within the receiving cell. OLFML2A is a secreted
      olfactomedin-domain matricellular glycoprotein (GO:0005576 accepted) with no
      receptor or intracellular transduction role. Its reported effects on AP-1, integrin,
      HGF and NGF signalling are indirect and derive from perturbation studies in human
      cancer lines. Retaining the annotation while marking it over-annotated is the
      correct strength of rejection.
- gene: ACET2/celC
  gene_file: genes/ACET2/celC/celC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008422
    term_label: beta-glucosidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Genuine chemistry mismatch. UniProt gives EC 3.2.1.4 (endohydrolysis
      of internal 1,4-beta-D-glucosidic linkages) for CelC, whereas GO:0008422 is the
      exo-acting release of terminal non-reducing beta-D-glucose residues (EC 3.2.1.21).
      The PANTHER assignment (PTHR31297 glucan endo-1,6-beta-glucosidase B) is a family-level
      graft across mechanistically distinct GH activities.
  - term_id: GO:0009986
    term_label: cell surface
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Architectural rather than merely evidential. The UniProt record contains
      no dockerin module (confirmed by search of the entry), and cell-surface retention
      in A. thermocellus operates through dockerin-cohesin attachment to the CipA scaffoldin.
      Regulatory and operon studies classify CelC as non-cellulosomal, consistent with
      a free extracellular enzyme (GO:0005576 in core_functions).
- gene: AERME/mcr-3
  gene_file: genes/AERME/mcr-3/mcr-3-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009244
    term_label: lipopolysaccharide core region biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: The term is defined as formation of the ten-saccharide core region of
      bacterial LPS. MCR-3.7 is a phosphoethanolamine transferase acting on lipid A
      (UniProt name, CARD ARO:3004510), a different moiety of the LPS molecule and
      a modification rather than core-region synthesis. Some relatives in the EptA/EptB
      family do act on core residues, so the rejection is properly the milder one rather
      than REMOVE.
- gene: AGKCO/fibrolase
  gene_file: genes/AGKCO/fibrolase/fibrolase-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0005886
    term_label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Positive contrary evidence in the UniProt record, which gives SUBCELLULAR
      LOCATION Secreted with experimental ECO:0000269 support (PMID:1304358, PMID:1898066)
      and keyword Secreted, with no transmembrane feature. Fibrolase is a 203-residue
      P-I class SVMP lacking the membrane-anchoring modules of the ADAM relatives that
      dominate the family, so the propagated location is incompatible with the protein.
