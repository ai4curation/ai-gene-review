- gene: MYTGA/A0A8B6GS20
  gene_file: genes/MYTGA/A0A8B6GS20/A0A8B6GS20-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0010507
    term_label: negative regulation of autophagy
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: MTMR9 is a pseudophosphatase lacking the catalytic cysteine of the CX5R
      motif and acts by heterodimerizing with active MTMR6/7/8 partners, so any effect
      on autophagy is exerted through those partners. The direction is also unsettled,
      with MTMR8/MTMR9 knockdown reported to cause p62 accumulation, which points the
      other way. Rule 4 applies, so the signed term is kept but marked over-annotated
      rather than asserted or removed.
