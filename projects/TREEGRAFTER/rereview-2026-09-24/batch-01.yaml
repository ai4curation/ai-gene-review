      be contradictory.
- gene: MACFA/A0A2K5UJ34
  gene_file: genes/MACFA/A0A2K5UJ34/A0A2K5UJ34-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0032474
    term_label: otolith morphogenesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Lineage mismatch. The term covers generation and organization of an otolith,
      the single calcium carbonate mass of the fish inner ear; macaques form otoconia
      instead, so a term transferred from the zebrafish TTC39C ortholog does not apply
      to a primate. The conserved part of the biology is captured by GO:0060271 cilium
      assembly, accepted in the same review.
