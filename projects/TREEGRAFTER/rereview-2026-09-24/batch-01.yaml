- gene: BRUMA/cpi-2
  gene_file: genes/BRUMA/cpi-2/cpi-2-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Action retained, reason strengthened (the review block previously carried
      no reason field). This is the incompatible-location case of decision rule 2 rather
      than a broad-but-true one. UniProt annotates a cleaved signal peptide at FT SIGNAL
