date: '2026-09-24'
scope: >-
  Batch 04 of the 2026-09-24 TreeGrafter rejection re-review. Re-examines 23 TreeGrafter
  annotations (evidence IEA, original_reference_id GO_REF:0000118) across 21 Pseudomonas putida
  KT2440 (PSEPK) gene reviews that currently record action REMOVE or MARK_AS_OVER_ANNOTATED.
  Each row was checked against the GO term definition (QuickGO), the gene's UniProt record
  (catalytic activity, domain/InterPro/PANTHER cross-references, subcellular location and feature
  table), the GOA row and its PANTHER PTN source node, and the cached notes and deep-research
  files. Scope is the flagged rows only (scope: treegrafter_rejections), not a full-gene
  re-review.
genes:
- gene: PSEPK/davA
  gene_file: genes/PSEPK/davA/davA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0050126
    term_label: N-carbamoylputrescine amidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      QuickGO defines GO:0050126 as hydrolysis of N-carbamoylputrescine to putrescine, CO2 and
      ammonium, the carbamoyl-amide step of the agmatine route to putrescine. DavA (Q88RC2) is the
      Dav-pathway enzyme that hydrolyses the simple amide 5-aminopentanamide to 5-aminovalerate,
      the reaction captured by GO:0047588, which is accepted on another row. Both activities lie in
      the carbon-nitrogen hydrolase superfamily (Pfam PF00795, InterPro IPR003010), so the source
      node PANTHER:PTN001132736 transfers a substrate-specific activity across that superfamily.
      This is a genuine substrate and reaction-chemistry mismatch, not a bare family-propagation
      complaint, so the rejection stands. The reason text in the review was rewritten to state that
      evidence explicitly.
- gene: PSEPK/davD
  gene_file: genes/PSEPK/davD/davD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0004777
    term_label: succinate-semialdehyde dehydrogenase (NAD+) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      The term is defined as oxidation of succinate semialdehyde with NAD+. UniProt gives Q88RC0 a
      single catalytic activity, 5-oxopentanoate + NADP(+) + H2O = glutarate + NADPH + 2 H(+),
      which is GO:0102810 glutarate-semialdehyde dehydrogenase (NADP+) and is accepted on two other
      rows. The propagated term names a different substrate (C4 succinate semialdehyde versus C5
      glutarate semialdehyde) from a broad aldehyde dehydrogenase node (PANTHER PTHR43353,
      mitochondrial SSADH). Substrate mismatch is positive contrary evidence, independent of the
      unresolved NAD versus NADP preference, so the rejection stands and the existing reason is
      adequate.
- gene: PSEPK/davT
  gene_file: genes/PSEPK/davT/davT-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0042802
    term_label: identical protein binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      The term simply means binding to an identical protein. DavT carries the full diagnostic
      complement of a class-III (fold-type I) PLP-dependent aminotransferase (Aminotran_3
      IPR005814, PLP-attachment site IPR049704, bacterial 4-aminobutyrate-aminotransferase-like
      signature IPR004632), a family that assembles as homodimers with the active sites formed at
      the subunit interface, as the cached openscientist deep research states. Self-association is
      therefore true rather than an over-attribution; it is uninformative next to the substrate-
      specific 5-aminovalerate:2-oxoglutarate transaminase activity, which is what KEEP_AS_NON_CORE
      records. The oligomeric state of Q88RB9 is a family-level inference, not a measurement, which
      is noted in the reason.
- gene: PSEPK/ddlA
  gene_file: genes/PSEPK/ddlA/ddlA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      DdlA is a soluble ATP-grasp D-Ala-D-Ala ligase with no transmembrane segment, and UniProt
      records a cytoplasmic subcellular location (HAMAP-Rule MF_00047). A broad but true location
      on a soluble bacterial enzyme is not an over-annotation, and redundancy with the accepted
      parent cytoplasm term is not grounds for rejection; the location is kept as non-core because
      the ligase activity and peptidoglycan biosynthesis carry the informative content.
- gene: PSEPK/dinB
  gene_file: genes/PSEPK/dinB/dinB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      UniProt gives Pol IV a cytoplasmic subcellular location and a monomeric state, with no
      membrane architecture. A bacterial cell has no organelles for the cytosol definition to
      exclude, so the term is true; the previous reason conceded as much and rejected only on
      redundancy with the parent cytoplasm row, which the audit rules do not accept as grounds.
      Kept as non-core behind the polymerase activity and the translesion-synthesis and DNA-repair
      processes.
- gene: PSEPK/dxs
  gene_file: genes/PSEPK/dxs/dxs-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0016744
    term_label: transketolase or transaldolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: >-
      QuickGO returns GO:0016744 on the is_a ancestor path of GO:0008661
      1-deoxy-D-xylulose-5-phosphate synthase activity (ancestors: GO:0016744, GO:0003824,
      GO:0016740, GO:0003674), and GO:0008661 is accepted on another row as the core molecular
      function. The ancestor's definition, transfer of an aldehyde or ketonic group from a donor to
      an acceptor, describes exactly the acyloin condensation Dxs performs on pyruvate and
      glyceraldehyde 3-phosphate, and UniProt places the protein in the transketolase family, DXPS
      subfamily. A true ancestor of a term the gene already carries is not an over-annotation.
- gene: PSEPK/exbB
  gene_file: genes/PSEPK/exbB/exbB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0017038
    term_label: protein import
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      QuickGO defines GO:0017038 as the targeting and directed movement of proteins into a cell or
      organelle. ExbB is a three-pass inner-membrane stator of the ExbB-ExbD-TonB motor (UniProt
      TRANSMEM 103-125, 212-237, 257-278; ExbB/TolQ family; MotA_ExbB proton-channel architecture)
      whose function is to couple the proton motive force to TonB so that TonB-dependent outer-
      membrane transporters can import small nutrients: ferric siderophores, heme and vitamin B12.
      TonB systems do energize uptake of some proteinaceous substrates such as group B colicins, so
      the term is not strictly false, which is exactly the case MARK_AS_OVER_ANNOTATED covers: a
      niche activity presented as a biological role. The existing reason already states this and
      stands.
- gene: PSEPK/fabB
  gene_file: genes/PSEPK/fabB/fabB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      FabB is a soluble homodimeric FAS-II condensing enzyme acting on ACP-bound acyl chains, with
      a UniProt cytoplasmic subcellular location and no transmembrane segment. Broad but true on a
      soluble bacterial enzyme, so not an over-annotation; kept as non-core behind the 3-oxoacyl-ACP
      synthase activity and the fatty-acid biosynthesis processes.
- gene: PSEPK/fabV
  gene_file: genes/PSEPK/fabV/fabV-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0050343
    term_label: trans-2-enoyl-CoA reductase (NADH) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: >-
      The term names a CoA-thioester substrate, whereas UniProt gives Q88E33 the ACP reaction (a
      2,3-saturated acyl-[ACP] + NAD+ = a (2E)-enoyl-[ACP] + H+ + NADH), annotated as GO:0004318 and
      accepted on another row. The cached deep research notes that a purified FabV ortholog is
      active with the model substrate crotonyl-CoA, so the activity is not refuted and REMOVE would
      be too strong; equally it has not been shown for this protein and is not its physiological
      reaction. An in-vitro side activity presented as a molecular function is the definition of
      MARK_AS_OVER_ANNOTATED, and the existing reason already states both halves of this, so the
      rejection stands unchanged.
- gene: PSEPK/fbp
  gene_file: genes/PSEPK/fbp/fbp-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0005986
    term_label: sucrose biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Fbp is a class 1 fructose-1,6-bisphosphatase (UniProt HAMAP-Rule MF_01855, EC 3.1.3.11,
      homotetramer, gluconeogenesis) and the propagation source is PANTHER:PTN002265199 in the
      family whose subfamily assignment for this protein is PTHR11556:SF35
      SEDOHEPTULOSE-1,7-BISPHOSPHATASE, CHLOROPLASTIC. Sucrose biosynthesis is a plant and
      cyanobacterial pathway, absent from P. putida KT2440. A pathway absent from the organism is
      the paradigm case for REMOVE, and the same node's fructose-metabolism terms were separately
      kept as non-core, so this is a targeted rejection rather than a blanket one. Existing reason
      is adequate.
- gene: PSEPK/flgE
  gene_file: genes/PSEPK/flgE/flgE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      FlgE is an exported axial subunit, not a soluble cytoplasmic protein. UniProt gives its
      subcellular location as the bacterial flagellum basal body, and the cached falcon deep
      research states that structural subunits are exported from the cytoplasm, travel through the
      central channel and assemble at the distal end, in the periplasmic and extracellular portion
      of the axis rather than in the cytosol, with the disordered N- and C-terminal regions serving
      to prevent premature assembly in the cytosol. The functional compartment is the hook
      (GO:0009424, accepted on another row), so a located_in cytosol call is contradicted rather
      than merely redundant. The rejection stands; a reason field stating this evidence was added,
      since the block previously carried only a summary.
  - term_id: GO:0071978
    term_label: bacterial-type flagellum-dependent swarming motility
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      GO:0071978 is a child of GO:0071973 bacterial-type flagellum-dependent cell motility, which
      is accepted on another row, and is defined as flagellum-driven movement of a group of cells
      along a solid surface. The hook transmits motor torque to the filament during swimming and
      swarming alike, as the cached falcon deep research states, so a cell without FlgE cannot
      swarm and the term is not false. The previous rejection rested on the absence of a
      KT2440-specific swarming assay, which the audit rules do not accept as positive contrary
      evidence. Kept as non-core because swarming has further determinants (surface sensing,
      surfactant production, density-dependent regulation) that FlgE does not supply.
- gene: PSEPK/flgG
  gene_file: genes/PSEPK/flgG/flgG-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0071978
    term_label: bacterial-type flagellum-dependent swarming motility
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      FlgG polymerizes into the distal rod of the basal body (UniProt: the rod consists of about 26
      subunits of FlgG), the periplasm-spanning segment that transmits motor torque to the hook, so
      a cell lacking FlgG has no working flagellum and cannot swarm. The term is therefore true and
      is a child of the flagellum-dependent motility term the gene already carries; the previous
      rejection rested only on swarming not being established for this protein in KT2440, which is
      absence of a target-specific assay rather than contrary evidence. Kept as non-core, matching
      the gene notes, which already describe swarming as non-core and species-specific.
- gene: PSEPK/fliI
  gene_file: genes/PSEPK/fliI/fliI-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0046933
    term_label: proton-transporting ATP synthase activity, rotational mechanism
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      The term requires synthesis of ATP from ADP and phosphate driven by transmembrane proton
      transfer through a rotational mechanism. FliI is the cytoplasmic ATPase of the flagellar type
      III export apparatus: UniProt gives it the reaction ATP + H2O + cellular protein(Side 1) = ADP
      + phosphate + translocated protein, a cytoplasmic location, and the T3SS ATPase domain
      IPR005714 / IPR020005 alongside the F1 alpha/beta fold it shares with ATP synthase (source
      family PTHR15184 ATP SYNTHASE). It hydrolyses ATP and does not translocate protons or
      synthesize ATP, so the propagation reverses the reaction direction and asserts an activity
      the protein does not have. Rejection stands.
- gene: PSEPK/galB
  gene_file: genes/PSEPK/galB/galB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0016811
    term_label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      The term requires hydrolysis of a non-peptide C-N bond in a linear amide. UniProt gives GalB
      the reaction 2-hydroxy-4-oxobutane-1,2,4-tricarboxylate = 4-carboxy-2-hydroxymuconate + H2O,
      a hydration/dehydration with no C-N bond involved, and PMID:21219457 establishes GalB as the
      founding member of a family of zinc-containing hydratases. The propagation comes from the
      PIG-L/MshB deacetylase fold (Pfam PF02585, PTHR12993), which is a fold-level resemblance, not
      the chemistry this enzyme performs. Wrong molecular-function aspect, so the rejection stands;
      the correct term GO:0047584 is annotated and accepted on two other rows, including by IDA.
- gene: PSEPK/galE
  gene_file: genes/PSEPK/galE/galE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0033499
    term_label: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      The term asserts participation in breakdown of beta-D-galactose through the Leloir route,
      which requires galactokinase (GalK) and galactose-1-phosphate uridylyltransferase (GalT)
      upstream of the epimerase. The cached openscientist deep research reports that KT2440 has
      neither galK (K00849) nor galT (K00965), so the pathway cannot run in this organism; the
      epimerase reaction itself (GO:0003978, accepted) is retained and its anabolic role in LPS
      precursor supply is captured separately. A pathway absent from the organism is valid grounds
      for REMOVE. The broader GO:0006012 galactose metabolic process row remains as non-core, so
      the sugar chemistry is not lost.
- gene: PSEPK/gcl
  gene_file: genes/PSEPK/gcl/gcl-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0005948
    term_label: acetolactate synthase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      The term denotes a dimeric or tetrameric complex of large and small chains that forms
      acetolactate from pyruvate. Gcl is a homotetramer of a single chain (UniProt SUBUNIT) that
      catalyses 2 glyoxylate + H+ = 2-hydroxy-3-oxopropanoate + CO2, and it has no small regulatory
      subunit. The shared feature with acetolactate synthase is only the TPP-enzyme fold
      (PTHR18968 THIAMINE PYROPHOSPHATE ENZYMES; Pfam PF02775/PF00205/PF02776). A complex-membership
      claim contradicted by both subunit composition and reaction is a valid REMOVE.
  - term_id: GO:0009099
    term_label: L-valine biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      Valine biosynthesis proceeds through acetolactate made by acetolactate synthase. Gcl produces
      tartronate semialdehyde from glyoxylate (GO:0009028, accepted) and acts in glyoxylate
      catabolism (GO:0009436, accepted); it makes no intermediate of the branched-chain amino acid
      route. The annotation is the process counterpart of the same TPP-family over-propagation and
      is rejected on the same reaction-level grounds.
- gene: PSEPK/gcvH1
  gene_file: genes/PSEPK/gcvH1/gcvH1-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      GcvH1 is a small soluble lipoyl-carrier subunit of the cytoplasmic glycine cleavage system,
      with no signal peptide or transmembrane segment, so the location is true. The previous
      rejection was purely redundancy with the sibling cytosol row (itself already kept as
      non-core), which the audit rules do not accept as grounds. Both location rows now sit as
      non-core behind lipoic acid binding, glycine cleavage complex membership and glycine
      decarboxylation.
- gene: PSEPK/gcvH2
  gene_file: genes/PSEPK/gcvH2/gcvH2-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      Identical case to the paralogous gcvH1 row: a soluble lipoylated H protein of the cytoplasmic
      glycine cleavage system (GcvH family, Pfam PF01597, biotin/lipoyl attachment domain), no
      membrane features, so cytoplasm is broad but true and redundancy with the cytosol row is not
      grounds for rejection.
- gene: PSEPK/glgB
  gene_file: genes/PSEPK/glgB/glgB-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: KEEP_AS_NON_CORE
    outcome: changed
    rationale: >-
      GlgB is a soluble monomeric GH13 branching enzyme (UniProt SUBUNIT monomer; HAMAP-Rule
      MF_00685) acting on intracellular alpha-glucan, with no signal peptide or transmembrane
      segment, so the location is true. The previous rejection cited only redundancy with the
      sibling cytosol row, which is itself kept as non-core; both now sit as non-core behind the
      branching activity and glycogen biosynthesis.
- gene: PSEPK/glnA
  gene_file: genes/PSEPK/glnA/glnA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0016020
    term_label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      GO:0016020 is defined as a lipid bilayer together with the proteins embedded in or attached
      to it. Q88CY3 has no transmembrane feature and no signal peptide in UniProt, which gives a
      cytoplasmic subcellular location, and the protein is a soluble dodecamer of two stacked
      hexameric rings with catalytic sites at subunit interfaces. This is a generic location that
      is incompatible with the protein rather than merely broad, which the audit rules allow to
      stay rejected. Rejection retained; a reason field carrying this evidence was added, since the
      block previously had only a summary.
- gene: PSEPK/groES
  gene_file: genes/PSEPK/groES/groES-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0046872
    term_label: metal ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: >-
      GroES (Q88DS3) is a 10 kDa Cpn10 beta-barrel (Pfam PF00166, InterPro IPR020818,
      IPR037124) that works as a heptameric ring capping GroEL; the UniProt record carries no
      BINDING site, no metal cofactor and no ligand, and the binding and release cycle is driven by
      the GroEL ATPase rather than by any cofactor of GroES. For a small, structurally saturated
      and heavily characterized protein of this kind, the absence of any metal site in the
      reference record is architectural evidence rather than a gap in curation. Rejection retained
      with a strengthened reason.
