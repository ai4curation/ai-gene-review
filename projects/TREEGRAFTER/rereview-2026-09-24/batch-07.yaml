date: '2026-09-24'
scope: 'Batch 07 of the TreeGrafter rejection re-review: 24 TreeGrafter annotations (IEA, GO_REF:0000118)
  currently marked REMOVE or MARK_AS_OVER_ANNOTATED across 21 Pseudomonas putida KT2440 (PSEPK) gene reviews,
  re-adjudicated against the decision rules in projects/TREEGRAFTER/rereview-2026-09-24/README.md. Flagged
  rows only; other annotations in the same reviews were not re-adjudicated.'
genes:
- gene: PSEPK/pdxJ
  gene_file: genes/PSEPK/pdxJ/pdxJ-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: GO:0005829 is defined as the part of the cytoplasm that does not contain organelles. UniProt
      gives PdxJ SUBCELLULAR LOCATION Cytoplasm (HAMAP-Rule MF_00279) and the protein is a soluble TIM-barrel
      (Pfam PF03740, InterPro IPR004569) with no transmembrane segments, so the location is broad but
      true. Redundancy with the separate GO:0005737 cytoplasm row is not grounds for rejection.
- gene: PSEPK/pgm
  gene_file: genes/PSEPK/pgm/pgm-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0006166
    term_label: purine ribonucleoside salvage
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands; reason strengthened. The salvage route this term names is entered through
      the ribose-1-phosphate / ribose-5-phosphate interconversion of phosphopentomutase (DeoB), not through
      a hexose-phosphate mutase. Q88GY7 carries the glucose-specific classifiers NCBIfam TIGR01132 and
      InterPro IPR005852 PGM_a-D-Glc-sp with EC 5.4.2.2, and this process rides along with the co-propagated
      GO:0008973 row from the shared alpha-D-phosphohexomutase node.
  - term_id: GO:0008973
    term_label: phosphopentomutase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands; reason strengthened. QuickGO defines GO:0008973 as D-ribose 1-phosphate
      = D-ribose 5-phosphate, a pentose-phosphate substrate, whereas the target's hexose-specific signatures
      (TIGR01132, IPR005852) and EC 5.4.2.2 point to alpha-D-glucose 1-phosphate / 6-phosphate, which
      GOA records separately as GO:0004614. Flagged rather than removed because superfamily-level substrate
      promiscuity has not been excluded for this protein.
- gene: PSEPK/phnX
  gene_file: genes/PSEPK/phnX/phnX-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0006281
    term_label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Rejection stands on positive contrary evidence. The term was co-propagated with GO:0008967
      from the PTHR43434 PHOSPHOGLYCOLATE PHOSPHATASE node, where the DNA-repair link is removal of 3'-phosphoglycolate
      from strand breaks. Q88KT1 is placed in the PhnX-specific subfamily PTHR43434:SF19, HAMAP-Rule MF_01375,
      InterPro IPR006323, with the reaction phosphonoacetaldehyde + H2O = acetaldehyde + phosphate (EC
      3.11.1.1) and genomic pairing with phnW; that chemistry has no role in restoring damaged DNA.
  - term_id: GO:0008967
    term_label: phosphoglycolate phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Rejection stands. GO:0008967 is catalysis of 2-phosphoglycolate + H2O = glycolate + phosphate,
      a phosphate-ester hydrolysis, whereas PhnX cleaves a carbon-phosphorus bond via a Schiff-base mechanism
      (EC 3.11.1.1). The broad PANTHER family name is the source of the transfer, but the target's exact
      subfamily (PTHR43434:SF19), HAMAP rule and InterPro signature all specify the phosphonatase reaction,
      so this is a wrong-substrate sibling rather than a coarse ancestor.
- gene: PSEPK/prpC
  gene_file: genes/PSEPK/prpC/prpC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0005975
    term_label: carbohydrate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MODIFY
    outcome: changed
    rationale: Downgraded from REMOVE to MODIFY. A replacement term (GO:0019543 propionate catabolic process)
      was already proposed in the block, which is by definition a MODIFY rather than a rejection, and
      the README directs too-coarse or wrongly-aimed process terms to MODIFY. PrpC condenses propanoyl-CoA
      with oxaloacetate and UniProt assigns PATHWAY 'Organic acid metabolism; propanoate degradation',
      so the carbon handled is an organic acid; GO:0005975 comes from the broad PTHR11739 citrate synthase
      node.
- gene: PSEPK/ptxD
  gene_file: genes/PSEPK/ptxD/ptxD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0016618
    term_label: hydroxypyruvate reductase [NAD(P)H] activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: 'Changed to UNDECIDED. The stated ground was only ''no target-specific evidence'', which
      the README explicitly rules out as a basis for REMOVE. Q88HI1 has no measured substrate: UniProt
      carries only the EMBL-derived SubName ''Phosphonate dehydrogenase'', the protein sits in PANTHER
      PTHR10996:SF283 GLYOXYLATE/HYDROXYPYRUVATE REDUCTASE B (the node the term comes from), and the KguD
      role asserted in the review is itself inferred from kgu-locus context (PMID:29607620, PMID:39770733)
      rather than from biochemistry. Neither confirmable nor refutable without an assay.'
  - term_id: GO:0030267
    term_label: glyoxylate reductase (NADPH) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: Changed to UNDECIDED for the same reason as the paired GO:0016618 row. The rejection rested
      on absence of a target assay, not on contrary evidence; the D-isomer specific 2-hydroxyacid dehydrogenase
      active site of Q88HI1 is compatible with glyoxylate reduction, and the locus-context KguD assignment
      does not exclude it.
- gene: PSEPK/pvdD
  gene_file: genes/PSEPK/pvdD/pvdD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009366
    term_label: enterobactin synthetase complex
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Rejection stands on positive contrary evidence. GO:0009366 is defined as the multienzyme
      complex usually composed of EntB, EntD, EntE and EntF acting in enterobactin biosynthesis. PvdD
      (PP_4219) is a module of the pyoverdine NRPS assembly line, a different siderophore pathway with
      a different partner set; shared nonribosomal assembly chemistry from the PTHR45527 NRPS node is
      what drives the transfer. GO has no pyoverdine-specific synthetase complex term, so no replacement
      is proposed.
- gene: PSEPK/pvdE
  gene_file: genes/PSEPK/pvdE/pvdE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0034040
    term_label: ATPase-coupled lipid transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: retained
    rationale: Rejection stands; an explicit reason was added where the block previously carried only
      a summary. The term names a lipid substrate specifically. UniProt describes the protein as 'Pyoverdine
      ABC export system, fused ATPase and permease components', and GOA separately annotates GO:1904680
      peptide transmembrane transporter activity and GO:0015833 peptide transport, so the inferred cargo
      is a peptidic pyoverdine precursor. The lipid specificity comes from the broad PTHR24221 ABC sub-family
      B node, which mixes lipid and drug flippases.
- gene: PSEPK/pyrG
  gene_file: genes/PSEPK/pyrG/pyrG-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0019856
    term_label: pyrimidine nucleobase biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands; reason strengthened. QuickGO defines GO:0019856 as formation of pyrimidine
      nucleobases, the free 1,3-diazine bases, which are produced upstream at the orotate/UMP stage. PyrG
      aminates the assembled nucleotide UTP to CTP (EC 6.3.4.2) and releases no free base. The accurate
      GO:0006241 and GO:0044210 rows are carried separately, so flagging costs no coverage.
- gene: PSEPK/quiA
  gene_file: genes/PSEPK/quiA/quiA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0008876
    term_label: quinoprotein glucose dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands. QuickGO gives GO:0008876 as D-glucose + ubiquinone = D-glucono-1,5-lactone
      + ubiquinol using PQQ, a specific sugar substrate. UniProt names the protein Quinate dehydrogenase
      (quinone) with EC 1.1.5.8, and GOA carries the matching GO:0047519 on a separate row. This is a
      wrong-substrate sibling from the PTHR32303:SF4 subfamily rather than a true ancestor, so ACCEPT
      is not available; it is flagged rather than removed because PQQ dehydrogenases of this family are
      often broad-specificity.
- gene: PSEPK/relA
  gene_file: genes/PSEPK/relA/relA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0005886
    term_label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: 'Rejection stands. This is the case the README carves out from the broad-location rule:
      a generic compartment incompatible with the protein. RelA has no transmembrane segments in UniProt
      and no membrane-targeting feature; its domain set (synthetase/HD, TGS, ACT) and its activation mechanism
      place it in the cytosol on stalled ribosomes. The location is not merely broad, it is the wrong
      compartment.'
  - term_id: GO:0008893
    term_label: guanosine-3',5'-bis(diphosphate) 3'-diphosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands as recorded. The RSH family node PTHR21262 spans monofunctional synthetases
      and bifunctional SpoT/Rel hydrolase-synthetases, and TreeGrafter cannot separate them; in gamma-proteobacterial
      RelA the HD hydrolase motif is degenerate and ppGpp hydrolysis is attributed to SpoT. MARK_AS_OVER_ANNOTATED
      rather than REMOVE is the right strength, since residual HD sequence (Pfam PF13328 HD_4) is present
      and the activity has not been assayed on P. putida RelA.
- gene: PSEPK/retS
  gene_file: genes/PSEPK/retS/retS-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0071474
    term_label: cellular hyperosmotic response
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: Changed to UNDECIDED. The rejection rested on the absence of KT2440-specific osmotic evidence
      rather than on contrary evidence. Decisively, the falcon deep research states the ligand sensed
      by the periplasmic 7TMR-DISM module is unknown, so an osmotic input can be neither demonstrated
      nor excluded; the K1-T6SS repression evidence concerns a pathway output and does not argue against
      an additional input. Needs an osmotic-shock phenotype or signal-binding assay on PP_4824.
- gene: PSEPK/rfbC
  gene_file: genes/PSEPK/rfbC/rfbC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0000271
    term_label: polysaccharide biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands. GO:0000271 is formation of a polymer of many monosaccharide residues
      linked glycosidically. RfbC performs a C3/C5 epimerization on a soluble nucleotide sugar (EC 5.1.3.13)
      and forms no glycosidic bond; the polymerisation is done by downstream glycosyltransferases. Supplying
      a precursor is not participating in the polymer's synthesis, and the accurate GO:0019305 dTDP-rhamnose
      biosynthetic process row is carried separately.
- gene: PSEPK/rlmE
  gene_file: genes/PSEPK/rlmE/rlmE-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0008173
    term_label: RNA methyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'Relaxed to ACCEPT. GO:0008173 is transfer of a methyl group to a nucleoside residue in
      an RNA molecule, exactly what RlmE does (EC 2.1.1.166; UniProt ''Specifically methylates the uridine
      in position 2552 of 23S''). It is a true ancestor of GO:0008650, which GOA already carries on a
      separate row, so the README''s rule 3 gives ACCEPT: redundancy with a carried descendant does not
      make the ancestor an over-annotation.'
- gene: PSEPK/rmlC
  gene_file: genes/PSEPK/rmlC/rmlC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0000271
    term_label: polysaccharide biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands, on the same grounds as the paralogous rfbC row. RmlC is a dTDP-4-dehydrorhamnose
      3,5-epimerase (EC 5.1.3.13) producing a soluble nucleotide-sugar precursor; it forms no glycosidic
      linkage and the specific GO:0019305 process is separately annotated.
- gene: PSEPK/scpC
  gene_file: genes/PSEPK/scpC/scpC-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0003986
    term_label: acetyl-CoA hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: Relaxed from REMOVE to MARK_AS_OVER_ANNOTATED. The CoA-transferase reading is better supported
      (UniProt SubName 'Propionyl-CoA:succinate CoA transferase', EC 2.8.3.-; InterPro IPR017821 Succinate_CoA_transferase;
      a complete class-I CoA-transferase active site per OpenScientist), but hydrolase and transferase
      chemistry are carried by the same acetyl-CoA hydrolase/transferase fold, the assigned subfamily
      is literally PTHR43609:SF1 ACETYL-COA HYDROLASE, and no biochemistry exists for Q88RH5. Enough to
      say the term overreaches, not enough to assert it is false.
- gene: PSEPK/sdhA
  gene_file: genes/PSEPK/sdhA/sdhA-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009061
    term_label: anaerobic respiration
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands. UniProt states that two distinct FAD enzymes interconvert fumarate and
      succinate, fumarate reductase (FrdA) in anaerobic growth and succinate dehydrogenase in aerobic
      growth, and assigns this protein the forward-direction signatures NCBIfam TIGR01816 and InterPro
      IPR011281 Succ_DH_flav_su_fwd. The term comes from the combined SdhA/FrdA node (InterPro IPR030664),
      and the aerobic counterparts GO:0006099 and GO:0022900 are separately annotated.
- gene: PSEPK/sdhD
  gene_file: genes/PSEPK/sdhD/sdhD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0017004
    term_label: cytochrome complex assembly
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: Relaxed from REMOVE to MARK_AS_OVER_ANNOTATED. GO:0017004 is the aggregation, arrangement
      and bonding together of a cytochrome complex, i.e. what an assembly factor does; for Complex II
      that role is attributed to SdhE. SdhD is the heme-ligating membrane anchor, a component of the cytochrome
      b556 module rather than a demonstrated assembler, so the term overreaches. Not removed, because
      a subunit supplying the heme axial ligands plausibly contributes to formation of its own cytochrome
      module and that cannot be excluded here.
- gene: PSEPK/secD
  gene_file: genes/PSEPK/secD/secD-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0015031
    term_label: protein transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Relaxed to ACCEPT. GO:0015031 is the directed movement of proteins into, out of or within
      a cell, which SecD does as part of the SecDF accessory complex that uses the proton motive force
      to complete translocation after the ATP-dependent SecA step (UniProt; PMID:21562494). It is a true
      ancestor of GO:0043952, carried on a separate GOA row, so redundancy is not over-annotation.
- gene: PSEPK/secF
  gene_file: genes/PSEPK/secF/secF-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: changed
  annotations:
  - term_id: GO:0015031
    term_label: protein transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: 'Relaxed to ACCEPT on the same grounds as the paired SecD row: a true ancestor of the separately
      carried GO:0043952, for a genuine participant in Sec-dependent translocation.'
- gene: PSEPK/tatC-I
  gene_file: genes/PSEPK/tatC-I/tatC-I-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009977
    term_label: proton motive force dependent protein transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: Rejection stands as recorded. The term names the translocation activity of the assembled
      TatABC translocase; TatC is the receptor/scaffold subunit that recognises twin-arginine signal peptides
      with TatB and recruits TatA, and does not enable PMF-driven translocation on its own. The GOA row
      uses the 'enables' qualifier, which attributes the whole-complex activity to the single subunit;
      the review's core_functions correctly records it as contributes_to. Flagged, not removed, since
      the activity itself is real for the complex.
- gene: PSEPK/tatC-II
  gene_file: genes/PSEPK/tatC-II/tatC-II-ai-review.yaml
  status: reviewed
  scope: treegrafter_rejections
  outcome: confirmed
  annotations:
  - term_id: GO:0009977
    term_label: proton motive force dependent protein transmembrane transporter activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: retained
    rationale: 'Rejection stands, identical to the tatC-I row: an ''enables'' qualifier on a single subunit
      for an activity carried out by the assembled TatABC translocase, retained as contributes_to in core_functions.'
