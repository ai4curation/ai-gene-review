- gene_file: genes/PSEPK/alg8/alg8-ai-review.yaml
  status: reviewed
  scope: full_gene
  annotation_count: 6
  outcome: Restored conditional matrix assembly and corrected substrate/strain-transfer reasoning.
  changes:
  - index: 1
    term: GO:0030213
    label: hyaluronan biosynthetic process
    evidence_type: IEA
    reference: GO_REF:0000118
    old_action: REMOVE
    new_action: REMOVE
    reason: Alg8 polymerizes GDP-mannuronate into the alginate precursor mannuronan. Hyaluronan instead contains
      alternating glucuronic acid and N-acetylglucosamine. The rejection rests on substrate specificity, not a claim
      that hyaluronan synthesis is restricted to vertebrates.
  - index: 3
    term: GO:0085029
    label: extracellular matrix assembly
    evidence_type: IEA
    reference: GO_REF:0000118
    old_action: MARK_AS_OVER_ANNOTATED
    new_action: KEEP_AS_NON_CORE
    reason: GO:0085029 covers aggregation, arrangement and bonding of extracellular matrix. Alg8 performs polymer
      assembly rather than merely being a substrate of the process. PMID:17601783 links alginate to biofilm architecture
      under water limitation in P. putida mt-2; this supports conditional matrix function by related-strain evidence.
      PMID:25968647 establishes the Alg8-Alg44 polymerase mechanism in P. aeruginosa. Transfer to the conserved
      KT2440 machinery is reasonable, while alginic acid biosynthesis remains the most specific core process.
  evidence:
    summary: Extracellular matrix assembly is retained as a conditional non-core context of alginate polymerization.
      Alg8 performs polymer-building work, and a broader process need not be its most specific core description.
      PMID:17601783 states "Alginate influenced biofilm architecture" but explicitly assays P. putida mt-2, not
      KT2440. PMID:25968647 directly assays the P. aeruginosa Alg8-Alg44 complex. The existing OpenScientist operon
      synthesis was read and incorporated with this strain-transfer caveat; its direct-KT2440 attribution is disputed.
      Hyaluronan terms remain incorrect because Alg8 uses GDP-mannuronate for alginate rather than the alternating
      hyaluronan substrates; the erroneous vertebrate-only rationale was removed. No source annotation was deleted
      and no new term was added.
    references:
    - file:PSEPK/alg8/alg8-uniprot.txt
    - file:PSEPK/alg8/alg8-goa.tsv
    - file:interpro/panther/PTHR22913/PTHR22913-entries.csv
