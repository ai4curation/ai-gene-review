  - original_index: 12
    term_id: GO:2000042
    term_label: negative regulation of double-strand break repair via homologous recombination
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    negated: false
    previous_action: REMOVE
    action: REMOVE
    outcome: confirmed
    rationale: 'This is the one propagated term with direct, species-specific evidence against it. The primary study
      states that naked-mole-rat cGAS lacks the suppressive function that the human and mouse orthologs have in
      homologous recombination repair, and attributes the difference to four amino acids fixed during evolution.
      The replacement activity runs in the opposite direction: prolonged chromatin retention strengthens the FANCI-RAD50
      interaction and promotes RAD50 recruitment to damage sites, potentiating homologous recombination.

      The propagation is not defective at its source. PTN002579681 sits at taxon:117571 (Euteleostomi) and its seeds
      — mouse Cgas and human CGAS — genuinely do suppress homologous recombination, so the PAINT curator encoded
      a real and well-supported property of the species that had been examined. What fails is the assumption that
      the property is conserved across the whole clade. The naked mole rat is inside that clade and does the opposite,
      which is exactly the target-specific evidence of functional divergence needed to challenge a node placement
      — as distinct from an objection based on how many donors seeded it.

      Retaining a negative-regulation term alongside the positive one would assert both directions at once, so this
      row is removed rather than modified, and the correct activity is asserted separately as GO:1905168.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
