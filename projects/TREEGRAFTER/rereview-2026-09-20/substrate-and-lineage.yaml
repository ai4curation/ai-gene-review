  - original_index: 2
    term_id: GO:0003682
    term_label: chromatin binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    negated: false
    previous_action: ACCEPT
    action: ACCEPT
    outcome: confirmed
    rationale: 'This is the one molecular function for which there is explicit naked-mole-rat evidence. The primary
      study reports that the four species-specific substitutions make cGAS retain chromatin longer after DNA damage,
      and refers to the resulting state as prolonged chromatin binding. The structural basis is also intact: the
      arginine anchor by which cGAS docks onto the nucleosome acidic patch (human R255) is conserved as R287 in
      A0AAX6RS70. Rather than being weakened by the naked-mole-rat divergence, chromatin binding is enhanced by
      it, so this term is not merely retained but is core.'
