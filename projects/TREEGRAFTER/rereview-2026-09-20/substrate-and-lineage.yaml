    rationale: QuickGO currently defines GO:0071360 as cellular response to exogenous dsRNA and lists four positive
      mouse experimental annotations feeding the cGAS ancestral node. However, the inspected full text of PMID:23258413
      reports that poly(I:C) did not stimulate purified cGAS, and PMID:24077100 centers on DNA-triggered cGAMP transfer.
