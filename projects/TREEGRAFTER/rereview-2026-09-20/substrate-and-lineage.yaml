    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    negated: false
    previous_action: ACCEPT
    action: ACCEPT
    outcome: changed
    rationale: cGAS reads B-form double-stranded DNA through a zinc thumb and a set of basic DNA-binding surfaces.
      Residue transfer from human cGAS shows the zinc thumb intact (H390/C396/C397/C404 to H422/C428/C429/C436)
      and the C-terminal DNA-binding region 384-407 at 62.5% identity, i.e. ordinary orthologue-level conservation
      with no disruption. The only substitutions among human single-residue annotations that touch DNA are K187
      and L195, which UniProt annotates as tuning preference for curved long DNA and which lie in the fast-evolving
      disordered N-terminal arm; those affect substrate preference at most, not the capacity to bind dsDNA. The
      native chromatin phenotype is compatible with a DNA-binding protein but, by itself, does not distinguish contacts
      with DNA from contacts with histones. Nothing about the species-specific C-terminal divergence bears on this.
