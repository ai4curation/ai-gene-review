  - original_index: 13
    term_id: GO:1905168
    term_label: positive regulation of double-strand break repair via homologous recombination
    evidence_type: IMP
    original_reference_id: PMID:41066557
    negated: false
    previous_action: NEW
    action: NEW
    outcome: confirmed
    rationale: 'The primary study reports a positive, mechanistically specified role for cGAS in homologous recombination
      in this species: prolonged chromatin binding strengthens the FANCI-RAD50 interaction and facilitates RAD50
      recruitment to damage sites, thereby potentiating homologous recombination repair. The conclusion is drawn
      from an engineered four-residue substitution series that shifts the naked-mole-rat protein toward the human
      and mouse behaviour, which is why IMP is the appropriate evidence code.

      GO:1905168 was chosen deliberately over the two neighbouring options. The gene product is not itself performing
      recombination, so GO:0000724 double-strand break repair via homologous recombination would overstate the role;
      and the effect is specific to the homologous-recombination pathway rather than to repair in general, so the
      broader GO:2000781 positive regulation of double-strand break repair would understate it. The identifier was
      confirmed against QuickGO rather than written from memory.

      No accompanying ageing or lifespan term is proposed. The abstract does support an anti-ageing role, but reduced
      senescence and extended lifespan here are indirect, downstream consequences of improved repair, and NEW is
      explicitly not for indirect or pleiotropic effects.'
