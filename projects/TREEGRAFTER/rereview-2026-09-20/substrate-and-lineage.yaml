      RNA sensing is not required for an indirect cellular-response annotation, so these observations do not justify
      removal. The unresolved question is whether the complete donor evidence supports an indirect dsRNA response
      or a DNA/RNA term mismatch; absence of a naked-mole-rat assay is not the reason for uncertainty.
