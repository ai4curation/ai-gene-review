    original_reference_id: GO_REF:0000104
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: Hydrolase activity acting on ester bonds is a valid broad function of the enzyme. Redundancy
      with substrate-specific phosphatase activity is not a biological error.
