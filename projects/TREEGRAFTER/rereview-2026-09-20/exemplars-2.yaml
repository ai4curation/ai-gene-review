- gene: DOROP/ADAR2
  gene_file: genes/DOROP/ADAR2/ADAR2-ai-review.yaml
  status: reviewed
  scope: full_gene
  outcome: changed
  annotation_count: 13
  annotations:
  - term_id: GO:0003723
    term_label: RNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: The broad RNA-binding term is entailed by directly supported dsRNA binding. It is part
      of the core substrate-recognition mechanism, not peripheral simply because a more specific binding
      annotation also exists.
  - term_id: GO:0003725
    term_label: double-stranded RNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: dsRNA binding is a core molecular function of sqADAR2, demonstrated directly using recombinant
      protein with quantitative binding assays. The three dsRBD architecture of sqADAR2a is a defining
      and unique feature of this enzyme. This is at the right level of specificity for the binding function.
  - term_id: GO:0003726
    term_label: double-stranded RNA adenosine deaminase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: This is the defining catalytic activity of sqADAR2 and the most important molecular function
      annotation. It has been demonstrated directly using recombinant enzyme on multiple substrates, with
      quantitative activity data. The term is at exactly the right level of specificity.
  - term_id: GO:0004000
    term_label: adenosine deaminase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: MODIFY
    action: MODIFY
    outcome: retained
    rationale: GO:0004000 (adenosine deaminase activity) describes the deamination of free adenosine,
      which is the activity of ADA enzymes, not ADAR enzymes. ADAR2 specifically deaminates adenosine
      residues within double-stranded RNA. The correct term GO:0003726 is already annotated, so this annotation
      should be replaced to avoid confusion between ADA and ADAR activities.
  - term_id: GO:0005634
    term_label: nucleus
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: Nuclear localization is well-supported for ADAR2 enzymes generally, as co-transcriptional
      editing of pre-mRNAs occurs in the nucleus. While sqADAR2 is also found in the cytoplasm, nuclear
      localization remains valid.
  - term_id: GO:0005730
    term_label: nucleolus
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: UNDECIDED
    action: UNDECIDED
    outcome: changed
    rationale: Retain UNDECIDED because the available squid localization evidence resolves nucleus versus
      cytoplasm but not nucleolus. Vertebrate nucleolar localization can support a phylogenetic hypothesis;
      missing target-specific microscopy alone is not a refutation. An explicit comparison of nucleolar-targeting
      determinants would help assess this prediction.
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: Cytoplasmic localization is directly demonstrated in squid neurons, where sqADAR2 is found
      in the axoplasm and is catalytically active. This represents a significant finding that RNA editing
      occurs outside the nucleus in squid. The term is appropriate.
  - term_id: GO:0006382
    term_label: adenosine to inosine editing
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: A-to-I editing is the defining biological process for sqADAR2. This is supported by extensive
      direct evidence from multiple studies using recombinant protein assays and transcriptome-wide editing
      profiling. The term is at exactly the right level of specificity.
  - term_id: GO:0006396
    term_label: RNA processing
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: The broad process describes the same direct catalytic work as the accepted A-to-I editing
      annotation. Its generality is not evidence of a non-core role.
  - term_id: GO:0008251
    term_label: tRNA-specific adenosine deaminase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: changed
    rationale: tRNA-specific adenosine deaminase activity is the function of ADAT enzymes, not ADAR enzymes.
      sqADAR2 has been tested and shown to be active on dsRNA and mRNA substrates. There is no evidence
      that sqADAR2 edits tRNAs, and the domain architecture (dsRBDs + ADAR-type deaminase domain) is inconsistent
      with tRNA editing activity. This is a phylogenetic transfer error likely due to the shared deaminase
      domain superfamily between ADARs and ADATs. The existing OpenScientist report supports the three-dsRBD
      architecture, while Falcon incorrectly labels C1JAR3 as the two-dsRBD sqADAR2b variant. The cached
      786-aa sequence has three dsRNA-binding domains and is consistent with sqADAR2a. Functional divergence
      is supported, but no exact historical graft error is established from domain architecture alone.
  - term_id: GO:0016556
    term_label: mRNA modification
    evidence_type: NAS
    original_reference_id: PMID:25569156
    previous_action: NEW
    action: NEW
    outcome: retained
    rationale: mRNA modification (GO:0016556) captures the specific substrate class (mRNA) that sqADAR2
      acts on. While GO:0006382 (adenosine to inosine editing) is the most specific process term, mRNA
      modification highlights that the primary biological role of sqADAR2 is to modify mRNAs encoding
      proteins, as opposed to editing structural RNAs or tRNAs.
  - term_id: GO:0008270
    term_label: zinc ion binding
    evidence_type: NAS
    original_reference_id: PMID:37342458
    previous_action: NEW
    action: NEW
    outcome: retained
    rationale: Zinc ion binding is an inherent property of the ADAR catalytic deaminase domain. The UniProt
      entry lists zinc binding as a keyword. While metal ion binding (GO:0046872) is annotated in the
      UniProt GO cross-references, the more specific zinc ion binding term better captures the biochemistry
      of the ADAR active site.
  - term_id: GO:1904115
    term_label: axon cytoplasm
    evidence_type: NAS
    original_reference_id: PMID:32201888
    previous_action: NEW
    action: NEW
    outcome: retained
    rationale: Axon cytoplasm localization is directly demonstrated for sqADAR2 in the squid giant axon
      system. This is a key finding that distinguishes sqADAR2 function from the canonical nuclear-only
      editing paradigm. The term GO:1904115 (axon cytoplasm) is more specific than GO:0005737 (cytoplasm)
      and accurately captures the demonstrated localization.
  changes:
  - term_id: GO:0003723
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
  - term_id: GO:0006396
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
  evidence:
    existing_adjudications:
    - genes/DOROP/ADAR2/ADAR2-hypotheses/function-hypothesis-go-0008251/falcon.md
    - genes/DOROP/ADAR2/ADAR2-hypotheses/function-hypothesis-go-0008251/openscientist.md
    notes_file: genes/DOROP/ADAR2/ADAR2-notes.md
  adjudication:
