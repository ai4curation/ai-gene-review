      activity is not over-annotation.
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: UniProt annotates the cytoplasmic location and this is consistent with the function of
      a soluble metabolic regulatory enzyme.
  - term_id: GO:0006006
    term_label: glucose metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: Glucose-versus-acetate growth changes the AceK/IDH regulatory state. That observation supports
      metabolic regulation but does not itself establish a glucose-specific metabolic pathway role, since
      TCA and glyoxylate partitioning also concerns other carbon sources. Retain the over-annotation judgment
      with this scope distinction, without claiming that AceK is inactive whenever cells grow on glucose.
  - term_id: GO:0006097
    term_label: glyoxylate cycle
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: AceK enables flux through the glyoxylate shunt by inactivating IDH, partitioning isocitrate
      toward isocitrate lyase and malate synthase. This is a defining biological role of the enzyme.
  - term_id: GO:0006099
    term_label: tricarboxylic acid cycle
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: By reactivating IDH (dephosphorylation), AceK restores TCA-cycle flux; by inactivating
      IDH (phosphorylation) it diverts flux to the glyoxylate bypass. This regulatory role makes the TCA
      cycle association appropriate.
  - term_id: GO:0008772
    term_label: '[isocitrate dehydrogenase (NADP+)] kinase activity'
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: Matches the UniProt-annotated catalytic activity (EC 2.7.11.5) and the kinase half of the
      bifunctional enzyme. This is a central, specific core function.
  - term_id: GO:0016208
    term_label: AMP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: The E. coli AceK structure shows AMP at an interdomain allosteric site controlling the
      opposing catalytic activities. This provides positive family-level support for the TreeGrafter inference
      to the conserved P. putida AceK. An unmeasured target-specific binding constant is not sufficient
      reason to mark the inherited mechanism non-core.
