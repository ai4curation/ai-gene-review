  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: ACCEPT
    outcome: changed
    rationale: The current cytosol definition excludes organelles but includes soluble proteins and protein
      complexes. It applies to bacteria; the existing cytoplasm annotation does not justify replacing
      this correct, more specific localization.
  - term_id: GO:0006979
