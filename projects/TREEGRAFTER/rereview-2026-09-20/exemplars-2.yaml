    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: Direct peroxide reduction performs work in the oxidative-stress response. The more specific
      detoxification annotation is complementary and does not make this core protective role peripheral.
  - term_id: GO:0008379
    term_label: thioredoxin peroxidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: MODIFY
    outcome: changed
    rationale: QuickGO checked on 2026-09-20 marks GO:0008379 obsolete; preserve the source GOA identifier
      and refine its review to the active peroxiredoxin term. Independently, the existing reports support
      a typical AhpC/AhpF system and distinguish its immediate protein reductant from free thioredoxin.
      Their donor discussion does not undermine peroxide reduction, antioxidant activity or H2O2 catabolism.
  - term_id: GO:0016209
    term_label: antioxidant activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: KEEP_AS_NON_CORE
