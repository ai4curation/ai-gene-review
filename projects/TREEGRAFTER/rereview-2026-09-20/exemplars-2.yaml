    outcome: changed
    rationale: Primary 2026 data support nicotinate N-glucosylation at the mapped g26396 locus, with a
      documented construct-boundary caveat. They do not assay every alternative acceptor. Neither the
      positive nicotine function nor sequence-family distance establishes that quercetin or 7-deoxyloganetic
      acid cannot also be glucosylated. The earlier reports wrongly used missing assays and automated
      homolog names as negative biochemical evidence. Retain the source assertion for substrate-panel
      adjudication rather than asserting a negative function.
