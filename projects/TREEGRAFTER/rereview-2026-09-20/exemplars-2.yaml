    original_reference_id: GO_REF:0000118
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: Peroxide reduction directly limits oxidative burden as part of the antioxidant system.
      This is a supported broad process, not merely an unrelated phenotype.
