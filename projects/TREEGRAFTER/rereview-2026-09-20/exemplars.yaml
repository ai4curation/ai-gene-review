- gene: 9POAL/NCGR_LOCUS1270
  annotation_count: 13
  all_annotations_reviewed: true
  annotations:
  - term_id: GO:0042132
    term_label: fructose 1,6-bisphosphate 1-phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: Core enzymatic activity. Strong domain-based evidence from multiple sources (InterPro, PANTHER,
      HAMAP, Pfam PF00316). This is the primary molecular function of the protein.
  - term_id: GO:0016791
    term_label: phosphatase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: The specific FBPase activity does not invalidate this independently sourced broad InterPro annotation.
      ACCEPT reflects the same core catalytic function at broader granularity.
  - term_id: GO:0042578
    term_label: phosphoric ester hydrolase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: The broad InterPro activity is entailed by the defining enzymatic reaction. Coexistence with
      the more specific GO:0042132 is not over-annotation.
  - term_id: GO:0005975
    term_label: carbohydrate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: The Calvin cycle supplies physiological context but does not make carbohydrate metabolic process
      false or peripheral. The enzyme itself catalyzes the reaction; this is not an indirect phenotype-based
      assignment.
  - term_id: GO:0005985
    term_label: sucrose metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    previous_action: MODIFY
    action: UNDECIDED
    outcome: changed
    rationale: Chloroplast FBPase supplies and regulates carbon partitioning, whereas the best-established
      sucrose-synthesis reactions use the cytosolic paralog. Supplying precursors alone is not sufficient participation,
      but a different main compartment is not a negative functional assay. The named TreeGrafter reference
      is itself a chloroplast-associated sorghum protein, so the previous automatic cytosolic-paralog explanation
      is unproven. Preserve uncertainty about the actual physiological process boundary.
  - term_id: GO:0005986
    term_label: sucrose biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: retained
    rationale: The dominant Calvin-cycle role and separation from cytosolic FBPase are supported, but the previous
      absolute exclusion and claimed paralog misgraft were not established. Current PTN004269459 is the sorghum
      A0A1B6QP66 leaf, annotated to chloroplast/Calvin cycle and 96.85% identical across the full global alignment.
      Rice cytosolic-FBPase perturbation shows that paralog contributes to sucrose synthesis; it does not prove
      that all conditional contributions of this chloroplast homolog are absent. Direct pathway participation
      still needs clarification rather than being inferred simply from exported carbon.
  - term_id: GO:0006000
    term_label: fructose metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: UNDECIDED
    outcome: changed
    rationale: The report correctly separates fructose from its phosphorylated derivatives in the is_a hierarchy,
      but absence of an ancestor relation does not make pathways disjoint or require direct free-fructose turnover
      by every enzyme. QuickGO explicitly assigns this term to human FBP1/FBP2 with TAS and Dictyostelium fbp
      with IDA, and the F6P-process definition names fructose metabolism. Those comparators refute a blanket
      exclusion while not proving this chloroplast enzyme contributes to every fructose pathway. Retain UNDECIDED
      pending physiological and curator-scope clarification.
  - term_id: GO:0006002
    term_label: fructose 6-phosphate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: GO:0006002 covers chemical reactions involving F6P without requiring a cytosolic location. Chloroplast
      Calvin-cycle chemistry therefore satisfies the term. The previous review incorrectly treated absent pathway
      specificity as over-annotation.
  - term_id: GO:0006094
    term_label: gluconeogenesis
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: GO:0006094 describes glucose formation from noncarbohydrate precursors and does not impose the
      prior asserted cytosolic-only location. Chloroplast targeting and redox regulation distinguish this enzyme
      from the canonical cytosolic paralog, but neither is a direct demonstration of loss of all gluconeogenic
      participation. Shared FBPase chemistry alone also does not establish the complete pathway role. The named
      TreeGrafter reference is a close chloroplast-associated sorghum homolog; the actual query insertion and
      lineage-specific loss have not been established.
  - term_id: GO:0030388
    term_label: fructose 1,6-bisphosphate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: KEEP_AS_NON_CORE
    action: ACCEPT
    outcome: changed
    rationale: This substrate-centered process directly describes the work performed by the enzyme and is core.
      Calvin-cycle context is complementary; it does not relegate FBP metabolism to a non-core function.
  - term_id: GO:0005737
    term_label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: ACCEPT
    outcome: changed
    rationale: GO:0005737 includes subcellular structures outside the nucleus and plasma membrane, including
      plastids. The previous REMOVE conflated cytoplasm with cytosol. Retain this broad localization while
      retaining the separate challenge to GO:0005829 cytosol.
  - term_id: GO:0005829
    term_label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: UNDECIDED
    outcome: changed
    rationale: The predicted transit sequence, conserved redox-regulatory insertion and close chloroplast homologs
      strongly support stromal localization. They do not by themselves establish exclusive import or exclude
      a conditional cytosolic pool. The source PTN leaf maps to the closely matching chloroplast-associated
      sorghum homolog, contradicting the assumption that TreeGrafter necessarily selected a cytosolic paralog.
      Retain the compartment conflict as UNDECIDED rather than asserting a demonstrated negative localization.
  - term_id: GO:0009507
    term_label: chloroplast
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    previous_action: MODIFY
    action: MODIFY
    outcome: retained
    rationale: Correct but could be more specific. The enzyme operates in the chloroplast stroma (GO:0009570),
      which is the site of the Calvin cycle reactions. Stromal localization is supported by immunolocalization
      of the related cpFBPaseII and by the enzyme's pH-dependent regulation (active at stromal alkaline pH
      ~8.0 in light).
