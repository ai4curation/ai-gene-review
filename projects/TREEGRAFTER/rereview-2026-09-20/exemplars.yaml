- gene: DESVH/Q72DT2
  annotation_count: 7
  all_annotations_reviewed: true
  annotations:
  - term_id: GO:0000104
    term_label: succinate dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: REMOVE
    action: REMOVE
    outcome: changed
    rationale: AprA has the APS-reductase substrate chemistry, AprA-specific domain assignment and sulfate-reduction
      pathway context, rather than succinate dehydrogenation. Existing OpenScientist and Falcon reports corroborate
      this distinction. Their assertion that a covalent FAD-binding histidine is universally necessary for
      all SDH/FRD catalysis is stronger than needed here and is not used as decisive proof. The incorrect function
      is established independently of whether the historical PANTHER graft position or ancestral term mapping
      caused it.
  - term_id: GO:0005886
    term_label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: ACCEPT
    outcome: changed
    rationale: Exact-strain membrane-preparation and reciprocal purification evidence supports a peripheral
      Qmo-associated pool. The broad GO term includes associated proteins.
  - term_id: GO:0009055
    term_label: electron transfer activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: ACCEPT
    outcome: changed
    rationale: The current GO:0009055 definition includes directed electron transfer resulting in redox transformation
      during enzymatic reactions. AprB supplies the upstream Fe-S relay, but AprA performs FAD-dependent reduction
      of APS itself. Absence of Fe-S clusters in AprA does not exclude this broad molecular function; the prior
      review incorrectly restricted the term to carrier subunits.
  - term_id: GO:0009061
    term_label: anaerobic respiration
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: MODIFY
    outcome: retained
    rationale: While anaerobic respiration is technically correct, the more specific term GO:0019420 (dissimilatory
      sulfate reduction) precisely captures AprA's biological role. AprA catalyzes a key step in this pathway
      where APS is reduced to sulfite.
  - term_id: GO:0050660
    term_label: flavin adenine dinucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: FAD binding is well-established for AprA based on domain architecture (FAD-binding_2 domain)
      and functional characterization. The FAD cofactor is central to the catalytic mechanism of APS reduction.
  - term_id: GO:0009973
    term_label: adenylyl-sulfate reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: This is the primary molecular function of AprA, strongly supported by multiple lines of evidence
      including EC classification, domain architecture (IPR011803 AprA, TIGR02061), UniProt annotation, and
      extensive literature.
  - term_id: GO:0016491
    term_label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    previous_action: ACCEPT
    action: ACCEPT
    outcome: retained
    rationale: While accurate, this is a high-level parent term that is redundant with the more specific GO:0009973.
      The annotation is technically correct based on the catalytic function of AprA in reducing APS.
