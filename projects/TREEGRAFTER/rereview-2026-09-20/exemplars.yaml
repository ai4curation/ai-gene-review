- gene: OCTVU/OCTS1
  annotation_count: 5
  all_annotations_reviewed: true
  annotations:
  - term_id: GO:0004364
    term_label: glutathione transferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: Retain MARK_AS_OVER_ANNOTATED for propagation of an ancestral detoxifying GST function to a
      structural lens protein. Residual in-vitro catalysis is real and is not erased by this decision; its
      physiological importance for OCTS1 has not been demonstrated. The OctS4 study supports the family mechanism
      of enhanced GSH stabilization and reduced electrophilic-substrate catalysis, while the exact OCTS1-specific
      kinetic magnitude and residue effects remain inferred. Existing adjudications agree on structural co-option,
      but their categorical absence-of-function and essential-tryptophan language exceeds what is needed for
      this judgment.
  - term_id: GO:0006749
    term_label: glutathione metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MARK_AS_OVER_ANNOTATED
    action: MARK_AS_OVER_ANNOTATED
    outcome: changed
    rationale: 'Retain the challenge to a physiological glutathione-metabolism assignment: the evidence supports
      a structural lens role and conserved GSH interaction, but does not establish appreciable OCTS1-specific
      glutathione turnover in vivo. The reported residual catalysis and homolog experiments are acknowledged
      rather than treated as absence of all chemistry.'
  - term_id: GO:0005212
    term_label: structural constituent of eye lens
    evidence_type: TAS
    original_reference_id: PMID:7639695
    previous_action: NEW
    action: NEW
    outcome: retained
    rationale: This is the primary molecular function of OCTS1. The protein has been co-opted from an ancestral
      GST enzyme to serve as a structural/refractive lens protein. Multiple studies confirm lens-specific expression
      and structural role. Although present in UniProt via keyword mapping, it is not in the GOA export and
      should be formally annotated. This is the most important annotation for this protein.
  - term_id: GO:0043295
    term_label: glutathione binding
    evidence_type: ISS
    original_reference_id: PMID:27499004
    previous_action: NEW
    action: NEW
    outcome: changed
    rationale: Retain the conservative GSH-binding proposal as an inferred conserved property of closely related
      S-crystallins. The 43-fold Km difference is an apparent kinetic parameter from OctS4, not a directly
      measured OCTS1 binding dissociation constant. A target-specific assay is still needed to establish OCTS1
      affinity and stabilization quantitatively.
  - term_id: GO:0007601
    term_label: visual perception
    evidence_type: NAS
    original_reference_id: PMID:17293312
    previous_action: NEW
    action: NEW
    outcome: changed
    rationale: S-crystallins supply the refractive structure that focuses incoming light, which is direct structural
      participation in visual perception. A QuickGO comparator query on 2026-09-20 found the same process annotation
      on the lens structural proteins CRYAA (experimental) and CRYBA1 (IBA/NAS), supporting this use of the
      term. The squid radial-gradient evidence is homolog-level support for the octopus lens protein, not an
      OCTS1-specific perturbation assay.
