- gene: PSEPK/fcs
  annotation_count: 3
  all_annotations_reviewed: true
  annotations:
  - term_id: GO:0006631
    term_label: fatty acid metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: MODIFY
    outcome: changed
    rationale: Fcs acts on ferulate, a hydroxycinnamic (aromatic) acid, not a fatty acid, and the supporting
      molecular function is feruloyl-CoA synthetase activity for hydroxycinnamate catabolism rather than fatty
      acid metabolism. The enzyme is the committed entry step of the ferulate/hydroxycinnamate catabolic funnel
      into the beta-ketoadipate pathway. The correct biological process is ferulate catabolic process (GO:1901067).
  - term_id: GO:0031956
    term_label: medium-chain fatty acid-CoA ligase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    previous_action: MODIFY
    action: MODIFY
    outcome: changed
    rationale: Although Fcs is correctly placed in the AMP-binding/acyl-CoA synthetase superfamily, the medium-chain
      fatty acid-CoA ligase term (GO:0031956) does not describe its substrate. Fcs activates ferulate (and
      other hydroxycinnamates) to their CoA thioesters; the precise, EC-supported term trans-feruloyl-CoA synthase
      activity (GO:0050563) is already annotated and is the appropriate replacement. Plaggenborg et al. (PMID:12764569)
      directly tested the KT2440 enzyme. Both existing adjudication reports support the aromatic-substrate
      assignment, but neither a narrow BLAST score advantage nor the PANTHER subfamily label proves the actual
      graft point was wrong.
  - term_id: GO:0050563
    term_label: trans-feruloyl-CoA synthase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    previous_action: ACCEPT
    action: ACCEPT
    outcome: changed
    rationale: This is the precise, EC-based annotation for feruloyl-CoA synthetase (ATP + CoA + trans-ferulate
      -> feruloyl-CoA + AMP + diphosphate). It is consistent with the protein name, the AMP-binding/ANL domain
      architecture, and pathway evidence placing Fcs (PP_3356) at the ferulate -> feruloyl-CoA activation step
      in P. putida KT2440. Represents the core function of the gene.
