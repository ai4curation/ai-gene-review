  changes:
  - term_id: GO:0000140
    previous_action: REMOVE
    action: UNDECIDED
    reason: The fog-cluster pathway and curated reductive-release proposal support specialization of
      FogD, but they do not directly test acylglycerone-phosphate reduction or exclude retained
      substrate promiscuity. The historical TreeGrafter node PTN001211783 is not present in the
      current cached PAINT slice, which has an Ayr1-seeded DHAP-reductase IBD at PTN001963740.
      Source function is real; target inheritance requires adjudication rather than categorical
      rejection from pathway context alone.
  - term_id: GO:0004806
    previous_action: REMOVE
    action: UNDECIDED
    reason: 'The previous claim that no SDR enzyme can catalyze triacylglycerol hydrolysis is false: PMID:24187129
      establishes Ayr1 lipase activity in vivo and in vitro. Thus the apparent oxidoreductase/hydrolase
      conflict does not refute the source or automatically refute FogD. FogD lipid hydrolysis remains
      untested in the examined sources, and the precise TreeGrafter inheritance needs assessment.'
  - term_id: GO:0005783
    previous_action: REMOVE
    action: UNDECIDED
    reason: A soluble SDR participating in secondary-metabolite synthesis can associate peripherally
      with the ER; neither absence of a signal peptide nor partnership with a polyketide synthase
      excludes it. The cached PAINT ER IBD at PTN001213826 is grounded in yeast Ayr1, but the
      historical FogD graft has not been reconstructed. No target localization experiment was found
      in the inspected supplement. Retain uncertainty instead of treating pathway identity as an
      exclusion.
  - term_id: GO:0005811
    previous_action: REMOVE
    action: UNDECIDED
    reason: The Ayr1 source has experimentally supported lipid-droplet association, and FogD
      membership in a biosynthetic cluster does not preclude such a compartment or another
      protein-bound pool. No target localization assay establishes or excludes lipid droplets in the
      inspected sources. An ancestral localization claim requires a clade or targeting-divergence
      argument, not merely a different known pathway.
  - term_id: GO:0006654
    previous_action: REMOVE
    action: UNDECIDED
    reason: FogD participates in flavoglaucin biosynthesis, but this establishes neither exclusive
      substrate use nor absence of a second lipid-biosynthetic role. The source Ayr1 function is a
      real phosphatidic-acid-pathway activity. FogD-specific activity and phylogenetic placement
      remain unresolved, so the earlier categorical claim of no phospholipid role is too strong.
  - term_id: GO:0019433
    previous_action: REMOVE
    action: UNDECIDED
    reason: Biosynthetic participation and an SDR fold do not exclude an additional catabolic
      activity. Ayr1 demonstrates that reductase/lipase bifunctionality occurs in the source family.
      Whether FogD retains lipid hydrolysis and contributes to triglyceride turnover is unresolved;
      no target assay or demonstrated loss was provided by the earlier review.
  - term_id: GO:0044550
    action: ACCEPT
    previous_action: ACCEPT
    reason: Retained biosynthetic role; corrected heterologous and strain context.
  - previous_term_id: GO:0016616
    term_id: GO:0016491
    action: NEW
    reason: Generalized author-proposed reaction class to conservative SDR-derived redox activity,
      with ISS and explicit database provenance.
  - term_id: GO:0030639
    previous_action: NEW
    action: withdrawn
    reason: Redundant descendant of existing secondary-metabolite process; specific pathway remains
      in core functions.
