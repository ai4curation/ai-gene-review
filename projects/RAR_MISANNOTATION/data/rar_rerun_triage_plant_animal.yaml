source:
  candidates: projects/RAR_MISANNOTATION/data/rar_rerun_direct_candidates.yaml
  scope: kingdom-level candidates flagged in Plants or Animals
  triage_date: '2026-11-11'
  status: FIRST_PASS
  method: Five groups (plant IBA, plant inferred, plant experimental, animal inferred, animal experimental),
    each triaged against GO term definitions and constraints (QuickGO), protein identity and curated function
    (UniProt), the PAINT node or mapping behind each row, and cached papers where quoted; then merged
    with a coverage check and a check that every proposed replacement id is a live GO term.
  verdicts: 'ANNOTATION_WRONG, CONSTRAINT_QUESTIONABLE, FLAG_FAILS, TRUE_BUT_GENERAL, UNCERTAIN as in
    rar_rerun_triage.yaml, plus DEFER_TO_CURATOR: an experimental row whose term can apply to the lineage,
    with the full text not read. Experimental rows are not overruled on first-pass evidence; they are
    called ANNOTATION_WRONG only when the term''s definition or GO taxon constraint excludes the lineage,
    as a term choice.'
  note: First-pass verdicts; nothing is filed upstream. Verbatim quotes are given where a cached paper
    or UniProt record decides the verdict; other reasons rest on QuickGO and UniProt REST lookups and
    PubMed abstracts.
  totals:
    terms: 958
    entries: 987
    verdicts:
      ANNOTATION_WRONG: 139
      CONSTRAINT_QUESTIONABLE: 4
      DEFER_TO_CURATOR: 379
      FLAG_FAILS: 363
      TRUE_BUT_GENERAL: 36
      UNCERTAIN: 66
groups:
- group: plants_iba
  terms: 128
  entry_count: 129
  verdicts:
    ANNOTATION_WRONG: 18
    CONSTRAINT_QUESTIONABLE: 1
    FLAG_FAILS: 96
    UNCERTAIN: 14
  summary: '128 terms, 129 entries (GO:0044038 split by species). Verdicts: FLAG_FAILS 96, ANNOTATION_WRONG
    18, UNCERTAIN 14, CONSTRAINT_QUESTIONABLE 1. Most flags are curation-density artefacts: plant metabolic
    enzymes (purine, arginine, thiamine, biotin, histidine) where bacteria dominate the denominator, and
    conserved eukaryotic machinery (replication, repair, splicing, cohesin, Pol I) that is simply under-curated
    in plants. The ANNOTATION_WRONG calls are all over-deep PAINT nodes carrying animal-only biology onto
    plant proteins: TNF/TNFR, Wnt, NOS-dependent NO regulation (DDAH), heparan sulfate, S100 calcium-dependent
    binding, BORC lysosome positioning, GATOR2/SEACAT (SEH1, SEC13), ESCRT-0, myosin II/myosin filament,
    polytene chromosome, centrosome, astral microtubules, FASTK RNA granules and ALAS (land plants use
    the C5 pathway). Selaginella''s flagellate sperm make the cilium/IFT/transition-zone rows consistent,
    and the Metazoa-only constraint on sperm axoneme assembly looks too narrow.'
  fetched_pmids: []
  entries:
  - go_id: GO:0005813
    label: centrosome
    aspect: CC
    annotations:
    - UniProtKB:D8RR71 (Selaginella, IBA)
    - UniProtKB:Q9M2Q7 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000471210
    verdict: ANNOTATION_WRONG
    reason: G-patch proteins (At3g57910, D8RR71) inherit centrosome from a node seeded only by human GPATCH11
      (Q8N954); land plants have no centrosomes and the rows break GO's never_in_taxon Viridiplantae constraint.
  - go_id: GO:0008933
    label: peptidoglycan lytic transglycosylase activity
    aspect: MF
    annotations:
    - UniProtKB:D8SPF8 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN002410022
    verdict: UNCERTAIN
    reason: D8SPF8 is in PANTHER subfamily PTHR30163:SF8 (lytic murein transglycosylase) under an E. coli/Pseudomonas-seeded
      node. The activity needs a peptidoglycan substrate; settle by showing plastid peptidoglycan in Selaginella
      (it has MurA and MraY homologs, as mosses with plastid PG do).
  - go_id: GO:0045041
    label: protein import into mitochondrial intermembrane space
    aspect: BP
    annotations:
    - UniProtKB:Q8GYJ4 (Arabidopsis, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN000492699; other: InterPro:IPR039289'
    verdict: FLAG_FAILS
    reason: Arabidopsis MIA40 (IPR039289) is the IMS import receptor; the plant mitochondrial disulfide-relay
      pathway is real and only one plant protein is annotated.
  - go_id: GO:0030695
    label: GTPase regulator activity
    aspect: MF
    annotations:
    - UniProtKB:D8T2B9 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN004747825
    verdict: FLAG_FAILS
    reason: D8T2B9 is in PANTHER subfamily PTHR31010:SF2 (Ran-specific GAP 30, yeast YRB30 seed); the
      Ran GTPase cycle exists in plants. The low rate reflects a rarely-used general term.
  - go_id: GO:1990228
    label: sulfurtransferase complex
    aspect: CC
    annotations:
    - UniProtKB:Q9FXE3 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000978101
    verdict: FLAG_FAILS
    reason: Arabidopsis SUFE2 activates plastid cysteine desulfurase NFS2 (UniProt FUNCTION, PubMed:17452319),
      the plant counterpart of the E. coli CsdA-CsdE pair that seeds the node.
  - go_id: GO:0097163
    label: sulfur carrier activity
    aspect: MF
    annotations:
    - UniProtKB:Q9FXE3 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000978101
    verdict: FLAG_FAILS
    reason: SUFE2 accepts persulfide sulfur from NFS2 for Fe-S assembly, a SufE-family property; plant
      rarity is curation density.
  - go_id: GO:0009009
    label: site-specific recombinase activity
    aspect: MF
    annotations:
    - UniProtKB:D8RBV8 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN001251457
    verdict: UNCERTAIN
    reason: D8RBV8 (1401 aa, tyrosine-recombinase domain, current PANTHER PTHR21446:SF12) sits under a
      node seeded only by E. coli XerC/XerD. A eukaryotic protein inside a bacterial Xer clade suggests
      a transposon-encoded recombinase or a contaminating contig; settle by checking whether D8RBV8 is
      a DIRS/Crypton-type transposon ORF and what other eukaryotes the node holds.
  - go_id: GO:0005246
    label: calcium channel regulator activity
    aspect: MF
    annotations:
    - UniProtKB:D8RUD1 (Selaginella, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN001031746; other: InterPro:IPR037608'
    verdict: UNCERTAIN
    reason: The node is seeded by STIM1/STIM2. D8RUD1 matches the STIM1/2 InterPro entry (IPR037608) and
      PANTHER STIM family (PTHR15136), but its only Pfam domain is SAM; Selaginella also has Orai-domain
      proteins (Pfam PF07856, e.g. D8RGM9). Settle by checking D8RUD1 for the TM and SOAR/CAD regions
      needed to gate Orai; if present, a lycophyte SOCE pair is rare real biology.
  - go_id: GO:0008157
    label: protein phosphatase 1 binding
    aspect: MF
    annotations:
    - UniProtKB:Q8S8F7 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000464544
    verdict: FLAG_FAILS
    reason: INH3 is a PP1 regulatory/inhibitory subunit; PP1 binding is its defining property and plant
      PP1 regulators are simply under-curated.
  - go_id: GO:1904262
    label: negative regulation of TORC1 signaling
    aspect: BP
    annotations:
    - UniProtKB:D8S7M9 (Selaginella, IBA)
    - UniProtKB:D8T401 (Selaginella, IBA)
    - UniProtKB:Q9M391 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000366325
    verdict: UNCERTAIN
    reason: Ataxin-3 homologs (At3g54130, two Selaginella Josephin proteins) inherit this from a node
      seeded only by human ATXN3 (P54252). Plant TOR signalling exists but lacks TSC/Rheb and Rag-GATOR
      modules; settle by identifying the TORC1 input ATXN3 acts on in human and whether plants have it.
  - go_id: GO:0006363
    label: termination of RNA polymerase I transcription
    aspect: BP
    annotations:
    - UniProtKB:D8R331 (Selaginella, IBA)
    - UniProtKB:D8SMF0 (Selaginella, IBA)
    - UniProtKB:Q9LU97 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000133053
    verdict: FLAG_FAILS
    reason: RPA12-family Pol I subunits; Rpa12-mediated Pol I termination is a conserved eukaryotic process
      and plants have Pol I.
  - go_id: GO:0065002
    label: intracellular protein transmembrane transport
    aspect: BP
    annotations:
    - UniProtKB:D8RAV0 (Selaginella, IBA)
    - UniProtKB:D8RH88 (Selaginella, IBA)
    - UniProtKB:Q9SJV5 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000769484
    verdict: FLAG_FAILS
    reason: TatC (chloroplast Tat translocase) moves folded proteins across the thylakoid membrane; correct
      for Arabidopsis TATC and its Selaginella orthologs.
  - go_id: GO:0031293
    label: membrane protein intracellular domain proteolysis
    aspect: BP
    annotations:
    - UniProtKB:F4JUU5 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN004417004
    verdict: FLAG_FAILS
    reason: Arabidopsis S2P is the site-2 protease that releases the cytosolic domains of membrane-bound
      bZIP17/bZIP28; regulated intramembrane proteolysis exists in plants.
  - go_id: GO:0034023
    label: 5-(carboxyamino)imidazole ribonucleotide mutase activity
    aspect: MF
    annotations:
    - UniProtKB:Q9SJ42 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000549177
    verdict: FLAG_FAILS
    reason: At2g05140 is a PurE-type CAIR mutase fragment; plants use the bacterial-type PurK/PurE route,
      so the activity is right and the low rate reflects that animals use PAICS instead.
  - go_id: GO:0035869
    label: ciliary transition zone
    aspect: CC
    annotations:
    - UniProtKB:D8QTL3 (Selaginella, IBA)
    - UniProtKB:D8SBR2 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000401088
    verdict: FLAG_FAILS
    reason: Selaginella has flagellate sperm; D8QTL3/D8SBR2 are KAP3 (kinesin-2 associated protein) homologs
      from a node seeded by mouse Kifap3. GO's constraint excludes only seed plants, so the Selaginella
      rows are consistent.
  - go_id: GO:0044689
    label: 7,8-didemethyl-8-hydroxy-5-deazariboflavin synthase activity
    aspect: MF
    annotations:
    - UniProtKB:D8RBF3 (Selaginella, IBA/IEA)
    - UniProtKB:D8RY80 (Selaginella, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN000540995; other: EC:4.3.1.32'
    verdict: FLAG_FAILS
    reason: D8RBF3/D8RY80 are CofH/CofG FO synthases (EC 4.3.1.32 mapping agrees). FO (photolyase antenna
      chromophore) synthesis is rare in eukaryotes but domain architecture supports the activity; rare
      biology, possibly horizontally acquired.
  - go_id: GO:0030892
    label: mitotic cohesin complex
    aspect: CC
    annotations:
    - UniProtKB:Q56YN8 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000434523
    verdict: FLAG_FAILS
    reason: Arabidopsis SMC3 is the cohesin SMC subunit used in plant mitosis; correct, curation density
      only.
  - go_id: GO:1904263
    label: positive regulation of TORC1 signaling
    aspect: BP
    annotations:
    - UniProtKB:D8RPE9 (Selaginella, IBA)
    - UniProtKB:D8SM57 (Selaginella, IBA)
    - UniProtKB:Q93VR9 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000111887
    verdict: ANNOTATION_WRONG
    reason: SEH1/SEC13 act in TORC1 signalling only as GATOR2/SEACAT members. Arabidopsis, Selaginella
      and Physcomitrella have no NPRL2 (PTHR12991), WDR24 (PTHR46200) or MIOS (PTHR16453) family members
      in UniProt, so plant SEH1/SEC13 are nucleoporins and COPII coat proteins only. The node is placed
      above a lineage that lost the SEA/GATOR complexes.
  - go_id: GO:0000107
    label: imidazoleglycerol-phosphate synthase activity
    aspect: MF
    annotations:
    - UniProtKB:D8RBX3 (Selaginella, IBA/IEA)
    - UniProtKB:D8RXQ1 (Selaginella, IBA/IEA)
    - UniProtKB:Q9SZ30 (Arabidopsis, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN000477998; other: InterPro:IPR004651, InterPro:IPR014640, RHEA:24793'
    verdict: FLAG_FAILS
    reason: HISN4 is the bifunctional glutaminase/cyclase IGP synthase of plant histidine biosynthesis
      (UniProt FUNCTION); animals lack the pathway, hence the low plant rate.
  - go_id: GO:0071030
    label: nuclear mRNA surveillance of spliceosomal pre-mRNA splicing
    aspect: BP
    annotations:
    - UniProtKB:O23676 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000290902
    verdict: FLAG_FAILS
    reason: MAGO (EJC core) row comes from a node seeded by one S. pombe experiment (mnh1); nuclear surveillance
      of mis-spliced pre-mRNA is a general eukaryotic process with nothing animal-specific.
  - go_id: GO:0140597
    label: protein carrier activity
    aspect: MF
    annotations:
    - UniProtKB:D8RF76 (Selaginella, IBA)
    - UniProtKB:D8SDD1 (Selaginella, IBA)
    - UniProtKB:Q6GKV1 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000305707
    verdict: FLAG_FAILS
    reason: GET4 is a conserved GET-pathway component that hands tail-anchored proteins to GET3; the GET
      pathway is characterised in Arabidopsis.
  - go_id: GO:0000346
    label: transcription export complex
    aspect: CC
    annotations:
    - UniProtKB:Q8L4M1 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN002547886
    verdict: FLAG_FAILS
    reason: THO6 is a TREX/THO subunit; the TREX complex exists in plants.
  - go_id: GO:0001002
    label: RNA polymerase III type 1 promoter sequence-specific DNA binding
    aspect: MF
    annotations:
    - UniProtKB:F4HP69 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN001430930
    verdict: FLAG_FAILS
    reason: F4HP69 is a TFIIIC subunit homolog (node seeded by yeast TFC6/tau91); plant 5S rRNA genes
      use type 1 Pol III promoters, so the concept applies.
  - go_id: GO:1903457
    label: lactate catabolic process
    aspect: BP
    annotations:
    - UniProtKB:Q94AX4 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000202298
    verdict: FLAG_FAILS
    reason: Arabidopsis D-LDH is the mitochondrial D-lactate dehydrogenase of methylglyoxal detoxification;
      lactate catabolism is correct.
  - go_id: GO:0034087
    label: establishment of mitotic sister chromatid cohesion
    aspect: BP
    annotations:
    - UniProtKB:A5HEI1 (Arabidopsis, IBA)
    - UniProtKB:D8RFB7 (Selaginella, IBA)
    - UniProtKB:D8SDH0 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000496017
    verdict: FLAG_FAILS
    reason: SCC2/Nipped-B cohesin loaders; establishment of cohesion is conserved and Arabidopsis SCC2
      is characterised.
  - go_id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
    aspect: BP
    annotations:
    - UniProtKB:D8R5K7 (Selaginella, IBA)
    - UniProtKB:D8SFE0 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN002313819
    verdict: ANNOTATION_WRONG
    reason: D8SFE0/D8R5K7 are COMMD proteins (PTHR16231:SF4) inheriting from a node seeded only by human
      COMMD7. Plants have no TNF or TNF receptors (no PTHR11471 or PTHR46861 members in Arabidopsis or
      Selaginella).
  - go_id: GO:0032418
    label: lysosome localization
    aspect: BP
    annotations:
    - UniProtKB:F4J1T2 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000337884
    verdict: ANNOTATION_WRONG
    reason: KXD1 inherits this from human KXD1 (BORC). The BORC-specific subunits BORCS5, BORCS6, BORCS7
      and BORCS8 have no PANTHER family members in Arabidopsis, and plants have lytic vacuoles rather
      than motile lysosomes; plant KXD1 can only act through BLOC-1.
  - go_id: GO:0043291
    label: RAVE complex
    aspect: CC
    annotations:
    - UniProtKB:F4IJ68 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000359150
    verdict: FLAG_FAILS
    reason: F4IJ68 is the Arabidopsis Rav1/DMXL homolog (node seeded by yeast and pombe Rav1); RAVE-type
      V-ATPase assembly regulation is plausibly eukaryote-wide.
  - go_id: GO:0048306
    label: calcium-dependent protein binding
    aspect: MF
    annotations:
    - UniProtKB:D8RL71 (Selaginella, IBA)
    - UniProtKB:Q9XIR0 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN007521306
    verdict: ANNOTATION_WRONG
    reason: The node is seeded only by vertebrate S100 proteins (S100B, S100A6, S100P, S100A11). The plant
      proteins are in PANTHER PTHR37754 (calcium ion-binding protein), and the S100 family PTHR11639 has
      no members in Arabidopsis or Selaginella, so the node joins unrelated EF-hand clades.
  - go_id: GO:0000729
    label: DNA double-strand break processing
    aspect: BP
    annotations:
    - UniProtKB:D8QPA7 (Selaginella, IBA)
    - UniProtKB:D8SL68 (Selaginella, IBA)
    - UniProtKB:Q9ZUL5 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000743674
    verdict: FLAG_FAILS
    reason: CHR19/ETL1 is the plant Fun30/SMARCAD1 remodeler, which promotes end resection in yeast and
      human; DSB processing exists in plants.
  - go_id: GO:0070914
    label: UV-damage excision repair
    aspect: BP
    annotations:
    - UniProtKB:D8RQ83 (Selaginella, IBA)
    - UniProtKB:D8TDH1 (Selaginella, IBA)
    - UniProtKB:Q9MA98 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000297520
    verdict: FLAG_FAILS
    reason: ERCC1 is the NER endonuclease subunit; Arabidopsis ERCC1 is characterised in UV repair.
  - go_id: GO:0051880
    label: G-quadruplex DNA binding
    aspect: MF
    annotations:
    - UniProtKB:D8QZS8 (Selaginella, IBA)
    - UniProtKB:D8TC60 (Selaginella, IBA)
    - UniProtKB:Q9SL02 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000429848
    verdict: FLAG_FAILS
    reason: RAD50 node; G-quadruplex DNA is not lineage-specific and nothing in the claim excludes plants.
  - go_id: GO:0052837
    label: thiazole biosynthetic process
    aspect: BP
    annotations:
    - UniProtKB:D8RPN5 (Selaginella, IBA/IEA)
    - UniProtKB:D8TFQ8 (Selaginella, IBA/IEA)
    - UniProtKB:Q38814 (Arabidopsis, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN000065314; other: UniRule:UR000375967'
    verdict: FLAG_FAILS
    reason: THI1/THI4 thiazole synthase; correct, plants and fungi make thiamine and animals do not.
  - go_id: GO:0180020
    label: membrane bending activity
    aspect: MF
    annotations:
    - UniProtKB:D8S6Z2 (Selaginella, IBA)
    - UniProtKB:D8T7G1 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN001398562
    verdict: FLAG_FAILS
    reason: PER33/POM33 (TMEM33 family) ER-shaping proteins; tubular ER exists in plants and the family
      is conserved.
  - go_id: GO:0005700
    label: polytene chromosome
    aspect: CC
    annotations:
    - UniProtKB:D8RAW7 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN002920257
    verdict: ANNOTATION_WRONG
    reason: No polytene chromosomes are described in Selaginella, and nothing places D8RAW7 in one; the
      function arose in the Drosophila Set8 lineage below PTN002920257. (Polyteny itself occurs outside
      Diptera, e.g. in some plant suspensors, so the call rests on this protein, not on the term.)
  - go_id: GO:0051598
    label: meiotic recombination checkpoint signaling
    aspect: BP
    annotations:
    - UniProtKB:F4HRV8 (Arabidopsis, IBA)
    - UniProtKB:Q8H1F9 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000554401, PANTHER:PTN008491432
    verdict: UNCERTAIN
    reason: ASY1 and PCH2 sit under HORMAD1/HOP1 and PCH2 nodes. Arabidopsis PCH2 remodels the meiotic
      axis and matures crossovers (UniProt FUNCTION, PubMed:26182244), but no recombination checkpoint
      arrest is shown in plants. Settle with evidence that plant asy1/pch2 or recombination mutants trigger
      a meiotic checkpoint arrest.
  - go_id: GO:0006617
    label: SRP-dependent cotranslational protein targeting to membrane, signal sequence recognition
    aspect: BP
    annotations:
    - UniProtKB:D8T2Q1 (Selaginella, IBA)
    - UniProtKB:Q943Z6 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000425879
    verdict: FLAG_FAILS
    reason: SRP19 is a core SRP subunit; cotranslational targeting is universal.
  - go_id: GO:0000403
    label: Y-form DNA binding
    aspect: MF
    annotations:
    - UniProtKB:A0A1I9LR82 (Arabidopsis, IBA)
    - UniProtKB:D8SVF6 (Selaginella, IBA)
    - UniProtKB:D8T0Q4 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000325249
    verdict: FLAG_FAILS
    reason: CSM3 (Tipin/Swi3) replication-fork protection; Y-form DNA binding is a conserved fork-protection
      property.
  - go_id: GO:0033176
    label: proton-transporting V-type ATPase complex
    aspect: CC
    annotations:
    - UniProtKB:D8SKE5 (Selaginella, IBA)
    - UniProtKB:D8T0F9 (Selaginella, IBA)
    - UniProtKB:Q9XGM1 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN002268884
    verdict: FLAG_FAILS
    reason: V-ATPase subunit D; plant V-ATPase is well characterised.
  - go_id: GO:0170057
    label: RNA ligase (GTP) activity
    aspect: MF
    annotations:
    - UniProtKB:D8SNU5 (Selaginella, IBA/IEA)
    - UniProtKB:D8SS91 (Selaginella, IBA/IEA)
    mechanism: 'IBA PANTHER:PTN000122119; other: EC:6.5.1.8, InterPro:IPR001233, InterPro:IPR036025'
    verdict: FLAG_FAILS
    reason: D8SNU5/D8SS91 carry the RtcB domain (IPR001233; EC 6.5.1.8 mapping agrees); RtcB-type ligase
      in a lycophyte is rare but genuine domain-supported biology.
  - go_id: GO:0000707
    label: meiotic DNA recombinase assembly
    aspect: BP
    annotations:
    - UniProtKB:Q8GXF0 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN000534385
    verdict: FLAG_FAILS
    reason: Arabidopsis RAD51C is required for meiotic recombination; correct.
  - go_id: GO:0071162
    label: CMG complex
    aspect: CC
    annotations:
    - UniProtKB:A0A1P8AW53 (Arabidopsis, IBA)
    - UniProtKB:D8R606 (Selaginella, IBA)
    - UniProtKB:D8SG75 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000308454
    verdict: FLAG_FAILS
    reason: PSF1 is a GINS subunit of the CMG helicase; universal in eukaryotes.
  - go_id: GO:0030177
    label: positive regulation of Wnt signaling pathway
    aspect: BP
    annotations:
    - UniProtKB:D8T779 (Selaginella, IBA)
    - UniProtKB:D8TE34 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000370137
    verdict: ANNOTATION_WRONG
    reason: Cereblon homologs inherit this from human CRBN and Drosophila ohgata. Plants have no Wnt ligands
      (no PTHR12027 members in Arabidopsis or Selaginella) and no canonical Wnt pathway.
  - go_id: GO:0000730
    label: DNA recombinase assembly
    aspect: BP
    annotations:
    - UniProtKB:D8R902 (Selaginella, IBA)
    - UniProtKB:P94102 (Arabidopsis, IBA)
    - UniProtKB:Q39009 (Arabidopsis, IBA)
    mechanism: IBA PANTHER:PTN001415033
    verdict: FLAG_FAILS
    reason: RAD51, DMC1 and a RecA-domain paralog form recombinase filaments; universal in eukaryotes.
  - go_id: GO:0070987
    label: error-free translesion synthesis
    aspect: BP
    annotations:
    - UniProtKB:A3EWL3 (Arabidopsis, IBA)
    - UniProtKB:D8R5R1 (Selaginella, IBA)
    - UniProtKB:D8SFY4 (Selaginella, IBA)
    mechanism: IBA PANTHER:PTN000117973
    verdict: FLAG_FAILS
    reason: REV1 and Pol eta are Y-family translesion polymerases; conserved in plants.
  - go_id: GO:0004076
    label: biotin synthase activity
    aspect: MF
    annotations:
