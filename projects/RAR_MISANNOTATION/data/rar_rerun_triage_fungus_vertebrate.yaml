source:
  candidates: projects/RAR_MISANNOTATION/data/rar_rerun_direct_candidates.yaml
  scope: kingdom-level candidates flagged in Fungi, and phylum-level candidates flagged in Vertebrates
    or Invertebrates
  triage_date: '2026-11-21'
  status: FIRST_PASS
  method: Five groups (fungi; vertebrates inferred and experimental; invertebrates inferred and experimental),
    each triaged against GO term definitions and constraints (QuickGO), protein identity and curated function
    (UniProt), the PAINT node or mapping behind each row, existing repo gene reviews, and cached papers
    where quoted; then merged with a coverage check, a summary-count check and a check that every proposed
    replacement id is a live GO term.
  verdicts: 'As in rar_rerun_triage_plant_animal.yaml: ANNOTATION_WRONG, CONSTRAINT_QUESTIONABLE, FLAG_FAILS,
    TRUE_BUT_GENERAL, DEFER_TO_CURATOR (experimental row whose term can apply to the lineage, full text
    not read) and UNCERTAIN.'
  note: First-pass verdicts; nothing is filed upstream. Verbatim quotes are given where a cached paper
    or record decides the verdict; other reasons rest on QuickGO and UniProt REST lookups and PubMed abstracts.
  totals:
    terms: 361
    entries: 380
    verdicts:
      ANNOTATION_WRONG: 64
      CONSTRAINT_QUESTIONABLE: 2
      DEFER_TO_CURATOR: 162
      FLAG_FAILS: 113
      TRUE_BUT_GENERAL: 15
      UNCERTAIN: 24
groups:
- group: fungi
  terms: 81
  entry_count: 83
  verdicts:
    ANNOTATION_WRONG: 20
    CONSTRAINT_QUESTIONABLE: 1
    DEFER_TO_CURATOR: 18
    FLAG_FAILS: 29
    TRUE_BUT_GENERAL: 8
    UNCERTAIN: 7
  summary: '81 terms, 83 entries (GO:0007166 and GO:0042545 split by protein). Verdicts: ANNOTATION_WRONG
    20, CONSTRAINT_QUESTIONABLE 1, FLAG_FAILS 29, TRUE_BUT_GENERAL 8, DEFER_TO_CURATOR 18, UNCERTAIN 7.
    The errors are mostly animal or plant biology carried onto yeasts by over-deep PAINT nodes (centriole,
    apical plasma membrane, RICTOR to PI3K/PKB, cryptochrome circadian on photolyase, CDPK on Nnk1, PaaK
    CoA-ligase on an A-PCP-R protein, bacterial sialic-acid catabolism on Nag1), by InterPro2GO, ARBA
    and UniPathway mappings (NF-kB regulation, excinuclease ABC on UTP20, stress fiber, plant developmental
    terms on a Candida Myb protein and UAP1, fungal L-arabinose catabolism on S. cerevisiae Xyl2), and
    by wrong-source transfers (Coq3 location to a non-orthologous methyltransferase, human ESCRT midbody
    abscission to yeast Vps4 via ComplexPortal, CEK1/CDC42 IMPs from a num11 deletion paper). Most other
    flags are real fungal biology thin in curated sets (glucose GPCRs, polygalacturonase, siderophore
    and gluconate transport, Candida biofilm), and the cell migration and cholesterol binding rows repeat
    the constraint-break triage verdicts.'
  fetched_pmids:
  - PMID:11929974
  - PMID:12551942
  - PMID:20624975
  entries:
  - go_id: GO:0048731
    label: system development
    aspect: BP
    annotations:
    - UniProtKB:Q59T43 (C. albicans CAALFM_C205640WA, IEA)
    mechanism: IEA ARBA:ARBA00027702
    verdict: ANNOTATION_WRONG
    reason: Q59T43 is a two-repeat Myb DNA-binding protein (PTHR45614; it also carries IBAs from Arabidopsis
      MYB nodes) and the ARBA rule carries a plant/animal developmental term onto it. System development
      is defined over organ systems built from organs or tissues, which a unicellular/hyphal yeast lacks;
      GO already bars the term from S. cerevisiae and S. pombe, and C. albicans is no different.
  - go_id: GO:0004930
    label: G protein-coupled receptor activity
    aspect: MF
    annotations:
    - UniProtKB:A0A1D8PN42 (C. albicans GPR1, IBA/ISS)
    - UniProtKB:O94744 (S. pombe git3, IBA)
    - UniProtKB:Q12361 (S. cerevisiae GPR1, IBA/IMP/IPI)
    mechanism: IBA PANTHER:PTN000560943; ISS from SGD:S000002193; IMP PMID:9524122; IPI PMID:9388468;
      IPI PMID:9524122
    verdict: FLAG_FAILS
    reason: Gpr1 (S. cerevisiae), git3 (S. pombe) and C. albicans Gpr1 are the fungal glucose/nutrient-sensing
      GPCRs that couple to the Galpha Gpa2; the IBA node and the SGD IMP/IPI rows describe real fungal
      GPCRs, few in number.
  - go_id: GO:0005814
    label: centriole
    aspect: CC
    annotations:
    - UniProtKB:O94455 (S. pombe, IBA)
    mechanism: IBA PANTHER:PTN000549683
    verdict: ANNOTATION_WRONG
    reason: Yeasts have no centrioles; their MTOC is the spindle pole body. O94455 is a two-EF-hand calcium-binding
      protein in the centrin-like PTHR23050 node, seeded by human centrins, and is localized to cytoplasm
      and nucleus (ORFeome, PMID:16823372), so the centriole CC is an over-deep node placement onto a
      fungus.
  - go_id: GO:0003995
    label: acyl-CoA dehydrogenase activity
    aspect: MF
    annotations:
    - UniProtKB:A0A1D8PTU4 (C. albicans CAALFM_CR08920WA, IBA)
    mechanism: IBA PANTHER:PTN002535634
    verdict: FLAG_FAILS
    reason: A0A1D8PTU4 carries all three acyl-CoA dehydrogenase domains (PF02771, PF02770, PF00441) and
      sits in PTHR48083; the general ACAD activity is a reasonable family inference and ACADs exist in
      filamentous and Candida fungi, so the rarity is curation density.
  - go_id: GO:0015293
    label: symporter activity
    aspect: MF
    annotations:
    - UniProtKB:A0A1D8PHJ7 (C. albicans CNT, IBA/IDA)
    mechanism: IBA PANTHER:PTN000063482; IDA PMID:15543539
    verdict: FLAG_FAILS
    reason: C. albicans Cnt is a concentrative nucleoside transporter (CNT/SLC28 family), which are cation-coupled
      symporters; the IDA (PMID:15543539) and IBA agree.
  - go_id: GO:0046942
    label: carboxylic acid transport
    aspect: BP
    annotations:
    - UniProtKB:P53322 (S. cerevisiae TNA1, IMP)
    mechanism: IMP PMID:10869563
    verdict: TRUE_BUT_GENERAL
    reason: Tna1 is the high-affinity nicotinic acid permease; nicotinate is a carboxylic acid, so the
      IMP is right but a specific term exists.
    replacement: GO:2001142 nicotinate transport
  - go_id: GO:0045490
    label: pectin catabolic process
    aspect: BP
    annotations:
    - UniProtKB:P47180 (S. cerevisiae PGU1, IBA/IDA)
    mechanism: IBA PANTHER:PTN001275777; IDA PMID:10028181
    verdict: FLAG_FAILS
    reason: PGU1 is the S. cerevisiae endopolygalacturonase (GH28) with IDA support; pectin breakdown
      by yeast is real, and fungi are simply under-represented next to plants.
  - go_id: GO:0016324
    label: apical plasma membrane
    aspect: CC
    annotations:
    - UniProtKB:A0A1D8PKK4 (C. albicans CAALFM_C306710WA, IBA)
    - UniProtKB:O60146 (S. pombe, IBA)
    - UniProtKB:P38329 (S. cerevisiae VHC1, IBA)
    mechanism: IBA PANTHER:PTN002274228
    verdict: ANNOTATION_WRONG
    reason: The SLC12 cation-chloride cotransporter node (PTN002274228) inherits apical membrane from
      vertebrate epithelial NKCC/NCC seeds; yeasts have no epithelial apical domain, and S. cerevisiae
      Vhc1 is a vacuolar membrane K+-Cl- symporter (UniProt, PMID:23022132), so the CC is wrong for all
      three fungal members.
  - go_id: GO:0007166
    label: cell surface receptor signaling pathway
    aspect: BP
    annotations:
    - UniProtKB:P87179 (S. pombe wsc1, IC)
    mechanism: IC from GO:0004888
    verdict: FLAG_FAILS
    reason: S. pombe Wsc1 is a transmembrane cell-wall stress sensor signalling to Rho1; the in-repo review
      ACCEPTs this IC row.
  - go_id: GO:0007166
    label: cell surface receptor signaling pathway
    aspect: BP
    annotations:
    - UniProtKB:P42838 (S. cerevisiae LEM3, IMP)
    mechanism: IMP PMID:11063677
    verdict: DEFER_TO_CURATOR
    reason: LEM3 IMP (PMID:11063677, not read); fungi have cell-surface receptor pathways, so the term
      can apply.
  - go_id: GO:0009653
    label: anatomical structure morphogenesis
    aspect: BP
    annotations:
    - UniProtKB:Q59T43 (C. albicans CAALFM_C205640WA, IEA)
    mechanism: IEA ARBA:ARBA00026583
    verdict: UNCERTAIN
    reason: Plant/animal-derived ARBA term on the Myb protein Q59T43; anatomical structure morphogenesis
      includes cell morphogenesis and so can apply to a fungus, but the rule's basis for this protein
      is not visible. Settle with a C. albicans morphology phenotype for orf19.14163 (it has an IMP for
      filamentous growth, PMID:20041210, which is not under this term).
  - go_id: GO:0016477
    label: cell migration
    aspect: BP
    annotations:
    - UniProtKB:P13649 (C. albicans URA3, IMP)
    - UniProtKB:Q59X67 (C. albicans EFG1, IMP)
    mechanism: IMP PMID:10865906
    verdict: ANNOTATION_WRONG
    reason: 'Same rows and verdict as the constraint-break triage (rar_rerun_triage.yaml): walled fungal
      cells do not self-propel, the rows break never_in_taxon Ascomycota, and invasive/hyphal growth has
      its own terms; URA3 is OMP decarboxylase, so its phenotype is indirect.'
  - go_id: GO:0044325
    label: transmembrane transporter binding
    aspect: MF
    annotations:
    - UniProtKB:Q06671 (S. cerevisiae ATG23, IPI)
    mechanism: IPI PMID:42477132
    verdict: DEFER_TO_CURATOR
    reason: ATG23 IPI with Atg9 (SGD:S000002308; PMID:42477132, not read); Atg9 is a lipid scramblase,
      which GO classes as a transporter, so the term can apply.
  - go_id: GO:0005216
    label: monoatomic ion channel activity
    aspect: MF
    annotations:
    - UniProtKB:O14234 (S. pombe cch1, IEA)
    - UniProtKB:P50077 (S. cerevisiae CCH1, IEA)
    - UniProtKB:Q5A936 (C. albicans CCH1, IEA)
    mechanism: IEA InterPro:IPR005821
    verdict: TRUE_BUT_GENERAL
    reason: Cch1 is the four-domain voltage-gated calcium channel homolog of yeasts; the generic ion-transport-domain
      mapping (IPR005821) is right but the S. pombe protein already carries the specific VGCC term from
      IPR002077.
    replacement: GO:0005245 voltage-gated calcium channel activity
  - go_id: GO:0051607
    label: defense response to virus
    aspect: BP
    annotations:
    - UniProtKB:P08466 (S. cerevisiae NUC1, IDA)
    mechanism: IDA PMID:31266891
    verdict: FLAG_FAILS
    reason: Yeast dsRNA (L-A/Killer) viruses are real; the in-repo NUC1 review ACCEPTs this IDA (Nuc1
      attenuates L-A accumulation during sporulation).
  - go_id: GO:0015344
    label: siderophore uptake transmembrane transporter activity
    aspect: MF
    annotations:
    - UniProtKB:P39980 (S. cerevisiae SIT1, IMP)
    mechanism: IMP PMID:9884238
    verdict: FLAG_FAILS
    reason: Sit1/Arn3 is the S. cerevisiae ferrioxamine B transporter; siderophore uptake is real fungal
      biology that bacteria dominate in curation.
  - go_id: GO:0016174
    label: NAD(P)H oxidase H2O2-forming activity
    aspect: MF
    annotations:
    - UniProtKB:P38169 (S. cerevisiae BNA4, IDA)
    mechanism: IDA PMID:23575632; IDA PMID:29429898
    verdict: DEFER_TO_CURATOR
    reason: BNA4 (kynurenine 3-monooxygenase) produces H2O2 when uncoupled by inhibitors in vitro; the
      in-repo review keeps both IDA rows as non-core side reactions, and the term can apply to fungi.
  - go_id: GO:0005178
    label: integrin binding
    aspect: MF
    annotations:
    - UniProtKB:P87020 (C. albicans PRA1, IDA)
    mechanism: IDA PMID:17277107
    verdict: FLAG_FAILS
    reason: Pra1 is the secreted C. albicans ligand of the host leukocyte integrin alphaM-beta2 (IDA PMID:17277107);
      a pathogen protein binding a host integrin is legitimate interspecies binding.
  - go_id: GO:0019900
    label: kinase binding
    aspect: MF
    annotations:
    - UniProtKB:P32917 (S. cerevisiae STE5, IEA)
    mechanism: IEA InterPro:IPR021651
    verdict: TRUE_BUT_GENERAL
    reason: IPR021651 is the Ste5 Fus3-binding domain; the in-repo STE5 review MODIFYs this row to MAPK
      binding.
    replacement: GO:0051019 mitogen-activated protein kinase binding
  - go_id: GO:0008901
    label: ferredoxin hydrogenase activity
    aspect: MF
    annotations:
    - UniProtKB:Q9Y7N7 (S. pombe, ISM)
    mechanism: ISM Pfam:PF02906
    verdict: ANNOTATION_WRONG
    reason: Q9Y7N7 is the S. pombe NAR1 homolog (NARF family), a cytosolic Fe-S assembly (CIA) factor
      per UniProt; the Pfam Fe-only hydrogenase domain (PF02906) marks ancestry, but NARF proteins are
      hydrogenase-like scaffolds and fission yeast does not make H2 from ferredoxin, so the ISM row transfers
      a lost activity.
  - go_id: GO:0004650
    label: polygalacturonase activity
    aspect: MF
    annotations:
    - UniProtKB:P47180 (S. cerevisiae PGU1, IBA/IDA/IEA)
    mechanism: IBA PANTHER:PTN001275777; IDA PMID:10650215; IEA InterPro:IPR000743; IEA EC:3.2.1.15; IEA
      ARBA:ARBA00027055
    verdict: FLAG_FAILS
    reason: PGU1 is a GH28 endopolygalacturonase with IDA (PMID:10650215); all five rows are consistent.
  - go_id: GO:0002020
    label: protease binding
    aspect: MF
    annotations:
    - UniProtKB:P01094 (S. cerevisiae PAI3, IPI)
    mechanism: IPI PMID:10655612; IPI PMID:15065849
    verdict: FLAG_FAILS
    reason: Pai3 is the cytosolic inhibitor of the vacuolar aspartic protease Pep4 (P07267) and binds
      it directly; the IPI rows are right.
  - go_id: GO:0008240
    label: tripeptidyl-peptidase activity
    aspect: MF
    annotations:
    - UniProtKB:Q9UT05 (S. pombe tpp2, EXP/IBA/IEA/IMP)
    mechanism: EXP PMID:9740805; IBA PANTHER:PTN000083315; IEA InterPro:IPR034051; IEA EC:3.4.14.10; IEA
      ARBA:ARBA00092315; IMP PMID:19467630
    verdict: FLAG_FAILS
    reason: S. pombe tpp2 is the tripeptidyl-peptidase II homolog with EXP/IMP support; fungi are simply
      under-curated for TPP2.
  - go_id: GO:0001725
    label: stress fiber
    aspect: CC
    annotations:
    - UniProtKB:A0A1D8PU66 (C. albicans CAALFM_CR10190CA, IEA)
    mechanism: IEA UniProtKB-SubCell:SL-0501
    verdict: ANNOTATION_WRONG
    reason: Stress fibers are contractile actomyosin bundles of animal cells; fungi have actin cables
      and patches, not stress fibers. The location on dynactin p62 (A0A1D8PU66) comes from an ARBA subcellular-location
      rule (ARBA00004529) modelled on mammalian DCTN4.
  - go_id: GO:0023051
    label: regulation of signaling
    aspect: BP
    annotations:
    - UniProtKB:O13747 (S. pombe, ISS)
    mechanism: ISS from UniProtKB:Q7Z569
    verdict: UNCERTAIN
    reason: PomBase ISS from human BRAP (Q7Z569), whose signalling role is inhibition of the KSR1 scaffold
      in Ras-Raf-MEK signalling, a module fungi lack. Whether the S. pombe ETP1/BRAP2 homolog regulates
      any fungal signalling pathway needs an S. pombe experiment.
  - go_id: GO:0048608
    label: reproductive structure development
    aspect: BP
    annotations:
    - UniProtKB:A0A1D8PNG6 (C. albicans UAP1, IEA)
    mechanism: IEA ARBA:ARBA00028277
    verdict: ANNOTATION_WRONG
    reason: UDP-GlcNAc pyrophosphorylase (UAP1) receives a plant-derived ARBA developmental term (the
      rule's condition sets are plant and animal families). Fungal fruiting bodies fall under this term,
      but C. albicans forms no reproductive fruiting structure, and the enzyme supplies a sugar nucleotide
      rather than doing any structure-development work; GO already excludes the term from S. cerevisiae
      and S. pombe.
  - go_id: GO:0016405
    label: CoA-ligase activity
    aspect: MF
    annotations:
    - UniProtKB:O74419 (S. pombe, IBA)
    mechanism: IBA PANTHER:PTN000644789
    verdict: ANNOTATION_WRONG
    reason: O74419 (PTHR43439:SF2) has an AMP-binding adenylation domain followed by a phosphopantetheine
      carrier domain (535-612) and a thioester-reductase domain (IPR010080), an A-PCP-R architecture that
      tethers the acyl-adenylate to its own carrier rather than to CoA. The IBA from a node seeded by
      E. coli PaaK transfers a CoA-ligase activity this domain architecture does not support.
  - go_id: GO:0015128
    label: gluconate transmembrane transporter activity
    aspect: MF
    annotations:
    - UniProtKB:Q92339 (S. pombe ght3, IMP)
    mechanism: IMP PMID:10735857
    verdict: FLAG_FAILS
    reason: S. pombe ght3 is the high-affinity gluconate transporter (IMP PMID:10735857); real fungal
      transport, bacteria dominate the counts.
  - go_id: GO:0009847
    label: spore germination
    aspect: BP
    annotations:
    - UniProtKB:P39001 (S. cerevisiae UME6, IMP)
    mechanism: IMP PMID:21059190
    verdict: DEFER_TO_CURATOR
    reason: UME6 IMP (PMID:21059190, not read); ascospore germination is real yeast biology and the term
      has no fungal restriction.
  - go_id: GO:0005319
    label: lipid carrier activity
    aspect: MF
    annotations:
    - UniProtKB:Q06833 (S. cerevisiae NVJ2, IDA)
    mechanism: IDA PMID:28011845
    verdict: DEFER_TO_CURATOR
    reason: Nvj2 is an SMP-domain lipid-transfer protein at contact sites (IDA PMID:28011845, not read);
      the term can apply.
  - go_id: GO:0009063
    label: amino acid catabolic process
    aspect: BP
    annotations:
    - UniProtKB:P43634 (S. cerevisiae CHA4, IMP)
    mechanism: IMP PMID:8889513
    verdict: DEFER_TO_CURATOR
    reason: CHA4 is the Zn2Cys6 activator of the serine/threonine deaminase gene CHA1 (IMP PMID:8889513,
      not read); a regulation-of-catabolism term would describe a transcription factor better, which the
      curator should check.
  - go_id: GO:0009931
    label: calcium-dependent protein serine/threonine kinase activity
    aspect: MF
    annotations:
    - UniProtKB:P36003 (S. cerevisiae NNK1, IBA)
    mechanism: IBA PANTHER:PTN000681419
    verdict: ANNOTATION_WRONG
    reason: The IBA node (PTN000681419) is seeded by plant and apicomplexan CDPKs, whose calcium dependence
      comes from a C-terminal calmodulin-like EF-hand domain. S. cerevisiae Nnk1 has only a protein kinase
      domain (UniProt features, PTHR24349) and its known role is GDH2 phosphorylation in nitrogen signalling,
      so calcium-dependent kinase activity is an over-deep node placement.
  - go_id: GO:0051056
    label: regulation of small GTPase mediated signal transduction
    aspect: BP
    annotations:
    - UniProtKB:A0A1D8PMB6 (C. albicans TSC2, IEA)
    - UniProtKB:Q9UUG9 (S. pombe tsc2, IEA)
    mechanism: IEA InterPro:IPR000331|InterPro:IPR035974
    verdict: FLAG_FAILS
    reason: Tsc2 is the Rheb GAP of the TSC complex in fungi as in animals; the Rap/Ran-GAP domain mapping
      is right and fungi are just thinly curated for this term.
  - go_id: GO:0019262
    label: N-acetylneuraminate catabolic process
    aspect: BP
    annotations:
    - UniProtKB:Q04802 (C. albicans NAG1, IBA)
    mechanism: IBA PANTHER:PTN000138938
    verdict: ANNOTATION_WRONG
    reason: NagB (GlcN6P deaminase) is part of bacterial sialic acid catabolism only downstream of NanA/NanK/NanE;
      C. albicans has no protein with EC 4.1.3.3, 5.1.3.9 or 2.7.1.60 in UniProt (the same query returns
      12 human EC 4.1.3.3 entries), so the IBA carries a bacterial pathway context into a fungus whose
      Nag1 serves GlcNAc catabolism.
    replacement: GO:0006046 N-acetylglucosamine catabolic process
  - go_id: GO:0006091
    label: generation of precursor metabolites and energy
    aspect: BP
    annotations:
    - UniProtKB:Q9UUE1 (S. pombe pyr1, NAS)
    mechanism: NAS GO_REF:0000051
    verdict: FLAG_FAILS
    reason: Pyruvate carboxylase replenishes oxaloacetate; the in-repo pyr1 review keeps this broad NAS
      row as non-core context.
  - go_id: GO:0004760
    label: L-serine:pyruvate transaminase activity
    aspect: MF
    annotations:
    - UniProtKB:P43567 (S. cerevisiae AGX1, IBA)
    mechanism: IBA PANTHER:PTN000475663
    verdict: UNCERTAIN
    reason: The in-repo AGX1 review marks this IBA over-annotated because yeast Agx1 is reported highly
      specific for alanine and glyoxylate; the substrate panel is not cached. Settle with an assay of
      Agx1 on L-serine plus pyruvate.
  - go_id: GO:0009381
    label: excinuclease ABC activity
    aspect: MF
    annotations:
    - UniProtKB:A0A1D8PJ54 (C. albicans UTP20, IEA)
    mechanism: IEA InterPro:IPR001162
    verdict: ANNOTATION_WRONG
    reason: Excinuclease ABC is the bacterial UvrABC nucleotide-excision activity. UTP20 is a large nucleolar
      small-subunit processome scaffold (PTHR17695) whose only hit is a UvrC-like RNase H profile at residues
      2379-2486; eukaryotic NER uses XPF and XPG, so the InterPro2GO mapping of IPR001162 does not fit
      this protein.
  - go_id: GO:0005882
    label: intermediate filament
    aspect: CC
    annotations:
    - UniProtKB:Q03898 (S. cerevisiae FIN1, IDA)
    mechanism: IDA PMID:11929974
    verdict: DEFER_TO_CURATOR
    reason: Fin1 self-assembles into 10 nm filaments between spindle pole bodies (IDA PMID:11929974);
      it is not an IF-family protein, but the definition is structural and the curator chose it deliberately.
  - go_id: GO:0019894
    label: kinesin binding
    aspect: MF
    annotations:
    - UniProtKB:P11709 (S. cerevisiae BIK1, IDA)
    mechanism: IDA PMID:35235370
    verdict: FLAG_FAILS
    reason: Bik1 (CLIP-170 homolog) binds the kinesin Kip2, which transports it to microtubule plus ends
      (IDA PMID:35235370).
  - go_id: GO:0099503
    label: secretory vesicle
    aspect: CC
    annotations:
    - UniProtKB:P33199 (S. cerevisiae YGL015C, IDA)
    - UniProtKB:P41697 (S. cerevisiae BUD6, IDA)
    - UniProtKB:Q12500 (S. cerevisiae AVL9, IDA)
    mechanism: IDA PMID:33634134; IDA PMID:30076201; IDA PMID:42714338
    verdict: DEFER_TO_CURATOR
    reason: Yeast post-Golgi secretory vesicles exist; three SGD IDA rows (YGL015C, Bud6, Avl9), papers
      not read.
  - go_id: GO:0008810
    label: cellulase activity
    aspect: MF
    annotations:
    - UniProtKB:P42835 (S. cerevisiae EGT2, TAS)
    mechanism: TAS PMID:11046133
    verdict: UNCERTAIN
    reason: The TAS cites a paper on Sok2 (PMID:11046133) whose abstract does not mention EGT2, and UniProt
      says only that Egt2 'could' be a glucan-degrading enzyme for cell separation, with no glycoside-hydrolase
      domain recorded. Settle with an activity assay of Egt2 on beta-1,4-glucan; yeast walls contain no
      cellulose.
  - go_id: GO:0045785
    label: positive regulation of cell adhesion
    aspect: BP
    annotations:
    - UniProtKB:Q9HGP0 (S. pombe pvg4, IMP)
    mechanism: IMP PMID:22180499
    verdict: DEFER_TO_CURATOR
    reason: pvg4 IMP (PMID:22180499, not read); fission yeast flocculation/adhesion is real.
  - go_id: GO:0008277
    label: regulation of G protein-coupled receptor signaling pathway
    aspect: BP
    annotations:
    - UniProtKB:A0A1D8PNF8 (C. albicans SST2, IMP)
    mechanism: IMP PMID:16400182
    verdict: TRUE_BUT_GENERAL
    reason: Sst2 is the RGS protein (GTPase-activating) that damps pheromone GPCR signalling; the regulation
      is negative. Check the IMP phenotype (PMID:16400182) before the MODIFY.
    replacement: GO:0045744 negative regulation of G protein-coupled receptor signaling pathway (candidate)
  - go_id: GO:0106435
    label: carboxylesterase activity
    aspect: MF
    annotations:
    - UniProtKB:P28321 (S. cerevisiae YJU3, IEA)
    mechanism: IEA RHEA:50144|RHEA:50148|RHEA:50136
    verdict: FLAG_FAILS
    reason: Yju3 is the monoglyceride lipase and fatty-acid ethyl-ester hydrolase; its RHEA ester-hydrolysis
      reactions fit the general carboxylesterase definition.
  - go_id: GO:0051897
