<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- membrane -->
  <rect x="0" y="250" width="960" height="18" fill="#e8f1ee"/>
  <line x1="0" y1="250" x2="960" y2="250" stroke="#8fa39c" stroke-width="1.5"/>
  <line x1="0" y1="268" x2="960" y2="268" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="16" y="240" font-size="13" font-weight="600" fill="#56655f">OUTSIDE</text>
  <text x="16" y="300" font-size="13" font-weight="600" fill="#56655f">INSIDE</text>
  <line x1="480" y1="24" x2="480" y2="500" stroke="#8fa39c" stroke-dasharray="4 5"/>
  <text x="240" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Ileum: intrinsic factor route</text>
  <text x="720" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Blood to tissues: transcobalamin route</text>
  <!-- left lane: CBLIF + B12 -> cubam -->
  <circle cx="200" cy="120" r="34" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="200" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">CBLIF</text>
  <text x="200" y="134" text-anchor="middle" font-size="11" fill="#56655f">carrier</text>
  <circle cx="236" cy="96" r="12" fill="#b8620f"/><text x="236" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">B12</text>
  <rect x="150" y="216" width="100" height="72" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="200" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">CUBN + AMN</text>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#56655f">cubam receptor</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#0e6b66">GO:0038024</text>
  <path d="M200 156 L200 212" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M200 292 L200 350" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <text x="212" y="330" font-size="12" fill="#56655f">endocytosis, B12 released</text>
  <!-- right lane: TCN2 + B12 -> CD320 -->
  <circle cx="680" cy="120" r="34" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="680" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">TCN2</text>
  <text x="680" y="134" text-anchor="middle" font-size="11" fill="#56655f">carrier</text>
  <circle cx="716" cy="96" r="12" fill="#b8620f"/><text x="716" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">B12</text>
  <rect x="630" y="216" width="100" height="72" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="680" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">CD320</text>
  <text x="680" y="258" text-anchor="middle" font-size="11" fill="#56655f">TC receptor</text>
  <text x="680" y="276" text-anchor="middle" font-size="11" fill="#0e6b66">GO:0038024</text>
  <path d="M680 156 L680 212" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M680 292 L680 350" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <text x="692" y="330" font-size="12" fill="#56655f">endocytosis, B12 released</text>
  <!-- TCN1 note -->
  <circle cx="860" cy="120" r="26" fill="#f1ecf7" stroke="#7657a3" stroke-width="1.4"/>
  <text x="860" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">TCN1</text>
  <text x="860" y="166" text-anchor="middle" font-size="11" fill="#56655f">haptocorrin:</text>
  <text x="860" y="180" text-anchor="middle" font-size="11" fill="#56655f">binds and sequesters B12</text>
  <!-- term placement panel -->
  <rect x="24" y="378" width="440" height="118" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="40" y="402" font-size="13" font-weight="600" fill="#bd3a30">OBSOLETE MODEL · GO:0140355 on the carrier</text>
  <text x="40" y="428" font-size="14" fill="#15201e">TCN2  "cargo receptor ligand activity"</text>
  <path d="M290 424 L360 424" stroke="#bd3a30" stroke-width="2" marker-end="url(#r)"/>
  <text x="368" y="428" font-size="14" fill="#15201e">CD320</text>
  <text x="40" y="456" font-size="12.5" fill="#56655f">An activity on the thing being recognised; the causal</text>
  <text x="40" y="474" font-size="12.5" fill="#56655f">arrow points from ligand to receptor.</text>
  <rect x="496" y="378" width="440" height="118" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="512" y="402" font-size="13" font-weight="600" fill="#0e6b66">PROPOSED · activity on the receptor</text>
  <text x="512" y="428" font-size="14" fill="#15201e">CD320 cargo receptor activity  has_input  holo-TCN2</text>
  <text x="512" y="452" font-size="14" fill="#15201e">TCN2 keeps cobalamin binding (GO:0031419)</text>
  <text x="512" y="472" font-size="14" fill="#15201e">and cobalamin transport (GO:0015889)</text>
</svg>
