<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">A worm sensory cilium and the 20 reviewed genes</text>
  <!-- soma -->
  <ellipse cx="95" cy="265" rx="75" ry="95" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <circle cx="95" cy="265" r="42" fill="#ffffff" stroke="#56655f" stroke-width="1.5"/>
  <text x="95" y="258" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">DAF-19</text>
  <text x="95" y="276" font-size="12" fill="#56655f" text-anchor="middle">RFX TF</text>
  <text x="95" y="291" font-size="11" fill="#56655f" text-anchor="middle">X-box</text>
  <text x="95" y="385" font-size="13" fill="#56655f" text-anchor="middle">neuron soma</text>
  <!-- dendrite -->
  <path d="M168,255 L250,250 L250,280 L168,275 z" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <path d="M140,245 C180,215 220,215 262,238" fill="none" stroke="#56655f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ari)"/>
  <text x="200" y="210" font-size="11" fill="#56655f" text-anchor="middle">drives ciliary genes</text>
  <!-- basal body -->
  <rect x="250" y="235" width="40" height="60" rx="4" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="270" y="318" font-size="12" fill="#15201e" text-anchor="middle">basal</text>
  <text x="270" y="332" font-size="12" fill="#15201e" text-anchor="middle">body</text>
  <!-- transition zone -->
  <rect x="290" y="232" width="70" height="66" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <line x1="300" y1="232" x2="300" y2="298" stroke="#0e6b66" stroke-width="1.5"/>
  <line x1="315" y1="232" x2="315" y2="298" stroke="#0e6b66" stroke-width="1.5"/>
  <line x1="330" y1="232" x2="330" y2="298" stroke="#0e6b66" stroke-width="1.5"/>
  <line x1="345" y1="232" x2="345" y2="298" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="325" y="96" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">Transition zone gate</text>
  <text x="325" y="114" font-size="12" fill="#15201e" text-anchor="middle">MKS: mks-1, mks-3, mks-5,</text>
  <text x="325" y="130" font-size="12" fill="#15201e" text-anchor="middle">mks-6, mksr-2</text>
  <text x="325" y="146" font-size="12" fill="#15201e" text-anchor="middle">NPHP: nphp-1, nphp-4</text>
  <line x1="325" y1="154" x2="325" y2="228" stroke="#8fa39c" stroke-width="1.5"/>
  <!-- axoneme: middle segment (doublets) and distal segment (singlets) -->
  <path d="M360,232 L640,232 L640,298 L360,298 z" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <path d="M640,238 L880,248 Q900,265 880,282 L640,292 z" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <line x1="360" y1="252" x2="640" y2="252" stroke="#56655f" stroke-width="2"/>
  <line x1="360" y1="256" x2="640" y2="256" stroke="#56655f" stroke-width="2"/>
  <line x1="360" y1="276" x2="640" y2="276" stroke="#56655f" stroke-width="2"/>
  <line x1="360" y1="280" x2="640" y2="280" stroke="#56655f" stroke-width="2"/>
  <line x1="640" y1="254" x2="880" y2="258" stroke="#56655f" stroke-width="2"/>
  <line x1="640" y1="278" x2="880" y2="272" stroke="#56655f" stroke-width="2"/>
  <text x="500" y="324" font-size="12" fill="#56655f" text-anchor="middle">middle segment (doublet microtubules)</text>
  <text x="760" y="324" font-size="12" fill="#56655f" text-anchor="middle">distal segment (singlets)</text>
  <!-- anterograde train -->
  <rect x="430" y="176" width="170" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="515" y="193" font-size="12" font-weight="bold" fill="#0e6b66" text-anchor="middle">IFT-B + BBSome train</text>
  <text x="515" y="208" font-size="11" fill="#15201e" text-anchor="middle">osm-5, che-2 | bbs-1,2,5,7,8</text>
  <path d="M450,160 L760,160" stroke="#0e6b66" stroke-width="3" marker-end="url(#ar)"/>
  <text x="610" y="150" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">anterograde: kinesin-II + OSM-3 (OSM-3 alone distally)</text>
  <line x1="515" y1="216" x2="515" y2="250" stroke="#0e6b66" stroke-width="1.5"/>
  <!-- retrograde -->
  <path d="M780,380 L400,380" stroke="#b8620f" stroke-width="3" marker-end="url(#arr)"/>
  <text x="580" y="402" font-size="13" font-weight="bold" fill="#b8620f" text-anchor="middle">retrograde: dynein-2 heavy chain CHE-3 with IFT-A</text>
  <line x1="580" y1="370" x2="580" y2="300" stroke="#b8620f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- PKD channel -->
  <rect x="690" y="194" width="16" height="44" rx="3" fill="#1d68b3"/>
  <rect x="710" y="194" width="16" height="44" rx="3" fill="#1d68b3"/>
  <text x="760" y="192" font-size="12" font-weight="bold" fill="#1d68b3">LOV-1 / PKD-2</text>
  <text x="760" y="208" font-size="11" fill="#15201e">polycystin channel,</text>
  <text x="760" y="222" font-size="11" fill="#15201e">male mating neurons</text>
  <!-- pef-1 -->
  <text x="800" y="352" font-size="12" font-weight="bold" fill="#0e6b66">PEF-1</text>
  <text x="800" y="366" font-size="11" fill="#15201e">axoneme (NEW)</text>
  <!-- corrections box -->
  <rect x="24" y="420" width="912" height="82" rx="8" fill="#fbeeec" stroke="#bd3a30" stroke-width="1.5"/>
  <text x="40" y="444" font-size="14" font-weight="bold" fill="#bd3a30">Removed as wrong for worms</text>
  <text x="40" y="466" font-size="13" fill="#15201e">CHE-3: cilium movement in cell motility, 9+2 motile cilium (IBA). Worm cilia are non-motile.</text>
  <text x="40" y="488" font-size="13" fill="#15201e">BBS-1: patched binding, smoothened binding (IBA). Worms lack Smoothened and canonical Hedgehog signalling.</text>
</svg>
