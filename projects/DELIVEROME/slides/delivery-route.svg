<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4b"/></marker>
  </defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">A delivery route, written in GO terms</text>
  <!-- membrane -->
  <rect x="30" y="110" width="900" height="14" fill="#dcefec" stroke="#0e6b66"/>
  <text x="36" y="100" font-size="13" fill="#56655f">outside</text><text x="36" y="146" font-size="13" fill="#56655f">cytoplasm</text>
  <text x="420" y="100" font-size="12" fill="#56655f">GO:0009897 external side of plasma membrane · GO:0009986 cell surface</text>
  <!-- cargo + receptor -->
  <circle cx="190" cy="82" r="14" fill="#b8620f"/><text x="212" y="78" font-size="13" fill="#b8620f" font-weight="bold">cargo</text>
  <rect x="176" y="98" width="28" height="40" rx="6" fill="#0e6b66"/><text x="190" y="160" font-size="13" text-anchor="middle" fill="#15201e" font-weight="bold">address receptor</text>
  <text x="190" y="176" font-size="12" text-anchor="middle" fill="#56655f">e.g. TFRC</text>
  <!-- internalization -->
  <path d="M230,140 C270,160 280,200 300,220" fill="none" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="150" font-size="12" fill="#0e6b66">GO:0031623 receptor internalization</text>
  <text x="300" y="166" font-size="12" fill="#56655f">GO:0072583 clathrin-dependent endocytosis (CLTC)</text>
  <!-- early endosome -->
  <ellipse cx="340" cy="260" rx="70" ry="40" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="340" y="256" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">early endosome</text><text x="340" y="274" font-size="12" text-anchor="middle" fill="#56655f">GO:0005769</text>
  <!-- recycling -->
  <path d="M290,232 C220,220 140,200 120,140" fill="none" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="60" y="230" font-size="12" fill="#1d8a4b">recycling to surface</text><text x="60" y="246" font-size="12" fill="#56655f">GO:0099638 · GO:0055037</text>
  <!-- transcytosis -->
  <path d="M410,250 C520,230 620,200 700,130" fill="none" stroke="#1d68b3" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="600" y="190" font-size="12" fill="#1d68b3">transcytosis GO:0045056</text>
  <!-- late endosome with Rab7 -->
  <line x1="340" y1="300" x2="340" y2="342" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="350" y="326" font-size="12" fill="#0e6b66">GO:0045022</text>
  <ellipse cx="340" cy="385" rx="80" ry="40" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="340" y="380" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">late endosome</text><text x="340" y="398" font-size="12" text-anchor="middle" fill="#56655f">GO:0005770</text>
  <rect x="428" y="360" width="150" height="50" rx="8" fill="#0e6b66"/><text x="503" y="382" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">RAB7A / Rab7</text><text x="503" y="400" font-size="12" text-anchor="middle" fill="#dcefec">routing switch</text>
  <!-- lysosome -->
  <line x1="420" y1="420" x2="610" y2="460" stroke="#bd3a30" stroke-width="3" marker-end="url(#r)"/>
  <text x="470" y="432" font-size="12" fill="#bd3a30">GO:1902774 to lysosome</text>
  <ellipse cx="710" cy="465" rx="100" ry="36" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="710" y="462" font-size="14" text-anchor="middle" font-weight="bold" fill="#bd3a30">lysosome</text><text x="710" y="480" font-size="12" text-anchor="middle" fill="#56655f">GO:0005764 · cargo degraded</text>
  <!-- escape -->
  <path d="M260,395 C200,420 160,440 120,470" fill="none" stroke="#b8620f" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="40" y="495" font-size="12" fill="#b8620f" font-weight="bold">cytosolic escape (payload works)</text>
  <text x="40" y="511" font-size="12" fill="#56655f">no GO term: an engineered-delivery outcome</text>
  <!-- note -->
  <rect x="640" y="250" width="290" height="110" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="652" y="274" font-size="13" font-weight="bold" fill="#15201e">Mouse liver evidence</text>
  <text x="652" y="294" font-size="12" fill="#15201e">"Loss of Rab7, a mediator of late</text>
  <text x="652" y="310" font-size="12" fill="#15201e">endosomal maturation, increased LNP</text>
  <text x="652" y="326" font-size="12" fill="#15201e">escape." (PMID:41814093)</text>
  <text x="652" y="346" font-size="12" fill="#56655f">Rab7 pushes cargo toward degradation.</text>
</svg>
