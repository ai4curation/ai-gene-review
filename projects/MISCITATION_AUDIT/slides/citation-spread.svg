<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">One bad PMID, many genes: key the register on the citation</text>
  <text x="24" y="58" font-size="14" fill="#56655f">What the paper is really about (left) · genes that cite it (right): flagged as a defect, or still cited without a flag</text>
  <!-- legend -->
  <rect x="610" y="72" width="16" height="16" rx="3" fill="#fbe4e1" stroke="#bd3a30" stroke-width="1.5"/><text x="632" y="85" font-size="13" fill="#15201e">flagged by a reviewer</text>
  <rect x="800" y="72" width="16" height="16" rx="3" fill="#ffffff" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="822" y="85" font-size="13" fill="#15201e">unflagged use</text>

  <!-- Row 1 -->
  <rect x="24" y="108" width="250" height="96" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="38" y="132" font-size="15" font-weight="bold" fill="#0e6b66">PMID:17340523</text>
  <text x="38" y="154" font-size="13" fill="#15201e">Fumaria alkaloid</text>
  <text x="38" y="172" font-size="13" fill="#15201e">separation assay</text>
  <text x="38" y="192" font-size="12" fill="#56655f">nothing about BAF or actin</text>
  <g font-size="13" fill="#15201e">
    <path d="M274 156 C 330 156, 330 124, 380 124" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <path d="M274 156 C 330 156, 330 156, 380 156" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <path d="M274 156 C 330 156, 330 188, 380 188" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <rect x="380" y="112" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="129">ACTB</text>
    <rect x="380" y="144" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="161">ARID1A</text>
    <rect x="380" y="176" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="193">ARID1B</text>
    <path d="M472 156 L 520 156" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="520" y="144" width="120" height="24" rx="4" fill="#fff" stroke="#8fa39c" stroke-dasharray="4 3"/><text x="532" y="161">mouse Actb</text>
  </g>
  <text x="675" y="148" font-size="13" fill="#56655f">3 flagged, 1 unflagged:</text>
  <text x="675" y="166" font-size="13" fill="#56655f">triage queue</text>

  <!-- Row 2 -->
  <rect x="24" y="226" width="250" height="96" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="38" y="250" font-size="15" font-weight="bold" fill="#0e6b66">PMID:10970790</text>
  <text x="38" y="272" font-size="13" fill="#15201e">cloning of "HELO1"</text>
  <text x="38" y="290" font-size="13" fill="#15201e">= ELOVL5 (old name)</text>
  <text x="38" y="310" font-size="12" fill="#56655f">text never says "ELOVL"</text>
  <g font-size="13" fill="#15201e">
    <path d="M274 274 C 330 274, 330 242, 380 242" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <path d="M274 274 C 330 274, 330 306, 380 306" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <rect x="380" y="230" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="247">ELOVL1</text>
    <rect x="380" y="294" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="311">ELOVL3</text>
    <path d="M472 274 L 520 274" stroke="#1d8a4b" stroke-width="1.5"/>
    <rect x="520" y="246" width="84" height="24" rx="4" fill="#fff" stroke="#8fa39c" stroke-dasharray="4 3"/><text x="532" y="263">ELOVL2</text>
    <rect x="520" y="278" width="84" height="24" rx="4" fill="#e3f3e8" stroke="#1d8a4b"/><text x="532" y="295">ELOVL5</text>
  </g>
  <text x="620" y="270" font-size="13" fill="#1d8a4b">ELOVL5 is correct;</text>
  <text x="620" y="288" font-size="13" fill="#56655f">ELOVL2 still needs triage</text>

  <!-- Row 3 -->
  <rect x="24" y="344" width="250" height="96" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="38" y="368" font-size="15" font-weight="bold" fill="#0e6b66">PMID:34521819</text>
  <text x="38" y="390" font-size="13" fill="#15201e">resolves to nothing:</text>
  <text x="38" y="408" font-size="13" fill="#15201e">NCBI returns no summary</text>
  <text x="38" y="428" font-size="12" fill="#56655f">one of two dead PMIDs</text>
  <g font-size="13" fill="#15201e">
    <path d="M274 392 L 380 392" fill="none" stroke="#bd3a30" stroke-width="2"/>
    <rect x="380" y="380" width="92" height="24" rx="4" fill="#fbe4e1" stroke="#bd3a30"/><text x="392" y="397">STAT2</text>
    <path d="M472 392 L 520 392" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="520" y="380" width="84" height="24" rx="4" fill="#fff" stroke="#8fa39c" stroke-dasharray="4 3"/><text x="532" y="397">JAK1</text>
    <rect x="614" y="380" width="84" height="24" rx="4" fill="#fff" stroke="#8fa39c" stroke-dasharray="4 3"/><text x="626" y="397">STAT1</text>
  </g>
  <text x="720" y="388" font-size="13" fill="#bd3a30">unflagged, and cannot</text>
  <text x="720" y="406" font-size="13" fill="#bd3a30">be correct</text>

  <text x="24" y="478" font-size="14" fill="#15201e">Spread is a triage queue, not a verdict: the same pattern (flagged here, unflagged there) means</text>
  <text x="24" y="498" font-size="14" fill="#15201e">"wrong everywhere" for PMID:34521819 and "right for ELOVL5" for PMID:10970790. Each row needs a human.</text>
</svg>
