<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- source term -->
  <rect x="330" y="20" width="300" height="70" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="346" y="42" font-size="12" font-weight="600" fill="#bd3a30">OBSOLETE · BP</text>
  <text x="346" y="64" font-size="16" font-weight="600" fill="#15201e">GO:0099148 regulation of</text>
  <text x="346" y="82" font-size="16" font-weight="600" fill="#15201e">synaptic vesicle docking</text>
  <path d="M480 92 L480 122" stroke="#15201e" stroke-width="2" marker-end="url(#a)"/>
  <!-- question -->
  <path d="M480 126 L700 176 L480 226 L260 176 Z" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="480" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Does the protein itself hold</text>
  <text x="480" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">the vesicle at the membrane?</text>
  <!-- yes branch -->
  <path d="M700 176 L780 176 L780 250" stroke="#1d68b3" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="716" y="166" font-size="13" font-weight="600" fill="#1d68b3">yes</text>
  <rect x="640" y="254" width="290" height="70" rx="10" fill="#e3eefa" stroke="#1d68b3" stroke-width="1.8"/>
  <text x="656" y="276" font-size="12" font-weight="600" fill="#1d68b3">MF · minted</text>
  <text x="656" y="298" font-size="15" font-weight="600" fill="#15201e">GO:0160321 vesicle docking</text>
  <text x="656" y="316" font-size="15" font-weight="600" fill="#15201e">activity</text>
  <!-- no branch -->
  <path d="M260 176 L180 176 L180 250" stroke="#b8620f" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="226" y="166" font-size="13" font-weight="600" fill="#b8620f">no</text>
  <rect x="30" y="254" width="300" height="70" rx="10" fill="#fdf1e4" stroke="#b8620f" stroke-width="1.8"/>
  <text x="46" y="276" font-size="12" font-weight="600" fill="#b8620f">MODIFY · keep a regulatory BP</text>
  <text x="46" y="298" font-size="14" fill="#15201e">e.g. a retained regulation term or</text>
  <text x="46" y="316" font-size="14" fill="#15201e">the synaptic vesicle cycle process</text>
  <!-- genes -->
  <g font-size="13.5">
    <rect x="30" y="350" width="300" height="72" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="46" y="372" font-weight="600" fill="#15201e">Camk2a · mouse P11798</text>
    <text x="46" y="391" fill="#56655f">Ser/Thr kinase; regulates docking</text>
    <text x="46" y="409" fill="#bd3a30">in repo: MODIFY to GO:0048172</text>
    <rect x="30" y="432" width="300" height="72" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="46" y="454" font-weight="600" fill="#15201e">tom-1 · worm A0A0K3ATN9</text>
    <text x="46" y="473" fill="#56655f">tomosyn; negative regulator</text>
    <text x="46" y="491" fill="#56655f">PMID:16895441 · not in repo</text>
    <rect x="640" y="350" width="290" height="72" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="656" y="372" font-weight="600" fill="#15201e">Septin5 · mouse Q9Z2Q6</text>
    <text x="656" y="391" fill="#56655f">presynaptic septin, syntaxin-1A partner</text>
    <text x="656" y="409" fill="#56655f">PMID:20624595 · candidate; not in repo</text>
  </g>
  <text x="640" y="452" font-size="12.5" fill="#56655f">Septin5 is the one gene that may</text>
  <text x="640" y="469" font-size="12.5" fill="#56655f">legitimately move to the new MF;</text>
  <text x="640" y="486" font-size="12.5" fill="#56655f">its review has to show it docks.</text>
</svg>
