<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Where over-annotations come from, and what they look like</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Annotation source (left) → pattern → worked example in a review (right)</text>
  <g font-size="13">
  <!-- sources -->
  <rect x="24" y="80"  width="180" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="36" y="108" font-weight="bold" fill="#15201e">HTP interactome</text><text x="36" y="128" fill="#56655f">IPI rows</text>
  <rect x="24" y="170" width="180" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="36" y="198" font-weight="bold" fill="#15201e">Domain signatures</text><text x="36" y="218" fill="#56655f">InterPro / Pfam IEA</text>
  <rect x="24" y="260" width="180" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="36" y="288" font-weight="bold" fill="#15201e">Keyword / broad maps</text><text x="36" y="308" fill="#56655f">parent terms, TM prediction</text>
  <rect x="24" y="350" width="180" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="36" y="378" font-weight="bold" fill="#15201e">Indirect evidence</text><text x="36" y="398" fill="#56655f">gene → X → Y</text>
  <!-- patterns -->
  <rect x="270" y="72"  width="330" height="40" rx="6" fill="#ffffff" stroke="#7657a3"/><text x="282" y="97" fill="#15201e">1 · generic protein binding (GO:0005515)</text>
  <rect x="270" y="122" width="330" height="40" rx="6" fill="#ffffff" stroke="#bd3a30"/><text x="282" y="147" fill="#15201e">3 · domain activity on a pseudo-enzyme</text>
  <rect x="270" y="172" width="330" height="40" rx="6" fill="#ffffff" stroke="#bd3a30"/><text x="282" y="197" fill="#15201e">7 · shared fold, wrong pathway's terms</text>
  <rect x="270" y="222" width="330" height="40" rx="6" fill="#ffffff" stroke="#7657a3"/><text x="282" y="247" fill="#15201e">8 · catalytic MF on non-catalytic subunit</text>
  <rect x="270" y="272" width="330" height="40" rx="6" fill="#ffffff" stroke="#b8620f"/><text x="282" y="297" fill="#15201e">2 · overly broad enzymatic term</text>
  <rect x="270" y="322" width="330" height="40" rx="6" fill="#ffffff" stroke="#bd3a30"/><text x="282" y="347" fill="#15201e">6 · predicted localization conflict</text>
  <rect x="270" y="372" width="330" height="40" rx="6" fill="#ffffff" stroke="#b8620f"/><text x="282" y="397" fill="#15201e">4 · indirect downstream process</text>
  <rect x="270" y="422" width="330" height="40" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="282" y="447" fill="#15201e">5 · duplicate annotations (clutter)</text>
  <!-- edges -->
  <g stroke="#8fa39c" stroke-width="1.5" fill="none">
    <path d="M204 115 C 240 115, 240 92, 270 92"/>
    <path d="M204 205 C 240 205, 240 142, 270 142"/>
    <path d="M204 205 L 270 192"/>
    <path d="M204 205 C 240 205, 240 242, 270 242"/>
    <path d="M204 295 L 270 292"/>
    <path d="M204 295 C 240 295, 240 342, 270 342"/>
    <path d="M204 385 L 270 392"/>
    <path d="M204 295 C 240 300, 240 442, 270 442"/>
  </g>
  <!-- examples -->
  <g stroke="#8fa39c" stroke-width="1.5"><path d="M600 92 L 640 92"/><path d="M600 142 L 640 142"/><path d="M600 192 L 640 192"/><path d="M600 242 L 640 242"/><path d="M600 292 L 640 292"/><path d="M600 342 L 640 342"/><path d="M600 442 L 640 442"/></g>
  <text x="648" y="90" fill="#15201e">PHYKPL, UBA7: 10 IPI rows</text><text x="648" y="106" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE</text>
  <text x="648" y="140" fill="#15201e">Epe1: JmjC demethylase, dioxygenase</text><text x="648" y="156" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE</text>
  <text x="648" y="190" fill="#15201e">actI-ORF1: fatty acid elongation</text><text x="648" y="206" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE</text>
  <text x="648" y="240" fill="#15201e">pqsB, actI-ORF2: acyltransferase</text><text x="648" y="256" font-size="12" font-weight="bold" fill="#7657a3">MARK_AS_OVER_ANNOTATED</text>
  <text x="648" y="290" fill="#15201e">UBA7: ligase → ISG15 activating</text><text x="648" y="306" font-size="12" font-weight="bold" fill="#b8620f">MODIFY (GO:0019782)</text>
  <text x="648" y="340" fill="#15201e">LPL1: membrane (lipid droplet)</text><text x="648" y="356" font-size="12" font-weight="bold" fill="#bd3a30">REMOVE</text>
  <text x="648" y="440" fill="#15201e">GND1: same term via IBA and IEA</text><text x="648" y="456" font-size="12" fill="#56655f">tolerated</text>
  <text x="648" y="396" fill="#56655f">no single exemplar gene</text>
  </g>
  <text x="24" y="500" font-size="13" fill="#56655f">Edges show the typical source of each pattern. Actions are those recorded in the exemplar review YAML.</text>
</svg>
