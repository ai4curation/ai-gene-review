# NO_DATA re-action decisions (projects/NO_DATA.md), consumed by
# projects/NO_DATA/scripts/apply_acceptance_rule.py.
#
# One entry per ND row the pass changed. decision STALE keeps the earlier
# REMOVE/MODIFY and adds nd_case STALE: the review cites literature on this
# gene product, in this species, that identifies a function in the aspect.
# decision ACCEPT keeps the ND row: the review's evidence for the aspect is
# inferred or from other species. Decisions were made by reading each row
# and the review's other rows in the aspect, not by a new literature search.
# new_row: the earlier MODIFY proposed a term the review carries nowhere else;
# the term is kept as its own NEW row with the earlier quotes. Where the term
# already has a row, the earlier quotes stay with that row and are dropped here.
