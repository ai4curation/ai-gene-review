<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  <marker id="tb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0 L5 10" stroke="#bd3a30" stroke-width="3"/></marker></defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Stress granules: stalled mRNPs condense, then are dissolved on recovery</text>
  <!-- step 1 stress -->
  <rect x="30" y="80" width="190" height="60" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="125" y="105" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">Stress</text>
  <text x="125" y="126" font-size="13" text-anchor="middle" fill="#56655f">eIF2α (EIF2S1) phosphorylated</text>
  <line x1="125" y1="140" x2="125" y2="185" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 2 stalled mRNPs -->
  <rect x="18" y="190" width="214" height="80" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="125" y="214" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">Stalled initiation</text>
  <text x="125" y="234" font-size="13" text-anchor="middle" fill="#56655f">mRNA + 40S + EIF4G1 +</text>
  <text x="125" y="252" font-size="13" text-anchor="middle" fill="#56655f">PABPC1, released from polysomes</text>
  <line x1="222" y1="230" x2="300" y2="230" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- granule -->
  <circle cx="490" cy="250" r="170" fill="#dcefec" stroke="#0e6b66" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="490" y="68" font-size="15" text-anchor="middle" fill="#0e6b66" font-weight="bold">stress granule (GO:0010494)</text>
  <!-- mRNA squiggles inside -->
  <g fill="none" stroke="#56655f" stroke-width="2">
    <path d="M380 300 C400 280 420 320 440 300 C460 280 480 320 500 300"/>
    <path d="M470 350 C490 330 510 370 530 350 C550 330 570 370 590 350"/>
    <path d="M520 170 C540 150 560 190 580 170"/>
  </g>
  <!-- nucleators -->
  <rect x="385" y="180" width="120" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/><text x="445" y="202" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">G3BP1 · G3BP2</text>
  <rect x="520" y="230" width="120" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/><text x="580" y="252" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">TIA1 · TIAL1</text>
  <text x="440" y="240" font-size="12" text-anchor="middle" fill="#0e6b66">core nucleators</text>
  <rect x="370" y="390" width="110" height="28" rx="6" fill="#ffffff" stroke="#56655f" stroke-width="2"/><text x="425" y="409" font-size="14" text-anchor="middle" fill="#15201e">CAPRIN1</text>
  <line x1="425" y1="390" x2="438" y2="218" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="375" y="440" font-size="12" fill="#56655f">G3BP partner</text>
  <!-- USP10 inhibits -->
  <rect x="250" y="130" width="100" height="28" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/><text x="300" y="149" font-size="14" text-anchor="middle" fill="#15201e">USP10</text>
  <line x1="340" y1="160" x2="392" y2="185" stroke="#bd3a30" stroke-width="2" marker-end="url(#tb)"/>
  <text x="240" y="122" font-size="12" fill="#bd3a30">limits assembly (G3BP partner)</text>
  <!-- ALS proteins -->
  <rect x="690" y="130" width="240" height="100" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
  <text x="810" y="154" font-size="14" text-anchor="middle" font-weight="bold" fill="#7657a3">ALS/FTD proteins partition in</text>
  <text x="810" y="178" font-size="14" text-anchor="middle" fill="#15201e">TARDBP (TDP-43) · FUS</text>
  <text x="810" y="198" font-size="14" text-anchor="middle" fill="#15201e">HNRNPA1 · HNRNPA2B1</text>
  <text x="810" y="218" font-size="14" text-anchor="middle" fill="#15201e">ATXN2 · FMR1</text>
  <line x1="690" y1="200" x2="645" y2="215" stroke="#7657a3" stroke-width="2" marker-end="url(#ar)"/>
  <!-- disassembly -->
  <rect x="690" y="320" width="240" height="70" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="810" y="345" font-size="14" text-anchor="middle" font-weight="bold" fill="#b8620f">Recovery: disassembly</text>
  <text x="810" y="368" font-size="14" text-anchor="middle" fill="#15201e">VCP (p97) · HSP70 chaperones</text>
  <line x1="690" y1="355" x2="650" y2="330" stroke="#b8620f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="30" y="490" font-size="13" fill="#56655f">Roles as listed on the project page. Red bar: USP10 limits assembly (its reviewed GO:0062030 rows).</text>
</svg>
