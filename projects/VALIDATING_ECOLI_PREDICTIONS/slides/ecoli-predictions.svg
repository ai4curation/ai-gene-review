<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8fa39c"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">What DeepECTransformer predicted, and what the protein does</text>
<g font-size="12" font-weight="bold" fill="#56655f"><text x="30" y="64">GENE</text><text x="110" y="64">DeepECTF PREDICTION</text><text x="470" y="64">VERDICT</text><text x="590" y="64">WHAT THE REVIEW FOUND</text></g>
<line x1="30" y1="72" x2="930" y2="72" stroke="#8fa39c"/>
<g font-size="13" fill="#15201e">
<text x="30" y="104" font-weight="bold">ygfF</text><text x="110" y="104">EC 1.1.1.47 glucose 1-dehydrogenase</text>
<rect x="470" y="88" width="64" height="24" rx="12" fill="#1d68b3"/><text x="502" y="105" text-anchor="middle" fill="#ffffff" font-weight="bold">COR</text>
<text x="590" y="104">confirmed: SDR-family glucose 1-dehydrogenase</text>
<text x="30" y="158" font-weight="bold">yciO</text><text x="110" y="158">EC 2.7.7.87 threonylcarbamoyl-</text><text x="110" y="174">adenylate synthase</text>
<rect x="470" y="142" width="64" height="24" rx="12" fill="#bd3a30"/><text x="502" y="159" text-anchor="middle" fill="#ffffff" font-weight="bold">PLI</text>
<text x="590" y="158">TsaC paralog, 10,000x weaker activity,</text><text x="590" y="174">does not complement tsaC mutants</text>
<text x="30" y="218" font-weight="bold">yegV</text><text x="110" y="218">EC 2.7.1.92 dehydro-2-deoxy-</text><text x="110" y="234">gluconokinase</text>
<rect x="470" y="202" width="64" height="24" rx="12" fill="#bd3a30"/><text x="502" y="219" text-anchor="middle" fill="#ffffff" font-weight="bold">PLI</text>
<text x="590" y="218">sugar kinase; first three EC digits right,</text><text x="590" y="234">substrate unknown</text>
<text x="30" y="278" font-weight="bold">yjhQ</text><text x="110" y="278">EC 2.3.1.189 mycothiol synthase</text>
<rect x="470" y="262" width="64" height="24" rx="12" fill="#b8620f"/><text x="502" y="279" text-anchor="middle" fill="#ffffff" font-weight="bold">NPI</text>
<text x="590" y="278">no mycothiol pathway in E. coli;</text><text x="590" y="294">acts as an antitoxin</text>
<text x="30" y="338" font-weight="bold">yrhB</text><text x="110" y="338">EC 4.1.2.50 6-carboxytetrahydro-</text><text x="110" y="354">pterin synthase</text>
<rect x="470" y="322" width="64" height="24" rx="12" fill="#b8620f"/><text x="502" y="339" text-anchor="middle" fill="#ffffff" font-weight="bold">NPI</text>
<text x="590" y="338">activity already encoded by QueD;</text><text x="590" y="354">Imm35 immunity domain</text>
<text x="30" y="398" font-weight="bold">yjdM</text><text x="110" y="398">EC 3.11.1.2 phosphonoacetate hydrolase</text>
<rect x="470" y="382" width="64" height="24" rx="12" fill="#8fa39c"/><text x="502" y="399" text-anchor="middle" fill="#ffffff" font-weight="bold">UNC</text>
<text x="590" y="398">in vitro activity, no in vivo support</text>
<text x="30" y="448" font-weight="bold">fepE</text><text x="110" y="448">EC 2.7.13.3 histidine kinase</text>
<rect x="470" y="432" width="64" height="24" rx="12" fill="#7657a3"/><text x="502" y="449" text-anchor="middle" fill="#ffffff" font-weight="bold">REP</text>
<text x="590" y="448">frequency bias; actually a Wzz-family</text><text x="590" y="464">O-antigen chain-length regulator</text>
</g>
<g stroke="#e8f1ee"><line x1="30" y1="128" x2="930" y2="128"/><line x1="30" y1="188" x2="930" y2="188"/><line x1="30" y1="248" x2="930" y2="248"/><line x1="30" y1="308" x2="930" y2="308"/><line x1="30" y1="368" x2="930" y2="368"/><line x1="30" y1="418" x2="930" y2="418"/></g>
<text x="30" y="500" font-size="12" fill="#56655f">Verdicts from genes/ECOLI/*/*-det-predictions-review.yaml; they match the categories in de Crécy-Lagard et al. 2025 (PMID:40703034).</text>
</svg>
