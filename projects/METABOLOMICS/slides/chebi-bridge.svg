<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">ChEBI is the bridge from a metabolite to GO</text>
  <text x="32" y="64" font-size="15" fill="#56655f">…but only if the reported ChEBI id is normalized to the form Rhea uses</text>

  <!-- chain -->
  <g font-size="13">
    <rect x="24" y="92" width="160" height="70" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="104" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">Metabolite</text>
    <text x="104" y="140" text-anchor="middle" fill="#15201e">ChEBI, as reported</text>
    <text x="104" y="155" font-size="11" text-anchor="middle" fill="#56655f">MetaboLights MAF</text>

    <rect x="212" y="92" width="160" height="70" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="292" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">Rhea reaction</text>
    <text x="292" y="140" text-anchor="middle" fill="#15201e">ChEBI participants</text>
    <text x="292" y="155" font-size="11" text-anchor="middle" fill="#56655f">18,558 reactions</text>

    <rect x="400" y="92" width="160" height="70" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="480" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">GO MF</text>
    <text x="480" y="140" text-anchor="middle" fill="#15201e">enzyme activity</text>
    <text x="480" y="155" font-size="11" text-anchor="middle" fill="#56655f">rhea2go: 7,746 mappings</text>

    <rect x="588" y="92" width="160" height="70" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="668" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">Human enzyme</text>
    <text x="668" y="140" text-anchor="middle" fill="#15201e">UniProt + GOA</text>
    <text x="668" y="155" font-size="11" text-anchor="middle" fill="#56655f">4,142 with Rhea + GO</text>

    <rect x="776" y="92" width="160" height="70" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="856" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e6b66">GO BP</text>
    <text x="856" y="140" text-anchor="middle" fill="#15201e">closure-aware ORA</text>
    <text x="856" y="155" font-size="11" text-anchor="middle" fill="#56655f">then GO-CAM (planned)</text>
  </g>
  <path d="M186,127 L208,127" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M374,127 L396,127" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M562,127 L584,127" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M750,127 L772,127" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- mismatch panel -->
  <text x="32" y="206" font-size="16" font-weight="bold" fill="#15201e">Where the first hop fails</text>
  <text x="200" y="236" font-size="13" font-weight="bold" fill="#56655f">Repository reports</text>
  <text x="470" y="236" font-size="13" font-weight="bold" fill="#56655f">Rhea uses</text>
  <text x="700" y="236" font-size="13" font-weight="bold" fill="#56655f">Fix</text>

  <g font-size="14">
    <text x="32" y="274" font-weight="bold" fill="#15201e">Charge</text>
    <rect x="200" y="252" width="210" height="36" rx="18" fill="#ffffff" stroke="#8fa39c"/>
    <text x="305" y="275" text-anchor="middle" fill="#15201e">ATP  CHEBI:15422</text>
    <rect x="470" y="252" width="210" height="36" rx="18" fill="#e8f1ee" stroke="#0e6b66"/>
    <text x="575" y="275" text-anchor="middle" fill="#15201e">ATP(4-)  CHEBI:30616</text>
    <path d="M412,270 L466,270" stroke="#bd3a30" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
    <text x="700" y="268" font-size="13" fill="#15201e">tier 1: protonation family</text>
    <text x="700" y="284" font-size="12" fill="#56655f">is_(de)protonated_form_of</text>

    <text x="32" y="344" font-weight="bold" fill="#15201e">Stereo /</text>
    <text x="32" y="362" font-weight="bold" fill="#15201e">generic</text>
    <rect x="200" y="330" width="210" height="36" rx="18" fill="#ffffff" stroke="#8fa39c"/>
    <text x="305" y="353" text-anchor="middle" fill="#15201e">isoleucine  CHEBI:24898</text>
    <rect x="470" y="330" width="210" height="36" rx="18" fill="#e8f1ee" stroke="#0e6b66"/>
    <text x="575" y="353" text-anchor="middle" fill="#15201e">L-isoleucine zwitterion</text>
    <path d="M412,348 L466,348" stroke="#bd3a30" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
    <text x="700" y="346" font-size="13" fill="#15201e">tier 2: InChIKey skeleton</text>
    <text x="700" y="362" font-size="12" fill="#56655f">stereo/charge-blind, reported apart</text>

    <text x="32" y="422" font-weight="bold" fill="#15201e">Complex</text>
    <text x="32" y="440" font-weight="bold" fill="#15201e">lipid</text>
    <rect x="200" y="408" width="210" height="36" rx="18" fill="#ffffff" stroke="#8fa39c"/>
    <text x="305" y="431" text-anchor="middle" fill="#15201e">sphingomyelin, PC, TAG</text>
    <rect x="470" y="408" width="210" height="36" rx="18" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="5 4"/>
    <text x="575" y="431" text-anchor="middle" fill="#bd3a30">not a discrete participant</text>
    <text x="700" y="424" font-size="13" fill="#bd3a30">open gap</text>
    <text x="700" y="440" font-size="12" fill="#56655f">LIPID MAPS / SwissLipids → ChEBI?</text>
  </g>
  <text x="32" y="490" font-size="13" fill="#15201e">MTBLS1 (64 metabolites): exact 8 → tier 1: 49 → tier 2: 58. The BCAA diabetes markers are recovered only at tier 2.</text>
</svg>
