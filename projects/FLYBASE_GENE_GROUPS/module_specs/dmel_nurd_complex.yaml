module: dmel_nurd_complex
title: NuRD nucleosome remodeling and deacetylase complex in Drosophila melanogaster
label: NuRD complex
module_type: PROTEIN_COMPLEX
description: >-
  NuRD couples ATP-dependent nucleosome remodeling by the CHD-family ATPase
  Mi-2 with histone deacetylation by HDAC1 (Rpd3). The deacetylase core also
  contains the MTA homolog MTA1-like and the histone-binding protein Caf1-55
  (p55), and the complex further contains MBD-like, the GATAD2 homolog Simjang
  and CDK2AP1. NuRD represses transcription, contributes to Polycomb-dependent
  silencing of Hox genes, and in Drosophila Mi-2 also forms the dMec complex
  with the zinc-finger protein MEP-1.
summary: >-
  Mi-2 remodeler and HDAC1 deacetylase complex that represses transcription.
concepts:
  - {id: GO:0016581, label: NuRD complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
parts:
  - id: nurd_remodeler
    label: Mi-2 remodeling ATPase
    role: nucleosome remodeling
    genes: [Mi-2]
    function: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
  - id: nurd_deacetylase_core
    label: Deacetylase core
    role: histone deacetylation
    genes: [HDAC1, MTA1-like, Caf1-55]
    unit_functions:
      HDAC1: {id: GO:0004407, label: histone deacetylase activity}
  - id: nurd_mbd_module
    label: MBD-like, Simjang and CDK2AP1
    role: bridge between deacetylase core and remodeler
    genes: [MBD-like, simj, CDK2AP1]
  - id: nurd_mep1
    label: MEP-1
    role: Mi-2-associated zinc-finger protein
    description: MEP-1 associates with Mi-2 and is also a subunit of the dMec complex.
    genes: [MEP-1]
notes: >-
  The split into remodeler, deacetylase core and MBD/GATAD2 module follows the
  conserved architecture of mammalian NuRD. MEP-1 is included because FlyBase
  lists it in the NuRD group; it is best characterised as the partner of Mi-2 in
  the dMec complex.
