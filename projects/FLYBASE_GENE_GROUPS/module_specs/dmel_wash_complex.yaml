module: dmel_wash_complex
title: WASH complex in Drosophila melanogaster
label: WASH complex
module_type: PROTEIN_COMPLEX
description: >-
  The WASH complex is a five-subunit regulatory complex on endosomes that
  activates the Arp2/3 complex to build branched actin patches on endosomal
  membranes. These patches help sort cargo into recycling tubules in
  cooperation with retromer. The subunits are WASH (wash), FAM21, CCDC53,
  SWIP and Strumpellin (Strump). WASH carries the C-terminal VCA domain that
  activates Arp2/3, and FAM21 links the complex to retromer and to capping
  protein. Drosophila wash mutant hemocytes are defective in
  lysosomal neutralization.
summary: >-
  Five-subunit endosomal complex in which WASH activates Arp2/3 to form actin
  patches for cargo recycling.
concepts:
  - {id: GO:0071203, label: WASH complex}
cellular_components:
  - {id: GO:0005768, label: endosome}
notes: >-
  Decomposition. No subcomplex is modelled; each subunit is a part. Only the
  WASH subunit carries the Arp2/3-activating VCA domain. The Arp2/3 complex
  and retromer are partners, not parts.
group: WASH-C
roles:
  wash: WASH subunit, Arp2/3 complex activator
  FAM21: FAM21 subunit, retromer and capping protein interaction
  CCDC53: CCDC53 subunit
  SWIP: SWIP subunit
  Strump: Strumpellin subunit
processes:
  - {id: GO:0034314, label: Arp2/3 complex-mediated actin nucleation}
