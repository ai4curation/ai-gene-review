module: dmel_ino80_complex
title: INO80 chromatin remodeling complex in Drosophila melanogaster
label: INO80 complex
module_type: PROTEIN_COMPLEX
description: >-
  The INO80 complex is an ATP-dependent chromatin remodeler of the INO80
  subfamily that slides nucleosomes and positions the +1 nucleosome at
  promoters, and contributes to transcription regulation and DNA repair. In
  Drosophila it contains the Ino80 ATPase, the AAA+ ATPases Pontin and
  Reptin, actin and the actin-related proteins Arp5 and Arp8. FlyBase also
  places the Polycomb group DNA-binding protein Pho (the YY1 homolog) in the
  complex, consistent with a role of INO80 in recruiting Polycomb proteins.
summary: >-
  Ino80 ATPase complex with Pontin, Reptin, actin, Arp5, Arp8 and Pho.
concepts:
  - {id: GO:0031011, label: Ino80 complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
parts:
  - id: ino80_atpase
    label: Ino80 ATPase
    role: catalytic remodeling subunit
    genes: [Ino80]
    function: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
  - id: ino80_ruvbl
    label: Pontin-Reptin AAA+ ATPases
    role: RuvB-like ATPase module
    genes: [pont, rept]
  - id: ino80_actin_arp
    label: Actin and actin-related proteins
    role: actin-related subunits
    genes: [Act5C, Arp5, Arp8]
  - id: ino80_pho
    label: Pho
    role: sequence-specific DNA-binding subunit
    genes: [pho]
notes: >-
  Grouping of actin, Arp5 and Arp8 together is a coarse simplification; in yeast
  Arp8 and actin bind the HSA region while Arp5 binds the ATPase. Pho is
  included because FlyBase lists it as an INO80 subunit; it is also modelled in
  the PhoRC part of dmel_polycomb_group_complexes.
