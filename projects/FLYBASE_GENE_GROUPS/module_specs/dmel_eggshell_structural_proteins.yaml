        label: X-linked chorion cluster at 7F
        role: X-linked chorion proteins
        module_type: CELLULAR_COMPONENT
        genes: [Cp36, Cp38, Cp7Fa, Cp7Fb, Cp7Fc]
        function: {id: GO:0005213, label: structural constituent of egg chorion}
        locations:
          - {id: GO:0042600, label: egg chorion}
      - id: chorion_cluster_66d
        label: Third-chromosome chorion cluster at 66D
        role: autosomal chorion proteins
        module_type: CELLULAR_COMPONENT
        genes: [Cp15, Cp16, Cp18, Cp19]
        function: {id: GO:0005213, label: structural constituent of egg chorion}
        locations:
