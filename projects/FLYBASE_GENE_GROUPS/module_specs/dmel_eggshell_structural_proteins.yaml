    target: chorion_proteins
    connection_type: PRECEDES
    description: Vitelline membrane proteins are secreted before the chorion proteins.
notes: >-
  Each protein is a separate annoton (complex false): the eggshell layers are
  cross-linked extracellular structures, not defined stoichiometric complexes.
  Vitelline membrane proteins are assigned to the vitelline envelope GO
  component. Several eggshell components outside the two FlyBase groups (for
  example the dec-1 proteins, and peroxidases and other enzymes that
  cross-link the layers) are not modelled. The structural-constituent functions
  of most chorion and vitelline membrane proteins rest on their localization and
  curator inference rather than gene-by-gene mutant analysis.
