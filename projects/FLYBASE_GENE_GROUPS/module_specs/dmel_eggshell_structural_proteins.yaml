module: dmel_eggshell_structural_proteins
title: Eggshell structural proteins in Drosophila melanogaster
label: Eggshell structural proteins
module_type: BIOLOGICAL_PROCESS
description: >-
  The Drosophila eggshell is secreted by the somatic follicle cells that
  surround the oocyte during late oogenesis. The vitelline membrane, the
  innermost layer, is laid down first from vitelline membrane proteins
  (Vm26Aa, Vm26Ab, Vm26Ac, Vm32E, Vm34Ca and Vml) that are cross-linked into an
  insoluble layer. The chorion is secreted afterwards and is built from chorion
  proteins encoded mainly by two clusters: an X-linked cluster at 7F (Cp36,
  Cp38 and Cp7Fa-c) and an autosomal cluster at 66D (Cp15, Cp16, Cp18 and
  Cp19). The chorion gene clusters are amplified in follicle cells by
  developmentally regulated DNA re-replication, which allows the large and
  rapid synthesis of chorion proteins.
summary: >-
  Follicle-cell secreted vitelline membrane and chorion proteins that build the
  two main layers of the eggshell.
concepts:
  - {id: GO:0007304, label: chorion-containing eggshell formation}
parts:
