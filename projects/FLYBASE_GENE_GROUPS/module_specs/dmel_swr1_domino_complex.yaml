module: dmel_swr1_domino_complex
title: SWR1-type Domino H2Av exchange complex in Drosophila melanogaster
label: SWR1 (Domino) complex
module_type: PROTEIN_COMPLEX
description: >-
  The SWR1-type complex deposits the histone variant H2Av into nucleosomes in
  exchange for H2A. Its catalytic subunit is the SWR1-family ATPase Domino;
  in Drosophila the Domino-B isoform forms this complex, whereas Domino-A is
  part of the Tip60 complex. The complex shares with Tip60 the AAA+ ATPases
  Pontin and Reptin, YL-1, DMAP1, Gas41, Bap55 and the MRG15 module, and
  contains the actin-related protein Arp6.
summary: >-
  Domino-containing SWR1-type complex that deposits the H2A variant H2Av.
concepts:
  - {id: GO:0000812, label: Swr1 complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
parts:
  - id: swr1_domino_atpase
    label: Domino ATPase
    role: catalytic exchange subunit
    genes: [dom]
    function: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
  - id: swr1_ruvbl
    label: Pontin-Reptin AAA+ ATPases
    role: RuvB-like ATPase module
    genes: [pont, rept]
  - id: swr1_exchange_subunits
    label: Exchange accessory subunits
    role: H2Av and nucleosome-binding accessory subunits
    genes: [Arp6, YL-1, DMAP1, Gas41, Bap55]
  - id: swr1_mrg15_module
    label: MRG15 reader module
    role: chromatin reader subunits
    genes: [MRG15, MrgBP, Brd8]
  - id: swr1_hcf
    label: Hcf
    role: associated host cell factor
    genes: [Hcf]
notes: >-
  Grouping of accessory subunits follows the conserved SWR1/SRCAP organisation
  and is a modelling convenience. The Domino isoform specificity (Domino-B
  here, Domino-A in Tip60) cannot be represented with gene-level participants;
  both modules use the dom gene product. Hcf is included because FlyBase lists
  it in the SWR1 group.
