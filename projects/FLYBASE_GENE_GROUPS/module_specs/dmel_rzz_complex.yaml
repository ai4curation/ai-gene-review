module: dmel_rzz_complex
title: Rod-Zw10-Zwilch (RZZ) complex in Drosophila melanogaster
label: RZZ complex
module_type: PROTEIN_COMPLEX
description: >-
  The RZZ complex, made of Rough deal (Rod), Zw10 and Zwilch, assembles on
  unattached kinetochores in prometaphase. It recruits the Mad1-Mad2
  checkpoint proteins and is therefore required for the spindle assembly
  checkpoint, and it recruits dynein-dynactin through the adaptor Spindly. Once
  microtubules attach, dynein strips RZZ and checkpoint proteins from the
  kinetochore along kinetochore fibres, which helps silence the checkpoint.
  Rod and Zw10 were first identified in Drosophila through mutants with
  chromosome segregation defects.
summary: >-
  Rod-Zw10-Zwilch kinetochore complex that recruits Mad1-Mad2 and dynein for
  spindle checkpoint signalling.
concepts:
  - {id: GO:1990423, label: RZZ complex}
cellular_components:
  - {id: GO:0000776, label: kinetochore}
group: RZZ
roles:
  rod: Rod (Rough deal) subunit
  Zw10: Zw10 subunit
  Zwilch: Zwilch subunit
notes: >-
  Spindly, dynein-dynactin and Mad1-Mad2 are partners outside the module. Each
  subunit is modelled as a part.
