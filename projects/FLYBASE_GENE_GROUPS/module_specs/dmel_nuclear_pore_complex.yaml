module: dmel_nuclear_pore_complex
title: Nuclear pore complex in Drosophila melanogaster
label: Nuclear pore complex
module_type: PROTEIN_COMPLEX
description: >-
  The nuclear pore complex (NPC) is a large assembly of about 30 different
  nucleoporins, each present in multiple copies, that spans the nuclear
  envelope and controls traffic between nucleus and cytoplasm. A symmetric
  core of stacked rings (two outer rings built from the Nup107-160 Y-complex,
  an inner ring, and a transmembrane ring) anchors a central channel filled
  with phenylalanine-glycine (FG) repeat nucleoporins that form the
  permeability barrier. Asymmetric cytoplasmic filaments and a nuclear basket
  attach to the core and act in mRNA export and in docking of transport
  receptors. Several Drosophila nucleoporins also act off the pore, for
  example in gene regulation and in mitosis.
summary: >-
  Nucleoporin assembly spanning the nuclear envelope, with outer, inner and
  membrane rings, an FG-repeat central channel, cytoplasmic filaments and a
  nuclear basket.
concepts:
  - {id: GO:0005643, label: nuclear pore}
cellular_components:
  - {id: GO:0005635, label: nuclear envelope}
parts:
  - id: outer_ring
    label: Outer ring (Nup107-160 Y-complex)
    role: outer ring scaffold
    description: >-
      The Y-shaped Nup107-160 complex forms the cytoplasmic and nuclear outer
      rings. Elys binds the Y-complex and chromatin and seeds post-mitotic pore
      assembly. Nup98-96 encodes a precursor that is cleaved into the FG
      nucleoporin Nup98 and the Y-complex subunit Nup96.
    genes: [Nup107, Nup133, Nup160, Nup75, Nup98-96, Nup37, Nup43, Nup44A, Sec13, Elys]
    complex_term: {id: GO:0031080, label: nuclear pore outer ring}
  - id: inner_ring
    label: Inner ring
    role: inner ring scaffold
    description: The Nup93 and Nup205/Nup188 scaffold, with Nup154 and Nup35, forms the inner ring that links the membrane to the central channel.
    genes: [Nup93-1, Nup93-2, Nup154, Nup205, Nup188, Nup35]
    complex_term: {id: GO:0044611, label: nuclear pore inner ring}
  - id: transmembrane_ring
    label: Transmembrane ring
    role: pore membrane anchors
    description: Integral membrane nucleoporins that anchor the NPC in the pore membrane.
    genes: [Gp210, Ndc1]
    complex_term: {id: GO:0070762, label: nuclear pore transmembrane ring}
  - id: central_channel
    label: Central channel FG nucleoporins
    role: permeability barrier
    description: The Nup62 subcomplex of FG nucleoporins lines the central channel and forms the selective barrier.
    genes: [Nup62, Nup54, Nup58]
    complex_term: {id: GO:0044613, label: nuclear pore central transport channel}
  - id: cytoplasmic_filaments
    label: Cytoplasmic filaments
    role: cytoplasmic face, mRNA export
    description: >-
      Nup358 (RanBP2), Nup214 and Nup88 (mbo) form the cytoplasmic filaments;
      Gle1 and the Gle1-binding nucleoporin CG18787 (Nucleoporin-like 2) act
      at this face in the final step of mRNA export.
    genes: [Nup358, Nup214, mbo, Gle1, CG18787]
    complex_term: {id: GO:0044614, label: nuclear pore cytoplasmic filaments}
  - id: nuclear_basket
    label: Nuclear basket
    role: nuclear face
    description: Mgtor (the Tpr homolog), Nup153 and Nup50 form the nuclear basket.
    genes: [Mgtor, Nup153, Nup50]
    complex_term: {id: GO:0044615, label: nuclear pore nuclear basket}
  - id: peripheral_nucleoporins
    label: Peripheral nucleoporins
    role: peripheral pore components
    description: >-
      Rae1, which binds the Gle2-binding sequence of Nup98, and Aladin, which
      in human cells is anchored to the pore through NDC1.
    genes: [Rae1, Aladin]
    complex: false
notes: >-
  Sub-structure follows the conserved assignments of the human and yeast
  homologs; FlyBase lists the nucleoporins as one flat group. Mgtor is the
  Drosophila Tpr homolog (Megator).
