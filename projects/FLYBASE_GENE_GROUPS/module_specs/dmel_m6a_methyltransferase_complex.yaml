module: dmel_m6a_methyltransferase_complex
title: mRNA m6A methyltransferase complex in Drosophila melanogaster
label: m6A methyltransferase complex
module_type: PROTEIN_COMPLEX
description: >-
  N6-methyladenosine (m6A) is deposited on mRNA co-transcriptionally by a
  methyltransferase complex. Its catalytic core is the Mettl3-Mettl14
  heterodimer, in which Mettl3 is the active methyltransferase and Mettl14 an
  inactive partner that supports RNA binding. A regulatory subcomplex (MACOM)
  of Fl(2)d, Virilizer (vir), the E3 ligase Hakai, Flacc and the RNA-binding
  protein Spenito (nito) is required for m6A deposition and specificity. In
  Drosophila, m6A modification by this complex regulates Sex-lethal pre-mRNA
  splicing in sex determination and contributes to neuronal function.
summary: >-
  Mettl3-Mettl14 methyltransferase and its Fl(2)d-Vir-Hakai-Flacc-Nito
  regulatory subcomplex, which deposit m6A on mRNA.
concepts:
  - {id: GO:0036396, label: RNA N6-methyladenosine methyltransferase complex}
cellular_components:
  - {id: GO:0005634, label: nucleus}
parts:
  - id: mettl3_mettl14
    label: Mettl3-Mettl14 catalytic core
    role: m6A methyltransferase
    genes: [Mettl3, Mettl14]
    unit_functions:
      Mettl3: {id: GO:0001734, label: mRNA m(6)A methyltransferase activity}
  - id: macom
    label: Fl(2)d-associated regulatory subcomplex (MACOM)
    role: complex targeting and stability
    genes: [fl(2)d, vir, Hakai, Flacc, nito]
notes: >-
  Boundary. m6A readers (Ythdc1, Ythdf) and the snRNA methyltransferase Mettl16
  are outside the module.
