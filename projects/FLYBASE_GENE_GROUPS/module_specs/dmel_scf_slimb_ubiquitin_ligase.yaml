module: dmel_scf_slimb_ubiquitin_ligase
title: SCF-Slimb ubiquitin ligase in Drosophila melanogaster
label: SCF-Slimb ubiquitin ligase
module_type: PROTEIN_COMPLEX
description: >-
  SCF-Slimb is a cullin-RING E3 ubiquitin ligase in which the F-box protein
  Supernumerary limbs (Slimb, the beta-TrCP ortholog) recognizes
  phosphorylated degron motifs and the Cul1-Roc1a core transfers ubiquitin to
  the bound substrate. SkpA bridges the F-box of Slimb to Cul1. Slimb targets
  include Armadillo in Wingless signalling, Cubitus interruptus in Hedgehog
  signalling, the centriole duplication kinase Plk4 and the clock protein
  Period, so SCF-Slimb restrains several signalling pathways and centriole
  number.
summary: >-
  Cul1-Roc1a-SkpA cullin-RING ligase with the F-box substrate receptor Slimb
  (beta-TrCP).
concepts:
  - {id: GO:0019005, label: SCF ubiquitin ligase complex}
parts:
  - id: cul1_roc1a_core
    label: Cul1-Roc1a catalytic core
    role: cullin-RING catalytic core
    genes: [Cul1, Roc1a]
    function: {id: GO:0061630, label: ubiquitin protein ligase activity}
  - id: skpa_adaptor
    label: SkpA adaptor
    role: F-box adaptor
    genes: [SkpA]
  - id: slimb_receptor
    label: Slimb substrate receptor
    role: F-box substrate receptor
    genes: [slmb]
connections:
  - {source: slimb_receptor, target: cul1_roc1a_core, connection_type: PROVIDES_INPUT_FOR, description: Slimb delivers phosphodegron-bearing substrates to the catalytic core via SkpA.}
notes: >-
  Cul1, Roc1a and SkpA are shared with other SCF ligases; Slimb defines this
  module. Substrates and the kinases that create phosphodegrons are outside
  the module.
