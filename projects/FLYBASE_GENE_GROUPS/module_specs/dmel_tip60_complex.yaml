module: dmel_tip60_complex
title: Tip60 histone acetyltransferase and exchange complex in Drosophila melanogaster
label: Tip60 complex
module_type: PROTEIN_COMPLEX
description: >-
  The Drosophila Tip60 complex combines the activities that budding yeast
  splits between NuA4 and SWR1. Its MYST-family acetyltransferase Tip60
  acetylates nucleosomal histone H4 and the H2A variant H2Av, and the
  SWR1-family ATPase Domino exchanges phosphorylated H2Av for unmodified H2Av,
  which links the complex to DNA damage responses. The complex also contains
  the AAA+ ATPases Pontin and Reptin, the Tra1 homolog Nipped-A, actin, and
  chromatin-reader subunits including MRG15, Brd8 and Gas41. It contributes
  to transcriptional regulation, DNA repair and cell-cycle control.
summary: >-
  Tip60 acetyltransferase complex that also contains the Domino ATPase for
  H2Av exchange.
concepts:
  - {id: GO:0035267, label: NuA4 histone acetyltransferase complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
parts:
  - id: tip60_piccolo_hat_core
    label: Tip60 acetyltransferase core
    role: histone H4 and H2Av acetylation
    description: >-
      The catalytic core homologous to yeast piccolo NuA4 (Esa1, Epl1, Yng2,
      Eaf6).
    genes: [Tip60, E(Pc), Ing3, Eaf6]
    complex_term: {id: GO:0032777, label: piccolo histone acetyltransferase complex}
    unit_functions:
      Tip60: {id: GO:0004402, label: histone acetyltransferase activity}
  - id: tip60_mrg15_module
    label: MRG15 reader module
    role: chromatin reader subunits
    genes: [MRG15, MrgBP, Brd8]
  - id: tip60_domino_module
    label: Domino exchange module
    role: H2Av exchange
    description: >-
      Domino ATPase with the subunits shared with SWR1-type complexes.
    genes: [dom, YL-1, DMAP1, Gas41, Bap55, Act87E, pont, rept]
    unit_functions:
      dom: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
  - id: tip60_tra1
    label: Nipped-A (Tra1)
    role: activator-interacting subunit
    genes: [Nipped-A]
notes: >-
  Subunit grouping into acetyltransferase core, MRG15 module, Domino module
  and Tra1 follows the conserved organisation of NuA4 and SWR1 in yeast and
  the TIP60 complex in mammals; it is a modelling convenience, not a claim
  about separable Drosophila subcomplexes. The Domino-B-containing complex
  without Tip60 is modelled separately in dmel_swr1_domino_complex.
