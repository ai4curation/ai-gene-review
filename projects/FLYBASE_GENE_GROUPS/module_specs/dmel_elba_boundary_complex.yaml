module: dmel_elba_boundary_complex
title: Elba early boundary factor complex in Drosophila melanogaster
label: Elba complex
module_type: PROTEIN_COMPLEX
description: >-
  Elba is a heterotrimeric chromatin boundary (insulator) factor active in the
  early embryo. It binds a specific DNA sequence in the Fab-7 boundary of the
  Bithorax complex and gives the boundary its early insulating activity. Elba1
  and Elba2 are BEN-domain DNA-binding proteins, and Elba3 bridges them; Elba3
  is expressed only in early embryos, which restricts the complex to that
  stage.
summary: >-
  Embryonic heterotrimeric insulator factor (Elba1, Elba2, Elba3) that binds
  the Fab-7 boundary.
concepts:
  - {id: GO:0005667, label: transcription regulator complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
group: ELBA
roles:
  Elba1: BEN-domain DNA-binding subunit
  Elba2: BEN-domain DNA-binding subunit
  Elba3: bridging subunit
notes: >-
  No GO cellular-component term exists for Elba or insulator complexes, so the
  module is grounded to transcription regulator complex. A three-subunit complex
  without further sub-structure; it is decomposed one part per subunit.
