module: dmel_ampk_complex
title: AMP-activated protein kinase complex in Drosophila melanogaster
label: AMPK complex
module_type: PROTEIN_COMPLEX
description: >-
  AMP-activated protein kinase is a heterotrimeric energy sensor made of a
  catalytic alpha subunit, a scaffolding beta subunit with a glycogen-binding
  domain, and a gamma subunit whose CBS repeats bind AMP, ADP and ATP.
  Drosophila has a single gene for each subunit (AMPKalpha, alicorn and
  SNF4Agamma). When cellular energy falls, nucleotide binding to the gamma
  subunit promotes phosphorylation of the alpha activation loop by LKB1 and
  protects it from dephosphorylation. Active AMPK restores energy balance by
  inhibiting anabolic pathways, including TORC1 signaling and lipid synthesis,
  and promoting catabolism; in Drosophila it is also needed for epithelial
  polarity under energy stress and for normal lifespan and lipid storage.
summary: >-
  Heterotrimeric energy-sensing kinase of AMPKalpha (catalytic), alicorn (beta)
  and SNF4Agamma (nucleotide-sensing gamma).
concepts:
  - {id: GO:0031588, label: nucleotide-activated protein kinase complex}
group: AMPK-C
unit_functions:
  AMPKalpha: {id: GO:0004679, label: AMP-activated protein kinase activity}
roles:
  AMPKalpha: catalytic alpha subunit
  alc: beta scaffold subunit
  SNF4Agamma: nucleotide-sensing gamma subunit
notes: >-
  Each subunit is encoded by a single Drosophila gene, so the complex has no
  subunit-isoform variants at the gene level. The upstream kinase Lkb1 is
  modelled in dmel_lkb1_strad_mo25_complex.
