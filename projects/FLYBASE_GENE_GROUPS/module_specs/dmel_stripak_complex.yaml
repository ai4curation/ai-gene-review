module: dmel_stripak_complex
title: STRIPAK complex in Drosophila melanogaster
label: STRIPAK complex
module_type: PROTEIN_COMPLEX
description: >-
  The striatin-interacting phosphatase and kinase (STRIPAK) complex is a large,
  conserved assembly built around a PP2A phosphatase whose regulatory B subunit is a
  striatin. In Drosophila the striatin is Connector of kinase to AP-1 (Cka), which
  binds the PP2A scaffold (A) subunit Pp2A-29B and the catalytic subunit Microtubule
  star (Mts) together with Mob4, Strip, Slmap and Fgop2. Ccm3 links germinal-centre
  kinase III family kinases to the complex. STRIPAK restrains the Hippo pathway by
  dephosphorylating the Hippo kinase, and also acts in JNK signaling, axon
  transport, synapse development and centrosome positioning.
summary: >-
  Cka-PP2A phosphatase complex with Mob4, Strip, Slmap and kinase adaptors that
  dephosphorylates Hippo and other targets.
concepts:
  - {id: GO:0090443, label: FAR/SIP/STRIPAK complex}
parts:
  - id: pp2a_core
    label: PP2A core enzyme
    role: phosphatase catalytic core
    genes: [mts, Pp2A-29B]
    complex_label: PP2A A-C core dimer
    unit_functions:
      mts: {id: GO:0004722, label: protein serine/threonine phosphatase activity}
  - id: striatin_scaffold
    label: Striatin scaffold and associated subunits
    role: PP2A B subunit and scaffold
    description: >-
      Cka (striatin) with Mob4, Strip, Slmap and Fgop2, the conserved non-catalytic
      STRIPAK core subunits.
    genes: [Cka, Mob4, Strip, Slmap, Fgop2]
    complex_label: Striatin-Mob4-Strip-Slmap-Fgop2 assembly
  - id: stripak_accessory
    label: Kinase adaptor and accessory subunits
    role: kinase recruitment and accessory subunits
    description: >-
      Ccm3 (PDCD10 homolog), which binds GCKIII kinases, and Nausicaa (Naus), a
      CTTNBP2NL homolog.
    genes: [Ccm3, Naus]
    complex: false
connections:
  - source: striatin_scaffold
    target: pp2a_core
    connection_type: POSITIVELY_REGULATES
    description: >-
      Cka acts as the B subunit that directs the PP2A core enzyme to STRIPAK targets.
notes: >-
  The PP2A core subunits mts and Pp2A-29B are shared with dmel_pp2a_holoenzymes.
  GCKIII kinases (GckIII) and the Hippo kinase (hpo) are binding partners or
  substrates and are not parts. The position of Fgop2 and Slmap within the complex
  is inferred from mammalian STRIPAK.
group: STRIPAK
