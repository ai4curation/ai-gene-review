module: dmel_nf_y_complex
title: NF-Y CCAAT-binding factor in Drosophila melanogaster
label: NF-Y complex
module_type: PROTEIN_COMPLEX
description: >-
  NF-Y is a heterotrimeric transcription factor that binds the CCAAT box found
  in many eukaryotic promoters. Nf-YB and Nf-YC form a histone-fold dimer that
  binds DNA nonspecifically and creates the surface for Nf-YA, which confers
  sequence-specific recognition of CCAAT. In Drosophila, NF-Y regulates genes
  in eye and neural development and in cell proliferation.
summary: >-
  Heterotrimeric Nf-YA/Nf-YB/Nf-YC transcription factor that binds CCAAT boxes.
concepts:
  - {id: GO:0016602, label: CCAAT-binding factor complex}
cellular_components:
  - {id: GO:0005634, label: nucleus}
group: CBFTF
roles:
  Nf-YA: sequence-specific CCAAT recognition subunit
  Nf-YB: histone-fold subunit
  Nf-YC: histone-fold subunit
notes: >-
  FlyBase lists the same three genes in two groups (CBFTF, the complex, and
  NFY, the subunit family); both are realized by this module. The trimer binds
  CCAAT boxes as a unit (the NF-YB-NF-YC histone-fold dimer with NF-YA), so
  DNA-binding transcription factor activity (GO:0000981), which all three
  subunits carry in GOA by IBA, is recorded on a complex-level annoton.
complex_term: {id: GO:0016602, label: CCAAT-binding factor complex}
complex_function:
  function: {id: GO:0000981, label: "DNA-binding transcription factor activity, RNA polymerase II-specific"}
  role_description: >-
    Binds CCAAT boxes in promoters as an NF-YA-NF-YB-NF-YC trimer and
    regulates RNA polymerase II transcription.
