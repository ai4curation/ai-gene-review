module: dmel_glutamyl_trna_amidotransferase
title: Mitochondrial glutamyl-tRNA(Gln) amidotransferase (GatCAB) in Drosophila melanogaster
label: GatCAB amidotransferase
module_type: PROTEIN_COMPLEX
description: >-
  In mitochondria of animals there is no glutaminyl-tRNA synthetase. Instead,
  mitochondrial tRNA-Gln is first mischarged with glutamate by the
  non-discriminating mitochondrial glutamyl-tRNA synthetase, and the
  heterotrimeric GatCAB amidotransferase converts the bound glutamate to
  glutamine. GatA is a glutaminase that releases ammonia from glutamine, GatB
  phosphorylates the glutamate and transfers the ammonia to form Gln-tRNA(Gln),
  and GatC is a small subunit that stabilizes the complex.
summary: >-
  Mitochondrial GatA-GatB-GatC complex that forms Gln-tRNA(Gln) by
  transamidation.
concepts:
  - {id: GO:0030956, label: glutamyl-tRNA(Gln) amidotransferase complex}
cellular_components:
  - {id: GO:0005739, label: mitochondrion}
notes: >-
  Modelled one part per subunit. The glutaminyl-tRNA synthase
  (glutamine-hydrolyzing) activity belongs to the complex as a whole and is
  not assigned to individual subunits here. The mitochondrial glutamyl-tRNA
  synthetase that provides the substrate is outside this module.
parts:
