module: dmel_cleavage_polyadenylation
title: mRNA 3' end cleavage and polyadenylation machinery in Drosophila melanogaster
label: mRNA cleavage and polyadenylation
module_type: PROTEIN_COMPLEX
description: >-
  Most eukaryotic mRNAs acquire their 3' end by endonucleolytic cleavage of the
  pre-mRNA followed by addition of a poly(A) tail. The cleavage and
  polyadenylation specificity factor (CPSF) recognizes the AAUAAA
  polyadenylation signal through Cpsf160, Wdr33 and Clp (CPSF30), and Fip1
  recruits poly(A) polymerase. The cleavage stimulation factor (CstF; CstF50,
  CstF64 and Su(f), the CstF77 homolog) binds GU-rich sequences downstream of the
  cleavage site. The core cleavage complex of Cpsf73, Cpsf100 and the scaffold
  Symplekin (Sym) carries out cleavage, with Cpsf73 as the endonuclease. Cpsf73,
  Cpsf100 and Sym are shared with the histone pre-mRNA processing machinery.
summary: >-
  CPSF, CstF and the Cpsf73-Cpsf100-Symplekin core cleavage complex, which
  cleave pre-mRNAs at the polyadenylation site.
