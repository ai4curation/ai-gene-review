notes: >-
  Boundary. FlyBase groups the polyadenylation factors (PF: CPSF signal
  recognition subunits plus CstF) separately from the core cleavage complex
  (CCC); this module splits PF into its CPSF and CstF subcomplexes. Poly(A)
  polymerase, the CFIm and CFIIm factors and poly(A)-binding proteins have no
  FlyBase group in this set and are not added. The histone pre-mRNA processing
  machinery that reuses the core cleavage complex is in
  dmel_histone_mrna_3prime_processing.
