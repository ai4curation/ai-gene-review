module: dmel_histone_mrna_3prime_processing
title: Replication-dependent histone pre-mRNA 3' end processing in Drosophila melanogaster
label: Histone pre-mRNA 3' end processing
module_type: PROTEIN_COMPLEX
description: >-
  Replication-dependent histone mRNAs are not polyadenylated; instead their 3'
  end is formed by a single endonucleolytic cleavage between a conserved stem-loop
  and a purine-rich histone downstream element. The stem-loop binding protein
  (Slbp) binds the stem-loop, and the U7 snRNP, whose U7 snRNA base pairs with the
  downstream element and whose Sm ring contains the U7-specific Lsm10 and Lsm11,
  recruits FLASH and the histone pre-mRNA cleavage complex. This complex reuses
  the Cpsf73 endonuclease, Cpsf100 and Symplekin together with other CPSF and CstF
  subunits. In Drosophila these factors concentrate in the histone locus body.
summary: >-
  Slbp, the U7 snRNP, FLASH and the histone pre-mRNA cleavage complex, which cut
  histone pre-mRNAs after the stem-loop.
