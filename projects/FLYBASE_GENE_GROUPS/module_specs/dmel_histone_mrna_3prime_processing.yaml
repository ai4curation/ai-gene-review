notes: >-
  Boundary. FlyBase's HPF group is the union of HCC, U7 and Slbp plus FLASH, and
  all members are covered by the four parts. The histone pre-mRNA cleavage
  complex shares all its subunits with the polyadenylation machinery in
  dmel_cleavage_polyadenylation. The core Sm proteins of the U7 snRNP (SmB, SmD3,
  SmE, SmF, SNRPG) are shared with spliceosomal snRNPs. snRNA:U7 and FLASH have
  no UniProt mapping in the source table and are grounded to FlyBase gene ids.
