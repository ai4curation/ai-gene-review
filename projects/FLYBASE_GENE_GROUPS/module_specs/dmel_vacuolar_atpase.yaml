module: dmel_vacuolar_atpase
title: Vacuolar H+-ATPase in Drosophila melanogaster
label: Vacuolar ATPase
module_type: PROTEIN_COMPLEX
description: >-
  The vacuolar H+-ATPase (V-ATPase) is a rotary proton pump that acidifies
  lysosomes, endosomes, the Golgi and secretory vesicles, and in specialized
  epithelia such as the Malpighian tubules and midgut energizes the plasma
  membrane for transport. The cytosolic V1 domain hydrolyses ATP at three
  catalytic sites in an A3B3 hexamer, and the central rotor (subunits D, F and
  d) transmits rotation to a ring of proteolipid c subunits in the membrane V0
  domain. The V0 a subunit provides the proton path together with the c ring,
  and peripheral stalks of E and G subunits, with C and H, hold the stator.
  Reversible dissociation of V1 from V0 regulates activity. In Drosophila many
  subunits are encoded by paralogous genes, some with tissue- or
  testis-restricted expression, and the accessory proteins Ac45 and ATP6AP2
  associate with V0.
summary: >-
  Rotary proton pump of an ATP-hydrolysing V1 domain and a proton-translocating
  V0 domain, with paralogous subunit genes and V0 accessory proteins.
concepts:
  - {id: GO:0033176, label: proton-transporting V-type ATPase complex}
notes: >-
  Decomposition. Subunits are grouped by domain and by subunit type; each gene
  is its own annoton because paralogs of one subunit type are alternatives
  rather than co-subunits, and which paralogs assemble together in which
  tissue is not mapped. Subunit-type assignments follow the UniProt protein
  names. CG5421 is placed with the accessory subunits as in FlyBase; its
  function is not characterized. The proton-pumping activity belongs to the
  assembled complex; only ATP hydrolysis is attached to the catalytic A
  subunits.
complex: false
