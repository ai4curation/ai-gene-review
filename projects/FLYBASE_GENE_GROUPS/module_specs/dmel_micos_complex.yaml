module: dmel_micos_complex
title: MICOS complex in Drosophila melanogaster
label: MICOS complex
module_type: PROTEIN_COMPLEX
description: >-
  The mitochondrial contact site and cristae organizing system (MICOS) is an
  inner membrane complex enriched at crista junctions. It stabilises crista
  junctions, shapes cristae and links the inner membrane to the outer
  membrane. MICOS is made of two subcomplexes: a Mic60 subcomplex, built on
  Mitofilin (Mic60) with the CHCH-domain protein Chchd3 (Mic19), and a Mic10
  subcomplex containing the membrane-bending protein Mic10 together with QIL1
  (Mic13) and the apolipoprotein-domain protein Mic26-27. Drosophila has three
  Mic10 paralogs: Mic10b is broadly expressed, whereas Mic10a and Mic10c are
  testis-specific.
summary: >-
  Inner mitochondrial membrane complex of Mic60 and Mic10 subcomplexes that
  organises crista junctions and cristae.
concepts:
  - {id: GO:0061617, label: MICOS complex}
parts:
  - id: mic60_subcomplex
    label: Mic60 subcomplex
    role: crista junction scaffold and outer membrane contact
    genes: [Mitofilin, Chchd3]
  - id: mic10_subcomplex
    label: Mic10 subcomplex
    role: membrane bending at crista junctions
    parts:
      - id: mic10_core
        label: Mic13 and Mic26-27
        role: Mic10 subcomplex partners
        genes: [QIL1, Mic26-27]
    variant_sets:
      - id: mic10_paralogs
        label: Mic10 paralogs
        selection: ONE_OR_MORE
        variants:
          - {id: mic10b, label: Mic10b (broadly expressed), genes: [Mic10b]}
          - {id: mic10a, label: Mic10a (testis-specific), genes: [Mic10a]}
          - {id: mic10c, label: Mic10c (testis-specific), genes: [Mic10c]}
notes: >-
  The three FlyBase MICOS variants differ only in the Mic10 paralog and are
  modelled as one complex with a Mic10 variant set. The assignment of
  subunits to the Mic60 and Mic10 subcomplexes follows the conserved yeast and
  mammalian organisation. Mic10b has no UniProt entry in the cache and is
  grounded to its FlyBase gene id.
