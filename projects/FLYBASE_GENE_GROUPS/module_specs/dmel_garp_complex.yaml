module: dmel_garp_complex
title: GARP and EARP tethering complexes in Drosophila melanogaster
label: GARP and EARP complexes
module_type: PROTEIN_COMPLEX
description: >-
  The Golgi-associated retrograde protein (GARP) complex and the
  endosome-associated recycling protein (EARP) complex are related
  multisubunit tethering complexes that share Vps51, Vps52 and Vps53. GARP
  contains Vps54 (scattered, scat, in Drosophila) and tethers endosome-derived
  vesicles at the trans-Golgi network, supporting retrograde transport of
  cargo such as lysosomal hydrolase receptors. EARP contains Vps50 in place of
  Vps54 and acts in recycling from endosomes to the plasma membrane. Drosophila
  scat mutants are male sterile, with defects in spermatid
  differentiation.
summary: >-
  Two related tethering complexes sharing Vps51-Vps53: GARP (with Vps54) for
  endosome-to-Golgi retrograde transport and EARP (with Vps50) for endocytic
  recycling.
concepts:
  - {id: GO:0000938, label: GARP complex}
  - {id: GO:1990745, label: EARP complex}
notes: >-
  Boundary. The module contains the two FlyBase-curated complexes, modelled as
  alternative variants that share the Vps51-Vps52-Vps53 core.
variant_sets:
  - id: garp_earp_variants
    label: GARP or EARP complex
    selection: ONE_OR_MORE
    variants:
      - id: garp
        label: GARP complex
        description: Vps51-Vps52-Vps53 with Vps54 (scat).
        group: GARPI
        complex_term: {id: GO:0000938, label: GARP complex}
        processes:
          - {id: GO:0042147, label: "retrograde transport, endosome to Golgi"}
      - id: earp
        label: EARP complex
        description: Vps51-Vps52-Vps53 with Vps50.
        group: GARPII
        complex_term: {id: GO:1990745, label: EARP complex}
        processes:
          - {id: GO:0032456, label: endocytic recycling}
