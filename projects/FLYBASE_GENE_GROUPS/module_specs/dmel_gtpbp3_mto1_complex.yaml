module: dmel_gtpbp3_mto1_complex
title: GTPBP3-MTO1 mitochondrial tRNA modification complex in Drosophila melanogaster
label: GTPBP3-MTO1 complex
module_type: PROTEIN_COMPLEX
description: >-
  GTPBP3 and MTO1, the mitochondrial orthologs of bacterial MnmE and MnmG, act
  together to install a taurinomethyl group at the wobble uridine (U34) of
  several mitochondrial tRNAs, forming taurinomethyluridine (taum5U). This
  modification supports accurate decoding during mitochondrial translation.
  GTPBP3 is a GTPase that binds the methylene donor, and MTO1 is an FAD-dependent
  enzyme. In Drosophila the orthologs are CG18528 (GTPBP3) and CG4610 (MTO1).
summary: >-
  CG18528 (GTPBP3) and CG4610 (MTO1) complex that modifies mitochondrial tRNA
  wobble uridines.
concepts:
  - {id: GO:7770010, label: GTPBP3-MTO1 complex}
cellular_components:
  - {id: GO:0005739, label: mitochondrion}
processes:
  - {id: GO:0070899, label: mitochondrial tRNA wobble uridine modification}
unit_functions:
  CG18528: {id: GO:0003924, label: GTPase activity}
roles:
  CG18528: GTPase subunit (GTPBP3/MnmE)
  CG4610: FAD-dependent subunit (MTO1/MnmG)
notes: >-
  Modelled one part per subunit. Subunit functions are inferred by orthology to
  human GTPBP3 and MTO1 and bacterial MnmE and MnmG; neither Drosophila protein
  has been characterized biochemically. GTPase activity is assigned to CG18528
  on the basis of its conserved TrmE-type G domain.
