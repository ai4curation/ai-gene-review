module: dmel_mettl1_wuho_methyltransferase
title: Mettl1-Wuho tRNA m7G46 methyltransferase in Drosophila melanogaster
label: Mettl1-Wuho methyltransferase
module_type: PROTEIN_COMPLEX
description: >-
  The METTL1-WDR4 complex (Trm8-Trm82 in yeast) methylates guanosine 46 in the
  variable loop of many tRNAs at the N7 position, forming m7G46, which
  stabilizes tRNA structure. METTL1 is the S-adenosylmethionine-dependent
  catalytic subunit and the WD40-repeat protein WDR4 is required for its
  stability and activity. In Drosophila, the WDR4 ortholog is wuho (wh), which
  binds Mettl1 and is required for male and female germline development.
summary: >-
  Mettl1 catalytic and Wuho WD40 subunits that form m7G46 in tRNAs.
concepts:
  - {id: GO:0106143, label: tRNA (m7G46) methyltransferase complex}
processes:
  - {id: GO:0106004, label: tRNA (guanine-N7)-methylation}
unit_functions:
  Mettl1: {id: GO:0008176, label: tRNA (guanine(46)-N7)-methyltransferase activity}
roles:
  Mettl1: catalytic methyltransferase subunit
  wuho: WD40 non-catalytic subunit
notes: >-
  Modelled one part per subunit. The catalytic activity is assigned to Mettl1 by
  orthology to METTL1 and Trm8.
