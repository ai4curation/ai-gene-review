module: dmel_cog_complex
title: Conserved oligomeric Golgi (COG) complex in Drosophila melanogaster
label: COG complex
module_type: PROTEIN_COMPLEX
description: >-
  The conserved oligomeric Golgi (COG) complex is an eight-subunit
  multisubunit tethering complex at the Golgi apparatus. It tethers
  COPI-derived vesicles that recycle Golgi resident proteins, such as
  glycosylation enzymes, between cisternae, and it interacts with Golgi SNAREs,
  Rab GTPases and COPI coat proteins. The complex is organized into two lobes,
  lobe A (Cog1-Cog4) and lobe B (Cog5-Cog8). In Drosophila, Cog5 is encoded by
  four way stop (fws), whose mutants are defective in male meiotic cytokinesis
  and Golgi organization during spermatogenesis.
summary: >-
  Eight-subunit Golgi tethering complex of two lobes that captures
  intra-Golgi recycling vesicles.
concepts:
  - {id: GO:0017119, label: COG complex}
cellular_components:
  - {id: GO:0000139, label: Golgi membrane}
notes: >-
  Boundary. The module contains the eight COG subunits. Golgi SNAREs and Rabs
  that COG engages are partners, not parts. Lobe assignments follow the
  conserved organization established in yeast and mammals.
