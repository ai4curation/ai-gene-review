module: dmel_chromatin_assembly_factor_1
title: Chromatin assembly factor 1 in Drosophila melanogaster
label: CAF-1
module_type: PROTEIN_COMPLEX
description: >-
  Chromatin assembly factor 1 (CAF-1) is a three-subunit histone chaperone
  that deposits newly synthesised histone H3-H4 onto DNA behind the
  replication fork, coupling nucleosome assembly to DNA replication through
  its interaction with PCNA. It consists of Caf1-180 (p180), Caf1-105 (p105)
  and the WD-repeat histone-binding protein Caf1-55 (p55). Caf1-55 is also a
  subunit of several other chromatin complexes.
summary: >-
  Three-subunit histone H3-H4 chaperone that assembles nucleosomes during DNA
  replication.
concepts:
  - {id: GO:0033186, label: CAF-1 complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
group: CAF-1
roles:
  Caf1-180: large subunit
  Caf1-105: middle subunit
  Caf1-55: WD-repeat histone-binding subunit
notes: >-
  A three-subunit complex decomposed one part per subunit. Caf1-55 is shared
  with NURF, NuRD, PRC2 and MuvB complexes, which are modelled in their own
  modules.
