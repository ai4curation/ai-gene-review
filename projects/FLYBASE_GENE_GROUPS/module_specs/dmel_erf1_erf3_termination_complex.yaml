module: dmel_erf1_erf3_termination_complex
title: eRF1-eRF3 translation termination complex in Drosophila melanogaster
label: eRF1-eRF3 termination complex
module_type: PROTEIN_COMPLEX
description: >-
  Eukaryotic translation termination is carried out by the release factors eRF1
  and eRF3. eRF1 recognizes all three stop codons in the ribosomal A site and
  triggers hydrolysis of the peptidyl-tRNA bond through its conserved GGQ motif.
  eRF3 is a translational GTPase that delivers eRF1 to the ribosome as a ternary
  complex with GTP; GTP hydrolysis by eRF3 accommodates eRF1 and accelerates
  peptide release.
summary: >-
  Stop-codon-decoding eRF1 and the GTPase eRF3 that together terminate
  translation.
concepts:
  - {id: GO:0018444, label: translation release factor complex}
processes:
  - {id: GO:0006415, label: translational termination}
unit_functions:
  eRF1: {id: GO:0003747, label: translation release factor activity}
  eRF3: {id: GO:0003924, label: GTPase activity}
roles:
  eRF1: stop-codon recognition and peptide release
  eRF3: GTPase that delivers eRF1 to the ribosome
notes: >-
  Two-subunit complex modelled one part per subunit. Ribosome recycling
  (Pelo/ABCE1-type factors) is outside this module.
