module: dmel_anaphase_promoting_complex
title: Anaphase-promoting complex/cyclosome in Drosophila melanogaster
label: Anaphase-promoting complex
module_type: PROTEIN_COMPLEX
description: >-
  The anaphase-promoting complex/cyclosome (APC/C) is a large multisubunit
  RING E3 ubiquitin ligase that drives mitotic exit by targeting securin and
  mitotic cyclins for proteasomal degradation, and that keeps APC/C substrate
  levels low in G1. Its catalytic core is formed by the cullin-like subunit
  Apc2 (Morula) and the RING subunit Apc11 (Lemming A). A platform of Apc1
  (Shattered), Apc4 and Apc5 (Ida) supports the core and an arc of
  tetratricopeptide-repeat subunits (Cdc27/Apc3, Cdc16/Apc6, Apc7 and
  Cdc23/Apc8). Substrates are recognized by Apc10 together with a WD40
  coactivator, Fizzy (Cdc20) in mitosis or Fizzy-related (Cdh1) at mitotic
  exit and during endocycles.
summary: >-
  Multisubunit RING E3 ligase with Fizzy or Fizzy-related coactivators that
  ubiquitylates cyclins and securin for mitotic exit.
concepts:
