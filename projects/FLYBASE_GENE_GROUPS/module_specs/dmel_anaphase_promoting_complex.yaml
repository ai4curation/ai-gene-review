    label: Apc2-Apc11 catalytic core
    role: cullin-RING catalytic core
    genes: [mr, lmgA]
    function: {id: GO:0061630, label: ubiquitin protein ligase activity}
  - id: platform
    label: Apc1-Apc4-Apc5 platform
    role: scaffold platform
    genes: [shtd, APC4, ida]
  - id: tpr_lobe
    label: TPR subunits
    role: tetratricopeptide-repeat arc
    genes: [Cdc27, Cdc16, APC7, Cdc23]
  - id: apc10
    label: Apc10
    role: substrate recognition cofactor
    genes: [APC10]
  - id: coactivator
    label: Coactivator
    role: substrate recruitment and activation
    variant_sets:
      - id: coactivators
        label: Fizzy or Fizzy-related
        selection: EXACTLY_ONE
        variants:
          - {id: apc_fzy, label: APC/C-Fizzy (Cdc20), genes: [fzy], function: {id: GO:0097027, label: ubiquitin-protein transferase activator activity}}
          - {id: apc_fzr, label: APC/C-Fizzy-related (Cdh1), genes: [fzr], function: {id: GO:0097027, label: ubiquitin-protein transferase activator activity}}
notes: >-
  FlyBase includes the coactivators Fzy and Fzr in the APC group; they are
  modelled as alternative coactivator variants. The meiosis-specific
  coactivator Cortex (cort) and Fizzy-related 2 are not FlyBase members of the
  group and are not modelled. Subunit-to-subcomplex placement follows the
  conserved APC/C architecture.
