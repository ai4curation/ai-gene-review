module: dmel_nalcn_channel_complex
title: NALCN sodium leak channel complex in Drosophila melanogaster
label: NALCN channel complex
module_type: PROTEIN_COMPLEX
description: >-
  NALCN is a voltage-insensitive cation channel that carries a background
  sodium leak current and so sets the resting membrane potential and
  excitability of neurons. Its pore-forming subunit, encoded in Drosophila by
  narrow abdomen (na), assembles with the large accessory proteins unc79 and
  unc80 and with Mid1, a protein related to yeast Mid1 and to the mammalian NALCN
  accessory factor NALF1 (FAM155A). In flies, na and its partners are needed for normal locomotor
  activity and circadian rhythmic behavior.
summary: >-
  Sodium leak channel of the pore subunit na with the accessory subunits
  unc79, unc80 and Mid1.
concepts:
  - {id: GO:0034706, label: sodium channel complex}
groups: [NALCN, NALCN-CH]
roles:
  na: pore-forming subunit
  unc79: accessory subunit
  unc80: accessory subunit
  Mid1: accessory subunit
unit_functions:
  na: {id: GO:0005272, label: sodium channel activity}
notes: >-
  The FlyBase NALCN-CH group contains only the pore subunit na, which is
  already a member of NALCN. Each subunit is modelled as a part; the
  accessory subunits are not assigned a molecular function.
