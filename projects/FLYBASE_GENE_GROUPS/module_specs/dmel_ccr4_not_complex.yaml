module: dmel_ccr4_not_complex
title: CCR4-NOT deadenylase complex in Drosophila melanogaster
label: CCR4-NOT complex
module_type: PROTEIN_COMPLEX
description: >-
  CCR4-NOT is the major cytoplasmic mRNA deadenylase in eukaryotes and also
  acts in transcription and translational repression. Its large scaffold
  subunit Not1 binds two deadenylases, Pop2 (CAF1) and twin (CCR4), which
  shorten poly(A) tails, the first step of most mRNA decay. Not1 also binds
  Rcd-1 (CNOT9), Not10 and Not11, and a NOT module of Rga (Not2) and Not3.
  RNA-binding proteins, microRNA silencing complexes and translational
  repressors recruit CCR4-NOT to specific mRNAs; in Drosophila it controls
  maternal mRNA decay and germline stem cell maintenance.
summary: >-
  Not1-scaffolded Pop2/twin deadenylase complex that shortens mRNA poly(A) tails.
concepts:
  - {id: GO:0030014, label: CCR4-NOT complex}
cellular_components:
  - {id: GO:0005737, label: cytoplasm}
parts:
  - id: deadenylase_module
    label: Deadenylase module
    role: poly(A) tail shortening
    genes: [Pop2, twin]
    function: {id: GO:0004535, label: poly(A)-specific ribonuclease activity}
    processes:
      - {id: GO:0000289, label: nuclear-transcribed mRNA poly(A) tail shortening}
  - id: not1_scaffold
    label: Not1 scaffold and associated subunits
    role: scaffold and recruitment surfaces
    genes: [Not1, Rcd-1, Not10, Not11]
  - id: not_module
    label: NOT module
    role: Not2-Not3 module
    genes: [Rga, Not3]
notes: >-
  Boundary. The deadenylase subunits are modelled as one complex part; the two
  enzymes are distinct catalytic subunits that both sit on Not1. Recruiting
  RNA-binding proteins (for example Nanos, Pumilio, Smaug, Bam) are regulators
  and not parts.
