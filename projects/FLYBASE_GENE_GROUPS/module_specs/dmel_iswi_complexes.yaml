module: dmel_iswi_complexes
title: ISWI chromatin remodeling complexes in Drosophila melanogaster
label: ISWI complexes
module_type: PROTEIN_COMPLEX
description: >-
  ISWI is an ATP-dependent chromatin remodeler that slides nucleosomes. In
  Drosophila the single ISWI ATPase is the catalytic subunit of several
  complexes defined by their accessory subunits. ACF (with Acf) and CHRAC
  (Acf plus the histone-fold pair Chrac-14 and Chrac-16) assemble and space
  regularly arrayed nucleosomes. NURF (with the large subunit E(bx)/NURF301,
  Caf1-55 and the pyrophosphatase Nurf-38) helps activate transcription of
  target genes, for example in ecdysone and JAK/STAT signaling. RSF, NORC and
  TORC (with Toutatis and CtBP) are further ISWI complexes; TORC is linked to
  transcriptional repression.
summary: >-
  ACF, CHRAC, NURF, RSF, NORC and TORC remodelers that share the ISWI ATPase.
