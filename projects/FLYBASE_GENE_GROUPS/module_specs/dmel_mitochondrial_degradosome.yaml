module: dmel_mitochondrial_degradosome
title: Mitochondrial degradosome in Drosophila melanogaster
label: Mitochondrial degradosome
module_type: PROTEIN_COMPLEX
description: >-
  The mitochondrial degradosome degrades mitochondrial RNA in the matrix. It is
  formed by the ATP-dependent RNA helicase Suv3, which unwinds structured RNA,
  and the exoribonuclease PNPase, which degrades RNA 3' to 5' by
  phosphorolysis. The complex turns over mRNAs and removes non-coding and
  antisense transcripts produced by the bidirectional transcription of the
  mitochondrial genome.
summary: >-
  Suv3 helicase and PNPase exoribonuclease complex that degrades
  mitochondrial RNA.
concepts:
  - {id: GO:0045025, label: mitochondrial degradosome}
group: MITDEG
roles:
  Suv3: RNA helicase subunit
  PNPase: 3'-5' exoribonuclease subunit
unit_functions:
  Suv3: {id: GO:0003724, label: RNA helicase activity}
  PNPase: {id: GO:0004654, label: polyribonucleotide nucleotidyltransferase activity}
