module: dmel_core_binding_factor
title: Core binding factor (Runt/CBFbeta) in Drosophila melanogaster
label: Core binding factor
module_type: PROTEIN_COMPLEX
description: >-
  Core binding factors are heterodimeric transcription factors made of a Runt
  domain DNA-binding alpha subunit and a non-DNA-binding beta subunit that
  increases the alpha subunit's DNA-binding affinity. Drosophila has four Runt
  domain proteins, runt, lozenge (lz), RunxA and RunxB, and two beta subunits,
  Brother (Bro) and Big brother (Bgb). Runt acts as a pair-rule and sex
  determination gene and in neurogenesis, while lozenge specifies cell fates in
  the eye and crystal cells among hemocytes.
summary: >-
  Heterodimers of a Runt domain DNA-binding subunit with the Bro or Bgb beta
  subunit.
concepts:
  - {id: GO:0016513, label: core-binding factor complex}
cellular_components:
  - {id: GO:0005634, label: nucleus}
parts:
  - id: runt_domain_alpha
    label: Runt domain alpha subunits
    role: DNA-binding subunit
    group: RUNT
    complex: false
    function: {id: GO:0000981, label: "DNA-binding transcription factor activity, RNA polymerase II-specific"}
  - id: cbf_beta
    label: CBF beta subunits
    role: DNA-binding enhancing partner subunit
    group: CBFB
    complex: false
notes: >-
  The alpha and beta subunits are emitted one annoton per gene because any of
  the Runt domain proteins can in principle pair with either beta subunit and the
  pairings used in each tissue are not fully defined.
