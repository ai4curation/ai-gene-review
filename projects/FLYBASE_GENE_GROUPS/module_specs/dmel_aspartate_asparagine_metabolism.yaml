module: dmel_aspartate_asparagine_metabolism
title: L-aspartate and L-asparagine metabolism in Drosophila melanogaster
label: L-aspartate and L-asparagine metabolism
module_type: METABOLIC_PATHWAY
description: >-
  Aspartate aminotransferases interconvert oxaloacetate and L-aspartate by
  transferring an amino group from L-glutamate, producing 2-oxoglutarate.
  Drosophila has a cytosolic isozyme (Got1) and a mitochondrial isozyme (Got2),
  which also act in the malate-aspartate shuttle. Asparagine synthetase (Asns)
  then converts aspartate to L-asparagine in an ATP-dependent reaction that
  uses glutamine as the nitrogen donor.
summary: >-
  Got1 and Got2 make aspartate from oxaloacetate, and Asns amidates aspartate
  to asparagine.
concepts:
  - {id: GO:0006531, label: aspartate metabolic process}
  - {id: GO:0070981, label: L-asparagine biosynthetic process}
parts:
  - id: aspartate_transamination
    label: Aspartate transamination
    role: oxaloacetate to aspartate
    description: >-
      Cytosolic (Got1) and mitochondrial (Got2) aspartate aminotransferases;
      the reaction is reversible.
    genes: [Got1, Got2]
    complex: false
    function: {id: GO:0004069, label: "L-aspartate:2-oxoglutarate transaminase activity"}
  - id: asparagine_synthesis
    label: Asparagine synthesis
    role: aspartate to asparagine
    genes: [Asns]
    function: {id: GO:0004066, label: asparagine synthase (glutamine-hydrolyzing) activity}
connections:
  - source: aspartate_transamination
    target: asparagine_synthesis
    connection_type: PRECEDES
    description: Aspartate formed by transamination is the substrate of asparagine synthetase.
notes: >-
  Boundary. The module covers the three FlyBase members. The malate-aspartate
  shuttle partners (malate dehydrogenases and mitochondrial carriers) and
  asparaginase-mediated asparagine breakdown are not parts. Enzyme functions are
  assigned by orthology to the conserved mammalian enzymes.
group: ASPASNM
