module: dmel_chromosomal_passenger_complex
title: Chromosomal passenger complexes in Drosophila melanogaster
label: Chromosomal passenger complex
module_type: PROTEIN_COMPLEX
description: >-
  The chromosomal passenger complex (CPC) moves from centromeres in early
  mitosis to the spindle midzone and midbody in anaphase and telophase. Its
  enzymatic subunit Aurora B kinase phosphorylates kinetochore substrates to
  correct erroneous microtubule attachments, supports the spindle assembly
  checkpoint and later promotes cytokinesis. INCENP binds and activates Aurora
  B and links it to the localization module, formed by Survivin (Deterin in
  Drosophila) and Borealin. In Drosophila male meiosis the Borealin paralog
  Australin replaces Borealin in a meiotic CPC.
summary: >-
  Aurora B-INCENP kinase module with a Deterin plus Borealin (mitotic) or
  Australin (meiotic) localization module.
concepts:
  - {id: GO:0032133, label: chromosome passenger complex}
parts:
  - id: kinase_module
    label: Aurora B-INCENP kinase module
    role: catalytic module
    genes: [aurB, Incenp]
    unit_functions:
      aurB: {id: GO:0004674, label: protein serine/threonine kinase activity}
  - id: localization_module
    label: Survivin-Borealin localization module
    role: centromere and midzone targeting
    variant_sets:
      - id: localization_variants
        label: Mitotic or meiotic localization module
        selection: ONE_OR_MORE
        variants:
          - {id: mitotic_det_borr, label: Deterin-Borealin (mitotic), genes: [Det, borr]}
          - {id: meiotic_det_aust, label: Deterin-Australin (meiotic), genes: [Det, aust]}
notes: >-
  FlyBase subgroups CPC-MIT and CPC-MEI share aurB, Incenp and Det and differ
  only in Borealin (borr) or Australin (aust); the shared kinase module is
  modelled once and the localization module as variants.
