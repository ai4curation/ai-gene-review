module: dmel_retromer
title: Retromer complex in Drosophila melanogaster
label: Retromer
module_type: PROTEIN_COMPLEX
description: >-
  Retromer retrieves transmembrane cargo from endosomes and returns it to the
  trans-Golgi network or to the plasma membrane. Its cargo-selective core is a
  heterotrimer of Vps35, Vps26 and Vps29 that recognizes sorting motifs in
  cargo tails; it associates with sorting nexins, including the SNX-BAR
  proteins Snx1 and Snx6, which bind endosomal phosphoinositides and shape
  membrane tubules. In Drosophila, retromer recycles the Wnt cargo receptor
  Wntless (Wls) to the Golgi, which is needed for Wingless secretion, and it
  also maintains rhodopsin and other cargo in photoreceptors.
summary: >-
  Vps35-Vps26-Vps29 cargo-selective complex with SNX-BAR sorting nexins that
  retrieves cargo from endosomes to the Golgi and plasma membrane.
concepts:
  - {id: GO:0030904, label: retromer complex}
cellular_components:
  - {id: GO:0005768, label: endosome}
notes: >-
  Decomposition. The cargo-selective trimer and the SNX-BAR sorting nexin pair
  are modelled as separate parts; the SNX-BAR proteins associate with the
  trimer less stably than the trimer subunits associate with each other.
  Snx3 and the WASH complex, which also cooperate with retromer, are outside
  this module.
parts:
  - id: cargo_selective_complex
    label: Retromer cargo-selective complex
    role: cargo recognition trimer
    genes: [Vps35, Vps26, Vps29]
    complex_term: {id: GO:0030906, label: "retromer, cargo-selective complex"}
    processes:
