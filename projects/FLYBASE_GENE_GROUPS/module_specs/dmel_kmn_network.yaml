connections:
  - {source: mis12_complex, target: ndc80_complex, connection_type: POSITIVELY_REGULATES, description: The Mis12 complex recruits the Ndc80 complex to the kinetochore.}
  - {source: mis12_complex, target: knl1, connection_type: POSITIVELY_REGULATES, description: The Mis12 complex recruits Spc105R/Knl1 to the kinetochore.}
notes: >-
  FlyBase lists Ndc80, Nuf2 and Spc25 in the Ndc80 complex group. Nnf1a has
  no UniProt entry in the FlyBase mapping and is grounded to its FlyBase gene
  id. The microtubule binding function is placed on the Ndc80 complex as a
  whole. Checkpoint proteins recruited by Spc105R (Bub1, BubR1, Bub3) and the
  RZZ complex (dmel_rzz_complex) are outside the module.
