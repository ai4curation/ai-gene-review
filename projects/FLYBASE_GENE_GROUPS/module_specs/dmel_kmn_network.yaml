module: dmel_kmn_network
title: KMN network of the outer kinetochore in Drosophila melanogaster
label: KMN network
module_type: PROTEIN_COMPLEX
description: >-
  The KMN network (Knl1, Mis12 complex and Ndc80 complex) is the core
  microtubule-binding module of the outer kinetochore. The Mis12 complex links
  the network to the centromere-proximal inner kinetochore; in Drosophila it
  binds the CENP-C homolog Cenp-C, because flies lack the CENP-T pathway. The
  Ndc80 complex binds spindle microtubules directly and forms load-bearing
  attachments. Knl1 (Spc105R in Drosophila) provides a scaffold for spindle
  assembly checkpoint proteins and for protein phosphatase 1. Drosophila has
  two Nnf1 paralogs, Nnf1a and Nnf1b, which form alternative Mis12 complexes.
summary: >-
  Spc105R (Knl1), Mis12 and Ndc80 complexes that form the
  microtubule-attachment core of the outer kinetochore.
concepts:
