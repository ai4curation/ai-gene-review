module: dmel_threonylcarbamoyl_transferase_complex
title: KEOPS threonylcarbamoyl transferase complex in Drosophila melanogaster
label: KEOPS complex
module_type: PROTEIN_COMPLEX
description: >-
  The KEOPS (EKC) complex transfers a threonylcarbamoyl group onto adenosine 37
  of tRNAs that decode ANN codons, forming t6A, a modification needed for
  accurate decoding. Threonylcarbamoyl-AMP is supplied by a separate enzyme
  (Sua5/YRDC). The catalytic subunit is the Kae1/OSGEP ortholog (Tcs3 in flies);
  Bud32/TP53RK (Tcs5) is an atypical kinase-like ATPase subunit and Pcc1/LAGE3
  (Tcs6) is a small dimerization subunit. In Drosophila, KEOPS subunits are
  required for growth.
summary: >-
  Cytoplasmic KEOPS complex that forms t6A at tRNA position 37.
concepts:
  - {id: GO:0000408, label: EKC/KEOPS complex}
processes:
  - {id: GO:0002949, label: tRNA threonylcarbamoyladenosine modification}
unit_functions:
  Tcs3: {id: GO:0061711, label: tRNA N(6)-L-threonylcarbamoyladenine synthase activity}
roles:
  Tcs3: catalytic subunit (Kae1/OSGEP)
  Tcs5: kinase-like ATPase subunit (Bud32/TP53RK)
  Tcs6: dimerization subunit (Pcc1/LAGE3)
notes: >-
  Modelled one part per subunit. The Cgi121 (TPRKB) and Gon7 subunits found in
  yeast and human KEOPS are not in the FlyBase group and are not included. The
  mitochondrial t6A enzyme (OSGEPL1 ortholog) and YRDC are outside this module.
