module: dmel_ribonucleotide_reductase
title: Ribonucleotide reductase in Drosophila melanogaster
label: Ribonucleotide reductase
module_type: PROTEIN_COMPLEX
description: >-
  Class I ribonucleotide reductase converts ribonucleoside diphosphates to
  deoxyribonucleoside diphosphates, the rate-limiting step in supplying dNTPs
  for DNA replication and repair. It is a complex of a large R1 subunit
  (RnrL), which contains the catalytic site and the allosteric sites that
  control activity and substrate specificity, and a small R2 subunit (RnrS),
  which carries the diferric-tyrosyl radical cofactor that starts catalysis.
  Electrons are supplied by thioredoxin or glutaredoxin.
summary: >-
  R1-R2 ribonucleotide reductase that makes deoxyribonucleotides for DNA
  synthesis.
concepts:
  - {id: GO:0005971, label: ribonucleoside-diphosphate reductase complex}
cellular_components:
  - {id: GO:0005829, label: cytosol}
group: RNRC
unit_functions:
  RnrL: {id: GO:0004748, label: "ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor"}
roles:
  RnrL: R1 catalytic and allosteric subunit
  RnrS: R2 radical-generating subunit
notes: >-
  The reductase activity is assigned to the catalytic R1 subunit; R2 provides
  the tyrosyl radical. Thioredoxins and dNTP-pool regulators are outside the
  module.
