module: dmel_respiratory_complex_assembly_factors
title: Respiratory chain and ATP synthase assembly factors in Drosophila melanogaster
label: Respiratory complex assembly factors
module_type: BIOLOGICAL_PROCESS
description: >-
  The complexes of the mitochondrial oxidative phosphorylation system are
  built from nuclear- and mitochondrially encoded subunits with the help of
  dedicated assembly factors that are not part of the mature enzymes. Complex
  II (succinate dehydrogenase) assembly factors include SDHAF2-type proteins
  required for covalent flavinylation of the SdhA subunit and SDHAF3 and SDHAF4 homologs that protect
  the iron-sulfur subunit and intermediates. Complex III assembly requires the
  AAA ATPase Bcs1, which inserts the Rieske iron-sulfur protein, the LYR
  protein LYRM7 that chaperones it, and the UQCC proteins that support
  cytochrome b. HIG1 domain proteins associate with complexes III and IV and
  support respiratory supercomplex formation. ATP synthase (complex V)
  assembly factors include ATPAF1-type chaperones of the F1 domain, TMEM70 and
  the metalloprotease ATP23.
summary: >-
  Non-subunit chaperones and assembly factors needed to build respiratory
  complexes II and III, respiratory supercomplexes and ATP synthase.
concepts:
  - {id: GO:0033108, label: mitochondrial respiratory chain complex assembly}
cellular_components:
  - {id: GO:0005743, label: mitochondrial inner membrane}
complex: false
parts:
  - id: complex_ii_assembly
    label: Complex II assembly factors
    role: succinate dehydrogenase assembly
    group: MCII-AF
    processes:
      - {id: GO:0034553, label: mitochondrial respiratory chain complex II assembly}
  - id: complex_iii_assembly
    label: Complex III assembly factors
    role: cytochrome bc1 complex assembly
    group: MCIII-AF
    processes:
      - {id: GO:0034551, label: mitochondrial respiratory chain complex III assembly}
  - id: respirasome_assembly
    label: Respiratory supercomplex assembly factors
    role: supercomplex (respirasome) assembly
    group: MCR-AF
    processes:
      - {id: GO:0097250, label: mitochondrial respirasome assembly}
  - id: complex_v_assembly
    label: ATP synthase assembly factors
    role: F1Fo ATP synthase assembly
    group: MCV-AF
    processes:
      - {id: GO:0033615, label: mitochondrial proton-transporting ATP synthase complex assembly}
notes: >-
  The module groups four FlyBase assembly-factor sets; the factors act on
  different complexes and are not a single complex or a linear pathway, so no
  connections are asserted. Complex I and complex IV assembly factors are not
  in these FlyBase groups and are outside this module. Several members are
  uncharacterised in Drosophila (for example CG15386, CG30373, CG17734 and
  CG12107) and are included on the strength of FlyBase group membership and
  orthology; process terms are applied at the level of each group and do not
  imply that each member has been tested. Molecular functions are left unset
  because they are not established for the Drosophila proteins.
