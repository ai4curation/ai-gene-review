module: dmel_proteasome
title: 26S proteasome in Drosophila melanogaster
label: 26S proteasome
module_type: PROTEIN_COMPLEX
description: >-
  The 26S proteasome degrades proteins tagged with polyubiquitin chains. Its
  20S core particle is a barrel of four stacked heptameric rings, two outer
  rings of alpha subunits that gate substrate entry and two inner rings of
  beta subunits, three of which (beta1, beta2 and beta5) are N-terminal
  threonine proteases with caspase-like, trypsin-like and chymotrypsin-like
  specificities. The 19S regulatory particle caps the core. Its base contains
  six AAA+ ATPases (Rpt1-Rpt6) that unfold substrates and open the core gate,
  together with the scaffolds Rpn1 and Rpn2. Ubiquitin receptors (Rpn10 and
  Rpn13) bind ubiquitylated substrates, the lid metalloprotease Rpn11 removes
  ubiquitin chains before degradation, and Uch-L5 bound to Rpn13 trims chains.
  Drosophila has a testis-specific 26S proteasome in which paralogs replace
  several alpha, beta, Rpt, Rpn and Uch-L5 subunits.
summary: >-
  Ubiquitin-dependent ATP-driven protease formed by the 20S core particle and
  19S regulatory particle, with a testis-specific paralog variant.
