notes: >-
  Somatic and testis-specific variants follow the FlyBase groups PSM26S and
  PSM26S-T; subunits shared by both appear in each variant. Prosalpha1R is a
  member of both FlyBase variant groups. The base, lid and ubiquitin-receptor
  split follows the conserved eukaryotic 19S organisation; Rpn10 and Rpn13 are
  modelled separately because their placement between base and lid is not
  sharply defined. Catalytic activity is asserted only for the canonical beta1
  (Prosbeta1), beta2 (Prosbeta2) and beta5 (Prosbeta5) subunits; whether the
  testis paralogs Prosbeta2R1, Prosbeta2R2, Prosbeta5R1 and Prosbeta5R2 keep
  catalytic activity is not asserted. Likewise ATPase and deubiquitinase
  activities are not asserted for the testis paralogs Rpt3R, Rpt4R, Rpt6R and
  Uch-L5R. Several members (Rpt1, Rpn9, Rpn12R, Prosbeta5, Prosbeta2R2,
  Prosbeta4R1) have no UniProt entry in the cache and are grounded to FlyBase
  gene ids.
