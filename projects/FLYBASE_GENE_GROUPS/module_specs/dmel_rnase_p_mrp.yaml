module: dmel_rnase_p_mrp
title: RNase P and RNase MRP complexes in Drosophila melanogaster
label: RNase P and RNase MRP
module_type: PROTEIN_COMPLEX
description: >-
  Ribonuclease P removes the 5' leader from precursor tRNAs. Nuclear RNase P is
  a ribonucleoprotein whose catalytic RNA (RNaseP:RNA) is bound by several
  proteins; the related RNase MRP shares most of these proteins but has its own
  RNA (RNaseMRP:RNA) and cleaves other substrates, including pre-rRNA. In
  mitochondria, tRNA 5' processing is carried out by a protein-only RNase P made
  of a tRNA methyltransferase subunit (rswl, MRPP1 homolog), a short-chain
  dehydrogenase subunit (scu, MRPP2/HSD17B10 homolog) and the PRORP-type
  nuclease subunit (mldr).
summary: >-
  Nuclear RNase P and RNase MRP ribonucleoproteins and the protein-only
  mitochondrial RNase P.
concepts:
  - {id: GO:0030677, label: ribonuclease P complex}
  - {id: GO:0000172, label: ribonuclease MRP complex}
parts:
