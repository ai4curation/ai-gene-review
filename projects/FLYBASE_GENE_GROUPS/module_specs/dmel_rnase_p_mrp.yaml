  - id: mitochondrial_rnase_p
    label: Mitochondrial RNase P
    role: mitochondrial pre-tRNA 5' leader removal
    group: RNASEP-M
    complex_term: {id: GO:0030678, label: mitochondrial ribonuclease P complex}
    unit_functions:
