notes: >-
  Parts follow FlyBase groups RNASEP-N, RNASEMRP and RNASEP-M. Nuclear RNase P
  and RNase MRP share Pop1, Pop4, Pop5, Rpp14a, Rpp14b, Rpp20, Rpp25 and Rpp30;
  FlyBase lists Rpp21 only in RNase P. The catalytic RNAs (RNaseP:RNA,
  RNaseMRP:RNA) are grounded to FlyBase gene ids. The ribonuclease activities
  are assigned to the whole nuclear complexes because the RNA subunit is
  catalytic; in the mitochondrial complex only the nuclease subunit (mldr) is
  given an activity. Substrate specificity of Drosophila RNase MRP has not been
  characterized directly and is inferred from other eukaryotes.
