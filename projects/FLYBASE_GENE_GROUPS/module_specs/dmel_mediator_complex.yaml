module: dmel_mediator_complex
title: Mediator complex in Drosophila melanogaster
label: Mediator complex
module_type: PROTEIN_COMPLEX
description: >-
  Mediator is a large multisubunit coactivator that bridges DNA-bound
  transcription factors and RNA polymerase II, helping assemble and activate the
  preinitiation complex. The core Mediator (head, middle and tail modules,
  with MED14 as a central scaffold) binds the polymerase, while tail subunits
  contact activators. The CDK8 kinase module (CKM), consisting of Cdk8, CycC,
  MED12 (kto) and MED13 (skd), associates reversibly with core Mediator and
  generally restrains its interaction with polymerase; Drosophila kto and skd
  were identified through their roles in imaginal disc patterning.
summary: >-
  Core Mediator coactivator and its reversibly associated CDK8 kinase module.
