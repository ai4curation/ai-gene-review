module: dmel_axonemal_dynein_arms
title: Axonemal outer and inner dynein arms in Drosophila melanogaster
label: Axonemal dynein arms
module_type: PROTEIN_COMPLEX
description: >-
  Axonemal dyneins are the motors that bend motile cilia and flagella. They are
  attached in rows along the doublet microtubules of the 9+2 axoneme as outer dynein
  arms, which mainly set beat frequency, and inner dynein arms, which mainly shape
  the waveform. Each arm contains one or more dynein heavy chains, the ATP-driven
  motor subunits, together with intermediate and light chains that anchor the arm
  and regulate it. In Drosophila, motile axonemes are found only in sperm flagella and
  in the cilia of chordotonal mechanosensory neurons, so axonemal dyneins act in male
  fertility and hearing. Several sperm-specific heavy chains are encoded by the
  Y-chromosome fertility factors kl-2, kl-3 and kl-5.
summary: >-
  Outer and inner arm axonemal dynein heavy, intermediate and light chains that
  power motility of sperm flagella and chordotonal cilia.
