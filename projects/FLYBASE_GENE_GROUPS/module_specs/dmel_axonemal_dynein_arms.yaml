notes: >-
  Heavy chains, intermediate chains and light chains are modelled per gene rather
  than as single complexes, because the composition of individual Drosophila arm
  species (which heavy chains pair with which intermediate chains, and which are
  sperm- versus chordotonal-specific) is not fully established. Heavy chains are
  given the general microtubule motor activity term. ODA-Dnal1 and Dnali1 are
  members of the FlyBase dynein light chain group (DYN-LC), which is assigned to
  dmel_cytoplasmic_dynein_dynactin; they are added here as non-member genes because
  they are axonemal arm light chains by homology. Outer-arm docking complex, dynein
  preassembly factors and the cytoplasmic dynein light chains are not parts.
groups: [DYNA, DYNA-IC]
