module: dmel_ferritin_complex
title: Ferritin complexes in Drosophila melanogaster
label: Ferritin complexes
module_type: PROTEIN_COMPLEX
description: >-
  Insect ferritins store and transport iron. The main Drosophila ferritin is a
  24-subunit shell made of equal numbers of heavy-chain homolog (Fer1HCH) and
  light-chain homolog (Fer2LCH) subunits; unlike mammalian ferritin it is
  largely made in the secretory pathway and is present in the hemolymph. The
  heavy-chain subunit carries the ferroxidase centre that oxidises Fe(II) for
  storage as Fe(III) in the mineral core. Ferritin in the midgut iron cell
  region takes up dietary iron and is needed for iron export to the rest of the
  body. A third gene, Fer3HCH, encodes a mitochondrial ferritin expressed
  mainly in the testis.
summary: >-
  Secreted Fer1HCH-Fer2LCH heteropolymeric ferritin and the mitochondrial
  ferritin Fer3HCH that store iron in Drosophila.
concepts:
  - {id: GO:0070288, label: ferritin complex}
parts:
  - id: secreted_ferritin
    label: Fer1HCH-Fer2LCH ferritin
    role: secreted heteropolymeric iron-storage and transport ferritin
    genes: [Fer1HCH, Fer2LCH]
    complex_term: {id: GO:0070288, label: ferritin complex}
    unit_functions:
      Fer1HCH: {id: GO:0004322, label: ferroxidase activity}
    roles:
      Fer1HCH: heavy-chain homolog subunit with the ferroxidase centre
      Fer2LCH: light-chain homolog subunit
  - id: mitochondrial_ferritin
    label: Mitochondrial ferritin
    role: mitochondrial iron-storage ferritin
    complex: false
    genes: [Fer3HCH]
notes: >-
  Fer3HCH is a heavy-chain-type ferritin targeted to mitochondria; it is modelled
  as a separate part with no molecular function because its ferroxidase activity
  is inferred from sequence. The subunit stoichiometry (12 heavy and 12 light
  chains) applies to the Fer1HCH-Fer2LCH ferritin. Iron import and export
  transporters and the iron regulatory protein system that controls Fer1HCH
  translation are outside the module.
