notes: >-
  Parts follow the FlyBase subgroups MRPS and MRPL, which include the
  mitochondrially encoded rRNAs (mt:srRNA, mt:lrRNA) grounded to their FlyBase
  gene ids. FlyBase lists mRpS30 in both subunits and mRpS18A in the large
  subunit group; these placements are kept as curated by FlyBase. Some members
  of MRPS (for example Ptcd3, bonsai, CG4882, CG12848) carry non-ribosomal-protein
  names; they are kept as FlyBase-listed subunit members.
