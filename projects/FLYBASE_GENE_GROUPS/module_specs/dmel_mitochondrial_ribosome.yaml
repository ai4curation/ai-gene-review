module: dmel_mitochondrial_ribosome
title: Mitochondrial ribosome in Drosophila melanogaster
label: Mitochondrial ribosome
module_type: PROTEIN_COMPLEX
description: >-
  The mitochondrial ribosome (mitoribosome) translates the small set of
  mitochondrial-DNA-encoded mRNAs, which in animals encode core subunits of the
  respiratory chain and ATP synthase. It consists of a small subunit built on
  the mitochondrially encoded 12S-type rRNA (mt:srRNA) and a large subunit
  built on the 16S-type rRNA (mt:lrRNA), together with nuclear-encoded
  mitochondrial ribosomal proteins. Animal mitoribosomes are protein-rich: they
  contain bacterial-type ribosomal proteins plus many mitochondria-specific
  proteins. In Drosophila, loss of the small-subunit protein tko (mRpS12) causes
  the technical knockout phenotype of bang sensitivity.
summary: >-
  Small and large mitoribosomal subunits that translate mitochondrial-DNA-encoded
  mRNAs.
