module: dmel_brahma_complexes
title: Brahma (SWI/SNF) chromatin remodeling complexes in Drosophila melanogaster
label: Brahma complexes
module_type: PROTEIN_COMPLEX
description: >-
  Brahma complexes are the Drosophila SWI/SNF-family ATP-dependent chromatin
  remodelers. They use the Brahma (brm) ATPase to slide or evict nucleosomes,
  making DNA accessible to transcription factors, and act as trithorax group
  regulators that oppose Polycomb silencing. All forms share a core of brm,
  Moira, Bap55, Bap60, Brd7-9 and actin. The BAP form contains the ARID
  protein Osa, the PBAP form instead contains Polybromo, Bap170 and e(y)3, and
  a non-canonical form (ncBAP) contains Bicra. Different forms control
  different target genes in development.
summary: >-
  SWI/SNF-family chromatin remodelers built around the Brahma ATPase, present
  as BAP, PBAP and non-canonical BAP forms.
concepts:
  - {id: GO:0035060, label: brahma complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
variant_sets:
  - id: brahma_complex_forms
    label: Brahma complex forms
    selection: ONE_OR_MORE
    variants:
      - id: bap
        label: BAP complex (Osa-containing)
        group: BAP
        complex_term: {id: GO:0035060, label: brahma complex}
        unit_functions:
          brm: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
      - id: pbap
        label: PBAP complex (Polybromo-containing)
        group: PBAP
        complex_term: {id: GO:0016586, label: RSC-type complex}
        unit_functions:
          brm: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
      - id: ncbap
        label: Non-canonical BAP complex (Bicra-containing)
        group: NCBAP
        complex_term: {id: GO:0140288, label: GBAF complex}
        unit_functions:
          brm: {id: GO:0140658, label: ATP-dependent chromatin remodeler activity}
notes: >-
  The three FlyBase subgroups are modelled as alternative complex forms, so
  shared core subunits (brm, mor, Bap55, Bap60, Brd7-9, actin) appear in each.
  PBAP is grounded to GO RSC-type complex (the PBAF-type branch) and ncBAP to
  GBAF complex by analogy with the mammalian GLTSCR1/BICRA-containing complex.
  FlyBase lists two actins (Act5C and Act42A) as BAP/PBAP members.
