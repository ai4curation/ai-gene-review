module: dmel_diphthamide_dph1_dph2_complex
title: Dph1-Dph2 diphthamide synthesis complex in Drosophila melanogaster
label: Dph1-Dph2 complex
module_type: PROTEIN_COMPLEX
description: >-
  Diphthamide is a modified histidine residue on translation elongation factor 2
  (eEF2) that is required for accurate translation and is the target of
  diphtheria toxin. Its first step, transfer of a 3-amino-3-carboxypropyl group
  from S-adenosylmethionine to the histidine of eEF2, is catalysed by a
  heterodimer of the iron-sulfur radical SAM-like enzymes Dph1 and Dph2. Later
  steps are performed by Dph3, Dph4, Dph5, Dph6 and Dph7, which are not part of
  this complex.
summary: >-
  Dph1-Dph2 heterodimer that catalyses the first step of eEF2 diphthamide
  synthesis.
concepts:
  - {id: GO:0120513, label: 2-(3-amino-3-carboxypropyl)histidine synthase complex}
notes: >-
  Modelled one part per subunit. The activity belongs to the heterodimer and is
  given to both subunits; assignments are by orthology to yeast and human
  Dph1-Dph2.
