module: dmel_elg1_rfc_like_complex
title: Elg1 RFC-like complex in Drosophila melanogaster
label: Elg1 RFC-like complex
module_type: PROTEIN_COMPLEX
description: >-
  Replication factor C (RFC) is a pentameric AAA+ clamp loader made of one
  large subunit and four small subunits. In the Elg1 RFC-like complex the
  large subunit Rfc1 is replaced by Elg1 (ATAD5 in mammals), while the four
  small RFC subunits are shared. In yeast and human cells this complex unloads
  the PCNA sliding clamp from DNA after Okazaki fragment ligation, and its
  loss raises genome instability.
summary: >-
  RFC-like PCNA unloader in which Elg1 replaces the large Rfc1 subunit.
concepts:
  - {id: GO:0031391, label: Elg1 RFC-like complex}
cellular_components:
  - {id: GO:0005634, label: nucleus}
parts:
  - id: elg1_large_subunit
    label: Elg1 large subunit
    role: distinguishing large subunit
    genes: [elg1]
  - id: rfc_small_subunits
    label: Shared RFC small subunits
    role: AAA+ small subunits shared with RFC
    description: >-
      The four small RFC subunits (Rfc2-5 homologs) shared with the canonical
      RFC clamp loader and the other RFC-like complexes.
    genes: [RfC4, RfC38, RfC3, CG8142]
notes: >-
  The PCNA-unloading role is inferred from yeast and human Elg1/ATAD5; it has
  not been tested biochemically for the Drosophila complex.
