module: dmel_usp46_deubiquitinase_complex
title: Usp12/46 deubiquitinase complex in Drosophila melanogaster
label: Usp12/46 deubiquitinase complex
module_type: PROTEIN_COMPLEX
description: >-
  Usp12-46 is the single Drosophila ortholog of the human ubiquitin-specific
  proteases USP12 and USP46. As in humans, it forms a complex with two WD40
  proteins, Uaf1 (WDR48) and Wdr20, which bind the catalytic domain and
  stimulate its deubiquitinase activity. In Drosophila, Usp12-46 with Uaf1 and
  Wdr20 has been reported to deubiquitylate and stabilize signalling
  components, including the Notch receptor and Arrow in Wingless signalling.
summary: >-
  Usp12-46 ubiquitin-specific protease activated by the WD40 cofactors Uaf1
  and Wdr20.
concepts:
  - {id: GO:1905368, label: peptidase complex}
group: USP46-C
unit_functions:
  Usp12-46: {id: GO:0101005, label: deubiquitinase activity}
roles:
  Usp12-46: catalytic ubiquitin-specific protease
  Uaf1: WD40 activator (WDR48)
  Wdr20: WD40 activator
notes: >-
  GO has no specific term for the USP12/46-UAF1-WDR20 complex; the module is
  grounded to the generic peptidase complex term.
