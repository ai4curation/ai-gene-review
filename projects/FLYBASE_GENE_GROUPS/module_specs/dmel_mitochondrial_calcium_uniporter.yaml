module: dmel_mitochondrial_calcium_uniporter
title: Mitochondrial calcium uniporter complex in Drosophila melanogaster
label: Mitochondrial calcium uniporter
module_type: PROTEIN_COMPLEX
description: >-
  The mitochondrial calcium uniporter carries Ca2+ across the inner
  mitochondrial membrane, driven by the membrane potential. The pore is formed
  by MCU together with the small single-pass protein EMRE, which is required
  for uniporter activity in animals. On the intermembrane space side, the
  EF-hand proteins of the MICU family act as Ca2+-sensing gatekeepers that keep
  the channel closed at resting Ca2+ and open it when Ca2+ rises. FlyBase
  defines a complex with MICU1 and MICU3 and a variant in which the EF-hand
  protein CG4704 takes the place of MICU1.
summary: >-
  MCU-EMRE pore with MICU gatekeepers that takes up Ca2+ into the
  mitochondrial matrix.
concepts:
  - {id: GO:1990246, label: uniplex complex}
parts:
  - id: mcu_pore
    label: MCU-EMRE pore
    role: calcium-conducting pore
    genes: [MCU, EMRE]
    unit_functions:
      MCU: {id: GO:0005262, label: calcium channel activity}
  - id: micu_gatekeepers
    label: MICU gatekeepers
    role: calcium-sensing regulation of the pore
    variant_sets:
      - id: micu_variants
        label: MICU gatekeeper pairs
        selection: ONE_OR_MORE
        variants:
          - {id: micu1_micu3, label: MICU1-MICU3, genes: [MICU1, MICU3]}
          - {id: cg4704_micu3, label: CG4704-MICU3 variant, genes: [CG4704, MICU3]}
notes: >-
  The two FlyBase uniporter groups share MCU, EMRE and MICU3 and differ in the
  MICU1-like subunit, so they are modelled as one pore part plus a gatekeeper
  variant set. The FlyBase CG4704 variant group is tagged as testis-related
  (MCUNI-T); its tissue restriction is taken from FlyBase.
