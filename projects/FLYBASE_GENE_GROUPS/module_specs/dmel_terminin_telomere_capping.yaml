module: dmel_terminin_telomere_capping
title: Terminin telomere-capping complex in Drosophila melanogaster
label: Terminin telomere capping
module_type: PROTEIN_COMPLEX
description: >-
  Drosophila telomeres are maintained by retrotransposons rather than
  telomerase, and their capping is sequence-independent. The terminin
  complex binds chromosome ends and prevents them from being recognised as
  DNA breaks and fused. It contains HOAP (encoded by caravaggio, cav) with
  HipHop, which together with HP1 form the HipHop-HOAP subcomplex, and the
  MTV subcomplex of Modigliani (Moi), Verrocchio (Ver) and Tea, which also
  associates with HOAP. Loss of terminin subunits causes telomere fusions.
summary: >-
  Fast-evolving telomere cap of HipHop-HOAP and Moi-Tea-Ver that prevents
  end-to-end chromosome fusions.
concepts:
  - {id: GO:0000783, label: nuclear telomere cap complex}
cellular_components:
  - {id: GO:0000781, label: "chromosome, telomeric region"}
parts:
  - id: hiphop_hoap
    label: HipHop-HOAP subcomplex
    role: chromosome-end binding subcomplex
    group: HHTC
    processes:
      - {id: GO:0016233, label: telomere capping}
  - id: mtv
    label: Moi-Tea-Ver (MTV) subcomplex
    role: chromosome-end protection subcomplex
    group: MTV
    processes:
      - {id: GO:0016233, label: telomere capping}
notes: >-
  HOAP (cav) is listed in both FlyBase subgroups and so appears in both parts.
  HP1 (Su(var)205) is also part of the cap but is not a member of these FlyBase
  groups and is not added here, because it has many roles outside telomeres.
