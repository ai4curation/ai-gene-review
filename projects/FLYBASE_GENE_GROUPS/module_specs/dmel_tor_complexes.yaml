notes: >-
  Boundary. Membership follows FlyBase; FlyBase lists Lst8 only in TORC2,
  although Lst8 is also a TORC1 subunit in other organisms. Upstream
  regulators (Rag and Rheb GTPases, GATOR, TSC) are modelled in
  dmel_torc1_nutrient_sensing.
