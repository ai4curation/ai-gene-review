module: dmel_tor_complexes
title: TOR complexes TORC1 and TORC2 in Drosophila melanogaster
label: TOR complexes
module_type: PROTEIN_COMPLEX
description: >-
  The serine/threonine kinase TOR acts in two distinct complexes. TORC1,
  defined by the substrate-recruiting subunit Raptor, is rapamycin-sensitive,
  is activated by amino acids and growth factors through the Rag and Rheb
  GTPases, and promotes growth by phosphorylating S6 kinase and the translation
  inhibitor 4E-BP (Thor) while repressing autophagy. TORC2, defined by Rictor
  and Sin1 together with Lst8, phosphorylates Akt at its hydrophobic motif and
  contributes to growth control and cytoskeletal regulation.
summary: >-
  TOR kinase complexes TORC1 (TOR-Raptor) and TORC2 (TOR-Rictor-Sin1-Lst8).
