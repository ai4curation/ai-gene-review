          - {id: tpnc47d, label: TpnC47D, genes: [TpnC47D], function: {id: GO:0005509, label: calcium ion binding}}
          - {id: tpnc25d, label: TpnC25D, genes: [TpnC25D], function: {id: GO:0005509, label: calcium ion binding}}
