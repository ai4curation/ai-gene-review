module: dmel_troponin_complex
title: Troponin complex in Drosophila melanogaster
label: Troponin complex
module_type: PROTEIN_COMPLEX
description: >-
  Troponin is the calcium sensor of the thin filament in striated muscle. It is a
  complex of three subunits bound to tropomyosin: troponin C binds calcium,
  troponin I inhibits actomyosin interaction at rest, and troponin T anchors the
  complex to tropomyosin. When calcium binds troponin C, the inhibition by troponin
  I is relieved and tropomyosin moves to expose myosin-binding sites on actin,
  allowing contraction. Drosophila has single genes for troponin I (wings up A,
  wupA) and troponin T (upheld, up), each producing many muscle-specific isoforms by
  alternative splicing, and five troponin C genes expressed in different muscles; in
  the indirect flight muscle TpnC4 and TpnC41C are used, with TpnC4 linked to
  stretch activation.
summary: >-
  Calcium-sensing troponin C, I and T complex of the striated muscle thin filament.
concepts:
