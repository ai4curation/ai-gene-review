notes: >-
  Tropomyosins (Tm1, Tm2) and actin are thin filament context and not parts. TpnC
  paralogs are modelled as an EXACTLY_ONE choice per complex; the muscle-specific
  expression pattern of TpnC25D and TpnC47D is not described here.
