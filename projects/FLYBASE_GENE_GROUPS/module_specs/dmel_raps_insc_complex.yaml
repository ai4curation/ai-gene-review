module: dmel_raps_insc_complex
title: Pins-Inscuteable (Raps-Insc) complex in Drosophila melanogaster
label: Pins-Inscuteable complex
module_type: PROTEIN_COMPLEX
description: >-
  Partner of Inscuteable (Pins, also called Raps) and Inscuteable (Insc) form a
  complex at the apical cortex of dividing neuroblasts. Insc binds the Par complex
  through Bazooka and recruits Pins, which with the G protein alpha subunit Galphai
  binds Mud (NuMA) and orients the mitotic spindle along the apical-basal axis. This
  coupling of cell polarity to spindle orientation ensures that basal cell-fate
  determinants segregate into the smaller ganglion mother cell during asymmetric
  neuroblast division.
summary: >-
  Insc-Pins complex that links the apical Par complex to spindle orientation in
  asymmetrically dividing neuroblasts.
concepts:
  - {id: GO:1990499, label: raps-insc complex}
parts:
  - id: inscuteable
    label: Inscuteable
    role: adaptor linking Bazooka to Pins
    genes: [insc]
    processes:
      - {id: GO:0055059, label: asymmetric neuroblast division}
  - id: pins
    label: Partner of Inscuteable (Pins)
    role: Galphai- and Mud-binding spindle orientation factor
    genes: [pins]
    processes:
      - {id: GO:0055059, label: asymmetric neuroblast division}
connections:
  - source: inscuteable
    target: pins
    connection_type: POSITIVELY_REGULATES
    description: Insc recruits Pins to the apical cortex of neuroblasts.
notes: >-
  Galphai, Mud and Bazooka bind the complex but are not members of the FlyBase
  group and are treated as context. Pins is also active in epithelia without Insc.
group: RIC
