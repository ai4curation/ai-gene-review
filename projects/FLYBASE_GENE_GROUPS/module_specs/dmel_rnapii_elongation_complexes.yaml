notes: >-
  Boundary. The module groups the FlyBase elongation-factor complexes; RNA
  polymerase II is in dmel_nuclear_rna_polymerases. Eaf and Su(Tpl) are members
  of both SEC and LEC, and ear of both SEC and TFIIF, as in FlyBase. P-TEFb is a
  component of SEC in mammals but FlyBase lists it as a separate group, which is
  followed here. The testis-specific PAF1C is modelled as a variant of PAF1C
  because its subunits are testis paralogs of the somatic subunits; Ski8
  (homolog of the PAF1C subunit WDR61/SKIC8) is listed by FlyBase in the testis
  variant. The 7SK snRNA genes have no protein product and are grounded to
  FlyBase gene ids.
