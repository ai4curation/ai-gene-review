module: dmel_nuclear_rna_polymerases
title: Nuclear DNA-directed RNA polymerases I, II and III in Drosophila melanogaster
label: Nuclear RNA polymerases
module_type: PROTEIN_COMPLEX
description: >-
  Eukaryotic nuclei contain three multisubunit DNA-directed RNA polymerases.
  RNA polymerase I transcribes the large ribosomal RNA precursor in the
  nucleolus, RNA polymerase II transcribes mRNAs and most snRNAs and
  microRNA precursors, and RNA polymerase III transcribes tRNAs, 5S rRNA, U6
  snRNA and other short structured RNAs. Each enzyme has two large catalytic
  subunits that form the active site, a set of subunits shared by all three
  enzymes (RPABC1, RPABC2, RPABC3, RPABC4 and RPABC5), subunits shared by Pol I
  and Pol III (RPAC1 and RPAC2), and enzyme-specific subunits.
summary: >-
  RNA polymerases I, II and III, which share five common subunits and
  transcribe rRNA, mRNA and short structured RNAs respectively.
concepts:
