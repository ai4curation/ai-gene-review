notes: >-
  Boundary. The
  common subunits (Polr2E, Polr2F, Polr2H, Polr2K, Polr2L) and the Pol I/III
  subunits (Polr1C, Polr1D) appear in each enzyme they belong to, following the
  FlyBase subgroups. Polr2M (Gdown1 homolog) is listed by FlyBase in RNA
  polymerase II but is an associated factor rather than one of the twelve core
  subunits. Polr2E, Polr2K and Polr3D have no UniProt mapping in the source
  table and are grounded to FlyBase gene ids. Mitochondrial RNA polymerase and
  the general transcription factors are outside the module.
