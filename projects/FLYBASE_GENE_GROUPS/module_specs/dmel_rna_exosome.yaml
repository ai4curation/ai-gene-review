module: dmel_rna_exosome
title: RNA exosome and nuclear exosome targeting complex in Drosophila melanogaster
label: RNA exosome
module_type: PROTEIN_COMPLEX
description: >-
  The RNA exosome is a 3'-5' exoribonuclease complex that processes and degrades
  many classes of RNA in the nucleus and cytoplasm. A catalytically inactive
  nine-subunit barrel, made of a six-subunit ring (including Ski6, Mtr3, Rrp42,
  Rrp45 and Rrp46) capped by Csl4, Rrp4 and Rrp40, channels RNA to the
  processive exonuclease and endonuclease Dis3 (Rrp44). The nuclear exosome
  also contains the distributive exonuclease Rrp6. Nuclear cofactors deliver
  substrates: the nuclear exosome targeting (NEXT) complex, formed by the RNA
  helicase Mtr4, a zinc-knuckle protein (CG4622, ZCCHC8 homolog) and an RRM
  protein (CG11454, RBM7 homolog), targets short-lived non-polyadenylated
  transcripts for decay.
summary: >-
  Nine-subunit exosome barrel with Dis3 and Rrp6 exonucleases, and the NEXT
  complex that targets nuclear transcripts to it.
concepts:
