notes: >-
  Boundary. FlyBase groups the nuclear exosome (RNA-EXO, with Rrp6) and the
  cytoplasmic exosome (RNA-EXOC, without Rrp6); both are captured by the shared
  core and nuclease parts, with Rrp6's nuclear restriction noted. The Ski
  complex, TRAMP and other cytoplasmic and nuclear cofactors have no FlyBase
  group here and are not added. Rrp42 and Rrp45 have no UniProt mapping in the
  source table and are grounded to FlyBase gene ids.
