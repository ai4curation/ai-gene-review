module: dmel_mitochondrial_clpxp
title: Mitochondrial ClpXP protease in Drosophila melanogaster
label: Mitochondrial ClpXP
module_type: PROTEIN_COMPLEX
description: >-
  ClpXP is an ATP-dependent protease of the mitochondrial matrix. Hexameric
  rings of the AAA+ unfoldase ClpX recognise substrates, unfold them and
  thread them into the barrel formed by two heptameric rings of the serine
  peptidase ClpP, where they are degraded. ClpXP contributes to matrix protein
  quality control and to the mitochondrial unfolded protein response.
summary: >-
  ATP-dependent matrix protease made of the ClpX unfoldase and the ClpP
  peptidase.
concepts:
  - {id: GO:0009368, label: endopeptidase Clp complex}
group: CLPXP
roles:
  ClpX: ATP-dependent unfoldase subunit
  ClpP: proteolytic subunit
unit_functions:
  ClpP: {id: GO:0004252, label: serine-type endopeptidase activity}
