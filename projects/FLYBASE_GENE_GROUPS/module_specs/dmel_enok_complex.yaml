module: dmel_enok_complex
title: Enok histone acetyltransferase complex in Drosophila melanogaster
label: Enok complex
module_type: PROTEIN_COMPLEX
description: >-
  Enok (Enoki mushroom) is the Drosophila MOZ/MORF (KAT6) family MYST
  histone acetyltransferase. It forms a complex with the bromodomain-PHD
  scaffold Br140 (BRPF homolog), the ING-family protein Ing5 and Eaf6, the
  same subunit composition as the mammalian MOZ/MORF complexes. Enok
  acetylates histone H3 and was first identified through its requirement for
  mushroom body neuroblast proliferation.
summary: >-
  MOZ/MORF-type complex of the Enok acetyltransferase with Br140, Ing5 and
  Eaf6.
concepts:
  - {id: GO:0070776, label: MOZ/MORF histone acetyltransferase complex}
cellular_components:
  - {id: GO:0000785, label: chromatin}
group: ENOK-C
unit_functions:
  enok: {id: GO:0004402, label: histone acetyltransferase activity}
roles:
  enok: catalytic acetyltransferase subunit
  Br140: bromodomain-PHD scaffold subunit
  Ing5: ING-family histone reader subunit
  Eaf6: Eaf6 subunit
notes: >-
  A small four-subunit complex without known sub-structure; it is decomposed
  one part per subunit.
