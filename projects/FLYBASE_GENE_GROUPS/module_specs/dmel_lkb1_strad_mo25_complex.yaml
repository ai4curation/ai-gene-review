module: dmel_lkb1_strad_mo25_complex
title: LKB1-STRAD-MO25 kinase complex in Drosophila melanogaster
label: LKB1-STRAD-MO25 complex
module_type: PROTEIN_COMPLEX
description: >-
  LKB1 is a serine/threonine kinase that is active only when bound to the
  pseudokinase STRAD (Stlk in Drosophila) and the scaffold MO25. The trimeric
  complex phosphorylates the activation loop of AMPK and of AMPK-related
  kinases such as Par-1, and so acts as a master upstream kinase. In
  Drosophila, Lkb1 is required for anterior-posterior polarity of the oocyte,
  for epithelial polarity under energy stress, and for asymmetric division of
  neuroblasts.
summary: >-
  Heterotrimeric master kinase of AMPK and AMPK-related kinases, formed by the
  kinase Lkb1, the pseudokinase Stlk and the scaffold Mo25.
concepts:
  - {id: GO:1902554, label: serine/threonine protein kinase complex}
group: LKB1C
unit_functions:
  Lkb1: {id: GO:0004674, label: protein serine/threonine kinase activity}
roles:
  Lkb1: catalytic kinase subunit
  Stlk: STRAD pseudokinase activator
  Mo25: MO25 scaffold
notes: >-
  Lkb1 has no UniProt mapping in the FlyBase file and is grounded to its
  FlyBase gene id. No specific GO cellular-component term exists for this
  complex, so it is grounded to the parent serine/threonine protein kinase
  complex term. The activation mechanism is best characterized for the human
  complex.
