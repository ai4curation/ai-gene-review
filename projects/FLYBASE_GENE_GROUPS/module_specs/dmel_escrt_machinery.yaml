module: dmel_escrt_machinery
title: ESCRT machinery in Drosophila melanogaster
label: ESCRT machinery
module_type: PROTEIN_COMPLEX
description: >-
  The endosomal sorting complexes required for transport (ESCRTs) sort
  ubiquitylated membrane proteins into intralumenal vesicles of multivesicular
  bodies and drive membrane scission that buds away from the cytoplasm. ESCRT-0
  (Hrs, Stam) binds ubiquitylated cargo on endosomes; ESCRT-I and ESCRT-II bind
  cargo and membrane and nucleate ESCRT-III, whose subunits polymerize into
  spirals that constrict the bud neck. The AAA ATPase Vps4, with its cofactor
  Vta1, disassembles ESCRT-III and recycles it. The same ESCRT-III and Vps4
  machinery acts in cytokinetic abscission, nuclear envelope sealing and
  membrane repair. In Drosophila, loss of ESCRT function causes accumulation of
  signalling receptors such as Notch on endosomes and neoplastic overgrowth in
  epithelia.
summary: >-
  ESCRT-0, -I, -II and -III with Vps4-Vta1 that sort ubiquitylated cargo into
  multivesicular bodies and drive outward membrane scission.
concepts:
  - {id: GO:0032509, label: endosome transport via multivesicular body sorting pathway}
cellular_components:
  - {id: GO:0010008, label: endosome membrane}
notes: >-
  Decomposition. The five ESCRT subcomplexes are modelled as ordered parts,
  following the sequential recruitment established for the MVB pathway. The
  two ESCRT-I variants that differ in their Vps37 paralog are alternatives.
  Accessory factors such as ALiX are outside the module.
