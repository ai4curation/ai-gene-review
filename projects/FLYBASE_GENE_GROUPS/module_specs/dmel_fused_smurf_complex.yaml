module: dmel_fused_smurf_complex
title: Fused-Smurf ubiquitin ligase complex in Drosophila melanogaster
label: Fused-Smurf complex
module_type: PROTEIN_COMPLEX
description: >-
  The serine/threonine kinase Fused, best known as a Hedgehog pathway
  component, also forms a complex with the HECT-domain E3 ubiquitin ligase
  Smurf. In the Drosophila ovary germline stem cell niche, the Fused-Smurf
  complex promotes ubiquitylation and degradation of the BMP type I receptor
  Thickveins in cells displaced from the niche, sharpening the BMP response
  and allowing stem cell daughters to differentiate.
summary: >-
  Fused kinase and the HECT E3 ligase Smurf, which together downregulate the
  BMP receptor Thickveins.
concepts:
  - {id: GO:0000151, label: ubiquitin ligase complex}
group: FUSF
unit_functions:
  fu: {id: GO:0004674, label: protein serine/threonine kinase activity}
  Smurf: {id: GO:0061630, label: ubiquitin protein ligase activity}
roles:
  fu: Fused serine/threonine kinase
  Smurf: Smurf HECT E3 ubiquitin ligase
notes: >-
  GO has no specific term for the Fused-Smurf complex; the module is grounded
  to the generic ubiquitin ligase complex term. Fused's role in Hedgehog
  signalling is a separate function outside this module.
