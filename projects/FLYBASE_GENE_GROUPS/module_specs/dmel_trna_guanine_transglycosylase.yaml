module: dmel_trna_guanine_transglycosylase
title: tRNA-guanine transglycosylase (queuine insertase) in Drosophila melanogaster
label: tRNA-guanine transglycosylase
module_type: PROTEIN_COMPLEX
description: >-
  Eukaryotic tRNA-guanine transglycosylase exchanges guanine 34 in the anticodon
  of tRNA-Asp, tRNA-Asn, tRNA-His and tRNA-Tyr for queuine, forming queuosine.
  Animals cannot synthesize queuine and obtain it from diet and gut microbes.
  The enzyme is a heterodimer of a catalytic subunit (QTRT1 ortholog, Tgt) and a
  catalytically inactive paralogous accessory subunit (QTRT2 ortholog, CG3434)
  required for activity.
summary: >-
  Tgt-CG3434 heterodimer that inserts salvaged queuine at tRNA position 34.
concepts:
  - {id: GO:0120507, label: tRNA-guanine transglycosylase complex}
processes:
  - {id: GO:0160255, label: tRNA queuosine(34) biosynthetic process from salvaged queuine}
unit_functions:
  Tgt: {id: GO:0008479, label: tRNA-guanosine(34) queuine transglycosylase activity}
roles:
  Tgt: catalytic subunit (QTRT1)
  CG3434: non-catalytic accessory subunit (QTRT2)
notes: >-
  Modelled one part per subunit. Subunit roles are assigned by orthology to
  human QTRT1 and QTRT2; direct biochemical characterization of the Drosophila
  enzyme is limited.
