module: dmel_trapp_complexes
title: TRAPP complexes in Drosophila melanogaster
label: TRAPP complexes
module_type: PROTEIN_COMPLEX
description: >-
  Transport protein particle (TRAPP) complexes are multisubunit guanine
  nucleotide exchange factors for Rab GTPases in the secretory and autophagic
  pathways. A shared core, in which Bet3, Bet5 and Trs23 form the catalytic
  surface for Rab1 nucleotide exchange, is extended with Trs20, Trs31, Trs33
  and the Trs20-like CG9067. Addition of the large subunits Trs120 (SIDL) and
  Trs130 (brunelleschi, brun) forms TRAPPII, which acts at the Golgi and in
  Drosophila is required for male meiotic cytokinesis; addition of Trs85
  (gryzun, gry) and the TRAPPC11, TRAPPC12 and TRAPPC13 homologs forms
  TRAPPIII, which acts in ER-to-Golgi transport and autophagy.
summary: >-
  Rab guanine nucleotide exchange complexes that share a Bet3-Bet5-Trs23
  catalytic core and differ in their TRAPPII- or TRAPPIII-specific large
  subunits.
concepts:
  - {id: GO:0030008, label: TRAPP complex}
notes: >-
  Decomposition. The shared core is split into the FlyBase catalytic core
  group (Bet3, Bet5, Trs23) and the other shared subunits; the complex-specific
  subunits are modelled as alternatives. TRAPPII-specific subunits (SIDL, brun)
  and TRAPPIII-specific subunits (gry, l(3)76BDm, CG11396, CG4953) follow the
  FlyBase TRAPPII and TRAPPIII groups. TRAPPII is reported to activate Rab11
  as well as Rab1 in some systems; that specificity is not resolved for
  Drosophila and is not modelled.
parts:
  - id: trapp_catalytic_core
    label: TRAPP catalytic core
    role: Rab GEF catalytic core
    description: Bet3, Bet5 and Trs23, which form the Rab-binding catalytic surface.
    group: TRAPP-CAT
    function: {id: GO:0005085, label: guanyl-nucleotide exchange factor activity}
  - id: trapp_shared_accessory
    label: Shared TRAPP core subunits
    role: shared core subunits
    description: Core subunits common to TRAPPII and TRAPPIII besides the catalytic Bet3-Bet5-Trs23 unit.
    genes: [Trs20, CG9067, Trs31, Trs33]
  - id: trapp_specific_subunits
    label: Complex-specific TRAPP subunits
    role: TRAPPII or TRAPPIII identity
    variant_sets:
      - id: trapp_complex_variants
        label: TRAPPII or TRAPPIII specific subunits
        selection: ONE_OR_MORE
        variants:
          - id: trappii_specific
            label: TRAPPII-specific subunits
            description: Trs120 (SIDL) and Trs130 (brun).
            genes: [SIDL, brun]
          - id: trappiii_specific
            label: TRAPPIII-specific subunits
            description: Trs85 (gry) and the TRAPPC11, TRAPPC12 and TRAPPC13 homologs.
            genes: [gry, l(3)76BDm, CG11396, CG4953]
