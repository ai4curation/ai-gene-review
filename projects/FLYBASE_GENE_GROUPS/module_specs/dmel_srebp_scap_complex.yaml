module: dmel_srebp_scap_complex
title: SREBP-SCAP complex in Drosophila melanogaster
label: SREBP-SCAP complex
module_type: PROTEIN_COMPLEX
description: >-
  SREBP is a membrane-bound basic helix-loop-helix leucine zipper
  transcription factor held in the endoplasmic reticulum by its escort
  protein SCAP. When lipid levels fall, SCAP carries SREBP to the Golgi, where
  two proteolytic cleavages release the N-terminal transcription factor
  domain, which enters the nucleus and activates genes of lipid synthesis. In
  Drosophila, which cannot make sterols, SREBP processing is controlled by
  phosphatidylethanolamine rather than by sterols, and SREBP mainly regulates
  fatty acid synthesis.
summary: >-
  ER-retained SREBP-SCAP escort complex whose transport to the Golgi releases
  the SREBP transcription factor to activate lipid synthesis genes.
concepts:
  - {id: GO:0032936, label: SREBP-SCAP complex}
group: SREBP-SCAP
roles:
  SREBP: membrane-bound transcription factor
  SCAP: ER-to-Golgi escort and lipid sensor
unit_functions:
  SREBP: {id: GO:0000981, label: "DNA-binding transcription factor activity, RNA polymerase II-specific"}
notes: >-
  The Golgi site-1 and site-2 proteases that release SREBP and the COPII
  machinery are outside the module. No molecular function is assigned to SCAP.
