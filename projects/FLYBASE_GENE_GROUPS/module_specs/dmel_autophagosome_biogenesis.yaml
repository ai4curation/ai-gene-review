module: dmel_autophagosome_biogenesis
title: Autophagosome biogenesis by the core Atg machinery in Drosophila melanogaster
label: Autophagosome biogenesis
module_type: BIOLOGICAL_PROCESS
description: >-
  Macroautophagy begins with formation of a cup-shaped phagophore that expands
  and closes to form the double-membrane autophagosome. The core Atg proteins
  act in conserved functional units. The Atg1 kinase complex (Atg1, Atg13,
  Atg17/FIP200 and Atg101) initiates phagophore formation in response to
  nutrient starvation and TOR inhibition. The class III phosphatidylinositol
  3-kinase complex (Vps34/Pi3K59F, Vps15, Atg6/Beclin 1 and Atg14) produces
  phosphatidylinositol 3-phosphate at the phagophore. Atg9 vesicles supply
  membrane and Atg9 has phospholipid scramblase activity, while Atg2, recruited
  with the PI3P-binding Atg18 proteins, transfers lipids to the expanding
  phagophore. Two ubiquitin-like conjugation systems act downstream: Atg7 and
  Atg10 conjugate Atg12 to Atg5, and the Atg12-Atg5-Atg16 complex promotes
  lipidation of Atg8 proteins with phosphatidylethanolamine by Atg7 and Atg3
  after processing of Atg8 by the Atg4 proteases. In Drosophila, the fat body
  of starved larvae is the classic setting for studying this pathway.
summary: >-
  Core Atg kinase, lipid kinase, lipid transfer and ubiquitin-like conjugation
  units that build the autophagosome.
concepts:
  - {id: GO:0000045, label: autophagosome assembly}
cellular_components:
  - {id: GO:0000407, label: phagophore assembly site}
notes: >-
  Boundary. The module contains the FlyBase core Atg genes and the Atg
  complexes. Pi3K59F and Vps15 enter through the FlyBase autophagy-specific PI3
  kinase complex group; they also act in endosomal PI3K complexes. Atg7 is
  placed in both conjugation systems because it is the E1 enzyme for both
  Atg12 and Atg8. Autophagosome-lysosome fusion (HOPS, SNAREs), cargo receptors
  and upstream TOR signalling are outside the module. The connections give the
  conventional order of action; parts also act partly in parallel.
