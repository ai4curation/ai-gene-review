# Curated FlyBase gene -> UniProtKB choices that override the automatic pick in
# build_group_index.py (Swiss-Prot first, else the longest reference-proteome
# TrEMBL entry). Use this when the GOA annotations, and hence the gene review,
# sit on a different accession than the automatic pick.
- symbol: Nf-YB
  fbgn: FBgn0032816
  accession: Q8ST61
  reason: >-
    GOA rows and the gene review (genes/DROME/Nf-YB) are on Q8ST61; the automatic
    pick Q7KT34 is a newer TrEMBL entry of the same length with no GOA rows.
- symbol: CycK
  fbgn: FBgn0025674
  accession: Q961D1
  reason: >-
    GOA rows and the gene review (genes/DROME/CycK) are on Q961D1; the automatic
    pick A4V104 is a newer TrEMBL entry of the same length with no GOA rows.
- symbol: Lkb1
  fbgn: FBgn0038167
  accession: Q8T9L5
  reason: >-
    GOA rows (43) and the gene review (genes/DROME/Lkb1) are on Q8T9L5, which
    also carries the FlyBase cross-reference; the automatic pick A4V2U8 has
    neither.
