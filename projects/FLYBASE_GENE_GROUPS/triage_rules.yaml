# Curated triage of FlyBase gene groups (FB2026_03) into modules.
#
# Each rule names one or more FlyBase groups by symbol and gives a decision.
# `triage_groups.py` applies the rules to every group in group_index.yaml:
#
#   NEW_MODULE       the group is realized by a new module (modules/<module>.yaml)
#   EXISTING_MODULE  the group is already covered by an existing module
#   UMBRELLA         a category that only collects other groups; its children
#                    carry their own decisions
#   NOT_A_MODULE     the group is not a module (see reason codes below)
#   REGULATOR_SET    "positive/negative regulators of X" lists; the regulators
#                    are context for the pathway module, not parts of it
#
# Groups without a rule inherit from their nearest ruled ancestor: a module
# decision makes the descendant SUBSUMED into the same module, any other decision
# is inherited as is.
#
# Reason codes for NOT_A_MODULE:
#   SEQUENCE_FAMILY   proteins grouped by sequence/domain homology
#   FUNCTIONAL_CLASS  proteins grouped by a shared activity class (enzymes,
#                     transporters, receptors, transcription factors, ...)
#                     rather than by acting together
#   GENE_CLUSTER      genes grouped by genomic location
#   NONCODING_CLASS   tRNA genes and other RNA gene classes
#   SINGLE_GENE       a single-gene group cannot form a module with >= 2 parts

# ---------------------------------------------------------------- umbrellas
- groups: [CHR-MOD-C, REMOD-C, TRXG-C, CATCHR, GTF, TEFC, RABGEF-C,
    AADERMT, AAMET, CARMET, COCAVIT, ENERM, GLYCJM, LIPMET, NEUROME, NTSUB,
    PGASN, SMC-C, MKDC, OXP-AF, ER-SECIN, DYN]
  decision: UMBRELLA
  reason: Category grouping several distinct complexes or pathways; children are triaged individually.

# ------------------------------------------------- family / class umbrellas
- groups: [ENZ, PSENZ]
  decision: NOT_A_MODULE
  reason_code: FUNCTIONAL_CLASS
  reason: Enzyme classification by catalytic activity (EC-like); members do not act together.
- groups: [TMT]
  decision: NOT_A_MODULE
  reason_code: FUNCTIONAL_CLASS
  reason: Transporter and channel classification by transport mechanism and substrate.
- groups: [TM-R, RLIG]
  decision: NOT_A_MODULE
  reason_code: FUNCTIONAL_CLASS
  reason: Receptor or ligand classification; pathway membership is captured by the signaling pathway modules.
- groups: [TFS]
  decision: NOT_A_MODULE
  reason_code: FUNCTIONAL_CLASS
  reason: Transcription factor classification by DNA-binding domain.
- groups: [TRNA]
  decision: NOT_A_MODULE
  reason_code: NONCODING_CLASS
  reason: tRNA gene classes grouped by anticodon.
- groups: [IR-PSD]
  decision: NOT_A_MODULE
  reason_code: SEQUENCE_FAMILY
  reason: Pseudogene family.
- groups: [ESPL-C, HOX-C]
  decision: NOT_A_MODULE
  reason_code: GENE_CLUSTER
  reason: Genes grouped by genomic locus (gene complex), not by a shared molecular unit.
- groups: [14-3-3, 4CSP, ABC-TL, ACBP, ACE, ADAMTSL, ANX, ARID, ARP, BARA, BCL2,
    BRD-F, C1, C19, C2, C26, C48, CBD, CDA, CLECT, CNPY, COMML, CP, CUL, CYT-C,
    EPS8, FBOX, FLO, GH18, GK-L, GLYP, GOLG, HP1, IAP, IKB, IM, LARP,
    M1, M12, M13, M14, M16, M17, M19, M20, M24, M28, M3, M48, M67, MADF-BESS,
    MCO, ML, MLC-CAM, MTERF, MTN, MTX, MUCS, MYO, NOC, NTN, OBP, OBST, OSI, P24,
    PASI, PGRF, PGRP, PHLP, PRELID, PROT, RHOM-L, S1, S81, S9, SANT-MYB, SCRAM,
    SDIC, SKP1, SM-T, SP1-KLF, SPEC, SPN, SPON, SR, SVWC, SYT, TAGLN, TEP, TM2D,
    TM9SF, TRAF, TRF, TSF, TSP, UBL, WASP, WRN, YLW, TIM17RF, DNAPOL-SU, GTF-SU,
    G-SUB, NAA, LSTAU]
  decision: NOT_A_MODULE
  reason_code: SEQUENCE_FAMILY
  reason: Gene family grouped by sequence or domain homology; members do not form one complex or pathway.
- groups: [CSP, HSP, HOLD, HDP, SEL]
  decision: NOT_A_MODULE
  reason_code: FUNCTIONAL_CLASS
  reason: Proteins grouped by a broad activity class (structural proteins, chaperones, host-defence peptides, selenoproteins), not by acting together.
- groups: [GGA, OXA1, ALAMET]
  decision: NOT_A_MODULE
  reason_code: SINGLE_GENE
  reason: Single-gene group; a module needs at least two parts.

