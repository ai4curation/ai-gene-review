<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">What "adaptor activity" means: an extended synaptotagmin bridging two membranes</text>
  <!-- PM -->
  <rect x="40" y="80" width="880" height="26" fill="#e8f1ee" stroke="#56655f"/>
  <text x="50" y="72" font-size="14" font-weight="600" fill="#56655f">plasma membrane</text>
  <g fill="#1d68b3"><circle cx="560" cy="110" r="6"/><circle cx="600" cy="110" r="6"/><circle cx="760" cy="110" r="6"/></g>
  <text x="620" y="138" font-size="12.5" fill="#1d68b3">PI(4,5)P2</text>
  <!-- ER -->
  <rect x="40" y="420" width="880" height="26" fill="#dcefec" stroke="#0e6b66"/>
  <text x="50" y="472" font-size="14" font-weight="600" fill="#0e6b66">ER membrane</text>
  <!-- one ESYT -->
  <path d="M230 446 L245 424 L260 446" stroke="#15201e" stroke-width="4" fill="none"/>
  <text x="262" y="412" font-size="12.5" fill="#56655f">ER hairpin anchor</text>
  <path d="M245 424 L260 360" stroke="#15201e" stroke-width="2" fill="none"/>
  <rect x="240" y="320" width="120" height="40" rx="18" fill="#7657a3" opacity="0.85"/>
  <text x="300" y="345" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">SMP</text>
  <text x="370" y="345" font-size="12.5" fill="#56655f">lipid transfer</text>
  <path d="M340 320 L400 280" stroke="#15201e" stroke-width="2"/>
  <ellipse cx="420" cy="265" rx="30" ry="18" fill="#b8620f"/><text x="420" y="270" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">C2A</text>
  <path d="M446 256 L470 228" stroke="#15201e" stroke-width="2"/>
  <ellipse cx="490" cy="215" rx="30" ry="18" fill="#b8620f"/><text x="490" y="220" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">C2B</text>
  <path d="M512 202 L540 168" stroke="#15201e" stroke-width="2"/>
  <ellipse cx="565" cy="148" rx="30" ry="18" fill="#bd3a30"/><text x="565" y="153" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">C2C</text>
  <text x="600" y="190" font-size="12.5" fill="#56655f">C-terminal C2 binds PM lipid</text>
  <text x="508" y="266" font-size="12.5" fill="#56655f">Ca2+ regulates C2A</text>
  <!-- bracket for adaptor -->
  <path d="M130 106 L120 106 L120 420 L130 420" stroke="#0e6b66" stroke-width="2.5" fill="none"/>
  <text x="108" y="270" font-size="14" font-weight="600" fill="#0e6b66" text-anchor="middle" transform="rotate(-90 108 270)">GO:0160214 adaptor activity</text>
  <!-- families -->
  <g font-size="13" fill="#15201e">
    <rect x="690" y="230" width="230" height="150" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="705" y="254" font-weight="600">SMP + C2 tethers in</text>
    <text x="705" y="280">human ESYT1, ESYT2, ESYT3</text>
    <text x="705" y="304">yeast TCB1, TCB2, TCB3</text>
    <text x="705" y="328">Arabidopsis SYT1, SYT5</text>
    <text x="705" y="360" fill="#56655f" font-size="12">none reviewed in this repo yet</text>
  </g>
  <text x="40" y="505" font-size="12" fill="#56655f">Schematic of textbook E-Syt domain order; distances not to scale; C2 number varies (ESYT2/3 three, ESYT1 five).</text>
</svg>
