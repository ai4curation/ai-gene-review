<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker>
  </defs>
  <!-- tree -->
  <text x="40" y="36" font-size="16" font-weight="600" fill="#0e6b66">A PANTHER family tree</text>
  <g stroke="#8fa39c" stroke-width="2" fill="none">
    <path d="M60 240 H100 V130 H150"/>
    <path d="M100 240 V350 H150"/>
    <path d="M150 130 H180 V90 H250"/><path d="M180 130 V170 H250"/>
    <path d="M150 350 H180 V300 H250"/><path d="M180 350 V400 H250"/><path d="M180 350 V350 H250"/>
  </g>
  <circle cx="60" cy="240" r="7" fill="#0e6b66"/>
  <text x="48" y="268" font-size="12" fill="#0e6b66">root</text>
  <g font-size="12" fill="#15201e">
    <rect x="252" y="80" width="14" height="20" fill="#dcefec" stroke="#0e6b66"/><text x="274" y="95">SF A: enzyme</text>
    <rect x="252" y="160" width="14" height="20" fill="#dcefec" stroke="#0e6b66"/><text x="274" y="175">SF A: enzyme</text>
    <rect x="252" y="290" width="14" height="20" fill="#f6efe6" stroke="#b8620f"/><text x="274" y="305">SF B: catalytic</text>
    <rect x="252" y="340" width="14" height="20" fill="#fbe9e7" stroke="#bd3a30"/><text x="274" y="355">SF B: lost Cys</text>
    <rect x="252" y="390" width="14" height="20" fill="#f6efe6" stroke="#b8620f"/><text x="274" y="405">SF B: catalytic</text>
  </g>
  <text x="40" y="460" font-size="13" fill="#56655f">IBA: a PAINT curator places a term at a node;</text>
  <text x="40" y="478" font-size="13" fill="#56655f">every descendant inherits it.</text>
  <!-- question -->
  <rect x="420" y="40" width="240" height="70" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="540" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#0e6b66">functional_coherence</text>
  <text x="540" y="90" text-anchor="middle" font-size="13" fill="#15201e">is the family uniform enough?</text>
  <path d="M380 240 L415 90" stroke="#56655f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- per-term scope -->
  <text x="540" y="150" text-anchor="middle" font-size="14" fill="#56655f">then, for each GO term assessed: scope =</text>
  <path d="M540 110 V130" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="13">
    <rect x="420" y="170" width="500" height="58" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="1.6"/>
    <text x="436" y="194" font-weight="600" fill="#1d8a4b">FAMILY_WIDE</text><text x="560" y="194" fill="#15201e">safe for all members</text>
    <text x="436" y="215" fill="#56655f">e.g. PTHR10102 phage-type RNA polymerase, GO:0003899</text>
    <rect x="420" y="240" width="500" height="58" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="1.6"/>
    <text x="436" y="264" font-weight="600" fill="#b8620f">SUBFAMILY_ONLY</text><text x="560" y="264" fill="#15201e">only named subfamilies; must not</text>
    <text x="560" y="285" fill="#15201e">descend family-wide</text>
    <rect x="420" y="310" width="500" height="58" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="1.6"/>
    <text x="436" y="334" font-weight="600" fill="#7657a3">RESIDUE_DETERMINED</text><text x="600" y="334" fill="#15201e">decided per member by a curated</text>
    <text x="600" y="355" fill="#15201e">residue site, not subfamily</text>
    <rect x="420" y="380" width="500" height="58" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-width="1.6"/>
    <text x="436" y="404" font-weight="600" fill="#56655f">UNRESOLVED</text><text x="560" y="404" fill="#15201e">investigated but undecided</text>
  </g>
  <text x="420" y="478" font-size="13" fill="#56655f">Scopes from src/ai_gene_review/schema/family_review.yaml</text>
</svg>
