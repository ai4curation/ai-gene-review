<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">ER-phagy: ER-membrane receptors hand ER fragments to the phagophore</text>
  <!-- ER sheet -->
  <rect x="40" y="330" width="360" height="70" rx="35" fill="#e8f1ee" stroke="#8fa39c" stroke-width="3"/>
  <text x="220" y="372" font-size="16" fill="#56655f" text-anchor="middle">ER sheet</text>
  <!-- ER tubules network -->
  <path d="M470 380 L560 330 L660 380 M560 330 L560 250 M660 380 L760 330 L860 380 M760 330 L760 250" fill="none" stroke="#8fa39c" stroke-width="16" stroke-linecap="round"/>
  <path d="M470 380 L560 330 L660 380 M560 330 L560 250 M660 380 L760 330 L860 380 M760 330 L760 250" fill="none" stroke="#e8f1ee" stroke-width="10" stroke-linecap="round"/>
  <text x="665" y="420" font-size="16" fill="#56655f" text-anchor="middle">tubular ER and three-way junctions</text>
  <!-- phagophore cup -->
  <path d="M250 150 A200 90 0 0 1 710 150" fill="none" stroke="#0e6b66" stroke-width="10"/>
  <path d="M250 150 A200 90 0 0 1 710 150" fill="none" stroke="#dcefec" stroke-width="4"/>
  <text x="728" y="118" font-size="16" fill="#0e6b66" font-weight="bold">phagophore membrane</text><text x="728" y="138" font-size="15" fill="#0e6b66">ATG8 family: LC3B, GABARAP</text>
  <!-- ATG8 dots -->
  <g fill="#0e6b66"><circle cx="300" cy="100" r="9"/><circle cx="400" cy="68" r="9"/><circle cx="480" cy="62" r="9"/><circle cx="560" cy="68" r="9"/><circle cx="660" cy="100" r="9"/></g>
  <!-- receptor links (LIR to ATG8) -->
  <g stroke="#1d68b3" stroke-width="3" fill="none" stroke-dasharray="6 4">
    <path d="M120 300 C140 220 250 140 300 109"/>
    <path d="M300 300 C320 220 380 130 400 77"/>
    <path d="M560 315 C540 220 490 120 480 71"/>
    <path d="M745 220 C700 150 600 100 560 77"/>
    <path d="M880 342 C900 220 720 140 668 106"/>
  </g>
  <!-- receptor boxes -->
  <g font-size="15" fill="#15201e">
    <rect x="60" y="300" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="120" y="320" text-anchor="middle">RETREG1</text>
    <rect x="240" y="300" width="120" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="300" y="320" text-anchor="middle">SEC62 · CCPG1</text>
    <rect x="505" y="315" width="110" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="560" y="335" text-anchor="middle">TEX264</text>
    <rect x="705" y="220" width="110" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="760" y="240" text-anchor="middle">RTN3</text>
    <rect x="800" y="342" width="100" height="30" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="850" y="362" text-anchor="middle">ATL3</text>
  </g>
  <!-- legend / machinery -->
  <line x1="40" y1="455" x2="80" y2="455" stroke="#1d68b3" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="90" y="460" font-size="15" fill="#15201e">receptor LC3-interacting region (LIR) binding an ATG8-family protein</text>
  <text x="40" y="484" font-size="15" fill="#56655f">Initiation and membrane supply: ULK1 complex, ATG9A vesicles.</text><text x="40" y="506" font-size="15" fill="#56655f">ER-stress sensors also listed on the project page: ERN1 (IRE1α), EIF2AK3 (PERK).</text>
  </svg>
