<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M5,0 L5,10" stroke="#bd3a30" stroke-width="3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#15201e">C. briggsae sex determination: the reviewed genes and what each one does</text>

  <!-- membrane -->
  <rect x="40" y="96" width="880" height="16" fill="#e8f1ee"/>
  <line x1="40" y1="96" x2="920" y2="96" stroke="#8fa39c" stroke-width="2"/>
  <line x1="40" y1="112" x2="920" y2="112" stroke="#8fa39c" stroke-width="2"/>
  <text x="46" y="88" font-size="11" fill="#56655f">outside</text>
  <text x="46" y="130" font-size="11" fill="#56655f">cytoplasm</text>

  <!-- HER-1 -->
  <circle cx="160" cy="64" r="18" fill="#ffffff" stroke="#8fa39c"/>
  <text x="160" y="68" font-size="11" text-anchor="middle" fill="#15201e">HER-1</text>
  <text x="186" y="52" font-size="10" fill="#56655f">male signal (XO)</text>
  <line x1="178" y1="70" x2="206" y2="90" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#bar)"/>

  <!-- TRA-2 -->
  <rect x="200" y="78" width="120" height="52" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="260" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#15201e">TRA-2</text>
  <text x="260" y="118" font-size="10" text-anchor="middle" fill="#56655f">multi-pass receptor</text>
  <text x="260" y="152" font-size="11" text-anchor="middle" fill="#0e6b66">binds and holds FEM-3</text>
  <text x="260" y="166" font-size="11" text-anchor="middle" fill="#0e6b66">at the membrane</text>

  <!-- FEM complex -->
  <rect x="420" y="170" width="260" height="120" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="550" y="190" font-size="12" text-anchor="middle" fill="#56655f">CUL-2 RING E3 ubiquitin ligase</text>
  <rect x="440" y="204" width="66" height="34" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="473" y="226" font-size="12" text-anchor="middle" fill="#15201e">FEM-1</text>
  <rect x="514" y="204" width="66" height="34" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="547" y="226" font-size="12" text-anchor="middle" fill="#15201e">FEM-2</text>
  <rect x="588" y="204" width="76" height="34" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="626" y="226" font-size="13" font-weight="bold" text-anchor="middle" fill="#15201e">FEM-3</text>
  <text x="550" y="262" font-size="11" text-anchor="middle" fill="#0e6b66">substrate adaptor (GO:1990756)</text>
  <text x="550" y="278" font-size="10" text-anchor="middle" fill="#56655f">fastest-diverging protein in Caenorhabditis</text>
  <line x1="320" y1="124" x2="582" y2="206" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#bar)"/>

  <!-- TRA-1 -->
  <rect x="440" y="360" width="140" height="52" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="510" y="382" font-size="14" font-weight="bold" text-anchor="middle" fill="#15201e">TRA-1</text>
  <text x="510" y="400" font-size="10" text-anchor="middle" fill="#56655f">GLI zinc-finger TF</text>
  <line x1="550" y1="290" x2="514" y2="356" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#bar)"/>
  <text x="560" y="330" font-size="10" fill="#bd3a30">ubiquitinated, degraded</text>
  <line x1="580" y1="386" x2="700" y2="386" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="706" y="382" font-size="12" fill="#15201e">represses male genes</text>
  <text x="706" y="398" font-size="11" fill="#56655f">(ceh-30, dmd-3) → female soma</text>
  <line x1="510" y1="412" x2="510" y2="446" stroke="#15201e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="520" y="438" font-size="11" fill="#56655f">with TRR-1 (Tip60 complex)</text>
  <rect x="470" y="448" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="510" y="468" font-size="12" text-anchor="middle" fill="#15201e">fog-3</text>

  <!-- she-1 -->
  <rect x="120" y="360" width="200" height="60" rx="8" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  <text x="220" y="384" font-size="14" font-weight="bold" text-anchor="middle" fill="#15201e">SHE-1</text>
  <text x="220" y="402" font-size="10" text-anchor="middle" fill="#56655f">F-box; C. briggsae-specific</text>
  <text x="220" y="444" font-size="11" text-anchor="middle" fill="#1d68b3">needed for FOG-3 protein and</text>
  <text x="220" y="458" font-size="11" text-anchor="middle" fill="#1d68b3">XX sperm; targets unknown</text>
  <line x1="320" y1="410" x2="466" y2="460" stroke="#15201e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="600" y="468" font-size="12" fill="#15201e">sperm fate in XX germ line</text>
  <line x1="550" y1="463" x2="594" y2="463" stroke="#15201e" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="24" y="504" font-size="11" fill="#56655f">Teal outline: reviewed gene with experimental annotation. Blue: de-novo review (no prior GO annotations). Red bars: inhibition. Based on the gene reviews' descriptions.</text>
</svg>
