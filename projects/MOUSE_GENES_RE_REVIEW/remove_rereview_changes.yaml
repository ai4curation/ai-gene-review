title: 'Re-review of REMOVE actions in mouse and rat gene reviews: row-level changes'
date: '2026-11-14'
issue: https://github.com/ai4curation/ai-gene-review/issues/4097
base_commit: 70e3fa209
scope:
  review_files:
    mouse: 232
    rat: 220
  remove_rows_at_start: 1098
  bare_protein_binding_rows: 629
  substantive_rows: 469
  reviews_with_substantive_rows: 163
  rows_reactioned: 109
  remove_rows_kept_with_revised_record: 25
  source_defects_recorded: 16
  reviews_edited: 48
  remove_rows_at_end: 989
  retired_rows:
    substantive: 12
    bare_protein_binding: 15
    reactioned: 11
description: 'changes lists every REMOVE row whose review block was edited: rows that moved from REMOVE to another action,
  and rows that stay REMOVE with a corrected reason, a recorded source defect or a recorded no-data case. consistency_followups
  lists rows that were not REMOVE (or are human) but were changed so that related rows agree; they are not counted in scope.
  retained_with_note lists REMOVE rows that were examined closely and left in place; close_call marks judgement calls that
  a curator might decide differently. index is the position of the row in existing_annotations at base_commit; term, evidence_type
  and reference identify the row if the file is re-fetched. A note that names further indexes covers those rows as well. followups
  lists rows outside the scope of this pass that the pass shows to need another look. retired_rows counts REMOVE rows marked
  retired (GOA no longer carries the annotation; all are in rat reviews); they were read like the others and are included
  in the other counts.'
rules:
  same-term-kept: The same term is kept, redirected or left undecided on another row of the review. Rows that share a term
    are judged alike, so the row takes the action of its sibling; a defect in the row's own reference or evidence is recorded
    as a source defect.
  ancestor-of-kept: The removed term is an ancestor of a term kept in the review, so it is true; it is recorded as TOO_GENERAL.
  true-but-broad: The reason conceded that the term is true but broad; it is refined, not removed.
  reason-concedes-truth: The reason for removal conceded that the claim is true. A true claim is kept, as core or non-core.
  lateral-correction: The link between gene and process is real but the term misstates it (participation where the gene product
    regulates, wrong sign, wrong substrate class); it is redirected to the term the evidence supports (MODIFY).
  claim-established: A transfer whose donor annotation comes from an experiment that establishes the claim (checked in the
    donor paper's abstract); kept as non-core.
  ortholog-row-alike: A transfer is judged like its source row in the review of the donor ortholog (kept as non-core, accepted,
    marked or redirected there), unless something specific to the target argues otherwise.
  electronic-unsupported-plausible: A transfer whose donor annotation is experimental and records a real observation, but
    one that over-reads the observation or is of unknown relevance for the target; marked as an over-annotation instead of
    removed.
  promiscuous-activity: A measured secondary enzyme activity handled under the promiscuous-activity tiers.
  experimental-incomplete-evidence: A transfer of an experimental annotation whose paper could not be examined beyond an abstract
    that does not describe the finding; left UNDECIDED.
  downstream-readout: The term describes a downstream consequence of a real phenotype; marked as an over-annotation.
  expression-only: A process annotated from a change in the expression of the gene (IEP and expression-based direct assays);
    marked as an over-annotation.
  observation-over-read: An experimental row that records a real property of the enzyme (dependence of activity on pH, inhibition
    by a compound) as participation in a response; marked as an over-annotation.
  omics-location: A location from a proteomics survey with no positive contradiction; marked as an over-annotation.
  nd-not-stale: A no-data row removed because inferred rows now cover the aspect. No literature on the gene product in this
    species identifies a function in that aspect, so the row follows the evidence-code guideline and is accepted (nd_case
    INFERABLE).
  general-to-specific: A correct but general term is refined to the specific term the evidence supports (MODIFY).
  remove-rereasoned: REMOVE stands; a missing or inaccurate reason was written or corrected, or the no-data case was recorded.
  source-defect-recorded: REMOVE stands and the action is unchanged; the error in the source record that justifies it is recorded
    as a structured source defect.
