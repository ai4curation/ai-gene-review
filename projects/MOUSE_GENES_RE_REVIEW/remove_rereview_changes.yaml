followups:
  human_rows_to_revisit:
  - 'MAP2K4 index 29, neuromuscular junction development (IEA, MARK_AS_OVER_ANNOTATED): the mouse donor row is attached to
    the wrong gene according to the full text.'
  - 'PAX6 index 44, co-SMAD binding (IEA, MARK_AS_OVER_ANNOTATED): the mouse donor paper states that the interaction was not
    validated.'
  - 'GRIA1 index 30, cytosol (IEA, UNDECIDED): the rat donor row was removed after the full text was read.'
  - 'SLC16A1 index 93, identical protein binding (IEA, ACCEPT): the rat donor row was removed as a detergent artifact after
    the full text was read.'
  - 'TARDBP index 44, positive regulation of insulin secretion (IEA, MARK_AS_OVER_ANNOTATED): the rat donor paper does not
    mention TDP-43. Index 47 (UNDECIDED) transfers a row in which TDP-43 is the cargo, not the regulator.'
  - 'ITPR1 index 59 (MARK_AS_OVER_ANNOTATED) and index 81 (KEEP_AS_NON_CORE), both IDA from PMID:16793548: the rat review
    reads that paper as IRBIT inhibiting the IP3 receptor, with IP3R1 as the target.'
  - 'VEGFA index 107, phospholipase C-activating G protein-coupled receptor signaling pathway (IDA, ACCEPT): VEGF receptors
    are receptor tyrosine kinases.'
  - 'SOX2 index 61, miRNA binding (IDA, KEEP_AS_NON_CORE): the mouse review argues that the evidence is regulation of miRNA
    genes, not binding of miRNA.'
  - 'TP53 index 792 (receptor tyrosine kinase binding) and index 850 (protein heterodimerization activity), both IPI and ACCEPT
    with one-line reasons: the abstracts of the cited papers do not describe the interactions, and the mouse transfers are
    now UNDECIDED.'
  - 'SERPINH1 indexes 0, 3 and 19, serine-type endopeptidase inhibitor activity (MARK_AS_OVER_ANNOTATED): the mouse review
    removes the same term because HSP47 has lost inhibitor activity.'
  - 'NOTCH1 index 2, axon guidance (IBA, UNDECIDED): the mouse review removes the same IBA because the seeds are SLIT-family
    genes.'
  - 'PTK7 index 30, cellular response to retinoic acid (IMP, UNDECIDED): the mouse transfers are removed.'
  rat_rows_to_revisit:
  - 'Akt1 indexes 239 and 240, translation (IMP, KEEP_AS_NON_CORE): the review removes gene expression because a kinase performs
    no step of it, and the same argument applies to translation.'
  - 'Ghr index 60 (response to estradiol, KEEP_AS_NON_CORE), index 64 (growth factor binding, KEEP_AS_NON_CORE) and index
    70 (response to cycloheximide, MARK_AS_OVER_ANNOTATED): the human donor rows are no longer in QuickGO, and the mouse review
    removes or redirects its copies.'
  other:
  - Full text is still needed for PMID:23027130 and PMID:10837489 (mouse Trp53), PMID:11584023 (mouse Dnajb11) and PMID:12887892
    (Sirt2).
  - Rows whose reasons describe an error in a source record but carry no structured source defect remain; only the cases established
    here were structured.
