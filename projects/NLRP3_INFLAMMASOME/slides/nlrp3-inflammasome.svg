<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">NLRP3 inflammasome: sensor → adaptor → caspase → outputs</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Filled: gene already has a complete review (NLRP3, CASP4, GSDMD). Outlined: no gene folder yet.</text>

  <!-- Signal 1 priming -->
  <rect x="24" y="84" width="170" height="60" rx="8" fill="#e8f1ee"/>
  <text x="36" y="108" font-size="13" font-weight="bold" fill="#15201e">Signal 1: priming</text>
  <text x="36" y="128" font-size="12" fill="#56655f">NF-κB transcription</text>
  <!-- Signal 2 -->
  <rect x="24" y="160" width="170" height="60" rx="8" fill="#e8f1ee"/>
  <text x="36" y="184" font-size="13" font-weight="bold" fill="#15201e">Signal 2: danger</text>
  <text x="36" y="204" font-size="12" fill="#56655f">diverse stimuli</text>
  <line x1="196" y1="114" x2="238" y2="150" stroke="#1d8a4b" stroke-width="2.5"/>
  <line x1="196" y1="190" x2="238" y2="172" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="244,162 231,158 234,170" fill="#1d8a4b"/>

  <!-- NLRP3 sensor -->
  <rect x="248" y="132" width="120" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="308" y="158" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">NLRP3</text>
  <text x="308" y="176" font-size="11" text-anchor="middle" fill="#56655f">NLR sensor</text>
  <!-- NEK7 / BRCC3 regulators -->
  <rect x="248" y="84" width="56" height="30" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="276" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#15201e">NEK7</text>
  <rect x="312" y="84" width="64" height="30" rx="6" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="344" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#15201e">BRCC3</text>
  <text x="388" y="96" font-size="11" fill="#56655f">licensing cofactor;</text>
  <text x="388" y="110" font-size="11" fill="#56655f">deubiquitinase</text>
  <line x1="308" y1="116" x2="308" y2="128" stroke="#1d8a4b" stroke-width="2.5"/>

  <!-- PYCARD -->
  <line x1="370" y1="160" x2="418" y2="160" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="424,160 412,154 412,166" fill="#1d8a4b"/>
  <text x="397" y="150" font-size="10" text-anchor="middle" fill="#56655f">PYD</text>
  <rect x="426" y="132" width="120" height="56" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="486" y="158" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">PYCARD</text>
  <text x="486" y="176" font-size="11" text-anchor="middle" fill="#56655f">ASC adaptor</text>

  <!-- CASP1 -->
  <line x1="548" y1="160" x2="596" y2="160" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="602,160 590,154 590,166" fill="#1d8a4b"/>
  <text x="575" y="150" font-size="10" text-anchor="middle" fill="#56655f">CARD</text>
  <rect x="604" y="132" width="120" height="56" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="664" y="158" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">CASP1</text>
  <text x="664" y="176" font-size="11" text-anchor="middle" fill="#56655f">effector caspase</text>

  <!-- complex bracket -->
  <path d="M248 204 L248 214 L724 214 L724 204" fill="none" stroke="#8fa39c" stroke-width="2"/>
  <text x="486" y="232" font-size="12" text-anchor="middle" fill="#56655f">canonical inflammasome</text>

  <!-- outputs from CASP1 -->
  <line x1="640" y1="190" x2="560" y2="300" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="556,306 558,292 568,298" fill="#1d8a4b"/>
  <line x1="664" y1="190" x2="664" y2="298" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="664,304 658,292 670,292" fill="#1d8a4b"/>
  <line x1="690" y1="190" x2="790" y2="300" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="794,306 782,300 790,292" fill="#1d8a4b"/>
  <text x="600" y="262" font-size="11" fill="#56655f">cleaves</text>

  <rect x="490" y="308" width="110" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="545" y="336" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">pro-IL1B</text>
  <rect x="614" y="308" width="100" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="664" y="336" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">pro-IL18</text>
  <rect x="740" y="308" width="110" height="44" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="795" y="336" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">GSDMD</text>

  <!-- GSDMD pore -->
  <line x1="795" y1="354" x2="795" y2="396" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="795,402 789,390 801,390" fill="#1d8a4b"/>
  <rect x="690" y="410" width="250" height="20" fill="#e8f1ee"/>
  <line x1="690" y1="410" x2="940" y2="410" stroke="#8fa39c" stroke-width="2"/>
  <line x1="690" y1="430" x2="940" y2="430" stroke="#8fa39c" stroke-width="2"/>
  <rect x="770" y="404" width="12" height="32" fill="#0e6b66"/>
  <rect x="808" y="404" width="12" height="32" fill="#0e6b66"/>
  <text x="795" y="456" font-size="12" text-anchor="middle" fill="#15201e">N-terminal pore in plasma membrane</text>
  <text x="795" y="474" font-size="12" text-anchor="middle" fill="#15201e">→ pyroptosis; IL-1β / IL-18 release</text>
  <line x1="600" y1="352" x2="760" y2="416" stroke="#1d8a4b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- non-canonical -->
  <rect x="24" y="300" width="400" height="120" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
  <text x="40" y="326" font-size="14" font-weight="bold" fill="#7657a3">Non-canonical route</text>
  <rect x="40" y="342" width="90" height="40" rx="6" fill="#dcefec" stroke="#7657a3" stroke-width="2"/>
  <text x="85" y="367" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">CASP4</text>
  <rect x="140" y="342" width="90" height="40" rx="6" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
  <text x="185" y="367" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">CASP5</text>
  <text x="244" y="360" font-size="12" fill="#56655f">CASP4 also cleaves GSDMD</text>
  <text x="40" y="404" font-size="12" fill="#56655f">human inflammatory caspases acting outside the NLRP3 complex</text>
  <path d="M340 345 C 500 260, 640 260, 738 322" fill="none" stroke="#7657a3" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="742,326 729,322 735,313" fill="#7657a3"/>

  <text x="24" y="500" font-size="12" fill="#56655f">Architecture as listed on projects/NLRP3_INFLAMMASOME.md; a draft module, modules/nlr_signaling.yaml, already includes NLRP3, PYCARD and CASP1.</text>
</svg>
