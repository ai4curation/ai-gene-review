<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- outside / cytoplasm labels -->
  <text x="30" y="26" font-size="13" fill="#56655f">outside the cell (hypotonic medium)</text>
  <text x="30" y="500" font-size="13" fill="#56655f">cytoplasm</text>

  <!-- Panel A: filling, not tethered -->
  <text x="40" y="64" font-size="15" font-weight="600" fill="#15201e">1 · Bladder fills with water</text>
  <line x1="30" y1="110" x2="290" y2="110" stroke="#15201e" stroke-width="4"/>
  <ellipse cx="160" cy="290" rx="100" ry="80" fill="#e8f1ee" stroke="#1d68b3" stroke-width="2.5"/>
  <text x="160" y="295" text-anchor="middle" font-size="13" fill="#1d68b3">contractile vacuole</text>
  <path d="M60 420 L100 360" stroke="#1d68b3" stroke-width="2" marker-end="url(#w)"/>
  <path d="M260 420 L222 360" stroke="#1d68b3" stroke-width="2" marker-end="url(#w)"/>
  <text x="160" y="440" text-anchor="middle" font-size="12.5" fill="#56655f">collects excess water from the cytoplasm</text>

  <path d="M300 290 L340 290" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>

  <!-- Panel B: tethered at discharge site -->
  <text x="360" y="64" font-size="15" font-weight="600" fill="#15201e">2 · Tethered at a discharge site</text>
  <line x1="350" y1="110" x2="610" y2="110" stroke="#15201e" stroke-width="4"/>
  <ellipse cx="480" cy="230" rx="100" ry="80" fill="#e8f1ee" stroke="#1d68b3" stroke-width="2.5"/>
  <!-- tethers -->
  <line x1="440" y1="156" x2="440" y2="112" stroke="#0e6b66" stroke-width="5"/>
  <line x1="520" y1="156" x2="520" y2="112" stroke="#0e6b66" stroke-width="5"/>
  <circle cx="440" cy="158" r="8" fill="#0e6b66"/>
  <circle cx="520" cy="158" r="8" fill="#0e6b66"/>
  <text x="480" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#0e6b66">GO:7770067 tether activity</text>
  <text x="480" y="360" text-anchor="middle" font-size="12.5" fill="#56655f">bridges vacuole and plasma membrane</text>
  <text x="480" y="378" text-anchor="middle" font-size="12.5" fill="#56655f">(membrane lipid or membrane protein binding)</text>
  <text x="480" y="410" text-anchor="middle" font-size="13" fill="#0e6b66">Rab8a with the exocyst</text>
  <text x="480" y="428" text-anchor="middle" font-size="12.5" fill="#56655f">(rab8A, PMID:22323285)</text>

  <path d="M620 290 L660 290" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>

  <!-- Panel C: kiss-and-run pore -->
  <text x="680" y="64" font-size="15" font-weight="600" fill="#15201e">3 · Kiss-and-run discharge</text>
  <path d="M670 110 L780 110 M820 110 L930 110" stroke="#15201e" stroke-width="4"/>
  <path d="M780 110 C 780 130, 700 140, 700 210 C 700 280, 900 280, 900 210 C 900 140, 820 130, 820 110" fill="#e8f1ee" stroke="#1d68b3" stroke-width="2.5"/>
  <path d="M800 140 L800 84" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#w)"/>
  <text x="812" y="98" font-size="12.5" fill="#1d68b3">water expelled</text>
  <text x="800" y="310" text-anchor="middle" font-size="12.5" fill="#56655f">transient pore opens; the bladder does not</text>
  <text x="800" y="328" text-anchor="middle" font-size="12.5" fill="#56655f">merge with the plasma membrane,</text>
  <text x="800" y="346" text-anchor="middle" font-size="12.5" fill="#56655f">then detaches and refills</text>

  <!-- process bracket -->
  <rect x="350" y="456" width="580" height="34" rx="8" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="6 4"/>
  <text x="640" y="478" text-anchor="middle" font-size="13" fill="#bd3a30">obsolete GO:0140025 named step 2 as a process; GO now calls it a function</text>
</svg>
