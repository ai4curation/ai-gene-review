<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- branch labels -->
  <text x="40" y="44" font-size="14" font-weight="600" fill="#56655f">BIOLOGICAL PROCESS</text>
  <text x="590" y="44" font-size="14" font-weight="600" fill="#56655f">MOLECULAR FUNCTION</text>
  <line x1="480" y1="30" x2="480" y2="270" stroke="#8fa39c" stroke-dasharray="4 5"/>
  <!-- obsolete BP -->
  <rect x="40" y="96" width="360" height="120" rx="12" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="60" y="124" font-size="13" font-weight="600" fill="#bd3a30">OBSOLETE</text>
  <text x="60" y="154" font-size="20" font-weight="600" fill="#15201e">GO:0140025</text>
  <text x="60" y="180" font-size="15" fill="#15201e">contractile vacuole tethering</text>
  <text x="60" y="200" font-size="15" fill="#15201e">involved in discharge</text>
  <!-- parent MF -->
  <rect x="590" y="60" width="330" height="62" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="610" y="86" font-size="16" font-weight="600" fill="#15201e">GO:0140177</text>
  <text x="610" y="108" font-size="14" fill="#15201e">membrane-membrane adaptor activity</text>
  <path d="M755 150 L755 126" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <text x="765" y="143" font-size="11.5" fill="#56655f">is_a</text>
  <!-- new MF -->
  <rect x="590" y="150" width="330" height="112" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="610" y="176" font-size="13" font-weight="600" fill="#0e6b66">NEW TERM · replacement</text>
  <text x="610" y="204" font-size="20" font-weight="600" fill="#15201e">GO:7770067</text>
  <text x="610" y="230" font-size="14.5" fill="#15201e">contractile vacuole-plasma membrane</text>
  <text x="610" y="246" font-size="14.5" fill="#15201e">tether activity</text>
  <path d="M402 156 C 490 156, 500 200, 586 200" stroke="#0e6b66" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="495" y="146" text-anchor="middle" font-size="12" fill="#0e6b66">PR #31942 adds MF</text>
  <text x="495" y="226" text-anchor="middle" font-size="12" fill="#0e6b66">PR #31950 obsoletes BP</text>
  <!-- rows -->
  <text x="40" y="312" font-size="15" font-weight="600" fill="#15201e">The two dictyBase rows from GO:0140025 (D. discoideum; go-annotation #6387)</text>
  <rect x="40" y="328" width="420" height="104" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="58" y="356" font-size="16" font-weight="600" fill="#15201e">rab8A · P20790 · IMP</text>
  <text x="58" y="380" font-size="13" fill="#56655f">PMID:22323285 (Essid et al. 2012)</text>
  <text x="58" y="400" font-size="13" fill="#56655f">Rab8a GTPase; exocyst-mediated kiss-and-run</text>
  <text x="58" y="420" font-size="13" fill="#0e6b66">cited in the new term's definition</text>
  <rect x="490" y="328" width="430" height="104" rx="10" fill="#ffffff" stroke="#b8620f" stroke-width="1.6"/>
  <text x="508" y="356" font-size="16" font-weight="600" fill="#15201e">p2xA · Q86JM7 · IMP</text>
  <text x="508" y="380" font-size="13" fill="#56655f">PMID:24335649</text>
  <text x="508" y="400" font-size="13" fill="#56655f">P2X receptor: a cation channel</text>
  <text x="508" y="420" font-size="13" fill="#b8620f">check the paper before accepting a tether MF</text>
  <text x="40" y="478" font-size="13" fill="#56655f">No InterPro2GO, UniProt keyword or UniRule mappings to GO:0140025. Neither gene is reviewed in this repo.</text>
  <text x="40" y="498" font-size="13" fill="#56655f">QuickGO (2026-10-04): the two dictyBase IMP rows now use GO:7770067.</text>
</svg>
