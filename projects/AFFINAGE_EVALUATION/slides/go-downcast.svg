<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8fa39c"/></marker>
<marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#bd3a30"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b8620f"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">Where the GO layer lands, relative to the curated core function</text>
<!-- root -->
<rect x="380" y="56" width="200" height="40" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="480" y="81" font-size="14" text-anchor="middle" fill="#15201e">catalytic activity</text>
<!-- parents -->
<rect x="60" y="150" width="300" height="52" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2.5"/>
<text x="210" y="173" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">oxidoreductase activity</text>
<text x="210" y="192" font-size="12" text-anchor="middle" fill="#56655f">GO:0016491 (Affinage for GPX4, ACADM)</text>
<rect x="600" y="150" width="310" height="52" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2.5"/>
<text x="755" y="173" font-size="14" text-anchor="middle" fill="#15201e" font-weight="bold">catalytic activity, acting on a protein</text>
<text x="755" y="192" font-size="12" text-anchor="middle" fill="#56655f">GO:0140096 (off-bin for SOD1, LDHA)</text>
<line x1="230" y1="150" x2="420" y2="98" stroke="#8fa39c" stroke-width="2" marker-end="url(#u)"/>
<line x1="740" y1="150" x2="540" y2="98" stroke="#8fa39c" stroke-width="2" marker-end="url(#u)"/>
<!-- dots -->
<text x="210" y="248" font-size="22" text-anchor="middle" fill="#8fa39c">⋮</text>
<line x1="210" y1="290" x2="210" y2="206" stroke="#8fa39c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#u)"/>
<!-- leaves -->
<rect x="30" y="292" width="360" height="52" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="210" y="314" font-size="13" text-anchor="middle" fill="#15201e" font-weight="bold">phospholipid-hydroperoxide glutathione peroxidase</text>
<text x="210" y="333" font-size="12" text-anchor="middle" fill="#56655f">GO:0047066, GPX4 curated core MF</text>
<rect x="30" y="356" width="360" height="52" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="210" y="378" font-size="13" text-anchor="middle" fill="#15201e" font-weight="bold">medium-chain fatty acyl-CoA dehydrogenase</text>
<text x="210" y="397" font-size="12" text-anchor="middle" fill="#56655f">GO:0070991, ACADM curated core MF</text>
<!-- wrong branch -->
<rect x="600" y="292" width="310" height="52" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="755" y="314" font-size="13" text-anchor="middle" fill="#15201e" font-weight="bold">superoxide dismutase activity</text>
<text x="755" y="333" font-size="12" text-anchor="middle" fill="#56655f">SOD1 curated core MF (an oxidoreductase)</text>
<path d="M600,318 C520,300 470,230 362,190" fill="none" stroke="#8fa39c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#u)"/>
<path d="M755,292 L755,206" fill="none" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#x)"/>
<text x="765" y="255" font-size="16" fill="#bd3a30" font-weight="bold">✗ not an ancestor</text>
<text x="400" y="248" font-size="12" fill="#56655f">true is_a path</text>
<!-- legend -->
<rect x="30" y="440" width="18" height="14" fill="#ffffff" stroke="#b8620f" stroke-width="2.5"/>
<text x="56" y="452" font-size="13" fill="#15201e">Mode 1, general parent: true but uninformative (dominant pattern)</text>
<rect x="30" y="466" width="18" height="14" fill="#ffffff" stroke="#bd3a30" stroke-width="2.5"/>
<text x="56" y="478" font-size="13" fill="#15201e">Mode 4, wrong branch: even ancestor-aware scoring counts it wrong (also FASN, GSK3B → acting on DNA; OTC → ligase)</text>
<rect x="30" y="492" width="18" height="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="56" y="504" font-size="13" fill="#15201e">AIGR core_functions term</text>
</svg>
