<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0e6b66"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1d68b3"/></marker>
  </defs>
  <!-- membrane -->
  <rect x="40" y="340" width="520" height="70" fill="#f1ece0" stroke="#b8a77a"/>
  <text x="415" y="430" font-size="12" fill="#56655f">inner mitochondrial membrane</text>
  <text x="50" y="330" font-size="12" fill="#56655f">matrix</text>
  <!-- SDHC / SDHD in membrane -->
  <rect x="200" y="330" width="90" height="90" rx="12" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="245" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">SDHC</text>
  <text x="245" y="384" text-anchor="middle" font-size="11" fill="#56655f">heme b</text>
  <rect x="300" y="330" width="90" height="90" rx="12" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="345" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">SDHD</text>
  <text x="345" y="384" text-anchor="middle" font-size="11" fill="#56655f">anchor</text>
  <circle cx="295" cy="404" r="11" fill="#fbf1e6" stroke="#b8620f"/>
  <text x="295" y="408" text-anchor="middle" font-size="11" fill="#b8620f">Q</text>
  <!-- SDHB -->
  <rect x="215" y="220" width="160" height="96" rx="12" fill="#e8f1ee" stroke="#0e6b66"/>
  <text x="295" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">SDHB</text>
  <text x="295" y="268" text-anchor="middle" font-size="11" fill="#56655f">Fe–S relay</text>
  <text x="295" y="286" text-anchor="middle" font-size="11" fill="#56655f">2Fe-2S · 4Fe-4S · 3Fe-4S</text>
  <!-- SDHA -->
  <rect x="215" y="70" width="160" height="130" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="295" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">SDHA</text>
  <text x="295" y="120" text-anchor="middle" font-size="11" fill="#56655f">flavoprotein · FAD</text>
  <text x="295" y="150" text-anchor="middle" font-size="12" fill="#15201e">succinate → fumarate</text>
  <text x="295" y="170" text-anchor="middle" font-size="11" fill="#56655f">(half-reaction)</text>
  <!-- electron path -->
  <path d="M295 200 L295 218" stroke="#b8620f" stroke-width="2.5"/>
  <path d="M295 316 L295 392" stroke="#b8620f" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="120" y="275" font-size="12" fill="#b8620f">e⁻ path</text>
  <path d="M160 272 L212 272" stroke="#b8620f" stroke-width="1.2"/>
  <!-- complex outline -->
  <rect x="190" y="55" width="215" height="380" rx="18" fill="none" stroke="#0e6b66" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="297" y="46" text-anchor="middle" font-size="13" fill="#0e6b66">complex II</text>
  <!-- right side: GO relations -->
  <g transform="translate(600 60)">
    <rect width="320" height="92" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="1.8"/>
    <text x="160" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0e6b66">GO:0008177</text>
    <text x="160" y="48" text-anchor="middle" font-size="13" fill="#15201e">succinate dehydrogenase (quinone)</text>
    <text x="160" y="72" text-anchor="middle" font-size="12" fill="#56655f">succinate + quinone → fumarate + quinol</text>
  </g>
  <g transform="translate(600 300)">
    <rect width="320" height="92" rx="10" fill="#ffffff" stroke="#1d68b3" stroke-width="1.8"/>
    <text x="160" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1d68b3">GO:0000104</text>
    <text x="160" y="48" text-anchor="middle" font-size="13" fill="#15201e">succinate dehydrogenase activity</text>
    <text x="160" y="72" text-anchor="middle" font-size="12" fill="#56655f">succinate + acceptor → fumarate (parent)</text>
  </g>
  <path d="M760 152 L760 296" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="770" y="230" font-size="12" fill="#56655f">is_a</text>
  <path d="M407 150 L596 110" stroke="#0e6b66" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="430" y="86" font-size="13" font-weight="600" fill="#0e6b66">each subunit:</text>
  <text x="430" y="104" font-size="13" fill="#0e6b66">contributes_to</text>
  <path d="M377 150 Q500 300 596 340" stroke="#1d68b3" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#b)"/>
  <text x="510" y="232" font-size="13" font-weight="600" fill="#1d68b3">SDHA only:</text>
  <text x="510" y="250" font-size="13" fill="#1d68b3">enables? (open)</text>
  <text x="600" y="450" font-size="13" fill="#15201e">Only the assembled complex does the</text>
  <text x="600" y="468" font-size="13" fill="#15201e">quinone-coupled reaction, so no subunit</text>
  <text x="600" y="486" font-size="13" fill="#15201e"><tspan font-weight="600">enables</tspan> GO:0008177 on its own.</text>
</svg>
