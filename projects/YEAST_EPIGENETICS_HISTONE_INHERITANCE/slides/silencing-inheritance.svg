<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- LEFT: SIR silencing loop -->
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#15201e">1  Writing a silent state (HML/HMR, telomeres)</text>
  <text x="24" y="54" font-size="13" fill="#56655f">Deacetylation creates the SIR3 binding site, recruiting more SIR2</text>

  <!-- DNA with nucleosomes -->
  <line x1="30" y1="250" x2="450" y2="250" stroke="#15201e" stroke-width="3"/>
  <rect x="40" y="236" width="52" height="28" rx="4" fill="#15201e"/>
  <text x="66" y="255" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">silencer</text>
  <g fill="#e8f1ee" stroke="#56655f" stroke-width="1.5">
    <ellipse cx="140" cy="250" rx="26" ry="20"/><ellipse cx="210" cy="250" rx="26" ry="20"/>
    <ellipse cx="280" cy="250" rx="26" ry="20"/><ellipse cx="350" cy="250" rx="26" ry="20"/>
    <ellipse cx="420" cy="250" rx="26" ry="20"/>
  </g>
  <text x="140" y="254" font-size="10" text-anchor="middle" fill="#15201e">K16</text>
  <text x="210" y="254" font-size="10" text-anchor="middle" fill="#15201e">K16</text>
  <text x="280" y="254" font-size="10" text-anchor="middle" fill="#15201e">K16</text>
  <text x="350" y="254" font-size="10" text-anchor="middle" fill="#bd3a30" font-weight="bold">K16ac</text>
  <text x="420" y="254" font-size="10" text-anchor="middle" fill="#bd3a30" font-weight="bold">K16ac</text>

  <!-- ORC1 at silencer -->
  <rect x="34" y="176" width="64" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="66" y="196" font-size="13" text-anchor="middle" fill="#0e6b66" font-weight="bold">ORC1</text>
  <line x1="66" y1="206" x2="66" y2="234" stroke="#0e6b66" stroke-width="1.5"/>

  <!-- SIR complex on nucleosomes -->
  <rect x="112" y="150" width="200" height="58" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="212" y="172" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">SIR2 · SIR3 · SIR4</text>
  <text x="212" y="192" font-size="12" text-anchor="middle" fill="#15201e">SIR3 binds unacetylated H4 tails</text>
  <line x1="98" y1="190" x2="112" y2="186" stroke="#0e6b66" stroke-width="1.5" marker-end="url(#arA)"/>

  <!-- spreading arrow -->
  <path d="M 312 178 C 345 150, 370 175, 355 222" fill="none" stroke="#0e6b66" stroke-width="2" marker-end="url(#arA)"/>
  <text x="356" y="148" font-size="12" fill="#0e6b66" font-weight="bold">SIR2 (NAD+) removes</text>
  <text x="356" y="163" font-size="12" fill="#0e6b66" font-weight="bold">H4K16ac → spreading</text>

  <!-- SAS2 opposing -->
  <rect x="360" y="318" width="120" height="30" rx="6" fill="#fbe9e7" stroke="#bd3a30" stroke-width="1.5"/>
  <text x="420" y="338" font-size="13" text-anchor="middle" fill="#bd3a30" font-weight="bold">SAS2 (H4K16ac)</text>
  <line x1="410" y1="318" x2="415" y2="274" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#arR)"/>
  <text x="250" y="376" font-size="12" fill="#56655f" text-anchor="middle">Acetylation by SAS2 and methylation by DOT1 (H3K79)</text>
  <text x="250" y="392" font-size="12" fill="#56655f" text-anchor="middle">and SET1 (H3K4) mark euchromatin and limit SIR spreading</text>

  <text x="140" y="290" font-size="12" fill="#15201e" text-anchor="middle">silent</text>
  <text x="455" y="296" font-size="12" fill="#15201e" text-anchor="middle">active</text>

  <!-- divider -->
  <line x1="490" y1="70" x2="490" y2="490" stroke="#8fa39c" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: replication fork -->
  <text x="510" y="34" font-size="19" font-weight="bold" fill="#15201e">2  Passing it on at the fork</text>
  <text x="510" y="54" font-size="13" fill="#56655f">Old histones are recycled; new ones are acetylated and deposited</text>

  <!-- parental duplex -->
  <line x1="520" y1="245" x2="690" y2="245" stroke="#15201e" stroke-width="3"/>
  <g fill="#e8f1ee" stroke="#56655f" stroke-width="1.5">
    <ellipse cx="560" cy="245" rx="22" ry="17"/><ellipse cx="625" cy="245" rx="22" ry="17"/>
  </g>
  <text x="592" y="282" font-size="12" text-anchor="middle" fill="#56655f">parental chromatin</text>
  <!-- fork arms -->
  <path d="M 690 245 L 930 150" stroke="#15201e" stroke-width="3" fill="none"/>
  <path d="M 690 245 L 930 340" stroke="#15201e" stroke-width="3" fill="none"/>
  <g fill="#e8f1ee" stroke="#56655f" stroke-width="1.5">
    <ellipse cx="860" cy="178" rx="22" ry="17"/><ellipse cx="860" cy="312" rx="22" ry="17"/>
  </g>
  <g fill="#e7f0fa" stroke="#1d68b3" stroke-width="1.5">
    <ellipse cx="780" cy="210" rx="20" ry="15"/><ellipse cx="780" cy="280" rx="20" ry="15"/>
  </g>

  <!-- FACT -->
  <rect x="660" y="120" width="130" height="50" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="725" y="141" font-size="14" text-anchor="middle" fill="#0e6b66" font-weight="bold">FACT</text>
  <text x="725" y="159" font-size="12" text-anchor="middle" fill="#15201e">SPT16 · POB3</text>
  <path d="M 640 228 C 650 180, 690 175, 700 170" fill="none" stroke="#0e6b66" stroke-width="2" marker-end="url(#arA)"/>
  <path d="M 790 150 C 830 150, 850 155, 856 160" fill="none" stroke="#0e6b66" stroke-width="2" marker-end="url(#arA)"/>
  <text x="725" y="104" font-size="12" text-anchor="middle" fill="#0e6b66">recycles parental histones</text>

  <!-- new histone path -->
  <rect x="520" y="370" width="110" height="46" rx="8" fill="#e7f0fa" stroke="#1d68b3" stroke-width="1.5"/>
  <text x="575" y="390" font-size="13" text-anchor="middle" fill="#1d68b3" font-weight="bold">new H3–H4</text>
  <text x="575" y="406" font-size="12" text-anchor="middle" fill="#15201e">+ ASF1</text>
  <line x1="630" y1="393" x2="668" y2="393" stroke="#15201e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="670" y="370" width="110" height="46" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="725" y="390" font-size="13" text-anchor="middle" fill="#0e6b66" font-weight="bold">RTT109</text>
  <text x="725" y="406" font-size="12" text-anchor="middle" fill="#15201e">acetylates H3K56</text>
  <line x1="780" y1="393" x2="798" y2="393" stroke="#15201e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="800" y="370" width="150" height="46" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="875" y="390" font-size="13" text-anchor="middle" fill="#bd3a30" font-weight="bold">CAF-1</text>
  <text x="875" y="406" font-size="12" text-anchor="middle" fill="#15201e">deposits (not reviewed)</text>
  <path d="M 875 370 C 875 330, 820 300, 800 288" fill="none" stroke="#1d68b3" stroke-width="2" marker-end="url(#ar)"/>

  <!-- legend -->
  <rect x="24" y="470" width="14" height="14" rx="3" fill="#dcefec" stroke="#0e6b66"/>
  <text x="44" y="482" font-size="12" fill="#15201e">reviewed in this project</text>
  <rect x="210" y="470" width="14" height="14" rx="3" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="3 2"/>
  <text x="230" y="482" font-size="12" fill="#15201e">not yet reviewed (CAF-1 = RLF2/CAC1, CAC2, MSI1)</text>
  <ellipse cx="560" cy="477" rx="10" ry="8" fill="#e8f1ee" stroke="#56655f"/>
  <text x="576" y="482" font-size="12" fill="#15201e">parental nucleosome</text>
  <ellipse cx="730" cy="477" rx="10" ry="8" fill="#e7f0fa" stroke="#1d68b3"/>
  <text x="746" y="482" font-size="12" fill="#15201e">new nucleosome</text>
</svg>
