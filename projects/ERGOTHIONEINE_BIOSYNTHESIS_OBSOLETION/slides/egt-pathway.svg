<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">Two routes, one product: both now annotate to GO:0052699</text>
  <!-- shared start -->
  <g font-size="14" fill="#15201e">
    <rect x="30" y="220" width="110" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="85" y="247" text-anchor="middle">L-histidine</text>
    <rect x="200" y="220" width="120" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="260" y="247" text-anchor="middle">hercynine</text>
    <!-- bacterial top -->
    <rect x="390" y="96" width="200" height="54" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="490" y="118" text-anchor="middle" font-size="13">γ-glutamyl-hercynyl-</text><text x="490" y="136" text-anchor="middle" font-size="13">cysteine sulfoxide</text>
    <!-- shared intermediate -->
    <rect x="630" y="220" width="170" height="54" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="715" y="242" text-anchor="middle" font-size="13">hercynylcysteine</text><text x="715" y="260" text-anchor="middle" font-size="13">sulfoxide</text>
    <rect x="820" y="330" width="120" height="44" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/><text x="880" y="357" text-anchor="middle" font-weight="600">ergothioneine</text>
  </g>
  <g stroke="#15201e" stroke-width="1.8" fill="none">
    <path d="M140 242 L196 242" marker-end="url(#a)"/>
    <path d="M320 232 C 360 180, 370 130, 386 124" marker-end="url(#a)"/>
    <path d="M590 124 C 640 130, 700 170, 712 216" marker-end="url(#a)"/>
    <path d="M320 252 C 420 320, 560 300, 626 256" marker-end="url(#a)" stroke="#7657a3"/>
    <path d="M760 276 C 800 300, 840 310, 868 326" marker-end="url(#a)"/>
  </g>
  <!-- enzyme labels bacterial -->
  <g font-size="13" font-weight="600" fill="#1d68b3">
    <text x="130" y="210">EgtD</text>
    <text x="345" y="160" text-anchor="end">EgtB</text>
    <text x="700" y="160">EgtC</text>
    <text x="775" y="318" text-anchor="end">EgtE</text>
  </g>
  <g font-size="11.5" fill="#56655f">
    <text x="118" y="286">3 × SAM</text>
    <text x="345" y="176" text-anchor="end">+ γ-Glu-Cys, O2</text>
    <text x="700" y="176">− Glu</text>
    <text x="775" y="334" text-anchor="end">PLP, C–S lysis</text>
  </g>
  <!-- fungal -->
  <text x="420" y="318" font-size="13" font-weight="600" fill="#7657a3">Egt1 (+ Cys, O2)</text>
  <text x="420" y="334" font-size="11.5" fill="#56655f">fungal Egt1 also does the His methylation</text>
  <text x="880" y="398" font-size="13" font-weight="600" fill="#7657a3" text-anchor="middle">Egt2 (fungal lyase)</text>
  <!-- term labels -->
  <rect x="380" y="58" width="220" height="24" rx="4" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="5 3"/>
  <text x="490" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#bd3a30">GO:0052704 · bacterial route</text>
  <rect x="380" y="350" width="220" height="24" rx="4" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="5 3"/>
  <text x="490" y="367" text-anchor="middle" font-size="12" font-weight="600" fill="#bd3a30">GO:0140479 · fungal route</text>
  <!-- legend -->
  <g font-size="13" fill="#15201e">
    <text x="40" y="440" font-weight="600">May 2026 GO:0052704 rows (IDA, PMID:20420449, UniProt)</text>
    <text x="40" y="464" fill="#56655f">M. smegmatis mc(2)155: egtD A0R5M8 · egtB A0R5N0 · egtC A0R5M9 · egtE A0R5M7</text>
    <text x="40" y="488" fill="#56655f">plus ~2,247 May 2026 IEA rows (GO_REF:0000108) re-inferred to GO:0052699</text>
  </g>
</svg>
