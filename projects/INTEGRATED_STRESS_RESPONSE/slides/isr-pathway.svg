<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">The integrated stress response: four sensors, one switch</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Filled: gene already reviewed (EIF2AK3, OMA1, EIF2B4, ATF4, ATF3). Outlined: no gene folder yet.</text>

  <!-- stresses -->
  <g font-size="12" fill="#56655f">
    <text x="24" y="98">mitochondrial stress</text>
    <text x="24" y="178">heme deficiency</text>
    <text x="24" y="244">viral dsRNA</text>
    <text x="24" y="310">ER stress</text>
    <text x="24" y="376">amino acid starvation</text>
  </g>
  <!-- OMA1 / DELE1 -->
  <rect x="150" y="80" width="70" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="185" y="100" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">OMA1</text>
  <line x1="222" y1="95" x2="244" y2="95" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="250,95 238,89 238,101" fill="#1d8a4b"/>
  <text x="236" y="76" font-size="10" text-anchor="middle" fill="#56655f">cleaves</text>
  <rect x="252" y="80" width="70" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="287" y="100" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">DELE1</text>
  <path d="M322 100 C 345 115, 350 150, 352 160" fill="none" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="352,166 346,154 358,155" fill="#1d8a4b"/>

  <!-- kinases -->
  <g font-size="14" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="290" y="168" width="130" height="36" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="355" y="191">EIF2AK1 (HRI)</text>
    <rect x="290" y="226" width="130" height="36" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="355" y="249">EIF2AK2 (PKR)</text>
    <rect x="290" y="292" width="130" height="36" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="355" y="315">EIF2AK3 (PERK)</text>
    <rect x="290" y="358" width="130" height="36" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="355" y="381">EIF2AK4 (GCN2)</text>
  </g>
  <g stroke="#8fa39c" stroke-width="1.5">
    <line x1="140" y1="174" x2="286" y2="186"/>
    <line x1="110" y1="240" x2="286" y2="244"/>
    <line x1="90" y1="306" x2="286" y2="310"/>
    <line x1="150" y1="372" x2="286" y2="376"/>
  </g>

  <!-- converge to eIF2a -->
  <g stroke="#1d8a4b" stroke-width="2.5" fill="none">
    <path d="M422 186 C 470 200, 480 260, 500 270"/>
    <path d="M422 244 L 496 272"/>
    <path d="M422 310 L 496 284"/>
    <path d="M422 376 C 470 360, 480 300, 500 290"/>
  </g>
  <rect x="504" y="256" width="110" height="46" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="559" y="278" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">EIF2S1</text>
  <text x="559" y="294" font-size="11" text-anchor="middle" fill="#56655f">eIF2α-P (Ser51)</text>
  <text x="459" y="226" font-size="11" text-anchor="middle" fill="#56655f">phosphorylate</text>

  <!-- phosphatases -->
  <rect x="490" y="370" width="150" height="46" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="565" y="390" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">PPP1R15A / B</text>
  <text x="565" y="406" font-size="11" text-anchor="middle" fill="#56655f">GADD34 / CReP + PP1</text>
  <line x1="559" y1="368" x2="559" y2="306" stroke="#bd3a30" stroke-width="3"/>
  <line x1="548" y1="306" x2="570" y2="306" stroke="#bd3a30" stroke-width="3"/>
  <text x="575" y="344" font-size="11" fill="#56655f">dephosphorylate</text>

  <!-- eIF2B inhibited -->
  <line x1="559" y1="254" x2="559" y2="196" stroke="#bd3a30" stroke-width="3"/>
  <line x1="548" y1="196" x2="570" y2="196" stroke="#bd3a30" stroke-width="3"/>
  <rect x="490" y="140" width="190" height="52" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="585" y="160" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">eIF2B (EIF2B1–5)</text>
  <text x="585" y="178" font-size="11" text-anchor="middle" fill="#56655f">GEF; EIF2B4 reviewed</text>
  <text x="700" y="160" font-size="11" fill="#56655f">vanishing white</text>
  <text x="700" y="174" font-size="11" fill="#56655f">matter disease</text>
  <text x="585" y="122" font-size="12" text-anchor="middle" fill="#15201e">→ global translation falls</text>
  <text x="700" y="198" font-size="11" fill="#56655f">ISRIB acts here</text>

  <!-- ATF4 -->
  <line x1="616" y1="279" x2="690" y2="279" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="696,279 684,273 684,285" fill="#1d8a4b"/>
  <text x="655" y="270" font-size="10" text-anchor="middle" fill="#56655f">selective</text><text x="655" y="295" font-size="10" text-anchor="middle" fill="#56655f">translation</text>
  <rect x="698" y="256" width="100" height="46" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="748" y="284" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">ATF4</text>

  <!-- targets -->
  <line x1="748" y1="304" x2="748" y2="340" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="748,346 742,334 754,334" fill="#1d8a4b"/>
  <rect x="670" y="348" width="80" height="32" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="710" y="369" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">DDIT3</text>
  <rect x="756" y="348" width="70" height="32" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="791" y="369" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">ATF3</text>
  <rect x="832" y="348" width="70" height="32" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="867" y="369" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">ASNS</text>
  <text x="828" y="400" font-size="11" text-anchor="middle" fill="#56655f">targets (DDIT3 = CHOP)</text>
  <!-- feedback GADD34 -->
  <path d="M700 380 C 690 440, 620 450, 600 420" fill="none" stroke="#1d8a4b" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="598,416 596,429 606,424" fill="#1d8a4b"/>
  <text x="640" y="462" font-size="11" fill="#56655f">negative feedback (GADD34)</text>

  <text x="24" y="500" font-size="12" fill="#56655f">Architecture as listed on projects/INTEGRATED_STRESS_RESPONSE.md.</text>
</svg>
