<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#56655f"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">One review loop, many predictors</text>
<text x="30" y="70" font-size="14" font-weight="bold" fill="#56655f">PREDICTION SOURCE</text>
<g font-size="14" fill="#15201e">
<rect x="30" y="84" width="230" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="46" y="106" font-weight="bold">BioReason-Pro / GO-GPT</text><text x="46" y="123" font-size="11" fill="#56655f">reasoning LLM; 139 genes</text>
<rect x="30" y="140" width="230" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="46" y="162" font-weight="bold">ProtNLM2</text><text x="46" y="179" font-size="11" fill="#56655f">protein language model; 242 targets</text>
<rect x="30" y="196" width="230" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="46" y="218" font-weight="bold">DeepECTransformer</text><text x="46" y="235" font-size="11" fill="#56655f">EC numbers; 7 E. coli genes</text>
<rect x="30" y="252" width="230" height="46" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="46" y="274" font-weight="bold">Affinage</text><text x="46" y="291" font-size="11" fill="#56655f">literature narrative + GO; 42 genes</text>
<rect x="30" y="318" width="230" height="46" rx="6" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="5 3"/><text x="46" y="340" font-weight="bold">TreeGrafter</text><text x="46" y="357" font-size="11" fill="#56655f">PANTHER graft; 1,074 IEA rows</text>
<rect x="30" y="374" width="230" height="46" rx="6" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="5 3"/><text x="46" y="396" font-weight="bold">InterPro2GO, PAINT/IBA, ARBA</text><text x="46" y="413" font-size="11" fill="#56655f">mappings and rules behind GOA</text>
</g>
<text x="30" y="450" font-size="12" fill="#56655f">solid: new ML/agent methods</text>
<text x="30" y="468" font-size="12" fill="#56655f">dashed: transfer pipelines already in GOA</text>
<g stroke="#56655f" stroke-width="1.6" fill="none">
<path d="M260,107 C300,107 310,250 356,250"/><path d="M260,163 C300,163 310,250 356,250"/><path d="M260,219 C300,219 310,250 356,250"/><path d="M260,275 C300,275 310,250 356,250"/><path d="M260,341 C300,341 310,250 356,250"/><path d="M260,397 C300,397 310,250 356,250" marker-end="url(#a)"/>
</g>
<text x="360" y="70" font-size="14" font-weight="bold" fill="#56655f">CLAIM-BY-CLAIM REVIEW</text>
<rect x="360" y="190" width="250" height="120" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="485" y="222" font-size="16" text-anchor="middle" font-weight="bold" fill="#15201e">Agent compares each claim</text>
<text x="485" y="244" font-size="13" text-anchor="middle" fill="#56655f">with the gene's AIGR review,</text>
<text x="485" y="262" font-size="13" text-anchor="middle" fill="#56655f">its references and GOA</text>
<rect x="360" y="340" width="250" height="70" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="485" y="368" font-size="13" text-anchor="middle" fill="#15201e" font-weight="bold">Reference = gene review</text>
<text x="485" y="388" font-size="12" text-anchor="middle" fill="#56655f">mixed maturity, not expert-signed</text>
<line x1="485" y1="340" x2="485" y2="314" stroke="#56655f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="610" y1="250" x2="668" y2="250" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="70" font-size="14" font-weight="bold" fill="#56655f">VERDICT PER CLAIM</text>
<g font-size="13">
<rect x="670" y="86" width="260" height="34" rx="5" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/><text x="684" y="108" fill="#15201e"><tspan font-weight="bold" fill="#1d68b3">COR</tspan>  correct and novel</text>
<rect x="670" y="126" width="260" height="34" rx="5" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/><text x="684" y="148" fill="#15201e"><tspan font-weight="bold" fill="#1d8a4b">CNN</tspan>  correct, already known</text>
<rect x="670" y="166" width="260" height="34" rx="5" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="684" y="188" fill="#15201e"><tspan font-weight="bold" fill="#b8620f">LSP</tspan>  less precise than known</text>
<rect x="670" y="206" width="260" height="34" rx="5" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/><text x="684" y="228" fill="#15201e"><tspan font-weight="bold" fill="#56655f">UNC</tspan>  cannot confirm or refute</text>
<rect x="670" y="246" width="260" height="34" rx="5" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/><text x="684" y="268" fill="#15201e"><tspan font-weight="bold" fill="#bd3a30">NPI</tspan>  refuted by evidence</text>
<rect x="670" y="286" width="260" height="34" rx="5" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/><text x="684" y="308" fill="#15201e"><tspan font-weight="bold" fill="#bd3a30">PLI</tspan>  wrong paralog subfamily</text>
<rect x="670" y="326" width="260" height="34" rx="5" fill="#ffffff" stroke="#7657a3" stroke-width="2"/><text x="684" y="348" fill="#15201e"><tspan font-weight="bold" fill="#7657a3">REP</tspan>  frequency-biased repeat</text>
</g>
<text x="670" y="392" font-size="12" fill="#56655f">Taxonomy: de Crécy-Lagard et al. 2025</text>
<text x="670" y="408" font-size="12" fill="#56655f">(PMID:40703034). Affinage and transfer</text>
<text x="670" y="424" font-size="12" fill="#56655f">pipelines use exact-id match or AIGR</text>
<text x="670" y="440" font-size="12" fill="#56655f">actions (ACCEPT, REMOVE, ...) instead.</text>
</svg>
