  name:
    name: Poly(ADP-ribose) polymerase catalytic domain
    short: PARP
  description:
  - text: <p>Poly(ADP-ribose) polymerase catalyses the covalent attachment of ADP-ribose
      units from NAD+ to itself and to a limited number of other DNA binding proteins,
      which decreases their affinity for DNA. Poly(ADP-ribose) polymerase is a regulatory
      component induced by DNA damage. The carboxyl-terminal region is the most highly
      conserved region of the protein. Experiments have shown that a carboxyl 40 kDa
      fragment is still catalytically active [[cite:PUB00002784]].</p>
