  name:
    name: DUS3L CCCH zinc finger domain
    short: zf-CCCH_DUS3L
  description:
  - text: <p>This CCCH zinc finger domain is found in the mRNA-dihydrouridine synthase
      DUS3L and related proteins. DUS3L catalyzes the synthesis of dihydrouridine,
      a modified base, in various RNAs, such as tRNAs, mRNAs and some long non-coding
      RNAs (lncRNAs) [[cite:PUB00100733]]. It mainly modifies the uridine in position
      47 (U47) in the D-loop of most cytoplasmic tRNAs [[cite:PUB00100733]]. This
      domain is frequently found in tandem.</p>
