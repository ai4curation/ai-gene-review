  name:
    name: XgeA-like, catalytic GH16 domain
    short: GH16_XgeA
  description:
  - text: <p>This domain is found at the N-terminal end of Endo-1,3(4) -beta-glucanase
      xgeA from Emericella nidulans and similar proteins predominantly from fungi.
      XgeA is a mixed-linked glucanase involved in the degradation of complex natural
      cellulosic substrates [[cite:PUB00079200]]. This domain shows a classical sandwich-like
      beta-jelly roll fold, formed by two main, closely packed and curved antiparallel
      beta-sheets that create a deep channel harbouring the catalytic machinery. It
      belongs to the glycosyl hydrolases family 16 (GH16).</p>
