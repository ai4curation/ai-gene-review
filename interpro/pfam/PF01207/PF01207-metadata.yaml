  name:
    name: Dihydrouridine synthase (Dus)
    short: Dus
  description:
  - text: <p>Members of this family catalyse the reduction of the 5,6-double bond
      of a uridine residue on tRNA.  Dihydrouridine modification of tRNA is widely
      observed in prokaryotes and eukaryotes, and also in some archae.  Most dihydrouridines
      are found in the D loop of t-RNAs.  The role of dihydrouridine in tRNA is currently
      unknown, but may increase conformational flexibility of the tRNA. It is likely
      that different family members have different substrate specificities, which
      may overlap.  Dus 1 ([swissprot:Q9HGN6]) from Saccharomyces cerevisiae acts
      on pre-tRNA-Phe, while Dus 2 ([swissprot:P53720]) acts on pre-tRNA-Tyr and pre-tRNA-Leu.  Dus
      1 is active as a single subunit, requiring NADPH or NADH, and is stimulated
      by the presence of FAD [[cite:PUB00014304]].  Some family members may be targeted
      to the mitochondria and even have a role in mitochondria [[cite:PUB00014304]].</p>
