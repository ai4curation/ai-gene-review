    name: WGR domain
    short: WGR
  description:
  - text: <p>This domain is found in a variety of polyA polymerases as well as the
      E. coli molybdate metabolism regulator [swissprot:P33345] and other proteins
      of unknown function. I have called this domain WGR after the most conserved
      central motif of the domain. The domain is found in isolation in proteins such
      as [swissprot:Q9JN21] and is between 70 and 80 residues in length. I propose
      that this may be a nucleic acid binding domain.</p>
