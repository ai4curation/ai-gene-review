  name:
    name: Calcyclin-binding Protein, CS domain
    short: CS_CacyBP
  description:
  - text: <p>This CS p23-like domain is found in the CacyBP/SIP protein (S100A6 binding
      protein and Siah-1 interacting protein) [[cite:PUB00035462]]. CacyBP/SIP interacts
      with S100A6 (calcyclin), with some other members of the S100 family, with tubulin,
      and with Siah-1 and Skp-1 [[cite:PUB00087818]]. The latter two are components
      of the ubiquitin ligase that regulates beta-catenin degradation. The beta-catenin
      gene is an oncogene participating in tumorigenesis in many different cancers.
      Overexpression of CacyBP/SIP, in part through its effect on the expression of
      beta-catenin, inhibits the proliferation, tumorigenicity, and invasion of gastric
      cancer cells [[cite:PUB00088087]]. CacyBP/SIP is abundant in neurons and neuroblastoma
      NB2a cells. An extensive re-organization of microtubules accompanies the differentiation
      of NB2a cells. CacyBP/SIP may contribute to NB2a cell differentiation through
      binding to and increasing the oligomerization of tubulin. CacyBP/SIP is also
      implicated in differentiation of erythroid cells, rat neonatal cardiomyocytes,
      in mouse endometrial events, and in thymocyte development [[cite:PUB00087819]].</p>
