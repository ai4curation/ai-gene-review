family_id: PANTHER:PTHR28090
family_name: PROTEIN ROT1
preferred_name: Rot1 ER protein-folding chaperones
summary: >-
  PTHR28090 contains fungal Rot1 proteins, conserved single-pass ER membrane
  factors that support folding and glycoprotein maturation of
  secretory-pathway clients. S. cerevisiae Rot1 is the experimental anchor:
  it localizes to the ER membrane, has antiaggregation activity, stabilizes
  ERAD-prone secretory clients, and functionally connects with Ost3-dependent
  N-glycosylation. C. albicans ROT1 has direct complementation and conditional
  repression evidence that preserves the same ER glycoprotein-maturation theme.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed representatives are in PTHR28090:SF1 and share a short fungal
  Rot1 architecture with a luminal domain and C-terminal transmembrane helix.
  PAINT places ER membrane and de novo folding on the Dikarya Rot1 node and
  buds/apical-growth only on the Saccharomycetales descendant node, matching
  the reviewed S. pombe versus budding-yeast/Candida scope.
