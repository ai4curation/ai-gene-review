notes: >-
  PTHR28090 is a compact Rot1 family. The current SGD-seeded GO:0051082
  unfolded-protein-binding row in the yeast GOA file is stale relative to the
  PAINT cache: PTN001999053 retains only ER membrane and de novo protein
  folding. Curators should represent the conserved Rot1 molecular function as
  protein folding chaperone while treating bud growth, actin polarity, and wall
  assembly as downstream fungal outcomes.
