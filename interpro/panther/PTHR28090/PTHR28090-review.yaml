  node_taxon:
    id: NCBITaxon:451864
    label: Dikarya
  assessment: SOUND
  assessment_reason: >-
    PTN001999053 correctly places the conserved Rot1 ER folding process at the
    fungal Rot1 node. The S. cerevisiae seed supports Rot1 antiaggregation and
