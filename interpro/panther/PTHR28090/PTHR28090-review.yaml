    shown to complement S. cerevisiae rot1 when its CTG codon is corrected and
    to be needed for ER glycoprotein maturation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28090/PTHR28090-paint.tsv
    supporting_text: "PTHR28090\tPTN001999053\tGO:0006458\tP\tIBD\tfalse\tSGD:S000004813\ttaxon:451864\t20170228"
  - reference_id: PMID:18508919
    supporting_text: >-
      Recombinant Rot1 exhibited antiaggregation activity in vitro, which was
      partly impaired by a temperature-sensitive rot1-2 mutation.
  - reference_id: PMID:42042339
    supporting_text: >-
      These results confirm that orf19.6029 encodes a functional homolog of
      Rot1 and that correct decoding of the CTG codon is essential for CaRot1
      activity in S. cerevisiae.
- node_id: PANTHER:PTN001999057
  asserted_term:
    id: GO:0007118
    label: budding cell apical bud growth
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: SGD:S000004813
  node_taxon:
    id: NCBITaxon:4892
    label: Saccharomycetales
  assessment: SOUND
  assessment_reason: >-
    The node is deliberately narrower than the Dikarya ER-folding node and
    does not propagate to S. pombe. It is acceptable for budding-yeast and
    Candida Rot1 descendants, where it should be interpreted as a downstream,
    non-core morphogenesis consequence of Rot1-dependent ER and wall
    maturation rather than as Rot1's primary activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28090/PTHR28090-paint.tsv
    supporting_text: "PTHR28090\tPTN001999057\tGO:0007118\tP\tIBD\tfalse\tSGD:S000004813\ttaxon:4892\t20170228"
  - reference_id: PMID:17606994
    supporting_text: >-
      First, it is required for the maintenance of apical growth during bud
      growth.
  - reference_id: PMID:42042339
    supporting_text: >-
      The rot1Δ/TRpROT1 mutant failed to form filaments under doxycycline
      repression, although residual hyphae were visible when grown on Spider
      medium.
term_assessments:
- assessed_term:
    id: GO:0044183
    label: protein folding chaperone
  scope: FAMILY_WIDE
  scope_reason: >-
    GO:0044183 is a better molecular-function term for fungal Rot1 proteins
    than the older obsolete GO:0051082 unfolded protein binding row that still
    appears in the yeast GOA file. The term follows from direct S. cerevisiae
    antiaggregation assays, S. cerevisiae client-maturation evidence, and
    target-specific C. albicans ER-stress and N-glycosylation phenotypes.
  supported_by:
  - reference_id: PMID:18508919
    supporting_text: >-
      Recombinant Rot1 exhibited antiaggregation activity in vitro, which was
      partly impaired by a temperature-sensitive rot1-2 mutation.
  - reference_id: PMID:42042339
    supporting_text: >-
      These results demonstrate that Rot1 depletion increases susceptibility to
      ER stress, consistent with a role as an ER chaperone.
