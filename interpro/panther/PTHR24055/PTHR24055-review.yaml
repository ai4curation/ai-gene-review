family_id: PANTHER:PTHR24055
family_name: MITOGEN-ACTIVATED PROTEIN KINASE
preferred_name: Fungal MAP kinases and related CMGC kinases
summary: >-
  PTHR24055 is a broad CMGC-kinase PANTHER family that contains classical MAP
  kinases, p38/Hog1 stress MAPKs, Fus3/Kss1/Spk1 pheromone and development
  MAPKs, fungal Mpk1/Pmk1-type cell-wall-integrity MAPKs, CDKs, ICK/MAK/NLK
  relatives, and animal or plant ERK/JNK/p38 branches. This fungal-scope
  review covers the experimentally grounded PTHR24055 nodes for conserved MAPK
  kinase chemistry, HOG/Sty1 stress MAPK signaling, and fungal Fus3/Spk1-family
  pheromone or development MAPK signaling.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Serine/threonine kinase chemistry is broadly shared across PTHR24055, but the
  family spans many MAPK and CMGC kinase branches with different upstream
  activators, substrates, cellular programs, and in some cases distinct kinase
  classes. PAINT terms for osmosensing, oxidative stress, fungal
  pheromone-response signaling, and cell-cycle control therefore need to remain
  on the fungal descendant nodes where the experimental seeds sit rather than
  moving to the whole family.
