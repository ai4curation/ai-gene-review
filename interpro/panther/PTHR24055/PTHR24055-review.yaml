notes: >-
  This update replaces the earlier cucumber/ARGO50 target-level placeholder
  with a fungal PAINT-node review. It consolidates the completed fungal MAPK
  gene reviews and intentionally leaves the PTHR24055 CDK, ICK/MAK/NLK,
  animal ERK/JNK/p38, plant MPK and ciliary branches unassessed here. The
  fungal PTN001172579 cell-cycle rows are outside the MAPK branches re-reviewed
  in this tranche and should be checked with the relevant fungal CDK-like
  kinases before being marked SOUND or moved. The prior CUCME/A0A1S3BTE3
  target and plant MPK-family scope were de-scoped by this fungal review and
  need their own plant-focused reassessment. PAINT currently lacks GO:0004707
  IBD rows for the PTN001172058 Hog1/Sty1 and PTN001172087 Fus3/Spk1 nodes even
  though experimentally characterized HOG1, FUS3, and sty1 descendants support
  exact MAP kinase activity; those two fungal MAPK nodes are candidates for new
  GO:0004707 IBD placement.
