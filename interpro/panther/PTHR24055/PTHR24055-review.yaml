term_assessments:
- assessed_term:
    id: GO:0004707
    label: MAP kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    MAP kinase activity is sound at the reviewed fungal PTN001171896
    cell-wall-integrity node, but that is the only GO:0004707 IBD row in the
    cached PTHR24055 PAINT slice. PTN001172058 Hog1/Sty1 and PTN001172087
    Fus3/Spk1 also have experimental exact MAP-kinase-activity support in
    their descendants and are candidate nodes for additional GO:0004707 IBDs,
    while PTHR24055 as a whole contains CDKs and other CMGC kinases that make
    a family-wide GO:0004707 rule unsafe.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24055/PTHR24055-paint.tsv
    supporting_text: "PTHR24055\tPTN001171896\tGO:0004707\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0007231
    label: osmosensory signaling pathway
  scope: UNRESOLVED
  scope_reason: >-
    Osmosensory signaling is sound for PTN001172058 Hog1/Sty1 stress MAPKs and
    out of scope for Fus3/Spk1, Mpk1/Pmk1, CDK and animal ERK/JNK branches.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24055/PTHR24055-paint.tsv
    supporting_text: "PTHR24055\tPTN001172058\tGO:0007231\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0071507
    label: pheromone response MAPK cascade
  scope: UNRESOLVED
  scope_reason: >-
    Pheromone-response MAPK cascade is sound for PTN001172087, but that
    Dikarya node is a narrow Fus3/Spk1 branch and not a term for the whole
    PTHR24055 family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24055/PTHR24055-paint.tsv
    supporting_text: "PTHR24055\tPTN001172087\tGO:0071507\tP\tIBD\tfalse"
