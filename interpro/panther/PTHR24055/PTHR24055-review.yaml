family_id: PANTHER:PTHR24055
family_name: MITOGEN-ACTIVATED PROTEIN KINASE
preferred_name: MAP kinases and related CMGC kinases
summary: MAPK-related proteins include classical ERK, JNK, p38/Hog1 and plant MAPKs alongside other CMGC
  branches such as NLK-related kinases. They share phosphorylation chemistry but differ in activation
  systems and substrates.
functional_coherence: HETEROGENEOUS
coherence_reason: For the cucumber target, kinase-domain and MAPK placement support a protein-phosphorylation
  comparison. Animal growth-factor pathways and fungal osmotic-stress pathways are not interchangeable
  with plant MAPK functions. Resolve the relevant plant paralog before transferring a named signaling
  pathway.
