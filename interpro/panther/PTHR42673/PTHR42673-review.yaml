- node_id: PANTHER:PTN000137159
  asserted_term:
    id: GO:0005739
    label: mitochondrion
  evidence: IBD
  paint_snapshot: '20241121'
  seeds:
  - id: MGI:MGI:1341859
    gene_symbol: Gstz1
    organism: Mus musculus
  - id: RGD:1589363
    gene_symbol: Gstz1
    organism: Rattus norvegicus
  - id: UniProtKB:O43708
    gene_symbol: GSTZ1
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is not the family root but it is deeper than the evidence: the IBA reaches
    Drosophila GstZ2, C. elegans gst-42, Dictyostelium mai and the Aspergillus MaiA
    proteins (O43123, Q4WHT7), whereas Arabidopsis GSTZ1 and the bacterial members do
    not receive it. The three seeds are all mammalian GSTZ1/Gstz1, and for them the
    evidence is solid (immunodetection, LC-MS/MS identification and submitochondrial
    fractionation place active GSTZ1 in the matrix of human and rat liver mitochondria,
    alongside the larger cytosolic pool). No localization data exist for the fungal,
    amoebozoan, insect or nematode members, so whether this dual distribution is
    ancestral to the whole clade or a mammalian feature cannot be decided from available
    evidence. This matches the gene-level decisions: human GSTZ1, which has its own IDA,
    keeps the term as a genuine secondary location (KEEP_AS_NON_CORE), and A. nidulans
    MaiA marks the inherited IBA MARK_AS_OVER_ANNOTATED, because no fungal localization
    data exist and the mammalian mitochondrial pool is minor.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
    supporting_text: "PTHR42673\tPTN000137159\tGO:0005739\tC\tIBD\tfalse"
  - reference_id: PMID:20884751
    supporting_text: >-
      Immunoreactive GSTZ1 was detected in liver mitochondria from humans and rats, and
      its identity was confirmed by liquid chromatography/tandem mass spectrometry
  - reference_id: file:genes/human/GSTZ1/GSTZ1-ai-review.yaml
    supporting_text: >-
      Mitochondrial localisation is experimentally supported (submitochondrial
      fractionation places GSTZ1 in the matrix; PMID:20884751), but the enzyme is
      predominantly cytosolic and its core function is exerted in the cytosol.
  - reference_id: file:genes/EMENI/maiA/maiA-ai-review.yaml
    supporting_text: >-
      I found no localization data for A. nidulans MaiA or other fungal MAAIs
term_assessments:
- assessed_term:
    id: GO:0016034
    label: maleylacetoacetate isomerase activity
  scope: UNRESOLVED
  scope_reason: >-
    Safe for the eukaryotic GSTZ1/MAAI clade and for the bacterial MaiA-type members, and
    demonstrably wrong for Ralstonia NagL (maleylpyruvate isomerase, GO:0050077 by IDA)
    and unsupported for E. coli YfcF and YibF. Because those members share subfamilies
    with genuine MAAI (NagL and YfcF are in SF21 with HmgC and the Pseudomonas and Vibrio
    MaiA proteins; YibF is in SF4 with human GSTZ1), the applicability cannot be scoped by
    subfamily and the scope is recorded as unresolved rather than forced into
    SUBFAMILY_ONLY. A member-level decision is needed, driven by whether the organism runs
    a homogentisate pathway and whether the protein has an assayed substrate.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
    supporting_text: "PTHR42673\tPTN001344486\tGO:0016034\tF\tIBD\tfalse"
  - reference_id: PMID:11133965
    supporting_text: >-
      NagL is a reduced glutathione-dependent maleylpyruvate isomerase catalyzing the
      isomerization of maleylpyruvate to fumarylpyruvate
- assessed_term:
    id: GO:0004364
    label: glutathione transferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Directly measured for E. coli YfcF and for human GSTZ1, so the activity is real at
    both ends of the family, but weak toward classical conjugation substrates in both,
    and untested for most members. For the dedicated isomerases glutathione is a
    regenerated cofactor, so a net transferase reaction is not established by the
    isomerase chemistry alone. The term is reasonable wherever an assay exists and should
    be read as capability rather than physiological role elsewhere.
  supported_by:
  - reference_id: PMID:17018556
    supporting_text: >-
      the GST-like YfcF and YfcG proteins have low but significant GSH-conjugating
      activity toward 1-chloro-2,4-dinitorobenzene and GSH-dependent peroxidase activity
      toward cumene hydroperoxide
  - reference_id: file:genes/human/GSTZ1/GSTZ1-ai-review.yaml
    supporting_text: >-
      Conjugating activity toward classical GST substrates (CDNB-type) is minimal, but the
      glutathione-dependent dehalogenation/oxygenation of dichloroacetate to glyoxylate
- assessed_term:
    id: GO:0006749
    label: glutathione metabolic process
  scope: UNRESOLVED
  scope_reason: >-
    Applies where glutathione is consumed as a cosubstrate (conjugation and
    dehalogenation by YfcF and GSTZ1) and is doubtful where it is a catalytic cofactor
    regenerated each cycle, which is the isomerase reaction shared by most members. The
    propagated term is kept in GOA but reviewed as non-core (human GSTZ1) or as an
    over-annotation (P. putida HmgC, A. nidulans MaiA) at gene level.
  supported_by:
  - reference_id: PMID:18824004
    supporting_text: >-
      glutathione is a true cofactor rather than a substrate in the reaction
  - reference_id: file:genes/PSEPK/hmgC/hmgC-ai-review.yaml
    supporting_text: >-
      Glutathione is a catalytic cofactor for maleylacetoacetate isomerization,
      regenerated in each turnover rather than consumed; that cofactor
      requirement does not make HmgC part of glutathione biosynthesis,
      degradation, or homeostasis.
