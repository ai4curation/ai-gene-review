  assessment: SOUND
  assessment_reason: >-
    The node is the family root, and the seeds bracket it: human GSTZ1 (IDA) and E. coli
    YfcF (IDA) sit on opposite sides of the tree and both have directly measured
    glutathione-conjugating activity, so placing the capability at the root is
    well supported rather than over-deep. Two caveats belong with the term rather than
    with the placement. The measured activity is weak in both anchors (minimal with
    ethacrynic acid and NBD-Cl for GSTZ1; about 1% of GstA with CDNB for YfcF), and in
    the dedicated isomerase members the structural work on NagL shows glutathione acting
    as a regenerated cofactor rather than as a transfer cosubstrate. A gene review that
    marks this IBA as an over-annotation for an unassayed isomerase such as P. putida
    HmgC is therefore judging the physiological reading of the term, not disputing the
    node.
