  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The seeds are exclusively eukaryotic maleylacetoacetate isomerases, and the term is
    correct for them and for the bacterial MaiA-type members that inherit it
    (P. putida HmgC, P. aeruginosa MaiA, V. cholerae MaiA, S. meliloti MaiA), so moving
    the node is not the right fix. Two descendant branches should not carry it. Ralstonia
    NagL has its own experimental annotation to GO:0050077 maleylpyruvate isomerase
    activity: its substrate is 3-maleylpyruvate from the gentisate pathway, not
    maleylacetoacetate, and it nonetheless receives GO:0016034 by PANTHER propagation
    (via PTN001680166). E. coli YfcF, itself a seed for the sibling GO:0004364 row,
    receives GO:0016034 although its characterized activities are GSH conjugation and
    GSH peroxidase and E. coli has no homogentisate ring-cleavage pathway; E. coli YibF
    (SF4) receives it while remaining uncharacterized. Because these members sit inside
    subfamilies that also contain genuine MAAI, the correction is per-branch IRDs rather
    than a subfamily-level restriction, and affected_subfamilies is deliberately left
    empty.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
    supporting_text: "PTHR42673\tPTN001344486\tGO:0016034\tF\tIBD\tfalse"
  - reference_id: PMID:11133965
