  seeds:
  - id: FB:FBgn0037696
    gene_symbol: GstZ2
    organism: Drosophila melanogaster
  - id: FB:FBgn0037697
    gene_symbol: GstZ1
    organism: Drosophila melanogaster
  - id: UniProtKB:O43708
    gene_symbol: GSTZ1
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    Every member binds glutathione, so the placement at the family root is not the
    questionable part; what is questionable is what the term asserts. In the isomerase
    reaction glutathione is regenerated in each turnover rather than consumed, which is
    cofactor use rather than participation in glutathione metabolism, and gene reviews
    for the isomerase members (P. putida HmgC, A. nidulans MaiA) therefore treat the
    propagated term as an over-annotation. For the conjugation-competent members (E. coli YfcF, and human GSTZ1
    acting on dichloroacetate) glutathione is consumed and the term is defensible. The
    row cannot be settled by moving the node; it needs a decision about the term, which
    is recorded in term_assessments below.
