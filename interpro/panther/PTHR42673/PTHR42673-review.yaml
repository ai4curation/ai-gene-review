family_id: PANTHER:PTHR42673
family_name: MALEYLACETOACETATE ISOMERASE
preferred_name: >-
  Zeta-class glutathione transferases (maleylacetoacetate isomerase, bacterial MaiA,
  maleylpyruvate isomerase NagL, E. coli YfcF)
summary: >-
  Zeta class of the cytosolic glutathione transferase (GST) superfamily. Members share
  the canonical GST fold (thioredoxin-like N-terminal G-site plus all-helical C-terminal
  domain) and bind glutathione, but they use it in two different ways. In the best
  characterized members glutathione is a catalytic cofactor that is regenerated rather
  than consumed, supporting cis-trans isomerization of a ring-cleavage product: human
  GSTZ1/MAAI and its orthologues isomerize 4-maleylacetoacetate to 4-fumarylacetoacetate
  in the homogentisate branch of phenylalanine/tyrosine catabolism, and the bacterial
  MaiA-type enzymes (including P. putida HmgC) catalyse the same reaction in the
  bacterial homogentisate pathway. Ralstonia NagL performs the analogous isomerization of
  3-maleylpyruvate to 3-fumarylpyruvate in the gentisate branch of naphthalene
  catabolism. Other members are conventional, if weak, conjugating enzymes: E. coli YfcF
  has measured GSH-conjugating and GSH-peroxidase activity and contributes to hydrogen
  peroxide resistance, while E. coli YibF remains uncharacterized. Human GSTZ1
  additionally performs the glutathione-dependent dehalogenation of dichloroacetate, the
  reaction that makes it pharmacologically important.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glutathione-dependent catalysis on a zeta-class GST scaffold is shared family-wide, and
  maleylacetoacetate isomerase activity holds for the eukaryotic and rhizobial members of
  SF4 and for the MaiA-type members of SF21. The identified exceptions are
  substrate-level rather than fold-level and they fall inside, not between, the PANTHER
  subfamilies: SF21 contains both bona fide maleylacetoacetate isomerases (P. putida
  HmgC, P. aeruginosa MaiA, V. cholerae MaiA) and two members that are not MAAI at all
  (Ralstonia NagL, an experimentally demonstrated maleylpyruvate isomerase of the
  gentisate pathway, and E. coli YfcF, an oxidative-stress GST with measured conjugating
  and peroxidase activity and no reported MAAI activity), while SF4 contains the
  uncharacterized E. coli YibF. Because the divergent members do not segregate by
  subfamily, substrate-specific terms cannot be scoped by SF accession here.
