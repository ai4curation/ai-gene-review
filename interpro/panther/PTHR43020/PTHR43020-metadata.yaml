  name:
    name: tRNA-2-methylthio-N(6)-dimethylallyladenosine synthase
    short: tRNA_MiaB
  description:
  - text: The MiaB family proteins are involved in the post-transcriptional modification
      of transfer RNA (tRNA). They catalyze the methylthiolation of specific adenosine
      residues within tRNA molecules, which is crucial for the proper functioning
      of the tRNA during protein synthesis. Specifically, these enzymes modify N6-(dimethylallyl)adenosine
      (i(6)A) to form 2-methylthio-N6-(dimethylallyl)adenosine (ms(2)i(6)A) at position
      37, adjacent to the anticodon in certain tRNAs that read codons beginning with
      uridine. This modification is essential for the accuracy and efficiency of protein
      translation by the ribosome. The MiaB family is part of the larger methylthiotransferase
      superfamily, which is characterized by the presence of a radical S-adenosylmethionine
      (SAM) domain, indicating a common mechanism of action involving radical-mediated
      chemistry for the thiomethylation process.
