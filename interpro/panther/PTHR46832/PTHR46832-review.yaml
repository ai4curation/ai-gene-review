  scope: UNRESOLVED
  scope_reason: E. coli Pfs is a directly supported positive and SF1 is the canonical Pfs/MTAN lineage.
    SF2 MqnB has different primary chemistry, but absent secondary SAH/MTA activity has not been demonstrated
    for every member. Production SUBFAMILY_ONLY would enforce a negative on all other subfamilies, so
    the inherited exclusionary scope is withdrawn rather than manufacture that negative. Use source-qualified
    Pfs representatives.
