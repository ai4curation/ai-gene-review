  - reference_id: file:analysis/module_audits/bacterial_methionine_cycle/family-consultation/Q9KXN0-uniprot.json
    supporting_text: Catalyzes the hydrolysis of futalosine (FL) to dehypoxanthine futalosine (DHFL) and
      hypoxanthine, a step in the biosynthesis of menaquinone (MK, vitamin K2).
