family_id: PANTHER:PTHR46832
family_name: 5'-METHYLTHIOADENOSINE/S-ADENOSYLHOMOCYSTEINE NUCLEOSIDASE
preferred_name: MTA/SAH nucleosidase (MtnN/Pfs) family
summary: Bacterial nucleosidases that hydrolyse 5'-methylthioadenosine and S-adenosylhomocysteine to adenine
  (E. coli Pfs/MtnN, B. subtilis MtnN), feeding methionine salvage and AI-2 synthesis. SF2 holds futalosine
  hydrolase (MqnB) of the futalosine menaquinone pathway.
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF1 is MTA/SAH nucleosidase; SF2 is futalosine hydrolase.
