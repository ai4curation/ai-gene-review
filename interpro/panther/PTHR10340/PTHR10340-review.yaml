  PTN node(s) (PANTHER:PTN000037999, PANTHER:PTN000038096, PANTHER:PTN000038097, PANTHER:PTN000038098 (+1 more))
  with 12 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering extracellular region
