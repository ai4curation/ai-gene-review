  PTN nodes (PANTHER:PTN000037999, PANTHER:PTN000038096, PANTHER:PTN000038097, PANTHER:PTN000038098, PANTHER:PTN000818947)
  with different molecular function assignments across clades (phosphoric diester hydrolase activity (GO:0008081),
  acid sphingomyelin phosphodiesterase activity (GO:0061750), endopolyphosphatase activity (GO:0000298), exopolyphosphatase
  activity (GO:0004309)), indicating clade-level functional specialization across the family.
