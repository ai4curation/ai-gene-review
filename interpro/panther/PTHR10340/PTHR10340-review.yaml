family_id: PANTHER:PTHR10340
family_name: SPHINGOMYELIN PHOSPHODIESTERASE
preferred_name: Acid sphingomyelinase and fungal Ppn1 endopolyphosphatase family
summary: >-
  PTHR10340 is a metallo-dependent phosphodiesterase/phosphohydrolase family
  whose reviewed members separate into metazoan and amoebozoan sphingomyelin or
  cyclic GMP-AMP phosphodiesterases and a fungal Ppn1 clade that degrades
  inorganic polyphosphate. PAINT correctly confines the fungal-type vacuole,
  endopolyphosphatase, exopolyphosphatase and polyphosphate catabolism assertions
  to the fungal PTHR10340:SF55 Ppn1 subfamily, while IRDs on the fungal node stop
  extracellular and broad phosphoric-diester-hydrolase terms from the metazoan
  acid-sphingomyelinase side of the tree.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares a metallo-dependent phosphatase fold, but the substrate and
  physiological role diverge: animal SMPD1 hydrolyses sphingomyelin, animal
  SMPDL3 proteins hydrolyse nucleotide phosphodiesters, and fungal Ppn1 enzymes
  hydrolyse inorganic polyphosphate in the vacuolar system.
