    label: ELONGATION FACTOR P (EF-P) FAMILY PROTEIN
    description: >-
      Canonical bacterial EF-P orthologs (efp), the dominant subfamily (622 of
      829 reviewed members in the local PANTHER inventory), spanning
      proteobacteria, Firmicutes, Actinobacteria and Thermus. Includes the
      characterized E. coli, P. putida and B. subtilis EF-Ps, which are activated
      by three different lineage-specific modifications.
    representative_members:
      - id: UniProtKB:P0A6N4
        label: Elongation factor P
        gene_symbol: efp
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/efp/efp-ai-review.yaml
      - id: UniProtKB:Q88LS0
        label: Elongation factor P
        gene_symbol: efp
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/efp/efp-ai-review.yaml
      - id: UniProtKB:P49778
        label: Elongation factor P
        gene_symbol: efp
        organism: Bacillus subtilis 168
        gene_review: genes/BACSU/efp/efp-ai-review.yaml
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:23239623
        supporting_text: >-
          EF-P is present in all bacteria and orthologous to archaeal and
          eukaryotic initiation factor 5A
      - reference_id: PMID:23239624
        supporting_text: >-
          EF-P prevents ribosome from stalling during synthesis of proteins
          containing consecutive prolines, such as PPG, PPP, or longer proline
          strings, in natural and engineered model proteins.
  - subfamily_id: PANTHER:PTHR30053:SF14
    label: TRANSLATION ELONGATION FACTOR KOW-LIKE DOMAIN-CONTAINING PROTEIN
    description: >-
      Paralogous EF-P-like lineage containing E. coli EfpL (YeiP) and its
      orthologs (98 efpL-named reviewed members), together with a smaller set of
      efp-named members from organisms that encode this lineage. E. coli EfpL is
      a PAINT seed for the family-level translation elongation factor activity;
      its function partially overlaps with EF-P.
    representative_members:
      - id: UniProtKB:P0A6N8
        label: Elongation factor protein EfpL
        gene_symbol: efpL
        organism: Escherichia coli K-12
    diverged_from_family: false
    supported_by:
      - reference_id: file:ECOLI/efp/efp-uniprot.txt
        supporting_text: >-
          Its function partially overlaps with EfpL and UUP
node_assessments:
  - node_id: PANTHER:PTN000769376
    asserted_term:
      id: GO:0003746
      label: translation elongation factor activity
    evidence: IBD
    negated: false
    paint_snapshot: "20250904"
    seeds:
      - id: UniProtKB:P0A6N4
        label: Elongation factor P
        gene_symbol: efp
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A6N8
        label: Elongation factor protein EfpL
        gene_symbol: efpL
        organism: Escherichia coli K-12
    assessment: SOUND
    assessment_reason: >-
      The node is seeded by both paralogous subfamilies (EF-P in SF12 and EfpL in
      SF14), so placing translation elongation factor activity at the node that
      spans both is consistent with the descendant evidence. EF-P directly
      promotes peptide-bond formation on the ribosome; all EF-P gene reviews in
      this corpus (E. coli, P. putida, B. subtilis) accept GO:0003746 as core.
    supported_by:
      - reference_id: PMID:23239624
        supporting_text: >-
          EF-P promotes peptide-bond formation and stabilizes the peptidyl-transfer
          RNA in the catalytic center of the ribosome.
  - node_id: PANTHER:PTN000769376
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    evidence: IBD
    negated: false
    paint_snapshot: "20260828"
    seeds:
      - id: UniProtKB:P0A6N4
        label: Elongation factor P
        gene_symbol: efp
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A6N8
        label: Elongation factor protein EfpL
        gene_symbol: efpL
        organism: Escherichia coli K-12
    assessment: SOUND
    assessment_reason: >-
      EF-P-family proteins are soluble factors acting on cytoplasmic 70S
      ribosomes; no member carries a signal peptide or transmembrane segment.
      The cytoplasm placement is correct though less specific than cytosol.
    supported_by:
      - reference_id: file:ECOLI/efp/efp-uniprot.txt
        supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm.'
      - reference_id: PMID:1105576
        supporting_text: >-
          Over 90% of this activity was found in the ribosome-free cytoplasm of
          Escherichia coli extracts.
term_assessments:
  - assessed_term:
      id: GO:0003746
      label: translation elongation factor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Placed by PAINT at PTN000769376 seeded by both EF-P and EfpL; the shared
      EF-P fold and ribosome P/E-site binding mode support it throughout the
      family.
    supported_by:
      - reference_id: PMID:23239623
        supporting_text: >-
          we demonstrate that EF-P is an elongation factor that enhances translation
          of polyproline-containing proteins
  - assessed_term:
      id: GO:0043022
      label: ribosome binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Ribosome binding is the shared mechanism of the family: every member is a
      tRNA-mimicking factor that engages the 70S ribosome between the P and E
      sites, and EfpL as well as EF-P is found on ribosomes. The activity is
      upstream of, and required for, the peptide-bond stimulation that
      GO:0003746 names, so it holds wherever that node's activity holds.
    supported_by:
      - reference_id: PMID:18201202
        supporting_text: >-
          We report that EF-P protects 16S rRNA near the G526
          streptomycin and the S12 and mRNA binding sites (30S T-site).
      - reference_id: PMID:23239624
        supporting_text: >-
          EF-P promotes peptide-bond formation and stabilizes the peptidyl-transfer
          RNA in the catalytic center of the ribosome.
  - assessed_term:
      id: GO:0072344
      label: rescue of stalled cytosolic ribosome
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Polyproline stall rescue is established experimentally for canonical EF-P
      (SF12). EfpL overlaps partially with EF-P, but its motif specificity is
      narrower and less characterized, so the stall-rescue claim is restricted
      to SF12 here.
    applicable_subfamilies:
      - id: PANTHER:PTHR30053:SF12
        label: ELONGATION FACTOR P (EF-P) FAMILY PROTEIN
    supported_by:
      - reference_id: PMID:23239623
        supporting_text: >-
          In the absence of EF-P, ribosomes stall at
          polyproline stretches, whereas the presence of EF-P alleviates the translational
          stalling.
