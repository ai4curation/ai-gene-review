notes: >-
  PTHR30053 is specific enough to ground the efp_translation_stall_rescue
  module; the module uses SF12 (canonical EF-P), the subfamily that contains all
  three module representatives (P0A6N4, Q88LS0, P49778). PANTHER also defines
  PTHR30053:SF15 (TRANSLATION ELONGATION FACTOR P_YEIP CENTRAL DOMAIN-CONTAINING
  PROTEIN), which has no reviewed members in the local inventory and is not
  assessed. The local PAINT slice has only the two PTN000769376 IBD rows
  assessed above. The archaeal/eukaryotic aIF5A/eIF5A orthologs (hypusine-
  activated) belong to a different PANTHER family and are outside this review.
