family_id: PANTHER:PTHR30053
family_name: ELONGATION FACTOR P
preferred_name: Bacterial elongation factor P (EF-P) and EF-P-like (EfpL/YeiP) translation factors
summary: >-
  Bacterial translation factors of the EF-P family, structural and functional
  homologs of archaeal/eukaryotic initiation factor 5A (aIF5A/eIF5A, a separate
  PANTHER family). Canonical EF-P binds the ribosome between the P and E sites,
  stabilizes the P-site peptidyl-tRNA and stimulates peptide-bond formation,
  which rescues ribosomes that stall while synthesizing consecutive proline
  residues (PPP, PPG and related motifs). In many lineages EF-P activity depends
  on a lineage-specific post-translational modification of a conserved loop
  residue (Lys34 (R)-beta-lysylation by EpmA/EpmB with EpmC hydroxylation in
  E. coli and Salmonella; Arg32 rhamnosylation by EarP in Pseudomonas and
  Shewanella; Lys32 5-aminopentanolylation in B. subtilis), while some EF-P
  proteins function unmodified. The family also contains the paralogous
  EF-P-like proteins (EfpL/YeiP) found in some proteobacteria.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members share the three-domain EF-P fold and the translation elongation
  factor activity placed by PAINT at PTN000769376 (seeded by both E. coli EF-P
  and E. coli EfpL). Canonical EF-P (SF12) is the polyproline stall-rescue
  factor; the EfpL/YeiP-containing subfamily (SF14) is a paralogous lineage whose
  stall-rescue specificity and activation chemistry are less well characterized,
  and the activating modification differs between lineages, so substrate-motif
  and modification claims are not family-wide.
