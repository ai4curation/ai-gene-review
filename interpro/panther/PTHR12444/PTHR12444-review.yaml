family_id: PANTHER:PTHR12444
family_name: PROTEIN EFR3 HOMOLOG CMP44E
summary: EFR3 proteins anchor phosphatidylinositol-4-kinase-associated assemblies at the plasma membrane.
  Their conserved role is recruitment and organization of a lipid-kinase complex, allowing membrane phosphoinositide
  synthesis to occur at the correct location. EFR3A and EFR3B represent closely related mammalian branches.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The experimentally annotated human EFR3A record supports plasma-membrane recruitment
  of the PI4K complex. Participation in phosphatidylinositol-phosphate synthesis does not confer intrinsic
  lipid-kinase or lipase activity on EFR3. Effects on receptor signaling or synaptic physiology require
  the relevant organism and cellular context.
