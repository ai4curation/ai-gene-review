term_assessments:
- assessed_term:
    id: GO:0016586
    label: RSC-type complex
  scope: UNRESOLVED
  scope_reason: >-
    RSC-type complex membership is sound on the fungal Sfh1 branch
    PTN000001262. It is not a whole-family property, because fungal Snf5
    proteins are in SWI/SNF and animal SMARCB1/Snr1 proteins are in BAF-family
    complexes. PANTHER publishes official subfamilies for PTHR10019, but the
    cached representative slice has no member-to-subfamily assignments and does
    not disambiguate the fungal SF, so this scope is tied to the PAINT clade
    rather than to a PANTHER:SF accession.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10019/PTHR10019-paint.tsv
    supporting_text: "PTHR10019\tPTN000001262\tGO:0016586\tC\tIBD\tfalse"
