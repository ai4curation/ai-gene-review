family_id: PANTHER:PTHR10019
family_name: SNF5
preferred_name: Snf5/Sfh1/SMARCB1 non-ATPase SWI/SNF-family chromatin-remodeling subunits
summary: >-
  PTHR10019 contains SNF5/SMARCB1-family non-ATPase subunits of SWI/SNF-family
  chromatin remodelers. Fungi have separated paralogs for the canonical SWI/SNF
  and RSC complexes, represented by S. cerevisiae Snf5 and Sfh1 and by S. pombe
  snf5 and sfh1. Animals retain SMARCB1/Snr1-family subunits of BAF-family
  remodelers, while plants have the single Arabidopsis BSH homolog. PAINT keeps
  the RSC-type complex assertion on the fungal Sfh1 branch while placing the
  broadly conserved nucleus, chromatin-remodeling, and Pol II regulatory
  assertions at the family root.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All reviewed members are noncatalytic subunits of SWI/SNF-family
  chromatin-remodeling complexes, but the precise complex identity is
  branch-specific: fungal Snf5 paralogs are SWI/SNF subunits, fungal Sfh1
  paralogs are RSC subunits, and metazoan SMARCB1/Snr1 proteins populate
  BAF-family complexes. Those branch-level complex terms should therefore stay
  on the PAINT nodes that distinguish Sfh1/RSC and animal BAF complexes rather
  than being treated as whole-family properties.
