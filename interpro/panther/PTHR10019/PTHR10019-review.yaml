  representative members are not assigned to them and the fungal-looking SF
  cannot be resolved to the Sfh1 branch rather than the sibling Snf5 branch.
  The branch descriptions therefore use PAINT nodes and representative proteins
  rather than PANTHER:SF accessions. The PTN000001262 PAINT row is seeded by C.
  albicans SFH1; UniProtKB:Q6FTV3 is used above as the C. glabrata Candida
  representative present in the local PTHR10019 entry slice.
