    label: chromatin remodeling
  scope: FAMILY_WIDE
  scope_reason: >-
    SWI/SNF-family chromatin-remodeler membership spans the fungal, plant and
    animal SNF5-family branches sampled in PTHR10019.
  supported_by:
  - reference_id: PMID:42748234
    supporting_text: >-
      Adenosine 5'-triphosphate-dependent switch/sucrose nonfermentable
      (SWI/SNF)-family chromatin remodelers regulate genome accessibility by
      repositioning nucleosomes
