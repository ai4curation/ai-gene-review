- subfamily_id: PANTHER:PTHR22912:SF219
  label: DIHYDROLIPOYL DEHYDROGENASE
  description: >-
    Bacterial E3 represented by Bacillus subtilis AcoL (O34324). The committed member
    inventory and current UniProt independently place AcoL in SF219. Its FAD/NAD(H)
    and redox-disulfide architecture supports conserved dihydrolipoyl dehydrogenase
    chemistry; the native acetoin-locus study does not constitute a purified AcoL
    assay or establish sharing with every other E3-dependent complex.
  representative_members:
  - id: UniProtKB:O34324
    gene_symbol: acoL
    organism: Bacillus subtilis subsp. subtilis str. 168
    gene_review: genes/BACSU/acoL/acoL-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:genes/BACSU/acoL/acoL-uniprot.txt
    supporting_text: 'DR   PANTHER; PTHR22912:SF219; DIHYDROLIPOYL DEHYDROGENASE; 1.'
  - reference_id: PMID:10368162
    supporting_text: >-
      AcoL exhibited the putative flavin adenine dinucleotide-binding domain
      ( 5 ) at the N-terminal region, an active disulfide bridge
      site at position Cys 38 and Cys 43 , a putative
      NAD(H)-binding region in the central part, and the putative interface
      region at the C terminus and therefore matched the characteristic
      properties of dihydrolipoamide dehydrogenases ( 16 , 22 ).
- subfamily_id: PANTHER:PTHR22912:SF93
  label: SOLUBLE PYRIDINE NUCLEOTIDE TRANSHYDROGENASE
  description: Soluble pyridine nucleotide transhydrogenase SthA.
  representative_members:
  - id: UniProtKB:A1AIE2
    gene_symbol: sthA
    organism: Escherichia coli
  diverged_from_family: true
  divergence_description: NAD(P)+ transhydrogenase rather than lipoamide dehydrogenase.
