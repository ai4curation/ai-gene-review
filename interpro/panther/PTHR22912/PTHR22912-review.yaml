family_id: PANTHER:PTHR22912
family_name: DISULFIDE OXIDOREDUCTASE
preferred_name: >-
  Class I pyridine nucleotide-disulfide oxidoreductase family (dihydrolipoyl dehydrogenase, SthA)
summary: >-
  FAD-dependent disulfide oxidoreductases. Dihydrolipoyl dehydrogenase (E3: S. cerevisiae LPD1, S.
  pombe dld1, human DLD, bacterial Lpd/LpdG/LpdV) reoxidizes the lipoyl arms of the PDH, OGDH, BCKDH
  and glycine cleavage complexes. The family also contains the soluble pyridine nucleotide transhydrogenase
  SthA (SF93) and plant leghemoglobin reductase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  E3 activity holds for the dihydrolipoyl dehydrogenase subfamilies (SF151, SF160, SF224, SF217 and
  plant paralogs). SthA (SF93) transfers hydride between NADH and NADPH instead.
