  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43344:SF13
  label: PHOSPHATASE RV3661-RELATED
  description: >-
    Rv3661-like HAD phosphatases. The subfamily is functionally mixed: it contains the
    monofunctional Pseudomonas histidinol-phosphate phosphatase PA0335 (genetically and
    biochemically characterized) and the P. aeruginosa phosphorylcholine phosphatase PchP, as well as
    uncharacterized Rv3661 homologs. The P. putida HolPase PP_5147, the reciprocal-best-hit ortholog
    of PA0335, is not in the member inventory. Histidinol-phosphatase activity is therefore a
    member-level property of the PA0335 clade (NCBIfam NF052360), not a subfamily-wide one.
  representative_members:
  - id: UniProtKB:Q9I6F6
    gene_symbol: PA0335
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/PA0335/PA0335-ai-review.yaml
  diverged_from_family: false
