notes: >-
  serine_biosynthesis_one_carbon selects the whole family; SF2 is the phosphoserine phosphatase subfamily.
  modules/bacterial_aspartate_to_threonine_biosynthesis.yaml grounds P. aeruginosa ThrH (Q9I2Y2) at
  PANTHER:PTHR43344:SF2 for its optional phosphoserine-dependent homoserine phosphorylation
  comparator; the phosphotransferase assessment above is specific to that paralog. The reference
  protein's gene review (human PSPH) was completed on 2026-11-03. On 2026-11-11 E. coli SerB,
  yeast SER2 and P. putida SerB were added as SF2 representatives for
  MODULE:phosphorylated_serine_biosynthesis; E. coli SerB is a seed of PTN000000002.
