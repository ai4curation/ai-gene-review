family_id: PANTHER:PTHR43344
family_name: PHOSPHOSERINE PHOSPHATASE
preferred_name: Phosphoserine phosphatase (PSPH/SerB) family
summary: >-
  HAD-superfamily phosphatases. SF2 holds the phosphoserine phosphatases (human PSPH, S. cerevisiae
  SER2, S. pombe SPBC3H7.07c, bacterial SerB) that complete phosphorylated serine biosynthesis; other
  subfamilies include polyol phosphate phosphatases (PYP1/MtnX) and Rv3661-like phosphatases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only SF2 is the phosphoserine phosphatase; other subfamilies dephosphorylate other substrates or
  are uncharacterized.
