- assessed_term:
    id: GO:0043899
    label: phosphoserine:homoserine phosphotransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Demonstrated only for P. aeruginosa ThrH (Q9I2Y2), which transfers the phosphoryl group of
    phosphoserine to homoserine and thereby complements thrB mutants. ThrH has no subfamily of
    its own: PANTHER places it in SF2 together with the canonical phosphoserine phosphatases
    (human PSPH, yeast SER2, E. coli SerB, S. pombe SPBC3H7.07c), for which the activity has
    not been reported and is not inferred; its discoverers called it novel. No PAINT node
    asserts it. The term therefore cannot be scoped to SF2 or to any other subfamily and is left
    as a member-level property of ThrH, as with amino acid kinase activity in PTHR21064.
  supported_by:
  - reference_id: PMID:14699121
    supporting_text: we have demonstrated that ThrH is able to further transfer the phosphoryl
      group to homoserine using phosphoserine as the phosphoryl group donor, indicating that
      ThrH has a novel phosphoserine:homoserine phosphotransferase activity.
