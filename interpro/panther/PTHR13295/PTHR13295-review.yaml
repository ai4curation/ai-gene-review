  The non-catalytic modifier subunit of glutamate-cysteine ligase lowers the Km of the catalytic
  subunit for glutamate and raises the Ki for glutathione feedback inhibition (human GCLM, S. pombe
  gcs2). S. cerevisiae has no member.
