term_assessments:
- assessed_term:
    id: GO:0008831
    label: dTDP-4-dehydrorhamnose reductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The reductase is the ancestral bacterial activity and holds for the RmlD enzymes. The eukaryotic MAT2B
    branch has lost catalysis and the antibiotic 4-ketoreductases act on other substrates; because PANTHER
    keeps everything in SF4, these are recorded as member exceptions, the MAT2B ones with the loss placed
    at PTN000051875. Uncharacterised bacterial RmlD-like paralogs outside rhamnose clusters (such as P.
    putida PP_0500) carry the term only as a prediction.
  member_exceptions:
  - member:
      id: UniProtKB:Q9NZL9
      label: Methionine adenosyltransferase 2 subunit beta
      gene_symbol: MAT2B
      organism: Homo sapiens
    exception_reason: >-
      Methionine adenosyltransferase 2 subunit beta is the non-catalytic regulatory subunit of MAT2A.
      It keeps the SDR/RmlD fold but has no dTDP-4-dehydrorhamnose reductase activity; its function is
      regulation of SAM synthesis. The loss sits on the eukaryotic branch PTN000051875, which PANTHER
      does not separate as a subfamily.
