family_id: PANTHER:PTHR10491
family_name: DTDP-4-DEHYDRORHAMNOSE REDUCTASE
preferred_name: RmlD dTDP-4-dehydrorhamnose reductase and MAT2B regulatory-subunit family
summary: >-
  PTHR10491 groups extended short-chain dehydrogenase/reductase (SDR) proteins of the RmlD type. In bacteria
  the members are dTDP-4-dehydrorhamnose reductases (RmlD, EC 1.1.1.133) that reduce dTDP-4-dehydro-beta-L-rhamnose
  with NAD(P)H to dTDP-L-rhamnose, the last step of the RmlABCD pathway; Salmonella, M. tuberculosis and
  E. coli RmlD are the characterised examples, and the catalytic Tyr/Lys pair and Mg(2+)-dependent dimer
  interface are conserved. Antibiotic clusters contain RmlD-like 4-ketoreductases for other deoxysugars
  (NovS, OleU, StrL). The eukaryotic branch is methionine adenosyltransferase 2 subunit beta (MAT2B/MATbeta),
  a non-catalytic regulatory subunit that binds MAT2A and modulates S-adenosylmethionine synthesis while
  keeping the SDR fold. Plants carry the bifunctional NRS/ER epimerase-reductase. Bacteria also have uncharacterised
  RmlD-like paralogs outside rhamnose clusters (P. aeruginosa PA4069, P. putida PP_0500). PANTHER has
  a single subfamily, SF4, whose name (METHIONINE ADENOSYLTRANSFERASE 2 SUBUNIT BETA) describes only the
  eukaryotic branch.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The bacterial RmlD reductases share dTDP-4-dehydrorhamnose reductase activity, but the eukaryotic MAT2B
  branch has lost catalysis and acts as an enzyme regulator, antibiotic-cluster members reduce other dTDP-keto-sugars,
  and the plant NRS/ER is bifunctional. All of these sit in one PANTHER subfamily.
