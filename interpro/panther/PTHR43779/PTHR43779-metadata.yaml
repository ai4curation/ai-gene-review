  name:
    name: TfdA dioxygenase
    short: TfdA_dioxygenase
  description:
  - text: The TfdA dioxygenase family is involved in various oxidative decarboxylation
      and hydroxylation reactions that are crucial for the metabolism of diverse substrates,
      including herbicides, fatty acids, and purines. Members of this family play
      roles in the biosynthesis of isonitrile lipopeptides, which are implicated in
      virulence and metal acquisition in mycobacteria, and in the degradation of phenoxypropionate
      herbicides. They also participate in the biosynthesis of antibiotics like pentalenolactone
      and diterpene glucosides such as brassicicene C and fusicoccins. These enzymes
      typically require Fe(2+) and alpha-ketoglutarate to catalyze the oxidation of
      their respective substrates, producing compounds like uric acid from xanthine.
      Activity regulation is observed with ascorbate activation and inhibition by
      various divalent cations and specific inhibitors.
