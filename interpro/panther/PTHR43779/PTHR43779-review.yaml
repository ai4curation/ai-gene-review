preferred_name: 'TauD-like Fe(II)/2-oxoglutarate dioxygenase family: xanthine dioxygenase XanA and
  ScoE'
summary: >-
  TauD/TfdA-fold Fe(II)/2-oxoglutarate-dependent dioxygenases. SF2 holds fungal xanthine dioxygenases
  (S. pombe xan1, A. nidulans XanA) that hydroxylate xanthine to urate; SF3 holds bacterial ScoE-type
  oxygenase/decarboxylases that make isonitrile lipopeptides.
functional_coherence: HETEROGENEOUS
coherence_reason: SF2 acts on xanthine; SF3 acts on (carboxymethyl)amino fatty acids.
