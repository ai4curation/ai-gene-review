family_id: PANTHER:PTHR34596
family_name: CHITOPORIN
preferred_name: OprD/OccD-type outer-membrane porins (chitoporin family)
summary: >-
  Outer-membrane porins of the OprD (Opr, TC 1.B.25) type from Proteobacteria. The member
  inventory used here places all sampled members in subfamily SF2, including Pseudomonas
  aeruginosa OprD, the enterobacterial chitoporins ChiP of Escherichia coli and Salmonella,
  and two Pseudomonas putida KT2440 porins encoded inside catabolic gene clusters, GalP
  (gallate cluster) and NicP (nicotinate cluster). Channel formation across the outer
  membrane is the shared activity; the transported substrate differs between members and is
  experimentally defined only for some of them.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Porin activity is asserted by PAINT at a Proteobacteria-level node and is consistent with
  the Opr-family classification of the reviewed P. putida members. Substrate selectivity is
  not coherent: chitooligosaccharide transport is asserted only at an Enterobacteriaceae
  node, while GalP and NicP are assigned to aromatic-acid catabolic clusters with
  substrates that remain probable rather than demonstrated.
reference_protein:
  id: UniProtKB:Q88JX6
  label: Porin-like protein GalP
  gene_symbol: galP
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/galP/galP-ai-review.yaml
subfamilies:
