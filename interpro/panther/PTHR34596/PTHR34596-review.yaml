notes: >-
  Reviewed as part of the bacterial gallate catabolism module, where GalP is an optional
  outer-membrane entry step. GalP is the reference protein because it is the member whose
  role this module asserts; it is not the best-characterized member of the family. PAINT
  node placement relative to GalP and NicP was not adjudicated against the tree; the
  assessments rely on node taxon scope and on the reviewed members' own evidence.
