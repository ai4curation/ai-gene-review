  label: CHITOPORIN
  description: >-
    Contains every member in the sampled inventory (OprD, ChiP, GalP, NicP). Porin activity
    is shared; substrate specificity varies within the subfamily, so substrate-specific
    transport terms must not be propagated at subfamily level.
  representative_members:
