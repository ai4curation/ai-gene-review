  description:
  - text: This family of proteins is involved in the modification and degradation
      of carbohydrates. Members of this family exhibit a range of substrate specificities,
      including the ability to act on maltooligosaccharides and simpler carbohydrates
      such as maltotriose. They are capable of catalyzing transglycosylation reactions,
      which result in the production of maltooligosaccharides of varying lengths and
      glucose. Some family members also display hydrolytic activity, breaking down
      carbohydrates into smaller sugars. The enzymatic activity of these proteins
      can be regulated by various inhibitors, including specific chemical reagents
      and metal ions.
