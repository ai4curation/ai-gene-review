family_id: PANTHER:PTHR10978
family_name: SUCCINATE DEHYDROGENASE CYTOCHROME B560 SUBUNIT
preferred_name: Succinate dehydrogenase cytochrome b large subunit (SdhC/SDH3/SDHC) family
summary: >-
  SdhC/SDHC is one of the two integral membrane subunits of complex II. With SdhD/SDHD it anchors
  the flavoprotein and iron-sulphur subunits to the membrane, binds heme b and forms the ubiquinone-binding
  site. The family contains bacterial SdhC, S. cerevisiae SDH3, S. pombe sdh3 and human SDHC.
functional_coherence: COHERENT
coherence_reason: All members are complex II membrane-anchor subunits.
