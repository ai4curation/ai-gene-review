    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN001531327 is an appropriate gain node for productive refolding in the
    YDJ1/DNAJA branches, but it also descends into the APJ1 branch. S.
    cerevisiae Apj1 instead directs nuclear aggregate disaggregation toward
    soluble but largely inactive client species and proteasomal turnover; the
    Hsp104-dependent recovery of heat-aggregated luciferase is accelerated when
    APJ1 is deleted. The APJ1 clade already carries an IRD against the same
    PTN001531327 source for the broad cytosol row, so adding a protein-refolding
    IRD at PTN001531353 would prune only the duplicated APJ1 branch while
    preserving the experimentally supported YDJ1 refolding transfer.
