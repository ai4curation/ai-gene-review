family_id: PANTHER:PTHR43888
family_name: DNAJ-LIKE-2, ISOFORM A-RELATED
preferred_name: Class A J-domain Hsp70 cochaperones
summary: >-
  PTHR43888 contains class A/type I J-domain cochaperones that use an
  HPD-containing J domain to stimulate Hsp70 ATPase activity and route
  non-native clients to folding, disaggregation, import, degradation, and
  compartment-specific stress pathways. Broad Hsp70 ATPase activation is the
  shared molecular activity. Downstream biological processes are branch- and
  member-specific: S. cerevisiae Ydj1 participates in productive cytosolic
  Hsp104/Hsp70-dependent refolding, whereas the duplicated nuclear Apj1
  promotes Hsp70/Sse1-dependent disaggregation coupled to proteasomal turnover
  rather than refolding.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  J-domain mediated Hsp70 ATPase stimulation is conserved across the family,
  but the family contains divergent cytosolic, nuclear, ER and mitochondrial
  cochaperone branches whose compartments and client fates differ. APJ1 is a
  specialized fungal nuclear branch that inherited the eukaryotic refolding
  IBD from PTN001531327 even though APJ1-specific experiments show aggregate
  clearance coupled to turnover.
