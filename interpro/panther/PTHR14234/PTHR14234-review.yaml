family_id: PANTHER:PTHR14234
family_name: RIM BINDING PROTEIN-RELATED
preferred_name: RIM-binding proteins (RIM-BPs) and RIMBP3
summary: >-
  Animal multidomain proteins with three SH3 domains and three fibronectin
  type III domains. The neuronal members, RIM-BP1 (TSPOAP1), RIM-BP2 (RIMBP2)
  and their invertebrate orthologs (C. elegans RIMB-1, Drosophila RBP), are
  presynaptic active-zone scaffolds whose SH3 domains bind proline-rich motifs
  in RIMs and in the alpha1 subunits of voltage-gated calcium channels,
  coupling the vesicle priming machinery to calcium entry. The mammalian
  RIMBP3 paralogs (RIMBP3, RIMBP3B, RIMBP3C) form a separate subfamily that
  is described as a manchette protein of developing spermatids.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  RIM-BP1, RIM-BP2 and the invertebrate RIM-BPs share the active-zone adaptor
  role linking RIM and Cav2/Cav1 channels. The RIMBP3 subfamily (SF21) is the
  identified exception: its PAINT terms concern spermatid development, and it
  inherits nothing of the synaptic function. PAINT is incoherent in a second
  way: the active-zone terms are placed only on the RIM-BP2 clade, while
  TSPOAP1 carries only the mitochondrion and benzodiazepine receptor binding
  terms seeded by itself, and the latter also descend to RIMBP3.
