notes: >-
  The family deep-research file (PTHR14234-deep-research-falcon.md) was not
  used as evidence. Subfamily inheritance was read from the PAINT TreeGrafter
  annotation rows. The RIMBP3 subfamily (SF21) terms come from one mouse seed
  (MGI:2685449) whose paper was not read; they are recorded, not adjudicated.
  Not examined: RIMBP3/3B/3C, mouse and rat members, Drosophila RBP, and the
  seeds RGD:708533 and MGI:2443235 beyond their PAINT rows. The human RIMBP2
  GOA file still carries an IBA to neuromuscular synaptic transmission
  (GO:0007274) that is no longer asserted by any node in the current PAINT
  snapshot used here. Subfamily placements of RIMBP2 (SF18), TSPOAP1 (SF20)
  and RIMB-1 (SF19) are from their UniProt PANTHER cross-references.
