  assessment_reason: >-
    The root placement is correct for the kinase majority, and PAINT already prunes the two NAGS
    clades with IRDs (PTN001155498, animal NAGS; PTN001155505, fungal NAGS): no NAGS member
    (ARG2, arg6, human NAGS) receives GO:0003991 in the PAINT UniProt GAF. One more branch needs
    pruning: Deinococcus radiodurans LysZ (Q9RUG6, SF20) receives GO:0003991 and GO:0006526 from
