term_assessments:
- assessed_term:
    id: GO:0004042
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor
  scope: UNRESOLVED
  scope_reason: >-
    Safe for SF4 (fungal NAGS), which the arginine biosynthesis module uses with a GO:0004042
    required_function. Animal NAGS also has the activity but sits in SF0 with the NAG kinases,
    so SF0 is not listed; for animal NAGS scope by the PAINT node PTN000597387 or by member.
    The urea cycle module selects the whole family (PANTHER:PTHR23342) for its NAGS annoton with
    no required_function; that selector is dominated by acetylglutamate kinases and should be
    narrowed. Its note that the family "spans bacterial ArgA-type" enzymes is also inaccurate:
    the bacterial members are ArgB-type kinases, and bacterial ArgA is not in this family.
  supported_by:
  - reference_id: PMID:11553611
    supporting_text: >-
      Open reading frame YJL071W of Saccharomyces cerevisiae was shown to be ARG2 and identified as
      the structural gene for acetylglutamate synthase, first step in arginine biosynthesis
  - reference_id: PMID:12459178
    supporting_text: >-
      N-acetylglutamate synthase (NAGS, E.C. 2.3.1.1) is a mitochondrial enzyme catalyzing the
      formation of N-acetylglutamate (NAG), an essential allosteric activator of carbamylphosphate
      synthase I (CPSI), the first enzyme of the urea cycle.
- assessed_term:
    id: GO:0003991
    label: acetylglutamate kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    The majority activity, but no subfamily is clean: SF0 contains the kinases and the animal
    NAGS, and SF20 is LysZ. PAINT scopes it correctly by node (root PTN000597373 with IRDs at the
    two NAGS clades), apart from the LysZ branch. The arginine module attaches GO:0003991 to an
    NCBIfam TIGR00761 ArgB selector with ARG5,6 and arg11 as representatives, not to a PANTHER
    selector, which avoids the problem.
  supported_by:
  - reference_id: PMID:1851947
    supporting_text: >-
      the ARG5,6 gene encodes acetylglutamyl-P reductase and acetylglutamate kinase, two arginine
      anabolic enzymes which are localized in the mitochondria
  - reference_id: PMID:23894642
    supporting_text: >-
      In microorganisms and plants, NAG is further converted to NAG phosphate by NAG kinase (NAGK,
      EC 2.7.2.8) to continue the L-arginine biosynthetic pathway
- assessed_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Asserted at the root PTN000597373 and correct for the kinases and fungal NAGS. For animal
    NAGS the dominant role is the urea cycle (activating CPS1); the human NAGS review accepts the
    IBA while the zebrafish nags review keeps it as non-core. Not appropriate for [LysW]-aminoadipate
    kinases of lysine-only LysW pathways (Deinococcus/Thermus SF20).
  supported_by:
  - reference_id: PMID:12459178
    supporting_text: Patients with NAGS deficiency develop hyperammonemia because CPSI is inactive without NAG.
