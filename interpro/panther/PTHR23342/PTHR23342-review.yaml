notes: >-
  Modules: arginine_biosynthesis (SF4 with GO:0004042 required_function for ARG2/arg6; the NAGK
  step uses NCBIfam TIGR00761 and cites PTN000597373) and urea_cycle (whole family PTHR23342 for
  human NAGS, GO:0004042, no filter; inconsistency noted in the GO:0004042 assessment). Gene
  reviews ARG2, ARG5,6, arg11, NAGS and DANRE nags are consistent with the PAINT IBD/IRD
  structure; the S. pombe arg6 review still has its IBAs PENDING. The human NAGS review accepts
  GO:0006526 and keeps GO:0006536 glutamate metabolic process (PTN001155498, Eumetazoa) as
  non-core. Inheritance of PTN000597373 terms by LysZ Q9RUG6 was checked in the PAINT UniProt GAF;
  the SF20 function is from UniProt O50147/Q9RUG6 annotations (checked 2026-10-06) and the
  LysW-pathway paper, not from direct assays of the Deinococcus protein.
