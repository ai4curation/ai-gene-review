family_id: PANTHER:PTHR23342
family_name: N-ACETYLGLUTAMATE SYNTHASE
preferred_name: Acetylglutamate kinases (ArgB, fungal ARG5,6) and AAK-domain N-acetylglutamate synthases (fungal ARG2, animal NAGS)
summary: >-
  Family defined by the amino acid kinase (AAK) fold. Most members are N-acetylglutamate kinases
  (NAGK, ArgB), which phosphorylate N-acetyl-L-glutamate in the second step of the cyclic
  ornithine/arginine pathway: bacterial ArgB, plant NAGK, and the fungal mitochondrial ARG5,6
  (S. cerevisiae) / arg11 (S. pombe) precursors that combine NAGK with N-acetyl-gamma-glutamyl
  phosphate reductase. The family also contains N-acetylglutamate synthases (NAGS) that have an
  AAK-like domain fused to a GNAT acetyltransferase domain: the fungal mitochondrial ARG2/arg6
  (first step of arginine biosynthesis, acting in a complex with NAGK) and the animal
  mitochondrial NAGS, which makes N-acetylglutamate as the obligate activator of carbamoyl
  phosphate synthetase 1 in the urea cycle. Archaeal and Thermus/Deinococcus LysZ, kinases of
  the LysW-carrier pathway for lysine (and in some archaea arginine) synthesis, are also members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family name refers to the minority NAGS members. Most members are acetylglutamate kinases
  (GO:0003991); the fungal and animal NAGS (GO:0004042) are separate clades that PAINT excludes
  from the kinase activity with IRDs, and LysZ ([LysW]-aminoadipate kinase, SF20) acts on a
  carrier-protein-bound substrate. PANTHER's subfamily labels are misleading: SF0 "N-ACETYLGLUTAMATE
  SYNTHASE, MITOCHONDRIAL" holds the animal NAGS but also nearly all NAG kinases (E. coli ArgB,
  yeast ARG5,6, S. pombe arg11, plant NAGK), so SF0 cannot scope either activity. SF4 "AMINO-ACID
  ACETYLTRANSFERASE, MITOCHONDRIAL" is the clean fungal NAGS subfamily.
