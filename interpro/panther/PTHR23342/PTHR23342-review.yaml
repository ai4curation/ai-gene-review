    annotation). Several archaeal LysZ in SF0 (Sulfolobus Q980X0, Pyrobaculum Q8ZU99) also
    inherit; Sulfolobus LysZ phosphorylates LysW-bound glutamate for arginine synthesis as well
    as LysW-aminoadipate, so its arginine process annotation is correct but the free-NAG kinase
    term is not an exact fit. Recommended: an IRD for GO:0003991 at the LysZ clade(s).
