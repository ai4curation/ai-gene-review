  assessment: TOO_DEEP
  assessment_reason: >-
    PAINT places telomerase holoenzyme membership at the PTHR15696 root from a
    single S. cerevisiae seed. ESL1 lineage data show PTN000403280 is an
    Eukaryota root speciation and PTN000403281 is its Opisthokonts child; using
    the GO:0000184 batch-N02 tree reading only for that root-child topology,
    GO:0005697 has no seed in non-opisthokont PTN008356414. A PTN000403281
