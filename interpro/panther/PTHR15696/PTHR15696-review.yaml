family_id: PANTHER:PTHR15696
family_name: SMG-7  SUPPRESSOR WITH MORPHOLOGICAL EFFECT ON GENITALIA PROTEIN 7
preferred_name: SMG5/SMG6/SMG7/Est1/Ebs1 family
summary: >-
  PTHR15696 is the eukaryotic Est1/SMG-family group that contains metazoan
  SMG5, SMG6 and SMG7 nonsense-mediated decay factors, yeast Est1/Ebs1-like
  proteins and several fungal paralog branches. PAINT places telomerase
  holoenzyme membership, telomerase RNA binding, telomeric DNA binding and
  nonsense-mediated mRNA decay at the family root. The root placement is
  already pruned by PAINT at one fungal Dikarya branch, and the
  Saccharomyces ESL1/ESL2 pair needs an additional NMD-specific IRD because
  direct assays of both paralogs found no accumulation of the tested NMD
  substrates while their related telomerase binding and complex roles remain
  unresolved.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PAINT treats the four root IBDs as ancestral and prunes one Dikarya branch at
  PTN008560932. The S. cerevisiae Esl1/Esl2 branch is a second, narrower
  divergence for GO:0000184 only: NMD substrate assays support loss of the
  process in that pair, whereas telomere maintenance phenotypes do not directly
  test telomerase holoenzyme association, telomerase RNA binding or telomeric
  repeat DNA binding.
