notes: >-
  The family review deliberately proposes only one PAINT change: add an IRD for
  GO:0000184 at the ESL1/ESL2 PTN007651902 node. Lai et al. directly assayed
  ade2-1 and pre-CYH2 RNA accumulation in esl1, esl2 and double mutants, but
  their telomere phenotype panel did not assay direct telomeric DNA binding,
  telomerase RNA binding or holoenzyme membership, so the three telomerase rows
  remain unresolved rather than pruned. The existing PTN008560932 IRDs are
  captured as unresolved off-lineage losses because the ESL1 evidence neither
  confirms nor contradicts that separate Dikarya branch.
