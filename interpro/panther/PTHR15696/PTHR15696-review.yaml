family_id: PANTHER:PTHR15696
family_name: SMG-7  SUPPRESSOR WITH MORPHOLOGICAL EFFECT ON GENITALIA PROTEIN 7
preferred_name: SMG5/SMG6/SMG7/Est1/Ebs1 family
summary: >-
  PTHR15696 is the eukaryotic Est1/SMG-family group that contains metazoan
  SMG5, SMG6 and SMG7 nonsense-mediated decay factors, yeast Est1/Ebs1-like
  proteins and several fungal paralog branches. PAINT places telomerase
  holoenzyme membership, telomerase RNA binding, telomeric DNA binding and
  nonsense-mediated mRNA decay at the family root. The three telomerase rows
  are too deep because their supporting seeds and cross-clade Est1 telomerase
  evidence are confined to the opisthokont root child,
  while the NMD root placement is sound but needs an additional IRD at the
  Saccharomyces ESL1/ESL2 pair because direct assays of both paralogs found no
  accumulation of the tested NMD substrates.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PAINT treats the GO:0000184 root IBD as ancestral and prunes one Dikarya
  branch at PTN008560932. The three telomerase-related root IBDs are seeded
  only in, or otherwise supported only across, the opisthokont root child
  PTN000403281 and should move there rather than descend into the
  non-opisthokont child PTN008356414. The batch-N02 tree reading is cited below
  only for PTN000403280 root-child topology; its seven-seed statement is about
  the GO:0000184 NMD row. The S. cerevisiae Esl1/Esl2 branch is a second,
  narrower divergence for GO:0000184 only.
