notes: >-
  Reviewed while grounding the Dxs step of the thiamine diphosphate biosynthesis
  module (modules/thiamine_diphosphate_biosynthesis.yaml), which grounds Dxs to
  PTHR43322 with the P. putida KT2440 representative (SF5). The P. putida dxs gene
  review is the only member review in the repository. No primary DXS publication
  is cached, so plant-specific claims (chlorophyll node, SF4 paralog function) are
  left unresolved rather than judged. Inheritance of the PAINT IBAs by Arabidopsis
  DXS, rice DXS2 and E. coli Dxs was checked in QuickGO (2026-11-12): E. coli Dxs
  receives GO:0008661, GO:0019288 and GO:0005829; Arabidopsis DXS receives
  GO:0016744, GO:0009507 and GO:0015995 only; rice DXS2 receives GO:0016744 only.
