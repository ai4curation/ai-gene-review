subfamilies:
- subfamily_id: PANTHER:PTHR43322:SF5
  label: 1-DEOXY-D-XYLULOSE-5-PHOSPHATE SYNTHASE, CHLOROPLASTIC
  description: >-
    Canonical DXS: bacterial Dxs and the plastid type-I DXS of plants. Despite the
    "chloroplastic" name, almost all of the 522 reviewed members are bacterial
    cytosolic enzymes; only four reviewed members (Arabidopsis DXS, rice and hemp
    DXS1, pepper DXS) are plastid-targeted plant enzymes. Several bacteria
    (Streptomyces, Kitasatospora, Rhodobacterales, Geobacter, Zymomonas,
    Rhodospirillum) carry two SF5 paralogs named Dxs1 and Dxs2; their functional
    partition was not assessed.
