family_id: PANTHER:PTHR43322
family_name: 1-D-DEOXYXYLULOSE 5-PHOSPHATE SYNTHASE-RELATED
preferred_name: 1-deoxy-D-xylulose-5-phosphate synthase (DXS) family
summary: >-
  Thiamine diphosphate- and Mg2+-dependent enzymes of the transketolase
  superfamily (DXPS subfamily of the transketolase family) that condense pyruvate
  with D-glyceraldehyde 3-phosphate to form 1-deoxy-D-xylulose 5-phosphate (DXP)
  and CO2. DXP is the first intermediate of the methylerythritol 4-phosphate (MEP)
  isoprenoid-precursor pathway and, in bacteria, the precursor of the thiazole
  moiety of thiamine (and of pyridoxal phosphate in organisms using the
  DXP-dependent route). Nearly all reviewed members fall in SF5, which holds
  bacterial Dxs (E. coli, M. tuberculosis, P. putida KT2440) together with the
  plastid-targeted type-I DXS of land plants (Arabidopsis DXS/CLA1). SF4 holds the
  plant DXS2-related paralogs (rice, hemp).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed membership is dominated by SF5, whose bacterial and plant members
  share the DXS reaction. SF4 is a plant paralog clade (DXS2-related) whose
  members are named as DXS, but no SF4 member has a curated gene review here and
  its catalytic and physiological role was not assessed, so coherence is not
  asserted for SF4. The remaining PANTHER subfamilies (SF1, SF3, SF6-SF9) have no
  reviewed members in the member inventory.
