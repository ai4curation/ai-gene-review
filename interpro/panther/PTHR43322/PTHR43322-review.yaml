  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179234\tGO:0009507\tC\tIBD\tfalse"
  - reference_id: file:analysis/module_audits/mep_isoprenoid_precursor_biosynthesis/RESULTS.md
