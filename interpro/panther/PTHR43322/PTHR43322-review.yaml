family_id: PANTHER:PTHR43322
family_name: 1-D-DEOXYXYLULOSE 5-PHOSPHATE SYNTHASE-RELATED
preferred_name: 1-deoxy-D-xylulose-5-phosphate synthase (DXS) family
summary: >-
  DXS enzymes are thiamine-diphosphate-dependent, transketolase-like enzymes that condense pyruvate
  and D-glyceraldehyde 3-phosphate into 1-deoxy-D-xylulose 5-phosphate (DXP) with release of CO2. DXP
  is the first intermediate of the methylerythritol phosphate (MEP) route to isopentenyl and
  dimethylallyl diphosphate, and in bacteria it is also the precursor of thiamine and pyridoxal
  phosphate. The family contains bacterial Dxs (E. coli, B. subtilis, M. tuberculosis, P. putida) and
  the plastid DXS enzymes of plants. Most members sit in subfamily SF5; plants also carry additional
  DXS-related clades (SF4 and several smaller subfamilies) whose catalytic properties are less well
  established.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The characterized bacterial and plant DXS enzymes all fall in SF5 and share the DXS reaction. The
  plant-specific DXS-related subfamilies (SF4, "DXS 2, chloroplastic-related", and the small SF1 and
  SF3-SF9 clades of the PANTHER 19 tree) have no characterized member in this repository, so the
  DXS activity is not assumed for them.
reference_protein:
  id: UniProtKB:P77488
  label: 1-deoxy-D-xylulose-5-phosphate synthase
  gene_symbol: dxs
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/dxs/dxs-ai-review.yaml
subfamilies:
