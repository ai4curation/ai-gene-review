node_assessments:
- node_id: PANTHER:PTN000179225
  asserted_term:
    id: GO:0016744
    label: transketolase or transaldolase activity
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: AGI_LocusCode:AT4G15560
  - id: UniProtKB:P77488
  - id: UniProtKB:P9WNS3
  assessment: SOUND
  assessment_reason: >-
    Root-level node seeded by Arabidopsis DXS (AT4G15560), E. coli Dxs and M.
    tuberculosis Dxs. The ThDP-dependent transfer of a two-carbon (hydroxyethyl)
    unit from pyruvate to an aldehyde acceptor is the transketolase-type chemistry
    shared by the whole family, so placement at the root is right. The term is a
    true is_a ancestor of GO:0008661 and is uninformative where the specific
    activity is asserted (TOO_GENERAL on the P. putida dxs review), but the node
    itself is sound and is the only PAINT function that reaches the plant SF4
    paralogs. The PAINT slice records no taxon for the node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179225\tGO:0016744\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPK/dxs/dxs-uniprot.txt
    supporting_text: Belongs to the transketolase family. DXPS subfamily.
- node_id: PANTHER:PTN000179234
  asserted_term:
    id: GO:0009507
    label: chloroplast
  node_taxon:
    id: NCBITaxon:3398
    label: Magnoliopsida
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: AGI_LocusCode:AT3G21500
  assessment: SOUND
  assessment_reason: >-
    Flowering-plant DXS node; the MEP pathway of plants is plastidial and the plant
    members carry transit peptides. The node is restricted to Magnoliopsida, so
    bacterial SF5 members (including the P. putida reference protein, which
    receives no chloroplast annotation) do not inherit it. A single seed is
    adequate for a plant-only localization node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179234\tGO:0009507\tC\tIBD\tfalse"
- node_id: PANTHER:PTN000179234
  asserted_term:
    id: GO:0015995
    label: chlorophyll biosynthetic process
  node_taxon:
    id: NCBITaxon:3398
    label: Magnoliopsida
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: AGI_LocusCode:AT4G15560
  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded by Arabidopsis DXS/CLA1, whose loss gives albino, chlorophyll-deficient
    plants. DXS supplies DXP, from which the MEP pathway makes the
    geranylgeranyl/phytyl precursor of the chlorophyll side chain, so the
    annotation rests on an upstream precursor-supply relationship several enzymes
    removed from chlorophyll formation; whether that meets GO's participation
    standard for this process was not judged here because no plant DXS gene review
    or cached publication is available. The node is plant-only and does not affect
    bacterial members.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179234\tGO:0015995\tP\tIBD\tfalse"
- node_id: PANTHER:PTN000179250
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P77488
  assessment: SOUND
  assessment_reason: >-
    Seeded by E. coli Dxs. Bacterial Dxs is a soluble enzyme without signal
    peptide or membrane segment acting on glycolytic intermediates, so cytosol is
    correct for the bacterial clade. Arabidopsis DXS (Q38854) does not receive the
    resulting IBA (QuickGO, queried 2026-11-12), so the plastid plant members lie
    outside this node and are not mislocalized. The P. putida reference protein
    receives the term through TreeGrafter (GO_REF:0000118). The PAINT slice records
    no taxon for the node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179250\tGO:0005829\tC\tIBD\tfalse"
- node_id: PANTHER:PTN000179250
  asserted_term:
    id: GO:0008661
    label: 1-deoxy-D-xylulose-5-phosphate synthase activity
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: UniProtKB:P77488
  - id: UniProtKB:P9WNS3
  assessment: SOUND
  assessment_reason: >-
    Seeded by the two experimentally characterized bacterial enzymes (E. coli and
    M. tuberculosis Dxs); every bacterial SF5 member conserves the ThDP- and
    Mg2+-binding residues of the HAMAP MF_00315 DXS signature, as the P. putida
    reference protein does. The node is, if anything, shallower than the origin of
    the activity: Arabidopsis DXS (Q38854), which also catalyses the reaction, does
    not receive this IBA (QuickGO, queried 2026-11-12), so the plant type-I DXS
    clade is left without a PAINT DXS-activity annotation. Placing the IBD at the
    SF5 ancestor would cover it; this is a coverage suggestion, not an error in the
    bacterial assertion.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179250\tGO:0008661\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPK/dxs/dxs-uniprot.txt
    supporting_text: Catalyzes the acyloin condensation reaction between C atoms 2
- node_id: PANTHER:PTN000179250
  asserted_term:
    id: GO:0019288
    label: isopentenyl diphosphate biosynthetic process, methylerythritol phosphate pathway
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: UniProtKB:P77488
  - id: UniProtKB:P9WNS3
  assessment: SOUND
  assessment_reason: >-
    DXP formation is the first step of the MEP pathway in bacteria that use it,
    including E. coli, M. tuberculosis and P. putida, which lack the mevalonate
    route. Same node and seeds as the DXS activity assertion; the same coverage
    caveat for plant type-I DXS applies.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179250\tGO:0019288\tP\tIBD\tfalse"
