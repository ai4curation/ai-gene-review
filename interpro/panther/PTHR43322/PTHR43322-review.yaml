- subfamily_id: PANTHER:PTHR43322:SF4
  label: 1-DEOXY-D-XYLULOSE-5-PHOSPHATE SYNTHASE 2, CHLOROPLASTIC-RELATED
  description: >-
    Plant DXS-related clade (46 leaves in the PANTHER 19 tree, all angiosperm). No member is reviewed
    here, and none seeds a PAINT node, so whether these proteins carry DXS activity is left open.
