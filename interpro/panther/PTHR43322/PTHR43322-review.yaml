  assessment: SOUND
  assessment_reason: >-
    DXS catalyses the first reaction of the MEP route, so the bacterial enzymes do part of the work
    of the process. DXP is also used for thiamine and pyridoxal phosphate synthesis, which does not
    make the MEP-pathway term wrong.
  supported_by:
