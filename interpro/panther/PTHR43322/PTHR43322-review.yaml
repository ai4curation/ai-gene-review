- node_id: PANTHER:PTN000179234
  asserted_term:
    id: GO:0015995
    label: chlorophyll biosynthetic process
  evidence: IBD
  paint_snapshot: '20170511'
  seeds:
  - id: AGI_LocusCode:AT4G15560
  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded by Arabidopsis CLA1/DXS, whose loss gives albino plants. DXS supplies DXP, from which the
    plastid makes the geranylgeranyl diphosphate that forms the phytol side chain of chlorophyll, so
    the mutant phenotype shows necessity of precursor supply rather than a step of chlorophyll
    synthesis itself. Whether such upstream precursor enzymes should carry the chlorophyll process
    term is a GO convention question; no reviewed plant member in this repository decides it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43322/PTHR43322-paint.tsv
    supporting_text: "PTHR43322\tPTN000179234\tGO:0015995\tP\tIBD\tfalse"
