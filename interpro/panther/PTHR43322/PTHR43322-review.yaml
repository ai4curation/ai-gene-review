- subfamily_id: PANTHER:PTHR43322:SF4
  label: 1-DEOXY-D-XYLULOSE-5-PHOSPHATE SYNTHASE 2, CHLOROPLASTIC-RELATED
  description: >-
    Plant DXS2-related paralogs (reviewed members: rice Q6YU51 and hemp
    A0A803PDZ0, both named DXS 2, chloroplastic). Their activity and role relative
    to type-I DXS were not assessed in this review; in PAINT they inherit only the
    root transketolase/transaldolase term, not DXS activity, plastid or chlorophyll
