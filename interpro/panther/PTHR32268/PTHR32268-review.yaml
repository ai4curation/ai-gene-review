notes: >-
  A machine-drafted review of this family exists on an unmerged branch with Fusarium FUB5 as its
  reference protein; it scoped the serine O-acetyltransferase node to SF16 but did not assess the
  IRD node. This review uses MET2 as the reference protein because it has a curated gene review.
  The kinetic values quoted for S. pombe cys2 come from its UniProt record (ECO:0000269,
  PubMed:28581482), whose full text is not cached here.
