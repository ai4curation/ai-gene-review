  assessment: NEEDS_PRUNING
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN002426741
  assessment_reason: >-
    Acetyl-CoA use is the ancestral state (PMID:28581482 infers that acetyl-CoA was originally the sole
    donor) and the seeds span fungi, bacteria and an archaeon, so the root placement is defensible.
    The fungal serine succinyltransferase clade is already blocked by the IRD at PTN008645996. The
    succinyl-specific bacterial clades are not blocked: QuickGO (November 2026) shows P. aeruginosa
    MetXS (P57714), a reviewed homoserine O-succinyltransferase, receiving this IBA with PTN000791315
    in WITH/FROM. Those clades need their own IRD.
    Proposed fix: add an IRD at PTN002426741, the PANTHER tree leaf for P. aeruginosa MetXS (UniProt
    P57714, PTHR32268:SF11); no internal node below PTN000791315 holds the succinyl-specific
    Pseudomonas enzyme without also holding acetyl-specific seeds. P. putida KT2440 MetXS (Q88CT3) is
    not a leaf of the reference tree; TreeGrafter grafts it onto this same leaf (its GO_REF:0000118
    TreeGrafter row at PTN002426741 is L-homoserine metabolic process). Its GO:0004414 row is instead
    a UniProt combined IEA (GO_REF:0000120) whose WITH/FROM lists ARBA:ARBA00088393 together with
    PANTHER:PTN002426741. An IRD here would remove only the PANTHER contributor; the ARBA rule, which
    the metXS review records as the source defect driving that row, would still assert it.
