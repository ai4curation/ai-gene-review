family_id: PANTHER:PTHR32268
family_name: HOMOSERINE O-ACETYLTRANSFERASE
preferred_name: MetX alpha/beta-hydrolase-fold homoserine and serine O-acyltransferase family
summary: >-
  Acyl-CoA:amino-acid O-acyltransferases of the alpha/beta-hydrolase fold (MetX family). The main
  subfamily SF11 holds the homoserine O-acyltransferases of methionine biosynthesis in bacteria,
  archaea and fungi: S. cerevisiae MET2, S. pombe met6, M. tuberculosis MetXA and many bacterial MetXA
  enzymes use acetyl-CoA, while Pseudomonas MetXS enzymes and many other bacterial members use
  succinyl-CoA. SF16 is a divergent fungal clade (S. pombe cys2, Aspergillus nidulans CysA) that
  succinylates L-serine for cysteine biosynthesis and no longer works in methionine biosynthesis.
  SF15 holds esterase-like proteins (an ethyl acetate hydrolase, Corynebacterium Cgl0839).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three activities separate by subfamily (homoserine acylation in SF11, serine succinylation in SF16,
  ester hydrolysis in SF15), and within SF11 the acyl donor switches between acetyl-CoA and
  succinyl-CoA. Enzymology of 100 MetA- and MetX-family enzymes showed that donor specificity is
  widely misannotated from family membership (PMID:28581482).
