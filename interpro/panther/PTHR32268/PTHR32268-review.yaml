    id: GO:0004414
    label: homoserine O-acetyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Held by the acetyl-specific SF11 members (MET2, met6, MetXA and many bacteria) but not by the
    succinyl-specific SF11 members, and no PANTHER subfamily separates the two donors; assign from
    enzymology, not membership.
    P. putida KT2440 MetXS (Q88CT3), the module succinyltransferase exemplar, is one such succinyl-specific member.
  supported_by:
  - reference_id: PMID:28581482
    supporting_text: >-
      evolved to use exclusively succinyl-CoA in the most recent bacteria
  - reference_id: file:interpro/panther/PTHR32268/PTHR32268-paint.tsv
    supporting_text: "PTHR32268\tPTN000791315\tGO:0004414\tF\tIBD\tfalse"
  - reference_id: PMID:28581482
    supporting_text: >-
      Members of these families are prone to incorrect annotation because MetX and MetA enzymes are
      assumed to always use acetyl-CoA and succinyl-CoA, respectively.
