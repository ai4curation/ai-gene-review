family_id: PANTHER:PTHR10949
family_name: LIPOYL SYNTHASE
preferred_name: LipA/LIAS radical SAM lipoyl synthases
summary: 'Lipoyl synthases are radical SAM enzymes with two [4Fe-4S] clusters that insert sulfur at C6
  and C8 of an octanoyl chain already amide-linked to a lipoyl-domain lysine, completing the lipoyl cofactor.
  The auxiliary cluster is the sulfur donor and is consumed. Bacterial LipA (E. coli, P. putida, B. subtilis),
  mitochondrial LIAS (human) and Lip5 (yeast) share this activity, and plant chloroplastic paralogs (SF31,
  SF38) are plastidial lipoyl synthases: poplar LIP1P-1 and LIP1P-2 (SF38) carry the activity, and the
  GO:0016992 IBD node is seeded in part by Arabidopsis plastidial lipoyl synthase AT5G08415. The protein-bound
  substrate may be a client E2 lipoyl domain or GcvH, depending on the lineage.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: The SF0 bacterial and mitochondrial lipoyl synthases and the SF31/SF38 plant chloroplastic
  lipoyl synthases all share lipoate synthase activity; the chloroplastic subfamilies are grounded by
  the poplar LIP1P reviews and by the Arabidopsis plastidial seed AT5G08415. Two PAINT nodes recorded
  under this family carry unrelated archaeal radical SAM activities (GO:0044689 FO synthase CofG-type,
  seeded by Q57888; generic transferase, seeded by Q8TUB9); neither seed is in the current family entry
  list, so these appear to reflect older tree content. They are noted rather than counted as evidence
  of heterogeneity in the lipoyl synthase subfamilies.
