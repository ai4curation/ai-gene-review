family_id: PANTHER:PTHR10949
family_name: LIPOYL SYNTHASE
preferred_name: LipA/LIAS radical SAM lipoyl synthases
summary: Lipoyl synthases are radical SAM enzymes with two [4Fe-4S] clusters that insert sulfur at C6
  and C8 of an octanoyl chain already amide-linked to a lipoyl-domain lysine, completing the lipoyl cofactor.
  The auxiliary cluster is the sulfur donor and is consumed. Bacterial LipA (E. coli, P. putida, B. subtilis)
  and mitochondrial LIAS (human) share this activity; plant chloroplastic paralogs form separate subfamilies.
  The protein-bound substrate may be a client E2 lipoyl domain or GcvH, depending on the lineage.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The bacterial, mitochondrial and chloroplastic lipoyl synthase subfamilies (SF0, SF31,
  SF38) share lipoate synthase activity. Two PAINT nodes recorded under this family carry unrelated archaeal
  radical SAM activities (GO:0044689 FO synthase CofG-type, seeded by Q57888; generic transferase, seeded
  by Q8TUB9); neither seed is in the current family entry list, so these appear to reflect older tree
  content. They are noted rather than counted as evidence of heterogeneity in the lipoyl synthase subfamilies.
