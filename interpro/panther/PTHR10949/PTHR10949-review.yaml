  scope: SUBFAMILY_ONLY
  scope_reason: 'Supported for SF0 by direct evidence on E. coli LipA and human LIAS, with P. putida LipA,
    B. subtilis LipA and yeast Lip5 as reviewed SF0 members. The plant chloroplastic subfamilies SF31
    and SF38 are plastidial lipoyl synthases: poplar LIP1P-1 and LIP1P-2 are reviewed SF38 members that
    carry the term, and the GO:0016992 IBD node is seeded in part by Arabidopsis plastidial lipoyl synthase
    AT5G08415. Not granted family-wide because the family file also carries archaeal radical SAM nodes
    of other activities (CofG-type FO synthase, generic transferase) whose seeds are not in the current
    entry list.'
