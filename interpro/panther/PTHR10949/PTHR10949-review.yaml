notes: Used by modules/endogenous_protein_lipoylation.yaml for the sulfur-insertion step of all three
  modeled routes. SF0 spans direct and relay topologies, so the family identifies the sulfur-insertion
  step, not whether the substrate is GcvH- or E2-bound. Archaeal LipS1/LipS2 split lipoyl synthases are
  outside this family review. Gene reviews ECOLI/lipA (reference), PSEPK/lipA, BACSU/lipA, human/LIAS
  and yeast/LIP5 are COMPLETE.
