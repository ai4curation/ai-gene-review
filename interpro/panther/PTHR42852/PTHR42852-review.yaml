family_id: PANTHER:PTHR42852
family_name: THIOL:DISULFIDE INTERCHANGE PROTEIN DSBE
preferred_name: DsbE/CcmG/ResA-like periplasmic thioredoxin family
summary: >-
  PTHR42852 is a family of membrane-anchored, extracytoplasmic
  thioredoxin-like (TlpA/ResA-type) thiol-disulfide oxidoreductases with a
  CXXC active site. SF6 contains the cytochrome c maturation reductases:
  system I CcmG/DsbE (E. coli DsbE, Pseudomonas CcmG, Rhodobacter HelX,
  Bradyrhizobium CycY, Paracoccus CcmG) and the system II ResA of Bacillus
  subtilis. E. coli CcmG is a highly specific disulfide reductase, kept
  reduced by DsbD, that reduces the apocytochrome c CXXCH disulfide and
  resolves CcmH-apocytochrome mixed disulfides. Other subfamilies are
  functionally diverse: DipZ (SF13, a DsbD-like fusion in Mycobacterium),
  MPT53/MauD/HI_1115-like proteins (SF17), TlpA (SF16), YkuV (SF12) and YneN
  (SF1), which act on other substrates such as methylamine dehydrogenase or
  cytochrome oxidase subunits.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The thioredoxin fold and thiol-disulfide exchange chemistry are shared, so a
  general oxidoreductase activity is family-wide, but substrate specificity
  and the cytochrome c maturation role are confined to SF6; the cytochrome
  complex assembly process is placed at a proteobacterial node accordingly.
