        supporting_text: "PTHR42852\tPTN002871705\tGO:0016491\tF\tIBD\tfalse\tUniProtKB:P0AA86|UniProtKB:P9WG65"
  - assessed_term:
      id: GO:0015035
      label: protein-disulfide reductase activity
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR42852:SF6
        label: THIOL:DISULFIDE INTERCHANGE PROTEIN DSBE
    scope_reason: >-
      Reduction of protein disulfides (apocytochrome c and CcmH mixed
      disulfides) is demonstrated for system I CcmG of SF6; ResA in the same
      subfamily also reduces apocytochrome disulfides in system II. Other
      subfamilies act on other substrates.
    supported_by:
      - reference_id: PMID:16004871
        supporting_text: >-
          CcmG, a highly specific disulfide reductase essential for cytochrome
          c maturation.
      - reference_id: PMID:28634234
        supporting_text: >-
          We established that CcmG can efficiently reduce the disulfide bond of
          apocytochrome c and also resolve a mixed disulfide bond formed
          between apocytochrome c and CcmH.
  - assessed_term:
      id: GO:1903607
      label: cytochrome c biosynthetic process
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR42852:SF6
        label: THIOL:DISULFIDE INTERCHANGE PROTEIN DSBE
    scope_reason: >-
      The cytochrome c maturation role belongs to the CcmG/DsbE/ResA
      subfamily; PAINT's proteobacterial node uses the broader cytochrome
      complex assembly term.
    supported_by:
      - reference_id: PMID:9537397
        supporting_text: >-
          A chromosomal, nonpolar in-frame deletion in ccmG resulted in the
          complete absence of all c-type cytochromes.
