family_id: PANTHER:PTHR11183
family_name: GLYCOGENIN SUBFAMILY MEMBER
preferred_name: GT8 glycogenin-related glycosyltransferase family
summary: >-
  GT8 retaining glycosyltransferases. Glycogenins (S. cerevisiae GLG1/GLG2, human GYG1/GYG2) auto-glucosylate
  a tyrosine to prime glycogen synthesis. The family also contains plant galactinol synthases, plant
  GUX xylan glucuronosyltransferases, S. cerevisiae GNT1 (Golgi N-acetylglucosaminyltransferase)
  and uncharacterized S. pombe members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Glycogenin self-glucosylation is confined to the glycogenin subfamilies (SF100 fungal, SF164 animal
  GYG1). The galactinol synthases, GUX and GNT1 transfer other sugars to other acceptors.
