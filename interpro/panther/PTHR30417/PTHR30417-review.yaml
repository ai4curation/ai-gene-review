    location descends to AmpD, which acts on imported muropeptides in the cytosol
    and is not active in the cell wall. There is no descendant node that isolates
    the periplasmic clade from AmpD, so the fix is an IRD on the AmpD clade node to
    stop the term descending there; cytoplasmic AmpD reviews mark this row as
    over-annotated.
