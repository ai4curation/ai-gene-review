notes: >-
  Written for the peptidoglycan_recycling module, whose AmpD step is grounded on
  SF4 with E. coli AmpD (P13016) and P. putida KT2440 AmpD (Q88PQ9) as
  representatives. The amidase MF (GO:0008745) is scoped FAMILY_WIDE; the
  Gram-negative cell-wall location is scoped to the periplasmic AmiD/AmpDh
  subfamilies (SF1, SF12) and the over-propagation to cytoplasmic AmpD (SF4) is
  recorded at node PTN002019137. The E. coli/P. putida AmpD reviews (SF4) mark the
  GO:0009276 row as over-annotated; the P. aeruginosa AmpDh2 (SF1) and AmpDh3
  (SF12) reviews legitimately retain it.
