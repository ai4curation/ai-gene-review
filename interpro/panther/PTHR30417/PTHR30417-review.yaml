term_assessments:
- assessed_term:
    id: GO:0008745
    label: N-acetylmuramoyl-L-alanine amidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every subfamily is a zinc-dependent N-acetylmuramoyl-L-alanine amidase sharing
    the Amidase_2 catalytic zinc triad, so the amidase activity is safe for the
    whole family. The subfamilies differ in substrate and compartment, not in the
    core MF.
- assessed_term:
    id: GO:0009276
    label: Gram-negative-bacterium-type cell wall
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The cell-wall location is appropriate for the periplasmic AmiD/AmpDh amidases
    (SF1, SF12) but not for the cytoplasmic AmpD subfamily (SF4), whose members
    act in the cytosol. It must not descend family-wide.
  applicable_subfamilies:
  - id: PANTHER:PTHR30417:SF1
    label: N-ACETYLMURAMOYL-L-ALANINE AMIDASE AMID
  - id: PANTHER:PTHR30417:SF12
    label: N-ACETYLMURAMOYL-L-ALANINE AMIDASE
- assessed_term:
    id: GO:0009392
    label: N-acetyl-anhydromuramoyl-L-alanine amidase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The 1,6-anhydro-specific amidase activity is the defining AmpD (SF4) function:
    AmpD acts specifically on the 1,6-anhydro-MurNAc form of the imported
    muropeptide. It is directly demonstrated for E. coli AmpD (PMID:19309146) and
    is the molecular function used for the AmpD step in the peptidoglycan_recycling
    module. The periplasmic AmiD/AmpDh amidases (SF1, SF12) act on the cell-wall
    sacculus and are not restricted to the anhydro form, so this specific term is
    scoped to SF4.
  applicable_subfamilies:
  - id: PANTHER:PTHR30417:SF4
    label: 1,6-ANHYDRO-N-ACETYLMURAMYL-L-ALANINE AMIDASE AMPD
