family_id: PANTHER:PTHR30417
family_name: N-ACETYLMURAMOYL-L-ALANINE AMIDASE AMID
preferred_name: Amidase_2 (PGRP-fold) zinc-dependent N-acetylmuramoyl-L-alanine amidases (AmpD recycling amidases and AmiD/AmpDh cell-wall amidases)
summary: >-
  A family of zinc-dependent N-acetylmuramoyl-L-alanine amidases (EC 3.5.1.28)
  built on the Amidase_2 / PGRP fold, all of which hydrolyse the amide bond
  between the lactyl group of N-acetylmuramic acid and the alpha-amino group of
  L-alanine in peptidoglycan-derived substrates. The shared chemistry splits into
  two biological roles. The AmpD subfamily (SF4) is cytoplasmic and specific for
  1,6-anhydro-MurNAc-peptides: it releases the stem peptide from imported
  anhydromuropeptides during peptidoglycan recycling. The AmiD/AmpDh subfamilies
  (SF1 AmiD/AmpDh2; SF12 AmpDh3) are periplasmic cell-wall amidases that process
  the intact sacculus and its turnover products in the periplasm. All members
  carry a catalytic zinc coordinated by a His-His-Asp triad with an active-site
  glutamate general base.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The zinc-dependent N-acetylmuramoyl-L-alanine amidase activity (GO:0008745) is
  shared across the whole family, so the molecular function is coherent. The
  divergence is in compartment and substrate: cytoplasmic AmpD (SF4) acts on
  imported 1,6-anhydro-muropeptides in recycling, whereas AmiD/AmpDh (SF1, SF12)
  are periplasmic and act on the cell wall. The Gram-negative-cell-wall location
  (GO:0009276) is therefore a property of the periplasmic subfamilies, not of
  cytoplasmic AmpD.
