  assessment_reason: >-
    The is_active_in Gram-negative cell wall claim is seeded only by the
    periplasmic AmiD/AmpDh amidases (SF1, SF12, plus G3XCW9), for which it is
    correct, so the node placement is defensible for the periplasmic majority. But
