residue_sites:
- site_id: zinc_triad
  label: Catalytic zinc triad and general base
  description: >-
    The Amidase_2/PGRP catalytic zinc site. His34, His154 and Asp164 coordinate
    the catalytic Zn(2+); Glu116 is the general base that activates the
    zinc-bound water for amide-bond hydrolysis. Positions are in E. coli AmpD
    (P13016) numbering.
  anchor:
    id: UniProtKB:P13016
    label: 1,6-anhydro-N-acetylmuramyl-L-alanine amidase AmpD
    gene_symbol: ampD
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  residues:
  - position: 34
    expected: [H]
    role: zinc ligand
  - position: 116
    expected: [E]
    role: general base (proton acceptor)
  - position: 154
    expected: [H]
    role: zinc ligand
  - position: 164
    expected: [D]
    role: zinc ligand
  required_for:
  - term:
      id: GO:0008745
      label: N-acetylmuramoyl-L-alanine amidase activity
    strength: CONTRIBUTES
    rationale: >-
      Catalysis proceeds through a zinc-activated water that attacks the lactyl-
      amide bond, with the active-site glutamate acting as general base; loss of a
      zinc ligand or the base would abolish the metal-dependent amidase activity.
      Recorded as CONTRIBUTES rather than REQUIRED because no catalytically dead
      family member is available here as a negative control.
    supported_by:
    - reference_id: file:genes/ECOLI/ampD/ampD-uniprot.txt
      supporting_text: Zn(2+) is required for amidase activity
  site_source: UNIPROT_FEATURE
