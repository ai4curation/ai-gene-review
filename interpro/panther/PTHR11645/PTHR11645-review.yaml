    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The root node is seeded across bacteria, fungi and animals, and the activity is correct for
    every characterized P5C reductase (the PRO3, PYCR1 and PYCR2 reviews accept it). But the
    root also passes GO:0004735 and GO:0055129 to the methanogen Hmd hydrogenases, for example
    M. jannaschii Hmd (Q58194, inside SF0). Hmd is the iron-sulphur cluster-free hydrogenase
    that reduces methenyltetrahydromethanopterin with H2; it is not a P5C reductase. It needs an
    IRD. The same root also reaches B. subtilis ComER (SF51) and vertebrate NOXRED1 (SF58), whose
    activity is unknown; those should be checked before the IBA is relied on.
  supported_by:
  - reference_id: PMID:16540118
    supporting_text: The iron-sulphur cluster-free hydrogenase (Hmd, EC 1.12.98.2) from methanogenic archaea is
      a novel type of hydrogenase that tightly binds an iron-containing cofactor.
  - reference_id: PMID:16540118
    supporting_text: suggests a binding site for the substrate methenyltetrahydromethanopterin
- node_id: PANTHER:PTN000182176
  asserted_term:
    id: GO:0055129
    label: L-proline biosynthetic process
  paint_snapshot: '20260528'
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Same root-node problem as GO:0004735: the proline-biosynthetic process is correct for the
    characterized ProC/P5CR members but not for the methanogen Hmd proteins inside SF0. The
    affected Hmd members are individual exceptions inside an otherwise valid SF0, so SF0 is not
    listed as affected wholesale.
  supported_by:
  - reference_id: PMID:16540118
    supporting_text: The iron-sulphur cluster-free hydrogenase (Hmd, EC 1.12.98.2) from methanogenic archaea
      is a novel type of hydrogenase that tightly binds an iron-containing cofactor.
