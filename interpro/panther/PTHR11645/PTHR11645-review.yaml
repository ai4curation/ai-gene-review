notes: >-
  The paint file has only the root node PTN000182176 (GO:0004735, GO:0055129). The PAINT UniProt
  GAF shows it reaching SF0, SF6, SF61, SF49, SF53, SF70 and also SF51 (ComER), SF58 (NOXRED1)
  and the Hmd proteins in SF0. The fission yeast pro3 review is a stub. The arginine catabolism
  module gives P5C reductase a cytosol location, which fits the yeast representatives it lists
  (PRO3, pro3); the proline module generalizes to cytoplasm because it also lists PYCR1/PYCR2.
  Fungal secondary-metabolism P5CR-like members of SF0 (for example ucsG, phqD, apf3) were not
  assessed. No residue sites asserted.
