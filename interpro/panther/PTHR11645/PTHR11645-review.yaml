- assessed_term:
    id: GO:0006527
    label: L-arginine catabolic process
  scope: UNRESOLVED
  scope_reason: >-
    The arginine catabolism module places P5C reductase in arginine degradation. This holds
    where arginine-derived P5C is produced in the same compartment as the reductase, as for
    cytosolic CAR2 and PRO3 in S. cerevisiae, where pro1 and pro2 mutants make proline from
    arginine. It is a property of the organism's pathway layout, not of the family, and the
    PRO3 review keeps it as non-core.
  supported_by:
  - reference_id: PMID:25112878
    supporting_text: These results are consistent with arginine catabolism supplying P5C for PRO3 in pro1 and
      pro2 cells
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: >-
    Proline metabolism module location. Fungal PRO3/pro3 and PYCR3 are cytosolic and human
    PYCR1/PYCR2 are mitochondrial; because the mitochondrion is part of the cytoplasm, cytoplasm
    is the only location true for all members. Cytosol versus mitochondrion is
    lineage-determined: SF6 and SF61 are mitochondrial, SF0 members are cytosolic.
  supported_by:
  - reference_id: PMID:25112878
    supporting_text: Pro1p, Pro2p, and Pro3p were expressed exclusively in the cytosol
  - reference_id: PMID:23024808
    supporting_text: PYCR1 and PYCR2 are strictly associated with mitochondria
