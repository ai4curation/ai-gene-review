family_id: PANTHER:PTHR11645
family_name: PYRROLINE-5-CARBOXYLATE REDUCTASE
preferred_name: Pyrroline-5-carboxylate reductases (ProC, PRO3/pro3, PYCR1-3) and divergent relatives
summary: >-
  NAD(P)H-dependent 1-pyrroline-5-carboxylate (P5C) reductases, which catalyse the last step of
  proline biosynthesis and also reduce the P5C produced from ornithine. The family contains
  bacterial ProC, Bacillus ProH/ProI/ProG, fungal PRO3/pro3, plant P5CR, and the three human
  paralogs PYCR1 and PYCR2 (mitochondrial) and PYCR3 (cytosolic, in the same subfamily as the
  yeast and bacterial enzymes). PANTHER also places some divergent proteins with the same Rossmann
  fold-like N-terminal domain here: archaeal Hmd (the iron-sulphur cluster-free hydrogenase,
  inside SF0), Bacillus ComER (SF51) and human NOXRED1 (SF58).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  P5C reductase activity and proline biosynthesis are shared by the characterized ProC, PRO3,
  pro3 and PYCR members across bacteria, fungi, plants and animals. The exceptions are known or
  unverified: methanogen Hmd sits inside SF0 but is a hydrogenase that reduces
  methenyltetrahydromethanopterin, and ComER and NOXRED1 have no demonstrated P5C reductase
  activity. Location diverges by lineage, not subfamily: fungal PRO3/pro3 and human PYCR3 are
  cytosolic; human PYCR1 and PYCR2 are mitochondrial.
