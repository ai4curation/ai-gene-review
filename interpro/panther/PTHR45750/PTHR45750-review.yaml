notes: >-
  The existing histone_acetyltransferase_complexes module already models KAT2A
  and KAT2B as the alternative GNAT catalytic subunits of the SAGA and ATAC HAT
  modules. Production GO-CAMs involving KAT2A/KAT2B cover target-specific
  non-histone acetylation events rather than the family-level SAGA/ATAC H3 HAT
  function, so no module or GO-CAM review was changed in this PR.
