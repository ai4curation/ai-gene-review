family_id: PANTHER:PTHR45750
family_name: GH11602P
preferred_name: GCN5/PCAF histone acetyltransferase family
summary: >-
  PTHR45750 groups eukaryotic GNAT-family GCN5/PCAF histone acetyltransferases.
  Human KAT2A/GCN5 belongs to PTHR45750:SF1 and human KAT2B/PCAF belongs to
  PTHR45750:SF2. Both are alternative catalytic subunits of the SAGA/STAGA and
  ATAC coactivator HAT complexes and retain the root histone H3
  acetyltransferase, chromatin-remodeling and RNAPII coactivator annotations.
functional_coherence: COHERENT
coherence_reason: >-
  The curated Swiss-Prot slice contains fungal, plant and metazoan GCN5
  orthologs plus the vertebrate KAT2A/KAT2B paralogue split. The PTHR45750
  PAINT gains all describe conserved GNAT HAT biology: a eukaryotic histone H3
  acetyltransferase-complex role at the root and an ATAC-complex gain below the
  root. No IRD/IKR rows are needed for the two human paralogues.
