family_id: PANTHER:PTHR32315
family_name: ADENINE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Adenine/uracil phosphoribosyltransferase family
summary: >-
  Type I phosphoribosyltransferases. Adenine phosphoribosyltransferase (SF3: bacterial Apt, S. cerevisiae
  APT1, S. pombe apt1, human APRT) salvages adenine to AMP. PANTHER also places many bacterial and
  plastid uracil phosphoribosyltransferases (Upp) in SF4.
functional_coherence: HETEROGENEOUS
coherence_reason: APRT (SF3) and UPRT (SF4) salvage different bases.
