  name:
    name: Collagen superfamily
    short: Collagen_superfamily
  description:
  - text: The collagen family is characterized by its role in providing structural
      integrity to various tissues. Collagens are major components of the extracellular
      matrix and are involved in the formation of fibrils and networks that support
      the architecture of tissues such as skin, bone, cartilage, and basement membranes.
      They contribute to the physical properties of tissues, including elasticity
      and strength. Collagens also play roles in tissue development, growth, and repair.
      Some family members have specialized functions, such as mediating cell attachment,
      influencing cell morphology, and participating in angiogenesis. Certain collagens
      interact with other matrix proteins, like laminins and proteoglycans, to form
      complex meshworks. Some collagen types are involved in defense mechanisms, as
      seen in viral surface structures or in lung defense against inhaled pathogens.
      The diversity of domains within collagen chains, including triple-helical and
      non-collagenous domains, allows for the formation of various supramolecular
      assemblies and the execution of distinct biological functions.
