family_id: PANTHER:PTHR24023
family_name: COLLAGEN ALPHA
preferred_name: Collagen alpha-chain superfamily
summary: >-
  Metazoan collagen alpha-chain superfamily encompassing the major fibrillar collagens (Types I,
  II, III, V, XI — e.g., COL1A1, COL1A2, COL2A1, COL3A1, COL5A1, COL5A2), basement-membrane
  network-forming collagens (Type IV — COL4A1–COL4A6), and specialized FACIT and short-chain
  collagens. Beyond their canonical structural roles in the extracellular matrix (GO:0030020
  extracellular matrix structural constituent conferring tensile strength, GO:0030198
  extracellular matrix organization, GO:0030199 collagen fibril organization), native
  triple-helical fibrillar collagens (Types I, II, III, V) and collagen Type IV act as insoluble
  extracellular matrix receptor ligands (GO:0048018) that directly bind and activate the
  discoidin domain receptor tyrosine kinases DDR1 and DDR2 (GO:0038062) via conserved
  triple-helical motifs such as GVMGFO, initiating the collagen-activated tyrosine kinase
  receptor signaling pathway (GO:0038063; Reactome:R-HSA-2327738, Reactome:R-HSA-2465890).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most metazoan clades in PANTHER:PTHR24023 assemble into secreted triple-helical extracellular
  matrix polymers (GO:0031012, GO:0030020, GO:0030198), whereas several non-canonical
  scavenger-receptor and transmembrane branches have diverged and carry IRD negations in PAINT.
  Within the canonical extracellular collagens, the major fibrillar collagen clade
  (PTN009074843: COL1A1, COL1A2, COL2A1, COL3A1, COL5A2) and Type IV basement-membrane collagens
  additionally serve as direct extracellular matrix receptor ligands (GO:0048018) for the
  discoidin domain receptor tyrosine kinases DDR1 and DDR2 in the collagen-activated tyrosine
  kinase receptor signaling pathway (GO:0038063). Currently, PAINT places GO:0038063 only on
  the COL4A3 (PTN000615596) and COL4A6 (PTN000615545) subfamilies from mouse seeds, omitting
  the major fibrillar collagen clade (PTN009074843) and omitting GO:0048018 (receptor ligand
  activity) across all DDR-activating collagen clades (Category C ligand-classification and
  pathway-propagation gap).
