subfamilies:
- subfamily_id: PANTHER:PTHR24023:SF1082
  clade_node_id: PANTHER:PTN000614497
  label: COLLAGEN TRIPLE HELIX REPEAT
  description: >-
    Vertebrate pro-alpha-1(I) collagen chains (COL1A1), two of which co-assemble with one
    alpha-2(I) chain (COL1A2) to form the canonical [alpha-1(I)]2[alpha-2(I)] type I collagen
    heterotrimer (GO:0005584; or alpha-1(I) homotrimers). Native triple-helical type I collagen
    fibrils confer tensile strength (GO:0030020) and present the canonical GVMGFO motif that
    directly binds and activates both DDR1 and DDR2 receptor tyrosine kinases (GO:0048018,
    GO:0038063).
