family_id: PANTHER:PTHR11364
family_name: THIOSULFATE SULFERTANSFERASE
preferred_name: Rhodanese/3-mercaptopyruvate sulfurtransferase family
summary: >-
  PTHR11364 contains tandem rhodanese-domain sulfurtransferases. The reviewed
  human Swiss-Prot members are MPST (PTHR11364:SF25), which retains
  3-mercaptopyruvate sulfurtransferase chemistry and the ancestral
  TUM1-like role in cytosolic tRNA wobble-uridine thiolation, and TST
  (PTHR11364:SF6), the mitochondrial thiosulfate-cyanide
  sulfurtransferase/rhodanese that has secondarily lost the MST and
  tRNA-thiolation PAINT calls.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is unified by sulfur-transfer chemistry on a rhodanese catalytic
  cysteine, but paralogs differ in donor and acceptor preference. PAINT records
  a broad eukaryotic 3-mercaptopyruvate sulfurtransferase/tRNA-thiolation
  ancestor at PTN000146244 and then blocks those ancestral functions on the TST
  tetrapod branch at PTN008517019.
review_status: COMPLETE
