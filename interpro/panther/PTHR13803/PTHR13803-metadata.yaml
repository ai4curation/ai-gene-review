  name:
    name: SEC23/SEC24 family, SEC24 subfamily
    short: SEC23_SEC24_subfamily
  description:
  - text: The SEC23/SEC24 family, specifically the SEC24 subfamily, comprises proteins
      that are integral components of the coat protein complex II (COPII). These proteins
      are involved in the formation of transport vesicles from the endoplasmic reticulum
      (ER). The primary functions of the SEC24 subfamily include facilitating the
      physical deformation of the ER membrane to form vesicles and selecting cargo
      molecules for transport to the Golgi apparatus. The SEC24 proteins play a central
      role in cargo selection within the COPII complex, with some members showing
      specificity for certain cargo motifs or types, such as GPI-anchored proteins
      or those containing cytoplasmic DxE or LxxLE motifs. The SEC24 subfamily is
      essential for the maintenance of the early secretory pathway and has implications
      in various cellular processes, including viral infection, cell size patterning,
      and development of male gametophytes.
