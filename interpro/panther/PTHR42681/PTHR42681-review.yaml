notes: >-
  Reviewed for modules/type_ii_fatty_acid_synthesis.yaml, which grounds its malonyl-ACP loading step on
  this family and lists bacterial (E. coli, P. putida) and mitochondrial (yeast MCT1, S. pombe mct1) representatives.
  The two compartment nodes are what make that one family descriptor serviceable for both the bacterial
  and the mitochondrial variant of the step. Human MCAT is cross-referenced to a different PANTHER family
  in UniProt even though it seeds this family's nodes, which is why the module's descriptor note records
  the discrepancy rather than asserting one family id for all mitochondrial transacylases.
