family_id: PANTHER:PTHR42681
family_name: MALONYL-COA-ACYL CARRIER PROTEIN TRANSACYLASE, MITOCHONDRIAL
preferred_name: Malonyl-CoA:ACP transacylase (FabD/MCAT) family, bacterial and mitochondrial
summary: >-
  Malonyl-CoA:[acyl-carrier-protein] transacylases, which load the malonyl group onto the phosphopantetheine
  thiol of holo-ACP and so supply the two-carbon donor for every condensation of type II fatty-acid synthesis.
  The family spans bacterial FabD (E. coli, M. tuberculosis), the mitochondrial transacylases of fungi
  and animals, plant plastid MCAT, and the malonyl transacylase components of polyketide synthases, which
  perform the same chemistry on a carrier protein of a different pathway. Two compartment-specific PAINT
  nodes separate the bacterial cytosolic members from the mitochondrial ones.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member transfers a malonyl group from CoA to a carrier-protein thiol; the members
  differ in which carrier and which pathway they serve, not in the reaction.
reference_protein:
