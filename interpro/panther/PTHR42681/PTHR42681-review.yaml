  description: >-
    Effectively the whole family (28 of 29 inventory members): bacterial FabD, mitochondrial MCAT/Mct1,
    and polyketide-synthase malonyl transacylases such as Bacillus BaeC. The official label names the
    mitochondrial members, but the subfamily is not mitochondrion-specific and the label is not read as
    a localization claim; the compartment distinction is carried by the two separate PAINT nodes instead.
  representative_members:
