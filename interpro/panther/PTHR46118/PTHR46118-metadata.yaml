  name:
    name: AB Hydrolase Superfamily Enzymes
    short: AB_hydrolase_sf_enzymes
  description:
  - text: The AB hydrolase superfamily protein family encompasses enzymes with diverse
      catalytic activities, including alcohol acetyltransferases that synthesize acetate
      esters from alcohols and acetyl-CoA, and diacylglycerol lipases that hydrolyze
      diacylglycerol to regulate lipid metabolism. The alcohol acetyltransferases
      are capable of functioning as thioesterases and esterases, hydrolyzing acetyl-CoA
      and ethyl acetate, respectively. The diacylglycerol lipases preferentially hydrolyze
      stearate over palmitate from the sn-1 position of 1,2-diacyl-sn-glycerols and
      are implicated in maintaining intracellular diacylglycerol levels, functional
      lipoylation of the 2-oxoglutarate dehydrogenase complex, and supporting embryonic
      stem cell expansion and differentiation. This family's enzymes share a common
      structural framework characteristic of the AB hydrolase fold, which underlies
      their diverse functional roles.
