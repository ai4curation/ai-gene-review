notes: >-
  Curated alongside 11 in-repo gene reviews spanning all model-organism clades
  of PTHR46118: human ABHD11 (Q8NFV4), mouse Abhd11 (Q8K4F5), rat Abhd11
  (A0A8I6AS56), zebrafish abhd11 (Q6DRD9), Drosophila melanogaster paralogs
  CG2059 (Q9W3R8) and CG14717 (Q9VGJ4), Caenorhabditis elegans paralogs
  abhd-11.2 (O45707, SF4) and abhd-11.1 (O62202, SF3), Saccharomyces cerevisiae
  paralogs IMO32 (P53219) and EAT1 (P53208), and Schizosaccharomyces pombe
  SPAC22H12.03 (O94437). Resolved all three PAINT IBD rows against the PANTHER
  19.0 tree: PTN000106239 GO:0005739 at Unikonts is SOUND (downstream of
  Eubacteria PTN008704081, whereas trans-kingdom SF4 requires explicit bacterial
  member_exceptions in term_assessments); PTN002919262 GO:0052689 at Eukaryota
  is NEEDS_PRUNING for the Gly120 pseudoenzyme branch PTN002451174 (Drosophila
  CG14717); and PTN002919262 GO:0006629 at Eukaryota is WRONG_NODE from
  single-seed yeast overexpression TAG shifts.
