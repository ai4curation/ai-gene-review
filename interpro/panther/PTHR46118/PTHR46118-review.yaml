  - id: SGD:S000003263
    gene_symbol: IMO32
    organism: Saccharomyces cerevisiae (Baker's yeast)
    gene_review: genes/yeast/IMO32/IMO32-ai-review.yaml
  assessment: WRONG_NODE
  assessment_reason: >-
    Single-seed over-propagation at Eukaryota (PANTHER:PTN002919262) driven
    solely by SGD's GO:0006629 annotation on yeast IMO32 (SGD:S000003263) from
    high-copy overexpression [14C]acetate triacylglycerol shifts (PMID:28465236).
    Direct physiological studies refute cellular lipid metabolism as an ancestral
    or conserved biological process of PTHR46118: human ABHD11 exhibits zero
    hydrolytic activity toward monoacylglycerols, diacylglycerols, oleoyl-CoA,
    or arachidonoyl-CoA in natural-substrate assays (PMID:27544863); Abhd11
    knockout mice maintain wild-type endogenous 2-arachidonoylglycerol levels
    (PMID:32579589); mammalian ABHD11 instead operates in the mitochondrial
    matrix as an OGDHc-associated glutaryl-lipoyl thioesterase preserving
    2-oxoglutarate and TCA cycle metabolism (PMID:32792488, PMID:40664791);
    yeast Eat1 catalyzes mitochondrial ethyl acetate biosynthesis from ethanol
    and acetyl-CoA (PMID:28356220); and Drosophila CG14717 is a non-catalytic
    Gly120 pseudoenzyme.
