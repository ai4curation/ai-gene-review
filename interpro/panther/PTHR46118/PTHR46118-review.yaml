  - id: SGD:S000003263
    gene_symbol: IMO32
    organism: Saccharomyces cerevisiae (Baker's yeast)
    gene_review: genes/yeast/IMO32/IMO32-ai-review.yaml
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Ancestral ester-hydrolase activity at Eukaryota (PANTHER:PTN002919262) holds
    for catalytically intact descendants retaining the beta-5 GxSxG nucleophilic
    serine (human ABHD11 Ser132 hydrolyzing p-nitrophenyl butyrate/acetate in
    PMID:27544863 and PMID:32792488; Drosophila CG2059 Ser127 carboxylesterase
    activity in PMID:22198472; yeast Eat1 Ser115 ethyl acetate esterase activity
    in PMID:28356220), but PAINT lacks an IKR (NOT) loss annotation on the
    derived Diptera duplicate branch PANTHER:PTN002451174 (Drosophila
    melanogaster CG14717, UniProtKB:Q9VGJ4). CG14717 substituted the essential
    nucleophilic serine with glycine (Gly120 in ALGHGMGGR) and degenerated the
    oxyanion-hole HGLGG motif to 50-HDLNL-54, rendering it catalytically unable
    to form an acyl-enzyme intermediate; consistent with this loss, CG14717 was
    not detected as an active serine hydrolase in Drosophila activity-based
    proteomics where its active sister paralog CG2059 was profiled
    (PMID:33827210).
  supported_by:
  - reference_id: file:interpro/panther/PTHR46118/PTHR46118-paint.tsv
    supporting_text: "PTHR46118\tPTN002919262\tGO:0052689\tF\tIBD\tfalse\tFB:FBgn0029942|SGD:S000003263\ttaxon:2759\t20250413"
  - reference_id: PMID:27544863
