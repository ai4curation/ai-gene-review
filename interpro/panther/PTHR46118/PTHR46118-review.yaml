      supporting_text: >-
        | `UniProtKB:Q9VGJ4` | `CG14717` | *Drosophila melanogaster* | `PTHR46118:SF4` | 306 (`sv=1`) | `50-HDLNL-54` | `Gly120` (`ALGHGMGGR`) | `Asp144` (`ILAIDVCPV`) | `His282` (`RNAGHWVHA`) | Non-catalytic pseudoenzyme (`Ser->Gly120`, `PTN002451174`) |
