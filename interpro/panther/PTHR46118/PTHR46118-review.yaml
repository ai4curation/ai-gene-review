residue_sites:
- site_id: catalytic_nucleophile
  label: Alpha/beta-hydrolase nucleophilic elbow serine (Ser132)
  description: >-
    Catalytic serine nucleophile at the sharp beta-5-alpha-C nucleophilic elbow
    (130-GHSMG-134 in canonical 306-aa human ABHD11 Q8NFV4 sv=2; numbered Ser141
    in historical 315-aa Q8NFV4 sv=1 used in PMID:32792488 and PMID:40664791,
    Ser125 in 299-aa isoform Q8NFV4-4, and Ser96 in transit-peptide-truncated
    recombinant chain 37-306 in PMID:32579589). Directly conserved across active
    vertebrate, invertebrate, fungal, amoebozoan, and bacterial family members
    (Ser133 in mouse Q8K4F5, Ser127 in Drosophila CG2059 Q9W3R8, Ser152 in yeast
    Imo32 P53219, Ser115 in yeast Eat1 P53208, and Ser89 in crystallized E. coli
    YbfF P75736), whereas S->A mutagenesis in human ABHD11 abolishes both
    p-nitrophenyl ester hydrolysis and OGDHc lipoyl deglutarylation
    (PMID:32792488, PMID:40664791). Naturally lost via a Ser->Gly substitution
    (Gly120 in ALGHGMGGR) in the derived Drosophila melanogaster pseudoenzyme
    paralog CG14717 (UniProtKB:Q9VGJ4).
