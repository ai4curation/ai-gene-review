    lost_in_clade_node_id: PANTHER:PTN002451174
    exception_reason: >-
      Derived Diptera paralog CG14717 (leaf branch PANTHER:PTN002451174 under
      duplication PANTHER:PTN008704075) replaced the essential nucleophilic
      serine with Gly120 (116-ALGHGMGGR-124) and lost the oxyanion-hole HGLGG
