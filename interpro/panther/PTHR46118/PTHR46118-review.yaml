  assessment: SOUND
  assessment_reason: >-
    Phylogenetically sound placement at Unikonts/Amorphea (PANTHER:PTN000106239),
    which lies strictly inside Eukaryota (PANTHER:PTN002919262) and downstream of
    the LUCA split from Eubacteria (PANTHER:PTN008704081), so this PAINT node
    does NOT propagate GO:0005739 to bacterial SF4 members (Escherichia coli
    P75736, Salmonella typhimurium Q8ZQX0, Haemophilus influenzae Q57427).
    Mitochondrial localization is independently established in mammals (human
    ABHD11 PMID:32579589, PMID:32792488, PMID:34800366; mouse Abhd11
    PMID:18614015, PMID:32579589), budding yeast (Imo32 PMID:14562095,
    PMID:16823961, PMID:21525245; Eat1 PMID:14562095, PMID:30054364), and
    fission yeast (SPAC22H12.03 PMID:16823372). Note that had this IBD been
    placed at the LUCA subfamily root PANTHER:PTN008704070 (PTHR46118:SF4), it
    would have been TOO_DEEP across amitochondriate bacteria.
  supported_by:
