- site_id: catalytic_acid
  label: Beta-6 charge-relay acidic residue (Asp156)
  description: >-
    Acidic residue (Asp, or conservatively Glu176 in budding yeast Imo32 P53219)
    located after strand beta-6 (Asp156 in LIAVDISPV of human Q8NFV4 sv=2),
    structurally established as the triad carboxylate in the 1.1-A E. coli YbfF
    crystal structure (Asp113 in PDB:3BF7, PMID:18215690) and annotated as the
    charge-relay acid in yeast Eat1 (Asp139 in P53208 FT ACT_SITE 139). Note that
