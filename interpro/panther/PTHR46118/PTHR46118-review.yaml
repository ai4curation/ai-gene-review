family_id: PANTHER:PTHR46118
family_name: PROTEIN ABHD11
preferred_name: Mitochondrial ABHD11 lipoyl-adduct hydrolase, fungal Eat1/Imo32, and bacterial YbfF esterase family
summary: >-
  Trans-kingdom alpha/beta-hydrolase superfamily (PANTHER:PTHR46118) built on a
  globular eight-stranded alpha/beta-hydrolase core with an inserted three-helix
  cap domain forming an enclosed substrate-binding crevice and a canonical
  Ser-Asp/Glu-His charge-relay triad (Ser132 on the beta-5 GxSxG nucleophilic
  elbow, Asp156 on beta-6, and His287 on the beta-8-alpha-F loop in canonical
  306-aa human ABHD11 Q8NFV4 sv=2; Ser89-Asp113-His234 in the 1.1-A Escherichia
  coli YbfF crystal structure PDB:3BF7). Eukaryotic members encode mitochondrial
  proteins imported via N-terminal targeting presequences, whereas bacterial
  clade members in PANTHER:PTHR46118:SF4 (E. coli ybfF P75736, Salmonella
  typhimurium ybfF Q8ZQX0, Haemophilus influenzae HI_0193 Q57427) are cytoplasmic
  prokaryotic acyl-CoA and carboxylic-ester hydrolases lacking mitochondria.
  Physiological specialization has diverged sharply across clades: vertebrate
  ABHD11 associates with the mitochondrial matrix 2-oxoglutarate dehydrogenase
  complex (OGDHc) and functions as a glutaryl-lipoyl thioesterase removing
  inhibitory S-glutaryl adducts from lipoylated DLST to sustain tricarboxylic
  acid (TCA) cycle flux; Saccharomycetales Eat1 neofunctionalized into a
  mitochondrial alcohol O-acetyltransferase (EC 2.3.1.268) synthesizing ethyl
  acetate from ethanol and acetyl-CoA while retaining acetyl-CoA thioesterase
  and ethyl acetate esterase side-activities; budding yeast paralog Imo32 is a
  sequentially MPP- and Oct1-processed mitochondrial matrix alpha/beta-hydrolase;
  and Drosophila melanogaster carries both an active serine carboxylesterase
  paralog (CG2059, Ser127) and a catalytically inactive pseudoenzyme paralog
  (CG14717, Gly120) that lost both the nucleophilic serine and oxyanion-hole
  glycine.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Although active family members share a homologous cap-covered
  alpha/beta-hydrolase scaffold and general ester/thioester bond cleavage
  chemistry (GO:0052689 carboxylic ester hydrolase activity), PTHR46118 is
  functionally and taxonomically heterogeneous across four axes: (1)
  PANTHER:PTHR46118:SF4 is anchored at LUCA (PANTHER:PTN008704070) and merges
  eukaryotic mitochondrial proteins with bacterial cytoplasmic esterases
  (Escherichia coli YbfF P75736, Salmonella typhimurium YbfF Q8ZQX0, Haemophilus
  influenzae HI_0193 Q57427) in organisms that lack mitochondria; (2) mammalian
  ABHD11 evolved into an OGDHc-associated glutaryl-lipoyl thioesterase
  maintaining mitochondrial 2-oxoglutarate metabolism (PMID:32792488,
  PMID:40664791) and shows no physiological diacylglycerol or monoacylglycerol
  lipase role in vivo (PMID:27544863, PMID:32579589); (3) Saccharomycetales Eat1
  (P53208) neofunctionalized as an alcohol O-acetyltransferase (GO:0004026)
  driving mitochondrial ethyl acetate biosynthesis (PMID:28356220,
  PMID:30054364); and (4) Diptera experienced a lineage-specific duplication
  (PANTHER:PTN008704075) yielding active serine hydrolase CG2059 (Q9W3R8, Ser127)
  beside the non-catalytic Gly120 pseudoenzyme CG14717 (Q9VGJ4).
