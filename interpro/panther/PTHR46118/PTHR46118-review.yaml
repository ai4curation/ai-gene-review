- assessed_term:
    id: GO:0016790
    label: thiolester hydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    Distinct thioesterase activities have been biochemically demonstrated across
    multiple branches of PANTHER:PTHR46118:SF4—human ABHD11 acts as a
    glutaryl-lipoyl thioesterase cleaving S-glutaryl adducts from lipoate on
    OGDHc-E2/DLST without cleaving oleoyl-CoA or arachidonoyl-CoA
    (PMID:27544863, PMID:40664791), yeast Eat1 hydrolyzes acetyl-CoA in the
    absence of ethanol (EC 3.1.2.1; GO:0003986), and E. coli YbfF hydrolyzes
    palmitoyl-CoA and malonyl-CoA (PMID:18215690)—whereas thioesterase activity
    remains untested in invertebrate (CG2059, abhd-11.2, abhd-11.1) and fungal
    Imo32/SPAC22H12.03 homologs and is absent in pseudoenzyme CG14717. Recorded
    as UNRESOLVED because SF4 merges these functionally distinct clades.
  supported_by:
  - reference_id: PMID:40664791
    supporting_text: >-
      Mechanistically, we find ABHD11 removes glutaryl adducts from lipoate-an
      essential fatty acid modification required for the TCA cycle.
  - reference_id: PMID:27544863
    supporting_text: >-
      In contrast to YbfF, which reportedly hydrolyze long-chain acyl-CoA,
      hABHD11 did not utilize oleoyl-CoA or arachidonoyl-CoA.
- assessed_term:
    id: GO:0045252
    label: oxoglutarate dehydrogenase complex
  scope: UNRESOLVED
  scope_reason: >-
    Physical association with the mitochondrial matrix 2-oxoglutarate
    dehydrogenase complex (OGDH and DLST) and preservation of DLST lipoylation
    are experimentally established for human ABHD11 (PMID:32792488,
    PMID:40664791) and conserved across jawed-vertebrate ABHD11 orthologs
    (mouse, rat, zebrafish), but cannot be propagated across
    PANTHER:PTHR46118:SF4 onto bacterial cytoplasmic YbfF, neofunctionalized
    Saccharomycetales Eat1, or uncharacterized protostome/fungal members.
    Because SF4 spans LUCA without a vertebrate-specific subfamily, scope is
    recorded as UNRESOLVED.
  supported_by:
  - reference_id: PMID:32792488
    supporting_text: >-
      Rather than facilitating lipoate conjugation, ABHD11 associates with the
      OGDHc and maintains catalytic activity of lipoyl domain by preventing the
      formation of lipoyl adducts, highlighting ABHD11 as a regulator of
      functional lipoylation and 2-OG metabolism.
- assessed_term:
    id: GO:0004026
    label: alcohol O-acetyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Alcohol O-acetyltransferase activity (EC 2.3.1.268, synthesizing ethyl
    acetate from ethanol and acetyl-CoA) represents a lineage-specific
    neofunctionalization restricted to the Saccharomycetales Eat1 clade
    (Wickerhamomyces anomalus, Kluyveromyces lactis, Saccharomyces cerevisiae
