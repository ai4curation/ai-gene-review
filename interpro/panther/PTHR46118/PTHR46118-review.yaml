- assessed_term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  scope: FAMILY_WIDE
  determined_by_site: catalytic_nucleophile
  scope_reason: >-
    General carboxylic-ester hydrolysis is supported across catalytically active
    PTHR46118 members retaining the beta-5 GxSxG nucleophilic serine (human
    ABHD11 on p-nitrophenyl butyrate and p-nitrophenyl acetate in PMID:27544863
    and PMID:32792488; Drosophila CG2059 fat-body carboxylesterase activity in
    PMID:22198472; yeast Eat1 ethyl acetate acetylesterase activity; E. coli
    YbfF esterase activity in PMID:18215690), whether as the primary biochemical
    assay on unspecialized members or as a non-core esterase activity alongside
    specialized glutaryl-lipoyl thioesterase (ABHD11) or alcohol
    O-acetyltransferase (Eat1) catalysis. Lost specifically in the Drosophila
    melanogaster duplicate CG14717 (UniProtKB:Q9VGJ4), which carries a Ser->Gly
    substitution at position 120.
  member_exceptions:
  - member:
      id: UniProtKB:Q9VGJ4
