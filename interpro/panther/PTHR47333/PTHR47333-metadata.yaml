  name:
    name: von Willebrand factor C/EGF & Fibrillin
    short: vWF_C/EGF_Fibrillin
  description:
  - text: The von Willebrand factor C and EGF domain-containing protein family includes
      regulatory elements in signaling pathways, structural components of the extracellular
      matrix, and regulators of growth factor bioavailability. Members of this family
      are involved in the beta-catenin signaling pathway and may play a role in the
      prevention of hepatocellular carcinoma. Fibrillin-1 and -2 are crucial for the
      structural integrity and regulatory functions of microfibrils in connective
      tissues, influencing tissue homeostasis, osteoblast maturation, and osteoclastogenesis.
      They also interact with growth factors and integrins, contributing to cell adhesion
      and microfibril assembly. Latent-transforming growth factor beta-binding proteins
      control TGF-beta activation, maintaining it in a latent state and regulating
      its activation. The family's diverse functions include structural support, regulation
      of cell differentiation, and interaction with hormones that influence glucose
      metabolism and appetite.
