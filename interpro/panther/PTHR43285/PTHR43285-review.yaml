  Anthranilate phosphoribosyltransferases (TrpD; S. cerevisiae TRP4, S. pombe trp4, P. putida TrpD)
  catalysing the second step of tryptophan biosynthesis. SF4 holds E. coli YbiB, a TrpD-like DNA-binding
  protein.
