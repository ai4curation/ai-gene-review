- node_id: PANTHER:PTN000230153
  asserted_term:
    id: GO:0000162
    label: L-tryptophan biosynthetic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: AGI_LocusCode:AT5G17990
  - id: PomBase:SPBC16G5.08
  - id: SGD:S000002762
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Correct for the TrpD clade. The reviewed recipients TRP4 and trp4 keep the
    term, and P. putida TrpD, which is placed in SF2 by HMM, is genetically
    required for tryptophan synthesis. However, the PANTHER 19 tree puts
    PTN000230153 at the root (LUCA, 124 leaves), so the E. coli TrpD paralog
    YbiB (P30177, SF4) also descends from it. YbiB is a DNA-binding protein,
    and E. coli's anthranilate phosphoribosyltransferase is the C-terminal
    domain of TrpGD, so YbiB should not inherit tryptophan biosynthesis. An
    IRD NOT on the YbiB branch would fix this.
  affected_subfamilies:
  - id: PANTHER:PTHR43285:SF4
    label: TRANSFERASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR43285/PTHR43285-paint.tsv
    supporting_text: "PTHR43285\tPTN000230153\tGO:0000162\tP\tIBD\tfalse"
