notes: >-
  Node descendants were checked against the PANTHER 19.0 tree (treeinfo
  service). E. coli TrpGD (P00904) is cross-referenced to PTHR43285:SF2 by
  UniProt, but PANTHER's HMM assignment and tree place it in PTHR43418:SF2
  (BIFUNCTIONAL PROTEIN TRPGD). That is why the TrpG-clade nodes PTN000230074
  and PTN000230115 appear in this family's PAINT table and are assessed here
  only for completeness.
