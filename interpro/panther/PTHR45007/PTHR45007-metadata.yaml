  name:
    name: Acetyl-CoA Carboxylase Biotin Carboxylase Component
    short: ACC_Biotin_Carboxylase
  description:
  - text: This family of proteins includes enzymes that are part of the acetyl coenzyme
      A carboxylase complex. Members of this family function in two sequential steps
      of fatty acid biosynthesis. Initially, they catalyze the ATP-dependent carboxylation
      of a biotin-containing carrier protein. Subsequently, they facilitate the transfer
      of the carboxyl group to acetyl-CoA to produce malonyl-CoA, which is a critical
      building block for the elongation of fatty acid chains.
