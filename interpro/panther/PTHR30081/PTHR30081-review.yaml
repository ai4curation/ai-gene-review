family_id: PANTHER:PTHR30081
family_name: PROTEIN-EXPORT MEMBRANE PROTEIN SEC
functional_coherence: MOSTLY_COHERENT
preferred_name: SecD/SecF/SecDF proton-motive-force-coupled translocation accessory family
summary: >-
  PTHR30081 contains SecD and SecF, paralogous integral membrane proteins of the
  RND-like transporter fold that form the SecDF accessory of the bacterial Sec
  translocase. SecDF conducts protons (or sodium ions in some marine bacteria)
  and couples that flux to conformational cycles of its large periplasmic P1
  head domain, which grips the emerging precursor and pulls it outward,
  completing translocation after the ATP-dependent SecA step. In E. coli and
  most diderm bacteria SecD and SecF are separate proteins, whereas Bacillus
  subtilis, Thermus thermophilus and many other bacteria encode a single fused
  SecDF polypeptide carrying both halves. SecDF is not essential in all
  bacteria but is needed for high-capacity secretion, for example at low
  temperature. It associates with YajC and with SecYEG and YidC in the
  holo-translocon.
coherence_reason: >-
  The PMF-coupled accessory role is shared by split SecD and SecF and by fused
  SecDF. SecD-type and SecF-type halves fall in different subfamilies (SF1 and
  SF8), and fused SecDF proteins fall in SF1, so the same activity is supplied
  by two proteins in some lineages and one in others. The SF10 SSD-domain
  subfamily and the second SF13 SECD subfamily have no cached reviewed members
  and were not assessed.
