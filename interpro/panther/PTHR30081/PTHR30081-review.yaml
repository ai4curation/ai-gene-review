    description: >-
      SecD proteins of split systems (E. coli, P. putida) and fused SecDF
      proteins (B. subtilis, T. thermophilus). A fused member supplies both
      halves of the accessory on its own. For B. subtilis SecDF the sources
      disagree: UniProt's PANTHER cross-reference and the cached inventory
      place it in SF1, PANTHER's own classification file in SF8. A fused
      protein carries both a SecD-like and a SecF-like half, so either
      placement is defensible, and no term here depends on which is used.
