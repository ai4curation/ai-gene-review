family_id: PANTHER:PTHR10044
family_name: INHIBITOR OF APOPTOSIS
preferred_name: Metazoan inhibitor-of-apoptosis BIR/RING family
summary: >-
  PTHR10044 contains metazoan inhibitor-of-apoptosis proteins with baculoviral IAP repeat
  domains and, in several animal branches, C-terminal RING E3 ubiquitin-ligase domains. The
  reviewed human members separate into XIAP, BIRC7/ML-IAP, BIRC8/ILP-2, and the cIAP1/cIAP2
  pair BIRC2/BIRC3. XIAP, BIRC7 and BIRC8 can suppress intrinsic apoptotic caspase-9
  pathways, but they are not interchangeable with cIAPs: XIAP has additional BIR domains and a
  nuclear Wnt/TLE branch, BIRC7 has ML-IAP-specific TAK1/JNK protection from TNF- and
  ICE/caspase-1-triggered death plus DIABLO/SMAC ubiquitination, BIRC8 is a restricted
  testis-biased CASP9/Bax protector, and BIRC2/BIRC3 center on RIPK/TRAF E3 ubiquitination in
  TNF-family, NF-kappaB and ripoptosome signaling.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  RING E3 activity is shared across XIAP, BIRC7 and the cIAP1/cIAP2 branch, and BIRC8 retains
  the same domain architecture, but the BIR family has diverged in caspase-binding specificity
  and pathway wiring. Wnt signaling is XIAP-centered and over-propagates into the BIRC8/SF167
  retrogene, the broad caspase-inhibitor IBD at PTN000953271 over-propagates into the
  BIRC2/BIRC3 cIAP clade, and negative regulation of necroptosis is properly cIAP-specific at
  PTN002559449.
