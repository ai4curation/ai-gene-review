family_id: PANTHER:PTHR10044
family_name: INHIBITOR OF APOPTOSIS
preferred_name: Metazoan inhibitor-of-apoptosis BIR/RING family
summary: >-
  PTHR10044 contains metazoan inhibitor-of-apoptosis proteins with baculoviral IAP repeat
  domains and, in several animal branches, C-terminal RING E3 ubiquitin-ligase domains. This
  review covers the human BIRC7 and BIRC8 branches against the existing XIAP review, and
  records that the cIAP1/BIRC2 and cIAP2/BIRC3 branches remain for a later split. XIAP, BIRC7
  and BIRC8 can all suppress the intrinsic apoptotic caspase-9 pathway, but they are not
  interchangeable: XIAP has additional BIR domains and a nuclear Wnt/TLE branch, BIRC7 has
  ML-IAP-specific TAK1/JNK protection from TNF- and ICE/caspase-1-triggered death plus
  DIABLO/SMAC ubiquitination, and the primate retrogene BIRC8/ILP-2 is a restricted
  testis-biased caspase-9/Bax protector with no demonstrated TNF, Fas, Wnt or JNK role.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Caspase-pathway inhibition and RING E3 activity are shared across the reviewed XIAP, BIRC7
  and BIRC8 human members, but the family includes cIAP and insect branches with pathway
  specializations. Wnt signaling is XIAP-centered and over-propagates into the BIRC8/SF167
  retrogene, while necroptosis appears to be a cIAP1/cIAP2-specific PAINT branch that needs the
  BIRC2/BIRC3 split before final adjudication.
