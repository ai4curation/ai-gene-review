  scope_reason: >-
    RING-linked ubiquitin ligase activity is in scope for reviewed XIAP/SF115, BIRC7/SF163,
    BIRC8/SF167 and cIAP1/cIAP2 branches under PTN000799425, but the family contains other
    metazoan IAP branches not resolved in this human split.
