    label: negative regulation of apoptotic process
  scope: UNRESOLVED
  scope_reason: >-
    The reviewed XIAP, BIRC7, BIRC8, BIRC2 and BIRC3 branches all suppress apoptotic signaling,
    but apoptosis suppression also appears in insect IAPs and this review does not resolve every
    non-human branch carrying the term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10044/PTHR10044-paint.tsv
    supporting_text: "PTHR10044\tPTN000953271\tGO:0043066\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  scope: UNRESOLVED
  scope_reason: >-
    Human evidence reviewed on XIAP supports the Wnt/TLE branch for XIAP/SF115, and a separate
    Drosophila node supports Wnt regulation in insect IAPs. The PTN002559438 branch should be
    pruned before it reaches the SF167 BIRC8 retrogene, but the current review does not resolve
    the exact IRD node.
  supported_by:
  - reference_id: PMID:22304967
    supporting_text: Upon Wnt pathway activation, XIAP is recruited to TCF/Lef where it
      monoubiquitylates Groucho (Gro)/TLE.
- assessed_term:
    id: GO:0051726
    label: regulation of cell cycle
  scope: UNRESOLVED
  scope_reason: >-
    BIRC2 supports a nuclear E2F/cyclin branch, while BIRC3, BIRC7 and BIRC8 do not support
    direct cell-cycle regulation. PTN000005168 therefore needs pruning, but the exact set of IRD
    nodes remains unresolved.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10044/PTHR10044-paint.tsv
    supporting_text: "PTHR10044\tPTN000005168\tGO:0051726\tP\tIBD\tfalse"
