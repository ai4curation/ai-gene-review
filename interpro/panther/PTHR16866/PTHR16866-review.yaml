family_id: PANTHER:PTHR16866
family_name: GASTRIN-RELEASING PEPTIDE
preferred_name: Bombesin-like peptide family (Gastrin-releasing peptide / Neuromedin B)
summary: >-
  Secreted neuropeptide and gut-brain peptide hormone precursors of the bombesin-like peptide
  family (InterPro:IPR013201), comprising the gastrin-releasing peptide subfamily (GRP,
  PANTHER:PTHR16866:SF2; mammalian homolog of amphibian bombesin) and the neuromedin B
  subfamily (NMB, PANTHER:PTHR16866:SF3; mammalian homolog of amphibian ranatensin). Both
  prohormones are proteolytically cleaved at dibasic/monobasic sites and C-terminally
  alpha-amidated into mature bioactive peptides bearing a conserved C-terminal heptapeptide
  amidic pharmacophore (-Trp-Ala-Val-Gly-His-Leu/Phe-Met-NH2) that binds and activates the
  Gq/11-coupled bombesin-like G protein-coupled receptors GRPR (BB2, PANTHER:PTHR24234:SF28)
  and NMBR (BB1, PANTHER:PTHR24234:SF20), initiating the bombesin receptor signaling pathway
  (GO:0031989).
functional_coherence: COHERENT
coherence_reason: >-
  All vertebrate members of PANTHER:PTHR16866 (GRP in SF2 and NMB in SF3) are secreted
  C-terminally amidated bombesin-like peptide hormones and neuropeptides that share the
  molecular function GO:0005184 (neuropeptide hormone activity, a child of hormone activity
  GO:0005179 and receptor ligand activity GO:0048018), extracellular localization GO:0005576
  (extracellular region), and direct participation in GO:0031989 (bombesin receptor signaling
  pathway, a child of GO:0007218 neuropeptide signaling pathway). PAINT places GO:0005576,
  GO:0005184, and GO:0007218 at the Bilateria root node PTN008565241, but omits the specific
  child pathway GO:0031989 (bombesin receptor signaling pathway) on both the Euteleostomi crown
  clade and the GRP (PTN002704045) and NMB (PTN002704034) subfamilies (Category A pathway gap).
