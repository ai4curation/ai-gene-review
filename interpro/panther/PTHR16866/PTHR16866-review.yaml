  label: GASTRIN-RELEASING PEPTIDE
  description: >-
    Vertebrate gastrin-releasing peptide (GRP) orthologs, mammalian homologs of amphibian
    bombesin. Processed into mature C-terminally alpha-amidated GRP-27 and GRP-10 (neuromedin
    C), which act as the high-affinity endogenous agonists for the gastrin-releasing peptide
    receptor (GRPR / BB2) to drive Gq/11-phospholipase C signaling (GO:0031989), gastrin
    release, smooth-muscle contraction, itch transmission, and circadian entrainment.
