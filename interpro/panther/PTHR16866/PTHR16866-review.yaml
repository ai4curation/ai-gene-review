- subfamily_id: PANTHER:PTHR16866:SF3
  clade_node_id: PANTHER:PTN002704034
  label: NEUROMEDIN-B
  description: >-
    Vertebrate neuromedin B (NMB) orthologs, mammalian homologs of amphibian ranatensin.
    Processed into mature C-terminally alpha-amidated NMB-32 and NMB-10, which act as the
    high-affinity endogenous agonists for the neuromedin-B receptor (NMBR / BB1) to drive
    Gq/11-phospholipase C signaling (GO:0031989), smooth-muscle contraction, thermoregulation,
    sighing, and suppression of pituitary thyrotropin (TSH) release.
  representative_members:
  - id: UniProtKB:P08949
