family_id: PANTHER:PTHR11482
family_name: ARGININE/DIAMINOPIMELATE/ORNITHINE DECARBOXYLASE
preferred_name: Group IV PLP decarboxylase family (ornithine decarboxylase and antizyme inhibitors)
summary: >-
  Fold-type III PLP decarboxylases. Ornithine decarboxylase (S. cerevisiae SPE1, S. pombe spe1, bacterial
  SpeC, plant ODC, human ODC1) makes putrescine, the first step of polyamine synthesis. The antizyme
  inhibitors AZIN1 and AZIN2 are ODC paralogs that bind antizyme and so free ODC from antizyme-mediated
  degradation. AZIN1 has no decarboxylase activity; AZIN2 activity is disputed.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ODC activity holds for the ODC subfamilies (SF42, SF6, SF63). The antizyme inhibitors (SF7, SF4)
  act as ODC activators instead; PAINT negates ODC activity on their clade (PTN000159772).
