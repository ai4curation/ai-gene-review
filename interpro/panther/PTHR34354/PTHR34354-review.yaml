family_id: PANTHER:PTHR34354
family_name: NADPH-DEPENDENT 7-CYANO-7-DEAZAGUANINE REDUCTASE
preferred_name: QueF type 2 preQ1 synthase family
summary: >-
  Bacterial NADPH-dependent 7-cyano-7-deazaguanine reductases of the
  unimodular (type 2) QueF subfamily, distantly related to GTP cyclohydrolase
  I. Members reduce preQ0 to preQ1 for tRNA queuosine synthesis; E. coli QueF
  is the biochemically characterized reference.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1). Of the 418 reviewed members in the entries file, 415
  are named NADPH-dependent 7-cyano-7-deazaguanine reductase and 2 are putative
  ones. One archaeosine synthase is classified here as an outlier.
