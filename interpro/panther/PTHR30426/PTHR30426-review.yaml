family_id: PANTHER:PTHR30426
family_name: 4-HYDROXY-3-METHYLBUT-2-ENYL DIPHOSPHATE REDUCTASE
preferred_name: IspH/LytB HMBPP reductase family
summary: >-
  IspH (LytB) is the [4Fe-4S] enzyme that catalyses the last reaction of the methylerythritol
  phosphate (MEP) pathway, the two-electron reductive dehydration of
  (E)-4-hydroxy-3-methylbut-2-enyl diphosphate (HMBPP) to a mixture of isopentenyl diphosphate (IPP)
  and dimethylallyl diphosphate (DMAPP). The family contains bacterial IspH (E. coli, B. subtilis,
  M. tuberculosis IspH1 and IspH2, P. putida) and the apicoplast LytB of Plasmodium.
functional_coherence: COHERENT
coherence_reason: >-
  All members are in one subfamily (SF0) named for the HMBPP reductase, and the characterized members
  share the reaction. The family root also holds an unusual animal sequence (Trichoplax B3SF22) that
  no PAINT node annotates.
