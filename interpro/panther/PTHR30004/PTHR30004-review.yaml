family_id: PANTHER:PTHR30004
family_name: 4-HYDROXYTHREONINE-4-PHOSPHATE DEHYDROGENASE
preferred_name: PdxA family of metal-dependent 4-phospho-sugar-acid dehydrogenases
summary: >-
  Divalent-metal and NAD(P)-dependent dehydrogenases with an
  isocitrate-dehydrogenase-like fold. The best-characterized members are PdxA
  4-hydroxythreonine-4-phosphate dehydrogenases. PdxA oxidizes
  4-(phosphooxy)-L-threonine, and the product decarboxylates to
  3-amino-2-oxopropyl phosphate, the fourth step of the DXP-dependent de novo
  pyridoxal 5'-phosphate pathway. E. coli PdxA is the biochemically and
  structurally characterized reference. Other lineages carry paralogs named
  for different 4-phospho-sugar-acid or aromatic-diol substrates: PdxA2
  D-threonate 4-phosphate dehydrogenases, a D-erythronate 4-phosphate
  dehydrogenase, TphB terephthalate-diol dehydrogenases and ClxD
  2-carboxy-L-lyxonate decarboxylase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Parsed from the entries file (161 reviewed members): SF5 holds 79 members,
  all named 4-hydroxythreonine-4-phosphate dehydrogenase. SF6 holds 78
  members: 55 named 4-hydroxythreonine-4-phosphate dehydrogenase, 15 putative
  D-threonate 4-phosphate dehydrogenase, 4 D-threonate 4-phosphate
  dehydrogenase, 2 terephthalate-diol (1,2-dihydroxy-3,5-cyclohexadiene-
  1,4-dicarboxylate) dehydrogenase and 1 D-erythronate 4-phosphate
  dehydrogenase. SF3 holds 4 members, one of them ClxD
  2-carboxy-L-lyxonate decarboxylase. The family therefore mixes PdxA with
  paralogs that act on other substrates.
