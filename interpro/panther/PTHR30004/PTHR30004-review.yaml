  node_taxon:
    id: NCBITaxon:1224
    label: Pseudomonadota
  seeds:
  - id: UniProtKB:P19624
  assessment: SOUND
  assessment_reason: >-
    The seed is purified E. coli PdxA, whose product was identified by mass
    spectrometry and whose structure with substrate and Zn2+ is solved. The
    node is placed within Proteobacteria rather than at the family root,
    which keeps it away from the cross-phylum SF6 and SF3 paralogs. The
    E. coli and P. putida (SF5) reviews accept the activity as core. Whether
    the node also subtends proteobacterial PdxA2 paralogs of SF6 cannot be
    read from the local files; the term assessment therefore restricts the
    activity to SF5.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30004/PTHR30004-paint.tsv
    supporting_text: "PTHR30004\tPTN002408757\tGO:0050570\tF\tIBD\tfalse\tUniProtKB:P19624\ttaxon:1224"
  - reference_id: PMID:15026039
    supporting_text: >-
      Use of negative ion electrospray ionization mass spectrometry (ESI-MS) and
      tandem mass spectrometric analysis (MS-MS) confirms that AHAP is the product
      of the PdxA-catalyzed reaction.
