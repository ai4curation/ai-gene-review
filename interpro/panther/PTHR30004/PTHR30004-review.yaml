  scope: SUBFAMILY_ONLY
  scope_reason: >-
    SF5 is uniformly PdxA and holds both characterized members used by the
    DXP-dependent PLP biosynthesis module. SF6 also contains many
    PdxA-named proteins, but it mixes them with PdxA2 and TphB paralogs that
    act on other substrates, so the activity is not asserted for SF6 or SF3
    as a whole.
