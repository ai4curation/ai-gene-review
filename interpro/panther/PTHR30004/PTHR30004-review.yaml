- subfamily_id: PANTHER:PTHR30004:SF6
  label: D-THREONATE 4-PHOSPHATE DEHYDROGENASE
  description: >-
    Mixed subfamily: PdxA-named members of non-enterobacterial lineages
    (cyanobacteria, Alphaproteobacteria, Epsilonproteobacteria and others)
    together with PdxA2 D-threonate 4-phosphate dehydrogenases, a
    D-erythronate 4-phosphate dehydrogenase and TphB terephthalate-diol
    dehydrogenases.
  diverged_from_family: true
  divergence_description: >-
    Substrate specificity diverged within SF6. PdxA2 paralogs act on
    D-threonate 4-phosphate or D-erythronate 4-phosphate in acid-sugar
    catabolism, and TphB acts on an aromatic diol, so membership in SF6 does
    not by itself establish PdxA activity.
  supported_by:
