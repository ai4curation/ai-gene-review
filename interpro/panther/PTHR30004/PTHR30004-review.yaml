    supporting_text: >-
      P58718,D-threonate 4-phosphate dehydrogenase,protein,99287,Salmonella typhimurium (strain LT2 / SGSC1412 / ATCC 700720),Salmonella typhimurium (strain LT2 / SGSC1412 / ATCC 700720),pdxA2,327,PTHR30004:SF6,D-THREONATE 4-PHOSPHATE DEHYDROGENASE,True
