    2-carboxy-L-lyxonate decarboxylase.
  diverged_from_family: true
  divergence_description: >-
    Its one named characterized member, ClxD, is a decarboxylase of an acid
    sugar rather than a PLP-pathway dehydrogenase.
  supported_by:
