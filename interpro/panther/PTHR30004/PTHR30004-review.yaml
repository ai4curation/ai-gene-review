family_id: PANTHER:PTHR30004
family_name: 4-HYDROXYTHREONINE-4-PHOSPHATE DEHYDROGENASE
preferred_name: 4-Hydroxythreonine-4-Phosphate Dehydrogenase
summary: 4-HYDROXYTHREONINE-4-PHOSPHATE DEHYDROGENASE (PANTHER:PTHR30004) is characterized in PANTHER
  PAINT across 1 ancestral PTN node(s) (PANTHER:PTN002408757) with 3 IBD node assertion(s) and 0 term(s)
  carrying negated IRD/IKR branch blocks, covering 4-hydroxythreonine-4-phosphate dehydrogenase activity
  (GO:0050570, MF), pyridoxine biosynthetic process (GO:0008615, BP), pyridoxal 5'-phosphate biosynthetic
  process (GO:0042823, BP).
functional_coherence: HETEROGENEOUS
coherence_reason: Although PAINT records IBD assertion(s) for PANTHER:PTHR30004 (4-HYDROXYTHREONINE-4-PHOSPHATE
  DEHYDROGENASE) only at PANTHER:PTN002408757 (Pseudomonadota (NCBITaxon:1224)), interpro/panther/PTHR30004/PTHR30004-entries.csv
  spans multiple kingdoms and distinct catalytic activities (D-threonate 4-phosphate dehydrogenase (pdxA2,
  A0A0H3LQK8), 4-hydroxythreonine-4-phosphate dehydrogenase (pdxA, A0LIN6), Putative D-threonate 4-phosphate
  dehydrogenase (CBO2208, A5I3X9), D-erythronate 4-phosphate dehydrogenase (pdxA2, B0TBI8)), indicating
  functional heterogeneity across the family.
