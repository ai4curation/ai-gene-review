- assessed_term:
    id: GO:0071885
    label: N-terminal protein N-methyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The second activity of the same enzyme: after cleavage it methylates the new N-terminal
    phenylalanine, shown for the purified Pseudomonas enzyme and, in vivo, by the
    N-methylphenylalanine termini of PilD-processed pilins and pseudopilins. Family-wide because the
    methyltransferase motif accompanies the protease motifs throughout, but note that GOA does not
    currently annotate it for the reference protein, which the gene review proposes as a new
    annotation.
