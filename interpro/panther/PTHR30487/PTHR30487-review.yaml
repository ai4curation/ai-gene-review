    supporting_text: These studies demonstrate that the biogenesis of the apparatus of
      extracellular protein secretion and that of type IV pili share a requirement for PilD
notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the two PilD annotons (prepilin leader
  peptidase and prepilin N-methyltransferase) at PANTHER:PTHR30487, with P. aeruginosa PilD
  (P22610) and P. putida KT2440 PilD (Q88Q64) as exemplars. This is the one family of the T2SS
  machinery whose sharing with type IV pilus and competence systems is not a propagation hazard but
  a biological fact about the same protein: in P. aeruginosa a single enzyme matures both the pilins
  and the pseudopilins, so the module admits it as a maturation step without claiming that the
  enzyme is exclusive to type II secretion. The methyltransferase activity is proposed as a new
  annotation in genes/PSEAE/pilD/pilD-ai-review.yaml; it is asserted here at family scope because
  the activity accompanies the protease activity throughout the family.
