- assessed_term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  scope: UNRESOLVED
  scope_reason: >-
    Which machine a member of this family serves is a property of the organism's loci, not of the
    enzyme's sequence: PilD processes both type IV pilins and Xcp pseudopilins, the Klebsiella and
    E. coli GspO/PulO enzymes act in T2SS loci, and TcpJ acts only on the toxin-coregulated pilus.
    PAINT asserts no system-specific process term at the family node, which is the right decision;
    a member's participation in type II secretion has to be established from its own locus and
    substrates, as it is for PilD, where pilD mutants fail both to assemble pili and to export Xcp
    substrates.
  supported_by:
