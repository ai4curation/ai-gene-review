family_id: PANTHER:PTHR30487
family_name: TYPE 4 PREPILIN-LIKE PROTEINS LEADER PEPTIDE-PROCESSING ENZYME
preferred_name: Type IV prepilin peptidase/N-methyltransferases (PilD/GspO family)
summary: >-
  Bifunctional integral inner-membrane enzymes of the A24 aspartic-protease family that mature
  prepilin-type substrates. Each member removes the short basic leader peptide preceding the
  conserved glycine of a prepilin or pseudopilin, then methylates the newly exposed N-terminal
  phenylalanine using S-adenosyl-L-methionine, an activity shown to be zinc-dependent for the
  Pseudomonas enzyme. Because type IV pili, type II secretion pseudopili and competence pili all
  use prepilin-type subunits, one enzyme commonly serves several machines: P. aeruginosa PilD
  (also XcpA) processes the major pilin PilA, the minor pilins and the Xcp pseudopilins XcpT-W, so
  the same gene is required for pilus assembly and for type II secretion. Other members are
  dedicated to one system, such as the Klebsiella and E. coli GspO/PulO enzymes of T2SS loci and
  the Vibrio cholerae TcpJ of the toxin-coregulated pilus.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members are A24 prepilin peptidases in a single subfamily, with the same catalytic
  chemistry, membrane topology and substrate class. The heterogeneity in this family is in which
  machine the substrates belong to, not in what the enzyme does, which is why its PAINT node
  carries the enzymatic and location terms and no system-specific process term.
