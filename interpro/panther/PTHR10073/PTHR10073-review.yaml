family_id: PANTHER:PTHR10073
family_name: DNA MISMATCH REPAIR PROTEIN  MLH, PMS, MUTL
preferred_name: MutL/MLH/PMS mismatch repair GHKL ATPases
summary: >-
  The MutL homolog family: bacterial MutL and the eukaryotic MLH1, PMS1, PMS2,
  MLH2 and MLH3 proteins. All share an N-terminal GHKL ATPase domain and a
  C-terminal dimerization domain, and all act downstream of MutS homologs in
  mismatch repair, coupling mismatch recognition to strand incision and
  excision. A latent, metal-dependent strand-incision endonuclease with a
  DQHA(X)2E(X)4E motif in the C-terminal domain is present in eukaryotic PMS2
  (and yeast Pms1) and in the MutL proteins of bacteria that do not use Dam
  methylation and MutH, such as Pseudomonas and Bacillus. It is absent from
  MLH1 and from the MutL proteins of MutH-dependent enterobacteria, so incision
  activity is decided by the motif rather than by subfamily.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Mismatch repair participation and the GHKL ATPase are shared by the whole
  family. The endonuclease is not: SF12 (named DNA MISMATCH REPAIR PROTEIN
  MLH1) holds 456 of the 472 reviewed members, 447 of them bacterial MutL, and
  mixes endonuclease-bearing MutL (P. aeruginosa, P. putida, B. subtilis) with
  E. coli MutL and eukaryotic MLH1, which lack the motif. Eukaryotic PMS2 and
  PMS1 are in SF52/SF54 and MLH3 in SF47. PAINT places mismatch repair at the
  root, ATP hydrolysis on a bacterial node, and endonuclease activity on two
  eukaryotic nodes.
