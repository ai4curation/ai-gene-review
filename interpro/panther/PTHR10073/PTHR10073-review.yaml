notes: >-
  All MutH-independent module representatives (Q9HUL8, Q88DD1, P49850) are SF12
  members. Because SF12 also contains motif-less E. coli MutL and eukaryotic
  MLH1, a module grounding the MutL endonuclease step to PTHR10073:SF12 is
  expected to receive a FAMILY_SCOPE_RESTRICTED warning pointing at the
  endonuclease_motif site: the restriction is intrinsic and correct. Motif
  positions were located by regex on the cached UniProt sequences. Seed
  identities were checked against UniProt (P40692 MLH1, P54277 PMS1, P54278
