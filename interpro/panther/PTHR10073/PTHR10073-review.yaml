term_assessments:
- assessed_term:
    id: GO:1990238
    label: double-stranded DNA endonuclease activity
  scope: RESIDUE_DETERMINED
  determined_by_site: endonuclease_motif
  scope_reason: >-
    Strand-incision activity is decided by the DQHA(X)2E(X)4E motif, not by
    subfamily. SF12 contains both motif-bearing MutL of MutH-independent
    bacteria (P. aeruginosa, P. putida, B. subtilis), which nick duplex DNA,
    and E. coli MutL and eukaryotic MLH1, which lack the motif and have no
    incision activity of their own. Members with an intact motif are
    endonucleases; members without it are not.
  supported_by:
  - reference_id: PMID:16873062
    supporting_text: >-
      This motif is conserved in eukaryotic PMS2 homologs and in MutL proteins
      from a number of bacterial species but is lacking in MutL proteins from
      bacteria that rely on d(GATC) methylation for strand discrimination in
      mismatch repair.
