residue_sites:
- site_id: endonuclease_motif
  label: DQHA(X)2E(X)4E metal-binding endonuclease motif
  description: >-
    The conserved C-terminal-domain motif that forms the metal-binding
    endonuclease site of PMS2 and of bacterial MutL proteins in systems without
    MutH. P. aeruginosa MutL reads DMHAAHERITYE at 467-478; P. putida reads
    DMHAAHERIMYE at 466-477 and B. subtilis DQHAAQERIKYE at 462-473. The motif
    is absent from E. coli MutL (P23367), which relies on MutH for incision,
    and from MLH1. The aspartate, first histidine and first glutamate are
    needed for in vivo function of P. aeruginosa MutL, and D462N abolishes B.
    subtilis MutL nicking. The E. coli negative control position (S459) is
    the residue aligned to Q9HUL8 D467 in a global BLOSUM62 alignment; the
    C-terminal domains share only about 18% identity, so the exact register is
    approximate, but no D[QM]HA..E....E motif occurs anywhere in P23367.
  anchor:
    id: UniProtKB:Q9HUL8
    label: DNA mismatch repair protein MutL
    organism: Pseudomonas aeruginosa PAO1
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 467
    expected: [D]
    role: metal-binding aspartate of the DQHA motif
  - position: 469
    expected: [H]
    role: first histidine of the motif
  - position: 473
    expected: [E]
    role: first glutamate of the motif
  - position: 478
    expected: [E]
    role: second glutamate of the motif
  required_for:
  - term:
      id: GO:1990238
      label: double-stranded DNA endonuclease activity
    strength: REQUIRED
    rationale: >-
      Substituting the motif aspartate abolishes MutL nicking (B. subtilis
      D462N), and MutL proteins of MutH-dependent bacteria, which lack the
      motif, have no incision activity of their own. The first glutamate
      substitution in P. aeruginosa MutL inactivates the protein in vivo while
      raising its in vitro activity, so the site is required as a whole.
    supported_by:
    - reference_id: PMID:20603082
      supporting_text: >-
        Both a point mutation in the endonuclease motif (D462N) or deletion of
        the ATPase domain virtually abolished the endonuclease activity of
        BsMutL (Figure 2A).
    - reference_id: PMID:16873062
      supporting_text: >-
        is lacking in MutL proteins from bacteria that rely on d(GATC)
        methylation for strand discrimination in mismatch repair
