family_id: PANTHER:PTHR43756
family_name: CHOLINE MONOOXYGENASE, CHLOROPLASTIC
preferred_name: Rieske non-heme iron oxygenase alpha (large) subunit family
summary: >-
  Catalytic alpha subunits of Rieske non-heme iron oxygenases. Each member has an
  N-terminal Rieske [2Fe-2S] domain and a C-terminal catalytic domain with a
  mononuclear iron site, and works with a separate reductase (and sometimes a
  ferredoxin). Two reviewed subfamilies carry most characterized members. SF1 holds
  the aromatic ring-hydroxylating dioxygenase alpha subunits: benzoate (BenA),
  toluate (XylX), anthranilate (AntA, AndAc), 2-halobenzoate (CbdA), benzene,
  chlorobenzene, naphthalene, biphenyl, 2,4-dinitrotoluene and
  3-phenylpropionate/cinnamate (HcaE) dioxygenases, plus some N-demethylases and
  monooxygenases. SF5 holds Rieske monooxygenases and demethylases of quaternary
  amines and other substrates: plant choline monooxygenase, bacterial carnitine
  (YeaW/CntA) and glycine betaine monooxygenases, putrescine 2-hydroxylase,
  stachydrine N-demethylase, and also salicylate 5-hydroxylase and terephthalate
  dioxygenase. The family name comes from plant choline monooxygenase and does not
  describe SF1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Rieske cluster and the mononuclear iron are shared by the whole family, but
  the reaction (cis-dihydroxylation, monohydroxylation, N- or O-demethylation) and the
  substrate differ between subfamilies, and even within SF1, where benzoate,
  naphthalene, biphenyl and 3-phenylpropionate dioxygenases sit together. Benzoate
  1,2-dioxygenase activity is confined to the BenA equivalog (NCBIfam TIGR03229), a
  clade inside SF1 that PANTHER does not separate.
