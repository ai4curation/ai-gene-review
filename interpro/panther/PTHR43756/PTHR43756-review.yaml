term_assessments:
  - assessed_term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The Rieske [2Fe-2S] domain is a defining feature of Rieske oxygenase alpha
      subunits in every subfamily. It is the cluster that relays electrons from the
      reductase to the active-site iron.
    supported_by:
      - reference_id: PMID:1885518
        supporting_text: >-
          Conserved cysteine and histidine residues may bind a [2Fe-2S]
          Rieske-type cluster to the alpha-subunits of all the hydroxylases.
      - reference_id: PMID:12949084
        supporting_text: >-
          The α subunit of the ISP contains a Rieske-type Fe 2 S 2 center and an
          active-site mononuclear iron.
  - assessed_term:
      id: GO:0005506
      label: iron ion binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The mononuclear non-heme iron of the catalytic domain is required for O2
      activation in all Rieske oxygenases.
    supported_by:
      - reference_id: PMID:12949084
        supporting_text: >-
          The α subunit of the ISP contains a Rieske-type Fe 2 S 2 center and an
          active-site mononuclear iron.
