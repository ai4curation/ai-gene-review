        organism: Escherichia coli K-12
    diverged_from_family: true
    divergence_description: >-
      Aromatic ring cis-dihydroxylation rather than the monooxygenation and
      demethylation of the SF5 members. The subfamily itself mixes many substrate
      specificities; the benzoate-specific members correspond to NCBIfam TIGR03229.
    supported_by:
