notes: >-
  Seeds were resolved with UniProt REST (FB/MGI/PomBase/WB cross-references).
  Subfamily membership was resolved with the PANTHER geneinfo service (PANTHER 19),
  because UniProt DR PANTHER lines carry no SF for most CSL members. Descendants of
  each PTN were listed from QuickGO IBA rows with that PTN in with/from. PTHR10665:SF4
  ("RECOMBINATION SIGNAL BINDING PROTEIN FOR IMMUNOGLOBULIN KAPPA J REGION") was not
  assigned a representative because none of the checked model-organism proteins falls
  in it. No residue sites are asserted.
