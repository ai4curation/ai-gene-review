family_id: PANTHER:PTHR10665
family_name: RECOMBINING BINDING PROTEIN SUPPRESSOR OF HAIRLESS
preferred_name: CSL (CBF1/RBPJ, Suppressor of Hairless, LAG-1) transcription factors
summary: >-
  CSL proteins are sequence-specific DNA-binding transcription factors with a
  Rel-homology/beta-trefoil architecture. They recognise the GTGGGAA-type CSL
  response element and act as repressors or activators depending on the cofactors
  they recruit. In animals, the canonical CSL proteins (human and mouse RBPJ,
  Drosophila Suppressor of Hairless, C. elegans LAG-1) are the nuclear effectors of
  Notch signalling. The Notch intracellular domain binds CSL through its RAM and
  ankyrin regions and recruits Mastermind to form the activating ternary complex.
  The family is older than Notch. Fission yeast has two CSL proteins, Cbf11 and
  Cbf12, although fungi have no Notch pathway. Cbf11 binds the canonical CSL element
  and regulates cell adhesion and division. Vertebrates also have the RBPJ paralogue
  RBPJL (RBP-L), a pancreatic acinar component of the PTF1 complex that does not bind
  the Notch intracellular domain. Its activity is therefore Notch-independent.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The members share sequence-specific DNA binding and transcription-factor activity.
  That extends from the fission-yeast Cbf11/Cbf12 proteins through the metazoan
  proteins, so the molecular function is family-wide. Coupling to Notch is not. Two
  groups diverge from the Notch-effector role. (1) The fungal CSL proteins (S. pombe
  Cbf11 in SF0, Cbf12 in SF6) predate Notch and act in Notch-less organisms.
  (2) Vertebrate RBPJL (SF2) works in PTF1 without binding the Notch intracellular
  domain. Subfamily boundaries do not separate the Notch-coupled proteins cleanly.
  SF0 ("SUPPRESSOR OF HAIRLESS PROTEIN") groups fission-yeast Cbf11 with Drosophila
  Su(H), C. elegans LAG-1 and the Nematostella CSL protein. Vertebrate RBPJ is split
  across SF3 (mouse, zebrafish rbpjb, Xenopus) and SF7 (human). Any Notch-specific
  claim therefore has to be scoped by clade (PAINT node or taxon), not by subfamily.
reference_protein:
  id: UniProtKB:Q06330
  label: Recombining binding protein suppressor of hairless
  gene_symbol: RBPJ
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR10665:SF0
    label: SUPPRESSOR OF HAIRLESS PROTEIN
    description: >-
      A mixed subfamily that holds the invertebrate Notch effectors, Drosophila Su(H)
      and C. elegans LAG-1, together with the fission-yeast Cbf11. The invertebrate
      members are canonical Notch effectors. Cbf11 is a DNA-binding CSL
      transcription factor in an organism without Notch. Membership was verified
      with the PANTHER geneinfo service (PANTHER 19). The Nematostella CSL protein
      (A7S478) is also placed here by geneinfo, but the repository's member index
      resolves it only to PTHR10665, so it is not listed as a representative.
    representative_members:
      - {id: "UniProtKB:P28159", gene_symbol: Su(H), organism: Drosophila melanogaster}
      - {id: "UniProtKB:V6CLJ5", gene_symbol: lag-1, organism: Caenorhabditis elegans,
         gene_review: genes/worm/lag-1/lag-1-ai-review.yaml}
      - {id: "UniProtKB:O74954", gene_symbol: cbf11, organism: Schizosaccharomyces pombe}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR10665:SF3
    label: RECOMBINING BINDING PROTEIN SUPPRESSOR OF HAIRLESS
    description: >-
      Vertebrate RBPJ orthologues, the Notch effectors of mouse, zebrafish and Xenopus.
      Human RBPJ is placed in SF7, which has the same official label, so the SF3/SF7
      split does not correspond to any known functional difference.
    representative_members:
      - {id: "UniProtKB:P31266", gene_symbol: Rbpj, organism: Mus musculus,
         gene_review: genes/mouse/Rbpj/Rbpj-ai-review.yaml}
      - {id: "UniProtKB:A4FTT4", gene_symbol: rbpjb, organism: Danio rerio,
         gene_review: genes/DANRE/rbpjb/rbpjb-ai-review.yaml}
      - {id: "UniProtKB:Q91880", gene_symbol: rbpj, organism: Xenopus laevis}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR10665:SF7
    label: RECOMBINING BINDING PROTEIN SUPPRESSOR OF HAIRLESS
    description: Human RBPJ, the canonical mammalian Notch effector.
    representative_members:
      - {id: "UniProtKB:Q06330", gene_symbol: RBPJ, organism: Homo sapiens,
         gene_review: genes/human/RBPJ/RBPJ-ai-review.yaml}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR10665:SF2
    label: RECOMBINING BINDING PROTEIN SUPPRESSOR OF HAIRLESS-LIKE PROTEIN
    description: Vertebrate RBPJL (RBP-L), the pancreatic PTF1-complex paralogue of RBPJ.
    representative_members:
      - {id: "UniProtKB:Q9UBG7", gene_symbol: RBPJL, organism: Homo sapiens}
      - {id: "UniProtKB:O08674", gene_symbol: Rbpjl, organism: Mus musculus}
      - {id: "UniProtKB:A0A8M9QBJ6", gene_symbol: rbpjl, organism: Danio rerio}
    diverged_from_family: true
    divergence_description: >-
      RBPJL keeps CSL DNA binding and acts as the third subunit of the PTF1 trimer with
      PTF1A and a class A bHLH protein. It does not bind the Notch intracellular domain,
      so its transcriptional activity is Notch-independent. Notch pathway and
      MAML-RBPJ-NICD complex terms must not be inherited here.
  - subfamily_id: PANTHER:PTHR10665:SF6
    label: TRANSCRIPTION FACTOR CBF12
    description: Fission-yeast Cbf12, the second fungal CSL paralogue.
    representative_members:
      - {id: "UniProtKB:O74412", gene_symbol: cbf12, organism: Schizosaccharomyces pombe}
    diverged_from_family: true
    divergence_description: >-
      A fungal CSL protein in an organism without Notch. It is nuclear, can activate
      transcription, and opposes Cbf11 in cell adhesion and in coordinating nuclear
      and cell division. It has no Notch-pathway role.
node_assessments:
  - node_id: PANTHER:PTN000071433
    asserted_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    node_taxon: {id: "NCBITaxon:33154", label: Opisthokonta}
    paint_snapshot: "20241119"
    seeds:
      - {id: "FB:FBgn0004837", label: Su(H), organism: Drosophila melanogaster}
      - {id: "MGI:MGI:1196616", label: Rbpjl, organism: Mus musculus}
      - {id: "MGI:MGI:96522", label: Rbpj, organism: Mus musculus}
      - {id: "PomBase:SPCC1223.13", label: cbf12, organism: Schizosaccharomyces pombe}
      - {id: "PomBase:SPCC736.08", label: cbf11, organism: Schizosaccharomyces pombe}
      - {id: "UniProtKB:Q06330", label: RBPJ, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The seeds span the fission-yeast paralogues, the Notch-coupled metazoan proteins
      and Notch-independent RBPJL. That supports placing the ancestral DNA-binding
      transcription-factor activity at Opisthokonta. Cbf11 binds the canonical CSL
      element and both fungal proteins have transactivation potential, so the activity
      predates Notch. It is correctly placed below the Notch-specific node.
  - node_id: PANTHER:PTN000071433
    asserted_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    node_taxon: {id: "NCBITaxon:33154", label: Opisthokonta}
    paint_snapshot: "20210903"
    seeds:
      - {id: "FB:FBgn0004837", label: Su(H), organism: Drosophila melanogaster}
      - {id: "MGI:MGI:96522", label: Rbpj, organism: Mus musculus}
      - {id: "PomBase:SPCC1223.13", label: cbf12, organism: Schizosaccharomyces pombe}
      - {id: "PomBase:SPCC736.08", label: cbf11, organism: Schizosaccharomyces pombe}
      - {id: "UniProtKB:Q06330", label: RBPJ, organism: Homo sapiens}
      - {id: "WB:WBGene00002245", label: lag-1, organism: Caenorhabditis elegans}
    assessment: SOUND
    assessment_reason: >-
      Sequence-specific binding to the CSL element is shown in fungi (Cbf11) and in
      animals (RBPJ, Su(H), LAG-1). It is the conserved property of the fold.
  - node_id: PANTHER:PTN002580211
    asserted_term:
      id: GO:0007219
      label: Notch signaling pathway
    node_taxon: {id: "NCBITaxon:117571", label: Euteleostomi}
    paint_snapshot: "20250902"
    seeds:
      - {id: "MGI:MGI:96522", label: Rbpj, organism: Mus musculus}
      - {id: "UniProtKB:Q06330", label: RBPJ, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The Notch-pathway term is correctly kept inside the animal radiation, well below
      the Opisthokonta node that carries the fungal Cbf11/Cbf12 proteins. It is also
      placed on the RBPJ-orthologue clade only. Its IBA descendants (QuickGO,
      with/from PTN002580211) are vertebrate RBPJ orthologues, including human RBPJ,
      mouse Rbpj, Xenopus rbpj and zebrafish rbpjb. RBPJL is excluded, which is
      correct because RBPJL does not bind the Notch intracellular domain. The node is
      conservative rather than too deep. Drosophila Su(H) and C. elegans LAG-1 are
      bona fide Notch effectors with their own experimental annotations, but they do
      not inherit the IBA because the node sits at Euteleostomi. A deeper node (the
      metazoan CSL clade, excluding fungi and RBPJL) would also be defensible. Fungi
      must never inherit this term.
  - node_id: PANTHER:PTN002580211
    asserted_term:
      id: GO:0002193
      label: MAML1-RBP-Jkappa- ICN1 complex
    node_taxon: {id: "NCBITaxon:117571", label: Euteleostomi}
    paint_snapshot: "20180308"
    seeds:
      - {id: "UniProtKB:Q06330", label: RBPJ, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The ternary NICD-CSL-Mastermind complex is structurally defined, and the node
      excludes RBPJL, which cannot bind NICD. Vertebrate RBPJ orthologues inherit the
      term correctly. The single human seed is not a weakness: this complex is the
      best-characterised property of RBPJ.
term_assessments:
  - assessed_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    scope: FAMILY_WIDE
    scope_reason: >-
      Fungal and metazoan CSL proteins, including Notch-independent RBPJL, are
      sequence-specific DNA-binding transcription factors.
    supported_by:
      - reference_id: PMID:19101542
        supporting_text: recognizes specifically the canonical CSL response element GTGA/GGAA in vitro.
  - assessed_term:
      id: GO:0007219
      label: Notch signaling pathway
    scope: UNRESOLVED
    scope_reason: >-
      The term is safe for metazoan RBPJ/Su(H)/LAG-1 orthologues and unsafe for the
      fungal CSL proteins and for RBPJL. No PANTHER subfamily scoping expresses that
      exactly. SF0 puts fission-yeast Cbf11 in the same subfamily as fly Su(H) and
      worm LAG-1, and SF2 (RBPJL) is vertebrate. A SUBFAMILY_ONLY grant of SF0/SF3/SF7
      would therefore wrongly license Cbf11. Scope the term by clade instead: the
      PTN002580211 placement is the correct mechanism, and fungal members must be
      excluded explicitly.
    supported_by:
      - reference_id: PMID:19101542
        supporting_text: novel classes of CSL genes in the genomes of several fungal species, organisms
      - reference_id: PMID:16354684
        supporting_text: because P48 occupies the NotchIC docking site on RBP-J and RBP-L does not bind
      - reference_id: PMID:10884418
        supporting_text: Subsequently, the Caenorhabditis elegans lag-1 gene was shown to encode the Su(H)/CBF1 ortholog
