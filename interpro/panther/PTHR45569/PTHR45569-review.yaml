family_id: PANTHER:PTHR45569
family_name: SENSOR PROTEIN KDPD
preferred_name: KdpD sensor histidine kinase of the KdpD/KdpE two-component system
summary: >-
  KdpD is the membrane-bound sensor histidine kinase that, with the response
  regulator KdpE, controls expression of the kdpFABC potassium-uptake operon.
  Full-length members have a cytoplasmic N-terminal KdpD domain, four
  transmembrane segments, a cytoplasmic universal-stress-protein (Usp)-like
  and GAF region, and a C-terminal transmitter region with the
  phosphoacceptor histidine (His673 in E. coli) and the kinase catalytic
  domain. In E. coli KdpD autophosphorylates in trans within a homodimer in
  response to potassium limitation and related signals and transfers the
  phosphoryl group to KdpE. Some cyanobacterial members are truncated and lack
  the transmitter region.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  A single PANTHER subfamily (SF1). Most members, including E. coli,
  Clostridium acetobutylicum, Mycobacterium tuberculosis and Staphylococcus
  aureus KdpD and P. putida KT2440 KdpD, are full-length sensor kinases. The
  Synechocystis member P73870 is only 370 residues long, too short to contain
  the transmitter region that occupies residues 670-883 of E. coli KdpD, so
  it cannot have the kinase activity inherited from the family root.
