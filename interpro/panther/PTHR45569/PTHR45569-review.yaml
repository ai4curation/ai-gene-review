    label: phosphorelay sensor kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Canonical full-length transmitter-containing KdpD supports GO:0000155, while P73870 and Q725T9 retain
    negative judgments for that activity because they lack the required histidine transmitter. The exact
    original exception objects are archived in family-consultation/historical-scope.json and are not discarded
    biologically. Further short forms share SF1, so no exhaustive applicable-member boundary or family-wide
    grant is established. Loss of this transmitter does not imply absence of atypical serine-kinase activity.
  supported_by:
  - reference_id: PMID:9858704
    supporting_text: suggesting that the functional state of KdpD is at least a dimer and that the
      kinase reaction is a result of a trans-phosphorylation between two monomers.
