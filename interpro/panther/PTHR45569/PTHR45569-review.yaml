      domain (IPR003852), it LACKS the catalytic histidine kinase domains (HisKA/HATPase_c) required for
      actual kinase activity. Domain analysis shows DVU_3336 has only the sensory portion (aa 13-218)
      and a UspA domain (aa 243-357). The adjacent DVU3335 contains the conserved histidine kinase catalytic
      domains. The IEA annotation was generated from InterPro:IPR003852 combined with PANTHER, but this
      represents an over-annotation - having a sensor domain associated with kinases does not confer kinase
      activity itself. DVU_3336 lacks the conserved histidine kinase catalytic domains (HisKA containing
      the phosphorylatable His residue, and HATPase_c for ATP binding/hydrolysis).
