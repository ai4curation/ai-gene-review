notes: '2026-11-07: historical P73870 and Q725T9 negative GO:0000155 exceptions are retained with
  their exact original objects/quotes in family-consultation/historical-scope.json; they are represented
  in scope_reason because the current family/gene checker accepts member_exceptions only under FAMILY_WIDE
  or SUBFAMILY_ONLY, and the sole mixed SF1 does not supply an established positive scope. No biological
  negative was withdrawn merely to change scope. The older adjacent-transmitter claim for Q725T9
  is not used as unverified evidence. No universal ASK activity or membrane location is asserted.
  Full-length architectural variation, including GAF variation, must be distinguished from loss of
  the catalytic transmitter. Existing node IDs, seeds, dates and original evidence are unchanged;
  only the plasma-membrane verdict is downgraded pending placement/association evidence. The historical
  structured archive contains two GO:0000155 exceptions, not GO:0000160 exceptions. MODIFY is not
  treated as a disagreement by the checker and did not require a scope downgrade. Scope remains unresolved
  because the architecture boundary itself is not exhaustively established. Round1 structured named-member
  guards retain the canonical histidine-kinase negatives without converting unknown members into
  a universal grant.'
