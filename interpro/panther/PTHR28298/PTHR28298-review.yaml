  seeds:
  - id: CGD:CAL0000192815
  - id: SGD:S000004633
  node_taxon:
    id: NCBITaxon:4890
    label: Ascomycota
  assessment: UNRESOLVED
  assessment_reason: >-
    PTN002001648 contains S. cerevisiae EIS1, S. pombe SPCC63.14 and other
    fungal EIS1-family proteins and excludes the functionally diverged LPX2
    leaf by a 2026 IRD. The eisosome placement is well grounded for the
    Saccharomycotina branch by direct S. cerevisiae EIS1 imaging and
    C. albicans Eis1-GFP colocalization with Sur7, and fission yeast has Pil1
    cortical-filament eisosomes. Whether this EIS1 accessory-protein role
    reaches SPCC63.14 in Taphrinomycotina is unresolved.
  supported_by:
