family_id: PANTHER:PTHR28298
family_name: EISOSOME PROTEIN 1
preferred_name: Fungal EIS1 and LPX2 family
summary: >-
  PTHR28298 contains fungal EIS1-family proteins, including the eisosome
  assembly factor Eis1 and its S. cerevisiae WGD paralog YKL050C/Lpx2. PAINT
  correctly places eisosome localization and eisosome assembly on the EIS1
  branch at PTN002001648 and correctly prunes the budding-yeast LPX2 leaf by
  2026 IRDs after its divergence to a peroxisomal lipase role.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed fungal EIS1 members conserve an accessory role in eisosome
  assembly, while the S. cerevisiae WGD paralog YKL050C/LPX2 has diverged to a
  peroxisomal lipase role and has lost the Pil1/Lsp1 eisosome assignment.
