family_id: PANTHER:PTHR28298
family_name: EISOSOME PROTEIN 1
preferred_name: Fungal EIS1 and LPX2 family
summary: >-
  PTHR28298 contains fungal EIS1-family proteins, including the eisosome
  assembly factor Eis1 and its S. cerevisiae WGD paralog LPX2. PAINT
  correctly prunes the budding-yeast LPX2 leaf by 2026 IRDs after its
  divergence to a peroxisomal matrix localization, while the full
  Taphrinomycotina span of the PTN002001648 eisosome IBDs remains unresolved.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The Saccharomycotina EIS1 members conserve an eisosome-associated role, while
  the S. cerevisiae WGD paralog LPX2 has diverged to the peroxisomal matrix and
  has lost the Pil1/Lsp1 eisosome assignment. The S. pombe branch descends from
  the current PAINT node but lacks direct SPCC63.14 localization or perturbation
  evidence.
