    supporting_text: "PTHR28298\tPTN002001648\tGO:0032126\tC\tIBD\tfalse\tCGD:CAL0000192815|SGD:S000004633\ttaxon:4890\t20260424"
  - reference_id: PMID:20526336
    supporting_text: >-
      The signal from Pil1 and Ymr031c perfectly overlapped at eisosomes
  - reference_id: PMID:40294162
    supporting_text: >-
      Eis1-GFP colocalized with Sur7-mScarlet in C. albicans, but it also
      showed some signal in the cytoplasm.
  - reference_id: PMID:21900489
    supporting_text: >-
      In this study, we report that fission yeast Pil1 forms filaments both in
      vitro and in cells.
