subfamilies:
- subfamily_id: PANTHER:PTHR30115:SF11
  label: NITROGEN REGULATORY PROTEIN P-II HOMOLOG
  description: The large PII subfamily that holds E. coli GlnB together with cyanobacterial, plant and
    many archaeal PII proteins. GlnB is the canonical regulator of the NtrB kinase/phosphatase balance and
    of GlnE-catalysed adenylylation of glutamine synthetase.
  representative_members:
  - id: UniProtKB:P0A9Z1
    gene_symbol: glnB
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/glnB/glnB-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:ECOLI/glnB/glnB-uniprot.txt
    supporting_text: P-II indirectly controls the transcription of the glutamine synthetase gene (glnA).
- subfamily_id: PANTHER:PTHR30115:SF20
  label: NITROGEN REGULATORY PROTEIN GLNK
  description: GlnK paralogs, usually encoded with amtB in a glnK-amtB operon that the NtrC/sigma-54 system
    induces under nitrogen limitation. GlnK keeps the family's effector binding and NtrB regulation and,
    in addition, binds and blocks the AmtB channel when ammonium is plentiful.
  representative_members:
  - id: UniProtKB:P0AC55
    gene_symbol: glnK
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/glnK/glnK-ai-review.yaml
  - id: UniProtKB:Q88CE7
    gene_symbol: glnK
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/glnK/glnK-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:ECOLI/glnK/glnK-uniprot.txt
    supporting_text: When extracellular ammonium increases, GlnK associates tightly with AmtB in the inner
      membrane, thereby inhibiting the transporter activity
- subfamily_id: PANTHER:PTHR30115:SF13
  label: PII-LIKE PROTEIN GLNBI
  description: Archaeal GlnB-like proteins of methanogens, typified by the nif-operon-encoded NifI proteins,
    which regulate nitrogenase rather than an Ntr phosphorelay. No member has a gene review here, so the
    partner-specific terms of this subfamily are not assessed; they are treated as divergent from the
    proteobacterial NtrB-regulating members.
  diverged_from_family: true
