family_id: PANTHER:PTHR30115
family_name: NITROGEN REGULATORY PROTEIN P-II
preferred_name: PII signal transduction protein family (GlnB/GlnK)
summary: Small homotrimeric PII signal transduction proteins found in bacteria, archaea and plant plastids.
  Each subunit binds ATP or ADP and 2-oxoglutarate in the inter-subunit cleft, and a flexible T-loop that
  in proteobacteria carries the GlnD-set uridylylation mark at Tyr51 reads out nitrogen, carbon and energy
  status. PII proteins act by protein-protein interaction, regulating enzymes, transporters and transcription
  factors of nitrogen metabolism, such as the NtrB kinase/phosphatase, the GlnE adenylyltransferase and
  the AmtB ammonium channel in Escherichia coli.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Effector binding (ATP/ADP, 2-oxoglutarate) and the regulatory, partner-modulating mode
  of action are shared across the family. Partner sets differ between paralogs and lineages; in E. coli
  GlnB (SF11) mainly controls NtrB and GlnE, whereas GlnK (SF20) also blocks the AmtB channel. Archaeal
  GlnBI-type proteins (SF13) regulate nitrogenase rather than the Ntr phosphorelay. So the partner-specific
  terms are member-level, while enzyme regulator activity and regulation of nitrogen utilization hold
  family-wide.
