family_id: PANTHER:PTHR11566
family_name: DYNAMIN
preferred_name: Dynamin superfamily large GTPases
summary: Large GTPases with a dynamin G domain, a stalk (middle domain and GTPase effector domain) and
  clade-specific membrane-binding inserts. They self-assemble on membranes and use GTP to constrict, cut
  or fuse them. The family spans the animal classical dynamins (DNM1-3, Drosophila shibire, C. elegans
  dyn-1) that cut endocytic vesicles; the DRP1/DNM1L, yeast Dnm1 and worm drp-1 mitochondrial and peroxisomal
  division GTPases; fungal Vps1, an endomembrane fission dynamin; the intramitochondrial fusion GTPases
  OPA1 and Mgm1; Mx antiviral GTPases; and plant dynamin-related proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'GTP hydrolysis coupled to membrane remodelling is shared by every reviewed member.
  Process and location diverge by clade: endocytic scission, organelle division, inner-membrane fusion
  inside mitochondria, antiviral activity. IBDs for processes and locations therefore need clade-level
  placement, and two root-level location or binding IBDs and one division IBD reach the intramitochondrial
  OPA1 clade.'
