  assessment: NEEDS_PRUNING
  assessment_reason: 'Seeded by Arabidopsis AT5G42080, human DNM2 and C. elegans dyn-1 and placed at the
    family root, so every clade inherits it. The metazoan OPA1 clade (PTN000170131, 35 leaves, all SF67)
    is imported into mitochondria and acts in the intermembrane space, topologically separated from cytosolic
    microtubules. It needs an IRD. The fungal MGM1 clade (PTN008973437) is intramitochondrial in the same
    way and is a likely second case, not requested here because no MGM1 review is available to ground
    it. Elsewhere the evidence is mixed rather than negative: contextual microtubule association is reported
    for human DRP1/DNM1L, the classical-dynamin reviews differ on physiological relevance, and fungal
    Vps1 and Dnm1 have no evidence either way (their reviews mark the row over-annotated). None of that
    supports a further loss.'
