notes: >-
  Seed identifiers were resolved through UniProt cross-references. Examined: the root node PTN000170013
  and the classical-dynamin, DRP1/Dnm1, fungal Dnm1, OPA1 and fungal Mgm1 nodes, against the four reviewed
  members (human DNM1, DNM2; worm dyn-1; yeast DNM1). Not examined: the plant nodes (PTN000170389, PTN000170419,
  PTN000745927, PTN004270684, PTN004271099, PTN008520540), the Dictyostelium node PTN000170355, the Mx
  nodes, PTN002611464, PTN002611550, PTN002480314 and PTN000902186, and subfamilies SF39 (DNM1L), SF67
  (OPA1), SF217/SF46 (MX1/MX2), SF220 (Vps1) and the plant subfamilies, which have no gene reviews here.
  The node tree itself was not inspected, so the claim that the microtubule terms should sit at the classical-dynamin/phragmoplastin
  ancestor is inferred from seeds and clade functions. Gene reviews disagree on the root microtubule terms:
  human DNM1 and DNM2 keep them as non-core, worm dyn-1 and yeast DNM1 mark them over-annotated. No atlastin
  appears among the 96 reviewed UniProt members of PTHR11566.
