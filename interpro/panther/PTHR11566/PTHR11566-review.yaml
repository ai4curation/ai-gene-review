family_id: PANTHER:PTHR11566
family_name: DYNAMIN
preferred_name: Dynamin superfamily large GTPases
summary: >-
  Large GTPases with a dynamin-type G domain, a stalk and a GTPase effector domain that self-assemble
  into helices on membranes and use GTP hydrolysis to remodel them. The family holds functionally distinct
  clades: classical dynamins (DNM1-3, Drosophila shibire, C. elegans DYN-1) that cut endocytic vesicle
  necks at the plasma membrane; DRP1/Dnm1 fission dynamins that divide mitochondria and peroxisomes; OPA1/Mgm1
  inner-membrane fusion dynamins; Vps1; interferon-induced Mx antiviral proteins; and several plant DRP
  groups (phragmoplastins, ARC5, DRP3). No atlastin is among its reviewed members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared activity is GTP hydrolysis coupled to membrane remodelling, but the clades act on different
  membranes with opposite outcomes: endocytic scission at the plasma membrane (classical dynamins), outer-membrane
  division of mitochondria and peroxisomes (DRP1/Dnm1), inner-membrane fusion (OPA1/Mgm1) and antiviral
  restriction (Mx). Only GTPase activity, membrane and cytoplasm are safe family-wide. PANTHER SF212 (DYNAMIN)
  mixes classical dynamins with fungal Mgm1/msp1, so subfamily labels alone do not separate fission from
  fusion members.
