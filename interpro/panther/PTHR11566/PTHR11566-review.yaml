  assessment: TOO_DEEP
  assessment_reason: >-
    Seeded by Arabidopsis DRP1A, human DNM2 and worm DYN-1, i.e. classical dynamins and a plant phragmoplastin.
    Placement at the family root sends the term to clades with no microtubule association: the OPA1/Mgm1/msp1
    clade, whose own PAINT node (PTN007514526) places it in the mitochondrial intermembrane space and
    mitochondrial membrane, where there are no microtubules; the DNM1L/Dnm1 mitochondrial and peroxisomal
    fission clade (PTN002480309, PTN002480318), which acts on the cytoplasmic face of the organelle outer
    membrane; and the Mx antiviral clade (PTN002611415). It should sit no deeper than the ancestor of
    the classical dynamins and the plant DRP1 phragmoplastins. UniProt describes yeast Dnm1 with the legacy
    phrase "microtubule-associated force-producing protein", but its curated location is the mitochondrial
    outer membrane.
