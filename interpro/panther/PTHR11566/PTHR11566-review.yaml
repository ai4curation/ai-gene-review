  assessment: TOO_DEEP
  assessment_reason: >-
    A single seed, Drosophila shibire, a classical dynamin; a single seed is not itself the problem. In
    vitro microtubule binding is a classical-dynamin property; root placement transfers it to the OPA1/Mgm1/msp1
    clade, whose own PAINT node (PTN007514526) places it in the mitochondrial intermembrane space and
    mitochondrial membrane, where there are no microtubules; the DNM1L/Dnm1 mitochondrial and peroxisomal
    fission clade (PTN002480309, PTN002480318), which acts on the cytoplasmic face of the organelle outer
    membrane; and the Mx antiviral clade (PTN002611415). None of the reviewed fission or fusion members
    has microtubule-binding evidence, and the worm DYN-1 review judges the term over-annotated even for
    a classical dynamin.
