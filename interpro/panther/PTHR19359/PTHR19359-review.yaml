family_id: PANTHER:PTHR19359
family_name: CYTOCHROME B5
preferred_name: Cytochrome b5 family
summary: >-
  Small heme-b proteins with a C-terminal membrane anchor that transfer single electrons from NADH-cytochrome
  b5 reductase or P450 reductase to ER desaturases, sterol oxidases and cytochrome P450s. The family
  contains S. cerevisiae CYB5, S. pombe cyb502 and oca8, plant b5 isoforms and animal CYB5A.
functional_coherence: COHERENT
coherence_reason: >-
  All members are heme-binding electron carriers; isoforms differ in compartment and partner enzymes.
