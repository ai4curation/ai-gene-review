family_id: PANTHER:PTHR10489
family_name: CELL ADHESION MOLECULE
summary: This chemokine-receptor family includes receptors with different chemokine specificities and
  signaling outputs. CXCR3 recognizes C-X-C chemokines, but other branches recognize C-C or XC ligands,
  and atypical receptors handle chemokines without the same canonical signaling response. Even CXCR3 splice
  isoforms can differ in their effects on cell migration and proliferation.
functional_coherence: HETEROGENEOUS
coherence_reason: Human CXCR3 experiments cited in the reviewed UniProt record support CXCL9/CXCL10/CXCL11
  responsiveness and distinguish isoform-dependent responses. These findings do not justify C-X-C receptor
  specificity across the CCR and atypical-receptor branches. Horse transfer should retain orthology and
  isoform constraints.
