  scope: UNRESOLVED
  scope_reason: 'C-X-C chemokine receptor activity is directly supported for CXCR3 by the cited ligand-response
    studies, but it is not exclusive to the CXCR3 subfamily: the broader family also contains CXCR1, CXCR2,
    CXCR4, CXCR5 and CXCR6 branches. CCR and atypical-receptor groups must be distinguished by ligand
    and signaling mechanism. The available CXCR3 representatives do not establish an exhaustive allowed-subfamily
    set, so family-wide applicability remains unresolved without denying the characterized CXCR3 activity.'
