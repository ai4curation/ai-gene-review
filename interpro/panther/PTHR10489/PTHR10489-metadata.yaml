  name:
    name: G-protein coupled receptor 1
    short: GPCR1
  description:
  - text: The G-protein coupled receptor 1 family is characterized by its involvement
      in a wide range of physiological processes, including chemotaxis, immune response,
      inflammation, cell adhesion, and signal transduction. Members of this family
      act as receptors for various chemokines, peptides, and other ligands, triggering
      intracellular signaling cascades that regulate cellular responses such as calcium
      ion flux, cell migration, proliferation, survival, and angiogenic activity.
      They play crucial roles in the cardiovascular system, central nervous system
      development, hematopoiesis, and in the regulation of blood pressure and sodium
      retention. Some receptors also function as coreceptors for viral entry, including
      HIV, and may be implicated in the development of AIDS dementia. This family
      includes both typical signaling receptors and atypical chemokine receptors that
      modulate immune responses by sequestering, degrading, or transcytosing chemokines.
