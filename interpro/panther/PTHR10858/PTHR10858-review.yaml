  assessment: SOUND
  assessment_reason: >-
    PTN000092274 is the family root (AN0 in the PANTHER tree). It is seeded by experimentally characterized
    acid DNases from three animal phyla: human DNASE2, mouse Dnase2, fly DNaseII, and the worm paralogs
    nuc-1, crn-6 and crn-7. The eukaryote-level placement matches the evolutionary analysis of Shpak et
    al. 2008, which places the origin of DNase II in an early phagotrophic eukaryote with later multiple
    losses. The catalytic histidine (site catalytic_his below) is conserved in every member checked.
    The recipients include about 30 protist proteins (Dictyostelium, Paramecium, Trichomonas, Phytophthora)
    and two green algae. None has been assayed, but none has evidence of catalytic loss either. Both reviewed
    recipients accept this IBA: DNASE2 (human) and nuc-1 (worm). The Burkholderia members inherit the term
    only through TreeGrafter, since PAINT's reference proteomes do not include them.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10858/PTHR10858-paint.tsv
    supporting_text: "PTHR10858\tPTN000092274\tGO:0004531\tF\tIBD\tfalse"
  - reference_id: PMID:18226927
    supporting_text: strongly support the hypothesis that DNase II arose as a plesiomorphic trait in eukaryotes
  - reference_id: file:genes/human/DNASE2/DNASE2-ai-review.yaml
    supporting_text: human DNASE2 is itself one of the experimentally grounded seeds alongside mouse Dnase2a,
      fly DNaseII and worm nuc-1 paralogs
  - reference_id: file:genes/worm/nuc-1/nuc-1-ai-review.yaml
    supporting_text: NUC-1 sits inside the DNase II clade (PTHR10858:SF31, Pfam PF03265), and there is no
      sign of catalytic loss.
- node_id: PANTHER:PTN000092274
  asserted_term:
    id: GO:0006309
    label: apoptotic DNA fragmentation
  evidence: IBD
  paint_snapshot: '20220413'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  seeds:
  - id: WB:WBGene00000799
  - id: WB:WBGene00003828
  - id: WB:WBGene00007056
  assessment: TOO_DEEP
  assessment_reason: >-
    This node is seeded only by the three C. elegans paralogs (nuc-1, crn-6, crn-7). Placing the term at
    the eukaryote root sends it to every protist and algal member. In the PAINT leaf GAF that means 13
    D. discoideum, 9 D. purpureum, 7 Paramecium and 3 Trichomonas proteins, plus Chlamydomonas, Klebsormidium
    and Phytophthora. None of the seeds or the cached literature shows an apoptotic process in these
    organisms. Dictyostelium has no caspases, and its developmental cell death is not apoptotic. In
    these organisms DNase II most probably digests prey DNA. The term holds for the
    metazoan members that degrade apoptotic-cell DNA: worm NUC-1, Drosophila DNaseII and vertebrate DNase
    II-alpha (the human DNASE2 review keeps it as non-core). It should sit on a metazoan node. Among the
    subfamilies, the Dictyostelium-only groups SF22 and SF25 should not carry it. The protist members
    inside the mixed SF23 also should not, but no subfamily separates them. Whether DNase II-beta (SF2)
    should carry the term is unresolved.
