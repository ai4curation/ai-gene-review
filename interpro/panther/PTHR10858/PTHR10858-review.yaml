notes: >-
  Node identity and recipients were read from the cached PANTHER 19.0 files: PTN000092274 is AN0, the family
  root, in PAINT_TreeGrafter_Annotations_TOTAL, and the leaf IBA recipients and their taxa come from
  gene_association.paint_uniprot.gaf. The seeds were mapped to genes with UniProt. WBGene00003828 is nuc-1,
  WBGene00000799 is crn-6, WBGene00007056 is crn-7, FBgn0000477 is DNaseII and MGI:1329019 is mouse Dnase2.
  The positions of the catalytic histidine in the controls come from pairwise alignments to human DNASE2.
  A DNase II phylogenetic-profile hypothesis run (genes/human/DNASE2/DNASE2-hypotheses/dnase2-phagotroph-distribution/)
  had produced no output when this review was written, so the protist distribution here rests on Shpak
  et al. 2008 and the PAINT recipient list. PMID:34784501 (efferocytosis-induced macrophage proliferation)
  supports the SF9 module role of DNase II-alpha. It does not bear on family-level node placement, so it is
  not cited here.
