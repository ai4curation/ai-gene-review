residue_sites:
- site_id: catalytic_his
  label: DNase II catalytic histidine (C-terminal HxK motif)
  description: >-
    The histidine of the C-terminal phospholipase D-like HxK motif (DHSK in human DNASE2). UniProt annotates
    His295 as the active site. Substituting it with Ala, Lys, Asn, Arg or Ser abolishes activity but leaves
    DNA binding intact. Control positions were read from global pairwise alignments (BLOSUM62) to human
    DNASE2. The histidine is also present in DNASE2B (His305), crn-6 (His297), crn-7 (His288), Drosophila
    DNaseII (His298), plancitoxin-1 (His303) and Burkholderia BTH_II0389 (His279), all within the same
    D-H-[SA]-K block.
  anchor:
    id: UniProtKB:O00115
    label: Deoxyribonuclease-2-alpha
    gene_symbol: DNASE2
    organism: Homo sapiens
  anchor_sequence_version: 2
  residues:
  - position: 295
    expected:
    - H
    role: catalytic histidine (active site)
  required_for:
  - term:
      id: GO:0004531
      label: deoxyribonuclease II activity
    strength: CONTRIBUTES
    rationale: >-
      Catalysis needs the HxK histidine. Every substitution tested abolishes activity while DNA binding is
      kept, so the residue acts in the chemical step and does not only hold the substrate. Mutagenesis would
      justify REQUIRED. The site is held at CONTRIBUTES because no natural family member is known to have lost
      the histidine, so no negative control exists to show what loss looks like in the family.
    supported_by:
    - reference_id: file:genes/human/DNASE2/DNASE2-uniprot.txt
      supporting_text: 'H->A,K,N,R,S: Loss of activity, but not of'
  site_source: UNIPROT_FEATURE
  external_ref:
    id: UniProtKB:O00115
    source_db: UNIPROT
    source_url: https://www.uniprot.org/uniprotkb/O00115/entry#function
  positive_controls:
