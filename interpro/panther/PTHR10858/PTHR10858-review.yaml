family_id: PANTHER:PTHR10858
family_name: DEOXYRIBONUCLEASE II
preferred_name: Deoxyribonuclease II (acid DNase) family
summary: >-
  Deoxyribonuclease II (DNase II) enzymes are acid endonucleases with a phospholipase D-like
  catalytic fold. They cleave double-stranded DNA at low pH without divalent cations and leave
  3'-phosphate ends. They are secreted into the endolysosomal system, where they degrade DNA
  arriving by phagocytosis, endocytosis or autophagy. The family is eukaryotic. It is present in
  metazoans, Dictyostelium, ciliates, Trichomonas, heterokonts and some green algae, and is absent
  from plants and fungi. A small group of Burkholderia sequences most likely came from a eukaryote
  by horizontal transfer. The best-studied members are vertebrate DNase II-alpha (DNASE2), which
  digests the DNA of engulfed apoptotic cells and expelled erythroblast nuclei in macrophage
  phagolysosomes; vertebrate DNase II-beta (DNASE2B, also called DLAD); and the C. elegans
  paralogs NUC-1, CRN-6 and CRN-7, of which NUC-1 is the main acid DNase and completes the
  degradation of apoptotic-cell DNA. Divergent uses include the toxin plancitoxin-1 of the
  crown-of-thorns starfish. Dictyostelium carries a lineage-specific expansion of uncharacterized
  paralogs (subfamilies SF22 and SF25).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The molecular function is coherent. The catalytic histidine of the C-terminal HxK motif (human
  DNASE2 His295) is conserved in every member checked: the alpha and beta vertebrate enzymes, all
  three worm paralogs, Drosophila DNaseII, plancitoxin-1 and the Burkholderia protein. Deoxyribonuclease
  II activity is therefore safe family-wide. The biological process is not. Apoptotic DNA fragmentation
  applies only to the metazoan members that degrade apoptotic-cell DNA (worm NUC-1 and its paralogs,
  Drosophila DNaseII, vertebrate DNase II-alpha). It does not apply to protist and algal members.
  No apoptotic process has been shown in those organisms, and their DNase II probably serves
  digestion of prey DNA.
  DNase II-beta (SF2) acts mainly in lens fibre denucleation, and the cached literature here does
  not establish a role for it in apoptotic DNA degradation. Two Dictyostelium paralog groups (SF22,
  SF25) and the bacterial members (in SF23) are uncharacterized.
