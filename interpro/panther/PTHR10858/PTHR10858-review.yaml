    gene_symbol: Dnase2
    organism: Mus musculus
    control_position: 297
    control_residue: H
  - id: UniProtKB:Q17778
    gene_symbol: nuc-1
    organism: Caenorhabditis elegans
    gene_review: genes/worm/nuc-1/nuc-1-ai-review.yaml
    control_position: 321
    control_residue: H
term_assessments:
- assessed_term:
    id: GO:0004531
    label: deoxyribonuclease II activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The modules phagolysosomal_cargo_degradation (family level) and efferocytosis_induced_macrophage_proliferation
    (SF9) use this activity. It has been shown for vertebrate DNase II-alpha, worm NUC-1 and Drosophila DNaseII.
    The catalytic histidine is conserved in every subfamily checked, including the divergent plancitoxin-1
    and the bacterial members. The Dictyostelium paralog groups (SF22, SF25) are untested, but no evidence
    shows catalytic loss in them.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10858/PTHR10858-paint.tsv
    supporting_text: "PTHR10858\tPTN000092274\tGO:0004531\tF\tIBD\tfalse"
  - reference_id: PMID:18226927
    supporting_text: Deoxyribonuclease II (DNase II) is an endonuclease with optimal activity at low pH,
      localized within the lysosomes of higher eukaryotes.
- assessed_term:
    id: GO:0006309
    label: apoptotic DNA fragmentation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The term is safe only for metazoan subfamilies whose members degrade apoptotic-cell DNA. These are vertebrate
    DNase II-alpha (SF9), the worm paralogs (SF24, SF30, SF31) and SF23, which holds Drosophila DNaseII. SF23
    also contains protist and bacterial members for which the term is not appropriate, but no subfamily separates
    them. DNase II-beta (SF2) is left out because its documented role is in lens denucleation and is not shown
    here to be apoptotic. The Dictyostelium paralog groups (SF22, SF25) are left out because no apoptotic
    process has been shown in that organism.
