family_id: PANTHER:PTHR43103
family_name: NUCLEOSIDE-DIPHOSPHATE-SUGAR EPIMERASE
preferred_name: HldD/GmhD ADP-L-glycero-D-manno-heptose 6-epimerase family
summary: NAD(P)-dependent extended short-chain dehydrogenase/reductase epimerases acting on nucleotide-diphosphate
  sugars. The dominant subfamily is HldD (RfaD/GmhD), which epimerizes C-6 of ADP-D-glycero-beta-D-manno-heptose
  to give the L,D isomer used as the heptosyl donor for the lipopolysaccharide inner core, and the equivalent
  SepC step in actinobacterial heptose secondary-metabolite pathways. A small second subfamily holds other
  sugar 4-epimerases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 161 of 166 classified members sit in SF3, the ADP-L-glycero-D-manno-heptose-6-epimerase
  subfamily; the remaining five are in a separate 4-epimerase subfamily with a different sugar substrate
  and position.
