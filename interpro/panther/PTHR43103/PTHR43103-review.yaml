family_id: PANTHER:PTHR43103
family_name: NUCLEOSIDE-DIPHOSPHATE-SUGAR EPIMERASE
preferred_name: HldD-related NAD(P)-dependent epimerase/dehydratase family
summary: >-
  PTHR43103 is a family of extended short-chain dehydrogenase/reductase
  (NAD-dependent epimerase/dehydratase, PF01370) proteins. It is dominated by
  ADP-L-glycero-D-manno-heptose 6-epimerase (HldD/GmhD/RfaD), which
  interconverts ADP-D,D- and ADP-L,D-heptose for lipopolysaccharide inner-core
  synthesis in Gram-negative bacteria. It also contains sugar-acid
  dehydrogenases (uronate, D-erythronate, L-arabinose and glucose-6-phosphate
  dehydrogenases) and the bacterial FdeJ proteins of the fde
  naringenin-degradation locus, whose reaction is unknown.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Rossmann-fold NAD(P)-binding chemistry is shared, but the reactions
  differ (C6 epimerization of a nucleotide sugar versus oxidation of free
  sugars and sugar acids). Of 161 reviewed SF3 members, 158 are HldD, two are
  D-erythronate dehydrogenases and one is uncharacterized; the five reviewed
  SF5 members are dehydrogenases. The FdeJ proteins are classified in SF3 but
  do not receive the HldD IBA, consistent with divergence from the HldD clade.
reference_protein:
  id: UniProtKB:Q9HYQ8
  label: ADP-L-glycero-D-manno-heptose-6-epimerase
  gene_symbol: hldD
  organism: Pseudomonas aeruginosa PAO1
  gene_review: genes/PSEAE/hldD/hldD-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43103:SF3
  label: ADP-L-GLYCERO-D-MANNO-HEPTOSE-6-EPIMERASE
  description: >-
    HldD-dominated subfamily. It also contains D-erythronate dehydrogenases and
    the fde-locus FdeJ proteins (Hsero_1012, PP_3206). The FdeJ proteins lack
    the HldD-node IBA and are not ADP-heptose epimerases; their subfamily name
    must not be propagated to them.
  representative_members:
  - id: UniProtKB:Q9HYQ8
    gene_symbol: hldD
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/hldD/hldD-ai-review.yaml
  - id: UniProtKB:D8J0X4
    gene_symbol: Hsero_1012
    organism: Herbaspirillum seropedicae SmR1
    gene_review: genes/HERSS/Hsero_1012/Hsero_1012-ai-review.yaml
  - id: UniProtKB:Q88HZ6
    gene_symbol: PP_3206
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/PP_3206/PP_3206-ai-review.yaml
  diverged_from_family: false
  divergence_description: >-
    Within SF3 the FdeJ proteins diverge from the HldD function: they sit in
    flavonoid-degradation loci, receive no IBA from the HldD node, and are
    KEGG-assigned to an oxaloacetate-releasing step of naringenin catabolism.
  supported_by:
  - reference_id: file:genes/HERSS/Hsero_1012/Hsero_1012-uniprot.txt
    supporting_text: PANTHER; PTHR43103:SF3; ADP-L-GLYCERO-D-MANNO-HEPTOSE-6-EPIMERASE; 1.
  - reference_id: file:genes/HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
    supporting_text: 'KEGG mapping: `hse:Hsero_1012 -> ko:K26183` (fdeJ; naringenin degradation protein FdeJ)'
