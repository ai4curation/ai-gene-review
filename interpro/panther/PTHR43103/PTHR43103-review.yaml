notes: Reviewed for the ADP-heptose precursor biosynthesis module, which grounds its optional C-6 epimerization
  step to SF3. PAINT exposes only one node for this family, with a single E. coli seed covering both the
  activity and the LPS-core process term; the PAINT slice was fetched for this review with `just fetch-panther-paint`.
  Updated 2026-11-04 for modules/bacterial_flavonoid_degradation.yaml, adding the fde-locus FdeJ proteins
  as SF3 representatives with GO:0008712 member exceptions (SF3 keeps
  diverged_from_family false because the subfamily as a whole retains the HldD
  heptose 6-epimerase function; only individual FdeJ members diverge), and a NOT_APPLICABLE assessment for the
  submitter UDP-glucose 4-epimerase label on Hsero_1012.
