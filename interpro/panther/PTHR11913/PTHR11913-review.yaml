family_id: PANTHER:PTHR11913
family_name: COFILIN-RELATED
preferred_name: ADF/cofilin actin-filament severing family
summary: >-
  ADF/cofilin proteins are small actin-binding factors that bind actin filaments and promote
  severing and depolymerization, with activity controlled by Ser-3 phosphorylation in vertebrate
  cofilins. The actin-binding/depolymerizing core is ancient and shared by human CFL1, CFL2 and
  DSTN; branch-specific PAINT nodes add mammalian protrusion and cytokinesis annotations, plant
  actin-polymerization annotations and fungal cortical-actin annotations that should not be read as
  family-wide.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is coherent for actin filament binding and depolymerization, while a small number of
  locations and processes are lineage-specific downstream uses of that activity.
