notes: 'SOYBN/C6T1A2: requested accession C6T1A2; current record C6T1A2; sequence length 210; source cohort
  ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature
  and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER
  subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do
  not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected as ancestral
  assertions, but node placement is not adjudicated without the relevant descendant tree/alignment. No
  residue requirement is encoded without a verified sequence-version anchor. A target-level refutation
  is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification
  hypotheses rather than invented GO predictions.'
