family_id: PANTHER:PTHR47593
family_name: ZINC FINGER PROTEIN 4-LIKE
preferred_name: Plant ZFP7-related zinc-finger proteins
summary: These plant proteins contain C2H2-type zinc-finger domains. The retrieved characterized-member
  set is sparse, so specific transcriptional targets, signaling roles and localization boundaries remain
  incompletely resolved.
functional_coherence: UNKNOWN
coherence_reason: The soybean target has a C2H2 zinc finger, whereas the cited ABA and nuclear-localization
  experiment concerns ZFP3. ZFP3 evidence is a related-protein lead, not demonstration of all ZFP7-related
  proteins. Establish the target's relationship to the tested branch before transferring ABA inhibition.
