  assessment: SOUND
  assessment_reason: >-
    PAINT gives the node no taxon. Its 414 recipients in the PAINT UniProt GAF include every
    subfamily represented among the model-organism members: SF1 bacterial and fungal enolases
    (including yeast ERR1/2/3 and both S. pombe paralogs), the vertebrate alpha, beta, gamma
    and ENO4 isozymes, and the plant cytosolic and chloroplastic enolases. The 23 seeds span
    bacteria, fungi, plants, Plasmodium, Entamoeba, trypanosomatids and mammals, so the placement at
    the family root matches the distribution of the activity. The same node carries
    GO:0006096 glycolytic process and GO:0000015 phosphopyruvate hydratase complex, which are
    sound on the same grounds. The yeast ENO1, ENO2, ERR1, S. pombe eno101/eno102 and human
    ENO3 reviews all accept the activity IBA. The ERR1 review keeps glycolytic process and the
    complex as non-core, because ERR1 has never been assayed.
  supported_by:
  - reference_id: file:genes/yeast/ENO1/ENO1-ai-review.yaml
    supporting_text: PAINT IBA from enolase node PTN000224401; catalytic residues conserved; correct core MF.
  - reference_id: file:genes/yeast/ERR1/ERR1-ai-review.yaml
    supporting_text: sequence/structure; no in-vivo or purified-protein enzyme assay for ERR1 exists.
term_assessments:
- assessed_term:
    id: GO:0004634
    label: phosphopyruvate hydratase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The modules (emp_glycolysis, gluconeogenesis, glycolysis_payoff_phase) select the whole
    family for this activity, and PAINT puts it at the family root. Experimental seeds cover
    every major lineage and include yeast ERR2 and ERR3. ERR1 and ENO4 hold the activity by
    homology only. For ERR1 the active-site residues are intact, so neither is treated as an
    exception.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11902/PTHR11902-paint.tsv
    supporting_text: "PTHR11902\tPTN000224401\tGO:0004634\tF\tIBD\tfalse"
  - reference_id: file:genes/yeast/ERR1/ERR1-ai-review.yaml
    supporting_text: every canonical catalytic and metal-binding residue of the enolase family
- assessed_term:
    id: GO:0006096
    label: glycolytic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Enolase catalyses the penultimate glycolytic step in every lineage in this family. The
    modules use route-specific glycolysis terms (GO:0061615 in emp_glycolysis), which QuickGO
    now reports as obsolete in favour of GO:0006096. The parent term assessed here is the safe
    family-level process. For the uncharacterized ERR proteins it is an expectation, not an
    observation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11902/PTHR11902-paint.tsv
    supporting_text: "PTHR11902\tPTN000224401\tGO:0006096\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0000015
    label: phosphopyruvate hydratase complex
  scope: FAMILY_WIDE
  scope_reason: >-
    Enolase is an obligate Mg2+-stabilised dimer. The complex term records that quaternary
    structure and holds wherever the activity does.
  supported_by:
  - reference_id: file:genes/human/ENO3/ENO3-ai-review.yaml
    supporting_text: Enolase is obligately dimeric and Mg2+ stabilizes the dimer; the complex term
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The modules assert the cytosol for the enolase step. That holds for the glycolytic enolases
    of SF1 and the vertebrate alpha, beta and gamma isozymes (SF12, SF55, SF5, SF10). It does
    not hold for the chloroplastic plant enolase of SF42. Other plant and specialised
    subfamilies (for example SF30 ENO4, a sperm enolase) were not checked for compartment. A
    module annoton that selects the whole family for a cytosolic enzyme also selects the
    plastid isozyme.
