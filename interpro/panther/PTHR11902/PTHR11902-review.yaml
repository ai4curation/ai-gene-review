notes: >-
  IBA recipients were listed from the PAINT UniProt GAF (PANTHER 19). No IRD or IKR rows
  for this family's node were found in the PAINT IBD GAF. Subfamily assignments of
  model-organism members were read from the PANTHER 19 organism classification files.
  Modules: emp_glycolysis and gluconeogenesis (yeast representatives) and
  glycolysis_payoff_phase (human ENO3) all use the base family for GO:0004634, which this
  review supports. The one module-level overreach is the cytosol location on a whole-family
  selector, which also picks up the chloroplastic plant enolase (SF42). That does not matter
  for the yeast and human instantiations. The gene reviews (ENO1, ENO2, ERR1, eno101,
  eno102, ENO3, P. putida eno) are mutually consistent and agree with PAINT. ERR1's
  KEEP_AS_NON_CORE on glycolysis and the complex reflects missing ERR-specific data, not a
  family-level divergence. That review states that no ERR1 enzyme assay exists, yet PAINT
  lists SGD ERR2 and ERR3 (about 100% and 99.5% identical to ERR1) as experimental seeds for
  GO:0004634. The ERR1 review curator may want to check the SGD source of those annotations,
  which could bear on ERR1 as well. The vertebrate ENO4 (SF30) activity is by similarity only and was
  not checked against literature here.
