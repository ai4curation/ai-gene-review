family_id: PANTHER:PTHR11902
family_name: ENOLASE
preferred_name: Enolase (phosphopyruvate hydratase)
summary: >-
  Enolases are Mg2+-dependent dimeric enzymes that dehydrate 2-phospho-D-glycerate to
  phosphoenolpyruvate in glycolysis and catalyse the reverse hydration in gluconeogenesis.
  The family is one of the most conserved in central metabolism and contains the glycolytic
  enolases of bacteria, archaea and eukaryotes. In S. cerevisiae it includes the two abundant
  glycolytic isozymes ENO1 and ENO2 and the three near-identical subtelomeric ERR1/ERR2/ERR3
  proteins. In S. pombe it includes eno101 and eno102. In vertebrates it includes the alpha
  (ENO1), gamma (ENO2, neuronal), beta (ENO3, muscle) and sperm ENO4 isozymes, and in
  plants a plastid-targeted enolase beside the cytosolic ones.
functional_coherence: COHERENT
coherence_reason: >-
  Phosphopyruvate hydratase activity is shared across the family. PAINT places it at a single
  node seeded by bacterial, fungal, plant, apicomplexan, trypanosomatid and mammalian members,
  and every reviewed member in this repository accepts the IBA. The subfamilies separate
  isozymes and compartments, not reactions. The least characterized members are the
  yeast ERR proteins and vertebrate ENO4 (SF30). ERR2 and ERR3 are themselves PAINT seeds for
  the activity (SGD:S000006202, SGD:S000004942). ERR1 has a fully conserved active site but no
  ERR1-specific assay, and ENO4 activity is annotated by similarity. All are left inside the
  family-wide scope. The
  cytosolic location the modules use is not family-wide, because Arabidopsis ENO1 (SF42) is
  the chloroplastic isozyme.
