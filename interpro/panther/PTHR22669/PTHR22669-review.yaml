family_id: PANTHER:PTHR22669
family_name: DELTA/SERRATE/LAG-2 DOMAIN PROTEIN
preferred_name: Caenorhabditis DSL-domain Notch ligands (LAG-2 group)
summary: >-
  A Caenorhabditis-specific family (C. elegans and C. briggsae in the PANTHER 19.0
  reference tree) of small DSL-domain proteins that act as ligands for the
  nematode Notch receptors LIN-12 and GLP-1. It contains the transmembrane ligand
  LAG-2, which signals from the distal tip cell to maintain GLP-1-dependent germline
  proliferation and acts in several LIN-12-mediated cell-fate decisions; DSL-1, a
  secreted ligand lacking a transmembrane segment that contributes to the lateral
  signal in vulval patterning; and the uncharacterised DSL-2, -3, -5, -6 and -7.
  Nematode DSL ligands have a DSL domain followed by few EGF repeats and lack the
  DOS motif that Delta/Serrate EGF repeats carry; in C. elegans that DOS function is
  supplied in trans by separate secreted DOS-motif proteins such as OSM-11. Two
  members, CPG-24 (a chondroitin proteoglycan) and Y41D4B.6, have no annotated DSL
  domain. The other C. elegans DSL ligands APX-1, ARG-1 and DSL-4 are classified in
  PTHR24044 rather than here.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The DSL-domain subfamilies (SF8 LAG-2, SF1 DSL-1, SF10 DSL-2/3/5/6, SF15 DSL-7)
  are Notch ligands or predicted Notch ligands. They differ in membrane topology:
  LAG-2 and the SF10 proteins are predicted single-pass transmembrane proteins,
  while DSL-1 is secreted. Two subfamilies, SF16 CPG-24 and SF17 Y41D4B.6, carry the
  family signature but no annotated DSL domain in UniProt, and have no evidence of
  Notch ligand activity.
