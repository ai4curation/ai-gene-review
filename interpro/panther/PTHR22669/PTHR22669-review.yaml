    assessment: NEEDS_PRUNING
    assessment_reason: >-
      PTN000505678 is the family root, a duplication node within Caenorhabditis
      (PANTHER tree; the PAINT row records no taxon). Seeds from two separate
      DSL-domain subclades (LAG-2 and DSL-1) support placing Notch binding at the
      root for the DSL-domain members. The root also contains CPG-24 (SF16) and
