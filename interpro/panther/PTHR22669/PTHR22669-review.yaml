notes: >-
  This is the lineage in which part of a Notch role is filled by proteins that are
  not members of the ligand families. Drosophila Delta and Serrate carry the DOS
  motif in their own EGF repeats; C. elegans DSL ligands (this family and
  PTHR24044:SF502) lack it, and DOS-motif function is provided by separate secreted
  co-ligands (OSM-11, OSM-7, DOS-1 to DOS-3) that lack DSL domains. OSM-11 (O45346)
  is classified in PTHR35015:SF1, unrelated to this family at the PANTHER level. As
  the OSM-11 paper states, "C. elegans has two Notch receptors (lin-12 and glp-1),
  ten DSL domain proteins that lack DOS motifs [35] and five DOS-motif proteins
  without DSL domains". The ten C. elegans DSL genes are split across two PANTHER
  families: LAG-2 and DSL-1/2/3/5/6/7 here, APX-1, ARG-1 and DSL-4 in PTHR24044:SF502.
  Classification by InterPro (UniProt DR PANTHER) agrees with PANTHER's own
  classification files for lag-2 (PTHR22669:SF8) and dsl-1 (SF1). DSL-domain and
  transmembrane annotations are from UniProt feature tables (lag-2 DSL 122-166, TM
  280-306; dsl-1 DSL 120-164, no TM; cpg-24 and Y41D4B.6 no DSL domain). The PANTHER
  tree covers only C. elegans and C. briggsae, so the family's taxonomic scope is
  Caenorhabditis.
