family_id: PANTHER:PTHR11157
family_name: FATTY ACID ACYL TRANSFERASE-RELATED
preferred_name: ELO/ELOVL fatty acid elongase family
summary: >-
  ER membrane 3-ketoacyl-CoA synthases catalyse the condensation step of each fatty-acid elongation
  cycle. Paralogs differ in chain-length and saturation preference: S. cerevisiae ELO1 (C14 to C16),
  ELO2 (up to C24) and ELO3 (C26 for sphingolipids); S. pombe elo1/elo2; and mammalian ELOVL1-7,
  which cover saturated, monounsaturated and polyunsaturated acyl-CoAs.
functional_coherence: COHERENT
coherence_reason: >-
  All members are condensing enzymes of the elongation cycle. Substrate chain length and saturation
  differ between paralogs, so the substrate-class process terms are paralog-specific.
