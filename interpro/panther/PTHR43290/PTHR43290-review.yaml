notes: >-
  Revised 2026-11-18 after gene reviews of mouse, Arabidopsis, Dictyostelium and M. jannaschii mevalonate
  kinases. Tree placements and subfamily counts are from the PANTHER 19.0 tree (SF2 120 leaves, SF1 44,
  SF3 2). The glucuronokinase clade is filed under PTHR38710 elsewhere in this repository
  (interpro/panther/PTHR38710) and in UniProt's PANTHER cross-reference for GLCAK1, but the PANTHER 19.0
  tree and this family's PAINT file place it in PTHR43290 as SF1; the two family folders describe the same
  PAINT node PTN008680403. The rat ovary LH-receptor mRNA-binding activity reported for MVK (LRBP) is
  rat-specific and kept as non-core in the mouse review.
