- node_id: PANTHER:PTN000825262
  asserted_term:
    id: GO:0006695
    label: cholesterol biosynthetic process
  evidence: IBD
  paint_snapshot: '20260828'
  seeds:
  - id: MGI:MGI:107624
  - id: UniProtKB:Q03426
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Right for the vertebrate seeds (human MVK and mouse Mvk keep it as non-core), but the node is
    eumetazoan (28 leaves), so the term descends to insects, ticks and nematodes, which cannot synthesise
    sterols; Drosophila Mvk (Q7K2V9) carries this IBA. The smallest node holding all those leaves is the
    ecdysozoan clade PTN000048588 (7 leaves: Drosophila, Anopheles, Tribolium, Ixodes, C. elegans,
    C. briggsae, Pristionchus), and an IRD there stops the term without touching the vertebrate,
    cephalochordate, echinoderm or cnidarian members. The parallel case in the animal PMVK family
    (PTHR13101) is pruned the same way. If PAINT treats the arthropod and nematode auxotrophies as
    independent losses, IRDs at PTN000825275 (arthropods) and the nematode clade are the equivalent
    alternative.
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN000048588
  supported_by:
  - reference_id: file:interpro/panther/PTHR43290/PTHR43290-paint.tsv
    supporting_text: "PTHR43290\tPTN000825262\tGO:0006695\tP\tIBD\tfalse"
  - reference_id: PMID:20940226
    supporting_text: Drosophila cannot synthesize sterols, but do require them for development.
