family_id: PANTHER:PTHR43290
family_name: MEVALONATE KINASE
preferred_name: Mevalonate kinase family, with a plant glucuronokinase subfamily
summary: >-
  GHMP-kinase family whose main subfamily (SF2) holds the mevalonate kinases that phosphorylate
  (R)-mevalonate to (R)-mevalonate 5-phosphate, the first ATP-dependent step after HMG-CoA reductase in
  the mevalonate pathway. SF2 spans animals (human MVK, mouse Mvk), fungi (S. cerevisiae, S. pombe,
  C. albicans and A. fumigatus ERG12/erg12), plants (Arabidopsis MK), Dictyostelium and archaea
  (Methanocaldococcus jannaschii MJ1087). In the PANTHER 19.0 tree the family also contains subfamily SF1
  (GLUCURONOKINASE 1-RELATED), the plant sugar-1-kinases such as Arabidopsis GLCAK1 that phosphorylate
  D-glucuronate, not mevalonate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Mevalonate kinase activity holds for subfamily SF2 (120 of 166 tree leaves) and every reviewed SF2 member
  in all three domains. The identified exception is the glucuronokinase subfamily SF1 (44 leaves, clade
  PTN002214956), which PAINT already handles with an IRD that negates mevalonate kinase activity and the
  mevalonate-pathway process, and a glucuronokinase IBD at PTN008680403. Subfamily SF3 (2 leaves) is
  unreviewed. The earlier reason, "a single subfamily", was incorrect.
