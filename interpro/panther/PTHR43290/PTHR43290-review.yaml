  diverged_from_family: true
  divergence_description: >-
    The substrate has changed from mevalonate to D-glucuronate. GLCAK1 phosphorylates glucuronic acid at C1
    and has no mevalonate kinase role; PAINT negates mevalonate kinase activity and the mevalonate-pathway
    process for this clade.
