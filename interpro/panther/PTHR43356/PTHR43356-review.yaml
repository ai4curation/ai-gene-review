notes: Official family label follows panther.obo, not the integrated InterPro label or its unreviewed
  LLM description. No residue claims or evolutionary losses inferred. Tree inspected at https://pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR43356.
  The current tree has two SF1 leaves whereas the frozen reviewed-entry inventory has three; both sources
  are retained without rewriting either. A cross-check identified existing PSEPK/pta GO:0016746 marked
  over-annotated only because it is a true broad parent; that gene-policy inconsistency does not contradict
  broad acyltransferase chemistry and is outside this family edit. METEA/pta C5B1T5 is a positive inferred
  SF2 acetyltransferase, not a new direct kinetic exemplar.
