family_id: PANTHER:PTHR43356
family_name: PHOSPHATE ACETYLTRANSFERASE
preferred_name: Phosphate acyltransferases including EutD, Pta and butyryltransferases
summary: Phosphate acyltransferases interconvert acyl-CoA and acyl phosphate. EutD supplies acetyl-phosphate
  and regenerates free CoA during ethanolamine utilization, whereas related Pta proteins have broader
  cellular roles in acetate metabolism. Butyryltransferases in the same family distinguish acyl-donor
  specificity from the conserved transferase chemistry.
functional_coherence: HETEROGENEOUS
coherence_reason: The official family tree and member inventory separate EutD-related SF1, Pta-rich SF3
  and SF2 containing phosphate butyryltransferases. Ethanolamine pathway participation is not a property
  of all phosphate acyltransferases.
reference_protein:
  id: UniProtKB:P41790
  gene_symbol: eutD
  organism: Salmonella typhimurium LT2
  gene_review: genes/SALTY/eutD/eutD-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43356:SF1
  label: PHOSPHATE ACETYLTRANSFERASE EUTD
  description: EutD-related phosphate acetyltransferases. The tree contains E. coli and Salmonella EutD;
    the member inventory also includes Bradyrhizobium Q89AS7 pta, so operon-specific biological process
    cannot be inferred from the subfamily label.
  representative_members:
  - id: UniProtKB:P41790
    gene_symbol: eutD
    organism: Salmonella typhimurium LT2
    gene_review: genes/SALTY/eutD/eutD-ai-review.yaml
  - id: UniProtKB:P77218
    gene_symbol: eutD
    organism: Escherichia coli K-12
  - id: UniProtKB:Q89AS7
    gene_symbol: pta
    organism: Bradyrhizobium diazoefficiens
- subfamily_id: PANTHER:PTHR43356:SF2
  label: PHOSPHATE ACETYLTRANSFERASE
  description: Contains phosphate butyryltransferases despite the official acetyltransferase label. No
    exact donor specificity is granted to this group from the family label.
  representative_members:
  - id: UniProtKB:P58255
    gene_symbol: ptb
    organism: Clostridium acetobutylicum ATCC 824
- subfamily_id: PANTHER:PTHR43356:SF3
  label: PHOSPHATE ACETYLTRANSFERASE
  description: Pta-rich group distinct from the EutD-associated branch; cellular pathway use depends on
    the organism and locus.
  representative_members:
  - id: UniProtKB:P0A9M8
    gene_symbol: pta
    organism: Escherichia coli K-12
node_assessments:
- node_id: PANTHER:PTN000601210
  asserted_term:
    id: GO:0016746
    label: acyltransferase activity
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P0A9M8
  - id: UniProtKB:P41790
  - id: UniProtKB:P77218
  - id: UniProtKB:Q8ZND6
  assessment: SOUND
  assessment_reason: PTN000601210 is the 44-leaf family root in the official tree, spanning SF1/SF2/SF3.
    The broad acyl-transfer chemistry accommodates both acetyl- and butyryl-CoA donors; donor specificity
    differences do not contradict this IBD. It does not assert ethanolamine pathway participation or acetyl
    specificity at the root.
term_assessments:
- assessed_term:
    id: GO:0016746
    label: acyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: The conserved phosphate acyltransferase chemistry is compatible with the PAINT root placement
    across acetyl- and butyryltransferases; this does not specify an acyl donor.
  supported_by:
  - &id001
    reference_id: PMID:14996820
    supporting_text: High-pressure liquid chromatography and mass spectrometry verified that acetyl-coenzyme
      A was the product of the reaction.
  - &id002
    reference_id: PMID:26448059
    supporting_text: The reaction mixtures used to obtain the results shown in panels A–D used the phosphotransacetylase
      EutD to generate AcP from AcCoA and ortho-phosphate.
- assessed_term:
    id: GO:0008959
    label: phosphate acetyltransferase activity
  scope: UNRESOLVED
  scope_reason: Direct LT2 EutD acetyl-transfer chemistry is established, and Pta members in SF3 also
    support this activity. SF2 contains both phosphate butyryltransferases and the annotated Methylorubrum
    Pta C5B1T5; excluding all SF2 would mistake incomplete scope knowledge for a negative activity claim,
    whereas granting all SF2 acetyl specificity would ignore real donor diversity. The family schema cannot
    express a positive member subset across these mixed groups. Retain the exact acetyl activity on independently
    supported members without a family-wide or exhaustive whole-subfamily grant. Ethanolamine pathway
    membership remains a separate claim.
  supported_by:
  - *id001
  - *id002
- assessed_term:
    id: GO:0046336
    label: ethanolamine catabolic process
  scope: UNRESOLVED
  scope_reason: 'Supported for LT2 EutD by its pathway-specific CoA-recycling reaction, but not safe family-wide
    or for all SF1 members: the current member inventory includes a Bradyrhizobium pta in SF1. Exact pathway
    placement requires locus and functional evidence.'
  supported_by:
  - *id002
references:
