family_id: PANTHER:PTHR10314
family_name: CYSTATHIONINE BETA-SYNTHASE
preferred_name: Cystathionine beta-synthase / cysteine synthase PLP-enzyme family
summary: >-
  Fold-type II PLP enzymes that carry out beta-replacement on serine-derived substrates. The family
  contains cystathionine beta-synthase (CBS; S. cerevisiae CYS4, human CBS, SF194), which condenses
  serine and homocysteine in reverse transsulfuration; the bacterial and plant O-acetylserine sulfhydrylases
  (CysK, CysM), which make cysteine; and bacterial L-cysteine desulfhydrases and siderophore-precursor
  synthases (SbnA).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The beta-replacement chemistry is shared, but the activities differ by clade: CBS (SF194), cysteine
  synthase (CysK/CysM), cysteine desulfhydrase (cds1, which PAINT negates for cysteine biosynthesis
  at PTN000741516), and SbnA-type synthases.
