family_id: PANTHER:PTHR10314
family_name: CYSTATHIONINE BETA-SYNTHASE
preferred_name: Cystathionine beta-synthase / cysteine synthase PLP-enzyme family
summary: >-
  Fold-type II PLP enzymes that carry out beta-replacement on serine-derived substrates. The family
  contains cystathionine beta-synthase (CBS; S. cerevisiae CYS4, human CBS), which condenses
  serine and homocysteine in reverse transsulfuration; the bacterial and plant O-acetylserine sulfhydrylases
  (bacterial CysK and CysM, plant OAS-TL isoforms), which make cysteine; threonine synthases (ThrC,
  SF5); and bacterial L-cysteine desulfhydrases and siderophore-precursor synthases (SbnA). PANTHER
  subfamily SF194, despite its CYSTATHIONINE BETA-SYNTHASE name, holds both the eukaryotic CBS proteins
  and the bacterial CysK (cysteine synthase A) proteins. SF162 contains OAS-active CysM proteins
  and the OPS/CysO-dependent M. tuberculosis CysM; the CysM name does not establish substrate choice.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The beta-replacement chemistry is shared, but the activities differ by clade: CBS (eukaryotic
  node PTN000034107, within SF194), cysteine synthase (bacterial CysK node PTN000034535, CysM node
  PTN008497439, eukaryotic OAS-TL node PTN000034468), threonine synthase (PTN000741516, SF5, which
  PAINT negates for cysteine biosynthesis), cysteine desulfhydrase (cds1, SF135) and SbnA-type
  synthases.
