    the bacterial cysteine synthase A (CysK) proteins of E. coli, Salmonella, B. subtilis,
    M. tuberculosis and P. aeruginosa. The CBS activity is placed at the eukaryotic node
    PTN000034107 and the bacterial cysteine synthase activity at PTN000034535, so the subfamily
    name describes only part of its membership.
