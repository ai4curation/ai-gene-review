- assessed_term:
    id: GO:0004124
    label: cysteine synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    Exact OAS plus free sulfide cysteine synthase activity is supported in particular bacterial
    CysK, OAS-active CysM and eukaryotic OAS-TL members. PAINT places it at PTN000034535,
    PTN008497439 and PTN000034468, respectively. The broader cysteine-biosynthesis BP at the
    family root does not establish ancestral OAS substrate chemistry. SF194 includes both CBS
    and CysK proteins; SF162 includes OAS-active CysM proteins and OPS/CysO-specialized
    M. tuberculosis P9WP53, whose complete OAS/free-sulfide turnover remains unresolved.
    Neither family nor subfamily alone therefore defines a safe scope for this exact activity.
    Positive node and member evidence is retained. CBS proteins, threonine synthases and
    SF135 cysteine desulfhydrases have distinct demonstrated functions; the former scope-carving
    member entries are archived verbatim in the notes. This is not a claim that cysteine
    synthase activity is false family-wide. The exact historical exception objects and a separate
    P9WP53 over-annotation case are restored in the linked structured scope proof. They cannot
    be placed in active member_exceptions under UNRESOLVED without violating current checker
    semantics. SF194 is not a safe wholesale substitute: it also includes the CBS clade; the
    eukaryotic OAS-TL node spans 28 subfamilies. This unresolved enum describes the coarse
    family/subfamily boundary, not doubt about the supported E. coli or PAO1 activities.

  supported_by:
  - reference_id: file:interpro/panther/PTHR10314/PTHR10314-paint.tsv
    supporting_text: "PTHR10314\tPTN000034535\tGO:0004124\tF\tIBD\tfalse"
