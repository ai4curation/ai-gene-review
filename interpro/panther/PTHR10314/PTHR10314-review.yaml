- node_id: PANTHER:PTN008497439
  asserted_term:
    id: GO:0004124
    label: cysteine synthase activity
  evidence: IBD
  paint_snapshot: '20230309'
  seeds:
  - id: UniProtKB:P16703
  assessment: UNRESOLVED
  assessment_reason: >-
    The E. coli P16703 seed and direct P. aeruginosa Q9I526 OAS/sulfide biochemistry support
    GO:0004124 for those proteins. Thiosulfate instead yields S-sulfocysteine and is not itself
    evidence for this exact reaction. Tree placement also puts M. tuberculosis P9WP53 under
    PTN008497439 in SF162. PMID:18842002 shows slow OAS-derived aminoacrylate formation but
    strong preference for OPS and CysO-COSH; separately assayed half-reactions do not establish
    the complete OAS plus free sulfide to free cysteine reaction. PMID:18799456 reports no
    detected cysteine from OAS plus sodium sulfide under the tested conditions. Its recombinant
    construct has Thr2Ala and a residual GSH prefix, and no formal product detection limit is
    stated. Thus broad propagation of this exact activity is unresolved, not demonstrated
    impossible or globally false. Preserve the positive seed and node assertion while resolving
    the M. tuberculosis specificity; the physiological OPS/CysO pathway is distinct. The member
    GO:0004124 assignment is over-annotated, but an evolutionary loss of this exact activity is
    not established. NEEDS_PRUNING would claim such a loss under the current schema. Retain
    UNRESOLVED for this mixed node while preserving the supported positive members explicitly
    in the linked scope comparison; this is not a negative verdict on the E. coli seed.
