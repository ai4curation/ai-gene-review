term_assessments:
- assessed_term:
    id: GO:0004122
    label: cystathionine beta-synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Canonical serine-dependent CBS activity is placed at the eukaryotic node PTN000034107,
    inside SF194, which contains the reviewed canonical CBS members. Atypical OAS-dependent
    MccA in SF242 also carries a CBS name, but its demonstrated OAS/homocysteine chemistry
    does not by itself establish GO:0004122. SF194 also holds bacterial CysK proteins, which
    are cysteine synthases rather than canonical CBS and do not receive the PTN000034107 IBA;
    they are listed as member exceptions.
