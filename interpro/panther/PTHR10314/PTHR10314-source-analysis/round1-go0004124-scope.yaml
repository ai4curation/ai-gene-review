checker_join_limit: The production join uses frozen UniProt DR PANTHER subfamilies. CYS4, MYCTU Cds1 and
  MYCTU CysM have family-only raw crossreferences despite resolved tree placement. The third counterexample
  overlays only verified tree subfamilies onto temporary GeneRef objects; it does not alter raw files
  or checker behavior.
reproduction: Import check_member_exceptions and index_genes_by_family from ai_gene_review.validation.family_gene_crosscheck;
  compare a temporary term_assessments object containing historical_member_exceptions under UNRESOLVED
  versus SUBFAMILY_ONLY with SF194/SF162. Never write either hypothesis into the curated family review.
minimal_read_only_reproduction_python: "from pathlib import Path\nfrom dataclasses import replace\nimport\
  \ gzip, json, yaml\nfrom ai_gene_review.validation.family_gene_crosscheck import index_genes_by_family,\
  \ check_member_exceptions\nproof = yaml.safe_load(Path(\"interpro/panther/PTHR10314/PTHR10314-source-analysis/round1-go0004124-scope.yaml\"\
  ).read_text())\ntree = json.load(gzip.open(\".cache/panther_trees/PTHR10314.json.gz\", \"rt\"))\nby_acc\
  \ = {x[\"uniprot\"]: x for x in tree[\"leaves\"].values()}\nfamily = \"PANTHER:PTHR10314\"\nindex =\
  \ index_genes_by_family(Path(\"genes\"))\nfor scope, overlay in [(\"UNRESOLVED\", False), (\"SUBFAMILY_ONLY\"\
  , False), (\"SUBFAMILY_ONLY\", True)]:\n    test_index = {family: [replace(g, subfamily=\"PANTHER:\"\
  \ + by_acc[g.accession][\"subfamily\"]) if g.accession in by_acc else g for g in index[family]]} if\
  \ overlay else index\n    hypothesis = {\"family_id\": family, \"term_assessments\": [{\"assessed_term\"\
  : {\"id\": \"GO:0004124\"}, \"scope\": scope, \"applicable_subfamilies\": [{\"id\": family + \":SF194\"\
  }, {\"id\": family + \":SF162\"}], \"member_exceptions\": proof[\"historical_member_exceptions\"]}]}\n\
  \    print(scope, \"verified tree overlay\", overlay)\n    for result in check_member_exceptions(hypothesis,\
  \ test_index):\n        print(result)\n"
