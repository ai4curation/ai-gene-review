  reason: The positive OAS/free-sulfide functional assignment exceeds the observed complete-reaction evidence.
    Slow OAS aminoacrylate formation is a half-reaction, whereas the product assay detected no cysteine
    with OAS and sodium sulfide. OPS/CysO specificity is supported. Residual complete OAS turnover remains
    uncertain; no evolutionary loss or absolute catalytic impossibility is asserted.
  assay_limits: PMID18799456 recombinant construct has Thr2Ala and residual GSH prefix; no formal product
    detection limit is stated.
  supported_by:
  - reference_id: PMID:18842002
    supporting_text: specificity of CysM for its amino acid substrate is more than 500-fold greater for
      O-phospho-L-serine than for O-acetyl-L-serine
