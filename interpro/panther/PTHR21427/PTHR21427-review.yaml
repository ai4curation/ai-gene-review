preferred_name: COQ9 lipid-binding protein family
summary: >-
  COQ9 is a lipid-binding member of the mitochondrial CoQ synthome. It binds isoprenoid intermediates
  and presents them to the COQ7 hydroxylase, which it needs for activity (S. cerevisiae COQ9, S.
  pombe coq9, human COQ9).
