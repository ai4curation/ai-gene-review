family_id: PANTHER:PTHR11908
family_name: XANTHINE DEHYDROGENASE
preferred_name: Molybdopterin-binding hydroxylase family (XDH/aldehyde oxidase Mo domain and bacterial Mo subunits)
summary: >-
  Molybdo-flavo hydroxylases and their molybdopterin-binding subunits. The family unites
  the fused eukaryotic xanthine dehydrogenases and aldehyde oxidases (in PANTHER's own
  classification) with the separate molybdenum-cofactor subunits of split bacterial
  enzymes: XdhB of two-subunit XdhAB xanthine dehydrogenases (Rhodobacter capsulatus,
  Pseudomonas), E. coli XdhA and XdhD, PaoC aldehyde oxidoreductase, CoxL/CutL carbon
  monoxide dehydrogenases, caffeine, nicotine, nicotinate, uracil/thymine and
  4-hydroxybenzoyl-CoA reductase large subunits, and B. subtilis PucD. All carry the
  Mo-molybdopterin active site where the substrate is hydroxylated; the substrate, the
  electron acceptor and the partner subunits differ widely between branches.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The molybdopterin-dependent hydroxylase chemistry and an oxidoreductase role are
  shared, but substrate specificity is not: members oxidize purines, aldehydes, carbon
  monoxide, N-heterocycles or aromatic acyl-CoA, and a single subfamily (SF132, ALDEHYDE
  OXIDASE 1-RELATED) mixes bacterial XdhB xanthine dehydrogenase subunits with CO
  dehydrogenase, caffeine dehydrogenase and 4-hydroxybenzoyl-CoA reductase subunits and
  plant abscisic-aldehyde oxidase.
