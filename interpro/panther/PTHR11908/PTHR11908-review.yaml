subfamilies:
- subfamily_id: PANTHER:PTHR11908:SF132
  label: ALDEHYDE OXIDASE 1-RELATED
  description: >-
    Functionally mixed subfamily. Holds the XdhB molybdopterin subunits of two-subunit
    bacterial xanthine dehydrogenases (R. capsulatus O54051, P. putida KT2440 Q88F20),
    E. coli XdhA (Q46799) and XdhD (Q46814), CO dehydrogenase large chains (CoxL,
    CutL), caffeine dehydrogenase CdhA, 4-hydroxybenzoyl-CoA reductase HcrA,
    uracil/thymine dehydrogenase, nicotine and 6-hydroxypseudooxynicotine dehydrogenase
    large subunits, and Arabidopsis AAO2 and AAO3. Xanthine dehydrogenase activity
    therefore cannot be granted at the subfamily level.
