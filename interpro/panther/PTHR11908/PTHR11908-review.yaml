notes: >-
  No PAINT node assigns xanthine or hypoxanthine dehydrogenase activity to the bacterial
  XdhB subunits: the exact XDH nodes are confined to the animal fused-enzyme clades, and
  SF132, where the bacterial XdhB subunits sit, mixes purine, CO, caffeine, aromatic
  acyl-CoA and plant aldehyde substrates. Modules should therefore ground the bacterial
  XdhB role to the narrower NCBIfam/InterPro xanthine-dehydrogenase molybdopterin-subunit
  family (TIGR02965, IPR014309) rather than to a PTHR11908 subfamily, and the subunit's
  substrate activities are contributions (contributes_to) to the XdhAB complex. The
  vertebrate XDH and AOX nodes are also reached from the PTHR45444 slice, because
  UniProt cross-references the fused proteins there; they carry the same verdicts in
  that review.
