  description: >-
    B. subtilis PucD (probable xanthine dehydrogenase subunit), Eubacterium barkeri
    nicotinate dehydrogenase molybdopterin subunits, and Desulfovibrio gigas aldehyde
    oxidoreductase.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11908:SF123
  label: ALDEHYDE OXIDOREDUCTASE MOLYBDENUM-BINDING SUBUNIT PAOC
  description: E. coli PaoC periplasmic aldehyde oxidoreductase molybdenum subunit.
  diverged_from_family: true
  divergence_description: Aldehyde oxidation rather than purine oxidation.
- subfamily_id: PANTHER:PTHR11908:SF80
  label: XANTHINE DEHYDROGENASE_OXIDASE
  description: >-
    Vertebrate fused xanthine dehydrogenase/oxidase in PANTHER's own classification
    (the PAINT XDH node PTN002628834 sits here). UniProt cross-references the same
    proteins, such as human XDH P47989, to PTHR45444:SF3, so no representative member
    is declared at this subfamily.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11908:SF86
  label: ALDEHYDE OXIDASE
  description: >-
    Vertebrate fused aldehyde oxidases in PANTHER's own classification (PAINT node
    PTN002628818); UniProt cross-references them to PTHR45444:SF3.
  diverged_from_family: true
  divergence_description: Aldehyde oxidase rather than xanthine dehydrogenase.
