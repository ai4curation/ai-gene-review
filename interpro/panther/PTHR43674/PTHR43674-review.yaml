family_id: PANTHER:PTHR43674
family_name: NITRILASE C965.09-RELATED
preferred_name: Nitrilase-superfamily amidase and beta-ureidopropionase family
summary: >-
  Nitrilase-superfamily (CN hydrolase) enzymes with a Cys-Glu-Lys catalytic triad that hydrolyze linear
  amides. Members include the eukaryotic beta-ureidopropionases (beta-alanine synthases; human UPB1 and
  its animal, plant and Dictyostelium orthologs), which complete reductive pyrimidine degradation; plant
  and bacterial N-carbamoylputrescine amidases of polyamine synthesis; bacterial aliphatic amidases and
  formamidases; N-carbamoyl-D-amino-acid hydrolases; the Pseudomonas DavA 5-aminopentanamidase of lysine
  catabolism; citrullinase; and a few putative nitrilases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The amidase chemistry is shared but substrates differ by subfamily and within SF2. SF2, named BETA-UREIDOPROPIONASE,
  combines the eukaryotic UPB1 enzymes with N-carbamoylputrescine amidases, citrullinase, the DavA 5-aminopentanamidase,
  a Pseudomonas pqqF-region hydrolase and an archaeal putative nitrilase; beta-ureidopropionase activity
  is confined to the eukaryotic clade below PAINT node PTN000557641.
