  - id: SGD:S000006225
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN000640306 is the aspartate/glutamate carrier (AGC, PTHR45678) node; its seeds are the AGC
    proteins (human SLC25A12/Aralar O75746, SLC25A13/citrin Q9UJS0, yeast AGC1 S000006225).
    PANTHER's classification files place ODC1 (Q03028) in PTHR45678:SF1 under this node, while
    UniProt places it in PTHR46356:SF1, so the ODCs inherit the AGC assertions. ODC1 and ODC2
    exchange 2-oxoadipate and 2-oxoglutarate, and both gene reviews remove the inherited
    aspartate/glutamate transporter rows. The assertion should not reach the ODC subfamily.
  affected_subfamilies:
  - id: PANTHER:PTHR46356:SF1
    label: MITOCHONDRIAL 2-OXODICARBOXYLATE CARRIER
  supported_by:
