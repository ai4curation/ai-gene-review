family_id: PANTHER:PTHR46356
family_name: MITOCHONDRIAL 2-OXODICARBOXYLATE CARRIER
preferred_name: Mitochondrial 2-oxodicarboxylate carrier (ODC/SLC25A21) family
summary: >-
  SLC25 mitochondrial carriers that exchange 2-oxoadipate and 2-oxoglutarate across the inner membrane
  (human SLC25A21, S. cerevisiae ODC1 and ODC2), linking mitochondrial lysine metabolism and nitrogen
  assimilation.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1).
