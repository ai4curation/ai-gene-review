family_id: PANTHER:PTHR28015
family_name: ATP SYNTHASE ASSEMBLY FACTOR FMC1, MITOCHONDRIAL
preferred_name: Fungal Fmc1 ATP synthase assembly factors
summary: >-
  PTHR28015 contains fungal Fmc1-family mitochondrial accessory factors. The
  characterized Saccharomyces cerevisiae Fmc1 protein is a soluble mitochondrial
  matrix protein required at elevated temperature for assembly or stability of the
  F1 sector of mitochondrial ATP synthase, and the absence of Fmc1 can be
  compensated by increased Atp12 expression. The current fungal PAINT node uses
  the budding-yeast FMC1 seed to infer mitochondrial matrix localization and
  mitochondrial proton-transporting ATP synthase complex assembly across this
  compact family, including Schizosaccharomyces pombe fmc1; those two transfers
  match the S. pombe gene review and are sound family-level assertions.
functional_coherence: COHERENT
coherence_reason: >-
  Local members of PTHR28015 are short fungal Fmc1-family proteins in the single
  SF1 subfamily, and the two current PAINT assertions match the family-defining
  S. cerevisiae Fmc1 matrix localization and complex-V F1 assembly role.
