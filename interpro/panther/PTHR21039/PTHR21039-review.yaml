family_id: PANTHER:PTHR21039
family_name: HISTIDINOL PHOSPHATASE-RELATED
preferred_name: PHP-family histidinol-phosphatase (HisJ/HIS2) family
summary: >-
  PHP-domain metallophosphatases that dephosphorylate L-histidinol phosphate, the penultimate step
  of histidine biosynthesis (Bacillus HisJ, S. cerevisiae HIS2, S. pombe SPCC1672.01).
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF0) of histidinol-phosphatases; every one of the 8 inventory members is in SF0,
  and both experimentally characterized members (B. subtilis HisJ, S. cerevisiae HIS2) are HolPases.
