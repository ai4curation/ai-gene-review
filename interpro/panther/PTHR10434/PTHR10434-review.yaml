family_id: PANTHER:PTHR10434
family_name: 1-ACYL-SN-GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE
preferred_name: 1-Acylglycerol-3-phosphate O-acyltransferase (AGPAT/PlsC/LPAAT) family
summary: >-
  Lysophosphatidic acid acyltransferases transfer an acyl chain from acyl-CoA or acyl-ACP to the
  sn-2 position of lysophosphatidic acid, making phosphatidic acid for glycerolipid synthesis. The
  family contains bacterial PlsC, fungal SLC1 (S. cerevisiae SLC1, S. pombe SPAC1851.02), plant LPAT1,
  and animal AGPAT1/2.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed subfamilies are LPA acyltransferases, differing mainly in acyl-donor and acyl-chain
  preference.
