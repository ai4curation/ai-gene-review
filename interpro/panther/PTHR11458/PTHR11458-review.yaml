family_id: PANTHER:PTHR11458
family_name: DELTA-AMINOLEVULINIC ACID DEHYDRATASE
preferred_name: Porphobilinogen synthase (ALAD/HemB/HEM2) family
summary: >-
  Porphobilinogen synthases condense two molecules of 5-aminolevulinate to porphobilinogen, the first
  common step of tetrapyrrole synthesis. Animal and fungal enzymes are zinc-dependent, plant and
  many bacterial ones Mg2+. The family contains bacterial HemB, S. cerevisiae HEM2, S. pombe hem2
  and human ALAD.
functional_coherence: COHERENT
coherence_reason: All subfamilies are porphobilinogen synthases, differing in metal cofactor.
