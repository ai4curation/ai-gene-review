family_id: PANTHER:PTHR13693
family_name: CLASS II AMINOTRANSFERASE/8-AMINO-7-OXONONANOATE SYNTHASE
preferred_name: PLP-dependent alpha-oxoamine synthases (BioF, serine palmitoyltransferase, 5-aminolevulinate synthase, KBL/GCAT)
summary: >-
  The alpha-oxoamine synthase (AOS) family of pyridoxal 5'-phosphate (PLP)-dependent enzymes.
  Each condenses an amino acid with an acyl-CoA or acyl-ACP thioester, releasing CO2 (or, for
  KBL, cleaving the reverse way). The family includes several functionally distinct enzymes.
  8-Amino-7-oxononanoate (KAPA) synthase, BioF, condenses L-alanine with pimeloyl-ACP or
  pimeloyl-CoA in biotin synthesis. Serine palmitoyltransferase (SPT) condenses L-serine with
  palmitoyl-CoA, the committed step of sphingolipid synthesis. Eukaryotic SPT is a heterodimer
  of the non-catalytic LCB1/SPTLC1 subunit and the PLP-binding LCB2/SPTLC2/SPTLC3 subunit;
  bacterial SPT is a homodimer. 5-Aminolevulinate synthase (ALAS) condenses glycine with
  succinyl-CoA, the first step of heme synthesis in animals, fungi and alpha-proteobacteria.
  2-Amino-3-ketobutyrate CoA ligase (KBL/GCAT) works in threonine catabolism. Further members
  make bacterial signalling molecules (Vibrio CqsA, for the CAI-1 autoinducer) and fungal
  secondary metabolites (FUM8, ALT4, sphA).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The members share the AOS chemistry, but the substrates and pathways differ completely: biotin
  (BioF), sphingolipids (SPT), heme (ALAS), threonine catabolism (KBL/GCAT), quorum-sensing
  autoinducer (CqsA) and polyketide/secondary metabolism (FUM8, ALT4, sphA, PigH). PANTHER
  subfamilies only partly follow these lines. SF3 (LD36009P) mixes eukaryotic SPT large subunits
  (S. cerevisiae LCB2, S. pombe lcb2, Arabidopsis LCB2a/b) with bacterial SPT, Bacillus and
  Thermotogae BioF, Bacillus KBL and fungal secondary-metabolism enzymes. SF102 mixes fungal and
  alpha-proteobacterial ALAS with KBL and GCAT. SF77 mixes plant, fungal, archaeal and
  Helicobacter BioF with Aspergillus sphA. SF100 (proteobacterial BioF) also holds Vibrio CqsA. No
  activity term is safe at family level, and most are not safe at subfamily level either.
