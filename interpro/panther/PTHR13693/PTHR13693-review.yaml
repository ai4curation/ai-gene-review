notes: >-
  Modules. (1) biotin_biosynthesis uses SF100 for bacterial BioF and SF77 for the peroxisomal
  fungal BioF. SF100 also contains Vibrio CqsA. SF77 is not a fungal PTS1 subfamily, contrary to
  the module's preferred_term "fungal PTS1-bearing BioF subfamily": it also holds plant,
  archaeal, Aquifex and Helicobacter BioF and the Aspergillus/Byssochlamys sphA
  sphingofungin enzymes. (2) sphingolipid_de_novo_synthesis uses SF2 for SPTLC1/LCB1 with
  GO:0004758 and the role_description "Catalytic subunit of SPT". That conflicts with the LCB1
  and SPTLC1 reviews, which treat LCB1/SPTLC1 as the non-catalytic partner (contributes_to). The
  module uses the whole family PTHR13693 for SPTLC2/LCB2, which over-selects; no single
  subfamily works because S. cerevisiae LCB2 and S. pombe lcb2 are in the mixed SF3. The module's
  note "LCB1/lcb1 and LCB2/lcb2 are in PTHR13693 (SF2/SF3)" is accurate. (3) heme_biosynthesis
  cites PTN000343737 but selects with InterPro IPR010961, which is consistent with this review.
  Gene reviews: HEM1, ALAS2, LCB1, LCB2, SPTLC1 and SPTLC2 accept their activity IBAs. LCB1 and
  LCB2 MODIFY GO:0046512 to GO:0046520, which is reflected in the node assessment. Human SPTLC1
  receives no GO:0004758 IBA in the cached PAINT UniProt GAF, although PTN000343996 carries it
  in the 2026-08-28 paint.tsv row (a snapshot difference). The bacterial KBL node
  PTN008550595 (GO:0008890, GO:0005829) and the GCAT mitochondrion node PTN008550589 have no
  reviewed member in this repo and are not assessed. Node membership was checked in the PAINT
  UniProt GAF, and CqsA identity in UniProt (Q9KM65 "CAI-1 autoinducer synthase", SF100), on
  2026-10-06.
