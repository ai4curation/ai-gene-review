family_id: PANTHER:PTHR11035
family_name: VERY-LONG-CHAIN (3R)-3-HYDROXYACYL-COA DEHYDRATASE
preferred_name: Very-long-chain 3-hydroxyacyl-CoA dehydratase (PHS1/HACD/PAS2) family
summary: >-
  ER membrane 3-hydroxyacyl-CoA dehydratases catalyse the third step of each fatty-acid elongation
  cycle, dehydrating very-long-chain (3R)-3-hydroxyacyl-CoA to trans-2-enoyl-CoA. The family contains
  S. cerevisiae PHS1, S. pombe phs1, Arabidopsis PAS2 and human HACD1-4.
functional_coherence: COHERENT
coherence_reason: All subfamilies are VLC 3-hydroxyacyl-CoA dehydratases.
