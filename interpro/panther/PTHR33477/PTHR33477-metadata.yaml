  name:
    name: 2-phosphoglycerate kinase
    short: 2PG_kinase
  description:
  - text: The 2-phosphoglycerate kinase family comprises enzymes that play a crucial
      role in the biosynthesis of cyclic 2,3-bisphosphoglycerate, a compound that
      functions as a thermoprotectant. Members of this family are responsible for
      catalyzing the phosphorylation of 2-phosphoglycerate to produce 2,3-diphosphoglycerate.
      This reaction is a key step in the metabolic pathway that leads to the formation
      of cyclic 2,3-bisphosphoglycerate, which helps organisms, particularly extremophiles,
      to withstand high-temperature environments. Additionally, some proteins within
      this family are involved in the accumulation of phytic acid in seeds, which
      is the primary storage form of phosphorus in cereal grains and other plant seeds.
      This suggests a dual functionality for the family, with roles in both thermoprotection
      and nutrient storage.
