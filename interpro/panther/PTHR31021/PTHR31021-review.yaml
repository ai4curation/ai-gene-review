    Direct binding to WNT ligands (human APCDD1 to WNT3A in PMID:20393562; mouse APCDD1 ECD
    to WNT7A via its ~350 A^3 ABD2 hydrophobic pocket in PMID:37155902) is experimentally
    established in PANTHER:PTHR31021:SF2. InterPro entry IPR042425 propagates GO:0017147
    across the entire family onto SF3 (APCDD1L), where direct ligand binding remains
    untested despite structural threading suggesting a preserved ABD2 pocket.
  supported_by:
  - reference_id: PMID:37155902
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
  - reference_id: PMID:37155902
    supporting_text: At present, the function of APCDD1L is unknown.
