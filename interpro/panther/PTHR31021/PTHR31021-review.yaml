- subfamily_id: PANTHER:PTHR31021:SF2
  clade_node_id: PANTHER:PTN002826827
  label: PROTEIN APCDD1
  description: >-
    Vertebrate APCDD1 orthologs (including human APCDD1, mouse Apcdd1, chicken APCDD1,
    Xenopus laevis apcdd1, and Xenopus tropicalis apcdd1). Full-length APCDD1 is a
    ~58-68 kDa N-glycosylated single-pass type I plasma-membrane protein that
    self-associates via its transmembrane region, captures lipidated WNT ligands through a
    large (~350 A^3) hydrophobic pocket in its second extracellular beta-barrel domain
    (ABD2), and cell-autonomously inhibits Wnt signaling (and in early embryos and cultured
    cells, BMP receptor signaling via BMPR1A) across hair follicles, neural progenitors, CNS
    vascular endothelium, and embryonic axis patterning.
  representative_members:
