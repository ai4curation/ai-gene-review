  scope_reason: >-
    Negative regulation of Wnt signaling is established across tetrapod SF2 orthologs
    (human APCDD1, mouse Apcdd1, and Xenopus laevis apcdd1) and accurately scoped to SF2 by
    PAINT node PTN002826827. Although Danio rerio apcdd1l restricts maternal Wnt8 activity
    during zebrafish gastrulation (PMID:32320685), mammalian APCDD1L (SF3, UniProtKB:Q8NCL9)
    evolves at a several-fold higher substitution rate and remains functionally
    uncharacterized (PMID:37155902), so InterPro IPR042425 family-wide IEA propagation onto
    uncharacterized mammalian SF3 members is premature.
  supported_by:
  - reference_id: PMID:20393562
    supporting_text: Reporter activity induced by WNT3A alone, or in combination with LRP5/Fzd2, was downregulated ~2-fold by APCDD1 in a dose-dependent manner (Fig. 2b), indicating that APCDD1 inhibits the Wnt/β-catenin pathway.
  - reference_id: PMID:37155902
    supporting_text: At present, the function of APCDD1L is unknown.
