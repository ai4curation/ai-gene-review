    organism: Xenopus tropicalis
    gene_review: genes/XENTR/apcdd1/apcdd1-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:20393562
    supporting_text: Collectively, these data reveal that APCDD1 is likely a membrane-tethered Wnt inhibitor that acts as a dimer at the surface of the Wnt-receiving cell.
  - reference_id: PMID:37155902
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
- subfamily_id: PANTHER:PTHR31021:SF3
  label: PROTEIN APCDD1-LIKE
  description: >-
    Vertebrate APCDD1-like (APCDD1L) paralogs present alongside APCDD1 across nearly all
    vertebrate genomes at ~50% amino-acid identity (represented among reviewed Swiss-Prot
    entries by human APCDD1L UniProtKB:Q8NCL9). Sequence threading of rat APCDD1L onto the
    mouse APCDD1 crystal structure indicates retention of the tandem ABD1/ABD2 12-cysteine
    architecture and a predicted ABD2 lipid-accommodating cavity together with an N-terminal
    signal sequence and C-terminal transmembrane helix, but SF3 evolves at a several-fold
    higher amino-acid substitution rate than SF2 and mammalian APCDD1L remains functionally
    uncharacterized.
  representative_members:
  - id: UniProtKB:Q8NCL9
    gene_symbol: APCDD1L
    organism: Homo sapiens
    gene_review: genes/human/APCDD1L/APCDD1L-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Compared with APCDD1 (SF2), APCDD1L (SF3) evolves at a several-fold higher substitution
    rate across vertebrates and lacks experimental characterization in mammals (human
    APCDD1L transcripts were not detected alongside APCDD1 in scalp hair follicles in
    PMID:20393562, and Hsieh et al. 2023 explicitly state that the function of APCDD1L is
    unknown). Although maternal-zygotic Danio rerio apcdd1l morphants and TALEN mutants
    display early Wnt and late-gastrula BMP axis-patterning defects (PMID:32320685), direct
    WNT ligand binding, Wnt pathway inhibition, and plasma-membrane residence have not been
    demonstrated for mammalian SF3 proteins.
  supported_by:
  - reference_id: PMID:37155902
    supporting_text: 'Nearly all vertebrate genomes code for two APCDD1 homologous sequences: APCDD1 and APCDD1-like (APCDD1L), which exhibit ~50% amino acid identity throughout their length (SI Appendix, Fig. S6). The APCDD1L sequences retain the principal features of the APCDD1 sequence, including the 12 conserved and disulfide-bonded cysteines (SI Appendix, Fig. S6). Interestingly, APCDD1L amino acid sequences show a several-fold greater rate of evolutionary change compared to APCDD1 sequences, as seen in the dendrogram in SI Appendix, Fig. S7A. Threading the rat APCDD1L sequence into the mouse APCDD1 structure suggests that APCDD1L adopts very nearly the same structure, with an ABD2 pocket that can also accommodate a lipid (SI Appendix, Fig. S7). At present, the function of APCDD1L is unknown.'
  - reference_id: PMID:32320685
    supporting_text: Because APCDD1 also acts as a Wnt-antagonist in diverse vertebrate species (Shimomura et al., 2010), the dorsalized phenotype observed here likely reflects disruption of the role of Apcdd1l in restricting maternal Wnt8, a key determinant of the zebrafish organizer (Lu et al., 2011).
