family_id: PANTHER:PTHR31021
family_name: ADENOMATOSIS POLYPOSIS COLI DOWN-REGULATED 1
preferred_name: APCDD1 and APCDD1L tandem beta-barrel transmembrane signaling regulators
summary: >-
  PANTHER family PTHR31021 (InterPro IPR042425) comprises animal proteins sharing a tandem
  antiparallel beta-barrel extracellular domain architecture (ABD1 and ABD2; Pfam PF14921 /
  IPR029405) oriented approximately 90 degrees apart and stabilized by six conserved
  disulfide bonds (12 cysteines, including the interdomain Cys52-Cys466 disulfide bridge)
  together with conserved N-linked glycans. PANTHER 19.0 defines three subfamilies:
  PANTHER:PTHR31021:SF1 (CHROMOSOME UNDETERMINED SCAFFOLD_56, WHOLE GENOME SHOTGUN SEQUENCE,
  an uncharacterized non-reference shotgun-scaffold subfamily with no reviewed Swiss-Prot
  members), PANTHER:PTHR31021:SF2 (PROTEIN APCDD1), and PANTHER:PTHR31021:SF3 (PROTEIN
  APCDD1-LIKE); nearly all vertebrate genomes encode both APCDD1 (SF2) and APCDD1L (SF3)
  paralogs at ~50% amino-acid identity. Within SF2, APCDD1 is a direct transcriptional
  target of canonical Wnt/beta-catenin-TCF4 signaling that localizes to the plasma membrane
  of ligand-receiving cells and functions as a feedback negative regulator of Wnt signaling
  and, through BMPR1A interaction, BMP signaling. Crystal structures of the mouse APCDD1
  extracellular domain (PDB:8E0P, 8E0R, 8E0W) reveal a ~350 A^3 hydrophobic pocket inside
  ABD2 that co-purifies with stearic acid and accommodates palmitoleate, supporting
  detergent-sensitive binding to lipidated WNT ligands (WNT3A, WNT7A) rather than to the
  extracellular PE1-4 domains of LRP5 or LRP6. By contrast, SF3 (APCDD1L) evolves at a
  several-fold higher amino-acid substitution rate and, although Danio rerio apcdd1l
  restricts maternal Wnt and late-gastrula BMP signaling during embryonic axis patterning,
  mammalian APCDD1L (UniProtKB:Q8NCL9) remains biochemically and cellularly uncharacterized,
  so Wnt-binding, Wnt-inhibitory, and plasma-membrane terms are safely asserted only for SF2
  until mammalian SF3 orthologs are experimentally tested.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Reviewed vertebrate PTHR31021 members in SF2 and SF3 share a conserved signal peptide,
  tandem ABD1/ABD2 12-cysteine extracellular fold, and C-terminal single-pass transmembrane
  helix (supporting family-wide GO:0016020 membrane), while PANTHER:PTHR31021:SF1 contains
  no reviewed Swiss-Prot or reference-proteome entries. However, experimental evidence for
  plasma-membrane localization (GO:0005886), direct Wnt-protein binding (GO:0017147), and
  negative regulation of Wnt signaling pathway (GO:0030178) in tetrapods is confined to
  PANTHER:PTHR31021:SF2 (APCDD1), which matches PAINT ancestral node PTN002826827.
  PANTHER:PTHR31021:SF3 (APCDD1L) exhibits a several-fold accelerated substitution rate and
  mammalian APCDD1L (UniProtKB:Q8NCL9) has no experimental localization, ligand-binding, or
  pathway-signaling characterization despite zebrafish apcdd1l acting in embryonic Wnt/BMP
  patterning; InterPro family-level signature IPR042425 therefore over-propagates SF2
  functional and plasma-membrane annotations onto uncharacterized mammalian SF3 members.
