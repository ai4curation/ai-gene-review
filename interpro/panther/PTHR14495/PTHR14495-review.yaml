family_id: PANTHER:PTHR14495
family_name: SHIELDIN COMPLEX SUBUNIT 2
preferred_name: SHLD2 shieldin DNA-repair subunits
summary: SHLD2 is a component of shieldin, a DNA-end protection complex acting in double-strand-break
  repair. Its DNA-associated and complex-assembly functions regulate access of repair machinery to damaged
  DNA. Shieldin participation is mechanistically distinct from DNA synthesis, helicase activity or nuclease
  activity.
functional_coherence: COHERENT
coherence_reason: Shieldin interaction mapping identifies SHLD2/FAM35A within the complex, and perturbation
  links shieldin to protection of DNA ends from resection and promotion of end joining (PMID:29656893).
  The coherent family role is an end-protection complex component. Effects on repair-pathway choice do
  not make SHLD2 a nuclease, DNA polymerase or helicase; immunoglobulin class switching is a vertebrate
  cellular context rather than a universal property.
