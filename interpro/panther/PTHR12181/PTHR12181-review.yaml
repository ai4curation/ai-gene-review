family_id: PANTHER:PTHR12181
family_name: LIPIN
preferred_name: Lipin phosphatidate phosphatase (PAH1/LPIN) family
summary: >-
  Lipins are Mg2+-dependent phosphatidate phosphatases (PAP1) that dephosphorylate phosphatidic acid
  to diacylglycerol on the ER and nuclear membrane, directing glycerolipid flux to triacylglycerol
  and phospholipid synthesis. They are regulated by phosphorylation and membrane recruitment. The
  family contains S. cerevisiae PAH1, S. pombe ned1, plant PAH1/2 and human LPIN1-3; mammalian lipins
  also act as transcriptional coactivators.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are PAP1 enzymes; the transcriptional coactivator role is specific to vertebrate
  lipins.
