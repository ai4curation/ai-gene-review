  name:
    name: Intracellular cholesterol transporter
    short: Intracell_cholesterol_trans
  description:
  - text: This family of proteins is primarily involved in intracellular cholesterol
      transport and homeostasis. Members of this family play crucial roles in the
      egress of cholesterol from endosomal/lysosomal compartments, often acting in
      concert with other proteins such as NPC2. They are involved in the uptake of
      cholesterol across the plasma membrane and may also transport other lipids,
      influencing lipid metabolism regulation. Some family members are implicated
      in vesicular trafficking processes that are essential for the maintenance of
      nerve terminals. Additionally, certain proteins in this family have been identified
      as receptors for pathogens, contributing to microbial infection mechanisms.
      They contain a cysteine-rich N-terminal domain and a C-terminal domain necessary
      for lysosomal targeting.
