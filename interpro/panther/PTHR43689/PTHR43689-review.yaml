family_id: PANTHER:PTHR43689
family_name: HYDROLASE
preferred_name: Alpha/beta-hydrolase fold hydrolases (MhpC/EphH/BODYGUARD-type)
summary: >-
  A large family of alpha/beta-hydrolase-fold (AB hydrolase-1) enzymes, dominated by
  uncharacterized plant proteins. Characterized members include the bacterial meta-cleavage
  product hydrolases (E. coli MhpC, P77044), mycobacterial epoxide hydrolase EphH (O53388) and
  the steroid-ring hydrolase HsaD (P9WNH5). Plant members include the Arabidopsis BODYGUARD
  lysophospholipase/cutin-synthesis proteins and the plastid tocopherol-pathway hydrolase VTE7.
  The Cupriavidus necator acetoin-system E2 AcoC (P27747) also falls in SF8, through its
  C-terminal AB hydrolase-1 domain. AcoC adds an N-terminal lipoyl domain and is assigned as a
  dihydrolipoyllysine-residue acetyltransferase, not a hydrolase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The members share the alpha/beta-hydrolase fold and a broad hydrolase activity, but their
  substrates and biological roles diverge widely: aromatic meta-cleavage, epoxide, steroid
  catabolism, plant cuticle and tocopherol synthesis. The largest subfamily, SF8, is itself a mix
  of MhpC-type hydrolases, EphH and lipoyl-domain AcoC. The proteobacterial lipoyl/AB-hydrolase
  acetoin E2s are scattered over three PANTHER families (here, PTHR43798 and PTHR43194). They are
  better captured as one group by NCBIfam NF011457 (acetoin dehydrogenase
  dihydrolipoyllysine-residue acetyltransferase subunit), which the acetoin module uses instead
  of this family.
