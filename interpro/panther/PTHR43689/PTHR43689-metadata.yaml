  name:
    name: AB hydrolase superfamily
    short: AB_hydrolase_sf
  description:
  - text: The AB hydrolase superfamily protein family encompasses a diverse group
      of enzymes that share a common structural fold and catalytic mechanism, typically
      involving the hydrolysis of various substrates. Members of this family are involved
      in a range of biological processes, including the degradation of phenylpropionic
      acid through the bacterial meta-cleavage pathway, cuticle development and morphogenesis
      in plants, and tocopherol biosynthesis. They function by catalyzing the cleavage
      of specific bonds in substrates, such as the C5-C6 bond in dienol ring fission
      products or the hydrolysis of ester bonds in pimeloyl-ACP esters. Some family
      members are also implicated in the survival of Mycobacterium tuberculosis under
      acidic stress and nutrient-deprived conditions, as well as in the regulation
      of auxin influx and lateral root hair development in Arabidopsis.
