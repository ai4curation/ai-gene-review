    assessment: TOO_DEEP
    assessment_reason: >-
      The seed is E. coli RecA, which really is a component of the Pol V
      mutasome: the active complex is UmuD'2C-RecA-ATP. But the term names a
      specific complex built from the umuDC gene products, and it has been placed
      at the family root (LUCA), so every RecA homolog inherits membership of an
      enterobacterial translesion-synthesis complex. The over-reach is checkable
