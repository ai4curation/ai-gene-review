notes: 'Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml to COMPLETE,
  whose optional RecA signalling step is grounded here through P. putida RecA. Three of the five root-placed
  PAINT assertions are sound (ssDNA binding, strand exchange, recombinational repair); two over-reach,
  and both are reported for upstream attention. GO:0009355 (DNA polymerase V complex) propagates an enterobacterial
  complex to plant organellar homologs and to mycobacterial RecA, whose lineage replaced umuDC with the
  very cassette this module describes. GO:0004520 (DNA endonuclease activity) propagates the activity
  of the PI-MtuI intein carried by the M. tuberculosis recA allele, which was assayed on the excised intervening
  sequence (PMID:11850426) rather than on RecA; the intein evidence is cited from that cached publication
  rather than from the UniProt flat file, since there is no local genes/MYCTU/recA folder against which
  a flat-file quote could be checked. Neither affects the module''s own exemplar: Q88ME4 carries no IBA
  rows at all. Node depth was read from the PANTHER 19 treeinfo service (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR45900),
  which reports PTN000534381 as the ROOT node with taxonomic range LUCA. The subfamily labels are PANTHER''s
  official names, verbatim, and are misleading for SF1: those 670 members are bacterial RecA proteins,
  not mitochondrial. Follow-up: primary-source sequence mapping identifies MXAN_3991/Q1D5A2 as M. xanthus
  ImuA. The reviewed-only inventory did not include this unreviewed UniProt entry. Current classification
  includes it in SF1, but its leaf is absent from the cached PAINT tree. Universal mechanistic prose and
  the family-wide sensor scope have therefore been narrowed without changing any existing node identifiers,
  seeds, verdicts or raw PAINT rows. The subsequent Figure 4E reinspection supports an assay-scoped ImuA
  strand-exchange exception, without asserting a loss event or LexA co-protease activity. A native recombinational-repair
  process exception remains unestablished. No HMM classification defect is inferred from the automated
  RecName. The 2021 publication cache remains abstract-only; externally read full text and the Figure
  1 identity proof are documented in the linked consultation. The 2024 full text supports positive DNA
  binding and ATP hydrolysis, not universal RecA chemistry. On 2026-11-10 a FAMILY_WIDE scope for single-stranded
  DNA binding (GO:0003697) was added for modules/bacterial_recbcd_end_resection.yaml; no node verdict changed.'
