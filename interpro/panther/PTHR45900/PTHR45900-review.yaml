    supported damage sensing/LexA activation. That does not establish family-wide applicability. ImuA
    Q1D5A2 binds DNA, hydrolyzes ATP and inhibits RecA1, but neither inhibition of RecA1 nor DNA-stimulated
    ATP turnover demonstrates ImuA initiation of LexA co-protease signaling. The available assays do not
    establish absence of such activity either. SF1 contains both canonical RecA and ImuA, and no curated
    residue rule resolves the distinction, so neither a subfamily-wide grant nor a negative member exception
    is justified. Assess each member from its functional evidence; Q1D5A2 has no supported PAINT leaf
    placement in the cached tree.
