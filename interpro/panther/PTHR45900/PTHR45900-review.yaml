  label: MITOCHONDRIAL DNA REPAIR PROTEIN RECA HOMOLOG-RELATED
  description: 'The reviewed-member inventory is dominated by bacterial RecA proteins, despite the mitochondrial-sounding
    PANTHER name. Current UniProt classification also assigns M. xanthus ImuA Q1D5A2 to SF1, so this subfamily
    is not a uniform grant of canonical RecA recombinase or LexA co-protease function. ImuA DNA binding
    and ATP hydrolysis are measured, and its RecA1-inhibitory role must be distinguished from damage-sensor
    signaling. Some canonical RecA alleles carry mobile intervening sequences: M. tuberculosis RecA is
    a precursor containing PI-MtuI, which excises itself and has independent endonuclease activity. No
    homogeneous divergent SF1 clade or ancestral loss is asserted.'
