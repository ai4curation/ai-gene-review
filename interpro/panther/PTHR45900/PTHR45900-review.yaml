  - node_id: PANTHER:PTN000534381
    asserted_term:
      id: GO:0004520
      label: DNA endonuclease activity
    evidence: IBD
    negated: false
    paint_snapshot: '20250918'
    node_taxon:
      id: NCBITaxon:1
      label: root
    seeds:
      - id: UniProtKB:P9WHJ3
    assessment: WRONG_NODE
    assessment_reason: >-
      The activity belongs to a mobile element, not to the recombinase. The seed
      P9WHJ3 is translated as a precursor that contains the PI-MtuI intein, which
      excises itself by protein splicing; UniProt lists it as a separate chain
      with its own name and EC number and states plainly that PI-MtuI is an
      endonuclease. The seed's own experimental endonuclease annotation
      (PMID:11850426) is therefore an activity of the intein, and placing it at
      the family root propagates a homing endonuclease to every RecA protein in
      the tree. Again checkable in GOA: Arabidopsis RECA2 and RECA3 both carry
      GO:0004520 IBA from this node and this seed. No node in a RecA tree is the
      right place for this term, because inteins are not inherited with the
      recombinase: the annotation should sit on the PI-MtuI chain, not on RecA.
    affected_subfamilies:
