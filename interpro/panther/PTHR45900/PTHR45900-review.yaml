family_id: PANTHER:PTHR45900
family_name: RECA
preferred_name: RecA-related recombinases and ImuA accessory proteins
summary: Canonical bacterial RecA proteins and plant organellar RecA homologs bind single-stranded DNA,
  form nucleoprotein filaments and catalyze ATP-dependent strand exchange. Activated bacterial RecA can
  also stimulate LexA repressor autocleavage. These functions describe well-characterized RecA members,
  not every protein assigned to this family. Current UniProt classification places the experimentally
  identified Myxococcus xanthus ImuA (Q1D5A2/MXAN_3991) in PTHR45900:SF1. ImuA binds DNA, hydrolyzes ATP
  and interacts with ImuB and RecA1; inhibition of RecA1 is distinct from demonstrating ImuA strand exchange
  or LexA co-protease activity. The cached reviewed-member inventory contains 670 bacterial and three
  plant entries; that inventory does not exhaust all family assignments. The subfamily names do not imply
  that bacterial members are mitochondrial.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Canonical RecA recombinase chemistry is well supported across the characterized bacterial
  and organellar representatives. The experimentally identified ImuA member in SF1 has a distinct accessory/regulatory
  role in mutagenic lesion bypass while retaining DNA binding and ATP hydrolysis. Family membership therefore
  cannot alone license universal strand-exchange, recombinational-repair or DNA-damage-sensor claims.
  No ancestral loss is inferred: Q1D5A2 is absent as a leaf from the cached PAINT tree and its placement
  is unresolved.'
