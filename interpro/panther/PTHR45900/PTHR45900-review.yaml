subfamilies:
  - subfamily_id: PANTHER:PTHR45900:SF1
    label: MITOCHONDRIAL DNA REPAIR PROTEIN RECA HOMOLOG-RELATED
    description: >-
      The bacterial RecA proteins: 670 of the family's 673 reviewed members,
      spanning the whole domain. Despite the subfamily name, which PANTHER took
      from the plant nomenclature of its relatives, these are the cytoplasmic
      bacterial recombinases and SOS inducers. Some alleles carry mobile
      intervening sequences: M. tuberculosis RecA is translated as a precursor
      containing the PI-MtuI intein, which excises itself by protein splicing
      and, assayed as the excised sequence, is an ATP-dependent site-specific
      endonuclease in its own right.
