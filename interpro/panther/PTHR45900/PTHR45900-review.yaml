term_assessments:
  - assessed_term:
      id: GO:0140664
      label: ATP-dependent DNA damage sensor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Forming the activated, ATP- and ssDNA-bound filament is how a RecA protein
      registers damage, and it is the activity the
      bacterial_imuabc_damage_induced_mutagenesis module asserts for its RecA
      annoton. The sensing step itself is family-wide; what varies is the
      downstream consequence, since stimulating repressor autocleavage requires a
      LexA-family repressor to act on and so is confined to lineages that have
      one.
    supported_by:
      - reference_id: file:genes/PSEPK/recA/recA-uniprot.txt
        supporting_text: 'CC       DNAs. It interacts with LexA causing its activation and leading to its'
  - assessed_term:
      id: GO:0009355
      label: DNA polymerase V complex
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Pol V is built from the umuDC gene products, so only RecA proteins in
      genomes that carry umuDC can be part of it. The term reaches the whole
      family through the root-placed IBD assessed above, including plant
      organellar homologs and mycobacterial RecA, whose lineage uses the
      ImuABC cassette instead. Restricted here to the bacterial subfamily, and
      within it only to members whose genome encodes umuDC; it should not be
      asserted for an arbitrary RecA.
    applicable_subfamilies:
      - id: PANTHER:PTHR45900:SF1
        label: MITOCHONDRIAL DNA REPAIR PROTEIN RECA HOMOLOG-RELATED
    member_exceptions:
      - member:
          id: UniProtKB:P9WHJ3
          gene_symbol: recA
          organism: Mycobacterium tuberculosis H37Rv
        exception_reason: >-
          M. tuberculosis has no umuDC; its damage-induced mutagenesis runs
          through the ImuA'-ImuB-DnaE2 cassette, so there is no Pol V complex for
          this protein to belong to.
        supported_by:
          - reference_id: PMID:20615954
            supporting_text: >-
              Therefore, although broadly consistent with the identification of
              the imuA ′- imuB-dnaE2 cassette as the nonorthologous replacement
              of the umuDC system ( 5 ), our data reveal a “mutasome” comprising
              distinct components
      - member:
          id: UniProtKB:Q8RY99
          gene_symbol: RECA2
          organism: Arabidopsis thaliana
        exception_reason: >-
          A mitochondrially targeted plant recombinase; there is no umuDC and no
          Pol V complex in a plant organelle.
        supported_by:
          - reference_id: file:interpro/panther/PTHR45900/PTHR45900-entries.csv
            supporting_text: Q8RY99,DNA repair protein recA homolog 2, mitochondrial
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          In E. coli , RecA constitutes a key component of the DNA polymerase V
          “mutasomal complex” comprising UmuD′ 2 C-RecA-ATP ( 8 ).
  - assessed_term:
      id: GO:0004520
      label: DNA endonuclease activity
    scope: NOT_APPLICABLE
    scope_reason: >-
      No RecA recombinase is an endonuclease. The term enters the family from the
      PI-MtuI intein carried by the M. tuberculosis recA allele, a self-splicing
      mobile element that UniProt records as a separate chain with its own name
      and EC number. The activity was measured on the excised intervening
      sequence, purified away from RecA, so it is a property of the intein and
      belongs on that chain rather than on any RecA protein or node.
    supported_by:
      - reference_id: PMID:11850426
        supporting_text: >-
          To investigate whether PI-MtuI possesses endonuclease activity, recA
          intervening sequence was cloned, overexpressed, and purified to
          homogeneity.
      - reference_id: PMID:11850426
        supporting_text: >-
          Together, these results reveal that RecA intein is a novel
          Mn(2+)-ATP-dependent double-strand specific endonuclease, which is
          likely to be important for homing process in vivo.
