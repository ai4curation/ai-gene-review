family_id: PANTHER:PTHR45900
family_name: RECA
preferred_name: RecA/Rad51-type recombinases of bacteria and plant organelles
summary: >-
  The bacterial RecA recombinases and the organellar RecA homologs that
  plants inherited from the plastid and mitochondrial endosymbionts. A member
  nucleates on single-stranded DNA, polymerizes into a right-handed helical
  nucleoprotein filament, searches duplex DNA for homology and catalyses strand
  exchange, coupling the reaction to ATP binding and hydrolysis through its
  P-loop. In bacteria the activated filament has a second role: it is the
  platform that stimulates autocatalytic cleavage of the LexA-family repressor
  and so induces the damage response. Of the 673 reviewed members, 670 are
  bacterial RecA proteins in SF1; the remaining three are Arabidopsis organellar
  homologs. The subfamily names are a PANTHER naming artifact and do not mean the
  bacterial members are mitochondrial.
functional_coherence: COHERENT
coherence_reason: >-
  ssDNA binding, filament formation and ATP-dependent strand exchange hold across
  the family, including the organellar homologs, which perform recombination on
  organelle genomes. Only the LexA-cleavage role is lineage-dependent, since it
  requires a LexA-family repressor to act on.
