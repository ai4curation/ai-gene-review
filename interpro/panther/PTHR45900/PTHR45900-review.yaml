- node_id: PANTHER:PTN000534381
  asserted_term:
    id: GO:0009355
    label: DNA polymerase V complex
  evidence: IBD
  negated: false
  paint_snapshot: '20250918'
  node_taxon:
    id: NCBITaxon:1
    label: root
  seeds:
  - id: UniProtKB:P0A7G6
  assessment: TOO_DEEP
  assessment_reason: 'The seed is E. coli RecA, which really is a component of the Pol V mutasome: the
    active complex is UmuD''2C-RecA-ATP. But the term names a specific complex built from the umuDC gene
    products, and it has been placed at the family root (LUCA), so every RecA homolog inherits membership
    of an enterobacterial translesion-synthesis complex. The over-reach is checkable in GOA: Arabidopsis
    RECA2 (Q8RY99) and RECA3 (Q9ZUP2), both mitochondrially targeted plant proteins, carry GO:0009355
    IBA from this node and this seed, and so does M. tuberculosis RecA (P9WHJ3), whose genome has no umuDC
    at all. Mycobacteria instead use the ImuA''-ImuB-DnaE2 cassette, described in the literature as the
    non-orthologous replacement of the umuDC system, so the inherited complex does not exist in that lineage.
    The term belongs on the enterobacterial RecA clade at most, and arguably only on members shown to
    participate in a Pol V complex. SF1 is partly affected. Most of its bacterial RecA members, M. tuberculosis
    RecA among them, are in genomes without umuDC, so they inherit the term wrongly. SF1 also holds
    the E. coli seed, for which the term is true. affected_subfamilies has no way to say "partly
    affected" or to except one member. Listing SF1 would make the family/gene cross-check report the
    correct E. coli RecA ACCEPT as a pruning conflict, which blocks validation. SF1 is therefore left
    off this list, and its partial over-inheritance is recorded instead in the GO:0009355
    SUBFAMILY_ONLY term assessment below, as a member_exception for P9WHJ3. Listing SF4 and SF6 is
    unaffected.'
