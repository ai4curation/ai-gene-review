notes: >-
  Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml
  to COMPLETE, whose optional RecA signalling step is grounded here through
  P. putida RecA. Three of the five root-placed PAINT assertions are sound
  (ssDNA binding, strand exchange, recombinational repair); two over-reach, and
  both are reported for upstream attention. GO:0009355 (DNA polymerase V complex)
  propagates an enterobacterial complex to plant organellar homologs and to
  mycobacterial RecA, whose lineage replaced umuDC with the very cassette this
  module describes. GO:0004520 (DNA endonuclease activity) propagates the
  activity of the PI-MtuI intein carried by the M. tuberculosis recA allele,
  which was assayed on the excised intervening sequence (PMID:11850426) rather
  than on RecA; the intein evidence is cited from that cached publication rather
  than from the UniProt flat file, since there is no local genes/MYCTU/recA
  folder against which a flat-file quote could be checked.
  Neither affects the module's own exemplar: Q88ME4 carries no IBA rows at all.
  Node depth was read from the PANTHER 19 treeinfo service
  (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR45900), which reports
  PTN000534381 as the ROOT node with taxonomic range LUCA. The subfamily labels
  are PANTHER's official names, verbatim, and are misleading for SF1: those 670
  members are bacterial RecA proteins, not mitochondrial.
