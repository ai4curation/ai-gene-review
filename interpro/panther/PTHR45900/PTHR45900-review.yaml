    id: GO:0009355
    label: DNA polymerase V complex
  scope: SUBFAMILY_ONLY
  scope_reason: Pol V is built from the umuDC gene products, so only RecA proteins in genomes that carry
    umuDC can be part of it. The term reaches the whole family through the root-placed IBD assessed above,
    including plant organellar homologs and mycobacterial RecA, whose lineage uses the ImuABC cassette
    instead. Restricted here to the bacterial subfamily, and within it only to members whose genome encodes
    umuDC; it should not be asserted for an arbitrary RecA.
