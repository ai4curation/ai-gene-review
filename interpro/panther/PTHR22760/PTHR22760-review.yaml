family_id: PANTHER:PTHR22760
family_name: GLYCOSYLTRANSFERASE
preferred_name: GT22 Dol-P-Man mannosyltransferase family (ALG9, ALG12, PIGB, SMP3)
summary: >-
  ER-lumenal polytopic GT22 mannosyltransferases that use dolichyl-phosphate-mannose. ALG9 (SF2)
  adds two alpha-1,2-mannoses and ALG12 (SF1) one alpha-1,6-mannose to the N-glycan precursor. The
  GPI mannosyltransferases PIGB/GPI10 (SF4, third mannose) and SMP3/PIGZ (SF3, fourth mannose) extend
  the GPI anchor core.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Acceptor and linkage are subfamily-specific: N-glycan LLO (SF2, SF1) and GPI anchor (SF4, SF3).
