family_id: PANTHER:PTHR30255
family_name: SINGLE-STRANDED-DNA-SPECIFIC EXONUCLEASE RECJ
preferred_name: RecJ single-stranded DNA 5'-to-3' exonuclease family
summary: >-
  Bacterial and archaeal RecJ exonucleases, DHH-superfamily enzymes that
  processively degrade single-stranded DNA in the 5'-to-3' direction. E. coli
  RecJ is required for the RecF pathway of recombination and for daughter-strand
  gap repair, and it is one of the redundant exonucleases that remove the
  error-containing strand in mismatch repair when the strand break lies 5' to
  the mismatch. The family also contains prophage-encoded RecJ-like YorK
  proteins and archaeal RecJ1/RecJ2 paralogs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 10 reviewed members in the cached inventory, 9 are in SF2: six are
  named single-stranded-DNA-specific exonuclease RecJ (E. coli, Salmonella,
  Dickeya, Haemophilus, Thermus, B. subtilis), two are putative SPbeta prophage
  YorK proteins and one is M. jannaschii RecJ2. SF3 holds a single archaeal
  RecJ1. The 5'-to-3' single-stranded DNA exonuclease is established for E. coli
  RecJ, while the prophage YorK proteins and the archaeal paralogs are named by
  similarity and have not been assayed in the evidence cached here.
