family_id: PANTHER:PTHR47786
family_name: ALPHA-1,4-GLUCAN:MALTOSE-1-PHOSPHATE MALTOSYLTRANSFERASE
preferred_name: GlgE maltose-1-phosphate maltosyltransferase family
summary: >-
  A functionally coherent glycoside hydrolase family 13 (GH13, GlgE subfamily)
  family of maltosyltransferases. Members use alpha-maltose 1-phosphate (M1P) as
  the activated donor to elongate linear or branched alpha-1,4-glucan chains by
  maltosyl (two-glucose) units, releasing inorganic phosphate (EC 2.4.99.16).
  They are specific for the alpha-anomer of M1P, use an alpha-retaining
  mechanism, and can also run the reverse (phosphorolytic) and
  disproportionation reactions in vitro. GlgE is the chain-extension enzyme of
  the TreS-Pep2(Mak)-GlgE-GlgB route that converts trehalose into branched
  alpha-glucan, and acts upstream of the GlgB branching enzyme. The family is
  represented by one PANTHER subfamily (SF2) and includes mycobacterial GlgE,
  the two Streptomyces coelicolor paralogues GlgE1/GlgE2, and the Pseudomonas
  putida GlgE.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized members are M1P-dependent alpha-1,4-glucan maltosyltransferases
  of the GlgE subfamily, with a conserved donor pocket and alpha-retaining
  catalytic mechanism. The single PANTHER subfamily and the PAINT node both carry
  the transferase activity.
