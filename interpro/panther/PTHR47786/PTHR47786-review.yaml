    existing GO term for the GlgE reaction; the exact maltosyltransferase
    activity has no GO term yet and is proposed in the P9WQ17 gene review. The
    activity is conserved across the SF2 GlgE members, so the IBD transfer is
    sound. The seed appearing as the source is correct: the IBD rests on this
    gene's own experimental annotation.
