    The node is the bacterial GlgE clade of PTHR47786, seeded by M. tuberculosis
    GlgE (P9WQ17), whose maltose-1-phosphate maltosyltransferase activity is
    shown directly (IDA, PMID:20305657; curated reaction RHEA:42692,
