family_id: PANTHER:PTHR19376
family_name: DNA-DIRECTED RNA POLYMERASE
preferred_name: Multisubunit RNA polymerase largest subunit family (bacterial beta-prime, archaeal Rpo1,
  eukaryotic RPA1/RPB1/RPC1)
summary: 'Pan-domain family of the largest subunit of multisubunit DNA-directed RNA polymerases: bacterial
  beta-prime (rpoC), cyanobacterial and plastid rpoC1/rpoC2 (beta-prime split into gamma and beta''''),
  archaeal Rpo1 (split into Rpo1N/A'' and Rpo1C/A''''), eukaryotic Pol I, II and III subunits RPA1, RPB1
  and RPC1, plant Pol IV/V NRPD1/NRPE1, and large DNA virus homologs. The subunit forms the other half
  of the active-centre cleft with the second-largest subunit (PTHR20856) and carries the catalytic Mg(2+)
  site (NADFDGD), the clamp, bridge helix, trigger loop and structural zinc sites. E. coli K-12 RpoC (P0A8T7)
  is the reference bacterial member.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: Contribution to DNA-directed RNA polymerase activity and DNA-templated transcription
  are conserved across the family, including split forms whose fragments together reconstitute the subunit.
  Divergence lies in which polymerase a member belongs to and in lineage-specific features (the eukaryotic
  RPB1 CTD; the cyanobacterial/plastid split and sequence insertion), which PANTHER separates into subfamilies
  and PAINT into lineage nodes.
