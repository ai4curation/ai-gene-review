  name:
    name: Pyruvate Dehydrogenase E1 Beta Subunit
    short: PDH_E1_beta_subunit
  description:
  - text: 'The Pyruvate Dehydrogenase E1 Component Beta Subunit family consists of
      proteins that play a crucial role in cellular metabolism. Members of this family
      are part of the pyruvate dehydrogenase complex (PDHc), which is responsible
      for the conversion of pyruvate to acetyl-CoA and carbon dioxide, a key step
      in the link between glycolysis and the citric acid cycle. The complex comprises
      multiple copies of three core enzymatic components: E1 (pyruvate dehydrogenase),
      E2 (dihydrolipoamide acetyltransferase), and E3 (lipoamide dehydrogenase). The
      beta subunit is one of the components of the E1 enzyme and is essential for
      the proper functioning of the PDHc. Additionally, in some species, the PDHc
      has been noted to exhibit branched-chain 2-oxoacid dehydrogenase activity. The
      family also includes proteins that can catalyze the cleavage of acetoin into
      acetate and acetaldehyde, although the beta subunit is not the catalytic subunit
      in this reaction.'
