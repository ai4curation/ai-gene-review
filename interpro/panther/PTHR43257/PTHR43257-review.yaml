family_id: PANTHER:PTHR43257
family_name: PYRUVATE DEHYDROGENASE E1 COMPONENT BETA SUBUNIT
preferred_name: Thiamine-diphosphate E1 beta subunits of 2-oxoacid and acetoin dehydrogenase systems
summary: >-
  Transketolase-like beta subunits of alpha2beta2 thiamine-diphosphate (ThDP) E1 enzymes. Together
  with an E1 alpha subunit they decarboxylate or cleave a substrate and transfer the acyl group to the
  lipoyl arm of an E2. The family holds eukaryotic pyruvate dehydrogenase E1 beta (human PDHB, yeast
  PDB1, fission yeast pdb1), eukaryotic branched-chain 2-oxoacid dehydrogenase E1 beta (human BCKDHB,
  Arabidopsis DIN4) and bacterial PDH E1 beta (B. subtilis PdhB, SF2). It also holds the beta subunit
  of the bacterial acetoin-cleaving E1 (AcoB). AcoB from Syntrophotalea (Pelobacter) carbinolica,
  Cupriavidus necator H16, B. subtilis and P. putida forms its own subfamily, SF3, named for that
  activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is the beta subunit of a heteromeric ThDP E1 that feeds a lipoyl E2, so the subunit
  role and core chemistry are shared. The substrate differs by clade: pyruvate (PDHB, bacterial
  PdhB), branched-chain 2-oxoacids (BCKDHB) or acetoin (AcoB, SF3). The two PAINT nodes are
  substrate-specific eukaryotic clades, and none of the reviewed bacterial members (B. subtilis
  PdhB or any AcoB) receives an IBA from them.
reference_protein:
  id: UniProtKB:Q57041
  label: Acetoin:2,6-dichlorophenolindophenol oxidoreductase subunit beta
  gene_symbol: acoB
  organism: Syntrophotalea carbinolica (Pelobacter carbinolicus)
  gene_review: genes/SYNCB/acoB/acoB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43257:SF3
  label: ACETOIN:2,6-DICHLOROPHENOLINDOPHENOL OXIDOREDUCTASE SUBUNIT BETA
  description: >-
    Acetoin-cleaving E1 beta subunits (AcoB). The Pelobacter protein was purified with E1 alpha and
    reconstitutes CoA-dependent acetoin oxidation with the purified E2 and E3. The Cupriavidus, B.
    subtilis and P. putida proteins are encoded in acetoin-inducible aco clusters. PANTHER's own
    classification and UniProt agree on SF3 for all four.
  representative_members:
  - id: UniProtKB:Q57041
    gene_symbol: acoB
    organism: Syntrophotalea carbinolica
    gene_review: genes/SYNCB/acoB/acoB-ai-review.yaml
  - id: UniProtKB:P27746
    gene_symbol: acoB
    organism: Cupriavidus necator H16
    gene_review: genes/CUPNH/acoB/acoB-ai-review.yaml
  - id: UniProtKB:O34591
    gene_symbol: acoB
    organism: Bacillus subtilis 168
    gene_review: genes/BACSU/acoB/acoB-ai-review.yaml
  - id: UniProtKB:Q88QE0
    gene_symbol: acoB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/acoB/acoB-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Substrate divergence from the pyruvate and branched-chain 2-oxoacid E1 beta subunits. The
    assembled AcoA/AcoB E1 cleaves acetoin to acetaldehyde instead of decarboxylating a 2-oxoacid.
    The subunit architecture and the ThDP/lipoyl-acyl transfer chemistry are retained.
  supported_by:
  - reference_id: PMID:1898934
    supporting_text: The combination of purified Ao:DCPIP OR, DHLTA, and DHLDH in the presence of thiamine
      pyrophosphate and the substrate acetoin or methylacetoin resulted in a coenzyme A-dependent reduction
      of NAD.
  - reference_id: PMID:20508247
    supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium Pelobacter
      carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate as substrate
- subfamily_id: PANTHER:PTHR43257:SF2
  label: PYRUVATE DEHYDROGENASE E1 COMPONENT SUBUNIT BETA
  description: >-
    Pyruvate dehydrogenase E1 beta subunits, including B. subtilis PdhB (P21882) and plant plastid
    E1 beta. No member in this subfamily has a gene review in this corpus.
  diverged_from_family: false
