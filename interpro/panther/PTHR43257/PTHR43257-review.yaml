  assessment: SOUND
  assessment_reason: >-
    The seeds are all branched-chain 2-oxoacid dehydrogenase E1 beta subunits (human BCKDHB,
    mouse Bckdhb, Arabidopsis BCKDH E1 beta and DIN4, Drosophila ortholog). Human BCKDHB (P21953)
    inherits IBAs from this node, while human PDHB (P11177) and yeast PDB1 (P32473) do not. The
    node is therefore the BCKDHB clade, not a family root, and branched-chain amino acid catabolism
    is the correct process for it. No AcoB or bacterial PdhB member receives this IBA.
  supported_by:
