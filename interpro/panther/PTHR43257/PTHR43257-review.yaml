notes: >-
  Node placement was checked against QuickGO IBA recipients (2026-11-02), because the PANTHER
  treeinfo API returned only a 17-leaf partial tree for this family. Human BCKDHB inherits from
  PTN000178891; human PDHB and yeast PDB1 inherit from the PDH nodes (PTN000178974/PTN000178975);
  O34591, P27746, P21882 and Q88QE0 receive no PTHR43257 IBA. PR #5078 carries a machine-generated
  draft of this file; this curated version supersedes it for the acetoin module.
