family_id: PANTHER:PTHR11943
family_name: GALACTOSE-1-PHOSPHATE URIDYLYLTRANSFERASE
preferred_name: Galactose-1-phosphate uridylyltransferase (GalT/GAL7/GALT) family
summary: >-
  Class I hexose-1-phosphate uridylyltransferases exchange the UMP of UDP-glucose onto galactose
  1-phosphate by a ping-pong mechanism, the central step of the Leloir pathway (bacterial GalT, S.
  cerevisiae GAL7, S. pombe gal7, human GALT, whose loss causes classic galactosemia).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of GalT enzymes.
