- node_id: PANTHER:PTN008530881
  asserted_term:
    id: GO:0033499
    label: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000235304
  node_taxon:
    id: NCBITaxon:4895
    label: Schizosaccharomyces
  paint_snapshot: '20260828'
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    IRD withdrawing the Leloir pathway from the two Schizosaccharomyces GalT leaves (S. pombe gal7,
    S. japonicus SJAG_02954) while leaving their uridylyltransferase activity in place. It
    presumably reflects that wild-type S. pombe does not grow on galactose. That is a regulatory
    state, not a loss of the gene's role: the gal7-gal10-gal1 cluster is silenced in subtelomeric
    chromatin, cells grow on galactose once the cluster is expressed from a vector or derepressed,
    and Gal7p converts galactose 1-phosphate to UDP-galactose in vivo. The enzymes are intact and
    the pathway works when the genes are expressed, so the process should descend; the silencing
    belongs in the gene review and the module notes, not in a NOT annotation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11943/PTHR11943-paint.tsv
    supporting_text: "PTHR11943\tPTN008530881\tGO:0033499\tP\tIRD\ttrue"
