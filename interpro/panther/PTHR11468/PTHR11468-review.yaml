family_id: PANTHER:PTHR11468
family_name: GLYCOGEN PHOSPHORYLASE
preferred_name: Alpha-glucan phosphorylase family (glycogen, starch and maltodextrin phosphorylases)
summary: >-
  PLP-dependent alpha-glucan phosphorylases release glucose 1-phosphate from the non-reducing ends
  of alpha-1,4-glucans. The family contains glycogen phosphorylases (S. cerevisiae GPH1, human PYGL/PYGM/PYGB,
  bacterial GlgP), plant starch phosphorylases and E. coli maltodextrin phosphorylase MalP.
functional_coherence: COHERENT
coherence_reason: >-
  All members are alpha-1,4-glucan phosphorylases; the polymer substrate (glycogen, starch, maltodextrin)
  varies by subfamily.
