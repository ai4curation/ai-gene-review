family_id: PANTHER:PTHR11846
family_name: ADENYLOSUCCINATE SYNTHETASE
preferred_name: Adenylosuccinate synthetase (PurA/ADE12/ADSS) family
summary: >-
  GTP-dependent adenylosuccinate synthetases condense IMP with aspartate, the first step from IMP
  to AMP. The family contains bacterial and phage PurA, S. cerevisiae ADE12, plant plastid PURA,
  and animal ADSS1 (muscle) and ADSS2.
functional_coherence: COHERENT
coherence_reason: All subfamilies are adenylosuccinate synthetases.
