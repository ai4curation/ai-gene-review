family_id: PANTHER:PTHR23090
family_name: NH 3 /GLUTAMINE-DEPENDENT NAD +  SYNTHETASE
preferred_name: NAD+ synthetase (NadE/QNS1/NADSYN1) family
summary: >-
  NAD+ synthetases amidate deamido-NAD to NAD+, the last step of both de novo and Preiss-Handler
  NAD synthesis. Bacterial NadE (SF7) uses ammonia. Eukaryotic QNS1 (S. cerevisiae), S. pombe SPCC553.02
  and human NADSYN1 (SF9) add a nitrilase-like glutaminase domain and use glutamine.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are NAD synthetases; the nitrogen donor (ammonia in SF7, glutamine in SF9) differs
  by subfamily.
