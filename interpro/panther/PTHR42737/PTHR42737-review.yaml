family_id: PANTHER:PTHR42737
family_name: GLUTATHIONE REDUCTASE
preferred_name: Glutathione reductase / high-Mr thioredoxin reductase family
summary: >-
  FAD-dependent pyridine nucleotide-disulfide oxidoreductases. Glutathione reductases (S. cerevisiae
  GLR1, S. pombe pgr1, human GSR, plant GR) reduce glutathione disulfide with NADPH. The animal selenocysteine-containing
  high-Mr thioredoxin reductases (TXNRD1-3) reduce thioredoxin through a C-terminal selenenylsulfide.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The disulfide substrate differs: glutathione for GR (SF2, SF5, SF9), thioredoxin for TrxR (SF8,
  SF7, SF6).
