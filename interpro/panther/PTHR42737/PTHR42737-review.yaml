  scope_reason: Glutathione metabolism by GR; accepted by GLR1, pgr1 and GSR.
  applicable_subfamilies:
  - id: PANTHER:PTHR42737:SF2
    label: GLUTATHIONE REDUCTASE
  - id: PANTHER:PTHR42737:SF5
    label: GLUTATHIONE REDUCTASE, MITOCHONDRIAL
  - id: PANTHER:PTHR42737:SF9
    label: GLUTATHIONE REDUCTASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR42737/PTHR42737-paint.tsv
    supporting_text: "PTHR42737\tPTN002448883\tGO:0006749\tP\tIBD\tfalse"
  - reference_id: file:genes/yeast/GLR1/GLR1-ai-review.yaml
    supporting_text: >-
      PAINT IBA for glutathione metabolic process; Glr1 regenerates GSH from GSSG, a step of
      glutathione metabolism (GO has no more specific term for GSSG reduction).
  member_exceptions:
  - member:
      id: UniProtKB:P39051
      gene_symbol: TPR
      organism: Trypanosoma brucei brucei
    exception_reason: >-
      Same case as GO:0004362: the process TryR takes part in is trypanothione metabolism, not
      glutathione metabolism. Its substrate is trypanothione disulfide, it reduces glutathione
      disulphide negligibly, and kinetoplastids run the trypanothione system in place of the
      GSH/GR one. The gene review replaces this term with GO:0046206 trypanothione metabolic
      process. GO:0006749 is not among GO:0046206's ancestors: QuickGO's complete is_a and
      part_of ancestor set for it is GO:0006790 sulfur compound metabolic process, GO:0008152
      metabolic process, GO:0009987 cellular process and the root GO:0008150. The replacement
      is therefore a lateral correction, not a refinement, and this scope really does not
      cover the member.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42737/PTHR42737-entries.csv
      supporting_text: P39051,Trypanothione reductase,protein,5702,Trypanosoma brucei brucei,Trypanosoma
        brucei brucei,TPR,492,PTHR42737:SF2,GLUTATHIONE REDUCTASE,True
    - reference_id: PMID:19747949
      supporting_text: However, the enzymes trypanothione reductase and glutathione reductase are highly specific
        for their respective disulphide substrates
    - reference_id: PMID:10672177
      supporting_text: In Kinetoplastida, trypanothione and trypanothione reductase (TRYR) provide
        an intracellular reducing environment, substituting for the glutathione-glutathione reductase
        system found in most other organisms.
