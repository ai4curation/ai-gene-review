      PAINT IBA for glutathione-disulfide reductase (NADPH) activity from the GSR clade (mouse, rat,
      S.
  member_exceptions:
  - member:
      id: UniProtKB:P39051
      gene_symbol: TPR
      organism: Trypanosoma brucei brucei
    exception_reason: >-
      Trypanothione reductase, not a glutathione reductase. PANTHER places it in SF2 on fold and
      sequence, but TryR and GR are sister enzymes with mutually exclusive disulfide specificity:
      the purified T. brucei enzyme strongly prefers trypanothione disulfide over glutathione
      disulphide, and kinetoplastids have no glutathione reductase at all. Its own activity,
      GO:0015042, is annotated separately.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42737/PTHR42737-entries.csv
      supporting_text: P39051,Trypanothione reductase,protein,5702,Trypanosoma brucei brucei,Trypanosoma
        brucei brucei,TPR,492,PTHR42737:SF2,GLUTATHIONE REDUCTASE,True
    - reference_id: PMID:19747949
      supporting_text: However, the enzymes trypanothione reductase and glutathione reductase are highly specific
        for their respective disulphide substrates
    - reference_id: PMID:10672177
      supporting_text: In Kinetoplastida, trypanothione and trypanothione reductase (TRYR) provide
        an intracellular reducing environment, substituting for the glutathione-glutathione reductase
        system found in most other organisms.
