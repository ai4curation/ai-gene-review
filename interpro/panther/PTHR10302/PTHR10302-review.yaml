family_id: PANTHER:PTHR10302
family_name: SINGLE-STRANDED DNA-BINDING PROTEIN
preferred_name: Bacterial and organellar single-stranded DNA-binding proteins (SSB, mtSSB, OSB)
summary: 'OB-fold single-stranded DNA-binding proteins of bacteria (SSB, SF27) and of eukaryotic organelles:
  mitochondrial SSB (SF0; human SSBP1, Drosophila mtSSB, yeast Rim1) and the plant organellar OSB proteins.
  Bacterial SSB binds single-stranded DNA tightly and cooperatively as a tetramer and, through its C-terminal
  tail, recruits and stimulates genome-maintenance enzymes such as Exonuclease I. In mismatch repair it
  coats the strand exposed by UvrD and stimulates the excision exonucleases. Mitochondrial SSB acts in
  the mitochondrial nucleoid in mtDNA replication.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Single-stranded DNA binding is shared by all characterized subgroups. The subfamilies
  differ in compartment and partners: of 175 reviewed members, 151 are bacterial SSBs in SF27, 19 are
  in the mitochondrial SF0, and five Arabidopsis OSB proteins (two of them chloroplastic) occupy their
  own subfamilies. The enzyme-activator role is documented for bacterial SSB.'
