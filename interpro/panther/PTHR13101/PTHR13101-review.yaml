  assessment_reason: >-
    Right for the vertebrate seeds (human PMVK and mouse Pmvk keep it as non-core), but the node is the
    family root, so the term descends to arthropods and nematodes, which cannot synthesise sterols. The
    Drosophila Pmvk review removes the IBA and its two companion rows on this ground. The smallest node
    holding all the insect, crustacean (Daphnia), tick (Ixodes) and nematode leaves is the ecdysozoan
    clade PTN000318448 (8 leaves); an IRD there stops the term without touching the vertebrate,
    cephalochordate, cnidarian or placozoan members. Sterol auxotrophy may have arisen independently in
    nematodes and arthropods, in which case two IRDs, at the arthropod node PTN000991933 and the nematode
    clade, are the equivalent alternative. Evidence for ticks and Daphnia rests on genome signatures rather
    than biochemistry.
