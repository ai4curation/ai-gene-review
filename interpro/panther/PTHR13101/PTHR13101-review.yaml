notes: >-
  Revised 2026-11-18 after the mouse and Drosophila Pmvk reviews. Fungal phosphomevalonate kinase
  (S. cerevisiae ERG8) is a GHMP kinase in a different family (PTHR31814). Localization is not a PAINT term
  here but differs between species: human PMVK is cytosolic by fractionation, digitonin permeabilisation
  and immunoelectron microscopy (PMID:14729858), whereas the mouse liver peroxisome proteome places PMVK in
  the bona fide peroxisomal cluster (PMID:38247867), and mouse Pmvk ends in a PTS1-type tripeptide; fly
  Pmvk has no PTS1. Tree placements are from the PANTHER 19.0 tree.
