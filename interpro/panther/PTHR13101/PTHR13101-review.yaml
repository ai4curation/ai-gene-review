family_name: PHOSPHOMEVALONATE KINASE
preferred_name: Animal-type phosphomevalonate kinase (PMVK) family
summary: >-
  Animal phosphomevalonate kinase phosphorylates mevalonate 5-phosphate to mevalonate 5-diphosphate.
  It is a nucleoside-monophosphate-kinase-fold enzyme unrelated to the GHMP-type ERG8 of fungi.
