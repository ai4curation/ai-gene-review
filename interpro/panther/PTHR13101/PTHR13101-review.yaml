family_id: PANTHER:PTHR13101
family_name: PHOSPHOMEVALONATE KINASE
preferred_name: Animal-type phosphomevalonate kinase (PMVK) family
summary: >-
  Animal phosphomevalonate kinase phosphorylates (R)-mevalonate 5-phosphate to (R)-mevalonate
  5-diphosphate in the mevalonate pathway. It is a small nucleoside-monophosphate-kinase-fold (P-loop)
  enzyme, unrelated to the GHMP-type ERG8 phosphomevalonate kinases of fungi, plants and bacteria
  (PTHR31814), and is found in animals and choanoflagellates (human PMVK, mouse Pmvk, Drosophila Pmvk).
functional_coherence: COHERENT
coherence_reason: >-
  All members share subfamily SF1 and every reviewed member (human, mouse and Drosophila) keeps
  phosphomevalonate kinase activity. The process context is not coherent: the vertebrate enzymes feed
  cholesterol synthesis, but arthropods and nematodes cannot make sterols, so their PMVKs supply
  isoprenoids for non-sterol products only.
