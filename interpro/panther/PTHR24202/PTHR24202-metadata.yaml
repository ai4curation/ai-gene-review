  name:
    name: Mindbomb E3 Ubiquitin-Protein Ligase
    short: Mindbomb_E3_Ub-Ligase
  description:
  - text: The MIB E3 ubiquitin-protein ligase family mediates the ubiquitination of
      Delta receptors, which are ligands for Notch proteins, thus positively regulating
      Notch signaling. Ubiquitination leads to the endocytosis of Delta receptors,
      influencing various developmental processes. Members of the family are also
      involved in the ubiquitination of other proteins, such as centriolar satellite
      proteins, TBK1, and DAPK1, affecting processes like primary cilium formation,
      kinase activation, and apoptosis. Some members participate in the ubiquitination
      of viral proteins during infection, aiding in viral genome delivery into the
      nucleus.
