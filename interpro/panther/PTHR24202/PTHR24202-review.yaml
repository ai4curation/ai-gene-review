notes: >-
  Seeds were resolved with UniProt (MGI:2443157 = Mib1 Q80SY4; MGI:2679684 = Mib2
  Q8R516; FBgn0263601 = mib1 Q9VUX2; FBgn0086442 = mib2 Q9VJ14;
  ZDB-GENE-030404-2 = mib1 Q804S5; ZDB-GENE-050628-1 = mib2). Subfamilies come
  from UniProt DR PANTHER and the PANTHER geneinfo service. Domain calls
  (Mib_herc2 PF06701, RING PF13920) come from the InterPro API. The official PANTHER
  family name is "E3 UBIQUITIN-PROTEIN LIGASE MIB2", even though the Notch-relevant
  paralogue is MIB1 (SF53). For the Notch module, cite SF53 or PTN008608909, not the
  family, for the ligand-endocytosis E3 role. No residue sites are asserted.
