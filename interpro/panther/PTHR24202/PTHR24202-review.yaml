      - {id: MGI:MGI:2679684, label: Mib2, organism: Mus musculus}
      - {id: ZFIN:ZDB-GENE-030404-2, label: mib1, organism: Danio rerio}
      - {id: ZFIN:ZDB-GENE-050628-1, label: mib2, organism: Danio rerio}
    assessment: SOUND
    assessment_reason: Consistent with RING E3 activity across both paralogue groups.
