family_id: PANTHER:PTHR24202
family_name: E3 UBIQUITIN-PROTEIN LIGASE MIB2
preferred_name: Mind bomb (MIB1/MIB2) RING E3 ubiquitin ligases
summary: >-
  Mind bomb proteins are large multidomain RING-type E3 ubiquitin ligases. They have
  N-terminal Mib/HERC2 and ZZ-zinc-finger substrate-binding modules, Mind-bomb SH3
  repeats, a central ankyrin-repeat array and C-terminal RING fingers. Mind bomb 1
  (MIB1) is the principal E3 for Notch ligands in the signal-sending cell. It binds
  the intracellular domains of Delta/Delta-like and Jagged/Serrate ligands and
  ubiquitinates them. That drives ligand endocytosis, which exerts the pulling force
  needed for Notch activation. Zebrafish mib, mouse Mib1 and Drosophila mib1 mutants
  all show pan-Notch loss-of-function phenotypes. The MIB2 paralogue is also an E3
  with the same domain plan, but its roles are largely separate from Notch. Mouse
  Mib2 knockouts are grossly normal, and Drosophila mib2 maintains muscle integrity
  through a Notch-independent pathway. MIB2 also ubiquitinates non-Notch substrates.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  RING E3 ubiquitin-ligase activity is shared across the full-length members, but the
  biological role splits by paralogue. SF53 (MIB1) holds the obligatory Notch-ligand
  E3s of vertebrates and Drosophila. SF4 ("E3 UBIQUITIN-PROTEIN LIGASE MIB2-RELATED")
  holds vertebrate MIB2 and Drosophila Mib2, which are dispensable for Notch
  signalling in mouse and act in a Notch-independent muscle-maintenance pathway in
  flies. SF4 also contains C. elegans mib-1 (Q9U2C5), the worm's only family member,
  which has ankyrin repeats and RING fingers but no Mib/HERC2 domain. It holds the
  human HERC2P3 gene product (Q9BVR0), a RING-less Mib/HERC2-domain fragment, as well.
  SF54 ("MYND-TYPE DOMAIN-CONTAINING PROTEIN") was not characterised here.
reference_protein:
  id: UniProtKB:Q86YT6
  label: E3 ubiquitin-protein ligase MIB1
  gene_symbol: MIB1
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR24202:SF53
    label: E3 UBIQUITIN-PROTEIN LIGASE MIB1
    description: >-
      The Notch-ligand E3 subfamily. Its members ubiquitinate Delta/Jagged
      intracellular domains and promote ligand endocytosis in the signal-sending cell.
    representative_members:
      - {id: UniProtKB:Q86YT6, gene_symbol: MIB1, organism: Homo sapiens,
         gene_review: genes/human/MIB1/MIB1-ai-review.yaml}
      - {id: UniProtKB:Q80SY4, gene_symbol: Mib1, organism: Mus musculus}
      - {id: UniProtKB:Q804S5, gene_symbol: mib1, organism: Danio rerio,
         gene_review: genes/DANRE/mib1/mib1-ai-review.yaml}
      - {id: UniProtKB:Q9VUX2, gene_symbol: mib1, organism: Drosophila melanogaster,
         gene_review: genes/DROME/mib1/mib1-ai-review.yaml}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR24202:SF4
    label: E3 UBIQUITIN-PROTEIN LIGASE MIB2-RELATED
    description: >-
      MIB2 paralogues from vertebrates and insects, plus the single C. elegans Mind-bomb
      family protein and the human HERC2P3 fragment.
    representative_members:
      - {id: UniProtKB:Q96AX9, gene_symbol: MIB2, organism: Homo sapiens}
      - {id: UniProtKB:Q8R516, gene_symbol: Mib2, organism: Mus musculus}
      - {id: UniProtKB:A0AR23, gene_symbol: mib2, organism: Danio rerio}
      - {id: UniProtKB:Q9VJ14, gene_symbol: mib2, organism: Drosophila melanogaster}
      - {id: UniProtKB:Q9U2C5, gene_symbol: mib-1, organism: Caenorhabditis elegans}
    diverged_from_family: true
    divergence_description: >-
      These members keep RING E3 activity but not the obligatory Notch-ligand role.
      Mouse Mib2 is dispensable for Notch-dependent development, and Drosophila mib2
      acts in a Notch- and integrin-independent muscle-maintenance pathway. Notch
      pathway terms must come from gene-level evidence here, not from inheritance.
      Worm mib-1 is a divergent member without the Mib/HERC2 substrate-binding domain.
      No Notch role for it was evaluated in this review.
node_assessments:
  - node_id: PANTHER:PTN008608909
    asserted_term:
      id: GO:0007219
      label: Notch signaling pathway
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20170228"
    seeds:
      - {id: MGI:MGI:2443157, label: Mib1, organism: Mus musculus}
      - {id: ZFIN:ZDB-GENE-030404-2, label: mib1, organism: Danio rerio}
    assessment: SOUND
    assessment_reason: >-
      The node sits on the MIB1 clade. Its IBA descendants (QuickGO, with/from
      PTN008608909) include human MIB1, mouse Mib1, zebrafish mib1, Xenopus mib1 and
      Drosophila mib1, while MIB2/SF4 members, including C. elegans mib-1, do not
      inherit. That split matches the genetics: Mib1 is obligatory for Notch signalling
      and Mib2 is dispensable. Mind bomb does part of the pathway's work, since it
      ubiquitinates the ligand to trigger the endocytosis that activates Notch. The
      process term is therefore participation, not mere necessity.
  - node_id: PANTHER:PTN008608909
    asserted_term:
      id: GO:0006897
      label: endocytosis
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20241120"
    seeds:
      - {id: FB:FBgn0263601, label: mib1, organism: Drosophila melanogaster}
      - {id: ZFIN:ZDB-GENE-030404-2, label: mib1, organism: Danio rerio}
    assessment: SOUND
    assessment_reason: >-
      MIB1-dependent ubiquitination drives endocytosis of Notch ligands in the
      signal-sending cell in zebrafish, mouse and fly. The broad parent term is
      accurate, though ubiquitin-dependent endocytosis would be more specific.
  - node_id: PANTHER:PTN001197468
    asserted_term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20241120"
    seeds:
      - {id: FB:FBgn0263601, label: mib1, organism: Drosophila melanogaster}
      - {id: MGI:MGI:2679684, label: Mib2, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      Both paralogues are RING E3 ligases, and the seeds cover MIB1 and MIB2. The
      descendants include the human HERC2P3 gene product (Q9BVR0), a short fragment
      with only a Mib/HERC2 domain and no RING. It cannot be a ligase on its own, but
      it is a pseudogene product and does not warrant rejecting the node.
  - node_id: PANTHER:PTN001197468
    asserted_term:
