family_id: PANTHER:PTHR21255
family_name: T-COMPLEX-ASSOCIATED-TESTIS-EXPRESSED 1/ DYNEIN LIGHT CHAIN
preferred_name: Tctex-type dynein light chains
summary: Tctex-type proteins are small noncatalytic dynein-associated subunits with distinct roles in
  cytoplasmic and ciliary transport assemblies. DYNLT2B/TCTEX1D2 is an accessory component of dynein-2
  required for efficient retrograde intraflagellar transport. ATP-driven motility belongs to the dynein
  motor machinery rather than the light chain itself.
functional_coherence: HETEROGENEOUS
coherence_reason: The member inventory contains several Tctex paralogs, and direct TCTEX1D2 experiments
  define its dynein-2 specialization. Rhodopsin-binding observations for Tctex-1 cannot be used to assign
  that cargo or a photoreceptor-specific role to DYNLT2B or every family member.
