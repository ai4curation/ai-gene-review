subfamilies:
- subfamily_id: PANTHER:PTHR21496:SF23
  label: 3-PHENYLPROPIONATE_CINNAMIC ACID DIOXYGENASE FERREDOXIN SUBUNIT
  description: >-
    Dioxygenase-system Rieske ferredoxins (HcaC and relatives) together with the
    B. subtilis nitrite reductase small subunit NasE.
  representative_members:
  - id: UniProtKB:P42436
    label: Assimilatory nitrite reductase [NAD(P)H] small subunit
    gene_symbol: nasE
    organism: Bacillus subtilis (strain 168)
    gene_review: genes/BACSU/nasE/nasE-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    NasE has been recruited as the required small subunit of the NasDE NADH nitrite
    reductase, unlike the dioxygenase ferredoxins that dominate SF23. Its
    [2Fe-2S] binding is shared with them, but its partner and pathway are
    different.
  supported_by:
