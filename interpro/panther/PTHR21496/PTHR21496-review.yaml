family_id: PANTHER:PTHR21496
family_name: FERREDOXIN-RELATED
preferred_name: Rieske-type [2Fe-2S] ferredoxin family
summary: >-
  Small Rieske-type [2Fe-2S] proteins. Most characterized members are the
  ferredoxin components of bacterial aromatic-ring-hydroxylating dioxygenase and
  monooxygenase systems (3-phenylpropionate/cinnamate dioxygenase HcaC,
  naphthalene, benzene, toluene and biphenyl dioxygenase ferredoxins,
  methanesulfonate monooxygenase ferredoxin), which shuttle electrons from a
  reductase to the oxygenase. The family also includes sulredoxin and the
  Bacillus subtilis assimilatory nitrite reductase small subunit NasE (P42436).
  NasE is required with NasD for NADH-dependent nitrite reductase activity, so it
  is a component of a nitrite reductase rather than a dioxygenase electron
  carrier.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Rieske [2Fe-2S] fold and cluster binding are shared, but the partner
  systems differ: aromatic dioxygenases and monooxygenases for most members,
  sulredoxin in archaeal sulfur oxidation, and the NasDE nitrite reductase for
  NasE. NasE sits in SF23 with the dioxygenase ferredoxins, so subfamily
  membership does not identify the partner enzyme.
reference_protein:
