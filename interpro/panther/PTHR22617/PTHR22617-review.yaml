notes: >-
  PANTHER's family name ("CHEMOTAXIS SENSOR HISTIDINE KINASE-RELATED") reflects the CheW
  domain shared with the CheA P5 domain; the members are stand-alone CheW adaptors, not
  kinases. Node membership was read from the cached PANTHER treeinfo tree. KT2440 also
  encodes a second flagellar-cluster CheW-domain protein (PP_4333, Q88EW9) that has no
  PANTHER family assignment in its UniProt record and is not reviewed here.
