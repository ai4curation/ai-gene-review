family_id: PANTHER:PTHR22617
family_name: CHEMOTAXIS SENSOR HISTIDINE KINASE-RELATED
preferred_name: CheW chemosensory adaptor family
summary: >-
  CheW proteins are small (about 150-170 residue) single-domain adaptors built from
  two SH3-like subdomains. In chemosensory arrays CheW binds both the cytoplasmic tip
  of methyl-accepting chemoreceptors and the homologous CheW-like P5 domain of the CheA
  kinase, and so couples receptor signalling state to CheA activity. CheW is not an
  enzyme: its function is the stoichiometric bridging that lets receptors regulate
  CheA autophosphorylation and phosphotransfer to CheY and CheB. The PANTHER family
  holds the flagellar-chemotaxis CheW of enteric bacteria, B. subtilis and
  P. putida KT2440 (PP_4332), and the Pseudomonas aeruginosa PilI adaptor of the Chp
  chemosensory system that controls type IV pilus-based twitching motility.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized members are CheW-domain adaptors of chemosensory arrays. The
  downstream output varies (flagellar switching for enteric, Bacillus and Pseudomonas
  CheW; pilus-driven twitching for PilI), but the adaptor function is shared.
