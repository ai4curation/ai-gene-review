term_assessments:
- assessed_term:
    id: GO:0060090
    label: molecular adaptor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The GO definition is "The binding activity of a molecule that brings together two
    or more molecules through a selective, non-covalent, often stoichiometric
    interaction, permitting those molecules to function in a coordinated way." CheW
    bridges receptors and CheA and is required for receptor control of CheA, which is
    exactly that activity, and the CheW fold is conserved across all subfamilies. This
    is the activity the chemotaxis module asserts for its CheW annoton.
  supported_by:
  - reference_id: file:ECOLI/cheW/cheW-uniprot.txt
    supporting_text: It physically bridges CheA to the MCPs (methyl-accepting chemotaxis proteins) to allow
      regulated phosphotransfer to CheY and CheB.
  - reference_id: file:ECOLI/cheW/cheW-uniprot.txt
    supporting_text: An in vitro complex of CheW/CheA(L)/CheA(S) in a 1:1:1 ratio increases the autophosphorylation
      of CheA and is required for the binding of CheY, the phosphorylation substrate.
