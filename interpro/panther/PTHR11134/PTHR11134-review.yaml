family_id: PANTHER:PTHR11134
family_name: ADAPTOR COMPLEX SUBUNIT BETA FAMILY MEMBER
summary: Beta adaptins are large subunits of heterotetrameric adaptor complexes that sort membrane cargo.
  AP-1, AP-2, AP-3 and AP-4 operate at different membrane-trafficking steps and differ in coat partnerships.
  The beta-adaptin fold identifies a trafficking component without fixing a single organelle or vesicle
  coat.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory explicitly contains beta subunits of AP-1 through AP-4. Their cargo-adaptor
  architecture supports vesicle-trafficking participation, while coat recruitment and membrane compartment
  depend on the complex. The broad curated description overgeneralizes clathrin recruitment; AP-4 membership
  is not equivalent to a clathrin-binding beta-adaptin. NCU09721 needs its AP-1-specific comparison rather
  than a universal plasma-membrane endocytosis label.
term_assessments:
- assessed_term:
    id: GO:0030276
    label: clathrin binding
  scope: UNRESOLVED
  scope_reason: 'IPR026739 and the subfamily list distinguish AP-complex branches. The common description
    overgeneralizes clathrin recruitment across all AP complexes: clathrin binding and plasma-membrane
    endocytosis must be scoped to the appropriate complex. NCU09721 needs AP-1 placement evidence for
    a trans-Golgi/endosome interpretation.'
