family_id: PANTHER:PTHR11134
family_name: ADAPTOR COMPLEX SUBUNIT BETA FAMILY MEMBER
summary: >-
  Beta-adaptin large subunits (IPR026739) of eukaryotic heterotetrameric
  adaptor protein complexes (AP-1, AP-2, AP-3, and AP-4). Each beta subunit
  contains an N-terminal alpha-solenoid trunk domain that heterodimerizes with
  the complex-specific large subunit (gamma in AP-1, alpha in AP-2, delta in
  AP-3, epsilon in AP-4), a flexible hinge region (which carries a canonical
  clathrin-box motif in AP-1, AP-2, and AP-3 beta subunits), and a C-terminal
  appendage domain. The beta-adaptin fold identifies a cargo-adaptor trafficking
  component without fixing a single organelle or vesicle coat across all four
  complexes.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All subfamilies are large beta subunits of heterotetrameric AP cargo-adaptor
  complexes in vesicle-mediated transport across Eukaryota, but differ in
  organelle localization and clathrin recruitment: AP-1 beta (SF31, including
  human AP1B1, S. pombe Apl2, S. cerevisiae Apl2, and N. crassa NCU09721) and
  shared invertebrate AP-1/2 beta (SF3, C. elegans APB-1) act at the
  TGN/endosomes (and plasma membrane in SF3), AP-2 beta (SF9, human AP2B1, S.
  pombe Apl1, S. cerevisiae Apl1) mediates clathrin-dependent plasma-membrane
  endocytosis, AP-3 beta (SF10, SF11) acts in endosome-to-lysosome, melanosome,
  and synaptic vesicle sorting, and AP-4 beta (SF4, human AP4B1) forms a
  non-clathrin coat at the TGN (recruiting TEPSIN rather than clathrin) and
  lacks clathrin-binding activity.
subfamilies:
