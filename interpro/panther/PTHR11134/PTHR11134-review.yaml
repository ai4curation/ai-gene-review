term_assessments:
  - assessed_term:
      id: GO:0140312
      label: cargo adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All beta-adaptin subfamilies (AP1B1, AP2B1, AP3B1/2, AP4B1, and
      invertebrate apb-1) are core large subunits of heterotetrameric AP
      cargo-adaptor complexes that sort transmembrane cargo proteins into
      coated transport vesicles.
    supported_by:
      - reference_id: file:genes/human/AP1B1/AP1B1-uniprot.txt
        supporting_text: "The AP complexes mediate both the recruitment of clathrin to membranes and the recognition of sorting signals within the cytosolic tails of transmembrane cargo molecules."
