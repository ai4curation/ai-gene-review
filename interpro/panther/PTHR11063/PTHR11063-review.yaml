family_id: PANTHER:PTHR11063
family_name: GLUTAMATE SEMIALDEHYDE DEHYDROGENASE
preferred_name: Glutamate-5-semialdehyde dehydrogenase (ProA) / P5C synthase family
summary: >-
  Gamma-glutamyl phosphate reductases reduce L-glutamyl 5-phosphate to glutamate 5-semialdehyde,
  the second step of proline synthesis from glutamate. In bacteria and fungi this is a separate enzyme
  (ProA, S. cerevisiae PRO2, S. pombe pro1). In animals (ALDH18A1) and plants (P5CS) it is the C-terminal
  domain of a bifunctional P5C synthase whose N-terminal domain is glutamate 5-kinase.
functional_coherence: COHERENT
coherence_reason: >-
  Glutamate-5-semialdehyde dehydrogenase activity is shared by all members. Glutamate 5-kinase activity
  is present only in the bifunctional animal and plant P5CS proteins, which share SF8 with the monofunctional
  ProA enzymes.
