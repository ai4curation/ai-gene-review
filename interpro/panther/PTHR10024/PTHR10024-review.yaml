family_id: PANTHER:PTHR10024
family_name: SYNAPTOTAGMIN
preferred_name: Synaptotagmins and related tandem-C2 membrane proteins
summary: >-
  Animal membrane proteins with an N-terminal transmembrane segment and two
  cytosolic C2 domains (C2A and C2B), comprising synaptotagmins 1-17 and
  related tandem-C2 proteins. In the best-characterized members (SYT1, SYT2,
  SYT7, SYT9, C. elegans SNT-1) the C2 domains bind Ca2+ and anionic
  phospholipids and engage the SNARE complex, making them the Ca2+ sensors
  that trigger synaptic vesicle, dense-core vesicle and other regulated
  exocytosis. Several paralogs lack the Ca2+-coordinating residues in one or
  both C2 domains (synaptotagmin-12 binds neither Ca2+ nor phospholipids; the
  synaptotagmin-4 C2A domain does not bind Ca2+) and act as Ca2+-independent
  modulators of release.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Membrane trafficking through SNARE-engaging tandem C2 domains is shared
  across the family, but the Ca2+-sensing activity that defines the
  synaptotagmin-1 clade is not: synaptotagmin-12 does not bind Ca2+ or
  phospholipids, and the synaptotagmin-4 C2A domain does not bind Ca2+, yet
  PAINT places calcium ion sensor activity and calcium-dependent phospholipid
  binding at the family root, so every subfamily inherits them. The
  Ca2+-sensor claims were checked here only for the synaptotagmin-1
  subfamilies (SF239 vertebrate, SF227 invertebrate) and refuted for
  synaptotagmin-12; the other subfamilies were not checked.
