family_id: PANTHER:PTHR42829
family_name: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 5
preferred_name: Complex I / NDH-1 subunit L family (NuoL / mitochondrial ND5 / plastid NdhF; DabB)
summary: >-
  The largest antiporter-like membrane subunit of proton-pumping NADH:quinone
  oxidoreductases: bacterial NuoL (Nqo12), mitochondrially encoded ND5 and plastid NdhF.
  The family also includes the related archaeal F420H2 dehydrogenase subunit FpoL and the
  E. coli hydrogenase-4 subunit HyfD (subfamily SF2), and the DabB subunit of the DAB
  inorganic-carbon transporters (subfamily SF1). Members share the Mrp-type cation/proton
  antiporter fold: two inverted five-helix repeats forming proton half-channels joined by
  conserved central-axis charged residues. In E. coli complex I, NuoL is the distal
  subunit through which pumped protons exit, and its deletion halves the H+/2e-
  stoichiometry. Mrp antiporter subunits themselves are not in this family; they are
  homologues in related families.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF2 lumps the respiratory complex I subunit (bacterial NuoL, mitochondrial ND5), plastid
  NdhF of the ferredoxin:plastoquinone NDH complex, archaeal FpoL and the hydrogenase-4
  HyfD subunit. All of these are redox-coupled proton-pump modules, but they sit in
  different complexes with different donors and acceptors. SF1 (DabB) belongs to a
  CO2/bicarbonate uptake system rather than an electron-transport complex. Complex
  membership terms are therefore safe only on narrower nodes. The proton-pumping process
  term holds for the redox-coupled SF2 complexes.
