notes: >-
  Written to back the E. coli and P. putida KT2440 nuoL reviews for the bacterial
  respiratory complex I module. Node/term pairs, seeds, taxa and snapshot dates are
  verbatim from PTHR42829-paint.tsv (three IBD rows; no IRD/IKR rows). Subfamily
  composition and the FpoL (F1SVK0) and HyfD (P77416) members are from
  PTHR42829-entries.csv. The fetched slice contains no Mrp-type (MrpA/MnhA) antiporter
  subunits; those are homologous but sit in other PANTHER families. Plastid NdhF is in SF2,
  and DabB forms SF1. Scoping of the complex-membership nodes was checked against the GOA
  files of E. coli nuoL, P. putida nuoL and poplar ndhF. An odd SF2 member, Q35136
  (Neurospora "probable intron-encoded endonuclease 4"), is likely an nd5 intron ORF fused
  to ND5 exon sequence and was not assessed.
