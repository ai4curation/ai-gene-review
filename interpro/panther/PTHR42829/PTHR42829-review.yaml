subfamilies:
- subfamily_id: PANTHER:PTHR42829:SF2
  label: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 5
  description: >-
    Main subfamily (265 of 271 fetched entries): plastid NdhF (124), mitochondrial ND5
    (about 100), bacterial NuoL/Nqo12 (19, including E. coli and P. putida), plus archaeal
    FpoL (F1SVK0) and E. coli hydrogenase-4 HyfD (P77416). Respiratory complex I membership
    is correct only for the bacterial NuoL and mitochondrial ND5 clades. Plastid NdhF
    belongs to the thylakoid NDH complex, and HyfD/FpoL belong to their own
    complex I-related enzymes. The divergence is a set of clades inside SF2, not a
    subfamily boundary.
  representative_members:
