    label: NADH-quinone oxidoreductase subunit L
    gene_symbol: nuoL
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/nuoL/nuoL-ai-review.yaml
  - id: UniProtKB:Q88FG7
    label: NADH-quinone oxidoreductase subunit L
    gene_symbol: nuoL
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/nuoL/nuoL-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:21417432
    supporting_text: Our data suggest that the H+/2e- stoichiometry of the ΔNuoL variant
      is 2
  - reference_id: PMID:36104567
    supporting_text: This mechanism explains why protons exit exclusively from the NuoL
      subunit and is supported by our mutagenesis data.
- subfamily_id: PANTHER:PTHR42829:SF1
  label: INORGANIC CARBON TRANSPORTER SUBUNIT DABB-RELATED
  description: >-
    DabB subunits of DAB-type inorganic carbon uptake systems (Bacillus, Halothiobacillus,
    Hydrogenovibrio). They keep the antiporter-like fold but act in a CO2/bicarbonate
    transporter, not in an NADH:quinone oxidoreductase.
  representative_members:
  - id: UniProtKB:P39755
    gene_symbol: dabB
    organism: Bacillus subtilis (strain 168)
  diverged_from_family: true
  divergence_description: >-
    Not a complex I or NDH subunit. The NADH dehydrogenase activity and complex I or
    NADH dehydrogenase complex terms do not apply. Whether its transport is proton-coupled
    has not been checked against primary literature here.
  supported_by:
  - reference_id: PMID:12460669
    supporting_text: In Complex I, these polypeptides (NuoL/ND5, NuoM/ND4, NuoN/ND2) are
      most likely core components of the proton pumping mechanism
