term_assessments:
- assessed_term:
    id: GO:0015990
    label: electron transport coupled proton transport
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR42829:SF2
    label: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 5
  scope_reason: >-
    SF2 holds the antiporter-like NuoL / ND5 / NdhF / FpoL subunits of proton-pumping complex I, plastid
    NDH and F420H2 dehydrogenase, where electron transfer in the peripheral arm drives proton
    translocation through the membrane arm. SF1 holds DabB inorganic-carbon-transporter subunits, which
    are not part of an electron-transport complex; PANTHER's TreeGrafter annotations nonetheless give all
    11 SF1 nodes this term by descent from PTN000511978, so the term must not descend into SF1.
- assessed_term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  scope: UNRESOLVED
  scope_reason: >-
    The term holds, as contributes_to, for subunits of NADH-oxidising, ubiquinone-reducing complex I
    (e.g. E. coli and P. putida Nuo, mitochondrial complex I). It does not hold for members of plastid NDH
    (ferredoxin donor, plastoquinone acceptor), archaeal F420H2 dehydrogenase, or menaquinone-reducing
    actinobacterial complexes, and PANTHER subfamily boundaries in this family do not separate these
    lineages, so no subfamily scope is honest. Resolving it needs clade-level placement of the complex I
    versus NDH/Fpo lineages in the PANTHER tree (PTN nodes), which the cached files do not provide.
