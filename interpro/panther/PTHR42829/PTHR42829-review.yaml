    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: >-
    Bacterial complex I membership is scoped to a gammaproteobacterial node seeded by E.
    coli NuoL, which has experimental grounding (IDA, PMID:17722886). Plastid NdhF, FpoL,
    HyfD and DabB are kept out of it. P. putida KT2440 is a gammaproteobacterium, but its
    current GOA file carries no GO:0045271 row, so its review adds the term as NEW (ISS).
    Correctly placed.
- node_id: PANTHER:PTN000511978
  asserted_term:
    id: GO:0015990
    label: electron transport coupled proton transport
  evidence: IBD
  paint_snapshot: '20200205'
  seeds:
  - id: UniProtKB:P33607
    label: NADH-quinone oxidoreductase subunit L
    organism: Escherichia coli (strain K12)
  assessment: UNRESOLVED
  assessment_reason: >-
    Coupling electron transfer to proton pumping is the shared chemistry of bacterial
    NDH-1, mitochondrial complex I and plastid NDH, and the term is sound for SF2. The E.
    coli seed is supported by NuoL deletion halving the pumping stoichiometry (PMID:21417432),
    and the poplar ndhF review accepts the inherited IBA. PANTHER's TreeGrafter annotation
    file shows that all 11 SF1 (DabB) tree nodes, as well as the 300 SF2 nodes, inherit
    GO:0015990 from this node. DabB is an inorganic-carbon-transporter subunit and is not part
    of an electron-transport complex, so the node is probably too deep for SF1, but no cached
    experimental evidence on how DabAB is energized was reviewed here. The decision needs
    primary literature on DabAB energy coupling, or a PAINT re-placement of the IBD below the
    split between SF1 and SF2.
