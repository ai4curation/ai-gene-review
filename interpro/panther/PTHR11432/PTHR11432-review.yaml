family_id: PANTHER:PTHR11432
family_name: NADH DEHYDROGENASE SUBUNIT 1
preferred_name: Complex I / NDH-1 subunit H family (NuoH / mitochondrial ND1 / plastid NdhA)
summary: >-
  Core membrane subunit family of the proton-pumping NADH:quinone oxidoreductases:
  bacterial NuoH, mitochondrial ND1, and the plastid-encoded NdhA of the chloroplast NDH
  complex. Bacterial and mitochondrial members are respiratory, oxidizing NADH and
  reducing ubiquinone in NDH-1 or respiratory complex I during aerobic respiration. The
  plastid NdhA clade belongs to the thylakoid NAD(P)H dehydrogenase complex
  (GO:0010598), which runs photosynthetic cyclic electron flow around photosystem I and
  chlororespiration and reduces plastoquinone. PAINT already scopes the complex-term
  assertions in this family to taxon-restricted nodes; the remaining family-level
  assertions of respiratory process and NADH-donor activity still leak into the plastid
  clade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Respiratory members (NuoH, ND1) act in bacterial NDH-1 or mitochondrial respiratory
  complex I; the plastid NdhA clade acts in the thylakoid NDH complex in photosynthetic
  cyclic electron flow. The subfamily axis cannot express the split: the fetched slice
  places bacterial NuoH-type, mitochondrial ND1-type and chloroplastic NdhA members all
  in the single subfamily SF3.
reference_protein:
  id: UniProtKB:P0AFD4
  label: NADH-quinone oxidoreductase subunit H
  gene_symbol: nuoH
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/nuoH/nuoH-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR11432:SF3
    label: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 1
    description: >-
      The only subfamily populated in the fetched slice (687 entries): bacterial NuoH,
      mitochondrial ND1, plastid NdhA and archaeal FpoH alike, including E. coli NuoH
      (P0AFD4) and P. putida KT2440 NuoH (Q88FH1). The official name refers to
      mitochondrial ND1 and is not evidence that a member is mitochondrial. As a whole
      the subfamily does not diverge from the family; the plastid NdhA divergence is a
      clade within SF3 (see the NEEDS_PRUNING node assessments). The bacterial
      respiratory members used as module exemplars are correctly covered by the
      aerobic respiration, NADH dehydrogenase and complex I assertions; their gene
      reviews accept aerobic respiration and complex I and refine GO:0003954 to the
      more specific GO:0008137.
    diverged_from_family: false
    representative_members:
      - id: UniProtKB:P0AFD4
        label: NADH-quinone oxidoreductase subunit H
        gene_symbol: nuoH
        organism: Escherichia coli (strain K12)
        gene_review: genes/ECOLI/nuoH/nuoH-ai-review.yaml
      - id: UniProtKB:Q88FH1
        label: NADH-quinone oxidoreductase subunit H
        gene_symbol: nuoH
        organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
        gene_review: genes/PSEPK/nuoH/nuoH-ai-review.yaml

node_assessments:
  - node_id: PANTHER:PTN000153359
    asserted_term:
      id: GO:0009060
      label: aerobic respiration
    evidence: IBD
    paint_snapshot: "20251218"
    seeds:
      - id: FB:FBgn0013679
      - id: UniProtKB:P03886
        label: NADH-ubiquinone oxidoreductase chain 1
        organism: Homo sapiens
      - id: UniProtKB:P0AFD4
        label: NADH-quinone oxidoreductase subunit H
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Aerobic respiration is correct for the bacterial and mitochondrial seeds, but the
      plastid NdhA clade descends from this node (poplar ndhA receives the IBA with
      exactly this WITH/FROM) and functions in photosynthetic cyclic electron flow and
      chlororespiration, not aerobic respiration; the poplar gene review removes the
      inherited term. No affected subfamily is named because SF3 contains the
      respiratory and plastid members alike; pruning must happen at the plastid clade.
  - node_id: PANTHER:PTN000153359
    asserted_term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    evidence: IBD
    paint_snapshot: "20260528"
    seeds:
      - id: UniProtKB:P0AFD4
        label: NADH-quinone oxidoreductase subunit H
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      NADH-donor activity fits the respiratory members, but the plastid NDH complex
      accepts electrons from ferredoxin/NAD(P)H onto plastoquinone, so the
      NADH-specific activity term should not descend unmodified into the plastid NdhA
      clade; the poplar gene review keeps the chemistry via the better-matched
      quinone-acceptor term GO:0016655.
  - node_id: PANTHER:PTN000153361
    asserted_term:
      id: GO:0045271
      label: respiratory chain complex I
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260528"
    seeds:
      - id: FB:FBgn0013679
      - id: MGI:MGI:101787
      - id: UniProtKB:P03886
        label: NADH-ubiquinone oxidoreductase chain 1
        organism: Homo sapiens
      - id: UniProtKB:P03887
      - id: UniProtKB:P92558
    assessment: SOUND
    assessment_reason: >-
      Complex I membership is asserted on a taxon-scoped eukaryotic (mitochondrial ND1)
      node rather than the family root, so the plastid clade does not inherit it: poplar
      ndhA carries no GO:0045271 IBA. This is the correctly scoped counterpart to the
      family-level rows assessed above.
  - node_id: PANTHER:PTN000153412
    asserted_term:
      id: GO:0045271
      label: respiratory chain complex I
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1224
      label: Pseudomonadota
    paint_snapshot: "20240729"
    seeds:
      - id: UniProtKB:P0AFD4
        label: NADH-quinone oxidoreductase subunit H
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      The bacterial complex-membership assertion is scoped to a proteobacterial node,
      keeping it away from the plastid clade. Correctly placed.

term_assessments:
- assessed_term:
    id: GO:0015990
    label: electron transport coupled proton transport
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is a membrane-arm subunit (NuoH/ND1/NdhA) of a proton-pumping complex of the complex I
    superfamily: bacterial NDH-1, mitochondrial complex I, plastid NDH or archaeal F420H2
    dehydrogenase. In all of these the redox reaction is coupled to proton translocation, whatever the
    electron donor, so the coupled process holds family-wide; the entries file contains no member from a
    complex that is not a proton pump.
- assessed_term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  scope: UNRESOLVED
  scope_reason: >-
    The term holds, as contributes_to, for subunits of NADH-oxidising, ubiquinone-reducing complex I
    (e.g. E. coli and P. putida Nuo, mitochondrial complex I). It does not hold for members of plastid NDH
    (ferredoxin donor, plastoquinone acceptor), archaeal F420H2 dehydrogenase, or menaquinone-reducing
    actinobacterial complexes, and PANTHER subfamily boundaries in this family do not separate these
    lineages, so no subfamily scope is honest. Resolving it needs clade-level placement of the complex I
    versus NDH/Fpo lineages in the PANTHER tree (PTN nodes), which the cached files do not provide.
