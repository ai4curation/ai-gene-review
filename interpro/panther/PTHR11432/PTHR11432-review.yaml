notes: >-
  Written during the POPTR IBA re-review pass to back the poplar ndhA gene review. All
  node/term pairs, seeds, taxa and snapshot dates are verbatim from the cached
  PTHR11432-paint.tsv (taxon ids expanded to NCBITaxon CURIEs as the schema requires);
  the single-subfamily composition comes from the fetched PTHR11432-entries.csv. UniProt
  labels for P03886 and P0AFD4 verified against UniProt. The two SOUND assessments are
  recorded deliberately: this family shows both the failure mode (family-root process
  and activity assertions leaking into the plastid clade) and the fix (taxon-scoped
  complex-membership nodes) side by side. No residue_sites: the split is a clade-level
  co-option, not a point-residue question.
  2026-10-23 (bacterial respiratory complex I module pass): added gene_review path to
