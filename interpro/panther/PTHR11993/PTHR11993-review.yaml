reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the human NDUFS2 gene review. All node ids, GO ids, seed lists, taxa
  and snapshot dates are copied verbatim from the cached PTHR11993-paint.tsv; subfamily
  ids and names are verbatim from panther.obo and the counts from the fetched
  PTHR11993-entries.csv (638 members sampled: 512 in SF10, 126 in SF45, of which 134 are
  chloroplastic or organellar NdhH proteins, all in SF10).

  On the project's central question - why does a human gene here receive no IBA - the
  answer for NDUFS2 is that it does. Its GOA record carries four ECO:0000318 rows
  (GO:0005743, GO:0045271, GO:0008137, GO:0006120), exactly matching the four IBDs at
  PTN000241916, and human O75306 is itself a seed on all four. The gene was presumably
  selected on a different criterion, or the no-IBA snapshot predates the current PAINT
  slice. The real gap is narrower and worth acting on: no node in this family asserts any
  quinone-binding term, even though the quinone chamber is the one thing every member of
  the family contributes and the His/Tyr pair that lines it is invariant from E. coli to
  chloroplasts. GO:0048038 at the family root is the missing IBD.

  Residue positions were derived as follows and are reproducible: Cys326/332/347 and
  Arg118 are read directly from the O75306 UniProt feature table; His92/Tyr141 are the
  precursor-numbering equivalents of the mature-chain His59/Tyr108 named in the complex I
  literature, confirmed by checking that O75306 carries H and Y at those positions and
  that global BLOSUM62 alignments map them to His/Tyr in P17694, P33599, P93306 and
  A4GYX2. The negative controls for the cysteine site were obtained from the same
  alignments and confirmed by direct indexing of the fetched sequences.
