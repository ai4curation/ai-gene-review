residue_sites:
  - site_id: quinone_channel_his_tyr
    label: Quinone-headgroup His/Tyr pair at the mouth of the Q-channel
    description: >-
      The two invariant residues that hydrogen-bond the quinone headgroup where it enters
      the reduction chamber formed by this subunit. Positions are given in the O75306
      precursor numbering used by UniProt; because the human protein carries a 33-residue
      mitochondrial transit peptide, they correspond to the His59/Tyr108 pair of the
      mature chain that the complex I literature refers to. Both positions are invariant
      across the family: His92/Tyr141 in human and bovine NDUFS2, His224/Tyr273 in the
      E. coli NuoCD fusion, and His23/Tyr72 in both Arabidopsis NAD7 and poplar plastid
      NdhH. The pair is therefore quinone-generic, not ubiquinone-specific, which is why
      it is offered here as support for GO:0048038 rather than for GO:0048039.
    anchor:
      id: UniProtKB:O75306
      label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
      gene_symbol: NDUFS2
      organism: Homo sapiens
    residues:
      - position: 92
        expected:
          - H
        role: quinone headgroup hydrogen-bond donor at the Q-channel mouth
      - position: 141
        expected:
          - Y
        role: quinone headgroup contact adjacent to the redox site
    site_source: LITERATURE
    required_for:
      - term:
          id: GO:0048038
          label: quinone binding
        strength: CONTRIBUTES
        rationale: >-
          Quinone reduction in complex I happens in a chamber whose polar mouth is built
          from this subunit; the His/Tyr pair is what orients and polarises the headgroup
          so it can accept the two electrons arriving from the N2 cluster on the adjacent
          subunit. Loss of either residue degrades headgroup positioning rather than
          abolishing the cavity, so the dependency is recorded as CONTRIBUTES: a member
          lacking one of them may still bind quinone poorly, and no gene review should be
          contradicted on the strength of this site alone.
        supported_by:
          - reference_id: file:human/NDUFS2/NDUFS2-deep-research-falcon.md
            supporting_text: >-
              NDUFS2 lines the amphipathic Q-channel and contributes the conserved His/Tyr
              ligand pair (His59, Tyr108) that interacts with the quinone headgroup and
              small-molecule Q-site ligands
          - reference_id: PMID:22036843
            supporting_text: >-
              A 3-D model of the catalytic core of complex I showed that the mutated amino
              acid residue resides near the coenzyme Q binding pocket
    positive_controls:
      - id: UniProtKB:P17694
        label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
        gene_symbol: NDUFS2
        organism: Bos taurus
        control_position: 92
        control_residue: H
      - id: UniProtKB:P33599
        label: NADH-quinone oxidoreductase subunit C/D
        gene_symbol: nuoC
        organism: Escherichia coli (strain K12)
        control_position: 224
        control_residue: H
      - id: UniProtKB:A4GYX2
        label: NAD(P)H-quinone oxidoreductase subunit H, chloroplastic
        gene_symbol: ndhH
        organism: Populus trichocarpa
        control_position: 23
        control_residue: H
  - site_id: vestigial_hydrogenase_cys
    label: Cysteines UniProt assigns as [4Fe-4S] ligands by similarity
    description: >-
      UniProt annotates a single [4Fe-4S] cluster on human NDUFS2 with three cysteine
      ligands, Cys326/Cys332/Cys347, on ECO:0000255 (by similarity) evidence inherited
      from the [NiFe] hydrogenase large-subunit fold this family retains. The site is
      recorded here so that the claim can be checked rather than repeated. Three ligands
      is one short of what a [4Fe-4S] cluster requires; the middle position is not a
      cysteine in E. coli NuoCD (Leu465) nor in plastid NdhH (Val263, which has lost all
      three); Arabidopsis NAD7 has a cysteine one position earlier rather than at the
      aligned column; and no cryo-EM structure of bacterial, mitochondrial or plastid
      complex I places an iron-sulfur cluster on this subunit at all - the terminal N2
      cluster sits on NuoB/NDUFS7. No positive control is listed because no member of the
      family has been verified to hold a cluster here, which is the point of the record.
    anchor:
      id: UniProtKB:O75306
      label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
      gene_symbol: NDUFS2
      organism: Homo sapiens
    residues:
      - position: 326
        expected:
          - C
        role: putative [4Fe-4S] ligand (UniProt, by similarity)
      - position: 332
        expected:
          - C
        role: putative [4Fe-4S] ligand (UniProt, by similarity); not conserved outside
          the animal orthologues
      - position: 347
        expected:
          - C
        role: putative [4Fe-4S] ligand (UniProt, by similarity)
    site_source: UNIPROT_FEATURE
    required_for:
      - term:
          id: GO:0051539
          label: 4 iron, 4 sulfur cluster binding
        strength: ASSOCIATED
        rationale: >-
          Recorded at ASSOCIATED deliberately, as a brake rather than a licence. A
          [4Fe-4S] cluster is held by four thiolates; only three are annotated here, one
          of them is absent in the bacterial and plastid members, and the structural
          record assigns no cluster to this subunit in any organism. The residues are
          best read as the degenerate remnant of the ancestral hydrogenase metal site,
          so their presence must not be used to justify an iron-sulfur binding annotation
          on a member of this family, and their absence must not be used to argue that a
          member has lost a function it never had.
    negative_controls:
      - id: UniProtKB:P33599
        label: NADH-quinone oxidoreductase subunit C/D
        gene_symbol: nuoC
        organism: Escherichia coli (strain K12)
        control_position: 465
        control_residue: L
      - id: UniProtKB:A4GYX2
        label: NAD(P)H-quinone oxidoreductase subunit H, chloroplastic
        gene_symbol: ndhH
        organism: Populus trichocarpa
        control_position: 263
        control_residue: V
  - site_id: ndufaf7_dimethylarginine
    label: NDUFAF7 symmetric dimethylarginine site
    description: >-
      Arg118 in O75306 precursor numbering, which is the Arg-85 of the mature chain that
      NDUFAF7 symmetrically dimethylates. The arginine itself is conserved well beyond
      the enzyme that modifies it - it is present in bovine NDUFS2 (Arg118), Arabidopsis
      NAD7 (Arg49), poplar NdhH (Arg49) and E. coli NuoCD (Arg250) - so conservation of
      the residue is not evidence that a member is methylated. NDUFAF7 orthologues are
      eukaryotic, and the modification is experimentally established only in the
      mitochondrial members.
    anchor:
      id: UniProtKB:O75306
      label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
      gene_symbol: NDUFS2
      organism: Homo sapiens
    residues:
      - position: 118
        expected:
          - R
        role: acceptor of symmetric omega-N(G),N(G') dimethylation by NDUFAF7
    site_source: UNIPROT_FEATURE
    required_for:
      - term:
          id: GO:0032981
          label: mitochondrial respiratory chain complex I assembly
        strength: CONTRIBUTES
        rationale: >-
          Methylation of this arginine happens on the early peripheral-arm intermediate
          and stabilises the ~400 kDa subcomplex that nucleates the junction between the
          peripheral and membrane arms, so the modification acts on assembly rather than
          on catalysis by the mature enzyme. CONTRIBUTES rather than REQUIRED because
          loss of NDUFAF7 reduces assembled complex I without abolishing it, and because
          the requirement is a property of the eukaryotic assembly pathway rather than of
          this subunit's own chemistry.
        supported_by:
          - reference_id: PMID:24089531
            supporting_text: >-
              it is a protein methylase that symmetrically dimethylates the
              ω-N(G),N(G') atoms of residue Arg-85 in the NDUFS2 subunit of complex I
          - reference_id: PMID:24089531
            supporting_text: >-
              This methylation step occurs early in the assembly of complex I and
              probably stabilizes a 400-kDa subcomplex that forms the initial nucleus of
              the peripheral arm and its juncture with the membrane arm
    positive_controls:
      - id: UniProtKB:P17694
        label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
        gene_symbol: NDUFS2
        organism: Bos taurus
        control_position: 118
        control_residue: R

term_assessments:
  - assessed_term:
      id: GO:0048038
      label: quinone binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member of the family, respiratory and plastid alike, builds the chamber in
      which a quinone is reduced, and the His/Tyr pair that contacts the headgroup is
      invariant across animals, plants, plastids and bacteria (see the
      quinone_channel_his_tyr site). The term names the chemistry without naming the
      acceptor, which is precisely the granularity at which this family is coherent. This
      is also the term a future PAINT curator could safely place at the family root: no
      node in the current PTHR11993 PAINT slice asserts any quinone-binding term at all,
      although the quinone channel is the defining structural contribution of the
      subunit.
  - assessed_term:
      id: GO:0048039
      label: ubiquinone binding
    scope: UNRESOLVED
    scope_reason: >-
      Safe for the respiratory clade - human and bovine NDUFS2, plant NAD7, bacterial
      NuoD in ubiquinone-using lineages - and wrong for the plastid NdhH clade, whose
      complex reduces plastoquinone. It is recorded as UNRESOLVED rather than
      SUBFAMILY_ONLY because the boundary cannot be expressed on PANTHER's subfamily
      axis: PTHR11993:SF10 contains both the mitochondrial NDUFS2 orthologues and all 134
      chloroplastic NdhH members, so naming SF10 as the applicable subfamily would grant
      the term to exactly the clade it must be kept from. The scoping has to be done at a
      clade (PTN) level. The same shape of problem was recorded for PTHR11058, where
      GO:0008137 on a deep node leaks into the plastid NdhC clade.
    supported_by:
      - reference_id: PMID:22036843
        supporting_text: >-
          We propose that the mutation interferes with the reduction of coenzyme Q or
          with the coupling of coenzyme Q reduction with the conformational changes
          involved in proton pumping of complex I
  - assessed_term:
      id: GO:0051287
      label: NAD binding
    scope: NOT_APPLICABLE
    scope_reason: >-
      No member of this family binds NAD or NADH. In every complex I and NDH-1 the
      nucleotide site and the FMN that accepts the hydride sit on the 51 kDa flavoprotein
      subunit (NuoF / NDUFV1, PANTHER:PTHR11780), roughly 90 A away along the peripheral
      arm from the quinone chamber this family builds. The annotation nevertheless
      reaches members electronically: human NDUFS2 and poplar plastid ndhH carry
      identical InterPro signature sets (IPR001135, IPR014029, IPR022885, IPR029014) and
      both receive GO:0051287 by InterPro2GO, in poplar's case on a protein whose complex
      cannot oxidise NADH at all because it has no N-module. This is a family-level
      mapping error, not a per-gene one, and it is the reason the human NDUFS2 review
      removes its GO:0051287 IEA.
  - assessed_term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    scope: RESIDUE_DETERMINED
    determined_by_site: vestigial_hydrogenase_cys
    scope_reason: >-
      Formally residue-determined, and in practice the residues argue against the term
      rather than for it. The UniProt cofactor annotation that generates this term for
      human NDUFS2 is by-similarity only, cites three ligands where four are needed, and
      names a middle cysteine that is absent from the bacterial and plastid members; no
      structure assigns a cluster to this subunit in any organism. Pointing the term at
      the site makes that checkable instead of rhetorical. A curator propagating
      iron-sulfur terms in this family should place them on NuoB/NDUFS7, which carries
      N2, not here.
  - assessed_term:
      id: GO:0005743
      label: mitochondrial inner membrane
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR11993:SF10
        label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 2, MITOCHONDRIAL
    scope_reason: >-
      Recorded as subfamily-scoped with the explicit caveat that SF10 is the mixed
      subfamily: the term is right for the mitochondrial NDUFS2/NAD7 members inside it
      and wrong for the chloroplastic NdhH members inside it, which belong to the
      thylakoid membrane, and wrong for the bacterial NuoD members in SF10, which belong
      to the plasma membrane. SF45 (the bacterial NuoCD fusions) is excluded outright.
      The PAINT curation currently gets this right by node placement rather than by
      subfamily, which is the safer mechanism and the one to keep using.

