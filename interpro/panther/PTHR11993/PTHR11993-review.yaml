family_id: PANTHER:PTHR11993
family_name: NADH-UBIQUINONE OXIDOREDUCTASE 49 KDA SUBUNIT
preferred_name: >-
  Complex I / NDH-1 subunit D family (bacterial NuoD, mitochondrial NDUFS2 / NAD7,
  plastid NdhH)
summary: >-
  The large "49 kDa" subunit that forms the quinone-reduction chamber of every
  proton-pumping NADH:quinone oxidoreductase and of the plastid NDH complex. Members
  are bacterial NuoD (often fused to NuoC as a single NuoCD chain), mitochondrial
  NDUFS2 and its organelle-encoded plant counterpart NAD7, and the plastid-encoded
  NdhH of the thylakoid NAD(P)H dehydrogenase complex. The subunit descends from the
  large subunit of [NiFe] hydrogenase and retains that fold, but the metal site is
  vestigial: no structure of bacterial, mitochondrial or plastid complex I places an
  iron-sulfur cluster on it, and the terminal N2 cluster that delivers electrons into
  the quinone site is held by the neighbouring NuoB/NDUFS7 subunit instead. What the
  subunit does contribute, family-wide, is the amphipathic quinone channel and the
  invariant His/Tyr pair at its mouth that hydrogen-bonds the quinone headgroup. The
  identity of that quinone is where the family divides: ubiquinone or menaquinone in
  the respiratory members, plastoquinone in the plastid NdhH clade, whose complex is
  reduced by ferredoxin rather than by NADH and runs cyclic electron flow around
  photosystem I rather than respiration.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Respiratory members (NuoD, NDUFS2, NAD7) sit in bacterial NDH-1 or mitochondrial
  complex I and reduce ubiquinone or menaquinone downstream of NADH oxidation; the
  plastid NdhH clade sits in the thylakoid NDH complex, which lacks the whole N-module
  (there is no plastid counterpart of NuoE/NuoF/NuoG), takes its electrons from
  ferredoxin and reduces plastoquinone. 134 of the 638 members in the fetched entries
  slice are chloroplastic or organellar NAD(P)H-quinone oxidoreductase subunit H
  proteins, and every one of them is binned into PTHR11993:SF10 alongside human
  NDUFS2, under the subfamily name "NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR
  PROTEIN 2, MITOCHONDRIAL". The functional boundary is therefore a clade inside a
  subfamily, not a subfamily boundary, and any term scoped to SF10 will be wrong for
  one side of it.
reference_protein:
  id: UniProtKB:O75306
  label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
  gene_symbol: NDUFS2
  organism: Homo sapiens
  gene_review: genes/human/NDUFS2/NDUFS2-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR11993:SF10
    label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 2, MITOCHONDRIAL
    description: >-
      The large subfamily (512 of 638 members in the fetched slice) and the one that is
      functionally mixed. It holds the mitochondrial NDUFS2 orthologues the name refers
      to, the organelle-encoded plant NAD7 proteins, most unfused bacterial NuoD chains,
      and the entire set of chloroplastic NdhH proteins. The official name describes only
      the first of these groups, so it must not be read as a statement that the subfamily
      is mitochondrial or that its members act on ubiquinone.
    diverged_from_family: false
    representative_members:
      - id: UniProtKB:O75306
        label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
        gene_symbol: NDUFS2
        organism: Homo sapiens
        gene_review: genes/human/NDUFS2/NDUFS2-ai-review.yaml
      - id: UniProtKB:P17694
        label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2, mitochondrial
        gene_symbol: NDUFS2
        organism: Bos taurus
      - id: UniProtKB:P93306
        label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 2
        gene_symbol: NAD7
        organism: Arabidopsis thaliana
      - id: UniProtKB:A4GYX2
        label: NAD(P)H-quinone oxidoreductase subunit H, chloroplastic
        gene_symbol: ndhH
        organism: Populus trichocarpa
        gene_review: genes/POPTR/ndhH/ndhH-ai-review.yaml
  - subfamily_id: PANTHER:PTHR11993:SF45
    label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT C_D
    description: >-
      Bacterial chains in which the NuoC (NDUFS3-like) and NuoD (49 kDa) subunits are
      fused into one polypeptide, as in Escherichia coli NuoCD (596 residues against
      the ~400 of an unfused NuoD). 126 of the 638 fetched members. Functionally this is
      still the respiratory subunit D plus its neighbour, not a divergent activity, but
      the fusion means residue positions in these members are offset by the length of
      the C-domain and cannot be compared to NDUFS2 numbering without alignment.
    diverged_from_family: false
    representative_members:
      - id: UniProtKB:P33599
        label: NADH-quinone oxidoreductase subunit C/D
        gene_symbol: nuoC
        organism: Escherichia coli (strain K12)

