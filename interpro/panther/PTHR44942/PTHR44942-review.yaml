notes: |-
  SCHPO/SPAC25B8.09: Q9UTA9, 251 aa, sequence version 1; cohorts POMBE_REMAINING8. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:Q9UTA9: the frozen UniProt record records PTHR44942:SF4 (METHYLTRANSFERASE TYPE 11 DOMAIN-CONTAINING PROTEIN), whereas the authenticated official PANTHER 19.0 fission_yeast sequence-classification row 1845 records PTHR42912:SF95 (METHYLTRANSFERASE TYPE 11 DOMAIN-CONTAINING PROTEIN). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Withdraw SPAC25B8.09 membership; retain the Tmt1-supported summary and MOSTLY_COHERENT assessment of the cached cohort, with the existing UNRESOLVED universal scope. Equal methyltransferase labels across two parent families do not identify the correct phylogenetic placement.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

  Preserved previous placement and biological interpretation (historical evidence; membership assertions below are not current claims):
  summary: Methyltransferase type-11 proteins including fission-yeast SPAC25B8.09 and budding-yeast Tmt1.
    Tmt1 catalyzes trans-aconitate methylation and also modifies 3-isopropylmalate, its major endogenous
    substrate in yeast extracts. PomBase transfers trans-aconitate activity to SPAC25B8.09 by curated orthology,
    while its predominant physiological substrate remains unresolved.
  coherence_reason: The characterized Tmt1 member supports SAM-dependent small-molecule methylation within
    this sequence group. Even that enzyme accepts more than one biologically relevant substrate. Conservation
    of a particular acceptor, detoxification function or starvation-response pathway throughout the complete
    family is not established.
