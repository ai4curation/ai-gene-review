family_id: PANTHER:PTHR44942
family_name: METHYLTRANSF_11 DOMAIN-CONTAINING PROTEIN
summary: Methyltransferase type-11 proteins include enzymes acting on small molecules. Budding-yeast Tmt1
  catalyzes trans-aconitate methylation and also modifies 3-isopropylmalate, its major endogenous substrate
  in yeast extracts.
functional_coherence: COHERENT
coherence_reason: >-
  The family supports a common SAM-dependent methyl-transfer mechanism at a broad level. Tmt1 P32643 has
  direct biochemical evidence and an independently corroborated PTHR44942:SF4 placement; the cached reviewed
  inventory comprises methyltransferase and methyltransferase-like proteins across different substrate
  contexts. Tmt1 itself acts on multiple small molecules. Its SAM-dependent methyltransferase superfamily
  assignment corroborates the mechanism, while its Pfam assignment is Methyltransf_31 rather than proof
  that every member has an identical type-11 domain. Shared methyl-transfer chemistry is inferred without
  a universal acceptor, detoxification role or nutrient-response pathway. Generated InterPro prose is
  not treated as independent experimental evidence.
