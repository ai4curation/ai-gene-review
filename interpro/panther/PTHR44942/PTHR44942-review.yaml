notes: |-
  SCHPO/SPAC25B8.09: Q9UTA9, 251 aa, sequence version 1; cohorts POMBE_REMAINING8. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | Q9UTA9 (fission_yeast / 1845) | PTHR44942:SF4 — METHYLTRANSFERASE TYPE 11 DOMAIN-CONTAINING PROTEIN | PTHR42912:SF95 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  Budding-yeast Tmt1 P32643 experimentally catalyzes SAM-dependent trans-aconitate methylation (PMID:11695919) and also methylates 3-isopropylmalate, the major endogenous substrate observed in yeast extracts (PMID:15147181). PomBase transfers trans-aconitate activity to SPAC25B8.09 by curated orthology; the predominant physiological substrate in fission yeast remains unresolved. These findings do not establish a universal acceptor, detoxification role or starvation-response pathway. The official budding_yeast row 855 independently records P32643 as PTHR44942:SF4 (METHYLTRANSFERASE TYPE 11 DOMAIN-CONTAINING PROTEIN). This corroborates the cached parent placement and supplies an established in-family biochemical anchor; it does not establish whole-family substrate or activity coverage. Equal type-11 methyltransferase labels for the disputed SPAC25B8.09 assignments do not resolve evolutionary placement.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR44942/PTHR44942-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

