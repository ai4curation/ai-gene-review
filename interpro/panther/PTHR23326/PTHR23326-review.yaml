family_id: PANTHER:PTHR23326
family_name: CCR4 NOT-RELATED
preferred_name: CNOT2/CNOT3/NOT2/NOT3/NOT5 noncatalytic CCR4-NOT subunits
summary: >-
  PTHR23326 is the Not2/Not3/Not5 branch of conserved CCR4-NOT noncatalytic
  subunits. Family members use a C-terminal NOT box to assemble the NOT module on
  the CNOT1/Not1 scaffold, allowing the CCR4-NOT complex to position and stimulate
  catalytic CAF1/CCR4-family deadenylases during cytosolic mRNA poly(A)-tail
  shortening. Human CNOT2 belongs to the SF3 Not2-like branch, whereas human CNOT3
  belongs to the SF1 Not3/Not5-like branch and has gained a vertebrate
  ribosome/tRNA-recognition role through its N terminus.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed human paralogs and PAINT seeds retain the ancestral noncatalytic
  CCR4-NOT assembly and deadenylation roles. Vertebrate CNOT2 and CNOT3 are
  separated into SF3 and SF1, respectively; both keep the shared NOT-box/core-complex
  activity, while CNOT3 has an additional N-terminal ribosome/tRNA adaptor activity
  that is outside the PAINT rows assessed here.
