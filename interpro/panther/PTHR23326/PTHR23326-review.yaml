  either lineage. The cached PTHR23326 tree places the common CNOT2/CNOT3 node at
  PTN000595684, the SF3/CNOT2-lineage stem-cell row at PTN000595688, and the
  SF1/CNOT3-lineage stem-cell row at PTN000595760; this review therefore records
  sound IBD propagation and does not request any PAINT pruning action.
