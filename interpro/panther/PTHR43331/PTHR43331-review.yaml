term_assessments:
- assessed_term:
    id: GO:0004412
    label: homoserine dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The family's defining activity, asserted at PTN000752178 with seeds from two bacterial
    phyla and received by 41 bacterial, archaeal and algal reference-proteome members. The GO
    definition is written with NADP+, so a strictly NAD-dependent member is the one exception.
  member_exceptions:
  - member:
      id: UniProtKB:P0DXC5
      label: NAD(+)-dependent homoserine dehydrogenase
      organism: Pseudomonas canavaninivorans
    exception_reason: >-
      Assayed homoserine dehydrogenase that uses only NAD+ and shows no NADP+ activity, so
      the NADP+-defined term does not fit it; its NAD-dependent activity is better described
      by alcohol dehydrogenase (NAD+) activity. It is not a PAINT reference-proteome leaf,
      so no IBA currently reaches it.
    supported_by:
    - reference_id: PMID:36320885
      supporting_text: We also observed that the reaction of HD was only dependent on the
        cofactor NAD+ and that HD showed no activity utilizing NADP+
  supported_by:
  - reference_id: file:interpro/panther/PTHR43331/PTHR43331-paint.tsv
    supporting_text: "PTHR43331\tPTN000752178\tGO:0004412\tF\tIBD\tfalse\tUniProtKB:P19582|UniProtKB:P29365"
- assessed_term:
    id: GO:0009088
    label: L-threonine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Hom catalyses the third step of threonine synthesis in every lineage where it is the
    homoserine-forming enzyme; the term is asserted at the same node as the activity. The
    canavanine-catabolic P0DXC5 is the documented exception. Methionine biosynthesis is
    also supplied by homoserine but is not asserted by PAINT for this family.
  member_exceptions:
  - member:
      id: UniProtKB:P0DXC5
      label: NAD(+)-dependent homoserine dehydrogenase
      organism: Pseudomonas canavaninivorans
    exception_reason: >-
      Oxidizes homoserine released by canavanine-gamma-lyase during canavanine utilization,
      a catabolic rather than threonine biosynthetic role.
    supported_by:
    - reference_id: PMID:36320885
      supporting_text: Indeed, when combining purified HD with either of the two aldehyde-dehydrogenases
        AH or AC and AAL the formation of fumarate via aspartate was observed
  supported_by:
  - reference_id: file:interpro/panther/PTHR43331/PTHR43331-paint.tsv
    supporting_text: "PTHR43331\tPTN000752178\tGO:0009088\tP\tIBD\tfalse\tUniProtKB:P29365"
- assessed_term:
    id: GO:0004022
    label: alcohol dehydrogenase (NAD+) activity
  scope: UNRESOLVED
  scope_reason: >-
    NAD-linked homoserine oxidation is member-dependent: in a survey of enterobacteria and
    pseudomonads, most of the bacteria examined used either NAD or NADP with widely varying
    relative activity (no actinobacteria were examined), and P0DXC5 is NAD-only. No PAINT node asserts it. Gene reviews therefore decide it on
    target evidence: C. glutamicum Hom keeps it as non-core because UniProt curates the
    NAD-linked reaction with experimental attachments, whereas P. putida Hom refines an
    ARBA-only NAD reaction to homoserine dehydrogenase activity.
  supported_by:
  - reference_id: PMID:4391829
    supporting_text: In most of the bacteria examined, either nicotinamide adenine dinucleotide
      (NAD) or nicotinamide adenine dinucleotide phosphate can serve as a cofactor for this
      enzyme, though the relative activity with the two pyridine nucleotides varies widely.
