family_id: PANTHER:PTHR43331
family_name: HOMOSERINE DEHYDROGENASE
preferred_name: Standalone (monofunctional) bacterial and archaeal homoserine dehydrogenases
summary: >-
  Monofunctional homoserine dehydrogenases (Hom, EC 1.1.1.3) of bacteria and archaea, with an
  N-terminal NAD(P)-binding Rossmann domain, a catalytic/dimerization domain and, in many
  bacterial members, a C-terminal ACT regulatory domain that mediates threonine feedback
  inhibition. They reduce L-aspartate 4-semialdehyde to L-homoserine, the branch point for
  threonine and methionine synthesis. All 19 reviewed members, including C. glutamicum Hom
  (P08499), B. subtilis Hom and P. aeruginosa Hom, are in the single named subfamily SF1. The
  bifunctional aspartokinase-homoserine dehydrogenases of enterobacteria and plants, and the
  fungal HOM6-type enzymes, are in the separate family PTHR43070.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  18 of 19 reviewed members are named homoserine dehydrogenase and PAINT places the activity
  and threonine biosynthesis at one node seeded by B. subtilis and P. aeruginosa Hom.
  Pyridine-nucleotide use varies across the family: many enzymes use NADP(H) and NAD(H), and
  the reviewed P. canavaninivorans enzyme (P0DXC5) is strictly NAD-dependent and acts in
  canavanine catabolism rather than threonine biosynthesis.
