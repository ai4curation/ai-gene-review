notes: >-
  Used by modules/bacterial_aspartate_to_threonine_biosynthesis.yaml for the homoserine
  dehydrogenase step of the P. putida KT2440 (Q88MU8) and C. glutamicum ATCC 13032 (P08499)
  routes, both grounded at PANTHER:PTHR43331:SF1. Neither protein is a PAINT reference-proteome
  leaf, so neither carries an IBA from PTN000752178; their homoserine dehydrogenase activity is
  accepted in their gene reviews from family, curated and (for C. glutamicum) experimental
  evidence. The E. coli route uses the HDH domain of the bifunctional ThrA/MetL enzymes in
  PTHR43070 instead.
