family_id: PANTHER:PTHR11624
family_name: DEHYDROGENASE RELATED
preferred_name: Pyruvate dehydrogenase E1 beta subunit family (PDB1/PDHB)
summary: >-
  The beta subunit of the alpha2beta2 E1 component of mitochondrial pyruvate dehydrogenase (S. cerevisiae
  PDB1, S. pombe pdb1, human PDHB, plant E1 beta). With E1 alpha it decarboxylates pyruvate and transfers
  the acetyl group to the lipoyl arm of E2.
functional_coherence: COHERENT
coherence_reason: All members are PDH E1 beta subunits (SF96, and plant SF112).
