family_id: PANTHER:PTHR40267
family_name: BLR3294 PROTEIN
preferred_name: Maleate isomerase / arylmalonate decarboxylase family (MaiA, AMDase)
summary: >-
  A small family of the Asp/Glu racemase-like (aspartate/glutamate racemase superfamily) fold, InterPro
  MaiA/AMDase (IPR026286, Pfam Amdase). It contains two activities that act on a deprotonable C-H next to
  a carboxylate and depend on active-site cysteines. Maleate isomerases (MaiA, Iso) convert maleate to
  fumarate. Arylmalonate decarboxylase (AMDase) of Bordetella bronchiseptica decarboxylates arylmalonates
  to optically pure arylacetates. Characterized maleate isomerases come from Alcaligenes faecalis,
  Geobacillus, Nocardia and Pseudomonas putida S16; the S16 Iso was purified and shown to convert
  maleate to fumarate, and its crystal structures were solved. Pseudomonas putida KT2440 MaiA (NicE)
  of aerobic nicotinate degradation is assigned the same reaction by homology and pathway context.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Four of the five Swiss-Prot members are named maleate isomerases, and the KT2440 and S16 proteins
  carry the IPR028615 maleate-isomerase signature. The exception is Bordetella bronchiseptica AMDase (Q05115), an
  experimentally characterized arylmalonate decarboxylase in the same single subfamily (SF1). Every
  member, including the archaeal, fungal and Streptomyces tree leaves, is classified SF1, so maleate
  isomerase activity cannot be separated from AMDase by subfamily and needs the member exception.
