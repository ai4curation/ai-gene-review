notes: >-
  No PAINT IBD/IRD annotations exist for this family (`just fetch-panther-paint PTHR40267` retained no
  slice), so there are no node assessments. The cached PANTHER 19.0 tree has six leaves (fungal,
  archaeal, Streptomyces, Bradyrhizobium), all SF1; none of the characterized proteins is a tree
  leaf. S16 MaiA is the reference protein because it is the member with direct purified-enzyme and
  structural evidence and a gene review in this corpus; KT2440 MaiA, the nicotinate-pathway member,
  is assigned the activity by homology.
