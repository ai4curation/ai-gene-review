family_id: PANTHER:PTHR42663
family_name: HYDROLASE C777.06C-RELATED-RELATED
preferred_name: PhnP/PqqB metallo-beta-lactamase-fold family
summary: >-
  PTHR42663 is a metallo-beta-lactamase-fold family with two functionally
  different bacterial branches. Subfamily SF6 (HYDROLASE C777.06C-RELATED) holds
  E. coli PhnP, the Mn/Zn phosphoribosyl 1,2-cyclic phosphate phosphodiesterase of
  the carbon-phosphorus lyase pathway, the Paenibacillus anti-Pycsar proteins, the
  fission-yeast putative hydrolase SPCC777.06c and, with SF3 and other small
  subfamilies, many uncharacterized eukaryotic homologs. Subfamily SF7 (COENZYME
  PQQ SYNTHESIS PROTEIN B) holds PqqB of PQQ-producing Proteobacteria, which is not
  a hydrolase: M. extorquens AM1 PqqB is an Fe2+-dependent hydroxylase that
  inserts oxygen from O2 into a cross-linked intermediate of PQQ biosynthesis, a
  reaction new to the metallo-beta-lactamase fold. In the PANTHER 19 tree the three
  PqqB leaves sit inside the Eubacteria node PTN000285100, whose PAINT
  phosphodiesterase and phosphonate-catabolism annotations rest on PhnP alone.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF6 PhnP is a phosphodiesterase of phosphonate catabolism, while SF7 PqqB is an
  O2-dependent hydroxylase of PQQ biosynthesis; the two share the fold, not the
  reaction or the pathway.
