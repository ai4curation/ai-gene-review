  - id: UniProtKB:P16692
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The LUCA node covers 176 of the 183 reference leaves, including all three PqqB
    (SF7) leaves. The phosphodiesterase activity is well established for the PhnP
    seed, and the SF6 anti-Pycsar proteins are consistent with it, so the placement
    can stand for the hydrolase branches. The PqqB clade, however, has diverged: its
    characterized member is an O2-dependent hydroxylase, and no PqqB has been shown
    to hydrolyse a phosphodiester. Recommended fix: add a negation (IKR) at the PqqB
    clade below PTN000285100.
