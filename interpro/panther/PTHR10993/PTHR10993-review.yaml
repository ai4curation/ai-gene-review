family_id: PANTHER:PTHR10993
family_name: OCTANOYLTRANSFERASE
preferred_name: LipB/LIPT2 octanoyl-ACP:protein octanoyltransferases
summary: LipB-family enzymes transfer an octanoyl group from octanoyl-acyl carrier protein to the lysine
  of a lipoyl domain through an acyl-thioester intermediate on a conserved cysteine, the first step of
  endogenous protein lipoylation. In proteobacteria and actinobacteria (E. coli, M. tuberculosis, P. putida
  LipB) the acceptors are the E2 subunits and GcvH directly; in eukaryotes the mitochondrial orthologs
  (human LIPT2, Arabidopsis LIP2) octanoylate the glycine cleavage H protein, which then serves as the
  scaffold for sulfur insertion and relay. The reaction chemistry is the same; the acceptor and downstream
  topology differ by lineage.
functional_coherence: COHERENT
coherence_reason: Every characterized member (E. coli, M. tuberculosis and P. putida LipB in SF7; human
  and mouse LIPT2 in SF7; Arabidopsis mitochondrial LIP2 in SF15) catalyses RHEA:17665. Acceptor preference
  (E2 versus GcvH) and whether GcvH acts as a relay are lineage properties of the pathway, not differences
  in the molecular function. The small Bacteroidetes subfamily SF12 is uncharacterized and is not counted
  for or against coherence.
