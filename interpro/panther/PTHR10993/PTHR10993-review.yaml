term_assessments:
- assessed_term:
    id: GO:0033819
    label: lipoyl(octanoyl) transferase activity
  scope: SUBFAMILY_ONLY
  scope_reason: All characterized members in SF7 (bacterial LipB, animal LIPT2) and SF15 (plant mitochondrial
    LIP2) catalyse octanoyl transfer from octanoyl-ACP to a lipoyl-domain lysine. SF12 has no characterized
    member and a plant branch carries an unadjudicated IRD negation, so the term is not granted family-wide
    here. The term does not specify the acceptor and implies nothing about relay through GcvH.
  applicable_subfamilies:
  - id: PANTHER:PTHR10993:SF7
    label: LIPOYLTRANSFERASE 2, MITOCHONDRIAL-RELATED
  - id: PANTHER:PTHR10993:SF15
    label: OCTANOYLTRANSFERASE LIP2, MITOCHONDRIAL
  supported_by:
  - *id001
  - *id002
  - reference_id: file:genes/ECOLI/lipB/lipB-uniprot.txt
    supporting_text: Catalyzes the transfer of endogenously produced octanoic acid from octanoyl-acyl-carrier-protein
      onto the lipoyl domains of lipoate-dependent enzymes
  - reference_id: file:genes/human/LIPT2/LIPT2-uniprot.txt
    supporting_text: Catalyzes the transfer of endogenously produced octanoic acid from octanoyl-acyl-carrier-protein
      (octanoyl-ACP) onto the lipoyl domains of lipoate-dependent enzymes such as the protein H of the
      glycine cleavage system (GCSH)
notes: 'Used by modules/endogenous_protein_lipoylation.yaml for both the direct LipB route (E. coli, P.
  putida) and the human LIPT2 step of the GCSH relay. Because one subfamily (SF7) spans both topologies,
  family membership identifies the octanoyl-ACP transferase step but not the route; route assignment needs
  the organism context (presence of LipL/LIPT1-type amidotransferase, GcvH dependence). Gene reviews:
  ECOLI/lipB (reference), PSEPK/lipB, human/LIPT2 are COMPLETE.'
