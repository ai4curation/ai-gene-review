notes: >-
  This review audits the three human PTHR10543 members, BCO1, BCO2 and RPE65,
  and the PAINT rows that drive their current IBAs. The root GO:0010436 and
  GO:0016121 IBD rows are safe for BCO1 and BCO2 but already have IRDs at
  PTN002576077 to stop propagation into RPE65; previously reviewed bacterial and
  fungal stilbene-cleavage oxygenases show that additional pruning or
  subfamily-specific placement may be needed outside the animal clade.
