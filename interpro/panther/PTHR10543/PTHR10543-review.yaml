family_id: PANTHER:PTHR10543
family_name: BETA-CAROTENE DIOXYGENASE
preferred_name: Beta-Carotene Dioxygenase
summary: BETA-CAROTENE DIOXYGENASE (PANTHER:PTHR10543) is characterized in PANTHER PAINT across 8 ancestral PTN
  node(s) (PANTHER:PTN000057192, PANTHER:PTN000057318, PANTHER:PTN000057350, PANTHER:PTN000830314 (+4 more)) with
  11 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering retinal metabolic process
  (GO:0042574, BP), chloroplast (GO:0009507, CC), chloroplast stroma (GO:0009570, CC), beta-carotene 15,15'-dioxygenase
  activity (GO:0003834, MF) and 7 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10543 (BETA-CAROTENE DIOXYGENASE) span 8 distinct ancestral
  PTN nodes (PANTHER:PTN000057192, PANTHER:PTN000057318, PANTHER:PTN000057350, PANTHER:PTN000830314, PANTHER:PTN000830363
  (+3 more)) with different molecular function assignments across clades (beta-carotene 15,15'-dioxygenase activity
  (GO:0003834), 9-cis-epoxycarotenoid dioxygenase activity (GO:0045549), carotenoid dioxygenase activity (GO:0010436),
  retinol isomerase activity (GO:0050251) and 1 additional molecular function term(s)), indicating clade-level functional
  specialization across the family.
