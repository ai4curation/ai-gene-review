subfamilies:
- subfamily_id: PANTHER:PTHR10543:SF132
  label: BETA,BETA-CAROTENE 15,15'-DIOXYGENASE
  description: >-
    Vertebrate BCO1/BCMO1 central-cleavage enzymes that convert beta-carotene
    symmetrically to two molecules of retinal.
  representative_members:
  - id: UniProtKB:Q9HAY6
    gene_symbol: BCO1
    organism: Homo sapiens
    gene_review: genes/human/BCO1/BCO1-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR10543:SF122
  clade_node_id: PANTHER:PTN002576088
  label: CAROTENOID-CLEAVING DIOXYGENASE, MITOCHONDRIAL
  description: >-
    Vertebrate BCO2/BCDO2 mitochondrial carotenoid dioxygenases that eccentrically
    cleave beta-carotene and other carotenes or xanthophylls at 9,10 and 9',10'
    double bonds.
  representative_members:
  - id: UniProtKB:Q9BYV7
    gene_symbol: BCO2
    organism: Homo sapiens
    gene_review: genes/human/BCO2/BCO2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    BCO2 retained carotenoid cleavage but diverged from the BCO1 15,15' central
    cleavage to asymmetric 9,10 cleavage, so BCO1-specific retinal and
    15,15'-dioxygenase rows should not propagate here.
- subfamily_id: PANTHER:PTHR10543:SF57
  clade_node_id: PANTHER:PTN002576077
  label: RETINOID ISOMEROHYDROLASE
  description: >-
    RPE65 retinoid isomerohydrolases of the visual cycle. This branch retained the
    carotenoid-oxygenase fold but lost dioxygenase chemistry.
  representative_members:
  - id: UniProtKB:Q16518
    gene_symbol: RPE65
    organism: Homo sapiens
    gene_review: genes/human/RPE65/RPE65-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    RPE65 converts all-trans-retinyl esters to 11-cis-retinol rather than cleaving
    carotenes with O2.
