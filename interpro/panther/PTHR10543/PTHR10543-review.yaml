  assessment_reason: >-
    PTN000830314 is the Eumetazoa BCO/RPE65 ancestor and its 107 leaves include
    human BCO1, BCO2 and RPE65. The 15,15'-dioxygenase chemistry is correct for BCO1,
    but human BCO2 performs 9,10 eccentric cleavage of beta-carotene and mouse BCDO2
    is an asymmetric mitochondrial carotenoid oxygenase. PAINT should add an IRD at
    PTN002576088, the vertebrate BCO2 node that already carries the mitochondrion IBD,
    to stop the BCO1 activity before the BCO2 branch.
