family_id: PANTHER:PTHR10543
family_name: BETA-CAROTENE DIOXYGENASE
preferred_name: Carotenoid oxygenase and retinoid isomerohydrolase family
summary: >-
  PTHR10543 is a heterogeneous carotenoid-oxygenase fold family. The animal BCO1
  branch performs central beta-carotene 15,15' oxidative cleavage to all-trans-retinal,
  the animal BCO2 branch performs eccentric 9,10 and 9',10' cleavage of carotenes and
  xanthophylls in mitochondria, and the RPE65 branch is a non-oxygenase retinyl-ester
  isomerohydrolase of the visual cycle. More distant plant NCED/CCD members and bacterial
  or fungal stilbene-cleavage oxygenases use the same fold for additional apocarotenoid
  or non-carotenoid reactions, so only broad carotenoid-oxygenase terms should sit near
  the root.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  BCO1, BCO2 and RPE65 have distinct chemistries even inside the animal clade: central
  15,15' carotene cleavage, eccentric 9,10 carotenoid cleavage, and retinyl-ester
  isomerohydrolysis, respectively. The root also spans plant NCED/CCD and bacterial or
  fungal stilbene-cleavage clades.
