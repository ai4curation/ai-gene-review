notes: >-
  Written for the module bacterial_4_hydroxybutyrate_oxidation, which grounds its two optional
  Pseudomonas succinate-semialdehyde oxidation candidates in SF2 and SF1. The reference protein was
  reviewed in the same change, because no member of this family had a gene review before. Only two
  node-level PAINT annotations exist for the family and both sit at PTN000193476; the molecular-function
  one is sound and the process one over-propagates, which is the only substantive disagreement recorded
  here. No residue sites are asserted: the aldehyde-dehydrogenase catalytic cysteine is covered by the
  PROSITE ALDEHYDE_DEHYDR_CYS signature on the members, and no member-specific residue argument is used
  by this review or by the module. The member inventory is the reviewed-entry slice from InterPro, so the
  absence of the P. putida accessions from it reflects that slice rather than a classification
  disagreement; both carry the family and subfamily in their own UniProt records.
