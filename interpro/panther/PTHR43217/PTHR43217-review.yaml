    The single seed is the experimentally characterized E. coli enzyme, whose NAD-preferring
    succinate-semialdehyde oxidation was purified, assayed and tied to this gene. A one-member seed list
    is not weak support here: the family is substrate-coherent, the same reaction is the basis of every
    member's curated name, and nothing in the family contradicts inheritance of the activity. The
    assertion names the NAD-linked child term, which understates the cofactor-general capacity of the
    seed itself, but the recipients are not thereby given a function they lack.
