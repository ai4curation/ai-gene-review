- node_id: PANTHER:PTN000193476
  asserted_term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P9WNX9
  assessment: WRONG_NODE
  assessment_reason: >-
    This process assertion sits at the same ancestral node as the molecular function, which is where
    the placement goes wrong. What the node can license is inherited chemistry, and the reaction it
    names lies outside the TCA cycle: oxidising succinate semialdehyde delivers succinate into the
    cycle's intermediate pool from a GABA-shunt step. Pathway membership here is a property of the host
    organism's cycle rather than of the enzyme, so it cannot be a function that arose at an ancestral
    node and descended. The seed, mycobacterial GabD1, is annotated intelligibly for its own lineage,
    where the GABA shunt is read as a bypass of the oxidative decarboxylation segment; but that reading
    depends on the surrounding cycle being incomplete, which is exactly what does not descend. Recipients
    with a complete oxidative cycle, such as E. coli Sad, therefore inherit a pathway membership they do
    not have, and the reviewed E. coli gene removes the resulting IBA. Were the process genuinely
    inherited, it would need a node placed where the bypass topology itself is conserved.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43217/PTHR43217-paint.tsv
    supporting_text: "PTHR43217\tPTN000193476\tGO:0006099\tP\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/sad/sad-ai-review.yaml
    supporting_text: Sad supplies succinate to the TCA cycle but catalyses no step of that cycle.
