family_id: PANTHER:PTHR43217
family_name: SUCCINATE SEMIALDEHYDE DEHYDROGENASE [NAD(P)+] SAD
preferred_name: Sad/GabD1-type succinate-semialdehyde dehydrogenase family
summary: >-
  Bacterial aldehyde dehydrogenases that oxidize succinate semialdehyde to succinate, integrated by
  InterPro as the GABD/Sad-like entry IPR047110. Every curated member is named a succinate-semialdehyde
  dehydrogenase: Escherichia coli Sad (YneI), the mycobacterial GabD1 enzymes, the Deinococcus and
  Synechocystis NADP-linked enzymes, and the two Pseudomonas putida KT2440 Sad candidates. The family is
  distinct from the ALDH5A1/GabD family PTHR43353, which holds the eukaryotic mitochondrial SSADHs and the
  classical enterobacterial GabD of the GABA shunt. Reaction direction and substrate are conserved; the
  nicotinamide acceptor is not, with E. coli Sad preferring NAD and reducing NADP at about 15% of that
  rate while the mycobacterial and Deinococcus members are named for NADP.
functional_coherence: COHERENT
coherence_reason: >-
  The family has only two subfamilies and all reviewed members carry the same substrate and reaction. The
  variation across the family is which nicotinamide acceptor is preferred, which is a cofactor difference
  within one reaction rather than a change of chemistry.
