- assessed_term:
    id: GO:0009013
    label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The cofactor-general term that modules selecting this family should use. It is safe for both
    subfamilies, which between them cover every curated member: direct assays establish it for E. coli
    Sad in SF1, and the InterPro GABD/Sad-like integration plus the uniform curated naming of the
    remaining members support it for the rest. It is stated at subfamily resolution rather than
    family-wide because one member of SF1, Paenarthrobacter nicotinovorans Q8GAK7, is curated only as a
    generic aldehyde dehydrogenase, and because the family's 9604 unreviewed members have no
    member-level evidence; a member not assigned to SF1 or SF2 is outside this judgement.
  applicable_subfamilies:
