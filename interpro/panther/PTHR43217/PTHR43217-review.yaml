    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The NAD-linked child term is established by assay only for the SF1 reference enzyme, where NAD is
    the preferred acceptor, and it is the term PAINT propagates from PTN000193476. The subfamily split
    does not track the acceptor: SF2 is named for NADP, yet its reviewed member Sad-I (Q88K05) carries
    the NAD-dependent SSADH FunFam assignment and keeps this term as a qualified capacity inference, so
    the term is in scope for both subfamilies rather than for SF1 alone. It is not the family's single
    descriptor: for members curated as NADP-linked, with no measured preference, the cofactor-general
    term above is the safer default, and a member needs its own NAD evidence before this child term is
    used as its core function.
