term_assessments:
- assessed_term:
    id: GO:0046982
    label: protein heterodimerization activity
  scope: UNRESOLVED
  scope_reason: PP2A structures directly establish a scaffold-catalytic-subunit heterodimer, and both
    alpha and beta A-subunit branches have that association role. The wider family includes PP4 regulatory
    proteins and distinct assemblies. Protein association is supported beyond the wheat exemplar, but
    a complete set of branches satisfying the particular heterodimerization relation has not been delimited.
  supported_by:
  - reference_id: PMID:17174897
    supporting_text: "The PP2A holoenzyme consists of a heterodimeric core \nenzyme"
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A.
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT   DOMAIN          276..351
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT                   /note="Phosphatase PP2A regulatory subunit A/Splicing
  - reference_id: file:genes/human/PPP2R1A/PPP2R1A-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: The PR65 subunit of protein phosphatase 2A serves as a

      CC       scaffolding molecule to coordinate the assembly of the catalytic

      CC       subunit and a variable regulatory B subunit'
- assessed_term:
    id: GO:0043025
    label: neuronal cell body
  scope: UNRESOLVED
  scope_reason: Neuronal cell-body localization can apply to animal phosphatase scaffolds expressed in
    neurons, but wheat has no neuronal cell body. The conserved PP2A assembly interface does not establish
    this tissue-specific location. The animal branches with localization evidence need separate delimitation
    from the plant and fungal members.
  supported_by:
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A.
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT   DOMAIN          276..351
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT                   /note="Phosphatase PP2A regulatory subunit A/Splicing
- assessed_term:
    id: GO:0007059
    label: chromosome segregation
  scope: UNRESOLVED
  scope_reason: PP2A and PP4 complexes can regulate chromosome segregation through different substrates
    and targeting partners. The holoenzyme structures establish assembly, not chromosome-segregation involvement
    of every scaffold in every tissue. A partner- and branch-resolved physiological assignment is required.
  supported_by:
  - reference_id: PMID:17174897
    supporting_text: "The PP2A holoenzyme consists of a heterodimeric core \nenzyme"
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A.
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT   DOMAIN          276..351
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT                   /note="Phosphatase PP2A regulatory subunit A/Splicing
- assessed_term:
    id: GO:0043005
    label: neuron projection
  scope: UNRESOLVED
  scope_reason: Neuron projections are animal cellular structures and cannot be transferred to the wheat
    member. A phosphatase scaffold may be recruited to them by neuronal partners, but that recruitment
    is separate from conserved holoenzyme assembly. No exhaustive set of projection-localized family branches
    is established.
  supported_by:
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A.
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT   DOMAIN          276..351
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: FT                   /note="Phosphatase PP2A regulatory subunit A/Splicing
- assessed_term:
    id: GO:0000775
    label: chromosome, centromeric region
  scope: UNRESOLVED
  scope_reason: Centromeric localization requires the appropriate chromosome-targeting complex; it is
    not entailed by being the PP2A A scaffold. The available structural evidence identifies subunit interfaces
    without establishing centromere residence for the wheat protein or all PP4-related members. Specific
    localization and partner evidence are needed.
  supported_by:
  - reference_id: PMID:17174897
    supporting_text: "The PP2A holoenzyme consists of a heterodimeric core \nenzyme"
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
    supporting_text: DR   InterPro; IPR051023; PP2A_Regulatory_Subunit_A.
