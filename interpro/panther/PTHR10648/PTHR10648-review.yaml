    supporting_text: FT                   /note="Phosphatase PP2A regulatory subunit A/Splicing
- assessed_term:
    id: GO:1990405
    label: protein antigen binding
  scope: UNRESOLVED
  scope_reason: SV40 small t antigen directly binds PP2A A subunit, but that interaction does not by itself
    establish immune antigen-recognition activity. The substrate name antigen must not be used as the
    functional definition of protein antigen binding. No family-wide antigen-recognition mechanism is
    supported, while the ordinary viral-protein/scaffold interaction remains valid.
  supported_by:
  - reference_id: PMID:17608567
    supporting_text: 'ST directly interacts with the PP2A

      scaffolding A subunit'
  - reference_id: file:genes/WHEAT/F6LAX4/F6LAX4-uniprot.txt
