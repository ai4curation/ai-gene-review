family_id: PANTHER:PTHR10648
family_name: SERINE/THREONINE-PROTEIN PHOSPHATASE PP2A 65 KDA REGULATORY SUBUNIT
preferred_name: PP2A/PP4 regulatory scaffold proteins
summary: HEAT-repeat regulatory scaffolds organize phosphatase complexes. PP2A A subunits assemble catalytic
  and regulatory partners; the retrieved family also includes PP4 regulatory proteins. Scaffold binding
  is distinct from catalytic dephosphorylation.
functional_coherence: HETEROGENEOUS
coherence_reason: PP2A holoenzyme assembly supports heteromeric protein association for the wheat target.
  Neuronal locations cannot be transferred into wheat, although they may describe animal family members.
  Centromeric and chromosome-segregation roles require the relevant complex and organism; antigen binding
  is not implied by a viral protein binding a phosphatase scaffold.
subfamilies:
