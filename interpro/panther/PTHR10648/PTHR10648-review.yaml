  label: PROTEIN PHOSPHATASE 2 (FORMERLY 2A), REGULATORY SUBUNIT A, BETA ISOFORM-RELATED
  description: Recorded placement of F6LAX4. PP2A holoenzyme assembly supports heteromeric protein association
    for the wheat target. Neuronal locations cannot be transferred into wheat, although they may describe
    animal family members. Centromeric and chromosome-segregation roles require the relevant complex and
    organism; antigen binding is not implied by a viral protein binding a phosphatase scaffold.
  representative_members:
