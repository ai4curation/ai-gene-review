  name:
    name: Mitochondrial antiviral-signaling domain-containing protein
    short: MAVS
  description:
  - text: This family of proteins serves as an adapter in the innate immune defense
      against viruses. It operates downstream of sensors that detect viral replication
      by-products, coordinating the activation of key transcription factors and the
      induction of antiviral cytokines. The proteins in this family contain domains
      essential for interaction with viral RNA sensors and for recruiting and activating
      IRF3, a transcription factor involved in interferon signaling. They play a role
      in both peroxisomal and mitochondrial signaling pathways, which lead to an antiviral
      state within the cell. The peroxisomal proteins quickly induce defense factors
      independently of interferons, while the mitochondrial counterparts initiate
      a delayed, interferon-dependent response to reinforce and sustain antiviral
      defenses. Additionally, these proteins are implicated in preventing apoptosis
      and activating the NLRP3 inflammasome, further contributing to the immune response.
