  name:
    name: Hedgehog Signaling Receptor Patched
    short: Hedgehog_Signaling_Patched
  description:
  - text: The Patched family proteins serve as receptors for hedgehog signaling molecules
      such as sonic hedgehog (SHH), indian hedgehog (IHH), and desert hedgehog (DHH).
      They play a crucial role in transducing signals in association with the smoothened
      protein (SMO), influencing cellular growth, development, and patterning. Members
      of the Patched family are involved in various developmental processes, including
      segmentation polarity and epidermal development. Some homologs have been implicated
      in tumor suppression, with their inactivation being a key step in tumorigenesis.
      Additionally, certain family members are involved in cytokinesis of proliferating
      germ cells, osmoregulation during embryonic development, and larval molting.
