family_id: PANTHER:PTHR24095
family_name: ACETYL-COENZYME A SYNTHETASE
preferred_name: AMP-forming acetyl-CoA synthetase (Acs/ACS1/ACS2/ACSS) family
summary: >-
  ANL-superfamily acetyl-CoA synthetases ligate acetate and CoA via an acetyl-AMP intermediate. S.
  cerevisiae ACS1 (gluconeogenic, derepressed) and ACS2 (glycolytic, essential on glucose) supply
  acetyl-CoA for lipid synthesis and histone acetylation. The family also contains bacterial Acs
  and human ACSS1 (mitochondrial) and ACSS2 (cytosolic/nuclear).
functional_coherence: COHERENT
coherence_reason: All subfamilies are acetyl-CoA synthetases.
