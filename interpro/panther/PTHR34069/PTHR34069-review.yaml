family_id: PANTHER:PTHR34069
family_name: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] SYNTHASE 3
preferred_name: Beta-ketoacyl-ACP synthase III (FabH) family
summary: >-
  FabH-type condensing enzymes start type II fatty acid synthesis by condensing an acyl-CoA primer
  with malonyl-ACP. P. putida has a canonical acetyl-CoA-primed FabH (PP_4379) and a medium-chain-selective
  FabH2 (PP_4545). Pseudomonas aeruginosa PqsC, a FabH-like enzyme of quinolone signal synthesis,
  sits in the same subfamily. Archaeal acyl-CoA:acyl-CoA alkyltransferases form SF3.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  KAS III activity holds for most of SF2, but SF2 also includes PqsC (2-heptyl-4-quinolone synthesis),
  and SF3 enzymes condense acyl-CoAs.
