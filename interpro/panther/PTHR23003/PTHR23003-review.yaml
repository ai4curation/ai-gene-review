family_id: PANTHER:PTHR23003
family_name: RNA RECOGNITION MOTIF  RRM  DOMAIN CONTAINING PROTEIN
preferred_name: SR-type and RRM paralogs with lineage-specific mRNA roles
summary: >-
  PTHR23003 contains eukaryotic RRM proteins spanning SR-type mRNA-binding
  proteins, hnRNP-like proteins, Sbp1/Rnp1/Rrt5 paralogs, MYEF2 relatives, and
  several splicing factors. PAINT places a broad nuclear mRNA surveillance IBD
  for yeast Gbp2/Hrb1 and Ustilago RRM75 at the Opisthokonta PTN000543777 node,
  but S. cerevisiae Sbp1 is in a neighbouring Saccharomycetes RRM paralog clade
  rather than the Gbp2/Hrb1 branch. The budding-yeast nuclear mRNA surveillance
  assertion should therefore move from PTN000543777 to the seed-bearing
  PTN001124014 clade while the Ustilago seed is reviewed separately.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is held together by one or more RRM domains, but its fungal
  subfamilies are functionally split among shuttling nuclear surveillance
  factors, cytoplasmic translational regulators, rDNA transcription regulators,
  and other RNA-processing proteins. Broad RNA-binding and nuclear/cytoplasmic
  placements can be valid across much of the family, but exact process terms
  such as nuclear mRNA surveillance are paralog-specific.
