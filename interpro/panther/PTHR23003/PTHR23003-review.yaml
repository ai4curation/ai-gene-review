node_assessments:
- node_id: PANTHER:PTN000543777
  asserted_term:
    id: GO:0071028
    label: nuclear mRNA surveillance
  evidence: IBD
  paint_snapshot: '20260115'
  seeds:
  - id: SGD:S000000517
    label: GBP2
  - id: SGD:S000004949
    label: HRB1
  - id: UniProtKB:A0A0D1DZT6
    label: RRM75
  node_taxon:
    id: NCBITaxon:33154
    label: Opisthokonta
  assessment: WRONG_NODE
  assessment_reason: >-
    The Opisthokonta placement is too broad for the seed topology. The two
    budding-yeast seeds GBP2 and HRB1 sit with MRD1 in the 7-leaf
    PTN001124014 clade, while S. cerevisiae Sbp1 is in the neighbouring
    Sbp1/Rnp1/Rrt5 paralog branch PTN004592451 under the unseeded
    Saccharomycetes node PTN009058392. Moving the IBD from PTN000543777 to
    PTN001124014 captures the directly seeded budding-yeast surveillance branch
    and stops the term from flowing to the Sbp1 branch and to the unrelated
    64-leaf animal MYEF2/hnRNP M side. The Ustilago RRM75 seed lies outside
    PTN001124014 and needs a separate PAINT placement once its own tree context
    is adjudicated.
  affected_subfamilies:
  - id: PANTHER:PTHR23003:SF56
    label: RIBONUCLEOPROTEIN 1-RELATED
  - id: PANTHER:PTHR23003:SF54
    label: REGULATOR OF RDNA TRANSCRIPTION PROTEIN 5
  proposed_action:
    paint_action: MOVE_IBD
    target_node_id: PANTHER:PTN001124014
  supported_by:
