family_id: PANTHER:PTHR10071
family_name: TRANSCRIPTION FACTOR GATA FAMILY MEMBER
preferred_name: GATA zinc-finger transcription factor family
summary: >-
  GATA zinc-finger transcription factors bind GATA cis-regulatory motifs in RNA
  polymerase II target genes and regulate transcription in the nucleus. The
  family spans fungal nutrient-responsive GATA factors, invertebrate GATA
  regulators and the vertebrate GATA1 through GATA6 paralogs. PAINT captures
  the conserved transcription-factor activity at the root, a metazoan
  cell-fate-commitment role at an Eumetazoa node, and narrower vertebrate
  paralog roles on the GATA5, GATA6, GATA3 and GATA2 subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Sequence-specific Pol II transcription-factor activity and nuclear location
  are conserved across the local GATA inventory, while developmental outputs
  diverge among vertebrate paralogs: GATA5 in cardiac development, GATA6 in
  epithelial differentiation, GATA3 in immune development, epithelial-cell
  differentiation regulation and embryonic-organ development, and GATA2 in
  angiogenesis and miRNA transcription.
notes: >-
  This focused human-family pass assessed the six PANTHER subfamilies with human
  reviewed Swiss-Prot representatives: SF190/GATA1, SF149/GATA2, SF106/GATA3,
  SF154/GATA4, SF289/GATA5 and SF23/GATA6. PTHR10071 metadata records 17
  subfamilies overall; the non-human local branches, including SF335
  SRE1-related fungal factors and invertebrate SF155/SF233/SF322/SF328
  branches, were not individually assessed beyond the root PAINT rows.
