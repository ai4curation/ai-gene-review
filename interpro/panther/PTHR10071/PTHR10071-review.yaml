  additional GO term(s)) are conserved across the primary ancestral clade, with lineage-specific variation reflected
  by IBD assertions distributed across 6 PTN nodes (PANTHER:PTN000800998, PANTHER:PTN001600628, PANTHER:PTN002560167,
  PANTHER:PTN002560190 (+2 more)).
