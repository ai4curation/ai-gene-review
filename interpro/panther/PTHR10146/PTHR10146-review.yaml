residue_sites:
- site_id: schiff_base_lysine
  label: PLP Schiff-base lysine
  description: >-
    The lysine at the C-terminal end of the first barrel strand that forms the internal aldimine
    with PLP. Human Lys47 corresponds to yeast YBL036C Lys49 and E. coli YggS Lys36 by
    superposition of the human AlphaFold model on PLP-bound crystal structures 1CT5, 1B54 and 1W8G.
    In E. coli the K36A protein still binds PLP through neighbouring lysines, so the residue
    contributes to PLP binding but is not strictly required for it.
