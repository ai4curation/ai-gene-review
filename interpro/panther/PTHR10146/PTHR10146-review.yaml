family_id: PANTHER:PTHR10146
family_name: PROLINE SYNTHETASE CO-TRANSCRIBED BACTERIAL HOMOLOG PROTEIN
preferred_name: Pyridoxal 5'-phosphate homeostasis protein family (YggS/PLPHP/COG0325)
summary: >-
  Single-domain fold-type III barrel proteins that bind pyridoxal 5'-phosphate (PLP) as a Schiff base
  on a conserved lysine and have no established catalytic activity. Members occur in bacteria,
  archaea and eukaryotes, usually as one copy per genome; angiosperms have two. Loss of the protein
  disturbs the vitamin B6 vitamer pools in E. coli, Salmonella, yeast, Arabidopsis, zebrafish and
  human cells, and the human, yeast and Bacillus proteins rescue the E. coli yggS mutant. The human
  member PLPBP is mutated in vitamin B6-dependent early-onset epilepsy. The biochemical mechanism of
  the homeostasis function is unknown.
functional_coherence: COHERENT
coherence_reason: >-
  One orthologous group with one shared property (PLP binding) and one shared phenotype (disturbed
  PLP homeostasis on loss), supported by cross-kingdom complementation. No member has a
  demonstrated divergent function.
