  asserted_term:
    id: GO:0004056
    label: argininosuccinate lyase activity
  evidence: IKR
  negated: true
  node_taxon:
    id: NCBITaxon:9031
    label: Gallus gallus
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The chicken node of the lens delta-crystallin lineage, which was recruited as a structural lens
    protein (Swiss-Prot names P02521 "Delta-1 crystallin"). The PAINT curator's key-residue (IKR) call
    records loss of the lyase activity there; no member gene review contradicts it. The loss is consistent
    with direct assays of the duck paralogs: duck delta-1 crystallin (P24057) is enzymatically inactive
    while duck delta-2 crystallin (P24058) retains lyase activity (PMID:10091655, PMID:15966727). Turkey
    delta-1 crystallin (Q7SIE0) has not been assayed in cached literature.
