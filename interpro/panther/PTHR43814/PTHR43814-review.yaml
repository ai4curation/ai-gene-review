family_id: PANTHER:PTHR43814
family_name: ARGININOSUCCINATE LYASE
preferred_name: Argininosuccinate lyase (ArgH/ASL) and delta-crystallins
summary: >-
  Fumarase/lyase-superfamily argininosuccinate lyases that cleave argininosuccinate to L-arginine and fumarate,
  the last step of L-arginine biosynthesis (and of the urea cycle in ureotelic animals). The family spans
  bacterial and cyanobacterial ArgH (including ArgH-ArgA fusions in Vibrio and Moritella), fungal ARG4
  and the two S. pombe paralogs arg7 and arg41, plant chloroplastic ASL and animal ASL. Avian lens
  delta-crystallins belong here as recruited paralogs; PAINT records loss of lyase activity for chicken
  delta-1 crystallin. All PAINT IBD assertions sit at one root node (PTN000154674).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Catalysis and arginine biosynthesis are shared by all enzymatic members, but the avian delta-1 lens
  crystallins are structural proteins, and chicken delta-1 crystallin carries a PAINT IKR loss of the
  lyase activity. All Swiss-Prot members, crystallins included, fall in SF1, so no subfamily separates
  them.
