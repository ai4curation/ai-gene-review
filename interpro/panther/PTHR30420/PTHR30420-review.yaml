    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence: IBD
  paint_snapshot: '20240912'
  seeds:
  - id: UniProtKB:P76216
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is E. coli AstB, a genuine dihydrolase, but the node also spans SF1, so the activity
    propagates by IBA to the arginine N-succinyltransferases (E. coli AstA P0AE37, P. aeruginosa AruF
    P80357 and AruG P80358 all carry the IBA). These are acyl-CoA N-acyltransferases that perform the
    preceding step; E. coli encodes the dihydrolase separately as astB. The IBD should sit on the SF2
    clade. The affected gene reviews remove the row and record the defect.
