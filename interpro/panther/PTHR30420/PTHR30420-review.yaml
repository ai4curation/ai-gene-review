family_id: PANTHER:PTHR30420
family_name: N-SUCCINYLARGININE DIHYDROLASE
preferred_name: >-
  AST pathway arginine N-succinyltransferases (AstA/AruFG) and N-succinylarginine dihydrolases (AstB)
summary: >-
  PANTHER groups the first two enzymes of the bacterial arginine succinyltransferase (AST) pathway in
  one family. SF1 holds the arginine N-succinyltransferases (single-chain E. coli AstA; the alpha and
  beta chains AruF/AruG of the Pseudomonas heterotetramer, AstA-II/AstA-I in P. putida), which transfer
  succinyl from succinyl-CoA to L-arginine. SF2 holds the N-succinylarginine dihydrolases (AstB/AruB),
  which hydrolyze N2-succinyl-L-arginine to N2-succinyl-L-ornithine, ammonium and CO2. The two subfamilies
  have different catalytic domains: SF1 members carry the acyl-CoA N-acyltransferase AstA domain (Pfam
  PF04958) and SF2 members the AstB domain (Pfam PF04996), whose structure places it in the amidinotransferase
  superfamily. What the family shares is the pathway, not the reaction.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The two subfamilies catalyze consecutive but chemically unrelated reactions (acyl transfer versus amidine
  hydrolysis) with different domains. Only the process, L-arginine catabolism via the AST pathway, holds
  family-wide. The PAINT dihydrolase IBD at the node shared by both subfamilies therefore propagates to
  the transferases, which is wrong.
