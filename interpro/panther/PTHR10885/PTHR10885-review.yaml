    supporting_text: >-
      Phylogenetic (IBA) assignment that IDI1 is active in the peroxisome. This is
      concordant with direct experimental localization of human IDI1 to the peroxisome
      (PMID:17180682, PMID:17202134) and the C-terminal PTS1-type targeting signal, so it is
      retained as a genuine location.
