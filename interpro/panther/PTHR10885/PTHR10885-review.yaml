family_id: PANTHER:PTHR10885
family_name: ISOPENTENYL-DIPHOSPHATE DELTA-ISOMERASE
preferred_name: Type 1 isopentenyl-diphosphate delta-isomerase (IDI) family
summary: >-
  Type 1 IPP isomerases interconvert isopentenyl diphosphate and dimethylallyl diphosphate, the two
  C5 units of isoprenoid synthesis. The family contains S. cerevisiae IDI1, S. pombe idi1, human
  IDI1 and IDI2, and plant IPI isozymes.
functional_coherence: COHERENT
coherence_reason: All subfamilies are IPP/DMAPP isomerases.
