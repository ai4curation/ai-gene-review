- node_id: PANTHER:PTN000853999
  asserted_term:
    id: GO:0009240
    label: isopentenyl diphosphate biosynthetic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: AGI_LocusCode:AT5G16440
  assessment: UNRESOLVED
  assessment_reason: >-
    IPP biosynthetic process at the family-wide node. In mevalonate-pathway organisms IDI converts
    IPP to DMAPP rather than making IPP, and the S. cerevisiae and S. pombe reviews mark the term
    over-annotated; the C. albicans and A. fumigatus reviews reach the same conclusion and the
    human reviews keep it as non-core. In MEP-pathway organisms the reverse reaction can make IPP,
    so the term is lineage-dependent.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10885/PTHR10885-paint.tsv
    supporting_text: "PTHR10885\tPTN000853999\tGO:0009240\tP\tIBD\tfalse"
  - reference_id: file:genes/yeast/IDI1/IDI1-ai-review.yaml
    supporting_text: In plastids the MEP pathway makes both IPP and DMAPP and IDI can run DMAPP -> IPP, so
      IPP biosynthesis is meaningful there. In S. cerevisiae IPP is made exclusively by Erg19 (mevalonate
      pathway) and Idi1 converts it to DMAPP, so the yeast enzyme consumes rather than produces IPP.
