  name:
    name: CLIP domain-containing serine protease
    short: CLIP_Serine_Protease
  description:
  - text: The CLIP domain-containing serine protease family is involved in innate
      immune responses across various organisms. Members of this family play key roles
      in pathogen recognition and activation of immune cascades, particularly in response
      to infections by parasites, bacteria, and fungi. They are characterized by a
      clip domain that forms a compact structure through conserved disulfide bonds.
      These proteases are involved in processes such as the melanization cascade,
      which results in the clearance of pathogens, and the activation of the Toll
      pathway, crucial for defining cell identities during embryonic development.
      They also contribute to the activation of prophenoloxidase, leading to melanin
      formation, and are implicated in the digestion process and sperm activation
      during mating.
