family_id: PANTHER:PTHR24073
family_name: DRAB5-RELATED
preferred_name: Rab GTPases (Rab5-related)
summary: >-
  PTHR24073 contains many Rab small GTPases, each regulating membrane trafficking at a particular compartment.
  RAB17 acts in epithelial recycling endosomes and RAB29 (RAB7L1) at the trans-Golgi network.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  GTPase activity and membrane-trafficking regulation are shared; each Rab subfamily has its own compartment,
  so location terms do not transfer across the family.
