family_id: PANTHER:PTHR13619
family_name: PHOSPHATIDATE CYTIDYLYLTRANSFERASE, MITOCHONDRIAL
preferred_name: Tam41/TAMM41 mitochondrial CDP-diacylglycerol synthase family
summary: >-
  Tam41 (TAMM41 in animals) is the mitochondrial CDP-diacylglycerol (CDP-DAG) synthase. It
  converts phosphatidic acid and CTP to CDP-DAG on the matrix side of the mitochondrial inner
  membrane. This supplies the CDP-DAG used by Pgs1 and Crd1 for phosphatidylglycerol and
  cardiolipin synthesis. Tam41 is a nucleotidyltransferase-fold enzyme and is not related to
  the ER CDP-DAG synthase Cds1 (CDS1/CDS2), which belongs to a different family. Eukaryotic
  orthologs are single-copy, and the reviewed members (fungi, animals, Dictyostelium, plants)
  all sit in subfamily SF0.
functional_coherence: COHERENT
coherence_reason: >-
  All 12 Swiss-Prot members in the PANTHER member inventory (yeasts, animals, Dictyostelium) are
  in SF0, and they are named and annotated as the mitochondrial phosphatidate
  cytidylyltransferase. The single PAINT node (PTN000341245, Eukaryota) puts the activity,
  CDP-DAG synthesis, cardiolipin synthesis and mitochondrion on all descendants. Experimental
  seeds come from yeast, fission yeast, rat and Arabidopsis. No characterized member with a
  different activity is known. SF1 has no Swiss-Prot member, and its composition was not
  examined.
