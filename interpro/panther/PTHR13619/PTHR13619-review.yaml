  assessment: SOUND
  assessment_reason: >-
    The seeds cover opisthokonts and plants, which supports placing the node at the eukaryotic
    root of the family. Every Swiss-Prot descendant receiving the IBA is an SF0 Tam41 ortholog.
    Yeast Tam41 was shown to catalyze CDP-DAG formation as a purified protein. The same node
    also carries GO:0016024 CDP-diacylglycerol biosynthetic process, GO:0032049 cardiolipin
    biosynthetic process and GO:0005739 mitochondrion. These follow from the activity and are
    equally sound. The S. cerevisiae TAM41 review accepts all four IBAs.
  supported_by:
  - reference_id: PMID:23623749
    supporting_text: Taken together, we conclude that Tam41 directly catalyzes the conversion of PA to CDP-DAG
      in the presence of CTP.
  - reference_id: file:interpro/panther/PTHR13619/PTHR13619-paint.tsv
    supporting_text: AGI_LocusCode:AT3G47630|PomBase:SPBC1A4.06c|RGD:1586150|SGD:S000003278
term_assessments:
- assessed_term:
    id: GO:0004605
    label: phosphatidate cytidylyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the conserved activity of the family. It was shown biochemically for yeast Tam41
    and is inherited from PTN000341245 by all eukaryotic members. The term does not
    distinguish Tam41 from the unrelated ER enzyme Cds1. The module separates the two by
    family (Tam41 = PTHR13619) and by location, not by MF term, and this is correct.
  supported_by:
  - reference_id: PMID:23623749
    supporting_text: Taken together, we conclude that Tam41 directly catalyzes the conversion of PA to CDP-DAG
      in the presence of CTP.
  - reference_id: PMID:23623749
    supporting_text: Both Tam41 and Cds1 are highly conserved proteins, yet their origins seem to be different.
  - reference_id: file:genes/yeast/TAM41/TAM41-ai-review.yaml
    supporting_text: 'IDA (Tamura et al. 2013): purified Tam41 converted NBD-PA to CDP-DAG in vitro in a CTP-'
- assessed_term:
    id: GO:0016024
    label: CDP-diacylglycerol biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the process that the activity directly carries out. Safe wherever GO:0004605 is.
  supported_by:
  - reference_id: PMID:23623749
    supporting_text: Tam41 is a CDP-diacylglycerol synthase required for cardiolipin biosynthesis in mitochondria.
- assessed_term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Tam41 makes the mitochondrial CDP-DAG pool that Pgs1 and Crd1 consume. It performs the
    first step of the mitochondrial cardiolipin branch, so this is participation and not only
    upstream supply. The PAINT IBD has a single yeast seed. Cardiolipin synthesis in
    mitochondria is pan-eukaryotic, so the eukaryote-wide placement is reasonable.
  supported_by:
  - reference_id: PMID:23623749
    supporting_text: Identificaiton of Tam41 as a mitochondrial CDP-DAG synthase means that four CL synthetic
      enzymes, Tam41, Pgs1, Gep4 and Crd1, are in operation in yeast mitochondria.
- assessed_term:
    id: GO:0005743
    label: mitochondrial inner membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    The module asserts the mitochondrial inner membrane, and PAINT asserts only the
    mitochondrion (GO:0005739). The yeast review records both the inner membrane and the
    matrix side (GO:0005759). Tam41 is a peripheral protein on the matrix side of the inner
    membrane. This is safe as a family-wide location for the eukaryotic orthologs.
  supported_by:
  - reference_id: file:modules/cdp_dag_phospholipid_synthesis.yaml
    supporting_text: 'statement: Tam41 directly catalyzes the formation of CDP-DAG from PA in the mitochondrial
      inner membrane and is required for cardiolipin synthesis.'
