notes: >-
  Module: modules/dntp_de_novo_synthesis.yaml selects PANTHER:PTHR11573:SF6 for the large
  subunit of the RNR complex, labelled "class I RNR large subunits". SF6 is in fact the class
  Ia group (eukaryotic R1 plus proteobacterial NrdA). Class Ib NrdE is SF30. This is harmless
  for the yeast module but slightly mislabelled. Two PANTHER placements are inconsistent across
  fungi: S. cerevisiae RNR3 is in SF6, whereas the Candida albicans RNR3 ortholog is in SF28,
  and one poplar R1 is in SF24. All three still inherit from PTN000171388. In the PAINT UniProt
  GAF, human RRM1 and E. coli NrdE also do not receive the GO:0004748 IBA, while receiving the
  other node terms. These omissions are not NOT annotations. .cache/panther/IBD.gaf has no
  IRD/IKR rows for this node. Seed organisms were taken from the PAINT/PANTHER classification
  files. The Dictyostelium and Pseudomonas seed gene symbols were not resolved.
