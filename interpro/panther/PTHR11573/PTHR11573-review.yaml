family_id: PANTHER:PTHR11573
family_name: RIBONUCLEOSIDE-DIPHOSPHATE REDUCTASE LARGE CHAIN
preferred_name: Class I ribonucleotide reductase large (alpha, R1) subunit family
summary: >-
  Class I ribonucleotide reductases (RNRs) reduce ribonucleoside diphosphates (ADP, GDP, CDP,
  UDP) to the corresponding 2'-deoxyribonucleoside diphosphates. This is the committed step of
  de novo deoxyribonucleotide synthesis. The enzyme is an alpha2beta2 complex. The large
  (alpha, R1) subunit in this family binds substrate and the allosteric specificity effectors
  and carries the catalytic cysteines; most members also have an N-terminal ATP-cone activity
  site. The small (beta, R2) subunit (PTHR23409) generates and stores the tyrosyl radical that
  starts each turnover. The family spans eukaryotic R1 (yeast Rnr1 and Rnr3, fission yeast
  Cdc22, human RRM1), bacterial class Ia NrdA (E. coli) and class Ib NrdE (E. coli,
  B. subtilis, M. tuberculosis). In S. cerevisiae a DNA-damage-inducible paralog, Rnr3, has
  very low activity on its own but is stimulated when it forms an Rnr1/Rnr3 heterodimer.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a catalytic class I RNR large subunit, and PAINT carries all
  four IBD terms (activity, ATP binding, RNR complex, deoxyribonucleotide biosynthesis) on one
  node, PTN000171388. Its inheritors span bacteria, one archaeon and eukaryotes, and its seeds
  include both class Ia (NrdA, eukaryotic R1) and class Ib (NrdE) enzymes. The subfamilies
  differ in their partner small subunit, radical cofactor and electron donor (class Ib uses
  NrdH-redoxin), not in the reaction. The one functional exception is quantitative: yeast Rnr3
  is nearly inactive alone and works through Rnr1/Rnr3 heterodimers.
