  scope_reason: >-
    The activity the dNTP module asserts for the RNR complex. Large subunits carry the
    catalytic site, and the activity is a property of the alpha2beta2 holoenzyme. For a single
    subunit, contributes_to is the precise qualifier, which is how the RNR1 review records the
    holoenzyme-based experiments. Yeast RNR3 is in scope but weak on its own. Its review records
    contributes_to from experiment, which this family assessment accepts.
  supported_by:
