    supporting_text: The R1 protein is the business end of the enzyme containing the active site and
      the binding sites for allosteric effectors.
  - reference_id: PMID:11893751
    supporting_text: The in vitro activity of Rnr3 was less than 1% of the Rnr1 activity.
