- subfamily_id: PANTHER:PTHR13285:SF23
  label: TEICHOIC ACID D-ALANYLTRANSFERASE
  description: >-
    Bacterial cell-envelope polymer acylation MBOATs that act with a DltD/SGNH-like partner: DltB
    (lipoteichoic acid D-alanylation), PatA (peptidoglycan O-acetylation) and AlgI (alginate
