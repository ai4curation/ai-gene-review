family_id: PANTHER:PTHR13285
family_name: ACYLTRANSFERASE
preferred_name: MBOAT acyltransferases of the HHAT/GUP1/DltB/AlgI group
summary: >-
  Polytopic membrane-bound O-acyltransferase (MBOAT) proteins that move an acyl group from a donor
  on one side of a membrane to an acceptor on the other side or within the membrane. The family
  contains eukaryotic protein N-palmitoyltransferases that acylate the Hedgehog N-terminal cysteine
  (human HHAT, mouse Hhat, Drosophila Rasp), the HHAT paralog HHATL, the fungal GUP1/GUP2 proteins
  implicated in GPI-anchor lipid remodelling, and a large bacterial group in which the MBOAT protein
  partners with a DltD/SGNH-like extracytoplasmic protein to acylate cell-envelope polymers: DltB
  (D-alanylation of teichoic acids), PatA (peptidoglycan O-acetylation) and AlgI (alginate
  O-acetylation). Acyltransferase chemistry around the catalytic histidine conserved across MBOATs
  is shared, but donor, acceptor and the polymer or protein being modified differ between
  subfamilies, so only the broad acyltransferase function is family-wide.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Broad acyltransferase activity is shared, but the subfamilies modify unrelated acceptors.
  SF20 (HHAT) and SF18 (Rasp plus fungal GUP1/GUP2) contain protein N-palmitoyltransferases and
  GPI-remodelling proteins; SF19 (HHATL) is the paralog that PAINT treats as having lost
  acyltransferase activity; SF23, despite its "TEICHOIC ACID D-ALANYLTRANSFERASE" name, contains
  DltB, PatA and the alginate AlgI proteins, which transfer D-alanine or acetyl groups to different
  cell-envelope polymers. PANTHER's own family label (ACYLTRANSFERASE) is therefore the most
  specific function that holds family-wide, and substrate-specific terms must be scoped to
  subfamilies or narrower InterPro families (for AlgI, IPR028362).
