notes: >-
  Reviewed for the alginate_o_acetylation module, whose AlgI members (P. aeruginosa Q51392, P.
  putida KT2440 Q88ND2, A. vinelandii O52196) are all classified at SF23. The family is too broad,
  and SF23 too mixed (DltB, PatA, AlgI), to be the module's family term for AlgI: the module is
  grounded to InterPro IPR028362 (Alginate O-acetyltransferase AlgI) instead. The P. putida and A.
  vinelandii AlgI GOA rows for GO:0016746 are IEA rather than IBA in the current GOA snapshot; only
  the P. aeruginosa row is an IBA from PTN000328645. Seed identities were checked against MGI
  (MGI:2444681 Hhat, MGI:1922020 Hhatl), SGD (S000003052 GUP1, S000006110 GUP2) and the EBI
  Proteins API (Q387S3 Trypanosoma brucei, Q4WHK8 Aspergillus fumigatus GUP1-like proteins).
