review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the BCKDHB gene review (genes/human/BCKDHB/BCKDHB-ai-review.yaml) and
  as the companion to the alpha-subunit family review at
  interpro/panther/PTHR43380/PTHR43380-review.yaml; the two families are the two halves
  of the same alpha2-beta2 enzyme and are best read together. All node ids, seed lists
  and snapshot dates are verbatim from the cached PTHR42980-paint.tsv; the subfamily
  accession and name are verbatim from panther.obo; membership comes from the fetched
  PTHR42980-entries.csv. Residue positions and expected amino acids are read from the
  UniProt P21953 BINDING feature table (sequence version 2, 392 aa).
  On the premise of the "human no-IBA" project: BCKDHB is not IBA-free in the fetched
  GOA - it receives all three of this family's PAINT assertions (GO:0009083, GO:0160157,
  GO:0007584), two of which are dated 2025-2026, so PAINT curation has moved since the
  project's gene list was drawn. The real gap is different in kind: this family has no
  molecular-function IBD at all, so the term with the strongest experimental grounding on
  the human gene (GO:0003863, three independent experimental annotations) does not
  propagate, while a 2017 single-seed "response to nutrient" does and reaches bacteria.
  The recommendations for a PAINT curator are therefore: add GO:0030976 at the family
  root, add GO:0003863 (contributes_to) and GO:0120552 at PTN000178891, and restrict
  GO:0007584 to a vertebrate- or metazoan-scoped node.
  Note the asymmetry with the alpha family: PTHR43380 is HETEROGENEOUS because PANTHER
  lumps pyruvate dehydrogenase E1-alpha into it, whereas the beta subunits of the
  pyruvate-type E1 are classified elsewhere, leaving PTHR42980 clean. The same term is
  therefore safe at a much higher level here than in the alpha family.
