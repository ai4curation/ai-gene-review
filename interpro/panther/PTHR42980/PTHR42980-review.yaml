family_id: PANTHER:PTHR42980
family_name: 2-OXOISOVALERATE DEHYDROGENASE SUBUNIT BETA-RELATED
preferred_name: >-
  Beta subunit of the branched-chain 2-oxo acid dehydrogenase (BCKDH) E1 component
  (BCKDHB / bkdA2 / bkdB / DIN4)
summary: >-
  The **beta subunit** counterpart to PTHR43380: this family holds the E1-beta chains
  that pair with a 2-oxoisovalerate dehydrogenase alpha subunit to build the
  alpha2-beta2 E1 decarboxylase of the branched-chain alpha-ketoacid dehydrogenase
  (BCKDH) complex. Every reviewed member in the fetched slice is a branched-chain E1-beta:
  human, bovine, rat and mouse BCKDHB, Dictyostelium bkdB, the thermophilic fungus
  Thermochaetoides CTHT_0041430, Arabidopsis BCDH BETA1 and DIN4, Pseudomonas putida and
  P. aeruginosa bkdA2, and Mycobacterium tuberculosis bkdB. The family therefore spans
  bacteria, fungi, plants, amoebozoa and animals, which is consistent with BCAA
  catabolism being an ancient and broadly conserved pathway.
  Mechanistically the beta subunit does not have an active site of its own: the two E1
  active sites lie at the alpha/beta' interfaces, and the beta chain supplies the
  thiazolium-ring contacts of the shared thiamine diphosphate cofactor (UniProt P21953
  BINDING 152, "ligand shared with alpha subunit"), several structural K+ sites, and the
  surfaces that hold the heterotetramer together and dock it onto the E2 (DBT) core.
  Consequently every well-founded molecular-function annotation on a member of this
  family is either a cofactor/ion-binding term that the subunit does enable on its own,
  or the complex-level branched-chain 2-oxo acid dehydrogenase activity with a
  contributes_to qualifier. Loss of the beta chain destabilises the alpha chain and
  collapses the whole complex, which is why human BCKDHB null alleles cause maple syrup
  urine disease type 1B.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every reviewed member in the fetched slice is a branched-chain E1-beta subunit, and
  PANTHER assigns all of them to the single subfamily PTHR42980:SF1, so the family reads
  as functionally uniform. Two reservations keep this from COHERENT rather than any
  identified divergent clade. First, the judgement rests on 12 reviewed entries out of
  12,531 members across 16,903 taxa, so unreviewed members are unsampled. Second,
  PANTHER's own name ends in "-RELATED", and the transketolase-C-like beta subunits of
  the other alpha2-beta2 2-oxo acid dehydrogenases (pyruvate dehydrogenase E1-beta,
  acetoin dehydrogenase E1-beta) are close relatives; if any of them fall inside this
  family they would not share branched-chain substrate specificity. Nothing in the
  fetched data shows that they do, so no divergent group is named here.
