  label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
  gene_symbol: BCKDHB
  organism: Homo sapiens
  gene_review: genes/human/BCKDHB/BCKDHB-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR42980:SF1
    label: "2-OXOISOVALERATE DEHYDROGENASE SUBUNIT BETA, MITOCHONDRIAL"
    description: >-
      The family's only subfamily, and the one holding human BCKDHB (P21953). In the
      fetched slice it contains every reviewed member: mammalian BCKDHB (P21953 human,
      P21839 bovine, P35738 rat, Q6P3A8 mouse), Dictyostelium bkdB (Q55FN7), fungal
      CTHT_0041430 (P9WF02), plant BCDH BETA1 (Q9SAV3) and DIN4 (Q9LDY2), and the
      bacterial bkdA2/bkdB chains (P09061 Pseudomonas putida, Q9I1M1 P. aeruginosa,
      P9WIS0/P9WIS1 M. tuberculosis). Because SF1 mixes bacterial and eukaryotic members,
      it is the right granularity for substrate-specificity statements but the wrong one
      for compartment statements such as mitochondrial matrix.
    representative_members:
      - id: UniProtKB:P21953
        label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
        gene_symbol: BCKDHB
        organism: Homo sapiens
      - id: UniProtKB:P21839
        label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
        gene_symbol: BCKDHB
        organism: Bos taurus
      - id: UniProtKB:P09061
        label: 2-oxoisovalerate dehydrogenase subunit beta
        gene_symbol: bkdA2
        organism: Pseudomonas putida
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000178891
    asserted_term:
      id: GO:0009083
      label: branched-chain amino acid catabolic process
    paint_snapshot: "20260530"
    seeds:
      - id: AGI_LocusCode:AT1G55510
      - id: AGI_LocusCode:AT3G13450
      - id: FB:FBgn0039993
      - id: MGI:MGI:88137
      - id: UniProtKB:P21953
        label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
        gene_symbol: BCKDHB
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      A well-distributed IBD - two Arabidopsis loci, Drosophila, mouse and human BCKDHB -
      for a process that is conserved from bacteria to mammals. Human BCKDHB receives the
      resulting IBA and its review accepts it, backed independently by IDA (PMID:3593587,
      the purified human liver complex oxidising KIV, KIC and KMV) and IMP (PMID:2022752,
      an 11-bp deletion abolishing the beta subunit and reducing BCKDH activity to ~6% of
      normal). P21953 appears in its own WITH/FROM, which is the expected signature of a
      node seeded partly on the target's own experimental annotation rather than any
      circularity - and it is informative here, because it means the IBA adds the claim
      that the function is inherited rather than human-specific.
  - node_id: PANTHER:PTN000178891
    asserted_term:
      id: GO:0007584
      label: response to nutrient
    paint_snapshot: "20170502"
    seeds:
      - id: RGD:2197
    assessment: TOO_DEEP
    assessment_reason: >-
      Placed on the same deep node as the branched-chain catabolic process, so it
      descends to every member of the family - including the Pseudomonas and
      Mycobacterium bkdA2/bkdB chains, the fungal and plant members, and Dictyostelium.
      "Response to nutrient" is a whole-organism physiological response; asserting it for
      a bacterial E1-beta subunit is not so much wrong as untestable, and nothing in the
      single 2017 rat seed speaks to those lineages. The seed count is not the objection
      here (a single well-characterised seed can support a node perfectly well); the
      objection is the mismatch between the granularity of the term and the depth of the
      node. The term would be defensible on a vertebrate- or metazoan-scoped node.
      For human BCKDHB the inherited term is harmless and is retained as non-core in the
      gene review: BCKDH flux genuinely does track nutrient status via BCKDK/PPM1K
      phosphorylation of E1-alpha. Pruning is a family-level tidy-up, not a correction to
      the human annotation.
  - node_id: PANTHER:PTN000178893
    asserted_term:
      id: GO:0160157
      label: branched-chain alpha-ketoacid dehydrogenase complex
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20250214"
    seeds:
      - id: UniProtKB:P21953
        label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
        gene_symbol: BCKDHB
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Complex membership on a eukaryote-scoped node seeded by human BCKDHB alone. The
      single-donor list is not weak support: P21953 is one of the best-characterised
      members of the family, with the alpha2-beta2 E1b crystal structure (PMID:10745006),
      assembly work defining the tetramer (PMID:9582350), co-purification of the intact
      human liver complex (PMID:3593587) and a null allele that collapses the complex
      (PMID:2022752). Placement at a eukaryotic node is conservative - the bacterial
      bkd-operon members are equally part of a branched-chain complex - but a
      conservative scope produces no false propagation, and it correctly reaches human
      BCKDHB, which does receive this IBA.

term_assessments:
  - assessed_term:
      id: GO:0030976
      label: thiamine pyrophosphate binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Not asserted by PAINT anywhere in this family, and it should be. Every member is
      the beta chain of a ThDP-dependent alpha2-beta2 E1 and contributes the
      thiazolium-ring contacts of the shared cofactor; UniProt records the corresponding
      BINDING site at position 152 of P21953 with experimental evidence
      (ECO:0000269|PubMed:10745006), annotated "ligand shared with alpha subunit". Unlike
      the substrate-specific activity term, cofactor binding does not depend on which
      2-oxo acid the complex handles, so it is safe at the family root. It has been added
      to the human BCKDHB review as a NEW annotation for the same reason.
    supported_by:
      - reference_id: PMID:10745006
        supporting_text: One of these ions assists a loop that is close to the cofactor
          to adopt the proper conformation.
  - assessed_term:
      id: GO:0003863
      label: branched-chain 2-oxo acid dehydrogenase activity
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR42980:SF1
        label: "2-OXOISOVALERATE DEHYDROGENASE SUBUNIT BETA, MITOCHONDRIAL"
    scope_reason: >-
      The molecular function is the most conspicuous gap in this family's PAINT
      curation: human BCKDHB has three experimental annotations to GO:0003863 (IDA
      PMID:10745006, IDA PMID:9582350, IMP PMID:2022752, all with contributes_to), and
      the bovine and rat orthologs are characterised too, yet PAINT asserts only the two
      BP terms and the CC term. Nothing in the family argues against the activity: all
      reviewed members are branched-chain E1-beta chains.
      Scoped to SF1 rather than FAMILY_WIDE because SF1 is where every reviewed member
      actually sits, and because the family name ("...BETA-RELATED") leaves open that
      unclassified members may be beta subunits of a related, non-branched-chain 2-oxo
      acid dehydrogenase - which would take a different substrate-specific term. A future
      IBD would be soundest placed on PTN000178891, the node that already carries
      GO:0009083 and covers the same clade.
      One qualifier caveat travels with the term: the activity is a property of the
      alpha2-beta2 heterotetramer and the beta subunit has no independent active site, so
      contributes_to (as every manual annotation on BCKDHB uses) is the right qualifier -
      an IBA propagating it as enables would overstate what the subunit does.
    supported_by:
      - reference_id: PMID:9582350
        supporting_text: The E1 decarboxylase component of the human branched-chain
          ketoacid dehydrogenase complex comprises two E1alpha (45.5 kDa) and two E1beta
          (37.5 kDa) subunits forming an alpha2 beta2 tetramer.
  - assessed_term:
      id: GO:0005759
      label: mitochondrial matrix
    scope: UNRESOLVED
    scope_reason: >-
      Correct for the eukaryotic members and meaningless for the bacterial ones
      (Pseudomonas bkdA2, Mycobacterium bkdB), which have no mitochondria. It cannot be
      expressed at subfamily level either, because PANTHER's single SF1 mixes bacterial
      and eukaryotic members. The right vehicle is a taxon-scoped node - exactly what
      PAINT already used for the complex term at PTN000178893 (taxon:2759, Eukaryota).
      Recorded as UNRESOLVED rather than granted or denied so that no member inherits it
      by subfamily membership. Human BCKDHB's own matrix localisation is independently
      and abundantly annotated (NAS, ISS, IEA, and multiple Reactome TAS rows), so
      nothing is lost by leaving the family-level scope open.
  - assessed_term:
      id: GO:0120552
      label: branched-chain alpha-keto acid decarboxylation to branched-chain acyl-CoA
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR42980:SF1
        label: "2-OXOISOVALERATE DEHYDROGENASE SUBUNIT BETA, MITOCHONDRIAL"
    scope_reason: >-
      The precise process term for what the E1 component does, and a better description
      of the beta subunit's pathway role than the broader GO:0009083 that PAINT does
      propagate. Human BCKDHB carries it with IDA (PMID:3593587) and IMP (PMID:10745006)
      evidence. It is safe wherever GO:0009083 is safe in this family, since the two
      describe the same step at different granularity, and it is scoped to SF1 on the
      same reasoning as GO:0003863.
    supported_by:
      - reference_id: PMID:3593587
        supporting_text: The BCKADH effectively oxidized all of KIV, KIC, and KMV,
          yielding apparent Km values in the range of 14-17 microM for those alpha-keto
          acids.

residue_sites:
  - site_id: thdp_thiazolium_site
    label: Shared thiamine diphosphate contact on the E1 beta subunit
    description: >-
      The beta subunit's single annotated contact with the thiamine diphosphate cofactor
      that is shared across the alpha/beta' interface. Taken verbatim from the UniProt
      P21953 BINDING feature table (ChEBI:CHEBI:58937, "ligand shared with alpha
      subunit", ECO:0000269|PubMed:10745006). The diphosphate and Mg2+ contacts are on
      the alpha subunit and are curated in the PTHR43380 family review instead.
    anchor:
      id: UniProtKB:P21953
      label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
      gene_symbol: BCKDHB
      organism: Homo sapiens
    anchor_sequence_version: 2
    residues:
      - position: 152
        expected: [Y]
        role: thiamine diphosphate contact (shared with alpha subunit)
    required_for:
      - term:
          id: GO:0030976
          label: thiamine pyrophosphate binding
        strength: CONTRIBUTES
        rationale: >-
          The cofactor site is built jointly by the two subunits, so this single beta
          contact supports rather than solely determines binding; strength is left at
          CONTRIBUTES because no member of this family is known to lack ThDP binding and
          therefore no honest negative control exists to license the stronger claim.
        supported_by:
          - reference_id: PMID:10745006
            supporting_text: One of these ions assists a loop that is close to the
              cofactor to adopt the proper conformation.
    site_source: UNIPROT_FEATURE
    external_ref:
      id: UniProtKB:P21953
      source_db: UNIPROT
      source_url: https://www.uniprot.org/uniprotkb/P21953/entry
  - site_id: structural_k_site
    label: Structural potassium sites of the E1 beta subunit
    description: >-
      Six structural K+ coordinating positions on the beta chain, from the UniProt P21953
      BINDING feature table (ChEBI:CHEBI:29103, ligand_note "structural", all with
      ECO:0000269|PubMed:10745006). The E1b crystal structure located two K+ ions, the
      second of them within the beta subunit near its interface with the alpha subunit's
      C-terminal domain, and implicated the cation sites in the mechanism by which MSUD
      mutations impair the enzyme.
    anchor:
      id: UniProtKB:P21953
      label: 2-oxoisovalerate dehydrogenase subunit beta, mitochondrial
      gene_symbol: BCKDHB
      organism: Homo sapiens
    anchor_sequence_version: 2
    residues:
      - position: 178
        expected: [G]
        role: structural K+ coordination
      - position: 180
        expected: [L]
        role: structural K+ coordination
      - position: 181
        expected: [T]
        role: structural K+ coordination
      - position: 228
        expected: [C]
        role: structural K+ coordination
      - position: 231
        expected: [D]
        role: structural K+ coordination
      - position: 233
        expected: [N]
        role: structural K+ coordination
    required_for:
      - term:
          id: GO:0030955
          label: potassium ion binding
        strength: CONTRIBUTES
        rationale: >-
          These are the protein ligands of the beta-subunit cation site resolved in the
          E1b structure. Strength is CONTRIBUTES rather than REQUIRED: the site is
          structural rather than catalytic, individual substitutions need not abolish
          cation occupancy, and no family member is characterised as having lost it, so
          there is no negative control to justify the stronger level.
        supported_by:
          - reference_id: PMID:10745006
            supporting_text: The second is located in the beta subunit near the
              interface with the small C-terminal domain of the alpha subunit.
    site_source: UNIPROT_FEATURE
    external_ref:
      id: UniProtKB:P21953
      source_db: UNIPROT
      source_url: https://www.uniprot.org/uniprotkb/P21953/entry

