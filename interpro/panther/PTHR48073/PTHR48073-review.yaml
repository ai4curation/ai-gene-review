  assessment_reason: >-
    The node sits near the root of the bacterial part of the tree (83 leaves:
    SF2, SF4 and SF6). Its descendants include the gammaproteobacterial
    MenC/CatB clade PTN001334879, which is correctly excluded by an IRD (see
