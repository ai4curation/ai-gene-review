family_id: PANTHER:PTHR48073
family_name: O-SUCCINYLBENZOATE SYNTHASE-RELATED
preferred_name: >-
  Mandelate racemase/muconate lactonizing enzyme (enolase superfamily) family:
  OSBS, muconate cycloisomerases and dipeptide epimerases
summary: >-
  A family of the mandelate racemase/muconate lactonizing enzyme (MLE)
  subgroup of the enolase superfamily. All members share the two-domain
  enolase fold with a divalent-metal-binding barrel and a general-base
  lysine, but the chemistry varies between clades: o-succinylbenzoate synthase
  (MenC, a dehydratase of menaquinone/phylloquinone biosynthesis), muconate
  cycloisomerase (CatB) of the catechol ortho-cleavage pathway, the
  dehalogenating chloromuconate cycloisomerases of chlorocatechol pathways,
  L-Ala-D/L-amino acid and dipeptide epimerases, N-succinylamino acid
  racemases, and methylaspartate ammonia-lyases. Proteobacterial CatB enzymes
  (P. putida, Acinetobacter) fall in SF2 together with MenC, chloromuconate
  cycloisomerases and epimerases; actinobacterial muconate cycloisomerases
  (e.g. Rhodococcus opacus 1CP CatB) are classified in a different PANTHER
  family, PTHR48080.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared fold and metal-assisted enolization mechanism support many
  different reactions: dehydration (OSBS), intramolecular cycloisomerization
  (muconate and chloromuconate cycloisomerases), epimerization/racemization
  of dipeptides and N-acylamino acids, and ammonia elimination. Even within
  SF2 the gammaproteobacterial clade under PTN001334879 contains both MenC and
  CatB. No specific activity term is safe family-wide.
