  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Proteobacterial muconate cycloisomerases occur only in SF2. SF2 also holds
    MenC, chloromuconate cycloisomerases and epimerases, so SF2 membership is
    necessary but not sufficient; members are assigned the term on their own
    evidence or on muconate cycloisomerase clade membership (NCBIfam
    TIGR02534), as for the reviewed KT2440 and ADP1 CatB proteins.
