family_id: PANTHER:PTHR19855
family_name: WD40 REPEAT PROTEIN 12, 37
preferred_name: WDR12/Ytm1 WD-repeat ribosome-biogenesis factors and divergent relatives
summary: >-
  PTHR19855 is a heterogeneous WD-repeat family that contains the conserved
  WDR12/Ytm1 pre-60S assembly factor clade, fungal Mdv1/Caf4-like mitochondrial
  and peroxisomal fission factors, metazoan WDR37 proteins, and several
  F-box/WD-repeat branches. PAINT correctly confines preribosome and PeBoW
  complex assertions to WDR12/Ytm1 nodes and confines mitochondrial/peroxisome
  fission to a separate fungal Mdv1-family node; the broad family should not
  carry either function.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PANTHER groups WDR12/Ytm1, Mdv1/Caf4-like fungal fission factors, WDR37, and
  F-box/WD-repeat proteins in the same family. The WDR12/Ytm1 clade is a
  nucleolar pre-60S assembly factor clade, whereas the Mdv1/Caf4 clade functions
  in organelle fission rather than ribosome biogenesis.
