    scope: FAMILY_WIDE
    scope_reason: >-
      Conserved biological process across all experimentally characterized subfamilies of
      PTHR13964, mediated via SWI/SNF chromatin remodeling in fungal SF27 (SWI1, sol1),
      Sin3-HDAC / Notch / AR transcriptional coregulation in metazoan SF27 (htk) and
      vertebrate SF26/SF24 (ARID4A, ARID4B), and AT-rich promoter binding in vertebrate
      SF25/SF37 (ARID5A, ARID5B).
    supported_by:
      - reference_id: PMID:1339306
        supporting_text: "Characterization of the yeast SWI1, SWI2, and SWI3 genes, which encode a global activator of transcription."
