family_id: PANTHER:PTHR13964
family_name: RBP-RELATED
preferred_name: ARID4 / ARID5 / SWI1 chromatin-regulatory, DNA-binding and RNA-binding ARID family
summary: >-
  Opisthokont family of nuclear proteins built around a homologous six-helix AT-rich
  interaction domain (ARID) fold that has diversified across four major mechanistic
  regimes. In fungi (subfamily PTHR13964:SF27 Dikarya clade, exemplified by S. cerevisiae
  SWI1 and S. pombe sol1), members serve as non-catalytic structural subunits of the
  ATP-dependent SWI/SNF chromatin-remodeling complex whose ARID domains bind DNA weakly
  and without sequence specificity while N-terminal regions scaffold the nucleosomal
  DNA-binding lobe and recruit transcription factors. In invertebrates (metazoan
  PTHR13964:SF27, exemplified by Drosophila hat-trick/htk and C. elegans arid-1) and
  vertebrates (paralogous subfamilies PTHR13964:SF26 ARID4A/RBP1 and PTHR13964:SF24
  ARID4B/RBP1L1/SAP180), members act as chromatin-binding corepressor/coactivator
  scaffolds associated with Sin3-HDAC complexes, combining an N-terminal interdigitated
  double Tudor dsDNA-binding domain, a sequence-nonspecific central ARID domain, a
  Royal-family chromobarrel domain, and a C-terminal Sin3 PAH2-binding R2 helix; mammalian
  ARID4A uniquely retains a canonical 957-LVCHE-961 (LXCXE) motif that directly recruits
  mSin3A-HDAC1/2 to the RB1 pocket, whereas ARID4B lacks the LXCXE motif. Conversely, the
  vertebrate ARID5 clade acquired a conserved loop-L2/Helix-5 AT-recognition segment
  (GSTSAATCTRRHYERL) that inserts into the DNA major groove to confer selective binding to
  AT-rich cis-regulatory elements: PTHR13964:SF37 (ARID5B/MRF2) acts as a sequence-specific
  cis-regulatory DNA-binding transcription factor that assembles a PKA-activated H3K9me2
  demethylase coactivator complex with PHF2 via Lys336, whereas PTHR13964:SF25
  (ARID5A/MRF1) is a bifunctional nucleocytoplasmic shuttling regulator that binds both
  AT-rich promoter DNA in the nucleus and stem-loop cis-regulatory elements in inflammatory
  mRNA 3'-UTRs (including IL6, STAT3, and TNFRSF4/OX40) via intrinsically disordered
  extensions flanking its core ARID domain to antagonize Regnase-1-mediated mRNA decay.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Although nearly all characterized PTHR13964 members localize to the nucleus (with
  regulated nucleocytoplasmic shuttling in ARID5A) and regulate RNA polymerase II
  transcription, specific molecular functions and macromolecular complexes diverge sharply
  across clades: (1) fungal SF27 members (SWI1, sol1) are obligate SWI/SNF chromatin-remodeling
  complex subunits with sequence-nonspecific ARID domains; (2) metazoan SF27 (htk) and
  vertebrate SF26/SF24 (ARID4A, ARID4B) are Sin3-HDAC corepressor/chromatin scaffolds with
  sequence-nonspecific Tudor and ARID dsDNA-binding domains (and an SF26-specific LXCXE RB1
  pocket-binding motif in ARID4A); (3) SF37 (ARID5B) is a sequence-specific AT-rich
  cis-regulatory DNA-binding transcription factor and PHF2 H3K9me2 demethylase recruiter;
  and (4) SF25 (ARID5A) combines AT-rich promoter DNA binding with 3'-UTR stem-loop mRNA
  binding and stabilization in the cytoplasm. Placing sequence-specific cis-regulatory DNA
  binding (GO:0000976) at the Opisthokont root (PTN000359478) over-propagates an
  ARID5-clade innovation onto sequence-nonspecific ARID4 and fungal/metazoan SF27 proteins.
