    assessment: TOO_DEEP
    assessment_reason: >-
      Seeded solely by human ARID5B (UniProtKB:Q14865, subfamily PTHR13964:SF37) at the
      Opisthokont root PTN000359478, causing inappropriate IBA propagation across sequence-nonspecific
      clades. Comparative DNA-binding selections across human ARID subfamilies (PMID:15640446)
      and NMR titrations of RBP1/ARID4A (PMID:34506790) and ARID4B (PMID:33675746) prove that
      only the vertebrate ARID5 clade (PTN009015192, uniting PTHR13964:SF37 ARID5B and
      PTHR13964:SF25 ARID5A) carries the loop-L2/Helix-5 AT-rich major-groove recognition
      sequence (GSTSAATCTRRHYERL) required for selective cis-regulatory DNA binding, whereas
      PTHR13964:SF26 (ARID4A), PTHR13964:SF24 (ARID4B), and PTHR13964:SF27 (S. cerevisiae
      SWI1, S. pombe sol1, Drosophila htk) lack these base-specific contacts and bind DNA
      weakly or without sequence specificity, relying on partner transcription factors (such
      as RB1/E2F, AR, Su(H), or Gcn4) for promoter recruitment. The IBD should be moved down
      from PTN000359478 to the vertebrate ARID5 ancestor PANTHER:PTN009015192.
