    supported_by:
      - reference_id: PMID:18622392
        supporting_text: "Fission yeast SWI/SNF and RSC complexes show compositional and functional differences from budding yeast."
      - reference_id: PMID:31142544
        supporting_text: "Regulation of Notch signaling by the chromatin-modeling protein Hat-trick."
  - subfamily_id: PANTHER:PTHR13964:SF37
    label: AT-RICH INTERACTIVE DOMAIN-CONTAINING PROTEIN 5B
    description: >-
      Vertebrate ARID5B (MRF2 / DESRT) sequence-specific AT-rich cis-regulatory DNA-binding
      transcription factor (~1188 aa) that recognizes AATA(C/T) elements via loop L2 and
      Helix 5 of its ARID domain. Functions as both a transcriptional repressor (e.g. at
      the cytomegalovirus major immediate-early enhancer) and a signal-responsive
      transcriptional coactivator that partners via Lys336 with PKA-phosphorylated PHF2 to
      demethylate repressive H3K9me2 marks at hepatic, chondrogenic (SOX9-regulated), and
      adipogenic target promoters.
    representative_members:
      - id: UniProtKB:Q14865
        label: AT-rich interactive domain-containing protein 5B
        gene_symbol: ARID5B
        organism: Homo sapiens (Human)
        gene_review: genes/human/ARID5B/ARID5B-ai-review.yaml
      - id: UniProtKB:Q8BM75
        label: AT-rich interactive domain-containing protein 5B
        gene_symbol: Arid5b
        organism: Mus musculus (Mouse)
    diverged_from_family: true
    divergence_description: >-
      Possesses genuine sequence-specific AT-rich cis-regulatory DNA binding (GO:0000976)
      mediated by the ARID5 loop-L2/Helix-5 major-groove motif (Thr388, Ser389, Cys393,
      Arg396) and uniquely harbors Helix-1 Lys336 required for PKA-regulated PHF2 H3K9me2
      demethylase holoenzyme assembly, while lacking the cytoplasmic mRNA-stabilizing role
      of sister subfamily SF25 (ARID5A) and the Sin3/SWI-SNF scaffolding modules of
      ARID4/SF27.
    supported_by:
      - reference_id: PMID:17407261
        supporting_text: "Lys70, Ser82, Thr83, Ser84, and Cys88 in helices H4, H5, and loop L2 form base-specific contacts with A-T base pairs in the major groove."
      - reference_id: PMID:21532585
        supporting_text: "We found that phosphorylated PHF2 then associates with ARID5B, a DNA-binding protein, and induce demethylation of methylated ARID5B."
  - subfamily_id: PANTHER:PTHR13964:SF41
    label: AT-RICH INTERACTIVE DOMAIN-CONTAINING PROTEIN 5B
    description: >-
      Small uncharacterized non-mammalian vertebrate sister group nested within the
