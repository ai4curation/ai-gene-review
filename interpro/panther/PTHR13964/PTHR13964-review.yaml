    diverged_from_family: true
    divergence_description: >-
      Both fungal SWI/SNF subunits (SWI1, sol1) and invertebrate ARID4-like Sin3/chromatin
      regulators (htk, arid-1) lack the vertebrate ARID5 loop-L2/Helix-5 AT-selective
