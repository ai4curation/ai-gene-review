notes: >-
  PANTHER 19.0 classifies 7 subfamilies under PTHR13964 (RBP-RELATED). Subfamilies SF41 and
  SF44 contain only unreviewed non-mammalian vertebrate and invertebrate deuterostome
  proteins and are left with diverged_from_family: false. Note that human ARID4A carries
  legacy synonym RBP1 (Retinoblastoma-binding protein 1, HGNC:9885), which collides in
  literature and NLP pipelines with retinol-binding protein 1 (RBP1, UniProtKB:P09455,
  HGNC:9919), and human ARID5A carries legacy synonym MRF-1 (Modulator recognition factor 1),
  which collides with rat microglial response factor-1 (mrf-1 / Aif1).
