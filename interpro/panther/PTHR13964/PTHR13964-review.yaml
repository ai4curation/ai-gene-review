subfamilies:
  - subfamily_id: PANTHER:PTHR13964:SF24
    label: AT-RICH INTERACTIVE DOMAIN-CONTAINING PROTEIN 4B
    description: >-
      Vertebrate ARID4B (RBP1L1 / SAP180 / BCAA) chromatin-regulatory scaffold and
      mSin3A-HDAC1 corepressor subunit containing an N-terminal interdigitated Tudor
      dsDNA-binding domain, a sequence-nonspecific central ARID domain, a chromobarrel
      domain, and a C-terminal R2 Sin3A-binding region, but lacking the canonical LXCXE
      RB1 pocket-binding motif present in paralog ARID4A. Regulates genomic imprinting at
      the PWS/AS locus and androgen receptor transcriptional programs with ARID4A, promotes
      pluripotency exit via SIN3A-HDAC1, and activates PIK3CA/PIK3R2 promoters by
      antagonizing linker histone H1 occupancy.
    representative_members:
      - id: UniProtKB:Q4LE39
        label: AT-rich interactive domain-containing protein 4B
        gene_symbol: ARID4B
        organism: Homo sapiens (Human)
        gene_review: genes/human/ARID4B/ARID4B-ai-review.yaml
      - id: UniProtKB:A2CG63
        label: AT-rich interactive domain-containing protein 4B
        gene_symbol: Arid4b
        organism: Mus musculus (Mouse)
    diverged_from_family: true
    divergence_description: >-
      Lacks the ARID5 loop-L2/Helix-5 AT-rich major-groove recognition residues and binds
      dsDNA without sequence specificity via its Tudor and ARID domains, functioning within
      mammalian mSin3A-HDAC1 complexes rather than fungal SWI/SNF complexes, and differs
      from sister subfamily SF26 (ARID4A) by loss of the LXCXE RB1 pocket-binding motif.
    supported_by:
      - reference_id: PMID:12724404
        supporting_text: "We have purified an mSin3A complex from K562 erythroleukemia cells and identified three new mSin3A-associated proteins (SAP): SAP180, SAP130, and SAP45."
      - reference_id: PMID:33675746
        supporting_text: "Structural basis for the DNA-binding activity of human ARID4B Tudor domain."
  - subfamily_id: PANTHER:PTHR13964:SF25
    label: AT-RICH INTERACTIVE DOMAIN-CONTAINING PROTEIN 5A
    description: >-
      Vertebrate ARID5A (MRF-1) bifunctional nucleic-acid-binding regulator (~594 aa)
      comprising an extended N-terminal ARID domain flanked by intrinsically disordered
      basic regions and lacking Tudor, PWWP, chromobarrel, or R2 Sin3-binding domains.
      In the nucleus, ARID5A binds AT-rich promoter DNA and cooperates with SOX9 (promoting
      COL2A1 transcription in chondrocytes) or represses nuclear hormone receptor and viral
      enhancer activity; upon inflammatory LPS/IL-1beta/IL-6 signaling, ARID5A shuttles to
      the cytoplasm via CRM1 and binds conserved stem-loop structures in the 3'-UTRs of
      Il6, Stat3, Tbx21, and Ox40 (Tnfrsf4) mRNAs to protect them from Regnase-1 (ZC3H12A)
      endoribonucleolytic degradation.
    representative_members:
      - id: UniProtKB:Q03989
        label: AT-rich interactive domain-containing protein 5A
        gene_symbol: ARID5A
        organism: Homo sapiens (Human)
        gene_review: genes/human/ARID5A/ARID5A-ai-review.yaml
      - id: UniProtKB:Q3U108
        label: AT-rich interactive domain-containing protein 5A
        gene_symbol: Arid5a
        organism: Mus musculus (Mouse)
    diverged_from_family: true
    divergence_description: >-
      Uniquely neofunctionalized within PTHR13964 for post-transcriptional 3'-UTR stem-loop
      mRNA binding and stabilization in the cytoplasm via disordered extensions flanking its
      core ARID domain, while retaining the vertebrate ARID5 major-groove AT-rich dsDNA
      recognition motif (Thr125, Ser126, Arg133) for nuclear promoter regulation.
    supported_by:
      - reference_id: PMID:23676272
        supporting_text: "Arid5a controls IL-6 mRNA stability, which contributes to elevation of IL-6 level in vivo."
      - reference_id: PMID:38866324
        supporting_text: "Ultimately, our data suggest that Arid5a uses its extended ARID domain for bifunctional gene regulation"
  - subfamily_id: PANTHER:PTHR13964:SF26
    label: AT-RICH INTERACTIVE DOMAIN-CONTAINING PROTEIN 4A
    description: >-
      Vertebrate ARID4A (RBP1 / RBBP1) retinoblastoma-binding chromatin corepressor and
      context-dependent coactivator (~1257 aa) containing an N-terminal interdigitated
      double Tudor dsDNA-binding domain, a PWWP-like RBB1NT domain, a sequence-nonspecific
      ARID domain with an autoinhibitory acidic loop, a chromobarrel domain, an R1
      HDAC-independent repression domain, a canonical 957-LVCHE-961 (LXCXE) RB1
      pocket-binding motif, and a C-terminal R2 mSin3A-binding domain. Bridges E2F-bound
      pocket proteins (RB1, RBL1, RBL2) to mSin3A-HDAC1/2 complexes to silence cell-cycle
      genes and cooperates with ARID4B in PWS/AS imprinting, myeloid tumor suppression, and
      Sertoli-cell androgen receptor signaling.
    representative_members:
      - id: UniProtKB:P29374
        label: AT-rich interactive domain-containing protein 4A
        gene_symbol: ARID4A
        organism: Homo sapiens (Human)
        gene_review: genes/human/ARID4A/ARID4A-ai-review.yaml
      - id: UniProtKB:F8VPQ2
        label: AT-rich interactive domain-containing protein 4A
        gene_symbol: Arid4a
        organism: Mus musculus (Mouse)
    diverged_from_family: true
    divergence_description: >-
      Binds DNA non-specifically via its ARID and interdigitated double Tudor domains
      (lacking the ARID5 major-groove AT-selective motif) and uniquely possesses the
      957-LVCHE-961 (LXCXE) retinoblastoma pocket-binding motif that couples RB1 directly
      to mSin3A-HDAC1/2 transcriptional repression.
    supported_by:
      - reference_id: PMID:11283269
        supporting_text: "RBP1 recruits the mSIN3-histone deacetylase complex to the pocket of retinoblastoma tumor suppressor family proteins found in limited discrete regions of the nucleus at growth arrest."
      - reference_id: PMID:34506790
        supporting_text: "NMR titration results indicated that the ARID domain interacts with DNA with no GC- or AT-rich preference."
  - subfamily_id: PANTHER:PTHR13964:SF27
    label: HAT-TRICK, ISOFORM D
    description: >-
      Basal opisthokont/invertebrate grade uniting two phylogenetically separated branches
      that PANTHER classifies under SF27: (1) fungal SWI/SNF chromatin-remodeling complex
      structural subunits (S. cerevisiae SWI1, S. pombe sol1), which scaffold the SWI/SNF
      DNA-binding lobe and recruit transcriptional activators while binding DNA weakly and
      non-specifically through their ARID domain; and (2) invertebrate ARID4-like chromatin
      regulators (Drosophila hat-trick/htk, C. elegans arid-1), which share Tudor,
      ARID, and chromobarrel architecture with vertebrate ARID4A/ARID4B, co-purify with the
      Drosophila SIN3-RPD3 complex, maintain oocyte heterochromatin/karyosome organization,
      and coactivate Notch/Su(H) target transcription.
    representative_members:
