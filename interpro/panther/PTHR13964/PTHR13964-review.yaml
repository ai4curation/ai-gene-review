        supporting_text: "NMR titration results indicated that the ARID domain interacts with DNA with no GC- or AT-rich preference."
  - assessed_term:
      id: GO:0016514
      label: SWI/SNF complex
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Within PTHR13964, stoichiometric membership in the SWI/SNF chromatin-remodeling
      complex occurs only in the Dikarya fungal branch (PTN002303792: S. cerevisiae SWI1,
      S. pombe sol1) of PTHR13964:SF27; metazoan PTHR13964 members (including metazoan SF27
      htk as well as vertebrate ARID4A/4B/5A/5B) are not SWI/SNF subunits, as metazoan BAF
      complexes instead incorporate PTHR10591 subunits (ARID1A/ARID1B/Osa).
