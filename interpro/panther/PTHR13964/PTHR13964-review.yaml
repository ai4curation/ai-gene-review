        supporting_text: "Arid5a cooperates with Sox9 to stimulate chondrocyte-specific transcription."
  - assessed_term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Restricted to the vertebrate ARID5 subfamilies PTHR13964:SF25 (ARID5A) and
      PTHR13964:SF37 (ARID5B), which share the 16-residue loop-L2/Helix-5 major-groove AT
      recognition motif (GSTSAATCTRRHYERL) and bind cis-regulatory promoter/enhancer DNA in
      vitro and in vivo. Members of PTHR13964:SF24 (ARID4B), PTHR13964:SF26 (ARID4A), and
      PTHR13964:SF27 (SWI1, sol1, htk) lack this major-groove motif and bind dsDNA only
      non-specifically.
