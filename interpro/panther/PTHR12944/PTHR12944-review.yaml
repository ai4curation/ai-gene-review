family_id: PANTHER:PTHR12944
family_name: SOLUBLE LIVER ANTIGEN/LIVER PANCREAS ANTIGEN
preferred_name: SepSecS O-phosphoseryl-tRNA(Sec) selenium transferases
summary: >-
  O-phosphoseryl-tRNA(Sec) selenium transferases (SepSecS, EC 2.9.1.2), the
  pyridoxal-phosphate enzymes that convert O-phospho-L-seryl-tRNA(Sec) and
  selenophosphate into L-selenocysteinyl-tRNA(Sec) in archaea and eukaryotes. The
  family name records the protein's original identification as the soluble liver
  antigen / liver-pancreas antigen (SLA/LP), an autoantigen of autoimmune hepatitis.
  All twelve Swiss-Prot members (human, primate, mouse, frog, zebrafish, nematode,
  Dictyostelium, Leishmania and three methanogenic archaea) are in the single
  subfamily SF2. The PANTHER tree has 46 leaves spanning metazoa, protists, algae and
  archaea.
functional_coherence: COHERENT
coherence_reason: >-
  Human and archaeal SepSecS complement an E. coli selA deletion and purified
  SepSecS performs the reaction in vitro; every Swiss-Prot member is named and
  annotated for the same reaction, and no member is recorded with a different
  function.
