    supporting_text: "PTHR12944\tPTN000986608\tGO:0001514\tP\tIBD\tfalse\tMGI:MGI:1098791|UniProtKB:Q9HD40"
  - reference_id: file:interpro/panther/PTHR12944/PTHR12944-tree-check.txt
