- node_id: PANTHER:PTN000986608
  asserted_term:
    id: GO:0001514
    label: selenocysteine incorporation
  evidence: IBD
  paint_snapshot: '20251219'
  seeds:
  - id: MGI:MGI:1098791
  - id: UniProtKB:Q9HD40
  assessment: SOUND
  assessment_reason: >-
    The placement is sound: every leaf is a SepSecS from a Sec-decoding lineage, and
    SepSecS makes the Sec-tRNA(Sec) that the incorporation machinery delivers. The
    term is not the most precise one for the enzyme, which performs the second step
    of GO:0001717 (conversion of seryl-tRNAsec to selenocys-tRNAsec) rather than
    decoding at the ribosome; the human gene review keeps GO:0001514 as non-core for
    that reason.
  supported_by:
