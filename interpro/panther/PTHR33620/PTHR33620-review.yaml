family_id: PANTHER:PTHR33620
family_name: UREASE ACCESSORY PROTEIN F
preferred_name: Urease accessory protein UreF family
summary: >-
  UreF is the all-helical urease accessory protein that binds UreD (UreH) on the
  urease apoprotein and, as the UreD-UreF pair, recruits the SIMIBI GTPase UreG
  into the pre-activation complex. In Klebsiella aerogenes, UreF's UreG-binding
  surface lets UreG's GTPase activity guard against improper metallocenter
  assembly rather than acting as a GTPase-activating protein. In Helicobacter,
  UreF-UreH holds a UreG dimer whose nickel site forms at the interface. Plant UreF
  (Arabidopsis, rice) is required for urease activity. The family also includes
  the Bordetella bifunctional UreEF fusion and fungal UreF-like proteins.
functional_coherence: COHERENT
coherence_reason: >-
  All 223 cached members fall in one subfamily (PTHR33620:SF1) and are urease
  accessory protein F or UreF-like proteins from urease-encoding genomes. The
  characterized bacterial, Helicobacter and plant members act in the same
  activation-complex role.
