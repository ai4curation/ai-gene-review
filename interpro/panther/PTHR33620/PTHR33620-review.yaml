- assessed_term:
    id: GO:0005096
    label: GTPase activator activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    UreF was once modelled as a GAP for UreG, but the K. aerogenes test showed that a
    UreF variant raises rather than lowers complex GTPase activity. The authors
    concluded that UreF improves activation fidelity, not GTP turnover, so a GAP
    term should not be propagated to this family.
  supported_by:
  - reference_id: PMID:22369361
    supporting_text: >-
      The experiments described above demonstrate that a defective UreF enhances the
      GTPase activity of UreABC—UreD—UreF—UreGStr and cast doubt on the hypothesis
      that this protein serves as a GAP.
