  - id: AGI_LocusCode:AT1G21840
  assessment: SOUND
  assessment_reason: >-
    The term fits UreF's role: it promotes nickel incorporation into urease as part
    of the UreD-UreF-UreG pre-activation complex without catalysing it.
    Arabidopsis ureF lines lack urease activity, and K. aerogenes UreF is the
    UreG-binding component that keeps activation faithful. Every characterized
    member in bacteria, Helicobacter and plants does this. PAINT's taxon label
    (Bacteria) is narrower than the plant seed and fungal members, but the node
    covers all members of the family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33620/PTHR33620-paint.tsv
    supporting_text: "PTHR33620\tPTN008658147\tGO:0018237\tF\tIBD\tfalse"
  - reference_id: PMID:22369361
    supporting_text: >-
      These results indicate that wild-type UreF allows the GTPase activity of UreG
      to partially protect against improper metallocenter assembly.
