family_id: PANTHER:PTHR10380
family_name: CUTICLE PROTEIN
summary: Arthropod cuticle proteins contribute to extracellular cuticular structures, with sequence groups
  associated with different tissues and developmental stages. Rebers-Riddiford chitin-binding signatures
  characterize the cuticle-protein branch represented by Drosophila Lcp3.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The exact Lcp3 polypeptide is identical to the reviewed larval cuticle protein, supporting
  its larval-cuticle role. Related structural cuticle proteins are also directly isolated from pupal cuticle,
  with stage-dependent expression (PMID:12609518). Thus the broad cuticle structural role is coherent
  but a specifically larval term cannot be granted universally. Chitin-binding signatures alone do not
  resolve developmental stage or tissue-specific incorporation.
