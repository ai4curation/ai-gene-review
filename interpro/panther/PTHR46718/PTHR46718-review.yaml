notes: >-
  Used by modules/aspartate_family_threonine_biosynthesis.yaml
  (aspartate_semialdehyde_dehydrogenase_activity, family_terms PTHR46718:SF1 plus
  PTHR46278:SF4). The module's statement that fungal and enterobacterial ASADHs are in
  different PANTHER families is correct (HOM2/hom2 in PTHR46718:SF1; E. coli asd in
  PTHR46278:SF4), verified in UniProt and the PANTHER 19.0 classification files. Note that
  PTHR46718 is not purely fungal (archaeal and Leptospira ASADHs, plus the malonyl-CoA
  reductases).
