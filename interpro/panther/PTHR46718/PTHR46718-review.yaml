family_id: PANTHER:PTHR46718
family_name: ASPARTATE-SEMIALDEHYDE DEHYDROGENASE
preferred_name: Fungal-type aspartate-semialdehyde dehydrogenases
summary: >-
  NAD(P)-binding Rossmann-fold dehydrogenases that reduce 4-phospho-L-aspartate to
  L-aspartate 4-semialdehyde with NADPH (EC 1.2.1.11), the second step of the aspartate
  family trunk. This family holds the fungal enzymes (S. cerevisiae HOM2, S. pombe hom2,
  Candida, Aspergillus and Cryptococcus orthologues) together with some archaeal and
  bacterial ASADHs (M. jannaschii, Leptospira) and the crenarchaeal malonyl-CoA reductases;
  the enterobacterial and most other bacterial and plant ASADHs are in the separate family
  PTHR46278.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All named ASADHs in the single subfamily SF1 share the reaction, and PAINT asserts it at
  PTN002928538 from four fungal seeds. The exception is the two crenarchaeal malonyl-CoA
  reductases (Metallosphaera sedula Msed_0709, Sulfurisphaera tokodaii mcr), which are in
  SF1 but were recruited to the autotrophic 3-hydroxypropionate/4-hydroxybutyrate cycle and
  reduce malonyl-CoA instead. They do not receive the PAINT IBA.
subfamilies:
- subfamily_id: PANTHER:PTHR46718:SF1
  label: ASPARTATE-SEMIALDEHYDE DEHYDROGENASE
  description: >-
    The only subfamily; it holds every fungal ASADH plus M. jannaschii and Leptospira ASADH
    and the two crenarchaeal malonyl-CoA reductases. The threonine module lists it
    alongside PTHR46278:SF4.
  representative_members:
  - id: UniProtKB:P13663
    label: Aspartate-semialdehyde dehydrogenase
    gene_symbol: HOM2
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/HOM2/HOM2-ai-review.yaml
  - id: UniProtKB:P78780
    label: Aspartate-semialdehyde dehydrogenase
    gene_symbol: hom2
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/hom2/hom2-ai-review.yaml
  - id: UniProtKB:Q5ALM0
    label: Aspartate-semialdehyde dehydrogenase
    gene_symbol: HOM2
    organism: Candida albicans
  diverged_from_family: false
term_assessments:
- assessed_term:
    id: GO:0004073
    label: aspartate-semialdehyde dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's activity for this family and a PAINT IBD at PTN002928538 (seeds S.
    cerevisiae HOM2, Candida, Aspergillus and Cryptococcus). The HOM2 gene review accepts the
    IBA; S. pombe hom2 is a stub. The malonyl-CoA reductases are excepted.
  member_exceptions:
  - member:
      id: UniProtKB:A4YEN2
      label: Malonyl CoA reductase (NADP)
      gene_symbol: Msed_0709
      organism: Metallosphaera sedula
    exception_reason: >-
      ASADH-family protein recruited as malonyl-CoA reductase in crenarchaeal carbon
      fixation; reviewed UniProt entry names it as such. No IBA received.
    supported_by:
    - reference_id: file:interpro/panther/PTHR46718/PTHR46718-entries.csv
      supporting_text: A4YEN2,Malonyl CoA reductase (NADP),protein,399549
  - member:
      id: UniProtKB:Q96YK1
      label: Malonyl-CoA reductase
      gene_symbol: mcr
      organism: Sulfurisphaera tokodaii
    exception_reason: Same recruitment as the Metallosphaera enzyme. No IBA received.
    supported_by:
    - reference_id: file:interpro/panther/PTHR46718/PTHR46718-entries.csv
      supporting_text: Q96YK1,Malonyl-CoA reductase,protein,273063
  supported_by:
  - reference_id: PMID:2570346
    supporting_text: In Saccharomyces cerevisiae the HOM2 gene encodes aspartic semi-aldehyde
      dehydrogenase (ASA DH).
  - reference_id: file:yeast/HOM2/HOM2-uniprot.txt
    supporting_text: 'FUNCTION: Catalyzes the NADPH-dependent formation of L-aspartate 4-'
- assessed_term:
    id: GO:0009090
    label: L-homoserine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at the same node and the module's trunk concept; ASADH performs the second
    step of homoserine synthesis. In fungi aspartate semialdehyde does not feed lysine
    synthesis, and PAINT correctly asserts no lysine term for this family. Malonyl-CoA
    reductases excepted.
  member_exceptions:
  - member:
      id: UniProtKB:A4YEN2
      label: Malonyl CoA reductase (NADP)
      gene_symbol: Msed_0709
      organism: Metallosphaera sedula
    exception_reason: Carbon-fixation enzyme, not part of homoserine synthesis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR46718/PTHR46718-entries.csv
      supporting_text: A4YEN2,Malonyl CoA reductase (NADP),protein,399549
  - member:
      id: UniProtKB:Q96YK1
      label: Malonyl-CoA reductase
      gene_symbol: mcr
      organism: Sulfurisphaera tokodaii
    exception_reason: Carbon-fixation enzyme, not part of homoserine synthesis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR46718/PTHR46718-entries.csv
      supporting_text: Q96YK1,Malonyl-CoA reductase,protein,273063
  supported_by:
  - reference_id: PMID:2570346
    supporting_text: In Saccharomyces cerevisiae the HOM2 gene encodes aspartic semi-aldehyde
      dehydrogenase (ASA DH).
