review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PANTHER family review
review_date: "2026-10-10"
notes: >-
  Written together with full gene reviews of the six model-organism members: human and
  mouse RUBCN/Rubcn and RUBCNL/Rubcnl, Drosophila Rubicon (Q9W3C9) and C. elegans RUB-1
  (Y56A3A.16, G2HK09). All node/term/seed/date tuples are verbatim from the cached
  PTHR45971-paint.tsv. PANTHER's family name (PHOX (PX) DOMAIN-CONTAINING PROTEIN) does not
  describe these members, which have no PX domain; it is kept verbatim as required. Two
  retracted papers on Rubicon in LC3-associated phagocytosis and lupus-like disease
  (PMID:26098576, PMID:27096368) were deliberately not used as evidence. Subfamilies SF4-SF6
  are not represented among the reviewed members and are not assessed. The domain
  comparison (RUN/PI3K-binding/RH) comes from the reproducible analysis in
  genes/worm/Y56A3A.16/Y56A3A.16-bioinformatics/. No residue_sites were curated: the
  RH-domain Rab7 interface is known from the human structure, but positions were not
  verified across the members in this pass.
