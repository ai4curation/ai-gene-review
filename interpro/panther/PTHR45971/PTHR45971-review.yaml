family_id: PANTHER:PTHR45971
family_name: PHOX (PX) DOMAIN-CONTAINING PROTEIN
preferred_name: Rubicon/Pacer family of Rubicon-homology (RH) domain regulators of class III PI3K and endolysosomal maturation
summary: >-
  Metazoan family of non-catalytic proteins defined by a C-terminal Rubicon homology (RH)
  domain, a cysteine-rich zinc-binding module that binds the small GTPase Rab7. In
  vertebrates it contains two paralogs with opposite effects on autophagy. Rubicon (RUBCN,
  subfamily SF3) has an N-terminal RUN domain and a central PI3K-binding region. It binds
  the UVRAG-containing class III PI3K complex (PI3KC3-C2), inhibits its lipid-kinase
  activity, and from late endosomes and lysosomes suppresses autophagosome maturation and
  endocytic degradation. Pacer (RUBCNL, SF2) lacks the RUN domain. It is anchored to
  autophagosomes through syntaxin 17, antagonizes Rubicon to stimulate Vps34, and recruits
  the PI3KC3 and HOPS complexes to promote autophagosome maturation and fusion with
  lysosomes. The single invertebrate members (subfamily SF1; Drosophila Rubicon and C.
  elegans RUB-1/Y56A3A.16) behave like Rubicon. Their knockdown increases autophagy and
  extends lifespan, and fly Rubicon also promotes LC3-associated phagocytosis in glia and
  in the fertilized egg. The worm protein is a divergent, RH-only member.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The two vertebrate subfamilies have opposite regulatory signs on the same process.
  Rubicon (SF3) inhibits PI3KC3-C2 and autophagosome maturation, while Pacer (SF2) promotes
  both. Pacer is described as a vertebrate-specific innovation. Activity terms
  (inhibitor versus enhancer of PI3K or maturation) are therefore safe only at the subfamily
  level. The shared RH domain and endolysosomal localization are the only plausibly
  family-wide properties.
