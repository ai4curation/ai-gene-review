term_assessments:
  - assessed_term:
      id: GO:1901981
      label: phosphatidylinositol phosphate binding
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Experimental support exists only for Pacer (SF2). The Rubicon lineage is PtdIns(3)P-bead
      negative and structurally lacks a canonical PI(3)P-binding site, so the term should be
      moved from the root to the Pacer node PTN002915558.
    applicable_subfamilies:
      - id: PANTHER:PTHR45971:SF2
        label: PROTEIN ASSOCIATED WITH UVRAG AS AUTOPHAGY ENHANCER
    supported_by:
      - reference_id: PMID:32632011
        supporting_text: Rubicon has not been reported to bind specifically to phospholipids.
  - assessed_term:
      id: GO:0141039
      label: phosphatidylinositol 3-kinase inhibitor activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Rubicon (SF3) inhibits Vps34 in the UVRAG-containing complex, while Pacer (SF2)
      stimulates it. The invertebrate SF1 members are Rubicon-like negative regulators of
      autophagy genetically, but their PI3K activity has not been assayed, so the fly review
      uses the direction-neutral parent.
    applicable_subfamilies:
      - id: PANTHER:PTHR45971:SF3
        label: RUN DOMAIN BECLIN-1-INTERACTING AND CYSTEINE-RICH DOMAIN-CONTAINING PROTEIN
    supported_by:
      - reference_id: PMID:28306502
        supporting_text: >-
          Mechanistically, Pacer antagonizes Rubicon to
          stimulate Vps34 kinase activity.
  - assessed_term:
      id: GO:0010507
      label: negative regulation of autophagy
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Shared by vertebrate Rubicon (SF3) and the invertebrate orthologs (SF1), where knockdown
      increases autophagy and extends lifespan. It is the opposite of Pacer (SF2), so it
      cannot be placed at the family root.
    applicable_subfamilies:
      - id: PANTHER:PTHR45971:SF3
        label: RUN DOMAIN BECLIN-1-INTERACTING AND CYSTEINE-RICH DOMAIN-CONTAINING PROTEIN
      - id: PANTHER:PTHR45971:SF1
        label: RUBICON, ISOFORM A
    supported_by:
      - reference_id: PMID:30783089
        supporting_text: >-
          Reduction of Rubicon extends lifespan in worm and female fly and ameliorates
          age-associated phenotype in worm, fly, and mouse tissues.
  - assessed_term:
      id: GO:0097352
      label: autophagosome maturation
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Positive involvement is Pacer-specific (SF2). Rubicon-lineage members act on the same
      process with the opposite sign, captured by negative regulation of autophagosome
      maturation.
    applicable_subfamilies:
      - id: PANTHER:PTHR45971:SF2
        label: PROTEIN ASSOCIATED WITH UVRAG AS AUTOPHAGY ENHANCER
    supported_by:
      - reference_id: PMID:28306502
        supporting_text: >-
          Pacer localizes to autophagic structures and positively regulates
          autophagosome maturation.
  - assessed_term:
      id: GO:0005770
      label: late endosome
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Rubicon (SF3) and fly Rubicon (SF1) localize to Rab7-positive late endosomes. Pacer
      sits on autophagosomes, and the worm protein's localization is unknown.
    applicable_subfamilies:
      - id: PANTHER:PTHR45971:SF3
        label: RUN DOMAIN BECLIN-1-INTERACTING AND CYSTEINE-RICH DOMAIN-CONTAINING PROTEIN
      - id: PANTHER:PTHR45971:SF1
        label: RUBICON, ISOFORM A
    supported_by:
      - reference_id: PMID:37248218
        supporting_text: >-
          Apparently, almost all Rubicon dots colocalized with Rab7-positive late
          endosomes/phagosomes in uninjured and injured wing nerve glia

