    description: >-
      Vertebrate Rubicon. RUN domain, PI3K-binding region and RH domain. A negative
      regulator of autophagosome maturation and endocytic trafficking that inhibits the
      UVRAG-containing PI3KC3 complex and binds Rab7-GTP through its RH domain.
    representative_members:
      - id: UniProtKB:Q92622
        label: Run domain Beclin-1-interacting and cysteine-rich domain-containing protein
        gene_symbol: RUBCN
        organism: Homo sapiens (Human)
        gene_review: genes/human/RUBCN/RUBCN-ai-review.yaml
      - id: UniProtKB:Q80U62
        label: Run domain Beclin-1-interacting and cysteine-rich domain-containing protein
        gene_symbol: Rubcn
        organism: Mus musculus (Mouse)
        gene_review: genes/mouse/Rubcn/Rubcn-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR45971:SF2
    label: PROTEIN ASSOCIATED WITH UVRAG AS AUTOPHAGY ENHANCER
    description: >-
      Vertebrate Pacer (RUBCNL). It lacks the RUN domain but keeps the PI3K-binding and RH
      regions. A positive regulator anchored to autophagosomes through syntaxin 17 that
      recruits PI3KC3 and HOPS to drive autophagosome maturation and fusion.
    representative_members:
      - id: UniProtKB:Q9H714
        label: Protein associated with UVRAG as autophagy enhancer
        gene_symbol: RUBCNL
        organism: Homo sapiens (Human)
        gene_review: genes/human/RUBCNL/RUBCNL-ai-review.yaml
      - id: UniProtKB:Q3TD16
        label: Protein associated with UVRAG as autophagy enhancer
        gene_symbol: Rubcnl
        organism: Mus musculus (Mouse)
        gene_review: genes/mouse/Rubcnl/Rubcnl-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Opposite regulatory sign to Rubicon. Pacer stimulates rather than inhibits Vps34
      activity and promotes autophagosome maturation. It is the only member with
      experimental phosphoinositide-binding data.
    supported_by:
      - reference_id: PMID:28306502
        supporting_text: >-
          Mechanistically, Pacer antagonizes Rubicon to
          stimulate Vps34 kinase activity.
  - subfamily_id: PANTHER:PTHR45971:SF1
    label: RUBICON, ISOFORM A
    description: >-
      The invertebrate orthologs: Drosophila Rubicon (RUN, PI3K-binding and RH regions,
      RUBCN-like by full-length alignment) and the divergent RH-only C. elegans RUB-1
      (Y56A3A.16). Both act like vertebrate Rubicon as negative regulators of autophagy.
    representative_members:
      - id: UniProtKB:Q9W3C9
        label: Rubicon, isoform A
        gene_symbol: Rubicon
        organism: Drosophila melanogaster (Fruit fly)
        gene_review: genes/DROME/Rubicon/Rubicon-ai-review.yaml
      - id: UniProtKB:G2HK09
        label: Rubicon Homology domain-containing protein
        gene_symbol: Y56A3A.16
        organism: Caenorhabditis elegans
        gene_review: genes/worm/Y56A3A.16/Y56A3A.16-ai-review.yaml
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN002915557
    asserted_term:
      id: GO:1901981
      label: phosphatidylinositol phosphate binding
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20190815"
    seeds:
      - id: UniProtKB:Q9H714
        label: Protein associated with UVRAG as autophagy enhancer
        organism: Homo sapiens (Human)
    assessment: TOO_DEEP
    assessment_reason: >-
      The only seed is vertebrate Pacer, from lipid-binding data in the discovery paper,
      and the binding region is not mapped. Rubicon-lineage members have no lipid-binding
      evidence. Rubicon-EGFP was not pulled down by PtdIns(3)P beads, and the Rubicon RH
      structure shows a FYVE-like zinc cluster without the basic residues needed for
      PI(3)P recognition. Pacer is described as a vertebrate-specific innovation, so lipid
      binding is best read as a Pacer-lineage property. Placing it at the family root makes
      Rubicon, fly Rubicon and worm RUB-1 inherit it without support. All four
      Rubicon-lineage reviews mark the IBA as over-annotated, and the Pacer reviews refine
      it to PI3P binding.
    supported_by:
      - reference_id: PMID:19270693
        supporting_text: >-
          When examined experimentally, unlike the control PtdIns(3)P-binding protein
          2×FYVE-EGFP, Rubicon-EGFP was not pulled down by PtdIns(3)P-conjugated sepharose
          beads (data not shown).
      - reference_id: PMID:32632011
        supporting_text: Rubicon has not been reported to bind specifically to phospholipids.
      - reference_id: PMID:30894088
        supporting_text: >-
          Recently, we identified a vertebrate-specific macroautophagy/autophagy regulator,
          RUBCNL/Pacer
  - node_id: PANTHER:PTN002915557
    asserted_term:
      id: GO:0043231
      label: intracellular membrane-bounded organelle
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260530"
    seeds:
      - id: FB:FBgn0030055
      - id: UniProtKB:Q92622
        label: Run domain Beclin-1-interacting and cysteine-rich domain-containing protein
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q9H714
        label: Protein associated with UVRAG as autophagy enhancer
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Every characterized member acts on endolysosomal or autophagic organelles: late
      endosomes and lysosomes for Rubicon, autophagosomes for Pacer, and late endosomes,
      phagosomes and multivesicular bodies for fly Rubicon. The term is true family-wide
      but very general.
    supported_by:
      - reference_id: PMID:37248218
        supporting_text: >-
          Apparently, almost all Rubicon dots colocalized with Rab7-positive late
          endosomes/phagosomes in uninjured and injured wing nerve glia
  - node_id: PANTHER:PTN002915566
    asserted_term:
      id: GO:1901097
      label: negative regulation of autophagosome maturation
    evidence: IBD
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190815"
    seeds:
      - id: UniProtKB:Q92622
        label: Run domain Beclin-1-interacting and cysteine-rich domain-containing protein
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Correct for the vertebrate Rubicon clade. The invertebrate SF1 members also act as
      negative regulators of autophagy by knockdown, so a deeper placement that excludes
      the Pacer clade could be considered. As placed it is sound and conservative.
    supported_by:
      - reference_id: PMID:30783089
        supporting_text: >-
          Reduction of Rubicon extends lifespan in worm and female fly and ameliorates
          age-associated phenotype in worm, fly, and mouse tissues.
