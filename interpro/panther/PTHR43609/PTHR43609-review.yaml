- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: CGD:CAL0000189008
  - id: SGD:S000000111
  assessment: SOUND
  assessment_reason: >-
    Acetyl-CoA hydrolysis is real in characterized fungal Ach1 enzymes but is a
    minor side activity. The reviewed S. cerevisiae, C. albicans, C. glabrata,
    S. pombe, Neurospora and Aspergillus recipients retain GO:0003986 as
    non-core while preferring acetate CoA-transferase as the primary function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0003986\tF\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111\ttaxon:\t20170228"
  - reference_id: file:genes/yeast/ACH1/ACH1-ai-review.yaml
    supporting_text: >-
      Ach1p has measurable acetyl-CoA hydrolase activity, and PAINT propagation
      from PTN000484586 is sound, but this hydrolytic reaction is minor relative
      to Ach1p's succinyl-CoA:acetate CoA-transferase activity.
- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0008775
    label: acetate CoA-transferase activity
  evidence: IBD
  paint_snapshot: '20220925'
  seeds:
  - id: SGD:S000000111
