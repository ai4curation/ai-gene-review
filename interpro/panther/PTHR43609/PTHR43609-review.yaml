  assessment: SOUND
  assessment_reason: >-
    The node carries the exact acetate-acceptor CoA-transferase activity
    characterized in S. cerevisiae Ach1 and A. nidulans CoaT. Every reviewed
    fungal recipient keeps this IBA or the matching InterPro2GO row as its core
    molecular function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0008775\tF\tIBD\tfalse\tSGD:S000000111|UniProtKB:Q5BD33\ttaxon:\t20220925"
  - reference_id: file:genes/EMENI/Q5BD33/Q5BD33-ai-review.yaml
    supporting_text: >-
      The same direct assay showed acetate-acceptor activity from multiple
      acyl-CoA donors, supporting the exact GO:0008775 term.
- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0006083
    label: acetate metabolic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: CGD:CAL0000189008
  - id: SGD:S000000111
  assessment: SOUND
  assessment_reason: >-
    Acetate metabolism is the correct broad biological process for fungal
    Ach1/CoaT enzymes because the core reaction transfers CoASH to acetate and
    produces acetyl-CoA. More specialized Aspergillus propionyl-CoA
    detoxification is a descendant branch-specific role, not a reason to move
    the ancestral acetate-metabolism call.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0006083\tP\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111\ttaxon:\t20170228"
  - reference_id: file:genes/yeast/ACH1/ACH1-ai-review.yaml
    supporting_text: The mutation, while not lethal, slows down acetate utilization.
