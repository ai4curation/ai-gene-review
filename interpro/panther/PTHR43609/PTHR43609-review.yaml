family_id: PANTHER:PTHR43609
family_name: ACETYL-COA HYDROLASE
preferred_name: Ach1/CoaT acyl-CoA:carboxylate CoA-transferases
summary: >-
  PTHR43609 contains acyl-CoA:carboxylate CoA-transferases typified in fungi by
  mitochondrial Ach1/CoaT enzymes. Fungal members transfer CoASH from
  succinyl-CoA, propionyl-CoA or related acyl-CoA donors to acetate, coupling
  acetate and short-chain acyl-CoA metabolism while avoiding wasteful bulk
  acetyl-CoA hydrolysis. Historical acetyl-CoA hydrolase annotations describe a
  measurable but minor side activity in characterized fungal enzymes.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed fungal members, bacterial AarC/ScpC enzymes, and Dictyostelium
  ach1 all sit in PTHR43609:SF1 and share the same CoA-transferase fold; the
  acceptor carboxylate and acyl-CoA donor can vary, but the fungal branch
  consistently supports acetate-acceptor CoASH transfer as the primary activity.
