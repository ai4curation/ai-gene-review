- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: CGD:CAL0000189008
  - id: SGD:S000000111
  assessment: SOUND
  assessment_reason: >-
    Acetyl-CoA hydrolysis is real in characterized fungal Ach1 enzymes but is a
    minor side activity. The reviewed S. cerevisiae, C. albicans, C. glabrata,
    S. pombe, Neurospora and Aspergillus recipients retain GO:0003986 as
    non-core while preferring acetate CoA-transferase as the primary function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0003986\tF\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111\ttaxon:\t20170228"
  - reference_id: PMID:19298859
    supporting_text: >-
      Ach1p showed highest specific activity for the CoASH transfer from
      succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0008775
    label: acetate CoA-transferase activity
  evidence: IBD
  paint_snapshot: '20220925'
  seeds:
  - id: SGD:S000000111
  - id: UniProtKB:Q5BD33
  assessment: SOUND
  assessment_reason: >-
    The node carries the exact acetate-acceptor CoA-transferase activity
    characterized in S. cerevisiae Ach1 and A. nidulans CoaT. Every reviewed
    fungal recipient keeps this IBA or the matching InterPro2GO row as its core
    molecular function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0008775\tF\tIBD\tfalse\tSGD:S000000111|UniProtKB:Q5BD33\ttaxon:\t20220925"
  - reference_id: PMID:19298859
    supporting_text: >-
      Complementation of an ach1 mutant with the coaT gene reversed the growth
      defect on acetate confirming the in vivo function of Ach1p as a
      CoA-transferase.
- node_id: PANTHER:PTN000484586
  asserted_term:
    id: GO:0006083
    label: acetate metabolic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: CGD:CAL0000189008
  - id: SGD:S000000111
  assessment: SOUND
  assessment_reason: >-
    Acetate metabolism is the correct broad biological process for fungal
    Ach1/CoaT enzymes because the core reaction transfers CoASH to acetate and
    produces acetyl-CoA. More specialized Aspergillus propionyl-CoA
    detoxification is a descendant branch-specific role, not a reason to move
    the ancestral acetate-metabolism call.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484586\tGO:0006083\tP\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111\ttaxon:\t20170228"
  - reference_id: PMID:19298859
    supporting_text: >-
      Our results imply that Ach1p is involved in mitochondrial acetate
      detoxification by a CoASH transfer from succinyl-CoA to acetate.
