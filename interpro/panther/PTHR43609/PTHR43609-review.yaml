notes: >-
  The PANTHER family name and many fungal UniProt records preserve the
  historical "acetyl-CoA hydrolase" name, but fungal Ach1/CoaT enzymes are
  primarily succinyl-CoA:acetate CoA-transferases with only minor acetyl-CoA
  hydrolase activity. The mitochondrial PAINT IBD is sound for the Ascomycota
  node, but it has no term_assessment here because TermScopeEnum has no
  taxon-restricted value for a eukaryote-only cellular-component assessment
  inside a broader bacterial/eukaryotic family.
