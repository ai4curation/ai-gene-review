  supported_by:
  - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
    supporting_text: "PTHR43609\tPTN000484602\tGO:0005739\tC\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111|UniProtKB:Q5BD33\ttaxon:4890\t20260130"
  - reference_id: PMID:12606555
    supporting_text: >-
      By subcellular fractionation, most of the Ach1p in yeast was distributed
