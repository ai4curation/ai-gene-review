- assessed_term:
    id: GO:0004332
    label: fructose-bisphosphate aldolase activity
  scope: UNRESOLVED
  scope_reason: >-
    Fructose-bisphosphate aldolase is the activity of the Pseudomonas and Bacillus members
    (the KT2440 member carries the class II type B FBA-specific NCBIfam model and its gene
    review accepts the activity), but SF0 also holds tagatose-bisphosphate and other
    sugar-phosphate aldolases. Because PANTHER does not separate these branches, the term
    cannot be scoped by subfamily; it should be inferred from FBA-specific models
    (TIGR01521, TIGR00167) rather than from PTHR30304 membership.
  supported_by:
