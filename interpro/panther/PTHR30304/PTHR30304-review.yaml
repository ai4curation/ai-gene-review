family_id: PANTHER:PTHR30304
family_name: D-TAGATOSE-1,6-BISPHOSPHATE ALDOLASE
preferred_name: Class II (zinc-dependent) ketose-bisphosphate aldolase family
summary: >-
  PTHR30304 is a branch of the class II, zinc-dependent ketose-1,6-bisphosphate aldolases
  (Pfam PF01116). Reviewed members are E. coli tagatose-1,6-bisphosphate aldolase catalytic
  subunits KbaY and GatY, the class II type B fructose-bisphosphate aldolases of
  Pseudomonas (P. aeruginosa Fba) and Bacillus subtilis (FbaA), and two aldolases of other
  sugar-phosphate pathways (B. subtilis IolJ of myo-inositol catabolism and E. coli YdjI).
  All share the Zn(2+)-dependent aldol cleavage of a ketose phosphate to dihydroxyacetone
  phosphate plus an aldose phosphate; the ketose stereochemistry and pathway differ by
  branch. In Pseudomonas the family member Fba is the fructose-bisphosphate aldolase that
  operates in the gluconeogenic direction and in the EDEMP cycle.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  111 of the 112 reviewed members fall in PTHR30304:SF0, which mixes tagatose-bisphosphate
  aldolases (most entries, from E. coli strains), fructose-bisphosphate aldolases and other
  sugar-phosphate aldolases. PANTHER does not separate these by subfamily, so substrate is
  not predictable from the subfamily assignment. One reviewed member is assigned to
  PTHR30304:SF4, a subfamily PANTHER labels as a fungal transcription factor.
