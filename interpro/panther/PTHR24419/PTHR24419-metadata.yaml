  name:
    name: 'Ser/Thr-Protein Kinases: Cell Cycle & Immune Signaling'
    short: SerThr-Kinase_CellCycle_ImmSig
  description:
  - text: The protein family encompasses a range of serine/threonine-protein kinases
      with diverse functions in cell cycle regulation and immune response signaling.
      Members of the family are involved in phosphorylating histone H3 at various
      threonine residues during mitosis, which is crucial for chromosome organization,
      chromatid cohesion, and normal cell cycle progression. Some kinases within the
      family also play roles in gene regulation during interphase by associating with
      the cohesion complex and influencing chromatin organization. Additionally, certain
      kinases are implicated in immune signaling pathways, such as the IL-1 receptor-associated
      kinases, which participate in intracellular signaling cascades following cytokine
      engagement, contributing to transcriptional regulation. The family includes
      both catalytically active and inactive members, with some predicted to be inactive
      yet demonstrating weak kinase activity. The family also contains uncharacterized
      proteins, which suggests potential undiscovered functions.
