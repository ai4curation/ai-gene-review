term_assessments:
- assessed_term:
    id: GO:0004672
    label: protein kinase activity
  scope: UNRESOLVED
  scope_reason: Canonical kinase activity is directly established for IRAK1/4 but cannot be granted to
    the whole IRAK family. IRAK3 has a noncanonical active-site configuration and negligible autophosphorylation
    in the original report; its role in phosphorylation-dependent signaling does not establish intrinsic
    phosphate transfer. Horse IRAK3 retains the human CGS/DFA configuration. This rejects an unqualified
    catalytic default without claiming that every alternative reaction has been experimentally excluded.
  supported_by:
  - reference_id: PMID:33238146
    supporting_text: 'In contrast to the

      active kinases IRAK1 and IRAK4, IRAK2 and IRAK3 are pseudokinases lacking

      catalytic activity and their functions are poorly understood.'
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR24419-evidence.md
    supporting_text: Putative inactive protein kinase which regulates signaling downstream of immune receptors
      including IL1R and Toll-like receptors (PubMed:10383454, PubMed:29686383). Inhibits dissociation
      of IRAK1 and IRAK4 from the Toll-like receptor signaling complex by either inhibiting the phosphorylation
      of IRAK1 and IRAK4 or stabilizing the receptor complex (By similarity). Upon IL33-induced lung inflammation,
      positively regulates expression of IL6, CSF3, CXCL2 and CCL5 mRNAs in dendritic cells (PubMed:29686383)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR24419-evidence.md
    supporting_text: Ser-293 is present instead of the conserved Asp which is expected to be an active
      site residue. Low level autophosphorylation activity has been reported in PubMed:10383454, while
      other authors describe this as an inactive kinase
  - reference_id: PMID:10383454
    supporting_text: "Although IRAK-M and IRAK-2 exhibit only a negligible \nautophosphorylation activity,\
      \ they can reconstitute the IL-1 response in a 293 \nmutant cell line lacking IRAK."
  - reference_id: PMID:33238146
    supporting_text: the position of S293 is frequently occupied by S or N residues in other vertebrates.
