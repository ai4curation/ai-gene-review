notes: Reproducible alignment maps human CGS291–293 to horse CGS249–251 and human DFA311–313 to horse
  DFA269–271. These are frozen current UniProt sequences; equivalence to the original prediction-time
  sequence is not asserted. The horse N terminus is shorter near the death domain, so receptor-complex
  assembly requires its own evidence. The IRAK3–IRAK4 inhibitory hetero-oligomer in the structural paper
  is an explicitly proposed model, not a demonstrated complex, and the observed closed kinase-like conformation
  does not prove catalytic activity.
