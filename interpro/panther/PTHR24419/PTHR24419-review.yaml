family_id: PANTHER:PTHR24419
family_name: INTERLEUKIN-1 RECEPTOR-ASSOCIATED KINASE
summary: This kinase-related family contains signaling proteins with differing catalytic competence and
  regulatory roles. The IRAK3 branch regulates signaling downstream of IL-1 and Toll-like receptors and
  has a noncanonical kinase active-site configuration.
functional_coherence: HETEROGENEOUS
coherence_reason: The original IRAK-M paper reports negligible autophosphorylation while retaining signaling
  complementation, and the later primary structure documents a conserved noncanonical CGS catalytic loop
  and DFA Mg-binding loop. The horse sequence preserves those motifs at 249–251 and 269–271 respectively.
  This supports a pseudokinase regulatory architecture while leaving possible alternative chemistry distinct
  from conventional IRAK1/4 kinase activity.
subfamilies:
