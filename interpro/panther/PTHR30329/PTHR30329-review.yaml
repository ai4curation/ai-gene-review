term_assessments:
- assessed_term:
    id: GO:0120101
    label: bacterial-type flagellum stator complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Stator membership is the role of the MotB-like members the chemotaxis module uses for
    its MotB and MotD stator subunits. SF18 (enteric MotB) and SF20 (Pseudomonas MotD) are
    stator subfamilies; SF21 is mixed and holds the KT2440 and P. aeruginosa MotB anchors
    alongside OmpA, Pal and OprF, so the term is safe there only for the MotB/PomB/LafU
    members.
  applicable_subfamilies:
  - id: PANTHER:PTHR30329:SF18
    label: MOTILITY PROTEIN B
  - id: PANTHER:PTHR30329:SF20
    label: EXPORTED PROTEIN
  - id: PANTHER:PTHR30329:SF21
    label: LIPOPROTEIN YIAD-RELATED
  supported_by:
  - reference_id: PMID:36409076
    supporting_text: the motor torque for flagellar rotation is generated by the two stators MotAB and MotCD.
