family_id: PANTHER:PTHR30329
family_name: STATOR ELEMENT OF FLAGELLAR MOTOR COMPLEX
preferred_name: OmpA-like peptidoglycan-binding domain family (MotB stators, OmpA, Pal)
summary: >-
  Members share a C-terminal OmpA-like peptidoglycan-binding domain. The family therefore
  joins two functionally distinct groups. Flagellar stator anchor subunits (E. coli and
  Salmonella MotB, P. aeruginosa and P. putida MotB, Vibrio and Bradyrhizobium PomB, lateral
  flagellar LafU, and the second Pseudomonas stator anchor MotD) have one transmembrane
  helix carrying the ion-binding aspartate and anchor the stator to the peptidoglycan. Outer
  membrane proteins and lipoproteins (OmpA, Pal, OprF, YiaD, Omp38, ArfA, Zorya ZorB, the
  sodium-motor accessory MotY) use the same domain for cell-envelope or defence functions
  unrelated to torque generation.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only the MotB-like members (SF18, the MotB/PomB/LafU members of SF21, SF16 YtxE-type,
  and the MotD-type SF20) are stator subunits. SF21 also holds OmpA, Pal, OprF and other
  outer-membrane proteins, and SF17 holds YfiB lipoproteins, so neither stator nor outer-
  membrane terms are family-wide.
