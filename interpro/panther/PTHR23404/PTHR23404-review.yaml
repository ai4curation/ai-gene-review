notes: The module molybdenum_cofactor_biosynthesis grounds the MoaE catalytic units of molybdopterin
  synthase on SF2. Its earlier parent-family grounding was narrowed because the parent also holds the
  MBIP subfamily. The frozen entries file records no subfamily for any member, so subfamily placement
  was read from the PANTHER 19 tree (tree check generated 2026-11-10) and the PANTHER 19 E. coli and
  human genome classifications.
