family_id: PANTHER:PTHR23404
family_name: MOLYBDOPTERIN SYNTHASE RELATED
preferred_name: MoaE molybdopterin synthase catalytic subunit family
summary: PTHR23404 contains MoaE, the large catalytic subunit of molybdopterin synthase, and its eukaryotic
  orthologs (MOCS2B). Two MoaE subunits pair with two thiocarboxylated MoaD subunits; each MoaD C terminus
  inserts into a MoaE subunit to form the active site, where the two dithiolene sulfurs are transferred
  to cyclic pyranopterin monophosphate to make molybdopterin. The family also contains MBIP (MAP3K12-binding
  inhibitory protein 1), a MoaE-related metazoan protein in subfamily SF3 that is not a molybdopterin
  synthase subunit.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Of the 83 frozen entries, all but two are named molybdopterin synthase catalytic subunit
  or a close variant; the exceptions are the two MBIP entries. In the PANTHER 19 tree, 135 of 163 leaves
  are in SF2 (molybdopterin synthase catalytic subunit) and 25 are in SF3 (MBIP). The only PAINT row
  is a root cytosol assertion.
