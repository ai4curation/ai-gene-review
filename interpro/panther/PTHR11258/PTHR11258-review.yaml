family_id: PANTHER:PTHR11258
family_name: 2-5 OLIGOADENYLATE SYNTHETASE
preferred_name: 2'-5'-oligoadenylate synthetase and OAS-like family
summary: >-
  PTHR11258 contains the vertebrate OAS antiviral sensors. Human OAS1, OAS2 and
  OAS3 are dsRNA-activated 2'-5'-oligoadenylate synthetases that polymerize ATP
  into 2-5A second messengers for RNASEL activation, while human OASL has lost
  that catalytic function and instead binds dsRNA to enhance RIG-I/DDX58
  signaling through its C-terminal ubiquitin-like domains.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  dsRNA binding is coherent across the human OAS subfamilies and the PTHR11258
  root. 2-5A synthetase activity is coherent for OAS1, OAS2 and OAS3, but PAINT
  correctly blocks it from the mammalian OASL clade at PTN000135978. The PAINT
  membrane and nucleoplasm rows are less coherent: membrane is supported by
  OAS2 and OAS1 p46 but not by OAS3 or OASL, and nucleoplasm is supported by
  OAS1/OAS3 but not by OAS2 or OASL.
