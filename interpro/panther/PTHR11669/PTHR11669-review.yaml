family_id: PANTHER:PTHR11669
family_name: REPLICATION FACTOR C / DNA POLYMERASE III GAMMA-TAU SUBUNIT
summary: Clamp-loader-related ATPases assemble sliding clamps on nucleic acids to support processive DNA
  synthesis and repair. Eukaryotic RFC complexes combine several small subunits with alternative large
  subunits; related bacterial clamp-loader components and plant Stichel proteins broaden the family beyond
  one canonical replication complex.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory combines RFC small subunits with bacterial gamma/tau and delta-prime clamp-loader
  components; the broader classification also includes plant Stichel. Pombe rfc3 maps to the official
  RFC5 subfamily, so symbol numbers do not identify orthologous subunits. Clamp loading is coordinated
  by an assembled complex, and ATP binding, ATP hydrolysis and autonomous clamp loading cannot be assigned
  identically to every component.
reference_protein: &id001
  id: UniProtKB:O14003
  label: Replication factor C subunit 3
  gene_symbol: rfc3
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  gene_review: genes/SCHPO/rfc3/rfc3-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR11669:SF9
  label: REPLICATION FACTOR C SUBUNIT 5
  description: The verified pombe rfc3 protein falls in the subfamily officially named RFC subunit 5,
    illustrating why symbol numbering and official subfamily names must not be mechanically equated. Complex
    participation is well supported, but the ATPase reaction is coordinated across interfaces and not
    established identically for every subunit or divergent Stichel-related protein.
  representative_members:
  - *id001
term_assessments:
- assessed_term:
    id: GO:0003689
    label: DNA clamp loader activity
  scope: UNRESOLVED
  scope_reason: RFC clamp loading is a complex activity. A gene-level contributes_to interpretation is
    appropriate for core small subunits; family-wide autonomous clamp loading would overstate both mechanism
    and scope.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: The elongation of primed DNA templates by DNA polymerase delta and epsilon requires
      the action of the accessory proteins PCNA and activator 1.
