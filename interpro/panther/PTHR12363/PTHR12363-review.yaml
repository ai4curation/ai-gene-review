family_id: PANTHER:PTHR12363
family_name: TRANSPORTIN 3 AND IMPORTIN 13
summary: Importin-beta-like receptors bind selected cargoes and mediate nucleocytoplasmic transport. This
  family includes importin-13 and transportin-3/Mtr10-related branches, with different cargo preferences
  and potentially different transport directions for particular substrates. Ran-dependent cargo exchange
  couples transport to the nuclear compartment.
functional_coherence: HETEROGENEOUS
coherence_reason: Importin-13 is a bidirectional Ran-dependent transport receptor whose import and export
  cargoes differ (PMID:11447110); its MAGO-Y14 import complex has a defined structural recognition mechanism
  (PMID:20122403). Related transport receptors recognize different cargo surfaces. Bidirectional nuclear
  transport is not synonymous with recognition of a canonical nuclear-export-signal peptide, and Ran supplies
  the GTPase cycle rather than an intrinsic receptor ATPase. The distribution of GO:0005049 across this
  family remains unresolved despite positive evidence for transport by characterized members.
