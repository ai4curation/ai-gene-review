family_id: PANTHER:PTHR24351
family_name: RIBOSOMAL PROTEIN S6 KINASE
preferred_name: AGC-group protein serine/threonine kinases (S6K/RSK/MSK/Akt/SGK/Sch9 clade)
summary: >-
  PTHR24351 is a large clade of AGC-group protein serine/threonine kinases named
  after the ribosomal protein S6 kinases but spanning much more than S6K. Its
  members include the p70/p85 S6 kinases (S6K1/2), the p90 ribosomal S6 kinases
  (RSK1-4), the mitogen- and stress-activated kinases (MSK1/2), the Akt/PKB kinases,
  SGK kinases, and fungal/protist relatives such as budding-yeast Sch9 and fission-
  yeast psk1. All are ATP-dependent protein serine/threonine kinases that carry the
  canonical bilobal protein-kinase fold followed by an AGC-kinase C-terminal
  extension, and are activated downstream of growth-factor and nutrient signalling
  (PI3K/PDK1/mTOR and RAS/ERK inputs). They phosphorylate serine/threonine residues
  on cytoplasmic and nuclear substrates to control translation, cell growth,
  survival, and transcription. The catalytic machinery (glycine-rich loop, the VAIK
  beta-3 lysine that positions ATP, the HRD catalytic aspartate, and the DFG
  magnesium-binding aspartate) is conserved across the family; what varies between
  subfamilies is upstream activation, substrate specificity, and downstream pathway
  role, not the core kinase chemistry.

functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is an active protein serine/threonine kinase, so the
  molecular-function term GO:0004674 and a cytoplasmic (frequently also nuclear)
  site of action are safe essentially family-wide. The family is nonetheless a lump
  of functionally distinct AGC subfamilies -- S6K, RSK, MSK, Akt/PKB, SGK, and the
  fungal Sch9/psk1 branch -- with different upstream activators, substrates, and
  pathway roles. Substrate-specific and biological-process terms (e.g. insulin
  signalling, apoptosis regulation, specific transcription regulation) are therefore
  NOT safe at family level and must be scoped to the subfamily or node that carries
  the experimental evidence.

