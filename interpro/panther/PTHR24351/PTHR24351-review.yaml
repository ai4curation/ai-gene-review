  scope: UNRESOLVED
  scope_reason: The Xenopus member has PKC-delta-related kinase architecture, making serine/threonine
    phosphotransfer a plausible core reaction. PKC, AKT, SGK, PKN and S6-kinase branches differ in activators
    and regulatory domains; these differences do not by themselves refute the broad catalytic reaction.
    The available family-wide evidence does not inventory catalytic losses or truncated domains, so a
    universal grant remains unestablished; S6 substrate specificity is not inferred.
