      - {id: dictyBase:DDB_G0290157}
    assessment: SOUND
    assessment_reason: >-
      Protein serine/threonine kinase activity is the defining, conserved property
      of the entire AGC/S6-kinase clade. The node is seeded by a broad set of
      experimentally characterized active kinases spanning human S6K/RSK/MSK,
      rodent, fly, fission and budding yeast, Dictyostelium, Plasmodium and plant
      members, so placement of GO:0004674 at this family node is correct and every
      descendant that retains the catalytic machinery inherits it legitimately. The
      target A0A8J1IYX6 retains the complete machinery (VAIK beta-3 lysine, HRD
      catalytic aspartate, DFG magnesium-binding aspartate -- see the
      catalytic_core residue site), so it sits inside the clade the function was
      placed for. No pseudokinase is present among the seeds, so there is no branch
      that needs pruning.

  - node_id: PANTHER:PTN008614470
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20260828"
    seeds:
      - {id: PomBase:SPCC24B10.07}
      - {id: UniProtKB:Q582V7, label: Ser/Thr kinase (putative), organism: Trypanosoma brucei}
      - {id: UniProtKB:Q8I4W3, label: RAC-beta kinase (Akt-like), organism: Plasmodium falciparum}
    assessment: SOUND
    assessment_reason: >-
      Cytoplasmic activity is the default and best-supported compartment for the
      soluble AGC kinases of this family, and the node is seeded by experimentally
      localized fungal and protist family members. The target has no signal peptide,
      transmembrane segment, or organellar targeting feature (UniProt feature table),
      consistent with a soluble cytoplasmic kinase, and no gene-specific evidence
      argues against it. Placement is defensible; localization is inherently less
      conserved than catalytic function across a large kinase family, so confidence
      here is lower than for the GO:0004674 node, but nothing contradicts the
      is_active_in cytoplasm assertion for the target's sub-clade.

  - node_id: PANTHER:PTN008614470
    asserted_term:
      id: GO:0005634
      label: nucleus
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20260828"
    seeds:
      - {id: PomBase:SPCC24B10.07}
      - {id: SGD:S000004710}
      - {id: UniProtKB:Q582V7, label: Ser/Thr kinase (putative), organism: Trypanosoma brucei}
    assessment: UNRESOLVED
    assessment_reason: >-
      Nuclear activity is a real property of several members of this family -- the
      RSK and MSK subfamilies shuttle to the nucleus to phosphorylate transcription-
      associated substrates (histone H3, CREB) -- and the node is seeded by
      nuclear-localized fungal kinases, so the is_active_in nucleus assertion is not
      implausible for the target's sub-clade. However, nuclear localization is the
      least conserved of the three propagated properties: many S6-kinase-family
      members are cytoplasm-only, and there is no gene-specific evidence establishing
      that this uncharacterized Xenopus protein enters the nucleus. The placement is
      retained on the target for lack of counter-evidence rather than positively
      confirmed, hence UNRESOLVED rather than SOUND. It is not a REMOVE candidate:
      nucleus and cytoplasm co-occur in the shuttling members and no contradicting
      compartment is documented for the target.

residue_sites:
  - site_id: catalytic_core
    label: Protein-kinase catalytic core (VAIK lysine + HRD aspartate)
    description: >-
      The two positions that the UniProt feature table pins on the reference S6
      kinase and that a protein serine/threonine kinase cannot do without: the
      invariant beta-3 lysine of the VAIK motif, which is annotated as an
      ATP-binding residue and positions the ATP alpha/beta phosphates, and the HRD
      catalytic aspartate, annotated as the "Proton acceptor" active site, which
      deprotonates the substrate hydroxyl during phosphoryl transfer. The reference
      protein S6K1 also carries the DFG magnesium-binding aspartate (D236) at the
      start of the activation loop; that position is not an explicit UniProt feature
      on S6K1 and so is not listed here as a machine-checked residue, but the target
      retains it too (D253 in the target's own DFG motif, ICDFG at 251), recorded in
      the notes. Loss of the VAIK lysine or the HRD aspartate abolishes catalysis,
      so an intact pair is a positive signal that the kinase-activity IBA is safe on
      a given member; their retention on A0A8J1IYX6 is why GO:0004674 is accepted
      rather than questioned for this uncharacterized member.
    anchor:
      id: UniProtKB:P23443
      label: Ribosomal protein S6 kinase beta-1
      gene_symbol: RPS6KB1
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 123, expected: [K], role: ATP-positioning beta-3 lysine (VAIK motif)}
      - {position: 218, expected: [D], role: catalytic aspartate / proton acceptor (HRD motif)}
    required_for:
      - term:
          id: GO:0004674
          label: protein serine/threonine kinase activity
        strength: CONTRIBUTES
        rationale: >-
          Phosphoryl transfer by a protein kinase runs through the VAIK beta-3
          lysine, which orients the ATP phosphates for in-line attack, and the HRD
          catalytic aspartate, which acts as the catalytic base deprotonating the
          substrate serine/threonine hydroxyl. Substitution of either residue is the
          canonical kinase-dead lesion (K-to-R/A, D-to-A/N) and abolishes catalysis.
          The dependency is mechanistically REQUIRED in the strict sense, but it is
          recorded here as CONTRIBUTES rather than REQUIRED because this family has
          no documented pseudokinase to serve as a negative control: the site
          documents catalytic RETENTION as a positive signal that the kinase IBA is
          safe on a given member, not a catalytic/non-catalytic discriminator. It
          therefore does not license a validator to contradict a gene review, which
          is appropriate given no loss-of-function member has been demonstrated.
    positive_controls:
      - id: UniProtKB:P23443
        label: S6K1 (RPS6KB1)
        organism: Homo sapiens
        control_position: 123
        control_residue: K
      - id: UniProtKB:Q15418
        label: RSK1 (RPS6KA1)
        organism: Homo sapiens
        control_position: 187
        control_residue: D

term_assessments:
  - assessed_term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized member of PTHR24351 is an active protein serine/threonine
      kinase, and the catalytic core (catalytic_core site) is conserved across the
      family. No pseudokinase is documented among the family or among the seeds of
      node PTN008614469, so this molecular-function term is safe for all members that
      retain the catalytic residues -- which the target does.

  - assessed_term:
      id: GO:0005737
      label: cytoplasm
    scope: FAMILY_WIDE
    scope_reason: >-
      The AGC kinases of this family are soluble proteins that act in the cytoplasm;
      cytoplasmic activity is the default, best-supported compartment and no member
      is excluded from it. Safe family-wide as a broad localization term.

  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: UNRESOLVED
    scope_reason: >-
      Nuclear activity is genuine for the RSK/MSK shuttling subfamilies but is not a
      property of all members -- many S6-kinase-family kinases are cytoplasm-only.
      The term is asserted at node PTN008614470 for the target's sub-clade and is
      retained there for lack of counter-evidence, but it cannot be scoped
      family-wide, and the specific subfamilies it is safe for cannot be enumerated
      from the evidence available here without asserting PANTHER subfamily
      accessions that are not established for the target.

review_status: DRAFT
reviewed_by: AI-assisted IBA/residue analysis
review_date: "2026-08-31"
notes: >-
  Scoped family review created to back the second IBA pass on
  genes/XENTR/A0A8J1IYX6 (LOC101732819), an uncharacterized S6-kinase-family AGC
  kinase misnamed "Protein kinase C delta type" by RefSeq. Only the PAINT nodes
  backing that gene's three IBAs are assessed: PTN008614469 (GO:0004674) and
  PTN008614470 (GO:0005737, GO:0005634). Seeds are copied from PTHR24351-paint.tsv
  (rows for these nodes); paint_snapshot values are the date column of those rows
  (20241120 for the MF node, 20260828 for the localization node).

  family_name matches interpro/panther/panther.obo verbatim ("RIBOSOMAL PROTEIN S6
  KINASE"); preferred_name records the more accurate broad-clade description. The
  target carries only a family-level PANTHER cross-reference (DR PANTHER; PTHR24351;
  no :SF subfamily) in its UniProt record, so no subfamily placement is asserted for
  it -- subfamilies are deliberately omitted rather than guessed.

  Catalytic-core residue positions were verified first-hand against live UniProt
  records and by motif-anchored alignment. Reference S6K1 (P23443, sequence version
  2): VAIK beta-3 lysine K123 (UniProt BINDING 123, ATP), HRD catalytic aspartate
  D218 (UniProt ACT_SITE 218, "Proton acceptor"), DFG aspartate D236 (canonical DFG
  motif, not an explicit S6K1 feature). Target A0A8J1IYX6 (sequence version 1)
  retains all three: VAIK K142 (its own UniProt BINDING 142, ATP; motif VAIKIV at
  139), HRD catalytic aspartate D235 (motif IHRDLKPDN at 232), DFG aspartate D253
  (motif ICDFG at 251). Positive controls S6K1 K123 and RSK1 (Q15418) N-terminal
  kinase-domain HRD aspartate D187 (ACT_SITE 187) were both confirmed against their
  UniProt records. No negative controls are recorded because no pseudokinase is
  present among the family seeds -- this site documents catalytic RETENTION
  supporting the kinase IBA, not a catalytic/non-catalytic discriminator, which is a
  legitimate difference from the PGRP zn_triad and SEPHS nucleophile sites. For that
  reason the required_for strength is CONTRIBUTES rather than REQUIRED: a REQUIRED
  site is required by the validator to carry a negative control showing what loss
  looks like, and inventing a pseudokinase for this family would be exactly the kind
  of fabricated evidence the schema exists to prevent.

  Do-not-run note: interpro/panther/panther-members.tsv was not refreshed (shared
  file; orchestrator runs it once). If a missing-member warning fires for P23443 or
  Q15418 it is expected and acceptable.
