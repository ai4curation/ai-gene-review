      - {id: UniProtKB:O75582, label: MSK1 (RPS6KA5), organism: Homo sapiens}
      - {id: UniProtKB:O75676, label: MSK2 (RPS6KA4), organism: Homo sapiens}
      - {id: UniProtKB:P23443, label: S6K1 (RPS6KB1), organism: Homo sapiens}
      - {id: UniProtKB:Q15418, label: RSK1 (RPS6KA1), organism: Homo sapiens}
      - {id: UniProtKB:Q8I4W3, label: RAC-beta kinase (Akt-like), organism: Plasmodium falciparum}
