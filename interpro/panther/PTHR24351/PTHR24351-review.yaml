family_id: PANTHER:PTHR24351
family_name: RIBOSOMAL PROTEIN S6 KINASE
preferred_name: AGC-related protein kinases
summary: This family includes PKC, PKN, SGK, AKT and ribosomal-S6-kinase-related proteins. Regulatory
  domains, activating inputs and physiological substrates diverge markedly despite shared kinase chemistry.
functional_coherence: HETEROGENEOUS
coherence_reason: The Xenopus target's kinase classification supports analysis of intrinsic phosphotransfer,
  but S6 phosphorylation is not a universal property of the family. Calcium, diacylglycerol, cyclic-nucleotide
  and growth-factor regulation each require the corresponding regulatory architecture and paralog placement.
