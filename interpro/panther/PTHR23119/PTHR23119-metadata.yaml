  name:
    name: Synaptic Scaffolding LAP/MAGUK Families
    short: Synaptic_Scaffolding_LAP-MAGUK
  description:
  - text: The LAP (LRR and PDZ) and MAGUK protein families are involved in synaptic
      function and cellular signaling. Members of these families are essential for
      synaptic plasticity, synaptogenesis, and maintaining synaptic architecture.
      They serve as scaffolding proteins, clustering crucial synaptic proteins at
      postsynaptic densities and regulating the surface expression of receptors like
      NMDA and AMPA. Some family members are involved in cell polarity, proliferation,
      migration, and apoptosis, playing roles in epithelial and neuronal morphogenesis,
      T-cell polarization, and pain perception. They may also influence signal transduction
      pathways, including Wnt and Rho, and modulate the trafficking of channels and
      receptors within cells.
