notes: >-
  Written alongside the finishing pass on genes/human/PEX10/PEX10-ai-review.yaml. All
  node/term/seed/date tuples are verbatim from the cached PTHR23350-paint.tsv; member
  composition from the fetched PTHR23350-entries.csv slice (17 proteins of 5208; a
  third subfamily recorded in InterPro metadata is not present in the slice and is
  unassessed). MOD seed identifiers (AGI_LocusCode:AT2G26350, RGD:1591776,
  SGD:S000002673, FB:FBgn0035233) are copied verbatim without labels, since their gene
  mappings were not independently verified in this pass. Human PEX10 is not strictly
  IBA-free: it receives the two Eukaryota-node IBAs assessed above, both SOUND and both
  from recent (2025-2026) PAINT rows. What is missing is any molecular-function or
  complex IBD: the family's E3 ligase activity, ligase-complex membership, and the
  receptor-recycling sub-process are all experimentally grounded (human IDA plus fungal
  cryo-EM covering both subfamilies) and would be sound family-wide assertions at the
  same node - recorded as term_assessments for a future PAINT pass. The one scoping
  caution is subunit identity: SF4 contains fungal PEX2 orthologs, so PEX10-specific
  mechanism (RF10/RF12 RADAR polyubiquitination) is scoped SUBFAMILY_ONLY to SF0. No
  residue_sites: the RING zinc-ligand positions were not verified against sequences in
  this pass, and the schema's guidance is to omit rather than guess.
