family_id: PANTHER:PTHR23350
family_name: PEROXISOME ASSEMBLY PROTEIN 10
preferred_name: PEX10 (RING-finger peroxin) family, including a fungal PEX2-type subfamily
summary: >-
  Family of RING-finger peroxins centred on PEX10 orthologs: integral peroxisomal
  membrane proteins with an N-terminal membrane region (five transmembrane segments in
  the structurally characterized fungal complex) and a C-terminal cytosolically exposed
  C3HC4 RING finger. PEX10 is a subunit of the heterotrimeric PEX2-PEX10-PEX12 E3
  ubiquitin ligase complex of the peroxisomal membrane, which doubles as the
  retrotranslocation channel for the PTS1 receptor PEX5. PEX10's RING (RF10) forms an
  extensive RING-RING interface with RF12; complex formation with PEX12 dramatically
  augments PEX10's E3 activity, which monoubiquitinates PEX5 for receptor recycling and,
  with RF12, polyubiquitinates stalled receptors for proteasomal turnover (RADAR
  quality-control pathway). Loss of function abolishes peroxisomal matrix protein import
  while leaving membrane assembly largely intact; biallelic human PEX10 mutations cause
  Zellweger spectrum disorders (complementation group 7). The main subfamily SF0
  contains PEX10 orthologs across animals, fungi, amoebozoa and plants. Notably, the
  family also contains a fungal PEX2-ortholog subfamily (SF4: e.g. Komagataella PEX2,
  Podospora PEX2, Thermothelomyces PEX2) - a different subunit of the same ligase
  complex - so PANTHER splits PEX2 orthologs between this family and PTHR48178. Both
  subunits share domain architecture, localization, complex membership and pathway, but
  their RING domains play mechanistically distinct roles (RF2 monoubiquitinates the
  receptor's N-terminal cysteine; RF10/RF12 cooperate in lysine polyubiquitination).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are RING-finger subunits of the peroxisomal PEX2-PEX10-PEX12 ubiquitin
  ligase/retrotranslocation complex sharing localization (peroxisomal membrane), complex
  membership, and process (matrix protein import via receptor ubiquitination). The
  identified exception axis is subunit identity: subfamily SF4 members are fungal PEX2
  orthologs, not PEX10 orthologs, so PEX10-specific claims (e.g. the RF10-RF12
  polyubiquitination partnership, complementation of PEX10-deficient patient cells) must
  not be read family-wide, even though the generic terms asserted by PAINT
  (peroxisomal membrane, protein import into peroxisome matrix) hold for both
  subfamilies.
