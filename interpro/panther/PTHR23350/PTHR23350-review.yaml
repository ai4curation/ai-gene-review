  id: UniProtKB:O60683
  label: Peroxisome biogenesis factor 10
  gene_symbol: PEX10
  organism: Homo sapiens (Human)
  gene_review: genes/human/PEX10/PEX10-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR23350:SF0
    label: PEROXISOME BIOGENESIS FACTOR 10
    description: >-
      PEX10 orthologs proper, spanning animals (human, mouse, macaque, Xenopus,
      C. elegans), fungi (S. cerevisiae, S. pombe, Komagataella, Pichia angusta,
      Thermothelomyces), amoebozoa (Dictyostelium) and plants (Arabidopsis).
    representative_members:
      - id: UniProtKB:O60683
        label: Peroxisome biogenesis factor 10
        gene_symbol: PEX10
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q05568
        label: Peroxisome biogenesis factor 10
        gene_symbol: PEX10
        organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
  - subfamily_id: PANTHER:PTHR23350:SF4
    label: PEROXISOME BIOGENESIS FACTOR 2
    description: >-
      Fungal PEX2 orthologs classified within the PEX10 family rather than in
      PTHR48178: in the fetched slice, Komagataella phaffii/pastoris PEX2, Podospora
      anserina PEX2, and Thermothelomyces thermophilus PEX2 (G2Q1C9) - the very Pex2
      resolved in the cryo-EM structure of the trimeric ligase complex (PMID:35768507).
      Same complex, same pathway, but a different subunit with a mechanistically
      distinct RING role (receptor cysteine monoubiquitination).
    representative_members:
      - id: UniProtKB:C4R3D4
        label: Peroxisomal biogenesis factor 2
        gene_symbol: PEX2
        organism: Komagataella phaffii (strain GS115 / ATCC 20864)
      - id: UniProtKB:G2Q1C9
        label: Peroxisome assembly protein 2
        gene_symbol: PEX2
        organism: Thermothelomyces thermophilus (strain ATCC 42464 / BCRC 31852 / DSM 1799)
    diverged_from_family: false
    divergence_description: >-
      Not a functional divergence in the loss-of-function sense: SF4 members retain
      localization, complex membership and pathway role. Recorded so that
      PEX10-subunit-specific assertions are scoped to SF0.

node_assessments:
  # --- PTN000598603 is the single PAINT-curated node in the cached slice (taxon:2759, Eukaryota) ---
  - node_id: PANTHER:PTN000598603
    asserted_term:
      id: GO:0005778
      label: peroxisomal membrane
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260529"
    seeds:
      - id: AGI_LocusCode:AT2G26350
      - id: RGD:1591776
      - id: SGD:S000002673
      - id: UniProtKB:O60683
        label: Peroxisome biogenesis factor 10
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Correctly placed at the eukaryote root, seeded from four independent lineages
      (plant, rat, budding yeast, human). Peroxisomal membrane localization holds for
      every member inspected, including the SF4 fungal PEX2-type subfamily (both
      T. thermophilus subunits are membrane-embedded in the cryo-EM structure,
      PMID:35768507). Human PEX10 is inside the clade and correctly receives the IBA;
      it matches direct human evidence (PMID:9700193, PMID:9922452). This is a recent
      (2026) PAINT row - the curation of this family is current.
  - node_id: PANTHER:PTN000598603
    asserted_term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20250903"
    seeds:
      - id: AGI_LocusCode:AT2G26350
      - id: FB:FBgn0035233
      - id: SGD:S000002673
      - id: UniProtKB:O60683
        label: Peroxisome biogenesis factor 10
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Correctly placed and well seeded (plant, fly, budding yeast, human). Matrix
      protein import is the conserved core process of the whole ligase complex, so it
      holds for both the PEX10 (SF0) and fungal PEX2-type (SF4) subfamilies. The human
      seed has strong direct evidence: PEX10-deficient cells import membrane but not
      matrix proteins, and PEX10 expression rescues import (PMID:9683594). The target's
      own presence among the seeds is expected and correct - its experimental
      annotation is one of the descendant evidences behind the IBD - and the IBA adds
      the phylogenetic claim that the function is ancestral, not human-specific.

term_assessments:
  # Terms the experimental record would support for future PAINT propagation, and their safe scope.
  - assessed_term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The core molecular function of both subfamilies, with no MF IBD currently placed
      anywhere on the family - the main gap in an otherwise sound, current PAINT
      curation. Human PEX10 has direct in vitro IDA (E3 activity with UbcH5C, enhanced
      by PEX12; PMID:24662292); the fungal complex structure demonstrates the ligase
      function for both a PEX10 (SF0) and a PEX2 (SF4) member (PMID:35768507); the RING
      finger is required for function in every member tested (e.g. PMID:9700193,
      PMID:10862081). A family-wide IBD at the same PTN000598603 node would be sound.
    supported_by:
      - reference_id: PMID:24662292
        supporting_text: >-
          Here, we establish an in vitro ubiquitination assay system and demonstrate
          that RING finger Pex10p functions as an E3 with an E2, UbcH5C.
      - reference_id: PMID:35768507
        supporting_text: >-
          Recycling requires receptor modification by a membrane-embedded ubiquitin
          ligase complex comprising three RING finger domain-containing proteins
          (Pex2, Pex10 and Pex12)
  - assessed_term:
      id: GO:0000151
      label: ubiquitin ligase complex
    scope: FAMILY_WIDE
    scope_reason: >-
      Membership in the trimeric peroxisomal ubiquitin ligase complex is demonstrated
      structurally for members of both subfamilies (T. thermophilus Pex10 and Pex2,
      PMID:35768507) and biochemically in human and yeast (PMID:24662292,
      PMID:10837480). Proposed as a NEW annotation in the human PEX10 gene review; a
      family-wide IBD would be sound and would fill the current absence of any
      complex-membership CC annotation.
    supported_by:
      - reference_id: PMID:35768507
        supporting_text: >-
          thermophilic fungus Thermothelomyces thermophilus, which are highly
          homologous to the corresponding proteins in Saccharomyces cerevisiae and
          higher organisms
  - assessed_term:
      id: GO:0016562
      label: protein import into peroxisome matrix, receptor recycling
    scope: FAMILY_WIDE
    scope_reason: >-
      The specific sub-process the ligase complex exists for, demonstrated by human IDA
      (PEX10-mediated PEX5 ubiquitination required for its export to the cytosol,
      PMID:24662292) and fungal structure/biochemistry (PMID:35768507), with congruent
      yeast genetics. More informative than the currently asserted parent GO:0016558
      and equally safe at the same node.
    supported_by:
      - reference_id: PMID:24662292
        supporting_text: >-
          Several lines of evidence with lysine-to-arginine mutants of Pex5p demonstrate
          that Pex10p RING E3-mediated ubiquitination of Pex5p is required for its efficient
          export from peroxisomes to the cytosol and peroxisomal matrix protein import.
  - assessed_term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR23350:SF0
        label: PEROXISOME BIOGENESIS FACTOR 10
    scope_reason: >-
      The RADAR polyubiquitination branch is executed by the concerted action of RF10
      and RF12 (PMID:35768507), i.e. it is a claim about the PEX10 subunit specifically
      (with PEX12, which is outside this family); the PEX2 RING is instead assigned the
      receptor monoubiquitination step. Keep this and other RF10-specific mechanistic
      terms scoped to the PEX10 ortholog subfamily SF0, not the SF4 PEX2-type members.
      Even within SF0 the human gene review treats it as a non-core quality-control
      function.
    supported_by:
      - reference_id: PMID:35768507
        supporting_text: >-
          If recycling is compromised, receptors are polyubiquitylated by the concerted
          action of RF10 and RF12 and degraded. This polyubiquitylation pathway also
          maintains the homeostasis of other peroxisomal import factors.

