family_id: PANTHER:PTHR43105
family_name: RESPIRATORY NITRATE REDUCTASE
preferred_name: Prokaryotic molybdopterin-containing oxidoreductase family (NapA/NarB/NasC/FdhF/NuoG clade)
summary: >-
  A large family built on the molybdopterin-bisMGD oxidoreductase fold, with very
  different functions in its subfamilies. It contains periplasmic dissimilatory
  nitrate reductase NapA, membrane-bound respiratory nitrate reductase alpha
  subunits NarG/NarZ, formate dehydrogenases (FdhF, FdnG/FdoG-like), and the
  complex I subunit NuoG/NDUFS1, whose molybdopterin domain no longer binds the
  cofactor. It also contains the cytoplasmic assimilatory nitrate reductases. In
  SF9 these are the ferredoxin-dependent cyanobacterial NarB enzymes
  (Synechococcus elongatus PCC 7942 P39458, Synechocystis PCC 6803 P73448) and the
  fused NAD(P)H-linked enzymes that carry their own flavin electron-input domains:
  Pseudomonas putida KT2440 PP_1703 (Q88M71) and Mycolicibacterium smegmatis NasN
  (A4ZHT3), a monomeric NADPH-preferring enzyme. In SF10, Bacillus subtilis NasC
  is the catalytic partner of the separate NasB diaphorase. The assimilatory
  enzymes reduce nitrate to nitrite in the cytoplasm for biosynthesis; they are
  neither membrane respiratory enzymes nor formate dehydrogenases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Subfamilies differ in reaction (nitrate reduction, formate oxidation, NADH
  oxidation in complex I), in electron partner (quinone, cytochrome, ferredoxin,
  NAD(P)H), in compartment (periplasm, inner membrane, cytoplasm, mitochondrial
  inner membrane) and in whether the Mo cofactor is present at all (NuoG/NDUFS1
  lack it). SF10 itself mixes complex I NuoG subunits with assimilatory NasC and
  the iodate reductase IdrA. Within SF9 the assimilatory nitrate reductases share
  the reaction but not the electron donor: ferredoxin for NarB, NAD(P)H for the
  fused PP_1703 and NasN enzymes.
