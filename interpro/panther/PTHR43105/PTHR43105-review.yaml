family_id: PANTHER:PTHR43105
family_name: RESPIRATORY NITRATE REDUCTASE
preferred_name: >-
  Molybdopterin oxidoreductase-like superfamily, including complex I 75 kDa subunit
  (NuoG / NDUFS1) and Mo/W-bisPGD enzyme catalytic subunits
summary: >-
  A heterogeneous family built on the molybdopterin oxidoreductase fold (Pfam
  Molybdopterin, Molydop_binding, Molybdop_Fe4S4). Most members in the entries file
  are catalytic subunits of molybdenum/tungsten bis-pyranopterin enzymes: periplasmic
  nitrate reductase NapA (SF11, 137 of 235 entries), respiratory nitrate reductase
  NarG/NarZ alpha chains (SF2, SF8), formate dehydrogenases and formylmethanofuran
  dehydrogenases (SF14), assimilatory nitrate reductases, arsenite oxidase AioA and
  iodate reductase IdrA. The family also contains the 75 kDa subunit of respiratory
  complex I: bacterial NDH-1 NuoG (SF10, SF12) and mitochondrial NDUFS1 (SF13). In
  complex I the N-terminal region binds one [2Fe-2S] and three (bacteria) or two
  (mitochondria) [4Fe-4S] clusters that relay electrons from the FMN of NuoF/NDUFV1,
  while the C-terminal molybdopterin-like domain is retained without any molybdenum
  cofactor; complex I's redox centres are FMN and iron-sulfur clusters only. The
  official PANTHER family name is that of the nitrate reductase members and does not
  describe the complex I members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared fold spans two different kinds of protein. The molybdoenzyme members
  bind a Mo/W bis-pyranopterin cofactor and catalyse substrate-specific two-electron
  redox chemistry (nitrate reduction, formate or arsenite oxidation, iodate
  reduction) in diverse complexes. The complex I members (NuoG, NDUFS1) lack the
  molybdenum cofactor and act as iron-sulfur electron-relay subunits of
  NADH:quinone oxidoreductase. Substrate-specific catalytic terms, molybdenum or
  molybdopterin binding and complex-specific component terms therefore cannot
  descend family-wide, and even PANTHER subfamily SF10, named for NuoG, also holds
  arsenite oxidase, iodate reductase and assimilatory nitrate reductase catalytic
  subunits.
