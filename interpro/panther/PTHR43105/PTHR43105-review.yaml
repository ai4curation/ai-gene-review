  - reference_id: url:https://rest.uniprot.org/uniprotkb/Q74FU6.txt
    supporting_text: NADPH-dependent Fe(3+) reductase.
  - reference_id: url:https://rest.uniprot.org/uniprotkb/Q74FU6.txt
