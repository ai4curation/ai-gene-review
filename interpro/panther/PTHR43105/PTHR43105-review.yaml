    organism: Alcaligenes faecalis
  - id: UniProtKB:P42434
    label: Assimilatory nitrate reductase catalytic subunit
    organism: Bacillus subtilis (strain 168)
  supported_by:
  - reference_id: PMID:18603533
    supporting_text: These seven Fe/S clusters are lined up to form the main
      electron transfer pathway
  - reference_id: PMID:17489563
    supporting_text: Thus, N7 is essential for the stability of the complex but is
      not involved in electron transfer.
- subfamily_id: PANTHER:PTHR43105:SF9
  label: NADPH-FE(3+) OXIDOREDUCTASE SUBUNIT ALPHA
  description: >-
    Mostly cytoplasmic assimilatory nitrate reductases: cyanobacterial
    ferredoxin-dependent NarB (P39458, P73448), the fused NAD(P)H-linked enzymes of
    Pseudomonas and Mycolicibacterium, the NADH-linked Klebsiella oxytoca NasA
    (Q06457) and Shewanella frigidimarina O33732. The six Swiss-Prot members in the
    entries list are these four nitrate reductases (P39458, P73448, Q06457, O33732) plus two Geobacter
    sulfurreducens SfrA proteins (Q74FU6, D7AF63). SfrA gives the subfamily its name:
    it is an NADPH-dependent Fe(3+) reductase that lacks the Mo cofactor, not a
    nitrate reductase. The electron donor therefore differs across the subfamily,
    and donor-specific activities are judged per member.
  representative_members:
  - id: UniProtKB:P39458
    label: Nitrate reductase
    gene_symbol: narB
    organism: Synechococcus elongatus (strain ATCC 33912 / PCC 7942 / FACHB-805)
    gene_review: genes/SYNE7/narB/narB-ai-review.yaml
  - id: UniProtKB:Q88M71
    label: Assimilatory nitrate reductase (PP_1703)
    gene_symbol: PP_1703
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/PP_1703/PP_1703-ai-review.yaml
  - id: UniProtKB:A4ZHT3
    label: Nitrate reductase NasN
    gene_symbol: nasN
    organism: Mycolicibacterium smegmatis mc2 155
    gene_review: genes/MYCS2/nasN/nasN-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Unlike the respiratory, periplasmic and complex I subfamilies, the nitrate
    reductase members of SF9 are soluble cytoplasmic assimilatory enzymes that take
    electrons from ferredoxin or NAD(P)H, the fused enzymes through their own
    flavodoxin/FAD domains. The Geobacter SfrA members are a further divergence: they
    lack the Mo cofactor and act as NADPH-dependent Fe(3+) reductases. For the
    assimilatory nitrate reductase members, membrane location, quinone or cytochrome
    coupling, formate dehydrogenase activity and denitrification inherited from deeper
    nodes do not apply. SfrA is the exception for location: it is experimentally a
    peripheral membrane protein, assigned by UniProt to the inner membrane, so a
    membrane term is not wrong for it.
  supported_by:
  - reference_id: file:genes/SYNE7/narB/narB-uniprot.txt
    supporting_text: Belongs to the prokaryotic molybdopterin-containing oxidoreductase family. NasA/NapA/NarB subfamily.
  - reference_id: PMID:15166246
    supporting_text: consistent with the coupling of NarB to low potential ferredoxins in the cell cytoplasm.
  - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7152768/?report=xml
    supporting_text: Among the physiological electron donors tested for the purified NasN, NADPH was
      preferred over NADH, as shown by a 26-fold greater activity with NADPH relative to NADH
  - reference_id: url:https://rest.uniprot.org/uniprotkb/Q74FU6.txt
    supporting_text: Unlike formate ... dehydrogenases, contains no W, Mo or Se.
  - reference_id: url:https://rest.uniprot.org/uniprotkb/Q74FU6.txt
    supporting_text: Cytoplasm. Cell inner membrane
  - reference_id: url:https://rest.uniprot.org/uniprotkb/Q74FU6.txt
    supporting_text: Peripheral membrane protein
