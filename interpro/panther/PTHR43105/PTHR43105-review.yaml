  description: >-
    A mixed subfamily: bacterial complex I NuoG subunits, the iodate reductase
    IdrA, and Bacillus subtilis assimilatory nitrate reductase catalytic subunit
    NasC, which works with the separate NasB diaphorase.
  representative_members:
  - id: UniProtKB:P42434
    label: Assimilatory nitrate reductase catalytic subunit
    gene_symbol: nasC
    organism: Bacillus subtilis (strain 168)
    gene_review: genes/BACSU/nasC/nasC-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    NasC is an assimilatory cytoplasmic catalytic subunit that receives electrons
    from NasB, unlike the complex I NuoG members of the same subfamily, so
    complex I terms do not apply to it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43105/PTHR43105-entries.csv
    supporting_text: P42434,Assimilatory nitrate reductase catalytic subunit,protein,224308,Bacillus subtilis (strain 168),Bacillus subtilis (strain 168),nasC,710,PTHR43105:SF10
  - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
    supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a
      diaphorase with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
