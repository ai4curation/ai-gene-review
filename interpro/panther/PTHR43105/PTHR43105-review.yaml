- assessed_term:
    id: GO:0050464
    label: nitrate reductase (NADPH) activity
  scope: UNRESOLVED
  scope_reason: >-
    Not a subfamily property. NADPH-preferring nitrate reduction is shown only for
    the fused Mycolicibacterium NasN (A4ZHT3) in SF9. It does not hold for the
    ferredoxin-dependent cyanobacterial NarB enzymes (P39458, P73448), or for the
    NADH-linked Klebsiella oxytoca NasA (Q06457). Geobacter SfrA (Q74FU6, D7AF63)
    uses NADPH but reduces Fe(3+), not nitrate, and lacks the Mo cofactor. The fused
    Pseudomonas ortholog PP_1703 (Q88M71) has no measured donor preference and is
    reviewed at the donor-generic nitrate reductase [NAD(P)H] parent. The electron
    donor of Shewanella frigidimarina O33732 has not been established. Leaving this
    term UNRESOLVED rather than scoping it to SF9 is deliberate, for the same reason as
    the ferredoxin-dependent term: the subfamily mixes donors and holds members of
    unknown donor.
  supported_by:
