term_assessments:
- assessed_term:
    id: GO:0009055
    label: electron transfer activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    For the complex I 75 kDa subunits electron transfer through their iron-sulfur
    clusters is the subunit's own function (E. coli NuoG clusters N1b, N4, N5 on
    the main path). For the molybdoenzyme majority the defining function is
    substrate-specific catalysis at the Mo/W cofactor; their clusters do move
    electrons, so the term is not wrong there, but it does not describe the
    family's shared function and is asserted here only for the complex I
    subfamilies. SF10 is mixed (it also holds AioA, IdrA and assimilatory nitrate
    reductases, which are themselves Fe-S redox enzymes), so the grant is safe for
    all its members though informative mainly for NuoG.
  applicable_subfamilies:
  - id: PANTHER:PTHR43105:SF10
    label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT G
  - id: PANTHER:PTHR43105:SF12
    label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT G
  - id: PANTHER:PTHR43105:SF13
    label: NADH-UBIQUINONE OXIDOREDUCTASE 75 KDA SUBUNIT, MITOCHONDRIAL
  supported_by:
  - reference_id: PMID:18603533
    supporting_text: a binuclear [2Fe-2S] cluster N1b and two [4Fe-4S] clusters N4
      and N5 in NuoG
