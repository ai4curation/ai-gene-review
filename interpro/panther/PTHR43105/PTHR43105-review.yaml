    supporting_text: a binuclear [2Fe-2S] cluster N1b and two [4Fe-4S] clusters N4
      and N5 in NuoG
- assessed_term:
    id: GO:0047889
    label: ferredoxin-nitrate reductase activity
  scope: UNRESOLVED
  scope_reason: >-
    Not a subfamily property. SF9 mixes electron donors, so ferredoxin-dependent
    nitrate reduction has to be judged per member. It holds for the cyanobacterial
    NarB enzymes (Synechococcus elongatus PCC 7942 P39458, whose ferredoxin
    interaction is mapped; Synechocystis PCC 6803 P73448). It does not hold for the
    fused NAD(P)H-linked enzymes Mycolicibacterium NasN (A4ZHT3) and Pseudomonas
    PP_1703 (Q88M71), for Klebsiella oxytoca NasA (Q06457), the catalytic subunit of
    an NADH-linked assimilatory enzyme, or for Geobacter SfrA (Q74FU6, D7AF63). SfrA
    is an NADPH-dependent Fe(3+) reductase without a Mo cofactor, so it is not a
    nitrate reductase at all. The electron donor of Shewanella frigidimarina O33732
    has not been established. Leaving this term UNRESOLVED rather than scoping it to
    SF9 is deliberate: the subfamily mixes donors and holds members of unknown
    donor, so a later curator should not tighten it to SUBFAMILY_ONLY without
    member-level evidence.
  supported_by:
  - reference_id: PMID:8624415
    supporting_text: ferredoxin could be used as an electron donor for the reduction of nitrate
  - reference_id: PMID:28520412
    supporting_text: An in silico model for the 1:1 ferredoxin (Fd)/nitrate reductase (NR) complex,
