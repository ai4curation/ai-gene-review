notes: >-
  Propagation evidence for the pruning calls comes from the PANTHER reference-proteome
  PAINT GAF (gene_association.paint_uniprot.gaf, release 19.0). Synechocystis PCC
  6803 NarB (P73448, UniProt PTHR43105:SF9) receives IBA rows for formate
  dehydrogenase (quinone) activity, formate dehydrogenase complex, formate
  oxidation, anaerobic respiration and electron transfer activity from
  PTN000745948; PTN008678683 sends NADH dehydrogenase activity to FdhF and the
  formylmethanofuran dehydrogenase subunits. Membership disagreement for NasC
  (P42434): UniProt and the InterPro-derived entries list give PTHR43105:SF10, while
  PANTHER 19.0's per-organism classification file gives PTHR43742:SF2
  (ASSIMILATORY NITRATE REDUCTASE CATALYTIC SUBUNIT, in the TMAO/DMSO reductase
  family). This review keeps NasC in PTHR43105 beside the other assimilatory
  enzymes, because the soluble Nas and Nap enzymes are closely related and
  distinct from Nar, and it pins the placement with a reasoned row in
  interpro/panther/panther-members-overrides.tsv. The placement is provisional
  until PANTHER resolves the disagreement.
