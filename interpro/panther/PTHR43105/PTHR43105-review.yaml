  scope_reason: >-
    In denitrifying organisms the first, nitrate-to-nitrite step can be catalysed
    by the respiratory NarG/NarZ or the periplasmic NapA enzymes. The InterPro
    mapping that assigns denitrification to the whole Mo-bisMGD nitrate reductase
    signature does not fit the cytoplasmic assimilatory enzymes of SF9 and SF10,
    whose nitrite is reduced to ammonium for biosynthesis. Their member reviews
    removed the term (NarB) or replaced it with nitrate assimilation (NasC).
