notes: >-
  New review. Machine files: PTHR43105-paint.tsv fetched with just
  fetch-panther-paint (197 nodes, 15 node-level rows, all assessed here); leaf
  coverage per node checked against the cached PAINT leaf GAF
  (.cache/panther/gene_association.paint_uniprot.gaf.gz). The PANTHER family
  name RESPIRATORY NITRATE REDUCTASE is dominated by the molybdoenzyme members;
  the bacterial complex I module grounds NuoG here, and its electron transfer
  activity is assessed SUBFAMILY_ONLY, so the bacterial_respiratory_complex_i module
  grounds NuoG at PANTHER:PTHR43105:SF10 (E. coli P33602 and P. putida Q88FH2 are both SF10).
  Leaf identities for P73448 (Synechocystis nitrate reductase), P07658 (FdhF) and
  Q8TIH1 (formylmethanofuran dehydrogenase subunit B) were checked against
  UniProt REST. Entries file is a 235-protein reviewed slice, so subfamily
  composition statements describe that slice. No family-level assessment is made for
  GO:0043546 molybdopterin cofactor binding: it holds for the molybdoenzyme members
  (including assimilatory nitrate reductases in SF9 and SF10) but not for complex I
  NuoG/NDUFS1, and SF10 mixes both, so it is per-member rather than per-subfamily. Open item: the respiratory-process
  row on PTN008678683 is UNRESOLVED for the formylmethanofuran-dehydrogenase and FdhF
  leaves; deciding it needs experimental evidence on whether those paralogs act in a
  respiratory electron transport chain, or a PAINT re-placement of the IBD onto the NuoG clade.
  Data follow-up: projects/TREEGRAFTER/graft_paths_all.tsv records the PP_1703 GO:0016020
  action as REMOVE, while the live genes/PSEPK/PP_1703 review now MODIFYs it to cytoplasm; the
  table needs regenerating.
  Assimilatory additions (bacterial assimilatory nitrate reduction module):
  Propagation evidence for the pruning calls comes from the PANTHER reference-proteome
  PAINT GAF (gene_association.paint_uniprot.gaf, release 19.0). Synechocystis PCC
  6803 NarB (P73448, UniProt PTHR43105:SF9) receives IBA rows for formate
  dehydrogenase (quinone) activity, formate dehydrogenase complex, formate
  oxidation, anaerobic respiration and electron transfer activity from
  PTN000745948; PTN008678683 sends NADH dehydrogenase activity to FdhF and the
  formylmethanofuran dehydrogenase subunits. Membership disagreement for NasC
  (P42434) is unresolved. Its UniProt cross-reference gives PTHR43105:SF10, and the
  InterPro-derived entries list repeats it from the same HMM best-hit pipeline, so the
  two are not independent. PANTHER 19.0's per-organism classification file gives
  PTHR43742:SF2 (ASSIMILATORY NITRATE REDUCTASE CATALYTIC SUBUNIT, in the TMAO/DMSO
  reductase family), a name that matches NasC's function. SF10 is named for NuoG, the
  other assimilatory members of this family sit in SF9, and nasC has no IBA row from
  which a PAINT node could decide it. No checkable discriminator is available, so no
  member-index override is set and both placements stay accepted, with a warning. NasC
  stays listed under SF10 here only as its UniProt placement.
  Reconciliation with main (PR #5920 merged): this file keeps every subfamily, node
  assessment, term scope and reference of the #5920 review, including its reference
  protein E. coli NuoG (P33602), which the bacterial respiratory complex I module uses.
  The assimilatory additions are kept beside them. Two status updates differ from
  #5920's text. The PTN008678681 reason says that both SF9 reviews (nasN and narB)
  MODIFY the TreeGrafter membrane row to cytoplasm, because narB is changed from
  UNDECIDED in PR #5928, and the data follow-up note records that the PP_1703 review
  now MODIFYs that row. One verdict is revised relative to #5920. SF9 is removed from
  PTN008678681's affected_subfamilies (the membrane-pruning scope), because SF9 is
  mixed: its assimilatory nitrate reductases are cytoplasmic, but Geobacter SfrA is a
  peripheral membrane protein for which membrane is true. The IRD is therefore placed
  on the nitrate-reductase branch below SF9. #5920's sentence placing SfrA in the
  cytoplasm is corrected accordingly. No bacterial_respiratory_complex_i grounding is
  affected, because its NuoG members are in SF10, which neither version lists.
