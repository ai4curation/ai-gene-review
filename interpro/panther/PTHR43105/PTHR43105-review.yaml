  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Deep node with 107 leaves in the PAINT leaf GAF (gene_association.paint_uniprot,
    checked 2026-11-03). For complex I 75 kDa subunits (NuoG, NDUFS1) and the
    respiratory nitrate reductase alpha chains (NarG, NarZ), membrane is true though
    coarse, because they are peripheral subunits of membrane-bound complexes; the
    E. coli NuoG review refines it to plasma membrane. But the same GAF gives the
    inherited membrane term to soluble enzymes: periplasmic NapA (E. coli P33937 and
    six other napA leaves, SF11), the catalytic subunit of the soluble periplasmic NapAB
    nitrate reductase, and the assimilatory nitrate reductase NarB of Aquifex aeolicus
    (O66590), whose SF9 clade of assimilatory nitrate reductases (such as
    Synechococcus elongatus PCC 7942 NarB P39458 and Synechocystis P73448) acts in the
    cytoplasm. The NADPH-Fe(3+) oxidoreductase SfrA, which gives SF9 its name, is the
    exception. Geobacter SfrA (Q74FU6) is experimentally a peripheral membrane
    protein, assigned by UniProt to the inner membrane, so a membrane term is not
    wrong for it. Both committed SF9 reviews bear on this
    and MODIFY the TreeGrafter membrane row to cytoplasm: genes/MYCS2/nasN from native
    cytoplasmic-fraction activity, and genes/SYNE7/narB from its cytoplasmic
    ferredoxin-dependent enzymology. For nasN's TreeGrafter source
    PTN000177398 the descent is recorded in a committed file:
    projects/TREEGRAFTER/graft_paths_all.tsv (the PP_1703 GO:0016020 row, which grafts to
    the same node) gives ibd PTN008678681, one step up, with 107 IBD leaves and the same
    four seeds. narB's source PTN000177404 is not in that table; that leg rests on
    uncommitted data (PANTHER's TreeGrafter table gives the node exactly GO:0016020, and
    PTN008678681 is the only node in the family asserting it in PTHR43105-paint.tsv and
    PAINT IBD.gaf). The node is also ancestral to SF10: its seed NuoG P33602 is an SF10
    member, and PANTHER's TreeGrafter table lists the node as PTHR43105:AN8 with subfamily
    SF10 and GO:0016020. PTHR43105-entries.csv shows that SF10 also holds soluble enzymes
    that therefore inherit membrane, such as the assimilatory nitrate reductases B.
    subtilis NasC (P42434), Haloferax I3R634 and Streptomyces Q9L2E6, and
    the periplasmic AioA and IdrA enzymes. SF10 is deliberately not listed in
    affected_subfamilies: it is mixed, holding these enzymes together with complex I NuoG,
    for which membrane is true, so the subfamily axis cannot separate them. SF9 is
    left out of affected_subfamilies for the same reason. It is mixed: its
    assimilatory nitrate reductases are cytoplasmic, but for its Geobacter SfrA
    members (Q74FU6, D7AF63) membrane is true though coarse, since SfrA is
    experimentally a peripheral membrane protein, assigned by UniProt to the inner
    membrane. The IRD for membrane belongs on the
    nitrate-reductase branch below SF9 and on SF11; the tungsten formylmethanofuran
    dehydrogenase FwdB/FmdB leaves, also soluble, should be checked with them.
