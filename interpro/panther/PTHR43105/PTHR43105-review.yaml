  id: UniProtKB:P33602
  label: NADH-quinone oxidoreductase subunit G
  gene_symbol: nuoG
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/nuoG/nuoG-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43105:SF10
  label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT G
  description: >-
    24 entries: 16 bacterial NDH-1 NuoG subunits, including E. coli and
    Pseudomonas putida KT2440 NuoG, plus arsenite oxidase AioA, iodate reductase
    IdrA and assimilatory nitrate reductase catalytic subunits (Bacillus subtilis,
    Streptomyces coelicolor, Haloferax mediterranei). In E. coli NuoG the clusters
    N1b, N4 and N5 lie on the main electron-transfer path of complex I, cluster N7
    is off-path and needed for stability, and no molybdenum cofactor is bound.
  diverged_from_family: true
  divergence_description: >-
    The complex I NuoG members diverge from the molybdoenzyme majority of the
    family: they have lost the molybdenum cofactor while keeping a vestigial
    molybdopterin-like C-terminal domain, gained the [2Fe-2S]/His(Cys)3 [4Fe-4S]
    electron-relay N-terminal region, and function as a subunit of proton-pumping
    NADH:quinone oxidoreductase rather than as a catalytic subunit. The subfamily
    itself is mixed, so its NuoG members cannot be identified by subfamily alone;
    the TIGR01973 NuoG model or complex I signatures (PROSITE COMPLEX1_75K) mark
    them.
  representative_members:
