    gene_review: genes/MYCS2/nasN/nasN-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Unlike the respiratory, periplasmic and complex I subfamilies, SF9 members are
    soluble cytoplasmic assimilatory nitrate reductases that take electrons from
    ferredoxin or, through fused flavodoxin/FAD domains, from NAD(P)H. Membrane
    location, quinone or cytochrome coupling, formate dehydrogenase activity and
    denitrification inherited from deeper nodes do not apply to them.
  supported_by:
