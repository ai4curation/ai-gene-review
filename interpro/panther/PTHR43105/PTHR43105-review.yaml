    label: RESPIRATORY NITRATE REDUCTASE 2 ALPHA CHAIN
  - id: PANTHER:PTHR43105:SF8
    label: RESPIRATORY NITRATE REDUCTASE 1 ALPHA CHAIN
  - id: PANTHER:PTHR43105:SF11
    label: PERIPLASMIC NITRATE REDUCTASE
  scope_reason: >-
    In denitrifying organisms the first, nitrate-to-nitrite step can be catalysed
    by the respiratory NarG/NarZ or the periplasmic NapA enzymes. On the
    assimilatory members the term arrives by UniPathway2GO (GO_REF:0000041 from the
    nitrate-reduction pathway UniPathway:UPA00652), which equates a shared
    nitrate-reduction reaction with denitrification. That does not fit the
    cytoplasmic assimilatory enzymes, NarB-type members of SF9 and NasC (whose
    UniProt placement is SF10, a NuoG-named subfamily), whose nitrite is reduced to
    ammonium for biosynthesis. Their member reviews removed the term (NarB) or
    replaced it with nitrate assimilation (NasC).
