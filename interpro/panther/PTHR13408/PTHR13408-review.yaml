family_id: PANTHER:PTHR13408
family_name: DNA-DIRECTED RNA POLYMERASE III
preferred_name: RPC4/C53 RNA polymerase III subunits
summary: RPC4/C53 proteins are noncatalytic subunits of RNA polymerase III. They help organize the transcription
  complex and its initiation, termination and reinitiation behavior through association with other polymerase
  subunits. Participation in RNA synthesis does not mean that an isolated RPC4 protein catalyzes phosphodiester-bond
  formation.
functional_coherence: COHERENT
coherence_reason: All six inspected inventory entries identify RPC4/C53, consistent with curated IPR007811
  assignment to RNA polymerase III. This supports polymerase-III complex membership and contribution to
  its transcription process. The catalytic reaction belongs to the assembled polymerase; RPC4 is an accessory
  component, not an autonomous DNA-directed RNA polymerase.
subfamilies:
- subfamily_id: PANTHER:PTHR13408:SF0
  label: DNA-DIRECTED RNA POLYMERASE III SUBUNIT RPC4
  description: The sampled entries consistently identify RPC4, and the curated InterPro entry assigns
    this group to polymerase III. Complex membership and transcription by polymerase III are transferable;
    generic RNA polymerase catalytic activity is not an intrinsic activity of this subunit.
