  name:
    name: Protein-Tyrosine Phosphatase
    short: Protein-Tyr_Phosphatase
  description:
  - text: The protein-tyrosine phosphatase family is involved in various cellular
      processes including cell growth control, T-cell activation, integrin-mediated
      focal adhesion formation, and negative regulation of insulin receptor signaling.
      Members of this family play roles in the dephosphorylation of tyrosine residues
      in proteins, which can modulate enzyme activity, protein-protein interactions,
      and cellular localization. Some members are involved in the negative regulation
      of pathways downstream of receptor signaling, contributing to immune responses
      and signal transduction pathways. Others are implicated in the establishment
      of contextual memory and differentiation of cells, such as the maturation of
      oligodendrocytes. Effector proteins within this family can alter host cell physiology
      to promote bacterial survival. The family includes both receptor-type and non-receptor
      class subfamilies, with some acting as virulence determinants in pathogenesis
      by dephosphorylating host proteins.
