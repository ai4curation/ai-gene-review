notes: >-
  Membership: the cached entries.csv lists 77 reviewed members. Only two have in-repo gene
  reviews: human PTPRC (SF539) and Dictyostelium ptpC/PTP3 (SF549). Both accept protein
  tyrosine phosphatase activity. PTPRC accepts transmembrane receptor PTP activity, and ptpC
  is cytosolic with no receptor term. Many human PTPs are not in this PANTHER family under
  current UniProt mapping, including PTPN1 (PTHR46047), PTPN11 (PTHR46559) and the IA-2
  pseudophosphatases PTPRN/PTPRN2 (PTHR46106). So the classic IA-2 catalytically-inactive
  receptor PTPs are not exceptions here. Catalytic-cysteine positions were located by motif
  search and BLOSUM62 local alignment to the PTP3 anchor (Cys650). Positions were confirmed
  for PTPRC 853, YopH 403, PTP-H2 236, PTP-J1 235 (Ser) and SDF-9 223 (Ser; UniProt's caution
  text calls this residue lysine, but the current sequence has serine). Bracovirus gene naming
  differs between UniProt gene names and Pruijssers & Strand 2007. Only PTP-J1 (Q5I141,
  Cys235Ser matches the paper) and PTP-H1 (Q5I147, 336 aa, the longest family member as
  described) are used as exceptions. Other UniProt CAUTION notes on bracovirus entries (Q5I124,
  Q5I127, Q5I138, Q5I142, Q5I154) were not adjudicated. Smaller PAINT nodes not assessed
  here: PTN002709182 (GO:0031175, seeded only by PTPRM P28827) and PTN002709428 (GO:0048709
  oligodendrocyte differentiation, Euteleostomi, seeded by mouse/rat Ptprz1).
