residue_sites:
- site_id: catalytic_cysteine
  label: Catalytic cysteine of the PTP signature motif
  description: >-
    The nucleophilic cysteine of the classical PTP signature motif (HCxxGxxR(S/T)G, the
    phosphate-binding P-loop). It attacks the substrate phosphate and forms the phosphocysteine
    intermediate. It is anchored on Dictyostelium PTP3 (ptpC) Cys650 (VHCSAGIGRSG). In
    two-domain receptor PTPs the homologous position should be read in the D1 domain (e.g.
    PTPRC Cys853), because the D2 domains are often degenerate. C. elegans SDF-9 and bracovirus
    PTP-J1 carry a serine at this position.
  anchor:
    id: UniProtKB:P54637
    label: Tyrosine-protein phosphatase 3
    gene_symbol: ptpC
    organism: Dictyostelium discoideum
    gene_review: genes/DICDI/ptpC/ptpC-ai-review.yaml
