- assessed_term:
    id: GO:0005001
    label: transmembrane receptor protein tyrosine phosphatase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe only for the receptor-type subfamilies, whose members have a single transmembrane helix
    (UniProt topology) and an ectodomain. These are PTPRC, PTPRA, PTPRE (receptor isoform),
    PTPRG, PTPRZ1, PTPRK, fly Ptp69D/Ptp99A and worm CLR-1. It must not descend family-wide.
    PANTHER's family name ("RECEPTOR-TYPE") is misleading: the non-receptor subfamilies have no
    transmembrane segment and are cytosolic enzymes. These include Dictyostelium PTP3 (SF549),
    PTPN9 (SF285), the yeast and fission-yeast PTPs, Arabidopsis PTP1, the SF449 catch-all and
    the bracovirus/bacterial effectors. A cellular-component term such as plasma membrane follows
    the same subfamily boundary.
