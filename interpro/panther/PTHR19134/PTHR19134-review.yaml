  assessment_reason: >-
    PTN008567661 is the family-level node, seeded by more than 40 experimentally characterized
    animal and fungal members. In the cached PAINT GAF its approximately 620 recipients are
    animals and fungi; no Dictyostelium, plant, bacterial or viral member receives the IBA. The
    catalytic HCxxGxxR signature is conserved in D1 of the receptor members and in the
    single domain of the non-receptor members, so the activity is ancestral to this clade. The
    known inactive opisthokont members, C. elegans SDF-9 and EAK-6 (SF561), receive the
    signal-transduction IBA from this node but not the phosphatase-activity IBA. The
    propagation therefore already withholds the activity from the SDF-9 branch, and no
    additional pruning is needed within the PAINT recipient set. The inactive bracovirus PTPs
    (PTP-J1, PTP-H1) are not PAINT recipients and are handled as member exceptions in the term
    assessment.
