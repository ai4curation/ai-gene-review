term_assessments:
- assessed_term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The catalytic domain and its HCxxGxxR(S/T)G signature define the family, and activity has
    been shown in receptor (CD45), non-receptor (Dictyostelium PTP3) and effector (bracovirus
    PTP-H2/H3) members. The activity is the default expectation for any member that keeps the
    catalytic cysteine (site catalytic_cysteine) and the other essential motifs. The listed
    member exceptions have lost catalytic residues and are shown or predicted to be inactive.
    Other bracovirus PTPs with truncated or rearranged catalytic domains (for example UniProt
    Q5I138, Q5I142, Q5I124), and short Styela plicata PCR fragments, should be checked against
    the catalytic_cysteine site before the term is applied. EAK-6 (SF561) keeps the cysteine
    but has an altered signature and no activity data, so it is left unresolved rather than
    excepted.
  member_exceptions:
  - member:
      id: UniProtKB:G5EGA9
      gene_symbol: sdf-9
      organism: Caenorhabditis elegans
    exception_reason: >-
      SDF-9 has serine at the catalytic-cysteine position (223) and is predicted to be
      catalytically inactive. It acts in DAF-2 signaling as a PTP-like protein. The PAINT
      propagation already withholds the activity IBA from it.
    supported_by:
    - reference_id: PMID:16839187
      supporting_text: Whereas SDF-9 does not retain the canonical catalytic cysteine residue
        found in all known PTPs and is therefore predicted to be catalytically inactive
    - reference_id: PMID:16839187
      supporting_text: Thus, EAK-6 and SDF-9 may be inactive phosphatase homologs that bind to
        tyrosine phosphoproteins.
