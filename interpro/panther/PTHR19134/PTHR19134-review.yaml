family_id: PANTHER:PTHR19134
family_name: RECEPTOR-TYPE TYROSINE-PROTEIN PHOSPHATASE
preferred_name: Classical protein-tyrosine phosphatase family (receptor and non-receptor PTPs)
summary: >-
  A large family of classical, cysteine-based protein-tyrosine phosphatases. Every member is
  built around one or two PTP catalytic domains carrying the HCxxGxxR(S/T)G signature, whose
  cysteine forms the phosphocysteine intermediate. Despite PANTHER's family name, the family is
  not restricted to receptor PTPs. It includes single-pass transmembrane receptor-type PTPs
  (PTPRC/CD45, PTPRA, PTPRE, PTPRG, PTPRZ1, PTPRK, fly Ptp69D and Ptp99A, worm CLR-1), and
  cytosolic non-receptor PTPs: human PTPN9, budding yeast PTP1/PTP2/PTP3, fission yeast
  pyp1/pyp2/pyp3, Arabidopsis PTP1, and the Dictyostelium PTPs ptpA, ptpB and ptpC (PTP3). It also
  holds horizontally acquired bacterial effector PTPs (Yersinia YopH, Salmonella SptP), which
  dephosphorylate host proteins, and the expanded polydnavirus (Microplitis demolitor
  bracovirus) PTP family. In the receptor PTPs the membrane-distal D2 domain is often
  catalytically impaired, but the membrane-proximal D1 domain is active. A few lineages have lost
  the catalytic cysteine or other essential motifs and are inactive PTP-like proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Protein tyrosine phosphatase activity is shared by the characterized members across animals,
  fungi, amoebozoa, plants and the bacterial/viral effectors. Examples are CD45/PTPRC
  (PMID:2853967), Dictyostelium PTP3/ptpC (PMID:8628311, PMID:18305004), and bracovirus PTP-H2 and
  PTP-H3 (PMID:17121799). The exceptions are identified catalytically dead members. C. elegans
  SDF-9 (SF561) lacks the catalytic cysteine (PMID:16839187). Bracovirus PTP-J1, which has
  Cys235 replaced by serine, and PTP-H1, which lacks the WPD-loop tryptophan, are both in SF449
  and were shown to be inactive (PMID:17121799). Several other bracovirus PTPs carry truncated or
  rearranged catalytic domains. Membrane topology, biological process and pathway are not
  coherent. The family mixes transmembrane receptor PTPs with cytosolic enzymes such as PTP3
  (cytosolic in unstimulated cells, PMID:24587195), and the processes range from leukocyte
  antigen-receptor signaling to fungal MAPK regulation, Dictyostelium STAT signaling and
  pathogen subversion of host cells.
