    which tunes a specific pathway in its own organism. Examples are CD45 in antigen-receptor
    signaling, Dictyostelium PTP3 in STATc signaling, yeast PTP2/PTP3 in MAPK signaling and
    SDF-9/EAK-6 in DAF-2 signaling. It is wrong for the bacterial effectors (YopH, SptP) and the
    bracovirus PTPs in SF449/SF534, which subvert host signaling rather than take part in their
    own organism's signal transduction. These lie inside PANTHER subfamilies shared with
    endogenous eukaryotic enzymes, so no clean subfamily boundary exists. More specific pathway
    terms should be curated per gene rather than inferred from family membership.
