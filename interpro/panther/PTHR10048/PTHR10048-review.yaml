family_id: PANTHER:PTHR10048
family_name: PHOSPHATIDYLINOSITOL KINASE
preferred_name: Phosphatidylinositol kinase family (class I-III PI3K and type III PI4K)
summary: >-
  Lipid kinases with a PI3K/PI4K catalytic domain. The family contains the class I PI3Ks (PIK3CA,
  PIK3CB, PIK3CD, PIK3CG), which make PI(3,4,5)P3 in receptor signaling; the class II PI3Ks (PIK3C2A,
  PIK3C2B, PIK3C2G); the class III PI3K VPS34 (PIK3C3), which makes PI3P for endosomal sorting and
  autophagy; and the type III PI4Ks, PI4KA (Stt4) and PI4KB (Pik1), which make PI4P at the plasma
  membrane and Golgi. Each lipid product is specific to a subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares a catalytic fold and ATP-dependent inositol-lipid phosphorylation, but the position
  phosphorylated and the preferred substrate differ by subfamily: 3-kinase on PI(4,5)P2 for class
  I, PI3P from PI for class III, and 4-kinase on PI for the type III PI4Ks. No single phosphoinositide
  kinase activity is safe family-wide.
