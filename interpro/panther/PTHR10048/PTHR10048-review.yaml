term_assessments:
- assessed_term:
    id: GO:0016303
    label: 1-phosphatidylinositol-3-kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    All three PI3K classes phosphorylate phosphatidylinositol at the 3-position: class III VPS34
    (SF7, selected by the phosphoinositide_biosynthesis and phagosome_maturation modules, and its
    sole activity), the class II PI3Ks (SF28, SF29, SF30), and the class I catalytic subunits in
    vitro (SF107, SF33, SF34, SF35), whose PIK3CA and PIK3CD reviews keep the term. Not the type
    III PI4Ks.
    SF111 (C. elegans AGE-1, a class I catalytic subunit) is listed too; its review keeps
    the in vitro activity as non-core.
