family_id: PANTHER:PTHR11923
family_name: SCAVENGER RECEPTOR CLASS B TYPE-1  SR-B1
preferred_name: CD36/SCARB class B scavenger receptor family
summary: >-
  PTHR11923 contains class B scavenger receptors and related double-pass membrane proteins
  with a large extracellular or luminal CD36/SR-B domain. Human CD36 is a cell-surface
  receptor and long-chain fatty-acid transporter that binds oxidized lipoproteins,
  thrombospondins, amyloid-beta and TLR ligands. Human SCARB1/SR-BI is an HDL receptor
  that mediates selective HDL cholesteryl-ester uptake and cholesterol exchange at the
  plasma membrane and in caveolae. Human SCARB2/LIMP-2 is a diverged lysosomal and
  late-endosomal membrane cargo receptor for glucosylceramidase rather than an
  extracellular scavenger receptor.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The two-pass CD36/SR-B fold is coherent and the root membrane assertion fits the reviewed
  human CD36, SCARB1 and SCARB2 members, but ligand biology diverges after the family root:
  CD36 and SCARB1 retained extracellular scavenger/lipoprotein receptor roles, whereas
  SCARB2 moved into the endolysosomal system as the GBA1 cargo receptor and should not
  inherit scavenger receptor activity.
