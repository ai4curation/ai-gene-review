family_id: PANTHER:PTHR11586
family_name: TRNA-AMINOACYLATION COFACTOR ARC1 FAMILY MEMBER
summary: This family combines cytoplasmic tyrosyl-tRNA synthetases with related tRNA-binding or regulatory
  proteins, including AIMP1-type factors. Complete TyrRS enzymes activate tyrosine with ATP and transfer
  it to cognate tRNA. Shared ancillary RNA-binding domains do not confer that aminoacylation reaction
  on a protein lacking the synthetase module.
functional_coherence: HETEROGENEOUS
coherence_reason: Complete TyrRS proteins combine tyrosine activation and tRNA charging domains, whereas
  related ancillary RNA-binding/EMAP-containing proteins need not catalyze aminoacylation. Fly TyrRS additionally
  has a context-specific extracellular role during cell competition, with proteolytic products affecting
  hemocyte attraction (PMID:26658841). This signaling activity is not the definition of all TyrRS or AIMP1/Arc1
  relatives. Tyrosine-tRNA ligase activity requires the complete catalytic architecture; a shared ancillary
  domain or a secreted fragment does not suffice, and an exhaustive active-subfamily boundary is not established
  here.
