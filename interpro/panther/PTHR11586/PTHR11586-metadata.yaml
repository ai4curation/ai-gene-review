  name:
    name: Tyrosine-tRNA ligase and regulatory protein
    short: Tyrosine-tRNA_ligase_regulator
  description:
  - text: This family of proteins includes enzymes that catalyze the ligation of tyrosine
      to tRNA(Tyr) in a two-step reaction involving the activation of tyrosine by
      ATP to form Tyr-AMP, followed by the transfer to the acceptor end of tRNA(Tyr).
      Members of this family also play a role in the regulation of poly-ADP-ribosylation
      in the nucleus, independent of their ligase activity. Binding of resveratrol
      modulates their activity, inhibiting the ligase function and promoting nuclear
      localization, where they enhance the poly-ADP-ribosyltransferase activity of
      PARP1. Additionally, some proteins in this family interact with tRNA as part
      of a multisynthase complex, influencing various cellular processes including
      inflammatory response, TGF-beta signaling, glucose homeostasis, wound repair,
      angiogenesis, and immune cell function.
