  seeds:
  - id: PANTHER:PTN000474644
  assessment: UNRESOLVED
  assessment_reason: 'The row stops the bacterial cytosol term at one leaf, the Nematostella vectensis protein A7TAT0,
    which the tree places inside Bacteria beside Bacteroides thetaiotaomicron under a horizontal-transfer node.
    An IRD emits no leaf annotation, so nothing false is asserted. Whether the protein is non-cytosolic is unknown:
    there is no localisation data, and a bacterial contaminant in the genome assembly and a real transferred gene
    would both most likely be cytosolic. The alignment row is N-terminally truncated and reads Ile at the catalytic
    Lys (yeast K12), so the gene model itself is doubtful. PAINT stopped only the cytosol term; the same leaf still
    inherits triose-phosphate isomerase activity and the three process terms from the root, which was not pursued
    here because the model may simply be defective.'
