family_id: PANTHER:PTHR21139
family_name: TRIOSEPHOSPHATE ISOMERASE
preferred_name: Triosephosphate isomerase (TPI/TIM) family, including the EryH/LerI erythrulose-phosphate isomerases
summary: 'TIM-barrel isomerases of the triosephosphate isomerase family. Nearly all members are triosephosphate
  isomerase (EC 5.3.1.1), which interconverts dihydroxyacetone phosphate and D-glyceraldehyde 3-phosphate in glycolysis
  and gluconeogenesis: bacterial TpiA, the shorter tetrameric archaeal enzymes, fungal TPI1, animal TPI1, protist
  enzymes, and in plants a plastid isoform and cytosolic isoforms that arose by streptophyte and embryophyte duplications.
  A minority are L-erythrulose-1-phosphate isomerases (EryH/LerI, EC 5.3.1.33), which interconvert L-erythrulose
  1-phosphate and D-erythrulose 4-phosphate in bacterial erythritol, L-threitol and D-apiose catabolism; they keep
  the catalytic Lys, His and Glu but have Ser at the catalytic Asn. A second fungal paralog clade and one Streptomyces
  protein share that signature. A few hominine and plant gene models have lost active-site residues or are fragments.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'The PANTHER release 19 tree has 323 leaves in 14 subfamilies, and 287 leaves have both catalytic
  residues; the root activity is seeded by 16 assayed enzymes from all three domains. The exceptions are identified:
  (1) members with Ser at the catalytic Asn, which are L-erythrulose-1-phosphate isomerases where characterised
  (ten reviewed EryH/LerI members outside the tree; in the tree, the six-leaf fungal clade PTN001079910 and Streptomyces
  SCO0578 carry the signature, unassayed); (2) the hominine SF23 copies lacking the catalytic His; (3) truncated
  plant gene models, mainly lettuce. The earlier statement that all subfamilies are triosephosphate isomerases is
  withdrawn.'
