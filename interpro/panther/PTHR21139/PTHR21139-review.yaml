  Triosephosphate isomerases interconvert dihydroxyacetone phosphate and glyceraldehyde 3-phosphate
  in glycolysis and gluconeogenesis (bacterial TpiA, S. cerevisiae TPI1, S. pombe tpi1, human TPI1,
  plant cytosolic and plastid TPIs).
