notes: 'Re-review of 2026-11-26 against primary data; the tree, alignment and annotation checks are reproducible
  with family_check.py in this folder (PANTHER treeinfo and familymsa, release 19; UniProt; QuickGO). Residue numbers
  are in the native numbering of the named UniProt sequence: yeast TPI1 P00942 sequence version 2 unless stated
  (N10, K12, H95, E165, L230, G233), human P60174 sequence version 4 (N12, K14, H96, E166). Positions of reviewed
  members that are not tree leaves come from pairwise alignment to a reference leaf. Not verified: (a) the full
  text of PMID:12953116, PMID:29910781, PMID:4022011, PMID:26560079 and PMID:29867142 is not cached here; they were
  checked against PubMed abstracts, Europe PMC full text (PMID:29910781) or the UniProt records that cite them,
  and are cited without quotes; (b) no fungal or Streptomyces Ser-bearing member has been assayed, and no EryH/LerI
  enzyme was found tested for residual triose-phosphate isomerase activity; (c) Listeria monocytogenes tpiA2 (Q8YA20,
  a bacterial tree leaf) keeps the catalytic Asn but has the Phe/Arg pair (N9, F231, R234); its reaction is unknown
  and no change is requested for it; (d) the plant SF37 clade has no characterised member. PAINT coverage gaps noted
  but not requested as changes: no chloroplast term on the plastid clade PTN001079886 although Arabidopsis TIM has
  IDA chloroplast evidence, and no cytosol term on any eukaryotic node. Ontology: a QuickGO term search for ''erythrulose''
  on 2026-11-26 returned no molecular-function term for EC 5.3.1.33 (L-erythrulose-1-phosphate isomerase), so there
  is no replacement term to offer for the pruned clades. The QuickGO annotation service ignores an evidence-code
  filter passed as goEvidence without error; family_check.py therefore fetches all rows and filters locally (146
  experimental rows of 2641).'
