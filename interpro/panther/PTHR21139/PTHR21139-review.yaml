- site_id: substrate_asn
  label: Catalytic Asn that separates triosephosphate isomerases from EryH/LerI
  description: 'Yeast TPI1 Asn10 (alignment column 231), one of the four catalytic residues named in the cited review
    (Asn11 in its numbering). It is Asn in 276 of 323 tree leaves and Ser in 8: the six fungal EryH-like paralogs,
    Streptomyces SCO0578 and one maize model. All ten reviewed L-erythrulose-1-phosphate isomerases have Ser here,
    together with Phe and Arg at yeast L230 and G233; none of the 577 reviewed members named as triosephosphate
    isomerases has that combination. Positions for members outside the tree come from pairwise alignment to a reference
