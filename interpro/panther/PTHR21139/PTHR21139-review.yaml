  assessment_reason: 'Placement at the root is right. All 16 seeds are tree leaves with an experimental GO:0004807
    row in QuickGO, spread over Bacteria, Archaea, fungi, animals, plants and protists, so a LUCA-level gain is
    well grounded, and the catalytic His and Glu are present in 287 of 323 leaves (the rest are truncated gene models
    or the copies named below). Needs pruning at the second fungal paralog clade PTN001079910 (6 leaves, one per
    species, each species also having a canonical SF41 enzyme). All six read Ser at the catalytic Asn (yeast TPI1
    N10) with Phe at L230 and Arg at G233: SLKHEIGGSFGR against the family consensus NWKHEIGGSLGG. The same three
    substitutions are in all ten reviewed L-erythrulose-1-phosphate isomerases (EryH/LerI, EC 5.3.1.33) and in none
    of the 577 reviewed members named as triosephosphate isomerases, and the EryH paper calls the Asn to Ser change
    typical of that group. The Yarrowia leaf YALI0F01584g lies in the erythritol utilisation gene cluster, is induced
    on erythritol and was proposed as the EryH counterpart (PMID:29910781). No fungal member has been assayed, and
    whether these proteins retain any triose-phosphate isomerase activity has not been tested.'
