  - id: UniProtKB:P0A858
  assessment: SOUND
  assessment_reason: 'The node is the bacterial clade (36 leaves, 35 species, all SF42) and the single seed, E.
    coli TpiA, has two IDA rows and one HDA row for cytosol. A soluble glycolytic enzyme with no targeting signal
    is cytosolic throughout Bacteria, so the placement holds; a short seed list is not weak support. The row is
    conservative rather than complete: mouse, fission yeast and Arabidopsis cytosolic enzymes have experimental
    cytosol rows outside the node, and no eukaryotic node carries the term. No reviewed rat, human or yeast gene
    sits under this node, contrary to the earlier version of this review, which cited rat Tpi1 as a recipient.'
