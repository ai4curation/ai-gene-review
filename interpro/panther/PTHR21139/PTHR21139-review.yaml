    id: NCBITaxon:1437183
    label: Mesangiospermae
  seeds:
  - id: AGI_LocusCode:AT3G55440
  assessment: UNRESOLVED
  assessment_reason: 'The node is the angiosperm cytosolic clade (69 leaves, 31 species; SF34, SF35, SF40), one
    side of an embryophyte duplication whose other side is the plastid clade. The seed, Arabidopsis cytosolic TPI
    (AT3G55440, P48491), has an IDA row from PMID:12953116 and an HDA row from PMID:14671022. By its abstract, PMID:12953116
    found glycolytic enzymes in a mitochondrial fraction, protease-sensitive and therefore on the outside of the
    organelle, and proposed attachment of the pathway to the cytosolic face of the outer membrane; triosephosphate
    isomerase is not named in the abstract and the full text was not read here. So the seed supports a surface-associated
    subpopulation of a cytosolic enzyme, not residence in the organelle. The placement also does not track the evidence:
    the Arabidopsis plastid isoform and yeast TPI1 carry experimental mitochondrion rows outside the node. Whether
    a surface association seen in one species should descend to 69 cytosolic enzymes as a bare mitochondrion term
    is a curator judgement this review cannot settle; no change is requested.'
