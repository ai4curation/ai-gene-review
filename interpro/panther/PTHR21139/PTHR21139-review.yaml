term_assessments:
- assessed_term:
    id: GO:0004807
    label: triose-phosphate isomerase activity
  scope: RESIDUE_DETERMINED
  scope_reason: 'True of every characterised member with the canonical active site, across Bacteria, Archaea and
    eukaryotes, including the plant plastid and cytosolic isoforms. Not safe for the members that carry Ser at the
    catalytic Asn: the three characterised ones catalyse the L-erythrulose 1-phosphate / D-erythrulose 4-phosphate
    isomerisation (EC 5.3.1.33) instead, and the fungal and Streptomyces members share their signature. Subfamily
    labels cannot separate the two groups (the EryH/LerI members are filed under SF42 and SF2), so the residue decides.
    Copies that have lost the catalytic His or Glu (site active_site_his_glu) are also excluded.'
  determined_by_site: substrate_asn
