    clade PTN000474641 (8 leaves, M. jannaschii TpiA; shorter chains that read Ile, Ala and Ser at yeast S211, G232
    and G233) and a small eukaryotic clade PTN009044027 (three Thalassiosira proteins and one Trichoplax protein)
    that branches before the main eukaryotic clade. Most reviewed members (570 of 646) are in SF42, including nine
    of the ten reviewed L-erythrulose-1-phosphate isomerases, none of which is a tree leaf.'
