  assessment: NEEDS_PRUNING
  assessment_reason: 'Placement at the root is right. The three seeds (mouse, E. coli, M. tuberculosis) each carry
    an experimental gluconeogenesis row, and the reversible triose-phosphate step is shared by gluconeogenesis wherever
    a canonical enzyme is present. Needs pruning at the second fungal paralog clade PTN001079910 (6 leaves, one
    per species, each species also having a canonical SF41 enzyme). All six read Ser at the catalytic Asn (yeast
    TPI1 N10) with Phe at L230 and Arg at G233: SLKHEIGGSFGR against the family consensus NWKHEIGGSLGG. The same
    three substitutions are in all ten reviewed L-erythrulose-1-phosphate isomerases (EryH/LerI, EC 5.3.1.33) and
    in none of the 577 reviewed members named as triosephosphate isomerases, and the EryH paper calls the Asn to
    Ser change typical of that group. The Yarrowia leaf YALI0F01584g lies in the erythritol utilisation gene cluster,
    is induced on erythritol and was proposed as the EryH counterpart (PMID:29910781). No fungal member has been
    assayed, and whether these proteins retain any triose-phosphate isomerase activity has not been tested. The
    process term follows the activity: PAINT prunes per term, so the loss is requested on this row as well as on
    GO:0004807.'
