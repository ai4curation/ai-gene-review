family_id: PANTHER:PTHR24086
family_name: NUCLEAR RECEPTOR SUBFAMILY 5 GROUP A
summary: NR5-family nuclear receptors are DNA-binding transcriptional regulators that include vertebrate
  steroidogenic and metabolic regulators and insect FTZ-F1 proteins. They share nuclear-receptor domain
  architecture while controlling lineage-specific developmental and physiological programs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: FTZ-F1 was purified as a sequence-specific DNA-binding factor and binding-site mutation
  reduced target-gene expression (PMID:2113881). Mammalian NR5A proteins rescued fly ftz-f1 mutants and
  activated the fly target gene (PMID:23340581), providing unusually strong cross-species evidence for
  conserved DNA-binding transcriptional regulation. This supports the broad molecular function across
  intact NR5 DNA-binding/receptor architecture. Steroid ligand responsiveness, steroidogenesis, bile-acid
  regulation and developmental timing remain branch-specific properties.
