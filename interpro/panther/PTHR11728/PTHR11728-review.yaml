family_id: PANTHER:PTHR11728
family_name: GLYCEROL-3-PHOSPHATE DEHYDROGENASE
summary: NAD(P)-dependent glycerol-3-phosphate dehydrogenases interconvert dihydroxyacetone phosphate
  and glycerol-3-phosphate while coupling to pyridine-nucleotide redox chemistry. Related paralogs serve
  glycerolipid metabolism, redox shuttling or lineage-specific glycerol production. They are distinct
  from the FAD-dependent mitochondrial shuttle enzyme.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The inventory contains both NAD- and NADP-using glycerol-3-phosphate dehydrogenases
  in cytosolic, glycosomal, plastid and mitochondrial contexts. Gpdh3/E1JIT1 has both N- and C-terminal
  NAD-dependent G3P-dehydrogenase domain signatures, supporting the enzymatic class despite its extension.
  Those signatures do not establish identical substrate affinity, regulation or physiological flux to
  Gpdh1, and NAD specificity cannot be granted to every family member.
subfamilies:
- subfamily_id: PANTHER:PTHR11728:SF8
  label: GLYCEROL-3-PHOSPHATE DEHYDROGENASE [NAD(+)]-RELATED
  description: The family subfamilies explicitly include cytosolic and chloroplast-directed NAD-dependent
    proteins. The unusually long fly Gpdh3 protein needs domain and isoform reconstruction before importing
    the activity or regulation of the shorter Gpdh1 enzyme. Length alone does not show inactivity, and
    a dehydrogenase-family match does not establish the exact in vivo pathway.
  representative_members:
  - id: UniProtKB:E1JIT1
    label: Glycerol-3-phosphate dehydrogenase [NAD(+)]
    gene_symbol: Gpdh3
    organism: Drosophila melanogaster
