family_id: PANTHER:PTHR24416
family_name: TYROSINE-PROTEIN KINASE RECEPTOR
preferred_name: Receptor tyrosine kinases (this review covers the discoidin domain receptor clade)
summary: >-
  PTHR24416 groups most metazoan receptor tyrosine kinases: single-pass transmembrane
  receptors with a variable ligand-binding ectodomain and a cytoplasmic tyrosine kinase
  domain, in 96 subfamilies (EGFR, insulin receptor, FGFR, PDGFR, Trk, DDR and others).
  This review covers only the discoidin domain receptor (DDR) clade below PAINT node
  PTN002400507 and the PAINT rows that reach it; the rest of the family is not reviewed
  here. The DDR clade spans Trichoplax, Nematostella, protostomes and deuterostomes. Its
  vertebrate members, DDR1 and DDR2, are collagen-activated receptor tyrosine kinases whose
  discoidin (DS) domain binds the GVMGFO motif of fibrillar collagens. A tree-wide residue
  survey shows two changes inside the clade: the collagen-binding pocket is conserved only
  in the vertebrate DDR node PTN007801558, and the dipteran Ddr node PTN002400510
  (Drosophila Ddr and Anopheles DDR) has lost the three canonical kinase catalytic residues.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins receptors for unrelated ligands (growth factors, insulin, neurotrophins,
  collagen), so no ligand-specific receptor activity holds family-wide; only generic
  transmembrane receptor protein tyrosine kinase activity is broadly shared. Within the DDR
  clade, collagen recognition by the DS-domain pocket is vertebrate-specific, and the
  dipteran Ddr branch has lost kinase catalytic residues and is a predicted pseudokinase.
