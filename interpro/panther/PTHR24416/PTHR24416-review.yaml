notes: >-
  Scope: only the DDR clade (PTN002400507) and the three PAINT rows that reach Drosophila
  Ddr through it are reviewed; the other RTK subfamilies and the remaining PAINT rows are not.
  Recommended PAINT actions: (1) move the GO:0005518 and GO:0038062 IBDs from PTN002400507
  (Eumetazoa) to the vertebrate DDR node PTN007801558; (2) add an IKR for GO:0004714 at the
  dipteran node PTN002400510. C. elegans ddr-1 (Q18163) is not in the DDR clade of this tree
  (it is in SF489) and is not covered. The PTN008618212 GO:0051897 IBD (positive regulation
  of phosphatidylinositol 3-kinase/protein kinase B signal transduction) also reaches the DDR
  clade and is not assessed here.
  An independent OpenScientist run on "Ddr has protein tyrosine kinase collagen receptor
  activity (GO:0038062)", with this review's residue analysis held out, concluded the term is
  supported. Its two decisive premises fail on the sequence: it reports a VAIK-type catalytic
  lysine in Drosophila Ddr, but Q59DZ7 has no VA[IV]K motif and no DFG anywhere (the beta3
  strand reads VAVA), and the KWIRWRS segment it calls the collagen-contacting loop aligns to
  DDR2 residues 128-134, which are not among the collagen contacts of the DDR2 DS
  domain-collagen structure (PMID:20004161). It agrees that the HRD aspartate is present. The
  assessments above are unchanged; the run is cited so the disagreement stays visible.
