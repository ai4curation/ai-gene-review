node_assessments:
  - node_id: PANTHER:PTN002400507
    asserted_term: {id: "GO:0005518", label: collagen binding}
    seeds:
      - {id: "UniProtKB:Q08345", label: DDR1, organism: Homo sapiens}
      - {id: "UniProtKB:Q16832", label: DDR2, organism: Homo sapiens}
      - {id: "MGI:MGI:99216", label: Ddr1, organism: Mus musculus}
      - {id: "MGI:MGI:1345277", label: Ddr2, organism: Mus musculus}
      - {id: "RGD:619855", label: Ddr2, organism: Rattus norvegicus}
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    evidence: IBD
    paint_snapshot: '20170830'
    assessment: TOO_DEEP
    assessment_reason: >-
      Every seed is a vertebrate DDR1 or DDR2 (human, mouse, rat), but the node is the
      Eumetazoan root of the DDR clade, so Trichoplax, Nematostella, nematode, arthropod and
      invertebrate deuterostome DDRs all inherit collagen binding. The DS-domain pocket that
      binds the GVMGFO motif of fibrillar collagens (Trp52, Thr56, Asp69, Arg105, Glu113 and
      the Cys73-Cys177 disulfide in DDR2) is conserved only in the vertebrate DDR node
      PTN007801558; every invertebrate DDR whose sequence covers the pocket has Trp52 and/or
      Asp69 replaced, including Ciona, amphioxus and sea urchin. No collagen-binding assay
      exists for an invertebrate DDR in the literature cached here. The IBD should sit at
      PTN007801558 (vertebrate DDR1 plus DDR2). Binding of collagen by invertebrate DDRs
      through another surface is not excluded and would need its own experimental seed.
      affected_subfamilies lists only the invertebrate DDR subfamilies with members checked
      here (fly Ddr, C. elegans DDR-2); the other invertebrate DDRs below the node (Ciona,
      amphioxus, sea urchin, Tribolium, Daphnia, Nematostella, Trichoplax, Pristionchus,
      leech) are equally affected.
    affected_subfamilies:
      - {id: "PANTHER:PTHR24416:SF580", label: "DISCOIDIN DOMAIN RECEPTOR, ISOFORM F"}
      - {id: "PANTHER:PTHR24416:SF634", label: DISCOIDIN DOMAIN-CONTAINING RECEPTOR TYROSINE KINASE B}
    supported_by:
      - reference_id: file:interpro/panther/PTHR24416/PTHR24416-bioinformatics/RESULTS.md
        supporting_text: only in the vertebrate DDR node PTN007801558.
      - reference_id: file:interpro/panther/PTHR24416/PTHR24416-bioinformatics/RESULTS.md
        supporting_text: 'and/or Asp69, including the deuterostomes: Ciona F6RMP9 (H47), amphioxus'
      - reference_id: PMID:20004161
        supporting_text: We conclude that Trp52 is indispensable for collagen recognition and signaling
          by DDR2.
  - node_id: PANTHER:PTN002400507
    asserted_term: {id: "GO:0038062", label: protein tyrosine kinase collagen receptor activity}
    seeds:
      - {id: "UniProtKB:Q08345", label: DDR1, organism: Homo sapiens}
      - {id: "UniProtKB:Q16832", label: DDR2, organism: Homo sapiens}
      - {id: "MGI:MGI:1345277", label: Ddr2, organism: Mus musculus}
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    evidence: IBD
    paint_snapshot: '20170830'
    assessment: TOO_DEEP
    assessment_reason: >-
      The term combines kinase activity with collagen as the activating ligand. The seeds are
      vertebrate only and the collagen-recognition pocket is conserved only in the vertebrate
      DDR node PTN007801558 (see the collagen binding row). In addition, the dipteran node
      PTN002400510 has lost all three kinase catalytic residues. Generic receptor tyrosine
      kinase activity for the kinase-competent invertebrate DDRs is already supplied by the
      PTN001230349 GO:0004714 IBD, so moving this IBD to PTN007801558 loses no supported
      annotation. Moving it is needed independently of the IKR recommended on the
      PTN001230349 row: PAINT prunes per annotation, so a loss of GO:0004714 does not block a
      more specific term asserted by a separate ancestral IBD. affected_subfamilies is limited
      as in the collagen binding row.
    affected_subfamilies:
      - {id: "PANTHER:PTHR24416:SF580", label: "DISCOIDIN DOMAIN RECEPTOR, ISOFORM F"}
      - {id: "PANTHER:PTHR24416:SF634", label: DISCOIDIN DOMAIN-CONTAINING RECEPTOR TYROSINE KINASE B}
    supported_by:
      - reference_id: file:interpro/panther/PTHR24416/PTHR24416-bioinformatics/RESULTS.md
        supporting_text: only in the vertebrate DDR node PTN007801558.
      - reference_id: file:interpro/panther/PTHR24416/PTHR24416-bioinformatics/RESULTS.md
        supporting_text: A789/S897/S910, Anopheles S634/S741/T754
  - node_id: PANTHER:PTN001230349
    asserted_term: {id: "GO:0004714", label: transmembrane receptor protein tyrosine kinase activity}
    evidence: IBD
    paint_snapshot: '20260828'
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Sound as a family-level receptor tyrosine kinase IBD, and the DDR clade keeps the kinase
      catalytic residues almost everywhere (vertebrate DDR1 and DDR2, Ciona, amphioxus, sea
      urchin, Tribolium, Daphnia, nematode DDR-2). The dipteran Ddr node PTN002400510 is the
      exception: both its leaves have the beta3 lysine, catalytic-loop asparagine and DFG
      aspartate replaced, so Drosophila Ddr and Anopheles DDR should not inherit the activity.
      The pruning belongs at PTN002400510 as a key-residue loss (IKR) of GO:0004714. That IKR
      would not stop GO:0038062: PAINT prunes per annotation, and the more specific
      GO:0038062 comes from a separate ancestral IBD at PTN002400507 that a GO:0004714 loss
      does not block (projects/IRD_EVIDENCE.md records 18 of 20 re-annotated IRD rows where an
      ancestral IBD carries a more specific term the loss leaves untouched). Both actions are
      therefore needed: the IKR here and moving the GO:0038062 IBD to PTN007801558. PAINT
      already prunes this IBD four times elsewhere in the family (two IRD and two IKR rows
      dated 20260828), so the instrument is precedented. Fly Ddr's cached GOA file
      carries the PTN001230349 IBA for GO:0007169 but has no GO:0004714 row, so the IKR
      guards against a propagation not present in that snapshot rather than removing an
      existing row. Kinase activity has never been
      assayed for any dipteran Ddr, so this rests on residue evidence alone.
