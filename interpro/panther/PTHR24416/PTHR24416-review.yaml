      - reference_id: file:interpro/panther/PTHR24416/PTHR24416-bioinformatics/RESULTS.md
        supporting_text: PTN002400510, not deeper.
residue_sites:
  - site_id: kinase_catalytic_triad
    label: Protein-kinase catalytic triad (beta3 Lys, catalytic-loop Asn, DFG Asp)
    description: >-
      The beta3-strand lysine of the VAIK/VAVK motif, the catalytic-loop asparagine of
      HRDLATRN and the DFG aspartate, which together position ATP and coordinate the
      Mg2+ ions needed for phosphotransfer. Positions are in human DDR2 numbering and were
      located by motif search on the DDR2 sequence; UniProt Q16832 curates Lys608 as an ATP
      binding site (FT BINDING 608, ECO:0000305), while Asn715 and Asp728 are motif-derived.
      The roles come from the cited literature on the canonical kinase motifs. The HRD
      aspartate is kept in all DDRs, including dipteran Ddr, and is not part of this site.
    anchor:
      id: UniProtKB:Q16832
      label: DDR2
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: LITERATURE
    residues:
      - position: 608
        expected: [K]
        role: beta3 lysine (ATP binding)
      - position: 715
        expected: [N]
        role: catalytic-loop asparagine (Mg2+ coordination)
      - position: 728
        expected: [D]
        role: DFG aspartate (Mg2+ binding)
    required_for:
      - term: {id: "GO:0004714", label: transmembrane receptor protein tyrosine kinase activity}
        strength: REQUIRED
        rationale: >-
          These residues are the canonical ATP- and metal-binding core of eukaryotic protein
          kinases; losing all three, as on the dipteran Ddr branch, is the signature of a
          pseudokinase. Single substitutions can be tolerated in some kinases, which is why the
          loss is called only where all three are replaced together.
        supported_by:
          - reference_id: PMID:23977024
            supporting_text: the VAIK motif in subdomain II that are responsible for ATP binding
              are degraded in TBCK
          - reference_id: PMID:23977024
            supporting_text: the aspartate residue of DFG motif in subdomain VII that is critical
              for metal binding in bona fide kinase has been substituted by lysine
          - reference_id: PMID:22820988
            supporting_text: A single Mg2+ ion is present in the structure, which is coordinated
              by Asn678 (catalytic loop)
    positive_controls:
      - {id: "UniProtKB:Q08345", label: DDR1, organism: Homo sapiens, control_position: 655, control_residue: K}
      - {id: "UniProtKB:Q95ZV7", label: ddr-2, organism: Caenorhabditis elegans, control_position: 554, control_residue: K}
    negative_controls:
      - {id: "UniProtKB:Q59DZ7", label: Ddr, organism: Drosophila melanogaster, control_position: 789, control_residue: A}
      - {id: "UniProtKB:A0A1S4GZW5", label: DDR, organism: Anopheles gambiae, control_position: 634, control_residue: S}
  - site_id: collagen_gvmgfo_pocket
    label: DS-domain pocket that binds the collagen GVMGFO motif
    description: >-
      Central residues of the amphiphilic pocket at the top of the DDR2 discoidin domain that
      accommodates the GVMGFO motif of fibrillar collagens I-III, from the DDR2 DS
      domain-collagen crystal structure: Trp52 and Thr56 on the apolar wall, the
      Cys73-Cys177 disulfide on the floor, and Asp69, Arg105 and Glu113 on the charged wall.
      Positions are as stated in the paper's text (DDR2 numbering), which reports the 1.6 A
      DS domain-collagen complex deposited as PDB:2WUH; they were not recomputed from the
      coordinates. The paper reports these residues strictly conserved in human DDR1; in the
      survey three unreviewed vertebrate models carry single substitutions. Trp52 and/or Asp69 are replaced in
      every invertebrate DDR examined (Ciona keeps Asp69, C. briggsae keeps Trp52). The
      Arg105-Glu113 salt bridge is conserved in every covered leaf, and the disulfide in every
      covered leaf except the C. briggsae model (Ser at Cys73).
    anchor:
      id: UniProtKB:Q16832
      label: DDR2
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: LITERATURE
    residues:
      - position: 52
        expected: [W]
        role: apolar pocket wall; W52A abolishes collagen binding by DDR2
      - position: 56
        expected: [T]
        role: apolar pocket wall
      - position: 69
        expected: [D]
        role: hydrogen bond to the collagen backbone
      - position: 105
        expected: [R]
        role: salt bridge with Glu113 that binds the Hyp of the collagen
      - position: 113
        expected: [E]
        role: salt bridge with Arg105
    required_for:
      - term: {id: "GO:0005518", label: collagen binding}
        strength: CONTRIBUTES
        rationale: >-
          The pocket is the fibrillar-collagen recognition site of vertebrate DDRs, and DDR2
          W52A neither binds collagen nor is activated by it. It is not REQUIRED for collagen
          binding in general: a DDR1 Trp53 mutant was reported still to be activated, and an
          invertebrate DDR could bind collagen through a different surface. Its absence
          therefore removes support for the vertebrate binding mode rather than proving loss.
        supported_by:
          - reference_id: PMID:20004161
            supporting_text: We conclude that Trp52 is indispensable for collagen recognition and
              signaling by DDR2.
          - reference_id: PMID:20004161
            supporting_text: are strictly conserved in DDR1, consistent with the binding of both
              receptors to fibrillar collagens
    positive_controls:
      - {id: "UniProtKB:Q08345", label: DDR1, organism: Homo sapiens, control_position: 53, control_residue: W}
    negative_controls:
      - {id: "UniProtKB:Q59DZ7", label: Ddr, organism: Drosophila melanogaster, control_position: 128, control_residue: H}
      - {id: "UniProtKB:Q95ZV7", label: ddr-2, organism: Caenorhabditis elegans, control_position: 47, control_residue: F}
