summary: TYROSINE-PROTEIN KINASE RECEPTOR (PANTHER:PTHR24416) is characterized in PANTHER PAINT across
  50 ancestral PTN node(s) (PANTHER:PTN000698827, PANTHER:PTN000699279, PANTHER:PTN000699407, PANTHER:PTN000699408
  (+46 more)) with 126 IBD node assertion(s) and 6 term(s) carrying negated IRD/IKR branch blocks, covering
  basal plasma membrane (GO:0009925, CC), epidermal growth factor receptor signaling pathway (GO:0007173,
  BP), neuron differentiation (GO:0030182, BP), negative regulation of apoptotic process (GO:0043066,
  BP) and 88 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR24416 (TYROSINE-PROTEIN KINASE RECEPTOR) span 50 distinct
  ancestral PTN nodes (PANTHER:PTN000698827, PANTHER:PTN000699279, PANTHER:PTN000699407, PANTHER:PTN000699408,
  PANTHER:PTN000699553 (+45 more)) with different molecular function assignments across clades (fibroblast
  growth factor receptor activity (GO:0005007), insulin receptor activity (GO:0005009), protein kinase
  activity (GO:0004672), transmembrane receptor protein tyrosine kinase activity (GO:0004714) and 22 additional
  molecular function term(s)), indicating clade-level functional specialization across the family.
