  name:
    name: Ergosterol Biosynthesis ERG27 Subfamily
    short: Ergosterol_Biosynth_ERG27
  description:
  - text: The ERG27 subfamily of the short-chain dehydrogenases/reductases (SDR) family
      is involved in the ergosterol biosynthesis pathway, particularly in the reduction
      of the keto group on the C-3 of sterols. Members of this family function as
      3-keto-steroid reductases and are catalytic components of the C-4 demethylation
      complex. This complex is part of the late steps of ergosterol synthesis, which
      mainly occurs in the endoplasmic reticulum membrane. The ergosterol biosynthesis
      pathway is crucial for the production of ergosterol, an essential component
      of fungal cell membranes. The ERG27 subfamily proteins facilitate the conversion
      of sterol intermediates, such as 4,4-dimethylfecosterol, into fecosterol via
      4-methylfecosterol, ultimately leading to the production of ergosterol. This
      process involves a series of demethylation, reduction, and desaturation reactions
      that are vital for maintaining cell membrane integrity and function in fungi.
