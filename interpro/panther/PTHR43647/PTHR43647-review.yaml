family_id: PANTHER:PTHR43647
family_name: DEHYDROGENASE
preferred_name: Fungal 3-ketosteroid reductase ERG27 family
summary: >-
  Fungal SDR-family 3-keto-steroid reductases of the sterol C-4
  demethylation complex. ERG27/erg27 reduces the 3-oxo sterol intermediates
  produced by the Erg25 methylsterol oxidase and Erg26 decarboxylating
  dehydrogenase during ergosterol biosynthesis; the budding-yeast protein is
  also a lipid-droplet pool that stabilizes oxidosqualene cyclase Erg7.
functional_coherence: COHERENT
coherence_reason: >-
  PTHR43647:SF1 contains the reviewed fungal ERG27 3-keto-steroid reductases
  and no paralogous sterol SDR branch in the current PTHR43647 member slice.
