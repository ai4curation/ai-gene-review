notes: >-
  The current PTHR43647 slice reaches reviewed S. cerevisiae, S. pombe,
  C. albicans, and A. fumigatus descendants with GO-Central ERG27 IBAs.
  Q6FIV3 is the N. glabratus PTHR43647:SF1 member and its UniProt record
  carries the exact EC/Rhea and ergosterol-biosynthesis IEAs, but it does not
  currently receive PTHR43647 GO-Central IBA rows; the CANGA review records
  that propagation gap in suggested_questions. A 2026-11-23 PubMed search for
  ERG27, Q5A888, Q6FIV3, Q4WQ42, and the relevant species names found no newer
  direct S. cerevisiae, S. pombe, Candida, Nakaseomyces, or A. fumigatus ERG27
  papers beyond the cached direct S. cerevisiae and C. albicans literature.
