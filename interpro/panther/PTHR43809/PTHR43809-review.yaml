family_id: PANTHER:PTHR43809
family_name: NITRITE REDUCTASE (NADH) LARGE SUBUNIT
preferred_name: NirB-type sirohaem nitrite reductase large subunit family
summary: >-
  The family contains the pyridine-nucleotide-linked sirohaem nitrite reductases:
  bacterial NirB/NasD large subunits, which reduce nitrite to ammonium together
  with a small NirD- or NasE-type partner, and the fungal single-chain NiiA/NIT-6
  enzymes. A member combines an FAD/NAD(P)-binding diaphorase module, a BFD-like
  [2Fe-2S] domain and the sirohaem/[4Fe-4S] catalytic domain shared with
  sulfite reductases. E. coli NirB (P08201), the reference, needs NirD for
  NADH-dependent activity, and Bacillus subtilis NasD needs NasE in the same way.
  The family also includes the Pseudomonas putida KT2440 and Mycolicibacterium
  smegmatis NirB orthologs, Klebsiella oxytoca NasB, and one Desulfovibrio protein
  annotated as an assimilatory-type sulfite reductase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All seven Swiss-Prot members fall in one subfamily (PTHR43809:SF1). The
  characterized bacterial and fungal members are NAD(P)H-dependent nitrite
  reductases. The Desulfovibrio vulgaris member (Q05805) is annotated as an
  assimilatory-type sulfite reductase; its substrate preference was not reviewed
  here, so nitrite reduction is not asserted for every member. Physiological
  context also varies: E. coli NirBD acts during nitrate respiration and can feed
  biosynthesis, whereas Bacillus NasDE and fungal NiiA are assimilatory.
