notes: >-
  Membership disagreement for NasD (P42435): UniProt and the InterPro-derived
  entries list place it in PTHR43809:SF1, while PANTHER 19.0's per-organism
  classification file places it in PTHR43429:SF3 with NasB. NasD keeps the
  sirohaem-binding signature (IPR006066) and NasD-like (IPR052034) entries shared
  with the other NirB large subunits here, which NasB lacks, so this review places
  NasD in PTHR43809:SF1 and pins it with a reasoned row in
  interpro/panther/panther-members-overrides.tsv.
