term_assessments:
- assessed_term:
    id: GO:0008942
    label: nitrite reductase [NAD(P)H] activity
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR43809:SF1
    label: NITRITE REDUCTASE (NADH) LARGE SUBUNIT
  scope_reason: >-
    The donor-generic pyridine-nucleotide nitrite reductase class is safe for the
    characterized NirB, NasD and NiiA members of SF1. In bacteria the large subunit
    needs its small partner (NirD or NasE) for activity, so the activity belongs to
    the two-subunit complex. The Desulfovibrio member whose substrate was not
    reviewed is the one caution inside SF1.
  supported_by:
  - reference_id: PMID:1435259
    supporting_text: No NADH-dependent nitrite reductase activity was detected in extracts from bacteria
      lacking either NirB or NirD, but a mixture of the two was as active as an extract from wild-type
      bacteria.
  - reference_id: PMID:9765565
    supporting_text: However, extracts prepared from LAB1943 and LAB1982 grown with nitrite or ammonium
      in the presence of IPTG had no significant nitrite reductase activity, indicating that both nasD
      and nasE genes are required for enzyme activity.
- assessed_term:
    id: GO:0106316
    label: nitrite reductase (NADH) activity
  scope: UNRESOLVED
  scope_reason: >-
    No residue site is known to set the donor preference. NADH preference is measured for E. coli NirBD and Bacillus NasDE (NADPH below
    10% of NADH), but not for the Pseudomonas or Mycolicibacterium orthologs, whose
    native assays used methyl viologen. NADH specificity must be established per
    member; the module and member reviews keep those orthologs at the donor-generic
    level.
  supported_by:
  - reference_id: PMID:9765565
    supporting_text: Activity with NADPH was less than 10% of that with NADH.
- assessed_term:
    id: GO:0050661
    label: NADP binding
  scope: UNRESOLVED
  scope_reason: >-
    The InterPro NirB mapping assigns NADP binding family-wide, but the
    characterized bacterial members use NADH. E. coli NirB and Bacillus NasD are
    reviewed as NAD binding; for the unmeasured Pseudomonas and Mycolicibacterium
    orthologs the NADP row is marked over-annotated.
  supported_by:
  - reference_id: file:genes/ECOLI/nirB/nirB-uniprot.txt
    supporting_text: /ligand="NAD(+)"
