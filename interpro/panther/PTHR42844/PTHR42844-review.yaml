family_id: PANTHER:PTHR42844
family_name: DIHYDRONEOPTERIN ALDOLASE 1-RELATED
preferred_name: Dihydroneopterin aldolase / epimerase (FolB/FolX) family
summary: >-
  Tunnel-fold enzymes acting on dihydroneopterin. Bacterial FolB (SF1) cleaves it to 6-hydroxymethyl-7,8-dihydropterin
  and glycolaldehyde in folate synthesis; FolX (SF10) epimerizes dihydroneopterin triphosphate. Fungi
  carry the aldolase as a domain of FOL1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Aldolase activity holds for SF1; FolX (SF10) is an epimerase.
