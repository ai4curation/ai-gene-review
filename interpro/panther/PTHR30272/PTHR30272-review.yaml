family_id: PANTHER:PTHR30272
family_name: 3-HYDROXYACYL-[ACYL-CARRIER-PROTEIN] DEHYDRATASE
preferred_name: FabZ/FabA (3R)-hydroxyacyl-ACP dehydratase family
summary: >-
  Hotdog-fold (3R)-hydroxyacyl-ACP dehydratases of bacterial type II fatty acid synthesis. FabZ (SF1)
  dehydrates intermediates of all chain lengths. FabA (SF8) also isomerizes trans-2-decenoyl-ACP
  to cis-3-decenoyl-ACP, opening the anaerobic route to unsaturated fatty acids.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Dehydratase activity is shared; the isomerase activity is FabA-specific (SF8).
