family_id: PANTHER:PTHR30272
family_name: 3-HYDROXYACYL-[ACYL-CARRIER-PROTEIN] DEHYDRATASE
preferred_name: FabZ/FabA (3R)-hydroxyacyl-ACP dehydratase family
summary: >-
  Hotdog-fold (3R)-hydroxyacyl-ACP dehydratases of bacterial and organellar
  type II fatty acid synthesis. FabZ (SF1) dehydrates intermediates of all
  chain lengths. FabA (SF8) also isomerizes trans-2-decenoyl-ACP to
  cis-3-decenoyl-ACP, opening the oxygen-independent route to unsaturated fatty
  acids in proteobacteria. Isomerase activity has also arisen within SF1: the
  Enterococcus faecalis FabZ homolog FabN (FabZ1) isomerizes, whereas its
  paralog FabZ does not, a difference set by the beta3/beta4 strands that shape
  the substrate tunnel rather than by the catalytic residues.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Dehydratase activity is shared across the family. The isomerase activity is
  general to the FabA subfamily (SF8) but occurs only in particular members of
  the FabZ subfamily (SF1), such as E. faecalis FabN, so it cannot be inferred
  from SF1 membership.
