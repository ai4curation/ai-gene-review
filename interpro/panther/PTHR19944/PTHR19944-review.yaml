family_id: PANTHER:PTHR19944
family_name: MHC CLASS II-RELATED
preferred_name: Beta-2-microglobulin, MHC class II alpha/beta chains, and Ig constant domains
summary: >-
  Jawed-vertebrate family of C1-set immunoglobulin-like proteins (IPR050160)
  that encompasses three structurally related but functionally distinct
  immunological lineages: (1) beta-2-microglobulin (PANTHER:PTHR19944:SF62,
  B2M), the invariant soluble 12 kDa C1-set Ig-fold light chain that pairs
  non-covalently with MHC class I heavy chains (HLA-A/B/C/E/F/G), CD1, MR1, HFE,
  and the neonatal Fc receptor heavy chain FCGRT (where B2M directly contacts
  IgG and albumin and is required for FcRn ER exit and endosomal salvage); (2)
  MHC class II alpha and beta chains (HLA-DP, HLA-DQ, HLA-DR, HLA-DM, HLA-DO),
  which form heterodimeric transmembrane receptors or peptide-loading chaperones
  on professional antigen-presenting cells; and (3) immunoglobulin constant
  domains (PANTHER:PTHR19944:SF98, IG-LIKE DOMAIN-CONTAINING PROTEIN / Ig
  lambda constant chains, and PANTHER:PTHR19944:SF91 IGHE).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PANTHER family PTHR19944 groups C1-set Ig-like domains across MHC class II
  alpha/beta chains, the MHC class I/FcRn light chain beta-2-microglobulin
  (PANTHER:PTHR19944:SF62), and immunoglobulin constant regions (SF98, SF91).
  Because these subfamilies assemble into completely different multiprotein
  complexes (MHC class I/FcRn/HFE heterodimers for B2M vs MHC class II
  alpha/beta heterodimers for HLA-DP/DQ/DR/DM/DO vs antibodies for IGLC/IGHE),
  molecular function and complex terms must be scoped to individual subfamilies.
reference_protein:
  id: UniProtKB:P61769
  label: Beta-2-microglobulin
  gene_symbol: B2M
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR19944:SF62
    label: BETA-2-MICROGLOBULIN
    description: >-
      Invariant soluble C1-set Ig-like beta chain (B2M/p14) that pairs with MHC
      class Ia/Ib heavy chains, CD1, MR1, HFE, and the neonatal Fc receptor
      heavy chain FCGRT, stabilizing their fold for ER export and contributing
      direct contact residues to the FcRn-IgG and FcRn-albumin binding
      interfaces.
    representative_members:
      - id: UniProtKB:P61769
        label: Beta-2-microglobulin
        gene_symbol: B2M
        organism: Homo sapiens
      - id: UniProtKB:P01887
        label: Beta-2-microglobulin
        gene_symbol: B2m
        organism: Mus musculus
      - id: UniProtKB:P07151
        label: Beta-2-microglobulin
        gene_symbol: B2m
        organism: Rattus norvegicus
    diverged_from_family: true
    divergence_description: >-
      Unlike transmembrane MHC class II alpha and beta chains that form an
      alpha1-beta1 peptide-binding groove, B2M is a soluble single-domain beta
      subunit that supports the alpha1-alpha2 platform of MHC class I and
      non-classical MHC-I-like heavy chains (FCGRT, HFE, CD1, MR1) without
      directly forming a peptide-binding cleft.
    supported_by:
      - reference_id: file:genes/human/B2M/B2M-uniprot.txt
        supporting_text: >-
          Component of the class I major histocompatibility complex (MHC).
          Involved in the presentation of peptide antigens to the immune system.
  - subfamily_id: PANTHER:PTHR19944:SF64
    label: HLA CLASS II HISTOCOMPATIBILITY ANTIGEN, DP ALPHA 1 CHAIN
    description: >-
      Transmembrane MHC class II DP alpha chain (HLA-DPA1) that pairs with
      HLA-DPB1 to bind exogenous peptides in late endosomal/lysosomal MIIC
      compartments and present them to CD4+ T cells.
    representative_members:
      - id: UniProtKB:P20036
        label: HLA class II histocompatibility antigen, DP alpha 1 chain
        gene_symbol: HLA-DPA1
        organism: Homo sapiens
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/human/HLA-DPA1/HLA-DPA1-uniprot.txt
        supporting_text: >-
          Binds peptides derived from antigens that access the endocytic route
          of antigen presenting cells (APC) and presents them on the cell
          surface for recognition by the CD4 T-cells.
  - subfamily_id: PANTHER:PTHR19944:SF86
    label: HLA CLASS II HISTOCOMPATIBILITY ANTIGEN, DR ALPHA CHAIN
    description: >-
      Transmembrane MHC class II DR alpha chain (HLA-DRA) that heterodimerizes
      with HLA-DRB chains to present exogenous peptide antigens.
    representative_members:
      - id: UniProtKB:P01903
        label: HLA class II histocompatibility antigen, DR alpha chain
        gene_symbol: HLA-DRA
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR19944:SF50
    label: HLA CLASS II HISTOCOMPATIBILITY ANTIGEN, DM ALPHA CHAIN
    description: >-
      Non-classical endosomal/lysosomal MHC class II chaperone subunit (HLA-DMA)
      that catalyzes CLIP release and peptide editing on classical MHC class II
      molecules.
    representative_members:
      - id: UniProtKB:P28067
        label: HLA class II histocompatibility antigen, DM alpha chain
        gene_symbol: HLA-DMA
        organism: Homo sapiens
    diverged_from_family: false
