  - assessed_term:
      id: GO:0019865
      label: immunoglobulin binding
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR19944:SF62
        label: BETA-2-MICROGLOBULIN
    scope_reason: >-
      Within PTHR19944, only the beta-2-microglobulin subfamily
      (PANTHER:PTHR19944:SF62, B2M) assembles with FCGRT into the neonatal Fc
      receptor (FcRn) complex and directly contacts the Fc region of IgG to
      protect circulating immunoglobulins and albumin from lysosomal
      hypercatabolism.
    supported_by:
      - reference_id: file:genes/human/B2M/B2M-uniprot.txt
        supporting_text: >-
          characterized by marked reduction in serum concentrations of
          immunoglobulins and albumin, and hypoproteinemia due to
          hypercatabolism. Patients may suffer from recurrent respiratory tract
          infections and severe skin disease. {ECO:0000269|PubMed:16549777}.
      - reference_id: file:genes/human/FCGRT/FCGRT-uniprot.txt
        supporting_text: >-
