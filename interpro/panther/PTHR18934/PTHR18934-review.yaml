family_id: PANTHER:PTHR18934
family_name: ATP-DEPENDENT RNA HELICASE
preferred_name: DEAH-related nucleic-acid helicases
summary: This family spans DEAH-related helicases with roles in RNA processing, genome defense and other
  nucleic-acid transactions, as well as viral proteins. Distinct accessory domains and interaction partners
  determine substrate choice and biological deployment. The YTHDC2 branch couples helicase activity to
  modified-RNA recognition, but that specialization is not shared by all family members.
functional_coherence: HETEROGENEOUS
coherence_reason: DEAH helicase relatives diversify in auxiliary domains and RNA pathways. Mammalian YTHDC2
  combines an RNA-stimulated ATPase/helicase module with m6A recognition and ankyrin-mediated XRN1 recruitment
  (PMID:29033321). Related helicases instead participate in splicing, germline RNA regulation or viral
  transcription. CG8915's verified YTHDC2-related classification supports a branch hypothesis, but m6A
  recognition, XRN1 recruitment and a particular RNA substrate require their relevant domains and cannot
  be inherited from the shared helicase core alone.
