    supporting_text: FT                   /note="Reverse transcriptase"
- assessed_term:
    id: GO:0006310
    label: DNA recombination
  scope: UNRESOLVED
  scope_reason: DIRS elements encode a tyrosine-recombinase-based integration system, but reverse transcriptase
    alone does not carry out DNA recombination. The mussel product has a reverse-transcriptase domain
    without an established companion recombinase system. A mobile-element comparison therefore cannot
    supply this process to every family member or to the selected sequence.
  supported_by:
  - reference_id: PMID:32170321
    supporting_text: 'DIRS-1 produces a mixture of single-stranded, mostly linear

      extrachromosomal cDNA intermediates'
  - reference_id: file:genes/MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
    supporting_text: FT   DOMAIN          174..349
  - reference_id: file:genes/MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
    supporting_text: FT                   /note="Reverse transcriptase"
- assessed_term:
    id: GO:0015074
    label: DNA integration
  scope: UNRESOLVED
  scope_reason: The DIRS experiments demonstrate productive retrotransposition requiring the internal
    complementary region and element-encoded machinery. These are requirements of a complete element,
    not consequences of any reverse-transcriptase domain. The mussel target and the hepadnaviral-like
    comparison set have no shared demonstrated integration mechanism, leaving the relevant branch boundary
    unresolved.
  supported_by:
  - reference_id: PMID:32170321
    supporting_text: 'DIRS-1 produces a mixture of single-stranded, mostly linear

      extrachromosomal cDNA intermediates'
  - reference_id: file:genes/MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
    supporting_text: FT   DOMAIN          174..349
