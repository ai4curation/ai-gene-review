family_id: PANTHER:PTHR33050
family_name: REVERSE TRANSCRIPTASE DOMAIN-CONTAINING PROTEIN
preferred_name: Reverse-transcriptase-containing proteins
summary: Reverse-transcriptase domains occur in different mobile-element and viral architectures. The
  retrieved reviewed entries emphasize hepadnaviral polymerases, which do not establish the life cycle
  or integration mechanism of a metazoan repeat-associated sequence.
functional_coherence: HETEROGENEOUS
coherence_reason: The mussel target contains a reverse-transcriptase domain, consistent with nucleic-acid
  engagement. DNA recombination and integration require additional machinery and cannot be inferred from
  reverse transcription alone. Distinguish hepadnavirus-like polymerase homology from a complete DIRS-like
  retroelement and verify companion domains before assigning an integration mechanism.
