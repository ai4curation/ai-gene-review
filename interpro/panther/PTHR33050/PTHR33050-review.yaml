term_assessments:
- assessed_term:
    id: GO:0003677
    label: DNA binding
  scope: UNRESOLVED
  scope_reason: Reverse-transcriptase architecture supports binding a nucleic-acid template/product during
    polymerization, but an isolated domain annotation does not establish catalytic integrity or DNA-binding
    competence of this mussel product. The DIRS study is an element-level comparison in Dictyostelium,
    not a direct assay of the selected protein. The complete functional architecture and family-wide binding
    boundary remain unresolved.
  supported_by:
