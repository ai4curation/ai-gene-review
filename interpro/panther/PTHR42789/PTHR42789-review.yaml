term_assessments:
- assessed_term:
    id: GO:0004617
    label: phosphoglycerate dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Held by the SerA members (mycobacterial, cyanobacterial and archaeal SerA, yeast SER3/SER33),
    but SF1, the family's only subfamily, also contains (S)-sulfolactate dehydrogenase SlcC and
    Thermotoga hydroxypyruvate reductase, so the activity cannot be granted family-wide or to the
    subfamily without a sequence determinant, which is not curated here.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42789/PTHR42789-entries.csv
    supporting_text: Q1QWN6,(S)-sulfolactate dehydrogenase,protein
  - reference_id: PMID:12525494
    supporting_text: >-
      These dehydrogenases catalyze the first reaction of serine and glycine biosynthesis from
      the glycolytic metabolite 3-phosphoglycerate.
- assessed_term:
    id: GO:0120568
    label: (R)-2-hydroxyglutarate (NAD+) dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Shown for yeast Ser3 and Ser33 (and, in other families, for E. coli SerA and human PHGDH), but
    not tested across this family; no PAINT node asserts it. It is a member-level secondary
    activity.
  supported_by:
  - reference_id: PMID:26774271
    supporting_text: >-
      Ser3 and Ser33, which are primarily known for oxidizing 3-phosphoglycerate in the main serine
      biosynthesis pathway
