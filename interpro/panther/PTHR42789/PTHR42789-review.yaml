family_id: PANTHER:PTHR42789
family_name: D-ISOMER SPECIFIC 2-HYDROXYACID DEHYDROGENASE FAMILY PROTEIN (AFU_ORTHOLOGUE AFUA_6G10090)
preferred_name: Type I (ASB/ACT-containing) D-3-phosphoglycerate dehydrogenases and relatives
summary: >-
  NAD-dependent D-isomer-specific 2-hydroxyacid dehydrogenases (InterPro IPR050857). The
  Swiss-Prot inventory is dominated by long-form D-3-phosphoglycerate dehydrogenases (SerA) of
  mycobacteria, cyanobacteria and methanogenic archaea, and includes budding-yeast SER3 and SER33,
  which catalyse the first step of phosphorylated L-serine biosynthesis and also reduce
  2-oxoglutarate to D-2-hydroxyglutarate. Other members are (S)-sulfolactate dehydrogenase SlcC,
  Thermotoga hydroxypyruvate reductase and uncharacterized staphylococcal 2-hydroxyacid
  dehydrogenases. PANTHER assigns all of them to a single subfamily, SF1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most characterized members are phosphoglycerate dehydrogenases, and the only PAINT node
  (PTN000107912, seeded by M. tuberculosis SerA) asserts that activity; a minority of members act on
  sulfolactate or hydroxypyruvate, so the subfamily assignment alone does not fix the substrate.
