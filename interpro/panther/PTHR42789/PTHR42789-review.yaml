notes: >-
  SER3 and SER33 are in PTHR42789:SF1 by their UniProt PANTHER cross-references but in
  PTHR10996:SF282 by PANTHER's own 19.0 classification files; the member index accepts both and
  warns. Until PANTHER and UniProt agree, MODULE:phosphorylated_serine_biosynthesis lists both
  families for step 1. The PAINT export for this family contains the same PTN000107912 rows as the
  PTHR43761 export.
