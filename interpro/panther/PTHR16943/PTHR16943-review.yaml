term_assessments:
- assessed_term:
    id: GO:0047547
    label: 2-methylcitrate dehydratase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Established biochemically for bacterial PrpD (E. coli, Salmonella) in SF8, and probable for the
    fungal PDH1-type proteins in SF16. PAINT asserts no node for this activity. The fungal
    cis-aconitate decarboxylases (CAD1, oryM) inside SF8 are exceptions, so the term should be
    transferred only to SF8 members with PrpD-type operon or pathway context.
  applicable_subfamilies:
  - id: PANTHER:PTHR16943:SF8
    label: 2-METHYLCITRATE DEHYDRATASE
  - id: PANTHER:PTHR16943:SF16
    label: 2-METHYLCITRATE DEHYDRATASE-RELATED
  supported_by:
  - reference_id: PMID:12473114
    supporting_text: PrpD is specific for (2S,3S)-methylcitrate (Km = 440 micro m)
  - reference_id: PMID:11294638
    supporting_text: Homogeneous PrpD enzyme did not contain an iron-sulfur center
- assessed_term:
    id: GO:0047613
    label: aconitate decarboxylase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Asserted by PAINT only for the animal ACOD1 clade (SF11). The fungal CAD1 enzymes, which sit in
    SF8, are not covered by that node, and the bacterial PrpD enzymes do not decarboxylate.
  applicable_subfamilies:
  - id: PANTHER:PTHR16943:SF11
    label: CIS-ACONITATE DECARBOXYLASE
  supported_by:
