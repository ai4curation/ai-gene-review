family_id: PANTHER:PTHR16943
family_name: 2-METHYLCITRATE DEHYDRATASE-RELATED
preferred_name: MmgE/PrpD family (2-methylcitrate dehydratases and cis-aconitate decarboxylases)
summary: >-
  The MmgE/PrpD family is unrelated in sequence to the aconitases. Its best-characterized members
  are the PrpD 2-methylcitrate dehydratases of the bacterial 2-methylcitrate cycle (Escherichia coli,
  Salmonella enterica, Mycobacterium tuberculosis, Corynebacterium glutamicum, Bacillus subtilis
  MmgE, Pseudomonas putida). They dehydrate (2S,3S)-2-methylcitrate to 2-methyl-cis-aconitate by a
  syn elimination, without an iron-sulfur cluster in the Salmonella enzyme. Yeast PDH1 is a
  probable mitochondrial 2-methylcitrate dehydratase. The family also contains cis-aconitate
  decarboxylases, which make itaconate: the immune-responsive ACOD1 (IRG1) of animals and the
  fungal CAD1 of Aspergillus terreus.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Two chemically different activities share the fold. The PrpD 2-methylcitrate dehydratases (SF8)
  and the probable fungal 2-methylcitrate dehydratases (SF16, yeast PDH1) act in propionate
  catabolism. The cis-aconitate decarboxylases act in itaconate production: animal ACOD1 forms SF11,
  but the fungal cis-aconitate decarboxylase CAD1 and the related oryM fall inside SF8 itself. SF8
  membership alone therefore does not establish 2-methylcitrate dehydratase activity.
