- node_id: PANTHER:PTN000023394
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000023392
    label: PTN000023392 (ancestral IBD node; IRD source)
  paint_snapshot: '20241119'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    PTN000023394 is the eukaryotic glycerol kinase node (189 leaves: GK/Gk, GK2, GK3P, GK5,
    Gykl1, Drosophila Gk1/Gk2, yeast GUT1, Arabidopsis GLPK and other plant, fungal and
    protist glycerol kinases). On the same date (2024-11-19) PAINT placed a mitochondrion IBD
    on this node and an IRD blocking the cytosol IBD carried by the parent node PTN000023392.
    That reads as a relocalization call (cytosol replaced by mitochondrion), but the
    eukaryotic enzyme is not a mitochondrial-only protein. The parent cytosol IBD is itself
    seeded by human GK (P32189) and mouse Gk (MGI:106594), both of which sit inside the IRD
    clade, so the IRD negates the localization of its own seeds; no lower node re-annotates
    cytosol. Yeast GUT1, a seed of the mitochondrion IBD here, is described as a known
    cytosolic enzyme whose mitochondrial import was shown as an additional, dual
    localization. The mammalian outer-membrane (porin-bound) pool and the testis GK2
    mitochondrial-sheath form are real, but they are additional or paralog-specific
    locations, not evidence that the clade has left the cytosol. The directly conflicting
    rows are individually weak: the mouse Gk IDA (PMID:27713003) is abstract-only and the
    abstract does not describe a localization assay, and Arabidopsis GLPK is an HDA from a
    size-exclusion proteome of a crude leaf cytosolic fraction. Their weight comes from
    agreeing with the seeds and with the yeast data. The mitochondrion IBD can stay, but the
    cytosol IRD should be retracted so the clade inherits both locations.
  supported_by:
  - reference_id: PMID:17054397
    supporting_text: Interestingly, although Gut1p and Gpd2p are known cytosolic enzymes, they
      are predicted mitochondrial candidates in our network.
  - reference_id: PMID:17054397
    supporting_text: To test this prediction, we performed mitochondrial import experiments and
      confirmed import of both Gut1p and Gpd2p, implying a novel dual cytosolic and mitochondrial
      localization
  - reference_id: PMID:25293756
    supporting_text: Applying this approach to the crude cytosolic fraction of Arabidopsis thaliana
      leaves using size exclusion chromatography
