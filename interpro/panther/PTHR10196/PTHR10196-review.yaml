    the committed tree check (PTHR10196-tree-check.txt, regenerated by tree_check.py in this
    folder from the PANTHER family tree, 434 reference-proteome leaves). The IBD at PTN000023392
    covers every leaf of the tree and is seeded by assayed glycerol kinases (E. coli GlpK, yeast
    GUT1, human GK P32189, mouse Gk, Drosophila Gk1/Gk2, Arabidopsis GLPK). PAINT negates the
    activity in three clades: PTN000023215 (SF57, SF85 and SF88 XYLULOSE KINASE; SF80 D-RIBULOSE
    KINASE), PTN000810447 (SF67 SEDOHEPTULOKINASE) and PTN000023530 (SF93 L-RHAMNULOKINASE and
    SF60 L-FUCULOKINASE). It also negates two single Drosophila leaves, recorded below as member
    exceptions. The applicable subfamilies are those the tree check classifies as INHERITS or
    INHERITS_WITH_LEAF_EXCEPTIONS: every leaf lies under the IBD and none, or only those single
    leaves, under a negated node. Direct experimental support within this set includes E. coli
    GlpK (SF69), yeast GUT1 (SF69), human GK (SF56, an IBD seed) and the kinase-inactive GK5
    phenotype in mouse (SF68). The other listed subfamilies inherit the gain without a loss and
    have no assays of their own here. Several of them (SF40, SF64, SF75, SF82, SF90, SF96) have
    no reviewed member in PTHR10196-entries.csv, so their placement rests on the tree alone.
