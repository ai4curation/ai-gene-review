term_assessments:
- assessed_term:
    id: GO:0004370
    label: glycerol kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Glycerol kinase activity is safe for SF69: E. coli GlpK (P0A6F3) has direct enzymological
    evidence, and yeast GUT1 (P32190) loses all glycerol kinase activity on disruption. NCU06005 and
    P. putida GlpK carry the glycerol-kinase-specific signatures (IPR005999, TIGR01311, HAMAP
    MF_00186). The family as a whole is heterogeneous, and PAINT negates the activity (IRD/IKR) in the
    xylulokinase, sedoheptulokinase, rhamnulokinase and Drosophila GK-like clades below
    PTN000023392, so no family-wide grant is made. SF68 is included because its reviewed member,
    human GK5, keeps glycerol kinase activity as its core function in the GK5 review (sebaceous
    gland glycerol 3-phosphate supply). Other subfamilies named GLYCEROL KINASE (SF56 with human GK,
    SF78, SF46/SF53 GK2, SF95 GK3) have no gene review here and are not adjudicated. The
    classical Neurospora study maps cytosolic glycerokinase genetically to glp-4 (PMID:6284716); it is
    organism-level context, not an assay of NCU06005.
