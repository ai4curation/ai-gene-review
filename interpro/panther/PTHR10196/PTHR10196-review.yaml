family_id: PANTHER:PTHR10196
family_name: SUGAR KINASE
summary: FGGY-family carbohydrate kinases contain paired domains that support ATP-dependent phosphorylation
  of carbohydrate substrates. Members differ in the small molecules they recognize and the metabolic pathways
  they serve.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory spans glycerol, xylulose, rhamnulose, ribulose and sedoheptulose kinases.
  NCU06005 has a specific glycerol-kinase signature and SF69 assignment, providing stronger substrate
  inference than the generic FGGY fold. The classical Neurospora study maps cytosolic glycerokinase genetically
  to glp-4 (PMID:6284716); without a verified molecular bridge to NCU06005 it is organism-level enzymatic
  context, not a direct assay of this accession. Glycerol kinase activity is experimentally
  established within SF69 for E. coli GlpK (P0A6F3) and yeast GUT1 (P32190), and SF69 also holds the
  bacterial GlpK of Pseudomonas putida KT2440 (Q88NX8) used in glycerol catabolism.
