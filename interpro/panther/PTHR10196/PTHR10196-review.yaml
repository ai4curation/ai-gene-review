notes: 'NEUCR/NCU06005: Q7S2F2, 584 aa, sequence version 3; cohorts NEUROSPORA20. Source extracts preserve
  evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification
  observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage
  stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked
  tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are
  not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what
  was emitted. Updated 2026-11-03 by Claude (AI-assisted) for the bacterial glycerol uptake and catabolism module: added E. coli GlpK as reference protein, SF69 representatives (E. coli and P. putida GlpK, yeast GUT1), node assessments for PTN000023392 and PTN000023541, and narrowed GO:0004370 from UNRESOLVED to SUBFAMILY_ONLY. A 2026-11-04 revision set the applicable subfamilies to every PTN000023392 descendant without a PAINT loss (mapped with the cached PANTHER 19.0 tree) and recorded the two Drosophila IRD/IKR leaves as member exceptions.'
