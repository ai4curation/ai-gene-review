term_assessments:
- assessed_term:
    id: GO:0004370
    label: glycerol kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The scope follows the PAINT gain-and-loss pattern for GO:0004370. The IBD at PTN000023392 is
    seeded by assayed glycerol kinases (E. coli GlpK, yeast GUT1, human GK P32189, mouse Gk, Drosophila
    Gk1/Gk2, Arabidopsis GLPK). PAINT then negates the activity in three clades: xylulokinase plus
    ribulokinase (PTN000023215: SF57, SF80, SF85, SF88), sedoheptulokinase (PTN000810447: SF67) and
    bacterial rhamnulokinase (PTN000023530: SF93, SF60). It also negates two single Drosophila genes,
    recorded below as member exceptions. The applicable subfamilies are the descendants of
    PTN000023392 with no negation on their lineage, mapped with the cached PANTHER 19.0 tree. They
    are the glycerol kinase clade under PTN000023394 (SF56 mammalian GK, SF46/SF53 GK2, SF95 GK3,
    SF68 GK5, SF64 Gykl1, SF96, SF40/SF82 insect Gk2/Gk1, SF75 fungal, SF90 plant, and the eukaryotic
    part of SF69) and the bacterial GlpK node PTN000023541 (SF69 and SF78). Direct experimental
    support within this set includes E. coli GlpK (SF69), yeast GUT1 (SF69), human GK (SF56, an IBD
    seed) and the kinase-dead GK5 phenotype in mouse (SF68). The other subfamilies are included
    because they inherit the gain without a loss; they have no assays of their own here.
