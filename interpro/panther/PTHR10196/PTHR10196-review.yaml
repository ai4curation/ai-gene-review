  assessment: SOUND
  assessment_reason: >-
    The glycerol kinase IBD is placed at a deep node spanning bacterial and eukaryotic glycerol
    kinases and is seeded by experimentally characterized enzymes from E. coli (GlpK), yeast (GUT1,
    SGD:S000001024), human and mouse GK, Drosophila and Arabidopsis. PAINT then negates the activity
    with IRD/IKR calls in the descendant clades that changed substrate (xylulokinase PTN000023215,
    sedoheptulokinase PTN000810447, bacterial rhamnulokinase plus L-fuculokinase PTN000023530, and Drosophila GK-like
    PTN000023432/PTN000023496), so the gain-plus-losses pattern confines inheritance to the
    glycerol kinase lineages, including SF69. The reviewed SF69 recipients (E. coli GlpK, yeast
    GUT1) retain the activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10196/PTHR10196-paint.tsv
    supporting_text: "PTHR10196\tPTN000023392\tGO:0004370\tF\tIBD\tfalse"
