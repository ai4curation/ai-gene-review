family_id: PANTHER:PTHR21240
family_name: 2-AMINO-3-CARBOXYLMUCONATE-6-SEMIALDEHYDE DECARBOXYLASE
preferred_name: ACMSD-like amidohydrolase-superfamily (cog2159) enzymes
summary: >-
  Zinc-dependent enzymes of the amidohydrolase superfamily ((beta/alpha)8 barrel, cog2159).
  The best characterized members are decarboxylases: human and rodent
  2-amino-3-carboxymuconate-6-semialdehyde decarboxylase (ACMSD, SF27) in tryptophan-NAD
  metabolism, and fungal decarboxylases such as Aspergillus nidulans OrsB (SF30). Subfamily
  SF28 holds Sphingobium sp. SYK-6 LigJ, which is not a decarboxylase but a hydratase that
  adds water across the C3=C4 double bond of (3Z)-2-keto-4-carboxy-3-hexenedioate (KCH) to
  form 4-carboxy-4-hydroxy-2-oxoadipate in the protocatechuate 4,5-cleavage and gallate
  catabolic routes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold, the zinc site and an acidic active-site general acid/base are shared, but the
  reaction differs between subfamilies (decarboxylation in SF27/SF30, hydration in SF28), so
  a carboxy-lyase term cannot be propagated family-wide.
