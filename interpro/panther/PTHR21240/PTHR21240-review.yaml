notes: >-
  Reviewed for the bacterial gallate catabolism module, where the SF28 LigJ hydratase
  performs the KCH-to-CHA step of the sphingomonad route. ACMSD is the reference protein as
  the family namesake with a complete gene review. Subfamilies SF29-SF31 and the PAINT tree
  topology were not adjudicated; the TOO_DEEP call on PTN000478401 relies on both reviewed
  non-fungal descendants rejecting the term.
