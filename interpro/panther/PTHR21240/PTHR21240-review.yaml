  description: >-
    Holds LigJ, the KCH hydratase of sphingomonad aromatic-acid catabolism. Despite the
    subfamily name, LigJ catalyzes reversible hydration, with the zinc ion polarizing the
    substrate carbonyl rather than activating water.
