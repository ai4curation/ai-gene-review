    label: dolichyl-phosphate beta-D-mannosyltransferase activity
  scope: UNRESOLVED
  scope_reason: The DPM1 dolichol-phosphate mannose reaction is directly established for intact eukaryotic
    catalytic proteins. It does not apply to the selected U4PF58 C-terminal peptide, which lacks the glycosyltransferase
    domain; broader family members may also differ in lipid acceptor. A family-wide activity grant is
    therefore unsupported. This is an exact-product exclusion, not rejection of DPM1 activity for the
    worm locus.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR43398-evidence.md
    supporting_text: 'This family belongs to glycosyltransferase 2 superfamily and consists of proteins
      similar to eukaryotic DPM1, including enzymes from bacteria and archaea.

      DPM1 is the catalytic subunit of eukaryotic dolichol-phosphate mannose (DPM) synthase. DPM synthase
      is required for synthesis of the glycosylphosphatidylinositol (GPI) anchor, N-glycan precursor,
      protein O-mannose, and C-mannose. In higher eukaryotes,the enzyme has three subunits, DPM1, DPM2
      and DPM3. DPM is synthesized from dolichol phosphate and GDP-Man on the cytosolic surface of the
      ER membrane by DPM synthase and then is flipped onto the luminal side and used as a donor substrate
      [[cite:PUB00089761]]. In Saccharomyces cerevisiae and Trypanosoma brucei, DPM synthase consists
      of a single component (Dpm1p and TbDpm1, respectively) that possesses one predicted transmembrane
      region near the C terminus for anchoring to the ER membrane. In contrast, the Dpm1 homologues of
      fission yeast, fungi, and animals, have no transmembrane region, suggesting the existence of adapter
      molecules for membrane anchoring [[cite:PUB00089762]].

      Polyprenol monophosphomannose synthase (Ppm1) also belongs to this family. Ppm1 is a bifunctional
      protein that transfers mannose from GDP-mannose to lipid acceptors to form polyprenol monophosphomannose
      (PPM), which acts as a sugar donor for lipoglycan synthesis in mycobacteria [[cite:PUB00089763]].'
