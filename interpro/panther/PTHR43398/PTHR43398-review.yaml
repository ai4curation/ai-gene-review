family_id: PANTHER:PTHR43398
family_name: DOLICHOL-PHOSPHATE MANNOSYLTRANSFERASE SUBUNIT 1
summary: DPM1-related glycosyltransferases transfer mannose from nucleotide-sugar donors to lipid-linked
  acceptors. Eukaryotic dolichol-phosphate mannose synthases differ in membrane-anchoring and subunit
  organization, while related microbial proteins supply other lipid-linked mannose donors.
functional_coherence: HETEROGENEOUS
coherence_reason: Lipid-linked mannose synthesis is supported for characterized members, but lipid acceptor,
  subunit organization and downstream pathways vary. The exact worm benchmark protein U4PF58 is only the
  final 51 residues of Q9TYJ7 and lacks the entire annotated glycosyltransferase domain. Sequence identity
  establishes its same-gene origin, while domain absence refutes assignment of the full catalytic reaction
  to that isolated peptide.
