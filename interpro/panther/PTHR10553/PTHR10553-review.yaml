family_id: PANTHER:PTHR10553
family_name: SMALL NUCLEAR RIBONUCLEOPROTEIN
summary: SmG/Lsm7-family proteins are small RNA-associated subunits of heptameric ribonucleoprotein rings.
  SmG participates in the canonical Sm ring of several spliceosomal snRNPs. Lsm7 instead participates
  in Lsm complexes, including the U6-associated ring and the cytoplasmic mRNA-decapping ring.
functional_coherence: HETEROGENEOUS
coherence_reason: Curated IPR044641 distinguishes the canonical Sm ring from nuclear Lsm2-8 and cytoplasmic
  Lsm1-7 rings. The inventory contains both SmG and Lsm7; NCU09880 maps to the SmG branch. RNA association
  is conserved, whereas decapping and U6-specific membership cannot be assigned to all SmG/Lsm7 relatives.
subfamilies:
- subfamily_id: PANTHER:PTHR10553:SF2
  label: SMALL NUCLEAR RIBONUCLEOPROTEIN G
  description: The distinction between SmG and Lsm7 is explicit in IPR044641 and in the family subfamily
    names. RNA association is conserved, but U1/U2/U4/U5 complex membership cannot be transferred to Lsm7,
    nor can cytoplasmic decapping be made a universal SmG function. NCU09880 maps to a SmG subfamily.
  representative_members:
