  name:
    name: G-protein-signaling modulator
    short: GPSM
  description:
  - text: The GPSM family includes guanine nucleotide dissociation inhibitors (GDIs)
      that regulate G-protein signaling independently of G protein-coupled receptors.
      Members of the GPSM family are involved in maintaining G(i/o) alpha subunits
      in their GDP-bound state, thus controlling heterotrimeric G-protein signaling.
      These proteins play crucial roles in mitotic spindle pole organization, cortical
      dynein-dynactin complex recruitment, and metaphase spindle orientation. They
      are also essential for asymmetric cell divisions in cerebral cortical progenitors
      and may influence macroautophagy in intestinal cells. Additionally, GPSM family
      members are implicated in drug addiction pathways.
