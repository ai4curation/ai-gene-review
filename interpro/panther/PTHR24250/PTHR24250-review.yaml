notes: |-
  DROME/scaf: Q7K5M0, 655 aa, sequence version 1; cohorts FLY_NEXT20. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | Q7K5M0 (fruit_fly / 3669) | PTHR24250:SF27 — ELASTASE 2 LIKE | PTHR24260:SF145 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  Scarface Q7K5M0 is a secreted regulator of epithelial morphogenesis and laminin organization. The published sequence analysis reports loss of the canonical serine-protease catalytic triad (PMID:20379222); the retained fold and historical elastase-like label do not show elastin cleavage or any other endopeptidase activity. This biological evidence remains valid despite unresolved parent placement. The cached inventory records active chymotrypsins and inactive PRSS54 proteins Q6AY28, Q6PEW0 and Q7M756. Those three species represent one orthologous comparison group, not three independent evolutionary losses of catalysis. The official rat row 11924 (Q6AY28) and mouse row 6727 (Q7M756) both record PTHR24250:SF45, INACTIVE SERINE PROTEASE 54. Human Q6PEW0 instead occurs in row 17811 as PTHR24256:SF545 with the same subfamily name. Rat and mouse therefore provide exact in-family classification support for the inactive orthologous group; human PRSS54 is comparative biology outside asserted PTHR24250 membership. Classification labels do not replace the biochemical evidence for inactivity.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR24250/PTHR24250-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

