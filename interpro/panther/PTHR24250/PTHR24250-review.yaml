  DROME/scaf: Q7K5M0, 655 aa, sequence version 1; cohorts FLY_NEXT20. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:Q7K5M0: the frozen UniProt record records PTHR24250:SF27 (ELASTASE 2 LIKE), whereas the authenticated official PANTHER 19.0 fruit_fly sequence-classification row 3669 records PTHR24260:SF145 (FI17609P1-RELATED). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Withdraw the specific scaf membership assertion; retain HETEROGENEOUS on independent cached PRSS54 entries and keep the already-UNRESOLVED endopeptidase scope. Scarface biology and its original classification are retained as comparative evidence.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

  Preserved previous placement and biological interpretation (historical evidence; membership assertions below are not current claims):
  summary: Chymotrypsin-related proteins include active serine proteases and noncatalytic protease-fold
    proteins. Drosophila Scarface is a secreted regulator of epithelial morphogenesis and laminin organization
    that lacks the canonical protease catalytic triad. Its retained fold does not establish endopeptidase
    activity.
  coherence_reason: The inventory contains active chymotrypsins alongside inactive serine protease 54 and
    Scarface. Scarface Q7K5M0 is secreted and controls epithelial laminin distribution, with published sequence-based
    loss of the canonical catalytic triad (PMID:20379222). Thus catalytic activity is not family-wide. Its
    official SF27 elastase-like label is a classification label, not evidence that Scarface cleaves elastin
    or other proteins.
  original_subfamily:
    subfamily_id: PANTHER:PTHR24250:SF27
    label: ELASTASE 2 LIKE
    description: Verified sequence-classification group containing scaf. Functional transfer is qualified
      in the family and term assessments.
