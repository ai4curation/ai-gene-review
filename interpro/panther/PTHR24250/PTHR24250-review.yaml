family_id: PANTHER:PTHR24250
family_name: CHYMOTRYPSIN-RELATED
summary: Chymotrypsin-related proteins include active serine proteases and noncatalytic protease-fold
  proteins. A retained protease fold does not establish endopeptidase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The cached inventory contains active chymotrypsins and inactive PRSS54 proteins. Official PANTHER
  19.0 rat Q6AY28 and mouse Q7M756 rows independently place this inactive orthologous group in
  PTHR24250:SF45, supporting a protease/pseudoprotease distinction. Human Q6PEW0 is officially
  placed in PTHR24256:SF545 and remains comparative evidence only. These orthologs do not represent
  independent losses of catalysis. Scarface has conflicting parent assignments and likewise remains
  outside structured membership.
subfamilies:
- subfamily_id: PANTHER:PTHR24250:SF45
  label: INACTIVE SERINE PROTEASE 54
  description: >-
    Rat Prss54 and mouse Prss54 are independently corroborated by official rows 11924 and 6727. They represent
    one inactive orthologous group, not two independent losses of catalysis. Human PRSS54 and Drosophila
    Scarface have positive cross-parent conflicts and remain outside asserted membership.
  representative_members:
  - id: UniProtKB:Q6AY28
    gene_symbol: Prss54
    organism: Rattus norvegicus
  - id: UniProtKB:Q7M756
    gene_symbol: Prss54
    organism: Mus musculus
term_assessments:
- assessed_term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  scope: UNRESOLVED
  scope_reason: >-
    The cached active chymotrypsins and inactive PRSS54 biology, with official in-family rows for rat
    Q6AY28 and mouse Q7M756, distinguish protease-fold membership from serine endopeptidase activity.
    Human Q6PEW0 and Scarface Q7K5M0 have different official parents. Scarface lacks the canonical catalytic
    triad and controls epithelial laminin distribution (PMID:20379222), but is not used as the decisive
    in-family counterexample. The boundary between catalytically active and inactive branches has not
    been mapped to a supported subfamily or residue rule, so a transferable activity scope remains unresolved.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR24250-evidence.md
    supporting_text: Lacks the conserved residues within the catalytic triad, probably resulting in a
      loss of proteolytic activity
