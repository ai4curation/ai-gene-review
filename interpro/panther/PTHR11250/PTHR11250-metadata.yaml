  name:
    name: Tachykinin Peptide
    short: Tachykinin
  description:
  - text: The Tachykinin family comprises peptides known for their ability to excite
      neurons, induce behavioral responses, act as potent vasodilators and secretagogues,
      and affect smooth muscle contraction. They play roles in pain modulation, inflammation,
      and various physiological responses such as plasma extravasation, mast cell
      degranulation, muscle contraction, salivary secretion, and sperm motility. Some
      tachykinins are involved in the survival and proliferation of B lineage cells,
      lowering arterial pressure, and modulating immune responses. They interact with
      specific receptors, such as the NK-1 receptor, and can influence learning, memory,
      social behavior, and recovery of postural balance.
