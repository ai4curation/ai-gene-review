    label: identical protein binding
  scope: UNRESOLVED
  scope_reason: Photomedin-1 is experimentally secreted as disulfide-bonded dimers, providing a concrete
    OLFML2A self-association result. Other olfactomedins have different oligomeric architectures and proteolytic
    processing. Retention of the relevant association region, not merely the olfactomedin domain, determines
    whether this interaction transfers.
