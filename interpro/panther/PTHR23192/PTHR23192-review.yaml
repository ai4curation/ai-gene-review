- assessed_term:
    id: GO:0031012
    label: extracellular matrix
  scope: UNRESOLVED
  scope_reason: Photomedins are experimentally secreted extracellular proteins that bind selected glycosaminoglycans.
    Extracellular presence and matrix binding support an ECM-associated hypothesis for OLFML2A orthologs
    but do not establish stable ECM membership for every olfactomedin protein. The short primate sequence
    and altered horse leader require product-specific secretion checks.
  supported_by:
  - reference_id: PMID:15836428
    supporting_text: preferentially bound to chondroitin sulphate-E and heparin
  - reference_id: PMID:15836428
    supporting_text: 'These proteins, named photomedin-1 and photomedin-2,

      were secreted as disulphide-bonded dimers (photomedin-1) or oligomers/multimers

      (photomedin-2) with O-linked carbohydrate chains'
  - reference_id: PMID:15836428
