family_id: PANTHER:PTHR23192
family_name: OLFACTOMEDIN-RELATED
preferred_name: Olfactomedin-domain extracellular proteins
summary: Olfactomedin-domain proteins include OLFML2A/2B, noelins, myocilin and gliomedin. Extracellular
  and membrane-associated architectures occur, with distinct ligand interactions, tissue distributions
  and matrix or signaling roles.
functional_coherence: HETEROGENEOUS
coherence_reason: Mouse OLFML2A/photomedin experiments support extracellular localization and glycosaminoglycan
  binding. This is a justified starting point for OLFML2A ortholog comparison, but matrix residence, matrix
  assembly and specific binding each require their own evidence. The short primate target and the horse
  gene-model differences require separate completeness checks; no single matrix function is safe across
  the entire olfactomedin family.
