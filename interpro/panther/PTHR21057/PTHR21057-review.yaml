family_id: PANTHER:PTHR21057
family_name: PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE
preferred_name: KDO 8-phosphate synthases (KdsA)
summary: >-
  3-deoxy-D-manno-octulosonate 8-phosphate (KDO8P) synthases (KdsA, EC 2.5.1.55) of the class-I DAHP synthase TIM-barrel
  fold, which condense phosphoenolpyruvate with D-arabinose 5-phosphate to give KDO8P, the second step of KDO synthesis.
  All 323 reviewed members are named as KDO8P synthases (2-dehydro-3-deoxyphosphooctonate aldolases), and every
  leaf of the PANTHER tree (bacteria, plants and a few other eukaryotes) falls in the single subfamily SF2. The
  PANTHER family name refers to the related DAHP synthase reaction, but no DAHP synthase is among the members.
functional_coherence: COHERENT
coherence_reason: >-
  The tree has one subfamily, the root carries KDO8P synthase activity seeded by E. coli KdsA and both Arabidopsis
  KDSA genes, and there are no negated (IRD/IKR) nodes. Paralog pairs such as KT2440 KdsA1 and KdsA2 are both KDO8P
  synthases.
