family_id: PANTHER:PTHR45915
family_name: TRANSCRIPTION INTERMEDIARY FACTOR
preferred_name: TIF1 / class VI TRIM proteins (TRIM24, TRIM28, TRIM33, TRIM66) with BAZ2A/BAZ2B
summary: 'PTHR45915 groups chromatin-associated proteins whose C-terminal PHD finger is followed by a
  bromodomain. InterPro and UniProt list six human members. Four are the class VI TRIM proteins (transcription
  intermediary factor 1 group): TRIM24/TIF1alpha, TRIM28/KAP1/TIF1beta, TRIM33/TIF1gamma and TRIM66/TIF1delta.
  The other two are the RING-less, non-TRIM bromodomain-adjacent proteins BAZ2A and BAZ2B. PANTHER''s
  own 19.0 human classification file places TRIM28 in PTHR25462:SF229 instead. The conserved function
  is transcriptional regulation and chromatin association. TRIM28 is the KRAB zinc-finger co-repressor,
  TRIM24 a nuclear receptor co-regulator, TRIM33 a TGF-beta/SMAD regulator, and BAZ2A a subunit of the
  NoRC remodelling complex. Ubiquitin ligase activity is not a family property. TRIM66, BAZ2A and BAZ2B
  have no RING domain. TRIM24, TRIM28 and TRIM33 have RINGs that are constitutively monomeric in isolation
  and show no intrinsic E3 activity in vitro, so their reported ubiquitination activities in cells
  appear to depend on activating partners or other context. The TRIM28 PHD acts as an intramolecular
  SUMO E3 for the adjacent bromodomain, and TRIM28 is also reported as a SUMO E3 for PCNA.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'The family is held together by a PHD-bromodomain chromatin-reader architecture, not
  by catalysis. It contains no-RING non-TRIM members (BAZ2A in PTHR45915:SF5 and BAZ2B in SF1) and a
  no-RING TRIM (TRIM66, SF7). The three RING-containing TRIMs (TRIM24 SF4, TRIM33 SF3, TRIM28 SF8) have
  RINGs that are intrinsically inactive in isolation. The reported E3 activities of these three are
  context-dependent and come mostly from cell-based work: TRIM24 toward p53, TRIM33 toward SMAD4, and
  TRIM28 with MAGE proteins. TRIM28 has an additional SUMO E3 activity that the others are not known
  to share.'
