term_assessments:
- assessed_term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  scope: SUBFAMILY_ONLY
  scope_reason: 'At most this applies to the three RING-containing TRIM subfamilies (TRIM24, TRIM33,
    TRIM28), and even for those it should be read as conditional. Their isolated RINGs are monomeric
    and inactive, and the class VI proteins are proposed to need activating events or partners. The
    term does not apply to TRIM66 (SF7) or to the non-TRIM BAZ2A (SF5) and BAZ2B (SF1), none of which
    has a RING. Curated experimental annotations on TRIM24, TRIM33 and TRIM28 are accepted here as the
    curators made them. Ligase activity should not be extended to new members of this family by sequence
    similarity.'
