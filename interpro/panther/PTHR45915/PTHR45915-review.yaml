notes: 'This review is a companion to the PTHR24103 TRIM review and was prompted by PMID:42746740. The
  family metadata, member list and PAINT slice were fetched for it with just fetch-panther-family and
  just fetch-panther-paint. Membership sources disagree for TRIM28. The InterPro member list and the
  UniProt cross-reference give PTHR45915:SF8, but PANTHER 19.0''s human HMM classification gives PTHR25462:SF229
  (TRANSCRIPTION INTERMEDIARY FACTOR 1-BETA). That would explain why TRIM28 sits under the cross-family
  node PTN008619076 with TRIM45 and TRIM56 (both PTHR25462). TRIM28 is kept under SF8 here and the validator
  accepts both placements; its biology is assessed regardless of which family it falls in. Recommendations for gene level: TRIM66 should not keep the GO:0061630 IBA
  because it has no RING. The TRIM28 GOA annotation GO:0004842 ubiquitin-protein transferase activity
  (IDA, PMID:18082607, UniProt, 2011) cites a paper whose abstract and full text describe SUMO E3 activity
  of the KAP1 PHD domain. The same paper also supports TRIM28 GO:0016925 protein sumoylation (IDA).
  A TRIM28 gene review should therefore treat the GO:0004842 line as a probable mis-mapping and MODIFY
  it to GO:0019789. TRIM28 currently has no gene review in this repo. BAZ2A and BAZ2B carry no ubiquitin
  ligase annotations, which is consistent with this review.'
