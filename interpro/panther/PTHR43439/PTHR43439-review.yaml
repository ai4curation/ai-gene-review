    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: >-
    PTN000644795 is the bacterial PaaK clade (TreeGrafter PTHR43439:AN23, subfamily SF1). The seed,
    E. coli PaaK, has a curated phenylacetate-CoA ligase reaction from direct assay (PMID:9748275),
    and the same activity was used to make phenylacetyl-CoA in the pathway reconstitution
