family_id: PANTHER:PTHR43439
family_name: PHENYLACETATE-COENZYME A LIGASE
preferred_name: Phenylacetate-CoA ligase (PaaK) and fungal adenylate-forming reductase family
summary: >-
  An adenylate-forming enzyme (ANL superfamily, Pfam PF00501 AMP-binding) family with two
  functionally distinct branches. The bacterial branch (SF1) is the phenylacetate-CoA ligases
  (PaaK), which activate phenylacetate to phenylacetyl-CoA with ATP and CoA -- the first and
  committed step of the aerobic phenylacetate ("hybrid", CoA-thioester) catabolic pathway found
  in E. coli, Pseudomonas, Burkholderia, Aromatoleum and many other bacteria. PaaK proteins form
  a distinct subgroup of the adenylate-forming enzymes, with a characteristic N-terminal
  microdomain. The second branch (SF2) is a set of large fungal multidomain proteins annotated as
  adenylate-forming reductases and non-canonical non-ribosomal peptide synthetases (Fusarium FUB8,
  Aspergillus/Emericella cicB, Serpula Nps9/Nps11, Heterobasidion Nps10, Stachybotrys stbB, and an
  uncharacterized S. pombe protein), which carry an adenylation domain but act in secondary
  metabolism by reducing an adenylated, carrier-tethered acid rather than by forming a free
  CoA thioester.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins two groups whose shared property is only carboxylate adenylation. SF1 (PaaK)
  are bona fide phenylacetate-CoA ligases of bacterial phenylacetate catabolism. SF2 are fungal
  multidomain adenylate-forming reductases / non-canonical NRPS proteins (FUB8, cicB, Nps9-11,
  stbB, SDG1, ascB) acting in secondary-metabolite biosynthesis; they are ~1,000-residue
  proteins, not ~440-residue stand-alone ligases, and no CoA-ligase activity is documented for
  them. Neither the CoA-ligase activity nor phenylacetate catabolism is therefore safe at family
  level; both belong on the bacterial PaaK clade.
