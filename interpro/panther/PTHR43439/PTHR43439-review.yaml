- node_id: PANTHER:PTN000644789
  asserted_term:
    id: GO:0016405
    label: CoA-ligase activity
  evidence: IBD
  paint_snapshot: '20241126'
  seeds:
  - id: UniProtKB:P76085
    label: paaK
    organism: Escherichia coli (strain K12)
  assessment: TOO_DEEP
  assessment_reason: >-
    PTN000644789 is PTHR43439:AN0, the family root, so the CoA-ligase term descends to both
    branches. Its only seed is E. coli PaaK. CoA-ligase activity is well established for the
    bacterial PaaK clade (SF1), which already carries the more specific phenylacetate-CoA ligase
    IBD at PTN000644795, but the fungal SF2 branch consists of multidomain adenylate-forming
    reductases / non-canonical NRPS enzymes for which no CoA-thioester-forming activity is
    documented. The function arose (or is only evidenced) on the PaaK branch, so the root
    placement makes SF2 inherit a term it has no support for. The assertion belongs at
    PTN000644795 (where it is already implied by GO:0047475).
