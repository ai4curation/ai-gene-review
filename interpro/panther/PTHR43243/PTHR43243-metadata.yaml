  name:
    name: Cationic Amino Acid Transporter (CAT)
    short: CAT
  description:
  - text: The Cationic Amino Acid Transporter (CAT) family is part of the amino acid-polyamine-organocation
      (APC) superfamily and is characterized by its role in the transport of cationic
      amino acids such as L-arginine, L-lysine, L-ornithine, and L-homoarginine. Members
      of the CAT family function as permeases with varying affinities and capacities,
      facilitating the uptake of these amino acids across cellular membranes. These
      transporters operate through different mechanisms, including high-affinity,
      low-capacity systems, low-affinity, high-capacity systems, and uniporters that
      mediate passive diffusion in a sodium ion- and pH-independent manner. Some family
      members are also involved in the transport of branched-chain amino acids and
      other substrates like 4-aminobutanoate (GABA), highlighting their diverse substrate
      specificity. The CAT family plays a crucial role in amino acid homeostasis and
      is implicated in various physiological processes, including macrophage activation
      and regulation of metabolic pathways.
