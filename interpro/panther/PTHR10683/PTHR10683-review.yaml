  scope: FAMILY_WIDE
  scope_reason: >-
    Group transfer of the dihydroxyacetone unit from a ketose donor to an aldose acceptor is shared by
    the classical transaldolases of SF18, SF36, SF31 and SF16, by the type-3 transaldolases of SF40,
    and by the SF40 sulfofructose transaldolases SqvA and SftT, for which no specific GO term exists
    (EC 2.2.1.14); GO:0016744 is the term their gene reviews and the sulfoquinovose catabolism module
    use. Parsing the member inventory shows that every member outside the fructose-6-phosphate
    aldolases is named as a transaldolase, so the term is recorded family-wide. The 24 SF40
    fructose-6-phosphate aldolases and the 2 probable fructose-6-phosphate aldolases that make up SF28
    are acceptor-independent aldolases and are excepted by name. The narrower GO:0004801 transaldolase
    activity keeps its own SUBFAMILY_ONLY assessment above.
