family_id: PANTHER:PTHR10683
family_name: TRANSALDOLASE
preferred_name: Transaldolase family (Tal/TALDO1, with fructose-6-phosphate aldolase)
summary: >-
  Class I aldolases that move a dihydroxyacetone unit from sedoheptulose 7-phosphate to glyceraldehyde
  3-phosphate in the non-oxidative pentose phosphate pathway. The family contains bacterial TalA/TalB,
  S. cerevisiae TAL1 and NQM1, S. pombe tal1 and human TALDO1, and the bacterial fructose-6-phosphate
  aldolases (Fsa), which cleave fructose 6-phosphate without a phosphorylated donor acceptor pair.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Transaldolase activity holds in SF18, SF36, SF31 and SF16. The fructose-6-phosphate aldolases (SF40,
  and probably the Fsa-like SF28) catalyse a related aldol cleavage instead.
