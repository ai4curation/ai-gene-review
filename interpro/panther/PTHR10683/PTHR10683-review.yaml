notes: >-
  Module consistency: both pentose phosphate modules select PTHR10683; SF18 alone covers all their
  representatives. The bacterial sulfoquinovose catabolism module selects PTHR10683 for its
  sulfofructose transaldolase step with SqvA and SftT, both in SF40 (checked in entries.csv and the
  UniProt DR PANTHER lines; SF40 name verified in panther.obo); GO:0016744 covers them. The existing
  GO:0004801 scope still excludes SF40 because that subfamily mixes type-3 transaldolases with Fsa
  aldolases and sulfofructose transaldolases (whose physiological donor is not sedoheptulose
  7-phosphate); the type-3 transaldolases of SF40 are not covered by any GO:0004801 scope here.
