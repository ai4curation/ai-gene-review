family_id: PANTHER:PTHR10683
family_name: TRANSALDOLASE
preferred_name: Transaldolase family (Tal/TALDO1, with fructose-6-phosphate aldolase)
summary: >-
  Class I aldolases that move a dihydroxyacetone unit from sedoheptulose 7-phosphate to glyceraldehyde
  3-phosphate in the non-oxidative pentose phosphate pathway. The family contains bacterial TalA/TalB,
  S. cerevisiae TAL1 and NQM1, S. pombe tal1 and human TALDO1, and the bacterial fructose-6-phosphate
  aldolases (Fsa), which cleave fructose 6-phosphate without a phosphorylated donor acceptor pair.
  Subfamily SF40 also holds the 6-deoxy-6-sulfo-D-fructose transaldolases (EC 2.2.1.14) of the
  sulfo-TAL (sulfo-SFT) sulfoquinovose degradation pathway, SqvA of Bacillus megaterium and SftT of
  Bacillus aryabhattai, which transfer the dihydroxyacetone unit of sulfofructose to
  glyceraldehyde 3-phosphate or erythrose 4-phosphate, releasing 3-sulfolactaldehyde.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Transaldolase activity holds in SF18, SF36, SF31 and SF16. SF40 is mixed: 125 of its 151 SwissProt
  members are type-3 transaldolases (Tal, for example Thermoplasma acidophilum), 24 are
  fructose-6-phosphate aldolases (Fsa) that catalyse an acceptor-independent aldol cleavage instead,
  and 2 are sulfofructose transaldolases (SqvA, SftT) that use a sulfonated donor. The Fsa-like SF28
  probably also lacks transaldolase activity. The group-transfer chemistry (GO:0016744) is common to
  all but the aldolases.
