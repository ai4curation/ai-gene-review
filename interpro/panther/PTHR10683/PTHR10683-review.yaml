  label: TRANSALDOLASE
  description: Transaldolases of fungi, animals and Pseudomonas (TAL1, NQM1, tal1, TALDO1).
  representative_members:
  - id: UniProtKB:P15019
    gene_symbol: TAL1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/TAL1/TAL1-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR10683:SF40
  label: FRUCTOSE-6-PHOSPHATE ALDOLASE 1-RELATED
  description: >-
    Mixed subfamily (151 SwissProt members in the local inventory): type-3 transaldolases (125),
    fructose-6-phosphate aldolases Fsa (24) and the sulfofructose transaldolases SqvA and SftT (2)
    of the sulfo-TAL sulfoquinovose pathway.
  representative_members:
  - id: UniProtKB:D5E1T2
    label: 6-deoxy-6-sulfo-D-fructose transaldolase
    gene_symbol: sqvA
    organism: Priestia megaterium QM B1551
    gene_review: genes/PRIM1/sqvA/sqvA-ai-review.yaml
  - id: UniProtKB:A0A7W3N5X5
    label: 6-deoxy-6-sulfo-D-fructose transaldolase
    gene_symbol: sftT
    organism: Priestia aryabhattai
    gene_review: genes/PRIAR/sftT/sftT-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Two members of the subfamily diverge from the family's sedoheptulose 7-phosphate transaldolase
    function in different directions: the Fsa enzymes are acceptor-independent fructose-6-phosphate
    aldolases, and SqvA/SftT are transaldolases whose physiological donor is
    6-deoxy-6-sulfo-D-fructose (EC 2.2.1.14), yielding 3-sulfolactaldehyde and fructose 6-phosphate
    (or sedoheptulose 7-phosphate with erythrose 4-phosphate as acceptor). SftT retains a
    sedoheptulose-7-phosphate transaldolase side activity in vitro.
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftT is an SF-cleaving, SLA-forming, GAP/E4P-dependent transaldolase;
      it showed activity also as sedoheptulose-7-phosphate transaldolase (see Figure S9).
  - reference_id: PMID:36805128
    supporting_text: the namesake enzyme catalyzes the transaldol reaction of SF transferring dihydroxyacetone
      to 3C/4C acceptors to give sulfolactaldehyde and fructose-6-phosphate or sedoheptulose-7-phosphate.
  - reference_id: file:interpro/panther/PTHR10683/PTHR10683-entries.csv
    supporting_text: D5E1T2,6-deoxy-6-sulfo-D-fructose transaldolase
  - reference_id: file:interpro/panther/PTHR10683/PTHR10683-entries.csv
    supporting_text: A0A7W3N5X5,6-deoxy-6-sulfo-D-fructose transaldolase
