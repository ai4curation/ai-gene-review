family_id: PANTHER:PTHR11931
family_name: PHOSPHOGLYCERATE MUTASE
preferred_name: Cofactor-dependent phosphoglycerate mutase (dPGM/PGAM/BPGM) family
summary: >-
  2,3-Bisphosphoglycerate-dependent phosphoglycerate mutases interconvert 3- and 2-phosphoglycerate
  through a phosphohistidine intermediate, the eighth step of glycolysis (bacterial GpmA, S. cerevisiae
  GPM1, S. pombe gpm1, human PGAM1/PGAM2). Bisphosphoglycerate mutase (BPGM) of erythrocytes instead
  makes 2,3-BPG. The S. cerevisiae paralogs GPM2 and GPM3 are not functional phosphoglycerate mutases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PGM activity holds for GPM1/gpm1 (SF0, SF33) and PGAM1/PGAM2 (SF15, SF8). BPGM (SF11) is a bisphosphoglycerate
  mutase, which PAINT handles with an IRD. The yeast GPM2/GPM3 subfamily (SF9) is not active.
