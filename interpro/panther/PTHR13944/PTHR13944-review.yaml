  assessment_reason: >-
    This IRD loss row on the euteleostome SF18 (AKAP13 / AKAP-Lbc) clade node PTN002677811
    erroneously blocks inheritance of ancestral GO:0005085 from PTN002677784 across AKAP13
    orthologs (which explains why human AKAP13 Q12802 lacks an IBA row for GO:0005085 in GOA even
    though Q12802 is itself listed among PAINT's experimental seeds for GO:0005085 at root node
    PTN002677784). AKAP13/Lbc is the founding oncogenic RhoA GEF of the entire Lbc family: its
    DH/PH cassette (residues 1994-2333 in Q12802) retains every catalytic CR1/CR3 residue
    (Glu2001, Gln2148, Lys2152, Tyr2153), directly catalyzes GDP-to-GTP exchange on RhoA in vitro
    and in cells, and has been crystallized in complex with RhoA-GDP at 2.1-angstrom resolution
    (PMID:8910315, PMID:9891067, PMID:11546812, PMID:24993829, PMID:25186459). The IRD was likely
    introduced because short non-GEF N-terminal splice isoforms or domain-truncated entries exist
    within SF18, but canonical full-length vertebrate AKAP13 orthologs are bona fide catalytic
    RhoA GEFs; the IRD at PTN002677811 should be removed.
