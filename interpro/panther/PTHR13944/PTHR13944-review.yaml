- subfamily_id: PANTHER:PTHR13944:SF21
  label: CYSTS, ISOFORM C
  description: >-
    Pre-duplication invertebrate (protostome) and basal Lbc-family RhoGEF grade represented in
    panther.obo as CYSTS, ISOFORM C (named after Drosophila melanogaster Cysts / Dp114RhoGEF /
    CG10188, UniProtKB:M9PBE1, FB:FBgn0032796, the single fly co-ortholog of vertebrate ARHGEF18,
    ARHGEF2, ARHGEF28, and AKAP13). In Drosophila epithelia, Cysts is recruited to the apicolateral
    zonula adherens and mitotic cleavage furrow via the Crumbs complex and Bazooka/Par-3, where it
    activates Rho1 (and acts via its DH/PH RhoGEF module) to drive junctional non-muscle myosin II
    assembly, adherens junction remodeling, and epithelial integrity.
