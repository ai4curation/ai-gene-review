- subfamily_id: PANTHER:PTHR13944:SF18
  label: A-KINASE ANCHOR PROTEIN 13
  clade_node_id: PANTHER:PTN002677811
  description: >-
    Vertebrate chimeric A-kinase-anchoring protein and RhoA-selective guanine nucleotide exchange
    factor clade (human AKAP13 / AKAP-Lbc / Ht31 / Brx Q12802, mouse Akap13 E9Q394, rat Akap13
    F1M3G7). Full-length AKAP-Lbc (~2,813 aa in human) combines an N-terminal amphipathic helix
    that anchors type II cAMP-dependent protein kinase regulatory subunits (PRKAR2A) with a C1-DH-PH
    catalytic cassette (residues 1791-2333 in Q12802) and C-terminal Galpha12-binding and
    leucine-zipper homo-oligomerization regions. Beyond Galpha12-coupled RhoA activation, AKAP13
    scaffolds PKCeta-PKD1, PKN1-MLTK-MKK3-p38alpha, KSR1-RAF-MEK1/2-ERK1/2, and IKKbeta complexes
    in cardiomyocytes and epithelia, while anchored PKA phosphorylates Ser1565 to recruit 14-3-3
    and autoinhibit basal RhoGEF activity.
