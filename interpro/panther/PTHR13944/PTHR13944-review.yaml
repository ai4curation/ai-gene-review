family_id: PANTHER:PTHR13944
family_name: AGAP007712-PA
preferred_name: Lbc-family Dbl-homology/pleckstrin-homology Rho guanine nucleotide exchange factors
summary: >-
  PANTHER family PTHR13944 (officially named AGAP007712-PA in panther.obo after its Anopheles
  gambiae member) comprises the Lbc clade of Dbl-homology/pleckstrin-homology (DH/PH) Rho
  guanine nucleotide exchange factors (RhoGEFs). Across invertebrates (Drosophila Cysts /
  Dp114RhoGEF in PTHR13944:SF21) and the four vertebrate paralogous clades generated during early
  gnathostome/euteleostome genome duplications—AKAP13 / AKAP-Lbc (PTHR13944:SF18), ARHGEF2 /
  GEF-H1 / Lfc (PTHR13944:SF20), ARHGEF28 / RGNEF / p190RhoGEF (PTHR13944:SF22), and ARHGEF18 /
  p114RhoGEF (PTHR13944:SF23; split into PTHR47440:SF1 in InterPro/UniProt DR PANTHER while
  retained at PTN002677825 in PANTHER 19.0)—every member shares a conserved catalytic DH/PH
  cassette preceded by an N-terminal phorbol-ester/DAG-like C1 zinc finger (or degenerate zinc
  finger) and followed by a C-terminal coiled-coil regulatory region. Biochemically and
  structurally, all five subfamilies catalyze GDP-to-GTP exchange selectively on RhoA-subfamily
  GTPases (vertebrate RhoA/RhoB/RhoC; Drosophila Rho1) with little or no intrinsic exchange
  activity toward Cdc42 and purified-protein selectivity against Rac1, while several PH domains
  in the clade bind activated RhoA-GTP to mediate positive feedback or cortical localization.
  Whereas catalytic RhoA/Rho1 exchange is conserved family-wide, upstream spatial recruitment and
  scaffolding functions partition sharply by subfamily: SF20 (ARHGEF2) is sequestered in an
  autoinhibited state on the microtubule lattice via its C1 zinc finger and C-terminal domain and
  released upon microtubule depolymerization or kinase/GPCR signaling; SF18 (AKAP13) acquired a
  large N-terminal A-kinase-anchoring protein (AKAP) extension that binds type II PKA regulatory
  dimers (PRKAR2A) and scaffolds multikinase modules (PKCeta-PKD1, PKN1-MLTK-MKK3-p38alpha,
  KSR1-RAF-MEK1/2-ERK1/2, and IKKbeta) alongside Galpha12-stimulated RhoA exchange; SF22
  (ARHGEF28) couples integrin engagement to RhoA activation and GEF-independent FAK scaffolding at
  early focal adhesions; and SF21 (Cysts) and SF23 (ARHGEF18) localize to apical epithelial
  adherens/tight junctions via Crumbs/PATJ, Bazooka/PAR3, and cingulin/paracingulin adaptors to
  drive circumferential actomyosin tension. Notably, PAINT places a spurious IRD loss annotation
  (NOT GO:0005085) at the SF18 clade node PTN002677811 despite human AKAP13 (UniProtKB:Q12802)
  serving simultaneously as a root IBD seed at PTN002677784 and having 2.1-angstrom crystallographic
  and enzymatic proof of RhoA nucleotide exchange.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All five PTHR13944 subfamilies (SF18 AKAP13, SF20 ARHGEF2, SF21 Cysts, SF22 ARHGEF28, and SF23
  ARHGEF18) conserve the canonical Dbl-homology CR1/CR3 catalytic machinery (Glu242 and Tyr394 in
  human ARHGEF2 Q92974; Glu2001 and Tyr2153 in human AKAP13 Q12802) and act as active RhoA/Rho1
  guanine nucleotide exchange factors (GO:0005085) that positively regulate Rho GTPase signal
  transduction (GO:0035023 / GO:0035025) and cortical or stress-fiber actin organization. However,
  subfamily PTHR13944:SF18 (AKAP13 / AKAP-Lbc, clade node PTN002677811) underwent major domain
  accretion by acquiring an ~1,750-residue N-terminal scaffold region containing an amphipathic
  PKA-RII-anchoring helix (GO:0051018) and docking surfaces for MAPK (GO:0005078, GO:0043410),
  PKD1, and IKKbeta/NF-kappaB (GO:0043123) signaling complexes that are absent from SF20, SF21,
  SF22, and SF23, while SF20 (ARHGEF2, clade node PTN002677798) specialized in direct microtubule
  lattice sequestration (GO:0008017) and ruffle/junctional membrane remodeling (GO:0032587).
