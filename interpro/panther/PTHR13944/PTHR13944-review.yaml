notes: >-
  PANTHER 19.0 assigns human ARHGEF18 (Q6ZSZ5, A0A590UK10) to PTHR13944:SF23 at clade node
  PTN002677825, whereas UniProt/InterPro DR PANTHER cross-references split vertebrate ARHGEF18
  into PTHR47440:SF1 while retaining PTN002677784 IBAs. Also note a 1-residue isoform offset in
  human ARHGEF2 (Q92974): canonical isoform 1 (Q92974-1, 986 aa) includes Ala194, whereas isoform
  2 (Q92974-2, 985 aa, VSP_039458) and mouse/rat Arhgef2 (Q60875, Q5FVC2, 985 aa) omit that single
  residue or shifted N-terminal indel so literature references to Tyr393, Thr678, Ser885, and
  Ser959 map to Tyr394, Thr679, Ser886, and Ser960 in canonical Q92974-1.
