- subfamily_id: PANTHER:PTHR13944:SF20
  label: RHO GUANINE NUCLEOTIDE EXCHANGE FACTOR 2
  clade_node_id: PANTHER:PTN002677798
  description: >-
    Vertebrate microtubule-regulated RhoA/RhoB guanine nucleotide exchange factor clade (human
    ARHGEF2 / GEF-H1 Q92974, mouse Arhgef2 / Lfc Q60875, rat Arhgef2 Q5FVC2, canine ARHGEF2
    Q865S3, porcine ARHGEF2 B2DCZ9). Members (~985-986 aa) contain an N-terminal C1 zinc finger
    (residues 39-86 in Q92974), tandem DH/PH domains (residues 235-571), and a C-terminal
    autoinhibitory coiled-coil domain with a conserved PAK1/Aurora/PKA 14-3-3 phosphoswitch
    (Ser886 in human Q92974-1; Ser885 in mouse Q60875, rat Q5FVC2, and human isoform Q92974-2).
    Direct binding of the C1 domain and C-terminal region to the microtubule lattice sequesters
    GEF-H1 in an inactive state; microtubule depolymerization, GPCR/Galpha-DYNLT1 uncoupling, or
    ERK phosphorylation liberates active GEF-H1 to drive RhoA-ROCK-myosin II contractility,
    junctional permeability remodeling, mitotic cytokinesis, and innate immune signaling.
