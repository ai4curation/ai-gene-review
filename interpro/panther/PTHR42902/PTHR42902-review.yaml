family_id: PANTHER:PTHR42902
family_name: MALATE SYNTHASE
preferred_name: Malate synthase A (MLS1/DAL7/AceB) family
summary: >-
  Malate synthases condense glyoxylate with acetyl-CoA to malate. S. cerevisiae MLS1 serves the glyoxylate
  cycle (peroxisomal or cytosolic depending on carbon source). DAL7 is induced by allantoin and recycles
  glyoxylate from purine catabolism. The family also contains bacterial AceB and plant MLS.
functional_coherence: COHERENT
coherence_reason: All members are malate synthases; paralogs differ in metabolic context.
