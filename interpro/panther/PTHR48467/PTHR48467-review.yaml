family_id: PANTHER:PTHR48467
family_name: GLUTAMATE SYNTHASE 1 [NADH], CHLOROPLASTIC-LIKE
preferred_name: Adrenodoxin reductase (FDXR/Arh1/FprA) family
summary: >-
  NADPH:adrenodoxin/ferredoxin oxidoreductases. In the current PANTHER release
  the family holds mitochondrial adrenodoxin reductases (human and bovine FDXR,
  rodent Fdxr, Drosophila dare, Saccharomyces cerevisiae ARH1,
  Schizosaccharomyces pombe arh1, Dictyostelium fdxr, Arabidopsis MFDR) and
  bacterial NADPH-ferredoxin reductases (Mycobacterium FprA/FprB), plus the
  cineole-pathway cindoxin reductase CinB; its name is inherited from a
  glutamate synthase that PANTHER now classifies elsewhere. The mitochondrial
  enzymes transfer electrons from NADPH to the [2Fe-2S] ferredoxin (FDX2/Yah1),
  which supplies mitochondrial P450s, iron-sulfur cluster assembly, heme A
  synthesis and the CoQ hydroxylase COQ6; human FDXR with FDX2 drives COQ6 in
  vitro, and yeast ARH1 is required for CoQ biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  One subfamily (SF1) of NAD(P)H:iron-sulfur protein reductases; all members
  except CinB reduce a ferredoxin, while the electron acceptor downstream of
  the ferredoxin differs (P450s, Fe-S assembly, heme A, COQ6).
