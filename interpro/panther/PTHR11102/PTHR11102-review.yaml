family_id: PANTHER:PTHR11102
family_name: SEL-1-LIKE PROTEIN
preferred_name: Sel1-like-repeat (SLR) scaffold proteins, including eukaryotic SEL1L/Hrd3 ERAD adaptors
  and bacterial AlgK, ExoR and PodJ
summary: PTHR11102 groups proteins built from Sel1-like repeats (SLRs), helix-turn-helix units related
  to tetratricopeptide repeats that form solenoid scaffolds for protein-protein and protein-ligand
  interactions. In eukaryotes, SEL1L, nematode SEL-1 and yeast Hrd3 are endoplasmic-reticulum membrane
  adaptors of the HRD1 ubiquitin-ligase complex in ER-associated degradation (ERAD). Most members are
  bacterial and are unrelated to ERAD. Pseudomonas and Azotobacter AlgK is an outer-membrane
  lipoprotein scaffold of the alginate secretion machinery that binds AlgX, alginate and the AlgE
  context. Rhizobial ExoR regulates exopolysaccharide production, Caulobacter PodJ is a polar
  localization factor, Vibrio MotX is a sodium-flagellar component and E. coli EsiB binds secretory IgA.
  The repeat scaffold is the only property shared family-wide; the process each scaffold serves is
  lineage-specific.
functional_coherence: HETEROGENEOUS
coherence_reason: The ERAD adaptor function is confined to a eukaryotic clade (SEL1L, SEL-1 and the
  SF147/SF70/SF53 groups under PTN000121233). The large SF160 subfamily mixes yeast Hrd3 with bacterial
  AlgK alginate-secretion scaffolds, ExoR regulators, PodJ, MotX, EsiB and many uncharacterized repeat
  proteins, so the official SF160 name (ERAD-ASSOCIATED E3 UBIQUITIN-PROTEIN LIGASE COMPONENT HRD3)
  describes only its yeast members.
