notes: Reviewed for the alginate polymerization and export module. Tree placements were read from the
  PANTHER 19 treeinfo service for PTHR11102. P. aeruginosa AlgK (leaf PTN004230962) lies on a
  gammaproteobacterial branch of SF160 outside the eukaryotic ERAD node PTN000121233. KT2440 AlgK is
  the reference protein because it has a complete gene review and a directly determined AlgKX complex
  structure with polymer-binding measurements. Human SEL1L and yeast Hrd3 have no gene reviews in this
  repository. Because SF160 is functionally mixed, the module does not use a PANTHER term for AlgK; it
  grounds AlgK by its members (IPR053440 Alginate biosynthesis AlgK covers the Pseudomonas members only).
