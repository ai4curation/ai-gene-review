  assessment_reason: In the PANTHER 19 tree PTN000121233 is a eukaryotic clade (SF147, SF70, SF53 and
    small SF148/SF161/SF162 groups) containing SEL1L, SEL1L2 and C. elegans sel-1. The bacterial AlgK
    proteins sit on a separate gammaproteobacterial branch outside this node and do not inherit the
    term. SEL1L2 inherits it by paralogy without direct evidence, which is plausible but untested.
    Yeast Hrd3 also lies outside the node, on a separate fungal SF160 branch, so the gain is if anything
    shallower than the ERAD function; it is not too deep.
