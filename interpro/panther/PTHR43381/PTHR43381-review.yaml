- subfamily_id: PANTHER:PTHR43381:SF4
  label: EUKARYOTIC TRANSLATION INITIATION FACTOR 5B
  description: >-
    Archaeal aIF5B and eukaryotic cytosolic eIF5B. Human and archaeal homologues of IF2 function as
    translation factors and the archaeal protein substitutes for yeast eIF5B, so the core
    initiator-tRNA/subunit-joining activity is conserved, but these proteins act on 80S-type
    initiation downstream of eIF2 and do not use formylated initiator tRNA.
  representative_members:
  - id: UniProtKB:O60841
    label: Eukaryotic translation initiation factor 5B
    gene_symbol: EIF5B
    organism: Homo sapiens
  - id: UniProtKB:P39730
    label: Eukaryotic translation initiation factor 5B
    gene_symbol: FUN12
    organism: Saccharomyces cerevisiae
  diverged_from_family: true
  divergence_description: >-
    Retains GTP-dependent initiator-tRNA binding and subunit joining but works in the archaeal/eukaryotic
    initiation pathway, where eIF2 delivers Met-tRNAi and eIF5B cooperates with eIF1A on the 80S
    ribosome; bacterial-specific features (fMet-tRNA formyl-group recognition, 70S joining, the
    variable bacterial N-terminal region) do not apply.
- subfamily_id: PANTHER:PTHR43381:SF20
  label: TRANSLATION INITIATION FACTOR IF-2, MITOCHONDRIAL
  description: >-
    Nuclear-encoded mitochondrial IF2 (human MTIF2 P46199, bovine, mouse, yeast IFM1, fission yeast
    mti2). It works on mitoribosomes with formylated initiator tRNA and uses a mitochondria-specific
    insertion to substitute for the absent IF1.
  representative_members:
  - id: UniProtKB:P46199
    label: Translation initiation factor IF-2, mitochondrial
    gene_symbol: MTIF2
    organism: Homo sapiens
  diverged_from_family: false
