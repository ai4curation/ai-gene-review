family_id: PANTHER:PTHR43381
family_name: TRANSLATION INITIATION FACTOR IF-2-RELATED
preferred_name: Translation initiation factor IF2 / eIF5B family of translational GTPases
summary: >-
  PTHR43381 is the universally conserved IF2/eIF5B family of TRAFAC translational GTPases. Bacterial IF2
  (reference E. coli infB, P0A705) binds the 30S subunit early in initiation, selects and positions
  formylated initiator fMet-tRNA in the P site, and hydrolyses GTP as the 50S subunit joins, after which
  it is released from the 70S initiation complex. Archaea and eukaryotes have an orthologous factor,
  aIF5B/eIF5B (human EIF5B, yeast FUN12), which also binds initiator Met-tRNA and promotes subunit
  joining, but in the cytosol of eukaryotes it works on the 80S ribosome together with eIF1A and acts
  after eIF2-dependent initiator delivery rather than as the primary initiator carrier. The family also
  contains the nuclear-encoded mitochondrial IF2 (human MTIF2) and plastid IF2 proteins of endosymbiotic
  origin. Members share the G domain and the C-terminal tRNA-binding beta-barrel domains; bacterial IF2
  carries an additional variable N-terminal region.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The parsed entries file holds 818 Swiss-Prot entries in three populated subfamilies. SF5 (753) holds
  bacterial IF2 together with plastid IF2 (Arabidopsis FUG1/At1g17220, red-algal plastid infB). SF4 (60)
  holds archaeal aIF5B and eukaryotic eIF5B (human EIF5B O60841, yeast FUN12 P39730). SF20 (5) holds
  mitochondrial IF2 (human MTIF2 P46199, yeast IFM1). Initiator-tRNA-dependent subunit joining driven by
  GTP hydrolysis is shared by all three; the divergence is in context (bacterial/organellar 70S-type
  versus eukaryotic 80S initiation, eIF2 taking over initiator delivery in eukaryotes, and a
  mitochondria-specific insertion that replaces IF1 in mitochondrial IF2). The PAINT file also carries
  tRNA-modification rows on a node whose seeds are MnmE/GTPBP3 proteins classified outside this family.
