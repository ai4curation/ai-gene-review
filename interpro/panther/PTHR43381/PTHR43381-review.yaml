notes: >-
  Divergence: IF2 and a/eIF5B are orthologous (PMID:9624054, PMID:10200264), but in eukaryotes the
  structurally unrelated eIF2 delivers Met-tRNAi, so eIF5B's role is restricted to later steps such as
  subunit joining; bacterial-specific annotations (formylated initiator recognition, 70S initiation
  complex formation, cold-shock roles) should not be propagated from SF5 to SF4. Mitochondrial IF2
  (SF20) carries a 37-residue insertion absent from bacterial IF2 that takes over the role of IF1
  (file:genes/human/MTIF2/MTIF2-ai-review.yaml). Seed labels for PTN000182687 were checked against
  UniProt REST (PANTHER cross-references of P25522, P52131, Q969Y2, Q387K3) on 2026-11-13.
