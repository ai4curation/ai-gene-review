family_id: PANTHER:PTHR43374
family_name: FLAVIN PRENYLTRANSFERASE
preferred_name: UbiX/Pad1 flavin prenyltransferase family
summary: >-
  UbiX/Pad1 flavin prenyltransferases make prenylated FMN (prFMN), the
  cofactor of UbiD-family reversible decarboxylases. The prenyltransferase
  activity is shared across the family: Escherichia coli UbiX supplies prFMN to
  UbiD for the decarboxylation of 3-octaprenyl-4-hydroxybenzoate in ubiquinone
  biosynthesis, while fungal Pad1 (Saccharomyces cerevisiae PAD1, Aspergillus
  niger PadA1) supplies the same cofactor to ferulic acid decarboxylase Fdc1 in
  the degradation of aromatic acids. S. cerevisiae PAD1 rescues an E. coli ubiX
  deletion, and E. coli UbiX activates Fdc1. The pathway that consumes the
  cofactor therefore differs between lineages: only proteobacterial UbiX
  proteins serve ubiquinone biosynthesis, since fungi decarboxylate the CoQ
  ring with the unrelated COQ4.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is a flavin prenyltransferase, but the
  decarboxylase it serves, and so the biological process, differs: ubiquinone
  biosynthesis for proteobacterial UbiX, aromatic acid decarboxylation for
  fungal Pad1. PANTHER does not separate these in different subfamilies.
