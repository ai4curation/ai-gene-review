- node_id: PANTHER:PTN001248208
  asserted_term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence: IRD
  negated: true
  paint_snapshot: '20260617'
  seeds:
  - id: PANTHER:PTN000764671
  assessment: LOSS_TOO_BROAD
  assessment_reason: >-
    Stopping the process for S. cerevisiae and Candida Pad1 is right, because
    yeast PAD1 serves Fdc1 and yeast performs the CoQ C1 decarboxylation with
    COQ4. But the loss is narrower than the problem: the other fungal Pad1
    proteins (Aspergillus, Neurospora) and B. subtilis BsdB are not below this
    node and still inherit the root IBD. The better fix is to move the
    ubiquinone biosynthesis IBD from the root to a proteobacterial UbiX node
    (see PTN000764671), after which this IRD becomes unnecessary.
