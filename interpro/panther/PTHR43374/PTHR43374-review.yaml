  assessment: SOUND
  assessment_reason: >-
    PTN000764671 is the family root (all 38 tree leaves, bacteria, archaea,
    fungi and plants). The activity is shared by both the bacterial and the
    fungal branches: fungal Pad1 synthesizes the prenylated flavin used by
    Fdc1, and S. cerevisiae PAD1 and E. coli UbiX substitute for each other.
    Placement at the root is therefore correct.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43374/PTHR43374-paint.tsv
    supporting_text: "PTHR43374\tPTN000764671\tGO:0106141\tF\tIBD\tfalse"
  - reference_id: PMID:26083754
    supporting_text: 'Here we show that Fdc1 is solely responsible for the reversible decarboxylase activity,
      and that it requires a new type of cofactor: a prenylated flavin synthesized by the associated UbiX/Pad1.'
  - reference_id: PMID:25647642
    supporting_text: Rather, PAD1 catalyzes the formation of a novel, diffusible cofactor required by FDC
      for decarboxylase activity.
- node_id: PANTHER:PTN000764671
  asserted_term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence: IBD
  paint_snapshot: '20260617'
  seeds:
  - id: UniProtKB:P0AG03
  assessment: TOO_DEEP
  assessment_reason: >-
    The seed is E. coli UbiX, whose role in ubiquinone biosynthesis is well
    established, but the node is the family root. Below it sit fungal Pad1
    proteins (Aspergillus, Neurospora, S. cerevisiae, Candida), B. subtilis
    BsdB and archaeal members, which supply prFMN to decarboxylases outside
    ubiquinone biosynthesis; fungi perform the CoQ C1 decarboxylation with
    COQ4. The IRD at PTN001248208 stops the term only for S. cerevisiae and
    Candida, so other fungal and non-proteobacterial members still inherit it.
    The process belongs on a proteobacterial UbiX node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43374/PTHR43374-paint.tsv
    supporting_text: "PTHR43374\tPTN000764671\tGO:0006744\tP\tIBD\tfalse"
  - reference_id: PMID:26083754
    supporting_text: The bacterial ubiD and ubiX or the homologous fungal fdc1 and pad1 genes have been implicated
      in the non-oxidative reversible decarboxylation of aromatic substrates, and play a pivotal role in bacterial
      ubiquinone (also known as coenzyme Q) biosynthesis or microbial biodegradation of aromatic compounds,
      respectively.
  - reference_id: PMID:38295803
    supporting_text: Here, we provide evidence that these two reactions occur in a single oxidative decarboxylation
      step catalyzed by COQ4.
