        organism: Homo sapiens
      - id: UniProtKB:Q9Y6C9
        label: Mitochondrial carrier homolog 2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      All three seeds carry the term experimentally: human MTCH2 and MTCH1 (IDA,
      PMID:36264797; IMP, PMID:38428433) and Drosophila Mtch (IMP, PMID:41576035). The fly
      evidence is genetic and indirect (loss of Mtch lowers the tail-anchored protein
      BNIP3 and blocks BNIP3-dependent mitophagy), so on its own it would be a thin basis
      for an activity term. The root is not the common ancestor of MTCH1 and MTCH2, which
      is the duplication PTN001324730; the seeds' last common ancestor is the Bilateria
      node, and the IBD sits two speciation nodes above it. Three lines support placing it
      that deep. First, Stevens et al. (PMID:42308315) report that MTCH homologs from
      Xenopus and the filasterean Capsaspora restore insertion in MTCH2-deficient human
      cells, and that Drosophila and Nematostella homologs are active in the same assay
      and respond to the same activating mutations; Capsaspora lies outside the clade of
      this node, so the function predates the root. Second, in PANTHER's alignment the residue aligned to
      MTCH2 Asp189, whose charge reversal abolishes insertion, is Asp or Glu in all 58
      leaves that cover the column, including Trichoplax (E202) and Monosiga (E2686), and
      the residue aligned to Lys25 is Lys or Arg in 50 of 53. Third, no clade shows the
      alternative, a retained transporter: every leaf but one over-long dog gene model has
      lost at least two of the three carrier signature motifs. No branch needs pruning on
      present evidence. The two leaves with a gap at the Asp189 column are partial models
      (Nematostella A7SZ14 and the 230-residue chimpanzee fragment A0A2I3RNU0) and cannot
      be judged. The corresponding IBAs had not reached GOA on 2026-11-26.
