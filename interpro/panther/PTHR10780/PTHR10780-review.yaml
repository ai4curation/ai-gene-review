        supporting_text: >-
          controlling mislocalization of TAs into the endoplasmic reticulum and  modulating
          the sensitivity of leukemia cells to apoptosis

residue_sites:
  - site_id: groove_acidic_residue
    label: Acidic residue of the insertase groove (human MTCH2 Asp189)
    description: >-
      Membrane-embedded acidic residue of the hydrophilic groove. In human MTCH2 the
      charge reversal D189R abolishes insertase activity (UniProt MUTAGEN, from
      PMID:36264797). Position 189 lies in the fourth UniProt TRANSMEM feature (181-199);
      those features are predictions and list six helices, whereas the cryo-EM structure
      resolves five (PMID:42308315), so the helix numbering should not be relied on. In
      PANTHER's family alignment the aligned residue is Asp in all vertebrate MTCH2 and all
      but one MTCH1 leaves and mostly Glu elsewhere; no leaf has a neutral or basic
      residue. Glu is accepted on the grounds that homologs from species whose sequences
      carry Glu here function as insertases in human cells, but which Nematostella paralog
      was tested was not established, so the Glu allowance is an alignment inference.
      Because only a charge reversal has been tested, the site is recorded as contributing,
      not as required. The companion residue Lys25 (K25E is hyperactive) is not curated as
      a site: the substitution increases activity, so its loss is not a loss of function.
