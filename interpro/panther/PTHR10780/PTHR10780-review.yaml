review_status: NEEDS_REVIEW
reviewed_by: claude-code
review_date: "2026-11-26"
notes: >-
  Re-reviewed on 2026-11-26 against the PANTHER 19.0 tree and family alignment (both from
  the PANTHER API), the pinned PAINT snapshot 2026-08-28 (IBD.gaf re-read: the four rows in
  PTHR10780-paint.tsv are the only rows for this family's nodes), QuickGO, UniProt and
  PubMed. tree_check.py and msa_check.py regenerate the two result files; raw trees,
  alignments and API payloads are not kept. Residue numbers are those of the named UniProt
  sequence (Q9Y6C9 sequence version 1 for MTCH2 Lys25 and Asp189; per-leaf numbers in
  PTHR10780-msa-check.txt are each leaf's own numbering in its PANTHER 19 sequence). Node
  taxa are read from the tree; PAINT's own taxon field is empty for all four rows, so no
  node_taxon is asserted.
  What the first review got wrong or left out: it described two of three subfamilies
  (SF18, the root subfamily holding every non-vertebrate member including fly Mtch, was
  missing); it called the root the common ancestor of MTCH1 and MTCH2, whereas that
  ancestor is the duplication PTN001324730 and the root is two speciation nodes above the
  seeds' last common ancestor; and it had no alignment or tree evidence. Its verdicts
  stand: all four IBDs are SOUND and no PAINT change is requested. One suggestion for the
  PAINT curators is recorded in the GO:0045040 row: the child term GO:7770059 now exists
  and is what the seeds are annotated to.
  GOA state: the insertase and outer-membrane IBAs from the July and August 2026 IBDs had
  still not reached GOA on 2026-11-26, and the 38 vertebrate leaves each still carry
  mitochondrion and membrane IBAs from PTN001324730 rows that the pinned PAINT snapshot no
  longer contains. This is a propagation lag, not a curation gap. No invertebrate leaf
  has any IBA yet.
  Not verified: Stevens et al. (PMID:42308315) was read from PubMed Central for this
  review but is not in the repository's publication cache, so it is cited without quotes,
  and its supplementary table of tested homologs was not read (which Nematostella paralog
  and which Capsaspora accession were tested is unknown; Capsaspora is not a leaf of the
  PANTHER tree). PMID:40704594, PMID:38013241, PMID:36417880, PMID:28127879, PMID:22326460
  and PMID:38377988 were read as abstracts only, and PMID:20436477 and PMID:15899861 were
  checked by title and by the GO annotations that cite them. Whether an experimental
  scramblase assay exists for an MTCH protein was not established. There are no gene
  reviews for the mouse, fly, worm or zebrafish members; yeast, plants and bacteria have
  no member of this family.
