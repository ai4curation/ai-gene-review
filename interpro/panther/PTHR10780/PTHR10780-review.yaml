        organism: Homo sapiens (Human)
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000845785
    asserted_term:
      id: GO:0005741
      label: mitochondrial outer membrane
    paint_snapshot: "20260724"
    seeds:
      - id: FB:FBgn0027786
        label: Drosophila Mtch
        organism: Drosophila melanogaster
      - id: MGI:MGI:1929260
        label: mouse Mtch2
        organism: Mus musculus
      - id: UniProtKB:Q9Y6C9
        label: Mitochondrial carrier homolog 2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      OMM localization is directly demonstrated for human MTCH2 (IDA,
      PMID:36264797) and mouse Mtch2, and is consistent for MTCH1 and fly Mtch.
      Every descendant is an OMM protein; placement at this shared ancestral
      node is correct. Human MTCH2 appearing among the seeds is expected (its
      own IDA is one of the descendant evidences behind the IBD), not circular.
      This assertion supersedes the older, more generic PAINT CC assertions
      (GO:0005739 mitochondrion, GO:0016020 membrane at PTN001324730) that
      still appear as IBAs in the cached human GOA but are absent from the
      current PAINT snapshot - the granularity problem the MTCH2 gene review
      flags has already been fixed on the PAINT side.
  - node_id: PANTHER:PTN000845785
    asserted_term:
      id: GO:0032977
      label: membrane insertase activity
    paint_snapshot: "20260724"
    seeds:
      - id: FB:FBgn0027786
        label: Drosophila Mtch
        organism: Drosophila melanogaster
      - id: UniProtKB:Q9NZJ7
        label: Mitochondrial carrier homolog 1
        organism: Homo sapiens
      - id: UniProtKB:Q9Y6C9
        label: Mitochondrial carrier homolog 2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Insertase activity is rigorously established for human MTCH2 (necessary
      in vivo and in vitro, sufficient in reconstitution; IDA, PMID:36264797)
      and demonstrated for MTCH1 in the same study, so the function is shared
      by both paralog subfamilies and placement at their common ancestor is
      the natural node. Propagation to human MTCH2 is sound and in fact
      grounded on its own experimental annotation; the corresponding IBA has
      not yet reached the cached GOA slice only because the IBD (2026-07-24)
      postdates the GOA fetch.
  - node_id: PANTHER:PTN000845785
    asserted_term:
      id: GO:0045040
      label: protein insertion into mitochondrial outer membrane
    paint_snapshot: "20260828"
    seeds:
      - id: FB:FBgn0027786
        label: Drosophila Mtch
        organism: Drosophila melanogaster
      - id: UniProtKB:Q9NZJ7
        label: Mitochondrial carrier homolog 1
        organism: Homo sapiens
      - id: UniProtKB:Q9Y6C9
        label: Mitochondrial carrier homolog 2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Process counterpart of the insertase MF, with the same experimental
      grounding (PMID:36264797) and the same seeds. Correctly placed at the
      family's shared ancestral node; propagation to human MTCH2 is sound.
  - node_id: PANTHER:PTN001324730
    asserted_term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    paint_snapshot: "20211215"
    seeds:
      - id: MGI:MGI:1929260
        label: mouse Mtch2
        organism: Mus musculus
      - id: UniProtKB:Q9NZJ7
        label: Mitochondrial carrier homolog 1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The tBID-receptor/apoptosis-facilitation role is experimentally supported
      in mouse Mtch2 (liver conditional knockout) and human MTCH1, one seed
      from each paralog subfamily, so placement at a node spanning both is
      defensible. Human MTCH2 receives this IBA in the cached GOA; the MTCH2
      gene review keeps it as a genuine but non-core function - apoptotic
      signaling at the OMM is plausibly downstream of, or ancillary to, the
      core insertase activity, but there is no target-specific evidence of
      loss or divergence that would justify challenging the propagation.

term_assessments:
  - assessed_term:
      id: GO:0055085
      label: transmembrane transport
    scope: NOT_APPLICABLE
    scope_reason: >-
      The key over-annotation hazard for this family. Despite the SLC25
      carrier fold ("mitochondrial carrier homolog"), no MTCH-family member
      has demonstrated metabolite transport activity; the fold has been
      co-opted as a protein insertase (hydrophilic groove used for substrate
      insertion rather than solute translocation). Carrier/transporter terms
      inherited by fold similarity from canonical SLC25 families should not be
      applied to any member, and a future PAINT pass should not propagate
      transport terms here.
  - assessed_term:
      id: GO:0032977
      label: membrane insertase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Demonstrated for both human paralogs and asserted by PAINT at the shared
      ancestral node PTN000845785 with a Drosophila seed; safe family-wide on
      current evidence.
    supported_by:
      - reference_id: PMID:36264797
        supporting_text: >-
          we have demonstrated that MTCH2 is a defining member of a family of
          membrane protein insertases that are necessary and sufficient for
          insertion of TAs into human mitochondria.

references:
  - id: PMID:36264797
    title: MTCH2 is a mitochondrial outer membrane protein insertase.

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the human MTCH2 gene review (genes/human/MTCH2). All node
  ids, seeds, and snapshot dates are verbatim from the cached
  PTHR10780-paint.tsv (node taxon fields are empty in the tsv, so no
  node_taxon is asserted). The reviewed-entry slice contains only 6 proteins
  (human/mouse/orangutan/bovine MTCH1 and MTCH2) of 2956 family members across
  ~4000 taxa; metadata reports 3 subfamilies, of which the two with reviewed
  members are described above. The headline finding: this family was flagged
  in the "human no-IBA" cohort, but PAINT curation is current and good - the
  July/August 2026 IBDs place the experimentally established insertase
  function at the right node, and the human gene's missing insertase IBAs are
  a GOA-lag artifact, not a curation gap. The residual clean-up need is on the
  GOA side: the stale generic CC IBAs (mitochondrion, membrane) from the
  earlier PAINT iteration should disappear when the new snapshot flows
  through. No residue_sites: the carrier-fold-to-insertase divergence is a
  whole-fold repurposing, not a point-residue question.
