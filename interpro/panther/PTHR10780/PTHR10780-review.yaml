  - node_id: PANTHER:PTN001324730
    asserted_term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    evidence: IBD
    paint_snapshot: "20211215"
    seeds:
      - id: MGI:MGI:1929260
        label: mouse Mtch2
        organism: Mus musculus
      - id: UniProtKB:Q9NZJ7
        label: Mitochondrial carrier homolog 1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The node is the duplication that produced MTCH1 and MTCH2 (40 leaves, 19 species,
      all bony vertebrates), and it is exactly the last common ancestor of the two seeds,
      one from each paralog. The 20 leaves outside it (invertebrates, Ciona, amphioxus,
      Monosiga) do not receive the term, which is right: in Drosophila, loss of Mtch
      causes excess apoptosis (PMID:38013241), the opposite sign, so the term must not be
      moved deeper. The two seeds are unequal. Mouse Mtch2 is well supported (IMP,
      PMID:15899861, and the liver knockout in PMID:20436477, which reduces truncated-BID
      recruitment and Fas-induced apoptosis; a related term by IMP, PMID:26219591). Human
      MTCH1 rests on an IEP row for a study in which overexpressed PSAP killed cells
      (PMID:12377771), which shows sufficiency under overexpression and not a
      physiological role. If the MTCH1 seed were discounted, the supported node would be
      the MTCH2 clade PTN002583764. The placement is kept as SOUND because MTCH1 and MTCH2
      insert the same class of tail-anchored proteins, which include apoptosis regulators,
      and human MTCH2 insertase activity sets the apoptotic sensitivity of leukaemia
      cells, so a shared, insertion-mediated effect on apoptosis in both paralogs is the
      simplest reading. The effect is downstream of the insertase activity and the
      truncated-BID receptor role, and is non-core for the recipients.
