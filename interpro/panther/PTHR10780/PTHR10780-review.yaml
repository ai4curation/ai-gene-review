term_assessments:
  - assessed_term:
      id: GO:0032977
      label: membrane insertase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Shown for both vertebrate paralogs and for Drosophila Mtch, and reported for
      homologs as distant as a filasterean (PMID:42308315). The acidic groove residue is
      present in every aligned leaf, so no member is flagged as having lost the activity.
      Leaves that are fragments or fused gene models (for example Pan A0A2I3RNU0, 230
      residues; Monosiga A9VAU4, 2817 residues) inherit the term through the tree like any
      other, and their sequences should be checked before the term is relied on for them.
    supported_by:
      - reference_id: PMID:36264797
        supporting_text: >-
          we have demonstrated that MTCH2 is a defining member of a family of
          membrane protein insertases that are necessary and sufficient for insertion of
          TAs into human mitochondria.
      - reference_id: file:interpro/panther/PTHR10780/PTHR10780-msa-check.txt
        supporting_text: "PTHR10780:SF18 ref D189: E=15 D=4 gap=1"
  - assessed_term:
      id: GO:0045040
      label: protein insertion into mitochondrial outer membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      The process the insertase activity carries out, so its scope follows the activity.
      The members act on alpha-helical proteins only; the more specific child GO:7770059
      (alpha helical protein insertion into mitochondrial outer membrane) is the better
      description wherever a curator has the choice, and is already used on the fly and
      human members.
    supported_by:
      - reference_id: file:interpro/panther/PTHR10780/PTHR10780-tree-check.txt
        supporting_text: "Q9NZJ7 MTCH1 GO:7770059 alpha helical protein insertion into mitochondrial outer membrane IMP PMID:38428433 below_node=True"
  - assessed_term:
      id: GO:0005741
      label: mitochondrial outer membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Direct localization in human, mouse and fly, and the site of the family-wide
      insertase activity. This is the outer membrane, unlike the inner-membrane location of
      canonical SLC25 carriers, so inner-membrane terms inherited from the carrier fold do
      not apply; the one such row in the family (mouse Mtch2, mitochondrial inner membrane,
      HDA from a proteomic survey) does not outweigh the direct outer-membrane data.
    supported_by:
      - reference_id: file:interpro/panther/PTHR10780/PTHR10780-tree-check.txt
        supporting_text: "PTN000845785 GO:0005741 mitochondrial outer membrane: positive control ok (seeds returned: Q791V5,Q9V3Y4,Q9Y6C9); seeds not returned: none"
  - assessed_term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Supported only for the vertebrate paralogs, where truncated BID and the BAX/BAK
      pathway are the context: mouse Mtch2 by loss of function, human MTCH1 by
      overexpression only. It should not be extended to SF18: Drosophila Mtch loss
      increases apoptosis (PMID:38013241), and the C. elegans MTCH-1 link to cell-death
      factors is through CED-4 abundance (PMID:36417880). PAINT's placement at the
      duplication node already matches this scope.
    applicable_subfamilies:
      - id: PANTHER:PTHR10780:SF20
        label: MITOCHONDRIAL CARRIER HOMOLOG 2
      - id: PANTHER:PTHR10780:SF3
        label: MITOCHONDRIAL CARRIER HOMOLOG 1
    supported_by:
      - reference_id: file:interpro/panther/PTHR10780/PTHR10780-tree-check.txt
        supporting_text: "IBD GO:0043065 negated=false date=20211215 at PTN001324730 DUPLICATION taxon=- leaves=40 PTHR10780:SF20=23 PTHR10780:SF3=17"
  - assessed_term:
      id: GO:0055085
      label: transmembrane transport
    scope: NOT_APPLICABLE
    scope_reason: >-
      The main over-annotation hazard for this family. Despite the carrier fold and the
      Pfam Mito_carr and PROSITE SOLCAR matches, no member has a known transport substrate
      or transporter activity, and the family sits in the outer membrane, not the inner
      membrane. The sequence evidence agrees: a canonical carrier has three P-x-[DE]-x-x-[KR]
      signature motifs (three found in human SLC25A4 by the same search), whereas all 23
      MTCH2 leaves and 15 of 17 MTCH1 leaves have none, and the two MTCH1 exceptions are
      longer-than-usual gene models (horse, 431 residues; dog, 507 residues). Five arthropod
      leaves keep a single first-helix motif. Carrier or transporter terms inherited by
      fold similarity (InterPro2GO from carrier signatures, or a future PAINT pass) should
