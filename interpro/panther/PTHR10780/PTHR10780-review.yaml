family_id: PANTHER:PTHR10780
family_name: MITOCHONDRIAL CARRIER HOMOLOG
preferred_name: MTCH mitochondrial carrier homolog family (MTCH1/MTCH2; OMM protein insertases of the diverged SLC25 carrier fold)
summary: >-
  Family of mitochondrial carrier homologs (MTCH1, MTCH2 and their metazoan
  orthologs, including Drosophila Mtch), integral proteins of the mitochondrial
  outer membrane built on a diverged SLC25 solute-carrier fold. PANTHER keeps
  this family separate from the canonical metabolite-transporting mitochondrial
  carrier families, which is biologically correct: no member has demonstrated
  transport activity, and the family as a whole has been co-opted away from the
  carrier function. Human MTCH2 (and MTCH1) were established in 2022 as the
  insertases for alpha-helical mitochondrial outer membrane proteins
  (signal-anchored, tail-anchored, and multi-pass substrates; not beta-barrels),
  the metazoan functional analog of the yeast MIM complex despite no sequence
  homology to Mim1/Mim2. Secondary, likely downstream, roles include acting as
  an OMM receptor for truncated BID in apoptosis (best characterized for mouse
  Mtch2 and human MTCH1), and regulation of mitochondrial fusion, lipid
  homeostasis, and stem-cell state transitions reported in mouse Mtch2 models.
  Current PAINT curation (July-August 2026 IBDs) asserts the insertase trio
  (GO:0005741, GO:0032977, GO:0045040) at ancestral node PTN000845785 and
  positive regulation of apoptosis at PTN001324730; the cached human GOA slice
  predates those IBDs, so human MTCH2 does not yet show the insertase IBAs and
  still carries older, more generic IBAs (mitochondrion, membrane) from a prior
  PAINT iteration that the current snapshot has superseded.
functional_coherence: COHERENT
coherence_reason: >-
  All members are OMM proteins of the same diverged carrier fold; insertase
  activity is directly demonstrated for both human paralogs (MTCH2 necessary
  and sufficient; MTCH1 can substitute) and the family is uniformly
  non-transporting. The divergence is between this family and the wider
  mitochondrial-carrier superfamily, not within the family.
