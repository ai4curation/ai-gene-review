    label: LD43650P
    description: >-
      The subfamily rooted at the family root: the 20 leaves that are not below the
      vertebrate duplication, namely the single MTCH of invertebrates (arthropods,
      nematodes, annelid, sea urchin, cnidarian, placozoan), of the non-vertebrate
      chordates Ciona and amphioxus, and of the choanoflagellate Monosiga. It is the
      unduplicated remainder of the family, not a separate functional class. PANTHER's
      name is a Drosophila cDNA clone name. Drosophila Mtch is an outer membrane protein
