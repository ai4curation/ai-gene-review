family_id: PANTHER:PTHR10780
family_name: MITOCHONDRIAL CARRIER HOMOLOG
preferred_name: MTCH mitochondrial carrier homolog family (MTCH1/MTCH2/Mtch; outer membrane protein insertases of a diverged SLC25 carrier fold)
summary: >-
  Family of mitochondrial carrier homologs: vertebrate MTCH1 and MTCH2 and the single MTCH
  protein of invertebrates (Drosophila Mtch, C. elegans MTCH-1), integral proteins of the
  mitochondrial outer membrane built on a diverged SLC25 solute-carrier fold. The family is
  restricted to holozoans: the PANTHER 19 tree has 60 leaves from 34 species, rooted at the
  metazoan-choanoflagellate ancestor, and the literature reports no homolog outside
  holozoa. No member has demonstrated solute transport. Human MTCH2 is an insertase for
  alpha-helical outer membrane proteins (tail-anchored, signal-anchored and multi-pass
  proteins, not beta-barrels): it is required in cells and sufficient in proteoliposomes,
  and MTCH1 acts with it and can replace the yeast MIM complex. The cryo-EM structure of
  human MTCH2 shows five transmembrane helices, the loss of the sixth carrier helix and a
  family-specific C-terminal domain that together form a lipid-accessible hydrophilic
  groove. Insertase function is not confined to the vertebrate paralogs: Drosophila Mtch is
  required for the tail-anchored mitophagy receptor BNIP3, and MTCH homologs from frog
  and from the unicellular filasterean Capsaspora restore insertion in MTCH2-deficient
  human cells, with fly and sea anemone homologs active in the same assay. In the family alignment the acidic groove residue whose
  charge reversal abolishes insertion (Asp189 of human MTCH2) is Asp or Glu in every
  aligned leaf, and no vertebrate member retains a canonical carrier signature motif.
  Other reported roles are narrower in scope or less direct: vertebrate MTCH2 recruits
  truncated BID to mitochondria and promotes apoptosis, and mouse, zebrafish and worm
  studies link the family to lipid homeostasis, mitochondrial fusion and stem-cell fate.
  The insertase groove is also predicted to scramble lipids, which has been shown only in
  simulations for MTCH2.
functional_coherence: COHERENT
coherence_reason: >-
  One function is supported across the whole tree. Insertase activity is shown directly for
  human MTCH2 and MTCH1 (subfamilies SF20 and SF3) and genetically for Drosophila Mtch
  (SF18), and homologs from frog and a filasterean substitute for human MTCH2 in cells. The alignment agrees: the acidic groove residue aligned to MTCH2 Asp189 is Asp
  or Glu in all 58 leaves that cover the column, the lysine aligned to MTCH2 Lys25 is Lys
  or Arg in 50 of 53, and members keep at most one of the three carrier signature motifs
  (one over-long dog gene model aside). The three PANTHER subfamilies are a vertebrate
  duplication (MTCH1, MTCH2) and the unduplicated remainder, not functionally distinct
  groups. The divergence is between this family and the SLC25 transporters. What does
  differ within the family is the apoptosis role, which is supported only in vertebrates
  and is the opposite sign in the fly.
