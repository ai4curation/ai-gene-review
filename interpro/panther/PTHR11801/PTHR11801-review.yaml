notes: >-
  Tree topology, subfamily assignments and PTN positions come from the PANTHER 19 treeinfo service; the
  script and its output are in PTHR11801-bioinformatics/. PAINT records no taxon for PTN000927860 (the
  tree calls it Unikonts) or PTN000210452 (a duplication). Seed identifiers were resolved by UniProt cross-reference
  queries (MGI:103034 Stat6, 103035 Stat5b, 103036 Stat5a, 103038 Stat3, 103039 Stat2, 103062 Stat4, 103063
  Stat1; RGD:3771 Stat1, 3772 Stat3, 3773 Stat5a, 3774 Stat5b, 1309063 Stat6; ZFIN:ZDB-GENE-030820-2 stat5.1,
  ZDB-GENE-980526-68 stat3, ZDB-GENE-030131-9359 stat6). None of the in-repo STAT gene reviews has a PANTHER
  subfamily cross-reference in its cached UniProt record (only the family line is present), so the family/gene
  cross-check cannot place them in subfamilies: SUBFAMILY_ONLY assessments are reported as unresolved
  for them, and a member exception on a SUBFAMILY_ONLY term would be reported as outside scope. That is
  why C. elegans STA-1 is not carved out by a member exception on GO:0007259; it would not need one in
  any case, because its subfamily SF43 is not in that term's scope. Disagreements with gene reviews, none
  of them blocking: the Dictyostelium statA and statC reviews keep GO:0006952 as non-core, which matches
  this review's UNRESOLVED node call; they MODIFY GO:0007259 to GO:0097696, consistent with the TOO_DEEP
  call. The sta-1 and sta-2 reviews both REMOVE GO:0007259 (agreeing with the TOO_DEEP call and the proposed
  nematode IRD); sta-1 also MODIFYs GO:0006952 to negative regulation of defense response to virus and
  marks GO:0042127 as over-annotated. The STAT4 review keeps GO:0043434 as non-core, which this review
  leaves outside the confirmed scope without pruning. The Falcon deep-research report wrongly states that
  C. elegans has a single STAT gene (it has sta-1 and sta-2, plus the uncharacterised T12G3.2 in SF68)
  and does not discuss the plant STATL proteins; its main conclusion, that JAK-STAT and cytokine terms
  must not be mapped family-wide, agrees with this review. InterPro2GO maps GO:0003700 to IPR001217 (STAT),
  which reaches the plant STATL proteins as IEA; that mapping has the same plant problem as the root-level
  PAINT transcription factor IBDs. Evolutionary reviews used for the taxon arguments: Liongue and Ward
  2013 (PMID:24058787) for the eukaryote-wide roots of STAT-like proteins and the bilaterian assembly
  of the canonical pathway; Wang and Levy 2012 (PMID:24058748) for STAT gene duplications in over 20
  eukaryotic genomes, the separate Dictyostelium STAT clade and the vertebrate STAT1-6 expansion by
  whole-genome duplication; Kawata 2011 (PMID:21534947, abstract only) for the four Dictyostelium STATs.
  Caveat from Wang and Levy: they describe C. elegans F58E6.1, which is sta-2 (SF49), as so diverged
  that it "can no longer be considered a bona fide member" of the STAT family, and report that it showed
  no STAT-motif DNA binding when co-expressed with a tyrosine kinase. Later work establishes STA-2 as
  the epidermal transcriptional regulator of antimicrobial-peptide genes, so this review keeps it in
  family scope, but direct DNA binding by STA-2 remains undemonstrated. A cross-gene briefing on JAK-STAT
  taxon scope across the STAT, JAK and PIAS families and the C. elegans and Dictyostelium STAT modules
  is at https://claude.ai/artifact/4MLfbbbWWnLchDvspwdPuM.
