  assessment: UNRESOLVED
  assessment_reason: >-
    PTN000927860 is the Unikonts node (see the GO:0007259 assessment). Every seed is bilaterian, including
    C. elegans sta-2, whose epidermal antifungal and wound-induced antimicrobial-peptide role shows that
    STAT participation in defence does not depend on JAK. Within the nematode branch the sign is not uniform:
    C. elegans STA-1 represses Orsay-virus-induced genes, so for it the inherited positive term is a regulatory
    sign inversion (the sta-1 review modifies it to GO:0050687 negative regulation of defense response
    to virus); this is a member-level divergence below the node, not a reason to move it. The lowest node
    covering the seeds is Bilateria (PTN000210449), so the extension to the Dictyostelium STATs rests
    on the curator's judgement alone. No Dictyostelium STAT has been tested for a role in defence (STATc
    mediates osmotic and other stress responses, which are not defence responses), and nothing shows it
    lacks one. The Dictyostelium gene reviews keep the IBA as non-core. Left unresolved: neither a pruning
    nor a confirmation is warranted on present evidence.
