    label: Signal transducer and activator of transcription B
    gene_symbol: dstB
    organism: Dictyostelium discoideum
  diverged_from_family: true
  divergence_description: >-
    Diverged in upstream regulation and domain architecture, not in core activity. Dictyostelium STATs
    keep the coiled-coil, DNA-binding and SH2 domains and act as signal-dependent transcription factors,
    but lack the N-terminal and transactivation domains of metazoan STATs, and Dictyostelium has no JAK:
    STATs are activated through serpentine receptors and TKL kinases. The JAK-STAT term GO:0007259 does
    not apply; GO:0097696 (cell surface receptor signaling pathway via STAT) is the correct process term.
