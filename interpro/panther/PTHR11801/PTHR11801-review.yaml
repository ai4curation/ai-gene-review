  assessment: TOO_DEEP
  assessment_reason: >-
    PAINT records no taxon; the PANTHER 19 tree places PTN000927860 at the Unikonts speciation, the common
    ancestor of the Eumetazoa clade (PTN000927862) and the Dictyostelium STAT clade (PTN001370513). All
    seeds are bilaterian (fly Stat92E, mammalian, rat and zebrafish STATs), so the lowest node they support
    is Bilateria (PTN000210449); the placement is one ancestral speciation deeper than the seeds and reaches
    organisms without JAK. Dictyostelium has no orthologs of the animal tyrosine kinases; its STATs are
    activated by TKL kinases (Pyk2 for STATc) or via the cAMP receptor cAR1 (STATa). C. elegans has no
    JAK homolog and its STATs act JAK-independently. PANTHER's own JAK family (PTHR45807) has no member
    in C. elegans, C. briggsae, P. pacificus, Dictyostelium or Nematostella. The canonical pathway was
    assembled in Bilateria. GOA confirms the term reaches Dictyostelium dstD and C. elegans sta-1 and
    sta-2. Recommended fix: move the IBD to PTN000210449 (Bilateria) and place an IRD on the nematode
    STAT duplication node PTN000210629, which covers SF49, SF68 and the sta-1 clade. Affected subfamilies
    are the Dictyostelium SF65 and SF50 and the nematode SF49 and SF68; the root catch-all SF43 also holds
    affected members (Dictyostelium dstD, C. elegans sta-1, P. pacificus, Nematostella and Trichoplax
    STATs) but cannot be named as a unit because it also holds the valid Stat92E seed. For the Dictyostelium
    proteins GO:0097696 (cell surface receptor signaling pathway via STAT), the JAK-agnostic parent, is
    the correct process term. The evolutionary reviews agree with this placement: STAT-like proteins with
    coiled-coil, DNA-binding and SH2 domains were present by the divergence of the amoebozoa, and the
    four Dictyostelium STATs form a distinct clade, but the canonical receptor-JAK-STAT pathway was assembled
    only in Bilateria, before the protostome-deuterostome split (PMID:24058787, PMID:24058748; quotes on
    the GO:0007259 term assessment).
