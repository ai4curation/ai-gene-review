  assessment: SOUND
  assessment_reason: >-
    In the PANTHER 19 tree PTN000210448 is the family root (Eukaryota speciation), above both the unikont
    STATs and the Viridiplantae STAT-type linker-SH2 (STATL) clade. The seeds include Dictyostelium STATa/STATc
    (and STATb for nucleus), both C. elegans STATs, fly Stat92E and the vertebrate STATs, so the lowest
    node covering them is the unikont node and the root placement adds only the plant clade, which has
    no seed. Latent cytoplasmic STATs that move to the nucleus on activation are shown for every unikont
    lineage (Dictyostelium STATa nuclear translocation on cAR1 signalling, C. elegans STA-1, the vertebrate
    STATs). For the plant SHA/SHB proteins localisation has not been tested; a nuclear/cytoplasmic assertion
    is not contradicted by anything known, so no pruning is proposed.
