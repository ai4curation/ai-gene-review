  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN000210448 is the family root (Eukaryota). All seeds are bilaterian (fly Stat92E and mammalian STATs);
    extension to Dictyostelium is nevertheless well founded, because the four Dictyostelium STATs keep
    the STAT DNA-binding domain and STATa binds TTGA-containing promoter elements. The problem is the
    plant branch. The root also covers the Viridiplantae clade PTN004306971 (Arabidopsis SHA/STATLA and
    SHB/STATLB and their orthologs), which PANTHER files in SF43 together with Stat92E. These plant proteins
    carry the STAT-type linker-SH2 module but no STAT DNA-binding domain (no IPR008967, IPR013801, IPR012345
    or IPR037059 cross-reference, in contrast to every unikont member checked), and no plant member has
    been shown to bind DNA or regulate transcription. GOA confirms that Arabidopsis SHA and SHB receive
    this IBA. An IRD on PTN004306971 (or moving the IBD to the unikont duplication node PTN008527027)
    is recommended. No subfamily is named as affected because SF43 also holds valid members (Stat92E,
    sta-1, dstD); SHA and SHB are recorded as member exceptions on the term assessment instead.
  supported_by:
  - reference_id: PMID:15073273
    supporting_text: "Two novel genes carrying the linker-SH2 domain of STAT were discovered and subsequently cloned from Arabidopsis."
  - reference_id: PMID:24058787
