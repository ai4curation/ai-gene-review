  description: >-
    PANTHER's default subfamily, assigned at the family root (PTN000210448, Eukaryota), so it collects
    every member not placed in a more specific subfamily and is phylogenetically heterogeneous. It holds
    the arthropod STATs (Drosophila Stat92E, Anopheles, Tribolium, Daphnia, Ixodes), leech, cnidarian
    (Nematostella) and placozoan (Trichoplax) STATs, invertebrate deuterostome STATs (sea urchin, Ciona,
    amphioxus), C. elegans STA-1 and its nematode orthologs, Dictyostelium dstD, and the whole Viridiplantae
    STAT-type linker-SH2 clade (Arabidopsis SHA/SHB and orthologs, which lack a STAT DNA-binding domain).
    It is not a functional group, so no subfamily-scoped term is assigned to SF43 as a unit.
