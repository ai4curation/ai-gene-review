family_id: PANTHER:PTHR11801
family_name: SIGNAL TRANSDUCER AND ACTIVATOR OF TRANSCRIPTION
preferred_name: STAT family of SH2-domain transcription factors (vertebrate STAT1-6, invertebrate and
  Dictyostelium STATs, plant STAT-type linker-SH2 proteins)
summary: >-
  Signal transducers and activators of transcription (STATs) are latent cytoplasmic transcription factors
  that are activated by tyrosine phosphorylation, dimerize through reciprocal SH2-phosphotyrosine contacts,
  move to the nucleus and bind specific promoter elements. The family core is a DNA-binding domain with
  an immunoglobulin-like fold, a helical linker and an SH2 domain. Metazoan STATs add an N-terminal oligomerization
  domain and a C-terminal transactivation domain; Dictyostelium STATs lack both and C. elegans STA-1 lacks
  the N-terminal domain. In Bilateria with JAK kinases (vertebrates, Drosophila Stat92E/Hopscotch) STATs
  are the transcriptional arm of receptor-JAK-STAT signalling. Vertebrates have seven paralogs from whole-genome
  and later duplications, each tied to particular cytokine and hormone receptors: STAT1 and STAT2 for
  interferons (with IRF9 forming ISGF3), STAT3 for IL-6-family cytokines, leptin and growth factors, STAT4
  for IL-12, STAT5A/STAT5B for IL-2-family cytokines, growth hormone and prolactin, and STAT6 for IL-4/IL-13.
  STATs are older than JAK: the four Dictyostelium STATs are activated through serpentine receptors and
  tyrosine kinase-like kinases, and the two C. elegans STATs act without JAK in immunity and development
  (STA-2 in the epidermis via SNF-12 and p38 MAPK, STA-1 in antiviral repression via SID-3). Plants have
  STAT-type linker-SH2 proteins (Arabidopsis SHA and SHB) that lack the STAT DNA-binding domain and whose
  function is unknown.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Signal-dependent DNA-binding transcription factor activity at RNA polymerase II promoters, with nuclear-cytoplasmic
  shuttling, is shared by every lineage that keeps the STAT DNA-binding domain: vertebrates, arthropods,
  nematodes and Dictyostelium. Three boundaries matter for annotation. (1) Upstream coupling: receptor-JAK
  signalling is bilaterian and is absent from Dictyostelium (SF65, SF50, dstD in SF43) and from nematodes
  (SF49, SF68, sta-1 in SF43), so the JAK-STAT IBD on the Unikonts node PTN000927860 is too deep. (2)
  Domain loss: the Viridiplantae STATL clade (Arabidopsis SHA/SHB, in SF43) has no STAT DNA-binding domain,
  so the root-level transcription factor IBDs should not reach it; SHA and SHB are recorded as member
  exceptions. (3) Paralog specialisation: the vertebrate cytokine- and hormone-specific pathway terms
  belong to single paralog subfamilies, and one of them (growth hormone signalling) is placed above the
  STAT5/STAT6 split.
