term_assessments:
- assessed_term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  scope: FAMILY_WIDE
  scope_reason: >-
    Sequence-specific, signal-dependent DNA-binding transcription factor activity is the defining STAT
    activity and is shown for vertebrate, Drosophila, C. elegans (STA-1) and Dictyostelium STATs, all of
    which keep the STAT DNA-binding domain. The exceptions are the plant STAT-type linker-SH2 proteins,
    which lack that domain. C. elegans STA-2 (SF49) is an unresolved case rather than an exception: it
    regulates antimicrobial-peptide transcription but keeps only the DNA-binding-domain fold, and
    sequence-specific binding is undemonstrated, so its gene review marks GO:0000978 over-annotated
    and generalises this term to GO:0140110 transcription regulator activity, without asserting
    that either is wrong.
  member_exceptions:
  - member:
      id: UniProtKB:B5X561
      label: SH2 domain-containing protein A
      gene_symbol: SHA
      organism: Arabidopsis thaliana
    exception_reason: >-
      Arabidopsis SHA belongs to the Viridiplantae STAT-type linker-SH2 (STATL) clade PTN004306971, which
      PANTHER places in SF43 with Stat92E. It carries the STAT linker-SH2 module and a ConA-like/laminin-G-type
      N-terminal region but no STAT DNA-binding domain, and no plant member has been shown to bind DNA
      or regulate transcription. It receives this term only by descent from the family root PTN000210448,
      whose seeds are all bilaterian. An IRD on PTN004306971 is recommended.
    pruned_node_id: PANTHER:PTN000210448
    lost_in_clade_node_id: PANTHER:PTN004306971
    supported_by:
    - reference_id: PMID:15073273
      supporting_text: Two novel genes carrying the linker-SH2 domain of STAT were discovered and subsequently
        cloned from Arabidopsis.
    - reference_id: PMID:24058787
      supporting_text: By the time of divergence of the amoebozoa, a family of proteins can be identified
        that resemble metazoan STATs, with coiled-coil, DNA-binding and SH2 domains
