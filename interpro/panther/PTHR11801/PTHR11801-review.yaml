  label: SIGNAL TRANSDUCER AND ACTIVATOR OF TRANSCRIPTION B
  description: >-
    Nematode STA-2 orthologs (C. elegans and C. briggsae sta-2, P. pacificus), one product of the nematode
    STAT duplication PTN000210629. STA-2 is an epidermal transcription factor for antifungal and wound-induced
    antimicrobial-peptide genes, held at hemidesmosomes and regulated through the SLC6 transporter SNF-12
    and a p38 MAPK cascade.
  representative_members:
  - id: UniProtKB:Q20977
    label: Signal transducer and activator of transcription b
    gene_symbol: sta-2
    organism: Caenorhabditis elegans
    gene_review: genes/worm/sta-2/sta-2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Diverged in regulation, and possibly in how it engages DNA. STA-2 keeps the STAT DNA-binding-domain
    fold (IPR008967, IPR012345) and the SH2 region and acts as a transcriptional regulator, but it lacks
    the STAT DNA-binding-domain signatures that STA-1 carries (PF02864, IPR013801, cd14801), conserves
    none of the base-contacting residues of DNA-bound STAT1, and has no demonstrated sequence-specific
    DNA binding. It also lacks the coiled-coil domain and the C-terminal tyrosine phosphorylation motif
    that JAKs target, and C. elegans has no JAK. Receptor-JAK-STAT terms (GO:0007259 and the vertebrate
    cytokine pathways) must not be inherited here.
