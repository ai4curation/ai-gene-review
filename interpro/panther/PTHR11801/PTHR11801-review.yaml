  description: >-
    Dictyostelium STATa (dstA) and STATb (dstB) with three uncharacterised D. discoideum paralogs. PANTHER's
    subfamily name is not informative. STATa is tyrosine phosphorylated and enters the nucleus in response
    to extracellular cAMP acting through the serpentine receptor cAR1, and represses stalk genes in the
    prestalk tip; STATb has a highly aberrant SH2 domain, is constitutively nuclear and has a subtle role
    in growth.
  representative_members:
  - id: UniProtKB:O00910
    label: Signal transducer and activator of transcription A
