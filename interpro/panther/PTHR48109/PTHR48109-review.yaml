notes: >-
  Modules using this family: de_novo_pyrimidine_synthesis. The quinone_dhodh_variant uses the
  base family PTHR48109 with required_function GO:0106430. The fumarate_dhodh_variant uses
  PTHR48109:SF1 with function GO:1990663. Inconsistency for the module curators: the
  fumarate_dhodh_variant's family selector carries no required_function, so it takes in the
  class 1B NAD(+)-type PyrDB catalytic subunits that PANTHER files in SF1. That contradicts the
  module's own variant-set note that class 1B PyrDB-PyrK enzymes are not modelled. Adding
  required_function GO:1990663 to that annoton would fix it. No IRD or IKR rows for this family's
  nodes were found in the PANTHER IBD file. The S. pombe ura3 gene review is INITIALIZED with
  PENDING IBA actions. Its four IBAs (GO:0004152, GO:0005743, GO:0006207, GO:0009220) are
  consistent with this review. The family/gene cross-check flags the P. putida pyrD DRAFT review,
  which marks the generic GO:0004152, GO:0006207 and GO:0009220 IEA rows as over-annotated. It does
  so because more specific terms are retained (GO:0106430, GO:0044205), not because the terms are
  wrong, so this is redundancy rather than disagreement.
