family_id: PANTHER:PTHR48109
family_name: DIHYDROOROTATE DEHYDROGENASE (QUINONE), MITOCHONDRIAL-RELATED
preferred_name: Dihydroorotate dehydrogenase family (class 1 and class 2 DHODH)
summary: >-
  FMN-dependent dihydroorotate dehydrogenases oxidize (S)-dihydroorotate to orotate, the fourth
  step of de novo pyrimidine synthesis. The family holds both structural classes, which differ
  in electron acceptor and compartment. Class 2 enzymes (SF4) are membrane-associated and
  quinone-dependent: bacterial PyrD acts at the plasma membrane, and the animal, plant and most
  fungal enzymes (human DHODH, S. pombe ura3, Arabidopsis PYRD) are anchored in the
  mitochondrial inner membrane and pass electrons to ubiquinone. Class 1 enzymes (SF1) are
  soluble. They include class 1A fumarate-dependent enzymes, among them S. cerevisiae URA1,
  which Saccharomyces acquired from a Lactococcus-like bacterium and which lets pyrimidine
  synthesis run without respiration, and class 1B PyrDB catalytic subunits, which work with
  the PyrK electron-transfer subunit and NAD+ (for example B. subtilis PyrD).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reaction on dihydroorotate is shared by every reviewed member, so the generic
  dihydroorotate dehydrogenase activity and the pyrimidine de novo process are family-wide. The
  electron acceptor is not. SF4 is quinone-dependent and SF1 is not. SF1 is also mixed despite
  its name: of 134 reviewed SF1 entries, 93 are class 1B NAD(+)-type PyrDB catalytic subunits
  (B. subtilis, Lactococcus lactis PyrDB) and about 40 are fumarate-type class 1A enzymes
  (S. cerevisiae URA1, Lactococcus PyrDA). Mitochondrial inner-membrane location belongs to the
  eukaryotic part of SF4 only.
