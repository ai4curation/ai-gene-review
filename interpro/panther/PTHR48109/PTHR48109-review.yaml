    id: GO:0004152
    label: dihydroorotate dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The oxidation of dihydroorotate is common to all classes. The URA1 gene review would
    replace this generic IBA with the fumarate child, and the DHODH review accepts it alongside
    the quinone child. Both are consistent with a family-wide generic term.
  supported_by:
  - reference_id: PMID:1409592
    supporting_text: A divergent subcellular compartmentation of the DHOdehase of each yeast was
      shown.
- assessed_term:
    id: GO:0106430
    label: dihydroorotate dehydrogenase (quinone) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Class 2 only. This is the function of the module's quinone_dhodh_variant, which uses the base
    family id with GO:0106430 as required function. That restriction is needed because the base
    family also contains the soluble class 1 enzymes. S. pombe ura3 activity depends on an intact
    respiratory chain, which fits a quinone acceptor.
