family_id: PANTHER:PTHR30589
family_name: PROLIPOPROTEIN DIACYLGLYCERYL TRANSFERASE
preferred_name: Lgt prolipoprotein diacylglyceryl transferase family
summary: Lgt enzymes transfer a diacylglyceryl group from phosphatidylglycerol to the lipobox cysteine
  of prolipoproteins in the cytoplasmic membrane. This initiates bacterial lipoprotein lipidation in both
  monoderm and diderm lineages. The reviewed inventory is assigned to SF0. Conserved reaction chemistry
  does not imply universal essentiality, identical substrate preferences, or interchangeable rescue of
  an E. coli depletion strain; substrate abundance, enzyme expression and membrane context influence complementation.
functional_coherence: COHERENT
coherence_reason: The Lgt reaction and membrane topology are supported by structural, biochemical and
  genetic evidence. Cached tree PTN000778741 contains all 39 resolved leaves, including E. coli P60955
  and Bacillus O34752; no loss assertion is present in the frozen PAINT slice. KT2440 Q88CN8 is an official
  inventory member but is absent from this limited tree cache. The conserved chemistry supports the family-level
  scope; heterologous rescue differences in PMID42126242 do not establish catalytic losses.
