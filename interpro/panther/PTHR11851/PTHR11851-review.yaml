notes: >-
  Reviewed for the PQQ biosynthesis module, whose two-component protease route uses
  the AM1 PqqF (SF49) and PqqG (SF224) proteins as ORTHOLOG_OF participants rather
  than a family term, because no PANTHER subfamily corresponds to the PQQ protease.
  Node assessments cover the two eukaryotic nodes closest to the bacterial members;
  the remaining PAINT rows concern mitochondrial and respiratory-complex biology of
  eukaryotic clades and were not assessed here.
