  clade, with lineage-specific variation reflected by IBD assertions distributed across 6 PTN nodes (PANTHER:PTN000220169,
  PANTHER:PTN000220240, PANTHER:PTN001373471, PANTHER:PTN001724261 (+2 more)); negated IRD/IKR loss assertion(s)
  on GO:0017087, GO:0070585; member-specific pruning exception(s) on GO:0017087.
