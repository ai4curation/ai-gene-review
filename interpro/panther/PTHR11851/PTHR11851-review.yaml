family_id: PANTHER:PTHR11851
family_name: METALLOPROTEASE
preferred_name: M16B processing-peptidase family (MPP, cytochrome bc1 core proteins and bacterial two-component proteases)
summary: >-
  PTHR11851 is the M16B family of zinc processing peptidases, which typically work
  as heterodimers of a catalytic subunit carrying the HxxEH zinc site and a
  partner subunit that has lost it. In eukaryotes it contains the mitochondrial
  processing peptidase (catalytic beta subunit PMPCB/MAS1, non-catalytic alpha
  subunit PMPCA/MAS2), which removes presequences from imported proteins, and the
  related core subunits 1 and 2 of cytochrome bc1 complex. In bacteria it contains
  zinc proteases such as E. coli PqqL and Mycobacterium and Streptomyces paralogs,
  non-peptidase homologs (Helicobacter YmxG, Bacillus YmfF), and the PqqF/PqqG
  pair of M. extorquens AM1, a heterodimeric protease that rapidly cleaves the PQQ
  precursor peptide PqqA. AM1 PqqF (zinc-bearing) falls in SF49, named after MPP
  alpha, and PqqG (zinc-free partner) in SF224 (PROCESSING PROTEASE); neither
  subfamily name describes the PQQ role.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares the M16 fold and heterodimeric logic, but members include
  catalytic peptidases, non-catalytic partner subunits, respiratory-complex core
  proteins without peptidase activity, and pathway-specific bacterial proteases.
