term_assessments:
- assessed_term:
    id: GO:0004222
    label: metalloendopeptidase activity
  scope: UNRESOLVED
  scope_reason: >-
    Held by subunits that keep the HxxEH zinc site (MPP beta, AM1 PqqF) or by
    heterodimers containing one; zinc-free partners (MPP alpha, PqqG) only
    contribute, and bc1 core proteins and YmxG/YmfF-type homologs lack it.
  supported_by:
  - reference_id: file:METEA/pqqF/pqqF-uniprot.txt
    supporting_text: /ligand="Zn(2+)"
  - reference_id: PMID:31427437
    supporting_text: we demonstrated the formation of a complex PqqF/PqqG, with a KD of 300 nm
- assessed_term:
    id: GO:0018189
    label: pyrroloquinoline quinone biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Shown only for the AM1 PqqF/PqqG pair. Which other bacterial SF49 and SF224
    members act in PQQ biosynthesis is unknown; gene names such as PqqL do not
    establish it, and no PANTHER subfamily corresponds to the PQQ-protease clade.
  supported_by:
  - reference_id: PMID:31427437
    supporting_text: We hypothesize that PqqF/PqqG initially cleaves between the PqqE/PqqD-generated cross-linked form of PqqA, with nonspecific cellular proteases completing the release of a suitable substrate for the downstream enzyme PqqB.
