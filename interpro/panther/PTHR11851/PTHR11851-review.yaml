  more)) with 10 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering
  mitochondrial processing peptidase complex (GO:0017087, CC), metalloendopeptidase activity (GO:0004222,
  MF), protein localization to mitochondrion (GO:0070585, BP), aerobic respiration (GO:0009060, BP) and
  3 additional GO term(s).
