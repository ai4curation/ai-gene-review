- subfamily_id: PANTHER:PTHR11851:SF49
  label: MITOCHONDRIAL-PROCESSING PEPTIDASE SUBUNIT ALPHA
  description: >-
    A mixed subfamily: eukaryotic MPP alpha subunits (yeast MAS2, rat PMPCA) plus
    bacterial zinc proteases, including E. coli PqqL and the AM1 PqqF subunit of
    the PqqF/PqqG protease. The bacterial members keep the HxxEH zinc motif that
    the eukaryotic MPP alpha subunits have lost, so the subfamily joins catalytic
    and non-catalytic proteins.
