family_id: PANTHER:PTHR23429
family_name: GLUCOSE-6-PHOSPHATE 1-DEHYDROGENASE  G6PD
preferred_name: Glucose-6-phosphate dehydrogenase (G6PD/ZWF1) family
summary: >-
  NADP-dependent glucose-6-phosphate dehydrogenases catalyse the first, rate-limiting step of the
  oxidative pentose phosphate pathway (bacterial Zwf, S. cerevisiae ZWF1, S. pombe zwf1, human G6PD,
  plant cytosolic and plastid G6PDs). Hexose-6-phosphate dehydrogenase (H6PD) is an ER-lumenal paralog
  fused to 6-phosphogluconolactonase. Arabidopsis G6PD4 is inactive.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  G6PD activity holds for SF0 and the plant subfamilies (SF13, SF11, SF20); H6PD (SF7) has broad
  hexose-6-phosphate specificity. Arabidopsis G6PD4 (SF4) is inactive. The S. pombe paralogs gcd1
  (SF19) and SPAC3C7.13c (SF21) are uncharacterized.
