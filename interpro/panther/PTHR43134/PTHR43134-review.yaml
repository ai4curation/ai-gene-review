family_id: PANTHER:PTHR43134
family_name: SIGNAL RECOGNITION PARTICLE RECEPTOR SUBUNIT ALPHA
preferred_name: SRP receptor alpha/FtsY and FlhF SRP-type GTPase family
summary: >-
  PTHR43134 contains SRP-type NG-domain GTPases related to the signal
  recognition particle receptor. Its main subfamily is the SRP receptor alpha
  subunit of eukaryotes (anchored to the ER membrane through SR beta) and its
  single-subunit bacterial, archaeal and plastid homolog FtsY, which
  associates peripherally with the cytoplasmic face of the plasma membrane
  through lipid-binding helices in its acidic N-terminal A domain. The
  receptor NG module binds the homologous NG module of SRP54/Ffh (PTHR11564)
  in a GTP-dependent manner, forming a shared active site in which both
  GTPases are reciprocally activated; this captures the
  SRP-ribosome-nascent-chain complex at the membrane, hands the nascent chain
  to the Sec61/SecYEG translocon and, on GTP hydrolysis, dissociates the
  targeting complex. The family also contains the flagellar biosynthesis
  GTPase FlhF (subfamily SF3), an SRP-type GTPase of flagellated bacteria
  that is not an SRP receptor.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  GTPase activity and membrane association are shared across the family. The
  SRP-receptor function (SRP binding, SRP-dependent cotranslational
  targeting) is coherent within SF1, where it is experimentally established
  for E. coli FtsY and the eukaryotic SR alpha seeds, but the family-root
  PAINT node also propagates SRP binding and protein targeting into the FlhF
  subfamily (SF3), whose members are flagellar biosynthesis proteins.
