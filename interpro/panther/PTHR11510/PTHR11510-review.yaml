family_id: PANTHER:PTHR11510
family_name: MYO-INOSITOL-1 PHOSPHATE SYNTHASE
preferred_name: Myo-inositol-3-phosphate synthase (INO1/ISYNA1) family
summary: >-
  NAD-dependent inositol-3-phosphate synthases cyclize glucose 6-phosphate to myo-inositol 3-phosphate,
  the only de novo route to inositol. The family contains S. cerevisiae INO1 (whose expression is
  controlled by the Ino2/Ino4-Opi1 circuit), S. pombe ino1, human ISYNA1 and plant MIPS.
functional_coherence: COHERENT
coherence_reason: All members are inositol-3-phosphate synthases.
