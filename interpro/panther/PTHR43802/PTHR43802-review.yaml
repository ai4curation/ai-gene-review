family_id: PANTHER:PTHR43802
family_name: ENOYL-COA HYDRATASE
summary: Crotonase-fold proteins catalyze chemically distinct reactions on acyl-CoA and non-CoA substrates.
  This grouping includes enoyl-CoA-hydratase-related proteins and a characterized 6-oxocamphor hydrolase
  that cleaves a carbon-carbon bond. Active-site geometry and substrate recognition determine the reaction
  more precisely than the common fold.
functional_coherence: HETEROGENEOUS
coherence_reason: This crotonase-fold grouping spans annotated enoyl-CoA hydratases and experimentally
  characterized carbon-carbon bond-cleaving enzymes. The actual SF1 inventory contains Rhodococcus Q93TU6,
  whose 6-oxocamphor hydrolase catalyzes a retro-Claisen ring-opening reaction demonstrated by product
  structures and mutagenesis (PMID:15138275). SF1 membership therefore does not identify an enoyl-CoA
  hydration reaction. Fly CG5611 retains a fold-based catalytic hypothesis, but its substrate and reaction
  cannot be resolved from this heterogeneous subfamily.
