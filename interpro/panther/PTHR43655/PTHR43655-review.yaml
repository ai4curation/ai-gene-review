term_assessments:
- assessed_term:
    id: GO:0004222
    label: metalloendopeptidase activity
  scope: UNRESOLVED
  scope_reason: Protease ancestry and the retained FTSH12 motif make metalloendopeptidase activity plausible,
    but they do not demonstrate a physiological substrate. H769Y complementation establishes dispensability
    of the zinc site for import rather than absolute absence of peptidase activity. A broad catalytic
    grant is therefore unsafe, while a blanket denial would overstate the experiment.
  supported_by:
  - reference_id: PMID:30309901
    supporting_text: Furthermore, even the FtsH12 zinc binding site is dispensable for its essential function.
  - reference_id: PMID:33216923
    supporting_text: 'N-terminome analyses further demonstrated normal proteolytic maturation of

      plastid-imported proteins irrespective of FTSH12 abundance.'
- assessed_term:
    id: GO:0045037
    label: protein import into chloroplast stroma
  scope: UNRESOLVED
  scope_reason: The FTSH12-containing Ycf2-FtsHi complex has direct biochemical and structural support
    as a chloroplast import motor. This function belongs to a specialized plant complex and cannot be
    transferred to every FtsH-like protease. The full set of import-capable family branches is not asserted.
  supported_by:
  - reference_id: PMID:30309901
    supporting_text: 'a 2-MD heteromeric AAA-ATPase complex associates with the TIC complex and

      functions as the import motor'
  - reference_id: PMID:39197452
    supporting_text: 'The Ycf2-FtsHi structure reveals a

      heterohexameric AAA+ ATPase motor module with characteristic features.'
