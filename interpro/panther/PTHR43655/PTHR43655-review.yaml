family_id: PANTHER:PTHR43655
family_name: ATP-DEPENDENT PROTEASE
summary: FtsH-related proteins combine AAA-type ATPase machinery with a protease-related region and occur
  in membrane-associated protein-handling systems. The chloroplast import machinery illustrates diversification
  of these components beyond a simple assignment of protein degradation.
functional_coherence: HETEROGENEOUS
coherence_reason: FtsH-related proteins separate ATPase-driven protein handling from protease chemistry.
  FTSH12 has a retained HEXXH zinc motif, but an H769Y mutant supports normal growth and import, demonstrating
  that zinc-site catalysis is dispensable for its essential role. The selected 991-residue product retains
  the reference targeting, transmembrane and catalytic-site segments. No endogenous FTSH12 proteolytic
  substrate is established in the inspected experiments.
subfamilies:
- subfamily_id: PANTHER:PTHR43655:SF19
  label: ATP-DEPENDENT ZINC METALLOPROTEASE FTSH 12, CHLOROPLASTIC
  description: Verified sequence-classification group containing FTSH12. Functional transfer is qualified
    in the family and term assessments.
  representative_members:
