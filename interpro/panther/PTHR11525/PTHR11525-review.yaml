family_id: PANTHER:PTHR11525
family_name: FARNESYL-PYROPHOSPHATE SYNTHETASE
preferred_name: Farnesyl diphosphate synthase (ERG20/FDPS) family
summary: >-
  Farnesyl diphosphate synthases condense IPP with DMAPP and then geranyl diphosphate to make (2E,6E)-farnesyl
  diphosphate, the branch point for sterols, ubiquinone side chains and prenylation. The family contains
  S. cerevisiae ERG20, S. pombe fps1, human FDPS and plant FPS. It also contains S. pombe spo9, an
  inactive FPS-like protein that partners with the GGPS to make geranylgeranyl diphosphate for sporulation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  FPP synthase activity holds for SF0 except S. pombe spo9, which sits in SF0 but is a non-catalytic
  GGPS partner.
