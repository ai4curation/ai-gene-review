  assessment_reason: >-
    FPP biosynthesis is sound for the new CANAL/ASPFU/NEUCR canonical FPPS members and reaches spo9
    for the same reason as the FPPS activity; the spo9 review marks it over-annotated, but no
    below-node spo9 target PTN is available in PTHR11525-entries.csv, so no ADD_IRD action is
    asserted here.
    In the PANTHER 19.0 tree the term sits on the family root at Eukaryota with seeds in both
    branches below it, and S. pombe spo9 (PomBase:SPBC36.06c; SF0, 8 steps below the root) is itself
    one of those seeds, which it is not for the FPPS activity on the same node. The term reaches
