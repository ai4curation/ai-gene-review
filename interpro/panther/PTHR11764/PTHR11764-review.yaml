family_id: PANTHER:PTHR11764
family_name: TERPENE CYCLASE/MUTASE FAMILY MEMBER
preferred_name: Oxidosqualene cyclase / terpene cyclase-mutase family
summary: >-
  Triterpene cyclases that fold and cyclize 2,3-oxidosqualene (or squalene) into polycyclic scaffolds.
  Lanosterol synthase (S. cerevisiae ERG7, S. pombe erg7, human LSS) makes the first sterol. Plant
  subfamilies make beta-amyrin, lupeol, arabidiol and other triterpenes, and fungal members make
  meroterpenoid scaffolds. Schizosaccharomyces japonicus has a horizontally acquired squalene-hopene
  cyclase in the lanosterol synthase subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The cyclization product is subfamily-specific (lanosterol in SF20; amyrins, lupeol and arabidiol
  in plant subfamilies).
