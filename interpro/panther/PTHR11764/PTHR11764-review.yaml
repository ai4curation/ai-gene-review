  description: Lanosterol synthases (ERG7, erg7, LSS) and S. japonicus shc1.
  representative_members:
  - id: UniProtKB:P38604
    gene_symbol: ERG7
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/ERG7/ERG7-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11764:SF58
  label: BETA-AMYRIN SYNTHASE-RELATED
  description: Plant beta-amyrin synthase-related.
  diverged_from_family: true
  divergence_description: Make pentacyclic triterpenes rather than lanosterol.
- subfamily_id: PANTHER:PTHR11764:SF76
  label: TERPENE CYCLASE_MUTASE FAMILY MEMBER
  description: A sparse fungal branch that contains A. fumigatus erg7A plus atnI/ntnI
    terpene cyclase-mutases from meroterpenoid clusters; no subfamily-wide lanosterol
    synthase scope is asserted.
  representative_members:
  - id: UniProtKB:Q4WES9
    gene_symbol: erg7A
    organism: Aspergillus fumigatus
    gene_review: genes/ASPFU/erg7A/erg7A-ai-review.yaml
  diverged_from_family: true
  divergence_description: Other SF76 members are annotated terpene cyclase-mutases from fungal
    meroterpenoid clusters, so erg7A is kept as a member-level lanosterol synthase
    rather than evidence that the whole subfamily has GO:0000250.
