family_id: PANTHER:PTHR11764
family_name: TERPENE CYCLASE/MUTASE FAMILY MEMBER
preferred_name: Oxidosqualene cyclase / terpene cyclase-mutase family
summary: >-
  Triterpene cyclases that fold and cyclize 2,3-oxidosqualene or squalene into polycyclic scaffolds.
  True lanosterol synthases include S. cerevisiae ERG7, S. pombe erg7, human LSS, Candida ERG7 and
  the A. fumigatus erg7B paralog; other branches make beta-amyrin, lupeol, arabidiol, hopanoids
  or protostadienol for fungal meroterpenoids and fusidanes, while A. fumigatus erg7A is retained
  only as a member-level lanosterol synthase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The cyclization product is subfamily- and branch-specific: SF20 includes lanosterol synthases but
  also the HelA protostadienol synthase leaf, SF76 mixes erg7A with meroterpenoid-cluster cyclases,
  S. japonicus shc1 makes hopanoids, and plant subfamilies make amyrins, lupeol and arabidiol rather
  than lanosterol.
