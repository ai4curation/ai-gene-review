  assessment: UNRESOLVED
  assessment_reason: >-
    The seeds (bacterial, archaeal, plant and human PPCDC/CoaBC) support placing the activity at
    the PPCDC root. The lantibiotic decarboxylases EpiD and MrsD do not receive it in the PAINT
    UniProt GAF, so they sit outside the node. Two descendants need comment. First, the
    S. cerevisiae Cab3, Sis2 and Vhs3 subunits get FMN binding, complex and process terms from
    this node but no enables row for GO:0004633. That is the right outcome, because each
    contributes to a heterotrimeric active site, and their experimental rows use contributes_to.
    Second, M. jannaschii MJ0730 (SF19) does inherit the activity. MJ0730 is an InterPro AfpA
    archaeoflavoprotein with no reported activity, and M. jannaschii already has a seeded CoaBC
    (Q58323). This looks like paralog over-propagation, but no experiment shows loss, so it is
    left unresolved rather than marked for pruning.
