family_id: PANTHER:PTHR14359
family_name: HOMO-OLIGOMERIC FLAVIN CONTAINING CYS DECARBOXYLASE FAMILY
preferred_name: HFCD flavoprotein family (phosphopantothenoylcysteine decarboxylase and relatives)
summary: >-
  The homo-oligomeric flavin-containing Cys decarboxylase (HFCD) family are FMN flavoproteins.
  They oxidize a cysteine thiol to a thioaldehyde so that the adjacent carboxylate can be
  decarboxylated, and their active sites lie at the subunit interfaces of a trimer (or larger
  oligomer). The main function is phosphopantothenoylcysteine decarboxylase (PPCDC/CoaC,
  EC 4.1.1.36), the third step of coenzyme A synthesis. It is carried by standalone eukaryotic
  enzymes (human PPCDC, Arabidopsis HAL3A/HAL3B) and by the N-terminal CoaC domain of bacterial
  and archaeal CoaBC. PANTHER subfamily SF6 also contains lantibiotic peptidyl-cysteine
  decarboxylases (S. epidermidis EpiD, Bacillus MrsD), which decarboxylate the C-terminal
  cysteine of a peptide rather than phosphopantothenoylcysteine. In hemiascomycete yeasts the
  PPCDC is an obligate heterotrimer. Cab3 (SF6) supplies the catalytic Cys, and Sis2/Hal3 or
  Vhs3 (SF17) supply the catalytic His; neither homotrimer is active. Sis2 and Vhs3 have a
  second, unrelated role as inhibitors of the Ppz1 protein phosphatase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The FMN-dependent cysteine-decarboxylase chemistry and the trimeric architecture are shared
  across the family. The substrate and the self-sufficiency of each subunit are not. (1) SF6
  contains the lantibiotic decarboxylases EpiD and MrsD alongside PPCDC/CoaBC. (2) In budding
  yeast the PPCDC active site needs both a Cab3 subunit and a Sis2/Vhs3 subunit, so each subunit
  contributes to the activity rather than having it. (3) Small archaeal flavoproteins such as
  M. jannaschii MJ0730 (SF19, InterPro archaeoflavoprotein AfpA) inherit PPCDC by IBA with no
  supporting evidence, while the same organism also has its own CoaBC.
